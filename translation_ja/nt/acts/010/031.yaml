  source_fidelity: 原文の「コルネリウス、あなたの祈りは聞かれ、あなたの施しは神の御前で覚えられた」という二つの受動表現と語順上の並列を、自然な日本語で忠実に反映している。「聞き入れられ」はεἰσηκούσθηの、祈りが受け止められたという意味を適切に表す。「神の御前で覚えられています」はἐνώπιον τοῦ θεοῦおよびἐμνήσθησανの聖書的な比喩を保ち、救いの功績などを付加していない。
