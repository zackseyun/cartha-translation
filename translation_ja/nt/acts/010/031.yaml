id: ACT.10.31
reference: Acts 10:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φησί· Κορνήλιε, εἰσηκούσθη σου ἡ προσευχὴ καὶ αἱ ἐλεημοσύναι σου ἐμνήσθησαν ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/031.yaml
  text: And he said[a], ‘Cornelius, your prayer has been heard, and your alms have been remembered before God.’
translation:
  language: ja
  text: すると、その人は言いました。「コルネリウス、あなたの祈りは聞き入れられ、あなたの施し[a]は神の御前で覚えられています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「慈善の行い」「慈善の贈り物」。ギリシア語は、困っている人への憐れみに基づく援助や贈与を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: φησί
  choice: 言いました
  rationale: ギリシア語は物語上の歴史的現在だが、現代日本語の自然な叙述に合わせて過去形とした。
- source_word: Κορνήλιε
  choice: コルネリウス
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: εἰσηκούσθη
  choice: 聞き入れられ
  rationale: 単に音として聞かれたのではなく、祈りが受け止められたことを表す受動形の意味を自然な日本語で示した。
- source_word: ἡ προσευχὴ
  choice: あなたの祈り
  rationale: 単数形を保ち、προσευχήの標準的な訳語を用いた。
- source_word: αἱ ἐλεημοσύναι
  choice: あなたの施し
  rationale: 困窮者への憐れみに基づく金品や援助行為を指す語として、簡潔で聖書文体にも適した「施し」を採用した。意味の幅は脚注で補った。
- source_word: ἐμνήσθησαν
  choice: 覚えられています
  rationale: 神的受動の可能性を解消せず、「覚える」という聖書的な表現を保持しつつ、現在にも関わる結果を自然に伝えた。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の御前で
  rationale: 神の臨在と顧みを表す定型的かつ品位ある日本語で、原文の前置詞句を保った。
theological_decisions:
- issue: コルネリウスの慈善行為の意味
  choice: 「施し」と訳し、具体的な憐れみの行為を表した。
  alternative: 慈善の行い／慈善の贈り物
  rationale: 本文はその行為が神の御前で覚えられたと述べるが、功績による救いなどの仕組みまでは説明していないため、教理的な結論を訳文に加えなかった。
- issue: 神による記憶の表現
  choice: 「神の御前で覚えられています」として記憶の比喩を保持した。
  alternative: 神が心に留めておられます／神に認められました
  rationale: ἐμνήσθησανの受動表現と聖書的な「覚える」の重みを残し、主体や神学的機序を過度に明示しないため。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「神の御前」「覚えられています」により聖書本文としての品位と原文の神学的含意を保った。
