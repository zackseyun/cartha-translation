    reason: lexical_alternative
lexical_decisions:
- source_word: συνομιλῶν
  choice: 話しながら
  rationale: 現在分詞が、入る動作と同時に続いていた会話を表すため。自然な現代日本語で継続性を保った。
- source_word: αὐτῷ
  choice: 彼と
  rationale: συνομιλέωに伴う与格は会話の相手を示す。「彼と」が相互的な会話を自然に表す。
- source_word: εἰσῆλθεν
  choice: 中に入ると
  rationale: アオリストの主要動詞による場面の進展を表す。日本語では後続の発見とのつながりを「入ると」で自然に示した。
- source_word: εὑρίσκει
  choice: 見た
  rationale: ギリシア語は臨場感を添える歴史的現在だが、日本語の物語として自然になるよう過去形で訳した。「集まっているのを見た」は、そこにいる人々を認めたという文脈上の意味を明瞭にする。
- source_word: συνεληλυθότας
  choice: 集まっている
  rationale: 完了分詞が、すでに集まり、その状態にあることを表すため。結果状態を自然な日本語で示した。
- source_word: πολλούς
  choice: 大勢の人
  rationale: 実体詞的に用いられ、人々を指す。「大勢の人」として日本語で明示した。
