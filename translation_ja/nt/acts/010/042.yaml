id: ACT.10.42
reference: Acts 10:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ παρήγγειλεν ἡμῖν κηρύξαι τῷ λαῷ καὶ διαμαρτύρασθαι ὅτι ⸀οὗτός ἐστιν ὁ ὡρισμένος ὑπὸ τοῦ θεοῦ κριτὴς ζώντων καὶ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/042.yaml
  text: And he commanded us to proclaim to the people and to testify solemnly that this is the one appointed by God as judge of the living and the dead[a].
translation:
  language: ja
  text: そしてイエスは、民に宣べ伝え、厳粛に証言するよう私たちに命じられました。この方こそ、神が生きている者と死んだ者との裁き主として定められた方です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神が、生きている者と死んだ者との裁き主に任命された方です。」
    reason: ὁ ὡρισμένοςは「定められた」のほか、「任命された」とも訳せるため。
lexical_decisions:
- source_word: παρήγγειλεν
  choice: 命じられました
  rationale: 権威をもって指示する動詞の強さを保ちつつ、文脈上の主語であるイエスへの敬意を自然な日本語で表した。
- source_word: κηρύξαι
  choice: 宣べ伝え
  rationale: 公に告げ知らせるというκηρύσσωの布告的な意味を表し、現代日本語の聖書文体としても理解しやすい。
- source_word: τῷ λαῷ
  choice: 民に
  rationale: 文脈上はユダヤの民を指すが、原文はイスラエルと明示していないため、限定を補わず「民」とした。
- source_word: διαμαρτύρασθαι
  choice: 厳かに証言する
  rationale: 単なる証言以上に、強く厳粛に証しするという語の力を保った。
- source_word: οὗτός
  choice: この方こそ
  rationale: イエスを強く指し示す指示代名詞の強調を、自然で敬意ある日本語にした。
- source_word: ὁ ὡρισμένος
  choice: 定められた方
  rationale: 神による指定・任命と、その効力が続くことを簡潔に表す。「任命された」も可能だが、裁き主として神が定めたという表現が日本語ではより自然である。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 神によって
  rationale: 受動表現の行為者を原文どおり明示した。
- source_word: κριτὴς
  choice: 裁き主
  rationale: 司法的に裁く者という意味を保ちつつ、終末的な裁きについての厳かな文脈に適した日本語とした。
- source_word: ζώντων καὶ νεκρῶν
  choice: 生きている者と死んだ者
  rationale: 対句をそのまま保ち、裁きの及ぶ普遍的範囲を明確に表した。
theological_decisions:
- issue: イエスが神によって裁き主に定められたこと
  choice: 神によって、生きている者と死んだ者との裁き主に定められた方
  alternative: 神によって、生きている者と死んだ者との裁き主に任命された方
  rationale: 神がイエスを普遍的な裁き主として定めたという本文の主張を保ち、後代の教理的説明を付加しない。「定められた」はὁρίζωの指定・任命の双方の含みを自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的宣言の厳粛さを保った。「イエス」は直前の文脈から補い、敬語は日本語として自然な範囲にとどめた。
