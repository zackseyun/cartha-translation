  text: ἀλλ’ ἐν παντὶ ἔθνει ὁ φοβούμενος αὐτὸν καὶ ἐργαζόμενος δικαιοσύνην δεκτὸς αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/035.yaml
  text: but in every nation the one who fears him and does what is righteous is acceptable to him[a][b][c].
translation:
  language: ja
  text: しかし、どの民族でも、神を恐れ、正しいことを行う人は、神に受け入れられるのです[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「義を行う」。または「正義を実践する」。
    reason: lexical_alternative
  - marker: b
    text: 「神に受け入れられる」は、「神に喜ばれる」または「神に歓迎される」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’
  choice: むしろ
  rationale: 直前の「神は人を分け隔てなさらない」という否定を受け、その内容を肯定的に対比して述べる接続として自然である。
- source_word: ἐν παντὶ ἔθνει
  choice: どの民族でも
  rationale: παντίの包括的・分配的な意味と、ἔθνοςがここで示す民族・民の広がりを、現代国家に限定せず表す。
- source_word: ὁ φοβούμενος αὐτὸν
  choice: 神を恐れ…人
  rationale: 実質的に名詞として働く現在分詞を、性別を限定しない自然な日本語で表した。「恐れる」は神への畏敬を含む聖書的表現を保つ。代名詞の指示対象は文脈上神なので、日本語では「神」と明示した。
- source_word: καὶ ἐργαζόμενος δικαιοσύνην
  choice: 正しいことを行う
  rationale: ἐργάζομαιとδικαιοσύνηの結びつきが示す実践的な行為を、明瞭で自然な現代日本語にした。
- source_word: δικαιοσύνην
  choice: 正しいこと
  rationale: ここでは抽象概念だけでなく実際の行いを指すため、「正義」や「義」だけに狭めず、句全体として自然に表した。
- source_word: δεκτὸς αὐτῷ ἐστιν
  choice: 神に受け入れられるのです
  rationale: δεκτόςの「受け入れられる、好意をもって迎えられる」という意味を保つ。「受け入れられる」は原文の受動的含意も自然に伝え、功績によって受容を獲得するという意味を加えない。
theological_decisions:
- issue: 神を恐れて正しいことを行うことと、神に受け入れられることとの関係
  choice: 原文どおり両者の関係を述べ、民族による分け隔てがないという文脈を保つ。
  alternative: 行いによって救いを獲得する、または行いは救いの証拠にすぎない、と説明的に訳す。
  rationale: 本文自体はδεκτόςであると述べるが、救済論上の仕組みを説明してはいないため、いずれの教理的解釈も訳文に付加せず、緊張を残す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「神を恐れる」という聖書的で荘重な表現を保持した。「民族」はἔθνοςを現代の国民国家に限定せず表す。文末の「のです」は、直前の認識を説明するペトロの発言の流れを自然に示す。
