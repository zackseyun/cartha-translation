  text: ὑμεῖς οἴδατε τὸ γενόμενον ῥῆμα καθ’ ὅλης τῆς Ἰουδαίας, ⸀ἀρξάμενος ἀπὸ τῆς Γαλιλαίας μετὰ τὸ βάπτισμα ὃ ἐκήρυξεν Ἰωάννης,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/037.yaml
  text: You yourselves know the thing that happened throughout all Judea[a], beginning from Galilee after the baptism that John proclaimed[b],
translation:
  language: ja
  text: あなたがた自身、ヨハネが宣べ伝えたバプテスマの後に、ガリラヤから始まり[b]、ユダヤ全土で起こった出来事[a]をご存じです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「出来事」は、「言葉」または「知らせ」とも訳せます。ギリシア語のῥῆμαには「言葉・知らせ・事柄」の意味があります。
    reason: lexical_alternative
  - marker: b
    text: 「始まり」に当たるギリシア語の分詞は男性形で、先行する中性名詞と形が一致しないため、統語上やや不規則です。しかし、ここで述べられている事柄の起点がガリラヤであることを示しています。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ὑμεῖς οἴδατε
  choice: あなたがた自身…ご存じです
  rationale: 明示された代名詞ὑμεῖςの強調を「自身」で保ち、現在の認識を表すοἴδατεを自然で敬意ある日本語にした。
- source_word: τὸ γενόμενον ῥῆμα
  choice: 起こった出来事
  rationale: ῥῆμαには「言葉・知らせ・事柄」の幅があるが、γενόμενονおよび地理的・時間的展開との組み合わせから、公に知られた一連の出来事を前景化した。語義の幅は脚注に残した。
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: ユダヤ全土で
  rationale: κατά＋属格が示す地域全体への広がりとὅληςの包括性を簡潔に表した。
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας
  choice: ガリラヤから始まり
  rationale: ἀπόの起点を「から」で保持した。分詞の統語上の不規則さは、内容を補わず自然な連用表現とした。
- source_word: μετὰ τὸ βάπτισμα
  choice: バプテスマの後
  rationale: μετά＋対格の時間的意味をそのまま表した。「バプテスマ」は現代日本語の聖書用語として定着し、特定の施行様式を訳文で断定しない。
- source_word: ὃ ἐκήρυξεν Ἰωάννης
  choice: ヨハネが宣べ伝えた
  rationale: κηρύσσωの公的な告知・宣言の力を、説教壇に限定しない慣用的な聖書日本語で表した。
theological_decisions:
- issue: ペトロの要約におけるῥῆμαの意味
  choice: 本文では「出来事」とした
  alternative: 「言葉」「知らせ」「事柄」
  rationale: 文脈は、ガリラヤに始まりユダヤ全土に及んだイエスに関する公的な経緯を指す。ただし「知らせ」という伝達面も原語に含み得るため、脚注で明示した。
- issue: ἀρξάμενοςの統語的な係り先
  choice: 「出来事」がガリラヤから始まったという自然な日本語にした
  alternative: 暗黙の主語を補って「それは始まった」とする、または男性形分詞を別の人物に結びつける
  rationale: 男性形分詞と中性名詞ῥῆμαの一致は統語上ぎこちないが、ガリラヤを起点とする意味は明白である。人物を新たに主語として補わず、曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「あなたがた自身」で原文の強調を保持した。「ご存じです」はペトロが聞き手に向ける発話として自然な敬語。「宣べ伝えた」は定着した聖書語だが現代の読者にも理解可能。脚注記号は関係箇所に近づけるため、文末に連続させず本文中へ配置する余地もあるが、本稿では文全体に関わる語義・統語注として文末に置いた。
