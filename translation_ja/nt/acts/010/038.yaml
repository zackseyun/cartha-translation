id: ACT.10.38
reference: Acts 10:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/038.yaml
  text: 'Jesus of Nazareth: how God anointed him with the Holy Spirit and with power[a]; he went about doing good and healing all who were oppressed by the devil[c][b], because God was with him.'
translation:
  language: ja
  text: ナザレ出身のイエスについて言えば、神はこの方に聖霊と力をもって油を注がれました。この方は各地を巡り、善を行い、悪魔に虐げられていた人々を皆癒やされました。神がこの方と共におられたからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν ἀπὸ Ναζαρέθ
  choice: ナザレ出身のイエス
  rationale: ἀπόが示す出身地を明確にしつつ、現代日本語として自然な表現にした。慣用的な「ナザレのイエス」より原文の意味関係が明瞭である。
- source_word: ὡς
  choice: ～すると
  rationale: 前節から続く圧縮された構文を日本語で読みやすく展開し、イエスについての出来事の経緯を導く働きを表した。厳密な時点だけでなく、油注ぎを受けた後の働きへのつながりを示す。
- source_word: ἔχρισεν
  choice: 油を注がれる
  rationale: χρίωの比喩を保持し、メシア的含意を残しながら、「任命した」「力を授けた」などの解釈的な言い換えを避けた。
- source_word: πνεύματι ἁγίῳ καὶ δυνάμει
  choice: 聖霊と力をもって
  rationale: 二つの与格の手段的な意味を「～をもって」で表し、聖霊と力を同一視せず並列のまま保持した。
- source_word: διῆλθεν
  choice: 各地を巡って
  rationale: 各所を移動しながら活動したことを、自然で明瞭な日本語で表した。
- source_word: εὐεργετῶν
  choice: 善を行い
  rationale: 他者に益を与える幅広い行為を簡潔に表し、内容を慈善や奇跡だけに限定しなかった。
- source_word: ἰώμενος
  choice: 癒やされました
  rationale: 身体的・霊的苦しみからの回復を含み得る語を、聖書本文にふさわしい自然な表現で訳した。
- source_word: πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου
  choice: 悪魔に虐げられていた人々を皆
  rationale: 継続的に厳しい支配下に置かれていた状態と、その主体が悪魔であることを明示した。
- source_word: ὅτι ὁ θεὸς ἦν μετ’ αὐτοῦ
  choice: 神がこの方と共におられたからです
  rationale: ὅτιの因果関係を明確にし、イエスの働きの根拠として神の臨在を原文どおり述べた。
theological_decisions:
- issue: イエスへの油注ぎとその使命の関係
  choice: 「油を注ぐ」という表現をそのまま保持する
  alternative: 「メシアに任命する」または単に「力を授ける」と説明的に訳す
  rationale: 原文のメシア的響きを保ちながら、この節に明記されていない教理的説明を本文へ持ち込まないため。
- issue: 「聖霊」の指示対象
  choice: 人格的な神の聖霊を指す「聖霊」と訳す
  alternative: 非人格的な「聖なる霊」または霊的な力とする
  rationale: 使徒言行録での用法と、「聖霊」と「力」が区別して並べられていることを尊重した。
- issue: 「神がこの方と共におられた」の因果的機能
  choice: イエスの善行と癒やしの根拠を示す理由節として訳す
  alternative: 単なる付随的な同伴の記述として弱める
  rationale: ὅτιの因果性を保つ一方、この一節だけからキリスト論上の結論を過度に補わないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。敬意を示す「この方」と尊敬語を用いるが、過度に古風な語法は避けた。前節から続くギリシア語の断片的構文は、単独でも理解できる複数の文に整えた。
