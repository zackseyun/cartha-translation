    rationale: ὡςはここで、前節から続くペテロの報告内容として、神がイエスにどのように油を注がれたかを導く。時間的な「…した時／すると」ではなく、叙述的に「神は…油を注がれました」と表すのが安全である。
  revised_text: ナザレ出身のイエスについて言えば、神はこの方に聖霊と力をもって油を注がれました。この方は各地を巡り、善を行い、悪魔に虐げられていた人々を皆癒やされました。神がこの方と共におられたからです。
