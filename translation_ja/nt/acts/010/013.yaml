  text: καὶ ἐγένετο φωνὴ πρὸς αὐτόν· Ἀναστάς, Πέτρε, θῦσον καὶ φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/013.yaml
  text: 'And a voice came to him: “Get up[a], Peter; kill and eat.”'
translation:
  language: ja
  text: すると、彼に声がした。「立ちなさい、ペトロ。殺して[a]食べなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いけにえとして献げて」。この動詞は、食用に動物を「屠る」という意味にも、いけにえとして「献げる」という意味にもなりうる。ここでは、幻の中で動物を食べるよう命じているため、「殺して」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: した
  rationale: φωνήを主語として声が生じ、聞こえた出来事を表す語法。「声がした」は現代日本語で自然にその出来事性を伝える。
- source_word: φωνὴ
  choice: 声
  rationale: この啓示的な文脈では、単なる物音ではなく、言葉を語る声を指す。
- source_word: πρὸς αὐτόν
  choice: 彼に
  rationale: 発話の向けられた相手を示す。日本語では「彼に声がした」と簡潔に表現できる。
- source_word: Ἀναστάς
  choice: 立ちなさい
  rationale: 後続の命令と連続する命令的な分詞。文脈に即した明瞭で自然な命令表現とした。
- source_word: Πέτρε
  choice: ペトロ
  rationale: Πέτροςの呼格。日本語聖書で広く通用する音写「ペトロ」を用いた。
- source_word: θῦσον
  choice: 殺して
  rationale: 動物を食べるために殺すという幻の直接的文脈を、普通の現代日本語で表す。「いけにえとして献げる」という語義の可能性は脚注に残した。
- source_word: φάγε
  choice: 食べなさい
  rationale: 直接命令を、明瞭で自然かつ節度ある現代日本語で表した。
- source_word: καὶ
  choice: すると／して
  rationale: 冒頭では物語の進行を「すると」で示し、二つの動作の連続は「殺して食べなさい」と自然に結んだ。
theological_decisions:
- issue: θῦσονを祭儀的な語で訳すか
  choice: 本文では「殺して」
  alternative: 「いけにえとして献げて」または「屠って」
  rationale: 直近の文脈は動物を食べるための処理であり、祭儀を行うよう命じる場面とは明示されていない。一方、原語には「いけにえとして献げる」という語義もあるため、その含みを脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。命令は「立て」「食べよ」のような古風で強い形を避け、「立ちなさい」「食べなさい」とした。本文の自然さを優先しつつ、θῦσονの祭儀的な語義は脚注で明示した。
