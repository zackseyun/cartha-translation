    rationale: 叙述の主語である神の行為に用いると、話し手・受益者への恩恵を表す敬語として響き、原文の簡潔な神の行為の叙述を不自然にする。
  - severity: low
    issue: 「目に見える姿で」の具体化
    rationale: ἐμφανῆは『見える、明らかな』であり、「姿」は原文にない。可視的に現れることを直接表す方が忠実で自然である。
  - severity: low
