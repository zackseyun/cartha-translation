  text: τοῦτον ὁ θεὸς ἤγειρεν ⸀τῇ τρίτῃ ἡμέρᾳ καὶ ἔδωκεν αὐτὸν ἐμφανῆ γενέσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/040.yaml
  text: God raised this one on the third day and granted him to become visible[b][a],
translation:
  language: ja
  text: 神はこの方[a]を三日目によみがえらせ、人々の前に現れるようにされました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この人」または「彼」とも訳せる。ギリシア語ではこの指示語が文頭に置かれ、強調されている。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼が見えるものとなることを与えられた」。また「彼を現れさせた」「彼を明らかに示した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτον
  choice: この方
  rationale: 文頭に置かれた指示代名詞の強調を保ち、直前に言及されたイエスを指すことが自然に伝わる敬意ある現代日本語とした。
- source_word: ὁ θεὸς
  choice: 神は
  rationale: 定冠詞付き主格を文の主語として素直に訳した。
- source_word: ἤγειρεν
  choice: よみがえらせ
  rationale: 復活の文脈におけるἐγείρωの他動詞的意味と、神が行為者であることを明確に保つ。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 三日目に
  rationale: 時を表す与格を、日数の数え方を余分に限定せず自然な日本語で表した。
- source_word: ἔδωκεν
  choice: してくださいました
  rationale: 不定詞を伴うδίδωμιの『そうなることを与える／許す』という働きを、過度に直訳調にせず、神の授与的な行為を残して表現した。
- source_word: αὐτὸν
  choice: （この方が）
  rationale: 日本語では後半の目的語兼不定詞の意味上の主語を明示的に繰り返さず、同一人物を主語として自然に継続させた。
- source_word: ἐμφανῆ
  choice: 目に見える姿で
  rationale: 『見える、明らかな、顕現した』という語義を、復活後に知覚可能な仕方で現れたこととして明瞭に表す。
- source_word: γενέσθαι
  choice: 現れるように
  rationale: 『見えるものとなる』という変化・出現のニュアンスを、日本語として自然な『現れる』で表した。
theological_decisions:
- issue: 復活における神の行為
  choice: 神はこの方を三日目によみがえらせ
  alternative: 神はこの方が三日目によみがえるようにし
  rationale: 原文の他動詞構文に従い、神がイエスをよみがえらせたという明示的主張を直接保った。
- issue: 復活後に見えるものとなったこと
  choice: 目に見える姿で現れるようにしてくださいました
  alternative: 姿を現させました
  rationale: ἔδωκενを単純な強制的使役に狭めず、『与えた／許した』という授与の含みを残しつつ、ἐμφανῆ γενέσθαιを自然な日本語で伝えた。誰に現れたかは次節に委ね、この節には補わなかった。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。イエスを指す強調された指示語は「この方」で表し、後半は原文の独特な授与構文を完全に平板化せず、日本語として理解できる形に整えた。
