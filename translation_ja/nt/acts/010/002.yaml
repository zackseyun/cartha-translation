id: ACT.10.2
reference: Acts 10:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὐσεβὴς καὶ φοβούμενος τὸν θεὸν σὺν παντὶ τῷ οἴκῳ αὐτοῦ, ⸀ποιῶν ἐλεημοσύνας πολλὰς τῷ λαῷ καὶ δεόμενος τοῦ θεοῦ διὰ παντός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/002.yaml
  text: devout and fearing God with all his household[a], doing many acts of charity for the people and praying to God continually[b],
translation:
  language: ja
  text: 敬虔な人で、家の者全員とともに神を恐れ[a]、民に多くの施しをし[b]、絶えず神に祈っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神を畏れる」とも訳せる。この表現は、イスラエルの神を礼拝していた異邦人を指す、当時よく知られた呼び方としても用いられた可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「多くの慈善の業を行い」とも訳せる。ギリシア語は、特に困窮者への慈善的な贈り物を指すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβὴς
  choice: 敬虔な人
  rationale: 神への畏敬が生活に表れていることを示す語。「敬虔な」は現代日本語でも通じ、文脈にふさわしい品位を保つ。
- source_word: φοβούμενος τὸν θεὸν
  choice: 神を恐れ
  rationale: 分詞の動作性と聖書的な表現を保つ。「畏れる」も可能だが、平明さを優先して「恐れ」とした。単なる恐怖ではなく、神への畏敬を含む。
- source_word: σὺν παντὶ τῷ οἴκῳ αὐτοῦ
  choice: 家の者全員とともに
  rationale: οἶκοςは建物ではなく家族や同居者を含む家の共同体を指すため、「家の者」とした。
- source_word: ποιῶν ἐλεημοσύνας πολλὰς
  choice: 多くの施しをし
  rationale: ἐλεημοσύνηは特に困窮者への慈善的な贈与を表す。「施し」は簡潔で、複数かつ多量であることを「多くの」で示す。
- source_word: τῷ λαῷ
  choice: 民に
  rationale: 与格を施しの受益者として表現する。「民」はこの文脈でイスラエルの民を指し得るが、原文どおり限定説明を加えない。
- source_word: δεόμενος τοῦ θεοῦ
  choice: 神に祈っていた
  rationale: δέομαιの願い求める意味を、宗教的文脈で自然な「祈る」によって表した。
- source_word: διὰ παντός
  choice: 絶えず
  rationale: 継続的・常習的な祈りを簡潔に示す。文字どおり一瞬も途切れないという過度な意味には限定しない。
theological_decisions:
- issue: コルネリウスに用いられた「神を恐れる」という表現
  choice: 神を恐れ
  alternative: 神を畏敬し／神を敬う者であり
  rationale: 神への一般的な畏敬と、イスラエルの神を礼拝する異邦人について用いられ得る歴史的な呼称との両方の可能性を残すため、原文の動詞表現を保った。専門的な身分呼称に固定しない。
translation_notes:
  register: 明快な現代標準語を用いながら、叙述としての品位を保った。原文の三つの描写を並列的に示し、「神を恐れる」の歴史的・宗教的含意は本文で狭く限定せず脚注で補った。
