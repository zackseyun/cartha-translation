  source_fidelity: 本文は、預言者たちがイエスについて証しし、イエスを信じるすべての人がその名によって罪の赦しを受ける、というギリシア語の内容と構文上の関係を正確に伝えています。「この方について」「この方を信じる者は誰でも」「その名によって」はいずれも適切です。ただし脚注の「この方のために証言しています」は、τούτῳ を単に「この方について／に関して」とする用法から、預言者たちがこの方の代理人・擁護者として証言するかのような含みへ移しており、この箇所の訳注としては不正確です。
