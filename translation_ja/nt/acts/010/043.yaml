id: ACT.10.43
reference: Acts 10:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τούτῳ πάντες οἱ προφῆται μαρτυροῦσιν, ἄφεσιν ἁμαρτιῶν λαβεῖν διὰ τοῦ ὀνόματος αὐτοῦ πάντα τὸν πιστεύοντα εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/043.yaml
  text: All the prophets testify about him that everyone who believes in him receives forgiveness of sins through his name[a].
translation:
  language: ja
  text: すべての預言者がこの方について証言しています。すなわち、この方を信じる者は誰でも、その名によって罪の赦しを受けるのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τούτῳ
  choice: この方について
  rationale: 与格は証言の対象またはその人に有利な証言を示し得る。文脈上、預言者たちがイエスについて証言しているという意味を本文に採り、別の可能性は脚注に残した。
- source_word: πάντες οἱ προφῆται
  choice: すべての預言者
  rationale: 預言者たちによる包括的な証言を、自然で明確な日本語で表した。
- source_word: μαρτυροῦσιν
  choice: 証言しています
  rationale: 証拠を示して証しするという語の力を保ちつつ、現代日本語として明瞭な表現を選んだ。
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: 罪の赦し
  rationale: 新約聖書で定着した表現であり、罪が赦されるという関係的・法的な意味を簡潔に伝える。
- source_word: λαβεῖν
  choice: 受ける
  rationale: 不定詞が預言者の証言内容を示す構文を、日本語では一般的な事実を述べる形で自然に表した。
- source_word: διὰ τοῦ ὀνόματος αὐτοῦ
  choice: その名によって
  rationale: イエスの人格と権威に基づく媒介を示す聖書的な「名」の表現を、説明的に言い換えず保持した。
- source_word: πάντα τὸν πιστεύοντα
  choice: 信じる者は誰でも
  rationale: 単数男性形は男性に限定せず、一人一人に及ぶ包括的・分配的な意味を持つため、「誰でも」とした。
- source_word: εἰς αὐτόν
  choice: この方を
  rationale: πιστεύω＋εἰς が表す、人物へ向けられた信頼を、自然な日本語の「この方を信じる」で表した。
theological_decisions:
- issue: 赦しの範囲と条件
  choice: この方を信じる者は誰でも、その名によって罪の赦しを受ける
  alternative: 救いの仕組みを特定の教派的用語で詳しく説明する
  rationale: 本文が明示するイエス、信仰、罪の赦しの関係をそのまま示し、それを超える教理的説明は加えなかった。
- issue: 男性単数分詞の包括性
  choice: 信じる者は誰でも
  alternative: 信じる男はみな
  rationale: ギリシア語の男性単数分詞はここでは総称的で、男性だけを指すものではない。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある文体とした。「彼」ではなく、直前のイエスを尊重しつつ明確に指す「この方」を用いた。ギリシア語の一文は、証言とその内容の関係を明瞭にするため二文に分け、「すなわち」で接続した。
