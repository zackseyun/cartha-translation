id: ACT.10.9
reference: Acts 10:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῇ δὲ ἐπαύριον ὁδοιπορούντων ἐκείνων καὶ τῇ πόλει ἐγγιζόντων ἀνέβη Πέτρος ἐπὶ τὸ δῶμα προσεύξασθαι περὶ ὥραν ἕκτην.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/009.yaml
  text: On the next day[a], while those men were traveling and drawing near to the city, Peter went up on the housetop to pray, about the sixth hour.
translation:
  language: ja
  text: 翌日[a]、彼らが旅を続けてその町に近づいていたころ、ペテロは祈るため屋上に上った。第六時ごろのことであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ユダヤ人の昼の時刻の数え方では、正午ごろ。
    reason: cultural_note
lexical_decisions:
- source_word: Τῇ δὲ ἐπαύριον
  choice: 翌日
  rationale: 時間表現を簡潔で自然な現代日本語にした。δέはここでは弱い物語上の接続であり、文脈上「さて」「しかし」などを明示しなくても流れが保たれる。
- source_word: ὁδοιπορούντων ἐκείνων
  choice: 彼らが旅を続けて
  rationale: 属格独立構文の同時進行を後続表現と合わせて「〜ていたころ」で表した。ἐκείνωνは直前の使者たちを指すため、自然な日本語の「彼ら」とした。ὁδοιπορέωは移動の継続を示す「旅を続けて」とした。
- source_word: καὶ τῇ πόλει ἐγγιζόντων
  choice: その町に近づいていたころ
  rationale: 同じ属格独立構文内の並列された分詞を自然に統合した。「その町」は文脈上のヨッパを指し、定冠詞の既知性を反映する。
- source_word: ἀνέβη
  choice: 上った
  rationale: 物語を進める単純過去として、屋上への移動を簡潔に表した。
- source_word: ἐπὶ τὸ δῶμα
  choice: 屋上に
  rationale: δῶμαは人が上がって利用できる平らな家屋の屋根を指す。現代日本語で明瞭な「屋上」を選んだ。
- source_word: προσεύξασθαι
  choice: 祈るため
  rationale: 目的を表す不定詞を、日本語の自然な目的表現で訳した。
- source_word: περὶ ὥραν ἕκτην
  choice: 第六時ごろ
  rationale: 原文の時刻表現とπερίの概数を保持した。現代の時刻との対応は脚注で説明する。
theological_decisions: []
