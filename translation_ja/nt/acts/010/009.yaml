  source_fidelity: 原文の時間関係（翌日）、コルネリウスの使者たちが旅をし町に近づいていたという属格独立構文、ペテロが祈る目的で屋上へ上ったこと、そして「第六時ごろ」という概数を正確に保っている。δέを日本語で明示しない処理も、この文脈では自然であり意味の欠落を生じない。
  naturalness: 明瞭で自然な現代標準日本語である。「彼らが旅を続けてその町に近づいていたころ」は、二つの同時進行の分詞を無理なく表す。「第六時ごろのことであった」も日本語として不自然ではなく、原文末尾の時刻情報を明確に伝える。
  terminology: 「ペテロ」「祈る」「屋上」「第六時」は適切である。「屋上」はここで人が上がることのできる平らな屋根（δῶμα）を現代日本語で分かりやすく表している。脚注の「正午ごろ」は第六時の説明として適切である。
