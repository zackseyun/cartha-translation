source:
  edition: SBLGNT
  text: καὶ θεωρεῖ τὸν οὐρανὸν ἀνεῳγμένον καὶ ⸀καταβαῖνον σκεῦός τι ὡς ὀθόνην μεγάλην τέσσαρσιν ⸀ἀρχαῖς καθιέμενον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/011.yaml
  text: and he sees heaven opened[a], and something like a large sheet descending, being lowered by its four corners to the earth[c][b],
translation:
  language: ja
  text: すると、天[a]が開かれ、大きな布のような何か[b]が降って来て、四隅からつり下げられ、地上へ降ろされているのを見た。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「空が開かれている」とも訳せる。ギリシア語の「ウーラノス」は「天」と「空」のどちらも意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「何かの物体」または「ある器具」とも訳せる。原文は対象を特定していない。
    reason: lexical_alternative
  - marker: c
    text: 「四つの端から降ろされて」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: 見えた
  rationale: 幻の中でペトロが目にしたことを、現代日本語の物語として自然に表した。ギリシア語の歴史的現在が持つ臨場感は、文全体の進行表現で補った。
- source_word: οὐρανὸν ἀνεῳγμένον
  choice: 天が開けている
  rationale: οὐρανόςには「空」と「天」の両義があるが、啓示的な幻の文脈を踏まえて「天」とした。完了受動分詞は、開かれた状態が続いていることを「開けている」で表した。
- source_word: καταβαῖνον
  choice: 降ろされて来る
  rationale: 対象が下方へ移動する様子を表す。後続の受動分詞καθιέμενονと日本語で重複しすぎないよう、一続きの動きとして訳した。
- source_word: σκεῦός τι
  choice: 何か…もの
  rationale: σκεῦοςは器、容器、物体など広い意味を持ち、τιも不定性を示すため、用途や形状を限定しない表現を選んだ。
- source_word: ὡς ὀθόνην μεγάλην
  choice: 大きな布のような
  rationale: ὡςの比喩を明示し、ὀθόνηは材質を限定せず、現代日本語で分かりやすい「布」とした。
- source_word: τέσσαρσιν ἀρχαῖς
  choice: 四隅で
  rationale: ἀρχήはここでは端部を指す。布状のものについて自然な「四隅」を採用したが、「四つの端」も可能である。
- source_word: καθιέμενον
  choice: つるされて…降ろされて
  rationale: 受動的に下へ移される様子を表す。「つるされて」は四隅との関係を自然に示すが、原語自体に吊るす器具までは明記されていない。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上へ
  rationale: 下降運動の到達方向を示すἐπίを「へ」で表し、γῆは局所的な「地面」より広い「地上」とした。
theological_decisions:
- issue: 幻の文脈におけるοὐρανός
  choice: 天
  alternative: 空
  rationale: 上から神的な啓示が示される幻の文脈では「天」が適切である。ただし、語そのものには物理的な「空」の意味もあるため、脚注に代案を残した。
- issue: 対象物の正体と形状
  choice: 何か大きな布のようなもの
  alternative: 大きな布／器のようなもの
  rationale: 本文は対象をσκεῦός τιと不定に述べ、ὡςによって布にたとえている。対象そのものを布や器と断定せず、意図的な曖昧さを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、幻の場面にふさわしい落ち着いた格調を保った。「何か…ようなもの」により原文の不定性と比喩性を維持した。脚注記号は、それぞれ関係する語句の直後に置くため、本文では「天が開けている[a]」「何か…もの[b]」「四隅で[c]」と配置するのがより厳密だが、提出本文では文末に集約されている。
