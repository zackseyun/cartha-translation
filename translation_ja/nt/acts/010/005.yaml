  text: καὶ νῦν πέμψον ⸂ἄνδρας εἰς Ἰόππην⸃ καὶ μετάπεμψαι Σίμωνά ⸂τινα ὃς ἐπικαλεῖται Πέτρος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/005.yaml
  text: And now send men to Joppa and summon a certain Simon who is called Peter[a].
translation:
  language: ja
  text: 今、ヨッパに男たちを遣わし、ペトロと呼ばれているシモンという人を呼び寄せなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: そこで今
  rationale: 直前の告知を受けて命令へ移るつながりと、νῦνの時間的・談話的な働きを自然な日本語で示す。
- source_word: πέμψον ἄνδρας εἰς Ἰόππην
  choice: ヨッパに男たちを遣わし
  rationale: πέμψονの命令の力を保ち、ἄνδραςを一般的な「人々」や解釈的な「使者」ではなく「男たち」と訳す。εἰςは目的地を示す「に」とした。
- source_word: μετάπεμψαι
  choice: 呼び寄せなさい
  rationale: 人を遣わして当人に来てもらうという中動態の意味を、強制の含みを加えず簡潔に表す。
- source_word: Σίμωνά τινα
  choice: シモンという人
  rationale: τιναが、聞き手にはまだ特定されていない一人の人物を導入する働きを、現代日本語として自然に表す。
- source_word: ὃς ἐπικαλεῖται Πέτρος
  choice: ペトロと呼ばれている
  rationale: シモンがペトロという名でも呼ばれていることを、そのまま明確に表す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、天使の直接的な命令口調を「遣わし」「呼び寄せなさい」で dignified かつ自然に表現した。「ペテロ」ではなく、ギリシア語名に近い現代的な表記「ペトロ」を採用した。
