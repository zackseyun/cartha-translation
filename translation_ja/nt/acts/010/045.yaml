  text: καὶ ἐξέστησαν οἱ ἐκ περιτομῆς πιστοὶ ⸀ὅσοι συνῆλθαν τῷ Πέτρῳ, ὅτι καὶ ἐπὶ τὰ ἔθνη ἡ δωρεὰ τοῦ ⸂ἁγίου πνεύματος⸃ ἐκκέχυται·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/045.yaml
  text: And the believers from the circumcision who had come with Peter were astonished[c][b][a], because the gift of the Holy Spirit had been poured out even on the Gentiles.
translation:
  language: ja
  text: ペトロと一緒に来た割礼を受けた信者たちは皆、異邦人にまで[b]聖霊の賜物が注がれた[c]ことに驚いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 別訳「異邦人にも」。ギリシア語は単なる付加を表すこともできるが、ここでは驚きを込めた「異邦人にまで」の意味と考えられる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「注がれている」。ギリシア語の完了形は、行為が完了し、その結果が続いていることを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: 驚いた
  rationale: 強い驚きを表す語である。現代日本語として自然であり、文脈にある意外性を明瞭に伝える。
- source_word: οἱ ἐκ περιτομῆς πιστοὶ
  choice: 割礼を受けた信者たち
  rationale: ユダヤ人信者を、割礼によって特徴づけられる集団として指す表現。本文では分かりやすい現代日本語を用い、原文の「割礼からの信者たち」という構造は脚注に示す。
- source_word: ὅσοι συνῆλθαν τῷ Πέτρῳ
  choice: ペトロと一緒に来た…皆
  rationale: ὅσοι の全員を含む意味と、与格を伴う συνέρχομαι の同行の意味を自然な日本語で表した。
- source_word: καὶ ἐπὶ τὰ ἔθνη
  choice: 異邦人の上にまで
  rationale: ἔθνη はこの文脈では非ユダヤ人を指す。καί は単なる追加とも取れるが、ここでは驚きを伴う「〜にまで」が文脈に適する。
- source_word: ἡ δωρεὰ
  choice: 賜物
  rationale: 無償で与えられる贈り物を表す。聖霊について用いられる文脈にふさわしい、簡潔で格調ある日本語。
- source_word: τοῦ ἁγίου πνεύματος
  choice: 聖霊の
  rationale: 属格を自然に表し、現代日本語のキリスト教用語として広く理解される。
- source_word: ἐκκέχυται
  choice: 注がれた
  rationale: 完了受動形が表す、すでに成し遂げられ、その結果が明らかな出来事を、日本語の叙述として自然に表した。継続する結果については脚注で補う。
theological_decisions:
- issue: ἔθνη が指す対象
  choice: 異邦人
  alternative: 諸国民
  rationale: 使徒言行録10章では、ユダヤ人信者と、聖霊を受けた非ユダヤ人との対比が中心であるため、「異邦人」が指示対象を最も明確にする。
- issue: ἐκκέχυται の完了相
  choice: 注がれた
  alternative: 注がれている
  rationale: ギリシア語完了形は、注ぐ行為の完了と、その結果の持続を示し得る。本文では驚きの原因となった先行する出来事を自然に述べ、結果の持続は脚注で明示する。
- issue: καί の強調性
  choice: 〜にまで
  alternative: 〜にも
  rationale: 付加を表す「にも」も可能だが、この場面では割礼を受けた信者たちの驚きが明記されているため、意外な範囲への拡大を示す「にまで」が適切である。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「聖霊」「賜物」「異邦人」など定着した語彙によって聖書本文としての品位を保った。「ペトロと一緒に来た」を前置し、「皆」を添えることで ὅσοι の範囲を自然に示した。
