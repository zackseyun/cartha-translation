  text: ἀλλὰ ἀναστὰς κατάβηθι καὶ πορεύου σὺν αὐτοῖς μηδὲν διακρινόμενος, ⸀ὅτι ἐγὼ ἀπέσταλκα αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/020.yaml
  text: But get up[a], go down, and go with them, doubting nothing, because I have sent them.
translation:
  language: ja
  text: しかし、立ち上がって、下へ降り、少しもためらわずに[a]彼らと一緒に行きなさい。彼らを遣わしたのは、わたしだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何の区別もせずに」とも訳せる。ギリシア語の分詞には、疑ったりためらったりしないという意味と、区別しないという意味の両方があり得る。後者は、この章におけるユダヤ人と異邦人の主題にも響く。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前のペテロの戸惑いから、御霊が命じる行動へと転じる対比を簡潔に示す。
- source_word: ἀναστὰς
  choice: 立って
  rationale: 後続する命令と一連の行動をなす分詞。現代日本語で自然な命令の流れを保つ。
- source_word: κατάβηθι
  choice: 下へ降り
  rationale: 屋上にいるペテロから下方への移動を表す原語の方向性を明示する。
- source_word: πορεύου σὺν αὐτοῖς
  choice: 彼らと一緒に行きなさい
  rationale: 同行を命じる意味を、平明で自然な日本語で表す。
- source_word: μηδὲν διακρινόμενος
  choice: 何もためらわずに
  rationale: 直近の文脈では、幻に戸惑うペテロに迷わず同行するよう命じる意味が自然である。ただし、原語には「区別しない」という意味もあり得るため、脚注に残す。
- source_word: ὅτι
  choice: だからです
  rationale: 同行すべき理由を示す因果関係を自然な日本語で表す。
- source_word: ἐγὼ ἀπέσταλκα αὐτούς
  choice: 彼らを遣わしたのは、わたしだからです
  rationale: 明示された主語ἐγώの強調を「わたし」で保ち、完了した派遣が現在の状況に関わることを文脈上自然に伝える。
theological_decisions:
- issue: μηδὲν διακρινόμενοςと異邦人受容の主題との関係
  choice: 本文では「何もためらわずに」とし、ペテロが迷わず使者たちに同行するよう命じられた意味を前面に出す。
  alternative: 「何の区別もせずに」
  rationale: 直近の物語では躊躇しないことが中心だが、使徒言行録10章全体ではユダヤ人と異邦人を区別しないという主題にも響き得る。いずれか一方に限定せず、別訳を脚注に示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、御霊の命令にふさわしい簡潔で端正な調子と、原文にある命令の連続性を保った。
