source:
  edition: SBLGNT
  text: καὶ ⸀ἡμεῖς μάρτυρες πάντων ὧν ἐποίησεν ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων ⸀καὶ Ἰερουσαλήμ· ὃν καὶ ἀνεῖλαν κρεμάσαντες ἐπὶ ξύλου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/039.yaml
  text: And we are witnesses of all that he did both in the land of the Jews and in Jerusalem[a]. They also put him to death by hanging him on a tree.
translation:
  language: ja
  text: 私たちは、イエスがユダヤ人の地とエルサレムで行ったすべてのことの証人です。人々はこの方を木[a]に掛けて殺しました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「木材」、または解釈を加えて「十字架」とも訳せる。ギリシア語は「木」と言っており、申命記21章23節を踏まえた表現である可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: μάρτυρες
  choice: 証人
  rationale: 実際に見聞きした事実を証言する者という使徒たちの役割を、現代日本語で簡潔かつ自然に表す。
- source_word: πάντων ὧν ἐποίησεν
  choice: 行ったすべてのこと
  rationale: πάντωνの包括性を保ちつつ、日本語として自然な語順にした。文脈上の主語を明確にするため「イエスが」を補った。
- source_word: ἔν τε τῇ χώρᾳ τῶν Ἰουδαίων
  choice: ユダヤ人の地で
  rationale: χώραの「土地・地域」という幅と、τῶν Ἰουδαίωνの民族的・地域的な含みを保ち、ローマ属州としての「ユダヤ」に限定しすぎない表現とした。
- source_word: καὶ Ἰερουσαλήμ
  choice: エルサレムで
  rationale: ギリシア語では前置詞が省略されているが、日本語では並列関係を自然に示すため助詞「で」を補った。
- source_word: ἀνεῖλαν
  choice: 殺しました
  rationale: ここでは「命を奪う、殺す」の意味であり、明瞭な現代日本語を選んだ。
- source_word: κρεμάσαντες ἐπὶ ξύλου
  choice: 木に掛けて
  rationale: 分詞を主動詞に伴う手段として自然に表し、ξύλονを解釈的な「十字架」に置き換えず「木」と訳した。
theological_decisions:
- issue: 十字架刑の文脈における ξύλον の訳語
  choice: 木
  alternative: 十字架／木材
  rationale: 原文はσταυρόςではなくξύλονを用いているため、その語彙上の選択と申命記21章23節を想起させる可能性を保った。「十字架」は文脈上正しい解釈だが、本文では原語以上に明示しない。
- issue: ἀνεῖλαν の主語の表現
  choice: 人々は
  alternative: 彼らは
  rationale: ギリシア語の三人称複数主語は明示されていない。日本語の「彼ら」は直前に明確な複数の先行詞を必要としやすいため、不特定の行為者を示す「人々は」とし、特定集団への責任帰属を本文以上に強めないようにした。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、証言の荘重さを保った。「この方」は目的語を明確にし、イエスへの敬意を示す自然な文脈表現である。
