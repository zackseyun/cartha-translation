id: ACT.10.22
reference: Acts 10:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Κορνήλιος ἑκατοντάρχης, ἀνὴρ δίκαιος καὶ φοβούμενος τὸν θεὸν μαρτυρούμενός τε ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων, ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ καὶ ἀκοῦσαι ῥήματα παρὰ σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/022.yaml
  text: They said[a], “Cornelius, a centurion, a righteous man and one who fears God, and who is well spoken of by the whole nation of the Jews[e][d][c][b], was divinely instructed by a holy angel to summon you to his house and to hear words from you.”
translation:
  language: ja
  text: 彼らは言った。「百人隊長コルネリウスは、正しい人で、神を畏れる人です。また、ユダヤ人全体から評判のよい人です。彼は、あなたを自分の家に呼び寄せ、あなたから言葉を聞くようにと、聖なる御使いを通して神からの指示を受けました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑκατοντάρχης
  choice: 百人隊長
  rationale: ローマ軍の役職を示す、日本語聖書と一般の歴史叙述で定着した訳語。
- source_word: ἀνὴρ δίκαιος
  choice: 正しい人
  rationale: 道徳的・宗教的な正しさを表しつつ、後代の教理的意味を過度に付加しない自然な表現。
- source_word: φοβούμενος τὸν θεόν
  choice: 神を畏れ
  rationale: 神への敬虔な畏敬を示す聖書的表現を保ち、異邦人としての厳密な身分規定までは訳文に持ち込まない。
- source_word: μαρτυρούμενος
  choice: 評判の良い
  rationale: 周囲から好意的な証言を受けているという受動分詞の社会的・評判上の意味を自然な日本語で表す。
- source_word: ὑπὸ ὅλου τοῦ ἔθνους τῶν Ἰουδαίων
  choice: ユダヤの民全体からも
  rationale: ἔθνοςを現代の国民国家ではなく民族的共同体として表し、「ユダヤ人の国民全体」という不自然さを避ける。τεの付加的なつながりは「も」で示す。
- source_word: ἐχρηματίσθη
  choice: 神のお告げを受けました
  rationale: 受動形と神的な伝達の意味を明示する。単なる警告に限定せず、この文脈の天的指示を自然に伝える。
- source_word: ἀγγέλου ἁγίου
  choice: 聖なる御使いから
  rationale: ἅγιοςを明示し、天的使者を指す語として現代日本語の聖書文体で理解しやすい「御使い」を用いる。
- source_word: μεταπέμψασθαί σε εἰς τὸν οἶκον αὐτοῦ
  choice: あなたを自分の家に招き
  rationale: 「人を呼び寄せる／使いを送って来てもらう」という意味を文脈に即して自然に表す。「召喚する」ほど強制的な響きは持たせない。
- source_word: ἀκοῦσαι ῥήματα παρὰ σοῦ
  choice: あなたから言葉を聞く
  rationale: ῥήματαの複数形を「言葉」として保ち、「教え」や「説教」と内容を限定しない。
theological_decisions:
- issue: コルネリウスの敬虔さを、後代の教理的分類を持ち込まずに表すこと
  choice: 正しい人で、神を畏れ
  alternative: 敬虔な人／義とされた人
  rationale: 本文はコルネリウスをユダヤ的な道徳・宗教語彙で称賛するが、ここだけで彼の救済論的・契約的身分を定義してはいない。「正しい」「神を畏れる」という表現を保ち、その緊張を解消しない。
- issue: ἐχρηματίσθηに含まれる神的伝達の主体と内容
  choice: 聖なる御使いから……神のお告げを受けました
  alternative: 聖なる御使いに命じられました／警告されました
  rationale: 神からの伝達であることは示しつつ、動詞を警告や厳命だけに狭めない。御使いが媒介者であるという本文の構造も保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、会話として丁寧語を用いた。「御使い」「神を畏れる」は尊厳ある聖書語彙として保持したが、古風な語尾や過度に直訳的な構文は避けた。原文上説明が必要なほど重大な異読・曖昧さはないため、脚注は付していない。
