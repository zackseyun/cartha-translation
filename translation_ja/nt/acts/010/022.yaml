revisions:
- from: 彼らは言った。「百人隊長コルネリウスは、正しい人で、神を畏れ、ユダヤの民全体からも評判の良い人です。彼は、聖なる御使いから、あなたを自分の家に招き、あなたから言葉を聞くようにと、神のお告げを受けました。」
  to: 彼らは言った。「百人隊長コルネリウスは、正しい人で、神を畏れる人です。また、ユダヤ人全体から評判のよい人です。彼は、あなたを自分の家に呼び寄せ、あなたから言葉を聞くようにと、聖なる御使いを通して神からの指示を受けました。」
  rationale: 意味内容を変えずに、μεταπέμψασθαι の「呼び寄せる」という具体的な働きと、ἐχρηματίσθη ὑπὸ ἀγγέλου ἁγίου の神的指示および御使いによる媒介を、明瞭な現代日本語で示しました。「ユダヤ人全体」は ὅλου τοῦ ἔθνους τῶν Ἰουδαίων の民族的共同体としての用法を自然に表します。本文に脚注を要する異読・意味上の未解決な曖昧さはありません。
