  naturalness: 現行文は読みやすい現代標準日本語です。「ユダヤの民全体からも評判の良い人」は自然ですが、「人」の反復を整理し、「神のお告げ」よりも文脈に即した「神からの指示」のほうが明瞭です。
  terminology: 「百人隊長」「コルネリウス」「正しい人」「神を畏れる」「聖なる御使い」は適切です。「御使い」はこの文脈に合う尊厳ある聖書語彙です。「呼び寄せる」は μεταπέμπομαι の使者を送って来てもらう意味を、「神からの指示を聖なる御使いを通して受けた」は χρηματίζω の神的伝達と御使いの媒介を、それぞれ過不足なく表します。
