  naturalness: 「すると、声が再び、二度目に彼に告げた」は副詞の重なり方が不自然である。「すると、声がもう一度、彼に語りかけた」とすれば自然で、πάλιν ἐκ δευτέρουの反復的強調も「もう一度」で無理なく表せる。命令は「俗なものと見なしてはならない」とすると、目的語との結び付きが明瞭である。
  terminology: καθαρίζωは「清めた」とし、儀礼的清浄の含意を保つ。κοινόωは「俗なものと見なす」として、ἀκάθαρτος（汚れた／不浄な）と同一視しない。日本語の「俗なもの」は現代語では補足を要しうるため、脚注でこの文脈の意味（清浄でないものとして扱う）を示す。
