  text: καὶ φωνὴ πάλιν ἐκ δευτέρου πρὸς αὐτόν· Ἃ ὁ θεὸς ἐκαθάρισεν σὺ μὴ κοίνου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/015.yaml
  text: 'And a voice came to him again a second time: “What God has made clean[a], you must not call common.”'
translation:
  language: ja
  text: すると、声がもう一度、彼に語りかけた。「神が清めたものを、あなたは俗なものと見なしてはならない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνὴ
  choice: 声
  rationale: 無冠詞だが、直前から続く天からの発話を自然な日本語で「声」とした。話者の称号は本文にないため補わない。
- source_word: πάλιν ἐκ δευτέρου
  choice: 再び、二度目に
  rationale: ギリシア語のやや重複的で強調された表現を保ちつつ、現代日本語として理解できる形にした。
- source_word: πρὸς αὐτόν
  choice: 彼に告げた
  rationale: 声がペトロに向けて語ったことを、日本語の発話表現として自然に示した。
- source_word: Ἃ
  choice: もの
  rationale: 中性複数関係代名詞の総括的用法を、日本語では集合的な「もの」で簡潔に表した。
- source_word: ἐκαθάρισεν
  choice: 清めた
  rationale: 神による決定的な行為を表し、同時に儀礼的清浄の含意を保つ。
- source_word: σὺ μὴ κοίνου
  choice: あなたは汚れたものとしてはならない
  rationale: 明示された代名詞σὺの対比的強調を「あなたは」で示した。κοινόωはここでは、清くないものと見なす、または汚れたものとして扱う意であり、「俗なもの」と直訳するより文脈上明瞭である。別の直訳的可能性は脚注に残した。
theological_decisions:
- issue: ペトロの幻における清浄・汚れの対比
  choice: 「汚れたものとしてはならない」を本文に置く
  alternative: 「普通のものとしてはならない」「俗なものと呼んではならない」「汚れたものと呼んではならない」
  rationale: κοινόωはκαθαρίζωと対置され、儀礼的に清くないものと見なす意味を持つ。日本語の「普通のもの」「俗なもの」ではこの文脈の意味が伝わりにくいため、機能的な意味を本文で示し、語義上の幅を脚注に保持した。人や食物のどちらに最終的に適用されるかは、この節だけで限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「告げた」は発話導入として自然で、「清めた」と「汚れた」の対比を分かりやすくした。ペトロの名はこの節のギリシア語本文にないため「彼」とした。
