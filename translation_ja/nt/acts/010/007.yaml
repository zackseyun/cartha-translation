  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς δὲ ἀπῆλθεν ὁ ἄγγελος ὁ λαλῶν ⸀αὐτῷ, φωνήσας δύο τῶν ⸀οἰκετῶν καὶ στρατιώτην εὐσεβῆ τῶν προσκαρτερούντων αὐτῷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/007.yaml
  text: When the angel who was speaking to him had gone away[a], he called two of his household servants and a devout soldier from among those attending him.
translation:
  language: ja
  text: 彼に語っていた天使が去ると、コルネリウスは、家の奴隷二人と、彼に仕えていた者たちの中から敬虔な兵士一人を呼び寄せた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἀπῆλθεν
  choice: 立ち去ると
  rationale: 御使いが去った後にコルネリウスが人々を呼んだという時間的な順序を、自然な日本語で示す。δέは独立して訳出せず、文脈の流れに含めた。
- source_word: ὁ ἄγγελος
  choice: 御使い
  rationale: 文脈ではコルネリウスの幻に現れた天的な使者を指すため、一般的な「使者」ではなく、聖書日本語として通用する「御使い」とした。
- source_word: ὁ λαλῶν αὐτῷ
  choice: 彼に語っていた
  rationale: 現在分詞の継続的な響きを保ちつつ、御使いを限定する連体修飾として自然に表した。
- source_word: φωνήσας
  choice: 呼び寄せた
  rationale: 次節へ続く分詞構文だが、この節の動作として明瞭に読めるよう定動詞化した。「呼ぶ」より、そばへ召したことが伝わる表現を選んだ。
- source_word: δύο τῶν οἰκετῶν
  choice: 家の僕たちのうち二人
  rationale: οἰκέτηςは家に属して仕える僕または奴隷を指す。「僕」は従属的な身分を曖昧にしすぎず、現代日本語の聖書文体にもなじむ。「うち二人」で部分属格を表した。
- source_word: στρατιώτην εὐσεβῆ
  choice: 敬虔な兵士一人
  rationale: εὐσεβήςを、神への真摯な信心を表す標準的な「敬虔な」と訳した。「神を恐れる」は本文の形容詞以上に特定の表現を持ち込むため避けた。
- source_word: τῶν προσκαρτερούντων αὐτῷ
  choice: いつも身近に仕えていた
  rationale: προσκαρτερέωが含む継続的・献身的な付き添いを「いつも」で示し、αὐτῷへの人的奉仕を自然な日本語で表した。この兵士がその一団に属することは連体修飾で示している。
- source_word: implicit subject of φωνήσας
  choice: コルネリウスは
  rationale: ギリシア語では文脈から明らかな主語を、日本語での指示の混乱を避けるため固有名で補った。
theological_decisions:
- issue: ἄγγελοςが指す存在の性質
  choice: 天的存在を表す「御使い」
  alternative: 一般的な「使者」
  rationale: 直前の文脈で神から遣わされ、幻の中でコルネリウスに現れた存在なので、天的な御使いという意味が文脈上明確である。
translation_notes:
  register: 明瞭で現代的な標準日本語を基調としつつ、「御使い」「僕」「敬虔」によって使徒言行録にふさわしい簡潔で品位ある聖書文体を保った。原文は次節へ続く分詞構文だが、日本語では一節として自然に読めるよう「呼び寄せた」で結んだ。
