revisions:
- from: 彼に語っていた御使いが立ち去ると、コルネリウスは、家の僕たちのうち二人と、いつも身近に仕えていた敬虔な兵士一人を呼び寄せた。
  to: 彼に語っていた天使が去ると、コルネリウスは、家の奴隷二人と、彼に仕えていた者たちの中から敬虔な兵士一人を呼び寄せた。
  rationale: 原文の時間関係、天的使者、家に属する二人、そしてコルネリウスに仕える者たちの一人である敬虔な兵士、という構造を保った。「身近に」という追加的含意を除き、部分属格を明示した。οἰκέται の歴史的な語義は本文と注で明確にした。
