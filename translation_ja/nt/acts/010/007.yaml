review_pass:
  verdict: revise
  source_fidelity: 「いつも身近に仕えていた」は、τῶν προσκαρτερούντων αὐτῷ の継続的な奉仕・随伴の含みを表そうとしているが、「身近に」は原文にない近接性を加え、「いつも」も本文では過度に明示的である。また、οἰκέται を「僕たち」とするのは現代標準日本語では意味が取りにくく、家内の隷属的奉仕という語義が不明確になる。
  naturalness: 文全体は読みやすいが、「家の僕たち」「いつも身近に仕えていた」は明瞭で現代的な標準日本語として改善の余地がある。
  terminology: 文脈上の ἄγγελος を「天使」とするのは自然で、天的存在であることを明確にする。「家の奴隷」は歴史的・社会的実態を直接に示し、注で οἰκέτης の語域を補う。「敬虔な」は εὐσεβῆ に適切である。
  issues:
  - severity: medium
    issue: τῶν προσκαρτερούντων αὐτῷ の訳に「いつも身近に」を加えている。
    rationale: προσκαρτερέω は献身的・継続的に仕える／付き従うことを表し得るが、身体的な近接を表す「身近に」は明示されない。部分属格も「彼に仕えていた者たちの中から」と明示する方が忠実である。
  - severity: medium
    issue: οἰκέται の「家の僕たち」が現代語として曖昧である。
    rationale: 「僕」は現代日本語では一人称や少年をも指し得る。οἰκέται は家に属する奴隷・使用人を指すため、本文では「家の奴隷」とし、語の運用幅は注で示す。
  - severity: low
    issue: 「御使い」は理解可能だが、対象方針の明瞭な現代標準日本語では「天使」がより一般的である。
    rationale: この文脈では天的使者であることが明確であり、「天使」は原文の意味を損なわず、特定の教会文体への依存も避けられる。
  revised_text: 彼に語っていた天使が去ると、コルネリウスは、家の奴隷二人と、彼に仕えていた者たちの中から敬虔な兵士一人を呼び寄せた。
  revised_footnotes:
