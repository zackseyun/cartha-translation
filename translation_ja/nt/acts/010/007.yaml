    text: 「家の奴隷」：ギリシア語オイケテース（οἰκέτης）は、家に属して仕える奴隷、または使用人を指す。
    reason: οἰκέται の家内奉仕・隷属に関する語義を明示しつつ、日本語本文の理解を補うため。
  revision_rationale: 原文の時間関係、天的使者、家に属する二人、そしてコルネリウスに仕える者たちの一人である敬虔な兵士、という構造を保った。「身近に」という追加的含意を除き、部分属格を明示した。οἰκέται の歴史的な語義は本文と注で明確にした。
