  to: そこでペトロは、イエス・キリスト[a]の名によってバプテスマを受けるよう、彼らに命じた。それから彼らは、ペトロに数日滞在してほしいと願った。
  rationale: 受動不定詞βαπτισθῆναιに対応して、「彼らにバプテスマを授けるよう」を「バプテスマを受けるよう、彼らに」に改めました。これにより、命令を受けた者が彼ら自身であることを明確にしつつ、バプテスマを施した者を原文以上に特定しません。脚注アンカーと脚注内容は維持しました。
