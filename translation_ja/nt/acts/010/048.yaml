  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσέταξεν ⸀δὲ αὐτοὺς ⸂ἐν τῷ ὀνόματι Ἰησοῦ Χριστοῦ βαπτισθῆναι⸃. τότε ἠρώτησαν αὐτὸν ἐπιμεῖναι ἡμέρας τινάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/048.yaml
  text: So he ordered them to be baptized in the name of Jesus the Messiah[a]. Then they asked him to remain for some days.
translation:
  language: ja
  text: そこでペトロは、イエス・キリスト[a]の名によってバプテスマを受けるよう、彼らに命じた。それから彼らは、ペトロに数日滞在してほしいと願った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシアであるイエス」。ギリシア語の「キリスト」は称号で、「メシア」を意味する。
    reason: alternative_reading
lexical_decisions:
- source_word: προσέταξεν
  choice: 命じた
  rationale: 権威をもって指示することを表すアオリスト能動直説法。現代日本語で自然かつ原語の強さを保つ。
- source_word: δὲ
  choice: そこで
  rationale: 強い対照ではなく、直前の出来事を受けた物語の進展を示すため、推論的なつながりも表せる「そこで」とした。
- source_word: ἐν τῷ ὀνόματι
  choice: 名によって
  rationale: 権威、帰属、名の告白などを含み得る慣用句であり、「権威によって」などと限定せず曖昧さを保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語では「イエス・キリスト」が定着した自然な名称・称号表現である。Χριστόςの称号としての意味は脚注で明示する。
- source_word: βαπτισθῆναι
  choice: バプテスマを授けるよう
  rationale: 受動不定詞を、日本語の命令構文に自然に合わせて「彼らに…授けるよう」と表現した。「浸す」と限定せず、教会用語として広く理解される語を用いた。
- source_word: τότε
  choice: それから
  rationale: 次に起きた出来事を示す時間的順序を、自然な物語表現で伝える。
- source_word: ἠρώτησαν
  choice: 願った
  rationale: ここでは単なる質問ではなく滞在の依頼を表すため、「願った」が文脈に即している。切迫した懇願までは含めない。
- source_word: ἐπιμεῖναι
  choice: 滞在してほしい
  rationale: 一定期間その場にとどまるよう求めたことを、現代日本語の依頼表現として自然に示す。
- source_word: ἡμέρας τινάς
  choice: 数日
  rationale: 期間が特定されていないことを保ちながら、日本語として自然に表現する。
theological_decisions:
- issue: 洗礼定式におけるΧριστοῦの訳
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号だが、日本語では「イエス・キリスト」が最も自然で広く定着している。称号の意味を失わせないため、脚注に「メシア」の訳を掲げる。
- issue: ἐν τῷ ὀνόματιの意味範囲
  choice: 名によって
  alternative: 権威によって
  rationale: この句は権威だけでなく、帰属や告白、名の行使も含み得るため、一義的に解釈せず慣用的な表現を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。主語「ペトロ」はギリシア語では代名詞だが、日本語で指示対象を明確にするため補った。「バプテスマ」は伝統間の解釈差を不必要に狭めない表現として採用した。
