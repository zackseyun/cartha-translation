  text: τοῦ δὲ Πέτρου διενθυμουμένου περὶ τοῦ ὁράματος εἶπεν ⸂αὐτῷ τὸ πνεῦμα⸃· Ἰδοὺ ⸀ἄνδρες ⸀ζητοῦντές σε·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/019.yaml
  text: While Peter was still pondering the vision, the Spirit said to him, “Look, men are seeking you.”
translation:
  language: ja
  text: ペテロがその幻についてなお思い巡らしていると、御霊が彼に言った。「見なさい、男たちがあなたを捜している[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたを探し求めている」。
    reason: ζητέωには「捜す」「探し求める」という意味の幅があるため。
lexical_decisions:
- source_word: διενθυμουμένου
  choice: なお思い巡らしていると
  rationale: 継続する内面的で注意深い熟考を自然な現代日本語で表した。分詞の進行的な側面を「いる」で示し、文脈上続いている状態を「なお」で伝えた。
- source_word: περὶ τοῦ ὁράματος
  choice: 幻について
  rationale: περίの意味関係を明示し、ペテロの熟考の対象が幻であることを保った。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: この文脈ではペテロを導く神の霊を指す。原文にἅγιονはないため「聖霊」と補わず、日本語で神の霊を自然に指す「御霊」とした。
- source_word: εἶπεν αὐτῷ
  choice: 彼に言った
  rationale: 与格の対象を明示しつつ、簡潔で自然な対応表現とした。
- source_word: Ἰδοὺ
  choice: 見なさい
  rationale: 注意を促す談話標識の働きを、古風すぎない命令表現で示した。
- source_word: ἄνδρες
  choice: 男たち
  rationale: ἀνήρがここで成人男性を指すため、性別を中性化せずに訳した。
- source_word: ζητοῦντές σε
  choice: あなたを捜している
  rationale: 人を見つけようとしている場面に合う自然な日本語でζητέωを表した。語の幅を示すため別訳を脚注に掲げた。
theological_decisions:
- issue: τὸ πνεῦμαの指示対象
  choice: 神の霊を指す「御霊」
  alternative: 一般的な霊、または漠然とした霊的促し
  rationale: 使徒言行録10章の物語では、異邦人への宣教を導いてペテロに語る神の霊が指示対象である。ただし原文に「聖」を意味する語はないので、「聖霊」とは補わなかった。
- issue: ἄνδρεςの性別表現
  choice: 男たち
  alternative: 人たち／訪問者たち
  rationale: 原文は一般的な人々ではなく男性を表すἀνήρを用いているため、その限定を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を基調としつつ、神の語りにふさわしい品位を保った。「見よ」より現代的な「見なさい」を用い、「御霊」は神の霊という文脈上の指示を簡潔に表す。
