  text: τοῦτο δὲ ἐγένετο ἐπὶ τρίς, καὶ ⸀εὐθὺς ἀνελήμφθη τὸ σκεῦος εἰς τὸν οὐρανόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/016.yaml
  text: This happened three times[b][a], and immediately the vessel was taken up into heaven.
translation:
  language: ja
  text: このことが三度起こり、すぐにその物[a]は天[b]へ引き上げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その布」。ギリシア語は広く「器」「入れ物」「物」を意味するが、前後の文脈では大きな布のような物を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「空」。ここで用いられたギリシア語は「空」と「天」のどちらも意味し得るが、この幻の文脈には「天」がよく合う。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο
  choice: このこと
  rationale: 直前に描かれた一連の出来事を受ける中性指示代名詞であり、日本語では「このこと」が自然にその照応を示す。
- source_word: δὲ
  choice: —
  rationale: ここでは弱い接続を表す。日本語で独立した接続語を置くと重くなるため、文の流れに吸収した。
- source_word: ἐγένετο
  choice: 起こり
  rationale: 出来事が生じたことを表す一般的な用法。現代日本語の物語文として自然である。
- source_word: ἐπὶ τρίς
  choice: 三度
  rationale: 同じことが三回繰り返されたことを簡潔に表す。「三度」は明瞭で、本文の格調にも合う。
- source_word: εὐθὺς
  choice: すぐに
  rationale: 間を置かない急な展開を、明瞭な現代日本語で表す。
- source_word: ἀνελήμφθη
  choice: 引き上げられた
  rationale: ἀναλαμβάνωのアオリスト受動形と上方への動きをともに反映する。行為者は原文と同様に明示しない。
- source_word: τὸ σκεῦος
  choice: その入れ物
  rationale: σκεῦοςは器、容器、物などを広く指し得る。文脈上は布状の物だが、この節自体の語を過度に限定せず、「入れ物」とし、「布」の可能性は注記した。
- source_word: εἰς τὸν οὐρανόν
  choice: 天へ
  rationale: εἰςの方向性を「へ」で示す。οὐρανόςは空とも天とも訳せるが、啓示的幻の文脈では「天」が適切である。
theological_decisions:
- issue: ペトロの幻における οὐρανός の指示対象
  choice: 天
  alternative: 空
  rationale: οὐρανόςには「空」と「天」の両義があるが、神的領域から降り、そこへ戻る幻という直近の文脈には「天」が最もよく合う。語の幅を隠さないため、別訳を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書物語にふさわしい簡潔で落ち着いた調子とした。「三度」「天」は格調を保つが、古語的にはならない表現である。
