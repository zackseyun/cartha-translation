id: ACT.10.36
reference: Acts 10:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸν λόγον ⸀ὃν ἀπέστειλεν τοῖς υἱοῖς Ἰσραὴλ εὐαγγελιζόμενος εἰρήνην διὰ Ἰησοῦ Χριστοῦ· οὗτός ἐστιν πάντων κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/036.yaml
  text: the message that he sent to the sons of Israel[c][b][a], proclaiming peace through Jesus the Messiah—he is Lord of all.
translation:
  language: ja
  text: 神がイスラエルの人々に送られたことば、すなわち、イエス・メシアを通して平和を告げ知らせたそのことばです。この方こそ、すべての者の主です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν λόγον
  choice: ことば
  rationale: λόγοςはここでは神から送られた知らせの内容を指す。「ことば」は原語との対応を保ちつつ、続く「平和を告げ知らせる」と合わせて内容も明確になる。
- source_word: ὃν ἀπέστειλεν
  choice: 神が…送られた
  rationale: 主語は直前の文脈にある神。「送られた」は日本語の敬語的表現として神を主語に自然であり、受動の意味は持たない。
- source_word: τοῖς υἱοῖς Ἰσραήλ
  choice: イスラエルの子らに
  rationale: υἱοίの明示的な「子ら」を保ち、イスラエルの民を指す慣用的表現として訳した。
- source_word: εὐαγγελιζόμενος
  choice: 告げ知らせる
  rationale: 良い知らせを宣べ伝えるという動詞の力を、現代日本語として自然な「告げ知らせる」で表した。
- source_word: εἰρήνην
  choice: 平和
  rationale: 和解と健全な状態を含みうるが、直接的で定着した対応語「平和」を採用した。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: イエス・メシアによって
  rationale: διάの媒介を「によって」で示し、Χριστόςはここで称号として機能するため「メシア」とした。
- source_word: οὗτός
  choice: この方こそ
  rationale: 指示代名詞の強調を保ちつつ、イエスを指す日本語として自然で敬意ある表現にした。
- source_word: πάντων κύριος
  choice: すべてのものの主
  rationale: 属格πάντωνを直接的に表し、κύριοςの権威と神学的重みを「主」で保持した。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστόςの訳
  choice: イエス・メシア
  alternative: イエス・キリスト
  rationale: この箇所ではΧριστόςの称号性が明瞭であるため、その意味を示す「メシア」を採用した。
- issue: πάντων κύριοςにおけるκύριοςの訳
  choice: すべてのものの主
  alternative: すべてのものの支配者
  rationale: 「主」は権威とキリスト論的含意を保ち、「支配者」より原語の神学的響きを適切に伝える。
- issue: οὗτόςの強調
  choice: この方こそ
  alternative: この方は
  rationale: 単純な代名詞へ平板化せず、イエス自身を指し示すギリシア語の強調を日本語で明示した。
- issue: 分詞εὐαγγελιζόμενοςとλόγοςの統語関係
  choice: 「すなわち」で、送られたことばの内容を説明する
  alternative: 神を主語として「平和を告げ知らせながら」と続ける
  rationale: 分詞の主語は神と理解できる一方、文脈上は送られた知らせの内容を説明する働きも強い。日本語では「すなわち」を用いて滑らかにしつつ、神がそのことばを送ったという構造を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文が使徒言行録10章34節から続く長い文の一部であることを踏まえ、この節単独でも理解できるよう「神が」を補い、「すなわち」で構造を明確にした。「この方こそ」によりοὗτόςの強調を自然に保持した。
