  text: Ἀνοίξας δὲ Πέτρος τὸ στόμα εἶπεν· Ἐπ’ ἀληθείας καταλαμβάνομαι ὅτι οὐκ ἔστιν προσωπολήμπτης ὁ θεός,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/034.yaml
  text: Then Peter opened his mouth and said[b][a], “Truly I understand that God is not one who shows partiality,”
translation:
  language: ja
  text: そこでペトロは口を開いて言った。「私は、確かに分かりました[a]。神は人を分け隔てなさる方ではありません[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「実に、私は理解しています」または「確かに、私は悟っています」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「神は人の顔を取る者ではない」。人の外面的な立場や身分によって偏った扱いをしない、という意味の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνοίξας ... τὸ στόμα
  choice: 口を開いて言った
  rationale: 発言の開始を示す慣用表現であり、ここでは厳粛な宣言を導入する修辞的な重みもあるため、現代日本語でも理解可能な直訳的表現を保った。
- source_word: δὲ
  choice: そこで
  rationale: 前後の出来事をつなぎ、ペトロが応答して語り始める物語上の展開を自然に示す。
- source_word: Ἐπ’ ἀληθείας
  choice: 本当に
  rationale: ペトロの認識が真実で確かなものであることを表す。明瞭で自然な現代日本語とした。
- source_word: καταλαμβάνομαι
  choice: よく分かりました
  rationale: ここでは、ペトロが神の御心を把握し、認識に至ったことを表す。文脈上の気づきを自然に示しつつ、原文に明記されていない「今」を本文には補わなかった。
- source_word: προσωπολήμπτης
  choice: 人を分け隔てなさる方
  rationale: 人の身分や民族などによって偏った扱いをする者、えこひいきする者を指す名詞。「人を分け隔てなさる方ではありません」とすることで、名詞的な表現と神についての敬意を保ちつつ、意味を明瞭にした。
- source_word: ὁ θεός
  choice: 神
  rationale: θεόςの標準的な訳語。日本語では主題を明確にして「神は」とした。
theological_decisions:
- issue: 神の公平さについての宣言を、後代の教理体系に限定せずに訳すこと
  choice: 神は人を分け隔てなさる方ではありません
  alternative: 神はえこひいきをなさらない／神は人を偏り見ない
  rationale: 原文は、神が人の民族や立場によって偏った扱いをなさらないことを述べる。後続節の解釈を先取りして特定の救済論的枠組みに限定せず、神のご性質についての人格的な表現を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「口を開いて」は原文の厳粛な導入表現を保ち、「分け隔てなさる方ではありません」は敬意を示しながら、一般読者にも理解しやすい表現とした。
