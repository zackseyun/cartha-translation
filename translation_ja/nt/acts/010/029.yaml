  yaml_path: translation/nt/acts/010/029.yaml
  text: Therefore I came without objection when I was sent for[a]. So I ask[b], for what reason did you send for me?
translation:
  language: ja
  text: ですから、呼び寄せられて、私は異議を唱えずに来ました。[a] それでお尋ねしますが、どのような理由で私を呼び寄せたのですか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ためらわずに」。ギリシア語は、より字義的には「異議を唱えずに」または「言い争わずに」という意味。
    reason: lexical_alternative
  - marker: b
    text: 別訳「なぜ私を呼び寄せたのですか」。字義的には「どのような理由で私を呼び寄せたのですか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ καὶ
  choice: そこで
  rationale: 直前のペトロの説明を受けた帰結を示す。καίの軽い強調は、日本語では不自然に語を足さず、文脈の流れに含めた。
- source_word: ἀναντιρρήτως
  choice: 異議を唱えずに
  rationale: 反対を口にすること、言い争うことなく行動したという語義を明確に表し、「ためらわずに」より原語の中心的意味に近づけた。
- source_word: ἦλθον
  choice: 来ました
  rationale: 話者が現在いる場所へ来たことを表す、直接的で自然な訳。
- source_word: μεταπεμφθείς
  choice: 呼び寄せられた時
  rationale: 「人を遣わして呼ぶ、呼び寄せる」という動詞の受動分詞を保ち、主動詞との時間的関係を自然な日本語で示した。
- source_word: πυνθάνομαι οὖν
  choice: それでお尋ねしますが
  rationale: οὖνの推論・移行の働きと、πυνθάνομαιの丁寧に問い尋ねる意味を、会話として自然に表した。
- source_word: τίνι λόγῳ
  choice: どのような理由で
  rationale: 単に「なぜ」と圧縮せず、「どのような理由で」という原文の表現を明示した。
- source_word: μετεπέμψασθέ με
  choice: 私を呼び寄せたのですか
  rationale: 前半と同じ語根の反復を保ちつつ、「人を遣わして呼ぶ」という意味を明瞭に表した。
