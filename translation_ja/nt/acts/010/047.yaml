reference: Acts 10:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μήτι τὸ ὕδωρ ⸂δύναται κωλῦσαί⸃ τις τοῦ μὴ βαπτισθῆναι τούτους οἵτινες τὸ πνεῦμα τὸ ἅγιον ἔλαβον ⸀ὡς καὶ ἡμεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/047.yaml
  text: Surely no one can withhold the water so that these people should not be baptized[b][a], can they? For they have received the Holy Spirit just as we have.
translation:
  language: ja
  text: 「私たちと同じように聖霊を受けたこの人たちがバプテスマを受けるのを妨げるために、水を差し止めることなど、いったいだれにできるでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μήτι
  choice: いったい誰にできるでしょうか
  rationale: 否定の答えを予期する修辞疑問の力を、現代日本語で自然に表した。
- source_word: τὸ ὕδωρ
  choice: 水
  rationale: 文脈上、バプテスマに用いる水を指す。日本語では定冠詞を独立して表さなくても特定性が文脈から明らかである。
- source_word: δύναται κωλῦσαί τις
  choice: 水を差し止めることなど、いったい誰にできるでしょうか
  rationale: κωλύωの妨害・禁止の意味と、τιςを含む能力の問いを保ちつつ、目的語「水」と自然に結びつけた。
- source_word: τοῦ μὴ βαπτισθῆναι τούτους
  choice: この人たちが、バプテスマを受けられないように
  rationale: 否定を伴う受動不定詞が表す、彼らのバプテスマを妨げるという意味を明示した。
- source_word: τούτους
  choice: この人たち
  rationale: 文法上の男性形を不要に男性だけへ限定せず、人々を指す自然な現代日本語とした。
- source_word: οἵτινες
  choice: 聖霊を受けたこの人たち
  rationale: 関係節を日本語の連体修飾として表し、彼らを特徴づけると同時に議論の根拠となる関係を保った。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 標準的で明瞭なキリスト教用語を用いた。
- source_word: ἔλαβον
  choice: 受けた
  rationale: 完了した出来事を自然な日本語の過去形で表し、その現在的な意義は文脈に委ねた。
- source_word: ὡς καὶ ἡμεῖς
  choice: 私たちと同じように
  rationale: 彼らの聖霊受領を「私たち」の経験と明確に並べる比較を保持した。
theological_decisions:
- issue: 聖霊受領と水のバプテスマとの関係
  choice: 彼らがすでに聖霊を受けたことを根拠として、水によるバプテスマを妨げられないと訳した。
  alternative: 聖霊受領とバプテスマの時間的順序を曖昧にする訳。
  rationale: 本文の論理では聖霊受領が先に起こり、それが水のバプテスマを認める根拠となっている。この物語上の順序を保ちつつ、特定の教派的な秘跡論は付加しない。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。原文の修辞疑問を保ち、引用符でペテロの発言として示した。「洗礼」より原語との対応が見えやすい「バプテスマ」を採用した。
