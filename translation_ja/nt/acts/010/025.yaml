  text: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον, συναντήσας αὐτῷ ὁ Κορνήλιος πεσὼν ἐπὶ τοὺς πόδας προσεκύνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/025.yaml
  text: And when Peter entered[a], Cornelius met him and fell at his feet and paid him homage.
translation:
  language: ja
  text: さて、ペトロが入って来たとき、コルネリウスは彼を出迎え、その足もとにひれ伏して彼に敬意を表した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼を礼拝した」。ギリシア語の動詞は、文脈により、礼拝することも、ひれ伏して敬意を示すことも意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐγένετο τοῦ εἰσελθεῖν τὸν Πέτρον
  choice: さて、ペトロが入って来ると
  rationale: この構文は物語の中で時の状況を導入する慣用表現である。「さて」でδέの緩やかな接続を示し、「入って来ると」で出来事の時間的関係を自然な日本語にした。
- source_word: συναντήσας αὐτῷ
  choice: 彼を出迎え
  rationale: コルネリウスが入って来たペトロのもとへ会いに出た場面なので、単なる「会い」よりも「出迎え」が文脈上の動きを自然に伝える。
- source_word: πεσὼν ἐπὶ τοὺς πόδας
  choice: その足もとにひれ伏して
  rationale: ペトロの足もとに身を伏せる、へりくだった身体動作を明確かつ自然に表す。
- source_word: προσεκύνησεν
  choice: 拝礼した
  rationale: προσκυνέωは文脈により、礼拝にも、ひれ伏して敬意を示す行為にもなり得る。「拝礼した」は深い敬意を伴う動作を保ちつつ、神への礼拝であると本文だけで断定しない。別の可能性は脚注に示した。
theological_decisions:
- issue: ペトロに対するπροσκυνέωの意味
  choice: 拝礼した
  alternative: 礼拝した
  rationale: 次節でペトロが「私も人間です」と制止するため、この行為が度を越した敬意であったことは明らかだが、語自体は必ずしも神に対する礼拝だけを意味しない。本文では意味範囲を狭めすぎず、神的礼拝を明示する訳は脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒言行録の叙述にふさわしい落ち着いた文体とした。「拝礼」はやや改まった語だが、「ひれ伏して」と組み合わせることで普通の読者にも行為が理解でき、原語の意味上の幅も保てる。
