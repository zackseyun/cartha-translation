id: ACT.10.33
reference: Acts 10:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξαυτῆς οὖν ἔπεμψα πρὸς σέ, σύ τε καλῶς ἐποίησας παραγενόμενος. νῦν οὖν πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν ἀκοῦσαι πάντα τὰ προστεταγμένα σοι ὑπὸ τοῦ ⸀κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/033.yaml
  text: So I sent for you at once[a], and you did well to come. Now then[b], we are all here before God to hear everything that has been commanded to you by the Lord.
translation:
  language: ja
  text: そこで私は、すぐに[a]あなたをお呼びするために使いを遣わしました。よくおいでくださいました。今、私たちは皆、主[b]があなたに命じられたことをすべて聞くために、神の御前におります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「直ちに」または「遅滞なく」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「主」は文脈上イエスを指す可能性が高いが、神を指すと理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξαυτῆς
  choice: すぐに
  rationale: 行動に移した即時性を、現代日本語で自然かつ明確に表す。
- source_word: οὖν
  choice: そこで／今
  rationale: 最初のοὖνは直前の経緯を受ける「そこで」、νῦν οὖνは集まりの目的へ移る「今」とし、日本語の談話の流れを自然にした。
- source_word: ἔπεμψα πρὸς σέ
  choice: あなたをお呼びするために人を遣わしました
  rationale: 直訳は「あなたのもとへ遣わした」だが、文脈上、使者を送ってペトロを呼んだことを明示する自然な表現とした。
- source_word: καλῶς ἐποίησας παραγενόμενος
  choice: よく来てくださいました
  rationale: 来訪をよい行為として認めるギリシア語の慣用表現を、敬意を保った自然な日本語で表した。
- source_word: πάντες ἡμεῖς ἐνώπιον τοῦ θεοῦ πάρεσμεν
  choice: 私たちは皆、神の御前におります
  rationale: 集まった一同を強調しつつ、神の臨在を意識する厳粛さを保った。
- source_word: πάντα τὰ προστεταγμένα σοι
  choice: あなたに命じられていることを、すべて
  rationale: πάνταの包括性と、完了受動分詞が示す権威ある命令の継続的な効力を保った。
- source_word: ὑπὸ τοῦ κυρίου
  choice: 主から
  rationale: 動作主を自然な日本語で示し、κύριοςの指示対象を本文で限定しない。
theological_decisions:
- issue: τοῦ κυρίου（「主」）の指示対象
  choice: 本文では「主」とし、イエスとも神とも明示しない
  alternative: 文脈から「主イエス」と補う、または直前の「神」を受けて「神」とする
  rationale: ギリシア語本文はκύριοςとのみ記す。使徒言行録10章の文脈ではイエスを指す可能性が高いが、本文にない固有名を補わず、原文の神学的な含みを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら、コルネリウスが神の御前に集まった場面の敬意と厳粛さを保った。「おります」「来てくださいました」により、話者のペトロへの礼節も表している。
