  to: そこで私は、すぐに[a]あなたをお呼びするために使いを遣わしました。よくおいでくださいました。今、私たちは皆、主[b]があなたに命じられたことをすべて聞くために、神の御前におります。
  rationale: 使者を送ってペトロを招いたという文脈上明白な意味を「使いを遣わしました」で自然に表した。来訪を肯定する慣用表現を丁重で明瞭な日本語に整え、また「命じられたこと」としてπροστεταγμέναの完了受動の含意を反映した。κύριοςの指示対象は本文で限定していない。
