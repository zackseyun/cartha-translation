  text: ὁ δὲ Πέτρος εἶπεν· Μηδαμῶς, κύριε, ὅτι οὐδέποτε ἔφαγον πᾶν κοινὸν ⸀καὶ ἀκάθαρτον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/014.yaml
  text: But Peter said, “By no means, Lord, because I have never eaten anything common and unclean.”
translation:
  language: ja
  text: しかしペトロは言った。「とんでもありません、主よ。私はこれまで一度も、清くないものや汚れたものを食べたことがありません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδαμῶς
  choice: とんでもありません
  rationale: 強い拒絶を表す語であり、主への応答として自然で明確な現代日本語にした。
- source_word: κύριε
  choice: 主よ
  rationale: 呼びかけの形を保ち、直前の命令に対するペトロの応答であることを示した。
- source_word: κοινὸν
  choice: 俗なもの
  rationale: 儀礼上、聖別されておらず一般のものとされた状態を指す語。「汚れた」と同一化せず、語義上の区別を残した。
- source_word: ἀκάθαρτον
  choice: 汚れたもの
  rationale: 食物に関する儀礼的な汚れを表す標準的な聖書用語として訳した。
- source_word: καὶ
  choice: や
  rationale: 否定文中で二つの範疇を自然に並列する日本語とした。底本の接続詞は「そして」だが、「俗であり同時に汚れたもの」だけに限定する意図とは断定せず、文脈上の二範疇を保った。
theological_decisions:
- issue: κοινὸν καὶ ἀκάθαρτον の関係
  choice: 「俗なものや汚れたもの」
  alternative: 「俗で汚れたもの」
  rationale: ギリシア語の καί は連結を示すが、ここで両形容詞が必ず一つの対象に同時に当てはまると限定するかは曖昧である。日本語では二つの儀礼的範疇として自然に読める形を採り、区別と関連の双方を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語。ペトロの強い拒絶と敬意ある呼びかけを両立させ、儀礼的な語彙の区別を保った。
