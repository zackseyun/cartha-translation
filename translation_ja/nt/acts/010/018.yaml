id: ACT.10.18
reference: Acts 10:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φωνήσαντες ⸀ἐπυνθάνοντο εἰ Σίμων ὁ ἐπικαλούμενος Πέτρος ἐνθάδε ξενίζεται.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/018.yaml
  text: And they called out and asked whether Simon[a], who is called Peter, was staying here.
translation:
  language: ja
  text: そして彼らは声をかけ、「ペトロと呼ばれているシモンは、ここに泊まって[a]いるでしょうか」と尋ねた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「泊まっている」に当たるギリシア語には、客として迎えられ、宿を提供されて滞在しているという意味がある。別訳「宿泊して」。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσαντες
  choice: 声をかけ
  rationale: 家の中にいる人に向かって声を上げ、その後に問い合わせたという先行動作を、自然な現代日本語で表す。単なる「呼び」より場面が明瞭で、「叫び」ほど強すぎない。
- source_word: ἐπυνθάνοντο
  choice: 尋ねた
  rationale: 未完了過去形には問い合わせていたという継続・試行の含みがあり得るが、この文脈では日本語の自然な物語叙述として「尋ねた」で十分に表せる。
- source_word: εἰ
  choice: いるでしょうか
  rationale: 間接疑問を、日本語では引用された問いの形にして自然に表現する。「かどうか尋ねた」も可能だが、直接の発話として訳すと場面が明快になる。
- source_word: Σίμων ὁ ἐπικαλούμενος Πέτρος
  choice: ペトロと呼ばれているシモン
  rationale: 二つの名と、ἐπικαλούμενος の現在受動的な「呼ばれている」という関係をそのまま保つ。
- source_word: ἐνθάδε
  choice: ここに
  rationale: 話者が訪れた場所を指す単純な場所表現として、自然な現代日本語を用いる。
- source_word: ξενίζεται
  choice: 泊まっている
  rationale: 客として宿を提供され滞在していることを表す動詞。本文では分かりやすい「泊まっている」とし、歓待される客という語感を脚注で補う。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語。使徒言行録の物語調にふさわしい品位を保ちつつ、過度に文語的な表現を避けた。間接疑問は日本語として自然な引用疑問文で表した。
