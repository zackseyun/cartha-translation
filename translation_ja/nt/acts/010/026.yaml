source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος ⸂ἤγειρεν αὐτὸν⸃ λέγων· Ἀνάστηθι· καὶ ἐγὼ αὐτὸς ἄνθρωπός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/026.yaml
  text: But Peter raised him up[a], saying, “Stand up[c][b]; I too am a man.”
translation:
  language: ja
  text: しかし、ペトロは彼を起こして[a]、言った。「立ちなさい[b]。私自身も人間です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼を立たせて」または「彼を助け起こして」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「起きなさい」または「立ち上がりなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν αὐτὸν
  choice: 彼を起こして
  rationale: ἐγείρωの基本的な「起こす」という動作を保ちつつ、ひれ伏しているコルネリウスをペトロが立たせる文脈に自然に合う。「助け起こす」は介助の仕方をやや明示しすぎるため脚注に置く。
- source_word: Ἀνάστηθι
  choice: 立ちなさい
  rationale: 足元にひれ伏した状態から立つよう命じる直接的なアオリスト命令形を、明瞭で自然な現代日本語にした。
- source_word: καὶ ἐγὼ αὐτὸς
  choice: 私も同じ
  rationale: καίの包含とαὐτόςの強調を、日本語では「私も同じ」によって自然に表し、ペトロもコルネリウスと等しく人間であるという対比を示す。
- source_word: ἄνθρωπός εἰμι
  choice: 人間です
  rationale: ἄνθρωποςを性別に限定せず「人間」と訳し、ペトロが自らの共通の人間性を述べる意味を直接表す。「ただの人間」は原文にない限定を加えるため避けた。
- source_word: δὲ
  choice: しかし
  rationale: 前節でコルネリウスがひれ伏した行為と、それを正すペトロの応答との穏やかな対照を示す。
theological_decisions:
- issue: ペトロがひれ伏す行為に応じた意味
  choice: ペトロがコルネリウスを起こし、自分も同じ人間だと述べて、その行為を退けたことをそのまま示す。
  alternative: より限定的に、ペトロの個人的な謙遜の表明としてのみ理解することもできる。
  rationale: 本文はペトロの行動と共有された人間性という理由を明示するが、礼拝や敬意に関する体系的教理までは述べていないため、その範囲を越えて解釈を加えない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「私も同じ人間です」は、逐語的な「私自身も人間です」より自然でありながら、καὶ ἐγὼ αὐτόςの強調と共有性を保つ。
