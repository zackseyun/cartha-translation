source:
  edition: SBLGNT
  text: εἰσκαλεσάμενος οὖν αὐτοὺς ἐξένισεν. Τῇ δὲ ἐπαύριον ⸀ἀναστὰς ἐξῆλθεν σὺν αὐτοῖς, καί τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης συνῆλθον αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/023.yaml
  text: So he invited them in and gave them lodging[a]. The next day he got up and went out with them[b], and some of the brothers from Joppa went with him.
translation:
  language: ja
  text: そこで、ペトロは彼らを中に招き入れ、泊めた。[a] 翌日、彼は立ち上がって彼らとともに出かけた。ヨッパから来た兄弟たち[b]のうち何人かも、彼に同行した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「客として迎えた」または「宿を提供した」とも訳せる。ギリシア語は、客を迎えて泊めるというもてなしを表す。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は男性複数形のギリシア語を訳したもの。初期キリスト教の用法では、より広く信者仲間、すなわち「兄弟姉妹」を指す場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσκαλεσάμενος
  choice: 中に招き入れ
  rationale: 中動態分詞が表す、彼らを自分のいる所へ入らせる行為を、自然な現代日本語で具体的に示した。
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた物語上の帰結を示し、強すぎる論理関係は持ち込まない。
- source_word: ἐξένισεν
  choice: 泊めた
  rationale: 客として迎えて宿泊させるという文脈上の意味を、簡潔で自然な日本語にした。
- source_word: Τῇ δὲ ἐπαύριον
  choice: 翌日
  rationale: 物語の時間的推移を明瞭かつ自然に表す。
- source_word: ἀναστὰς
  choice: 立ち上がって
  rationale: 『起き上がる／立つ』という動作を保持し、後続の移動動詞と同一視しない。
- source_word: ἐξῆλθεν σὺν αὐτοῖς
  choice: 彼らとともに出かけ
  rationale: 外へ出て同行する具体的な動きを自然に表しつつ、旅立ち以上の意味を加えない。
- source_word: τινες τῶν ἀδελφῶν τῶν ἀπὸ Ἰόππης
  choice: ヨッパ出身の兄弟たちも何人か
  rationale: 不定複数のτινες、出身地を示す句、男性複数形ἀδελφῶνをそれぞれ保持し、自然な日本語の語順にした。
- source_word: συνῆλθον αὐτῷ
  choice: 彼に同行した
  rationale: この文脈では、ペトロと一緒に旅をしたことを明確に表す。
theological_decisions:
- issue: 初期キリスト教共同体を指すἀδελφῶνの範囲
  choice: 兄弟たち
  alternative: 信者仲間／兄弟姉妹
  rationale: 原文の男性複数形を本文に反映した。一方、この語は初期キリスト教の用法では信者仲間を広く指し得るため、その可能性を脚注に残した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、物語文にふさわしい簡潔で落ち着いた文体とした。「泊めた」は口語的すぎず、具体的なもてなしを平易に伝える。地名は日本語聖書で定着した「ヨッパ」、人名は現代的な表記「ペトロ」とした。
