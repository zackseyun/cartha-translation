source:
  edition: SBLGNT
  text: Ἔτι λαλοῦντος τοῦ Πέτρου τὰ ῥήματα ταῦτα ἐπέπεσε τὸ πνεῦμα τὸ ἅγιον ἐπὶ πάντας τοὺς ἀκούοντας τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/044.yaml
  text: While Peter was still speaking these words[a], the Holy Spirit fell upon all those hearing the word.
translation:
  language: ja
  text: ペトロがなおこれらのことばを語っている間に、聖霊が、そのことばを聞いていたすべての人の上に降った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのことばを聞いていたすべての人に、聖霊が臨んだ。」
    reason: ἐπέπεσε ἐπίは、字義的な像を生かして「（人の上に）降った」とも、日本語の慣用的表現として「（人に）臨んだ」とも訳せるため。
lexical_decisions:
- source_word: Ἔτι λαλοῦντος τοῦ Πέτρου
  choice: ペトロがなお…語っていると
  rationale: 属格絶対構文と現在分詞が表す継続中の動作、および主節との同時性を、自然な現代日本語の時の節で示した。
- source_word: τὰ ῥήματα ταῦτα
  choice: これらのことば
  rationale: ῥήματαを、直前に語られた発言を指す複数形として素直に訳した。
- source_word: ἐπέπεσε
  choice: 降った
  rationale: 聖霊の到来を表すルカの力強い表現を保ちつつ、日本語で自然な「降る」を用いた。「臨んだ」も可能であるため脚注に示した。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 明確な定冠詞付きの表現を、現代日本語で定着した名称として訳した。
- source_word: ἐπὶ πάντας τοὺς ἀκούοντας
  choice: 聞いていたすべての人の上に
  rationale: ἐπίの空間的な像と、現在分詞が示すその時点で聞いている人々を保持した。
- source_word: τὸν λόγον
  choice: みことば
  rationale: 単なる一語ではなく、ペトロが告げている神のことば・宣教の内容を指す文脈を保ち、ῥήματαとの語彙上の区別も示した。
theological_decisions:
- issue: ἐπέπεσεによる聖霊の働きの描写
  choice: 聖霊が降った
  alternative: 聖霊が臨んだ
  rationale: 出来事を特定の教派的な聖霊論で説明せず、原文の具体的で力強い動きを保った。
- issue: λόγοςの訳語
  choice: みことば
  alternative: ことば／知らせ
  rationale: 宣べ伝えられた内容を指す文脈を示しながら、「福音」など原文に明記されない解釈語への置換を避けた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「なお」で発話の継続を示し、「すべての人」によって聖霊が例外なく聞き手たちに降ったことを明確にした。
