  text: πέμψον οὖν εἰς Ἰόππην καὶ μετακάλεσαι Σίμωνα ὃς ἐπικαλεῖται Πέτρος· οὗτος ξενίζεται ἐν οἰκίᾳ Σίμωνος βυρσέως παρὰ ⸀θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/032.yaml
  text: Therefore send to Joppa and summon Simon[a], who is called Peter. He is lodging in the house of Simon, a tanner[b], by the sea.
translation:
  language: ja
  text: それで、ヨッパに人を遣わして、ペトロと呼ばれているシモンを呼び寄せなさい[a]。彼は海辺にある皮なめし職人シモンの家に滞在しています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「シモンを自分のもとへ呼ばせなさい」。
    reason: lexical_alternative
  - marker: b
    text: 「滞在しています」に当たるギリシア語には、客として迎えられているという含みがあります。
    reason: lexical_nuance
lexical_decisions:
- source_word: πέμψον οὖν εἰς Ἰόππην
  choice: だから、ヨッパに人を遣わし
  rationale: οὖνの前文を受けた帰結を「だから」で自然に示し、πέμψονは使者を送る文脈が明らかなため「人を遣わし」とした。
- source_word: μετακάλεσαι
  choice: 呼び寄せなさい
  rationale: 自分のもとへ人を呼ばせるという中動態の意味を、現代日本語で簡潔かつ明瞭に表す。
- source_word: Σίμωνα ὃς ἐπικαλεῖται Πέτρος
  choice: ペトロと呼ばれているシモン
  rationale: 別名を示すἐπικαλεῖταιを直截に訳し、「ペトロと呼ばれる」の受動的な形を保持した。
- source_word: ξενίζεται
  choice: 滞在しています
  rationale: 客として迎えられている含意を文脈に適した自然な日本語で表現した。受動の含意は脚注で補足する。
- source_word: ἐν οἰκίᾳ Σίμωνος βυρσέως
  choice: 皮なめし職人シモンの家に
  rationale: βυρσεύςを当時の職業が明瞭に伝わる「皮なめし職人」とし、属格構造を自然な日本語にした。
- source_word: παρὰ θάλασσαν
  choice: 海辺にある
  rationale: 海に沿った場所を示すπαρά＋対格を、家の所在地として自然に表した。
theological_decisions: []
