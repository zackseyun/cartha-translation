  text: ἤκουον γὰρ αὐτῶν λαλούντων γλώσσαις καὶ μεγαλυνόντων τὸν θεόν. τότε ⸀ἀπεκρίθη Πέτρος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/046.yaml
  text: 'For they were hearing them speaking in tongues and magnifying God[a]. Then Peter answered:'
translation:
  language: ja
  text: 彼らが異言[a]で語り、神をあがめているのを聞いていたからである。そこでペテロは答えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸言語で」。ギリシア語は「異言」と「言語」のどちらをも指し得るため、ここでの発話の性質を一つに限定しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουον
  choice: 聞いていた
  rationale: 未完了過去の継続的な様相を自然な日本語で示す。主語は前節から続くため、本文に新たな名詞を補わない。
- source_word: γὰρ
  choice: からである
  rationale: 前の叙述の理由・根拠を示す説明的な接続を保つ。
- source_word: αὐτῶν
  choice: 彼らが
  rationale: 属格絶対ではなく、ἀκούωに伴う属格と分詞の構文を、日本語では引用内容の主語として自然に表した。指示対象を「異邦人」などと明示せず、代名詞の照応を保つ。
- source_word: λαλούντων
  choice: 語り
  rationale: μεγαλυνόντωνと並ぶ継続的な分詞を簡潔に表す。
- source_word: γλώσσαις
  choice: 異言で
  rationale: 使徒言行録における定着した表現を用いつつ、それが既知の諸言語か別種の発話かを本文だけで断定しない。語義上の別訳は脚注に示す。
- source_word: μεγαλυνόντων
  choice: あがめている
  rationale: 神を大いなる方としてほめたたえる意味を、現代日本語として自然で荘重な表現にした。
- source_word: τὸν θεόν
  choice: 神を
  rationale: 直接目的語を標準的に訳した。
- source_word: τότε
  choice: そこで
  rationale: 単なる時間的順序だけでなく、直前の出来事を受けた応答への移行を自然に示す。
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 明示された質問がなくても用いられる「応じる、答える」という語義を直接に保つ。
- source_word: Πέτρος
  choice: ペテロ
  rationale: 日本語聖書で広く定着している人名表記を用いる。
theological_decisions:
- issue: γλώσσαιςが指す発話の性質
  choice: 異言で
  alternative: 諸言語で
  rationale: γλῶσσαは「舌」から「言語」をも意味し、この箇所の発話の性質について本文は詳細を説明しない。「異言」という定着した表現を本文に置き、既知の外国語に限定する解釈も、特定の恍惚的発話に限定する解釈も断定せず、別訳を脚注に残す。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書本文にふさわしい落ち着いた文体とした。前節から続く「聞いていた」の主語は補わず、原文の照応関係を維持した。
