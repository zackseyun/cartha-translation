base_translation:
  language: en
  yaml_path: translation/nt/acts/010/012.yaml
  text: In it were all the four-footed animals and reptiles of the earth[c][b][a], and birds of the sky.
translation:
  language: ja
  text: その中には、あらゆる四つ足の動物、地を這うもの[a]、空の鳥がいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地上を這う生き物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: その中には
  rationale: 関係代名詞の先行詞である前節の大きな布状のものを受け、場所を表す意味を自然な現代日本語で示した。
- source_word: ὑπῆρχεν
  choice: いた
  rationale: ここでは容器の中に動物が存在していたことを表す。「入っていた」では包含の意味をやや強く補うため、単純な存在表現とした。
- source_word: πάντα
  choice: あらゆる
  rationale: 列挙された動物群に及ぶ包括性を保ちつつ、「あらゆる種類の」とまでは明示しない訳とした。
- source_word: τὰ τετράποδα
  choice: 四つ足の動物
  rationale: 専門的な表現を避け、形態上の分類を普通の読者に明瞭に伝える。
- source_word: ἑρπετὰ τῆς γῆς
  choice: 地を這うもの
  rationale: ἑρπετάは現代的な生物分類上の「爬虫類」より広く、這って移動する生き物を指し得るため、その幅を保った。属格 τῆς γῆς は「地を」と自然に表した。
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: 空の鳥
  rationale: πετεινάを文脈に即して「鳥」、οὐρανόςを地上から見た空の意味で「空」とした。
- source_word: καὶ ... καὶ
  choice: 、…、…
  rationale: ギリシア語の接続された三分類を、日本語では自然で明瞭な並列表現にした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、幻の描写にふさわしい簡潔で品位ある文体とした。「その中には」で前節とのつながりを明示し、動物分類については現代生物学の狭い区分を持ち込まないようにした。
