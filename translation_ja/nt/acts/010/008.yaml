base_translation:
  language: en
  yaml_path: translation/nt/acts/010/008.yaml
  text: And after explaining everything to them, he sent them to Joppa.
translation:
  language: ja
  text: そして、すべてのことを彼らに説明してから、彼らをヨッパへ遣わした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξηγησάμενος
  choice: 説明してから
  rationale: アオリスト分詞が主動詞に先立つ行為を表すことを「してから」で明確にし、事の次第を詳しく話したという語義を自然な現代日本語で表した。
- source_word: ἅπαντα
  choice: すべてのことを
  rationale: 中性複数形が示す包括性を保ち、コルネリウスが事の全容を伝えたことを表した。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 説明を受けた三人を指す与格の間接目的語を、そのまま明瞭に訳した。
- source_word: ἀπέστειλεν
  choice: 遣わした
  rationale: ἀποστέλλωの「送る、派遣する」という意味を表す。任務を託して目的地へ向かわせる文脈に合い、聖書本文として自然で品位のある「遣わした」を選んだ。
- source_word: εἰς τὴν Ἰόππην
  choice: ヨッパへ
  rationale: εἰςが示す目的地への移動を「へ」で自然に表し、地名は日本語聖書で定着した「ヨッパ」とした。
theological_decisions: []
