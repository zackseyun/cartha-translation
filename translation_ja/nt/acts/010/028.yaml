id: ACT.10.28
reference: Acts 10:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔφη τε πρὸς αὐτούς· Ὑμεῖς ἐπίστασθε ὡς ἀθέμιτόν ἐστιν ἀνδρὶ Ἰουδαίῳ κολλᾶσθαι ἢ προσέρχεσθαι ἀλλοφύλῳ· κἀμοὶ ὁ θεὸς ἔδειξεν μηδένα κοινὸν ἢ ἀκάθαρτον λέγειν ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/028.yaml
  text: And he said to them[a], “You yourselves know how unlawful it is for a Jewish man to associate with or visit a foreigner[b]; but God has shown me to call no person common or unclean.”
translation:
  language: ja
  text: そしてペトロは彼らに言った。「皆さんもご存じのとおり、ユダヤ人の男性が異民族の人[a]と交わったり、その人のもとを訪れたりすることは禁じられています。しかし神は私に、どんな人も清くない者[b]、あるいは汚れた者と呼んではならない、と示してくださいました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異邦人」とも訳せる。原語は字義的には「別の民に属する人」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「清くない者」は原語 κοινός の訳で、「汚れた」（ἀκάθαρτος）とは別の語である。ここでは清浄規定に関する二つの範疇が並べられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη τε πρὸς αὐτούς
  choice: そしてペトロは彼らに言った
  rationale: τέの軽い接続を「そして」で表した。日本語で主語を明確にするため、文脈上の話者であるペトロを補った。
- source_word: Ὑμεῖς ἐπίστασθε
  choice: 皆さんもご存じのとおり
  rationale: 明示された代名詞Ὑμεῖςの強調を「も」で示し、丁寧だが自然な語りかけとした。
- source_word: ὡς ἀθέμιτόν ἐστιν
  choice: 禁じられています
  rationale: ἀθέμιτοςは許容されないこと、法や慣習に反することを示す。「禁じられている」は単なる無作法に弱めず、何の法規によるかを本文以上に限定しない。
- source_word: ἀνδρὶ Ἰουδαίῳ
  choice: ユダヤ人の男性が
  rationale: 単数の代表的用法とἀνήρの男性を示す語形をともに保った。
- source_word: κολλᾶσθαι
  choice: 交わったり
  rationale: 文字どおりには結び付くことを表すが、ここでは社会的な付き合いを自然な日本語で示した。
- source_word: ἢ προσέρχεσθαι
  choice: その人のもとを訪れたり
  rationale: 単なる接近ではなく、異民族の人のもとへ行くという文脈上の実際的意味を表した。
- source_word: ἀλλοφύλῳ
  choice: 異民族の人
  rationale: 「別の民に属する人」という語義を直接表し、「異邦人」という解釈的・宗教的に定着した呼称に限定しなかった。
- source_word: κἀμοὶ ὁ θεὸς ἔδειξεν
  choice: しかし神は私に……示してくださいました
  rationale: κἀμοίは字義的には「そして私に」だが、従来の認識と神の啓示との対照を「しかし」で自然に示した。敬語は神への敬意を表す一般的な日本語表現である。
- source_word: μηδένα ... ἄνθρωπον
  choice: どんな人をも……呼んではならない
  rationale: ἄνθρωποςはここで性別を限定しない人間一般を指す。μηδέναの全面的な否定を「どんな人をも」で明示した。
- source_word: κοινὸν
  choice: 俗な者
  rationale: 聖なるものから区別された「普通の、俗の」という清浄規定上の含意を保ち、ἀκάθαρτοςと同じ「汚れた」に統合しなかった。
- source_word: ἢ ἀκάθαρτον
  choice: あるいは汚れた者
  rationale: 清浄・不浄の区分を表す標準的な語として「汚れた」を用い、κοινόςとの並列を保った。
theological_decisions:
- issue: ユダヤ人の境界規範と神の啓示との関係
  choice: ユダヤ人男性と異民族の人との交際や訪問が禁じられているというペトロの認識を述べたうえで、どんな人も「俗な者、あるいは汚れた者」と呼ばないよう神が示した、と訳した。
  alternative: ἀθέμιτονを単なる社会的な不作法と弱く訳す、または神の示しを食物だけに関するものとして訳す。
  rationale: 本文は境界規範を単なる礼儀に弱めずに述べつつ、幻の人間への適用をμηδένα ... ἄνθρωπονによって明言する。清浄規定の二つの語も区別して残した。
- issue: κοινόςとἀκάθαρτοςの区別
  choice: 「俗な者、あるいは汚れた者」として二つの範疇を区別した。
  alternative: 両語をともに「汚れた者」として一つの概念にまとめる。
  rationale: 原文の語彙上・神学上の緊張を保ち、ペトロの発言にあるユダヤ的な清浄用語を平板化しないため。
translation_notes:
  register: 明瞭な現代標準語を用い、ペトロの発言として丁寧で dignified な調子にした。「異民族の人」は一般読者にも意味が取りやすく、「俗な者」はやや専門的な清浄用語なので脚注で補った。
