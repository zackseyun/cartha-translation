  source_fidelity: 'The draft accurately represents the Greek structure and major lexical distinctions: Peter addresses the group emphatically, describes association with or visiting a person of another people as forbidden, and applies God''s revelation explicitly to no human being. The contrastive 「しかし」 for κἀμοί is appropriate in Japanese, and 「異民族の人」 is a defensible rendering of ἀλλοφύλῳ without prematurely restricting it to the conventional religious term 「異邦人」.'
  naturalness: The sole needed correction is 「俗な者」. Although it aims to preserve κοινός, it is not sufficiently natural or clear in contemporary standard Japanese when applied to a person; it can suggest a worldly or coarse person rather than a purity-category designation. 「清くない者」 is clear modern Japanese and, together with a precise footnote, preserves its distinction from 「汚れた者」.
  terminology: 「ペトロ」 is a standard Japanese biblical name form. 「ユダヤ人の男性」 faithfully reflects ἀνδρὶ Ἰουδαίῳ, while 「どんな人も」 correctly reflects the inclusive ἄνθρωπον. The revised paired terms maintain the distinction between κοινός and ἀκάθαρτος without imposing an interpretive doctrinal framework. Footnote anchors a and b are correctly placed and correspond to their notes.
