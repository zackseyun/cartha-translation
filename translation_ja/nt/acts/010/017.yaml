  text: Ὡς δὲ ἐν ἑαυτῷ διηπόρει ὁ Πέτρος τί ἂν εἴη τὸ ὅραμα ὃ εἶδεν, ⸀ἰδοὺ οἱ ἄνδρες οἱ ἀπεσταλμένοι ⸀ὑπὸ τοῦ Κορνηλίου διερωτήσαντες τὴν οἰκίαν ⸀τοῦ Σίμωνος ἐπέστησαν ἐπὶ τὸν πυλῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/017.yaml
  text: While Peter was inwardly perplexed as to what the vision that he had seen might mean[a], behold, the men who had been sent by Cornelius, having asked directions to Simon’s house[b], stood at the gate.
translation:
  language: ja
  text: ペトロが、自分の見た幻はいったい何を意味するのだろうかと、心の中で思い惑っていると[a]、見よ、コルネリウスから遣わされた人々が、シモンの家の場所を尋ねて、門口に立っていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「自分の見た幻はいったい何であろうか」。文脈上は、その幻の意味や意義について考えているとも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「門のところ」とも訳せる。ギリシア語は、家の門または入口一帯を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: ……していると
  rationale: 継続中の出来事を背景として、その最中に次の出来事が起きたことを自然な日本語で示す。δέの穏やかな物語上の展開も文脈に織り込んだ。
- source_word: ἐν ἑαυτῷ
  choice: 心の中で
  rationale: ペトロの困惑が内面的な思案であったことを、明瞭で自然な現代日本語で表す。
- source_word: διηπόρει
  choice: 思い惑っている
  rationale: 未完了過去の継続性と、単に考える以上の強い戸惑いを保つ。
- source_word: τί ἂν εἴη
  choice: いったい何を意味するのだろうか
  rationale: 字義的には「何であろうか」だが、文脈では幻の意味・意義を理解しようとする思案を表す。「いったい」と「だろうか」で困惑と可能・間接疑問のニュアンスを示す。
- source_word: τὸ ὅραμα ὃ εἶδεν
  choice: 自分の見た幻
  rationale: 先に見た幻を指す関係節を簡潔で自然な日本語にした。「自分の」は主語ペトロとの関係を明確にする。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面の意外な展開に読者の注意を向ける談話標識を、省略せず格調ある簡潔な表現で保持する。
- source_word: οἱ ἄνδρες οἱ ἀπεσταλμένοι ὑπὸ τοῦ Κορνηλίου
  choice: コルネリウスから遣わされた人々
  rationale: 使者が複数の男性である文脈を踏まえつつ、日本語として自然な「人々」を用い、受動の「遣わされた」を保持する。
- source_word: διερωτήσαντες τὴν οἰκίαν τοῦ Σίμωνος
  choice: シモンの家を尋ね当て
  rationale: 問い合わせを重ねて所在地を突き止め、その後に門口へ来たというアオリスト分詞の先行動作を自然に表す。
- source_word: ἐπέστησαν ἐπὶ τὸν πυλῶνα
  choice: 門口に立っていた
  rationale: 到着して入口に立ったという場面を表す。「門口」は門または入口周辺を含み得るπυλώνに適し、「立っていた」は到着後の姿を自然に描く。
theological_decisions:
- issue: τί ἂν εἴηが幻の存在・正体を問うのか、意味を問うのか
  choice: 何を意味するのだろうか
  alternative: 何であろうか
  rationale: ギリシア語の表面上の曖昧さはあるが、文脈上は幻の意義についての困惑が中心である。本文は自然な意味訳とし、より字義的な可能性を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、物語上の注意喚起語ἰδοὺは「見よ」として聖書本文にふさわしい簡潔な格調を保った。「思い惑う」は困惑の強さを伝え、「尋ね当て」は問い合わせの結果として家に到着した順序を自然に示す。
