id: ACT.10.41
reference: Acts 10:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ παντὶ τῷ λαῷ ἀλλὰ μάρτυσι τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ, ἡμῖν, οἵτινες συνεφάγομεν καὶ συνεπίομεν αὐτῷ μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/041.yaml
  text: not to all the people[a], but to witnesses who had been chosen beforehand by God—to us[b], who ate and drank with him after he rose from the dead.
translation:
  language: ja
  text: 民全体にではなく、神によってあらかじめ選ばれていた[a]証人たちに、すなわち、イエスが死者の中からよみがえった[b]後、彼と一緒に食べ、飲んだ私たちにです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神によってあらかじめ任命されていた」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエスが死者の中からよみがえらされた後」。ギリシア語はここでは「よみがえった」と訳すのが自然だが、新約聖書のほかの箇所には受動的な表現も見られる。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ παντὶ τῷ λαῷ
  choice: 民全体にではなく
  rationale: παντί と λαῷ が、現れが民の全員に及んだのではないことを示す。「民全体」は限定された証人たちとの対比を自然に保つ。
- source_word: μάρτυσι
  choice: 証人たち
  rationale: 使徒言行録で、見聞きした事実を証言する者を指す標準的で明瞭な訳語。
- source_word: τοῖς προκεχειροτονημένοις ὑπὸ τοῦ θεοῦ
  choice: 神によってあらかじめ選ばれていた
  rationale: 完了受動分詞が、神による事前の選びと、その結果が当時も有効であることを表す。「任命されていた」も可能なので脚注に示す。
- source_word: ἡμῖν
  choice: すなわち、…私たちにです
  rationale: 「証人たち」と同格で、その証人が誰かを明示する。日本語では「すなわち」によって同格関係を明瞭にした。
- source_word: οἵτινες
  choice: …した私たち
  rationale: 証人たちについて、その特徴を説明する関係節を自然な日本語の連体修飾にした。
- source_word: συνεφάγομεν καὶ συνεπίομεν αὐτῷ
  choice: 彼と一緒に食べたり飲んだりした
  rationale: συν- を伴う二つの動詞が示す食卓の交わりを具体的に保ち、復活後の身体的な出会いを明瞭に表す。
- source_word: μετὰ τὸ ἀναστῆναι αὐτὸν ἐκ νεκρῶν
  choice: イエスが死者の中からよみがえった後
  rationale: μετά を伴う冠詞付き不定詞の時間的意味を「後」とし、ここで自動詞的に用いられた ἀναστῆναι を自然な「よみがえった」と訳した。αὐτόν は日本語で指示対象を明確にするため「イエス」とした。
theological_decisions:
- issue: ἀναστῆναι αὐτὸν ἐκ νεκρῶν における復活の表現
  choice: イエスが死者の中からよみがえった後
  alternative: イエスが死者の中からよみがえらされた後
  rationale: この箇所の ἀναστῆναι は自動詞的で、「よみがえった」と訳すのが形と文脈に最も自然である。これは、ほかの箇所で明示される神の働きを否定するものではない。受動的な表現も解釈上可能なため脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「私たちにです」は前節の「現れるようにされた」を受ける原文の継続構文を保つ。単独では省略的に見えるが、前節にない動詞を本文へ補わず、節間の統語的つながりを尊重した。
