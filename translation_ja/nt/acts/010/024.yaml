source:
  edition: SBLGNT
  text: ⸂τῇ δὲ⸃ ἐπαύριον ⸀εἰσῆλθεν εἰς τὴν Καισάρειαν. ὁ δὲ Κορνήλιος ἦν προσδοκῶν αὐτοὺς συγκαλεσάμενος τοὺς συγγενεῖς αὐτοῦ καὶ τοὺς ἀναγκαίους φίλους.
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/024.yaml
  text: On the next day he entered Caesarea[a]. Now Cornelius was expecting them and had called together his relatives and close friends.
translation:
  language: ja
  text: 翌日、彼はカイサリアに入った。[a] コルネリウスは、親族や親しい友人たちをあらかじめ呼び集めて、一行を待っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、「入った」という動詞は単数形ですが、後の「一行を」に当たる代名詞は複数形です。ペトロを中心人物として述べながら、コルネリウスが待っていた相手には同行者たちも含まれていることを示していると考えられます。
    reason: 原文における単数動詞と複数代名詞の違いを説明するため。
lexical_decisions:
- source_word: τῇ δὲ ἐπαύριον
  choice: 翌日
  rationale: 定冠詞を伴うἐπαύριονの時間表現を、物語の順序が明瞭な自然な現代日本語で表した。δέは日本語では文脈上あえて訳語を置かなくても場面の推移が伝わる。
- source_word: εἰσῆλθεν
  choice: 彼は…入った
  rationale: アオリスト能動直説法三人称単数をそのまま単数で訳し、中心人物であるペトロに焦点を当てる原文の形を保持した。
- source_word: Καισάρειαν
  choice: カイサリア
  rationale: 日本語聖書で広く通用する地名表記を採用した。
- source_word: ὁ δὲ Κορνήλιος
  choice: コルネリウスは
  rationale: δέは視点の穏やかな転換を示すため、主題提示の「は」で自然に表現し、強い逆接を持ち込まなかった。
- source_word: ἦν προσδοκῶν
  choice: 待っており
  rationale: 迂言的未完了形が示す継続中の期待を、自然な日本語で表した。目的語が人であるため「待っている」が明瞭である。
- source_word: αὐτούς
  choice: 一行を
  rationale: 原文の複数代名詞を保持しつつ、日本語で指示対象が明瞭になるよう、ペトロと同行者たちを指す「一行」とした。
- source_word: συγκαλεσάμενος
  choice: 呼び集めていた
  rationale: コルネリウスが待つに先立って人々を招集したことを、継続する場面描写の中で自然に示した。
- source_word: τοὺς συγγενεῖς αὐτοῦ
  choice: 親族
  rationale: 血縁者を指す語を、現代の標準的で簡潔な語で訳した。
- source_word: τοὺς ἀναγκαίους φίλους
  choice: 親しい友人たち
  rationale: ἀναγκαῖοςがφίλοςを修飾して表す親密な友人という慣用的意味を採り、字義的な「必要な」を避けた。
theological_decisions:
- issue: 単数のεἰσῆλθενと複数のαὐτούςの対応
  choice: 前半を「彼は」、後半を「一行を」として数の違いを保持した。
  alternative: 両方を複数化して「一行は…入った」とする。
  rationale: 原文は入城の動詞を単数としながら、コルネリウスが待っていた対象を複数としている。ペトロを中心人物として前景化しつつ同行者も含める緊張を解消せずに残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」は直前の文脈上ペトロを指す。原文の数の違いを本文と脚注で保持し、過度な説明を本文に加えなかった。
