revisions:
- from: そこでコルネリウスは言った。「四日前の今ごろ、私は家で第九時[a]の祈りをしていました。すると、見よ、輝く衣を着た人が私の前に立ち、」
  to: コルネリウスは言った。「四日前の今ごろ、私は家で第九時[a]に祈っていました。すると、輝く衣を着た一人の男性が私の前に立ち、」
  rationale: 時間句を「第九時に祈っていました」と改め、原文が祈りの時刻を述べることを明確にしました。ἀνήρの男性性を「一人の男性」で保持し、「すると、見よ」は明瞭で現代的な「すると」に整えました。原文の時間的曖昧さを不必要に四日間の継続祈祷として読ませない「四日前の今ごろ」は維持しています。節が次節へ構文上続くため、末尾の読点も維持しました。
