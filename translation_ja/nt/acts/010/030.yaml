id: ACT.10.30
reference: Acts 10:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ Κορνήλιος ἔφη· Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας ⸀ἤμην τὴν ⸀ἐνάτην προσευχόμενος ἐν τῷ οἴκῳ μου, καὶ ἰδοὺ ἀνὴρ ἔστη ἐνώπιόν μου ἐν ἐσθῆτι λαμπρᾷ
base_translation:
  language: en
  yaml_path: translation/nt/acts/010/030.yaml
  text: And Cornelius said, “Four days ago, up to this hour, I was praying at the ninth hour in my house, and behold, a man stood before me in bright clothing.”
translation:
  language: ja
  text: コルネリウスは言った。「四日前の今ごろ、私は家で第九時[a]に祈っていました。すると、輝く衣を着た一人の男性が私の前に立ち、」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、午後三時ごろ。
    reason: 古代の時刻表現を現代の読者向けに説明する文化注。
lexical_decisions:
- source_word: ἔφη
  choice: 言った
  rationale: 物語中のアオリストの発話導入として、自然で簡潔な現代日本語にした。
- source_word: Ἀπὸ τετάρτης ἡμέρας μέχρι ταύτης τῆς ὥρας
  choice: 四日前の今ごろ
  rationale: 直訳的な「四日前からこの時刻まで」は日本語では継続期間を強く示して後続の祈りまで四日間続いたかのように響くため、四日前の同じ時刻を指す慣用的意味を自然に表した。
- source_word: ἤμην ... προσευχόμενος
  choice: 祈りをしていました
  rationale: 迂言的未完了形が示す、その時点で進行中だった祈りを自然な日本語で表現した。
- source_word: τὴν ἐνάτην
  choice: 第九時
  rationale: 原文の時刻表現を本文に保持し、現代時刻の目安は脚注に置いた。
- source_word: ἐν τῷ οἴκῳ μου
  choice: 家で
  rationale: 場所を表す自然な日本語であり、οἶκοςの物理的な住居の意味を保つ。
- source_word: ἰδοὺ
  choice: すると、見よ
  rationale: 出来事の突然さと語りの鮮明さを示す談話機能を保持した。
- source_word: ἀνὴρ
  choice: 人
  rationale: 日本語の「人」は文脈上自然で、男性の姿をした人物を指し得る。必要以上に正体を「天使」と明示しない。
- source_word: ἔστη ἐνώπιόν μου
  choice: 私の前に立ち
  rationale: 人物がコルネリウスの面前に立ったという原文の位置と動作を直接表した。
- source_word: ἐν ἐσθῆτι λαμπρᾷ
  choice: 輝く衣を着た
  rationale: λαμπρόςの光輝とἐσθήςの衣服を、明瞭で品位ある日本語で表した。
theological_decisions:
- issue: τὴν ἐνάτην の時刻表現
  choice: 第九時
  alternative: 午後三時ごろ
  rationale: 原文文化の時刻呼称を本文に残し、現代の時刻換算は脚注で補うことで、原文への忠実さと理解しやすさを両立させた。
- issue: ἀνὴρ の人物同定
  choice: 人
  alternative: 天使
  rationale: この節は見えた姿を「人」と述べており、その正体を本文内で先取りして確定しない。
translation_notes:
  register: 明瞭で現代的、かつ朗読にも適した品位ある文体。「見よ」は原文の鮮明化表現を保つため意図的に残した。節が次節へ続くため、末尾は読点とした。
