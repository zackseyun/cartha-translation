  yaml_path: translation/nt/acts/010/006.yaml
  text: He is lodging with a certain Simon[a], a tanner, whose house is by the sea.
translation:
  language: ja
  text: この人は、海辺に家のある一人の皮なめし職人、シモンのところに滞在している。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: この人
  rationale: 直前に言及された人物を指す指示代名詞であり、日本語では文脈上の指示を明確にするため「この人」とした。
- source_word: ξενίζεται
  choice: 滞在している
  rationale: 客として迎えられて宿泊していることを表す中動態・受動態形。現代日本語として自然で、単なる一時的位置以上の滞在を示す。
- source_word: παρά τινι Σίμωνι
  choice: シモンという人のところに
  rationale: παρά＋与格の、人のもと・家での滞在という関係と、τιςの不特定性を自然な日本語で表した。
- source_word: βυρσεῖ
  choice: 皮なめし職人
  rationale: 獣皮をなめして革に加工する職人を指すため、広い意味の「革職人」より具体的な訳語を選んだ。
- source_word: ᾧ ἐστιν οἰκία
  choice: 家を持つ
  rationale: 直訳的には「その人に家がある」。所有関係を簡潔で自然な日本語にした。
- source_word: παρὰ θάλασσαν
  choice: 海辺に
  rationale: παρά＋対格が表す海のそばという位置関係を、簡潔で自然に表現した。
