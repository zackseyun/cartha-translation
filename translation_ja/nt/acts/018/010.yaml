  text: διότι ἐγώ εἰμι μετὰ σοῦ καὶ οὐδεὶς ἐπιθήσεταί σοι τοῦ κακῶσαί σε, διότι λαός ἐστί μοι πολὺς ἐν τῇ πόλει ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/010.yaml
  text: because I am with you[a], and no one will attack you to harm you[b], because I have many people in this city.
translation:
  language: ja
  text: わたしがあなたと共にいるので、だれもあなたを襲って危害を加えることはない。わたしには、この町に多くの人々がいるからだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしには、この町に多くの人々がいる」は、コリントにいる主に属する人々を指し、これから信じる人々をも含むと理解されることが多い。
    reason: cross_reference
lexical_decisions:
- source_word: διότι
  choice: ので／からである
  rationale: 二度の διότι の因果関係を明確にしつつ、同じ語尾の反復を避けた自然な現代日本語とした。前者は直前の命令の理由、後者は保護の約束の根拠を示す。
- source_word: ἐγώ εἰμι μετὰ σοῦ
  choice: わたしがあなたと共にいる
  rationale: 明示された ἐγώ の強調を主格助詞「が」で自然に表し、神の臨在の保証を簡潔に保った。
- source_word: οὐδεὶς ἐπιθήσεταί σοι
  choice: 誰もあなたを襲って…ことはない
  rationale: ἐπιτίθημι と与格がこの文脈で表す敵対的行為を、明瞭で過度に慣用的でない日本語にした。未来の否定は「ことはない」で保証として表した。
- source_word: τοῦ κακῶσαί σε
  choice: 危害を加える
  rationale: 冠詞付き不定詞が示す目的・結果を、攻撃による害を広く含む自然な表現で訳した。
- source_word: λαός
  choice: 民
  rationale: 単なる都市人口ではなく、話者に属する集合的な人々という含みを保つため「人々」より「民」を選んだ。ただし、その人々がすでに信じているか、後に信じる者を含むかは本文で限定しない。
- source_word: ἐστί μοι πολὺς
  choice: わたしには…多くの…がいる
  rationale: 所有を示す与格 μοι と εἰμί を、日本語で自然な存在・所属表現にした。語順を大きく崩さず「多くの民」を数量表現として保った。
- source_word: ἐν τῇ πόλει ταύτῃ
  choice: この町に
  rationale: コリントという都市を指すが、現代日本語の聖書文体として自然な「町」を採用し、指示詞 ταύτῃ も明示した。
theological_decisions:
- issue: 「この町に多くの民がいる」の意味
  choice: 主に属する者たちを指す語として「民」と訳し、将来信じる者を含む可能性は注で示す
  alternative: すでにパウロに好意的な多数の住民だけを指すと理解する
  rationale: λαός と μοι の組み合わせは主への所属を示唆するが、本文自体は、すでに信じている者と今後信じる者の範囲を明示しない。その緊張を本文で解消せず、解釈上の可能性を脚注に置いた。
- issue: 保護の約束の範囲
  choice: 「襲って危害を加えることはない」と訳す
  alternative: 一切の敵対行為や接触が起こらないという絶対的保証と訳す
  rationale: ἐπιθήσεταί…τοῦ κακῶσαι は危害を目的・結果とする敵対的行為を否定する。反対や法的訴えまで一切起こらないとは本文が述べていないため、その範囲を不必要に拡張しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「共にいる」「民」は聖書的含意を保持しつつ一般読者にも理解可能な語とした。脚注記号 [a] は対応する文の末尾に置いた。
