  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγοντες ὅτι Παρὰ τὸν νόμον ⸂ἀναπείθει οὗτος⸃ τοὺς ἀνθρώπους σέβεσθαι τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/013.yaml
  text: saying[b][a], “This man is persuading people to worship God contrary to the law.”
translation:
  language: ja
  text: こう言った。「この男は、律法[a][b]に反して、神を礼拝するように人々を説得している。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法に逆らって」または「律法に違反して」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 告発者たちはユダヤ人の律法を指していると考えられるが、ギリシア語本文は単に「律法」としている。
    reason: cultural_note
lexical_decisions:
- source_word: λέγοντες ὅτι
  choice: こう言った。「…」
  rationale: 分詞で告発内容を導入する構文を、前後の叙述につながる自然な日本語の直接話法で表した。
- source_word: Παρὰ τὸν νόμον
  choice: 律法に反して
  rationale: παρά＋対格が示す規範への背反を、法的な告発の響きを保つ簡潔な表現とした。
- source_word: ἀναπείθει
  choice: 説き伏せています
  rationale: 人に働きかけて同意・行動へ導く語義を表しつつ、原文が必ずしも含まない「惑わす」という否定的意味は加えなかった。現在形の継続的な告発も反映した。
- source_word: οὗτος
  choice: この男
  rationale: 告発の場で相手を指し示す指示語の力を保ち、過度に侮蔑的な表現は避けた。
- source_word: τοὺς ἀνθρώπους
  choice: 人々
  rationale: ここでは性別を限定しない総称なので、現代日本語で自然な「人々」とした。
- source_word: σέβεσθαι τὸν θεόν
  choice: 神を礼拝する
  rationale: この文脈のσέβομαιは神への宗教的崇敬・礼拝を表すため、明瞭で一般的な表現を選んだ。
- source_word: τὸν νόμον
  choice: 律法
  rationale: 文脈上はユダヤ人の律法を指す可能性が高く、日本語聖書語彙として自然な「律法」を用いた。ただし原文は単に定冠詞付きの「法／律法」であり、本文に「ユダヤ人の」は補わない。
theological_decisions:
- issue: 告発における「律法」の指示対象
  choice: 本文では「律法」とし、「ユダヤ人の律法」と明示しない。
  alternative: ユダヤ人の律法／私たちの律法
  rationale: 告発者がユダヤ人の律法を念頭に置いている可能性は高いが、ギリシア語本文はτὸν νόμονとだけ述べる。そのため指示対象の説明は脚注にとどめ、原文の含みを保持した。
- issue: ἀναπείθειの評価的含意
  choice: 説き伏せています
  alternative: 惑わしています／説得しています
  rationale: 告発という文脈の圧力は保ちつつも、語そのものが要求しない道徳的非難を付加しない。「説得する」より働きかけの強さを示し、「惑わす」ほど解釈的ではない表現とした。
translation_notes:
  register: 明瞭な現代標準語を用い、法廷での告発にふさわしい簡潔で品位ある調子とした。「説き伏せています」によって継続中の行為としての告発を表し、本文末に脚注標識[a][b]を明示した。
