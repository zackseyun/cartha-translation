id: ACT.18.23
reference: Acts 18:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ποιήσας χρόνον τινὰ ἐξῆλθεν, διερχόμενος καθεξῆς τὴν Γαλατικὴν χώραν καὶ Φρυγίαν, ⸀στηρίζων πάντας τοὺς μαθητάς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/023.yaml
  text: And after spending some time there[a], he departed and traveled from place to place through the Galatian region and Phrygia, strengthening all the disciples.
translation:
  language: ja
  text: しばらく過ごした後、彼は出発し、ガラテヤ地方とフリギアを順に巡って[a]、すべての弟子たちを力づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「次々に通って」。
    reason: καθεξῆςは、順序に沿って、または次々と進むことを表し得る。
lexical_decisions:
- source_word: ποιήσας χρόνον τινά
  choice: しばらく過ごした後
  rationale: ποιέωとχρόνοςによる「時を過ごす」という慣用表現を、自然な現代日本語で表した。滞在場所は文脈から分かるため、原文に明示されない「そこで」は補わなかった。
- source_word: ἐξῆλθεν
  choice: 彼は出発し
  rationale: 旅行記事における「出て行く、立ち去る」の意味を、次の巡回へ移る文脈に即して「出発する」とした。
- source_word: διερχόμενος καθεξῆς
  choice: 順に巡って
  rationale: διέρχομαιの地域を通って進む動作と、καθεξῆςの連続的・順次的な進行を簡潔に表した。「巡る」は各地を訪ね歩く文脈に自然だが、καθεξῆςの表現には幅があるため脚注を付した。
- source_word: τὴν Γαλατικὴν χώραν
  choice: ガラテヤ地方
  rationale: χώραは広がりのある地域・地方を表すため、行政区分を過度に限定しない「地方」とした。
- source_word: καὶ Φρυγίαν
  choice: とフリギア
  rationale: 固有地名を慣用的に音写した。日本語では前項の「地方」の意味が自然に及ぶため、「フリギア地方」と重ねなかった。
- source_word: στηρίζων
  choice: 力づけた
  rationale: στηρίζωの「堅くする、強める」という意味を、弟子たちへの継続的な牧会的働きとして自然に表した。「確立した」のように教理的意味へ限定しない。
- source_word: πάντας τοὺς μαθητάς
  choice: すべての弟子たち
  rationale: πάνταςを「すべての」で保持し、μαθηταίは使徒言行録におけるイエスの従者を指す標準的な語「弟子たち」とした。
