  text: ἐκάθισεν ⸀δὲ ἐνιαυτὸν καὶ μῆνας ἓξ διδάσκων ἐν αὐτοῖς τὸν λόγον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/011.yaml
  text: So he stayed there a year and six months, teaching the word of God among them.
translation:
  language: ja
  text: こうして、パウロは一年六か月そこにとどまり、彼らの間で神のことばを教え続けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάθισεν
  choice: そこにとどまり
  rationale: 字義的には「座った」だが、この文脈では一定期間その場所に滞在することを表す慣用的用法。「そこにとどまり」とすることで、自然な日本語で継続的な滞在を示した。
- source_word: δὲ
  choice: こうして
  rationale: 弱い接続辞であり、直前の主の励ましを受けた物語の進展を示す。「こうして」は強い因果関係を断定せず、文脈の流れを自然に伝える。
- source_word: ἐνιαυτὸν καὶ μῆνας ἓξ
  choice: 一年六か月
  rationale: 期間を表す対格を、簡潔で自然な現代日本語にした。
- source_word: διδάσκων
  choice: 教え続けた
  rationale: 現在分詞が滞在中に継続して行われた同時的行為を表すため、日本語では「続けた」によってその継続性を明確にした。
- source_word: ἐν αὐτοῖς
  choice: 彼らの間で
  rationale: ἐνと複数代名詞の社会的・場所的意味を保ち、共同体の中で教えたことを自然に表した。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: 使徒言行録で神からの宣教のメッセージを指す定着した聖書的表現を保ちつつ、現代の読者にも理解しやすい形とした。
- source_word: implicit subject
  choice: パウロは
  rationale: ギリシア語では動詞に含まれる主語を、日本語で文脈上明確にするため補った。指示代名詞だけより読みやすく、指示対象も曖昧にならない。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、聖書本文にふさわしい簡潔で落ち着いた調子とした。「みことば」のような特定の教会語には寄せず、「神のことば」とした。
