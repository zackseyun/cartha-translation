  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀντιτασσομένων δὲ αὐτῶν καὶ βλασφημούντων ἐκτιναξάμενος τὰ ἱμάτια εἶπεν πρὸς αὐτούς· Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν· καθαρὸς ἐγώ· ἀπὸ τοῦ νῦν εἰς τὰ ἔθνη πορεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/006.yaml
  text: But when they opposed and reviled him, he shook out his garments and said to them, “Your blood be on your own heads. I am innocent. From now on I will go to the Gentiles.”
translation:
  language: ja
  text: しかし、彼らが反対し、冒瀆的なことを言ったので[a]、パウロは衣を振り払って彼らに言った。「あなたがたの血は、あなたがた自身の頭にかかるのだ[b]。私には責任がない。これからは私は異邦人のもとへ行く[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「冒瀆的なことを言った」と訳したギリシア語は、神聖なものを冒瀆することにも、人を激しくののしることにも用いられる。ここでは、その発言の対象は明示されていない。
    reason: lexical_alternative
  - marker: b
    text: 「血が自分の頭にかかる」とは、その結果についての責任がその人自身にある、という意味の表現。
    reason: cultural_note
  - marker: c
    text: 「異邦人」は直訳すると「諸国民」。ここではユダヤ人ではない人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιτασσομένων
  choice: 反抗し
  rationale: パウロの宣教に敵対して立ち向かう能動的な態度を、簡潔で自然な現代日本語で表す。
- source_word: βλασφημούντων
  choice: 冒瀆する言葉を口にした
  rationale: 目的語が明示されていないため「パウロを侮辱した」と補わず、神聖な事柄への冒瀆にも悪罵にもなり得る語の幅を保つ。
- source_word: ἐκτιναξάμενος τὰ ἱμάτια
  choice: 衣を振り払って
  rationale: 関係を断ち責任を負わないことを示す象徴的な身ぶりを、原文の具体性を保ちながら自然に表す。
- source_word: Τὸ αἷμα ὑμῶν ἐπὶ τὴν κεφαλὴν ὑμῶν
  choice: あなたがたの血は、あなたがた自身の頭にかかれ
  rationale: 結果への責任が聞き手自身に帰するという厳粛な責任宣言を、比喩を崩さず訳す。
- source_word: καθαρὸς ἐγώ
  choice: 私には責任がない
  rationale: 直訳の「私は清い」がここで示す、他者の血について罪責を負わないという比喩的意味を明確にする。
- source_word: ἀπὸ τοῦ νῦν
  choice: 今から
  rationale: 宣教の向かう先がここで転換することを、簡潔な現代語で示す。
- source_word: εἰς τὰ ἔθνη
  choice: 異邦人のもとへ
  rationale: 会堂のユダヤ人と対照される非ユダヤ人を指す文脈上の意味を表す。
- source_word: πορεύσομαι
  choice: 行く
  rationale: 将来の意志と移動を、過度に説明せず自然に表す。
theological_decisions:
- issue: 「あなたがたの血は、あなたがた自身の頭にかかれ」という責任の表現
  choice: 福音を拒んだ結果への責任が聞き手にあり、パウロにはないという厳粛な宣言として訳す。
  alternative: より強い呪いの言葉として解する。
  rationale: 聖書に見られる血の責任という背景に沿い、比喩そのものを残しつつ、原文以上に呪詛の意味を強めない。
- issue: βλασφημούντων の対象
  choice: 対象を補わず「冒瀆する言葉を口にした」とする。
  alternative: 「パウロをののしった」または「神を冒瀆した」と対象を特定する。
  rationale: ギリシア語本文には目的語がなく、パウロ、その宣教、あるいは神聖な事柄に向けた発言かを明示していないため、その曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、発言部分には厳粛さを保った。「衣」「血は頭にかかれ」という聖書的な具体表現は残し、καθαρὸς の比喩だけは文脈上の意味が伝わるよう「責任がない」とした。
