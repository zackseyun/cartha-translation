  text: Γαλλίωνος δὲ ⸂ἀνθυπάτου ὄντος⸃ τῆς Ἀχαΐας κατεπέστησαν ⸂ὁμοθυμαδὸν οἱ Ἰουδαῖοι⸃ τῷ Παύλῳ καὶ ἤγαγον αὐτὸν ἐπὶ τὸ βῆμα,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/012.yaml
  text: But while Gallio was proconsul of Achaia[a], the Jews rose up together against Paul and brought him before the tribunal[b],
translation:
  language: ja
  text: ところが、ガリオがアカイア州の属州総督であった時、ユダヤ人たちは[a]パウロに対して一斉に立ち向かい、彼を法廷[b]へ連れて行き、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「ユダヤ人たち」は、パウロに反対して行動した現地のユダヤ人の一団を指し、あらゆる時代・場所のユダヤ人全体を指すものではない。
    reason: cultural_note
  - marker: b
    text: 別訳「裁判の座へ」。ギリシア語は、公的な裁判壇、またはそこで行われる裁判の場を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ところが
  rationale: 新しい状況への移行と、その後に起こる反対行動との穏やかな対照を自然な現代日本語で示す。
- source_word: Γαλλίωνος
  choice: ガリオ
  rationale: ギリシア語の固有名を日本語で定着した形に音写した。
- source_word: ἀνθυπάτου ὄντος τῆς Ἀχαΐας
  choice: ガリオがアカイア州の総督であった時
  rationale: 属格独立構文の時間的意味を明確にし、ἀνθύπατοςがローマの属州統治官職を指すことを、一般読者に分かる「総督」で表した。
- source_word: κατεπέστησαν
  choice: 敵対して立ち上がり
  rationale: パウロに対する敵対的な行動開始を表しつつ、本文が明記しない身体的暴力までは読み込まない。
- source_word: ὁμοθυμαδὸν
  choice: 一斉に
  rationale: 集団が心を合わせて同時に行動した意味を、簡潔で自然な日本語にした。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たちは
  rationale: 原文の明示的な表現を狭めずに訳し、具体的な文脈上の範囲は脚注で説明する。
- source_word: τῷ Παύλῳ
  choice: パウロに敵対して
  rationale: κατεπέστησανと結び付く与格を、敵対行動の対象として明確に表した。
- source_word: ἤγαγον αὐτὸν
  choice: 彼を……連れて行き
  rationale: 法的な場へ移動させたことを中立的に表し、「引きずった」など原文以上に強い暴力性を加えない。
- source_word: ἐπὶ τὸ βῆμα
  choice: 法廷へ
  rationale: βῆμαはこの文脈では公的な裁判の席または裁判壇を指すため、現代の一般読者に司法的場面が明瞭な「法廷」とした。
theological_decisions:
- issue: 対立記事における οἱ Ἰουδαῖοι の範囲
  choice: ユダヤ人たちは
  alternative: ユダヤ人の指導者たちは／ユダヤ地方の人々は
  rationale: 原文は指導者に限定しておらず、民族・宗教集団全体を普遍的に断罪してもいない。本文では原語に忠実な表現を保ち、この場で行動した地元の集団を指すことを脚注で明確にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。節末の「連れて行き、」は、次節の告発の言葉へ続く原文の構文を保持する。
