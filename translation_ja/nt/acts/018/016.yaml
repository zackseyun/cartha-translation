lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 物語の展開を示す単純な接続として、自然な現代日本語の「そして」とした。
- source_word: ἀπήλασεν
  choice: 追い払った
  rationale: 権威をもってその場から退かせるという、ἀπελαύνωの強い動作を保つ。「退廷させた」よりも原文の具体的な力強さが伝わる。
- source_word: αὐτοὺς
  choice: 彼らを
  rationale: 文脈上の告発者たちを指す代名詞であり、原文どおり対象を明示しすぎない。
- source_word: ἀπὸ τοῦ βήματος
  choice: 裁判席から
  rationale: βῆμαはこの文脈では、地方総督が裁判を行う公式の席またはその法廷を指す。「裁判席」は司法的な場面を明確にしつつ、席と法廷空間の含みを保つ。
