  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡς δὲ κατῆλθον ἀπὸ τῆς Μακεδονίας ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος, συνείχετο τῷ ⸀λόγῳ ὁ Παῦλος, διαμαρτυρόμενος τοῖς Ἰουδαίοις ⸀εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/005.yaml
  text: But when Silas and Timothy came down from Macedonia[a], Paul was occupied with the word[b], solemnly testifying to the Jews that Jesus is the Messiah.
translation:
  language: ja
  text: しかし、シラスとテモテがマケドニアから下って来ると、パウロはことばに専念しながら[a]、ユダヤ人たちに、イエスこそメシア[b]であると力を込めて証言していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ことばに促されていた」または「知らせに没頭していた」。ギリシア語の動詞は、何かにすっかり心を向けることにも、それに強く迫られることにも用いられる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語「キリスト」。ここでは固有名ではなく称号として用いられているため、「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς δὲ
  choice: しかし、…すると
  rationale: δέの接続とὡςの時を表す働きを、自然な現代日本語の場面転換として表した。文脈上の軽い対照も「しかし」で保持した。
- source_word: κατῆλθον ἀπὸ τῆς Μακεδονίας
  choice: マケドニアから下って来る
  rationale: κατέρχομαιの移動表現「下って来る」を保ち、ルカの旅行叙述の言い回しを反映した。
- source_word: ὅ τε Σιλᾶς καὶ ὁ Τιμόθεος
  choice: シラスとテモテ
  rationale: τε…καίが二人を一組として挙げることは、日本語の自然な並列表現で十分伝わる。
- source_word: συνείχετο
  choice: 専念し
  rationale: 未完了過去の中・受動形が示し得る「すっかり心を向ける、取り組む」という文脈上の意味を自然に表した。ただし「促されていた」「圧倒されていた」という可能性も脚注に残した。
- source_word: τῷ λόγῳ
  choice: ことばに
  rationale: 与格を、パウロが専念した対象・領域として訳した。λόγοςを透明に残しつつ、ここでは福音の知らせを指すルカ的用法である。
- source_word: διαμαρτυρόμενος
  choice: 力を込めて証言していた
  rationale: 単なる証言よりも強く、真剣に証しするδιαμαρτύρομαιの強意を、自然な日本語で表した。主動詞の未完了的な継続性も「していた」で示した。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たちに
  rationale: この文脈では地域名としての「ユダヤ人」ではなく、民族的・宗教的集団を指す直接的な訳が適切である。
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: イエスこそメシアである
  rationale: 冠詞付きのχριστόςはここで称号として述語的に用いられている。「こそ」によって、イエスが待望のメシアであるという同定の力点を自然に示した。
theological_decisions:
- issue: Χριστόςを称号として訳すか、固有名に近い形で訳すか
  choice: メシア
  alternative: キリスト
  rationale: ユダヤ人への宣言において冠詞付き・述語的位置で用いられ、油注がれた者という称号の意味が前面に出ているため、「メシア」とした。
- issue: συνείχετοの動因を明示するか
  choice: ことばに専念し
  alternative: ことばに促されていた／ことばに圧倒されていた
  rationale: この形には「専心する」と「圧迫される・駆り立てられる」の幅がある。本文では文脈に適した中立的な表現を用い、霊的な強制など特定の動因を本文に読み込まず、別訳を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用い、「みことば」のような教会内に限定されやすい表記を避けて「ことば」とした。「力を込めて証言していた」により、厳粛さ・強意と継続的な活動を、過度に硬くならない形で表現した。
