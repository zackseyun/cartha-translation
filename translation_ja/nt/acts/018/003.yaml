  text: καὶ διὰ τὸ ὁμότεχνον εἶναι ἔμενεν παρ’ αὐτοῖς καὶ ⸀ἠργάζετο, ἦσαν γὰρ σκηνοποιοὶ ⸂τῇ τέχνῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/003.yaml
  text: And because he was of the same trade[a], he stayed with them and worked, for they were tentmakers by trade.
translation:
  language: ja
  text: 同じ職業だったので、パウロは彼らのもとに滞在し、働いた。彼らは職業として天幕を作る者だった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「革細工職人」とも考えられる。このギリシア語は、天幕を作る人だけでなく、それに関連する職人を広く指す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ ὁμότεχνον εἶναι
  choice: 同じ職人だったので
  rationale: διά＋冠詞付き不定詞が表す理由を「ので」で明示し、ὁμότεχνοςを、同じ技術職に携わる者という意味で自然な日本語にした。文脈上の主語パウロを補って明確にした。
- source_word: ἔμενεν παρ’ αὐτοῖς
  choice: 二人のもとに滞在して
  rationale: μένωの継続的な滞在を「滞在する」で表した。παρ’ αὐτοῖςは直前のアキラとプリスキラを指すため、「二人のもとに」とした。
- source_word: ἠργάζετο
  choice: 一緒に働いた
  rationale: ἐργάζομαιの職業上の労働という意味を簡潔に表現した。「一緒に」は同業ゆえに彼らのもとで働いたという文脈上の関係を自然に示す。未完了過去の継続性は「滞在して」と連なる叙述全体で伝わる。
- source_word: σκηνοποιοὶ
  choice: 天幕作り
  rationale: 語の伝統的かつ有力な意味である「天幕作り」を本文に採用した。ただし革細工など関連する職種をより広く指す可能性は脚注に残した。
- source_word: τῇ τέχνῃ
  choice: 職業としていた
  rationale: τέχνηがここでは技術・手仕事に基づく職業を指すことを、現代日本語で明瞭にした。単発の作業ではなく生業であったことが伝わる。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文として落ち着いた語調を保った。「テント」よりも文体上の品位と古代の職業的背景に適する「天幕」を選んだ。脚注記号[a]は、語義に幅のある「天幕作り」の直後ではなく文末に置き、節全体を読みやすくした。
