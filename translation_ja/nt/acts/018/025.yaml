id: ACT.18.25
reference: Acts 18:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτος ἦν κατηχημένος τὴν ὁδὸν τοῦ κυρίου, καὶ ζέων τῷ πνεύματι ἐλάλει καὶ ἐδίδασκεν ἀκριβῶς τὰ περὶ τοῦ ⸀Ἰησοῦ, ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/025.yaml
  text: This man had been instructed in the way of the Lord[a], and being fervent in spirit, he was speaking and teaching accurately the things concerning Jesus, knowing only the baptism of John.
translation:
  language: ja
  text: この人は主の道について教えを受けており、霊に燃えて[a]、イエスに関することを正確に語り、教えていたが、知っていたのはヨハネの洗礼だけであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊」は、アポロ自身の内なる霊を指すとも、聖霊を指すとも理解できる。後者なら「聖霊に燃えて」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: κατηχημένος
  choice: 教えを受けており
  rationale: 完了受動分詞が示す、以前に授けられ今も身についている教えを自然な現代日本語で表す。「教理教育を受けた」など後代の専門的含意は避けた。
- source_word: τὴν ὁδὸν τοῦ κυρίου
  choice: 主の道について
  rationale: 初期キリスト教における「道」という表現を保ち、対格が教えの内容を示すことを自然な助詞「について」で表した。
- source_word: ζέων τῷ πνεύματι
  choice: 霊に燃えて
  rationale: ζέωの沸き立つような熱意を「燃えて」で表した。πνεῦμαが本人の内なる霊か聖霊かはギリシア語だけでは確定しないため、本文では「霊」とし、注で両義性を示す。
- source_word: ἐλάλει καὶ ἐδίδασκεν
  choice: 語り、教えていた
  rationale: 二つの未完了過去が表す継続的・反復的な活動を「〜ていた」で表し、λαλέωとδιδάσκωの区別も保った。
- source_word: ἀκριβῶς
  choice: 正確に
  rationale: 教えの正確さ、精密さを示す語として、文脈に最も合う自然な訳語を選んだ。
- source_word: τὰ περὶ τοῦ Ἰησοῦ
  choice: イエスに関すること
  rationale: イエスについての事柄全般という広がりを狭めず、自然な日本語で表した。
- source_word: ἐπιστάμενος μόνον τὸ βάπτισμα Ἰωάννου
  choice: 知っていたのはヨハネの洗礼だけであった
  rationale: 分詞の意味を保ちながら、アポロの知識の限界を明瞭な日本語で表した。文脈上の対照は「〜だけ」で十分に伝わるため、「にもかかわらず」などを加えなかった。
theological_decisions:
- issue: ζέων τῷ πνεύματι の τῷ πνεύματι が人間の霊を指すか、聖霊を指すか
  choice: 本文を「霊に燃えて」とし、指示対象を確定しない
  alternative: 「御霊によって燃え立ち」として聖霊への言及と解する
  rationale: ギリシア語には両方の理解が可能であり、日本語本文で一方に限定すると原文の神学的緊張を失うため、曖昧さを保って注記した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の継続的な叙述と「正確な教え」と「ヨハネの洗礼だけを知ること」の緊張を保ち、πνεῦμαの指示対象は注で明示的に開いたままとした。
