id: ACT.18.22
reference: Acts 18:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κατελθὼν εἰς Καισάρειαν, ἀναβὰς καὶ ἀσπασάμενος τὴν ἐκκλησίαν, κατέβη εἰς Ἀντιόχειαν,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/022.yaml
  text: And after going down to Caesarea[a], he went up and greeted the church, then went down to Antioch.
translation:
  language: ja
  text: そして、カイサリアに下り、上って教会に挨拶をしてから、アンティオキアに下った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελθὼν
  choice: 下り
  rationale: アオリスト分詞として主動詞に先立つ移動を表す。「下る」として、ルカの地理的・方向的な表現を保った。
- source_word: Καισάρειαν
  choice: カイサリア
  rationale: 日本語聖書で一般的な地名表記。文脈上、海沿いのカイサリアを指す。
- source_word: ἀναβὰς
  choice: そこから上って
  rationale: 方向を示す語義を保ちつつ、日本語として移動の連続が分かるよう「そこから」を補った。行き先はギリシア語本文に明記されていないため、エルサレムとは訳文中で特定しない。
- source_word: ἀσπασάμενος
  choice: あいさつし
  rationale: 基本的な意味を直接表し、「訪問した」などの解釈的な言い換えを避けた。
- source_word: τὴν ἐκκλησίαν
  choice: 教会の人々
  rationale: 共同体にあいさつするという日本語として自然にするため「教会の人々」とした。建物ではなく信徒共同体を指す原意を明確にする。
- source_word: κατέβη
  choice: 下った
  rationale: ルカが用いる方向・地勢を示す表現を保った。
- source_word: Ἀντιόχειαν
  choice: アンティオキア
  rationale: 日本語で一般的な音写。文脈上シリアのアンティオキアだが、本文と同様に短い地名だけを示す。
theological_decisions:
- issue: 「上って」の暗黙の行き先をエルサレムと明示するか
  choice: 本文では行き先を明示しない
  alternative: 「エルサレムに上り」と訳す
  rationale: カイサリアから上り、教会にあいさつしてアンティオキアへ下るという順序から、エルサレム訪問である可能性は高い。しかし、ギリシア語本文はエルサレムを明記していないため、本文では含意を保ち、注で説明する。
translation_notes:
  register: 明快で現代的ながら品位のある叙述体。「上る／下る」という原文の方向表現を保ち、明記されていない行き先は補わない。
