revisions:
- from: そこで、皆は会堂司ソステネを捕らえ[a]、法廷の前で殴り続けた。しかし、ガリオはこれらのことを少しも気に留めなかった。
  to: そこで、皆が会堂の指導者ソステネを捕らえ[a]、裁判席の前で殴り続けた。しかし、ガリオはこれらのことを少しも気に留めなかった。
  rationale: 原文の曖昧なπάντεςを本文で特定せず、未完了過去ἔτυπτονの継続性も「殴り続けた」で維持しました。その上で、現代日本語としての自然さと明瞭さのため、「皆が」「会堂の指導者」とし、βῆμαを「裁判席」としました。脚注は本文の集団同定を避けるという本文批評上の要点を保持しつつ、日本語を整えています。
