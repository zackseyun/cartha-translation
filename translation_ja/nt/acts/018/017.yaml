source:
  edition: SBLGNT
  text: ἐπιλαβόμενοι δὲ ⸀πάντες Σωσθένην τὸν ἀρχισυνάγωγον ἔτυπτον ἔμπροσθεν τοῦ βήματος· καὶ οὐδὲν τούτων τῷ Γαλλίωνι ⸀ἔμελεν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/017.yaml
  text: Then they all seized Sosthenes[a], the synagogue ruler, and beat him in front of the tribunal. But Gallio paid no attention to these things.
translation:
  language: ja
  text: そこで、皆が会堂の指導者ソステネを捕らえ[a]、裁判席の前で殴り続けた。しかし、ガリオはこれらのことを少しも気に留めなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「皆」の代わりに「ギリシア人たちは皆」とあります。初期の本文形はより短く、その集団が誰であったかを明示していません。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιλαβόμενοι
  choice: 捕らえ
  rationale: 敵対的な文脈で「つかむ、捕らえる」を表す。続く暴行とのつながりを自然かつ簡潔に示す。
- source_word: πάντες
  choice: 皆は
  rationale: 「全員」という包括性を保ちつつ、その集団が誰であるかは原文どおり特定しない。
- source_word: ἀρχισυνάγωγον
  choice: 会堂司
  rationale: ユダヤ教会堂を管理・指導する役職を指す、簡潔で定着した日本語表現。
- source_word: ἔτυπτον
  choice: 殴り続けた
  rationale: 未完了過去の継続・反復的な相を示し、一度だけではない暴行の様子を自然な日本語で伝える。
- source_word: ἔμπροσθεν τοῦ βήματος
  choice: 法廷の前で
  rationale: βῆμαは総督が裁きを行う司法上の壇・法廷を指す。現代の読者に法的場面が明瞭に伝わる表現とした。
- source_word: οὐδὲν τούτων τῷ Γαλλίωνι ἔμελεν
  choice: ガリオはこれらのことを少しも気に留めなかった
  rationale: 「これらのことはガリオにとって何の関心事でもなかった」という慣用的意味を、過度に感情的にせず自然に表す。
- source_word: δέ
  choice: そこで
  rationale: 前の出来事を受けた物語の展開を示す。
- source_word: καί
  choice: しかし
  rationale: 群衆の暴行とガリオの無関心との対照を、日本語で明確かつ自然に示す。
theological_decisions:
- issue: πάντες（「皆」）が指す集団の正体
  choice: 本文では「皆」とし、集団を特定しない。
  alternative: 「ギリシア人たちは皆」または「ユダヤ人たちは皆」とする。
  rationale: SBLGNT本文は明示的な名詞を伴わずπάντεςとのみ記す。写本伝承や解釈による特定を本文へ持ち込まず、原文の曖昧さを保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「会堂司」は役職名として簡潔に保ち、「法廷」によって司法的場面を分かりやすくした。原文の集団同定の曖昧さを本文と脚注で保持した。
