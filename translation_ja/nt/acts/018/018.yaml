source:
  edition: SBLGNT
  text: Ὁ δὲ Παῦλος ἔτι προσμείνας ἡμέρας ἱκανὰς τοῖς ἀδελφοῖς ἀποταξάμενος ἐξέπλει εἰς τὴν Συρίαν, καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας, κειράμενος ⸂ἐν Κεγχρεαῖς τὴν κεφαλήν⸃, εἶχεν γὰρ εὐχήν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/018.yaml
  text: After Paul had remained many more days[a], he said farewell to the brothers and sailed away for Syria, and with him were Priscilla and Aquila. In Cenchreae he had his head shaved[e][d][c][b], for he had a vow.
translation:
  language: ja
  text: パウロはなおかなりの日数の間、そこに滞在した後、兄弟たち[a]に別れを告げ、プリスキラとアキラを伴ってシリアへ向けて船出した。彼は誓願をしていたので、ケンクレアで髪を切った[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」は、女性も含む信者の共同体を指していると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「髪を切った」は、「頭を剃った」とも訳せる。ギリシア語は髪を切る、または刈ることを表し、必ずしも完全に剃ることだけを意味しない。
    reason: lexical_alternative
  - marker: c
    text: 髪を切ったのはアキラだとする解釈もあるが、ギリシア語の文法ではパウロを指すのが最も自然である。また、原文は単に「誓願」と述べるだけで、ナジル人の誓願とは明記していない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι προσμείνας ἡμέρας ἱκανὰς
  choice: なおかなりの日数そこに滞在した後
  rationale: ἔτιの継続性とἡμέρας ἱκανὰςの相当な日数を表し、アオリスト分詞が船出に先立つ行為であることを自然な日本語で示す。「そこに」は直前の文脈から補った。
- source_word: τοῖς ἀδελφοῖς
  choice: 兄弟たち
  rationale: キリスト者共同体を指す男性複数の親族語を本文では保持し、文脈上は女性を含み得ることを脚注で示す。
- source_word: ἀποταξάμενος
  choice: 別れを告げ
  rationale: 人々にいとまを告げるという中動態の慣用的意味を、明瞭な現代日本語で表す。
- source_word: ἐξέπλει εἰς τὴν Συρίαν
  choice: シリアへ向けて船出した
  rationale: ἐκπλέωの船で出発する意味と、εἰςが示す目的地を明確に表す。
- source_word: καὶ σὺν αὐτῷ Πρίσκιλλα καὶ Ἀκύλας
  choice: プリスキラとアキラを伴って
  rationale: 二人がパウロと同行したことを、日本語の文の流れを損なわずに表す。
- source_word: κειράμενος ἐν Κεγχρεαῖς τὴν κεφαλήν
  choice: ケンクレアで髪を切った
  rationale: κείρωは髪を切る・刈ることを表し、完全に剃ったかは断定できないため「髪を切った」とした。分詞の主語は文法上最も自然にパウロを指す。
- source_word: εἶχεν γὰρ εὐχήν
  choice: 誓願を立てていたので
  rationale: 直訳的な「誓願を持っていた」より自然で、誓願に拘束された継続状態を表す。ただし誓願の種類は特定しない。
theological_decisions:
- issue: κειράμενος（髪を切った）の行為者
  choice: パウロを行為者として訳す
  alternative: アキラを行為者と解する
  rationale: 男性単数分詞κειράμενοςは、文全体の主語であるパウロにかかるのが文法上最も自然である。ただし、アキラを指すとする解釈も脚注に残す。
- issue: εὐχήの性質
  choice: 一般的な「誓願」とする
  alternative: ナジル人の誓願と特定する
  rationale: 原文は誓願の種類を明記していないため、特定の儀礼カテゴリーを本文に持ち込まない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の長い構文は二文に分け、時間関係と行為者を読み取りやすくした。固有名は日本語聖書で広く通用する形を用いた。
