id: ACT.18.8
reference: Acts 18:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κρίσπος δὲ ὁ ἀρχισυνάγωγος ἐπίστευσεν τῷ κυρίῳ σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ, καὶ πολλοὶ τῶν Κορινθίων ἀκούοντες ἐπίστευον καὶ ἐβαπτίζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/008.yaml
  text: But Crispus[a], the synagogue ruler, believed in the Lord together with his whole household, and many of the Corinthians, hearing, were believing and were being baptized.
translation:
  language: ja
  text: 会堂長クリスポは、家の者すべてとともに主を信じた。また、コリント人の多くも、聞いては、信じ、洗礼を受けていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「また、コリント人の多くも、聞いて信じ、洗礼を受けた。」ギリシア語では「信じた」「洗礼を受けた」に当たる動詞が未完了過去形であり、人々の応答が継続的または繰り返し進んでいた様子を表している。
    reason: 未完了過去形の相を示しつつ、より簡潔な日本語訳の可能性を示すため。
lexical_decisions:
- source_word: Κρίσπος
  choice: クリスポ
  rationale: 固有名詞を、日本語の聖書翻訳で一般的なギリシア語音写に従って表記した。
- source_word: ἀρχισυνάγωγος
  choice: 会堂長
  rationale: 会堂を指導する役職を簡潔かつ自然に示す、日本語聖書で定着した表現。
- source_word: ἐπίστευσεν τῷ κυρίῳ
  choice: 主を信じた
  rationale: πιστεύω＋与格を自然な日本語で表し、κύριοςは原文どおり「主」として、本文で「主イエス」と補わない。
- source_word: σὺν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: 家族全員とともに
  rationale: οἶκοςは建物ではなく世帯・家の者たちを指す。「家族全員」は現代日本語として明瞭で、ὅλῳの包括性も保つ。
- source_word: πολλοὶ τῶν Κορινθίων
  choice: コリント人の多く
  rationale: 部分属格を自然に表し、コリント人のうち多くが応答したという範囲を保つ。
- source_word: ἀκούοντες
  choice: みことばを聞いては
  rationale: 目的語は直前の宣教内容から補えるため、「みことば」と明示して日本語を自然にした。「聞いては」により、続く未完了過去形と合わせて反復的・進行的な展開を表す。
- source_word: ἐπίστευον
  choice: 信じ…ていた
  rationale: 未完了過去の継続的・反復的な様相を「聞いては信じ…ていた」という構文で自然に伝える。
- source_word: ἐβαπτίζοντο
  choice: 洗礼を受けていた
  rationale: 受動態と未完了過去の様相を保ち、応答が次々と進んでいたことを示す。
theological_decisions:
- issue: 「家族全員とともに」が示す信仰の範囲
  choice: クリスポが家族全員とともに主を信じた、と原文に沿って述べ、各人の信仰や洗礼のあり方を詳述しない。
  alternative: 家族の一人一人が個別に信仰告白したと明示する、または世帯を集合的にのみ捉える。
  rationale: 原文は家全体を含む表現を用いるが、その参与の仕方を説明していないため、教派的な結論を加えない。
- issue: 「主」の指示対象
  choice: 主
  alternative: 主イエス
  rationale: 文脈上はイエスを指すと考えられるが、原文はκύριοςとのみ記すため、訳文でも称号をそのまま保つ。
- issue: コリント人の応答の時間的様相
  choice: 「聞いては信じ、洗礼を受けていた」とし、応答が繰り返し進展した様子を表す。
  alternative: 「聞いて信じ、洗礼を受けた」と単純な完了事実として訳す。
  rationale: 現在分詞と二つの未完了過去形が描く、進行中または反復的な応答を、過度に不自然にならない日本語で保持する。
translation_notes:
  register: 明瞭で品位ある現代標準語。「会堂長」「主」「洗礼」は広く定着した聖書用語として保持した。後半は原文の未完了的な展開を自然な日本語で表すため「聞いては…受けていた」とした。
