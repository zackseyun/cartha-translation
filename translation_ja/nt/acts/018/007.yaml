  text: καὶ μεταβὰς ἐκεῖθεν ⸀εἰσῆλθεν εἰς οἰκίαν τινὸς ὀνόματι ⸀Τιτίου Ἰούστου σεβομένου τὸν θεόν, οὗ ἡ οἰκία ἦν συνομοροῦσα τῇ συναγωγῇ.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/007.yaml
  text: And after leaving there[a], he entered the house of a man named Titius Justus, who worshiped God[b], whose house was next to the synagogue.
translation:
  language: ja
  text: そこを去ったパウロは、神を礼拝するティティオ・ユストという人の家に入った。その家は会堂に隣接していた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 別訳「会堂と隣り合っていた」または「会堂と境を接していた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεταβὰς ἐκεῖθεν
  choice: そこでパウロはそこを離れ
  rationale: アオリスト分詞と場所の副詞が示す、前の場所から移った後に主動詞の行為へ進む順序を、自然な日本語で表した。主語は文脈上のパウロを補った。
- source_word: εἰσῆλθεν εἰς οἰκίαν τινὸς
  choice: ある人の家に入った
  rationale: εἰσέρχομαι の移動と、τινός が所有者を不定に提示する構造を簡潔に保持した。本文では後続する名前と説明に合わせ「という…人の家」とした。
- source_word: ὀνόματι Τιτίου Ἰούστου
  choice: ティティオ・ユストという
  rationale: ὀνόματι と固有名による人物紹介を現代日本語の自然な形にし、ギリシア語形に基づいて音写した。
- source_word: σεβομένου τὸν θεόν
  choice: 神を礼拝する人
  rationale: σέβομαι の継続的な敬虔・礼拝を記述的に訳し、特定の社会宗教的分類を本文に持ち込まないようにした。
- source_word: συνομοροῦσα τῇ συναγωγῇ
  choice: 会堂と隣り合っていた
  rationale: 建物同士が接している、または境界を共有するという συνομορέω の意味を、明瞭で品位ある現代日本語で表した。
theological_decisions:
- issue: ティティオ・ユストを σεβόμενος τὸν θεόν と述べる表現
  choice: 神を礼拝する人
  alternative: 神を畏れる人／神を敬う人
  rationale: イスラエルの神に帰依する異邦人を指しうる表現だが、本文だけでは準専門的な身分名として固定する必要はないため、行為を記述する訳を採用した。
- issue: συνομοροῦσα が示す位置関係
  choice: 隣り合っていた
  alternative: 隣接していた／境を接していた
  rationale: 単なる近さだけでなく接している含意を保ちつつ、一般読者に自然な表現とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語文として簡潔かつ品位ある調子にした。「会堂」は使徒言行録のユダヤ教的文脈に適した一般的な聖書用語として採用した。
