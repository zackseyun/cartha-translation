  text: διελέγετο δὲ ἐν τῇ συναγωγῇ κατὰ πᾶν σάββατον, ἔπειθέν τε Ἰουδαίους καὶ Ἕλληνας.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/004.yaml
  text: And he was reasoning in the synagogue every Sabbath and persuading Jews and Greeks[a][b][c].
translation:
  language: ja
  text: パウロは安息日ごとに会堂で論じ[a]、ユダヤ人とギリシア人を説得していた[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「話し合っていた」「議論していた」とも訳せる。ギリシア語の動詞は、筋道を立てた対話や論争を表しうる。
    reason: lexical_alternative
  - marker: b
    text: 「説得しようとしていた」とも訳せる。未完了過去形は、説得の働きが継続していたことを表し、必ずしもそのつど成功したことまで意味しない。
    reason: lexical_alternative
  - marker: c
    text: 会堂と関係のあったギリシア人を指すと考えられる。「異邦人」と広く理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: διελέγετο
  choice: 論じ合い
  rationale: 未完了過去形が表す反復・継続的な活動と、対話を交えつつ論証する語義を簡潔に表す。「議論し」だけでは対話性が弱く、「論じていた」とすると後続の未完了過去形との自然な連結が損なわれるため、連用形とした。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは物語を進める弱い接続辞であり、日本語では訳出しないほうが自然である。
- source_word: ἐν τῇ συναγωγῇ
  choice: 会堂で
  rationale: 場所を表すἐνを自然な現代日本語で表した。文脈上、ユダヤ教の会堂を指す。
- source_word: κατὰ πᾶν σάββατον
  choice: 安息日ごとに
  rationale: κατάとπᾶνの配分的意味、および行為の反復性を明確に表す。
- source_word: ἔπειθέν
  choice: 説得していた
  rationale: 未完了過去形による継続・反復を保ちつつ、πείθωの基本的な働きを直接訳した。成功の完了を必ずしも意味しない点は脚注で示す。
- source_word: τε
  choice: （構文上の連結として処理）
  rationale: 先行する行為と後続する行為を緩やかに結ぶため、日本語では連用形による接続で自然に表した。
- source_word: Ἰουδαίους
  choice: ユダヤ人
  rationale: ここではユダヤ地方の住民に限定せず、民族的・宗教的集団としての人々を指す標準的な訳語である。
- source_word: Ἕλληνας
  choice: ギリシア人
  rationale: 本文の語を具体的に保ち、「異邦人」や「神を敬う人々」へと解釈的に限定・一般化しない。
theological_decisions:
- issue: 会堂にいたἝλληναςの身元
  choice: 「ギリシア人」と訳し、それ以上限定しない。
  alternative: 「異邦人」または「神を敬うギリシア人」
  rationale: 会堂と関係のある異邦人だった可能性は高いが、本文自体はἝλληνεςとだけ述べているため、特定の宗教的身分を補わず曖昧さを保つ。
- issue: ἔπειθένが説得の成功を意味するか
  choice: 本文では「説得していた」とし、継続的な働きとして表す。
  alternative: 「説得しようとしていた」
  rationale: 未完了過去形は継続・反復を示すが、それだけで試みの不成功を明示するわけではない。日本語本文で「しようとしていた」と結果を限定せず、脚注で可能な含みを示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「パウロ」は直前の文脈から明らかな主語を補い、単独の節としても理解しやすくした。「安息日ごとに」で反復性を自然に示し、二つの未完了過去形は「論じ合い、…説得していた」と一続きの継続的活動として表現した。
