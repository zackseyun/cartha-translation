source:
  edition: SBLGNT
  text: εὐτόνως γὰρ τοῖς Ἰουδαίοις διακατηλέγχετο δημοσίᾳ ἐπιδεικνὺς διὰ τῶν γραφῶν εἶναι τὸν χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/028.yaml
  text: For he powerfully refuted the Jews in public[b][a], demonstrating through the Scriptures that Jesus is the Messiah.
translation:
  language: ja
  text: というのも、彼は公の場でユダヤ人たちを力強く論駁し、聖書に基づいてイエスがメシアであることを示していたからである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「メシアはイエスであること」。ギリシア語の不定詞節は、どちらの語順でも表すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐτόνως
  choice: 力強く
  rationale: 議論の激しさだけでなく、その説得力と有効性を表す自然な現代日本語。
- source_word: διακατηλέγχετο
  choice: 論駁し
  rationale: 相手の主張を証拠に基づいて徹底的に退ける意味を表す。「していた」により未完了過去の継続的な側面を節全体で示した。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たちを
  rationale: 与格は複合動詞の相手を示すが、日本語では「を」を用いて「論駁する」の対象として自然に表現した。文脈上は議論の相手となったユダヤ人たちを指す。
- source_word: δημοσίᾳ
  choice: 公の場で
  rationale: 論駁が公然と行われたという場面を、自然で明瞭な日本語で示す。
- source_word: ἐπιδεικνὺς
  choice: 明らかにしていた
  rationale: 聖書を根拠に提示し、論証して示すという分詞の意味を表す。主動詞と同時進行する継続的な行為として訳した。
- source_word: διὰ τῶν γραφῶν
  choice: 聖書によって
  rationale: διά＋属格が示す手段を保持し、聖書が論証の手段であったことを明示する。
- source_word: τὸν χριστὸν
  choice: メシア
  rationale: ここでは固有名のような用法ではなく、聖書で約束された油注がれた者という称号として機能している。
- source_word: εἶναι τὸν χριστὸν Ἰησοῦν
  choice: イエスがメシアであること
  rationale: ギリシア語の対格＋不定詞構文を自然な日本語にした。語順上の別解「メシアとはイエスであること」も可能なため脚注で示す。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ユダヤ教聖書を用いてイエスが約束された油注がれた者であると論証する文脈なので、称号としての機能を明確にする「メシア」を採用した。
- issue: εἶναι τὸν χριστὸν Ἰησοῦνの述語関係
  choice: イエスがメシアである
  alternative: メシアとはイエスである
  rationale: 対格＋不定詞構文は文法上どちらの焦点でも表現し得る。本文には自然な語順を採り、真正な曖昧さを脚注に保存した。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「論駁」は日常語よりやや硬いが、公の場で聖書を根拠に反論して相手の主張を退ける原文の強い意味を簡潔に保つ。接続詞 γάρ は「というのも……からである」で前節への理由説明として表した。脚注記号[a]は、曖昧さが関係する命題の直後に置いた。
