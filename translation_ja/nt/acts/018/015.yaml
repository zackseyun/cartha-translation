id: ACT.18.15
reference: Acts 18:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ⸀ζητήματά ἐστιν περὶ λόγου καὶ ὀνομάτων καὶ νόμου τοῦ καθ’ ὑμᾶς, ὄψεσθε αὐτοί· ⸀κριτὴς ἐγὼ τούτων οὐ βούλομαι εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/015.yaml
  text: But if these are questions about a word and names and your own law[a], you yourselves will see to it; I do not want to be a judge of these things.
translation:
  language: ja
  text: しかし、言葉[a]や名称、あなたがた自身の律法についての争点であるなら、あなたがた自身で取り扱いなさい。私はこれらの事柄の裁判官になるつもりはない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主張」または「教え」とも訳せる。ギリシャ語の λόγος（ロゴス）は意味の広い語で、ここでは論争の対象となった教えや用語を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήματά
  choice: 争点
  rationale: 係争中の問題や検討事項を表す語であり、ガリオの司法的な発言という文脈に合う。「論争」と決めつけず、複数の問題があることも含意できる。
- source_word: περὶ λόγου
  choice: 言葉について
  rationale: λόγος は「言葉」「主張」「教え」などを指し得る広い語である。本文では「言葉」として曖昧さを保ち、より限定的な訳語は脚注に示した。
- source_word: ὀνομάτων
  choice: 名称
  rationale: 単なる人名だけでなく、呼称や称号をめぐる問題も含み得るため、「名前」よりやや広い「名称」とした。指示対象は限定しない。
- source_word: νόμου τοῦ καθ’ ὑμᾶς
  choice: あなたがた自身の律法
  rationale: その律法がローマ法ではなく、相手方の共同体に属するものだと距離を置くガリオの言い方を表す。
- source_word: ὄψεσθε αὐτοί
  choice: 自分たちで処理しなさい
  rationale: 未来形はここで「自分たちで対処せよ」という指示・突き放しを表す。αὐτοί の強調を「自分たちで」に反映した。
- source_word: κριτὴς
  choice: 裁判官
  rationale: 司法の場面に即した直接的な訳であり、ガリオが裁定を拒む立場を明確にする。
- source_word: οὐ βούλομαι εἶναι
  choice: なるつもりはない
  rationale: βούλομαι の意志・意向を自然な現代日本語で表し、形式的な法的宣言以上に強く訳しすぎない。
theological_decisions:
- issue: ガリオが退けた λόγος の範囲
  choice: 本文では「言葉」とし、意味を特定しない
  alternative: 「教え」「主張」「教義」
  rationale: 本文だけでは、用語上の争いか、教えや主張の内容を指すのか確定できない。特定の神学的内容を補わず、原文の幅を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、司法的な場面に合う「争点」「裁判官」を採用した。ガリオの突き放す調子は「自分たちで処理しなさい」「なるつもりはない」で表した。
