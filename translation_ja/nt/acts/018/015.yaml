  naturalness: 「自分たちで処理しなさい」も通じるが、司法的文脈で「処理」はやや事務的で、原文の「自分たちで取り扱う／対処する」という広さを少し狭める。「あなたがた自身で取り扱いなさい」とすると、明瞭な現代標準日本語を保ちつつ、原文の強調と突き放す調子を自然に表せる。
  terminology: 「言葉」「名称」「あなたがた自身の律法」「争点」「裁判官」はいずれも適切である。「名称」は人名・呼称・称号のいずれにも限定しない。「律法」はこの文脈で定着した適切な語である。脚注の代案も、本文の曖昧さを不当に解消していない。
