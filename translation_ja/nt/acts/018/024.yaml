source:
  edition: SBLGNT
  text: Ἰουδαῖος δέ τις Ἀπολλῶς ὀνόματι, Ἀλεξανδρεὺς τῷ γένει, ἀνὴρ λόγιος, κατήντησεν εἰς Ἔφεσον, δυνατὸς ὢν ἐν ταῖς γραφαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/024.yaml
  text: A certain Jew named Apollos[a], an Alexandrian by birth, an eloquent man, arrived in Ephesus, being mighty in the Scriptures.
translation:
  language: ja
  text: アレクサンドリア出身のアポロというユダヤ人が、エフェソにやって来た。彼は雄弁な人で[a]、聖書に非常に精通していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「学識のある人」。ギリシア語は、雄弁さと学識のどちらをも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: ユダヤ人
  rationale: ここでは地理的な「ユダヤ地方の人」ではなく、アポロの民族的・宗教的帰属を示す。
- source_word: δέ τις
  choice: 一人の（日本語では「アポロというユダヤ人」）
  rationale: τιςが新しい登場人物を不定的に導入する働きは、日本語の「～というユダヤ人」で自然に表した。δέは弱い物語上の移行を示すが、独立した接続語を置かなくても日本語の段落展開で十分に伝わる。
- source_word: Ἀπολλῶς ὀνόματι
  choice: アポロという
  rationale: 人物の名を紹介するギリシア語の慣用句を、現代日本語で自然な形にした。
- source_word: Ἀλεξανδρεὺς τῷ γένει
  choice: アレクサンドリア出身の
  rationale: 出生・出自を表し、現代日本語として自然で誤解の少ない「出身」を用いた。
- source_word: ἀνὴρ λόγιος
  choice: 雄弁な人
  rationale: λόγιοςには「雄弁な」と「学識のある」の両義がある。続く宣教描写にも合う「雄弁な」を本文に採り、別の意味を脚注に残した。ἀνήρが男性を指すことは、男性名アポロと文脈によって明白である。
- source_word: κατήντησεν εἰς Ἔφεσον
  choice: エフェソにやって来た
  rationale: 目的地に到着したことを表す。物語文として自然で、単なる存在ではなく移動を明示する。
- source_word: δυνατὸς ὢν ἐν ταῖς γραφαῖς
  choice: 聖書に非常に精通していた
  rationale: 直訳的な「聖書において力がある」は不自然なため、聖書について高い力量を備えていたという意味を明瞭に表した。「非常に」によってδυνατόςの強さを保った。γραφαίはこのユダヤ的文脈では聖なる文書群を指すため「聖書」とした。
theological_decisions:
- issue: 「聖書」が指す範囲
  choice: 聖書
  alternative: 諸文書
  rationale: この時点の文脈では、後代に確定した新約聖書全体ではなく、ユダヤ人が聖なる書として受け継いだ文書群を指す。ただし本文では指示対象を過度に限定せず、通常の日本語「聖書」を用いた。
translation_notes:
  register: 明瞭で自然な現代標準日本語。人物紹介を一文に詰め込まず二文に分け、原文の情報関係を保ちながら読みやすくした。「雄弁」「精通」は品位を保ちつつ一般読者にも理解しやすい語である。
