id: ACT.18.9
reference: Acts 18:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος ⸂ἐν νυκτὶ δι’ ὁράματος⸃ τῷ Παύλῳ· Μὴ φοβοῦ, ἀλλὰ λάλει καὶ μὴ σιωπήσῃς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/009.yaml
  text: And the Lord said to Paul in the night through a vision[a], “Do not be afraid, but keep speaking and do not be silent,”
translation:
  language: ja
  text: すると、主は夜、幻を通して[a]パウロに言われた。「恐れないで、語り続けなさい。黙っていてはいけない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幻の中で」。ギリシア語は直訳すると「幻を通して」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: 主
  rationale: 定冠詞を伴う称号をそのまま「主」とし、本文にない「イエス」を補わず、使徒言行録におけるキリスト論的な重みを保った。
- source_word: ἐν νυκτὶ
  choice: 夜
  rationale: 時を示す句として、現代日本語で自然かつ簡潔に表した。
- source_word: δι’ ὁράματος
  choice: 幻を通して
  rationale: 属格を伴う διά の手段・媒介の意味を明示し、原文の構造を反映した。「幻の中で」という理解も可能なため脚注に示した。
- source_word: Μὴ φοβοῦ
  choice: 恐れないで
  rationale: μή を伴う現在命令形の禁止を、直接的で自然な現代日本語にした。
- source_word: ἀλλὰ λάλει
  choice: 語り続けなさい
  rationale: 現在命令形の継続的・反復的な側面を「続ける」で表した。
- source_word: καὶ μὴ σιωπήσῃς
  choice: 黙っていてはいけない
  rationale: μή とアオリスト接続法による禁止を自然な日本語で表し、先行する命令との対句性を保った。
theological_decisions:
- issue: 「主」の指示対象
  choice: 本文どおり「主」とし、話者を明示的に「イエス」とは訳さない。
  alternative: 主イエス
  rationale: 文脈上は復活したイエスを指す可能性が高いが、ギリシア語本文は ὁ κύριος とだけ記すため、訳文で同定を追加せず、称号の神学的含意と本文の表現を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「すると」で叙述の進行を示し、命令は理解しやすい口調にした。脚注記号 [a] は該当表現の直後に置いた。
