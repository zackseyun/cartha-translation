source:
  edition: SBLGNT
  text: οὗτός τε ἤρξατο παρρησιάζεσθαι ἐν τῇ συναγωγῇ· ἀκούσαντες δὲ αὐτοῦ ⸂Πρίσκιλλα καὶ Ἀκύλας⸃ προσελάβοντο αὐτὸν καὶ ἀκριβέστερον αὐτῷ ἐξέθεντο τὴν ⸂ὁδὸν τοῦ θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/026.yaml
  text: And he began to speak boldly in the synagogue. But when Priscilla and Aquila heard him[a], they took him aside and explained the way of God to him more accurately.
translation:
  language: ja
  text: この人は会堂で大胆に語り始めた。プリスキラとアキラは彼の話を聞くと、彼を自分たちのもとに招き[a]、神の道をより正確に説明した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼を連れて行った」「彼を受け入れた」。ギリシア語の動詞には、人を自分のもとに引き取る、受け入れるという意味の幅がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός τε
  choice: この人は
  rationale: 直前のアポロを指す指示代名詞を明示し、τέの軽い接続は日本語では文脈に委ねた。
- source_word: παρρησιάζεσθαι
  choice: 大胆に語る
  rationale: 公然と確信をもって語る意味を、自然で簡潔な現代日本語で表した。
- source_word: ἐν τῇ συναγωγῇ
  choice: 会堂で
  rationale: ユダヤ教の集会所を指す定着した聖書用語を用いた。
- source_word: ἀκούσαντες δὲ αὐτοῦ
  choice: 彼の話を聞くと
  rationale: 分詞の時間的関係を自然に表した。δέの展開的な働きは文の切り替えによって示した。
- source_word: Πρίσκιλλα καὶ Ἀκύλας
  choice: プリスキラとアキラ
  rationale: 本文のΠρίσκιλλαに対応する、日本語で一般的な音写を採用した。
- source_word: προσελάβοντο αὐτὸν
  choice: 彼を自分たちのもとに迎え
  rationale: 動詞には『受け入れる』『連れて行く』『引き取る』などの幅があるため、私的に脇へ連れ出したと断定せず、後続の説明行為にも自然につながる表現とした。
- source_word: ἀκριβέστερον
  choice: さらに正確に
  rationale: 比較級の力を保ち、アポロの従来の理解よりも正確に説明したことを示した。
- source_word: ἐξέθεντο
  choice: 説明した
  rationale: ここでの中動態ἐκτίθημιの『詳しく説き明かす』という意味を、明快な現代語で表した。
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: 神の道
  rationale: 初期キリスト教的な含意を持ち得る表現を、道徳的教えや体系化された信仰内容のいずれかに限定せず、そのまま保持した。
theological_decisions:
- issue: プリスキラとアキラがアポロに取った行動
  choice: 彼を自分たちのもとに迎えた
  alternative: 彼を脇へ連れて行った／彼を受け入れた
  rationale: προσλαμβάνομαιの語義の幅を保ちつつ、後続する個人的な説明に合う訳とした。公の叱責や特定の教会的権威関係は本文にないため、読み込まなかった。
- issue: 「神の道」の意味
  choice: 原文どおり広がりを持つ表現として保持
  alternative: 神の救いの教え／キリスト教信仰の全体系／神の倫理的な道
  rationale: 文脈上はキリストに関する道・教えを指す可能性が高いが、本文自体が内容を限定していないため、特定の教理的定義に置き換えなかった。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、格調を保ちながら過度に文語的な表現を避けた。「自分たちのもとに迎え」によって原語の語義的な幅を本文と脚注で保持した。
