    text: 「神のみこころなら」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前にある、もっと長く滞在してほしいとの求めに対する対照を自然に示す。
- source_word: ἀποταξάμενος
  choice: 別れを告げ
  rationale: アオリスト中動態分詞による別れの動作を、後続する出航までの流れが明瞭になる自然な日本語で表した。
- source_word: καὶ εἰπών
  choice: と言って
  rationale: 二つ目の分詞を日本語の連用表現で示し、別れの言葉を述べてから出航したという動作の連続を保った。
- source_word: Πάλιν
  choice: また
  rationale: 再度戻ることを表す標準的で自然な副詞。
- source_word: ἀνακάμψω
  choice: 戻って来ます
  rationale: 話し相手のいる場所への帰還を表す未来形を、方向性の明確な自然な日本語にした。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのところに
  rationale: 複数の聞き手へ向かう πρός の方向性を明示した。
- source_word: τοῦ θεοῦ θέλοντος
  choice: 神がお望みなら
  rationale: 神の意志を条件とする属格独立構文を簡潔に保ち、「主」など本文にない語を加えていない。
- source_word: ἀνήχθη
  choice: 船出した
  rationale: 旅行記事における ἀνάγω の航海用法を、日本語で簡潔かつ明確に表した。
- source_word: ἀπὸ τῆς Ἐφέσου
  choice: エフェソから
  rationale: 出発地点を表す標準的な訳とし、地名は現代日本語で一般的な音写を用いた。
theological_decisions:
- issue: パウロの旅行計画と神の意志との関係
  choice: 神がお望みなら
  alternative: 神のみこころなら
  rationale: 原文は明示的に「神」としており、計画の実現が神の意志にかかっているという条件性を保った。「主」に置き換えず、神学的含意を過度に説明しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒言行録の旅行記事にふさわしい簡潔で品位ある叙述とした。引用内では丁寧体を用い、パウロが聞き手に直接語る自然さを出した。
