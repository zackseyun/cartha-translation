  text: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα εἶπεν ὁ Γαλλίων πρὸς τοὺς Ἰουδαίους· Εἰ ⸀μὲν ἦν ἀδίκημά τι ἢ ῥᾳδιούργημα πονηρόν, ὦ Ἰουδαῖοι, κατὰ λόγον ἂν ἀνεσχόμην ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/014.yaml
  text: But as Paul was about to open his mouth[a], Gallio said to the Jews, “If it were some wrongdoing or a serious crime, O Jews[c][b], I would reasonably put up with you.
translation:
  language: ja
  text: しかし、パウロが口を開こうとしたとき[a]、ガリオはユダヤ人たちに言った。「ユダヤ人諸君、もしこれが何かの不正行為や悪質な犯罪[b]であったなら、私はもっともなこととして、あなたがたの訴えを我慢して聞いたことでしょう[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「口を開こうとしたとき」。これは「話し始めようとしたとき」という意味の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: または「邪悪な犯罪」「悪意ある犯罪」。ギリシア語は、犯罪的な悪事を表す語に「悪い、邪悪な」という形容詞を添えている。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「私はもっともな理由があって、あなたがたを我慢したことでしょう」。ここでは、実際の不法行為や犯罪に関する訴えであれば、ガリオがその訴えを辛抱して聞くのはもっともだった、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέλλοντος δὲ τοῦ Παύλου ἀνοίγειν τὸ στόμα
  choice: しかし、パウロが口を開こうとしたとき
  rationale: 属格独立構文と μέλλω＋不定詞が表す切迫した動作を反映した。「口を開く」は発言を始めるというギリシア語の慣用表現を保ちつつ、日本語でも理解できる。δὲ は、パウロが話し始める前にガリオが発言したという軽い対照を「しかし」で示した。
- source_word: Γαλλίων
  choice: ガリオ
  rationale: 人名を日本語で一般的な形に音写した。
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: ユダヤ人たちに
  rationale: 原文どおり発言の相手を示し、文脈上の「告発者」という限定は本文に加えなかった。
- source_word: Εἰ μὲν ἦν
  choice: もしこれが…であったなら
  rationale: 反実仮想的な条件文を自然な現代日本語で表した。指示語「これ」は、直前まで持ち込まれていた訴えを受ける。μέν は条件節の構造の中で自然に表現した。
- source_word: ἀδίκημά τι
  choice: 何かの不正行為
  rationale: 法的な不法・違法行為を広く指す語として、過度に特定せず訳した。
- source_word: ῥᾳδιούργημα πονηρόν
  choice: 悪質な犯罪
  rationale: 犯罪的な悪事を指す名詞と「悪い、邪悪な」という形容詞の組み合わせを、明瞭で現代的な法的表現にした。
- source_word: ὦ Ἰουδαῖοι
  choice: ユダヤ人諸君
  rationale: 呼格の直接的でやや改まった調子を、現代日本語として不自然にならない「諸君」で示した。
- source_word: κατὰ λόγον
  choice: 当然
  rationale: 「理にかなって、もっともな理由があって」という意味を、文脈に合う簡潔な副詞で表した。
- source_word: ἀνεσχόμην ὑμῶν
  choice: あなたがたの訴えを聞き入れたことでしょう
  rationale: 字義的には「あなたがたに耐える／我慢する」だが、裁判官が告発を聴取する文脈での意味を自然に示した。ガリオの突き放す調子は「当然」と後続文脈によって保たれる。
