  to: しかし、パウロが口を開こうとしたとき[a]、ガリオはユダヤ人たちに言った。「ユダヤ人諸君、もしこれが何かの不正行為や悪質な犯罪[b]であったなら、私はもっともなこととして、あなたがたの訴えを我慢して聞いたことでしょう[c]。
