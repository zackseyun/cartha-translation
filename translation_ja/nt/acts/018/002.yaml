source:
  edition: SBLGNT
  text: καὶ εὑρών τινα Ἰουδαῖον ὀνόματι Ἀκύλαν, Ποντικὸν τῷ γένει, προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ διὰ τὸ ⸀διατεταχέναι Κλαύδιον χωρίζεσθαι πάντας τοὺς Ἰουδαίους ⸀ἀπὸ τῆς Ῥώμης, προσῆλθεν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/002.yaml
  text: And he found a Jew named Aquila[a], a native of Pontus, who had recently come from Italy with Priscilla his wife because Claudius had ordered all the Jews to leave Rome; and he went to them.
translation:
  language: ja
  text: そしてパウロは、ポントス出身の、アキラという名の一人のユダヤ人を見つけた。アキラは、クラウディウスがすべてのユダヤ人にローマを去るよう命じたため、妻プリスキラとともに、最近イタリアから来たばかりであった。[a] パウロは二人のところへ行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべてのユダヤ人がローマから追放されるよう命じた」とも訳せる。ギリシア語は、より直訳的には「ローマから離れる」ことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρών
  choice: 出会った
  rationale: 文脈上の主語パウロがアキラと接触したことを表す。日本語では「見つけた」よりも、人との遭遇を自然に示す「出会った」が適切。
- source_word: τινα Ἰουδαῖον
  choice: ユダヤ人
  rationale: ここではローマに住むユダヤ民族・宗教共同体の一員を指し、「ユダヤ地方の人」ではない。τιναの不定性は、日本語では固有名の導入によって自然に表現される。
- source_word: ὀνόματι Ἀκύλαν
  choice: アキラという名の
  rationale: 人物名を導入するギリシア語の定型表現を、明瞭で自然な現代日本語にした。
- source_word: Ποντικὸν τῷ γένει
  choice: ポントス生まれで
  rationale: 出身または出生地を示す句。「ポントス出身」も可能だが、τῷ γένειの含意を簡潔に表す。
- source_word: προσφάτως ἐληλυθότα ἀπὸ τῆς Ἰταλίας
  choice: 最近イタリアから来たばかりであった
  rationale: 完了分詞が示す、直前に到着し、その状態が続いているという意味を自然な日本語で表した。
- source_word: καὶ Πρίσκιλλαν γυναῖκα αὐτοῦ
  choice: 妻プリスキラとともに
  rationale: プリスキラがアキラと一緒にイタリアから来たことが明瞭になるよう、統語上の結び付きを自然な日本語で示した。
- source_word: διὰ τὸ διατεταχέναι Κλαύδιον
  choice: クラウディウスが…命じたため
  rationale: διάと冠詞付き不定詞が表す理由、および皇帝による公式命令という意味を明瞭に示す。
- source_word: χωρίζεσθαι πάντας τοὺς Ἰουδαίους ἀπὸ τῆς Ῥώμης
  choice: すべてのユダヤ人にローマを去るよう
  rationale: χωρίζεσθαιとἀπόが表す「ローマから離れる」を、過度に強い解釈を加えず自然に訳した。「追放される」は文脈上可能だが、原文より明示的である。
- source_word: προσῆλθεν αὐτοῖς
  choice: 二人のところへ行った
  rationale: αὐτοῖςはアキラとプリスキラを指すため「二人」と明示し、προσέρχομαιの接近を自然に表した。
theological_decisions:
- issue: Ἰουδαῖον／Ἰουδαίουςの意味
  choice: ユダヤ人
  alternative: ユダヤ地方の人
  rationale: この箇所は、クラウディウスの命令の対象となったローマ在住のユダヤ人共同体を指しており、単なる地理的出身者という意味ではない。
- issue: χωρίζεσθαιの強制性
  choice: ローマを去る
  alternative: ローマから追放される
  rationale: 皇帝の命令ゆえ強制性は文脈に含まれるが、動詞自体はより字義的には「離れる／分かれる」であるため、本文では強さを増幅しない表現を採用した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語文を日本語として読みやすい三文に分けた。前節から続く主語を「パウロ」と補い、最後の複数代名詞は「二人」と明示した。
