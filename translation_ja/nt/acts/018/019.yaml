base_translation:
  language: en
  yaml_path: translation/nt/acts/018/019.yaml
  text: They came to Ephesus[a], and he left them there[c][b]; but he himself entered into the synagogue and reasoned with the Jews.
translation:
  language: ja
  text: 彼らはエフェソに着いた。パウロは彼らをそこに残し、自らは会堂に入って、ユダヤ人たちと論じ合った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「語り合った」または「議論した」とも訳せる。ギリシア語は、筋道を立てて対話することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατήντησαν
  choice: 着いた
  rationale: 目的地に到着することを表す。複数形を「一行は」で自然に示した。
- source_word: κἀκείνους
  choice: 二人を
  rationale: 直訳は「彼らを」だが、直前の文脈にあるプリスキラとアキラを指す。日本語では指示対象と複数であることを自然に明確化できる。固有名は本文に補わない。
- source_word: κατέλιπεν αὐτοῦ
  choice: そこに残し
  rationale: 動詞の「残す」と場所を表すαὐτοῦ「そこに」を簡潔に反映する。
- source_word: αὐτὸς δὲ
  choice: 自分は
  rationale: 同行者を残した一方で、パウロ本人が行動したという強調と対比を示す。日本語で主語を明確にするため、前文では「パウロ」を補った。
- source_word: εἰσελθὼν εἰς τὴν συναγωγήν
  choice: 会堂に入って
  rationale: 分詞を主動作に先立つ背景動作として自然な連用形で訳した。文脈上、会堂はユダヤ教の会堂を指す。
- source_word: διελέξατο
  choice: 論じ合った
  rationale: 一方的な説教でも敵対的な口論でもなく、理を尽くした相互的な対話・議論を表す語として選んだ。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たちと
  rationale: 民族的・宗教的集団を示す標準的な表現であり、「指導者たち」などへの限定はしない。
