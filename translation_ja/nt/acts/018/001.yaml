  text: ⸀Μετὰ ταῦτα ⸀χωρισθεὶς ἐκ τῶν Ἀθηνῶν ἦλθεν εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/001.yaml
  text: After this[a], he left Athens and went to Corinth.
translation:
  language: ja
  text: その後、パウロはアテネを離れ、コリントへ行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: その後
  rationale: 物語の時間的な推移を示す自然な現代日本語。直訳的な「これらのことの後」より簡潔で、出来事の順序を保つ。
- source_word: χωρισθεὶς
  choice: 離れ
  rationale: χωρίζωのアオリスト受動分詞だが、ここでは場所から立ち去る意味で自動詞的に用いられている。「離れ」はギリシア語の分詞による先行動作を自然に表す。
- source_word: ἐκ τῶν Ἀθηνῶν
  choice: アテネを
  rationale: ἐκは出発点を示す。日本語では「離れる」とともに場所を「を」で示すのが自然であり、「アテネから」の意味を保持する。
- source_word: ἦλθεν
  choice: 行った
  rationale: 語義上は「来た」も可能だが、語り手の視点からアテネを出てコリントへ移動する叙述なので、「行った」が自然である。
- source_word: εἰς Κόρινθον
  choice: コリントへ
  rationale: εἰςが示す移動の目的地を、現代日本語で自然な方向助詞「へ」によって表す。
- source_word: implicit subject
  choice: パウロは
  rationale: ギリシア語では動詞に主語が内包され、文脈上の主語はパウロである。日本語の独立した節として明瞭にするため補った。
