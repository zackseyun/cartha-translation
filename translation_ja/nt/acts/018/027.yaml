source:
  edition: SBLGNT
  text: βουλομένου δὲ αὐτοῦ διελθεῖν εἰς τὴν Ἀχαΐαν προτρεψάμενοι οἱ ἀδελφοὶ ἔγραψαν τοῖς μαθηταῖς ἀποδέξασθαι αὐτόν· ὃς παραγενόμενος συνεβάλετο πολὺ τοῖς πεπιστευκόσιν διὰ τῆς χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/acts/018/027.yaml
  text: And when he wanted to go across to Achaia[a], the brothers encouraged him and wrote to the disciples to welcome him. When he arrived[b], he greatly helped those who had believed through grace.
translation:
  language: ja
  text: アポロがアカイアへ渡ることを望んだとき、兄弟たちは彼を励まし、弟子たちに彼を歓迎するよう書き送った。アポロは到着すると、恵みによって信じた人々を大いに助けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アポロは到着すると、恵みによって、信じた人々を大いに助けた」。「恵みによって」は、信じることではなく、アポロが助けたことに係るとも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: βουλομένου δὲ αὐτοῦ
  choice: アポロが…渡ろうとしたので
  rationale: 属格独立構文を理由・状況を示す自然な日本語にし、βούλομαιの意志を「渡ろうとした」で表した。指示対象は文脈上アポロなので、曖昧になりやすい代名詞を固有名で明示した。
- source_word: διελθεῖν εἰς τὴν Ἀχαΐαν
  choice: アカイアへ渡る
  rationale: エフェソからアカイア地方への移動について、διέρχομαιの横断・渡航の含みを簡潔に保った。
- source_word: προτρεψάμενοι
  choice: 励まし
  rationale: ここでは強い命令よりも、旅立ちを支持して勧める積極的な働きかけを表すため「励ます」とした。
- source_word: οἱ ἀδελφοὶ
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を保持した。初期キリスト教の用法では女性を含む信仰共同体全体を指し得る。
- source_word: ἔγραψαν τοῖς μαθηταῖς
  choice: 弟子たちに…書き送った
  rationale: 与格の宛先を明確にし、遠隔地への推薦の手紙という文脈に自然な「書き送る」を用いた。
- source_word: ἀποδέξασθαι αὐτόν
  choice: 彼を歓迎するよう
  rationale: 単に受け入れるだけでなく、好意的に迎える意味を自然な現代日本語で表した。
- source_word: ὃς παραγενόμενος
  choice: 彼は到着すると
  rationale: 関係代名詞と分詞の時間的関係を、流れのよい従属節で表現した。
- source_word: συνεβάλετο πολὺ
  choice: 大いに助けた
  rationale: 中動態の文脈上の意味を、恩恵を受ける人々への実質的な援助として明瞭に訳した。
- source_word: τοῖς πεπιστευκόσιν
  choice: 信じた人々
  rationale: 完了分詞が示す、すでに信仰に入っている状態を日本語として自然に表した。
- source_word: διὰ τῆς χάριτος
  choice: 恵みによって
  rationale: 冠詞を伴うχάριςを簡潔に「恵み」とし、διά＋属格の手段を「によって」で示した。「神の」は原文に明示されないため補わなかった。
theological_decisions:
- issue: διὰ τῆς χάριτοςの係り先
  choice: 「信じた人々」に係るものとして「恵みによって信じた人々」と訳す
  alternative: アポロの助けに係るものとして「恵みによって、信じた人々を大いに助けた」と訳す
  rationale: 語順と意味の流れからは、恵みが信仰に至る手段であると読むのが比較的自然である。しかし、ギリシア語ではアポロの助けに係る可能性も残るため、本文で一方を採用しつつ脚注で別解を明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。地名は一般的な聖書表記「アカイア」を採用した。「兄弟たち」は原文の形を保ち、共同体全体を指し得る点は翻訳本文で説明的に展開しなかった。
