  text: But when they asked him to stay for a longer time[a], he did not consent,
translation:
  language: ja
  text: 人々がもっと長く滞在してほしいと頼んだが、彼は承知しなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「同意しなかった」「求めに応じなかった」。ギリシア語の動詞は、依頼に同意・承諾することを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτώντων δὲ αὐτῶν
  choice: しかし、人々が…頼んでも
  rationale: 属格独立構文を自然な日本語の従属節とした。ἐρωτάωはここでは単なる質問ではなく依頼を表す。δὲによる穏やかな対照は「しかし」で示した。代名詞αὐτῶνの指示対象は文脈上エフェソの人々なので、「人々」と明示した。
- source_word: ἐπὶ πλείονα χρόνον
  choice: もっと長く
  rationale: 比較の意味を保ちながら、滞在期間の延長を表す自然な現代日本語とした。
- source_word: μεῖναι
  choice: 滞在してほしい
  rationale: 依頼内容を表す不定詞を、日本語では「滞在してほしいと頼む」と自然に表現した。旅行記事の文脈に合う。
- source_word: οὐκ ἐπένευσεν
  choice: 承知しなかった
  rationale: ἐπινεύωの「求めに同意する、承諾する」という意味を表し、「拒絶した」ほど強く断定しない表現を選んだ。
