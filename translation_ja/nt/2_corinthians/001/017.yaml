id: 2CO.1.17
reference: 2 Corinthians 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο οὖν ⸀βουλόμενος μήτι ἄρα τῇ ἐλαφρίᾳ ἐχρησάμην; ἢ ἃ βουλεύομαι κατὰ σάρκα βουλεύομαι, ἵνα ᾖ παρ’ ἐμοὶ τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/017.yaml
  text: So when I intended this[a], was I acting lightly? Or do I plan what I plan according to the flesh, so that with me there should be both “Yes, yes” and “No[d][c][b], no”?
translation:
  language: ja
  text: それで、私がこうしようと考えたとき、軽率に振る舞ったのでしょうか。[a] それとも私は、自分が計画することを肉に従って計画し、その結果、私の言うことが「はい、はい」であると同時に「いいえ、いいえ」でもあるのでしょうか。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「軽率に」は、「気まぐれに」または「定見なく」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「肉に従って」は、単なる人間的な基準や世俗的な考え方に従う、という意味にも理解できる。
    reason: lexical_alternative
  - marker: c
    text: すなわち、「はい、はい」と「いいえ、いいえ」という相反する返答が同時に成り立つかのように語ること。
    reason: cultural_note
lexical_decisions:
- source_word: βουλόμενος
  choice: 意図した
  rationale: 直前の旅行計画を指す意志・意向を表し、単なる願望よりも文脈に適する。
- source_word: τῇ ἐλαφρίᾳ ἐχρησάμην
  choice: 軽率に振る舞った
  rationale: ἐλαφρίαが表す軽さ、定見のなさを自然な日本語の修辞疑問として表現した。
- source_word: ἃ βουλεύομαι ... βουλεύομαι
  choice: 私が計画することは、…計画している
  rationale: ギリシア語の反復による強調を、過度に不自然にならない範囲で保持した。
- source_word: κατὰ σάρκα
  choice: 肉に従って
  rationale: パウロに特徴的で神学的含意のあるσάρξを本文で保持し、解釈的意味は脚注で補った。
- source_word: παρ’ ἐμοὶ
  choice: 私のところでは
  rationale: パウロ自身の言動において見られる、という意味を自然かつ原文に近く表した。
- source_word: τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: 「然り、然り」と「否、否」
  rationale: ΝαίとΟὔの反復を保ち、相反する返答が併存するという非難を表した。引用句の荘重さに合わせて「然り」「否」を用いた。
theological_decisions:
- issue: パウロ的表現 κατὰ σάρκα における σάρξ の訳
  choice: 肉に従って
  alternative: 単なる人間的な基準に従って／世俗的な仕方で
  rationale: ここでは比喩的用法だが、意味を一つに限定せず、パウロの用語と神学的緊張を保持するため「肉」を本文に残した。
- issue: 「然り」と「否」の関係
  choice: 同時に成り立つ
  alternative: 私の言うことが「然り、然り」である一方、「否、否」でもある
  rationale: 相反する約束や返答を併存させる不誠実さへの反語と理解できるが、原文の簡潔さと修辞性を保つため説明を最小限にした。
translation_notes:
  register: 明瞭で現代的な標準日本語を基本としつつ、パウロの反語と反復を保持した。「肉」は神学的語感を残し、「然り／否」は引用された定型的返答の対照を際立たせるため、やや荘重だが一般に理解可能な語を採用した。
