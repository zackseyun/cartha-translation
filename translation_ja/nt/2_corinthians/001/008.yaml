  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν, ἀδελφοί, ⸀ὑπὲρ τῆς θλίψεως ἡμῶν τῆς ⸀γενομένης ἐν τῇ Ἀσίᾳ, ὅτι καθ’ ὑπερβολὴν ⸂ὑπὲρ δύναμιν ἐβαρήθημεν⸃, ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/008.yaml
  text: For we do not want you to be unaware[a], brothers, about our affliction that happened in Asia, that we were burdened exceedingly, beyond our strength[c][b], so that we despaired even of life.
translation:
  language: ja
  text: というのも、兄弟たち[a]、私たちがアジア州[b]で遭った苦難について、あなたがたに知らないでいてほしくはないのです。私たちは自分たちの力をはるかに超えて、並外れて重く圧迫され、生きる望みさえ失うほどでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」に当たるギリシア語は男性複数形ですが、ここでは女性を含む信仰共同体全体への呼びかけと考えられます。
    reason: cultural_note
  - marker: b
    text: 「アジア州」は、現代のアジア大陸ではなく、小アジア西部にあったローマ帝国の属州を指します。
    reason: cultural_note
lexical_decisions:
- source_word: Οὐ γὰρ θέλομεν ὑμᾶς ἀγνοεῖν
  choice: あなたがたに知らずにいてほしくありません
  rationale: 否定された意志を表す現在形と、不知の状態を表す不定詞を、現代日本語で自然かつ明確に表した。γάρは前文との論理的連結を担うが、単独節の日本語では不自然な「というのは」を避け、文脈上のつながりに委ねた。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 文法上の男性複数形を保つ。共同体全体を包括的に呼びかける用法である可能性は脚注で示した。
- source_word: ὑπὲρ τῆς θλίψεως ἡμῶν τῆς γενομένης ἐν τῇ Ἀσίᾳ
  choice: アジア州で私たちが遭った苦難について
  rationale: θλῖψιςの強い苦痛・圧迫を「苦難」で表し、γενομένηςを日本語として自然な「遭った」とした。「アジア州」は古代ローマ属州を指すことを本文でも明確にする。
- source_word: καθ’ ὑπερβολὴν ὑπὲρ δύναμιν ἐβαρήθημεν
  choice: 耐えられる力をはるかに超えて重く圧迫され
  rationale: 二重の強調を「はるかに超えて」で示し、βαρέωの重荷の比喩を「重く圧迫され」で保持した。δύναμιςはこの文脈で苦難に耐える能力を指すため補って訳した。
- source_word: ὥστε ἐξαπορηθῆναι ἡμᾶς καὶ τοῦ ζῆν
  choice: 生きる望みさえ失うほどでした
  rationale: ὥστεの結果を「ほど」で表し、ἐξαπορέομαιの徹底した絶望とτοῦ ζῆνの範囲を自然な日本語で結びつけた。直訳的には「生きることについてさえ絶望する」に近い。
theological_decisions:
- issue: ἀδελφοίの書簡的呼びかけ
  choice: 兄弟たち
  alternative: 兄弟姉妹の皆さん
  rationale: 原文の文法的性を本文で保持しつつ、男女を含む信仰共同体への呼びかけでありうることを脚注で明示した。
- issue: 生への絶望の表現
  choice: 生きる望みさえ失うほど
  alternative: 生き続けることさえ絶望するほど
  rationale: 死を望んだ、または信仰的希望を全面的に失ったと断定せず、目前の生存について絶望したという原文の幅を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の重圧の比喩と強い絶望を保ちながら、過度に古風な語法を避けた。脚注記号は対応箇所の直後に置いた。
