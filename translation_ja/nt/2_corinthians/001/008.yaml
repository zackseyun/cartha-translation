revisions:
- from: 兄弟たち、アジア州で私たちが遭った苦難について、あなたがたに知らずにいてほしくありません。私たちは耐えられる力をはるかに超えて重く圧迫され、生きる望みさえ失うほどでした。[a][b]
  to: というのも、兄弟たち[a]、私たちがアジア州[b]で遭った苦難について、あなたがたに知らないでいてほしくはないのです。私たちは自分たちの力をはるかに超えて、並外れて重く圧迫され、生きる望みさえ失うほどでした。
