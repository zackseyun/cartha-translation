id: 2CO.1.21
reference: 2 Corinthians 1:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/021.yaml
  text: But the one who establishes us with you in Messiah[a], and who anointed us, is God.
translation:
  language: ja
  text: 私たちをあなたがたと共にメシアにあって堅く立たせ、私たちに油を注いでくださった方は、神です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリストにあって」とも訳せる。ギリシア語の称号は「クリストス」で、ここでは「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: βεβαιῶν
  choice: 堅く立たせ
  rationale: 「確かなものにする、堅固にする」という意味を自然な現代日本語で表し、現在分詞の継続的な働きも読み取れる表現とした。
- source_word: σὺν ὑμῖν
  choice: あなたがたと共に
  rationale: パウロたちとコリントの信徒たちが同じ働きを受けていることを明示する。
- source_word: εἰς Χριστόν
  choice: メシアにあって
  rationale: εἰς の方向性を直訳的な「メシアへ」とせず、ここでの関係的・結合的な用法を自然に表す。Χριστόςは称号として「メシア」とした。
- source_word: χρίσας
  choice: 油を注いでくださった
  rationale: χρίωの基本的な比喩とメシアとの語源的連関を保ちつつ、日本語として理解しやすくした。
- source_word: θεός
  choice: 神です
  rationale: ギリシア語末尾のθεόςが担う強調と、文の述語としての働きを明確に表した。
theological_decisions:
- issue: εἰς Χριστόν の意味
  choice: 関係・結合を示す「メシアにあって」
  alternative: 方向を強く出す「メシアへと」、伝統的な「キリストにあって」
  rationale: パウロ書簡における関係的・結合的意味に適合し、過度に意味を限定せず自然な日本語にするため。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味を保ち、直後のχρίσας（油を注ぐ）との語義上の響きも示すため。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。ギリシア語の語順による末尾の「神」の強調を、「方は、神です」で保った。
