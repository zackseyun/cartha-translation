id: 2CO.1.3
reference: 2 Corinthians 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ πατὴρ τῶν οἰκτιρμῶν καὶ θεὸς πάσης παρακλήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], the Father of mercies and God of all comfort[d][c][b],
translation:
  language: ja
  text: 私たちの主であるイエス・メシア[a]の神であり父である方、あわれみの父[b]、あらゆる慰め[c]の神が、ほめたたえられますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イエス・キリスト」。「メシア」は「油を注がれた者」を意味する称号。
    reason: alternative_reading
  - marker: b
    text: 「あわれみ」は、「深い慈しみ」または「あわれみの数々」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「慰め」に当たる語には、「励まし」「力づけ」という意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: ほめたたえられますように
  rationale: 神への賛美を表す定型的な述語形容詞である。日本語では祈願形にすることで、頌栄としての力と自然さを保てる。
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: 父である神
  rationale: 一つの定冠詞が結び付ける「神であり父である方」という同一指示を、明瞭な現代日本語で表した。
- source_word: κυρίου
  choice: 主
  rationale: 新約聖書のキリスト論的用法に適し、権威と関係性の双方を保つ定着した訳語である。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここではイエスに付される称号としての意味を見える形で保つ。「すなわち」を補い、日本語で姓のように誤解されにくい表現とした。
- source_word: οἰκτιρμῶν
  choice: あわれみ
  rationale: 深い同情と慈悲を表す語。ギリシア語は複数形だが、日本語の抽象名詞として自然な単数形を用い、意味を狭めない。
- source_word: παρακλήσεως
  choice: 慰め
  rationale: 苦難の中で与えられる支えを扱う文脈に最も自然である。語義には励ましや力づけも含まれるため脚注で示した。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ における Χριστός の訳し方
  choice: イエス、すなわちメシア
  alternative: イエス・キリスト
  rationale: Χριστός の称号としての内容を訳文上に保ちつつ、日本語で自然にイエスを指す形とした。本文にない別人同定を導入するものではなく、称号の関係を明示する最小限の補足である。
- issue: ὁ πατὴρ τῶν οἰκτιρμῶν の関係
  choice: あわれみの父
  alternative: あわれみ深い父／あわれみの源である父
  rationale: 属格が性質、所有、源のいずれにも響き得るため、「の」を用いて原文の含みを保ち、一つに限定しなかった。
translation_notes:
  register: 明瞭で格調ある現代標準語。頌栄の調子を保ちながら、過度に古風な「幸いなるかな」等は避けた。「あわれみの父」「慰めの神」は原文の反復と簡潔な属格表現を保持している。
