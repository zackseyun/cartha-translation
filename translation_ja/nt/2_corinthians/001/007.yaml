id: 2CO.1.7
reference: 2 Corinthians 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ ἐλπὶς ἡμῶν βεβαία ὑπὲρ ⸀ὑμῶν· εἰδότες ὅτι ⸀ὡς κοινωνοί ἐστε τῶν παθημάτων, οὕτως καὶ τῆς παρακλήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/007.yaml
  text: And our hope for you is firm[a], because we know that just as you share in the sufferings, so also you share in the comfort.
translation:
  language: ja
  text: あなたがたについて抱いている私たちの希望は揺るぎません。あなたがたは、苦しみにあずかっているのと同じように、慰め[a]にもあずかっていると、私たちは知っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「励まし」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίς
  choice: 希望
  rationale: 期待と確信の両面を保つ、現代日本語で標準的かつ明瞭な訳語。
- source_word: βεβαία
  choice: 揺るぎません
  rationale: 希望が確固としていて信頼できることを、自然で力強い日本語で表す。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたについて抱いている
  rationale: ここでのὑπέρはコリントの人々に関する意味を表すため、「について」を用い、「希望」と自然につながるよう「抱いている」を補った。
- source_word: εἰδότες
  choice: 私たちは知っているからです
  rationale: 分詞が前文の確信の根拠を示す因果関係を、明瞭な日本語として明示した。
- source_word: ὡς ... οὕτως καί
  choice: …のと同じように、…にも
  rationale: 苦しみと慰めへの参与を対応させるギリシア語の相関構文を自然に保持した。
- source_word: κοινωνοί
  choice: あずかっている
  rationale: 単なる共有ではなく、苦しみや慰めへの参与を表す名詞の意味を、自然な動詞表現で伝えた。
- source_word: παθημάτων
  choice: 苦しみ
  rationale: 直前の文脈にも適合し、広い範囲の苦難を含み得る簡潔な訳語。
- source_word: παρακλήσεως
  choice: 慰め
  rationale: 第二コリント1章で繰り返される中心語として文脈的統一性を保ち、苦しみに対応する支えと慰安を表す。
- source_word: '[elliptical second clause]'
  choice: あずかっている
  rationale: 後半ではギリシア語が述語を省略しているが、日本語で意味が明瞭になるよう前半の述語を補った。
theological_decisions: []
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「あずかる」は日常語よりやや格調があるが、κοινωνόςの参与の意味を簡潔に伝え、聖書本文としても自然である。
