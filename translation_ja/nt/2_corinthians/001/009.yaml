id: 2CO.1.9
reference: 2 Corinthians 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς τὸ ἀπόκριμα τοῦ θανάτου ἐσχήκαμεν, ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς ἀλλ’ ἐπὶ τῷ θεῷ τῷ ἐγείροντι τοὺς νεκρούς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/009.yaml
  text: Indeed[a], we ourselves had the sentence of death within ourselves, so that we would not rely on ourselves but on God, who raises the dead.
translation:
  language: ja
  text: しかし実際、私たちは自分たちの内に死の宣告[a]を抱えていました。それは、私たちが自分たち自身に頼らず、死者をよみがえらせる神に頼るためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死の判決」。
    reason: ἀπόκριμαはこの文脈で決定的・司法的な判断を指し得るため。
lexical_decisions:
- source_word: ἀλλὰ
  choice: それどころか
  rationale: 直前の内容を強く受けて一段踏み込む逆接・強意を、現代日本語で自然に示す。
- source_word: αὐτοὶ ἐν ἑαυτοῖς
  choice: 私たちは自分の内に
  rationale: αὐτοίの強調とἐν ἑαυτοῖςの内面的な判断を、重くなりすぎない形で表す。
- source_word: τὸ ἀπόκριμα τοῦ θανάτου
  choice: 死の宣告
  rationale: ἀπόκριμαを、この文脈における決定的・司法的な判定として訳す。「死刑宣告」より広く、死が確定したとの認識を表せる。
- source_word: ἐσχήκαμεν
  choice: 受けたと思いました
  rationale: 字義的には「持っていた」だが、ἐν ἑαυτοῖςと合わせて、自分たちの内で死の宣告が下ったと判断していた意味を自然な日本語にする。完了形の結果状態も表す。
- source_word: ἵνα μὴ πεποιθότες ὦμεν ἐφ’ ἑαυτοῖς
  choice: 私たちが自分自身を頼みとせず
  rationale: 目的を示すἵναと、πεποίθαの継続的な信頼・依存の意味を自然に表す。
- source_word: ἀλλ’ ἐπὶ τῷ θεῷ
  choice: 神を頼みとする
  rationale: 自分への依存との明確な対照を、同じ「頼みとする」で保持する。
- source_word: τῷ ἐγείροντι τοὺς νεκρούς
  choice: 死者をよみがえらせる神
  rationale: 神をその復活の力によって描写する現在分詞の働きを保ち、一般的で明瞭な聖書日本語とする。
theological_decisions:
- issue: τοὺς νεκρούςを集合的な「死者」とするか、抽象度の高い「死人」とするか
  choice: 死者
  alternative: 死人
  rationale: 「死者」は現代標準語として自然で、神が死んだ者たちをよみがえらせるという原文の範囲を余分な解釈なしに保つ。
- issue: 苦難の目的を神の意図として明示するか
  choice: 「それは……ためでした」と目的構文を保つ
  alternative: 「その結果……ようになりました」
  rationale: ἵναはここで目的を表すのが自然であり、結果だけに弱めず、同時に神を明示的な行為主体として補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい落ち着いた格調を保った。「よみがえらせる」は一般読者に通じやすく、復活の含意も保持する。
