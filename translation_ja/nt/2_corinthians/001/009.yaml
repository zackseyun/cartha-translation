  to: しかし実際、私たちは自分たちの内に死の宣告[a]を抱えていました。それは、私たちが自分たち自身に頼らず、死者をよみがえらせる神に頼るためでした。
  rationale: 原文のἀλλάの対照的・強調的な働きを「しかし実際」で表し、αὐτοὶ ἐν ἑαυτοῖςを「私たちは自分たちの内に」と訳した。ἐσχήκαμενに含まれない「受けた」「思った」を除き、「抱えていました」によって完了形の持続する状態と内的な切迫感を表した。目的を示すἵνα、および自分たちへの依存と神への依存の対照は保持した。
