id: 2CO.1.2
reference: 2 Corinthians 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/002.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b].
translation:
  language: ja
  text: '私たちの父である神と、主[b]イエス・キリスト[a]から、恵みと平安があなたがたにありますように。


    [a] 「キリスト」は「メシア」、すなわち「油を注がれた者」という称号です。

    [b] 「主」は、文脈によっては「主人」とも訳せます。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア」、すなわち「油を注がれた者」という称号です。
    reason: Χριστόςの称号としての意味を明示し、日本語で定着した音訳による語義の不透明さを補います。
  - marker: b
    text: 「主」は、文脈によっては「主人」とも訳せます。
    reason: κύριοςの主要な別訳を示します。
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロの挨拶における定訳であり、好意という意味と神学的な重みの双方を自然に保ちます。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数の受取人を指す与格を、明瞭な現代日本語で表します。
- source_word: εἰρήνη
  choice: 平安
  rationale: 聖書的な響きと、単なる争いの不在を超えた安寧の意味を保ちます。
- source_word: ἀπὸ
  choice: から
  rationale: 恵みと平安の源を示す前置詞の意味を直接表します。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 私たちの父である神
  rationale: 神が『私たちの父』であるという同格関係を、曖昧さのない自然な日本語にします。
- source_word: κυρίου
  choice: 主
  rationale: イエスへの称号として新約聖書の文脈と格調に最も適し、『主人』という語義も脚注で示します。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語聖書と一般的な日本語で定着した名称形を用いつつ、Χριστόςが称号であることを脚注で明示します。
theological_decisions:
- issue: パウロの挨拶における Χριστοῦ の訳し方
  choice: 本文では「キリスト」、脚注で「メシア（油を注がれた者）」と説明
  alternative: 本文で「メシア」
  rationale: 日本語では「イエス・キリスト」が自然で広く理解される形です。ただし、単なる固有名のように受け取られないよう、原語が称号であることとその意味を脚注に残します。
- issue: キリスト論的な κυρίου の訳し方
  choice: 主
  alternative: 主人
  rationale: この祝福の定型句ではイエスへの称号として用いられており、「主」が意味と文体の両面で最も適切です。別の文脈で可能な「主人」は脚注に示します。
- issue: 動詞を欠くギリシア語の挨拶文の日本語表現
  choice: 「ありますように」を補う
  alternative: 「恵みと平安があなたがたに」
  rationale: 原文は名詞句による祝福の挨拶ですが、日本語では願いを表す述語を補うことで意味を変えずに自然な文となります。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。書簡の祝福的な挨拶として自然になるよう「ありますように」を補い、語順は恵みと平安の源を先に示して読みやすくしました。
