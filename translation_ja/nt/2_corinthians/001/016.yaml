source:
  edition: SBLGNT
  text: καὶ δι’ ὑμῶν διελθεῖν εἰς Μακεδονίαν, καὶ πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι εἰς τὴν Ἰουδαίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/016.yaml
  text: and through you to pass into Macedonia[a], and again from Macedonia to come to you and by you to be sent on to Judea.
translation:
  language: ja
  text: そして、あなたがたのところを通ってマケドニアへ行き、マケドニアから再びあなたがたのところへ来て、あなたがたに送り出してもらい、ユダヤへ向かうつもりでした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたにユダヤへの旅を助けてもらうつもりでした」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὑμῶν
  choice: あなたがたのところを通って
  rationale: διά＋属格の経由の意味を保ちつつ、コリントを旅程上の訪問地とする自然な日本語にした。
- source_word: διελθεῖν εἰς Μακεδονίαν
  choice: マケドニアへ行き
  rationale: διέρχομαιの通過・移動の意味は直前の「あなたがたのところを通って」で表されるため、日本語では重複を避けて「行き」とした。
- source_word: πάλιν ἀπὸ Μακεδονίας ἐλθεῖν πρὸς ὑμᾶς
  choice: マケドニアから再びあなたがたのところへ来て
  rationale: 出発点、反復、到着先を明示し、原文にない「戻る」は補わなかった。
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι
  choice: あなたがたに送り出してもらい
  rationale: ὑπό＋属格の行為者と受動不定詞を反映した。προπέμπωは旅の支援を伴うことがあるため、その含みを脚注に残した。
- source_word: εἰς τὴν Ἰουδαίαν
  choice: ユダヤへ向かう
  rationale: 目的地への方向を自然な現代日本語で示した。
theological_decisions: []
translation_notes:
  register: 文脈上、前節から続くパウロの当初の旅程を述べる文として「つもりでした」を補った。口語的すぎない明瞭な現代標準日本語とし、原文の移動順序を保持した。脚注記号は、代替訳が関係する旅の送り出しを含む文末に置いた。
