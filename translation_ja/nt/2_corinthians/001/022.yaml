  text: ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/022.yaml
  text: who also sealed us and gave the down payment of the Spirit in our hearts.
translation:
  language: ja
  text: 神はまた、私たちに証印を押し、私たちの心に、手付けとして聖霊を与えられました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「保証」「頭金」。ここでいう「手付け」は、残りも与えられることを保証する最初の支払いを指す。
    reason: ἀρραβώνの主要な訳語候補と、将来の全体を保証する最初の支払いという商取引上の比喩を示すため。
lexical_decisions:
- source_word: ὁ καὶ ... καὶ
  choice: この方はまた……し、
  rationale: 定冠詞を伴う分詞句は前節の神を受ける。「この方」として前文とのつながりを示し、二つの行為を自然な日本語で並列した。
- source_word: σφραγισάμενος
  choice: 私たちに証印を押し
  rationale: 所有・真正性・保護を示し得る封印の比喩を保つ。「封印した」よりも、人に印を付す行為として明瞭な「証印を押す」を採用した。
- source_word: δοὺς
  choice: 与えてくださいました
  rationale: δίδωμιのアオリスト分詞。前の分詞と並列される行為として訳し、神を主語とする文脈にふさわしい敬意を自然な現代日本語で表した。
- source_word: ἀρραβῶνα
  choice: 手付け
  rationale: 残りの履行を確約する最初の支払いという商取引上の比喩を保持する。「保証」だけでは具体的な支払いの像が失われるため、「手付け」を本文に置いた。
- source_word: τοῦ πνεύματος
  choice: 御霊を手付けとして
  rationale: 属格を、手付けが御霊から成るという同格的な意味に理解できる自然な日本語で表した。単に「御霊の手付け」とするより意味が明瞭だが、保証される将来の内容までは補わない。
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: 私たちの心に
  rationale: ἐν＋与格が示す内的・人格的な場所を簡潔に保持した。日本語では授与の到達点として「に」が自然である。
theological_decisions:
- issue: 御霊とἀρραβώνの関係
  choice: 御霊そのものが手付けとして与えられたと読める形にした。
  alternative: 「御霊の手付け」として、御霊が手付けの内容なのか起源なのかをより曖昧に保つ。
  rationale: パウロの用例とこの構文では、与えられた御霊が将来の完成を確約する手付けであるという理解が最も自然である。ただし、何が将来与えられるかは本文で説明せず、神学的展開を加えなかった。
- issue: 証印の神学的含意
  choice: 「証印を押す」という比喩のみを訳出した。
  alternative: 「ご自分のものとして印を付ける」「守りを保証する」と説明する。
  rationale: 所有、真正性、保護などの含意のいずれか一つに限定せず、原文の比喩とその神学的緊張を保持した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「御霊」は聖書本文として通用する語を用い、「証印」「手付け」という原文の二つの比喩を説明に置き換えず保持した。
