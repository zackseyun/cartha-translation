  text: ὅτι καθὼς περισσεύει τὰ παθήματα τοῦ Χριστοῦ εἰς ἡμᾶς, οὕτως διὰ τοῦ Χριστοῦ περισσεύει καὶ ἡ παράκλησις ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/005.yaml
  text: For just as the sufferings of Christ overflow to us[b][a], so also through Christ our comfort overflows.
translation:
  language: ja
  text: というのも、キリスト[a][b]の苦しみが私たちにあふれているのと同じように、私たちの慰めもキリストを通してあふれているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリストのために受ける苦しみ」とも訳せる。ギリシア語は、キリストに属する苦しみ、またはキリストのために受ける苦しみを表し得る。
    reason: alternative_reading
  - marker: b
    text: 「キリスト」は、称号の意味を前面に出す場合には「メシア」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からです
  rationale: 前節の説明を導く因果関係を、現代日本語で自然に示す。
- source_word: καθὼς ... οὕτως ... καὶ
  choice: ……のと同じように、……も
  rationale: 原文の対応する比較構文を明瞭に保つ。
- source_word: περισσεύει
  choice: あふれている
  rationale: 二度反復される豊かさの比喩と動きを保ち、日本語としても自然である。
- source_word: τὰ παθήματα
  choice: 苦しみ
  rationale: πάθημαの直接的かつ文脈に即した訳語である。
- source_word: τοῦ Χριστοῦ
  choice: キリストの
  rationale: 属格の関係を本文では限定せずに保ち、『キリストのための』という可能性は脚注に示す。
- source_word: εἰς ἡμᾶς
  choice: 私たちに
  rationale: 苦しみがパウロたちに及び、経験されることを簡潔に表す。
- source_word: διὰ τοῦ Χριστοῦ
  choice: キリストを通して
  rationale: διά＋属格が示す媒介を自然な日本語で表す。
- source_word: ἡ παράκλησις ἡμῶν
  choice: 私たちが受ける慰め
  rationale: 直訳的な『私たちの慰め』よりも、文脈上の受ける慰めという意味を明瞭にしつつ、過度な解釈を避ける。
theological_decisions:
- issue: 「キリストの苦しみ」の意味
  choice: 属格を保った「キリストの苦しみ」
  alternative: 「キリストのために受ける苦しみ」
  rationale: τοῦ Χριστοῦは、キリストに属する苦しみへの参与とも、キリストのために受ける苦しみとも理解し得るため、本文では関係を断定せず、別解を脚注に残す。
- issue: Χριστόςの表現
  choice: キリスト
  alternative: メシア
  rationale: この箇所ではパウロ書簡に一般的な名称に近い用法と判断するが、称号としての意味も脚注で示す。
