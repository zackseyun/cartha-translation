id: 2CO.1.6
reference: 2 Corinthians 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴτε δὲ θλιβόμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως καὶ σωτηρίας· ⸂εἴτε παρακαλούμεθα, ὑπὲρ τῆς ὑμῶν παρακλήσεως⸃ τῆς ἐνεργουμένης ἐν ὑπομονῇ τῶν αὐτῶν παθημάτων ὧν καὶ ἡμεῖς πάσχομεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/006.yaml
  text: But if we are afflicted[a], it is for your comfort and salvation; or if we are comforted, it is for your comfort[b], which is at work in enduring the same sufferings that we also suffer.
translation:
  language: ja
  text: 私たちが苦難に遭っているなら、それはあなたがたの慰め[b]と救いのためです。また、私たちが慰められているなら、それはあなたがたの慰めのためです[a]。その慰めは、私たちも苦しんでいるのと同じ苦しみに耐え忍ぶときに働くのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本では、「また、私たちが慰められているなら、それはあなたがたの慰めのためです」に当たる部分がありません。
    reason: textual_variant
  - marker: b
    text: この節の「慰め」は、「励まし」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: θλιβόμεθα
  choice: 苦しみに遭う
  rationale: 現在受動態が表す継続的な圧迫や苦難を、現代日本語で自然かつ明瞭に表す。
- source_word: παρακλήσεως / παρακαλούμεθα
  choice: 慰め／慰められる
  rationale: 直前から繰り返される語のつながりを保ち、悲しみを和らげる意味と力づける意味の両方を含み得る表現とした。
- source_word: σωτηρίας
  choice: 救い
  rationale: 文脈上「救出」も可能だが、語の広い救済的意味を保つ最も透明な訳語である。
- source_word: τῆς ἐνεργουμένης
  choice: 働きます
  rationale: 慰めが忍耐の中で実際に作用し、効力を現すことを自然な日本語で示す。
- source_word: ἐν ὑπομονῇ
  choice: 忍耐して受ける中で
  rationale: ἐνの関係には手段・領域の幅があるため、「中で」により断定しすぎず、苦しみを堅く耐える実際の姿を表した。
- source_word: τῶν αὐτῶν παθημάτων
  choice: 同じ苦しみ
  rationale: パウロたちとコリントの信徒が共に経験する苦難という共有性を直接に示す。
- source_word: ὑπὲρ
  choice: のため
  rationale: コリントの信徒への益を示す受益的用法を簡潔に表す。
theological_decisions:
- issue: 「慰め」が働くことと忍耐との関係
  choice: その慰めは、…忍耐して受ける中で働きます
  alternative: その慰めは、…苦しみに耐える忍耐を生み出します
  rationale: 原文のἐν ὑπομονῇは慰めが忍耐を因果的に生み出すとまでは明示しないため、作用の領域または状況を示す訳として原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい品位を保った。「慰め」を反復して原文の語彙的結束を示し、「もし」より自然な「としても」でεἴτε…εἴτεの対応を表した。
