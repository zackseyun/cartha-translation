  text: καθὼς καὶ ἐπέγνωτε ἡμᾶς ἀπὸ μέρους, ὅτι καύχημα ὑμῶν ἐσμεν καθάπερ καὶ ὑμεῖς ἡμῶν ἐν τῇ ἡμέρᾳ τοῦ κυρίου ⸀ἡμῶν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/014.yaml
  text: just as you also came to understand us in part[a], that we are your boast, just as you also are ours[b], in the day of our Lord Jesus.
translation:
  language: ja
  text: あなたがたも、ある程度まで、私たちが私たちの主イエスの日にはあなたがたの誇りであり、あなたがたも私たちの誇りであることを理解するに至りました[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「部分的には」または「いくらかは」。
    reason: lexical_alternative
  - marker: b
    text: または「誇る理由」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέγνωτε
  choice: 理解してくれました
  rationale: 文脈上、コリントの人々がパウロたちについて実際に認識・理解するに至ったことを表す。日本語では関係性も自然に示す「理解してくれました」とし、完全な理解までは含意させない。
- source_word: ἀπὸ μέρους
  choice: ある程度は
  rationale: 理解が部分的・限定的であることを自然な現代日本語で表し、その程度を特定しない。
- source_word: καύχημα
  choice: 誇り
  rationale: ここでは人を根拠として喜び誇る相互関係を指す。「誇り」は日本語として自然で、自己賛美だけに狭めず、パウロの修辞的な力も保つ。
- source_word: καθάπερ
  choice: …であるように
  rationale: パウロたちとコリントの人々との相互的な比較を明示する。
- source_word: ἡμέρᾳ τοῦ κυρίου ἡμῶν Ἰησοῦ
  choice: 私たちの主イエスの日に
  rationale: 終末論的な定型表現と属格関係を簡潔に保つ。
- source_word: κύριος
  choice: 主
  rationale: イエスに対する称号として定着した、文脈に適した訳語。
- source_word: καθὼς καὶ
  choice: …も…ように
  rationale: 前節から続く比較とκαίの付加的な意味を、日本語の語順に合わせて自然に表す。
theological_decisions:
- issue: 相互的なκαύχημα（誇り）の表現
  choice: 私たちがあなたがたの誇りであるように、あなたがたも私たちの誇り
  alternative: 私たちがあなたがたの誇る理由であるように、あなたがたも私たちの誇る理由
  rationale: 使徒と教会が主イエスの日に互いを誇りとするという相互性を保ち、これを単なる自己賛美とも、説明的な意訳ともせず、本文の神学的緊張を残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ある程度は」で限定の曖昧さを保ち、「誇り」を反復して原文の相互性を明確にした。長いギリシア語文は日本語の可読性のため二文に分け、「すなわち」でὅτι節との論理関係を示した。
