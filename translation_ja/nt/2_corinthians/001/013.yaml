reference: 2 Corinthians 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄλλα γράφομεν ὑμῖν ἀλλ’ ἢ ἃ ἀναγινώσκετε ἢ καὶ ἐπιγινώσκετε, ἐλπίζω δὲ ⸀ὅτι ἕως τέλους ἐπιγνώσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/013.yaml
  text: For we are not writing anything else to you except what you read and indeed understand[a], and I hope that you will understand fully to the end,
translation:
  language: ja
  text: というのも、私たちは、あなたがたが読んでおり、また理解していること以外のことを、あなたがたに書いているのではありません。あなたがたが最後まで理解することを、私は願っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「最後まで」は、「十分に」または「完全に」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλα
  choice: …以外
  rationale: 否定された γράφομεν と ἀλλ’ ἢ の構文を自然な日本語にし、書面に表れた内容とは別のことを書いているのではない、という排他性を保つ。
- source_word: ἀναγινώσκετε
  choice: 読んで
  rationale: 手紙に実際に記され、受け手が読んでいる内容を指す基本義を簡潔に表す。
- source_word: ἐπιγινώσκετε
  choice: 理解できる
  rationale: ここでは読むことに加えて内容を把握することを表す。「認める」より文脈に自然であり、現在形の意味も保つ。
- source_word: ἐπιγνώσεσθε
  choice: 理解してくださる
  rationale: 同じ動詞を前半の「理解」と対応させ、未来の期待を自然な日本語で表す。
- source_word: ἕως τέλους
  choice: 終わりまで
  rationale: 時間的・継続的な意味と「完全に」の可能性を不用意に一方へ限定せず、原語の表現を明示的に保つ。
- source_word: οὐ γὰρ ... ἀλλ’ ἢ
  choice: …のは、…以外ではありません
  rationale: 「ほかのことではなく、ただ…」という限定を、明瞭で自然な現代日本語にする。
theological_decisions:
- issue: ἕως τέλους の意味
  choice: 本文では「終わりまで」とする
  alternative: 「十分に／完全に」
  rationale: この句は時間的な終点を表し得る一方、程度の完全さとしても理解され得る。本文では形式を保ち、語義上の幅を脚注で示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、使徒的書簡にふさわしい落ち着いた文体と丁寧な期待表現を採用した。γάρ は前節との論理的連結を日本語では明示せず、文脈上自然な流れを優先した。
