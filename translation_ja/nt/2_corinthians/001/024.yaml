id: 2CO.1.24
reference: 2 Corinthians 1:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχ ὅτι κυριεύομεν ὑμῶν τῆς πίστεως, ἀλλὰ συνεργοί ἐσμεν τῆς χαρᾶς ὑμῶν, τῇ γὰρ πίστει ἑστήκατε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/024.yaml
  text: Not that we lord it over your faith[a], but we are fellow workers for your joy[c][b], for you stand firm by faith.
translation:
  language: ja
  text: あなたがたの信仰を支配するのではありません。むしろ、私たちはあなたがたの喜びのために共に働く者です。あなたがたが信仰によって[a]堅く立っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、「信仰において」。
    reason: τῇ πίστειの与格は、手段・基盤（「信仰によって」）とも、領域（「信仰において」）とも理解できる。
lexical_decisions:
- source_word: κυριεύομεν
  choice: 支配しよう
  rationale: 主として君臨し、権威を振るう意味を表す。否定文の中で、信仰を意のままにするような支配ではないことを自然な日本語で示す。
- source_word: ὑμῶν τῆς πίστεως
  choice: あなたがたの信仰
  rationale: 属格の連なりを自然な所有表現とし、πίστις は文脈どおり「信仰」と訳す。
- source_word: συνεργοί
  choice: 共に働く者
  rationale: パウロたちが上から支配する者ではなく、コリントの人々の益のために共に働く者であるという対比を明確にする。
- source_word: τῆς χαρᾶς ὑμῶν
  choice: あなたがたの喜びのために
  rationale: 属格は、喜びを生み育てることを目指す働きという関係を示すと解し、目的・益を自然に表した。
- source_word: τῇ γὰρ πίστει
  choice: 信仰によって
  rationale: 与格を手段または基盤として訳す。「信仰において」も可能だが、本文では立つ根拠を示す読みを採った。
- source_word: ἑστήκατε
  choice: 堅く立っている
  rationale: 完了形の結果が現在も続く意味を、「堅く立っている」で自然に表す。
theological_decisions:
- issue: 二度現れる πίστις の意味
  choice: 信仰
  alternative: 信頼
  rationale: ここではコリントの人々が信じて立つ姿勢を指すため、通常の「信仰」が最も適切である。忠実さを意味すると限定する文脈上の根拠はない。
- issue: τῇ πίστει の与格の働き
  choice: 信仰によって
  alternative: 信仰において
  rationale: 手段・基盤を表す与格と理解した。ただし、信仰という領域に立つという読みも文法的に可能であり、意味上の緊張は注記で保持できる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的権威と共同の働きとの対比を保った。「支配しようというのではありません」は尊厳を保ちつつ、κυριεύω の否定的含意を過度に口語化せず伝える。
