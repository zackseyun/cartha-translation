id: 2CO.1.12
reference: 2 Corinthians 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἡ γὰρ καύχησις ἡμῶν αὕτη ἐστίν, τὸ μαρτύριον τῆς συνειδήσεως ἡμῶν, ὅτι ἐν ⸀ἁγιότητι καὶ εἰλικρινείᾳ ⸀τοῦ θεοῦ, ⸀οὐκ ἐν σοφίᾳ σαρκικῇ ἀλλ’ ἐν χάριτι θεοῦ, ἀνεστράφημεν ἐν τῷ κόσμῳ, περισσοτέρως δὲ πρὸς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/012.yaml
  text: 'For this is our boast: the testimony of our conscience[a], that we conducted ourselves in the world in holiness and sincerity of God[c][b], not in fleshly wisdom but in the grace of God—and especially toward you.'
translation:
  language: ja
  text: 私たちの誇りはこれです。すなわち、私たちは肉の知恵によらず、神の恵みによって、聖さと神からの誠実さ[a]のうちにこの世で行動してきた、しかも特にあなたがたに対してそうしてきたという、私たちの良心の証しです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神からの誠実さ」は、「神にかなう誠実さ」とも訳せます。異本には「聖さ」の代わりに「純真さ」とするものがあります。
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: καύχησις
  choice: 誇りとすること
  rationale: 文脈上、単なる傲慢ではなく、良心の証言を根拠とする肯定的な確信を表すため。
- source_word: μαρτύριον τῆς συνειδήσεως ἡμῶν
  choice: 私たちの良心も証ししているとおり
  rationale: 属格関係を自然な現代日本語にしつつ、良心による内的な証言という意味を保つため。
- source_word: ἁγιότητι
  choice: 聖さ
  rationale: SBLGNT本文の語義と宗教的・倫理的な含意を簡潔に保つため。異読は脚注に示す。
- source_word: εἰλικρινείᾳ τοῦ θεοῦ
  choice: 神から来る……誠実さ
  rationale: τοῦ θεοῦを源泉を表す属格として本文では自然に訳しながら、性質を表す解釈も脚注に残すため。
- source_word: σοφίᾳ σαρκικῇ
  choice: 肉の知恵
  rationale: σαρκικόςとパウロの「肉」の語群とのつながりを保ち、「この世の知恵」などへの解釈的な言い換えを避けるため。
- source_word: χάριτι θεοῦ
  choice: 神の恵みによって
  rationale: 手段・よりどころを表す与格の機能と、パウロにおけるχάριςの神学的重みを明瞭に表すため。
- source_word: ἀνεστράφημεν
  choice: 歩んできた
  rationale: 生活態度や振る舞いを表す文脈上の意味を、聖書文体として自然で理解しやすい日本語にするため。
- source_word: περισσοτέρως δὲ πρὸς ὑμᾶς
  choice: あなたがたに対してはなおさら
  rationale: περισσοτέρωςの比較・強調の力と、πρόςの対人的な関係を保持するため。
theological_decisions:
- issue: εἰλικρινείᾳ τοῦ θεοῦ における τοῦ θεοῦ の働き
  choice: 本文では「神から来る……誠実さ」とし、神を源泉と解した。
  alternative: 「神にふさわしい誠実さ」「神の御前での誠実さ」「神の誠実さ」
  rationale: 神自身の誠実さを直接指す所有格と断定するより、パウロたちの誠実さが神に由来するとの理解が文脈に適する。ただし属格の幅を狭めすぎないよう、別解を脚注に示した。
- issue: ἐν ἁγιότητι καὶ εἰλικρινείᾳ τοῦ θεοῦ における τοῦ θεοῦ の係り方
  choice: 日本語本文では「神から来る聖さと誠実さ」として、並列された二語全体に係る可能性を表した。
  alternative: τοῦ θεοῦを直前の「誠実さ」だけに係るものとして「聖さと、神から来る誠実さ」と訳す。
  rationale: ギリシア語では属格が直前の名詞だけを限定する可能性と、並列全体を特徴づける可能性の双方がある。自然な日本語を優先しつつ、この統語上の曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「肉」はパウロの主要語彙とのつながりを保つため維持した。「歩んできた」は生活上の振る舞いを自然に示す。本文の論理が長いため、「すなわち」と反復的な「ということ」で構造を見えやすくした。
