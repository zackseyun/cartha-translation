revisions:
- from: 私たちが誇りとするのは、このことです。すなわち、私たちの良心も証ししているとおり、私たちは肉の知恵によらず、神の恵みによって、神から来る聖さ[a]と誠実さ[b]のうちにこの世で歩んできたということ、そして、あなたがたに対してはなおさらそうしてきたということです。
  to: 私たちの誇りはこれです。すなわち、私たちは肉の知恵によらず、神の恵みによって、聖さと神からの誠実さ[a]のうちにこの世で行動してきた、しかも特にあなたがたに対してそうしてきたという、私たちの良心の証しです。
