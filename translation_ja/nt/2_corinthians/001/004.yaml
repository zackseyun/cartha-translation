  terminology: 「苦難」は θλῖψις の重みを適切に伝え、「慰め」の反復は原文の語族反復をよく保つ。脚注は「励ます／励まし」という有力な語義上の代案と、ギリシア語における反復の特徴を過不足なく説明している。
