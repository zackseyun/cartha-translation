id: 2CO.1.4
reference: 2 Corinthians 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ παρακαλῶν ἡμᾶς ἐπὶ πάσῃ τῇ θλίψει ἡμῶν, εἰς τὸ δύνασθαι ἡμᾶς παρακαλεῖν τοὺς ἐν πάσῃ θλίψει διὰ τῆς παρακλήσεως ἧς παρακαλούμεθα αὐτοὶ ὑπὸ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/004.yaml
  text: who comforts us in all our affliction[a], so that we may be able to comfort those in any affliction through the comfort with which we ourselves are comforted by God.
translation:
  language: ja
  text: 神は、私たちが受けるあらゆる苦難の中で私たちを慰めてくださいます。それは、私たち自身が神から受ける慰めによって、どのような苦難の中にいる人々をも、私たちが慰めることができるようになるためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「慰める」「慰め」は、「励ます」「励まし」とも訳せる。ギリシア語では、この節を通して同じ語族の語が繰り返されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλῶν / παρακαλεῖν / παρακλήσεως / παρακαλούμεθα
  choice: 慰めてくださる／慰める／慰め／慰めを受ける
  rationale: 苦難という文脈では、励ましと力づけを含む慰めの意味が中心となる。同じ語族の反復を日本語でも「慰め」に統一して保った。
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: 私たちが受けるあらゆる苦難の中で
  rationale: θλῖψιςの圧迫、苦悩、患難という重みを「苦難」で表し、ἐπίは文脈上自然な「中で」とした。
- source_word: εἰς τὸ δύνασθαι ἡμᾶς
  choice: 私たちが…できるようになるため
  rationale: 目的・結果の双方に開かれた構文だが、文脈上の目的的な流れを自然に示しつつ、神の慰めによって可能になる点を「ようになる」で表した。
- source_word: τοὺς ἐν πάσῃ θλίψει
  choice: どのような苦難の中にいる人々をも
  rationale: πάσῃの広い分配的範囲、すなわち種類を問わない苦難を自然な日本語で示した。
- source_word: αὐτοὶ
  choice: 私たち自身が
  rationale: 強意代名詞の強調を明示した。
- source_word: ὑπὸ τοῦ θεοῦ
  choice: 神から
  rationale: 受動表現の動作主は日本語では「神から慰めを受ける」とするのが自然であり、神が慰めの源であることも明瞭になる。
theological_decisions:
- issue: παρακαλέω／παράκλησιςの意味範囲
  choice: 慰める／慰め
  alternative: 励ます／励まし、力づける／力づけ
  rationale: θλῖψιςとの結び付きから慰めの意味を前面に出した。ただし、この慰めには単なる感情的な安堵だけでなく励ましと力づけも含まれ得るため、脚注で語義の幅を示した。
- issue: εἰς τό不定詞の目的・結果
  choice: できるようになるため
  alternative: その結果、できるように
  rationale: 目的を主に表す訳としたが、「ようになる」によって結果の含みも完全には排除しないようにした。
translation_notes:
  register: 明瞭で現代的かつ礼拝朗読にも耐える丁寧な文体。「くださいます」で神の行為を自然に表し、原文の語族反復は「慰め」で保持した。脚注記号は本文末に置き、節全体に反復される語の説明であることを示した。
