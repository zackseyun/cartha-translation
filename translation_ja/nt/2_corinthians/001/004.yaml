  source_fidelity: 原文の反復される παρακαλέω／παράκλησις 語群を一貫して「慰める／慰め」で再現し、θλῖψις の包括的・分配的な範囲も「あらゆる」「どのような」で適切に表している。εἰς τὸ δύνασθαι は「できるようになるため」により目的を自然に示し、αὐτοὶ の強調も「私たち自身が」で保持されている。受動の動作主 ὑπὸ τοῦ θεοῦ も「神から受ける」で自然かつ意味上十分に明確である。
