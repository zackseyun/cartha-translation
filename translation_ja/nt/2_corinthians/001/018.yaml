source:
  edition: SBLGNT
  text: πιστὸς δὲ ὁ θεὸς ὅτι ὁ λόγος ἡμῶν ὁ πρὸς ὑμᾶς οὐκ ⸀ἔστιν Ναὶ καὶ Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/018.yaml
  text: As surely as God is faithful[b][a], our message to you is not “Yes and No.”
translation:
  language: ja
  text: 神が真実であられるように、あなたがたに対する私たちの言葉は、「はい」であると同時に「いいえ」ではありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、神は真実です。私たちがあなたがたに語る言葉は、『はい』であると同時に『いいえ』ではありません。」
    reason: 原文の接続詞と断言的構文を、より字義的に表す別訳。
lexical_decisions:
- source_word: πιστός
  choice: 真実な方
  rationale: ここでは神が信頼に値し、約束や言葉において揺るがないことを表す。現代日本語で神の属性を自然かつ荘重に示すため「真実な方」とした。
- source_word: δὲ
  choice: （独立した接続語としては訳出せず）
  rationale: この箇所では πιστὸς ὁ θεὸς ὅτι と一体となって、後続の主張の確かさを神の真実に訴えて保証する表現と理解した。日本語では「神が真実な方であるように」という構文でその力を表した。
- source_word: ὅτι
  choice: 神の真実を根拠とする断言の構成要素
  rationale: 単純な「ということ」や「なぜなら」ではなく、神の真実に訴えて後続の主張を確証する関係として訳した。
- source_word: λόγος
  choice: 語ること
  rationale: 単なる個別の「言葉」よりも、パウロたちがコリントの人々に伝えた発言・宣教内容を含み得る。名詞を日本語で自然な「語ること」とし、原語の幅を過度に「福音」や特定のメッセージへ限定しなかった。
- source_word: ἡμῶν
  choice: 私たちが
  rationale: λόγος の属格を、「私たちの語ること」という日本語の主語関係で自然に表した。
- source_word: ὁ πρὸς ὑμᾶς
  choice: あなたがたに
  rationale: 語りかけの方向・対象を簡潔に示した。
- source_word: οὐκ ἔστιν
  choice: なのではありません
  rationale: ギリシア語の現在形と明確な否定を保ちつつ、日本語として自然な断定の否定にした。
- source_word: Ναὶ καὶ Οὔ
  choice: 「然り」であると同時に「否」
  rationale: 対になる語の鋭い対照と標語的な響きを引用符で示した。「はい、そして、いいえ」より、命題への肯定と否定を指す文脈に適した表現である。
theological_decisions:
- issue: πιστὸς δὲ ὁ θεὸς ὅτι の断言的構文
  choice: 神が真実な方であるように、……ではありません
  alternative: しかし、神は真実です。すなわち、……ではありません／神は真実ですから、……ではありません
  rationale: 神の真実をパウロたちの言葉の一貫性を保証する厳粛な根拠として示す構文を採った。「から」として単純な因果関係に固定せず、原文にある断言の力を保った。
- issue: 「然り」と「否」の関係
  choice: 「然り」であると同時に「否」なのではない
  alternative: 「はい」と「いいえ」が入り交じったものではない／時には「はい」、時には「いいえ」ではない
  rationale: 原文の簡潔で意図的な対句を保持し、揺れ動きや自己矛盾という含意を説明的に本文へ加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、神への厳粛な訴えと「Ναὶ καὶ Οὔ」の対句を保つため「真実な方」「然り」「否」を用いた。本文中の脚注記号 [a] は該当文末に配置した。
