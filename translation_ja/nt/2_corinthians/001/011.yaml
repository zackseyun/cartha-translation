  - severity: medium
    issue: ἵνα を「そうすれば」と条件的に表している。
    rationale: ἵνα はここで祈りによる協力に伴う目的・結果を導く。「こうして…ようになるためです」とすることで、条件文に狭めずに自然に表せる。
