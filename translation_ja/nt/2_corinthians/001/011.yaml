source:
  edition: SBLGNT
  text: συνυπουργούντων καὶ ὑμῶν ὑπὲρ ἡμῶν τῇ δεήσει, ἵνα ἐκ πολλῶν προσώπων τὸ εἰς ἡμᾶς χάρισμα διὰ πολλῶν εὐχαριστηθῇ ὑπὲρ ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/011.yaml
  text: as you also join in helping us by prayer[c][b][a], so that thanks may be given by many on our behalf for the gracious gift given to us.
translation:
  language: ja
  text: あなたがたも、祈りによって私たちのために協力してくださっているので、こうして、多くの人々によって、私たちに与えられた恵みの賜物について、私たちのために感謝がささげられるようになるのです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「多くの顔から」。ここで「顔」は人を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳：「こうして、多くの人々から、私たちに与えられた恵みの賜物について、多くの人々を通して、私たちのために感謝がささげられるようになるのです。」ギリシア語の二つの「多くの」の関係には解釈上の難しさがあります。
    reason: alternative_reading
lexical_decisions:
- source_word: συνυπουργούντων
  choice: 共に助けてください
  rationale: 接頭辞 συν- の共同性と、ὑπουργέω の援助する働きを自然な現代日本語で表した。属格絶対に近い分詞構文は、文脈上、読者の祈りによる協力を促す形で訳した。
- source_word: τῇ δεήσει
  choice: 祈りによって
  rationale: δέησις は切実な願い・祈願を指し、ここでは手段を表す与格なので「祈りによって」とした。
- source_word: ἐκ πολλῶν προσώπων
  choice: 多くの人々によって
  rationale: πρόσωπον の字義は「顔」だが、ここでは人を指す慣用的表現として理解し、受動文の行為者を自然に示した。
- source_word: χάρισμα
  choice: 恵みの賜物
  rationale: 神の恵みによって与えられる贈り物という語感を保ち、文脈上の救出という恩恵を限定的に言い換えずに表した。
- source_word: διὰ πολλῶν
  choice: 多くの人々によって
  rationale: 句の係り方には難しさがある。「多くの人を通して」という反復を本文でそのまま再現すると不自然になりやすいため、ἐκ πολλῶν προσώπων と合わせて多数の人による感謝として示し、より逐語的な可能性は脚注に残した。
- source_word: εὐχαριστηθῇ
  choice: 感謝がささげられる
  rationale: 受動形を保ちながら、日本語の宗教的文脈で自然かつ明瞭な表現とした。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのために
  rationale: 利益・関係を表す ὑπέρ を、祈りと感謝の文脈に合う簡潔な日本語で訳した。
theological_decisions:
- issue: χάρισμα が具体的に何を指すか
  choice: 恵みの賜物
  alternative: 救い出してくださった恵み
  rationale: 直前の文脈では神による救出を指す可能性が高いが、本文自体は χάρισμα という幅のある語を用いるため、解釈を本文に織り込まず保持した。
- issue: 多くの人々と感謝の関係
  choice: 多くの人々によって感謝がささげられる
  alternative: 多くの人を通して、多くの人々から感謝がささげられる
  rationale: ἐκ πολλῶν προσώπων と διὰ πολλῶν の構文関係は難解であるため、本文では主要な意味を明瞭にしつつ、重複する「多くの」の可能性を脚注で保存した。
translation_notes:
  register: 明瞭な現代標準語を用い、祈りによる共同の働きと、その結果として広がる感謝を格調を失わずに表現した。「賜物」は聖書語として定着しているが、「恵みの」を添えて現代の読者にも意味を取りやすくした。
