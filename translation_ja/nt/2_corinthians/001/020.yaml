id: 2CO.1.20
reference: 2 Corinthians 1:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅσαι γὰρ ἐπαγγελίαι θεοῦ, ἐν αὐτῷ τὸ Ναί· ⸀διὸ καὶ ⸂δι’ αὐτοῦ⸃ τὸ Ἀμὴν τῷ θεῷ πρὸς δόξαν δι’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/020.yaml
  text: For however many promises of God there are[a], in him is the Yes[c][b]. Therefore also through him is the Amen to God for glory through us.
translation:
  language: ja
  text: というのも、神の約束がどれほど多くあっても、この方において「はい」となっているからです。[a] それゆえまた、この方を通して、私たちは神の栄光のために神に「アーメン」と言うのです。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「この方において『はい』です」。すなわち、神の約束はこの方において確かな肯定を得ています。
    reason: alternative_reading
  - marker: b
    text: 「アーメン」は、ヘブライ語に由来する肯定・同意の言葉で、「確かに」「そのとおり」「そのようになりますように」などの意味を持ちます。
    reason: cultural_note
  - marker: c
    text: または、「私たちを通して神の栄光に至るために」。ギリシア語では「神に」「栄光のために」「私たちを通して」の修飾関係に幅があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσαι
  choice: どれほど多くても
  rationale: 数の多寡を問わず、神の約束のすべてを包括する不定の全体性を自然な日本語で表す。
- source_word: ἐπαγγελίαι θεοῦ
  choice: 神の約束
  rationale: 属格を神ご自身に属する約束として簡潔に表し、一般的で明瞭な語を用いる。
- source_word: ἐν αὐτῷ
  choice: この方にある
  rationale: 直前の文脈で指示されるキリストを敬意ある指示語で示しつつ、圧縮された所在・関係表現を保つ。
- source_word: τὸ Ναί
  choice: その「はい」
  rationale: 定冠詞を受ける強調された単数形を保ち、神のすべての約束に対する決定的な肯定という修辞的効果を表す。
- source_word: διὸ καὶ δι’ αὐτοῦ
  choice: それゆえ…も、この方を通して
  rationale: 推論を示す接続と、キリストによる媒介、および前半との対応を表す「も」を保持する。
- source_word: τὸ Ἀμὴν
  choice: 「アーメン」
  rationale: 日本語の教会・一般宗教語として定着した音写を用い、原文の典礼的響きと「はい」との並行を保つ。
- source_word: τῷ θεῷ
  choice: 神にささげられる
  rationale: 与格がアーメンの向けられる相手を示すことを、補われた受動表現で自然に表す。
- source_word: πρὸς δόξαν
  choice: 神の栄光のために
  rationale: 目的を示す句として表し、文脈上の栄光の帰着先を神と明示するが、修飾関係の別解は脚注に残す。
- source_word: δι’ ἡμῶν
  choice: 私たちを通して
  rationale: パウロと同労者たちを媒介とする幅広い表現を保持し、「宣教」などの限定的説明を加えない。
theological_decisions:
- issue: キリストにおける神の約束を「成就」と明示するか
  choice: 「その『はい』はこの方にある」とし、原文の圧縮された表現を保つ。
  alternative: 「この方において、すべての約束は成就した」または「それらは『はい』となる」。
  rationale: 文脈はキリストにおける成就を強く含意するが、原文には「成就する」に相当する動詞がないため、本文で解釈を確定せず、より明示的な理解を脚注に示す。
- issue: πρὸς δόξαν と τῷ θεῷ・δι’ ἡμῶνの関係
  choice: 「神の栄光のために」を目的句として訳し、アーメンが私たちを通して神にささげられる構造とした。
  alternative: 「私たちを通して神に栄光が帰されるために」と、神を栄光の明示的な帰着先として読む。
  rationale: ギリシア語の語順は簡潔で修飾関係に幅があるため、本文を自然にしつつ別の統語的理解を脚注に保存する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、敬意ある「この方」でキリストを指した。「はい」と「アーメン」の修辞的な並行を引用符で示し、原文の二つの διά 句はそれぞれ「この方を通して」「私たちを通して」と訳し分けずに保持した。
