source:
  edition: SBLGNT
  text: Καὶ ταύτῃ τῇ πεποιθήσει ἐβουλόμην ⸂πρότερον πρὸς ὑμᾶς ἐλθεῖν⸃, ἵνα δευτέραν ⸀χάριν ⸀σχῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/015.yaml
  text: And with this confidence I intended to come to you first[a], so that you might have a second benefit[b],
translation:
  language: ja
  text: この確信をもって、私はまずあなたがたのところへ行くつもりでいました。あなたがたが二度目の恵み[a]を受けることができるようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二度目の恩恵」または「もう一度の恩恵」とも訳せる。ここでの「恵み」は、パウロの訪問によって受ける恵みや益を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεποιθήσει
  choice: 確信
  rationale: 「信頼、確信」を表す語であり、直前に述べた事柄を根拠とするパウロの確かな思いを自然に表す。
- source_word: ἐβουλόμην
  choice: したいと思っていました
  rationale: 意志・意向を表すが、確定済みの計画とまでは限定しない。未実現だった過去の意向も自然に伝わる。
- source_word: πρότερον πρὸς ὑμᾶς ἐλθεῖν
  choice: まずあなたがたのところへ行き
  rationale: πρότερονを旅程上の順序を示す「まず」と理解する。後続の1:16に示される訪問順序とも整合するが、「以前に」という時間的解釈も文法上は可能である。
- source_word: δευτέραν χάριν
  choice: 二度目の恵み
  rationale: χάριςの肯定的な含みを保ちつつ、パウロの訪問によって受ける恩恵を指す表現として訳した。「二度目」をそのまま残し、訪問回数との関係を過度に説明しない。
- source_word: σχῆτε
  choice: 受けられる
  rationale: ἔχωの接続法で、ここでは恩恵を「得る、受ける」という日本語が自然である。目的節のἵναに合わせて可能・目的の形にした。
theological_decisions:
- issue: χάριςが救いの恵みを指すか、訪問による恩恵を指すか
  choice: 本文では「恵み」とし、注で文脈上の意味を示す
  alternative: 恩恵／益
  rationale: 旅程の文脈では訪問によってもたらされる恩恵を指す可能性が高いが、「益」と断定するとχάρις固有の語感が失われるため、本文では原語に近い表現を保った。
- issue: πρότερονの時間関係
  choice: まず
  alternative: 以前に／もっと早く
  rationale: 1:16に続く旅程では、マケドニアに向かう前にコリントを訪れるという順序が中心と見られる。ただし語自体には「以前に、先に」の幅がある。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、書簡にふさわしい落ち着いた調子を保った。「〜したいと思っていました」により、意向を表しながら正式な確定計画だったとまでは言い切らない。
