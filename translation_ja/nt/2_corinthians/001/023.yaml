  text: Ἐγὼ δὲ μάρτυρα τὸν θεὸν ἐπικαλοῦμαι ἐπὶ τὴν ἐμὴν ψυχήν, ὅτι φειδόμενος ὑμῶν οὐκέτι ἦλθον εἰς Κόρινθον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/023.yaml
  text: But I call God as witness upon my own life[b][a], that to spare you I did not come again to Corinth.
translation:
  language: ja
  text: しかし私は、自分の命にかけて神を証人として呼び求めます。あなたがたを容赦するために、私は再びコリントへ行かなかった[a]のです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「再びコリントへ行かなかった」は、文脈により「もうコリントへ行かなかった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: しかし私は
  rationale: δέの穏やかな対照と、明示されたἐγώの強調を、自然な現代日本語で保つ。
- source_word: μάρτυρα τὸν θεὸν ἐπικαλοῦμαι
  choice: 神を証人に呼びます
  rationale: 神に自らの言葉の真実性を証言していただくという、厳粛で法廷的な表現を保つ。
- source_word: ἐπὶ τὴν ἐμὴν ψυχήν
  choice: 自分の命にかけて
  rationale: 直訳は「私自身の魂の上に」だが、誓いに伴う自己への責任を、日本語として明瞭な表現で伝える。
- source_word: ὅτι
  choice: 〜のは、…ためでした
  rationale: 神を証人に呼ぶ際に断言している内容を導く語として理解し、日本語では理由を含む焦点構文で自然に示す。
- source_word: φειδόμενος ὑμῶν
  choice: あなたがたを容赦するため
  rationale: φείδομαιの「厳しい扱いを差し控える、容赦する」という意味と、来訪しなかった動機を保つ。
- source_word: οὐκέτι ἦλθον
  choice: まだ…行かなかった
  rationale: οὐκέτιは文脈上、予定していた再訪をその時点まで見送ったことを表しうる。「もう行かなかった」と断絶の意味に限定せず、別解は脚注に示す。
- source_word: εἰς Κόρινθον
  choice: コリントへ
  rationale: 都市を目的地とする移動を自然な日本語で表す。
theological_decisions:
- issue: ἐπὶ τὴν ἐμὴν ψυχήν が示す誓いの責任
  choice: 自分の命にかけて
  alternative: 私自身に不利な証人として／私の魂の上に
  rationale: パウロが偽りを語るなら自らが裁きを負うという厳粛さを伝えつつ、「魂」を身心二元論的な専門概念に限定しない。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った訳。誓約表現の厳粛さを維持し、「容赦する」は直後の文脈にある使徒的な叱責を差し控えた意味を簡潔に表す。
