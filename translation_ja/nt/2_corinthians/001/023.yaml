  rationale: οὐκέτιの誤った「まだ」を、文脈上も原文の語義上も適切な「再び…行かなかった」に改めた。神を証人として立てる誓約的な呼びかけを「証人として呼び求めます」として明確にし、脚注の位置と文言を説明対象に合わせて整えた。
