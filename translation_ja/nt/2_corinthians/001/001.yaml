id: 2CO.1.1
reference: 2 Corinthians 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς τῇ ἐκκλησίᾳ τοῦ θεοῦ τῇ οὔσῃ ἐν Κορίνθῳ, σὺν τοῖς ἁγίοις πᾶσιν τοῖς οὖσιν ἐν ὅλῃ τῇ Ἀχαΐᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/001.yaml
  text: 'Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother, to the church of God that is in Corinth[b], together with all the saints who are in all Achaia:'
translation:
  language: ja
  text: 神のみこころによってメシア・イエスの使徒であるパウロと兄弟テモテから、コリントにある神の教会、ならびにアカイア全土にいるすべての聖なる者たちへ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア・イエス」は「キリスト・イエス」とも訳せる。
    reason: Χριστόςの称号的意味を本文に示しつつ、日本語で定着した伝統的訳語を併記するため。
lexical_decisions:
- source_word: ἀπόστολος
  choice: 使徒
  rationale: パウロの、神から委任された務めを表す確立した訳語であり、「使者」よりもこの書簡冒頭の自称に適している。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシア・イエス
  rationale: Χριστόςの称号としての意味を明示しつつ、日本語で一まとまりの呼称として読めるよう中黒で結んだ。伝統的な「キリスト・イエス」は脚注に示した。
- source_word: διὰ θελήματος θεοῦ
  choice: 神のみこころによって
  rationale: διά＋属格が示す媒介・根拠を自然な日本語で表し、パウロの使徒職が神の意志に由来することを保持した。
- source_word: ὁ ἀδελφὸς
  choice: 兄弟テモテ
  rationale: 定冠詞を逐語的に「その兄弟」とせず、共同体に属する同信者という関係を、所有語を補わず自然に表した。
- source_word: ἐκκλησίᾳ
  choice: 教会
  rationale: パウロ書簡の宛先表現として定着し、現代日本語でも共同体を自然に指す。
- source_word: ἁγίοις
  choice: 聖なる者たち
  rationale: 語の基本的な意味を明瞭にし、特別な階級や後代の列聖者だけを指すとの誤解を避ける。
- source_word: σὺν
  choice: ならびに
  rationale: コリントの教会に加えてアカイア全土の信徒も宛先に含むことを、書簡の格調を保ちながら自然に示す。
- source_word: ἐν ὅλῃ τῇ Ἀχαΐᾳ
  choice: アカイア全土に
  rationale: 地域全体に及ぶ範囲を簡潔かつ正確に表す。
theological_decisions:
- issue: Χριστόςを称号としてどう訳すか
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: この使徒職の定型句でもΧριστόςのメシア称号としての内容を見える形で保つ。一方、日本語で定着した伝統的表現も真正な訳として脚注に残す。
- issue: ἅγιοιが指す人々
  choice: 聖なる者たち
  alternative: 聖徒たち
  rationale: 神に属する信徒全体を指すパウロ的用法を保ち、後代の限定的な「聖人」概念を持ち込まない。
translation_notes:
  register: 現代標準日本語による、明瞭で格調ある書簡の宛名表現。「となった」は神のみこころによる任命関係を自然に示すための補足。「から／へ」によって、ギリシア語の差出人と宛先の構造を日本語として明確にした。脚注記号は節末に置き、本文全体に関わる異訳であることを示した。
