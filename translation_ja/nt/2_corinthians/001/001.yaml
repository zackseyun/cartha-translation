  source_fidelity: 「使徒となった」は、パウロが使徒になる過程を表しうるため、名詞同格のἀπόστολοςを直接には反映していません。ほかは、差出人・宛先、神の意志による使徒職、コリントの教会とアカイア全域のすべての聖なる者という範囲を適切に伝えています。
  naturalness: 全体として明瞭な現代標準日本語です。ただし、書簡の差出人表現では「使徒であるパウロ」とするほうが自然であり、かつ原文の構文に正確です。
  terminology: 「メシア・イエス」「使徒」「教会」「聖なる者たち」は一貫しており適切です。「兄弟テモテ」は日本語の書簡的・教会的文脈で自然で、原文にない「私たちの」を加えません。脚注aは原文の語順に関する異訳を正しく示します。英語監査記録の脚注bはコリントに付されながらテモテを説明しており、誤ったアンカーですが、日本語草案はこれを継承していないため追加すべきではありません。
  issues:
