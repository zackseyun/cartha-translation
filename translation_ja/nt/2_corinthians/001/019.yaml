id: 2CO.1.19
reference: 2 Corinthians 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ⸂τοῦ θεοῦ γὰρ⸃ υἱὸς ⸂Ἰησοῦς Χριστὸς⸃ ὁ ἐν ὑμῖν δι’ ἡμῶν κηρυχθείς, δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου, οὐκ ἐγένετο Ναὶ καὶ Οὒ, ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/019.yaml
  text: For the Son of God[a], Jesus the Messiah, who was proclaimed among you through us—through me and Silvanus and Timothy—did not become Yes and No; rather[d][c][b], in him it has become Yes.
translation:
  language: ja
  text: 神の子、イエス・キリスト、すなわち、私たちを通して、私とシルワノとテモテを通して、あなたがたの間で宣べ伝えられた方は、「はい」と「いいえ」にはならず、むしろ、彼にあって「はい」となったのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の子、イエス・キリストは、…『はい』でもあり『いいえ』でもあったのではなく、むしろ、彼にあって『はい』となっています。」
    reason: ἐγένετοおよびγέγονενはともにγίνομαιの形であり、前者の過去形と後者の完了形の関係を、「あったのではなく／となっています」として反映する訳も可能である。
lexical_decisions:
- source_word: ὁ τοῦ θεοῦ υἱός
  choice: 神の子
  rationale: 自然な日本語の語順で、称号としての意味とキリスト論的な重みを保った。
- source_word: Ἰησοῦς Χριστός
  choice: イエス・キリスト
  rationale: ここでは「神の子」と同格で、まとまった固有名的呼称として機能しているため、日本語で定着した「イエス・キリスト」とした。
- source_word: κηρυχθείς
  choice: 宣べ伝えられました
  rationale: κηρύσσωの公に告げ知らせる意味を保ちつつ、聖書本文として自然で理解しやすい表現を選んだ。
- source_word: δι’ ἡμῶν
  choice: 私たちを通して
  rationale: διάが示す媒介・働き手の関係を明示し、後続する人物名との反復も保った。
- source_word: δι’ ἐμοῦ καὶ Σιλουανοῦ καὶ Τιμοθέου
  choice: 私とシルワノとテモテを通して
  rationale: パウロ自身と同労者たちを原文どおり列挙し、先行するδιάの構造を日本語でも反映した。
- source_word: οὐκ ἐγένετο Ναὶ καὶ Οὔ
  choice: 「はい」であると同時に「いいえ」であるような方にはならず
  rationale: ἐγένετοの変化・成立の含みを「ならず」で残しつつ、「はい」と「いいえ」の並置が表す矛盾を、日本語で誤解されにくい形にした。
- source_word: ἀλλὰ Ναὶ ἐν αὐτῷ γέγονεν
  choice: むしろ、この方において「はい」となったのです
  rationale: ἐν αὐτῷを解釈で置き換えず、「この方において」と保持した。完了形γέγονενは、成立して今もその状態にある含みを文脈上自然な「となったのです」で表した。
theological_decisions:
- issue: Χριστόςを称号として訳すか、固有名的呼称として訳すか
  choice: イエス・キリスト
  alternative: メシアであるイエス
  rationale: Ἰησοῦς Χριστόςはここでまとまった人物呼称として自然に読まれる。日本語で広く定着した「イエス・キリスト」を本文に置き、語源的・称号的意味を過度に前景化しなかった。
- issue: 「はい」と「いいえ」の対照を説明的に言い換えるか
  choice: パウロの「はい／いいえ」という比喩的表現を保持する
  alternative: 一貫性のない方ではなく、確かな方であった
  rationale: キリストにおける神の真実性を語る文脈だが、「信頼できる」などの解釈語に還元せず、原文の修辞と神学的緊張を残した。
- issue: γέγονενの完了相をどう表すか
  choice: 「はい」となったのです
  alternative: 「はい」であり続けています
  rationale: 成立の出来事を示すγίνομαιの語義を保ち、継続性だけを強調する意訳を避けた。日本語では文脈と完了的な言い切りにより、成立した結果が有効である含みを伝える。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文としての品位を保った。「この方」を用いて指示対象を明確にし、「はい／いいえ」は引用符で修辞的用法を示した。人名は現代日本語聖書で一般的な「シルワノ」「テモテ」とした。
