revisions:
- from: 神の子イエス・キリストは、私たちを通して、すなわち私とシルワノとテモテを通して、あなたがたの間で宣べ伝えられました。この方は「はい」であると同時に「いいえ」であるような方にはならず、むしろ、この方において「はい」となったのです。[a]
  to: 神の子、イエス・キリスト、すなわち、私たちを通して、私とシルワノとテモテを通して、あなたがたの間で宣べ伝えられた方は、「はい」と「いいえ」にはならず、むしろ、彼にあって「はい」となったのです。[a]
  rationale: 原文の主語「神の子イエス・キリスト」と、これを修飾する宣教の関係分詞句、および「はい／いいえ」の対照を一文内で対応させた。「ような方」という説明的補足を除きつつ、ἐγένετοとγέγονενの「なる」という語彙的連関を本文で保った。脚注は完了形の結果状態を反映する代替訳に整えた。
