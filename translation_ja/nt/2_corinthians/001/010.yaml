id: 2CO.1.10
reference: 2 Corinthians 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ἐκ τηλικούτου θανάτου ἐρρύσατο ἡμᾶς καὶ ⸀ῥύσεται, εἰς ὃν ἠλπίκαμεν ὅτι καὶ ἔτι ῥύσεται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/001/010.yaml
  text: who rescued us from so great a death and will rescue us[a], in whom we have hoped that he will indeed rescue us again,
translation:
  language: ja
  text: この方は、これほどの死[a]から私たちを救い出してくださった方であり、これからも救い出してくださいます。私たちはこの方に望みを置いています。この方が今後もなお救い出してくださると望んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これほど恐ろしい死の危険」。直訳は「これほどの死」。
    reason: θανάτου は字義的には「死」だが、この句を生命を脅かす危険を指す表現と理解することもできるため。
lexical_decisions:
- source_word: τηλικούτου θανάτου
  choice: これほど大きな死の危険
  rationale: τηλικούτου の強意を「これほど大きな」で保ちつつ、θάνατος の死のイメージを残し、文脈上の生命を脅かす危険を自然な日本語で表した。直訳的な「これほど大きな死」は現代日本語では意味が取りにくいため避けた。
- source_word: ἐρρύσατο / ῥύσεται
  choice: 救い出してくださり／救い出してくださいます
  rationale: 危険からの具体的な救出を表す同一動詞の反復を、日本語でも同じ「救い出す」で保った。神を主語とする文脈にふさわしく敬意表現を用いた。
- source_word: εἰς ὃν
  choice: この方に
  rationale: 希望を向け、置く対象を示す構文として、現代日本語では「この方に望みを置く」が自然であり、人格的な焦点も保てる。
- source_word: ἠλπίκαμεν
  choice: 望みを置いています
  rationale: 完了形が示す、すでに始まり現在も続く確かな希望を、継続的な状態として自然に表した。
- source_word: καὶ ἔτι
  choice: 今後もなお
  rationale: καί の強調と ἔτι の継続・将来性を合わせて表し、さらなる救出への期待を明示した。
theological_decisions:
- issue: θανάτου を文字どおり「死」とするか、文脈的に「死の危険」とするか
  choice: 本文では「死の危険」とし、脚注で字義を示す
  alternative: 「これほど大きな死」
  rationale: θάνατος の字義的な像を「死」によって保ちながら、この属格句が表す致命的危機を明瞭で自然な日本語にした。単に「危険」として死の要素を消すことは避けた。
- issue: 二つの未来形 ῥύσεται の関係
  choice: 最初を一般的な将来の救出、後半を継続・反復される将来の救出として表す
  alternative: 両方を全く同じ表現で機械的に反復する
  rationale: 原文の動詞反復を保ちながら、καὶ ἔτι が加える継続的な期待を「今後もなお」で示した。救出の具体的な時や様態は限定しない。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「この方」を反復して指示対象を明確にし、長いギリシャ語文は読みやすい三文に分けた。「望みを置いています」で完了形の継続性を表し、「救い出す」の反復で原文の語彙的一貫性を保った。
