  text: so that I may not seem as though I were trying to frighten you by my letters[a].
translation:
  language: ja
  text: 私が手紙によってあなたがたを恐れさせようとしているかのように思われないためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「手紙によってあなたがたを脅そうとしているかのように」。
    reason: ἐκφοβεῖν は基本的に「恐れさせる、怖がらせる」を意味し、文脈上は「脅す、威圧する」とも表現できるため。
lexical_decisions:
- source_word: ἵνα μὴ
  choice: 〜ないためです
  rationale: 前の文脈に結び付く目的または意図された結果を表す従属節として訳し、否定を明確にした。
- source_word: δόξω
  choice: 私が…思われない
  rationale: δοκέω のここでの意味は「考える」ではなく「〜のように見える、思われる」。日本語では受け身の「思われる」が自然に外見上の印象を表す。
- source_word: ὡς ἂν
  choice: 〜かのように
  rationale: 後続する行為を、実際の断定ではなく外見上そう受け取られ得ることとして表す比較的・緩和的な含みを保った。
- source_word: ἐκφοβεῖν
  choice: 脅そうとしている
  rationale: 強い恐れを起こさせる意。文脈では手紙による威圧というニュアンスがあり、「脅す」が簡潔で自然。「〜しようとしている」により、そう見える意図・試みとしての構文を日本語化した。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 複数二人称の直接目的語を明示した。
- source_word: διὰ τῶν ἐπιστολῶν
  choice: 手紙によって
  rationale: διά＋属格の手段を「〜によって」で表した。原文は定冠詞付きの複数形だが、所有代名詞は明示されていないため、本文では「私の」を補わず、原文により近く保った。
