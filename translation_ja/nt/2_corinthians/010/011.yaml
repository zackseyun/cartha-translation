  text: τοῦτο λογιζέσθω ὁ τοιοῦτος, ὅτι οἷοί ἐσμεν τῷ λόγῳ δι’ ἐπιστολῶν ἀπόντες, τοιοῦτοι καὶ παρόντες τῷ ἔργῳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/011.yaml
  text: 'Let such a person consider this: what we are in word by letters when absent[b][a], we are also in deed when present.'
translation:
  language: ja
  text: そのような人は、次のことをよく考えなさい。私たちは、離れているときに手紙の言葉で示しているとおりの者であり、そばにいるときにも行いにおいてそのとおりの者です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογιζέσθω
  choice: よく考えなさい
  rationale: 三人称単数の命令を、日本語では対象者への直接的な命令として自然に表現した。「考慮に入れなさい」より平明で、事実を十分に認識せよという力を保つ。
- source_word: ὁ τοιοῦτος
  choice: このような人
  rationale: 直前までに述べられた種類の批判者を指す単数表現。現代日本語として自然で、軽蔑的な含みを不必要に加えない。
- source_word: οἷοί ἐσμεν … τοιοῦτοι
  choice: 示すとおりの者であり……そのとおりの者です
  rationale: 人の性質・あり方を比較する対応表現を日本語で明確にし、前半と後半が同一であるという主張を保った。
- source_word: τῷ λόγῳ
  choice: 言葉で
  rationale: 領域・点を示す与格。τῷ ἔργῳとの対照を「言葉で……行いで」と簡潔に再現する。
- source_word: δι’ ἐπιστολῶν
  choice: 手紙の
  rationale: 手紙が言葉を伝える媒体であることを、自然な日本語の「手紙の言葉」で表した。複数形は集合的に理解できる。
- source_word: ἀπόντες
  choice: 離れているとき
  rationale: 状況を表す現在分詞であり、παρόντεςとの対照が明確になる自然な時間節とした。
- source_word: παρόντες
  choice: そばにいるとき
  rationale: 単なる『存在する』ではなく、相手のもとに実際に居合わせる意味を表し、ἀπόντεςとの対照を保つ。
- source_word: τῷ ἔργῳ
  choice: 行いで
  rationale: 領域・点を示す与格。『言葉で』と対照させ、実際の行動を指すことを明確にした。
theological_decisions:
- issue: 手紙での言葉と対面時の行動との関係
  choice: 不在時に手紙で示すあり方と、対面時に行動で示すあり方が一致するとの警告として訳す。
  alternative: 将来の処罰だけを明示する脅しとして意訳する。
  rationale: ギリシア語は、手紙における言葉と対面時の行いを直接対比しつつ同一性を主張する。警告の含意はあるが、原文以上に特定の処罰内容を補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的な警告にふさわしい端正さと強さを保った。「言葉で……行いで」の対照が不自然にならないよう、「示すとおり」を補って構文関係を明確にした。
