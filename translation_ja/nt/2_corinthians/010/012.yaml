  text: Οὐ γὰρ τολμῶμεν ἐγκρῖναι ἢ συγκρῖναι ἑαυτούς τισιν τῶν ἑαυτοὺς συνιστανόντων· ἀλλὰ αὐτοὶ ἐν ἑαυτοῖς ἑαυτοὺς μετροῦντες καὶ συγκρίνοντες ἑαυτοὺς ἑαυτοῖς οὐ συνιᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/012.yaml
  text: For we do not dare to classify or compare ourselves with some of those who commend themselves[a]. But when they measure themselves by themselves and compare themselves with themselves[b], they do not understand.
translation:
  language: ja
  text: 私たちは、自分を推薦する者たちのうちのある人々と自分たちを同列に置いたり[a]、自分たちを比べたりすることを、あえてしません。しかし彼ら自身は、自分たちを基準にして自分たちを測り、自分たちを自分たちと比べているので、理解がありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「自分たちをその仲間に加えたり」「同じ部類に入れたり」。ギリシア語には、自分を他の人々と同じ部類に位置づけるという意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: τολμῶμεν
  choice: あえて思いません
  rationale: 行為を大胆にも試みる、あるいは僭越にも行うという含みを保ちつつ、パウロの皮肉を自然な現代日本語で表した。
- source_word: ἐγκρῖναι
  choice: 同列に置く
  rationale: 単なる判断ではなく、自分を他者と同じ部類・階級に位置づける意味を明確にした。
- source_word: συγκρῖναι / συγκρίνοντες
  choice: 比べる／比べる
  rationale: 二度の反復を同じ訳語で再現し、議論の修辞的なつながりを保った。
- source_word: ἑαυτοὺς συνιστανόντων
  choice: 自分を推薦する者たち
  rationale: 文脈上の自己推薦・自己称賛を表す。『推薦する』は後続箇所との語彙上のつながりも保てる。
- source_word: ἀλλὰ αὐτοὶ
  choice: しかし彼ら自身は
  rationale: αὐτοίの強調を明示し、パウロたちと自己推薦する者たちとの対照を保った。
- source_word: ἐν ἑαυτοῖς
  choice: 自分たちの中で
  rationale: 『自分たちの間で』『自分たち自身を基準として』の両方を含み得る表現なので、解釈を一つに限定しすぎない訳とした。
- source_word: μετροῦντες
  choice: 測り
  rationale: 評価を意味する比喩であるが、原文の『測る』という像を保持した。
- source_word: οὐ συνιᾶσιν
  choice: 理解していません
  rationale: 目的語が明示されていない原文に従い、何を理解していないのかを訳文で補わなかった。
theological_decisions:
- issue: 自己測定が指す基準
  choice: 本文では『自分たちの中で』として曖昧さを残し、脚注で自己基準という文脈上の意味を示す
  alternative: 『自分たちを基準にして』と本文で明示する
  rationale: 原文ἐν ἑαυτοῖςの形を尊重しつつ、自己評価に対する批判という文脈的含意を読者に伝えるため。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。原文に集中する再帰代名詞の反復をある程度残し、自己基準による比較への皮肉を伝えた。
