  source_fidelity: 要修正です。冒頭の「自分を推薦する者たちの一部と」は、τισίν（「ある人々と」）を「一部」としており、日本語では「自己推薦する者たちの一部」と比較する意味にも読めます。原文は「自己推薦する者たちのうちのある人々と」自分たちを同列に置く／比較することを指します。また、ἐν ἑαυτοῖςは自己を基準とする自己完結した比較という文脈上の意味を、本文で自然に明示するのが適切です。
  naturalness: 「～したり、比べたりしようとは、あえて思いません」は不自然ではありませんが、「あえて～しません」の方がτολμῶμενの『あえて／僭越にも…する』という否定を明瞭かつ自然に表します。「自分たちの中で自分自身を測り、自分を自分と比べていて」も再帰表現の単複が揺れ、読みづらくなっています。
  terminology: 「自分を推薦する者たち」「同列に置く」「比べる」「測る」は適切です。自己比較の反復を保つため、「自分たち」を一貫して用います。
