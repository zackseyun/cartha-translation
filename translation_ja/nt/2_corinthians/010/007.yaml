  text: Τὰ κατὰ πρόσωπον βλέπετε. εἴ τις πέποιθεν ἑαυτῷ Χριστοῦ εἶναι, τοῦτο λογιζέσθω πάλιν ⸀ἐφ’ ἑαυτοῦ ὅτι καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ⸀ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/007.yaml
  text: 'You are looking at outward appearances[a]. If anyone is confident in himself that he belongs to Messiah, let him consider this again within himself: that just as he belongs to Messiah[b], so also do we.'
translation:
  language: ja
  text: あなたがたは、うわべだけを見ています[a]。だれかが、自分はメシアに属している[b]と確信しているなら、その人は自分で改めて次のことを考えるべきです。すなわち、自分がメシアに属しているのと同じように、私たちもメシアに属しているということです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「あなたがたは外見に従ったことを見ています」。また、「目の前にあるものを見なさい」と命令文に取ることもできます。
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: ギリシア語では「メシアのものである」。ここでは帰属の意味を明確にして「メシアに属している」と訳しました。
    reason: literal_rendering
lexical_decisions:
- source_word: Τὰ κατὰ πρόσωπον
  choice: うわべだけ
  rationale: 直訳的には「顔に即したこと／目の前のこと」だが、ここでは外面や表面的な事柄を指す慣用的表現と判断した。「うわべだけ」は現代日本語として明瞭で、パウロの批判的な語調も伝える。
- source_word: βλέπετε
  choice: 見ています
  rationale: 直説法にも命令法にも取り得る形だが、文脈とSBLGNTの句読法に従い、相手の現状を叱責する直説法として訳した。別の可能性は脚注に残した。
- source_word: πέποιθεν ἑαυτῷ
  choice: 自分は…と確信している
  rationale: 完了形が表す定着した確信を自然な日本語で示し、ἑαυτῷの自己に関する確信も明示した。
- source_word: Χριστοῦ εἶναι
  choice: メシアに属している
  rationale: 属格＋εἶναιが表す帰属関係を明確にした。Χριστόςは称号として「メシア」と訳した。
- source_word: λογιζέσθω πάλιν ἐφ’ ἑαυτοῦ
  choice: 自分自身でもう一度よく考えなさい
  rationale: 再考を促す命令と、本人が自ら内省すべき含意を、自然で格調を保った現代日本語で表した。
- source_word: καθὼς αὐτὸς Χριστοῦ οὕτως καὶ ἡμεῖς
  choice: 自分がメシアに属しているのと同じように、私たちもメシアに属している
  rationale: 後半で省略されている帰属表現を日本語では補い、比較の対等性を明瞭にした。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここではΧριστόςを称号として扱い、「油注がれた者」という称号性を保つため「メシア」とした。
- issue: 相手側のメシアへの帰属の扱い
  choice: 相手が主張する帰属を認めた上で、パウロたちも同じく属すると述べる形を保持
  alternative: 相手の帰属そのものを否定する含みにする
  rationale: καθὼς…οὕτως καίの比較構文は、この文面上、相手の主張を条件付きで受けてパウロ側にも同じ帰属を認めるよう求めている。否定的な神学判断を訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、叱責と勧告の重みを保った。「だれか」「その人」により不要な性別表示を避けた。
