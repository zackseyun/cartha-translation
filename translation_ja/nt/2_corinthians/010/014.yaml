  text: οὐ γὰρ ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς ὑπερεκτείνομεν ἑαυτούς, ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν ἐν τῷ εὐαγγελίῳ τοῦ Χριστοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/014.yaml
  text: For we are not overextending ourselves[a], as though we had not reached you[c][b], for we came even as far as you with the gospel of Messiah—
translation:
  language: ja
  text: 私たちは、あなたがたのところにまで届いていないかのように、必要以上に身を伸ばしているのではありません。というのも、私たちはメシアの福音を携えて、あなたがたのところにまで来たからです。――
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεκτείνομεν ἑαυτούς
  choice: 限度を越えて自分たちを伸ばしている
  rationale: 「適切な範囲を越えて身を伸ばす」という比喩を保ちつつ、文脈上の宣教領域の越権という含みが伝わる現代日本語とした。
- source_word: ὡς μὴ ἐφικνούμενοι εἰς ὑμᾶς
  choice: あなたがたのところまで届いていないかのように
  rationale: 分詞句が示す仮定的な状況を自然に表し、空間的・宣教的な到達の両義性を残した。
- source_word: ἄχρι γὰρ καὶ ὑμῶν ἐφθάσαμεν
  choice: 実際、私たちは……あなたがたのところにまで到達した
  rationale: γάρを「実際」で説明として示し、καίの強調は「にまで」で表した。ἐφθάσαμενの完了した到達も明確にした。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 福音を携えて
  rationale: ἐνが表し得る領域・随伴・手段を、日本語として自然な宣教行為の表現にした。単なる物理的移動ではなく、福音宣教による到達であることを示す。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: ここでは福音を修飾する称号としての機能が明瞭であり、Χριστόςの称号的意味を訳出した。
theological_decisions:
- issue: τοῦ Χριστοῦの訳語
  choice: メシアの福音
  alternative: キリストの福音
  rationale: Χριστόςが固有名のようにではなく称号として機能しているため、「メシア」とした。「の」が、メシアに関する福音とメシアに属する福音の双方を許す原文の関係を保つ。
- issue: 宣教範囲をめぐる比喩
  choice: 限度を越えて自分たちを伸ばしているのではありません
  alternative: 分を越えているのではありません
  rationale: パウロが正当な宣教範囲を越えたとの含意を否定する一方、原文の「伸ばす」という身体的比喩も残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの論証的でやや強い調子を保った。前後の文脈へ続く末尾のダッシュも残した。
