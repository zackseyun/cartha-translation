source:
  edition: SBLGNT
  text: τὰ γὰρ ὅπλα τῆς στρατείας ἡμῶν οὐ σαρκικὰ ἀλλὰ δυνατὰ τῷ θεῷ πρὸς καθαίρεσιν ὀχυρωμάτων— λογισμοὺς καθαιροῦντες
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/004.yaml
  text: For the weapons of our warfare are not fleshly[c][b][a], but powerful before God for the tearing down of strongholds—tearing down arguments
translation:
  language: ja
  text: というのも、私たちが戦いに用いる武器は、肉に属するものではなく[a]、神にあって力あるものであり[b]、要塞を打ち壊すためのものだからです。私たちは、議論を打ち壊し[c]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「肉によるものではなく」または「人間的なものではなく」。
    reason: lexical_alternative
  - marker: b
    text: または「神によって力あるものであり」「神から力を受けたものであり」。
    reason: alternative_reading
  - marker: c
    text: 「議論」と訳した語は、「推論」「思惑」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπλα
  choice: 武器
  rationale: 軍事的な比喩を具体的かつ自然に保つ。
- source_word: στρατείας
  choice: 戦い
  rationale: 軍事行動を表す語であり、文脈では継続的な霊的闘争を指す。「戦争」より個人を含む営みとして自然。
- source_word: σαρκικὰ
  choice: 肉に属するもの
  rationale: 単に「世俗的」「罪深い」と限定せず、パウロの「肉」という語との結びつきと、人間的手段との対比を保つ。
- source_word: δυνατὰ τῷ θεῷ
  choice: 神の御前で力あるもの
  rationale: 圧縮された与格表現を過度に手段・源泉と断定せず、原文に近い曖昧さを保つ。別解を脚注に示す。
- source_word: καθαίρεσιν
  choice: 打ち壊す
  rationale: 要塞攻略の鮮明な比喩を保ち、続く καθαιροῦντες との語の反復も再現する。
- source_word: ὀχυρωμάτων
  choice: 要塞
  rationale: 防備された拠点という軍事的イメージを明確に伝える。
- source_word: λογισμοὺς
  choice: さまざまな議論
  rationale: 次節の神の知識に逆らう知的抵抗を踏まえつつ、「思考」「推論」も含み得る幅を脚注で保つ。
- source_word: καθαιροῦντες
  choice: 打ち壊し
  rationale: 同根の καθαίρεσιν と同じ訳語を反復し、修辞的連結を示す。
theological_decisions:
- issue: σαρκικὰ が表す、人間的手段と神的な力との対比
  choice: 肉に属するものではなく
  alternative: 人間的なものではなく／世俗的なものではなく
  rationale: 「肉」を道徳的罪性だけに限定せず、パウロ特有の神学的緊張を残す。
- issue: τῷ θεῷ の与格の意味
  choice: 神の御前で力ある
  alternative: 神によって力ある／神のために力ある
  rationale: 与格は手段・関係・評価などに解し得るため、本文では「御前で」を採り、神を力の源と見る解釈は脚注に残す。
- issue: 節末の分詞 καθαιροῦντες と次節の関係
  choice: 「私たちは、…打ち壊し、」として次節へ継続
  alternative: 「議論を打ち壊すものです」と本節内で完結
  rationale: ギリシア語は節区切りを持たず、分詞は後続内容へ続く。日本語でも文を未完のまま次節につなげ、構文上の連続性を保つ。
translation_notes:
  register: 明瞭で現代的ながら、軍事比喩とパウロの「肉」という神学的語彙を保つ格調ある文体。「というのも」で前節との論理的連結を示し、節末は次節へ続く構文として訳した。
