  text: ἐν σαρκὶ γὰρ περιπατοῦντες οὐ κατὰ σάρκα στρατευόμεθα—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/003.yaml
  text: For though we walk in the flesh[a], we do not wage war according to the flesh—
translation:
  language: ja
  text: というのは、私たちは肉にあって歩んでいますが、肉に従って戦っているのではありません[a]――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちは肉体をもって生きていますが、単なる人間的な基準で戦っているのではありません」。
    reason: 第一の「肉」は身体をもつ人間としての生を、第二の「肉」は人間的・この世的な基準や方法を表し得るため。
lexical_decisions:
- source_word: ἐν σαρκὶ
  choice: 肉にあって
  rationale: 第一のσάρξは、罪深い性質と限定せず、身体をもつ人間としての現実を指す。やや直訳的な「肉にあって」により、後半との語の反復と意味の緊張を保った。
- source_word: γὰρ
  choice: （明示せず）
  rationale: γάρは前節を説明するが、日本語で「というのは」を補うと単独節として重くなるため、文脈上の説明関係を語順と接続で自然に示した。
- source_word: περιπατοῦντες
  choice: 歩んでいますが
  rationale: περιπατέωの「歩く」という比喩を保ちつつ、後続する否定との対照を「が」で表した。ここでは生活・生き方を含意する。
- source_word: οὐ κατὰ σάρκα
  choice: 肉に従って…ではありません
  rationale: κατάが示す規範・基準を「に従って」で表し、単に「人間的な基準で」などと意味を限定せず、第一のσάρξとの反復を保った。
- source_word: στρατευόμεθα
  choice: 戦っている
  rationale: 軍事的比喩を自然な現代日本語で示す。「従軍する」よりも、この文脈での使徒的な争い・戦いを明瞭に表す。
theological_decisions:
- issue: 二度のσάρξの訳し分け
  choice: 両方を「肉」と訳す
  alternative: 「肉体をもって生きていても、人間的な基準で戦うのではない」
  rationale: 第一の用例は身体をもつ人間としての生を、第二は人間的・肉的な原理に従う戦い方を指すが、同じ語を反復するパウロの修辞と神学的緊張を本文に残すため、訳し分けなかった。
- issue: 分詞περιπατοῦντεςの論理関係
  choice: 譲歩・対照を示す「歩んでいますが」
  alternative: 同時性を前面に出す「歩みながら」
  rationale: 後半のοὐとの対照から譲歩的に理解するのが自然だが、強い「にもかかわらず」を避け、「が」によって原文が許す幅を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「肉にあって」は日常語より聖書的な表現だが、原文のσάρξの反復と曖昧さを保存するため採用した。節末のダッシュは日本語では不自然なため句点としたが、後続節へ論旨が続くことは文脈に委ねた。
