id: 2CO.10.1
reference: 2 Corinthians 10:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Αὐτὸς δὲ ἐγὼ Παῦλος παρακαλῶ ὑμᾶς διὰ τῆς πραΰτητος καὶ ἐπιεικείας τοῦ Χριστοῦ, ὃς κατὰ πρόσωπον μὲν ταπεινὸς ἐν ὑμῖν, ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/001.yaml
  text: I myself[a], Paul, appeal to you by the meekness and gentleness of Messiah—I who am humble face to face among you[c][b], but bold toward you when absent.
translation:
  language: ja
  text: この私、パウロ自身が、メシアの柔和と寛容によって、あなたがたにお願いします――あなたがたの前ではへりくだっているが、不在の時にはあなたがたに対して大胆である、この私が。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς δὲ ἐγὼ Παῦλος
  choice: この私パウロが
  rationale: 強意の αὐτός と明示された ἐγώ、固有名 Παῦλος による自己強調を、自然な日本語で保った。δέ はここでは話題の転換を示すが、明示的な逆接語を置かなくても文脈上伝わる。
- source_word: παρακαλῶ ὑμᾶς
  choice: あなたがたにお願いします
  rationale: 命令というより、個人的で切実な訴えであることを表す。
- source_word: διὰ τῆς πραΰτητος καὶ ἐπιεικείας
  choice: 柔和と寛容にかけて
  rationale: διά＋属格が訴えの根拠・媒介を示すことを日本語の慣用表現で示した。πραΰτης は力を抑えた柔和さ、ἐπιείκεια は相手を思いやって譲る寛容さを表す。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστός が称号として機能しているため、その意味を表す「メシア」とした。
- source_word: κατὰ πρόσωπον
  choice: 面と向かっている時には
  rationale: 直訳的な「顔に従って」ではなく、ここでの在席と不在の対比を保つ自然な表現とした。
- source_word: ταπεινὸς
  choice: 「腰が低い」
  rationale: 謙遜・低さを表しつつ、パウロへの評言を皮肉に取り上げている可能性も残す。「臆病」とすると解釈を限定しすぎる。
- source_word: ἀπὼν δὲ θαρρῶ εἰς ὑμᾶς
  choice: 離れている時には、あなたがたに対して大胆だ
  rationale: 在席時との対比、および態度の向かう先を保った。「敵対的だ」とまでは限定しない。
theological_decisions:
- issue: Χριστοῦ の訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名というより称号として用いられているため、称号の意味を訳出した。
- issue: パウロの自己描写の語調
  choice: 引用符と「と言われている」を用いて、他者の評言を受けた表現である可能性を示す
  alternative: 引用を示さず「腰が低いが、大胆な」と訳す
  rationale: 文脈上は反対者の評価を皮肉に反復している可能性が高い一方、ギリシア語に明示的な引用標識はない。そのため本文では読みやすく示しつつ、脚注で曖昧さを明記した。
translation_notes:
  register: 現代の一般読者に自然でありながら、使徒的な訴えにふさわしい品位を保った。「この私」を反復して原文の強い自己強調と修辞性を再現し、「柔和」と「寛容」で近接する二語の差を保った。
