  to: この私、パウロ自身が、メシアの柔和と寛容によって、あなたがたにお願いします――あなたがたの前ではへりくだっているが、不在の時にはあなたがたに対して大胆である、この私が。
  rationale: 原文の強い自己強調（Αὐτὸς…ἐγὼ Παῦλος）と相対節による修辞的再提示を、「この私、パウロ自身」とダッシュ後の「この私が」で保った。第三者による評価であることを本文で断定する要素を除き、その可能性は脚注に限定した。「あなたがたの前では／不在の時には」により、κατὰ πρόσωπονとἀπώνの対比を自然な日本語で表した。
