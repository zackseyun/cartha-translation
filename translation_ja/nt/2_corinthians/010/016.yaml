  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τὰ ὑπερέκεινα ὑμῶν εὐαγγελίσασθαι, οὐκ ἐν ἀλλοτρίῳ κανόνι εἰς τὰ ἕτοιμα καυχήσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/016.yaml
  text: to proclaim the good news in the regions beyond you[c][b][a], not to boast in another's sphere about things already prepared.
translation:
  language: ja
  text: あなたがたのさらに向こうの地域で福音を告げ、他の人の活動範囲で、すでに用意されている事柄について誇らないためです[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのさらに先の地方で、福音を告げるためです」。
    reason: lexical_alternative
  - marker: b
    text: 「活動範囲」に当たるギリシア語は、ここでは割り当てられた働きの領域を意味し、道徳的な「規則」や後代の「正典」を意味しません。
    reason: cultural_note
  - marker: c
    text: 「すでに用意されている事柄」は、「すでに出来上がっている事柄」とも訳せます。文脈上、他の人がすでに進めた、または成し遂げた働きを指す可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπερέκεινα ὑμῶν
  choice: あなたがたの所を越えた地域
  rationale: ὑπερέκεινα は、ある地点の向こう側にある場所を指す。属格 ὑμῶν との関係を保ちつつ、コリントの人々がいる所より先の地域という地理的意味が自然に伝わる表現とした。
- source_word: εὐαγγελίσασθαι
  choice: 福音を告げる
  rationale: 宣教の行為を表す不定詞。現代日本語で明瞭であり、同時に新約聖書における「福音」との語彙的なつながりを保つ。
- source_word: ἐν ἀλλοτρίῳ κανόνι
  choice: 他の人の活動範囲で
  rationale: ἀλλότριος は「他の人に属する」、κανών はこの文脈では割り当てられた働きの範囲を指す。「活動範囲」は、道徳的な規則や後代の「正典」という意味との混同を避けながら比喩を自然に伝える。
- source_word: εἰς τὰ ἕτοιμα
  choice: すでに整えられていることについて
  rationale: ἕτοιμα は中性複数の名詞的用法で、「用意のできているもの／こと」を表す。文脈上は他者によって進められた働きを含意しうるが、本文に明示されない「働き」や「他者によって」を訳文へ直接補わず、曖昧さを残した。
- source_word: καυχήσασθαι
  choice: 誇る
  rationale: 周辺箇所で繰り返されるパウロの「誇る」という語とのつながりを保ち、修辞的な強さを弱めない。
theological_decisions:
- issue: κανών が指すもの
  choice: 他の人に割り当てられた宣教活動の範囲
  alternative: 規則、基準、正典
  rationale: 10章13－15節では、測られた限界や働きの領域が論じられているため、ここでは規範や聖書正典ではなく、使徒的働きの範囲を指すと判断した。
- issue: τὰ ἕτοιμα の指示内容
  choice: すでに整えられていること
  alternative: 他の人がすでに成し遂げた宣教の働き
  rationale: 文脈上、他者がすでに準備または達成した宣教の成果を指す可能性が高い。しかしギリシア語は「働き」や行為者を明示していないため、本文では一般性を保ち、文脈的解釈を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、文末は聖書本文にふさわしい落ち着いた丁寧体とした。「あなたがたの所を越えた地域」は地理的関係を自然に示し、「活動範囲」は専門的・教派的な用語を避けた表現である。
