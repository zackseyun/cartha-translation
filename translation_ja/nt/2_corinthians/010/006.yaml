  text: καὶ ἐν ἑτοίμῳ ἔχοντες ἐκδικῆσαι πᾶσαν παρακοήν, ὅταν πληρωθῇ ὑμῶν ἡ ὑπακοή.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/006.yaml
  text: and being ready to punish every act of disobedience[b][a], when your obedience is complete.
translation:
  language: ja
  text: また、あなたがたの従順が十分に果たされる[b]時には、あらゆる不従順を罰する[a]用意ができています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罰する」は、「正当な報いを与える」または「報復する」とも訳せる。ここでは、不従順に対する規律上の処置を指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 「十分に果たされる」は、「満たされる」または「完成する」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἑτοίμῳ ἔχοντες
  choice: 用意もできています
  rationale: 「用意ができている、備えている」という慣用表現。前節から続く分詞を日本語として自然な述語にし、καίを「も」で受けた。
- source_word: ἐκδικῆσαι
  choice: 罰する
  rationale: この文脈では、個人的な復讐よりも、使徒的権威によって不従順に処置を下す意味が適切。ただし「正当な報いを与える」という語義も脚注に残した。
- source_word: πᾶσαν παρακοήν
  choice: あらゆる不従順
  rationale: πᾶσανの包括性を「あらゆる」で、παρακοήの抽象名詞としての性質を「不従順」で保った。個々の行為に限定しすぎない。
- source_word: ὅταν πληρωθῇ
  choice: 十分なものとなった時には
  rationale: ὅτανと接続法が示す将来の条件を伴う時点を「時には」で表し、受動形πληρωθῇの「満たされる、十分に達する」という含みを自然な日本語にした。
- source_word: ὑμῶν ἡ ὑπακοή
  choice: あなたがたの従順
  rationale: 所有関係を明確に保ち、コリントの信徒たちの従順を指す表現として直訳的かつ自然にした。
theological_decisions:
- issue: パウロが不従順に対して取ろうとしている措置の性質
  choice: 不従順を罰する
  alternative: 不従順に報復する／不従順のために正義を執行する
  rationale: 直近の文脈は使徒的権威と反抗への対処であり、私的復讐と断定せず、共同体内の規律的措置を含みうる「罰する」とした。ギリシア語が持つ正義の執行・報復の含みは脚注で保持した。
- issue: 従順がπληρωθῇとなる意味
  choice: 従順が十分なものとなる
  alternative: 従順が完成する／満たされる
  rationale: 従順が完全無欠になるという教義的含意を避けつつ、従順が必要な程度まで満ちるという原文の比喩を伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「用意もできています」により前文との連続性を示した。原文の語順を過度に模倣せず、条件節を先に置いて読みやすくした。脚注標識は対応する語句を含む文末に配置した。
