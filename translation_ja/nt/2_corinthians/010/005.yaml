- from: また、神についての知識に逆らってそびえ立つ、あらゆる高いもの[a]を打ち倒し、あらゆる思いを捕らえて、メシア[b]に従わせます。
  to: また、神についての知識に逆らって高く掲げられているあらゆるもの[a]を打ち倒し、あらゆる思いを捕らえて、メシア[b]への従順へと導きます。
  rationale: 10:4から続く統語を日本語で明示する「打ち倒し」は維持した。そのうえで、ἐπαιρόμενονの高くされた像を「高く掲げられている」により明確にし、二つの注を原語および語義に即して修正した。
