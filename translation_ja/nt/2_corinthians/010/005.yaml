    rationale: SBLGNT本文はΧριστοῦであって、ギリシア語の語形自体は「メシア」ではない。「メシア」は称号の意味を日本語化した訳語であるため、注は原語Χριστόςとその語義を正確に示す必要がある。
  - severity: low
    issue: 「そびえ立つ」はἐπαιρόμενονの受動的／状態的な語感をやや弱める。
    rationale: 文脈上は自然な表現だが、「高く掲げられている」は「高くされたもの」という像を保ち、自らを高くするという再帰的解釈も避けられる。
  - severity: low
    issue: 注aの「高くされたもの」は本文の句全体との関係が不明瞭である。
    rationale: 代替としては「高いもの」および文脈的な「思い上がり」を簡潔に示す方が、ὕψωμαの語義選択を明確にする。
  revised_text: また、神についての知識に逆らって高く掲げられているあらゆるもの[a]を打ち倒し、あらゆる思いを捕らえて、メシア[b]への従順へと導きます。
