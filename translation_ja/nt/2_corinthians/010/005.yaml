id: 2CO.10.5
reference: 2 Corinthians 10:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πᾶν ὕψωμα ἐπαιρόμενον κατὰ τῆς γνώσεως τοῦ θεοῦ, καὶ αἰχμαλωτίζοντες πᾶν νόημα εἰς τὴν ὑπακοὴν τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/005.yaml
  text: and every lofty thing raised up against the knowledge of God[a], and taking every thought captive into obedience to Messiah[b],
translation:
  language: ja
  text: また、神についての知識に逆らって高く掲げられているあらゆるもの[a]を打ち倒し、あらゆる思いを捕らえて、メシア[b]への従順へと導きます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「高いもの」または「思い上がり」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語はΧριστός（「油を注がれた者」）。伝統的には「キリスト」。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν ὕψωμα
  choice: あらゆる高いもの
  rationale: ὕψωμαの「高くされたもの、そびえ立つもの」という比喩を保ちつつ、それを単に「高慢」や「思い上がり」と限定しない。πᾶνは「あらゆる」で表した。
- source_word: ἐπαιρόμενον
  choice: そびえ立つ
  rationale: 持ち上げられ、高く立つという像を自然な日本語で示す。「自らを高くする」として再帰的意味を確定することは避けた。
- source_word: κατὰ τῆς γνώσεως τοῦ θεοῦ
  choice: 神についての知識に逆らって
  rationale: γνῶσιςを「知識」とし、τοῦ θεοῦは神についての、また神との関わりにある知識という幅を残す。「神を知ること」も可能だが、抽象名詞の形を保った。
- source_word: αἰχμαλωτίζοντες
  choice: 捕らえて
  rationale: 捕虜にするという軍事的比喩を簡潔に保つ。
- source_word: πᾶν νόημα
  choice: あらゆる思い
  rationale: νόημαは思考、意図、心の働きを表し得るが、ここでは幅のある自然な表現として「思い」を選んだ。
- source_word: εἰς τὴν ὑπακοὴν
  choice: 従わせます
  rationale: εἰςが示す、従順という結果へ導く方向性を日本語の使役表現で自然に示した。
- source_word: τοῦ Χριστοῦ
  choice: メシアに
  rationale: Χριστόςを称号として訳し、その意味を明示した。属格はὑπακοήとの関係から、従順の向かう相手として「メシアに」とした。
theological_decisions:
- issue: πᾶν ὕψωμα ἐπαιρόμενονが指す対抗物の性質
  choice: 神についての知識に逆らってそびえ立つ、あらゆる高いもの
  alternative: 神についての知識に逆らって自らを高くする、あらゆる思い上がり
  rationale: 原文の高所・高くされたものという広い比喩を保ち、対象を傲慢な主張だけに限定しない。
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスの称号として機能しているため、称号の意味を訳出した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある文体。「そびえ立つ」「捕らえる」により原文の攻城・捕虜の比喩を保った。提示されたギリシア語断片の冒頭は前の句に統語的に続くため、日本語では節全体として自然に読めるよう、直前の支配動詞に相当する「打ち倒し」を補って訳した。
