  timestamp: '2026-07-17T20:18:48Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は全体として原文の論理をよく追っているが、「強く出ずに済むようにしてください」は、パウロが受信者に何かをするよう求めているかのように響く。δέομαιの願いの内容は、パウロ自身が到着時に強硬な対応を取らずに済むことである。
  naturalness: 「私がそちらにいるとき」は自然だが、文末の「～してください」は主語・行為者の関係を不自然にする。また「思い切って出よう」「強く出る」の反復は口語的で意味の分担がやや見えにくい。
  terminology: 「肉に従って歩んでいる」はκατὰ σάρκαおよびπεριπατεῖνの比喩と語の幅を保っており適切である。脚注の「人間的な基準に従って生きている」も許容される説明的代案である。
  issues:
  - severity: medium
    issue: 「強く出ずに済むようにしてください」
    rationale: 原文のδέομαιは、パウロが自分について「大胆／強硬に振る舞わずに済むこと」を願う表現であり、受信者への直接の依頼命令として訳すべきではない。
  - severity: low
    issue: 「思い切って出よう」と「強く出ずに済む」の語調と反復
    rationale: 二つの原語（τολμῆσαιとθαρρῆσαι）の関連は保ちつつ、前者を相手への断固たる対処、後者を強硬な態度として訳し分けると、現代日本語として明瞭になる。
