revisions:
- from: しかし、お願いします。私がそちらにいるとき、私たちを肉に従って歩んでいる者と見なす一部の人々に対して、思い切って出ようと考えているその確信をもって、強く出ずに済むようにしてください[a]。
  to: しかし、お願いします。私がそちらにいるときには、私たちが肉に従って歩んでいると見なす一部の人々に対して、あえて対処しようと考えているその確信をもって、強硬な態度を取らずに済むことを願っています[a]。
  rationale: 願いの内容を「～ことを願っています」として明示し、パウロ自身が強硬な対応をせずに済むことを願うという統語関係を回復した。「肉に従って歩む」は本文に維持し、τολμῆσαιとθαρρῆσαιは「あえて対処する」と「強硬な態度を取る」に訳し分けた。
