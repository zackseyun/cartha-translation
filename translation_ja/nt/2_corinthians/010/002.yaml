  text: δέομαι δὲ τὸ μὴ παρὼν θαρρῆσαι τῇ πεποιθήσει ᾗ λογίζομαι τολμῆσαι ἐπί τινας τοὺς λογιζομένους ἡμᾶς ὡς κατὰ σάρκα περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/002.yaml
  text: But I beg that when I am present I may not have to be bold with the confidence by which I consider daring to confront some who regard us as walking according to the flesh[a].
translation:
  language: ja
  text: しかし、お願いします。私がそちらにいるときには、私たちが肉に従って歩んでいると見なす一部の人々に対して、あえて対処しようと考えているその確信をもって、強硬な態度を取らずに済むことを願っています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人間的な基準に従って生きている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέομαι
  choice: お願いします
  rationale: 単なる依頼より切実な願いを表しつつ、現代日本語として自然で品位ある表現とした。
- source_word: τὸ μὴ παρὼν θαρρῆσαι
  choice: 私がそちらにいるとき、強く出ずに済むようにしてください
  rationale: μήを伴う冠詞付き不定詞を願いの内容として訳し、望ましくない強硬な対応をせずに済むことを求める含意を自然な日本語で示した。
- source_word: τῇ πεποιθήσει
  choice: その確信をもって
  rationale: 与格の手段・随伴的な働きを保ち、πεποίθησιςを「確信」とした。
- source_word: ᾗ λογίζομαι τολμῆσαι ἐπί τινας
  choice: 一部の人々に対して、思い切って出ようと考えているその
  rationale: λογίζομαιの熟慮・意図と、τολμάωおよびἐπί＋対格が示す相手に向けた断固たる行動を、過度に具体化せず表した。
- source_word: τοὺς λογιζομένους ἡμᾶς
  choice: 私たちを…者と見なす
  rationale: 相手側の評価的判断を表す分詞を「見なす」で訳した。
- source_word: κατὰ σάρκα
  choice: 肉に従って
  rationale: パウロ書簡で重要かつ多義的なσάρξを解釈的に限定せず、「肉」として保持した。
- source_word: περιπατοῦντας
  choice: 歩んでいる
  rationale: 生活態度を表す比喩を、日本語でも理解可能な「歩む」として保持した。
theological_decisions:
- issue: κατὰ σάρκαにおけるσάρξの訳語
  choice: 肉に従って
  alternative: 人間的な基準に従って生きている
  rationale: ここでは単に罪深い性質だけでなく、人間的・世俗的なあり方を含み得るため、本文ではパウロの語の幅と神学的緊張を保ち、説明的な読みを脚注に置いた。
translation_notes:
  register: 明瞭な現代標準日本語。パウロの切実な訴えと、必要なら断固として対処するという緊張を保った。「肉」「歩む」は原文の神学的語彙と比喩を尊重して本文に残し、より説明的な表現を脚注に示した。
