source:
  edition: SBLGNT
  text: οὐ γὰρ ὁ ἑαυτὸν ⸀συνιστάνων, ἐκεῖνός ἐστιν δόκιμος, ἀλλὰ ὃν ὁ κύριος συνίστησιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/018.yaml
  text: For it is not the one who commends himself who is approved[a], but the one whom the Lord commends.
translation:
  language: ja
  text: というのも、自分自身を推薦する者が認められるのではなく、主が推薦する者こそ認められるからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「推薦する」は「推奨する」または「適任者として示す」とも訳せます。原文では、前半の「自分自身を推薦する」と後半の「主が推薦する」に同じギリシア語動詞が使われています。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνιστάνων / συνίστησιν
  choice: 推薦する
  rationale: 文脈は使徒としての資格や評価をめぐるものであり、「推薦する」は自分を適任者として示す意味を自然に表す。同じギリシア語動詞の反復を、日本語でも同じ語で保持した。
- source_word: δόκιμος
  choice: 認められる
  rationale: 試験や評価を経て是認される者を指す。ここでは自己推薦と主による推薦の対比が中心なので、自然な受け身表現「認められる」とした。
- source_word: κύριος
  choice: 主
  rationale: 称号をそのまま訳し、本文だけでは明示されていない指示対象を「主イエス」または「神」と限定しない。
- source_word: ἑαυτὸν
  choice: 自分で自分を
  rationale: 再帰的な意味を明確にし、自己推薦という対比を現代日本語で自然に表した。
- source_word: ὃν
  choice: 者こそ
  rationale: 前半との対照を明瞭にし、ἀλλάの強い転換を自然な日本語で示す。
- source_word: γὰρ
  choice: （文末の）のです
  rationale: 前節までの議論を説明する接続機能を、日本語では説明調の文末によって自然に示した。
theological_decisions:
- issue: 「主」（ὁ κύριος）の指示対象
  choice: 本文では「主」とのみ訳す。
  alternative: 「主イエス」または「神」と特定する。
  rationale: パウロ書簡ではイエスを指す可能性が高いが、この節自体はκύριοςとのみ記すため、その曖昧さを保持した。
- issue: 人が認められる根拠
  choice: 自己推薦ではなく、主の推薦によるという対比をそのまま保持する。
  alternative: 主の推薦を、召命・最終的裁き・働きの成果など特定の神学概念に言い換える。
  rationale: 本文は推薦と承認の関係を述べるが、その具体的な時点や仕組みまでは限定していない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい簡潔で dignified な文体とした。「者こそ」で対比を際立たせ、同一動詞の反復を保持した。
