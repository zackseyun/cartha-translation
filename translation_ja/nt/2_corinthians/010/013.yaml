reference: 2 Corinthians 10:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ⸀οὐκ εἰς τὰ ἄμετρα καυχησόμεθα, ἀλλὰ κατὰ τὸ μέτρον τοῦ κανόνος οὗ ἐμέρισεν ἡμῖν ὁ θεὸς μέτρου, ἐφικέσθαι ἄχρι καὶ ὑμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/013.yaml
  text: But we will not boast beyond measure[a], but according to the measure of the sphere that God assigned to us—a measure that reaches even to you—
translation:
  language: ja
  text: しかし私たちは、限度を越えて誇るのではなく、神が私たちに割り当てられた範囲の尺度に従って誇るのです。その尺度は、あなたがたのところにまで及んでいます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄμετρα
  choice: 限度を越えて
  rationale: εἰς τὰ ἄμετρα という表現を、適切な範囲を逸脱する意味として自然な日本語にした。尺度・限界の比喩も保っている。
- source_word: καυχησόμεθα
  choice: 誇る
  rationale: 論争的文脈で、自らの働きや実績を誇る、またはそれについて主張する意味を直接的に表す。
- source_word: κατὰ τὸ μέτρον
  choice: 尺度に従って
  rationale: κατάの規準・限度に即する意味を明確にしつつ、本文で反復されるμέτρονの計量の比喩を「尺度」で保った。
- source_word: κανόνος
  choice: 範囲
  rationale: ここでは抽象的な規則よりも、神から割り当てられた活動領域または限界を指す可能性が高い。「範囲」は後続する「あなたがたのところにまで及ぶ」という空間的表現にも自然につながる。
- source_word: οὗ ἐμέρισεν ἡμῖν ὁ θεὸς
  choice: 神が私たちに割り当ててくださった
  rationale: μερίζωの配分・割り当ての意味を表した。神を主語とする行為への敬意を、現代標準日本語として自然な補助動詞で示した。
- source_word: μέτρου
  choice: その尺度
  rationale: κανώνを説明する二度目のμέτρονを明示し、原文の反復を保ちながら日本語で前文との関係を明確にした。
- source_word: ἐφικέσθαι
  choice: 及んでいます
  rationale: 割り当てられた尺度・範囲がコリントの信徒にまで到達しているという広がりを自然に表す。
- source_word: ἄχρι καὶ ὑμῶν
  choice: あなたがたのところにまで
  rationale: ἄχριの到達範囲とκαίの強調を「まで」で表し、コリントの信徒もパウロの割り当てられた範囲に含まれることを示した。
theological_decisions:
- issue: パウロの宣教上の主張におけるκανώνの意味
  choice: コリントの信徒をも含む、神から割り当てられた働きの範囲
  alternative: パウロが誇りを測るための規則または基準
  rationale: 直近の文脈ではμέτρονの反復、神による配分、そして「あなたがたのところにまで及ぶ」という到達範囲が強調されるため、抽象的な規準だけに限定せず、割り当てられた活動範囲として訳した。ただし語が持つ「規準・尺度」の含みは脚注で保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。μέτρονの反復を「尺度」で保持しつつ、長く複雑なギリシア語文を二文に分けて理解しやすくした。節末のダッシュが次節への継続を示すことは、日本語では文脈に委ねた。
