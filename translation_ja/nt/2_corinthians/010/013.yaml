revisions:
- from: しかし私たちは、限度を越えて誇ることはせず、神が私たちに割り当ててくださった範囲[a]の尺度に従って誇ります。その尺度は、あなたがたのところにまで及んでいます。
  to: しかし私たちは、限度を越えて誇るのではなく、神が私たちに割り当てられた範囲の尺度に従って誇るのです。その尺度は、あなたがたのところにまで及んでいます。
  rationale: 原文の未来形による否定と対照を日本語でも統一し、神の割り当てとκανών・μέτρονの関係が読み取りやすくなるよう最小限に整えた。「範囲」と脚注の語義説明は維持し、κανώνを抽象的な規則だけに限定しない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:26Z'
review_pass:
  verdict: revise
  source_fidelity: 主旨と主要語の対応は概ね適切です。κανώνを神が割り当てた宣教上の範囲として理解し、「あなたがたのところにまで及ぶ」とする点も文脈に合います。ただし、原文で両方とも未来形のκαυχησόμεθαであるのに、本文は否定部を「せず」、対照部を現在形の「誇ります」としており、時制・言い回しの対照が弱くなっています。
  naturalness: 「範囲[a]の尺度」は、原文の反復を保とうとする意図はよいものの、日本語としてやや硬く結び付きが不自然です。「割り当てられた範囲の尺度」として係り受けを明確にし、対照を「誇るのではなく…誇るのです」と整えると、明瞭な現代標準日本語になります。
  terminology: 「限度を越えて」「誇る」「割り当てる」「尺度」は適切です。κανώνの空間的・比喩的用法を本文では「範囲」とし、脚注で「規準」「尺度」等の可能性を示す処理は、語義の幅を不必要に狭めず適切です。神の行為に「くださった」を用いる必要は原文上なく、叙述として中立的な「割り当てられた」がより直接的です。
  issues:
  - severity: medium
    issue: 対照される二つのκαυχησόμεθαの表現が「誇ることはせず」と「誇ります」で不統一である。
    rationale: 原文は否定部・対照部とも同じ未来形であり、日本語でも「誇るのではなく…誇るのです」と対照をそろえるほうが、構文と論旨を正確に反映する。
  - severity: low
    issue: 「範囲の尺度」の連結がやや不自然である。
    rationale: μέτρονとκανώνの重ね方は原文でも難しいが、「神が私たちに割り当てられた範囲の尺度」とすると、割り当てられたものが範囲であることと、尺度の反復の両方がより明瞭になる。
  revised_text: しかし私たちは、限度を越えて誇るのではなく、神が私たちに割り当てられた範囲の尺度に従って誇るのです。その尺度は、あなたがたのところにまで及んでいます。
  revised_footnotes:
