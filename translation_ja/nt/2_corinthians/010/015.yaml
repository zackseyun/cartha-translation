id: 2CO.10.15
reference: 2 Corinthians 10:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ εἰς τὰ ἄμετρα καυχώμενοι ἐν ἀλλοτρίοις κόποις, ἐλπίδα δὲ ἔχοντες αὐξανομένης τῆς πίστεως ὑμῶν ἐν ὑμῖν μεγαλυνθῆναι κατὰ τὸν κανόνα ἡμῶν εἰς περισσείαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/015.yaml
  text: not boasting beyond measure in the labors of others, but having hope that, as your faith is growing among you, we will be enlarged according to our sphere of ministry, unto abundance,
translation:
  language: ja
  text: 私たちは、ほかの人々の労苦について、限度を越えて誇っているのではありません。むしろ、あなたがたの信仰が成長するにつれて、私たちが、私たちの領域[a]に従って、あなたがたの間でいっそう大きくされる[b][c]ことを望んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「私たちの基準（または尺度）に従って」。ここで「領域」と訳したギリシア語κανώνは、文脈上、測って割り当てられた働きの範囲を指すと考えられます。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「私たちが大きくされる」または「高められる」。文脈上、パウロたち個人への称賛よりも、その使徒的な働きや活動範囲の拡大を指すと考えられます。「あなたがたの間で」は、「あなたがたの信仰が成長する」に結び付けることもできます。
    reason: alternative_reading
  - marker: c
    text: 「いっそう豊かに」「さらに大きく」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ εἰς τὰ ἄμετρα καυχώμενοι
  choice: 限度を越えて誇っているのではありません
  rationale: 「尺度・限界を越える」という比喩を保ちながら、現代日本語として自然にした。分詞は文脈上、パウロたちの姿勢を述べる独立した叙述として表した。
- source_word: ἐν ἀλλοτρίοις κόποις
  choice: ほかの人々の労苦を自分の手柄にして
  rationale: 直訳は「他人の労苦において」だが、ここでは他者の働きの成果を自分の誇りとする意味であるため、その関係を明確にした。
- source_word: ἐλπίδα δὲ ἔχοντες
  choice: むしろ……ことを望んでいます
  rationale: 名詞構文「希望を持つ」を、日本語で自然な動詞表現にした。δέの対照は「むしろ」で示した。
- source_word: αὐξανομένης τῆς πίστεως ὑμῶν
  choice: あなたがたの信仰が成長するにつれて
  rationale: 属格独立構文の進行的・随伴的な意味を「につれて」で表し、πίστιςは文脈に即して「信仰」とした。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: コリント共同体の中でパウロたちの働きが拡大するという読みを自然に表す。語順上の結び付きには一定の曖昧さがあるため、注で補足した。
- source_word: μεγαλυνθῆναι
  choice: 私たちの働きが……大きく広がり
  rationale: 字義的には「私たちが大きくされる／高められる」だが、周辺文脈は使徒的働きの領域の拡大を扱う。「働き」を補って、個人的称賛ではなく務めの拡大という文脈上の意味を明確にした。
- source_word: κατὰ τὸν κανόνα ἡμῶν
  choice: 私たちに与えられた領域に沿って
  rationale: κανώνはここでは後代の「正典」ではなく、測られた範囲・活動領域を指す。直前の文脈で神が割り当てた範囲が語られるため「与えられた」とした。
- source_word: εἰς περισσείαν
  choice: さらに豊かになる
  rationale: εἰςの方向性とπερισσείαの増大・豊かさを保ちつつ、日本語として理解しやすく表現した。
theological_decisions:
- issue: μεγαλυνθῆναιが指す拡大の内容
  choice: パウロたち自身の栄誉ではなく、使徒的な働きが拡大すること
  alternative: パウロたちがコリントの人々からさらに高く評価されること
  rationale: 10章13～16節では、神から割り当てられた活動領域と、他者の労苦を誇らないことが中心となっている。ただし動詞自体は「大きくされる／高められる」とも訳せるため、その可能性を脚注に残した。
- issue: ἐν ὑμῖνの係り先
  choice: μεγαλυνθῆναιに結び付け、「あなたがたの間で」働きが広がると理解する
  alternative: αὐξανομένης τῆς πίστεως ὑμῶνに結び付け、「あなたがたのうちで信仰が成長する」と理解する
  rationale: 語順ではμεγαλυνθῆναιとの結び付きが自然であり、使徒的活動領域の拡大という流れにも合う。一方、意味上は信仰の成長に結び付けることも可能なので、脚注で曖昧さを示した。
- issue: κανώνの意味
  choice: 神から割り当てられた働きの領域
  alternative: 基準、規則、尺度
  rationale: 直前の13～14節にある「神が割り当てた尺度の範囲」との連続性から、活動領域を指すと判断した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの論証にふさわしい dignified な調子を保った。「自分の手柄にして」は他者の労苦を誇るという含意を自然に伝える表現である。原文の測定・領域・拡大という連続した比喩は、「限度」「領域」「広がる」によって保持した。
