lexical_decisions:
- source_word: Ὁ ... καυχώμενος
  choice: 誇る者
  rationale: 定冠詞を伴う現在分詞の名詞的用法を、一般的な人物を表す自然で簡潔な日本語にした。
- source_word: δὲ
  choice: しかし
  rationale: 直前までの不適切な誇り方との穏やかな対比を示す。
- source_word: καυχώμενος / καυχάσθω
  choice: 誇る者／誇りなさい
  rationale: 同じ動詞の反復を保ちつつ、命令法の勧告的な力を明瞭に表した。
- source_word: ἐν
  choice: にあって
  rationale: 誇りの拠り所・領域を示す表現として、原文の幅を保ち、エレミヤ書への反響とも対応する。
- source_word: κυρίῳ
  choice: 主
  rationale: 指示対象を「神」または「主イエス」と限定せず、原文の神学的な含みを保った。
theological_decisions:
- issue: 引用・暗示の文脈における「主」の指示対象
  choice: 主
  alternative: 主イエス／神
  rationale: 原文は単に κυρίῳ とし、エレミヤ書への暗示とパウロ書簡における用法が重なり得るため、解釈的に限定しなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、命令の力と「誇る」の反復を保った。「主にあって」は日常語よりやや聖書的だが、ἐν の関係性と神学的な含みを過度に限定せず伝える表現として採用した。
