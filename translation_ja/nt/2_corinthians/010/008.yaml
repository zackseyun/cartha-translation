source:
  edition: SBLGNT
  text: ἐάν ⸀τε ⸀γὰρ περισσότερόν τι καυχήσωμαι περὶ τῆς ἐξουσίας ἡμῶν, ἧς ἔδωκεν ὁ ⸀κύριος εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν ὑμῶν, οὐκ αἰσχυνθήσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/008.yaml
  text: For even if I should boast somewhat more about our authority[a], which the Lord gave for building you up and not for tearing you down[b], I will not be put to shame.
translation:
  language: ja
  text: 実際、たとえ私たちの権威について、さらにいくらか誇ったとしても、私は恥をかかされることはありません[b]。この権威は、あなたがたを築き上げるためであって、打ち壊すためではなく[a]、主が与えてくださったものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたを滅ぼすためではなく」。ギリシア語は「築き上げる」と「打ち壊す／破壊する」を対照させています。本文では建築の比喩を保ちました。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私は恥じることはありません」。ギリシア語の動詞はどちらにも訳せますが、本文では受動形をより明確に表しました。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: 実際、たとえ～としても
  rationale: γάρの説明・根拠を示す働きを「実際」で表し、ἐάνと接続法による仮定、およびτεの添える意味を、自然な日本語の「たとえ～としても」で表した。
- source_word: περισσότερόν τι
  choice: さらにいくらか
  rationale: 比較の度合いを示すπερισσότερόνと、断定を和らげる不定代名詞τιの双方を保つ。
- source_word: καυχήσωμαι
  choice: 誇ったとしても
  rationale: アオリスト中動態接続法の仮定的な調子を、現代日本語の条件表現で自然に示す。
- source_word: περὶ τῆς ἐξουσίας ἡμῶν
  choice: 私たちの権威について
  rationale: ἐξουσίαを抽象的な能力ではなく、委ねられた権限という意味を保つ「権威」とした。複数形の所有表現もそのまま示した。
- source_word: ἧς ἔδωκεν ὁ κύριος
  choice: この権威は…主が与えてくださったものです
  rationale: 関係代名詞ἧςの先行詞が「権威」であることを日本語で明確にし、κύριοςは称号として「主」とした。「くださった」は主から与えられた恵み深い委託を自然な敬語で表す。
- source_word: εἰς οἰκοδομὴν
  choice: あなたがたを築き上げるため
  rationale: 建築の比喩を保ちつつ、文脈上の対象であるコリントの信徒たちを明示した。
- source_word: καὶ οὐκ εἰς καθαίρεσιν ὑμῶν
  choice: あなたがたを…打ち壊すためではなく
  rationale: οἰκοδομήとの対照を保つため、建築・解体の比喩が伝わる「打ち壊す」を選んだ。語順は日本語として自然になるよう肯定目的を先に置いた。
- source_word: οὐκ αἰσχυνθήσομαι
  choice: 私は恥をかかされることはありません
  rationale: 未来受動形を反映し、単に内面的に恥じるのではなく、誇りが空しいものと露呈して面目を失わされることはない、という受動的な含みを保った。
theological_decisions:
- issue: 使徒的権威の由来と目的
  choice: 権威は主から与えられ、コリントの信徒たちを築き上げることを目的とする。
  alternative: 権威は信徒たちを破滅させるような懲罰のために与えられた。
  rationale: 本文はοἰκοδομήとκαθαίρεσιςを明確に対比し、権威の根本目的を建設的なものとしている。厳しい行使の可能性を否定せず、破壊そのものが目的だとは訳さない。
- issue: 「恥」の受動的・内面的理解
  choice: 「恥をかかされる」として受動形を表面に出す。
  alternative: 「恥じることはない」として内面的な感情を前面に出す。
  rationale: αἰσχυνθήσομαιは形態上受動であり、パウロの誇りが根拠のないものと判明して面目を失うことはない、という意味を保てる。ただし内面的な羞恥の意味も語義上可能なため脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的権威についての厳粛さを保った。「築き上げる／打ち壊す」という対句を維持し、文が過度に長くならないよう二文に分けた。
