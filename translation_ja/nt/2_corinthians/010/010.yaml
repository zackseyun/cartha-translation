  text: ὅτι Αἱ ⸂ἐπιστολαὶ μέν⸃, φησίν, βαρεῖαι καὶ ἰσχυραί, ἡ δὲ παρουσία τοῦ σώματος ἀσθενὴς καὶ ὁ λόγος ἐξουθενημένος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/010/010.yaml
  text: For they say[a], “His letters are weighty and strong, but his bodily presence is weak[b], and his speech is despised.”
translation:
  language: ja
  text: というのも、彼らはこう言うからです。[a]「彼の手紙は重々しく力強いが、本人がそこにいるときは弱く、話し方は軽んじられている。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼は言う」。ギリシア語は単数形ですが、ここではパウロを批判する人々の意見を代表的に引用する言い方と理解できます。
    reason: lexical_alternative
  - marker: b
    text: 「話し方は見下されている」、または「取るに足りないとされている」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からです
  rationale: 前節の主張の理由または内容を導入する接続詞として、文脈上自然な日本語にした。
- source_word: ἐπιστολαὶ
  choice: 手紙
  rationale: 通常の書簡を指す語であり、教会用語的な「書簡」より一般読者に明瞭である。
- source_word: μέν ... δὲ
  choice: ……が
  rationale: 二項の対照を、日本語で過度に直訳的にならない形で表した。
- source_word: φησίν
  choice: 彼らはこう言う
  rationale: 語形は単数だが、ここでは批判者たちの見解を引用する挿入的な表現として理解できる。単数の可能性は脚注に残した。
- source_word: βαρεῖαι
  choice: 重々しい
  rationale: 重さの比喩を保ちつつ、手紙の厳粛さや迫力を表す自然な日本語である。
- source_word: ἰσχυραί
  choice: 力強い
  rationale: 手紙の強い効力や迫力を直接的に表し、「重々しい」と自然に並ぶ。
- source_word: παρουσία τοῦ σώματος
  choice: 実際に会うと、その姿
  rationale: 字義は「身体の現前」だが、手紙との対照から、本人がその場にいる時の外見・印象を指すことが分かる自然な表現とした。
- source_word: ἀσθενὴς
  choice: 弱々しい
  rationale: 批判者が本人の姿に下した評価を表し、その弱さの具体的内容を訳文で限定しない。
- source_word: λόγος
  choice: 話すこと
  rationale: 手紙と対比される口頭での話しぶりを指すため、現代日本語で明瞭な表現を選んだ。
- source_word: ἐξουθενημένος
  choice: 軽んじられている
  rationale: 無価値と見なされ、侮られているという受動的な評価を保つ。「取るに足りない」など、内在的価値の断定に聞こえる表現を避けた。
theological_decisions:
- issue: パウロへの批判を語り手自身の評価として読ませないこと
  choice: 批判者たちの発言として「彼らはこう言う」と明示した。
  alternative: 「彼は言う」または「こう言われている」
  rationale: 文脈ではパウロに対する批判が引用されている。批判内容を本文の権威ある評価として提示せず、同時にギリシア語の単数形は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用された批判の鋭さを保ちながらも、古風すぎる表現や教派的な解釈を避けた。「実際に会うと、その姿」は παρουσία τοῦ σώματος の字義を日本語として自然に伝える意訳である。
