  text: むち打ち、投獄、騒乱、労苦、眠れない夜、食を断つことにおいて、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληγαῖς
  choice: むち打たれ
  rationale: 複数形で、身体に加えられる打撃や殴打を指す。迫害の文脈に即して、自然で具体的な日本語とした。
- source_word: φυλακαῖς
  choice: 投獄され
  rationale: 「監禁・獄」を表し、パウロが投獄を経験したという意味を簡潔に伝える。
- source_word: ἀκαταστασίαις
  choice: 騒乱に巻き込まれ
  rationale: 無秩序、混乱、騒動を表す語。ここでは外的な暴動・騒乱を指す可能性が高いが、語義を「暴動」だけに狭めすぎない表現とした。
- source_word: κόποις
  choice: 苦労を重ね
  rationale: 骨の折れる労苦や疲労を伴う働きを表すため、「労働」より広い「苦労」を選んだ。
- source_word: ἀγρυπνίαις
  choice: 眠らず
  rationale: 徹夜、不眠、眠れない夜を指す。自発的な徹夜か状況による不眠かを断定しない。
- source_word: νηστείαις
  choice: 食を断つこと
  rationale: 断食または食物を得られない状態の双方があり得る語。原文の複数形を反復・複数の経験として自然に表した。
theological_decisions:
- issue: νηστείαιςが宗教的な断食か、欠乏による飢えか
  choice: 食を断つこと
  alternative: 断食／飢え
  rationale: 宗教的実践と窮乏のどちらかに限定せず、文脈上の緊張を保持するため。
- issue: 列挙を苦難だけとして表すか、奉仕者としての忍耐の現れとして表すか
  choice: 各句を「〜によって」という前後の統語関係の中に置く
  alternative: 独立した苦難の一覧として訳す
  rationale: 6:4以下のἐνの連続は、神の奉仕者として自らを示す状況・手段を列挙している。節単独でもその統語的つながりを残した。
translation_notes:
  register: 現代標準日本語で、簡潔な列挙のリズムを保った。「むち打ち、投獄、騒乱…」という名詞列よりも、経験として自然に読める動詞形を用いた。節末は原文が文の途中であるため読点で閉じた。
