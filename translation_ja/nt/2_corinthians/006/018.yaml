id: 2CO.6.18
reference: 2 Corinthians 6:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔσομαι ὑμῖν εἰς πατέρα, καὶ ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας, λέγει κύριος παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/018.yaml
  text: And I will be a Father to you[a], and you will be sons and daughters to me, says the Lord Almighty.
translation:
  language: ja
  text: 「わたしはあなたがたの父となり、あなたがたはわたしの息子、娘となる」と、全能の主は言われる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσομαι ὑμῖν εἰς πατέρα
  choice: わたしはあなたがたの父となり
  rationale: 「～にとって父となる」という契約関係を表すギリシア語の慣用表現を、自然な現代日本語で表した。「となり」は未来の関係提示を明確にする。
- source_word: ὑμεῖς ἔσεσθέ μοι εἰς υἱοὺς καὶ θυγατέρας
  choice: あなたがたはわたしの息子、娘となる
  rationale: 前半との相互的な関係を保ち、υἱούς と θυγατέραςが男女を明示していることもそのまま伝える。「わたしの」は日本語で帰属と関係を自然に示す。
- source_word: λέγει
  choice: 言われる
  rationale: 引用定型の現在形を、日本語の聖書的でありながら現代にも通じる敬語表現で示す。発言者が神であるため尊敬語とした。
- source_word: κύριος
  choice: 主
  rationale: 神を指す称号として、定着した簡潔な訳語「主」を採用した。
- source_word: παντοκράτωρ
  choice: 全能の
  rationale: 万物を支配する力を持つ方という称号を、簡潔で定着した日本語「全能の」で表した。
theological_decisions:
- issue: 子としての関係に男女双方を明示するか
  choice: 息子、娘
  alternative: 子どもたち
  rationale: 原文はυἱούςとθυγατέραςをそれぞれ明記しているため、包括語にまとめず、娘が明示的に含まれる点を保存した。
- issue: κύριος παντοκράτωρの神的称号
  choice: 全能の主
  alternative: 主、全能者
  rationale: 原文の二語を過不足なく表し、日本語として自然な称号の語順にした。「万軍の主」など原文にない別の旧約的称号は持ち込まない。
- issue: εἶναι＋与格＋εἰς対格の契約的関係表現
  choice: 父となり／わたしの息子、娘となる
  alternative: 父であり／息子、娘である
  rationale: この慣用句が示す関係成立・関係付与の含みを「となる」で伝えつつ、養子縁組など特定の教理用語に限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の直接話法には「わたし」、複数の受け手には「あなたがた」を採用した。荘重さを保ちながら古語的な語尾は避けた。
