reference: 2 Corinthians 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν παντὶ ⸀συνιστάνοντες ἑαυτοὺς ὡς θεοῦ διάκονοι· ἐν ὑπομονῇ πολλῇ, ἐν θλίψεσιν, ἐν ἀνάγκαις, ἐν στενοχωρίαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/004.yaml
  text: 'but in everything commending ourselves as God''s servants: in great endurance[a], in afflictions, in hardships, in distresses[c][b],'
translation:
  language: ja
  text: しかし、あらゆることにおいて[a]、神に仕える者として自分たちを示しています。すなわち、大いなる忍耐をもって、苦難の中で、困難の中で、苦境の中で。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あらゆることにおいて」は、「どのような場合にも」または「どのような面でも」とも訳せる。ギリシャ語は広い表現で、あらゆる状況またはあらゆる点を指し得る。
    reason: ἐν παντίの広い適用範囲を保ち、本文で一義に限定しないため。
lexical_decisions:
- source_word: ἀλλ’
  choice: むしろ
  rationale: 直前の否定的な勧めと対照をなし、積極的なあり方へ転じる接続詞。日本語では「しかし」よりも訂正的・対照的な流れを自然に示す。
- source_word: ἐν παντί
  choice: あらゆることにおいて
  rationale: 状況と点・面の双方を含み得る広い表現として、限定せず包括性を保つ。
- source_word: συνιστάνοντες ἑαυτούς
  choice: 自分たちを示しています
  rationale: 単なる自己推薦ではなく、振る舞いを通して自分たちが何者であるかを実証する意味を、自然な現代日本語で表す。
- source_word: ὡς θεοῦ διάκονοι
  choice: 神に仕える者として
  rationale: διάκονοι の奉仕という中心義を保ち、制度的な役職名を読み込まない。
- source_word: ἐν ὑπομονῇ πολλῇ
  choice: 忍耐を尽くし
  rationale: ὑπομονή が試練の下で持ちこたえる忍耐を指すことと、πολλῇ の強意を自然な日本語で示す。
- source_word: θλίψεσιν
  choice: 苦難の中でも
  rationale: 圧迫を伴う患難・苦しみを、明瞭で品位ある一般的な語で表す。
- source_word: ἀνάγκαις
  choice: 窮乏の中でも
  rationale: 避けがたい切迫や困窮を表し、前後の類義語との違いもある程度保つ。
- source_word: στενοχωρίαις
  choice: 行き詰まる状況の中でも
  rationale: 狭い所に追い込まれ、身動きが取れないという語の比喩的な力を伝える。
theological_decisions:
- issue: 奉仕の文脈における διάκονοι の訳
  choice: 神に仕える者
  alternative: 神の奉仕者／神の務めを担う者
  rationale: 神への奉仕を表す語であり、ここで特定の教会職制を意味すると断定しない訳を採用した。
- issue: συνιστάνοντες の自己推薦と実証の含み
  choice: 自分たちを示しています
  alternative: 自分たちを推薦しています
  rationale: 文脈では苦難における忍耐を通して奉仕者としての真正さを示す含みが強いが、「示す」として自己推薦だけに意味を限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、苦難の列挙には一定の重みを保った。「行き詰まる状況」は στενοχωρία の圧迫され逃げ場のない感覚を伝える表現。主節は前節から続く分詞構文だが、単独節として読めるよう述語を補った。
