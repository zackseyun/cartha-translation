  naturalness: 全体として明快で自然な現代標準日本語である。「どんな分け前を共有できるでしょうか」も理解可能だが、「分け前」と「共有する」の結び付きはやや説明的である。「どんな分け前を分かち合うのでしょうか」は自然で、修辞疑問としても滑らかである。
  terminology: 「メシア」は原語の称号性を保ち、「調和」「信じる者／信じない者」も文脈に適切である。脚注は、ギリシャ語形Βελιάρと英語で一般的な別形Belialを区別して明示する必要がある。現行の「ギリシャ語は『ベリアル』」と「別形『ベリアル（Belial）』」は、日本語表記上同一に見え、形の違いを十分に伝えない。
