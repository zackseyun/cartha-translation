id: 2CO.6.15
reference: 2 Corinthians 6:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς δὲ συμφώνησις ⸀Χριστοῦ πρὸς Βελιάρ, ἢ τίς μερὶς πιστῷ μετὰ ἀπίστου;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/015.yaml
  text: And what harmony is there between Messiah and Beliar? Or what share does a believer have with an unbeliever?[a]
translation:
  language: ja
  text: また、メシアとベリアルとの間に、どんな調和があるでしょうか。信じる者が信じない者と、どんな分け前を分かち合うのでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ベリアル：ギリシャ語はΒελιάρ（Beliar）。英語訳では、別形のBelialが用いられることもある。
    reason: ギリシャ語本文の固有名の形と、英語で広く知られる別形を区別して示すため。
lexical_decisions:
- source_word: συμφώνησις
  choice: 調和
  rationale: 一致や協調、両立する関係を表す語であり、対照を鮮明にしつつ関係的な含みを自然な日本語で伝える。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは固有名のような用法よりも称号としての性格が強く、ベリアルとの概念的な対比を保つため「メシア」とした。
- source_word: Βελιάρ
  choice: ベリアル
  rationale: ギリシャ語本文の固有名を音写した。別形「ベリアル（Belial）」との関係は脚注で示す。
- source_word: μερίς
  choice: 分け前を共有する
  rationale: μερίς は割り当てられた部分・分け前を指す。日本語では「どんな分け前があるか」より、共同参与の含みを明確にする「どんな分け前を共有できるか」が自然である。
- source_word: πιστῷ
  choice: 信じる者
  rationale: 形容詞の名詞的用法。教会用語として固定化した「信者」より、原語の対比を直接かつ平易に示す。
- source_word: ἀπίστου
  choice: 信じない者
  rationale: πιστῷとの対照を同じ語形で明瞭に表し、「不誠実な者」という別の意味に傾くのを避ける。
- source_word: πρὸς
  choice: との間に
  rationale: συμφώνησιςが表す相互関係を、自然な日本語の「AとBとの間に」で表した。
- source_word: μετὰ
  choice: と
  rationale: 人との結びつき・共同関係を簡潔に表す。
- source_word: δὲ
  choice: また
  rationale: 連続する修辞疑問を加算的につなぐ語として、強すぎる逆接を避けた。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この箇所ではベリアルと対置される称号としての働きが前面にあるため、「メシア」を採用した。
- issue: Βελιάρの同定
  choice: 解釈を補わず固有名「ベリアル」とする
  alternative: 本文で「悪魔」などと説明する
  rationale: 本文は固有名だけを置いているため、そのまま音写し、特定の同定を本文に持ち込まない。
- issue: μερίςが示す関係
  choice: 共有する分け前
  alternative: 単なる共通点
  rationale: 割り当てや参与という原語の具体性を保ち、単に意見が一致するかという意味へ狭めない。
translation_notes:
  register: 現代標準日本語による、明快で品位ある修辞疑問として訳した。前半の「調和」と後半の「分け前を共有する」により、原文の異なる二つの比喩を保持した。
