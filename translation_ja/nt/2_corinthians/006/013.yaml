  text: τὴν δὲ αὐτὴν ἀντιμισθίαν, ὡς τέκνοις λέγω, πλατύνθητε καὶ ὑμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/013.yaml
  text: In the same return—I speak as to children—be open wide[b][a], you also.
translation:
  language: ja
  text: 同じように応えてもらいたいのです[a]――子どもたちに語りかけるように言いますが――あなたがたも心を広く開いてください[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「同じ返礼として」。「返礼」「相応の応答」とも訳せる。ここでは金銭的な意味ではなく、パウロたちが心を開いたことに対応して、同じように応じることをいう。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「広くされなさい」または「広くなりなさい」。文脈上、愛情と受容において心を広く開くことを指す。「心」は本文で補っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὴν δὲ αὐτὴν ἀντιμισθίαν
  choice: 同じ報いとして
  rationale: ἀντιμισθίαは、ここでは金銭的な支払いではなく、先に示された心の広さに対する釣り合った応答を指す。「同じ」を明示してαὐτήνを保ち、「として」により続く命令との関係を自然に示した。δέは強い逆接ではないため、独立した接続語を置かず文脈上の移行に含めた。
- source_word: ὡς τέκνοις λέγω
  choice: 子どもたちに語るように言いますが
  rationale: τέκνοιςには所有代名詞がないので「私の」は補わない。挿入句としての親愛を帯びた語りかけを、現代日本語で理解しやすく表した。
- source_word: πλατύνθητε
  choice: 心を広く開いてください
  rationale: 字義は「広くされなさい／広くなりなさい」。直前の6:11–12にある心と内面的な受容の比喩を踏まえ、日本語で意味が通るよう暗黙の「心」を補った。受動形の比喩については脚注に残した。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: パウロたちが自らを開いたのと同様に、コリントの人々にも応答を求める相互性と強調を保った。
theological_decisions:
- issue: 家族的な呼びかけに所有を補うか
  choice: 「子どもたち」とし、「私の」を加えない
  alternative: 「私の子どもたち」
  rationale: 父親的な親愛は文脈から明らかだが、ギリシア語に所有代名詞はないため、関係を必要以上に明示しない。
- issue: πλατύνθητεの暗黙の対象を明示するか
  choice: 本文では「心」を補い、比喩の字義を脚注で示す
  alternative: 「あなたがたも広くなってください」
  rationale: 直前の文脈では心の狭さと広さが問題であり、日本語で対象を示さない直訳は不自然で意味が伝わりにくい。ただし、原文には「心」が明記されていないことを脚注で明らかにする。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。パウロの親愛を帯びた挿入句と、応答を促す命令の力を保った。「心」は文脈上の含意として本文に補い、その事実と原文の受動的な比喩を脚注で示した。
