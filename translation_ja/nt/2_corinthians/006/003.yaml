id: 2CO.6.3
reference: 2 Corinthians 6:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μηδεμίαν ἐν μηδενὶ διδόντες προσκοπήν, ἵνα μὴ μωμηθῇ ἡ διακονία,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/003.yaml
  text: giving no cause for stumbling in anything[a], so that the ministry may not be blamed[b],
translation:
  language: ja
  text: 私たちは、どんなことにおいてもつまずきの原因を作らず[a]、この奉仕が非難されないようにしています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どんなことにおいても、何の妨げも与えず」。
    reason: προσκοπήは「つまずきの原因」のほか、「妨げ」「反感を招くもの」とも訳し得るため。
  - marker: b
    text: 別訳「この務めの信用が損なわれないように」。
    reason: μωμάομαιは「非難する」だけでなく、欠点を指摘して評判や信用を傷つける含みを持ち得るため。
lexical_decisions:
- source_word: μηδεμίαν ... προσκοπήν
  choice: つまずきの原因を作らず
  rationale: προσκοπήは、つまずきや反感を招くきっかけを表す。「つまずき」の比喩を保ちつつ、διδόντεςを日本語として自然な「原因を作る」で表現した。
- source_word: ἐν μηδενί
  choice: どんなことにおいても
  rationale: 行動や事情のあらゆる面に及ぶ包括的な範囲を明確に示す。
- source_word: ἵνα μὴ
  choice: …されないように
  rationale: 目的または意図された結果を表すギリシア語の力を、自然な現代日本語で保持する。
- source_word: μωμηθῇ
  choice: 非難されない
  rationale: 受動態を保ち、責められる、欠点を指摘されるという中心的意味を簡潔に表す。
- source_word: ἡ διακονία
  choice: この奉仕
  rationale: 文脈上はパウロと同労者たちの使徒的な務めを指すが、後代の制度的職制を連想させすぎないよう、διακονίαの奉仕という基本義を採った。定冠詞と文脈上の特定性は「この」で示した。
- source_word: διδόντες
  choice: 作らず…しています
  rationale: 前後の文に従属する現在分詞だが、単独節として提示された日本語では主語を補い、継続的な態度として自然に読める形にした。
theological_decisions:
- issue: διακονίαが指すもの
  choice: パウロと同労者たちに委ねられた働きを「この奉仕」と訳す
  alternative: 「この務め」
  rationale: 使徒的働きという文脈を認めつつ、後代の教会職制を読み込まず、奉仕としての語義を前面に出した。
- issue: 主語と時制的ニュアンスの補足
  choice: 「私たちは…しています」とする
  alternative: 「何事にも…与えず、…」と分詞のまま訳す
  rationale: ギリシア語本文は前後に続く分詞構文であり、単独では主語が明示されない。文脈上のパウロと同労者たちを補い、継続的実践を表したが、教理的内容は追加していない。
translation_notes:
  register: 明瞭で現代的かつ格調を保った文体。「つまずき」は聖書的比喩として理解可能なため本文に残し、曖昧になり得る語義は脚注で補った。節が分詞構文の途中にあることを踏まえ、単独でも通じるよう主語と述語を自然に補った。
