  text: ἐν λόγῳ ἀληθείας, ἐν δυνάμει θεοῦ· διὰ τῶν ὅπλων τῆς δικαιοσύνης τῶν δεξιῶν καὶ ἀριστερῶν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/007.yaml
  text: in the word of truth[a], in the power of God; through the weapons of righteousness in the right hand and in the left[c][b],
translation:
  language: ja
  text: 真理の言葉[a]により、神の力により、右手にも左手にもある[c]義[b]の武器によって、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「真実な語り」または「真理の知らせ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「正義」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「右のものと左のもの」。右手と左手で用いる武器を指し、攻撃と防御の双方への備えを暗示する可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: λόγῳ ἀληθείας
  choice: 真理のことば
  rationale: λόγοςが持つ「ことば・語る内容・メッセージ」の幅を残しつつ、ἀληθείαςとの属格構文を簡潔に反映する。「真実な語り」と限定せず、真実な宣教と真理のメッセージの双方を含み得る表現とした。
- source_word: δυνάμει θεοῦ
  choice: 神の力
  rationale: 属格を自然に保ち、直前のἐν句との並行も「〜により」の反復で示した。
- source_word: διὰ
  choice: によって
  rationale: 属格を伴うδιάの手段・媒介の意味を表す。日本語では「〜によって」が、この節の列挙調にも適する。
- source_word: ὅπλων
  choice: 武器
  rationale: 攻撃用・防御用の双方を含み得る戦いの道具を表すため、「防具」より広い「武器」とした。
- source_word: δικαιοσύνης
  choice: 義
  rationale: パウロ書簡でのδικαιοσύνηの神学的・倫理的な意味の幅を保つ簡潔な定訳。「正義」という可能性は脚注に残した。
- source_word: τῶν δεξιῶν καὶ ἀριστερῶν
  choice: 右手にも左手にも持つ
  rationale: 実詞的に用いられた「右のものと左のもの」を両手と解する自然な補充。武器が両手にあるという像を明確にしつつ、攻撃・防御の役割までは本文で限定しない。
theological_decisions:
- issue: パウロのδικαιοσύνηの訳語
  choice: 義
  alternative: 正義
  rationale: 「義」は神との正しい関係、正しい行い、神から与えられる正しさなどの含意を狭めずに保つ。「正義」も語義上可能なので脚注で示し、特定の教理的解釈に固定しない。
- issue: 右手と左手の武器の機能
  choice: 両手に武器を持つ像として訳し、機能は特定しない
  alternative: 右手を攻撃、左手を防御と解する
  rationale: 原文は右と左を対にするだけで、それぞれの武器の機能を明示しない。完全な備えを示唆し得るが、攻防への割り当ては脚注でも可能性としてのみ述べる。
translation_notes:
  register: 現代の標準的な日本語で、パウロの列挙のリズムを保つため「〜により／〜によって」を反復した。「義の武器」という凝縮された比喩は説明的に言い換えず、原文の神学的緊張と解釈の余地を残した。
