  text: ὡς λυπούμενοι ἀεὶ δὲ χαίροντες, ὡς πτωχοὶ πολλοὺς δὲ πλουτίζοντες, ὡς μηδὲν ἔχοντες καὶ πάντα κατέχοντες.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/010.yaml
  text: as sorrowful[a], yet always rejoicing; as poor, yet making many rich; as having nothing[b], and yet possessing everything.
translation:
  language: ja
  text: 悲しんでいるようで、いつも喜び、貧しいようで、多くの人を豊かにし[a]、何も持たないようで、すべてを持っている[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「多くの人を富ませる」とも訳せる。文脈上、この豊かさは物質的な富というより、霊的な豊かさを指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 外見上は何も持たないように見えても、キリストとの結びつきにおいて、より深い意味ですべてを持っているという、文脈上の理解。
    reason: cross_reference
lexical_decisions:
- source_word: ὡς
  choice: 〜者のようでありながら
  rationale: 繰り返される比較的な枠組みを保ちつつ、後続句との逆説的な対照が自然な日本語で伝わるようにした。単なる外見だけを意味すると断定せず、「〜のようで」の含みを残している。
- source_word: λυπούμενοι
  choice: 悲しんでいる
  rationale: 継続的な悲しみの状態を表し、悲しみの原因や受動・中動の別を必要以上に限定しない。
- source_word: ἀεὶ δὲ χαίροντες
  choice: いつも喜び
  rationale: ἀείの継続性とδέの対照を、前の「〜ながら」と組み合わせて簡潔に表した。χαίροντεςの能動的で持続的な喜びも保つ。
- source_word: πτωχοὶ
  choice: 貧しい
  rationale: 物質的欠乏と使徒としての低い境遇の双方を許す、直接的で過度に強めない訳語。
- source_word: πολλοὺς δὲ πλουτίζοντες
  choice: 多くの人を豊かにし
  rationale: πλουτίζωの「富ませる、豊かにする」という使役的意味を明確にしつつ、豊かさを物質的なものだけに限定しない。
- source_word: μηδὲν ἔχοντες
  choice: 何も持っていない
  rationale: 外面的な無所有を示す逆説の前半を、平明な現代日本語で表した。
- source_word: πάντα κατέχοντες
  choice: すべてのものを持っている
  rationale: κατέχωの実質的な所有・保持の意味を示し、「何も持っていない」との語義的対照を保った。「すべて」が何を指すかは本文で限定しない。
theological_decisions:
- issue: 「多くの人を豊かにする」「すべてのものを持つ」という逆説における豊かさと所有の性質
  choice: 本文では霊的な豊かさやキリストとの結びつきを明示せず、原文どおり逆説をそのまま述べる。
  alternative: 「霊的に豊かにする」「キリストにあってすべてを持つ」などと解釈を本文に織り込む。
  rationale: 文脈とパウロ書簡全体は霊的な豊かさを強く示唆するが、ギリシア語本文にはその限定語がない。したがって、神学的緊張と包括性を保ち、補足は脚注にとどめた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。三つの逆説を「〜者のようでありながら」で並行させ、原文の反復と修辞的なリズムを再現した。脚注[a]は内容に対応する「豊かにし」の直後に置いた。
