translation:
  language: ja
  text: 誉れと辱めを通して[a]、悪評と好評を通して[b]、人を惑わす者と見なされながらも、真実な者であり[c]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誉れ」は「栄光」とも訳せる。ここでは「辱め」と対照され、公の評価としての名誉を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「中傷と称賛」あるいは「悪い評判と良い評判」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳では「人を惑わす者のようであり、真実な者である」。人々から人を惑わす者と見なされることと、実際には真実であることとが対比されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: ～時も
  rationale: 属格を伴って奉仕が続けられる状況を示す。日本語では反復する「～時も」により、対句のリズムと、どのような境遇を通ってもという意味を自然に表した。
- source_word: δόξης
  choice: 誉れを受ける
  rationale: ἀτιμίαとの対比から、公の評価としての名誉を表す。「栄光」より、この文脈の社会的意味が明瞭である。
- source_word: ἀτιμίας
  choice: 辱めを受ける
  rationale: δόξαと釣り合う否定的な社会的評価を、自然で格調ある日本語で表した。
- source_word: δυσφημίας
  choice: 悪く言われる
  rationale: 非難の言葉と悪評の両方を含み得る語であり、「中傷」だけに狭めず、εὐφημίαとの対照も保つ。
- source_word: εὐφημίας
  choice: 良く言われる
  rationale: 好意的な評判または称賛を表す。対になる語と同じ構文にして原文の均衡を保った。
- source_word: ὡς
  choice: ～のように見られても
  rationale: 後続の対句が、他者からの見え方と実際の姿を対照させることを日本語で明確にした。
- source_word: πλάνοι
  choice: 人を惑わす者
  rationale: ここでは、道に迷う者ではなく、他者を誤らせる者だという非難を指す。
- source_word: ἀληθεῖς
  choice: 真実である
  rationale: πλάνοιと鋭く対照される形容詞の広がりを保つ。「誠実」「本物」の一方に限定しなかった。
theological_decisions:
- issue: 最後の対句が、他者の評価と実際の姿を対照することをどこまで明示するか
  choice: 「人を惑わす者のように見られても、真実であり」とした。
  alternative: 「人を惑わす者のようでありながら、真実であり」と、より逐語的に訳す。
  rationale: ὡςが示す外面的な見え方を明らかにしつつ、「真実」が誠実さか真正さかを一義的に限定せず、原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、対句を「～時も」で反復して朗読時のリズムを整えた。節末は次節へ続く列挙であるため読点で閉じた。「誉れ」「辱め」「真実」は、日常的な分かりやすさを損なわない範囲で品位を保つ語として選んだ。
