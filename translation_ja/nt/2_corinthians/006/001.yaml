id: 2CO.6.1
reference: 2 Corinthians 6:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Συνεργοῦντες δὲ καὶ παρακαλοῦμεν μὴ εἰς κενὸν τὴν χάριν τοῦ θεοῦ δέξασθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/001.yaml
  text: Working together with him[a], we also urge you not to receive the grace of God in vain.
translation:
  language: ja
  text: 神と共に働く者として[a]、私たちはまた、神の恵みを無駄に受けることのないよう、あなたがたに強く勧めます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「共に働く者として」。ギリシア語は、誰と共に働くのかを明記していない。文脈上は神を指す可能性が高い。
    reason: 原文における協働相手の省略と解釈上の幅を示すため。
lexical_decisions:
- source_word: Συνεργοῦντες
  choice: 神と共に働く者として
  rationale: 「共に働く」という分詞の動作性を保ちつつ、直前の文脈（5:18–20）から暗示される協働の相手を「神」として補った。日本語として自然であり、パウロたちの奉仕の立場も明確になる。
- source_word: δὲ
  choice: 訳語を立てない
  rationale: 強い逆接ではなく、前文からの緩やかな移行を示すため、日本語の流れの中に吸収した。
- source_word: καὶ
  choice: また
  rationale: 共に働くことに加えて勧めるという付加の働きを、自然な現代日本語で表した。
- source_word: παρακαλοῦμεν
  choice: 強く勧めます
  rationale: 単なる提案ではなく、切実な訴え・勧告を表す語なので、「強く勧める」として力を保った。
- source_word: μὴ εἰς κενὸν
  choice: 無駄に…ことのないよう
  rationale: 「何の実も結ばずに」「効力のないものとして」という慣用的意味を、明快な日本語で表した。
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: 神の恵み
  rationale: 属格を素直に保ち、パウロ書簡で神の恵み深い働きと賜物を表す重要語 χάρις を「恵み」とした。
- source_word: δέξασθαι
  choice: 受ける
  rationale: 神の恵みを受領するという意味と神学的語調を保つ、簡潔で定着した訳語を採った。
- source_word: ὑμᾶς
  choice: あなたがたに
  rationale: 複数の読者に向けた直接的な勧告であることを明示した。
theological_decisions:
- issue: 「共に働く」相手が明示されていないこと
  choice: 本文では文脈上の相手を神として「神と共に働く者として」と訳す
  alternative: 「共に働く者として」とだけ訳し、相手を明示しない。または、パウロと同労者たちが互いに協働する意味に取る
  rationale: ギリシア語本文には協働の相手が明記されていないが、直前では神の和解の働きと、それに仕える使者としてのパウロたちが中心となっているため、神が最も自然な補充である。ただし、原文の文法的な曖昧さは脚注で保持した。
- issue: 神の恵みを「無駄に受ける」可能性
  choice: 原文の緊張を解消せず、「神の恵みを無駄に受けることのないよう」と訳す
  alternative: 「神の恵みを拒まないよう」「恵みに応えて実を結ぶよう」など、意味を説明的に限定する
  rationale: この句が救いの喪失、恵みへの応答、奉仕の実りなどのどれを具体的に指すかを本文だけで断定せず、εἰς κενόν の「無益・無効」という比喩を保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、使徒的勧告にふさわしい丁寧さと重みを保った。「強く勧めます」により παρακαλοῦμεν の切実さを示し、「無駄に受ける」という簡潔な表現で原文の神学的緊張を残した。
