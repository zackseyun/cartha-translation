source:
  edition: SBLGNT
  text: Μὴ γίνεσθε ἑτεροζυγοῦντες ἀπίστοις· τίς γὰρ μετοχὴ δικαιοσύνῃ καὶ ἀνομίᾳ, ⸂ἢ τίς⸃ κοινωνία φωτὶ πρὸς σκότος;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/014.yaml
  text: Do not become unequally yoked with unbelievers[b][a]. For what partnership has righteousness with lawlessness? Or what fellowship has light with darkness?
translation:
  language: ja
  text: 信じない人たちと、不釣り合いなくびきを共に負う者となってはなりません。[a] 義[b]と不法との間に、いったい何の結びつきがあるでしょうか。光と闇との間に、何の交わりがあるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不釣り合いなくびき」は、種類の異なる動物を一つのくびきにつなぐ姿を思わせる表現。申命記22章10節参照。
    reason: cross_reference
  - marker: b
    text: 「義」は「正義」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: ～ようになってはなりません
  rationale: γίνομαιの「～になる」という変化の含みと、μήを伴う禁止命令の力を、自然で厳粛な現代日本語で表した。
- source_word: ἑτεροζυγοῦντες
  choice: 釣り合わないくびきを共に負う
  rationale: 異なる種類のものが一つのくびきにつながれる比喩を保持しつつ、日本語で理解できる表現とした。申命記22章10節を想起させうる語像も残している。
- source_word: ἀπίστοις
  choice: 信じない人たちと
  rationale: 文脈上、信仰を持たない人々を指す。名詞的な「不信者」より平明で、くびきの比喩に必要な共同関係を助詞「と」で示した。
- source_word: μετοχὴ
  choice: 結びつき
  rationale: 共に参与し、分かち合う関係を表す語であり、ここでは義と不法の間に成立しない関係を自然な日本語で示した。
- source_word: δικαιοσύνῃ
  choice: 義
  rationale: パウロ書簡における神学的・倫理的な意味の広がりを保ち、不法との対照も明瞭にする。「正義」という可能性は脚注に残した。
- source_word: ἀνομίᾳ
  choice: 不法
  rationale: 法を無視する状態というἀνομίαの直接的な意味を保ち、義との鋭い対照を再現した。
- source_word: κοινωνία
  choice: 交わり
  rationale: 共に分かち合い、参与する親密な関係を表す語として、日本語聖書で理解されやすく、光と闇の比喩にも適する。
- source_word: φωτὶ πρὸς σκότος
  choice: 光と闇との間に
  rationale: 光と闇の比喩的対照をそのまま保ち、πρόςが示す相互の関係を自然な日本語で表した。
theological_decisions:
- issue: パウロ的文脈におけるδικαιοσύνηの訳語
  choice: 義
  alternative: 正義
  rationale: ここではἀνομία（不法）との倫理的・宗教的対照が中心であるため、意味範囲の広い「義」を本文に置いた。一方、社会的・法的な正しさを示す「正義」も語義上可能なので脚注に示し、意味を一つに限定しない。
- issue: 「釣り合わないくびき」の適用範囲
  choice: 比喩を保持し、特定の関係だけに限定しない
  alternative: 結婚など特定の関係を明示する
  rationale: 原文は信じない人々との不適切な結合を戒めるが、この節自体は結婚など一つの制度だけを明示していない。したがって訳文では適用範囲を狭めず、原文の緊張と比喩を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「くびき」「義」「不法」「交わり」という原文の比喩と対照を担う語を保持した。修辞疑問は「いったい」「何の～があるでしょうか」で、厳粛さと読みやすさを両立させた。
