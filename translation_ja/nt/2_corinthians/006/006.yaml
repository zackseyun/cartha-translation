  verdict: approve
  source_fidelity: 各句はギリシア語の反復するἐν句を過不足なく反映している。「清さ」はἁγνότηςの広い道徳的純粋さを保ち、「知識」「忍耐」「親切」もそれぞれγνῶσις、μακροθυμία、χρηστότηςに忠実である。「偽りのない愛」はἀγάπῃ ἀνυποκρίτῳの無偽善・無装いの意味を自然に表す。πνεύματι ἁγίῳを「聖霊」とする主訳は文脈上もっとも蓋然性が高く、脚注は冠詞を欠く表現に関する代案を適切に保持している。
  naturalness: 「〜により」の反復は現代標準日本語として理解しやすく、この節の列挙的・修辞的な調子にもよく合う。「清さ」「偽りのない愛」も明瞭で、不必要に文語的または教派的な表現ではない。末尾の読点は前後に続く原文の構文を反映している。
  terminology: 「聖霊」はパウロ書簡の通常の指示対象に沿う標準的な神学用語である一方、脚注により人の聖い内面的態度と読む可能性を閉ざしていない。他の徳目の訳語も現代日本語として安定しており、特定の解釈伝統を持ち込んでいない。
