id: 2CO.6.6
reference: 2 Corinthians 6:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ἁγνότητι, ἐν γνώσει, ἐν μακροθυμίᾳ, ἐν χρηστότητι, ἐν πνεύματι ἁγίῳ, ἐν ἀγάπῃ ἀνυποκρίτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/006.yaml
  text: in purity[a], in knowledge, in patience, in kindness, in the Holy Spirit, in sincere love,
translation:
  language: ja
  text: 清さにより、知識により、忍耐により、親切により、聖霊により[a]、偽りのない愛により、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、人の聖い心のあり方を指すと取るなら、「聖い心により」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγνότητι
  choice: 清さ
  rationale: 道徳的な清純さ、潔白さを広く表す語であり、性的純潔だけに狭めず、現代日本語として自然な「清さ」とした。
- source_word: γνώσει
  choice: 知識
  rationale: 奉仕における実践的・霊的理解を含み得るが、原語の幅を保つ標準的な訳語として「知識」を用いた。
- source_word: μακροθυμίᾳ
  choice: 忍耐
  rationale: 人や困難に対して長く耐える態度を表す。明瞭で一般的な現代語として「忍耐」とした。
- source_word: χρηστότητι
  choice: 親切
  rationale: 他者への慈しみ深さや好意ある振る舞いを表すため、関係的な性質が伝わる「親切」とした。
- source_word: πνεύματι ἁγίῳ
  choice: 聖霊
  rationale: パウロ書簡での通常の用法と文脈から、神の霊を指す可能性が最も高い。ただし、人の聖い心を指す可能性は脚注に残した。
- source_word: ἀγάπῃ ἀνυποκρίτῳ
  choice: 偽りのない愛
  rationale: ἀνυπόκριτοςの「偽善や見せかけがない」という意味を、自然かつ明瞭に愛へ結び付けた。
- source_word: ἐν
  choice: 〜により
  rationale: 列挙された事柄が、使徒たちが自らを神の奉仕者として示す手段・あり方であることを自然な日本語で表す。反復による修辞も保った。
theological_decisions:
- issue: πνεύματι ἁγίῳ の指示対象
  choice: 神の「聖霊」
  alternative: 人の「聖い心」または「聖い霊」
  rationale: 冠詞がないため文法だけでは絶対的に確定しないが、パウロの用法と周辺文脈では神の聖霊を指す理解が最も自然である。別の可能性を脚注で明示し、曖昧さを消していない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、列挙の荘重なリズムを保つため「〜により」を反復した。節が前後へ続く構文であることを示すため、末尾を読点とした。
