  text: διὸ ἐξέλθατε ἐκ μέσου αὐτῶν, καὶ ἀφορίσθητε, λέγει κύριος, καὶ ἀκαθάρτου μὴ ἅπτεσθε· κἀγὼ εἰσδέξομαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/017.yaml
  text: Therefore[a], come out from among them and be separate, says the Lord, and do not touch what is unclean[c][b]; and I will receive you.
translation:
  language: ja
  text: それゆえ、「彼らの中から出て、分かたれよ[a]」と、主は言われる。「汚れたものに触れてはならない[b][c]。そして、わたしはあなたがたを迎え入れる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「別にされよ」または「自らを分けよ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「汚れたものには何一つ触れてはならない」。
    reason: lexical_alternative
  - marker: c
    text: ここでパウロは、特にイザヤ書52章11節など、旧約聖書の預言の言葉を響かせている。
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: それゆえ
  rationale: 直前の議論から導かれる結論を示す推論的な接続語として、自然で格調のある現代日本語を用いた。
- source_word: ἐξέλθατε ἐκ μέσου αὐτῶν
  choice: 彼らの中から出て
  rationale: 複数への決然とした命令と、「彼らのただ中から」という空間的・社会的な分離の両面を簡潔に保った。
- source_word: ἀφορίσθητε
  choice: 彼らと離れよ
  rationale: 受動形が表す分離された状態への命令を、日本語として自然に表した。「自らを分けよ」として能動・再帰の意味を過度に強めることは避けた。
- source_word: λέγει κύριος
  choice: と主は言われる
  rationale: 預言的な引用定型を保ちつつ、κύριοςを新約本文に即して「主」とした。
- source_word: ἀκαθάρτου μὴ ἅπτεσθε
  choice: 汚れたものに触れてはならない
  rationale: 属格中性単数を特定の物体に限定せず「汚れたもの」とし、清浄・分離の比喩に合う「触れる」を採用した。
- source_word: κἀγὼ εἰσδέξομαι ὑμᾶς
  choice: そうすれば、わたしはあなたがたを迎え入れる
  rationale: 神の応答としての将来的な好意ある受け入れを自然な日本語で表した。「迎え入れる」は単なる容認よりも温かな受容を示す。接続は文脈上の応答関係が伝わるよう「そうすれば」とした。
theological_decisions:
- issue: 旧約預言を背景とする κύριος の訳語
  choice: 主
  alternative: 主なる神／ヤハウェ
  rationale: 本文は新約ギリシア語でκύριοςと記しているため、旧約の神名を訳文に直接補わず「主」とした。
- issue: 分離命令の射程
  choice: 彼らと離れよ
  alternative: 彼らとのあらゆる接触を断て
  rationale: 本文の命令を明確に訳す一方、外部の人々との一切の接触禁止や特定の宗派的・禁欲的実践まで意味するとは限定しなかった。
- issue: 神による受け入れとの関係
  choice: そうすれば、わたしはあなたがたを迎え入れる
  alternative: そして、わたしはあなたがたを迎え入れる
  rationale: καί自体は単純な接続だが、命令に続く神の応答という談話上の関係を自然な日本語で示した。ただし、救いを人間の行為による功績とする説明は加えていない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、預言的引用にふさわしい簡潔さと格調を保った。命令形は「出て」「離れよ」「触れてはならない」とし、強さを弱めず、古語的になりすぎない表現にした。
