reference: 2 Corinthians 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει γάρ· Καιρῷ δεκτῷ ἐπήκουσά σου καὶ ἐν ἡμέρᾳ σωτηρίας ἐβοήθησά σοι· ἰδοὺ νῦν καιρὸς εὐπρόσδεκτος, ἰδοὺ νῦν ἡμέρα σωτηρίας·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/002.yaml
  text: For he says[a], “At an acceptable time I listened to you, and in a day of salvation I helped you.” Behold, now is the acceptable time; behold[b], now is the day of salvation.
translation:
  language: ja
  text: 'というのも、神はこう言っておられます。[a]


    「恵みの時に、わたしはあなたに耳を傾け、

    救いの日に、あなたを助けた。」


    見よ、今こそ、恵みの時です。見よ、今こそ、救いの日です。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「というのも、彼は言われます」。ここでは、引用の一人称の話者である神を明示しました。
    reason: implicit_subject
  - marker: b
    text: 「恵みの時」は「受け入れられる時」「好意の時」とも訳せます。原文では「恵みの時」と「救いの日」に定・不定を示す冠詞はありません。
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: λέγει γάρ
  choice: 神はこう言っておられます
  rationale: γάρは直前の勧めの根拠を示し、λέγειは聖書のことばを現在の神の発言として導入する。日本語では文脈上の話者である神を明示するほうが自然である。
- source_word: Καιρῷ δεκτῷ
  choice: 恵みの時に
  rationale: καιρόςはふさわしい時機、δεκτόςは受け入れられる、好意的な、という意味を持つ。引用元イザヤ書の文脈と自然な日本語を考慮し、「神の好意が示される時」を簡潔に「恵みの時」とした。
- source_word: ἐπήκουσά σου
  choice: あなたの願いを聞き入れ
  rationale: ἐπακούωは単に音声を聞く以上に、好意をもって聞き、応じる含意を持つ。「願い」は目的語に補って日本語を自然にしたが、応答そのものまで断定しない。
- source_word: ἐν ἡμέρᾳ σωτηρίας
  choice: 救いの日に
  rationale: 無冠詞だが、日本語には冠詞がなく、直訳的かつ自然に「救いの日」とすることで限定性を過度に決めない。
- source_word: ἐβοήθησά σοι
  choice: あなたを助けた
  rationale: βοηθέωの基本義である「助ける、援助する」を明快な現代日本語で表した。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を強く促す荘重な小辞の機能を保つ。「さあ」よりも引用後の宣言にふさわしい格調がある。
- source_word: νῦν
  choice: 今こそ
  rationale: 反復されるνῦνの時間的切迫と強調を、日本語の係助詞「こそ」で自然に表した。
- source_word: καιρὸς εὐπρόσδεκτος
  choice: 恵みの時
  rationale: εὐπρόσδεκτοςは「大いに受け入れられる、喜ばしい、好意を受ける」の意。δεκτόςとの語義的連続を保ちつつ、日本語で不自然な「非常に受け入れられる時」を避けた。
- source_word: ἡμέρα σωτηρίας
  choice: 救いの日
  rationale: 無冠詞表現のため、日本語では定・不定を付加せず、そのまま「救いの日」とした。
theological_decisions:
- issue: 「恵みの時／救いの日」を特定の唯一の日として限定するか
  choice: 日本語の無冠詞性を生かし、「恵みの時」「救いの日」と訳す
  alternative: 「その恵みの時」「まさに救いの日」など、明示的に限定する
  rationale: ギリシア語はいずれも無冠詞であり、日本語では定・不定を無理に明示せず、パウロの「今」への切迫した適用を保持できる。
- issue: λέγειの主語を聖書とするか神とするか
  choice: 「神はこう言っておられます」とし、神を話者として明示する
  alternative: 「聖書はこう言っています」または主語を省いて「こう言われています」
  rationale: 引用の一人称話者は神であり、パウロの聖書引用には神の現在的発言としての響きがある。神を明示しても引用内容を越えた教派的解釈にはならない。
- issue: ἐπήκουσά σουの応答性をどこまで表すか
  choice: 「あなたの願いを聞き入れ」
  alternative: 「あなたの声を聞き」または「あなたに答え」
  rationale: この動詞にある好意的に聞く含意を表しつつ、「答えた」として結果まで強く解釈することを避けた。
translation_notes:
  register: 明快な現代標準語を用いながら、引用と宣言の荘重さを「見よ」と反復で保持した。引用部は詩行として改行し、後半はνῦνの緊迫感を「今こそ」で表した。過度に古風な「聞き届けた」「いざ」などは避けた。
