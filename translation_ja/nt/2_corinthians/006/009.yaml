  source_fidelity: 全体として、ὡςが導く反復的な逆説、ἀγνοούμενοι／ἐπιγινωσκόμενοιの対照、ἀποθνῄσκοντεςとζῶμενの現在的な緊張、ἰδοὺの強調、そしてμὴ θανατούμενοιの受動態はよく捉えられている。ただし「死に渡されてはいません」は、日本語では「死に引き渡される」という表現の連想が強く、θανατούμενοι（殺される・死に至らされる）の通常の意味をやや不自然かつ曖昧にする。「殺されてはいない」とするのが、原文の受動態と前句との区別を自然に保つ。
  naturalness: 「人に知られていないようでいて、よく知られており」は自然である。一方、三つの句をすべて「〜ようでいて」で結ぶと、ὡςの列挙としては許容範囲であるものの、最後の「懲らしめを受けているようでいて」は、実際に受けている苦難を単なる見かけとして響かせ得る。「懲らしめを受けながらも」とすると、逆説を保ちつつ日本語として滑らかである。また「死に渡されてはいません」は現代標準語として不自然である。
  terminology: παιδευόμενοιは「懲らしめを受けている」でも可能だが、矯正的処罰へ意味を狭めやすい。「鍛えられながらも」は教育的・形成的な幅を保つ。ただし本文を「懲らしめを受けながらも」として脚注で「鍛えられている」「戒められている」を示すことも、英語監査記録のdisciplnedに対応する安全な選択である。ここでは苦難の文脈と語義幅を両立する「鍛えられながらも」を採る。
