lexical_decisions:
- source_word: ὡς
  choice: 〜ようでいて
  rationale: 三つの逆説的な対句を導く反復を保ちつつ、外見上の評価と実情との対照が自然な現代日本語で伝わるようにした。
- source_word: ἀγνοούμενοι
  choice: 人に知られていない
  rationale: 受動の意味を明示し、単なる無知ではなく、他者から知られず認められていない状態を表した。
- source_word: ἐπιγινωσκόμενοι
  choice: よく知られている
  rationale: ἀγνοούμενοιとの簡潔な対照を保ち、十分に認知・承認される含みも残した。
- source_word: ἀποθνῄσκοντες
  choice: 死にかけている
  rationale: 死の危険にさらされ続ける状態を表し、後半のθανατούμενοι（死に渡される）との語義上の区別を保った。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を強く促す原文の間投詞を、簡潔で品位ある聖書的表現として保持した。
- source_word: ζῶμεν
  choice: 私たちは生きている
  rationale: 単純な現在形と主語を明示し、『死にかけている』との鋭い逆説を保った。
- source_word: παιδευόμενοι
  choice: 懲らしめを受けている
  rationale: 苦難の文脈における矯正的な扱いを表しつつ、訓練・教育という語義の幅は脚注で示した。
- source_word: μὴ θανατούμενοι
  choice: 死に渡されてはいない
  rationale: 受動形を保ち、単に『殺されない』よりも、死に至らせる処置を受けながら最終的には命を奪われないという対照を表した。
theological_decisions:
- issue: παιδευόμενοιが苦難との関係で示す意味
  choice: 懲らしめを受けている
  alternative: 訓練を受けている／戒められている
  rationale: 矯正的な苦難の含みを本文に残す一方、それを特定の神罰や教理に限定せず、形成的訓練の可能性も脚注で保持した。
