  terminology: 「一致」はσυγκατάθεσιςの文脈上の「合意・調和」を簡潔に表す。「神殿」はναόςの礼拝的・比喩的な力を保ち、「偶像」はεἴδωλαの宗教的対立を正確に示す。「民」はλαόςによる契約共同体の集合的意味に適切である。
