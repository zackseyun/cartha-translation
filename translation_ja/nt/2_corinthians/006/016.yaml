id: 2CO.6.16
reference: 2 Corinthians 6:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς δὲ συγκατάθεσις ναῷ θεοῦ μετὰ εἰδώλων; ⸂ἡμεῖς γὰρ ναὸς θεοῦ ἐσμεν⸃ ζῶντος· καθὼς εἶπεν ὁ θεὸς ὅτι Ἐνοικήσω ἐν αὐτοῖς καὶ ἐμπεριπατήσω, καὶ ἔσομαι αὐτῶν θεός, καὶ αὐτοὶ ἔσονταί ⸀μου λαός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/016.yaml
  text: 'And what agreement has the temple of God with idols? For we are the temple of the living God[a], just as God said: “I will dwell among them and walk among them, and I will be their God[b], and they will be my people.”'
translation:
  language: ja
  text: '神の神殿と偶像とに、どんな一致があるでしょうか。私たちは生ける神の神殿なのです。神がこう言われたとおりです。

    「わたしは彼らの間に住み[a]、彼らの間を歩む。

    わたしは彼らの神となり、彼らはわたしの民となる。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの内に住み」。ギリシア語の前置詞は「内に」とも「間に」とも訳し得る。ここでは共同体についての契約の文脈と、続く「彼らの間を歩む」との対応から「間に」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: συγκατάθεσις
  choice: 一致
  rationale: 同意・調和・一致を表す語。直前から続く両立しない組み合わせについての修辞疑問に合い、現代日本語として明快である。
- source_word: ναῷ / ναὸς
  choice: 神殿
  rationale: 神域全体よりも神の住まいである聖所・神殿を指す語であり、礼拝的な比喩を保つ。
- source_word: εἰδώλων
  choice: 偶像
  rationale: ここでは中立的な像ではなく異教礼拝の対象を指すため、「偶像」が文脈に適する。
- source_word: ζῶντος
  choice: 生ける
  rationale: 命のない偶像と対照される定型的な聖書表現。「生きておられる」より簡潔で荘重な「生ける」を用いた。
- source_word: καθὼς εἶπεν ὁ θεὸς
  choice: 神がこう言われたとおりです
  rationale: καθώςの比較・根拠提示の働きを「とおり」で示し、後続の引用を自然に導入するため「こう」を補った。
- source_word: Ἐνοικήσω ἐν αὐτοῖς
  choice: わたしは彼らの間に住み
  rationale: ἐν αὐτοῖςは「彼らの内に」とも訳せるが、共同体への契約的臨在と、続く「彼らの間を歩む」との並行を踏まえて「彼らの間に」とした。曖昧さは脚注で保持する。
- source_word: ἐμπεριπατήσω
  choice: 彼らの間を歩む
  rationale: 神が民のただ中に臨在するという旧約的・契約的な比喩を自然な日本語で保つ。
- source_word: ἔσομαι αὐτῶν θεός
  choice: わたしは彼らの神となり
  rationale: 所有・関係を示す属格を、日本語で定着した契約定式として表した。
- source_word: λαός
  choice: 民
  rationale: 契約共同体を集合的に指すため、聖書的でありつつ一般にも理解できる「民」が適切である。
theological_decisions:
- issue: 共同体としての神殿という比喩
  choice: 私たちは生ける神の神殿なのです
  alternative: 私たちは生ける神の一つの神殿なのです
  rationale: 述語位置の無冠詞ναὸςはここで質的・特定的な意味を持ち、共同体が神の神殿であるという身分を述べる。「神殿」とすることで、不自然な不定性を持ち込まず、集合的な比喩を保つ。
- issue: 神の内住を表す引用
  choice: わたしは彼らの間に住み
  alternative: わたしは彼らの内に住み
  rationale: 複数のαὐτοῖςと、並行する「彼らの間を歩む」、および共同体的な契約定式を踏まえ、「間に」を本文に採用した。ただしギリシア語ἐνが「内に」を許すことを脚注に明記した。
translation_notes:
  register: 明快な現代標準日本語を基調とし、聖書引用では「わたし」「民」「歩む」を用いて簡潔で品位ある調子を保った。修辞疑問は「どんな一致があるでしょうか」とし、強い断定性を保ちながら過度に古風な表現を避けた。
