  text: οὐ στενοχωρεῖσθε ἐν ἡμῖν, στενοχωρεῖσθε δὲ ἐν τοῖς σπλάγχνοις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/012.yaml
  text: You are not restricted by us[a], but you are restricted in your own affections.
translation:
  language: ja
  text: あなたがたを狭くしているのは、私たちではありません。あなたがた自身の愛情が狭くなっているのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στενοχωρεῖσθε
  choice: 窮屈にされている／窮屈になっている
  rationale: この語が持つ「狭い所に押し込められる」という空間的な比喩と、対人関係の中で心が狭く閉ざされているという文脈上の意味をともに伝えるため。「制限される」より比喩を保ち、二度の反復も維持した。日本語として自然になるよう、第一節では使役受身、第二節では状態変化として表現した。
- source_word: ἐν ἡμῖν
  choice: 私たちによって
  rationale: 前置詞ἐνの字義は「私たちの内で」だが、ここでは窮屈さの原因がパウロたちの側にはない、という関係的・原因的な意味が自然である。字義的な可能性は脚注に残した。
- source_word: δὲ
  choice: むしろ
  rationale: 二つの節の鮮明な対照を、現代日本語で自然に示すため。単なる逆接以上に、窮屈さの所在を相手自身へと転じる論旨を表す。
- source_word: ἐν τοῖς σπλάγχνοις ὑμῶν
  choice: 自分自身の心の内で
  rationale: σπλάγχναは字義的には「内臓」だが、ここでは深い感情や愛情の宿る内面を指す。「心の内」は身体的な内側の比喩をある程度保ちながら、普通の日本語で関係的・感情的意味を伝える。「自分自身の」はὑμῶνの対照的な強調を明示する。
- source_word: οὐ
  choice: ではありません
  rationale: 第一節の否定を明確に表す。
theological_decisions:
- issue: σπλάγχναの比喩的意味
  choice: コリントの人々の愛情や内面的な受容力を指す「心の内」
  alternative: 字義的な「内臓」または「はらわた」
  rationale: 前後の文脈は、パウロたちの心の広さとコリントの人々の応答の狭さを対比している。身体部位そのものではなく、深い感情の座を指す比喩と理解しつつ、「心の内」という表現で内側の空間的イメージを残した。
- issue: 窮屈さの原因または領域を表すἐν ἡμῖν
  choice: 「私たちによって」とし、パウロたちが原因ではないことを示す
  alternative: 「私たちの内で」として領域を字義的に示す
  rationale: 文脈上の対照は、制約がパウロたちの側から生じたのではなく、コリントの人々自身の内面にあるという点にある。ただし、前置詞の字義的な曖昧さは脚注で保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、原文で反復されるστενοχωρεῖσθεの「狭さ・窮屈さ」という比喩を保持した。丁寧体により公読にも適する落ち着いた調子とし、「はらわた」のように現代では誤解を招きやすい字義訳は避けた。
