  source_fidelity: 第一節の「私たちによって」は、ἐν ἡμῖνの文脈上の関係的・原因的意味を適切に表している。しかし第二節の「心の内」はσπλάγχναが指す深い愛情・情愛をやや一般的な内面へと弱めている。また、同じστενοχωρεῖσθεの反復に対して「窮屈にされている」と「窮屈になっている」を使い分けると、原文の意図的な反復が薄れる。
  naturalness: 「自分自身の心の内で窮屈になっている」は意味は通るが、日本語としてはやや抽象的で、何が狭いのかが分かりにくい。「愛情が狭くなっている」とすれば、文脈上の対人的・感情的な閉鎖性が明確になる。
  terminology: σπλάγχναはこの文脈では内臓の字義ではなく、深い愛情・情愛を表す。「愛情」を用いるのが明快であり、神学的に過度な解釈を加えない。στενοχωρεῖσθεの比喩は「狭くなっている」により両節で保つ。
