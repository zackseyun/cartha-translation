base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/006/011.yaml
  text: Our mouth has been opened to you[a], Corinthians[b]; our heart has been widened.
translation:
  language: ja
  text: コリントの人たち、私たちはあなたがたに向けて口を開いており、私たちの心は広げられています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「私たちの口はあなたがたに向けて開かれ、私たちの心は広げられています」。すなわち、私たちはあなたがたに率直に語りかけ、心を広く開いている、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: στόμα
  choice: 口
  rationale: 「心」と並ぶ身体的な比喩を保つ。「語ること」と意訳するより、パウロの表現を直接伝えられる。
- source_word: ἀνέῳγεν
  choice: 開かれ
  rationale: 完了形が示す、開かれた結果として現在も開いている状態を文脈上自然な日本語で表す。受動形により原文の比喩も保持する。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたに向かって
  rationale: 発言が相手に向けられていることを示す πρός の方向性を保ち、口が開くという比喩にも自然につなげる。
- source_word: Κορίνθιοι
  choice: コリントの人たち
  rationale: 呼格による直接の呼びかけを、現代日本語で明瞭かつ自然に表す。
- source_word: καρδία
  choice: 心
  rationale: 感情や内面的な思いの中心を指す標準的な訳であり、「口」と対になる原文の比喩を保つ。
- source_word: πεπλάτυνται
  choice: 広くなっています
  rationale: πλατύνω の「広げる、広くする」という像と、完了形による現在の状態を保つ。日本語では「心が広くなっている」がやや不慣れなため注で意味を補う。
theological_decisions:
- issue: パウロの率直さと愛情を表す身体的比喩
  choice: 「口は…開かれ」「心は広くなっています」という比喩を本文に残す。
  alternative: 「あなたがたに率直に語り、心を大きく開いています」と意味を明示する。
  rationale: 原文は発言の率直さと愛情の広がりを身体的な並行表現で示している。本文ではその修辞を保持し、意味は脚注で明らかにすることで、特定の解釈に狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「口」と「心」の対句、および二つの完了形が示す現在の状態を保持した。呼びかけの「コリントの人たち」は文頭に置き、日本語として自然な訴えかけにした。
