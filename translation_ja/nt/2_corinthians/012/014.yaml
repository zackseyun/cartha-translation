  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδοὺ τρίτον ⸀τοῦτο ἑτοίμως ἔχω ἐλθεῖν πρὸς ὑμᾶς, καὶ οὐ ⸀καταναρκήσω· οὐ γὰρ ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς, οὐ γὰρ ὀφείλει τὰ τέκνα τοῖς γονεῦσιν θησαυρίζειν, ἀλλὰ οἱ γονεῖς τοῖς τέκνοις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/014.yaml
  text: Look, this is the third time I am ready to come to you, and I will not be a burden to you. For I do not seek what is yours, but you. For children are not obligated to store up for their parents, but parents for their children.
translation:
  language: ja
  text: さあ、今度で三度目になりますが、私はあなたがたのところへ行く用意ができています[a]。そして、あなたがたに負担をかけません[b]。私が求めているのは、あなたがたの持ち物ではなく、あなたがた自身だからです。子どもが親のために蓄える義務はなく、親には子どものために蓄える義務があります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「これで三度目、私はあなたがたのところへ行く用意ができています」。この表現は現在の訪問準備を三度目として述べており、過去に何度実際に訪問したかを、この節だけで確定するものではありません。
    reason: lexical_alternative
  - marker: b
    text: 「負担をかける」と訳した動詞には、特に金銭的・物質的な負担を負わせる意味合いがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: さあ
  rationale: 談話上の注意喚起を、現代日本語で自然かつ簡潔に表した。古風な「見よ」は避けた。
- source_word: τρίτον τοῦτο ἑτοίμως ἔχω ἐλθεῖν
  choice: 私は今、三度目として…行く用意ができています
  rationale: 「三度目」が実際の訪問回数か訪問準備・計画の回数かを断定せず、現在の準備が整っているというギリシア語の重心を保った。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのところへ
  rationale: 訪問・移動の文脈に即した自然な日本語とした。
- source_word: καταναρκήσω
  choice: あなたがたに負担をかけるつもりはありません
  rationale: 物質的・金銭的な負担を負わせる含意を持つ語を、文脈上自然な表現で訳した。未来形は話者の意志を表す日本語とした。
- source_word: ζητῶ τὰ ὑμῶν ἀλλὰ ὑμᾶς
  choice: 求めているのは、あなたがたの持ち物ではなく、あなたがた自身
  rationale: 所有物と人そのものとの対照を明確に保った。
- source_word: ὀφείλει
  choice: 義務がある／べき
  rationale: 義務・当然性を表す語義を保持しつつ、反意対句が自然に読めるよう後半では「べき」とした。
- source_word: θησαυρίζειν
  choice: 蓄えて…与える／…のために蓄える
  rationale: 財を蓄える意味を保ち、与格が示す受益者を日本語で明示した。「与える」は前半で補足的に用いた。
- source_word: γονεῦσιν / γονεῖς
  choice: 親
  rationale: 父母を包括する一般語として訳した。
- source_word: τέκνα / τέκνοις
  choice: 子ども
  rationale: 性別を限定しない一般語として訳した。
theological_decisions:
- issue: 「三度目」の訪問史上の意味
  choice: 「三度目として…行く用意ができています」と訳し、三度目の準備・企図に焦点を置く
  alternative: 「三度目にあなたがたのところへ行く」として、過去に二度実際に訪問したことを強く示す
  rationale: 原文の語順と構文は「三度目」と「用意ができている／行く」を結びつけるが、過去の訪問回数の再構成をこの節だけで確定させないため。
- issue: 親子の比喩における義務
  choice: 一般的な親子関係の格言として、親が子のために備える義務を表す
  alternative: 使徒と教会の金銭関係についての普遍的な制度規定として読む
  rationale: 文脈上パウロの牧会的・親的関係を説明する比喩であり、本文以上の制度的教義を訳文に持ち込まないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの強い対照表現と親としての温かい論旨を保った。「さあ」は自然な注意喚起、「あなたがた自身」は所有物との対照を明示する表現である。
