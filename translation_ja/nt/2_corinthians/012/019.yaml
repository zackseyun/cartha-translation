id: 2CO.12.19
reference: 2 Corinthians 12:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Πάλαι δοκεῖτε ὅτι ὑμῖν ἀπολογούμεθα; ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν. τὰ δὲ πάντα, ἀγαπητοί, ὑπὲρ τῆς ὑμῶν οἰκοδομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/019.yaml
  text: Have you been thinking all along that we are defending ourselves to you? Before God[a], in Messiah, we are speaking. And everything, beloved[b], is for your building up.
translation:
  language: ja
  text: あなたがたは、私たちがこれまでずっと、あなたがたに対して自己弁護をしていると思っているのですか。私たちは神の御前で、メシアにあって語っています。愛する人たち、すべてはあなたがたを築き上げるためなのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλαι
  choice: これまでずっと
  rationale: 読者が抱き続けてきた考えを指す文脈上の用法を、自然な現代日本語で表した。
- source_word: δοκεῖτε
  choice: 思っているのですか
  rationale: 現在の継続的な思い込みを問う修辞疑問として訳した。
- source_word: ἀπολογούμεθα
  choice: 自己弁護をしている
  rationale: 自分たちを弁明し正当化するという法廷的含意を、明瞭な日本語で保った。
- source_word: κατέναντι θεοῦ
  choice: 神の御前で
  rationale: 神の臨在と神に対する責任のもとで語るという厳粛な意味を表した。
- source_word: ἐν Χριστῷ
  choice: キリストにあって
  rationale: パウロ書簡での結びつき・領域を示す定型的な表現を保ち、単に『キリストについて』と誤解されないようにした。
- source_word: λαλοῦμεν
  choice: 語っています
  rationale: 現在形の持続性と発言の直接性を自然に表した。
- source_word: τὰ δὲ πάντα
  choice: すべては
  rationale: 直前までに述べられたパウロの言動全体を指す包括性を簡潔に表した。δέは日本語では文脈上明示しなくても転換が伝わる。
- source_word: ἀγαπητοί
  choice: 愛する人たち
  rationale: 呼びかけの愛情を保ちつつ、現代の一般読者に自然で明瞭な表現とした。
- source_word: ὑπὲρ τῆς ὑμῶν οἰκοδομῆς
  choice: あなたがたを築き上げるため
  rationale: 共同体を霊的に強める意味と建築の比喩の双方を保った。
theological_decisions:
- issue: ἐν Χριστῷ の訳し方
  choice: キリストにあって
  alternative: メシアにあって／キリストに結ばれて
  rationale: 日本語聖書で広く理解される称号『キリスト』を用い、ἐν の結合・領域という神学的含みを解釈しすぎずに保った。
- issue: οἰκοδομή の対象と意味
  choice: あなたがたを築き上げる
  alternative: あなたがたの成長のため／あなたがたを強めるため
  rationale: 教会共同体の霊的形成を表しながら、原文の建築比喩を維持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。修辞疑問、神の御前で語る厳粛さ、共同体への愛情を自然に表現した。句読点はSBLGNT本文の流れに即して三文に分け、英語相談層の不適切な脚注対応には従わなかった。
