reference: 2 Corinthians 12:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καυχᾶσθαι ⸀δεῖ· οὐ ⸂συμφέρον μέν⸃, ἐλεύσομαι ⸀δὲ εἰς ὀπτασίας καὶ ἀποκαλύψεις κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/001.yaml
  text: Boasting is necessary[a], though it is not beneficial[b]; but I will go on to visions and revelations of the Lord.
translation:
  language: ja
  text: 誇ることは必要です。確かに有益ではありませんが、私は主の幻と啓示[a]について述べることにします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主からの幻と啓示」とも訳せる。ギリシア語の属格は、主がその源であることを示す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχᾶσθαι
  choice: 誇ること
  rationale: 現在中動態不定詞の名詞的用法を、動作性を保ちながら自然な日本語で表した。文脈上はパウロ自身の誇りを含意するが、原文にない主語は補わなかった。
- source_word: δεῖ
  choice: 必要です
  rationale: 義務・必然性を示す語の力を保ちつつ、明瞭で過度に断定的にならない現代日本語とした。
- source_word: οὐ συμφέρον μέν
  choice: 有益ではありませんが
  rationale: συμφέρονを「有益」とし、μένが後続のδέと作る対照を日本語の「が」で自然に示した。
- source_word: ἐλεύσομαι δὲ εἰς
  choice: 私は…話に移ります
  rationale: ここでは物理的に「来る」というより、新しい論題へ進むことを表す。「話に移ります」として談話上の推移を明確にした。
- source_word: ὀπτασίας
  choice: 幻
  rationale: 超自然的に示される光景を指す標準的で簡潔な訳語。複数形は、日本語では文脈上自然な無標の形で表した。
- source_word: ἀποκαλύψεις
  choice: 啓示
  rationale: 隠されていた事柄が神によって示されることを表す、定着した訳語を用いた。複数形は日本語で不自然な「啓示の数々」とせず、無標で表した。
- source_word: κυρίου
  choice: 主の
  rationale: 属格の関係を限定せず、「主に属する／主に関わる／主からの」という幅を保てる「主の」とした。
theological_decisions:
- issue: κυρίουと「幻と啓示」との関係
  choice: 主の幻と啓示
  alternative: 主からの幻と啓示
  rationale: 属格は源を示すとも理解できるが、原文はその関係を明示していない。「主の」とすることで、原文の簡潔さと解釈上の幅を保った。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「私は」を補って一人称未来形を明示し、「話に移ります」によって論題の転換を自然に表した。
