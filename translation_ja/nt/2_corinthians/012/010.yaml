revisions:
- from: ですから私は、メシア[a]のために受ける弱さ、侮辱、困窮、迫害、苦境を喜びとします。なぜなら、私が弱いときにこそ、私は強いからです。
  to: ですから私は、メシア[a]のために、弱さ、侮辱、苦難、迫害、苦境を喜びとします。なぜなら、私が弱いときにこそ、私は強いからです。
  rationale: 「メシアのために」を列挙全体に自然に係らせつつ、「受ける」という原文にない補足を除きました。ἀνάγκαιςは経済的窮乏に限定されないため、「困窮」をより包括的な「苦難」に改めました。その他の語順、逆説、脚注は維持しています。
