reference: 2 Corinthians 12:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὸ εὐδοκῶ ἐν ἀσθενείαις, ἐν ὕβρεσιν, ἐν ἀνάγκαις, ἐν διωγμοῖς ⸀καὶ στενοχωρίαις, ὑπὲρ Χριστοῦ· ὅταν γὰρ ἀσθενῶ, τότε δυνατός εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/010.yaml
  text: Therefore I delight in weaknesses[a], in insults, in hardships, in persecutions and distresses, for the sake of Messiah; for when I am weak, then I am strong.
translation:
  language: ja
  text: ですから私は、メシア[a]のために、弱さ、侮辱、苦難、迫害、苦境を喜びとします。なぜなら、私が弱いときにこそ、私は強いからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「キリスト」。
    reason: Χριστόςを称号として「メシア」と訳した場合の伝統的な訳語を示す。
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の議論から導かれる結論を、現代日本語で明確かつ自然に示す。
- source_word: εὐδοκῶ ἐν
  choice: ～を喜びとします
  rationale: 単なる忍従ではなく、好意をもって受け入れ、喜ぶという逆説的な意味を保つ。日本語では目的語を取る形に整えた。
- source_word: ἐν ἀσθενείαις
  choice: 弱さ
  rationale: 病気だけに限定せず、人間的な弱さや無力さを広く表す。ギリシア語の複数形は、日本語では自然な集合的単数で表した。
- source_word: ἐν ὕβρεσιν
  choice: 侮辱
  rationale: 屈辱を与える言動や不当な扱いを簡潔に表す。
- source_word: ἐν ἀνάγκαις
  choice: 困窮
  rationale: 避けがたい圧迫や切迫した苦難を表し、後続のστενοχωρίαιςとの違いもある程度保つ。
- source_word: ἐν διωγμοῖς
  choice: 迫害
  rationale: メシアへの忠誠ゆえに受ける迫害というパウロ書簡での通常の意味を表す。
- source_word: καὶ στενοχωρίαις
  choice: 苦境
  rationale: 身動きの取れない圧迫された状況という語感を、自然な現代日本語で表す。
- source_word: ὑπὲρ Χριστοῦ
  choice: メシアのために受ける
  rationale: ὑπέρが示す原因・献身の関係を明確にし、列挙された苦難がメシアのために受けるものであることを自然に示す。
- source_word: ὅταν γὰρ ἀσθενῶ
  choice: なぜなら、私が弱いときにこそ
  rationale: 一般的・反復的な時を表すὅτανの意味を保ち、「こそ」によってτότεとの逆説的な対応を明瞭にする。
- source_word: τότε δυνατός εἰμι
  choice: 私は強いからです
  rationale: ἀσθενῶとの直接的な対照を保ち、神学的な仕組みを訳文で補足せず、原文の逆説をそのまま示す。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味を保つため「メシア」とした。日本語で伝統的な「キリスト」も可能なので脚注に示した。
- issue: 弱いときに強いという逆説
  choice: 原文どおり主体をともに「私」として保持
  alternative: 「神の力によって強い」などの説明を本文に補う
  rationale: 文脈上は神またはメシアの力が背景にあるが、この節自体はそれを明示しないため、神学的説明を本文へ加えず緊張を保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、書簡にふさわしい品位を保った。苦難の列挙は簡潔にし、「喜びとします」「弱いときにこそ、私は強い」によって原文の逆説と修辞的な力を残した。
