    text: 伝統的には「キリスト」。
    reason: Χριστόςを称号として「メシア」と訳した場合の伝統的な訳語を示す。
  revision_rationale: 「メシアのために」を列挙全体に自然に係らせつつ、「受ける」という原文にない補足を除きました。ἀνάγκαιςは経済的窮乏に限定されないため、「困窮」をより包括的な「苦難」に改めました。その他の語順、逆説、脚注は維持しています。
