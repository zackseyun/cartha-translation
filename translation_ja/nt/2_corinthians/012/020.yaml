id: 2CO.12.20
reference: 2 Corinthians 12:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: φοβοῦμαι γὰρ μή πως ἐλθὼν οὐχ οἵους θέλω εὕρω ὑμᾶς, κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε, μή πως ⸀ἔρις, ⸀ζῆλος, θυμοί, ἐριθεῖαι, καταλαλιαί, ψιθυρισμοί, φυσιώσεις, ἀκαταστασίαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/020.yaml
  text: For I fear that perhaps when I come I may find you not as I wish[a], and I may be found by you to be as you do not wish—that perhaps there may be strife, jealousy, outbursts of anger, selfish ambition, slanders, whisperings, conceit, and disorder.
translation:
  language: ja
  text: というのも、そちらへ行ったとき、私があなたがたを私の望むような者でないと知り、また私があなたがたから、あなたがたの望まない者と見なされるのではないかと恐れているからです。争い、ねたみ、怒りの爆発、利己的な野心、悪口、陰口[a]、思い上がり、混乱があるのではないかとも恐れています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ひそかな中傷」または「うわさ話」とも訳せる。
    reason: ψιθυρισμοί は、ひそひそと語る中傷、陰口、うわさ話を含み得るため。
lexical_decisions:
- source_word: φοβοῦμαι
  choice: 心配している
  rationale: 現在形が表すパウロの継続的な懸念を、現代日本語で自然に示す。「恐れている」も可能だが、ここでは予想される共同体の状態への懸念として「心配している」が明瞭。
- source_word: μή πως
  choice: ～のではないかと
  rationale: 二度繰り返される、望ましくない可能性への危惧を自然な日本語で保つ。
- source_word: ἐλθὼν
  choice: 私が行ったとき
  rationale: 文脈上の時間的な分詞として訳し、訪問時の出来事を示す。
- source_word: οὐχ οἵους θέλω εὕρω ὑμᾶς
  choice: あなたがたが私の願うような者ではないと分かり
  rationale: οἵους が人々の状態やあり方を指すことを「ような者」で表し、εὕρω は単なる視認でなく訪問して判明する意味を「分かる」とした。
- source_word: κἀγὼ εὑρεθῶ ὑμῖν οἷον οὐ θέλετε
  choice: また私も、あなたがたの願わないような者だと分かってしまう
  rationale: 前半との相互的・対称的な構造を保つ。受動形は日本語で不自然な「見いだされる」を避けつつ、彼らから見たパウロのあり方が判明する含意を残した。
- source_word: ἔρις
  choice: 争い
  rationale: 共同体内の対立や不和を広く表す自然な語。
- source_word: ζῆλος
  choice: ねたみ
  rationale: 悪徳表の文脈における否定的な意味を採り、肯定的な「熱心」と区別した。
- source_word: θυμοί
  choice: 怒りの爆発
  rationale: 複数形が示唆する、繰り返される激しい怒りの噴出を明確に伝える。
- source_word: ἐριθεῖαι
  choice: 利己的な野心
  rationale: 党派心を伴う自己本位の出世欲・競争心を表すパウロ書簡の悪徳語として訳した。
- source_word: καταλαλιαί
  choice: 悪口
  rationale: 他者を公然と悪く言い、傷つける発言を指す広い語として選択した。
- source_word: ψιθυρισμοί
  choice: 陰口
  rationale: ひそかにささやかれる中傷やうわさ話を表し、直前の「悪口」と区別した。
- source_word: φυσιώσεις
  choice: 思い上がり
  rationale: 文字どおりの「膨れ上がること」から生じる高慢・尊大さを、明快な現代日本語で示す。
- source_word: ἀκαταστασίαι
  choice: 混乱
  rationale: 無秩序や騒乱を含み得る幅を保つ、簡潔で自然な訳語。
theological_decisions:
- issue: パウロが懸念する訪問の調子
  choice: 相互に望ましくない姿が明らかになることと、共同体内の悪徳への懸念として訳す。
  alternative: パウロが使徒的な厳しさを行使せざるを得ないことを明示する。
  rationale: 厳しい対応は文脈から推測できるが、この節自体は相互の失望と悪徳の列挙にとどまるため、原因や対応を訳文へ補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの重い懸念と悪徳表の畳みかける調子を保持した。前半の相互的な構文は「願うような者／願わないような者」で対応させた。
