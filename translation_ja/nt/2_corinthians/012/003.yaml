  text: καὶ οἶδα τὸν τοιοῦτον ἄνθρωπον— εἴτε ἐν σώματι εἴτε ⸀χωρὶς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/003.yaml
  text: And I know such a man—whether in the body or apart from the body I do not know[a]; God knows—
translation:
  language: ja
  text: また、私はそのような人を知っています。その人が身体の中にいたのか、それとも身体を離れていたのかは、私には分かりません[a]。神がご存じです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身体を離れて」は「身体の外で」とも訳せる。パウロは、この経験が身体を伴うものだったかどうかを明言していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα / οἶδεν
  choice: 知っています／分かりません／ご存じです
  rationale: 認識・知識を表す語として文脈に応じた自然な日本語を用い、同じ語の反復と、パウロの無知と神の知識との対照を保った。神については敬意を示す定着した表現「ご存じです」とした。
- source_word: τὸν τοιοῦτον ἄνθρωπον
  choice: このような人
  rationale: 直前に述べられた特定の人物を、その特徴に基づいて間接的に指す表現。日本語では性別を付加せずとも特定の人物を自然に指せ、パウロの間接的な自己言及も維持できる。
- source_word: εἴτε ... εἴτε
  choice: …のか、それとも…のか
  rationale: 二つの可能性を並置し、そのどちらかを話者が決定できない構文を自然な日本語で表した。
- source_word: ἐν σώματι
  choice: 体の内に
  rationale: χωρὶς τοῦ σώματοςとの空間的・概念的な対照を保ちつつ、身体を伴った経験だったかどうかを断定しない表現とした。
- source_word: χωρὶς τοῦ σώματος
  choice: 体を離れて
  rationale: χωρίςが示す身体との分離を明瞭に表しながら、経験の形而上学的性質を翻訳で確定しないようにした。
- source_word: ὁ θεὸς οἶδεν
  choice: 神がご存じです
  rationale: 主語の明示と、パウロの「分かりません」との強い対照を保った。
theological_decisions:
- issue: パウロの間接的な自己言及と経験のあり方
  choice: 「このような人」という三人称的表現を残し、経験が身体を伴ったか、体を離れたものだったかを未決のままにする。
  alternative: 人物をパウロだと本文中で明示する、または体外離脱の経験だったと断定する。
  rationale: ギリシア語は人物を間接的に指し、経験が「体の内」か「体を離れて」かを明確にしていないため、その修辞的距離と神学的緊張を保存した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての品位を保った。日本語では一文が過度に長くならないよう区切ったが、二つの可能性と、パウロの無知に対する神の知識という流れは維持した。
