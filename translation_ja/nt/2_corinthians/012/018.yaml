source:
  edition: SBLGNT
  text: παρεκάλεσα Τίτον καὶ συναπέστειλα τὸν ἀδελφόν· μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος; οὐ τῷ αὐτῷ πνεύματι περιεπατήσαμεν; οὐ τοῖς αὐτοῖς ἴχνεσιν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/018.yaml
  text: I urged Titus to go and sent the brother with him. Titus did not take advantage of you[a], did he? Did we not walk in the same spirit? Did we not walk in the same footsteps?
translation:
  language: ja
  text: 私はテトスに行くよう強く勧め、その兄弟をテトスと一緒に遣わしました。テトスがあなたがたを利用したことがあったでしょうか。私たちは同じ精神で[a]歩んだのではありませんか。同じ足跡をたどったのではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同じ霊によって」とも訳せる。ここで「霊」は、同じ精神や態度を指すとも、聖霊を指すとも考えられる。
    reason: πνεῦμα の指示対象と、与格が表すあり方・手段について解釈上の幅があるため。
lexical_decisions:
- source_word: παρεκάλεσα Τίτον
  choice: 私はテトスに行くよう強く勧め
  rationale: παρακαλέωは、この実務的な派遣の文脈では、テトスへの切実な依頼・勧めを表す。「行くよう」は日本語で目的を自然に示すため文脈から補った。
- source_word: συναπέστειλα τὸν ἀδελφόν
  choice: あの兄弟を彼と一緒に遣わしました
  rationale: 接頭辞 συν-を「一緒に」で表し、定冠詞付きの単数形ἀδελφόνは、読者に知られた人物を指すものとして「あの兄弟」とした。本文にない所有表現は加えていない。
- source_word: μήτι ἐπλεονέκτησεν ὑμᾶς Τίτος
  choice: テトスがあなたがたにつけ込んだことなど、あったでしょうか
  rationale: μήτιが否定の答えを予期する修辞疑問であることを「ことなど、あったでしょうか」で示した。πλεονεκτέωは他者を犠牲にして利を得る意味を持つため、金銭面に限定しすぎず「つけ込む」と訳した。
- source_word: τῷ αὐτῷ πνεύματι
  choice: 同じ霊で
  rationale: 与格が手段・あり方のいずれにも理解できる余地を保った。「霊」は、同じ精神・姿勢とも聖霊とも取り得るため、本文では解釈を一方に限定していない。
- source_word: περιεπατήσαμεν
  choice: 歩んだ
  rationale: 生き方や振る舞いを「歩く」と表すパウロの比喩を保ちつつ、現代日本語として自然な「歩む」を用いた。
- source_word: τοῖς αὐτοῖς ἴχνεσιν
  choice: 同じ足跡をたどった
  rationale: ἴχνοςの足跡・踏み跡という比喩を維持し、日本語の慣用的な表現にした。ギリシア語では動詞が省略されているが、日本語では自然さのため「たどった」を補った。
theological_decisions:
- issue: 「同じ霊」の指示対象
  choice: 「同じ霊」として、同じ精神・姿勢を主に響かせつつ曖昧さを保持する
  alternative: 「同じ御霊によって」とし、聖霊を明示する
  rationale: 直近の文脈はパウロとテトスの誠実さと行動の一致を扱うため、共有された精神・姿勢という理解が自然である。しかしπνεῦμαが聖霊を指す可能性も排除できない。日本語では大文字・小文字の区別がないため、「霊」という訳語と脚注によって両方の可能性を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的書簡にふさわしい落ち着いた丁寧体とした。「歩む」「足跡」という連続した比喩を保持し、修辞疑問が否定の答えを求める調子も自然な日本語で示した。
