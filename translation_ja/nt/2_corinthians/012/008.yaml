  text: ὑπὲρ τούτου τρὶς τὸν κύριον παρεκάλεσα ἵνα ἀποστῇ ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/008.yaml
  text: Concerning this[d][c][b][a], three times I pleaded with the Lord that it might depart from me.
translation:
  language: ja
  text: このことについて[a]、私は、それが私から去るように[d]、三度、主に[c]願い求めた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このことのために」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「懇願した」「訴え求めた」。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語本文は「主」とだけ述べ、ここでパウロはイエスという名を明記していない。
    reason: alternative_reading
  - marker: d
    text: 別訳「それが私から離れるように」「それが私から去って行くように」。ギリシア語では主語が明示されておらず、前節で述べられたものを指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ τούτου
  choice: このことについて
  rationale: ὑπέρ＋属格はここでは「～のために」ではなく、願いの対象となった事柄を示す。直前に述べた苦しみとのつながりを自然に保つ。
- source_word: τρὶς
  choice: 三度
  rationale: 三回の機会を表す副詞。簡潔で、現代日本語でも理解しやすい格調ある表現。
- source_word: τὸν κύριον
  choice: 主に
  rationale: 原文は「主」とだけ述べているため、イエスという名を訳文に補わず、そのまま保つ。
- source_word: παρεκάλεσα
  choice: 願い求めた
  rationale: 祈りの文脈における切実な要請を表しつつ、「懇願した」ほど感情の強さを限定しすぎない自然な表現。
- source_word: ἵνα
  choice: ～ように
  rationale: 願いの内容を導く接続表現として、日本語では「～ように」が自然である。
- source_word: ἀποστῇ
  choice: それが……離れ去る
  rationale: 動詞は「離れる、去る」の意。原文では主語が明示されず、前節の苦しみを受けるため、「それ」で曖昧さを保つ。
- source_word: ἀπ’ ἐμοῦ
  choice: 私から
  rationale: パウロ自身から離れるという分離を、簡潔かつ自然に表す。
theological_decisions:
- issue: 「主」の指示対象
  choice: 「主」とし、「主イエス」とは明記しない。
  alternative: 「主イエス」
  rationale: 文脈上イエスを指す可能性が高いが、ギリシア語本文は κύριον とだけ記す。本文以上の限定を加えない。
- issue: ἀποστῇ の暗黙の主語
  choice: 中性的な指示語「それ」を用いる。
  alternative: 「その使いが離れる」または「そのとげが取り去られる」
  rationale: 前節には「肉体のとげ」と「サタンの使い」の両方があり、原文は動詞の主語を明示しない。「それ」によって、どちらを直接指すかを決めずに原文の曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「三度」「主」など聖書本文にふさわしい簡潔で格調ある語調を保った。語順は日本語として自然になるよう整え、願いの内容を先に示した。
