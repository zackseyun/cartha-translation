reference: 2 Corinthians 12:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τῇ ὑπερβολῇ τῶν ἀποκαλύψεων. ⸀διὸ ἵνα μὴ ὑπεραίρωμαι, ἐδόθη μοι σκόλοψ τῇ σαρκί, ἄγγελος ⸀Σατανᾶ, ἵνα με κολαφίζῃ, ⸂ἵνα μὴ ὑπεραίρωμαι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/007.yaml
  text: And because of the surpassing greatness of the revelations—so that I might not exalt myself—a thorn in the flesh was given to me[a], a messenger of Satan, so that it might torment me[e][d][c][b], so that I might not exalt myself.
translation:
  language: ja
  text: また、数々の啓示があまりにも並外れたものであったため、私が思い上がらないように、肉体に一つのとげ[a]、すなわちサタンの使い[b]が与えられました。この使いが私を打ちたたく[c]ため、また私が思い上がらないようにするためです[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「とげ」は「鋭い杭」または「ささくれ」とも訳せます。ギリシア語のσκόλοψが指す正確な像は確定できません。
    reason: lexical_alternative
  - marker: b
    text: 「サタンの天使」とも訳せます。ギリシア語のἄγγελοςは「使い」と「天使」のどちらも意味します。
    reason: lexical_alternative
  - marker: c
    text: 「苦しめる」とも訳せます。この動詞は本来、拳で打つこと、また繰り返し打ちたたくことを表します。
    reason: lexical_alternative
  - marker: d
    text: 「私が思い上がらないように」という句はギリシア語本文に二度あり、訳文でもその反復を残しています。
    reason: textual_transparency
lexical_decisions:
- source_word: τῇ ὑπερβολῇ τῶν ἀποκαλύψεων
  choice: その啓示があまりにも並外れたものだったため
  rationale: 啓示の際立った大きさ・卓越性を表す句を、強意を保ちながら現代日本語として自然な原因表現にした。複数形は日本語では集合的な「啓示」で自然に表せる。
- source_word: ὑπεραίρωμαι
  choice: 私が思い上がらないように
  rationale: 自らを高くする、うぬぼれるという文脈上の意味を自然に表す。同じ句が原文で二度現れるため、訳文でも二度保持した。
- source_word: ἐδόθη μοι
  choice: 私に…が与えられました
  rationale: 受動態を維持し、与えた主体を神ともサタンとも明示しない。
- source_word: σκόλοψ τῇ σαρκί
  choice: 肉体に一つのとげ
  rationale: 鋭い杭、とげ、ささくれを指し得る比喩を「とげ」で保持し、苦難の具体的正体を特定しない。「肉体」はこの箇所の身体的・現世的な比喩を保つ。
- source_word: ἄγγελος Σατανᾶ
  choice: サタンの使い
  rationale: ἄγγελος は人間の使者にも天使的存在にも用い得るため、存在の種類を限定しない「使い」とした。
- source_word: κολαφίζῃ
  choice: 打ちたたき
  rationale: 拳で打つ、繰り返し打ちのめすという動詞の具体的な力を保つ。「苦しめる」より原語の像に近い。
theological_decisions:
- issue: 「肉体のとげ」の正体
  choice: 比喩のまま「肉体に一つのとげ」とする
  alternative: 病気、迫害者、悪霊の攻撃などに特定する
  rationale: 本文はその正体を明示していないため、身体的疾患、迫害、霊的攻撃などのいずれかに限定しない。
- issue: とげを与えた主体
  choice: 「与えられました」という受動表現を保持する
  alternative: 「神が与えた」または「許された」と明示する
  rationale: 神の主権的な許可が含意される可能性はあるが、原文は行為者を明記していない。
- issue: 「サタンの使い」の存在論的性格
  choice: 人間か霊的存在かを決めない「使い」
  alternative: 「サタンの天使」または人間の使者と特定する
  rationale: ἄγγελος の語義上の幅と、本文が残す曖昧さを維持する。
- issue: 目的句の反復
  choice: 「私が思い上がらないように」を二度訳す
  alternative: 日本語の重複を避けて一度にまとめる
  rationale: 原文の反復には強調と神学的緊張があり、省略せず保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡としての品位を保った。「すなわち」で「とげ」と「サタンの使い」の同格関係を示した。苦難の正体、使いの種類、受動態の行為者は原文どおり特定していない。
