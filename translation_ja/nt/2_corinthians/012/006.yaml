  to: たとえ私が誇ろうと思っても、私は愚か者にはならないでしょう。真実を語るからです。しかし、私は控えます。だれも、私について目にすることや、私から何かを聞くこと以上に、私を高く評価しないようにするためです。
  rationale: 原文の仮定的・将来的な構文を「愚か者にはならないでしょう」「真実を語るからです」で簡潔に反映した。「私を見て分かること」を「私について目にすること」に改め、見聞きされる事柄を超えた評価を避けるという比較の基準を保った。脚注は、ἀκούει τι の明示的な不定要素を説明しており、本文の「何か」と整合するため維持した。
