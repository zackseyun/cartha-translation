reference: 2 Corinthians 12:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν γὰρ θελήσω καυχήσασθαι, οὐκ ἔσομαι ἄφρων, ἀλήθειαν γὰρ ἐρῶ· φείδομαι δέ, μή τις εἰς ἐμὲ λογίσηται ὑπὲρ ὃ βλέπει με ἢ ἀκούει ⸀τι ἐξ ἐμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/006.yaml
  text: For if I should want to boast[a], I would not be foolish, for I would be speaking the truth. But I refrain, so that no one may reckon me above what he sees in me or hears from me.
translation:
  language: ja
  text: たとえ私が誇ろうと思っても、私は愚か者にはならないでしょう。真実を語るからです。しかし、私は控えます。だれも、私について目にすることや、私から何かを聞くこと以上に、私を高く評価しないようにするためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν ... θελήσω καυχήσασθαι
  choice: たとえ私が誇ろうと思っても
  rationale: ἐὰν＋アオリスト接続法の仮定的な条件を「たとえ…ても」で表し、θελήσωの意志とκαυχήσασθαιの「誇る」を自然な現代日本語にした。
- source_word: οὐκ ἔσομαι ἄφρων
  choice: 愚かではありません
  rationale: 未来形を条件節に対応する帰結として自然に表した。ἄφρωνを名詞的な「愚か者」ではなく述語形容詞の「愚か」とし、原文の表現を保った。
- source_word: ἀλήθειαν γὰρ ἐρῶ
  choice: 真実を語ることになるからです
  rationale: 条件が実現した場合の未来的帰結を「ことになる」で示し、ἀλήθειανの「真実」とἐρῶの発話行為を明示した。
- source_word: φείδομαι
  choice: 私は控えます
  rationale: 文脈上、さらに誇ることを差し控える意味であり、目的語を補いすぎず簡潔に訳した。
- source_word: μή τις εἰς ἐμὲ λογίσηται
  choice: だれも…私を高く評価しないようにするためです
  rationale: λογίζομαιの評価・見積もりの意味と、μήによる否定目的を自然な日本語で表した。
- source_word: ὑπὲρ ὃ βλέπει με
  choice: 私を見て分かること…以上に
  rationale: ὑπέρが示す基準超過を「以上に」とし、直訳では不自然な「私を見るもの」を、観察に基づく評価という意味が伝わる形にした。
- source_word: ἢ ἀκούει τι ἐξ ἐμοῦ
  choice: 私から何かを聞くこと
  rationale: ἐξ ἐμοῦを「私から」、明示された不定代名詞τιを「何か」と訳し、原文の不定要素を本文に残した。
theological_decisions:
- issue: パウロの誇りと、それを控える姿勢
  choice: 誇るなら真実を語ることになり、愚かではないが、それでも他者の過大評価を避けるために控える、という緊張をそのまま表した。
  alternative: パウロには誇る正当な権利があると強調する、または誇ること自体を偽り・罪とみなす。
  rationale: 原文は、仮定上の誇りが真実であることと、実際にはそれを差し控えることを併記している。どちらか一方に教理的に寄せず、両者を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの抑制された論調にふさわしい端正さを保った。「誇る」「真実」「高く評価する」など、文脈上の主要語を平易かつ厳密に表現した。
