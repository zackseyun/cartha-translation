  terminology: 「誇る」「真実」「控える」「高く評価する」は現代標準日本語として適切です。「愚かではありません」より「愚か者にはならないでしょう」とすることで、ἄφρωνの人を指す述語性と条件文の将来の帰結を自然に表せます。
  issues:
