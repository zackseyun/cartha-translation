  - severity: low
    issue: 脚注bが「神だけが」と限定を加えている
    rationale: ὁ θεὸς οἶδενは「神が知っている」であり、「だけが」は本文に明示されていません。本文の留保を説明する脚注でも、その限定は加えないほうがよいです。
