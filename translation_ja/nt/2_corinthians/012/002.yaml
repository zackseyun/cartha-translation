  naturalness: 「肉体を離れてであったのか」は助詞・助動詞の重なりにより不自然です。「肉体を離れていたのか」とすれば、対句と不確定性を自然に保てます。原文の挿入的な留保に近い順序に整えることで、何が不明なのかも明瞭になります。
  terminology: 「メシアにある」はἐν Χριστῷの称号性と、説明し尽くせない結合表現を保つ訳として許容できます。「第三の天」も保持されています。脚注bの「神だけが」は原文の明示語ではないため、「神がご存じです」とするのがより厳密です。
