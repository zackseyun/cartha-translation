id: 2CO.12.2
reference: 2 Corinthians 12:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἶδα ἄνθρωπον ἐν Χριστῷ πρὸ ἐτῶν δεκατεσσάρων— εἴτε ἐν σώματι οὐκ οἶδα, εἴτε ἐκτὸς τοῦ σώματος οὐκ οἶδα, ὁ θεὸς οἶδεν— ἁρπαγέντα τὸν τοιοῦτον ἕως τρίτου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/002.yaml
  text: I know a man in Messiah who[a], fourteen years ago—whether in the body I do not know, or outside the body I do not know[c][b], God knows—was caught up to the third heaven.
translation:
  language: ja
  text: 私は、メシアにある一人の人を知っています。十四年前のことです。肉体のままであったのか、肉体を離れていたのか、私には分かりません。神がご存じです。その人は第三の天にまで引き上げられました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「第三の天」は古代ユダヤ世界の宇宙観に属する表現です。ここでは原文どおりの言い方を残しています。
    reason: cultural_note
  - marker: b
    text: パウロは、この体験が肉体を伴うものだったのか、肉体を離れたものだったのかを明らかにせず、その点については神がご存じだとしています。
    reason: theological_ambiguity
lexical_decisions:
- source_word: οἶδα
  choice: 知っています
  rationale: 完了形ながらコイネー・ギリシア語では現在の意味を持つため、自然な現在形とした。
- source_word: ἄνθρωπον
  choice: 一人の人
  rationale: 特定の男性を指す文脈だが、日本語では「人」が性別を排除せず自然であり、後続の指示も明瞭になる。
- source_word: ἐν Χριστῷ
  choice: メシアにある
  rationale: Χριστόςの称号としての意味を「メシア」で示し、ἐνの結合・所属を表すパウロ特有の表現を過度に説明せず保った。
- source_word: πρὸ ἐτῶν δεκατεσσάρων
  choice: 十四年前
  rationale: 日本語で自然な時間表現。
- source_word: εἴτε ἐν σώματι
  choice: 肉体のままであったのか
  rationale: 身体を伴った経験かどうかという対比を明瞭にしつつ、断定を避けた。
- source_word: εἴτε ἐκτὸς τοῦ σώματος
  choice: 肉体を離れてであったのか
  rationale: 「肉体の外で」の直訳調を避けながら、非身体的だった可能性を本文どおり未確定のまま示す。
- source_word: ὁ θεὸς οἶδεν
  choice: 神がご存じです
  rationale: 「神だけが」とは補わず、原文の簡潔な断言を敬意ある自然な日本語で表した。
- source_word: ἁρπαγέντα
  choice: 引き上げられました
  rationale: アオリスト受動分詞を日本語では定動詞として処理し、上方への突然の移送という文脈に即した。
- source_word: τὸν τοιοῦτον
  choice: その人
  rationale: 字義的な「そのような人」よりも、先行する人物を受ける日本語として自然で明瞭。
- source_word: ἕως τρίτου οὐρανοῦ
  choice: 第三の天にまで
  rationale: ἕωςの到達範囲を「まで」で表し、古代の宇宙観に属する表現そのものは解釈せず保持した。
theological_decisions:
- issue: ἐν Χριστῷの訳し方
  choice: メシアにある
  alternative: キリストにある
  rationale: Χριστόςの称号性を明示しつつ、パウロの結合・所属の表現を保つため。
- issue: 体験が身体的であったかどうか
  choice: 二つの可能性とパウロの無知を明記する
  alternative: 身体的昇天、または非身体的幻視のいずれかに確定する
  rationale: 原文は「分からない」を反復し、知識を神に帰しているため、体験の様態を決着させない。
- issue: 「第三の天」の意味
  choice: 本文では第三の天と訳す
  alternative: 最高の天、または楽園と説明的に訳す
  rationale: 古代ユダヤ的宇宙観との関連はあり得るが、本文の数詞表現を別概念に置き換えず保持する。
translation_notes:
  register: 現代の一般読者に分かる、丁寧で格調を保った文体。「知っている」より「知っています」、「ご存じです」を用いて全体の敬体を統一した。長い挿入句は日本語の可読性のため文を分けたが、出来事の時期、引き上げ、体験様態の不確定性という論理関係は保持した。
