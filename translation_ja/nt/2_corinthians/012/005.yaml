  text: ὑπὲρ τοῦ τοιούτου καυχήσομαι, ὑπὲρ δὲ ἐμαυτοῦ οὐ καυχήσομαι εἰ μὴ ἐν ταῖς ⸀ἀσθενείαις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/005.yaml
  text: On behalf of such a one I will boast[a], but on behalf of myself I will not boast[b], except in my weaknesses.
translation:
  language: ja
  text: このような人については、私は誇ります[a]。しかし、自分自身については、弱さの中でしか誇りません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このような人のためには」。ギリシア語の前置詞は「～について」「～のために」のいずれにも訳し得ます。ここでは、パウロが自分から距離を置くような言い方を保っています。
    reason: lexical_alternative
  - marker: b
    text: 直訳「弱さの中でなければ」。ここでいう「弱さ」には、人間のもろさ、苦難、無力な状態などが含まれ得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ τοῦ τοιούτου
  choice: このような人については
  rationale: ὑπέρ＋属格の「～に関して」という意味を自然な現代日本語で表しつつ、τοῦ τοιούτουが生む、パウロ自身から距離を置いた間接的な言い方を保った。
- source_word: καυχήσομαι / οὐ καυχήσομαι
  choice: 私は誇ります／誇りません
  rationale: καυχάομαιの中心的な意味を明瞭に表し、肯定と否定の対照、および未来形の形を保った。
- source_word: ἐμαυτοῦ
  choice: 自分自身については
  rationale: 再帰代名詞による強い対照を「自分自身」で明示し、前半と同じくὑπέρの関係を「について」で表した。
- source_word: εἰ μὴ
  choice: ～以外には
  rationale: ここでは条件ではなく例外を示す慣用表現なので、日本語として自然な限定表現を用いた。
- source_word: ἐν ταῖς ἀσθενείαις
  choice: 弱さ
  rationale: ἀσθένειαが含み得る人間的なもろさ、苦難、無力さを狭く限定せず、「弱さ」で簡潔に表した。ギリシア語に所有代名詞はないため、本文では「私の」を補わなかった。
theological_decisions:
- issue: 「このような人」とパウロ自身との関係
  choice: 「このような人」という修辞的な距離をそのまま保つ
  alternative: 文字どおりパウロとは別人だと明示する、またはパウロ本人だと明示する
  rationale: 文脈上の自伝的含意はあり得るが、この節そのものは間接表現を用いているため、その緊張を訳文で解消しない。
- issue: 許される誇りの対象
  choice: 自分自身について誇ることを否定し、弱さだけを例外とする
  alternative: 個人的な意味を弱め、弱さを誇るという一般的な神学命題として訳す
  rationale: ἐμαυτοῦとの対照と複数形ἀσθενείαιςを保ち、パウロ自身の弱さへの言及を一般論へ解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半と後半の「については」を対応させて修辞的対照を示し、原文にない所有表現は本文に加えなかった。
