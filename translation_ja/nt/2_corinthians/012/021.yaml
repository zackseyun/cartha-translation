id: 2CO.12.21
reference: 2 Corinthians 12:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ πάλιν ⸂ἐλθόντος μου⸃ ⸀ταπεινώσῃ ⸀με ὁ θεός μου πρὸς ὑμᾶς, καὶ πενθήσω πολλοὺς τῶν προημαρτηκότων καὶ μὴ μετανοησάντων ἐπὶ τῇ ἀκαθαρσίᾳ καὶ πορνείᾳ καὶ ἀσελγείᾳ ᾗ ἔπραξαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/021.yaml
  text: I fear that when I come again[a], my God may humble me before you[d][c][b], and I will mourn over many who have sinned before and have not repented of the impurity and sexual immorality and sensuality that they practiced.
translation:
  language: ja
  text: 私が再び皆さんのもとへ行くとき、私の神が皆さんの前で私を低くされるのではないか[a]、また、以前に罪を犯した人々の多くが[b]、自分たちの行った汚れと性的不道徳と放縦[c]を悔い改めていないことで、私が嘆き悲しむことになるのではないかと、心配しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私を辱められるのではないか」とも訳せます。原語には「低くする」「へりくだらせる」「辱める」という意味の幅があります。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「以前に罪を犯した人々のうち、多くの人」。原語の完了形は、以前の罪が現在にも関わっていることを示唆します。
    reason: source_nuance
  - marker: c
    text: 「放縦」は、恥を顧みない無節制な振る舞いを指します。「好色」または「みだらな行い」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πάλιν ἐλθόντος μου
  choice: 再びそちらへ行くとき……ではないかと、心配しています
  rationale: μήは前節のφοβοῦμαι（「心配している」）に続く内容を導く。日本語では前節に依存しすぎないよう恐れの表現を文末に補い、属格絶対を自然な時の節として訳した。
- source_word: ταπεινώσῃ με ὁ θεός μου πρὸς ὑμᾶς
  choice: 私の神が皆さんの前で私を低くされる
  rationale: ταπεινόωの「低くする、へりくだらせる」という幅を保ち、πρὸς ὑμᾶςは訪問先で彼らを前にして起こることとして表した。
- source_word: πενθήσω
  choice: 私が嘆き悲しむことになる
  rationale: πενθέωの、単なる落胆より重い悲嘆や哀悼の響きを表す。μήに支配される懸念の第二の内容として訳した。
- source_word: πολλοὺς τῶν προημαρτηκότων
  choice: 以前から罪を犯してきた人々のうち……多くの人
  rationale: 部分属格を「人々のうち……多くの人」と明示し、完了分詞が示す過去の罪と現在への継続的な関わりを「犯してきた」で表した。
- source_word: μὴ μετανοησάντων
  choice: 悔い改めていない
  rationale: 訪問時にも悔い改めが見られないという現在的な結果を、自然な日本語で示す。
- source_word: ἀκαθαρσίᾳ
  choice: 汚れ
  rationale: 儀礼的意味に限定せず、ここでの道徳的・性的な不浄を含みうる広い語として訳した。
- source_word: πορνείᾳ
  choice: 性的不道徳
  rationale: πορνείαを特定の一行為に狭めず、不正な性的行為を広く指す現代的な表現とした。
- source_word: ἀσελγείᾳ
  choice: 放縦
  rationale: 恥を顧みない無節制な振る舞いを表し、前の二語と重なりつつも区別される語を選んだ。
- source_word: ᾗ ἔπραξαν
  choice: 自分たちが行った
  rationale: 関係代名詞を三つの悪徳にまとめて係るものと捉え、継続的実践に限定しすぎない簡潔な表現とした。
theological_decisions:
- issue: μήで導かれる節と前節の「心配している」との関係
  choice: 二つの懸念をまとめ、文末に「心配しています」を補う
  alternative: 「どうか……ということがありませんように」と願いの文として訳す
  rationale: μήはここで独立した祈願ではなく、12:20のφοβοῦμαιに続く恐れの内容を導く。補足は統語上必要な明示であり、神学的な意味を追加するものではない。
- issue: 神がパウロをταπεινόωすることの意味
  choice: 「低くされる」として、へりくだらせることと面目を失わせることの両方を含みうる表現にする
  alternative: 「辱められる」として公の屈辱を前面に出す
  rationale: 文脈上はコリントの人々の前での屈辱も考えられるが、語そのものはより広く「低くする」を意味するため、一義的に限定しない。
- issue: 三つの悪徳語の関係
  choice: 「汚れと性的不道徳と放縦」と三語を区別して並べる
  alternative: まとめて「みだらな行い」とする
  rationale: 互いに意味が重なるものの、原文は三つの名詞を累加しており、それぞれの広がりと修辞的な重みを保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの深刻な懸念にふさわしい格調を保った。「そちらへ」で訪問の方向を自然に示し、「嘆き悲しむ」でπενθέωの強さを表した。原文が前節に統語的に依存するため、「心配しています」を明示して単独でも理解できる文にした。
