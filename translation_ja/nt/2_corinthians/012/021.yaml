  - severity: low
    issue: 部分属格を表す箇所の語順が不自然
    rationale: 「人々のうち、自分たちが……多くの人」は修飾関係の把握に負担がある。「以前に罪を犯した人々の多くが」とすれば、πολλοὺς τῶν προημαρτηκότωνを自然かつ正確に表せます。
