  to: 私が再び皆さんのもとへ行くとき、私の神が皆さんの前で私を低くされるのではないか[a]、また、以前に罪を犯した人々の多くが[b]、自分たちの行った汚れと性的不道徳と放縦[c]を悔い改めていないことで、私が嘆き悲しむことになるのではないかと、心配しています。
