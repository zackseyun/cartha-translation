  to: 私は、あなたがたの魂[a]のために、この上なく喜んで自分の持てるものを費やし、私自身も使い尽くされましょう。私があなたがたをいっそう愛するなら、私はそれだけ少なく愛されるのでしょうか。
  rationale: 修正は、原文にない「深く」という含意と、現在形を将来の変化として表す「なくなる」を除き、比較と修辞疑問の緊張を保つためである。また、ὑπέρの受益用法を「ために」で直接表した。前半の支出の比喩は、「持てるもの」と「私自身」の対照によって自然な日本語で保持した。
