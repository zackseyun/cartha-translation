reference: 2 Corinthians 12:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἥδιστα δαπανήσω καὶ ἐκδαπανηθήσομαι ὑπὲρ τῶν ψυχῶν ὑμῶν. ⸀εἰ περισσοτέρως ὑμᾶς ⸀ἀγαπῶν, ἧσσον ἀγαπῶμαι;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/015.yaml
  text: But I will most gladly spend and be spent for your souls. If I love you more abundantly[a], am I loved less?
translation:
  language: ja
  text: 私は、あなたがたの魂[a]のために、この上なく喜んで自分の持てるものを費やし、私自身も使い尽くされましょう。私があなたがたをいっそう愛するなら、私はそれだけ少なく愛されるのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「魂」は「命」または「あなたがた自身」とも訳せる。
    reason: ψυχήには文脈に応じて、魂、命、または人そのものを指す語義があるため。
lexical_decisions:
- source_word: ἥδιστα
  choice: この上なく喜んで
  rationale: 最上級の副詞が表す、単なる承諾ではないパウロの強い喜びと進んで行う意志を、自然な現代日本語で示す。
- source_word: δαπανήσω
  choice: 財を費やし
  rationale: 資力を支出する比喩を保ち、続くἐκδαπανηθήσομαιとの対比が分かるようにした。目的語の「財」は日本語として比喩を明瞭にするための最小限の補足である。
- source_word: ἐκδαπανηθήσομαι
  choice: 私自身も使い尽くされましょう
  rationale: 前の「費やす」を強める受動形を保ち、持てるものだけでなくパウロ自身まで献げ尽くすという表現を伝える。
- source_word: ὑπὲρ
  choice: のためなら
  rationale: 受益・献身の対象を示す。「なら」は後続する強い意志と自然につながるが、条件節を新たに作る意図ではない。
- source_word: τῶν ψυχῶν ὑμῶν
  choice: あなたがたの魂
  rationale: ψυχήの語形と人格的・霊的な重みを保持する一方、「命」「あなたがた自身」という文脈上可能な意味は脚注に示した。
- source_word: εἰ
  choice: なら
  rationale: 修辞的な条件を断定や譲歩に読み替えず、ギリシア語の条件表現を保つ。
- source_word: περισσοτέρως
  choice: いっそう深く
  rationale: 比較級が示す愛の増し加わる程度を、硬い「より多く」ではなく自然かつ品位ある日本語で表す。
- source_word: ἀγαπῶν
  choice: 私があなたがたを…愛する
  rationale: 分詞を日本語の条件節に組み込み、主語と目的語を明瞭にした。
- source_word: ἧσσον
  choice: それだけ…なくなる
  rationale: 直前の「いっそう」と対照を成す減少の意味を、日本語の修辞疑問として自然に表した。
- source_word: ἀγαπῶμαι
  choice: 私は…愛されなくなる
  rationale: 受動態を保持し、パウロが注ぐ愛と彼が受ける愛との痛切な対比を伝える。文脈上の傾向を自然に示すため「なる」を用いた。
theological_decisions:
- issue: 牧会的文脈におけるψυχήの訳語
  choice: あなたがたの魂
  alternative: あなたがたの命／あなたがた自身
  rationale: 「魂」は原語の人格的・霊的な重みを保つ。ただし、ここで身体と分離した存在についての特定の人間論を断定しないよう、より包括的な意味の可能性を脚注で明示する。
- issue: 後半の条件文の修辞的力
  choice: 私が…愛するなら、私は…愛されなくなるのでしょうか
  alternative: 私が…愛しているのに、かえって…愛されないのでしょうか
  rationale: εἰを譲歩の「のに」や理由の「だから」と断定せず、条件文の形と神学的・感情的な緊張を残す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロの献身を表す支出の比喩と、後半の痛切な修辞疑問を保持した。「使い尽くされましょう」は日常語よりやや格調があるが、原文の受動態と自己消尽の強意を伝えるために採用した。
