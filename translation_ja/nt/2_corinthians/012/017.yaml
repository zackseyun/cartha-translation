  text: Did I exploit you through any of those whom I sent to you?[a]
translation:
  language: ja
  text: 私があなたがたのもとに遣わした人たちのだれかを通して、あなたがたから不当な利益を得たことがあったでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたにつけ込んだ」「あなたがたから不当に利益を得た」。このギリシア語の動詞には、他者を犠牲にして利益を得るという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μή
  choice: ～ことがあったでしょうか
  rationale: 否定の答えを予期する修辞疑問を、自然な日本語の問いとして表した。文脈上、「なかった」との答えが想定される。
- source_word: τινα ὧν
  choice: 遣わした人たちのうち、だれか
  rationale: 派遣された一群の中のいずれか一人、という部分集合の意味を明確に保つ。
- source_word: ἀπέσταλκα πρὸς ὑμᾶς
  choice: あなたがたのもとに遣わした
  rationale: 完了形は、これまでに派遣した人々を指す文脈に即して自然に表現し、πρός の方向性を「もとに」で示した。
- source_word: δι’ αὐτοῦ
  choice: だれかを通して
  rationale: ギリシア語は単数の「その人を通して」だが、先行する不定表現と結びつく配分的な意味を、日本語で不自然にならないよう示した。
- source_word: ἐπλεονέκτησα
  choice: 不当な利益を得た
  rationale: 他者を犠牲にして利得を得るという語義を明示する。単なる「利益を得た」より不正・搾取の含意を保ちつつ、金銭面だけに限定しすぎない。
- source_word: ὑμᾶς
  choice: あなたがたから
  rationale: 原文では直接目的語だが、日本語では「不当な利益を得る」と組み合わせて、被害を受ける相手を自然に「から」で表した。
theological_decisions: []
translation_notes:
  register: 現代標準語による、明瞭で品位ある修辞疑問。パウロが代理人を利用して利得を得た可能性を否定する文脈を保ち、「搾取した」と断定的・専門的にしすぎず、原語の利得の含意を本文と脚注で示した。
