  terminology: 「しるし」「不思議」「力あるわざ」は、σημεῖα・τέρατα・δυνάμειςの区別を保つ適切な組合せです。「力あるわざ」はδυνάμειςを単なる「奇跡」に還元せず、力の現れという含意を残しています。特定の教派的解釈や、使徒職に関する過度に限定的な説明は加えられていません。
