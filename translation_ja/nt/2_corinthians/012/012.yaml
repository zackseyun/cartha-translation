  source_fidelity: ギリシア語の語順と意味関係を適切に保っています。「使徒であることのしるし」はτοῦ ἀποστόλουの質的・一般的な含意を自然に表し、κατειργάσθηの受動態も「成し遂げられました」によって行為者を補わずに再現しています。ἐν ὑμῖνを「あなたがたの間で」とする点、また忍耐と「しるしと不思議と力あるわざ」の三項をともに使徒性の証拠として提示する構造も原文に忠実です。
