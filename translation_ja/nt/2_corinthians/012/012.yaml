id: 2CO.12.12
reference: 2 Corinthians 12:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰ μὲν σημεῖα τοῦ ἀποστόλου κατειργάσθη ἐν ὑμῖν ἐν πάσῃ ⸀ὑπομονῇ, σημείοις ⸀τε καὶ τέρασιν καὶ δυνάμεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/012.yaml
  text: Indeed[a], the signs of an apostle were performed among you with all perseverance[b], with signs and wonders and powers.
translation:
  language: ja
  text: 使徒であることのしるしは、確かに、あらゆる忍耐をもって、しるしと不思議と力あるわざによって、あなたがたの間で成し遂げられました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ μὲν σημεῖα
  choice: しるしは、確かに
  rationale: μένには、ここでは対応するδέが明示されず、主張を肯定・強調する働きがある。「確かに」を添えてその力を自然な日本語で表し、σημεῖαは「しるし」とした。
- source_word: τοῦ ἀποστόλου
  choice: 使徒であることの
  rationale: 属格を、特定の「その使徒」だけでなく、使徒としての資格・身分を示す特徴という質的・一般的な意味に取った。「使徒の」より意味が伝わりやすい。
- source_word: κατειργάσθη
  choice: 成し遂げられました
  rationale: アオリスト受動形の、実際に実現・遂行されたという結果的な響きを保ちつつ、行為者を明示しない。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: コリントの共同体のただ中で行われたことを指すため、内面的な「あなたがたの内に」ではなく共同体的な意味を採った。
- source_word: ἐν πάσῃ ὑπομονῇ
  choice: あらゆる忍耐をもって
  rationale: ὑπομονήは困難のもとで揺るがず耐え続けることを表す。「忍耐」は簡潔で自然であり、πάσῃの強意も「あらゆる」で保持した。
- source_word: σημείοις τε καὶ τέρασιν καὶ δυνάμεσιν
  choice: しるしと不思議と力あるわざによって
  rationale: 三つの語の区別を保ち、δυνάμειςは単に「奇跡」とせず、力の現れを示す「力あるわざ」とした。ἐνはここでは、使徒性のしるしが現れた具体的な手段・様態として「によって」と訳した。
theological_decisions:
- issue: 「使徒であることのしるし」の範囲
  choice: 使徒としての働きを証しする特徴を指し、忍耐と奇跡的な現象の双方を含み得る表現として訳す。
  alternative: 奇跡だけを使徒職の決定的なしるしとする。
  rationale: 文の中心は「使徒であることのしるし」であり、それが「忍耐をもって」という状況と、「しるしと不思議と力あるわざ」という具体的な現れによって展開される。訳文ではその関係を保ち、教理的な固定一覧を付加しない。
- issue: 受動形における行為者
  choice: 行為者を明示せず「成し遂げられました」とする。
  alternative: 「神が成し遂げられました」または「私が行いました」と補う。
  rationale: 文脈上の含意はあり得るが、ギリシア語本文は行為者を明記していないため、訳文でも曖昧さを保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的権威について述べる文にふさわしい端正さを保った。「しるし」の反復は原文の語彙的・修辞的な結び付きを示すため維持した。
