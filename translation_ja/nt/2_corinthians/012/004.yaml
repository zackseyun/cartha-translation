id: 2CO.12.4
reference: 2 Corinthians 12:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἡρπάγη εἰς τὸν παράδεισον καὶ ἤκουσεν ἄρρητα ῥήματα ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/004.yaml
  text: that he was caught up into paradise and heard inexpressible words, which a man is not permitted to speak.
translation:
  language: ja
  text: その人は楽園へと引き上げられ、人が口にすることを許されていない、言い表せない言葉を聞いたのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡρπάγη
  choice: 引き上げられ
  rationale: 受動形と、本人の力によらず突然移されたという語感を保つ。「連れ去られ」よりも、この文脈で自然かつ尊厳ある表現。
- source_word: παράδεισον
  choice: 楽園
  rationale: 新約聖書で定着している対応語であり、場所の詳細を本文以上に限定しない。
- source_word: ἄρρητα ῥήματα
  choice: 言い表せない言葉
  rationale: ἄρρητα が持ちうる「言語化できない／口外できない」という幅を残しつつ、後続の禁止表現との重複を避ける。ῥήματα はここでは聞かれた発言・言葉を指す。
- source_word: οὐκ ἐξὸν
  choice: 許されていない
  rationale: 能力的不可能ではなく、許可・適法性の欠如を表す非人称表現として訳す。
- source_word: ἀνθρώπῳ
  choice: 人が
  rationale: 特定の男性ではなく人間一般を表すため、現代日本語では包括的な「人」が適切。
- source_word: λαλῆσαι
  choice: 口にする
  rationale: ここでは聞いた言葉を発話することを指す。「語る」よりも、口外してはならない含意を自然に伝える。
theological_decisions:
- issue: 「言い表せない言葉」が本質的に表現不可能なのか、口外を禁じられたものなのか
  choice: 前半を「言い表せない」、後半を「口にすることを許されていない」と訳し、両方の要素を保持する。
  alternative: 「口外できない言葉」「語ってはならない言葉」
  rationale: ἄρρητα には意味の幅がある一方、関係節 ἃ οὐκ ἐξὸν ἀνθρώπῳ λαλῆσαι は許可されていないことを明示する。どちらか一方へ還元しない。
- issue: 楽園と第三の天との関係
  choice: 単に「楽園」とし、両者の関係を説明しない。
  alternative: 「天の楽園」などと補足する。
  rationale: 本文は παράδεισος とだけ述べており、前節との同一性や位置関係を訳文で確定すべきではない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、受動表現と神秘的な内容の荘重さを保った。「その人」は前節から続く三人称の指示を明確にする。脚注を必要とするほど本文理解を左右す異読はない。
