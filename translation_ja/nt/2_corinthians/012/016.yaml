  text: ἔστω δέ, ἐγὼ οὐ κατεβάρησα ὑμᾶς· ἀλλὰ ὑπάρχων πανοῦργος δόλῳ ὑμᾶς ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/016.yaml
  text: 'But let it be so: I did not burden you[a]. Yet, being crafty[c][b], I took you by deceit.'
translation:
  language: ja
  text: だが、そういうことにしておこう。私はあなたがたに負担をかけなかった。[a] しかし、私は悪賢く、策略を用いてあなたがたを取り込んだ、ということになる。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「まあ、そういうことにしておこう」。パウロは議論のために相手の言い分をいったん認めているようである。
    reason: lexical_alternative
  - marker: b
    text: 「私は悪賢く、策略を用いてあなたがたを取り込んだ」は、パウロ自身の告白ではなく、彼に向けられた非難を皮肉に言い直したものと思われる。
    reason: alternative_reading
  - marker: c
    text: 別訳「私は悪賢く、だましてあなたがたを取り込んだ」または「策略を用いてあなたがたを利用した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστω δέ
  choice: だが、そうだとしても
  rationale: 譲歩を表す修辞的な命令形として理解し、直前の点を議論のために認める働きを自然な現代日本語で示した。
- source_word: κατεβάρησα
  choice: 負担をかけなかった
  rationale: この文脈では、とりわけ物質的・金銭的な重荷を負わせることを指すが、原文の比喩と意味の広さを保った。
- source_word: ὑπάρχων
  choice: 私は…悪賢く
  rationale: 分詞の付帯的な関係を簡潔に表し、理由・譲歩などの意味を明示しすぎないようにした。
- source_word: πανοῦργος
  choice: 悪賢く
  rationale: ここでの非難めいた、倫理的に否定的な『抜け目のなさ』を明確かつ自然に表した。
- source_word: δόλῳ
  choice: 策略によって
  rationale: 手段を表す与格として訳し、欺きを伴うたくらみという非難の調子を保った。
- source_word: ἔλαβον
  choice: 捕らえた
  rationale: 単なる『取った』より文脈に即し、策略で相手を手中に収める含意を示しつつ、『だまし取った』ほど解釈を限定しない表現とした。
theological_decisions:
- issue: ἀλλὰ以下がパウロ自身の告白か、彼に対する非難の皮肉な言い換えか
  choice: 本文は『私は悪賢く、策略によってあなたがたを捕らえた、というわけだ』とし、非難を反響させる修辞である可能性を示す
  alternative: 『しかし、悪賢い私は、策略を用いてあなたがたをだました』と直接的な自己告白として訳す
  rationale: 周辺文脈ではパウロは搾取を否定しており、ここは反対者の非難を皮肉に取り上げた可能性が高い。一方、その解釈を本文だけで断定せず、原文の緊張を残した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。前半の譲歩と後半の皮肉な非難の反響が読者に伝わるよう、『というわけだ』を用いたが、脚注で修辞的解釈であることを明示した。
