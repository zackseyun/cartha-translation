id: 2CO.12.9
reference: 2 Corinthians 12:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἴρηκέν μοι· Ἀρκεῖ σοι ἡ χάρις μου· ἡ γὰρ ⸀δύναμις ἐν ἀσθενείᾳ ⸀τελεῖται. ἥδιστα οὖν μᾶλλον καυχήσομαι ἐν ταῖς ἀσθενείαις ⸀μου, ἵνα ἐπισκηνώσῃ ἐπ’ ἐμὲ ἡ δύναμις τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/009.yaml
  text: And he has said to me[a], “My grace is sufficient for you, for my power is made perfect in weakness.” Therefore I will boast all the more gladly in my weaknesses[d][c][b], so that the power of Messiah may dwell upon me.
translation:
  language: ja
  text: そして、主は私にこう言われた。「わたしの恵みは、あなたに十分である。力[a]は弱さの中で完成されるからだ。」だから私は、メシア[c]の力が私の上に宿る[b]ように、私の弱さの数々を、むしろますます喜んで誇ろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は「わたしの力」とする。
    reason: textual_variant
  - marker: b
    text: 「私の上にとどまる」とも訳せる。より直訳的には、「私の上に天幕を張る」。
    reason: lexical_alternative
  - marker: c
    text: 伝統的には「キリスト」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: εἴρηκέν
  choice: こう言われた
  rationale: 完了形は過去の発言が今も効力を持つことを示すが、日本語では単純過去が最も自然であり、引用内容そのものが継続的な意義を伝える。「その方」は前文脈の話者を受け、本文にない固有の主語を補わないための表現。
- source_word: Ἀρκεῖ
  choice: 十分である
  rationale: 恵みが必要を満たすという充足性を、明瞭で格調を保った現代日本語で表す。
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡における神の無償の恩恵と働きを含む定着した訳語であり、単なる好意に狭めない。
- source_word: δύναμις
  choice: 力
  rationale: 節内の反復を保ち、神的な力とメシアの力との主題的な結びつきを明確にする。
- source_word: ἀσθενείᾳ / ἀσθενείαις
  choice: 弱さ／自分の弱さ
  rationale: 単数の一般原理と複数の具体的経験の違いを文脈上保つ。日本語では後者を不自然な「弱さの数々」とせず「自分の弱さ」とした。
- source_word: τελεῖται
  choice: 完成される
  rationale: τελέωの受動形が示す、目的・完成に至らされる意味を保つ。より説明的な「十分に現れる」とせず、原文の神学的緊張も残す。
- source_word: ἥδιστα…μᾶλλον
  choice: むしろ大いに喜んで
  rationale: 二つの副詞が表す、先の願いとの対照と強い喜びを、重複感のない自然な日本語にまとめる。
- source_word: καυχήσομαι
  choice: 誇ろう
  rationale: 未来形に含まれるパウロの意志的な応答を表し、弱さを誇るという逆説を保つ。
- source_word: ἐπισκηνώσῃ ἐπ’ ἐμέ
  choice: 私の上に宿る
  rationale: 天幕を張って覆うように住むという語像を、読みやすさを保ちながら可能な限り残す。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは称号として理解できるため「メシア」とし、伝統的な音訳「キリスト」は脚注に示す。
theological_decisions:
- issue: δύναμιςに所有代名詞を補うか
  choice: 力
  alternative: わたしの力
  rationale: 提示されたSBLGNT本文にはδύναμιςを修飾するμουがないため、本文には「わたしの」を補わない。一方、異読および文脈上可能な理解は脚注に示す。
- issue: τελεῖταιと神の力の関係
  choice: 弱さの中で完成される
  alternative: 弱さの中で完全に現れる
  rationale: 神の力に本来欠陥があると断定することも、説明的な訳で緊張を消すことも避け、原文の完成・成就の表現を保つ。
- issue: Χριστοῦの称号性
  choice: メシア
  alternative: キリスト
  rationale: 称号としての意味を前面に出しつつ、日本語で定着した別訳を脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用内の神の発言には慣用に従って「わたし」、語り手パウロには「私」を用いた。「完成される」はやや格調のある表現だが、原文の受動態と神学的緊張を保持するため採用した。
