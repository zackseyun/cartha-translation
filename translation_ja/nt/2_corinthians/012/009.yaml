  to: そして、主は私にこう言われた。「わたしの恵みは、あなたに十分である。力[a]は弱さの中で完成されるからだ。」だから私は、メシア[c]の力が私の上に宿る[b]ように、私の弱さの数々を、むしろますます喜んで誇ろう。
