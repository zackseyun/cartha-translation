  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Γέγονα ⸀ἄφρων· ὑμεῖς με ἠναγκάσατε· ἐγὼ γὰρ ὤφειλον ὑφ’ ὑμῶν συνίστασθαι. οὐδὲν γὰρ ὑστέρησα τῶν ὑπερλίαν ἀποστόλων, εἰ καὶ οὐδέν εἰμι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/011.yaml
  text: I have become a fool; you forced me to it. For I ought to have been commended by you[a], for I fell short in nothing compared with those super-apostles, even if I am nothing.
translation:
  language: ja
  text: 私は愚か者になってしまいました。あなたがたが私をそうさせたのです。というのも、本来なら、私はあなたがたから推薦されるべきでした。実際、私はあの大使徒たち[a]に何一つ劣ってはいませんでした――たとえ私が何者でもないとしても。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「最も優れた使徒たち」。ギリシャ語は非常に強い表現で、文脈上、皮肉である可能性があります。
    reason: 強調の度合いと皮肉の可能性を伴う別訳を示すため。
lexical_decisions:
- source_word: Γέγονα
  choice: なってしまいました
  rationale: 完了形が示す、以前の行為の結果として今その状態にあるという含みを保ちつつ、日本語として自然に表した。
- source_word: ἄφρων
  choice: 愚か者
  rationale: 名詞的に用いられた述語形容詞であり、パウロの皮肉を帯びた自己描写を端的に表す。
- source_word: ὑμεῖς με ἠναγκάσατε
  choice: あなたがたが私をそうさせたのです
  rationale: 強調された主語「あなたがた」を明示し、「そう」によって直前の「愚か者になった」こと、文脈上は愚かな誇り方をしたことを受けた。
- source_word: ὤφειλον
  choice: 本来なら…べきでした
  rationale: 現実には行われなかったが、当然そうあるべきだったという義務・期待と反実的な含みを自然な日本語で示した。
- source_word: ὑφ’ ὑμῶν συνίστασθαι
  choice: あなたがたから推薦される
  rationale: 受動形と行為者を保持し、コリントの人々がパウロを支持して語るべきだったという文脈に合う語を選んだ。
- source_word: οὐδὲν ... ὑστέρησα
  choice: 何一つ劣ってはいませんでした
  rationale: 不足というより比較上の劣位を否定する文脈なので、「何一つ劣っていない」とした。
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: あの大使徒たち
  rationale: 強い誇張を簡潔に表し、文脈上あり得る皮肉を本文で断定せず残した。
- source_word: εἰ καὶ οὐδέν εἰμι
  choice: たとえ私が何者でもないとしても
  rationale: 譲歩の力と、パウロの徹底した自己卑下を保ち、「何者でもない」によって οὐδέν を自然に表した。
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλων の指示と修辞的な力
  choice: 「あの大使徒たち」とし、皮肉かどうかを本文では確定しない
  alternative: 「あの最も優れた使徒たち」、または皮肉を明示する「あのいわゆる大使徒たち」
  rationale: この表現は文脈上、論敵への皮肉である可能性が高いが、ギリシャ語自体には「いわゆる」に相当する明示的な標識がない。誇張の強さを残しつつ、読者が文脈から修辞性を判断できるようにした。
- issue: εἰ καὶ οὐδέν εἰμι と使徒として劣らないとの緊張
  choice: 「たとえ私が何者でもないとしても」と直訳に近く保持する
  alternative: 「私は取るに足りない者ですが」
  rationale: パウロが自らを無価値と述べながら使徒として劣らないと主張する神学的・修辞的緊張を、説明によって和らげずそのまま残した。
translation_notes:
  register: 現代の一般読者に明瞭な丁寧体を用いながら、パウロの鋭い弁明と自己卑下を保った。「大使徒」はやや特異な表現だが、原文の誇張と文脈上の含みを保存するため採用した。
