revisions:
- from: あなたがたがほかの諸教会よりも劣った扱いを受けたことが、いったい何かあったでしょうか。[a] この私自身が、あなたがたに負担をかけなかったこと以外に。[b] この不当な仕打ちを、どうか赦してください。[c]
  to: 実際、この私自身があなたがたに負担をかけなかったことを別にすれば、あなたがたがほかの諸教会よりも劣った扱いを受けたのは、どの点においてでしょうか。[a][b] この不当な行いを、どうか赦してください。[c]
