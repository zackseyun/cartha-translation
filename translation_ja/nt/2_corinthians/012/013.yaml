  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί γάρ ἐστιν ὃ ⸀ἡσσώθητε ὑπὲρ τὰς λοιπὰς ἐκκλησίας, εἰ μὴ ὅτι αὐτὸς ἐγὼ οὐ κατενάρκησα ὑμῶν; χαρίσασθέ μοι τὴν ἀδικίαν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/012/013.yaml
  text: For in what were you treated as inferior to the rest of the churches[c][b][a], except that I myself did not become a burden to you? Forgive me this wrong.
translation:
  language: ja
  text: 実際、この私自身があなたがたに負担をかけなかったことを別にすれば、あなたがたがほかの諸教会よりも劣った扱いを受けたのは、どの点においてでしょうか。[a][b] この不当な行いを、どうか赦してください。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ほかの諸教会より不利な立場に置かれた」。ギリシア語の動詞は、劣った立場または不利な立場に置かれることを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: すなわちパウロは、コリントの信徒たちから援助を受けて、彼らに金銭的な負担をかけることをしなかった。
    reason: cultural_note
  - marker: c
    text: パウロは皮肉を込めて語っている。彼らに負担をかけなかったことを、あたかも自分が彼らにした「不当な行い」であるかのように述べる。
    reason: rhetorical_note
lexical_decisions:
- source_word: ἡσσώθητε
  choice: 劣った扱いを受けた
  rationale: 受動形と比較の構文を踏まえ、生来の劣等性ではなく、ほかの教会に比べて不利または下位に扱われたという意味を表す。
- source_word: ὑπὲρ τὰς λοιπὰς ἐκκλησίας
  choice: ほかの諸教会よりも
  rationale: 比較を示すὑπέρと、残り・ほかを意味するλοιπόςを、自然な現代日本語の比較表現で訳した。
- source_word: αὐτὸς ἐγὼ
  choice: この私自身が
  rationale: 強意代名詞と明示された一人称主語によるパウロ自身への強調を保つ。
- source_word: οὐ κατενάρκησα ὑμῶν
  choice: あなたがたに負担をかけなかった
  rationale: 文脈上、金銭的・物質的な扶養を求めなかったことを指すが、本文では原文同様に広い『負担』という表現を保った。
- source_word: χαρίσασθέ μοι
  choice: どうか赦してください
  rationale: ここでは『恵みとして与える』ではなく『赦す』の意味であり、丁寧な命令形によって皮肉を含む擬似的な謝罪を表す。
- source_word: τὴν ἀδικίαν ταύτην
  choice: この不当な仕打ち
  rationale: ἀδικίαの『不正・不当な行為』という意味を保ちつつ、直前の行為を指す自然な日本語とした。パウロの皮肉は文脈と脚注で示す。
- source_word: τί γάρ ἐστιν ὃ
  choice: いったい何かあったでしょうか
  rationale: どの点でそうだったのかを問う修辞疑問として、議論の流れと問いの強調を自然な日本語で表した。
theological_decisions:
- issue: 金銭的援助をめぐるパウロの皮肉な自己弁護
  choice: 本文は『この不当な仕打ちを、どうか赦してください』と直訳寄りに表し、皮肉を説明語で本文に付け足さない。
  alternative: 『こんなひどい仕打ちをした私を赦してください』など、皮肉を誇張して明示する。
  rationale: 原文の皮肉は、負担をかけなかったことを『不当な仕打ち』と呼ぶ逆説と文脈から伝わる。本文で解釈を過度に補わず、脚注で修辞を説明する。
translation_notes:
  register: 明快で現代的ながら dignified な標準日本語。修辞疑問と二文目の省略的な構造を保ち、最後の丁寧な命令によってパウロの鋭い皮肉が自然に響くようにした。すべての脚注記号を本文中に配置した。
