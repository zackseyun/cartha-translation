  register: 明瞭で現代的かつ品位ある標準日本語を用いた。二つの ἵνα 節は日本語として重くなりすぎないよう、一つの目的構文の中で並列的に処理した。原文末尾の読点が示す次節への連続性は、単独節として句点で整えた。
