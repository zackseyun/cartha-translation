  text: ἔπεμψα δὲ τοὺς ἀδελφούς, ἵνα μὴ τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν κενωθῇ ἐν τῷ μέρει τούτῳ, ἵνα καθὼς ἔλεγον παρεσκευασμένοι ἦτε,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/003.yaml
  text: But I sent the brothers[a], so that our boasting about you might not be emptied in this matter, so that, just as I was saying, you may be prepared[b],
translation:
  language: ja
  text: しかし私は兄弟たちを遣わしました。それは、この点であなたがたについての私たちの誇りがむなしいものにならないため、また、私が言っていたとおり、あなたがたが準備を整えた状態にあるようにするためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψα
  choice: 私が……遣わした
  rationale: アオリスト直説法を、この説明的文脈に即して単純過去で表した。
- source_word: τοὺς ἀδελφούς
  choice: 兄弟たち
  rationale: 文脈上、献金に関して派遣された特定の男性の同労者たちを指すため、性別を含む原語の表現を保持した。
- source_word: τὸ καύχημα ἡμῶν τὸ ὑπὲρ ὑμῶν
  choice: あなたがたについての私たちの誇り
  rationale: καύχημα の『誇ること／誇りの根拠』という意味を保ちつつ、パウロがコリントの人々について誇らしく語ったことを自然な日本語で示した。
- source_word: κενωθῇ
  choice: むなしいものにならず
  rationale: 『空にされる、無効にされる』という受動の意味を、この文脈では誇りが根拠のないものとなるという自然な日本語で表した。比喩をより直訳する訳は脚注に示した。
- source_word: ἐν τῷ μέρει τούτῳ
  choice: この点で
  rationale: μέρος は物理的な『部分』ではなく、『この点／この件に関して』という慣用的意味で用いられている。
- source_word: καθὼς ἔλεγον
  choice: 私が言っていたとおり
  rationale: 未完了過去 ἔλεγον が示す、以前から語っていたという継続的ニュアンスを保持した。
- source_word: παρεσκευασμένοι ἦτε
  choice: 準備を整えている
  rationale: 完了分詞と未完了過去形の迂言的構文が示す『準備された状態にある』ことを、自然な現代日本語で表した。
theological_decisions: []
