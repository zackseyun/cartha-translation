revisions:
- from: しかし、私が兄弟たちを遣わしたのは、この点で、あなたがたについての私たちの誇りがむなしいものにならず[a]、私が言っていたとおり、あなたがたが準備を整えているためです。
  to: しかし私は兄弟たちを遣わしました。それは、この点であなたがたについての私たちの誇りがむなしいものにならないため、また、私が言っていたとおり、あなたがたが準備を整えた状態にあるようにするためです。
