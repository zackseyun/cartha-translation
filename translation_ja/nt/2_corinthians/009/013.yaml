source:
  edition: SBLGNT
  text: διὰ τῆς δοκιμῆς τῆς διακονίας ταύτης δοξάζοντες τὸν θεὸν ἐπὶ τῇ ὑποταγῇ τῆς ὁμολογίας ὑμῶν εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ ἁπλότητι τῆς κοινωνίας εἰς αὐτοὺς καὶ εἰς πάντας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/013.yaml
  text: Because of the proof provided by this ministry[a], they glorify God for the obedience of your confession to the gospel of the Messiah and for the generosity of your sharing with them and with everyone[d][c][b],
translation:
  language: ja
  text: この奉仕によって示された確かな証拠を見て、彼らは、あなたがたがキリストの福音を告白し、それに従順に従っていること[a]、また彼らとすべての人に惜しみなく分かち合っていること[b]のゆえに、神をあがめます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「キリストの福音に向けられた、あなたがたの告白に伴う服従」。告白と服従の関係を表す属格の詳しい結び付きには幅がある。
    reason: lexical_alternative
  - marker: b
    text: 「分かち合う」は、一般的な交わりだけでなく、この文脈では特に献金による惜しみない参与を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκιμῆς
  choice: 確かな証拠
  rationale: この奉仕が試されて真正であると示された結果、または信仰の真正さを示す証拠を表す。文脈上、過程としての「試練」より結果としての「証拠」が適切。
- source_word: διακονίας
  choice: 奉仕
  rationale: エルサレムの信徒のための具体的な救援活動を指す。「奉仕」は実際的な働きと信仰に基づく務めの両面を自然に保つ。
- source_word: δοξάζοντες τὸν θεὸν
  choice: 彼らは……神をあがめます
  rationale: ギリシア語の分詞を日本語では明示的な述語として表し、長い文の論理を明確にした。「あがめる」は神に栄光を帰すという δοξάζω の意味を保つ。
- source_word: ὑποταγῇ τῆς ὁμολογίας ὑμῶν
  choice: あなたがたが自らの告白どおり……従っていること
  rationale: 直訳的な「あなたがたの告白の服従」は現代日本語では関係が不明瞭になるため、告白と実際の従順が一致しているという構造を自然に表した。ただし属格の厳密な関係には幅があるため脚注を付した。
- source_word: εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: キリストの福音に
  rationale: εἰς が示す方向・関係を「に」で表し、ὑποταγή と結び付けた。Χριστός は日本語で定着した称号「キリスト」とした。
- source_word: ἁπλότητι
  choice: 惜しみなく
  rationale: 献金の文脈では、単純さ一般よりも、裏表なく気前よく与える寛大さを表す。日本語では副詞形が「分かち合う」と自然に結び付く。
- source_word: κοινωνίας
  choice: 分かち合っていること
  rationale: 一般的な交わりだけでなく、献金を通した物質的な参与を指す。この具体性を保ちつつ語の広がりも残す表現とした。
- source_word: εἰς αὐτοὺς καὶ εἰς πάντας
  choice: 彼らとすべての人に
  rationale: 分かち合いが向けられる相手を自然な日本語で示す。繰り返される εἰς の方向性を助詞「に」で保った。
theological_decisions:
- issue: τῇ ὑποταγῇ τῆς ὁμολογίας の関係
  choice: 告白どおり福音に従っていること
  alternative: あなたがたの告白が福音に服従していること
  rationale: ギリシア語の属格は「告白に伴う服従」または「告白として表された服従」と理解できる。本文では日本語として明瞭な表現を採り、脚注でより形式的な訳を示して解釈の幅を残した。
- issue: Χριστοῦ の訳語
  choice: キリスト
  alternative: メシア
  rationale: Χριστός は称号だが、日本語聖書語として「キリスト」が広く定着しており、普通の読者にも明瞭である。「メシア」という意味は脚注で示し、称号性を見失わせない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あがめます」「奉仕」によって聖書本文らしい品位を保ちつつ、不自然な名詞連鎖を避けた。長いギリシア語文の因果関係が追えるよう、「見て」と「のゆえに」を用いて構造を明示した。
