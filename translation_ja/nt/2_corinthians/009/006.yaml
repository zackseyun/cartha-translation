base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/006.yaml
  text: 'This: the one who sows sparingly will also reap sparingly[a], and the one who sows with blessings will also reap with blessings.'
translation:
  language: ja
  text: このことです。わずかに蒔く人は、わずかに刈り取り、豊かに[a]蒔く人は、豊かに刈り取ります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「豊かに」に当たるギリシア語は、直訳すれば「祝福をもって」です。「祝福」という名詞を用いて、惜しみない豊かさを表しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο δέ
  choice: このことです
  rationale: 直訳的な「しかし、これ」を避けつつ、δέが導く要点提示の働きを簡潔な現代日本語で表した。
- source_word: ὁ σπείρων
  choice: 蒔く人
  rationale: 名詞的分詞の一般的・格言的な意味を保ち、特定の農夫ではなく、そうする人一般を指す表現とした。
- source_word: φειδομένως
  choice: 惜しんでわずかしか
  rationale: 量を控える意味と、献金の文脈にある『出し惜しむ』含意を自然な日本語で表す。単に「少なく」だけとするより語感を保ち、「けちけち」とするほど強い道徳的非難は加えない。
- source_word: καὶ θερίσει
  choice: 刈り取りも…です
  rationale: καίによる、蒔き方に対応した結果を「も」で示し、原文の並行を自然な日本語にした。未来形は格言的な帰結として現在形で表した。
- source_word: ἐπ’ εὐλογίαις
  choice: 豊かに
  rationale: この献金の文脈では、複数形の名詞 εὐλογία を伴う句が、祝福をもたらすほど惜しみなく、豊かな量で、という副詞的意味を表す。本文では自然な日本語を優先し、原語の「祝福」という語感は脚注に残した。
theological_decisions:
- issue: ἐπ’ εὐλογίαις における「祝福」と「豊かさ」の関係
  choice: 本文では「豊かに」とし、原語の「祝福」の響きを脚注で明示する
  alternative: 「祝福をもって蒔く者は、祝福をもって刈り取る」
  rationale: 文脈上、この句は惜しみない施しを示す慣用的表現だが、εὐλογία 自体には「祝福」の意味がある。そのため本文の自然さを保ちながら脚注で語義上の重なりを示した。この格言を物質的繁栄の機械的保証とは解さない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。農耕の比喩と二つの節の対句を維持しつつ、献金の文脈で自然に理解できる表現とした。
