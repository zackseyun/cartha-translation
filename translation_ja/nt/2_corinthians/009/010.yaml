reference: 2 Corinthians 9:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιχορηγῶν ⸀σπόρον τῷ σπείροντι καὶ ἄρτον εἰς βρῶσιν ⸀χορηγήσει καὶ ⸀πληθυνεῖ τὸν σπόρον ὑμῶν καὶ ⸀αὐξήσει τὰ γενήματα τῆς δικαιοσύνης ὑμῶν·)
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/010.yaml
  text: The one who supplies seed to the sower and bread for food will supply and multiply your seed and increase the harvest of your righteousness[a][b].
translation:
  language: ja
  text: 種をまく人に種を、食べるためのパンを与えてくださる方は、あなたがたの種を備え、それを増やし、あなたがたの義の実りを増やしてくださいます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの義の産物を増やしてくださいます」または「あなたがたの義の実を増やしてくださいます」。
    reason: γενήματα は「産物」「実」「収穫」などを意味し得るため。
  - marker: b
    text: 「義」は「正義」とも訳せる。ギリシア語 δικαιοσύνη は、文脈により「義」または「正義」を意味し得る。
    reason: 原語の意味の幅と別の解釈可能性を保持するため。
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: 与えてくださる方
  rationale: 冠詞を伴う分詞を、供給する主体を表す自然な日本語にした。文脈上その主体は神であるため敬意表現を用いたが、原文どおり本文では「神」を補っていない。
- source_word: σπόρον τῷ σπείροντι
  choice: 種をまく人に種を
  rationale: 農耕の比喩と「まく人／種」の対応を明瞭に保った。
- source_word: ἄρτον εἰς βρῶσιν
  choice: 食べるためのパンを
  rationale: 種まき用の種と食用のパンとの対比を、明快で自然な現代日本語で示した。
- source_word: χορηγήσει καὶ πληθυνεῖ τὸν σπόρον ὑμῶν
  choice: あなたがたの種を与えて増やし
  rationale: 二つの未来動詞をともに反映し、「種」の比喩を維持した。日本語では文末の「くださいます」が将来的な約束も自然に担う。
- source_word: αὐξήσει τὰ γενήματα
  choice: 実りを豊かにしてくださいます
  rationale: 成長・増加を表す動詞と農産物・産出を表す複数名詞を、農耕イメージに即した自然な表現にした。
- source_word: δικαιοσύνης
  choice: 義
  rationale: パウロ書簡の神学的語彙と意味の幅を保つため「義」を採用し、文脈によって可能な「正義」は脚注に示した。
theological_decisions:
- issue: 「あなたがたの義の実り」の意味
  choice: 義と結びつく実り・成果を表す幅のある比喩として保持する
  alternative: 物質的な報い、正義に基づく行為の成果、または義なる行いの証拠に限定する
  rationale: 献金と寛大さの文脈にある農耕比喩だが、属格の関係を原文は一義的に限定していない。繁栄の約束、社会的正義のみ、法廷的な義のみのいずれにも狭めなかった。
- issue: δικαιοσύνη の訳語
  choice: 義
  alternative: 正義
  rationale: 「義」はパウロの用語法の広がりを保つ標準的な訳である一方、この文脈では「正義」も可能なので脚注で保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神への敬意を示す「くださる」を採用した。農耕比喩と「義」をめぐる神学的な幅を保ち、説明的な言い換えで意味を限定していない。
