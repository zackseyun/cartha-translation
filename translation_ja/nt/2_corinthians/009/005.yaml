    issue: ἑτοίμην εἶναι の表現が受動態になっている
    rationale: 「用意される」は準備する行為を表す受動であるのに対し、原文は献金が「用意できている」という状態を表す。
  - severity: medium
    issue: 後半の目的節が不自然である
    rationale: 「…用意されるためです」は説明・理由のように響く。ἵνα 以下の目的は「…ようにするためです」と表すのが自然である。
