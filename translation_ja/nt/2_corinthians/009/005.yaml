reference: 2 Corinthians 9:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀναγκαῖον οὖν ἡγησάμην παρακαλέσαι τοὺς ἀδελφοὺς ἵνα προέλθωσιν ⸀εἰς ὑμᾶς καὶ προκαταρτίσωσι τὴν ⸀προεπηγγελμένην εὐλογίαν ὑμῶν, ταύτην ἑτοίμην εἶναι οὕτως ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/005.yaml
  text: Therefore I considered it necessary to urge the brothers[a] to go to you ahead of us and arrange in advance the generous gift[b] you had promised, so that it would be ready as a generous gift and not as something extorted[c].
translation:
  language: ja
  text: そこで私は、兄弟たち[a]に、私たちより先にあなたがたのところへ行き、あなたがたが前もって約束していた惜しみない贈り物[b]をあらかじめ整えておくよう勧める必要があると考えました。こうして、それが惜しみない贈り物として用意ができており、無理に取り立てられたもの[c]ではないようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、文脈によっては「兄弟姉妹たち」、すなわち信者仲間を包括的に指すこともあります。ただし、ここでは派遣される男性の一団を指す可能性があります。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「祝福」です。ここでは、コリントの人々が約束していた献金を、惜しみない贈り物として表しています。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は通常「貪欲」「むさぼり」を意味します。ここでは、献金が自発的な贈り物ではなく、強引に取り立てられたもののようになることを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγκαῖον οὖν ἡγησάμην
  choice: そこで私は…必要があると考えました
  rationale: οὖνによる前文からの帰結と、ἡγησάμηνが表すパウロの判断を、自然な現代日本語で示す。
- source_word: παρακαλέσαι
  choice: 勧める
  rationale: 使節に先行して行動するよう強く促す文脈。日本語の「勧める」は、威圧的な命令にせず働きかけの力を表せる。
- source_word: τοὺς ἀδελφοὺς
  choice: 兄弟たち
  rationale: 文法上の男性複数形と、ここで派遣される一団を指す可能性を保つ。包括的用法の可能性は脚注に示す。
- source_word: προέλθωσιν εἰς ὑμᾶς
  choice: 私たちより先にあなたがたのところへ行き
  rationale: προέρχομαιの先行性を文脈上の比較対象であるパウロ一行との関係として明示する。
- source_word: προκαταρτίσωσι
  choice: あらかじめ整えておく
  rationale: 献金をパウロ到着前に手配し、準備を完了させる意味を表す。
- source_word: τὴν προεπηγγελμένην εὐλογίαν ὑμῶν
  choice: あなたがたが前もって約束していた惜しみない贈り物
  rationale: εὐλογίαの字義は「祝福」だが、この文脈では約束された献金を、その寛大な性質に即して指す。字義は脚注に残す。
- source_word: ἑτοίμην εἶναι οὕτως
  choice: こうして、それが…用意される
  rationale: οὕτωςを前もって整えるという方法・結果につなげ、目的を日本語で明瞭にする。
- source_word: ὡς εὐλογίαν καὶ μὴ ὡς πλεονεξίαν
  choice: 無理に出させられたものではなく、惜しみない贈り物として
  rationale: εὐλογίαの反復を保ちつつ、πλεονεξίαがこの対比で表す、貪欲に取り立てられた献金という含意を自然に表現する。通常の語義は脚注に示す。
theological_decisions:
- issue: ἀδελφοὺςの指示範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の男性複数形を本文で保つ。ただし、この語が共同体成員を包括的に指す場合もあるため、その可能性を脚注に記す。
- issue: 献金を表すεὐλογία
  choice: 惜しみない贈り物
  alternative: 祝福
  rationale: 「祝福」という神学的比喩を脚注に保存しながら、献金について述べるこの箇所の指示内容と、πλεονεξίαとの倫理的対比を本文で理解しやすくする。
- issue: πλεονεξίαの文脈的意味
  choice: 無理に出させられたもの
  alternative: 貪欲／むさぼり
  rationale: 通常は貪欲・むさぼりを意味するが、ここでは献金が自発的な寛大さからではなく、使徒側の貪欲によって取り立てられたかのようになることを警戒している。どちらか一方の内面的動機だけに限定しないよう脚注で語義幅を示す。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、書簡としての品位を保った。「あなたがた」を用いて複数宛てを明確にし、εὐλογίαの反復も「惜しみない贈り物」として本文内で再現した。
