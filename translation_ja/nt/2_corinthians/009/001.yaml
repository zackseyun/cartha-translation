  text: Περὶ μὲν γὰρ τῆς διακονίας τῆς εἰς τοὺς ἁγίους περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/001.yaml
  text: For concerning the ministry to the saints[a], it is superfluous for me to write to you,
translation:
  language: ja
  text: さて、聖なる者たちへの奉仕[a]については、私があなたがたに書くまでもありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖なる者たちのための奉仕」。ギリシア語の前置詞は、ここでは奉仕の向かう先またはその受益者を示し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ μὲν γὰρ
  choice: さて、～については
  rationale: περίによる話題提示を「～については」とし、μένとγάρが前の文脈とのつながりを保ちながら話題を移す働きを「さて」で自然に表した。γάρを機械的に「なぜなら」とすると、日本語では後続文の理由説明であるかのように響きやすい。
- source_word: διακονίας
  choice: 奉仕
  rationale: ここでは困窮する信徒のための献金に関わる働きを指すが、単に「援助」や「献金」と限定せず、パウロが用いた広い奉仕概念を保った。
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: 聖なる者たちへの
  rationale: εἰςが示し得る方向と受益者の両面を「への」で簡潔に保った。「ための」も文脈上可能なので脚注に示した。
- source_word: ἁγίους
  choice: 聖なる者たち
  rationale: 神のために聖別された信徒を指すパウロの呼称を、現代の一般読者にも意味が伝わる形で訳した。「聖徒」より平明であり、特別に列聖された人物という誤解も避けられる。
- source_word: περισσόν μοί ἐστιν τὸ γράφειν ὑμῖν
  choice: 私があなたがたに書くまでもありません
  rationale: περισσόνの「余分である、必要がない」という意味を、尊厳を保ちつつ自然な現代日本語で表した。「不要です」よりも、パウロの修辞的な言い方に適する。
theological_decisions:
- issue: 「聖なる者たち」が指す範囲
  choice: 訳文では単に「聖なる者たち」とする
  alternative: 「エルサレムの聖なる者たち」または「信徒たち」と明示する
  rationale: 文脈上はエルサレムの困窮した信徒を念頭に置くが、この節自体には地名も説明語もないため、本文に補わず原文の呼称を保った。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、書簡にふさわしい品位を保った。「奉仕」「聖なる者たち」により原文の宗教的語彙を保持し、「書くまでもありません」で硬すぎない自然な修辞にした。
