  source_fidelity: 「さて、…については」はΠερὶ μὲν γὰρの話題転換と前文との接続を自然な日本語で表している。「聖なる者たちへの奉仕」はτῆς διακονίας τῆς εἰς τοὺς ἁγίουςを過度に限定せずに訳し、「私があなたがたに書くまでもありません」はπερισσόν μοί ἐστιν τὸ γράφειν ὑμῖνの『書く必要はない／余分である』という修辞的な意味を適切に伝える。
  naturalness: 明瞭な現代標準日本語であり、書簡文としても自然である。「書くまでもありません」は硬直した逐語訳を避けつつ、原文の控えめな修辞を保っている。
