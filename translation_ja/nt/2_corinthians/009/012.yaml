id: 2CO.9.12
reference: 2 Corinthians 9:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἡ διακονία τῆς λειτουργίας ταύτης οὐ μόνον ἐστὶν προσαναπληροῦσα τὰ ὑστερήματα τῶν ἁγίων, ἀλλὰ καὶ περισσεύουσα διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/012.yaml
  text: For the ministry of this service is not only supplying the needs of the saints[b][a], but is also overflowing in many thanksgivings to God—
translation:
  language: ja
  text: というのも、この奉仕の働きは、聖徒たちに不足しているものを補うだけでなく[a]、神への多くの感謝があふれるものとなるからです[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖徒たちの必要を満たす」。
    reason: ὑστερήματαは「不足しているもの」「欠け」「必要」を表し得るため。
  - marker: b
    text: 直訳「神への多くの感謝を通して豊かになる」。
    reason: διὰ πολλῶν εὐχαριστιῶνは字義的には「多くの感謝を通して」であり、奉仕が神への感謝を豊かに生じさせるという文脈上の関係を本文では明瞭に表した。
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からです
  rationale: 直前の文を説明する接続関係を、現代日本語で自然に示す。
- source_word: ἡ διακονία τῆς λειτουργίας ταύτης
  choice: この奉仕の務め
  rationale: διακονίαとλειτουργίαという近接した二語を完全に同一語へ平板化せず、前者を「務め」、後者を「奉仕」として簡潔に表した。
- source_word: προσαναπληροῦσα τὰ ὑστερήματα
  choice: 不足しているものを補う
  rationale: 単なる一般的な「必要」よりも、欠けを満たすという原文の語感を保ちつつ、自然な日本語にした。
- source_word: τῶν ἁγίων
  choice: 聖なる者たち
  rationale: パウロが信徒を指して用いる語の意味を保ち、後代の列聖者だけを連想させかねない表現を避けた。
- source_word: περισσεύουσα
  choice: あふれ出る
  rationale: 十分な量を越えて豊かに生じるという比喩的な力を保った。
- source_word: διὰ πολλῶν εὐχαριστιῶν τῷ θεῷ
  choice: 多くの感謝を通して神に向かって
  rationale: διάの手段・経路の含みを「通して」で保ち、与格τῷ θεῷを感謝の向かう先として訳した。
theological_decisions:
- issue: ἅγιοιが指す人々
  choice: 聖なる者たち
  alternative: 聖徒／神の民
  rationale: ここでは献金を受ける信徒たちを指す。原語の「聖なる」という意味とパウロ的用語法を示しつつ、特定教派の用語や後代の列聖概念に限定しない。
- issue: 奉仕が「多くの感謝を通してあふれる」という関係
  choice: 多くの感謝を通して神に向かってあふれ出る
  alternative: 神への多くの感謝となってあふれる
  rationale: διάを手段・経路として表す読みを本文に採ったが、この奉仕が多数の感謝を生み出すという結果的な理解も文脈上可能なので脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。原文が次節へ続くことを示すダッシュを維持した。「聖なる者たち」は説明的だが平易で、パウロの用語の意味を可視化する。
