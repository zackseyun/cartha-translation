  text: (καθὼς γέγραπται· Ἐσκόρπισεν, ἔδωκεν τοῖς πένησιν, ἡ δικαιοσύνη αὐτοῦ μένει εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/009.yaml
  text: 'as it is written: “He scattered abroad[a], he gave to the poor; his righteousness remains forever.”'
translation:
  language: ja
  text: 'こう書かれているとおりです。


    「彼は広く分け与え、貧しい人々に与えた。


    彼の義[a]は永遠に残る。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正しさ」または「正義」とも訳せる。ギリシア語は、正しいあり方・正しい行いと、公正の両方を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: こう書かれているとおりです
  rationale: 聖書引用を導入する定型表現として、原文の受動形と完了の含意を保ちつつ、現代日本語として自然にした。
- source_word: Ἐσκόρπισεν
  choice: 惜しみなく分け与え
  rationale: 直訳は「まき散らした」だが、詩篇からの引用において施しを広く行う比喩である。「惜しみなく分け与え」はその像と寛大さを自然な日本語で伝える。
- source_word: ἔδωκεν
  choice: 与えた
  rationale: アオリストを簡潔な過去形で表し、引用文の並行表現を保った。
- source_word: τοῖς πένησιν
  choice: 貧しい人々に
  rationale: 生活手段に乏しい人々を指す語を、明瞭で一般的な現代日本語にした。
- source_word: ἡ δικαιοσύνη αὐτοῦ
  choice: 彼の正しさ
  rationale: δικαιοσύνηがここでは寛大な人の正しい行いまたは正しいあり方を指し得るため、日本語で両面を比較的自然に含む「正しさ」とした。
- source_word: μένει
  choice: 残る
  rationale: 持続することを表す現在形を、簡潔で自然な「残る」と訳した。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: 終わりなく続く意味を表す、聖書引用にふさわしい自然な日本語である。
theological_decisions:
- issue: δικαιοσύνηの意味範囲
  choice: 正しさ
  alternative: 義／正義
  rationale: 文脈上、神から与えられる法廷的な義に限定せず、施す人の正しい行為や人格、その正当さを表し得る。「正しさ」は曖昧さを保ち、脚注で「義」「正義」の可能性を示す。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。詩的引用として二行に整え、過度に古風な「記されている」「とこしえ」などは避けた。「まき散らした」という直訳は日本語で浪費の否定的含意を招きやすいため、文脈上の広く寛大に施す意味を明示した。
