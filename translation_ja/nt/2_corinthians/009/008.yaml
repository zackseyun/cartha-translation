reference: 2 Corinthians 9:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀δυνατεῖ δὲ ὁ θεὸς πᾶσαν χάριν περισσεῦσαι εἰς ὑμᾶς, ἵνα ἐν παντὶ πάντοτε πᾶσαν αὐτάρκειαν ἔχοντες περισσεύητε εἰς πᾶν ἔργον ἀγαθόν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/008.yaml
  text: And God is able to make all grace abound to you[a], so that in everything, at all times, having all sufficiency, you may abound in every good work.
translation:
  language: ja
  text: 神は、あらゆる恵みをあなたがたに満ちあふれさせることがおできになります。それは、あなたがたがいつでも、あらゆることにおいて、十分に足りている[a]ようにし、あらゆる良い働きを豊かに行えるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「必要なものが十分に備えられている」。ギリシア語は「十分であること」「必要を満たすこと」、また「満足」を意味し得ます。ここでは、自力で何でも賄えることではなく、神から十分な備えを与えられることを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: δυνατεῖ
  choice: おできになります
  rationale: 神の現実の力・能力を表す現在形。単なる可能性ではなく、神にはそうする力があるという強調を、自然で敬意ある日本語にした。
- source_word: δὲ
  choice: （独立した接続語を置かない）
  rationale: ここでは弱い連結を示す語であり、日本語では前後の流れによって十分に表せるため、文頭の不自然な「そして」は避けた。
- source_word: πᾶσαν χάριν
  choice: あらゆる恵み
  rationale: 文脈上、物質的な備えを含む神の恵み深い供給を指すが、金銭だけに狭めず、χάρις の広がりを保った。
- source_word: περισσεῦσαι
  choice: あふれさせる
  rationale: 神が恵みを豊かに与えるという使役的な意味を表し、後半の περισσεύητε との語の反復も保った。
- source_word: εἰς ὑμᾶς
  choice: あなたがたに
  rationale: 恵みがコリントの信徒たちへ向けられることを、自然な日本語で示した。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 神が恵みをあふれさせる目的を明示し、目的・結果の含みを保った。
- source_word: ἐν παντὶ πάντοτε
  choice: いつでも、あらゆる点で
  rationale: παν- 語群の畳みかけを明示しつつ、「あらゆる点で」により状況・面の包括性を自然に表した。
- source_word: πᾶσαν αὐτάρκειαν
  choice: 必要なものをすべて
  rationale: この文脈では、自己完結的な自給自足ではなく、良い働きのために神から必要十分に備えられることを指す。読みやすい本文とし、語の幅は脚注に残した。
- source_word: ἔχοντες
  choice: 持ち
  rationale: 主節と同時的な分詞を簡潔に表し、十分な備えを持った上で良い働きにあふれるという構造を保った。
- source_word: περισσεύητε
  choice: あふれる
  rationale: 前半の περισσεῦσαι と同じ訳語を用い、恵みの豊かさが良い働きの豊かさにつながる修辞的対応を示した。
- source_word: εἰς πᾶν ἔργον ἀγαθόν
  choice: あらゆる良い働きに
  rationale: εἰς の方向・結果のニュアンスを「あふれる」と自然に結び、善く有益な行い全般を表した。
theological_decisions:
- issue: 施しの文脈における χάρις の意味
  choice: 物質的な支えを含む、広い意味での神の恵み深い備え
  alternative: 好意のみ、または金銭的な賜物のみ
  rationale: 直前後は献金と寛大さを扱うが、χάρις を金銭に限定すると語の神学的な広がりが失われるため、「恵み」とした。
- issue: αὐτάρκεια の意味
  choice: 神から与えられる必要十分な備え
  alternative: 満足、自足、自己完結的な自給自足
  rationale: 文脈では、信徒が神の供給によって他者への良い働きを行えることが中心であり、人間の独立的な自己充足を述べてはいない。
translation_notes:
  register: 明瞭な現代標準語を用い、神については「おできになります」と敬意ある表現にした。原文に繰り返される πᾶς 系の包括表現と περισσεύω の反復を、「あらゆる／すべて」「あふれさせる／あふれる」によって可能な限り再現した。
