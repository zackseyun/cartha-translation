  source_fidelity: 本文は神の恵みの豊かな供給と、それによる信徒の善い行いへの豊かさを概ね正確に伝えています。ただし、「あらゆる良い働きにあふれる」は日本語として意味の結び付きが弱く、εἰς πᾶν ἔργον ἀγαθόν が示す、あらゆる善い行いへと豊かに向かう結果をより明瞭にする必要があります。また、脚注の別訳にある「すべての面で」は αὐτάρκεια 単独ではなく前段の ἐν παντί に対応するため、脚注では分けて扱うのが正確です。
