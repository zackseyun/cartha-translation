  terminology: 「恵み」は χάρις の広い意味を保っており適切です。αὐτάρκεια は、この文脈で人間の独立的な自足ではなく、神から与えられる十分な備えを指すため、「十分に足りている」と訳し、脚注で「必要なものが十分に備えられている」と補うのがよいです。
