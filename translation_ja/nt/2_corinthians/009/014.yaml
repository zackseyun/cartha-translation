id: 2CO.9.14
reference: 2 Corinthians 9:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτῶν δεήσει ὑπὲρ ὑμῶν ἐπιποθούντων ὑμᾶς διὰ τὴν ὑπερβάλλουσαν χάριν τοῦ θεοῦ ἐφ’ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/014.yaml
  text: and in their prayer for you[a], they long for you because of the surpassing grace of God upon you.
translation:
  language: ja
  text: そして彼らは、あなたがたのために祈りながら、あなたがたにある神の並外れた恵みのゆえに、あなたがたを慕っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして彼らは、あなたがたのために切に祈りつつ、あなたがたにある神の並外れた恵みのゆえに、あなたがたを慕っています。」
    reason: δέησιςに含まれうる切実さ、および祈りと慕いの圧縮された統語関係を示すため。
lexical_decisions:
- source_word: δέησις
  choice: 祈り
  rationale: ここでは与格 δεήσει を、祈るという営みの中で、または祈りを伴って、という意味に取る。「祈り」は、執り成しや切なる願いを含み得る自然で広い現代日本語である。
- source_word: αὐτῶν
  choice: 彼らは
  rationale: 前文脈の援助を受ける人々を指す。ギリシア語では「彼らの祈り」と属格だが、日本語では分詞との関係を明瞭にするため主語として表した。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたのために
  rationale: 属格を伴う ὑπέρ の、利益・代理を示す基本的な意味を自然に表す。
- source_word: ἐπιποθούντων
  choice: 慕っています
  rationale: 継続的で深い愛情を伴う願望を表す現在分詞。日本語では文の述語にして、祈る人々がコリントの信徒たちを強く慕う意味を示した。
- source_word: διὰ
  choice: ゆえに
  rationale: 対格を伴う διά はここでは理由・根拠を表す。「ゆえに」は因果関係を明確にしつつ、聖書本文にふさわしい自然で端正な語調を保つ。
- source_word: ὑπερβάλλουσαν
  choice: この上なく豊かな
  rationale: 通常を越える卓越・豊かさを表す。「この上なく豊かな」は日本語として自然で、恵みの並外れた大きさを伝える。
- source_word: χάριν
  choice: 恵み
  rationale: パウロ書簡で神の無償の好意とその働きを担う語であり、標準的な「恵み」が最適である。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 恵みの源または帰属を示す属格を、そのまま自然な所有・起源表現で訳した。
- source_word: ἐφ’ ὑμῖν
  choice: あなたがたに注がれた
  rationale: ἐπί＋与格の「あなたがたの上に／あなたがたに」を、日本語で恵みとの自然な結び付きになるよう表した。「注がれた」は恵みが彼らに及んでいる比喩を保つが、単に「あなたがたにある」とする余地もある。
- source_word: καὶ
  choice: そして
  rationale: 前節から続く内容を示す単純な接続として訳した。
theological_decisions:
- issue: 祈りと慕うことの統語関係
  choice: 「あなたがたのために祈りながら、…あなたがたを慕っています」
  alternative: 「彼らの、あなたがたのための祈りによって、あなたがたを慕いながら」または祈りを慕いの表現手段として強調する訳
  rationale: ギリシア語は αὐτῶν と属格分詞 ἐπιποθούντων の関係が圧縮されている。「祈りながら」として両行為の同時的な関係を示す一方、祈りが手段なのか領域なのかを過度に教理化しない。
- issue: 神の恵みが「あなたがたに」あることの表現
  choice: 「あなたがたに注がれた神のこの上なく豊かな恵み」
  alternative: 「あなたがたの上にある神の卓越した恵み」または「あなたがたのうちにある神の豊かな恵み」
  rationale: ἐφ’ ὑμῖν は、恵みが彼らに及んだこと、彼らの上にあること、彼らの間で働くことを含み得る。「注がれた」は神から与えられた恵みを自然に示すが、働きの所在を「うちに」と限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「恵み」「慕う」「ゆえに」によって品位ある聖書文体を保った。長いギリシア語句は日本語の語順に整え、祈る主体と慕う主体が同一であることを明確にした。
