source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ⸀προῄρηται τῇ καρδίᾳ, μὴ ἐκ λύπης ἢ ἐξ ἀνάγκης· ἱλαρὸν γὰρ δότην ἀγαπᾷ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/007.yaml
  text: Each one should give as he has decided in his heart[a], not out of grief or compulsion[b], for God loves a cheerful giver.
translation:
  language: ja
  text: 一人一人、心に決めたとおりに、悲しみからでもなく[a]、強いられてでもなく、与えなさい。神は、喜んで与える人を愛しておられるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「悲しみから」。この文脈では、与えることをつらく感じたり、しぶしぶ与えたりすることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος
  choice: 一人一人
  rationale: 分配的な単数の焦点を保ちつつ、性別を限定しない自然な現代日本語とした。
- source_word: καθὼς προῄρηται τῇ καρδίᾳ
  choice: 心に決めたとおりに
  rationale: すでになされた内面的で意図的な決定を、簡潔で自然な日本語で表した。「心」を残し、単なる知的判断には狭めていない。
- source_word: μὴ ἐκ λύπης
  choice: 惜しみながらでもなく[a]
  rationale: λύπηの字義は「悲しみ、苦痛」だが、献金の文脈では、つらく感じていやいや与える態度を指す。「悲しみからではなく」は日本語では意味が伝わりにくいため本文は文脈的に訳し、字義を脚注に残した。
- source_word: ἢ ἐξ ἀνάγκης
  choice: 強いられてでもなく
  rationale: 外からの圧力や避けがたい必要に迫られて与えることを表す。日本語では「強いられて」が明瞭で自然である。
- source_word: ἱλαρὸν δότην
  choice: 喜んで与える人
  rationale: ἱλαρόςが示す明るく喜ばしい心構えを自然に表し、δότηςを性別に限定せず訳した。
- source_word: ἀγαπᾷ ὁ θεός
  choice: 神は……愛しておられる
  rationale: 動詞の基本義「愛する」を保った。「喜ばれる」などに置き換えず、神の愛という原文の表現を維持した。
- source_word: '[献げなさい]'
  choice: 献げなさい
  rationale: ギリシア語本文では動詞が文脈から補われる省略表現である。直前から続く献金の勧めを日本語で明示し、金銭を神と人への奉仕のために差し出す文脈に合わせて「献げる」とした。
theological_decisions:
- issue: λύπηを献金の文脈でどう表すか
  choice: 本文を「惜しみながら」とし、字義の「悲しみ」を脚注に示す
  alternative: 本文を「悲しみながら」または「悲しみから」とする
  rationale: 字義だけを本文に置くと、日本語では一般的な悲嘆の中で献げることまで禁じているように読まれかねない。文脈上の含意を明瞭にしながら、原語の感情的な強さを脚注で保存した。
- issue: 原文で省略されている献げる動作
  choice: 命令形「献げなさい」を補う
  alternative: 動詞を省略した断片的な日本語にする
  rationale: 前後の献金の文脈によって動作は明白であり、日本語として意味の通る文にするために補った。これは献げる対象や額について原文以上の規定を加えるものではない。
- issue: 神が喜んで与える人を「愛する」という表現
  choice: 「愛しておられる」を保持する
  alternative: 「喜ばれる」「好まれる」と意訳する
  rationale: ἀγαπάωの明示的な愛の表現を、単なる是認や満足へ弱めないため。これを神の愛が献金によって獲得されるという教理的説明にも展開せず、原文の緊張をそのまま残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文としての落ち着きと尊厳を保った。「献げる」は献金の文脈を示すため漢字表記とし、「愛しておられる」は過度に古風にならない敬意ある表現とした。原文の代表的単数は、日本語の「一人一人」と主語省略によって自然に保持され、性別を限定する表現は不要である。
