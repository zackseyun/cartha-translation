  to: 一人一人、心に決めたとおりに、悲しみからでもなく[a]、強いられてでもなく、与えなさい。神は、喜んで与える人を愛しておられるからです。
  rationale: 原文の分配的単数、心における事前の決意、λύπηとἀνάγκηの並行、そして神が喜んで与える人を愛するという結びを保ちました。λύπηは本文で「悲しみから」と訳し、文脈上の「しぶしぶ」の含意を脚注に置きました。補われる行為は、原文以上に受け手を限定しない「与えなさい」としました。
