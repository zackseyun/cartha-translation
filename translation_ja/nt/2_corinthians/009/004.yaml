source:
  edition: SBLGNT
  text: μή πως ἐὰν ἔλθωσιν σὺν ἐμοὶ Μακεδόνες καὶ εὕρωσιν ὑμᾶς ἀπαρασκευάστους καταισχυνθῶμεν ἡμεῖς, ἵνα μὴ ⸀λέγωμεν ὑμεῖς, ἐν τῇ ὑποστάσει ⸀ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/004.yaml
  text: lest if any Macedonians come with me and find you unprepared[b][a], we—not to say you—would be put to shame in this matter of confidence.
translation:
  language: ja
  text: それは、もしマケドニアの人々が私と一緒に来て、あなたがたがまだ準備できていないのを見れば、この確信[a]に関して、私たちが――あなたがたは言うまでもなく[b]――恥をかかないためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この取り組みに関して」または「この事態において」。ここでのギリシア語は、パウロがあなたがたについて抱いている「確信」を指す可能性が最も高い。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたがたと言わないために」。準備ができていなければ、コリントの人々も恥をかくことを遠回しに示している。
    reason: alternative_reading
lexical_decisions:
- source_word: μή πως ἐὰν
  choice: それは、もし～場合、～ことがないためです
  rationale: μή πωςの懸念・回避のニュアンスと、ἐάνが示す将来の可能性を、自然な日本語の条件・目的構文で表した。
- source_word: ἔλθωσιν σὺν ἐμοὶ Μακεδόνες
  choice: マケドニアの人たちが私と一緒に来て
  rationale: 冠詞のない複数名詞が示す不特定性を保ちつつ、現代日本語として自然にした。
- source_word: εὕρωσιν ὑμᾶς ἀπαρασκευάστους
  choice: あなたがたの準備ができていないのを見た
  rationale: ἀπαρασκεύαστοςの「準備されていない」という意味を、献金準備の文脈に自然に合う表現で訳した。
- source_word: καταισχυνθῶμεν
  choice: 恥をかく
  rationale: 受動形の社会的な羞恥を自然な現代日本語で示した。「恥じる」より、人前で面目を失う含意が明確である。
- source_word: ἡμεῖς
  choice: 私たちが
  rationale: 明示された代名詞の強調を、挿入句を伴う語順とダッシュで保った。
- source_word: ἵνα μὴ λέγωμεν ὑμεῖς
  choice: あなたがたは言うまでもなく
  rationale: コリントの人々も同じ羞恥を負うという含みを保ちながら、非難を和らげる挿入句として自然に訳した。
- source_word: ἐν τῇ ὑποστάσει ταύτῃ
  choice: この確信のことで
  rationale: ὑπόστασιςを後代の形而上学的な「実体」とせず、直前の文脈におけるパウロの確信として訳した。ただし語義上の幅は脚注に残した。
theological_decisions:
- issue: 非専門的なパウロ書簡の文脈におけるὑπόστασιςの意味
  choice: 確信
  alternative: 企て、取り組み、事態
  rationale: 直前の文脈では、パウロがコリントの人々について抱き、マケドニアの人々に示した確信が問題となっている。後代の神学的・哲学的な「実体」を持ち込まず、文脈上最も有力な意味を本文に採った。
translation_notes:
  register: 明瞭で現代的ながら、書簡としての品位を保った。「あなたがたは言うまでもなく」をダッシュで挟み、原文の婉曲的な挿入とἡμεῖςの強調を再現した。脚注記号は、それぞれが説明する語句の直後に置いた。
