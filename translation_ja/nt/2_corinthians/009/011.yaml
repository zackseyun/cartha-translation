reference: 2 Corinthians 9:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν παντὶ πλουτιζόμενοι εἰς πᾶσαν ἁπλότητα, ἥτις κατεργάζεται δι’ ἡμῶν εὐχαριστίαν τῷ θεῷ—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/011.yaml
  text: being enriched in every way for all generosity[a], which through us produces thanksgiving to God—
translation:
  language: ja
  text: あなたがたは、あらゆる面で豊かにされ、どんな場合にも惜しみなく与えられるようになります[a]。そのような惜しみない施しが、私たちを通して神への感謝を生み出すのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あらゆる惜しみない施しのために」。ここで「惜しみなく与える」と訳した語は、文脈によっては「純真さ」「誠実さ」「単純さ」を意味することもありますが、ここでは献金について述べているため、気前よく与えることを指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντὶ
  choice: あらゆる面で
  rationale: 包括的な備えを表す慣用的な句として自然であり、物質面だけに狭めない。
- source_word: πλουτιζόμενοι
  choice: 豊かにされ
  rationale: 現在受動分詞の受動性を保ち、神が暗黙の行為者であることを示す。「金持ちになる」という繁栄主義的な響きも避ける。
- source_word: εἰς πᾶσαν ἁπλότητα
  choice: 惜しみなく与えられるようになります
  rationale: εἰςの目的・結果を表し、献金の文脈におけるἁπλότηςを、具体的で気前のよい分かち合いとして自然な日本語にした。
- source_word: ἥτις
  choice: その惜しみない行為が
  rationale: 先行するἁπλότηςを受ける関係代名詞の働きを明示し、日本語として指示対象が曖昧にならないようにした。
- source_word: κατεργάζεται
  choice: 生み出す
  rationale: ある結果を実現させるという動詞の意味を簡潔に表す。
- source_word: δι’ ἡμῶν
  choice: 私たちを通して
  rationale: διά＋属格の媒介・手段を直訳的に保ち、パウロたちが献金を届ける働きを担うという含みを説明しすぎず残す。
- source_word: εὐχαριστίαν τῷ θεῷ
  choice: 神への感謝
  rationale: 名詞句としての重点と、感謝が神に向けられることを明確に保つ。
theological_decisions:
- issue: 献金の文脈におけるἁπλότηςの意味
  choice: 惜しみなく与えること／気前のよさ
  alternative: 純真さ、誠実さ、単純さ
  rationale: 語そのものには「純真さ」「誠実さ」などの意味もあるが、直前直後の物質的な備え、分与、神への感謝という文脈では、具体的な気前のよさが最も自然である。内面的な徳だけに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、聖書本文にふさわしい品位を保った。分詞が連続するギリシア語を日本語では二文に分け、因果関係と指示対象を明確にした。「惜しみなく」を反復してἥτιςの先行詞を明示した。
