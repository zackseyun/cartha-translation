  text: ⸀χάρις τῷ θεῷ ἐπὶ τῇ ἀνεκδιηγήτῳ αὐτοῦ δωρεᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/015.yaml
  text: Thanks be to God for his indescribable gift[a].
translation:
  language: ja
  text: 言葉では言い表せないほどの贈り物をくださった神に、感謝します。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「言葉で表現し尽くせない贈り物」。ギリシア語は、十分に語ることも言い表すこともできないものを意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: 神に、感謝します
  rationale: χάρις はここでは与格の「神に」と結びつく感謝の定型的な表現である。現代日本語として自然で、頌栄的な力も保つ。
- source_word: ἐπὶ
  choice: 〜をくださった…に
  rationale: 与格を伴い、感謝の根拠・理由を表す。日本語では贈り物を神の行為と結びつけることで、自然に「その贈り物のゆえに」という関係を示した。
- source_word: ἀνεκδιηγήτῳ
  choice: 言葉では言い表せないほどの
  rationale: 十分に物語ることも表現することもできない、という語義を、明瞭な現代日本語で示す。
- source_word: αὐτοῦ
  choice: くださった神
  rationale: 代名詞は神を指す。日本語では「神の贈り物」よりも、贈与者としての神を動詞で明示する表現が自然である。
- source_word: δωρεᾷ
  choice: 贈り物
  rationale: 無償で与えられるものを指す。「贈り物」は明快であり、「無償の」を加えて意味を過度に限定することを避ける。
theological_decisions:
- issue: 「言葉では言い表せないほどの贈り物」が何を指すか
  choice: 神がくださった贈り物とのみ訳し、その内容を特定しない
  alternative: キリスト、キリストによる救い、または献金の文脈を含む神の恵みと明示する
  rationale: 本文自体は贈り物の内容を明示していない。キリストを中心に理解する伝統と、直前の寛大な施しを生み出す神の恵みという文脈の双方を排除せず、原文の含みを保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「筆舌に尽くしがたい」のような硬い慣用句を避けつつ、短い頌栄としての格調を保った。
