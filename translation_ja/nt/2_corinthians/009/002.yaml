revisions:
- from: あなたがたの熱意を私は知っているからです。そのことで私は、あなたがたについてマケドニアの人々に誇り、「アカイアでは昨年から準備ができている」[a]と言っています。そして、あなたがたの熱心さが彼らの大多数を奮い立たせたのです。[b]
  to: 私はあなたがたの熱意を知っているからです。私はあなたがたのことをマケドニアの人々に誇って、「アカイアは昨年から準備ができている」と言っています。[a]そして、あなたがたの熱心さは彼らの大多数を奮い立たせました。[b]
  rationale: 原文の語順と統語関係を逐語的に模倣するのではなく、「熱意」についてパウロがマケドニアの人々に誇っているという関係を、明瞭な現代標準語で再構成しました。現在形 καυχῶμαι は「言っています」で継続的な発言として表し、アオリスト ἠρέθισε は「奮い立たせました」で過去の刺激・結果として表しました。注のアンカーと内容は維持しています。
