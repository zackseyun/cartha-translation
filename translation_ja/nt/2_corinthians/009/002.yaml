reference: 2 Corinthians 9:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἶδα γὰρ τὴν προθυμίαν ὑμῶν ἣν ὑπὲρ ὑμῶν καυχῶμαι Μακεδόσιν ὅτι Ἀχαΐα παρεσκεύασται ἀπὸ πέρυσι, καὶ ⸀τὸ ὑμῶν ζῆλος ἠρέθισε τοὺς πλείονας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/009/002.yaml
  text: 'For I know your eagerness[a], which I boast about to the Macedonians on your behalf: that Achaia has been ready since last year[c][b], and your zeal has stirred up most of them.'
translation:
  language: ja
  text: 私はあなたがたの熱意を知っているからです。私はあなたがたのことをマケドニアの人々に誇って、「アカイアは昨年から準備ができている」と言っています。[a]そして、あなたがたの熱心さは彼らの大多数を奮い立たせました。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アカイア」はコリントを含むローマ属州で、ここではそこにいる信者たちを指しています。
    reason: cultural_note
  - marker: b
    text: 「彼らの大多数」は、マケドニアの人々の大多数という意味です。別訳「彼らの多くを」。
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμίαν
  choice: 熱意
  rationale: 進んで行おうとする心構えと意欲を表す。文脈上、単なる実務的な「準備」ではなく、献金への積極的な意志が焦点となるため、「熱意」とした。
- source_word: καυχῶμαι
  choice: 誇り……と言っています
  rationale: パウロが彼らについてマケドニアの人々に誇っているという強い修辞を弱めず、継続的な発言として自然な日本語にした。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたについて
  rationale: καυχῶμαιとの組み合わせで、彼らを好意的に語り誇る意味を、明瞭で自然な日本語で示す。
- source_word: Μακεδόσιν
  choice: マケドニアの人々
  rationale: 地域名だけではなく、与格複数が指す人々を明示する。文脈上は主に信者たちだが、本文ではそれを補足しすぎない。
- source_word: Ἀχαΐα
  choice: アカイア
  rationale: 原文の地理的名称を保持し、そこにいる信者たちを地域名で表す換喩も残す。
- source_word: παρεσκεύασται
  choice: 準備ができている
  rationale: 完了形が示す、以前の準備の結果として現在も整っている状態を自然に表す。
- source_word: ἀπὸ πέρυσι
  choice: 昨年から
  rationale: 前年を起点として現在まで続く状態を簡潔に示す。
- source_word: τὸ ὑμῶν ζῆλος
  choice: あなたがたの熱心さ
  rationale: 強い意欲を表すが、直前の προθυμίαν と日本語で完全に同語反復になるのを避け、「熱心さ」とした。
- source_word: ἠρέθισε
  choice: 奮い立たせた
  rationale: ここでは肯定的に刺激し行動を促した意味であり、否定的にも響きうる「いら立たせた」ではなく、文脈に合う表現を選んだ。
- source_word: τοὺς πλείονας
  choice: 彼らの大多数
  rationale: 比較級の名詞的用法を「大多数」とし、直前のマケドニアの人々を「彼ら」で明示した。
theological_decisions:
- issue: 「アカイア」の指示対象
  choice: 地名「アカイア」を保持し、そこにいる信者たちを地域名で表す原文の換喩を残した。
  alternative: 「あなたがた」または「アカイアの信者たち」と明示する。
  rationale: 原文は明確に Ἀχαΐα と述べており、コリントを含む地域的な広がりを保つのが適切である。
- issue: パウロの「誇る」という表現
  choice: 「誇り」と率直に訳した。
  alternative: 「高く評価している」「称賛している」と和らげる。
  rationale: καυχῶμαι の強い修辞を保ち、パウロの言い方を神学的・道徳的配慮から不必要に弱めないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロの誇りと勧奨の力を保った。「熱意／熱心さ」で関連語の近さを示しつつ、不自然な反復を避けた。引用符を用いて、ὅτι 以下がマケドニアの人々へのパウロの発言内容であることを明確にした。
