  yaml_path: translation/nt/2_corinthians/003/017.yaml
  text: The Lord is the Spirit[a], and where the Spirit of the Lord is, there is freedom.
translation:
  language: ja
  text: 主は霊です[a]。主の霊のあるところには、自由があります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主は霊です」という言葉は、両者の関係を神学的にどのように定義するかまで特定せず、文脈上の緊密な同定を表すものとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: パウロの神学的文脈と聖書日本語の慣用に従い、「主」とした。
- source_word: πνεῦμα
  choice: 霊
  rationale: 二例とも文脈上、聖霊を指すため「霊」とした。日本語では固有名的な大文字表記ができないが、第二節の「主の霊」が指示対象を明らかにする。
- source_word: δὲ
  choice: そして
  rationale: 第一の δέ は日本語では明示せず、文脈上の展開に委ねた。第二の δέ は二つの節を自然につなぐ「そして」で表した。
- source_word: οὗ
  choice: ところ
  rationale: 一般的な場所・領域を示す関係表現として、「主の霊がおられるところ」と自然な日本語にした。
- source_word: ἐλευθερία
  choice: 自由
  rationale: 現代日本語で自然であり、語の神学的な重みも保つ。
- source_word: ὁ δὲ κύριος τὸ πνεῦμά ἐστιν
  choice: 主は霊です
  rationale: 原文の直接的な同定文を弱めたり説明的に言い換えたりせず、その緊張を保った。
- source_word: τὸ πνεῦμα κυρίου
  choice: 主の霊
  rationale: 属格構文を簡潔かつ自然に再現した。
theological_decisions:
- issue: 「主は霊である」という同定文の関係を神学的にどう理解するか
  choice: 本文では「主は霊です」と直接的に訳した。
  alternative: 機能的または契約的な緊密な同定と理解する見方や、「主」を特にキリストと取る見方、より広く神を指すと取る見方がある。
  rationale: ギリシア語は同定を直接述べる一方、その関係をどのように定義すべきかまでは説明していない。翻訳で特定の教理的解釈に限定せず、原文の緊張を保持する。
translation_notes:
  register: 明快で現代的かつ品位ある標準日本語。「おられる」は聖霊を人格的主体として扱う文脈に適し、一般読者にも自然である。冒頭の δέ は不自然な「さて」「しかし」を加えず、前後の文脈に委ねた。
