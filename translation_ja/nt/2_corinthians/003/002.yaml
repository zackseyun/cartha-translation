  text: ἡ ἐπιστολὴ ἡμῶν ὑμεῖς ἐστε, ἐγγεγραμμένη ἐν ταῖς καρδίαις ἡμῶν, γινωσκομένη καὶ ἀναγινωσκομένη ὑπὸ πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/002.yaml
  text: You are our letter[a], written in our hearts, known and read by all people.
translation:
  language: ja
  text: あなたがたこそ、私たちの手紙です。私たちの心に書き記されていて、すべての人に知られ[a]、読まれているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての人に認められ、読まれている」とも訳せる。
    reason: γινωσκομένηには「知られる」のほか「認められる、見分けられる」という意味もあり、後続のἀναγινωσκομένηとの語感の重なりも考えられるため。
lexical_decisions:
- source_word: ἡ ἐπιστολὴ ἡμῶν
  choice: 私たちの手紙
  rationale: 所有を表す属格を自然に示し、コリントの人々をパウロたちの「手紙」とする比喩をそのまま保った。
- source_word: ὑμεῖς ἐστε
  choice: あなたがたこそ…です
  rationale: 明示された代名詞ὑμεῖςの強調を、現代日本語として自然な「こそ」で表した。
- source_word: ἐγγεγραμμένη
  choice: 書き記され
  rationale: 完了受動分詞が示す、書かれて現在もその状態にあるという含みを保ちつつ、手紙の比喩に合う表現とした。
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: 私たちの心に
  rationale: ἐνの位置関係を素直に訳し、複数形καρδίαιςは日本語で自然な集合的単数「心」とした。
- source_word: γινωσκομένη
  choice: 知られ
  rationale: 「知られる」と「認められる」の双方が可能だが、基本義を保ち、後続の「読まれる」と並ぶ簡潔な表現を選んだ。
- source_word: ἀναγινωσκομένη
  choice: 読まれ
  rationale: 手紙の比喩を明瞭に保つため、文字どおり「読む」を用いた。
- source_word: ὑπὸ πάντων ἀνθρώπων
  choice: すべての人に
  rationale: 行為者を示すὑπόを受動文の「に」で表し、ἄνθρωποιを性別に限定しない「人」と訳した。
