  text: ἡνίκα ⸂δὲ ἐὰν⸃ ἐπιστρέψῃ πρὸς κύριον, περιαιρεῖται τὸ κάλυμμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/016.yaml
  text: But whenever one turns to the Lord[b][a], the veil is removed.
translation:
  language: ja
  text: しかし、人が主に立ち返るときにはいつでも、覆いは取り除かれます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、人が主に立ち返るときには、覆いは取り去られます。」
    reason: 「いつでも」を用いずに時間節を簡潔に表す訳、およびπεριαιρεῖταιの別訳「取り去られます」を示す。
lexical_decisions:
- source_word: ἡνίκα δὲ ἐὰν
  choice: しかし、…ときはいつでも
  rationale: δέの対比的なつながりを「しかし」で保ち、ἡνίκαとἐὰνおよび接続法が表す不定の時を「ときはいつでも」で自然に示す。
- source_word: ἐπιστρέψῃ
  choice: 立ち返る
  rationale: 主のもとへ向きを変えるという方向性を保ちつつ、文脈に適した自然な日本語とする。「回心する」のように神学的意味を狭く限定しない。
- source_word: πρὸς κύριον
  choice: 主に
  rationale: πρός＋対格が示す人への方向を、動詞「立ち返る」と結びつく自然な日本語で表す。
- source_word: κύριον
  choice: 主
  rationale: 本文が明示する称号だけを訳し、ここでキリストまたは御霊と特定する解釈を訳文に加えない。
- source_word: περιαιρεῖται
  choice: 取り除かれます
  rationale: 現在受動態を保ち、覆いに何が起こるかを述べる。行為者は原文どおり明示しない。
- source_word: τὸ κάλυμμα
  choice: 覆い
  rationale: 直前の文脈でモーセの顔を覆う物を指すと同時に比喩的意味を帯びるため、両方に対応できる「覆い」を用いる。
theological_decisions:
- issue: ἐπιστρέψῃの明示されていない主語
  choice: 「人が」を補う
  alternative: 主語を省略して「主に立ち返るときはいつでも」とする
  rationale: ギリシア語には主語名詞がなく不特定の単数を示す。日本語で一般性を明瞭にするため「人が」を補うが、個人的・集団的範囲をそれ以上限定しない。
- issue: 「主」の同定
  choice: 単に「主」と訳す
  alternative: 「主キリスト」または「主、すなわち御霊」と明示する
  rationale: 周辺文脈には主と御霊の複雑な関係があるが、この節自体はκύριονとだけ述べるため、神学的緊張と解釈上の余地を保つ。
- issue: 「覆い」の除去の行為者
  choice: 受動表現のまま行為者を明示しない
  alternative: 「神が覆いを取り除かれます」とする
  rationale: 原文の受動態は行為者を明示しないため、訳文でも補わない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、聖書本文としての品位を保った。「ベール」ではなく、物理的・比喩的用法の双方に自然な「覆い」を採用した。敬体で統一した。
