source:
  edition: SBLGNT
  text: ὃς καὶ ἱκάνωσεν ἡμᾶς διακόνους καινῆς διαθήκης, οὐ γράμματος ἀλλὰ πνεύματος, τὸ γὰρ γράμμα ἀποκτέννει, τὸ δὲ πνεῦμα ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/006.yaml
  text: who also made us competent as servants of a new covenant[a], not of the letter but of the Spirit; for the letter kills[c][b], but the Spirit gives life.
translation:
  language: ja
  text: 神はまた、私たちを、文字によるのではなく御霊による新しい契約に仕える者として、務めを果たすにふさわしい者にしてくださいました。文字は殺しますが、御霊は命を与えるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱκάνωσεν
  choice: その務めを果たせる者にしてくださいました
  rationale: 神が務めに必要な力と適性を与えたことを、資格認定だけを連想させず、自然な現代日本語で表す。
- source_word: διακόνους
  choice: 仕える者
  rationale: 後代の教会職制を不必要に持ち込まず、διάκονοςの奉仕する者という基本的な意味を保つ。
- source_word: καινῆς διαθήκης
  choice: 新しい契約
  rationale: 冠詞のないギリシア語句を自然に訳しつつ、パウロの議論における契約概念を明確に保つ。
- source_word: γράμματος / γράμμα
  choice: 文字
  rationale: 御霊との簡潔で鋭い対比を保ち、「書かれた規定」という解釈に本文を限定しない。
- source_word: πνεύματος / πνεῦμα
  choice: 御霊
  rationale: 新しい契約と命を与える働きという文脈では聖霊を指す可能性が高い。原文には大文字・小文字による区別がないため、別解を脚注に残す。
- source_word: ἀποκτέννει
  choice: 殺します
  rationale: 原文の直接的で強い現在形の表現を維持する。
- source_word: ζῳοποιεῖ
  choice: 命を与える
  rationale: 生命を生じさせる働きを、明瞭で自然な現代日本語で表す。
theological_decisions:
- issue: πνεῦμαを聖霊と理解するか、より一般的な「霊」と理解するか
  choice: 御霊
  alternative: 霊
  rationale: 新しい契約の文脈では聖霊が最も可能性の高い指示対象だが、ギリシア語本文そのものは表記上この区別を示さないため、別解を脚注に明記する。
- issue: 「文字は殺す」を解釈的に言い換えるか
  choice: 文字は殺します
  alternative: 書かれた規定は死をもたらします
  rationale: 律法や旧い契約についての含意は文脈にあるが、本文では簡潔な対句となっているため、特定の神学的説明に狭めず緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「してくださいました」により神の能動的な備えを表しつつ、「文字」と「御霊」の簡潔な対比と神学的緊張を保持した。
