id: 2CO.3.10
reference: 2 Corinthians 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ οὐ δεδόξασται τὸ δεδοξασμένον ἐν τούτῳ τῷ μέρει ⸀εἵνεκεν τῆς ὑπερβαλλούσης δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/010.yaml
  text: For indeed[a], what had been glorified has not been glorified in this respect, because of the glory that surpasses it.
translation:
  language: ja
  text: 実に、栄光を受けたものも、この点では、まさる栄光のゆえに、栄光を受けたことにはなりません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ γὰρ
  choice: 実に
  rationale: 文脈を受ける説明と強調を、過度に硬くならない現代日本語で表した。日本語では接続詞を重ねずとも、この語で両方の働きを自然に示せる。
- source_word: δεδόξασται
  choice: 栄光を与えられてはいません
  rationale: 完了受動の形と、直前の分詞との語根の反復を保った。文脈上、過去の栄光を絶対的に否定するのではなく、より大きな栄光との比較において否定している。
- source_word: τὸ δεδοξασμένον
  choice: 栄光を与えられたもの
  rationale: 冠詞付き完了受動分詞を名詞的に訳し、原文にない「契約」「務め」などの名詞を補わなかった。
- source_word: ἐν τούτῳ τῷ μέρει
  choice: この点では
  rationale: 否定が特定の比較の観点に限られることを、簡潔で自然な日本語で示した。
- source_word: εἵνεκεν
  choice: のゆえに
  rationale: 原因・理由を明示しつつ、聖書本文にふさわしい品位を保つ表現とした。
- source_word: τῆς ὑπερβαλλούσης δόξης
  choice: それをはるかにしのぐ栄光
  rationale: 現在分詞の比較的な力を動詞的に表した。「それを」は文脈上の以前の栄光を指す補足であり、原文には目的語が明記されていないため注記した。
- source_word: δόξα / δεδοξασμένον
  choice: 栄光を与えられた……栄光……栄光を与えられて
  rationale: δοξ-語群の反復を日本語でも見える形にし、パウロの逆説的な言い回しを保った。
theological_decisions:
- issue: 以前の契約に伴う栄光を絶対的に否定しているのか、より大きな栄光との比較において否定しているのか
  choice: 「この点では」を保持し、以前の栄光が、はるかにしのぐ栄光との比較では栄光とみなされないという比較的否定として訳す。
  alternative: 以前の務めには真の栄光がまったくなかったという絶対的否定。
  rationale: ἐν τούτῳ τῷ μέρει が否定の範囲を限定しており、周辺文脈も以前の務めに栄光があったことを認めた上で、後の栄光がそれをしのぐと述べている。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「栄光を与えられた」という反復をあえて残し、原文の逆説と修辞を保持した。「ゆえに」はやや格調のある語だが、文全体の尊厳と因果関係の明瞭さに適している。
