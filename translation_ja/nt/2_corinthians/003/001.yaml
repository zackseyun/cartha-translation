  yaml_path: translation/nt/2_corinthians/003/001.yaml
  text: Are we beginning again to commend ourselves? Or do we need[a], like some, letters of recommendation to you or from you?
translation:
  language: ja
  text: 私たちはまた、自分たちを推薦し始めているのでしょうか。それとも、ある人たちのように、あなたがたに宛てた推薦状、あるいはあなたがたからの推薦状を必要としているのでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀρχόμεθα
  choice: 始めているのでしょうか
  rationale: 現在形の継続的・起動的な含みを保ちつつ、修辞疑問として自然な現代日本語にした。
- source_word: πάλιν
  choice: また
  rationale: 同じ行為の繰り返しを簡潔に表す。
- source_word: ἑαυτοὺς συνιστάνειν
  choice: 自分自身を推薦し
  rationale: 再帰代名詞を明示し、動詞がここで表す、自分を好意的に紹介して承認を得ようとする意味を「推薦する」で表した。後半の「推薦状」との語義上のつながりも保つ。
- source_word: χρῄζομεν
  choice: 必要なのでしょうか
  rationale: 必要を有するという意味を、修辞疑問に適した自然な表現で訳した。
- source_word: ὥς τινες
  choice: ある人たちのように
  rationale: 比較の意味と、対象となる人々が特定されていないことを保った。
- source_word: συστατικῶν ἐπιστολῶν
  choice: 推薦状
  rationale: 人物を紹介し、その信頼性を保証する書状を指す定型的な意味を、現代日本語で明瞭に表した。
- source_word: πρὸς ὑμᾶς ἢ ἐξ ὑμῶν
  choice: あなたがたに宛てた、あるいはあなたがたからの
  rationale: πρόςの方向とἐξの出所をそれぞれ明示し、二つの可能性を並列した。
theological_decisions:
- issue: パウロの問いが想定する答え
  choice: 二つの文をともに修辞疑問として訳し、否定の答えを本文に補わない
  alternative: 「もちろん必要ではありません」などの答えを明示する
  rationale: μήは否定的な答えを予期させるが、原文は答えそのものを述べていないため、含意にとどめた。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。原文の二段階の修辞疑問と、「推薦する／推薦状」の語義的な連関を保持した。
