reference: 2 Corinthians 3:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ πάντες ἀνακεκαλυμμένῳ προσώπῳ τὴν δόξαν κυρίου κατοπτριζόμενοι τὴν αὐτὴν εἰκόνα μεταμορφούμεθα ἀπὸ δόξης εἰς δόξαν, καθάπερ ἀπὸ κυρίου πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/018.yaml
  text: And we all[a], with unveiled face, beholding the glory of the Lord as in a mirror, are being transformed into the same image from glory to glory, just as from the Lord[b], the Spirit.
translation:
  language: ja
  text: 私たちは皆、顔の覆いを取り除かれて、鏡に映して見るように主の栄光を見つめながら[a]、同じかたちへと、栄光から栄光へと変えられていきます。主、すなわち霊から来るものとしてです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「鏡のように主の栄光を映し出しながら」。
    reason: alternative_reading
  - marker: b
    text: 別訳「主である霊から」。または「主の霊から」。ギリシア語の結びは簡潔で、両語の関係には解釈の余地があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνακεκαλυμμένῳ προσώπῳ
  choice: 覆いを取り除かれた顔で
  rationale: 完了分詞が示す、覆いを取り除かれた結果としての現在の状態を自然な日本語で表し、単数形の「顔」も保持した。
- source_word: δόξαν κυρίου
  choice: 主の栄光
  rationale: 属格を素直に訳し、κύριοςには一般的で荘重な「主」を用いた。
- source_word: κατοπτριζόμενοι
  choice: 鏡に映るように…見つめつつ
  rationale: 鏡を介して見るという中動態の有力な語義を採用した。「鏡のように映し出す」という別解も可能なため脚注に残した。
- source_word: τὴν αὐτὴν εἰκόνα
  choice: その同じ姿
  rationale: 直前の主の栄光との連関を保ちつつ、変容の到達像として日本語で自然な「姿」を選んだ。
- source_word: μεταμορφούμεθα
  choice: 変えられていきます
  rationale: 現在受動態が表す進行中の変容を明確にした。
- source_word: ἀπὸ δόξης εἰς δόξαν
  choice: 栄光から栄光へと
  rationale: ギリシア語の簡潔で含蓄ある表現を保ち、「栄光の段階」などの説明を本文に加えなかった。
- source_word: καθάπερ
  choice: これは…ことです
  rationale: ここでは変容の源を示す結びとして日本語の文脈に自然に統合した。比較・対応の含みは保ちつつ、ぎこちない直訳を避けた。
- source_word: ἀπὸ κυρίου πνεύματος
  choice: 霊である主から来る
  rationale: 圧縮された句を、κύριοςとπνεῦμαの同格的理解に基づいて訳した。ただし「主の霊から」という別の統語的理解を脚注に示した。
- source_word: κύριος
  choice: 主
  rationale: 両方の用例に、現代日本語の聖書文体で定着し、尊厳を備えた訳語を用いた。
theological_decisions:
- issue: κατοπτριζόμενοι の意味
  choice: 鏡に映るように主の栄光を見つめる
  alternative: 鏡のように主の栄光を映し出す
  rationale: 主の栄光を見ることから変容へ進む文脈には「見つめる」がよく適合するが、動詞には反射する意味も認められるため、脚注で曖昧さを保存した。
- issue: 結句の κυρίου と πνεύματος の関係
  choice: 霊である主から
  alternative: 主の霊から
  rationale: 無冠詞の二語から成る圧縮表現は同格にも属格的関係にも解し得る。本文では有力な同格理解を明瞭な日本語にし、別解を脚注に保存した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「主」「栄光」などの定着した聖書語彙を保った。長い一文を二文に分け、原文の論理関係と荘重さを損なわず読みやすくした。
