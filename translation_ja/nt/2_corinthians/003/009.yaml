reference: 2 Corinthians 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ ⸂τῇ διακονίᾳ⸃ τῆς κατακρίσεως δόξα, πολλῷ μᾶλλον περισσεύει ἡ διακονία τῆς ⸀δικαιοσύνης δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/009.yaml
  text: For if the ministry of condemnation came with glory[a], much more does the ministry of righteousness abound in glory.
translation:
  language: ja
  text: というのも、罪に定める務めに栄光が伴ったのなら、義[a]の務めは、なおさら栄光に満ちあふれているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義をもたらす務め」とも訳せる。また、「義」は「正義」とも訳せる。
    reason: τῆς δικαιοσύνηςという属格関係の曖昧さと、δικαιοσύνηの語義上の代案を保存するため。
lexical_decisions:
- source_word: διακονία
  choice: 務め
  rationale: この文脈では、個々の奉仕行為ではなく、神から託された契約上の働きを指すため、「務め」とした。
- source_word: κατάκρισις
  choice: 罪に定める
  rationale: 有罪判決・断罪という法廷的意味を保ちつつ、「罪に定める務め」という自然な日本語にした。
- source_word: δόξα
  choice: 栄光
  rationale: 前後の議論との用語上の連続性と神学的含意を保つ標準的な訳語である。
- source_word: πολλῷ μᾶλλον
  choice: なおさら
  rationale: 比較を強めるギリシャ語の慣用表現を、明瞭で自然な日本語にした。
- source_word: περισσεύω
  choice: 満ちあふれている
  rationale: 単に優れているだけでなく、豊かにあふれるという動詞の強い量的イメージを保った。
- source_word: δικαιοσύνη
  choice: 義
  rationale: パウロ書簡における法廷的・関係的な意味の幅を保つ定着した訳語。「正義」の可能性は脚注に示した。
- source_word: εἰ γὰρ τῇ διακονίᾳ … δόξα
  choice: というのも、…務めに栄光が伴ったのなら
  rationale: 原文の第一節は動詞を欠くため、日本語では「伴った」を補った。静的な所有に限定せず、その務めが栄光を伴って現れたという文脈上の含みを表す。
theological_decisions:
- issue: δικαιοσύνηを二つの務めの対比の中でどう訳すか
  choice: 義
  alternative: 正義
  rationale: ここでは「罪に定めること」と対照される、神の前で正しいとされることに関わる意味が前景化しているため、本文では「義」とした。ただし語の意味範囲には「正義」も含まれるので脚注に残した。
- issue: τῆς δικαιοσύνηςを結果的意味で表すか
  choice: 義をもたらす務め
  alternative: 義の務め
  rationale: 属格の関係は明示されておらず「義に関わる務め」とも取れるが、「罪に定める務め」との対照を自然な日本語で示すため結果的意味を本文に採った。断定を避け、脚注で直訳的代案を示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、パウロの議論にふさわしい荘重さを保った。「というのも」で前節との論理的連結を示し、「なおさら」と「満ちあふれている」で比較の強まりを表した。
