  text: For if what was being brought to an end came with glory[c][b][a], much more what remains is in glory.
translation:
  language: ja
  text: もし、廃されていくものが栄光を伴っていたのなら[a]、残るものは、なおさら栄光のうちにあります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「終わらされていくもの」「無効にされていくもの」。また、「栄光を伴っていた」は直訳すると「栄光を通して」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταργούμενον
  choice: 廃されつつあるもの
  rationale: 現在受動分詞の進行的な響きと、「無効にされる／終わらされる／廃される」という語義を保つ。文脈に基づく「消え去る」よりも原語に直接的でありながら、完了済みとも断定しない。
- source_word: διὰ δόξης
  choice: 栄光を伴っていた
  rationale: 属格を伴うδιάの「栄光を通して」という形を逐語的に再現すると日本語では不明瞭になるため、そのものが栄光を帯びて現れたという文脈上の関係を自然に表した。
- source_word: μένον
  choice: いつまでも残るもの
  rationale: μένωの「とどまる、存続する」を表し、前半の一時的なものとの対照を明確にする。「いつまでも」は継続性を自然な日本語で示す。
- source_word: ἐν δόξῃ
  choice: 栄光に包まれています
  rationale: 直訳的な「栄光のうちにある」が持つ状態・領域の意味を、自然で格調ある日本語にした。単に「栄光あるもの」とせず、前置詞句の像を保った。
- source_word: πολλῷ μᾶλλον
  choice: なおさら
  rationale: 比較を強める定型表現を簡潔で自然な日本語にした。
theological_decisions:
- issue: 廃されるものと残るものが何を指すか
  choice: 原文どおり中性の実体化された分詞を「もの」と訳し、この節では対象を明示しない。
  alternative: 「古い契約の務め」と「新しい契約の務め」を本文に補う。
  rationale: 直接の文脈は両者を示唆するが、この節自体は名指ししていないため、パウロの修辞と解釈上の余地を保つ。
- issue: καταργούμενονの時間的・神学的含意
  choice: 「廃されつつある」とし、進行性と受動性を保つ。
  alternative: 「消え去るもの」「すでに廃されたもの」。
  rationale: 「消え去る」は文脈的だが語義を狭め、「すでに廃された」は分詞の進行的な形を過度に確定するため避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、対句の荘重さを保った。「廃されつつある」は日常語よりやや硬いが、原語の受動性と進行性を簡潔に伝えるため採用した。
