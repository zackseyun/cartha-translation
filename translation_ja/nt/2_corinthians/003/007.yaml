  yaml_path: translation/nt/2_corinthians/003/007.yaml
  text: But if the ministry of death[a], engraved in letters on stones, came with glory, so that the sons of Israel were not able to gaze at Moses’ face because of the glory of his face, which was fading away[b],
translation:
  language: ja
  text: しかし、石に刻まれた文字による死の務めが栄光のうちに生じ、イスラエルの子ら[a]がモーセの顔を見つめることができなかったほどであったのなら――その顔の栄光が消え去りつつあったために――、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子ら」は、「イスラエル人」と訳すこともできる。ここではギリシア語の男性複数の表現をより直接に反映した。
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονία τοῦ θανάτου
  choice: 死の務め
  rationale: 属格を簡潔に保ち、死をもたらすという解釈を本文に補わず、パウロの鋭い表現と契約的な対比を保持する。「務め」は奉仕と委ねられた役割の両面を表せる。
- source_word: ἐν γράμμασιν ἐντετυπωμένη λίθοις
  choice: 文字によって石に刻まれた
  rationale: γράμμασιν の「文字」と、ἐντετυπωμένη の刻印の意味を明示する。λίθοις は複数形の「石」とし、本文に明記されていない「石の板」は補わない。
- source_word: ἐγενήθη ἐν δόξῃ
  choice: 栄光を伴って現れ
  rationale: 出来事として生じたことと栄光の随伴を、過度に「制定された」と解釈せず自然な日本語で表す。
- source_word: ὥστε μὴ δύνασθαι ἀτενίσαι
  choice: そのため……見つめることができなかった
  rationale: 結果を表す構文を保ち、ἀτενίζω のじっと注視する意味を「見つめる」で表す。
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: イスラエルの子ら
  rationale: 一般的な「イスラエル人」へ平板化せず、ギリシア語の男性複数表現を日本語として理解可能な形で反映する。
- source_word: εἰς τὸ πρόσωπον Μωϋσέως
  choice: モーセの顔を
  rationale: 前置詞句の対象を自然な日本語で具体的に示す。
- source_word: καταργουμένην
  choice: 消え去りつつある
  rationale: モーセの顔にある目に見える栄光という直近の文脈に適しつつ、進行中の一時性を表す。ただし「終わらされつつある」という語義上の可能性も脚注に残す。
theological_decisions:
- issue: καταργουμένην が栄光の視覚的な減衰を指すのか、終結へ向かうことをより抽象的に指すのか
  choice: 消え去りつつある
  alternative: 終わらされつつある／過ぎ去りつつある
  rationale: 直前の焦点はモーセの顔に現れた栄光であるため、本文では視覚的かつ一時的な性質が伝わる表現を採用する。一方、旧い契約の終結にもつながる広い含意を限定しないよう、代案を脚注に示す。
- issue: διακονία τοῦ θανάτου の属格の関係
  choice: 死の務め
  alternative: 死をもたらす務め
  rationale: 結果を表す属格と理解し得るが、本文では関係を明示しすぎず、原文の簡潔さと神学的な緊張を保持する。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、パウロの条件文が次節へ続く構造を文末の「なら、」で保持した。「死の務め」「栄光」などの神学的に重要な表現は簡潔かつ格調を保ち、説明的な言い換えを本文へ過度に持ち込まない。
