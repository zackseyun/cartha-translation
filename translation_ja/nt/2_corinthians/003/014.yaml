source:
  edition: SBLGNT
  text: ἀλλὰ ἐπωρώθη τὰ νοήματα αὐτῶν. ἄχρι γὰρ τῆς σήμερον ⸀ἡμέρας τὸ αὐτὸ κάλυμμα ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης μένει μὴ ἀνακαλυπτόμενον, ⸀ὅτι ἐν Χριστῷ καταργεῖται,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/014.yaml
  text: But their minds were hardened[a]. For until this very day, at the reading of the old covenant, the same veil remains, not being lifted[b], because in Messiah it is removed.
translation:
  language: ja
  text: しかし、彼らの理解力は鈍くなりました。実に今日に至るまで、古い契約が朗読されるとき、同じ覆いが取り除かれないまま残っています。というのは、メシアにあってその覆いが取り除かれるからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その覆い」を指すと取った。別訳「古い契約はメシアにあって廃される（または、無効にされる）」。原文では「取り除かれる／廃される」の主語が明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπωρώθη
  choice: 鈍くされました
  rationale: 受動態を保ちつつ、理解や霊的感受性が鈍くなったという文脈上の意味を自然な現代日本語で表す。
- source_word: τὰ νοήματα αὐτῶν
  choice: 彼らの思い
  rationale: νοήματαは思考・理解の働きを指す。「思い」はパウロの議論に適し、「心」より原語の認知的側面を保つ。
- source_word: ἄχρι γὰρ τῆς σήμερον ἡμέρας
  choice: 実に今日に至るまで
  rationale: γάρの説明的つながりと、現在まで続くことへの時間的強調を表す。
- source_word: τὸ αὐτὸ κάλυμμα
  choice: 同じ覆い
  rationale: モーセの覆いという周辺文脈の比喩を保つ。「覆い」は顔を覆う物と理解を遮る物の双方に自然に用いうる。
- source_word: ἐπὶ τῇ ἀναγνώσει τῆς παλαιᾶς διαθήκης
  choice: 古い契約が朗読されるとき
  rationale: διαθήκηを原義どおり「契約」とし、名詞構文を明瞭な日本語の受動節にする。
- source_word: μένει μὴ ἀνακαλυπτόμενον
  choice: 取り除かれないまま残っています
  rationale: 継続を表すμένειと受動分詞を自然に結び、覆いの比喩を維持する。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: Χριστόςの称号としての意味を「メシア」で示し、ἐνの結合・領域の含みを伝統的だが理解可能な「あって」で保つ。
- source_word: καταργεῖται
  choice: 取り除かれる
  rationale: 直近の主語候補である「覆い」を受ける読みでは自然であり、受動態も保つ。ただし「古い契約が廃される」という統語上可能な読みは脚注に残す。
theological_decisions:
- issue: καταργεῖταιの暗黙の主語
  choice: 直近の「覆い」を受け、「それは、メシアにあって取り除かれる」とした。
  alternative: 「古い契約はメシアにあって廃される／無効にされる」、または覆いと契約の間の曖昧さを本文でも残す。
  rationale: 直近の先行詞は「同じ覆い」であり、直前の「取り除かれない」とも比喩的に連続するため、この読みが最も自然である。一方、文法的な主語が明示されておらず、「古い契約」を受ける可能性もあるため脚注で重要な曖昧さを明記した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「古い契約」は原語διαθήκηを優先し、「旧約」という伝統的名称に置き換えない。「メシアにあって」は神学的なἐν Χριστῷの含みを過度に説明せず保持する。
