language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: φανερούμενοι ὅτι ἐστὲ ἐπιστολὴ Χριστοῦ διακονηθεῖσα ὑφ’ ἡμῶν, ἐγγεγραμμένη οὐ μέλανι ἀλλὰ πνεύματι θεοῦ ζῶντος, οὐκ ἐν πλαξὶν λιθίναις ἀλλ’ ἐν πλαξὶν καρδίαις σαρκίναις.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/003.yaml
  text: showing that you are a letter from the Messiah[a], ministered by us, written not with ink but with the Spirit of the living God[d][c][b], not on stone tablets but on tablets of hearts of flesh.
translation:
  language: ja
  text: あなたがたが、私たちの奉仕によるメシアからの手紙[a]であることは明らかです。それは、墨ではなく生ける神の霊によって、石の板ではなく肉の心である板に書かれたものです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「メシアの手紙」。ギリシア語の属格はそのようにも訳せます。「メシア」は伝統的に「キリスト」と訳される称号です。
    reason: alternative_reading
  - marker: b
    text: 「肉の心」は、神が石の心を取り除いて肉の心を与えるという旧約聖書の表現を思わせます（エゼキエル11章19節、36章26節参照）。
    reason: cross_reference
lexical_decisions:
- source_word: φανερούμενοι
  choice: はっきり示しています
  rationale: 受動的な形を保ちつつ、文脈上、コリントの人々自身が公に明らかな手紙となっていることを自然な日本語で表す。
- source_word: ἐπιστολὴ Χριστοῦ
  choice: メシアからの手紙
  rationale: ἐπιστολήは現代語の「手紙」とし、Χριστοῦは手紙の起源・著者を示す属格と理解した。「メシアの手紙」という読みも可能なので脚注に残す。
- source_word: διακονηθεῖσα ὑφ’ ἡμῶν
  choice: 私たちの奉仕によって書かれた
  rationale: διακονέωの奉仕・務めの含意を保つ。日本語では「奉仕された手紙」が不自然なため、手紙の比喩の中で、パウロたちの奉仕を通して成立したことを表した。
- source_word: ἐγγεγραμμένη
  choice: 書かれた
  rationale: 墨、石の板、心の板という一連の比喩に最も自然に対応する。
- source_word: μέλανι
  choice: 墨
  rationale: 古代の筆記材料を指す語として簡潔で自然な対応語。
- source_word: πνεύματι θεοῦ ζῶντος
  choice: 生ける神の霊
  rationale: 神の働く霊を指す文脈を保ち、「生ける神」という聖書的表現を用いた。
- source_word: πλαξὶν λιθίναις
  choice: 石の板
  rationale: シナイ契約の石板への暗示を明瞭に保つ。
- source_word: πλαξὶν καρδίαις σαρκίναις
  choice: 肉の心という板
  rationale: 板と心を同格的に結び、板そのものが肉の心であるという像を自然な日本語で示す。「肉の心」はエゼキエル書の新しい契約を思わせる表現を保持する。
theological_decisions:
- issue: Χριστοῦの属格
  choice: メシアからの手紙
  alternative: メシアの手紙／キリストの手紙
  rationale: 手紙の比喩では起源または著者を示す読みが有力だが、より形式的な所有・関係の属格も可能なため脚注で残した。Χριστόςは称号としての意味を示すため「メシア」とした。
- issue: πνεύματιの指示対象
  choice: 生ける神の霊
  alternative: 生ける神の息／霊
  rationale: 墨との対比と契約の文脈から神の霊を指すと判断できる。ただし日本語では不必要に説明を加えず、原文どおり「神の霊」とした。
- issue: 心と板の関係
  choice: 肉の心という板
  alternative: 肉の心の板
  rationale: καρδίαις σαρκίναιςは「板」を説明する同格的表現と理解し、心が板であるという比喩を明確にした。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「生ける神」「肉の心」など、原文の聖書的連想を担う表現は保持した。文を二つに分け、長い分詞構文を普通の読者にも追いやすくした。
