  to: あなたがたが、私たちの奉仕によるメシアからの手紙[a]であることは明らかです。それは、墨ではなく生ける神の霊によって、石の板ではなく肉の心である板に書かれたものです[b]。
  rationale: 受動分詞φανερούμενοιを「明らかです」とし、διακονηθεῖσαとἐγγεγραμμένηを区別した。「私たちの奉仕による」は、パウロたちがこの比喩的な手紙に関わる務めを担ったことを自然な日本語で表しつつ、原文が明示しない具体的手段を付け加えない。最後は「肉の心である板」として、石の板に対する内的な書き付けという比喩を保った。
