translation:
  language: ja
  text: ですから、このような希望を抱いている私たちは、実に大胆に振る舞っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大いに率直に振る舞っています」。または「大いに開かれた態度を取っています」。
    reason: παρρησίᾳ χρώμεθαは、直訳的には「大いなる大胆さ／率直さを用いる・発揮する」の意であり、「大胆さ」のほか率直さ・開放性の含意を持ち得るため。原文に明示されない「語る」は本文・脚注ともに必要以上に補わない。
lexical_decisions:
- source_word: Ἔχοντες
  choice: 抱いているので
  rationale: 分詞を文脈上の理由を示すものと捉え、主節との論理的関係を自然な現代日本語で表した。
- source_word: οὖν
  choice: ですから
  rationale: 直前までの議論から導かれる推論を明確に示す接続表現とした。
- source_word: τοιαύτην
  choice: このような
  rationale: 前述の希望の性質を受ける指示的・質的な意味を簡潔に表した。
- source_word: ἐλπίδα
  choice: 希望
  rationale: 周辺文脈における将来への確信を含む標準的な訳語。
- source_word: πολλῇ
  choice: 実に
  rationale: παρρησίᾳの程度を強める働きを、自然な日本語の副詞で表した。
- source_word: παρρησίᾳ
  choice: 大胆に
  rationale: 覆いを掛けることとの対比を踏まえ、臆せず公然と振る舞う意味を本文に採用した。率直さ・公然性という語義は脚注に残した。
- source_word: χρώμεθα
  choice: 振る舞っています
  rationale: 与格を伴う中動態の「用いる、行使する」を、目的語を不自然に補わず、人の態度・行動として自然に表した。
theological_decisions:
- issue: παρρησίαが指す範囲
  choice: 発言だけに限定せず、「大胆に振る舞う」とした。
  alternative: 「率直に語る」または「大胆に語る」
  rationale: 語は自由で率直な発言を含み得るが、この節には「語る」という動詞が明示されていないため、行動全般を含み得る曖昧さを保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、パウロの論証を示す「ですから」を保った。「抱いている」は希望を持つことの自然な表現。「振る舞っています」により、原文にない「語る」へ本文を限定することを避けた。
