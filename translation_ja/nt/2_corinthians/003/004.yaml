  yaml_path: translation/nt/2_corinthians/003/004.yaml
  text: Such confidence we have through Messiah toward God[a][b].
translation:
  language: ja
  text: 私たちは、メシア[a]を通して神に対して、このような確信を抱いています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。
    reason: Χριστόςの日本語聖書で定着した慣用訳を示すため。
lexical_decisions:
- source_word: Πεποίθησιν
  choice: 確信
  rationale: 文脈上、神の前での務めについて抱く揺るがない確かさを表し、「信頼」よりも対象を不必要に限定しない。
- source_word: δὲ τοιαύτην
  choice: このような
  rationale: 前節までの内容を受けるτοιαύτηνの指示的・質的な意味を、自然な現代日本語で示す。δὲは日本語では明示せず、文脈の流れによって軽い接続を表した。
- source_word: ἔχομεν
  choice: 抱いています
  rationale: 「確信を持っています」も可能だが、「確信を抱く」が自然で格調を保った日本語となる。
- source_word: διὰ τοῦ Χριστοῦ
  choice: キリストを通して
  rationale: 属格を伴うδιάの媒介・手段の意味を「通して」で表した。Χριστόςは日本語で広く定着した「キリスト」とし、称号としての意味が明確になる「メシア」を脚注に示した。
- source_word: πρὸς τὸν θεόν
  choice: 神に対して
  rationale: πρόςの方向・関係性をできるだけ保つ訳。「神の前で」という文脈的で自然な理解も可能なため脚注に示した。
theological_decisions:
- issue: Χριστοῦを称号としてどう表すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは「油注がれた者」という称号だが、日本語の聖書用語として「キリスト」が最も自然で広く理解される。称号性を明示する別訳「メシア」を脚注に残した。
- issue: πρὸς τὸν θεόνの関係的意味
  choice: 神に対して
  alternative: 神の前で
  rationale: 原文の方向性を保ち、確信が神に向けられ、神との関係において成り立つという曖昧さを残した。「神の前で」は文脈に適うが、法廷的・臨在的含意を強めうるため別訳とした。
translation_notes:
  register: 明瞭で現代的ながら、書簡にふさわしい端正な敬体を用いた。語順は媒介者であるキリストを先に置き、その後に神との関係を示すことで、原文の論理関係を自然な日本語で保った。
