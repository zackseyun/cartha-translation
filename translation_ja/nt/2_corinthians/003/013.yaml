id: 2CO.3.13
reference: 2 Corinthians 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐ καθάπερ Μωϋσῆς ἐτίθει κάλυμμα ἐπὶ τὸ πρόσωπον ⸀αὐτοῦ, πρὸς τὸ μὴ ἀτενίσαι τοὺς υἱοὺς Ἰσραὴλ εἰς τὸ τέλος τοῦ καταργουμένου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/013.yaml
  text: and not like Moses[b][a], who used to put a veil over his face so that the sons of Israel would not gaze at the end of what was fading away.
translation:
  language: ja
  text: 私たちは、モーセのようにはしません。モーセは、イスラエルの人々[b]が、消え去りつつあるものの終わり[a]をじっと見つめないように、顔に覆いを掛けていました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「終わらされつつあるものの目標（または帰結）」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: ギリシア語では「イスラエルの子ら」。ここではイスラエルの人々を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: 〜のように
  rationale: 前節の「私たち」の振る舞いとモーセの振る舞いとの比較を、自然な現代日本語で示す。
- source_word: ἐτίθει
  choice: いつも……掛けていました
  rationale: 未完了過去が示しうる反復的・習慣的な行為を明確に表す。
- source_word: κάλυμμα
  choice: 覆い
  rationale: 顔を覆う物を自然に表しつつ、後続箇所で展開される比喩にも対応できる語である。
- source_word: πρὸς τὸ μὴ ἀτενίσαι
  choice: じっと見つめることのないように
  rationale: 目的を示す構文と、ἀτενίζωの「凝視する」という強い視線の意味を保つ。
- source_word: τοὺς υἱοὺς Ἰσραήλ
  choice: イスラエルの人々
  rationale: 字義的には「イスラエルの子ら」だが、ここではイスラエル共同体を指す聖書的慣用句なので、明瞭な現代日本語とした。字義は脚注に示す。
- source_word: εἰς τὸ τέλος
  choice: 終わりを
  rationale: τέλοςの基本的な可能性の一つであり、直後の「消え去りつつある」との結びつきを保つ。「目標・帰結」の可能性は脚注に残す。
- source_word: τοῦ καταργουμένου
  choice: 消え去りつつあるものの
  rationale: 現在分詞の進行的な側面を示し、文脈上の過ぎ去る栄光との関連を自然に表す。ただし「終わらされつつあるもの」とも訳せる。
theological_decisions:
- issue: τέλος τοῦ καταργουμένου の意味
  choice: 「消え去りつつあるものの終わり」
  alternative: 「終わらされつつあるものの目標／帰結」
  rationale: 直近の文脈にある一時的なものと存続するものとの対比には「終わり」がよく合うが、τέλοςには「目標・帰結」も、καταργουμένουには受動的な「終わらされる」もありうるため、本文で一義的に解釈を固定せず脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く比較を、日本語で理解しやすいよう二文に分けた。「いつも」で未完了過去の習慣性を表し、「じっと見つめる」でἀτενίζωの強意を保った。
