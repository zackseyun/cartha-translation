  text: πῶς οὐχὶ μᾶλλον ἡ διακονία τοῦ πνεύματος ἔσται ἐν δόξῃ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/008.yaml
  text: how will the ministry of the Spirit not be even more in glory?[a]
translation:
  language: ja
  text: どうして、霊の務めが、なおさら栄光に満ちたものとならないことがあるでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「栄光のうちにある」。または「栄光を伴う」。
    reason: ἐν δόξῃの前置詞句をより形式的に表す別訳を示すため。
lexical_decisions:
- source_word: πῶς οὐχὶ
  choice: ～のではないでしょうか
  rationale: 肯定の答えを予期する修辞疑問を、現代日本語で自然に表した。疑問形を保ちつつ、「当然そうなる」という含意も伝える。
- source_word: μᾶλλον
  choice: まして、なおさら
  rationale: 前節との小から大への比較と、その強まりを明確に示す。日本語では「まして」と「なおさら」を組み合わせても自然で、論証の力を保てる。
- source_word: ἡ διακονία
  choice: 務め
  rationale: 単なる一般的な奉仕ではなく、委ねられた働きを指す文脈に合う。「奉仕」より広く、教会制度上の特定の職位にも限定しない。
- source_word: τοῦ πνεύματος
  choice: 霊の
  rationale: 属格の簡潔さを保ち、この務めが霊に属する、霊によってなされる、または霊を特徴とするという関係を一つに限定しない。文脈上は聖霊を指す。
- source_word: ἔσται
  choice: ～ものとなる
  rationale: εἰμίの未来形が持つ将来的・帰結的な響きを自然な日本語で示す。
- source_word: ἐν δόξῃ
  choice: 栄光に満ちた
  rationale: 直訳的な「栄光のうちにある」は日本語では不自然になりやすいため、栄光を帯びた状態を自然に表した。前後の「栄光」という主題語は保持した。
theological_decisions:
- issue: πνεύματοςの指示対象
  choice: 文脈上、聖霊を指す「霊」
  alternative: 人間の霊、または非人格的な霊的原理
  rationale: 3章6節の「霊は生かす」と、文字による務めとの契約的対比から、ここでは聖霊が最も自然な指示対象である。ただし原文にない「聖」を本文へ補わず、「霊」とした。
- issue: τοῦ πνεύματοςの属格関係
  choice: 「霊の」として関係を限定しない
  alternative: 「霊による」「霊を与える」
  rationale: 原文の属格は所属・特徴・働きの源など複数の含みを持ち得るため、特定の神学的説明に絞らない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、修辞疑問と荘重さを保った。「ミニストリー」のような外来語や、特定の教会職を連想させる語は避けた。
