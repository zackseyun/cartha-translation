id: 2CO.3.15
reference: 2 Corinthians 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ἕως σήμερον ἡνίκα ⸂ἂν ἀναγινώσκηται⸃ Μωϋσῆς κάλυμμα ἐπὶ τὴν καρδίαν αὐτῶν κεῖται·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/015.yaml
  text: But to this day[a], whenever Moses is read[b], a veil lies over their heart.
translation:
  language: ja
  text: しかし、今日に至るまで、モーセ[a]が朗読されるたびに、覆いが彼らの心[b]の上にかかっています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「モーセ」は、モーセの書、特に律法を指します。
    reason: cultural_note
  - marker: b
    text: 原文では「心」は単数形です。彼ら全体の心を集合的に表していると考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の内容との対照を明確に示す、自然で簡潔な逆接表現。
- source_word: ἕως σήμερον
  choice: 今日に至るまで
  rationale: その状態が現在まで続いていることを表す時間表現として、原文の継続的な意味を自然な日本語で保つ。
- source_word: ἡνίκα ἂν ἀναγινώσκηται
  choice: 朗読されるたびに
  rationale: ἡνίκαとἄνを伴う現在接続法が示す、不特定に繰り返される状況を表す。「朗読」は共同体で聖書が読み上げられる文脈にも適する。
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 原文の換喩をそのまま保ち、「モーセの律法」などと本文で解釈的に限定しない。
- source_word: κάλυμμα
  choice: 覆い
  rationale: この章で続くモーセの覆いの比喩に対応し、顔や心を覆って見えなくするものを自然に表す。
- source_word: ἐπὶ τὴν καρδίαν αὐτῶν
  choice: 彼らの心に
  rationale: 複数の所有者に対してκαρδίαが単数である原文を、集合的な単数として日本語でも保つ。
- source_word: κεῖται
  choice: かかったままです
  rationale: 覆いがそこに置かれ、現在も存続している状態を、日本語の比喩として自然に表す。
theological_decisions:
- issue: 「モーセ」をモーセ五書または律法と明示するか
  choice: 本文では換喩の「モーセ」を保持する
  alternative: 「モーセの律法」または「モーセの書」と訳す
  rationale: 原文自体がΜωϋσῆςと言っているため、その表現と解釈上の幅を本文に残し、意味は脚注で説明する。
- issue: 単数形の「心」を複数形相当にするか
  choice: 「彼らの心」として集合的単数を保持する
  alternative: 「彼ら一人一人の心」または「彼らの心々」と意訳する
  rationale: 原文の単数形καρδίαを保ち、共同体全体について語る緊張を不必要に個人化しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書朗読にふさわしい落ち着いた文体とした。「覆い」「心」という章全体の比喩を保ち、説明的な補足は脚注に限定した。
