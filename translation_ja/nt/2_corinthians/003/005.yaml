revisions:
- from: 私たちは、自分自身の力で、何かを自分から出たものと考える[a]ことができるほど、十分な者なのではありません。私たちを十分な者とする力[b]は、神から来るのです。
  to: 私たちが、自分自身で十分であり、何かを自分から出たものと考えられる、というのではありません。私たちの十分さは、神から来るのです。
  rationale: 自己由来の十分さという原文の意味を、「自分自身で十分であり」として余分な「力」を加えずに表した。ἱκανοίとἱκανότηςの対応は「十分である／十分さ」として本文で保ち、能力や職務上の適格性へ狭めない。原文の構文に従い、「何かを自分から出たものと考える」は自己十分性に基づく認知・評価として自然に接続した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:17:34Z'
