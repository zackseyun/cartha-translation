source:
  edition: SBLGNT
  text: οὐχ ὅτι ⸂ἀφ’ ἑαυτῶν ἱκανοί ἐσμεν⸃ λογίσασθαί τι ὡς ἐξ ⸀αὑτῶν, ἀλλ’ ἡ ἱκανότης ἡμῶν ἐκ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/003/005.yaml
  text: Not that we are sufficient in ourselves to consider anything as coming from ourselves[a], but our sufficiency is from God[b],
translation:
  language: ja
  text: 私たちが、自分自身で十分であり、何かを自分から出たものと考えられる、というのではありません。私たちの十分さは、神から来るのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: ～なのではありません
  rationale: 原因を否定するというより、直前の内容に説明と限定を加える修辞的な言い回しとして、現代日本語で自然に表した。
- source_word: ἀφ’ ἑαυτῶν
  choice: 自分自身の力で
  rationale: ἱκανοί と結びつき、必要な充足性や能力が自分に由来するのではないことを示すため。後続の「自分から」との区別も保った。
- source_word: ἱκανοί … ἡ ἱκανότης
  choice: 十分な者 … 十分な者とする力
  rationale: 形容詞と同語根の名詞とのつながりをできる限り保ちながら、不自然な「私たちの十分さ」を避け、能力・適格性・充足性を狭く限定しない表現とした。
- source_word: λογίσασθαί
  choice: 考える
  rationale: 計算そのものではなく、心の中で判断し、あるものと見なす認知的な意味を、明瞭な現代日本語で示した。
- source_word: τι
  choice: 何かを
  rationale: 否定を伴う文脈における不定の広い範囲を表した。
- source_word: ὡς ἐξ αὑτῶν
  choice: 自分から出たものと
  rationale: 考えや成果などの起源が自分自身にあると見なす、という源泉の意味を保った。
- source_word: ἐκ τοῦ θεοῦ
  choice: 神から来る
  rationale: 十分な者とする力の源が神であることを、直接的で自然な日本語で表した。
theological_decisions:
- issue: 人間の能力についてのパウロの主張の範囲
  choice: 自分に由来する充足性を広く否定する表現を保った。
  alternative: 使徒的奉仕を行う能力だけに限定して訳す。
  rationale: 文脈は奉仕について語っているが、この節のギリシア語自体はより広い言い方であるため、本文では特定の奉仕能力だけに狭めなかった。
- issue: ἱκανός／ἱκανότηςの意味
  choice: 「十分な者／十分な者とする力」とし、必要を満たす能力または適格性という幅を残した。
  alternative: 「有能／能力」または「適任／資格」と訳す。
  rationale: 能力だけ、または職務上の資格だけに意味を固定せず、同語根の反復も見えるようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、丁寧すぎる口語や専門的な教会用語を避けた。「自分自身の力で」と「自分から出たもの」を分けることで、原文にある二つの自己起源表現の役割を示した。
