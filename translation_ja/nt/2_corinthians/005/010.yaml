reference: 2 Corinthians 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοὺς γὰρ πάντας ἡμᾶς φανερωθῆναι δεῖ ἔμπροσθεν τοῦ βήματος τοῦ Χριστοῦ, ἵνα κομίσηται ἕκαστος τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν, εἴτε ἀγαθὸν εἴτε ⸀φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/010.yaml
  text: For we all must be revealed before the judgment seat of Messiah[a], so that each one may receive what is due for what he has done in the body[d][c][b], whether good or bad.
translation:
  language: ja
  text: なぜなら、私たちは皆、メシアの裁きの座の前で明らかにされなければならないからです。[a]それは、一人ひとりが、善であれ悪であれ、体を通して行ったことに応じて報いを受けるためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアの裁きの座の前に現れなければなりません」とも訳せる。ギリシア語の動詞は、単に姿を現すことも、公に明らかにされることも意味しうる。本文は後者の強い意味を採った。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「各人が、体を通してなされたことを、その行ったことに応じて受け取るため」。ギリシア語の表現は圧縮されており、「体を通して」は、地上で体をもって生きる中でなされた行いを指すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθῆναι
  choice: 明らかにされる
  rationale: 単にその場に姿を現すだけでなく、人のあり方や行いが公に示されるという受動形の強い意味を保つ。
- source_word: βήματος
  choice: 裁きの座
  rationale: 裁定を行う高座・法廷という司法的背景を、自然で伝統的な日本語で表す。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは称号として機能しているため、その意味が伝わる「メシア」とする。
- source_word: κομίσηται
  choice: 報いを受ける
  rationale: 各人が行いに対応するものを受け取るという応報的意味を簡潔に表す。報いが肯定的なものだけに限定されないことは、後続の「善であれ悪であれ」が明示する。
- source_word: τὰ διὰ τοῦ σώματος πρὸς ἃ ἔπραξεν
  choice: 体を通して行ったことに応じて
  rationale: διά＋属格の手段性を「体を通して」で保ち、πρόςの対応・相応の関係を「に応じて」で表す。ギリシア語の圧縮された構文を自然な日本語に整えた。
- source_word: ἕκαστος
  choice: 一人ひとり
  rationale: 個々人の責任を強調する分配的な単数の意味を自然に表す。
- source_word: ἀγαθὸν ... φαῦλον
  choice: 善であれ悪であれ
  rationale: 広い道徳的対比を簡潔に保つ。φαῦλονを過度に強い「邪悪」とせず、対句に適した「悪」とする。
theological_decisions:
- issue: メシアの裁きの座における審理の範囲と性質
  choice: すべての者が明らかにされ、各人が行いに応じて報いを受けるという普遍的な責任と司法的な厳粛さをそのまま訳す。
  alternative: 信者の報酬だけを扱う審判、または全人類に対する最終審判であると訳文上限定する。
  rationale: この節自体は審理の普遍性と個別的応報を述べるが、その対象や最終的帰結に関する後代の体系的区分までは明示しないため、解釈を限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「〜なければなりません」「一人ひとり」を用いて一般読者にも理解しやすくしつつ、法廷的な厳粛さと原文の神学的緊張を維持した。
