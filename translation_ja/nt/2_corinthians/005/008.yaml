source:
  edition: SBLGNT
  text: θαρροῦμεν δὲ καὶ εὐδοκοῦμεν μᾶλλον ἐκδημῆσαι ἐκ τοῦ σώματος καὶ ἐνδημῆσαι πρὸς τὸν κύριον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/008.yaml
  text: So we are confident and would rather be away from the body and at home with the Lord[a].
translation:
  language: ja
  text: 私たちは確信しています。そして、むしろ体を離れ、主のもとに住むことを望んでいます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 二つの動詞は本来、「故郷・住まいを離れていること」と「故郷・住まいにいること」を表す対語です。
    reason: lexical_alternative
lexical_decisions:
- source_word: θαρροῦμεν
  choice: 私たちは確信しており
  rationale: 現在形が表す持続的な確信と勇気を、現代日本語で自然に表した。直前の節から主語を引き継ぐ。
- source_word: δὲ καὶ
  choice: 〜ており
  rationale: δέはここでは強い逆接よりも直前の議論の継続を示し、καίは二つの動詞を結ぶ。日本語では接続表現に織り込むのが自然である。
- source_word: εὐδοκοῦμεν μᾶλλον
  choice: むしろ〜たいと願っています
  rationale: 比較を伴う意志的な選好を表す。単なる希望より、喜んで選び取る意向を含むため、「むしろ」と「願っています」を組み合わせた。
- source_word: ἐκδημῆσαι ἐκ τοῦ σώματος
  choice: 体を離れて
  rationale: ἐκδημέωの『郷里・住まいを離れている』という含みを簡潔に表しつつ、σῶμαを文字どおり「体」とした。死を明示する語は補わない。
- source_word: ἐνδημῆσαι πρὸς τὸν κύριον
  choice: 主のもとを住まいとする
  rationale: ἐνδημέωの『自分の住まいにいる』という比喩と、πρόςが示す主の臨在のもとへの帰属を保つ。「主と共にいる」だけでは失われる居住の対比を日本語で表した。
theological_decisions:
- issue: この節を死後の中間状態についての明示的な教理命題として訳すか
  choice: 「体を離れ」「主のもとを住まいとする」という比喩を保ち、「死ぬ」「天国へ行く」などを補わない。
  alternative: 「死んで天国に行き、主と共にいる」と説明的に言い換える。
  rationale: 本文は体から離れて主のもとにあることを強く示唆するが、死や天を表す語を明示してはいない。原文の比喩と神学的な余白を保持する。
- issue: ἐκδημέωとἐνδημέωの対照をどこまで表面化するか
  choice: 本文では「離れて／住まいとする」とし、脚注で「故郷を離れる／故郷に住む」という語感を示す。
  alternative: 両語を単に「離れる／共にいる」と訳し、居住・故郷の比喩を弱める。
  rationale: 対になった動詞の語義的対照は議論の重要な構成要素だが、本文で「故郷」を補うと比喩を過度に具体化するため、脚注で補足する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ἐκδημέω／ἐνδημέωの居住比喩を本文と脚注で保持しつつ、不自然な逐語訳や死後状態についての説明的な補足を避けた。
