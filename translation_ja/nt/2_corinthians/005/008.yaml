review_pass:
  verdict: revise
  source_fidelity: 「主のもとを住まいとする」は、ἐνδημῆσαι πρὸς τὸν κύριον の『主のもとにいる／住まう』という意味をおおむね捉えていますが、「主のもとを住まいとする」は日本語として不自然で、主体的に住所を定めるという含みを加えます。また、現脚注の「体から故郷を離れ」は構文・意味ともに不正確です。
  naturalness: 「体を離れて、主のもとを住まいとしたいと願っています」は重複した願望表現と不自然な目的語構造のため、明瞭な現代標準日本語として整える必要があります。
  terminology: 「体」「主」は適切です。ἐκδημέω／ἐνδημέωの居住・故郷に関わる対照は、本文では「離れ／住む」として無理なく示し、脚注では両動詞本来の対語性を正確に説明します。死や天国を補わない方針も維持します。
  issues:
  - severity: medium
    issue: 「主のもとを住まいとする」が不自然で、原文以上に『住まいとして選定する』意を帯びる。
    rationale: ἐνδημέωはここで主のもとに『いる／住まう』ことを表す。日本語では場所を「住まいとする」より、「主のもとに住む」とするほうが自然で忠実である。
  - severity: medium
    issue: 脚注の「体から故郷を離れ」は不正確で不自然。
    rationale: ἐκδημῆσαι ἐκ τοῦ σώματοςは、体から離れていることを、ἐκδημέω本来の『故郷・住まいを離れている』語感で表す。体をそのまま『故郷』とした直訳ではない。脚注は語義的対照の説明にとどめるのが安全である。
  - severity: low
    issue: 「したいと願っています」は願望表現が重なる。
    rationale: εὐδοκοῦμεν μᾶλλονは比較を伴う選好であり、「むしろ…ことを望んでいます」で自然に表せる。
  revised_text: 私たちは確信しています。そして、むしろ体を離れ、主のもとに住むことを望んでいます。[a]
