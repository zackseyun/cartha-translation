- from: 私たちは確信しており、むしろ体を離れて、主のもとを住まいとしたいと願っています。[a]
  to: 私たちは確信しています。そして、むしろ体を離れ、主のもとに住むことを望んでいます。[a]
  rationale: 本文を「体を離れ、主のもとに住むこと」として、原文の対照的な二つの不定詞と居住の比喩を保ちながら、自然な現代日本語に改めました。「むしろ」は選好を示す μᾶλλον を反映し、「望んでいます」は εὐδοκοῦμεν の意志的な好みを表します。脚注は誤解を招く擬似直訳を削除し、語彙上の対照だけを正確に示します。
