  to: ですから私たちも、住まいにいるにせよ、そこを離れているにせよ[a]、その方に喜ばれることをひたすら目標としています。
  rationale: 原文の省略された対句を本文で保持し、文脈上の「体」という指示は脚注に限定した。「何よりの」を削除して、φιλοτιμούμεθαの熱心な志向を「ひたすら目標としています」で表した。また、「私たちも」によりκαὶの継続性を反映した。
