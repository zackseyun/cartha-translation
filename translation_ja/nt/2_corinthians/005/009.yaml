  source_fidelity: 全体の構文と主要な意味はおおむね原文に忠実である。しかし、「何よりの」はφιλοτιμούμεθαが示す熱心な志向を、「他のすべてに優先する」という比較・最上位の意味にまで強めており、原文にはない含意を加える。καὶの継続・付加は「私たちも」で自然に示せる。
  naturalness: 「住まいにいる」はやや不自然ではあるが、原文の簡潔な比喩と省略を保つために使用可能である。「その方に喜ばれることをひたすら目標としています」は、落ち着いた現代標準語として自然であり、原文の目標を表す不定詞構文にも対応する。
  terminology: εὐάρεστοιは「その方に喜ばれること」とすることで、神学的に過度な含意を加えず、自然な日本語で関係的な意味を保てる。αὐτῷは本文では「その方」として代名詞性を保持する。脚注は、補語が節内で明示されないことと、直前の文脈における「体」との関係を明瞭にする。
