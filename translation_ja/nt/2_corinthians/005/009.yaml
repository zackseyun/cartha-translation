reference: 2 Corinthians 5:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὸ καὶ φιλοτιμούμεθα, εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες, εὐάρεστοι αὐτῷ εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/009.yaml
  text: Therefore we also make it our ambition[a], whether at home or away, to be pleasing to him.
translation:
  language: ja
  text: ですから私たちも、住まいにいるにせよ、そこを離れているにせよ[a]、その方に喜ばれることをひたすら目標としています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は、「体のうちに住んでいるにせよ、体を離れているにせよ」の意。原文では「住まいにいる」「そこを離れている」の補語はこの節に明示されていない。
    reason: 原文が補語を省略している簡潔さを本文で保ちつつ、5章6–8節が示す文脈上の意味を明らかにするため。
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の、体のうちにいることと主のもとに住むことについての議論から導かれる結論を、自然な現代日本語で示す。
- source_word: καὶ
  choice: （文全体の継続性に含める）
  rationale: 前の議論との連続や強調を担う語であり、日本語では「ですから」と文脈の流れによって十分に表されるため、機械的に「また」を加えなかった。
- source_word: φιλοτιμούμεθα
  choice: 何よりの目標としています
  rationale: 熱心に志し、名誉ある目標として追い求めるという動詞の積極的な力を、平明で自然な日本語にした。単なる「目指します」より強い意志を保つ。
- source_word: εἴτε ἐνδημοῦντες εἴτε ἐκδημοῦντες
  choice: 住まいにいるにせよ、そこを離れているにせよ
  rationale: 原文の「住んでいる／住まいを離れている」という対句を保ち、この節では省略されている「体」という補語を本文に補わない。
- source_word: εὐάρεστοι
  choice: 喜ばれる者
  rationale: 神または主に受け入れられ、喜ばれるという関係的な意味を、現代日本語で明瞭に表す。
- source_word: αὐτῷ
  choice: その方に
  rationale: 原文が代名詞を用いていることを保ちつつ、直前の文脈にある「主」を指すことが自然に伝わる敬意ある表現とした。
- source_word: εἶναι
  choice: 者であること
  rationale: 目標の内容を示す不定詞を、日本語の名詞節として自然に表した。
theological_decisions:
- issue: 「住まいにいる／離れている」の省略された補語を本文で明示するか
  choice: 本文では原文どおり簡潔な対句を保つ
  alternative: 「体を住まいとしているにせよ、体を離れているにせよ」と明示する
  rationale: 5章6–8節の文脈から身体について述べていることは明らかだが、この節自体では補語が省かれている。その簡潔さと含みを本文に残し、具体的な文脈上の意味は脚注で示す。
- issue: αὐτῷの指示対象を「主」と明示するか
  choice: 代名詞に対応する「その方」とする
  alternative: 「主に」と明示する
  rationale: 文脈上の指示対象は主であるが、原文の代名詞を固有の称号に置き換えず、指示関係を保った。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた語調とした。「何よりの目標」はφιλοτιμούμεθαの熱意を表し、「住まい／離れる」の比喩的対句は説明しすぎず保持した。
