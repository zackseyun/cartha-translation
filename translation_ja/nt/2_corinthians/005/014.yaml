id: 2CO.5.14
reference: 2 Corinthians 5:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γὰρ ἀγάπη τοῦ Χριστοῦ συνέχει ἡμᾶς, κρίναντας τοῦτο ⸀ὅτι εἷς ὑπὲρ πάντων ἀπέθανεν· ἄρα οἱ πάντες ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/014.yaml
  text: 'For the love of Messiah compels us[a], because we have concluded this: that one died on behalf of all; therefore all died.'
translation:
  language: ja
  text: 私たちがこう判断したので、メシアの愛が私たちを駆り立てているのです[a]。すなわち、一人の方がすべての人のために死なれた。したがって、すべての人が死んだのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「メシアが示す愛」あるいは「メシアに対する愛」。ギリシア語の属格はいずれにも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγάπη
  choice: 愛
  rationale: 現代日本語で自然かつ中心的な訳語であり、語の意味を過不足なく伝える。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστόςを称号として訳す。「の」は主格的属格（メシアが示す愛）と目的格的属格（メシアに対する愛）の双方に開かれている。
- source_word: συνέχει
  choice: 駆り立てている
  rationale: 人を強く促し、その行動を方向づける文脈上の力を、自然な現代日本語で表す。「支配する」ほど機械的ではなく、「迫る」より動機づけの含意が明瞭である。
- source_word: κρίναντας τοῦτο
  choice: 私たちはこう判断しました
  rationale: κρίνωの熟慮に基づく判断という意味を保つ。分詞が前文の根拠を示す関係は、直前の「からです」と文脈によって表した。
- source_word: εἷς
  choice: 一人の方
  rationale: 原文の簡潔な「一人」を保ちつつ、死なれたメシアを指す日本語として敬意と自然さを持たせる。
- source_word: ὑπὲρ πάντων
  choice: すべての人のために
  rationale: ὑπέρの代理・利益の含みを保ちながら、特定の贖罪理論に限定しない自然な訳とした。
- source_word: ἄρα
  choice: したがって
  rationale: 前提から導かれる推論を明確に示す。
- source_word: οἱ πάντες ἀπέθανον
  choice: すべての人が死んだ
  rationale: パウロの圧縮された表現を説明的に拡張せず、そのまま保つ。
theological_decisions:
- issue: ἡ ἀγάπη τοῦ Χριστοῦ における属格の意味
  choice: 本文では「メシアの愛」として曖昧さを保持する。
  alternative: 「メシアが示す愛」または「メシアに対する愛」
  rationale: ギリシア語の属格は主格的にも目的格的にも解し得るため、本文では一方に限定せず、脚注で両方を示す。
- issue: 「すべての人が死んだ」の意味
  choice: 解釈を補わず、原文どおり簡潔に訳す。
  alternative: すべての人がメシアにあって代表的に死んだ／すべての信者がメシアと共に死んだ
  rationale: 代表的参与が含意される可能性はあるが、節そのものは説明していないため、範囲や様態についての神学的決着を訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「メシア」は称号として表記した。論理の流れを明確にしつつ、原文の簡潔さと神学的緊張を保持している。
