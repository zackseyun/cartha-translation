id: 2CO.5.15
reference: 2 Corinthians 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑπὲρ πάντων ἀπέθανεν ἵνα οἱ ζῶντες μηκέτι ἑαυτοῖς ζῶσιν ἀλλὰ τῷ ὑπὲρ αὐτῶν ἀποθανόντι καὶ ἐγερθέντι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/015.yaml
  text: And he died for all[a], so that those who live might no longer live for themselves[b], but for the one who died and was raised for them.
translation:
  language: ja
  text: そして、キリストがすべての人のために[a]死んだのは、生きている人々が、もはや自分自身のために生きるのではなく、自分たちのために死んで、よみがえらされた[b]方のために生きるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての人に代わって」とも訳せる。二度使われる「～のために」（ὑπέρ）は、利益または代表を表す。
    reason: lexical_alternative
  - marker: b
    text: 原文の「よみがえらされた」は受動形。「よみがえった」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ πάντων
  choice: すべての人のために
  rationale: ὑπέρ＋属格が表す利益・代表の意味を自然な日本語で保ち、贖罪の仕組みを必要以上に限定しない。πάντωνの範囲も本文以上に狭めない。
- source_word: ἀπέθανεν
  choice: 死んだ
  rationale: アオリスト直説法が示す過去の出来事を簡潔に表す。主語「キリスト」は直前の文脈から補った。
- source_word: ἵνα
  choice: ～ためです
  rationale: 目的を表す接続詞の力を、現代日本語として自然な目的構文で示す。
- source_word: οἱ ζῶντες
  choice: 生きている人々
  rationale: 冠詞付き現在分詞の実体詞用法を明確に表し、その「生」の具体的意味は文脈に委ねる。
- source_word: μηκέτι ἑαυτοῖς ζῶσιν
  choice: もはや自分自身のために生きるのではなく
  rationale: μηκέτιの停止の意味と、与格が表す生の自己志向性を、明瞭で自然な日本語にする。
- source_word: ἀλλὰ τῷ ... ἀποθανόντι καὶ ἐγερθέντι
  choice: 自分たちのために死んで、よみがえらされた方のために生きる
  rationale: 省略されたζῶσινを日本語で補い、対比を明確にする。「方」により尊厳ある自然な表現とした。
- source_word: ὑπὲρ αὐτῶν
  choice: 自分たちのために
  rationale: 先行する「生きている人々」を受ける再帰的な日本語とし、最初のὑπέρと同じ「ために」で反復を保つ。
- source_word: ἐγερθέντι
  choice: よみがえらされた
  rationale: アオリスト受動分詞の受動態を保持し、神がよみがえらせたという含意を消さない。
theological_decisions:
- issue: πάντων／αὐτῶνの範囲
  choice: 「すべての人」「自分たち」と訳し、指示範囲を限定しない。
  alternative: 無制限に全人類を指すと明示する／信者またはキリストに代表される者だけに限定する。
  rationale: この節の広い表現をそのまま保ち、贖罪の範囲をめぐる後代の教派的結論を本文に持ち込まない。
- issue: ἐγερθέντιの態
  choice: 「よみがえらされた」
  alternative: 「よみがえった」
  rationale: 原文の受動態を示し、復活における神の働きという新約聖書的含意を保持する。
- issue: οἱ ζῶντεςにおける「生」の意味
  choice: 「生きている人々」とし、身体的・霊的含意を翻訳で確定しない。
  alternative: 「新しく生かされた人々」などと解釈を明示する。
  rationale: 文脈上、キリストによって方向づけられた生が含意され得るが、この句自体は単に「生きている者たち」と述べるため、曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文としての落ち着きと尊厳を保った。「キリスト」はギリシア語動詞の主語として直前の文脈（5:14）から補足した。脚注[b]は該当表現の直後ではなく節末に置き、本文の流れを妨げないようにした。
