source:
  edition: SBLGNT
  text: ὥστε εἴ τις ἐν Χριστῷ, καινὴ κτίσις· τὰ ἀρχαῖα παρῆλθεν, ἰδοὺ γέγονεν ⸀καινά·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/017.yaml
  text: So then[a], if anyone is in Messiah, there is a new creation; the old things have passed away; behold[b], new things have come.
translation:
  language: ja
  text: ですから、だれでもメシアにあるなら、新しい創造があります[a]。古いものは過ぎ去りました。見よ[b]、新しいものが生じました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その人は新しい創造です」。ギリシア語は動詞が省かれており、直訳すると「だれでもメシアにあるなら――新しい創造」となります。
    reason: alternative_reading
  - marker: b
    text: 多くの訳は「見よ、すべてが新しくなった」とします。しかし、ここで採用したSBLGNT本文には「すべて」に当たる明示的な語がなく、単に「新しいものが生じた」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す推論的な接続を、自然な現代日本語で表す。
- source_word: εἴ τις
  choice: だれでも……なら
  rationale: 性別を限定しない不定条件の一般的な広がりを保つ。
- source_word: ἐν Χριστῷ
  choice: メシアのうちに
  rationale: Χριστόςの称号としての意味と、パウロ特有の結合を表す「～のうちに」という関係表現の両方を保つ。
- source_word: καινὴ κτίσις
  choice: そこには新しい創造があります
  rationale: 原文は動詞を欠く簡潔な句であり、個人だけを「新しく造られた者」と断定せず、新しい創造というより広い含意を残す。補った「そこには」は日本語として文を成立させるためのものである。
- source_word: τὰ ἀρχαῖα
  choice: 古いもの
  rationale: 実体詞的に用いられた中性複数形を、範囲を限定せず自然に表す。
- source_word: παρῆλθεν
  choice: 過ぎ去りました
  rationale: 完了した出来事と現在に及ぶ結果を文脈上自然に伝える。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 読者の注意を強く促す原文の指示的・修辞的な力を、簡潔で格調ある表現によって保つ。
- source_word: γέγονεν καινά
  choice: 新しいものが生じました
  rationale: 完了形が示す、変化によって成立し現在も続く状態を表しつつ、SBLGNT本文の中性複数形καινάを反映する。「すべて」という語は補わない。
theological_decisions:
- issue: Χριστῷを称号として訳すか、固有名のように訳すか
  choice: メシアのうちに
  alternative: キリストのうちに
  rationale: ここでもメシアという称号の意味は失われておらず、原語の称号性を明示する。
- issue: 動詞のないκαινὴ κτίσιςをどう補うか
  choice: そこには新しい創造があります
  alternative: その人は新しく造られた者です
  rationale: 原文は「だれでもメシアのうちにあるなら――新しい創造」とも直訳でき、個人についての述語とも、新しい創造の到来を告げる宣言とも理解し得る。本文では後者を採りつつ、個人化した読みを脚注に残して曖昧さを保つ。
- issue: καινάの範囲
  choice: 新しいものが生じました
  alternative: すべてが新しくなりました
  rationale: SBLGNT本文には「すべて」に当たる語がないため、それを本文へ補わず、複数形の「新しいもの」を反映する。
translation_notes:
  register: 明瞭で現代的な標準日本語を基調としつつ、「見よ」によって原文の強い注意喚起と聖書本文としての品位を保った。「新しい創造」は神学的な広がりを持つ原語表現を過度に個人化しないため、そのまま用いた。
