  terminology: 「メシア」「新しい創造」「古いもの」は一貫しており、神学的に過度な限定を加えていません。脚注aの「新しく造られた者」は解釈的な訳なので、原文により近い「その人は新しい創造です」とし、これが代替的な補い方であることを明示するのが安全です。
