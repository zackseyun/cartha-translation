  yaml_path: translation/nt/2_corinthians/005/003.yaml
  text: if indeed[a], when we have been clothed, we will not be found naked.
translation:
  language: ja
  text: もし本当に、私たちが身に着けたなら、裸の者として見いだされることはないでしょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「もし本当に、身に着けた者として、私たちは裸の者として見いだされないなら。」
    reason: 中動態分詞 ἐνδυσάμενοι を「身に着けた者として」、未来受動 εὑρεθησόμεθα を「見いだされる」と保つ、原文の圧縮された条件表現を示すため。
lexical_decisions:
- source_word: εἴ γε
  choice: もし本当に～なら
  rationale: 条件を表す εἰ と、それを強める γε の両方を保つ。文脈上の期待は感じさせつつ、条件性を断定に変えない。
- source_word: καὶ
  choice: 訳文上は独立した語にせず、文全体の強調に含める
  rationale: ここでの καί は参与表現を結び、または強める働きと考えられるが、日本語で「また」「さえ」と機械的に置くと不自然で意味を過度に限定するため、条件節全体の自然な表現に織り込んだ。
- source_word: ἐνδυσάμενοι
  choice: 着た者となっていて
  rationale: アオリスト中動態分詞の「身に着けた」という像と、主動詞に先立つ完了的な関係を表す。単なる受動の「着せられて」には限定しない。
- source_word: οὐ γυμνοὶ
  choice: 裸のままであることがない
  rationale: 衣服の比喩をそのまま保ち、γυμνός の基本義「裸」を明示する。何を神学的に指すかは訳文で確定しない。
- source_word: εὑρεθησόμεθα
  choice: ～であることがない
  rationale: 未来受動形の慣用的な「～であると認められる／判明する」を、条件文として自然な日本語にした。ただし「見いだされる」という語感は注で補う。
theological_decisions:
- issue: 衣を着ることと裸であることの比喩
  choice: 比喩を保持し、復活の体、死と復活の間の身体なき状態、神の前での羞恥のいずれかに限定しない
  alternative: 「裸」を、死後の無身体状態、天からの住まいを持たない状態、または神の前での露呈と明示する
  rationale: この節だけでは比喩の指示対象が明示されていないため、パウロの神学的緊張と曖昧さを訳文に残す。
- issue: εἴ γε の条件性
  choice: 「もし本当に～なら」と訳す
  alternative: 「確かに～なので」または「～である以上」と確定的に訳す
  rationale: 写本上および統語上の条件表現を保ち、確証的・修辞的条件である可能性を排除しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、衣服の比喩と条件文の緊張を保った。「着た者となっていて」はやや改まった表現だが、前後の「住まいを着る」という比喩との連続性を優先した。
