id: 2CO.5.5
reference: 2 Corinthians 5:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ κατεργασάμενος ἡμᾶς εἰς αὐτὸ τοῦτο θεός, ⸀ὁ δοὺς ἡμῖν τὸν ἀρραβῶνα τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/005.yaml
  text: The one who prepared us for this very thing is God[b][a], who gave us the down payment of the Spirit.
translation:
  language: ja
  text: 私たちをまさにこのことのために整え、私たちに聖霊の手付金[a][b]を与えてくださったのは、神です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「手付金」は、「保証」「保証金」「前払い金」「最初の支払い」とも訳せる。残りも与えられることを保証する最初の支払いを指す。
    reason: lexical_alternative
  - marker: b
    text: この表現は、聖霊ご自身が手付金であるという意味にも、聖霊に関わる将来の完成を保証する手付金という意味にも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: κατεργασάμενος
  choice: 整えてくださった
  rationale: 文脈は、将来の復活の体に向けて神が信者を目的をもって備えることを述べている。「整える」は、単なる「造る」よりも、その目的に適うよう備えるという含みを自然に表す。
- source_word: εἰς αὐτὸ τοῦτο
  choice: まさにこのことのために
  rationale: 直前の1–4節で述べられた事柄を強く指し示す表現であり、αὐτὸの強調とεἰςの目的・方向性を保つ。
- source_word: θεός
  choice: 神
  rationale: 「整えた方」を明示する文の主語として素直に訳した。
- source_word: δοὺς
  choice: 神は……与えてくださいました
  rationale: アオリスト分詞を日本語で自然な独立文にし、それが先行する「神」を説明している関係を明確にした。
- source_word: ἀρραβῶνα
  choice: 手付金
  rationale: 残額が後に支払われることを確約する最初の支払いという商取引上の比喩を保持し、現在すでに与えられたものと将来の完成との両面を伝える。
- source_word: τοῦ πνεύματος
  choice: 御霊の
  rationale: 属格の形を保ち、御霊ご自身が手付金なのか、御霊に関わる手付金なのかを本文で断定しすぎない。「御霊」はここで神の霊を指すことを、簡潔かつ尊厳ある現代日本語で示す。
- source_word: δὲ
  choice: 訳語を明示しない
  rationale: ここでは強い逆接ではなく穏やかな展開を示す。日本語では節のつながり自体で十分に表せるため、「さて」「しかし」などを加えて談話上の力を過度に強めない。
theological_decisions:
- issue: 「御霊の手付金」の意味
  choice: 属格を「御霊の」と保ち、御霊ご自身が将来の完成を保証する先取りの賜物であるとの理解を可能にする
  alternative: 御霊が与える保証、または御霊の働きが将来もたらすものを保証する手付金と理解する
  rationale: パウロの類似表現（第二コリント1:22、エフェソ1:13–14）は御霊ご自身が将来の相続の保証であるとの理解を強く支えるが、ギリシア語の属格だけでその関係を文法的に一つへ限定せず、本文では解釈上の余地を保った。
translation_notes:
  register: 明快な現代標準語を用いながら、神については「くださった」「くださいました」によって自然な敬意を示した。「手付金」は日常的に理解できる具体的な比喩として残し、その意味と別訳を脚注で補った。原文の一文を二文に分け、日本語として読みやすくしつつ、行為者が同じ神であることを明示した。
