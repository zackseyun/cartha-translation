lexical_decisions:
- source_word: καὶ γὰρ
  choice: 実に
  rationale: 前節を受ける説明的なつながりと穏やかな強調を、現代日本語で自然に表した。
- source_word: ἐν τούτῳ
  choice: この中にあって
  rationale: 指示語の対象を「幕屋」や「状態」と断定せず、原文の曖昧さを保った。
- source_word: στενάζομεν
  choice: 私たちは…うめき
  rationale: 重荷のもとで発する嘆きと、将来を待ち望む切実さの双方を簡潔に伝える。
- source_word: τὸ οἰκητήριον ἡμῶν τὸ ἐξ οὐρανοῦ
  choice: 天から来る私たちの住まい
  rationale: οἰκητήριονの住居の比喩と、ἐξ οὐρανοῦが示す起源を明示し、「天的な」という性質だけに狭めないようにした。
- source_word: ἐπενδύσασθαι
  choice: 上から身に着けたい
  rationale: すでに着ているものの上にさらに着るという複合動詞の含みを、日本語として理解できる形で残した。
- source_word: ἐπιποθοῦντες
  choice: 切望しています
  rationale: 強く持続する願いを表す分詞の力を伝え、うめきと同時に生じている願望として訳した。
theological_decisions:
- issue: 天からの住まいと衣服の比喩が指すもの
  choice: 「住まい」と「上から身に着ける」という重なり合う比喩をそのまま保つ
  alternative: 「復活の体」または「天の住まい」と明示して一つの解釈に限定する
  rationale: この節だけでは、復活の体、中間状態、終末的な天の住まいのいずれを特に指すかを完全には確定できないため、原文の神学的な緊張を解消しない。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、住居を衣のように身に着けるという原文の意図的な比喩の重なりを平板化しなかった。「この中にあって」はやや直訳的だが、指示対象を本文で決めつけないために採用し、脚注で曖昧さを説明した。
