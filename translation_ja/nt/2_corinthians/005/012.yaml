reference: 2 Corinthians 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὐ πάλιν ἑαυτοὺς συνιστάνομεν ὑμῖν, ἀλλὰ ἀφορμὴν διδόντες ὑμῖν καυχήματος ὑπὲρ ἡμῶν, ἵνα ἔχητε πρὸς τοὺς ἐν προσώπῳ καυχωμένους καὶ ⸂μὴ ἐν⸃ καρδίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/012.yaml
  text: We are not commending ourselves to you again[a], but giving you an opportunity to boast about us[b], so that you may have an answer for those who boast in outward appearance and not in heart.
translation:
  language: ja
  text: 私たちは、再び自分をあなたがたに推薦しているのではありません。むしろ、私たちのことを誇る機会をあなたがたに与えているのです。それは、心ではなく外面を誇る人たちに対して、あなたがたが答えられるようになるためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「顔において誇り、心において誇らない人たち」。ここで「顔」は、人に見える外側や外的な印象を指すと考えられる。
    reason: 原文の比喩的で簡潔な対比を示し、本文の「外面」という訳の根拠を明らかにするため。
lexical_decisions:
- source_word: συνιστάνομεν
  choice: 推薦している
  rationale: この文脈では、自分の資格や信頼性を他者に認めてもらおうとして自己推薦することを指す。「推薦する」は、単なる自己紹介ではなく、自らを信頼に値する者として示す含意を保つ。
- source_word: ἀφορμὴν
  choice: きっかけ
  rationale: 出発点、機会、根拠となるものを表す語。ここでは、コリントの人々がパウロたちについて誇り、反対者に答えるための材料を与えるという流れに合う自然な表現とした。
- source_word: καυχήματος
  choice: 誇る
  rationale: 後半の καυχωμένους と同じ語根のつながりが伝わるよう、両方を「誇る」で統一した。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのことを
  rationale: ὑπέρ は「私たちについて」と「私たちのために／味方として」の両方の含みを持ち得る。本文では自然な日本語を優先して「私たちのことを」とし、パウロたちが誇りの対象または根拠となる意味を表した。
- source_word: ἵνα ἔχητε πρὸς
  choice: 対して、あなたがたが答えられるようになるため
  rationale: 直訳的には「彼らに対して持つため」だが、文脈上は反対者に返答する内容を持つことを意味する。省略された目的語を自然な日本語で補った。
- source_word: ἐν προσώπῳ
  choice: 外面を
  rationale: 字義的には「顔において」だが、καρδίᾳ との対比により、人に見える外側や外的な印象を指す。「外面」は外見だけでなく表面的な評価も含み得る。
- source_word: καρδίᾳ
  choice: 心
  rationale: 人の内的実在、動機、人格を指す聖書的表現を保つため「心」とした。
theological_decisions:
- issue: ἐν προσώπῳ … καὶ μὴ ἐν καρδίᾳ の対比
  choice: 「心ではなく外面を誇る」
  alternative: 「顔を誇り、心を誇らない」／「内面の真実ではなく、外見を誇る」
  rationale: 外側に見えるものと内なる実在との対比を保ちつつ、「内面の真実」などの説明を本文へ加えて意味を狭めることは避けた。「心を誇る」という日本語の不自然さを避け、原文の簡潔な緊張関係を再現した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、使徒的書簡にふさわしい落ち着いた丁寧体を用いた。「あなたがた」「推薦する」「誇る」により文脈上の語彙の連続性を保ち、説明過多を避けた。
