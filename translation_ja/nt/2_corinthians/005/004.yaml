  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ οἱ ὄντες ἐν τῷ σκήνει στενάζομεν βαρούμενοι ἐφ’ ᾧ οὐ θέλομεν ἐκδύσασθαι ἀλλ’ ἐπενδύσασθαι, ἵνα καταποθῇ τὸ θνητὸν ὑπὸ τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/004.yaml
  text: For indeed[a], while we are in this tent, we groan, being burdened, because we do not want to be unclothed but to be further clothed[b], so that what is mortal may be swallowed up by life.
translation:
  language: ja
  text: というのも、私たちはこの幕屋の中にいる間、重荷を負ってうめいています。私たちが望むのは、脱ぐことではなく、その上にさらに着ることです[a]。それは、死ぬべきもの[b]が命にのみ込まれるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「上からさらに着ることを望む」。ギリシア語の動詞は、すでに着ているものの上にさらに衣服を着ることを示唆します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「死すべきもの」または「死すべき性」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: というのも
  rationale: 前節を受けて理由を説明する接続の働きを、自然な現代日本語で示す。強調は文脈全体で伝わるため、不自然な重複表現は避けた。
- source_word: σκήνει
  choice: 幕屋
  rationale: 現在の身体的存在を指す比喩を平板化せず、前後の住まいの比喩とのつながりも保つ。
- source_word: στενάζομεν
  choice: うめいています
  rationale: 苦悩と終末的な切望の重さを表し、「ため息をつく」より原語の強さをよく伝える。
- source_word: βαρούμενοι
  choice: 重荷を負って
  rationale: 分詞の受動的な意味と、うめきに伴う重圧を自然な日本語で表す。
- source_word: ἐφ’ ᾧ
  choice: からです
  rationale: ここでは、脱ぐことではなく上に着ることを望むという内容を、うめきの理由として導入すると理解した。
- source_word: ἐκδύσασθαι
  choice: 脱いでしまいたい
  rationale: 衣服の比喩を保持しつつ、アオリスト不定詞のまとまりある動作を「しまう」で自然に表した。何を脱ぐかは補わない。
- source_word: ἐπενδύσασθαι
  choice: その上にさらに着たい
  rationale: すでに着ているものの上に別のものを着るという複合動詞の含意を明示し、衣服の比喩を保つ。
- source_word: καταποθῇ
  choice: のみ込まれる
  rationale: 完全に圧倒されて取り込まれるという鮮明な比喩と受動態を保持する。
- source_word: τὸ θνητόν
  choice: 死ぬべきもの
  rationale: 中性形容詞の名詞的用法を具体性のある表現で訳し、単に抽象的な「死すべき性」に限定しない。
- source_word: ζωῆς
  choice: 命
  rationale: 死すべきものとの対照を、簡潔で自然な日本語にする。
theological_decisions:
- issue: 衣服の比喩と中間状態の理解
  choice: 「脱ぐ」「その上にさらに着る」という比喩をそのまま残す。
  alternative: 「脱ぐ」を身体を離れた状態、「さらに着る」を復活の体と明示して訳す。
  rationale: 本文は将来の変容を衣服の比喩で語るが、論争のある教理的枠組みを明示してはいない。翻訳で特定の理解に限定せず、原文の緊張と余地を保つ。
- issue: τὸ θνητόν の指示範囲
  choice: 「死ぬべきもの」と訳す。
  alternative: 「死すべき体」または抽象的な「死すべき性」と訳す。
  rationale: 原文は中性単数の名詞化された形容詞であり、「体」と明示していないため、その広がりを維持する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「幕屋」「うめく」「のみ込む」というパウロの比喩的表現は保持しつつ、語順と接続は日本語として自然になるよう整えた。すべての脚注記号を対応箇所に置いた。
