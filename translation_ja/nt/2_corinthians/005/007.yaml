  text: For we walk by faith[a], not by sight—
translation:
  language: ja
  text: 私たちは信仰によって歩んでいるのであって、目に見えるものによって歩んでいるのではない[a]――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見える姿によってではない」または「外見によってではない」。ギリシア語は、目に見える姿や外観を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ πίστεως
  choice: 信仰によって
  rationale: διά＋属格は手段・様態を表す。πίστιςはここでは、見えるものに頼ることとの対比に置かれており、「信仰」が簡潔で自然である。
- source_word: γὰρ
  choice: のであって
  rationale: γάρが直前の文脈に説明・根拠を加える働きを、独立した「なぜなら」よりも日本語として自然な文中接続で示す。
- source_word: περιπατοῦμεν
  choice: 歩んでいる
  rationale: 字義的な「歩く」という比喩を保ちつつ、生き方・歩みを表す日本語として自然にした。
- source_word: οὐ διὰ εἴδους
  choice: 目に見えるものによってではない
  rationale: εἶδοςには「見える姿・外観・形」の意味幅がある。「目に見えるもの」は信仰との対照を明確にしながら、単なる視覚能力という誤解を避ける。
theological_decisions:
- issue: パウロ書簡における πίστις の訳語
  choice: 信仰
  alternative: 信頼／真実
  rationale: この箇所は属格句を伴う論争的な用法ではなく、εἶδοςとの簡潔な対比であるため、「信仰」が最も適切である。「真実・忠実」よりも、見えないものに信頼して歩む意味が前面に出ている。
- issue: εἶδοςが指す範囲
  choice: 目に見えるもの
  alternative: 見ること／外見
  rationale: 原語は視覚そのものだけでなく、見える姿や現れを指し得る。本文では自然な対比を示し、脚注で語義の幅を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「歩んでいる」で原文の比喩を保ち、文末のダッシュは次節へ続く原文の流れを示す。
