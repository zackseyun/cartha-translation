  source_fidelity: 原文は「いつも確信を抱き（または心強く思い）、体のうちに住んでいる間は主から離れていることを知っている」という構文である。草案の大意は忠実だが、「体を住まいとしている」は σώματι に対して身体を自ら住まいにするようにも読め、ἐν（〜のうちに）を十分に表していない。
  naturalness: 「体のうちに住んでいる間」は現代標準語として自然で、原文の『在宅／離郷』の比喩も無理なく伝える。「主のもとを離れている」より「主から離れている」のほうが、ἀπό の分離を簡潔かつ直接に表せる。
  terminology: κύριοςは一貫して「主」とする。「体」は本文脈の σώμα に適切である。「確信を抱く」は Θαρροῦντες の文脈上の勇気・確信を過度に限定せず表せる。
  issues:
