source:
  edition: SBLGNT
  text: Θαρροῦντες οὖν πάντοτε καὶ εἰδότες ὅτι ἐνδημοῦντες ἐν τῷ σώματι ἐκδημοῦμεν ἀπὸ τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/006.yaml
  text: Therefore[a], we are always confident and know that while we are at home in the body, we are away from the Lord,
translation:
  language: ja
  text: ですから、私たちはいつも確信を抱き、体のうちに住んでいる間は、主から離れていることを知っています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θαρροῦντες
  choice: 私たちは……確信を抱いています
  rationale: 現在分詞が表す継続的な勇気と確信を、現代日本語として自然な定形表現で示した。文脈上の落ち着いた確信を保ちつつ、「勇気を出す」と限定しすぎない。
- source_word: οὖν
  choice: ですから
  rationale: 直前までの復活の命と天にある住まいについての議論を受ける推論を、明瞭で自然な接続表現にした。
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的・恒常的な状態を平明に表す。
- source_word: εἰδότες
  choice: ……ことも知っています
  rationale: οἶδαの完了分詞が持つ現在的な意味、すなわち確立した認識を表す。καίによるΘαρροῦντεςとの連結も「そして」「も」で自然に示した。
- source_word: ἐνδημοῦντες
  choice: 住まいとしている間は
  rationale: 本来の「自国・自宅にいる」という比喩を残し、ἐκδημοῦμενとの対照が日本語でも伝わるようにした。
- source_word: ἐν τῷ σώματι
  choice: 体を
  rationale: ἐνδημοῦντεςと合わせて「体を住まいとしている」と構成し、身体をもって生きる現在の状態を表す。原文にない「この」は補わない。
- source_word: ἐκδημοῦμεν
  choice: 離れている
  rationale: ἐνδημοῦντεςの対語であり、自宅や故郷を離れているという空間的比喩を保持する。「不在である」より日常的で明瞭な日本語とした。
- source_word: ἀπὸ τοῦ κυρίου
  choice: 主のもとを
  rationale: ἀπόの分離の意味を「離れている」と一体化して表現した。「御前」などを補って意味を限定せず、κύριοςは「主」とした。
theological_decisions:
- issue: 身体をもって生きることと主のもとにいることとの比喩的対照
  choice: 現在、体を住まいとしている状態を、主のもとを離れている状態として訳す。
  alternative: 地上で身体をもって生きる信者が、あらゆる意味でキリストから完全に隔絶していると解する。または次節の「体を離れて主のもとに住む」という内容を本節へ先取りして補う。
  rationale: 本節の対照と緊張をそのまま保ち、主との究極的な同在がまだ実現していないことを示す一方、キリストの臨在や支えからの全面的断絶までは訳文に持ち込まない。次節の内容も先取りしない。
translation_notes:
  register: 明瞭で現代的ながら品位のある常体寄りの聖書文体。「体を住まいとしている」と「主のもとを離れている」によって原文の対語的な比喩を可視化した。
