  text: ὑπὲρ Χριστοῦ οὖν πρεσβεύομεν ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν· δεόμεθα ὑπὲρ Χριστοῦ, καταλλάγητε τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/020.yaml
  text: 'Therefore[a], we are ambassadors for the Messiah, as though God were appealing through us[b]. We beg you on behalf of the Messiah: be reconciled to God.'
translation:
  language: ja
  text: ですから、私たちはメシア[a]の使節として務めています。神が私たちを通して呼びかけておられるかのように、私たちはメシアを代表して懇願します。「神と和解してください。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語Χριστόςは「油を注がれた者」を意味する称号であり、ここではその意味を示すため「メシア」と訳した。
    reason: alternative_reading
  - marker: b
    text: 「神に和解してください」とも訳せる。ギリシア語は受動態の命令形で、神との和解を受けるよう求めている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ Χριστοῦ
  choice: メシアに代わる／メシアに代わって
  rationale: 属格を伴うὑπέρは「～のために」「～に代わって」を表す。使節という文脈に即し、代表として語る意味が明確になる表現を選んだ。Χριστόςはここでは称号として用いられているため「メシア」とした。
- source_word: οὖν
  choice: ですから
  rationale: 前節までの和解についての議論から導かれる結論であることを、自然な現代日本語で示す。
- source_word: πρεσβεύομεν
  choice: 私たちは…使節であり
  rationale: πρεσβεύωは使節・大使として務めることを表す。「使節」は代表として遣わされた役割を明確に伝える。
- source_word: ὡς τοῦ θεοῦ παρακαλοῦντος δι’ ἡμῶν
  choice: 神が私たちを通して訴えておられるかのように
  rationale: ὡςの比較的な力を「かのように」で保ち、διά＋属格の媒介・手段を「私たちを通して」とした。παρακαλέωはこの和解の文脈では、強く呼びかける「訴える」が適切である。
- source_word: δεόμεθα
  choice: お願いします
  rationale: δέομαιの切実な懇願を、現代日本語として自然でありながら真剣さを保つ表現で訳した。
- source_word: καταλλάγητε τῷ θεῷ
  choice: 神と和解してください
  rationale: καταλλάγητεはアオリスト受動命令形。日本語で不自然な強制受動を避けつつ、和解を受け入れるよう求める命令を明確にした。τῷ θεῷの関係的な意味は「神と」で自然に表した。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法よりも、油を注がれた者という称号として機能しているため、その称号性を示す「メシア」を本文に採用した。日本語で広く定着した「キリスト」は脚注に残した。
- issue: 和解における態と主体性
  choice: 神と和解してください
  alternative: 神と和解させられなさい
  rationale: 原文の受動命令形は、神が和解を働きかける一方で、聞き手にも応答が命じられるという緊張を保つ。本文では自然な日本語を優先し、受動形であることは脚注で明示して、神と人の働きを一方的に解消しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、使徒的な訴えの厳粛さを保った。「使節」「和解」など文脈上重要な語は簡潔で定着した語を選び、引用符によって最後の直接的な懇願を際立たせた。
