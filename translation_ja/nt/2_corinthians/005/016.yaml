  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὥστε ἡμεῖς ἀπὸ τοῦ νῦν οὐδένα οἴδαμεν κατὰ σάρκα· ⸀εἰ καὶ ἐγνώκαμεν κατὰ σάρκα Χριστόν, ἀλλὰ νῦν οὐκέτι γινώσκομεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/016.yaml
  text: So from now on we regard no one according to the flesh[a]. Even if we have known Messiah according to the flesh[b], yet now we no longer know him that way.
translation:
  language: ja
  text: ですから、今後は、私たちはだれをも肉に従って知りません[a]。たとえ肉に従ってメシア[b]を知っていたとしても、今はもう、そのようには知りません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉に従って」は、「人間的な見方で」または「世の基準に従って」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語は「クリストン」（Χριστόν）。伝統的には「キリスト」と訳されます。ここでは称号の意味を表すため「メシア」としました。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὥστε
  choice: ですから
  rationale: 直前の議論から結論を導く接続語として、推論のつながりを明確かつ自然に示す。
- source_word: ἀπὸ τοῦ νῦν
  choice: 今から
  rationale: 現在を境とする決定的な変化を簡潔に表す。
- source_word: οὐδένα οἴδαμεν
  choice: だれをも……知ることはしません
  rationale: οἴδαμεν の基本的な「知る」を保ち、後半の ἐγνώκαμεν、γινώσκομεν との語義上の連関を見える形にした。「肉に従って」と組み合わさることで、単なる知識ではなく見方や評価の仕方を指す文脈的含意も保持する。
- source_word: κατὰ σάρκα
  choice: 肉に従って
  rationale: パウロの重要な用語 σάρξ を本文に残し、人間的・地上的な観点による見方という含意を脚注で示す。
- source_word: εἰ καὶ
  choice: たとえ……としても
  rationale: 「たとえそうであったとしても」という譲歩的かつ条件的な形を保ち、「実際にそうだった」と断定する読みには限定しない。
- source_word: ἐγνώκαμεν
  choice: 知っていた
  rationale: 過去における認識を自然な現代日本語で表しつつ、現在の認識との対照を明確にする。
- source_word: Χριστόν
  choice: メシア
  rationale: 「油注がれた者」という称号の意味を伝え、固有名詞化した表現だけに狭めない。
- source_word: ἀλλὰ νῦν οὐκέτι γινώσκομεν
  choice: 今はもう、そのようには知りません
  rationale: 以前と現在との強い対照を示し、目的語は前節のメシアから補い、変化したのは認識の仕方であることを自然に表す。
theological_decisions:
- issue: κατὰ σάρκα が人々およびメシアとの関係で何を意味するか
  choice: 本文では「肉に従って」とし、人間的・地上的な基準による見方という含みを保つ。
  alternative: 人間的な見方で／世の基準に従って
  rationale: パウロの神学的に重要な「肉」という語を残しながら、メシアの真の人間性を否定する意味には解さない。ここで退けられているのは、肉に限られた認識や評価の仕方である。
- issue: εἰ καὶ の事実性
  choice: 「たとえ……としても」と訳し、条件的譲歩の余地を保つ。
  alternative: ……であったとしても／……であったけれども
  rationale: この構文は「たとえそうであっても」とも「実際そうであったが」とも理解され得るため、本文で一方に確定しない。
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号としての意味が生きているため、「メシア」と訳す。伝統的な「キリスト」は脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「肉」「知る」の反復を残して原文の神学的緊張と語の連関を保持した。文体は礼拝朗読にも耐える穏やかで格調あるものとし、過度に専門的な表現は脚注に限った。
