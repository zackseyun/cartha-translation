  text: τὰ δὲ πάντα ἐκ τοῦ θεοῦ τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ ⸀διὰ Χριστοῦ καὶ δόντος ἡμῖν τὴν διακονίαν τῆς καταλλαγῆς,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/018.yaml
  text: All these things are from God[a], who reconciled us to himself through Messiah and gave us the ministry of reconciliation[c][b],
translation:
  language: ja
  text: これらすべては神からのものです[a]。神はメシアを通して私たちをご自分と和解させ、和解の務めを私たちに与えてくださいました[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべて」とも訳せる。この句は、新しい創造を含む直前の事柄を指すとも、さらに広くすべてを指すとも理解できる。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語は「キリストを通して」。ここではΧριστόςが称号として用いられているため、「メシア」と訳した。
    reason: alternative_reading
  - marker: c
    text: 二度出る「私たち」は信者一般を含み得るが、後半については、周辺の文脈でパウロとその同労者に委ねられた使徒的な務めが特に意識されている可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ δὲ πάντα
  choice: これらすべては
  rationale: 定冠詞を伴う中性複数は、直前に述べられた新しい創造や変えられた生き方を受ける可能性が高い。「これらすべて」はその文脈的な指示を保ちつつ、表現の広がりも残す。δέはここでは弱い移行であり、日本語ではあえて接続語を置かない方が自然である。
- source_word: ἐκ τοῦ θεοῦ
  choice: 神から出ています
  rationale: ἐκが示す源・起源を明確に表す。「神からのものです」も可能だが、動的な由来を自然な現代日本語で示した。
- source_word: τοῦ καταλλάξαντος ἡμᾶς ἑαυτῷ
  choice: 神は……私たちをご自分と和解させ
  rationale: アオリスト分詞を独立した文の述語として自然に展開し、再帰代名詞ἑαυτῷが神ご自身を指すことを「ご自分」で明示した。καταλλάσσωの関係回復の意味を「和解させる」で保つ。
- source_word: διὰ Χριστοῦ
  choice: メシアを通して
  rationale: 属格を伴うδιάの手段・媒介を「通して」で表し、Χριστόςはここで称号として機能するため「メシア」とした。
- source_word: καὶ δόντος ἡμῖν
  choice: ……私たちに与えてくださいました
  rationale: 二つ目のアオリスト分詞を、同じ主語を持つ並列述語として訳した。神を主語とする文脈にふさわしい敬意を自然な日本語で示す。
- source_word: τὴν διακονίαν τῆς καταλλαγῆς
  choice: 和解の務め
  rationale: διακονίαは委ねられた奉仕・任務を指し、ここでは「務め」が簡潔で自然である。属格は内容または性格を表すものとして「和解の」とした。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では、神が和解を実現する媒介者としての職務・称号が前面に出ているため、「メシア」と訳した。
- issue: ἡμᾶς／ἡμῖνの範囲
  choice: 私たち
  alternative: 信者一般、またはパウロとその同労者・使徒たち
  rationale: ギリシャ語自体は範囲を限定しない。和解された「私たち」は信者一般を含み得る一方、「務め」を委ねられた「私たち」は周辺文脈でパウロと同労者を特に指し得るため、本文では曖昧さを保持し、脚注で示した。
- issue: 和解の主体
  choice: 神が私たちをご自分と和解させた
  alternative: 私たちが神と和解した
  rationale: 能動分詞καταλλάξαντοςの主語は神であり、神の側からの行為として明確に訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「和解」「メシア」など本文の主要概念は保持し、分詞構文は読みやすい二文に展開した。原文に明示的な時間副詞がないため、英語改訂前のNowに相当する「さて」「今や」は加えていない。
