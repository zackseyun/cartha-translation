id: 2CO.5.21
reference: 2 Corinthians 5:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀τὸν μὴ γνόντα ἁμαρτίαν ὑπὲρ ἡμῶν ἁμαρτίαν ἐποίησεν, ἵνα ἡμεῖς γενώμεθα δικαιοσύνη θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/021.yaml
  text: He made the one who did not know sin to be sin for us[b][a], so that in him we might become the righteousness of God.
translation:
  language: ja
  text: 罪を知らなかった方を、神は私たちのために罪とされました。[a] それは、私たちがこの方にあって神の義となるためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪のためのささげ物とされました」。ギリシア語では二度とも「罪」という同じ語が使われていますが、二度目を犠牲の意味に理解する見方もあります。
    reason: alternative_reading
  - marker: b
    text: 「神の義」は、「神の正義」または「神から与えられる義」とも理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸν μὴ γνόντα ἁμαρτίαν
  choice: 罪を知らなかった方
  rationale: 「知らなかった」はγινώσκωの基本義とギリシア語の簡潔な表現を保ち、罪を犯さなかったという含意を説明的に本文へ持ち込まない。「方」により、直前の文脈で示されるキリストを自然に指す。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのために
  rationale: 受益・代理の幅を保ち、特定の贖罪理解だけに限定しない自然な日本語。
- source_word: ἁμαρτίαν (second occurrence)
  choice: 罪
  rationale: 原文で反復されるἁμαρτίαを同じく「罪」とし、パウロの衝撃的で圧縮された言い方を保つ。「罪のささげ物」は脚注に示す。
- source_word: ἐποίησεν
  choice: 罪とされました
  rationale: 日本語では神を主語にした「罪とされた」が自然であり、目的格補語を伴うποιέωの「～とする」を表す。どのような意味で「罪」とされたかは本文で過度に規定しない。
- source_word: ἵνα ἡμεῖς γενώμεθα
  choice: それは、私たちが…となるためです
  rationale: ἵναの目的とγενώμεθαの生成・移行の含みを、「なるため」で明確かつ自然に表す。
- source_word: δικαιοσύνη θεοῦ
  choice: 神の義
  rationale: θεοῦの属格が持つ由来・所有・関係などの可能性を「神の」という簡潔な形で開いたままにする。δικαιοσύνηはパウロ書簡の神学的密度を保つ定着した「義」とする。
- source_word: ἐν αὐτῷ
  choice: この方にあって
  rationale: パウロ特有のἐν αὐτῷを、結合の意味に限定して説明せず、聖書文体として理解可能な「この方にあって」で保つ。
theological_decisions:
- issue: 「罪とされた」の意味
  choice: 罪のないキリストが私たちのために「罪とされた」という原文の緊張をそのまま残す。
  alternative: 「罪のためのささげ物とされた」と明示する、または道徳的に罪深い者となったと解する。
  rationale: 前半がその方は罪を知らなかったと明言するため、道徳的に罪深くなったとの意味にはならない。一方、犠牲としての「罪のささげ物」という理解には根拠があるので脚注に残し、本文では決着させない。
- issue: δικαιοσύνη θεοῦの解釈
  choice: 「神の義」と訳し、属格の意味を限定しない。
  alternative: 「神から与えられる義」または「神の正義」。
  rationale: この句は、神ご自身の義、神に由来する義、神との正しい関係・身分などを含みうる。本文では一つの教理体系に狭めず、主要な語義上の代案を脚注に示す。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「この方にあって」「神の義」など、原文の神学的密度と曖昧さを保つために定着した聖書語法を用いた。敬体で統一し、キリストへの敬意を「方」で自然に表した。
