  rationale: 原文の相を「和解させておられ」で明示し、λογίζομαι の勘定・帰属の比喩を不必要に抽象化せず「彼らに負わせず」と訳した。「メシアにあって」は ἐν の所在・領域・手段に関する含みを固定しないため維持した。脚注は主文の意訳「委ねられた」を補い、原文の「置く」と ἐν ἡμῖν の複数の可能性を示す。
