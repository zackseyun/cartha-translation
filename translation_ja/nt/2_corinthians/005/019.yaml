reference: 2 Corinthians 5:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς ὅτι θεὸς ἦν ἐν Χριστῷ κόσμον καταλλάσσων ἑαυτῷ, μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν, καὶ θέμενος ἐν ἡμῖν τὸν λόγον τῆς καταλλαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/019.yaml
  text: namely[a], that God was in Messiah reconciling the world to himself, not counting their trespasses against them[d][c][b], and entrusting to us the message of reconciliation.
translation:
  language: ja
  text: すなわち、神はメシアにあって世をご自分と和解させておられ、人々の背きを彼らに負わせず、和解のことばを私たちに[a]委ねられたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「和解のことばを私たちのうちに置かれた」となる。「私たちの間に置かれた」または「私たちに置かれた」とも訳せる。
    reason: ἐν ἡμῖν と θέμενος の字義および解釈上の幅を示すため。
lexical_decisions:
- source_word: ὡς ὅτι
  choice: すなわち
  rationale: 前節の内容を説明する導入句として、重複を避けつつ説明的な働きを自然な現代日本語で示す。
- source_word: θεὸς ἦν ἐν Χριστῷ
  choice: 神はメシアにあって
  rationale: ἐνの『中に／あって』という表現を保ち、神がメシアにおいて、またメシアを通して働かれたという含みを一方に限定しない。
- source_word: κόσμον
  choice: 世
  rationale: 人類を中心に、神から離れた世界全体を指し得る広がりを保つ、聖書日本語として自然な訳語。
- source_word: καταλλάσσων / καταλλαγῆς
  choice: 和解させる／和解
  rationale: 同根語を同じ語幹で訳し、神による関係回復という節内の連関を明確にする。
- source_word: μὴ λογιζόμενος αὐτοῖς τὰ παραπτώματα αὐτῶν
  choice: 人々の背きを彼らの責任として数えず
  rationale: λογίζομαιの勘定・帰属の含みを『責任として数える』で示し、παράπτωμαは道を踏み外す行為を表す『背き』とした。
- source_word: καὶ θέμενος ἐν ἡμῖν
  choice: 私たちに委ねられた
  rationale: 直訳は『私たちのうちに置いた』だが、宣教のことばを託す文脈で自然な日本語にした。ἐνの字義的表現は脚注に残す。
- source_word: τὸν λόγον τῆς καταλλαγῆς
  choice: 和解のことば
  rationale: λόγοςの表現を保ちつつ、単独の語ではなく告知内容を指すこともできる日本語とした。
theological_decisions:
- issue: θεὸς ἦν ἐν Χριστῷ の統語的・神学的含意
  choice: 神はメシアにあって世をご自分と和解させ
  alternative: 神はメシアのうちにおられ、世をご自分と和解させていた／神はメシアを通して世をご自分と和解させ
  rationale: 原文は神の存在と和解の働きをメシアとの関係で述べるが、ἐνを所在または手段のどちらかだけに確定しない。日本語の『にあって』でその緊張を保った。
- issue: ἐν ἡμῖν の解釈
  choice: 私たちに委ねられた
  alternative: 私たちのうちに置かれた／私たちの間に置かれた
  rationale: 使徒的使命の文脈では『委ねる』が自然だが、原文の具体的な『置く』という表現には複数の理解があり得るため脚注で示した。
- issue: Χριστός の訳
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味を明示し、固有名のように処理しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。『メシアにあって』は日常語よりやや聖書的だが、原文のἐνが持つ所在・領域・手段の曖昧さを保つため採用した。主節の日本語を自然にするため分詞を並列的な述語として整えた。
