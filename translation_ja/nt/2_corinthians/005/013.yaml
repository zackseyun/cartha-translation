  text: εἴτε γὰρ ἐξέστημεν, θεῷ· εἴτε σωφρονοῦμεν, ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/013.yaml
  text: For if we are out of our minds[a], it is for God; if we are of sound mind[b], it is for you.
translation:
  language: ja
  text: というのも、私たちが我を忘れているのなら[a]、それは神のためです。正気でいるのなら[b]、それはあなたがたのためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正気を失っているのなら」「気が狂っているのなら」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「分別を保っているのなら」「思慮深く振る舞っているのなら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ... εἴτε
  choice: …のなら…、…のなら…
  rationale: 二つの可能性を対照させる反復構文として訳し、原文の条件的な響きと二者択一の力を自然な日本語で保った。
- source_word: γὰρ
  choice: というのも…からです
  rationale: 直前の発言に理由や説明を加える接続機能を、現代日本語で明瞭に示した。
- source_word: ἐξέστημεν
  choice: 正気を失っている
  rationale: この文脈での自動詞的用法「我を失う、気が狂っている」を、対照語との関係が明確な自然な表現で示した。アオリストの形を機械的な過去時制にはせず、修辞的な現時点での評価を表した。
- source_word: θεῷ
  choice: 神のため
  rationale: 省略を含む与格を利益・関係の意味に取り、行動が神に向けられていることを簡潔に表した。「神に対して」も可能だが、日本語では文意がやや不明瞭になる。
- source_word: σωφρονοῦμεν
  choice: 正気でいる
  rationale: 分別がある、健全な判断をするという意味を、ἐξέστημενとの鋭い対照が伝わる表現にした。
- source_word: ὑμῖν
  choice: あなたがたのため
  rationale: θεῷと並行する省略的な与格を利益の意味に取り、落ち着いた振る舞いがコリントの人々の益となることを表した。
theological_decisions:
- issue: パウロの対照的な自己描写の解釈
  choice: 周囲から正気を失っているように見える状態と、正気で分別ある状態とを対照させるが、文字どおりの狂気とは断定しない。
  alternative: 実際の宗教的恍惚状態を指す、または反対者の非難だけを誇張して語る。
  rationale: 原文は短く修辞的で、具体的に何を指すかを明示していない。訳文は鋭い対照を保ちながら、特定の恍惚体験の教理や単なる侮辱という解釈を持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「正気」を反復して原文の語彙的対照をわかりやすくし、「というのも…からです」でγάρの説明的機能を自然に表した。すべての脚注記号を本文中に配置した。
