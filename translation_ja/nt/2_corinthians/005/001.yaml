id: 2CO.5.1
reference: 2 Corinthians 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ἐὰν ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους καταλυθῇ, οἰκοδομὴν ἐκ θεοῦ ἔχομεν οἰκίαν ἀχειροποίητον αἰώνιον ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/001.yaml
  text: For we know that if our earthly tent-house is torn down[a], we have a building from God, a house not made with hands[d][c][b], eternal in the heavens.
translation:
  language: ja
  text: というのは、地上にある私たちの住まい、すなわちこの幕屋が取り壊されるなら[a][b]、私たちには、神からの建物、すなわち人の手で造られたものではない[d]、天にある永遠の住まいがあることを、私たちは知っているからです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「地上にある私たちの幕屋の住まい」。原文は、今の死ぬべき住まいについて「住まい」と「幕屋」の両方のイメージを重ねています。
    reason: lexical_alternative
  - marker: b
    text: 「滅ぼされるなら」または「解体されるなら」とも訳せます。この動詞には建造物を取り壊す意味があり、幕屋のイメージに合っています。
    reason: lexical_alternative
  - marker: c
    text: 原文は「持つことになる」ではなく、現在形で「持っている」と述べています。現在すでに持っていることと、将来それが実現することとの緊張が保たれています。
    reason: alternative_reading
  - marker: d
    text: 直訳は「手で造られたものではない」。人間の手によるものではなく、神に由来するものを示す聖書的な響きを持つ表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 私たちはそのことを知っている
  rationale: 単なる気づきではなく、確かな知識を表すοἶδαの通常の意味を、自然な現代日本語で表した。目的内容を先に置き、日本語として読みやすくした。
- source_word: γὰρ
  choice: からです
  rationale: 直前の議論を根拠づけるγάρの説明的な接続機能を、文末の「からです」で明示した。
- source_word: ἐὰν ... καταλυθῇ
  choice: 取り壊されても
  rationale: καταλύωには建造物を解体する含みがあり、幕屋の比喩にもよく合う。「ても」は将来起こり得る事態を示しつつ、後半の確信との自然な対照を作る。
- source_word: ἡ ἐπίγειος ἡμῶν οἰκία τοῦ σκήνους
  choice: 地上にある私たちの住まい、この幕屋
  rationale: οἰκία（住まい）とσκῆνος（幕屋）の両方を残し、直接「体」と解釈して置き換えない。日本語では同格表現にして混合した住居比喩を明瞭にした。
- source_word: οἰκοδομὴν ἐκ θεοῦ
  choice: 神からの建物
  rationale: οἰκοδομήを具体的な建造物として、ἐκ θεοῦを起源を示す「神からの」で簡潔に訳した。
- source_word: ἔχομεν
  choice: 私たちは持っている
  rationale: ギリシア語の現在形をそのまま現在表現で残し、現在の所有と将来の実現をめぐる緊張を訳文で解消しない。
- source_word: οἰκίαν ἀχειροποίητον
  choice: 人の手で造られたものではない……住まい
  rationale: ἀχειροποίητοςが示す、人間の製作ではなく神に由来するものという聖書的な対照を、自然な日本語で保った。
- source_word: αἰώνιον
  choice: 永遠の
  rationale: 一時的な地上の幕屋と対照される、尽きることのない性質を明確に表す。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天にある
  rationale: 日本語ではギリシア語の複数形を機械的に再現せず、聖書語として自然な「天」を用いた。場所を示す修飾関係は保持した。
theological_decisions:
- issue: 住まいの比喩が指すもの
  choice: 「住まい」「幕屋」「建物」という建築・住居の比喩を本文に残す。
  alternative: 「地上の体が滅ぼされても」のように、指示対象を「体」と明示する。
  rationale: 本文は住まいと幕屋を重ね、さらに神からの建物と対照している。「体」への置換は妥当な解釈ではあるが、原文の比喩の重なりを平板化するため本文には入れない。
- issue: ἔχομενの時間的意味
  choice: 現在形の「持っている」とする。
  alternative: 将来形の「持つことになる」とする。
  rationale: 将来の復活を確実なものとして先取りしている可能性はあるが、原文自体は現在形である。現在の所有と将来の実現との神学的緊張を保持する。
- issue: 地上の幕屋が失われる条件表現
  choice: 「取り壊されても」とする。
  alternative: 「取り壊されるなら」または「滅ぼされるなら」とする。
  rationale: ἐάνは将来の可能性を示すが、後半には確信された所有が述べられる。日本語の譲歩条件はこの論理を自然に示す一方、実際の死や滅びの様態を断定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「幕屋」「永遠」「天」など本文の荘重な聖書的語彙を保持した。ギリシア語の語順は日本語として不自然になるため、知識の内容を先に提示し、γάρの根拠提示を文末の「知っているからです」で表した。
