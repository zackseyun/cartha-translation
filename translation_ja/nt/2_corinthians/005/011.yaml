reference: 2 Corinthians 5:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰδότες οὖν τὸν φόβον τοῦ κυρίου ἀνθρώπους πείθομεν, θεῷ δὲ πεφανερώμεθα· ἐλπίζω δὲ καὶ ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/005/011.yaml
  text: Therefore[a], knowing the fear of the Lord, we persuade people; but we have been made known to God[b], and I hope that we also have been made known in your consciences.
translation:
  language: ja
  text: ですから、私たちは主への恐れを知っているので、人々を説得しています。しかし、私たちは神には明らかになっており、また、あなたがた一人ひとりの良心にも明らかになっていることを、私は願っています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰδότες οὖν
  choice: こういうわけで、私たちは…知っているので
  rationale: οὖνが前節、とりわけキリストの裁きの座についての記述から導く論理的帰結を示すことを「こういうわけで」で表した。Εἰδότεςは現在的な意味を持つ完了分詞であり、主動詞との関係には原因の含みが自然に認められるため、「知っているので」とした。
- source_word: τὸν φόβον τοῦ κυρίου
  choice: 主を恐れること
  rationale: φόβοςの強さを「畏敬」だけに弱めず、直前の裁きの文脈にある畏れと責任意識を保った。「主への恐れ」よりも現代日本語として自然な表現を選んだ。
- source_word: ἀνθρώπους πείθομεν
  choice: 人々を説得しています
  rationale: ἀνθρώπουςは性別を限定しない総称なので「人々」とし、πείθομενの現在能動直説法を、試みだけに弱めず「説得しています」と訳した。
- source_word: θεῷ δὲ πεφανερώμεθα
  choice: しかし、私たちのことは神には明らかになっています
  rationale: φανερόωの完了受動が表す、すでに明らかにされており現在も明らかな状態を、自然な日本語で表した。δέの対照は「しかし」で示した。
- source_word: ἐλπίζω
  choice: 私は願っています
  rationale: ἐλπίζωは期待や希望を表す。ここでは日本語として自然な「願っています」を用い、パウロの控えめな個人的期待を保った。
- source_word: ἐν ταῖς συνειδήσεσιν ὑμῶν πεφανερῶσθαι
  choice: あなたがたの良心にも明らかになっていること
  rationale: 複数形συνειδήσεσινがコリントの人々それぞれの内的・道徳的認識を指すことを、集合的に「あなたがたの良心」と表した。完了受動不定詞の結果状態は「明らかになっている」で保った。
theological_decisions:
- issue: 「主への恐れ」の意味
  choice: 「主を恐れること」とし、恐れという語義を残す
  alternative: 「主を畏敬すること」
  rationale: 直前の5章10節に神の裁きの座があるため、単なる敬意に限定せず、畏敬と神への責任意識の双方を含み得る表現を保持した。
- issue: 神およびコリントの人々に対するφανερόωの意味
  choice: 「明らかになっています」
  alternative: 「明らかにされています」「現されています」
  rationale: パウロたちの実像や働きが神の前では完全に知られており、コリントの人々の良心にもそう認識されていることを示す。何が明らかになったかを説明的に限定せず、原文の余地を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、書簡としての品位を保った。「説得しています」は原文の能動的な力を残し、「明らかになっています」の反復によってギリシア語の同一動詞の対応を示した。
