revisions:
- from: こういうわけで、私たちは主を恐れること[a]を知っているので、人々を説得しています。しかし、私たちのことは神には明らかになっています[b]。そして、あなたがたの良心にも明らかになっていることを、私は願っています。
  to: ですから、私たちは主への恐れを知っているので、人々を説得しています。しかし、私たちは神には明らかになっており、また、あなたがた一人ひとりの良心にも明らかになっていることを、私は願っています。
  rationale: 「主への恐れを知っている」に改め、ギリシア語の名詞句φόβον τοῦ κυρίουを自然かつ正確に反映しました。「ですから」はοὖνの推論的な接続を明瞭に示します。後半は「明らかになっている」を反復してπεφανερώμεθα／πεφανερῶσθαιの対応と完了の結果状態を保ち、「一人ひとりの良心」で複数形συνειδήσεσινの含意を示しました。脚注のアンカーと内容は維持でき、変更を要しません。
  reviewer_model: gpt-5.6-terra
