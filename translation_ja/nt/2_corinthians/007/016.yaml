  text: I rejoice that in every way I have confidence in you[a].
translation:
  language: ja
  text: 私は、どのようなことについてもあなたがたに確信を持っていることを喜んでいます[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は、何事についてもあなたがたを信頼しているので、喜んでいます。」
    reason: ὅτιは喜びの内容としても理由としても理解できる。また、θαρρέω ἐν ὑμῖνは「あなたがたについて確信を持つ」のほか、「あなたがたを信頼する」と訳し得るため。
lexical_decisions:
- source_word: χαίρω
  choice: 喜んでいます
  rationale: 現在形の喜びを、自然で品位のある現代日本語で表した。単なる一時的な感情よりも、パウロの現在の喜びを明確に伝える。
- source_word: ὅτι
  choice: ～ことを
  rationale: ここでは、喜びの内容を導く用法と捉えた。原因を表す「～ので」も文法上可能なため、脚注に別訳を示した。
- source_word: ἐν παντί
  choice: あらゆる点で
  rationale: 直訳的な「すべてにおいて」より自然でありながら、包括的な範囲を保つ副詞的表現とした。
- source_word: θαρρῶ
  choice: 信頼できる
  rationale: 文脈上、コリントの信徒たちに対する確信を表すと判断した。語には「心強く思う」「勇気を持つ」という含みもあるため、脚注でその可能性を残した。
- source_word: ἐν ὑμῖν
  choice: あなたがたを
  rationale: θαρρέωとの結びつきから、相手に寄せる信頼を自然な日本語で表した。前置詞の関係を「あなたがたのことで」と理解する可能性は脚注に反映した。
