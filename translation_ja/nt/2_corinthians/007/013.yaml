id: 2CO.7.13
reference: 2 Corinthians 7:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο παρακεκλήμεθα. Ἐπὶ δὲ τῇ παρακλήσει ⸀ἡμῶν περισσοτέρως μᾶλλον ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου, ὅτι ἀναπέπαυται τὸ πνεῦμα αὐτοῦ ἀπὸ πάντων ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/013.yaml
  text: For this reason we have been comforted[a]. And in addition to our comfort, we rejoiced even more abundantly at Titus’s joy[b], because his spirit has been refreshed by all of you.
translation:
  language: ja
  text: こういうわけで、私たちは慰められました。[a] その慰めに加えて、テトスの喜びによって、私たちはなおいっそう大いに喜びました。あなたがた皆によって、彼の霊が安らぎを得たからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「慰められました」「慰め」は、それぞれ「励まされました」「励まし」とも訳せる。ギリシア語の同族語は、この文脈で両方の意味を含み得る。
    reason: lexical_alternative
  - marker: b
    text: 「安らぎを得た」は、「新たに力づけられた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: こういうわけで
  rationale: 直前の内容を受ける因果・帰結を、自然な現代日本語で明示する。
- source_word: παρακεκλήμεθα / παρακλήσει
  choice: 慰められました／慰め
  rationale: 同族語の対応を保ち、完了形が示す、それまでの働きかけによって生じた現在の状態を表す。「励まし」の意味もあり得るため脚注に示した。
- source_word: Ἐπὶ δὲ τῇ παρακλήσει ἡμῶν
  choice: その慰めに加え
  rationale: 自分たちが受けた慰めを土台として、さらに大きな喜びが加わったという文脈上の関係を簡潔に表す。
- source_word: περισσοτέρως μᾶλλον
  choice: なおさら大いに
  rationale: 比較表現を重ねた原文の強調を、過度に逐語的にならない日本語で再現する。
- source_word: ἐχάρημεν ἐπὶ τῇ χαρᾷ Τίτου
  choice: テトスが喜んでいるのを見て、私たちは……喜びました
  rationale: 「テトスの喜び」を自然な日本語の節に展開し、喜びがさらなる喜びを生んだ関係を保つ。
- source_word: ἀναπέπαυται
  choice: 安らぎを得た
  rationale: 完了形の結果状態と、「休息・安らぎを得る」という語の基本的な像を保つ。文脈上の「元気づけられた」という含みは脚注に示した。
- source_word: τὸ πνεῦμα αὐτοῦ
  choice: 彼の霊
  rationale: 原文の人間論的表現を保持する。ここではテトス自身の内面・心の状態を指す。
- source_word: ἀπὸ πάντων ὑμῶν
  choice: あなたがた皆によって
  rationale: ἀπόがここで表す働きかけの源を、日本語で自然な受動文の行為者として表現する。
theological_decisions:
- issue: τὸ πνεῦμα αὐτοῦ が指すもの
  choice: テトス自身の霊、すなわち内面
  alternative: 聖霊
  rationale: 三人称単数の所有表現「彼の」と、コリントの人々との出会いによって安らいだという文脈から、聖霊ではなくテトスの内面を指す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の同族語と強調を可能な範囲で保持しつつ、長い一文を日本語として読みやすい三文に分けた。「霊」は聖霊との混同を文脈で避けながら、原文の表現を残した。
