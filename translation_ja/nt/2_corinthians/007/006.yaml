  text: ἀλλ’ ὁ παρακαλῶν τοὺς ταπεινοὺς παρεκάλεσεν ἡμᾶς ὁ θεὸς ἐν τῇ παρουσίᾳ Τίτου·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/006.yaml
  text: But God[a], who comforts the humble[b], comforted us by the coming of Titus.
translation:
  language: ja
  text: しかし、気落ちしている人たち[a]を慰めてくださる神は、テトスが来たこと[b]によって、私たちを慰めてくださいました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「謙遜な人たち」または「低い立場の人たち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: または「テトスが共にいたこと」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前に述べられた苦難や恐れとの対照を、現代日本語で自然かつ明確に示す。
- source_word: ὁ παρακαλῶν
  choice: 慰めてくださる
  rationale: 苦難の文脈に合い、後のπαρεκάλεσενとの語彙上の対応も保つ。現在分詞は、神がそのような方であることを表す表現として訳した。
- source_word: τοὺς ταπεινοὺς
  choice: 身を低くされた人たち
  rationale: 境遇や心の状態によって低くされた人々を指し得る語であり、自発的な謙遜だけに限定せず、文脈上の苦境も表せる。
- source_word: παρεκάλεσεν
  choice: 慰めてくださいました
  rationale: ὁ παρακαλῶνと同じ語根の反復を「慰める」で保ち、テトスを通して与えられた慰めを自然な敬語で表す。
- source_word: ἐν τῇ παρουσίᾳ Τίτου
  choice: テトスが来たことによって
  rationale: παρουσίαは「到来」と「臨在・共にいること」の両義を持つが、ここではテトスの到着という出来事が慰めをもたらした文脈に即して訳し、別の可能性は脚注に示す。
- source_word: ὁ θεὸς
  choice: 神は
  rationale: 明示された行為主体を、日本語で自然な主題構文にして表した。
theological_decisions:
- issue: τοὺς ταπεινοὺςが表す人々の状態
  choice: 身を低くされた人たち
  alternative: 気落ちした人たち／低い立場の人たち
  rationale: この語は謙遜な人、社会的に低い人、苦難で打ちひしがれた人のいずれをも指し得る。本文では苦難によって低くされた状態を示しつつ、感情面や社会的地位だけに意味を限定しない表現を選んだ。
- issue: παρουσίαの意味
  choice: テトスが来たこと
  alternative: テトスが共にいたこと
  rationale: 後続文脈ではテトスの到着と彼が携えた知らせがパウロたちの慰めになっているため、出来事としての「到来」を本文に採用した。ただし「臨在・同席」の含みも脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の行為には「くださる／くださいました」を用いて聖書本文としての品位を保った。「慰める」の反復によって原文の語彙的結び付きを示した。
