  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλή μοι παρρησία πρὸς ὑμᾶς, πολλή μοι καύχησις ὑπὲρ ὑμῶν· πεπλήρωμαι τῇ παρακλήσει, ὑπερπερισσεύομαι τῇ χαρᾷ ἐπὶ πάσῃ τῇ θλίψει ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/004.yaml
  text: I have great boldness toward you[a], and great boasting on your behalf. I am filled with encouragement[c][b]; I overflow with joy in all our affliction.
translation:
  language: ja
  text: 私はあなたがたに対して大いに率直であり[a]、あなたがたについて大いに誇っています。私は励ましに満たされ[b]、私たちのあらゆる苦難の中で[c]、喜びにあふれています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたに対して大いに確信を抱いている」または「大いに大胆である」。このギリシア語は、率直に語ることや包み隠さない態度をも表します。
    reason: lexical_alternative
  - marker: b
    text: 「励まし」は「慰め」とも訳せます。原語には、力づけることと慰めることの両方の意味があります。
    reason: lexical_alternative
  - marker: c
    text: 別訳「あらゆる苦難にもかかわらず」。ここでは、苦難のただ中で喜びがあふれているという意味に取りました。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησία
  choice: 確信
  rationale: ここでは、コリントの人々に対するパウロの信頼に満ちた率直さを表す。「確信」は文脈に自然であり、語が含みうる大胆さや率直さについては脚注で示す。
- source_word: καύχησις
  choice: 誇っています
  rationale: パウロに特徴的な肯定的な「誇り／誇ること」の語法を保ちつつ、現代日本語で不自然に強い自慢の含意を避ける。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたのことを
  rationale: ここでは、コリントの人々に関して好意的に誇るという関係を、自然な日本語で表す。
- source_word: πεπλήρωμαι
  choice: 満たされ
  rationale: 完了受動形が表す、満たされた結果として現在その状態にあることを簡潔に表す。
- source_word: παράκλησις
  choice: 励まし
  rationale: この語が持つ力づけと慰めの両面のうち、本文では「励まし」を採り、もう一方を脚注に残す。
- source_word: ὑπερπερισσεύομαι
  choice: あふれています
  rationale: 強意を伴う豊かさを、「喜び」と自然に結びつく「あふれる」で表す。
- source_word: χαρά
  choice: 喜び
  rationale: 語の通常の意味を明瞭かつ自然に伝える。
- source_word: ἐπὶ πάσῃ τῇ θλίψει ἡμῶν
  choice: 私たちのあらゆる苦難の中で
  rationale: 苦難と喜びが同時に存在する緊張を保ち、単純な逆接へと言い換えない。
- source_word: πολλή ... πολλή
  choice: 大いに……大いに
  rationale: 原文の反復と強調を保ちながら、二つの節を自然に対応させる。
theological_decisions:
- issue: 肯定的なパウロのκαύχησιςをどう訳すか
  choice: 「誇っています」とし、誇りの語法を保持する
  alternative: 「あなたがたを誇りに思っています」または「あなたがたについて自慢しています」
  rationale: 「誇る」というパウロの修辞を弱めず、同時に罪深い自己誇示という意味を不用意に持ち込まないため。
- issue: 苦難と喜びの関係
  choice: 「苦難の中で」と訳す
  alternative: 「あらゆる苦難にもかかわらず」
  rationale: 原文は苦難のただ中で喜びがあふれるという併存を示しうるため、その神学的緊張を逆接に限定せず保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの感情の強さと原文の並行表現を保った。「確信」「誇る」「励まし」「苦難」は教会内だけに限定されない一般的で品位ある語彙である。
