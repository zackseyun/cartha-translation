id: 2CO.7.12
reference: 2 Corinthians 7:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄρα εἰ καὶ ἔγραψα ὑμῖν, οὐχ ⸀ἕνεκεν τοῦ ἀδικήσαντος, ⸀οὐδὲ ⸁ἕνεκεν τοῦ ἀδικηθέντος, ἀλλ’ ⸀1ἕνεκεν τοῦ φανερωθῆναι τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν πρὸς ὑμᾶς ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/012.yaml
  text: So even if I wrote to you[a], it was not because of the one who did wrong, nor because of the one who was wronged[b], but so that your earnestness for us might be made known among you before God.
translation:
  language: ja
  text: ですから、たとえ私があなたがたに手紙を書いたとしても、それは、不正を働いた人のことが理由でも、不正を被った人のことが理由でもなく、あなたがたの私たちに対する熱意[b]が、神の前であなたがたの間に明らかになるためでした[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「私たちのあなたがたに対する熱意が、神の前であなたがたの間に明らかになるためでした」とあります。
    reason: textual_variant
  - marker: b
    text: 「熱心さ」「真剣な配慮」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα εἰ καὶ
  choice: ですから、たとえ……としても
  rationale: ἄραの推論的なつながりを「ですから」で示し、εἰ καὶの譲歩的な力を「たとえ……としても」で保った。
- source_word: ἔγραψα ὑμῖν
  choice: 私があなたがたに手紙を書いた
  rationale: アオリストを、以前に書いた手紙を指す自然な過去表現とした。目的語は文脈上「手紙」と補った。
- source_word: τοῦ ἀδικήσαντος
  choice: 不正を働いた人
  rationale: 実体詞的能動分詞を、行為の意味を保つ簡潔な人物表現にした。具体的な事件の内容は限定していない。
- source_word: τοῦ ἀδικηθέντος
  choice: 不正を受けた人
  rationale: 受動分詞を前句と対応する表現にし、被害の具体的性質を決めつけないようにした。
- source_word: ἕνεκεν τοῦ φανερωθῆναι
  choice: 明らかになるため
  rationale: ἕνεκενを伴う冠詞付き不定詞の目的用法と、φανερωθῆναιの受動的な意味を保持した。
- source_word: τὴν σπουδὴν ὑμῶν τὴν ὑπὲρ ἡμῶν
  choice: あなたがたの私たちに対する熱意
  rationale: 本文のὑμῶνを所有・主体として、ὑπὲρ ἡμῶνをパウロたちに向けられた関心として訳した。σπουδήの真剣な熱心さを「熱意」で表した。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたの間に
  rationale: 難解な構文であるため意味を過度に確定せず、共同体の中で明らかになるという自然な日本語にした。方向を表す「あなたがたに」も可能である。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の前で
  rationale: 神の臨在と証言を意識させる簡潔で荘重な表現とした。
theological_decisions:
- issue: 「あなたがたの私たちに対する熱意……あなたがたの間に」という難解な句の解釈
  choice: コリントの人々がパウロたちに抱く熱意が、彼ら自身の間で明らかになるという意味に訳した。
  alternative: 「私たちのあなたがたに対する熱意が、あなたがたの間で明らかになる」と読む異文。また、πρὸς ὑμᾶςを「あなたがたに」と方向的に訳すこともできる。
  rationale: SBLGNT本文のὑμῶν、ὑπὲρ ἡμῶν、πρὸς ὑμᾶςをそれぞれ反映しつつ、構文上の難しさを注で補った。異文は本文へ取り込まず、脚注に残した。
- issue: 手紙を書いた直接の目的
  choice: 加害者または被害者だけのためではなく、共同体の熱意を明らかにするためとした。
  alternative: 加害者や被害者への配慮が一切なかったという絶対的否定として読む。
  rationale: οὐχ……οὐδὲ……ἀλλ’の対比は手紙の主要目的を強調する表現であり、他の配慮が皆無だったと本文以上に断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「不正を働く」「神の前で」など聖書本文にふさわしい品位を保った。原文の長い対比構造を一文で維持し、難解な末尾の構文と本文異文は脚注で示した。
