id: 2CO.7.10
reference: 2 Corinthians 7:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γὰρ κατὰ θεὸν λύπη μετάνοιαν εἰς σωτηρίαν ἀμεταμέλητον ⸀ἐργάζεται· ἡ δὲ τοῦ κόσμου λύπη θάνατον κατεργάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/010.yaml
  text: For godly sorrow produces repentance leading to salvation without regret[b][a], but worldly sorrow produces death.
translation:
  language: ja
  text: 神のみこころに沿う悲しみ[a]は、後悔することのない救いに至る悔い改め[b]を生み出します。しかし、この世の悲しみは死をもたらします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「神に即した悲しみ」または「神に従った悲しみ」。
    reason: lexical_alternative
  - marker: b
    text: 「後悔することのない」は「悔い改め」を修飾すると理解できるが、「救い」に直接関係づけて理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ θεὸν
  choice: 神のみこころに沿う
  rationale: 直訳は「神に従った／神に即した」。悲しみが神の基準や意向にかなうことを、現代日本語で自然に表し、「この世の」との対比も保った。
- source_word: λύπη
  choice: 悲しみ
  rationale: 感情的な苦痛と道徳的な痛みの両方を含み得る、文脈に適した一般的な訳語。
- source_word: μετάνοιαν
  choice: 悔い改め
  rationale: 単なる考え直しではなく、生き方の転換を伴う道徳的・霊的意味を表す定着した訳語。
- source_word: εἰς σωτηρίαν
  choice: 救いに至る
  rationale: εἰς の目標・結果への方向性を示しつつ、救いとの因果関係を本文以上に規定しない。
- source_word: ἀμεταμέλητον
  choice: 後悔することのない
  rationale: 文法上 μετάνοιαν を修飾する形容詞として訳し、その悔い改めが後悔されるものではないという意味を保った。
- source_word: ἐργάζεται
  choice: 生み出します
  rationale: 悲しみが悔い改めをもたらす働きを、自然な日本語で表した。
- source_word: τοῦ κόσμου
  choice: この世の
  rationale: 神に沿う悲しみと対照される、神に背く世界秩序に属する悲しみを表しつつ、意味を過度に限定しない。
- source_word: θάνατον
  choice: 死
  rationale: 身体的、霊的、終末的な含意を本文が限定していないため、広がりのある語をそのまま用いた。
- source_word: κατεργάζεται
  choice: もたらします
  rationale: 結果を生じさせる意味を明確にし、前半との修辞的並行を保ちながら自然な日本語にした。
theological_decisions:
- issue: 二種類の悲しみの対比
  choice: 「神のみこころに沿う悲しみ」と「この世の悲しみ」として対比する。
  alternative: 「敬虔な悲しみ」と「世俗的な悲しみ」
  rationale: 前者を単なる宗教的感情、後者を単なる人間的感情と狭めず、神に即するものと世に属するものとの原文の対比を保った。
- issue: 悔い改めと救いの関係
  choice: 「救いに至る」とする。
  alternative: 「救いを生じさせる」「救いのための」
  rationale: 救いを目標または結果として示す一方、悔い改めを独立した功績的原因とするなど、本文にない仕組みを持ち込まない。
- issue: 「死」の範囲
  choice: 限定せず「死」とする。
  alternative: 「霊的な死」「永遠の死」
  rationale: この節自体は死の様態を明示していないため、神学的な幅と緊張を保持した。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。教会で定着している「悔い改め」「救い」を用いながら、文全体は一般の読者にも理解しやすい表現とした。
