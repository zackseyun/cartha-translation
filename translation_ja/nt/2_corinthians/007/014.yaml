id: 2CO.7.14
reference: 2 Corinthians 7:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι εἴ τι αὐτῷ ὑπὲρ ὑμῶν κεκαύχημαι, οὐ κατῃσχύνθην, ἀλλ’ ὡς πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν, οὕτως καὶ ἡ καύχησις ἡμῶν ⸀ἡ ἐπὶ Τίτου ἀλήθεια ἐγενήθη.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/014.yaml
  text: For if I have boasted to him at all about you[a], I was not put to shame; rather, just as we spoke everything to you in truth[b], so also our boasting to Titus proved true.
translation:
  language: ja
  text: というのも、私があなたがたについて彼に何か誇ったとしても、恥をかかされることはなかったからです。むしろ、私たちがあなたがたにすべてを真実に語ったように、テトスに対してあなたがたについて抱いていた私たちの誇り[a]も、真実であることが明らかになったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「テトスの前での私たちの誇り」。ἐπὶ Τίτουは字義的には「テトスの前での」とも訳せる。文脈上は、パウロがあなたがたについてテトスに語ったことを指す。
    reason: ἐπὶ Τίτουの訳し方には幅があり、本文では文脈に即して発話の相手と内容を明示しているため。
lexical_decisions:
- source_word: κεκαύχημαι / ἡ καύχησις ἡμῶν
  choice: 誇った／私たちの誇り
  rationale: 動詞と同根名詞のつながりを日本語でも保ち、文脈上の正当な称賛を、否定的な「自慢」に限定せず表す。
- source_word: οὐ κατῃσχύνθην
  choice: 私は恥をかかされませんでした
  rationale: 受動形を反映し、パウロの誇りが事実に反すると判明して面目を失うことはなかった、という意味を示す。
- source_word: πάντα ἐν ἀληθείᾳ ἐλαλήσαμεν ὑμῖν
  choice: 私たちがあなたがたにすべてを真実に語った
  rationale: πάνταの広い範囲と、ἐν ἀληθείᾳが表す真実な語り方を明確かつ自然に表す。
- source_word: ἡ ἐπὶ Τίτου
  choice: テトスにした
  rationale: 文脈上、コリントの人々についてテトスに語った誇りを指す。ἐπί＋属格の簡潔さを保ちつつ、日本語で発話の相手が分かるようにした。
- source_word: ἀλήθεια ἐγενήθη
  choice: 真実であることが明らかになった
  rationale: 字義的な「真実となった」より自然であり、語った内容が現実によって真実だと確証された意味を表す。
- source_word: ὅτι
  choice: というのも
  rationale: 前節を説明する談話上の働きを、現代日本語で自然に示す。
theological_decisions:
- issue: パウロの「誇り」の性質
  choice: 正当な称賛・確信を含み得る「誇る／誇り」と訳す
  alternative: 否定的な響きの強い「自慢する／自慢」、または意味を和らげた「信頼」
  rationale: καυχάομαι／καύχησις自体の修辞的な強さと同根関係を保ち、その誇りが罪深い高慢か正当な称賛かは文脈に判断させる。
translation_notes:
  register: 明瞭な現代標準日本語。説明的な接続と丁寧体を用いて品位を保ち、動詞「誇る」と名詞「誇り」の語彙的連関を維持した。
