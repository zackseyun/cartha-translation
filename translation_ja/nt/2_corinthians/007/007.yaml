  to: 私は、彼が来たこと[a]によってだけでなく、あなたがたのことで彼が受けた慰め[b]によっても慰められました。彼が私たちに、あなたがたの切なる思い、嘆き[c]、そして私に対する熱意を知らせてくれたので、私はなおさら喜びました。
