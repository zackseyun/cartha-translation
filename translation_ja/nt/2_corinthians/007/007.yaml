id: 2CO.7.7
reference: 2 Corinthians 7:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἐν τῇ παρουσίᾳ αὐτοῦ, ἀλλὰ καὶ ἐν τῇ παρακλήσει ᾗ παρεκλήθη ἐφ’ ὑμῖν, ἀναγγέλλων ἡμῖν τὴν ὑμῶν ἐπιπόθησιν, τὸν ὑμῶν ὀδυρμόν, τὸν ὑμῶν ζῆλον ὑπὲρ ἐμοῦ, ὥστε με μᾶλλον χαρῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/007.yaml
  text: and not only by his coming, but also by the comfort with which he was comforted because of you, as he reported to us your longing, your mourning, and your zeal for me, so that I rejoiced even more.
translation:
  language: ja
  text: 私は、彼が来たこと[a]によってだけでなく、あなたがたのことで彼が受けた慰め[b]によっても慰められました。彼が私たちに、あなたがたの切なる思い、嘆き[c]、そして私に対する熱意を知らせてくれたので、私はなおさら喜びました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼がそばにいてくれたこと」。
    reason: παρουσίαは文脈により「到着」と「同席・臨在」の両面を持ち得るため。
  - marker: b
    text: 「慰め」は「励まし」とも訳せる。後の「慰められた」も同様。
    reason: παράκλησιςとπαρακαλέωは慰めと励ましの意味領域を共有するため。
  - marker: c
    text: 別訳「悲嘆」。
    reason: ὀδυρμόςは悲しみと、その表現としての嘆きを表し得るため。
lexical_decisions:
- source_word: παρουσίᾳ
  choice: 来たこと
  rationale: この個人的な旅行の文脈では、抽象的な「存在」よりもテトスの到着を指す。「来たこと」は出来事として自然に表す。
- source_word: παρακλήσει / παρεκλήθη
  choice: 慰め／慰められた
  rationale: 同根の名詞と動詞のつながりを日本語でも保ち、苦悩の後に得た慰めという文脈に合わせた。
- source_word: ἐφ’ ὑμῖν
  choice: あなたがたのことで
  rationale: 原因・機会・関係対象の幅を残しつつ、テトスがコリントの人々の応答に接して慰められたことを自然に表す。
- source_word: ἀναγγέλλων
  choice: 知らせてくれたので
  rationale: 分詞が、パウロの喜びが増した経緯を示すものとして自然な日本語にした。
- source_word: ἐπιπόθησιν
  choice: 切なる思い
  rationale: 強い慕い求めを表し、対象を本文以上に限定しない表現とした。
- source_word: ὀδυρμόν
  choice: 嘆き
  rationale: 内面的な悲しみだけでなく、それが表に現れた嘆きも含む語感を保つ。
- source_word: ζῆλον
  choice: 熱意
  rationale: 熱心さ、強い関心を表し、日本語で肯定的かつ自然に響く。
- source_word: ὑπὲρ ἐμοῦ
  choice: 私のための
  rationale: パウロに向けられた支持や配慮を含み得る広い表現を保つ。
- source_word: ὥστε με μᾶλλον χαρῆναι
  choice: 私はなおさら喜びました
  rationale: 結果の意味と μᾶλλον の比較的強調を自然に表した。
theological_decisions:
- issue: ἐφ’ ὑμῖν が示す関係
  choice: あなたがたのことで
  alternative: あなたがたによって／あなたがたについて
  rationale: 作用者、話題、原因のいずれか一つに狭く固定せず、原文の関係性の幅を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡としての品位を保った。「私たちは慰められました」は前節から続く統語上の補いであり、本節単独でも意味が通るようにした。脚注記号は該当語の直後に置いた。
