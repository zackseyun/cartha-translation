  text: Καὶ γὰρ ἐλθόντων ἡμῶν εἰς Μακεδονίαν οὐδεμίαν ⸀ἔσχηκεν ἄνεσιν ἡ σὰρξ ἡμῶν, ἀλλ’ ἐν παντὶ θλιβόμενοι— ἔξωθεν μάχαι, ἔσωθεν φόβοι—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/005.yaml
  text: For even when we came into Macedonia[a], our flesh had no rest, but we were afflicted in every way—conflicts on the outside, fears on the inside—
translation:
  language: ja
  text: 実に、私たちがマケドニアに来たとき、私たちの身には少しの休みもなく[a]、あらゆる点で苦難に遭っていました。外には争い、内には恐れがありました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私たちの肉には少しの休みもなく」。ここでの「肉」は、罪深い性質を指すのではなく、苦難を負う身体を伴う人間の弱さを表しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: 実際、…時も
  rationale: 前の文脈を受けて説明を加えつつ強調する接続表現。「実際」と「も」によって、そのつながりと強意を自然な日本語で示した。
- source_word: ἐλθόντων ἡμῶν εἰς Μακεδονίαν
  choice: 私たちがマケドニアに着いた時
  rationale: 属格独立構文を時間節として訳した。εἰςが示す到着を、現代日本語として自然な「着いた」で表した。
- source_word: οὐδεμίαν ἔσχηκεν ἄνεσιν
  choice: 少しも安らぎがなく
  rationale: ἄνεσιςは圧迫からの解放、休息、安らぎを指す。οὐδεμίανの全面否定を「少しも…なく」で明確にした。
- source_word: ἡ σὰρξ ἡμῶν
  choice: 私たちの肉体
  rationale: ここでσάρξは罪深い性質ではなく、苦悩を経験する身体を備えた人間存在を指す。「肉」より自然で、身体性も保つ「肉体」とした。
- source_word: ἀλλ’ ἐν παντὶ θλιβόμενοι
  choice: あらゆる面で苦しめられていました
  rationale: 受動的な圧迫や苦難を表すθλιβόμενοιを「苦しめられていました」とし、ἐν παντίの包括性を「あらゆる面で」で表した。
- source_word: ἔξωθεν μάχαι
  choice: 外には争い
  rationale: μάχαιはここでは必ずしも武力戦闘に限定されず、外部からの対立や争いを広く指すため「争い」とした。
- source_word: ἔσωθεν φόβοι
  choice: 内には恐れ
  rationale: 外的な争いと内的な恐れの簡潔で対照的な並行表現を保った。
theological_decisions:
- issue: σάρξの訳語
  choice: 私たちの肉体
  alternative: 私たち自身
  rationale: この箇所のσάρξは道徳的な「罪深い性質」ではなく、弱さと苦悩を負う身体的な人間存在を表す。原文の身体性を残しながら、日本語で誤解されにくい「肉体」を本文に置き、意味を滑らかに表す別訳を注に示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。原文の「外／内」の対照と簡潔な列挙を保持し、σάρξの身体性は本文と注で示した。
