  text: Make room for us[a]. We have wronged no one, corrupted no one[b], taken advantage of no one.
translation:
  language: ja
  text: 私たちのために余地を作ってください[a]。私たちは、だれにも不正を働かず、だれをも堕落させず[b]、だれをも不当に利用しませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちを受け入れてください」「私たちに心を開いてください」。ギリシア語は直訳すると「私たちのために余地を作ってください」であり、6:11–13の関係的な比喩を受けていると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「だれをも害せず」「だれをも破滅させず」。ここで用いられた語には、損なう、堕落させる、破滅させるという意味があり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χωρήσατε
  choice: 受け入れる余地を作ってください
  rationale: χωρέω の「場所・余地を作る」という比喩を保ちつつ、直前の文脈（6:11–13）にある関係的な受容への訴えが現代日本語で伝わる表現とした。単に「受け入れてください」とするより原文の比喩を残し、「心を開いてください」とするより解釈を本文に持ち込みすぎない。
- source_word: ἡμᾶς
  choice: 私たちを
  rationale: 命令形の直接目的語。パウロとその同労者たちを指す複数形をそのまま訳した。
- source_word: οὐδένα
  choice: だれにも／だれをも／だれからも
  rationale: 三度の反復を保ちながら、それぞれの動詞に必要な自然な日本語の格を用いた。いずれも「だれ一人」に対する行為もなかったという強い否定を表す。
- source_word: ἠδικήσαμεν
  choice: 不正を行わず
  rationale: ἀδικέω の、他者に不正を働く、害を加えるという広い意味を保持する。「傷つける」より法的・倫理的含意を保ち、「不当に扱う」より簡潔である。
- source_word: ἐφθείραμεν
  choice: 堕落させず
  rationale: φθείρω が持つ「滅ぼす、損なう、腐敗・堕落させる」という意味範囲のうち、この対人的・道徳的文脈に適した語を選んだ。ただし「害を与える」「破滅させる」などの可能性も脚注に示した。
- source_word: ἐπλεονεκτήσαμεν
  choice: 不当に利益を得ませんでした
  rationale: πλεονεκτέω の、他者を利用して利得を得るという含意を明示した。「だまし取る」ほど金銭面に限定せず、経済的・関係的な搾取の双方を含み得る表現である。
theological_decisions:
- issue: Χωρήσατε ἡμᾶς におけるパウロの訴えの性質
  choice: パウロと同労者たちを受け入れる余地を作るよう求める関係的な訴え
  alternative: より一般的に「私たちを受け入れてください」または文脈を明示して「私たちに心を開いてください」
  rationale: 6:11–13の「心が広く開かれている」「あなたがたも心を広くしてください」という文脈は関係修復への訴えを示す。本文では「心」を補わず、原語の空間的比喩と解釈上の余地を保った。
translation_notes:
  register: 明瞭で現代的ながら、使徒的な訴えと三重の否定が持つ荘重さを保った。原文の οὐδένα の反復は「だれにも／だれをも／だれからも」と格を変えて再現し、各節の並行性を維持した。
