id: 2CO.7.1
reference: 2 Corinthians 7:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας, ἀγαπητοί, καθαρίσωμεν ἑαυτοὺς ἀπὸ παντὸς μολυσμοῦ σαρκὸς καὶ πνεύματος, ἐπιτελοῦντες ἁγιωσύνην ἐν φόβῳ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/001.yaml
  text: Therefore[a], since we have these promises, beloved, let us cleanse ourselves from every defilement of flesh and spirit[c][b], bringing holiness to completion in the fear of God.
translation:
  language: ja
  text: 愛する皆さん、私たちはこれらの約束をいただいているのですから、肉と霊[a]のあらゆる汚れから自分を清め、神への畏れ[b]をもって聖さを全うしようではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉と霊」は、「体と霊」とも訳せる。人の身体的・外的側面と内的側面の双方を指す表現と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「神への畏れ」は、単なる恐怖ではなく、神の前に立つ者の深い畏敬を含む。
    reason: lexical_clarification
lexical_decisions:
- source_word: ταύτας οὖν ἔχοντες τὰς ἐπαγγελίας
  choice: こういう約束を与えられているのですから
  rationale: ταύτας は直前の複数の約束を指し、οὖν はそこから導かれる勧めを示す。ἔχοντες は直訳すれば「持っている」だが、日本語では約束の受領と保持を自然に表すため「与えられている」とした。
- source_word: ἀγαπητοί
  choice: 愛する者たち
  rationale: 共同体への温かな呼びかけを、現代日本語として自然でありながら荘重さも保つ表現にした。
- source_word: καθαρίσωμεν ἑαυτοὺς
  choice: 自分自身を清め…ようではありませんか
  rationale: 一人称複数の勧奨的接続法を、パウロ自身も読者も含む共同の勧めとして表した。
- source_word: ἀπὸ παντὸς μολυσμοῦ
  choice: あらゆる汚れから
  rationale: μολυσμός の宗教的・倫理的な汚染や穢れの含意を、一般読者にも明瞭な「汚れ」で表した。
- source_word: σαρκὸς καὶ πνεύματος
  choice: 肉と霊の
  rationale: 身体的側面と内面的側面を対にする原文を保ち、σάρξ をここで「罪深い性質」と解釈しすぎないよう「肉」とした。
- source_word: ἐπιτελοῦντες ἁγιωσύνην
  choice: 聖さを完成させ
  rationale: ἐπιτελέω の、終わりまで成し遂げる意味を保持した。「聖さを全うし」も可能だが、「完成させる」の方が語義を明確に伝える。
- source_word: ἐν φόβῳ θεοῦ
  choice: 神への畏れのうちに
  rationale: φόβος の強さを単なる敬意へ弱めず、同時に日本語で単なる恐怖と誤解されにくい「畏れ」を用いた。
theological_decisions:
- issue: 「肉と霊」（σαρκὸς καὶ πνεύματος）が指す範囲
  choice: 「肉と霊」と訳し、人間の外的・身体的側面と内的側面の双方を含む表現として保持した。
  alternative: 「体と霊」または「体と心」
  rationale: ここでは「肉」が「霊」と対になっており、パウロ書簡で別の文脈に見られる「罪に傾く性質」と限定する根拠は弱い。原文の語彙と人間全体を視野に入れる緊張を保った。
- issue: καθαρίσωμεν の勧奨の力
  choice: 「清め…ようではありませんか」
  alternative: 「清めるべきです」
  rationale: 一人称複数接続法は、読者だけへの命令ではなく、著者自身を含む共同の勧めである。
- issue: 「聖さを完成させる」と人間の働き
  choice: 原文どおり共同体への能動的な勧めとして訳した。
  alternative: 神が聖さを完成してくださる、という受動的表現
  rationale: 本文は ἐπιτελοῦντες という能動分詞を用いるため、その倫理的責任を弱めない。一方、聖化全般について本文以上の体系的説明は加えない。
- issue: 神への φόβος の意味
  choice: 「神への畏れ」
  alternative: 「神への恐れ」または「神への敬意」
  rationale: 恐怖だけにも敬意だけにも狭めず、神の前での畏敬を表す語を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、書簡の温かさと倫理的勧告の荘重さを保った。「愛する者たち」で呼びかけを独立させ、日本語として読みやすくした。原文の「肉と霊」「聖さを完成させる」という神学的緊張は解消せず保持した。
