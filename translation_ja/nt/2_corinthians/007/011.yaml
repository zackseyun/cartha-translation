id: 2CO.7.11
reference: 2 Corinthians 7:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ αὐτὸ τοῦτο τὸ κατὰ θεὸν ⸀λυπηθῆναι πόσην κατειργάσατο ὑμῖν σπουδήν, ἀλλὰ ἀπολογίαν, ἀλλὰ ἀγανάκτησιν, ἀλλὰ φόβον, ἀλλὰ ἐπιπόθησιν, ἀλλὰ ζῆλον, ἀλλὰ ἐκδίκησιν· ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς ⸀εἶναι τῷ πράγματι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/011.yaml
  text: 'For see what earnestness this very grief according to God has produced in you: but also a defense[a], but also indignation, but also fear, but also longing, but also zeal, but also vindication[c][b]. In every way you proved yourselves to be pure in the matter.'
translation:
  language: ja
  text: 実に、見てください。この、神にかなった悲しみそのものが、あなたがたにどれほどの熱意を生み出したことでしょう[a]。それだけでなく、弁明[b]を、憤りを、恐れを、慕う心を、熱心を、そして処罰[c]をも生み出しました。あなたがたは、あらゆる点で、この件について潔白であることを示しました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「神に従った悲しみ」。
    reason: lexical_alternative
  - marker: b
    text: 「自分たちの潔白を明らかにすること」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「不正を正すこと」または「正義の実行」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ γὰρ
  choice: 見なさい
  rationale: ἰδούの注意を促す力を自然な現代日本語で表した。γάρの説明的なつながりは、直前の文脈と後続する具体的証拠の提示によって伝わるため、独立した「なぜなら」は置かなかった。
- source_word: τὸ κατὰ θεὸν λυπηθῆναι
  choice: 神のみこころに沿って悲しんだ、そのこと自体
  rationale: 冠詞付き不定詞を「悲しんだこと」として名詞化し、αὐτὸ τοῦτοの強調を「そのこと自体」で保持した。κατὰ θεόνは、単に敬虔な感情というより、神の基準や意志に沿う悲しみを示す。
- source_word: πόσην κατειργάσατο ὑμῖν σπουδήν
  choice: あなたがたのうちにどれほどの熱意を生み出したことでしょう
  rationale: κατεργάζομαιの結果を生じさせる意味を「生み出した」で、πόσηνの感嘆的な強さを「どれほど…ことでしょう」で表した。σπουδήは真剣で迅速な応答を示すため「熱意」とした。
- source_word: ἀλλὰ … ἀλλὰ
  choice: そればかりか、…を、…を
  rationale: 反復されるἀλλάは強い対立ではなく、悔い改めが生んだ結果を次々と強調して加える働きを持つ。日本語では導入句と助詞「を」の反復により、その畳みかける調子を保った。
- source_word: ἀπολογίαν
  choice: 弁明
  rationale: 疑いまたは関与から自分たちを明らかにしようとする応答を表す。簡潔な「弁明」を本文に置き、自らの潔白を示す含みは脚注に残した。
- source_word: ἀγανάκτησιν
  choice: 憤り
  rationale: 問題となった悪に対する強い道徳的不快を表すが、対象は明示されていないため補わなかった。
- source_word: φόβον
  choice: 恐れ
  rationale: 恐れの対象を、神、パウロ、あるいは事態の重大さのいずれかに限定せず、原文の開かれた表現を保持した。
- source_word: ἐπιπόθησιν
  choice: 慕う心
  rationale: 強い切望を表し、文脈上はパウロとの関係回復を望む気持ちが考えられる。ただし対象を本文で明示せず、「慕う心」とした。
- source_word: ζῆλον
  choice: 熱心
  rationale: 強い献身的熱意を表す。先のσπουδήを訳した「熱意」と語を分けつつ、自然な日本語の並列を保った。
- source_word: ἐκδίκησιν
  choice: 悪を正そうとする決意
  rationale: 語は処罰、報復、正義の実施を含み得る。この文脈では個人的復讐より、共同体内の不正に適切に対処する姿勢が中心と判断し、意味を狭く限定しすぎない表現を選んだ。
- source_word: ἐν παντὶ συνεστήσατε ἑαυτοὺς ἁγνοὺς εἶναι τῷ πράγματι
  choice: あなたがたは、あらゆる点で、この件について潔白であることを示しました
  rationale: συνίστημιを証拠によって明らかにする意味の「示しました」とし、ἁγνούςは当該事件に関して罪責や加担から清いことを表す「潔白」とした。
theological_decisions:
- issue: κατὰ θεόνが示す悲しみの性質
  choice: 神のみこころに沿って
  alternative: 神にかなう／神から来る
  rationale: この句は悲しみが神の基準または意志に沿うことを示すが、その起源が直接神にあるとまでは明言しない。「みこころに沿って」は関係性を自然に表しつつ、「神から来る」という因果的解釈を本文に持ち込まない。
- issue: ἐκδίκησιςの悔い改めの文脈での意味
  choice: 悪を正そうとする決意
  alternative: 処罰／正義の実行／報復
  rationale: 原語には処罰的な含みがある一方、誰をどのように処罰するかは本文に明記されない。個人的復讐を示唆せず、悪に対して正しい処置を取る姿勢を表す訳とし、より字義的な選択肢を脚注に示した。
- issue: 「潔白」の範囲
  choice: この件について潔白
  alternative: 全面的に罪がない
  rationale: τῷ πράγματιが潔白の範囲を当該の件に限定しているため、コリントの信徒たちの全面的無罪や無罪性を主張する表現にはしなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語とした。列挙では助詞「を」を反復して原文の修辞的な勢いを再現しつつ、対象が明示されない「恐れ」「慕う心」は説明を加えて限定しなかった。
