id: 2CO.7.3
reference: 2 Corinthians 7:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂πρὸς κατάκρισιν οὐ⸃ λέγω, προείρηκα γὰρ ὅτι ἐν ταῖς καρδίαις ἡμῶν ἐστε εἰς τὸ συναποθανεῖν καὶ συζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/003.yaml
  text: I do not say this to condemn you[a], for I have said before that you are in our hearts[b], to die together and to live together.
translation:
  language: ja
  text: あなたがたを罪に定めるために、こう言うのではありません[a]。あなたがたは、共に死に、共に生きるほど、私たちの心の中にいると、私は前にも言いました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたを断罪するために」または「罪に定めることを意図して」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたは、共に死に、共に生きるために、私たちの心の中にいる」。ギリシア語は、死においても生においても共にあるという連帯を強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς κατάκρισιν
  choice: 罪に定めるために
  rationale: πρός＋対格が示す目的・方向を自然な日本語で表した。「非難する」よりも κατάκρισις の有罪宣告・断罪の含意を保つ。
- source_word: λέγω
  choice: こう言う
  rationale: 現在形を素直に訳し、文脈上の直前の発言を指すことを「こう」で明示した。
- source_word: προείρηκα
  choice: 前にも言ったように
  rationale: 以前の発言が今も効力を持つ完了形の含みを、自然な日本語で表した。
- source_word: ἐν ταῖς καρδίαις ἡμῶν ἐστε
  choice: あなたがたは…私たちの心の中にいる
  rationale: 複数形 ἡμῶν を「私たち」とし、深い愛情と内面的な結びつきを示す比喩を保持した。日本語では「心」を単数形で用いるのが自然である。
- source_word: εἰς τὸ συναποθανεῖν καὶ συζῆν
  choice: 共に死に、共に生きるほど
  rationale: εἰς＋冠詞付き不定詞と前文との結びつきを、強い連帯の程度として自然に表した。同時に、二つの συν- の反復をそれぞれ「共に」で再現し、原文どおり死、生の順序を保った。
theological_decisions:
- issue: 「共に死に、共に生きる」を特定の神学的結合として明示するか
  choice: パウロとコリントの信徒たちの深い連帯を示す表現としてそのまま保つ
  alternative: 契約的忠誠、キリストとの結合、または他の特定の神学的概念への言及と明示する
  rationale: 本文は死と生の双方に及ぶ強い相互的連帯を語るが、その連帯を特定の神学的カテゴリーに限定してはいないため。
- issue: εἰς τὸ συναποθανεῖν καὶ συζῆν の統語的な力
  choice: 本文では「…ほど」として愛情と連帯の強さを表す
  alternative: 目的・結果をより形式的に「共に死に、共に生きるために」と訳す
  rationale: 目的・方向・結果の含みは残るものの、日本語で「心の中にいるために」とすると誤解を招きやすい。脚注で形式的な別訳を示し、原文の曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロの真剣さと温かさを保った。「いるのです」によって継続する内面的な結びつきを自然に表し、過度に口語的または教派的な表現は避けた。
