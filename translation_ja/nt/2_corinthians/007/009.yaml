  naturalness: 「損失を受けないためでした」は、それ自体は理解できるものの、直前の「ので」と連結すると不自然である。文を区切り、「それは…ためでした」とすることで、明瞭な現代標準日本語となる。
  terminology: 「悔い改め」はこの文脈のμετάνοιαに適切であり、注の「心を改めること」も有益である。「神にかなうかたちで」はκατὰ θεόνを過度に限定しない自然な表現である。「損失」はζημιόωの語域を保っている。
