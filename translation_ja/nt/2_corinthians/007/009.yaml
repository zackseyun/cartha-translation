source:
  edition: SBLGNT
  text: νῦν χαίρω, οὐχ ὅτι ἐλυπήθητε, ἀλλ’ ὅτι ἐλυπήθητε εἰς μετάνοιαν, ἐλυπήθητε γὰρ κατὰ θεόν, ἵνα ἐν μηδενὶ ζημιωθῆτε ἐξ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/009.yaml
  text: Now I rejoice[a], not because you were grieved, but because you were grieved into a change of mind; for you were grieved according to God[c][b], so that you might suffer no loss from us.
translation:
  language: ja
  text: 今、私は喜んでいます。それは、あなたがたが悲しんだからではなく、悲しんで悔い改めに至ったからです。[a] あなたがたは神にかなうかたちで悲しんだのです。[b] それは、私たちから何の損失も受けないためでした。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悔い改め」は、「心を改めること」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: または「神のみこころに沿って」あるいは「神を基準として」。
    reason: lexical_alternative
  - marker: c
    text: または「私たちのせいで何の害も受けないためでした」。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν χαίρω
  choice: 今、私は喜んでいます
  rationale: 現在の喜びを、それ以前に手紙がもたらした悲しみと対照させる表現。現在形の継続的な響きも自然な日本語で表した。
- source_word: ἐλυπήθητε
  choice: あなたがたが悲しんだ／悲しんで
  rationale: 同じ動詞の反復を保ちつつ、受動形を不自然な「悲しませられた」とせず、状態への移行を表す自然な日本語にした。行為者は特定していない。
- source_word: εἰς μετάνοιαν
  choice: 悔い改めに至った
  rationale: εἰς の方向・結果の意味を「に至った」で表し、μετάνοια の道徳的・霊的な含意を文脈に即して「悔い改め」とした。
- source_word: κατὰ θεόν
  choice: 神にかなうかたちで
  rationale: 神を基準または神のみこころとの一致点とする悲しみを示す。日本語として理解可能にしながら、その関係の幅を限定しすぎない表現を選んだ。
- source_word: ἵνα ἐν μηδενὶ ζημιωθῆτε
  choice: 何の損失も受けないためでした
  rationale: ἵνα の目的を明示し、ζημιόω の損害・損失という意味を、身体的危害に限定せずに表した。
- source_word: ἐξ ἡμῶν
  choice: 私たちから
  rationale: ἐξ の起点・原因の曖昧さを比較的直訳的に保った。「私たちのせいで」と原因に限定する解釈は注に示した。
theological_decisions:
- issue: μετάνοια の性質
  choice: 悔い改め
  alternative: 心を改めること／考えを変えること
  rationale: 単なる意見変更に狭めず、この文脈にある道徳的・霊的な方向転換を表す。同時に、語の基本的な「心・考えを改める」という含みを注で示した。
- issue: κατὰ θεόν が表す悲しみと神との関係
  choice: 神にかなうかたちで
  alternative: 神のみこころに沿って／神を基準として
  rationale: 神から直接生じた悲しみと断定せず、神の基準または意志に即した悲しみという幅を保った。
- issue: ἐξ ἡμῶν における損失の起点または原因
  choice: 私たちから何の損失も受けない
  alternative: 私たちのせいで何の害も受けない
  rationale: 使徒たちが損失の起点・原因となる可能性を表しつつ、「害」に限定せず、ἐξ の関係も過度に説明しない訳とした。
translation_notes:
  register: 明瞭で現代的ながら、使徒書簡にふさわしい落ち着いた敬体を用いた。同一語の反復と論理の流れを保ち、「悲しみ」そのものではなく、それが悔い改めに至ったことを喜ぶという対照を明確にした。
