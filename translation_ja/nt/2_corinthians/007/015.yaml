id: 2CO.7.15
reference: 2 Corinthians 7:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ σπλάγχνα αὐτοῦ περισσοτέρως εἰς ὑμᾶς ἐστιν ἀναμιμνῃσκομένου τὴν πάντων ὑμῶν ὑπακοήν, ὡς μετὰ φόβου καὶ τρόμου ἐδέξασθε αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/015.yaml
  text: And his affection for you is even greater as he remembers the obedience of all of you[a], how you received him with fear and trembling.
translation:
  language: ja
  text: そして彼が、あなたがた全員の従順、すなわち、恐れとおののきをもって[a]彼を迎え入れたことを思い起こすとき、彼のあなたがたへの愛情はいっそう深まっています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恐れ」は「畏敬」とも訳せる。「恐れとおののき」は、物事を重く受け止め、謙虚かつ真剣に応じる態度を表す、パウロ書簡に見られる言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπλάγχνα
  choice: 愛情
  rationale: 字義的には「内臓」だが、感情の宿るところを指す慣用表現であり、ここではテトスの深く温かな思いを自然な現代日本語で表す。
- source_word: περισσοτέρως
  choice: ますます深めています
  rationale: 比較・増大の意味を、愛情との自然な結び付きの中で表した。現在形 ἐστιν の継続的な状態も反映している。
- source_word: εἰς ὑμᾶς
  choice: あなたがたへの
  rationale: 愛情の向かう対象を明確かつ自然に示す。
- source_word: ἀναμιμνῃσκομένου
  choice: 思い起こし……思うと
  rationale: 属格分詞が示す付帯的・理由的な状況を日本語として明瞭にした。後続の ὡς 節の内容も記憶の対象として自然につないだ。
- source_word: τὴν πάντων ὑμῶν ὑπακοήν
  choice: あなたがた全員の従順
  rationale: ὑπακοή の基本義「従順」を保ち、πάντων ὑμῶν が共同体全体を強調する点も明示した。
- source_word: μετὰ φόβου καὶ τρόμου
  choice: 恐れとおののきをもって
  rationale: パウロ書簡に見られる印象的な表現を解釈で平板化せず保持する。文脈上の含意は脚注で補う。
- source_word: ἐδέξασθε
  choice: 迎え入れた
  rationale: 単に受け取るのではなく、人であるテトスを受け入れたことを指すため、自然な「迎え入れた」とした。歓迎と受容の双方を含み得る。
- source_word: αὐτόν
  choice: 彼を
  rationale: 原文どおり代名詞を保つ。直前の文脈ではテトスを指す。
theological_decisions:
- issue: 「恐れとおののき」がテトスを迎えた態度について何を意味するか
  choice: 本文では「恐れとおののき」を保持し、真剣で謙虚な応答という含意を脚注で示す
  alternative: 「畏敬とおののき」「深い敬意をもって」と本文で意訳する
  rationale: この句はパウロ特有の表現で、単なる恐怖よりも、事柄を重く受け止める謙虚で真剣な態度を示し得る。しかし「恐れ」の語感を本文から消さず、解釈上の緊張を残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい落ち着きと品位を保った。「愛情をますます深めています」は日本語として自然になるよう構文を組み替えたもので、テトスの愛情が一層強いという原文の比較的意味を保持する。
