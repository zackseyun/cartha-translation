- from: そして、彼はあなたがた全員の従順を思い起こし、あなたがたが恐れとおののきをもって彼を迎え入れたことを思うと、あなたがたへの愛情をますます深めています。[a]
  to: そして彼が、あなたがた全員の従順、すなわち、恐れとおののきをもって[a]彼を迎え入れたことを思い起こすとき、彼のあなたがたへの愛情はいっそう深まっています。
  rationale: 愛情を主語とすることで、原文の「彼の愛情がいっそう豊かである」という比較表現をより直接に反映した。「すなわち」は、後続のὡς節が従順の具体的なあり方を示すことを日本語で明確にするためであり、解釈的な内容を追加しない。脚注の位置を説明対象の句へ移した。
