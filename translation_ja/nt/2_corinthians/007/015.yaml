  naturalness: 現行文の「彼は…愛情をますます深めています」は、日本語では彼自身が愛情を意図的に深めるようにも読め、また「思い起こし／思うと」の反復がやや不自然である。愛情を主語にし、記憶内容を一続きにするほうが明瞭で自然である。
  terminology: 「従順」「恐れとおののき」「迎え入れた」はいずれも適切である。「愛情」はσπλάγχναの文脈上の深い情愛を自然に表す。脚注は慣用句の含意を補いつつ、本文の曖昧さを保つ。
