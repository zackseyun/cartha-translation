revisions:
- from: というのも、たとえ手紙によってあなたがたを悲しませたとしても、私は後悔していません。たとえ一時は後悔していたとしても[a]です。あの手紙があなたがたを悲しませたのは、ほんのしばらくの間だった[b]と分かっているからです。
  to: というのも、たとえ手紙によってあなたがたを悲しませたとしても、私は後悔していません。もっとも、後悔していたことはあります。あの手紙があなたがたを悲しませたのは、ほんのしばらくの間だったと分かっているからです。
  rationale: 不自然な譲歩節を「もっとも、後悔していたことはあります」として完結させた。これにより、εἰ καὶ μετεμελόμηνの譲歩的・挿入的な機能を保ちつつ、明快な現代標準語にした。「一時は」を削除し、「ほんのしばらくの間」が手紙による悲しみの継続期間を示すという原文の係り受けを明確にした。脚注aは改訂本文に合わせて表現を更新した。
