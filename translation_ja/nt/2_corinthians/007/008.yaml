reference: 2 Corinthians 7:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι εἰ καὶ ἐλύπησα ὑμᾶς ἐν τῇ ἐπιστολῇ, οὐ μεταμέλομαι· εἰ καὶ μετεμελόμην (⸀βλέπω ὅτι ἡ ἐπιστολὴ ἐκείνη εἰ καὶ πρὸς ὥραν ἐλύπησεν ὑμᾶς),
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/007/008.yaml
  text: For even if I grieved you with the letter[a], I do not regret it—though I did regret it, for I see that that letter grieved you[b], though only for a time.
translation:
  language: ja
  text: というのも、たとえ手紙によってあなたがたを悲しませたとしても、私は後悔していません。もっとも、後悔していたことはあります。あの手紙があなたがたを悲しませたのは、ほんのしばらくの間だったと分かっているからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλύπησα / ἐλύπησεν
  choice: 悲しませた
  rationale: λυπέωの使役的な意味と感情的な痛みを、現代日本語で簡潔かつ自然に表す。
- source_word: ἐν τῇ ἐπιστολῇ
  choice: 手紙によって
  rationale: ここでのἐνは手段を表すと理解し、日本語では「手紙によって」とした。
- source_word: μεταμέλομαι
  choice: 後悔していません
  rationale: この文脈は道徳的な「悔い改め」ではなく、手紙が与えた悲しみをめぐるパウロの心情を指す。現在形も反映した。
- source_word: μετεμελόμην
  choice: 一時は後悔していた
  rationale: 未完了過去が示し得る過去の継続的な心情を表し、現在の「後悔していません」と対照させた。「一時は」は文脈上の過去の状態を自然に示すが、時制の含みは脚注にも示した。
- source_word: βλέπω
  choice: 分かっている
  rationale: 直訳は「見ている」だが、ここでは事実を認識している意味なので、自然な日本語の認知表現とした。
- source_word: ἡ ἐπιστολὴ ἐκείνη
  choice: あの手紙
  rationale: ἐκείνηの指示性と距離感を保った。
- source_word: πρὸς ὥραν
  choice: ほんのしばらくの間
  rationale: 字義的には「一時間に向けて」だが、短い期間を表す慣用句なので、その意味を自然に訳した。
- source_word: ὅτι
  choice: というのも／からです
  rationale: 節冒頭では前文への説明を導き、後半では認識内容または理由をつなぐ機能が日本語で明確になるようにした。
- source_word: εἰ καὶ
  choice: たとえ…としても
  rationale: 反復される譲歩構文を保ち、パウロの修辞的な揺れを平板化しないようにした。
theological_decisions:
- issue: μεταμέλομαιが表すパウロの心情
  choice: 「後悔する」と訳す
  alternative: 「悔い改める」または「申し訳なく思う」
  rationale: ここでは神に対する道徳的回心ではなく、以前の手紙が読者を悲しませたことへの心情が問題である。「後悔する」はμετανοέωとの不要な神学的同一視を避ける。
- issue: εἰ καὶ μετεμελόμηνの譲歩性
  choice: 「たとえ一時は後悔していたとしても」とする
  alternative: 「実際、後悔していましたが」
  rationale: 実際の過去の後悔を強く断定する読みも可能だが、原文のεἰ καὶが持つ譲歩的な形を残し、修辞上の曖昧さを保った。
translation_notes:
  register: 明快な現代標準語を用いながら、手紙文学にふさわしい落ち着いた格調を保った。原文で反復される「悲しませた」「後悔」の語を維持し、譲歩構文の緊張も残した。
