source:
  edition: SBLGNT
  text: οὐ γάρ ἐσμεν ὡς οἱ ⸀πολλοὶ καπηλεύοντες τὸν λόγον τοῦ θεοῦ, ἀλλ’ ὡς ἐξ εἰλικρινείας, ἀλλ’ ὡς ἐκ θεοῦ ⸀κατέναντι θεοῦ ἐν Χριστῷ λαλοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/017.yaml
  text: For we are not like the many[a], peddling the word of God, but as from sincerity, but as from God[f][e][d][c][b], before God we speak in Messiah.
translation:
  language: ja
  text: 私たちは、多くの人々[a]のように神のことばを売り物にしている[b]のではありません。むしろ、誠実さから[c]出る者として、また神から出る者として、神の御前で[d]、メシアにあって[e]語っているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「多くの者たち」とも訳せる。文脈上、必ずしも「大多数」を意味するとは限らない。
    reason: lexical_alternative
  - marker: b
    text: この動詞には、利益のために売り歩くことのほか、商品に手を加える商人のように、ことばを不純にするという含みもあり得る。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「誠実さから」。原文は続く「神から」と、起点・由来を表す形で並行している。
    reason: source_structure
  - marker: d
    text: 「神の目の前で」または「神の臨在の中で」とも訳せる。
    reason: lexical_alternative
  - marker: e
    text: 「メシア」はギリシア語の「油注がれた者」という称号を訳した語である。伝統的には「キリストにあって」と訳される。
    reason: title_explanation
lexical_decisions:
- source_word: οἱ πολλοί
  choice: 多くの人々
  rationale: 定冠詞を伴う表現が指す対照集団を自然な日本語で示す。「大多数」として統計的意味に限定しない。
- source_word: καπηλεύοντες
  choice: 売り物にしている
  rationale: 商人のように扱って利を得るという比喩と、自己本位な取り扱いへの非難を、明瞭な現代日本語で表す。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: 属格構文を簡潔に保ち、パウロ書簡で認識しやすい荘重な表現とする。
- source_word: ἐξ εἰλικρινείας
  choice: 誠実な心から
  rationale: 起点を表すἐξの意味を「から」で残しつつ、「誠実さから」より自然な日本語にする。
- source_word: ἐκ θεοῦ
  choice: 神から出た者として
  rationale: 神が発信源・由来であることと、ὡςの「者として」という比較的な構えを表す。「遣わされた」とまでは補わない。
- source_word: κατέναντι θεοῦ
  choice: 神の御前で
  rationale: 神の臨在と神に対する責任の双方を含み得る、簡潔で自然な表現。
- source_word: ἐν Χριστῷ
  choice: キリストにあって
  rationale: パウロ特有の結合・領域を表す句として定着した日本語を用いる。日本語では「キリスト」が称号由来の標準的な聖書用語であり、ここでは人名に近い定型句として機能する。
- source_word: λαλοῦμεν
  choice: 語っているのです
  rationale: 現在形の継続的な働きを示し、文脈上の説明・対比を自然な終止表現で伝える。
theological_decisions:
- issue: ἐν ΧριστῷにおけるΧριστόςの訳し方
  choice: キリストにあって
  alternative: メシアにあって
  rationale: 原語は「油注がれた者」という称号に由来するが、ἐν Χριστῷはパウロ書簡で定型化した関係・領域表現である。現代日本語の通常の聖書語法では「キリストにあって」が意味を最も明瞭に伝え、称号としての背景は脚注で保持する。
- issue: ἐξ εἰλικρινείαςとἐκ θεοῦの並行関係
  choice: 誠実な心から、神から出た者として
  alternative: 誠実さから出た者として、神から出た者として
  rationale: 原文の二つの起点表現を「から」で残しつつ、日本語として不自然な「誠実さから出た者」を避ける。二度のἀλλάによる強い対照は「むしろ」と並列で表し、第二句を第一句の否定とは断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「神のことば」「神の御前」「キリストにあって」によって聖書本文にふさわしい品位を保った。「売り物にしている」は古風な商業語を避けつつ原文の辛辣な比喩を伝える。
