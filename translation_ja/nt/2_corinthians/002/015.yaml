id: 2CO.2.15
reference: 2 Corinthians 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι Χριστοῦ εὐωδία ἐσμὲν τῷ θεῷ ἐν τοῖς σῳζομένοις καὶ ἐν τοῖς ἀπολλυμένοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/015.yaml
  text: For we are the aroma of Messiah to God among those who are being saved and among those who are perishing[b][a],
translation:
  language: ja
  text: というのも、私たちは、救われつつある人々の間でも、滅びつつある人々の間でも、神にとってキリストの香りだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: というのも～だからです
  rationale: 直前の文を説明する接続詞の働きを、自然な現代日本語で因果・説明関係が分かる形にした。
- source_word: Χριστοῦ
  choice: キリストの
  rationale: この書簡の文脈では称号として定着した「キリスト」が自然であり、属格が表す所属・由来を「の」で保持した。
- source_word: εὐωδία
  choice: 香り
  rationale: 祭儀的背景を帯びうる比喩を保ちつつ、「良い香り」など原文に明示されない評価語を加えないため。
- source_word: τῷ θεῷ
  choice: 神にとって
  rationale: 与格が示す神との関係、すなわち神の側から見た香りという意味を、誤解の少ない日本語で表した。
- source_word: ἐν τοῖς σῳζομένοις
  choice: 救われつつある人々の間で
  rationale: 現在分詞の進行的・過程的な含みを「つつある」で保ち、ἐνを集団内の意味として「間で」とした。
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: 滅びつつある人々の間で
  rationale: 現在分詞の継続的な含みを保ち、対応する二群の並行性を明確にした。
theological_decisions:
- issue: σῳζομένοις と ἀπολλυμένοις の過程性
  choice: 「救われつつある人々」「滅びつつある人々」と訳す。
  alternative: 「救われる人々」「滅びる人々」または「救われた人々」「失われた人々」
  rationale: 二つの現在分詞が示す進行中の過程を保持し、救いと滅びを完了済みの固定的分類へ平板化しないため。
- issue: Χριστοῦ εὐωδία の属格関係
  choice: 「キリストの香り」とし、所属・由来・性質のいずれか一つに限定しない。
  alternative: 「キリストから出る香り」または「キリストを表す香り」
  rationale: ギリシア語の属格が持つ幅を保ち、比喩の意味を一義的に解釈しすぎないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。二度のἐνを「～の間でも、～の間でも」と反復して、原文の並行構造を示した。
