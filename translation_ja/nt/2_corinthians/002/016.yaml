id: 2CO.2.16
reference: 2 Corinthians 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἷς μὲν ὀσμὴ ⸀ἐκ θανάτου εἰς θάνατον, οἷς δὲ ὀσμὴ ⸁ἐκ ζωῆς εἰς ζωήν. καὶ πρὸς ταῦτα τίς ἱκανός;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/016.yaml
  text: To the one[a], a fragrance from death to death; to the other, a fragrance from life to life[c][b]. And who is sufficient for these things?
translation:
  language: ja
  text: ある人たちにとっては、死から死への香り[a]、ほかの人たちにとっては、命から命への香りです[b]。そして、このようなことを担える者は、いったい誰でしょうか[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「香り」は「におい」とも訳せる。ギリシア語の ὀσμή は、必ずしも快い香りだけを意味しない。
    reason: lexical_alternative
  - marker: b
    text: 「死から死へ」と「命から命へ」は、死または命を源として同じ結果に至ることを表すとも、死または命という性質を強調する表現とも理解できる。
    reason: alternative_reading
  - marker: c
    text: 「担える」は、「十分である」「適任である」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀσμή
  choice: 香り
  rationale: 感覚に訴える比喩を保ち、直前の文脈とも自然につながる語を選んだ。ただし、ギリシア語自体は快い香りだけに限定されないため、別訳を脚注に示した。
- source_word: ἐκ θανάτου εἰς θάνατον
  choice: 死から死への
  rationale: 起源と結果を表すのか、死という性質を強調するのかを本文で決めず、ギリシア語の簡潔な反復と曖昧さを保った。
- source_word: ἐκ ζωῆς εἰς ζωήν
  choice: 命から命への
  rationale: 対をなす前半と同じ形にして、原文の対称性と解釈上の幅を保った。
- source_word: πρὸς ταῦτα
  choice: このようなことを
  rationale: 直前までに述べられた事柄を受ける複数形の指示を、現代日本語として自然に表した。
- source_word: ἱκανός
  choice: 担える
  rationale: ここでは、重大な務めに対して十分な力量がある、適任であるという意味を、自然な修辞疑問として表した。
theological_decisions:
- issue: 「死から死へ」と「命から命へ」の解釈上の働き
  choice: 原文の「死から死へ／命から命へ」という圧縮された並行表現を本文に残す。
  alternative: 「死から出て死に至らせる／命から出て命に至らせる」、または「死をもたらす／命をもたらす」と明示する。
  rationale: この表現は、起源から結果への動きとも、性質や効果の強調とも理解できる。本文だけでは一つに限定できないため、神学的・解釈的な緊張を保持した。
- issue: ἱκανόςが問う適格性・力量
  choice: 「このようなことを担える者」とし、務めを果たす力量についての問いとして表す。
  alternative: 「これらのことに十分な者」「これらのことにふさわしい者」。
  rationale: 「十分な者」は日本語として不自然になりやすく、「ふさわしい者」は資格や道徳的適格性に意味を狭めうる。「担える」は文脈上の責任の重さと能力の不足を問う修辞性を自然に伝える。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、対句の荘重さを保った。「ある人たちにとっては／ほかの人たちにとっては」で οἷς μὲν／οἷς δὲ の対照を明示し、最後は自然な修辞疑問とした。
