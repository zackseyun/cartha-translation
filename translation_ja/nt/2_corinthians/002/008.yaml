lexical_decisions:
- source_word: διό
  choice: ですから
  rationale: 直前の勧告を根拠とする結論的な接続を、自然な現代日本語で示す。
- source_word: παρακαλῶ ὑμᾶς
  choice: 私はあなたがたにお願いします
  rationale: ここでは勧告・要請の意味が中心であり、丁寧だが切実な依頼として訳す。
- source_word: κυρῶσαι
  choice: はっきり示してください
  rationale: κυρόωは有効と認める、確証するという意味を持つ。愛を共同体の具体的な行為によって確証する文脈を、日本語として明瞭に表す。
- source_word: εἰς αὐτὸν ἀγάπην
  choice: その人に対する愛を
  rationale: εἰς αὐτόνが示す愛の対象を自然に表し、ἀγάπηを一般的かつ神学的に過度な限定のない「愛」とする。
theological_decisions:
- issue: 愛を「確証する」行為の性質
  choice: その人に対する愛を、はっきり示してください
  alternative: その人への愛を正式に認めてください
  rationale: κυρῶσαιには公的・共同体的な確証の含みがあり得るが、特定の教会制度や正式決議まで本文に読み込まず、具体的に愛を確かなものとして示すという幅を保つ。
