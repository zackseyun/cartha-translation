id: 2CO.2.7
reference: 2 Corinthians 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε τοὐναντίον ⸀μᾶλλον ὑμᾶς χαρίσασθαι καὶ παρακαλέσαι, μή πως τῇ περισσοτέρᾳ λύπῃ καταποθῇ ὁ τοιοῦτος.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/007.yaml
  text: so that[a], on the contrary, you should rather forgive and comfort him[b], so that such a person may not be overwhelmed by excessive sorrow.
translation:
  language: ja
  text: それどころか、あなたがたはむしろ、その人を赦し[a]、慰めるべきです。そうしないと、そのような人があまりにも大きな悲しみにのみ込まれてしまう[b]おそれがあります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恵みを示す」「好意をもって赦す」とも訳せる語です。
    reason: lexical_alternative
  - marker: b
    text: 原文は「のみ込まれる」という比喩です。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοὐναντίον
  choice: むしろ
  rationale: 直前までの厳しい処置とは反対に、今は回復へ向かうべきだという転換を、自然な現代日本語で示す。
- source_word: μᾶλλον
  choice: むしろ
  rationale: τοὐναντίονと重なって対照を強める働きを、日本語では一語の「むしろ」にまとめ、冗長さを避けた。
- source_word: χαρίσασθαι
  choice: 赦し
  rationale: この懲戒と回復の文脈では「赦す」が最も自然である。恵みや好意を示す語感は脚注に残した。
- source_word: παρακαλέσαι
  choice: 慰める
  rationale: 悲しみにある人を支える文脈に適し、「励ます」よりも情緒的な慰めを明確に表す。
- source_word: καταποθῇ
  choice: のみ込まれてしまう
  rationale: 原文の「のみ込む」という比喩を保持しつつ、深い悲しみに圧倒される意味が自然に伝わる表現とした。
- source_word: ὁ τοιοῦτος
  choice: そのような人
  rationale: 人物を必要以上に特定せず、原文の指示的な言い方を自然に保つ。
- source_word: τῇ περισσοτέρᾳ λύπῃ
  choice: あまりに深い悲しみ
  rationale: 通常の程度を越える悲しみという意味を明快に伝え、比較級を文脈に即した程度表現で訳した。
- source_word: μή πως
  choice: そうしないと……かもしれません
  rationale: 望ましくない結果への懸念を表す原文の含みを、断定しすぎない自然な日本語で示す。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。命令的な硬さを避けつつ、共同体が赦しと慰めによって当人を回復させるべきだという勧告を明確にした。原文の比喩と、μή πωςの懸念・可能性を保持した。
