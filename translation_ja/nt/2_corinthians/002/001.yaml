  text: ἔκρινα ⸀γὰρ ἐμαυτῷ τοῦτο, τὸ μὴ πάλιν ἐν λύπῃ πρὸς ὑμᾶς ἐλθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/001.yaml
  text: 'For I decided this for myself: not to come to you again in sorrow[a].'
translation:
  language: ja
  text: というのは、私はこう心に決めました。『再び悲しみのうちに[a]あなたがたのもとへ行かない』と。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悲しみをもって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκρινα
  choice: 決めました
  rationale: 文脈では、パウロが熟慮の末に下した確定的な個人的決断を表すため、現代日本語として自然な「決めました」とした。
- source_word: γὰρ
  choice: （独立した接続語としては訳出しない）
  rationale: 前文を説明する機能は文脈と文の流れによって伝わる。日本語で「というのは」を置くと、この一節だけでは不自然に響きやすいため、明示しなかった。
- source_word: ἐμαυτῷ
  choice: 自分の中で
  rationale: 自らの内に定めた個人的な決断であることを示し、「自分のために」という目的の意味に誤解されるのを避ける。
- source_word: τοῦτο
  choice: こう
  rationale: 後続する不定詞句の内容を前方指示する働きを、自然な日本語の「こう」で示した。
- source_word: τὸ μὴ ... ἐλθεῖν
  choice: 行くことはしない
  rationale: 決断の内容を表す冠詞付き不定詞を、否定の意志が明瞭に伝わる自然な日本語で表した。
- source_word: πάλιν
  choice: 再び
  rationale: 訪問の反復を明確に示し、格調を保つ標準的な語を選んだ。
- source_word: ἐν λύπῃ
  choice: 悲しみのうちに
  rationale: ἐνの構造とλύπηの幅を保ち、悲しみを抱いた状態、または悲しみを伴う状況のいずれにも開かれた表現とした。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのところへ
  rationale: 人々のもとへの移動を表すπρόςを、明瞭で自然な日本語にした。
theological_decisions:
- issue: ἐν λύπῃが誰の悲しみ、またはどのような悲しい状況を指すか
  choice: 悲しみのうちに
  alternative: 悲しみをもって
  rationale: パウロ自身の悲しみに限定するか、訪問が双方にもたらす悲しみまで含むかは文法上確定しないため、曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡としての落ち着きと品位を保った。「私は、自分の中で」は原文の個人的な熟慮を可視化し、コロン相当の区切りを句点と後続の引用的構文で自然に表した。
