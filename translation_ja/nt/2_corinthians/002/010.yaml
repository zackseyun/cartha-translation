id: 2CO.2.10
reference: 2 Corinthians 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ᾧ δέ τι χαρίζεσθε, κἀγώ· καὶ γὰρ ἐγὼ ⸂ὃ κεχάρισμαι, εἴ τι⸃ κεχάρισμαι, δι’ ὑμᾶς ἐν προσώπῳ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/010.yaml
  text: To anyone whom you forgive anything[a], I do too. For what I have forgiven—if I have forgiven anything—I have forgiven for your sake in the presence of Messiah,
translation:
  language: ja
  text: あなたがたがだれかを、何かについて赦すなら、私もそうします。実際、私が赦したことは――もし何かを赦したのであれば――、あなたがたのために、メシアの御前で赦したのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアに代わって」とも訳せる。
    reason: ἐν προσώπῳ Χριστοῦ は「メシアの御前で」と理解できる一方、「メシアに代わって」という代理的な意味に取ることもできるため。
lexical_decisions:
- source_word: ᾧ δέ τι χαρίζεσθε
  choice: あなたがたが何かを赦す相手を
  rationale: χαρίζομαι は広く「恵みとして与える」の意を持つが、処罰と回復を扱う文脈では、罪過を免じる「赦す」が最も自然である。ᾧ と τι の開かれた範囲も保った。
- source_word: κἀγώ
  choice: 私も赦します
  rationale: 省略された動詞を日本語では補い、「私も」という応答的な力を明確にした。
- source_word: ὃ κεχάρισμαι, εἴ τι κεχάρισμαι
  choice: 私が何かを赦したとすれば、私が赦したのは
  rationale: εἴ τι の控えめな条件表現を平板化せず、「何かを赦したとすれば」として保持した。完了形は、すでになされた赦しを示す文脈に沿って表した。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのため
  rationale: διά＋対格が示す受益・配慮の方向を、自然な日本語で表した。
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: メシアの御前で
  rationale: πρόσωπον の「顔・臨在・人格」という意味範囲のうち、ここではメシアの面前で行うという厳粛な意味を本文に採用した。別解の「メシアに代わって」は注記した。
- source_word: Χριστοῦ
  choice: メシア
  rationale: Χριστός の称号としての意味を明示し、日本語でも理解しやすい「メシア」とした。
theological_decisions:
- issue: ἐν προσώπῳ Χριστοῦ が、メシアの臨在を指すか、メシアを代理する立場を指すか
  choice: メシアの御前で
  alternative: メシアに代わって
  rationale: πρόσωπον は両方向の解釈を許す。本文では「その面前・臨在において」を採りつつ、代理権を示す可能性を脚注に残し、曖昧さを消さなかった。
- issue: Χριστός を伝統的な「キリスト」とするか、称号を訳して「メシア」とするか
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名詞化を必須とする事情がなく、油注がれた者という称号の働きを保つため「メシア」とした。
translation_notes:
  register: 現代の標準的な日本語を用いながら、パウロの控えめな条件表現と赦しの厳粛さを保った。「御前」は一般読者にも理解できる範囲の、やや荘重な聖書的表現として採用した。
