  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἔγραψα τοῦτο αὐτὸ ἵνα μὴ ἐλθὼν λύπην ⸀σχῶ ἀφ’ ὧν ἔδει με χαίρειν, πεποιθὼς ἐπὶ πάντας ὑμᾶς ὅτι ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/003.yaml
  text: And I wrote this very thing so that, when I came, I might not have grief from those who ought to make me rejoice, because I was confident about all of you that my joy is the joy of you all.
translation:
  language: ja
  text: 私はまさにこのことを書きました。それは、そちらに行ったとき、本来なら私が喜ぶはずの人たちから悲しみを受けることがないためです。皆さん全員について、私の喜びは皆さん全員の喜びでもあると確信していたからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「確信していたから」は、付帯状況を表して「確信を抱きつつ」とも訳せる。
    reason: 完了分詞πεποιθώςは本文の因果的な理解を許すが、分詞そのものは因果関係を明示していないため。
lexical_decisions:
- source_word: ἔγραψα
  choice: 書いた
  rationale: アオリスト直説法を単純過去として訳し、パウロが以前に書いたことを指す文脈を自然に表した。
- source_word: τοῦτο αὐτό
  choice: このこと
  rationale: 日本語では「まさにこのこと」も可能だが、文脈上の指示を明瞭にしつつ過度に硬くならない表現を選んだ。強意は文全体の焦点によって保たれる。
- source_word: ἵνα μὴ ... λύπην σχῶ
  choice: 悲しみを受けることがないため
  rationale: 目的を表すἵναと、λύπην ἔχειν型の「悲しみを経験する」という意味を、自然な現代日本語で表した。
- source_word: ἀφ’ ὧν ἔδει με χαίρειν
  choice: 本来なら私を喜ばせてくれるはずの人たちから
  rationale: 直訳的には「私が喜ぶべき人たちから」だが、ἀπόが示す喜びの源という関係を日本語で明瞭にした。直訳寄りの形は脚注に残した。
- source_word: πεποιθὼς ἐπὶ πάντας ὑμᾶς
  choice: 皆さん全員について確信していたから
  rationale: 完了分詞が示す持続した確信を表した。分詞と主節との関係は文脈上理由として自然だが、ギリシア語自体が接続詞で因果を明示しているわけではないため、その点を脚注で示した。
- source_word: ἡ ἐμὴ χαρὰ πάντων ὑμῶν ἐστιν
  choice: 私の喜びは皆さん全員の喜びでもある
  rationale: 属格πάντων ὑμῶνを、共同体がパウロの喜びを共有する意味として自然に訳した。「でも」により相互に共有される喜びを明瞭にした。
theological_decisions:
- issue: πεποιθώςの主節に対する論理関係
  choice: 「確信していたから」と理由を表す形で本文に訳す
  alternative: 「確信しつつ」「確信しており」と付帯状況として訳す
  rationale: この確信が、厳しい訪問を避けて手紙を書いた判断を支える理由と読むのが文脈上自然である。ただし分詞そのものは因果関係を明示しないため、別解を脚注に保持した。
- issue: 「私の喜び」と「皆さん全員」の関係
  choice: 「私の喜びは皆さん全員の喜びでもある」
  alternative: 「私の喜びは皆さん全員に属する」
  rationale: 属格の関係には幅があるが、文脈ではパウロとコリントの信徒たちが喜びを共有することを指すと判断した。相互性を教理的に拡張せず、本文の範囲にとどめた。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「あなたがた」より日常的で敬意のある「皆さん」を用い、「全員」を重ねてπάντας／πάντωνの包括性を保持した。長いギリシア語文は日本語の可読性のため二文に分けた。
