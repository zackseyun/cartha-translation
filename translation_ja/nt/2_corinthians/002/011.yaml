id: 2CO.2.11
reference: 2 Corinthians 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα μὴ πλεονεκτηθῶμεν ὑπὸ τοῦ Σατανᾶ, οὐ γὰρ αὐτοῦ τὰ νοήματα ἀγνοοῦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/011.yaml
  text: so that we would not be outwitted by Satan[b][a], for we are not ignorant of his schemes.
translation:
  language: ja
  text: それは、私たちがサタンにつけ込まれないためです[a]。私たちは、彼の企てを知らないわけではないからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「サタンに出し抜かれないため」、または「サタンに利用されないため」。
    reason: lexical_alternative
  - marker: b
    text: 「企て」は「考え」「意図」「策略」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα μὴ
  choice: それは、～ないためです
  rationale: 前の文脈を受ける目的を自然な現代日本語で示し、否定の力も保つ。
- source_word: πλεονεκτηθῶμεν
  choice: つけ込まれない
  rationale: 受動形が表す、相手に優位を取られ、利用・搾取される意味を広く保つ。知的な欺きだけに限定しない。
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: サタンに
  rationale: 行為者を示す受動構文を自然な日本語にし、固有名は慣用的に音写する。
- source_word: γὰρ
  choice: ～からです
  rationale: 先行する目的節の理由・根拠を示す説明的な接続を明確にする。
- source_word: νοήματα
  choice: 企て
  rationale: 思考・意図・計画を含み得る語だが、ここではサタンの敵対的な意図を指すため、「企て」が文脈に適する。
- source_word: οὐ ... ἀγνοοῦμεν
  choice: 知らないわけではない
  rationale: 原文の否定表現を保ち、単に「知っている」と強めて言い換えず、修辞的な含みを残す。
theological_decisions:
- issue: サタンのνοήματαをどこまで悪意ある策略として限定するか
  choice: 本文は「企て」とし、敵対的含意を示しつつ意味範囲を過度に狭めない
  alternative: 「策略」または中立的な「考え」
  rationale: 文脈上は共同体を害する意図が明らかだが、νοήματα自体には思考・意図・計画という幅があるため、その緊張を脚注で保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「つけ込まれる」は口語に偏りすぎず、搾取・優位獲得・欺きの重なりを伝える。「知らないわけではない」により原文の控えめな否定表現を保持した。
