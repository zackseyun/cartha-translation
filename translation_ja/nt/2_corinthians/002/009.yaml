  text: εἰς τοῦτο γὰρ καὶ ἔγραψα ἵνα γνῶ τὴν δοκιμὴν ὑμῶν, εἰ εἰς πάντα ὑπήκοοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/009.yaml
  text: 'For this is why I also wrote: so that I might know the proof of you[a], whether you are obedient in everything.'
translation:
  language: ja
  text: 私がこのことのために書いたのも、あなたがたがすべてのことに従順であるかどうかを見て、あなたがたの真価を知るためでした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたが試された結果を知るため」、または「あなたがたの証明を知るため」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο γὰρ καὶ ἔγραψα
  choice: 私がこのことについて書いたのも
  rationale: εἰς τοῦτο は直前の文脈を受ける「このことについて」とし、γάρの説明的な働きとκαίの付加的な意味は、日本語の「のも」によって自然に表した。ἔγραψαは単純過去として「書いた」とした。
- source_word: ἵνα γνῶ
  choice: 知るためでした
  rationale: 目的を表すἵνα節と、確認して知るに至るγνῶの意味を、明瞭な現代日本語で保持した。
- source_word: τὴν δοκιμὴν ὑμῶν
  choice: あなたがたの確かさ
  rationale: δοκιμήは試験そのもの、試験による証明、立証された確かさのいずれも表し得る。本文では日本語として過度に不自然な「あなたがたの証明」を避けつつ、結果として示される確かさを表した。別の可能性は脚注に残した。
- source_word: εἰ εἰς πάντα ὑπήκοοί ἐστε
  choice: あなたがたがすべてのことに従順であるかどうか
  rationale: γνῶに従うεἰを間接疑問の「かどうか」とし、εἰς πάνταの包括性とὑπήκοοιの服従・従順の意味を保った。
theological_decisions:
- issue: δοκιμήが指すもの
  choice: 従順によって明らかになる「確かさ」として訳す
  alternative: 「試された結果」「証明」「立証された品性」
  rationale: この語が試験の過程と、その結果として実証された性質の両方を含み得るという緊張を保ち、特定の教理的な意味に限定しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。パウロが以前に書いた目的を説明する文として自然な語順にしつつ、原文の目的節と間接疑問を明示した。
