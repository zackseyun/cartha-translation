  text: εἰ γὰρ ἐγὼ λυπῶ ὑμᾶς, καὶ ⸀τίς ὁ εὐφραίνων με εἰ μὴ ὁ λυπούμενος ἐξ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/002.yaml
  text: For if I grieve you[a], who is there to make me glad except the one who is grieved by me?
translation:
  language: ja
  text: というのも、もし私があなたがたを悲しませるなら、私を喜ばせてくれるのは、私のせいで悲しんでいる人[a]以外に、いったいだれでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私から悲しんでいる人」。ἐξ ἐμοῦ は、悲しみの源または原因が私にあることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λυπῶ
  choice: 悲しませる
  rationale: 他者に悲しみや苦痛を与えるという使役的な意味を、現代日本語で自然かつ直接的に表す。
- source_word: εὐφραίνων
  choice: 喜ばせてくれる人
  rationale: パウロに喜びをもたらす人物を表す現在分詞であり、「悲しませる」との対照を保ちつつ、関係性を自然な日本語で示す。
- source_word: τίς ὁ εὐφραίνων με
  choice: 私を喜ばせてくれる人が、いったい誰がいるでしょうか
  rationale: 冠詞付き分詞の人物指示と、答えを強く限定する修辞疑問の力を日本語で再現する。
- source_word: ὁ λυπούμενος
  choice: 悲しんでいるその人
  rationale: 受動的な意味を持つ現在分詞の継続的状態を保ち、完了的な「私が悲しませた人」へ狭めない。
- source_word: ἐξ ἐμοῦ
  choice: 私によって
  rationale: パウロがその悲しみの源または原因であることを簡潔に示す。「私のために」とはせず、因果関係を保つ。
- source_word: γὰρ
  choice: もし…なら
  rationale: γὰρ自体の説明的機能は文脈上の接続に属するが、単独節の日本語では冒頭の「というのは」を省き、εἰの条件構文を自然に前面化した。
theological_decisions:
- issue: ὁ λυπούμενος ἐξ ἐμοῦ の受動性と時制的側面
  choice: 私によって悲しんでいるその人
  alternative: 私が悲しませたその人
  rationale: 原文の現在受動分詞が表す、パウロを原因として悲しみの状態にある人物という表現を保持し、過去の完了した行為に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。修辞疑問の強さを「いったい」で示し、悲しみと喜びの対照を保った。
