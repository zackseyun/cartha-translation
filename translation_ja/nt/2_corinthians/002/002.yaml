revisions:
- from: もし私があなたがたを悲しませるなら、私を喜ばせてくれる人が、私によって悲しんでいるその人以外に、いったい誰がいるでしょうか。[a]
  to: というのも、もし私があなたがたを悲しませるなら、私を喜ばせてくれるのは、私のせいで悲しんでいる人[a]以外に、いったいだれでしょうか。
  rationale: γὰρ を「というのも」で訳出し、修辞疑問の構文を自然に整えた。ὁ λυπούμενος ἐξ ἐμοῦ は現在受動分詞と源・原因を示す前置詞句であるため、「私のせいで悲しんでいる人」とし、過去に完了した行為に限定しなかった。脚注から原文の意味範囲を外れる「私のために」を除いた。
