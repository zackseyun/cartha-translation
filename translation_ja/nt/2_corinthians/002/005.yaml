source:
  edition: SBLGNT
  text: Εἰ δέ τις λελύπηκεν, οὐκ ἐμὲ λελύπηκεν, ἀλλὰ ἀπὸ μέρους ἵνα μὴ ἐπιβαρῶ πάντας ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/005.yaml
  text: But if anyone has caused grief[a], he has grieved not me, but in part all of you—to some extent[b], so that I may not overstate it.
translation:
  language: ja
  text: もし、だれかが悲しみをもたらしたのであれば、その人が悲しませたのは私ではなく、――皆さん全員に重荷を負わせないために控えめに言えば――ある程度、皆さん全員なのです[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「皆さんの一部を悲しませた」。原文の「ある程度」は、「皆さん全員」を程度の面で限定するとも、範囲の面で限定するとも理解され得る。
    reason: ἀπὸ μέρουςが程度を表すか、影響を受けた人々の範囲を表すかについての解釈上の幅を保持するため。
  - marker: b
    text: 直訳「皆さん全員に重荷を負わせないために」。ここでは、皆を過度に責めることにならないよう、発言を控えめにしていることを示す。
    reason: ἐπιβαρῶの「重荷を負わせる」という比喩を明示しつつ、この目的節が控えめな言い回しを説明する文脈上の機能を示すため。
lexical_decisions:
- source_word: λελύπηκεν
  choice: 悲しみをもたらした／悲しませた
  rationale: 同じ動詞の語彙的なつながりを保ちつつ、完了形が示す、過去の行為と現在に及ぶ結果を文脈から自然に読み取れる現代日本語とした。
- source_word: οὐκ ἐμὲ
  choice: 私ではなく
  rationale: 原文の直接的な対比を保ち、「私個人」のような明示されていない強調は加えなかった。
- source_word: ἀπὸ μέρους
  choice: いわば
  rationale: この句は「部分的に／ある程度」とも理解できるが、直後の限定を修辞的に和らげる働きを自然な日本語で示した。曖昧さは脚注に残した。
- source_word: ἐπιβαρῶ
  choice: 重荷を負わせすぎない
  rationale: 「重荷を加える」という動詞の比喩を保ち、ここでは発言を重く言いすぎること、または共同体に負担をかけることの両義性を許す表現とした。
- source_word: πάντας ὑμᾶς
  choice: あなたがた皆
  rationale: πάντας の包括性と複数の共同体への呼びかけを明示した。
theological_decisions:
- issue: 悲しみが及んだ範囲と、パウロが発言を和らげる意図との関係
  choice: 「いわば、あなたがた皆です」とし、ἀπὸ μέρους を修辞的限定として読める形にした
  alternative: 「あなたがた皆を、ある程度悲しませた」または「あなたがたの一部を悲しませた」
  rationale: 語順と統語関係には解釈の幅があるため、特定の教会規律観に固定せず、本文と脚注でその緊張を保持した。
- issue: ἵνα μὴ ἐπιβαρῶ の対象
  choice: 「あなたがた皆に重荷を負わせすぎないため」
  alternative: 「言いすぎないため」または「あなたがた皆を責めすぎないため」
  rationale: 原文に明示された πάντας ὑμᾶς と「重荷」の比喩を保持しながら、パウロが事態を誇張しないよう配慮する含みも排除しない訳とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒的書簡にふさわしい落ち着きと品位を保った。「悲しみをもたらす／悲しませる」の反復で原文の語彙的連関を示し、解釈が分かれる ἀπὸ μέρους と ἐπιβαρῶ は本文で一義的に決めすぎず脚注で主要な可能性を示した。
