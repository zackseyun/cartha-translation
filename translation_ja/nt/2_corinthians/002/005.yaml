  to: もし、だれかが悲しみをもたらしたのであれば、その人が悲しませたのは私ではなく、――皆さん全員に重荷を負わせないために控えめに言えば――ある程度、皆さん全員なのです[a][b]。
  rationale: 本文を「ある程度」という明確な限定表現に改め、ἵνα節をその限定を和らげる挿入的説明として配置した。これにより、悲しみが全員にどの程度・どの範囲で及んだかという原文の解釈上の余地を脚注で保ちながら、原文の語順と修辞的配慮をより忠実に伝える。
