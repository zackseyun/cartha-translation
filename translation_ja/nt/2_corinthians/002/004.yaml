id: 2CO.2.4
reference: 2 Corinthians 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκ γὰρ πολλῆς θλίψεως καὶ συνοχῆς καρδίας ἔγραψα ὑμῖν διὰ πολλῶν δακρύων, οὐχ ἵνα λυπηθῆτε, ἀλλὰ τὴν ἀγάπην ἵνα γνῶτε ἣν ἔχω περισσοτέρως εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/004.yaml
  text: For out of much affliction and anguish of heart I wrote to you through many tears[a], not so that you might be grieved[b], but so that you might know the love that I have especially for you.
translation:
  language: ja
  text: 私は、大きな苦しみと心の苦悶の中から、多くの涙を流しながら、あなたがたに書きました。それは、あなたがたを悲しませるためではなく、私があなたがたに対していっそう豊かに抱いている愛[a]を知ってもらうためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私があなたがたに対して抱いている、ひときわ大きな愛」。
    reason: περισσοτέρωςには「より多く」「いっそう豊かに」という比較・強意の幅がある。比較対象は本文で明示されていない。
lexical_decisions:
- source_word: ἐκ πολλῆς θλίψεως
  choice: 大きな苦しみの中から
  rationale: ἐκが示す源・起点を「中から」で保ち、θλῖψιςを外的迫害に限定せず、強い圧迫や苦悩を含む「苦しみ」とした。
- source_word: συνοχῆς καρδίας
  choice: 心の苦悶
  rationale: 心が締めつけられるような内面的苦痛を、現代日本語で自然かつ重みのある表現にした。
- source_word: ἔγραψα
  choice: 書きました
  rationale: 単純過去として訳し、動詞自体に「以前に」という文脈的推測を加えなかった。
- source_word: διὰ πολλῶν δακρύων
  choice: 幾多の涙を流しながら
  rationale: 涙のただ中で書いた様子を自然な日本語で表し、涙の多さと感情の激しさを保った。
- source_word: λυπηθῆτε
  choice: 悲しませる
  rationale: 受動形「悲しむことになる」を目的表現に即して自然な使役構文とし、パウロが悲しみを生じさせることを目的としていなかった点を示した。
- source_word: ἀγάπην
  choice: 愛
  rationale: ἀγάπηの基本的かつ文脈に適した訳語を用いた。
- source_word: γνῶτε
  choice: 知ってもらう
  rationale: 目的節を明確に保ち、認識することと十分に理解することの双方を許す自然な表現とした。
- source_word: περισσοτέρως εἰς ὑμᾶς
  choice: あなたがたに対して抱いているひときわ深い
  rationale: περισσοτέρωςの比較・強意的な力を「ひときわ深い」で表し、愛の対象をεἰς ὑμᾶςに従って明示した。
theological_decisions:
- issue: περισσοτέρωςの比較対象
  choice: ひときわ深い愛
  alternative: より豊かに注いでいる愛／特別な愛
  rationale: 比較対象が本文中に明示されていないため、「ほかの人々よりもあなたがたを愛する」と限定せず、愛の並外れた深さを表す訳にした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒の強い苦悩と愛情が伝わるよう、簡潔で dignified な文体に整えた。「幾多の涙」はやや格調を保ちつつ一般読者にも理解できる表現である。
