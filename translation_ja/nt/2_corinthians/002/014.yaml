source:
  edition: SBLGNT
  text: Τῷ δὲ θεῷ χάρις τῷ πάντοτε θριαμβεύοντι ἡμᾶς ἐν τῷ Χριστῷ καὶ τὴν ὀσμὴν τῆς γνώσεως αὐτοῦ φανεροῦντι δι’ ἡμῶν ἐν παντὶ τόπῳ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/014.yaml
  text: But thanks be to God[b][a], who always leads us in triumphal procession in the Messiah and makes the fragrance of the knowledge of him known through us in every place.
translation:
  language: ja
  text: しかし、神に感謝します。神はいつも、メシアにあって私たちを凱旋の行列に加えて導き[a]、その方を知る知識の香り[b]を、私たちを通してあらゆる場所で明らかにしてくださいます[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシアにあって、いつも私たちに勝利を収める」。凱旋行列で征服された者を引き回すイメージを含むと理解することもできる。
    reason: alternative_reading
  - marker: b
    text: 「香り」に当たる語は、文脈によっては中立的に「におい」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「その方」は文の主語である神を指すと理解できるが、直前の「メシア」を指すと理解することもできる。
    reason: referential_ambiguity
lexical_decisions:
- source_word: χάρις
  choice: 感謝します
  rationale: 「神に感謝」という日本語の定型的で自然な表現により、Τῷ δὲ θεῷ χάρις の頌栄的な感謝を明確に伝える。
- source_word: θριαμβεύοντι
  choice: 凱旋の行列に連なって進ませ
  rationale: ローマの凱旋行列を想起させる具体的な比喩を保ち、ἡμᾶςを動詞の目的語として訳す。神が私たちに勝利するという含意もあり得るため、脚注に残す。
- source_word: ἐν τῷ Χριστῷ
  choice: メシアにあって
  rationale: Χριστόςの称号としての意味と、メシアとの結びつき・領域を示すἐνの含みを保つ。
- source_word: ὀσμὴν
  choice: 香り
  rationale: 後続文脈の比喩に適し、現代日本語で自然である。語自体は中立的に「におい」とも訳せるため脚注に示す。
- source_word: γνώσεως αὐτοῦ
  choice: 神を知る知識
  rationale: αὐτοῦの指示対象を日本語で明瞭にしつつ、属格が示す「神についての知識／神を知ること」の幅を不必要に狭めない表現とした。
- source_word: φανεροῦντι
  choice: 広めてくださいます
  rationale: 香りの比喩との自然な結びつきを優先し、知識が至る所で明らかにされる働きを表す。
- source_word: δι’ ἡμῶν
  choice: 私たちを通して
  rationale: 属格を伴うδιάが示す媒介・手段を自然に表す。
- source_word: ἐν παντὶ τόπῳ
  choice: あらゆる場所に
  rationale: 原文の普遍的な広がりを保ちながら、香りを「広める」と自然につながる日本語にした。
theological_decisions:
- issue: θριαμβεύωが目的語ἡμᾶςを伴う場合の意味
  choice: 神が私たちを凱旋の行列に連なって進ませる
  alternative: 神がメシアにあって私たちに勝利を収める
  rationale: 本文では凱旋行列という具体的イメージと、続く香りの比喩とのつながりを保った。一方、捕虜を引き回して勝利を示す語感もあり、神が私たちを征服するという解釈を脚注に保存した。
- issue: αὐτοῦの指示対象
  choice: 神
  alternative: メシア
  rationale: 文の主語であり、知識を明らかにする方である「神」を最も自然な先行詞と判断したが、文法上の近接性から「メシア」を指す可能性もあるため、解釈上の緊張を認識する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。凱旋行列と香りという二つの連続した比喩を保ちつつ、過度に古風な語法を避けた。
