id: 2CO.2.12
reference: 2 Corinthians 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐλθὼν δὲ εἰς τὴν Τρῳάδα εἰς τὸ εὐαγγέλιον τοῦ Χριστοῦ καὶ θύρας μοι ἀνεῳγμένης ἐν κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/012.yaml
  text: When I came to Troas for the gospel of Messiah[a], and a door had been opened for me in the Lord[b],
translation:
  language: ja
  text: 'さて、私がメシア[a]の福音のためにトロアスへ行った時、主にあって私に戸が開かれており[b]、


    [a] または「キリスト」。


    [b] または「戸が開いたままになっており」。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。
    reason: Χριστόςを称号の意味を示す「メシア」とするか、定着した音写「キリスト」とするかという語彙上の選択肢。
  - marker: b
    text: または「戸が開いたままになっており」。
    reason: 完了受動分詞ἀνεῳγμένηςが、開く行為の結果として存続する状態を表すことを示す別訳。
lexical_decisions:
- source_word: Ἐλθὼν
  choice: 行った時
  rationale: アオリスト分詞を文脈に即して時を表す従属表現とし、後続節へ続く構文を自然な日本語で示した。
- source_word: δὲ
  choice: さて
  rationale: 強い逆接ではなく、話の展開を示す穏やかな談話標識として訳した。
- source_word: εἰς τὴν Τρῳάδα
  choice: トロアスへ
  rationale: 場所への方向を表す εἰς を自然な日本語で表した。
- source_word: εἰς τὸ εὐαγγέλιον
  choice: 福音のために
  rationale: 二つ目の εἰς の目的用法を示しつつ、原文に明記されていない「宣べ伝える」を補わなかった。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστός の称号としての意味を明示した。「キリスト」は脚注に残した。
- source_word: θύρας
  choice: 門
  rationale: 機会を指す比喩だが、パウロの用いた具体的な比喩を保持した。
- source_word: ἀνεῳγμένης
  choice: 開かれており
  rationale: 完了受動分詞が示す、開かれた結果としての継続状態を表し、文が次節へ続くことも保った。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 手段を示す「主によって」と断定せず、パウロ特有の ἐν κυρίῳ の幅を保持した。
theological_decisions:
- issue: Χριστοῦ の称号性
  choice: メシア
  alternative: キリスト
  rationale: この箇所では油注がれた者という称号の意味が自然に働いているため「メシア」とし、日本語で定着した音写「キリスト」も脚注に示した。
- issue: ἐν κυρίῳ の関係
  choice: 主にあって
  alternative: 主によって
  rationale: 原文の ἐν は、主との関係・領域または主を手段とする意味を帯び得るため、本文では曖昧さを狭めない表現を採用した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。節が次節へ続く原文の未完結な構文を、末尾の「おり、」で保持した。「福音」「主にあって」「門」という聖書的表現は、意味を過度に説明へ置き換えず残した。
