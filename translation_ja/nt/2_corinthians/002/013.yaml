reference: 2 Corinthians 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἔσχηκα ἄνεσιν τῷ πνεύματί μου τῷ μὴ εὑρεῖν με Τίτον τὸν ἀδελφόν μου, ἀλλὰ ἀποταξάμενος αὐτοῖς ἐξῆλθον εἰς Μακεδονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/002/013.yaml
  text: I had no rest in my spirit because I did not find Titus my brother[a], but after taking leave of them[c][b], I went on to Macedonia.
translation:
  language: ja
  text: 兄弟テトスが見つからなかったので、私の心[a]には安らぎがありませんでした。しかし、彼らに別れを告げて、マケドニアへ向かいました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の霊には」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔσχηκα ἄνεσιν
  choice: 安らぎがありませんでした
  rationale: 完了形を物語の過去の状況として自然に表し、ἄνεσιςが示す内面的な休息の欠如を明確にした。
- source_word: τῷ πνεύματί μου
  choice: 私の心には
  rationale: ここでのπνεῦμαはパウロの内面を指すと考えられ、日本語では「心」が自然である。「霊」として神学的意味を不必要に強めることを避けた。
- source_word: τῷ μὴ εὑρεῖν με Τίτον
  choice: テトスが見つからなかったので
  rationale: 冠詞付き不定詞が示す理由を「ので」で明示した。日本語の「見つけられなかった」は能力不足とも取れるため、事実を表す「見つからなかった」とした。
- source_word: Τίτον τὸν ἀδελφόν μου
  choice: 兄弟テトス
  rationale: 同信の仲間また同労者を表す家族的呼称を保持しつつ、日本語で自然な語順にした。
- source_word: ἀποταξάμενος αὐτοῖς
  choice: 彼らに別れを告げ
  rationale: 別れの挨拶をして立ち去ることを、明瞭で現代的な表現にした。
- source_word: ἐξῆλθον εἰς Μακεδονίαν
  choice: マケドニアへ向かいました
  rationale: 移動の目的地を自然に示す。「出て行った」より文脈に適した現代日本語である。
theological_decisions:
- issue: τῷ πνεύματί μουにおけるπνεῦμαの意味
  choice: 私の心には
  alternative: 私の霊には
  rationale: 人間の内面を指す文脈に合う自然な日本語を採用したが、原語の「霊」という表現も可能なため脚注で示した。
translation_notes:
  register: 明瞭で品位ある現代標準語。パウロの内面的な動揺と、その後の移動の流れを自然に伝える。敬体を用い、固有名と同格の「兄弟」は教会共同体における関係を保つ。
