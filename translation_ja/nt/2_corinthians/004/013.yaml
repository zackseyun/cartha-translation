id: 2CO.4.13
reference: 2 Corinthians 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔχοντες δὲ τὸ αὐτὸ πνεῦμα τῆς πίστεως, κατὰ τὸ γεγραμμένον· Ἐπίστευσα, διὸ ἐλάλησα, καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/013.yaml
  text: But having the same spirit of faith[a], according to what is written, “I believed; therefore I spoke,” we also believe; therefore we also speak[b],
translation:
  language: ja
  text: しかし、書かれているとおり、「私は信じた。それゆえ語った。」[b]という同じ信仰の霊[a]を持つ私たちも、信じているので、それゆえまた語るのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同じ信仰の御霊」とも訳せる。πνεῦμαを、信仰に満ちた共通の心や姿勢ではなく、聖霊への言及と取る場合。
    reason: alternative_reading
  - marker: b
    text: パウロは詩編116編10節（七十人訳では115編1節）を引用し、自分たちが信じて語ることを、詩編の語り手の証しと重ねている。
    reason: cross_reference
lexical_decisions:
- source_word: Ἔχοντες δὲ
  choice: しかし、私たちは…持っています
  rationale: 分詞の連続性を日本語では主節と自然につなげ、δέの穏やかな対照を「しかし」で示した。文脈上あり得る理由の含みを「ので」として明示しすぎない。
- source_word: τὸ αὐτὸ πνεῦμα τῆς πίστεως
  choice: 同じ信仰の霊
  rationale: 属格を簡潔に保ち、共有された信仰に満ちた心・姿勢と聖霊への言及との間にある原文の曖昧さを残した。
- source_word: κατὰ τὸ γεγραμμένον
  choice: 書かれているとおり
  rationale: 聖書引用を導入する定型句として、現代日本語で明瞭かつ格調を保つ表現とした。
- source_word: Ἐπίστευσα, διὸ ἐλάλησα
  choice: 私は信じた。それゆえ語った
  rationale: アオリストを過去形で直接訳し、διόの推論・結果を「それゆえ」で明示した。
- source_word: καὶ ἡμεῖς πιστεύομεν, διὸ καὶ λαλοῦμεν
  choice: 私たちも信じています。それゆえ、私たちも語るのです
  rationale: 強意のἡμεῖςと二つのκαίが示す詩編話者との対応を、反復によって保持した。現在形には継続的な現状を自然に表す「ています」を用いた。
theological_decisions:
- issue: πνεῦμαが聖霊を指すか、信仰に満ちた共有の精神・姿勢を指すか
  choice: 本文では「信仰の霊」とし、通常の語形で共有の精神・姿勢を第一義に置く
  alternative: 「信仰を与える同じ御霊」など、聖霊への明示的言及と取る
  rationale: 直後の詩編引用は、信じたために語るという共通の信仰的姿勢を前面に出す。一方、ギリシア語だけでは聖霊への言及を排除できないため、脚注で可能性を保持した。
- issue: πιστεύωの訳語
  choice: 信じる
  alternative: 信頼する／信仰を持つ
  rationale: 引用部とパウロの適用部で同じ動詞を反復し、原文の語彙的・修辞的対応を保つため。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、引用句の「それゆえ」と反復構造によって原文の論理性と格調を保った。「信仰の霊」はやや凝縮された表現だが、解釈上の曖昧さを不用意に解消しないため維持した。
