reference: 2 Corinthians 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰ γὰρ πάντα δι’ ὑμᾶς, ἵνα ἡ χάρις πλεονάσασα διὰ τῶν πλειόνων τὴν εὐχαριστίαν περισσεύσῃ εἰς τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/015.yaml
  text: For all things are for your sake[a], so that as grace increases through more and more people, thanksgiving may overflow to the glory of God.
translation:
  language: ja
  text: すべてのことは、あなたがたのためです。それは、恵みがより多くの人々を通して[a]増し加わり、神の栄光のために感謝を豊かにあふれさせるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「多くの人々を通して」または「さらに大勢の人々を通して」。ギリシア語は、多くの人々一般を指すとも、人数が増えていくことを指すとも取れます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ γὰρ πάντα
  choice: すべてのことは
  rationale: τὰ πάνταの包括的な意味を保ちつつ、γὰρの説明的な働きは、日本語では前後関係と文の流れによって自然に示した。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのためです
  rationale: 対格を伴うδιάが表す受益の意味を明確にし、「あなたがたのゆえに」という原因の意味に狭めなかった。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的と結果の双方を含み得る接続の働きを、自然な現代日本語で表した。
- source_word: ἡ χάρις
  choice: 恵み
  rationale: 神の好意とその働きを表す語として定着した訳語を用い、具体的な教理的仕組みに限定しなかった。
- source_word: πλεονάσασα
  choice: 増し加わり
  rationale: 恵みが広がり豊かになる動きを表し、分詞を日本語の連用形で主節へ自然につないだ。
- source_word: διὰ τῶν πλειόνων
  choice: より多くの人々を通して
  rationale: 比較級の含みを生かして人数の増加を表した。同時に、「多くの人々」一般を指す可能性は脚注に残した。
- source_word: τὴν εὐχαριστίαν περισσεύσῃ
  choice: 感謝が満ちあふれて
  rationale: εὐχαριστίαを神に向けられる感謝として訳し、περισσεύωの豊かにあふれる意味を明瞭に表した。
- source_word: εἰς τὴν δόξαν τοῦ θεοῦ
  choice: 神の栄光に至る
  rationale: εἰςが示す方向・帰結を保ち、感謝が最終的に神の栄光へ向かうことを表した。
theological_decisions:
- issue: 目的節における「恵み」の指示内容と働き
  choice: 使徒の働きとその広がりの中で作用する神の恵みとして、意味を限定せずに訳した。
  alternative: 救いの恵みがより多くの受け手に広がること、または神の恵み深い働きが感謝を増し加えること。
  rationale: 本文は、χάριςが救いの恩恵そのものを主に指すのか、使徒的奉仕に働く神の恵みを指すのかを一義的に決めていないため、その幅を保った。
- issue: εἰς τὴν δόξαν τοῦ θεοῦの目的・結果
  choice: 「神の栄光に至る」とし、方向と帰結を表した。
  alternative: 「神の栄光のためとなる」。
  rationale: 目的だけに限定せず、満ちあふれる感謝が神の栄光へと帰着するという原文の方向性を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「増し加わり」「満ちあふれて」によって原文の増大と豊かさの重なりを保持した。
