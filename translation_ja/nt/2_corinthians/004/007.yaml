source:
  edition: SBLGNT
  text: Ἔχομεν δὲ τὸν θησαυρὸν τοῦτον ἐν ὀστρακίνοις σκεύεσιν, ἵνα ἡ ὑπερβολὴ τῆς δυνάμεως ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/007.yaml
  text: But we have this treasure in clay jars[b][a], so that the surpassing greatness of the power may be of God and not from us.
translation:
  language: ja
  text: しかし、私たちはこの宝を土の器[a]に入れています。それは、その力の並外れた大きさ[b]が神からのものであって、私たちから出たものではないためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「土でできた容器」。
    reason: ὀστράκινοις σκεύεσινの材質と容器性をより明示する語彙上の別訳。
  - marker: b
    text: 別訳「並外れた力」。直訳「力の並外れた大きさ」。
    reason: ὑπερβολὴ τῆς δυνάμεωςは、力の卓越した度合いを表す。本文はその名詞構造を反映し、別訳は簡潔な表現を示す。
lexical_decisions:
- source_word: Ἔχομεν δὲ
  choice: しかし、私たちは……納めています
  rationale: δὲの文脈上の対比を「しかし」で示し、ἔχομενは日本語では器の比喩に合わせて「納めています」と自然に表現した。所有の意味は保たれている。
- source_word: τὸν θησαυρὸν τοῦτον
  choice: この宝
  rationale: 指示詞と比喩をそのまま保ち、宝の内容を本文中で説明しすぎないようにした。
- source_word: ἐν ὀστρακίνοις σκεύεσιν
  choice: 土の器
  rationale: ὀστράκινοςが表す土製・陶製の性質と、σκεῦοςの容器という意味を、簡潔で定着した現代日本語の比喩として表した。
- source_word: ἡ ὑπερβολὴ τῆς δυνάμεως
  choice: その並外れた力
  rationale: ὑπερβολήが示す通常の限度を超えた程度を「並外れた」で表し、日本語として不自然になりやすい「力の並外れた大きさ」は脚注の代案とした。
- source_word: ᾖ τοῦ θεοῦ καὶ μὴ ἐξ ἡμῶν
  choice: 神から出たものであって、私たちから出たものではない
  rationale: 神を表す属格と、ἐξが明示する源を日本語で対照的に表し、力の源が神であって人間ではないという構造を保った。
theological_decisions:
- issue: 「宝」と「土の器」の比喩の内容
  choice: 比喩を説明せず、そのまま保持する。
  alternative: 「福音という宝」「弱い人間の体」などと明示する。
  rationale: 前後の文脈は比喩の理解を助けるが、この節自体はその対応関係を明言していないため、本文では解釈を加えない。
- issue: ἵνα節の目的・結果の含み
  choice: 「明らかになるため」として、目的を中心にしつつ結果にも読める表現にする。
  alternative: 「その結果……明らかになります」と純粋な結果として訳す。
  rationale: ἵναの目的的な力を保ちながら、「力が神からのものである」という日本語の述語関係を明瞭にした。「明らかになる」はギリシャ語に独立した対応語がないため、本文の論理を自然な日本語にするための補足である。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの「宝」と「土の器」という対照的な比喩を保持した。語調は平易だが礼拝・朗読にも耐える品位を意識した。
