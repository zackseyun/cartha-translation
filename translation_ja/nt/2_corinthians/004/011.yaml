reference: 2 Corinthians 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀεὶ γὰρ ἡμεῖς οἱ ζῶντες εἰς θάνατον παραδιδόμεθα διὰ Ἰησοῦν, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ φανερωθῇ ἐν τῇ θνητῇ σαρκὶ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/011.yaml
  text: For we who are living are always being handed over to death for Jesus’ sake[b][a], so that the life of Jesus also may be revealed in our mortal flesh.
translation:
  language: ja
  text: というのは、生きている私たちは、イエスのゆえに[a]、絶えず死に引き渡されています。それは、イエスのいのちもまた、死ぬべき私たちの肉体[b]に現されるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスのために」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここで「肉体」は、罪深い性質ではなく、死を免れない身体としての存在を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀεὶ
  choice: 絶えず
  rationale: 継続的・反復的な状況を表す副詞。現在受動形と合わせ、絶え間なく死の危険にさらされることを自然に示す。
- source_word: γάρ
  choice: （文脈上の説明関係として表現）
  rationale: 前節を説明する接続辞。単独節として不自然な「というのは」を置かず、前後の文脈では説明関係が保たれる簡潔な日本語とした。
- source_word: οἱ ζῶντες
  choice: 私たち生きている者
  rationale: 冠詞付き現在分詞の名詞的用法を保ち、同節の「死」との対照を明瞭にした。
- source_word: εἰς θάνατον παραδιδόμεθα
  choice: 死に引き渡されています
  rationale: εἰς は行き着く先を、現在受動形は継続的に引き渡される状況を示す。「死へ」より自然な「死に」を用いた。
- source_word: διὰ Ἰησοῦν
  choice: イエスのゆえに
  rationale: 対格を伴う διά の原因・理由を保持する。「イエスのために」とも訳せるため、脚注で幅を示した。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的または結果を示す接続を明確にしつつ、両者を過度に限定しない日本語表現。
- source_word: καὶ
  choice: もまた
  rationale: 死に引き渡されることと、イエスのいのちが現されることとの対応を示す。
- source_word: ἡ ζωὴ τοῦ Ἰησοῦ
  choice: イエスのいのち
  rationale: 属格表現を簡潔に保ち、「死」との神学的対照を表した。
- source_word: φανερωθῇ
  choice: 現される
  rationale: アオリスト受動接続法。行為者を補わず、受動の開放性を保持した。
- source_word: ἐν τῇ θνητῇ σαρκὶ ἡμῶν
  choice: 死ぬべき私たちの肉体
  rationale: ここでの σάρξ は罪の性質ではなく、死を免れない身体的存在を指す。日本語では「死ぬべき肉体」が意味と品位を自然に伝える。
theological_decisions:
- issue: パウロ書簡における σάρξ の訳語
  choice: 肉体
  alternative: 肉／罪深い性質
  rationale: θνητός（死ぬべき）が修飾しており、倫理的な罪の原理ではなく、死にさらされた身体的存在を指す。「肉」より現代日本語で誤解が少なく、「罪深い性質」は文脈にない意味を加える。
- issue: διὰ Ἰησοῦν の因果・目的的含意
  choice: イエスのゆえに
  alternative: イエスのために
  rationale: διά＋対格の基本的な原因・理由を優先した。一方、忠誠ゆえの苦難という文脈では目的・献身的な響きもあり得るため、脚注で代案を保持した。
- issue: ἵνα 節の目的と結果
  choice: それは……ためです
  alternative: その結果……現されます
  rationale: ἵνα の目的的な力を保ちながら、実現する結果の含みも排除しない表現とした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「いのち」は「死」との対照および神学的含意を示すため、ひらがな表記とした。
