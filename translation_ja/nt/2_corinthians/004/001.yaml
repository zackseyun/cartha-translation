  text: Διὰ τοῦτο, ἔχοντες τὴν διακονίαν ταύτην καθὼς ἠλεήθημεν, οὐκ ⸀ἐγκακοῦμεν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/001.yaml
  text: Therefore, since we have this ministry, just as we have received mercy, we do not lose heart.
translation:
  language: ja
  text: こういうわけで、私たちは、あわれみを受けたとおりにこの務めを担っているので、落胆しません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: こういうわけで
  rationale: 直前の議論を受ける推論的な接続を、自然な現代日本語で示す。
- source_word: τὴν διακονίαν ταύτην
  choice: この務め
  rationale: διακονίαの奉仕・職務という意味を簡潔に表し、文脈上の福音宣教の働きを特定の教職名に限定しない。
- source_word: καθὼς ἠλεήθημεν
  choice: あわれみを受けて…任されている
  rationale: 受動形が示す神からのあわれみを保持しつつ、務めを持つこととの関係が日本語で明瞭になるよう統合した。καθώςはここで単なる様態比較よりも、あわれみによって務めを受けた事情を示すと判断した。
- source_word: οὐκ ἐγκακοῦμεν
  choice: 落胆しません
  rationale: 困難の中で気力を失い、務めを投げ出すことを否定する語。自然さを優先して「落胆しません」とした。
theological_decisions:
- issue: あわれみと務めの関係
  choice: 神のあわれみを受けた結果として、この務めを任されたという関係を示す
  alternative: 「あわれみを受けたのと同じように、この務めを持っている」と比較関係を前面に出す
  rationale: καθὼς ἠλεήθημενは形式上「そのように／〜したとおり」だが、文脈では使徒的務めが功績ではなく神のあわれみに基づくことを表す。主体を本文で補わず、神的受動の含みは保った。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。「あわれみ」は聖書的な重みを保ち、「務め」は教派固有の役職理解を避ける。
