id: 2CO.4.4
reference: 2 Corinthians 4:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν οἷς ὁ θεὸς τοῦ αἰῶνος τούτου ἐτύφλωσεν τὰ νοήματα τῶν ἀπίστων εἰς τὸ μὴ ⸀αὐγάσαι τὸν φωτισμὸν τοῦ εὐαγγελίου τῆς δόξης τοῦ Χριστοῦ, ὅς ἐστιν εἰκὼν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/004.yaml
  text: In their case[a], the god of this age has blinded the minds of the unbelieving, so that the light of the gospel of the glory of Messiah, who is the image of God[c][b], might not shine on them.
translation:
  language: ja
  text: その人たちの場合、この時代の神[a]が、信じない者たちの思いをくらませました。それは、神のかたちであるメシア[c]の栄光の福音の光が、彼らを照らさないようにするためです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この世の神」とも訳せます。ギリシア語のアイオーンは通常「時代」を意味し、ここでは現在の堕落した時代に重点があります。
    reason: lexical_alternative
  - marker: b
    text: 「彼らが、メシアの栄光の福音の光を見ないようにするため」とも訳せます。ここに使われる稀な動詞は、光が照らすことにも、人がその光を見ることにも重点を置き得ます。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語はクリストスで、「油注がれた者」を意味する称号です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: その人たちの場合
  rationale: 直前の文脈にある、滅びに向かう人々を受ける表現。字義的な「その人たちの中で」よりも、ここでの指示関係を自然な現代日本語で示す。
- source_word: ὁ θεὸς τοῦ αἰῶνος τούτου
  choice: この時代の神
  rationale: αἰώνを被造世界ではなく現在の時代として訳し、本文にない「サタン」を補わず、原文の呼称を保った。
- source_word: ἐτύφλωσεν τὰ νοήματα
  choice: 思いをくらませました
  rationale: νόημαは個々の思考よりも理解・認識の働きを指す。「目を見えなくした」という比喩を、日本語で理解可能なまま保持した。
- source_word: τῶν ἀπίστων
  choice: 信じない者たちの
  rationale: 実体詞的な形容詞の意味を率直に表し、「不忠実」という別の倫理的含意を加えない。
- source_word: εἰς τὸ μὴ αὐγάσαι
  choice: 光が、彼らを照らさないようにするため
  rationale: 目的・結果を表す構文として訳した。稀な動詞αὐγάζωは、主文では光が照らす意味に取り、知覚する意味の可能性は脚注に残した。
- source_word: τὸν φωτισμὸν τοῦ εὐαγγελίου
  choice: 福音の光
  rationale: φωτισμόςの光の比喩を簡潔で自然な日本語にしつつ、福音との属格関係を維持した。
- source_word: τῆς δόξης τοῦ Χριστοῦ
  choice: メシアの栄光の
  rationale: 属格を形容詞化して「栄光に満ちた福音」とせず、栄光がメシアに属するという原文の重層的な関係を保った。
- source_word: τοῦ Χριστοῦ
  choice: メシア
  rationale: Χριστόςを称号として訳し、「油注がれた者」という救済史的意味を示した。
- source_word: ὅς ἐστιν εἰκὼν τοῦ θεοῦ
  choice: 神のかたちである
  rationale: εἰκώνについての直接的なキリスト論的宣言を、後代の教理用語を付加せずに表した。
theological_decisions:
- issue: 「この時代の神」の指示対象
  choice: 原文どおり「この時代の神」とし、固有名を補わない
  alternative: 「サタン」または非人格的な「世の力」と明示する
  rationale: 文脈上は人格的な悪の支配者が想定されるが、本文自体は固有名を述べない。曖昧さを保ち、真の神との同一視も避ける。
- issue: αὐγάσαιとφωτισμόςの統語関係
  choice: 福音の光が彼らを照らさない
  alternative: 彼らが福音の光を見ない
  rationale: 稀な動詞は「光を放つ／照らす」と「光を見る」の双方に解し得るため、本文では前者を採り、後者を脚注に明記した。
- issue: 「神のかたち」のキリスト論的意味
  choice: 原文の直接的な同定だけを記す
  alternative: 本質や位格について説明を加える
  rationale: 強いキリスト論的含意は保持するが、原文にない後代の定式を本文へ持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「くらませる」「神のかたち」など聖書的比喩は保持し、長いギリシア語文は二文に分けて理解しやすくした。「メシアの栄光の福音の光」という属格の連鎖は多少密度が高いが、原文の意味関係を不用意に一義化しないため維持した。
