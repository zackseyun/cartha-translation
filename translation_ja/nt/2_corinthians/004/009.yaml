  text: διωκόμενοι ἀλλ’ οὐκ ἐγκαταλειπόμενοι, καταβαλλόμενοι ἀλλ’ οὐκ ἀπολλύμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/009.yaml
  text: persecuted[a], but not abandoned; struck down, but not destroyed[b],
translation:
  language: ja
  text: 迫害されても、見捨てられず、打ち倒されても、滅ぼされない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διωκόμενοι
  choice: 迫害されても
  rationale: 敵意ある追跡や圧迫を表す受動分詞を、現代日本語で自然な「迫害される」とし、後続の対照を示すため「ても」を用いた。
- source_word: ἐγκαταλειπόμενοι
  choice: 見捨てられず
  rationale: 置き去りにされ、見放される意味を、古風さを避けつつ明確に伝える。「見放されず」も可能だが、「見捨てられず」のほうが原語の放置・遺棄の含意をよく保つ。
- source_word: καταβαλλόμενοι
  choice: 打ち倒されても
  rationale: 投げ倒す、地に倒すという比喩的な力を保ち、単なる落胆ではなく外からの打撃によって倒される情景を示す。
- source_word: ἀπολλύμενοι
  choice: 滅ぼされない
  rationale: 直前の「打ち倒される」と対照をなし、倒されても最終的な破滅には至らないという強い対句を表す。
- source_word: ἀλλ’ οὐκ
  choice: ても、…ず／ても、…ない
  rationale: ギリシア語の二つの簡潔な逆接対句を、日本語として自然な譲歩構文で再現した。
theological_decisions:
- issue: ἐγκαταλειπόμενοιを、神学的響きの強い表現にするか、現代的で直接的な表現にするか
  choice: 見捨てられず
  alternative: 見放されず／置き去りにされず
  rationale: 誰が見捨てないのかを本文以上に明示せず、受動表現の曖昧さを保持する。同時に、現代の読者にも自然で、原語の遺棄の意味を伝える。
- issue: ἀπολλύμενοιを進行的な「滅びつつある」とするか、対句として「滅ぼされない」とするか
  choice: 滅ぼされない
  alternative: 滅びない
  rationale: καταβαλλόμενοιとの対照は、打倒と最終的破滅の区別を強調するため、受動性を保つ「滅ぼされない」が文脈に適する。
translation_notes:
  register: 明快な現代標準日本語。原文の二組の平行した逆接を「〜ても、〜ず／〜ない」で簡潔に再現し、荘重さを保ちながら古語調は避けた。
