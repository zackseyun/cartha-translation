id: 2CO.4.16
reference: 2 Corinthians 4:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὸ οὐκ ⸀ἐγκακοῦμεν, ἀλλ’ εἰ καὶ ὁ ἔξω ἡμῶν ἄνθρωπος διαφθείρεται, ἀλλ’ ὁ ⸂ἔσω ἡμῶν⸃ ἀνακαινοῦται ἡμέρᾳ καὶ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/016.yaml
  text: Therefore we do not lose heart. But even if our outer man is wasting away[a], yet our inner man is being renewed day by day.
translation:
  language: ja
  text: ですから、私たちは落胆しません。たとえ私たちの外なる人[a]が衰えていっても、内なる人は日々新しくされています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「外なる人」と「内なる人」は、それぞれ「外面的な人間」と「内面的な人間」とも訳せる。ギリシア語は「人」を代表的な意味で用い、人間の外的側面と内的側面を意図的に対比している。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前までの議論から導かれる結論を示す推論的な接続を、明瞭で自然な現代日本語で表した。
- source_word: οὐκ ἐγκακοῦμεν
  choice: 私たちは落胆しません
  rationale: 勇気を失い、気力がくじけるというパウロの用法を自然に表す。「あきらめません」よりも内面的な意気阻喪に焦点を置く。
- source_word: ἀλλ’ εἰ καὶ
  choice: たとえ……ても
  rationale: 現実に進行している苦難を認めつつ主節との譲歩的対照を作る構文として訳した。
- source_word: ὁ ἔξω ἡμῶν ἄνθρωπος
  choice: 私たちの外なる人
  rationale: 後続の「内なる人」との意図的な対句、およびἄνθρωποςの単数形を保つ。現代語としてやや特徴的な表現であるため脚注で意味を補う。
- source_word: διαφθείρεται
  choice: 衰えていっても
  rationale: 現在受動形が示す継続的な消耗・衰弱を表し、完全な滅亡と断定しない訳語を選んだ。
- source_word: ὁ ἔσω ἡμῶν
  choice: 内なる人
  rationale: 省略されているἄνθρωποςを補って「外なる人」との語形上・概念上の対応を保った。
- source_word: ἀνακαινοῦται
  choice: 新しくされています
  rationale: 現在受動形による継続的な刷新と、主体が更新を受けていることを表した。
- source_word: ἡμέρᾳ καὶ ἡμέρᾳ
  choice: 日々
  rationale: 日ごとに繰り返される継続性を簡潔で自然な日本語にした。
theological_decisions:
- issue: 「外なる人」と「内なる人」の人間論的対照
  choice: 「外なる人／内なる人」と訳し、外的な人間存在の衰えと内的な刷新との対照を保持する。
  alternative: 「外面的な自分／内面的な自分」または「肉体／霊」
  rationale: 原文は意図的に外と内を対比するが、ここだけで厳密な身体・魂の二元論を定義してはいない。「肉体／霊」と明示すると原文以上の解釈を持ち込むため避けた。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、パウロの特徴的な対句を保持するため「外なる人／内なる人」を採用した。「落胆しません」「日々新しくされています」により、格調を損なわず一般読者にも理解しやすい文体とした。
