source:
  edition: SBLGNT
  text: πάντοτε τὴν νέκρωσιν ⸀τοῦ Ἰησοῦ ἐν τῷ σώματι περιφέροντες, ἵνα καὶ ἡ ζωὴ τοῦ Ἰησοῦ ἐν τῷ σώματι ἡμῶν φανερωθῇ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/010.yaml
  text: always carrying in the body the death of Jesus[a], so that the life of Jesus may also be revealed in our body.
translation:
  language: ja
  text: いつも、イエスの死[a]を身に負っています。それは、イエスのいのちもまた、私たちの身に現されるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスの死にゆくこと」。ギリシア語の名詞は、身に負う死の状態や経験を強調することがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: いつも
  rationale: 継続する状況を表す副詞として、簡潔で自然な現代日本語にした。
- source_word: τὴν νέκρωσιν
  choice: 死
  rationale: 死の状態または経験を指す名詞であり、後半の「いのち」との対照も明確になる。「死にゆくこと」という可能性は脚注に残した。
- source_word: τοῦ Ἰησοῦ
  choice: イエスの
  rationale: 属格の関係を過度に限定せず、原文の簡潔さと曖昧さを保った。
- source_word: ἐν τῷ σώματι
  choice: この身に
  rationale: 最初の用例には明示的な所有代名詞がないため「私たちの」を補わず、日本語として自然に身体性を示した。
- source_word: περιφέροντες
  choice: 負っています
  rationale: 継続して身に帯びる比喩を、苦難を担う文脈に自然な日本語で表した。
- source_word: ἵνα
  choice: それは、…ためです
  rationale: 目的と結果の双方を含み得る節のつながりを保ちつつ、明瞭な日本語にした。
- source_word: καὶ
  choice: もまた
  rationale: イエスの死といのちの対応関係を明示した。
- source_word: ἡ ζωὴ
  choice: いのち
  rationale: 復活したイエスの生命を指す文脈で、聖書文体として自然かつ理解しやすい表記を採った。
- source_word: ἐν τῷ σώματι ἡμῶν
  choice: 私たちの身に
  rationale: 単数形の身体と複数所有者という原文の集合的表現を、日本語の「私たちの身」で保った。
- source_word: φανερωθῇ
  choice: 現される
  rationale: 受動態を保ち、イエスのいのちが目に見える形で明らかになる意味を自然に表した。
theological_decisions:
- issue: νέκρωσις とイエスとの関係
  choice: 「イエスの死」と訳す
  alternative: 「イエスの死にゆくさま」「イエスの死にゆくこと」
  rationale: 名詞の基本的意味と「イエスのいのち」との対照を保ち、キリストとの結びつきについて特定の神学的説明を付加しない。
- issue: σῶμα の数と集合性
  choice: 両方を単数的な「身」で表す
  alternative: 後半を「私たちの体々」または各人の「体」と解釈する
  rationale: 原文は二箇所とも単数であり、使徒たちの働きにおける集合的・身体的な響きを保つ。
- issue: ἵνα 節の目的・結果
  choice: 「それは、…ためです」
  alternative: 「その結果、…現されます」
  rationale: ἵνα が持つ目的・結果の緊張を一方に限定せず、文脈上の因果的な関係を自然に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、本文の対句と厳粛さを保った。「この身」は第一の σώμα に所有語がないことを反映し、「私たちの身」は第二の明示的な ἡμῶν を反映する。脚注記号 [a] は本文中に配置した。
