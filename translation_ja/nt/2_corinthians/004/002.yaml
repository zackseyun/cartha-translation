source:
  edition: SBLGNT
  text: ἀλλὰ ἀπειπάμεθα τὰ κρυπτὰ τῆς αἰσχύνης, μὴ περιπατοῦντες ἐν πανουργίᾳ μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ, ἀλλὰ τῇ φανερώσει τῆς ἀληθείας ⸀συνιστάνοντες ἑαυτοὺς πρὸς πᾶσαν συνείδησιν ἀνθρώπων ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/002.yaml
  text: Instead[a], we have renounced the hidden things of shame, not walking in cunning nor falsifying the word of God[b], but by the open display of the truth commending ourselves to every human conscience before God.
translation:
  language: ja
  text: むしろ私たちは、恥ずべき隠れた事柄を捨て去りました。悪賢く振る舞うことも、神のことばに不正な手を加えることもせず[a]、真理を明らかに示すことによって[b]、神の前で、すべての人の良心に対して自分たちが信頼に値することを示しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「神のことばを混ぜ物で損なうこともせず」。この動詞には、欺いて改変したり、不純なものを混ぜたりする含みがあります。
    reason: lexical_alternative
  - marker: b
    text: 別訳「真理の現れによって」。原文は、単に言葉で宣べ伝えることよりも、真理を明白に現すことに重点を置く可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπειπάμεθα
  choice: 捨て去りました
  rationale: 決然と退けたことを表すアオリスト中動態の力を、自然な現代日本語で示す。
- source_word: τὰ κρυπτὰ τῆς αἰσχύνης
  choice: 恥となる隠れた事柄
  rationale: 隠されているものと、それを特徴づける恥との属格関係を保ち、「行い」だけに限定しない。
- source_word: μὴ περιπατοῦντες ἐν πανουργίᾳ
  choice: 悪賢く振る舞うこともせず
  rationale: 比喩的な「歩く」を日本語で自然な生き方・行動の表現にし、πανουργίαの不正で狡猾な含みを伝える。
- source_word: μηδὲ δολοῦντες τὸν λόγον τοῦ θεοῦ
  choice: 神のことばに不正な手を加えることもせず
  rationale: δολόωが示す欺瞞的な改変・混ぜ物の具体性を保ちつつ、「偽造する」より広い意味を表す。
- source_word: τῇ φανερώσει τῆς ἀληθείας
  choice: 真理を明らかに示すことによって
  rationale: φανέρωσιςを言語的な宣言だけに限定せず、真理を公然と明示する意味に訳す。
- source_word: συνιστάνοντες ἑαυτοὺς
  choice: 自分たちを推薦している
  rationale: 自らを信頼に値する者として示すという文脈上の意味を保つ。「推薦」はやや改まった語だが、原文の自己提示の表現を簡潔に伝える。
- source_word: πρὸς πᾶσαν συνείδησιν ἀνθρώπων
  choice: すべての人の良心に
  rationale: πᾶσανの配分的な意味と、人間一人ひとりの道徳的判断への訴えを保持する。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の前で
  rationale: 神が証人であり審判者でもあるという含みを、簡潔かつ荘重に保つ。
theological_decisions:
- issue: 欺瞞的な奉仕と真理に基づく奉仕の対比
  choice: 使徒の奉仕における倫理的な透明性と、神のことばを欺いて扱わない姿勢として訳す。
  alternative: 聖書の扱い全般についての体系的教理、または修辞的操作だけを禁じる限定的主張として訳す。
  rationale: 直接の文脈はパウロたちの奉仕のあり方と真理の提示を扱う。本文の射程を保ち、霊感論・秘跡論・教会職論などを読み込まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「神のことば」「良心」「神の前で」など本文の荘重さを担う語は保持した。ギリシャ語の分詞が連なる長文は二文に分け、対比と論理関係を読み取りやすくした。
