    issue: 「恥となる隠れた事柄」
    rationale: τὰ κρυπτὰ τῆς αἰσχύνης は「恥を招く事柄」という未来的・結果的な意味ではなく、恥ずべき／恥に属する隠れた事柄を指す。「恥ずべき隠れた事柄」がより忠実で自然。
  - severity: low
    issue: 「すべての人の良心に」
    rationale: πρὸς は「～に対して」「～へ向けて」の方向性を示すため、「すべての人の良心に対して」とするほうが明確。
  - severity: low
    issue: 「自分たちを推薦している」
    rationale: 語義上は可能だが、日本語では不自然で自己宣伝の含みを帯びやすい。文脈上の「信頼に値する者として自らを示す」を自然に表すほうがよい。
