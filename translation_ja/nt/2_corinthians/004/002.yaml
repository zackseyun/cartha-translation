  to: むしろ私たちは、恥ずべき隠れた事柄を捨て去りました。悪賢く振る舞うことも、神のことばに不正な手を加えることもせず[a]、真理を明らかに示すことによって[b]、神の前で、すべての人の良心に対して自分たちが信頼に値することを示しています。
