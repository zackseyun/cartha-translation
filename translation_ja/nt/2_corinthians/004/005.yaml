id: 2CO.4.5
reference: 2 Corinthians 4:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἑαυτοὺς κηρύσσομεν ἀλλὰ ⸂Χριστὸν Ἰησοῦν⸃ κύριον, ἑαυτοὺς δὲ δούλους ὑμῶν διὰ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/005.yaml
  text: For we do not proclaim ourselves[a], but Messiah Jesus as Lord[c][b], and ourselves as your servants for Jesus' sake.
translation:
  language: ja
  text: 私たちは、自分自身を宣べ伝えているのではありません。そうではなく、メシアであるイエス[a]を主として宣べ伝え、また自分たちは、イエスのゆえに[c]あなたがたの奴隷[b]であると宣べ伝えているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエス」。ギリシア語の「クリストス」は、称号としては「メシア」、名前の一部のように用いられる場合は「キリスト」と訳すことができる。
    reason: lexical_alternative
  - marker: b
    text: または「しもべ」「仕える者」。ギリシア語は奴隷またはしもべを意味し得るが、ここではイエスが「主」であることとの対照を保つため「奴隷」とした。
    reason: lexical_alternative
  - marker: c
    text: または「イエスのために」「イエスのためを思って」。
    reason: translation_alternative
lexical_decisions:
- source_word: κηρύσσομεν
  choice: 宣べ伝えている
  rationale: 公に告げ知らせるというκηρύσσωの意味を保ちつつ、現代の聖書日本語として自然で格調のある表現とした。後半ではギリシア語で省略されている述語を日本語で補い、二つの対照的な宣言内容を明確にした。
- source_word: ἑαυτοὺς
  choice: 自分自身／自分たち
  rationale: 同じ再帰代名詞の反復を残し、宣教の内容として自分自身を掲げることと、コリントの人々に対する自分たちの立場を語ることとの対照を示した。
- source_word: Χριστὸν Ἰησοῦν
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての働きを明示しながら、日本語で自然にイエスという個人名へ結び付けた。
- source_word: κύριον
  choice: 主として
  rationale: κύριονを述語的に取り、イエスをどのような方として宣べ伝えるのかを表した。
- source_word: δούλους
  choice: 奴隷
  rationale: 「主」との意図的な対照、および強い従属関係を弱めずに伝えるため、より穏当な「しもべ」ではなく「奴隷」とした。
- source_word: ὑμῶν
  choice: あなたがたの
  rationale: 属格が表す、コリントの信徒たちに対する関係的な従属をそのまま示した。
- source_word: διὰ Ἰησοῦν
  choice: イエスのゆえに
  rationale: διά＋対格がここで示す理由・動機を簡潔に表し、彼らがこの立場にあるのはイエスのためであることを伝えた。
theological_decisions:
- issue: Χριστόςを称号として訳すか、名前の一部として訳すか
  choice: 称号として「メシアであるイエス」
  alternative: 「キリスト・イエス」
  rationale: この句は宣教内容を提示しており、Χριστόςの称号性が生きている。「メシアである」とすることで、日本語でもその機能を明確にした。
- issue: Χριστὸν Ἰησοῦν κύριονにおけるκύριονの働き
  choice: 「メシアであるイエスを主として」
  alternative: 「主であるメシア・イエスを」
  rationale: κύριονを述語的な補語と理解し、イエスが主であるという宣言を保ちつつ、原文にない独立した定形動詞を加えなかった。
- issue: δούλουςの強さ
  choice: 「奴隷」
  alternative: 「しもべ」または「仕える者」
  rationale: イエスが「主」であることとの緊張関係を保ち、パウロたちの徹底した自己卑下と従属を和らげないためである。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「宣べ伝える」「主」によって聖書本文としての格調を保った。原文後半の省略構文は、日本語で誤読されないよう「であると宣べ伝えている」を補ったが、前半との対照と「自分自身」の反復は維持した。
