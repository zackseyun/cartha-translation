id: 2CO.4.18
reference: 2 Corinthians 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ σκοπούντων ἡμῶν τὰ βλεπόμενα ἀλλὰ τὰ μὴ βλεπόμενα, τὰ γὰρ βλεπόμενα πρόσκαιρα, τὰ δὲ μὴ βλεπόμενα αἰώνια.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/018.yaml
  text: as we look not to the things that are seen but to the things that are not seen. For the things that are seen are temporary[a], but the things that are not seen are eternal.
translation:
  language: ja
  text: 私たちは、見えるものにではなく、見えないものに目を向けています。見えるものは一時的ですが、見えないものは永遠だからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκοπούντων
  choice: 目を向けています
  rationale: 単に視覚で見ることではなく、注意や関心を向ける意味を表す。現在分詞の継続的な含みと視覚的比喩を、自然な現代日本語で保った。
- source_word: τὰ βλεπόμενα
  choice: 見えるもの
  rationale: 実際に見られるもの、可視のものを指す中性複数の実詞的分詞。対句を簡潔に保ち、物質的なものと断定しない。
- source_word: τὰ μὴ βλεπόμενα
  choice: 見えないもの
  rationale: 否定を伴う実詞的分詞であり、「見えるもの」との形式的・修辞的な並行を保った。
- source_word: πρόσκαιρα
  choice: 一時的
  rationale: 限られた期間しか続かないことを表し、文脈上「永遠」と明瞭に対照される。「束の間」ほど期間を限定しない。
- source_word: αἰώνια
  choice: 永遠
  rationale: この対比では、来たるべき時代に属し、過ぎ去らずに存続することを表す。日本語として定着した簡潔な訳語を採用した。
- source_word: γὰρ
  choice: だからです
  rationale: 前の主張の理由・根拠を導く接続を、日本語で自然な文末表現として示した。
theological_decisions:
- issue: 見えるものと見えないものの対比
  choice: 「見えるもの」「見えないもの」という具体的な表現を維持する
  alternative: 「物質的なもの」「霊的なもの」と解釈して訳す
  rationale: 本文は可視と不可視を対比しているが、それを哲学的な物質／霊の二分法として明示してはいないため、原文の幅と神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「目を向けています」により、直前の節に続く属格絶対構文の状況的・継続的な働きを自然に表現した。対句では同じ語形を反復し、原文の均衡を保った。
