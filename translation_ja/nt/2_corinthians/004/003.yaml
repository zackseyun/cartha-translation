  text: And even if our gospel is veiled[a], it is veiled among those who are perishing,
translation:
  language: ja
  text: たとえ私たちの福音が覆われているとしても、それは滅びつつある人々に対しては覆われているのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「滅びつつある人々の間で覆われている」。ἐνは、人々との関係を表すとも、その人々の領域・範囲を表すとも理解できる。
    reason: ἐν τοῖς ἀπολλυμένοιςの関係的理解と領域的理解の両方を示し、本文では自然な日本語を用いつつ、原文の解釈上の幅を保存するため。
lexical_decisions:
- source_word: εἰ δὲ καὶ
  choice: たとえ〜としても
  rationale: 条件を伴う譲歩の意味を自然な現代日本語で表す。δέの継続・対照は文脈に含ませ、καίの強意は「たとえ」に反映した。
- source_word: κεκαλυμμένον
  choice: 覆いが掛かっている
  rationale: 完了受動分詞の結果状態を表し、直前の3章14～16節から続く「覆い」の比喩を保持する。「隠されている」よりも文脈上の比喩的連続性が明確である。
- source_word: τὸ εὐαγγέλιον ἡμῶν
  choice: 私たちの福音
  rationale: 属格ἡμῶνをそのまま保ち、εὐαγγέλιονには日本語聖書で定着し、簡潔で品位ある「福音」を用いた。
- source_word: ἐν τοῖς ἀπολλυμένοις
  choice: 滅びつつある人々の間で
  rationale: ἐνの領域・範囲を「間で」とし、現在分詞ἀπολλυμένοιςの進行的な状態を「滅びつつある」で表した。
- source_word: ἐστὶν κεκαλυμμένον
  choice: 覆いが掛かっているのです
  rationale: 原文の述語の反復を省略せず、強調を保つ。単純なコピュラと完了分詞を越えて「掛かったまま」とは解釈しなかった。
theological_decisions:
- issue: パウロの救済論的文脈におけるἀπολλυμένοιςの性質
  choice: 滅びつつある人々
  alternative: 滅びた人々／失われた人々
  rationale: 現在分詞が示す進行中の状態・過程を保ち、固定的な分類に早急に置き換えず、パウロの表現が持つ神学的緊張を残した。
- issue: ἐν τοῖς ἀπολλυμένοιςにおけるἐνの関係
  choice: 人々の間で
  alternative: 人々にとって
  rationale: 基本的な領域・範囲の意味を本文に採りつつ、文脈上可能な関係的な訳を脚注で示し、曖昧さを保存した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「覆いが掛かっている」を反復して原文の修辞を保ち、「滅びつつある」によって現在分詞の継続的ニュアンスを示した。
