  text: τὸ γὰρ παραυτίκα ἐλαφρὸν τῆς θλίψεως ⸀ἡμῶν καθ’ ὑπερβολὴν εἰς ὑπερβολὴν αἰώνιον βάρος δόξης κατεργάζεται ἡμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/017.yaml
  text: For our momentary light affliction is producing for us an eternal weight of glory beyond all comparison,[a]
translation:
  language: ja
  text: 私たちの一時的な軽い苦難は、比べようもなく大きい永遠の栄光の重みを、私たちのために生み出しているからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この上なく大きな」。ギリシア語は字義的には「度を越えて、さらに度を越えて」で、比べようもないほどの大きさを強調する表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραυτίκα
  choice: 今しばらくの
  rationale: 現在の短い期間に限られることを表し、後半の「永遠に続く」との対比を明確にする。
- source_word: ἐλαφρόν
  choice: 軽い
  rationale: 苦難を軽視する表現ではなく、後の βάρος（重み）との意図的な比喩的対照を保つ。
- source_word: θλίψεως
  choice: 苦難
  rationale: 圧迫、悩み、患難を含む語であり、現代日本語で自然かつ重みのある表現とした。
- source_word: καθ’ ὑπερβολὴν εἰς ὑπερβολήν
  choice: 比べようもないほど圧倒的な
  rationale: 字義どおりには不自然になる反復的な強意表現を、並外れた程度を示す自然な日本語で表した。比較を超えるという修辞的力も保持する。
- source_word: αἰώνιον
  choice: 永遠に続く
  rationale: 一時的な苦難との時間的対照を明瞭にし、βάροςを修飾する関係も日本語で自然に示す。
- source_word: βάρος δόξης
  choice: 栄光の重み
  rationale: 「軽い」との対照を保ちつつ、「栄光の重み」というパウロの印象的な名詞表現を平板化せずに残す。
- source_word: κατεργάζεται
  choice: もたらしている
  rationale: 現在進行する有効な働きと結果を自然に表す。苦難が救いを功績として獲得する、という意味までは加えない。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 利益・帰着を示す与格として理解し、内面的な形成だけに限定しかねない「私たちの内に」は避けた。
theological_decisions:
- issue: 苦難と栄光の因果関係
  choice: 現在の苦難が、信じる者たちのために永遠の栄光をもたらしているという本文の強い結び付きをそのまま示す。
  alternative: 苦難が人間の功績として栄光を獲得する、または現在の人格的成長だけを生み出すと限定する。
  rationale: κατεργάζεται は結果を生じさせる働きを表すが、その仕組みや功績性を本文は説明していない。したがって、終末的な対比を保ちながら、本文を超える教理的説明は訳文に加えない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「軽い」と「重み」、「今しばらく」と「永遠に続く」という二重の対照を保持した。「栄光の重み」は比喩の力と神学的含意を残すため名詞句のままとした。
