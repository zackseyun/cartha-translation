  yaml_path: translation/nt/2_corinthians/004/008.yaml
  text: We are afflicted in every way[a], but not crushed; perplexed[c][b], but not driven to despair.
translation:
  language: ja
  text: 私たちは、あらゆる面で苦しめられても、窮地に追い込まれず、途方に暮れても、完全に途方に暮れ果てることはありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「完全に途方に暮れ果てることはありません」は、「絶望に追い込まれることはありません」とも訳せる。原文では、「途方に暮れる」に当たる語を強めた語が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν παντί
  choice: あらゆることで
  rationale: 包括的な範囲を表す句として自然な現代日本語にした。「四方から」のような空間的意味に限定しない。
- source_word: θλιβόμενοι
  choice: 苦しめられても
  rationale: 外から圧迫や苦難を受けるという受動的な意味を明確にし、後続の「押しつぶされず」との対照を保つ。
- source_word: στενοχωρούμενοι
  choice: 押しつぶされず
  rationale: 文字どおりには狭い所に追い込まれるイメージを持つが、ここでは圧迫されても潰されないという対句の力を自然な日本語で表した。
- source_word: ἀπορούμενοι
  choice: 途方に暮れても
  rationale: どうすべきか分からず、道を見失う状態を簡潔で一般的な日本語として表す。
- source_word: ἐξαπορούμενοι
  choice: 絶望しません
  rationale: ἀπορέωを強めた語であるため、先の「途方に暮れる」より深刻な、完全に望みや出口を失う状態を否定する表現とした。
- source_word: ἀλλ’ οὐ ... ἀλλ’ οὐκ
  choice: …ても、…ず、…ても、…ません
  rationale: ギリシア語の反復される対照を、日本語として流れのよい譲歩と否定の並行構造で再現した。
theological_decisions:
- issue: 第二の分詞対における強意の程度
  choice: ἀπορούμενοιを「途方に暮れても」、ἐξαπορούμενοιを「絶望しません」と訳し、意味の強まりを示す。
  alternative: 後者を「完全に途方に暮れることはありません」とし、同じ語根の反復をより明示する。
  rationale: 本文は使徒的苦難のただ中で出口を完全には失わないことを述べている。特定の心理状態や信仰喪失についての教理的断定にはせず、語の強意と修辞的対照を自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語。苦難を受けることと、それによって完全に打ち倒されることとの対照を、簡潔で格調を保った並行表現にした。
