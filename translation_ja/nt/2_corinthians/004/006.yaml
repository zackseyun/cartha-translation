- from: 「闇から光が輝き出る」と言われた神[a]が、キリスト[b]の顔[c]にある神の栄光を知る知識を照らし出すため、私たちの心の中で光を放ってくださったからです。
  to: なぜなら、「闇から光が輝き出る」と言われた神が、私たちの心の中で輝いてくださったからです。それは、メシアの顔にある神の栄光についての知識を明らかにするためです。
  rationale: 本文の脚注アンカーは、「闇から光が輝き出る」[a]、「メシア」[b]、「顔」[c]とします。これにより各脚注の対象が明確になります。「なぜなら」はὅτιの因果的用法を自然に反映します。「私たちの心の中で輝いてくださった」はἔλαμψενを非使役的に保ちます。「神の栄光についての知識を明らかにする」はπρὸς φωτισμὸν τῆς γνώσεωςを、過度に解釈せず自然な日本語で表します。
