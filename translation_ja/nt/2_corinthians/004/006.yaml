id: 2CO.4.6
reference: 2 Corinthians 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ὁ θεὸς ὁ εἰπών· Ἐκ σκότους φῶς ⸀λάμψει, ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν πρὸς φωτισμὸν τῆς γνώσεως τῆς δόξης τοῦ θεοῦ ἐν προσώπῳ ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/006.yaml
  text: For God[a], who said[c][b], “Light will shine out of darkness,” has shone in our hearts for the illumination of the knowledge of the glory of God in the face of Messiah.
translation:
  language: ja
  text: なぜなら、「闇から光が輝き出る」と言われた神が、私たちの心の中で輝いてくださったからです。それは、メシアの顔にある神の栄光についての知識を明らかにするためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前の主張の根拠を示す因果関係として、文末で自然に表した。
- source_word: Ἐκ σκότους φῶς λάμψει
  choice: 闇から光が輝き出る
  rationale: ἐκの起点と、未来形λάμψειの陳述を保ち、創造の光を想起させる表現とした。
- source_word: ὃς ἔλαμψεν ἐν ταῖς καρδίαις ἡμῶν
  choice: 私たちの心の中で光を放ってくださった
  rationale: ἔλαμψενを使役表現にせず、神ご自身が心の内で輝くという能動的な光の比喩を保った。敬語は神を主語とする自然で品位ある日本語のため。
- source_word: πρὸς φωτισμὸν τῆς γνώσεως
  choice: 知る知識を照らし出すため
  rationale: 目的を示すπρόςと、φωτισμόςの照明・明示の比喩、およびγνῶσιςの名詞性をできるだけ保った。
- source_word: τῆς δόξης τοῦ θεοῦ
  choice: 神の栄光
  rationale: 属格関係を簡潔かつ自然に保持した。
- source_word: ἐν προσώπῳ Χριστοῦ
  choice: キリストの顔にある
  rationale: πρόσωπονの具体的な「顔」という像を保ち、光と栄光の文脈に結びつけた。Χριστόςは日本語で定着した称号「キリスト」とした。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςは称号だが、現代日本語の聖書・一般用法では「キリスト」が称号としても定着しており、自然さと原語対応を両立する。「メシア」も語義を明示する可能な訳である。
- issue: ἐν προσώπῳ Χριστοῦの意味
  choice: キリストの顔にある
  alternative: キリストという方において
  rationale: 光と栄光という直前の像に照らして「顔」の具体性を本文に残した。一方、πρόσωπονは人・人格を指す広い意味にも理解できるため、別解を脚注に示した。
- issue: φωτισμὸν τῆς γνώσεωςの属格関係
  choice: 知識を照らし出す
  alternative: 知識という光を与える
  rationale: 属格が何を厳密に表すかを過度に固定せず、知識と照明の結びつきを保持した。代案は同格的な理解をより明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の創造の言葉、心の内で輝く光、キリストの顔に現れる栄光という連続した比喩を保持した。「知る知識」は通常の会話よりやや凝縮された表現だが、原文のγνῶσιςを消さず、聖書本文としての品位を保つため採用した。
