  source_fidelity: 要修正です。現行の「知る知識を照らし出す」は不自然であるだけでなく、φωτισμὸν τῆς γνώσεως（「知識の照明／知識を明らかにすること」）を適切に表していません。また、「キリストの顔にある神の栄光を知る知識」という係り方は重く曖昧です。本文ではπρόσωπονの具体的な像を保ちつつ、知識と照明の関係を自然に示す必要があります。
  naturalness: 「知る知識」は現代標準日本語として不自然です。「心の中で光を放ってくださった」も意味は通りますが、「神が…光を放つ」はやや説明調で、原文の「輝いた」を素直に訳すほうがよいです。「なぜなら」で因果関係を明示し、二文に分けると明瞭です。
  terminology: プロジェクト方針および英語POBの判断に合わせ、Χριστοῦは本文で「メシア」とします。πρόσωπονは本文では「顔」とし、より慣用的な「キリストという方において」は脚注に代案として残します。
