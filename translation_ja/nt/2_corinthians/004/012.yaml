  text: ὥστε ⸀ὁ θάνατος ἐν ἡμῖν ἐνεργεῖται, ἡ δὲ ζωὴ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/012.yaml
  text: So then[a], death is at work in us, but life in you.
translation:
  language: ja
  text: ですから、死は私たちの中で働いていますが、いのちはあなたがたの中で働いています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: こうして
  rationale: 直前の8～11節から導かれる結果・帰結を、現代日本語で自然に示す。目的を表す「～するために」とは解さず、推論的なつながりを保った。
- source_word: ὁ θάνατος
  choice: 死
  rationale: 冠詞を機械的に訳さず、使徒たちの苦難の中で作用する現実として、原文の簡潔で広い意味を保った。
- source_word: ἐν ἡμῖν
  choice: 私たちのうちに
  rationale: 使徒たちとコリントの信徒たちとの対比を明瞭にしつつ、身体的・人格的な含みを保持する。
- source_word: ἐνεργεῖται
  choice: 働いています／働いている
  rationale: 現在形の継続的で有効な作用を、自然な日本語で表した。後半では原文上省略された動詞を意味上補った。
- source_word: ἡ δὲ ζωὴ
  choice: しかし、いのち
  rationale: δέの対照を「が」で示し、「死」と「いのち」の緊張を解釈的に狭めず保持した。「いのち」は聖書文脈で身体的・霊的な響きをともに担える表記である。
- source_word: ἐν ὑμῖν
  choice: あなたがたのうちに
  rationale: ἐν ἡμῖνとの平行を保ち、個人的意味と共同体的意味の双方を残した。
theological_decisions:
- issue: 「死」と「いのち」の対比の意味
  choice: 使徒たちの苦難において働く死と、その奉仕を通してコリントの信徒たちに働くいのちとの対比を、具体的内容を限定せずそのまま表す。
  alternative: 「死」を肉体的死だけ、または自己否定だけに限定し、「いのち」を肉体的保全だけ、または永遠のいのちだけに限定する。
  rationale: 直前の文脈はイエスの死といのちが使徒たちの体に現れることを語り、同時に彼らの奉仕が他者にいのちをもたらすことを示すため、原文の神学的な重なりを維持した。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも耐える文体とした。「私たち／あなたがた」で複数の対比を明示し、「死／いのち」の簡潔な対句を保った。
