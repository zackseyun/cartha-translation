id: 2CO.4.14
reference: 2 Corinthians 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδότες ὅτι ὁ ἐγείρας ⸀τὸν Ἰησοῦν καὶ ἡμᾶς ⸀σὺν Ἰησοῦ ἐγερεῖ καὶ παραστήσει σὺν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/004/014.yaml
  text: because we know that the one who raised Jesus will also raise us with Jesus and will present us with you[a].
translation:
  language: ja
  text: 私たちは、イエスをよみがえらせた方が、私たちをもイエスとともによみがえらせ、あなたがたとともに立たせてくださることを知っているからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「イエス」の代わりに「主イエス」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: εἰδότες
  choice: 知っているからです
  rationale: 分詞は文脈上、苦難の中でも語り続ける根拠を示すため、現代日本語では因果関係を明示する「知っているからです」とした。前節から続く構文であることも保つ。
- source_word: ὁ ἐγείρας
  choice: よみがえらせた方
  rationale: 神を指す冠詞付きアオリスト分詞を、尊敬を含みつつ自然な日本語で表した。
- source_word: τὸν Ἰησοῦν
  choice: イエス
  rationale: 提示されたSBLGNT本文の読みをそのまま採用した。異読「主イエス」は脚注に示す。
- source_word: καὶ ἡμᾶς
  choice: 私たちをも……よみがえらせ
  rationale: καίの付加的意味を助詞「も」で表し、イエスの復活と信徒の将来の復活との対応を明確にした。
- source_word: σὺν Ἰησοῦ
  choice: イエスとともに
  rationale: σύνの結合・同伴の意味を保持した。「イエスによって」という手段の意味にはしなかった。
- source_word: παραστήσει
  choice: 御前に立たせてくださる
  rationale: 「立たせる、提示する」という語義を自然な日本語にし、終末的に神の前へ立たせる含意を表した。ただし裁きの場などとは限定しない。
- source_word: σὺν ὑμῖν
  choice: あなたがたとともに
  rationale: パウロたちとコリントの信徒が共にされるという共同体的な意味を、σύνに即して明示した。
theological_decisions:
- issue: ἐγείραςの後の本文異読
  choice: 本文ではSBLGNTに従い「イエス」とする。
  alternative: 「主イエス」
  rationale: これは教理上の相違ではなく本文上の異読である。底本を本文に採り、よく証言される長い読みは脚注に残す。
- issue: παραστήσειの終末論的意味
  choice: 復活の後、パウロたちとコリントの信徒をともに神の御前に立たせることとして訳す。
  alternative: 一般的な弁護・承認、またはキリストの裁きの座への提示と明示する。
  rationale: 文脈は将来の復活と終末的な提示を示唆するが、ギリシア語はその具体的な場面や相手を明記していないため、「御前」としつつ裁きの座などに限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「よみがえる」は聖書文脈で広く理解される表現として用いた。「御前に立たせる」によりπαρίστημιの具体性を保ち、単なる抽象的な「示す」より自然にした。
