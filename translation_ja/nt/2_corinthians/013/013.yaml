reference: 2 Corinthians 13:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ χάρις τοῦ κυρίου Ἰησοῦ Χριστοῦ καὶ ἡ ἀγάπη τοῦ θεοῦ καὶ ἡ κοινωνία τοῦ ἁγίου πνεύματος μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/013.yaml
  text: The grace of the Lord Jesus Christ[a], and the love of God, and the fellowship of the Holy Spirit[b], be with all of you.
translation:
  language: ja
  text: 主イエス・メシアの恵み[a]、神の愛、聖霊の交わり[b]が、あなたがたすべてと共にありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「主イエス・キリストの恵み」。
    reason: alternative_reading
  - marker: b
    text: または「聖霊との交わり」「聖霊にあずかること」。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロの祝福の言葉として定着しており、神から与えられる好意と賜物という語の重みを自然に保つ。
- source_word: κυρίου
  choice: 主
  rationale: ここではイエスに用いられる称号であり、現代日本語の聖書用語として自然で荘重な「主」が適切。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςを単なる固有名の一部ではなく称号として示すため、「メシア」を本文に置く。日本語で伝統的な「イエス・キリスト」も脚注に残す。
- source_word: ἀγάπη
  choice: 愛
  rationale: 意味を過不足なく伝える、自然で標準的な訳語。
- source_word: θεοῦ
  choice: 神の
  rationale: 属格の幅を保ち、「神が示す愛」などと本文で一義的に限定しない。
- source_word: κοινωνία
  choice: 交わり
  rationale: 共同の関係と参与の両面を含み得る、日本語として定着した広がりのある訳語。別の解釈可能性は脚注に示す。
- source_word: ἁγίου πνεύματος
  choice: 聖霊
  rationale: 現代日本語で、ここに記される神の霊を表す標準的な訳語。
- source_word: μετὰ πάντων ὑμῶν
  choice: あなたがたすべてと共にありますように
  rationale: μετάの同伴・臨在の意味と、πάντωνによる明示的な包括性を保つ。ギリシア語で省略された願望的な動詞を、日本語の祝福表現として自然に補った。
theological_decisions:
- issue: キリスト論的称号Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςがイエスに付された称号であることを読者に意識させるため本文では「メシア」とし、広く定着した伝統的表現は脚注に残した。
- issue: κοινωνία τοῦ ἁγίου πνεύματοςの意味
  choice: 聖霊の交わり
  alternative: 聖霊との交わり／聖霊への参与／聖霊による交わり
  rationale: 属格は、聖霊との交わり、聖霊への参与、または聖霊が生み出す交わりなどを含み得る。「聖霊の交わり」はその神学的な幅を狭めずに保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祝福の言葉にふさわしい荘重さを保った。三つの名詞句の並列を簡潔に再現し、文末の「ありますように」で原文の祝祷としての機能を自然に表した。
