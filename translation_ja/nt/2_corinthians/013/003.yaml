id: 2CO.13.3
reference: 2 Corinthians 13:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπεὶ δοκιμὴν ζητεῖτε τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ· ὃς εἰς ὑμᾶς οὐκ ἀσθενεῖ ἀλλὰ δυνατεῖ ἐν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/003.yaml
  text: since you are seeking proof that Messiah is speaking in me—he is not weak toward you[a], but is powerful in you[b],
translation:
  language: ja
  text: あなたがたは、キリストが私のうちで語っておられる証拠を求めているのですから[a]――キリストは、あなたがたに対して弱いのではなく、あなたがたのうちで力を現しておられます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリストが私を通して語っておられる証拠」。原文は直訳すると「私のうちで語っておられるキリストの証拠」。
    reason: ἐν ἐμοίの媒介的意味と内在的意味の両方を残すため。
  - marker: b
    text: 直訳に近くは「あなたがたのうちで力ある方です」。また、「あなたがたの間で力を現しておられます」とも訳せる。
    reason: δυνατεῖの状態的・動作的な含みと、ἐν ὑμῖνの内面的・共同体的な幅を示すため。
lexical_decisions:
- source_word: ἐπεὶ
  choice: 〜のですから
  rationale: 前後の文脈に対する理由を示す接続表現として因果関係を保ち、現代日本語として自然にした。
- source_word: δοκιμήν
  choice: 証拠
  rationale: ここでは試験の行為よりも、真正さや権威を確証するものを指すため。
- source_word: ζητεῖτε
  choice: 求めている
  rationale: 現在形が示す継続中の要求を自然に表した。
- source_word: τοῦ ἐν ἐμοὶ λαλοῦντος Χριστοῦ
  choice: キリストが私のうちで語っておられる
  rationale: 属格分詞構文を日本語の内容節として表し、ἐν ἐμοίを解釈的な「私を通して」へ限定せず「私のうちで」とした。
- source_word: Χριστοῦ
  choice: キリスト
  rationale: 日本語聖書語として定着した称号を用い、パウロ書簡の自然な語調を保った。
- source_word: εἰς ὑμᾶς
  choice: あなたがたに対して
  rationale: コリントの人々に向けられる関係的・方向的意味を明示した。
- source_word: οὐκ ἀσθενεῖ
  choice: 弱いのではなく
  rationale: 周辺文脈にある弱さと力の対照を直接保った。
- source_word: ἀλλὰ δυνατεῖ ἐν ὑμῖν
  choice: あなたがたのうちで力を現しておられます
  rationale: 稀な動詞 δυνατέω の能動的な力の働きを自然な日本語で表し、ἐν ὑμῖνの領域も保持した。
theological_decisions:
- issue: ἐν ἐμοίが示すキリストとパウロの関係
  choice: 私のうちで語っておられる
  alternative: 私を通して語っておられる
  rationale: 「通して」はキリストの媒介的発言を明瞭にするが、原文のἐνが含み得る内在・臨在の含意を狭めるため、本文ではより形式的な表現を採った。
- issue: ἐν ὑμῖνの範囲
  choice: あなたがたのうちで
  alternative: あなたがたの間で／あなたがた一人一人の内で
  rationale: 共同体のただ中での働きと信徒の内面的な働きのどちらにも限定せず、原文の複数形にある幅を保った。
- issue: ἀσθενεῖとδυνατεῖの対照
  choice: 弱いのではなく、力を現しておられます
  alternative: 無力なのではなく、力ある方です
  rationale: 存在上の属性だけに限定せず、コリントの人々に対して実際に働くキリストの力を示しつつ、弱さと力の神学的対照を維持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、キリストへの敬意を表す尊敬表現を採用した。因果節が前文につながる構造は「〜のですから」と長いダッシュで示した。「私のうち」「あなたがたのうち」はやや聖書的だが、原文の曖昧さを保つため許容した。
