id: 2CO.13.11
reference: 2 Corinthians 13:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λοιπόν, ἀδελφοί, χαίρετε, καταρτίζεσθε, παρακαλεῖσθε, τὸ αὐτὸ φρονεῖτε, εἰρηνεύετε, καὶ ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης ἔσται μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/011.yaml
  text: Finally[a], brothers, rejoice, be restored, be encouraged, think the same thing, live in peace[e][d][c][b], and the God of love and peace will be with you.
translation:
  language: ja
  text: 最後に、兄弟たち[b]、喜びなさい[a]。自分たちを整えなさい[c]。励ましを受けなさい[d]。同じ思いを持ち[e]、互いに平和に過ごしなさい。そして、愛と平和の神があなたがたと共にいてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別れの挨拶として「ごきげんよう」とも訳せる。ここでは一連の勧告が続くため、「喜びなさい」の意味に取った。
    reason: lexical_alternative
  - marker: b
    text: ここでの「兄弟たち」は会衆全体への呼びかけであり、女性も含むと考えられる。
    reason: cultural_note
  - marker: c
    text: 「完全なものとされなさい」「回復されなさい」「整えられなさい」とも訳せる。
    reason: lexical_alternative
  - marker: d
    text: 「慰めを受けなさい」または「勧めを受け入れなさい」とも訳せる。
    reason: lexical_alternative
  - marker: e
    text: 直訳すると「同じことを考えなさい」。すなわち、思いを一つにすること。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λοιπόν
  choice: 最後に
  rationale: 手紙の結びへ移る談話標識として、現代日本語で自然かつ簡潔に表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 文法上の男性複数形を保った呼びかけ。会衆全体を指す含意は脚注で明示した。
- source_word: χαίρετε
  choice: 喜びなさい
  rationale: 別れの挨拶とも取れるが、ここでは命令が連続しているため、勧告としての意味を採った。
- source_word: καταρτίζεσθε
  choice: 立て直されなさい
  rationale: 壊れたものを整え、正しい状態へ回復させる語義と受動・中動形の響きを保ち、完全無欠になるという過剰な含意を避けた。
- source_word: παρακαλεῖσθε
  choice: 励ましを受けなさい
  rationale: 受動・中動形を踏まえ、励ましや勧めを受けるよう促す意味を自然な日本語で表した。
- source_word: τὸ αὐτὸ φρονεῖτε
  choice: 同じ思いを持ち
  rationale: 直訳的な『同じことを考える』の意味を保ちつつ、共同体の一致を示す自然な表現とした。
- source_word: εἰρηνεύετε
  choice: 平和に暮らしなさい
  rationale: 現在命令形が求める継続的な平和の実践を表した。
- source_word: ὁ θεὸς τῆς ἀγάπης καὶ εἰρήνης
  choice: 愛と平和の神
  rationale: 属格表現を簡潔に保ち、神が愛と平和によって特徴づけられることを示した。
- source_word: ἔσται μεθ’ ὑμῶν
  choice: あなたがたと共にいてくださいます
  rationale: 未来の約束を、敬意を保った自然な現代日本語で表した。
theological_decisions:
- issue: 会衆への呼びかけにおけるἀδελφοίの包括的用法
  choice: 本文では「兄弟たち」とし、女性も含む会衆全体への呼びかけであることを脚注に記す。
  alternative: 「兄弟姉妹たち」または「きょうだいたち」
  rationale: 原語の男性複数形を本文に保ちながら、パウロが会衆全体に語っている文脈上の包括性も失わないため。
- issue: 勧告列と神の臨在の約束との論理関係
  choice: 「そうすれば」で勧告に続く約束として表す。
  alternative: 「そして」と単純に並列する。
  rationale: ギリシア語のκαί自体は単純な接続でもあり得るが、連続する命令の後に未来形の約束が置かれる構造は結果的・応答的なつながりを自然に示す。ただし明示的な条件文ではないため、教理的な功績条件とは解さない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。短い命令を重ねる原文の修辞を、日本語でも区切りのよい文として再現した。「いてくださいます」により神への敬意を自然に示した。
