reference: 2 Corinthians 13:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προείρηκα καὶ προλέγω ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν ⸀νῦν, τοῖς προημαρτηκόσιν καὶ τοῖς λοιποῖς πᾶσιν, ὅτι ἐὰν ἔλθω εἰς τὸ πάλιν οὐ φείσομαι,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/002.yaml
  text: I have said before[a], and I say beforehand now while absent, as when present the second time, to those who sinned previously and to all the rest, that if I come again, I will not spare them.
translation:
  language: ja
  text: 私は前にも言いました。そして、二度目にそちらにいた時と同じように、今は離れていながら、前に罪を犯した人たちと、ほかのすべての人たちに、前もって言います。再びそちらへ行くなら[a]、容赦しません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私が三度目にそちらへ行くなら」。ギリシア語は字義的には「私が再び行くなら」だが、パウロの訪問についての文脈から、二度目に続くもう一度の訪問を指すと考えられる。
    reason: 文脈に基づく別訳を示しつつ、本文では原文の表現を保持するため。
lexical_decisions:
- source_word: προείρηκα
  choice: 以前にも言っておきました
  rationale: 完了形が示す、過去に述べたことの現在まで続く効力を表す。「警告した」とまでは訳し込まず、文脈上の警告性を保った。
- source_word: προλέγω
  choice: あらかじめ言っておきます
  rationale: 「前もって言う」という語義を自然な現代日本語で表し、προείρηκαとの語彙的なつながりも保った。
- source_word: ὡς παρὼν τὸ δεύτερον καὶ ἀπὼν νῦν
  choice: 二度目にそちらにいた時に言ったのと同じように、今、離れている間にも
  rationale: 圧縮されたギリシア語表現を補って、二度目の滞在時と現在の不在時との対応を明確にした。
- source_word: τοῖς προημαρτηκόσιν
  choice: 前に罪を犯した人たち
  rationale: 以前の罪が念頭にあることを示しつつ、その後の悔い改めの有無については断定しない。
- source_word: τοῖς λοιποῖς πᾶσιν
  choice: ほかのすべての人たち
  rationale: 先に挙げた人々以外も含む包括的な表現を保った。
- source_word: ἐὰν ἔλθω εἰς τὸ πάλιν
  choice: 私が再びそちらへ行くなら
  rationale: 字義的な「再び行く」を本文に残し、「三度目」とする文脈上の解釈は脚注に示した。
- source_word: οὐ φείσομαι
  choice: 容赦しません
  rationale: 厳しい処置を差し控えないという意味を簡潔に表す。原文に明示されない目的語や具体的な処分内容は補わなかった。
theological_decisions:
- issue: パウロの厳しい警告が及ぶ範囲
  choice: 以前に罪を犯した人々と、ほかのすべての人々の双方を警告の受け手として示す
  alternative: 以前に罪を犯した人々だけを、容赦しない対象と明示する
  rationale: 与格句は両群を発言の受け手として並べる一方、「容赦しない」の目的語は原文で明示されない。そのため対象を狭く限定せず、教会規律の具体的形態も訳文に持ち込まなかった。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。反復する「言う」を意識的に残しつつ、「言っておく」によって事前通告の含意を自然に表した。
