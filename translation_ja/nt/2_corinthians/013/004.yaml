source:
  edition: SBLGNT
  text: καὶ ⸀γὰρ ἐσταυρώθη ἐξ ἀσθενείας, ἀλλὰ ζῇ ἐκ δυνάμεως θεοῦ. καὶ γὰρ ἡμεῖς ἀσθενοῦμεν ἐν αὐτῷ, ἀλλὰ ⸀ζήσομεν σὺν αὐτῷ ἐκ δυνάμεως θεοῦ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/004.yaml
  text: For indeed he was crucified in weakness[a], but he lives by the power of God. For indeed we are weak in him[d][c][b], but we will live with him by the power of God toward you.
translation:
  language: ja
  text: 実際、キリストは弱さのうちに[a]十字架につけられましたが、神の力によって生きておられます。実際、私たちもキリストにあって弱いのですが、あなたがたに対して[b]、神の力によって[c]キリストとともに生きることになります[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「弱さから」。ギリシア語のἐξは起点や根拠を表し得ます。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたのために」または「あなたがたの間で」とも訳せます。ギリシア語のεἰς ὑμᾶςは、方向、関係、または作用の及ぶ先を表し得ます。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「神の力から」。ギリシア語のἐκは前半の「弱さのうちに」に対応して繰り返され、弱さと神の力との対照を示しています。
    reason: lexical_alternative
  - marker: d
    text: 「キリストとともに生きる」は、パウロたちがコリントの人々に対して神の力による生を示すことを指す可能性がある一方、より広く復活の命をも響かせている可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξ ἀσθενείας
  choice: 弱さのうちに
  rationale: ἐξは字義的には起点・根拠を表し得るが、ここでは十字架刑において現れた弱さというあり方を自然な日本語で示す。「弱さのゆえに」では原因を強く断定しすぎるため避けた。
- source_word: ἐκ δυνάμεως θεοῦ
  choice: 神の力によって
  rationale: 神の力を生の源・根拠として示す句。日本語では手段にも源にも無理なく読める「によって」が自然である。原文では前句と同じἐκが反復され、弱さと神の力が対照されている。
- source_word: ἐν αὐτῷ
  choice: キリストにあって
  rationale: パウロの簡潔なキリストとの結びつきの表現を保ちつつ、代名詞の指示対象を日本語で明確にした。
- source_word: ζήσομεν σὺν αὐτῷ
  choice: キリストとともに生きることになります
  rationale: 未来形を保持し、現在の使徒的働きだけにも終末の復活だけにも限定しない表現とした。
- source_word: εἰς ὑμᾶς
  choice: あなたがたに対して
  rationale: 方向・関係・作用を含み得る圧縮された表現なので、直接の文脈に合い、意味を限定しすぎない訳を選んだ。
theological_decisions:
- issue: 十字架刑におけるキリストの「弱さ」
  choice: 十字架刑において現れた弱さという逆説を、そのまま「弱さのうちに」と表した。
  alternative: 「弱さのゆえに」として原因・根拠を前面に出す。
  rationale: 本文は弱さと神の力を対照しているが、その弱さの性質を詳しく定義してはいない。キリストの本性について本文以上の説明を訳文に加えず、逆説を保持した。
- issue: 「キリストとともに生きる」の指示内容
  choice: コリントの人々に対して現される神の力による使徒的な生を念頭に置きつつ、より広い復活の命との響きも残した。
  alternative: 終末の復活だけ、または現在の使徒的働きだけを指すと限定する。
  rationale: 直後の「あなたがたに対して」は使徒的働きとの関連を示す一方、キリストとともに生きるという表現は復活の命をも想起させるため、訳文ではその緊張を解消しない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「生きておられます」でキリストへの自然な敬意を示し、後半の未来形は「生きることになります」として保持した。原文の二度のκαὶ γὰρは、日本語で過度に重くならないよう冒頭を「実際」、後半を「も」で表した。
