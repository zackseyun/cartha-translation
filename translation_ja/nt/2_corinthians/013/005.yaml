id: 2CO.13.5
reference: 2 Corinthians 13:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἑαυτοὺς πειράζετε εἰ ἐστὲ ἐν τῇ πίστει, ἑαυτοὺς δοκιμάζετε· ἢ οὐκ ἐπιγινώσκετε ἑαυτοὺς ὅτι ⸂Ἰησοῦς Χριστὸς⸃ ἐν ⸀ὑμῖν; εἰ μήτι ἀδόκιμοί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/005.yaml
  text: Test yourselves to see whether you are in the faith[a]; examine yourselves[c][b]. Or do you not recognize that Jesus the Messiah is in you?—unless indeed you are disqualified.
translation:
  language: ja
  text: 自分自身を試して、信仰のうちにいるかどうかを確かめなさい[a]。自分自身を吟味しなさい。あなたがた自身は、イエス・キリストがあなたがたのうちにおられることを分かっていないのですか[b]。もっとも、あなたがたが失格者である場合は別です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰のうちに」は、キリスト教信仰にとどまっていること、または真正な信仰を持っていることを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたのうちに」は、「あなたがたの間に」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: πειράζετε
  choice: 吟味して
  rationale: ここでは「誘惑する」ではなく、真実であるかを調べる自己検証を命じている。「吟味する」は評価を伴う検査の意味を自然に表す。
- source_word: ἐν τῇ πίστει
  choice: 信仰のうちに
  rationale: 定冠詞を伴う表現の明確さを保ち、キリスト教信仰の領域にあることと、真正な信仰を持つことの両方に開かれた言い方とした。
- source_word: δοκιμάζετε
  choice: 試しなさい
  rationale: πειράζετεと近義だが、検査を経て適格性を確かめる含みがある。日本語では二つの命令を「吟味する」「試す」と訳し分けた。
- source_word: ἐπιγινώσκετε
  choice: 自覚していないのですか
  rationale: 単なる知識より、十分に認識する、悟るという修辞疑問の力を表す。再帰代名詞の意味も「自分たちのうちに」によって自然に保持した。
- source_word: Ἰησοῦς Χριστός
  choice: イエス・キリスト
  rationale: 現代日本語では「イエス・キリスト」が定着した、なお称号性を帯びる表現であり、原文の人名・称号の組み合わせを簡潔に保つ。
- source_word: ἐν ὑμῖν
  choice: 自分たちのうちに
  rationale: 複数の「あなたがた」に対する内在を第一義として訳した。共同体の「間に」という可能性は脚注に示す。
- source_word: εἰ μήτι
  choice: もっとも、…なら別ですが
  rationale: 例外を示しつつ、わずかな留保または皮肉を帯びる修辞的な調子を現代日本語で表した。
- source_word: ἀδόκιμοι
  choice: 失格者
  rationale: 試験に耐えず、適格と認められないという直前の検証語彙との対照を保持し、後代の教理的含意を不用意に持ち込まない。
theological_decisions:
- issue: ἐν τῇ πίστει の意味
  choice: 「信仰のうちに」として、キリスト教信仰の領域にある意味を前面に出しつつ曖昧さを保持
  alternative: 真正な個人的信仰を持っている
  rationale: 原文は共同体が告白する信仰と個人の真正な信仰のどちらにも響きうるため、一方に限定しない。
- issue: ἐν ὑμῖν の範囲
  choice: あなたがた一人一人／全体の内におられる
  alternative: あなたがたの間におられる
  rationale: 自己吟味という文脈は内在の意味を支持するが、複数代名詞とἐνには共同体的な「間に」も可能なので脚注に残す。
- issue: Χριστός の表記
  choice: キリスト
  alternative: メシア
  rationale: 日本語では「イエス・キリスト」が自然で広く理解される一方、「キリスト」は本来「メシア」を意味する称号であることを脚注で補う。
- issue: ἀδόκιμοι の神学的含意
  choice: 失格者
  alternative: 不適格な者／試験に耐えない者
  rationale: 永遠の遺棄など特定の教理を断定せず、この箇所の試験・吟味の比喩に沿って訳す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。二つの自己検証命令を近義語で訳し分け、修辞疑問と末尾の留保を自然に表現した。脚注記号は本文中にすべて配置した。
