lexical_decisions:
- source_word: ἐλπίζω
  choice: 私は望んでいます
  rationale: 現在直説法一人称単数の通常の意味を保ち、将来に向けたパウロの期待を自然な現代日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の節で述べられた「不適格と見なされる」可能性との穏やかな対照を示す。
- source_word: γνώσεσθε
  choice: あなたがたは知るようになる
  rationale: 未来形が示す将来の認識を表す。「分かるでしょう」も可能だが、原文の未来的な到達点を明示した。
- source_word: ἡμεῖς
  choice: 私たち
  rationale: 明示された代名詞を訳出し、パウロとその同労者たちを指す複数形を保った。
- source_word: οὐκ ἐσμὲν
  choice: ではない
  rationale: 単純な否定の連結表現として、強調を加えずに訳した。
- source_word: ἀδόκιμοι
  choice: 不適格
  rationale: 試験や吟味を経て承認されないという文脈上の評価を、神学的に過度な含意を持ち込まず、明瞭な現代日本語で表す。
theological_decisions:
- issue: 吟味と使徒的正当性の文脈におけるἀδόκιμοιの訳
  choice: 不適格ではない
  alternative: 承認されていないのではない／試験に落ちた者ではない／退けられた者ではない
  rationale: 周辺文脈の試す・吟味するという語義的連関を保ちつつ、後代の教理的意味を帯びやすい表現を避けた。「不適格」は評価に耐えないという意味を簡潔に伝えるが、その具体的な判定内容は限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「知るようになる」は原文の未来形を保つためやや形式対応寄りとし、ἀδόκιμοιの試験・吟味の比喩は本文と脚注を合わせて伝えた。
