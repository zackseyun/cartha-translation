source:
  edition: SBLGNT
  text: χαίρομεν γὰρ ὅταν ἡμεῖς ἀσθενῶμεν, ὑμεῖς δὲ δυνατοὶ ἦτε· ⸀τοῦτο καὶ εὐχόμεθα, τὴν ὑμῶν κατάρτισιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/009.yaml
  text: 'For we rejoice when we are weak and you are strong[a]. And this also is what we pray for: your restoration.'
translation:
  language: ja
  text: というのも、私たちは自分たちが弱く、あなたがたが強いときに喜ぶからです。また、私たちはあなたがたが立て直されることを祈り求めています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたが整えられること」「あなたがたが成熟すること」または「あなたがたが完全な状態に至ること」。ギリシア語は、立て直されること、必要な備えを与えられること、あるいは本来あるべき状態へ整えられることを指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρομεν
  choice: 喜びます
  rationale: 現在形の継続的な姿勢と、単に「うれしく思う」より強い肯定的な意味を自然な現代日本語で表す。
- source_word: γὰρ
  choice: （文脈上の説明関係として反映）
  rationale: 直前の内容を説明する接続辞。日本語では「というのも」を明示すると重くなり得るため、前後の説明関係を保ちつつ無標で自然に接続した。
- source_word: ὅταν
  choice: ときに
  rationale: 接続法とともに一般的・反復的な時を表すため、「ときに」とした。
- source_word: ἀσθενῶμεν
  choice: 自分たちが弱く
  rationale: 身体的、社会的、修辞的な弱さのいずれにも開かれた語義を限定せず、「弱い」で保った。強調された主語ἡμεῖςは「自分たち」によって反映した。
- source_word: δυνατοὶ
  choice: 強い
  rationale: ἀσθενῶμενとの明瞭な対照を保ち、意味を「力がある」などに狭めない自然な対義表現とした。
- source_word: τοῦτο καὶ εὐχόμεθα
  choice: 私たちが祈り求めているのも、このこと
  rationale: 前置されたτοῦτοの焦点とκαίの「も」を保ち、εὔχομαιを文脈に即して「祈り求める」と訳した。
- source_word: κατάρτισιν
  choice: あなたがたが立て直されること
  rationale: 不適切な状態から正しい状態へ整え戻すという牧会的文脈を自然に表す。「整えられること」「完成に向かうこと」という広がりは脚注に残した。
theological_decisions:
- issue: κατάρτισιςが示すパウロの牧会的願い
  choice: あなたがたが立て直されること
  alternative: あなたがたが整えられること／成熟すること／完全な状態にされること
  rationale: コリントの信徒が正しい状態へ回復されることを願う文脈に合い、特定の「完全」の教理を持ち込まない。一方、原語には装備、整備、完成へ導く意味もあるため、脚注で語義の幅を明示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「自分たちが弱く、あなたがたが強い」という対照を簡潔に保持し、後半は「このこと、すなわち」で同格関係を明示した。
