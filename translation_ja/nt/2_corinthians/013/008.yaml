  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ δυνάμεθά τι κατὰ τῆς ἀληθείας, ἀλλὰ ὑπὲρ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/008.yaml
  text: For we are not able to do anything against the truth[a], but for the truth.
translation:
  language: ja
  text: 私たちは、真理に逆らっては何もすることができず、真理のためにしかすることができないからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちは、真理に逆らっては何もできず、真理を支持することしかできないからです。」
    reason: 後半では動詞が省略されており、ὑπέρは「真理のために」のほか「真理を支持して」とも訳せるため。
lexical_decisions:
- source_word: οὐ γὰρ
  choice: からです／…ず
  rationale: γάρが直前の文の理由を示すため、文末の「からです」で自然に表した。οὐは能力を否定する「何もできず」に反映した。
- source_word: δυνάμεθά τι
  choice: 何もできず／働くことができる
  rationale: 否定節のτιは「何も」とし、δύναμαιの能力・可能の意味を明示した。後半ではギリシア語で省略された動詞を日本語として補った。
- source_word: κατὰ τῆς ἀληθείας
  choice: 真理に逆らって
  rationale: κατά＋属格の敵対的な意味を、現代日本語で明快な「逆らって」とした。定冠詞を伴うἀλήθειαは、範囲を狭めず「真理」とした。
- source_word: ἀλλὰ
  choice: …ず、…こそ
  rationale: 強い対照を、日本語では前半の否定と後半の係助詞「こそ」によって自然に示した。
- source_word: ὑπὲρ τῆς ἀληθείας
  choice: 真理のために
  rationale: ὑπέρの支持・利益を表す意味を保持し、前半との簡潔な対照を保った。
theological_decisions:
- issue: 「真理」の指す範囲
  choice: 限定せず「真理」とする
  alternative: 「福音の真理」または「真実なこと」とする
  rationale: 文脈上は福音を含むが、本文自体は特定の教理的定式に限定していないため、原文の広がりを保った。
- issue: 後半で省略された能力表現の理解
  choice: 「働くことができる」と補う
  alternative: 「真理のためにしか何もできない」とする
  rationale: 後半は前半のδυνάμεθαが省略された対照表現と理解し、日本語の明瞭さのため補った。ただし「のみ」は原文に明示されないため本文には加えなかった。
translation_notes:
  register: 明快な現代標準日本語。パウロの簡潔な対句と説明を示すγάρを保ちつつ、後半の省略を自然な日本語として補った。
