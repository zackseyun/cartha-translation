lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: 互いにあいさつを交わしなさい
  rationale: 相互代名詞を伴うアオリスト中動態命令の直接的な勧めを、現代日本語で自然な相互行為として表した。
- source_word: ἐν ἁγίῳ φιλήματι
  choice: 聖なる口づけをもって
  rationale: ἐνの手段的な働きを「をもって」で表し、ἅγιοςの聖性とφίλημαの具体的な意味を保持した。
- source_word: ἀσπάζονται ὑμᾶς
  choice: あなたがたによろしくと言っています
  rationale: 書簡末尾で他者からのあいさつを伝える定型的用法を、複数の受け手を明示する自然な日本語で表した。
- source_word: οἱ ἅγιοι πάντες
  choice: 聖なる者たちは皆
  rationale: πάντεςの全体性を保ち、ἅγιοιを後代の列聖制度に限定されない共同体的呼称として訳した。
theological_decisions:
- issue: パウロ書簡におけるἅγιοιの共同体的呼称
  choice: 聖なる者たち
  alternative: 聖徒たち／神の聖なる民
  rationale: 信者全体を神に属する者として指す語義を保ちつつ、日本語の「聖人」が連想させやすい特別な列聖者という限定を避けた。
