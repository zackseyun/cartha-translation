id: 2CO.13.1
reference: 2 Corinthians 13:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τρίτον τοῦτο ἔρχομαι πρὸς ὑμᾶς· ἐπὶ στόματος δύο μαρτύρων καὶ τριῶν σταθήσεται πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/001.yaml
  text: 'This is the third time I am coming to you: “Every matter will be established by the testimony of two witnesses or three.”[a][b]'
translation:
  language: ja
  text: あなたがたのところへ行くのは、これで三度目です。「どの事柄も、二人または三人の証人の証言によって確定される。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どの言葉も、二人または三人の証人の口によって確定される」。ギリシア語は申命記19章15節の表現に近く、「口によって」は法的な慣用表現です。
    reason: lexical_alternative
  - marker: b
    text: 申命記19章15節を参照。
    reason: cross_reference
lexical_decisions:
- source_word: Τρίτον τοῦτο
  choice: これで三度目です
  rationale: 対格の句が副詞的に働き、今回が三度目に当たることを示す。現代日本語として自然で明瞭に表した。
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: あなたがたのところへ行く
  rationale: 現在形は文脈上、間近に予定された訪問を表す。日本語では話者から相手のもとへ赴くため「行く」が自然である。
- source_word: ἐπὶ στόματος
  choice: 証言によって
  rationale: 直訳は「口によって」だが、申命記19章15節を踏まえた法的慣用句なので、その機能を明瞭に伝えた。直訳形は脚注に残した。
- source_word: δύο μαρτύρων καὶ τριῶν
  choice: 二人または三人の証人
  rationale: καί は引用された定型表現の中で選言的な意味を持つ。人数の累積と誤解されない自然な日本語にした。
- source_word: σταθήσεται
  choice: 確定される
  rationale: ἵστημι の未来受動形で、法的文脈では事柄が証拠によって成立・確証されることを表す。
- source_word: πᾶν ῥῆμα
  choice: どの事柄も
  rationale: ῥῆμα の字義は「言葉」だが、この法的引用では審理・確認される事柄を指す。意味を狭く「訴え」と限定せず、広い法的含意を保った。
theological_decisions:
- issue: 申命記の法的原則をパウロの状況にどう表すか
  choice: 「どの事柄も」とし、証人による確定という広い法的原則として訳す
  alternative: 「どの言葉も」または「どの訴えも」と訳す
  rationale: 本文は申命記19章15節の法的原則を引用しているが、その適用範囲を教会規律だけに限定してはいない。字義と文脈上の機能の双方を脚注とともに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部分には法的な格調を保った。「来る」ではなく、日本語の直示体系に合わせて話者が相手のもとへ赴く「行く」とした。
