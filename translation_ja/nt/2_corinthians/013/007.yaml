source:
  edition: SBLGNT
  text: ⸀εὐχόμεθα δὲ πρὸς τὸν θεὸν μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν, οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν, ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε, ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/007.yaml
  text: We pray to God that you may do nothing wrong—not so that we may appear approved[a], but so that you may do what is right[c][b], even if we may seem disqualified.
translation:
  language: ja
  text: 私たちは、あなたがたが何一つ悪いことをしないようにと、神に祈っています。これは、私たちが適格だと認められるためではなく、たとえ私たちが不適格と見なされるとしても[a]、あなたがたが正しいことを行うためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「たとえ私たちが不適格な者であっても」とも訳せます。「適格」と「不適格」は、試験を経て承認されるかどうかを表す対照的な語です。
    reason: ὡς ἀδόκιμοι ὦμενは、他者からそう見なされることとも、実際にそのような立場にあることとも理解できるため。
lexical_decisions:
- source_word: εὐχόμεθα δὲ πρὸς τὸν θεὸν
  choice: 私たちは神に祈っています
  rationale: εὔχομαιはここでは神に向けた祈りを表し、πρός＋対格はその方向を示す。δὲは文脈上の軽い接続であり、日本語では明示しないほうが自然である。
- source_word: μὴ ποιῆσαι ὑμᾶς κακὸν μηδέν
  choice: あなたがたが何一つ悪いことをしないように
  rationale: 祈りの内容を表す不定詞構文。κακὸν μηδένの強い否定を「何一つ…ない」で保ち、倫理的な悪を自然な現代日本語で示した。
- source_word: οὐχ ἵνα ἡμεῖς δόκιμοι φανῶμεν
  choice: 私たちが適格だと認められるためではなく
  rationale: οὐχ ἵναの否定された目的を「ためではなく」で表した。δόκιμοιは試験を経て承認された状態、φανῶμενはそのように見える・認められることを指す。
- source_word: ἀλλ’ ἵνα ὑμεῖς τὸ καλὸν ποιῆτε
  choice: あなたがたが正しいことを行うためです
  rationale: 対照される肯定的目的を明確に表現した。τὸ καλόνはこの倫理的文脈で「正しいこと」とした。
- source_word: ἡμεῖς δὲ ὡς ἀδόκιμοι ὦμεν
  choice: たとえ私たちが不適格と見なされるとしても
  rationale: δόκιμοιとの語形上・意味上の対照を「適格／不適格」で保持した。ὡςは見かけや評価を示し得るため「見なされる」とし、譲歩的な文脈関係を「たとえ…としても」で自然に示した。
theological_decisions:
- issue: ὡς ἀδόκιμοιにおけるパウロの自己描写
  choice: たとえ私たちが不適格と見なされるとしても
  alternative: 私たちが不適格な者であっても／試験に落ちた者のようであっても
  rationale: 直前のδόκιμοι φανῶμενとの対照から、他者からの評価や使徒としての検証に関わる表現として訳した。ただしὦμενは単なる外見以上を含み得るため、その可能性を脚注で残し、最終的な霊的遺棄という教理を本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的ながら、祈りと使徒的訴えにふさわしい落ち着いた文体とした。「承認済み」のような事務的表現を避けつつ、δόκιμος／ἀδόκιμοςの対照を「適格／不適格」で再現した。
