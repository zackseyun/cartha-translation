reference: 2 Corinthians 13:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ταῦτα ἀπὼν γράφω, ἵνα παρὼν μὴ ἀποτόμως χρήσωμαι κατὰ τὴν ἐξουσίαν ἣν ⸂ὁ κύριος ἔδωκέν μοι⸃, εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/013/010.yaml
  text: For this reason I write these things while absent[a], so that when present I may not have to act harshly[b], according to the authority that the Lord gave me for building up and not for tearing down.
translation:
  language: ja
  text: このようなわけで、私は離れている間に、これらのことを書いています。それは、そちらにいるとき、主が私に与えてくださった権威を行使して厳しく対処せずにすむためです。[a] この権威は、築き上げるためのものであって、打ち壊すためのものではありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「厳しく権威を行使することがないように」または「厳しい措置を取ることがないように」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「建て上げのためであって、破壊のためではない」とも訳せる。ギリシア語は、築くことと打ち壊すことを対比する建築の比喩を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前の文脈との因果的・帰結的なつながりを、簡潔で自然な現代日本語で示す。
- source_word: ταῦτα
  choice: これらのこと
  rationale: ギリシア語の複数形を保ち、この手紙に記された警告や事柄を指し示す表現とした。
- source_word: ἀπὼν γράφω
  choice: 今は離れていて、…書いています
  rationale: 執筆時にパウロが読者のもとを離れていることを自然に表し、後の παρὼν との対照を保つ。
- source_word: ἵνα παρὼν
  choice: それは、そちらにいる時に…するためです
  rationale: ἵνα の目的を明示し、παρών を読者のもとに実際にいる時という意味で分かりやすく表した。
- source_word: μὴ ἀποτόμως χρήσωμαι
  choice: 厳しく対処せずに済む
  rationale: ἀποτόμως の「厳しく、容赦なく」と χράομαι の「対処する、振る舞う」の意味を自然に表す。文脈上、避けたい必要性が生じないように書くという含みを「せずに済む」で示した。
- source_word: κατὰ τὴν ἐξουσίαν
  choice: 権威に従って
  rationale: κατά が、与えられた権威に即して行動することを示すため、「に従って」とした。
- source_word: ἣν ὁ κύριος ἔδωκέν μοι
  choice: 主が私に与えてくださった
  rationale: 授与者を「主」とだけ訳して原文の特定度を保つ。日本語として自然な敬意を表す補助動詞を用いたが、意味上の新たな主張は加えていない。
- source_word: εἰς οἰκοδομὴν καὶ οὐκ εἰς καθαίρεσιν
  choice: 築き上げるためのものであって、打ち壊すためのものではありません
  rationale: 建築の比喩と、築くこと・壊すことの鮮明な対照を保持しつつ、権威の目的を自然な日本語で明示した。
theological_decisions:
- issue: 「主」（ὁ κύριος）が具体的に誰を指すか
  choice: 「主」とのみ訳す
  alternative: 「主イエス」などと具体化する
  rationale: この節のギリシア語本文は ὁ κύριος とだけ述べているため、称号をそのまま保ち、本文以上に指示対象を限定しない。
- issue: パウロに与えられた権威の目的
  choice: 人々を「築き上げる」ためであり、「打ち壊す」ためではないという建築比喩を保持する
  alternative: 「成長させる／滅ぼす」など、比喩を解消して訳す
  rationale: 原文の神学的・修辞的緊張は、権威そのものではなく、その建設的な目的と破壊的使用の否定にあるため、比喩を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、手紙としての直接性と使徒的権威について語る箇所の品位を保った。「そちらにいる時」で不在・在席の対照を具体化し、後半は二文に分けて権威の目的を読み取りやすくした。
