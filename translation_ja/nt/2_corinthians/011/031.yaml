id: 2CO.11.31
reference: 2 Corinthians 11:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ⸀Ἰησοῦ οἶδεν, ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας, ὅτι οὐ ψεύδομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/031.yaml
  text: The God and Father of the Lord Jesus[a], he who is blessed forever, knows that I am not lying.
translation:
  language: ja
  text: 主イエスの神であり父である方、永遠に[a]ほめたたえられる方は、私が偽りを言っていないことをご存じです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「幾つもの時代に至るまで」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: 神であり父である方
  rationale: 一つの冠詞が「神」と「父」の両方を支配する定型表現を、二つの名詞を保ちながら自然な現代日本語で表した。
- source_word: τοῦ κυρίου Ἰησοῦ
  choice: 主イエスの
  rationale: κύριοςを称号として「主」とし、原文にない「私たちの」は補わなかった。
- source_word: οἶδεν
  choice: ご存じです
  rationale: 誓言に近い働きをする文脈でも、動詞そのものの意味である「知っている」を敬語で保った。
- source_word: ὁ ὢν εὐλογητὸς
  choice: ほめたたえられる方
  rationale: 神を描写する頌栄的な挿入句として、現代日本語で自然に理解できる表現とした。「祝福される方」は日本語では神が祝福を受けるという意味が不明瞭になりやすいため避けた。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永遠に
  rationale: 継続する頌栄の意味を簡潔で自然な日本語にした。字義的な形は脚注に示した。
- source_word: ὅτι
  choice: ことを
  rationale: 神が知っている内容を導く接続詞として訳し、理由を表す「なぜなら」とはしなかった。
- source_word: οὐ ψεύδομαι
  choice: 私が偽りを言っていない
  rationale: 現在形の直接的な否定を保ち、この場での厳粛な主張として自然な日本語にした。
theological_decisions:
- issue: 「神であり父」と「主イエス」との関係
  choice: 「主イエスの神であり父である方」と原文の関係を明示した。
  alternative: 神と主イエスとの区別が目立たないように意訳する。
  rationale: 本文が示す父なる神と主イエスとの関係および人格的区別を弱めず、解釈上の緊張を訳文で解消しないため。
- issue: 頌栄句の係り先
  choice: 「永遠にほめたたえられる方」を神を説明する同格的な挿入句として訳した。
  alternative: 限定的な関係節として後続文に密接に結び付ける。
  rationale: ὁ ὢν εὐλογητὸς εἰς τοὺς αἰῶνας は、パウロの厳粛な訴えの中で神をたたえる挿入的描写として自然に読めるため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ご存じです」によって神への敬意を自然に示しつつ、古語的な「ほむべき方」や過度に教会的な定型句は避けた。
