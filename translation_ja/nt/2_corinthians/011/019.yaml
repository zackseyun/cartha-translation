  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡδέως γὰρ ἀνέχεσθε τῶν ἀφρόνων φρόνιμοι ὄντες·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/019.yaml
  text: For you gladly put up with fools[b][a], being wise yourselves.
translation:
  language: ja
  text: というのも、賢いあなたがたは、愚かな者たちを喜んで我慢しているからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「愚かな者たちを耐え忍んでいます」。
    reason: lexical_alternative
  - marker: b
    text: パウロは皮肉を込めて語っている。コリントの人々は自分たちを賢いと考えているのに、愚かな指導者たちを容認していた。
    reason: cultural_note
lexical_decisions:
- source_word: ἡδέως
  choice: 喜んで
  rationale: 進んで、あるいは満足して受け入れる様子を表す副詞。文脈にあるパウロの皮肉も保てる、自然で直接的な訳語とした。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 直前の発言の理由や説明を導く接続語。その説明関係が現代日本語で明確になる構文を用いた。
- source_word: ἀνέχεσθε
  choice: 我慢している
  rationale: 人を耐え忍ぶ、容認するという意味。ここでは相手を受け入れて耐えることへの鋭い批判が感じられる、日常的で明瞭な表現とした。
- source_word: τῶν ἀφρόνων
  choice: 愚かな者たちを
  rationale: 動詞の対象となる、思慮に欠けた人々を指す。「愚かな者たち」は後半の「賢い」との対照を直接保つ。
- source_word: φρόνιμοι ὄντες
  choice: 賢いあなたがたは
  rationale: 分詞句を簡潔な主題表現にし、「愚かな者たち」と「賢いあなたがた」の皮肉な対照を保った。分詞が因果か譲歩かを本文で明示的に限定していない。
theological_decisions:
- issue: コリントの信徒たちに向けたパウロの皮肉
  choice: 「愚かな者たち」と「賢いあなたがた」をそのまま対置し、皮肉を本文の語の組み合わせによって伝える。
  alternative: 「自分たちを賢いと思っているあなたがた」のように、皮肉を説明的に本文へ織り込む。
  rationale: 原文は「自分たちを賢いと思っている」と明言せず、対照そのものによって皮肉を生じさせているため、解釈を本文に追加しない。
- issue: φρόνιμοι ὄντες の論理的関係
  choice: 「賢いあなたがたは」と訳し、因果または譲歩のどちらかに限定しない。
  alternative: 「賢いのだから」または「賢いのに」と訳す。
  rationale: 原文の分詞は文脈上皮肉を帯びるが、その論理関係を接続表現で明示してはいないため、真正な曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの鋭い皮肉と「愚か／賢い」の対照を保持した。「我慢している」は口語的すぎず、一般読者にも直ちに意味が通じる表現である。
