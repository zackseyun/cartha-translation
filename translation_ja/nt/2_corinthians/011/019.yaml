  naturalness: 「というのも、賢いあなたがたは、愚かな者たちを喜んで我慢しているからです。」は明瞭な現代標準日本語であり、皮肉を説明的に本文へ持ち込まずに伝えている。「我慢している」は人を対象にしても自然で、原文の耐え忍ぶ／容認する含みを無理なく表す。
