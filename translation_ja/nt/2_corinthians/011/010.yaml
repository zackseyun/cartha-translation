  source_fidelity: 本文の後半はκαύχησις、φραγήσεται、κλίμασιの複数性を概ね適切に反映している。しかし冒頭の「キリストの真実にかけて言います」は、原文に明示されない「言います」を補い、ὅτιが導く断言の構造をやや言い換えすぎている。また、英語POBの用語方針では、この箇所のΧριστόςは称号として「Messiah」とされているため、日本語も「メシア」とするのが監査記録との整合上望ましい。
