source:
  edition: SBLGNT
  text: ἔστιν ἀλήθεια Χριστοῦ ἐν ἐμοὶ ὅτι ἡ καύχησις αὕτη οὐ φραγήσεται εἰς ἐμὲ ἐν τοῖς κλίμασι τῆς Ἀχαΐας.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/010.yaml
  text: As the truth of Messiah is in me[c][b][a], this boasting of mine will not be silenced in the regions of Achaia.
translation:
  language: ja
  text: メシアの真実が私のうちにあることにかけて、この私の誇りは、アカイアの諸地方で決して封じられることはありません。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシアの真実が私のうちにあるので」。ギリシャ語は「メシアの真実が私のうちにある」と述べた後、続く断言を導く。ここでは厳粛な保証の表現として訳した。
    reason: alternative_reading
  - marker: b
    text: 「この私の誇りが封じられる」は、「この誇りが私に関して妨げられる」または「私のこの誇りが妨げられる」とも訳せる。ギリシャ語の表現は慣用的で、解釈が難しい。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια Χριστοῦ ἐν ἐμοὶ
  choice: 私のうちにあるキリストの真実
  rationale: 属格をキリストに属する真実として保ち、ἐν ἐμοὶも明示した。「真実」は、単なる教理内容だけでなく、誓言的な文脈での真実性をも表し得る。
- source_word: ὅτι
  choice: にかけて言います
  rationale: ここでは後続内容を導く誓言的な構文として理解し、現代日本語で自然な形にした。接続詞の形式よりも発話機能を優先した。
- source_word: καύχησις
  choice: 誇り
  rationale: 文脈上、誇る行為とその内容の双方を含み得る。日本語では「誇り」が自然で、パウロが維持する主張の内容も表せる。
- source_word: φραγήσεται
  choice: 封じられる
  rationale: φράσσωの「塞ぐ、閉ざす」という受動の比喩を保ちつつ、発言や誇りを抑え込む意味でも自然な表現とした。
- source_word: εἰς ἐμὲ
  choice: 私に関する
  rationale: 方向を表す前置詞句を、この難解な慣用表現では関連・関係の意味に取り、過度に所有表現へ単純化せず訳した。
- source_word: ἐν τοῖς κλίμασι τῆς Ἀχαΐας
  choice: アカイアの諸地方で
  rationale: κλίμασιの複数形を「諸地方」で示し、ローマ属州名は慣用的に「アカイア」と音写した。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: キリスト
  alternative: メシア
  rationale: パウロ書簡のこの誓言的表現では、日本語で称号兼固有名のように定着した「キリスト」が自然である。称号性を強調するなら「メシア」も可能だが、本文では特定教派的含意を加えない慣用形を採った。
- issue: ἀλήθεια Χριστοῦの属格関係
  choice: キリストの真実
  alternative: キリストについての真理／キリストにある真理
  rationale: 属格の関係を限定しすぎず、キリストに属し、キリストによって特徴づけられる真実として保持した。
- issue: 文頭の誓言的構文
  choice: 私のうちにあるキリストの真実にかけて言います
  alternative: キリストの真実が私のうちにあるので
  rationale: 文脈上は強い保証・誓言として読むのが自然だが、理由を述べる構文として読む余地も脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、誓言の厳粛さを保った。「封じられる」は原文の比喩と受動態を残すため、やや格調ある語として採用した。
