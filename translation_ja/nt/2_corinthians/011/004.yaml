id: 2CO.11.4
reference: 2 Corinthians 11:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ μὲν γὰρ ὁ ἐρχόμενος ἄλλον Ἰησοῦν κηρύσσει ὃν οὐκ ἐκηρύξαμεν, ἢ πνεῦμα ἕτερον λαμβάνετε ὃ οὐκ ἐλάβετε, ἢ εὐαγγέλιον ἕτερον ὃ οὐκ ἐδέξασθε, καλῶς ⸀ἀνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/004.yaml
  text: For if someone comes and proclaims another Jesus[a], whom we did not proclaim, or if you receive a different spirit, which you did not receive, or a different gospel, which you did not accept[c][b], you put up with it well enough.
translation:
  language: ja
  text: というのも、だれかが来て、私たちが宣べ伝えなかった別のイエスを宣べ伝えるなら、あるいは、あなたがたが受けたことのない異なる霊[a]を受け、受け入れたことのない異なる福音[b]を受け入れるなら、あなたがたはそのようなことをいとも簡単に容認してしまうのです。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異なる霊」が、誤って語られた聖霊、悪霊、あるいは別種の霊的な影響のどれを指すかは、本文では特定されていません。
    reason: theological_ambiguity
  - marker: b
    text: 直訳的には「別種の福音」。以前に受け入れた福音とは異なるものを指します。
    reason: lexical_alternative
  - marker: c
    text: 「いとも簡単に容認してしまうのです」は皮肉であり、そのような主張をあまりにも容易に容認していることへの叱責です。
    reason: irony
lexical_decisions:
- source_word: ὁ ἐρχόμενος
  choice: だれかがやって来て
  rationale: 冠詞付き現在分詞を文脈上の不特定の人物として自然な現代日本語にした。
- source_word: ἄλλον Ἰησοῦν
  choice: 別のイエス
  rationale: 同じ「イエス」という名を用いながら異なる人物像を説く対抗的宣教を、過度に解釈せず表す。
- source_word: κηρύσσει / ἐκηρύξαμεν
  choice: 宣べ伝える／宣べ伝えなかった
  rationale: 公に告知するκηρύσσωの意味と、両形の語彙的対応を保つ。
- source_word: πνεῦμα ἕτερον
  choice: 異なる霊
  rationale: ἕτεροςの相違を強調するニュアンスを示しつつ、霊の正体は限定しない。
- source_word: λαμβάνετε / ἐλάβετε
  choice: 受ける／受けたことのない
  rationale: 授けられたものを受ける意味を保ち、次のδέχομαιとの違いを表した。
- source_word: εὐαγγέλιον ἕτερον
  choice: 異なる福音
  rationale: 既に受け入れた福音とは性質を異にする知らせであるという対比を示す。
- source_word: ἐδέξασθε
  choice: 受け入れた
  rationale: δέχομαιの受容・歓迎の含みを表し、λαμβάνωの「受ける」と訳し分ける。
- source_word: καλῶς ἀνέχεσθε
  choice: それを実によく我慢している
  rationale: 耐え忍ぶ・容認するという意味を保ち、καλῶςによる文脈上の皮肉が伝わる表現とした。
- source_word: εἰ μὲν γὰρ
  choice: というのも、…場合…からです
  rationale: γάρの説明的なつながりとεἰの条件構文を、日本語として自然な理由提示の文型で表した。
theological_decisions:
- issue: 「異なる霊」の指示対象
  choice: 「異なる霊」と一般的に訳し、対象を特定しない
  alternative: 誤って提示された聖霊、悪霊、または異なる霊的態度・体験と明示する
  rationale: 本文だけでは指示対象を確定できないため、原文の神学的曖昧さを保った。
- issue: καλῶς ἀνέχεσθεの調子
  choice: 皮肉を含む叱責として「実によく我慢している」
  alternative: 率直な称賛、または中立的な観察として訳す
  rationale: 文脈上、パウロは対抗的な宣教を容易に容認するコリントの人々を称賛せず、批判している。訳文では皮肉を示しつつ、明示的な説明は脚注に置いた。
- issue: 条件文の帰結と対象
  choice: 三つの条件をまとめ、最後に「それを…我慢している」とする
  alternative: 「その人を快く容認する」と人物を目的語として補う
  rationale: ἀνέχεσθεの目的語は明示されていないため、特定の人物に限定せず、提示された教え・事態全体を指しうる形にした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの議論の格調を保った。「宣べ伝える」は聖書的な語感を持つが現代の一般読者にも理解可能であり、「受ける」と「受け入れる」の対照によって原文のλαμβάνωとδέχομαιの違いを反映した。
