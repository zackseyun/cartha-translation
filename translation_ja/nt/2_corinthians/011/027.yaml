  text: ⸀κόπῳ καὶ μόχθῳ, ἐν ἀγρυπνίαις πολλάκις, ἐν λιμῷ καὶ δίψει, ἐν νηστείαις πολλάκις, ἐν ψύχει καὶ γυμνότητι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/027.yaml
  text: in labor and hardship[a], in many sleepless nights, in hunger and thirst, in frequent fastings[b], in cold and exposure.
translation:
  language: ja
  text: 労苦と苦難を経験し、幾度も眠れぬ夜を過ごし、飢えと渇きを覚え、幾度も断食し[a]、寒さと衣服の不足に苦しみました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幾度も食を断たざるを得なかった」とも理解できます。ギリシア語は繰り返される断食を表しますが、それが自発的なものか、事情によるものかは明記されていません。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「裸（裸でいること）」です。ここでは、衣服が足りず、寒さや風雨にさらされる状態を指す可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: κόπῳ καὶ μόχθῳ
  choice: 労苦と難儀の中にあり
  rationale: 近義語を一語にまとめず、κόποςの骨の折れる働きとμόχθοςの苦難を重ねる累積的な表現を保った。
- source_word: ἐν ἀγρυπνίαις πολλάκις
  choice: 幾度も眠らず
  rationale: ἀγρυπνίαの反復される不眠・徹夜を、現代日本語として簡潔かつ自然に表した。原因が自発的な夜警か、苦境による不眠かは限定しない。
- source_word: ἐν λιμῷ καὶ δίψει
  choice: 飢え渇き
  rationale: 食物と水の欠乏という二つの状態を、簡潔な並列表現で保った。
- source_word: ἐν νηστείαις πολλάκις
  choice: 幾度も断食し
  rationale: νηστείαを一般的な飢えと同一視せず、「断食」とした。自発的な宗教的断食か、事情による絶食かは本文だけでは確定できないため脚注で明示した。
- source_word: ἐν ψύχει καὶ γυμνότητι
  choice: 寒さと裸同然の状態にさらされました
  rationale: ψῦχοςとγυμνότηςの組み合わせを、寒さの中で衣服が足りず無防備な状態という文脈上の意味が伝わる自然な日本語にした。γυμνότηςの直訳は脚注に残した。
theological_decisions:
- issue: νηστείαιςが自発的断食か、食物不足による絶食か
  choice: 断食
  alternative: 食べ物がなく絶食すること
  rationale: 直前のλιμός「飢え」との語彙上の区別を保つため「断食」としたが、その自発性は本文で決めず、脚注で両義性を示した。
- issue: γυμνότητιが文字どおりの裸か、衣服不足か
  choice: 裸同然の状態
  alternative: 裸
  rationale: 寒さと並ぶ苦難一覧では衣服不足による風雨への無防備さが想定されうるため、読みやすく「裸同然の状態」とした。ただし文字どおり「裸」の可能性を脚注に保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の畳みかける列挙を生かしつつ、日本語では各ἐνを機械的に反復しなかった。脚注記号[a][b]は該当箇所に配置した。
