  yaml_path: translation/nt/2_corinthians/011/029.yaml
  text: Who is weak[a], and I am not weak? Who is caused to stumble, and I do not burn with indignation?
translation:
  language: ja
  text: だれが弱っているとき、私が弱らずにいられるでしょうか。だれがつまずかされるとき、私の心が燃えずにいられるでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心が燃える」は比喩で、激しい悲しみ、熱意、憤りなどを表し得る。別訳「私も憤りに燃えずにいられるでしょうか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενεῖ / ἀσθενῶ
  choice: 弱くなっている／弱くなる
  rationale: 身体的、社会的、霊的な弱さを含み得る語の広がりを保ちつつ、パウロが他者の弱さを自らのこととして担う意味を自然な日本語で表す。
- source_word: σκανδαλίζεται
  choice: つまずかされる
  rationale: 受動態と、障害によって倒される比喩を保ち、罪、誘惑、信仰上の挫折のいずれかに限定しない。
- source_word: πυροῦμαι
  choice: 心が燃える
  rationale: 内面の激しい反応を示す火の比喩を保持し、憤り、悲しみ、熱意のどれか一つに本文で限定しない。
- source_word: τίς
  choice: だれかが
  rationale: 修辞疑問として自然な現代日本語にし、個々の人への言及を保つ。
- source_word: καὶ οὐκ ἐγὼ
  choice: 私も～ないでしょうか
  rationale: 明示されたἐγώの強調と修辞疑問の力を、日本語の「私も」と反語的な問いで表す。
theological_decisions:
- issue: πυροῦμαιが表すパウロの反応
  choice: 本文では「心が燃える」として比喩と感情上の幅を保つ。
  alternative: 憤りに燃える／悲しみに焼かれる／激しく心を痛める
  rationale: 原文はパウロの強烈な内的反応を示すが、その感情を憤りだけに確定しない。悲しみ、熱意、憤りを含み得る神学的・牧会的な緊張を残す。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。二つの修辞疑問の並行性を保ち、原文の反復とパウロの連帯感を伝える。
