    text: 「神にふさわしいねたみをもって」とも訳せます。ギリシア語は、神に属するねたみ、または神の性質にかなうねたみを意味しえます。
    reason: lexical_alternative
  revision_rationale: The revision removes an unintended modern-Japanese sense of personal envy and restores the Greek purpose relation of παραστῆσαι. The revised wording preserves the source's ambiguity concerning God's jealousy and its bridal metaphor without adding doctrinal interpretation. Footnote b is removed because its proposed wording reflects neither a genuine textual variant nor a valid syntactic alternative.
