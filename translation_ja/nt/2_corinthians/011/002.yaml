  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ζηλῶ γὰρ ὑμᾶς θεοῦ ζήλῳ, ἡρμοσάμην γὰρ ὑμᾶς ἑνὶ ἀνδρὶ παρθένον ἁγνὴν παραστῆσαι τῷ Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/002.yaml
  text: For I am jealous for you with God's jealousy[a], because I betrothed you to one husband[b], to present you as a pure virgin to Messiah.
translation:
  language: ja
  text: 私は、あなたがたのことで神のねたみ[a]を抱いています。あなたがたを一人の夫と婚約させ、純潔な処女としてメシアに差し出すためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神にふさわしいねたみをもって」とも訳せます。ギリシア語は、神に属するねたみ、または神の性質にかなうねたみを意味しえます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλῶ
  choice: ねたんでいる
  rationale: 婚姻の比喩の中で、単なる熱意ではなく、排他的な結びつきを守ろうとする強い思いを表す。日本語の「ねたみ」は否定的にも響きうるが、「神のねたみ」と結びつけることで、原文にある契約的・保護的な緊張を保つ。
- source_word: θεοῦ ζήλῳ
  choice: 神のねたみをもって
  rationale: 属格 θεοῦ を素直に「神の」と訳し、そのねたみが神に属するのか、神にふさわしい性質のものかという原文の幅を保持する。
- source_word: ἡρμοσάμην
  choice: 婚約させ
  rationale: 結婚のために取り決める、または嫁がせるという意味を、現代日本語で明瞭に表す。文脈上、パウロが仲介者として共同体を一人の夫に結び合わせた比喩である。
- source_word: ἑνὶ ἀνδρὶ
  choice: 一人の夫と
  rationale: ἀνήρ は「男」とも訳せるが、婚約と花嫁の比喩により、ここでは「夫」が自然である。与格は日本語の「と婚約させる」で表した。
- source_word: παρθένον ἁγνὴν
  choice: 純潔な処女
  rationale: παρθένος の婚姻的イメージを「処女」で保持し、ἁγνή の道徳的・宗教的な清さを「純潔な」で表す。
- source_word: παραστῆσαι
  choice: 差し出そうとした
  rationale: 人を他者の前に立たせ、正式に引き渡す意味を婚姻の場面に合う形で表現する。不定詞の目的を「ようとした」で示す。
- source_word: τῷ Χριστῷ
  choice: メシアに
  rationale: 定冠詞を伴う Χριστός がここでは花婿を指す称号として機能しているため、「メシア」とした。
theological_decisions:
- issue: パウロの「ねたみ」の性質
  choice: 神ご自身の契約的なねたみを映す、共同体を守ろうとするねたみ
  alternative: 単に神にふさわしい熱意、またはパウロ個人の熱心さ
  rationale: θεοῦ ζήλῳ は、神に属するねたみとも、神にふさわしいねたみとも理解できる。訳文では「神のねたみ」として両義性を残し、婚姻比喩が示す排他的・契約的含意を弱めない。
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では一人の夫・花婿として指示され、Χριστός の称号性が明瞭であるため、「メシア」と訳す。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「ねたみ」は原文の鋭さと契約的緊張を保つために採用した。「婚約させ」は古風な「いいなずけにした」などを避けつつ、婚姻の正式な取り決めを伝える。
