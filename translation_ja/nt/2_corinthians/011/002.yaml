revisions:
- from: 私は神のねたみをもって、あなたがたをねたんでいるのです。[a] 私はあなたがたを一人の夫と婚約させ、純潔な処女としてメシアに差し出そうとしたからです。[b]
  to: 私は、あなたがたのことで神のねたみ[a]を抱いています。あなたがたを一人の夫と婚約させ、純潔な処女としてメシアに差し出すためです。
  rationale: The revision removes an unintended modern-Japanese sense of personal envy and restores the Greek purpose relation of παραστῆσαι. The revised wording preserves the source's ambiguity concerning God's jealousy and its bridal metaphor without adding doctrinal interpretation. Footnote b is removed because its proposed wording reflects neither a genuine textual variant nor a valid syntactic alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:28Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the divine-jealousy expression, the marital/betrothal imagery, the singular husband, the pure-virgin image, and メシア for τῷ Χριστῷ. However, 「ねたんでいる」 with あなたがた as its object readily means envying them in modern Japanese, rather than Paul's protective jealousy concerning them. Further, 「差し出そうとした」 incorrectly introduces an attempted action; παραστῆσαι is a purpose infinitive, “to present.”
  naturalness: 「あなたがたのことで神のねたみを抱いています」 is clear, idiomatic modern Japanese and retains the metaphor's force without suggesting envy. Rendering the final infinitive as 「差し出すためです」 naturally expresses its purpose relationship to 「婚約させた」.
  terminology: 「神のねたみ」 appropriately preserves the ambiguity of θεοῦ ζήλῳ. 「一人の夫」「純潔な処女」「メシア」 accurately maintain the source imagery and project terminology. 「婚約させた」 is acceptable in the metaphorical context.
  issues:
  - severity: high
    issue: 「あなたがたをねたんでいる」 may mean “I envy you.”
    rationale: In contemporary Japanese, 人をねたむ normally denotes envy directed at that person. Greek ζηλῶ ὑμᾶς in this context conveys jealous concern for/concerning the Corinthians, not envy of them.
  - severity: high
    issue: 「差し出そうとした」 renders the purpose infinitive as an attempted action.
    rationale: 'παραστῆσαι depends on ἡρμοσάμην and states the purpose of Paul''s betrothal: to present them to the Messiah. The Greek does not say that Paul merely tried to present them.'
  - severity: medium
    issue: Footnote b explains the mistranslation as though it were a syntactic alternative.
    rationale: The direct purpose rendering is required by the Greek syntax, whereas “tried to present” is not a viable alternative. The note should be corrected or omitted.
  revised_text: 私は、あなたがたのことで神のねたみ[a]を抱いています。あなたがたを一人の夫と婚約させ、純潔な処女としてメシアに差し出すためです。
  revised_footnotes:
