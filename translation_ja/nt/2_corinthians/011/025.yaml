  text: τρὶς ἐραβδίσθην, ἅπαξ ἐλιθάσθην, τρὶς ἐναυάγησα, νυχθήμερον ἐν τῷ βυθῷ πεποίηκα·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/025.yaml
  text: Three times I was beaten with rods[a], once I was stoned, three times I was shipwrecked; I have spent a night and a day in the deep.
translation:
  language: ja
  text: 三度、棒で打たれ、一度、石を投げつけられ、三度、難船しました。一昼夜、深い海で過ごしました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρὶς
  choice: 三度
  rationale: 反復回数を示す標準的で簡潔な訳。節内の二例に一貫して用いた。
- source_word: ἐραβδίσθην
  choice: むち棒で打たれ
  rationale: ῥαβδίζωが棒による打擲を具体的に表すため、道具を明示した。受動態も保っている。
- source_word: ἅπαξ
  choice: 一度
  rationale: 一回だけの出来事を自然な現代日本語で表した。
- source_word: ἐλιθάσθην
  choice: 石を投げつけられ
  rationale: λιθάζωの暴力的行為を明瞭に表し、日本語で『石打ち』が処刑の完遂を含意し得る曖昧さを避けた。
- source_word: ἐναυάγησα
  choice: 難船しました
  rationale: 船が難破する災難に遭ったことを、簡潔で自然かつ格調を保つ表現にした。
- source_word: νυχθήμερον
  choice: 一昼夜
  rationale: 夜と昼から成る期間を自然な日本語で表し、『二十四時間』という過度に厳密な言い換えを避けた。
- source_word: ἐν τῷ βυθῷ
  choice: 沖の海で
  rationale: βυθόςはここで深い海、外海を指すと考えられる。日本語の『深み』では海中に沈んでいたとの誤解が強いため、状況を過度に限定せず自然に伝える『沖の海』を採った。
- source_word: πεποίηκα
  choice: 過ごしました
  rationale: 時間表現を伴う ποιέω の『時を過ごす』という慣用的意味を自然な日本語にした。完了形の回顧的な力は、体験を列挙する文脈によって十分に伝わる。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、苦難の列挙が持つ簡潔で切迫した調子を保った。原文の動詞形に従って主語『私は』の反復は避けた。英語相談層の脚注は marker と対象語が不整合であり、原文上必要な異読脚注でもないため採用しなかった。
