reference: 2 Corinthians 11:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πάλιν λέγω, μή τίς με δόξῃ ἄφρονα εἶναι— εἰ δὲ μή γε, κἂν ὡς ἄφρονα δέξασθέ με, ἵνα κἀγὼ μικρόν τι καυχήσωμαι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/016.yaml
  text: Again I say[a], let no one think me to be foolish—but if not, then receive me even as foolish, so that I too may boast a little.
translation:
  language: ja
  text: もう一度言います。だれも私を愚かだと思わないでください。しかし、もしそう思うのなら、愚かな者としてでも私を受け入れてください。そうすれば、私も少しは誇ることができます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「だれも私を愚か者だと思わないでください……愚か者としてでも私を受け入れてください」とも訳せる。ギリシア語の形容詞ἄφρωνは、「愚かだ」という形容詞としても、「愚か者」という名詞相当の語としても訳すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάλιν λέγω
  choice: もう一度言います
  rationale: 繰り返される訴えを示す簡潔で自然な現代日本語。現在形の直接的な語調も保つ。
- source_word: μή τίς με δόξῃ ἄφρονα εἶναι
  choice: だれも私を愚かだと思わないでください
  rationale: μήと接続法による否定的な要請を自然な丁寧体で表し、δοκέωと不定詞の判断内容も明確にした。
- source_word: εἰ δὲ μή γε
  choice: しかし、もしそう思うのなら
  rationale: 直訳的な「もしそうでなければ」では日本語で指示内容が曖昧になるため、先の要請が受け入れられず、パウロを愚かだと見る場合という文脈上の含意を自然に示した。
- source_word: κἂν ὡς ἄφρονα δέξασθέ με
  choice: 愚かな者としてでも私を受け入れてください
  rationale: κἄνの譲歩的な力を「でも」で示し、δέχομαιを「受け入れる」と訳して、パウロの議論に耳を傾けるよう求める直接性を保った。
- source_word: ἵνα κἀγὼ μικρόν τι καυχήσωμαι
  choice: そうすれば、私も少しは誇ることができます
  rationale: ἵναの目的・結果のつながりを自然に示し、κἀγώの「私も」とμικρόν τιの限定、καυχάομαιの誇りの語彙を保持した。
theological_decisions:
- issue: パウロが自らを愚かさと結びつけつつ誇ろうとする皮肉
  choice: 「愚かな者」「誇る」という強い表現をそのまま保つ
  alternative: 「軽率な者」「少し自分について語る」などと和らげる
  rationale: パウロは誇りを批判しながら、相手に応じてあえて愚かに見える誇りへ踏み込む。その修辞的・神学的緊張を解消しないため。
- issue: ἄφροναの形容詞的・名詞的な訳し分け
  choice: 第一箇所を「愚かだ」、第二箇所を「愚かな者として」とする
  alternative: 両方を「愚か者」とする
  rationale: ギリシア語の同一語を認識できる形で保ちつつ、それぞれの構文に合う自然な日本語とした。別訳の可能性は脚注で明示する。
translation_notes:
  register: 明瞭で現代的な標準日本語の丁寧体。パウロの切迫した訴えと皮肉を保ちつつ、過度に古風な「愚かと思うな」「受け入れよ」は避けた。脚注記号は該当節末に置いた。
