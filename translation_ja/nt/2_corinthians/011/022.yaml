  text: Ἑβραῖοί εἰσιν; κἀγώ. Ἰσραηλῖταί εἰσιν; κἀγώ. σπέρμα Ἀβραάμ εἰσιν; κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/022.yaml
  text: Are they Hebrews? So am I[a]. Are they Israelites? So am I. Are they Abraham’s offspring? So am I.
translation:
  language: ja
  text: 彼らはヘブライ人なのですか。私もそうです。彼らはイスラエル人なのですか。私もそうです。彼らはアブラハムの子孫[a]なのですか。私もそうです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「アブラハムの種」。ギリシア語では単数形の集合表現が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑβραῖοί
  choice: ヘブライ人
  rationale: 確立した民族的・宗教的呼称を用い、「イスラエル人」および「アブラハムの子孫」との区別を保った。
- source_word: κἀγώ
  choice: 私もそうです
  rationale: καίとἐγώの縮約形が持つ簡潔で強調的な反復を、自然な現代日本語で表した。
- source_word: Ἰσραηλῖταί
  choice: イスラエル人
  rationale: イスラエルに属する者という呼称を明確に表し、前後の重なり合いつつ異なる身分表現を保持した。
- source_word: σπέρμα Ἀβραάμ
  choice: アブラハムの子孫
  rationale: σπέρμαは単数形ながら集合的に子孫を指す。本文では自然で明瞭な「子孫」とし、原語の「種」に当たる表現は脚注に示した。
- source_word: εἰσιν
  choice: 彼らは～なのですか
  rationale: 三度の修辞疑問とそれに続く短い応答という構造を、日本語として自然に保った。
theological_decisions:
- issue: ユダヤ人としての身分を示す三つの呼称の区別
  choice: 「ヘブライ人」「イスラエル人」「アブラハムの子孫」をそれぞれ保持する
  alternative: すべてを「ユダヤ人」など一つの呼称にまとめる
  rationale: 原文は意味の重なる三つの呼称を積み重ねており、パウロの出自と帰属を段階的に強調しているため、その区別を平板化しない。
translation_notes:
  register: 簡潔で畳みかける原文の修辞を生かしつつ、明瞭で格調を失わない現代標準日本語とした。「なのですか」を反復して対抗者の主張を取り上げる語調を示した。
