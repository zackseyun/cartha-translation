  text: Since many boast according to the flesh[a], I too will boast.
translation:
  language: ja
  text: 多くの人が肉に従って[a]誇っているので、私も誇ることにします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人間的な基準で」または「ただ人間的な仕方で」とも訳せる。
    reason: κατὰ σάρκαの慣用的な意味を明らかにしつつ、本文では「肉」を保持するため。
lexical_decisions:
- source_word: ἐπεὶ
  choice: ので
  rationale: 後半に述べるパウロの皮肉な決意の理由を示す。現代日本語として自然な因果関係を表す。
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 数量を素直に示し、日本語の主語として自然に補った。
- source_word: καυχῶνται / καυχήσομαι
  choice: 誇っている／誇る
  rationale: 同じ動詞の反復を保ち、文脈にある論争的かつ皮肉な調子を伝える。「自慢する」よりも品位があり、「誇る」は肯定・否定双方の含みを保持できる。
- source_word: κατὰ σάρκα
  choice: 肉に従って
  rationale: σάρξを解釈で置き換えず、「肉」というパウロ的で神学的含意のある語を本文に残す。日本語では慣用性が低いため、文脈上の意味を脚注で補う。
- source_word: κἀγώ
  choice: 私も
  rationale: καίとἐγώの結合が示す、他の人々に呼応する強調を簡潔に表す。
- source_word: καυχήσομαι
  choice: 誇ることにします
  rationale: 単純な未来予告だけでなく、この論述でそのように振る舞うという意志的・修辞的決定を自然な日本語で表した。
theological_decisions:
- issue: κατὰ σάρκαにおけるσάρξの訳し方
  choice: 肉に従って
  alternative: 人間的な基準で／ただ人間的な仕方で
  rationale: ここでの「肉」は身体そのものや「罪深い性質」と一義的に限定されず、人間的・世俗的な基準や仕方を指しうる。本文では原語の神学的な緊張と曖昧さを保持し、自然な解釈候補を脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「肉に従って」は意図的に原語寄りの表現とし、脚注で普通の読者に意味を補った。
