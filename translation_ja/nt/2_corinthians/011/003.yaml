revisions:
- from: しかし私は心配しています。蛇がその悪知恵によってエバを欺いたように、あなたがたの思いが、メシアに対するひたむきさと純潔さ[a]から離れて、堕落させられることがありはしないかと。
  to: しかし私は心配しています。蛇がその悪知恵によってエバを欺いたように、あなたがたの思いが、メシアに対する誠実さと純潔さ[a]から離れ、損なわれるのではないかと。
  rationale: 本文の構文を整えつつ、蛇による欺きとの比較、思いが損なわれるという受動的な危惧、そしてメシアに向かう誠実さと純潔さからの離脱を保持しました。本文の「誠実さ」には、ἁπλότηςの主要な倫理的語義を採り、他の有力な語義は脚注で保存しています。
