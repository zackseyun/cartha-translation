  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: φοβοῦμαι δὲ μή πως, ὡς ὁ ὄφις ⸂ἐξηπάτησεν Εὕαν⸃ ἐν τῇ πανουργίᾳ αὐτοῦ, ⸀φθαρῇ τὰ νοήματα ὑμῶν ἀπὸ τῆς ἁπλότητος ⸂καὶ τῆς ἁγνότητος⸃ τῆς εἰς τὸν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/003.yaml
  text: But I fear that somehow[a], just as the serpent deceived Eve by his cunning[d][c][b], your minds may be corrupted from the sincerity and purity that are toward Messiah.
translation:
  language: ja
  text: しかし私は心配しています。蛇がその悪知恵によってエバを欺いたように、あなたがたの思いが、メシアに対する誠実さと純潔さ[a]から離れ、損なわれるのではないかと。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本では「と純潔さ」を欠きます。「誠実さ」は「単純さ」または「一途さ」とも訳せます。
    reason: textual_variant_and_lexical_alternative
lexical_decisions:
- source_word: φοβοῦμαι δὲ μή πως
  choice: しかし私は心配しています……ことがありはしないかと
  rationale: 継続する懸念と、μή πως が導く危惧を、明瞭で自然な現代日本語にした。
- source_word: ὁ ὄφις
  choice: 蛇
  rationale: 創世記への言及を保つ標準的な訳語。
- source_word: ἐξηπάτησεν Εὕαν
  choice: エバを欺いた
  rationale: 動詞の欺瞞の意味を直接表し、人名は日本語聖書で定着した形を用いた。
- source_word: ἐν τῇ πανουργίᾳ αὐτοῦ
  choice: その悪知恵によって
  rationale: πανουργία の巧妙で欺瞞的な性格と、手段を示す ἐν を自然に表した。
- source_word: φθαρῇ τὰ νοήματα ὑμῶν
  choice: あなたがたの思いが……堕落させられる
  rationale: 受動態と、思考・意向が損なわれる強い意味を保った。νόημα は単なる知性より広い『思い』とした。
- source_word: ἀπὸ τῆς ἁπλότητος
  choice: ひたむきさから離れて
  rationale: ἀπό の分離を明示し、ἁπλότης がここで表す、分裂のない誠実な献身を『ひたむきさ』で伝えた。
- source_word: καὶ τῆς ἁγνότητος
  choice: と純潔さ
  rationale: 直前の婚約の比喩を踏まえつつ、性的意味だけに限定しない清さを表した。
- source_word: τῆς εἰς τὸν Χριστόν
  choice: メシアに対する
  rationale: 前置詞句が『ひたむきさと純潔さ』を修飾する関係を自然に示し、Χριστός の称号性を『メシア』で表した。
theological_decisions:
- issue: Χριστόν の訳
  choice: メシア
  alternative: キリスト
  rationale: この箇所ではイエスに向けられた献身が語られ、称号としての意味を明示できる『メシア』を採用した。
- issue: ἁπλότης の意味
  choice: ひたむきさ
  alternative: 誠実さ／純一さ
  rationale: メシアへの分裂のない献身という文脈を表し、単なる単純さとの誤解を避けた。
- issue: καὶ τῆς ἁγνότητος の本文採否
  choice: 『と純潔さ』を本文に含める
  alternative: 省く
  rationale: 指定された SBLGNT 本文に従って訳出し、一部写本の省略は脚注で示した。
- issue: φθαρῇ の受動性
  choice: 堕落させられる
  alternative: 堕落する／惑わされる
  rationale: 本文の受動態と、思いが損なわれるという意味を保持し、欺きとの区別も残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの切迫した懸念と創世記への言及にふさわしい品位を保った。長いギリシャ語文の論理関係を維持しつつ、日本語では二文に分けて可読性を高めた。
