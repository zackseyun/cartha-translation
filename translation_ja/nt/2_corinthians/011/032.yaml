lexical_decisions:
- source_word: ἐν Δαμασκῷ
  choice: ダマスコで
  rationale: ἐν＋与格の場所を表す用法を、自然な現代日本語で示した。
- source_word: ἐθνάρχης
  choice: 民族統治者
  rationale: 特定の民または地域を治める歴史的称号としての意味を保ち、「総督」など別の官職名に同化させないため。
- source_word: Ἁρέτα τοῦ βασιλέως
  choice: アレタ王の配下の
  rationale: 属格が示す所属・従属関係を、日本語で明確かつ自然に表した。
- source_word: ἐφρούρει
  choice: 見張っていました
  rationale: 未完了過去の継続的な動作を表し、捕縛を目的として町を監視していた文脈にも合う。
- source_word: τὴν πόλιν Δαμασκηνῶν
  choice: ダマスコ人の町
  rationale: 原文の属格複数「ダマスコ人たちの」を保ち、単に「ダマスコの町」と均してしまわないようにした。
- source_word: πιάσαι με
  choice: 私を捕らえようとして
  rationale: 不定詞の目的用法を示し、πιάζωの広い捕捉の意味を「逮捕」と限定せずに訳した。
