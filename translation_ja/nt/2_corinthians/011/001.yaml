  text: Ὄφελον ἀνείχεσθέ μου μικρόν ⸀τι ⸀ἀφροσύνης· ἀλλὰ καὶ ἀνέχεσθέ μου.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/001.yaml
  text: I wish you would bear with me in a little foolishness[a]. But indeed[b], do bear with me.
translation:
  language: ja
  text: どうか、私の少しばかりの愚かさ[a]を我慢してください。いや、どうか私を我慢してください[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「少しばかりの愚行」。
    reason: lexical_alternative
  - marker: b
    text: または「私に付き合ってください」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὄφελον
  choice: どうか〜してください
  rationale: 実現を願う語気を、現代日本語の自然な懇願として表した。
- source_word: ἀνείχεσθέ / ἀνέχεσθέ（ἀνέχομαι）
  choice: 我慢してください
  rationale: 相手の言動を忍耐して受け入れる意味を保ち、二度の反復も訳文に反映した。
- source_word: μου
  choice: 私の〜を／私を
  rationale: 最初は属格に続く構文に合わせて「私の少しばかりの愚かさ」、後半は動詞の対象として「私を」と自然に表した。
- source_word: μικρόν τι
  choice: 少しばかりの
  rationale: 量を控えめに述べる修辞的な含みを保った。
- source_word: ἀφροσύνης
  choice: 愚かさ
  rationale: パウロがこれから行う誇りを逆説的かつ自嘲的に呼ぶ表現を、平明に保持した。
- source_word: ἀλλὰ καὶ
  choice: いや、どうか
  rationale: 先の願いを受けて強く言い直す機能を自然な日本語で示した。「しかし実際」のように論理的対立を過度に強めない。
theological_decisions:
- issue: パウロが自らの語りを「愚かさ」と呼ぶ修辞
  choice: 「愚かさ」をそのまま保持する
  alternative: 「愚かな話」「ばかげたこと」
  rationale: 後続する逆説的な誇りの導入としての緊張を残し、軽薄な口調や説明的な解釈を避けた。
- issue: 後半の ἀλλὰ καὶ の関係
  choice: 「いや」で願いを強めて言い直す
  alternative: 「しかし実際」「それでも」
  rationale: 単純な逆接に固定せず、先行する願いを再開・強調する可能性を反映した。
translation_notes:
  register: 明瞭な現代標準語。懇願の語調と「愚かさ」の自嘲的・逆説的な響きを保ちつつ、二度の ἀνέχομαι を反復して原文の修辞を示した。
