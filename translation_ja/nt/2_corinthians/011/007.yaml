id: 2CO.11.7
reference: 2 Corinthians 11:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἢ ἁμαρτίαν ἐποίησα ἐμαυτὸν ταπεινῶν ἵνα ὑμεῖς ὑψωθῆτε, ὅτι δωρεὰν τὸ τοῦ θεοῦ εὐαγγέλιον εὐηγγελισάμην ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/007.yaml
  text: Or did I commit a sin by humbling myself so that you might be exalted[b][a], because I proclaimed the gospel of God to you free of charge?
translation:
  language: ja
  text: それとも、あなたがたが高くされるように私が自分を低くし、神の福音を無償で[a]あなたがたに告げ知らせたことで、罪を犯したのでしょうか[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「報酬を受けずに」。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「罪を行ったのでしょうか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἢ
  choice: それとも
  rationale: 直前の議論を受ける修辞的な選択疑問を、簡潔で自然な日本語で示す。
- source_word: ἁμαρτίαν ἐποίησα
  choice: 罪を犯したことだったのでしょうか
  rationale: 直訳的には「罪を行った」だが、日本語の自然な慣用表現を用い、道徳的・宗教的な「罪」という範疇を保つ。
- source_word: ἐμαυτὸν ταπεινῶν
  choice: 自分を低くして
  rationale: 再帰的意味と、後続の「高くされる」との身分・評価上の対照を明瞭に保つ。
- source_word: ἵνα ὑμεῖς ὑψωθῆτε
  choice: あなたがたが高くされるように
  rationale: 目的を表すἵναと受動態を保持し、ταπεινόωとの修辞的対照を再現する。
- source_word: ὅτι
  choice: すなわち
  rationale: ここでは、想定上の「罪」が何であったかを説明する内容提示として理解し、日本語で関係が明確になるようにした。「というのも」も可能だが、疑問文全体との接続がやや曖昧になる。
- source_word: δωρεὰν
  choice: 無償で
  rationale: 金銭的対価を受けずに、という文脈上の意味を、簡潔で品位ある現代日本語で表す。
- source_word: τὸ τοῦ θεοῦ εὐαγγέλιον
  choice: 神の福音
  rationale: 属格構文を自然に保ち、パウロ書簡で重要な「福音」という語を用いる。
- source_word: εὐηγγελισάμην ὑμῖν
  choice: あなたがたに告げ知らせた
  rationale: εὐαγγελίζωの宣言行為を自然な日本語で表し、「福音を宣べ伝える」よりも一般読者に明瞭な表現とした。
theological_decisions:
- issue: パウロの無償の宣教と自己卑下をめぐる修辞的疑問
  choice: 「罪を犯したことだったのでしょうか」と問いをそのまま保ち、皮肉を説明的に増補しない。
  alternative: 使徒として報酬を受ける権利を放棄した、または牧会者への報酬一般を否定した、と明示する。
  rationale: ギリシア語本文は、自己を低くし無償で福音を告げたことが罪だったのかと鋭く問うが、奉仕者への報酬に関する一般教理まではこの節自体で明言していないため。
- issue: 「低くする」と「高くされる」の対照
  choice: 身分・評価の逆転を示し得る「低くして／高くされる」を採用する。
  alternative: 内面的な謙遜だけに限定して「へりくだる／栄誉を受ける」とする。
  rationale: ταπεινόωとὑψόωの対照は明白だが、ここでの具体的含意を内面、社会的地位、経済状態のいずれか一つに限定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、修辞的な鋭さと「低くする／高くされる」の対照を保持した。「無償で」は口語的すぎず、金銭的対価がないことを端的に表す。すべての脚注記号を本文中に配置した。
