  text: καὶ οὐ ⸀θαῦμα, αὐτὸς γὰρ ὁ Σατανᾶς μετασχηματίζεται εἰς ἄγγελον φωτός·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/014.yaml
  text: And no wonder[a], for Satan himself disguises himself as an angel of light.
translation:
  language: ja
  text: それも不思議ではありません。サタン自身が光の天使を装う[a]のですから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「光の天使の姿に変わる」。ギリシア語の動詞は、字義的には「姿を変える」とも訳せるが、ここでは人を欺く外見を取ることを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ οὐ θαῦμα
  choice: それも驚くには当たりません
  rationale: καὶで前節とのつながりを保ちつつ、οὐ θαῦμαを現代日本語で自然な慣用表現にした。単なる感情ではなく、「意外なことではない」という判断を表す。
- source_word: αὐτὸς ... ὁ Σατανᾶς
  choice: サタン自身
  rationale: 強意用法のαὐτόςを「自身」で明示した。固有名詞に伴う冠詞は、日本語では特に訳出しない。
- source_word: γὰρ
  choice: のですから
  rationale: 前半が驚くべきでない理由を示す説明関係を、自然な日本語の文末表現で示した。
- source_word: μετασχηματίζεται εἰς
  choice: を装う
  rationale: 直訳的には「姿を変えて～になる」だが、直前から続く欺きの文脈では、外見や役割を偽ってそのように見せる意味が中心であるため、「装う」とした。語のより字義的な可能性は脚注に残した。
- source_word: ἄγγελον φωτός
  choice: 光の天使
  rationale: 超自然的存在を指す文脈なのでἄγγελοςを「天使」とし、属格φωτόςの比喩的表現を「光の」と簡潔に保った。
theological_decisions:
- issue: サタンの変化が何を意味するか
  choice: 欺くために光の天使のように見せる外面的な装いとして訳す
  alternative: 実際に光の天使へと姿を変えることとして訳す
  rationale: μετασχηματίζεταιは形や外観の変化を表し得るが、偽使徒について論じる直近の文脈は欺瞞的な自己提示を強調している。ただし、動詞そのものが持つ「姿を変える」という表現上の幅を脚注で示し、形而上学的な断定は避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「それも」で前節からの流れを示し、「驚くには当たりません」でοὐ θαῦμαの簡潔な判断を自然に表現した。
