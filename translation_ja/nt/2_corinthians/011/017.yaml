source:
  edition: SBLGNT
  text: ὃ λαλῶ οὐ ⸂κατὰ κύριον λαλῶ⸃, ἀλλ’ ὡς ἐν ἀφροσύνῃ, ἐν ταύτῃ τῇ ὑποστάσει τῆς καυχήσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/017.yaml
  text: What I am saying[a], I am not saying according to the Lord, but as in foolishness[c][b], in this confidence of boasting.
translation:
  language: ja
  text: 私が言っていることは、主に従って言うのではありません[a]。むしろ、愚かさのうちにある者のように、この誇りについての確信をもって言うのです[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「主からの言葉として言うのではなく」「主の基準に従って言うのではなく」。
    reason: alternative_reading
  - marker: b
    text: 「愚か者のように言うのです」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「確信」と訳したギリシア語は、ここでは「事柄」「根拠」「企て」を意味する可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ λαλῶ
  choice: 私が今言っていること
  rationale: 関係代名詞が導く現在の発言内容を自然な日本語で表し、現在形の継続的な響きを「今」で示した。
- source_word: οὐ κατὰ κύριον λαλῶ
  choice: 主に従って言うのではなく
  rationale: κατά＋対格の規範・基準の意味を保ちつつ、主の模範・仕方・権威のいずれかに限定しない表現とした。
- source_word: ἀλλ’ ὡς ἐν ἀφροσύνῃ
  choice: 愚かさの中にいるかのように言うのです
  rationale: ὡς と ἐν の比喩的・様態的な含みを残し、パウロが自分を端的に「愚か者」と断定する訳にはしなかった。
- source_word: ἐν ταύτῃ τῇ ὑποστάσει
  choice: このように……確信をもって
  rationale: 難解な ὑπόστασις を文脈上の確信ある姿勢として訳した。一方、「根拠」「事柄」などの可能性は注記した。
- source_word: τῆς καυχήσεως
  choice: 誇る確信
  rationale: 属格を日本語として自然につなぎ、καύχησις の動作性を「誇る」で保った。
theological_decisions:
- issue: 「主に従って」（κατὰ κύριον）の指示内容と効力
  choice: これから行う誇り方が主の規範・あり方に従うものではない、とパウロが述べているとの幅を保つ。
  alternative: 主から直接授けられた言葉ではない、または主の命令・引用ではない、という意味。
  rationale: 本文だけでは、規範、仕方、権威のどれに重点があるか断定できない。霊感や発言の真実性を否定する意味に狭めず、原文の神学的緊張を保った。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある語調。原文の反復する λαλεῖν は日本語でも「言っている／言う」で保った。ὑπόστασις の難しさと κατὰ κύριον の曖昧さは本文で過度に解消せず、注で代替訳を示した。
