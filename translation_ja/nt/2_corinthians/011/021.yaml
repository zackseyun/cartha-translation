  text: κατὰ ἀτιμίαν λέγω, ὡς ὅτι ἡμεῖς ⸀ἠσθενήκαμεν· ἐν ᾧ δ’ ἄν τις τολμᾷ, ἐν ἀφροσύνῃ λέγω, τολμῶ κἀγώ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/021.yaml
  text: I say this to our shame[a], as though we had been weak[d][c][b]. Yet in whatever anyone dares to boast—I am speaking foolishly—I also dare.
translation:
  language: ja
  text: 恥を承知で言いますが、まるで私たちが弱かったかのようです[a]。しかし、だれかが何かのことであえて誇るなら――愚かなことを言いますが――私もあえて誇ります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「不名誉なこととして言いますが、私たちが弱かったかのようです」。ギリシア語の表現は解釈が難しく、文脈では皮肉を込めた言い方と理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ ἀτιμίαν
  choice: 恥をさらすようですが
  rationale: 直訳的な「不名誉に従って」では意味が通りにくいため、パウロ側の面目を失わせるような発言であるという修辞的な含みを、自然な現代日本語で表した。
- source_word: ὡς ὅτι ἡμεῖς ἠσθενήκαμεν
  choice: 私たちは弱かった、とでも言うほかありません
  rationale: ὡς ὅτι の距離を置いた提示と文脈上の皮肉を「とでも」で示し、完了形は過去を振り返る「弱かった」とした。
- source_word: ἐν ᾧ δ’ ἄν τις τολμᾷ
  choice: だれかが何かについてあえて誇るのなら
  rationale: ἐν ᾧ は大胆さを示す事柄・領域を指すため「何かについて」とした。τολμᾷ 自体の意味は「あえてする」だが、前後の誇りの文脈から目的語「誇る」を補った。
- source_word: ἐν ἀφροσύνῃ λέγω
  choice: 愚かな言い方をしますが
  rationale: パウロの挿入的な自己限定を、自然で簡潔な日本語として再現した。本人そのものを「愚か者」と断定せず、発言の修辞的な愚かさに焦点を置いた。
- source_word: τολμῶ κἀγώ
  choice: 私もあえて誇ります
  rationale: 先行する τολμᾷ との反復を「あえて」で保ち、日本語では目的語がないと不明瞭になるため、文脈上暗示される「誇る」を明示した。
theological_decisions:
- issue: パウロたちの「弱さ」をめぐる修辞的皮肉
  choice: 「弱かった、とでも言うほかありません」と、他者の評価を皮肉に受け入れる言い方にする
  alternative: 「私たちは弱かったようです」と率直な自己評価として訳す
  rationale: 周辺の「愚かな誇り」の議論では、パウロは競争相手との比較を皮肉に扱っている。使徒として実際に劣っていたとの断定を加えず、同時に原文の曖昧な修辞性を残すためである。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの皮肉、挿入句、反復を保った。「恥をさらす」は口語に寄りすぎない範囲で修辞的な不名誉を伝え、「あえて誇る」を反復して節後半の対称性を示した。
