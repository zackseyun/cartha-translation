  text: χωρὶς τῶν παρεκτὸς ἡ ⸀ἐπίστασίς ⸀μοι ἡ καθ’ ἡμέραν, ἡ μέριμνα πασῶν τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/028.yaml
  text: 'Apart from such external things[c][b][a], there is the daily pressure on me: concern for all the churches.'
translation:
  language: ja
  text: これらとは別に[a]、日ごとに私にのしかかる重圧がある[b]。それは、すべての教会への気遣いである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのほかのことは別として」、または「まだ述べていないことは別として」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「日ごとに私に押し迫るもの」。別訳「私に日々かかる重圧」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「すべての教会についての心配」または「すべての教会への配慮」。
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς τῶν παρεκτὸς
  choice: そのほかの事柄は別として
  rationale: 直前まで列挙された苦難以外の事柄、またはなお述べられていない事柄を指し得る句である。「そのほかの事柄は別として」は、何を指すかを狭く限定せず、χωρίς＋属格の除外・分離の意味を自然な日本語で表す。
- source_word: ἐπίστασίς μοι
  choice: 私には……押しかかる重荷がある
  rationale: ἐπίστασιςの「押し迫ること、圧力」の像と、与格μοιの「私に」を生かした。字義的な群衆の殺到ではなく、後続の「すべての教会を思う心」が説明する継続的な重圧として訳した。
- source_word: ἡ καθ’ ἡμέραν
  choice: 日々
  rationale: 毎日繰り返されることを示す冠詞付き前置詞句を、簡潔で自然な「日々」とした。
- source_word: ἡ μέριμνα
  choice: 思う心
  rationale: μέριμναには「心遣い、懸念、不安」の幅がある。ここでは諸教会への牧会的な気遣いと精神的重圧の双方を含ませつつ、罪深い不安だと断定しない表現を選んだ。
- source_word: πασῶν τῶν ἐκκλησιῶν
  choice: すべての教会
  rationale: パウロ書簡でのἐκκλησίαは通常、キリスト者の共同体・諸教会を指す。μέριμναとの属格関係は日本語では「すべての教会を思う」と自然に表した。
theological_decisions:
- issue: μέριμναが表すパウロの牧会的重圧
  choice: すべての教会を思う心
  alternative: すべての教会についての不安
  rationale: 諸教会への深い気遣いと重荷を表しながら、それを道徳的に否定されるべき「不安」と決めつけない。原語にある感情的な重さは、直前の「押しかかる重荷」と合わせて保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの列挙調から内面的・牧会的な重圧への転換が伝わるよう二文に分けた。「重荷」は文脈上の比喩的圧力を自然に示し、「思う心」は牧会的配慮と懸念の幅を保つ。
