lexical_decisions:
- source_word: ἄλλας ἐκκλησίας
  choice: ほかの諸教会
  rationale: パウロ書簡でἐκκλησίαは通常、地域のキリスト者共同体を指す。「諸教会」として複数形も明示した。
- source_word: ἐσύλησα
  choice: 奪い取り
  rationale: 「略奪する、奪い取る」という強い語感を保ち、他教会から支援を受けたことを述べるパウロの意図的な誇張・皮肉を弱めない。
- source_word: λαβὼν
  choice: 受けて
  rationale: アオリスト分詞を付帯状況または手段として自然に表し、何をもって「奪い取った」と言うのかを示す。
- source_word: ὀψώνιον
  choice: 報酬
  rationale: 兵士への給与・糧食から派生して賃金や報酬を表す語である。「報酬」は語義を保ちながら、雇用契約を過度に連想させにくい。文脈上の意味である生活支援は脚注に示した。
- source_word: πρὸς τὴν ὑμῶν διακονίαν
  choice: あなたがたに仕えました
  rationale: πρόςと対格がここで表す目的を日本語の文全体で自然に示し、διακονίαの奉仕という意味と、奉仕を受ける相手がコリントの人々であることを明確にした。
theological_decisions:
- issue: 他教会から金銭的支援を受けたことを「奪った」と表す修辞
  choice: 「奪い取り」という強い比喩を本文に残す
  alternative: 「ほかの教会から支援を受け」と穏やかに言い換える
  rationale: 文脈は実際の窃盗の告白ではなく、コリントで無償奉仕をするため他教会から援助を受けたことを鋭い誇張と皮肉で述べている。表現を弱めると原文の修辞的緊張が失われる。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、パウロの挑発的な修辞を保った。「奪い取り」は強いが現代の読者にも理解でき、「報酬」は文脈に適した格調を保つ。
