id: 2CO.11.6
reference: 2 Corinthians 11:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ἰδιώτης τῷ λόγῳ, ἀλλ’ οὐ τῇ γνώσει, ἀλλ’ ἐν παντὶ ⸀φανερώσαντες ἐν πᾶσιν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/006.yaml
  text: But even if I am unskilled in speech[a], I am not in knowledge; indeed[c][b], in every way we have made this plain among all to you.
translation:
  language: ja
  text: たとえ私が話し方に熟達していなくても[a]、知識において未熟なのではありません。むしろ、私たちはあらゆる点で、すべてのことにおいて、あなたがたにそれを明らかにしてきました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「話し方の訓練を受けていなくても」。洗練された修辞や雄弁の技術に欠ける、という意味。
    reason: lexical_alternative
  - marker: b
    text: 原文は簡潔で、「私たちは、あらゆる点で、あなたがたの間ですべての人にそれを明らかにしました」などとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδιώτης τῷ λόγῳ
  choice: 話すことには未熟
  rationale: ἰδιώτηςはこの文脈では一般的な無知ではなく、訓練された雄弁さや修辞的洗練の不足を指す。自然な現代日本語でその限定された意味を表した。
- source_word: γνώσει
  choice: 知識において
  rationale: 話し方との対比を保ち、パウロが内容上の知識まで欠いているわけではないと述べる構造を明示した。
- source_word: φανερώσαντες
  choice: 明らかにしてきました
  rationale: 形はアオリスト分詞だが、ここでは自分たちがその事実を明白に示したという主節的な働きをする。これまでの実証を自然に伝えるため「してきました」とした。
- source_word: ἐν παντί
  choice: あらゆる点で
  rationale: 包括性を表す副詞的表現として訳し、方法・観点の広がりを示した。
- source_word: ἐν πᾶσιν
  choice: すべてのことにおいて
  rationale: 人々を指す可能性もある圧縮された表現だが、本文では形を過度に限定せず、事柄・状況を広く含み得る訳を採用した。
- source_word: εἰς ὑμᾶς
  choice: あなたがたに
  rationale: 明らかに示す行為がコリントの信徒たちに向けられていることを、自然な日本語で表した。
theological_decisions:
- issue: パウロの話す能力についての自己評価
  choice: 洗練された話術には未熟だと譲歩しているが、知識の不足は否定している
  alternative: 一般的に無学であると認めている、または全面的な皮肉であって何の不足も認めていない
  rationale: 「話すこと」と「知識」の明示的な対比に従い、権威や真理の欠如ではなく修辞的技能の問題として訳した。
- issue: ἐν παντί … ἐν πᾶσιν の範囲
  choice: 「あらゆる点で、すべてのことにおいて」と重ねて訳す
  alternative: 「あらゆる点で、すべての人の前で」または「何事につけても」と一つにまとめる
  rationale: 原文の二つの類似表現とその曖昧さを本文にできるだけ保ち、人を指す可能性は脚注で示した。
translation_notes:
  register: 明瞭で現代的ながら品位のある敬体。原文の「話すこと／知識」の対比と、末尾の二つの包括表現が持つ重なりおよび曖昧さを保った。
