id: 2CO.11.13
reference: 2 Corinthians 11:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι ψευδαπόστολοι, ἐργάται δόλιοι, μετασχηματιζόμενοι εἰς ἀποστόλους Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/013.yaml
  text: For such men are false apostles[a], deceitful workers, disguising themselves as apostles of Messiah.
translation:
  language: ja
  text: というのも、こういう者たちは偽使徒であり、人を欺く働き人であって、「メシアの使徒」[a]を装っているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリストの使徒」。ギリシア語Χριστόςは称号の意味を表して「メシア」とも、名称として定着した「キリスト」とも訳せる。
    reason: 称号としての意味と名称的な用法の双方が訳語に反映されうるため。
lexical_decisions:
- source_word: γὰρ
  choice: というのも
  rationale: 直前の議論を説明する接続関係を、現代日本語で自然に示す。
- source_word: οἱ τοιοῦτοι
  choice: こういう者たち
  rationale: 直前までに述べられた特定の種類の人々を指す表現として、明確で自然である。
- source_word: ψευδαπόστολοι
  choice: 偽使徒
  rationale: 使徒であると偽る者を表す複合語の意味を、簡潔かつ慣用的に伝える。
- source_word: ἐργάται δόλιοι
  choice: 人を欺く働き人
  rationale: δόλιοιが表す欺瞞的な性質を明示しつつ、ἐργάταιの比喩を保つ。
- source_word: μετασχηματιζόμενοι
  choice: 装っている
  rationale: 内面的な変化ではなく、外見や身分を偽って見せる自己呈示を文脈に即して表す。
- source_word: εἰς ἀποστόλους Χριστοῦ
  choice: 「メシアの使徒」を
  rationale: εἰςはここでは装う身分・役割を示す。Χριστόςの称号としての意味を「メシア」で保つ。
theological_decisions:
- issue: Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この属格句では、遣わす方・代表される方としての称号の意味が保たれているため「メシア」とした。一方、日本語で名称化した「キリスト」も可能なので脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの厳しい非難と三つの叙述の重なりを保った。「働き人」は聖書的比喩を残しつつ一般読者にも理解できる表現とした。
