  text: διὰ τί; ὅτι οὐκ ἀγαπῶ ὑμᾶς; ὁ θεὸς οἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/011.yaml
  text: Why? Because I do not love you? God knows I do.
translation:
  language: ja
  text: なぜでしょうか。私があなたがたを愛していないからでしょうか。神はご存じです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は、「神は、私があなたがたを愛していることをご存じです」という意味。原文は単に「神はご存じです」として、知っている内容を明示していません。
    reason: 原文の省略表現と、文脈上含意される答えの両方を示すため。
lexical_decisions:
- source_word: διὰ τί
  choice: なぜでしょうか
  rationale: 理由を問う簡潔な疑問表現。直前の文脈を受ける修辞的な問いとして、現代日本語で自然かつ丁寧にした。
- source_word: ὅτι
  choice: 〜からでしょうか
  rationale: 先行する「なぜ」に対する理由を疑問の形で提示しているため、因果関係と修辞的な響きをともに表す。
- source_word: οὐκ ἀγαπῶ ὑμᾶς
  choice: 私があなたがたを愛していない
  rationale: 否定、主語、目的語を明示し、ἀγαπάωを標準的に「愛する」と訳した。
- source_word: ὁ θεὸς
  choice: 神
  rationale: θεόςの標準的な訳語。
- source_word: οἶδεν
  choice: ご存じです
  rationale: 原文は目的内容を明示せず単に「知っている」と述べる。日本語でもその省略を保ちつつ、神への敬意を自然な敬語で示した。
theological_decisions:
- issue: 最後の「神は知っている」に、パウロが彼らを愛しているという内容を補うか
  choice: 神がご存じです。
  alternative: 神は、私があなたがたを愛していることをご存じです。
  rationale: ギリシア語は ὁ θεὸς οἶδεν とだけ述べ、知っている内容を明示していない。文脈上の含意は明らかだが、原文の省略と修辞的余韻を本文に残し、注で補足する。
translation_notes:
  register: 明瞭で現代的な標準日本語。「でしょうか」を用いて連続する修辞疑問を自然に表し、結びは原文の簡潔さと含みを保持した。
