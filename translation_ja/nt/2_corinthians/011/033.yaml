lexical_decisions:
- source_word: θυρίδος
  choice: 窓
  rationale: 小さな窓または開口部を指す。ここでは自然で具体的な「窓」とした。
- source_word: σαργάνῃ
  choice: 籠
  rationale: 縄や枝などを編んで作った容器を指すが、材質は特定できないため、本文では明瞭な「籠」とし、語の含意を脚注に残した。
- source_word: ἐχαλάσθην
  choice: つり降ろされ
  rationale: 受動形で、縄などを用いて下へ降ろされたことを表す。「つり降ろされ」は場面を明確かつ自然に伝える。
- source_word: διὰ τοῦ τείχους
  choice: 城壁を通して
  rationale: τείχοςはここでは都市を囲む防御壁を指す文脈であり、窓のある城壁を経由して降ろされたことを表す。前置詞句の反復も可能な範囲で保持した。
- source_word: ἐξέφυγον τὰς χεῖρας αὐτοῦ
  choice: 彼の手を逃れました
  rationale: 支配や捕縛を免れたというギリシア語の比喩的で生き生きした表現を保った。
