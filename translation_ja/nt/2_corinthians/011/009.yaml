  text: καὶ παρὼν πρὸς ὑμᾶς καὶ ὑστερηθεὶς οὐ κατενάρκησα οὐθενός· τὸ γὰρ ὑστέρημά μου προσανεπλήρωσαν οἱ ἀδελφοὶ ἐλθόντες ἀπὸ Μακεδονίας· καὶ ἐν παντὶ ἀβαρῆ ⸂ἐμαυτὸν ὑμῖν⸃ ἐτήρησα καὶ τηρήσω.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/009.yaml
  text: And when I was present with you and was in need[a], I was not a burden to anyone; for the brothers who came from Macedonia supplied what I lacked. And in everything I kept myself from being a burden to you[b], and will keep doing so.
translation:
  language: ja
  text: また、あなたがたのもとにいた時、困っていた時にも、私はだれにも負担をかけませんでした。私に足りないものは、マケドニアから来た兄弟たち[a]が補ってくれたからです。私は、どんな場合にもあなたがたの重荷にならないようにしてきましたし、これからもそうします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は男性複数形の語の訳です。パウロはこの語を信者一般について広く用いることもありますが、ここではマケドニアから来た特定の同労者たちを指す可能性が高いと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρὼν πρὸς ὑμᾶς
  choice: あなたがたのもとにいた時
  rationale: 分詞を状況・時を表すものとして自然な日本語にし、パウロが実際に彼らのところに滞在していたことを保った。
- source_word: ὑστερηθεὶς
  choice: 困窮しても
  rationale: 文脈上の物質的な不足を簡潔に表す。「必要が生じても」より切迫した欠乏の含みを伝える。
- source_word: οὐ κατενάρκησα οὐθενός
  choice: だれにも負担をかけませんでした
  rationale: καταναρκάωの、特に金銭面で人に重荷を負わせるという文脈上の意味を自然に表す。
- source_word: τὸ ὑστέρημά μου
  choice: 私に足りないもの
  rationale: 抽象的な「不足」だけでなく、実際に欠けていた必要物を指し得る表現として原文の幅を保つ。
- source_word: προσανεπλήρωσαν
  choice: 補ってくれた
  rationale: 不足分を満たす、埋め合わせるという複合動詞の意味を、前後と滑らかにつながる日本語で表す。
- source_word: οἱ ἀδελφοὶ
  choice: 兄弟たち
  rationale: 原文の男性複数形を保持した。この箇所ではマケドニアから来た特定の同労者たちを指す可能性が高い。
- source_word: ἐλθόντες ἀπὸ Μακεδονίας
  choice: マケドニアから来た
  rationale: アオリスト分詞を日本語で自然な連体修飾にし、来訪元を明示した。
- source_word: ἐν παντί
  choice: 何事においても
  rationale: 行動全般に及ぶ広い範囲を、やや格調を保ちながら明瞭に表す。
- source_word: ἀβαρῆ ἐμαυτὸν ὑμῖν
  choice: あなたがたの重荷とならないよう自分を保って
  rationale: 直訳的な「重荷でない自分」では不自然なため、金銭的・関係的な負担にならない状態を維持したという意味を明示した。
- source_word: ἐτήρησα καὶ τηρήσω
  choice: 自分を保ってきましたし、これからもそうします
  rationale: 過去に維持してきた方針と将来も維持する決意の双方を自然な時制で表した。
theological_decisions:
- issue: ἀδελφοὶの性別表現
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信徒たち
  rationale: 語形は男性複数であり、この文脈ではマケドニアから来た特定の男性同労者を指す可能性が高いので、中性化せず本文に保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「何事においても」「重荷とならない」など、書簡にふさわしい dignified な調子を保った。原文の二つの負担表現は、日本語で過度に反復的にならない範囲で「負担をかける」と「重荷となる」に訳し分けた。
