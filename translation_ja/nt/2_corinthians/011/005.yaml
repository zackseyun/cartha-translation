  text: For I consider that I am not in the least inferior to those super-apostles[a].
translation:
  language: ja
  text: というのも、私は、あの並外れて偉大な使徒たち[a]に少しも劣ってはいないと考えているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「最も優れた使徒たち」。ギリシア語の表現は、皮肉を込めて「並外れて偉大な使徒たち」と言っているとも、非常に高く評価されている使徒たちを率直に指しているとも読める。
    reason: alternative_reading
lexical_decisions:
- source_word: λογίζομαι
  choice: 考えている
  rationale: 熟慮に基づく判断を表す語であり、「思う」より評価的な響きを保ちつつ、現代日本語として自然である。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 直前の発言を説明し、根拠づける接続関係を明確かつ自然に示す。
- source_word: μηδὲν
  choice: 少しも……ない
  rationale: ここでは不定詞を強め、「何一つ劣らない」「全く劣らない」という強意を自然な日本語で表す。
- source_word: ὑστερηκέναι
  choice: 劣ってはいない
  rationale: 比較対象に対して不足する、後れを取るという意味を、この文脈に即して簡潔に表す。完了形が示す現在に及ぶ状態も、日本語の述語表現に含ませた。
- source_word: τῶν ὑπερλίαν ἀποστόλων
  choice: あの大使徒たち
  rationale: ὑπερλίανの「並外れて、非常に」という強い表現を「大使徒」で簡潔に表し、文脈上あり得る皮肉を感じさせながらも、引用符や「自称」などを加えて解釈を固定しない。「あの」は既知の比較対象を自然に指すための補いである。
theological_decisions:
- issue: τῶν ὑπερλίαν ἀποστόλωνが、パウロの論敵を皮肉に呼ぶ表現か、著名な使徒たちへの率直な言及か
  choice: 本文を「あの大使徒たち」とし、皮肉の可能性を保ちながら断定しない。
  alternative: 「最も優れた使徒たち」または「非常に著名な使徒たち」として、率直な敬称と解する。
  rationale: 第二コリント11章の論争的文脈は皮肉を強く示唆するが、ギリシア語の句そのものは率直な高評価としても読める。そのため本文では簡潔で両義性をある程度保てる表現を用い、別解を脚注に示す。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、パウロの論証的でやや鋭い調子を保った。「というのも……からです」は説明の接続を自然に示し、「少しも劣ってはいない」で強調を再現した。
