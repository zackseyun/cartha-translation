id: 2CO.11.15
reference: 2 Corinthians 11:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ μέγα οὖν εἰ καὶ οἱ διάκονοι αὐτοῦ μετασχηματίζονται ὡς διάκονοι δικαιοσύνης, ὧν τὸ τέλος ἔσται κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/015.yaml
  text: So it is no great thing if his servants also disguise themselves as servants of righteousness[a], whose end will be according to their works.
translation:
  language: ja
  text: ですから、彼に仕える者たちが、義に仕える者たちを装うとしても、驚くことではありません。彼らの結末は、その行いに応じたものとなるでしょう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μέγα
  choice: 驚くには当たりません
  rationale: 直訳的には「大したことではない」だが、ここでは前節を受けて「驚くべきことではない」という意味。現代日本語として自然に表した。
- source_word: οὖν
  choice: ですから
  rationale: 前節でサタン自身が光の御使いを装うと述べたことからの推論を明示する。
- source_word: οἱ διάκονοι αὐτοῦ
  choice: 彼に仕える者たち
  rationale: διάκονοι はここではサタンの配下として働く者を指す。「奉仕者」よりも関係が明確で、教会職制を不必要に連想させない。
- source_word: μετασχηματίζονται
  choice: 装っている
  rationale: 内面的な変容ではなく、外見や見せかけを変えて偽ることを表す。前節との語彙的つながりにも適する。
- source_word: ὡς διάκονοι δικαιοσύνης
  choice: 義に仕える者を
  rationale: 属格を「義に奉仕する者」という関係で自然に表現した。彼らが正しい側に立つ者として見せかける文脈を保つ。
- source_word: τὸ τέλος
  choice: 最期
  rationale: 単なる成り行きではなく、裁きにおける終局的な結末を指すため「最期」とした。
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: その行いに応じたもの
  rationale: 結末が彼らの行為に対応するという裁きの定型的意味を、自然な現代日本語で示す。
theological_decisions:
- issue: δικαιοσύνης の訳語
  choice: 義
  alternative: 正義
  rationale: パウロ書簡における語彙的連続性と、ここでの道徳的・宗教的な正しさの広い含意を保つため「義」とした。「正義」は社会的・司法的公正に意味が狭まりやすい。文脈上の意味は「正しいことに仕える」と見せかけることとして本文から理解できる。
- issue: κατὰ τὰ ἔργα αὐτῶν が示す裁き
  choice: 彼らの結末が行いに対応することをそのまま述べる
  alternative: 特定の救済論的体系に沿って説明を補う
  rationale: 原文は終局と行いとの対応を述べるが、その仕組みを詳述しないため、神学的説明を本文に加えず緊張を保持した。
translation_notes:
  register: 明快な現代標準日本語による丁寧体。論理的接続と警告の厳粛さを保ちつつ、「大したことではない」のように誤解されうる直訳調を避けた。脚注を必要とする重大な本文異同や、日本語本文だけでは保持できない不可欠な曖昧さはないと判断した。
