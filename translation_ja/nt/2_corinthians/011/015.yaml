  to: ですから、彼に仕える者たちが、義に仕える者たちを装うとしても、驚くことではありません。彼らの結末は、その行いに応じたものとなるでしょう。
  rationale: 「最期」を、原文のτὸ τέλοςが表す終局的な結果を自然に伝える「結末」に改めた。また、ἔσταιの未来性を「となるでしょう」で示した。δικαιοσύνηは本文で一貫して「義」と訳し、代案となる「正義」を脚注に保持した。その他の構文と、サタンの配下が正しい側の奉仕者を装うという文脈は維持している。
