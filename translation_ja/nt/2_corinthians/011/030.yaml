id: 2CO.11.30
reference: 2 Corinthians 11:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ καυχᾶσθαι δεῖ, τὰ τῆς ἀσθενείας μου καυχήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/030.yaml
  text: If I must boast[a], I will boast in the things of my weakness.
translation:
  language: ja
  text: もし誇らなければならないのなら、私は自分の弱さにかかわる事柄を誇ります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より簡潔には、「私は自分の弱さを誇ります」。ギリシア語は直訳すると、「私は自分の弱さに属する事柄を誇ります」となります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ
  choice: もし～のなら
  rationale: 条件を表す形を保ち、文脈から「～なのだから」と因果的に決めつけないため。
- source_word: καυχᾶσθαι
  choice: 誇る
  rationale: パウロの逆説的な言い回しを自然な現代日本語で表し、「自慢する」ほど軽俗にせず、「誇りとする」ほど肯定的にも限定しないため。
- source_word: δεῖ
  choice: ～なければならない
  rationale: 非人称的な必要・やむを得なさの強さを明確に伝えるため。
- source_word: τὰ τῆς ἀσθενείας μου
  choice: 自分の弱さにかかわる事柄
  rationale: 中性複数の冠詞と属格句による「私の弱さに属する／関する事柄」という幅を保ち、単に「弱さ」と平板化しないため。
- source_word: ἀσθενείας
  choice: 弱さ
  rationale: 身体的な虚弱だけに限定せず、直前に列挙された屈辱や苦難を含みうる一般的で一貫した訳語。
- source_word: καυχήσομαι
  choice: 私は～を誇ります
  rationale: 未来形の意志・将来性を自然に表し、前半の「誇る」と語を反復して修辞的対応を保つため。
theological_decisions:
- issue: パウロの誇りの性質
  choice: 「自分の弱さにかかわる事柄を誇る」とし、弱さをめぐる逆説と修辞的緊張をそのまま残す。
  alternative: 「自分の弱さを誇ります」と簡潔かつ慣用的に訳す。
  rationale: 原文の τὰ と属格句が指す「弱さに属する事柄」の広がりを保ち、パウロの誇りを教理的説明によって先回りして解消しないため。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「弱さにかかわる事柄」はやや特徴的な原文表現を残しつつ、「弱さに属する事柄」より自然にした。脚注で慣用的な別訳と直訳を示す。
