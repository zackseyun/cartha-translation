id: 2CO.11.12
reference: 2 Corinthians 11:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὃ δὲ ποιῶ καὶ ποιήσω, ἵνα ἐκκόψω τὴν ἀφορμὴν τῶν θελόντων ἀφορμήν, ἵνα ἐν ᾧ καυχῶνται εὑρεθῶσιν καθὼς καὶ ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/012.yaml
  text: But what I am doing[a], I will continue to do, in order to cut off the opportunity from those who want an opportunity, so that in what they boast about they may be found to be just as we are.
translation:
  language: ja
  text: しかし、私が今していることは、これからも続けます。それは、足がかりを求めている者たちから、その足がかり[a]を断ち切り、彼らが誇っている点で、私たちと同じであると認められるようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「足がかり」は、二か所とも「機会」または「口実」とも訳せる（ギリシア語 ἀφορμή）。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃ δὲ ποιῶ καὶ ποιήσω
  choice: しかし、私が今していることは、これからも続けます
  rationale: 現在形と未来形の組み合わせが表す、パウロの現在の行動と今後もそれを続ける決意を、現代日本語で自然に示した。「しかし」は δέ の文脈上の対比を表す。
- source_word: ἐκκόψω
  choice: 断ち切り
  rationale: ἐκκόπτω の「切り落とす」という比喩的な強さを保ちつつ、機会や足がかりをなくすという意味で自然な日本語とした。
- source_word: ἀφορμή
  choice: 足がかり
  rationale: ἀφορμή は機会、きっかけ、口実などを表し得る。この論争的文脈では、相手が利用しようとする根拠や機会という幅を「足がかり」が自然に表す。二度の出現は反復して訳した。
- source_word: τῶν θελόντων ἀφορμήν
  choice: 足がかりを求めている者たち
  rationale: θέλω の意図性と、ἀφορμή の反復を明示した。原文の簡潔で鋭い言い回しを保つため、「求めている」と直接的に訳した。
- source_word: ἐν ᾧ καυχῶνται
  choice: 彼らが誇っている点で
  rationale: ἐν ᾧ が示す誇りの領域・事柄を「点で」と表し、具体的内容を訳文で限定しなかった。
- source_word: εὑρεθῶσιν καθὼς καὶ ἡμεῖς
  choice: 私たちと同じであると認められるように
  rationale: 受動形 εὑρεθῶσιν の「そうであると見いだされる」という意味を自然な日本語にした。比較の内容や皮肉の有無は明示せず、原文の含みを保った。
theological_decisions:
- issue: 相手が求める ἀφορμή の性質
  choice: 本文では比較的中立的な「足がかり」とする
  alternative: 「機会」「口実」
  rationale: 文脈は論争的だが、名詞そのものが必ずしも不正な「口実」に限定されるわけではない。否定的評価を過度に織り込まず、語義の幅を脚注に残した。
- issue: 「私たちと同じであると認められる」の含意
  choice: 比較の内容と評価を補足せず、そのまま保つ
  alternative: 相手が実際には同じでないことを示す皮肉として明示する
  rationale: この節は相手の主張、行動、あるいは待遇上の同等性を念頭に置く可能性があるが、本文だけでは比較の具体的内容や皮肉の方向を一義的に確定しないため、解釈を訳文に加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの断固とした調子を保った。「者たち」は論争的な文脈にふさわしい一定の格調を持たせるために採用した。原文にある ἀφορμή の反復は、日本語でも意図的に残した。
