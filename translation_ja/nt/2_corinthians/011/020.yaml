id: 2CO.11.20
reference: 2 Corinthians 11:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνέχεσθε γὰρ εἴ τις ὑμᾶς καταδουλοῖ, εἴ τις κατεσθίει, εἴ τις λαμβάνει, εἴ τις ἐπαίρεται, εἴ τις ⸂εἰς πρόσωπον ὑμᾶς⸃ δέρει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/020.yaml
  text: For you put up with it if someone enslaves you[a], if someone devours you, if someone takes from you, if someone exalts himself[b], if someone strikes you in the face.
translation:
  language: ja
  text: というのも、あなたがたは、だれかがあなたがたを奴隷にしても、だれかがあなたがたを食い物にしても、だれかがあなたがたから取っても[a]、だれかが高ぶっても、だれかがあなたがたの顔を殴っても、我慢しているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「取っても」。何を取るかは明記されていませんが、ここでは搾取的な意味と考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέχεσθε
  choice: 我慢している
  rationale: 現在形で、コリントの人々が実際に横暴な扱いを容認していることを表す。現代日本語として自然であり、文脈の皮肉な非難にも合う。
- source_word: γὰρ
  choice: というのも～からです
  rationale: 直前の発言を説明する接続関係を、日本語で明瞭かつ自然に示す。
- source_word: καταδουλοῖ
  choice: 奴隷にしても
  rationale: 人を隷属状態に置くという動詞の強い意味を弱めずに訳す。
- source_word: κατεσθίει
  choice: 食い物にしても
  rationale: 字義的には「食い尽くす」だが、ここでは人を搾取する比喩。「食い物にする」は捕食的・搾取的な像を保つ自然な日本語。
- source_word: λαμβάνει
  choice: 奪い取っても
  rationale: 目的語のない広義の「取る」。列挙された虐待行為の文脈から搾取的な取得を示しつつ、金銭など特定の対象には限定しない。
- source_word: ἐπαίρεται
  choice: 高ぶっても
  rationale: 自らを高くする、尊大に振る舞うという意味を簡潔に表す。明示されていない目的語を補わない。
- source_word: εἰς πρόσωπον ὑμᾶς δέρει
  choice: あなたがたの顔を殴っても
  rationale: 顔に打撃を加えるという具体的な侮辱を保つ。「平手打ち」と狭く限定せず、δέρειの強さも表す。
- source_word: εἴ τις
  choice: だれかが～しても
  rationale: 反復される条件節をそのまま残し、原文の畳みかける修辞を再現する。
theological_decisions:
- issue: パウロの発言の修辞的調子
  choice: 横暴な者たちを我慢するコリントの人々への皮肉な叱責として訳し、行為者の呼称は加えない。
  alternative: 本文中で行為者を「偽使徒」または「偽教師」と明示する。
  rationale: 文脈は皮肉と偽使徒への言及を示すが、この節自体は行為者を「だれか」とだけ述べているため、説明を本文へ持ち込まない。
- issue: λαμβάνει の搾取性
  choice: 「奪い取る」とし、搾取的な含みを示すが対象は特定しない。
  alternative: 中立的に「受け取る」とする、または具体化して「金を巻き上げる」とする。
  rationale: 語自体は広義だが、奴隷化、食い物にする、高ぶる、殴るという並行表現から敵対的・搾取的意味が強い。一方、何を取るかは原文にないため限定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、奴隷化、搾取、暴力という原文の強い表現と、条件節を反復する修辞を保持した。「食い物にする」はやや口語的だが、比喩の鮮烈さと搾取性を自然に伝える。
