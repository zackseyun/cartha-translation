  text: διάκονοι Χριστοῦ εἰσιν; παραφρονῶν λαλῶ, ὑπὲρ ἐγώ· ἐν κόποις περισσοτέρως, ἐν ⸂φυλακαῖς περισσοτέρως, ἐν πληγαῖς ὑπερβαλλόντως⸃, ἐν θανάτοις πολλάκις·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/023.yaml
  text: 'Are they servants of Messiah? I am speaking as if insane: I am more so—in labors more abundantly[a], in imprisonments more abundantly, in beatings beyond measure[b], in deaths often.'
translation:
  language: ja
  text: 彼らはメシアに仕える者なのですか。正気を失ったかのように言いますが、私は彼ら以上です。苦労したことは、はるかに多く、投獄されたことも、はるかに多く、打ちたたかれたことは並外れて多く、死に直面したことも幾度となくあります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「死の中にあることもしばしば」です。繰り返し死に瀕したこと、または命に関わる危険に遭ったことを指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: διάκονοι
  choice: 仕える者
  rationale: 奉仕する者を指す語。現代日本語で分かりやすく、教会の職名に狭めない表現とした。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは称号として機能しているため、その意味を明示する「メシア」とした。
- source_word: παραφρονῶν λαλῶ
  choice: 正気を失ったかのように言います
  rationale: パウロが自らの誇りを常軌を逸した発言になぞらえる表現を、比較的な響きを保って訳した。
- source_word: ὑπὲρ ἐγώ
  choice: 私は彼ら以上です
  rationale: 省略の多い比較表現を、直前の「仕える者」と競争相手との比較が伝わる形で補った。
- source_word: ἐν κόποις περισσοτέρως
  choice: 苦労したことは、はるかに多く
  rationale: κόποςの骨の折れる労苦と、比較級副詞の強意を自然な日本語で表した。
- source_word: ἐν φυλακαῖς περισσοτέρως
  choice: 投獄されたことも、はるかに多く
  rationale: 複数形を、繰り返された拘禁経験として表現した。
- source_word: ἐν πληγαῖς ὑπερβαλλόντως
  choice: 打ちたたかれたことは数えきれず
  rationale: 受けた打撃・殴打が並外れて多いという修辞的な強さを保った。
- source_word: ἐν θανάτοις πολλάκις
  choice: 死に直面したことも幾度となくあります
  rationale: 字義的には異例な複数形「死」であり、文脈上は繰り返し死の危険にさらされたことを表すため、明瞭な日本語にした。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号としての意味が保たれているため「メシア」を採用した。日本語で定着した「キリスト」も可能だが、本文では称号の意味を透明にした。
- issue: ἐν θανάτοις πολλάκιςの解釈
  choice: 死に直面したことも幾度となくあります
  alternative: 死の中にあることもしばしばです
  rationale: 字義的な複数形の異様さを注記で示しつつ、本文では反復する致命的危険という文脈上の意味を明確にした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。苦難の列挙が持つ加速感を保ちつつ、不自然な逐語調は避けた。「なのですか」「言います」「あります」で敬体を統一した。
