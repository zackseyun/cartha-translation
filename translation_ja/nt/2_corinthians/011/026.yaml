id: 2CO.11.26
reference: 2 Corinthians 11:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁδοιπορίαις πολλάκις, κινδύνοις ποταμῶν, κινδύνοις λῃστῶν, κινδύνοις ἐκ γένους, κινδύνοις ἐξ ἐθνῶν, κινδύνοις ἐν πόλει, κινδύνοις ἐν ἐρημίᾳ, κινδύνοις ἐν θαλάσσῃ, κινδύνοις ἐν ψευδαδέλφοις,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/011/026.yaml
  text: often on journeys[a], in dangers from rivers, in dangers from robbers, in dangers from my own people, in dangers from Gentiles, in dangers in the city, in dangers in the wilderness, in dangers at sea, in dangers among false brothers[b],
translation:
  language: ja
  text: 何度も旅をし、川の危険、強盗の危険、同胞から受ける危険[a]、異邦人から受ける危険、町での危険、荒野での危険、海での危険、偽兄弟の間での危険[b]に遭いました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分と同じ民族の者たちから」。ギリシア語は直訳すると「同族の者たちから」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「偽の信者たちの間で」。ギリシア語は直訳すると「偽兄弟の間で」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁδοιπορίαις πολλάκις
  choice: 何度も旅をし
  rationale: 与格複数と副詞による苦難の列挙の冒頭を、反復される旅という意味を保ちながら自然な現代日本語にした。
- source_word: κινδύνοις
  choice: 危険
  rationale: 反復語を各項目で保ち、原文の畳みかける修辞的な響きを再現した。文として成立させるため、末尾に「に遭いました」を補った。
- source_word: ποταμῶν
  choice: 川の危険
  rationale: 川そのものに由来する危険を表し、洪水や渡河など原文が特定していない内容は補わなかった。
- source_word: λῃστῶν
  choice: 強盗の危険
  rationale: 旅行者を襲う略奪者を指す一般的で明瞭な語として「強盗」を用いた。
- source_word: ἐκ γένους
  choice: 同胞から受ける危険
  rationale: パウロ自身と民族的につながる人々を指す表現として、特定の民族名を原文以上に明示せず「同胞」とした。
- source_word: ἐξ ἐθνῶν
  choice: 異邦人から受ける危険
  rationale: 「同胞」と対比される民族的意味を保ち、新約聖書で通用する明瞭な表現を採用した。
- source_word: ἐν πόλει
  choice: 町での危険
  rationale: 単数形の一般的・類型的用法を保ちつつ、現代日本語で自然な「町」とした。
- source_word: ἐν ἐρημίᾳ
  choice: 荒野での危険
  rationale: 砂漠だけに限定されない、人里離れた荒涼とした場所という幅を保った。
- source_word: ἐν θαλάσσῃ
  choice: 海での危険
  rationale: 海上または海中で遭う危険のいずれにも狭めず、原文の簡潔さを保った。
- source_word: ἐν ψευδαδέλφοις
  choice: 偽兄弟の間での危険
  rationale: 複合語の字義と男性複数形を保ち、信仰者を装う者という解釈を本文で断定しなかった。
theological_decisions:
- issue: ψευδαδέλφοις の性と共同体的含意
  choice: 偽兄弟の間で
  alternative: 偽の信者たちの間で
  rationale: 原文は男性複数の「兄弟」を用いており、偽りの仲間・自称信者という含意はあるが、本文では字義的表現を保って曖昧さを残した。
- issue: ἐκ γένους と ἐξ ἐθνῶν の対比
  choice: 同胞から／異邦人から
  alternative: 自分の民族から／諸民族から
  rationale: 民族的な対比を明瞭にしつつ、「ユダヤ人」という語を原文にない形で本文へ直接補うことを避けた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の「危険」の反復を維持し、苦難が次々と重なる列挙のリズムを生かした。提示された英語版では脚注[a]の位置と内容が一致していないため、内容に対応する「同胞」の後に配置した。
