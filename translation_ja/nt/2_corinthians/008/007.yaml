source:
  edition: SBLGNT
  text: ἀλλ’ ὥσπερ ἐν παντὶ περισσεύετε, πίστει καὶ λόγῳ καὶ γνώσει καὶ πάσῃ σπουδῇ καὶ τῇ ἐξ ⸂ἡμῶν ἐν ὑμῖν⸃ ἀγάπῃ, ἵνα καὶ ἐν ταύτῃ τῇ χάριτι περισσεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/007.yaml
  text: But just as you abound in everything—in faith and speech and knowledge and all diligence and in our love in you—see that you also abound in this grace[a][b].
translation:
  language: ja
  text: しかし、あなたがたが、信仰にも、ことばにも、知識にも、あらゆる熱心さにも、また私たちから出て、あなたがたのうちにある愛にも[a]、すべてにおいて満ちあふれているのと同じように、この恵みにも[b]満ちあふれてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの私たちへの愛」という意味の可能性もある。ギリシア語の句は解釈が難しい。また一部の写本は、「あなたがたから出て私たちのうちにある愛」に当たる読みを伝えている。
    reason: alternative_reading
  - marker: b
    text: ここでは、惜しみなく与えるという恵みの働きを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: περισσεύετε / περισσεύητε
  choice: 満ちあふれている／満ちあふれてください
  rationale: 豊かさやあふれるほどの充実を表す動詞のイメージを保ち、現在の状態と勧めの双方で同じ表現を用いた。
- source_word: ἐν παντί
  choice: すべてにおいて
  rationale: 後続する諸項目を包括する広い表現として、範囲を限定しすぎない自然な日本語にした。
- source_word: πίστει
  choice: 信仰
  rationale: キリスト者の資質を列挙する文脈に適合する標準的な訳語。
- source_word: λόγῳ
  choice: ことば
  rationale: ここでは語る働きや表現力を含みうるため、単一の発言に狭めない訳語を選んだ。
- source_word: γνώσει
  choice: 知識
  rationale: 文脈に即した標準的で明瞭な対応語。
- source_word: πάσῃ σπουδῇ
  choice: あらゆる熱心さ
  rationale: 真剣さ、熱意、勤勉さを含む語であり、資質の列挙として自然な「熱心さ」を用いた。
- source_word: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ
  choice: 私たちから出てあなたがたのうちにある愛
  rationale: 採用本文の二つの前置詞句を保ち、難解な構文を一つの解釈に滑らかに限定しないようにした。より自然な解釈と異読は脚注に示した。
- source_word: χάριτι
  choice: 恵み
  rationale: 献金という具体的な奉仕を指しつつ、パウロが用いる神学的な語の厚みを保った。具体的な指示対象は脚注で明示した。
theological_decisions:
- issue: エルサレムの聖徒たちへの献金という文脈における χάρις の意味
  choice: 本文では「恵み」と訳し、惜しみなく与える恵みの業を指すことを脚注で補う。
  alternative: 恵みの業／贈り物／献金の働き
  rationale: 単なる金銭的贈与に還元せず、神の恵みと信徒の寛大な行為を結びつけるパウロの表現を保持するため。
- issue: τῇ ἐξ ἡμῶν ἐν ὑμῖν ἀγάπῃ の解釈
  choice: 採用本文に沿って「私たちから出てあなたがたのうちにある愛」とし、構文上の緊張を残す。
  alternative: あなたがたの私たちへの愛／私たちの、あなたがたのうちにある愛
  rationale: 本文は統語的に難しく、写本上の異読もあるため、本文で意味を一つに決めすぎず、主要な別解を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告としての丁寧さと聖書本文にふさわしい品位を保った。「私たちから出てあなたがたのうちにある愛」は意図的にやや直訳的とし、原文の真正な曖昧さを残している。
