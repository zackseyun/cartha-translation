  yaml_path: translation/nt/2_corinthians/008/017.yaml
  text: For he accepted the appeal[a], but being more earnest[d][c][b], he went to you of his own accord.
translation:
  language: ja
  text: というのも、彼はその要請[a]を受け入れただけでなく、いっそう熱心であり、自ら進んで[b]あなたがたのもとへ出発した[c]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「勧め」「願い」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「自発的に」または「自分から」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「あなたがたのもとへ向かいました」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: というのも……からです
  rationale: 直前の感謝の理由を説明する接続語として、因果・説明の働きを自然な日本語で示した。
- source_word: παράκλησιν
  choice: 勧め
  rationale: ここでは慰めではなく、パウロがテトスにした要請・働きかけを指す。「勧め」は促しと依頼の両面を保てる。
- source_word: ἐδέξατο
  choice: 受け入れた
  rationale: 単に聞いたのではなく、勧めに好意的に応じたことを明確に表す。
- source_word: σπουδαιότερος
  choice: いっそう熱心になり
  rationale: 比較級の強まりを「いっそう」で保持し、テトスの熱意がさらに増したことを自然に表した。
- source_word: αὐθαίρετος
  choice: 自ら進んで
  rationale: 外から強いられたのではなく、自発的に行動したという意味を簡潔に表す。
- source_word: ἐξῆλθεν πρὸς ὑμᾶς
  choice: あなたがたのもとへ出発した
  rationale: 話し手のいる場所からコリントの人々のもとへ向けて出たという方向性を保つ。「行った」よりも、派遣のために旅立った含みが明瞭である。
