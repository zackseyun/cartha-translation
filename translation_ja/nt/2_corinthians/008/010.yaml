id: 2CO.8.10
reference: 2 Corinthians 8:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γνώμην ἐν τούτῳ δίδωμι· τοῦτο γὰρ ὑμῖν συμφέρει, οἵτινες οὐ μόνον τὸ ποιῆσαι ἀλλὰ καὶ τὸ θέλειν προενήρξασθε ἀπὸ πέρυσι·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/010.yaml
  text: 'And in this matter I give my judgment: for this is beneficial for you[b][a], who began last year not only to do it but also to will it.'
translation:
  language: ja
  text: このことについて、私は判断を述べます[a]。これはあなたがたのためになるからです。あなたがたは昨年から、実行することだけでなく、実行しようとすること[b]も、いち早く始めました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「判断」は「意見」または「助言」とも訳せます。ここでパウロは命令ではなく、熟慮した勧めを述べています。
    reason: lexical_alternative
  - marker: b
    text: 「実行しようとすること」は「その意志を持つ」または「進んでしようとする」とも訳せます。ギリシア語は、実際の行動と内面的な意志とを区別しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: γνώμην
  choice: 意見
  rationale: 命令ではなく、熟慮した判断・勧告を示す語として自然な現代日本語を選んだ。文脈上の重みを補足するため脚注を付した。
- source_word: ἐν τούτῳ
  choice: このことについて
  rationale: 直前から続く募金の件を指す表現として、指示対象を過度に明示せず自然に訳した。
- source_word: δίδωμι
  choice: 述べます
  rationale: 日本語では「意見を与える」より「意見を述べる」が自然であり、現在形の発話行為を保つ。
- source_word: συμφέρει
  choice: あなたがたのためになります
  rationale: 有益・有利であるという意味を、商業的含意を避けた平明な表現で示した。
- source_word: οἵτινες
  choice: あなたがたは…からです
  rationale: 関係節の説明的・理由的な働きを、日本語で自然な独立文と理由節に組み替えた。
- source_word: τὸ ποιῆσαι
  choice: 実行する
  rationale: 募金計画を実際に行うことを指すため、目的語を補いすぎず行為の遂行を明確にした。
- source_word: τὸ θέλειν
  choice: そうしたいと願う
  rationale: 外的な実行と区別される内的意志・願望を示す。単なる感情的欲求にも、すでに確定した行為にも狭めない表現とした。
- source_word: προενήρξασθε
  choice: 先に取りかかっていた
  rationale: 単なる開始だけでなく、以前から先んじて着手していたという複合動詞の含意を表した。
- source_word: ἀπὸ πέρυσι
  choice: 昨年から
  rationale: 起点を示すἀπόを反映し、前年に始まったことを自然な日本語で示した。継続の範囲は文脈に委ねる。
theological_decisions:
- issue: パウロの発言が持つ使徒的権威と命令との関係
  choice: 直接の命令ではなく、熟慮した意見・勧告として訳す
  alternative: 権威ある指令として訳す
  rationale: γνώμην δίδωμιと直近の文脈（8:8）の対比は、パウロがここで命令という形式を取っていないことを示す。一方、「意見」を軽い私見と誤解しないよう脚注で補った。
- issue: 実行と意志の順序
  choice: 原文どおり「実行するだけでなく、そうしたいと願うことにも」とする
  alternative: 自然な心理的順序に直して「願うだけでなく実行する」とする
  rationale: 原文が実行を先に、意志を後に置く意外な並列を保存し、その神学的・修辞的緊張を解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語文を二文に分け、論理関係を「からです」で示した。募金という対象は文脈に委ね、本文には補わなかった。
