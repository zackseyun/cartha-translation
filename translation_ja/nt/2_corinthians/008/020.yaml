translation:
  language: ja
  text: 私たちは、私たちが取り扱っているこの多額の献金[a]について、だれからも非難されないよう、このように注意を払っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この豊かな贈り物」または「この豊かな献金」。ギリシア語は、豊かさ、多額であること、気前のよさを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: στελλόμενοι τοῦτο
  choice: 用心しています
  rationale: στέλλομαι の中動態分詞は、続く μή 節が示す問題を避けるために予防措置を取ることを表す。日本語では文脈上の目的を伴う「用心しています」が自然である。
- source_word: μή τις ἡμᾶς μωμήσηται
  choice: だれからも非難されないように
  rationale: μή＋接続法による予防の目的を表し、μωμάομαι の「責める、非難する」という意味を明確に伝える。
- source_word: ἐν τῇ ἁδρότητι ταύτῃ
  choice: この多額の献金について
  rationale: ἁδρότης は豊かさ、多量、気前のよさを指す。この文脈では集められた多額の救援献金が対象であり、「多額の献金」は量的な豊かさと具体的な指示対象を自然に示す。ただし語そのものは「豊かな贈り物」とも理解できるため脚注に残す。
- source_word: τῇ διακονουμένῃ ὑφ’ ἡμῶν
  choice: 私たちが取り扱っている
  rationale: 金銭的援助の文脈における διακονέω は、その奉仕を遂行し、献金を管理・運搬することを指す。「取り扱っている」は不自然な教会用語を避けつつ、実務上の管理責任を伝える。
theological_decisions:
- issue: 献金を扱う際のパウロたちの懸念
  choice: 献金の取り扱いをめぐって非難を受けないための実際的な用心を強調する。
  alternative: 単なる旅行上の手配として弱く訳す。
  rationale: ギリシア語は、献金に関してパウロたちが非難される事態を防ぐための行動を中心に据えている。財務上の説明責任という含意を保ちつつ、それ以上の教理的主張は加えない。
translation_notes:
  register: 明快で現代的な標準日本語。「多額の献金」で文脈上の対象を具体化し、「取り扱っている」で管理・奉仕の意味を平易に表した。文末は継続的な予防措置を自然に示す現在形とした。
