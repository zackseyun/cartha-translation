source:
  edition: SBLGNT
  text: οὐ μόνον δὲ ἀλλὰ καὶ χειροτονηθεὶς ὑπὸ τῶν ἐκκλησιῶν συνέκδημος ἡμῶν ⸀σὺν τῇ χάριτι ταύτῃ τῇ διακονουμένῃ ὑφ’ ἡμῶν πρὸς τὴν ⸀αὐτοῦ τοῦ κυρίου δόξαν καὶ προθυμίαν ἡμῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/019.yaml
  text: And not only that[d][c][b][a], but he was also appointed by the churches as our traveling companion with this gracious gift that is being administered by us for the glory of the Lord himself and our eagerness—
translation:
  language: ja
  text: そればかりでなく、彼は、私たちが主ご自身の栄光のため、また私たちの熱意を示すために取り扱っているこの恵みの贈り物に伴う旅で、私たちの仲間として諸教会から選任されました[a][b][c]――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「選ばれた」「任命された」。この語は諸教会による選出または指名を表すが、現代的な投票手続きを必ずしも意味しない。
    reason: lexical_alternative
  - marker: b
    text: 直訳「この恵みとともに」。ここで「恵み」は、諸教会から集められた贈り物を指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「主の栄光のために」。ギリシア語は「彼の主の栄光」と理解される可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: χειροτονηθεὶς
  choice: 選ばれ…任じられました
  rationale: 諸教会による指名・選任を表す。現代的な投票制度まで含意する「選挙された」は避け、選ばれたうえで役目に任じられたことを自然な日本語で示した。
- source_word: ἐκκλησιῶν
  choice: 諸教会
  rationale: パウロ書簡における複数のキリスト者共同体を、現代日本語で簡潔に表す。
- source_word: συνέκδημος
  choice: 旅に同行する私たちの仲間
  rationale: 共に旅をする者という語義を明確にし、献金を届ける旅の文脈を保った。
- source_word: χάριτι
  choice: 恵みの贈り物
  rationale: エルサレムへの献金という具体的な贈り物を指しつつ、χάριςの「恵み」の響きも残した。
- source_word: διακονουμένῃ
  choice: 私たちが取り扱っている
  rationale: 献金を責任をもって管理し運ぶ奉仕を指す。日本語の「執行する」より平明で、「配る」と限定しすぎない表現を選んだ。
- source_word: πρὸς
  choice: …ため
  rationale: ここでは行為の目的・目標を示すため、自然な目的表現とした。
- source_word: αὐτοῦ τοῦ κυρίου
  choice: 主ご自身
  rationale: αὐτοῦを強意的に取り、主への強調を日本語で表した。別の統語的理解の可能性は脚注に残した。
- source_word: δόξαν
  choice: 栄光を帰し
  rationale: 単なる名誉ではなく、神学的な重みを持つ「栄光」を保持し、目的を自然な日本語の動詞句で表した。
- source_word: προθυμίαν
  choice: 熱意を表す
  rationale: 進んで行おうとする意欲・熱心さを表す。具体的に「助ける」と補わず、原文の幅を保った。
theological_decisions:
- issue: πρὸς τὴν αὐτοῦ τοῦ κυρίου δόξαν における αὐτοῦ の機能と指示対象
  choice: 「主ご自身に栄光を帰し」とし、αὐτοῦを強意的に理解した。
  alternative: 「その方の主の栄光のために」または単に「主の栄光のために」と理解することもできる。
  rationale: 圧縮されたギリシア語句には複数の統語的理解があり得る。本文では文脈上自然な強意の読みを採用しつつ、別解を脚注に明示して曖昧さを隠さなかった。
- issue: πρὸς が δόξαν と προθυμίαν の双方にかかる目的表現
  choice: 「主ご自身に栄光を帰し、私たちの熱意を表すため」とした。
  alternative: より形式的に「主ご自身の栄光と私たちの熱意のため」とすることもできる。
  rationale: 二つの対格名詞が共に目的・目標を示す構造を保ちながら、現代日本語として意味が通るよう動詞句に展開した。
translation_notes:
  register: 明瞭で品位ある現代標準語。献金管理の文脈を伝えつつ、教会特有の硬い行政用語を避けた。原文末尾の継続を示すダッシュは「――」で保持した。
