revisions:
- from: そればかりでなく、彼は諸教会によって選ばれ[a]、私たちが取り扱っているこの恵みの贈り物[b]に関して、旅に同行する私たちの仲間に任じられました。それは、主ご自身に栄光を帰し[c]、私たちの熱意を表すためです――
  to: そればかりでなく、彼は、私たちが主ご自身の栄光のため、また私たちの熱意を示すために取り扱っているこの恵みの贈り物に伴う旅で、私たちの仲間として諸教会から選任されました[a][b][c]――
  rationale: 一つの受動分詞を「選任されました」にまとめ、同行者であることは「仲間として」で表した。「恵みの贈り物に伴う旅」は、贈り物を実際に運ぶことだけに限定せず、贈り物の管理・奉仕に伴う旅行という文脈を保つ。「主ご自身の栄光のため」は原文の名詞句をより直接に反映し、「熱意を示す」は日本語として目的関係を明確にする最小限の補いである。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T20:18:14Z'
