  source_fidelity: 現行訳は全体として原文の意味をよく伝えているが、「選ばれ、…仲間に任じられました」は、χειροτονηθεὶς（諸教会によって選任された）という一つの受動分詞を二重の受動表現にしている。また、「主ご自身に栄光を帰し」は自然な信仰用語ではあるものの、原文の「主ご自身の栄光」という属格表現を目的語的に組み替えている。本文では「主ご自身の栄光のため」として構造をより直接に反映する。
  naturalness: 「旅に同行する私たちの仲間に任じられました」は意味は明瞭だが、やや重複的である。「この恵みの贈り物に伴う旅で、私たちの仲間として諸教会から選任されました」とすると、現代標準語として滑らかであり、σὺν τῇ χάριτιの結び付きも過度に限定せず表せる。
