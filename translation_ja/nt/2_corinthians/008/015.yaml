id: 2CO.8.15
reference: 2 Corinthians 8:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ὁ τὸ πολὺ οὐκ ἐπλεόνασεν, καὶ ὁ τὸ ὀλίγον οὐκ ἠλαττόνησεν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/015.yaml
  text: 'as it is written: The one who had much did not have too much[a], and the one who had little did not have too little.'
translation:
  language: ja
  text: 「多く持つ者にも余りはなく、少ししか持たない者にも不足はなかった」と書かれているとおりです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 出エジプト記16章18節に沿って、より明示的に訳すと、「多く集めた者にも余りはなく、少ししか集めなかった者にも不足はなかった」。
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: と書かれているとおりです
  rationale: 聖書引用を導入する定型表現。完了形が示す、書かれた言葉が今も効力を持つことを、自然な現代日本語で表した。
- source_word: Ὁ τὸ πολὺ
  choice: 多く持つ者
  rationale: 冠詞と中性形容詞の名詞的用法を簡潔に表現した。パウロの本文には「集める」という動詞が明示されていないため、本文では補わない。
- source_word: ἐπλεόνασεν
  choice: 余りはなく
  rationale: ここでは単に豊かであることではなく、必要を超える余剰が生じなかったという結果を表す。対句として自然で簡潔な表現を選んだ。
- source_word: ὁ τὸ ὀλίγον
  choice: 少ししか持たない者
  rationale: ὁ τὸ πολὺとの対照を保ちつつ、少量を持つ者という意味を自然な日本語にした。
- source_word: ἠλαττόνησεν
  choice: 不足はなかった
  rationale: 欠乏する、必要量に達しないという意味を表し、「余りはなく」と均整の取れた対句にした。
theological_decisions:
- issue: 出エジプト記16章18節の引用を、施しと均衡という文脈でどう表すか
  choice: 本文では所有・分配の結果として「多く持つ者にも余りはなく、少ししか持たない者にも不足はなかった」と訳す。
  alternative: 「多く集めた者にも余りはなく、少ししか集めなかった者にも不足はなかった」
  rationale: パウロが引用したギリシア語には「集める」が明示されていないため、本文では補わず、公平な充足という文脈上の働きを保った。一方、出エジプト記のマナ収集とのつながりは脚注で示した。
translation_notes:
  register: 明快で現代的ながら、聖書引用にふさわしい落ち着いた文体。「にも……なく、……にも……なかった」の対句で、余剰と不足の対照を保った。
