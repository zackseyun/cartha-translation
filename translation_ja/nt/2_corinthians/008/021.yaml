  yaml_path: translation/nt/2_corinthians/008/021.yaml
  text: For we take thought for what is good[a], not only before the Lord but also before people.
translation:
  language: ja
  text: 私たちは、主の前だけでなく、人々の前でも、良いこと[a]を心がけているからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「立派なこと」または「正しいこと」。
    reason: lexical_alternative
  - marker: b
    text: 一部の写本は「私たちは…心がけているからです」に当たる句を欠く。
    reason: textual_variant
lexical_decisions:
- source_word: προνοοῦμεν
  choice: 行うよう心を配っている
  rationale: προνοέωの、前もって考慮し配慮するという継続的な意味を、献金の取り扱いにおける慎重な実行も含む自然な日本語で表した。
- source_word: γὰρ
  choice: からです
  rationale: 直前の記述に対する理由・説明を示す接続関係を、現代日本語で自然な文末表現にした。
- source_word: καλὰ
  choice: 良いこと
  rationale: 中性複数形が指す、道徳的に良く、称賛に値する行為を広く保つ訳語。文脈上の「立派なこと」「正しいこと」という含みは脚注に残した。
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: だけでなく、…でも
  rationale: 二つの領域を並列して強調する相関構文を自然な日本語で再現した。
- source_word: ἐνώπιον
  choice: 前
  rationale: 「目の前で」「見ているところで」を意味し、評価や認識を含み得る簡潔な表現として両句で統一した。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςに対する標準的で神学的に中立な訳語。
- source_word: ἀνθρώπων
  choice: 人々
  rationale: 特定の性別ではなく、人間の観察者一般を指すため、包括的で自然な訳語とした。
theological_decisions:
- issue: 献金の管理という文脈における καλὰ の倫理的含意
  choice: 本文では広く「良いこと」と訳した
  alternative: 「立派なこと」「正しいこと」
  rationale: この語は神の前での善と、人々から見ても称賛に値する誠実さの双方を含み得る。本文で一方に限定せず、社会的評価や説明責任に焦点を置く訳も脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語。パウロの説明的な論理を「からです」で示しつつ、献金管理における慎重な配慮を自然かつ品位ある表現で伝えた。
