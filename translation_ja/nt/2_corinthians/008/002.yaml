  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐν πολλῇ δοκιμῇ θλίψεως ἡ περισσεία τῆς χαρᾶς αὐτῶν καὶ ἡ κατὰ βάθους πτωχεία αὐτῶν ἐπερίσσευσεν εἰς ⸂τὸ πλοῦτος⸃ τῆς ἁπλότητος αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/002.yaml
  text: that in a severe test of affliction[b][a], the abundance of their joy and their deep poverty overflowed into the wealth of their generosity.
translation:
  language: ja
  text: すなわち、苦難という厳しい試練の中で、彼らのあふれる喜びと深い貧しさ[a]は、彼らの豊かな寛大さ[b]へとあふれ出たのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「深みに至るほどの貧しさ」。または「極度の貧しさ」。
    reason: lexical_alternative
  - marker: b
    text: 「寛大さ」と訳したギリシア語は、「単純さ」「純真さ」「誠実さ」「ひたむきさ」を意味することもあります。ここでは献金の文脈から、惜しみなく与える寛大さを指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν πολλῇ δοκιμῇ θλίψεως
  choice: 苦難による厳しい試練の中で
  rationale: δοκιμήの「試練・試されること」と、属格θλίψεωςとの関係を保ちつつ、πολλῇの強意を自然な現代日本語で表した。
- source_word: ἡ περισσεία τῆς χαρᾶς αὐτῶν
  choice: 満ちあふれる喜び
  rationale: 名詞περισσείαの豊かさを「あふれる」で表し、後続するἐπερίσσευσενとの語感の連鎖も保った。
- source_word: ἡ κατὰ βάθους πτωχεία αὐτῶν
  choice: どん底の貧しさ
  rationale: κατὰ βάθουςが表す深さによる強意を、比喩を残した明瞭な日本語にした。
- source_word: ἐπερίσσευσεν εἰς τὸ πλοῦτος
  choice: あふれるほど豊かな……を示した
  rationale: 直訳的な「豊かさへあふれた」は日本語では不自然なため、喜びと貧しさが逆説的に豊かな結果を生んだという方向・結果を自然に表現した。
- source_word: ἁπλότης
  choice: 惜しみない心
  rationale: 献金の文脈における「気前よさ、惜しみなさ」を示しつつ、単なる金額ではなく単一で誠実な心という語の含みもある程度保持した。
theological_decisions:
- issue: 献金の文脈におけるἁπλότηςの意味
  choice: 惜しみない心
  alternative: 単純さ／純真さ／誠実さ
  rationale: 直近の文脈は聖徒への物質的な援助を扱うため、ここでは「惜しみなさ、寛大さ」が中心的意味である。ただし、行為だけに限定せず心のあり方も含む訳語を選んだ。
- issue: 喜びと貧しさが豊かさを生むという逆説
  choice: 満ちあふれる喜びと、どん底の貧しさから、あふれるほど豊かな惜しみない心を示した
  alternative: 喜びの豊かさと深い貧しさが、彼らの寛大さの豊かさへとあふれた
  rationale: 原文の神学的・修辞的緊張を解消せず、貧しさにもかかわらずではなく、喜びと貧しさがともに惜しみない献げ方へ結実した構造を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「どん底」はやや口語的だが、深さの比喩と極度の困窮を一般読者に鮮明に伝えるため採用した。「すなわち」で前節から続くὅτιの説明関係を示した。
