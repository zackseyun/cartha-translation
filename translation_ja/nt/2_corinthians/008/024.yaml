id: 2CO.8.24
reference: 2 Corinthians 8:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὴν οὖν ἔνδειξιν τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν εἰς αὐτοὺς ⸀ἐνδεικνύμενοι εἰς πρόσωπον τῶν ἐκκλησιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/024.yaml
  text: Therefore[b][a], show them before the churches the proof of your love and of our boasting about you.
translation:
  language: ja
  text: ですから、あなたがたの愛と、私たちがあなたがたについて誇っていることの証拠[a]を、彼らに諸教会の前で[b]示してください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「証明」「明らかなしるし」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「諸教会の面前で」の意。ここでは、諸教会の代表者たちを前にして公に示すことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: ですから
  rationale: 直前の兄弟たちについての説明を受けた結論・勧告であることを、自然な現代日本語で示す。
- source_word: ἔνδειξιν
  choice: 証拠
  rationale: 愛とパウロの誇りが確かなものであることを、目に見える行動によって明らかにするという意味を表す。「しるし」「実証」も可能。
- source_word: ἀγάπης
  choice: 愛
  rationale: ἀγάπηの標準的な訳語であり、ここでは献金への参与を通して実際に表される愛を指す。
- source_word: καυχήσεως
  choice: 誇っていること
  rationale: 名詞的な「誇り」よりも、パウロがコリントの人々について実際に誇ってきたという文脈上の動作を明確にしつつ、καύχησιςの修辞的な強さを保つ。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたについて
  rationale: καύχησιςとともに、誇りの対象・話題がコリントの信徒たちであることを自然に表す。
- source_word: εἰς αὐτοὺς
  choice: 彼らに
  rationale: 直前に述べられた、諸教会の使者である兄弟たちを指す。日本語では「彼らに示す」が自然。
- source_word: ἐνδεικνύμενοι
  choice: 示してください
  rationale: 形態上は分詞だが、文脈では勧告を担う命令的用法として理解するのが自然である。
- source_word: εἰς πρόσωπον τῶν ἐκκλησιῶν
  choice: 諸教会の前で
  rationale: 諸教会の代表者たちを前にした公の実証という意味を、簡潔に表す。
- source_word: τῶν ἐκκλησιῶν
  choice: 諸教会
  rationale: 複数の地域教会共同体を指すため、パウロ書簡で一般的な「教会」を複数として訳す。
theological_decisions:
- issue: 「私たちが誇っていること」の証拠が何を指すか
  choice: 愛の証拠と、パウロたちの誇りを裏づける証拠とを並列して訳す
  alternative: 「あなたがたの愛、すなわち私たちがあなたがたについて誇る根拠」と同格的に訳す
  rationale: ギリシア語の二つの属格句（τῆς ἀγάπης ὑμῶν καὶ ἡμῶν καυχήσεως ὑπὲρ ὑμῶν）は一つのἔνδειξιςに係るが、その相互関係は明示されていない。訳文では並列性を保ち、同格関係だと断定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「誇っていること」は否定的な自慢と決めつけず、パウロの確信を伴う公言という原文の修辞を保つ。「証拠」を後半でも補って、日本語で二つの属格句の関係を読み取りやすくした。
