reference: 2 Corinthians 8:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ αὐτοῖς τὸν ἀδελφὸν ἡμῶν ὃν ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις σπουδαῖον ὄντα, νυνὶ δὲ πολὺ σπουδαιότερον πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/022.yaml
  text: And we have sent with them our brother[a], whom we have often tested in many matters and found to be diligent, but who is now even more diligent because of his great confidence in you.
translation:
  language: ja
  text: また私たちは、彼らと一緒に、私たちの兄弟を遣わしました。私たちはこの兄弟について、多くのことにおいて幾度も、その熱心さを確かめました。しかし今は、あなたがたへの強い信頼のゆえに、いっそう熱心です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今は、私たちがあなたがたに寄せる強い信頼のゆえに、いっそう熱心です」と理解することもできます。ギリシア語では「信頼」の主体は明示されておらず、「強い信頼によって」と手段として取ることもできます。
    reason: 「信頼」の主体および与格の理由的・手段的な理解に関する統語上の別解を示し、原文の曖昧さを保持するため。
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: 彼らと一緒に……遣わしました
  rationale: アオリストの完了した行為を自然な日本語で表し、接頭辞 σύν- が示す同行も「彼らと一緒に」で明示した。
- source_word: ἀδελφὸν ἡμῶν
  choice: 私たちの兄弟
  rationale: 男性単数の無名の同労者を指す、初期キリスト者共同体の家族的呼称をそのまま保った。
- source_word: ἐδοκιμάσαμεν ἐν πολλοῖς πολλάκις
  choice: 多くの事柄について幾度も試し
  rationale: ἐν πολλοῖς の範囲の広さと πολλάκις の反復性をともに保持した。「試し」は、吟味を通して人物の確かさが実証されたという文脈に合う。
- source_word: σπουδαῖον ὄντα
  choice: 熱心な人であることを確かめてきました
  rationale: σπουδαῖος の勤勉さ、真剣さ、意欲を文脈に即して「熱心」とし、試した結果が判明したことを「確かめてきました」で表した。
- source_word: νυνὶ δὲ πολὺ σπουδαιότερον
  choice: 今では……なおいっそう熱心になっています
  rationale: πολύ によって強められた比較級を「なおいっそう」で表し、前半の「熱心」との語彙的連続性を保った。
- source_word: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς
  choice: あなたがたに寄せる強い信頼のゆえに
  rationale: 与格を理由・根拠として自然に訳し、εἰς ὑμᾶς が示す信頼の方向を明示した。本文では直近の主体である兄弟の信頼と理解したが、主体に関する余地は脚注に示した。
theological_decisions:
- issue: πεποιθήσει πολλῇ τῇ εἰς ὑμᾶς の信頼の主体と与格のニュアンス
  choice: この兄弟がコリントの人々に寄せる強い信頼が、彼の増した熱心さの理由である
  alternative: パウロたちがコリントの人々に寄せる信頼を指す、または与格を手段として「信頼によって」と訳す
  rationale: 直近の統語関係では、無名の兄弟について続けて述べ、その熱心さが増した理由を示すと取るのが最も自然である。ただし、ギリシア語では信頼の主体が明示されていないため、別解を排除せず脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「兄弟」は初期キリスト者共同体の慣用を尊重して保持し、「熱心」を反復することで原文の比較構造を見える形にした。長いギリシア語一文は、日本語での理解を助けるため三文に分けた。
