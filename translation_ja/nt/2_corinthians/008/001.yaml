id: 2CO.8.1
reference: 2 Corinthians 8:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Γνωρίζομεν δὲ ὑμῖν, ἀδελφοί, τὴν χάριν τοῦ θεοῦ τὴν δεδομένην ἐν ταῖς ἐκκλησίαις τῆς Μακεδονίας,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/001.yaml
  text: We make known to you[a], brothers, the grace of God that has been given among the churches of Macedonia[b],
translation:
  language: ja
  text: さて、兄弟たち[a]、私たちは、マケドニアの諸教会に与えられた神の恵み[b]について、あなたがたにお知らせします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語では「兄弟たち」という男性形だが、会衆全体への呼びかけとして用いられることが多い。
    reason: lexical_alternative
  - marker: b
    text: 「神の恵み」は、神の好意と、その恵みによってマケドニアの諸教会に生じた惜しみない献げ方の両方を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζομεν
  choice: 私たちは……お知らせします
  rationale: 「知らせる、明らかにする」という現在形の意味を、手紙として自然で丁寧な現代日本語にした。「知っていただきたい」は意図を補うため避けた。
- source_word: δὲ
  choice: さて
  rationale: 強い対立ではなく話題の移行を示す軽い接続なので、「しかし」ではなく「さて」とした。時間を表す「今」は用いていない。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: γνωρίζομενの間接目的語であり、複数の宛先を明示した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを本文に保った。パウロ書簡では会衆全体を指すことが多いため、包括的な意味は脚注で示した。
- source_word: χάριν
  choice: 恵み
  rationale: パウロの重要語としての広がりを保ち、神の好意だけでなく、それが生み出す惜しみない行為をも含み得る表現とした。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格を素直に「神の恵み」と訳し、源を表す「神からの」に限定しなかった。
- source_word: τὴν δεδομένην
  choice: 与えられた
  rationale: 完了受動分詞が表す、すでに与えられ、その結果が今も続いていることを簡潔な受動表現で示した。
- source_word: ἐν ταῖς ἐκκλησίαις
  choice: 諸教会に
  rationale: 恵みがそれらの教会の領域内で働いたことを、自然な日本語で表した。単なる地理的位置だけに狭めない表現である。
- source_word: τῆς Μακεδονίας
  choice: マケドニアの
  rationale: 属格が「諸教会」を修飾する関係をそのまま示した。
theological_decisions:
- issue: 「神の恵み」がこの文脈で指すもの
  choice: マケドニアの諸教会に働き、その惜しみない献げ方に現れた神の恵み
  alternative: 慈善のための具体的な献金そのもの、または諸教会に示された神の好意一般
  rationale: 本文を「献金」や「寛大さ」と言い換えず「神の恵み」とすることで、神からの恵みと、その実際的な実りである寛大な行為の両方を含み得る原文の幅を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒書簡にふさわしい丁寧さと品位を保った。「さて」で段落の移行を示し、語順は日本語として自然になるよう整えた。
