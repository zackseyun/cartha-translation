source:
  edition: SBLGNT
  text: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν, τὴν χάριν καὶ τὴν κοινωνίαν τῆς διακονίας τῆς εἰς τοὺς ἁγίους—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/004.yaml
  text: begging us with much urging for the grace and the fellowship of this ministry to the saints—[a]
translation:
  language: ja
  text: 彼らは、聖なる者たちへの奉仕に加わる恵みと、その奉仕への参加を求めて、私たちに強く願い出ました—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖なる者たちへの奉仕にあずかる恵みを求めて、私たちに強く願い出ました」。または「聖なる者たちへの奉仕に加わる特権と参加を求めて」。
    reason: χάριςは「恵み」のほか「恩恵、特権」を表し得る。καίで結ばれたχάριςとκοινωνίαは並列とも、奉仕への参加という一つの恩恵を表す密接な結び付きとも理解できる。
lexical_decisions:
- source_word: μετὰ πολλῆς παρακλήσεως δεόμενοι ἡμῶν
  choice: 切に私たちに願い出ました
  rationale: δεόμενοιは強い懇願を表し、μετὰ πολλῆς παρακλήσεωςがその熱心さを強める。日本語では冗長さを避けつつ「切に…願い出ました」で自然に強意を表した。分詞は前後の文脈に従う叙述として訳した。
- source_word: τὴν χάριν καὶ τὴν κοινωνίαν
  choice: …にあずかる恵み
  rationale: 二つの対格は願いの内容であり、ここでは恵みと参加が密接に結び付く。καίを説明的・密接な連結と捉え、実際に奉仕へ参加できる恵みという意味を自然な日本語で示した。並列として読む余地は脚注に保存した。
- source_word: τῆς διακονίας
  choice: 奉仕
  rationale: 困窮する信徒への献金という実際的な奉仕を指す。「務め」より内容が伝わりやすく、行為の尊厳も保つ。
- source_word: τῆς εἰς τοὺς ἁγίους
  choice: 聖なる者たちへの
  rationale: 前置詞句は奉仕の方向・受益者を示す。ἅγιοιは特別に列聖された人々ではなく信徒を指すため、その意味が明瞭な「聖なる者たち」とした。
theological_decisions:
- issue: χάριςとκοινωνίαの関係
  choice: 「奉仕にあずかる恵み」として密接に結び付ける
  alternative: 「恵みと、奉仕にあずかること」
  rationale: 文脈上、彼らが求めたのは献金奉仕に参加する恩恵・機会である。ただしκαίの並列性を完全には排除できないため、別訳を脚注に示した。
- issue: ἅγιοιの訳
  choice: 聖なる者たち
  alternative: 聖徒たち／神の聖なる民
  rationale: パウロが信徒共同体を指して用いる語の意味を保ちつつ、後代の列聖者だけを指すとの誤解を避ける。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、格調を保った。「あずかる」は共同参加を自然に表す聖書的ながら現在も理解可能な語。節が原文で次節へ続くため、末尾のダッシュを保持した。
