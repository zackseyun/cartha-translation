  text: εἰς τὸ παρακαλέσαι ἡμᾶς Τίτον ἵνα καθὼς προενήρξατο οὕτως καὶ ἐπιτελέσῃ εἰς ὑμᾶς καὶ τὴν χάριν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/006.yaml
  text: So we urged Titus that[a], just as he had previously begun, he should also complete among you this act of grace.
translation:
  language: ja
  text: そこで私たちは、テトスが以前始めたとおりに、あなたがたの間でこの恵みの業[a]をも完成させるよう、彼に勧めました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この慈善の働き」。直訳「この恵み」。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακαλέσαι
  choice: 勧めました
  rationale: テトスに具体的な行動を促したことを表しつつ、過度に強制的な響きを避ける自然な現代日本語。
- source_word: καθὼς προενήρξατο
  choice: 以前始めたとおり
  rationale: προενήρξατο の「前に、すでに始めていた」という時間的要素を簡潔に保持する。
- source_word: ἐπιτελέσῃ
  choice: 完成させる
  rationale: すでに着手した働きを最後まで成し遂げるという動詞の意味を明確に表す。
- source_word: εἰς ὑμᾶς
  choice: あなたがたの間で
  rationale: コリントの共同体の中でこの働きを遂行するという方向・活動領域を自然に示す。
- source_word: τὴν χάριν ταύτην
  choice: この恵みの業
  rationale: χάρις の「恵み」という神学的響きを保ちながら、文脈上は聖徒のための献金という具体的な働きを指すことを伝える。
theological_decisions:
- issue: 献金の文脈における χάρις の意味
  choice: この恵みの業
  alternative: この恵み／この慈善の働き／この贈り物
  rationale: 抽象的な神の恵みだけでなく、献金という具体的な奉仕を指している。ただし単に「献金」と狭く言い換えず、パウロがこの働きを「恵み」と捉える表現を保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「そこで」は εἰς τὸ が前節の結果を示す機能を自然に表す。「勧めました」は文脈上の強い働きかけを示すが、命令的にしすぎない。
