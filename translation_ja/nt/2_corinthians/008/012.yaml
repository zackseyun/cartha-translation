source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ προθυμία πρόκειται, καθὸ ἐὰν ⸀ἔχῃ εὐπρόσδεκτος, οὐ καθὸ οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/012.yaml
  text: For if the readiness is present[a], it is acceptable according to what one has[b], not according to what one does not have.
translation:
  language: ja
  text: というのは、進んでしようとする気持ち[a]があるなら、それは、その人が持っているものに応じて[b]受け入れられます。持っていないものに応じてではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「熱意」または「進んでする心」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「何であれ持っているものに応じて……持っていないものに応じてではなく」。
    reason: lexical_alternative
lexical_decisions:
- source_word: προθυμία
  choice: 進んでしようという思い
  rationale: 自発的で意欲的な心構えを表す。献金の文脈に自然であり、単なる準備の完了とはせず、意欲と意思の両面を保つ。
- source_word: πρόκειται
  choice: ある
  rationale: この構文では、意欲が現に存在することを意味する。字義的な「前に置かれている」より、現代日本語として自然に表した。
- source_word: καθὸ ἐὰν ἔχῃ
  choice: 持っているものに応じて
  rationale: 実際に有する資力を基準・尺度とする意味を保ち、性別を特定しない表現とした。
- source_word: εὐπρόσδεκτος
  choice: 受け入れられる
  rationale: 「受け入れられる、喜んで迎えられる」という意味を表し、誰に受け入れられるかは本文どおり明示しない。
- source_word: οὐ καθὸ οὐκ ἔχει
  choice: 持っていないものに応じてではありません
  rationale: 直前の句との対照とギリシア語の反復構造を保ち、ないものを基準にされるのではないという意味を明確にした。
- source_word: εἰ γὰρ
  choice: もし…なら
  rationale: γάρの説明的なつながりは文脈上の継続に委ねつつ、εἰの条件性を明確にした。「というのは」を加えると日本語では重くなるため省いた。
theological_decisions:
- issue: 受容・承認の主体
  choice: 「受け入れられる」とし、誰に受け入れられるかを特定しない
  alternative: 「神に受け入れられる」または「共同体に受け入れられる」
  rationale: εὐπρόσδεκτοςは受容・承認を示すが、その主体を本文は明記していないため、神学的・社会的な指示対象を限定しない。
- issue: 受け入れられるものの文法上の含意
  choice: 日本語では主語を補わず、「受け入れられる」とする
  alternative: 「その献げ物は受け入れられる」または「その思いは受け入れられる」
  rationale: ギリシア語では何が受け入れられるかが明示されず、προθυμίαとの文法的一致もない。献げ物や人を補って曖昧さを解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの対照構造を保った。「進んでしようという思い」は一般読者に分かりやすく、「受け入れられる」は受容の主体を限定しない表現である。
