  yaml_path: translation/nt/2_corinthians/008/003.yaml
  text: For[a], I testify, they gave according to their ability, and beyond their ability, of their own accord[b],
translation:
  language: ja
  text: というのは、彼らは自分たちの力に応じて、さらにその力を超えてまで、自ら進んでささげたことを、私は証言します。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: （訳文では独立した接続語を置かない）
  rationale: ὅτιは前節の内容を説明する働きをする。単節で示す日本語では「というのは」を置くと不自然になりやすいため、「のです」によって説明のつながりを表した。
- source_word: κατὰ δύναμιν
  choice: 力に応じて
  rationale: κατάが示す基準・程度と、δύναμιςが表す能力や資力の幅を簡潔に保つ。「できる範囲で」より原文の反復との対応が明瞭である。
- source_word: μαρτυρῶ
  choice: 私が証言します
  rationale: 現在形の明示的で強い個人的証言を保った。「断言します」では証言という語義から離れるため避けた。
- source_word: καὶ παρὰ δύναμιν
  choice: いや、力を超えてまで
  rationale: καὶは単なる並列というより、先行表現を越える驚くべき程度を加える。「いや」で修辞的な高まりを自然な日本語にし、παράの限界超過を「超えてまで」で表した。
- source_word: αὐθαίρετοι
  choice: 自ら進んで
  rationale: 外から強いられず、自発的に行動したことを表す。文脈上省略された「ささげた」を補い、現代日本語として自然にした。
theological_decisions:
- issue: αὐθαίρετοιに伴う省略動詞
  choice: 文脈から「ささげた」を補う
  alternative: 形容詞的に「自発的であった」とする
  rationale: ギリシア語は述語的なαὐθαίρετοιだけを置く省略表現だが、8章2–4節の文脈では献金をささげる行為が明白である。日本語として文を成立させるために動詞を補いつつ、新たな内容は加えない。
- issue: μαρτυρῶの配置
  choice: 「私が証言します」を文末に独立させる
  alternative: 「私が証言するように、彼らは」と文中に挿入する
  rationale: 原文では挿入的かつ強調的である。日本語では文末に独立させることで、パウロ自身による保証の力を保ち、献金主体をパウロと誤読する可能性を避ける。
translation_notes:
  register: 明快な現代標準語を用いながら、パウロの力強い証言と「力に応じて／力を超えて」という対照を保持した。「献金した」より広く文脈に適合し、礼拝的な品位もある「ささげた」を採用した。
