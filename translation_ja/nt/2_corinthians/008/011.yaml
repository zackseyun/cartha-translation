  text: νυνὶ δὲ καὶ τὸ ποιῆσαι ἐπιτελέσατε, ὅπως καθάπερ ἡ προθυμία τοῦ θέλειν οὕτως καὶ τὸ ἐπιτελέσαι ἐκ τοῦ ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/011.yaml
  text: But now complete the doing of it also[a], so that just as there was the eagerness to will it[b], so also there may be the completion from what you have.
translation:
  language: ja
  text: しかし今は、それを実行することも成し遂げなさい。そうすれば、実行したいという熱意があったのと同じように、持っているものに応じて、それを成し遂げることもできるようになります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「持っているものから」。すなわち、現在の資力に応じて、ということ。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: しかし今は
  rationale: 時間的な移行とδέの穏やかな対比を、自然な現代日本語で示す。
- source_word: τὸ ποιῆσαι
  choice: それを実行すること
  rationale: 冠詞付き不定詞の具体的な行為を表し、文脈上すでに計画されていた献金を「それ」で受ける。
- source_word: ἐπιτελέσατε / τὸ ἐπιτελέσαι
  choice: 成し遂げなさい／成し遂げること
  rationale: ἐπιτελέωの「完成に至らせる」という意味を保ち、同じ語根の反復も日本語で対応させる。
- source_word: ἡ προθυμία τοῦ θέλειν
  choice: 願う熱意
  rationale: 実行を望む意志と、それに伴う積極的な心構えを簡潔に表す。単なる感情的な願望には限定しない。
- source_word: ἐκ τοῦ ἔχειν
  choice: 持っているものに応じて
  rationale: 手元にあるものを源または尺度として実行する意味を、文脈に即して明瞭に表す。直訳的な形は脚注に残す。
theological_decisions:
- issue: 現在持っているものに基づく献金
  choice: 手元にある資力に応じて、約束した献金を完成させるよう勧めている。
  alternative: 資力とは無関係に、あらゆる善い意図を必ず実現せよという一般命令。
  rationale: 直近の文脈はコリントの人々が始めた献金について述べ、ἐκ τοῦ ἔχεινは現在持っているものを源または尺度として示す。能力を超えた献金の要求とはしない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「実行」と「成し遂げる」の重なりは、原文のτὸ ποιῆσαιとἐπιτελέωの関係、およびἐπιτελέωの反復を見える形で残すために採用した。
