  to: しかし今は、それを実行することも成し遂げなさい。そうすれば、実行したいという熱意があったのと同じように、持っているものに応じて、それを成し遂げることもできるようになります。[a]
  rationale: 文末の「できるようになります」は、ὅπως以下が命令の目的・意図を示し、完遂が手元にあるものに基づいて可能となることを表す日本語として採用した。「実行すること」と「成し遂げること」を対置して、ποιῆσαιとἐπιτελέωの差異、およびἐπιτελέωの反復を保った。旧[a]は本文の「成し遂げなさい」と実質的に重複するため削除し、資力に関する脚注を本文末に一つだけ置いた。
