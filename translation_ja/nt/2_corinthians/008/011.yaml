review_pass:
  verdict: revise
  source_fidelity: 原文は「今や、実行することも完遂しなさい。そうすれば、意欲的に願ったのと同じように、持っているものに応じて完遂することもあるようになる（／あるべきである）」という比較・勧告である。現行訳は大意を伝えるが、「成し遂げることもあるようにしなさい」は日本語として不自然で、τὸ ἐπιτελέσαι を確実な実行の完遂ではなく、単に『ある』ことのように響かせる。
  naturalness: 「願う熱意」および「持っているものに応じて成し遂げることもあるようにしなさい」は現代標準日本語としてぎこちない。「実行したいという熱意」「それを成し遂げることも」とすることで、比較の構文と勧告の意図が自然に明確になる。
  terminology: προθυμίαはこの文脈では「熱意」でも可能だが、τοῦ θέλεινとの結び付きを明示する「実行したいという熱意」が適切である。ἐκ τοῦ ἔχεινは「持っているものに応じて」と訳せる。ποιῆσαιと二度のἐπιτελέωの区別を、「実行すること」と「成し遂げること」で保つ。
  issues:
  - severity: medium
    issue: 「成し遂げることもあるようにしなさい」が不自然で、原文の完遂への勧告を弱める。
    rationale: τὸ ἐπιτελέσαιは「完遂すること」を指し、ὅπως節は先行する命令が目指す結果を示す。「…こともあるように」の形は偶発的な事態のように聞こえるため、「…こともできるように」と補うか、文脈上の可能性を自然に表す必要がある。
  - severity: low
    issue: 「願う熱意」はτοῦ θέλεινの意志内容との関係がやや不明瞭。
    rationale: 「実行したいという熱意」とすれば、熱意が単なる願望でなく実行への意欲であることを自然に示せる。
  revised_text: しかし今は、それを実行することも成し遂げなさい。そうすれば、実行したいという熱意があったのと同じように、持っているものに応じて、それを成し遂げることもできるようになります。[a]
