  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴτε ὑπὲρ Τίτου, κοινωνὸς ἐμὸς καὶ εἰς ὑμᾶς συνεργός· εἴτε ἀδελφοὶ ἡμῶν, ἀπόστολοι ἐκκλησιῶν, δόξα Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/023.yaml
  text: As for Titus[a], he is my partner and fellow worker for you; as for our brothers, they are messengers of the churches[b], the glory of Messiah.
translation:
  language: ja
  text: テトスについて言えば、彼は私の協力者であり、あなたがたのために働く同労者です。私たちの兄弟たちについて言えば、彼らは諸教会の使者[a]であり、メシアの栄光です[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「諸教会の使徒」とも訳せる。ギリシャ語は、使命を託されて遣わされた使者・代表者も、広い意味での使徒も表し得る。ここでは諸教会の代表者という文脈が有力である。
    reason: alternative_reading
  - marker: b
    text: 「キリストの栄光」とも訳せる。「メシア」は、ギリシャ語の称号クリストスを意味に即して訳したもの。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε ὑπὲρ Τίτου
  choice: テトスについて言えば
  rationale: 省略を含む二つの並行した場合分けを、現代日本語で自然に示す。ὑπέρはここでは「～について」の意味。
- source_word: κοινωνὸς ἐμὸς
  choice: 私の仲間
  rationale: 働きと務めを共にする関係を表しつつ、日本語で過度に制度的な響きを避ける。
- source_word: εἰς ὑμᾶς συνεργός
  choice: あなたがたのために働く同労者
  rationale: συνεργόςの共同奉仕者という意味を「同労者」で保ち、εἰς ὑμᾶςが示すコリントの人々への働きの方向を自然に表す。「益のために」までは補わない。
- source_word: ἀδελφοὶ ἡμῶν
  choice: 私たちの兄弟たち
  rationale: 文脈上、派遣された男性たちを指すため、文法上の男性複数をそのまま反映する。
- source_word: ἀπόστολοι ἐκκλησιῶν
  choice: 諸教会の使者
  rationale: ἀπόστολοιには広義の派遣された使者・代表者という意味があり、献金事業の文脈と「諸教会の」という属格に最もよく合う。
- source_word: δόξα Χριστοῦ
  choice: メシアの栄光
  rationale: 動詞のない同格的表現を解消せず、彼らを「メシアの栄光」と呼ぶ原文の強い表現を保持する。Χριστόςは称号として「メシア」と訳す。
theological_decisions:
- issue: 名の挙げられていない兄弟たちに対するἀπόστολοιの意味
  choice: 諸教会から遣わされた「使者」
  alternative: 諸教会の「使徒」
  rationale: 彼らは献金に関して諸教会を代表する派遣者として描かれており、特定の使徒職に就く者だと断定する必要はない。ただし語の持つ別の訳語は脚注で残す。
- issue: Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςを称号として訳す方針に従う。日本語で定着した「キリスト」も脚注に示す。
- issue: δόξα Χριστοῦの関係
  choice: メシアの栄光
  alternative: メシアに栄光をもたらす者たち
  rationale: 属格と名詞句の簡潔さを保ち、彼らがメシアの栄光を体現・顕示するという含みを説明的な動詞で一義化しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、書簡にふさわしい端正さを保った。「メシアの栄光です」という異例の述語表現は、原文の同格的で神学的に含みのある言い方を平板化しないために保持した。
