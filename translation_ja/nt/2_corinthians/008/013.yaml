  text: For I do not mean that there should be relief for others and hardship for you, but equality[a]—
translation:
  language: ja
  text: というのは、ほかの人々の負担を軽くし、あなたがたに負担を負わせるためではなく、公平を基準としてです――
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ ἵνα
  choice: というのも、…させようというのではなく
  rationale: γάρの説明的なつながりと、ἵναを伴う否定された意図を、現代日本語で自然に表した。原文で省略されている意図の動詞は「ようという」として補った。
- source_word: ἄλλοις ἄνεσις
  choice: ほかの人々には楽をさせ
  rationale: ἄνεσιςは圧迫や負担から解放された状態を指す。対句を明瞭に保つため、「楽」という簡潔な名詞的表現を用いた。
- source_word: ὑμῖν θλῖψις
  choice: あなたがたには苦労をさせ
  rationale: θλῖψιςはここでは献金によって生じる圧迫や困窮を表す。「苦労」は実際的な負担を自然に伝え、ἄνεσιςとの対照も保つ。
- source_word: ἀλλ’ ἐξ ἰσότητος
  choice: 均衡を図るためです
  rationale: ἰσότηςは平等、公平、釣り合いを表し、ἐξはその原理・基準を示す。後続節とのつながりを考慮し、所有物の厳密な同一化と誤解されにくい「均衡」を採用した。
theological_decisions:
- issue: 物質的な分かち合いにおけるἰσότηςの意味
  choice: 均衡
  alternative: 平等／公平
  rationale: 語は厳密に同量の所有を要求するとは限らず、双方の必要に応じた釣り合いや公平を含み得る。「均衡」はその幅を保ち、特定の経済思想へ意味を狭めない。脚注で主要な語義上の代案を示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。ἄνεσιςとθλῖψιςの対照を「楽」と「苦労」で再現し、節末は次節へ論旨が続くことを踏まえた表現とした。
