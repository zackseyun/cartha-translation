  text: καὶ οὐ καθὼς ἠλπίσαμεν ἀλλ’ ἑαυτοὺς ἔδωκαν πρῶτον τῷ κυρίῳ καὶ ἡμῖν διὰ θελήματος θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/005.yaml
  text: And not as we expected[a], but they gave themselves first to the Lord and to us through the will of God[b],
translation:
  language: ja
  text: そして、私たちが期待したとおりではなく[a]、彼らはまず自分自身を主に、また神のみこころによって私たちにささげました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私たちが望んだとおりではなく」。
    reason: lexical_alternative
  - marker: b
    text: または「神のみこころを通して」「神のみこころに従って」。この句は、彼らが自分自身をささげたこと全体にかかるとも取れる。
    reason: lexical_and_syntactical_alternative
lexical_decisions:
- source_word: καθὼς ἠλπίσαμεν
  choice: 私たちが期待していた以上に
  rationale: οὐ καθὼς は直訳的には「私たちが期待したとおりではなく」だが、文脈では期待を超えた行動を述べるため、自然な日本語で「期待していた以上に」とした。ἐλπίζω の基本的な「望む」という訳も脚注に残した。
- source_word: ἑαυτοὺς ἔδωκαν
  choice: 自分自身を…ささげ／委ねました
  rationale: 金銭だけでなく彼ら自身の献身を表す再帰表現を保持した。主に対しては自然な「ささげ」、使徒たちに対しては誤解を避けつつ同じ自己委託を表す「委ね」を用いた。
- source_word: πρῶτον
  choice: まず
  rationale: 時間的・論理的な優先を限定せず簡潔に表す。
- source_word: τῷ κυρίῳ
  choice: 主に
  rationale: κύριος の通常の訳語として「主」を用い、与格の方向性を「に」で示した。
- source_word: καὶ ἡμῖν
  choice: そして…私たちにも
  rationale: 主への自己献身に続く使徒たちへの自己委託を示す並列の与格を保持し、「も」で対応関係を明確にした。
- source_word: διὰ θελήματος θεοῦ
  choice: 神のみこころによって
  rationale: διά＋属格が表し得る手段・働き・根拠を一つに限定しない自然な日本語。「意志」より聖書本文として平明で尊厳ある「みこころ」を選んだ。
theological_decisions:
- issue: 主と使徒たちに自分自身を与えることの関係
  choice: 「まず」を主への献身に結びつけ、その後に使徒たちへの自己委託を置いた。
  alternative: 「まず」を、献金に先立って自分自身をささげたという意味に取り、主と使徒たちを一組の受け手と見ることもできる。
  rationale: 語順が示す主への優先性を保ちながら、使徒たちへの委託を主への献身と同格にするような説明は加えない。
- issue: διὰ θελήματος θεοῦ の係り先と意味
  choice: 「神のみこころによって」を使徒たちへの自己委託に近接させつつ、神の働き・認可・みこころとの一致を特定しない。
  alternative: 句を自己献身全体にかけ、「神のみこころに従って」と訳すこともできる。
  rationale: ギリシア語の語順と διά＋属格の幅を尊重し、神の因果的働きか規範的なみこころかを断定しない。
translation_notes:
  register: 明瞭な現代標準日本語。自己献身を金銭的寄付に還元しないよう「自分自身」を明示した。「ささげる」と「委ねる」を使い分け、主と使徒たちを同列視する不自然さを避けつつ、原文の二つの与格を保った。
