  source_fidelity: 「豊かさ」「不足」の対応と、相互に必要を満たすという中心的意味はよく捉えている。しかし、「補い、…補うことになって、平等が生まれるためです」は、二つの目的節（ἵνα、ὅπως）とγένηταιの関係をやや不明瞭にし、日本語としても文の結びが不自然である。
  naturalness: 「今この時には、あなたがたの豊かさは彼らの不足のためにあり、彼らの豊かさもまたあなたがたの不足のためにあるようになり、平等が実現するのです」とすると、原文の並行と目的の流れを保ちながら、明快な現代標準語になる。
