source:
  edition: SBLGNT
  text: ἐν τῷ νῦν καιρῷ τὸ ὑμῶν περίσσευμα εἰς τὸ ἐκείνων ὑστέρημα, ἵνα καὶ τὸ ἐκείνων περίσσευμα γένηται εἰς τὸ ὑμῶν ὑστέρημα, ὅπως γένηται ἰσότης·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/014.yaml
  text: At the present time[a], your abundance is for their need, so that their abundance may also be for your need, in order that there may be equality.
translation:
  language: ja
  text: 今この時には、あなたがたの豊かさは彼らの不足のためにあり、彼らの豊かさもまたあなたがたの不足のためにあるようになり、平等[a]が実現するのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「公平」「均衡」とも訳せる。ここでのギリシア語は、必ずしも全員が同じだけ所有することではなく、互いの必要が満たされることによる釣り合いを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ νῦν καιρῷ
  choice: 今この時
  rationale: καιρόςの状況的・時機的な含みを保ちつつ、現代日本語として明快に表した。
- source_word: τὸ ὑμῶν περίσσευμα / τὸ ἐκείνων περίσσευμα
  choice: あなたがたの豊かさ／彼らの豊かさ
  rationale: περίσσευμαは必要を超えて有しているものを指す。文脈上は物質的な余裕が中心だが、金銭だけに限定せず、相互性を示す並行表現も保った。
- source_word: εἰς τὸ ἐκείνων ὑστέρημα / εἰς τὸ ὑμῶν ὑστέρημα
  choice: 彼らの不足を補い／あなたがたの不足を補う
  rationale: εἰςが示す方向・目的を、日本語では「不足を補う」と自然に明示した。ὑστέρημαの欠乏・必要の意味を具体的に伝える。
- source_word: ἵνα καί
  choice: もまた……ことになって
  rationale: ἵναの目的・結果の含みと、καίが示す相互性を保った。未来の相互扶助を断定しすぎないよう「ことになって」とした。
- source_word: ὅπως γένηται ἰσότης
  choice: 平等が生まれるためです
  rationale: γένηταιの生成の意味を「生まれる」で表し、ἰσότηςには直接的な対応語「平等」を用いた。文脈上の意味は脚注で限定した。
theological_decisions:
- issue: パウロの献金勧告におけるἰσότηςの意味
  choice: 必要を相互に満たすことによる平等
  alternative: 公平、公正、均衡
  rationale: 文脈は全員の所有物を同一にすることではなく、現在の豊かさによって他者の不足を補い、状況が逆転した際にも互いに支え合うことを述べる。本文では原語に近い「平等」を残し、意味の範囲を脚注で説明した。
translation_notes:
  register: 明快で格調を保った現代標準語。ギリシア語の対称的な構造を「あなたがた／彼ら」「豊かさ／不足」「補う」の反復によって再現した。
