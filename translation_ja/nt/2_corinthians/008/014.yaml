revisions:
- from: 今この時、あなたがたの豊かさが彼らの不足を補い、彼らの豊かさもまたあなたがたの不足を補うことになって、平等[a]が生まれるためです。
  to: 今この時には、あなたがたの豊かさは彼らの不足のためにあり、彼らの豊かさもまたあなたがたの不足のためにあるようになり、平等[a]が実現するのです。
  rationale: 「〜のためにある」はεἰςが示す向き・目的を自然に表し、二度の「豊かさ／不足」の並行を保持する。「〜あるようになり」は二つ目のγένηταιを反映し、「平等が実現するのです」によりὅπως γένηται ἰσότηςの目的を明確にした。脚注は英語監査記録の「not necessarily identical possessions」という限定を保つよう調整した。
