id: 2CO.8.9
reference: 2 Corinthians 8:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γινώσκετε γὰρ τὴν χάριν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὅτι δι’ ὑμᾶς ἐπτώχευσεν πλούσιος ὤν, ἵνα ὑμεῖς τῇ ἐκείνου πτωχείᾳ πλουτήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/009.yaml
  text: For you know the grace of our Lord Jesus Christ[a], that though he was rich, yet for your sake he became poor[b], so that you by his poverty might become rich.
translation:
  language: ja
  text: あなたがたは、私たちの主イエス・キリスト[a]の恵みを知っています。すなわち、キリストは富んでおられたのに、あなたがたのために貧しくなられました。それは、あなたがたがキリストの貧しさによって富むためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア（油を注がれた者）」という称号です。
    reason: alternative_reading
  - marker: b
    text: ここでいう「富」と「貧しさ」は比喩的表現と考えられますが、パウロはこの節ではその内容を明確に限定していません。
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: 知っています
  rationale: 現在能動直説法二人称複数。コリントの信徒たちがすでに知っている事柄に訴える文脈なので、現代日本語では「知っています」が自然。
- source_word: χάριν
  choice: 恵み
  rationale: 恩恵、好意、惜しみない行為を含み得る語。ここではキリストの恵み深い自己献身と、周囲の文脈にある寛大な献げ物への模範の両方を響かせる「恵み」とした。
- source_word: κυρίου
  choice: 主
  rationale: 権威とキリスト論的な重みを保つ標準的な訳語。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語で定着した称号表現を採用した。「キリスト」は固有名の一部のようにも受け取られ得るため、脚注で称号の意味を示す。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのために
  rationale: διά＋対格の受益的な意味を、自然な日本語で表した。
- source_word: πλούσιος ὤν
  choice: 富んでおられたのに
  rationale: 分詞句の譲歩的な対比を明示しつつ、敬意を備えた自然な表現とした。
- source_word: ἐπτώχευσεν
  choice: 貧しくなられました
  rationale: 「富んでいた」状態から「貧しくなった」動きを保ち、どのような意味での貧しさかは限定しない。
- source_word: τῇ ἐκείνου πτωχείᾳ
  choice: その貧しさによって
  rationale: 与格の手段的用法を「によって」で表し、ἐκείνουは直前のキリストを指す「その」とした。
- source_word: πλουτήσητε
  choice: 富む者となる
  rationale: ἵναに続くアオリスト能動接続法の目的を示し、「貧しくなる」と「富む」の意図的な対照を保持した。
theological_decisions:
- issue: キリストが「富んでいた」ことと、信者が「富む者となる」ことの意味
  choice: 本文では経済的語彙による比喩をそのまま保ち、その内容を一つに限定しない。
  alternative: キリストの受肉前の神的栄光、メシアとしての特権、物質的富、救いによる霊的祝福、または共同体的・倫理的豊かさのいずれかに特定する。
  rationale: ギリシア語本文は「富」と「貧しさ」の対照を明示する一方、その指示内容をここで定義していない。自己献身と寛大さへの勧めという文脈上の緊張を保つため、訳文では解釈を狭めない。
- issue: ὅτιが導く内容の提示
  choice: 「すなわち」で、知られている「恵み」の内容を説明する。
  alternative: 「ということです」またはコロンのみでつなぐ。
  rationale: ὅτιはここで「恵み」の具体的内容を導く。日本語では文を分けて「すなわち」とすることで構造を明瞭にしつつ、因果関係とは解さない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、キリストへの敬意を示すため「おられた」「なられました」を採用した。原文の富／貧しさの対照と神学的な幅を保ち、説明的な語を本文へ過度に補わない。脚注記号[a]と[b]はいずれも本文中に配置した。
