  text: Χάρις δὲ τῷ θεῷ τῷ ⸀διδόντι τὴν αὐτὴν σπουδὴν ὑπὲρ ὑμῶν ἐν τῇ καρδίᾳ Τίτου,
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/016.yaml
  text: But thanks be to God[a], who puts the same earnestness for you into Titus's heart,
translation:
  language: ja
  text: しかし、あなたがたへの同じ熱意をテトスの心に与えてくださる神に、感謝します。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χάρις δὲ τῷ θεῷ
  choice: しかし、神に、感謝します
  rationale: χάρις と与格 τῷ θεῷ の組み合わせは、ここでは「恵み」ではなく神への感謝を表す定型的な言い回し。δὲ は前段からの穏やかな転換を示すため「しかし」とした。
- source_word: τῷ διδόντι
  choice: 与えてくださる
  rationale: 現在分詞として、神がその熱意をテトスの内に与える方であることを表す。神の行為を述べる自然で敬意ある日本語として補助動詞「くださる」を用いた。
- source_word: τὴν αὐτὴν σπουδὴν
  choice: 私と同じ熱意
  rationale: σπουδή はこの文脈では真剣な配慮を伴う熱意。αὐτήν の比較対象は文脈上パウロの熱意だが原文では明示されないため、本文では理解しやすいよう「私と」を補い、脚注で原文の簡潔な形を示した。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたのために
  rationale: コリントの信徒たちに向けられた配慮と尽力を自然に表す。
- source_word: ἐν τῇ καρδίᾳ Τίτου
  choice: テトスの心に
  rationale: ἐν は字義的には「中に」だが、δίδωμι とともに内的な思いや姿勢を与える比喩を構成するため、日本語では「心に与える」とした。
theological_decisions:
- issue: 「同じ熱意」の比較対象
  choice: 本文で「私と」を補う
  alternative: 「同じ熱意」とだけ訳す
  rationale: 直前まで語っているパウロ自身のコリント人への熱意が比較対象と理解される。ただしギリシア語本文に「私と」は明記されていないため、脚注で明示した。
translation_notes:
  register: 現代標準日本語による、明快で品位のある書簡文。「感謝します」は過度に古風な「感謝あれ」を避けつつ、神への感謝の表明を自然に伝える。
