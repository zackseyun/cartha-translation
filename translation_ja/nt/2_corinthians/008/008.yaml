id: 2CO.8.8
reference: 2 Corinthians 8:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐ κατ’ ἐπιταγὴν λέγω ἀλλὰ διὰ τῆς ἑτέρων σπουδῆς καὶ τὸ τῆς ὑμετέρας ἀγάπης γνήσιον δοκιμάζων·
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/008.yaml
  text: I am not saying this as a command[b][a], but through the earnestness of others I am also testing the genuineness of your love.
translation:
  language: ja
  text: 私は、命令としてこう言っているのではありません。そうではなく、ほかの人たちの熱意[a]によって、あなたがたの愛が本物であるかどうかをも確かめている[b]のです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「熱意」は「意欲」「熱心さ」または「勤勉さ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「確かめている」は「試している」または「本物であることを明らかにしている」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιταγή
  choice: 命令
  rationale: 権威をもって命じることを表す語であり、「命令として」は οὐ κατ’ ἐπιταγήν の意味を自然な現代日本語で明確に伝える。
- source_word: διὰ τῆς ἑτέρων σπουδῆς
  choice: ほかの人たちの熱心さを通して
  rationale: διά＋属格の手段的な意味を「通して」で保ち、ἑτέρων を文脈上の特定集団に限定せず「ほかの人たち」とした。
- source_word: σπουδή
  choice: 熱心さ
  rationale: この文脈では、急ぐことよりも、進んで真剣に取り組む姿勢を指す。「熱心さ」は意欲と真剣さの両方を自然に表す。
- source_word: ἀγάπη
  choice: 愛
  rationale: 基本的かつ文脈に適した訳語であり、献金という行為に表れるコリントの人々の愛を指す。
- source_word: γνήσιον
  choice: 本物であるかどうか
  rationale: 実質名詞的に用いられた形容詞で、愛の真正さ・偽りのなさを示す。日本語では「愛の真正さ」よりも明瞭で自然である。
- source_word: δοκιμάζων
  choice: 確かめている
  rationale: 主動詞と同時に進む行為として自然に表し、吟味して真価を明らかにするという語義を保つ。
- source_word: καί
  choice: も
  rationale: 他の人々の熱心さに言及することに加え、コリントの人々の愛を確かめるという付加的な働きを示す。
- source_word: ὑμετέρας
  choice: あなたがたの
  rationale: コリントの共同体を指す複数の所有を、標準的な日本語で明確に表す。
theological_decisions:
- issue: 献金に関するパウロの修辞的立場
  choice: パウロはこれを命令として述べているのではなく、他者の熱心さを介してコリントの人々の愛の真正さを確かめている。
  alternative: 実質的には命令でありながら、表現だけを和らげている。
  rationale: οὐ κατ’ ἐπιταγὴν λέγω は、命令という形で語っていないことを明言する。使徒的権威と、自発的な愛に基づく応答との緊張を弱めずに訳した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロの使徒的な語調にふさわしい品位を保った。「むしろ」で ἀλλά の対比を示し、命令ではないことと愛を吟味することの緊張を保持した。
