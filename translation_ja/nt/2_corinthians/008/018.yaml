id: 2CO.8.18
reference: 2 Corinthians 8:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνεπέμψαμεν δὲ μετ’ αὐτοῦ τὸν ἀδελφὸν οὗ ὁ ἔπαινος ἐν τῷ εὐαγγελίῳ διὰ πασῶν τῶν ἐκκλησιῶν—
base_translation:
  language: en
  yaml_path: translation/nt/2_corinthians/008/018.yaml
  text: And we sent with him the brother whose praise in the gospel is throughout all the churches—[a]
translation:
  language: ja
  text: また私たちは、彼と一緒に、福音に関してすべての教会で称賛されているその兄弟を遣わしました—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「福音に関する彼の評判が、すべての教会に広まっている兄弟」。
    reason: ὁ ἔπαινοςは「称賛」のほか「評判」とも表現でき、διά＋属格は諸教会全体に及ぶ広がりを示す。
lexical_decisions:
- source_word: συνεπέμψαμεν
  choice: 一緒に…遣わしました
  rationale: アオリスト直説法の完了した派遣を表し、接頭辞 σύν が示す同行の意味を、自然な日本語で明示した。
- source_word: δὲ
  choice: また
  rationale: 強い対立ではなく、叙述を進める穏やかな接続を示す。
- source_word: μετ’ αὐτοῦ
  choice: 彼と一緒に
  rationale: 属格を伴う μετά の同行の意味を直接表した。
- source_word: τὸν ἀδελφόν
  choice: その兄弟
  rationale: 定冠詞のある男性単数形で、読者に知られた特定の男性信徒を指すため、「その兄弟」とした。「私たちの」は原文にないので加えなかった。
- source_word: οὗ ὁ ἔπαινος
  choice: 称賛されている
  rationale: 直訳的な名詞構文は日本語では不自然になりやすいため、関係節を受身で表しつつ、ἔπαινος の肯定的な評価の意味を保った。
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: 福音のことで
  rationale: 称賛が福音と関係することを示しながら、「宣教」や特定の職務に限定せず、原文の意味の幅を残した。
- source_word: διὰ πασῶν τῶν ἐκκλησιῶν
  choice: すべての教会から
  rationale: 諸教会全体にわたる広範な称賛を自然な日本語で表した。別の構文理解も脚注に示した。
- source_word: ἐκκλησιῶν
  choice: 教会
  rationale: パウロ書簡で各地のキリスト者共同体を指す標準的で明瞭な訳語を用いた。
theological_decisions:
- issue: ἀδελφός が指す人物の性別と身分
  choice: 特定の男性信徒を指す「その兄弟」
  alternative: 一般的な「仲間の信徒」
  rationale: 男性単数形と定冠詞、および同行者を扱う文脈は、特定の男性協力者を指す。一般化して人物性を薄めないようにした。
- issue: ἐν τῷ εὐαγγελίῳ の意味範囲
  choice: 「福音のことで」とし、福音との関係を広く保つ
  alternative: 「福音を宣べ伝える働きのことで」または「福音宣教において」
  rationale: 原文は説教、宣教職、あるいは特定の奉仕を明記していないため、狭い役割を補わなかった。
- issue: ἔπαινος と諸教会との関係
  choice: 諸教会を称賛の発信元として「すべての教会から称賛されている」と表す
  alternative: 称賛が諸教会の間に広がっていると捉える
  rationale: διά＋属格は全体にわたる広がりを示し得る。本文では自然な日本語を優先したが、構文上の別のニュアンスを脚注で保持した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある書簡文体。「称賛されている」と動詞化して読みやすくしつつ、福音との関係は限定しすぎない表現にした。末尾のダッシュは原文提示および前後に続く文の流れを保持するため残した。
