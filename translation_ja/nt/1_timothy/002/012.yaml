id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: ja
  text: しかし、私は女が教えたり、男[a]に対して権威を行使したり[b]することを許しません。むしろ、静かにしているべきです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「妻が……夫に対して」とも訳せる。ギリシア語の語は、それぞれ一般に「女／男」を意味することも、婚姻関係の「妻／夫」を意味することもある。
    reason: alternative_reading
  - marker: b
    text: 「権威を持つ」または「支配する」とも訳せる。このギリシア語動詞は用例が少なく、ここでの語感について見解が分かれている。
    reason: lexical_alternative
  - marker: c
    text: 「黙って」とも訳せる。ギリシア語は文脈により、静けさ、落ち着き、または沈黙を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: 教える
  rationale: ἐπιτρέπωの補語となる不定詞を、自然かつ直接的な現代日本語で表した。継続相を不必要に補わない。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの勧めから、この節の禁止へ移る穏やかな対比を示す。
- source_word: γυναικὶ
  choice: 女
  rationale: γυνήには「女」と「妻」の両義があるが、2:9–15の文脈は広く女性を扱っているため、本文では一般的な意味を採った。婚姻上の意味は脚注に残した。
- source_word: οὐκ ἐπιτρέπω
  choice: 私は……許しません
  rationale: 現在形を一般的な方針を述べる自然な日本語として訳した。「許可しません」より平明でありながら、原文の明確さを保つ。
- source_word: οὐδὲ
  choice: ……たり、……たりすることを［許しません］
  rationale: 二つの不定詞を同じ禁止のもとに並列するギリシア語の構造を、日本語の自然な否定的並列で表した。
- source_word: αὐθεντεῖν
  choice: 権威を行使する
  rationale: まれで語義が論争される動詞について、虐待的支配を意味すると断定せず、中立的な権威の行使として訳した。別の可能性は脚注に示した。
- source_word: ἀνδρός
  choice: 男
  rationale: ἀνήρには「男」と「夫」の両義がある。本文では周辺文脈に照らして一般的な意味を採り、婚姻上の読みを脚注に残した。
- source_word: ἀλλ’
  choice: むしろ
  rationale: 禁止された行為と、その代わりに求められるあり方との明確な対比を自然に示す。
- source_word: εἶναι
  choice: しているべきです
  rationale: 不定詞の構文を、日本語で期待されるあり方を示す自然な述語にした。「とどまる」という意味は原文に明示されないため補わない。
- source_word: ἐν ἡσυχίᾳ
  choice: 静かに
  rationale: ἡσυχίαが表し得る落ち着き・静けさを自然な日本語で示し、絶対的な無言と断定することを避けた。
theological_decisions:
- issue: 論争のあるαὐθεντεῖνの意味
  choice: 権威を行使する
  alternative: 権威を持つ／支配する／威圧的に振る舞う
  rationale: このまれな動詞の否定的・威圧的な含意は確定していない。本文では中立的な表現を採り、教会的役割をめぐる議論を翻訳によって先取りしない。
- issue: γυνή／ἀνήρを一般的な男女と取るか、妻と夫と取るか
  choice: 女……男
  alternative: 妻……夫
  rationale: 両名詞には一般的意味と婚姻上の意味がある。周辺文脈では女性一般が論じられているため本文では前者を採るが、原語の真正な曖昧さを脚注で保持する。
- issue: ἡσυχίαが静けさか沈黙か
  choice: 静かに
  alternative: 黙って／沈黙して
  rationale: この語は文脈により落ち着いた静けさにも沈黙にもなり得る。絶対的な発言禁止を訳語だけで確定しないよう、より幅のある表現を本文に置く。
translation_notes:
  register: 明瞭で現代的ながら、使徒的指示としての重みを保つ文体。「女」「男」は原文の対を簡潔に再現する。脚注記号は該当する語義上の曖昧さの直後に置き、本文の読みやすさと検証可能性を両立させた。
