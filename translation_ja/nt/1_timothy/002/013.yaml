  text: Ἀδὰμ γὰρ πρῶτος ἐπλάσθη, εἶτα Εὕα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/013.yaml
  text: For Adam was formed first[a], then Eve.
translation:
  language: ja
  text: というのは、アダムが最初に形造られ[a]、その後にエバが形造られたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「形づくられ」。この動詞は、創世記の創造記事で人が形造られる場面を思い起こさせます。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: というのは……からです
  rationale: 直前の教えの根拠を示す接続辞。日本語として自然な理由説明の構文にし、説明・根拠を示す力を保った。
- source_word: Ἀδὰμ
  choice: アダム
  rationale: 日本語聖書で定着している固有名の表記を用いた。
- source_word: πρῶτος
  choice: 最初に
  rationale: エバとの関係における形成の時間的順序を明確に表す。
- source_word: ἐπλάσθη
  choice: 形造られた
  rationale: πλάσσωの受動形で、素材を形づくる意味と創世記の人の形成を語る表現との響きを保つ。「創造された」よりも原語の具体性がある。
- source_word: εἶτα
  choice: その後に
  rationale: 先行する出来事に続く時間的順序を自然かつ明確に示す。
- source_word: Εὕα
  choice: エバ
  rationale: 日本語聖書で定着している固有名の表記を用いた。
theological_decisions:
- issue: 論争のある教会的文脈における、創世記の創造順序との関係
  choice: アダムが最初に、エバがその後に形造られたという時間的順序だけを訳文に示す。
  alternative: 権威や役割の区別についての含意を訳文に織り込む。
  rationale: この節のギリシア語本文が明言しているのは形成の順序であり、その順序から導かれる神学的結論そのものではない。本文を越えて教理的結論を加えず、神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「というのは……からです」によってγὰρの根拠提示を日本語で自然に表し、後半にも動詞を補って意味を明確にした。
