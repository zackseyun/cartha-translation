- from: このために[a]、私は宣教者また使徒として任命されました――私は真実を語っており、偽ってはいません――そして、信仰[c]と真理をもって異邦人[b]を教える者とされました。
  to: このために[a]、私は、告げ知らせる者、使徒、また信仰[c]と真理において異邦人[b]を教える者として任命されました――私は真実を語ります。偽ってはいません――。
  rationale: 単一の「任命されました」に三つの務めを係らせ、原文の統語関係を回復しました。「告げ知らせる者」はκῆρυξの公的な告知者という意味を現代日本語で表します。ἐν πίστει καὶ ἀληθείᾳは「信仰と真理において」として本文に保ち、πίστιςを「忠実さ」と取る可能性は脚注に留めました。
