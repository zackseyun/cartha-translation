id: 1TI.2.7
reference: 1 Timothy 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: ja
  text: このために[a]、私は、告げ知らせる者、使徒、また信仰[c]と真理において異邦人[b]を教える者として任命されました――私は真実を語ります。偽ってはいません――。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私はそのために任命されました」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「諸国民を教える者」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「忠実さと真理において」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: このために
  rationale: 直前に述べられた救いとその証しを受ける目的・使命を指す表現として、自然な日本語にした。関係表現として「そのために」と取る余地は脚注に残した。
- source_word: ἐτέθην
  choice: 任命されました
  rationale: 物理的に「置かれた」という意味ではなく、務めに就けられたことを表す受動形であるため。
- source_word: κῆρυξ
  choice: 宣教者
  rationale: 他者から託された知らせを公に告げる者という意味を、現代日本語で簡潔かつ品位ある語にした。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: パウロが自身の務めを示す定着した称号であり、単なる使者より文脈に即している。
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: 私は真実を語っており、偽ってはいません
  rationale: 二重の強調を保ちつつ、挿入的な自己証言として自然な現代日本語にした。
- source_word: διδάσκαλος ἐθνῶν
  choice: 異邦人を教える者
  rationale: パウロ書簡でのἔθνηはこの文脈では非ユダヤ人を指す可能性が高い。「諸国民」という広い語義は脚注に残した。
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: 信仰と真理をもって
  rationale: 務めを行う領域またはあり方を表す句として自然に訳した。πίστιςの基本義として「信仰」を本文に置き、「誠実」の可能性を脚注に示した。
theological_decisions:
- issue: パウロの使命におけるἐθνῶνの指示対象
  choice: 異邦人
  alternative: 諸国民
  rationale: パウロの用法と文脈では非ユダヤ人を指すと理解するのが自然だが、語自体には「諸国民」の意味もあるため脚注で保持した。
- issue: ἐν πίστει καὶ ἀληθείᾳにおけるπίστιςの意味
  choice: 信仰
  alternative: 誠実
  rationale: 「信仰」が通常の訳として適切である一方、ここでは務めのあり方として「誠実」を意味する可能性も排除できないため、解釈を固定せず脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用い、パウロの任命と厳粛な自己証言が伝わるよう、挿入句をダッシュで示した。「宣教者」「使徒」「信仰」「真理」は一般読者にも通じる定着した聖書語彙として保持し、文全体は丁寧体で統一した。
