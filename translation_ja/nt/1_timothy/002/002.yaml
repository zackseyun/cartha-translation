source:
  edition: SBLGNT
  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: ja
  text: 王たち、および高い地位にあるすべての人々のために[a]。私たちが、あらゆる敬虔さと品位をもって、平穏で静かな生活を送れるようにです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「権威ある地位にあるすべての人々のために」。ギリシア語は直訳すると「高位にあるすべての人々」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: ～のために
  rationale: 直前の祈り、とりなし、感謝の勧めを受け、特定の人々のために祈ることを自然に表す。
- source_word: βασιλέων
  choice: 王たち
  rationale: 語の具体的な意味を保ち、一般的な「支配者たち」へ広げすぎない。
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: 高い地位にあるすべての人々
  rationale: ὑπεροχήの卓越・高位という幅を保ち、法的権限を持つ官職者だけに限定しない。
- source_word: ἵνα
  choice: それは～ためです
  rationale: 祈りの目的を明確で自然な現代日本語で示す。
- source_word: ἤρεμον καὶ ἡσύχιον
  choice: 平穏で静かな
  rationale: ἤρεμοςの乱されない穏やかさと、ἡσύχιοςの静けさを二つの形容として訳し分ける。
- source_word: βίον διάγωμεν
  choice: 私たちが～生活を送る
  rationale: 地上での暮らし方を表すβίοςと、「過ごす・営む」を意味するδιάγωの組み合わせを自然に表す。
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: あらゆる敬虔さをもって
  rationale: 神への畏敬が生活に表れることを示す牧会書簡の重要語εὐσέβειαを「敬虔さ」とし、πάσῃも明示する。
- source_word: σεμνότητι
  choice: 品位
  rationale: 他者の敬意に値する真摯さ、重み、慎みを、古風になりすぎない語で表す。
theological_decisions:
- issue: 王や高い地位にある人々のために祈ることの範囲と目的
  choice: 支配的立場にある人々のために祈り、信者が平穏に敬虔な生活を送れるよう願う趣旨として訳す。
  alternative: 統治者への服従をより強く示す訳、または正式な政治的権限を持つ者だけに限定する訳。
  rationale: 本文は祈りの対象と目的を述べるが、すべての統治者の無条件な是認や、ここでの対象を官職者のみに限る政治神学までは述べていないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祈りの文脈にふさわしい落ち着いた格調を保った。「平穏」と「静か」、「敬虔さ」と「品位」をそれぞれ区別して残した。
