  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: ja
  text: ですから、私は、男たちがあらゆる場所で、怒りも言い争い[a]もなく、聖なる手を上げて祈ることを望みます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「言い争い」は「疑い」とも訳せる。このギリシャ語は、内心の思考や疑い、また議論を指すことがあるが、ここでは集会内の対立的な言い争いを指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: Βούλομαι
  choice: 望みます
  rationale: 意志または願望を表す語。現代日本語として自然であり、パウロの指示的な語調も保つ。
- source_word: οὖν
  choice: ですから
  rationale: 前の議論を受けた推論または展開を示す接続語として、論理的なつながりを明確にする。
- source_word: προσεύχεσθαι
  choice: 祈る
  rationale: προσεύχομαιの標準的で簡明な訳。ここではΒούλομαιに依存する不定詞である。
- source_word: τοὺς ἄνδρας
  choice: 男たち
  rationale: 周辺文脈では男性と女性への指示が区別されており、ここでのἀνήρは一般的な「人々」や「夫たち」よりも「男たち」が自然である。
- source_word: ἐν παντὶ τόπῳ
  choice: どの場所でも
  rationale: 各地にわたる分配的な意味を保ちつつ、現代日本語として自然に表現する。
- source_word: ἐπαίροντας
  choice: 上げて
  rationale: 祈りに伴う身ぶりを表す分詞。「手を上げて」という自然な日本語にした。
- source_word: ὁσίους χεῖρας
  choice: 聖なる手
  rationale: ὅσιοςが表す、神にかなう聖さや敬虔さを保つ。「清い手」では別の形容詞の含意に寄りやすいため、「聖なる手」とした。
- source_word: χωρὶς
  choice: 抱かず
  rationale: 怒りや言い争いがない状態を、目的語との自然な結びつきによって表した。原義は「〜なしに」。
- source_word: ὀργῆς
  choice: 怒り
  rationale: 対人関係の文脈に適した、明瞭な現代日本語。
- source_word: διαλογισμοῦ
  choice: 言い争い
  rationale: この語は思考、議論、疑いを指し得るが、怒りと並べられ、共同体の祈りを扱うこの文脈では、争いを伴う議論の意味が有力である。語彙的に可能な「疑い」は脚注に残した。
theological_decisions:
- issue: τοὺς ἄνδραςの性別を限定する指示対象
  choice: 男たち
  alternative: 人々／皆／夫たち
  rationale: 男性名詞ἀνήρの具体性を保った。直後の文脈で男性と女性に異なる指示が与えられるため、一般化すると原文の区別が失われる。「夫たち」と限定する明確な文脈上の標識もない。
- issue: 祈りの文脈におけるδιαλογισμοῦの意味
  choice: 言い争い
  alternative: 議論／疑い
  rationale: 「怒り」と並ぶことから、共同体内の対立的な争いを指す可能性が高い。ただし、内面的な推論や疑いという意味も語彙上可能なので、脚注で明示して曖昧さを残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ですから」で文脈との論理的連続を示し、「どの場所でも」で分配的な広がりを自然に表した。原文の男性への限定と、διαλογισμόςの語義上の幅を保持した。
