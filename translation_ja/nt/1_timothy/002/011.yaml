  yaml_path: translation/nt/1_timothy/002/011.yaml
  text: A woman must learn in quietness[b][a], in all submission.
translation:
  language: ja
  text: 女性[a]は、静かに[b]、全面的に従順な態度で学びなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈によっては「妻」とも訳せる。ギリシア語は「女性」と「妻」のどちらも意味し得る。
    reason: alternative_reading
  - marker: b
    text: 別訳「黙って」。ギリシア語は、必ずしも一切口をきかないことではなく、「静かに」「落ち着いて」という意味にもなり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ
  choice: 女
  rationale: γυνήは文脈により「女」または「妻」を意味する。ここでは冠詞のない単数形を一般的な指示と捉え、婚姻関係に限定しない「女」とした。日本語では類を表す語として自然である。
- source_word: ἐν ἡσυχίᾳ
  choice: 静かに
  rationale: ἡσυχίαは絶対的な無言だけでなく、静けさや落ち着いた態度も表し得る。「静かに」はその幅を保ちつつ、現代日本語として自然である。
- source_word: μανθανέτω
  choice: 学びなさい
  rationale: 現在能動命令法三人称単数の指示を、明確な命令表現で訳した。女性が学ぶこと自体を積極的に命じている点も伝わる。
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: 十分に従う姿勢で
  rationale: ὑποταγήの「服従、従うこと」とπάσῃの全面性を表す一方、原文が従う相手を明示していないため、訳文でもその対象を補わなかった。
theological_decisions:
- issue: ἡσυχίαを絶対的な沈黙とするか、静かな態度とするか
  choice: 静かに
  alternative: 黙って
  rationale: この語は「沈黙」とも訳せるが、穏やかで静かなあり方を指すこともできる。本文では意味を絶対的な発話禁止に狭めず、別訳を注記した。
- issue: γυνήを「女」とするか「妻」とするか
  choice: 女
  alternative: 妻
  rationale: 原文自体は婚姻関係を明示しない。「女」は指示対象を不必要に限定せず、「妻」の可能性は脚注に残す。
- issue: ὑποταγήの対象
  choice: 対象を補わない
  alternative: 教師に従う／夫に従う／教会の秩序に従う
  rationale: ギリシア語本文はこの句の中で服従の対象を明示していないため、特定の対象を訳文に持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、命令の力を「学びなさい」で保った。「十分に従う姿勢で」は自然な日本語を優先しながら、従う対象を特定しない原文の曖昧さを保持している。
