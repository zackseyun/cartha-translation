  edition: SBLGNT
  text: ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: ja
  text: この方は、すべての人のために[a]、贖いの代価としてご自分を与えられた。これが、定められた時における証しである[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての人に代わって」とも訳せる。「すべての人」という広い表現が、一人一人を指すのか、あらゆる種類の人を指すのかは、ここでは限定されていない。
    reason: alternative_reading
  - marker: b
    text: 「証言」、または「定められた時に証しされたこと」とも訳せる。原文は圧縮された表現で、キリストがご自分を与えたこと自体が、定められた時に明らかにされた証しだと理解することもできる。
    reason: lexical_alternative
  - marker: c
    text: 「定められた時に示された証し」と訳すこともある。
    reason: previous_rendering
lexical_decisions:
- source_word: δοὺς
  choice: 与えられた
  rationale: アオリスト分詞を、前節の「人キリスト・イエス」を受ける自然な日本語の述語として訳した。「献げられた」よりも原語の基本義に近く、犠牲の意味を訳文に過度に加えない。
- source_word: ἑαυτὸν
  choice: ご自分を
  rationale: 再帰代名詞による自発的な自己授与を、敬意を保った自然な現代日本語で表した。
- source_word: ἀντίλυτρον
  choice: 贖いの代価として
  rationale: 身代わり・交換の含意を持つ稀な語である。「贖いの代価」は救済的意味を明確にしつつ、「身代わりの代価」などの説明的な訳で意味を狭めない。
- source_word: ὑπὲρ πάντων
  choice: すべての人のために
  rationale: ὑπέρの「ために／代わって」と πάντων の広い範囲を自然に表す。「すべて」が個々人を例外なく指すか、あらゆる種類の人を指すかは本文で限定しない。
- source_word: τὸ μαρτύριον
  choice: 証し
  rationale: 直前のキリストの自己授与を同格的・総括的に指す名詞句として理解した。「証言」も可能だが、出来事そのものが神の救いの意志を明らかにするという幅を保つため「証し」とした。
- source_word: καιροῖς ἰδίοις
  choice: 定められた時に
  rationale: 神によってふさわしく定められた時を表す慣用的な句として訳した。日本語では通常、単複を明示しないため、複数形を不自然な「時々」で再現せず簡潔にした。
theological_decisions:
- issue: πάντων が示す贖いの範囲
  choice: 「すべての人のために」と広く訳し、範囲をそれ以上限定しない。
  alternative: 「あらゆる種類の人のために」または「一人残らずすべての人のために」
  rationale: 原文は普遍的な語を用いるが、後代の贖罪範囲論争のいずれかを明示的に確定してはいないため、その緊張を保った。
- issue: ἀντίλυτρον の身代わり的含意
  choice: 本文では「贖いの代価」とする。
  alternative: 「身代わりの代価」または「引き換えの贖い代」
  rationale: ἀντί-には交換・代理の含意があるが、それを説明的に展開すると原文以上の教理的規定になり得る。中心的な贖いの意味を保ち、強い含意は語彙判断に記録した。
- issue: τὸ μαρτύριον と直前の節との構文関係
  choice: 「これが」を補い、キリストの自己授与を「証し」として受ける。
  alternative: 「定められた時における証し」と名詞句のまま同格に置く。
  rationale: ギリシア語は圧縮された同格的表現であり、係り方に余地がある。日本語では完全な名詞句のままでは不自然なため、指示語とコピュラを補ったが、何が証しであるかという基本的な同格関係は維持した。
- issue: καιροῖς ἰδίοις が修飾する内容
  choice: 証しが定められた時に示された、と表現する。
  alternative: 自己授与そのものが定められた時に起こった、または証しが定められた時々に宣べ伝えられた。
  rationale: 原文には「示された」に相当する動詞がなく、句の関係は圧縮されている。本文では自然な日本語に必要な最小限の動詞を補い、脚注で直訳的な可能性を残した。
translation_notes:
  register: 明瞭で格調のある現代標準語。「贖いの代価」は一般語より聖書的だが、この文脈の専門的意味を保つため採用した。敬語は「ご自分」「与えられた」に限定し、過度に荘重な文体を避けた。
