id: 1TI.2.15
reference: 1 Timothy 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: ja
  text: しかし、女は、彼女たちが信仰[b]と愛と聖さのうちに自制をもってとどまるなら、子を産むことを通して[a]救われます[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その出産を通して」とも訳せる。これを特定の誕生、おそらくメシアの誕生を指すと理解する見方もあるが、一般的に「子を産むことを通して」と読むこともできる。
    reason: alternative_reading
  - marker: b
    text: 「信仰」は、ここでは「忠実」と理解することもできる。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は、単数の「女は救われる」から複数の「彼女たちがとどまるなら」へ移っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: 救われます
  rationale: パウロ書簡における σῴζω の通常の神学的意味を保つ。「守られる」「無事である」とすると、本文が明示していない身体的保護に狭めるおそれがある。
- source_word: δὲ
  choice: しかし
  rationale: 前節との穏やかな対照・展開を、現代日本語で自然に示す。
- source_word: διὰ τῆς τεκνογονίας
  choice: 子を産むことを通して
  rationale: τεκνογονία の一般的な意味である出産・子を産むことを自然な日本語で表す。定冠詞が特定の出産を指す可能性は本文で断定せず、脚注に残す。
- source_word: ἐὰν
  choice: もし…なら
  rationale: 条件節を明確に表す。
- source_word: μείνωσιν
  choice: とどまる
  rationale: ある状態に引き続きとどまることを表し、倫理的な持続の含みを保つ。
- source_word: ἐν πίστει
  choice: 信仰のうちに
  rationale: πίστις の標準的な訳語を採用する。「忠実」の可能性は脚注に示す。
- source_word: ἀγάπῃ
  choice: 愛
  rationale: ἀγάπη の標準的で明瞭な訳語。
- source_word: ἁγιασμῷ
  choice: 聖さ
  rationale: 徳目の列挙に合う平明な表現で、専門語に偏りやすい「聖化」より自然である。
- source_word: μετὰ σωφροσύνης
  choice: 慎みをもって
  rationale: σωφροσύνη が表す自制、健全な判断、慎みを、この文脈と直前の用例に調和する自然で品位ある日本語で表す。
theological_decisions:
- issue: 「女は救われる」という単数から「彼女たちがとどまるなら」という複数への移行
  choice: 「女」は単数、「彼女たち」は複数として、原文の数の移行を保持する。
  alternative: 双方を女性一般として「女たちは…彼女たちが」と均す、または単数をエバ、複数を女性一般と明示する。
  rationale: ギリシア語本文にある単数から複数への移行は解釈上重要である。訳文で調和させず、直前の「女」あるいはエバと女性一般との関係をめぐる緊張を残す。
- issue: 「子を産むことを通して救われる」の意味
  choice: 救いの性質や「通して」の働きを限定せず、そのまま保持する。
  alternative: 出産の際に無事に守られる、母としての務めによって救われる、またはメシアの誕生を通して救われる。
  rationale: この表現は複数の解釈が可能であり、原文は身体的保護、母性、特定のメシア的誕生のいずれも明示していないため、本文では決着させない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、難解な構文は条件文として自然に整えた。一方、単数から複数への移行と、「救われる」「子を産むことを通して」が持つ神学的・解釈的な曖昧さは解消せず保持した。「慎み」は現代語として通じる範囲で、文脈にふさわしい品位を保つ語として採用した。
