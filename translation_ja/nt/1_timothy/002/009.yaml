id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: ja
  text: 同じように、女性たちも、慎みと自制をもって、品位ある服装[a]で身を飾り、編み髪や金、真珠、高価な衣服で飾らないようにしなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ふさわしい装い」または「慎み深い服装」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「編み髪や金、真珠、高価な衣服」は、あらゆる状況で編み髪や装身具を用いることを禁じるというより、華美な装いによる自己誇示を指していると考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: 同じように、…も
  rationale: 直前の勧めとのつながりと、καίの付加的な意味を、自然な現代日本語で示す。
- source_word: γυναῖκας
  choice: 女性たち
  rationale: γυνήには「妻」の意味もあるが、ここには既婚女性に限定する明示的な標識がないため、一般的な「女性たち」とした。
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: 品位ある服装で
  rationale: καταστολήを服装・装い、κόσμιοςを秩序と社会的・道徳的なふさわしさを表す語として訳した。
- source_word: μετὰ αἰδοῦς
  choice: 慎みをもって
  rationale: αἰδώςが表す、不適切な振る舞いを控えさせる慎みや節度を、文脈に即して簡潔に表した。
- source_word: σωφροσύνης
  choice: 自制をもって
  rationale: 健全な判断に基づく節制・自己抑制を表す語として、現代語で明瞭な「自制」を選んだ。
- source_word: κοσμεῖν ἑαυτάς
  choice: 身を飾り
  rationale: κοσμέωの「整える、飾る」という意味を保ち、後半の外面的な装飾との対比を明確にした。
- source_word: μὴ ἐν πλέγμασιν
  choice: 編み髪で飾らない
  rationale: πλέγματαは髪を編んだ形や編み込みを指す。本文では解釈的な「凝った」を加えず、簡潔に訳した。
- source_word: χρυσίῳ
  choice: 金
  rationale: 装身具の形状を原文以上に限定せず、広い表現を保った。
- source_word: μαργαρίταις
  choice: 真珠
  rationale: 語の標準的な意味をそのまま訳した。
- source_word: ἱματισμῷ πολυτελεῖ
  choice: 高価な衣服
  rationale: ἱματισμόςの「衣服」とπολυτελήςの「高価な」を、明瞭で自然な現代日本語にした。
theological_decisions:
- issue: 対象が女性一般か、妻に限定されるか
  choice: 女性たち
  alternative: 妻たち
  rationale: 複数形γυναῖκαςを既婚女性に限定する文脈上の明確な根拠がないため、より広い意味を保った。
- issue: 編み髪、金、真珠、高価な衣服があらゆる場合に絶対的に禁じられているか
  choice: 本文では列挙をそのまま保ち、注で華美な自己誇示との対比という文脈を示す
  alternative: すべての編み髪、装身具、高価な衣服に対する無条件の禁止と明示する
  rationale: 構文は、慎みと自制を伴う品位ある装いと、富や華美を見せる装飾とを対比している。ただし本文に「華美な」などを補わず、原文の緊張と表現を保持した。
- issue: κοσμεῖνの勧告的な力
  choice: 飾らないようにしなさい
  alternative: 飾るべきです
  rationale: 不定詞は前節から続く願望・勧告の構文に依存するため、日本語では自然な勧告として表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。衣服と態度の双方に関わる語義を、「品位」「慎み」「自制」によって簡潔に表現した。
