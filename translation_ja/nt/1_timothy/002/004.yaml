id: 1TI.2.4
reference: 1 Timothy 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/004.yaml
  text: who desires all people to be saved and to come to the knowledge of the truth[a][b].
translation:
  language: ja
  text: この方は、すべての人が救われ、真理を知るに至ることを望んでおられます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての人が救われることを願っておられます」または「意志しておられます」。ギリシア語の動詞には「望む」「願う」「意志する」という意味があります。
    reason: lexical_alternative
  - marker: b
    text: 別訳「真理を十分に知るに至る」。ここで「知る」と訳した名詞には、十分な認識という含みがあり得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: この方は
  rationale: 直前の「神」を受ける関係代名詞。日本語では独立した節として自然につながるよう「この方は」とした。
- source_word: πάντας ἀνθρώπους
  choice: すべての人
  rationale: 男性だけでなく人間全般を指すため、現代日本語で明瞭な「すべての人」とした。
- source_word: θέλει
  choice: 望んでおられます
  rationale: θέλωの「望む、願う、欲する」という意味を表しつつ、神の意志に関する神学的論争を訳文だけで決着させない表現とした。
- source_word: σωθῆναι
  choice: 救われ
  rationale: 受動不定詞であり、パウロ書簡における救済の意味を簡潔かつ標準的に示す。
- source_word: εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν
  choice: 真理を知るに至ること
  rationale: εἰς＋ἐλθεῖνの到達の動きを「至る」で保ち、ἐπίγνωσιςは本文では自然な「知る」とした。その「十分な認識」という含みは脚注に示した。
theological_decisions:
- issue: πάντας ἀνθρώπουςの範囲と神の救済意志
  choice: 「すべての人」と普遍的な表現をそのまま訳し、θέλειは「望んでおられます」とした。
  alternative: 「あらゆる種類の人」「すべての人が救われることを意志しておられます」
  rationale: ギリシア語本文は自然には「すべての人」を指す。対象を諸種類の人へ狭めたり、θέλειを専門的な意味での決定的意志に強めたりせず、本文にある神学的緊張を保った。
- issue: ἐπίγνωσιςの意味の強さ
  choice: 本文では「知る」とした。
  alternative: 「十分に知る」「深く知る」
  rationale: ἐπίγνωσιςには十分な認識という含みがあり得るが、この箇所でその強意を本文に明示する必要まではないため、可能性を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神を受ける敬語として「おられます」を用い、教派固有の術語は避けた。
