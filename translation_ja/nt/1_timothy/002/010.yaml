  yaml_path: translation/nt/1_timothy/002/010.yaml
  text: 'but with what is proper for women professing godliness: good works[a][b][c].'
translation:
  language: ja
  text: むしろ、神を敬うこと[a]を公言する女性にふさわしいもの、すなわち良い行いによって[b]身を飾りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神への献身」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「良い行いを通して」。文脈上、良い行いがその女性にふさわしい飾りであることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: むしろ
  rationale: 9節の外面的な装いとの強い対比を自然に示す。日本語では「しかし」よりも、何をもって身を飾るべきかという置き換えを明確にできる。
- source_word: ὃ πρέπει
  choice: ふさわしく
  rationale: 「適している、ふさわしい」という道徳的適合性を表し、前節から続く文の中で自然に機能する。
- source_word: γυναιξὶν
  choice: 女性に
  rationale: この文脈では妻に限定せず、集会にいる女性一般を指す。
- source_word: ἐπαγγελλομέναις
  choice: 公言する
  rationale: 信仰姿勢を自ら表明する意味を保ち、誓約や単なる主張という含みを不必要に加えない。
- source_word: θεοσέβειαν
  choice: 神を敬う
  rationale: 神への畏敬と献身を含む語を、現代日本語で明瞭かつ自然に表す。
- source_word: δι’ ἔργων ἀγαθῶν
  choice: 良い行いによって
  rationale: διά＋属格の手段・様態を保つ。前節の装飾との対比から、良い行いがふさわしい装いであるという含意がある。
theological_decisions:
- issue: 「良い行い」と「神を敬うと公言する」との関係
  choice: 良い行いを、神への敬虔を公言する女性にふさわしい外的な表れとして訳す。
  alternative: 良い行いを、神に受け入れられるための功績的根拠と解する。
  rationale: 統語と文脈は外面的装飾と敬虔にかなう行いを対比している。救いの功績について本文が述べていない主張は訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調のある現代標準語。前節から文が続くため、原文で省略されている「身を飾りなさい」を補って日本語として完結させた。補足の意味は前節の構文と本節の対比から明白である。
