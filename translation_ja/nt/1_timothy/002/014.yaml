  text: καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ⸀ἐξαπατηθεῖσα ἐν παραβάσει γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: ja
  text: また、アダムは欺かれませんでした。しかし、女は欺かれ[a]、違反に陥ったのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すっかり欺かれた」とも訳せる。ここで用いられている動詞は、前の「欺かれた」に当たる動詞とは異なる複合動詞であり、強意を帯びる可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「違反の状態になった」。ギリシア語の完了形は、違反に至った出来事だけでなく、その結果として生じた状態を強調することがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδὰμ
  choice: アダム
  rationale: 固有名詞として、日本語聖書で定着している標準的な音写を用いた。
- source_word: ἠπατήθη
  choice: 欺かれませんでした
  rationale: ἀπατάω のアオリスト受動態を素直に表し、後続する複合動詞 ἐξαπατάω との語感の違いも保てる表現とした。
- source_word: ἡ γυνὴ
  choice: 女
  rationale: γυνή には「妻」の意味もあるが、創世記の出来事を指すアダムとの対比では「女」が直接的であり、本文にない婚姻関係の強調を避けられる。
- source_word: ἐξαπατηθεῖσα
  choice: すっかり欺かれ
  rationale: 先行動作を表すアオリスト受動分詞として訳し、ἐξαπατάω が単純形 ἀπατάω より強い欺きを示し得ることを「すっかり」で表した。ただし強意の程度には幅があるため脚注を付した。
- source_word: ἐν παραβάσει
  choice: 違反を犯す
  rationale: παράβασις は定められた境界や命令を越える「違反」を指す。ギリシア語の抽象名詞を人物への固定的な呼称に変えず、現代日本語として自然な動詞句にした。
- source_word: γέγονεν
  choice: に至ったのです
  rationale: γίνομαι の完了形が示す、出来事とそこから生じた状態の双方を表すため、「なった」だけでなく「に至った」とした。結果状態を強調する別訳は脚注に示した。
- source_word: δὲ
  choice: しかし
  rationale: アダムと女を対照する談話上の働きを明確にした。
- source_word: καὶ
  choice: また
  rationale: 前節から議論を続ける接続を、自然な日本語で表した。
theological_decisions:
- issue: 女と違反との関係を、本文を越えた女性一般への教理的判断に広げずにどう訳すか
  choice: 創世記の出来事に関する叙述として、「女はすっかり欺かれ、違反を犯すに至った」と訳す。
  alternative: 「女は欺かれて違反者となった」
  rationale: 抽象名詞 παράβασις を恒常的な人物呼称「違反者」に変えず、出来事とその結果を述べる原文の範囲にとどめる。これにより、女性一般の本質や責任について本文にない結論を加えない。
- issue: ἐξαπατάω の強意をどの程度本文に出すか
  choice: 「すっかり欺かれ」とし、語感の幅を脚注で示す。
  alternative: 「欺かれ」
  rationale: 直前の ἀπατάω との語形上の対照を見える形で残しつつ、この複合動詞が常に一定の強意を持つと断定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、議論をつなぐ「また」と対比を示す「しかし」を保った。「違反を犯すに至った」は原文の出来事と結果状態を自然に伝え、説明的すぎる言い換えや女性一般への拡張を避ける。すべての脚注記号 [a]、[b] を本文中の対応箇所に置いた。
