id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: ja
  text: そこで、何よりもまず、すべての人のために[a][b][c]、願い、祈り、とりなし、感謝がささげられるように、私は勧めます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての人の利益のために」とも表せる。
    reason: lexical_alternative
  - marker: b
    text: 「人」と訳したギリシア語は、ここでは男性だけでなく人間一般を指す。
    reason: lexical_alternative
  - marker: c
    text: ここを「あらゆる種類・立場の人々」と理解する見方もあるが、ギリシア語本文は単に「すべての人」と述べている。
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 私は勧めます
  rationale: 切実さを伴う使徒的な勧告を表す。現代日本語として自然であり、単なる依頼より強い語調を保つ。
- source_word: οὖν
  choice: そこで
  rationale: 前段を受けた推論的・展開的なつながりを、硬すぎない現代日本語で示す。
- source_word: πρῶτον πάντων
  choice: 何よりもまず
  rationale: 単なる列挙の第一項というより、優先性を強調する慣用句として訳した。
- source_word: ποιεῖσθαι
  choice: ささげる
  rationale: 四つの祈りに関する名詞をまとめて受ける自然な日本語。礼拝行為に限定しすぎず、神に向ける祈りと感謝を表せる。
- source_word: δεήσεις
  choice: 願い
  rationale: 必要から生じる切実な求めを、一般の読者に分かりやすく表す。
- source_word: προσευχάς
  choice: 祈り
  rationale: 祈りを表す一般的な語として素直に訳した。
- source_word: ἐντεύξεις
  choice: とりなし
  rationale: この文脈では他者のために神に願う祈りを表す語として理解でき、後続の「すべての人のために」とも自然につながる。
- source_word: εὐχαριστίας
  choice: 感謝
  rationale: 日本語では単数形の集合的表現が自然であり、ほかの祈りの形との語彙上の区別も保てる。
- source_word: ὑπὲρ
  choice: ために
  rationale: 属格を伴い、他者の益または他者を代表して行うことを表す。本文では自然な「ために」とした。
- source_word: πάντων ἀνθρώπων
  choice: すべての人
  rationale: ἄνθρωποςはここで男性だけでなく人間一般を指すため、「すべての人」と訳した。
theological_decisions:
- issue: πάντων ἀνθρώπωνの範囲
  choice: すべての人
  alternative: あらゆる種類・立場の人々
  rationale: ギリシア語本文は素直には「すべての人」と述べており、個々人全員か、あらゆる種類の人々かという神学的議論を訳文で狭く決めない。
- issue: ἐντεύξειςの意味
  choice: とりなし
  alternative: 願い／訴え
  rationale: 文脈とὑπὲρ πάντων ἀνθρώπωνとの結びつきから「とりなし」が適切だが、この語自体は神への願いや訴えという広がりを持ち得る。
translation_notes:
  register: 明瞭で現代的ながら、祈りへの厳粛な勧告にふさわしい格調を保った。「願い、祈り、とりなし、感謝」という並列を維持し、原文の語彙上の区別を見える形にした。
