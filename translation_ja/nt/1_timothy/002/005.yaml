  rationale: 理由を示す γάρ は「なぜなら」で自然に表した。「唯一であり」を両方の節に明示し、「その仲介者は」を加えて、原文の「一人の仲介者、すなわち人であるキリスト・イエス」という同格的同定を明瞭にした。神性その他の補足は加えていない。
