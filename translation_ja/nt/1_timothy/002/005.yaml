source:
  edition: SBLGNT
  text: εἷς γὰρ θεός, εἷς καὶ μεσίτης θεοῦ καὶ ἀνθρώπων ἄνθρωπος Χριστὸς Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/005.yaml
  text: For there is one God[a], and one mediator between God and men, the man Messiah Jesus[c][b],
translation:
  language: ja
  text: なぜなら、神は唯一であり、神と人々との間の仲介者も唯一であり、その仲介者は人であるメシア・イエスだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς
  choice: 唯一
  rationale: 二度の εἷς をともに「唯一」で表し、「唯一の神／唯一の仲介者」という強調された並行関係を保った。
- source_word: γὰρ
  choice: だからです
  rationale: 直前の勧めを根拠づける説明の接続を、現代日本語として自然な文末表現で示した。
- source_word: θεός
  choice: 神
  rationale: この箇所における標準的な訳語。
- source_word: μεσίτης
  choice: 仲介者
  rationale: 二者の間に立つ者を明確に表し、日本語として理解しやすい。
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: 神と人々との間の
  rationale: 属格を、日本語の「仲介者」が自然に要求する関係表現にした。ἀνθρώπων は人類一般を指す複数形なので「人々」とした。
- source_word: ἄνθρωπος
  choice: 人である
  rationale: イエスの真の人間性を明示しつつ、冠詞のない同格的・質的な働きを自然な日本語で表した。
- source_word: Χριστὸς Ἰησοῦς
  choice: メシア・イエス
  rationale: Χριστός の称号としての意味を「メシア」で訳し、固有名イエスとの結びつきを中黒で明瞭にした。
theological_decisions:
- issue: ἀνθρώπων と ἄνθρωπος の語彙的連関
  choice: 「人々」と「人である」
  alternative: 「人間」と「一人の人」
  rationale: 日本語では「人々／人」とすることで同じ語根の連関が十分に伝わる。複数の ἀνθρώπων は男性だけでなく人類一般を指すため、性別を限定しない「人々」が適切である。
- issue: Χριστός の称号性
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: ここでは Χριστός を称号として明示的に訳し、イエスのメシアとしての務めを伝えた。
- issue: ἄνθρωπος Χριστὸς Ἰησοῦς のキリスト論的含意
  choice: 「人であるメシア・イエス」と端的に訳す
  alternative: 神性を補足する説明を本文に加える
  rationale: 本文が明言する仲介者の人間性を保ちつつ、本文がここで明言も否定もしていない神性について訳文で補足せず、神学的緊張をそのまま残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すなわち」で同格関係を示し、原文の「唯一」の並行と、仲介者が人であるという強調を読み取りやすくした。
