  naturalness: 現行の「仲介者も唯一、すなわち，人である…」は、述語の省略と「すなわち」後の読点のため、明瞭な現代標準日本語として少し読みにくい。「その仲介者は」を補うことで、原文の同格を過剰に解釈せず自然に示せる。
  terminology: 「仲介者」は μεσίτης の適切な訳語であり、「メシア・イエス」も Χριστὸς Ἰησοῦς の称号性を保つ。「人々」と「人」は複数の人類一般と単数の ἄνθρωπος の連関を自然に保っている。
