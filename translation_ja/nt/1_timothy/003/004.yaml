  text: managing his own household well[a], having his children in submission with all dignity[c][b];
translation:
  language: ja
  text: 自分の家庭をよく治め、子どもたちを従順に保っている人[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の家庭をよく指導する」または「自分の家をよく治める」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「従順な子どもたちを持つ」または「子どもたちをきちんと従わせている」。
    reason: lexical_alternative
  - marker: c
    text: 原文の「すべての品位をもって」は、子どもたちの従順のあり方を表すとも、本人が家庭を治める全体的なあり方を表すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: 自分の家庭
  rationale: οἶκοςは家屋だけでなく家族を含む生活共同体を指し得る。ここでは監督者候補が責任を負う家庭生活の範囲なので、「自分の家庭」とした。
- source_word: καλῶς
  choice: よく
  rationale: 家庭を治める仕方が適切で立派であることを、簡潔かつ自然に表す。
- source_word: προϊστάμενον
  choice: 治め
  rationale: 責任をもって前に立ち、指導し、世話をする意味を含む。「管理する」より家庭の秩序に関する権威を保ちつつ、「支配する」ほど強圧的には響かない。
- source_word: τέκνα ἔχοντα ἐν ὑποταγῇ
  choice: 子どもたちを……従わせている
  rationale: 直訳的な「子どもたちを服従のうちに保つ」は現代日本語として不自然なため、実際の権威と秩序を保つ使役表現にした。ただし、単なる外的統制に限定しない。
- source_word: μετὰ πάσης σεμνότητος
  choice: あらゆる品位をもって
  rationale: σεμνότηςの尊厳、慎み、重々しさを「品位」で表した。「あらゆる」はπάσηςを反映する。この句が子どもの従順のあり方を指すのか、家庭を治める全体的なあり方を指すのかは本文で確定しない。
theological_decisions:
- issue: 家庭を治める権威の範囲
  choice: 監督者候補が自分の家庭を責任をもって秩序立てることを述べる資格要件として訳す。
  alternative: 強い家父長的支配を一般原則として読み込む、または権威の要素を単なる世話へ弱める。
  rationale: προΐστημιとὑποταγήは実際の指導権と秩序を示すが、この節は家庭や権威全般についての包括的教説ではなく、監督者の資格を述べている。
- issue: 「あらゆる品位をもって」の係り先
  choice: 本文では係り先を限定せず、語順と読点によって曖昧さを保つ。
  alternative: 子どもたちの従順だけに係る、または本人の家庭管理だけに係ると断定する。
  rationale: ギリシア語は、子どもたちの従順の態度とも、本人が家庭を治める全体的な態度とも理解し得るため、注で両方を示す。
translation_notes:
  register: 明瞭で現代的だが、教会指導者の資格を述べる箇所にふさわしい端正な文体とした。「治める」「従わせる」により原文の権威と秩序を保ちつつ、強圧的な含意は加えていない。
