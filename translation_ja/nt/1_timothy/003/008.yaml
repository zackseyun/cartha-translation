id: 1TI.3.8
reference: 1 Timothy 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διακόνους ὡσαύτως σεμνούς, μὴ διλόγους, μὴ οἴνῳ πολλῷ προσέχοντας, μὴ αἰσχροκερδεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/008.yaml
  text: Deacons likewise must be dignified[a], not double-tongued, not devoted to much wine, not greedy for shameful gain[c][b],
translation:
  language: ja
  text: 執事も同じように、品位があり、二枚舌を使わず[a]、多量のぶどう酒に執着せず[b]、卑しい利益をむさぼらない[c]者でなければなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「相手によって言うことを変えず」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「多量のぶどう酒にのめり込まず」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「恥ずべき利益を追い求めない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διακόνους
  choice: 執事
  rationale: 直前の監督者の資格に続く、教会内で認められた務めに就く人々の資格一覧であるため、一般的な「奉仕者」ではなく職務名として訳した。ただし、後代の特定教派の制度的定義までは含めない。
- source_word: ὡσαύτως
  choice: 同じように
  rationale: 直前の監督者に関する資格との連続性を示しつつ、別の奉仕職を導入する語として、自然で明瞭に訳した。
- source_word: σεμνούς
  choice: 品位があり
  rationale: 陰気な「堅苦しさ」ではなく、尊敬に値する立派な振る舞いを表すため。
- source_word: μὴ διλόγους
  choice: 二枚舌を使わず
  rationale: 相手によって言うことを変える言葉上の不誠実さを表す、原語の鮮明な比喩を自然な日本語で保持した。
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: 多量のぶどう酒に執着せず
  rationale: προσέχω がここで表す継続的な傾倒や執着を示しつつ、現代の医学的な依存症概念を不必要に持ち込まない。「多量の」により πολλῷ も明示した。
- source_word: μὴ αἰσχροκερδεῖς
  choice: 卑しい利益をむさぼらない
  rationale: 恥ずべき仕方で利益を得ようとする貪欲さを、道徳的な重みと原語の構成要素を保って表した。
theological_decisions:
- issue: διάκονος を教会の職務名として訳すか
  choice: 職務名として「執事」と訳す
  alternative: 「奉仕者」または「仕える者」
  rationale: 監督者の資格に続く並行した資格一覧という文脈から、ここでは一般的な奉仕者より、教会内で認められた務めを指す可能性が高い。ただし「執事」は後代の特定教派における権限や制度を本文へ持ち込むものではない。
translation_notes:
  register: 明瞭で現代的ながら、教会での朗読にも耐える端正な文体とした。原文は前節までの構文を受けた資格一覧なので、日本語では「者でなければなりません」を補って完結させた。「二枚舌」は原語の比喩性を保つ一般的な表現であり、脚注で意味を明示した。
