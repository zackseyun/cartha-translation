id: 1TI.3.1
reference: 1 Timothy 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος· εἴ τις ἐπισκοπῆς ὀρέγεται, καλοῦ ἔργου ἐπιθυμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: ja
  text: このことばは信頼に値します。だれかが監督の務め[a]を志すなら、その人は良い働き[b]を望んでいるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「監督者の職」。伝統的には「監督職」。
    reason: alternative_reading
  - marker: b
    text: 別訳「尊い務め」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: このことばは信頼に値します
  rationale: 牧会書簡に見られる、確かな言明を示す定型句として訳した。「ことば」はλόγοςを自然に表し、「信頼に値します」はπιστόςの意味を保ちながら現代日本語として明瞭である。
- source_word: εἴ τις
  choice: だれかが
  rationale: τιςは不定代名詞であり、この句そのものは性別を明示しないため、男性に限定する表現を加えずに訳した。
- source_word: ἐπισκοπῆς
  choice: 監督の務め
  rationale: 見守り、監督する働きや役割を指す語である。後代の教会制度上の称号に固定せず、同時に続くἐπίσκοποςとのつながりが分かる表現とした。
- source_word: ὀρέγεται
  choice: 志す
  rationale: 何かに向かって手を伸ばすことから、目指す、熱望するという意味を持つ。ここでは肯定的な志向を自然な日本語で表した。
- source_word: καλοῦ ἔργου
  choice: 良い働き
  rationale: καλόςの基本的な価値判断と、ἔργονが地位ではなく実際の働きを指すことを保った。
- source_word: ἐπιθυμεῖ
  choice: 望んでいる
  rationale: 願う、切望するという意味を、ὀρέγεταιとの並行を保ちつつ過度に強めない表現で訳した。
theological_decisions:
- issue: ἐπισκοπῆςを後代の固定した教会職制の用語で訳すか
  choice: 監督の務め
  alternative: 監督者の職、監督職
  rationale: 原語は監督する働きや役割を表し得るため、後代の特定の教派制度を本文に持ち込まない。一方で、直後に監督者の資格が述べられる文脈との結びつきは保持した。
- issue: εἴ τιςを男性限定の表現で訳すか
  choice: だれかが
  alternative: ある男性が
  rationale: τις自体は不定であり、この条件節だけから男性限定を明示することは避けた。後続文脈が提起する解釈上の問題を、この語句の訳で先取りしない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、定型句には落ち着いた敬体、内容部には自然で格調を損なわない表現を採用した。「その人」を補って日本語での主語関係を明確にしつつ、原文にない性別指定は加えていない。
