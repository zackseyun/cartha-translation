id: 1TI.3.11
reference: 1 Timothy 3:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γυναῖκας ὡσαύτως σεμνάς, μὴ διαβόλους, νηφαλίους, πιστὰς ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: ja
  text: 同じように、女性たちも、品位があり[a]、人を中傷せず、節度を保ち、すべてのことに忠実でなければなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「同じように、妻たちも品位があり……」。この文脈でギリシア語は「女性たち」とも「妻たち」とも解釈できますが、「彼らの妻たち」とは明記されていません。
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: 女性たち
  rationale: γυνήは文脈により「女性」または「妻」を意味し得る。ここには冠詞も所有表現もなく、「彼らの妻たち」とは明記されていないため、本文では広い意味の「女性たち」とし、「妻たち」の可能性を脚注に残した。
- source_word: ὡσαύτως
  choice: 同じように
  rationale: 直前の資格要件との並行関係を、自然な現代日本語で示す。
- source_word: σεμνάς
  choice: 品位があり
  rationale: 敬意に値する真摯で立派な人格を表す語であり、「品位がある」が簡潔で自然である。
- source_word: μὴ διαβόλους
  choice: 人を中傷せず
  rationale: ここでδιάβολοςは固有称号「悪魔」ではなく、人をそしり、悪く言う者という形容的意味である。
- source_word: νηφαλίους
  choice: 節度を保ち
  rationale: 酒に酔わないという字義から、冷静さと自制を保つ態度までを含み得る。「節度を保つ」は倫理的な慎みを自然に表す。
- source_word: πιστὰς
  choice: 忠実で
  rationale: πιστόςが表す忠実さ、信頼性を保ちつつ、徳目の列挙に適した表現とした。
- source_word: ἐν πᾶσιν
  choice: すべてのことに
  rationale: 限定を設けない包括性をそのまま示す。
theological_decisions:
- issue: 資格要件の中でのγυναῖκαςの指示対象
  choice: 女性たち
  alternative: 妻たち（ただし「彼らの」は原文にない）
  rationale: 女性の奉仕者を指すのか、男性の奉仕者たちの妻を指すのかは文脈上確定しない。ギリシア語は両義的であり、所有表現もないため、本文で「女性たち」とし、重要な別解を脚注に明示して神学的緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。資格要件の簡潔な列挙を保ち、「女性／妻」の真正な曖昧さは脚注で明示した。
