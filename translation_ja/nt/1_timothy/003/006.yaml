  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: ja
  text: 信仰を持つようになって間もない人であってはなりません。高慢になって、悪魔に関わる裁き[a]に陥ることがないためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「悪魔が受けたのと同じ裁き」。「悪魔による裁き」とも理解できる。ギリシア語の「悪魔の」は、どのような関係を示すか曖昧である。
    reason: τοῦ διαβόλου の属格が示す関係についての主要な解釈可能性を示し、本文では曖昧さを保つため。
lexical_decisions:
- source_word: νεόφυτον
  choice: 信仰に入って間もない人
  rationale: 直訳は「新しく植えられた人」。ここでは信仰共同体に新たに加わった人を指すため、教会用語に偏りすぎず意味が明確な表現とした。
- source_word: τυφωθεὶς
  choice: 高慢になり
  rationale: うぬぼれで膨れ上がることを表す受動形。日本語では比喩を直訳するより、「高慢になり」が自然かつ明瞭に警告を伝える。
- source_word: κρίμα
  choice: 裁き
  rationale: 「有罪判決」「断罪」まで限定せず、原語の意味の幅を保つ。
- source_word: τοῦ διαβόλου
  choice: 悪魔に対する
  rationale: 属格の曖昧さを踏まえ、本文では悪魔が受ける裁きという有力な理解を示しつつ、別解を脚注に明記する。
- source_word: ἐμπέσῃ
  choice: 陥る
  rationale: 危険な状態や結果に「落ち込む」という原語の比喩を、自然な日本語で保持する。
- source_word: ἵνα μὴ
  choice: ことがないためです
  rationale: 目的・結果の含みを、現代日本語で明瞭に表す。
theological_decisions:
- issue: εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου の解釈
  choice: 「悪魔に対する裁きに陥る」とし、悪魔が受けたのと同じ裁きを受けるという理解を本文に採用
  alternative: 「悪魔による裁きに陥る」または「悪魔に関わる裁きに陥る」
  rationale: τοῦ διαβόλου は、悪魔を対象とする裁きとも、悪魔を主体とする裁きとも、より広く悪魔に関連する裁きとも取り得る。日本語で不自然な「悪魔の裁き」として曖昧さを装うより、有力な理解を本文に置き、実在する別解を脚注で保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「新参者」「初心者」は一般的すぎるため避け、「信仰に入って間もない人」とした。脚注記号[a]は該当句の直後に置いた。
