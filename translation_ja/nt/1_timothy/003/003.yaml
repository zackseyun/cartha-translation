id: 1TI.3.3
reference: 1 Timothy 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ πάροινον, μὴ ⸀πλήκτην, ἀλλὰ ἐπιεικῆ, ἄμαχον, ἀφιλάργυρον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/003.yaml
  text: not given to drunkenness[a], not violent, but gentle, peaceable, free from the love of money[d][c][b],
translation:
  language: ja
  text: 酒におぼれず[a]、暴力を振るわず[b]、むしろ穏やかで、争いを好まず[c]、金銭を愛さない人でなければなりません[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「酒にふけらず」。
    reason: πάροινον は、酒に依存すること、または酩酊を常とすることを表し得るため。
  - marker: b
    text: 直訳「人を殴らず」。
    reason: πλήκτην の字義的な身体的攻撃性を示すため。
  - marker: c
    text: 別訳「けんかをせず」。
    reason: ἄμαχον は、争いや口論をしないことを表すため。
  - marker: d
    text: 別訳「金銭欲がなく」。
    reason: ἀφιλάργυρον は、金銭への愛着や貪欲がないことを表すため。
lexical_decisions:
- source_word: πάροινον
  choice: 酒におぼれず
  rationale: 酒に依存し、酩酊にふける習慣的傾向を表す語として、現代日本語で自然かつ明瞭に訳した。単なる飲酒そのものを禁じる表現にはしていない。
- source_word: πλήκτην
  choice: 暴力を振るわず
  rationale: 字義的には「殴る者」を指すが、ここでは監督者の性質を述べるため、身体的攻撃性を明確に伝える表現とした。
- source_word: ἐπιεικῆ
  choice: 穏やかで
  rationale: 厳格に権利を押し通さず、寛容で思いやりのある態度を含む語。資格要件の簡潔な列挙として自然な「穏やか」を選んだ。
- source_word: ἄμαχον
  choice: 争いを好まず
  rationale: けんかや口論に向かう性質がないことを示す。否定の接頭辞を持つ原語の形と人物の性向を自然に表した。
- source_word: ἀφιλάργυρον
  choice: 金銭を愛さない
  rationale: 「銀・金銭を愛する者ではない」という複合語の構造と、外面的な貪欲だけでなく内面的な愛着を問題にする意味を保った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、教会指導者の資格を列挙する文として簡潔で品位ある調子にした。前後の文脈に続く述語として「人でなければなりません」を補い、各性質の対照を「むしろ」で保持した。
