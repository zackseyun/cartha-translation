  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: ja
  text: 執事は、一人の妻を持つ者であり、子どもたちと自分の家庭をよく治める者でなければなりません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάκονοι
  choice: 執事
  rationale: 教会の秩序と資格を扱う文脈では、一般的な「仕える人」ではなく、認められた務めを担う者の呼称として用いられているため。
- source_word: ἔστωσαν
  choice: 者でなければなりません
  rationale: 現在命令形が資格要件として持つ規範的な力を、明瞭で自然な現代日本語で表すため。
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: 一人の妻の夫
  rationale: ギリシア語の簡潔な属格表現に沿い、結婚上の誠実、単婚、再婚の可否などを本文で一つに決めず、その曖昧さを保つため。
- source_word: τέκνων
  choice: 子どもたち
  rationale: 文脈上、執事自身の子どもを指す。日本語では後続の「自分の家庭」と並べることで所属関係が自然に理解できる。
- source_word: καλῶς
  choice: よく
  rationale: 分詞を修飾する基本的な副詞の意味を簡潔かつ自然に表すため。
- source_word: προϊστάμενοι
  choice: 治める
  rationale: 家庭に責任を持って立ち、監督し導く意味を保つため。「管理する」より人格的な家庭統率を表しつつ、過度に権威主義的な語感を避ける。
- source_word: τῶν ἰδίων οἴκων
  choice: 自分の家庭
  rationale: οἶκοςは建物としての家ではなく、家族や生活共同体を含む家庭を指すため。日本語では単数形の「自分の家庭」が各人の家庭を自然に表す。
theological_decisions:
- issue: 教会の務めの資格における μιᾶς γυναικὸς ἄνδρες の解釈
  choice: 本文では「一人の妻の夫」と形式に沿って訳し、意味を一つに限定しない。
  alternative: 「一人の女に誠実な男」「妻に忠実な夫」「一度だけ結婚した男」
  rationale: この句は簡潔で慣用的でもあり、結婚上の誠実を強調するのか、複婚を禁じるのか、再婚まで除外するのかについて議論がある。特定の教派的結論を本文に持ち込まず、原文の緊張と解釈の幅を残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、資格規定にふさわしい落ち着いた格調を保った。「執事」は教会職の伝統的かつ広く理解される名称として採用し、文末の「なければなりません」で命令の規範性を示した。
