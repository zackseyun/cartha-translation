  text: Ταῦτά σοι γράφω, ἐλπίζων ἐλθεῖν πρὸς σὲ ⸂ἐν τάχει⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/014.yaml
  text: I am writing these things to you[a], hoping to come to you soon,
translation:
  language: ja
  text: 私は、近いうちにあなたのところへ行けることを希望しながら、あなたにこれらのことを書いています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτά
  choice: これらのこと
  rationale: 中性複数の指示代名詞であり、前後の一連の教えや指示をまとめて指すため、複数性を保った。
- source_word: σοι
  choice: あなたに（日本語では「書いています」の相手として文脈上表現）
  rationale: γράφω とともに手紙の受け手を示す与格。日本語では「あなたに書く」より、目的内容を伴う「これらのことを書いています」のほうが自然で、受け手は後続の「あなたのところへ」にも明示される。
- source_word: γράφω
  choice: 書いています
  rationale: 書簡執筆時の現在を表す現在直説法を、自然な現代日本語の進行表現で訳した。
- source_word: ἐλπίζων
  choice: 願いながら
  rationale: 主動詞に伴う現在分詞である。「願う」は将来の訪問への希望を示し、確実な予定とまでは断定しない。
- source_word: ἐλθεῖν πρὸς σὲ
  choice: あなたのところへ行きたい
  rationale: 話者から受け手への移動を表す。日本語では、執筆者の現在地を基準に「行く」が自然であり、ἐλπίζων と不定詞の構造を「行きたいと願う」とした。
- source_word: ἐν τάχει
  choice: 近いうちに
  rationale: 時間的な近さを表す慣用句として、この書簡の文脈では自然で明瞭。「すぐに」とするより切迫度を過度に限定しない。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、書簡らしい落ち着いた品位を保った。「願いながら」は原文の分詞構造を反映するが、日本語として理解しやすい語順に整えた。
