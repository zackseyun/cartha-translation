source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: ja
  text: また、教会外の人々[a]からも良い評判を得ていなければなりません。非難を受け[b]、悪魔のわな[c]に陥らないためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「外の人々からも良い証言を得て」。ここで「外の人々」とは、キリスト者共同体の外にいる人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 「非難を受け」は、「恥辱に陥る」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「悪魔」は、「中傷する者」とも訳せる。ここでは人格的な悪の存在を指すと理解した。
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ δὲ καὶ
  choice: また、…も…なければなりません
  rationale: 前の資格要件にもう一つを加える接続・付加の力と、δεῖの必要・義務を、自然な現代日本語で表した。
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: 良い評判を得ている
  rationale: 直訳的な「良い証言を持つ」よりも、この文脈での外部者による好意的評価を明瞭かつ自然に伝える。「得ている」は継続的に認められている状態を表す。
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: 教会外の人々から
  rationale: 「外の人々」がキリスト者共同体の外にいる人々を指すことを、過度に曖昧にせず現代の読者に明示した。原文に近い表現は脚注に残した。
- source_word: ἵνα μὴ
  choice: そうでないと、…ことになります
  rationale: 否定目的・結果節を、資格要件を欠く場合の危険として自然に示す。必然性を過度に断定しないようにした。
- source_word: εἰς ὀνειδισμὸν ἐμπέσῃ
  choice: 非難を受け
  rationale: ὀνειδισμόςの非難・恥辱という社会的意味を保ちつつ、日本語として不自然な「非難に陥る」を避けた。
- source_word: παγίδα
  choice: わな
  rationale: 捕らえる仕掛けという比喩を、聖書的響きを保ちながら平明に表す。
- source_word: τοῦ διαβόλου
  choice: 悪魔の
  rationale: 定冠詞を伴うδιάβολοςを、新約聖書で一般的な人格的な悪の存在として訳した。属格がわなの所有者・仕掛け手・関連を表す曖昧さは保持している。
theological_decisions:
- issue: τοῦ διαβόλουの指示対象
  choice: 人格的な悪の存在である「悪魔」
  alternative: 「中傷する者」または「中傷者」
  rationale: 牧会書簡および新約聖書の用例では、定冠詞を伴うδιάβολοςは通常、悪魔を指す。ただし語そのものには「中傷する者」の意味もあるため、その可能性を脚注で示した。
- issue: ὀνειδισμόςと悪魔のわなの関係
  choice: 「非難を受け」と「悪魔のわなに陥る」を連続する二つの危険として表現
  alternative: 「悪魔による非難とわな」という一体的な理解
  rationale: καίによる並列を素直に保ち、外部からの社会的非難と霊的な危険を区別しつつ、両者の関連を断定的に説明しないようにした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。教会指導者の資格としての義務を丁寧体で表し、逐語訳では不自然になる箇所は自然な日本語に整えた。脚注で原文に近い表現と語義上の代案を保存した。
