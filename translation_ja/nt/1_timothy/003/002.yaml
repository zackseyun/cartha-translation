id: 1TI.3.2
reference: 1 Timothy 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δεῖ οὖν τὸν ἐπίσκοπον ἀνεπίλημπτον εἶναι, μιᾶς γυναικὸς ἄνδρα, νηφάλιον, σώφρονα, κόσμιον, φιλόξενον, διδακτικόν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: ja
  text: したがって、監督は非難されるところがなく、一人の妻を持つ夫[a]であり、節度をわきまえ、慎み深く、品位があり、よく人をもてなし、教える能力がなければなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「一人の女の男」。この表現は、婚姻状態だけでなく、一人の女性に対する忠実さを強調するものとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ
  choice: なければなりません
  rationale: 単なる勧めではなく、監督に求められる必要条件を表す。
- source_word: οὖν
  choice: したがって
  rationale: 直前の議論から導かれる論理的なつながりを明示する。
- source_word: ἐπίσκοπον
  choice: 監督
  rationale: 後代の教会制度上の称号を持ち込まず、見守り治める役割を表す日本語として訳す。
- source_word: ἀνεπίλημπτον
  choice: 非難されるところがなく
  rationale: 罪のない完全さではなく、正当な非難を受けるような点がないという社会的・倫理的意味を自然に表す。
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: 一人の妻の夫
  rationale: ギリシア語の男性を明示する表現を保ち、婚姻状態、複婚、再婚、夫婦間の忠実さをめぐる解釈を本文で一つに限定しない。
- source_word: νηφάλιον
  choice: 節度をわきまえ
  rationale: 酒に酔っていないことだけでなく、精神と行動が落ち着き抑制されている比喩的意味を表す。
- source_word: σώφρονα
  choice: 慎み深く
  rationale: 健全な判断と自己抑制を伴う人格的特質を、νηφάλιονとの違いもある程度保ちながら表す。
- source_word: κόσμιον
  choice: 品位があり
  rationale: 秩序正しく、振る舞いが適切で尊敬に値するという意味を自然な現代日本語で表す。
- source_word: φιλόξενον
  choice: よく人をもてなし
  rationale: 客や旅人を進んで迎える特質を、一般の読者に分かりやすく表す。
- source_word: διδακτικόν
  choice: 教える能力が
  rationale: 教える意思だけでなく、そのための適性・能力があることを表す。
theological_decisions:
- issue: 教会指導者の要件における μιᾶς γυναικὸς ἄνδρα の解釈
  choice: 本文では「一人の妻の夫」と形式を保って訳す
  alternative: 「一人の女性に忠実な男性」「妻に忠実な者」
  rationale: この句は、夫婦間の忠実さの強調、複婚の禁止、再婚に関する制限など複数の解釈がある。本文では原文に近い表現を用い、脚注で慣用的な理解の可能性を示すことで、神学的・教会的な論点を一つに決めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「監督」は役割を示す語として用い、「司教」のような後代の制度的含意を避けた。徳目の列挙は自然な日本語の並列に整えつつ、原文の各項目を省略せず保持した。
