reference: 1 Timothy 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: ja
  text: しかし、自分の家庭[a]を治めるすべを知らない人が、どうして神の教会を世話するだろうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家」または「家の者」とも訳せる。ここでは建物ではなく、家族や同居する者を含む生活共同体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δέ
  choice: しかし、…なら／…人が
  rationale: δέの穏やかな対比を「しかし」で示し、εἰの条件は日本語として自然な修辞疑問の構文全体で表した。
- source_word: τις
  choice: 人
  rationale: 不定代名詞として一般的に表現した。日本語では代名詞の性を明示する必要がなく、文脈上の監督者候補を過度に限定しない。
- source_word: τοῦ ἰδίου οἴκου
  choice: 自分の家庭
  rationale: οἶκοςは建物だけでなく、家族や家に属する者を含む生活共同体を指し得る。この文脈では「家庭」が自然である。
- source_word: προστῆναι
  choice: 治める
  rationale: 家庭に責任をもって立ち、導き、取り仕切る意味を簡潔に表す。後半の「世話する」とは訳し分け、二つの動詞の違いを保った。
- source_word: οὐκ οἶδεν
  choice: すべを知らない
  rationale: 不定詞を伴うοἶδαの「どのように行うかを知らない」という意味を自然な日本語で表した。
- source_word: πῶς
  choice: どうして…だろうか
  rationale: 家庭を治められない者が教会を世話することへの疑問を示す修辞疑問として訳した。
- source_word: ἐκκλησίας θεοῦ
  choice: 神の教会
  rationale: 属格関係を自然な所有表現で示した。「教会」はこの文脈におけるἐκκλησίαの定着した訳語である。
- source_word: ἐπιμελήσεται
  choice: 世話できるだろうか
  rationale: 注意深く心を配り、必要を満たすἐπιμελέομαιの牧会的な含意を「世話する」で表した。修辞疑問として自然にするため可能表現を用いたが、単なる運営や支配には限定しなかった。
theological_decisions:
- issue: 家庭における指導と教会への配慮の関係
  choice: 前半を「家庭を治める」、後半を「教会を世話する」と訳し分ける。
  alternative: 両方を「導く」または「管理する」と訳す。
  rationale: 原文はπροΐστημιとἐπιμελέομαιという異なる動詞を用いる。家庭と教会の類比を保ちつつ、教会への務めを単なる統制に還元しないため、その違いを訳文にも残した。
- issue: 不定の主語の性表現
  choice: τιςを「人」とし、性別を示す代名詞を補わない。
  alternative: 文脈上の監督者候補を明示して「男性」または「彼」とする。
  rationale: τις自体は不定代名詞であり、日本語では性別を補わず自然に訳せる。周辺文脈の解釈をこの一節へ必要以上に持ち込まない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「すべを知らない」と「どうして…だろうか」によって、原文の条件文と修辞疑問を自然な日本語で再現した。
