  text: καὶ οὗτοι δὲ δοκιμαζέσθωσαν πρῶτον, εἶτα διακονείτωσαν ἀνέγκλητοι ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/010.yaml
  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: ja
  text: この人たちも、まず吟味を受けさせなさい。それから、非難されるところのない者として、奉仕させなさい[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕えさせなさい」とも訳せます。ここで用いられた動詞は「仕える、奉仕する」という意味です。文脈は奉仕者の資格について述べています。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「非難されるところのない者でありつつ」。罪が全くないという意味ではなく、正当な非難や告発を受ける点がないことを表します。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: この人たちも
  rationale: 直前に述べられた奉仕者たちを指す男性複数の指示代名詞であり、καὶ…δὲ の付加的な関係も「も」で示した。
- source_word: δοκιμαζέσθωσαν πρῶτον
  choice: まず適任かどうかを吟味されなければなりません
  rationale: δοκιμάζω は試験・吟味によって適格性を確かめることを表す。受動命令の力を、現代日本語として自然な義務表現で示した。
- source_word: εἶτα
  choice: そのうえで
  rationale: 吟味が奉仕に先立つという手順を明確に表す。
- source_word: διακονείτωσαν
  choice: 奉仕の務めに就かせなさい
  rationale: διακονέω の基本義「仕える、奉仕する」を保ちつつ、直前の文脈では公に認められた奉仕者としての務めを指すことを自然に示した。ギリシア語にこの節で役職名そのものはないため、「執事」と断定しなかった。
- source_word: ἀνέγκλητοι ὄντες
  choice: 非難されるところがないなら
  rationale: 分詞を奉仕開始の条件として自然に表現した。ἀνέγκλητος は罪が皆無という意味ではなく、正当な告発を受ける点がないことを指す。
theological_decisions:
- issue: διακονείτωσαν を一般的な奉仕とするか、役職に即した奉仕とするか
  choice: 奉仕の務めに就かせなさい
  alternative: 奉仕させなさい／執事として仕えさせなさい
  rationale: 語そのものの「奉仕する」という意味と、奉仕者の資格を論じる直近の文脈の双方を保った。役職名を本文に補いすぎず、単なる一般的奉仕とも読まれにくい表現とした。
- issue: ἀνέγκλητοι が完全な無罪性を意味するか
  choice: 非難されるところがない
  alternative: 責められる点がない／非の打ちどころがない
  rationale: 有効な告発の根拠がないという資格上の意味を示し、罪のない完全性を要求するとの誤解を避けた。
- issue: ἀνέγκλητοι ὄντες と命令の論理関係
  choice: 非難されるところがないなら
  alternative: 非難されるところのない者として
  rationale: 分詞が奉仕を許される際の資格・条件を表す自然な読みを採ったが、時間的・付帯的な含みもあり得るため脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「吟味」は教会の選考過程に限定せず、人物の適格性を確かめる原語の幅を保持する。「執事」は教派によって制度的含意が異なるため本文では避け、文脈上の職務性を「奉仕の務め」で示した。
