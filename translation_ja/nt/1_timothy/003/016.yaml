id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: ja
  text: 'そして、広く認められているとおり、敬虔の奥義は偉大です。


    この方は肉において現され[a]、


    霊において正しいと認められ[b]、


    天使たちに見られ、


    諸国民の間で宣べ伝えられ[c]、


    世で信じられ、


    栄光のうちに上げられました。[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「この方は」の代わりに「神は肉において現された」とあります。ここでは、批判校訂されたギリシア語本文の「この方は」に従っています。
    reason: textual_variant
  - marker: b
    text: 「御霊によって正しいと認められ」、または「御霊において正しいと認められ」とも訳せます。簡潔なギリシア語表現は、聖霊の働き、または霊的な領域・あり方のどちらを指すとも理解できます。
    reason: alternative_reading
  - marker: c
    text: 「異邦人の間で宣べ伝えられ」とも訳せます。
    reason: lexical_alternative
  - marker: d
    text: 「栄光へと上げられました」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: だれもが認めるとおり
  rationale: 公然と認められていること、共通の告白であることを表す副詞。単に論理的な確実性だけを示す「疑いなく」より、語の持つ共同の承認という含みを明確な現代日本語で表した。
- source_word: μέγα ἐστὶν
  choice: 偉大です
  rationale: 前置された述語の強調を保ちつつ、導入文全体が自然な日本語になるようにした。
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: 敬虔の奥義
  rationale: μυστήριονは、かつて隠され今や示された神の真理を指すパウロ書簡の用法に即して「奥義」とした。εὐσέβειαは一般的な宗教制度ではなく、神を敬う信仰と生き方を指すため「敬虔」とした。
- source_word: Ὃς
  choice: この方
  rationale: 批判本文の男性関係代名詞を人格的に受け、直前の「奥義」をそのまま文法的先行詞とする不自然さを避けながら、キリストを指す告白文として訳した。「神」という異読は本文に取り込まず脚注に示した。
- source_word: ἐφανερώθη ἐν σαρκί
  choice: 肉において現され
  rationale: 受動形と、身体をもつ人間的存在を示す簡潔な前置詞句を保持した。「肉体をもって」よりも原文の詩的な対句を残す表現である。
- source_word: ἐδικαιώθη
  choice: 正しいと認められ
  rationale: ここでは「義とされた」という救済論的意味より、正しい方であることが示され、立証されたという意味が適切。「正当性を立証された」より平明な表現を選んだ。
- source_word: ἐν πνεύματι
  choice: 霊において
  rationale: 聖霊の働きを指すのか、霊的な領域・あり方を指すのかを本文で断定せず、原文の簡潔さと曖昧さを保った。
- source_word: ὤφθη ἀγγέλοις
  choice: 御使いたちに見られ
  rationale: 受動形と与格を素直に反映した。文脈上、ἀγγέλοιςは人間の使者より天的な御使いを指すと判断した。
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: 諸国民の間で宣べ伝えられ
  rationale: κηρύσσωの公的な宣言という意味を「宣べ伝えられ」で表した。ἔθνηは「異邦人」と限定せず、より広い「諸国民」とした。
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: 世で信じられ
  rationale: キリストが人々の信仰の対象となったことを、受動形を保った簡潔な日本語で表した。
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: 栄光のうちに上げられました
  rationale: 受動形とἐνの基本的な領域表現を保った。「栄光へ」とする方向的理解は脚注に示した。
theological_decisions:
- issue: 告白文冒頭の異読（Ὃς／θεός／ὅ）
  choice: 批判本文Ὃςを人格的に「この方」と訳す
  alternative: 「神は肉において現され」、または「それは肉において現され」
  rationale: SBLGNTの本文はὋς（「その方は」）であり、キリストを指す人格的表現として訳した。歴史的に重要なθεόςの異読を本文に採用してキリスト論を補強することはせず、脚注で明示した。
- issue: ἐν πνεύματιの指示対象と機能
  choice: 「霊において」と中立的に訳す
  alternative: 「御霊によって」または「御霊において」
  rationale: 無冠詞のπνεύματιは、聖霊の作用とも、肉と対照される霊的な領域・存在様式とも理解できる。いずれかに教理的に限定せず、原文の緊張を本文に残した。
- issue: ἐδικαιώθηのキリスト論的意味
  choice: 「正しいと認められ」と訳す
  alternative: 「義とされた」または「正しいことを示された」
  rationale: キリストが罪人から義人へ変えられたという意味ではなく、その正しさが公に示され、立証されたことを表す文脈と判断した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、初期キリスト教の告白または賛歌を思わせる六行の並行構造と荘重さを保持した。「奥義」「敬虔」「御使い」は聖書語として定着しており、文脈上の精度と品位を優先して採用した。各行は受動形をそろえ、原文のリズムをできる限り再現した。
