id: 1TI.3.15
reference: 1 Timothy 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: ja
  text: しかし、もし私が遅れる場合には、あなたが神の家族、すなわち生ける神の会衆[a]の中でどのように振る舞うべきかを知ることができるように、私はこれを書いています。この会衆は、真理の柱であり、支え[b]でもあります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「生ける神の教会」。また「集会」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「支え」は「土台」または「防壁」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: 私が遅れる
  rationale: 文脈上、パウロの到着が遅れることを指す。「遅れる」は、自動詞的なギリシア語の意味を簡潔かつ自然に表す。
- source_word: ἵνα εἰδῇς
  choice: あなたが知るためです
  rationale: 目的を表すἵνα節と二人称単数を明確に保つ。
- source_word: δεῖ … ἀναστρέφεσθαι
  choice: どのように振る舞うべきか
  rationale: 共同体における生活態度についての規範的な必要を、現代日本語で自然に表す。ギリシア語では不定詞の行為主体が明示されないため、日本語でもここに主語を補わない。
- source_word: ἐν οἴκῳ θεοῦ
  choice: 神の家族の中で
  rationale: οἶκοςは家屋だけでなく家族・家の者たちを指し、直後のἐκκλησίαによる説明も人的共同体を示す。「神の家」だと建物と受け取られやすいため、「神の家族」とした。
- source_word: ἥτις
  choice: この家族は
  rationale: 先行する「神の家族」を受けて、その実体を説明する関係節の働きを、独立した文で明瞭に示す。
- source_word: ἐκκλησία
  choice: 会衆
  rationale: 集められた神の民という語の基本的意味を表し、建物や後代の制度だけを連想させない。「教会」は脚注に示す。
- source_word: θεοῦ ζῶντος
  choice: 生ける神の
  rationale: 「生ける神」という定着した荘重な表現で、原文の属格句と神学的対照を保つ。
- source_word: στῦλος
  choice: 柱
  rationale: 建築的比喩をそのまま明瞭に保つ。
- source_word: ἑδραίωμα
  choice: 支え
  rationale: 確固たるもの、また堅固に支えるものという意味を自然に表す。「土台」も可能だが、語義と比喩には幅があるため脚注に残す。
- source_word: τῆς ἀληθείας
  choice: 真理の
  rationale: 定冠詞を伴う特定の「真理」を、日本語で自然に表す。
theological_decisions:
- issue: ἐκκλησίαを教会論的文脈でどう訳すか
  choice: 会衆
  alternative: 教会、集会
  rationale: 原語が第一に指す、召し集められた人々という共同体的意味を前面に出す。伝統的な「教会」を否定せず、脚注で示す。
- issue: 「真理の柱またἑδραίωμα」の理解
  choice: 会衆が「真理の柱また支え」であるという原文の述語関係をそのまま保つ
  alternative: 真理の柱また土台／防壁
  rationale: 原文の高い共同体理解を弱めない一方、会衆が真理の起源だという説明を訳文に持ち込まない。ἑδραίωμαの比喩的な幅は脚注で示す。
- issue: δεῖ … ἀναστρέφεσθαιの行為主体
  choice: 「どのように振る舞うべきか」として主語を明示しない
  alternative: あなたがどのように振る舞うべきか／人がどのように振る舞うべきか
  rationale: 文脈上はテモテへの指示とも共同体一般の規範とも理解できるが、ギリシア語不定詞には明示的主語がないため、その曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「生ける神」「真理の柱」という聖書的で荘重な表現を保持した。長いギリシア語の一文は日本語の可読性のため二文に分け、説明関係を「この家族は」「すなわち」で明示した。
