  to: しかし、もし私が遅れる場合には、あなたが神の家族、すなわち生ける神の会衆[a]の中でどのように振る舞うべきかを知ることができるように、私はこれを書いています。この会衆は、真理の柱であり、支え[b]でもあります。
  rationale: 目的節に文脈上含意される主節「私はこれを書いています」を補い、日本語として完結した文にした。この補足は、前節から続くγράφωの内容を明示するものであり、意味を追加しない。あわせて、神の家族と会衆の説明関係、および会衆が真理の柱と支えであるという原文の述語関係を保った。
