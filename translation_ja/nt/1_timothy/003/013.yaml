  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ γὰρ καλῶς διακονήσαντες βαθμὸν ἑαυτοῖς καλὸν περιποιοῦνται καὶ πολλὴν παρρησίαν ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: ja
  text: よく仕えた人たちは、自分たちのために良い立場を得、また、メシア[c]であるイエスにある信仰[b]において、大きな大胆さ[a]を得るのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大きな確信」とも訳せます。ギリシア語は、大胆さ、確信、率直さを表し得ます。
    reason: lexical_alternative
  - marker: b
    text: 「メシアであるイエスにある忠実さ」とも訳せます。ギリシア語πίστιςは「信仰」「信頼」「忠実さ」を意味し得ます。
    reason: alternative_reading
  - marker: c
    text: ギリシア語は「キリスト」。ここでは称号としての意味を明らかにするため、「メシア」と訳しました。
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: 奉仕した
  rationale: 動詞そのものは「仕える、奉仕する」を意味する。文脈上は執事として仕える人々を指すが、動詞に役職名を読み込まず、その意味を自然な日本語で表した。
- source_word: καλῶς
  choice: よく
  rationale: 奉仕のあり方が立派で適切であることを簡潔かつ自然に表す。
- source_word: βαθμὸν ... καλὸν
  choice: 立派な立場
  rationale: βαθμόςの「段、地位、立場」という比喩的意味を保ちつつ、教会内の昇進や特定の階級制度を断定しない表現とした。
- source_word: περιποιοῦνται
  choice: 自分自身のために…得る
  rationale: 中動態の、自らのために獲得するという含みを明示した。
- source_word: παρρησίαν
  choice: 大きな確信
  rationale: この語が表し得る大胆さ、自信、率直さのうち、信仰との結びつきに自然な「確信」を本文に採用し、力強さを「大きな」で表した。別の訳語は脚注に残した。
- source_word: πίστει
  choice: 信仰
  rationale: この文脈で最も自然な中心的意味を採用した。「忠実」という可能性は解釈上の曖昧さとして脚注に保存した。
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにある
  rationale: 冠詞を伴う前置詞句がπίστειを修飾する構造を保ち、「信仰」がメシアであるイエスにあることを示した。
- source_word: Χριστῷ
  choice: メシア
  rationale: Χριστόςが称号として機能していることを明確に伝えるため、「メシア」と訳した。日本語として明瞭になるよう「メシアであるイエス」とした。
theological_decisions:
- issue: ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦにおけるπίστιςの意味
  choice: 信仰
  alternative: 忠実、真実
  rationale: この句はメシアであるイエスに基づく、またはその方を中心とする信仰を指すと読むのが自然である。ただしπίστιςには「忠実、真実」の意味もあり得るため、本文で一方を教義的に固定せず脚注に代案を示した。
- issue: βαθμὸν καλὸνが教会内の昇進を意味するか
  choice: 立派な立場
  alternative: 良い段階、良い地位
  rationale: 比喩的な身分・評価を表すと理解しつつ、上位職への昇進や一定の教会階級を意味するとまでは本文で断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、結論を示すγάρは文末の「からです」で表した。荘重さを保ちつつ、役職制度や昇進を必要以上に読み込まない表現とした。
