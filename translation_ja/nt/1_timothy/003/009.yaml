translation:
  language: ja
  text: 清い良心[a]をもって、信仰の奥義を保っている人でなければなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「純粋な良心」。
    reason: καθαρᾷ（「清い」「純粋な」）の語彙的な代替訳。
lexical_decisions:
- source_word: ἔχοντας
  choice: しっかり保っている
  rationale: 現在分詞として、前節から続く奉仕者の資格を表す。単に所有するだけでなく、継続して堅く保持する意味合いを自然な日本語で示した。
- source_word: τὸ μυστήριον
  choice: 奥義
  rationale: パウロ書簡で、かつて隠されていたが神によって示された真理を指す語。単なる不可解な謎や秘密という印象を避けつつ、原語の神学的含意を保つ。
- source_word: τῆς πίστεως
  choice: 信仰の
  rationale: 定冠詞を伴うため、ここでは主観的な信じる行為よりも、信じられているキリスト教信仰の内容を指す可能性が高い。ただし日本語の「信仰の」は原文同様、一定の幅を残す。
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: きよい良心をもって
  rationale: ἐνを日本語として自然な「をもって」で表し、καθαρόςの道徳的な清さを「きよい」によって保持した。「やましくない良心」より原語に近く、意味も明瞭である。
theological_decisions:
- issue: τῆς πίστεωςにおける「信仰」の意味
  choice: キリスト教信仰の内容を主に指す「信仰の」
  alternative: 個人の信じる行為としての信仰、または真実さ
  rationale: 教会の奉仕者の資格という文脈では、保持すべき使徒的信仰の内容が最も自然である。一方、「信仰の奥義」という属格表現をそのまま保ち、原文に残る意味の幅を過度に限定しない。
- issue: μυστήριονの性質
  choice: 奥義
  alternative: 秘密、神秘
  rationale: 永久に理解不能な事柄ではなく、神が明らかにされた救いの真理というパウロ的用法に適する。「啓示された奥義」と説明的に訳して本文にない限定を加えることは避けた。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で品位ある文体。「奥義」はやや伝統的だが、パウロ書簡のμυστήριονを単なる「謎」や秘匿情報と誤解させずに表す語として採用した。前後の資格条項との接続を明らかにするため、「人でなければなりません」を補った。
