  text: ἔστιν δὲ πορισμὸς μέγας ἡ εὐσέβεια μετὰ αὐταρκείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/006.yaml
  text: But godliness with contentment is great gain[a][b].
translation:
  language: ja
  text: しかし、満ち足りる心を伴う敬虔は、大きな利得です[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大きな利益」または「利益を得る大きな手段」。ギリシア語では前の節にも用いられている、利益や利得を表す同じ語が使われている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「自足」。ここでは、自分だけを頼りにするという意味よりも、与えられたもので満ち足りることを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の、敬虔を利益の手段と考える者たちへの警告を受け、その考えと対照をなす穏やかな逆接として訳した。
- source_word: πορισμὸς
  choice: 利得
  rationale: 「利益」「もうけ」または「利益を得る手段」を意味し得る語。直前の節との語の響きを保ちつつ、物質的な富だけに限定しない表現とした。
- source_word: μέγας
  choice: 大きな
  rationale: 価値の大きさを強調する基本的な意味を自然な日本語で表した。
- source_word: εὐσέβεια
  choice: 敬虔
  rationale: 神を畏れ敬う姿勢と、それに基づく生き方を表す語として、牧会書簡での用法に即した。単なる外面的な宗教性には限定しない。
- source_word: μετὰ
  choice: 伴う
  rationale: 属格を伴う μετά の随伴・結合の意味を示し、敬虔と満ち足りる心との関係を明確にした。
- source_word: αὐταρκείας
  choice: 満ち足りる心
  rationale: 一般ギリシア語では「自足」を意味し得るが、続く7–8節は必要な物があれば満足することを語るため、自律的な自己依存ではなく、与えられたもので満ち足りる態度として訳した。
theological_decisions:
- issue: キリスト者の文脈における αὐτάρκεια の意味
  choice: 満ち足りる心
  alternative: 自足、自給自足
  rationale: 直後の文脈は、衣食があればそれで満足することを説明している。神から独立した自己充足という含みを避けつつ、原語の「足りている状態」を伝えた。
- issue: 敬虔と利得の関係
  choice: 満ち足りる心を伴う敬虔そのものが大きな利得である
  alternative: 敬虔は、満ち足りる心を伴えば、大きな利益を得る手段となる
  rationale: ギリシア語の πορισμός は「利得」と「利得の手段」の双方を含み得る。本文では、直前の利得目当ての敬虔との対照を明確にしながら、別の可能性を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての簡潔さと品位を保った。「敬虔」「利得」は文脈上の語のつながりと神学的緊張を保つために採用し、難しくなり得る意味は脚注で補った。
