id: 1TI.6.9
reference: 1 Timothy 6:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: ja
  text: しかし、金持ちになりたいと願う人たちは、誘惑とわな、また数々の愚かで有害な欲望に陥ります。それらの欲望は、人々を破滅と滅びへ沈めます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι πλουτεῖν
  choice: しかし、金持ちになりたいと願う人たちは
  rationale: βούλομαι は一時的な気分よりも意志や持続的な願望を表し、πλουτεῖν は富裕になること／富裕であることを意味する。文脈上、富を得ようとする願望を自然な現代日本語で表した。
- source_word: ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα
  choice: 誘惑とわな……に陥ります
  rationale: ἐμπίπτω の否定的状況へ入り込む比喩を「陥る」で保ち、πειρασμός はこの警告の文脈では「誘惑」、παγίς は捕らえる仕掛けの比喩として「わな」とした。
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: 数々の愚かで有害な欲望
  rationale: ἐπιθυμία の広い意味を「欲望」で表し、ἀνόητος と βλαβερός をそれぞれ明瞭な「愚か」「有害」と訳した。πολλάς は「数々の」として多数性を保った。
- source_word: αἵτινες
  choice: それらの欲望は
  rationale: 関係代名詞の先行詞が直前の「欲望」であることを、日本語で曖昧にならないよう明示した。
- source_word: βυθίζουσι τοὺς ἀνθρώπους
  choice: 人々を……沈めます
  rationale: βυθίζω の水中に沈めるような強い比喩と他動性を「沈める」で保持した。ἄνθρωποι は男性に限定されない総称なので「人々」とした。
- source_word: εἰς ὄλεθρον καὶ ἀπώλειαν
  choice: 破滅と滅びへ
  rationale: 近接する二語を同一語にせず、ὄλεθρος を「破滅」、ἀπώλεια を「滅び」として、重ねられた深刻な帰結を保った。
theological_decisions:
- issue: ὄλεθρον καὶ ἀπώλειαν が特に永遠の刑罰を意味すると訳文で限定するか
  choice: 「破滅と滅び」とし、その範囲を限定しない
  alternative: 「破滅と永遠の滅び」など、終末的な刑罰を明示する
  rationale: 二語は極めて深刻な帰結を示すが、この節の語そのものは、その範囲を永遠の刑罰だけに限定するよう翻訳者に要求していない。したがって、神学的な重みを保ちつつ限定を加えなかった。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「わな」は一般読者に理解しやすい表記とし、原文の沈没の比喩は「沈めます」で生かした。原文に実質的な本文異同や、訳文に注記を要するほどの曖昧さはないため脚注は付していない。
