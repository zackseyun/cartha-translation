id: 1TI.6.12
reference: 1 Timothy 6:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: ja
  text: 信仰のための立派な戦いを戦いなさい。[a] 永遠のいのちをしっかりとつかみなさい。あなたはそのいのちへと召され、また、多くの証人の前で立派な告白をしたのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰による立派な戦いを戦いなさい」とも訳せる。ギリシア語は、信仰によって特徴づけられる戦いとも、キリスト教信仰のための戦いとも理解できる。
    reason: alternative_reading
  - marker: b
    text: ギリシア語は、告白の内容が永遠のいのちであったとは明言していないが、永遠のいのちへの召しと告白を密接に結びつけている。
    reason: ambiguity
lexical_decisions:
- source_word: ἀγωνίζου
  choice: 戦いなさい
  rationale: 現在命令形が表す継続的で積極的な取り組みを示し、同語根のἀγῶναとの反復も日本語で保つ。
- source_word: τὸν καλὸν ἀγῶνα
  choice: 立派な戦い
  rationale: καλόςの「良い、尊い、立派な」という評価的意味を自然な現代日本語で表し、後半の「立派な告白」との並行も保つ。
- source_word: τῆς πίστεως
  choice: 信仰のための
  rationale: 牧会書簡の文脈で、キリスト教信仰を守るための戦いという客観的・限定的な意味を本文に採った。ただし、信仰によって特徴づけられる戦いとも読めるため脚注に残す。
- source_word: ἐπιλαβοῦ
  choice: しっかりとつかみなさい
  rationale: 決然と手に取って保持する比喩を、明瞭で自然な日本語にした。
- source_word: τῆς αἰωνίου ζωῆς
  choice: 永遠のいのち
  rationale: 福音において約束された終末的ないのちを指す定着した表現を用いる。
- source_word: εἰς ἣν ἐκλήθης
  choice: あなたはそのいのちへと召され
  rationale: εἰςが示す目標・行き先を「へと」で表し、受動形によって神からの召しを過度に説明せずに保つ。
- source_word: ὡμολόγησας τὴν καλὴν ὁμολογίαν
  choice: 立派な告白をした
  rationale: 同語根の動詞と名詞によるギリシア語の構文を、現代日本語で自然な「告白をした」とし、καλόςは前半と同じく「立派な」とした。
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: 多くの証人の前で
  rationale: 公の場でなされたことを簡潔に表す。μάρτυρεςはここでは殉教者ではなく証人を意味する。
theological_decisions:
- issue: τῆς πίστεωςが表す信仰の意味
  choice: キリスト教信仰をめぐる戦い（「信仰のための」）
  alternative: 本人の信仰によって特徴づけられる戦い（「信仰による」）
  rationale: 定冠詞と牧会書簡の用法は客観的・限定的な「信仰」を支持するが、属格だけでは関係を一義的に決められないため、別の読みを脚注に示した。
- issue: 召しと立派な告白との関係
  choice: 二つを「また」で結び、告白の内容を明示しない
  alternative: 永遠のいのちについて告白した、または召された際に告白したと明示する
  rationale: ギリシア語は永遠のいのちへの召しに続けて告白を述べるが、告白の内容や時点を文法上明示してはいない。本文では結びつきを保ちつつ、その関係を限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「いのち」は聖書的な響きを保ちつつ一般読者にも理解しやすい表記とした。同じκαλόςを二箇所とも「立派な」と訳し、原文の修辞的な並行を再現した。
