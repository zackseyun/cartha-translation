reference: 1 Timothy 6:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: ja
  text: 金銭を愛することは、あらゆる種類の悪の根の一つだからです。[a] 金銭を愛することを求めて、ある人たちは信仰から迷い出て[b]、多くの苦痛で自分自身を刺し貫きました。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「金銭を愛することは、すべての悪の根だからです」。ギリシア語は「根の一つ」「あらゆる種類の悪」と理解するのが自然で、すべての悪に唯一の原因があると断定する必要はありません。
    reason: alternative_reading
  - marker: b
    text: 「信仰」は、ここでは個人の信じる心というより、キリスト教信仰を指すと考えられます。別訳「その信仰からそれて」。
    reason: lexical_alternative
  - marker: c
    text: 「多くの悲しみで自分自身を刺し貫きました」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: 根の一つ
  rationale: 無冠詞の述語名詞であり、金銭愛をあらゆる悪の唯一の根と断定せず、多様な悪を生む一つの根源として表す。
- source_word: πάντων τῶν κακῶν
  choice: あらゆる種類の悪
  rationale: 複数形の広がりを自然な日本語で示し、『すべての悪が例外なく』という絶対的な響きを避ける。
- source_word: φιλαργυρία
  choice: 金銭を愛すること
  rationale: 文字どおりの『銀・金銭への愛』という語の像を保ち、より広義の『貪欲』に拡張しない。
- source_word: ὀρεγόμενοι
  choice: 切望したために
  rationale: 強く求める継続的な欲求と、それが迷い出ることにつながった関係を表す。
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: 信仰から迷い出て
  rationale: 離れてさまようという動きを保ちつつ、自然な現代日本語にする。定冠詞を日本語で過剰に明示せず、文脈上キリスト教信仰を指し得る余地を保つ。
- source_word: περιέπειραν
  choice: 自分自身を刺し貫きました
  rationale: 突き刺す、貫くという鮮烈な比喩を弱めずに伝える。
- source_word: ὀδύναις πολλαῖς
  choice: 多くの苦痛で
  rationale: 身体的痛みだけでなく、悲嘆や心痛を含み得る広い苦しみを表す。
theological_decisions:
- issue: 金銭愛と悪との関係の範囲
  choice: 金銭愛は、あらゆる種類の悪を生む根の一つである。
  alternative: 金銭愛は、すべての悪の唯一の根である。
  rationale: ῥίζα が無冠詞で、πάντων τῶν κακῶν が複数形であることを踏まえ、あらゆる悪の原因を一つに限定する断定を避ける。
- issue: τῆς πίστεως の意味
  choice: 本文では『信仰』とし、文脈上はキリスト教信仰を指すと理解できる。
  alternative: 個人的な信頼・信じる心だけを指す。
  rationale: 牧会書簡の用法と定冠詞は客観的なキリスト教信仰を支持するが、日本語では『信仰』が自然であり、意味を不必要に固定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、パウロ書簡にふさわしい荘重さと、原文の『根』『迷い出る』『刺し貫く』という比喩を保持した。
