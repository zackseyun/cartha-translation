lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: 善を行い
  rationale: 不定詞が命令の内容を続けている。動詞としての力を保ちつつ、簡潔で自然な現代日本語とした。
- source_word: πλουτεῖν
  choice: 富み
  rationale: 周辺文脈の物質的な富との意図的な対照を保つため、比喩的な富の表現をそのまま生かした。
- source_word: ἐν ἔργοις καλοῖς
  choice: 良い働きに
  rationale: 何において富むのかを示す句として訳した。「良い行い」も可能だが、直前の「善を行い」との不自然な重複を避け、「働き」を用いた。
- source_word: εὐμεταδότους
  choice: 惜しみなく与え
  rationale: 自分の持つものを進んで与える性質を、自然で具体的な日本語で表した。
- source_word: κοινωνικούς
  choice: 喜んで分かち合う
  rationale: 他者と進んで共有する姿勢を表す。「共同的な」では現代日本語で意味がずれやすいため、行為への積極的な心構えを明示した。
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: 惜しみなく与え、喜んで分かち合うように
  rationale: 第一の語が与える寛大さを、第二の語が共有する姿勢を表すという近接しつつ異なる意味を、自然な並列で保持した。
