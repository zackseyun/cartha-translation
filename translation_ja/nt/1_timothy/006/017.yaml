id: 1TI.6.17
reference: 1 Timothy 6:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: ja
  text: 今の時代[a]に富んでいる人々に、思い上がらず、不確かな富[b]に望みを置かないで、私たちが楽しむために、すべてのものを豊かに与えてくださる神に望みを置くよう命じなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今の世」とも訳せる。ギリシア語は「時代」を意味し、そこから現在の世界秩序を指すこともある。ここでは「時代」とすることで、時間的な対比を保った。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「富の不確かさ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι
  choice: 今の時代に富んでいる人々
  rationale: 冠詞付き形容詞を「富んでいる人々」とし、αἰώνの時間的・終末論的な含みを保つため「時代」と訳した。
- source_word: παράγγελλε
  choice: 命じなさい
  rationale: 現在命令法の権威ある指示を明確に表す。
- source_word: μὴ ὑψηλοφρονεῖν
  choice: 思い上がらず
  rationale: 高慢な自己評価を表す動詞を、自然で明瞭な現代日本語にした。
- source_word: μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι
  choice: 不確かな富に望みを置かないで
  rationale: 完了不定詞が示す、望みを据えた状態を「望みを置く」で表し、富そのものの不確実性も簡潔に伝えた。
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: 神に望みを置く
  rationale: 前句との対比と、望みの対象を示すἐπίの反復を明示した。
- source_word: τῷ παρέχοντι ἡμῖν πάντα πλουσίως
  choice: 私たちに、すべてのものを豊かに与えてくださる
  rationale: 神の惜しみない供給を表しつつ、πάνταの包括的な範囲を狭めない。文脈上の神への敬意を「くださる」で自然に表した。
- source_word: εἰς ἀπόλαυσιν
  choice: 私たちが楽しむために
  rationale: 目的・結果を示す句として訳し、何を楽しむのかが「すべてのもの」にかかることを明瞭にした。
theological_decisions:
- issue: 倫理的・終末論的文脈におけるαἰώνの意味
  choice: 時代
  alternative: 世、この世
  rationale: 物質世界そのものより現在の時代・秩序を指すため、パウロ的な時間上の対比を保持した。
- issue: 神が与えるπάνταの範囲
  choice: すべてのもの
  alternative: 必要なすべてのもの
  rationale: 本文の広い表現を限定せずに保つ一方、繁栄を保証するとの解釈も訳文に持ち込まない。
- issue: 富と神のどちらに望みを置くかという対比
  choice: 両方に「望みを置く」を明示
  alternative: 後半を「神にこそ」に省略的に続ける
  rationale: 原文のἐπίの反復と対照構造を日本語で明確にし、富の享受そのものと富への信頼とを混同しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の強さと牧会書簡にふさわしい品位を保った。「富裕な者」のような硬いラベルを避け、「富んでいる人々」とした。脚注記号は、それぞれが説明する語句の直後に配置した。
