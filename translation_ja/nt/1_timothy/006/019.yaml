source:
  edition: SBLGNT
  text: ἀποθησαυρίζοντας ἑαυτοῖς θεμέλιον καλὸν εἰς τὸ μέλλον, ἵνα ἐπιλάβωνται τῆς ⸀ὄντως ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: ja
  text: こうして、自分たちのために、将来のために良い土台を蓄え、真のいのちをしっかりとつかむようにしなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: 蓄え
  rationale: 宝を蓄積するイメージを保ちつつ、現代日本語として自然な語を選んだ。現在分詞は前節から続く勧告として表した。
- source_word: ἑαυτοῖς
  choice: 自分たちのために
  rationale: 行為者自身の利益を示す再帰代名詞の与格を明示した。
- source_word: θεμέλιον καλὸν
  choice: 良い土台
  rationale: θεμέλιονの建築的比喩と、καλόνの「良い、価値ある」という意味をそのまま保った。「土台を蓄える」という意図的な比喩の重なりも解消しなかった。
- source_word: εἰς τὸ μέλλον
  choice: 将来に備えて
  rationale: 将来への方向性と備えの意味を自然な日本語で表し、「来たるべき時代」と限定する解釈は本文に持ち込まなかった。
- source_word: ἐπιλάβωνται
  choice: しっかりとつかむ
  rationale: 「手に取る、つかむ」という動的な比喩を保持した。「得る」として比喩を弱めることを避けた。
- source_word: τῆς ὄντως ζωῆς
  choice: 真のいのち
  rationale: ὄντωςの「本当に、真に」という強調と、ζωήという明示的な名詞を簡潔で格調ある日本語にした。
theological_decisions:
- issue: εἰς τὸ μέλλονを終末論的に限定して訳すか
  choice: 将来に備えて
  alternative: 来たるべき時代のために
  rationale: 文脈には終末論的な響きがあるが、ギリシア語自体は「時代」を明示しないため、より広い将来指向の表現を本文に採用した。
- issue: τῆς ὄντως ζωῆςの質的対比をどう表すか
  choice: 真のいのち
  alternative: 本当にいのちであるもの
  rationale: 富に基づく生との対比を保ちながら、ζωήを抽象的な「もの」に置き換えず、原文の名詞を明示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「良い土台を蓄える」という原文の複合的な比喩を保持した。前節から続く分詞構文であることを「こうして」と命令的な結びで示した。「いのち」は聖書的文脈での語感と可読性を考慮して平仮名表記とした。
