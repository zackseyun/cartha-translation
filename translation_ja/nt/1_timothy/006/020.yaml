  source_fidelity: 主要な意味はよく伝わっていますが、「ああ」は現代標準日本語では呼びかけとして不自然であり、βέβηλοςを「俗悪」とするのは「不敬虔な／神聖を汚す」の宗教的含意より道徳的な下品さを強く示します。また、ἀντιθέσειςは単なる個別の「反論」より、対抗する主張・反対論という広がりを持つため、本文ではその点を明確にするのが安全です。
  naturalness: 「テモテよ」は厳粛な直接呼格として自然です。「不敬虔なむだ話」は明瞭な現代語であり、「偽って『知識』と呼ばれるものに属する反対論」は属格の係り方を保ちながら自然に読めます。
  terminology: παραθήκηは内容を限定しない「あなたに託されたもの」で適切です。ψευδώνυμοςは、単に誤解から「誤って」呼ばれるというより、その名称が偽りであることをいうため、「偽って『知識』と呼ばれるもの」としました。ἀντιθέσειςには「反対論」を用い、脚注で「対立する主張」「矛盾」を示します。
  issues:
