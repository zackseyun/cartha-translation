    rationale: 「ああ、テモテよ」は現代日本語では嘆声のようにも響き、厳粛な直接の呼びかけとして不自然です。「テモテよ」で呼格の機能と適度な格調を保てます。
  - severity: medium
    issue: βεβήλουςを「俗悪」とすること
    rationale: 「俗悪」は下品さ・低俗さを前景化し、βέβηλοςの不敬虔・神聖でないという宗教的評価を十分に表しません。「不敬虔な」がより近い訳です。
