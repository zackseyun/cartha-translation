id: 1TI.6.20
reference: 1 Timothy 6:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: ja
  text: テモテよ。あなたに託されたものを守りなさい。不敬虔なむだ話や、偽って「知識」と呼ばれるものに属する反対論[a]を避けなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「対立する主張」または「矛盾」。
    reason: lexical_alternative
  - marker: b
    text: 「偽って『知識』と呼ばれるもの」は、「いわゆる知識」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: ああ、テモテよ
  rationale: 呼格の小辞Ὦが持つ、厳粛で感情のこもった直接の呼びかけを、現代日本語として格調を保ちながら表した。
- source_word: τὴν παραθήκην
  choice: あなたに託されたもの
  rationale: παραθήκηは保管を委ねられたものを指す。日本語では「委託物」より自然であり、何が託されたのかを本文以上に限定しない。
- source_word: φύλαξον
  choice: 守りなさい
  rationale: 託されたものを注意深く保全するよう求める命令の力を明確に伝える。
- source_word: ἐκτρεπόμενος
  choice: 避けなさい
  rationale: 脇へそれる、背を向けるという語義を、この文脈で自然な命令表現として示す。分詞は主命令に伴う行為だが、日本語では独立した命令文にすることで明瞭にした。
- source_word: τὰς βεβήλους κενοφωνίας
  choice: 俗悪なむなしい話
  rationale: βέβηλοςの聖ならぬ、神聖さを欠く含意と、κενοφωνίαの中身のない発言という意味を、理解しやすい現代語で表す。
- source_word: ἀντιθέσεις
  choice: 反論
  rationale: 対立する主張、反対論という広い語義を保つ。「矛盾」と断定すると内的な論理的不整合に狭まりうるため、本文では「反論」とし、別訳を脚注に示した。
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: 誤って知識と呼ばれているものの
  rationale: ψευδώνυμοςが、その「知識」という名称は正しくないと評価していることを明示しつつ、対象の具体的内容は特定しない。
theological_decisions:
- issue: παραθήκηの内容
  choice: 「あなたに託されたもの」と一般的に訳し、内容を特定しない。
  alternative: 福音、使徒的教え、またはテモテの務めとして明示する。
  rationale: 文脈上は使徒的な教えが念頭にある可能性が高いが、この節の名詞自体は内容を明示していないため、解釈による限定を避けた。
- issue: 「知識」と反論の関係
  choice: 属格を「誤って知識と呼ばれているものの反論」と訳し、反論がその偽称された知識に属するものとして示す。
  alternative: 「俗悪なむなしい話と反論、すなわち誤って知識と呼ばれているもの」と同格的に理解する。
  rationale: ギリシア語の属格の自然な連結を保持しつつ、同格的・説明的な含みを完全には排除しない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、Ὦの厳粛な呼びかけは「ああ、テモテよ」で保持した。「委託物」のような法律的・硬質な語を避け、内容を限定しない自然な表現を採用した。脚注記号[a]と[b]はすべて本文中に配置している。
