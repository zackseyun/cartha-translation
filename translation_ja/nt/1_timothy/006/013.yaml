id: 1TI.6.13
reference: 1 Timothy 6:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παραγγέλλω σοι ἐνώπιον τοῦ θεοῦ τοῦ ⸀ζῳογονοῦντος τὰ πάντα καὶ Χριστοῦ Ἰησοῦ τοῦ μαρτυρήσαντος ἐπὶ Ποντίου Πιλάτου τὴν καλὴν ὁμολογίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/013.yaml
  text: I charge you before God[a], who gives life to all things, and Messiah Jesus, who testified to the good confession before Pontius Pilate[c][b],
translation:
  language: ja
  text: すべてのものに命を与える神[a]と、ポンテオ・ピラトの前で[c]立派な告白をされた、メシアであるイエス[b]との御前で、私はあなたに厳かに命じます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべてのものを生かしておられる」、または「すべてのものを生かす」とも訳せる。ギリシア語は、命を保つことにも命を与えることにも重点を置き得る。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト・イエス」とも訳せる。「メシア」と「キリスト」は、どちらも「油を注がれた者」という称号を表す。
    reason: alternative_rendering
  - marker: c
    text: 「ポンテオ・ピラトの時代に」、または「ポンテオ・ピラトの統治下で」とも訳せる。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: παραγγέλλω
  choice: 厳かに命じます
  rationale: 単なる助言ではなく、神とイエスの御前で与える重い命令であることを、自然な現代日本語で表した。
- source_word: ἐνώπιον
  choice: 御前で
  rationale: 神とメシアであるイエスの臨在を意識した厳粛な表現として、「前で」よりも文脈に適した「御前で」を用いた。
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: すべてのものに命を与える
  rationale: 「生かしておく」と「命を生じさせる」の双方を含み得る語だが、ここでは意味を狭めすぎない包括的な表現とし、別の可能性を脚注に残した。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を明示しつつ、日本語で人名のように誤解されにくい形にした。伝統的な「キリスト・イエス」は脚注に示した。
- source_word: μαρτυρήσαντος
  choice: 証しされた
  rationale: 裁判の場で公に証言したという含みを保ちながら、ὁμολογίαとの結びつきを自然な日本語で表した。
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: ポンテオ・ピラトの前で
  rationale: 裁判・証言の文脈では、ピラトの面前でなされた証しと理解するのが自然である。ただし「ピラトの時代に」も文法的に可能なため脚注に示した。
- source_word: τὴν καλὴν ὁμολογίαν
  choice: 立派な告白
  rationale: καλήの価値評価とὁμολογίαの公的な告白という意味を保った。「信仰告白」と限定して原文以上に説明することは避けた。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: この厳粛な告白の文脈では、Χριστόςの「油注がれた者」という称号性が生きているため、「メシアである」と明示した。
- issue: ζῳογονοῦντοςの意味範囲
  choice: すべてのものに命を与える
  alternative: すべてのものを生かしておられる／すべてのものを生かす
  rationale: この分詞は、命を与えることにも命を保つことにも重点を置き得る。本文では広い生命付与の意味を採り、解釈上重要な幅を脚注に保存した。
- issue: ἐπὶ Ποντίου Πιλάτουの関係
  choice: ポンテオ・ピラトの前で
  alternative: ポンテオ・ピラトの時代に／その統治下で
  rationale: 証言を表す分詞との組み合わせと受難物語の場面から面前の意味を本文に採ったが、ἐπί＋属格が時代や統治を示す可能性も脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神とイエスの御前で発せられる命令の厳粛さを保った。「御前」「証し」は聖書文体として理解しやすく、過度に古風ではない。原文では命令の具体的内容が次節へ続くが、この節単独でも日本語として成立するよう文末を整えた。
