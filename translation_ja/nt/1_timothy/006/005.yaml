source:
  edition: SBLGNT
  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: ja
  text: 思いが腐敗し、真理を奪われ、敬虔を利益を得る手段と考える人々の間には、絶え間ない摩擦があります[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「絶え間ない言い争い」または「いつまでも続く争い」とも訳せる。ギリシア語は、互いにこすれ合うような継続的な摩擦を描く語である。
    reason: lexical_alternative
  - marker: b
    text: 「敬虔は利益である」または「利益の源である」とも訳せる。敬虔を利益のために利用する見方を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: 絶え間ない摩擦
  rationale: 継続的にこすれ合うことから転じた、絶えざる衝突や争いを表す語である。比喩を保ちつつ、現代日本語として理解しやすい表現とした。
- source_word: διεφθαρμένων … τὸν νοῦν
  choice: 心が腐敗し
  rationale: 完了受動分詞が示す、腐敗した結果としての持続的な状態を表す。νοῦςは思考と道徳的判断の双方に関わるため、ここでは自然で包括的な「心」とした。
- source_word: ἀπεστερημένων τῆς ἀληθείας
  choice: 真理を奪われ
  rationale: 完了受動分詞の受動性と、真理を失った状態を簡潔に保つ。「真理」は定冠詞を伴う特定の真理を指す。
- source_word: νομιζόντων
  choice: 考える
  rationale: 誤った見方を抱いていることは文脈と補語から明らかであり、日本語では過度に説明を加えず自然な「考える」とした。
- source_word: πορισμὸν
  choice: 利益を得る手段
  rationale: 利益そのもの、または利益を得る方途を意味し得る。敬虔を利得のために利用するという道具的な見方が明確になる表現を選んだ。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 神への畏敬に基づく生き方を表す牧会書簡の重要語である。「宗教」よりも原語の肯定的な意味を保ち、その悪用は文脈に示させた。
theological_decisions:
- issue: εὐσέβειαが真の神への献身を指すのか、外面的な宗教行為を指すのか
  choice: 「敬虔」とし、語そのものの肯定的な意味を保つ
  alternative: 「宗教」または「信心」
  rationale: 問題は敬虔それ自体ではなく、それを利得の手段とみなす人々の態度にある。原語を外面的宗教へ狭めない。
- issue: διεφθαρμένωνの道徳的な強さ
  choice: 「心が腐敗し」
  alternative: 「心が堕落しきり」または「思いが損なわれ」
  rationale: 厳しい道徳的評価を保ちながら、「しきり」など原文にない程度の強調や、特定の教理的含意を加えない。
- issue: 真理を奪った主体
  choice: 受動表現のまま「真理を奪われ」とする
  alternative: 神に真理を奪われた／自ら真理を捨てた
  rationale: ギリシア語は主体を明示しないため、誰が、または何が奪ったのかを訳文で決めない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「敬虔」は日常語よりやや改まった語だが、牧会書簡における反復的な神学用語として適切である。原文が前後の構文に連なる名詞句である点を踏まえつつ、単独でも読めるよう「あります」で文を整えた。
