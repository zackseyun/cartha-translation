reference: 1 Timothy 6:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: ja
  text: というのも、私たちは何一つこの世に持って来なかったし、何一つ持って出ることもできません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後半を「なぜなら、何一つ持って出ることもできないからです」と、前半の理由として理解することもできます。ギリシア語の接続詞ὅτιは、理由を示すとも、対応する後半の文を導くとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: 何一つ……なかった
  rationale: 動詞の目的語となる絶対的な否定を、自然な現代日本語で明確に表す。
- source_word: γὰρ
  choice: ……のですから
  rationale: 前節の内容を根拠づける説明の接続を、日本語の文末表現によって自然に示す。
- source_word: εἰσηνέγκαμεν
  choice: 持って来なかった
  rationale: εἰσφέρωの「中へ運び入れる」という像を保ちつつ、この世への誕生を指す文脈に合う自然な表現とした。
- source_word: εἰς τὸν κόσμον
  choice: この世に
  rationale: ここでのκόσμοςは、人が生まれて入る世界を指す。「この世」は日本語として自然で、後半の「持って出る」との対照も明確にする。
- source_word: ὅτι
  choice: （並列的な継続）
  rationale: 写本本文のὅτιには因果的理解の可能性もあるが、本文では二つの対応する命題を自然につなぐ。接続語を明示せず「……ことも」で均衡を表し、別解は脚注に示す。
- source_word: οὐδὲ
  choice: 何一つ……こともできません
  rationale: 前半の否定と対応する追加的否定を「も」によって表す。
- source_word: ἐξενεγκεῖν
  choice: 持って出る
  rationale: ἐκφέρωの「外へ運び出す」という方向性を保ち、死に際してこの世から何も携え出せないという像を自然に表す。
- source_word: τι
  choice: 何一つ
  rationale: 否定の作用域にある不定代名詞を、前半と対応する明確な日本語にした。
- source_word: δυνάμεθα
  choice: できません
  rationale: 能力・可能性の否定を、簡潔で自然な現代日本語で表す。
theological_decisions:
- issue: ὅτιが導く後半節の関係
  choice: この世に何も持って来ず、何も持って出られないという、対応する二つの真理として表現する。
  alternative: 「何一つ持って出ることもできないからです」と因果関係として訳す。
  rationale: ὅτιは因果を表し得る一方、この箇所は前後の均衡した格言的表現としても理解できる。本文では自然な対句を保ち、因果的な読みを脚注に残して、原文の曖昧さを解消しすぎない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半の「持って来る」と後半の「持って出る」を対応させ、原文の方向性と格言的な均衡を保った。
