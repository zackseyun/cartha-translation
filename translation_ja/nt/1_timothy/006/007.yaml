  to: というのも、私たちは何一つこの世に持って来なかったし、何一つ持って出ることもできません。[a]
  rationale: 「というのも」はγάρの説明・根拠づけの働きを前節との関係で自然に表します。「し」により、ὅτιを対応する後半節として読む場合の格言的な均衡を保ちます。因果的に読む可能性は脚注に残し、原文の構文上の余地を本文で一方的に決めません。
