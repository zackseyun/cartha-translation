source:
  edition: SBLGNT
  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: ja
  text: ただひとり不死を有し、近づくことのできない光の中に住み、人間のだれも見たことがなく、また見ることもできない方。[a]その方に、誉れと永遠の支配がありますように。[b]アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「人間の中のだれも見たことがなく、また見ることもできない」。
    reason: lexical_alternative
  - marker: b
    text: この描写と頌栄は、文脈上、神を指すと考えるのが最も自然である。ただし、より広い文のつながりから、主イエス・メシアをより直接に指すと理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: μόνος
  choice: ただひとり
  rationale: 後に続く「不死を有する」という性質が、この方に固有であることを明確に表す。
- source_word: ἔχων ἀθανασίαν
  choice: 不死を有し
  rationale: 「不死を持つ」というギリシア語の構造と、固有かつ本来的に不死を有するという含みを、簡潔で荘重な日本語で保つ。
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: 近づくことのできない光の中に住み
  rationale: ἀπρόσιτονを単に「届かない」ではなく、接近不能を示す「近づくことのできない」とし、οἰκῶνの居住の比喩も保持する。
- source_word: οὐδεὶς ἀνθρώπων
  choice: 人間のうちだれも
  rationale: 属格の部分的な意味を反映しつつ、ἄνθρωποςがここで人類一般を指すことを自然な現代日本語で表す。
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: また見ることもできない
  rationale: δύναταιが示す能力・可能性の否定を省略せず、「見ない」ではなく「見ることができない」と訳す。
- source_word: τιμή
  choice: 誉れ
  rationale: 頌栄の文脈にふさわしい伝統的で理解しやすい語を用いる。
- source_word: κράτος αἰώνιον
  choice: 永遠の支配
  rationale: κράτοςを単なる抽象的な力ではなく、現れ出る統治力・支配として捉え、頌栄に自然な表現とする。
- source_word: ἀμήν
  choice: アーメン
  rationale: 礼拝的・頌栄的な用法に従い、定着した音写を用いる。
theological_decisions:
- issue: 関係節によって描写され、頌栄を受ける方がだれか
  choice: 直前の文脈で「祝福に満ちた唯一の主権者」と呼ばれる神を指すものとして訳すが、本文では固有名を補わない。
  alternative: より広い文脈における近い先行詞とのつながりから、主イエス・メシアをより直接に指すと理解する。
  rationale: 「人間のうちだれも見たことがなく、また見ることもできない」という不可視性の表現は神を指す理解に最も自然に合う。一方、ギリシア語本文はここで固有名を繰り返さないため、その統語上・文脈上の緊張を訳文で断定的に解消せず、別解を脚注に残す。
- issue: ἀνθρώπωνの範囲
  choice: 「人間のうちだれも」とし、全人類を包括する意味を表す。
  alternative: 「人々のうちだれも」または「どの人間も」。
  rationale: 文法上は男性複数形だが、ここでは男女を問わず人類全体を代表的に指す。日本語の「人間」は原文の指示範囲を正確かつ自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、頌栄にふさわしい荘重さを保った。「有し」はやや格調のある表現だが、「不死を持ち」より自然で、「不死であり」より原文のἔχωνの構造をよく保持する。節が前文から続く描写であることを反映し、冒頭に新たな主語名を補わなかった。
