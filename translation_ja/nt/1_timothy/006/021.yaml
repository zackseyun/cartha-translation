  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἥν τινες ἐπαγγελλόμενοι περὶ τὴν πίστιν ἠστόχησαν. Ἡ χάρις ⸂μεθ’ ὑμῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/021.yaml
  text: By professing it[a], some have missed the mark concerning the faith[c][b]. Grace be with you.
translation:
  language: ja
  text: 'ある人々は、それを公言して、信仰に関して的を外しました。[a][b]


    恵みがあなたがたとともにありますように。[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「それを公言する者たちの中には、信仰に関して的を外した人々がいます」。原語の動詞には、「的を外す」のほか、「道をそれる」「誤る」といった意味もあります。
    reason: lexical_alternative
  - marker: b
    text: ここでの「信仰」は、キリスト者が共有する信仰の内容を指す可能性が高いですが、個人の信仰を指すとも理解できます。
    reason: alternative_reading
  - marker: c
    text: 「あなたがた」は原文で複数形です。底本では「あなたがたとともに」に当たる語句が角括弧に置かれており、写本上の異読があります。
    reason: textual_variant
lexical_decisions:
- source_word: ἥν
  choice: それを
  rationale: 直前の文脈にある「偽って知識と呼ばれるもの」を受ける女性単数の関係代名詞。日本語では指示代名詞で明示するのが自然である。
- source_word: ἐπαγγελλόμενοι
  choice: 持っていると公言した
  rationale: この中動態は、約束することではなく、何かを備えていると称し、公言する意味。主張だけでなく、その「知識」を自らのものとして掲げる含みを表した。
- source_word: περὶ τὴν πίστιν
  choice: 信仰に関して
  rationale: περί＋対格が示す関連・領域を保ち、逸脱が信仰に関わるものであることを明示した。
- source_word: ἠστόχησαν
  choice: 道を踏み外してしまいました
  rationale: 目標を外す、逸脱するという語義を、現代日本語で自然な比喩として表現した。完了した逸脱の重大さも「しまいました」で伝えた。
- source_word: Ἡ χάρις
  choice: 恵み
  rationale: 書簡末尾の祝祷として簡潔で定着した訳語を用いた。
- source_word: μεθ’ ὑμῶν
  choice: あなたがたとともにありますように
  rationale: 省略された願望の動詞を日本語で補い、ὑμῶνの複数を「あなたがた」として保持した。
theological_decisions:
- issue: 「信仰」の意味
  choice: キリスト者が共有する信仰を主に指す表現として訳す
  alternative: 個人が神に寄せる信頼
  rationale: 直前の誤った「知識」と対比され、教えからの逸脱が問題となっているため、共有された信仰の内容を指す可能性が高い。ただし日本語本文では単に「信仰」とし、主観的な信頼という可能性を排除しなかった。
- issue: 結びの祝祷の対象
  choice: 複数の「あなたがた」を保持する
  alternative: 手紙の直接の受取人テモテ一人を指す「あなた」
  rationale: 底本のὑμῶνは複数形であり、祝祷がテモテだけでなく周囲の信徒たちにも及ぶ可能性をそのまま示す。
translation_notes:
  register: 明瞭な現代標準語による、簡潔で品位ある書簡末尾の文体。「公言した」は主張の含みを保ち、「道を踏み外す」は原語の逸脱の比喩を自然な日本語で伝える。祝祷は礼拝でも通用する定型的な表現とした。
