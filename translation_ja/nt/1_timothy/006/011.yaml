  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: ja
  text: しかし、神の人よ、あなたはこれらのことから逃げなさい。むしろ、義[a]、敬虔、信仰[b]、愛、忍耐、柔和[c]を追い求めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正義」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「忠実」または「信頼」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: このギリシア語は稀な語で、「寛容」または「忍耐を伴う柔和」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: しかし、…あなたは
  rationale: 強調された二人称代名詞とδέが、直前に述べられた人々との強い対照を示すため。日本語では「しかし」を文頭に置き、「あなたは」を明示して対照を保った。
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: 神の人よ
  rationale: テモテへの男性単数の呼びかけであり、聖書で定着した称号的表現を保った。
- source_word: ταῦτα φεῦγε
  choice: これらのことから逃れなさい
  rationale: ταῦταは直前の誤りや悪徳を指す。φεῦγεの強い命令を、弱い「避けなさい」ではなく「逃れなさい」で表した。
- source_word: δίωκε δὲ
  choice: そして、…追い求めなさい
  rationale: δίωκεは悪から逃れるだけでなく徳を積極的に追求するよう命じる語。「しかし」を重ねると現代日本語では不自然なため、対照は前文の「逃れなさい」と後文の「追い求めなさい」の対句で示し、接続は自然な「そして」とした。
- source_word: δικαιοσύνην
  choice: 義
  rationale: 神と人との関係における正しさを広く含む定着した訳語。文脈上「正義」も可能なので脚注に残した。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 神を畏れ敬う姿勢と、それに基づく生き方を表す牧会書簡の用法に適する。
- source_word: πίστιν
  choice: 信仰
  rationale: 基本的な訳語を採用したが、徳目の列挙では「忠実」も成立しうるため脚注に示した。
- source_word: ἀγάπην
  choice: 愛
  rationale: 意味を明瞭かつ自然に伝える標準的な訳語。
- source_word: ὑπομονήν
  choice: 忍耐
  rationale: 圧力や苦難のもとで持ちこたえる持続的な堅忍を、一般読者に分かりやすく表す。
- source_word: πραϋπαθίαν
  choice: 柔和
  rationale: この稀な語が示す穏やかさと忍耐強い自制を表す。意味の幅は脚注で補った。
theological_decisions:
- issue: ὦ ἄνθρωπε θεοῦの性別を伴う呼称
  choice: 神の人よ
  alternative: 神に属する者よ
  rationale: 原文はテモテ個人に対する男性単数の直接呼格であり、称号的な聖書表現を中性化せず保持した。
- issue: δικαιοσύνηνの意味範囲
  choice: 義
  alternative: 正義
  rationale: 徳目の文脈では包括的な道徳的・関係的正しさを表す「義」が適するが、公正・正義の含意も排除しない。
- issue: πίστινの意味範囲
  choice: 信仰
  alternative: 忠実、信頼
  rationale: 神への信仰を主文に置きつつ、徳目一覧では信頼に足る忠実さを意味する可能性もあるため、曖昧さを脚注に保存した。
- issue: πραϋπαθίανの稀少性と複合的含意
  choice: 柔和
  alternative: 寛容、忍耐を伴う柔和
  rationale: 単一の日本語では穏やかさと辛抱強い自制の双方を完全には表せないため、読みやすい主訳と説明的な脚注を併用した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令の力強さと「逃れる／追い求める」の対照を保ち、徳目には日本語聖書で理解されやすい簡潔な語を用いた。
