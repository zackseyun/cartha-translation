id: 1TI.6.4
reference: 1 Timothy 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τετύφωται, μηδὲν ἐπιστάμενος, ἀλλὰ νοσῶν περὶ ζητήσεις καὶ λογομαχίας, ἐξ ὧν γίνεται φθόνος, ἔρις, βλασφημίαι, ὑπόνοιαι πονηραί,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/004.yaml
  text: he is puffed up[a], understanding nothing, but sick with a craving for controversies and word-battles, from which come envy, strife, slanders, and evil suspicions[c][b],
translation:
  language: ja
  text: その人は思い上がっていて[a]、何一つ理解せず、論争やことばを巡る争い[b]に病的に執着しています。そこから、ねたみ、争い、中傷[c]、悪意ある疑いが生じます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「高慢になっています」。ギリシア語には、高慢で膨れ上がった状態を思わせる表現が使われています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ことば争い」または「ことばについての言い争い」。
    reason: lexical_alternative
  - marker: c
    text: ここでは、人に対する侮辱や悪口を指すと考えて「中傷」と訳しました。同じギリシア語は、文脈によっては神に対する「冒瀆」を意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: τετύφωται
  choice: 思い上がっていて
  rationale: 完了形が示す、高慢になった結果としての持続的な状態を、明瞭で自然な現代日本語で表した。膨れ上がるという原語の比喩は脚注で補った。
- source_word: μηδὲν ἐπιστάμενος
  choice: 何一つ理解せず
  rationale: 単に知識がないというより、物事を正しく把握していないことを表す分詞句として訳した。
- source_word: νοσῶν
  choice: 病的に執着しています
  rationale: 「病んでいる」という比喩を「病的に」に残しつつ、περί以下への不健全な熱中を自然な日本語で明示した。
- source_word: περὶ ζητήσεις
  choice: 論争や
  rationale: ζητήσειςがここで指す、議論を呼ぶ問題や論争への不健全な関心を簡潔に表した。
- source_word: λογομαχίας
  choice: ことばを巡る争い
  rationale: λόγοςとμάχηから成る語の意味を明瞭に伝え、単なる口論とも、ことばだけを武器にした争いとも限定しなかった。
- source_word: ἐξ ὧν γίνεται
  choice: そこから……が生じます
  rationale: 直前の論争とことばを巡る争いを、後続する悪徳の原因として示す関係を自然に表した。
- source_word: φθόνος
  choice: ねたみ
  rationale: 他者の持つものを不快に思うφθόνοςの意味に合う、一般読者に明瞭な語を選んだ。
- source_word: ἔρις
  choice: 争い
  rationale: 不和や対立を表す一般的で自然な日本語を用いた。
- source_word: βλασφημίαι
  choice: 中傷
  rationale: 人間関係上の悪徳を列挙する文脈では、神への冒瀆よりも、人を傷つけ名誉を損なう発言を指すと判断した。別の語義は脚注に示した。
- source_word: ὑπόνοιαι πονηραί
  choice: 悪意ある疑い
  rationale: πονηραίを単に抽象的な「悪い」とせず、他者を悪く推測する疑念の性質が伝わるようにした。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準語とした。悪徳表は簡潔な名詞でそろえ、νοσῶνの病気の比喩は「病的に」に残した。「その人は」を補って、前節から続く人物描写であることを日本語として明確にした。
