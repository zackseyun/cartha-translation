  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: ja
  text: 私たちの主、メシアであるイエス[a]が現れる時まで、その戒めを汚れなく、非難されるところなく守りなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの主イエス・キリスト」。ギリシア語の「クリストス」は、「メシア」という称号としても、固有名に近い伝統的な「キリスト」としても表せる。
    reason: alternative_reading
  - marker: b
    text: 「汚れなく、非難されるところなく」は、「戒め」そのものを説明しているとも、テモテが戒めを守るあり方を示しているとも取れる。原文はこの関係を簡潔な形で表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: 守りなさい
  rationale: 直前の命令に依存する不定詞を、日本語では文脈上の命令として自然に表した。「守る」は、戒めに従い続ける意味を保ち、「遵守する」ほど事務的にならず、「守護する」ほど防御の意味に限定しない。
- source_word: τὴν ἐντολήν
  choice: その戒め
  rationale: 定冠詞付き単数形の重みを「その戒め」で表した。直前に与えられた命令・委託を指すと考えられるが、「戒め」とすることで道徳的・宗教的な響きを保った。
- source_word: ἄσπιλον
  choice: 汚れなく
  rationale: しみや汚点がないことを示す語。「汚れなく」は明快で、戒め自体にも、それを守るあり方にも関係し得る原文の圧縮された表現を完全には限定しない。
- source_word: ἀνεπίλημπτον
  choice: 非難されるところなく
  rationale: 正当な非難を受ける余地がないという意味を、現代日本語で自然かつ格調を保って表した。
- source_word: μέχρι τῆς ἐπιφανείας
  choice: 現れる時まで
  rationale: 将来の目に見える出現に至るまでの継続を表す。「再臨」は神学的説明を加えるため用いず、原語に明示された「現れ」に留めた。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主
  rationale: κύριοςをキリスト論的称号として「主」と訳し、ἡμῶνを自然な語順で「私たちの」とした。
- source_word: Ἰησοῦ Χριστοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を明示しつつ、日本語で不自然な「イエス・メシア」を避けた。伝統的な「イエス・キリスト」も脚注に示した。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστοῦの訳
  choice: メシアであるイエス
  alternative: イエス・キリスト
  rationale: 終末的な「現れ」の文脈では、Χριστόςの称号性が十分に感じられるため、意味を透明にする「メシア」を本文に採用した。ただし、固有名のように定着した伝統的表記も可能なので脚注に残した。
- issue: ἄσπιλονとἀνεπίλημπτονが何を修飾するか
  choice: 「その戒めを汚れなく、非難されるところなく守る」という圧縮した表現
  alternative: 「汚れも非難されるところもない戒めを守る」または「自らが汚れなく、非難されるところなく戒めを守る」
  rationale: 形態上は両形容詞が「戒め」と一致する一方、意味上はテモテの守り方や状態にも関係すると解され得る。本文では副詞的にも読める配置を採り、脚注で曖昧さを明示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、命令の厳粛さを保った。「遵守」「顕現」など一般読者に硬すぎる語は避けた。主文を先にせず、終点となる「主が現れる時まで」を冒頭に置くことで、日本語として自然な時間関係を示した。
