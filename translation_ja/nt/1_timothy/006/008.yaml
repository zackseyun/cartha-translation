  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: ja
  text: しかし、食べ物と身を覆うもの[a]があれば、私たちはそれで満足します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衣服」とも訳せる。ギリシア語はより広く、人を覆うものを意味し、住まいを含む可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχοντες
  choice: あれば
  rationale: 状況を示す分詞を、一般的な条件として自然な現代日本語で表した。「持っているので」とすると理由の意味を強めすぎる。
- source_word: δὲ
  choice: しかし
  rationale: 直前の内容との穏やかな対比を明確に示す。
- source_word: διατροφὰς
  choice: 食べ物
  rationale: 生存を支える糧、とりわけ食物を指すため、平明で自然な語を選んだ。
- source_word: σκεπάσματα
  choice: 身を覆うもの
  rationale: 衣服に限定せず、人を覆うものというギリシア語の幅を保ち、住まいを含む可能性も残した。
- source_word: τούτοις
  choice: それで
  rationale: 直前に挙げられた基本的な必要物を指す指示語の働きを、簡潔な日本語で表した。
- source_word: ἀρκεσθησόμεθα
  choice: 私たちはそれで満足します
  rationale: 未来形の陳述を保ち、勧告の「満足しよう」には変えなかった。ここでの動詞は、必要を満たすものとして足りる、満足するという意味を表す。
theological_decisions:
- issue: σκεπάσματα の意味の範囲
  choice: 衣服に限らない「身を覆うもの」
  alternative: 「衣服」のみ、または「住まい」のみ
  rationale: 基本的な必要物で満足するという趣旨を保ちつつ、語義を一方に限定せず、衣服を中心に住まいを含み得る原文の幅を残した。
- issue: ἀρκεσθησόμεθα の法的ニュアンス
  choice: 未来の陳述「満足します」
  alternative: 勧告「満足しよう」
  rationale: 原文の未来直説法を尊重し、勧告として解釈を確定しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「身を覆うもの」はやや説明的だが、原語の意味の広がりを保つために採用した。
