revisions:
- from: 信者である主人を持つ者たちは、主人が兄弟だからといって、軽んじてはなりません。むしろ、いっそうよく仕えなさい。その良い働きによる益を受けるのは、信者であり、愛されている人たちだからです。[a] これらのことを教え、勧めなさい。
  to: 信者である主人を持つ者たちは、主人が兄弟だからといって、軽んじてはなりません。むしろ、いっそう仕えなさい。益を受ける者たち[a]が信者であり、愛されている者たちだからです。これらのことを教え、勧めなさい。
