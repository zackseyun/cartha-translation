id: 1TI.6.2
reference: 1 Timothy 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: ja
  text: 信者である主人を持つ者たちは、主人が兄弟だからといって、軽んじてはなりません。むしろ、いっそう仕えなさい。益を受ける者たち[a]が信者であり、愛されている者たちだからです。これらのことを教え、勧めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「益を受ける者たち」が誰を指すかについて、ギリシア語は解釈が難しい。ここでは、仕える者たちの奉仕から益を受ける、信者である主人たちを指すと理解した。
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: 信者である
  rationale: ここでは主人がキリストを信じる者であることを表す。「忠実な」ではなく、信仰上の身分を明確にした。
- source_word: δεσπότας
  choice: 主人
  rationale: 奴隷制下で所有権と権威を持つ者を指す。現代日本語で文脈に適した「主人」とした。
- source_word: καταφρονείτωσαν
  choice: 軽んじてはなりません
  rationale: 侮り、価値の低いものとして扱う意を、明瞭で自然な禁止表現にした。
- source_word: ἀδελφοί
  choice: 兄弟
  rationale: 文法上の男性複数形を保ちつつ、ここではキリストにある同信者という家族的関係を表す。
- source_word: μᾶλλον δουλευέτωσαν
  choice: むしろ、いっそうよく仕えなさい
  rationale: 奴隷として奉仕する社会的状況を踏まえながら、μᾶλλονの強意を「いっそうよく」で自然に表した。
- source_word: πιστοί
  choice: 信者
  rationale: 先のπιστούςと同じく、キリストを信じる者を指す。
- source_word: ἀγαπητοὶ
  choice: 愛されている人たち
  rationale: 共同体において愛される者という受動的意味を、現代日本語で明瞭に表した。
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: その良い働きによる益を受けるのは
  rationale: 圧縮され解釈の難しい句である。εὐεργεσίαを「良い働きによる益」、ἀντιλαμβανόμενοιを「益を受ける」とし、文脈上は主人を指す読みを本文に反映しつつ、脚注で異論の余地を示した。
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: これらのことを教え、勧めなさい
  rationale: 二つの現在命令を簡潔で dignified な現代日本語にした。παρακαλέωはこの勧告的文脈で「勧める」とした。
theological_decisions:
- issue: ἀδελφοίの範囲
  choice: 兄弟
  alternative: 兄弟姉妹／同信者
  rationale: 原語の男性複数形を保つ。「兄弟」はここでは主人と仕える者が同じ信仰共同体に属することを示す。
- issue: 奴隷制に関わる身分語の表現
  choice: 主人……仕える
  alternative: 所有者……奴隷として働く
  rationale: δεσπότηςとδουλεύωが示す当時の奴隷制的関係を消さず、日本語として過度に不自然にならない表現を選んだ。
- issue: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοιの指示対象
  choice: 益を受ける信者であり愛されている人たちとは主人たち
  alternative: 仕える側の者たち、または双方が益にあずかる
  rationale: 直前の主人たちを受益者と見るのが文脈上もっとも自然だが、ギリシア語の句は難解で異なる解釈があるため脚注で明示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。命令の力を保ちつつ、文体はです・ます調で統一した。「兄弟」は信仰共同体における同信者の意味。脚注記号[a]は該当する難解句の直後に置いた。
