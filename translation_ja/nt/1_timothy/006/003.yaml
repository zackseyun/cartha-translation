id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: ja
  text: もし異なる教えを説き、私たちの主イエス・キリスト[a]の健全なことばにも、敬虔にかなった教えにも同意しない人がいるなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」はギリシャ語の称号Χριστόςに由来し、「メシア」を意味する。
    reason: Χριστοῦの称号としての意味を示す。
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: 異なる教えを説き
  rationale: 「別のものを教える」という語義を保ちつつ、文脈上の教理的な対照を自然な現代日本語で示す。「偽りの教え」として、原語に明示されない評価を加えることは避けた。
- source_word: προσέρχεται
  choice: 従わない
  rationale: 字義は「近づく」だが、与格の教えを目的語とするここでは、それを受け入れ、よりどころとして従う意味。「同意しない」よりも、教えへの帰属と実践的応答を含みうる原語の幅に適する。
- source_word: ὑγιαίνουσι λόγοις
  choice: 健全なことば
  rationale: ὑγιαίνωの健康の比喩と、λόγοιςの「ことば」をともに保持した。「健全な教え」と意訳して後続のδιδασκαλίαとの区別を失うことを避けた。
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・キリストの
  rationale: 直前の「健全なことば」を限定する属格として自然に結び、「私たちの主」という関係表現を保持した。
- source_word: Χριστοῦ
  choice: キリスト
  rationale: 日本語聖書と一般的なキリスト教語彙で定着した称号表現であり、単なる固有名詞としてではなくイエスに付された称号としても理解できる。必要な称号の意味は脚注で明示する。
- source_word: κατ’ εὐσέβειαν
  choice: 敬虔にかなう
  rationale: κατάが表す一致・適合を「かなう」で示し、その教えが敬虔と調和するという関係を保つ。因果的に「敬虔へ導く」とは限定しない。
- source_word: διδασκαλίᾳ
  choice: 教え
  rationale: 教える行為と内容の双方を含みうる語だが、ここでは受け入れる対象となる教えの内容として自然に訳した。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 神に向けられた畏敬と、それに即した生き方を指す牧会書簡の重要語。「信心」より現代の文脈で誤解が少なく、格調も保てる。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστοῦの称号性
  choice: 本文では「イエス・キリスト」とし、脚注で「メシア」を示す
  alternative: 「メシアであるイエス」
  rationale: Χριστόςが「油注がれた者／メシア」という称号であることを失わないよう脚注で明示しつつ、日本語で定着し、荘重で自然な「イエス・キリスト」を本文に採用した。
- issue: κατ’ εὐσέβειανが表す教えと敬虔の関係
  choice: 敬虔にかなう
  alternative: 敬虔へ導く
  rationale: 原文は一致・適合を明示するが、結果や目的までは明示しないため、因果関係を読み込まず神学的な幅を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。条件節が次節へ続くため読点で終えた。「健全なことば」という原文の比喩を保持し、教えへの応答を「従う」で自然に表した。本文に脚注[a]を付す必要があるため、最終本文では「イエス・キリスト[a]」とする。
