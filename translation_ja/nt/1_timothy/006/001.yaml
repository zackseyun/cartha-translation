id: 1TI.6.1
reference: 1 Timothy 6:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: ja
  text: くびきの下にある奴隷[a]は皆、神の名と教え[b]がそしられない[c]ように、自分の主人をあらゆる敬意に値する者と見なしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」または「奴隷として仕える者」とも訳せる。ギリシア語はδοῦλοι。「くびきの下にある」という表現が拘束された身分を明示しているため、本文では「奴隷」とした。
    reason: alternative_reading
  - marker: b
    text: 「教理」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「冒瀆される」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι εἰσὶν
  choice: 皆
  rationale: ὅσοιの包括的な意味を、前後の日本語構文に自然に組み込み、「皆」とした。
- source_word: ὑπὸ ζυγὸν
  choice: くびきの下にある
  rationale: 服従・束縛を表す原文の比喩を保ち、奴隷状態が明示されるようにした。
- source_word: δοῦλοι
  choice: 奴隷
  rationale: 「くびきの下にある」という表現によって拘束された身分が明白であるため、社会的実態を正確に示す「奴隷」とした。
- source_word: τοὺς ἰδίους δεσπότας
  choice: 自分の主人
  rationale: ἰδίουςの個別的な所有・帰属のニュアンスを「自分の」で示し、δεσπόταςは当時の奴隷に対して権限を持つ者として「主人」とした。
- source_word: πάσης τιμῆς ἀξίους
  choice: あらゆる尊敬に値する者
  rationale: 包括性を持つπάσηςと、価値・相応しさを表すἀξίουςを保ちつつ、現代日本語として明瞭に表現した。
- source_word: ἡγείσθωσαν
  choice: 見なしなさい
  rationale: 継続的な評価・態度を求める現在命令形を、明確な勧告として訳した。
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: 神の御名
  rationale: 神の名がその評判と啓示された御性質を担う聖書的表現であることを踏まえ、自然で敬意ある日本語とした。
- source_word: ἡ διδασκαλία
  choice: その教え
  rationale: 文脈上のキリスト教の教えを指すことを「その」で示し、専門用語化しすぎない「教え」を採用した。
- source_word: βλασφημῆται
  choice: そしられる
  rationale: 神の御名と教えの双方を目的語として自然に受けられ、侮辱的に悪く言う意味を表す。「冒瀆される」よりも両方の目的語に適合する。
theological_decisions:
- issue: δοῦλοιが指す社会的身分の表現
  choice: 奴隷
  alternative: 僕、奴隷として仕える者
  rationale: 本文が奴隷制を是認しているとの解釈を付加せず、同時に「くびきの下」という文脈が示す拘束された身分を弱めないため、「奴隷」と明示した。
- issue: διδασκαλίαの訳語
  choice: その教え
  alternative: その教理
  rationale: 公に評価される信仰の教えを指すが、後代の体系的・教派的な含意を不必要に持ち込まないよう「教え」とした。
- issue: βλασφημῆταιの意味範囲
  choice: そしられる
  alternative: 冒瀆される
  rationale: 神の御名については「冒瀆」も可能だが、同じ動詞が「教え」にもかかるため、両者に自然で、非難・中傷の意味を保つ「そしられる」を本文に採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の力と原文の「くびき」の比喩を保持した。「御名」は聖書的概念への敬意を示すが、文全体は過度に文語的にならないよう整えた。
