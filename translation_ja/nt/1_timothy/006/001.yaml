review_pass:
  verdict: revise
  source_fidelity: 主要な語義は原文に忠実である。δοῦλοιを「奴隷」、ὑπὸ ζυγόνを「くびきの下にある」、δεσπόταςを「主人」、βλασφημῆταιを「そしられる」とする選択はいずれも文脈に適切である。ただし、ἵνα＋接続法は目的を示すため、「…ことのないためです」よりも「…ないように」と明示するほうが、命令との関係を正確に表せる。
  naturalness: 現行文は概ね明瞭だが、命令文に続く「…ことのないためです」はやや説明文調で、目的節としてのつながりが弱い。「神の名と教えがそしられないように」として主文に結び付けると、現代標準日本語として自然である。「あらゆる敬意に値する者」は「尊敬」よりもτιμήの敬意・名誉の含みをよりよく保つ。
  terminology: 「奴隷」は、直後の「くびきの下にある」と整合し、拘束された身分を弱めない。「神の名」は原文どおりであり、「御名」とすることも可能だが、本文では過度な敬称を加えない形が明瞭である。「教え」はδιδασκαλίαに適切で、「教理」は注で示せる。
