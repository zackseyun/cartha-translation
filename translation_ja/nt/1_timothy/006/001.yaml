    rationale: ἵνα μὴ … βλασφημῆταιは、主人を敬意に値する者と見なすことの目的を示す。現行の「…ことのないためです」は意味を大きく損なわないものの、命令への目的的な従属関係を「…ないように」と明示するほうが正確で自然である。
  - severity: low
