  to: くびきの下にある奴隷[a]は皆、神の名と教え[b]がそしられない[c]ように、自分の主人をあらゆる敬意に値する者と見なしなさい。
  rationale: 原文の目的節を明瞭に反映するため、語順を整えて「神の名と教えがそしられないように」とした。また、ἡ διδασκαλίαに対する不要な指示語を除き、πάσης τιμῆςに対応する語を「あらゆる敬意」とした。奴隷制への是認を付加せず、原文が前提とする社会的身分を「奴隷」として保持している。
