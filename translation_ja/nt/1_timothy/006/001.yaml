    rationale: ἡ διδασκαλίαは文脈上定まった教えを指すが、日本語の「その」は直前の「神の御名」を受けるようにも響きうる。「教え」とすることで、原文の並列を明瞭に保てる。
  - severity: low
    issue: 「尊敬」より「敬意」がτιμήにより近い
    rationale: τιμήは内心の尊敬だけでなく、示される敬意・名誉を含む。「あらゆる敬意に値する者」は日本語として自然で、原語の範囲をよく反映する。
