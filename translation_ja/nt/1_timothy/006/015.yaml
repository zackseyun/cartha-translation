revisions:
- from: その現れを、定められた時々に示してくださるのは、祝福に満ちた唯一の主権者、すなわち、治める者たちの王、支配する者たちの主です。[a]
  to: その現れを、ご自身の定めた時に示してくださるのは、祝福に満ちた唯一の主権者、すなわち、治める者たちの王、支配する者たちの主[a]です。
  rationale: 「定められた時々に」を、誤解のない「ご自身の定めた時に」へ改めた。日本語ではギリシア語の複数形を逐語的に再現せずとも、定められた時という意味を自然に表すことができる。本文は主体を固有名で特定せず、原文どおり称号群によって提示している。脚注内容は原文の分詞構文と伝統的表現の差を適切に説明しているため保持し、アンカーのみ該当句の直後へ移した。
