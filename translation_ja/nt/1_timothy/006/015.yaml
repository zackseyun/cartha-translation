id: 1TI.6.15
reference: 1 Timothy 6:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: ja
  text: その現れを、ご自身の定めた時に示してくださるのは、祝福に満ちた唯一の主権者、すなわち、治める者たちの王、支配する者たちの主[a]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「王の王、主の主」。ギリシア語は分詞を用いており、直訳すれば「治める者たちの王、支配する者たちの主」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: その現れを
  rationale: 女性単数の関係代名詞で、14節の ἐπιφάνειαν（「現れ」）を受ける。日本語では先行詞を補って目的語として明示するのが自然。
- source_word: καιροῖς ἰδίοις
  choice: 定められた時々に
  rationale: 複数形の καιροῖς を「時々」で保ちつつ、文脈上、主権者が自ら定めた時を表すことを自然な日本語で示す。
- source_word: δείξει
  choice: 示してくださる
  rationale: δείκνυμι の未来形が表す「公に見えるようにする」という具体的な意味を「示す」で表現する。敬語は神を指す文脈に即した日本語上の措置。
- source_word: ὁ μακάριος
  choice: 祝福に満ちた
  rationale: 神への称号としての μακάριος を、単に「幸福な」とせず、威厳と充足を表す自然な現代日本語にした。
- source_word: μόνος δυνάστης
  choice: 唯一の主権者
  rationale: δυνάστης は支配権を持つ者を指す。「主権者」は最高の統治権を明確に表し、「権力者」よりもこの称号にふさわしい。
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: 治める者たちの王
  rationale: 名詞「王たち」ではなく分詞 βασιλευόντων の動詞的な力を保つ。伝統的な「王の王」より原文の形に近い。
- source_word: κύριος τῶν κυριευόντων
  choice: 支配する者たちの主
  rationale: κύριος を称号として「主」とし、分詞 κυριευόντων は「支配する者たち」と訳して動詞的な意味を保つ。
theological_decisions:
- issue: 「示す」主体の同定
  choice: 本文では固有名を補わず、原文の称号によって主体を示す。
  alternative: 「父なる神が」または「神が」と明示する。
  rationale: ギリシア語本文は主体を固有名で呼ばず、「祝福に満ちた唯一の主権者」以下の称号で提示するため、その神学的な提示の仕方を保持する。
translation_notes:
  register: 明瞭で威厳ある現代標準語。「定められた時々」は複数形と神による時の設定をともに伝える。「王の王、主の主」という定着した表現は脚注に置き、本文では原文の分詞構文を見える形で残した。
