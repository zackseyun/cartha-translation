  text: ταῦτα μελέτα, ἐν τούτοις ἴσθι, ἵνα σου ἡ προκοπὴ φανερὰ ⸀ᾖ πᾶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/015.yaml
  text: Practice these things; be in them[a], so that your progress may be evident to all.
translation:
  language: ja
  text: あなたの進歩がすべての人に明らかになるように、これらのことを実践し、これらに専念しなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「これらの中にいなさい」。これらのことに深く関わり、打ち込むことを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前に述べられた一連の教えと務めを指す複数の指示代名詞。現代日本語として自然で、指示範囲を不必要に狭めない。
- source_word: μελέτα
  choice: 励み
  rationale: 熟考だけでなく、継続して実践し身につけることを含む命令。文脈上、先の務めに不断に取り組む意味を自然に表す。
- source_word: ἐν τούτοις ἴσθι
  choice: これらに専念しなさい
  rationale: 字義的には「これらの中にいなさい」。深く関わり、全身を傾けるという慣用的意味を、明瞭な現代日本語で表した。字義的表現は脚注に残す。
- source_word: ἵνα
  choice: そうすれば
  rationale: 目的と結果の双方を帯びうる接続を自然に示す。日本語では、命令に続く目に見える帰結として滑らかに読める。
- source_word: προκοπή
  choice: 進歩
  rationale: 前進、成長、向上を広く表す語。霊的成熟または務めの技能の一方だけに限定しない。
- source_word: φανερὰ ᾖ πᾶσιν
  choice: すべての人に明らかになるでしょう
  rationale: 進歩が公に認められるようになることを表す。目的・期待を自然な日本語で示しつつ、対象の「すべての人」を保持した。
theological_decisions:
- issue: テモテの「進歩」の範囲
  choice: 教え、品行、務めへの献身などを含む、目に見える広い進歩として訳す。
  alternative: 霊的成熟だけ、または牧会・奉仕の能力だけを指すと限定する。
  rationale: προκοπή 自体も周辺文脈も一方だけへの限定を要求しないため、「進歩」という広い語を保った。
- issue: ἵνα の目的・結果の関係
  choice: 「そうすれば」とし、先の命令に従うことから進歩が明らかになる関係を表す。
  alternative: 「明らかになるために」と目的だけを前面に出す。
  rationale: ἵνα は目的を基本としつつ結果的含意も持ちうる。日本語では目的だけに固定せず、自然な因果的つながりを示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「励み」と「専念しなさい」により、継続的な実践と深い関与を重ねて表す原文の二つの命令を区別した。
