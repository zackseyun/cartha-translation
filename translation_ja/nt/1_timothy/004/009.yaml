lexical_decisions:
- source_word: πιστὸς
  choice: 信頼できる
  rationale: 定型句「πιστὸς ὁ λόγος」において、述べられた内容が確かで信頼に足ることを表す。現代日本語として明瞭で自然な「信頼できる」とした。
- source_word: ὁ λόγος
  choice: このことば
  rationale: ここでは特定の言明を指す。日本語では指示性を自然に示すため「この」を用い、定型句としての幅を保つ「ことば」とした。文脈により「この言明」「この教え」とも訳し得る。
- source_word: πάσης
  choice: 全面的に
  rationale: πάσης ἀποδοχῆς は、余すところなく受け入れることを表す。「あらゆる受容」などの逐語訳を避け、全体性を自然に示した。
- source_word: ἀποδοχῆς
  choice: 受け入れる
  rationale: ἀποδοχήは受容、歓迎を意味する。日本語では「受容に値する」より「受け入れるに値する」が一般読者に明瞭である。
- source_word: ἄξιος
  choice: 値します
  rationale: 属格を伴い「〜に値する」を意味する。原文の評価を、自然で dignified な敬体表現にした。
theological_decisions:
- issue: ὁ λόγος が指す範囲
  choice: 本文では「このことば」とし、指示対象を限定しすぎない
  alternative: 「この言明」「この教え」
  rationale: この定型句が直前の内容を指すか、続く内容を導入するかについて解釈の余地があるため、翻訳で一方に固定しない。
translation_notes:
  register: 明瞭な現代標準日本語の敬体。書簡の格調を保ちつつ、「全面的に受け入れる」で πάσης ἀποδοχῆς の強意を自然に表現した。
