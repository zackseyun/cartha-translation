- from: 結婚を禁じ、また、信じて真理を知るに至った人々が感謝して食べるために神が造られた食物を、断つように命じます[a]。
  to: 結婚を禁じ、また、信じ、真理を知るに至った人々が感謝して食べるために神が造られた食物を控えるよう命じます[a]。
  rationale: 「断つ」を「控える」に改めて、ἀπέχεσθαι の食物を避ける・控えるという意味を明瞭にしました。また、二つの特徴が一つの集団に並列して属することを保つため、「信じて」を「信じ、」に改めました。脚注も本文の語彙に合わせ、統語上の補いを明示しています。
