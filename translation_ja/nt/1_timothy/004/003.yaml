  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κωλυόντων γαμεῖν, ἀπέχεσθαι βρωμάτων ἃ ὁ θεὸς ἔκτισεν εἰς μετάλημψιν μετὰ εὐχαριστίας τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/003.yaml
  text: forbidding marriage and requiring abstinence from foods that God created to be received with thanksgiving by those who believe and have come to know the truth[a].
translation:
  language: ja
  text: 結婚を禁じ、また、信じ、真理を知るに至った人々が感謝して食べるために神が造られた食物を控えるよう命じます[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の語順に近く訳すと、「結婚することを禁じ、食物を控えることを」となります。後半では、偽りを語る者たちが食物を控えるよう命じるという意味を前後の文脈から補っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων
  choice: 禁じ
  rationale: 前節から続く現在分詞であり、偽りを語る者たちが継続的に課す禁止を自然に表す。
- source_word: γαμεῖν
  choice: 結婚を
  rationale: 字義的には「結婚することを」だが、「結婚を禁じる」が現代日本語として簡潔で自然である。
- source_word: ἀπέχεσθαι
  choice: 断つように命じます
  rationale: 語自体は「断つ、控える」という不定詞。原文では支配する命令語が省略されていると解するのが文脈上自然なので、その含意を本文で明示した。
- source_word: βρωμάτων
  choice: 食物を
  rationale: 食べ物を指す複数属格。日本語では集合的な「食物」が自然で、特定の食品類を断つという意味を保てる。
- source_word: ἃ
  choice: 食物を…神が造られた
  rationale: 先行詞「食物」を受ける関係代名詞を、日本語の連体修飾構文で表した。
- source_word: ἔκτισεν
  choice: 神が造られた
  rationale: κτίζωの創造の含意を保つため、一般的な「作る」ではなく「造る」を用いた。
- source_word: εἰς μετάλημψιν
  choice: 食べるために
  rationale: 食物を受け、あずかるという目的を、この文脈で明瞭な現代日本語にした。
- source_word: μετὰ εὐχαριστίας
  choice: 感謝して
  rationale: 神への感謝を伴って食物にあずかることを、自然な副詞表現で示した。
- source_word: τοῖς πιστοῖς
  choice: 信じて…人々が
  rationale: ここでの πιστός は「忠実な」よりも「信じる者」を指すと判断し、動詞的な意味を明確にした。
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: 真理を知るに至った
  rationale: 完了分詞が示す、真理を知るようになり、今もその認識にあるという結果状態を表した。
theological_decisions:
- issue: τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν が一つの集団を指すか、二つの集団を指すか
  choice: 「信じて真理を知るに至った人々」という一つの集団を二つの特徴で描写する
  alternative: 「信じる人々と、真理を知るに至った人々」という二つの集団
  rationale: 共有された冠詞のもとで二つの表現が καί により結ばれているため、同じ人々を二つの面から述べる理解が文法上最も自然である。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「食べるために」は「受けるために」より自然であり、食物にあずかるという原語の文脈的意味を明確にする。原文の後半にある統語上の省略は本文で補い、脚注で明示した。
