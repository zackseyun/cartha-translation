    issue: 「食物を断つように命じます」
    rationale: 「断つ」は完全な断絶や絶食を含意し得るため、「食物から控える」という原文の意味をやや狭く、または強く読ませます。「食物を控えるよう命じます」がより直接的です。
  - severity: low
    issue: 「信じて真理を知るに至った人々」
    rationale: ギリシア語の πιστοῖς καὶ ἐπεγνωκόσι は同一の人々を二つの並列した特徴で述べます。「信じて」は日本語では後続行為への時間的・手段的つながりも示し得るため、読点で並列を示すのがよいです。
  revised_text: 結婚を禁じ、また、信じ、真理を知るに至った人々が感謝して食べるために神が造られた食物を控えるよう命じます[a]。
