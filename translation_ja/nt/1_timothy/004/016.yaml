  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: ja
  text: 自分自身と教えに、よく注意を払いなさい。これらのことを続けなさい[a]。そうすることによって、あなたは自分自身と、あなたの言葉を聞く人たちとの両方を救うことになります[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらのことにとどまりなさい」または「これらのことを粘り強く続けなさい」。
    reason: lexical_alternative
  - marker: b
    text: 「救う」と訳したギリシア語は、文脈によって「助け出す」「守る」「救う」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεχε
  choice: よく注意を払いなさい
  rationale: 継続的に注意を向け、見守るよう求める命令の力を、自然な現代日本語で表した。
- source_word: σεαυτῷ
  choice: 自分自身とに
  rationale: 注意を向ける対象がテモテ自身であることを明確にした。後続の「教え」と並列されるため、本文では「自分自身と教えとに」とした。
- source_word: τῇ διδασκαλίᾳ
  choice: 教え
  rationale: 教える行為とその内容の双方を含み得る語であり、「教理」よりも一般読者に分かりやすく、原文の幅も保てる。
- source_word: ἐπίμενε αὐτοῖς
  choice: これらのことを続けなさい
  rationale: 先に述べた自己への注意と教えへの注意を続けるよう命じる表現として自然に訳した。動詞には、とどまり続ける、粘り強く続けるという含みがある。
- source_word: τοῦτο γὰρ ποιῶν
  choice: そうすることによって
  rationale: 分詞構文が手段または伴う行為を示すため、結果とのつながりを明瞭にした。γάρの説明的な関係も文脈上保たれている。
- source_word: σώσεις
  choice: 救うことになる
  rationale: σῴζωの神学的な重みを弱めず「救う」とした。未来形と、忠実に続けることから生じる結果を自然な日本語で表しつつ、救いの範囲を限定しなかった。
- source_word: τοὺς ἀκούοντάς σου
  choice: あなたに耳を傾ける人たち
  rationale: 単に音を聞くより、テモテの教えを継続的に聞く人々という意味を自然に表した。
theological_decisions:
- issue: 牧会的勧告における「救う」の意味と主体
  choice: 本文では「救う」を保持し、永遠の救いだけにも、現世的・霊的な保護だけにも限定しない。
  alternative: 「守る」「無事に導く」として保護の意味を前面に出す、または終末的救済に限定して理解する。
  rationale: 本文は、テモテが自分自身と教えに注意を払い続けることを、本人と聞く人々の救いに結びつけている。翻訳ではこの強い因果表現と神学的緊張を保ち、人間の功績による自己救済という説明も、神の救いの働きにおける奉仕者の手段的役割という説明も本文へ付け加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、二つの命令とその結果という原文の構造を保った。「教え」「救う」などの主要語は、専門用語化や意味の限定を避けて簡潔かつ格調ある表現とした。
