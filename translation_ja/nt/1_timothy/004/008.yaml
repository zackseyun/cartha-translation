source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: ja
  text: 体の鍛錬は、限られた範囲で有益ですが[a]、敬虔は、今のいのちと来たるべきいのちについての約束を持っているので、あらゆる面で有益です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わずかな間は有益ですが」。ギリシア語は、効用の範囲が限られていること、または効用の期間が短いことを意味し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: 体の鍛錬
  rationale: 身体に関わる訓練・鍛錬を指す語句を、運動だけに狭めず、現代日本語として自然に表した。
- source_word: πρὸς ὀλίγον
  choice: 限られた面で
  rationale: ὀλίγον は程度の小ささにも期間の短さにも解し得る。本文では文脈上自然な限定的効用を示しつつ、別解を脚注に残した。
- source_word: ὠφέλιμος
  choice: 有益です
  rationale: 二つの節で同じ訳語を用い、対比を明確に保った。
- source_word: εὐσέβεια
  choice: 敬虔
  rationale: 神への畏敬に根ざす生き方を示す牧会書簡の重要語として、簡潔で定着した訳語を選んだ。
- source_word: πρὸς πάντα
  choice: あらゆる面で
  rationale: 『すべてのことに対して』という広い効用を、自然な日本語で表した。
- source_word: ἐπαγγελίαν ἔχουσα
  choice: 約束を伴っているので
  rationale: 分詞句が敬虔の包括的な有益性の根拠を示す働きを、理由を表す接続で明確にした。
- source_word: ζωῆς τῆς νῦν καὶ τῆς μελλούσης
  choice: 今のいのちと来たるべきいのち
  rationale: 現在と将来の ζωή の対比を保ち、後半で省略された『いのち』を日本語では補って明瞭にした。
theological_decisions:
- issue: 体の鍛錬の効用の範囲
  choice: 体の鍛錬には限定された面で効用がある
  alternative: 体の鍛錬は短い期間だけ有益である
  rationale: πρὸς ὀλίγον の程度的解釈を本文に採りつつ、身体的鍛錬を無価値とはせず、敬虔の包括的な有益性との相対的対比を保った。時間的解釈も脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の対照構造を維持し、『体の鍛錬』と『敬虔』の双方に同じ『有益』を用いた。
