  text: Until I come[a], devote yourself to the public reading, to exhortation, to teaching.
translation:
  language: ja
  text: 私が来るまで、公共の朗読[a]と勧めと教えに専念しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖書の朗読」。ギリシア語は単に「朗読」と言うが、この文脈では、会衆の集まりで聖書を公に朗読することを指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: 私が行くまで
  rationale: ἕωςは到着までの期間を示し、現在形ἔρχομαιは文脈上、将来の訪問を指す。自然な現代日本語で簡潔に表した。
- source_word: πρόσεχε
  choice: 励みなさい
  rationale: 単に注意を向けるだけでなく、継続して専念するよう求める命令の力を自然に伝える。
- source_word: τῇ ἀναγνώσει
  choice: 公の朗読
  rationale: ἀνάγνωσις自体は「朗読」だが、教会の務めを扱う文脈では会衆の場での公的朗読を指す可能性が高い。「聖書」は原文に明記されていないため本文には補わず、脚注で示した。
- source_word: τῇ παρακλήσει
  choice: 勧め
  rationale: παράκλησιςには励ましと勧告の両面がある。この務めの列挙では、人々に応答を促す「勧め」が簡潔で適切である。
- source_word: τῇ διδασκαλίᾳ
  choice: 教え
  rationale: 教える行為またはその内容を表し、体系化された教義に限定せず、一般読者にも明瞭である。
theological_decisions:
- issue: ἀνάγνωσιςの対象を本文で明示するか
  choice: 本文は「公の朗読」とし、「聖書」を明示しない
  alternative: 「聖書の朗読」または単に「朗読」
  rationale: 教会秩序と奉仕の文脈から聖書の公的朗読が強く示唆される一方、ギリシア語本文には朗読対象が明記されていない。そこで公的性格は本文に反映し、対象についての原文の含みは脚注で保った。
- issue: παράκλησιςの勧告と慰めの幅
  choice: 勧め
  alternative: 励まし
  rationale: 朗読、教えと並ぶ奉仕の文脈では勧告的意味が前面に出るが、語が持つ牧会的な励ましの響きを排除するものではない。
translation_notes:
  register: 明瞭で簡潔な現代標準語。「励みなさい」により継続的な専念を表し、三つの務めを「朗読・勧め・教え」という平易で品位ある語でそろえた。
