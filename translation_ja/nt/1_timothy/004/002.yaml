translation:
  language: ja
  text: 自分自身の良心に焼き印を押された、偽りを語る者たちの偽善を通してである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分自身の良心を焼灼されている」。ギリシア語の比喩は、良心に焼き印を付けられたこと、あるいは良心が鈍感にされたことを示唆している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν
  choice: を通して
  rationale: 前節の内容が生じる手段・媒介を示す用法として理解した。日本語では「によって」も可能だが、「を通して」は偽りを語る者たちの偽善が媒介となることを自然に表す。
- source_word: ὑποκρίσει
  choice: 偽善
  rationale: 見せかけや不誠実さを表す語であり、この道徳的・宗教的文脈では「偽善」が明確で標準的である。
- source_word: ψευδολόγων
  choice: 偽りを語る者たちの
  rationale: 単なる一度の発言ではなく、偽りを語ることによって特徴づけられた人々を指す。「うそつき」よりも品位ある文体を保ち、ὑποκρίσειにかかる属格も明示する。
- source_word: κεκαυστηριασμένων
  choice: 焼きごてで焼かれている
  rationale: 焼きごてで印を付けること、または焼灼することを思わせる比喩を保った。完了受動分詞が示す、処置を受けてその状態にあるという結果的意味も表している。
- source_word: τὴν ἰδίαν συνείδησιν
  choice: 自分の良心を
  rationale: ἰδίανの強意的な所有の意味を「自分の」で保ち、単数形のσυνείδησινは各人に配分される意味で自然な日本語の単数「良心」とした。対格は身体・領域に関する対格として「良心を」と訳した。
theological_decisions:
- issue: κεκαυστηριασμένωνの比喩的意味
  choice: 「焼きごてで焼かれている」として原像を残す
  alternative: 「良心が麻痺している」または「良心に烙印を押されている」
  rationale: この語は、焼灼によって感覚を失うことと、焼き印を付けられることの双方を想起させうる。本文では像そのものを保ち、良心が不可逆的に滅びたなどの体系的な教理判断を加えない。脚注で主要な解釈可能性を示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、聖書本文にふさわしい品位を保った。断片的な節であるため、前節との連続を示す「である」を補った。「焼きごてで焼かれている」はやや異様さを残すが、原文の鮮烈な比喩と解釈上の曖昧さを保持するため意図的に採用した。
