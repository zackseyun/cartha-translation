  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: ja
  text: 私たちがこのために労苦し、そしりを受けているのは、生ける神に望みを置いているからです[a]。この方は、すべての人、特に信じる人々の救い主です[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「生ける神に希望を託しているからです」。
    reason: lexical_alternative
  - marker: b
    text: 「すべての人、特に信じる人々の救い主」という表現は、原文のとおりに訳した。「救い主」がここで、すべての人を保ち支える神の働き、すべての人に備えられた救い、または信じる人々に特に実現する救いのどれを強調するかについては、解釈が分かれる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: このために
  rationale: 直前に述べられた目的を指す表現として、目的性を保ちながら自然な現代日本語にした。
- source_word: γὰρ
  choice: 実に
  rationale: 前文を受けて理由や説明を加える働きを、日本語の文脈に自然につなぐ表現で示した。理由の内容自体は後続の「それは……からです」で明示される。
- source_word: κοπιῶμεν
  choice: 労苦し
  rationale: 単なる労働ではなく、疲労を伴う懸命な働きという語感を簡潔に伝える。
- source_word: ὀνειδιζόμεθα
  choice: そしりを受けています
  rationale: 受動形と、非難・侮辱によって恥辱を受ける意味を保ちつつ、理解しやすい表現とした。
- source_word: ἠλπίκαμεν ἐπὶ
  choice: 望みを置いている
  rationale: 完了形が表す、すでに望みを置き、その状態が今も続いているという含みを自然な日本語で表した。
- source_word: θεῷ ζῶντι
  choice: 生ける神
  rationale: 聖書で定着した荘重な表現を用い、単に存在する神ではなく、命ある神という対比的な力を保った。
- source_word: σωτὴρ
  choice: 救い主
  rationale: 救助者・保護者という含みもあり得るが、牧会書簡での神学的重みを保持する標準的な訳語を採用した。
- source_word: πάντων ἀνθρώπων
  choice: すべての人
  rationale: 性別を限定しない人類一般への包括的な言及を、自然な現代日本語で表した。
- source_word: μάλιστα
  choice: 特に
  rationale: 「すべての人」と「信じる人々」の関係を限定的に解釈せず、原文の普遍性と特殊性の緊張をそのまま残した。
- source_word: πιστῶν
  choice: 信じる人々
  rationale: ここでは信仰を持つ者を指すため、現代の一般読者に直接理解できる表現とした。
theological_decisions:
- issue: 「すべての人、特に信じる人々の救い主」の意味
  choice: 「すべての人」と「特に信じる人々」の両方をそのまま訳し、「特に」が示す信者との特別な関係を保持する。
  alternative: 「救い主」を万人に対する摂理的な保護者、信者に対する贖いの救い主と区別する解釈、万人救済とする解釈、または「すべての種類の人」と限定する解釈。
  rationale: 原文は普遍的表現と信者への特別な言及を並置している。翻訳ではその神学的緊張を特定の教理体系に沿って解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を基本としつつ、「生ける神」「救い主」には聖書本文にふさわしい品位と定着した響きを保った。長い一文を三文に分け、論理関係を明確にした。
