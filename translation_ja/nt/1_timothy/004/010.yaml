revisions:
- from: 実に、私たちはこのために労苦し、そしりを受けています[a]。それは、生ける神に望みを置いているからです[b]。この方は、すべての人、特に信じる人々の救い主です[c]。
  to: 私たちがこのために労苦し、そしりを受けているのは、生ける神に望みを置いているからです[a]。この方は、すべての人、特に信じる人々の救い主です[b]。
  rationale: 本文を「…のは、…からです」として、労苦とそしりの理由を自然な日本語で明示した。これにより、γάρの説明的機能とὅτι節の理由を不必要に重複させずに表せる。意味内容、現在形の含み、「すべての人」と「特に信じる人々」の緊張は変更していない。本文中の注a（労苦・そしりの代替訳）は、英語監査記録には対応する注があるものの、日本語本文に必要な意味上の不確定性を示すものではないため省いた。希望に関する代替訳を注aに置き、神学的解釈に関する注を本文の「救い主」に対応する注bに置いた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:02:41Z'
