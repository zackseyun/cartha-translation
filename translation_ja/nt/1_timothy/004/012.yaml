id: 1TI.4.12
reference: 1 Timothy 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: ja
  text: だれも、あなたの若さを軽く見てはなりません。しかし、ことばにも、行いにも、愛にも、信仰[a]にも、清さにも、信じる人たちにとっての模範となりなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忠実さ」とも訳せる。ここで使われているギリシア語は、この文脈では信仰と忠実さのどちらをも意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς ... καταφρονείτω
  choice: だれにも軽く見られないようにしなさい
  rationale: 禁止の命令を、テモテへの勧告として自然な現代日本語で表した。「軽く見る」は、相手を低く評価するというκαταφρονέωの社会的な含みを伝える。
- source_word: τῆς νεότητος
  choice: 年が若いからといって
  rationale: 単なる「若さ」という性質より、この文脈で問題となる若い年齢を明確にし、日本語として自然な理由表現にした。
- source_word: τύπος γίνου
  choice: 模範となりなさい
  rationale: τύποςがここで示す、他の人が見習うべき型・実例という意味を明瞭に表す。「となりなさい」はγίνουの変化・実現への勧告を保つ。
- source_word: τῶν πιστῶν
  choice: 信じる人たちの
  rationale: キリストを信じる人々を指す用法を、一般読者にも分かりやすく表した。属格は、彼らにとっての模範であることを示す自然な日本語として処理した。
- source_word: ἐν λόγῳ
  choice: ことばにも
  rationale: 話す内容と話し方を含み得るλόγοςを、簡潔で広い「ことば」とした。
- source_word: ἐν ἀναστροφῇ
  choice: 行いにも
  rationale: ἀναστροφήが表す日常の振る舞い・生活態度を、列挙に適した自然な語で表した。
- source_word: ἐν ἀγάπῃ
  choice: 愛にも
  rationale: ἀγάπηを直接的で広く理解される「愛」とした。
- source_word: ἐν πίστει
  choice: 信仰にも
  rationale: πίστιςの基本的な意味である信仰を本文に採用しつつ、この徳目一覧では誠実さ・忠実さを指す可能性を脚注に残した。
- source_word: ἐν ἁγνείᾳ
  choice: 清さにも
  rationale: 道徳的・性的な純粋さを含みながら、それだけに限定しないἁγνείαの幅を保つため、「清さ」とした。
theological_decisions:
- issue: 徳目一覧におけるπίστιςの意味
  choice: 信仰
  alternative: 誠実さ／忠実さ
  rationale: 神への信頼としての「信仰」と、人に表れる「誠実さ・忠実さ」の双方が文脈上可能である。本文では語の基本的な訳を用い、意味を一方に決めず代案を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、勧告としての力と徳目の整った列挙を保った。「ことばにも、行いにも…」と助詞を反復し、原文のἐνの反復を自然な日本語のリズムで反映した。脚注記号は該当する「信仰」の直後に置いた。
