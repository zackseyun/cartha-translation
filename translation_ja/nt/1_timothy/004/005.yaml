id: 1TI.4.5
reference: 1 Timothy 4:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/005.yaml
  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: ja
  text: 神のことばと祈り[a]によって聖なるものとされる[b]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「願い」または「執り成し」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖別される」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: 聖なるものとされる
  rationale: 現在受動態の意味を保ちつつ、現代の一般読者にも理解しやすくした。直前の文脈では食物を指すが、本文に「食物」を補わず、原文の簡潔さを保った。
- source_word: γὰρ
  choice: からです
  rationale: 前節の内容に理由を添える説明的な接続を、日本語の文末表現で自然に示した。
- source_word: διὰ
  choice: によって
  rationale: 属格を伴う手段・媒介の意味を簡潔に表す。
- source_word: λόγου θεοῦ
  choice: 神のことば
  rationale: 属格構文を自然かつ伝統的な聖書用語で訳し、それが具体的に何を指すかは限定しなかった。
- source_word: ἐντεύξεως
  choice: 祈り
  rationale: 食物を感謝して受けるという文脈では、広い意味の「祈り」が自然である。語が持ち得る「願い」「執り成し」の含みは脚注に残した。
theological_decisions:
- issue: 文脈における聖化の範囲
  choice: 食物が神に受け入れられる聖なるものとされることを表すが、本文では「聖なるものとされる」と訳して表現の幅を保つ。
  alternative: 「聖別される」とし、用途のために取り分けられる意味を前面に出す。
  rationale: 直前の文脈は感謝して受ける食物について述べている。一方、原文のἁγιάζεταιが持つ聖化の表現を狭く言い換えず、秘跡的・救済論的な主張も付加しない。
translation_notes:
  register: 明快で簡潔な現代標準日本語。「神のことば」は聖書としての品位と語義の開放性を保つため、漢字の「言葉」ではなく聖書翻訳で親しまれている表記を用いた。
