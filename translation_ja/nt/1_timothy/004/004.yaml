source:
  edition: SBLGNT
  text: ὅτι πᾶν κτίσμα θεοῦ καλόν, καὶ οὐδὲν ἀπόβλητον μετὰ εὐχαριστίας λαμβανόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: ja
  text: なぜなら、神が造られたものはすべて良く[a]、感謝して受けるなら、何一つ退けるべきものはないからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の被造物はすべて良い」。ギリシア語の「クティスマ」は、生き物に限らず、造られたものを広く指し得ます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「感謝して受けるときは、何一つ退けるべきものではありません」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: のであり
  rationale: 前節の内容を受け、その理由を示す接続詞として訳した。日本語では文中の「のであり」が説明・根拠の関係を自然に表す。
- source_word: πᾶν κτίσμα θεοῦ
  choice: 神が造られたものはすべて
  rationale: κτίσμαを文脈上「被造物」や「生き物」に限定せず、神によって造られたもの全般を指す自然な表現とした。単数形に伴うπᾶνの分配的意味も「すべて」によって示す。
- source_word: καλόν
  choice: 良い
  rationale: 創造についての肯定を簡潔に保ち、創造物としての適切さと価値を過度に限定しない。
- source_word: οὐδὲν ἀπόβλητον
  choice: 何一つ退けるべきものはありません
  rationale: 絶対的な否定を「何一つ」で保ち、ἀπόβλητονの「拒絶すべき／捨てるべき」という意味を、食物の受容にも自然に合う「退けるべきもの」とした。
- source_word: μετὰ εὐχαριστίας
  choice: 感謝して
  rationale: 単なる内面的な感謝だけでなく、感謝を伴って受けるという行為を自然な現代日本語で表す。
- source_word: λαμβανόμενον
  choice: 受けるなら
  rationale: 現在受動分詞が示す付帯状況ないし条件を、日本語では条件形で明確かつ自然に表した。ただし「受けるとき」も可能であるため脚注で示す。
theological_decisions:
- issue: κτίσμαの範囲と食物規定・禁欲的禁止との関係
  choice: 「神が造られたもの」と広く訳す
  alternative: 「神の被造物」「神が造られた生き物」「神が造られた食物」
  rationale: 直前の文脈は食物を扱うが、ギリシア語自体はより広い。本文を「食物」に狭めず、創造に基づく広い原則が文脈中の食物に適用される構造を保った。
- issue: λαμβανόμενονの条件的・状況的な力
  choice: 「感謝して受けるなら」
  alternative: 「感謝して受けるときは」「感謝とともに受けられるものは」
  rationale: 感謝を伴う受容と、退けるべきでないこととの結び付きを明瞭にしつつ、分詞が表す関係を断定的に狭めすぎないよう代案を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての端正さを保った。「被造物」は正確だが日常読者にはやや専門的なため、本文では「神が造られたもの」とし、脚注に残した。
