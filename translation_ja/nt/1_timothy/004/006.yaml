id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: ja
  text: これらのことを兄弟たち[a]に示すなら、あなたは、信仰[b]のことばと、あなたが従ってきた良い教えによって養われている、メシア・イエス[c]の良い奉仕者となります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、文脈によっては女性を含む信者たち全体を指します。
    reason: cultural_note
  - marker: b
    text: 「信仰についてのことば」とも訳せます。ここでの「信仰」は、共有された信仰内容を指す可能性があります。
    reason: lexical_alternative
  - marker: c
    text: 「キリスト・イエス」とも訳せます。ギリシア語の Χριστός は「メシア」を意味する称号です。
    reason: alternative_reading
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 直前までに述べられた複数の教えや警告を指す中性複数の指示語を、その複数性が分かる形で訳した。
- source_word: ὑποτιθέμενος
  choice: 示すなら
  rationale: 本来は「前に置く」を表し、ここでは共同体に提示して注意を促す意味。日本語では条件的な分詞の働きも自然に表す「示すなら」とした。
- source_word: τοῖς ἀδελφοῖς
  choice: 兄弟たち
  rationale: 男性複数形を明示的に保った。文脈上は女性を含む信者共同体全体を指し得るため、その点を脚注に記した。
- source_word: καλὸς
  choice: 良い
  rationale: 奉仕者としての望ましいあり方を端的に表し、現代日本語として明瞭である。
- source_word: διάκονος
  choice: 奉仕者
  rationale: この箇所では教会職としての「執事」と断定せず、仕える者という機能的意味を表した。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシア・イエス
  rationale: Χριστόςの称号としての意味を訳出し、固有名イエスは慣用表記とした。伝統的な「キリスト・イエス」は脚注に示した。
- source_word: ἐντρεφόμενος
  choice: 養われている
  rationale: 信仰のことばと良い教えによって継続的に形成されている受動的・継続的な意味を保った。
- source_word: τοῖς λόγοις
  choice: ことばによって
  rationale: 与格を養いの手段として表し、λόγοιςを抽象的な「教理」に置き換えず「ことば」とした。
- source_word: τῆς πίστεως
  choice: 信仰の
  rationale: 定冠詞を伴い、共有されたキリスト者の信仰内容を指す可能性が高いが、日本語の「信仰のことば」によって解釈の幅を残した。
- source_word: τῆς καλῆς διδασκαλίας
  choice: 良い教え
  rationale: καλῆςを「良い」、διδασκαλίαςを一般読者に明瞭な「教え」とし、「健全な」など原文にない評価語を加えなかった。
- source_word: ᾗ παρηκολούθηκας
  choice: あなたが従ってきた
  rationale: 関係代名詞は最も近い「良い教え」を受ける形で訳し、動詞の継続的に注意深く従う意味を自然な日本語で表した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: この語の称号としての意味を明示するため「メシア」とした。ただし、日本語の伝統的な表記も正当な代案として脚注に残した。
- issue: τοῖς ἀδελφοῖςの指示範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信者たち
  rationale: 原文の男性複数形を本文で保持しつつ、初期キリスト教の用法では男女を含む共同体全体を指し得ることを脚注で説明した。
- issue: τῆς πίστεωςにおけるπίστιςの意味
  choice: 信仰
  alternative: 信仰についてのことば／信仰の教え
  rationale: ここでは「良い教え」と並び、共有された信仰内容を指す可能性が高い。ただし、主観的な信仰との響きを排除しない表現を本文に採った。
translation_notes:
  register: 明瞭で落ち着いた現代標準日本語を用いた。「養われている」を連体修飾として保つことで、二つの分詞の関係を過度に因果化せず、テモテの継続的形成という含みを残した。
