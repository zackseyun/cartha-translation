  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: ja
  text: しかし、神聖さを欠く、年老いた女のような作り話[a]は退けなさい。そして、神を敬う生き方を目指して自分を鍛えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「年老いた女に特有の作り話」。当時の軽蔑的な言い回しであり、「老女の作り話」または「老女の語るたわいない話」とも訳せる。
    reason: γραώδεις μύθουςにある、年齢と性別に結び付いた軽蔑的表現、および慣用的な訳し方を説明するため。
lexical_decisions:
- source_word: βεβήλους
  choice: 神聖さを欠く
  rationale: 聖なるものと対照される、世俗的で神聖でない性質を表す。単に「不敬虔な」として後半のεὐσέβειαと同語的にするより、原語の聖・俗の対照を保った。
- source_word: γραώδεις
  choice: 年寄り女じみた
  rationale: 原語は文字どおりには「年老いた女に特有の」という軽蔑的な形容である。その文化的に際立つ厳しい表現を本文に残し、脚注で説明した。
- source_word: μύθους
  choice: 作り話
  rationale: ここでは、根拠のない創作的・思弁的な話を指す。「神話」は日本語では古代の宗教的物語を強く連想させるため避けた。
- source_word: παραιτοῦ
  choice: 退けなさい
  rationale: 関わることを拒み、受け入れないようにとの命令を、簡潔で品位ある日本語で表した。
- source_word: γύμναζε
  choice: 鍛えなさい
  rationale: 運動競技の訓練を想起させる比喩を保ち、継続的に自らを訓練する意味を自然に示した。
- source_word: σεαυτόν
  choice: 自分を
  rationale: テモテ自身が訓練の対象であることを、再帰表現として直接示した。
- source_word: πρὸς εὐσέβειαν
  choice: 神を敬う生き方を目指して
  rationale: πρόςの目標・方向性と、εὐσέβειαが表す神への畏敬に根差した生活を、一般の読者にも明瞭に伝える。
- source_word: δὲ … δὲ
  choice: しかし…むしろ
  rationale: 第一のδὲによる前文との対照と、第二のδὲによる否定命令から肯定命令への転換を自然な日本語で示した。
theological_decisions:
- issue: γραώδεις μύθουςの軽蔑的表現
  choice: 「年寄り女じみた作り話」として、性別と年齢に結び付いた原文の厳しい比喩を本文に残す。
  alternative: 「くだらない作り話」「老女の語る作り話」
  rationale: 「くだらない」では原語特有の文化的・修辞的な鋭さが消える。一方、「老女の語る」は、その話の実際の語り手が老女であると断定しかねない。「年寄り女じみた」は、話の性質を軽蔑的に形容する原語の曖昧さを比較的よく保つ。
- issue: εὐσέβειαの意味範囲
  choice: 「神を敬う生き方」とし、内面の畏敬とそれに基づく生活の双方を含ませる。
  alternative: 「敬虔」「信心」
  rationale: 「敬虔」は正確だが一般読者にはやや抽象的であり、「信心」は宗教的熱心さに狭く受け取られうる。文脈上、神に向けられた態度と実際の生活を含む表現を選んだ。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、命令文には「退けなさい」「鍛えなさい」という簡潔で dignified な調子を採用した。原文の対照構造を「しかし」「むしろ」で示し、運動訓練の比喩を保持した。
