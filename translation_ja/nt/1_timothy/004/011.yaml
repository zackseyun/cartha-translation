  yaml_path: translation/nt/1_timothy/004/011.yaml
  text: Command these things and teach them[a].
translation:
  language: ja
  text: これらのことを命じ[a]、教えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらのことを指示し、教えなさい。」
    reason: παράγγελλε は、文脈により「命じる」のほか「指示する」とも訳せる。
lexical_decisions:
- source_word: Παράγγελλε
  choice: 命じ
  rationale: 現在能動命令法二人称単数であり、継続的に権威をもって指示することを求める。「命じる」は、単なる助言より強い παραγγέλλω の指示的な力を保つ。
- source_word: ταῦτα
  choice: これらのことを
  rationale: 中性複数の指示代名詞で、直前までに述べられた教えや指示を受ける。日本語でも複数的・包括的な指示を自然に表す。
- source_word: καὶ
  choice: 、
  rationale: 二つの命令を結ぶ単純な等位接続。日本語では読点で自然に並列させ、両方の命令の密接なつながりを示す。
- source_word: δίδασκε
  choice: 教え続けなさい
  rationale: 現在能動命令法二人称単数の継続的な働きを明確に表す。目的語は ταῦτα から共有されるため、日本語では繰り返さず自然に訳した。
theological_decisions:
- issue: 命令形 παραγγέλλω が示す牧会的権威
  choice: 「命じ」として権威的な力を保つ
  alternative: 「言い聞かせ」「指示し」など、より穏やかに訳す
  rationale: 本文はテモテに二つの命令を与え、その第一は指示・命令の力を持つ。教会職制について本文以上の主張を加えず、語そのものの強さを反映した。
translation_notes:
  register: 明快で現代的かつ品位ある命令表現とした。「教え続けなさい」により現在命令形の継続性を示しつつ、「命じる」の権威的な響きを過度に弱めない。脚注記号 [a] は本文中に配置した。
