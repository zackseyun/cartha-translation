id: 1TI.4.14
reference: 1 Timothy 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: ja
  text: あなたの内にある賜物をおろそかにしてはいけません。それは、預言を通して、長老団が手を置くこととともに、あなたに与えられたものです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「長老団の手を置くこととともに」。ここでの「長老団」は、個々の長老ではなく、長老たちの集団を指します。
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: 軽んじてはなりません
  rationale: 継続的に顧みず放置することを禁じる表現。現代日本語として明瞭であり、「無視する」ほど意図的な拒絶には限定しない。
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: あなたの内にある賜物
  rationale: ἐν σοὶ の位置表現を保ち、単なる「あなたの賜物」へ平板化しない。「賜物」は恵みによって与えられたものという χάρισμα の含意を簡潔に伝える。
- source_word: ἐδόθη σοι
  choice: 与えられた
  rationale: 神的受動態の可能性を残しつつ、本文が明示しない与え手を補わない。日本語では受領者が文脈上明らかなため「あなたに」の重複を避けた。
- source_word: διὰ προφητείας
  choice: 預言を通して
  rationale: 属格を伴う διά の手段・媒介の意味を保持する。預言が授与に伴っただけなのか、媒介したのかを過度に限定しない。
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: 手を置いた際
  rationale: 按手の行為を自然な現代日本語で表す。μετά が示す付随関係を「際」によって表し、預言との関係を同一視しない。
- source_word: τοῦ πρεσβυτερίου
  choice: 長老たち
  rationale: 単独の長老ではなく長老の集団を指すことを明瞭にし、後代の教派制度を連想させる専門語を避ける。手を置いた主体として自然な日本語にした。
theological_decisions:
- issue: χάρισμα に霊的・職務的な限定を明示するか
  choice: 賜物
  alternative: 霊の賜物／奉仕の賜物
  rationale: 文脈上は奉仕のための賜物である可能性が高いが、原文には「霊的」「奉仕の」という限定語がないため補わない。
- issue: διὰ προφητείας が授与の媒介か、授与に伴う預言か
  choice: 預言を通して
  alternative: 預言の言葉によって／預言とともに
  rationale: 手段・媒介を自然に示しながら、預言の具体的な働きを断定しすぎない表現を選んだ。
- issue: πρεσβυτέριον を後代の教会制度用語で表すか
  choice: 長老たち
  alternative: 長老会／長老団
  rationale: 集合体であることを示しつつ、特定教派の統治制度を本文に持ち込まない。
- issue: 按手と賜物授与の因果関係
  choice: 長老たちが手を置いた際
  alternative: 長老たちの按手によって
  rationale: 原文は預言に διά、按手に μετά を用いる。両者を同じ意味の手段として訳さず、按手については付随・同時性の余地を保った。
translation_notes:
  register: 丁寧体の勧告として、現代の一般読者に理解しやすく、礼節と格調を保つ表現を採用した。「按手」は本文では避け、脚注で原文の構造を示した。
