id: 1TI.4.1
reference: 1 Timothy 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: ja
  text: 聖霊ははっきりとこう語っています。後の時代には、ある人たちが信仰から離れ[a]、人を惑わす霊[b]と悪霊の教えに心を向けるようになる、と。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰を捨て」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「欺く霊」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: 御霊
  rationale: 定冠詞を伴い、預言的に語る主体として示されているため、文脈上は聖霊を指すと判断した。「御霊」はこの指示対象を自然かつ簡潔に表す。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの内容から警告へ移る軽い対照・転換を表す。強すぎる逆接にならないよう、読点を伴う自然な接続とした。
- source_word: ῥητῶς
  choice: はっきりと
  rationale: 明示的に、疑いなく語るという副詞の力を、一般読者に明快な現代日本語で表した。
- source_word: λέγει
  choice: 語っています
  rationale: ギリシア語の現在形を保ち、御霊が現に告げているという語感を自然な日本語で示した。
- source_word: ἐν ὑστέροις καιροῖς
  choice: 後の時代になると
  rationale: 著者の時点より後の時期を指し、終末の最終局面だけに限定しない表現とした。
- source_word: ἀποστήσονταί
  choice: 離れ
  rationale: 離脱・背反を表す動詞の比喩を保ちつつ、特定の背教論を訳文に持ち込まない簡潔な表現とした。
- source_word: τινες
  choice: ある人たちは
  rationale: 不定複数を自然な現代日本語で表した。
- source_word: τῆς πίστεως
  choice: 信仰
  rationale: 定冠詞と教えをめぐる文脈から、個々の信頼行為よりも共有されるキリスト教信仰を主に指す。ただし日本語では過度に説明的な「信仰内容」とせず、原語の意味の幅を残した。
- source_word: προσέχοντες
  choice: 心を向けるようになる
  rationale: 注意を払い、従い、深く関与する含みを自然な日本語で表した。分詞が信仰から離れる際の行動または事情を示す構造も保った。
- source_word: πνεύμασι πλάνοις
  choice: 人を惑わす霊
  rationale: πλάνοςの能動的な意味、すなわち人を迷わせ欺く性質を明確に伝える。
- source_word: διδασκαλίαις δαιμονίων
  choice: 悪霊どもの教え
  rationale: 属格を説明しすぎず、悪霊を源または担い手とする教えという関係を保った。「教理」より一般的で分かりやすい「教え」を用いた。
theological_decisions:
- issue: 「御霊」の指示対象
  choice: 聖霊
  alternative: 預言を語る霊、または人間の霊
  rationale: 定冠詞、語る主体、牧会書簡の預言的文脈から聖霊が最も自然である。ただし、啓示がどのような方法で与えられたかは本文以上に特定しない。
- issue: 「信仰」の意味
  choice: 共有されるキリスト教信仰
  alternative: 個人的な信頼、または忠実さ
  rationale: 定冠詞と偽りの教えに関する文脈は、信じる内容としての信仰を支持する。ただし、救済論上の結論や特定教派の背教理解までは訳文に加えない。
- issue: 分詞 προσέχοντες と主動詞の関係
  choice: 信仰から離れる者たちの行動・事情を示す
  alternative: 離れることの明確な原因のみを示す
  rationale: 分詞は付随状況にも原因にも読めるため、「心を向けるようになる」と並置し、因果関係を過度に限定しなかった。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「御霊」は聖霊を指す伝統的かつ理解可能な表現とし、その他は教会内の専門語に偏らない語彙を選んだ。原文の一文構造は、日本語で理解しやすいよう引用内容を「こう語っています」と先に示し、末尾の「と」で閉じた。
