source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Βοῦν ἀλοῶντα οὐ φιμώσεις, καί· Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: ja
  text: というのも、聖書はこう言っています。[a]「脱穀している牛に口籠（くつこ）をかけてはならない。」また、[b]「働く者は自分の賃金を受けるに値する。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「脱穀している」は、穀物を踏んで脱穀する作業を指す。
    reason: ἀλοῶνταが指す古代の脱穀作業の具体的な含意を明らかにするため。
  - marker: b
    text: 別訳「働く者は自分の報酬を受けるにふさわしい。」
    reason: ἄξιοςとμισθόςの別の自然な訳し方を示すため。
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: 聖書はこう言っているからです
  rationale: γάρの直前との理由・根拠のつながりを「からです」で示し、ἡ γραφήを権威ある聖書の言葉として「聖書」と訳した。現在形λέγειは、今も語る聖書の証言として「言っている」とした。
- source_word: Βοῦν ἀλοῶντα
  choice: 穀物を踏みこなしている牛
  rationale: βοῦςは農作業に用いる牛、ἀλοάωは脱穀することを指す。古代の作業の実態が分かるよう「穀物を踏みこなす」と明示した。
- source_word: οὐ φιμώσεις
  choice: 口籠をかけてはならない
  rationale: φιμόωの具体的意味を自然な日本語の「口籠をかける」で表し、未来形の禁止用法を格調ある規定表現「てはならない」で訳した。
- source_word: καί
  choice: また
  rationale: 二つ目の引用を並列的に導く接続語として、現代日本語で自然な「また」を用いた。
- source_word: Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: 働く者が報酬を受けるのは当然である
  rationale: ἄξιος＋属格が表す、働き手が賃金に値するという意味を自然な日本語で示した。μισθόςは文脈上、労働に対する対価であり、「報酬」とした。単数男性形は日本語では性を付加せず、総称的な単数「働く者」で保持した。
theological_decisions:
- issue: γραφήの範囲と二つの引用の位置づけ
  choice: 二つの引用をともに「聖書はこう言っている」のもとに置く
  alternative: 最初の引用だけを聖書とし、二つ目をことわざ、または主イエスの言葉として区別する
  rationale: ギリシア語本文は一つの導入句の後にκαίで二つの言葉を並べている。翻訳ではその構造を保ち、正典上の詳細な含意を決めつけない。
- issue: αὐτοῦの性と数
  choice: 日本語で総称的な単数「働く者」とし、所有代名詞を明示しない
  alternative: 「彼の報酬」または複数の「働く人々の報酬」とする
  rationale: 原文は単数男性だが、日本語では「その人の」を補わなくても、報酬が働く者に帰属することを構文で明確に表せる。複数化は避け、原文の総称的単数を保った。
- issue: ἄξιοςの表現
  choice: 報酬を受けるのは当然である
  alternative: 自分の報酬にふさわしい／報酬を受ける価値がある
  rationale: 働きに対する正当な対価という文脈を明確にしつつ、道徳的価値や功績についての教理的主張へ狭めないため、「当然である」と訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部分は聖書の規定と格言にふさわしい端正な文体とした。「口籠」「踏みこなす」は農作業の具体像を保ちながら、文脈から理解できる表現である。
