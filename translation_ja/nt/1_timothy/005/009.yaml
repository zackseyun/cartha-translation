  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: ja
  text: やもめを名簿に載せるのは、六十歳以上で、一人の夫の妻であった人[a]に限りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「一人の男に属する女」という慣用的な表現。夫に忠実であったことやその評判を指すとも、「一度しか結婚したことがない」という意味だとも理解される。
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: やもめ
  rationale: 夫を亡くした女性を指す標準的な語義。文脈では、教会が正式に認定して名簿に載せる対象である。
- source_word: καταλεγέσθω
  choice: 名簿に載せる
  rationale: 公的な一覧に登録するという事務的意味を明確に表し、単に「数える」「認める」とはしない。
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: 六十歳以上で
  rationale: 直訳的には「六十年に満たない者ではなく、その年齢に達している」であり、最低年齢の条件を自然な現代日本語で示す。
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: 一人の夫の妻であった人
  rationale: ギリシア語の語順と慣用表現を比較的よく保ち、結婚歴が一度だけという意味か、夫への忠実さを表すのかを本文で一方に限定しない。文脈上やもめであるため「であった」とした。
theological_decisions:
- issue: ἑνὸς ἀνδρὸς γυνή の意味
  choice: 本文では「一人の夫の妻であった人」とし、原文の慣用表現と曖昧さを保つ。
  alternative: 「一度しか結婚したことのない人」または「夫に忠実であった人」
  rationale: この表現が結婚回数を条件とするのか、結婚生活における忠実さや評判を述べるのかは原文だけでは確定しないため、特定の教派的解釈に絞らず、主要な理解を脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「名簿に載せる」で制度的な登録を示し、「人に限りなさい」で条件規定として自然に読める形にした。
