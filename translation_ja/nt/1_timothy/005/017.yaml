revisions:
- from: よく指導している長老たちは、二重の敬意を受けるにふさわしい者とされなさい[a]。特に、みことばと教えのために労苦している人たちはそうです[b][c]。
  to: よく指導している長老たちは、二重の敬意[a]にふさわしい者と認めなさい。とりわけ[b]、語ることと教えることにおいて[c]労苦している人たちは、そう認めなさい。
  rationale: 共同体に対する命令として ἀξιούσθωσαν を明瞭にし、λόγος を「みことば」と限定したり「〜のために」と目的化したりせず、原文の表現上の幅を保った。「とりわけ」は本文に維持し、同格的に取る可能性は脚注にとどめた。脚注アンカーもそれぞれの説明対象へ移動した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:02:55Z'
review_pass:
  verdict: revise
  source_fidelity: 本文の主要な語句の対応は概ね適切です。しかし、ἀξιούσθωσαν は共同体に向けた受動命令であり、現行の「受けるにふさわしい者とされなさい」は長老たち自身への命令のように読めます。また、ἐν λόγῳ を「みことばのために」とする訳は、無冠詞の λόγῳ にない「神のことば」という特定化と、「〜のために」という目的の意味を加えています。
  naturalness: 「二重の敬意にふさわしい者と認めなさい」は、命令の宛先を自然に共同体へ向け、現代標準日本語として明瞭です。「語ることと教えることに労苦している」は、原文の並列を保ちながら不自然な直訳を避けています。
  terminology: πρεσβύτεροι を「長老たち」、καλῶς προεστῶτες を「よく指導している」、διπλῆς τιμῆς を「二重の敬意」、κοπιῶντες を「労苦している」とすることは妥当です。「みことば」はこの箇所の λόγος を神の啓示語へ狭めうるため用いません。
  issues:
  - severity: high
    issue: 受動命令の日本語上の主語・宛先が不適切
    rationale: 「長老たちは…者とされなさい」は、長老たちが「されなさい」と命じられているように読めます。ギリシア語は、長老たちを「ふさわしいと認める」よう共同体に求めています。
  - severity: medium
    issue: ἐν λόγῳ の過度な特定化と格関係の変更
    rationale: 「みことば」は λόγος を神のことばへ限定しうるうえ、「みことばのために」は ἐν（〜において）の表現を目的へ変更します。原文の幅を保つには「語ることと教えることにおいて」が安全です。
  - severity: low
    issue: 脚注b・cのアンカー位置が説明対象に対応していない
    rationale: bは「特に」、cは「語ることと教えること」に付すことで、各注の対象が明確になります。
  revised_text: よく指導している長老たちは、二重の敬意[a]にふさわしい者と認めなさい。とりわけ[b]、語ることと教えることにおいて[c]労苦している人たちは、そう認めなさい。
