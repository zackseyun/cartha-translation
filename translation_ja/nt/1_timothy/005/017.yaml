id: 1TI.5.17
reference: 1 Timothy 5:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: ja
  text: よく指導している長老たちは、二重の敬意[a]にふさわしい者と認めなさい。とりわけ[b]、語ることと教えることにおいて[c]労苦している人たちは、そう認めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二重の敬意」は、尊敬と物質的な支援の両方を含む可能性がある。特に次節は、働く者への報いに触れている。
    reason: lexical_alternative
  - marker: b
    text: 「とりわけ」は、「すなわち」と理解され、ここで言う長老たちを、語ることと教えることに労苦する人々として説明していると見ることもできる。
    reason: alternative_reading
  - marker: c
    text: 「語ることと教えること」は、説教や指導など、言葉を用いる奉仕を指すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: 長老たち
  rationale: 牧会書簡では、単に年長の男性ではなく、教会で認められた指導者を指す。「長老」は後代の制度を過度に持ち込まず、日本語聖書で理解されやすい。
- source_word: καλῶς προεστῶτες
  choice: よく指導している
  rationale: προΐστημι が表す指導・監督の働きを自然な現代日本語で示し、「支配する」ほど強い含意を避ける。
- source_word: διπλῆς τιμῆς
  choice: 二重の敬意
  rationale: 直訳的な表現を保ち、尊敬と物質的支援の双方を含み得る文脈上の幅を残す。
- source_word: ἀξιούσθωσαν
  choice: 受けるにふさわしい者とされなさい
  rationale: 共同体がその価値を認めるよう求める受動命令の意味を保つ。
- source_word: μάλιστα
  choice: 特に
  rationale: ある人々をとりわけ強調する通常の意味を示し、「すなわち」と断定して解釈を狭めない。
- source_word: κοπιῶντες
  choice: 労苦している
  rationale: κοπιάω の、骨を折って懸命に働く意味を、品位ある自然な表現で伝える。
- source_word: ἐν λόγῳ
  choice: みことばのために
  rationale: 言葉を用いる宣教・説教の務めを示唆しつつ、「説教」と限定しすぎない。「みことば」は教会的文脈での λόγος を明瞭に伝えるが、原文には定冠詞がないため脚注で幅を示す。
- source_word: διδασκαλίᾳ
  choice: 教え
  rationale: 専門用語的な「教理」より広く、現代の読者にも明快で、教える働きを自然に表す。
theological_decisions:
- issue: 「二重の敬意」の範囲
  choice: 本文では「二重の敬意」とし、尊敬だけにも報酬だけにも限定しない。
  alternative: 格別の尊敬／二倍の報酬／物質的支援を含む敬意
  rationale: 直後の5章18節は物質的支援を示唆する一方、τιμή は尊重・尊敬も表し得るため、原文の意味の幅を保つ。
- issue: μάλιστα の働き
  choice: 「特に」と訳す。
  alternative: 「すなわち」
  rationale: 長老一般の中で、ことばと教えに労する人々を特に強調する読みを保ちつつ、両者が完全に同一だと断定しない。
- issue: ἐν λόγῳ の解釈
  choice: 本文では「みことばのために」とし、脚注で言語による奉仕の可能性を説明する。
  alternative: 説教において／語ることにおいて
  rationale: 宣教や説教を含む可能性が高いが、原文の λόγος が持つ広がりを不必要に狭めない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「長老」「みことば」は一般の日本語教会読者に通じる語として用い、命令形の厳しさは受動命令を反映する「ふさわしい者とされなさい」で保持した。脚注記号は該当箇所にすべて掲げた。
