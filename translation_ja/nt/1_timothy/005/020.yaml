source:
  edition: SBLGNT
  text: ⸀τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: ja
  text: 罪を犯している人たちを[a][b]、皆の前で戒めなさい。ほかの人たちも恐れを抱くようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪を犯し続けている人たち」。現在分詞は、罪深い行いが続いていることを示唆する場合がある。
    reason: lexical_alternative
  - marker: b
    text: 直前の文脈からは、特に罪を犯している長老たちを指す可能性がある。ただし、この節自体には「長老」とは記されていない。
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: 罪を犯している人たち
  rationale: 実体詞的な現在分詞を自然な現代日本語で表した。現在相は継続的な行為を示唆し得るが、「罪を犯し続けている」とすると解釈をやや強めるため、本文では限定しない。
- source_word: ἐνώπιον πάντων
  choice: 皆の前で
  rationale: 「すべての人の前で」という公の場を示す表現を、簡潔で自然な日本語にした。「公に」より原文の句形を保っている。
- source_word: ἔλεγχε
  choice: 戒めなさい
  rationale: ἐλέγχωは暴露する、罪を明らかにする、叱責する、戒めるという意味域を持つ。この懲戒的文脈では、誤りを指摘して正すことを表す「戒める」が、現代日本語として自然で dignified な表現である。
- source_word: οἱ λοιποὶ
  choice: ほかの人たち
  rationale: 違反者以外の残りの人々を指す。日本語では「残りの者たち」より自然で明瞭である。
- source_word: φόβον ἔχωσιν
  choice: 恐れを抱くようになります
  rationale: 直訳的な「恐れを持つ」を自然な日本語にした。畏敬か処罰への恐怖かを本文で限定せず、φόβοςの幅を保った。
theological_decisions:
- issue: 罪を犯している者たちの範囲
  choice: 本文では「罪を犯している人たち」とし、長老に限定しない。
  alternative: 直前の5章19節とのつながりから、特に罪を犯している長老たちを指すと理解する。
  rationale: この節自体には「長老」という語がなく、τοὺς ἁμαρτάνονταςとだけある。一方、直前は長老への訴えを扱うため、文脈上の限定の可能性を注で示し、本文には補わない。
- issue: 恐れの性質
  choice: 単に「恐れ」とし、その性質を限定しない。
  alternative: 健全な畏れ、または懲戒を受けることへの恐れと明示する。
  rationale: φόβονはこの文脈で抑止となる恐れを示すが、畏敬と恐怖のどちらかに訳文で固定するだけの明示的根拠はない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを保った。「叱責する」よりも、誤りを指摘して正す含意を持つ「戒める」を選択した。脚注記号は対応する句の直後に置いた。
