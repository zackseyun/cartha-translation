  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: ja
  text: しかし、本当の意味でやもめで、独り残されている人は[a]、神に望みを置いており[b]、夜も昼も願いと祈りを続けています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「独りでいる人」とも訳せる。ギリシア語の完了分詞は、独り残された状態を表している。
    reason: lexical_alternative
  - marker: b
    text: 「神に望みを置いてきた」とも訳せる。ギリシア語の完了形は、神に定めた望みが今も続いていることを示しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前節との展開を受けつつ、対照を示す接続として自然に表した。単なる時間的な「さて」は原文にないため用いない。
- source_word: ὄντως χήρα
  choice: 本当の意味でやもめであり
  rationale: ὄντωςが、単なる社会的呼称ではなく、文脈上の条件にかなうやもめを指すことを示す。
- source_word: μεμονωμένη
  choice: 独り残された人
  rationale: 完了分詞が表す、支える家族などを失って独りである結果状態を簡潔に表す。
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: 神に望みを置き
  rationale: 完了形が示しうる、神に望みを定め、その状態が続いている意味を自然な日本語で表す。
- source_word: προσμένει
  choice: 続けています
  rationale: 願いと祈りに持続している現在の姿を、過度に強めず表す。
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: 願いと祈り
  rationale: 具体的な嘆願を指すδέησιςと、より一般的な祈りを指すπροσευχήの二語を区別して残す。
- source_word: νυκτὸς καὶ ἡμέρας
  choice: 夜も昼も
  rationale: 原語の語順を保ち、継続的な実践を表す自然な日本語の慣用表現とした。
theological_decisions:
- issue: 「本当の意味でやもめ」の性格づけ
  choice: 支えを失い、神への望みと絶えざる祈りによって特徴づけられる、文脈上の真正なやもめとして訳す。
  alternative: 一般のやもめ全体についての記述と理解する。
  rationale: ὄντωςと周辺文脈は、教会の配慮に関わる特定の範疇を示す。ただし、後代の教派的制度や資格要件は訳文に持ち込まない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、牧会書簡にふさわしい落ち着いた文体とした。「やもめ」は聖書語として通用するが、文全体を現代的な構文にして古めかしさを抑えた。
