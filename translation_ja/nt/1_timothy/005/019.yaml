base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: ja
  text: 長老[a]に対する告発を、二人または三人の証人[b]の証言による裏づけがない限り、受理してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「年長の男性」。πρεσβύτεροςを教会の職務としての「長老」ではなく、年齢を表す意味に取る場合。
    reason: alternative_reading
  - marker: b
    text: この表現は、事柄が「二人または三人の証人」によって確証されるという旧約聖書の法的原則を反映している（申命記19章15節参照）。
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: 長老に対する
  rationale: πρεσβύτεροςには年長者と教会の長老の両義があるが、直前の17節を含む文脈では教会の指導者を指す可能性が高い。「に対する」はκατάの対立的・告発的関係を自然に表す。
- source_word: κατηγορίαν
  choice: 訴え
  rationale: 正式な告発・ आरोप आरोप accusation を指す語であり、「訴え」は現代日本語で司法的な含みを保ちつつ明瞭である。
- source_word: μὴ παραδέχου
  choice: 受理してはならない
  rationale: 単に内容を真実と認めないというより、申し立てを正式に取り上げることを禁じる手続き上の意味を表す。
- source_word: ἐκτὸς εἰ μὴ
  choice: ものでなければ
  rationale: 例外条件を日本語として自然に示し、二人または三人の証人という要件に結び付ける。
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: 二人または三人の証人に基づく
  rationale: ἐπίの証拠的根拠を明示し、申命記19章15節を反映する法的表現を保つ。「証言」と限定せず、原文の「証人」を訳出した。
theological_decisions:
- issue: πρεσβυτέρουが教会職としての長老か、年長の男性か
  choice: 教会の指導者としての「長老」
  alternative: 「年長の男性」
  rationale: 直前の1テモテ5章17節で長老が教会を治め、教える者として扱われているため、ここでも職務上の長老を指す可能性が高い。ただし語そのものの年齢的意味も真正な可能性として脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「受理する」によって、告発をうのみにすることではなく、正式な案件として取り上げる手続き的意味を示した。すべての脚注記号を本文中に配置した。
