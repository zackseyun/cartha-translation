  text: And command these things[b][a], so that they may be above reproach.
translation:
  language: ja
  text: また、これらのことを命じなさい[a]。非難の余地がないように[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「教えなさい」または「指示しなさい」とも訳せる。原語には権威をもって命じる意味合いがある。
    reason: lexical_alternative
  - marker: b
    text: 「非難の余地がないように」の主語は、ギリシア語では明示されていない。文脈上は、直前の指示を受ける人々、特にやもめとその家族を指す可能性が高い。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前節からのつながりを自然に示しつつ、原文にない強調を加えない接続表現。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前および周辺の指示を受ける中性複数の指示代名詞を、解釈を狭めずに表す。
- source_word: παράγγελλε
  choice: 命じなさい
  rationale: 現在命令形が持つ継続的で権威ある指示の力を保つ。「教えなさい」より強い語感である。
- source_word: ἵνα
  choice: それは、…ためです
  rationale: 目的を示す節であることを、明瞭で自然な現代日本語にする。
- source_word: ἀνεπίλημπτοι
  choice: 非難されるところのない者
  rationale: 正当な非難や批判を受ける余地がないという倫理的意味を表し、絶対的な無罪性を示唆し得る表現を避ける。
- source_word: ὦσιν
  choice: となる
  rationale: ἵναに続く現在接続法を目的表現の中で自然に示す。複数の主語は日本語でも明示せず、原文の曖昧さを保つ。
theological_decisions:
- issue: 「非難されるところのない者となる」の暗黙の複数主語が誰を指すか
  choice: 本文では主語を明示しない
  alternative: 直前の文脈にいるやもめとその家族を明示する、またはテモテや教会共同体を明示する
  rationale: ギリシア語では複数主語が省略されている。文脈上は直前の指示を受ける人々、とりわけやもめとその家族が有力だが、本文自体は対象を言い直していないため、限定せず曖昧さを保つ。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「命じなさい」で使徒的指示の権威性を保ち、後半では日本語で自然に主語を省略することで原文の指示対象の曖昧さを保持した。
