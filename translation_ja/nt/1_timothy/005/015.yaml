  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: ja
  text: すでに何人かは、サタンに従って[a]道をそれたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「サタンの後に」、または「サタンの後ろに」。すなわち、「サタンの後について道をそれた」。
    reason: ὀπίσωは字義的には「後に、後ろに」を意味し、ここではサタンへの追従という比喩的な方向を示す。
lexical_decisions:
- source_word: ἤδη
  choice: すでに
  rationale: 現時点までに離反が実際に起きたという時間的意味を、自然で簡潔な日本語で表す。
- source_word: γάρ
  choice: からです
  rationale: 直前の勧めの理由を示す接続辞なので、日本語では文末の理由表現として自然に訳す。
- source_word: τινες
  choice: 何人か
  rationale: 特定されていない複数の人を指すことを明確かつ自然に表す。
- source_word: ἐξετράπησαν
  choice: 道をそれ
  rationale: 正しい道筋から外れるという語の比喩を保ち、受動的に『迷わされた』という原文にない因果関係を加えない。
- source_word: ὀπίσω τοῦ Σατανᾶ
  choice: サタンに従ってしまった
  rationale: 字義的には『サタンの後に／後ろに』だが、人を後について行くという慣用的意味を、現代日本語で明瞭に表す。『しまった』は、すでに生じた重大な離反という完了的・文脈的含意を自然に伝える。
- source_word: Σατανᾶ
  choice: サタン
  rationale: 新約聖書の固有名・称号として定着している標準的な音写を用いる。
theological_decisions:
- issue: ὀπίσω τοῦ Σατανᾶを字義的に『サタンの後に』とするか、意味を明示して『サタンに従う』とするか。
  choice: サタンに従ってしまった
  alternative: サタンの後について行ってしまった／サタンの後ろへそれて行った
  rationale: この句が示す追従・帰属の深刻さを自然な現代日本語で明確にしつつ、字義的な方向性は脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準語。単独節としても直前の文への理由づけが分かるよう、γάρを文末の「からです」で表した。
