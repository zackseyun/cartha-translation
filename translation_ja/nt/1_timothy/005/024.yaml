id: 1TI.5.24
reference: 1 Timothy 5:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: ja
  text: ある人たちの罪は明らかで[a]、その人たちに先立って裁きへと進みます[b]。しかし、別の人たちの場合、罪は後からついて来ます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「明白です」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここでの「裁き」は、文脈上は現在行われる審査や評価を指す可能性があるが、神の裁きという、より広い意味にも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων
  choice: ある人たちの
  rationale: ἄνθρωποςはここでは一般に人を指すため、性別を限定せず、属格が「罪」を修飾する構造を自然な日本語で表した。
- source_word: αἱ ἁμαρτίαι
  choice: 罪
  rationale: 特定の人々に属する複数の罪を指す。日本語では文脈上、無理に複数形を明示せず「罪」とするのが自然である。
- source_word: πρόδηλοί
  choice: 明らかで
  rationale: 隠れておらず、はっきり見て取れるという意味を、現代日本語で簡潔に表した。
- source_word: προάγουσαι εἰς κρίσιν
  choice: その人たちに先立って裁きへと進みます
  rationale: 「罪」が人に先行して裁きへ向かうという擬人化された比喩と、εἰςの方向性を保った。目的語に当たる人々はギリシア語では文脈上暗示されているため、日本語では明示した。
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: しかし、別の人たちの場合、罪は後からついて来ます
  rationale: 前半との対照を明確にしつつ、罪が後に従うという擬人化を保った。日本語で主語が曖昧にならないよう「罪」を補った。
theological_decisions:
- issue: κρίσις（裁き）の範囲
  choice: 「裁き」とだけ訳し、何の裁きかを本文で限定しない。
  alternative: 直近の文脈における教会内の審査・評価、または究極的な神の裁きと解する。
  rationale: 直近の文脈は人を見極めることに関係するが、語そのものはより広い神の裁きの意味も帯び得るため、解釈上の緊張を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前後する「罪」の擬人化を維持しつつ、日本語として主語と対照関係が分かるように補足した。
