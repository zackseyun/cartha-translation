  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: ja
  text: 同時にまた、彼女たちは怠けることを覚え、家々を訪ね歩きます。しかも、ただ怠け者であるだけでなく、むだ話をする者[a]、余計なことに首を突っ込む者[b]となり、言うべきでないことを口にします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「うわさ話をする者」とも訳せる。ギリシア語は、愚かで中身のない話を広く指すことがあるが、この文脈ではうわさ話も含むと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「他人のことに口出しする者」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: そのうえ
  rationale: 同時性を帯びつつ、前節の内容に加わる事柄を示す表現。ここでは日本語として自然な付加の接続を用いた。
- source_word: ἀργαὶ
  choice: 怠ける／怠ける者
  rationale: 単なる性格上の怠惰と断定するより、何もせずにいる状態・習慣を表す。二度の反復も保った。
- source_word: μανθάνουσιν
  choice: 覚え
  rationale: 正式に学ぶというより、習慣として身につける意味を文脈に即して表した。
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: 家々を歩き回ります
  rationale: 複数の家を次々に訪ね歩く動きを、簡潔で自然な日本語にした。
- source_word: φλύαροι
  choice: むだ話をする者
  rationale: φλύαροςは中身のない軽率な話をする者を広く指し、文脈上はうわさ話も含み得る。意味を狭めすぎない訳語を選んだ。
- source_word: περίεργοι
  choice: おせっかいな者
  rationale: 自分に関係のない事柄へ不適切に介入する意味を、現代日本語で分かりやすく表した。
- source_word: λαλοῦσαι τὰ μὴ δέοντα
  choice: 言うべきでないことを口にします
  rationale: δέονταの『ふさわしい、なすべき』という含意を保ち、問題が発言にあることを明示した。
theological_decisions:
- issue: 女性複数形の指示対象
  choice: 彼女たち
  alternative: この女たち／彼女たちを省略する
  rationale: ギリシア語の形は女性複数で、文脈上は若いやもめたちを指す。日本語でも性別と指示対象を明確に保った。
- issue: φλύαροιの意味範囲
  choice: むだ話をする者
  alternative: うわさ話をする者
  rationale: 語は愚かで中身のない話全般を表し得るため、うわさ話だけに限定せず、文脈上それを含み得る余地を脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、勧告文にふさわしい落ち着いた格調を保った。原文の女性複数、ἀργαὶの反復、φλύαροιとπερίεργοιの並列を維持した。
