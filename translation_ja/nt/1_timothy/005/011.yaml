  text: νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσιν τοῦ Χριστοῦ, γαμεῖν θέλουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/011.yaml
  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: ja
  text: しかし、若いやもめを名簿に入れることは断りなさい。彼女たちは、メシアに逆らって情欲に駆られると、結婚したいと願うからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「メシアに逆らって情欲に駆られる」。この表現の「メシアに逆らって」の関係は解釈が難しく、その欲望がメシアへの先の献身や誓約と衝突するという意味とも考えられます。
    reason: alternative_reading
lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: しかし、若いやもめを
  rationale: δὲの穏やかな対比を「しかし」で示し、比較級νεωτέραςは文脈上、年長のやもめとの対照として「若い」と自然に訳した。
- source_word: παραιτοῦ
  choice: 名簿に入れることは断りなさい
  rationale: 動詞自体は「断る、受け入れない」だが、直前の名簿登録の文脈を日本語で明確にした。人間関係そのものを拒絶せよという意味にはしない。
- source_word: καταστρηνιάσωσιν
  choice: 情欲に駆られる
  rationale: まれな動詞が表す、官能的・自己放縦的な欲望に支配される含意を、現代日本語で簡潔かつ品位を保って表した。
- source_word: τοῦ Χριστοῦ
  choice: メシアへの献身に逆らって
  rationale: 属格の関係には曖昧さがある。「メシアに逆らって」という直訳調を避けつつ、欲望がメシアへの先の献身または誓約と衝突する可能性を示した。
- source_word: γαμεῖν θέλουσιν
  choice: 結婚したいと思うようになる
  rationale: θέλωと不定詞による願望を自然な日本語で表現し、ὅτανに伴う状況の進展も示した。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここではΧριστόςが称号として機能しているため「メシア」とした。
- issue: καταστρηνιάσωσιν τοῦ Χριστοῦの意味
  choice: メシアへの献身に逆らって情欲に駆られる
  alternative: メシアに逆らって情欲に駆られる／情欲のためメシアから離れる
  rationale: 属格の厳密な関係を断定せず、問題が結婚そのものではなく、名簿登録に伴う先の献身との衝突にある可能性を保った。補足的な「献身」は文脈的説明なので脚注でも明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「やもめ」は聖書的な品位を保ちつつ一般にも理解可能。「名簿に入れる」は直前の文脈を補って、若いやもめ一般を拒絶する命令との誤解を避けた。
