id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: ja
  text: 私は、神とキリスト・イエスと、選ばれた天使たち[a]の前で、あなたに厳かに命じます。予断を持たず[b]、何事もえこひいきによって行うことなく[c]、これらのことを守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「選びの天使たち」。
    reason: lexical_alternative
  - marker: b
    text: または「前もって決めつけることなく」。
    reason: lexical_alternative
  - marker: c
    text: または「何事も一方に肩入れして行うことなく」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: あなたに厳かに命じます
  rationale: 単なる証言ではなく、神的な証人の前でなされる重い勧告・厳命を表すため。現代日本語として自然でありながら、原文の荘重さを保つ。
- source_word: ἐνώπιον
  choice: の前で
  rationale: 神、キリスト・イエス、天使たちを厳粛な証人として呼び出す表現を、簡潔で自然な日本語にした。
- source_word: Χριστοῦ Ἰησοῦ
  choice: キリスト・イエス
  rationale: 日本語で定着している聖書用語を用い、Χριστόςの称号としての含みも保つ。「メシアであるイエス」と説明的に限定しすぎない。
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: 選ばれた天使たち
  rationale: ἐκλεκτόςの基本義を明示しつつ、一般読者にも分かる現代語とした。選んだ主体や選びの目的は原文同様に補わない。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前までの指示を指すが、指示内容を訳文で過度に限定せず、指示語の広がりを保つ。
- source_word: φυλάξῃς
  choice: 守りなさい
  rationale: ここでは命令や指示を忠実に遵守する意味。「保ちなさい」より自然で、「見張りなさい」のような物理的意味を避ける。
- source_word: χωρὶς προκρίματος
  choice: 予断を持たず
  rationale: πρόκριμαの、事実を扱う前に判断してしまうことという語義を簡潔に表す。「偏見」と訳すと次のπρόσκλισιςとの区別が弱くなるため、「予断」とした。
- source_word: μηδὲν ποιῶν
  choice: 何事も…行うことなく
  rationale: 主命令に伴う分詞の禁止的な意味と、μηδένの包括性を自然な日本語で保つ。
- source_word: κατὰ πρόσκλισιν
  choice: えこひいきによって
  rationale: 一方に肩入れして扱いを偏らせる意味を、一般読者に明瞭な表現で示す。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: キリスト・イエス
  alternative: メシアであるイエス
  rationale: Χριστόςには「油注がれた者／メシア」という称号性がある一方、日本語では「キリスト・イエス」が定着した自然な形であり、ここで固有名か称号かを説明的に決め切らない。
- issue: 「選ばれた天使たち」の意味
  choice: 選ばれた天使たち
  alternative: 選びの天使たち
  rationale: 選ばれた主体、目的、他の天使との関係について本文は説明しないため、神学的な体系化を加えず形容のまま訳す。
- issue: πρόκριμαとπρόσκλισιςの区別
  choice: 「予断」と「えこひいき」を区別して訳す
  alternative: 両方を「偏見／偏り」に近い語で訳す
  rationale: 前者は事前の判断、後者は一方への肩入れを中心に表すと解し、並置された二語の緊張と相違を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「厳かに命じます」で原文の公的・荘重な調子を保った。後半は「予断」と「えこひいき」を分け、近接する二つの禁止を重複させずに示した。
