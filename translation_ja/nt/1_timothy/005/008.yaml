id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: ja
  text: しかし、自分の身内[a]、とりわけ家の者に必要な世話をしない人がいるなら、その人は信仰を否定した[b]のであり、信仰を持たない人よりも悪いのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分に属する人々」とも訳せます。「身内」は、同じ家に住む人だけでなく、親族なども含み得ます。続く「家の者」は、その中でも特に責任を負うべき人々を指します。
    reason: lexical_alternative
  - marker: b
    text: 「信仰を捨てた」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: 人がいるなら
  rationale: 不定代名詞の一般的な適用範囲を保ち、性別を限定せず自然な日本語にした。
- source_word: τῶν ἰδίων
  choice: 自分の身内
  rationale: 同居者だけに限られない、自分に属する親族や近しい扶養対象を表す。後続の「家の者」より広い範囲を保った。
- source_word: μάλιστα
  choice: とりわけ
  rationale: 広い集団の中でも特に責任を負う一群を強調する語として、明瞭で品位のある現代語を選んだ。
- source_word: οἰκείων
  choice: 家の者
  rationale: 自分の家に属する人々、すなわち世帯の成員を指す。「家族」よりも同じ家・世帯に属するという原語の焦点を保つ。
- source_word: προνοεῖ
  choice: 必要な世話をしない
  rationale: 単なる心配ではなく、先を見越した実際的・物質的な配慮を含む文脈上の意味を、過度に金銭的な扶養だけに限定せず表した。
- source_word: τὴν πίστιν
  choice: 信仰
  rationale: ここではその人が公に認めているキリスト教信仰を指すと理解できる。定冠詞の機能は日本語では文脈によって示した。
- source_word: ἤρνηται
  choice: 否定した
  rationale: 完了形が示す、すでになされた行為とその現在に及ぶ結果を「否定したのであり」で表した。行いによる重大な否認を弱めていない。
- source_word: ἀπίστου
  choice: 信仰を持たない人
  rationale: この対比では、単に不誠実な人ではなく、信じていない人を指す。専門語的な「不信者」を避け、普通の読者に明瞭な表現とした。
- source_word: χείρων
  choice: よりも悪い
  rationale: 道徳的な比較を簡潔かつ強く伝える自然な対応語である。
theological_decisions:
- issue: 一般的な適用範囲と性別表現
  choice: 性別を示さない「人」で訳す
  alternative: 男性を明示する「男」や男性代名詞を用いる
  rationale: τις は文法上単数だが、この命令的断言は一般的な効力を持つ。日本語では性別を加えずとも単数的な一般表現が自然に成立するため、原文にない男性限定を持ち込まない。
- issue: τὴν πίστιν の意味
  choice: 告白されているキリスト教信仰として「信仰」
  alternative: 主観的な信頼、または「誠実さ」
  rationale: 牧会書簡の用法と「否定する」という述語との結びつきから、告白され実践される信仰を指す可能性が最も高い。ただし、行動と信仰の緊張を説明的な言い換えで解消せず、そのまま残した。
- issue: 世話をしないことと信仰否定の関係
  choice: 「否定したのであり」と直接的に訳す
  alternative: 「否定したことになる」と解釈的に弱める
  rationale: 原文は比喩的帰結を明示する補助表現を置かず、完了形で直接断定している。その厳しさを保つ一方、信仰を失う仕組みについて本文以上の教理的説明は加えない。
translation_notes:
  register: 明瞭な現代標準語を用い、断定の厳粛さを保った。「家の者」はやや改まった表現だが、現代日本語でも理解可能で、οἰκεῖος の世帯帰属の意味を簡潔に伝える。「必要な世話」は金銭的扶養を含みつつ、それだけに狭めない。
