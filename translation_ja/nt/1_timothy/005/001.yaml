review_pass:
  verdict: revise
  source_fidelity: 'Πρεσβυτέρῳ is correctly understood in its age-related sense, in contrast with νεωτέρους, and the masculine distinctions are retained. However, the draft renders the single governing verb παρακάλει differently for the two groups: 「諭し」for the older man but 「接しなさい」for younger men. The Greek gives the same exhortational action to both groups. 「厳しく」also adds a degree of intensity that is possible but not required by ἐπιπλήξῃς.'
  naturalness: The Japanese is generally clear and appropriately respectful. Repeating 「勧めなさい」makes the parallel structure and the shared Greek verb explicit while remaining natural modern Japanese. 「父親に対するように」and「兄弟に対するように」clearly express the comparative ὡς phrases.
  terminology: 「年長の男性」is appropriate here, not ecclesial「長老」in the main text. 「若い男性」and「兄弟」correctly preserve the sex-specific sequence. The alternative-reading footnote should match the revised main-text force and avoid retaining the unnecessary intensifier.
  issues:
  - severity: medium
    issue: 後半を「兄弟に対するように接しなさい」としている。
    rationale: παρακάλει（勧める・促す・諭す）は「年長の男性」と「若い男性」の両方にかかる。一方、「接する」は原文にない別の一般的行為を導入し、動詞の並行を失わせる。
  - severity: low
    issue: 「厳しく」が本文と脚注の代替訳に加えられている。
    rationale: ἐπιπλήξῃςは強い叱責を表し得るが、原文および英語監査訳の基本訳「rebuke」は程度を明示していない。日本語でも「叱ってはいけません」として余分な限定を避けるのが安全である。
  revised_text: 年長の男性[a]を叱ってはいけません。むしろ、父親に対するように勧めなさい。若い男性には、兄弟に対するように勧めなさい。
