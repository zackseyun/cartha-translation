  text: Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα, νεωτέρους ὡς ἀδελφούς,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/001.yaml
  text: Do not rebuke an older man[a], but appeal to him as a father, and to younger men as brothers,
translation:
  language: ja
  text: 年長の男性[a]を叱ってはいけません。むしろ、父親に対するように勧めなさい。若い男性には、兄弟に対するように勧めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「長老を叱ってはいけません」。ギリシア語は「年長の男性」と「長老」のどちらも意味し得ますが、この文脈では年齢による対比が「年長の男性」を支持します。
    reason: alternative_reading
lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: 年長の男性
  rationale: 同じ節の「若い男性」との対比、また次節に続く年齢・性別ごとの呼びかけから、教会の職務としての「長老」よりも、年齢を表す意味が文脈に適している。
- source_word: μὴ ἐπιπλήξῃς
  choice: 厳しく叱ってはいけません
  rationale: ἐπιπλήσσωは、言葉で強く責める、叱責するという語感を持つ。「厳しく叱る」は、単なる訂正ではなく高圧的な叱責を避けるよう命じる対比を自然な日本語で表す。
- source_word: ἀλλὰ παρακάλει
  choice: むしろ……諭し
  rationale: παρακαλέωは「勧める、励ます、懇願する」など広い意味を持つ。ここでは厳しい叱責との対比と家族になぞらえた態度を踏まえ、敬意をもって言い聞かせる「諭す」とした。
- source_word: ὡς πατέρα
  choice: 父親に対するように
  rationale: ὡςによる比較を明確にし、相手を実父と見なすのではなく、父に向けるような敬意ある態度を示す表現とした。
- source_word: νεωτέρους
  choice: 若い男性
  rationale: 男性複数の実体詞的用法であり、後続の「兄弟」および次節で女性が別に扱われる構成を保った。
- source_word: ὡς ἀδελφούς
  choice: 兄弟に対するように接しなさい
  rationale: 性別を区別した文脈なので「兄弟」とした。「接しなさい」は、前の動詞παρακάλειが後続の各対格にも及ぶことを日本語として自然に表すための補いである。
theological_decisions:
- issue: Πρεσβυτέρῳが教会職としての「長老」か、年長の男性か
  choice: 年齢に基づく「年長の男性」
  alternative: 長老
  rationale: 年長の男性／父、若い男性／兄弟、次節の年長の女性／母、若い女性／姉妹という対称的な構成が、年齢と性別による区分を強く示す。ただし語そのものには「長老」の可能性もあるため、脚注に残した。
- issue: ἀδελφούςを包括的に訳すか
  choice: 兄弟
  alternative: 兄弟姉妹
  rationale: この箇所では男性と女性が続く二節で別々に扱われており、男性複数形は一般的・包括的というより性別を特定した表現である。
translation_notes:
  register: 明瞭で現代的ながら、牧会書簡の勧告にふさわしい落ち着いた敬体を用いた。「諭す」はπαρακαλέωの幅を完全には尽くさないが、厳しい叱責との対照、父への敬意、普通の読者への分かりやすさを両立する。
