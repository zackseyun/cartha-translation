  text: ἡ δὲ σπαταλῶσα ζῶσα τέθνηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: ja
  text: しかし、快楽にふけって暮らす女は、生きてはいても死んでいます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「快楽にふけって暮らす」は、「自分を甘やかして暮らす」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπαταλῶσα
  choice: 快楽にふけって暮らす
  rationale: ぜいたくや享楽に身を任せる継続的な生き方を表す現在分詞。単なる楽しみではなく自己放縦の含みを保ちつつ、現代日本語として自然にした。
- source_word: ζῶσα
  choice: 生きてはいても
  rationale: 後続する完了形との逆説的な対比を明確にし、譲歩的な意味合いを自然な日本語で表した。
- source_word: τέθνηκεν
  choice: 死んでいます
  rationale: 完了形が示す、死んだ結果として現在も続く状態を表す。比喩が何を意味するかは本文で限定しない。
- source_word: ἡ ... σπαταλῶσα
  choice: 快楽にふけって暮らす女
  rationale: 女性単数の冠詞付き分詞を実体詞的に訳した。文脈上はやもめを指すが、この節自体にない語を補わず、女性への言及を保持した。
- source_word: δὲ
  choice: しかし
  rationale: 前節で描かれる、神に望みを置く本当のやもめとの対照を示す。
theological_decisions:
- issue: 生きながら「死んでいる」という表現の性質
  choice: 死の比喩を説明せず、そのまま保持する
  alternative: 霊的に死んでいる、または道徳的に死んでいると明示する
  rationale: 身体的には生きている者が死んでいるという意図的な逆説であり、霊的・道徳的な意味が示唆されるが、本文はその範囲を限定していないため。
translation_notes:
  register: 明快な現代標準日本語。簡潔で格調を保ち、原文の対照と逆説を明瞭にした。
