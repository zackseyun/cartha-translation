id: 1TI.5.16
reference: 1 Timothy 5:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴ ⸀τις πιστὴ ἔχει χήρας, ⸀ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: ja
  text: 信者である女性に、やもめの身内がいるなら[a]、その人たちを支えなさい。教会に負担をかけてはなりません。そうすれば、教会は本当にやもめである人たちを支えることができます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「信者である男性または女性に、やもめの身内がいるなら」、または「信者に、やもめの身内がいるなら」とあり、対象が女性だけに限定されていません。
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: 信者である女性
  rationale: 底本文ではπιστήが女性単数形なので、主体が女性であることを明示した。「信仰のある女性」も可能だが、牧会書簡の文脈ではキリスト者としての身分を表す「信者」が自然である。
- source_word: ἔχει χήρας
  choice: やもめの身内がいる
  rationale: 直訳は「やもめたちを持っている」だが、日本語では不自然である。文脈上、扶養すべき家族・親族のやもめがいることを指すため、「身内がいる」とした。
- source_word: ἐπαρκείτω αὐταῖς
  choice: その人たちを支えなさい
  rationale: ἐπαρκέωは必要を満たす実際的・物質的な援助を表す。「助ける」より具体的で、現代日本語として自然な「支える」を用いた。
- source_word: μὴ βαρείσθω ἡ ἐκκλησία
  choice: 教会に負担をかけてはなりません
  rationale: ギリシア語は「教会が負担を負わされないように」という受動命令だが、日本語では責任主体に即して能動的に表すほうが明瞭である。扶養上の負担という意味を保った。
- source_word: ταῖς ὄντως χήραις
  choice: 本当にやもめである人たち
  rationale: ὄντωςの強調を保ち、この章でいう、身寄りがなく教会の援助を真に必要とするやもめという区分を、本文で過度に説明せず表した。
- source_word: ἐπαρκέσῃ
  choice: 支えることができる
  rationale: 前半と同じἐπαρκέωに同じ「支える」を当て、語の反復を保った。ἵνα以下の目的を自然な日本語で示した。
theological_decisions:
- issue: 冒頭の主体の性別
  choice: 底本文どおり、特定の女性を示す「信者である女性」
  alternative: 異読に基づく「信者」または「信者である男性または女性」
  rationale: SBLGNTのτις πιστήは文法上女性単数であるため、本文では性別を中和しない。より広い主体を示す写本異読は脚注に残した。
- issue: 「本当にやもめ」の意味
  choice: 表現の強調を保ち、「本当にやもめである人たち」と訳す
  alternative: 「身寄りのないやもめ」「援助を受ける資格のあるやもめ」と説明的に訳す
  rationale: 文脈は家族の扶養を受けられない人を示唆するが、本文の語句自体に説明を過剰に織り込まず、章内にある神学的・共同体的区分を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令の厳粛さを保った。「寡婦」より一般読者に分かりやすく、聖書語としても定着している「やもめ」を採用した。文頭の条件節と二つの命令、続く目的節という論理構造を明確にした。
