  text: μηκέτι ὑδροπότει, ἀλλὰ οἴνῳ ὀλίγῳ χρῶ διὰ τὸν ⸀στόμαχον καὶ τὰς πυκνάς σου ἀσθενείας.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: ja
  text: もう水だけを飲むのはやめて、胃のため、また、たびたび患う病気のために、少量のぶどう酒を用いなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「もう水を飲む者であり続けるのはやめなさい」。ここでは、水そのものを飲むなという意味ではなく、水だけを飲み続けないように、という趣旨。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι ὑδροπότει
  choice: もう水だけを飲むのはやめて
  rationale: μηκέτιは、それまでの習慣を今後は続けないよう求める語。ὑδροπότειは字義的には「水を飲め」だが、ἀλλά以下のぶどう酒との対比から、水そのものを断つのではなく、水だけを飲み続けることをやめる意味を自然な日本語で示した。
- source_word: ἀλλὰ οἴνῳ ὀλίγῳ χρῶ
  choice: 少量のぶどう酒を用いなさい
  rationale: χράομαιは与格を伴って「～を用いる」の意。ὀλίγῳによる量の制限を「少量の」として明示し、οἶνοςは一般的で明確な「ぶどう酒」と訳した。
- source_word: διὰ τὸν στόμαχον
  choice: 胃のため
  rationale: διά＋対格は理由を表し、στόμαχοςはここでは身体器官としての「胃」を指す。簡潔で自然な表現とした。
- source_word: καὶ τὰς πυκνάς σου ἀσθενείας
  choice: また、たびたびかかる病気のために
  rationale: πυκνάςは頻繁さを表し、ἀσθενείαςは胃への言及を伴う身体的文脈では「病気」が適切。「あなたの」は日本語では文脈上明らかなため表面化せず、σουの意味を「かかる」によって自然に反映した。
theological_decisions:
- issue: テモテがやめるべき習慣を、水を飲むこと自体とするか、水だけを飲むこととするか
  choice: 水だけを飲むのはやめて
  alternative: もう水を飲むのはやめて
  rationale: ἀλλάで少量のぶどう酒を用いるよう対置されているため、水を全面的に禁じる命令ではなく、水だけに限る習慣をやめる意味と解するのが文脈に即している。
- issue: οἶνοςを一般化または医学的に限定するか
  choice: ぶどう酒
  alternative: 薬用酒／飲み物
  rationale: 原文は明確にοἶνοςと記すため、その具体性を保った。「少量の」と目的を示す句が、節度と身体上の事情をそのまま伝える。
translation_notes:
  register: 明快な現代標準語を用いながら、勧告としての穏やかで品位ある調子を保った。「使いなさい」よりも飲食物を健康上の目的で取り入れる文脈になじむ「用いなさい」を採用した。
