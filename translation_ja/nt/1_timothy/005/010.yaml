id: 1TI.5.10
reference: 1 Timothy 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: ja
  text: 良い行いをしていると評判がよく、子どもを育てたことがあり[a]、客人をもてなし、聖なる者たち[b]の足を洗い、苦しんでいる人々を助け、あらゆる良い行いに励んできた人であること。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 実子に限らず、世話を託された子どもを育てた場合も含み得る。
    reason: 原文の動詞は子どもを養育することを表すが、その子どもとの血縁関係は明示しないため。
  - marker: b
    text: 「聖なる者たち」とは、神のものとされた人々、すなわち信者たちを指す。
    reason: 現代日本語で特別な宗教的偉人を連想させる可能性を避け、パウロ書簡での共同体的用法を説明するため。
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: 立派な行いによって評判のよい人
  rationale: 受動分詞の「他者から証言されている」という意味を、現代日本語で自然に表しつつ、その評判が実際の行いに基づくことを示す。
- source_word: εἰ
  choice: すなわち、…こと
  rationale: 反復される条件的な項目を、日本語では具体的な資格内容を列挙する形に整えた。各行為が評判の根拠である構造は保っている。
- source_word: ἐτεκνοτρόφησεν
  choice: 子どもを育て上げ
  rationale: 養育して成長させる意味を表し、実子に限定しない。
- source_word: ἐξενοδόχησεν
  choice: 旅人をもてなし
  rationale: 単なる一般的な親切ではなく、客や見知らぬ人を迎え入れるという動詞の具体性を保つ。
- source_word: ἁγίων
  choice: 聖なる者たち
  rationale: 神に属する者として聖別された人々という語義を保持し、特定の階級を指すような日本語の「聖人」は避ける。
- source_word: πόδας ἔνιψεν
  choice: 足を洗い
  rationale: 謙遜な奉仕を表す具体的な行為をそのまま訳す。
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: 苦しんでいる人々を助け
  rationale: θλίβω の圧迫・苦難という広い意味を保ち、迫害だけに限定せず、ἐπαρκέω の実際的援助を明瞭に表す。
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: あらゆる良い働きに励んできた
  rationale: 「後について行く、熱心に従事する」という能動的で継続的な志向を自然な日本語で表す。単に良い行為を観察して追随したとの誤解を避ける。
theological_decisions:
- issue: ἁγίων の指示対象
  choice: 「聖なる者たち」と訳し、神に属する信者たちを指すことを脚注で説明する。
  alternative: 「信者たち」または「聖徒たち」
  rationale: パウロ書簡における共同体的な指示対象を明らかにしながら、「聖別された者」という語の神学的含意を本文に残す。
- issue: 子どもとの関係
  choice: 「子ども」とし、実子か養育を託された子かを限定しない。
  alternative: 「自分の子ども」
  rationale: 原文には所有表現がなく、養育の対象を実子だけに限定する根拠がない。
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた品位ある文体。「立派な行い」と「良い働き」で καλοῖς と ἀγαθῷ の近い表現を自然に訳し分けた。文脈上は資格条件の列挙なので、逐語的な「もし」の反復を避けつつ条件性を「…人であること」で保持した。
