id: 1TI.5.4
reference: 1 Timothy 5:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: ja
  text: しかし、やもめに子どもや孫[a]がいる場合、その子どもや孫はまず、自分の家の者に対して敬虔を示し[b]、先の世代の人々に恩を返すこと[c]を学ぶべきです。これは神の御前に受け入れられることだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子どもや子孫」。ギリシア語のἔκγοναは「孫」より広く、子孫を指すこともあります。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は直訳すると「自分の家の者に敬虔を示す」。ここでは家族の世話が敬虔の行いとして述べられています。
    reason: lexical_alternative
  - marker: c
    text: 直訳「先に生まれた者たちに報いる」。「親たち」または「先祖」とも訳せますが、ここでは前の世代の家族を指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: やもめ
  rationale: 夫を亡くした女性を指す文脈上の標準的な意味。「やもめ」は聖書本文として簡潔であり、現代日本語でも意味が通じる。
- source_word: τέκνα ἢ ἔκγονα
  choice: 子どもや孫
  rationale: τέκναは「子ども」、ἔκγοναは広く「子孫」を意味し得るが、この家族扶養の文脈では直系の次世代である「孫」が自然である。広い語義は脚注に残した。
- source_word: μανθανέτωσαν
  choice: その者たちが……学びなさい
  rationale: 三人称複数現在命令法の命令の力を保つ。日本語では直前の「子どもや孫」を受ける主語を明示して、指示対象の曖昧さを避けた。
- source_word: πρῶτον
  choice: まず
  rationale: 家族への責任が敬虔の実践において優先されることを、自然かつ簡潔に表す。
- source_word: τὸν ἴδιον οἶκον εὐσεβεῖν
  choice: 自分の家族に対して敬虔を実践し
  rationale: οἶκοςを建物ではなく家族・家の者と捉え、εὐσεβεῖνの宗教的含意を「敬虔」で保持した。具体的な家族扶養が敬虔の実践であるという結び付きを示す。
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: 恩を返す
  rationale: 以前に受けた養育や世話に応じて返すという相互的な意味を、現代日本語で自然に表した。
- source_word: τοῖς προγόνοις
  choice: 親や祖父母に
  rationale: 語自体は「先に生まれた者、先祖」を指すが、ここでは存命の前世代への扶養義務が中心であるため、文脈上の具体的対象を示した。より広い語義は脚注に記した。
- source_word: ἀπόδεκτον ἐνώπιον τοῦ θεοῦ
  choice: 神の御前に受け入れられる
  rationale: 神の評価において好意的に受け止められるという意味を保ち、ἐνώπιονの「御前に」も明示した。
theological_decisions:
- issue: 複数命令形 μανθανέτωσαν の主語
  choice: 命令は、やもめの子どもや孫に向けられている。
  alternative: 数の移行または省略された主語を想定し、やもめたちへの命令と解する。
  rationale: 最も近い複数名詞である τέκνα ἢ ἔκγονα を主語とするのが統語上自然であり、家族がやもめを扶養して前世代の恩に報いるという文脈にも合う。
- issue: εὐσεβεῖν と家族扶養の関係
  choice: 家族への配慮と扶養は、単なる社会的義務ではなく敬虔の実践として示される。
  alternative: 宗教的含意を弱め、単に家族としての義務を果たすことと訳す。
  rationale: εὐσεβεῖνには明確な敬虔・信仰的実践の含意があり、後半もその行為を神の御前で評価されるものとしているため、その神学的次元を訳文に残した。
- issue: τοῖς προγόνοις の具体的範囲
  choice: この文脈では、扶養を受ける前世代である親や祖父母を指すものとして本文に具体化する。
  alternative: 語義の広さを優先し、「先祖」または「先人」とする。
  rationale: 「先祖」では亡くなった遠い祖先への報恩とも読まれ得る。やもめの世話という直接の文脈では「親や祖父母」が意図を明瞭にする一方、原語の広さは脚注で保持できる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「敬虔」「神の御前」など本文の宗教的重みを担う語は保持した。「その者たち」を補って複数命令形の自然な指示対象を明示し、「先祖」から生じ得る死者供養の含意を避けるため、本文では「親や祖父母」と具体化した。
