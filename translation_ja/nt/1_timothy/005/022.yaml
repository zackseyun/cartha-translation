id: 1TI.5.22
reference: 1 Timothy 5:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: ja
  text: だれにも性急に手を置いてはならない[a]。また、他人の罪に加担してはならない。自分を清く保ちなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は、より具体的に「だれをも性急に任命してはならない」という意味とも考えられる。ギリシア語は直訳すると「手を置く」で、務めに就かせることや、その人を公に承認することと結び付けて用いられる表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: 手を置く
  rationale: 原文の「手を置く」という表現を保った。文脈上、務めへの任命・承認を指す可能性が高いが、本文ではそれに限定せず、脚注で示す。
- source_word: ταχέως
  choice: 性急に
  rationale: 単なる速さではなく、十分な吟味をせず早まることへの警告を自然な日本語で表す。
- source_word: μηδενὶ
  choice: だれにも……してはならない
  rationale: 否定命令における普遍的な範囲を明確に表す。
- source_word: μηδὲ κοινώνει
  choice: また……加担してはならない
  rationale: κοινωνέωがここで表す、他者の行為や責任に参与して罪を共に負う含意を、現代日本語で明確に伝える。
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: 他人の罪
  rationale: 「他者に属する罪」という原文の意味を簡潔で自然に表す。
- source_word: σεαυτὸν ἁγνὸν τήρει
  choice: 自分を清く保ちなさい
  rationale: 道徳的な純潔を広く表し、継続してその状態を守るよう求める命令を自然に訳す。
theological_decisions:
- issue: 「手を置く」の文脈上の意味
  choice: 本文では「手を置く」という表現を保持する。
  alternative: 「任命する」または「按手して任職させる」と明示する。
  rationale: 長老を扱う直前の文脈では、務めへの任命・承認を指す可能性が高い。しかし原文は任命を表す明示的な動詞ではなく、より広い表現を用いているため、宗派的な制度理解に限定せず脚注で可能性を説明する。
- issue: 二つの禁止命令の関係
  choice: 他人の罪への加担を禁じる一般性のある表現として訳す。
  alternative: 性急な任命によって候補者の罪の責任を共に負うことに限定する。
  rationale: 並置から両者の関連は示唆されるが、原文はその関係を明示していない。したがって本文では曖昧さを保ち、限定的な因果関係を補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「性急に」は早まった判断への警告を表し、「加担する」は罪への参与・連帯責任の含みを一般読者に明確に伝える。
