  to: ですから、私は、若いやもめが結婚し[a]、子どもを産み、家庭を管理し、反対する者[b]に悪口を言う口実を少しも与えないことを望みます。
  rationale: 原文のβούλομαιが示すパウロ自身の意志を「私は…ことを望みます」で直接表し、結婚・出産・家庭の管理・敵対者に口実を与えないことの四つを同じ意志の対象として明瞭に並列しました。意味、指示対象の曖昧さ、脚注の位置と内容は維持しています。
