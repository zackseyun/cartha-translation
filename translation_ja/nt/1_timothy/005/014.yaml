id: 1TI.5.14
reference: 1 Timothy 5:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: ja
  text: ですから、私は、若いやもめが結婚し[a]、子どもを産み、家庭を管理し、反対する者[b]に悪口を言う口実を少しも与えないことを望みます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は単に「結婚する」。ここでは若いやもめが対象なので、再婚が含意されている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「敵対者」。サタンを指している可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: 私は……してほしいのです
  rationale: 話し手であるパウロの意向を明示しつつ、後続する対格＋不定詞の構文を自然な現代日本語で表した。単なる助言よりも意志を示すが、命令形にはしない。
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論から導かれる結論であることを、明瞭で自然な接続表現によって示した。
- source_word: νεωτέρας
  choice: 若いやもめ
  rationale: 語自体は「より若い女性たち」だが、5章の直前から続く文脈がやもめについてのものであるため、省略された名詞を補った。
- source_word: γαμεῖν
  choice: 結婚し
  rationale: 動詞自体は単に「結婚する」を意味する。対象がやもめなので再婚が含意されるものの、「再び」という意味を本文に明示的には加えなかった。
- source_word: τεκνογονεῖν
  choice: 子どもを産み
  rationale: 子を産む、生むことを表す動詞の具体性を保った。
- source_word: οἰκοδεσποτεῖν
  choice: 家庭を取り仕切り
  rationale: 家の中で責任をもって管理・運営する意味を表し、過度に支配的な響きを避けた。
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: 口実を少しも与えない
  rationale: 敵対者が非難のために利用できる機会や足掛かりを与えない、という意味を自然な日本語で表した。μηδεμίαν の強い否定も「少しも」で反映した。
- source_word: τῷ ἀντικειμένῳ
  choice: 反対する者
  rationale: 定冠詞付き現在分詞の字義を保ち、敵対する人間にもサタンにも限定しない訳とした。
- source_word: λοιδορίας χάριν
  choice: 悪口を言う
  rationale: 罵倒、侮辱的な非難を行う目的を、一般の読者に分かりやすい現代日本語で表した。「中傷」だけに狭めず、攻撃的な言葉という幅を残した。
theological_decisions:
- issue: τῷ ἀντικειμένῳ が指すもの
  choice: 本文では「反対する者」とし、特定の人間または勢力にもサタンにも限定しない
  alternative: 「敵対者」と訳し、サタンを指すものと理解する
  rationale: ギリシア語は相手を固有名や「悪魔」として明示していない。公の非難を行う敵対者という理解が可能である一方、サタンを指す可能性も排除せず、脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい落ち着いた語調とパウロの個人的意向を保った。「やもめ」は聖書文体として定着し、かつ「配偶者を亡くした女性」より簡潔であるため採用した。脚注記号は、それぞれ「結婚し」と「反対する者」の直後に配置した。
