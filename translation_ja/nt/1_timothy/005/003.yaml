  text: Honor widows who are truly widows[a].
translation:
  language: ja
  text: 本当にやもめである女性たちを敬いなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「本当にやもめである女性たちを支えなさい」。この文脈では、「敬う」ことには生活上の援助も含まれると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χήρας
  choice: やもめである人たち
  rationale: χήραは夫を亡くした女性を指す。現代日本語では「やもめ」だけだと男性を指す用法もあるため、「やもめである人たち」として文脈上の対象を自然に示した。
- source_word: τίμα
  choice: 敬いなさい
  rationale: τιμάωの基本義である、重んじ、敬意を示すことを保つ。後続文脈では実際的・物質的な扶助も含むと考えられるが、本文を「支えなさい」だけに狭めない。
- source_word: τὰς ὄντως χήρας
  choice: 真にやもめである人たち
  rationale: ὄντωςによる実質的な限定を「真に」で表した。後続の文脈が説明する、身寄りがなく教会の援助を必要とするやもめという区別を先取りして具体化しすぎない。
- source_word: ὄντως
  choice: 真に
  rationale: 単なる強調ではなく、該当者を限定する「実際に、本当に」の意味を簡潔で格調ある日本語にした。
theological_decisions:
- issue: 文脈におけるτιμάωの範囲
  choice: 本文では「敬いなさい」とし、敬意を示すという広い意味を保つ。
  alternative: 「支えなさい」または「援助しなさい」
  rationale: 第一テモテ5章の文脈では物質的な扶助を含む可能性が高いが、ギリシア語動詞自体はそれより広い。意味を金銭的支援だけに限定せず、文脈上の含意を脚注で示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「寡婦」は公的・法律的で硬いため避け、「やもめ」を用いた。性別が曖昧にならないよう「やもめである人たち」とした。
