reference: 1 Timothy 5:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρεσβυτέρας ὡς μητέρας, νεωτέρας ὡς ἀδελφὰς ἐν πάσῃ ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/002.yaml
  text: older women as mothers[a], younger women as sisters, in all purity.
translation:
  language: ja
  text: 年上の女性には母親に対するように、若い女性には、すべての清さをもって姉妹に対するように勧めなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一切の清さのうちに」とも訳せる。ここでいう「清さ」には、貞潔や性的な節度という強い意味も含まれうる。
    reason: ἁγνείαの広い道徳的意味と、文脈上の性的な含意の両方を示し、本文で一方に限定しないため。
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: 年上の女性
  rationale: 女性・複数の比較級形容詞が名詞的に用いられている。νεωτέραςとの対比から、教会の役職ではなく年齢を表す。
- source_word: ὡς μητέρας
  choice: 母親に対するように
  rationale: ὡςの比較と家族的な比喩を保つ。「自分の」は原文にないため加えない。日本語では、先行節から補われる動作との関係を明確にするため「に対するように」とした。
- source_word: νεωτέρας
  choice: 若い女性
  rationale: 女性・複数の比較級形容詞の名詞的用法で、年上の女性との年齢上の対比を自然な現代日本語で示す。
- source_word: ὡς ἀδελφὰς
  choice: 姉妹に対するように
  rationale: 家族の一員として尊重する比喩を保ち、原文にない「自分の」は補わない。
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: 完全な清さをもって
  rationale: πάσῃの包括性・完全性と、ἁγνείᾳの道徳的な清さを表す。文脈上、貞潔や性的な節度も強く含みうるが、本文では意味をそれだけに限定しない。
- source_word: παρακάλει（5:1から継続）
  choice: 接しなさい
  rationale: 本節は前節の命令を受ける省略構文である。日本語で単独の節として自然に理解でき、女性たちへの関わり方全体を表すよう、文脈に即して動詞を補った。
theological_decisions:
- issue: ἁγνείαの意味範囲
  choice: 「清さ」と広く訳し、性的な貞潔に限定しない
  alternative: 「貞潔」「性的に完全に清く」
  rationale: この語は道徳的な清さを広く表しうる一方、若い女性への接し方という文脈では性的な節度が強く意識される。本文では語義の幅を保ち、含意を脚注で示す。
- issue: 省略された動詞の日本語での補充
  choice: 「接しなさい」を補う
  alternative: 前節の動詞に直接対応させて「勧めなさい」とする、または断片のまま訳す
  rationale: ギリシア語では5:1のπαρακάλειが本節にも及ぶ。しかし日本語で「母親に対するように勧める」は不自然になりやすいため、列挙全体が示す関わり方を自然に表す「接しなさい」とした。命令の力は保持している。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、家族的な比喩と命令の品位を保った。節単独でも自然に読めるよう、前節から継続する動詞を「接しなさい」と補った。
