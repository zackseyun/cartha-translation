id: 1TI.5.25
reference: 1 Timothy 5:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: ja
  text: 同じように、良い行いも明らかです。そして、そうでないもの[a]も隠されたままでいることはできません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「異なるもの」または「そうではないもの」。前節との類比から、特に悪い行いを指すと理解する人もいます。
    reason: 原文の表現は、単に明らかでない行いを指すとも、悪い行いを暗示するとも理解できるため。
lexical_decisions:
- source_word: ὡσαύτως καί
  choice: 同じように、…も
  rationale: 前節との並行関係を示すὡσαύτωςと、付加を表すκαίの働きを、自然な現代日本語で表した。
- source_word: ἔργα τὰ καλά
  choice: 良い行い
  rationale: ἔργαの具体的な行為の意味と、καλάの倫理的な良さを、一般読者に明瞭な表現で伝える。
- source_word: πρόδηλα
  choice: 明らかです
  rationale: 人の目に明白である、表に現れているという意味を簡潔に表し、後半の「隠されたまま」との対照を保つ。
- source_word: τὰ ἄλλως ἔχοντα
  choice: そうでないもの
  rationale: 直前の良い行いとは異なる状態にある行いを指す曖昧な表現を保ち、「悪い行い」と断定しない。
- source_word: κρυβῆναι οὐ δύνανται
  choice: 隠されたままでいることはできません
  rationale: 単に隠されないだけでなく、今は表に出ていない行いも最終的には隠れ続けられないという文脈上の含みを表す。
theological_decisions:
- issue: τὰ ἄλλως ἔχονταが特に悪い行いを指すのか、それとも明らかになっていない行いを広く指すのか
  choice: 「そうでないもの」とし、意味を限定しない
  alternative: 「悪い行い」
  rationale: 前節との類比から悪い行いと理解することは可能だが、ギリシア語本文は「悪い」と明記していないため、原文の幅と緊張を残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「善行」より日常的な「良い行い」を用い、原文にない道徳的限定を本文へ加えなかった。
