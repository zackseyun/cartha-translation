  text: incurring judgment because they have set aside their former faith[a].
translation:
  language: ja
  text: 以前の信仰[a]を退けたため、裁きを受けるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「以前の誓約」または「以前の約束」。ギリシア語は「信仰」を意味し得るが、ここでは、やもめとして名簿に載ることに関連した先の誓約を指すと考える人もいる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: 受けることになります
  rationale: 直訳は「持っている」だが、κρίμαとの結びつきでは「裁きを受ける／裁きに服する」という意味になる。前文から続く分詞の含みを、自然な現代日本語で表した。
- source_word: κρίμα
  choice: 裁き
  rationale: 「判決」「有罪判決」「処罰」もあり得るが、永遠の断罪まで特定せず、原語の厳粛さと意味の広さを保つ。
- source_word: ὅτι
  choice: ため
  rationale: 裁きを受ける理由を明示する理由節として、簡潔で自然な日本語にした。
- source_word: τὴν πρώτην πίστιν
  choice: 以前の信仰
  rationale: πρώτηνはここでは時間的な先行を示すため「以前の」とした。πίστινは基本義の「信仰」を本文に置きつつ、この文脈で「最初の誓約／以前の約束」を指す可能性を脚注に残した。
- source_word: ἠθέτησαν
  choice: 退けた
  rationale: ἀθετέωの「拒む、無効にする、顧みない」という意味を表す。「破った」では誓約という解釈に限定しやすいため、信仰と誓約の双方に対応できる「退けた」とした。
theological_decisions:
- issue: τὴν πρώτην πίστιν の意味
  choice: 以前の信仰
  alternative: 最初の誓約、または以前の約束
  rationale: πίστιςは通常「信仰」を意味する一方、この箇所では、やもめとして名簿に載る際の先の誓約や約束を指すと解する余地がある。本文で一方に決め切らず、異読を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。単独節として読めるよう述語を補いつつ、前文との連続を示す分詞構文の結果的な意味を保持した。
