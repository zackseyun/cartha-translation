  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: ja
  text: その中には、ヒメナイとアレクサンドロがいます。私は彼らをサタンに引き渡しました[a]。それは、彼らが懲らしめを受けて、冒涜しないようになるためです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「サタンに渡しました」とも訳せる。この表現は、最終的な断罪を意味するとは限らず、矯正を目的とする厳しい懲戒を指すと理解されることが多い。
    reason: lexical_alternative
  - marker: b
    text: 「懲らしめを受けて」に当たるギリシア語には、「教えられて」「訓練されて」「矯正されて」という意味もあり、教育的な矯正を含んでいる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: その中には、…がいます
  rationale: 前節で述べられた人々の一部を示す部分属格の意味を、自然な現代日本語で表した。
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: ヒメナイとアレクサンドロ
  rationale: 新約聖書の人名として日本語で広く用いられる音写を採用した。
- source_word: παρέδωκα
  choice: 引き渡しました
  rationale: παραδίδωμι の強い動作性を保ちつつ、現代日本語として明瞭にした。アオリストは文脈上、完了した行為として訳した。
- source_word: τῷ Σατανᾷ
  choice: サタンに
  rationale: 固有の呼称として、新約聖書で定着している日本語表記を用いた。
- source_word: ἵνα παιδευθῶσι
  choice: それは、彼らが懲らしめを受けて、…ようになるためです
  rationale: παιδεύω が含む教育・訓練と矯正的懲戒の両面のうち、この文脈で強い矯正的意味を自然な日本語で示しつつ、目的節として回復を目指す含みを保った。
- source_word: μὴ βλασφημεῖν
  choice: 冒瀆しないようになる
  rationale: βλασφημέω の宗教的・神学的な重みを「冒瀆する」で保ち、παιδεύω に続く不定詞を、行動の矯正という目的が明瞭になる形で訳した。
theological_decisions:
- issue: 「サタンに引き渡す」の意味
  choice: 比喩か具体的処置かを本文で限定せず、原文どおり「サタンに引き渡す」とした。
  alternative: 教会の保護領域の外に置く厳しい懲戒、身体的苦痛を伴う処置、または最終的断罪と明示する。
  rationale: 目的節は矯正的な意図を示すが、具体的な仕組みまでは説明していない。したがって、本文では表現を保持し、最終的断罪とは断定しない注を付した。
- issue: παιδευθῶσι の懲戒と教育の緊張
  choice: 本文では「懲らしめを受けて」とし、結果・目的を「冒瀆しないようになる」と表した。
  alternative: 「教えられて」「訓練されて」「矯正されて」と訳す。
  rationale: 厳しい処置の文脈にある矯正的懲戒を示しながら、単なる報復ではなく形成・教育を目指す語義を脚注で保持した。
translation_notes:
  register: 明瞭で品位ある現代標準語を用いた。原文の長い関係節と目的節は、読みやすさのため三文に分けたが、論理関係は「それは…ためです」で明示した。「冒瀆」は日常語より硬いものの、原語の宗教的な重みを保つため採用した。
