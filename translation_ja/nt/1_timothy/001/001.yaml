  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: ja
  text: 私たちの救い主である神と、私たちの希望であるメシア・イエスの命令によって、メシア・イエスの使徒パウロから。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア・イエス」は、二箇所とも「キリスト・イエス」とも訳せる。ギリシア語の称号「クリストス」は、「メシア」という意味を訳した形でも、名前に近い用法の「キリスト」でも表せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: パウロ
  rationale: 日本語で定着している固有名の表記。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 初期キリスト教における委任された役割・称号を表す、定着した新約聖書用語。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシア・イエス
  rationale: Χριστόςの称号としての意味を明示し、固有名Ἰησοῦは慣用表記「イエス」とした。
- source_word: κατ’ ἐπιταγὴν
  choice: 命令によって
  rationale: 権威ある指示を根拠として使徒となったことを、自然な日本語で表す。
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: 私たちの救い主である神
  rationale: σωτήρが神を説明する同格関係を明確にする。
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: 私たちの希望であるメシア・イエス
  rationale: 「私たちの希望」がメシア・イエスを指す同格関係を自然な日本語で保持する。
- source_word: ἐλπίδος
  choice: 希望
  rationale: 将来への確かな期待を含む語義とパウロ書簡での響きを保つ標準的な訳語。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この書簡冒頭でも称号としての意味が保たれているため、意味を訳出した。日本語で一般的な「キリスト」も可能なので脚注に示した。
- issue: 命令を発する主体の関係
  choice: 神とメシア・イエスを並列の主体として訳す
  alternative: 「神の、またメシア・イエスの命令」と反復を補って強調する
  rationale: καίで結ばれた二つの属格句を、一つのἐπιταγήにかかる並列要素として簡潔に保持した。
- issue: 「私たちの希望」とメシア・イエスの関係
  choice: 「私たちの希望であるメシア・イエス」
  alternative: 「メシア・イエス、すなわち私たちの希望」
  rationale: 同格関係を明示しつつ、説明を過度に加えない自然な日本語とした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、書簡冒頭にふさわしい簡潔で品位ある文体とした。日本語の手紙として発信者を示すため末尾を「パウロから」とし、原文の修飾関係は保持した。
