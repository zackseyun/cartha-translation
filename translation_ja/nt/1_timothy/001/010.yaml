  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πόρνοις, ἀρσενοκοίταις, ἀνδραποδισταῖς, ψεύσταις, ἐπιόρκοις, καὶ εἴ τι ἕτερον τῇ ὑγιαινούσῃ διδασκαλίᾳ ἀντίκειται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/010.yaml
  text: the sexually immoral, men who have sex with men,[a] servant traders, liars, perjurers, and whatever else is opposed to sound teaching,
translation:
  language: ja
  text: 性的に不道徳な者、男と性行為をする男[a]、人を奴隷として売買する者、うそをつく者、偽りの誓いをする者、また、そのほか健全な教えに反するもの、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「男どうしで性行為を行う者」。ギリシア語の「アルセノコイタイ」はまれな語で、男性間の性行為を指すと考えられますが、その厳密な範囲については議論があります。
    reason: 語義と適用範囲が議論されている原語について、別訳と不確かさを示すため。
lexical_decisions:
- source_word: πόρνοις
  choice: 性的に不道徳な者
  rationale: 広く性的な不道徳を行う者を指す語であり、婚前性交など特定の行為だけに限定しない、明瞭な現代日本語とした。
- source_word: ἀρσενοκοίταις
  choice: 男と性行為をする男
  rationale: ἄρσην（男）とκοίτη（寝床、性的交わり）から成るまれな語で、現代の性的指向や自己認識のカテゴリーを持ち込まず、男性間の性行為という行動面を表した。語の厳密な範囲には議論があるため注を付した。
- source_word: ἀνδραποδισταῖς
  choice: 人を奴隷として売買する者
  rationale: 人を捕らえ、奴隷にし、または奴隷として取引する者を指す。「誘拐する者」だけに狭めず、人身の奴隷化と売買を明示した。
- source_word: ψεύσταις
  choice: うそをつく者
  rationale: 偽りを語る者を指す直接的で自然な現代日本語。
- source_word: ἐπιόρκοις
  choice: 偽りの誓いをする者
  rationale: 誓いにおいて偽る者を指す。「偽証者」よりも法廷だけに限定されにくく、原語の誓約との関係を明示する。
- source_word: καὶ εἴ τι ἕτερον
  choice: また、そのほか…もの
  rationale: 列挙を同種のあらゆる事柄へ広げる慣用表現として自然に訳した。
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: 健全な教え
  rationale: 「健康である」という比喩的意味を保ちつつ、現代日本語の教会用語としても一般読者向けにも理解しやすい表現とした。
- source_word: ἀντίκειται
  choice: 反する
  rationale: 教えに対立し、相いれないことを簡潔に表す。
theological_decisions:
- issue: ἀρσενοκοίταις の、語義と教理の両面で議論のある訳し方
  choice: 男と性行為をする男
  alternative: 男どうしで性行為を行う者
  rationale: 原語の男性特有の性的行為への言及を保ちながら、現代の性的指向やアイデンティティーを表す語を読み込まないようにした。厳密な適用範囲についての不確かさは脚注で明示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。原文は前節から続く与格の列挙であり、提示された範囲だけでは文が完結しないため、末尾を読点として前後との接続を保った。「性的に不道徳」「性行為」は意味を明確にしつつ、過度に婉曲または俗語的にならない語調とした。
