  text: Οἴδαμεν δὲ ὅτι καλὸς ὁ νόμος ἐάν τις αὐτῷ νομίμως χρῆται,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/008.yaml
  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: ja
  text: 私たちは、律法は、だれかがそれを正しく[a]用いるなら、良いものであると知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「律法にかなって用いるなら」「適切に用いるなら」「正当な仕方で用いるなら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 私たちは……知っています
  rationale: 完了形由来の οἶδα は現在の確かな認識を表すため、現代日本語として自然な「知っています」とした。
- source_word: δὲ
  choice: （独立した接続語を置かない）
  rationale: ここでは弱い移行を示すが、日本語では文脈上明らかであり、「しかし」などを加えると対比を強めすぎるため、無標とした。
- source_word: καλὸς ὁ νόμος
  choice: 律法は……良いものである
  rationale: καλός の広い肯定的評価を「良い」で保ち、ὁ νόμος は範囲を限定せず「律法」とした。
- source_word: ἐάν τις
  choice: ……なら
  rationale: 不特定の人を条件節の暗黙の主語として表す日本語が自然であり、「だれかが」を明示しなくても一般条件の意味は保たれる。
- source_word: αὐτῷ … χρῆται
  choice: それを……用いる
  rationale: 代名詞が律法を指すことを保ち、χράομαι を簡潔で品位ある「用いる」と訳した。
- source_word: νομίμως
  choice: 正しく
  rationale: 「法にかなって」の含意と νόμος との語源的響きはあるが、日本語の「合法的に律法を用いる」は狭義の法令順守に誤解されやすい。文脈で求められる規範にかなった使用を自然に示す「正しく」を採った。
theological_decisions:
- issue: ὁ νόμος の範囲
  choice: 「律法」とだけ訳し、その範囲を本文で特定しない
  alternative: 「モーセの律法」または一般的な「法」
  rationale: 文脈上モーセ律法が念頭にある可能性は高いが、ギリシア語本文自体は限定語を伴わないため、解釈上の余地を残した。
- issue: νομίμως の意味
  choice: 「正しく用いる」
  alternative: 「律法にかなって用いる」「適切に用いる」「正当な仕方で用いる」
  rationale: 律法の正しい用途という意味を明瞭にしつつ、「律法にかなって」が生む循環的・教理的な限定を避けた。語源的な掛詞と別訳は脚注で示した。
translation_notes:
  register: 明瞭な現代標準語。聖書用語として定着した「律法」を用い、「用いる」で簡潔さと品位を保った。脚注記号は該当する条件節の後に置いた。
