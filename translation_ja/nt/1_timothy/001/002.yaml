id: 1TI.1.2
reference: 1 Timothy 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τιμοθέῳ γνησίῳ τέκνῳ ἐν πίστει· χάρις, ἔλεος, εἰρήνη ἀπὸ θεοῦ ⸀πατρὸς καὶ Χριστοῦ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: ja
  text: 信仰における真の子、テモテ[a]へ。父なる神と、私たちの主であるメシア・イエス[b]から、恵みとあわれみと平安がありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰による真の子」とも訳せる。
    reason: ἐν πίστειは、共有する信仰の領域を指すとも、信仰を通して成立する関係を指すとも理解できるため。
  - marker: b
    text: 伝統的な訳では「キリスト・イエス」。「メシア」と「キリスト」は、どちらもΧριστόςを表す。
    reason: 称号Χριστόςの意味を訳す表現と、伝統的な音写に基づく表現の双方を示すため。
lexical_decisions:
- source_word: γνησίῳ
  choice: 真の
  rationale: 真正さと、パウロとテモテの霊的な親子関係の確かさを表す。生物学上の子を意味するとは受け取られにくい自然な表現。
- source_word: τέκνῳ
  choice: 子
  rationale: 性別を語義以上に限定せず、霊的親子関係の比喩を保つ。
- source_word: ἐν πίστει
  choice: 信仰における
  rationale: 信仰を、二人の関係が成り立つ領域または共有される現実として表しつつ、『信仰による』という関係的な含みも排除しない。
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の挨拶における定着した神学的意味を明瞭に伝える。
- source_word: ἔλεος
  choice: あわれみ
  rationale: 神から与えられる慈悲を表し、牧会書簡に特徴的な三項の挨拶を保つ。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの欠如に限られない、神から与えられる健全さと安寧を表す聖書的な定訳。
- source_word: θεοῦ πατρὸς
  choice: 父なる神
  rationale: 日本語として自然であり、神が父であるという原文の関係を簡潔に保つ。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を翻訳し、固有名イエスと区別して明示する。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςの権威とキリスト論的含意を保つ標準的な訳語。
theological_decisions:
- issue: ἐν πίστειが示す関係
  choice: 信仰における真の子
  alternative: 信仰による真の子
  rationale: 共有する信仰の領域を第一に表しながら、信仰を通して成立した霊的親子関係という可能性を脚注で保持する。
- issue: Χριστοῦ Ἰησοῦの訳し方
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστόςを単なる固有名の一部として音写せず、ここでなお認められる称号の意味を読者に伝える。伝統的な言い方は脚注に示す。
- issue: 挨拶文の述語補充
  choice: 恵みとあわれみと平安がありますように
  alternative: 恵み、あわれみ、平安
  rationale: ギリシア語では名詞句だけの挨拶だが、日本語では祈願の述語を補うことで機能を自然かつ明瞭に伝えられる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、書簡冒頭の荘重さを保った。「あわれみ」は漢字を避けて読みやすくし、「メシアであるイエス」によって称号と固有名の関係を自然に示した。
