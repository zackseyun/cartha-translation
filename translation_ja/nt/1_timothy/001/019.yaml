  text: ἔχων πίστιν καὶ ἀγαθὴν συνείδησιν, ἥν τινες ἀπωσάμενοι περὶ τὴν πίστιν ἐναυάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/019.yaml
  text: holding faith and a good conscience[a], which some, having rejected[b], have suffered shipwreck concerning the faith.
translation:
  language: ja
  text: 信仰と正しい良心を保ちなさい。ある人たちは、その良心を退け、信仰において破船しました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その良心」に当たる代名詞は、文法上は直前の「正しい良心」を指すのが最も自然です。ただし、「信仰と正しい良心」の両方をまとめて指すと理解することもできます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχων
  choice: 保ちなさい
  rationale: 現在分詞で、前節から続く勧めの中で継続して保持することを表す。単なる所有を意味する「持つ」よりも、信仰と良心を守り保つという文脈に適する。日本語では独立した節として自然に読めるよう勧告形にした。
- source_word: πίστιν
  choice: 信仰
  rationale: ここではキリスト者の信仰を指すのが最も自然であり、標準的で透明な訳語を用いた。
- source_word: ἀγαθὴν συνείδησιν
  choice: 正しい良心
  rationale: ἀγαθήの道徳的な善さを表し、「やましくない良心」のように主観的な心の平安だけへ意味を狭めない表現とした。
- source_word: ἥν
  choice: その良心を
  rationale: 女性単数の関係代名詞は、直前の女性単数名詞 συνείδησιν を最も自然な先行詞とする。日本語では指示対象を明示しつつ、より広く受け取る可能性を脚注に残した。
- source_word: ἀπωσάμενοι
  choice: 退け
  rationale: 意図的に押しのけ、拒む意味を簡潔に表す。「投げ捨てる」より自然でありながら、主体的な拒絶を保持する。
- source_word: περὶ τὴν πίστιν
  choice: 信仰において
  rationale: 破船が生じた領域・点を示す表現として訳した。定冠詞を伴う πίστις は、ここでは個人的な信頼一般よりもキリスト教信仰を指す。
- source_word: ἐναυάγησαν
  choice: 破船しました
  rationale: 信仰上の破局を航海の遭難にたとえる原文の強い比喩を、そのまま簡潔に保った。
theological_decisions:
- issue: ἥν の先行詞
  choice: 「その良心」として、直接には「正しい良心」を指すとした。
  alternative: 「信仰と正しい良心」の両方をまとめて指すと理解する。
  rationale: ἥν は女性単数で、最も近い女性単数名詞 συνείδησιν と文法上一致する。ただし、意味上は二つを広く受ける解釈も可能なため、脚注で明示した。
- issue: 二度現れる πίστις の意味
  choice: いずれも「信仰」と訳し、後者は文脈上、キリスト教信仰を指すとした。
  alternative: 前者を「信頼」または「忠実」、後者を「信仰の教え」と訳す。
  rationale: 同一節内の反復を保持し、原文が明示しない主観的信頼と信仰内容との区別を本文で固定しないようにした。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った表現。前節から続く分詞を日本語で自然な勧告として示し、「破船」という原文の比喩は弱めずに保持した。
