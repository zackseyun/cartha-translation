reference: 1 Timothy 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: ja
  text: このことを知っています。すなわち、律法は正しい人のために定められているのではなく、律法に背く者や従おうとしない者、不敬虔な者や罪深い者、聖なるものを顧みない者やそれを汚す者、父を殺す者や母を殺す者[a]、殺人をする者のために定められているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父を殴る者や母を殴る者」とも訳せる。ギリシア語は親への激しい暴行を指すこともあるが、ここでは「殺す」という意味である可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: このことを知っていなければなりません
  rationale: 分詞が前の教えを支える認識を示す。日本語では文として自然につなぎ、認識すべき事柄であることを表した。
- source_word: δικαίῳ
  choice: 正しい人
  rationale: 単数の形と代表的・一般的な意味を保ちつつ、現代日本語で自然にした。
- source_word: νόμος οὐ κεῖται
  choice: 律法は…のために定められているのではなく
  rationale: κεῖται の『置かれている、制定されている』という法的な含みを保ち、『適用されない』と解釈的に限定することを避けた。
- source_word: ἀνόμοις
  choice: 律法に背く者
  rationale: 単に律法を持たない者ではなく、法に反する者という道徳的・法的意味を明確にした。
- source_word: ἀνυποτάκτοις
  choice: 従おうとしない者
  rationale: 権威や秩序に服さない反抗的な態度を、一般読者に分かる自然な表現で示した。
- source_word: ἀσεβέσι
  choice: 不敬虔な者
  rationale: 神への畏敬を欠く意味を表す、聖書文体として定着しつつ理解可能な語を用いた。
- source_word: ἁμαρτωλοῖς
  choice: 罪深い者
  rationale: 対句の形を保ち、罪ある性質・行いを示した。
- source_word: ἀνοσίοις
  choice: 聖なるものを顧みない者
  rationale: 聖性に反する意味を伝え、隣接する語との違いも保った。
- source_word: βεβήλοις
  choice: それを汚す者
  rationale: 聖なるものを俗悪に扱い、冒瀆する含意を、直前の表現を受けて自然に示した。
- source_word: πατρολῴαις καὶ μητρολῴαις
  choice: 父を殺す者や母を殺す者
  rationale: 語は親への殴打・暴行を指す可能性もあるが、殺人者が続く文脈では殺害の意味が有力である。別の可能性は脚注に残した。
- source_word: ἀνδροφόνοις
  choice: 人を殺す者
  rationale: 不法な殺人を行う者という意味を、簡明で現代的な日本語で示した。
theological_decisions:
- issue: δικαίῳ の単数男性形と一般的用法
  choice: 正しい人
  alternative: 正しい者
  rationale: ギリシア語の単数性を保ちながら、男性だけに限定しない代表的な用法を自然な日本語で表した。
- issue: πατρολῴαις／μητρολῴαις の意味範囲
  choice: 父を殺す者／母を殺す者
  alternative: 父を殴る者／母を殴る者
  rationale: 親への暴行と親殺しの両方が語義上可能である。直後の『人を殺す者』との並びから殺害を本文に採り、曖昧さを脚注で明示した。
- issue: 律法が『正しい人のために定められていない』という表現
  choice: 原文どおり目的・対象の対比として訳す
  alternative: 正しい人には律法が適用されない
  rationale: 『適用されない』では律法と正しい人の関係を過度に断定するため、κεῖται の制定・設定という比喩を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、律法、不敬虔、聖なるものなどの聖書的概念は格調を損なわない表現にした。原文の一連の対句を読みやすく展開し、節単独でも完結するよう述語を補った。
