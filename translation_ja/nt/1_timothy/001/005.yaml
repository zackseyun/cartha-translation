source:
  edition: SBLGNT
  text: τὸ δὲ τέλος τῆς παραγγελίας ἐστὶν ἀγάπη ἐκ καθαρᾶς καρδίας καὶ συνειδήσεως ἀγαθῆς καὶ πίστεως ἀνυποκρίτου,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/005.yaml
  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: ja
  text: この指示[b]の目的[a]は、清い心と正しい良心と偽りのない信仰[c]から生まれる愛です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「目的」は「目標」または「行き着くところ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「指示」は「命令」または「指令」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「偽りのない信仰」は「偽善のない信仰」とも訳せる。ここで「信仰」と訳した語は、文脈によっては「忠実さ」または「信頼」を意味することもある。
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: 目的
  rationale: ここでは指示の終了ではなく、それが目指すところを表す。「目的」はこの意図を現代日本語で自然に伝える。
- source_word: παραγγελίας
  choice: 指示
  rationale: 命令、申しつけ、指示を意味し得る。直前の文脈でテモテに託された務めを指すため、「指示」とした。
- source_word: ἀγάπη
  choice: 愛
  rationale: 語の基本的な意味を保ち、この節の倫理的な中心を明確に示す。
- source_word: ἐκ
  choice: から生まれる
  rationale: 愛の源・由来を示すἐκの働きを、自然な日本語で明確にした。
- source_word: καθαρᾶς καρδίας
  choice: 清い心
  rationale: 内面的、道徳的な清さを簡潔かつ自然に表す。
- source_word: συνειδήσεως ἀγαθῆς
  choice: 正しい良心
  rationale: 「良い良心」より自然でありつつ、ἀγαθῆςの肯定的・道徳的な意味を保つ。「やましくない良心」ほど結果に限定しない。
- source_word: πίστεως
  choice: 信仰
  rationale: この文脈で最も可能性の高い意味を採った。ただし「忠実さ」や「信頼」の可能性も注で残した。
- source_word: ἀνυποκρίτου
  choice: 偽りのない
  rationale: 偽善的でない、真正な、という意味を、現代日本語で自然かつ明瞭に表す。
- source_word: δὲ
  choice: 訳語を明示しない
  rationale: 軽い移行または対照を示すが、日本語では文脈上、接続語を置かないほうが自然である。
theological_decisions:
- issue: πίστεως ἀνυποκρίτουにおけるπίστιςの意味
  choice: 偽りのない信仰
  alternative: 偽りのない忠実さ／偽りのない信頼
  rationale: ここでは愛が生じる源の一つとして真正な信仰を指す可能性が高い。ただしπίστιςの語義範囲には「忠実さ」「信頼」も含まれるため、本文で一義的に排除せず注に示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「から生まれる」を補って三つの属格句が愛の源を示す構造を自然に表した。接続詞δὲは軽い談話上の移行にとどまるため、不要な「さて」「しかし」を加えなかった。
