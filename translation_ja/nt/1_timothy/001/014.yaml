source:
  edition: SBLGNT
  text: ὑπερεπλεόνασεν δὲ ἡ χάρις τοῦ κυρίου ἡμῶν μετὰ πίστεως καὶ ἀγάπης τῆς ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: ja
  text: しかし、私たちの主の恵みは、メシアであるイエス[a]にある信仰と愛とともに、この上なく満ちあふれました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエス」。
    reason: Χριστόςについて、称号の意味を訳した「メシア」と、日本語で定着した音訳「キリスト」の双方が可能なため。
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: この上なく満ちあふれました
  rationale: 接頭辞によって強められた「増し加わる、豊かになる」という意味を、誇張的な造語を避けつつ自然な現代日本語で表した。主語である「恵み」が豊かに満ちるという能動形も保っている。
- source_word: δὲ
  choice: しかし
  rationale: 直前の罪と不信仰についての叙述との対照を明確にする。
- source_word: ἡ χάρις τοῦ κυρίου ἡμῶν
  choice: 私たちの主の恵み
  rationale: χάριςを新約聖書で定着した「恵み」、κύριοςを称号としての「主」とし、属格関係を簡潔に保った。
- source_word: μετὰ πίστεως καὶ ἀγάπης
  choice: 信仰と愛とともに
  rationale: μετά＋属格の随伴の意味を保ち、恵みが信仰と愛を伴って満ちあふれたという構文を過度に因果関係へ解釈しない。
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにある
  rationale: 定冠詞付きの句が「信仰」と「愛」の双方を修飾する関係を自然に表した。ἐνの神学的・関係的な含みを限定せず、「にある」とした。
- source_word: Χριστῷ Ἰησοῦ
  choice: メシア・イエス
  rationale: Χριστόςの称号としての意味を明示し、Ἰησοῦとの語順も保った。日本語で広く定着した別表現は脚注に示した。
theological_decisions:
- issue: 「信仰と愛とともに」と「恵み」の関係
  choice: 主の恵みが、メシア・イエスにある信仰と愛を伴って満ちあふれたと訳す。
  alternative: 信仰と愛を、恵みがパウロの内に生み出した結果として明示する。
  rationale: μετά句は文法上、満ちあふれた恵みに随伴するものとして読むのが自然である。一方、恵みが信仰と愛を生み出したという含意はあり得るが、本文では因果関係を明示せず、解釈の余地を保った。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所でもΧριστόςの称号としての意味を訳文に表した。ただし、日本語聖書で定着した「キリスト・イエス」も可能なため脚注に示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「この上なく満ちあふれました」により強意動詞を自然に表し、「にある」はパウロ書簡特有の関係的表現を説明しすぎず保持した。
