lexical_decisions:
- source_word: ὧν
  choice: これらから
  rationale: 属格複数の関係代名詞で、直前の5節にある愛、その源となる清い心、正しい良心、偽りのない信仰を受ける。日本語では指示表現にして、何を指すかを不必要に限定せず、前文とのつながりを明確にした。
- source_word: τινες
  choice: ある人々
  rationale: 特定されていない一部の人々を指す不定代名詞。現代日本語として自然であり、原文の非特定性を保つ。
- source_word: ἀστοχήσαντες
  choice: 外れ
  rationale: 目標を外す、到達し損なう、道から外れるという意味を持つ。属格のὧνと合わせて「これらから外れ」とし、逸脱の比喩を保ちながら自然な日本語にした。
- source_word: ἐξετράπησαν
  choice: それてしまいました
  rationale: 正しい進路から別の方向へ向かうことを表す。前の「外れ」と重なりつつ進行方向の変化を示す原文を保ち、「しまいました」で生じた結果と否定的含意を自然に表した。
- source_word: εἰς
  choice: へと
  rationale: ある状態・活動への方向または結果を示す。「それる」と結びつけて移行先を明確にした。
- source_word: ματαιολογίαν
  choice: むなしい議論
  rationale: 実りも有益な内容もない発言や論議を表す。「むなしい議論」は文脈上の偽りの教えに関する論議を自然に示しつつ、単なる無意味な音声に限定しない。
theological_decisions:
- issue: 関係代名詞ὧνの指示内容
  choice: 直前の5節に示された倫理的・霊的な事柄を「これら」と総括して受ける。
  alternative: 「清い心、正しい良心、偽りのない信仰」という三つだけを直接指すと限定する、または形式的に「それらから」と訳す。
  rationale: 構文は前節に依存しているが、指示対象の範囲を原文以上に狭く確定すべきではない。「これら」は後方照応を明確にしながら、その範囲に残る曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい落ち着いた文体と敬体を採用した。「外れ」と「それて」は意味が近いが、原文にある二つの動詞と、目標から外れて別方向へ進む流れを保持するため両方を残した。
