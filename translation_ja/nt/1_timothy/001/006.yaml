  source_fidelity: ἀστοχήσαντες is better represented as 「これらを見失い」 than 「これらから外れ」. The former preserves the verb's miss-the-goal sense without making the following directional verb needlessly repetitive. ἐξετράπησαν retains its sense of turning/deviating toward empty discourse in 「むなしい議論へとそれていきました」.
  naturalness: The draft is generally clear, but 「これらから外れ、…へとそれてしまいました」 repeats nearly the same Japanese expression and 「しまいました」 adds an avoidable emotive/resultative nuance. The revision is smoother modern standard Japanese while retaining the two-step movement in the Greek.
  terminology: 「むなしい議論」 is an appropriate contextual rendering of ματαιολογίαν, which denotes futile or empty discourse. 「ある人々」 suitably preserves the nonspecific τινες.
  issues:
  - severity: medium
    issue: 「これらから外れ」と「それてしまいました」の表現が重複している。
    rationale: 原文には異なる二動詞があるが、ἀστοχέωは特に目標を外す／見失う意味を持つ。両方を「外れる・それる」とすると日本語では不自然に重なり、語義上の区別も薄れる。
  - severity: low
    issue: 「しまいました」が原文にない話し手の評価的・遺憾の含意を加える。
    rationale: 否定的文脈はματαιολογίαν自体で十分に示されるため、結果を述べる過去形にとどめるほうが対応が直接的である。
  - severity: low
    issue: 脚注aの別訳「これらを目指しながら外し」が現代日本語として不自然である。
    rationale: 語彙的代案としては「これらを見失い」または「これらから逸脱し」のほうが明瞭である。
  revised_text: ある人々は、これらを見失い[a]、むなしい議論[b]へとそれていきました。
