id: 1TI.1.17
reference: 1 Timothy 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: ja
  text: すべての時代の王、朽ちることのない、目に見えない唯一の神[a]に、世々限りなく誉れと栄光がありますように。アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「唯一の知恵深い神」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: すべての時代の王
  rationale: 属格構文とαἰώνの複数形を反映し、神があらゆる時代にわたって王であることを自然な現代日本語で表した。「永遠の王」より原文の「時代」の表象を明確に残す。
- source_word: ἀφθάρτῳ
  choice: 朽ちることなく
  rationale: 腐敗や滅びに服さない性質を表す。神について「不死」とするよりも原語の意味幅を保ち、「不朽」より一般読者に分かりやすい。
- source_word: ἀοράτῳ
  choice: 目に見えない
  rationale: 神が視覚によって捉えられないことを、明瞭で自然な日本語で表す。
- source_word: μόνῳ θεῷ
  choice: 唯一の神
  rationale: SBLGNT本文の形容詞と名詞を簡潔に反映し、明示された唯一神信仰をそのまま保つ。
- source_word: τιμὴ καὶ δόξα
  choice: 誉れと栄光
  rationale: 頌栄の文脈にふさわしい定着した対応であり、τιμήとδόξαを区別して表す。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 終わりのない持続を表す原語の慣用句を、聖書の頌栄として自然かつ格調ある日本語にした。
- source_word: ἀμήν
  choice: アーメン
  rationale: 日本語の聖書と礼拝で定着した音写を用いた。
- source_word: δὲ
  choice: 無訳
  rationale: ここでは頌栄への移行を示す弱い接続辞であり、日本語で「さて」「しかし」などを加えると関係を過度に限定するため、文脈上自然に省略した。
theological_decisions:
- issue: μόνῳ θεῷの唯一神的表現を、他の神学的主張との関係で補足するか
  choice: 「唯一の神」と直接訳し、本文中で説明を加えない
  alternative: 「神だけに」
  rationale: 原文の明示的な唯一神告白を保ち、三位一体論などによる補足や限定を本文へ持ち込まない。
- issue: μόνῳの後にσοφῷ（「知恵ある」）を含む異読
  choice: 本文では「知恵ある」を採用せず、脚注に示す
  alternative: 「唯一の知恵ある神」
  rationale: 指定されたSBLGNT本文にはσοφῷがないため本文はその読みに従う一方、伝統的に知られた異読は脚注で保存する。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、頌栄にふさわしい品位を保った。「世々限りなく」「誉れ」は文脈上自然な範囲の格調ある表現である。
