id: 1TI.1.16
reference: 1 Timothy 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: ja
  text: しかし、私があわれみを受けたのは、まさにこのためです。すなわち、罪人の中で最たる者である私[a]のうちに、キリスト・イエス[b]がその忍耐を余すところなく示し、私を、後にこの方を信じて永遠のいのちに至る人々のための模範とするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「最たる者である私」。文脈上、直前の「罪人の中で最たる者」（15節）を受けています。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト」は「メシア（油を注がれた者）」を意味する称号です。別訳「メシアであるイエス」。
    reason: alternative_rendering
lexical_decisions:
- source_word: ἠλεήθην
  choice: あわれみを受けた
  rationale: 受動形を保ちつつ、行為者を本文以上に特定しない自然な日本語とした。
- source_word: πρώτῳ
  choice: 最たる者
  rationale: 直訳の「第一の者」が文脈上表す、罪人の中で筆頭にある者という意味を、15節とのつながりを保って表した。
- source_word: ἐνδείξηται
  choice: 示し
  rationale: 目的を表すἵνα節内の語として、忍耐がパウロの身に明らかに現される意味を簡潔に表した。
- source_word: Χριστὸς Ἰησοῦς
  choice: キリスト・イエス
  rationale: 日本語で定着した聖書的称号を用い、キリストが固有名ではなく「メシア」を意味する称号であることを脚注で明示した。
- source_word: τὴν ἅπασαν μακροθυμίαν
  choice: その忍耐の限り
  rationale: ἅπασανの全体性・強意と、μακροθυμίαの辛抱強く耐え忍ぶ意味を、自然で格調ある日本語にした。
- source_word: ὑποτύπωσιν
  choice: 模範
  rationale: 後に信じる人々に示される型・実例という意味を、現代日本語で理解しやすく表した。
- source_word: τῶν μελλόντων πιστεύειν
  choice: これからこの方を信じる人々
  rationale: パウロがあわれみを受けた時点から見た将来性を保ち、「信じようとしている」と意志や目前性に狭めなかった。
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: この方を信じて
  rationale: ἐπί＋与格が表す、イエスに信頼を置くことを、日本語の標準的な信仰表現で示した。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 永遠のいのちに至る
  rationale: εἰςの方向・到達点を保ち、信じることが永遠のいのちへ向かう構文を自然に表した。
theological_decisions:
- issue: πρώτῳが示す範囲
  choice: 「罪人の最たる者」として15節を明示的に受ける
  alternative: 単に「第一の者である私」とする
  rationale: 直前の15節の「罪人の中で最たる者」を受けることが文脈上明白であり、日本語では補わないと何の第一か不明瞭になる。ただし語義上の幅は脚注に残した。
- issue: あわれみと忍耐の行為者
  choice: あわれみの受動文では行為者を明示せず、目的節ではキリスト・イエスを忍耐を示す主体とする
  alternative: あわれみを示した主体も明示的にキリスト・イエスとする
  rationale: ἠλεήθηνは行為者を明記しない一方、ἐνδείξηταιの主語はΧριστὸς Ἰησοῦςであるため、原文の区別を保った。
- issue: Χριστόςの称号性
  choice: 本文は「キリスト・イエス」、脚注で「メシア」の意味を示す
  alternative: 「メシアであるイエス」
  rationale: 日本語で定着した表現を保ちながら、称号の意味を不透明にしないよう脚注を付した。
- issue: 模範となるもの
  choice: キリストがパウロの身に忍耐を示した出来事全体を、後の信者のための模範とする
  alternative: パウロ自身だけを模範とする
  rationale: πρὸς ὑποτύπωσινは直前の忍耐の顕示全体に結びつき得るため、「そのこと」として関係を明らかにしつつ、パウロ個人の徳を模範とする意味には限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡にふさわしい端正さを保った。「私の身に」でἐν ἐμοὶの出来事の場としてのニュアンスを残し、「そのこと」を補って長い目的構文の関係を日本語で明確にした。
