id: 1TI.1.18
reference: 1 Timothy 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: ja
  text: わが子テモテよ。私は、以前あなたについて[a]語られた預言に基づいて、この命令をあなたに託します。それは、あなたがそれらによって[b]、立派な戦いを戦う[c]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたに向けて」、またはテモテの上で語られたという意味で「あなたの上に」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「それらを通して」、または「それらのうちにあって」とも訳せる。ギリシア語は、預言が戦いの手段であることも、その戦いが行われる領域・規準であることも表し得る。
    reason: lexical_alternative
  - marker: c
    text: 伝統的には「良い戦いを戦う」。ここで「戦い」と訳したギリシア語は、より広く「戦役」や「軍務」を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: 命令
  rationale: 権威を伴う指示・委託事項を表す語であり、文脈の厳粛さを保ちつつ、現代日本語で明瞭に伝える。
- source_word: παρατίθεμαί
  choice: 託します
  rationale: 単に提示するのではなく、相手の責任に委ねるという中態の含みを自然に表す。
- source_word: τέκνον Τιμόθεε
  choice: わが子テモテよ
  rationale: τέκνονの親愛を込めた家族的呼びかけを、実子と断定せず自然な日本語で表す。
- source_word: κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας
  choice: 以前あなたについて語られた預言に基づいて
  rationale: κατάの基準・対応関係と、προαγούσαςの時間的先行を明示する。ἐπὶ σέの解釈幅は脚注に残す。
- source_word: ἐν αὐταῖς
  choice: それらによって
  rationale: 預言を戦いの手段または導きとして読む用法を本文に採ったが、領域を示す可能性も脚注で保持する。
- source_word: τὴν καλὴν στρατείαν
  choice: 立派な戦い
  rationale: καλόςの価値判断と軍事的比喩を、一般読者に理解しやすい表現で保持する。単なる一回の格闘より広い『戦役・軍務』の含みは脚注で示す。
theological_decisions:
- issue: 預言とテモテへの委託との関係
  choice: 以前の預言が、パウロの現在の命令を託す根拠または規準となっていると表現する。
  alternative: 預言がテモテを正式に按手・任職した、または単に私的に励ましたと特定する。
  rationale: 本文は預言と命令の密接な関係を示すが、その制度的・礼典的な性格までは明言していないため、特定の教会論を補わない。
- issue: ἐν αὐταῖςが示す預言の働き
  choice: 本文では手段として『それらによって』とする。
  alternative: 領域・規範として『それらのうちにあって』『それらに従って』とする。
  rationale: ギリシア語のἐνは手段と領域の双方に解し得るため、本文で自然な一案を採り、別案を脚注に残す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロの親愛を込めた呼びかけと厳粛な委託の調子を保った。「戦いを戦う」という重なりは原文の同根語による軍事的比喩を映すために残し、過度に古風な語彙は避けた。
