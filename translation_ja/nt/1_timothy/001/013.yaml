  text: ⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/013.yaml
  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: ja
  text: 私は以前、冒瀆する者、迫害する者、暴力を振るう者でした。[a] しかし、無知のまま、不信仰のうちにそうしたので、あわれみを受けました。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「侮辱的に振る舞う者」または「横暴な者」とも訳せる。この語は、単なる高慢ではなく、他者を侮辱し傷つける乱暴な振る舞いを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「不信仰のうちに」。また、「不信実のうちに」とも訳し得る。ここでは、信仰がなかったことを指す可能性が高い。
    reason: lexical_alternative
  - marker: c
    text: 「無知であったため」または「知らないまま」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: 私は以前……者でした
  rationale: 前節のパウロを受ける対格の分詞句であり、以前の状態を表す。日本語では主語を補い、「以前……でした」とすることで自然にその意味を保った。
- source_word: βλάσφημον
  choice: 神を冒瀆する者
  rationale: ここでは人を表す名詞的な用法。「冒瀆する者」だけでは対象が曖昧になりやすいため、文脈上の意味を明確にして「神を」を補った。
- source_word: διώκτην
  choice: 迫害する者
  rationale: 教会と信徒に対するパウロのかつての行為を表す標準的で明瞭な訳。
- source_word: ὑβριστήν
  choice: 暴力を振るう者
  rationale: 侮辱を伴う乱暴で加害的な振る舞いを指す。「高慢な者」に狭めず、現代日本語で分かりやすく表した。
- source_word: ἠλεήθην
  choice: あわれみを受けました
  rationale: 神のあわれみを受けたことを表す受動形を、自然な日本語で保持した。
- source_word: ὅτι
  choice: ので
  rationale: 理由・根拠を導く語として訳し、原文の因果的なつながりを保った。無知があわれみに値したという意味までは付加しない。
- source_word: ἀγνοῶν ἐποίησα
  choice: 知らずに行った
  rationale: 分詞と動詞の組み合わせを簡潔に表し、無知な状態でその行為をしたという意味を保った。目的語は文脈から理解できるため補わなかった。
- source_word: ἐν ἀπιστίᾳ
  choice: 信じておらず
  rationale: ここでは契約への不忠実よりも、信仰・信頼の欠如を表す可能性が高い。日本語では「不信仰のうちに」より自然な表現とした。
theological_decisions:
- issue: ὅτιが導く内容と、あわれみとの関係
  choice: 「信じておらず、知らずに行ったので」と理由を示す
  alternative: 単なる付帯状況として「信じておらず、知らずに行ったのですが」とする
  rationale: ὅτιの自然な因果的・説明的用法を保つ一方、無知が功績となってあわれみを獲得した、あるいは責任を免除したとは訳文に付加しない。原文にある神学的な緊張をそのまま残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「冒瀆」「迫害」「あわれみ」という聖書本文にふさわしい語調を保った。列挙の反復は「……する者」でそろえ、原文の重みを残した。因果関係は日本語として自然な語順に組み替えたが、無知とあわれみの関係を教理的に解消していない。
