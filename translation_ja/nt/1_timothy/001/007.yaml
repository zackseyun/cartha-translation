source:
  edition: SBLGNT
  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: ja
  text: 律法の教師[a]になりたがっている者たちですが、自分たちの言っていることも、確信をもって主張している事柄も理解していません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法の教師」とは、ユダヤの律法（トーラー）を教える権威があると自任する人々を指すと考えられます。
    reason: cultural_note
  - marker: b
    text: 別訳：「自分たちの言うことも、確信をもって断言することも理解していません。」
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλοντες εἶναι
  choice: なりたがっています
  rationale: 継続的な願望を表す現在分詞と補足的不定詞を、前節から続く主語に自然につながる現代日本語で表した。
- source_word: νομοδιδάσκαλοι
  choice: 律法の教師
  rationale: 複合名詞の意味を簡潔に保ち、本文では「モーセの律法」や「トーラー」と限定しすぎない。
- source_word: μὴ νοοῦντες
  choice: 理解していません
  rationale: 願望との逆接関係は「が」で示し、分詞の否定を自然な日本語の述語として表した。
- source_word: μήτε ... μήτε
  choice: …も、…も…ません
  rationale: 二つの対象をともに否定するギリシャ語の相関表現を、日本語で自然な並列否定にした。
- source_word: ἃ λέγουσιν
  choice: 自分の言っていること
  rationale: 発言内容を指す関係節を自然に訳し、主語との関係を明確にするため「自分の」を補った。
- source_word: περὶ τίνων διαβεβαιοῦνται
  choice: 確信をもって主張している事柄
  rationale: περίが示す話題・対象と、διαβεβαιοῦνταιの強く確信をもって断言する語感を併せて表した。
theological_decisions:
- issue: νομοδιδάσκαλοιにおける「律法」の指示対象
  choice: 本文では「律法の教師」と訳す
  alternative: 「モーセの律法の教師」または「トーラーの教師」
  rationale: 文脈上はユダヤの律法を指す可能性が高いが、ギリシャ語本文自体は指示対象を明示していないため、本文では限定せず、注で有力な背景を示す。
- issue: 分詞 μὴ νοοῦντες の論理関係
  choice: 「が」によって逆接的に表す
  alternative: 「理解しないまま」
  rationale: 教師になろうとする願望と理解の欠如との対照を文脈に即して明確にする一方、原因などの意味は加えない。
translation_notes:
  register: 明快で現代的ながら品位のある文体。「なりたがっています」は θέλοντες の願望を率直に伝え、「確信をもって主張する」で διαβεβαιοῦνται の強い断言の語感を保った。注記記号は関連箇所に配置した。
