source:
  edition: SBLGNT
  text: μηδὲ προσέχειν μύθοις καὶ γενεαλογίαις ἀπεράντοις, αἵτινες ⸀ἐκζητήσεις παρέχουσι μᾶλλον ἢ οἰκονομίαν θεοῦ τὴν ἐν πίστει—
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/004.yaml
  text: nor to pay attention to myths and endless genealogies[c][b][a], which promote speculations rather than the stewardship from God that is by faith—
translation:
  language: ja
  text: また、作り話や果てしない系図に注意を向けないように命じなさい。それらは、信仰による神のご計画[b][c]を進めるよりも、むしろ無益な詮索[a]を引き起こします。—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「無益な詮索」は、「論争」「探究」「憶測」とも訳せる。ここでは実を結ばない問いや議論を指す。
    reason: lexical_alternative
  - marker: b
    text: 「神のご計画」は、「神の管理」「神から委ねられた務め」とも訳せる。ギリシア語は、管理、務め、秩序ある計画を意味し得る。
    reason: lexical_alternative
  - marker: c
    text: 「信仰による」は、「信仰のうちに」とも訳せる。「信仰」には文脈により「信頼」や「忠実さ」の含みもあり得る。
    reason: alternative_reading
lexical_decisions:
- source_word: προσέχειν
  choice: 心を奪われる
  rationale: 単に聞くことではなく、注意を向けて没頭する含みを、自然な現代日本語で表した。文法上は前節の命令内容を継続する。
- source_word: μύθοις
  choice: 作り話
  rationale: 神話体系に限定せず、根拠のない物語という文脈上の否定的意味を明瞭に伝える。
- source_word: γενεαλογίαις ἀπεράντοις
  choice: 果てしない系図
  rationale: ἀπέραντοςの終わりなく続く性質と、実りのない議論を招く否定的響きを保つ。
- source_word: ἐκζητήσεις
  choice: 無益な詮索
  rationale: 本文の対比から明らかな否定的性格を示しつつ、探究・論争・憶測という語義の幅を狭めすぎない表現とした。
- source_word: παρέχουσι
  choice: 引き起こします
  rationale: 「もたらす」「生じさせる」という使役的意味を自然に表す。
- source_word: μᾶλλον ἢ
  choice: ……よりも、むしろ
  rationale: 二つの結果を対照させる比較構文を明確に再現する。
- source_word: οἰκονομίαν θεοῦ
  choice: 神のご計画
  rationale: οἰκονομίαの「管理・務め・秩序ある計画」という意味領域のうち、文脈に自然な表現を本文に採用した。ただし語義と属格の曖昧さは脚注に残す。
- source_word: τὴν ἐν πίστει
  choice: 信仰による
  rationale: 前置詞句がοἰκονομίαを限定する関係を自然に示し、πίστιςは基本訳「信仰」とした。
theological_decisions:
- issue: οἰκονομίαν θεοῦ の意味と属格関係
  choice: 神のご計画
  alternative: 神による管理／神から委ねられた務め
  rationale: 救いに関する神の秩序ある働きという理解に適するが、語が管理や委託された務めを指す可能性もあるため、脚注で幅を保った。
- issue: πίστει の意味
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: この箇所では通常の「信仰」が十分に適合する一方、語の意味範囲にある「信頼」「忠実さ」も脚注に示した。
- issue: ἐκζητήσεις の否定的性格
  choice: 無益な詮索
  alternative: 論争／探究／憶測
  rationale: 作り話や系図が神の働きと対比されているため否定的含意を明示したが、具体的に論争だけを指すとは断定しない。
translation_notes:
  register: 明瞭で現代的だが、聖書本文としての品位を保つ。「命じなさい」は前節から続く不定詞の統語関係を補って独立節として読めるようにした。末尾のダッシュは文が次節へ続くことを示す。脚注記号は対応語句との近接性を優先して文末にまとめた。
