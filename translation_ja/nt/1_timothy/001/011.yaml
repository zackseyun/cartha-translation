id: 1TI.1.11
reference: 1 Timothy 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατὰ τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ, ὃ ἐπιστεύθην ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/011.yaml
  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: ja
  text: それは、祝福に満ちた神の栄光の福音[a]に基づくものです。この福音は、私に委ねられました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より慣用的には、「祝福に満ちた神の栄光ある福音」。
    reason: 属格 τῆς δόξης を形容詞的に理解する別訳。
lexical_decisions:
- source_word: κατὰ
  choice: に基づく
  rationale: 対格を伴い、直前の内容を判定する規準を示す。「に従って」より現代日本語として自然でありながら、規準・一致の意味を保つ。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: パウロ書簡における定着した訳語であり、単なる一般的な「良い知らせ」以上の文脈上の重みを保つ。
- source_word: τῆς δόξης
  choice: 栄光の
  rationale: 属格の形を保ち、「栄光に満ちた」と形容詞的に限定せず、神の栄光を内容・帰属とする可能性を残す。
- source_word: μακαρίου
  choice: 祝福に満ちた
  rationale: 神についての μακάριος は、神が賛美されるべき方であることに加え、完全な幸いを備える方という意味を帯びる。「幸福な」は軽く響き、「祝福された」は神が他者から祝福を受けたかのような誤解を招きうるため、この表現を採る。
- source_word: θεοῦ
  choice: 神の
  rationale: 属格を自然な日本語の連体修飾で表す。
- source_word: ὃ
  choice: この福音を
  rationale: 関係代名詞の先行詞が福音であることを明示し、日本語で自然な独立文につなぐ。
- source_word: ἐπιστεύθην
  choice: 私は委ねられました
  rationale: ここでの受動形は「信じた」ではなく、務めまたは託されたものを「委ねられた」の意。日本語では人を主語にして目的語を伴う受動表現が原文の構造と強調をよく伝える。
- source_word: ἐγώ
  choice: 私は
  rationale: 明示された代名詞の強調を、主題を表す「私は」によって保持する。
theological_decisions:
- issue: τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ における属格の関係
  choice: 祝福に満ちた神の栄光の福音
  alternative: 祝福に満ちた神の栄光ある福音
  rationale: 原文の連続する属格をできるだけ保持し、福音が「栄光ある」という形容詞的解釈だけに限定しない。より慣用的な理解は脚注に示す。
- issue: ἐπιστεύθην の意味
  choice: 委ねられました
  alternative: 信じました
  rationale: πιστεύω は通常「信じる」だが、この受動構文では福音を託されることを表す。パウロの福音宣教の委託という文脈にも適合する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。前節から続く κατὰ を受けるため「それは」で接続し、長い属格句と関係節は二文に分けて可読性を確保した。
