  source_fidelity: κατὰは前節の内容を受ける規準を示しており、「それは、…に基づくものです」は文脈上許容されます。『祝福に満ちた神の栄光の福音』は、τῆς δόξηςの属格的表現を保ち、μακαρίουを神について不自然に軽くせずに訳しています。ὃは福音を指し、ἐπιστεύθηνはここでは「信じた」ではなく、福音を託されたという受動の意味です。
  naturalness: 現行の第二文『この福音を、私は委ねられました』は、「委ねる」の受動において委ねられる物を「は」、受け手を「に」で表す必要があり、現代標準日本語として不自然です。『この福音は、私に委ねられました』とすれば自然かつ明瞭です。
  terminology: 「福音」「神」「栄光」は安定した適切な用語です。「祝福に満ちた」はμακάριοςに対する既存の選択として文脈に適合しています。脚注の「栄光ある福音」は、属格を形容詞的に取る慣用的な別訳として適切です。
