id: 1TI.1.15
reference: 1 Timothy 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: ja
  text: 「これは信頼できることばであり、全面的に受け入れるに値します。すなわち、メシア・イエス[a]は罪人たちを救うために世に来られました。その中で私が最たる者です[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエス」。
    reason: alternative_reading
  - marker: b
    text: 直訳「私が第一です」。または「私が最悪の者です」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: これは信頼できることばです
  rationale: 牧会書簡に見られる定型句として、直前または直後の要約的宣言を「ことば」として示す。πιστόςの信頼性を自然な現代日本語で表した。
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: 全面的に受け入れるに値します
  rationale: πάσηςの強意とἀποδοχήの「受容」を保ちつつ、明瞭で自然な日本語とした。
- source_word: ὅτι
  choice: すなわち
  rationale: ここでは理由ではなく、信頼できる「ことば」の内容を導入するため、日本語では「すなわち」が明確で自然である。
- source_word: Χριστὸς Ἰησοῦς
  choice: メシア・イエス
  rationale: Χριστόςの称号としての意味を明示し、Ἰησοῦςは固有名として音訳した。慣用的な「キリスト・イエス」も脚注に残した。
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: 世に来られました
  rationale: 原文の移動表現と神学的含意を過度に説明せず保持する。主語への敬意を自然な日本語の尊敬表現で示した。
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: 罪人たちを救うために
  rationale: 目的を表す不定詞と、救済の文脈におけるσῴζωの標準的な意味を簡潔に表した。
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: その罪人たちの中で、私が第一です
  rationale: πρῶτοςの順位・筆頭という比喩を保持し、「最悪」と解釈的に限定しなかった。ἐγώの強調は「私が」で表した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この告白的表現でも称号の意味が認められるため「メシア」としたが、名前化した慣用表現「キリスト・イエス」も可能なので脚注に示した。
- issue: πρῶτοςが示す罪人としての位置
  choice: 第一
  alternative: 最たる者／最悪の者
  rationale: 原文は「最悪」と明言せず、順位・筆頭を表し得る。意味の緊張を保つため本文では形式に近い「第一」とし、自然な解釈候補を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、定型的な宣言にふさわしい簡潔で格調ある調子とした。「である」調より一般読者に近い丁寧体を採用し、原文の強調と曖昧さは本文と脚注で保持した。
