id: 1TI.1.12
reference: 1 Timothy 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: ja
  text: 私を強くしてくださった私たちの主、メシアであるイエス[a]に、感謝します。主は私を忠実な者と見なし、奉仕の務め[b]に任じてくださったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト・イエス」。ギリシア語の称号「クリストス」は「メシア（油を注がれた者）」という意味で、伝統的に「キリスト」とも表される。
    reason: alternative_reading
  - marker: b
    text: または「奉仕」。ギリシア語の「ディアコニア」は、広く奉仕や務めを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: 私は感謝しています
  rationale: 「感謝を抱く／表す」という慣用表現を、明瞭で自然な現代日本語にした。与格句によって感謝の相手が示されている。
- source_word: ἐνδυναμώσαντί με
  choice: 私を強くしてくださった
  rationale: 力を与えて務めを可能にしたという意味を保ちつつ、特定の種類の霊的賦与や職権授与に限定しない表現とした。
- source_word: Χριστῷ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςが称号として持つ意味を明示し、日本語で不自然になりやすい「メシア・イエス」を避けた。「キリスト・イエス」は脚注に示した。
- source_word: τῷ κυρίῳ ἡμῶν
  choice: 私たちの主
  rationale: キリストの権威を表す称号として、確立した自然な訳語「主」を用いた。
- source_word: πιστόν
  choice: 忠実な者
  rationale: 託された働きにおける信頼性と忠実さを表す。単に能力があるという意味には狭めていない。
- source_word: ἡγήσατο
  choice: 見なし
  rationale: 「考える、評価する、認める」の意味を簡潔に表し、法廷的な「裁く」という含みを避けた。
- source_word: θέμενος εἰς διακονίαν
  choice: 奉仕の務めに就かせてくださった
  rationale: 直訳的な「奉仕へ置く」が文脈上示す任命・配置を自然な日本語で表現した。後代の特定の教会職制に限定しないよう「奉仕の務め」とした。
theological_decisions:
- issue: Χριστόςの称号性
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: 称号の意味を日本語で明示しつつ、イエスの固有名の一部としてのみ受け取られないようにした。伝統的な音写は脚注で保持した。
- issue: パウロが奉仕へ任じられたことのニュアンス
  choice: 奉仕の務めに就かせてくださった
  alternative: 奉仕に就かせてくださった／務めに任命してくださった
  rationale: θέμενοςの任命・配置の含みとδιακονίαの広い奉仕概念をともに伝え、特定の聖職位への任命とは断定しない。
- issue: πιστόνの意味
  choice: 忠実な者
  alternative: 信頼できる者
  rationale: 神がパウロを奉仕に用いる文脈で、信頼に値することと委ねられた務めへの忠実さの双方を保つ。これを救いの根拠や無過失性の宣言とは解釈しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、感謝の言葉にふさわしい端正さを保った。「くださった」を用いて話者から主への敬意を自然に表現した。ギリシア語の一文を日本語では二文に分け、理由を示すὅτιの関係を明確にした。
