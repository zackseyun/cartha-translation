- from: 私がマケドニアへ向かう際、あなたにエフェソにとどまるよう勧めたのは、ある人たちに、異なる教えを説かないよう命じてもらうためでした。[a]
  to: 私がマケドニアへ向かう際、あなたにエフェソにとどまるよう勧めたのは、ある人たちに異なる教えを説かないよう命じるためでした。[a]
  rationale: 本文では「命じてもらう」を「命じるためでした」に改め、ἵνα παραγγείλῃς の目的節とテモテの行為主体を明確にした。Καθὼς による原文の省略的な接続は、日本語の完結文では「勧めたのは…ためでした」と処理し、脚注でその統語的特徴を示した。誤って二つの行為を並列する旧脚注は、目的関係を保つ注に差し替えた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:30:09Z'
