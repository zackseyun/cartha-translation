id: 1TI.1.3
reference: 1 Timothy 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: ja
  text: 私がマケドニアへ向かう際、あなたにエフェソにとどまるよう勧めたのは、ある人たちに異なる教えを説かないよう命じるためでした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「私がマケドニアへ向かう際、あなたにエフェソにとどまるよう勧めたように」。原文はこの句を後続の文脈へつなげる省略的な構文である。本文は、ここで明示される目的（「ある人たちに…命じるため」）を日本語で完結した文として示す。
    reason: Καθὼς で始まる前方参照的・省略的な構文を説明しつつ、本文の補足的な完結処理を明示する。
lexical_decisions:
- source_word: Καθὼς
  choice: ～よう…たのは
  rationale: 後続の内容へつながる未完の比較・想起の構文を、日本語では文全体を目的説明として自然にまとめて表した。
- source_word: παρεκάλεσά
  choice: 勧めた
  rationale: 強い促しを表すが、命令とまでは限定しない語義を保つ。「願った」より指導的で、「命じた」より穏当である。
- source_word: προσμεῖναι ἐν Ἐφέσῳ
  choice: エフェソにとどまる
  rationale: その場所に引き続き滞在する意味を、明瞭で格調を損なわない現代日本語で表した。
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: 私がマケドニアへ向かう際
  rationale: 分詞の主語をパウロと理解し、移動に伴う時間的状況を自然に表した。
- source_word: ἵνα
  choice: ～ため
  rationale: 目的を示す接続詞の機能を明確にした。
- source_word: παραγγείλῃς
  choice: 命じてもらう
  rationale: 使徒から委ねられた権威ある指示という強さを保つ。日本語の依頼表現「てもらう」により、テモテに対する発話全体との関係も自然にした。
- source_word: τισὶν
  choice: ある人たち
  rationale: 特定されているが名を挙げられていない複数の人物を自然に表す。
- source_word: ἑτεροδιδασκαλεῖν
  choice: 異なる教えを説く
  rationale: 使徒的規範とは異なる教えという語義を保ち、「偽りの教え」と評価を明示するところまでは踏み込まない。
theological_decisions:
- issue: παραγγείλῃς の権威性
  choice: 「命じる」と訳し、権威ある指示を明示する
  alternative: 「指導する」「言い聞かせる」
  rationale: この動詞は単なる助言より強く、ここでは逸脱した教えを止める任務を指すため、「命じる」が原文の力をよく伝える。
- issue: ἑτεροδιδασκαλεῖν の評価的含意
  choice: 「異なる教えを説く」
  alternative: 「偽りの教えを説く」
  rationale: 文脈上は否定的だが、複合動詞そのものの中心は「異なる教え」である。「偽りの」と訳して評価を先取りせず、原文の緊張を保った。
- issue: Καθὼς で始まる構文の処理
  choice: 目的節までを一つの完結した日本語文としてまとめる
  alternative: 「私が…勧めたように、」と未完のまま次節へ続ける
  rationale: ギリシア語は後続との統語関係がやや省略的である。日本語では内容を補わず、既出の勧めとその目的を一文にまとめることで明瞭さを確保した。
translation_notes:
  register: 明瞭な現代標準日本語。書簡としての品位を保ちつつ、古風な「汝」「命ず」などは避けた。地名は一般的な新約聖書表記「エフェソ」「マケドニア」を用いた。
