    rationale: ἵνα παραγγείλῃς は、テモテ自身が命令することを目的として示す。「～てもらう」は通常、話者が相手の行為を受ける依頼・受益を示し、この目的関係に不要な含意を加える。
  - severity: medium
    issue: 脚注の別訳が原文の統語関係を変更している
    rationale: 「とどまり、…命じることを勧めた」は、パウロがテモテに二つの行為を並列して勧めたように読める。原文では「エフェソにとどまる」が παρεκάλεσά の補語であり、「命じる」は ἵνα による目的節である。
