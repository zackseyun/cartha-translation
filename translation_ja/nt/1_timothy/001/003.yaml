  naturalness: 「命じてもらう」は現代日本語として不自然ではないものの、この文脈では話者がテモテに何かをしてほしいという依頼・恩恵の響きを生みます。「命じるためでした」が目的節として明快で、書簡文としても自然です。
  terminology: 「エフェソ」「マケドニア」「異なる教えを説く」は適切です。「命じる」は παραγγείλῃς の権威ある指示を自然に反映します。「ある人たち」も τισίν の不特定だが念頭にある複数者をよく表しています。
