source:
  edition: SBLGNT
  text: Πιστὸς ὁ λόγος, καὶ περὶ τούτων βούλομαί σε διαβεβαιοῦσθαι, ἵνα φροντίζωσιν καλῶν ἔργων προΐστασθαι οἱ πεπιστευκότες θεῷ. ταῦτά ⸀ἐστιν καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις·
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/008.yaml
  text: This saying is trustworthy[a], and concerning these things I want you to insist confidently, so that those who have believed God may be careful to devote themselves to good works[b]. These things are good and beneficial for people.
translation:
  language: ja
  text: このことばは信頼できるものです。これらのことについて、あなたにははっきりと強く断言してほしいのです。それは、神を信じた人々[a]が、良い行いに励むよう心がけるためです。これらは良いもので、人々にとって有益です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神に信頼した人々」または「神の言われることを信じた人々」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: このことばは信頼できます
  rationale: 牧会書簡に見られる定型句として、直前の内容を指す λόγος を単独の「語」ではなく、語られた内容として表した。「確かなことばです」も可能だが、πιστός の信頼に値するという意味を明確にした。
- source_word: περὶ τούτων
  choice: これらのことについて
  rationale: περί＋属格の意味を自然かつ明瞭に表し、直前の教えとのつながりを保った。
- source_word: βούλομαί σε διαβεβαιοῦσθαι
  choice: あなたには確信をもって強く語ってほしい
  rationale: βούλομαι の意志と、διαβεβαιόομαι の確信に満ちた強い主張の双方を表した。「断言してほしい」では一度限りの発言にも聞こえるため、継続的に強調する含みを持たせた。
- source_word: ἵνα φροντίζωσιν
  choice: 心がけるためです
  rationale: φροντίζω の、注意深く考え配慮する意味を、後続の行動に自然につながる日本語で表した。
- source_word: καλῶν ἔργων προΐστασθαι
  choice: 良い働きに励む
  rationale: ここでの προΐσταμαι は組織的に「指導する」よりも、良い行いに専念し実践する意味と判断した。「良い働き」は ἔργα の幅を保ち、単発の善行だけに限定しない。
- source_word: οἱ πεπιστευκότες θεῷ
  choice: 神を信じた人々
  rationale: 完了分詞による、信じるに至って現在もその状態にある人々という含みを簡潔に表した。θεῷ は与格で、「神の言われることを信じた」と「神に信頼した」の両方に開かれているため、本文では自然な「神を信じた」とした。
- source_word: καλὰ καὶ ὠφέλιμα τοῖς ἀνθρώποις
  choice: 良いことであり、人々の益になります
  rationale: καλά の善さと ὠφέλιμα の有益さを区別して表し、ἀνθρώποις は性別を限定しない「人々」とした。
theological_decisions:
- issue: 信仰と良い働きの関係
  choice: すでに神を信じた人々が、その結果として良い働きに励む構文を保った。
  alternative: 良い働きを救いの根拠または功績として表す。
  rationale: 本文の順序では、信じた者が良い働きを心がけるようになることが目的として示されている。救いの条件や功績という意味は加えなかった。
- issue: πιστεύω＋与格 θεῷ の意味
  choice: 神を信じた
  alternative: 神に信頼した／神の言われることを信じた
  rationale: ギリシア語は神を信頼する意味と、神の言葉を真実として受け入れる意味の双方を帯び得る。本文では自然で広がりのある表現を採用し、注でその含みを示した。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で品位のある文体。「良い働き」は聖書的な語彙の連続性を保ちつつ理解可能な表現とした。原文にない節番号や説明は本文へ加えていない。
