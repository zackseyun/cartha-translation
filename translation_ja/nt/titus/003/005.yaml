language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ⸀ἃ ἐποιήσαμεν ἡμεῖς ἀλλὰ κατὰ ⸂τὸ αὐτοῦ ἔλεος⸃ ἔσωσεν ἡμᾶς διὰ λουτροῦ παλιγγενεσίας καὶ ἀνακαινώσεως πνεύματος ἁγίου,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/005.yaml
  text: not from works done in righteousness, which we ourselves did, but according to his mercy he saved us, through the washing of regeneration and renewal by the Holy Spirit,
translation:
  language: ja
  text: 私たち自身が行った義にかなう行いによってではなく、神はご自分のあわれみによって、再生の洗い[a]と聖霊によって新たにされること[b]を通して、私たちを救ってくださいました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「洗い」は、洗礼、清めのイメージ、またはその両方を指す可能性があります。ギリシア語だけでは、どれか一つに限定されません。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖霊の更新」。ギリシア語では、「聖霊」と「新たにされること」との関係を幾通りかに理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων τῶν ἐν δικαιοσύνῃ ἃ ἐποιήσαμεν ἡμεῖς
  choice: 私たち自身が正しいことを行った、その行いによってではなく
  rationale: ἐκが示す根拠を「によって」で表し、明示されたἡμεῖςの強調を「私たち自身」で保持した。ἐν δικαιοσύνῃはここでは行いの性質を表すため、現代日本語として自然な「正しいことを行った」とした。
- source_word: ἀλλὰ κατὰ τὸ αὐτοῦ ἔλεος ἔσωσεν ἡμᾶς
  choice: 神はご自分のあわれみによって、私たちを救ってくださいました
  rationale: κατάはここで救いの基準・根拠を示す。「あわれみによって」は日本語として自然にその対比を伝える。動詞の主語は前節から続く神なので明示し、敬意を保つ表現とした。
- source_word: διὰ λουτροῦ
  choice: 洗いを通して
  rationale: διά＋属格の手段性を「通して」で表した。λουτρόνは「洗い」とし、洗礼を指すのか、清めの比喩なのか、あるいは両方なのかを本文で限定しない。
- source_word: παλιγγενεσίας
  choice: 新しく生まれるための
  rationale: 「再生」も可能だが、一般読者に明瞭で、誕生し直すという語義を自然に伝える表現を選んだ。属格の関係には解釈幅があるため、「ための」で洗いとの結び付きを示しつつ、機械的な同格表現を避けた。
- source_word: καὶ ἀνακαινώσεως πνεύματος ἁγίου
  choice: 聖霊による新たな造り変え
  rationale: ἀνακαίνωσιςを、単なる反復的な「更新」よりも意味が伝わる「新たな造り変え」とした。πνεύματος ἁγίουは最も近いἀνακαινώσεωςにかかるものとして、作用主体・源を「聖霊による」で表した。
theological_decisions:
- issue: δικαιοσύνηの意味
  choice: 正しいこと
  alternative: 義、正義
  rationale: この句では行いが正しさを帯びていることを述べるため、普通の日本語として明瞭な「正しいこと」を採用した。「義」や「正義」という術語を用いて、義認や社会的公正の意味に狭く限定することを避けた。
- issue: λουτρόνが洗礼を明示するか
  choice: 洗い
  alternative: 洗礼の洗い、清め
  rationale: ギリシア語は洗礼との関連を許すが、翻訳だけでその解釈を確定させない。「洗い」により、洗礼、清めのイメージ、または双方の可能性を保った。
- issue: πνεύματος ἁγίουと先行する名詞句との関係
  choice: 聖霊による新たな造り変え
  alternative: 聖霊の新たな造り変え、聖霊から来る新たな造り変え、洗いと造り変えの双方を聖霊に結び付ける読み
  rationale: 語順上、πνεύματος ἁγίουは直前のἀνακαινώσεωςに最も自然に結び付く。本文では作用主体を表す読みを採り、別の属格理解が可能であることを脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、救いが人間の正しい行いではなく神のあわれみに基づくという対比を保持した。「洗い」には解釈上の余地を残し、教派的な限定を避けた。文脈上の主語「神」を補って日本語の理解を助け、敬体で品位を保った。
