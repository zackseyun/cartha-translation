  text: εἰδὼς ὅτι ἐξέστραπται ὁ τοιοῦτος καὶ ἁμαρτάνει, ὢν αὐτοκατάκριτος.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/011.yaml
  text: knowing that such a person is warped and is sinning[c][b][a], being self-condemned.
translation:
  language: ja
  text: そのような人が道を踏み外した状態にあり[a]、罪を犯していて、自らの行いによって有罪とされている[b]ことを知って、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「道からそれており」または「ゆがんでおり」。ギリシア語の完了形は、以前に道をそれた結果として今もその状態にあることを示します。
    reason: lexical_alternative
  - marker: b
    text: または「自らを断罪していて」。この語は、本人が正式に自分へ判決を下すことだけでなく、その行いや態度そのものが本人を有罪な者として示していることを表し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: あなたは知っているのです
  rationale: 前節の命令を受ける状況分詞で、暗黙の主語はテトスです。日本語では文として自然に読めるよう定動詞化しつつ、理由を明示しすぎない表現にしました。
- source_word: ἐξέστραπται
  choice: 道を踏み外した状態にあり
  rationale: 完了形が示す、以前の逸脱の結果として今も続く状態を表します。「ゆがんでいる」より日本語として自然であり、「堕落している」ほど評価を限定しません。
- source_word: ὁ τοιοῦτος
  choice: そのような人
  rationale: 直前の「分派を引き起こす人」を受ける表現です。ギリシア語は男性単数形ですが、この構文では該当する者を類型的に指すため、日本語では性別を不必要に限定しない「人」が自然です。
- source_word: ἁμαρτάνει
  choice: 罪を犯していて
  rationale: 現在形の継続的な動作を表しつつ、「犯し続けている」として反復・持続を必要以上に強調することを避けました。
- source_word: ὢν
  choice: ～ている
  rationale: 付帯状況を示す分詞を、日本語では前の述語と並列的につなぎ、簡潔に表しました。
- source_word: αὐτοκατάκριτος
  choice: 自らを罪に定めている
  rationale: 本人の行為や態度が本人自身に対する有罪の根拠となる、という再帰的な意味を保ちます。ただし、自分で正式な判決を宣告するという意味に限定しないよう脚注を付しました。
theological_decisions:
- issue: αὐτοκατάκριτοςが表す自己断罪の性質
  choice: 自らを罪に定めている
  alternative: 自らの行いによって罪に定められている／自分自身によって罪に定められている
  rationale: 本人の状態と行為が本人を罪ある者として示すという重みを保ちながら、終末の最終審判や正式な自己宣告まで本文に持ち込みません。
- issue: ὁ τοιοῦτοςの性別表現
  choice: そのような人
  alternative: そのような男
  rationale: 文法上は男性単数ですが、直前に述べられた類型に属する者を指す表現です。日本語で「男」とすると実際の性別を必要以上に限定するため、「人」としました。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いました。原文の分詞構文は日本語の一文として理解しやすく整えましたが、εἰδὼςを「～なので」と固定せず、前節との論理関係に残る幅を保っています。
