    issue: αὐτοκατάκριτος の訳語
    rationale: 「自らを罪に定めている」は『罪を定める』という不自然な連語であり、自己による正式な宣告に意味を狭めやすいです。原語は、その者自身の行い・状態がその者を有罪とするという意味を含むため、「自らの行いによって有罪とされている」がより適切です。
  - severity: low
    issue: εἰδὼς の構文処理
    rationale: 「あなたは知っているのです」と独立主節にすると、前節の命令に付随する分詞という原文のつながりが弱まります。「…ことを知って、」は、因果・様態などの関係を過度に固定せずに保持できます。
  revised_text: そのような人が道を踏み外した状態にあり[a]、罪を犯していて、自らの行いによって有罪とされている[b]ことを知って、
