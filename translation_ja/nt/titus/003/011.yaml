  to: そのような人が道を踏み外した状態にあり[a]、罪を犯していて、自らの行いによって有罪とされている[b]ことを知って、
  rationale: αὐτοκατάκριτος を、原語の『自己によって有罪とされる／自己を断罪する』という意味領域を保つ自然な日本語に改めました。あわせて、εἰδὼς を前節の命令に続く分詞として「知って、」と訳し、原文の構文上のつながりと論理関係の曖昧さを維持しました。
