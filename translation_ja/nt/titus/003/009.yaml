id: TIT.3.9
reference: Titus 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μωρὰς δὲ ζητήσεις καὶ γενεαλογίας καὶ ⸀ἔρεις καὶ μάχας νομικὰς περιΐστασο, εἰσὶν γὰρ ἀνωφελεῖς καὶ μάταιοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/009.yaml
  text: But avoid foolish controversies and genealogies and strife and quarrels about the law[b][a], for they are unprofitable and futile.
translation:
  language: ja
  text: しかし、愚かな議論や系図、争い、律法をめぐる言い争い[a]は避けなさい。それらは無益で、むなしいものだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「律法に関する争い」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μωρὰς ζητήσεις
  choice: 愚かな議論
  rationale: ζητήσειςは単なる質問ではなく、文脈上、対立を生む論議を指す。「愚かな議論」は、その実践的・道徳的な愚かさと論争的性格を自然な現代日本語で表す。
- source_word: γενεαλογίας
  choice: 系図
  rationale: 特定の歴史的背景を本文に読み込まず、原語の一般的な語義をそのまま保つ。並列項目としては日本語では単数形が自然である。
- source_word: ἔρεις
  choice: 争い
  rationale: 不和や対立を表し、後続するμάχαςの具体的な言い争いとはある程度区別できる簡潔な表現である。
- source_word: μάχας νομικὰς
  choice: 律法をめぐる言い争い
  rationale: μάχαςはここでは武力衝突でなく言葉による争いを指す。νομικάςは律法に関するものという意味に取り、法廷上の紛争との誤解を避けた。
- source_word: περιΐστασο
  choice: 避けなさい
  rationale: 自らそのような事柄から離れているよう求める中動態命令の力を、明瞭で自然な命令表現にした。
- source_word: ἀνωφελεῖς
  choice: 無益
  rationale: 利益や助けにならないという評価を、簡潔で格調を保った現代日本語で表す。
- source_word: μάταιοι
  choice: むなしい
  rationale: 空虚で成果を生まないという意味を保ち、「無益」と重なりながらも別のニュアンスを示す。
theological_decisions:
- issue: 「系図」と「律法をめぐる言い争い」の性質
  choice: 特定の思想体系を明示せず、一般的な語義で訳す。
  alternative: ユダヤ的な血統論争、または原始グノーシス的な神話的思弁と特定する。
  rationale: この節自体はそれらの慣行を特定できるほど詳しく説明していないため、歴史的・教派的解釈を本文に持ち込まず、原文の幅を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、命令と理由説明の流れを保った。「むなしい」は漢字の「空しい」より読みやすさを優先してひらがなとした。
