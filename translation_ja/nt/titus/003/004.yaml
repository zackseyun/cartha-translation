lexical_decisions:
- source_word: ὅτε δὲ
  choice: しかし、…とき
  rationale: ὅτεの時間的意味を「…とき」で表し、δέが直前の人間の罪深い状態から神の救いの働きへ移る穏やかな対照を「しかし」で示す。
- source_word: χρηστότης
  choice: 慈しみ
  rationale: 人に向けられる親切、善意、恵み深さを表す語であり、現代日本語として品位を保ちつつ、φιλανθρωπίαとの違いも残せる。
- source_word: φιλανθρωπία
  choice: 人間に対する愛
  rationale: 人間一般に向けられた好意や愛という語義を明示し、単なる「愛」に狭めず、現代語で分かりやすく表す。
- source_word: ἐπεφάνη
  choice: 現れた
  rationale: 姿を現す、顕現するという意味を簡潔に保ち、啓示の様態を過度に説明しない。
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: 私たちの救い主である神の
  rationale: 属格が「慈しみ」と「人間に対する愛」の双方にかかる構造を保ち、「救い主」が神を説明する称号であることを自然な日本語で示す。
theological_decisions:
- issue: 「私たちの救い主である神」の指示対象
  choice: この節では神を「私たちの救い主」と呼ぶ語順をそのまま保ち、人物の同定を訳文で補足しない。
  alternative: 牧会書簡の用法と6節との対比に基づき、明示的に父なる神と解釈する。
  rationale: 文脈上は父なる神を指す可能性が高いが、この一節自体は「父」と明記していないため、訳文では称号の神学的重みと原文の余地を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた格調を保った。文は次節へ続く従属節なので、末尾を「とき、」とした。
