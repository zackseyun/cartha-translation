id: TIT.3.14
reference: Titus 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μανθανέτωσαν δὲ καὶ οἱ ἡμέτεροι καλῶν ἔργων προΐστασθαι εἰς τὰς ἀναγκαίας χρείας, ἵνα μὴ ὦσιν ἄκαρποι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/014.yaml
  text: And let our people also learn to engage in good works for necessary needs[c][b][a], so that they may not be unfruitful.
translation:
  language: ja
  text: また、私たちの仲間[a]にも、必要を満たすため[c]、良い働きに励むこと[b]を学ばせなさい。そうすれば、彼らは実を結ばない者とはならないでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私たちの者たち」。または「私たちに属する人々」。
    reason: lexical_alternative
  - marker: b
    text: または「良い働きに携わること」「良い働きの先頭に立つこと」。
    reason: lexical_alternative
  - marker: c
    text: または「差し迫った必要を満たすため」「欠かせない必要のため」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μανθανέτωσαν
  choice: 学び……ようにしなさい
  rationale: 三人称複数の現在命令形。継続的に身につけるよう促す勧告の力を、自然な現代日本語の命令表現で示した。
- source_word: οἱ ἡμέτεροι
  choice: 私たちの仲間
  rationale: 字義的には「私たちの者たち」。ここではパウロやテトスと同じ信仰共同体に属する人々を指すため、性別を不当に限定しない自然な表現とした。
- source_word: καλῶν ἔργων
  choice: 良い働き
  rationale: テトス書で繰り返される実践的な善い行いを指す。「善行」より平明で、「働き」によって行動性も保った。
- source_word: προΐστασθαι
  choice: 励むこと
  rationale: この動詞には、先頭に立つ、世話をする、専心するという意味範囲がある。ここでは良い働きへの継続的で積極的な関与を自然に表した。別訳の可能性は脚注に残した。
- source_word: εἰς τὰς ἀναγκαίας χρείας
  choice: 必要に応えるため
  rationale: 実際に存在する必要へ良い働きを向けるという目的を明瞭に表した。ἀναγκαίας が示し得る「差し迫った」のニュアンスは脚注に残した。
- source_word: ἵνα μὴ ὦσιν ἄκαρποι
  choice: 実を結ばない者とならないように
  rationale: ἵναによる目的を示しつつ、ἄκαρποιの「実のない」という比喩と、その道徳的・霊的な響きを保持した。
theological_decisions:
- issue: οἱ ἡμέτεροιの範囲
  choice: パウロやテトスと同じ信仰共同体に属する人々を指す「私たちの仲間」
  alternative: 「私たちの者たち」「私たちに属する人々」
  rationale: 関係的・共同体的な表現であり、男性だけを指す根拠はない。教派的な意味を加えず、原文の所属関係を自然な日本語で示した。
- issue: ἄκαρποιの比喩
  choice: 「実を結ばない者」として比喩を保持
  alternative: 「役に立たない者」「成果のない者」
  rationale: 比喩を説明的な語に置き換えると、実践的成果と霊的実りの双方を含み得る原文の広がりを狭めるため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「良い働き」「実を結ばない」という反復可能な聖書的表現を用いながら、文全体は一般読者が無理なく理解できる語順にした。
