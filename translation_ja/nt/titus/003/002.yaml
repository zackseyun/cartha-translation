  source_fidelity: 原文の不定詞・分詞による勧告の連なりを、日本語の「〜ず、〜であり、〜ように」に自然に整えている。μηδένα βλασφημεῖν は「だれをも悪く言わず」として、単なる虚偽の中傷に限定されない対人的な悪口・侮辱の幅を保つ。ἀμάχους は「争わず」、ἐπιεικεῖς は「寛容であり」、πᾶσαν … πραΰτητα は「どこまでも柔和な態度を示す」とされ、区別も保たれている。πρὸς πάντας ἀνθρώπους の普遍的・対人的な範囲も「すべての人に対して」で明確である。
