  terminology: 「寛容」と「柔和」により、ἐπιεικεῖς の譲歩的・理にかなった配慮と πραΰτης の柔和さを不必要に同一化せずに訳し分けている。「すべての人」は ἄνθρωποι の包括的な用法に適切である。
