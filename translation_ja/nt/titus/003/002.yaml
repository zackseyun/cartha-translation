id: TIT.3.2
reference: Titus 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μηδένα βλασφημεῖν, ἀμάχους εἶναι, ἐπιεικεῖς, πᾶσαν ἐνδεικνυμένους πραΰτητα πρὸς πάντας ἀνθρώπους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/002.yaml
  text: to slander no one[a], to be peaceable, gentle[c][b], showing all meekness toward all people.
translation:
  language: ja
  text: だれをも悪く言わず[a]、争わず、寛容であり[b]、すべての人に対して、どこまでも柔和な態度を示すように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれをも中傷せず」または「だれをもののしらず」。原語は、事実に反する中傷に限らず、人を傷つける悪意ある発言を広く指すことがある。
    reason: lexical_alternative
  - marker: b
    text: または「穏やかであり」「思いやり深くあり」。原語には、相手に譲り、寛大に接する含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδένα βλασφημεῖν
  choice: だれをも悪く言わず
  rationale: βλασφημέωはこの対人的な文脈では、正式な意味での中傷だけでなく、ののしることや悪意ある発言を広く指し得る。「悪く言う」はその幅を保ちながら、現代日本語として自然である。μηδέναの普遍的な範囲は「だれをも」で表した。
- source_word: ἀμάχους εἶναι
  choice: 争わず
  rationale: ἀμάχοςは、けんかや争いを好まず、それに加わらない性質を表す。「争わず」は否定形の意味を簡潔に保ち、文脈上の勧告として自然である。
- source_word: ἐπιεικεῖς
  choice: 寛容であり
  rationale: ἐπιεικήςには、穏やかで、道理をわきまえ、相手に譲る寛大さが含まれる。「寛容」はその対人的な配慮を表し、後の πραΰτης を「柔和」と訳し分けることもできる。
- source_word: πᾶσαν ἐνδεικνυμένους πραΰτητα
  choice: どこまでも柔和な態度を示す
  rationale: πραΰτηςは力を抑えた穏やかさ、柔和さを表す。πᾶσανは抽象名詞を強めているため、直訳的な「あらゆる柔和」ではなく「どこまでも」で全面性を自然に示した。ἐνδείκνυμαιは外に現して示す意を「態度を示す」で表した。
- source_word: πρὸς πάντας ἀνθρώπους
  choice: すべての人に対して
  rationale: ἄνθρωποιはここでは性別を限定せず人間一般を指す。πρόςの対人的な方向性と πάντας の例外のない範囲を自然に保った。
theological_decisions:
- issue: πάντας ἀνθρώπους の包括的範囲
  choice: すべての人
  alternative: すべての男／万人
  rationale: ἄνθρωποςは文法上は男性形だが、ここでは男女を含む人間一般を指す。「すべての人」は普遍的な倫理命令を正確かつ自然に伝える。
- issue: πραΰτης と ἐπιεικής の訳し分け
  choice: ἐπιεικήςを「寛容」、πραΰτηςを「柔和」
  alternative: 両方を「穏やか／優しい」とする
  rationale: 両語の意味領域は重なるが、同一節で別々に用いられているため、前者の譲歩的・寛大な側面と、後者の柔和な態度を区別した。特定の神学的解釈を加えるものではない。
translation_notes:
  register: 前節から続く勧告の不定詞・分詞の連なりを、日本語では「〜ず、〜であり、〜ように」と整えた。現代の一般読者に明瞭でありながら、倫理的勧告にふさわしい落ち着いた格調を保った。「柔和」はやや書き言葉だが、聖書的文脈でも理解可能で、πραΰτηςの力を抑えた穏やかさを簡潔に表す。
