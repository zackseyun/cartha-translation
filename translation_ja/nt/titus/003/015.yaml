    rationale: ἐν πίστει の代替読解として問題となるのは主に faithfulness、すなわち「誠実さをもって」であり、「真実をもって」は別の語義へずれ、監査記録とも一致しない。
  - severity: low
    issue: 冒頭の表現の自然さ
    rationale: 「私と一緒にいるすべての人」は直訳的でやや重い。「私と一緒にいる皆」は πάντες を保ちながら自然である。
  revised_text: 私と一緒にいる皆が、あなたによろしくとのことです。信仰にあって私たちを愛する人たちに、よろしく伝えてください。恵みが、あなたがたすべてとともにありますように。
