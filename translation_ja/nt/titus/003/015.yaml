  text: Ἀσπάζονταί σε οἱ μετ’ ἐμοῦ πάντες. ἄσπασαι τοὺς φιλοῦντας ἡμᾶς ἐν πίστει. ἡ χάρις μετὰ πάντων ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/015.yaml
  text: All who are with me greet you[a]. Greet those who love us in faith. Grace be with all of you.
translation:
  language: ja
  text: 私と一緒にいる皆が、あなたによろしくとのことです。信仰にあって私たちを愛する人たちに、よろしく伝えてください。恵みが、あなたがたすべてとともにありますように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζονταί
  choice: よろしくと言っています
  rationale: 書簡末尾で、人を介して挨拶を送る意味を自然な現代日本語で表した。
- source_word: οἱ μετ’ ἐμοῦ πάντες
  choice: 私と一緒にいるすべての人
  rationale: μετά＋属格の同行・同席の関係と、πάντεςの「すべて」を明示した。
- source_word: ἄσπασαι
  choice: よろしく伝えてください
  rationale: 書簡の受取人に、ほかの人々への挨拶を託す命令を、丁寧で自然な日本語にした。
- source_word: φιλοῦντας
  choice: 愛している
  rationale: φιλέωが示す個人的な愛情と親愛を、簡潔に「愛している」と訳した。
- source_word: ἐν πίστει
  choice: 信仰にあって
  rationale: πίστιςを基本的に「信仰」とし、ἐνが示す領域・基盤を保った。定冠詞的な限定や「真実」という意味に一義化しない。
- source_word: ἡ χάρις
  choice: 恵み
  rationale: パウロ書簡の祝祷における神の恵みを表す定着した日本語を用いた。
- source_word: μετὰ πάντων ὑμῶν
  choice: あなたがたすべてとともにありますように
  rationale: 省略された願望の動詞を日本語で補い、πάντωνの包括性を明示して祝祷として整えた。
theological_decisions:
- issue: ἐν πίστει における πίστις の解釈
  choice: 信仰にあって
  alternative: 「その信仰にあって」、または「真実をもって」
  rationale: ここでは、愛の共有される領域・基盤としての信仰が最も自然である。ただし、共同体が共有する「その信仰」を指す読みや、誠実さ・真実を表す読みも文法上可能なので、脚注で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、書簡末尾にふさわしい丁寧さと祝祷の格調を保った。「挨拶する」の反復による硬さを避け、文脈に応じて「よろしくと言っています」「よろしく伝えてください」とした。
