base_translation:
  language: en
  yaml_path: translation/nt/titus/003/013.yaml
  text: Diligently send Zenas the lawyer and Apollos on their way[a], so that they may lack nothing.
translation:
  language: ja
  text: 法律家ゼナスとアポロが必要なものに何一つ不足しないよう、十分に心を配って旅に送り出しなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「旅に送り出す」という語には、単に出発させるだけでなく、旅に必要な物を整えるなど、実際的な援助をして送り出す意味が含まれます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηνᾶν
  choice: ゼナス
  rationale: 固有名を、現代日本語の聖書で理解しやすい慣用的な形に音写した。
- source_word: τὸν νομικὸν
  choice: 法律家
  rationale: νομικός は法律に通じた者を指し、ここではゼナスの肩書きとして自然で簡潔な「法律家」とした。「律法の専門家」も可能だが、本文だけではユダヤ教の律法学者という意味に限定できない。
- source_word: Ἀπολλῶν
  choice: アポロ
  rationale: 新約聖書で広く定着している日本語表記を用いた。
- source_word: σπουδαίως
  choice: 行き届いた世話をして
  rationale: 熱意と細心の配慮をもって旅を支援するよう求める副詞の働きを、後続の πρόπεμψον と合わせて自然な日本語で表した。単なる速度を示す「急いで」とはしなかった。
- source_word: πρόπεμψον
  choice: 旅に送り出しなさい
  rationale: 旅行者を見送るだけでなく、旅に必要な援助を与えて送り出す含意がある。本文では「行き届いた世話をして」と組み合わせ、その実際的支援の意味を明示した。
- source_word: ἵνα μηδὲν αὐτοῖς λείπῃ
  choice: 何一つ不自由することがないよう
  rationale: 目的を示す ἵνα 節と、必要なものが欠けないという広い意味を、自然な現代日本語で保持した。
theological_decisions:
- issue: νομικός が指す専門領域
  choice: 「法律家」とし、世俗法または一般的な法の専門家として読める余地を残す
  alternative: 「律法の専門家」「律法学者」
  rationale: 文脈はゼナスの専門領域を明示しておらず、ユダヤ教の律法に限定すると本文以上の神学的・制度的特定を加えることになるため。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「行き届いた世話をして」により、σπουδαίως の真剣さと πρόπεμψον の旅支度・支援の含意を一体として伝えた。
