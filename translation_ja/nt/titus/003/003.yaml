  text: ἦμεν γάρ ποτε καὶ ἡμεῖς ἀνόητοι, ἀπειθεῖς, πλανώμενοι, δουλεύοντες ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις, ἐν κακίᾳ καὶ φθόνῳ διάγοντες, στυγητοί, μισοῦντες ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/003.yaml
  text: For we ourselves also were once foolish[a], disobedient, being led astray, enslaved to various desires and pleasures, spending our lives in malice and envy, hateful[b], hating one another.
translation:
  language: ja
  text: なぜなら、私たち自身もかつては、愚かで、不従順で、惑わされ[a]、さまざまな欲望と快楽の奴隷となり、悪意とねたみの中で暮らし、忌まわしい者[b]であり、互いに憎み合っていたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だまされ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「憎まれる者」。このギリシア語は、「忌まわしい、嫌悪すべき」という意味にも、「憎まれている」という意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦμεν γάρ ποτε καὶ ἡμεῖς
  choice: 私たち自身も、かつては……からです
  rationale: γάρによる前文との理由関係を文末の「からです」で自然に示し、καὶ ἡμεῖςの包含と強調を「私たち自身も」、ποτεを「かつては」で表した。
- source_word: ἀνόητοι
  choice: 愚かで
  rationale: 知的理解の欠如だけでなく道徳的な無分別も含み得る語を、簡潔で自然な日本語にした。
- source_word: ἀπειθεῖς
  choice: 従わず
  rationale: 説得を受け入れないことから生じる不従順を表す。抽象名詞的な「不従順で」より、列挙の中で自然な表現を選んだ。
- source_word: πλανώμενοι
  choice: 惑わされ
  rationale: 受動または中動の含みを保ち、自ら道を誤ることだけに限定せず、誤った方向へ導かれる意味を表した。知的な欺瞞に限定する「だまされ」も別訳として注記した。
- source_word: δουλεύοντες
  choice: 奴隷となり
  rationale: 単に「仕える」よりも、欲望と快楽に拘束され支配されている奴隷語彙の強さを保った。
- source_word: ἐπιθυμίαις καὶ ἡδοναῖς ποικίλαις
  choice: さまざまな欲望と快楽
  rationale: ἐπιθυμίαは性的欲望だけに限定されないため「欲望」とし、ποικίλαιςが文意上、欲望と快楽の多様さを示すように訳した。
- source_word: ἐν κακίᾳ καὶ φθόνῳ διάγοντες
  choice: 悪意とねたみのうちに日々を送り
  rationale: 対人的な悪意を示すκακίαと、他者をねたむφθόνοςを区別した。διάγωの継続的な生活の意味を「日々を送り」で表した。
- source_word: στυγητοί
  choice: 忌まわしい者
  rationale: 文脈上、憎悪を招く嫌悪すべき者という能動的・性質的な理解を採った。ただし「憎まれている者」という受動的理解も可能なので注記した。
- source_word: μισοῦντες ἀλλήλους
  choice: 互いに憎み合っていた
  rationale: 相互代名詞と継続的な分詞の意味を、自然な日本語で明確に表した。
theological_decisions:
- issue: 非人格的な主人である「欲望と快楽」に対するδουλεύοντεςの拘束性
  choice: さまざまな欲望と快楽の奴隷となり
  alternative: さまざまな欲望と快楽に仕え
  rationale: この箇所は以前の生き方が欲望に支配されていたことを描く。特定の教理体系を付加せず、原文の奴隷語彙が持つ強い拘束の意味を保持した。
- issue: στυγητοίの態
  choice: 忌まわしい者
  alternative: 人から憎まれる者
  rationale: 形容詞は「嫌悪すべき、忌まわしい」という性質的意味にも、「憎まれている」という受動的意味にも理解できる。本文では前者を採り、 genuine ambiguity を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、倫理的な列挙の重さと格調を保った。分詞の連続は日本語として読みやすい連用形に整え、γάρは文末で理由を示した。
