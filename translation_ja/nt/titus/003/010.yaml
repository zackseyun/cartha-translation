base_translation:
  language: en
  yaml_path: translation/nt/titus/003/010.yaml
  text: Reject a divisive person after a first and second warning,[a]
translation:
  language: ja
  text: 分派を引き起こす人は、一度目、二度目の忠告をした後、退けなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「党派的な人」。伝統的には「異端の人」。ギリシア語は、党派を作り、分裂を引き起こす人を指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἱρετικὸν
  choice: 分派を引き起こす
  rationale: 後代の教会用語である「異端の」と限定せず、共同体の中に党派や分裂を生じさせる人という当時の語義を明確に伝える。
- source_word: ἄνθρωπον
  choice: 人
  rationale: 文脈上は個人を指すが、ここでの男性形は一般的な人を表し得るため、現代日本語では自然な「人」とする。
- source_word: μετὰ μίαν καὶ δευτέραν νουθεσίαν
  choice: 一度、二度と戒めた後
  rationale: μίαν καὶ δευτέραν の反復の順序と、νουθεσίαの矯正を意図した忠告・警告の力を、簡潔で自然な日本語で示す。
- source_word: παραιτοῦ
  choice: 退けなさい
  rationale: 単に避けるより強く、関わりや受け入れを断るという命令の力を保つ。「拒みなさい」も可能だが、人への教会的対処として「退けなさい」が自然である。
theological_decisions:
- issue: αἱρετικὸνを後代の教義的用語で訳すか、党派的分裂を起こす意味で訳すか
  choice: 分派を引き起こす人
  alternative: 異端の人／党派心のある人
  rationale: 本文は、繰り返し戒めても改めない人物への共同体的対処を命じている。「異端」は後代の専門的な教義概念を読み込みやすいため、第一世紀の語義として可能性の高い分派形成の意味を本文に採る。
translation_notes:
  register: 明瞭で現代的かつ品位ある命令文とした。「一度、二度と」により、対処に先立つ反復した戒めを明示した。
