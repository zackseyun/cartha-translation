  text: οὗ ἐξέχεεν ἐφ’ ἡμᾶς πλουσίως διὰ Ἰησοῦ Χριστοῦ τοῦ σωτῆρος ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/006.yaml
  text: whom he poured out on us richly through Jesus the Messiah our Savior[b][a],
translation:
  language: ja
  text: 神は、この聖霊を[a]、私たちの救い主であるイエス・メシア[b]を通して、私たちの上に豊かに注いでくださいました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「この方を」または「これを」。原文の関係代名詞は、前節の「聖霊」を指す。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語では「イエス・キリスト」。ここではΧριστόςを称号として「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ
  choice: この聖霊を
  rationale: 関係代名詞の直前の先行詞は3章5節の「聖霊」。日本語では性を区別する関係代名詞がなく、先行詞を明示して自然で分かりやすくした。
- source_word: ἐξέχεεν
  choice: 注いでくださいました
  rationale: ἐκχέωの基本義であり、聖霊を「注ぐ」という聖書的比喩を保つ。敬意を表す補助動詞により、神の行為を自然で格調ある現代日本語にした。
- source_word: ἐφ’ ἡμᾶς
  choice: 私たちの上に
  rationale: ἐπίと対格が示す方向を明瞭に表し、「注ぐ」という比喩との結びつきも保った。
- source_word: πλουσίως
  choice: 豊かに
  rationale: 量や恵みの満ちあふれるさまを表す副詞として、原語の豊かさの含意を自然に伝える。
- source_word: διὰ
  choice: を通して
  rationale: 属格を伴うδιάが示す媒介を、簡潔で標準的な日本語で表した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: メシア・イエス
  rationale: Χριστόςを称号「メシア」として意味を訳し、日本語で人名と称号を自然に結ぶ語順とした。
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: 私たちの救い主である
  rationale: イエスを説明する同格の称号として、所有関係と救済者としての意味を明確にした。
theological_decisions:
- issue: 関係代名詞οὗの指示対象
  choice: 前節の「聖霊」を指すものとして「この聖霊を」と明示する。
  alternative: 「この方を」または非人格的に「これを」と訳す。
  rationale: 直近の先行詞は3章5節の「聖霊」である。日本語には英語のwhom/whichに相当する人格的区別がないため、聖霊を非人格化せず、しかも不自然な擬人的表現を避けて先行詞を明示した。
- issue: Χριστοῦの訳語
  choice: 称号として「メシア」と訳す。
  alternative: 伝統的な音訳を用いて「キリスト」とする。
  rationale: ここでは「私たちの救い主」という称号と並び、Χριστόςの称号的意味が保たれているため、その意味を直接示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。文脈上の主語「神」と関係代名詞の先行詞「聖霊」を明示しつつ、「注ぐ」「豊かに」「通して」という原文の比喩と論理関係を保持した。
