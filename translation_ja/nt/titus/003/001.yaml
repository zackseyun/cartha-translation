- from: 彼らに、支配者たちや権威ある者たちに従い、服従し、あらゆる良い働きをする用意を整えておくよう、思い起こさせなさい。[a]
  to: 彼らに、統治者や権威者たちに服し、従順であり、あらゆる善い行いのために備えていることを思い起こさせなさい。
  rationale: 統治に関する二つの名詞と、それに続く二つの不定詞の結び付きを自然な日本語で明示した。「服し、従順であり」により、原文の二つの勧告を保ちながら不自然な重複を避けた。脚注は主文の自然な構文理解を「別案」として提示しており不要であるため削除した。
