source:
  edition: SBLGNT
  text: Ὑπομίμνῃσκε αὐτοὺς ⸀ἀρχαῖς ἐξουσίαις ὑποτάσσεσθαι πειθαρχεῖν, πρὸς πᾶν ἔργον ἀγαθὸν ἑτοίμους εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/001.yaml
  text: Remind them to be subject to rulers and authorities[a], to be obedient, to be ready for every good work,
translation:
  language: ja
  text: 彼らに、統治者や権威者たちに服し、従順であり、あらゆる善い行いのために備えていることを思い起こさせなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπομίμνῃσκε
  choice: 思い起こさせなさい
  rationale: 現在命令形の継続的な勧告を、文脈上自然な日本語で表した。「いつも」を補わずとも、指導として繰り返し念を押す含みがある。
- source_word: αὐτοὺς
  choice: 彼らに
  rationale: テトスを通して教えられるクレタの信徒たちを指す複数代名詞として、そのまま明示した。
- source_word: ἀρχαῖς ἐξουσίαις
  choice: 支配者たちや権威ある者たち
  rationale: 市民社会の統治者・統治権力を指す並列表現であり、二語を一つにまとめず、現代日本語で理解しやすく表した。接続は、密接に並ぶ二つの与格を自然にまとめる「や」とした。
- source_word: ὑποτάσσεσθαι
  choice: 従い
  rationale: 秩序の下に身を置くことを示す。日本語の「従う」は自然で、無条件の隷属まで含意しない。
- source_word: πειθαρχεῖν
  choice: 服従し
  rationale: 権威に聞き従う意味を、先行するὑποτάσσεσθαιと区別しつつ表した。原文では目的語を明示しないため、日本語でも補わなかった。
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν
  choice: あらゆる良い働きをする
  rationale: πρόςが示す、良い行為へ向けた備えを自然な日本語にした。「働き」は倫理的な行為を広く指し、特定の職務には限定しない。
- source_word: ἑτοίμους εἶναι
  choice: 用意を整えておく
  rationale: 準備ができた状態にあることを表す。「整えておく」により継続的な備えを自然に伝えた。
theological_decisions:
- issue: 統治者への服従の範囲
  choice: 市民的な支配者と権威に従う一般的勧告として訳し、絶対的・無条件の服従とは訳文で限定しない。
  alternative: どのような場合にも統治権力へ無条件に服従する命令として明示する。
  rationale: 本文は服従を明確に命じる一方、その限界や例外をこの節では論じていない。したがって勧告の力を保ちつつ、本文にない絶対化も例外規定も加えない。
- issue: ὑποτάσσεσθαιとπειθαρχεῖνの関係
  choice: 「従い、服従し」と二つの動詞を並列に保つ。
  alternative: 後者を支配者たちへの服従の説明と見て「支配者たちや権威ある者たちに従って服従し」と一体化する。
  rationale: 句読法上、πειθαρχεῖνを前の与格と結び付けることも、独立した勧告と見ることも可能である。本文では原文の動詞の並列を保ち、脚注で構文上の別の理解を示す。
translation_notes:
  register: 明瞭で現代的ながら、勧告としての品位を保つ文体とした。「思い起こさせなさい」は教会共同体への継続的な注意喚起に適した表現である。脚注記号[a]は節末に置き、服従と遵守の構文上の別案が節全体に関わることを示した。
