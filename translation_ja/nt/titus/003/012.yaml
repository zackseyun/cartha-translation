  text: Ὅταν πέμψω Ἀρτεμᾶν πρὸς σὲ ἢ Τυχικόν, σπούδασον ἐλθεῖν πρός με εἰς Νικόπολιν, ἐκεῖ γὰρ κέκρικα παραχειμάσαι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/012.yaml
  text: When I send Artemas or Tychicus to you[a], make every effort to come to me at Nicopolis[b], for I have decided to spend the winter there.
translation:
  language: ja
  text: 私がアルテマスかテキコをあなたのもとに遣わしたら、できるだけ早くニコポリスへ私のもとに来てください[a]。私はそこで越冬することに決めているからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ぜひ私のもとに来るように努めてください」。
    reason: lexical_alternative
  - marker: b
    text: または「私はそこで冬を過ごすことを決めているからです」。パウロがすでにニコポリスにいたのか、そこへ行く予定だったのかは、本文では明記されていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν πέμψω
  choice: 私が…遣わしたら
  rationale: ὅτανとアオリスト接続法は、将来に見込まれる出来事を表す。日本語では「遣わしたら」が自然に将来の条件・時を示す。
- source_word: Ἀρτεμᾶν
  choice: アルテマス
  rationale: 人名を日本語で一般的な聖書表記に従って音写した。
- source_word: ἢ
  choice: か
  rationale: 二人の使者のうち一方を示す選言として自然な日本語にした。
- source_word: Τυχικόν
  choice: テキコ
  rationale: 人名を日本語で一般的な聖書表記に従って音写した。
- source_word: πρὸς σὲ
  choice: あなたのもとに
  rationale: 使者がテトスのいる所へ向かう方向を明確に表す。
- source_word: σπούδασον ἐλθεῖν
  choice: ぜひ…来てください
  rationale: 命令形が示す熱意と行動への強い促しを、過度に速度だけへ限定せず、自然で丁寧な現代日本語で表した。
- source_word: πρός με εἰς Νικόπολιν
  choice: ニコポリスにいる私のところへ
  rationale: パウロを基準とする「来る」と、目的地ニコポリスへの方向を重複感なく明確にした。原文自体はパウロがすでに現地にいるとは必ずしも断定しないため、その点は注で補う。
- source_word: γὰρ
  choice: からです
  rationale: 先の要請の理由を示す接続関係を、自然な日本語の文末表現で示した。
- source_word: κέκρικα
  choice: 決めている
  rationale: 完了形が表す、すでになされ現在も効力を持つ決定を表す。
- source_word: παραχειμάσαι
  choice: 冬を過ごす
  rationale: ある場所に滞在して越冬する意味を、明快な現代日本語で表した。
