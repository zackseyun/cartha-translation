id: TIT.3.7
reference: Titus 3:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα δικαιωθέντες τῇ ἐκείνου χάριτι κληρονόμοι ⸀γενηθῶμεν κατ’ ἐλπίδα ζωῆς αἰωνίου.
base_translation:
  language: en
  yaml_path: translation/nt/titus/003/007.yaml
  text: so that[a], having been justified by his grace[b], we might become heirs according to the hope of eternal life.
translation:
  language: ja
  text: それは、私たちがその方の恵みによって義と認められ、永遠の命への希望に基づく相続人となるようにするためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: それは～ためです
  rationale: 目的または結果を導く接続表現として、前節とのつながりを保ちながら自然な現代日本語にした。
- source_word: δικαιωθέντες
  choice: 義と認められ
  rationale: アオリスト受動分詞の受動性を保ち、主要動詞に先立つ救いの行為を表す。「義とされ」も可能だが、「義と認められる」はδικαιόωの法廷的含意を明瞭に伝える。
- source_word: τῇ ἐκείνου χάριτι
  choice: その方の恵みによって
  rationale: 与格の手段的用法を「によって」で示した。ἐκείνουの指示対象を神またはイエス・キリストと明示せず、原文に残る指示上の余地を「その方」で保った。
- source_word: κληρονόμοι
  choice: 相続人
  rationale: 受け継ぐ者という比喩と、聖書における相続の主題を保つ標準的な訳語。
- source_word: γενηθῶμεν
  choice: 私たちが～となる
  rationale: γίνομαιの状態・身分への移行を「となる」で自然に表し、外的使役を必要以上に強調しない。
- source_word: κατ’ ἐλπίδα
  choice: 希望に沿って
  rationale: κατάの対応・規準の含みを残しつつ、「希望に従って」より自然な日本語とした。ただし「希望のうちに」という読みも可能なため脚注で示した。
- source_word: ζωῆς αἰωνίου
  choice: 永遠の命
  rationale: 希望の内容または対象を示す属格句として、定着した明瞭な訳語を用いた。
theological_decisions:
- issue: δικαιωθέντεςの救済論的意味
  choice: 義と認められ
  alternative: 義とされ
  rationale: 神の恵みによる受動的な行為を保ち、δικαιόωを特定の教派的説明に狭めない。代替訳も意味上可能なので脚注に残した。
- issue: ἐκείνουの指示対象
  choice: その方
  alternative: 神の／イエス・キリストの
  rationale: 直前の救いの文脈を受ける一方、原文はここで固有の指示対象を明記しないため、日本語でも明示的に限定しなかった。
- issue: κατ’ ἐλπίδαとκληρονόμοιの関係
  choice: 永遠の命の希望に沿って、相続人となる
  alternative: 永遠の命を望みつつ、相続人となる
  rationale: 希望を相続人としての身分に結びつける原文の語順と関係を保ちながら、κατάの意味を一つに断定しないよう代替を脚注に示した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「その方」によって代名詞の指示対象を過度に限定せず、「相続人」で原文の相続比喩を保持した。
