- from: それは、その方の恵みによって義と認められ[a]、永遠の命の希望に沿って[b]、私たちが相続人となるためです。
  to: それは、私たちがその方の恵みによって義と認められ、永遠の命への希望に基づく相続人となるようにするためです。
  rationale: 目的を導く ἵνα は「…となるようにするため」として自然に表し、δικαιωθέντες の受動性と先行性は「恵みによって義と認められ」で維持した。κατ’ ἐλπίδα ζωῆς αἰωνίου は、希望の内容を「永遠の命への希望」と明示し、その希望に関係する相続人の身分を「希望に基づく相続人」と表した。これにより、原文の関係を保ちながら不自然な「希望に沿って」を避けた。
