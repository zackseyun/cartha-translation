lexical_decisions:
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 前節の否定的な資質と対照させ、求められる肯定的な資質へ転じる接続詞。日本語では「しかし」よりも、対照的な要件への転換を自然に示す。
- source_word: φιλόξενον
  choice: 旅人を温かく迎え
  rationale: 客や見知らぬ人を進んで迎える資質を表す。「もてなし好き」より意味が具体的で、現代の読者にも自然に伝わる。
- source_word: φιλάγαθον
  choice: 善を愛し
  rationale: 複合形容詞の「善いものを愛する」という意味を簡潔に保つ。人だけでなく善そのものへの愛を含み得る表現。
- source_word: σώφρονα
  choice: 分別があり
  rationale: 健全な判断、慎み、節度を表す語。ἐγκρατῆとの違いを保つため、ここでは衝動の抑制よりも思慮と節度に重点を置く。
- source_word: δίκαιον
  choice: 正しく
  rationale: 人との関係や行動における公正さ、正しさを表す。司法的な意味だけに狭めない自然な訳。
- source_word: ὅσιον
  choice: 敬虔で
  rationale: 神に対してふさわしく忠実であること、聖なるものを重んじる姿勢を表す。人物の資質として自然な日本語を採用した。
- source_word: ἐγκρατῆ
  choice: 自制できる
  rationale: 欲望や衝動を支配する力を表す。σώφροναを「分別があり」とすることで、近接する二つの徳を同一表現に潰さず区別する。
theological_decisions:
- issue: σώφροναとἐγκρατῆという近接する二つの徳の区別
  choice: σώφροναを「分別があり」、ἐγκρατῆを「自制できる」と訳す
  alternative: 両方を「自制心がある」に近い表現で訳す、またはσώφροναを「慎み深い」と訳す
  rationale: 両語は意味領域が重なるが、前者は健全な思慮と節度、後者は欲望や衝動に対する自己統御に重点がある。訳語を分けて原文の徳目の重なりと相違をともに示す。
- issue: ὅσιονの宗教的・倫理的含意
  choice: 「敬虔で」
  alternative: 「聖く」または「神に忠実で」
  rationale: この語は一般的な道徳的正しさを表すδίκαιονと並び、神や聖なるものに対するふさわしい姿勢を示す。「敬虔」はその方向性を保つが、存在論的な聖性に限定しない。
translation_notes:
  register: 明快な現代標準語を用いながら、教会指導者に求められる資質の列挙にふさわしい落ち着いた文体とした。ギリシア語本文は前節から統語的に続くため、日本語では省略された義務表現を補い、「者でなければなりません」で文として完結させた。
