id: TIT.1.2
reference: Titus 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπ’ ἐλπίδι ζωῆς αἰωνίου, ἣν ἐπηγγείλατο ὁ ἀψευδὴς θεὸς πρὸ χρόνων αἰωνίων
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/002.yaml
  text: in the hope of eternal life[a], which the God who does not lie promised before the ages began
translation:
  language: ja
  text: 永遠のいのちへの希望に基づくものです。このいのちは、偽ることのない神が、永遠の時代が始まる前に[a]約束されたものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「永遠の（または、長い時代にわたる）時より前に」。また、「時が始まる前に」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπ’ ἐλπίδι
  choice: 希望に基づいています
  rationale: ἐπί＋与格が持ちうる基盤・根拠の意味を文脈に即して表す。前節から続く長い文の一部として、現代日本語では述語を補うことで明瞭にした。
- source_word: ζωῆς αἰωνίου
  choice: 永遠のいのちという
  rationale: 属格を希望の内容として自然に示す。「永遠のいのち」は新約聖書で定着し、意味も明瞭である。
- source_word: ἣν
  choice: そのいのちは
  rationale: 女性単数の関係代名詞は直前の「永遠のいのち」を受けると理解し、日本語では指示表現で明示した。
- source_word: ἐπηγγείλατο
  choice: 約束してくださった
  rationale: アオリスト中動態を「約束した」と捉え、神を主語とする日本語として敬意を表す補助動詞を添えた。原語にない約束の相手は補わない。
- source_word: ὁ ἀψευδὴς θεὸς
  choice: 偽ることのない神
  rationale: ἀψευδήςの否定的な形を保ちつつ自然な日本語とした。「偽ることのできない」として能力・不可能性を強く明示することは避けた。
- source_word: πρὸ χρόνων αἰωνίων
  choice: 永遠の昔から続く時よりも前に
  rationale: χρόνων αἰωνίωνの「時」とαἰώνιοςの長久性をできるだけ見える形で残した。日本語として特異な表現になるため、脚注で直訳と一般的な理解を示す。
theological_decisions:
- issue: πρὸ χρόνων αἰωνίωνにおける神の約束の時点と相手
  choice: 「永遠の昔から続く時よりも前に」とし、時代・時の始まりに先立つ約束として表すが、約束の相手は特定しない。
  alternative: 「時が始まる前に」「永遠の昔に」「世々の時より前に」
  rationale: 原文は約束をχρόνων αἰωνίωνより前に置くが、それが三位一体内の約束、神の定め、その他の仕方のいずれかは明記しない。その神学的緊張を残す。
- issue: 神を表すἀψευδήςの強さ
  choice: 「偽ることのない神」
  alternative: 「偽ることのできない神」「真実な神」
  rationale: 神の真実性を表しつつ、形容詞を能力的不可能性へと明示的に強めず、原文の否定表現も保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。1:1から続くギリシア語の長文を単独節として読めるよう述語を補った。「いのち」は日本語聖書で親しまれた表記を採用。脚注標識は該当する時間表現の文末に置いた。
