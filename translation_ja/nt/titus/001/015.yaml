id: TIT.1.15
reference: Titus 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀πάντα καθαρὰ τοῖς καθαροῖς· τοῖς δὲ μεμιαμμένοις καὶ ἀπίστοις οὐδὲν καθαρόν, ἀλλὰ μεμίανται αὐτῶν καὶ ὁ νοῦς καὶ ἡ συνείδησις.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/015.yaml
  text: All things are pure to the pure; but to those who are defiled and unbelieving[a], nothing is pure. Instead, both their mind and their conscience are defiled.
translation:
  language: ja
  text: 清い人々には、すべてのものが清い。しかし、汚れていて信じない人々には、清いものは何一つない。むしろ、その知性も良心も汚れている。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清い」は、この節全体で、儀礼上の清さと道徳上の純粋さの両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: すべてのもの
  rationale: 中性複数を包括的に訳し、格言的な広がりを保った。
- source_word: καθαρά / καθαρόν / καθαροῖς
  choice: 清い／清い人々
  rationale: 儀礼的な清浄と道徳的な純粋さの双方を含み得る語なので、日本語でも両面を帯び得る「清い」で統一した。
- source_word: τοῖς δὲ μεμιαμμένοις
  choice: 汚れていて…人々
  rationale: 完了分詞が示す、汚された結果として現在その状態にあることを自然な日本語で表した。
- source_word: ἀπίστοις
  choice: 信じない人々
  rationale: ここでは主として信仰を持たないことを指すため、「不誠実な」ではなく「信じない」とした。
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 外側の物ではなく当人の内面こそが汚れているという強い対照を示した。
- source_word: νοῦς
  choice: 知性
  rationale: 思考し理解する内的機能を表す語として、文脈に適した現代日本語を選んだ。
- source_word: συνείδησις
  choice: 良心
  rationale: 道徳的な自己認識・判断機能を表す標準的な訳語を用いた。
- source_word: καὶ ... καὶ
  choice: …も…も
  rationale: 知性と良心の双方が汚れているという並列の強調を自然に示した。
theological_decisions:
- issue: 清さを表す語の範囲
  choice: καθαρόςを一貫して「清い」と訳し、儀礼的・道徳的な含意をともに残した。
  alternative: 「純粋な」と訳して道徳的な意味合いを前面に出す。
  rationale: 直前の文脈にはユダヤ人の作り話や規定への言及がある一方、この節は人の知性と良心にも及ぶ。「清い」は意味を儀礼面または道徳面の一方だけに限定しにくい。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の対句構造と「清い／汚れている」の反復を維持した。脚注記号は、節全体にかかわる語義注であることが分かるよう文末に置いた。
