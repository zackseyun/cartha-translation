id: TIT.1.13
reference: Titus 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ μαρτυρία αὕτη ἐστὶν ἀληθής. δι’ ἣν αἰτίαν ἔλεγχε αὐτοὺς ἀποτόμως, ἵνα ὑγιαίνωσιν ἐν τῇ πίστει,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/013.yaml
  text: This testimony is true. For this reason[a], rebuke them sharply, so that they may be sound in the faith,
translation:
  language: ja
  text: この証言は真実です。ですから、彼らを厳しく戒めなさい。彼らが信仰[a]において健全であるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの信仰が健全であるように」。ギリシア語の句は、キリスト教信仰において健全であることとも、彼ら自身の信仰が健全であることとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρία
  choice: 証言
  rationale: 直前に引用されたクレタ人についての言明を、現実に即した証言として受けている。単なる「発言」よりも、証しとしてのニュアンスを保つ。
- source_word: ἀληθής
  choice: 真実です
  rationale: その証言が現実に合致していることを示す述語形容詞。現代日本語として直接的で自然な表現とした。
- source_word: δι’ ἣν αἰτίαν
  choice: ですから
  rationale: 直前の判断を根拠として次の命令を導く因果関係を、明快で自然な現代日本語で表す。
- source_word: ἔλεγχε
  choice: 戒めなさい
  rationale: 誤りを明らかにして正すという、直接的かつ矯正的な命令の力を表す。「非難する」ほど処罰的にはせず、目的が回復にあることも保つ。
- source_word: ἀποτόμως
  choice: 厳しく
  rationale: 手加減せず鋭く対処する強さを示す。日本語では「厳しく」が自然であり、不必要に感情的な語調を加えない。
- source_word: ὑγιαίνωσιν
  choice: 健全になる
  rationale: 本来の健康に関する比喩を保ちながら、ここでは教えや信仰の正しさと健やかさを表す。
- source_word: ἐν τῇ πίστει
  choice: 信仰において
  rationale: キリスト者の信仰という領域または内容において健全である、という読みを表す一方、個人の信仰のあり方を指す可能性も排除しない。
theological_decisions:
- issue: ἐν τῇ πίστει の意味
  choice: 信仰において健全になる
  alternative: 信仰が健全になる
  rationale: 牧会書簡の文脈では、πίστις は信じる行為だけでなく、キリスト教信仰の内容を指し得る。しかし、この句は個々人の信仰が健やかになることとも理解できるため、本文で一方に限定せず、別訳を脚注に示した。
translation_notes:
  register: 明快で格調を失わない現代標準日本語。「厳しく戒めなさい」で命令の強さと矯正目的を両立させ、「健全になる」で原文の健康の比喩を保持した。
