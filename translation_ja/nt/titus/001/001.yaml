revisions:
- from: 神の奴隷であり、イエス・キリストの使徒であるパウロから。私が使徒とされたのは、神に選ばれた人々[a]の信仰と、敬虔にかなう[c]真理の認識[b]のためです。
  to: 神の奴隷であり、イエス・キリストの使徒であるパウロから。私は、神に選ばれた人々[a]の信仰と、敬虔にかなう[c]真理の認識[b]のために、使徒として仕えています。
  rationale: 原文にない「使徒とされた」という任命の叙述を除き、使徒としての働きが信仰と真理の認識のためにあることを明示した。「仕えています」は書簡の自己紹介として自然な補いであり、δοῦλοςの「奴隷」は冒頭で保持している。脚注のアンカーと内容は維持した。
