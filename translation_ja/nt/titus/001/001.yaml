  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος θεοῦ, ἀπόστολος δὲ Ἰησοῦ Χριστοῦ κατὰ πίστιν ἐκλεκτῶν θεοῦ καὶ ἐπίγνωσιν ἀληθείας τῆς κατ’ εὐσέβειαν
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/001.yaml
  text: Paul[a], a servant of God and an apostle of Jesus the Messiah, for the faith of God’s chosen ones and the knowledge of the truth that accords with godliness[c][b],
translation:
  language: ja
  text: 神の奴隷であり、イエス・キリストの使徒であるパウロから。私は、神に選ばれた人々[a]の信仰と、敬虔にかなう[c]真理の認識[b]のために、使徒として仕えています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の選民」。
    reason: lexical_alternative
  - marker: b
    text: 「十分な認識」または「深い認識」という意味を含む可能性がある。
    reason: lexical_alternative
  - marker: c
    text: 別訳「敬虔へと導く」。
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隷
  rationale: 神への全面的な帰属を表す語の強さを保つ。「しもべ」より原語の身分的含意を明確に伝える。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 委任され、遣わされた者としてのパウロの職務を表す定着した訳語。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: Χριστόςの称号的背景を含みつつ、日本語で定着した聖書用語を用いる。
- source_word: κατὰ πίστιν
  choice: 信仰…のため
  rationale: κατάを、使徒職が神に選ばれた人々の信仰に向けられていることを示す目的・関連の意味に取る。
- source_word: ἐκλεκτῶν θεοῦ
  choice: 神に選ばれた人々
  rationale: 神による選びを明示しながら、特定の教派的体系を付加せず、現代の一般読者に分かりやすく表す。
- source_word: ἐπίγνωσιν
  choice: 認識
  rationale: 単なる情報的知識より、真理を知り受け入れる意味を表せる。「十分な認識」という強意の可能性は脚注に残す。
- source_word: ἀληθείας
  choice: 真理
  rationale: 定冠詞を日本語で不自然に明示せず、文脈上特定される真理を簡潔に表す。
- source_word: τῆς κατ’ εὐσέβειαν
  choice: 敬虔にかなう
  rationale: κατάが示す真理と敬虔との対応関係を保ち、因果関係に限定しない。
- source_word: εὐσέβειαν
  choice: 敬虔
  rationale: 神への畏敬が生活に現れることを表す、牧会書簡にふさわしい定着した訳語。
theological_decisions:
- issue: κατὰ πίστιν … καὶ ἐπίγνωσιν と使徒職との関係
  choice: 使徒職は、選ばれた人々の信仰と真理の認識のために与えられた
  alternative: 使徒職は、その信仰と認識に従う／それらに即している
  rationale: 圧縮された構文には基準・対応の読みもあり得るが、ここではパウロの使徒職の方向ないし目的を示す読みを本文に採る。
- issue: ἐκλεκτῶν θεοῦ の表現
  choice: 神に選ばれた人々
  alternative: 神の選民
  rationale: 神による選びを保ちつつ、「選民」が帯び得る民族的または体系神学的な連想を本文で固定しない。
- issue: 真理と敬虔の関係
  choice: 敬虔にかなう真理
  alternative: 敬虔へと導く真理
  rationale: 原文のκατάは適合・対応と結果的方向の双方を許し得るため、本文ではより形式的に関係を保ち、目的・結果の読みを脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、書簡冒頭として「パウロから」を補って自然な導入にした。δοῦλοςは原語の強さを保つため「奴隷」とし、全体は厳粛さを保ちながら過度に文語的にならない表現とした。
