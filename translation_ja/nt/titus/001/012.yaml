  text: εἶπέν τις ἐξ αὐτῶν, ἴδιος αὐτῶν προφήτης, Κρῆτες ἀεὶ ψεῦσται, κακὰ θηρία, γαστέρες ἀργαί·
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/012.yaml
  text: One of them[a], their own prophet, said, “Cretans are always liars, evil beasts, lazy gluttons.”
translation:
  language: ja
  text: '彼らのうちの一人、すなわち彼ら自身の預言者が、こう言った。


    「クレタ人はいつもうそつき、たちの悪い獣、怠け者の食いしん坊[a]だ。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「怠惰な腹」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπέν τις ἐξ αὐτῶν
  choice: 彼らのうちの一人が言っています
  rationale: τις と ἐξ αὐτῶν の不定・部分の意味を自然な現代日本語で表す。現在形は、この引用が今も記録として語っているという日本語の引用導入として自然だが、ギリシア語のアオリストは発言という出来事を指す。
- source_word: ἴδιος αὐτῶν προφήτης
  choice: 彼ら自身の預言者
  rationale: ἴδιος の「彼らに属する、彼ら自身の」という強調を保ち、クレタ人側の人物による発言であることを明示する。
- source_word: Κρῆτες ἀεὶ ψεῦσται
  choice: クレタ人はいつもうそつき
  rationale: 民族名、ἀεί の継続的表現、ψεύστης の直接的な非難を簡潔に保持する。
- source_word: κακὰ θηρία
  choice: たちの悪い獣
  rationale: θηρία の獣という比喩を保持しつつ、κακά の道徳的・有害な含みを現代日本語として自然に表す。
- source_word: γαστέρες ἀργαί
  choice: 怠け者の食いしん坊
  rationale: 直訳は「怠惰な腹」だが、日本語では意味が不透明になりやすいため、働かず食欲にふける者という侮蔑的な意味を本文で明瞭にする。直訳は脚注に示す。
theological_decisions:
- issue: パウロが引用する民族的な非難の扱い
  choice: 「彼ら自身の預言者」の引用として明示し、厳しい表現を弱めずに訳す
  alternative: 民族的な一般化を和らげて意訳する
  rationale: 原文はこれをクレタ人側の預言者による引用として提示している。翻訳では引用の厳しさと帰属の双方を保持し、それが翻訳者自身の一般的断定であるかのようには見せない。
translation_notes:
  register: 明瞭な現代標準語を用い、引用の格言的で鋭い調子を保った。「うそつき」は常用的で直接的、「たちの悪い獣」は比喩性と非難の力を両立させる。脚注記号[a]は本文中に配置した。
