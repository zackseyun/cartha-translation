revisions:
- from: しかし、ご自身の定めた時に[a]、そのことばを宣教[b]によって明らかにされました。私は、私たちの救い主である神の命令に従って、その宣教を委ねられたのです[c]。
  to: しかし、神は、ご自分の定めた時に[a]、そのことばを宣教を通して[b]明らかにしました。私は、私たちの救い主である神の命令に従って、その宣教を委ねられたのです[c]。
  rationale: 神を明示し、「明らかにしました」と能動態に改めて、ἐφανέρωσενの形と文脈上の行為主体を明確にした。「宣教を通して」により、ἐν κηρύγματιの手段的関係を自然に表した。それ以外の語彙選択、関係代名詞の主要な係り先、および代替解釈を示す脚注は原文と監査記録に照らして維持できる。
