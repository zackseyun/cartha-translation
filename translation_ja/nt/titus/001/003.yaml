id: TIT.1.3
reference: Titus 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐφανέρωσεν δὲ καιροῖς ἰδίοις, τὸν λόγον αὐτοῦ ἐν κηρύγματι ὃ ἐπιστεύθην ἐγὼ κατ’ ἐπιταγὴν τοῦ σωτῆρος ἡμῶν θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/003.yaml
  text: but in his own times he revealed his word through the proclamation with which I was entrusted[a], according to the command of God our Savior[c][b],
translation:
  language: ja
  text: しかし、神は、ご自分の定めた時に[a]、そのことばを宣教を通して[b]明らかにしました。私は、私たちの救い主である神の命令に従って、その宣教を委ねられたのです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「ご自身の時々に」。神に属する時、すなわち神が定めた適切な時を指すと考えられます。「適切な時に」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「宣べ伝えることによって」とも訳せます。原語は、宣べ伝える行為と、宣べ伝えられる知らせのどちらをも指し得ます。
    reason: lexical_alternative
  - marker: c
    text: 「委ねられた」の目的語を「その宣教」ではなく「そのことば」と理解し、「私に委ねられたそのことば」と訳すこともできます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐφανέρωσεν
  choice: 明らかにされました
  rationale: 直前の文脈から神を省略された主語と捉え、以前は隠されていたものを公に示す意味を、自然で品位ある現代日本語で表した。
- source_word: καιροῖς ἰδίοις
  choice: ご自身の定めた時に
  rationale: ἰδίοιςの所有の含みと、καιροῖςが表す神に属する適切な時機を、日本語として自然に表した。複数形は文脈上、特定の啓示の時機を集合的に指すため、単数的な日本語表現とした。
- source_word: τὸν λόγον αὐτοῦ
  choice: そのことば
  rationale: 神が伝える福音の知らせを指しつつ、λόγοςとの語彙的な対応と文脈上のつながりを保った。
- source_word: ἐν κηρύγματι
  choice: 宣教によって
  rationale: ἐνを手段として捉え、κήρυγμαが宣べ伝える行為と宣べ伝えられる内容の双方を指し得る曖昧さを、「宣教」で可能な限り保った。
- source_word: ὃ
  choice: その宣教を
  rationale: 中性単数の関係代名詞の最も近い先行詞をκήρυγμαと捉え、日本語では関係節を独立した文に組み替えて明示した。λόγονを先行詞とする可能性は脚注に残した。
- source_word: ἐπιστεύθην
  choice: 私は…委ねられた
  rationale: この受動形は「信じた」ではなく、務めや内容を託されたことを表すため、受託の意味を明確にした。
- source_word: κατ’ ἐπιταγὴν
  choice: 命令に従って
  rationale: 権威ある指示への合致またはそれに基づくことを示すκατάの意味を、自然な日本語で表した。
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: 私たちの救い主である神
  rationale: 「救い主」が神を説明する同格的な称号であることを明瞭にし、牧会書簡に特徴的な表現を保った。
theological_decisions:
- issue: ἐφανέρωσενの省略された主語とκαιροῖς ἰδίοιςの所有的含意
  choice: 神を主語とし、「ご自身の定めた時に…明らかにされました」とした。
  alternative: 「適切な時に、それは明らかにされた」のように非人称的に訳すこともできる。
  rationale: 直前では、偽ることのない神が永遠の昔に約束したことが語られており、ここでも神を行為者とするのが文脈の流れに最もよく合う。
- issue: 関係代名詞ὃの先行詞
  choice: 直近のκήρυγμα（宣教）を受けると解した。
  alternative: τὸν λόγον αὐτοῦ（そのことば）を受け、「私に委ねられたそのことば」と理解することもできる。
  rationale: 性・数はいずれの名詞とも一致するが、直近の先行詞はκήρυγμαであり、ἐπιστεύθηνとも自然につながる。一方、語順上離れたλόγονを受ける可能性も genuine な統語的選択肢として脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、神についての敬意を「ご自身」と敬語の述語で表した。原文の長い一文は、関係代名詞の係り先について採用した読みを自然な日本語で示すため二文に分けた。専門的な教会用語に偏りすぎないよう配慮しつつ、κήρυγμαには一般にも理解可能で文脈にふさわしい「宣教」を用いた。
