id: TIT.1.4
reference: Titus 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τίτῳ γνησίῳ τέκνῳ κατὰ κοινὴν πίστιν· χάρις ⸀καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τοῦ σωτῆρος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/004.yaml
  text: 'To Titus[b][a], my true child according to our common faith: grace and peace from God the Father and Messiah Jesus our Savior.'
translation:
  language: ja
  text: '共通の信仰に基づく私の真の子テトスへ。


    父なる神と、私たちの救い主であるメシア・イエスから、恵みと平安がありますように。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίτῳ
  choice: テトスへ
  rationale: 書簡の宛先を示す与格を、現代日本語の自然な書簡表現「〜へ」で表した。
- source_word: γνησίῳ τέκνῳ
  choice: 真の子
  rationale: 実子という意味ではなく、信仰における親子関係が真正であることを表す比喩として、簡潔で自然な「真の子」とした。τέκνον自体は性別を明示しないため「息子」とはしなかった。
- source_word: κατὰ κοινὴν πίστιν
  choice: 共通の信仰による
  rationale: κατάの基準・関係を示す働きと、κοινόςの「共に有する」という意味を保った。日本語では文脈上「私たちの」を補わなくてもパウロとテトスが共有する信仰だと理解できる。
- source_word: χάρις καὶ εἰρήνη
  choice: 恵みと平安がありますように
  rationale: 初期キリスト教書簡の祝福の挨拶として、名詞をそのまま並べるより自然な日本語になるよう願望表現を補った。
- source_word: θεοῦ πατρὸς
  choice: 父なる神
  rationale: 原文には「私たちの」に当たる語がないため、それを補わず、定着した明瞭な表現とした。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシア、イエス
  rationale: Χριστόςの称号としての意味を「メシア」で訳し、固有名のように不透明な音訳だけで処理しなかった。日本語で両者の関係が分かるよう、本文では「私たちの救い主であるメシア、イエス」と構成した。
- source_word: τοῦ σωτῆρος ἡμῶν
  choice: 私たちの救い主である
  rationale: 定冠詞を伴う同格句が直前のメシア・イエスを指す構文を明瞭に表した。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςが「油注がれた者」という称号であることを読者に伝えるため「メシア」とした。伝統的な「キリスト」は脚注に示した。
- issue: 「私たちの救い主」の係り先
  choice: メシアであるイエスを修飾する
  alternative: 神とイエスを含む前置詞句全体に緩やかに関係すると読む
  rationale: τοῦ σωτῆρος ἡμῶνは直前のΧριστοῦ Ἰησοῦに同格で続くのが最も自然であり、イエスを「私たちの救い主」と特定している。
- issue: κατὰ κοινὴν πίστινが示す関係
  choice: 共有する信仰に基づく霊的な親子関係
  alternative: 共通の信仰を規範として真正と認められる子
  rationale: κατάには基準・関係・根拠の幅があるため、「による」と訳して一つに限定しすぎないようにした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。書簡の宛名と祝福の調子を保ちつつ、原文に動詞がない祝福句には、日本語として自然な「ありますように」を補った。「メシア、イエス」は称号と名の関係を示し、「私たちの救い主」がイエスを指すことを構文上明確にした。
