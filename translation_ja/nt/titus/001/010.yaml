source:
  edition: SBLGNT
  text: Εἰσὶν γὰρ πολλοὶ ⸀καὶ ἀνυπότακτοι, ματαιολόγοι καὶ φρεναπάται, μάλιστα οἱ ἐκ ⸀τῆς περιτομῆς,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/010.yaml
  text: For there are many rebellious people[a], empty talkers and deceivers, especially those of the circumcision,
translation:
  language: ja
  text: というのも、従おうとしない者、むなしい話をする者、人を惑わす者が多くいるからです。特に、割礼を受けた者たち[a]がそうです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「割礼に属する者たち」あるいは「割礼の集団の者たち」とも訳せる。この表現はユダヤ系の反対者、または割礼を求める人々を指す可能性が高いが、ギリシア語はそれほど明確に限定していない。
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: というのも…からです
  rationale: 直前の指示の理由を示す接続関係を、現代日本語で自然に明示する。
- source_word: πολλοὶ
  choice: 多くいる
  rationale: 数量を簡潔に表し、並列される実体詞的な形容・名詞を受ける自然な述語とした。
- source_word: ἀνυπότακτοι
  choice: 従おうとしない者
  rationale: 正当な権威や秩序に服さない意味を保ちつつ、「反抗的な者」より行為姿勢が明確な現代語とした。
- source_word: ματαιολόγοι
  choice: むなしい話をする者
  rationale: 内容のない、益にならない言説を語る者という複合語の意味を、分かりやすく表した。
- source_word: φρεναπάται
  choice: 人を惑わす者
  rationale: 人の思考や判断を欺く者という意味を、過度に字義的にならない自然な日本語で表した。
- source_word: μάλιστα
  choice: 特に
  rationale: より大きな集団の中で、とりわけ該当する一群を強調する語として自然である。
- source_word: οἱ ἐκ τῆς περιτομῆς
  choice: 割礼の者たち
  rationale: 直訳的な簡潔さを保ち、「ユダヤ人」や「割礼派」と断定して原文以上に対象を限定することを避けた。
theological_decisions:
- issue: 「割礼の者たち」が指す対象
  choice: 本文では「割礼の者たち」とし、対象を明示的に限定しない。
  alternative: 「割礼派の者たち」または「ユダヤ人の中の者たち」
  rationale: 文脈上はユダヤ系または割礼を要求する反対者を指す可能性が高いが、ギリシア語は「党派」や「ユダヤ人」を明記していないため、その曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「というのも…からです」で前節との説明関係を示し、列挙は平易な表現にした。原文では一文だが、日本語での可読性のため二文に分けた。
