  text: μὴ προσέχοντες Ἰουδαϊκοῖς μύθοις καὶ ἐντολαῖς ἀνθρώπων ἀποστρεφομένων τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/014.yaml
  text: not paying attention to Jewish myths and commandments of people who turn away from the truth[a].
translation:
  language: ja
  text: ユダヤ的な作り話や、真理に背を向ける人々が定めた人間の戒めに心を向けないようにさせなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ的な作り話や、真理に背を向ける人々による人間の戒めに傾倒しないようにさせなさい。」
    reason: μὴ προσέχοντεςは「心を向けない」のほか「傾倒しない」とも訳せる。ἐντολαῖς ἀνθρώπωνは、人間に由来する戒めを指す。
lexical_decisions:
- source_word: μὴ προσέχοντες
  choice: 心を向けないように
  rationale: προσέχωの、注意を向ける・傾倒するという意味を自然な現代日本語で表し、否定の分詞が前節から続く勧告の内容であることも示した。
- source_word: Ἰουδαϊκοῖς μύθοις
  choice: ユダヤ人の作り話
  rationale: μῦθοςが指す根拠のない物語という否定的含意を、「神話」より文脈に即した平明な「作り話」で表した。Ἰουδαϊκοῖςは、その性格または起源を示すものとして「ユダヤ人の」とした。
- source_word: ἐντολαῖς ἀνθρώπων
  choice: 人々の戒め
  rationale: ἐντολήの宗教的・規範的な響きを「戒め」で保ち、ἀνθρώπωνは性別を限定しない「人々」とした。神の真理に対する、人間に由来する規定という対照を過度に説明せず残している。
- source_word: ἀποστρεφομένων
  choice: 背を向ける
  rationale: 単なる知的否定よりも、ἀποστρέφωの方向転換の比喩を保つ表現とした。現在分詞の継続的な含みも日本語として無理なく伝わる。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: 定冠詞を伴うἀλήθειαを簡潔に「真理」とし、福音の真理などと訳文中で限定しなかった。
theological_decisions:
- issue: 属格複数分詞ἀποστρεφομένωνの係り先
  choice: 直前のἀνθρώπωνを修飾し、「真理に背を向ける人々の戒め」とした。
  alternative: 作り話と戒めの双方を、真理に背を向けた者たちに関係するものとして緩やかに受け取る。
  rationale: 格の一致と語順から、ἀνθρώπωνへの修飾が最も自然である。ただし脚注では構文を組み替えた訳の可能性を示し、結び付きの幅を完全には隠さない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「作り話」は理解しやすさを優先し、「戒め」「真理」で文脈の宗教的重みを保った。前節に依存する分詞構文は、単独でも意味が通るよう「させなさい」で補った。
