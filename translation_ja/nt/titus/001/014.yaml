revisions:
- from: ユダヤ人の作り話や、真理に背を向ける人々の戒めに心を向けないようにさせなさい。[a]
  to: ユダヤ的な作り話や、真理に背を向ける人々が定めた人間の戒めに心を向けないようにさせなさい。[a]
  rationale: 原文の最も自然な構文に従い、ἀποστρεφομένωνをἀνθρώπωνに係らせた。そのうえで、ἐντολαῖς ἀνθρώπωνが単に「人々に関する戒め」ではなく、人間に由来する戒めであることを本文に反映した。Ἰουδαϊκοῖςの形容詞的な性格は「ユダヤ的な」で保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:04:16Z'
review_pass:
  verdict: revise
  source_fidelity: 主文の「真理に背を向ける人々の戒め」は、ἀποστρεφομένωνがἀνθρώπωνを修飾する関係をおおむね伝えていますが、ἐντολαῖς ἀνθρώπωνにある「人間的／人に由来する」ことと神的な真理との対比が訳出されていません。「人々の戒め」だけでは、人々に対して与えられる戒めとも読めます。Ἰουδαϊκοῖςは民族全体についての断定ではなく、ユダヤ的性格・由来を示す形容詞なので、「ユダヤ的な」がより適切です。
  naturalness: 「心を向けないようにさせなさい」は、前節から続く勧告として自然です。「真理に背を向ける人々が定めた人間の戒め」とすることで、現代標準語として明瞭にしつつ、属格の関係も無理なく表せます。
  terminology: 「真理」「戒め」は本文の宗教的・規範的な語調を保っています。「作り話」はμῦθοιの批判的文脈を平明に伝えますが、民族・宗教集団一般への評価と読まれないよう、「ユダヤ人の」ではなく「ユダヤ的な」とします。
  issues:
  - severity: medium
    issue: ἐντολαῖς ἀνθρώπωνの「人間に由来する」要素が主文で弱い
    rationale: 「人々の戒め」には、人々が発した戒めではなく、人々に向けた戒めという読みもあり得ます。原文の属格と、真理に背を向ける者たちとの関係を「人々が定めた人間の戒め」と明示するのが安全です。
  - severity: low
    issue: Ἰουδαϊκοῖςを「ユダヤ人の」としている
    rationale: 原語は「ユダヤ的な／ユダヤに関する」という形容詞です。「ユダヤ的な」とするほうが原語の幅を保ち、民族集団全体を指すような不要な含みを避けられます。
  - severity: low
    issue: 脚注の別訳が「人々から出た人間の戒め」と重複的で不自然
    rationale: 代替訳としては、προσέχοντεςの語彙的可能性を示しつつ、「人間の戒め」の由来を自然な日本語で表す必要があります。
  revised_text: ユダヤ的な作り話や、真理に背を向ける人々が定めた人間の戒めに心を向けないようにさせなさい。[a]
