id: TIT.1.7
reference: Titus 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δεῖ γὰρ τὸν ἐπίσκοπον ἀνέγκλητον εἶναι ὡς θεοῦ οἰκονόμον, μὴ αὐθάδη, μὴ ὀργίλον, μὴ πάροινον, μὴ πλήκτην, μὴ αἰσχροκερδῆ,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/007.yaml
  text: For an overseer must be above reproach as God's steward[a], not self-willed, not quick-tempered, not given to wine, not violent, not greedy for shameful gain[b],
translation:
  language: ja
  text: というのも、監督者は、神の家の管理を任された者として、非難されるところのない人でなければなりません。自分勝手であってはならず、怒りっぽくなく、酒にふけらず、暴力的でなく、恥ずべき利益をむさぼる者であってはなりません。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「監督者」は、「司教」とも訳されます。原語は監督する者を意味し、ここでは後代の教会制度に特有の意味をあらかじめ持ち込まない訳語を用いています。
    reason: ἐπίσκοποςの訳語の選択肢を示すため。
  - marker: b
    text: 「恥ずべき利益」は、「不正な利益」とも訳せます。原語は違法な利益だけでなく、道徳的に卑しい利益を広く含みます。
    reason: αἰσχροκερδήςの語義上の選択肢を示すため。
lexical_decisions:
- source_word: δεῖ
  choice: 〜でなければなりません
  rationale: 監督者に求められる必要性・義務を、明確で自然な現代日本語で表す。
- source_word: γὰρ
  choice: （訳文では明示せず）
  rationale: 前節の理由を説明する接続辞だが、日本語では文脈上明らかであり、「というのも」などを置くより自然な流れを優先した。
- source_word: ἐπίσκοπον
  choice: 監督者
  rationale: 「見守り、監督する者」という語義を保ち、後代の教会制度に伴う特定の含意を持ち込みにくい表現とした。
- source_word: ἀνέγκλητον
  choice: 非難されるところのない
  rationale: 正当な告発を受ける余地がないことを表し、絶対的な無罪性や完全性を暗示しすぎない自然な表現。
- source_word: ὡς θεοῦ οἰκονόμον
  choice: 神から託された管理者として
  rationale: οἰκονόμοςの管理と委託・責任の含意を現代日本語で明確にし、神に属し神に対して責任を負う役割を表した。
- source_word: αὐθάδη
  choice: 自分勝手でなく
  rationale: 自分の意志や満足を押し通す、尊大で頑固な性向を平易に表す。
- source_word: ὀργίλον
  choice: 怒りっぽくなく
  rationale: 一度の怒りではなく、怒りやすい性向を自然な日本語で表す。
- source_word: πάροινον
  choice: 酒におぼれず
  rationale: 酒に支配され、酒に伴う節度のない振る舞いをする性向を表しつつ、単に飲酒そのものを禁じるとは断定しない。
- source_word: πλήκτην
  choice: 乱暴でなく
  rationale: 文字どおり人を殴る者という意味を含む暴力的・好戦的な振る舞いを、現代の読者に明瞭に伝える。
- source_word: αἰσχροκερδῆ
  choice: 恥ずべき利益をむさぼらない
  rationale: 利益への貪欲さと、その利益獲得が道徳的に卑しいことの双方を保持する。「不正な」に限定せず、違法性より広い倫理的非難を残した。
theological_decisions:
- issue: 教会の役職を指すἐπίσκοποςの訳語
  choice: 監督者
  alternative: 司教
  rationale: 原語の監督する役割を示しつつ、後代に形成された特定の階層的教会制度を本文へ遡及して持ち込まないため。
- issue: θεοῦ οἰκονόμονにおける属格の関係
  choice: 神から託された管理者
  alternative: 神の管理者
  rationale: 神に属し、神から務めを委ねられた管理者という関係を自然に示す。神そのものを管理するとの誤解を避けつつ、神への説明責任を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。徳目の列挙は「〜なく／〜ず」で簡潔にそろえ、最後を「人であるべきです」としてδεῖの義務性を列挙全体に及ぼした。
