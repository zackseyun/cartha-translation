revisions:
- from: 監督者は、神から託された管理者として、非難されるところのない人でなければなりません。自分勝手でなく、怒りっぽくなく、酒におぼれず、乱暴でなく、恥ずべき利益をむさぼらない人であるべきです。[a]
  to: というのも、監督者は、神の家の管理を任された者として、非難されるところのない人でなければなりません。自分勝手であってはならず、怒りっぽくなく、酒にふけらず、暴力的でなく、恥ずべき利益をむさぼる者であってはなりません。[a][b]
  rationale: 原文のγάρによる説明関係を明示し、οἰκονόμοςの家政管理の比喩を自然な日本語で表した。さらに、πάροινοςを「酒にふけらず」と改め、飲酒そのものの禁止でも単なる酩酊状態でもなく、酒に支配される性向を指す原文の意味を保った。否定項目はすべて監督者に必要な資格として、δεῖの義務性の下に置かれている。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:04:12Z'
