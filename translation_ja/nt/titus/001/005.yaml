id: TIT.1.5
reference: Titus 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τούτου χάριν ⸀ἀπέλιπόν σε ἐν Κρήτῃ ἵνα τὰ λείποντα ἐπιδιορθώσῃ, καὶ καταστήσῃς κατὰ πόλιν πρεσβυτέρους, ὡς ἐγώ σοι διεταξάμην,
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/005.yaml
  text: For this reason I left you in Crete[a], so that you might set in order what remained and appoint elders in every city[c][b], as I directed you.
translation:
  language: ja
  text: このため、私はあなたをクレタに残しました。あなたが、残っている事柄[a]を整え、私があなたに指示しておいた[b]とおり、町ごとに[c]長老たちを任命するためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「欠けている事柄」または「未完の事柄」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「命じておいた」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「それぞれの町に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτου χάριν
  choice: 私があなたをクレタに残したのは……ためです
  rationale: 原因・目的を示す表現を、日本語では文全体を包む「～のは……ためです」という構文で自然に表した。
- source_word: ἀπέλιπόν σε ἐν Κρήτῃ
  choice: あなたをクレタに残した
  rationale: 過去の行為を簡潔に表し、「置き去りにした」という不要な否定的含意は避けた。
- source_word: τὰ λείποντα
  choice: 残っている事柄
  rationale: 未完の事柄と不足している事柄の両方を含み得る表現として、原文の幅を保った。
- source_word: ἐπιδιορθώσῃ
  choice: 整え
  rationale: 未完または不備のある状態を正しく整える意味を、平明で自然な日本語にした。
- source_word: καταστήσῃς
  choice: 任命してもらう
  rationale: 人を一定の役割に立てるという文脈上の意味を明確にした。「してもらう」はἵναによるパウロの目的を自然に示す。
- source_word: κατὰ πόλιν
  choice: 町ごとに
  rationale: κατάと単数名詞による分配の意味を直接的に表した。
- source_word: πρεσβυτέρους
  choice: 長老たち
  rationale: 単なる年長者ではなく共同体内の指導的役割を指す文脈に合い、後代の特定教派の制度を読み込まない訳語とした。
- source_word: ὡς ἐγώ σοι διεταξάμην
  choice: 私があなたに指示しておいたとおり
  rationale: 権威ある指示の意味を保ちつつ、「命じた」ほど語調を限定しない自然な表現とした。
theological_decisions:
- issue: πρεσβυτέρουςが指す教会内の役割
  choice: 「長老たち」と訳し、具体的な職制は規定しない。
  alternative: 「司祭たち」「監督者たち」「年長者たち」
  rationale: この文脈では共同体の指導者を指すが、後代の教派的職制と同一視する根拠は本文だけからは得られないため。
- issue: διεταξάμηνの権威性と語調
  choice: 「指示しておいた」
  alternative: 「命じておいた」
  rationale: パウロの権威ある指示を示しながら、原語が許容する語調の幅を本文で過度に強く限定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒書簡にふさわしい落ち着いた語調を保った。「長老」は広く理解される聖書用語として採用し、特定教派の職制上の意味は付加していない。
