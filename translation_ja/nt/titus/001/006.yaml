id: TIT.1.6
reference: Titus 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴ τίς ἐστιν ἀνέγκλητος, μιᾶς γυναικὸς ἀνήρ, τέκνα ἔχων πιστά, μὴ ἐν κατηγορίᾳ ἀσωτίας ἢ ἀνυπότακτα.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/006.yaml
  text: if anyone is above reproach[a], the husband of one wife[c][b], having faithful children not under accusation of debauchery or insubordinate.
translation:
  language: ja
  text: 非難されるところがなく、一人の妻を持つ夫[b]であり、放蕩のかどで告発されておらず、反抗的でもない忠実な[a]子どもたちがいる人でなければなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信じている」。ギリシア語は「忠実な」とも「信じている」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 直訳「一人の妻の夫」。この表現の具体的な含意については複数の解釈がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέγκλητος
  choice: 非難されるところがなく
  rationale: 正当な告発の対象とならないという意味を、罪のない完全さと誤解させず、資格要件として自然な日本語で表した。
- source_word: μιᾶς γυναικὸς ἀνήρ
  choice: 一人の妻の夫
  rationale: ギリシア語の男性に限定された表現を透明に保ち、婚姻歴や貞節をめぐる解釈を本文で一つに限定しない。
- source_word: τέκνα
  choice: 子どもたち
  rationale: 家庭に関する文脈で自然かつ標準的な訳語。
- source_word: πιστά
  choice: 忠実な
  rationale: 『忠実な／信頼できる』と『信じている』の両義性があるため、本文では広い意味を持つ『忠実な』とし、別訳を脚注に示した。
- source_word: ἐν κατηγορίᾳ ἀσωτίας
  choice: 放蕩だと責められたり
  rationale: κατηγορίαの告発・非難の要素と、ἀσωτίαの節度を失った乱れた生活という意味を、自然な日本語の述語表現で保持した。
- source_word: ἀνυπότακτα
  choice: 反抗的であったりしない
  rationale: 権威や秩序に従わないことを家庭文脈に合う平明な日本語で表した。
theological_decisions:
- issue: τέκνα ἔχων πιστά における πιστά の意味
  choice: 忠実な子どもたち
  alternative: 信じている子どもたち
  rationale: πιστάは、品行上の忠実さ・信頼性とも、キリストを信じていることとも解し得る。本文でその神学的論点を決着させず、別訳を脚注に保存した。
- issue: μιᾶς γυναικὸς ἀνήρ の意味合い
  choice: 一人の妻の夫
  alternative: 一人の女性に誠実な夫
  rationale: 婚姻状態、性的忠実、再婚などをめぐる含意は議論があるため、原文の形に近い表現を採用し、特定の教派的結論を持ち込まない。
- issue: 統語上、ἀσωτίας と ἀνυπότακτα が修飾する対象
  choice: いずれも子どもたちについて述べる
  alternative: なし
  rationale: 複数中性の πιστά、ἀνυπότακταはτέκναに一致し、μή以下は子どもたちの状態を規定している。
translation_notes:
  register: 現代標準日本語による、平明でありながら資格要件にふさわしい品位ある文体。前節から続く条件文として『人でなければなりません』で結んだ。原文の男性限定表現と、πιστάの真正な曖昧さを保持した。
