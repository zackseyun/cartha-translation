id: TIT.1.9
reference: Titus 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀντεχόμενον τοῦ κατὰ τὴν διδαχὴν πιστοῦ λόγου, ἵνα δυνατὸς ᾖ καὶ παρακαλεῖν ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ καὶ τοὺς ἀντιλέγοντας ἐλέγχειν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/009.yaml
  text: holding firmly to the trustworthy word in accordance with the teaching[b][a], so that he may be able both to exhort by sound teaching and to rebuke those who contradict it.
translation:
  language: ja
  text: 教えにかなった信頼できることば[a]を固く守る人でなければなりません。そうすれば、健全な教えによって人々を励まし、反対する人々を戒める[b]ことができるようになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「教えにかなった、真実なことば」とも訳せる。
    reason: πιστόςには「信頼できる」のほか、「真実な」「忠実な」という意味合いもあり得るため。
  - marker: b
    text: 「反対する人々の誤りを明らかにし、反駁する」とも訳せる。このギリシア語動詞には、誤りを示して間違いを認めさせること、戒めることの両方の意味合いがある。
    reason: ἐλέγχωは対人的な戒め・矯正と、誤りを暴き立証することの両方を含み得るため。
lexical_decisions:
- source_word: ἀντεχόμενον
  choice: 固く守る
  rationale: 単なる同意ではなく、揺るがず堅持する能動的な姿勢を、自然な現代日本語で表した。
- source_word: πιστοῦ λόγου
  choice: 信頼すべきことば
  rationale: πιστόςをここでは「信頼できる、確かな」の意味に取り、λόγοςは本文の教え・宣教内容を指す「ことば」とした。
- source_word: κατὰ τὴν διδαχήν
  choice: 教えにかなった
  rationale: κατάの一致・規範の意味を示し、定冠詞付きのδιδαχήが既知の教えを指すことも保った。
- source_word: παρακαλεῖν
  choice: 人々に勧めを与える
  rationale: 慰めだけに限定せず、励ましと勧告を含む牧会的な働きを表すため、「勧めを与える」とした。
- source_word: ἐν τῇ διδασκαλίᾳ τῇ ὑγιαινούσῃ
  choice: 健全な教えによって
  rationale: ὑγιαίνωの「健康である」という比喩的背景を、日本語で定着している「健全な教え」によって自然に表した。
- source_word: τοὺς ἀντιλέγοντας
  choice: 反対する人々
  rationale: 言葉をもって異議を唱え、教えに逆らう人々を指す。目的語は文脈上明らかなため、日本語では過度に補わなかった。
- source_word: ἐλέγχειν
  choice: 誤りを指摘する
  rationale: この動詞が含み得る、誤りを明らかにして正す意味を表した。「戒める」という対人的・牧会的な含みは脚注に残した。
- source_word: δυνατὸς ᾖ
  choice: できる
  rationale: ἵναに続く目的節における能力・適格性を、簡潔で自然な日本語にした。
theological_decisions:
- issue: 「教え」と「信頼すべきことば」の指示内容
  choice: 教会指導者に託された、共有されているキリスト教の教えを指す表現として訳した。
  alternative: 一般的な道徳教育、または個人の見解を指すと取る。
  rationale: 定冠詞付きのδιδαχήと牧会書簡におけるπιστὸς λόγοςの用法は、すでに認識されている教えを示唆する。ただし、後代の教理体系を表す専門語は本文に持ち込まなかった。
- issue: 反対者に対するἐλέγχεινの働き
  choice: 誤りを明らかにして正す面を重視し、「誤りを指摘する」とした。
  alternative: 「戒める」または「論破する」と訳す。
  rationale: この文脈では反論への応答と牧会的な矯正の両面がある。「論破する」だけでは論争的に狭まり、「戒める」だけでは誤りを立証する含みが弱くなるため、本文と脚注で幅を保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、教会指導者の資格を述べる文脈にふさわしい落ち着いた格調を保った。「人でなければなりません」は前節から続く資格列挙を日本語として自立させる補いである。
