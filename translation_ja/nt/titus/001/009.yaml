  - severity: medium
    issue: ἐλέγχεινの対象が「人々」から「人々の誤り」へ移され、本文の矯正的力が弱まっている
    rationale: 「誤りを指摘する」は可能な意味の一部ですが、原文は「反対する人々を」ἐλέγχεινとします。「反対する人々を戒める」とし、脚注で誤りを明らかにして反駁する含意を示すのが、直接目的語と語義の幅の双方を保ちます。
  - severity: low
    issue: 「信頼すべきことば」はやや硬く、「信頼できることば」のほうが現代日本語として自然
    rationale: いずれもπιστόςの「信頼できる」の意味を伝えますが、「信頼できる」は日常的で明瞭です。
