  to: 教えにかなった信頼できることば[a]を固く守る人でなければなりません。そうすれば、健全な教えによって人々を励まし、反対する人々を戒める[b]ことができるようになります。
  rationale: 目的節の論理関係を日本語で明確にし、ἐλέγχεινの直接目的語と矯正的な力を本文に回復した。πιστός、παρακαλεῖν、ὑγιαινούσῃ διδασκαλίᾳの意味範囲は、現代日本語として自然な表現を用いながら保持している。
