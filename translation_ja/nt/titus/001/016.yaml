source:
  edition: SBLGNT
  text: θεὸν ὁμολογοῦσιν εἰδέναι, τοῖς δὲ ἔργοις ἀρνοῦνται, βδελυκτοὶ ὄντες καὶ ἀπειθεῖς καὶ πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/016.yaml
  text: They profess to know God[a], but by their works they deny him[d][c][b], being detestable and disobedient and unfit for every good work.
translation:
  language: ja
  text: 彼らは神を知っていると公言しますが、その行いによって神を否定しています。彼らは忌まわしく、不従順で、どんな良い働きにも不適格です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「どんな良い働きにも不適格とされる」とも訳せる。
    reason: ἀδόκιμοι は、吟味の結果として承認されないことから、「不適格な」「失格とされた」の意味を表し得るため。
lexical_decisions:
- source_word: θεὸν ὁμολογοῦσιν εἰδέναι
  choice: 神を知っていると公言します
  rationale: ὁμολογοῦσιν と不定詞 εἰδέναι の構文を自然な日本語で表し、口での表明と行いとの対照を保つ。「公言する」は、主張そのものの真偽を翻訳で決めつけず、公然と認め述べる意味を伝える。
- source_word: τοῖς δὲ ἔργοις
  choice: しかし、その行いによって
  rationale: 与格を手段・現れ方として捉え、彼らの行為が神を否定するものとなっていることを明確にする。「働き」よりも人の振る舞いを自然に指す「行い」を選んだ。
- source_word: ἀρνοῦνται
  choice: 神を否定しています
  rationale: 前半の目的語 θεόν を補って明示し、口での公言との強い対照を保つ。「拒んでいる」より原語に直接的な「否定する」とした。
- source_word: βδελυκτοὶ
  choice: 忌まわしく
  rationale: 道徳的・宗教的に嫌悪すべき状態を表す語の強さを、現代日本語として品位のある「忌まわしい」で保つ。
- source_word: ἀπειθεῖς
  choice: 不従順で
  rationale: 単に納得しないことではなく、従うことを拒む倫理的な含意を簡潔に表す。
- source_word: πρὸς πᾶν ἔργον ἀγαθὸν ἀδόκιμοι
  choice: どんな良い働きにも不適格です
  rationale: πᾶν は文脈上「どんな…にも」と自然に表し、ἀδόκιμοι は基準を満たさず役に立てない状態を示す「不適格」とした。ただし「試験に耐えない／退けられた」という含みもあるため脚注を付す。
theological_decisions:
- issue: 口で神を知ると公言することと、行いによって神を否定することの関係
  choice: 言葉では神を知ると公言しながら、実際の行いが神への否定となっているという対照をそのまま表す。
  alternative: 後半を、神ご自身ではなく神の真理一般を否定する意味に広く解する。
  rationale: 後半には目的語が明記されていないが、前半の θεόν が自然に引き継がれる。翻訳では神学的説明を加えず、原文の倫理的・神学的緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、断定の厳しさと三つの形容表現の並列を保持した。文を二つに分け、普通の読者にも読みやすくした。脚注標識 [a] は対応箇所である文末に置いた。
