id: TIT.1.11
reference: Titus 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὓς δεῖ ἐπιστομίζειν, οἵτινες ὅλους οἴκους ἀνατρέπουσιν διδάσκοντες ἃ μὴ δεῖ αἰσχροῦ κέρδους χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/001/011.yaml
  text: They must be silenced[c][b][a], since they are upsetting whole households by teaching what they ought not for the sake of shameful gain.
translation:
  language: ja
  text: このような者たちは、口を封じなければなりません[a]。彼らは、恥ずべき利得のために、教えてはならないことを教え、家族全体を混乱させているからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼らの口をふさがなければなりません」。ここでは、有害な教えを続けられないようにすること。
    reason: lexical_alternative
  - marker: b
    text: 「家族全体」は、建物としての家ではなく、家族や扶養される者などを含む家の共同体を指します。
    reason: cultural_note
lexical_decisions:
- source_word: οὓς δεῖ ἐπιστομίζειν
  choice: このような者たちは、口を封じなければなりません
  rationale: 前節の者たちを受ける関係代名詞を自然な日本語で明示した。「口を封じる」は、文字どおり「口をふさぐ」という比喩の力を保ちつつ、彼らの有害な教えを止める必要を表す。手段までは本文が規定していない。
- source_word: οἵτινες
  choice: 彼らは…からです
  rationale: ここでは、口を封じる必要がある理由を導く説明的な関係代名詞として理解し、日本語では理由節で表した。
- source_word: ὅλους οἴκους
  choice: 家族全体
  rationale: οἶκος は建物としての家ではなく、家族や同居する者を含む家の共同体を指し得る。この文脈では「家族全体」が明瞭で自然。
- source_word: ἀνατρέπουσιν
  choice: 混乱させている
  rationale: 「覆す、転覆させる、破滅させる」の幅を持つ語。家族共同体を深刻にかき乱す意味を、全面的破壊と断定せずに表した。
- source_word: διδάσκοντες ἃ μὴ δεῖ
  choice: 教えてはならないことを教え
  rationale: 分詞を手段として表し、不適切な教えの内容に対する義務・道徳上の否定を自然な日本語で示した。
- source_word: αἰσχροῦ κέρδους χάριν
  choice: 恥ずべき利益を得るために
  rationale: 利益そのものよりも、その利益や獲得動機が恥ずべきものであるという倫理的非難を明確に保った。
theological_decisions:
- issue: 偽教師の「口を封じる」命令の性質
  choice: 口を封じなければなりません
  alternative: 黙らせなければなりません
  rationale: ギリシア語の強い比喩を保つ一方、本文が述べていない身体的強制、行政処分、刑罰などの具体的方法は訳に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語。牧会書簡にふさわしい直接的で品位ある調子と、原文の比喩的な強さを両立させた。敬体を用い、過度に専門的・古風な表現は避けた。
