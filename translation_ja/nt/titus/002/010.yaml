  text: μὴ νοσφιζομένους, ἀλλὰ ⸂πᾶσαν πίστιν⸃ ἐνδεικνυμένους ἀγαθήν, ἵνα τὴν διδασκαλίαν ⸀τὴν τοῦ σωτῆρος ἡμῶν θεοῦ κοσμῶσιν ἐν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/010.yaml
  text: not pilfering[a], but showing all good faith, so that in everything they may adorn the teaching of God our Savior.
translation:
  language: ja
  text: '物を着服せず、かえって、どこまでも誠実であること[a]を示し、あらゆる点で、私たちの救い主である神の教えを美しく飾るようにしなさい。


    [a] 直訳すると「すべての良い信仰を示し」。ここで「信仰」は、忠実さ、または信頼に値する態度を意味すると考えられる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「すべての良い信仰を示し」。ここで「信仰」は、忠実さ、または信頼に値する態度を意味すると考えられる。
    reason: πίστις の字義的な「信仰」と、文脈上有力な倫理的意味である「忠実さ・信頼性」の両方を示すため。
lexical_decisions:
- source_word: νοσφιζομένους
  choice: 物を着服せず
  rationale: 自分のものではない物をひそかに取り分けることを表す。文脈上、単なる一般的な窃盗よりも、主人の財物を自分のために取り込む行為が念頭にあるため、「着服する」とした。
- source_word: πᾶσαν πίστιν ἐνδεικνυμένους ἀγαθήν
  choice: どこまでも誠実であることを示し
  rationale: この文脈の πίστις は、主人に対する忠実さや信頼性という倫理的意味を帯びる。πᾶσαν の包括性を「どこまでも」で表し、ἀγαθήν の肯定的な性質を自然な日本語の「誠実」に含めた。字義的な可能性は脚注に残した。
- source_word: κοσμῶσιν
  choice: 美しく飾る
  rationale: 教えを行いによって魅力あるものとして示すという「飾る」の比喩を保持しつつ、現代日本語で意図が伝わるよう「美しく」を補った。
- source_word: διδασκαλίαν
  choice: 教え
  rationale: 「教理」より広く自然で、διδασκαλία の内容と教授の両面を明瞭に表せる。
- source_word: τοῦ σωτῆρος ἡμῶν θεοῦ
  choice: 私たちの救い主である神の
  rationale: 属格句を自然な日本語にし、この節が明示する神への「救い主」という称号をそのまま保持した。
- source_word: ἐν πᾶσιν
  choice: あらゆる点で
  rationale: 生活と振る舞いの全領域に及ぶ広い範囲を自然に表す。
theological_decisions:
- issue: 倫理的文脈における πίστις の訳
  choice: 本文では「誠実」とし、忠実さ・信頼性の意味を表した
  alternative: 「信仰」、または「忠実さ」
  rationale: 奴隷が主人の物を着服しないという直前の対比から、ここでは信仰告白そのものより、信頼に値する忠実な振る舞いが中心である。ただし πίστις の語義上の緊張を失わないよう、字義的な「信仰」を脚注に示した。
- issue: 「私たちの救い主である神」の指示対象
  choice: 句を神への称号としてそのまま訳した
  alternative: 牧会書簡全体でキリストにも用いられる「救い主」との神学的関係を明示する
  rationale: この節自体は θεοῦ を「私たちの救い主」と呼んでいるため、その明示的な統語関係だけを訳し、ここにない説明を本文へ加えなかった。
- issue: κοσμῶσιν の比喩
  choice: 「教えを美しく飾る」として比喩を保持した
  alternative: 「教えの魅力を示す」「教えに誉れをもたらす」
  rationale: 行動が教えを装い、魅力あるものとして見せるという原文の比喩的緊張を保つため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「神の教えを美しく飾る」という原文の比喩は保持した。「しなさい」は前節から続く勧告の統語的関係を日本語で明示する。
