id: TIT.2.5
reference: Titus 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σώφρονας, ἁγνάς, ⸀οἰκουργούς, ἀγαθάς, ὑποτασσομένας τοῖς ἰδίοις ἀνδράσιν, ἵνα μὴ ὁ λόγος τοῦ θεοῦ βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/005.yaml
  text: self-controlled[a], pure, working at home, kind, being subject to their own husbands[c][b], so that the word of God may not be slandered.
translation:
  language: ja
  text: 若い女性たちが、自制心があり、清く、家庭で働き[a]、善良で、自分の夫に従う[b]ように教えなさい。そうすれば、神のことばが悪く言われない[c]ようになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家庭のことに忙しくし」、または「家庭を守り」とも訳せる。原文の語はまれで、家庭の仕事に携わることを表す。異本には「家を守り」に当たる語がある。
    reason: 語義上の別訳と本文異読
  - marker: b
    text: 「自分の夫に服する」とも訳せる。
    reason: 語義上の別訳
  - marker: c
    text: 「非難される」、または、より字義的には「冒瀆される」とも訳せる。
    reason: 語義上の別訳
lexical_decisions:
- source_word: σώφρονας
  choice: 自制心があり
  rationale: 思慮ある健全な判断が行動の節制として表れることを示す。現代日本語で徳目として明瞭な表現を選んだ。
- source_word: ἁγνάς
  choice: 清く
  rationale: 性的純潔に限定せず、道徳的な清さを広く表せる簡潔な訳語。
- source_word: οἰκουργούς
  choice: 家庭の仕事に励み
  rationale: 「家」と「働く」の要素を持つまれな語で、家庭内の務めに実際に携わることを表す。家から出ないという制限までは含意させない。
- source_word: ἀγαθάς
  choice: 善良で
  rationale: 広く倫理的な善を表す語の幅を保ち、「親切で」と対人的な意味だけに狭めない。
- source_word: ὑποτασσομένας
  choice: 従う
  rationale: 関係上の秩序に自ら身を置くことを自然な日本語で表す。特定の婚姻観を追加しない。
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: 自分の夫に
  rationale: 所有を示す語を明示し、従う対象が一般の男性ではなく各自の夫であることを保つ。
- source_word: ἵνα μὴ
  choice: ことのないためです
  rationale: 否定を伴う目的節としての力を、自然な日本語で明確に示す。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神のことば
  rationale: 神からの知らせ・教えを指す定着した簡潔な表現。
- source_word: βλασφημῆται
  choice: 悪く言われる
  rationale: この文脈では、神のことばが人々から非難・中傷されることを指す。現代の読者に意味が直接伝わる表現を本文に置いた。
theological_decisions:
- issue: οἰκουργούςが示す家庭での務めの範囲
  choice: 家庭の仕事に励み
  alternative: 家を守り／家にとどまり
  rationale: 家庭の仕事への従事は明示するが、外での活動を禁じる規定として過剰に解釈しないため。異読も脚注で示した。
- issue: ὑποτασσομέναςが示す婚姻関係上の秩序
  choice: 自分の夫に従う
  alternative: 自分の夫に服する
  rationale: 原文の関係的な従属を保持しつつ、制度的・教派的な体系を本文に持ち込まない。「自分の」により対象を各自の夫に限定する。
- issue: βλασφημῆταιの宗教的含意
  choice: 悪く言われる
  alternative: 冒瀆される
  rationale: 対象が「神のことば」であるため宗教的冒瀆の響きもあり得るが、ここでは生活態度を理由に神の知らせが非難されるという公的評価の文脈が強い。より字義的な選択肢は脚注に残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。節が前節の教えの内容を受ける構文であるため、「者となるようにしなさい」を補って独立した節として読める形にした。補足は文脈上明白な範囲に限り、徳目の並列と最後の目的節を保った。
