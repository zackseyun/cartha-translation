  text: προσδεχόμενοι τὴν μακαρίαν ἐλπίδα καὶ ἐπιφάνειαν τῆς δόξης τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν ⸂Ἰησοῦ Χριστοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/013.yaml
  text: as we await the blessed hope and the appearing of the glory of our great God and Savior[a], Jesus the Messiah,
translation:
  language: ja
  text: 祝福された望みと、私たちの偉大な神であり救い主であるイエス・メシア[a]の栄光の現れとを待ち望みながら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳（可能性は低い）「偉大な神と、私たちの救い主イエス・メシアの栄光の現れ」。この場合、「神」と「救い主」は同一人物を指す称号ではなく、それぞれ別の方を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: προσδεχόμενοι
  choice: 待ち望みながら
  rationale: 継続的で切実な期待を表す分詞の力を保ち、前後の文とのつながりも示す。
- source_word: τὴν μακαρίαν ἐλπίδα
  choice: 祝福された望み
  rationale: 終末における確かな待望を表す定着した表現であり、単なる願望を意味しない。
- source_word: καὶ
  choice: すなわち
  rationale: ここでは「望み」の内容を続く「現れ」が説明していると読むのが文脈上自然である。ただし、二つの目的語を並列する余地もあるため、過度な意訳にならない簡潔な同格表現とした。
- source_word: ἐπιφάνειαν
  choice: 現れ
  rationale: 目に見える顕現という終末論的意味を、専門用語を避けて明瞭に表す。
- source_word: δόξης
  choice: 栄光
  rationale: 属格を「栄光の現れ」として保ち、栄光が明らかに現れるという原文の構造を反映する。
- source_word: τοῦ μεγάλου θεοῦ καὶ σωτῆρος ἡμῶν
  choice: 私たちの偉大な神であり救い主である
  rationale: 一つの冠詞のもとに置かれた二つの単数の人物名詞を、同一人物への二重の称号として自然な日本語で表す。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςを称号として「メシア」と訳し、固有名のように不透明な音写だけで処理しない。
theological_decisions:
- issue: 「私たちの偉大な神であり救い主」がイエス・メシア一人を指すのか、父なる神とイエスの二者を指すのか
  choice: イエス・メシア一人を「私たちの偉大な神であり救い主」と呼ぶ。
  alternative: 「偉大な神」と「私たちの救い主イエス・メシア」を別々の指示対象とする。
  rationale: 単一の冠詞が二つの単数の人物名詞を支配し、その後に「イエス・メシア」が続くギリシア語の構文は、一人の指示対象と解するのが最も自然である。一方、二者を指す解釈の可能性は脚注に残した。
- issue: 「祝福された望み」と「栄光の現れ」の関係
  choice: 「すなわち」により、栄光の現れを望みの内容として示す。
  alternative: 「祝福された望みと、栄光の現れとを」と並列する。
  rationale: 一つの待望の対象を説明的に言い換えていると読むと文脈が自然で、日本語でも意味が明瞭になる。ただし原文の καί には単純な並列の可能性もある。
translation_notes:
  register: 現代の一般読者に明瞭でありながら礼拝・朗読にも耐える格調を保った。「顕現」のような専門語は避け、「現れ」とした。節が前文から続く分詞句であるため、末尾は「待ち望みながら、」とした。
