  text: ἵνα ⸀σωφρονίζωσι τὰς νέας φιλάνδρους εἶναι, φιλοτέκνους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/004.yaml
  text: so that they may train the younger women to be loving toward their husbands and loving toward their children[c][b][a],
translation:
  language: ja
  text: それは、若い女性たち[b]が夫を愛し、子どもを愛する者となるように教え導く[a]ためです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諭す」または「思慮深く自制ある行いをするよう教える」。この動詞には、健全な判断と振る舞いへ導くために助言し、訓練する意味があります。
    reason: lexical_alternative
  - marker: b
    text: 別訳「若い女たち」。ギリシア語では「より若い女性たち」で、文脈上、年長の女性たちと対比される人々を指します。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「夫を愛する者、子どもを愛する者となるように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: それは〜ためです
  rationale: 目的を導く接続詞の働きを、前の文脈を受ける自然な日本語で表した。結果の含みもあり得るが、ここでは目的が中心である。
- source_word: σωφρονίζωσι
  choice: 教え導き
  rationale: 単なる知識の伝達ではなく、健全で思慮ある振る舞いへと諭し、訓練する意味を含むため。「訓練する」より対人的で自然な表現を選んだ。
- source_word: τὰς νέας
  choice: 若い女性たち
  rationale: 定冠詞付き女性複数形の形容詞が、直前の年長の女性たちとの対比で若い女性たちを指す。「若い妻たち」と限定する語は原文にないため、指示対象を狭めなかった。
- source_word: φιλάνδρους
  choice: 夫を愛する
  rationale: 夫への愛情を特徴とする形容詞。日本語では動詞表現が自然であり、後続語との並行性も保てる。
- source_word: εἶναι
  choice: 〜ようにする
  rationale: 二つの形容詞を補い、若い女性たちがそのような者となることを表す不定詞の機能を自然な日本語にした。
- source_word: φιλοτέκνους
  choice: 子どもを愛する
  rationale: 自分の子どもへの愛情を特徴とする形容詞。φιλάνδρουςと並行する簡潔な表現とした。
theological_decisions:
- issue: 家庭訓における「若い女性たち」の範囲
  choice: 原文どおり「若い女性たち」とし、この節が具体的に夫と子どものいる生活状況を念頭に置くことは後続表現によって示す。
  alternative: 「若い妻たち」と訳して対象を既婚女性に明示的に限定する。
  rationale: τὰς νέαςは女性を指すが、「妻」という名詞を明示してはいない。したがって本文以上に対象を限定せず、同時に夫と子どもへの愛を教えるという具体的状況もそのまま保持した。
- issue: φιλάνδρουςとφιλοτέκνουςの形容詞的性格
  choice: 自然な日本語として「夫と子どもを愛する」と訳す。
  alternative: 「夫を愛する者、子どもを愛する者となる」と形容詞的性格を明示する。
  rationale: 二語は性質・姿勢を表す形容詞だが、日本語では「愛するようにする」が同じ趣旨を明瞭かつ簡潔に伝える。脚注でより直訳的な形を示した。
translation_notes:
  register: 明快で現代的な標準語を用いながら、聖書本文として落ち着きのある文体にした。前節から続く目的節であることを「それは〜ためです」で示し、単独でも意味を取りやすくした。
