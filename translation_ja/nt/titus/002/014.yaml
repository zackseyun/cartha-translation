  text: ὃς ἔδωκεν ἑαυτὸν ὑπὲρ ἡμῶν ἵνα λυτρώσηται ἡμᾶς ἀπὸ πάσης ἀνομίας καὶ καθαρίσῃ ἑαυτῷ λαὸν περιούσιον, ζηλωτὴν καλῶν ἔργων.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/014.yaml
  text: who gave himself for us[a], so that he might redeem us from all lawlessness and purify for himself a people for his own possession, zealous for good works.
translation:
  language: ja
  text: この方は、私たちのためにご自分をお与えになりました。それは、私たちをあらゆる不法から贖い出し、ご自分のものとなる、良い行いに熱心な民を清めるためでした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ご自分のものとなる民」は、「宝の民」または「特別な民」とも訳せる。ギリシア語は、ご自分に特別に属する契約の民という意味合いを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν ἑαυτὸν
  choice: ご自分を献げられました
  rationale: 自発的な自己の差し出しを表す句。単なる「与えた」より日本語として自然で、この文脈の厳粛さも保つ。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのために
  rationale: 受益と代理の含みを保ちつつ、特定の贖罪理解に限定しない。
- source_word: ἵνα λυτρώσηται
  choice: 贖い出し
  rationale: 代価による解放ないし救出という λυτρόομαι の響きを保ち、聖書的な贖いの語義も伝える。
- source_word: ἀπὸ πάσης ἀνομίας
  choice: あらゆる不法から
  rationale: ἀνομία の「法に背くこと」という具体性と、πάσης の包括性を保つ。
- source_word: καθαρίσῃ
  choice: 清める
  rationale: 道徳的・契約的な清めの両面に対応し、現代日本語でも理解しやすい。
- source_word: ἑαυτῷ
  choice: ご自分のものとして
  rationale: 与格が示す帰属・利益を、後続する民との関係が明確になるよう表現する。
- source_word: λαὸν περιούσιον
  choice: ご自分のものとして……民
  rationale: περιούσιος が持つ、神に特別に属する契約の民という旧約的な響きを、「特別な民」などに弱めず表す。
- source_word: ζηλωτὴν καλῶν ἔργων
  choice: 良い行いに熱心な民
  rationale: ζηλωτής の積極的な熱意を自然な日本語で示し、καλῶν ἔργων の倫理的重点を保つ。
theological_decisions:
- issue: ὑπὲρ ἡμῶν が示すキリストの自己献身の意味
  choice: 「私たちのために」と広く訳す
  alternative: 「私たちに代わって」
  rationale: 受益的意味と代理的含意の双方を許し、この節だけで特定の贖罪論に狭く限定しない。
- issue: λαὸν περιούσιον の契約的含意
  choice: 「ご自分のものとして……民」と訳す
  alternative: 「宝の民」または「特別な民」
  rationale: 神に特別に属する民という七十人訳聖書以来の契約的な響きを明示しつつ、価値判断だけを前面に出さない。
- issue: 二つの目的を示す ἵνα と接続法の表現
  choice: 「それは……ためでした」と目的として訳す
  alternative: 「……するためです」
  rationale: 自己献身の目的として贖いと清めを並列的に示す原文の構造を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、キリストの自己献身と契約の民を語る箇所にふさわしい格調を保った。敬語の「ご自分」「献げられました」は主語であるキリストへの敬意を自然に示す。脚注記号は、その説明対象である「ご自分のものとして、良い行いに熱心な民」の句を含む文末に置いた。
