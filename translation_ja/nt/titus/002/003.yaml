  text: Πρεσβύτιδας ὡσαύτως ἐν καταστήματι ἱεροπρεπεῖς, μὴ διαβόλους ⸀μηδὲ οἴνῳ πολλῷ δεδουλωμένας, καλοδιδασκάλους,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/003.yaml
  text: Older women likewise are to be reverent in behavior[a], not slanderers nor enslaved to much wine, teachers of what is good[b],
translation:
  language: ja
  text: 年配の女性たちについても同じように、振る舞いが聖なるものにふさわしく、人を中傷せず[a]、多量のぶどう酒の奴隷にされておらず[b]、良いことを教える者であるように語りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「偽って訴えず」「悪意あるうわさをせず」。ここで用いられるギリシア語は、しばしば「悪魔」と訳される語と同じですが、この文脈では人をそしる者を指します。
    reason: lexical_alternative
  - marker: b
    text: または「多量のぶどう酒に依存せず」。ギリシア語は、より直訳的には「多量のぶどう酒の奴隷にされておらず」という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβύτιδας
  choice: 年配の女性たち
  rationale: 直前の「年配の男性たち」と対応する、年齢を示す女性複数形。現代日本語として自然で、古風な「老女たち」より敬意のある表現とした。
- source_word: ὡσαύτως
  choice: 同じように
  rationale: 直前の勧告との対応関係を明確に示す、自然な談話接続表現。
- source_word: ἐν καταστήματι ἱεροπρεπεῖς
  choice: 振る舞いが聖なるものにふさわしく
  rationale: κατάστημα が外に表れる態度や身のこなしを指し、ἱεροπρεπής が聖なる事柄にふさわしいことを表すため。「敬虔に」だけでは失われやすい聖性との関連を保った。
- source_word: μὴ διαβόλους
  choice: 人を中傷せず
  rationale: ここで διάβολος は悪魔を指す固有的用法ではなく、人をそしり偽って訴える者を意味する。倫理的勧告として自然な動詞表現にした。
- source_word: μηδὲ οἴνῳ πολλῷ δεδουλωμένας
  choice: 多量のぶどう酒の奴隷にならず
  rationale: δουλόω の完了受動分詞が示す支配・隷属の比喩を保持した。「酒に溺れず」や「依存せず」より原文の像に近い。οἶνος は文脈上ぶどう酒を指す。
- source_word: καλοδιδασκάλους
  choice: 良いことを教える者
  rationale: 複合語が表すのは教師としての技能の高さではなく、良い事柄を教えることなので、内容を明示した。
theological_decisions:
- issue: ぶどう酒との関係を表す δουλόω の隷属比喩
  choice: 「多量のぶどう酒の奴隷にならず」として比喩を保持する
  alternative: 「多量のぶどう酒に依存せず」または「酒に溺れず」
  rationale: 原文は単に習慣や依存状態を述べるだけでなく、ぶどう酒に支配されている状態を奴隷化の語で描く。日本語でも理解可能なため、その神学的・倫理的緊張を弱めない。
- issue: 節に明示されていない命令表現の補足
  choice: 文脈上の勧告を「ようにしなさい」で表す
  alternative: 述語を並べたまま「……者であるように」と終える
  rationale: ギリシア語では前節から続く統語構造の中で年配の女性への指示となっている。単独節として自然で理解可能な日本語にするため命令性を補ったが、教える主体など原文がここで明示しない情報は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、倫理的勧告にふさわしい端正な調子を保った。「聖なるものにふさわしく」と「奴隷にならず」は、多少硬質でも原文の宗教的含意と比喩を保持するため採用した。脚注記号は、それぞれ実際に説明する「中傷」と「ぶどう酒への隷属」の直後に配置した。
