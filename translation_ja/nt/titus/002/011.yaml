id: TIT.2.11
reference: Titus 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐπεφάνη γὰρ ἡ χάρις τοῦ ⸀θεοῦ σωτήριος πᾶσιν ἀνθρώποις
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/011.yaml
  text: For the grace of God has appeared[b][a], bringing salvation to all people.
translation:
  language: ja
  text: というのも、すべての人に救いをもたらす神の恵みが現れたからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の恵みが現れ、すべての人を救うものとなりました」または「救いをもたらす神の恵みが、すべての人に現れました」。ギリシア語では「救いをもたらす」に当たる形容詞と「すべての人に」に当たる句との関係を、幾通りかに取ることができます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπεφάνη
  choice: 現れた
  rationale: アオリスト受動形がここでは自動詞的に「現れた、明らかになった」の意で用いられている。神の恵みが歴史の中に顕現したという含みを、簡潔で自然な日本語で表す。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 直前の勧めの根拠を示す接続語であるため、説明・理由を自然に導く形とした。
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: 神の恵み
  rationale: 属格を素直に「神の」とし、χάρις はパウロ書簡で確立した訳語「恵み」によって、神の好意と救いをもたらす働きの双方を保つ。
- source_word: σωτήριος
  choice: 救いをもたらす
  rationale: 「救いとなる、救いをもたらす」という形容詞の働きを自然な連体修飾で表した。単に「救う」として作用のあり方を狭めることを避けた。
- source_word: πᾶσιν ἀνθρώποις
  choice: すべての人に
  rationale: ἄνθρωποι は男性だけでなく人間一般を指す。「すべての人」はギリシア語の広い範囲を保ち、「あらゆる種類の人」などと限定しない。与格は本文では σωτήριος と結びつく対象として「に」とした。
theological_decisions:
- issue: πᾶσιν ἀνθρώποις と σωτήριος の統語関係および救いの範囲
  choice: 「すべての人に救いをもたらす」とし、神の恵みが全人類に向けられているという文言の広がりを保った。
  alternative: 「すべての人を救う」または「神の恵みがすべての人に現れた」
  rationale: ギリシア語では σωτήριος と与格句の結びつきに複数の捉え方があり得る。「すべての人を救う」では結果を断定する響きが強く、「すべての人に現れた」では σωτήριος の修飾関係が後景化する。本文訳は救いをもたらす恵みの普遍的な向きを示しつつ、個々人の最終的救いについて特定の教理的結論を加えない。
translation_notes:
  register: 明快な現代標準語を用い、「というのも……からです」で文脈上の理由説明を明示した。文体は平易だが礼拝・朗読にも耐える品位を保ち、「恩寵」「救済的」など日常性の低い語は避けた。
