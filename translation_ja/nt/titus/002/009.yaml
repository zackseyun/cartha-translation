id: TIT.2.9
reference: Titus 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Δούλους ἰδίοις δεσπόταις ὑποτάσσεσθαι ἐν πᾶσιν, εὐαρέστους εἶναι, μὴ ἀντιλέγοντας,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/009.yaml
  text: Servants are to submit to their own masters in everything[a], to be pleasing, not argumentative[b],
translation:
  language: ja
  text: 奴隷[a]には、自分の主人にあらゆる点で従い、主人に喜ばれる者となり、口答えせず[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」と訳したギリシャ語は、文脈によって「しもべ」とも訳せる。ここでは主人の権威の下にある拘束された身分が念頭にあると考えられる。
    reason: alternative_reading
  - marker: b
    text: 別訳「反論せず」「言い返さず」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δούλους
  choice: 奴隷
  rationale: この文脈では、δεσπόταις（主人）の所有と権威の下に置かれた人々を指すため、「しもべ」ではなく、当時の拘束された社会的身分を明確に示す「奴隷」とした。
- source_word: ἰδίοις δεσπόταις
  choice: 自分の主人
  rationale: ἰδίοις の個別的な所有関係を「自分の」で示し、δεσπόταις はこの家内規定の文脈に自然な「主人」とした。
- source_word: ὑποτάσσεσθαι
  choice: 従い
  rationale: 権威の下に身を置くことを表す不定詞であり、現代日本語として自然に勧告の内容を示す「従い」とした。
- source_word: ἐν πᾶσιν
  choice: あらゆる点で
  rationale: 包括的な範囲を表すが、日本語の「すべてにおいて」よりも、服従の諸側面を自然に示す表現とした。
- source_word: εὐαρέστους εἶναι
  choice: 主人に喜ばれる者となり
  rationale: εὐαρέστους は「喜ばれる、満足を与える」の意。文脈上の相手である主人を補って、意味を明瞭にした。
- source_word: μὴ ἀντιλέγοντας
  choice: 口答えせず
  rationale: ἀντιλέγω は反対して言う、言い返す、反論することを表す。この主人と奴隷の関係では、簡潔で自然な「口答えせず」が適切である。
theological_decisions:
- issue: 家内規定における δοῦλος の訳語
  choice: 奴隷
  alternative: しもべ／奉公人
  rationale: δεσπότης の権威下にある拘束された身分が前景化しているため、制度の現実を弱めない「奴隷」を採用した。これは制度を是認するためではなく、本文が語りかける対象を歴史的に正確に示すためである。
- issue: 「あらゆる点で」の範囲
  choice: 本文どおり包括的な表現を保つ
  alternative: 道徳的に正しい事柄に限って従う、と本文中で限定する
  rationale: ἐν πᾶσιν は文法上包括的であり、この節自体には明示的な限定がないため、翻訳で限定を加えなかった。
- issue: εὐαρέστους の相手
  choice: 主人に喜ばれる
  alternative: 神に喜ばれる
  rationale: 直近の文脈では「自分の主人」が服従と振る舞いの対象なので、主人を補った。ただしギリシャ語本文には目的語が明記されていない。
translation_notes:
  register: 明瞭で現代的かつ品位ある日本語とした。原文は前後の勧告に従属する不定詞・分詞の連続なので、節末の読点を保ち、次節へ続く構文として訳した。
