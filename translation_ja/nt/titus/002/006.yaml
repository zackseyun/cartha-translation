lexical_decisions:
- source_word: Τοὺς νεωτέρους
  choice: 若い男性たちには
  rationale: 定冠詞を伴う男性複数形であり、直前から続く年齢・性別ごとの勧告の流れでは、一般の若者ではなく若い男性を指す。日本語では対象を明確かつ自然に示すため「若い男性たちには」とした。
- source_word: ὡσαύτως
  choice: 同じように
  rationale: 先行する各集団への勧告との並行関係を示す語であり、現代日本語で自然にそのつながりを表す。
- source_word: παρακάλει
  choice: 勧めなさい
  rationale: テトスに対する現在命令形。継続的に促し教える意味を持つが、日本語では文脈上自然で、命令の力も保つ「勧めなさい」とした。
- source_word: σωφρονεῖν
  choice: 自制する
  rationale: 健全な判断、慎み、自己抑制を含む語。ここでは簡潔で分かりやすく、行動を律する面を明確に伝える「自制する」を本文に採用し、意味の広がりは脚注に示した。
theological_decisions:
- issue: νεωτέρουςの性別上の指示範囲
  choice: 若い男性たちを明示する
  alternative: 若者たち一般とする
  rationale: 直近の文脈は年齢と性別によって各集団を順に扱っており、原文も男性複数形を用いるため、その限定を中性化せず保持した。
- issue: σωφρονεῖνの意味範囲
  choice: 本文では「自制する」とし、判断力を含む意味の幅を脚注で保持する
  alternative: 「分別をわきまえる」「思慮深くある」とする
  rationale: この語は単なる抑圧ではなく、健全な判断に基づいて自分を律することを表す。日本語本文の明瞭さを優先しつつ、脚注で語義の重なりを示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔な命令文として原文の勧告の力を保った。「若い男性たち」で対象を正確に示し、σωφρονεῖνの意味の広がりは本文を過度に説明的にせず脚注で補った。
