  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα λάλει καὶ παρακάλει καὶ ἔλεγχε μετὰ πάσης ἐπιταγῆς· μηδείς σου περιφρονείτω.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/015.yaml
  text: Speak these things[a], and exhort and rebuke with all authority. Let no one disregard you.
translation:
  language: ja
  text: これらのことを、十分な権威をもって語り、勧め、戒めなさい。だれにも、あなたを軽んじさせてはなりません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「だれにも、あなたを見下させてはなりません」、または「だれにも、あなたを軽視させてはなりません」とも訳せる。
    reason: περιφρονέωには「軽んじる」「見下す」「軽視する」という意味の幅があるため。
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 直前までの教えや指示を広く指す中性複数の指示代名詞であり、内容を「教え」などに限定せず、その包括的な指示対象を保つ。
- source_word: λάλει
  choice: 語り
  rationale: 継続的に言葉で伝えることを命じる現在命令形。「教え」と限定せず、直接的で自然な表現とした。
- source_word: παρακάλει
  choice: 勧め
  rationale: 励まし、促し、勧告する意味範囲を持つ。ここでは道徳的・牧会的な働きかけを簡潔に表す「勧め」が文脈に適する。
- source_word: ἔλεγχε
  choice: 戒め
  rationale: 誤りを明らかにして正す働きを表す。現代日本語で理解しやすく、叱責と矯正の両面を含み得る「戒め」を選んだ。
- source_word: μετὰ πάσης ἐπιταγῆς
  choice: 十分な権威をもって
  rationale: ἐπιταγήの「命令・権威」という意味と、πάσηςの十全な強調を自然な日本語で表す。単なる命令口調ではなく、委ねられた権威の重みを伴うことを示す。
- source_word: μηδείς
  choice: だれにも……させてはなりません
  rationale: 第三人称命令形を伴う禁止を、明確で自然な現代日本語の禁止表現にした。
- source_word: σου
  choice: あなたを
  rationale: περιφρονείτωが向けられる相手を、日本語で自然な目的語として明示した。
- source_word: περιφρονείτω
  choice: 軽んじさせてはなりません
  rationale: 「軽く見る、見下す、軽視する」という語義を保つ。「軽んじる」は人格と務めの双方を軽視する含みを持ち、この文脈に適する。別訳は脚注に示す。
theological_decisions:
- issue: μετὰ πάσης ἐπιταγῆςに表れるテトスの務めの権威
  choice: 語り、勧め、戒める働きを、十分な権威をもって行うよう命じている。
  alternative: 単に命令的な口調で語ること、または使信そのものの権威だけを指すと解することも考えられる。
  rationale: この句は一連の命令を修飾し、その務めを遂行する際の権威の重みを示す。ただし、その権威をテトス自身に由来する自律的な力とはせず、文脈上委ねられた務めの権威として読める表現にとどめた。
- issue: περιφρονείτωの禁止の対象
  choice: だれにもテトスを軽んじさせてはならない。
  alternative: だれにもテトスを見下させてはならない、または無視させてはならない。
  rationale: 語は人格的な侮蔑と、その言葉や務めを軽視することの双方を含み得るため、「軽んじる」でその幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを保つため丁寧体とした。「十分な権威をもって」は原文の強調を自然に伝えつつ、権威の由来について本文以上の教理的限定を加えない。脚注記号[a]は対応語句の直後に置いた。
