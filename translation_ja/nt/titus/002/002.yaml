id: TIT.2.2
reference: Titus 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρεσβύτας νηφαλίους εἶναι, σεμνούς, σώφρονας, ὑγιαίνοντας τῇ πίστει, τῇ ἀγάπῃ, τῇ ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/002.yaml
  text: Older men are to be temperate[a], dignified, self-controlled, sound in faith, in love, and in steadfastness.
translation:
  language: ja
  text: 年配の男性たちは、節度があり、品位があり、自制心があり、信仰[a]と愛と忍耐において健全でなければなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「忠実さ」とも訳せます。ギリシア語の「ピスティス」は、文脈により「信仰」または「忠実さ」を意味します。
    reason: alternative_reading
lexical_decisions:
- source_word: πρεσβύτας
  choice: 年配の男性たち
  rationale: 教会の役職としての「長老」ではなく、家庭訓における年長の男性を指すため。現代日本語で明確かつ自然な表現とした。
- source_word: νηφαλίους
  choice: 節度があり
  rationale: 酒に酔わないことだけでなく、冷静さと自己抑制を含む広い倫理的意味を表す。
- source_word: σεμνούς
  choice: 品位を保ち
  rationale: 尊敬に値する重々しさ、気高さを自然な現代日本語で表す。「まじめ」だけに狭めない。
- source_word: σώφρονας
  choice: 自制し
  rationale: 健全な判断力に基づいて自分を律するという倫理的意味を簡潔に表す。
- source_word: ὑγιαίνοντας
  choice: 健全で
  rationale: 本来の「健康である」という比喩を保ちつつ、信仰・愛・忍耐が確かで揺るがない状態を示す。
- source_word: τῇ πίστει
  choice: 信仰において
  rationale: πίστις の基本的な訳として「信仰」を採用するが、この文脈では「忠実さ」も可能なので脚注に残す。
- source_word: τῇ ἀγάπῃ
  choice: 愛において
  rationale: ἀγάπη の通常の意味をそのまま明瞭に表す。三つの与格を「において」でまとめ、並列関係を保つ。
- source_word: τῇ ὑπομονῇ
  choice: 忍耐において
  rationale: 困難の下で耐え続ける堅固さを、一般読者に分かりやすい「忍耐」で表す。
- source_word: εἶναι
  choice: でなければなりません
  rationale: 前節から続く勧告の力を補い、文として自然な丁寧体にした。
theological_decisions:
- issue: 徳目の列挙における πίστις の意味
  choice: 信仰
  alternative: 忠実さ
  rationale: 「信仰」と「忠実さ」のどちらも文脈上可能である。本文では基本訳の「信仰」を採り、真正な語義上の曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。徳目の簡潔な列挙を維持しつつ、丁寧体で前後の教えに接続できる形とした。
