lexical_decisions:
- source_word: Σὺ δὲ
  choice: しかし、あなたは
  rationale: 明示された代名詞Σὺと接続詞δὲが、直前に述べられた者たちとの対照を示すため、日本語では主題を表す「あなたは」と「しかし」を組み合わせてその強調を保った。
- source_word: λάλει
  choice: 語りなさい
  rationale: 継続的・一般的に語るよう求める命令であり、正式な教授だけに意味を狭めない「語る」を用いた。
- source_word: ἃ πρέπει
  choice: ふさわしいこと
  rationale: πρέπειが表す適合性・妥当性を自然な現代日本語で示し、関係代名詞ἃの複数的な内容を包括的な「こと」で表した。
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: 健全な教え
  rationale: ὑγιαινούσῃの健康・健全さの比喩を保ちつつ、διδασκαλίαが指し得る教える行為と教えの内容の双方を、不必要に専門用語化せず表した。
theological_decisions:
- issue: τῇ ὑγιαινούσῃ διδασκαλίᾳの訳し方
  choice: 健全な教え
  alternative: 健全な教理
  rationale: 「教え」はδιδασκαλίαの行為・内容の幅を保ち、一般読者にも明瞭である。「教理」も可能だが、内容面に限定して専門的に響きやすいため本文では採らず、脚注に示した。
translation_notes:
