source:
  edition: SBLGNT
  text: λόγον ὑγιῆ ἀκατάγνωστον, ἵνα ὁ ἐξ ἐναντίας ἐντραπῇ μηδὲν ἔχων ⸂λέγειν περὶ ἡμῶν⸃ φαῦλον.
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/008.yaml
  text: sound speech that cannot be condemned[a], so that the one who opposes us may be put to shame[c][b], having nothing evil to say about us.
translation:
  language: ja
  text: 反対する者が、私たちについて悪いことを何一つ言えずに恥じ入るように、健全で、非難の余地のない[b]言葉[a]を語りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「言葉」は、「語り方」または「語る内容」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: または「非難されることのない」「とがめられるところのない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: 言葉
  rationale: 単なる一語ではなく、教える際の発言の内容とあり方を指す。日本語では「言葉」が文脈に自然であり、「教え」だけに意味を限定しない。前節から続く対格の列挙を、独立した節として理解できるよう「用いなさい」で補った。
- source_word: ὑγιῆ
  choice: 健全な
  rationale: 本来の「健康な」という比喩を保ちつつ、教えや発言が正しく有益であることを表す牧会書簡の用法に合う。
- source_word: ἀκατάγνωστον
  choice: 非難の余地がない
  rationale: 正当な批判や断罪を受ける理由がないという意味を、現代日本語で自然かつ明確に表す。
- source_word: ἵνα
  choice: それは、…ためです
  rationale: 目的を明示する接続表現とし、前半の勧めとの論理的関係を保った。
- source_word: ὁ ἐξ ἐναντίας
  choice: 反対する者
  rationale: 直訳的には「反対側にいる者」であり、ここでは敵対者・反対者を意味する。本文では簡潔で自然な表現を選んだ。
- source_word: ἐντραπῇ
  choice: 恥じ入る
  rationale: 単なる当惑ではなく、非難の根拠を失って恥を覚えるという社会的・道徳的な含みを表す。
- source_word: μηδὲν ἔχων λέγειν
  choice: 何一つ…言えず
  rationale: 悪いことを言う材料や根拠を何も持たないという分詞構文を、自然な日本語にした。
- source_word: περὶ ἡμῶν
  choice: 私たちについて
  rationale: 一人称複数をそのまま保ち、パウロとテトス、あるいは信仰共同体全体のいずれかに指示対象を狭めない。
- source_word: φαῦλον
  choice: 悪く
  rationale: 道徳的に悪い、卑しい、非難すべき内容を表す。日本語では「悪く言う」が自然で、誹謗や告発の文脈にも合う。
theological_decisions:
- issue: περὶ ἡμῶν の一人称複数が指す範囲
  choice: 「私たちについて」とそのまま訳す
  alternative: 「あなたについて」「私たちキリスト者について」「私たちの教えについて」
  rationale: ギリシア語本文は一人称複数であり、その範囲をテトス個人、宣教者たち、または教会全体のいずれかに限定していないため、曖昧さを保持した。
- issue: ἐντραπῇ の態と恥の所在
  choice: 「恥じ入る」と訳す
  alternative: 「恥をかかされる」「辱められる」
  rationale: 形態上は受動形だが、この動詞は「恥じる」の意味でも用いられる。外から辱める行為を強調しすぎず、反対者が非難の根拠を失って恥を覚えるという文脈を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令には節度ある「用いなさい」を採用した。「健全な言葉」「恥じ入る」により、牧会書簡にふさわしい品位と道徳的重みを保った。節頭は前節から続く対格句だが、単独でも読めるよう、前節の勧告から動詞を最小限補った。
