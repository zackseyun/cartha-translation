id: TIT.2.12
reference: Titus 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παιδεύουσα ἡμᾶς, ἵνα ἀρνησάμενοι τὴν ἀσέβειαν καὶ τὰς κοσμικὰς ἐπιθυμίας σωφρόνως καὶ δικαίως καὶ εὐσεβῶς ζήσωμεν ἐν τῷ νῦν αἰῶνι,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/012.yaml
  text: training us[a], so that, having renounced ungodliness and worldly desires, we might live self-controlled, righteous, and godly lives in the present age[c][b],
translation:
  language: ja
  text: その恵みは、私たちが神を敬わないこととこの世の欲望[b]を退け、今の時代にあって、慎み深く、正しく、敬虔に[c]生きるようにと、私たちを訓練しています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「教え導く」、または「鍛える」とも訳せる。原語には、人格と行動を形づくる教育や訓練の意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「この世の情欲」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 原文では「慎み深く、正しく、敬虔に」に当たる三つの副詞が「生きる」を修飾している。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύουσα
  choice: 訓練し
  rationale: 単なる知識の伝達ではなく、人格と行動を形づくる教育的な働きを表すため。「懲らしめる」ほど狭く厳しい意味に限定せず、形成と指導の含意を保つ。
- source_word: ἵνα
  choice: 生きるようにします
  rationale: 恵みの訓練が目指す目的・結果を、自然な現代日本語で示す。
- source_word: ἀρνησάμενοι
  choice: 退けて
  rationale: 不敬虔と欲望をきっぱり拒絶する意味を表しつつ、主動詞「生きる」に先立つ分詞の関係を自然に伝える。
- source_word: τὴν ἀσέβειαν
  choice: 神を敬わない生き方
  rationale: 神への畏敬を欠く態度と生活を指す語を、一般読者に明瞭な表現で示す。「不敬虔」より分かりやすく、宗教的・倫理的側面を保つ。
- source_word: τὰς κοσμικὰς ἐπιθυμίας
  choice: この世の欲望
  rationale: 現在の世の秩序に属し、それに形づくられた欲望という意味を、簡潔で自然な日本語にする。
- source_word: σωφρόνως
  choice: 慎み深く
  rationale: 節度、自制、健全な判断に基づく生き方を表す。テトス書で反復される倫理的主題とのつながりも保つ。
- source_word: δικαίως
  choice: 正しく
  rationale: 何が正しいかにかなった行動を意味する副詞として、自然かつ広い道徳的含意を保つ。
- source_word: εὐσεβῶς
  choice: 敬虔に
  rationale: 神を畏れ敬い、神に向けられた生活という垂直的側面を簡潔に表す。
- source_word: ζήσωμεν
  choice: 生きるようにします
  rationale: ἵναに従う接続法の目的的な力を、命令や確実な予告に変えずに表す。
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: 今の時代にあって
  rationale: 来たるべき時代と対照される現在の時代・世界秩序という終末論的な含みを保つ。
theological_decisions:
- issue: σωφρόνως καὶ δικαίως καὶ εὐσεβῶς の三つの副詞
  choice: 「慎み深く、正しく、敬虔に」と三つの副詞で訳す
  alternative: 「自制と正しさと敬虔さをもって生きる」
  rationale: 原文では三つの副詞が「生きる」を修飾している。日本語でも副詞の列挙が自然であり、自己との関係、他者との関係、神との関係という含意を訳文で断定的に説明せず、三項の緊張と並列をそのまま保てる。
- issue: παιδεύουσα の主語
  choice: 前節の「恵み」を受けて「その恵みは」を明示する
  alternative: 主語を省略して「私たちを訓練し」と前節に直接続ける
  rationale: 原文の女性単数分詞は前節の「神の恵み」を受ける。節単位でも意味が明瞭になるよう主語を補うが、新たな解釈上の主体は導入していない。
- issue: ἀρνησάμενοι の時間的・論理的関係
  choice: 「退けて……生きる」と訳す
  alternative: 「退けた上で……生きる」
  rationale: アオリスト分詞が主動詞に先立つ、またはそれと密接に伴う決然とした拒絶を表すことを保ちつつ、厳密な時間順序を必要以上に強調しない。
translation_notes:
  register: 明瞭で現代的ながら礼節ある標準語。前節から続く「恵み」を明示して節単位の可読性を確保した。「神を敬わない生き方」は抽象名詞「不敬虔」を平易に展開し、三つの倫理的副詞は原文の並列を保っている。
