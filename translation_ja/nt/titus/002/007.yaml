  text: περὶ πάντα σεαυτὸν παρεχόμενος τύπον καλῶν ἔργων, ἐν τῇ διδασκαλίᾳ ⸀ἀφθορίαν, ⸀σεμνότητα,
base_translation:
  language: en
  yaml_path: translation/nt/titus/002/007.yaml
  text: in every way presenting yourself as an example of good works[a]; in your teaching, purity, dignity[e][d][c][b],
translation:
  language: ja
  text: あらゆる点で、あなた自身が良い行いの模範[a]を示しなさい[b]。教えにおいては[c]、純粋さ[d]と品位を示しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「良い行いの型」または「良い行いの手本」。
    reason: lexical_alternative
  - marker: b
    text: 「あらゆることにおいて、あなた自身が……を示しなさい」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳「その教えにおいて」。「教える際に」または「教えの内容において」と取ることもできる。
    reason: ambiguity
  - marker: d
    text: または「腐敗のなさ」「誠実さ」。教えの純粋さを指すか、教える者の誠実さを指すかは明確に限定されていない。
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: περὶ πάντα
  choice: あらゆる点で
  rationale: この句はここでは行動の包括性を表す副詞的な表現と捉えた。「すべてのことについて」ではなく、テトスの振る舞い全般を指す自然な現代日本語とした。
- source_word: σεαυτὸν παρεχόμενος
  choice: あなた自身を…として示しなさい
  rationale: 再帰代名詞の力と、テトスが自ら模範を示すという能動的な意味を保った。分詞は文脈上の勧告として自然な命令表現にした。
- source_word: τύπον
  choice: 模範
  rationale: 倫理的文脈で、他者が見習うべき実例・型を意味する。「模範」は現代日本語で簡潔かつ明瞭である。
- source_word: καλῶν ἔργων
  choice: 良い行い
  rationale: ἔργωνを具体的な倫理的行為として自然に表し、後代の教理的含意を不必要に持ち込まないようにした。
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: 教える際には
  rationale: 抽象的な「教理」に限定せず、文脈上のテトスの教授行為を表した。定冠詞を所有表現に読み替えすぎないよう、「あなたの教え」ではなく行為として訳した。
- source_word: ἀφθορίαν
  choice: 純正さ
  rationale: 腐敗や損なわれた状態がないことを表す語であり、この文脈では教えの内容または教える者のあり方の健全な純粋性を指し得る。「純正さ」はその幅を比較的保ちつつ、「不朽」のような文脈に合わない語感を避ける。
- source_word: σεμνότητα
  choice: 品位
  rationale: 尊敬に値する真剣さ、重みのある態度を表す。「品位」は単なる堅苦しさではなく、敬意を呼ぶ振る舞いを自然に伝える。
theological_decisions:
- issue: διδασκαλίαを教会用語的な「教理」と訳すか
  choice: 「教える際には」とし、教授行為を表した。
  alternative: 「教えにおいて」「教理において」
  rationale: 本文はテトスの教える内容と態度の双方に関わり得る。「教理」とすると体系化された教説に狭める可能性があるため、より広い原文の意味を保った。
- issue: ἀφθορίαが教えの内容の純粋さを指すか、教師の人格的な誠実さを指すか
  choice: 「純正さ」とし、対象を限定しなかった。
  alternative: 「腐敗のなさ」「誠実さ」「健全さ」
  rationale: ἐν τῇ διδασκαλίᾳとの関係から教えの混じりけのなさが考えられる一方、教える者の誠実さも排除できない。訳文ではこの神学的・倫理的な幅を一方に決め切らないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の分詞構文は、直前から続く勧告として読みやすい命令文に整えた。「純正さ」は日常語としてやや硬いが、ἀφθορίαの珍しい語感と意味の幅を保つため採用した。
