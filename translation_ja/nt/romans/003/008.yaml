id: ROM.3.8
reference: Romans 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: ja
  text: では、なぜ、私たちが中傷され、また、ある人たちが私たちはそう言うと言っているとおりに、「善いことが生じるために、悪いことをしよう」と言わないのでしょうか。その人たちに対する裁きは正当です。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より原文の形に近くは、「そして、私たちが中傷され、ある人たちが私たちはそう言うと言っているとおりに、『善いことが生じるために、悪いことをしよう』と言わないのでしょうか」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「その人たち」は、パウロたちにこの発言を偽って帰す者、またはこの論法を支持する者を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: 中傷され
  rationale: この文脈では、神への冒瀆ではなく、パウロたちの発言を悪意をもって偽って伝えることを指すため、現代日本語で明瞭な「中傷され」とした。
- source_word: φασίν τινες
  choice: ある人たちが…主張している
  rationale: 単に発言を報告するだけでなく、非難として言い張る文脈上の含みを自然に表した。
- source_word: λέγειν
  choice: こう言っている
  rationale: 「教えている」と解釈を広げず、λέγειν の基本義を保った。
- source_word: Ποιήσωμεν
  choice: …しよう
  rationale: 一人称複数アオリスト接続法の勧奨的用法を、日本語の意向形で表した。
- source_word: τὰ κακὰ
  choice: 悪いこと
  rationale: 冠詞付き中性複数形容詞を、自然で包括的な日本語にした。
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: 善いことが生じるために
  rationale: ἵνα の目的の力と、ἔρχομαι の「生じる、到来する」という表現を保った。
- source_word: κρίμα
  choice: 罪に定められる
  rationale: ここでは不利な司法的判決を意味するため、「裁き」よりも方向性の明確な表現を選んだ。
- source_word: ἔνδικόν
  choice: 正当です
  rationale: 法廷的・道徳的な「正しい、当然である」という意味を、端的で品位ある現代日本語で表した。
- source_word: καὶ μὴ
  choice: では、なぜこう言わないのでしょうか
  rationale: 前節から続く省略的な反語を、日本語で理解できる形に補った。ただし補いであることと原文の形式的可能性は脚注に示した。
- source_word: ὧν
  choice: そのように言う者たちが
  rationale: 関係代名詞の指示対象を日本語で明示した。直近の虚偽の非難と、その論法を唱える者たちを指す文脈を反映した。
theological_decisions:
- issue: ὧν（「彼らの」）が指す対象
  choice: パウロたちにこの発言を帰し、またはこの論法を唱える者たち
  alternative: 悪を行って善を来させようとする者一般
  rationale: 文法上は複数の先行対象を受け得るが、直前の「ある人たち」と引用された主張に最も自然につながる。本文では「そのように言う者たち」とし、対象の範囲に関する含みを脚注で説明した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、反語の鋭さと法廷的な結語の重みを保った。引用部は口語的すぎない自然な勧誘表現とし、本文の複雑な挿入構造は二文に分けて読みやすくした。脚注記号[a][b]は該当する結語の直後に置いた。
