id: ROM.3.21
reference: Romans 3:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: ja
  text: しかし今や、律法とは別に、神の義[a][b]が明らかにされました。この義は、律法と預言者[c]によって証しされています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の正義」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「神から与えられる義」という意味の可能性もあります。
    reason: alternative_reading
  - marker: c
    text: 「律法と預言者」は、ここでは旧約聖書の証言を指す表現です。
    reason: cross_reference
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: しかし今や
  rationale: δὲの対照とΝυνὶの時間的な転換をともに示し、パウロの議論の大きな転換点を自然な現代日本語で表す。
- source_word: χωρὶς νόμου
  choice: 律法とは別に
  rationale: χωρίςが示す分離を表し、文脈上のモーセ律法への言及を保つ。「律法なしに」よりも、律法から独立した現れであることが明瞭。
- source_word: δικαιοσύνη θεοῦ
  choice: 神の義
  rationale: 属格θεοῦを「神からの」と限定せず、神ご自身の義、神の義なる働き、神に由来する義という含意の幅を保つ。δικαιοσύνηの伝統的かつ簡潔な訳語として「義」を用いる。
- source_word: πεφανέρωται
  choice: 明らかにされました
  rationale: 完了形が示す、すでに現されて現在も明らかな状態を文脈に即して表す。受動態も保持する。
- source_word: μαρτυρουμένη
  choice: 証しされています
  rationale: 現在受動分詞の継続的な証言の意味を表す。日本語として明瞭にするため文を分け、「この義」を補って分詞とδικαιοσύνηの関係を明示する。
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: 律法と預言者たちによって
  rationale: 旧約聖書の証言全体を指す定型的表現を直訳的に保ち、動作主を示すὑπόの受動構文も反映する。
theological_decisions:
- issue: δικαιοσύνη θεοῦにおける属格の意味
  choice: 神の義
  alternative: 神から与えられる義
  rationale: この句は、神ご自身の義なる性質と行為、また神に由来して人に及ぶ義を響かせうる。「神の義」は、その神学的緊張を本文で一義的に解消しない。
- issue: δικαιοσύνηの意味範囲
  choice: 義
  alternative: 正義
  rationale: 救済論的・関係的な含意を持つパウロの用法には「義」が簡潔で適切だが、裁きや公正に関わる「正義」の意味も排除されないため脚注に示す。
- issue: 「律法と預言者たち」の指示対象
  choice: 律法と預言者たち
  alternative: 聖書
  rationale: 原文の定型句を本文に残しつつ、それが旧約聖書の証言を指すことを脚注で説明する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「神の義」「律法と預言者たち」という聖書的な主要語句は保持しつつ、長いギリシア語の一文を二文に分け、普通の読者にも係り受けが分かるようにした。
