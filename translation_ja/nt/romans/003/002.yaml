  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: ja
  text: あらゆる点で、大いにあります。というのも、まず第一に、彼らは神のことば[a]を委ねられたことです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の託宣」。
    reason: λόγιαが神からの発言・宣告を指すことを、より形式的な訳語で示すため。
lexical_decisions:
- source_word: πολὺ
  choice: 大いにあります
  rationale: 前節の「どんな利点があるのか」という問いに答える副詞的用法。文脈上補われる「利点が」を重ねず、簡潔で自然な日本語とした。
- source_word: κατὰ πάντα τρόπον
  choice: あらゆる点で
  rationale: 利点が全面的・多面的にあることを表す慣用句であり、「あらゆる点で」がその広がりを自然に伝える。
- source_word: πρῶτον μὲν γὰρ
  choice: というのも、まず第一に
  rationale: γὰρの説明・根拠提示を「というのも」で示し、πρῶτον μὲνが最初の要点を導入する働きを「まず第一に」で保持した。直後に第二の項目が続かないという原文の談話上の緊張も解消していない。
- source_word: ἐπιστεύθησαν
  choice: 彼らは…を委ねられた
  rationale: ここではπιστεύωの受動形が「信じた」ではなく、あるものを託されることを意味する。神の啓示を託されたという責任ある立場を示すため「委ねられた」とした。
- source_word: τὰ λόγια
  choice: ことば
  rationale: λόγιαは神からの発言・託宣を指す。「ことば」は現代日本語で読みやすく、神に由来する発言であることは属格句によって明確になる。より専門的な「託宣」は脚注に示した。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 所有と起源の双方を含み得る属格を、解釈を狭めない簡潔な「神の」で表した。
theological_decisions:
- issue: 「神のことば」が指す範囲
  choice: 本文では範囲を限定せず「神のことば」とする
  alternative: 旧約聖書全体、律法、または個々の神託と明示する
  rationale: λόγια τοῦ θεοῦ自体は神の発言・啓示を表すが、この一節だけではその範囲を厳密に限定していないため、特定の正典論的説明を本文に加えない。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、パウロの簡潔で断定的な応答を保った。「というのも」によって前節との論理的つながりを明示し、過度な補足説明は本文に加えていない。
