id: ROM.3.26
reference: Romans 3:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: ja
  text: 神が忍耐してこられた間に、今の時にご自分の義[a]を示すためでした。それは、ご自身が正しい方であり、またイエスを信じる者[b]を義とする方[c]であるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正義」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエスの忠実さに基づく者」。原文は、「イエスを信じる信仰」に基づく者とも、「イエスの忠実さ」に基づく者とも理解し得る。
    reason: alternative_reading
  - marker: c
    text: 別訳「義と認める方」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοχῇ
  choice: 忍耐
  rationale: 神が直ちに裁きを下さず、意図的に差し控えておられることを表す文脈に合う。「寛容」も可能だが、ここでは単なる寛大さではなく裁きの猶予という含みを保つため「忍耐」とした。
- source_word: ἔνδειξιν
  choice: 示す
  rationale: 証拠をもって明らかにするという語義を、現代日本語で自然な動詞表現にした。
- source_word: δικαιοσύνης
  choice: 義
  rationale: パウロ書簡での基本的な訳語を維持し、神の正しさと救済的な働きの双方を含み得る表現とした。「正義」という法的含意は脚注に残した。
- source_word: νῦν καιρῷ
  choice: 今この時
  rationale: νῦνの現在性とκαιρόςの定められた時という含みを、簡潔で自然な日本語で表した。
- source_word: δίκαιον
  choice: 正しい方
  rationale: 神ご自身が正義にかなっているという法廷的文脈を保ちつつ、人格を指す述語として自然な日本語にした。
- source_word: δικαιοῦντα
  choice: 義とする方
  rationale: 現在能動分詞の実質的な名詞用法を反映した。「正しい」と「義とする」により、δίκαιονとδικαιοῦνταの語根上の結び付きを可能な限り保った。
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: イエスを信じる者
  rationale: 属格を目的格的に解し、ἐκ πίστεωςが人の特徴・立脚点を示すことを自然な日本語にした。属格を主格的に取る余地は脚注に残した。
theological_decisions:
- issue: ἐκ πίστεως Ἰησοῦ の属格の解釈
  choice: イエスを信じる者
  alternative: イエスの真実に基づく者／イエスの忠実さに属する者
  rationale: 本文では広く理解される目的格的属格の読みを採用したが、文法的・解釈的に争われている主格的属格の読みを排除せず、脚注で明示した。
- issue: δίκαιον と δικαιοῦντα の関係
  choice: 正しい方であり、同時に……義とする方
  alternative: 義なる方であり、……義と認める方
  rationale: 神が正しくありながら人を義とするという神学的緊張と、同語根による語呂の両方を保つようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神について述べる箇所には「ご自分」「ご自身」を用いて品位を保った。原文が前節から続く前置詞句で始まるため、「神の忍耐のうちに」として接続性を残した。「同時に」を補い、神が正しいことと人を義とすることの併置を自然に示した。
