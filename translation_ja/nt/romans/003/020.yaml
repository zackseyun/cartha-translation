id: ROM.3.20
reference: Romans 3:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: ja
  text: なぜなら、律法の行いによっては、だれ一人として神の前で正しいと認められないからです。律法を通して、罪をはっきり知るようになるのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: 律法の行いによっては
  rationale: 「律法が求める行い」などと解釈を狭めず、属格の簡潔さとパウロの表現を保った。ἐκ の手段・根拠の意味は「によって」で表した。
- source_word: οὐ δικαιωθήσεται
  choice: 正しいと認められない
  rationale: 神の前で義と宣言・承認される法廷的含意を、現代の一般読者に明瞭な表現で示した。未来形は文脈上の一般的・断定的な否定として自然な日本語にした。
- source_word: πᾶσα σὰρξ
  choice: だれ一人として
  rationale: 字義は「すべての肉」だが、ここでは全人類を指すヘブライ語的表現であるため、日本語で同じ指示範囲を自然かつ強く表した。
- source_word: ἐνώπιον αὐτοῦ
  choice: 神の前で
  rationale: 代名詞の指示対象を日本語で明確にし、神の裁き・評価の前という関係を保持した。
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: 罪をはっきり知ること
  rationale: ἐπίγνωσις の十分な認識という含みを「はっきり知る」で表し、単なる情報取得以上の自覚を示した。本文では文として自然になるよう「罪をはっきり知るようになる」とした。
theological_decisions:
- issue: δικαιόω の訳し方
  choice: 正しいと認められる
  alternative: 義とされる
  rationale: 法廷的・関係的な宣告の意味を保ちつつ、教会用語に不慣れな読者にも理解できる表現を選んだ。人が実質的に道徳改善されるという意味には限定していない。
- issue: ἔργων νόμου の範囲
  choice: 律法の行い
  alternative: 律法を行うこと／律法が求める行い
  rationale: 割礼などの境界標識だけ、または功績一般だけに限定せず、原文の簡潔さと解釈上の幅を維持した。
- issue: πᾶσα σὰρξ の人間論的表現
  choice: だれ一人として
  alternative: いかなる肉なる者も
  rationale: 人間の身体性や罪深さについて原文以上の教義的含意を加えず、文脈上の普遍否定を明瞭にした。
translation_notes:
  register: 明瞭で現代的ながら、論証の厳粛さを保つ文体。「なぜなら」と「のです」により、前節から続く理由説明と後半の根拠説明を自然に示した。
