id: ROM.3.5
reference: Romans 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: ja
  text: しかし、もし私たちの不義が神の義[a]を明らかにするのなら、何と言えばよいでしょう。怒りを下す神は不正なのでしょうか。（私は人間的な言い方をしています。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちの不正が神の正義を明らかにする」とも訳せる。
    reason: ἀδικίαとδικαιοσύνηには、それぞれ「不正」と「正義」という司法的な訳語も可能であり、両語の対照を別の仕方で表せるため。
lexical_decisions:
- source_word: ἀδικία
  choice: 不義
  rationale: 神のδικαιοσύνηとの道徳的・関係的な対照を保ち、パウロの議論に適した伝統性と現代日本語での理解しやすさを両立させた。「不正」も文脈上可能なため脚注に残した。
- source_word: δικαιοσύνη
  choice: 義
  rationale: ἀδικίαとの対照を簡潔に示し、神の正しさという広い意味を保つ。「正義」という司法的な訳語の可能性は脚注に示した。
- source_word: συνίστησιν
  choice: 明らかにする
  rationale: 人間の不義が神の義を目に見える形で示す、立証するという文脈上の働きを、自然な現代日本語で表した。
- source_word: μὴ ἄδικος
  choice: 不正なのでしょうか
  rationale: μήが否定の答えを予期する修辞疑問であることを踏まえつつ、本文では結論を先取りせず、ギリシア語と同じ疑問形を保った。
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: 怒りを下す
  rationale: 神の裁きとしての怒りをもたらすという表現を、簡潔で威厳ある日本語にした。
- source_word: κατὰ ἄνθρωπον λέγω
  choice: 私は人間的な言い方をしています
  rationale: ここでの反論が人間の水準に立った言い回しであることを示す、パウロの断りを自然に表した。
theological_decisions:
- issue: 神の裁きの正しさを問う修辞疑問をどう表すか
  choice: 「怒りを下す神は不正なのでしょうか」と疑問形をそのまま保つ
  alternative: 「怒りを下す神が不正だということになるのでしょうか。もちろん、そうではありません」
  rationale: μήは否定の答えを予期するが、明示されていない返答を本文へ補わず、反論の緊張と修辞的な力を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、修辞疑問とパウロの挿入的な断りを保持した。「不義／義」は簡潔で聖書本文にふさわしい格調があり、脚注で「不正／正義」という現代的・司法的な語義を補った。
