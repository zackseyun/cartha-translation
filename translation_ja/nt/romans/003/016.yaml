lexical_decisions:
- source_word: σύντριμμα
  choice: 破滅
  rationale: 打ち砕かれた結果としての崩壊や破壊を簡潔に表す。文脈上、人々が通る所にもたらす破滅を指す語として自然である。
- source_word: ταλαιπωρία
  choice: 悲惨
  rationale: 苦難に満ちた惨めな状態を、現代日本語で簡潔かつ重みをもって表す。
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: その道には
  rationale: 具体的な道の比喩を保ちながら、彼らの歩みや行動の道筋という含意も伝える。「彼らの道には」も可能だが、直前の複数形の人々を受ける日本語として「その道には」が自然である。
- source_word: καὶ
  choice: と
  rationale: 二つの名詞「破滅」と「悲惨」を対等に結ぶ。
