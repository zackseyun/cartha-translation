source:
  edition: SBLGNT
  text: τί γάρ; εἰ ἠπίστησάν τινες, μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ θεοῦ καταργήσει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: ja
  text: では、どうなのでしょう。ある人たちが不誠実だったとしても、その人たちの不誠実が神の誠実さ[a]を無効にするのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の語は「信仰」とも訳せるが、ここでは人の不誠実との対照から、神の忠実さ、すなわち神が約束に真実であることを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: では、どうなのでしょう
  rationale: 直前の議論を受けて問いを提示する簡潔な論述標識。現代日本語として自然に、パウロの議論の転換を保つ。
- source_word: ἠπίστησάν
  choice: 不誠実だった
  rationale: 「信じなかった」も可能だが、続くἀπιστίαと神のπίστιςとの対照を考慮し、信頼や契約への不忠実を表しうる「不誠実」とした。
- source_word: τινες
  choice: ある人たち
  rationale: 不特定の複数者を表すため、明瞭で自然な日本語とした。
- source_word: ἀπιστία
  choice: 不誠実
  rationale: 動詞ἠπίστησάνとの語形上の連関と、神のπίστιςとの対照を見える形で保つ。「不信」も語義上は可能。
- source_word: πίστιν τοῦ θεοῦ
  choice: 神の真実
  rationale: 属格句は字義的には「神の信仰／信」であるが、ここでは人間のἀπιστίαに対する神の信頼性・忠実さを指す可能性が高い。「神の真実」は神が約束に真実であることを自然かつ荘重に表す。字義的な別解は脚注に残す。
- source_word: καταργήσει
  choice: 無効にする
  rationale: 何かを効力のないものにするという文脈上の意味を、一般読者に明確な日本語で表す。
theological_decisions:
- issue: 論争のあるπίστιν τοῦ θεοῦの訳し方
  choice: 神の真実
  alternative: 神の信仰（または「神の信」）
  rationale: 人間の不誠実と神のπίστιςの対照から、神の忠実さ・信頼性を表すと判断した。ただし、ギリシア語の属格句が持つ字義的な曖昧さを解消し切らず、脚注に別訳を示した。
- issue: ἀπιστέω／ἀπιστίαが「不信」か「不誠実」か
  choice: 不誠実だった／不誠実
  alternative: 信じなかった／不信
  rationale: 同語根の動詞と名詞の対応、および神のπίστιςとの修辞的対照を保つため「不誠実」を採用したが、語彙的には不信・不信仰の意味もありうる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問の流れを保った。「神の真実」は日常語よりやや荘重だが、聖書本文として自然であり、「神の誠実」よりも神の変わらない信頼性を簡潔に示す。
