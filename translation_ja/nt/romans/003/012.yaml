id: ROM.3.12
reference: Romans 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: ja
  text: 皆、道をそれ、そろって無益な者となった[a]。善を行う者はいない[b]。一人もいない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そろって役に立たない者となった」または「そろって堕落した」。
    reason: lexical_alternative
  - marker: b
    text: 「善」は「善良さ」または「親切」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: 皆
  rationale: 名詞を補わず、複数全体を指す普遍的な範囲を簡潔に保つ。
- source_word: ἐξέκλιναν
  choice: 道をそれ
  rationale: 本来の道から外れるという比喩的・倫理的な離反を、自然な現代日本語で表す。
- source_word: ἅμα
  choice: そろって
  rationale: 単なる同時性よりも、全員が共通して同じ状態にあるという集合的な意味を伝える。
- source_word: ἠχρεώθησαν
  choice: 無益な者となった
  rationale: アオリスト受動形の結果的な意味を保ち、役に立たない、価値を失ったという強い否定的評価を表す。
- source_word: ποιῶν
  choice: 行う者
  rationale: 分詞の継続的・特徴的な行為の含みを、日本語の連体表現で自然に示す。
- source_word: χρηστότητα
  choice: 善
  rationale: この倫理的文脈で明瞭な表現としつつ、「善良さ」「親切」の語義上の幅は脚注に残す。
- source_word: οὐκ ἔστιν
  choice: いない
  rationale: 人を指す分詞を受け、強い存在否定を明快な現代日本語で表す。
- source_word: ἕως ἑνός
  choice: 一人もいない
  rationale: 字義的な形を不自然に再現せず、「例外は一人さえない」という強調を独立文で保持する。
theological_decisions:
- issue: 人間全体への否定の範囲
  choice: 「皆」および「一人もいない」として、本文の普遍的・強調的な否定をそのまま示す。
  alternative: 対象を特定の集団や行為のみに限定する。
  rationale: πάντες と ἕως ἑνός の組み合わせは例外のなさを強調しており、本文にない限定を加えるべきではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「道をそれ」は倫理的な離反の比喩を自然に伝え、「無益」は原語の強い評価を保つ。原語の反復 οὐκ ἔστιν を「いない。……いない」と再現して結語の強調を際立たせた。英語相談層では脚注記号と内容の対応が逆転しているように見えるため、日本語稿では各語の直後に正しく配置した。
