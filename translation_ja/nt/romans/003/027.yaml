id: ROM.3.27
reference: Romans 3:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: ja
  text: では、誇ることはどこにあるのでしょうか。それは排除されました。どのような法によってですか。行いの法によってですか。いいえ、信仰の法によってです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: 誇ること
  rationale: 文脈上、人が自分の功績を根拠に誇る行為・態度を指す。抽象名詞「誇り」よりも、現代日本語で意味が明確になる表現を選んだ。
- source_word: ἐξεκλείσθη
  choice: 締め出されました
  rationale: 「外へ閉め出す、排除する」という語の強い比喩を保ち、誇る余地がなくなったことを自然な日本語で示す。
- source_word: νόμος
  choice: 法則
  rationale: ここではモーセ律法そのものというより、行いと信仰を対比する原理・規範を指しうるため、「律法」に限定せず「法則」とした。語義上の意図的な反復も保った。
- source_word: ἔργων
  choice: 行い
  rationale: パウロ書簡での一般的な対概念を明瞭に示し、特定の種類の業に狭めない。
- source_word: πίστεως
  choice: 信仰
  rationale: 属格の関係を過度に解釈せず、「信仰の法則」として原文の簡潔さと神学的緊張を保持する。
- source_word: διά + genitive
  choice: 〜によって
  rationale: 手段・媒介を表す用法として自然な日本語にした。「どのような法則によって」と「信仰の法則によって」の対応を保つ。
theological_decisions:
- issue: 「信仰の法則」の解釈
  choice: 信仰の法則
  alternative: 信仰という原理／信仰による律法
  rationale: νόμος πίστεως の圧縮された表現を説明的に解消せず、律法・原理・規範をめぐる含みと、行いとの対照を保持した。
- issue: 人間の誇りの排除
  choice: それは締め出されました
  alternative: 誇る余地はなくなりました
  rationale: 意味を明確化した意訳にせず、原文の擬人的かつ受動的な表現を残した。行為者も補わない。
translation_notes:
  register: 問いと答えが畳みかける修辞を保ちつつ、丁寧体で明快かつ格調ある現代標準日本語とした。「法則」を三度用いて原文の νόμος の反復を可視化した。
