id: ROM.3.10
reference: Romans 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Οὐκ ἔστιν δίκαιος οὐδὲ εἷς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/010.yaml
  text: 'As it is written: “There is no one righteous, not even one.”'
translation:
  language: ja
  text: こう書かれています。「正しい者はいない。一人もいない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: こう
  rationale: 引用導入句「こう書かれています」として、καθὼςとγέγραπταιの結び付きを自然で簡潔な現代日本語にした。
- source_word: γέγραπται
  choice: 書かれています
  rationale: 完了受動形による聖書引用の定型句。過去に記され、今もその記述が有効である含みを、日本語の定型的な表現で保った。
- source_word: ὅτι
  choice: 「」
  rationale: 引用内容を導くὅτιは、明示的に「と」を補うより、句点と引用符で表すほうが自然な日本語になる。
- source_word: Οὐκ ἔστιν
  choice: いない
  rationale: 人を指す形容詞δίκαιοςの存在を否定する構文を、自然な日本語の存在表現にした。
- source_word: δίκαιος
  choice: 正しい者
  rationale: 文脈上の義・正しさを保ちつつ、一般読者に明瞭な表現を採用した。「正義の人」よりも道徳的・神学的な広がりを保てる。
- source_word: οὐδὲ εἷς
  choice: 一人もいない
  rationale: 「一人さえもいない」という強調を、簡潔で自然な日本語として表した。
theological_decisions:
- issue: δίκαιοςを法廷的・契約的な専門語に限定するか、一般的な「正しい者」とするか
  choice: 正しい者
  alternative: 義人
  rationale: 「義人」は伝統的だが、現代の一般読者には専門的または古風に響きうる。「正しい者」は意味を狭く教派的に規定せず、パウロの義に関する文脈にも開かれた表現である。
- issue: 否定命題の普遍性をどのように表すか
  choice: 正しい者はいない。一人もいない。
  alternative: 正しい者は一人もいない。
  rationale: 原文の二段階の否定（Οὐκ ἔστιν δίκαιος / οὐδὲ εἷς）を二文で保ち、絶対性と修辞的な強調を明確にした。
translation_notes:
  register: 明瞭で現代的かつ聖書引用にふさわしい端正な文体。伝統的な「義人」ではなく「正しい者」を用い、一般読者への理解しやすさと原文の神学的な広がりを両立させた。
