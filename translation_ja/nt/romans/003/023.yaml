id: ROM.3.23
reference: Romans 3:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/023.yaml
  text: For all have sinned and fall short of the glory of God[b][a],
translation:
  language: ja
  text: すべての人が罪を犯し、神の栄光に達していないからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の栄光を欠いています」または「神の栄光に及びません」。
    reason: lexical_alternative
  - marker: b
    text: 「神の栄光」は、神ご自身の栄光、人間が映すべき栄光、または神から与えられる栄光を指す可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: すべての人
  rationale: 文脈上、人間すべてを包括する主語であることを、自然な日本語で明確に表す。
- source_word: γὰρ
  choice: からです
  rationale: 直前の論述を理由づける説明的な接続を、日本語の文末表現で自然に示す。
- source_word: ἥμαρτον
  choice: 罪を犯し
  rationale: アオリストが人間の罪という事実を総括しているため、簡潔な表現とする。
- source_word: ὑστεροῦνται
  choice: 達していない
  rationale: 現在形が示す継続的な欠如を表しつつ、「及ばない／欠いている」という語義の幅を保持する。
- source_word: δόξης
  choice: 栄光
  rationale: δόξαの基本的かつ神学的文脈に適した訳語であり、輝き、誉れ、神から与えられる栄光という含意を狭めない。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格を素直に訳し、神ご自身の栄光か、神からの栄光かなどを本文で決めつけない。
theological_decisions:
- issue: 「神の栄光」の意味
  choice: 「神の栄光」と中立的に訳す。
  alternative: 「神から与えられる栄光」「人間が映すべき神の栄光」「神ご自身の栄光」
  rationale: 原文の属格は簡潔で複数の理解が可能なため、本文では神学的な緊張と曖昧さを保つ。
- issue: ὑστεροῦνται と「神の栄光」の関係
  choice: 「神の栄光に達していない」とする。
  alternative: 「神の栄光を欠いている」「神の栄光に及ばない」
  rationale: 継続的な不足を自然な現代日本語で示しながら、何らかの規準への未達という意味だけに固定しすぎないよう脚注で代案を示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。γάρは日本語として自然な文末の「からです」で表し、単独節としても直前の文脈への説明的つながりが分かるようにした。
