  text: Their throat is an open grave[a]; they deceive with their tongues[c][b]; the venom of asps is under their lips.
translation:
  language: ja
  text: '彼らの喉は開いた墓。


    彼らは舌で欺く[a]。


    毒蛇[b]の毒が彼らの唇の下にある。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「舌で欺いていた」「舌で欺き続けていた」。ギリシア語の未完了過去形は、継続または反復される行為を表し得る。
    reason: lexical_alternative
  - marker: b
    text: この語が指す蛇の種類は確定しにくく、「まむし」「コブラ」などと訳されることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: 墓
  rationale: 死と腐敗を想起させる原文の比喩を、現代日本語で簡潔に保つ。
- source_word: ἀνεῳγμένος
  choice: 開いた
  rationale: 完了受動分詞が表す、開かれた結果として今も開いている状態を自然な日本語で示す。
- source_word: λάρυγξ
  choice: 喉
  rationale: 身体的イメージを明瞭に保つ標準的な訳語。
- source_word: ἐδολιοῦσαν
  choice: 欺いていた
  rationale: 未完了過去形が示す継続的・反復的な欺きを表しつつ、日本語として自然にした。目的語は原文に明示されないが、「人を」は行為の意味を自然に伝える補足である。
- source_word: ἰὸς
  choice: 毒
  rationale: 蛇との組み合わせで毒液を指すことが明らかであり、日本語では「毒」が最も自然である。
- source_word: ἀσπίδων
  choice: 毒蛇
  rationale: 指す蛇の厳密な種類には不確かさがあるため、特定の日本在来種に限定せず、毒を持つ蛇という文脈上の要点を保つ。
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: 彼らの唇の下に
  rationale: 原文の位置表現と、言葉に潜む危険を示す鮮烈な身体的比喩を保つ。
