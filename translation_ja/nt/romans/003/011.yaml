  text: οὐκ ἔστιν ⸀ὁ συνίων, οὐκ ἔστιν ⸁ὁ ἐκζητῶν τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/011.yaml
  text: There is no one who understands[a]; there is no one who seeks God.
translation:
  language: ja
  text: 理解する者はいない。神を求める者はいない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神を探し求める者はいない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίων
  choice: 悟る者
  rationale: συνίημιの分詞は、物事を理解し洞察することを表す。目的語が明示されていない原文の簡潔さを保ちつつ、文脈にふさわしい自然で格調ある日本語として「悟る者」とした。
- source_word: ἐκζητῶν
  choice: 求める者
  rationale: ἐκζητέωには熱心に探し求める含みがあり得るが、ここでは「神を求める」が明瞭で自然である。複合動詞の強いニュアンスは脚注に残した。
- source_word: οὐκ ἔστιν
  choice: いない
  rationale: 人を指す名詞化された分詞とともに用いられているため、「……者はいない」とし、原文の断定的な否定を簡潔に保持した。
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: 「悟る者」「求める者」
  rationale: 冠詞付き分詞を日本語の名詞的表現「……者」で訳し、二つの節の並行構造を保った。
- source_word: τὸν θεόν
  choice: 神
  rationale: 定冠詞を機械的に訳出せず、特定の神、すなわち神を指す日本語として自然な「神」とした。
theological_decisions:
- issue: パウロが引用する一連の聖句における否定の範囲
  choice: 二度とも「……者はいない」と絶対的な表現を保つ。
  alternative: 「本当に悟る者はいない」「真に神を求める者はいない」のように限定する。
  rationale: ギリシア語は限定語を伴わない断定的な否定であるため、解釈による緩和や限定を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、二つの否定文の簡潔な並行と断定的な力を保った。「悟る」は日常語として理解可能でありながら、引用句にふさわしい格調を持つ。
