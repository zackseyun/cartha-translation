id: ROM.3.22
reference: Romans 3:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: ja
  text: 神の義[a]は、イエス・メシアへの信仰[b]を通して、信じるすべての人に及びます。区別はないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の公正」。
    reason: δικαιοσύνηには「義」のほか「公正」「正義」の意味もあり得るため。
  - marker: b
    text: 別訳「イエス・メシアの忠実さを通して」。
    reason: πίστεως Ἰησοῦ Χριστοῦは、「イエス・メシアへの信仰」とも「イエス・メシアの忠実さ」とも理解し得る、論争のある属格表現であるため。
lexical_decisions:
- source_word: δικαιοσύνη θεοῦ
  choice: 神の義
  rationale: 属格を保って「神の義」とし、神の正しい性質と働き、また神が与える正しい立場という広がりを狭めない。
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: イエス・メシアへの信仰を通して
  rationale: διάを「通して」、論争のある属格を本文では一般的な目的格的理解により「への信仰」と訳す。Χριστόςは称号として「メシア」とする。
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: 信じるすべての人に及びます
  rationale: εἰςの方向・到達の含みと、現在分詞の継続的・一般的な性格を、自然な現代日本語で表す。
- source_word: διαστολή
  choice: 区別
  rationale: 神の義が及ぶ範囲について差別的な線引きがないことを、簡潔かつ文脈に即して表す。
- source_word: γάρ
  choice: からです
  rationale: 後半が前半の理由を示す論理関係を明確にする。
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ の属格
  choice: イエス・メシアへの信仰
  alternative: イエス・メシアの真実（または忠実さ）
  rationale: 目的格的属格と主観格的属格の両方が文法上・神学上論じられているため、本文では一般的な前者を採り、後者を脚注に残して緊張関係を保存する。
- issue: δικαιοσύνη θεοῦ の意味範囲
  choice: 神の義
  alternative: 神の公正
  rationale: 「義」は神の属性・救済の働き・神が認める正しい立場を含み得る表現であり、原文の広がりを比較的よく保持する。「公正」は有力な語義として脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すなわち」で前節からの説明的なつながりを示し、原文で省略されている述語は「及びます」と最小限に補った。「そこに区別はない」は簡潔なパウロ書簡の論証調を保つ。
