  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: ja
  text: 神は唯一であり[a]、割礼のある者[b]を信仰に基づいて義と認め、割礼のない者を信仰を通して義と認めるからです。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もし本当に神が唯一であるなら」。
    reason: alternative_reading
  - marker: b
    text: ギリシア語では「割礼」と「無割礼」。ここでは、それぞれ割礼のある人々と割礼のない人々を指す。
    reason: cultural_note
  - marker: c
    text: パウロは「信仰に基づいて」と「信仰を通して」に当たる二つの異なる表現を用いている。この違いは、明確な意味の対比ではなく文体上の変化である可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: 〜であり……からです
  rationale: ここでは不確実な条件というより、共有された唯一神信仰を根拠とする論証と理解し、自然な理由表現とした。ただし条件的な形も可能なので脚注に残した。
- source_word: εἷς ὁ θεός
  choice: 神は唯一であり
  rationale: 唯一神についての強調を保ちつつ、現代日本語として明瞭にした。
- source_word: δικαιώσει
  choice: 義と認めてくださる
  rationale: δικαιόωの法廷的・宣言的な意味を平易に表し、未来形は文脈上の神の確かな行為として「くださる」に保持した。
- source_word: περιτομήν
  choice: 割礼のある者
  rationale: 抽象名詞「割礼」が割礼を受けた人々を指す換喩であることを、民族名に限定せず明示した。
- source_word: ἐκ πίστεως
  choice: 信仰に基づいて
  rationale: ἐκの起点・根拠の含みを示し、後半のδιάとの表現上の違いを保った。
- source_word: ἀκροβυστίαν
  choice: 割礼のない者
  rationale: 「無割礼」が人々を指す換喩であることを明瞭にし、「異邦人」と解釈的に限定することを避けた。
- source_word: διὰ τῆς πίστεως
  choice: 信仰を通して
  rationale: διάの媒介的表現を保ち、前半のἐκ πίστεωςと同一表現に均さなかった。
- source_word: πίστεως
  choice: 信仰
  rationale: この箇所では「信仰」が自然かつ伝統的であり、πίστιςの意味を過度に「忠実」などへ限定しない。
theological_decisions:
- issue: ἐκ πίστεωςとδιὰ τῆς πίστεωςの間に神学的な区別が意図されているか
  choice: 「信仰に基づいて」と「信仰を通して」と訳し、前置詞の違いを保つ。
  alternative: 両方を「信仰によって」と訳し、文体上の変化として扱う。
  rationale: ギリシア語の異なる前置詞を反映する一方、根拠と手段の厳密な教理的対比までは本文で断定しない。
- issue: εἴπερを理由として取るか条件として取るか
  choice: 論証上の根拠を示す「〜からです」とした。
  alternative: 「もし本当に神が唯一なら」と条件的に訳す。
  rationale: 文脈では唯一神信仰を疑っているのではなく、共有された確信から結論を導いていると考えられる。ただし語形上の条件的ニュアンスは脚注で保持した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ。「義と認める」は神学用語「義とする」より一般読者に理解しやすく、宣言的意味も伝える。脚注記号は対応箇所に置き、[c]は二つの信仰表現全体に関わるため文末に配置した。
