id: ROM.3.6
reference: Romans 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ θεὸς τὸν κόσμον;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/006.yaml
  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: ja
  text: 決してそんなことはありません。[a] もしそうだとすれば、神はどのようにして世を裁くのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「断じてそんなことはありません」、より形式的には「そんなことがあってはなりません」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: 決してそんなことはありません
  rationale: パウロが直前の推論を強く退ける定型表現である。願望形を直訳するよりも、現代日本語でその強い否定の力を自然かつ明確に表した。
- source_word: ἐπεὶ
  choice: もしそうだとすれば
  rationale: 退けられた前提を仮に認めた場合の帰結を導く語として理解した。文脈上の論理関係が日本語で明瞭になる。
- source_word: κρινεῖ
  choice: 裁くのでしょうか
  rationale: 未来直説法による修辞的疑問を、神が将来世を裁くことへの問いとして自然な日本語で表した。「裁けるでしょうか」として可能性だけに限定するのを避けた。
- source_word: ὁ θεὸς
  choice: 神は
  rationale: 定冠詞を伴う主語を、標準的で明瞭な日本語にした。
- source_word: τὸν κόσμον
  choice: 世を
  rationale: κόσμοςがここでは神の裁きの対象となる世界を広く指すため、聖書文体として自然で簡潔な「世」を採用した。
theological_decisions:
- issue: μὴ γένοιτοによる否定の強さ
  choice: 直前の推論を強く退ける慣用的な否定として訳す
  alternative: 「そんなことがあってはなりません」のように願望形をより形式的に反映する
  rationale: ギリシア語の形を機械的に写すのではなく、パウロの強い拒絶を明瞭に伝えつつ、追加の教理的説明は持ち込まない。
- issue: ἐπεὶが示す論理関係
  choice: 退けられた前提を仮定した帰結として「もしそうだとすれば」とする
  alternative: 「そうでなければ」または「というのも」とする
  rationale: 文脈における反実的な論証の流れを自然に示す一方、神の裁きについて本文以上の説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、強い反論には丁寧体の中でも力のある表現を選んだ。「世を裁く」は簡潔で格調を保つ聖書的表現である。
