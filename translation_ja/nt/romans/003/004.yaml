  rationale: 二人称所有格 σου を「あなたの言葉」と明示し、引用文の構文を自然な日本語に整えました。前半は、γινέσθω の修辞的な命令・要請を保ちつつ、明瞭な現代標準日本語に改めました。神が道徳的に正しくされるとの含みを避ける法廷的表現、ならびに本文の受動態と詩篇由来の能動的異読を示す脚注は維持しています。
