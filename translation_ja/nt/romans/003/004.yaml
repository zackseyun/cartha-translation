id: ROM.3.4
reference: Romans 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: ja
  text: '決してそんなことがあってはなりません。むしろ、神が真実であり、すべての人が偽り者であることを認めるべきです。こう書かれているとおりです。


    「あなたがあなたの言葉において正しいと認められ[a]、


    あなたが裁かれるとき、勝利を得るためです[b]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたが正しいことを示され」または「あなたが正当であると認められ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたが裁くとき」。これは詩篇51:4のヘブライ語の表現をより直接反映しますが、ローマ書のギリシア語は自然には「あなたが裁かれるとき」と読めます。
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: 決してそんなことがあってはなりません
  rationale: パウロの強い否定を自然な現代日本語で表しつつ、単なる「いいえ」よりも願望法の響きを保つ。
- source_word: γινέσθω δὲ ὁ θεὸς ἀληθής
  choice: むしろ、神は真実であり…とせよ
  rationale: γινέσθω の命令的な力を保ち、神が真実になるという意味ではなく、神を真実な方として認めるべきだという対比を表す。
- source_word: πᾶς δὲ ἄνθρωπος ψεύστης
  choice: すべての人は偽り者である
  rationale: ἄνθρωπος の一般的な人間全体への言及と、πᾶς の包括的・分配的な意味を明確にする。
- source_word: ψεύστης
  choice: 偽り者
  rationale: 神の「真実」との鋭い対照を保ち、「うそつき」よりも引用文脈にふさわしい品位を持たせる。
- source_word: καθὼς γέγραπται
  choice: こう書かれているとおりです
  rationale: 聖書引用を導入する定型表現として、完了形の継続的な効力を自然な日本語で伝える。
- source_word: δικαιωθῇς
  choice: 正しいと認められ
  rationale: 神が道徳的に正しくされるのではなく、その正しさが法廷的に承認・立証される意味を示す。
- source_word: ἐν τοῖς λόγοις σου
  choice: その言葉において
  rationale: 前置詞句の形を保ち、神の語った言葉に関して神の正しさが認められるという意味を表す。
- source_word: νικήσεις
  choice: 勝利を得る
  rationale: 裁きの場で優位に立ち、正しさが確証される意味を、過度に軍事的にせず明瞭に表す。
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: あなたが裁かれるとき
  rationale: ローマ書のギリシア語にある受動形を最も自然に反映する。詩篇のヘブライ語に沿う能動的理解は脚注に残す。
theological_decisions:
- issue: 神について用いられる δικαιωθῇς の法廷的意味
  choice: 正しいと認められ
  alternative: 正しいことが明らかにされ／正当であると認められ
  rationale: 神が新たに義となることではなく、人間の偽りと対照して、神の言葉と判断の正しさが立証されることを表す。
- issue: ἐν τῷ κρίνεσθαί σε の態
  choice: あなたが裁かれるとき
  alternative: あなたが裁くとき
  rationale: ローマ書本文のギリシア語は自然には受動態だが、引用元の詩篇51:4のヘブライ語は能動的な「あなたが裁くとき」に対応するため、本文ではギリシア語を優先し、異なる伝承上の形を脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用にふさわしい端正さを保った。「…とせよ」は γινέσθω の命令的な修辞を残すために採用し、引用部では法廷的な緊張とギリシア語の受動態を保持した。脚注記号[a]と[b]は、それぞれ該当する語句の直後に配置した。
