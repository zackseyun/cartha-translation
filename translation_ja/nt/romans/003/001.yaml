id: ROM.3.1
reference: Romans 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/001.yaml
  text: What then is the advantage of the Jew? Or what is the benefit of circumcision?[a][b]
translation:
  language: ja
  text: では、ユダヤ人であることには、どんな優れた点があるのでしょうか。あるいは、割礼にはどんな益があるのでしょうか。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「では、割礼にはどんな価値があるのでしょうか」。
    reason: lexical_alternative
  - marker: b
    text: 原文の「ユダヤ人」は単数形ですが、ここではユダヤ人を一つの類として代表的に指しています。
    reason: cultural_note
lexical_decisions:
- source_word: Τί οὖν
  choice: では、……どんな
  rationale: 前の議論を受ける推論的な移行と、修辞疑問の自然な日本語表現を保つ。
- source_word: τὸ περισσὸν
  choice: 優れた点
  rationale: ここでは、ほかと比べて際立つ点や有利な点を意味する。民族的な優越性を断定せず、ユダヤ人であることの特別な利点を問う表現とした。
- source_word: τοῦ Ἰουδαίου
  choice: ユダヤ人であること
  rationale: 原文の単数形は一人の特定人物ではなく、類を代表する総称的用法である。日本語では不自然な代表単数を避け、その範疇に属することを明確に表した。
- source_word: ἢ τίς
  choice: あるいは、……どんな
  rationale: 二つ目の修辞疑問を導き、原文の並行構造を自然な日本語で示す。
- source_word: ἡ ὠφέλεια
  choice: 益
  rationale: 実際にもたらされる有用性や利益を簡潔かつ格調ある現代日本語で表し、περισσόνとの語義上のわずかな違いも保つ。
- source_word: τῆς περιτομῆς
  choice: 割礼には
  rationale: 契約のしるしである儀礼を原文どおり直接名指しし、その有益性を問う日本語として自然にした。
theological_decisions:
- issue: Ἰουδαίουの総称的単数を日本語でどう表すか
  choice: ユダヤ人であること
  alternative: 一人のユダヤ人／ユダヤ人には
  rationale: 特定の男性一人を指すとの誤解を避けつつ、ユダヤ人という範疇について問う原文の趣旨を保持する。性別をめぐる教義的含意は付加しない。
- issue: περισσόνを民族的優越性として訳すか、利点として訳すか
  choice: 優れた点
  alternative: 優越性／利点
  rationale: 文脈はユダヤ人に何らかの特別な利点があるかを問うものであり、民族そのものの本質的優越を断定してはいない。その緊張を結論づけずに残す。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。パウロの連続する二つの修辞疑問を保ち、「優れた点」と「益」によってπερισσόνとὠφέλειαの近接しつつ異なる語感を示した。
