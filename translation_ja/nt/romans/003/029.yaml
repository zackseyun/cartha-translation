id: ROM.3.29
reference: Romans 3:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ Ἰουδαίων ὁ θεὸς μόνον; ⸀οὐχὶ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/029.yaml
  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: ja
  text: それとも、神はユダヤ人だけの神なのでしょうか。異邦人の神でもあるのではありませんか。そうです、異邦人の神でもあります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異邦人」は、より字義的には「諸国民」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: それとも
  rationale: 直前の議論を受けて別の可能性を修辞疑問として提示する接続詞であり、現代日本語の論証の流れに自然である。
- source_word: Ἰουδαίων
  choice: ユダヤ人の
  rationale: θεόςにかかる属格を「ユダヤ人の神」として自然に表し、民族的な対比を明確にする。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 定冠詞付きθεόςを、文脈上唯一の神を指す標準的な日本語「神」で表す。第二の疑問と答えでは、日本語として必要な「神」を補って意味を明確にする。
- source_word: μόνον
  choice: だけ
  rationale: 排他性を明瞭に伝えつつ、修辞疑問の中で自然な現代日本語となる。
- source_word: οὐχὶ
  choice: ではありませんか
  rationale: 肯定の答えを予期する強い否定疑問の働きを、日本語の自然な確認表現で保持する。
- source_word: ἐθνῶν
  choice: 異邦人の
  rationale: ユダヤ人との明示的な対比では、地政学的な「諸国民」よりも非ユダヤ人を指す「異邦人」が文脈上明確である。
- source_word: ναὶ
  choice: そうです
  rationale: 修辞疑問への簡潔で明確な肯定の返答を自然な日本語で示す。
- source_word: καὶ
  choice: も
  rationale: ユダヤ人に加えて異邦人も含まれるという包括的な意味を簡潔に保持する。
theological_decisions:
- issue: ἐθνῶνを「異邦人」とするか「諸国民」とするか
  choice: 異邦人
  alternative: 諸国民
  rationale: ここではἸουδαίωνとの対比により非ユダヤ人が指されている。「異邦人」は一人の神がユダヤ人と非ユダヤ人双方の神であるというパウロの論旨を明確に保つ一方、より字義的な選択肢は脚注に示す。
translation_notes:
  register: 明快で格調を保った現代標準日本語。二つの修辞疑問の並行性を保ち、最後の肯定では日本語で省略すると曖昧になり得る「神」を補った。脚注記号は該当語句を含む文の末尾に置いた。
