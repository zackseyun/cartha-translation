id: ROM.3.31
reference: Romans 3:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο, ἀλλὰ νόμον ⸀ἱστάνομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: ja
  text: では、私たちは信仰によって律法を無効にするのでしょうか。断じてそうではありません。むしろ、律法を堅持するのです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「律法を確立するのです」。
    reason: ἱστάνομενは「立たせる」「確立する」の意を持つ。この文脈では、信仰によって律法を無効にするのではないという否定との対照で、律法を有効なものとして保つことを表す。
lexical_decisions:
- source_word: νόμον
  choice: 律法
  rationale: ローマ書の議論ではモーセの律法（トーラー）を指すため、日本語聖書で定着し、文脈上も明確な「律法」とした。ギリシア語では冠詞を欠くが、日本語では冠詞の有無を明示する必要はない。
- source_word: οὖν
  choice: では
  rationale: 直前の議論から生じる修辞的な問いを、現代日本語で自然に導く表現とした。
- source_word: καταργοῦμεν
  choice: 無効にする
  rationale: 効力を失わせる、無に帰するという意味を明確に表し、「廃止する」ほど制度的・立法的な含みを強めない。
- source_word: διὰ τῆς πίστεως
  choice: 信仰によって
  rationale: διά＋属格の手段的な意味を自然な日本語で表し、πίστιςは文脈に即して「信仰」とした。
- source_word: μὴ γένοιτο
  choice: 断じてそうではありません
  rationale: パウロの強い否定を、威厳を保ちつつ現代の読者にも明瞭な日本語で表した。
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 先の問いを強く退け、反対の結論へ転じる対照を簡潔に示す。
- source_word: ἱστάνομεν
  choice: 堅く立てる
  rationale: ἵστημιの「立たせる、確立する」という像を保ちながら、律法を無効にすることとの対照として、その効力や立場を保つ意味を伝える。
theological_decisions:
- issue: 信仰と律法の関係
  choice: 「律法を堅く立てる」と訳す
  alternative: 「律法を確立する」「律法を支持する」
  rationale: 原文は、信仰が律法を無効にするのではなく、反対にそれを立たせると述べる。「堅く立てる」は原語の比喩を残しつつ、律法を新たに制定するという誤解を避ける。信仰が律法をどのような仕方で立てるかについては本文で特定の神学体系に限定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、修辞疑問と強い否定の力を保った。「断じてそうではありません」は口語に崩しすぎず、パウロの強い反駁を伝える。
