id: ROM.3.9
reference: Romans 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τί οὖν; προεχόμεθα; οὐ πάντως, προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ’ ἁμαρτίαν εἶναι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/009.yaml
  text: What then? Are we better? Not at all[a], for we have already charged that both Jews and Greeks are all under sin[b],
translation:
  language: ja
  text: では、どうでしょうか。私たちのほうが優れているのでしょうか。決してそうではありません[a]。私たちはすでに、ユダヤ人もギリシア人も皆、罪の下にあると告発してきたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちには何か有利な点があるのでしょうか」。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν
  choice: では、どうなのでしょう
  rationale: 推論を示すοὖνを「では」で明示し、パウロの議論を進める簡潔な問いとして自然な現代日本語にした。
- source_word: προεχόμεθα
  choice: 私たちのほうが優れているのでしょうか
  rationale: 解釈が争われる中動態を、直前までの文脈におけるユダヤ人の比較上の優位を問う表現とした。「何か有利な点があるのでしょうか」という可能性は脚注に残した。
- source_word: οὐ πάντως
  choice: 決してそうではありません
  rationale: 文脈上の強い否定を、明瞭で品位のある現代日本語で表した。
- source_word: προῃτιασάμεθα
  choice: 私たちはすでに…と告発した
  rationale: 先に罪責を指摘したという法廷的な含みを保ち、「論じてきた」よりも原語の accusation の語感を明示した。
- source_word: Ἰουδαίους τε καὶ Ἕλληνας
  choice: ユダヤ人もギリシア人も
  rationale: τε καὶの組み合わせを自然に示し、原文の「ギリシア人」を一般化せず保持した。
- source_word: πάντας
  choice: 皆
  rationale: 両集団の全員に及ぶ包括性を簡潔に表した。
- source_word: ὑφ’ ἁμαρτίαν εἶναι
  choice: 罪の下にある
  rationale: 罪への服属を表す圧縮された比喩を解きほぐしすぎず、その神学的な重みと曖昧さを保持した。
theological_decisions:
- issue: προεχόμεθαにおける一人称複数と問いの意味
  choice: ユダヤ人側の比較上の優越を問う「私たちのほうが優れているのでしょうか」
  alternative: ユダヤ人に何らかの利点があるかを問う「私たちには何か有利な点があるのでしょうか」
  rationale: ローマ3章1～9節はユダヤ人の特権と責任を扱っている。本文では民族的・道徳的優越の否定として読める訳を採りつつ、動詞が利点の有無を問う可能性を脚注に保持した。
- issue: ὑφ’ ἁμαρτίανの射程
  choice: 「罪の下にある」と比喩をそのまま保つ
  alternative: 「罪の支配下にある」と支配・権力の意味を明示する
  rationale: 原文は単に罪を犯した状態だけでなく服属を含み得るが、「支配」を本文に補うと解釈を一つに限定するため、本文は形式を保ち、説明的な訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、議論調の問いと法廷的な語感を保持した。「優れている」は文脈上、民族的・道徳的に勝るという問いとして読めるが、原語の異なる理解は脚注で明示した。
