id: ROM.3.7
reference: Romans 3:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: ja
  text: しかし、もし私の偽りによって神の真実さ[a]が、神の栄光をもたらすほどいっそう豊かに現れたのなら[b]、なぜ私はなおも罪人として裁かれるのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の真理」または「神の真実」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼の栄光へと、いっそう豊かになったのなら」。「神の栄光のために」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: 神の真実さ
  rationale: 直訳的な「神の真理」も可能だが、直前の文脈（3:4）では神が真実であることと人間の偽りが対比されるため、人格的・道徳的な意味を自然に表す「神の真実さ」とした。
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: 私の偽りによって
  rationale: ἐνを手段の用法と取り、神の真実さが人間の偽りを通して際立つという論旨を明確にした。
- source_word: ἐπερίσσευσεν
  choice: いっそう明らかになり
  rationale: 語義の中心は「増し加わる、豊かになる」だが、日本語で「真実さが増し加わる」とすると神の真実さ自体が増大したようにも響く。偽りとの対照によってそれが豊かに現れるという文脈上の意味を自然に表した。
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: 神の栄光となった
  rationale: εἰςの結果・到達点の含みを保ち、「彼の」という曖昧さを避けて指示対象を明示した。目的を断定する「栄光のために」よりも、ここでは結果を表す訳を採った。
- source_word: τί ἔτι κἀγὼ
  choice: なぜ私はなおも
  rationale: ἔτιの継続性を「なおも」で示した。κἀγώの添加的な含みは日本語では文脈から伝わるため、不自然な「私もまた」は避けた。
- source_word: ὡς ἁμαρτωλὸς κρίνομαι
  choice: 罪人として裁かれる
  rationale: κρίνομαιを、最終的な有罪宣告に限定せず「裁かれる」と訳し、現在受動形の継続的な響きは「なおも」で補った。
theological_decisions:
- issue: ἀλήθεια τοῦ θεοῦが抽象的な「神の真理」か、神の人格的な「真実さ」か
  choice: 神の真実さ
  alternative: 神の真理／神の真実
  rationale: ローマ3:4–7では真実な神と偽る人間が対比されているため、「真実さ」がこの関係的・道徳的対照を明確にする。ただし属格句自体にはより広い「神の真理」という読みもあり、脚注で保持した。
- issue: εἰς τὴν δόξαν αὐτοῦが目的か結果か
  choice: 神の栄光となった
  alternative: 神の栄光のために
  rationale: εἰςは目的・結果の両方を表し得る。ここでは、仮想的反論の論理に合う結果表現を本文に置き、目的的な読みも脚注で示した。
translation_notes:
  register: 現代の標準的な日本語による、明瞭で品位ある修辞疑問文とした。「のでしょうか」によって議論中の仮想的な反論として自然に響かせた。本文中の脚注記号は該当表現の直後に配置した。
