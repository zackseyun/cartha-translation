  yaml_path: translation/nt/romans/003/018.yaml
  text: There is no fear of God before their eyes[a][b].
translation:
  language: ja
  text: 彼らの目の前には、神への恐れがない。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの目の前には、神への畏敬がない」。
    reason: lexical_alternative
  - marker: b
    text: 詩篇36:1（七十人訳では35:2）からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: οὐκ ἔστιν
  choice: ない
  rationale: 否定された現在の存在表現を、簡潔で自然な現代日本語で表した。
- source_word: φόβος θεοῦ
  choice: 神への恐れ
  rationale: φόβος の基本義である「恐れ」を本文に残し、属格 θεοῦ は対象を示す自然な日本語として「神への」とした。畏敬という含みは注記で示す。
- source_word: ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν
  choice: 彼らの目の前には
  rationale: 「目」という具体的な比喩と、ἀπέναντι の空間的表現を保ちながら、日本語として自然な語順にした。
theological_decisions:
- issue: 「神への恐れ」が恐怖か畏敬か
  choice: 本文では「恐れ」とする
  alternative: 神への畏敬
  rationale: 原語 φόβος の率直な意味と聖書的表現の緊張を保持し、敬虔な畏敬だけに意味を限定しない。文脈上可能な「畏敬」は脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「目の前」という聖書的な具体表現を維持しつつ、倒置を避けて自然な文にした。
