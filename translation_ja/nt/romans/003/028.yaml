  text: λογιζόμεθα ⸀γὰρ ⸂δικαιοῦσθαι πίστει⸃ ἄνθρωπον χωρὶς ἔργων νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: ja
  text: というのも、私たちは、人が律法の行いとは別に、信仰によって義とされる[a]と考えるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「義と認められる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: 私たちは…と考える
  rationale: 議論を踏まえた判断を表す。「結論づける」も可能だが、原語の「見なす・考える」という幅を保ちつつ、現代日本語として自然にした。
- source_word: γάρ
  choice: …からです
  rationale: 直前の議論を根拠づける説明的な接続を、自然な日本語の文末表現で示した。
- source_word: δικαιοῦσθαι
  choice: 義とされる
  rationale: 受動態を保ち、パウロ書簡で定着した表現を用いた。法廷的な「義と認められる」という含みは脚注に残した。
- source_word: πίστει
  choice: 信仰によって
  rationale: 与格の手段的な働きを自然に表し、πίστιςの神学的な広がりを狭めない訳とした。
- source_word: ἄνθρωπον
  choice: 人は
  rationale: ここでは男性に限定されない総称的用法なので、日本語の「人」で代表的・普遍的な意味を表した。
- source_word: χωρὶς
  choice: …とは別に
  rationale: 律法の行いからの分離・除外を示しつつ、何が無用かという範囲を過度に解釈しない表現とした。
- source_word: ἔργων νόμου
  choice: 律法の行い
  rationale: パウロ特有の句との対応を保ち、「善行一般」や「律法が命じる行為」など一つの解釈に限定しなかった。
theological_decisions:
- issue: δικαιοῦσθαιの意味合い
  choice: 義とされる
  alternative: 義と認められる
  rationale: 本文では伝統的で簡潔な受動表現を保ち、神の宣告という法廷的含意を明示する訳を脚注に示して、語義上の緊張を残した。
- issue: 総称的なἄνθρωπονの訳
  choice: 人は
  alternative: 一人の人が
  rationale: 原語は文法上男性形だが、この文脈では人間一般を指す。日本語の「人」は性別を不必要に限定せず、原意を自然に伝える。
- issue: ἔργων νόμουの範囲
  choice: 律法の行い
  alternative: 律法を行うこと
  rationale: 何を「律法の行い」に含めるかを本文で狭く規定せず、原語の定型的な表現を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての簡潔さと品位を保った。「私たちは」を明示し、γάρは文末の「からです」で前節との論理的つながりを表した。
