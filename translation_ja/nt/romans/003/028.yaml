- from: 私たちは、人は律法の行いとは別に、信仰によって義とされる[a]と考えるからです。
  to: というのも、私たちは、人が律法の行いとは別に、信仰によって義とされる[a]と考えるからです。
  rationale: 語彙的・神学的な選択は維持した。γάρの説明的機能を「というのも」で明示し、ἄνθρωπονを従属節の主語「人が」として、明瞭で自然な日本語に整えた。
