  text: whose mouth is full of cursing and bitterness.
translation:
  language: ja
  text: その口は、呪いと苦々しさに満ちている。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: その
  rationale: 属格の関係代名詞は前文の人々を受ける。日本語では独立した関係節を不自然に作らず、「その口」としてつながりを明示するのが自然である。
- source_word: τὸ στόμα
  choice: 口
  rationale: 発せられる言葉を表す比喩を保ち、単数形も原文どおり維持する。
- source_word: ἀρᾶς
  choice: 呪い
  rationale: 人に災いを願う発言という語義を簡潔に表す。「のろい」という表記も可能だが、本文の格調と明瞭さを考慮して漢字表記とした。
- source_word: πικρίας
  choice: 苦々しさ
  rationale: 「苦味」よりも、人を傷つける辛辣で敵意ある言葉の性質を自然に伝えつつ、語の比喩を保つ。
- source_word: γέμει
  choice: 満ちている
  rationale: 現在形の状態と、「いっぱいである」という原語の意味を自然で格調ある日本語で表す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、詩的引用としての簡潔さと格調を保った。前後の文脈に従属する関係節なので、「その」により先行する人々との結びつきを示した。
