  text: δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: ja
  text: メシア・イエス[b]にある贖いを通して、神の恵みによって、無償で義と認められます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「義と宣言される」。
    reason: lexical_alternative
  - marker: b
    text: 伝統的な訳では「キリスト・イエス」。
    reason: alternative_rendering
lexical_decisions:
- source_word: δικαιούμενοι
  choice: 義と認められるのです
  rationale: 現在受動分詞の法廷的な意味を保ちつつ、日本語では前節から続く文として自然に読める述語形にした。「義とされる」も可能だが、「義と認められる」は宣告の含意を明確に伝える。
- source_word: δωρεὰν
  choice: 無償で
  rationale: 功績や代価によらず、贈り物として与えられることを簡潔に表す。
- source_word: τῇ αὐτοῦ χάριτι
  choice: 神の恵みにより
  rationale: αὐτοῦの指示対象を文脈上の神として明示し、χάριςにはパウロ書簡で定着した「恵み」を用いた。
- source_word: ἀπολυτρώσεως
  choice: 贖い
  rationale: 代価を伴う解放という語感を保つ、聖書語として定着した訳語。
- source_word: Χριστῷ Ἰησοῦ
  choice: メシア・イエス
  rationale: Χριστόςを称号として「メシア」と訳し、語順も保持した。日本語で広く定着した「キリスト・イエス」は脚注に示す。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにある
  rationale: 前置詞句が「贖い」を限定し、その贖いがイエスにおいて存在することを、解釈を狭めずに表した。
theological_decisions:
- issue: パウロの義認表現
  choice: 義と認められる
  alternative: 義とされる
  rationale: δικαιόωの法廷的・宣告的な力を示しつつ、義が人の内にどのように生じるかという後代の教理的論争を本文で決着させない。
- issue: Χριστόςの称号性
  choice: メシア・イエス
  alternative: キリスト・イエス
  rationale: ここでもΧριστόςの「油注がれた者」という称号性を保持する。伝統的な日本語表現は脚注に残す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文が前節から続く分詞句であることを踏まえ、日本語では「のです」で文脈上の連続を示した。「無償で」「恵みにより」「贖いを通して」の関係を原文に沿って保持した。
