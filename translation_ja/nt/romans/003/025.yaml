id: ROM.3.25
reference: Romans 3:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: ja
  text: 神はこの方を、その血への信仰を通して贖いをもたらすいけにえ[a][c]として、公に示されました。これは、以前に犯された罪を見過ごしておられたことについて、ご自分の義[b]を示すためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「なだめの供え物」とも訳せます。また、旧約聖書の背景から「贖いの座」、すなわち契約の箱の金の蓋を指すとも考えられます。
    reason: ἱλαστήριονの犠牲、なだめ、贖いの座という解釈範囲を保持するため。
  - marker: b
    text: 「正しさ」または「公正」とも訳せます。
    reason: δικαιοσύνηが神の義だけでなく、その公正さを強調し得るため。
  - marker: c
    text: 「信仰を通して、その血によって贖いをもたらすいけにえとして」と理解することもできます。
    reason: διὰ πίστεωςとἐν τῷ αὐτοῦ αἵματιの係り受けには構文上の曖昧さがあるため。
lexical_decisions:
- source_word: ὃν προέθετο ὁ θεός
  choice: 神はこの方を……として、公に示されました
  rationale: 先行するキリストを受ける関係代名詞ὃνを「この方」とし、προέθετοの文脈上の公然たる提示という意味を自然な日本語で表した。
- source_word: ἱλαστήριον
  choice: 贖いのいけにえ
  rationale: 罪を贖う犠牲という機能を平明に示しつつ、「なだめの供え物」と「贖いの座」という主要な解釈を一方的に確定しない訳語とした。別解は脚注に保持した。
- source_word: διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι
  choice: その血への信仰を通して
  rationale: διὰ πίστεωςを「信仰を通して」、ἐν τῷ αὐτοῦ αἵματιを信仰の対象として取る一般的な構文理解を本文に採用した。修飾関係の曖昧さは脚注に残した。
- source_word: εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ
  choice: ご自分の義を示すため
  rationale: 目的を表すεἰςを自然に示し、δικαιοσύνηにはパウロ書簡で一貫性のある「義」を用いた。
- source_word: διὰ τὴν πάρεσιν
  choice: 見過ごしておられたため
  rationale: πάρεσιςが完全な赦免そのものではなく、それまで処罰せずに過ぎ越すことを指す点を表すため、「赦し」ではなく「見過ごす」とした。
- source_word: τῶν προγεγονότων ἁμαρτημάτων
  choice: 以前に犯された罪
  rationale: 完了分詞の時間的先行性を明瞭で自然な日本語にした。
theological_decisions:
- issue: ἱλαστήριονの解釈
  choice: 贖いのいけにえ
  alternative: なだめの供え物／贖いの座
  rationale: 犠牲による贖いという中心的機能を読みやすく示しながら、神に向かう「なだめ」と契約の箱の蓋を指す七十人訳的背景のいずれか一つに限定しない。
- issue: διὰ πίστεως ἐν τῷ αὐτοῦ αἵματιの係り受け
  choice: その血への信仰を通して
  alternative: 信仰を通して、その血によって
  rationale: 本文ではἐν句を信仰の対象と取ったが、キリストの血を贖いの手段とする構文理解もギリシア語上可能なので脚注に示した。
- issue: δικαιοσύνηの意味領域
  choice: 義
  alternative: 正しさ／公正
  rationale: パウロ書簡における用語上の連続性を保つため「義」としたが、この文脈では神の公正さが前景化する可能性を脚注に残した。
- issue: πάρεσιςと罪の赦しの関係
  choice: 見過ごすこと
  alternative: 処罰を猶予すること
  rationale: 完全な赦しを意味するἄφεσιςと同一視せず、以前の罪にただちに裁きを下さなかったという時間的・法廷的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神とキリストへの敬意は「この方」「ご自分」で表した。「贖い」は聖書的な重みを保つため採用し、「いけにえ」は一般読者にも理解しやすい表記とした。原文が一文であることを尊重しつつ、日本語で長く不自然になるのを避けるため二文に分けた。
