id: ROM.3.19
reference: Romans 3:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: ja
  text: 私たちは知っています。律法の言うことはすべて、律法のもとにいる人々[a]に語られています。それは、すべての口がふさがれ[b]、全世界が神に対して責任を負う者となる[c]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「律法の中にいる人々」。ここでは、律法の適用と権威のもとにいる人々を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「すべての口が閉ざされ」。弁明の余地がなくなることを表す法廷的な比喩です。
    reason: lexical_alternative
  - marker: c
    text: 別訳「神に申し開きをすべき者となる」「神の裁きを受ける立場となる」、または「神の前で有罪となる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: 私たちは知っています
  rationale: 共有された確かな認識を表す現在形として訳した。δέはここで強い逆接を示さないため、日本語で不自然な接続語を補わず、文脈上のつながりに委ねた。
- source_word: ὅσα ὁ νόμος λέγει
  choice: 律法の言うことはすべて
  rationale: ὅσαの包括性を「すべて」で示し、νόμοςを特定の権威ある律法として「律法」とした。
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: 律法のもとにいる人々
  rationale: 直訳は「律法の中にいる人々」だが、律法の適用範囲・権威のもとにあることを自然な現代日本語で表した。直訳は脚注に残した。
- source_word: λαλεῖ
  choice: 語られています
  rationale: 先のλέγει（「言う」）との語の違いを保ちつつ、律法の言葉が対象者に向けられていることを表した。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的を明確に示す自然な構文とした。ただし文脈上、結果の含みも排除しない。
- source_word: πᾶν στόμα φραγῇ
  choice: すべての口がふさがれ
  rationale: 弁明できず沈黙させられる法廷的な比喩を、具体的な「口」の表現を保って訳した。
- source_word: ὑπόδικος γένηται
  choice: 責任を負う者となる
  rationale: 神の法廷で申し開きを求められ、裁きに服する法的状態を示す。「有罪となる」と断定して原語以上に判決を前面化することは避け、γένηταιの変化の意味を「となる」で保った。
- source_word: πᾶς ὁ κόσμος
  choice: 全世界
  rationale: 人類全体に及ぶ包括的範囲を簡潔に保った。
- source_word: τῷ θεῷ
  choice: 神に対して
  rationale: ὑπόδικοςに伴う与格を反映し、責任を負う相手が神であることを明示した。
theological_decisions:
- issue: ὑπόδικοςが示す神の裁きの法的強さ
  choice: 全世界が神に対して「責任を負う者となる」
  alternative: 全世界が神の前で有罪となる／神の裁きを受ける立場となる
  rationale: この語は神の法廷における責任と裁きへの服従を示すが、それ自体を最終的な有罪判決とだけ訳すと意味を狭めるおそれがある。法的緊張を保ちながら、判決を先取りしない表現を選んだ。
- issue: ἵναの目的と結果の関係
  choice: 「それは……ためです」と目的を前面に出す
  alternative: こうして……となります
  rationale: ἵναの基本的な目的用法を保った。ただし律法が語ることによって実際に沈黙と責任が生じるという結果的含意も、日本語の文脈から読み取れる形にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「律法」「全世界」など聖書本文で定着した語を用いつつ、長い一文を二文に分けて読みやすくした。法廷的な比喩と原文の包括性を保持し、特定の教派的解釈は加えていない。
