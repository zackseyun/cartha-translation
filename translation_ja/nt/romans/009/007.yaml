    issue: 「すべてが子どもなのでもありません」の否定表現
    rationale: 「～なのでもありません」はこの文脈では不自然です。οὐδέ以下は「…だからといって、皆が子どもなのではない」という追加的否定として訳すのが明瞭です。
  - severity: medium
    issue: 引用部で「子孫」が主語として明示されていない
    rationale: κληθήσεταιの主語はσπέρμαです。現行の「あなたの子孫と呼ばれる」は、文脈上主語が省略されているだけでなく、「誰かがあなたの子孫と呼ばれる」とも読めます。「あなたの子孫が呼ばれる」とする必要があります。
  - severity: low
    issue: 注の別訳「立てられる」
    rationale: 「立てられる」はκαλέωの語義から一段踏み込んだ解釈です。原文の幅を示す注としては、「呼ばれる」を維持した「イサクを通して、あなたの子孫が呼ばれる」がより安全です。
