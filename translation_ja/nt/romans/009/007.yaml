review_pass:
  verdict: revise
  source_fidelity: 主文はοὐδέの追加的否定、σπέρμαの集合的意味、τέκναの性別を限定しない表現、ならびに創世記21章12節からの引用を概ね忠実に伝えています。ただし、引用部のσπέρμαはκληθήσεταιの主語であるため、日本語でも「あなたの子孫が」と明示する必要があります。
  naturalness: 「すべてが子どもなのでもありません」は現代日本語として不自然で、「皆が子どもなのではありません」が自然です。また引用部も主語を補うことで、意味と文法が明瞭になります。
  terminology: 「アブラハム」「子孫」「子ども」は適切です。「呼ばれる」はκαλέωの受動形を保つ安全な訳です。「認められる」は本文には入れず注で可能性として示す扱いが妥当です。
  issues:
