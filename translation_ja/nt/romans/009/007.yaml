revisions:
- from: また、アブラハムの子孫だからといって、すべてが子どもなのでもありません。むしろ、「イサクにおいて、あなたの子孫と呼ばれる」[a]とあります。
  to: また、アブラハムの子孫であるからといって、皆が子どもなのではありません。むしろ、「イサクにおいて、あなたの子孫が呼ばれる」[a]とあります。
  rationale: 追加的否定を自然な現代標準日本語に整え、引用の主語であるσπέρμαを「あなたの子孫が」と明示しました。これにより、原文の構文と曖昧さを保ちつつ、主語が不明確になる問題を解消します。注の別訳から解釈的な「立てられる」を外し、ἐνの取り方だけを示す訳に改めました。
