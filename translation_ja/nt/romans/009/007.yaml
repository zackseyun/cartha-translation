id: ROM.9.7
reference: Romans 9:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδ’ ὅτι εἰσὶν σπέρμα Ἀβραάμ, πάντες τέκνα, ἀλλ’· Ἐν Ἰσαὰκ κληθήσεταί σοι σπέρμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: ja
  text: また、アブラハムの子孫であるからといって、皆が子どもなのではありません。むしろ、「イサクにおいて、あなたの子孫が呼ばれる」[a]とあります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イサクを通して、あなたの子孫が呼ばれる」。直訳は「イサクにおいて、あなたの子孫が呼ばれる」。ここで「呼ばれる」は、子孫として名づけられる、または認められるという意味にも取れる。創世記21章12節参照。
    reason: 原文の前置詞ἐνと動詞καλέωが持つ幅、および旧約引用とのつながりを示すため。
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: また、…だからといって、…のでもありません
  rationale: 前節から続く追加の否定と理由節の関係を、現代日本語で論理が明確になる形にした。
- source_word: σπέρμα Ἀβραάμ
  choice: アブラハムの子孫
  rationale: σπέρμαの集合的用法を自然な日本語で表し、単なる一個の「種」という誤解を避けた。
- source_word: πάντες τέκνα
  choice: すべてが子ども
  rationale: τέκναの性別を限定しない語義を保ち、誰の子どもかは文脈に委ねた。
- source_word: ἀλλ’
  choice: むしろ
  rationale: 先行命題を訂正する鋭い対照を自然に示す。
- source_word: Ἐν Ἰσαὰκ
  choice: イサクにおいて
  rationale: 創世記引用のἐνを形式的に保持し、イサクを通して、またはイサクの系統において、という含意を一義的に確定しない。
- source_word: κληθήσεταί σοι σπέρμα
  choice: あなたの子孫と呼ばれる
  rationale: 未来受動の「呼ばれる」を保ち、系譜として認められるという解釈を本文に織り込まない。σοιは日本語では所有表現として自然に処理した。
theological_decisions:
- issue: 肉的な血統と子どもとしての身分との関係
  choice: アブラハムの子孫であることと、すべてが「子ども」であることを区別する
  alternative: 「神の子ども」または「契約の子ども」と本文で明示する
  rationale: この節自体はτέκναとだけ述べているため、後続文脈の説明を先取りせず、区別そのものを保持した。
- issue: 創世記21章12節の引用の意味
  choice: 「イサクにおいて、あなたの子孫と呼ばれる」
  alternative: 「イサクを通して生まれる者が、あなたの子孫と認められる」
  rationale: 原文の「において」と「呼ばれる」を残し、系譜的指定という含意を説明的な本文で確定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「子孫」を用いてσπέρμαの集合的意味を自然に表し、引用部は原文の曖昧さを保つためやや形式的な表現とした。
