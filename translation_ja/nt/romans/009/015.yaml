source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: ja
  text: というのは、神はモーセにこう言っておられます。「わたしは、わたしがあわれもうと思う者をあわれみ、わたしがいつくしもうと思う者をいつくしむ。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 出エジプト記33章19節からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: モーセに
  rationale: λέγειの間接目的語である与格を、自然な日本語で「モーセに」とした。
- source_word: γὰρ
  choice: （直訳せず、文脈上の説明関係で表現）
  rationale: 前節の主張の根拠を導く接続詞だが、単独節として自然な現代日本語にするため「というのは」を置かず、引用導入の流れに含ませた。
- source_word: λέγει
  choice: 神は…言っておられます
  rationale: ギリシア語では主語が明示されないが、出エジプト記33:19の引用文脈では話者は神である。現在形の引用定式を「言っておられます」で保った。
- source_word: Ἐλεήσω / ἐλεῶ
  choice: あわれもうとする者をあわれみ
  rationale: 同じ動詞の反復を保ちつつ、ὃν ἂνと接続法が作る不定的表現を、日本語として自然な「…ようとする者」で表した。
- source_word: οἰκτιρήσω / οἰκτίρω
  choice: いつくしもうとする者をいつくしむ
  rationale: 前半のἐλεέωとの語彙上の区別と、原文の反復・並行構造を保った。「同情する」よりも神の深い慈愛を表す自然で品位ある語を選んだ。
theological_decisions:
- issue: 引用導入部の話者
  choice: 「神は…言っておられます」と明示する
  alternative: 「聖書はモーセに言っています」または主語を省く
  rationale: 動詞の主語は原文に明記されないが、引用元では神がモーセに直接語っている。引用文脈に基づく明示であり、特定の教派的解釈を加えるものではない。
- issue: 神のあわれみといつくしみにおける自由
  choice: 「…ようとする者を…」という反復を保つ
  alternative: 「わたしが選ぶ者を…」と説明的に訳す
  rationale: 原文にない「選ぶ」を補わず、強い反復と神学的緊張をそのまま残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発言には品位ある敬語を用いた。引用内部では原文の二つの動詞を「あわれむ」「いつくしむ」と訳し分け、反復と並行を保持した。
