  naturalness: 「というのは、神はモーセにこう言っておられます」は明瞭な現代標準日本語です。引用内では「わたしが…しようと思う者」として、意志の主体が神であることを自然に明示します。
  terminology: ἐλεέωは「あわれむ」、οἰκτίρωは「いつくしむ」と訳し分け、両句それぞれの反復を維持します。「神」は引用元と文脈から安全に明示でき、引用導入の現在形は「言っておられます」で反映されています。
