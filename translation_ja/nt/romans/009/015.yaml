  rationale: 「わたしが」を両方の関係節に補い、憐れみと慈しみの行為・意志の主体が引用話者であることを明確にした。これは原文の一人称動詞と不定関係節の構文を正確に反映するためであり、「選ぶ」などの解釈的な語は加えていない。冒頭に「というのは」を置いてγάρの論理的機能を保持した。
