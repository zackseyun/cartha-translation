  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: ja
  text: というのも、これは約束の言葉だからです。「この時に、わたしは来る[a]。そして、サラに男の子が生まれる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしは戻って来る」。ここでギリシア語本文は「来る」だが、背景となる創世記の表現を踏まえて「戻って来る」と訳すこともある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: 約束の
  rationale: 属格を「言葉」にかかるものとして自然に表し、文脈における神の約束という主題を保つ。
- source_word: λόγος
  choice: 言葉
  rationale: ここでは引用される発言そのものを指すため、簡潔で格調も保てる「言葉」とする。
- source_word: γὰρ
  choice: というのも、…からです
  rationale: 直前の主張を説明する論理的つながりを、現代日本語で明確に示す。
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: この時に
  rationale: 指定された成就の時を示す句として原文に近く訳し、「定めの時」などの解釈的補足は加えない。
- source_word: ἐλεύσομαι
  choice: わたしは来る
  rationale: 動詞ἔρχομαιの通常の意味を優先する。創世記背景に基づく「戻って来る」も可能性として脚注に示す。
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: サラに男の子が生まれる
  rationale: 直訳的には「サラに息子がある」となる所有構文だが、この約束の文脈では自然な日本語で誕生を表す。
- source_word: Σάρρᾳ
  choice: サラ
  rationale: 日本語聖書で定着した人名表記を用いる。
- source_word: υἱός
  choice: 男の子
  rationale: 男性の子を明示する語であり、約束の文脈で自然な日本語となる。
theological_decisions:
- issue: アブラハムへの約束の引用と神の主体性
  choice: 神の直接話法として、ローマ書のギリシア語どおり「わたしは来る」と訳す。
  alternative: 創世記の背景を前面に出して「わたしは戻って来る」と訳す。
  rationale: パウロの論証における神の約束とその主体性を保ちつつ、引用先の翻訳伝統よりローマ書本文の語形を優先する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説明を導くγὰρは「というのも、…からです」で自然に表した。引用は簡潔で荘重さを保ち、原文にない神学的説明は加えていない。
