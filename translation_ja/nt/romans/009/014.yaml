  text: Τί οὖν ἐροῦμεν; μὴ ἀδικία παρὰ τῷ θεῷ; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/014.yaml
  text: What then shall we say? Is there injustice with God? Certainly not![a][b]
translation:
  language: ja
  text: では、何と言うべきでしょうか。神の側に不正があるのでしょうか。[a] 決してそんなことはありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不義」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では直訳すると「決してそうなりませんように」。強い否定を表す慣用句で、「断じてありません」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: では、何と言うべきでしょうか
  rationale: パウロが推論や反論を導入する定型的な問い。未来形の熟慮的なニュアンスを、自然な現代日本語で表した。
- source_word: μὴ ἀδικία
  choice: 不正があるのでしょうか
  rationale: μήが否定の答えを予期する修辞疑問であることを疑問文として表現し、ἀδικίαの道徳的・法的意味を明瞭な「不正」で伝えた。
- source_word: παρὰ τῷ θεῷ
  choice: 神に
  rationale: この句は神の側に、あるいは神において不正があるかを問う。日本語では「神に不正がある」が簡潔で自然であり、神の行為を説明的に限定しすぎない。
- source_word: μὴ γένοιτο
  choice: 決してそんなことはありません
  rationale: 強い拒絶を、古風すぎない品位ある現代日本語で表した。字義的には願望表現だが、慣用的には断固とした否定である。
theological_decisions:
- issue: 神の不正をめぐる反論を、特定の予定論や選びの体系で補足するか
  choice: ギリシア語本文どおり、神に不正があるかという問いとその強い否定だけを訳す。
  alternative: 「神は不公平なのでしょうか」のように神の公平性へ解釈的に絞る、または選びや遺棄について説明を加える。
  rationale: 本文は反論と否定を簡潔に提示しており、その神学的緊張を保つため、選び、遺棄、公平性について本文にない説明を加えない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。パウロの修辞的な問いと断固とした否定の力を保ちつつ、古風な言い回しや教派的な解釈の付加を避けた。
