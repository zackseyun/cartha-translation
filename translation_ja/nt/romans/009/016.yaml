  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: ja
  text: したがって[a]、それは、意志する人にも走る人[b]にもよるのではなく、あわれみを示す神によるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「それゆえ、それは意志する人のものでも、走る人のものでもなく、あわれみを示す神のものです」。ギリシア語は省略的で、「それは」が何を指すかは、神の目的とあわれみについて述べる文脈から補われます。
    reason: lexical_alternative
  - marker: b
    text: 「走る」は、人間が努力することや懸命に励むことの比喩と考えられますが、ギリシア語は文字どおりには「走る」です。
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: したがって
  rationale: 二つの推論的な小辞が、直前の議論から導かれる結論を示す。現代日本語で自然かつ明瞭に論理関係を表す。
- source_word: τοῦ θέλοντος
  choice: 意志する人
  rationale: 冠詞付き現在分詞の実体詞的用法を保ち、単なる願望よりも意志・意欲の含みを伝える。
- source_word: οὐδὲ τοῦ τρέχοντος
  choice: 走る人によるのでもなく
  rationale: τρέχω の具体的な『走る』という比喩を本文に残す。文脈上は人間の努力や奮闘を含意しうる。
- source_word: ἀλλὰ
  choice: …ではなく
  rationale: 前二項と神との強い対照を、自然な日本語の『…ではなく』で示す。
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: あわれみを示す神による
  rationale: 分詞の能動的な意味を保ち、神をあわれみの行為によって描く。
- source_word: implied predicate/expression
  choice: それは…による
  rationale: 原文には主語または支配語が明示されないため、『それは』という非特定的な受け方を用い、救い・選びなどに限定せず文脈に委ねる。
theological_decisions:
- issue: 省略された主語と『よる』ものの範囲
  choice: 本文では『それは…による』とし、何を指すかを明示しない
  alternative: 『救いは…によらない』または『神の選びは…によらない』
  rationale: ギリシア語は省略的であり、直前の文脈は神の目的とあわれみに関わる。特定の教理的範囲へ狭めず、原文の曖昧さと神学的緊張を保つ。
- issue: 人間の意志・努力と神のあわれみの対照
  choice: 意志する人、走る人、あわれみを示す神という三つの分詞表現を対応させる
  alternative: 『人の願いや努力ではなく、神のあわれみによる』と抽象化する
  rationale: 原文の修辞的な並行と具体的な『走る』の比喩を保持し、対照を説明しすぎない。
translation_notes:
  register: 明瞭で現代的だが品位ある常体寄りの聖書文体。神のあわれみを表す語は、日常語の同情だけに狭めないため、聖書語として定着したひらがなの「あわれみ」を採用した。原文の省略を完全には埋めず、『それは』で受けて文脈依存性を保った。
