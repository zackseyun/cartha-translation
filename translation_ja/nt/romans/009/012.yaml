  text: οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος, ἐρρέθη αὐτῇ ὅτι Ὁ μείζων δουλεύσει τῷ ἐλάσσονι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/012.yaml
  text: not from works but from the One who calls[a], it was said to her[c][b], “The older will serve the younger.”
translation:
  language: ja
  text: 行いによるのではなく、召す方によるのですが、彼女にこう告げられました。「兄が弟に仕える。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 創世記25章23節からの引用。
    reason: cross_reference
  - marker: b
    text: 「年長の者が年少の者に仕える」とも、「より大いなる者がより小さい者に仕える」とも訳せます。ここではヤコブとエサウの文脈を踏まえて「兄／弟」と訳しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἐξ ἔργων ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: 行いによるのではなく、召してくださる方によるので
  rationale: ἐκ＋属格が表す根拠・源の対比を、日本語で簡潔かつ自然な「〜による」で保持した。τοῦ καλοῦντοςは神を指す実詞的現在分詞であり、継続的な性格を損なわない「召してくださる方」とした。文が前後から続く従属的な断片であることを「ので」で示した。
- source_word: ἐρρέθη αὐτῇ
  choice: 彼女にこう告げられました
  rationale: 非人称的なアオリスト受動を保ち、ギリシア語に明示されない発話者を補わず、引用導入として自然な日本語にした。
- source_word: Ὁ μείζων … τῷ ἐλάσσονι
  choice: 兄が弟に
  rationale: 語自体には「大きい者／小さい者、上位の者／下位の者」の幅があるが、創世記25章23節のエサウとヤコブという兄弟の文脈では年長者と年少者の対比である。日本語では引用として自然で簡潔な「兄／弟」を採用した。
- source_word: δουλεύσει
  choice: 仕える
  rationale: 奴隷としての奉仕や服属を表し得るが、この引用では関係上の従属を自然に表す「仕える」が適切であり、「奴隷となる」と過度に限定しなかった。
theological_decisions:
- issue: 「行い」と「召してくださる方」の対比を、無条件の選びという教理まで明示的に敷衍するか
  choice: 原文の簡潔な対比をそのまま保持した。
  alternative: 「人の行いが理由ではなく、召す神の御心によるので」などと説明的に訳す。
  rationale: この節は行いと神の召しを明確に対比するが、より広い教理的結論は文脈から論じられるべきであり、訳文に特定の体系的解釈を付加しない。
- issue: Ὁ μείζων／τῷ ἐλάσσονιを年齢関係として訳すか、地位・大きさの曖昧さを本文に残すか
  choice: 創世記の兄弟文脈を踏まえ、本文では「兄／弟」とした。
  alternative: 「大きい者が小さい者に仕える」または「上の者が下の者に仕える」。
  rationale: 引用元では胎内の二人とそこから出る二つの民が語られており、直接の指示対象は兄弟の年長・年少関係である。ただし語の字義的な幅は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬意を表す「召してくださる方」によって神への言及を自然に示した。引用句は簡潔で格調を保ちつつ、一般読者にも理解しやすい表現とした。
