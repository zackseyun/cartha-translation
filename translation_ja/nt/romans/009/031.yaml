  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: ja
  text: しかしイスラエルは、義[a]の律法を追い求めながら、その律法には到達しませんでした。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は「正義」とも訳せる。したがって、「正義の律法」とすることもできる。
    reason: lexical_alternative
  - marker: b
    text: 「そこに達しなかった」、または、より直訳的に「律法に到達しなかった」とも訳せる。ギリシア語の表現は簡潔に圧縮されており、解釈が難しい。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰσραὴλ
  choice: イスラエル
  rationale: 固有名の標準的な音写であり、ここではパウロの議論における民族としてのイスラエルを指す。
- source_word: δὲ
  choice: しかし
  rationale: 直前に述べられた異邦人との対照を、現代日本語で明瞭に示す。
- source_word: διώκων
  choice: 追い求めながら
  rationale: 目標を熱心に追求する継続的な動きを表す。否定的な結果との関係は文脈から伝わるようにし、「にもかかわらず」のような明示的な譲歩表現は加えない。
- source_word: νόμον δικαιοσύνης
  choice: 義の律法
  rationale: 属格の関係を限定せず、義に関わる律法、義を特徴とする律法などの解釈可能性を残す。日本語には冠詞がないため、ギリシア語の非限定性を不自然な補足で固定しない。
- source_word: δικαιοσύνης
  choice: 義
  rationale: パウロ書簡の文脈に適した簡潔で定着した訳語。語彙上可能な「正義」は脚注に示す。
- source_word: εἰς νόμον
  choice: その律法には
  rationale: 繰り返された νόμον を先行する「義の律法」に受ける表現として訳しつつ、「律法の目的」のような説明的解釈は本文に持ち込まない。助詞「には」により、目標へ到達するという構文を自然に表す。
- source_word: οὐκ ἔφθασεν
  choice: 到達しませんでした
  rationale: 目指していたものに達しなかったというアオリストの否定を自然に表す。「獲得した」と意訳せず、到達の比喩を保つ。
theological_decisions:
- issue: パウロ書簡における δικαιοσύνη の訳し方
  choice: 義
  alternative: 正義
  rationale: この箇所では神の前での正しさに関わる議論とのつながりを保つ「義」が適切だが、「正義」という語彙的可能性も排除せず脚注に残す。
- issue: νόμον δικαιοσύνης の属格関係
  choice: 義の律法
  alternative: 義に至らせる律法／正しい律法
  rationale: ギリシア語は、律法と義の関係を一義的に説明していないため、目的・結果・性質のいずれかに固定する訳を避ける。
- issue: εἰς νόμον の指示対象
  choice: その律法には
  alternative: 律法には／律法の目標には
  rationale: 直前の νόμον を受ける読みを本文に採るが、ギリシア語は圧縮されており難解であるため、より直訳的な読みを脚注に示す。「律法の目標」は説明を加えすぎるので採用しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「義」「律法」というローマ書の主要語彙を保った。「追い求めながら」は自然な従属関係を示すが、原文に明示されない譲歩の意味を強く加えない。
