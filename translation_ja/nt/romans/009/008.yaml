id: ROM.9.8
reference: Romans 9:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: ja
  text: すなわち、肉による子ども[a]が神の子どもなのではなく、約束による子どもが子孫[b]と見なされるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉の子ども」。すなわち、生まれや自然的な血統による子ども。
    reason: lexical_alternative
  - marker: b
    text: 直訳「種として数えられる」。ギリシア語の「種」は、ここでは子孫を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: すなわち
  rationale: 直前の発言を説明する導入句として、簡潔で自然な現代日本語にした。
- source_word: τὰ τέκνα τῆς σαρκὸς
  choice: 肉による子ども
  rationale: σάρξの「肉」という表現を保ちつつ、ここでの血統・自然的出生との関係が日本語で伝わる形にした。
- source_word: τέκνα τοῦ θεοῦ
  choice: 神の子ども
  rationale: τέκναは男女を含むため「子ども」とし、属格関係を自然に表した。
- source_word: τὰ τέκνα τῆς ἐπαγγελίας
  choice: 約束による子ども
  rationale: 神の約束によって定められる子どもという対比を明確にし、「約束された子ども」と意味を狭めすぎないようにした。
- source_word: λογίζεται
  choice: 見なされる
  rationale: ここでは、ある資格・分類に属するものとして数えられるという受動的な意味を、自然な日本語で表した。
- source_word: εἰς σπέρμα
  choice: 子孫と
  rationale: アブラハムの系譜を論じる文脈でσπέρμαは集合的に「子孫」を指す。εἰςはλογίζεταιと結びつき、何として認定されるかを示す。
theological_decisions:
- issue: 肉による子どもと約束による子どもの対比
  choice: 自然的な血統に属する者と、約束によって子孫と認められる者との対比として訳した。
  alternative: この節だけで、個人の予定説または集団的・歴史的解釈のいずれかに限定する。
  rationale: 原文は対比を述べるが、ローマ9章をめぐる広い神学的論争をこの一節の翻訳で決着させてはいないため、その緊張を保った。
translation_notes:
  register: 明快な現代標準語を用いながら、パウロの「肉」と「約束」の対照を残した。「〜なのではなく、〜のです」により説明文としての流れと品位を保った。
