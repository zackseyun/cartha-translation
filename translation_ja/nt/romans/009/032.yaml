  - severity: low
    issue: 「行いによるかのように」の係り方
    rationale: 「行いに基づくかのように」とすることで、ὡς ἐξ ἔργωνが追い求め方の根拠を限定することを自然に示せます。脚注bも本文に合わせて改めます。
