  source_fidelity: 「追い求めた」は直前（9:31）から補う必要があり、補足自体は妥当です。しかし、ἐκ（根拠・基盤）の対比は「信仰によって／行いによる」よりも「信仰に基づいて／行いに基づく」のほうが明確に保てます。ὡςの限定も「かのように」で維持されています。
  naturalness: 現行文も理解可能ですが、「行いによるかのように追い求めた」はやや係り方が不明瞭です。「行いに基づくかのように追い求めた」とすると、現代標準語として自然で、何を根拠として追求したかが明瞭になります。「つまずきの石につまずいた」は意図的な語彙反復として許容されます。
  terminology: πίστιςを「信仰」、ἔργαを「行い」とする選択は適切です。「つまずきの石」も原文のλίθος／πρόσκομμαおよび引用・暗示の語彙を保っています。
  issues:
