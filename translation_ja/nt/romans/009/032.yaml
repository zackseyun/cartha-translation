id: ROM.9.32
reference: Romans 9:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: ja
  text: なぜでしょうか。信仰に基づいてではなく[a]、行いに基づくかのように追い求めたからです[b]。彼らは、つまずきの石につまずいたのです[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信仰によってではなく」。ギリシア語は直訳すると「信仰からではなく」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「行いによるかのように」。原文は「行いに基づくかのように」という含みを持つ。
    reason: lexical_alternative
  - marker: c
    text: イザヤ書8章14節を踏まえた表現。次節のイザヤ書28章16節も参照。
    reason: cross_reference
  - marker: d
    text: 「人をつまずかせる石」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τί;
  choice: なぜでしょうか。
  rationale: 直前の議論を受ける修辞的な問いを、簡潔で自然な現代日本語にした。
- source_word: ὅτι
  choice: 〜からです
  rationale: 問いへの理由を示す接続詞なので、日本語では文末の理由表現として訳した。
- source_word: οὐκ ἐκ πίστεως
  choice: 信仰によってではなく
  rationale: ἐκの起点・根拠の含みを、日本語として自然な「によって」で表した。「信仰に基づいてではなく」も可能なため脚注に示した。
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: 行いによるかのように
  rationale: ὡςの「かのように」という限定を保持し、単純に「行いによって」と断定することを避けた。
- source_word: ἔργων
  choice: 行い
  rationale: パウロの信仰との対比を保ちつつ、一般読者に明瞭な定訳を採用した。
- source_word: προσέκοψαν
  choice: つまずいた
  rationale: 障害物につまずく具体的な比喩をそのまま保った。
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: つまずきの石に
  rationale: λίθοςを「石」、πρόσκομμαを「つまずき」とし、動詞との語彙的な反復を保持した。
theological_decisions:
- issue: 信仰と行いの対比における πίστις の意味
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: この箇所では、義を追い求める根拠として行いと対比されるパウロ的概念を表すため「信仰」が最も適切である。「忠実さ」に限定する文脈上の必要はない。
- issue: ὡς が示す限定
  choice: 行いによるかのように
  alternative: 行いによって
  rationale: 原文は単に行いを根拠としたと言い切らず、ὡςによって「かのように」と表現しているため、その神学的・修辞的緊張を残した。
translation_notes:
  register: 明瞭で格調ある現代標準語。「なぜでしょうか」と「〜からです」でパウロの問答の流れを自然に示した。目的語と動詞「追い求めた」は前節から補っており、文脈上の省略を日本語で明らかにした。すべての脚注記号を本文中に配置した。
