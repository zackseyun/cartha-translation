id: ROM.9.21
reference: Romans 9:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: ja
  text: それとも、陶器師には粘土に対する権限があり、同じ練り土から、一方を尊い器に、他方を卑しい器に造ることができるのではありませんか。[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「陶器師には粘土に対する権利がある」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「同じ土のかたまりから」または「同じ一塊から」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「一方を尊い用途の器に、他方を日常用の器に」とも訳せる。
    reason: alternative_reading
  - marker: d
    text: この比喩は、イザヤ書29章16節、45章9節、エレミヤ書18章1–6節など、旧約聖書の陶器師と粘土の箇所を思い起こさせる。
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: それとも
  rationale: 直前の議論を受けて次の修辞疑問を導く接続語として、余分な強調を加えず自然に訳した。
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: 意のままにする権限があり、…造ることができるのではありませんか
  rationale: ἐξουσίαは単なる能力ではなく、正当に行使できる権限を表す。日本語として自然になるよう、粘土に対する権限と造る行為を結び付けた。
- source_word: ὁ κεραμεὺς
  choice: 陶器師
  rationale: 粘土を成形して器を造る職人を明確に表し、預言書の陶器師と粘土の比喩にも対応する。
- source_word: τοῦ πηλοῦ
  choice: 粘土を意のままにする
  rationale: ἐξουσίαに続く属格を、粘土に対して権限を持つ関係として自然な日本語で表した。
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: 同じ一塊から
  rationale: φύραμαは混ぜ合わされた一まとまりの塊を指す。陶器の文脈に合い、同一の材料であることを保つ。
- source_word: ποιῆσαι
  choice: 造る
  rationale: 陶器師が器を作るという文脈では「造る」が自然であり、成形の含意も無理なく伝える。
- source_word: ὃ μὲν ... ὃ δὲ
  choice: 一つを…もう一つを
  rationale: 二つの対照的な器を示す相関構文を、明瞭で自然な日本語にした。
- source_word: εἰς τιμὴν
  choice: 尊いものとする
  rationale: τιμήの尊敬・名誉・高い評価という意味を保ち、用途だけに限定しない表現とした。
- source_word: σκεῦος
  choice: 器
  rationale: 陶器師の比喩に最も自然で、聖書的な響きを保ちながら現代日本語でも明瞭である。
- source_word: εἰς ἀτιμίαν
  choice: 卑しいものとする
  rationale: ἀτιμίαをτιμήとの対照として訳し、「日常用」などの機能的解釈に限定しないようにした。
theological_decisions:
- issue: 陶器師のἐξουσίαを、神の主権と人間の責任をめぐる議論の中でどう表すか
  choice: 権限
  alternative: 権利／力
  rationale: 単なる能力より正当な裁量を示す語として「権限」を用い、決定論や自由意志について本文以上の結論を持ち込まず、パウロの議論にある緊張を保った。
- issue: εἰς τιμὴν／εἰς ἀτιμίανを用途として明示するか、尊卑の対照として保つか
  choice: 尊いものとする器／卑しいものとする器
  alternative: 尊い用途の器／日常用の器
  rationale: 原文は機能を明示せず、τιμήとἀτιμίαの尊卑・名誉不名誉の対照を置くため、その開かれた比喩を維持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、修辞疑問の丁寧さと聖書本文にふさわしい格調を保った。「尊い／卑しい」は原文の名誉・不名誉の対照を反映し、用途に限定する解釈は脚注に示した。
