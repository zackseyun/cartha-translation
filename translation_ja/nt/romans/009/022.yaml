id: ROM.9.22
reference: Romans 9:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ θέλων ὁ θεὸς ἐνδείξασθαι τὴν ὀργὴν καὶ γνωρίσαι τὸ δυνατὸν αὐτοῦ ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ σκεύη ὀργῆς κατηρτισμένα εἰς ἀπώλειαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/022.yaml
  text: But what if God[a], wanting to display his wrath and make known his power, endured with great patience vessels of wrath prepared for destruction[c][b],
translation:
  language: ja
  text: しかし、もし神が、御怒りを示し、その力を知らせようと望み、大いなる忍耐をもって、滅びのために整えられた怒りの器を耐え忍ばれたのだとすれば[a][b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しかし、もし」とも訳せる。ギリシア語では、ここから始まる修辞的な条件文が次節へ続いている。
    reason: lexical_alternative
  - marker: b
    text: 「滅びのために整えられた」という受動表現は、誰が整えたのかを明示していない。神の行為、自らの頑なさ、または裁きを受ける状態にあることのどれを意味するかについては、解釈が分かれる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、もし……のだとすれば
  rationale: 次節まで続く修辞的な条件文として訳し、この節だけで文を完結させない。
- source_word: θέλων
  choice: 望みながら
  rationale: 神の意図・願いを表す現在分詞を、主動詞との関係を断定しすぎない形で保持する。
- source_word: ἐνδείξασθαι τὴν ὀργὴν
  choice: 御怒りを示し
  rationale: 神の裁きにかかわるὀργήの重みを「御怒り」で表し、目的的に現す意味を自然に伝える。
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: その力を知らせようと
  rationale: τὸ δυνατόνは字義的には「力あるもの／可能なこと」だが、文脈では神の力を指すため、明瞭な日本語とする。
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: 深い忍耐をもって耐え忍ばれた
  rationale: 忍耐の大きさと、対象を長く耐えて受け止める主動詞の意味を、自然で荘重な日本語で表す。
- source_word: σκεύη ὀργῆς
  choice: 怒りの器
  rationale: 直前の陶器師と器の比喩を保ち、属格の意味を説明的に限定しない。
- source_word: κατηρτισμένα εἰς ἀπώλειαν
  choice: 滅びのために整えられた
  rationale: 完了受動分詞の結果的状態を表しつつ、誰が整えたのかを補わない。εἰςは方向・帰結を含む「ために」とした。
theological_decisions:
- issue: κατηρτισμέναの受動態が示す行為者
  choice: 「整えられた」とし、行為者を明示しない。
  alternative: 「神によって滅びのために整えられた」「滅びにふさわしい状態になった」「自ら滅びに備えた」
  rationale: ギリシア語本文は行為者を明記していないため、神の行為、自らの頑なさ、裁きに備わった状態のいずれかに決めない。
- issue: εἰで始まる未完の条件構文
  choice: 「しかし、もし……のだとすれば」と訳し、読点で次節へ続ける。
  alternative: この節だけで直接的な断定文として完結させる。
  rationale: 22–23節にまたがるパウロの宙づりの構文と修辞的緊張を保持する。
- issue: θέλωνと主動詞ἤνεγκενの関係
  choice: 「望みながら」として付帯的な分詞のまま訳す。
  alternative: 「望んでいたので」「望んでいたにもかかわらず」
  rationale: 分詞が理由・譲歩などのどの関係を担うかは明示されていないため、一つに固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「御怒り」「器」「滅び」によって文脈の法廷的・陶器的比喩と荘重さを保持した。敬語は神を主語とする述語に限定して自然に用いた。節末は次節への構文上の継続を示すため読点とした。
