id: ROM.9.27
reference: Romans 9:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: ja
  text: しかし、イザヤはイスラエルについてこう叫んでいます。「たとえイスラエルの子ら[a]の数が海の砂のようであっても[b]、残りの者が救われます[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子孫」または「イスラエル人」とも訳せる。ギリシア語は直訳すると「イスラエルの子ら」で、伝統的な契約共同体の呼称。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「もしイスラエルの子らの数が海の砂のようであるなら」。ここでは文脈上、譲歩の意味に理解できる。
    reason: alternative_reading
  - marker: c
    text: 「救い出されます」とも訳せる。この表現は、生き残る者について語るイザヤの預言を響かせている。
    reason: cross_reference
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 前の議論を受けつつ、イザヤの証言へと論旨を転じる緩やかな対照を示す。
- source_word: κράζει
  choice: こう叫んでいます
  rationale: κράζωの力強さと現在形の生き生きした語調を保ち、引用が続くことも自然に示す。
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: イスラエルについて
  rationale: ここでは擁護を表す「イスラエルのために」より、預言の対象を示す「イスラエルについて」が文脈に適する。
- source_word: Ἐὰν ᾖ
  choice: たとえ…であっても
  rationale: 形式上は条件節だが、イスラエルの数の多さと救われる残りの者との対照を示す譲歩的な働きを自然な日本語で表す。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: イスラエルの子ら
  rationale: 伝統的・契約的な集団呼称の形を保つ。「イスラエルの子孫」「イスラエル人」とも訳せるため注記する。
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: 海の砂のよう
  rationale: 聖書的な比喩を簡潔で自然な日本語として保持する。
- source_word: τὸ ὑπόλειμμα
  choice: 残りの者
  rationale: 災いや裁きを経て残される一群を指す預言的概念を、現代日本語で明瞭に表す。原文に明示されない「だけ」は本文に補わない。
- source_word: σωθήσεται
  choice: 救われます
  rationale: ローマ書の文脈における救いの重みを保ちつつ、イザヤ書の背景にある「救い出される」という含みは注で示す。
theological_decisions:
- issue: Ἐὰν ᾖ の条件節の意味
  choice: 譲歩として「たとえ…であっても」
  alternative: 字義的な条件として「もし…なら」
  rationale: 引用の要点である、大きな総数と残りの者との対照を明確にする一方、脚注で形式的な条件訳も保持する。
- issue: τὸ ὑπόλειμμα に限定を表す「だけ」を補うか
  choice: 「残りの者が」とし、「だけ」を補わない
  alternative: 「残りの者だけが」
  rationale: 定冠詞付きの主語は残りの者を特定するが、限定を表す μόνος はない。含意を過度に明文化せず、原文の緊張を保つ。
- issue: σωθήσεται の訳語
  choice: 「救われます」
  alternative: 「救い出されます」
  rationale: パウロの救済史的文脈に適し、特定教派の解釈を加えずに神学的な重みを保つ。預言本文における解放・救出の響きは脚注に残す。
translation_notes:
  register: 明瞭な現代標準語を用い、預言の力強さにふさわしい品位を保った。引用内は日本語として自然な丁寧体にそろえた。
