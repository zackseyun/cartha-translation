id: ROM.9.11
reference: Romans 9:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: ja
  text: というのも、二人がまだ生まれておらず、善いことも悪いことも[a]何一つ行っていない時に、選びに基づく神の目的[b]が保たれる[c]ために、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「善いことも卑しいことも」または「善いことも邪悪なことも」とも訳せる。ギリシア語φαῦλονは、悪いもの、卑しいもの、道徳的に邪悪なものを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「神の選びの目的」または「神の選びによる目的」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「存続する」または「立ち続ける」。ギリシア語の動詞は「とどまる、存続する」を意味し、ここでは揺るがず有効であり続ける含みを持ち得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω ... γεννηθέντων
  choice: まだ生まれず
  rationale: μήπωの「まだ……ない」という時間的意味と、属格独立構文の時間関係を、自然な日本語で表した。文脈上の双子を明示するため「二人が」とした。
- source_word: μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον
  choice: 善いことも悪いことも何一つ行っていない
  rationale: 対をなすἀγαθόνとφαῦλονを明瞭に保ち、μηδέとτιを日本語の「……も何一つ……ない」で自然に表した。
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: 選びに基づく神の計画
  rationale: κατάの関係を「に基づく」で見える形にし、ἐκλογήを特定の教派的説明に置き換えず「選び」と訳した。πρόθεσιςは意図された方針・目的を示すため「計画」とした。
- source_word: μένῃ
  choice: 存続する
  rationale: μένωの基本的な「とどまる、存続する」という意味を保ち、神の計画が引き続き有効であるとの文脈に適した表現とした。
- source_word: ἵνα
  choice: ために
  rationale: 目的を表す構文として訳しつつ、より広い予定論上の結論を訳文に持ち込まなかった。
- source_word: γὰρ
  choice: というのも
  rationale: 前節を説明する接続関係を、現代日本語で自然に示した。
theological_decisions:
- issue: ἵνα節が示す目的と結果の関係
  choice: 「ために」として目的の意味を保つ
  alternative: 「その結果……となるように」と結果寄りに訳す
  rationale: 構文上は目的の理解が自然だが、この一節だけで予定論をめぐる立場を決着させるような説明は加えない。
- issue: ἐκλογήの訳語
  choice: 選び
  alternative: 選定／選びの行為
  rationale: パウロ書簡における神学的な重みを保ちながら、日本語として理解しやすく、選びの仕組みや根拠を訳文で限定しない。
- issue: 未完結の文構造
  choice: 読点で終え、次節に続く形を保つ
  alternative: 「ためでした」と補って一文を完結させる
  rationale: 原文ではἵνα節の内容が次節へ続くため、本節だけで述語を補わず、原文の連続性と緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの論証にふさわしい端正さを保った。節単独では文が完結しない原文の構造を維持し、次節へ続く読点で結んだ。
