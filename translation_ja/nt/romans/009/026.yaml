id: ROM.9.26
reference: Romans 9:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: ja
  text: そして、彼らに「あなたがたはわたしの民ではない」と言われたその場所で、彼らは生ける神の子らと呼ばれることになる。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子ら」――ギリシア語は男性複数形で、直訳すれば「息子たち」。ここでは神の子としての身分を表す。
    reason: lexical_alternative
  - marker: b
    text: ホセア1:10（七十人訳では2:1）からの引用。神の民ではなかった者が神の民として回復されることを語る。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節から引用を続ける単純な接続として、推論の意味を加えず自然につなぐ。
- source_word: ἔσται ἐν τῷ τόπῳ οὗ
  choice: その場所で
  rationale: 直訳的な「その場所において、そこで」を避けつつ、同じ場所での逆転を後続の文脈とともに明確にする。
- source_word: ἐρρέθη αὐτοῖς
  choice: 彼らに…と言われた
  rationale: アオリスト受動態を保ち、語り手を補わない。
- source_word: Οὐ λαός μου ὑμεῖς
  choice: あなたがたはわたしの民ではない
  rationale: ホセア書に由来する契約的な「わたしの民」という表現をそのまま保ち、現代日本語の自然な語順にする。
- source_word: ἐκεῖ κληθήσονται
  choice: 彼らは…と呼ばれる
  rationale: ἐκεῖの場所の強調は「その場所で」に統合し、κληθήσονταιの未来受動の意味を日本語では文脈上未来を表せる非過去受動形で示す。行為者は原文どおり明示しない。
- source_word: υἱοὶ
  choice: 子ら
  rationale: 引用元の七十人訳でもυἱοίが用いられるが、日本語の「息子たち」は男性だけを指す意味が強くなりやすい。「子ら」は神との子としての関係を保ちつつ、代表的複数の範囲を不当に男性に限定しない。原語が男性複数形であることは注記する。
- source_word: θεοῦ ζῶντος
  choice: 生ける神の
  rationale: 聖書的でありながら理解可能な定着表現で、命ある神と偶像との対照を保つ。
theological_decisions:
- issue: υἱοὶの代表的複数の訳し方
  choice: 子ら
  alternative: 息子たち
  rationale: 語形は男性複数だが、この文脈で神の民とされる者を男性だけに限定するとは読めない。日本語の「子ら」は包含範囲を保ち、神の子としての身分も表す。原語上の情報と「息子たち」という別訳は脚注に残す。
- issue: λαός μουの契約的意味
  choice: わたしの民
  alternative: わたし自身の民
  rationale: ホセア書の契約回復の定型表現を簡潔に保持し、所有・帰属の意味を過度に強めない。
- issue: κληθήσονταιの行為者
  choice: 呼ばれる
  alternative: 神に呼ばれる
  rationale: 神が暗黙の行為者である可能性は高いが、ギリシア語本文は行為者を明示しないため補わない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、聖書語として定着した「生ける神」と、契約的な「わたしの民」を保持した。引用の荘重さを保ちながら、過度に文語的な表現は避けた。
