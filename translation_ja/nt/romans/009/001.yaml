id: ROM.9.1
reference: Romans 9:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: ja
  text: 私はメシア[a]にあって真実を語ります。偽りを言っているのではありません。私の良心が、聖霊[c]にあって、私とともにそのことを証ししています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語 Χριστός は、「メシア」という称号としても、「キリスト」という固有名のようにも用いられる。
    reason: lexical_alternative
  - marker: b
    text: または「私の良心が私とともに証ししているとおり」。
    reason: lexical_alternative
  - marker: c
    text: 「聖なる霊にあって」とも訳し得るが、パウロの用法では、ここは神の聖霊を指すと考えるのが最も自然である。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: 真実を語っており
  rationale: 「真実を語る」という慣用的な意味を自然な現代日本語で表し、続く否定とのつながりも保った。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: Χριστόςの称号としての意味を「メシア」で示し、ἐνを道具的意味に限定せず「にあって」とした。
- source_word: οὐ ψεύδομαι
  choice: 偽りは言いません
  rationale: 強い自己否定を明瞭かつ品位ある日本語で表した。
- source_word: συμμαρτυρούσης μοι
  choice: 私とともに証ししています
  rationale: 接頭辞 συν-が示す共同・同意の意味を保持し、分詞の付帯状況を独立した自然な節で表現した。
- source_word: τῆς συνειδήσεώς μου
  choice: 私の良心
  rationale: パウロ書簡における συνείδησις の標準的で明瞭な訳語を採用した。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 聖霊にあって
  rationale: パウロの用法で最も自然な神の聖霊への言及を本文に採りつつ、ἐνを「によって」と道具的に限定しなかった。
theological_decisions:
- issue: πνεύματι ἁγίῳ の指示対象
  choice: 神の聖霊
  alternative: 聖なる霊、すなわちパウロ自身の霊または聖められた内的態度
  rationale: 無冠詞ではあるが、パウロの語法とこの厳粛な証言の文脈では神の聖霊を指す理解が最も自然である。ただし別解は脚注に残した。
- issue: Χριστός の称号性
  choice: メシア
  alternative: キリスト
  rationale: 油注がれた者という称号性を明示するため「メシア」とし、日本語で定着した「キリスト」も脚注に示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「にあって」は原文の ἐν が持つ関係・領域の幅を保つため採用した。文末は単独節として読めるよう句点を置いたが、内容上は次節へ続く厳粛な前置きである。
