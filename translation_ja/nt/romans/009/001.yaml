  to: 私はメシア[a]にあって真実を語ります。偽りを言っているのではありません。私の良心が、聖霊[c]にあって、私とともにそのことを証ししています[b]。
  rationale: 原文の二つの現在形による厳粛な断言を、自然な日本語の並行文として整えた。属格絶対の良心の証言は独立文で明示し、συμμαρτυρούσης μοιの「私とともに」を保持した。「そのこと」は証言内容、すなわち直前の真実の主張を指す日本語上の補足であり、意味を追加しない。本文の「メシア」と「聖霊」、および両者に関する代替理解は維持した。
