id: ROM.9.30
reference: Romans 9:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: ja
  text: では、何と言えばよいでしょうか。義を追い求めていなかった異邦人[b]が、義[a]を得た――信仰から来る義[c]を、ということです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は、文脈により「正しさ」または「正義」とも訳せる。ここで繰り返されるギリシア語には、道徳的・法的な正しさや、契約にかかわる正義という意味の幅がある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「諸国民」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「信仰による義」。可能性は低いが、「忠実さから来る義」とも解し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: では、何と言えばよいでしょう
  rationale: パウロの論証における移行の問いとして、未来形の熟慮的な響きを自然な現代日本語で表した。
- source_word: ἔθνη
  choice: 異邦人
  rationale: ここではイスラエルとの対比に置かれた非ユダヤ人を指すため、「諸国民」より文脈が明確になる。別訳は脚注に示した。
- source_word: τὰ μὴ διώκοντα
  choice: 追い求めていなかった
  rationale: 現在分詞が示す継続的・特徴的な姿勢を表し、後の追求の語彙とのつながりも保った。
- source_word: δικαιοσύνην
  choice: 義
  rationale: パウロ書簡における法的・倫理的・契約的な広がりを狭めずに保てる、日本語聖書で定着した簡潔な訳語である。
- source_word: κατέλαβεν
  choice: 得た
  rationale: ここでは、追い求めていなかったものを実際に獲得したという意味。「達した」より自然で、「捕らえた」の物理的響きを避ける。
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: しかも、信仰から来る義を得た
  rationale: 反復された「義」が、その種類を具体化する同格的な働きを明示する。δὲは強い対立と断定せず、説明を際立たせる「しかも」とした。
- source_word: πίστεως
  choice: 信仰
  rationale: この構文では「忠実さ」より信頼・信仰の意味が適切であり、ἐκは「から来る」として起点の含みを保った。
theological_decisions:
- issue: δικαιοσύνηの意味の幅
  choice: 本文では「義」とし、特定の教理的仕組みに限定しない
  alternative: 正義、神の前で正しいとされる立場、契約共同体に属する身分
  rationale: この節自体は義の内実を一つの体系にまで限定していないため、パウロ的な意味の幅を保つ。
- issue: ἐκ πίστεωςの解釈
  choice: 「信仰から来る」と訳す
  alternative: 信仰による、信仰に基づく、忠実さから来る
  rationale: ἐκの起点を表す性質を残し、「信仰のみ」のような本文にない教理的拡張を避ける。
- issue: δὲの談話上の機能
  choice: 「しかも」で、得た義の種類を際立たせる
  alternative: しかし、すなわち
  rationale: ここでは二種類の義を単純に対立させるより、直前の「義」を「信仰から来る義」と特定する働きが中心である。ただし軽い転換・強調は保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「義」は本文で一貫して反復し、原文の修辞を保持した。「ということです」により問いへの応答として自然に結んだ。
