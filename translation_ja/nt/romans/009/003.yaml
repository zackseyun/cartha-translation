  to: というのも、私は、肉による、すなわち血統上の同胞である私の兄弟たちのためなら、自分自身が呪われた者となり、メシアから引き離されることを願いたいと思うほどなのです。[a][b]
  rationale: 潜在的・反実的な願望を日本語でより直接に示すため、「〜となってもよいとさえ願うほど」を「〜ことを願いたいと思うほど」と改めた。あわせて、呪いとメシアからの分離を原文の順序に近く表し、血統上の同胞という同格関係を明瞭にした。脚注は原文の表現上の幅とκατὰ σάρκαの非倫理的・非比喩的な意味を適切に保持しているため維持した。
