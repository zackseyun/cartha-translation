id: ROM.9.3
reference: Romans 9:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: ja
  text: というのも、私は、肉による、すなわち血統上の同胞である私の兄弟たちのためなら、自分自身が呪われた者となり、メシアから引き離されることを願いたいと思うほどなのです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアから呪われた者」、または「呪いのもとに置かれ、メシアから離された者」とも訳せる。ギリシア語の表現には、呪いとメシアからの分離という意味が重なっている。
    reason: lexical_alternative
  - marker: b
    text: 「肉による」とは、ここでは肉体的な血統、すなわち民族上のつながりを意味し、「罪深い性質」という意味ではない。「兄弟たち」はパウロと同じイスラエル民族に属する人々を指す。
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: ηὐχόμην
  choice: 願うほどなのです
  rationale: 未完了過去形を単純な過去の願望とはせず、文脈上の反実的・潜在的な願いと、その強い心情を自然な日本語で表した。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の発言を説明する論理的なつながりを明確にする。
- source_word: ἀνάθεμα
  choice: 呪われた者
  rationale: 神の呪いのもとに置かれるという重い意味を、現代日本語で分かりやすく保つ。
- source_word: αὐτὸς ἐγώ
  choice: 私自身
  rationale: 重ねられた代名詞によるパウロ自身への強調を保持する。
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: メシアから引き離され
  rationale: ἀπόの分離の意味を明示し、Χριστόςの称号としての意味を「メシア」で示す。ἀνάθεμαとの関係は解釈で一方に限定しすぎないよう脚注でも補う。
- source_word: ὑπὲρ
  choice: のためなら
  rationale: 同胞の益のために自らを差し出すという受益・身代わり的な方向性を、文脈に合う自然な表現にした。
- source_word: τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα
  choice: 肉による同胞である私の兄弟たち
  rationale: 二つの同格的表現を自然に結び、ἀδελφοίを「兄弟たち」としつつ、ここでは血統・民族上の同胞を指すことを「肉による同胞」で示した。
theological_decisions:
- issue: パウロの言葉が実際の祈願か、反実的・潜在的な願いか
  choice: 「願うほどなのです」として、実際にそう祈ったとは断定しない
  alternative: 「願っていました」「祈りました」
  rationale: ηὐχόμηνの未完了過去形と文脈上の強いが実現困難な願望を保ち、パウロが文字どおりメシアからの分離を祈ったと過度に確定しない。
- issue: Χριστόςを称号として訳すか、固有名のように訳すか
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味が明瞭であり、油注がれた者というメシア的含意を表す。
- issue: κατὰ σάρκαにおけるσάρξの意味
  choice: 肉による、すなわち血統・民族上のつながり
  alternative: 罪深い性質による
  rationale: ここで論じられているのはイスラエル民族との血縁であり、罪の性質ではない。
- issue: ἀνάθεμαとἀπὸ τοῦ Χριστοῦの関係
  choice: 「メシアから引き離され、呪われた者」とし、呪いと分離の双方を表す
  alternative: 「メシアから呪われた者」
  rationale: ἀπόは通常分離を表すが、句の係り方には表現上の幅があるため、本文では自然な分離の意味を採り、別解を脚注に残す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「〜てもよいとさえ願うほど」で、原文の感情の強さと反実的な響きを両立させた。語順は日本語として自然になるよう、対象となる同胞を先に置き、呪いとメシアからの分離を一まとまりとして読めるようにした。
