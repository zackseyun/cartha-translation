id: ROM.9.29
reference: Romans 9:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: ja
  text: また、イザヤが前もって語ったとおりです。「もし万軍の主[a]が、私たちに子孫[b]を残してくださらなかったなら、私たちはソドムのようになり、ゴモラのようにされていただろう。」[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「主サバオト」。ギリシア語「サバオト」は、一般に「万軍の」または「軍勢の」と訳されるヘブライ語の神的称号を音写したもの。
    reason: lexical_alternative
  - marker: b
    text: 直訳「種」。ここでは、生き残る子孫を指す。
    reason: lexical_alternative
  - marker: c
    text: イザヤ書1章9節からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: また、……とおりです
  rationale: 前の引用とのつながりを示す καί と、対応を表す καθὼς を、自然な現代日本語で保った。
- source_word: προείρηκεν
  choice: 前もって語った
  rationale: προ- の時間的意味を保ちつつ、ここでは予言したという意味に限定せず、イザヤが聖書中ですでに述べたことを表す。完了形の現在的関連性は文脈と「とおりです」によって自然に伝わる。
- source_word: κύριος Σαβαὼθ
  choice: 万軍の主
  rationale: Σαβαώθ はヘブライ語の神的称号の音写であり、日本語で定着し意味も伝わる「万軍の主」とした。
- source_word: ἐγκατέλιπεν
  choice: 残してくださらなかった
  rationale: 基本義「残す」を保ち、主を主語とする日本語として敬意を自然に示した。「守り残す」ほど解釈を加えない。
- source_word: σπέρμα
  choice: 子孫
  rationale: 字義は「種」だが、ここでは生き残る子孫を指す。「残りの者」という神学的用語を本文に持ち込まず、人を指す自然な語を選んだ。
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: ソドムのようになり……いただろう
  rationale: ἄν を伴う反実仮想の帰結と、γίνομαι の「なる」を表した。
- source_word: καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: ゴモラのようにされていただろう
  rationale: 受動形 ὡμοιώθημεν を「ようにされる」とし、先行する ἐγενήθημεν との動詞の違いを保った。
theological_decisions:
- issue: 旧約引用中の κύριος Σαβαώθ の訳し方
  choice: 万軍の主
  alternative: 主サバオト／軍勢の主
  rationale: ギリシア語本文は κύριος に、ヘブライ語称号の音写 Σαβαώθ を続ける。「万軍の主」は意味を伝え、聖書日本語としても認識しやすい。音写のみでは一般読者に意味が伝わりにくい。
- issue: σπέρμα を「残りの者」と訳すか
  choice: 子孫
  alternative: 種／残りの者
  rationale: 文脈には残された者という主題があるが、語そのものは「種、子孫」である。本文では語義に沿い、神学的概念への言い換えを避けた。
- issue: 反実仮想の滅亡の比喩をどう保つか
  choice: ソドムのようになり、ゴモラのようにされていただろう
  alternative: ソドムやゴモラと同じになっていただろう
  rationale: 二つの比較句と異なる二動詞を保ち、引用の並行表現と緊張を平板化しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用導入は自然な叙述とし、神的称号は日本語聖書で認識されやすい「万軍の主」を採用した。反実仮想は「もし……なかったなら、……いただろう」で明示し、二つのギリシア語動詞の差を訳文に残した。
