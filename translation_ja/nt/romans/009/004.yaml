id: ROM.9.4
reference: Romans 9:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: ja
  text: 彼らはイスラエル人であり、彼らに属するのは、子とされること[a]、栄光[b]、契約の数々、律法の授与、礼拝[c]、そして約束の数々です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子とされること」は、養子として子の身分に置かれることを表します。ここでは、イスラエルが神の子として扱われる契約的な地位を指します。
    reason: lexical_alternative
  - marker: b
    text: 「栄光」は、イスラエルの間に現された神の臨在を指すと考えられます。
    reason: cross_reference
  - marker: c
    text: 神がイスラエルに定めた、祭儀を含む礼拝と奉仕のことです。
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: 彼らはイスラエル人です
  rationale: 前節の同胞について説明する関係節を、日本語として明瞭な独立文にした。民族的かつ契約史的な呼称「イスラエル人」を保持する。
- source_word: ὧν
  choice: 彼らには…が属しています
  rationale: 所有を表す属格関係代名詞の意味を、自然な現代日本語で明示する。
- source_word: υἱοθεσία
  choice: 神の子としての身分
  rationale: 養子として迎えられて子の身分を授けられるという語義を示しつつ、この文脈でのイスラエル共同体の契約的身分を表す。「養子縁組」よりも自然で、個人的救済論だけに限定しない。
- source_word: δόξα
  choice: 栄光
  rationale: ギリシア語の簡潔さと神学的な含みを保持し、本文では指示対象を説明しすぎない。
- source_word: διαθῆκαι
  choice: 契約の数々
  rationale: 複数形を明確に保ち、イスラエルに与えられた複数の契約を表す。
- source_word: νομοθεσία
  choice: 律法が授けられたこと
  rationale: 単なる「律法」ではなく、その授与・制定を指す行為名詞の意味を自然に表す。
- source_word: λατρεία
  choice: 礼拝
  rationale: 神にささげる宗教的奉仕・祭儀を含む語であり、本文では「神殿奉仕」などに過度に限定しない。
- source_word: ἐπαγγελίαι
  choice: 約束の数々
  rationale: 複数形を保持し、神がイスラエルに与えた複数の約束を表す。
theological_decisions:
- issue: υἱοθεσίαとイスラエルの関係
  choice: 神の子としての身分
  alternative: 養子縁組／子とされること
  rationale: ローマ9章4節は民としてのイスラエルに与えられた歴史的・契約的特権を列挙している。子とされた身分という比喩を保持しながら、後代の個人救済論へ限定しない。
- issue: ἡ δόξαの指示対象
  choice: 本文では「栄光」とし、注で神の現れとしての臨在である可能性を示す
  alternative: 神の栄光／栄光に満ちた臨在
  rationale: 文脈上はイスラエルの間に現された神の臨在を指す可能性が高いが、原文自体は単に「栄光」と述べるため、その神学的な幅を本文に残す。
- issue: λατρείαの範囲
  choice: 礼拝
  alternative: 祭儀／神殿奉仕
  rationale: イスラエルに定められた神への祭儀的奉仕を指すが、語そのものを神殿や祭司の働きだけに狭めない。
- issue: διαθῆκαιの数
  choice: 契約の数々
  alternative: 契約
  rationale: SBLGNTの複数形を保持し、単一の契約だけを想定する読みへ統一しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。列挙の並列性と複数形を保持し、専門的な神学語に偏りすぎないようにした。前節から続く関係節は、日本語で理解しやすいよう二文構成にした。
