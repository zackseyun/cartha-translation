id: ROM.9.17
reference: Romans 9:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: ja
  text: というのも、聖書はファラオにこう言っている。「まさにこの目的のために、わたしはあなたを立てた[a]。それは、あなたにおいてわたしの力を示し、わたしの名[b]が全地に告げ知らされるためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立てた」は、「立たせておいた」「生かしておいた」とも訳せる。出エジプト記の引用文脈では、この動詞にはファラオをその立場に置き、存続させたという幅がある。
    reason: lexical_alternative
  - marker: b
    text: ここで「名」は、単なる呼び名ではなく、神がご自身を現すことによって知られる誉れや名声を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἡ γραφή
  choice: 聖書
  rationale: 定冠詞付き単数形を、書かれた聖書が語るというパウロの擬人化を保つ自然な日本語で表した。
- source_word: λέγει ... τῷ Φαραώ
  choice: ファラオにこう言っています
  rationale: 現在形の引用表現を保ちつつ、後続する直接話法へ自然につなげた。
- source_word: γὰρ
  choice: （文脈上の説明関係として表現）
  rationale: 前節を根拠づける接続語である。単独節として不自然な「なぜなら」を機械的に置かず、「聖書は…」という説明の流れに含ませた。
- source_word: Εἰς αὐτὸ τοῦτο
  choice: まさにこの目的のために
  rationale: 目的を示す表現と αὐτό の強調を明確に保った。
- source_word: ἐξήγειρά σε
  choice: わたしはあなたを立てた
  rationale: ファラオをその立場に置いた、立たせておいたという広がりを残し、創造・誕生・単なる延命のいずれかに限定しない表現とした。
- source_word: ὅπως ... καὶ ὅπως
  choice: それは…し、…ためである
  rationale: 並列された二つの目的節を、一つの自然な日本語構文の中で保持した。
- source_word: ἐνδείξωμαι
  choice: 示し
  rationale: 神の力を公に明らかにする意味を、簡潔で現代的な語で表した。
- source_word: ἐν σοὶ
  choice: あなたの身に
  rationale: ファラオ自身に起こる事柄において神の力が示されるという意味を保ち、「あなたを通して」と手段だけに狭めることを避けた。
- source_word: τὴν δύναμίν μου
  choice: わたしの力
  rationale: δύναμις の標準的で明瞭な訳語を採用した。
- source_word: διαγγελῇ
  choice: 告げ知らされる
  rationale: 受動形と、広く公に布告される意味の双方を自然な日本語で表した。
- source_word: τὸ ὄνομά μου
  choice: わたしの名
  rationale: 字義を保ち、神がご自身を現して得られる名声・誉れという聖書的含意は脚注で補った。
- source_word: ἐν πάσῃ τῇ γῇ
  choice: 全地に
  rationale: 地域的な「国土」ではなく、文脈上の広い普遍的範囲を簡潔に表した。
theological_decisions:
- issue: ἐξήγειρά σε と神の主権、ファラオの責任との関係
  choice: 「あなたを立てた」と訳し、神がファラオをこの目的のためにその立場に置き、存続させたという幅を残した。
  alternative: 「あなたを生じさせた」「あなたを生かしておいた」「あなたを立たせた」
  rationale: 本文は神の目的と主権を明言するが、動詞が指す仕方を一つに限定してはいない。神の主権と人間の責任をめぐる緊張を、特定の教理体系によって解消しないためである。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書引用としての荘重さを保った。神の発話では「わたし」、ファラオへの呼びかけでは「あなた」を用いた。「あなたの身に」は ἐν σοὶ の曖昧さを比較的自然に保ち、手段を強調する「あなたを通して」や、刑罰だけを連想させやすい「あなたの上に」を避けた。
