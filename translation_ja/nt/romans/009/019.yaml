  text: Ἐρεῖς ⸂μοι οὖν⸃· Τί ⸀οὖν ἔτι μέμφεται; τῷ γὰρ βουλήματι αὐτοῦ τίς ἀνθέστηκεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/019.yaml
  text: You will say to me then[a], “Why then does he still find fault? For who has resisted his purpose?”
translation:
  language: ja
  text: すると、あなたは私に言うでしょう。「それなら、なぜ神はなおも人を責めるのですか。いったい誰が神の意志[a]に逆らったでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の目的」または「神の意図」とも訳せる。ギリシア語の βούλημα は、意志、意図、目的を意味しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: あなたは……言うでしょう
  rationale: 未来直説法を、パウロが予想される反論を提示する修辞的未来として自然な日本語にした。
- source_word: μοι
  choice: 私に
  rationale: 与格の間接目的語を明示した。
- source_word: οὖν
  choice: すると／それなら
  rationale: 二度現れる推論的な接続語をそれぞれ訳し、議論の展開と反論内部の論理を保った。
- source_word: Τί οὖν ἔτι μέμφεται
  choice: それなら、なぜ神はなおも人を責めるのですか
  rationale: τίを文脈上「なぜ」とし、ἔτιを「なおも」、μέμφεταιを「責める」とした。ギリシア語では主語と目的語が明示されないが、文脈上の指示対象を自然な日本語で「神」「人」と補った。
- source_word: τῷ βουλήματι αὐτοῦ
  choice: 神の意志
  rationale: βούλημαは意志・意図・目的を表しうる。ここでは日本語として自然で、反論の力を保つ「意志」を本文に採用し、別訳を脚注に示した。
- source_word: τίς ἀνθέστηκεν
  choice: いったい誰が……逆らえたでしょうか
  rationale: 完了形が示す、これまで抵抗して成し遂げた者がいるのかという修辞的問いを、日本語では可能表現を用いて自然に表した。
theological_decisions:
- issue: 神の主権と人間の責任をめぐる反論
  choice: 反論を強い修辞疑問のまま提示する
  alternative: 説明を加えて神の責任追及の正当性や人間の自由を明示する
  rationale: この節自体は緊張を解消せず、予想される反論を述べているため、特定の教理体系に沿う説明を本文へ加えなかった。
- issue: βούλημαの訳語
  choice: 神の意志
  alternative: 神の目的／神の意図
  rationale: 語義の幅を保ちつつ現代日本語で明快な表現を選んだ。「目的」に限定せず、脚注で代案を示して神学的論争を先取りしないようにした。
translation_notes:
  register: 明瞭な現代標準日本語。予想される反論であることが分かるよう丁寧体の直接話法を用い、荘重さを保ちつつ過度に古風な表現は避けた。
