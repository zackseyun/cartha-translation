id: ROM.9.25
reference: Romans 9:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: ja
  text: また、ホセア書でこう言っておられます。「わたしは、わたしの民ではない者を『わたしの民』と呼ぼう[a]。愛されなかった女を『愛された女』と呼ぼう[b]。」[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は文法上単数形ですが、「民」は集合的な意味を持ちます。したがって、「わたしの民ではなかった人々を『わたしの民』と呼ぼう」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「愛されなかった女」と「愛された女」は、原文ではともに女性単数形です。後半は完了受動の形で、「愛される女」ではなく、愛を受けた者としての「愛された女」を表します。
    reason: lexical_alternative
  - marker: c
    text: ホセア書2章23節からの引用です。章節番号は伝統によって異なる場合があります。パウロは、神が退けられていた者を回復してご自分の民とするというホセア書の言葉を、神の召しに適用しています。
    reason: cross_reference
lexical_decisions:
- source_word: ὡς καὶ
  choice: また～でも
  rationale: 先行する論述を補強する聖書引用を導く比較・添加の働きを、自然な現代日本語で表した。
- source_word: ἐν τῷ Ὡσηὲ
  choice: ホセア書でも
  rationale: 預言者本人を介するというより、ホセア書に記された箇所を指す標準的な引用表現として訳した。
- source_word: λέγει
  choice: こう言っておられます
  rationale: ギリシア語の単数形と、聖書の中で神が語る人格的な表現を保った。日本語では主語を補わず、文脈に委ねた。
- source_word: Καλέσω
  choice: わたしは～と呼ぶ
  rationale: 未来形の決定的・宣言的な響きを保ちつつ、καλέωの基本義とホセア書への言語的なつながりを直接表した。
- source_word: τὸν οὐ λαόν μου
  choice: わたしの民でなかった者
  rationale: 文法上は男性単数形だが、λαόςは集合的な『民』を指す。日本語の『者』は単数・複数を確定せず、原文の形と集合的意味の双方を保てる。
- source_word: λαόν μου
  choice: わたしの民
  rationale: 契約関係を示す定型的な聖書表現を簡潔に保った。
- source_word: τὴν οὐκ ἠγαπημένην
  choice: 愛されなかった女
  rationale: 女性単数の受動分詞を可視化し、ホセア書における女性の比喩的背景を失わないようにした。
- source_word: ἠγαπημένην
  choice: 愛される者
  rationale: 受動の意味を明確にし、現代日本語として『愛された女』よりも呼称として自然にした。『愛されている者』『愛する者』と混同しないよう受動表現を維持した。
theological_decisions:
- issue: ホセア引用における個人形と共同体的意味
  choice: 第一句を『わたしの民でなかった者』とし、日本語では数を確定しない表現にした。
  alternative: 『わたしの民でなかった人々』、または厳密な単数として『わたしの民でなかった一人』
  rationale: ギリシア語は単数形だが、『民』は集合体であり、パウロの論旨も神が一つの民を召すことに関わる。日本語で明示的な複数にも個人にも限定しないことで、その重なりを保った。
- issue: 第二句の女性単数形
  choice: 『愛されなかった女』として女性形を本文に示した。
  alternative: 性別を示さず『愛されなかった者』とする。
  rationale: 女性単数形はホセア書の婚姻・回復の比喩を反映するため、一般化して消去しない。ただしパウロによる共同体への適用は脚注で示した。
- issue: 引用を語る主体
  choice: 主語を明示せず『言っておられます』とした。
  alternative: 『神は言われます』または非人格的に『こう記されています』
  rationale: 原文の動詞は単数で、文脈上は神が語る一方、本文には『神』という名詞が明記されていない。日本語で主語を補わず、人格的発話を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部分には簡潔で荘重な調子を持たせた。神の発話には敬意を示す『言っておられます』を用いたが、原文にない主語名は補っていない。第一句の集合性と第二句の女性単数形の非対称を意図的に保持した。
