  text: ἄρα οὖν ὃν θέλει ἐλεεῖ, ὃν δὲ θέλει σκληρύνει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: ja
  text: ですから、神はご自分が望む者にあわれみを示し、ご自分が望む者をかたくなにします。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「かたくなにする」は、「強情にする」とも訳せます。ギリシア語は能動態であり、単に「かたくなになるのを許す」という意味には弱めていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: したがって
  rationale: 二つの推論を示す小辞が、直前の議論から導かれる結論を強く示しているため、現代日本語で自然かつ明確な「したがって」とした。
- source_word: ὃν θέλει
  choice: ご自分が望む者
  rationale: 神の意志を直接表す θέλει を弱めず、二つの節で同じ表現を繰り返して原文の対句的な構造を保った。
- source_word: ἐλεεῖ
  choice: あわれみ
  rationale: 人にあわれみを及ぼす行為を表す動詞として、聖書的な重みを保ちながら現代の読者にも理解しやすい表現を選んだ。
- source_word: ὃν δὲ θέλει
  choice: ご自分が望む者を
  rationale: δέ の対照は、相反する二つの述語を並べる構造そのものによって日本語でも明らかになる。原文の平行性を保つため、第一節と同じ語句を反復した。
- source_word: σκληρύνει
  choice: かたくなにされます
  rationale: 「固くする、頑なにする」という能動的な意味を保ち、単に許容するという表現には弱めなかった。日本語では神を主語とする敬語形だが、文法上の態は能動のままである。
theological_decisions:
- issue: θέλει における神の意志
  choice: 神が「ご自分が望む者」に働かれるという直接的な言い方を保持した。
  alternative: 神が人の状態を単に許容される、または人の選択に応じられるという説明を訳文に加える。
  rationale: 原文は両方の節で神の意志を明言している。予定と人間の責任の関係を訳文で解決せず、本文の神学的緊張をそのまま残した。
- issue: σκληρύνει における神の働き
  choice: 能動的に「かたくなにされます」と訳した。
  alternative: 「かたくなになるのを許されます」または「かたくななままにされます」と訳す。
  rationale: ギリシア語は能動態であり、行為を文の主語に直接帰している。許容だけを意味するように弱めることは原文を越えた解釈となる。
- issue: 明示されていない主語
  choice: 文脈に基づき「神は」を明示した。
  alternative: 日本語でも主語を省略する。
  rationale: ギリシア語では動詞の形と直前の文脈から神が主語であることが明らかである。日本語では主語を示すことで、意味を変えずに文を明瞭にした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の意志と働きを述べる箇所にふさわしい簡潔で厳粛な調子を保った。「ご自分」を加えて修飾関係を明確にし、原文の二つの節の平行性を維持した。
