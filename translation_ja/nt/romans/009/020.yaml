id: ROM.9.20
reference: Romans 9:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: ja
  text: いや、むしろ、人よ、神に口答えするあなたは、いったい何者ですか。形造られたものが、それを形造った方に、「なぜ私をこのように造ったのですか」と言うでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この疑問は、当然「言わない」という答えを予想しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: いや
  rationale: 直前の議論を受けて強く退け、訂正する語調を、簡潔で自然な現代日本語で表す。
- source_word: ὦ ἄνθρωπε
  choice: 人よ
  rationale: 単数呼格による鋭い呼びかけを保ちつつ、ここで人類を代表する一人の人間を指す包括的な用法を自然に表す。
- source_word: σὺ τίς εἶ
  choice: あなたは、いったい何者ですか
  rationale: 単なる身元の質問ではなく、神に対する人間の立場を問いただす修辞的な挑戦であるため、「いったい」で強調を示す。
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: 神に口答えする
  rationale: 中立的な返答ではなく、神に反論し逆らって答える含意を「口答え」で保つ。
- source_word: μὴ ἐρεῖ
  choice: 言うでしょうか
  rationale: μήを伴う修辞疑問が否定の答えを予期することを、日本語の文脈と疑問形によって自然に伝える。
- source_word: τὸ πλάσμα
  choice: 形造られたもの
  rationale: 造られた存在と造り手との対比を保ち、同語根の動詞とのつながりも日本語で再現する。
- source_word: τῷ πλάσαντι
  choice: それを形造った方
  rationale: 分詞が示す造り手を明示し、「形造られたもの」との語彙的対応を保つ。「方」により神を指す文脈にふさわしい敬意を示す。
- source_word: Τί με ἐποίησας οὕτως;
  choice: なぜ私をこのように造ったのですか
  rationale: οὕτωςの「このように」を保ちながら、現代日本語として明瞭で自然な問いにする。
theological_decisions:
- issue: ἄνθρωπεの代表的用法
  choice: 「人よ」と訳し、一人の人間への呼びかけと人類一般への代表的な適用をともに保つ
  alternative: 「人間よ」「男よ」
  rationale: 性別を限定する文脈ではなく、神の前にある人間を単数で呼びかけている。「人よ」が修辞的な鋭さと包括性を最も自然に両立する。
- issue: 神に対する反論の強さ
  choice: 「神に口答えする」と訳す
  alternative: 「神に答える」「神に言い返す」
  rationale: ἀνταποκρινόμενοςには単なる応答以上の対抗的含意がある。「口答えする」は被造物が神に異議を唱える不釣り合いを保つが、議論全体の意味をそれ以上に解釈しない。
- issue: 陶器と造り手の比喩における被造物と造り手の対比
  choice: 「形造られたもの／形造った方」と同じ語幹で訳す
  alternative: 「造られたもの／造り主」
  rationale: πλάσμαとπλάσαντιの意図的な語の対応を可視化し、神と人との関係について本文が示す非対称性を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの鋭い修辞的叱責と格調を保った。「人よ」は日常会話より高い文体だが、聖書本文の直接呼格として理解しやすい。
