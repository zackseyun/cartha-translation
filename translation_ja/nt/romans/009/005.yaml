id: ROM.9.5
reference: Romans 9:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: ja
  text: 父祖たちも彼らに属し、肉によれば[a]、メシアも彼らから出た方です。この方はすべてのものの上におられ、永遠にほめたたえられる神です。[b] アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人間としての出自によれば」。直訳は「肉によれば」。
    reason: lexical_alternative
  - marker: b
    text: 後半を独立した頌栄と取り、「すべてのものの上におられる神が、永遠にほめたたえられますように。アーメン」と訳すこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: 父祖たち
  rationale: イスラエルの尊ばれる先祖たちを指す。「族長たち」より範囲を狭めず、契約の歴史を背景とする表現を自然な現代日本語で保つ。
- source_word: ἐξ ὧν
  choice: 彼らからは
  rationale: 関係代名詞は同胞であるイスラエル人を受け、メシアの出自を表す。日本語として自然になるよう主題を示す「は」を添えた。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名のような用法ではなく、イスラエルに約束された称号として用いられている。
- source_word: τὸ κατὰ σάρκα
  choice: 肉によれば
  rationale: 地上の血統・人間としての出自を示すパウロ特有の表現を保ち、説明的な言い換えは脚注に置いた。ここでの「肉」は罪深い性質を意味しない。
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: この方はすべてのものの上におられ
  rationale: 冠詞付き分詞を直前のメシアに続く説明として取り、万物に対する至高性を明瞭かつ自然に表した。
- source_word: θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: 永遠にほめたたえられる神です
  rationale: θεόςをメシアへの同格的・述語的表現として取り、εὐλογητόςの受動的な称賛の意味とεἰς τοὺς αἰῶναςの永続性を自然な日本語で示した。
- source_word: ἀμήν
  choice: アーメン
  rationale: 礼拝的な確証の語として、日本語で定着した音写を用いた。
theological_decisions:
- issue: 「ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας」がメシアを説明するのか、神への独立した頌栄を始めるのか
  choice: 直前のメシアについて「この方はすべてのものの上におられ、永遠にほめたたえられる神です」と述べる節として訳した。
  alternative: 後半を独立した頌栄とし、「すべてのものの上におられる神が、永遠にほめたたえられますように」と訳す。
  rationale: 冠詞付き分詞ὁ ὢνは、直前のὁ χριστόςを受けて説明を続けると読むのが統語上自然である。一方、初期写本に現代的な句読法が明示されていないため、古くから論じられてきた独立頌栄の可能性も脚注で明記した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「父祖たち」「肉によれば」に原文の契約史的・パウロ的語感を残し、難解になり得る点は脚注で補った。主要本文ではメシアを神と呼ぶ統語的つながりを明確にしつつ、句読法に関わる真正な解釈上の幅を脚注に保存した。
