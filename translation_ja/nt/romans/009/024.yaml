  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὓς καὶ ἐκάλεσεν ἡμᾶς οὐ μόνον ἐξ Ἰουδαίων ἀλλὰ καὶ ἐξ ἐθνῶν;—
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: ja
  text: 神がまた召された者たち、すなわち私たちを[a]、ユダヤ人の中からだけでなく、異邦人[b]の中からも――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「神がまた召された者たち、すなわち私たちを」。この節は前節から続く文である。パウロは、前節で述べた「あわれみの器」が「私たち」であると示している。
    reason: 原文の語順、同格関係、および前節から続く統語関係を示すため。
  - marker: b
    text: ギリシア語では「諸国民」。ここではユダヤ人との対比により、ユダヤ人以外の人々、すなわち異邦人を指す。
    reason: 原語の字義的な訳と文脈上の意味を示すため。
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: その者たち、すなわち私たち
  rationale: 関係代名詞οὓςは前節の「あわれみの器」を受け、ἡμᾶςがそれを「私たち」と明示する。同格関係と前節とのつながりを、自然な日本語で保った。
- source_word: καὶ ἐκάλεσεν
  choice: また召してくださった
  rationale: καίの付加的な力を「また」で示し、καλέωはパウロ書簡における重要な用法を保って「召す」とした。敬語表現は神の行為を自然で品位ある日本語にする。
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: だけでなく…からも
  rationale: 二つの集団を並べる相関構文を、明瞭で自然な日本語にした。
- source_word: ἐξ Ἰουδαίων
  choice: ユダヤ人の中から
  rationale: ἐξが示す集団からの選出・出所を「の中から」で明確に表した。
- source_word: ἐξ ἐθνῶν
  choice: 異邦人の中から
  rationale: ここではユダヤ人との対比が明白なので、ἐθνῶνを一般的な「諸国民」ではなく、非ユダヤ人を指す「異邦人」とした。
theological_decisions:
- issue: 前節の「あわれみの器」と「私たち」との指示関係
  choice: その者たち、すなわち私たち
  alternative: 神が召してくださった私たち
  rationale: 原文が前節の対象をοὓςで受けてからἡμᾶςと同定する構造を残し、選びや召しについて本文以上の体系的説明を加えない。
- issue: ユダヤ人とἐθνῶνの救済史的対比
  choice: 異邦人
  alternative: 諸国民
  rationale: 直前の「ユダヤ人」と対をなすため、民族一般ではなく非ユダヤ人を指す文脈上の意味を明示した。
- issue: καλέωの神学的含意
  choice: 召す
  alternative: 呼ぶ
  rationale: 神の救いへの招きを表すパウロの語法に適しつつ、その召しの性質や効力を本文以上に規定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「召す」により聖書本文としての品位とパウロ的語彙を保持した。末尾のダッシュは、次節の引用へ文が続くことを示す。
