  text: λόγον γὰρ συντελῶν καὶ ⸀συντέμνων ποιήσει κύριος ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/028.yaml
  text: For the Lord will carry out his word on the earth[c][b][a], finishing it and cutting it short.
translation:
  language: ja
  text: 主は地上で、ご自分のことば[a]を完成させ、短くして[b]実行されるからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ことば」は、「事柄」または「判決」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「短くして」は、「切り詰めて」とも訳せる。また、含意を汲んで「速やかに実行して」と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον
  choice: ご自分のことば
  rationale: 主が語り、実現される内容を指すため、「ことば」とした。「ご自分の」は日本語で主語との関係を自然に示す補いであり、「事柄」「判決」という可能性は脚注に残した。
- source_word: γὰρ
  choice: からである
  rationale: 前節の内容に理由・根拠を与える接続関係を、日本語の文末表現で明確にした。
- source_word: συντελῶν
  choice: 完成させ
  rationale: 物事を意図された終わりまで成し遂げる意味を簡潔に表す。
- source_word: καὶ συντέμνων
  choice: 切り詰めて
  rationale: 短くする、切り上げるという比喩的な力を保ちつつ、「速やかに」と解釈だけに限定しない表現を選んだ。
- source_word: ποιήσει
  choice: 実行される
  rationale: λόγονを目的語とするため、主が語られたことを現実に行う意味を自然な日本語で表した。敬意を示す主体敬語として「される」を用いた。
- source_word: κύριος
  choice: 主
  rationale: 聖書引用において神を指す称号として、標準的な「主」を用いた。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: ローマ書のギリシア語表現の広がりを保ち、「その地で」と特定地域に狭めなかった。
theological_decisions:
- issue: イザヤ書引用における神の行為の性質
  choice: 主がご自分の語られたことを決定的に完成し、実行されることとして訳す。
  alternative: 主が司法的な判決を速やかに執行されることとして明示する。
  rationale: 文脈には裁きの含みがあり得るが、λόγοςと二つの分詞が許す意味を特定の教理的枠組みに限定せず、「ことば」「完成させ」「切り詰めて」という表現で緊張と曖昧さを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい簡潔で格調ある「である」調とした。語順は日本語として自然に整えつつ、完成・短縮・実行という原文の三つの要素を保持した。
