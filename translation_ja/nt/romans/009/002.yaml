  text: that I have great sorrow and unceasing pain in my heart[a][b][c].
translation:
  language: ja
  text: 私には大きな悲しみがあり、心には絶え間ない痛みがあります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: （日本語では明示せず）
  rationale: 前節の厳粛な言明の内容を導く接続詞。日本語では節を独立した自然な文として続けることで関係が明らかなため、接続語を補わない。
- source_word: λύπη μοί ἐστιν μεγάλη
  choice: 私には大きな悲しみがあり
  rationale: 与格とεἰμίによる経験・所有の表現を自然な日本語の「私には…がある」とし、μεγάληの強さを「大きな」で保った。λύπηは深い悲哀を表す「悲しみ」とした。
- source_word: καὶ
  choice: 、
  rationale: 二つの並行する悲嘆表現を、日本語では読点で滑らかにつないだ。
- source_word: ἀδιάλειπτος ὀδύνη
  choice: 絶え間ない痛み
  rationale: ἀδιάλειπτοςの持続性を「絶え間ない」で表し、ὀδύνηは深刻な内的苦痛を直接的な「痛み」とした。
- source_word: τῇ καρδίᾳ μου
  choice: 心には
  rationale: 字義的には「私の心に」。καρδίαを内面・感情の座としての聖書的な「心」で保ち、自然な日本語にした。
