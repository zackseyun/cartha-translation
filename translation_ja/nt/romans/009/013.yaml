  text: ⸀καθὼς γέγραπται· Τὸν Ἰακὼβ ἠγάπησα, τὸν δὲ Ἠσαῦ ἐμίσησα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/013.yaml
  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: ja
  text: 次のように書かれています。「わたしはヤコブを愛したが、エサウを憎んだ。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: マラキ書1章2～3節からの引用。
    reason: cross_reference
  - marker: b
    text: 「憎んだ」は、「退けた」または「より少なく愛した」と理解することもできる。ここで感情的な敵意ではなく、契約上退けられたこと、または比較して一方を優先することを表すと考える解釈もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: こう書かれています
  rationale: 聖書引用を導入する定型表現として、完了形の持続的な含意を損なわず、現代日本語として自然に訳した。καθὼς は文脈上、直前の論述が聖書の記述と合致することを示す。
- source_word: ἠγάπησα
  choice: 愛し
  rationale: ἀγαπάω の直接的な意味を保った。引用文におけるアオリストを、日本語では後続の「憎んだ」と自然につながる連用形で表した。
- source_word: δὲ
  choice: （対照的な並置）
  rationale: ヤコブとエサウの明確な対照は語順と二つの目的語によって十分伝わるため、不自然になり得る「しかし」を置かず、日本語の対句として表した。
- source_word: ἐμίσησα
  choice: 憎んだ
  rationale: μισέω の直接的で強い語義を本文に保持し、「退けた」「より少なく愛した」という解釈で神学的緊張を解消しないようにした。
theological_decisions:
- issue: 神の選びをめぐる議論やセム語的な比較表現を考慮して「憎んだ」を弱めるべきか
  choice: 本文では「憎んだ」を保持する
  alternative: 「退けた」または「より少なく愛した」
  rationale: ギリシア語本文は通常「憎む」を意味する μισέω を用いている。契約上の退けや比較的な愛の弱さを示す可能性は注で伝え、本文では原文の強さと神学的緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用の簡潔な対句を維持し、原文の強い表現を本文で保った。すべての注記記号を本文に明示した。
