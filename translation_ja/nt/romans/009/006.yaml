source:
  edition: SBLGNT
  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: ja
  text: しかし、神の言葉が効力を失ったということではありません。イスラエルの子孫である者が皆、イスラエルなのではないからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルから出た者」。ギリシア語の表現は、出自や系譜を示します。
    reason: lexical_alternative
  - marker: b
    text: 二度目の「イスラエル」は、最初の「イスラエル」と区別された、より限定的な意味で用いられています。この節だけでは、その正確な範囲は明示されていません。
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: しかし、〜ということではありません
  rationale: 直前の嘆きから生じうる推論を否定する訂正表現として、原文の回りくどさを避けつつ論理を明確にした。
- source_word: ἐκπέπτωκεν
  choice: 効力を失った
  rationale: 完了形が示す結果的状態を表し、神のことばが無効になった、あるいは成就しなかったという文脈上の意味を自然に伝える。単なる「落ちた」は日本語では意味が通りにくい。
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: 神のことば
  rationale: 「約束」と限定せず、神が語ったことば全般を指しうるλόγοςの幅を保持した。
- source_word: οὐ γὰρ πάντες
  choice: 皆〜なのではないからです
  rationale: γάρによる前文の理由説明を「からです」で明示し、全称否定の意味を自然な日本語で表した。
- source_word: οἱ ἐξ Ἰσραήλ
  choice: イスラエルから出た者
  rationale: ἐξが示す出自・由来を保ち、「子孫」と明示して解釈を狭めすぎない表現を選んだ。
- source_word: οὗτοι Ἰσραήλ
  choice: イスラエル
  rationale: 原文の簡潔で鋭い同定表現を保ち、「属する」などの説明を加えず、二つの「イスラエル」の意味の緊張を残した。
theological_decisions:
- issue: 二度目の「イスラエル」の意味
  choice: 本文では同じ「イスラエル」を反復し、第一の用例より限定された意味であることだけを脚注で示す
  alternative: 「真のイスラエル」「選ばれたイスラエル」などと本文で明示する
  rationale: パウロは肉的・民族的出自と、神の救済目的におけるより限定された意味のイスラエルを区別しているが、その正確な範囲をこの節だけで特定すると、本文以上の神学的結論を持ち込むことになるため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発言・約束を指す「ことば」と、反復される「イスラエル」の荘重さを保持した。脚注記号は関連箇所である節末にまとめた。
