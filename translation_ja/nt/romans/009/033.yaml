- from: 「見よ、わたしはシオンに、つまずきの石、妨げとなる岩を置く。彼に信頼する者は、恥を受けることがない」と書かれているとおりです。[a][b]
  to: 次のように書いてあるとおりです[a]。 「見よ、わたしはシオンに、つまずきの石、人をつまずかせる岩を据える。彼を信じる者は、辱めを受けることがない[b]。」
  rationale: 原文の引用導入の順序を反映しつつ、日本語として自然な構文に整えました。σκανδάλου のつまずかせる機能を明示し、πιστεύω の訳語を標準的な「信じる」に改めました。「辱めを受けることがない」により、καταισχυνθήσεται の未来受動態と恥辱の語義を保っています。αὐτῷ の人格的・比喩的な指示対象の両方の可能性は脚注に保持しています。
  reviewer_model: gpt-5.6-terra
