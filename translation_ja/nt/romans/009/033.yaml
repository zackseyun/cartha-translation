id: ROM.9.33
reference: Romans 9:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: ja
  text: 次のように書いてあるとおりです[a]。 「見よ、わたしはシオンに、つまずきの石、人をつまずかせる岩を据える。彼を信じる者は、辱めを受けることがない[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: パウロはここでイザヤ書8章14節と28章16節を組み合わせて引用しています。
    reason: cross_reference
  - marker: b
    text: 「彼を」は、比喩上は「その石を」とも訳せますが、パウロの文脈ではこの石の比喩はメシアに当てはめられています。「辱めを受けることがない」は「失望することがない」とも訳せます。
    reason: lexical_and_referential_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: 書かれているとおりです
  rationale: 聖書引用を導入する定型句として、完了した記述が現在も権威を持つ含意を自然な現代日本語で表す。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を促す指示的な力を保ちつつ、聖書引用にふさわしい簡潔で dignified な表現とした。
- source_word: τίθημι
  choice: 置く
  rationale: 現在形を保ち、石を据える建築的イメージにも自然に合う。
- source_word: ἐν Σιὼν
  choice: シオンに
  rationale: 場所を示す ἐν を、日本語として自然な助詞「に」で表した。
- source_word: λίθον προσκόμματος
  choice: つまずきの石
  rationale: 属格構文と、人をつまずかせる石という比喩を簡潔に保つ。
- source_word: πέτραν σκανδάλου
  choice: 妨げとなる岩
  rationale: 直前の「つまずき」と不必要に重複させず、σκανδάλου の「陥らせるもの・妨げ」の意味を明瞭にする。
- source_word: ὁ πιστεύων
  choice: 信頼する者
  rationale: 単なる事実認定ではなく、対象に身を委ねる πιστεύω の含意を文脈に即して表し、分詞の一般的単数も保持する。
- source_word: ἐπ’ αὐτῷ
  choice: 彼に
  rationale: ἐπί の方向・依拠の感覚を「彼に信頼する」で表し、男性形代名詞とパウロの文脈における人格的適用を保持する。
- source_word: οὐ καταισχυνθήσεται
  choice: 恥を受けることがない
  rationale: 未来受動形と名誉・恥の含意を保ち、「失望しない」と解釈的に狭めない。
theological_decisions:
- issue: 複合されたイザヤ引用における αὐτῷ の指示対象
  choice: 「彼に」と人格的に訳す
  alternative: 「それに」と訳し、文法上「石」を受ける
  rationale: 比喩上の先行詞は石である一方、男性形 αὐτῷ とローマ9:32–33、10:11の文脈はメシアへの人格的適用を支える。ただし石の比喩との関係は脚注で明示し、曖昧さを隠さない。
- issue: καταισχυνθήσεται の結果の捉え方
  choice: 「恥を受けることがない」
  alternative: 「失望することがない」
  rationale: 終末的に期待を裏切られない含意はあり得るが、本文では受動態と恥の語義を直接保持する。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、引用内の「見よ」と神の一人称「わたし」で聖書本文としての品位を保った。「つまずきの石」と「妨げとなる岩」は並行性を維持しながら語義の差も示す。すべての脚注記号を本文末に配置した。
