  text: οὐ μόνον δέ, ἀλλὰ καὶ Ῥεβέκκα ἐξ ἑνὸς κοίτην ἔχουσα, Ἰσαὰκ τοῦ πατρὸς ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: ja
  text: それだけではありません。リベカもまた、一人の男性、すなわち私たちの父祖イサクによって身ごもりました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「一人から〈性交／受胎〉を得ていて」。κοίτηは本来「床」を意味しますが、ここでは性交、ひいては受胎を婉曲に表しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: それだけではありません。……もまた
  rationale: パウロが先の例に次の例を加える相関表現を、論旨のつながりが明瞭な現代日本語で表した。
- source_word: Ῥεβέκκα
  choice: リベカ
  rationale: 聖書人物名として日本語で広く定着している表記を用いた。
- source_word: ἐξ ἑνός
  choice: ただ一人の人……によって
  rationale: 直訳は「一人から」だが、文脈上は一人の男性を指す。単一性を示す語感を「ただ一人」で保った。
- source_word: κοίτην ἔχουσα
  choice: 身ごもりました
  rationale: 字義的には「床／性交を持つ」という婉曲的な表現であり、ここでは性交による受胎を意味するため、自然で品位ある日本語とした。
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: 私たちの父祖イサク
  rationale: 属格の同格的関係を明らかにし、πατήρ の祖先としての意味を日本語で誤解なく伝えた。
theological_decisions:
- issue: パウロの選びに関する議論の中で、受胎・性交の婉曲表現をどこまで明示するか
  choice: リベカがただ一人の人、父祖イサクによって身ごもったと訳す
  alternative: 「私たちの父イサクという一人から床を持った」と字義的に訳す、または「一人によって身ごもった」とだけ訳す
  rationale: 原文の婉曲表現を不自然に直訳せず、リベカの子らが同じ父を持つという論旨を明確にする一方、子どもや双子を本文に明示して原文以上に限定することは避けた。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「父」では実父と誤解され得るため、祖先を指す文脈に合わせて「父祖」とした。
