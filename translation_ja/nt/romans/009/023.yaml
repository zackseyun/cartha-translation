  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: ja
  text: また、ご自分の栄光の豊かさを、栄光のためにあらかじめ備えておられたあわれみの器に示すためでもあった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἵνα γνωρίσῃ
  choice: また、…示すためであった
  rationale: ἵνα の目的を明示しつつ、前節から続く統語関係を保った。γνωρίζω はここでは「知らせる／明らかにする」の意で、自然な日本語として「示す」とした。
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: ご自分の栄光の豊かさ
  rationale: 属格関係を保持し、神を指す αὐτοῦ は敬意を込めて「ご自分の」とした。
- source_word: ἐπὶ σκεύη ἐλέους
  choice: あわれみの器に
  rationale: ἐπί＋対格が示す対象・方向を日本語の「に」で表した。「器」という比喩は文脈上重要なので保持した。
- source_word: ἃ προητοίμασεν
  choice: あらかじめ…備えておられた
  rationale: προ- の先行性を「あらかじめ」で明示した。動詞の主語は神であり、原文どおり能動形を保った。
- source_word: εἰς δόξαν
  choice: 栄光にあずかるように
  rationale: 直訳的な「栄光へ」では日本語として不明瞭なため、目標・帰結を示す εἰς を「栄光にあずかるように」と自然に表現した。
theological_decisions:
- issue: 「あらかじめ備えた」の主体と対象
  choice: 神が「あわれみの器」をあらかじめ備えたという原文の能動表現を維持
  alternative: 主体をぼかして「あらかじめ備えられていた」とする
  rationale: προητοίμασεν は三人称単数能動で、文脈上の主体は神である。予定論上の含意を加筆も弱化もせず、その非対称的な表現を保存した。
- issue: ἐπὶ σκεύη ἐλέους の関係
  choice: 栄光の豊かさを「あわれみの器に」示す
  alternative: 「あわれみの器のために」示す
  rationale: ἐπί の意味幅は認めつつ、ここでは顕示が向けられる対象として読むのが自然であり、「に」は目的・恩恵だけに限定せず原文の関係を簡潔に表せる。
translation_notes:
  register: 明瞭な現代標準日本語。パウロの「器」の比喩と、神が前もって備えるという神学的緊張を保ち、過度に教派的な用語は避けた。単独節として読めるよう述語を補いつつ、冒頭の「また」で前節との連続性を示した。
