translation:
  language: ja
  text: だれが神に選ばれた者たちを告発できるでしょうか。義と認めてくださるのは神です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίς
  choice: だれが
  rationale: 修辞疑問を導く疑問代名詞を、直接的で自然な現代日本語にした。
- source_word: ἐγκαλέσει κατὰ
  choice: を訴えるでしょうか
  rationale: ἐγκαλέω と κατά の組み合わせが持つ法廷的な『告発する、訴えを起こす』という意味を保った。未来形は文脈上、単なる未来予告ではなく、挑戦的な修辞疑問として訳した。
- source_word: ἐκλεκτῶν θεοῦ
  choice: 神に選ばれた者たち
  rationale: 属格 θεοῦ は選びの主体を表すと理解し、後代の専門用語に寄りかからず、実質的な意味を明瞭に示した。
- source_word: θεὸς ὁ δικαιῶν
  choice: 義と認めてくださるのは神です
  rationale: 前置された θεός の強調と、ὁ δικαιῶν の継続的・特徴的な働きを自然な日本語で表した。δικαιόω の法廷的意味は『義と認める』で示した。敬語は神の行為について自然で品位ある日本語とするために用いた。
theological_decisions:
- issue: ἐκλεκτῶν θεοῦ の表現
  choice: 神に選ばれた者たち
  alternative: 神の選民／神の選ばれた者たち
  rationale: 『選民』は集団的・専門的な含意を強め得るため避け、神が選んだ者たちという本文の意味を透明に表した。
- issue: θεὸς ὁ δικαιῶν の統語と句読法
  choice: 義と認めてくださるのは神です。
  alternative: 神が義と認めてくださるのですか。／神こそ義と認める方です。
  rationale: ギリシア語には動詞が省略され、句読法も原文写本そのものには確定的でないため、直前の問いへの断定的な答えとして読む一般的な理解を本文に採用し、疑問文として読む可能性は脚注に残した。
- issue: δικαιῶν の意味
  choice: 義と認めてくださる
  alternative: 義とする／正しいと宣告する
  rationale: パウロの法廷的な語感を保ちつつ、神が正しい身分を認定・宣告することを現代日本語で理解しやすく表した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。法廷を背景とする『訴える』『義と認める』を用い、神学的専門語の過度な持ち込みを避けた。
