id: ROM.8.4
reference: Romans 8:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: ja
  text: それは、肉[b]に従ってではなく、霊[c]に従って歩む私たちのうちに、律法の正しい要求[a]が満たされるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「律法の要求」。
    reason: lexical_alternative
  - marker: b
    text: ここで「肉」とは、神に背を向けた人間の性質や生き方を指す。意訳して「罪深い性質」とすることもできる。
    reason: lexical_alternative
  - marker: c
    text: この文脈では「霊」は聖霊を指す可能性が高い。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ～ためでした
  rationale: 目的・結果を表す節として自然な日本語にし、前節の神の行為を受ける構文を保った。
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: 律法の正しい要求
  rationale: δικαίωμα がここでは律法の正当な要求を指すと理解し、法的・倫理的な響きの双方を表した。
- source_word: πληρωθῇ
  choice: 満たされる
  rationale: アオリスト受動接続法の受動態を保ち、誰が満たすかを本文で付加しなかった。
- source_word: ἐν ἡμῖν
  choice: 私たちのうちに
  rationale: ἐν を直截に反映し、「私たちによって」として人間の行為主体性を過度に読み込むことを避けた。
- source_word: περιπατοῦσιν
  choice: 歩む
  rationale: 生き方を表すパウロの比喩を保持し、文脈上も理解可能な自然な表現とした。
- source_word: σάρξ
  choice: 肉
  rationale: パウロの語彙とその多義性を保ち、「罪深い性質」のような解釈的言い換えは脚注に置いた。
- source_word: πνεῦμα
  choice: 御霊
  rationale: ローマ8章の文脈では聖霊を指す可能性が高いため「御霊」としたが、原語自体にある解釈の余地は脚注で示した。
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: 肉に従ってではなく、御霊に従って
  rationale: κατά の規範・方向性を表す反復を「～に従って」で明確に保った。
theological_decisions:
- issue: πνεῦμαが人間の霊を指すか、聖霊を指すか
  choice: 御霊
  alternative: 霊
  rationale: ローマ8章全体では聖霊の働きと支配領域が強調されるため本文では「御霊」とした。ただし、語形そのものだけでは「霊」も可能なので脚注に残した。
- issue: ἐν ἡμῖνが「私たちのうちに」か「私たちによって」か
  choice: 私たちのうちに
  alternative: 私たちによって／私たちの間で
  rationale: 前置詞ἐνをそのまま反映し、律法の要求を満たす主体について本文以上の主張を加えないようにした。
- issue: δικαίωμαの意味
  choice: 正しい要求
  alternative: 要求／定め
  rationale: 文脈では単独の規定より律法の正当な要求が意図されると判断したが、より簡潔な訳語の可能性を脚注に示した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「御霊」は聖書文体として一般読者にも通じる範囲で用い、「歩む」という原文の生活比喩を保持した。脚注記号は参照対象により近づけるため、本文では「正しい要求[a]」「肉[b]」「御霊[c]」に付す形も編集上可能だが、提示稿では節末にまとめている。
