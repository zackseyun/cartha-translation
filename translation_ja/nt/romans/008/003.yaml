revisions:
- from: 律法にはできないことがありました[a]。人の肉のために律法が弱くなっていたからです。そこで神は、ご自分の御子を罪ある肉と同じ姿で、また罪のために遣わし、その肉において罪を断罪されました[b][c][d]。
  to: 律法が肉のゆえに弱くてなし得なかったことを、神は成し遂げられました。すなわち、ご自分の御子を罪深い肉に似た姿で遣わし、また罪のために遣わして、肉において罪を断罪されたのです[a][b][c][d]。
  rationale: 律法がなし得なかったことを神が行われたという文の主対比を明示しつつ、πέμψας（遣わし）とκατέκρινε（断罪された）の関係を保ちました。「肉」を両箇所で維持し、最終句への所有代名詞の補足を除くことで、原文の指示対象に関する余地を保存しました。περὶ ἁμαρτίαςは本文では広い「罪のために」とし、犠牲祭儀的理解は脚注に留めています。
