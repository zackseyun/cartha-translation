    rationale: τὸ γὰρ ἀδύνατον τοῦ νόμουは、後続する神の行為との対照の中で理解されます。「律法にはできないことがありました。そこで神は」とすると、その「こと」を神が行われたという関係が弱まります。
  - severity: medium
    issue: 「その肉において」がἐν τῇ σαρκίを過度に限定している
    rationale: ギリシア語には所有表現がありません。文脈上御子の肉を読むことは有力ですが、本文に「その」を補うと指示対象を確定します。
  - severity: low
    issue: 「罪ある肉」という日本語表現が不自然かつやや不正確
    rationale: σαρκὸς ἁμαρτίαςは「罪深い肉」または「罪に属する肉」のような属格表現です。「罪ある肉」は日本語としてやや硬く、肉そのものが罪を所有するという響きを生みます。
  - severity: low
    issue: 脚注dが本文の「その肉」という補足に依存している
    rationale: 本文から「その」を除くなら、脚注も原文の非限定性を説明する形に改める必要があります。
