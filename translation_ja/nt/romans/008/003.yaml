id: ROM.8.3
reference: Romans 8:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: ja
  text: 律法が肉のゆえに弱くてなし得なかったことを、神は成し遂げられました。すなわち、ご自分の御子を罪深い肉に似た姿で遣わし、また罪のために遣わして、肉において罪を断罪されたのです[a][b][c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「律法の無力（なこと）」、すなわち律法がなし得なかったこと。
    reason: lexical_alternative
  - marker: b
    text: 「肉」は直訳です。この節では、人間の罪による弱さを帯びたあり方を含みます。「罪深い性質」と意訳されることもありますが、本文は「肉」と訳しています。
    reason: lexical_alternative
  - marker: c
    text: 「罪のために」は、「罪のためのいけにえとして」という犠牲祭儀的な意味にも取り得ます。
    reason: alternative_reading
  - marker: d
    text: 「罪深い肉に似た姿で」は、御子自身を罪深い者とは呼ばず、罪深い肉との類似を述べる表現です。末尾の「肉において」が何を指すかについては、御子の肉と理解する読みが有力ですが、原文に所有表現はありません。
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: 律法にはできないことがありました
  rationale: 中性名詞的表現が示す「律法の無力、なし得なかったこと」を、自然な日本語で表した。後続する神の行為との対照も保っている。
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: 人の肉のために律法が弱くなっていたからです
  rationale: ἐν ᾧ の説明的な働きを理由節として表し、διά＋属格を原因として訳した。「肉」だけでは日本語で身体そのものに限定されやすいため、「人の肉」としつつ、パウロの語の含みを脚注に残した。
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: ご自分の御子
  rationale: ἑαυτοῦ の強調と父子の関係を保ち、現代の聖書文体として自然で敬意ある表現とした。
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: 罪ある肉と同じ姿で
  rationale: ὁμοίωμα を「同じ姿」として、御子が真に人として来られたことと、御子自身を罪ある者と断定しないギリシア語の慎重な言い回しを保った。
- source_word: περὶ ἁμαρτίας
  choice: 罪のために
  rationale: 語義を狭く確定しすぎない訳を本文に置いた。七十人訳的な犠牲用語として「罪のためのいけにえ」の意味を持つ可能性は脚注で示した。
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: 罪を断罪されました
  rationale: κατακρίνω の法廷的な宣告の力を「断罪」で明確に表した。
- source_word: ἐν τῇ σαρκί
  choice: その肉において
  rationale: 直前の御子の受肉との結びつきを日本語で読み取れるよう「その」を補ったが、何を指すかにはなお解釈の余地があるため脚注で明示した。
theological_decisions:
- issue: 本節における σάρξ の意味
  choice: 「人の肉」「肉」と訳し、単純に「罪深い性質」とはしなかった。
  alternative: 罪深い性質、人間の弱い本性
  rationale: ここでは、人間の堕落した弱さと、御子が人として来られた身体的現実との双方が重なっている。「肉」を残すことでパウロの反復と神学的緊張を保つ。
- issue: περὶ ἁμαρτίας の意味
  choice: 本文では「罪のために」とした。
  alternative: 罪のためのいけにえとして
  rationale: 犠牲祭儀的な意味は十分あり得るが、ギリシア語自体はより広い意味にも取れるため、本文では曖昧さを保ち、具体的な読みを脚注に置いた。
- issue: 「罪ある肉と同じ姿」のキリスト論的含意
  choice: 御子の真の人間性を述べつつ、御子自身が罪深かったとは表現しない。
  alternative: 罪深い人間性を取って／罪のない肉で
  rationale: ὁμοίωμα と属格表現が作る慎重な区別をそのまま保ち、一方の教理的説明へ過度に展開しない。
- issue: ἐν τῇ σαρκί の指示対象
  choice: 「その肉において」と訳し、御子の肉を有力な指示対象として読めるようにした。
  alternative: 肉の領域において／人間の肉において
  rationale: 文脈上は受肉した御子の肉が自然だが、原文に所有代名詞はなく、表現にはより広い含みもあるので脚注で留保した。
translation_notes:
  register: 明快な現代標準語を用いながら、「律法」「御子」「断罪」など本文の法廷的・神学的重みを担う語は保持した。長いギリシア語文を三文に分け、律法の無力、その理由、神の行為という論理の流れを読み取りやすくした。敬語は神の行為に限って節度をもって用いた。
