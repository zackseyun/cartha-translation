id: ROM.8.34
reference: Romans 8:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: ja
  text: だれが罪に定めるのですか。キリスト[a]は、死んだ方、いや、むしろ、よみがえらされた方[b]であり、神の右におられ[c]、私たちのために執り成しておられる方です[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア」、すなわち「油を注がれた者」という称号。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語は受動形で、「よみがえった」とも訳せるが、直訳すれば「よみがえらされた」。
    reason: alternative_reading
  - marker: c
    text: 「神の右」は、最高の栄誉と権威の座を表す聖書的な表現。
    reason: cultural_note
  - marker: d
    text: 「私たちに代わって執り成しておられる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακρινῶν
  choice: 罪に定める
  rationale: 法廷的な「有罪判決を下す、断罪する」という意味を、ローマ書の文脈に沿った自然な日本語で表した。現在分詞の継続的な響きは、修辞疑問の簡潔さを優先して動詞形にした。
- source_word: Χριστός
  choice: キリスト
  rationale: 提示されたギリシャ語本文には「イエス」がなく、Χριστόςのみであるため補わない。日本語では定着した称号「キリスト」を用い、原義は脚注に示した。
- source_word: ἀποθανών
  choice: 死んだ方
  rationale: アオリスト分詞が指す歴史的な死を、簡潔な過去表現で保った。
- source_word: μᾶλλον δὲ
  choice: いや、それ以上に
  rationale: 先の発言を否定せず、死から復活へと論点を強める修正・上昇の働きを表した。
- source_word: ἐγερθείς
  choice: よみがえらされた方
  rationale: 神によって起こされたことを示すギリシャ語の受動態を保持し、自動詞の「よみがえった」に平滑化しなかった。
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: 神の右におられ
  rationale: 聖書的な空間表現を保持しつつ、現代日本語として自然にした。その象徴的含意は脚注で説明する。
- source_word: ἐντυγχάνει ὑπὲρ ἡμῶν
  choice: 私たちのために執り成していてくださる
  rationale: ἐντυγχάνειの現在形が表す継続的な執り成しと、ὑπὲρ ἡμῶνの代理・利益の意味を表した。「くださる」は話者たちへの恩恵を自然に示すが、行為の内容を過度に具体化しない。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: キリスト
  alternative: メシア（油を注がれた者）
  rationale: Χριστόςには称号としての意味があるが、日本語本文では「キリスト」が最も定着し、荘重さと理解しやすさを両立する。称号の意味は脚注で保持した。
- issue: ἐγερθείςの態
  choice: よみがえらされた
  alternative: よみがえった
  rationale: 原文の受動態を明示し、復活をキリストに対してなされた出来事として提示する原文の形を保った。
- issue: 「神の右」の意味
  choice: 比喩を本文に残す
  alternative: 神から最高の権威を与えられた地位におられる
  rationale: 原文の聖書的表現を解釈的言い換えで置換せず、栄誉と権威の含意を脚注で説明した。
- issue: 修辞疑問の後のΧριστόςの統語的緊張
  choice: 「キリストは…方です」と続ける
  alternative: 「だれもいません。キリストは…」
  rationale: 「だれもいない」という含意を本文に補わず、問いからキリストの死・復活・執り成しへ移る原文の緊張を保った。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも耐える格調を保った。原文にない「イエス」や「だれもいない」は補わず、修辞的・神学的な緊張を維持した。「いや、それ以上に」で死から復活への強調を自然に示した。
