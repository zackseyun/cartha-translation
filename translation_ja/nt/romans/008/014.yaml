id: ROM.8.14
reference: Romans 8:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: ja
  text: 神の霊に導かれている者はみな、神の子なのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「神の息子たち」。ここでいう「子」は男女を含む。原語の「息子」には、この文脈で養子として迎えられ、相続を受ける身分の含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: 者はみな
  rationale: 複数の範囲全体を指す相関表現を、自然な日本語で表し、該当する者すべてという意味を保つ。
- source_word: γὰρ
  choice: なのです
  rationale: 直前の議論を説明する接続的な働きを、日本語では文末の説明調によって自然に示す。
- source_word: πνεύματι θεοῦ
  choice: 神の霊に
  rationale: ἄγονταιとの関係で手段・動作主を表す与格と理解し、パウロの「神の霊」という語順も保つ。
- source_word: ἄγονται
  choice: 導かれている
  rationale: 現在受動形の継続的な含みと受動性を、自然な現代日本語で表す。
- source_word: οὗτοι
  choice: （者はみな）…なのです
  rationale: 日本語では独立した「これらの者こそ」を置くと硬いため、主題提示と説明的断定によって指示・強調を自然に反映する。
- source_word: υἱοί
  choice: 子
  rationale: 日本語の「子」は性別を限定せず、親子関係を表す通常の語である。文脈上の養子・相続の含意は保持しつつ、ギリシャ語男性複数形の形態を日本語で不自然に男性限定しない。
- source_word: θεοῦ
  choice: 神の
  rationale: 二つの属格を同じ形で明瞭に訳し、原文の反復を保つ。
theological_decisions:
- issue: υἱοί θεοῦを「神の息子たち」とするか「神の子」とするか
  choice: 神の子
  alternative: 神の息子たち
  rationale: υἱοίは男性複数形だが、ここでは神との身分関係に属する一群を指す。日本語の「子」は男女双方を自然に含み、ローマ8章の養子・相続の文脈も担える。「息子たち」は対象を男性に限定する誤解を招きやすい。原語の「息子」表現と相続上の含みは脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「導かれている」で現在受動の継続性を示し、「なのです」でγὰρの説明的機能を自然に表した。
