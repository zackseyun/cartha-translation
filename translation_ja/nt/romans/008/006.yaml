  text: τὸ γὰρ φρόνημα τῆς σαρκὸς θάνατος, τὸ δὲ φρόνημα τοῦ πνεύματος ζωὴ καὶ εἰρήνη·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/006.yaml
  text: For the mindset of the flesh is death[b][a], but the mindset of the Spirit is life and peace.
translation:
  language: ja
  text: なぜなら、肉の思いは死であり、霊の思いは命と平安だからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊」は、文脈上は神の霊、すなわち聖霊を指すと考えられるが、人間の霊と理解することもできる。また「肉」は、ここでは神に背く人間のあり方を指す。
    reason: πνεῦμαの指示対象に関する曖昧さと、σάρξの比喩的用法を明示するため。
lexical_decisions:
- source_word: γὰρ
  choice: だからです
  rationale: 前節の主張を説明する理由を示し、日本語では文末に置くことで自然に説明のつながりを表す。
- source_word: φρόνημα
  choice: 思いを向けること
  rationale: 単なる知的な「考え」ではなく、持続的な志向や心の傾きを表す。並行する二句で同じ表現を用い、対照を保つ。
- source_word: σάρξ
  choice: 肉
  rationale: パウロの重要語を直訳し、単に身体または「罪深い性質」と断定せず、その比喩的・神学的な幅を保つ。
- source_word: θάνατος
  choice: 死
  rationale: 原文の簡潔な述語名詞と、「命」との強い対照をそのまま保つ。
- source_word: πνεῦμα
  choice: 霊
  rationale: ローマ8章の文脈では聖霊を指す可能性が高いが、日本語の表記だけで曖昧さを不必要に解消せず、注で文脈上の判断と別解を示す。
- source_word: ζωή
  choice: 命
  rationale: 「死」との対照を簡潔かつ自然に示し、身体的・終末論的・霊的な意味の広がりを保つ。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる対人関係上の平和に狭めず、神との関係を含み得る広い意味を自然な聖書語で表す。
theological_decisions:
- issue: πνεῦμαが聖霊を指すか、人間の霊を指すか
  choice: 本文では「霊」とし、文脈上は聖霊を指す可能性が高いことを注記する
  alternative: 人間の霊、または一般的な霊的領域
  rationale: ローマ8章ではπνεῦμαが神の命を与える働き手として繰り返し現れるため聖霊の読みが有力だが、この一節の語形自体には冠詞がなく、日本語の本文では原文にある解釈上の余地を残す。
- issue: σάρξの比喩的意味
  choice: 「肉」を保持する
  alternative: 「罪深い性質」
  rationale: 「罪深い性質」は文脈上の意味を説明し得るが、σάρξの意味範囲を一つの体系的解釈に固定する。「肉」はパウロの対照構造と神学的緊張を保つ。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、格調を保った。「思いを向けること」の反復により原文の均衡ある対句を再現し、コピュラ省略の簡潔さも「死であり／命と平安」で保った。
