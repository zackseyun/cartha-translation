    rationale: 明瞭な現代標準語としては「聖霊」がより広く通用し、原文が指す聖霊を明確に示す。
  revised_text: 心を探る方は、聖霊の思いが何であるかを知っておられます。聖霊が、神にかなって[a]聖なる者たちのために執り成しておられるからです。
