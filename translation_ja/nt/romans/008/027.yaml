  source_fidelity: 主文の構文と、心を探る方が聖霊の思いを知っていること、また聖霊が聖なる者たちのために執り成すことはよく伝えている。ただし、κατὰ θεόνを「神に従って」とするのは、日本語では聖霊が神に服従するという関係を前面に出しやすく、「神にかなって／神の御心に沿って」という原文の基準・一致の意味を十分に表さない。
