id: ROM.8.27
reference: Romans 8:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: ja
  text: 心を探る方は、聖霊の思いが何であるかを知っておられます。聖霊が、神にかなって[a]聖なる者たちのために執り成しておられるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神の御心に従って」。
    reason: κατὰ θεόνは逐語的には「神に従って／神にかなって」であり、文脈上は神の御心との一致を表すと理解できる。ただし「御心」に当たる語は本文には明示されない。
lexical_decisions:
- source_word: ὁ δὲ ἐραυνῶν τὰς καρδίας
  choice: 人の心を探る方は
  rationale: ἐραυνάωの能動的に深く探る意味と、καρδίαの比喩を保った。日本語では対象を自然に示すため「人の」を補った。
- source_word: τί τὸ φρόνημα τοῦ πνεύματος
  choice: 御霊の思いが何であるか
  rationale: φρόνημαは単なる知性ではなく、思考の向きや志向を含む。「思い」は文脈に適し、過度に解釈を限定しない自然な表現である。πνεῦμαは直前の文脈から聖霊を指すため「御霊」とした。
- source_word: ἐντυγχάνει
  choice: 執り成しておられる
  rationale: ここでは祈りにおける仲介・代願を表し、前節に記された御霊の働きともつながる。
- source_word: ὑπὲρ ἁγίων
  choice: 聖なる者たちのために
  rationale: ὑπέρ＋属格の代理・利益の意味を「ために」で表し、ἅγιοιを教会用語だけに依存せず原義が伝わる形にした。
- source_word: κατὰ θεὸν
  choice: 神に従って
  rationale: 「神の御心に従って」という文脈上の意味を示唆しつつ、原文に明記されない「御心」を本文へ補わない簡潔な訳とした。
theological_decisions:
- issue: κατὰ θεὸνに「御心」を明示するか
  choice: 本文では「神に従って」とし、「御心」を補わない。
  alternative: 神の御心に従って
  rationale: 神の意志との一致を意味する可能性は高いが、原文には「御心」に当たる語がない。本文では原文の簡潔さと含みを保ち、自然な解釈を脚注に示した。
- issue: πνεύματοςが聖霊か人間の霊か
  choice: 聖霊を示す「御霊」
  alternative: 霊
  rationale: ローマ8章26節からの直接の連続性、および執り成す主体としての用法から聖霊を指す。
translation_notes:
  register: 明瞭で格調ある現代標準語。「御霊」「執り成す」は聖書文体として通用しつつ意味が把握できる語を採用した。文を二つに分け、長いギリシア語文の論理関係を保ちながら日本語として読みやすくした。
