  terminology: πνεῦμαは直前の文脈上、聖霊を指すため「聖霊」とする。ἅγιοιは原語の語感を保つ「聖なる者たち」でよい。φρόνημαの「思い」は、知的内容だけでなく志向を含みうる表現として許容される。
