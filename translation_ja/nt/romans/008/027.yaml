- from: 人の心を探る方は、御霊の思いが何であるかを知っておられます。御霊が、神に従って[a]聖なる者たちのために執り成しておられるからです。
  to: 心を探る方は、聖霊の思いが何であるかを知っておられます。聖霊が、神にかなって[a]聖なる者たちのために執り成しておられるからです。
  rationale: κατὰ θεόνを「神にかなって」と改め、神の御心への適合という文脈上の意味を自然に伝えつつ、本文に「御心」を補わないようにした。「人の」を省き、聖霊を指すπνεῦμαには明瞭な現代標準語の「聖霊」を用いた。他の主要語は原文の意味と文脈を適切に保っている。
