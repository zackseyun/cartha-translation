  text: εἰ δὲ ὃ οὐ βλέπομεν ἐλπίζομεν, δι’ ὑπομονῆς ἀπεκδεχόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: ja
  text: しかし、見ていないものを望むなら、私たちは忍耐をもって[a]それを待ち望みます。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忍耐を通して」「忍耐強く」。
    reason: lexical_alternative
  - marker: b
    text: 「待ち望みます」は、「熱心に待ちます」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、～のなら
  rationale: 条件を表す εἰ と、前節を受けつつ軽い対照を示す δέ を、自然な現代日本語で表した。
- source_word: ὃ οὐ βλέπομεν
  choice: まだ見ていないもの
  rationale: 中性関係代名詞 ὃ を「もの」とし、οὐ βλέπομεν の現在の意味を保った。「まだ」は、文脈上の将来的な待望を自然に伝えるが、「見えない」として能力や不可視性を付加することは避けた。
- source_word: ἐλπίζομεν
  choice: 望んでいる
  rationale: 現在形の継続的な希望を表し、目的語を伴う自然な日本語とした。文脈にある救い、贖い、復活などへ明示的に限定していない。
- source_word: δι’ ὑπομονῆς
  choice: 忍耐をもって
  rationale: ὑπομονή が表す、困難や遅延の中で持ちこたえる忍耐を、簡潔で dignified な日本語で表した。
- source_word: ἀπεκδεχόμεθα
  choice: 待ち望みます
  rationale: 単に待つだけでなく、期待しながら待つという複合動詞の含みを自然に表した。強意をどこまで前面に出すかには幅があるため、別訳を脚注に示した。
theological_decisions:
- issue: 目に見えない将来の成就という希望の対象
  choice: 「まだ見ていないもの」とし、対象を本文以上に特定しない
  alternative: 「救い」「からだの贖い」「復活」などと明示する
  rationale: 直前の文脈は指示対象を理解する助けになるが、この節自体は中性関係節によって一般的に述べている。そのため、特定の教理用語を補わず、本文の抑制と余韻を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、文語的な硬さを避けながら、聖書本文としての落ち着きと品位を保った。脚注記号は該当する表現を含む文末に配置した。
