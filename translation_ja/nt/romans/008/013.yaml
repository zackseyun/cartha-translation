  to: 肉に従って生きるなら、あなたがたは死ぬことになるからです。しかし、御霊によって体の行いを殺すなら、あなたがたは生きます。
  rationale: θανατοῦτεを「殺す」として、原文の決然とした死の比喩を保ちつつ、現代日本語として自然な結び付きを実現した。他の表現は原文の曖昧さとローマ8章の文脈を適切に保っているため維持した。
