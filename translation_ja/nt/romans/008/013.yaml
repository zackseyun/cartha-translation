review_pass:
  verdict: revise
  source_fidelity: 「肉に従って」「御霊によって」「体の行い」は、それぞれκατὰ σάρκα、πνεύματι、τὰς πράξεις τοῦ σώματοςを適切に区別している。「死ぬことになる」もμέλλετε ἀποθνῄσκεινの将来的帰結を過度に限定しない。もっとも、「行いを死なせる」は日本語として対象との結び付きが不自然で、θανατοῦτε（死に渡す／殺す）の比喩的だが強い動作を十分に表しにくい。
  naturalness: 全体は明快な現代標準日本語である。「体の行いを殺すなら」は比喩として明瞭で、聖書本文にふさわしい品位を保ちながら、「行いを死なせる」より自然である。
  terminology: 「肉」と「体」を訳し分けてσάρξとσῶμαの差異を保っている。「御霊」はローマ8章の文脈におけるπνεύματιを聖霊として表す慣用的な聖書日本語であり、本文の語法と整合する。
  issues:
  - severity: medium
    issue: 「体の行いを死なせる」
    rationale: 「死なせる」は通常、生きている主体を死に至らせることをいうため、「行い」との組み合わせが不自然である。また、θανατοῦτεの強い「殺す／死に渡す」という比喩を弱めるおそれがある。
  revised_text: 肉に従って生きるなら、あなたがたは死ぬことになるからです。しかし、御霊によって体の行いを殺すなら、あなたがたは生きます。
