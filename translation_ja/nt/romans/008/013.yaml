id: ROM.8.13
reference: Romans 8:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: ja
  text: 肉に従って生きるなら、あなたがたは死ぬことになるからです。しかし、御霊によって体の行いを殺すなら、あなたがたは生きます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: からです
  rationale: 直前の議論を受ける説明・理由の働きを、日本語で自然に示す。
- source_word: κατὰ σάρκα
  choice: 肉に従って
  rationale: σάρξのパウロ的な倫理的含意を保ちつつ、「罪深い性質」と解釈的に限定せず、原文の比喩と対比を保持する。
- source_word: ζῆτε
  choice: 生きるなら
  rationale: 条件文中の現在形を、継続的な生き方を表せる自然な日本語にした。
- source_word: μέλλετε ἀποθνῄσκειν
  choice: 死ぬことになる
  rationale: μέλλω＋不定詞の将来的帰結を表し、「今にも死ぬ」という時間的切迫を過度に強調しない。
- source_word: πνεύματι
  choice: 御霊によって
  rationale: 与格を手段として訳し、ローマ8章の文脈に従って聖霊を指す表現とした。
- source_word: τὰς πράξεις τοῦ σώματος
  choice: 体の行い
  rationale: πράξειςの倫理的な行為の意味と、τοῦ σώματοςの属格を簡潔かつ明示的に保つ。
- source_word: θανατοῦτε
  choice: 死なせる
  rationale: 現在形の継続的な働きを保ちつつ、対象となる「体の行い」を終わらせる比喩を明確にする。
- source_word: ζήσεσθε
  choice: 生きます
  rationale: 未来形の約束・帰結を自然な日本語で表す。
theological_decisions:
- issue: πνεύματιが聖霊を指すか、人間の霊を指すか
  choice: 聖霊（「御霊」）
  alternative: 人間の霊、または意図的に曖昧な「霊」
  rationale: ローマ8章における反復的な用法と、罪を死なせる力の主体についての文脈は、聖霊を強く支持する。
- issue: σάρξを「罪深い性質」と解釈的に訳すか
  choice: 「肉」として原語の比喩を保持
  alternative: 罪深い性質
  rationale: ここでは倫理的含意が明らかだが、「肉」を「罪深い性質」と同一視して意味を固定せず、同節の「体」との関連およびパウロの語法上の緊張を残す。
- issue: μέλλετε ἀποθνῄσκεινの死が身体的死か終末的死か
  choice: 「死ぬことになる」とし、死の性質を限定しない
  alternative: 滅びる、永遠に死ぬ
  rationale: 文脈には終末論的な重みがあるが、原文自体はここで修飾語を加えていないため、解釈を本文に織り込まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書本文としての品位を保った。「御霊」は聖霊を明示する慣用的表記。「肉」と「体」を訳し分け、原文のσάρξとσῶμαの区別を維持した。
