  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: ja
  text: 被造物がむなしさの支配の下に置かれたのは[a]、自ら望んでのことではなく、そうされた方のゆえであり[b]、希望をもって[c]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「はかなさ」「無益さ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「そうされた方」が誰であるかは、ギリシア語本文には明記されていない。
    reason: alternative_reading
  - marker: c
    text: 「希望をもって」とも訳せる。この句は次節へ続く。
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: むなしさ
  rationale: 被造物が本来の目的を十分に果たせない、実を結ばない状態を表す。現代日本語として自然で、道徳的悪と断定しない表現。
- source_word: ἡ κτίσις
  choice: 被造物
  rationale: 文脈上、個々の生き物ではなく、集合的な被造世界を指す。「被造物」は創造主との関係を保ちつつ、文脈に適合する。
- source_word: ὑπετάγη
  choice: 服した
  rationale: 外から課された状態を表す受動の力を保つ。日本語では「服従させられた」より簡潔で dignified な聖書文体となる。
- source_word: οὐχ ἑκοῦσα
  choice: 自ら望んだからではなく
  rationale: 被造物自身の意志によるものではないという対比を、擬人的表現を保ちながら明瞭に示す。
- source_word: διὰ τὸν ὑποτάξαντα
  choice: 服従させた方によるのであり
  rationale: διά＋対格の原因・理由を表し、行為者を明示しない原文の抑制も保つ。
- source_word: ἐφ’ ἑλπίδι
  choice: 希望のうちに
  rationale: 簡潔な原句を保ち、希望を伴う、または希望を根拠とするという含みを過度に限定しない。次節へ続く統語も示す。
theological_decisions:
- issue: 「服従させた方」の正体
  choice: 本文では「服従させた方」とだけ訳し、特定しない。
  alternative: 神、アダムの堕落に関わるアダム、またはサタンと解する見方がある。
  rationale: ギリシア語本文は行為者を明示していないため、翻訳で解釈を確定せず、神学的緊張を保持する。
- issue: ἐφ’ ἑλπίδι の統語的つながり
  choice: 「希望のうちに」を節末に置き、次節へ続く余地を保つ。
  alternative: 「希望をもって服従させた方による」と前の句に強く結び付けることもできる。
  rationale: 句が「服した」にかかるか、「服従させた方」に近く結び付くかには幅があるため、本文で一義的に固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、パウロ書簡にふさわしい簡潔で格調ある表現とした。節が次節へ統語的に続くため、句点ではなく読点で終えた。
