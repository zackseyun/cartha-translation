  yaml_path: translation/nt/romans/008/037.yaml
  text: But in all these things we overwhelmingly conquer through the one who loved us[a][b].
translation:
  language: ja
  text: しかし、これらすべてのことにおいて、私たちは私たちを愛してくださった方によって、圧倒的な勝利を収めています。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちは圧倒的に勝利しています」。
    reason: ὑπερνικῶμενの強意を表す別の自然な動詞的訳し方を示すため。
  - marker: b
    text: 「私たちを愛してくださった方」は、直近の文脈ではキリストを指すと考えられます。
    reason: 本文で明示されない指示対象について、文脈上有力な理解を示すため。
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前に列挙された苦難と、それにもかかわらず得られる勝利との強い対照を、自然な現代日本語で示す。
- source_word: ἐν τούτοις πᾶσιν
  choice: これらすべてのことの中で
  rationale: 直前の苦難を指す表現を保ちつつ、ἐνの領域・状況を表す意味を形式的に近く訳した。
- source_word: ὑπερνικῶμεν
  choice: 圧倒的な勝利を収めています
  rationale: ὑπέρによって強められたνικάωの動詞的意味を、決定的かつ比類ない勝利として自然に表す。現在形の継続的・現実的な響きも保持する。
- source_word: διὰ
  choice: によって
  rationale: 属格を伴うδιάが示す媒介・手段を表し、勝利が信徒自身の力によるのではなく、愛した方を通して与えられることを示す。
- source_word: τοῦ ἀγαπήσαντος ἡμᾶς
  choice: 私たちを愛してくださった方
  rationale: 冠詞付きアオリスト分詞の実体詞的用法を自然な敬意ある日本語にし、本文にない固有の指示対象は補わない。
- source_word: ἀγαπήσαντος
  choice: 愛してくださった
  rationale: アオリストの出来事としての愛を過去形で表し、『くださった』によって受益者である『私たち』との関係を自然に示す。
theological_decisions:
- issue: 「私たちを愛してくださった方」の指示対象
  choice: 本文では固有名を補わず、「方」と訳す。
  alternative: 直近の文脈に基づき「キリスト」と明示する。
  rationale: ローマ8:35など直近の文脈はキリストを強く示唆するが、ギリシア語本文は名を明記していないため、その含みを保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。ὑπερνικῶμενを日本語として自然な動詞表現にし、指示対象の曖昧さは本文で保持した。
