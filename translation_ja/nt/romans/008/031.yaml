source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν πρὸς ταῦτα; εἰ ὁ θεὸς ὑπὲρ ἡμῶν, τίς καθ’ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/031.yaml
  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: ja
  text: では、これらのことに対して、私たちは何と言えばよいでしょうか。[a] 神が私たちの味方なら[b]、だれが私たちに敵対するでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「では、これらのことについて、私たちは何と言えばよいでしょうか。」
    reason: lexical_alternative
  - marker: b
    text: 別訳「神が私たちの味方なのですから、だれが私たちに敵対するでしょうか。」
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: では、…私たちは何と言えばよいでしょうか
  rationale: οὖνの推論・移行の働きを「では」で示し、未来形ἐροῦμενの熟慮的・修辞的用法を、自然で格調ある問いとして表した。
- source_word: πρὸς ταῦτα
  choice: これらのことについて
  rationale: 直前までに述べられた事柄を受ける表現として、現代日本語で自然な「について」を採用した。「これらのことに対して」も可能である。
- source_word: εἰ
  choice: なら
  rationale: 条件文の形を保ちつつ、文脈上、神が味方であることへの疑念を表す条件ではないことも自然に伝わる表現とした。
- source_word: ὁ θεὸς ὑπὲρ ἡμῶν
  choice: 神が私たちの味方
  rationale: ὑπέρがここで示す好意的な側・支持を、簡潔で明瞭な日本語にした。「神が私たちのためにいてくださる」よりも、後半のκαθ’ ἡμῶνとの対照が明確になる。
- source_word: τίς καθ’ ἡμῶν
  choice: だれが私たちに敵対できるでしょうか
  rationale: 修辞的な挑戦の力を日本語で明確にするため「できる」を補った。意味は、敵対者が存在しないというより、その敵対が神の支持に打ち勝てないという文脈上の含意を表す。
theological_decisions:
- issue: εἰ ὁ θεὸς ὑπὲρ ἡμῶν の条件的な力
  choice: 「神が私たちの味方なら」
  alternative: 「神が私たちの味方なのですから」
  rationale: ギリシア語のεἰによる条件文の修辞構造を保った。文脈では神の支持を疑っているのではなく、真実として前提した力強い問いであるため、その別表現を脚注に示した。
- issue: τίς καθ’ ἡμῶν の修辞的含意
  choice: 「だれが私たちに敵対できるでしょうか」
  alternative: 「だれが私たちに敵対するでしょうか」
  rationale: パウロは敵対者の存在そのものを否定しているとは限らない。神が味方である以上、どの敵対者も最終的に勝てないという修辞的な力を「できる」で伝えた。
translation_notes:
  register: 明瞭な現代標準語を用いながら、修辞的な高まりと尊厳を保った。「味方」と「敵対」の対照を前面に出し、一般の読者にも直ちに理解できる表現とした。
