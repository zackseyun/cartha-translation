  rationale: 文頭の「というのも」により γάρ の説明・根拠の機能を明示しました。「現在の苦しみ」に整え、「やがて私たちに現される栄光」とすることで、将来性（μέλλουσαν）と受動的な啓示（ἀποκαλυφθῆναι）を、過度の切迫感や不自然な未来表現の重なりなしに伝えます。脚注は εἰς ἡμᾶς の参与的な解釈可能性を維持します。
