id: ROM.8.18
reference: Romans 8:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: ja
  text: というのも、私はこう考えます。現在の苦しみは、やがて私たちに現される栄光とは比べものになりません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「やがて私たちのうちに現される栄光」。
    reason: εἰς ἡμᾶς は「私たちに」とも「私たちのうちに」とも理解しうるため。
lexical_decisions:
- source_word: Λογίζομαι
  choice: 私はこう考えます
  rationale: 単なる感情ではなく、熟慮に基づく判断を表す。現代日本語として自然であり、パウロの論理的な評価を保つ。
- source_word: γὰρ
  choice: （文脈上「こう」に含意）
  rationale: 前節までを受けた説明・根拠の働きを、独立した「というのは」より自然な日本語の接続として表した。
- source_word: οὐκ ἄξια ... πρὸς
  choice: …とは比べものになりません
  rationale: ἄξια と πρὸς が示す比較上の著しい不釣り合いを、明快で自然な日本語にした。
- source_word: τὰ παθήματα
  choice: 苦しみ
  rationale: 経験される複数の苦難を集合的に表す、パウロ書簡で自然な訳語。
- source_word: τοῦ νῦν καιροῦ
  choice: 今の時の
  rationale: καιρόςを過度に終末論的な「時代」と限定せず、現在の時・時期という意味を保つ。
- source_word: τὴν μέλλουσαν δόξαν
  choice: 来たるべき栄光
  rationale: μέλλουσανの将来的・到来する意味を明示しつつ、尊厳ある自然な表現とした。
- source_word: ἀποκαλυφθῆναι
  choice: 現されようとしている
  rationale: 受動態と将来への方向性を保ち、隠されていたものが明らかになる意味を表す。
- source_word: εἰς ἡμᾶς
  choice: 私たちに
  rationale: 人に向けて現されるという方向性を基本訳とし、「私たちのうちに」という参与的な可能性は脚注に残す。
theological_decisions:
- issue: 栄光の啓示における εἰς ἡμᾶς の意味
  choice: 私たちに
  alternative: 私たちのうちに
  rationale: εἰςはここで、信じる者に向けられる啓示とも、その者たちのうちに実現する栄光とも理解しうる。本文では自然な方向性の訳を採り、神学的に重要な参与の含みを脚注で保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、書簡にふさわしい落ち着きと尊厳を保った。「来たるべき」で μέλλουσαν を明示し、脚注によって原文の解釈上の幅を保存した。
