id: ROM.8.21
reference: Romans 8:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: ja
  text: それは、被造物そのものも、朽ちることへの隷属から解放され、神の子どもたちの栄光の自由に入ることになるからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の子どもたちが受ける、栄光に満ちた自由」とも訳せる。
    reason: 原文の属格連鎖が表す関係を、より自然な日本語で示す別訳。
lexical_decisions:
- source_word: ὅτι
  choice: それは……からです
  rationale: 前節で語られた希望の根拠を説明する原因・理由の用法として訳した。
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: 被造物そのものも
  rationale: καὶの付加的な意味とαὐτήの強調をともに保ち、文脈上のκτίσιςを被造世界全体として表した。
- source_word: ἐλευθερωθήσεται
  choice: 解放され
  rationale: 将来起こる解放を示す未来受動形を、日本語でも受動表現によって保った。
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: 朽ちゆくことへの隷属から
  rationale: δουλείαの強い束縛の比喩を「隷属」で保ち、φθοράはこの文脈で被造世界の腐敗性・衰滅を指すため「朽ちゆくこと」とした。
- source_word: εἰς τὴν ἐλευθερίαν
  choice: 自由に入る
  rationale: εἰςが示す新しい状態への移行を、自然な日本語で明示した。
- source_word: τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: 神の子どもたちの栄光の
  rationale: 連続する属格を安易に解消せず、「栄光」と「神の子どもたち」と「自由」の関係に残る原文の幅を保った。τέκναは性別を限定しないため「子どもたち」とした。
theological_decisions:
- issue: τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦという属格連鎖の解釈
  choice: 神の子どもたちの栄光の自由
  alternative: 神の子どもたちが受ける、栄光に満ちた自由
  rationale: 本文では原文の属格関係を保ち、自由が栄光に特徴づけられるのか、子どもたちの栄光に属するのかを一義的に決めない。自然な解釈的表現は脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「隷属」「栄光」によって本文の力強く荘重な調子を保った。「神の子どもたち」は性別を限定せず、現代の一般読者にも理解しやすい表現である。
