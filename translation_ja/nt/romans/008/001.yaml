  text: Οὐδὲν ἄρα νῦν κατάκριμα τοῖς ἐν Χριστῷ ⸀Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/001.yaml
  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: ja
  text: したがって、今や、メシア・イエスにある者たちには、罪に定められることが全くありません。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後代の写本の中には、ここに「肉に従って歩まない者たち」という語句を加えるものがあります。初期のギリシア語写本は、これを含まない短い本文を支持しています。
    reason: textual_variant
  - marker: b
    text: 「キリスト・イエス」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: 全くありません
  rationale: κατάκριμαと結びつく強い否定を、自然な現代日本語で明確に表す。
- source_word: ἄρα
  choice: したがって
  rationale: 直前までの議論から導かれる結論であることを示す推論の力を保つ。
- source_word: νῦν
  choice: 今
  rationale: メシアにおいて成立している現在の現実を明示する語なので省略しない。
- source_word: κατάκριμα
  choice: 有罪の宣告
  rationale: 単なる罪悪感ではなく、不利な司法的判決を指す語義を分かりやすく伝える。
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにある者たちに
  rationale: 与格を「者たちに」とし、パウロのἐνによる参与・結合の表現を説明的に狭めず「にある」として保つ。
- source_word: Χριστῷ
  choice: メシア
  rationale: Χριστόςが持つ「油を注がれた者」という称号の意味を示し、単なる姓のように扱わない。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 日本語で定着した固有名の表記。
theological_decisions:
- issue: 「メシア・イエスにある」の意味
  choice: メシア・イエスに属し、彼との結びつきの中にある者を示す表現として、直訳性のある「にある」を保つ。
  alternative: 「メシア・イエスのゆえに」「メシア・イエスによって」
  rationale: パウロの参与・結合を含む豊かな表現を一つの因果的説明へ限定せず、原文の神学的含意と緊張を保つ。
- issue: κατάκριμαの司法的性格
  choice: 「有罪の宣告」と訳す。
  alternative: 「罪に定められること」「非難」
  rationale: 客観的な不利の判決という意味を明確にしつつ、その結果や教理的体系まで本文に付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「罪に定められることはない」よりもκατάκριμαの司法的意味を見えやすくするため「有罪の宣告」を採用した。脚注記号は本文末に置き、本文の流れを妨げないようにした。
