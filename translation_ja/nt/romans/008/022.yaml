id: ROM.8.22
reference: Romans 8:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: ja
  text: というのは、私たちは、被造世界全体が今に至るまで、ともにうめき、ともに産みの苦しみを味わっていることを知っています。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「被造世界全体」は、「すべての被造物」とも訳せます。ただし、ここでは創造された世界全体を指す広い意味である可能性が高いと考えられます。
    reason: lexical_alternative
  - marker: b
    text: 「産みの苦しみ」は陣痛を指す表現です。苦痛だけでなく、新しい命の誕生へと向かう苦しみを思わせます。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: 私たちは…知っています
  rationale: 形は完了形に由来するが、現在の確かな共通知識を表すοἶδαの通常の用法を、自然な現代日本語で表した。
- source_word: γὰρ
  choice: （文脈上の説明関係として表現）
  rationale: 前節を受ける説明の接続詞。日本語では独立した「というのは」を置くより、文脈のつながりに委ねるほうが自然である。
- source_word: πᾶσα ἡ κτίσις
  choice: 被造世界全体
  rationale: 冠詞を伴うπᾶσαの集合的な意味と、ローマ8章の宇宙的な文脈を表す。「被造物全体」より個々の存在への限定を避けつつ、創造された秩序全体を指す。
- source_word: συστενάζει
  choice: ともにうめき
  rationale: στενάζωの「うめく」とσυν-の共同性を簡潔に保持した。
- source_word: συνωδίνει
  choice: ともに産みの苦しみを味わっている
  rationale: ὠδίνが示す陣痛・出産の比喩と、συν-の共同性を保持し、単なる苦痛には一般化しなかった。
- source_word: ἄχρι τοῦ νῦν
  choice: 今に至るまで
  rationale: 過去から現在まで続く状態を、格調を保った自然な日本語で表した。
theological_decisions:
- issue: κτίσιςを「被造世界」とするか、個々の「被造物」とするか
  choice: 被造世界全体
  alternative: すべての被造物／一つ一つの造られたもの
  rationale: ローマ8:19–23では、人間以外を含む創造秩序が人格化され、虚無への服従と解放への待望の中に描かれる。集合的・宇宙的な広がりを保ち、個々の生物だけに狭めない表現を選んだ。
- issue: 出産の比喩が将来の新しい命を明示するか
  choice: 本文では「産みの苦しみ」として比喩を保持する
  alternative: 新しい命を生み出すために苦しんでいる、と説明的に訳す
  rationale: συνωδίνειには陣痛の含意があるが、結果を本文で明示すると原文以上の解釈を加えることになるため、含意は脚注で示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、聖書本文としての品位を保った。「うめき」「産みの苦しみ」により並行表現と出産の比喩を保持し、「ともに」を反復して二つのσυν-接頭辞を可視化した。
