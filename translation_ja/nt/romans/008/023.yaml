id: ROM.8.23
reference: Romans 8:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: ja
  text: それだけでなく、御霊の初穂[b]を持つ私たち自身も、内にあってうめきながら、子として迎えられること[a]、すなわち、私たちの体が贖われることを切に待ち望んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「養子とされること」とも訳せる。ギリシア語は、子としての法的身分を授けられることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「御霊の初穂」は、「初穂としての御霊」という意味にも取り得る。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: それだけではありません。…も
  rationale: 前節の被造物のうめきとの対比と追加を、現代日本語で自然かつ明瞭に示す。
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: 私たち自身も
  rationale: 異読を伴う反復的強調を、日本語で過度に重複させず「自身」によって保つ。
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: 御霊の初穂
  rationale: ἀπαρχήの初穂・最初の分という比喩を保持し、属格が御霊からの初穂か御霊自身を初穂とするかという余地を本文で狭めない。
- source_word: ἐν ἑαυτοῖς στενάζομεν
  choice: 心の内でうめきながら
  rationale: 内的なうめきであることを自然に示し、前後のστενάζω語群との結びつきを「うめく」で保つ。
- source_word: υἱοθεσίαν
  choice: 子として迎えられること
  rationale: 養子縁組だけでなく、神の子としての身分を授けられる意味を、男女を含む日本語として表す。
- source_word: ἀπεκδεχόμενοι
  choice: 切に待ち望んでいます
  rationale: 強い期待をもって待つという複合動詞の強意を、自然な現代日本語で伝える。
- source_word: τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν
  choice: 私たちの体が贖われること
  rationale: 「贖い」というパウロの語彙を保ちつつ、属格句を日本語として明瞭な受動表現にする。ギリシア語の「体」は単数だが、集合的・配分的に理解できる自然な表現を採る。
theological_decisions:
- issue: υἱοθεσίανの子・相続人としての含意と、指示対象に女性も含まれることをどう両立して訳すか
  choice: 子として迎えられること
  alternative: 養子とされること／子とされること
  rationale: 語に含まれる法的な子の身分を示しながら、日本語で男性だけを指すとの誤解を避ける。「迎えられる」は神の家族への受け入れを表す。
- issue: 「御霊の初穂」が、御霊から来る初穂か、御霊自身が初穂であるか
  choice: 御霊の初穂
  alternative: 初穂としての御霊
  rationale: 属格の解釈を本文で一方に固定せず、原文の緊張を保つ。別解を脚注に明記する。
- issue: すでに子としての身分を語る8章15節と、ここで待ち望むυἱοθεσίανの関係
  choice: 子として迎えられること、すなわち、私たちの体が贖われること
  alternative: 子とされる完成、すなわち体の贖い
  rationale: 原文の同格関係を保ち、すでに受けた身分と将来の身体的完成との神学的緊張を説明語で解消しすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「御霊」「初穂」「贖われる」という聖書的語彙は文脈上の比喩と神学的連関を保つために残した。「心の内」はἐν ἑαυτοῖςを自然に表す。脚注記号は該当箇所に配置し、本文末の句点の前後関係も読みやすく整えた。
