id: ROM.8.28
reference: Romans 8:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: ja
  text: また、神を愛する人たち、すなわち、目的に従って[b]召されている人たちには、すべてのことが共に働いて益となる[a]ことを、私たちは知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「神がすべてのことを共に働かせて益とされる」とあります。
    reason: textual_variant
  - marker: b
    text: 別訳「神の目的に従って」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 私たちは知っています
  rationale: 現在の確かな認識を表す動詞として、現代日本語で自然かつ明瞭に訳した。
- source_word: δὲ
  choice: また
  rationale: 強い逆接ではなく、議論を先へ進める穏やかな接続として訳した。
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: 神を愛する人たちには
  rationale: 与格を「には」で表し、後続する事柄がこの人々に関して成り立つことを自然に示した。
- source_word: πάντα
  choice: すべてのこと
  rationale: 中性複数の広がりを保ち、特定の出来事だけに限定しない表現とした。
- source_word: συνεργεῖ
  choice: 共に働いて
  rationale: SBLGNT本文に明示されていない「神」を主語として補わず、πάνταを主語として読める形を保った。
- source_word: εἰς ἀγαθόν
  choice: 益となる
  rationale: 結果または方向を示す句を、意味を狭めず自然な日本語で表した。
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: すなわち、目的に従って召されている人たちには
  rationale: 繰り返された与格が「神を愛する人たち」を言い換えて限定している関係を「すなわち」で明示し、分詞の継続的な状態も保った。
- source_word: πρόθεσιν
  choice: 目的
  rationale: 意図や計画を表す語として簡潔で文脈に適し、原文にない所有代名詞は本文で補わなかった。
- source_word: κλητοῖς
  choice: 召されている
  rationale: パウロ書簡での語彙的・神学的連続性を保ちつつ、呼びかけの仕組みを過度に説明しない訳とした。
theological_decisions:
- issue: συνεργεῖの主語
  choice: 「すべてのことが共に働いて益となる」とし、「神」を明示的な主語として補わない。
  alternative: 「神がすべてのことを共に働かせて益としてくださる」
  rationale: 提示されたSBLGNT本文には動詞の明示的主語としてθεόςがなく、πάντα συνεργεῖとあるため、本文ではその構文と曖昧さを保ち、異読を脚注に示した。
- issue: κατὰ πρόθεσινの所有者
  choice: 「目的に従って」と訳し、所有代名詞を補わない。
  alternative: 「神の目的に従って」
  rationale: 文脈上は神の目的を指すと理解できるが、ギリシャ語句自体に所有代名詞はないため、本文では明示化を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた語調と「召されている」という伝統的かつ理解可能な語彙を保った。原文の語順を日本語として自然になるよう調整し、反復された与格の同格関係を「すなわち」で示した。
