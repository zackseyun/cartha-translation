  text: 肉にある人々は、神に喜ばれることができません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪深い性質に支配されている人々は」。ギリシア語は「肉に」と言っており、「肉」はこの文脈で重要なパウロの用語です。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: いる人々
  rationale: 冠詞を伴う分詞句は、ある状態にある人々を一つの集団として指す。現代日本語では「いる人々」が自然であり、現在の状態も保つ。
- source_word: δὲ
  choice: 訳出しない
  rationale: 前文との継続・対照を示すが、この一節だけの日本語では明示しなくても対照関係が文脈から伝わり、自然に読める。
- source_word: ἐν σαρκὶ
  choice: 肉のうちに
  rationale: σάρξはローマ書8章で重要なパウロ的用語であるため、解釈的に「罪深い性質」と限定せず、「肉」を本文に残す。「うちに」によって単なる身体内部ではなく、ある領域・状態にあるというἐνの働きを表す。
- source_word: θεῷ ἀρέσαι
  choice: 神に喜ばれる
  rationale: 日本語では「神を喜ばせる」も可能だが、「神に喜ばれる」は与格θεῷとἀρέσκωの関係を自然に表し、神の是認を得るという意味を簡潔に伝える。
- source_word: οὐ δύνανται
  choice: ことができません
  rationale: 否定された能力・可能性を、明瞭で格調を損なわない現代標準日本語で表す。
theological_decisions:
- issue: パウロの用語σάρξの訳し方
  choice: 肉のうちに
  alternative: 罪深い性質のうちに／肉に支配されて
  rationale: ここでの「肉」は単なる身体を超える意味を持つが、その範囲を「罪深い性質」などに確定すると解釈を本文へ持ち込むことになる。パウロの語彙上のつながりと神学的緊張を保つため「肉」を本文に置き、解釈的な言い換えは脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書本文としての簡潔さと品位を保った。「肉」は日常語だけでは意味が取りにくいため、本文では原語との対応を保ち、脚注で比喩的理解の可能性を補った。
