  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος τοῦ πνεύματος τῆς ζωῆς ἐν Χριστῷ Ἰησοῦ ἠλευθέρωσέν ⸀σε ἀπὸ τοῦ νόμου τῆς ἁμαρτίας καὶ τοῦ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: ja
  text: というのは、いのちの御霊の法則が、メシア・イエスにあって、あなたを罪と死の法則から解放したからです。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「法則」は「律法」または「原理」とも訳せます。原文では二か所とも同じ語です。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては「あなた」を「私」としています。
    reason: textual_variant
  - marker: c
    text: 「メシア・イエスにあって」は、伝統的には「キリスト・イエスにあって」と訳されます。
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: 法則
  rationale: 二度とも同じ語で訳してパウロの反復と対比を保った。ここではモーセの律法そのものより、作用する原理・力という比喩的意味が前面に出るため、現代日本語で自然な「法則」とした。字義的な「律法」は脚注に残す。
- source_word: πνεύματος
  choice: 御霊
  rationale: ローマ8章の文脈では、いのちをもたらす神の霊、すなわち聖霊を指すのが最も自然である。「御霊」は人格的・神的指示を保つ。
- source_word: τῆς ζωῆς
  choice: いのちを与える
  rationale: 属格の関係を自然な日本語で明示した。ただし原文は直訳すれば「いのちの御霊」であり、その簡潔な形は脚注に示す。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにあって
  rationale: Χριστόςを称号「メシア」として訳し、ἐνを保つことで、メシアとの結びつき・領域を表すパウロ特有の表現を性急に言い換えないようにした。
- source_word: ἠλευθέρωσέν
  choice: 解放した
  rationale: 完了した解放の出来事を簡潔に表す。日本語ではその結果の継続も文脈上自然に理解できる。
- source_word: σε
  choice: あなた
  rationale: SBLGNT本文の二人称単数σεに従った。異読με「私」を脚注に示す。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 標準的な訳語であり、ここでは個々の罪だけでなく人を支配する力としての罪も含みうる。
- source_word: θανάτου
  choice: 死
  rationale: 標準的な訳語を用い、「罪と死」という原文の簡潔な並列を保った。
theological_decisions:
- issue: πνεύματοςが聖霊を指すか、人間の霊または非人格的な原理を指すか
  choice: 聖霊を指すものとして「御霊」
  alternative: 人間の霊、または霊的な原理
  rationale: ローマ8章では、肉・罪・死に対していのちを与える神の霊が繰り返し語られており、聖霊への言及と理解するのが最も自然である。
- issue: νόμοςを「律法」とするか「法則」とするか
  choice: 法則
  alternative: 律法、原理
  rationale: 同じ節に現れる二つのνόμοςの対応を保ちつつ、御霊と罪・死が作用する支配的原理として対比される文脈を自然に表す。「律法」という法的・モーセ律法的含意も可能なので脚注で保持する。
- issue: ἐν Χριστῷ Ἰησοῦの関係をどう表すか
  choice: メシア・イエスにあって
  alternative: メシア・イエスによって、キリスト・イエスにあって
  rationale: 手段だけに限定せず、メシアとの結びつきや領域を含むἐνの幅を保つため、伝統的だが理解可能な「にあって」を採用した。
translation_notes:
  register: 明快な現代標準語を基本としつつ、パウロの「メシア・イエスにあって」という神学的に含みのある表現は保った。「いのち」は聖書文体として定着した柔らかな表記を採用し、「法則」の反復によって原文の修辞的対照を明確にした。
