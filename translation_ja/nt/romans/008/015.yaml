id: ROM.8.15
reference: Romans 8:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: ja
  text: あなたがたは、再び恐れに陥らせる奴隷の霊を受けたのではなく、子とされる身分を与える霊[a]を受けたのです。その霊によって[b]、私たちは「アッバ、父よ」と叫びます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子とされる身分を与える」は、家族の子として迎えられ、相続に関わる子の身分を与えられることを表す。直訳的には「養子とすることの霊」。文脈上、聖霊を指すと理解することもできる。
    reason: lexical_and_theological_ambiguity
  - marker: b
    text: 直訳では「その霊の中で」または「その霊にあって」。ギリシア語の関係代名詞は「霊」に一致する中性形である。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: 奴隷の霊
  rationale: 「奴隷状態をもたらす霊」という属格表現を簡潔に保ち、後半の「子としてくださる霊」との対比を明確にした。ここでのπνεῦμαが人格的な霊か心的状態かは本文だけで限定しない。
- source_word: πάλιν εἰς φόβον
  choice: 再び恐れに陥らせる
  rationale: πάλινの「再び」と、εἰς φόβονの方向・結果を自然な日本語で表した。
- source_word: πνεῦμα υἱοθεσίας
  choice: 子としてくださる霊
  rationale: υἱοθεσίαが表す、家族に迎え入れられて子の法的身分を与えられる意味を、現代日本語で簡潔に表現した。文脈上は聖霊を指す可能性が強いが、原文に定冠詞がなく前半との並行もあるため、「聖霊」と明示して曖昧さを解消しすぎない。
- source_word: ἐν ᾧ
  choice: この霊によって
  rationale: 直訳的には「その中で／その方にあって」だが、ここでは叫びを可能にする霊の働きを示す手段的用法として自然に訳した。
- source_word: κράζομεν
  choice: 私たちは…と叫びます
  rationale: 強く切実に声を上げる動詞の力を「叫ぶ」で保った。
- source_word: Αββα ὁ πατήρ
  choice: アッバ、父よ
  rationale: アラム語形Αββαは音写し、続くギリシア語ὁ πατήρは呼びかけとして「父よ」と訳した。
theological_decisions:
- issue: πνεῦμα υἱοθεσίαςが明示的に聖霊を指すか
  choice: 本文では「子としてくださる霊」とし、聖霊という理解を排除せず、明示もしない
  alternative: 「子としてくださる御霊」または「子とする聖霊」
  rationale: ローマ8章の文脈とἐν ᾧに続く叫びは人格的な聖霊を強く示唆する一方、「奴隷の霊」との構文上の並行と無冠詞表現も尊重し、原文の緊張を保った。
- issue: υἱοθεσίαの男性形と法的身分
  choice: 「子としてくださる」と訳す
  alternative: 「養子とする」「息子として迎える」
  rationale: パウロの語には相続権を伴う法的な子の身分が含まれる。「息子」とすれば形態上の男性性は明示できるが、ここで呼びかける共同体全体への適用が不自然に狭く見えるため、「子」とし、注で法的身分を説明した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の因果を冒頭の「なぜなら」で機械的に補わず、前後の文脈につながる説明として自然な「〜のです」を用いた。「アッバ」は伝統的な音写を保ち、「父よ」で呼びかけを明確にした。
