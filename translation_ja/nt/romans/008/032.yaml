id: ROM.8.32
reference: Romans 8:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: ja
  text: ご自分の御子さえ惜しまず、私たちすべてのために[a]御子を引き渡された[b]方が、どうして御子とともに、すべてのものを私たちに恵みとして与えてくださらないことがあるでしょうか[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちすべてのために」は、「私たちすべての益のために」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 「引き渡された」は、「渡された」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「恵みとして与えて」は、「惜しみなく与えて」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: 方が
  rationale: 直前の文脈で神を指す関係代名詞に強意のγεが添えられている。日本語では「御子さえ惜しまず」という焦点表現と文全体の反語によって強意を自然に表した。
- source_word: τοῦ ἰδίου υἱοῦ
  choice: ご自分の御子
  rationale: ἴδιοςが示す固有で深い関係を「ご自分の」で保ち、神とイエスの関係を指すため「御子」とした。
- source_word: οὐκ ἐφείσατο
  choice: さえ惜しまず
  rationale: φείδομαιの基本的な意味を保ちつつ、γεの強意を「さえ」によって自然な日本語で示した。
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: 私たちすべてのために
  rationale: ὑπέρの受益・代表の幅を狭めず、πάντωνの包括性も明示する。技術的な贖罪用語へ限定しない。
- source_word: παρέδωκεν αὐτόν
  choice: 御子を引き渡された
  rationale: παραδίδωμιがここで含む、苦難と死へ渡すという重い含意を、現代日本語の「引き渡す」で保持した。代名詞は日本語で指示対象を明確にするため「御子」とした。
- source_word: πῶς οὐχὶ καὶ
  choice: どうして…与えてくださらないことがあるでしょうか
  rationale: より大きな賜物から他の賜物を確信する強い反語的推論を、自然で格調ある疑問文として保持した。
- source_word: σὺν αὐτῷ
  choice: 御子とともに
  rationale: σύνの共同・随伴の意味をそのまま保ち、指示対象を明確にした。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: パウロの広い表現を限定せず保持する。「必要なもの」などの解釈的限定は加えない。
- source_word: χαρίσεται
  choice: 恵みとして与えてくださる
  rationale: χαρίζομαιに含まれる無償かつ恵み深い授与の含意を、「恵みとして与える」で明示した。敬語は神を主語とする自然で尊厳ある日本語に資する。
theological_decisions:
- issue: ὑπὲρ ἡμῶν πάντωνが代理・代償を特定する表現か、広く受益を表すか
  choice: 私たちすべてのために
  alternative: 私たちすべてに代わって
  rationale: 本文は明確に受益的行為を述べ、犠牲的含意も持つが、前置詞自体が許す意味の幅を超えて特定の贖罪理論に限定しない。
- issue: τὰ πάνταの範囲
  choice: すべてのもの
  alternative: 必要なものすべて
  rationale: 文脈が神の救いの目的に関係することは明らかだが、本文そのものの広い言い方に説明的な限定を織り込まない。
- issue: χαρίσεταιの恵みの含意
  choice: 恵みとして与えてくださる
  alternative: 惜しみなく与えてくださる
  rationale: 語の無償性と恵みのニュアンスを保ちながら、「惜しみなく」だけでは生じうる量的含意への偏りを避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神への敬意を示しつつ過度に古風な言い回しは避けた。原文の一文構造と反語的な力を保持し、「御子」の反復によって日本語での指示関係を明確にした。
