base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: ja
  text: 聖霊ご自身が、私たちの霊とともに、私たちが神の子どもであることを証しします。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: 御霊ご自身
  rationale: αὐτόによる強調を「ご自身」で保ち、文脈上の聖霊を自然で敬意ある日本語の「御霊」で表した。ギリシア語の文法的中性は、日本語では代名詞の性を選ぶ問題にならない。
- source_word: συμμαρτυρεῖ
  choice: ともに……証ししてくださいます
  rationale: 接頭辞 συν-が示す共同・同伴の意味を「ともに」で保ち、μαρτυρέωを明瞭な現代語「証しする」で訳した。敬語補助動詞は神の御霊への自然な敬意を表す。
- source_word: τῷ πνεύματι ἡμῶν
  choice: 私たちの霊とともに
  rationale: 与格を同伴・共同の用法と取り、御霊が私たちの霊と共同で証言するという構文を明示した。別解「私たちの霊に対して」は脚注に残した。
- source_word: ὅτι ἐσμὲν
  choice: 私たちが……であることを
  rationale: ὅτι節を証言内容を示す名詞節として自然な日本語にした。
- source_word: τέκνα θεοῦ
  choice: 神の子ども
  rationale: τέκναは性別を限定しない「子ども」を意味するため、現代日本語で包括的かつ家族関係を明瞭に示す表現を選んだ。
theological_decisions:
- issue: 御霊と私たちの霊との証言関係
  choice: 御霊は「私たちの霊とともに」証しする
  alternative: 御霊は「私たちの霊に」証しする
  rationale: συμμαρτυρεῖのσυν-と与格は共同証言を自然に示す。ただし、与格を証言の受け手と理解する可能性もあるため、本文で断定的に消去せず脚注に示した。
- issue: πνεῦμαの人格的表現
  choice: 「御霊ご自身」
  alternative: 「御霊そのもの」
  rationale: 文法上は中性名詞だが、日本語には対応する文法的性の制約がない。「ご自身」はαὐτόの強調と、この節における御霊の人格的な働きを自然に伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「御霊」は直前の文脈で聖霊を指す伝統的かつ通用性のある表現。「証し」は聖書語として定着しているが、動詞構文を平易にして理解しやすくした。
