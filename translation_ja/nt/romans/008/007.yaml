id: ROM.8.7
reference: Romans 8:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: ja
  text: なぜなら、肉の思い[a]は神への敵意だからです。それは神の律法に従いません。実際、従うことさえできないのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉の思い」は、罪深い性質に支配された思いを指すとも解されます。
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: なぜなら
  rationale: 前節の内容に根拠を示す接続詞として、因果関係を明確かつ自然に表す。
- source_word: τὸ φρόνημα τῆς σαρκὸς
  choice: 肉の思い
  rationale: φρόνημαは単なる知性ではなく、思考の向きや心の構えを指す。「肉」はパウロ特有の比喩的用法を保ちつつ、簡潔な「肉の思い」とした。
- source_word: ἔχθρα εἰς θεόν
  choice: 神への敵意
  rationale: ἔχθραの名詞性と、εἰςが示す敵意の方向を保つ。日本語でも関係的な対立を明瞭に伝える。
- source_word: τῷ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται
  choice: 神の律法に従いません
  rationale: ὑποτάσσεταιが表す服従・従属を、現代日本語で自然な「従う」によって表現した。
- source_word: οὐδὲ γὰρ δύναται
  choice: 実際、従うことさえできないのです
  rationale: δύναταιが意志ではなく能力の有無を述べることを明示し、οὐδέの強調を「さえ」で表した。省略された「従う」を日本語では補って意味を明確にした。
theological_decisions:
- issue: σάρξを字義寄りに「肉」とするか、解釈的に「罪深い性質」とするか
  choice: 本文では「肉」とし、比喩的な解釈を脚注に示す。
  alternative: 罪深い性質に支配された思い
  rationale: 文脈上は神に背く人間のあり方を指すが、「肉」という原語の比喩とパウロ書簡内の語彙的連関を本文に残し、特定の組織神学へ還元しない。
- issue: 最後の節を意志的拒絶として訳すか、能力の欠如として訳すか
  choice: 「従うことさえできない」と能力の欠如を明記する。
  alternative: 従おうとしない
  rationale: δύναταιは能力を直接表すため、本文が語る不能性を弱めず、その神学的緊張をそのまま保つ。
- issue: ἔχθραの名詞表現を保持するか、形容的に「敵対している」とするか
  choice: 「神への敵意」と名詞で訳す。
  alternative: 神に敵対しています
  rationale: 原文は「敵意」という名詞を用いており、肉の思いと神への敵意を強く同定しているため、その構文上の力を保持する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、教会朗読にも適する端正さを保った。「です・ます」体で因果関係を明示し、最後の不能性は「さえ」によって原文の強調を再現した。
