id: ROM.8.29
reference: Romans 8:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: ja
  text: というのは、神は、前もって知っておられた[a]人々を、御子のかたちと同じ姿になるように、あらかじめ定められたからです。それは、御子が多くの兄弟たち[b]の中で長子となるためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「前から知っておられた」。ここでの「知る」は、前もって特別に心を留められた、という関係的な意味だと理解する人もいます。
    reason: alternative_reading
  - marker: b
    text: 原文は文法上、男性複数の「兄弟」ですが、神の家族に属する男性と女性の両方を含む可能性があります。
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: というのは……からです
  rationale: 直前の内容の根拠を示す説明接続として、文脈上の働きを自然な日本語で表した。
- source_word: προέγνω
  choice: 前もって知っておられた
  rationale: 「前もって知る」という語の形と意味を保ち、単なる事前認知か、関係的に心を留めることかを本文で限定しない。
- source_word: προώρισεν
  choice: あらかじめ定められた
  rationale: 時間的な先行性と決定の意味を簡潔に表し、予定に関する特定の教派的解釈を加えない。
- source_word: συμμόρφους
  choice: 同じ姿にする
  rationale: 御子の「かたち」に適合し、似た姿となる変容の意味を、明瞭で自然な日本語にした。
- source_word: εἰκόνος
  choice: かたち
  rationale: 聖書的な「像」の含意を保ちつつ、現代日本語で硬すぎず理解しやすい表現とした。
- source_word: υἱοῦ αὐτοῦ
  choice: 御子
  rationale: 神との子としての関係とキリスト論的称号を、定着した敬語的表記で明示した。
- source_word: εἰς τὸ εἶναι
  choice: ……となるため
  rationale: 目的を中心に表す構文として訳し、結果の含みを排除しすぎない自然な表現とした。
- source_word: πρωτότοκον
  choice: 長子
  rationale: 誕生順と卓越性の双方を含み得る比喩を、説明的な「第一の者」に置き換えず保持した。
- source_word: ἀδελφοῖς
  choice: 兄弟たち
  rationale: ギリシア語の文法上の男性複数を本文に反映しつつ、男女を含み得ることを脚注で示した。
theological_decisions:
- issue: προέγνωが認知的な予知か、関係的な顧みや選びか
  choice: 前もって知っておられた
  alternative: あらかじめ心に留めておられた／あらかじめ愛された
  rationale: 原文はここで「知る」のあり方を明示的に定義していないため、その神学的緊張を訳文でも保持した。
- issue: προώρισενに含まれる予定の概念をどこまで教理的に展開するか
  choice: あらかじめ定められた
  alternative: 運命づけられた／あらかじめ任命された
  rationale: 語の時間的・目的的要素を表しながら、その仕組みや範囲について本文以上の教派的説明を加えない。
- issue: ἀδελφοῖςの性別範囲
  choice: 兄弟たち、と本文で訳し、男女を含み得る旨を脚注に記す
  alternative: 兄弟姉妹たち／神の家族の者たち
  rationale: 原文の文法上の男性形を保持しながら、神の家族に属する女性も指示対象に含まれ得ることを明示した。
- issue: πρωτότοκονの比喩を卓越性だけに解消するか
  choice: 長子
  alternative: 第一の者／最も優れた方
  rationale: 原文の家族的比喩と、そこに伴う優位性の含意をともに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、説明的な接続構文によって前節との論理関係を示した。「御子」「長子」などの定着した聖書語は、神学的密度と家族的比喩を保つため維持した。
