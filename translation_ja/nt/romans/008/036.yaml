revisions:
- from: 'こう書かれているとおりです。

    「あなたのために、私たちは一日中、死に渡されている。

    屠られる羊のように見なされた。」'
  to: '次のように書かれています。


    「あなたのために、私たちは一日中、殺されています。


    屠られる羊のように見なされました。」'
  rationale: 引用導入を自然な現代標準語に整えたうえで、現在受動のθανατούμεθαを「殺されています」と訳し、継続する致死的扱いを直接に表しました。後半は原文のアオリスト受動に対応して「見なされました」とし、「屠られる羊」の比喩を保持しています。注は、訳文だけで原文の意味を十分に伝えられるため不要です。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:12:41Z'
review_pass:
  verdict: revise
  source_fidelity: 「死に渡されている」は文脈上は近いものの、θανατούμεθα（「殺されている／死に至らされている」）の直接的な致死的処遇をやや解釈的に弱めています。「殺されています」とするほうが現在受動の強さを忠実に表します。ἐλογίσθημενのアオリストは「見なされました」と明示するのが適切です。
  naturalness: 「こう書かれているとおりです」は不自然ではありませんが、引用を先導する現代標準語としては「次のように書かれています」のほうが簡潔で自然です。「屠られる羊」は明快で、引用の厳粛な調子にも合います。
  terminology: 神への二人称「あなた」、苦難の継続を示す「一日中」、および「屠られる羊」という比喩は、原文と英語監査記録の意味範囲を保っています。「殺されています」は特定の殉教解釈を持ち込まず、原文の強さを維持します。
  issues:
  - severity: medium
    issue: θανατούμεθαを「死に渡されている」としている。
    rationale: この表現はローマ8章の近接文脈とは響き合うものの、原語の「殺される・死に至らされる」という直接的な受動表現を「死へ引き渡される」という別の言い回しに置き換えています。本文では「殺されています」がより忠実です。
  - severity: low
    issue: ἐλογίσθημενのアオリストが「見なされた」となっている。
    rationale: 日本語として成立しますが、前行の現在形との時制対照を保つため、「見なされました」と完結した形にするのが明瞭です。
  - severity: low
    issue: 引用導入句「こう書かれているとおりです」。
    rationale: 前方を指す「こう」よりも、「次のように書かれています」のほうが現代日本語の引用導入として自然です。
  revised_text: '次のように書かれています。


    「あなたのために、私たちは一日中、殺されています。


    屠られる羊のように見なされました。」'
  revised_footnotes: []
  revision_rationale: 引用導入を自然な現代標準語に整えたうえで、現在受動のθανατούμεθαを「殺されています」と訳し、継続する致死的扱いを直接に表しました。後半は原文のアオリスト受動に対応して「見なされました」とし、「屠られる羊」の比喩を保持しています。注は、訳文だけで原文の意味を十分に伝えられるため不要です。
