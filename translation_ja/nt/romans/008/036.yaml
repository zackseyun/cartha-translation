id: ROM.8.36
reference: Romans 8:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: ja
  text: '次のように書かれています。


    「あなたのために、私たちは一日中、殺されています。


    屠られる羊のように見なされました。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: こう書かれているとおりです
  rationale: 聖書引用を導入する定型表現を自然な現代日本語で表し、καθὼςの前文との対応関係と、γέγραπταιの現在も効力を持つ書かれた言葉という含みを保った。
- source_word: Ἕνεκεν σοῦ
  choice: あなたのために
  rationale: 神への直接の呼びかけを保持し、原因・理由を表す句を簡潔かつ自然に訳した。
- source_word: θανατούμεθα
  choice: 死に渡されている
  rationale: 現在受動形が示す継続的な致死的扱いを表す。「殺されている」より、現に全員が絶命し続けるという不自然な印象を避けつつ、死の危険にさらされる以上の強い表現を保った。
- source_word: ὅλην τὴν ἡμέραν
  choice: 一日中
  rationale: 時間的な継続・絶え間なさを、明快で慣用的な日本語にした。
- source_word: ἐλογίσθημεν
  choice: 見なされた
  rationale: λογίζομαιの受動形がここで表す、あるものとして評価・処遇される意味を自然に伝える。
- source_word: ὡς πρόβατα σφαγῆς
  choice: 屠られる羊のように
  rationale: 屠殺へ向けられた羊という比喩を、簡潔で格調を失わない現代日本語として表した。
theological_decisions:
- issue: 苦難の文脈における詩篇44:22の引用
  choice: 神の民が継続的に死へ渡される者のように扱われるという共同体的な嘆きを、そのまま保持した。
  alternative: 殉教だけを明示する解釈的な訳にする。
  rationale: 本文は苦難と死の比喩を強く提示するが、その適用を殉教者だけに限定してはいないため、神学的な範囲を訳文で狭めなかった。
- issue: θανατούμεθαの継続相と受動性
  choice: 「死に渡されている」とし、継続的に死の対象として扱われる緊張を保った。
  alternative: 「殺されている」と直訳的に表す。
  rationale: 引用の強さを維持しながら、現在形を各人の反復的な死亡と誤解させず、死に定められたような継続的処遇を表すため。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書引用にふさわしい簡潔さと厳粛さを保った。詩的な二行構成によって引用の並行性を示した。
