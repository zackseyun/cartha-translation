id: ROM.8.39
reference: Romans 8:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: ja
  text: 高さも、深さも、そのほかのどんな被造物も[a]、私たちの主であるメシア・イエス[b]にある神の愛[c]から、私たちを引き離すことはできません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのほか、造られたどんなものも」または「そのほかのどんな被造者も」。
    reason: lexical_alternative
  - marker: b
    text: 「メシア・イエス」は、伝統的には「キリスト・イエス」と訳されます。
    reason: lexical_alternative
  - marker: c
    text: ここでの「神の愛」は、文脈上、神が私たちに注ぐ愛を指すと考えるのが最も自然です。
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: 高さ
  rationale: βάθοςとの対句を保ち、空間的な両極を簡潔かつ自然な日本語で表す。
- source_word: βάθος
  choice: 深さ
  rationale: ὕψωμαとの対句に対応し、原文の修辞的な対照を保つ。
- source_word: κτίσις ἑτέρα
  choice: そのほかのどんな被造物
  rationale: κτίσιςを文脈上「造られたもの」と捉え、ἑτέραを「そのほかの」、τιςの不定的な広がりを「どんな」で表した。
- source_word: δυνήσεται
  choice: できません
  rationale: 未来の能力を表す語だが、日本語の非過去形は将来にも自然に用いられるため、確固とした保証として明瞭に訳した。
- source_word: χωρίσαι
  choice: 引き離す
  rationale: 単なる区別ではなく、神の愛との結びつきを断つという文脈上の力を自然に表す。
- source_word: ἀγάπης
  choice: 愛
  rationale: 現代日本語で最も直接的かつ自然な対応語である。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格の形を本文で保持し、それが神から私たちへの愛であるという文脈上有力な理解は注で示す。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシア・イエスにある
  rationale: Χριστόςを称号として「メシア」と訳し、ἐνの結びつきを「にある」で保った。
- source_word: κυρίῳ
  choice: 主
  rationale: パウロ書簡のキリスト論的用法に適し、現代日本語でも定着した訳語である。
theological_decisions:
- issue: 「神の愛」における属格の意味
  choice: 本文では「神の愛」とし、注で神が私たちに注ぐ愛という有力な理解を示す
  alternative: 私たちが神を愛する愛、または双方を含む広い属格
  rationale: ローマ8章31–39節では神が御自分の民のためになさることが中心であり、神から私たちへの愛が最も自然である。ただし原文の属格を本文で説明的に限定せず、形の上の余地を保った。
- issue: ἐν Χριστῷ Ἰησοῦの関係
  choice: 「メシア・イエスにある」
  alternative: 「メシア・イエスを通して示された」
  rationale: 原文のἐνを因果・手段へ狭く言い換えず、キリストとの関係・領域を含み得る表現として保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの荘重な列挙と確信に満ちた結語を保った。「高さ／深さ」の対句と「神の愛」の属格は説明しすぎず、原文の簡潔さと解釈上の余地を維持した。
