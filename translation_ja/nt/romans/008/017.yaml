revisions:
- from: 子どもであるなら、相続人でもあります。すなわち、神の相続人であり、キリストと共同の相続人です。もし本当に、私たちがキリストとともに苦しむなら、それは、キリストとともに栄光を受けるためです。
  to: 子どもであるなら、相続人でもあります。すなわち、神の相続人であり、キリストとともに相続を受ける者です。もし本当に私たちがキリストとともに苦しむなら、私たちもまたキリストとともに栄光を受けるためです。
  rationale: 原文の条件構文とἵνα節のつながりを保ちながら、末尾のκαὶを「もまた」として補った。「共同の相続人」を、キリストとの共同相続という意味が明瞭な自然な表現に改めた。神の属格が持つ幅は「神の相続人」によって限定せず保持している。
