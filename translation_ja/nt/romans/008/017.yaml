review_pass:
  verdict: revise
  source_fidelity: 基本的に原文に忠実で、τέκνα、κληρονόμοι、εἴπερ、および両動詞のσυν-の共同参与を適切に捉えている。ただし、「それは、…ためです」は原文にない指示語を加え、ἵνα節との係り方をやや説明的に変えている。またκαὶ（「また」）が訳出されていない。
  naturalness: 「キリストと共同の相続人」は理解可能だが、現代標準日本語ではやや硬く不自然である。「キリストとともに相続を受ける者」のほうが、共同相続の意味を明瞭かつ自然に表す。
  terminology: 「子ども」「相続人」「神の相続人」「キリスト」はいずれも適切である。「栄光を受ける」は受動態の趣旨を保つ。
  issues:
  - severity: medium
    issue: καὶ（also）が末尾で訳出されていない。
    rationale: συνδοξασθῶμενに添えられたκαὶは、苦難への共同参与に対応する栄光への共同参与を「また」として明示する。
  - severity: medium
    issue: 「それは、…ためです」が原文にない指示語を加え、構文関係を説明的にしている。
    rationale: ἵνα節は条件節を含む前述の相続人であることに目的・帰結の関係で続く。日本語でも指示語なしに接続したほうが原文の簡潔さと論理のつながりを保てる。
  - severity: low
    issue: 「キリストと共同の相続人」がやや不自然である。
    rationale: 「共同の相続人」は誰と共同なのかを修飾関係上わずかに取りにくい。「キリストとともに相続を受ける者」はσυγκληρονόμοιの共有関係を自然に表現する。
  revised_text: 子どもであるなら、相続人でもあります。すなわち、神の相続人であり、キリストとともに相続を受ける者です。もし本当に私たちがキリストとともに苦しむなら、私たちもまたキリストとともに栄光を受けるためです。
