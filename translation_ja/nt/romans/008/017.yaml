id: ROM.8.17
reference: Romans 8:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: ja
  text: 子どもであるなら、相続人でもあります。すなわち、神の相続人であり、キリストとともに相続を受ける者です。もし本当に私たちがキリストとともに苦しむなら、私たちもまたキリストとともに栄光を受けるためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: 子ども
  rationale: 性別を限定しない複数形で、神との親子関係にある者たちを指すため、「子ども」とした。
- source_word: κληρονόμοι
  choice: 相続人
  rationale: 家族的・法的な相続の概念を保つ、現代日本語の標準的な語である。
- source_word: θεοῦ
  choice: 神の
  rationale: 属格の簡潔さと、「神の相続人」という原文の含みを保った。
- source_word: συγκληρονόμοι
  choice: 共同の相続人
  rationale: 接頭辞 συν- が示す、キリストと相続をともにする関係を明示する。
- source_word: Χριστοῦ
  choice: キリスト
  rationale: 日本語で定着した称号として自然であり、原語 Χριστός に直接対応する。
- source_word: εἴπερ
  choice: もし本当に…なら
  rationale: 現実の条件を示しつつ、単なる疑念ではない強意的・期待的な響きも表す。
- source_word: συμπάσχομεν
  choice: キリストとともに苦しむ
  rationale: συν- の共同参与を明示し、文脈上の相手がキリストであることを自然に補った。
- source_word: ἵνα
  choice: …ため
  rationale: 目的を表す接続関係を、自然な現代日本語で示す。
- source_word: συνδοξασθῶμεν
  choice: キリストとともに栄光を受ける
  rationale: 受動態を「栄光を受ける」で表し、συν- が示すキリストとの共同参与も保持した。
theological_decisions:
- issue: εἴπερ συμπάσχομεν が、苦難を功績的条件とするのか、キリストとの結びつきに伴う参与を示すのか
  choice: 「もし本当に、私たちがキリストとともに苦しむなら」と、実質的な条件として訳した。
  alternative: 「私たちはキリストとともに苦しんでいるのだから」と断定的に弱める訳、または苦難が栄光を獲得する功績であると明示する訳。
  rationale: εἴπερ の条件性を保つ一方、本文にない功績思想は加えず、苦難と栄光の双方におけるキリストとの共同参与という緊張を残した。
- issue: θεοῦ の属格が相続の源・所有者を示すのか、神ご自身を相続内容として含意するのか
  choice: 解釈を限定せず「神の相続人」とした。
  alternative: 「神から相続を受ける者」または「神ご自身を受け継ぐ者」と説明的に訳す。
  rationale: 原文の簡潔な属格が持つ幅を保ち、いずれか一方の神学的解釈に固定しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。冒頭の省略構文は日本語として補い、「すなわち」で相続人の内容を展開した。英語相談層の脚注 [a] は本文中の位置と内容が対応せず、ギリシャ語本文にも異読の根拠が示されていないため、根拠のない脚注を新設しなかった。
