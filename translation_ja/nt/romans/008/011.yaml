id: ROM.8.11
reference: Romans 8:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: ja
  text: もし、イエスを死者の中からよみがえらせた方の霊があなたがたのうちに住んでいるなら、メシアであるイエス[b]を死者の中からよみがえらせた方は、あなたがたのうちに住んでいるご自分の霊のゆえに[a]、あなたがたの死ぬべき体をも生かしてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたのうちに住んでいるご自分の霊によって」。
    reason: διάを原因・根拠ではなく手段として理解する別訳を示すため。
  - marker: b
    text: 原文「キリスト・イエス」。「キリスト」は「メシア」を意味する称号。
    reason: 原語の形と、Χριστόςの称号としての意味を示すため。
lexical_decisions:
- source_word: πνεῦμα
  choice: 霊
  rationale: 二度とも、パウロの議論において神の霊を指すため「霊」とした。人間の霊や非人格的な力とは解さない。
- source_word: ἐγείραντος / ἐγείρας
  choice: よみがえらせた
  rationale: 死者からの復活を表す他動詞として、明瞭で自然な現代日本語を用いた。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 死者たちの領域からの復活という原文の表現を保った。
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: 住んでいる
  rationale: 節の前半と後半の語彙的なつながりを保ち、内住を自然な日本語で表した。
- source_word: Χριστὸν Ἰησοῦν
  choice: メシアであるイエス
  rationale: Χριστόςを固有名の一部としてではなく、「メシア」という称号として明示した。
- source_word: ζῳοποιήσει
  choice: 生かしてくださいます
  rationale: 未来の命を与える行為を表しつつ、神を主語とする日本語として自然な敬意を添えた。
- source_word: θνητὰ σώματα
  choice: 死ぬべき体
  rationale: 身体の具体性と、現に死に服する性質の両方を保持した。
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: 住んでいるご自分の霊のゆえに
  rationale: 提示されたSBLGNT本文のδιά＋対格が持つ直接的な原因・根拠の意味を本文に反映した。
theological_decisions:
- issue: 末尾のδιά＋対格を原因と取るか、手段と取るか
  choice: ご自分の霊のゆえに
  alternative: ご自分の霊によって
  rationale: 提示された本文ではδιάが対格を伴うため、本文では原因・根拠を表す訳を採用した。ただし、伝統的かつ文脈上可能とされる手段的理解も脚注に残した。
- issue: Χριστόςの称号性
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: この箇所でもΧριστόςの称号としての意味が失われていないため、意味を明示した。一般的な音訳は脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御霊」「死人」「甦らせる」などの古風または教会内に偏りやすい語を避け、「霊」「死者」「よみがえらせる」を採用した。複数形のὑμῖνは一貫して「あなたがた」とした。
