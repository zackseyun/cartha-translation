revisions:
- from: だれが、私たちをキリストの愛から引き離すのでしょうか。苦難でしょうか、苦悩でしょうか、迫害でしょうか、飢えでしょうか、裸でしょうか、危険でしょうか、それとも剣でしょうか。[a]
  to: だれが私たちをキリストの愛から引き離すのでしょうか。苦難か、苦境か、迫害か、飢えか、裸か、危険か、剣か。[a]
  rationale: στενοχωρία の訳語を「苦悩」から「苦境」に改め、外的圧迫・行き詰まりという原語の含意をより正確に表した。また、列挙を「～か」に統一して原文の ἤ の反復を明瞭にした。本文の「キリストの愛」と脚注は保持し、属格の代替解釈を保存している。
