  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: ja
  text: だれが私たちをキリストの愛から引き離すのでしょうか。苦難か、苦境か、迫害か、飢えか、裸か、危険か、剣か。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちのキリストへの愛から」。ギリシア語の属格はこの意味にも取れるが、文脈は「キリストが私たちに注ぐ愛」を支持している。
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: だれが
  rationale: 人を指す疑問代名詞を自然に訳し、パウロの修辞疑問を保つ。後続の事柄も擬人的に問いの候補として並べられている。
- source_word: χωρίσει
  choice: 引き離すのでしょうか
  rationale: 未来形が表す将来または可能性の問いを、日本語の自然な修辞疑問として表現する。
- source_word: ἀγάπης
  choice: 愛
  rationale: 語の基本的な意味を簡潔に保つ。
- source_word: τοῦ Χριστοῦ
  choice: キリストの
  rationale: Χριστόςは称号だが、日本語では定着した聖書用語「キリスト」が明瞭で自然である。属格の方向性は文脈上「キリストが注ぐ愛」を主文に採る。
- source_word: θλῖψις
  choice: 苦難
  rationale: 外から加わる圧迫や患難を表す、現代日本語として明瞭で格調ある語。
- source_word: στενοχωρία
  choice: 苦悩
  rationale: 追い詰められた窮迫の感覚を表し、「苦難」との意味の重なりを抑えつつ並列を保つ。
- source_word: διωγμός
  choice: 迫害
  rationale: この文脈で標準的かつ正確な訳語。
- source_word: λιμός
  choice: 飢え
  rationale: 食物の欠乏による状態を自然な日本語で表す。文脈では飢饉による飢えも含み得る。
- source_word: γυμνότης
  choice: 裸
  rationale: 衣服を欠く状態を直接的に表し、困窮の具体的な像を保つ。
- source_word: κίνδυνος
  choice: 危険
  rationale: 現代日本語で自然かつ直接的な対応語。
- source_word: μάχαιρα
  choice: 剣
  rationale: 原文の具体的な像と、暴力による死の脅威を保つ。
theological_decisions:
- issue: τοῦ Χριστοῦ の属格の意味
  choice: キリストが私たちに注ぐ愛
  alternative: 私たちのキリストへの愛
  rationale: ギリシア語の属格は文法上どちらにも取り得るが、ローマ8章31–39節の文脈は、信じる者に対するキリストの愛を強く支持する。別の可能性は脚注に残し、曖昧さを隠さない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問と七つの脅威の畳みかける列挙を保持した。「でしょうか」の反復により原文の各 ἤ を明示しつつ、最後は「それとも」で自然に結んだ。
