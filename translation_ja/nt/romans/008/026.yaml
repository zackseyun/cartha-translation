revisions:
- from: 同じように、霊も私たちの弱さを共に担って助けてくださいます。私たちは、何をどう祈るべきか分かりませんが、霊ご自身が、言葉にならないうめき[a]をもって執り成してくださるのです。
  to: 同じように、霊も私たちの弱さを共に担って助けてくださいます。何を祈るべきかを、私たちは分かりませんが、霊ご自身が、言葉にならないうめきをもって執り成してくださるのです。
  rationale: 「何をどう祈るべきか」を「何を祈るべきか」に改め、τί の内容を問う焦点を明確にしつつ、καθὸ δεῖ の「祈るべき」という適切さ・当然さの含意を保った。ほかは原文への忠実さ、現代日本語としての明快さ、ならびに解釈上の非限定性の点で安全であるため維持した。
  reviewer_model: gpt-5.6-terra
