review_pass:
  verdict: revise
  source_fidelity: 全体として原文の構文と語義をよく反映している。特に「霊」「霊ご自身」「言葉にならないうめき」は、原文の強調と解釈上の余地を保っている。ただし「何をどう祈るべきか」は、τί（何を）と καθὸ δεῖ（ふさわしく／当然のように）を一つの日本語表現に融合し、「どう」という祈り方をやや前面に出す。本文では「何を祈るべきか」とするほうが、原文の問いを過不足なく表せる。
  naturalness: 「共に担って助けてくださいます」は意味は明確だが、やや重なりがある。それでも複合動詞 συναντιλαμβάνεται の「共に負担を担いつつ助ける」という含意を明示するため、許容される。「何を祈るべきかを、私たちは分かりません」とすると、より自然で読みやすい。末尾は日本語の節として句点で閉じるのが適切である。
  terminology: 「霊」は、原文にἅγιονがないことを踏まえた非教派的で適切な選択である。「霊ご自身」は αὐτὸ τὸ πνεῦμα の強調を自然に表す。「執り成してくださる」も ὑπερεντυγχάνει にふさわしい。「言葉にならないうめき」の脚注は、ἀλαλήτοις の「言い表せない」と「発語されない」の両義的な可能性を適切に示している。
  issues:
  - severity: medium
    issue: 「何をどう祈るべきか」
    rationale: 原文は「何を祈るべきか（ふさわしく）」という表現であり、τί は祈りの内容を問う。καθὸ δεῖ は祈りのふさわしさを添えるが、「どう」を独立して強く示すと、祈り方が原文の主要な問いであるかのように読める。日本語では「何を祈るべきか」で自然に原文の意味を保持できる。
  - severity: low
    issue: 節末の読点
    rationale: 原文のこの節は後続節へ続くが、日本語の単節訳としては句点で終えるほうが構造的に自然である。
  revised_text: 同じように、霊も私たちの弱さを共に担って助けてくださいます。何を祈るべきかを、私たちは分かりませんが、霊ご自身が、言葉にならないうめきをもって執り成してくださるのです。
  revised_footnotes:
  - marker: a
    text: 「言葉で表せないうめき」または「声に出されないうめき」とも訳せる。
    reason: ἀλαλήτοιςは、言葉では表現できないことと、実際に発語されないことの双方を含み得るため。
  revision_rationale: 「何をどう祈るべきか」を「何を祈るべきか」に改め、τί の内容を問う焦点を明確にしつつ、καθὸ δεῖ の「祈るべき」という適切さ・当然さの含意を保った。ほかは原文への忠実さ、現代日本語としての明快さ、ならびに解釈上の非限定性の点で安全であるため維持した。
