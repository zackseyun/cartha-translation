id: ROM.8.26
reference: Romans 8:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: ja
  text: 同じように、霊も私たちの弱さを共に担って助けてくださいます。何を祈るべきかを、私たちは分かりませんが、霊ご自身が、言葉にならないうめきをもって執り成してくださるのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡσαύτως δὲ καί
  choice: 同じように、…も
  rationale: 前の文脈との対応を示すὩσαύτωςと、付加を表すκαίを、自然な現代日本語で表した。δέはここでは強い逆接ではなく展開を示すため、独立した接続語にはしなかった。
- source_word: τὸ πνεῦμα
  choice: 霊
  rationale: ローマ8章の文脈では神の霊を指す。原文にἅγιονがないため「聖霊」と補わず、「霊」とした。
- source_word: συναντιλαμβάνεται
  choice: 共に担って助けてくださいます
  rationale: 単なる援助より強く、重荷を一緒に引き受けて助ける含意を持つ複合動詞の意味を、過度に字義的にならない日本語で表した。
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: 私たちの弱さ
  rationale: 単数形を保ち、身体的・精神的・霊的な限界のいずれにも狭めない表現とした。
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν
  choice: 私たちは、何をどう祈るべきか分かりません
  rationale: τίが祈りの内容を、καθὸ δεῖがふさわしいあり方を示し得ることを、「何をどう」によって簡潔かつ自然に表した。
- source_word: αὐτὸ τὸ πνεῦμα
  choice: 霊ご自身
  rationale: αὐτόの強調と、霊が自ら執り成す主体であることを表した。日本語には文法上の性がないため、原語の中性を不自然に再現していない。
- source_word: ὑπερεντυγχάνει
  choice: 執り成してくださる
  rationale: 他者のために訴える働きを表す語として、文脈に適した簡潔な日本語を選んだ。
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: 言葉にならないうめきをもって
  rationale: 発語されない、または言葉で表現できないというἀλαλήτοιςの意味幅を、本文では自然な表現にまとめ、脚注で幅を示した。
theological_decisions:
- issue: τὸ πνεῦμαを「霊」「聖霊」「御霊」のどれで訳すか
  choice: 霊
  alternative: 聖霊／御霊
  rationale: 文脈上は神の霊だが、この節の原文には「聖なる」に当たる語がない。「霊」は原文に最も近く、特定の教派的文体にも寄りにくい。
- issue: 霊の人格的行為を日本語でどう表すか
  choice: 霊ご自身が…執り成してくださる
  alternative: 霊そのものが…執り成す
  rationale: 原文は文法上中性だが、αὐτόによる強調と、助け執り成す主体的行為を示している。日本語では文法的性を持ち込まず、主体性を自然に表した。
- issue: στεναγμοῖς ἀλαλήτοιςが誰のうめきか
  choice: 所有者を明示せず「言葉にならないうめき」とする
  alternative: 霊のうめき／信徒のうめき
  rationale: 原文は与格句を用いるだけで、うめきの所有者を明示しない。本文で特定せず、解釈上の余地を保った。
translation_notes:
  register: 明快で現代的ながら礼拝朗読にも耐える、丁寧で格調ある文体とした。「共に担って」はσυναντιλαμβάνεταιの強さを示し、「何をどう祈るべきか」は日本語の自然さと原文の内容・仕方の両面を両立させる。
