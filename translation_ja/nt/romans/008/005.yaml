id: ROM.8.5
reference: Romans 8:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: ja
  text: 肉に従って生きる者は、肉に属するものに心を向けます。しかし、御霊に従って生きる者は、御霊に属するものに心を向けます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: 肉に従って生きる者
  rationale: 直訳的な「肉に従っている者」より自然な日本語としつつ、κατάが示す生の方向性を表した。「肉」はパウロの神学的用語として保持した。
- source_word: φρονοῦσιν
  choice: 思い求めます
  rationale: 単に考えるだけでなく、関心や志向を向ける意味を簡潔に表す。
- source_word: τὰ τῆς σαρκὸς
  choice: 肉に属すること
  rationale: 属格表現の幅を保ち、肉が望む事柄・肉に関わる事柄を過度に具体化しない。
- source_word: κατὰ πνεῦμα
  choice: 御霊に従って
  rationale: 文脈上のπνεῦμαを神の霊と理解し、日本語聖書で明瞭な「御霊」とした。冠詞がないこと自体はこの理解を妨げない。
- source_word: τὰ τοῦ πνεύματος
  choice: 御霊に属すること
  rationale: 前半との対照と原文の簡潔な属格構文を保つ。
theological_decisions:
- issue: σάρξの解釈
  choice: 「肉」として保持
  alternative: 「罪深い性質」「人間的な性質」
  rationale: σάρξの意味領域とパウロ書簡における神学的緊張を、特定の解釈へ狭めずに保つ。
- issue: πνεῦμαが聖霊か人間の霊か
  choice: 「御霊」
  alternative: 「霊」
  rationale: ローマ8章の直近の文脈では神の霊を指す蓋然性が高い。ただし訳文に「聖霊」という語を補わず、原文の簡潔さを保った。
- issue: ὄντεςに生き方の意味を込めるか
  choice: 「生きる者」
  alternative: 「ある者」「属する者」
  rationale: 存在状態を表すὄντεςを、κατάとの結び付きと文脈に即して自然な日本語の生の方向性として訳した。ただし行為による所属の獲得を意味させない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、パウロ特有の「肉」と「御霊」の対照を保持した。前後を対称的にし、後半で省略された動詞を日本語では補って読みやすくした。
