base_translation:
  language: en
  yaml_path: translation/nt/romans/008/019.yaml
  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: ja
  text: 被造物は、神の子たち[a]が現されるのを、切なる期待をもって待ち望んでいるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「神の息子たち」。ギリシャ語は男性複数形で、子としての身分や相続人としての立場を強調することがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: からです
  rationale: 直前の文を説明する接続関係を、現代日本語として自然な文末表現で示した。
- source_word: ἀποκαραδοκία
  choice: 切なる期待をもって
  rationale: 身を乗り出すような強い期待を表す語の力を保ちつつ、日本語で自然な副詞句とした。
- source_word: τῆς κτίσεως
  choice: 被造物は
  rationale: 文脈上、個々の生き物ではなく、神に造られた世界を集合的に指すため「被造物」とした。属格は意味上の主体として表した。
- source_word: τὴν ἀποκάλυψιν
  choice: 現されるのを
  rationale: 今は隠されている神の子たちの身分が将来公に明らかになるという意味を、自然な日本語で表した。
- source_word: τῶν υἱῶν τοῦ θεοῦ
  choice: 神の子たち
  rationale: υἱῶνの親子関係と身分を保持する表現。「息子たち」より日本語の聖書文脈で自然であり、男女を含み得る用法について脚注を付した。
- source_word: ἀπεκδέχεται
  choice: 待ち望んでいる
  rationale: 単なる待機ではなく、将来の実現を強く期待して待つ継続的な姿勢を表した。
theological_decisions:
- issue: υἱῶνを性別を明示する「息子たち」とするか、包括的に理解し得る「子たち」とするか。
  choice: 神の子たち
  alternative: 神の息子たち
  rationale: ギリシャ語は男性複数形だが、ここでは神との子としての身分を持つ人々全体を指す。「子たち」は日本語では性別を限定せず、同時に親子関係を保持する。相続人としての含意を消さないよう脚注で補足した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「切なる期待」と「待ち望む」により原文の強い待望を伝え、γὰρによる前節との説明関係は文末の「からです」で保持した。
