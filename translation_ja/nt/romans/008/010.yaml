id: ROM.8.10
reference: Romans 8:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: ja
  text: しかし、メシアがあなたがたの内におられるなら、体は罪のゆえに死んでいます[a]が、霊[b]は義[c]のゆえに命です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「体は死に定められています」「体は死すべきものです」。
    reason: lexical_alternative
  - marker: b
    text: 「霊」は、神によって生かされた人間の霊とも、聖霊とも理解できます。
    reason: alternative_reading
  - marker: c
    text: または「正義のゆえに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: メシア
  rationale: Χριστόςの称号としての意味を明示し、単なる固有名として扱わないため。
- source_word: σῶμα
  choice: 体
  rationale: σάρξ（肉）ではなく、身体を指す通常の意味を保ち、πνεῦμαとの対比を明確にするため。
- source_word: νεκρὸν
  choice: 死んでいます
  rationale: 原語の直接的な「死んでいる」という表現を保つ。ここで死すべき状態を含意する可能性は注で示す。
- source_word: διὰ ἁμαρτίαν
  choice: 罪のゆえに
  rationale: 対格を伴うδιάの原因を表す用法を、簡潔で格調ある日本語にした。
- source_word: πνεῦμα
  choice: 霊
  rationale: 人間の霊と聖霊のどちらを指すかという文脈上の曖昧さを、日本語でも限定せずに保つため。
- source_word: ζωὴ
  choice: 命です
  rationale: 形容詞的な「生きています」ではなく、名詞ζωήを用いたパウロの凝縮された表現を保持するため。
- source_word: διὰ δικαιοσύνην
  choice: 義のゆえに
  rationale: 原因を表すδιάを反映し、パウロ書簡におけるδικαιοσύνηの意味を限定しすぎない「義」を採用した。
theological_decisions:
- issue: πνεῦμαが何を指すか
  choice: 霊
  alternative: 聖霊
  rationale: 体との対比から人間の霊とも読める一方、直前の文脈から聖霊とも読めるため、本文では両方の可能性を残した。
- issue: σῶμα νεκρόνの意味合い
  choice: 体は……死んでいます
  alternative: 体は死に定められています／体は死すべきものです
  rationale: 身体の可死性を意味する可能性はあるが、νεκρόνの鋭い字義的表現を本文で保持した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、原文の対句的で凝縮された構造を保つため、「体は……死」「霊は……命」という対照を維持した。「ゆえに」は二つのδιά句を対応させるために用いた。
