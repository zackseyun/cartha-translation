  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: ja
  text: 私たちは、希望にあって救われたのです。[a] しかし、目に見える希望は希望ではありません。[b] 見ているものを、だれが望むでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「希望によって救われたのです」。
    reason: τῇ ἐλπίδι の与格は、領域・様態のほか、手段を表すとも理解できるため。
  - marker: b
    text: すなわち、希望はまだ目に見えていないものに関わります。
    reason: 「目に見える希望は希望ではない」という逆説的表現の意味を明確にするため。
lexical_decisions:
- source_word: τῇ γὰρ ἐλπίδι
  choice: この希望のうちに
  rationale: 与格を領域・様態として取り、救いが希望のうちに与えられており、まだ目に見える完成には至っていないという文脈上の緊張を保つ。「この」は直前の23節にある待望を受ける。γάρは日本語の自然な論理展開の中に含ませた。
- source_word: ἐσώθημεν
  choice: 救われたのです
  rationale: アオリスト受動態を過去の受動表現で保ち、「救いを得た」などの能動的な言い換えを避けた。「のです」は前節を受ける説明的なγάρの働きを自然に示す。
- source_word: ἐλπὶς δὲ βλεπομένη
  choice: しかし、目に見える希望
  rationale: 現在受動分詞を自然な連体修飾で表し、希望と見ることの対照を明確にした。日本語では「見られている希望」より「目に見える希望」が自然である。
- source_word: οὐκ ἔστιν ἐλπίς
  choice: 希望ではありません
  rationale: ギリシア語の端的な述語判断を保ち、余分な解釈を加えない。
- source_word: ὃ γὰρ βλέπει
  choice: すでに見ているものを
  rationale: 中性関係代名詞ὃを「もの」とし、文脈上、現に視野にあることを自然に示すため「すでに」を補った。これは希望と現見の対照を明示する語用的補足である。
- source_word: τίς ἐλπίζει
  choice: だれがなお望むでしょうか
  rationale: 修辞疑問を自然な現代日本語で再現した。「なお」は、すでに見ているものを引き続き待ち望むという不合理さを表し、現在形を過度に限定しない。
theological_decisions:
- issue: τῇ ἐλπίδι ἐσώθημεν における救いと希望の関係
  choice: 「この希望のうちに救われた」とし、希望を救いの成立原因とはせず、救いが現実でありながら完成はなお待ち望まれているという領域・様態を表す。
  alternative: 「この希望によって救われた」として、与格を手段的に取る。
  rationale: 8章の「すでに／いまだ」の終末論的文脈を保ち、希望そのものを救いの効力原因と断定することを避ける。
- issue: 「目に見える希望は希望ではない」の意味
  choice: 本文では逆説的表現をそのまま保ち、脚注で希望がまだ見えていないものに関わることを説明する。
  alternative: 本文を「見えているものは、もはや希望の対象ではない」と説明的に言い換える。
  rationale: パウロの簡潔な対照と修辞的な力を保ちつつ、必要な理解補助は脚注に委ねる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「希望」と「目に見える」の反復を残して原文の対照を再現し、修辞疑問は「だれが…でしょうか」と自然に表した。
