id: ROM.8.9
reference: Romans 8:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: ja
  text: しかし、神の霊が確かにあなたがたのうちに住んでいるなら、あなたがたは肉のうちに[a]いるのではなく、霊のうちにいるのです。しかし、もしキリストの霊を持たない人がいるなら、その人はキリストのものではありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉のうちに」は、ここでは単に身体の中にいるという意味ではなく、神の霊に対立する人間のあり方・存在の領域を表します。別訳「罪深い性質に支配されている」。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「その方のものではありません」。ここでは直前の「キリスト」を指すものとして訳しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: σάρξ
  choice: 肉
  rationale: パウロ固有の対照表現を保ち、単なる身体や「罪深い性質」という解釈に限定しないため。
- source_word: πνεῦμα
  choice: 霊
  rationale: 直後の「神の霊」「キリストの霊」によって聖霊を指すことが明らかである。日本語では通常、表記上の大文字化ができないため文脈で示す。
- source_word: οἰκεῖ
  choice: 住んでいる
  rationale: 一時的な存在ではなく、内に住まうという継続的な居住の含みを自然な現代日本語で表す。
- source_word: Χριστοῦ
  choice: キリスト
  rationale: 日本語で定着した称号表現を用い、「キリストの霊」という自然で広く理解される言い方を保つ。
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: キリストのものではありません
  rationale: 属格による所属・所有の表現を自然な日本語にし、直近の先行詞であるキリストを明示して代名詞の不自然さを避ける。
- source_word: εἴπερ
  choice: 確かに…なら
  rationale: 条件形を残しつつ、話者がその条件を事実として見込んでいる含みを表す。
- source_word: Ὑμεῖς
  choice: あなたがた
  rationale: 明示された複数代名詞と、その強調および前文との対照を保持する。
- source_word: οὗτος
  choice: その人
  rationale: 一般的な単数の人物を指すギリシア語を、性別を不必要に限定しない自然な日本語で表す。
theological_decisions:
- issue: 「肉のうち」と「霊のうち」の対照
  choice: 聖霊の内住に結びつく領域・存在状態の表現として、「肉」「霊」を保持する
  alternative: 「罪深い性質に支配される」「御霊に支配される」と説明的に訳す
  rationale: 原文のἐνによる領域的表現とパウロの用語を残し、心理状態や特定の教理体系へ狭めないため。
- issue: 「その方のものではない」に相当するαὐτοῦの指示対象
  choice: 直近の「キリスト」を指すものとして本文で明示する
  alternative: より広い文脈から「神」を指すと取る、または曖昧な代名詞のままにする
  rationale: 最も近い文法的先行詞はキリストであり、日本語の「その方」は指示が不明瞭になりやすい。神の霊とキリストの霊の関係については、それ以上の体系化を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「しかし」を冒頭に置いて前後の対照を示し、です・ます調で統一した。「肉／霊」という主要語を保持しつつ、脚注で比喩的・領域的な意味を補った。
