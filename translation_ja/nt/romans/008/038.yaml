id: ROM.8.38
reference: Romans 8:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πέπεισμαι γὰρ ὅτι οὔτε θάνατος οὔτε ζωὴ οὔτε ἄγγελοι οὔτε ἀρχαὶ οὔτε ⸂ἐνεστῶτα οὔτε μέλλοντα οὔτε δυνάμεις⸃
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/038.yaml
  text: For I am convinced that neither death nor life[a], nor angels nor rulers, nor things present nor things to come, nor powers,
translation:
  language: ja
  text: というのも、私は確信している。死も命も、天使たちも支配者たち[a]も、今あるものもこれから来るものも、力も、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「諸支配」とも訳せる。宇宙的または霊的な支配勢力を指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέπεισμαι
  choice: 私は……確信している
  rationale: 完了形が表す、説得された結果として今も揺るがない確信を、自然な現代日本語で示す。述語は後続節まで続く構文として理解される。
- source_word: γὰρ
  choice: というのも
  rationale: 前の記述を受けて、その根拠・説明を導く接続機能を明示する。
- source_word: οὔτε ... οὔτε
  choice: ……も、……も
  rationale: 日本語では否定述語に係る「も」の反復が、ギリシア語の列挙のリズムと包括的否定を自然に表す。否定述語自体は後続する8章39節に現れる。
- source_word: θάνατος
  choice: 死
  rationale: 直接的で標準的な訳語。
- source_word: ζωή
  choice: いのち
  rationale: 「死」と対をなす語として、人格的・存在的な広がりを保つ聖書文体の自然な表記を採用する。
- source_word: ἄγγελοι
  choice: 御使いたち
  rationale: 周囲に宇宙的・超人的な存在が列挙されているため、「使者」ではなく天的存在を指すと判断した。現代の聖書読者に通じる語を用いる。
- source_word: ἀρχαὶ
  choice: 支配者たち
  rationale: 統治する者・権威、また宇宙的ないし霊的勢力を指し得る広さを保ち、特定の神学的分類に限定しない。
- source_word: ἐνεστῶτα
  choice: 今あるもの
  rationale: 現在存在する事柄・現実を指す実詞的用法を、簡潔で自然な日本語にする。
- source_word: μέλλοντα
  choice: やがて来るもの
  rationale: 将来到来する事柄を表し、「今あるもの」との時間的対照を明確にする。
- source_word: δυνάμεις
  choice: 力あるもの
  rationale: 人格的・霊的な勢力と非人格的な力の双方を含み得る原語の曖昧さを、「権力者」などに狭めず保持する。
theological_decisions:
- issue: ἀρχαὶとδυνάμειςを霊的存在の専門的名称として訳すか
  choice: 本文では「支配者たち」「力あるもの」とし、指示対象を限定しない
  alternative: 「もろもろの支配と権威」「霊的な支配者たちと力ある者たち」
  rationale: 文脈上、宇宙的・霊的勢力が含まれる可能性は高いが、語そのものはより広い意味を持つ。特定の霊的階級体系を本文に持ち込まず、神学的緊張を保つ。
translation_notes:
  register: 明快で格調のある現代標準語。ギリシア語の列挙と、文が8章39節へ続く構造を保つため、末尾を読点とした。脚注記号は、その内容が該当する「支配者たち」の直後に置いた。
