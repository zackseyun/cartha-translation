  source_fidelity: 原文は「私たちは負債／義務を負う者である。ただし肉に対して、肉に従って生きるためにそうなのではない」という、肉への義務を否定する構文である。草案の「しかし」は逆接として不適切で、前半の肯定と後半の否定を不必要に対立させる。また後半で「義務」を繰り返すため、原文の簡潔な論理がやや見えにくくなっている。
  naturalness: 「義務を負っています。しかし、…負っているのではありません」は日本語としてぎこちなく、論理関係も曖昧である。「ただし、それは…義務ではありません」とすれば、現代標準日本語として自然で、原文の省略された対照も明瞭になる。
  terminology: 「兄弟たち」「肉」は維持してよい。「肉」の脚注は身体そのものに限られないことを適切に示しているが、「神に逆らう」と断定するより、「罪に支配された人間のあり方」としておくほうが、この語の含意を説明しつつ過度に狭めない。
