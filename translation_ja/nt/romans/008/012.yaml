- from: ですから、兄弟たち[a]、私たちは義務を負っています。しかし、肉に従って生きる義務を、肉[b]に対して負っているのではありません。
  to: ですから、兄弟たち[a]、私たちは義務を負っています。ただし、それは肉[b]に対して、肉に従って生きる義務ではありません。
  rationale: 原文の「義務を負う者である」という肯定を保ちつつ、その義務が肉に対して肉に従って生きるためのものではないことを、自然な日本語の限定構文で表した。「肉」は本文で維持し、脚注では解釈的代案を示すにとどめた。
