  text: Ἄρα οὖν, ἀδελφοί, ὀφειλέται ἐσμέν, οὐ τῇ σαρκὶ τοῦ κατὰ σάρκα ζῆν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/012.yaml
  text: So then[a], brothers, we are debtors—not to the flesh[b], to live according to the flesh.
translation:
  language: ja
  text: ですから、兄弟たち[a]、私たちは義務を負っています。ただし、それは肉[b]に対して、肉に従って生きる義務ではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語では「兄弟たち」だが、信じる共同体全体への呼びかけとして用いられている。
    reason: lexical_alternative
  - marker: b
    text: ここで「肉」は単なる身体ではなく、罪に支配された人間のあり方を指す。「罪深い性質」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: ですから
  rationale: 直前までの議論から結論を導く二つの推論的な小辞の働きを、自然な現代日本語で表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形による呼びかけを保った。信仰共同体全体を含む用法であることは脚注に示した。
- source_word: ὀφειλέται ἐσμέν
  choice: 私たちは義務を負っています
  rationale: 名詞ὀφειλέταιは字義的には「負債のある者たち」だが、ここでは金銭上の債務ではなく、生き方に関する義務を表すため、日本語として明瞭な表現にした。
- source_word: τῇ σαρκὶ / κατὰ σάρκα
  choice: 肉に対して／肉に従って
  rationale: パウロがこの文脈で「霊」と対比するσάρξの語を「肉」として保持し、κατάの規範・方向性を「従って」で表した。
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: 肉に従って生きる義務を
  rationale: 属格付き不定詞が否定される義務の内容を示すことを、日本語では「義務」を補って明確にした。
theological_decisions:
- issue: σάρξを解釈的に訳すか
  choice: 肉
  alternative: 罪深い性質
  rationale: 「罪深い性質」と限定して神学的含意を一つに決めず、ローマ8章における「肉」と「霊」の対照とパウロの用語上の緊張を保った。比喩的な意味合いは脚注で説明した。
- issue: ὀφειλέταιの負債の比喩をどこまで保持するか
  choice: 義務を負っています
  alternative: 負い目のある者です
  rationale: この箇所は金銭的負債ではなく道徳的・実存的義務を述べる。「義務を負う」は日本語として自然であり、「負う」によって原語の負債の比喩もある程度残る。
translation_notes:
  register: 明瞭で品位ある現代標準日本語とした。原文の推論、共同体への呼びかけ、義務をめぐる否定の構造を保ちつつ、日本語で誤読されないよう「義務」を後半にも補った。
