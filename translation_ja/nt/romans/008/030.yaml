  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: ja
  text: 神は、あらかじめ定めた人々[a]を召し、召した人々を義と認め、義と認めた人々に栄光をお与えになりました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「前もって決めた」または「予定した」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は過去形で「栄光を与えた」。将来与えられる栄光が確実であるため、すでに実現したことのように述べていると理解する人もいる。
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: あらかじめ定めた
  rationale: 「前もって決定する、定める」という語義を明確に保ちつつ、特定の教派的な予定論の術語に狭めない自然な日本語とした。
- source_word: ἐκάλεσεν
  choice: 召した
  rationale: パウロの神学的文脈における「呼ぶ」を簡潔に表し、単なる呼びかけ以上の含みを過度に説明せず保持する。
- source_word: ἐδικαίωσεν
  choice: 義と認めた
  rationale: δικαιόω の法廷的な含意を、現代の一般読者にも理解しやすい形で表す。「義とした」も可能だが、宣告・認定の側面が伝わりやすい表現を選んだ。
- source_word: ἐδόξασεν
  choice: 栄光ある者とされました
  rationale: アオリスト直説法の過去形を保ち、「栄光を与える」という他動詞的意味を自然な日本語にした。未来的成就と見る理解は脚注に残す。
- source_word: οὓς ... τούτους
  choice: …人々を…し
  rationale: 同じ対象群が各段階を通じて連鎖する対応構造を、反復を保った自然な日本語で示す。
- source_word: καὶ
  choice: （各動詞を並列して連鎖）
  rationale: 日本語では「また」を各節に機械的に重ねず、連用形による並列で加算的な進行を自然に表した。冒頭の καί は「また」とした。
- source_word: δὲ
  choice: また
  rationale: 強い対比ではなく、前文から続く穏やかな接続として訳した。
theological_decisions:
- issue: προώρισεν を教派的含意を避けるため弱めるべきか
  choice: あらかじめ定めた
  alternative: 予定した／前もって決めた
  rationale: 原文が示す事前の決定を保つ一方、その仕方や範囲について本文以上の教理的説明を加えない。
- issue: ἐδόξασεν を過去形と未来形のどちらで訳すか
  choice: 栄光ある者とされました
  alternative: 栄光ある者とされます
  rationale: 原文のアオリスト直説法に従って本文では過去形を保つ。将来の栄光を確実なものとして完了したかのように述べる先取り表現とする理解は脚注に示す。
- issue: ἐδικαίωσεν の法廷的含意をどう表すか
  choice: 義と認め
  alternative: 義とし／正しい者と宣言し
  rationale: パウロ的な法廷的含意を読み取りやすくしながら、義認の仕組みに関する教理的説明は加えない。
translation_notes:
  register: 明快で現代的ながら礼節ある文体。主語「神」は直前の文脈から補い、長い連鎖を日本語として追いやすくした。原文の同一集団を示す反復と、過去形による修辞的緊張を保持した。すべての脚注標識を本文に配置した。
