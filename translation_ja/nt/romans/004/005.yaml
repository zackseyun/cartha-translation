source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: ja
  text: しかし、働かず、むしろ不敬虔な者を義とする方[b]を信じる[a]人の信仰は、義[d]とみなされ[c]ます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼する」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「義と認める」または「正しい者と宣言する」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「数えられます」または「帰されます」とも訳せる。
    reason: lexical_alternative
  - marker: d
    text: パウロ書簡では、文脈により「正義」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: 働くことなく
  rationale: 否定を伴う実詞的分詞を、信じることとの対照を保ちながら自然な日本語にした。すべての労働を一般的に否定する表現にはしていない。
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: むしろ…方を信じる
  rationale: δέによる対照を「むしろ」で示し、ἐπίを伴うπιστεύωが表す信頼と依拠を含みつつ、主要な訳語を「信じる」とした。
- source_word: τὸν δικαιοῦντα
  choice: 義とする方
  rationale: パウロの議論で重要なδικαιόωを簡潔に訳し、δικαιοσύνηとの「義」という語のつながりも保った。
- source_word: τὸν ἀσεβῆ
  choice: 不敬虔な者
  rationale: 神に対する不敬虔さを表す語義を保ち、「悪人」よりも原語の宗教的方向性を明確にした。
- source_word: λογίζεται
  choice: みなされます
  rationale: 評価・勘定を表すλογίζομαιを、現代日本語で明瞭な受動表現にした。帳簿的な比喩だけに限定しない。
- source_word: ἡ πίστις αὐτοῦ
  choice: その信仰
  rationale: 直前の「信じる」との語族上・意味上の連続性を保ち、ここでは「忠実さ」ではなく信じる姿勢を表した。
- source_word: εἰς δικαιοσύνην
  choice: 義と
  rationale: λογίζομαι ... εἰςの構文を、何としてみなされるかを示す自然な日本語で表した。
- source_word: δικαιοσύνην
  choice: 義
  rationale: パウロ書簡の主要な神学語として「義」を用い、δικαιόωとの語彙的連続性を保った。
theological_decisions:
- issue: パウロの議論におけるδικαιοῦνταの訳し方
  choice: 義とする方
  alternative: 義と認める方／正しい者と宣言する方
  rationale: 法廷的な含意を排除せず、同時に特定の教派的体系へ限定しない簡潔な表現とした。δικαιοσύνηとの語のつながりも保たれる。
- issue: πίστις／πιστεύωの訳し方
  choice: 信仰／信じる
  alternative: 信頼／信頼する
  rationale: 直前の動詞と名詞の対応を保った。「信頼する」はἐπίを伴う構文の依拠の含みをよく表すため、脚注に残した。
- issue: 信仰が義とλογίζεταιされる関係
  choice: その信仰が義とみなされます
  alternative: その信仰が義として数えられます／義として帰されます
  rationale: 原文の受動構文と「信仰」「義」の関係を明示しつつ、それがどのような仕組みで成り立つかを訳文で教義的に説明し足さなかった。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、「不敬虔」「義」「信仰」というパウロの議論上重要な語は保持した。文体は丁寧体で統一し、「働くことなく」と「むしろ…信じる」によって原文の対照を示した。
