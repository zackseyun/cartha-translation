reference: Romans 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: ja
  text: では、聖書は何と言っているのでしょうか。「アブラハムは神を信じた。そして、それが彼の義[a]と認められた[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正しさ」または「正義」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「みなされた」「数えられた」または「算入された」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: 聖書
  rationale: 定冠詞を伴うパウロの用法では、単なる「書かれたもの」ではなく、権威ある聖なる書を指すため。現代日本語でも明確で自然。
- source_word: Ἐπίστευσεν
  choice: 信じた
  rationale: πιστεύω のアオリストを簡潔に表し、信頼という含みを保ちつつ解釈的な補足を加えない。
- source_word: τῷ θεῷ
  choice: 神を
  rationale: πιστεύω が与格目的語を取る構文を、「神が語ったことを真実として受け入れた」という方向性を失わず自然な日本語で表す。「神の存在を信じた」とは限定しない。
- source_word: ἐλογίσθη
  choice: 認められた
  rationale: 受動態を保ち、λογίζομαι の「勘定する・評価する・見なす」という意味を、過度に会計的にせず現代日本語で表す。
- source_word: εἰς δικαιοσύνην
  choice: 義と
  rationale: パウロの文脈で δικαιοσύνη が持つ、神の前での正しさという神学的含意を簡潔に保つ。「正義」だけに狭めない。
theological_decisions:
- issue: δικαιοσύνη の訳語
  choice: 義
  alternative: 正しさ、正義
  rationale: 義認を扱うパウロの文脈では「義」が宣告的・関係的な含みを保つ。「正しさ」は平易だが意味を一般化しやすく、「正義」は社会的公正に限定して受け取られやすいため、代替訳として注記する。
- issue: 何が義と認められたか
  choice: 「それが」とし、直前のアブラハムの信仰を受ける
  alternative: 「その信仰が」と明示する
  rationale: ギリシア語本文は ἐλογίσθη の主語を明示していない。「その信仰が」と補うと解釈を固定するため、自然な日本語に必要な最小限の指示語だけを置いて原文の余地を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用文は簡潔で格調を保った。「では」は γάρ が直前の議論を受けることを示す。疑問文の「のでしょうか」は修辞的な問いとして自然に読める形である。
