  naturalness: 全体として明瞭な現代標準日本語である。「彼の義と認められた」とすれば、原文の会計・評価の比喩を過度に専門化せず、自然に『彼の義として認められた』ことを表せる。
  terminology: パウロ文脈の δικαιοσύνη を「義」とするのは適切であり、脚注で「正しさ」「正義」の可能性を示す処理も妥当である。「認められた」は ἐλογίσθη の受動的な評価・算定の意味を自然に表す。
