id: ROM.4.17
reference: Romans 4:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: ja
  text: 「わたしはあなたを多くの国民の父とした」と書かれているとおりです。[a] アブラハムは、自分が信じた神の御前で、多くの国民の父なのです。神は死者に命を与え、存在しないものを存在するものとして呼ばれます。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「国民」は「諸民族」とも訳せる。文脈によっては「異邦人」を意味する語だが、ここでは創世記の引用として、より広い意味である。
    reason: lexical_alternative
  - marker: b
    text: 「存在しないものを呼び出して存在させる」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: 書かれているとおりである
  rationale: 聖書引用の定型表現として自然であり、完了受動形が示す「書かれ、今もその効力を保っている」という含みを伝える。
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: 多くの国民の父
  rationale: 創世記からの引用では、ἐθνῶν はユダヤ人と対比される「異邦人」に限定せず、広く諸国民・諸民族を指す。「国民」は引用として簡潔で格調も保てる。
- source_word: τέθεικά σε
  choice: わたしはあなたを…とした
  rationale: 完了形の結果が存続する含みを、日本語の引用文として自然な「…とした」で表した。「任命した」よりも約束の成就を広く含む。
- source_word: κατέναντι
  choice: 神の御前で
  rationale: 神との関係における立場を示す空間的・関係的意味を保ちつつ、現代日本語として尊厳のある表現とした。
- source_word: οὗ ἐπίστευσεν
  choice: アブラハムが信じた
  rationale: 関係代名詞の先行詞が神であることを明確にし、文脈上の主語アブラハムを補って、日本語の曖昧さを避けた。
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: 死者に命を与え
  rationale: 神の生命付与の力を端的に示し、分詞が描く神の恒常的な働きを自然に表す。
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  choice: 存在しないものを存在するものとして呼ぶ
  rationale: 「呼んで存在させる」と解釈的に確定せず、圧縮されたギリシア語の表現と、その創造的な力を示唆する緊張を保った。
theological_decisions:
- issue: 最後の句を無からの創造についての明示的な文として訳すか、原文に近い幅を残すか
  choice: 存在しないものを存在するものとして呼ぶ
  alternative: 存在しないものを呼び出して存在させる
  rationale: 原文は神の創造的な力を含意しうるが、「存在へと呼び出す」と明示してはいない。本文では原文の圧縮と解釈上の幅を保ち、明示的な理解は脚注に示した。
- issue: κατέναντι 以下と引用文との統語的な関係
  choice: 「これは…神の御前でのことである」として、父であるという宣言が神の御前で成立することを示す
  alternative: 引用直後に「彼が信じた神の御前で」と続ける断片的な語順
  rationale: ギリシア語の省略的な構文を日本語で理解可能にしつつ、神の御前におけるアブラハムの父としての立場という関係を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用と神についての叙述には簡潔で dignified な調子を保った。「御前」は関係的・法廷的な響きを残すため採用した。原文の省略的な構造は「これは…ことである」で補ったが、神学的な意味は追加していない。
