reference: Romans 4:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: ja
  text: このため、それは信仰によるのです。それが恵みによるものとなり、約束がすべての子孫[a]に対して確かなものとなるためです。すなわち、律法に基づく者だけでなく、アブラハムと同じ信仰を持つ者にもです。[b]アブラハムは、私たちすべての父です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「種」。ここでは集合的に、アブラハムの子孫を指します。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは、「律法による者だけでなく、アブラハムの信仰による者にも」。ギリシア語の単数形の「者」は、それぞれの集団を集合的に指しています。
    reason: alternative_reading
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: このため
  rationale: 直前の議論を受ける推論的なつながりを、簡潔で自然な現代日本語で示す。
- source_word: ἐκ πίστεως
  choice: 信仰による
  rationale: 起点・根拠を表すἐκの働きを保ちつつ、パウロの議論に合う自然な表現とした。
- source_word: ἵνα κατὰ χάριν
  choice: 恵みによるものとなり
  rationale: 目的節を明示し、信仰と恵みの関係を説明しすぎずに保持する。
- source_word: βεβαίαν
  choice: 確かなもの
  rationale: 約束の確実性・信頼性を明瞭に表す。
- source_word: ἐπαγγελίαν
  choice: 約束
  rationale: パウロの文脈における標準的で自然な訳語。
- source_word: σπέρματι
  choice: 子孫
  rationale: 字義は「種」だが、ここではアブラハムに属する子孫を集合的に指すため、日本語では「子孫」が明瞭である。
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: 律法による者だけでなく
  rationale: 単数形の集合的用法を日本語の「者」で保ち、律法との関係を過度に限定せず表す。
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: アブラハムの信仰による者
  rationale: 圧縮されたギリシア語の構造を保ち、「信仰を共有する」と解釈的に補わず、自然な日本語にした。
- source_word: πατὴρ πάντων ἡμῶν
  choice: 私たちすべての父
  rationale: 家族的・契約的な比喩を保ち、原文の語順にも比較的近い自然な表現とした。
theological_decisions:
- issue: τῷ ἐκ πίστεως Ἀβραάμが、アブラハムと同じ信仰を持つ者を指すことをどこまで明示するか
  choice: アブラハムの信仰による者
  alternative: アブラハムと同じ信仰を持つ者
  rationale: 原文の属格が持つ圧縮と曖昧さを保持し、「同じ」を本文に補って解釈を固定することを避けた。
- issue: 冒頭で省略されている主語を何として補うか
  choice: それ
  alternative: 約束
  rationale: 文脈上は約束または相続が想定されるが、ギリシア語本文には明示的主語がないため、「約束による」と断定せず省略を可視化した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語の一文を読みやすく分けつつ、目的関係と対比を維持した。「信仰」「恵み」「律法」「約束」はローマ書の主要語として一貫した伝統的訳語を用いた。
