  rationale: 受動態を保ち、聖書に記された言葉を自然な現代日本語で表す。
- source_word: δὲ
  choice: しかし
  rationale: 直前のアブラハムについての叙述から、読者にも適用されることへの対比を示す。強すぎる逆接にならないよう文脈に沿って用いる。
- source_word: δι’ αὐτὸν μόνον
  choice: 彼だけのため
  rationale: διά＋対格が示す『彼を念頭に置いて／彼のために』という意味と、μόνονの限定を簡潔に保つ。
- source_word: ὅτι
  choice: 引用符によって表現
  rationale: 書かれた内容を導くὅτιは、日本語では直接引用の形にすることで自然に表せる。
- source_word: ἐλογίσθη
  choice: 認められた
  rationale: λογίζομαιの『算入する、そうと見なす』という意味を、過度に専門的な神学用語にせず表す。何が認められたかは前節から補われるため、原文どおり明示しない。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 与格の受益・帰属関係を自然に示す。
theological_decisions:
- issue: パウロの義認論の文脈における λογίζομαι の訳し方
