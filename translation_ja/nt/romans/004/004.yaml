source:
  edition: SBLGNT
  text: τῷ δὲ ἐργαζομένῳ ὁ μισθὸς οὐ λογίζεται κατὰ χάριν ἀλλὰ κατὰ ὀφείλημα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: ja
  text: 働く人には、賃金は恵みとしてではなく[a]、当然支払われるべきものとして[b]計上されます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「恵みに従ってではなく」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「債務に従って」。すなわち、負われているものとして。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: 働く人に対しては
  rationale: 定冠詞を伴う現在分詞を一般的・実質名詞的に捉え、継続的に働く人を自然な現代日本語で表した。与格の関係は「に対して」で示し、「は」により文脈上の対比も担わせた。
- source_word: μισθὸς
  choice: 賃金
  rationale: 労働に対して支払われる報酬という文脈に最も明確に合い、「報い」よりも雇用・支払いの比喩を保つ。
- source_word: λογίζεται
  choice: 勘定されます
  rationale: λογίζομαι の計算・会計上の比喩を保ちつつ、「見なされる」という判断の意味も文脈から伝わる表現とした。
- source_word: κατὰ χάριν
  choice: 恵みによるものとして
  rationale: κατά の基準・様態と χάρις の無償の好意という意味を保ち、賃金との対比を明確にした。「贈り物として」よりもパウロ書簡における「恵み」との語彙的連続性を保つ。
- source_word: ὀφείλημα
  choice: 支払うべきものとして
  rationale: 語の中心的意味である「負っているもの、債務」を、この労働賃金の文脈で自然に表した。単に「義務」とせず、雇い主が労働者に負う支払いであることを明確にする。
- source_word: δὲ
  choice: は（対比）
  rationale: 独立した接続語を加えず、主題提示の「は」に対比機能を担わせた。これにより、δέ の弱い移行・対比を日本語として自然に示す。
theological_decisions:
- issue: 労働への賃金と恵みの対比
  choice: κατὰ χάριν を「恵みによるものとして」と訳す
  alternative: 「贈り物として」または「好意によるものとして」
  rationale: この節は、働きに基づく支払いが無償の恵みではなく負債として計上されるという対比を述べる。「恵み」を本文に残すことで原語の神学的語彙を保ちつつ、「によるものとして」によって労働・支払いの論理を明瞭にした。
- issue: ὀφείλημα の債務性
  choice: 「支払うべきもの」と訳す
  alternative: 「負債」または「義務」
  rationale: 雇用者が労働者に負う債務という意味を具体的に伝える一方、救いについての体系的結論をこの一節だけに付加しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、パウロの会計的比喩を「賃金」「勘定されます」で保持した。丁寧体により本文としての品位と読みやすさを両立させた。
