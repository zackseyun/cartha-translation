  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: ja
  text: 希望がないのに、彼は希望を抱いて信じました。それは、「あなたの子孫はこのようになる」と言われていたとおり、多くの国民の父となるためでした。[a] [b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 創世記15章5節からの引用。創世記17章5節も参照。
    reason: cross_reference
  - marker: b
    text: 「子孫」に当たるギリシャ語は、直訳すると単数形の「種」で、集合的に子孫を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: 望みえない状況でありながら
  rationale: 通常の期待に反する、またはそれを越える状況を表す。日本語として自然にしつつ、希望が見込めない現実と、それでも抱く希望との逆説を保った。
- source_word: ἐπ’ ἐλπίδι
  choice: 望みを抱いて
  rationale: 直前の「望みえない状況」と対照をなし、アブラハムが希望に立って信じたことを自然な現代日本語で示す。
- source_word: ἐπίστευσεν
  choice: 信じました
  rationale: πιστεύω の基本的な意味を保ち、説明的な神学用語を付加しない。
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: 父となるためでした
  rationale: εἰς τό＋不定詞が持つ目的・結果の両義性を、日本語で不自然にならない範囲で保つ。「ため」は文脈により目的にも帰結にも読める。
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: 多くの国民の父
  rationale: ἔθνη を旧約のアブラハムへの約束に即して「国民」とし、「異邦人」への限定を避けた。
- source_word: κατὰ τὸ εἰρημένον
  choice: 言われていたとおり
  rationale: 先に語られ、今なお有効な言葉であるという完了受動分詞の含意を、自然な表現で示す。
- source_word: Οὕτως ἔσται τὸ σπέρμα σου
  choice: あなたの子孫もこのようになる
  rationale: 創世記15章5節の文脈に沿い、οὕτως を星の数に対応する「このように」、σπέρμα を集合的な「子孫」と訳した。日本語では引用として明瞭で自然である。
theological_decisions:
- issue: アブラハムへの約束における πολλῶν ἐθνῶν の範囲
  choice: 「多くの国民」と訳す
  alternative: 「多くの異邦人」または「多くの民族」
  rationale: ここでは創世記の契約の約束が前景にあり、「異邦人」とすると後のユダヤ人・異邦人対比を過度に持ち込む。「国民」は複数の民から成る約束の広がりを示す。
- issue: εἰς τὸ γενέσθαι の目的と結果
  choice: 「父となるためでした」とし、目的・帰結の幅を残す
  alternative: 「その結果、父となりました」
  rationale: ギリシャ語構文は目的または結果を表しうるため、結果だけに限定せず、信仰と約束された到達点との結び付きを保った。
translation_notes:
  register: 明瞭で現代的な敬体を用いながら、聖書引用には簡潔で dignified な調子を保った。冒頭の παρά／ἐλπίς と ἐπί／ἐλπίς の語遊びは、「望みえない状況」と「望みを抱いて」の反復で再現した。脚注記号は本文中にすべて明示した。
