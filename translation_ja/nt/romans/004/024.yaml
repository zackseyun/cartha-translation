  text: ἀλλὰ καὶ δι’ ἡμᾶς οἷς μέλλει λογίζεσθαι, τοῖς πιστεύουσιν ἐπὶ τὸν ἐγείραντα Ἰησοῦν τὸν κύριον ἡμῶν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/024.yaml
  text: but also for us[a], to whom it will be credited—to us who believe in the one who raised Jesus our Lord from the dead[b],
translation:
  language: ja
  text: それは私たちのためでもあります。すなわち、私たちの主イエスを死者の中からよみがえらせた方を信じる[a]私たちにも、それが数え入れられる[b]ことになるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼する」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「それが認められる」または「それが算入される」とも訳せる。原文では、何が数え入れられるのかは明記されず、前の文脈から補われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ δι’ ἡμᾶς
  choice: それは私たちのためでもあります
  rationale: 前節の「書かれた」という内容を「それは」で受け、ἀλλά καίの対比と付加を「でも」で自然に示した。διά＋対格は、ここでは「私たちを念頭に置いて」という趣旨なので「私たちのため」とした。
- source_word: οἷς μέλλει λογίζεσθαι
  choice: 私たちにも、それが義と認められることになる
  rationale: 与格関係代名詞を「私たちにも」で表し、μέλλειの将来的な含みを「ことになる」で保持した。λογίζεσθαιの目的語は原文では省略されているため「それ」で前文脈を受けつつ、ローマ4章の文脈に即して結果を「義と認められる」と明示した。
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: …方を信じる
  rationale: πιστεύω＋ἐπί（対格）が表す、対象へ向けられた信頼・信仰を、現代日本語で自然な「…を信じる」とした。「信頼する」という含みは脚注に残した。
- source_word: τὸν ἐγείραντα
  choice: よみがえらせた方
  rationale: 神をその行為によって指す実詞的分詞の形を保ち、敬意を伴う自然な日本語とした。
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: 私たちの主イエス
  rationale: 属格の関係を自然な語順で示し、κύριοςは文脈上の称号として「主」とした。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: ἐκの起点と、νεκρῶνが複数形であることを明瞭に表し、復活を指す定型的な日本語とした。
theological_decisions:
- issue: λογίζεσθαιの省略された目的語をどこまで明示するか
  choice: 「それが義と認められる」
  alternative: 「それが認められる」／「義が認められる」
  rationale: ギリシア語では目的語が前文脈から補われる。日本語の「それ」で省略を反映しながら、「義と認められる」によってローマ4章の会計的・法廷的な論旨を明確にした。ただし「義そのものが注入される」といった後代の教理的説明は加えていない。
- issue: πιστεύουσιν ἐπὶの信仰と信頼の含み
  choice: 「…方を信じる」
  alternative: 「…方に信頼する」
  rationale: 通常の日本語として自然な表現を本文に採用しつつ、単なる事実認定ではなく人格的な信頼を含み得ることを脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「よみがえらせた」は一般読者に自然な表記とし、「死者の中から」によって原文の複数形と起点を保った。前節から続く文であるため、冒頭の「それは」が前節の「書かれた」という趣旨を受ける構成にした。
