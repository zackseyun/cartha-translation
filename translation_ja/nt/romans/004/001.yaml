  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: ja
  text: それでは、肉によれば私たちの祖先であるアブラハム[a][b]が何を見いだしたと、私たちは言うべきでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉によれば」は、血筋または身体的な系譜に関して、という意味。より平易には、「血筋の上で私たちの祖先であるアブラハム」。
    reason: lexical_alternative
  - marker: b
    text: 「肉によれば」を「見いだした」に結び、「アブラハムが人間的な手段によって、または人間的な観点から何を見いだしたのか」という意味に取ることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: それでは、……と言えるでしょうか
  rationale: οὖνによる議論の展開と、ἐροῦμενの熟慮を促す修辞的な問いを、自然な現代日本語で表した。
- source_word: εὑρηκέναι
  choice: 見いだした
  rationale: 完了不定詞が示す、アブラハムがある結論または結果に至ったという含みを保つ。「発見した」よりも文脈に広く対応できる。
- source_word: Ἀβραὰμ τὸν προπάτορα ἡμῶν
  choice: 私たちの祖先アブラハム
  rationale: προπάτωρの祖先・始祖という意味と、ἡμῶνによるパウロ側との共有されたつながりを明示した。日本語では同格関係を自然な語順で示した。
- source_word: κατὰ σάρκα
  choice: 肉による
  rationale: ここでのσάρξを第一義的には身体的・血統上のつながりと理解しつつ、パウロ特有の「肉」という語を残し、別の係り受けの可能性も脚注で保持した。
theological_decisions:
- issue: κατὰ σάρκαの係り先
  choice: 「祖先アブラハム」を修飾し、身体的・血統上の祖先関係を表すものとして本文を構成した。
  alternative: 「見いだした」にかかり、アブラハムが人間的な手段または肉の観点によって何を見いだしたのか、と問う読み。
  rationale: 語の並びと同格表現は、アブラハムと「私たち」との祖先関係を限定する読みを自然に支持する。ただしギリシア語には係り受けの曖昧さが実在するため、別の読みを脚注に明記した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。「肉による」は日常語としてはやや硬いが、パウロの語彙と解釈上の緊張を保つため本文に残し、血統上の意味を脚注で説明した。
