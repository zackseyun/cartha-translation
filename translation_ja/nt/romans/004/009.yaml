id: ROM.4.9
reference: Romans 4:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: ja
  text: では、この幸いは、割礼を受けた人たちだけに及ぶのですか。それとも、割礼を受けていない人たちにも及ぶのですか。私たちはこう言うのです。「アブラハムの信仰は義[a]と認められた。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「正義」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρισμός
  choice: 幸い
  rationale: 直前の4:6–8で宣言された幸いな状態を指す。「祝福」よりも引用とのつながりが明確で、現代日本語として自然である。
- source_word: περιτομή
  choice: 割礼を受けた者
  rationale: 字義的には「割礼」だが、ここでは割礼によって区別される人々を指す換喩なので、指示対象を明確にした。
- source_word: ἀκροβυστία
  choice: 割礼を受けていない者
  rationale: 字義的には「無割礼」だが、ここでは人々を指すため、対比が明瞭な自然な日本語とした。
- source_word: πίστις
  choice: 信仰
  rationale: この創世記引用とパウロの議論では、意味を狭めたり別の神学的含意を加えたりしない標準的な訳語である。
- source_word: ἐλογίσθη
  choice: 認められた
  rationale: λογίζομαιの算定・勘定の比喩を、日本語で理解しやすく表す。受動態を保ち、神を明示的主語として補わない。
- source_word: εἰς δικαιοσύνην
  choice: 彼にとって義と
  rationale: 「義として」という関係を保ちつつ、τῷ Ἀβραὰμの与格を自然に表現する。信仰と義の関係を説明的に展開しない。
- source_word: δικαιοσύνη
  choice: 義
  rationale: パウロの議論における神の前での正しい立場を簡潔に伝える定着した訳語であり、「正義」という語義の可能性は脚注に残す。
theological_decisions:
- issue: アブラハムの信仰と義との関係
  choice: 「アブラハムの信仰は、彼にとって義と認められた」
  alternative: 「アブラハムの信仰は、義として彼の勘定に入れられた」
  rationale: 原文が述べる算定関係を保ち、それが成立する仕組みについて特定の教理体系を訳文へ持ち込まない。
- issue: 受動態で暗示される行為者
  choice: 行為者を明示しない
  alternative: 「神はアブラハムの信仰を義と認めた」
  rationale: 文脈上は神が想定されるが、原文の神的受動態を保ち、本文にない主語を明示的に補わない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「だけのもの」と「にも及ぶ」で二つの集団への適用範囲を自然に問い、引用部では原文の神学的緊張と受動表現を保持した。
