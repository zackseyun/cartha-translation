  source_fidelity: 全体として原文に忠実であり、割礼・無割礼がそれぞれ人々を指す換喩である点も適切に明示されている。ただし、引用の τῷ Ἀβραὰμ は「彼にとって」よりも、属格を用いた自然な日本語で「アブラハムの信仰」とするほうが、受益を示すようにも読める余分な含みを避けつつ、原文の算定表現を明瞭に保てる。
  naturalness: 「私たちは言っています」および引用後の「と。」は、現代標準日本語としてやや不自然である。「私たちはこう言うのです」として引用を受ける構文に改める。
  terminology: 「幸い」「割礼を受けた人たち／受けていない人たち」「信仰」「義」「認められた」は、文脈とパウロ書簡の用語法に適合する。「正義」の脚注は英語監査記録の語彙代案を保持している。
