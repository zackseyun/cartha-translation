id: ROM.4.20
reference: Romans 4:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: ja
  text: 'しかし、神の約束に関して、不信仰によって心が揺らぐことなく[a]、かえって信仰において強められ[b]、神に栄光を帰しました。


    [a] 「不信仰のために疑うことなく」とも訳せる。

    [b] 「信仰によって強められ」とも訳せる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不信仰のために疑うことなく」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「信仰によって強められ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: しかし、神の約束に関して
  rationale: εἰςを方向ではなく関連・対象を示す表現として訳し、δέの穏やかな対比を「しかし」で表した。ἐπαγγελίαは文脈どおり「約束」とした。
- source_word: οὐ διεκρίθη
  choice: 心が揺らぐことなく
  rationale: διακρίνωがここで表す、内面的に二分されてためらう、あるいは揺らぐという意味を自然な日本語で表し、単なる知的疑念に限定しなかった。
- source_word: τῇ ἀπιστίᾳ
  choice: 不信仰によって
  rationale: 与格を原因・手段として読める形で示した。ただし様態や領域の含みもあり得るため、脚注で別訳を示した。
- source_word: ἀλλὰ ἐνεδυναμώθη
  choice: かえって……強められ
  rationale: ἀλλάの強い対比を「かえって」で表し、受動形を保って、強めた主体を本文以上に特定しないようにした。
- source_word: τῇ πίστει
  choice: 信仰において
  rationale: 与格を信仰という領域・状態として表し、「不信仰によって」との対照を保った。手段としての読みも可能なので脚注に残した。
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: 神に栄光を帰しました
  rationale: 日本語の聖書的かつ自然な慣用表現を用いた。分詞が前の動作に伴うことは、述語を連ねることで示した。
theological_decisions:
- issue: アブラハムの反応を単なる知的な疑いとするか、より広い内面的・信仰的な揺らぎとするか
  choice: 不信仰によって心が揺らぐことなく
  alternative: 不信仰のために疑うことなく
  rationale: διακρίνωを単なる知的疑念に狭めず、信仰において強められたこととの修辞的対比を保った。
- issue: τῇ πίστειを領域・状態と取るか、手段と取るか
  choice: 信仰において強められ
  alternative: 信仰によって強められ
  rationale: ギリシア語の与格はどちらにも理解できるため、本文では領域的な読みを採り、手段的な読みを脚注に保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロ書簡にふさわしい品位を保った。「心が揺らぐ」は一般読者にも理解しやすく、原文の内面的な葛藤の含みを伝える。「神に栄光を帰す」は定着した自然な宗教表現として採用した。
