  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: ja
  text: 主が罪を決してその人の勘定に入れない人は、幸いである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主が罪を決してその人に帰さない人は」とも訳せる。
    reason: λογίζομαιは会計上「勘定に入れる」のほか、罪をその人に帰属させる意味合いでも用いられる。
lexical_decisions:
- source_word: μακάριος
  choice: 幸いである
  rationale: 単なる主観的な幸福感ではなく、神の恵みを受けた者の祝福された状態を表す聖書的な言い回しとして訳した。
- source_word: ἀνήρ
  choice: 人
  rationale: ここでは男性だけを指すのではなく、代表的・一般的な意味で用いられている。日本語の「人」はその範囲を自然かつ正確に表す。
- source_word: οὗ
  choice: その罪を…人
  rationale: 属格関係を日本語では「その人の罪」に当たる「その罪」として表し、文全体を自然な関係節にした。
- source_word: οὐ μὴ
  choice: 決して…ない
  rationale: 接続法とともに用いられた強い否定を、明確で自然な現代日本語で表した。
- source_word: λογίσηται
  choice: 勘定に入れない
  rationale: ローマ4章に通底する計算・会計の比喩を保ちつつ、「帰する」のような専門的神学用語に限定しない表現とした。
- source_word: κύριος
  choice: 主
  rationale: 聖書引用の文脈にふさわしい、κύριοςの標準的な訳語を用いた。
- source_word: ἁμαρτίαν
  choice: 罪
  rationale: ギリシア語の単数形を、罪を一つの事例に限定しない集合的・類概念的な日本語として表した。
theological_decisions:
- issue: 罪を「数える」ことの意味
  choice: 勘定に入れない
  alternative: その人に帰さない
  rationale: 法廷的・神学的な含意を排除はしないが、それだけに狭めず、本文と周辺文脈にあるλογίζομαιの会計的比喩を保った。
- issue: ἀνήρの代表的用法
  choice: 人
  alternative: 男
  rationale: 文法上は男性単数だが、この祝福の対象を男性に限定する意図はない。日本語では「人」が代表的用法を最も自然に伝える。
translation_notes:
  register: 明瞭な現代標準語を用いながら、詩編からの引用にふさわしい簡潔で格調ある断定表現とした。
