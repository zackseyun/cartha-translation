  terminology: δικαιοσύνηはパウロ書簡の用語として「義」を維持する。ἐλογίσθηには「数えられた」を用い、会計・算定の比喩を保つ。「認められた」は脚注の代替表現として可能だが、本文ではより語義に近い「数えられた」が望ましい。
