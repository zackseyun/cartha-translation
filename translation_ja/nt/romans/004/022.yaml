  text: ⸀διὸ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/022.yaml
  text: Therefore it was counted to him as righteousness[a][b].
translation:
  language: ja
  text: それゆえ、それは彼の義として数えられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼の義と認められた」「彼の義としてみなされた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: それゆえ
  rationale: 直前の議論から導かれる結論を示す接続語として、論理的なつながりを明確に保つ。
- source_word: ἐλογίσθη
  choice: 認められた
  rationale: 受動形を保ちつつ、計算・勘定に入れることから評価・認定へ及ぶ語義を、現代日本語で自然に表す。別訳は脚注に示す。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 与格の人的対象を自然に表し、文脈上のアブラハムへの指示を保つ。
- source_word: εἰς
  choice: 義と
  rationale: λογίζομαι と εἰς の構文が示す評価・位置づけを、日本語の「〜と認める」で自然に表す。
- source_word: δικαιοσύνην
  choice: 義
  rationale: パウロ書簡における δικαιοσύνη の法的・関係的な含みを過度に限定せず、聖書文脈で定着した簡潔な語を用いる。
theological_decisions:
- issue: パウロの勘定・認定の比喩を、教理的説明を付加せずにどう表すか
  choice: それは彼に義と認められた
  alternative: それは彼に義として数えられた／それは彼の義とみなされた
  rationale: ギリシア語の受動表現と評価・勘定の比喩を保ちつつ、何が「それ」に当たるか、また行為主体が誰かを本文以上に明示しない。
translation_notes:
  register: 簡潔で格調のある現代標準日本語。主語「それ」を残して直前のアブラハムの信仰との結びつきを保ち、神を明示的主語として補わない。
