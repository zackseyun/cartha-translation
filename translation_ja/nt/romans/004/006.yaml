id: ROM.4.6
reference: Romans 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: ja
  text: 同じように、ダビデも、神が行いとは別に義[b]をその人のものとして認める人の幸いについて語っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「認める」は、「数に入れる」「勘定に入れる」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「義」は、「正しさ」または「正義」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: 同じように
  rationale: 直前の議論とダビデの言葉を比較する接続表現として、自然な現代日本語で比較の働きを保つ。
- source_word: καὶ
  choice: も
  rationale: ダビデをさらにもう一人の証言者として加える付加的な意味を表す。
- source_word: λέγει
  choice: 語っています
  rationale: 引用導入句の現在形を保ちつつ、「幸いについて」という目的語に自然につながる表現とした。
- source_word: μακαρισμός
  choice: 幸い
  rationale: 祝福された状態、または幸いであるとの宣言を指す名詞。日本語では「幸い」が簡潔で、次節の引用にも自然につながる。
- source_word: ἀνθρώπου
  choice: 人
  rationale: 代表的・一般的な単数の人を表す。日本語の「人」は原文の意味を性別に限定せず自然に伝える。
- source_word: λογίζεται
  choice: その人のものと認めてくださる
  rationale: 何かを人の勘定に入れるという比喩的意味を、現代日本語で明瞭に表す。「義と認める」だけでなく、目的語の「義」を保った。
- source_word: δικαιοσύνην
  choice: 義
  rationale: パウロ書簡における神との関係上の正しさを含む主要な訳語として、簡潔で確立した「義」を用いる。
- source_word: χωρὶς ἔργων
  choice: 行いとは別に
  rationale: 神が義を認めることと、人の行いとを根拠の上で切り離す対比を、原文どおり曖昧化せず表す。
theological_decisions:
- issue: λογίζεται δικαιοσύνην の会計的・法廷的比喩
  choice: 義をその人のものと認めてくださる
  alternative: 義とみなしてくださる／義をその人に数え入れる
  rationale: 神が「義」を人に帰属させるという文法関係を保ちながら、専門的な神学用語に依存しない自然な日本語とした。
- issue: χωρὶς ἔργων における行いとの関係
  choice: 行いとは別に
  alternative: 行いなしに／行いによらず
  rationale: 「行い」の種類や範囲を本文以上に限定せず、神が義を認めることが行いから切り離されているという原文の緊張を保つ。
- issue: δικαιοσύνη の意味領域
  choice: 義
  alternative: 正しさ／正義
  rationale: パウロ的な用法を一語に狭めず、確立した「義」を本文に置き、日常語に近い選択肢を注で示す。
translation_notes:
  register: 明瞭な現代標準語を用い、引用へ続く文として品位のある語調にした。「くださる」は神の恵み深い行為を日本語として自然に表す敬語だが、原文にない感情的な強調は加えていない。
