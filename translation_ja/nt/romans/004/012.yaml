  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: ja
  text: また、ただ割礼を受けているだけでなく、私たちの父アブラハムが割礼を受けていなかった時に抱いていた信仰の足跡に従って歩む、割礼を受けた者たちの父となるためでした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「割礼の父」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: 割礼を受けた者たち……の父
  rationale: 直訳の「割礼の父」は日本語では儀式の創始者という意味にも取られやすい。与格句が示す対象を明示し、アブラハムが割礼を受けた共同体の父であるという文脈上の意味を自然に表した。字義的形は脚注に残した。
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: ただ割礼を受けているだけでなく
  rationale: 字義的には「割礼からの者だけでなく」に近いが、外面的な割礼だけではないという対比が明瞭になる現代日本語にした。
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: 足跡をもたどる
  rationale: στοιχέωの「歩調を合わせて進む」とἴχνοςの「足跡」という追随の比喩を、自然な日本語の一つの表現として保持した。
- source_word: πίστεως
  choice: 信仰
  rationale: この文脈ではアブラハムが神を信じたことを指し、「誠実さ」より「信仰」が適切である。
- source_word: ἐν ἀκροβυστίᾳ
  choice: 割礼を受けていなかった時に
  rationale: アブラハムが割礼前の状態で信じたという時間的・状態的意味を、分かりやすい日本語で表した。
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: 私たちの父アブラハムが……持っていた
  rationale: 属格関係を日本語の節に展開しつつ、パウロの共同体的呼称「私たちの父アブラハム」を保持した。
theological_decisions:
- issue: アブラハムの父性が、割礼を受けた者一般に無条件で及ぶのか
  choice: 割礼を受けているだけでなく、アブラハムの信仰の足跡をたどる者たちに限定される構文とした。
  alternative: アブラハムは、信仰の有無にかかわらず、割礼を受けたすべての者の父である。
  rationale: οὐκ…μόνον ἀλλὰ καί以下は、割礼を受けた集団を修飾し、外面的な割礼に加えてアブラハムの信仰に倣うことを述べている。説明を加えすぎず、原文の限定を構文で示した。
translation_notes:
  register: 前節から続く目的表現であるため、文末を「父となるためでした」とした。現代の一般読者に明瞭でありながら、聖書本文にふさわしい端正さを保ち、「信仰の足跡」という原文の比喩も残した。
