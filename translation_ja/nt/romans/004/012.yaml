revisions:
- from: また、割礼を受けた者たち、すなわち、ただ割礼を受けているだけでなく、私たちの父アブラハムが割礼を受けていなかった時に持っていた信仰の足跡をもたどる者たちの父となるためでした。[a]
  to: また、ただ割礼を受けているだけでなく、私たちの父アブラハムが割礼を受けていなかった時に抱いていた信仰の足跡に従って歩む、割礼を受けた者たちの父となるためでした。[a]
  rationale: 修飾節を「割礼を受けた者たち」の直前に置き、アブラハムの父性が外面的な割礼だけの者ではなく、アブラハムの信仰に倣って歩む割礼者に関して述べられていることを明確にした。また、「足跡に従って歩む」として原文の追随・歩行の比喩を保った。
