  source_fidelity: 原文は、アブラハムが「割礼を受けた者たち」の父であることを、単に割礼に属する者ではなく、無割礼の状態にあったアブラハムの信仰の足跡に従って歩む者たちに限定している。改訂文はこの限定を明確に保つ。「信仰の足跡に従って歩む」は、στοιχοῦσιν（歩調を合わせて歩む）とτοῖς ἴχνεσιν（足跡に）の比喩をより直接に反映する。
  naturalness: 現行文の「信仰の足跡をもたどる者たち」は理解できるが、原文の「足跡に従って歩む」という歩行の比喩を弱める。「割礼を受けた者たち」を修飾節の後に置くことで、限定される対象が明瞭になり、現代標準日本語としても自然である。
  terminology: 「割礼」「信仰」「私たちの父アブラハム」を維持した。「割礼を受けていなかった時」は、ἐν ἀκροβυστίᾳの割礼前という状態・時点を明瞭かつ非専門的に表す。脚注の「割礼の父」は字義的代案として適切である。
