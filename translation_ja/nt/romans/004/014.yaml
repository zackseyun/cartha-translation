id: ROM.4.14
reference: Romans 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: ja
  text: というのも、もし律法による者たちが相続人であるなら、信仰は空しくされており、約束は無効にされているのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: 律法による者たち
  rationale: ἐκ νόμουというパウロの簡潔な表現を保ち、律法との関係によって特徴づけられる人々を指す。単に「律法を守る者たち」として意味を限定しない。
- source_word: κληρονόμοι
  choice: 相続人
  rationale: 約束と相続をめぐる文脈に適した、自然で定着した訳語。
- source_word: κεκένωται
  choice: 空しいものとなり
  rationale: 「空にする」という比喩を日本語で自然に表し、信仰が内容または効力を失った状態になっているという完了形の含意を伝える。
- source_word: ἡ πίστις
  choice: 信仰
  rationale: ローマ4章における律法との対比を明瞭に保つ標準的な訳語。
- source_word: κατήργηται
  choice: 効力を失ってしまいます
  rationale: 約束が消滅したというより、働かず無効なものにされたという意味を表し、完了形の結果状態も自然な日本語で示す。
- source_word: ἡ ἐπαγγελία
  choice: 約束
  rationale: 直前から論じられている特定の約束を指す、簡潔で自然な訳語。
theological_decisions:
- issue: 律法と対比される πίστις の訳
  choice: 信仰
  alternative: 信頼、真実
  rationale: この文脈では相続が律法によるのか信仰によるのかが対比されており、「信仰」が議論の流れを最も明瞭に保つ。ただし語そのものは文脈により「信頼」「真実」を表し得る。
- issue: οἱ ἐκ νόμου が指す範囲
  choice: 律法による者たち
  alternative: 律法を守る者たち、律法に属する者たち
  rationale: 原文は律法との関係を簡潔に述べるだけであり、完全な律法遵守や特定の民族集団に限定していないため、その曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの論証にふさわしい簡潔で格調ある調子を保った。「もし～なら」により条件文を明示し、二つの完了形は現在に至る結果を自然に表すため「～となり」「～失ってしまいます」とした。
