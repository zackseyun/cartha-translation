id: ROM.4.7
reference: Romans 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: ja
  text: 不法な行いを赦され[a]、罪を覆われた人々は幸いである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「不法を赦され」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: 幸いである
  rationale: 主観的な感情としての「幸福」だけでなく、神の前で祝福された状態を宣言する語感を保つ。現代日本語でも聖書の祝福宣言として自然で格調がある。
- source_word: ἀφέθησαν
  choice: 赦され
  rationale: ἀφίημι の受動態が表す罪責の赦免を、簡潔で自然な日本語にした。完了した出来事とその結果は文脈上十分に伝わる。
- source_word: ἀνομίαι
  choice: 不法な行い
  rationale: 単なる一般的な悪ではなく、法に背く行為という ἀνομία の含意を、現代の読者に分かりやすく示す。「不法」だけより具体的である。
- source_word: ἐπεκαλύφθησαν
  choice: 覆われた
  rationale: 詩篇からの引用にある「覆う」という比喩を解釈的に言い換えず、そのまま保持する。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: ἁμαρτία の標準的で明瞭な訳語であり、ここで説明的に拡張する必要はない。
theological_decisions:
- issue: 「不法な行い」と「罪」の関係
  choice: 二つの語を区別して訳す
  alternative: 両方を「罪」と訳す
  rationale: 詩的な並行関係を保ちつつ、原文の ἀνομίαι と ἁμαρτίαι という関連するが同一ではない二語を反映する。両者の間に本文以上の厳密な神学的区分は設けない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祝福宣言としての格調を保った。日本語として自然な語順にしつつ、「覆われた」という原文の比喩を維持した。
