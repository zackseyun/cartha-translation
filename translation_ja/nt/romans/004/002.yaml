  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: ja
  text: というのも、もしアブラハムが行いによって義と認められた[a]のなら、彼には誇る根拠があります[b]。しかし、神の前で誇ることはできません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「義とされた」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「誇るものがあります」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: もし……のなら
  rationale: γάρによる前節からの論証上のつながりは日本語では文脈に委ね、εἰの条件を自然な「もし……のなら」で明示した。条件が事実か反実仮想かは訳文で決めつけない。
- source_word: Ἀβραὰμ
  choice: アブラハム
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ἐξ ἔργων
  choice: 行いによって
  rationale: ἐκが示す根拠・よりどころを簡潔に表し、義認の根拠としての「行い」という関係を保った。
- source_word: ἐδικαιώθη
  choice: 義と認められた
  rationale: 受動形と法廷的な含意を保ちつつ、現代日本語として理解しやすい表現を採用した。「義とされた」も脚注に残した。
- source_word: ἔχει καύχημα
  choice: 誇る根拠がある
  rationale: καύχημαを単に行為としての「誇り」とせず、誇り得る事柄・根拠という文脈上の意味が自然に伝わるようにした。
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: しかし、神の前ではそうではありません
  rationale: πρὸς θεόνを神の評価・関係における「神の前で」と捉え、直前の「誇る根拠がある」を受ける省略を日本語で自然に補った。
theological_decisions:
- issue: 条件文が現実の可能性を述べるのか、反実仮想を述べるのか
  choice: 「もし……のなら」と直接的な条件文にした
  alternative: 「もし……によって義と認められたのであれば」または反実仮想的な「もし……義と認められたのだとすれば」
  rationale: ギリシア語の条件節そのものは、ここで解釈的な限定を加えずに訳せる。パウロの議論全体から結論を先取りせず、論証の緊張を保った。
- issue: 「神の前ではそうではない」が何を否定するか
  choice: アブラハムには神の前で誇る根拠がない、という直前の内容の否定として訳した
  alternative: 「しかし、神に対してではありません」と関係のみを逐語的に示す
  rationale: 原文の簡潔さを保ちながら、日本語で指示内容が理解できるよう「そう」を補った。人間の前では誇れるという命題を明示的に付加してはいない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神学的な専門語を必要最小限にした。「義と認められた」はパウロの法廷的語感を伝えつつ一般読者にも理解しやすい。「です・ます」調で品位を保った。
