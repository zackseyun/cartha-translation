translation:
  language: ja
  text: この方は、私たちの背きのために引き渡され、私たちが義と認められるために[a][b]よみがえらされました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちが義と認められたために」。
    reason: alternative_reading
  - marker: b
    text: 「義と認められること」は、「無罪と認められること」または「正しい者と宣告されること」とも表現できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: 引き渡され
  rationale: 受動形を保ち、神が行為者であることを暗示しつつ明示しないギリシア語の表現に対応する。現代日本語としても自然である。
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: 私たちの背きのために
  rationale: διά＋対格の因果的意味を表す。「ために」はここでは原因を示し、後半との並行性も保つ。
- source_word: παραπτώματα
  choice: 背き
  rationale: 単なる一般的な「罪」よりも、正しい道や定めから踏み外すという παράπτωμα の含意を伝え、平明な現代日本語にもなる。
- source_word: ἠγέρθη
  choice: 復活させられました
  rationale: 文脈上、死者の中から起こされたことを自然に示しつつ、ギリシア語の受動形と、神が行為者である可能性を保持する。
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: 私たちが義と認められるために
  rationale: 目的・結果を表す解釈を本文に採用し、δικαίωσις の法廷的意味を一般読者に分かる動詞表現で示す。因果的解釈は脚注に残す。
- source_word: δικαίωσιν
  choice: 義と認められること
  rationale: パウロにおける法廷的・救済論的な意味を保ちながら、抽象名詞「義認」より普通の読者に理解しやすい表現とした。
theological_decisions:
- issue: διὰ τὴν δικαίωσιν ἡμῶν が目的・結果を表すか、原因を表すか
  choice: 私たちが義と認められるために
  alternative: 私たちが義と認められたために
  rationale: διά＋対格は通常、原因を表し得るが、この節の並行表現とパウロ的文脈では、復活が信じる者の義認に向けられているという目的・結果の理解が有力である。文法上可能な因果的理解は脚注で明示し、曖昧さを保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」で直前の指示対象を受け、受動表現を保つ。「義認」という専門用語は本文では避け、意味を動詞句で示した。
