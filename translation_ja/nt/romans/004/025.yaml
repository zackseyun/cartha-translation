  source_fidelity: 前半の「私たちの背きのために引き渡され」は、παρεδόθη の受動態と διὰ τὰ παραπτώματα ἡμῶν の因果関係を適切に表している。後半も、本文で目的・結果として「私たちが義と認められるために」とし、因果的な読みを脚注に残すことで、διὰ τὴν δικαίωσιν ἡμῶν の解釈上の幅を保っている。ただし「復活させられました」は現代日本語では、本人が復活するよう強いられたという使役受身にも読め、ἠγέρθη の単純な受動態を明瞭に伝えにくい。
