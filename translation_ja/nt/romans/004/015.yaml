id: ROM.4.15
reference: Romans 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: ja
  text: 律法は怒りをもたらします。しかし、律法のないところには、違反もありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「違反」は、定められた命令や境界を踏み越えることを意味します。
    reason: παράβασιςが一般的な罪ではなく、律法に対する違反を指すことを明確にするため。
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: パウロの議論における命令・規範としての法を表す定着した訳語。本文ではモーセ律法だけに意味を限定せず、冠詞の有無を日本語で不自然に明示しない。
- source_word: ὀργή
  choice: 神の怒り
  rationale: 動作主は原文で明示されないが、文脈上は律法違反に対する神の裁きとしての怒りを指すため、現代日本語で誤解を避けるよう補った。脚注で直訳を示す。
- source_word: κατεργάζεται
  choice: もたらします
  rationale: 律法そのものが怒りを感じるという意味ではなく、怒りという結果を生じさせる因果関係を自然な日本語で表す。
- source_word: οὗ δὲ
  choice: しかし、…ところには
  rationale: δέの緩やかな対比と、οὗの場所を表す関係構文を明瞭に伝える。
- source_word: παράβασις
  choice: 違反
  rationale: 定められた境界や命令を踏み越えることを指す語であり、現代日本語では「違反」が簡潔で明瞭。一般的な罪そのものと同一視せず、律法との関係を保つ。
theological_decisions:
- issue: νόμοςの範囲
  choice: 律法
  alternative: モーセの律法
  rationale: この節は律法と違反の一般原則を述べつつ、モーセ律法を背景としている。本文で「モーセの」と限定することは避け、パウロの語の幅を保った。
- issue: ὀργήの主体
  choice: 神の怒り
  alternative: 怒り
  rationale: 文脈上の神的・司法的意味を明瞭にするため「神の」を補ったが、原文には所有表現がないため、その点を脚注に明記した。
- issue: 律法がないところと罪の関係
  choice: 違反もありません
  alternative: 罪もありません
  rationale: παράβασιςは一般的な「罪」ではなく、明示された法を踏み越える「違反」を指す。したがって、律法がなければ罪そのものが存在しない、という意味には広げない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半と後半の因果・対比を短い二文で示し、神学用語「律法」は保持しつつ、「違反」は日常的に理解できる語を選んだ。
