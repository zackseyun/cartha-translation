  - severity: low
    issue: 「また」が新しい文頭近くに置かれ、並列する目的語の関係が不自然。
    rationale: καὶは「自分の体」と「サラの胎の死んだ状態」を同じκατενόησενの目的語として並列する。一文内で「また」を用いるほうが明確である。
