revisions:
- from: 彼は信仰が弱まることなく、自分の体がすでに死んだも同然であることに目を留めました[a]。彼は百歳ほどであり、またサラの胎も死んだ状態にあったのです。[b]
  to: 彼は信仰が弱まることなく、百歳ほどであった自分の体がすでに死んだも同然であることに目を留め、またサラの胎が死んだ状態にあることにも目を留めました。[a][b]
