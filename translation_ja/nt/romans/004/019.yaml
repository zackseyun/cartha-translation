id: ROM.4.19
reference: Romans 4:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: ja
  text: 彼は信仰が弱まることなく、百歳ほどであった自分の体がすでに死んだも同然であることに目を留め、またサラの胎が死んだ状態にあることにも目を留めました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の本文伝承では、「自分の体がすでに死んだも同然であることには目を留めませんでした」。
    reason: textual_variant
  - marker: b
    text: 「サラの胎が不妊の状態にあった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας τῇ πίστει
  choice: 信仰が弱まることなく
  rationale: 否定辞を伴うアオリスト分詞を自然な従属表現とし、信仰の力が衰えなかったという意味を保った。
- source_word: κατενόησεν
  choice: 目を留めました
  rationale: 現実を意識的に認め、注意深く見据える意味を表す。単なる視覚的観察にも、結論を含む「判断」にも限定しない。
- source_word: νενεκρωμένον
  choice: すでに死んだも同然
  rationale: 完了分詞が示す、生殖能力に関して実質的に死んだ状態を、肉体そのものの死と誤解されない自然な日本語で表した。
- source_word: ἑκατονταετής που ὑπάρχων
  choice: 百歳ほどであり
  rationale: πούの概数性を「ほど」で保ち、分詞句を文脈上の説明として自然に接続した。
- source_word: νέκρωσιν
  choice: 死んだ状態
  rationale: 先行するνενεκρωμένονとの死の語像を保ちつつ、日本語として理解できる表現にした。「不妊」と解釈的に言い換えることは避けた。
- source_word: μήτρας Σάρρας
  choice: サラの胎
  rationale: 具体的な身体像を保ち、聖書本文にふさわしい簡潔で自然な日本語とした。
theological_decisions:
- issue: アブラハムの体とサラの胎に用いられた生殖上の死の比喩をどこまで明示するか
  choice: 「死んだも同然」「死んだ状態」として両方に死の語像を残す
  alternative: 「生殖能力が失われていた」「不妊であった」
  rationale: パウロは同根の死の表現を並べ、神の約束が人間的には不可能な状況を克服することを強調しているため、その神学的緊張を解消しない。
- issue: κατενόησενを含む本文異読
  choice: 「自分の体が…死んだも同然であることに目を留めました」
  alternative: 「自分の体が…死んだも同然であることには目を留めませんでした」
  rationale: SBLGNT本文の肯定形を本文に採用し、否定辞を含む別の本文伝承は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、死をめぐる原文の反復を保持した。「胎」は「子宮」よりやや格調があり、なお一般読者に理解可能な語として選んだ。
