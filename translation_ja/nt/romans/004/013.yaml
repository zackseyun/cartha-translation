id: ROM.4.13
reference: Romans 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: ja
  text: というのも、アブラハムまたはその子孫[a]が世界の相続人となるという約束は、律法によるのではなく、信仰の義[b][c][d]によるものだったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「種」。ギリシア語は単数形ですが、集合的に「子孫」を意味することがあります。
    reason: lexical_alternative
  - marker: b
    text: 「信仰による義」または「信仰から来る義」とも訳せます。
    reason: alternative_reading
  - marker: c
    text: 「義」は、文脈によっては「正義」とも訳せます。
    reason: lexical_alternative
  - marker: d
    text: 「信仰」は、文脈によっては「忠実さ」または「信頼」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: 約束
  rationale: 神から与えられる約束というパウロ書簡での標準的な意味を、自然で明瞭な日本語で表す。
- source_word: σπέρματι
  choice: 子孫
  rationale: ギリシア語は単数形だが集合的に用いられ得るため、現代日本語で自然な「子孫」とした。単数形の「種」という直訳可能性は脚注に残す。
- source_word: κληρονόμον ... κόσμου
  choice: 世界の相続人
  rationale: 相続を表す比喩を明示しつつ、κόσμοςの広い範囲を狭めずに保つ。
- source_word: διὰ νόμου
  choice: 律法による
  rationale: 無冠詞ではあるが、ここでのパウロの議論では律法、とりわけモーセ律法が自然に想定される。「による」は手段・経路を簡潔に表す。
- source_word: δικαιοσύνης
  choice: 義
  rationale: パウロ書簡における法廷的・契約的な含意を保つ標準的な聖書日本語。「正義」という語義も脚注に示す。
- source_word: πίστεως
  choice: 信仰
  rationale: 文脈上、律法と対比される「信仰」が最も自然である。「忠実さ」「信頼」の可能性は脚注に残す。
- source_word: διὰ δικαιοσύνης πίστεως
  choice: 信仰の義による
  rationale: 圧縮された属格構文を解釈的に展開しすぎず、日本語でも理解可能な形で保つ。
theological_decisions:
- issue: δικαιοσύνης πίστεως における属格の関係
  choice: 「信仰の義」と訳し、関係を明示的に限定しない。
  alternative: 「信仰による義」「信仰から来る義」
  rationale: 律法と信仰の対比は明らかだが、この属格句そのものは圧縮されている。由来・手段などの関係を本文で一つに固定せず、原文の神学的緊張を保った。
- issue: αὐτόν の指示対象
  choice: 「彼」とし、文法上の男性単数を保つ。
  alternative: 「アブラハム」または「その子孫」と明示する。
  rationale: 直近の与格句にはアブラハムとその子孫の双方が含まれ、αὐτόνの指示を訳文で過度に確定しないため、原文に対応する代名詞を用いた。
translation_notes:
  register: 明瞭で現代的ながら格調を保つ文体とした。冒頭の γάρ は「というのも……からです」で前節との論理的つながりを示した。「約束は……によるものだった」と補って、日本語として自然にしつつ原文の対比構造を維持した。
