id: ROM.4.11
reference: Romans 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: ja
  text: また彼は、割礼というしるしを、割礼を受けていない時に持っていた信仰による義[a]の証印として受けました。それは、彼が、割礼を受けていないまま[b]信じるすべての人の父となり、彼らにも義が数えられる[c]ためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は「正しさ」とも訳せる。この節の後半も同じ。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「無割礼を通して」。ここでは、割礼を受けていない状態で、という意味。
    reason: lexical_alternative
  - marker: c
    text: 「認められる」「勘定に入れられる」または「信用される」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: しるし
  rationale: 割礼が外面的な指標であることを、解釈的に言い換えすぎず、現代日本語で明瞭に表す。
- source_word: περιτομή
  choice: 割礼
  rationale: ユダヤ教の儀礼を指す標準的で正確な訳語。
- source_word: σφραγίς
  choice: 証印
  rationale: 認証・確証を表す「印」の比喩を保ち、割礼そのものが義をもたらすという含みを避ける。
- source_word: δικαιοσύνη
  choice: 義
  rationale: パウロの議論における法廷的・関係的な広がりを保つ定着した訳語。「正しさ」は脚注に示す。
- source_word: πίστις
  choice: 信仰
  rationale: ここでは義と結び付く信仰を指しており、標準的な「信仰」が文脈に最も適する。
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: 割礼を受けていない時
  rationale: アブラハムの無割礼の状態を時間的に自然な日本語で表す。
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: 信じるすべての人の父
  rationale: 代表者としての「父」というパウロの表現を保ちながら、自然な日本語にする。
- source_word: δι’ ἀκροβυστίας
  choice: 割礼を受けていないまま
  rationale: ここでのδιά＋属格を手段ではなく、信じる人々が置かれている無割礼の状態として表す。
- source_word: λογισθῆναι
  choice: 認められる
  rationale: 義がその人たちのものとして算定される受動形の意味を、過度に専門用語化せず表す。「数えられる」「勘定される」も脚注に残す。
- source_word: καί
  choice: にも
  rationale: 無割礼の信者たちにも義が認められるという包含の意味を自然に明示する。
theological_decisions:
- issue: 割礼と義の関係
  choice: 割礼を、無割礼の時の信仰による義を証明する「しるし」「証印」として訳す。
  alternative: 割礼が義を与える手段であるかのように読める表現。
  rationale: ギリシア語では割礼は、無割礼の状態ですでにあった信仰による義に続く証印として提示される。後代の秘跡論を持ち込まず、この順序を保つ。
- issue: τῆς πίστεως の関係
  choice: 「信仰による義」と訳す。
  alternative: 「信仰の義」または「信仰という義」。
  rationale: 属格の簡潔さには幅があるが、ローマ書4章の文脈では信仰と結び付いて認められる義を指す。「信仰による」は日本語として明瞭で、信仰そのものを義と同一視しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「しるし」と「証印」の比喩を保持した。「無割礼」という術語は脚注だけに置き、本文では「割礼を受けていない」と平易に表現した。
