id: ROM.4.10
reference: Romans 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: ja
  text: では、それはどのような時に数えられたのでしょうか。彼が割礼を受けていた時でしょうか、それとも受けていない時でしょうか。割礼を受けていた時ではなく、受けていない時です。［a］
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς οὖν
  choice: では、どのような時に
  rationale: πῶςは字義的には「どのように」だが、直後の「割礼の状態か、無割礼の状態か」が算定の時点・状況を問うているため、現代日本語では「どのような時に」とすると論旨が明瞭になる。οὖνの推論・論述継続の力は「では」で表した。
- source_word: ἐλογίσθη
  choice: 認められた
  rationale: λογίζομαιの受動形で、前節から補われる「義と」がアブラハムに算定されたことを指す。「認められた」は日本語として自然で、単なる主観的評価ではなく、そのように見なされたという文脈上の意味を伝える。語義の幅は脚注に示した。
- source_word: ἐν περιτομῇ ὄντι
  choice: 割礼を受けていた時
  rationale: 名詞「割礼」と分詞「ある」による状態表現を、時間的な問いとして自然な日本語にした。
- source_word: ἐν ἀκροβυστίᾳ
  choice: 受けていない時
  rationale: ここでは割礼を受けていない状態を指す。対句を明快に保ち、身体部位を指す語の不要な字義訳を避けた。
- source_word: οὐκ ... ἀλλ’
  choice: …ではなく、…です
  rationale: 強い否定と訂正の対照を、簡潔で自然な日本語の構文で保持した。
theological_decisions:
- issue: ἐλογίσθηで省略された内容
  choice: 本文では「義と」を補わず、「認められた」とした
  alternative: 「義と認められた」または「義と見なされた」
  rationale: 前節から内容は明らかだが、ギリシア語本文自体は動詞だけを反復している。省略を保つことでパウロの簡潔な問い方を尊重し、同時に前後の文脈とのつながりを残した。
translation_notes:
  register: 明瞭で現代的な標準日本語。修辞的な問答と「割礼を受けていた時／受けていない時」の対照を保った。脚注記号は節末に置き、主動詞の訳語の幅を示す。
