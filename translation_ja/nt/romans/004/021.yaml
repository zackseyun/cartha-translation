  text: καὶ πληροφορηθεὶς ὅτι ὃ ἐπήγγελται δυνατός ἐστιν καὶ ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/021.yaml
  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: ja
  text: そして、約束した[c]ことを実行することもできると、固く確信していました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「十分に確信していました」「確信しきっていました」。
    reason: lexical_alternative
  - marker: c
    text: ここで省略されている主語は、前後の文脈では神を指します。
    reason: cross_reference
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: 固く確信していました
  rationale: 完全な確信に至っている状態を表す分詞。現代日本語として自然でありながら、確信の強さを保つ。前後の過去の叙述に合わせた。
- source_word: ὅτι
  choice: と
  rationale: アブラハムの確信の内容を導く日本語の引用助詞として自然に訳した。
- source_word: ὃ
  choice: ことを
  rationale: 関係代名詞が指す、約束された内容を日本語で自然に受ける表現。
- source_word: ἐπήγγελται
  choice: 約束した
  rationale: 完了形は、すでになされた約束が効力を保っていることを示す。日本語では簡潔な過去形が文脈上自然で、その継続的な効力は約束という語と周辺文脈から伝わる。
- source_word: δυνατός ἐστιν
  choice: 力もある
  rationale: 原文の現在形を保ち、神の能力を過去の一時点に限定しない。「できる」よりも能力の存在を明示する。
- source_word: καὶ
  choice: も
  rationale: 約束するだけでなく、それを実行する力もあるという付加・強調を自然に表す。
- source_word: ποιῆσαι
  choice: 実行する
  rationale: ここでは約束したことを実現する意味なので、「行う」より明瞭で、「成就する」ほど宗教的な語感に限定されない。
theological_decisions:
- issue: 約束し、実行する力を持つ者の暗黙の主語
  choice: 本文では「神」を補わず、日本語でも主語を省略する
  alternative: 神には、約束したことを実行する力もあると
  rationale: 周辺文脈では神を指すことが明らかだが、この節のギリシア語では主語が明示されていない。日本語の自然な主語省略によって原文の含みを保ち、注で指示対象を示す。
- issue: δυνατός ἐστιν の時制
  choice: 現在の能力として「力もある」
  alternative: 力もあった
  rationale: 原文は現在形であり、神の能力を継続的なものとして述べる緊張を保持する。日本語でも前半の過去叙述と無理なく併存できる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔ながら尊厳のある調子とした。主語省略を生かして原文の構造を保ち、「力もある」で現在形と καί の強調を反映した。
