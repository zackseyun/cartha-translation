id: ROM.7.6
reference: Romans 7:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: ja
  text: しかし今や、私たちは私たちを縛っていたものに対して死んだので[a]、律法から解放されました。それは、御霊の新しさにあって仕えるためであり、文字の古さにあって仕えるためではありません[c][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちが縛られていたものの中で死んだ」とも訳せる。
    reason: ἐν ᾧは「それに対して」と理解できる一方、より形式的には「その中で」とも訳し得るため。
  - marker: b
    text: 「御霊」は「霊」とも訳せる。
    reason: πνεύματοςは文脈上は聖霊を指す読みが有力だが、語そのものはより一般的に「霊」とも理解し得るため。
  - marker: c
    text: 「文字の古さ」は「書かれた規定の古さ」とも訳せる。
    reason: γράμμαは「文字」を意味するが、この文脈では成文化された規定を指すと理解することもできるため。
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: 律法から解放されました
  rationale: 受動形とἀπόの組み合わせを、律法そのものが消滅したという意味ではなく、律法の拘束から解かれたという関係的な意味で表した。
- source_word: ἀποθανόντες
  choice: 死んだので
  rationale: 主語は「私たち」であり、死んだのは律法ではなく信じる者たちであるというギリシア語の文法を保った。分詞の先行事情は日本語で自然な理由・契機の形にした。
- source_word: ἐν ᾧ κατειχόμεθα
  choice: 自分たちを捕らえていたものに対して
  rationale: κατέχωの拘束・捕縛の意味を明瞭にしつつ、関係代名詞の先行内容を過度に限定しない「もの」で表した。ἐνの厳密な関係には曖昧さがあるため別訳を脚注に残した。
- source_word: δουλεύειν
  choice: 仕え
  rationale: 奴隷として仕えるという語感を背景に持つが、この節では奉仕のあり方の対照が中心なので、自然で品位のある「仕える」とした。
- source_word: καινότητι πνεύματος
  choice: 御霊による新しいあり方で
  rationale: καινότηςの抽象的な「新しさ」を、日本語で理解しやすい「新しいあり方」とし、文脈上有力な聖霊の意味を「御霊」で示した。
- source_word: παλαιότητι γράμματος
  choice: 文字による古いあり方
  rationale: καινότηςとの対照を「新しいあり方／古いあり方」で保ち、γράμμαをまず直訳に近い「文字」とした。書かれた規定を指す可能性は脚注に示した。
- source_word: νόμου
  choice: 律法
  rationale: 文脈上モーセの律法を指すため、現代日本語の聖書用語として明確な「律法」を用いた。
theological_decisions:
- issue: 死んだのは律法か、それとも信じる者たちか
  choice: 「私たちは……死んだ」とし、信じる者たちを主語とした。
  alternative: 律法が私たちとの関係において死んだと読む。
  rationale: ἀποθανόντεςは主格複数で、暗黙の主語「私たち」に一致する。律法そのものが死んだとは訳さない。
- issue: πνεύματοςが聖霊を指すか、人間の霊または一般的な霊を指すか
  choice: 御霊
  alternative: 霊
  rationale: パウロにおける「御霊」と「文字」の対照、および新しい契約の文脈から聖霊が有力である。ただし語形自体には限定がないため別訳を脚注に残した。
- issue: γράμματοςの指示範囲
  choice: 文字
  alternative: 書かれた規定
  rationale: パウロの「霊／文字」という緊張を解釈で解消せず、本文では直接的に訳した。文脈上「書かれた規定」を意味する可能性を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「解放されました」「仕える」によって品位と可読性を保った。「新しさ／古さ」の抽象名詞は逐語的にすると日本語では硬く不自然になるため、「新しいあり方／古いあり方」とした。一方、「御霊／文字」というパウロ特有の神学的対照は保持した。
