  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εὑρίσκω ἄρα τὸν νόμον τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν ὅτι ἐμοὶ τὸ κακὸν παράκειται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: ja
  text: そこで私は、善を行いたいと願う自分には悪がすぐそばにある、という法則[a]を見いだします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「法」または「原理」。
    reason: νόμοςはここで、モーセ律法そのものではなく、働いている一定の原理や規則性を指す可能性があるため。
lexical_decisions:
- source_word: Εὑρίσκω
  choice: 見いだします
  rationale: 現在形が表す、今まさに認識している事実を自然な日本語で示す。
- source_word: ἄρα
  choice: そこで
  rationale: 直前までの議論を受けた帰結・推論を、自然な接続表現で示す。
- source_word: τὸν νόμον
  choice: 一つの法
  rationale: νόμοςの語を保ちつつ、文脈上は繰り返し現れる原理や法則を指し得るという緊張を残す。「律法」ではモーセ律法に限定して読まれやすいため避けた。
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: 善を行いたいと願う自分には
  rationale: 与格構文を日本語として明瞭にしながら、θέλωの意志・願望と「善を行う」という内容を保持する。
- source_word: τὸ καλὸν
  choice: 善
  rationale: 実体詞的な形容詞を、簡潔で格調を保つ日本語として訳す。
- source_word: τὸ κακὸν
  choice: 悪
  rationale: 実体詞的な形容詞を「悪」とし、「善」との対照を明確に保つ。
- source_word: παράκειται
  choice: すぐそばにある
  rationale: 何かが傍らに置かれ、身近に存在するという語感を自然な現代日本語で表す。
theological_decisions:
- issue: νόμοςがモーセ律法を指すのか、支配的な原理・法則を指すのか
  choice: 本文では「一つの法」とし、νόμοςの語感と解釈上の余地を保つ。
  alternative: 「法則」「原理」
  rationale: 文脈上は働いている原理を意味する可能性が高い一方、パウロのνόμοςという表現が持つ律法との響きを消さないため、一義的に「原理」とはしない。日本語の「律法」はモーセ律法に限定する印象が強いため採用せず、代替訳を脚注に示す。
translation_notes:
  register: 明瞭な現代標準語を用い、「善」と「悪」の対照には簡潔で格調ある表現を採用した。「自分には」によってギリシア語の与格を反映しつつ、文全体が不自然にならないよう整えた。
