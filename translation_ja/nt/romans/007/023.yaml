id: ROM.7.23
reference: Romans 7:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: ja
  text: しかし私は、自分のからだの各部分に別の律法[a]があり、それが私の思いの律法に対して戦いを挑み、私をからだの各部分にある罪の律法のもとに捕らえているのを見ます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで繰り返される「律法」は、「原理」または「力」と訳すこともできる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「罪の律法の中に捕らえている」。「罪の律法のもとに」は、その支配下に捕らえられるという意味を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: 見ます
  rationale: 現在形の生き生きとした認識を保ち、解釈を加えすぎない直接的な表現とした。
- source_word: ἕτερον νόμον
  choice: 別の律法
  rationale: 直前まで語られている律法との対照を示すἕτερονを「別の」とし、νόμοςの反復を「律法」で保持した。
- source_word: ἐν τοῖς μέλεσίν μου
  choice: 私のからだの各部分に
  rationale: μέληの具体的な身体性を保ちながら、現代日本語で分かりやすく表現した。「肢体」より平明で、「からだ」だけより原文に近い。
- source_word: ἀντιστρατευόμενον
  choice: 戦いを挑み
  rationale: 相手に対して軍事行動を取るという語の戦争の比喩を、自然で力のある日本語で保った。
- source_word: τῷ νόμῳ τοῦ νοός μου
  choice: 私の思いの律法に対して
  rationale: νοῦςを、理性と意志を含みうる広い内的機能として「思い」と訳し、対抗関係を明示した。
- source_word: αἰχμαλωτίζοντά με
  choice: 私を…捕らえています
  rationale: 捕虜にするという軍事的イメージを保ち、先行する「戦い」とのつながりを示した。
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: 罪の律法のもとに
  rationale: 前置詞ἐνの形は注で示しつつ、捕囚による支配・拘束を日本語として自然に表すため「のもとに」とした。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 語の通常の神学的・倫理的意味を過不足なく表す標準的な訳語である。
theological_decisions:
- issue: この節で反復されるνόμοςを「律法」とするか、「原理」「力」などと解釈的に訳すか。
  choice: すべて「律法」と訳す。
  alternative: 文脈に応じて「原理」または「力」と訳し分ける。
  rationale: 原文におけるνόμοςの意図的な反復と、神の律法、思いの律法、罪の働きの間にある緊張を保持し、その意味を一つの解釈に限定しないため。
- issue: ἐν τῷ νόμῳ τῆς ἁμαρτίαςが位置を表すのか、罪の律法への服従・支配を表すのか。
  choice: 本文では「罪の律法のもとに」とし、捕囚による支配の含意を自然に表す。
  alternative: 形式的に「罪の律法の中に」と訳す。
  rationale: αἰχμαλωτίζωとの結び付きでは、単なる空間的位置よりも捕らえられた状態と支配関係が前面に出る。ただし、ἐνの字義的な形は脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、戦争と捕囚の比喩、および「律法」の反復を保持した。「肢体」は避け、「からだの各部分」として一般読者にも分かりやすくした。
