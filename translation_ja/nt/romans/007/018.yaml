id: ROM.7.18
reference: Romans 7:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: ja
  text: 私は、私のうちに、すなわち私の肉のうちに、善が住んでいないことを知っています。善を行おうとする意志は私にありますが、善を行うことはありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「善を行うことは〔私に〕ない」。ギリシア語の末尾は「ない」とだけ記す省略表現です。
    reason: textual_ellipsis
lexical_decisions:
- source_word: οἶδα
  choice: 私は知っています
  rationale: 完了形ながら現在の意味を持つ動詞として、明瞭で自然な現代日本語にした。
- source_word: οἰκεῖ
  choice: 住んでいない
  rationale: 内住の比喩を保つため、「存在しない」などに平板化せず「住む」を用いた。
- source_word: ἀγαθόν
  choice: 善
  rationale: 実体詞的な中性単数形を、道徳的な善という抽象概念として簡潔に表した。否定辞と合わせて「善が住んでいない」とした。
- source_word: σάρξ
  choice: 肉
  rationale: パウロの表現と神学的緊張を保ち、「罪深い性質」などの解釈的言い換えを本文に持ち込まないため。
- source_word: τὸ θέλειν
  choice: 善をしようとする意志
  rationale: 実体詞的な不定詞を自然な日本語で表し、文脈上その意志が善へ向かうことを明示した。
- source_word: παράκειταί μοι
  choice: 私にあります
  rationale: 直訳的な「傍らにある」より自然でありつつ、意志が本人に備わっているという近接・存在の意味を伝える。
- source_word: τὸ κατεργάζεσθαι τὸ καλόν
  choice: 善を行うこと
  rationale: 実体詞的不定詞と目的語を、簡潔で自然な表現にした。κατεργάζεσθαι の遂行・実行の意味を「行う」で表した。
- source_word: οὔ
  choice: できないのです
  rationale: 末尾の省略された否定を文脈に即して補った。ただし、単なる不在より能力不能を前面に出すため解釈性があり、脚注で別訳を示した。
theological_decisions:
- issue: 道徳的文脈における σάρξ の訳
  choice: 肉
  alternative: 罪深い性質
  rationale: 「肉」は身体だけを意味するとも、罪深い性質を完全に定義するとも限らない。ここでは原語の多義性とパウロ自身の対比を保ち、教派的・体系的解釈を本文で確定しない。
- issue: 節末の省略表現 οὔ の補い方
  choice: 善を行うことはできない
  alternative: 善を行うことは私にない／善を行うことは伴わない
  rationale: 日本語として意味を完結させるため補語が必要であり、文脈上の実行不能を自然に表した。一方、ギリシア語は単に「ない」と省略的に述べるため、代案を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「肉」「住む」というパウロの比喩的語彙を保持した。「善をしようとする意志」は日常的に理解でき、かつ抽象名詞としての対比も保つ。
