id: ROM.7.12
reference: Romans 7:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε ὁ μὲν νόμος ἅγιος, καὶ ἡ ἐντολὴ ἁγία καὶ δικαία καὶ ἀγαθή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: ja
  text: したがって、律法は聖なるものであり、戒めも聖なるものであり、正しいものであり、良いものです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: したがって
  rationale: 直前の議論から導かれる結論を示す推論的な接続語として、明瞭で自然な日本語にした。
- source_word: νόμος
  choice: 律法
  rationale: 文脈上モーセの律法を念頭に置きつつ、パウロの簡潔な表現を過度に限定せず保持する。
- source_word: ἅγιος
  choice: 聖なるもの
  rationale: 神に属する聖性と道徳的な清さの両面を保つ、標準的で神学的にも適切な訳語である。
- source_word: ἐντολή
  choice: 戒め
  rationale: 律法に含まれる特定の命令を指し得る語として、自然かつ格調のある現代日本語である。
- source_word: δικαία
  choice: 正しく
  rationale: 戒めが正義にかなっているという評価を自然な日本語で表す。「義である」より一般読者に明瞭である。
- source_word: ἀγαθή
  choice: 良いもの
  rationale: 道徳的な善さと有益な性質の双方を、解釈を加えすぎず簡潔に保つ。
- source_word: μὲν
  choice: 訳語を明示しない
  rationale: 軽い強調を添える助詞だが、対応するδέがなく、日本語では文全体の断定によって十分に表現できる。
theological_decisions:
- issue: 「律法」と「戒め」の聖性
  choice: どちらも「聖なるもの」と明言する
  alternative: 「神聖なもの」または「聖い」とする
  rationale: 律法自体を罪とみなさず、その聖性を肯定する原文の神学的緊張をそのまま保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、文末は丁寧体とした。「聖なる」「正しい」「良い」という三つの評価を保持しつつ、日本語として滑らかに読めるよう述語を整えた。
