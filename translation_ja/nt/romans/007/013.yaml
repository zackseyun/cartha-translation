id: ROM.7.13
reference: Romans 7:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: ja
  text: では、善いものが私にとって死となったのでしょうか。決してそうではありません。むしろ、罪が罪として明らかになるために、善いものを通して私に死をもたらしたのです。それはまた、戒めを通して、罪がこの上なく罪深いものとなるためでした。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「戒めを通して、罪が度を越して罪深いものとなるため」とも訳せる。
    reason: καθ’ ὑπερβολὴνの強意を表す別訳。
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: 善いもの
  rationale: 中性形の形容詞が名詞的に用いられているため、抽象性を保ちつつ現代日本語として自然な「善いもの」とした。
- source_word: ἐμοὶ ἐγένετο θάνατος
  choice: 私にとって死となった
  rationale: γίνομαιの述語的な構造を保ち、与格ἐμοίを個人的関係を示す「私にとって」と表した。
- source_word: μὴ γένοιτο
  choice: 決してそうではありません
  rationale: パウロの強い否定を、古風になりすぎない明瞭で力強い日本語にした。
- source_word: ἡ ἁμαρτία
  choice: 罪
  rationale: 人格化された抽象概念としての語感を、そのまま「罪」で保持した。
- source_word: ἵνα φανῇ ἁμαρτία
  choice: 罪が罪として明らかになるために
  rationale: 反復による強調と、罪の本性が露呈するという述語的意味を保った。
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: 善いものを通して
  rationale: 前半の「善いもの」と対応させ、διάの手段的意味を示した。
- source_word: μοι κατεργαζομένη θάνατον
  choice: 私に死をもたらした
  rationale: κατεργάζομαιの「生じさせる、成し遂げる」という結果惹起の意味を自然な日本語で表した。
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: この上なく罪深いもの
  rationale: 程度の甚だしさを表す慣用句と形容詞の組み合わせを、強意を保って明瞭に訳した。
- source_word: διὰ τῆς ἐντολῆς
  choice: 戒めを通して
  rationale: 文脈上、律法に属する個別の命令を指すἐντολήを「戒め」とし、διάの手段的意味を保った。
theological_decisions:
- issue: 善い戒めと死を生み出す罪との関係
  choice: 死をもたらす主体を罪とし、善いものと戒めは罪が働き、その罪深さが露呈する経路として訳した。
  alternative: 戒めそのものが道徳的な意味で死を引き起こしたかのように読める訳。
  rationale: μὴ γένοιτοに続くἀλλὰ ἡ ἁμαρτίαという対照は、責任を善いものではなく罪に帰している。一方、罪が善いものと戒めを通して働くという本文の緊張関係は解消せず保持した。
- issue: 二つのἵνα節の関係
  choice: 第一を「罪が罪として明らかになるため」、第二を「罪がこの上なく罪深いものとなるため」とし、並行する目的・結果の含みを保持した。
  alternative: 二つとも単純な結果だけ、または神の意図だけを明示する訳。
  rationale: ἵναは目的と結果の両方にまたがる含みを持ちうるため、日本語の「ため」で原文の曖昧さを残した。
translation_notes:
  register: 現代標準日本語を用い、修辞疑問と強い否定を明確にした。「善いもの」「罪」「戒め」の反復を保ちつつ、長いギリシア語文は二文に分けて理解しやすくした。
