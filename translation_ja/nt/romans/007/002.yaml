  terminology: 婚姻比喩における νόμος は「法」とし、特定のモーセ律法と断定しないようにします。「結びつけられています」は受動の法的拘束をより明示します。「夫との関係を定める法」は、属格表現を夫自身が法の制定者であるかのように読ませずに伝える表現です。
