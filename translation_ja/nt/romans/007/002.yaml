  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: ja
  text: 結婚している女性は、夫が生きているかぎり、法によって夫に結びつけられています。しかし、夫が死ねば、夫との関係を定める法から解かれます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「夫の法から解かれます」。ギリシア語は、夫との婚姻関係において女性を拘束していた法的な結びつきを指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: 夫のある女
  rationale: 婚姻関係にある女性を表す語句。法的・婚姻的な含みを保ちつつ、現代日本語で明瞭にした。
- source_word: τῷ ζῶντι ἀνδρί
  choice: 夫が生きている間は、夫に
  rationale: 分詞の「生きている」を時間的条件として自然に表し、結びつきの相手が夫であることを明示した。
- source_word: δέδεται
  choice: 結ばれています
  rationale: 完了受動形が示す、結ばれた結果として現在も続く状態を表す。婚姻と法的拘束の双方に適する。
- source_word: νόμῳ
  choice: 律法によって
  rationale: 文脈上は婚姻を規定する法的原則を指すが、ローマ書7章の「律法」との語彙的連続性を保つため「律法」とした。
- source_word: κατήργηται
  choice: 解かれます
  rationale: その律法の効力・拘束から自由になる意味を、婚姻上の結びつきに即して自然に表現した。
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: 夫に関する律法から
  rationale: 属格の圧縮された表現を、夫が律法の制定者であるとの誤解を避けながら、夫との関係を規定する律法という意味で訳した。
theological_decisions:
- issue: νόμῳ／τοῦ νόμουがモーセ律法を特定して指すか、婚姻を拘束する一般的な法的原則を指すか
  choice: 婚姻関係を規定する律法・法的原則として訳す
  alternative: 婚姻に適用されるモーセ律法を直接指すと解する
  rationale: 直接の文脈は婚姻による法的拘束と死による解放であり、最初の νόμῳ は無冠詞である。ただし章全体の「律法」との修辞的連続性を消さないよう、日本語本文では「律法」を用いた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法的比喩にふさわしい端正さを保った。「律法」はローマ書の文脈との語彙的一貫性のため維持し、「夫に関する」によって属格の意味を自然に示した。
