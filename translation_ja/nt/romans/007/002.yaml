revisions:
- from: 夫のある女は、夫が生きている間は、律法によって夫に結ばれています。しかし、夫が死ねば、夫に関する律法から解かれます。[a]
  to: 結婚している女性は、夫が生きているかぎり、法によって夫に結びつけられています。しかし、夫が死ねば、夫との関係を定める法から解かれます。[a]
  rationale: 一般的な婚姻法上の拘束という原文の比喩を明確にしつつ、ローマ書における νόμος の語を「法」として保持しました。本文の「夫との関係を定める法」は、圧縮された「夫の法」の意味を日本語で明瞭にし、脚注にはより直訳的な代案を残しています。
