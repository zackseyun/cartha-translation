id: ROM.7.15
reference: Romans 7:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: ja
  text: 自分がしていることを、私は理解できません。というのも、自分が望むことを行わず、かえって憎んでいることをしているからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: している
  rationale: ここでは実際に行っていることを指す。後続の πράσσω、ποιῶ との微妙な語の違いを日本語で過度に作り分けず、自然な表現を優先した。
- source_word: οὐ γινώσκω
  choice: 理解できません
  rationale: γινώσκω は通常「知る」だが、ここでは自分の行動を認めないというより、その不可解さを述べる文脈なので「理解できない」が適切。
- source_word: θέλω
  choice: 望む
  rationale: 意志・願望を表す語として、文脈に合う明瞭な現代日本語。
- source_word: πράσσω
  choice: 行う
  rationale: 継続的・実践的な行為を自然に表す。「実践する」より一般読者に明瞭。
- source_word: μισῶ
  choice: 憎んでいる
  rationale: 原語の強い否定的感情を弱めずに保持した。
- source_word: ποιῶ
  choice: している
  rationale: 実際に行うことを表す自然な日本語。文末では進行・反復の含みを保つため「している」とした。
theological_decisions:
- issue: 話者の自己理解と意志・行為の対立
  choice: 一人称現在形の葛藤をそのまま保持した
  alternative: 過去の未回心状態、または代表的人間一般を明示する
  rationale: この一節だけでは話者の救済史的・心理的状態を確定できないため、解釈を本文へ持ち込まず、原文の現在形と緊張を残した。
- issue: 最初の γάρ と二番目の γάρ の論理関係
  choice: 第一文を提示し、二番目の γάρ を「というのも」で理由説明として示した
  alternative: 冒頭を「なぜなら」とし、二番目も「なぜなら」と逐語的に反復する
  rationale: 第一の γάρ は前節とのつながりを担うが、単独節の日本語で冒頭を「なぜなら」とすると不自然になりやすい。二番目は「理解できない」理由を説明する機能が明瞭なので「というのも」とした。
translation_notes:
  register: 明瞭な現代標準日本語。荘重さを保ちつつ、硬すぎる「われ」「欲する」「実践する」は避けた。原文の反復構造と、望み・憎しみ・実際の行為の緊張を保持した。
