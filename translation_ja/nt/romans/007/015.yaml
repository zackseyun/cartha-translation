  source_fidelity: 原文の一人称現在形と反復構造を適切に保持している。「理解できません」は οὐ γινώσκω の文脈上の意味を自然に表し、「望むことを行わず、かえって憎んでいることをしている」は πράσσω と ποιῶ の対照、および μισῶ の強さを損なわない。冒頭の γάρ は前節への接続であり、単独提示の日本語本文で明示しない処理は許容範囲である。二つ目の γάρ を「というのも」で理由説明として示すことも妥当である。
