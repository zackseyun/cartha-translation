  - severity: low
    issue: 目的節の連結をより明瞭にできる。
    rationale: 「ものとなり、私たちが…ためです」でも意味は通るが、「ものとなって、私たちが…ようになるためです」とすると、所属の移行と結実という原文の連続した目的の関係を日本語で追いやすい。
