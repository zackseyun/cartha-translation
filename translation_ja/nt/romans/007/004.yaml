id: ROM.7.4
reference: Romans 7:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: ja
  text: したがって、私のきょうだいたち[a]、あなたがたも、メシア[b]の体を通して、律法に対して死なされたのです。それは、あなたがたが別の方、すなわち死者の中からよみがえらされた方のものとなって[c]、私たちが神のために実を結ぶようになるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は字義的には「私の兄弟たち」。男性複数形だが、男女を含む共同体全体への呼びかけにも用いられる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語「クリストス」は「油を注がれた者」という称号。「キリスト」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 字義的には「あなたがたが別の者のものとなるため」。前の節から続く結婚の比喩を踏まえた表現。
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: したがって
  rationale: 直前の結婚の比喩から結論を導く推論・結果の接続を、明瞭な現代日本語で表す。
- source_word: ἀδελφοί μου
  choice: 私のきょうだいたち
  rationale: 直接呼びかける親族語の比喩を保ちつつ、男女を含み得る共同体への呼びかけとして自然に伝える。ギリシア語の形が男性複数であることは脚注に示す。
- source_word: ἐθανατώθητε
  choice: 死んだ者とされました
  rationale: アオリスト受動態を反映し、単に自発的に「死んだ」とせず、彼らに起きた決定的な出来事として表す。「死なされました」より自然で、文脈上の比喩にも適する。
- source_word: τῷ νόμῳ
  choice: 律法に対して
  rationale: 死の比喩を補う与格を直截に保ち、律法との従来の拘束関係が終わったという文脈上の含意を過度に説明しない。
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: メシアの体を通して
  rationale: 属格を伴う διά の媒介・手段の意味と、身体を明示する原文を保つ。
- source_word: Χριστοῦ
  choice: メシア
  rationale: Χριστός が「油注がれた者」という称号として持つ意味を表す。日本語で定着した「キリスト」も可能なため脚注に示す。
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: あなたがたが別の方のものとなり
  rationale: 目的を示す不定詞句として訳し、直前から続く婚姻の比喩と、所属先が移るという関係的表現を保つ。
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: 死者の中から起こされた方
  rationale: 冠詞付き受動分詞を「方」として受け、復活についての受動表現と ἐκ νεκρῶν の字義を保つ。
- source_word: ἵνα καρποφορήσωμεν
  choice: 私たちが…実を結ぶようになるため
  rationale: 目的を表す ἵνα と結実の比喩を保ち、「あなたがた」から「私たち」への人称の移行もそのまま示す。
- source_word: τῷ θεῷ
  choice: 神のために
  rationale: 神に向けて、また神のために実を結ぶという与格の意味を自然な日本語で表す。
theological_decisions:
- issue: Χριστοῦ を称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: この箇所では救済を成し遂げた方を示す称号としての意味が生きているため「メシア」とした。ただし「キリスト」も日本語で定着した正当な訳語であり、脚注で併記する。
- issue: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ にある婚姻・所属の比喩
  choice: 別の方のものとなり
  alternative: 別の方と結ばれ
  rationale: 前節までの婚姻の類比を保ちながら、原文の「別の者のものになる」に近い所属関係を明示する。「結ばれ」は婚姻をより明確にする一方、原文にない説明を強める。
- issue: 律法に対する死の受動性
  choice: 律法に対して死んだ者とされました
  alternative: 律法に対して死にました
  rationale: ἐθανατώθητε の受動態を保持し、信徒自身の自発的行為としてではなく、メシアの体を通して彼らに生じた出来事として表す。行為者は原文が明示しないため補わない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「死んだ者とされました」で受動性を自然に表し、「ものとなり」で婚姻・所属の比喩を保持した。読点は長い論理構造を追いやすくするために配置した。
