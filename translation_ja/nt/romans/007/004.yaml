revisions:
- from: したがって、私のきょうだいたち[a]、あなたがたも、メシア[b]の体を通して、律法に対して死んだ者とされました。それは、あなたがたが別の方、すなわち死者の中から起こされた方のものとなり[c]、私たちが神のために実を結ぶようになるためです。
  to: したがって、私のきょうだいたち[a]、あなたがたも、メシア[b]の体を通して、律法に対して死なされたのです。それは、あなたがたが別の方、すなわち死者の中からよみがえらされた方のものとなって[c]、私たちが神のために実を結ぶようになるためです。
  rationale: 受動態 ἐθανατώθητε を、日本語で「見なされた」と受け取られ得る表現から「死なされたのです」へ改めた。これは行為者を補わずに、メシアの身体を通して起きた決定的な出来事としての受動性を示す。あわせて、後半の目的構文をわずかに整えた。脚注のアンカーと内容はいずれも原文および訳文に適合している。
  reviewer_model: gpt-5.6-terra
