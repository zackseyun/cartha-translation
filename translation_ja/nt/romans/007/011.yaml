id: ROM.7.11
reference: Romans 7:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: ja
  text: というのも、罪は戒めによって機会をとらえ[a]、私を欺き、その戒め[b]によって私を殺したからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「足がかりを得て」。
    reason: lexical_alternative
  - marker: b
    text: 原文では「それ」。ここでは「戒め」を指す。
    reason: pronoun_reference
lexical_decisions:
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節の内容を説明する接続関係を、現代日本語で自然に示す。
- source_word: ἡ ἁμαρτία
  choice: 罪
  rationale: パウロがここで罪を一連の動作の主体として描く擬人的な力を、そのまま保つ。
- source_word: ἀφορμὴν λαβοῦσα
  choice: 機会をとらえ
  rationale: 機会や足がかりを得て利用するという意味を表し、罪の能動性も保つ。
- source_word: διὰ τῆς ἐντολῆς
  choice: 戒めによって
  rationale: διά＋属格の手段・媒介の意味と、単数形の『戒め』を明確に表す。
- source_word: ἐξηπάτησέν με
  choice: 私を欺き
  rationale: 動詞の基本的な意味を明瞭に伝え、接頭辞の強意を不自然に誇張しない。
- source_word: δι’ αὐτῆς
  choice: その戒めによって
  rationale: 女性単数代名詞の先行詞が『戒め』であることを日本語で明確にし、手段の意味を保つ。
- source_word: ἀπέκτεινεν
  choice: 私を殺した
  rationale: 比喩的・神学的な含みを説明で限定せず、原文の強い動詞を直接的に訳す。
theological_decisions:
- issue: 罪の擬人化の程度
  choice: 罪を『機会をとらえ、欺き、殺す』行為主体として訳す。
  alternative: 罪を抽象的な原因として弱めて表現する。
  rationale: 原文では罪が分詞および二つの定動詞の主語であるため、その修辞的・神学的緊張を解消せずに保つ。
- issue: 『その戒めによって』の働き
  choice: 戒めを、罪が欺き殺すために用いた媒介として表す。
  alternative: 戒め自体を欺きや死の究極的原因と解釈して訳す。
  rationale: διάの手段性を保ちつつ、行為主体は一貫して罪であるという原文の構文を維持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、罪を行為主体として描く原文の荘重さと強さを保った。「というのも……からです」により、γὰρの説明的なつながりを自然に示した。
