  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: ja
  text: 私はかつて、律法なしに生きていました。しかし、戒めが来たとき、罪は生き返り[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「息を吹き返し」。
    reason: ἀνέζησεν は「生き返った」「息を吹き返した」と訳し得るため。
lexical_decisions:
- source_word: ἔζων
  choice: 生きていました
  rationale: 単に生活していたという意味ではなく、直後の生と死の対比につながる状態としての「生きていた」を保った。
- source_word: χωρὶς νόμου
  choice: 律法なしに
  rationale: χωρίς の分離の意味を自然な日本語で示し、文脈上の律法への言及を簡潔に表した。
- source_word: ποτέ
  choice: かつて
  rationale: 過去のある時を振り返る簡潔で自然な表現とした。
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: 戒めが来ると
  rationale: 属格独立構文を自然な時の節にしつつ、戒めの到来という出来事性を保った。
- source_word: ἐντολῆς
  choice: 戒め
  rationale: νόμος（律法）との関連、および聖書的な語感を保ちながら、現代日本語として明瞭にした。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 単数形の擬人化された「罪」をそのまま保持した。
- source_word: ἀνέζησεν
  choice: 生き返り
  rationale: 擬人化された罪が生を得る比喩を簡潔に表した。接頭辞 ἀνά- が示し得る「再び」の含みも自然に保つ。
theological_decisions:
- issue: 一人称の発言を、パウロ個人の自伝、イスラエルの代表、または人類一般の経験のいずれと明示するか
  choice: 単純な一人称「私は」を保ち、解釈的な説明を加えない。
  alternative: パウロ自身の経験、イスラエルまたは人類を代表する発言として明示する。
  rationale: この一節のギリシア語だけでは話者の代表性に関する広い解釈問題は決まらないため、曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの対比と罪の擬人化を保った。原文が次節へ続くため、末尾は読点とした。
