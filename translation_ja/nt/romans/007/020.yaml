id: ROM.7.20
reference: Romans 7:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: ja
  text: しかし、もし私が望まないことをしているのなら、それを行っているのは、もはや私ではなく、私のうちに住んでいる罪です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、もし
  rationale: 前節から続く条件的な論証と穏やかな対比を、自然な現代日本語で示す。
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: 私が望まないことをしている
  rationale: 関係代名詞と指示語による対応構造の意味を保ちつつ、日本語として明瞭にした。θέλωは単なる好みより意志を表すため「望まない」とした。
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: それを行っているのは、もはや私ではなく
  rationale: 明示されたἐγώの対比的強調を「私ではなく」で保持し、οὐκέτιを「もはや」と訳した。κατεργάζομαιは先のποιῶと完全に同じ表現にせず「行っている」とした。
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: 私のうちに住んでいる罪
  rationale: οἰκέωの居住の比喩と、罪を主体として語る擬人的表現を説明的に言い換えず保持した。ἁμαρτίαは「罪深い性質」ではなく直接「罪」とした。
theological_decisions:
- issue: 「私」と「私のうちに住んでいる罪」との区別が、本人の責任を否定するように読まれ得る点
  choice: パウロの対比をそのまま「それを行っているのは、もはや私ではなく、私のうちに住んでいる罪」と訳す。
  alternative: 責任や人間論についての解釈を補って意訳する。
  rationale: 本文自体が持つ主体性をめぐる緊張を解消せず、ἐγώとἁμαρτίαの明示的な対比を保持するため。
- issue: ἁμαρτίαを人間の性質として解釈的に訳すか
  choice: 罪
  alternative: 罪深い性質
  rationale: ギリシア語はἁμαρτίαと述べており、σάρξなど別の概念へ置き換える根拠がないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、論証的で荘重な調子を保った。「私のうちに住んでいる罪」により原文の擬人法と神学的緊張を残した。
