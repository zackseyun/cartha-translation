  text: οὐ γὰρ ὃ θέλω ποιῶ ἀγαθόν, ἀλλὰ ὃ οὐ θέλω κακὸν τοῦτο πράσσω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: ja
  text: というのも、私は望む善を行わず、望まない悪を行うからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、前半の「行う」と後半の「行う」に異なる動詞が使われています（ποιῶ／πράσσω）。両者の意味は大きく重なりますが、後半は「実行する」とも訳せます。後半の「これを」に当たる指示語は、「望まない悪」を受けて強調しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: 望んでいる
  rationale: 意志・願望を表す現在形を、文脈に即した自然な現代日本語で表す。
- source_word: ποιῶ
  choice: 行う
  rationale: 広い意味を持つ基本的な動詞として訳し、後半の πράσσω との大きな意味の重なりも保つ。
- source_word: ἀγαθόν
  choice: 善
  rationale: κακόν との倫理的に重い対照を簡潔かつ明確に示す。
- source_word: κακὸν
  choice: 悪
  rationale: 善との直接的な道徳的対照を弱めずに表す。
- source_word: πράσσω
  choice: 行っている
  rationale: 日本語では ποιῶ との不自然な訳し分けを避けつつ、継続的・現実的な行為という含みを「行っている」で示す。別動詞である点は脚注で明示する。
- source_word: τοῦτο
  choice: まさに
  rationale: 前置された指示語の強調を、日本語として自然な焦点表現で保持する。
- source_word: οὐ γὰρ
  choice: というのも……からです
  rationale: γάρ の説明・理由提示の働きを、前後とのつながりが明瞭な現代日本語で表す。
theological_decisions:
- issue: 善悪の対照を弱い倫理表現に言い換えるか
  choice: 「善」／「悪」という直接的な道徳カテゴリーを保持する。
  alternative: 「良いこと」／「悪いこと」または「正しいこと」／「間違ったこと」
  rationale: ἀγαθόν と κακόν の倫理的な重みと対称性を保ち、パウロの葛藤を単なる実用上の成否へ弱めないため。
- issue: 二つの行為動詞 ποιῶ と πράσσω を本文で明確に訳し分けるか
  choice: 本文ではともに「行う」を用い、時制・焦点と脚注で差を示す。
  alternative: 前者を「実行する」、後者を「行う」または「繰り返す」と訳し分ける。
  rationale: 両動詞の意味領域は大きく重なり、この一節だけで習慣性などの明確な神学的区別を断定すると原文以上に解釈を固定するため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「というのも……からです」で γάρ の説明的接続を示し、「まさに」で τοῦτο の強調を自然に再現した。
