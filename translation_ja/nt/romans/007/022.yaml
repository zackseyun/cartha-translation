  text: συνήδομαι γὰρ τῷ νόμῳ τοῦ θεοῦ κατὰ τὸν ἔσω ἄνθρωπον,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/022.yaml
  text: For I delight in the law of God in my inner man,[a]
translation:
  language: ja
  text: 私は、内なる人としては、神の律法を喜んでいます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「内なる自分においては」または「心の内では」。
    reason: 「内なる人」は内面的な自己を指すパウロ特有の表現であり、より意味を明示する訳も可能なため。
lexical_decisions:
- source_word: συνήδομαι
  choice: 喜んでいます
  rationale: 単なる知的同意ではなく、喜びをもって賛同する情意的な意味を自然な現代日本語で表す。
- source_word: τῷ νόμῳ τοῦ θεοῦ
  choice: 神の律法を
  rationale: 与格は動詞の対象として日本語の「を」で表し、νόμοςのパウロ書簡における神学的重みを「律法」で保持する。
- source_word: κατὰ τὸν ἔσω ἄνθρωπον
  choice: 内なる人としては
  rationale: κατάの観点・側面を「としては」で示し、ἔσω ἄνθρωποςというパウロ特有の比喩を保つ。ギリシア語に明示されない所有代名詞は補わない。
theological_decisions:
- issue: 「内なる人」の人間論的含意
  choice: 内なる人としては
  alternative: 私の内面では／内なる自分においては
  rationale: 専門的な人間構成論へ還元せず、原文の比喩と、外なる側面との対照を含み得る表現を保持する。
- issue: κατάが示す関係
  choice: としては
  alternative: に従えば／において
  rationale: 「内なる人」を規範と断定するよりも、「内なる人という側面・観点では」という文脈上の意味を自然に表しつつ、原語の幅を狭めすぎない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「神の律法」「内なる人」によりパウロ的表現を保持し、「としては」で文脈上の対照を自然に示した。
