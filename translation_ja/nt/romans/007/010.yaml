  text: ἐγὼ δὲ ἀπέθανον, καὶ εὑρέθη μοι ἡ ἐντολὴ ἡ εἰς ζωὴν αὕτη εἰς θάνατον·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: ja
  text: 私は死にました。そして、命に至るはずのその戒めが、私には死に至るものだと分かりました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέθανον
  choice: 私は死にました
  rationale: アオリスト能動直説法一人称単数を、過程ではなく生じた出来事として簡潔に表した。
- source_word: εὑρέθη μοι
  choice: 私には…ものだと分かりました
  rationale: 受動形と与格 μοι の経験的・発見的な意味を、現代日本語として自然に表した。
- source_word: ἐντολή
  choice: 戒め
  rationale: 文脈上の律法的な命令を示す単数名詞であり、原文にない「律法の」を補わずに訳した。
- source_word: ἡ εἰς ζωὴν
  choice: 命に至るはずの
  rationale: εἰς の方向・帰結を保ちつつ、単なる目的か期待された結果かを断定しすぎない自然な日本語とした。
- source_word: αὕτη
  choice: その
  rationale: 指示詞の働きを明示し、直前から続く特定の戒めを指すことを示した。
- source_word: εἰς θάνατον
  choice: 死に至るもの
  rationale: 先行する「命に至る」と対応させ、二つの εἰς 句の命と死の対照を保った。
theological_decisions:
- issue: 戒めと死との因果関係をどこまで明示するか
  choice: 「死に至るものだと分かりました」とし、発見された帰結として表す
  alternative: 「私に死をもたらした」「私を死なせた」
  rationale: 原文は戒めが「死に至る」ものと判明したことを述べるが、ここで因果の仕組みを説明しきってはいないため、より強い使役表現を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「命に至る／死に至る」の対句を保持した。文脈に合う荘重さを保ちながら、過度に文語的な表現は避けた。
