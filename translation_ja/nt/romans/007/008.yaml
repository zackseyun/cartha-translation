id: ROM.7.8
reference: Romans 7:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: ja
  text: しかし、罪は戒めを通して機会をつかみ[a]、私の内にあらゆる種類のむさぼり[b]を引き起こしました。というのも、律法がなければ、罪は死んでいるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「足がかりを得て」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あらゆる欲望」。ここでは直前の「むさぼってはならない」という戒めとの関連から、「むさぼり」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμὴν ... λαβοῦσα
  choice: 機会をつかみ
  rationale: 「足がかり・好機を得る」という比喩を、罪が能動的に戒めを利用する表現として自然な現代日本語で保つ。
- source_word: ἡ ἁμαρτία
  choice: 罪
  rationale: 罪を行為主体として描くパウロの擬人化を、そのまま文法上の主語として保つ。
- source_word: διὰ τῆς ἐντολῆς
  choice: 戒めを通して
  rationale: 直前に引用された「むさぼってはならない」という特定の戒めを指す単数形を保ち、戒めが罪に利用される媒介であることを示す。
- source_word: κατειργάσατο
  choice: 引き起こしました
  rationale: 結果を生じさせるという動詞の力を、明瞭で自然な日本語にする。
- source_word: πᾶσαν ἐπιθυμίαν
  choice: あらゆるむさぼり
  rationale: ἐπιθυμία自体は広く「欲望」を意味し得るが、直前の戒めとのつながりから、ここでは「むさぼり」という文脈上の意味を本文に採る。πᾶσανは種類の広がりを示す「あらゆる」とした。
- source_word: χωρὶς ... νόμου
  choice: 律法がなければ
  rationale: 律法から離れた状態を簡潔な現代日本語で表し、νόμοςの定冠詞のない形を過度に限定せず、文脈上のモーセ律法との連続性も保つ。
- source_word: νεκρά
  choice: 死んでいる
  rationale: 「働かない」などと解釈的に弱めず、原文の鮮烈な比喩を保つ。
theological_decisions:
- issue: 罪の擬人化と「死んでいる」という比喩を解釈的に弱めるか
  choice: 罪を行為主体として描き、「死んでいる」をそのまま保つ。
  alternative: 罪を抽象的な傾向として言い換え、「働かない」と訳す。
  rationale: 原文は罪を機会をつかんで結果を生じさせる力として擬人化し、最後に「死んでいる」と断言する。この神学的緊張を説明で解消しない。
- issue: νόμοςを「律法」とするか、一般的な「法」とするか
  choice: 律法
  alternative: 法／法則
  rationale: ローマ7章の文脈ではモーセの律法が前景にあるため「律法」が自然だが、本文は「律法がなければ」とし、その働きの範囲を注釈的に狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、罪の擬人化と「死んでいる」という比喩を保持した。「内」は読みやすさと荘重さの均衡を考えた表記。
