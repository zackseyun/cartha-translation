  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: ja
  text: しかし、自分が望まないことをしているのなら、私は律法が良いものであることを認めているのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、…のなら
  rationale: 条件を示すεἰを「のなら」で、軽い対比・継続を示すδέを「しかし」で自然に表した。
- source_word: ὃ οὐ θέλω τοῦτο
  choice: 自分が望まないこと
  rationale: ギリシア語の相関構文を、意味を保ちながら自然な現代日本語にまとめた。「自分が」は話者自身の意志との対照を明確にする。
- source_word: ποιῶ
  choice: している
  rationale: 現在形の継続的・反復的にも読める含みを保ち、文脈に自然な表現とした。
- source_word: σύμφημι
  choice: 認めている
  rationale: 律法の判断に同意し、その正しさを承認する意味を、平明な日本語で表した。
- source_word: τῷ νόμῳ
  choice: 律法
  rationale: ローマ書の文脈で既知の律法を指す定冠詞付きの表現として訳した。
- source_word: ὅτι καλός
  choice: 良いものであること
  rationale: ὅτι節を「こと」で受け、καλόςが律法の肯定的な性質を述べることを明確にした。
theological_decisions:
- issue: 律法そのものに対する肯定的評価をどう表すか
  choice: 「律法が良いものであることを認めている」
  alternative: 「律法は正しいと同意している」
  rationale: 本文が述べる律法の善性への同意をそのまま保ち、律法の役割や話者の状態について本文以上の解釈を加えないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「律法」は聖書文脈で一般的かつ品位のある語として保持した。文末の「のです」は推論・帰結の調子を自然に示す。
