id: ROM.7.3
reference: Romans 7:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: ja
  text: したがって、夫が生きている間にほかの男の妻になるなら、その女は姦通をした女と呼ばれます[a]。しかし、夫が死ねば、その女はその律法から解放されるので[b]、ほかの男の妻になっても、姦通をした女とはされません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ほかの男と結ばれるなら」、または「ほかの男に属するなら」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「律法」は、直接には婚姻関係を拘束する法的な定めを指します。
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: したがって
  rationale: 直前の説明から導かれる結論を示す二重の推論辞を、自然で明確な現代日本語の接続語で表した。
- source_word: ζῶντος τοῦ ἀνδρός
  choice: 夫が生きている間に
  rationale: 属格独立構文の同時的・時間的意味を明確に示した。文脈上の婚姻関係から ἀνήρ は「夫」とした。
- source_word: μοιχαλὶς
  choice: 姦通した女
  rationale: 女性の姦通者を指す名詞の意味を正確に保ちつつ、現代日本語で理解しやすい表現とした。「姦婦」は簡潔だが古風で侮蔑的にも響きうるため避けた。
- source_word: χρηματίσει
  choice: 呼ばれます
  rationale: この文脈での「呼ばれる、そういう者と見なされる」という指定・公称の意味と未来の力を自然に表した。
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: ほかの男と結ばれるなら／ほかの男と結ばれても
  rationale: γίνομαι と与格が示す、別の男性との関係に入る意味を表した。「妻になる」と断定して原文以上に法的身分を特定せず、婚姻の文脈は「結ばれる」で保った。
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: その律法から解放される
  rationale: 拘束から自由になる意味を自然に表し、νόμος はパウロの語を尊重して「律法」とした。指示語「その」により、直前の婚姻関係を拘束する規定が当面の対象であることを示した。
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: 姦通した女とはなりません
  rationale: 属格の冠詞付き不定詞が表す帰結を、日本語で自然な結果表現にした。
theological_decisions:
- issue: νόμος の範囲
  choice: 本文では「その律法」とし、直近の婚姻関係を拘束する律法を指すことを脚注で説明する。
  alternative: 「婚姻の律法」と明示する、またはモーセ律法全般を指す表現にする。
  rationale: 文脈上の直接的な指示対象を明らかにしつつ、原文の νόμος を狭く言い換えすぎず、より広いパウロ的用法の可能性も本文で排除しない。
- issue: γένηται ἀνδρὶ ἑτέρῳ の関係性
  choice: 「ほかの男と結ばれる」と訳す。
  alternative: 「ほかの男の妻になる」または「ほかの男のものになる」。
  rationale: 婚姻に関する法的類比を伝えながら、原文が「妻」という名詞を明示していない点を尊重する。「ものになる」は現代日本語では所有物化の響きが強いため避けた。
translation_notes:
  register: 明確で品位のある現代標準日本語。法的な論理関係を保ちながら、古風な「姦婦」や所有物化の響きがある表現を避けた。敬体で統一した。
