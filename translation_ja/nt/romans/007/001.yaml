id: ROM.7.1
reference: Romans 7:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: ja
  text: それとも、兄弟たち[a]、あなたがたは知らないのですか。私は律法を知っている人々に話しているのですが、律法が人を支配するのは、その人が生きている間だけです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」と訳した語は男性複数形ですが、ここではパウロが語りかける女性たちも含むと考えられます。
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: それとも
  rationale: 直前の議論を受ける選択的・論証的なつながりを保つ。
- source_word: ἀγνοεῖτε
  choice: あなたがたは知らないのですか
  rationale: 共有されているはずの知識に訴える修辞疑問として、現在の日本語で自然に表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形を本文で保持しつつ、混成の共同体を含み得る呼びかけであることを脚注に示した。
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: 私は律法を知っている人々に話しているのですが
  rationale: γάρの説明的・挿入的な働きと、対象が律法を知る人々であることを明瞭に表した。
- source_word: νόμον / ὁ νόμος
  choice: 律法
  rationale: 文脈上モーセ律法が特に視野に入る一方、ギリシア語が持つ広がりを狭めないよう、一般的な訳語を一貫して用いた。
- source_word: κυριεύει
  choice: 支配する
  rationale: 権威を行使し、主として治めるという語の強さを簡潔に保持した。
- source_word: τοῦ ἀνθρώπου
  choice: 人を
  rationale: 特定の男性ではなく、人間一般を指す代表的単数として訳した。
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: その人が生きている間だけ
  rationale: 存命期間に限って効力が及ぶという時間的限定を自然な日本語で明示した。
theological_decisions:
- issue: νόμοςの範囲
  choice: 「律法」とし、本文では範囲を限定しない
  alternative: 「モーセの律法」または一般的な「法」
  rationale: 直近の論証ではモーセ律法が強く意識されるが、この文言自体はより一般的にも読めるため、その緊張を残した。
- issue: κυριεύειが表す権威の性格
  choice: 「支配する」
  alternative: 「権限を持つ」
  rationale: 法的効力だけに限定せず、動詞が表す支配・統御の強さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問と説明的な挿入を二文に分けて読みやすくした。口語に寄りすぎず、書簡にふさわしい品位を保った。
