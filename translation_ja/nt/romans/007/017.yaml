  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: ja
  text: しかし今では、それを行っているのは、もはや私ではなく、私のうちに住んでいる罪です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし今では、それを行うのは、もはや私ではなく、私のうちに住んでいる罪です。」
    reason: 「κατεργάζομαι」の現在形を、日本語で継続的な「行っている」とするか一般的な「行う」とするかの表現上の選択を示す。
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: しかし今では
  rationale: 直前の議論を受けた論理的・時間的な対照を、自然な現代日本語で示す。
- source_word: οὐκέτι
  choice: もはや……ではなく
  rationale: 行為主体をめぐるパウロの明確な否定と対照を保つ。
- source_word: ἐγὼ
  choice: 私
  rationale: 明示された代名詞の強調を、「行っているのは、もはや私ではなく」という焦点構文で表す。
- source_word: κατεργάζομαι
  choice: 行っている
  rationale: 文脈で問題となっている行為を実行する意味を、簡潔で格調を損なわない日本語にする。
- source_word: αὐτὸ
  choice: それを
  rationale: 前節までに述べられた行為を指す代名詞として、自然に照応させる。
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: 私のうちに住んでいる罪
  rationale: 罪を住む者として描く擬人化と、分詞句による限定をそのまま保つ。
- source_word: οἰκοῦσα
  choice: 住んでいる
  rationale: 「宿っている」などの解釈的な含みを避け、居住の比喩を明瞭に伝える。
theological_decisions:
- issue: 「私」と「私のうちに住む罪」との峻別が、責任回避のように読まれ得ること
  choice: 本文の鋭い区別を説明的に和らげず、そのまま訳す。
  alternative: 内的葛藤や責任を補足する意訳によって誤解を避ける。
  rationale: ギリシャ語本文自体が行為主体を強く対照しており、その神学的緊張を翻訳で解消すべきではない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「私のうちに住んでいる罪」というパウロの重い擬人表現を保持した。「しかし今では」で前文との対照を示し、焦点構文によって明示的なἐγώの強調を自然に再現した。
