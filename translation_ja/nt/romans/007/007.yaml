source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: ja
  text: では、何と言うべきでしょうか。律法は罪なのでしょうか。決してそうではありません。むしろ、律法によらなければ、私は罪を知ることはなかったでしょう。実際、律法が「むさぼってはならない」と言わなかったなら、私はむさぼり[a]が何であるかを知らなかったでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「むさぼり」は「欲望」とも訳せますが、直後に「むさぼってはならない」という戒めが引用されているため、ここではより具体的に訳しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: では、何と言うべきでしょうか
  rationale: パウロの議論を進める修辞的な問いを、現代日本語として自然でありながら格調を保つ形で表した。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 文脈上モーセ律法を指す定着した訳語であり、定冠詞を伴う指示も自然に表せる。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 律法が単に「罪深い」かではなく、罪そのものなのかと問う述語名詞の鋭い表現を保った。
- source_word: μὴ γένοιτο
  choice: 決してそうではありません
  rationale: 強い否定を明瞭な現代標準日本語で表し、単なる「いいえ」より強い拒絶を保った。
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 直前の問いを強く退けた後、律法の実際の働きへ転じる対照を示す。
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: 律法によらなければ、私は罪を知ることはなかったでしょう
  rationale: εἰ μὴによる反実仮想的な含みを自然に表しつつ、γινώσκωの基本的な意味である「知る」を維持した。
- source_word: ἐπιθυμίαν
  choice: むさぼり
  rationale: 語自体は広く「欲望」を意味し得るが、直後に十戒の禁止命令が引用されるため、ここではその文脈に即した「むさぼり」とした。
- source_word: οὐκ ᾔδειν
  choice: 何であるかを知らなかったでしょう
  rationale: 単なる存在認識よりも、むさぼりの性質を律法によって認識したという文意が日本語で明瞭になるよう補った。
- source_word: Οὐκ ἐπιθυμήσεις
  choice: むさぼってはならない
  rationale: 十戒の法的な禁止の力を保ち、日本語聖書の引用としても理解しやすい表現を採用した。
theological_decisions:
- issue: 律法と罪との関係
  choice: 律法は罪なのでしょうか。決してそうではありません
  alternative: 律法は罪深いのでしょうか
  rationale: ギリシア語の述語名詞は、律法が罪深い性質を持つかではなく、律法と罪を同一視できるかを問う。パウロの鋭い問いを弱めずに保った。
- issue: 律法によって罪を知るという関係
  choice: 律法によらなければ、私は罪を知ることはなかったでしょう
  alternative: 律法によるほか、私は罪を知らなかった
  rationale: 律法が罪を生むという意味にせず、罪を認識させる働きを述べる原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞的な問いと強い否定には適度な格調を持たせた。十戒の引用は簡潔で法的な響きを保った。脚注記号[a]は、その対象語句を含む文の末尾に置いた。
