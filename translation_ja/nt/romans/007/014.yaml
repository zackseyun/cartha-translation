  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: ja
  text: 私たちは、律法が霊的なものであることを知っています。しかし、私は肉に属する者であり、罪のもとに売られています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「罪のもとに売られた者」。罪の力のもとへ奴隷として売られ、その支配下にある状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: 私たちは…知っています
  rationale: パウロと読者が共有する確かな認識を表すため、自然で直接的な「知っています」とした。
- source_word: ὁ νόμος
  choice: 律法
  rationale: 文脈上モーセの律法を指す通常の語として、現代日本語の聖書用語「律法」を用いた。
- source_word: πνευματικός
  choice: 霊的なもの
  rationale: 律法が霊に属し、霊の性質にかなうという表現を保ちつつ、由来を「御霊による」と限定しすぎない訳とした。
- source_word: σάρκινός
  choice: 肉に属する者
  rationale: πνευματικόςとの対照を保ち、「罪深い性質」などの解釈的な人間論を持ち込まず、現代日本語として理解できる形にした。異読 σάρκινος は「肉でできた」の含みも持ちうる。
- source_word: πεπραμένος
  choice: 売られています
  rationale: 完了受動分詞が示す、売られた結果として現在その状態にあることを日本語の受動表現で示した。
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: 罪のもとに
  rationale: 罪への従属を表す簡潔な比喩を保持し、「罪の力の支配下」と本文で説明しすぎないようにした。
theological_decisions:
- issue: パウロの「肉」の表現をどこまで解釈するか
  choice: 「肉に属する者」として、霊的な律法との対照を保持する。
  alternative: 「罪深い者」「罪の性質を持つ者」「霊的でない者」
  rationale: 原文は「罪深い性質」に相当する語を明示していないため、後代の教理的定式へ狭めず、σάρκινος の身体性と弱さを含む緊張を残した。
- issue: 「売られた」という比喩の奴隷的含意
  choice: 本文では「罪のもとに売られています」とする。
  alternative: 「罪の奴隷として売られています」「罪の支配下にあります」
  rationale: 売買と従属の比喩を直接保ち、奴隷状態および罪の力という含意は脚注で明らかにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、律法・霊・肉・罪というパウロの対照語を保持した。「私は肉的です」は不自然で意味が狭まりやすいため、「私は肉に属する者」とした。
