id: ROM.7.25
reference: Romans 7:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: ja
  text: 私たちの主イエス・メシアを通して、神に感謝します！ こういうわけで、私自身は、心では神の律法に仕え、肉[a]では罪の律法[b]に仕えています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉」は「罪深い性質」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「罪の律法」は「罪の原理」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: 神に感謝します
  rationale: 与格を伴う感嘆的な定型表現として、神への感謝を自然な現代日本語で表した。
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: 私たちの主イエス・メシアを通して
  rationale: διά＋属格の媒介の意味を「通して」で保持し、Χριστόςはここで称号として「メシア」とした。
- source_word: Ἄρα οὖν
  choice: こういうわけで
  rationale: 直前までの議論を受ける推論的・総括的な移行を、明瞭な日本語で示した。
- source_word: αὐτὸς ἐγώ
  choice: 私自身は
  rationale: 重ねられた代名詞の強調を保持した。
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: 心では……肉では
  rationale: μέν／δέの対照を並行構文で示し、νοῦςとσάρξの緊張を解釈で解消しないようにした。
- source_word: δουλεύω
  choice: 仕えている
  rationale: 隷属の含意を持つ語だが、二つの与格を伴う均衡した文脈では「仕える」が自然であり、従属関係も表せる。
- source_word: νόμῳ θεοῦ / νόμῳ ἁμαρτίας
  choice: 神の律法／罪の律法
  rationale: νόμοςの反復と二項の意図的な並行をそのまま保持した。
theological_decisions:
- issue: パウロの用いるσάρξの訳
  choice: 肉
  alternative: 罪深い性質
  rationale: 原文は罪深い性向を明示する語ではなくσάρξを用いているため、「肉」として人間論的・神学的な緊張を保った。
- issue: νόμος ἁμαρτίαςの意味範囲
  choice: 罪の律法
  alternative: 罪の原理
  rationale: 「原理」は文脈上可能だが、神の律法との語彙的な対照を保持するため、本文では同じく「律法」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。感謝の叫びと、それに続く総括文の切れ目を句点と感嘆符で明確にした。「心」と「肉」、「神の律法」と「罪の律法」の対照を平行に表現した。
