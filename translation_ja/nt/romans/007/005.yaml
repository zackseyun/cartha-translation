reference: Romans 7:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: ja
  text: 私たちが肉のうちにあったとき、律法を通して生じた罪深い情欲が、死のために実を結ぶように、私たちのからだの各部で働いていたからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ σαρκί
  choice: 肉のうちにあった
  rationale: パウロの「肉」という語を保ち、単に身体の中にいたという意味にも、「罪に支配された古い人間のあり方」という意味にも一方的に限定しない。
- source_word: τὰ παθήματα τῶν ἁμαρτιῶν
  choice: 罪深い情欲
  rationale: παθήματα はここでは苦難ではなく罪と結びついた欲情や衝動を指す。属格を自然な日本語の性質表現として訳した。
- source_word: τὰ διὰ τοῦ νόμου
  choice: 律法を通して生じる
  rationale: διὰ の媒介的な意味を示しつつ、「律法が情欲を引き起こした」とまで明示して文脈上の関係を過度に決定しない。
- source_word: ἐνηργεῖτο
  choice: 働いていた
  rationale: 未完了過去の継続的な作用を自然な日本語で表した。
- source_word: ἐν τοῖς μέλεσιν ἡμῶν
  choice: 私たちのからだの各部のうちで
  rationale: μέλη は身体の部分を行為の器官として指すため、「肢体」より明瞭な現代語を選び、脚注で含意を補った。
- source_word: εἰς τὸ καρποφορῆσαι τῷ θανάτῳ
  choice: 死のために実を結ぶよう
  rationale: 実を結ぶという比喩と、τῷ θανάτῳ の方向・帰結を表す簡潔で緊張感のある言い方を保った。
theological_decisions:
- issue: ἐν τῇ σαρκί を解釈的に「罪深い性質の中に」とするか
  choice: 肉のうちに
  alternative: 罪に支配された人間の状態に
  rationale: 「肉」はパウロの神学的に重層的な語であり、この箇所でも身体性と堕落した古い人間のあり方との緊張を保つため、本文では透明性の高い訳語を採用した。
- issue: 律法と罪深い情欲との因果関係をどこまで明示するか
  choice: 律法を通して生じる
  alternative: 律法によってかき立てられる
  rationale: διὰ τοῦ νόμου は媒介・手段を示すが、動詞「かき立てる」は原文にないため避け、律法を通して作用する関係だけを示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「肉」「実を結ぶ」「死のために」というパウロの主要な比喩と神学的緊張を保持した。「肢体」は現代の一般読者には硬いため本文では「からだの各部」とした。
