source:
  edition: SBLGNT
  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: ja
  text: なんと惨めな人間なのだ、私は！ だれがこの死の体から私を救い出してくれるのか。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「この死の体」。「この死をもたらす体」または「この死すべき体」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「解放してくれる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: 惨めな
  rationale: 深い苦悩と悲惨さを表す語であり、現代日本語で自然に感情的な強さを保つ。
- source_word: ἐγὼ ἄνθρωπος
  choice: 私は……人間なのだろう
  rationale: 話者自身を指すことを明示しつつ、ἄνθρωποςを性別に限定しない自然な「人間」とした。日本語の感嘆表現として語順を整えた。
- source_word: τίς
  choice: だれが
  rationale: 救出者を問う人称疑問詞を率直に表す。
- source_word: ῥύσεται
  choice: 救い出してくれるのか
  rationale: 危険や束縛から救出する意味を具体的に表す。「くれる」は話者が切望する救出の方向性を自然に示す。別訳「解放してくれるのか」も可能。
- source_word: ἐκ
  choice: から
  rationale: 分離・脱出の起点を自然な日本語で表す。
- source_word: σώματος
  choice: 体
  rationale: 原文の具体的な身体の比喩を解釈的に言い換えず保持する。
- source_word: τοῦ θανάτου τούτου
  choice: この死の
  rationale: 指示詞が文法上「死」にかかる原文の構造を保持し、「この死の体」と訳した。日本語でも意味の緊張と曖昧さを残せる。
theological_decisions:
- issue: τοῦ σώματος τοῦ θανάτου τούτου の係り受けと表現
  choice: この死の体
  alternative: この死をもたらす体／この死すべき体
  rationale: 原文では τούτου が「死」と一致し、直訳的には「この死の体」である。体が死をもたらすのか、死に属するのか、死すべき体なのかを本文だけで確定せず、パウロの比喩と神学的緊張を保持する。
- issue: ῥύσεται の救済的含意
  choice: 救い出してくれる
  alternative: 解放してくれる／救ってくれる
  rationale: 危険や束縛からの救出という動きを示しつつ、救済の範囲を本文以上に教理的に限定しない。
translation_notes:
  register: 明瞭で現代的ながら、苦悩に満ちた感嘆と問いの格調を保った。「なんと……なのだろう」で ταλαίπωρος ἐγὼ ἄνθρωπος の強い嘆きを自然に表した。
