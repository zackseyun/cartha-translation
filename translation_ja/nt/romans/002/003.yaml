id: ROM.2.3
reference: Romans 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: ja
  text: しかし、人よ、このようなことを行う者たちを裁きながら、自分も同じことをしているあなたは、自分が神の裁きを免れると思っているのか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λογίζῃ
  choice: 思っている
  rationale: ここでは、神の裁きを免れられるという相手の思い込みを問いただす修辞疑問として自然に表した。冒頭の「このことをどう考えるのか」と結び、思考・判断の意味も保っている。
- source_word: ἄνθρωπε
  choice: 人よ
  rationale: 代表的な一人の人間に直接呼びかける男性単数呼格。日本語では性別を不必要に限定せず、パウロの鋭い呼びかけを保つ「人よ」が適切。
- source_word: κρίνων
  choice: 裁きながら
  rationale: 道徳的評価を下す意味を直接表し、「罪に定める」ほど強く限定しない。分詞の同時的・対照的関係も示す。
- source_word: πράσσοντας
  choice: 行う者たち
  rationale: 継続的な行為を含み得る語だが、日本語で過度に習慣性を付加せず自然に表した。
- source_word: ποιῶν αὐτά
  choice: 自分も同じことをしている
  rationale: αὐτάが前述の「このようなこと」を指すことを明確にし、主語の対照を自然な日本語で示した。
- source_word: ἐκφεύξῃ
  choice: 免れる
  rationale: 迫る神の裁きから逃れ、回避する意味を、司法的文脈に合う自然な表現で示す。
- source_word: κρίμα τοῦ θεοῦ
  choice: 神の裁き
  rationale: 判決だけに狭めず、神による司法的判断を広く表す。属格は自然に「神の裁き」とした。
theological_decisions:
- issue: 神の裁きを免れるとの想定
  choice: 断定せず修辞疑問として提示
  alternative: 「決して免れない」と明示する
  rationale: 原文は強い否定を含意する修辞疑問だが、明示的な否定文へ変えず、その問いの形式と緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「人よ」「神の裁き」により厳粛な論争的語調を保持した。長いギリシャ語の一文は、日本語で論旨を追いやすいよう三文に分けた。
