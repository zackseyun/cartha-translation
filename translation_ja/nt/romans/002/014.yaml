id: ROM.2.14
reference: Romans 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: ja
  text: 実際、律法を持たない異邦人[a]が、本性によって[b]律法の定めること[c]を行うとき、彼らは律法を持っていなくても、自分たちにとって律法です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「生まれながらに」または「自然に」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「律法の事柄」。または「律法が求めること」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: 異邦人
  rationale: ここではユダヤ人およびモーセの律法との対比が背景にあるため、「諸国民」よりも民族的・宗教的な意味を明確に伝える「異邦人」とした。
- source_word: νόμον / νόμου / νόμος
  choice: 律法
  rationale: 文脈上モーセの律法を指す用法と、最後の「自分自身にとって律法」という述語的・比喩的用法の双方に同じ語を用い、原文の反復と概念的なつながりを保った。
- source_word: φύσει
  choice: 本性によって
  rationale: 生得的な道徳意識、自然な状態、習慣的な振る舞いなどのいずれかに意味を限定せず、原語の解釈上の幅を比較的よく保つ表現とした。
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: 律法の定めることを行う
  rationale: 直訳的な「律法の事柄を行う」は日本語として不自然なので、意味を明瞭にしつつ原文の内容を過度に説明しない表現とした。
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: 自分自身にとって律法である
  rationale: 与格の関係を自然な日本語で示しつつ、自ら律法を制定するという含意を不必要に強めないようにした。
theological_decisions:
- issue: φύσειが道徳的知識や良心とどのように関係するか
  choice: 本文では「本性によって」とし、その仕組みを説明しない。
  alternative: 「生まれながらに」「自然に」「直感的に」など、意味をより限定する訳。
  rationale: φύσει一語だけでは、生得的な道徳意識、自然な状態、あるいは別の説明のいずれかに確定できないため、パウロの議論にある神学的な緊張と解釈の余地を残した。
- issue: 「自分自身にとって律法」の意味
  choice: 原文の比喩をそのまま保つ。
  alternative: 「自分で自分の律法となる」「律法の代わりを自ら果たす」と説明的に訳す。
  rationale: 説明的な訳は、異邦人が自律的に法を制定するという意味や、律法の機能を完全に代替するという意味を原文以上に強めるおそれがある。
translation_notes:
  register: 現代の一般読者に理解できる、明瞭で落ち着いた文体とした。「というのは」と文末の「だからです」によりγάρの理由説明を自然に表し、律法という語の反復を維持した。
