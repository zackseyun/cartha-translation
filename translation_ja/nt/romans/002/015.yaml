id: ROM.2.15
reference: Romans 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: ja
  text: 彼らは、律法の働き[a]が自分たちの心に書き記されていることを示しています。彼らの良心もまた証しし、彼らの思いが互いに、彼らを責めたり、あるいはさらに弁護したりするのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「律法の要求すること」または「律法が求める行い」。
    reason: lexical_alternative
  - marker: b
    text: 「互いに」に当たるギリシア語は、より直訳すれば「互いの間で」。それが思いどうしの相互関係を指すのか、思いがその人々を判断する際の内的なやり取りを指すのかは、構文上明確ではありません。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: 示しています
  rationale: 証拠によって明らかにする意味を保ちつつ、「証明する」ほど強く断定しない、自然な現代日本語。
- source_word: τὸ ἔργον τοῦ νόμου
  choice: 律法の働き
  rationale: 単数形「働き」をそのまま保ち、「律法が要求すること」という解釈を本文に織り込まない。
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: 自分たちの心に書き記されている
  rationale: 内面への記銘という比喩を明確で自然な日本語にする。
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: その良心もともに証しし
  rationale: συν-の共同・ corroborating の含みを「ともに」で残し、属格絶対を日本語の続く節として表す。
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: 互いの間で、その思いが
  rationale: 圧縮された統語とἀλλήλωνの相互的な意味を、対象を過度に限定せずに保持する。
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: 責めたり、あるいは弁護したり
  rationale: ἀπολογέομαιの「弁護する」を保ち、ἢ καὶの強調を「あるいは」によって不自然にならない範囲で示す。
theological_decisions:
- issue: τὸ ἔργον τοῦ νόμουが一般的な内的道徳意識を指すのか、律法の要求内容を指すのか
  choice: 本文では「律法の働き」とする。
  alternative: 「律法の要求すること」「律法が求める行い」
  rationale: 原文の簡潔で解釈余地のある表現を残し、神学的意味を一つに固定しない。
- issue: λογισμοίが誰を責め、また弁護するのか
  choice: 文脈上の人々を指す「彼ら」を補う。
  alternative: 思いが互いを責めたり弁護したりする
  rationale: 分詞の目的語は明示されていないが、思考同士が互いを弁護するという意味に固定するより、彼ら自身に対する内的判断として自然に示す。ただし相互性を「互いの間で」に残す。
translation_notes:
  register: 明快な現代標準語を用いながら、「律法の働き」「心に書き記される」「良心が証しする」というパウロの比喩と語彙を保った。文体は平易だが聖書本文にふさわしい品位を意識した。
