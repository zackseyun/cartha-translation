revisions:
- from: 彼らは、律法の働き[a]が自分たちの心に書き記されていることを示しています。その良心もともに証しし、互いの間で、その思いが彼らを責めたり、あるいは弁護したりしています。[b]
  to: 彼らは、律法の働き[a]が自分たちの心に書き記されていることを示しています。彼らの良心もまた証しし、彼らの思いが互いに、彼らを責めたり、あるいはさらに弁護したりするのです。[b]
  rationale: 「律法の働き」という原文に近い表現と、その代替訳の脚注は維持した。良心の所有者を明示して自然な日本語に改め、複雑なμεταξὺ ἀλλήλων τῶν λογισμῶνを、本文では「彼ら」の内的判断という文脈上自然な読みで訳した。同時に「互いに」を省かず、脚注で統語上の曖昧さを保持した。
  reviewer_model: gpt-5.6-terra
