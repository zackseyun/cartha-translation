  text: πέποιθάς τε σεαυτὸν ὁδηγὸν εἶναι τυφλῶν, φῶς τῶν ἐν σκότει,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/019.yaml
  text: And you are convinced that you yourself are a guide to the blind, a light to those in darkness,
translation:
  language: ja
  text: またあなたは、自分が目の見えない人たちの案内人であり、闇の中にいる人たちの光であると確信しています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: 確信しています
  rationale: 完了形が表す、確立して持続している自信・確信の状態を自然な現代日本語で示す。文脈上、その自己確信をパウロが吟味している調子も保てる。
- source_word: τε
  choice: また
  rationale: 前節から列挙を継続する接続機能を簡潔に表す。
- source_word: σεαυτὸν
  choice: 自分こそ
  rationale: 再帰代名詞の自己指示と強調を日本語として自然に表し、自己評価に焦点があることを伝える。
- source_word: ὁδηγὸν
  choice: 案内人
  rationale: 人を道へ導くという比喩に合い、「指導者」よりも原語の導きのイメージを明瞭に保つ。
- source_word: τυφλῶν
  choice: 目の見えない人たち
  rationale: 属格を「〜の案内人」と自然に結び、現代日本語で人を指す明瞭な表現とする。
- source_word: φῶς
  choice: 光
  rationale: 霊的・道徳的な導きという比喩を解釈しすぎず、そのまま保持する。
- source_word: τῶν ἐν σκότει
  choice: 闇の中にいる人たち
  rationale: 人物を指す冠詞付き分詞相当の句を明示しつつ、「闇」の比喩的な曖昧さを保つ。
theological_decisions:
- issue: 「案内人」「光」という自己認識の評価
  choice: 話者が相手の自己確信を述べる形のまま訳し、その主張が真実か皮肉かを本文中で断定しない
  alternative: 「自称する」「思い込んでいる」など否定的評価を明示する
  rationale: ギリシア語は確信の存在を述べるが、この節単独では評価語を加えていない。周辺文脈の批判的緊張は、訳語で先取りせず保持する。
translation_notes:
  register: 明瞭で現代的かつ端正な「です・ます」体。二人称単数への直接的な呼びかけを「あなた」で保ち、比喩は平易にしながら解消しない。
