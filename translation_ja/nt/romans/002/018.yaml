  yaml_path: translation/nt/romans/002/018.yaml
  text: and know his will and approve the things that differ[a], being instructed from the law[b],
translation:
  language: ja
  text: また、あなたは律法から教えを受けているので、神のみこころを知り、何がより優れているかを見分けています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「異なるものを吟味する」です。または「何が重要かを見分ける」。
