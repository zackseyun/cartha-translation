lexical_decisions:
- source_word: γινώσκεις
  choice: 知り
  rationale: 現在形の直説法として、相手が神のみこころを知っているとする率直な表現。
- source_word: τὸ θέλημα
  choice: 神のみこころ
  rationale: 原文は直訳すれば「その意志」だが、文脈上の指示対象は神であるため、自然な日本語で明示した。
- source_word: δοκιμάζεις
  choice: 見分けています
  rationale: 吟味を通して価値を認定する意味を表し、「承認する」より自然に道徳的識別の文脈を伝える。
- source_word: τὰ διαφέροντα
  choice: 何がより優れているか
  rationale: 「異なるもの」を字義的基盤としつつ、ここでは比較して重要・優良なものを識別するという有力な語義を本文に採用した。別の理解は脚注に残す。
- source_word: κατηχούμενος
  choice: 教えを受けているので
  rationale: 受動分詞の教育的意味と、知り見分けることの根拠を示す自然な因果的ニュアンスを表した。
- source_word: ἐκ τοῦ νόμου
  choice: 律法から
  rationale: ἐκの源泉の意味を保ち、律法を教えの源として表した。
theological_decisions:
- issue: τὸ θέλημα の所有者
  choice: 神のみこころ
  alternative: みこころ／その意志
  rationale: ギリシア語に所有代名詞はないが、直前の文脈では神が明確な指示対象である。日本語では「神」を補って曖昧さを避けた。
- issue: τὰ διαφέροντα の解釈
  choice: 何がより優れているか
  alternative: 異なるもの／重要なこと
  rationale: 比較的に優れたものを識別する意味が文脈に適合する一方、字義的な「異なるもの」という含みも真正な曖昧さとして脚注に示した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある文体。「みこころ」は一般読者にも通じる聖書語として保持し、文脈上の神を明示した。前後に続く長い条件節の一部だが、提示された一節として読めるよう句点を置いた。
