revisions:
- from: 愚かな者を教え諭す者、幼子の教師、律法の中に知識と真理の具体的な形[a]を持つ者である、と自負しています――
  to: 愚かな者を教え導く者、幼子の教師、律法の中に知識と真理を形にしたもの[a]を備えている者だと、自負しています――
  rationale: 前節から継続する二人称への修辞的問いかけであることを、「…者だと、自負しています」により示した。「知識と真理を形にしたもの」は、律法における知識と真理の表現・定式化というμόρφωσιςの意味を、肯定的な「体現」や皮肉な単なる「外形」のいずれにも決めつけずに表す。
