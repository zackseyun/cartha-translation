    issue: μόρφωσιςを「具体的な形」とすること
    rationale: 「具体的な」は原語が明示しない限定であり、「知識と真理の具体的な形を持つ者」という日本語は、何を誰が持つのかもやや取りにくい。原語の「形・表現・定式化」の幅を保つ表現に改める。
  - severity: low
    issue: 「教え諭す者」の語感
    rationale: 「諭す」は説得・訓戒の響きが比較的強い。παιδευτήςの教育・訓練を中心とする意味には、「教え導く者」がより中立的で自然である。
