id: ROM.2.20
reference: Romans 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: ja
  text: 愚かな者を教え導く者、幼子の教師、律法の中に知識と真理を形にしたもの[a]を備えている者だと、自負しています――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「知識と真理の形」。
    reason: μόρφωσιςは「形」「表現」「定式化」などを指しうるため。
lexical_decisions:
- source_word: παιδευτὴν
  choice: 教え諭す者
  rationale: 教育・訓練に加えて矯正の含みもある語。文脈の教育的な自負を自然に示しつつ、懲罰の意味を強めすぎない表現とした。
- source_word: ἀφρόνων
  choice: 愚かな者
  rationale: 思慮や分別を欠く者を指し、話者の尊大で見下した調子も保つ。
- source_word: διδάσκαλον
  choice: 教師
  rationale: 教える者を表す標準的で明瞭な訳語。
- source_word: νηπίων
  choice: 幼子
  rationale: 文字どおりの幼い子どもという比喩を保ちつつ、現代日本語として自然で品位のある表現。文脈上は未熟な者を含意し得る。
- source_word: ἔχοντα
  choice: 持つ
  rationale: 分詞の基本的な意味を保ち、直前から続く自己認識の列挙につなげた。
- source_word: μόρφωσιν
  choice: 具体的な形
  rationale: 外形・形態だけでなく、知識と真理が律法において形を取って示されているという幅を保持する。『体現』よりも、本人自身が体現しているとの誤読を避けやすい。
- source_word: γνώσεως
  choice: 知識
  rationale: ἀληθείαςとの並列を保つ標準的な訳語。
- source_word: ἀληθείας
  choice: 真理
  rationale: この文脈の宗教的・普遍的な真実を、自然で格調ある日本語で表す。
- source_word: ἐν τῷ νόμῳ
  choice: 律法の中に
  rationale: ἐνの位置・領域の意味を保ち、知識と真理の形が律法のうちにあるという構文を明示する。
theological_decisions:
- issue: μόρφωσιςが肯定的な『具体的表現』を指すか、単なる外形を皮肉に指すか
  choice: 具体的な形
  alternative: 形／体現
  rationale: 語そのものとこの節だけでは肯定・皮肉の度合いを確定できないため、律法に知識と真理が形を取っているという主張を示しながら、その主張へのパウロの評価を訳文で先取りしない。
- issue: 節全体が事実の断定か、律法を誇る者の自己認識か
  choice: 「と自負しています」を補って前節からの修辞的呼びかけを明示
  alternative: 「持つ者」だけで逐語的に続ける
  rationale: ギリシア語では前節から続く対格の同格句であり、2:17以下の『もしあなたが…と称し』に従属する。独立した肯定命題と誤読されないよう、日本語では文脈上の自負を明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの修辞的な列挙と尊大な自己認識の調子を保持した。末尾のダッシュは議論が次節へ続くことを示す。
