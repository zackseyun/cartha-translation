id: ROM.2.5
reference: Romans 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: ja
  text: しかし、あなたは、その頑なさと悔い改めようとしない心のゆえに、怒りと神の正しい裁き[a]の現れの日に、自分のために怒りを蓄えています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の公正な裁き」。
    reason: δικαιοκρισίαは、正しさにかなった、公正な裁きを意味する。
lexical_decisions:
- source_word: κατὰ δὲ
  choice: しかし、…のゆえに
  rationale: δέの穏やかな逆接を「しかし」で示し、κατάがここで表す、心の状態に応じた因果的な関係を自然な日本語の「…のゆえに」で表した。
- source_word: σκληρότητά
  choice: 頑なさ
  rationale: 道徳的に心が硬く応答しないという比喩を、現代日本語で自然な聖書語彙として保った。
- source_word: ἀμετανόητον καρδίαν
  choice: 悔い改めようとしない心
  rationale: 「悔い改めない心」よりも、悔い改めを拒む持続的な姿勢を明確にしつつ、καρδίαの「心」を保持した。
- source_word: θησαυρίζεις σεαυτῷ
  choice: 自分のために…蓄えています
  rationale: θησαυρίζωの蓄積の比喩と、再帰代名詞σεαυτῷが示す本人に帰する結果を保った。
- source_word: ὀργή
  choice: 怒り
  rationale: 神の裁きに伴う厳粛な怒りを、日本語で過度に特殊化せず明瞭に表した。
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: 怒りの日、また…が現される日に
  rationale: 二つの属格を伴う「日」の構造を「また」で並置し、ἀποκάλυψιςの名詞表現は自然な日本語にするため受動節にした。
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: 神の正しい裁き
  rationale: δικαιοκρισίαが表す、正しさにかなった裁きを簡潔に示し、τοῦ θεοῦを裁きの主体・帰属として自然に訳した。
theological_decisions:
- issue: 「怒りの日」と「神の正しい裁きが現される日」の関係をどこまで明示するか
  choice: 「怒りの日、また神の正しい裁きが現される日に」と並置する
  alternative: 「神の正しい裁きが現される怒りの日に」
  rationale: 後者は両者を一つにまとめて関係を明確にするが、ギリシア語は属格名詞をκαίで並置しているため、その緊張を残しつつ日本語として理解できる形にした。
- issue: ὀργήを司法的な専門語に置き換えるか
  choice: 「怒り」とする
  alternative: 「憤り」または「刑罰」
  rationale: 本文は怒りと裁きを関連づけるが同一語にはしていないため、「刑罰」と解釈的に限定せず「怒り」を保った。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「頑なさ」「悔い改め」「裁き」は一般読者にも理解可能な聖書語彙として用い、文末は継続的な蓄積を示す「蓄えています」とした。
