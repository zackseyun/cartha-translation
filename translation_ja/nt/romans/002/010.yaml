  text: δόξα δὲ καὶ τιμὴ καὶ εἰρήνη παντὶ τῷ ἐργαζομένῳ τὸ ἀγαθόν, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/010.yaml
  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: ja
  text: しかし、善を行うすべての人には、まずユダヤ人に、そしてギリシア人にも、栄光と誉れと平安があります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「ギリシア人」は、より広くユダヤ人でない人、すなわち異邦人を指すと考えられます。
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: 栄光
  rationale: 聖書的・終末論的な報いの重みを保つ、自然で定着した訳語。
- source_word: τιμή
  choice: 誉れ
  rationale: δόξαと並ぶ評価・尊重を表し、「栄光」との意味の重なりを抑えつつ格調を保つ。
- source_word: εἰρήνη
  choice: 平安
  rationale: 内面的な安らぎに限定せず、聖書における広い平和と健全な状態を含み得る語。
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: 行うすべての人には
  rationale: 分詞が示す継続的・特徴的な実践を、現代日本語として自然に表す。
- source_word: τὸ ἀγαθόν
  choice: 善
  rationale: 冠詞付き形容詞の「善いこと／善」を簡潔に保つ。「善いこと」も可能だが、ここでは対句的で格調ある「善」が自然。
- source_word: Ἰουδαίῳ
  choice: ユダヤ人に
  rationale: 代表的単数を日本語で総称的に自然に表す。
- source_word: πρῶτον
  choice: まず
  rationale: 順序を簡潔に示し、その神学的意味を本文で過度に説明しない。
- source_word: Ἕλληνι
  choice: ギリシア人にも
  rationale: 原語の民族名称とパウロの「ユダヤ人とギリシア人」という定型的対比を保持し、より広い意味は脚注で示す。
- source_word: δὲ
  choice: しかし
  rationale: 前節の怒りと苦難に対する明確な対照を表す。
theological_decisions:
- issue: パウロの「ユダヤ人／ギリシア人」という対比におけるἝλληνιの範囲
  choice: 本文では「ギリシア人」とし、非ユダヤ人一般を指し得ることを脚注で示す。
  alternative: 異邦人
  rationale: 原語表現を保ちながら、この文脈における民族的・宗教的な広がりも読者に伝え、どちらか一方に断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「栄光・誉れ・平安」という三項の荘重さと、前節との対照を保持した。原文の語順に沿って報いを先に置き、後半は日本語として読みやすい二文構成にした。
