  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: ja
  text: なぜなら、律法を聞く者が神の前で正しいのではなく、律法を行う者が義と認められることになるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκροαταὶ νόμου
  choice: 律法を聞く者
  rationale: 単に律法を耳にする者という意味を自然な日本語で表し、「行う者」との対比を保つ。
- source_word: δίκαιοι παρὰ τῷ θεῷ
  choice: 神の前で正しい
  rationale: 神による評価・裁きの場で正しいとされる立場を、簡潔かつ原文に近く表す。
- source_word: ποιηταὶ νόμου
  choice: 律法を行う者
  rationale: ποιηταίの実践的な意味を明確にし、「聞く者」との修辞的対照を保つ。
- source_word: δικαιωθήσονται
  choice: 義と認められる
  rationale: 未来受動形を保ちつつ、現代日本語で理解しやすく、ローマ書における法廷的・神学的含意を過度に限定しない表現とした。
theological_decisions:
- issue: δικαιωθήσονταιの神学的・法廷的含意
  choice: 義と認められる
  alternative: 正しいと宣告される／正しさが立証される
  rationale: 神が主体である受動的な意味と「義」の語彙的連続性を保ちながら、特定の教派的理解に限定しない。代替的な含意は脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「聞く者／行う者」の対比を簡潔に再現し、γάρは前文を受ける「からです」として訳した。
