  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: ja
  text: というのは、外見上ユダヤ人である者がユダヤ人なのではなく、肉体に施された外見上の割礼が割礼なのでもないからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「肉にある外見上の割礼」。ここで「肉」は身体を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰουδαῖος
  choice: ユダヤ人
  rationale: ここでは地域的出身よりも、律法と割礼に関わる契約共同体のアイデンティティーが論点であるため。
- source_word: ἐν τῷ φανερῷ
  choice: 外見上の
  rationale: 目に見える外面的な状態を表し、次節の内面的な現実との対比を自然な日本語で保つ。
- source_word: περιτομή
  choice: 割礼
  rationale: ここで論じられている契約のしるしを表す標準的で正確な訳語。
- source_word: ἐν σαρκί
  choice: 肉に施された
  rationale: ここでのσάρξは比喩的でなく身体を指す。日本語では『肉にある』より自然に、身体的な割礼であることを示す。
- source_word: γὰρ
  choice: （訳文では明示せず）
  rationale: 日本語では文脈上の説明関係が明らかであり、『というのは』を加えると単独節として重くなるため。ただし前節を受ける説明の機能は文脈に保たれる。
theological_decisions:
- issue: 『ユダヤ人』と『割礼』における契約的アイデンティティーの意味
  choice: 目に見える外的なしるしだけで真の契約上の身分が定まるのではない、という対比として訳す。
  alternative: ユダヤ人としてのアイデンティティー自体を否定する、またはそれを純粋に霊的なカテゴリーへ置き換えると読む。
  rationale: 本文は外面と内面を対比しており、ユダヤ人というカテゴリーそのものを廃棄してはいない。次節へ続く緊張を解消しない訳とした。
translation_notes:
  register: 明瞭な現代標準日本語。原文の二つの否定を並行させ、荘重さを保ちつつ、身体的な割礼を自然に表現した。
