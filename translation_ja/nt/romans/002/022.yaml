reference: Romans 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: ja
  text: 「姦淫してはならない」と言うあなたが、姦淫するのですか。偶像を忌み嫌うあなたが、神殿から物を盗むのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、より広く「神聖なものを冒涜するのですか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: 「……」と言うあなたが
  rationale: 定冠詞付き現在分詞を実体詞的な呼びかけとして捉え、パウロの直接的な修辞疑問を自然な日本語で保った。
- source_word: μὴ μοιχεύειν
  choice: 姦淫してはならない
  rationale: μήを伴う不定詞が発言内容である禁止を示すため、明確で格調を保つ標準的な表現とした。
- source_word: μοιχεύεις
  choice: 姦淫するのですか
  rationale: 現在直説法の一般的・告発的な修辞疑問を、日本語の自然な問いの形で表した。
- source_word: ὁ βδελυσσόμενος
  choice: 偶像を忌み嫌うあなたが
  rationale: βδελύσσομαιの強い嫌悪を「忌み嫌う」で表し、現在分詞による相手への直接的な呼びかけも保った。
- source_word: τὰ εἴδωλα
  choice: 偶像
  rationale: 文脈上、礼拝対象となる像を指すため、明確で定着した訳語を用いた。
- source_word: ἱεροσυλεῖς
  choice: 神殿から物を盗むのですか
  rationale: 動詞の具体的な意味である神殿またはその財物からの略奪を明示し、偶像への嫌悪との皮肉な対比と歴史的な具体性を保った。
theological_decisions:
- issue: ἱεροσυλεῖςの意味範囲
  choice: 本文では「神殿から物を盗む」
  alternative: 「神聖なものを冒瀆する」
  rationale: 語は具体的な神殿略奪と、より広い涜聖の双方を表し得る。直前の偶像への言及を踏まえて具体義を本文に採り、広義は脚注に残して曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、修辞疑問の厳粛さと告発的な力を保った。「姦淫」「偶像」「神殿」は一般読者にも理解可能で、聖書文脈にふさわしい格調のある語として採用した。
