source:
  edition: SBLGNT
  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: ja
  text: 神が、私の福音に従い、メシアであるイエス[a]を通して、人々の隠された事柄を裁かれる日に。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト・イエス」。
    reason: Χριστός の称号的な訳「メシア」と、伝統的で名前に近い訳「キリスト」の双方を示すため。
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: …裁かれる日に
  rationale: 明確な裁きの日を指す時間表現を保ちつつ、修飾節を伴う自然な現代日本語にした。前後の文脈に続く構文であるため、原文同様、この節だけでは文が完結しない形を維持した。
- source_word: κρίνει
  choice: 裁かれる
  rationale: ギリシア語は現在形だが、終末における将来の裁きを指す。日本語では連体修飾節の「裁かれる」が時制を過度に限定せず、文脈上の将来性も自然に伝える。
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: 人々の隠された事柄
  rationale: 性別を限定しない ἀνθρώπων を「人々」とし、内に秘められたことを含む τὰ κρυπτὰ を、意味を「秘密」だけに狭めない「隠された事柄」と訳した。
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: 私の福音に従い
  rationale: パウロの所有表現を保ち、κατά の規準・一致の意味を自然な日本語で表した。「私が宣べ伝える福音によれば」も可能だが、原文にない説明を加えない形を選んだ。
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: メシアであるイエスを通して
  rationale: 属格を伴う διά の仲介・媒介の意味を「を通して」で表した。Χριστός の称号としての意味を「メシアである」と明示し、日本語として不自然な複合名を避けた。
theological_decisions:
- issue: Χριστοῦ を称号として訳すか、名前化した呼称として訳すか
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: この箇所では Χριστός の称号性を保持した。伝統的で名前化した「キリスト・イエス」も本文異読ではなく訳語上の別案として脚注に示した。
- issue: 「私の福音に従い」が裁きの規準を示すのか、裁きについての福音の宣言を示すのか
  choice: 原文の修飾関係を限定せず「私の福音に従い」とした
  alternative: 私の福音が告げるとおり
  rationale: κατά は規準・一致を表し得るため、神の裁きそのものと福音の告知との関係を説明的に一方へ限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文が前節から構文上続く可能性を尊重し、この節だけを補足語で独立文にせず、「…日に。」という断片的な形を保った。
