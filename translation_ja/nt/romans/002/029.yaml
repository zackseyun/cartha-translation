id: ROM.2.29
reference: Romans 2:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: ja
  text: むしろ、内面でユダヤ人である者がユダヤ人であり、割礼は、心の割礼、すなわち文字によるのではなく霊[a]によるものです。その人への称賛は、人からではなく、神から来ます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊」は聖霊を指すとも、人の霊、すなわち外的な成文規定に対する内的・霊的な現実を指すとも理解できます。
    reason: πνεύματιの指示対象には解釈上の幅があるため。
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: 内面で
  rationale: 直訳的な「隠れたところで」よりも、外面との対比を現代日本語で明確かつ自然に伝える。
- source_word: Ἰουδαῖος
  choice: ユダヤ人
  rationale: ここでは地理的出自よりも契約・宗教上の位置づけが論点である。
- source_word: περιτομὴ καρδίας
  choice: 心の割礼
  rationale: 原文の比喩を簡潔に保ち、身体上の外的なしるしとの対比を示す。
- source_word: ἐν πνεύματι
  choice: 霊による
  rationale: ἐνを手段として自然に訳す。πνεῦμαが聖霊を指す可能性は高いが、原文の表記だけでは人の霊・内的な霊的現実との区別が完全には確定しないため、本文では「霊」とし脚注で示す。
- source_word: οὐ γράμματι
  choice: 文字によるのではなく
  rationale: γράμμαの語義を保ちながら、成文規定という含意を過度に説明しすぎない。
- source_word: οὗ ὁ ἔπαινος
  choice: その人への称賛
  rationale: 関係代名詞の先行対象を日本語で明確にし、内面でユダヤ人である者に対する神の評価を自然に表す。
- source_word: ἐξ ἀνθρώπων
  choice: 人から
  rationale: 性別を限定しない総称的な複数を自然な日本語で表す。
- source_word: ἐκ τοῦ θεοῦ
  choice: 神から
  rationale: 原文を簡潔かつ直接的に訳す。
theological_decisions:
- issue: πνεύματιが聖霊を指すか、人の霊・内的な霊的現実を指すか
  choice: 本文では「霊による」とし、聖霊に限定する表記を避ける
  alternative: 「御霊による」または「聖霊による」
  rationale: パウロの「霊／文字」の対比から聖霊を指す可能性は高いが、この句自体には解釈上の幅がある。日本語では「霊」によって曖昧さを保持し、脚注で主要な理解を示す。
- issue: 「内面でユダヤ人である」の述語性
  choice: 「者こそ真のユダヤ人であり」と補って対比を明示する
  alternative: 「内面でユダヤ人である者であり」
  rationale: 前節から続く省略的なギリシア語構文を、日本語として完結させるための最小限の補足である。「真の」は外面だけの者との対比を表すが、民族的同一性の否定を意味する説明までは加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、格調を保ちつつ一般読者に理解しやすい文とした。「文字」はパウロ的な対比を残し、「律法」などへの説明的置換は避けた。
