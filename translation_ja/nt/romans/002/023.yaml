  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: ja
  text: 律法を誇りとするあなたは、律法に背くことによって神を辱めるのですか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν νόμῳ καυχᾶσαι
  choice: 律法を誇りとする
  rationale: ἐν νόμῳ が示す、律法を誇りの根拠とする意味を自然な現代日本語で表しつつ、καυχᾶσαι の批判的な響きを保った。
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: 律法に背くことによって
  rationale: διά＋属格の手段・媒介の意味を「によって」で示した。παράβασις は定められた境界を越える違反を表すが、「違反」という硬い名詞表現よりも「背くこと」が本文では明瞭で自然である。
- source_word: τὸν θεὸν ἀτιμάζεις
  choice: 神を辱める
  rationale: ἀτιμάζεις の「名誉を損なう、恥辱を与える」という強い非難を簡潔に表し、律法を誇ることとの修辞的対照を保った。
theological_decisions:
- issue: νόμος の指示対象
  choice: 律法
  alternative: 法／掟
  rationale: 文脈ではユダヤ人に与えられた神の律法を指すため、日本語聖書で明確かつ一般的な「律法」とした。モーセ律法という語を補わず、原文の表現範囲を保った。
- issue: 問いか断定か
  choice: 修辞疑問として「のですか」
  alternative: 「神を辱めている」
  rationale: 原文末の疑問符と文脈上の告発的な問いを反映した。問いの形を保つことで、断定へ平板化せずパウロの修辞的な鋭さを残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。二人称単数を「あなた」で明示し、原文の直接的な告発と、誇りと違反の対照を簡潔に再現した。
