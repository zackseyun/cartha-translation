  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: ja
  text: そして、生まれながら無割礼で、律法を行う人が、律法の文字と割礼を持ちながら律法に背くあなたを裁くことになります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法の文字と割礼を持ちながら」は、直訳すると「文字と割礼を通して」。ここで「文字」は、書かれた形の律法を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἐκ φύσεως ἀκροβυστία
  choice: 生まれながら無割礼である人
  rationale: ἀκροβυστίαは字義的には「無割礼」だが、ここでは無割礼の人を指す換喩。ἐκ φύσεωςはこの状態が生来のものであることを表す。民族名「異邦人」を補わず、本文の割礼／無割礼の対比を保った。
- source_word: τὸν νόμον τελοῦσα
  choice: 律法を行う
  rationale: τελοῦσαは律法を実際に遂行することを表す現在分詞。「守る」も可能だが、「行う」はτελέωの遂行の意味を保ちつつ自然である。分詞を明示的な条件文に限定せず、譲歩的な文脈に組み込んだ。
- source_word: νόμος
  choice: 律法
  rationale: 文脈上、モーセの律法という特定の既知の範疇を指すため、日本語聖書で一般的な「律法」とした。
- source_word: διὰ γράμματος καὶ περιτομῆς
  choice: 成文の律法と割礼を持ちながら
  rationale: γράμμαはここでは書かれた律法を指す。διάは所有物・手段という優位な立場がかえって違反を際立たせる構文であり、日本語では「持ちながら」が自然。「文字と割礼によって」という直訳的な形は脚注に示した。
- source_word: παραβάτην νόμου
  choice: 律法に背く者
  rationale: παραβάτηςは定められた境界を越えて違反する人。「律法違反者」より自然でありつつ、νόμουとの明示的関係を保つ。
- source_word: κρινεῖ
  choice: 裁くことになります
  rationale: 未来形の予告を明確にしつつ、καίで前節の論旨に続く帰結として自然な日本語にした。
theological_decisions:
- issue: ἀκροβυστίαを民族的な「異邦人」と明示するか
  choice: 「無割礼である人」とし、語の直接的な対比を保持する。
  alternative: 異邦人
  rationale: 議論の背景にはユダヤ人と異邦人の対比があるが、この節の語そのものは割礼と無割礼を対置する。民族的解釈を本文に織り込まず、パウロの表現の幅を残した。
- issue: τελοῦσαを条件として訳すか、付帯状況として訳すか
  choice: 「無割礼でありながら律法を行う人」とし、その人を特徴づける分詞として訳す。
  alternative: もし律法を行うなら
  rationale: 文脈上は条件的な含みもあり得るが、ギリシア語本文に条件辞はない。現在分詞の描写的な力を残し、条件だけに限定しなかった。
- issue: 無割礼の人が「裁く」の意味を比喩的に弱めるか
  choice: κρινεῖをそのまま「裁く」とした。
  alternative: 罪を明らかにする／非難する
  rationale: 実際の審判参加か、比較による有罪宣告かを本文だけで決めず、法廷的な強さと神学的緊張を保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「律法」「無割礼」「裁く」という議論上重要な語を保持した。「あなた」を単数形のままとし、直前から呼びかけられている相手への鋭い対比を再現した。
