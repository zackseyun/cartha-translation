id: ROM.2.1
reference: Romans 2:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: ja
  text: ですから、他人を裁く人よ、あなたがだれであっても、弁解の余地はありません。[a] あなたは他人を裁くことによって、自分自身を罪に定めています。裁くあなた自身が、同じことを行っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「弁解の余地はありません」は、「弁明できません」または「弁護の余地がありません」とも訳せます。
    reason: ἀναπολόγητος が表す、有効な弁明・抗弁をなしえないという法廷的含意と、日本語の訳語の幅を示すため。
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前の議論から導かれる帰結を示す接続語として、現代日本語で自然かつ明瞭に論理関係を表す。
- source_word: ἀναπολόγητος
  choice: 言い逃れはできません
  rationale: 正当な弁明や抗弁が成り立たないという法廷的含意を、一般読者に分かりやすい日本語で表す。
- source_word: ὦ ἄνθρωπε πᾶς ὁ κρίνων
  choice: 他人を裁く者よ、あなたがだれであっても
  rationale: 単数呼格による鋭い直接的な呼びかけと、πᾶς の普遍的範囲の双方を自然な日本語で保持する。ἄνθρωπος はここでは人間一般を代表する用法なので、男性だけに限定する「男よ」は避ける。
- source_word: ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον
  choice: 他人を裁くそのことで
  rationale: ἐν ᾧ の手段的な力を保ち、裁く行為そのものによって自己を罪に定めるという論旨を明確にする。時間的にも理解し得る曖昧さは脚注に示す。
- source_word: τὸν ἕτερον
  choice: 他人
  rationale: 裁く本人との対比を簡潔で自然に示す。
- source_word: κατακρίνεις
  choice: 罪に定めている
  rationale: 単なる評価を表す κρίνεις より強い、有罪とする法廷的意味を保持する。
- source_word: τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων
  choice: 裁くあなた自身が、同じことを行っている
  rationale: 分詞による相手の特定と強調を「あなた自身」で示し、現在形の継続的・習慣的行為を、過度に限定せず「行っている」と訳す。
theological_decisions:
- issue: 代表的用法の男性単数呼格
  choice: 「他人を裁く者よ、あなたがだれであっても」とし、人間一般への呼びかけとして訳す
  alternative: 「人よ、すべて裁く者よ」または「男よ」
  rationale: ἄνθρωπε は文法上男性単数だが、この文脈では男性に限定されず、裁く者すべてを代表して呼びかけている。日本語で「男よ」とすると指示範囲を不当に狭め、「人よ、すべて裁く者よ」では不自然になるため、修辞的な直接性と普遍性を合わせて表した。
- issue: ἐν ᾧ の手段的・時間的含意
  choice: 本文では「そのことで」として手段的含意を前面に出す
  alternative: 「他人を裁くとき」
  rationale: 原文は、他人を裁く行為が自己断罪の機会であるだけでなく、その根拠・手段にもなるという緊張を含み得る。本文は論理的関係を明確にし、時間的な訳の可能性を脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの直接的で厳しい呼びかけと法廷的な語調を保持した。「裁く」と「罪に定める」を訳し分け、原文の強度差を明示した。
