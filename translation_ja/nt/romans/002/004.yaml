id: ROM.2.4
reference: Romans 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: ja
  text: それとも、神の慈しみ[a]と寛容と忍耐の豊かさを侮り、神の慈しみがあなたを悔い改めへと導いていることを知らないのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「慈しみ」は、いずれも「善良さ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλούτου
  choice: 実に豊かであること
  rationale: 所有される「富」というギリシア語の比喩を、日本語として自然な豊かさの表現で伝え、神の諸性質が満ちあふれていることを示す。
- source_word: χρηστότητος / τὸ χρηστόν
  choice: 慈しみ
  rationale: 両箇所を同じ語で訳し、罪人に対する神の親切で恵み深い振る舞いという人格的・関係的な意味を保つ。
- source_word: ἀνοχῆς
  choice: 寛容
  rationale: 裁きを直ちに下さず差し控える意味を、明快で格調ある現代日本語で表す。
- source_word: μακροθυμίας
  choice: 忍耐
  rationale: 長く耐えることを示す一般的で分かりやすい訳語。
- source_word: καταφρονεῖς
  choice: 侮る
  rationale: 単に軽視する以上の、見下して価値を認めないという鋭い叱責の力を簡潔に保つ。
- source_word: ἀγνοῶν
  choice: 知らない
  rationale: 分詞を意志的な無視と決めつけず、原文どおり認識の欠如として訳す。
- source_word: εἰς μετάνοιάν
  choice: 悔い改めへと
  rationale: μετάνοιαを単なる心理的な意見変更に狭めず、神に向き直る悔い改めとして訳し、εἰςの方向性を「へと」で示す。
- source_word: ἄγει
  choice: 導いている
  rationale: 現在形の継続的な働きを自然に表し、神の慈しみが相手を悔い改めの方向へ促していることを保つ。
theological_decisions:
- issue: χρηστότης / χρηστόνを「慈しみ」とするか、より広い「善良さ」とするか
  choice: 両方とも「慈しみ」
  alternative: 両方または一方を「善良さ」とする
  rationale: 文脈は、裁きを差し控える神の恵み深い対人的な振る舞いを強調しているため。「慈しみ」はその関係的な含意を自然に表し、二つの用例の語彙的一貫性も保つ。
- issue: ἄγειが悔い改めの実現を必然的に保証するか
  choice: 「悔い改めへと導いている」と方向性を示す
  alternative: 「必ず悔い改めさせる」など、結果の実現まで明示する
  rationale: 原文は神の慈しみが向かわせる方向を示すが、この一節だけで相手の応答や結果を明示してはいないため、因果を強めない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、修辞疑問の厳しい調子を保った。長い属格連鎖は自然な日本語に整え、二つの問いに分けたが、原文の論理的連続性は維持している。脚注記号は該当節の末尾に置いた。
