  rationale: 本文の意味と神学的含意は維持したまま、読点を整理し、「律法を行う」を「律法を実践する」に改めました。これはπράσσωの継続的・実行的な含意を保ちつつ、現代日本語としての自然さを高める安全な文体上の修正です。脚注は原文の強い最終句を説明しており、変更を要しません。
