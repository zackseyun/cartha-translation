id: ROM.2.25
reference: Romans 2:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: ja
  text: あなたが律法を実践するなら、割礼には価値があります[a]。しかし、あなたが律法に背く者なら[b]、あなたの割礼は無割礼となっています[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「役に立ちます」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「律法の違反者なら」。
    reason: lexical_alternative
  - marker: c
    text: 割礼を受けた身体が元に戻るという意味ではなく、律法に背くなら、契約のしるしである割礼がその価値を失う、という強い逆転表現。
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: 割礼
  rationale: ユダヤ人の契約のしるしを指す定着した訳語であり、ἀκροβυστίαとの対比も明確に保てる。
- source_word: μὲν γὰρ
  choice: 確かに
  rationale: 後続する「しかし」と対をなし、まず割礼の効用を認める譲歩的・肯定的な談話機能を自然な日本語で示す。γάρの文脈上の説明機能を独立した接続語で過度に明示しない。
- source_word: ὠφελεῖ
  choice: 価値があります
  rationale: 条件付きながら現実に益や有用性があるという意味を、現代日本語で明瞭に表す。「役に立ちます」も可能だが、契約上の意義を含み得る表現として「価値があります」を採った。
- source_word: ἐὰν νόμον πράσσῃς
  choice: あなたが律法を行うなら
  rationale: πράσσωの「行う、実践する」という動作性を保ち、「律法を守る」と解釈的に言い換えすぎない。
- source_word: παραβάτης νόμου
  choice: 律法に背く者
  rationale: 律法の定めを踏み越える者という法的・契約的意味を、硬すぎない現代日本語で表す。
- source_word: ἡ περιτομή σου
  choice: あなたの割礼
  rationale: 二人称への直接的な語りかけと、パウロの修辞的な対比をそのまま保つ。
- source_word: ἀκροβυστία
  choice: 無割礼
  rationale: ここでは身体部位そのものより、割礼と対立する契約上の状態を表すため、対概念として定着した「無割礼」を用いる。
- source_word: γέγονεν
  choice: となっています
  rationale: 完了形が示す、すでに生じて現在も続く結果状態を表す。「と見なされます」とはせず、原文の強い逆転表現を保つ。
theological_decisions:
- issue: 最後の句を身体的事実の変化として訳すか、契約上の地位の逆転として訳すか
  choice: 「あなたの割礼は無割礼となっています」と、原文の具体的で強い表現を本文に残す。
  alternative: 「あなたの割礼は無割礼と見なされます」または「あなたの割礼は無割礼同然です」
  rationale: γέγονενは単なる評価以上に「その状態になった」という修辞的逆転を表す。説明的な訳は意味を明確にする一方、原文の緊張と強さを弱めるため、解説は脚注に置く。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体寄りの敬体を用いた。「割礼」「律法」「無割礼」という聖書用語は、議論の契約的対比を保つため維持した。二人称を明示し、原文の直接的な語りかけを再現した。
