id: ROM.2.8
reference: Romans 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: ja
  text: しかし、利己的な野心に駆られ、真理に従わず、かえって不義[a]に従う者には、怒りと憤りが下ります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不正」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: 利己的な野心に駆られ
  rationale: ἐκが示す動機・源を表しつつ、ἐριθείαの自己本位で党派的な野心を、現代の一般読者に自然に伝える。
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: 真理に従わず
  rationale: ἀπειθέωの単なる不信ではなく、意志的な不服従という力を保つ。
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: かえって不義に従う
  rationale: 直前の「真理に従わず」との対照と、πειθομένοιςが示す反対方向への服従を明確にする。
- source_word: ἀδικίᾳ
  choice: 不義
  rationale: 神の裁きという文脈で、道徳的な悪と神の前での正しさへの反逆を含むパウロ的なδικ語群の響きを保つ。
- source_word: ὀργὴ
  choice: 怒り
  rationale: 神の裁きとしての厳粛な怒りを、明瞭で自然な日本語で表す。
- source_word: θυμός
  choice: 憤り
  rationale: ὀργήと並ぶ強意的な語として区別を残しつつ、「激怒」ほど口語的・瞬間的に限定しない。
- source_word: implicit verbal ellipsis
  choice: 怒りと憤りが下ります
  rationale: ギリシア語では動詞が省略されているが、日本語の独立した節として意味が明瞭になるよう、文脈上の神の裁きを表す最小限の述語を補った。
theological_decisions:
- issue: 神の裁きの文脈におけるἀδικίαの訳
  choice: 不義
  alternative: 不正
  rationale: 「不義」は神の前で正しくないことを含む広い神学的・道徳的意味を保つ。「不正」も可能だが、社会的不公正に狭く理解される余地があるため脚注に置く。
- issue: 省略された述語の扱い
  choice: 「が下ります」を補う
  alternative: 「怒りと憤り」と体言止めにする
  rationale: 原文の省略を認識しつつ、現代日本語で文として自然かつ明瞭にするため、前後の裁きの文脈から最小限に補った。裁きの主体そのものは明示せず、原文以上の限定を避けた。
translation_notes:
  register: 明瞭で現代的かつ荘重な文体。「かえって」により真理への不服従と不義への服従の対照を示した。原文の簡潔さを尊重しながら、日本語として必要な述語だけを補った。
