  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: ja
  text: ですから、ほかの人を教えるあなたが、自分自身を教えないのですか。『盗んではならない』と告げ知らせるあなたが、盗むのですか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: それでは
  rationale: 前節までを受けた推論的な移行を示し、現代日本語として自然に問いへつなげる。
- source_word: διδάσκων
  choice: 教える
  rationale: 実質的に名詞の働きをする現在分詞を「教えるあなた」とし、継続的・特徴的な行為を簡潔に表す。
- source_word: ἕτερον
  choice: 他人を
  rationale: 単数形による自己以外の者との対比を保ちつつ、日本語で自然な目的語とする。
- source_word: σεαυτὸν
  choice: 自分自身を
  rationale: 再帰代名詞を明示し、他人を教えることとの鋭い対照を保つ。
- source_word: οὐ διδάσκεις;
  choice: 教えないのですか
  rationale: 否定疑問の形と叱責的な修辞効果を保ちながら、明瞭な現代日本語にする。
- source_word: κηρύσσων
  choice: 宣べ伝える
  rationale: 公に告げ知らせる意味を表し、単なる私的発言より強い布告的な響きを保つ。
- source_word: μὴ κλέπτειν
  choice: 「盗んではならない」
  rationale: 不定詞句の内容を日本語では直接の禁止命令として示すのが自然であり、十戒を想起させる表現も保てる。
- source_word: κλέπτεις;
  choice: 盗むのですか
  rationale: 現在形の直接的な修辞疑問を簡潔に再現する。
