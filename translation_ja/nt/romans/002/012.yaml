id: ROM.2.12
reference: Romans 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: ja
  text: というのも、律法なしに罪を犯した人は皆、律法なしに滅びます[a]。また、律法のもとで罪を犯した人は皆[b]、律法によって裁かれます[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法なしで」または「律法を持たずに」とも訳せる。原語はこの節で二度用いられている。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「律法の中で」。ここでは律法の管轄のもとにあることを表す。
    reason: lexical_alternative
  - marker: c
    text: 「律法を通して」または「律法を基準として」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: 律法なしに
  rationale: 「律法に背いて」として単なる不法行為を前面に出すのではなく、モーセの律法の圏外にいる者と律法のもとにいる者との対比を保つ。二つの出現を同じ表現で訳した。
- source_word: ἥμαρτον
  choice: 罪を犯した
  rationale: アオリストの単純な過去の叙述を、現代日本語で自然に表した。
- source_word: ἀπολοῦνται
  choice: 滅びます
  rationale: 未来の帰結を簡潔に示し、滅びの具体的な様態について本文以上の教理的限定を加えない。
- source_word: ἐν νόμῳ
  choice: 律法のもとで
  rationale: 直訳的な「律法の中で」よりも、律法の支配・管轄の圏内にあるという文脈上の意味を自然に伝える。
- source_word: διὰ νόμου
  choice: 律法によって
  rationale: διά＋属格が示す手段・媒介の意味を自然な日本語で表し、律法が裁きにかかわることを保持する。
- source_word: κριθήσονται
  choice: 裁かれます
  rationale: 司法的な評価を表す語として訳し、「罪に定められます」として結論を先取りしない。
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: …人は皆、…人は皆
  rationale: 二つの集団それぞれに及ぶ分配的な意味と、原文の並行構造を明確にする。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の主張を根拠づける論理的なつながりを、自然な現代日本語で示す。
theological_decisions:
- issue: νόμος（律法）の指示対象
  choice: 本文では「律法」とし、主としてモーセの律法を指す文脈を保つ
  alternative: 一般的な道徳法則として明示する
  rationale: ローマ2章のユダヤ人と異邦人の対比では、モーセの律法を持たない者とその管轄内にいる者が中心となる。ただし説明語を本文に挿入せず、原文の簡潔さを保った。
- issue: ἀπολοῦνται（滅びます）が示す最終的帰結
  choice: 「滅びます」とし、その様態を限定しない
  alternative: 「消滅します」または「罪に定められます」とする
  rationale: この節自体は滅びの具体的な仕方を定義していないため、消滅や永遠の刑罰など特定の理解を訳文で確定せず、神学的緊張を残した。
- issue: κριθήσονται の司法的含意
  choice: 「裁かれます」と中立的に訳す
  alternative: 「罪に定められます」と訳す
  rationale: 文脈上は有罪の帰結が強く示唆されるが、動詞そのものは裁判・審理を表し得るため、翻訳では判決内容を明示しすぎない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「というのも」で論証のつながりを示し、二つの集団の並行を反復によって明確にした。敬体を用いながら、専門的・教派的な語の追加は避けた。
