  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θλῖψις καὶ στενοχωρία, ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου τοῦ κατεργαζομένου τὸ κακόν, Ἰουδαίου τε πρῶτον καὶ Ἕλληνος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/009.yaml
  text: There will be affliction and distress upon every human soul that does evil[b][a], to the Jew first and also to the Greek.
translation:
  language: ja
  text: 苦難と苦悩が、悪を行うすべての人[a]に臨みます。まずユダヤ人に、またギリシア人[b]にも臨みます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「人間のすべての魂」。すなわち「すべての人」。
    reason: lexical_alternative
  - marker: b
    text: ここで「ギリシア人」は、ユダヤ人との対比における非ユダヤ人を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψις
  choice: 苦難
  rationale: 深刻な圧迫や患難を表す語として、現代日本語で自然かつ荘重であり、στενοχωρίαとの並列も保てる。
- source_word: στενοχωρία
  choice: 苦悩
  rationale: 追い詰められた苦しみを示し、「苦難」と重なりすぎず、二語による強調を伝える。
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: すべての人に
  rationale: ψυχήはここでは人そのものを指す換喩的表現であり、日本語で「すべての人」とすることで意味を明瞭かつ自然に伝える。「すべての人の魂」も直訳として可能なので脚注に示す。
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: 悪を行う
  rationale: 継続的な実践を含み得る分詞だが、文脈上は道徳的行為を簡潔に述べており、「悪を行う」が自然で過剰な限定を加えない。
- source_word: Ἰουδαίου
  choice: ユダヤ人
  rationale: ここではユダヤ民族・宗教共同体を指し、単なるユダヤ地方の住民という意味ではない。
- source_word: Ἕλληνος
  choice: ギリシア人
  rationale: パウロの「ユダヤ人／ギリシア人」という実際の対句を保持する。「異邦人」は文脈上の意味を説明する訳だが、語形より広い。
- source_word: πρῶτον
  choice: まず
  rationale: 優先ないし順序を示す原文を自然な日本語で保持し、その神学的意味を訳文で限定しない。
theological_decisions:
- issue: 動詞を欠く簡潔なギリシア語句を日本語でどう完結させるか
  choice: 「苦難と苦悩が…臨みます」と述語を補う
  alternative: 「苦難と苦悩が…の上に」と名詞句のまま訳す
  rationale: 前後の裁きの文脈から結果として臨むことが明らかであり、日本語の文として自然に完結させつつ、新たな教理内容は加えない。
- issue: ψυχήを「魂」と訳すか、人全体を指す表現として訳すか
  choice: 「人」
  alternative: 「人の魂」
  rationale: ここでψυχήは身体と区別された不滅の部分だけを限定的に指すとは限らず、人そのものを表す。訳文では自然な「人」とし、具体的な原語表現は脚注で保存する。
- issue: 「まずユダヤ人に」の意味
  choice: 「まず」をそのまま保持する
  alternative: 責任、裁きの順番、救済史上の優先のいずれかを明示する
  rationale: 原文は優先性を示すが、その性質をこの節だけで一義的に説明してはいないため、解釈を訳文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁きについての荘重さを保った。「あります」より動的な「臨みます」を採用し、対句は「まず…そして…にも」で明確にした。脚注記号は該当語の直後に置いた。
