  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: ja
  text: また、私たちは、こうしたことを行っている者たちに対する神の裁きが真実にかなっていることを知っています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「真理にかなっている」。すなわち、神の裁きは真実、すなわち現実に即している。
    reason: κατὰ ἀλήθειανの語義上の別訳と、その「真理・現実との一致」という意味を示すため。
lexical_decisions:
- source_word: οἴδαμεν
  choice: 私たちは知っています
  rationale: 完了形に由来する現在の意味を自然な現代日本語で表し、確かな共有認識を示す。
- source_word: δέ
  choice: しかし
  rationale: 前節で他人を裁きながら同じことを行う者に向けた論旨を受け、軽い対照・転換を示す接続として表した。
- source_word: κρίμα
  choice: 裁き
  rationale: 有罪宣告という結果だけに限定せず、神による司法的判断を広く保持する。
- source_word: κατὰ ἀλήθειαν
  choice: 真実に即している
  rationale: κατάの適合・一致の意味とἀλήθειαを明示しつつ、日本語として自然に、神の裁きが真実ないし実際のところと一致することを表す。
- source_word: ἐπὶ
  choice: に対する
  rationale: 裁きが向けられる対象を、自然な司法的日本語で明確にした。
- source_word: τὰ τοιαῦτα
  choice: こうしたこと
  rationale: 直前の文脈で述べられた同種の行為を指す中性複数表現を自然に受ける。
- source_word: πράσσοντας
  choice: 行っている者たち
  rationale: 現在分詞の継続的・特徴的な行為の含みを「行っている」で保持する。
theological_decisions:
- issue: κατὰ ἀλήθειανを解釈的に「正しく」とするか、真理・真実との一致を明示するか
  choice: 真実に即している
  alternative: 正しい／真理に従っている
  rationale: 単に裁きが正当だと要約せず、神の裁きが真実・現実に適合するという原文の神学的表現を保持する。「真理に従っている」も可能だが、抽象的な規範への服従と誤解されにくい「即している」を採った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こうしたこと」は文脈への照応を自然に示し、「裁き」「真実」は原文の司法的・神学的語感を保持する。
