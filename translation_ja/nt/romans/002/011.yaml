  text: οὐ γάρ ἐστιν προσωπολημψία παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: ja
  text: 神にはえこひいきがないからです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「偏り」。
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: からです
  rationale: 直前の記述の根拠を示す接続語。日本語では文末の「からです」によって説明・理由の働きを自然に表した。
- source_word: προσωπολημψία
  choice: えこひいき
  rationale: 身分や外面的な条件によって人を不当に扱い分けることを指す。現代の一般読者に明瞭であり、道徳的・裁判的な含意も伝わる。別訳は脚注に示した。
- source_word: παρὰ τῷ θεῷ
  choice: 神には
  rationale: 神との関係・神のもとにそのような偏りが存在しないことを、日本語として自然かつ簡潔に表す。
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: 神にはえこひいきがないからです
  rationale: 「神はえこひいきしない」という動作表現に言い換えず、原文の存在構文を「神には……がない」として保った。
theological_decisions:
- issue: 神の公平さの表現
  choice: 「神にはえこひいきがない」とし、神のもとに偏った扱いが存在しないという一般的な宣言として訳す。
  alternative: 「神はえこひいきをなさらない」と動作表現で訳す。
  rationale: どちらも同じ基本的真理を伝えるが、採用訳は原文の存在構文により近く、明示されていない動作表現を加えない。
translation_notes:
  register: 明瞭で現代的な標準語を用いた。「えこひいき」は口語にも通じるが、ここでは神が人の身分や外面によって不公平に扱わないことを端的に示す語として用いている。文末の「からです」で前節との論理的つながりを明示した。
