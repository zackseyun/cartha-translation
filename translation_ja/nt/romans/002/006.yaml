  text: who will repay each one according to his works[a][b].
translation:
  language: ja
  text: 神は、一人一人に、その行いに応じて報いられます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: 神は
  rationale: 関係代名詞の指示対象は直前の文脈にある神。日本語で単独の関係節として不自然になるのを避け、明示して自然につないだ。
- source_word: ἀποδώσει
  choice: 報いられます
  rationale: 与え返す、応報するという司法的な意味を保ちつつ、現代日本語で自然かつ厳粛な表現とした。文脈上、好意的な褒賞だけに限定しない。
- source_word: ἑκάστῳ
  choice: 一人一人に
  rationale: 単数与格の配分的な力と、各人への個別的な強調を自然な日本語で示す。
- source_word: κατὰ
  choice: に応じて
  rationale: 行いを応報の基準とする関係を、明瞭で自然な日本語として表す。
- source_word: τὰ ἔργα
  choice: その行い
  rationale: ἔργαの具体的な行為・所業という意味を、一般読者に明快な「行い」で表した。
- source_word: αὐτοῦ
  choice: その
  rationale: ἑκάστῳを受け、各人自身の行いであることを表す。日本語では性別を示さずに原文の代表的・包括的な指示を自然に保持できる。
theological_decisions:
- issue: 行いに応じた裁き
  choice: 「行いに応じて報いられます」とし、応報とその基準を明示する。
  alternative: 「扱われます」「褒美を与えられます」などと一般化または好意的報酬に限定する。
  rationale: 原文は各人の行いに従う応報を明言しているため、パウロの義認論との緊張を翻訳で和らげたり調和させたりしない。
translation_notes:
  register: 明快な現代標準日本語。神への敬意を示す敬語を用いながら、司法的な応報の厳粛さを保持した。独立引用としても自然に読めるよう、前文を受ける関係代名詞ὃςを「神は」と明示した。
