  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: ja
  text: しかし、もしあなたが自らユダヤ人と名乗り[a]、律法を頼みとし[b]、神を誇りとするなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ人という名で呼ばれ」または「ユダヤ人の名を持ち」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「律法の上に休む」。別訳「律法に寄りかかり」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: しかし、もし
  rationale: εἰの条件の力と、δέの穏やかな対照・論旨の継続を自然な現代日本語で表す。
- source_word: Ἰουδαῖος
  choice: ユダヤ人
  rationale: ここでは地理的な「ユダヤ地方の人」よりも、民族的・宗教的な呼称が中心である。
- source_word: ἐπονομάζῃ
  choice: 自ら…と名乗り
  rationale: 中動態が含み得る、自分でその名称を掲げるという再帰的・修辞的な響きを保つ。
- source_word: ἐπαναπαύῃ
  choice: 頼みとし
  rationale: 物理的に休む意味ではなく、律法に信頼や安心の根拠を置く意味を、明瞭で自然な日本語にする。
- source_word: νόμῳ
  choice: 律法
  rationale: パウロが念頭に置くモーセの律法という既知の契約的範疇を示す。日本語では冠詞を補う必要はない。
- source_word: καυχᾶσαι
  choice: 誇りとしている
  rationale: καυχάομαιの「誇る」という意味を保ちつつ、「神を誇る」より自然な日本語とし、文脈によって評価が定まる余地も残す。
- source_word: ἐν θεῷ
  choice: 神を…として
  rationale: ἐνが示す、誇りの対象または根拠を「神を誇りとする」と自然に表現する。
theological_decisions:
- issue: 「神を誇る」の評価
  choice: 「神を誇りとしている」とし、表現自体を明確に否定的とはしない
  alternative: 「神のことで自慢し」と否定的な含意を強める
  rationale: καυχᾶσαιの評価は文脈によって決まり、この節だけで傲慢さを訳文に過度に織り込まないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの条件文の張りを保った。後続節へ続く未完の構文なので、末尾は読点とした。「律法」「ユダヤ人」など定着した聖書語彙は維持し、過度に教派的な解釈は避けた。
