source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: ja
  text: それでは、割礼を受けていない人が律法の要求を守るなら、その人の無割礼は割礼と見なされるのではありませんか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「それでは、無割礼が律法の要求を守るなら、その人の無割礼は割礼と見なされるのではありませんか」。前半の「無割礼」は、割礼を受けていない人を指しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: 割礼を受けていない人／その人の無割礼
  rationale: 同じ名詞が節内で二度用いられているが、前者は律法を守る主体を指す換喩的用法、後者は αὐτοῦ（その人の）を伴って無割礼の状態そのものを指す。自然な日本語と原文の意味の推移を両立させた。
- source_word: δικαιώματα
  choice: 要求
  rationale: 複数形で、律法が命じ求める事柄を表す。「規定」も可能だが、文脈上の服従という面を明瞭に伝える。
- source_word: νόμου
  choice: 律法の
  rationale: パウロの議論におけるモーセ律法を指すものとして、標準的な聖書用語「律法」を用いた。
- source_word: φυλάσσῃ
  choice: 守る
  rationale: 命令や律法を遵守するという文脈に自然であり、語の意味を簡潔に表す。
- source_word: λογισθήσεται
  choice: 見なされる
  rationale: ある状態を別の資格・範疇に属するものとして算定する意味を自然な日本語で示す。「数えられる」より、この文脈での判断・認定の意味が明瞭。
- source_word: εἰς περιτομήν
  choice: 割礼と
  rationale: λογίζομαι と結びつき、割礼という資格・状態として扱われることを表すため、「割礼と見なされる」とした。
- source_word: οὐχ
  choice: 〜のではありませんか
  rationale: 肯定の答えを予期する否定疑問文の力を、現代日本語の修辞疑問として保持した。
theological_decisions:
- issue: 無割礼が割礼と見なされることの範囲
  choice: 原文どおり修辞疑問として述べ、救済論的・契約論的な含意を本文で限定しない
  alternative: 神の前で完全に割礼者と同一の契約的地位を得る、と明示する
  rationale: この一節自体は「見なされる」と述べるのみで、その具体的範囲は周辺文脈から論じるべきである。本文で特定の神学体系に解消しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、修辞疑問の格調とパウロの対比を保持した。「割礼」「無割礼」「律法」は文脈上重要な用語として統一的に残した。
