  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: ja
  text: というのは、「あなたがたのせいで、神の名は異邦人の間で冒瀆されている」と書かれているとおりです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異邦人」は「諸国民」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: パウロは聖書、特にイザヤ書52章5節を踏まえている。エゼキエル書36章20～23節にも同じ主題が見られる。
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: 引用文と「書かれているとおりです」の構文で理由づけを示す
  rationale: 前節までの叱責の根拠を導く接続詞。日本語では独立した「というのは」を加えるより、聖書引用を直接提示する形が自然で、その説明機能も文脈から明らかになる。
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: 神の名
  rationale: 原文どおり「名」を保ち、評判などへの説明的な言い換えは避けた。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのために
  rationale: διά＋対格が表す原因を示す。「あなたがたのせいで」も可能だが、引用調の品位と原文の簡潔さを保つため、この表現を選んだ。
- source_word: βλασφημεῖται
  choice: 冒瀆されている
  rationale: 現在受動形と、神に対する不敬な言動という強い意味を保持した。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 異邦人の間で
  rationale: ローマ書のユダヤ人と異邦人という文脈では、人々としての「異邦人」が最も自然である。語義上可能な「諸国民」は脚注に示す。
- source_word: καθὼς γέγραπται
  choice: と書かれているとおりです
  rationale: 聖書を引用する定型句として、καθώςの比較・一致の意味とγέγραπταιの完了受動的な定着性を自然な日本語で表した。
theological_decisions:
- issue: δι’ ὑμᾶςが示す責任の強さ
  choice: あなたがたのために
  alternative: あなたがたのせいで
  rationale: 原因・責任は明確にしつつ、原文以上に口語的な非難の響きを付加しない。
- issue: ἔθνηの指示対象
  choice: 異邦人
  alternative: 諸国民
  rationale: パウロの議論におけるユダヤ人との対比を明瞭にしながら、別の可能な訳語を脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書引用としての簡潔さと品位を保った。「冒瀆」は常用的に理解可能な宗教語として採用し、読みを妨げる古風な構文は避けた。
