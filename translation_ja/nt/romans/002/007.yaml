  yaml_path: translation/nt/romans/002/007.yaml
  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: ja
  text: 忍耐をもって善を行い、栄光と誉れと不朽を求める人々には、永遠のいのちをお与えになります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: 忍耐をもって善を行い
  rationale: 属格句を自然な現代日本語で表しつつ、「忍耐」と「善い行い」の双方を保持した。文脈上、継続して善を行う意味を含む。
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: 栄光と誉れと不朽
  rationale: 三つの目的語の並列を保った。「ἀφθαρσία」は単なる長寿ではなく、朽ちることのない状態を指すため「不朽」とした。
- source_word: ζητοῦσιν
  choice: 求める
  rationale: 継続的な志向を表す現在分詞を、簡潔に「求める」と訳した。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: 聖書日本語として定着し、時間的永続と来たるべき時代のいのちを含みうる表現を採用した。
theological_decisions:
- issue: 「永遠のいのち」と善い行いとの関係
  choice: 節の統語に従い、忍耐して善を行う人々に神が永遠のいのちを与えるという文面をそのまま保持した。
  alternative: 善い行いを信仰の証拠などと説明的に補足する。
  rationale: 本節自体はその体系的関係を説明していないため、特定の教理的調整を訳文へ持ち込まない。
- issue: 動詞の補完
  choice: 前節の主動詞 ἀποδώσει（報いる／与える）を受け、「与えられます」と補った。
  alternative: 原文どおり名詞句として「永遠のいのち」とだけ置く。
  rationale: 日本語の独立した節として明瞭にするため、文脈上省略された述語を補った。ただし裁きの主体である神を明示的な名詞として追加しなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「いのち」は聖書文体としての可読性と慣用を考慮して平仮名表記とした。
