id: ROM.11.11
reference: Romans 11:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: ja
  text: では、私は尋ねます。彼らがつまずいたのは、倒れるためだったのでしょうか。[a] 決してそうではありません。むしろ、彼らの背きによって、異邦人に救いが及びました。[b][c] 彼らにねたみを起こさせるためです。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「つまずく」と「倒れる」を別の語で表している。この問いは「そうではない」という答えを予期している。別訳「彼らは倒れるためにつまずいたのでしょうか」。
    reason: lexical_alternative
  - marker: b
    text: 「彼らの違反を通して」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳「諸国民に」。ここではユダヤ人ではない人々、すなわち異邦人を指す。
    reason: lexical_alternative
  - marker: d
    text: 「彼らをねたませるため」とも訳せる。同じ救いを求める思いを彼らに起こさせる、という含みもありうる。
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: そこで私は問います
  rationale: λέγωは直訳すれば「私は言います」だが、ここでは修辞疑問を導く談話表現である。οὖνの推論的なつながりも含め、現代日本語として自然にした。
- source_word: μὴ ἔπταισαν
  choice: 彼らがつまずいたのは……だったのでしょうか
  rationale: μήを伴う疑問は否定の答えを予期する。日本語では文脈上その含意が伝わる修辞疑問とし、πταίωを「つまずく」として後続のπίπτωと区別した。
- source_word: ἵνα πέσωσιν
  choice: 倒れてしまうため
  rationale: ἵνα＋接続法の目的・結果の幅を保ちつつ、「倒れる」として「つまずく」との比喩的対照を維持した。「完全に」「取り返しがつかないほど」などの解釈は加えていない。
- source_word: μὴ γένοιτο
  choice: 決してそうではありません
  rationale: パウロ特有の強い否定を、明瞭で品位ある現代日本語で表した。
- source_word: τῷ αὐτῶν παραπτώματι
  choice: 彼らの過ちによって
  rationale: παράπτωμαは道を踏み外すこと、違反、罪過を表しうる。「過ち」は比喩とのつながりを残しつつ、過度に専門的でない。与格は手段・契機として「によって」とした。
- source_word: ἡ σωτηρία
  choice: 救い
  rationale: ローマ書におけるσωτηρίαの救済論的な重みを保つ標準的な訳語である。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人に
  rationale: ローマ9—11章のユダヤ人と非ユダヤ人の対照では、ἔθνηは文脈上「異邦人」を指す。「諸国民」という原義的な訳も注記した。
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: それは、彼らにねたみを起こさせるためです
  rationale: εἰς＋冠詞付き不定詞の目的・結果の含みを保った。παραζηλόωは嫉妬を引き起こすことにも、同じ祝福を求める競争心を呼び起こすことにもなりうるため、本文では広い「ねたみ」を用いた。
theological_decisions:
- issue: イスラエルのつまずきが最終的・不可逆的な転落を意味するか
  choice: つまずきが「倒れるため」であったことを否定する表現をそのまま保つ
  alternative: 「完全に倒れる」「滅びる」「再起不能になる」と明示する
  rationale: πταίωとπίπτωの区別を「つまずく」と「倒れる」で保持し、最終的破滅か一時的転落かを本文で断定しない。
- issue: 救済史における「ねたみ」の意味
  choice: 異邦人への救いが彼らに「ねたみを起こさせる」目的を持つと訳す
  alternative: 純粋に否定的な嫉妬、または同じ救いを求める積極的な奮起と限定する
  rationale: παραζηλόωには嫉妬と競争的な希求の両方の含みがありうる。本文ではその緊張を保ち、積極的な可能性を注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問と強い否定を自然に表現した。比喩である「つまずく／倒れる」の対照と、「ねたみ」が持つ否定的・積極的双方の可能性を保持した。
