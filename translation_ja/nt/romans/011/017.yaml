id: ROM.11.17
reference: Romans 11:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: ja
  text: しかし、枝のうちのいくつかが折り取られ[a]、野生のオリーブの木であるあなたが、その枝々の間に接ぎ木され、オリーブの木の根とその豊かさに共にあずかる者となったのであれば[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「切り取られ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「オリーブの木の豊かな根に共にあずかる者」とも訳せる。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Εἰ δέ
  choice: しかし、…のであれば
  rationale: δέの穏やかな対照を「しかし」で、εἰの条件を文末の「のであれば」で自然に表した。後続節へ続く未完の条件文であることも保持する。
- source_word: τινες τῶν κλάδων
  choice: 枝のうちのいくつか
  rationale: τινεςと部分属格を明示し、すべての枝ではなく一部であることを保った。
- source_word: ἐξεκλάσθησαν
  choice: 折り取られ
  rationale: 枝の比喩に即してἐκκλάωの受動態を表す。「切り取られ」よりも原語の折るという像に近い。
- source_word: ἀγριέλαιος ὢν
  choice: 野生のオリーブであるあなたが
  rationale: 民族を説明的に補わず、園芸上の比喩をそのまま残した。日本語では「野生のオリーブ」が明瞭で自然である。
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: その枝々の間に接ぎ木され
  rationale: ἐγκεντρίζωを園芸用語「接ぎ木する」で表し、αὐτοῖςは文脈上、残っている枝々を指すものとして明示した。指示対象の別解は脚注に残した。
- source_word: συγκοινωνὸς
  choice: 共に受ける者
  rationale: 他の枝々と共同であずかる意味を、現代日本語で理解しやすく表した。単なる所有ではなく共同参加の含意を保つ。
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: オリーブの木の根とその豊かさ
  rationale: 圧縮された属格連鎖の曖昧さを本文と脚注で示す。本文では根と豊かさを共有対象として読みやすく表し、豊かな根と取る可能性を脚注に残した。
- source_word: ἐγένου
  choice: …者となった
  rationale: 新しい状態への移行を示すアオリストの意味を自然な日本語で表した。
theological_decisions:
- issue: ἀγριέλαιοςが指す者の解釈
  choice: 「野生のオリーブ」と比喩のまま訳す
  alternative: 「異邦人」と説明的に訳す
  rationale: パウロのオリーブの木の比喩を保持し、民族的・神学的な指示対象を本文で先取りして限定しないため。
- issue: 根と豊かさの統語関係
  choice: 「根とその豊かさ」を共に受ける対象として表す
  alternative: 「オリーブの木の豊かな根」または「根、すなわち豊かさ」と取る
  rationale: 属格が重なるギリシア語は複数の統語的理解を許す。本文は共同参加と二要素を読みやすく示しつつ、別の係り受けを脚注に保存する。
- issue: 接ぎ木された位置
  choice: 残っている枝々の間に接ぎ木されたと表す
  alternative: 折り取られた枝々の間、またはその場所に接ぎ木されたと取る
  rationale: ἐν αὐτοῖςの最も自然な文脈的指示は残存する枝々だが、代名詞の指示には形式上の余地があるため脚注で別解を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、オリーブの木、枝、接ぎ木という比喩を保持した。条件節が次節へ続くため、文末は「のであれば、」として開いた形にした。「脂肪」のような古風で誤解を招きやすい直訳を避け、「豊かさ」とした。
