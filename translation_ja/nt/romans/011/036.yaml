id: ROM.11.36
reference: Romans 11:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: ja
  text: すべてのものは、神から出て、神によって存在し、神へと至るからです[a]。神に、栄光が永遠にありますように[b]。アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「なぜなら、すべてのものは神から出て、神によって存在し、神へと至る」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「もろもろの時代に至るまで」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前の賛美の根拠を示す因果的な働きを、現代日本語で自然な文末表現によって保った。
- source_word: ἐξ αὐτοῦ
  choice: この方から出て
  rationale: 起源・源を表すἐξの意味を明確にし、同じ代名詞が反復される修辞も保った。
- source_word: δι’ αὐτοῦ
  choice: この方によって存在し
  rationale: διά＋属格が示す媒介・手段の意味を「によって」で表した。「存在し」は日本語の文として三つの句を自然につなぐための補足であり、万物の存立がこの方を介しているという幅を保つ。
- source_word: εἰς αὐτὸν
  choice: この方へと至る
  rationale: 方向・目標・目的を含み得るεἰςの幅を、「へと至る」によって、単に所有や利益へ狭めずに表した。
- source_word: τὰ πάντα
  choice: すべてのもの
  rationale: 包括的な範囲を明瞭な現代日本語で表し、「万物」よりも一般の読者に直ちに理解しやすい表現とした。
- source_word: αὐτῷ ἡ δόξα
  choice: この方に、栄光がありますように
  rationale: 動詞のない頌栄の句を、日本語で自然な祈願・賛美の形にした。定冠詞を伴うδόξαは「栄光」と訳した。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永遠に
  rationale: 直訳では「もろもろの時代に至るまで」だが、終わりのない持続を表す慣用句として明瞭な「永遠に」を用いた。
- source_word: ἀμήν
  choice: アーメン
  rationale: 礼拝的な同意と確証を表す、現代日本語で定着した音写を用いた。
theological_decisions:
- issue: 反復されるαὐτοῦ／αὐτόν／αὐτῷの指示対象
  choice: 文脈上は神を指すが、本文では一貫して「この方」とした。
  alternative: 各箇所を「神」と明示する。
  rationale: ローマ11:33–35との連続から指示対象は神である一方、原文が固有名詞に置き換えず代名詞を反復する修辞を尊重し、訳文でも明示しすぎないようにした。
- issue: ἐξ・διά・εἰςが示す万物と神との関係
  choice: 起源・媒介・目標という三方向を、「から出て」「によって存在し」「へと至る」で表した。
  alternative: 「神のためにある」または特定の創造論的・目的論的説明に言い換える。
  rationale: 原文の簡潔な並行表現には豊かな神学的含意があるが、一つの体系的説明へ限定せず、各前置詞の基本的な力と緊張を保った。
- issue: αὐτῷ ἡ δόξαの動詞のない頌栄
  choice: 「栄光がありますように」と祈願的に補った。
  alternative: 「栄光はこの方のものです」または「栄光はこの方にあります」。
  rationale: 原文は所有の断定とも賛美の祈願とも受け取れる簡潔な頌栄である。日本語では礼拝的な力を自然に伝えるため祈願形を用いたが、脚注を要するほど意味を限定する補足はしていない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、頌栄にふさわしい簡潔さと品位を保った。「この方」の三度の反復によって原文の修辞を再現し、起源・媒介・目標の並行関係が耳でも分かるようにした。
