reference: Romans 11:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: ja
  text: だから、神の慈しみと厳しさをよく考えなさい。倒れた者たちには厳しさが向けられ、あなたには、あなたがその慈しみにとどまるなら、神の慈しみが向けられます。そうでなければ、あなたも切り落とされます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「折り取られます」。周囲のオリーブの木の比喩に即した表現です。ギリシア語の動詞自体は「切り落とす、切り取る」という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: 目を留めなさい
  rationale: 単なる視覚的な「見なさい」ではなく、神の慈しみと厳しさを注意深く認め、考えるよう促す命令の力を、自然な現代日本語で表した。
- source_word: χρηστότητα / χρηστότης
  choice: 慈しみ
  rationale: 神の親切で恵み深い善意を表し、「厳しさ」との対照にも適する。「親切」より神についての文脈で尊厳があり、「善良さ」より関係的な含意が明瞭である。
- source_word: ἀποτομίαν / ἀποτομία
  choice: 厳しさ
  rationale: 裁きにおける断固とした峻厳さを、意味を過度に強めず明瞭に表す。
- source_word: ἐπὶ μὲν τοὺς πεσόντας / ἐπὶ δὲ σὲ
  choice: 倒れた者たちには／あなたには……向けられています
  rationale: 二つのἐπί句の配分的・方向的な対照を保ちつつ、日本語として自然な対応関係にした。
- source_word: πεσόντας
  choice: 倒れた者たち
  rationale: オリーブの木の比喩の中で、以前の立場から倒れた者を指す実詞的分詞として簡潔に訳した。
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: あなたがその慈しみのうちにとどまるなら
  rationale: 継続を表す動詞と与格の領域的な意味を保ち、神の慈しみの中に継続していることを示す。「その」により直前の神の慈しみを明示した。
- source_word: ἐπεὶ
  choice: そうでなければ
  rationale: ここでは条件が満たされない場合の帰結を導くため、日本語の警告として自然な表現を採用した。
- source_word: ἐκκοπήσῃ
  choice: 切り落とされます
  rationale: 未来受動の意味とἐκκόπτωの「切り取る」という語義を直接反映し、周囲のオリーブの木の比喩も保つ。
theological_decisions:
- issue: 神の慈しみのうちにとどまることに関する条件付きの警告
  choice: 「とどまるなら……そうでなければ……切り落とされます」と、条件と帰結を明示した。
  alternative: 単なる仮定的修辞として警告を弱めること、または堅忍・背教について特定の教派的結論を訳文に織り込むこと。
  rationale: ギリシア語は現実的な条件付き勧告と警告を提示するが、その適用が個人的か共同体的か、また堅忍や背教の体系的教理をここで決着させてはいない。その緊張を保持した。
- issue: θεοῦが修飾する範囲に関する本文異読
  choice: SBLGNT本文に従い、後半を「あなたには神の慈しみが」とした。
  alternative: 「神の」を最初の「慈しみと厳しさ」だけに明示し、後半では単に「慈しみ」とする読み。
  rationale: 提示されたSBLGNT本文のχρηστότης θεοῦを反映した。意味上はいずれも慈しみの主体が神である点に違いはない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「慈しみ」と「厳しさ」の反復対照を維持し、後半は条件文の論理が聞き手に明確になるよう二文に分けた。
