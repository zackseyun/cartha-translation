id: ROM.11.2
reference: Romans 11:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: ja
  text: 神は、前もって知っておられた[a]ご自分の民を退けられたのではありません。それとも、エリヤについての箇所で[b]、聖書がエリヤがイスラエルに反対して神に訴えている[c]ことを何と言っているか、あなたがたは知らないのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「前もって知っておられた」は、「あらかじめ知っておられた」とも訳せます。これを、より強く「あらかじめ選んでおられた」という意味に理解する見方もあります。
    reason: alternative_reading
  - marker: b
    text: 直訳は「エリヤにおいて」。ここでは、聖書のうちエリヤについて記された箇所を指す慣用表現です。
    reason: lexical_alternative
  - marker: c
    text: 「イスラエルに反対して神に願い出ている」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: 退けたのではありません
  rationale: ἀπωθέομαιの「拒絶する、退ける」という意味を、神がご自分の民を見捨てたとの考えを否定する文脈に即して、明瞭な現代日本語で表した。
- source_word: τὸν λαὸν αὐτοῦ
  choice: ご自分の民
  rationale: 契約の民を指すλαόςの含意を保ちつつ、後半で明示される「イスラエル」を前半に補わなかった。
- source_word: προέγνω
  choice: 前もって知っておられた
  rationale: 語の基本的な意味を保ち、「前もって選んだ」などの特定の神学的解釈を本文に持ち込まない表現とした。
- source_word: ἢ οὐκ οἴδατε
  choice: それとも……あなたがたは知らないのですか
  rationale: パウロの修辞疑問を、自然でありながら格調を失わない日本語で再現した。
- source_word: ἐν Ἠλίᾳ
  choice: エリヤについての箇所で
  rationale: 直訳の「エリヤにおいて」ではなく、聖書中のエリヤに関する箇所を指す慣用的用法を明示した。
- source_word: ἡ γραφή
  choice: 聖書
  rationale: パウロの用法において権威ある聖なる書を指すため、日本語で定着した「聖書」とした。
- source_word: ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ Ἰσραήλ
  choice: エリヤがイスラエルを訴えて神に願い出ている
  rationale: ἐντυγχάνωの請願・訴えの意味と、κατά＋属格の敵対的な方向をともに表した。「執り成す」は通常、相手のための好意的な行為を連想させるため避けた。
theological_decisions:
- issue: προέγνωと神の選びとの関係
  choice: 前もって知っておられた
  alternative: あらかじめ選んでおられた／前から愛しておられた
  rationale: この語はパウロの選びに関する議論に関わるが、この節の語そのものだけで「選ぶ」または「愛する」と訳して論争を決着させず、「前もって知る」という語義と神学的緊張を保った。
- issue: ἐντυγχάνειの請願の性格
  choice: 訴えて神に願い出ている
  alternative: 神に執り成している／神に訴えている
  rationale: 対象が「イスラエルに反対して」であるため、好意的な執り成しを示唆せず、神への請願であることとイスラエルに敵対する内容の両方を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問の形を保持した。「ご自分の民」「聖書」により聖書本文としての品位を保ちつつ、古風すぎる語法は避けた。後半は原文のὡς節を日本語で理解しやすくするため「そのことです」と受けた。
