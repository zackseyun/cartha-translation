id: ROM.11.1
reference: Romans 11:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: ja
  text: では、私は問います。神はご自分の民を退けられたのでしょうか。[a] 決してそんなことはありません。[b] なぜなら、この私もイスラエル人であり、アブラハムの子孫[c]、ベニヤミン族の者だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見捨てられたのでしょうか」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では、強い否認を表す定型表現。直訳的には「そんなことが起こりませんように」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「アブラハムの種」。ここではアブラハムの血統に連なる子孫を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: では、私は問います
  rationale: λέγω はここで修辞的な問いを導き、οὖν は前段を受ける推論的なつながりを示す。自然な現代日本語で両方の働きを表した。
- source_word: μὴ ἀπώσατο
  choice: 退けられたのでしょうか
  rationale: ἀπωθέομαι の拒絶・排斥の意味を「退ける」で表し、μήを伴う問いが否定の答えを予期していることは、文脈と直後の強い否定によって示した。「完全に」「永遠に」など原文にない限定は加えていない。
- source_word: τὸν λαὸν αὐτοῦ
  choice: ご自分の民
  rationale: λαόςを「民」とし、αὐτοῦの所有関係を敬意を保った自然な日本語で表現した。神と民との関係を説明的に拡張してはいない。
- source_word: μὴ γένοιτο
  choice: 決してそんなことはありません
  rationale: 単なる否定より強い、パウロ特有の断固とした否認を、明瞭で自然な日本語にした。
- source_word: καὶ γὰρ ἐγὼ
  choice: なぜなら、この私も
  rationale: γάρの理由提示を「なぜなら」で、καίと強調されたἐγώを「この私も」で表した。パウロ自身が反証となる論理を明確に保つ。
- source_word: Ἰσραηλίτης
  choice: イスラエル人
  rationale: 民族的・契約的な呼称を、標準的で過不足のない日本語にした。
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: アブラハムの子孫
  rationale: σπέρμαの系譜的な意味を現代日本語で自然な「子孫」とした。字義的な「種」は脚注に残した。
- source_word: φυλῆς Βενιαμίν
  choice: ベニヤミン族の者
  rationale: φυλήを「族」とし、パウロがその部族に属することを自然な日本語で示した。
theological_decisions:
- issue: 神がイスラエルを退けたという問いの範囲
  choice: 「神はご自分の民を退けられたのでしょうか」と限定語を加えず訳す
  alternative: 「神はご自分の民を完全に退けられたのでしょうか」または「永遠に見捨てられたのでしょうか」
  rationale: 原文には「完全に」「永遠に」に当たる語がない。問いの射程は後続の議論に委ね、民族的イスラエルに関する神学的結論をこの節へ先取りしない。
- issue: μὴ γένοιτο の否定の強さ
  choice: 「決してそんなことはありません」
  alternative: 「いいえ」または「そんなことがあってはならない」
  rationale: 強い否認を保ちつつ、単なる願望や禁止ではなく、先の問いへの断固たる応答として読める表現を選んだ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、修辞的な問いと断固とした否認の力を保った。「ご自分」は神への自然な敬意を示すが、過度な尊敬表現にはしていない。系譜表現は一般読者に分かりやすい「子孫」「族の者」とした。
