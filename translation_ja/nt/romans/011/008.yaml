  to: こう書かれているとおりです。「神は彼らに、無感覚の霊、見ることのない目、聞くことのない耳を、今日に至るまで与えられた。」
  rationale: 「昏迷」を、明瞭な現代語で原語の鈍麻・無感覚を伝える「無感覚」に改めた。「見ることのない目、聞くことのない耳」は、原文の対称性と、目的・結果のいずれにも限定しない含みを保つ。文の読点と敬語を整理し、引用として自然で荘重な文体にした。
