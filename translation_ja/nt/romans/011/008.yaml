  - severity: low
    issue: 目的・結果を含み得る不定詞句の表現を、より直接的に並行させる余地がある。
    rationale: 「見ることのない目、聞くことのない耳」は、目的か結果かを決めつけず、原文の行為を表す不定詞との対応も保つ。
  revised_text: こう書かれているとおりです。「神は彼らに、無感覚の霊、見ることのない目、聞くことのない耳を、今日に至るまで与えられた。」
