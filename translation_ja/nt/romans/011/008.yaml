reference: Romans 11:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: ja
  text: こう書かれているとおりです。「神は彼らに、無感覚の霊、見ることのない目、聞くことのない耳を、今日に至るまで与えられた。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: こう書かれているとおりです
  rationale: 聖書引用を導く定型句として、καθώςの「とおり」と完了形の継続的な効力を自然な現代日本語で表した。
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: 神は彼らに……お与えになった
  rationale: 神が明示的な主語であることと、アオリストの過去の行為を保持した。神を主語とするため敬語表現を用いた。
- source_word: πνεῦμα κατανύξεως
  choice: 昏迷の霊
  rationale: κατάνυξιςが表す知覚の鈍化、麻痺、茫然とした状態を簡潔に表す。「深い眠り」はイザヤ書の背景を映すが、この箇所のギリシャ語を直接表す訳としては限定的なため脚注に置いた。
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: 見えない目
  rationale: τοῦ μή＋不定詞の結果または目的の含みを過度に限定せず、日本語として自然で簡潔な表現にした。
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: 聞こえない耳
  rationale: 前句との並行を保ち、基本的な聴覚と霊的無反応の両方を示し得る表現とした。
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: 今日に至るまで
  rationale: 引用された裁きの状態がパウロの時点まで続くという強調を、荘重で自然な日本語で表した。
theological_decisions:
- issue: 神の働きによる頑なさ、または裁きとしての無感覚
  choice: 「神は彼らに……お与えになった」と、神を行為の直接の主語として保持する。
  alternative: 「神は彼らが……となるのを許された」
  rationale: ギリシャ語は神をἜδωκενの明示的な主語としている。単なる許容へ弱めず、同時に本文を越えて神学体系を付加することも避けた。
- issue: τοῦ μή＋不定詞が示す目的と結果の幅
  choice: 「見えない目と聞こえない耳」
  alternative: 「見ないための目と聞かないための耳」
  rationale: 原文の構文は目的または結果として理解し得る。「ための」として目的だけに固定せず、日本語の自然さを保ちながら曖昧さを残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書引用にふさわしい簡潔で荘重な調子を保った。「昏迷」は日常語よりやや格調があるが、原語の鈍麻・茫然という意味を一語で伝え、脚注によって補足した。
