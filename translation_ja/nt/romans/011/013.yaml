- from: 異邦人であるあなたがたに言います。私は異邦人への使徒であるかぎり、自分の務めを重んじています[a]。
  to: 異邦人[a]であるあなたがたに、私は言います。私は異邦人への使徒である以上、私の務めを大いに重んじています[b]。
  rationale: 本文の意味は維持しつつ、δοξάζωの強調をより十分に反映した。さらに、二つの語義上の別訳注を各該当語に分け、脚注アンカーの対応を明瞭にした。δέおよびμέν οὖνの緩やかな談話上のつながりは、日本語では明示的な接続語を補わずに自然に表せる。
