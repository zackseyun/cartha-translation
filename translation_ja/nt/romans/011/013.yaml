    rationale: 「重んじています」は可能な訳だが、δοξάζωの『栄誉を与える、名誉あるものとする』という強調をやや弱く表す。「大いに重んじています」として修辞的な力を自然な日本語で示す。
  - severity: low
    issue: 脚注アンカーが二つの語義上の論点を一箇所にまとめている
    rationale: 「異邦人／諸国民」と「大いに重んじる／栄誉を与える」は別の原語に関する注であるため、それぞれの訳語に脚注を付けると参照関係が明確になる。
