  verdict: revise
  source_fidelity: 全体として原文の構文と意味をよく反映している。ἔθνηを文脈に即して「異邦人」とすること、διακονίαを「務め」とすることはいずれも適切である。ただし、δοξάζωの強さは単なる「重んじる」よりも「大いに重んじる」とした方がよく表せる。また、原文の二つの異なる語義注は、それぞれ該当語に注記を置く方がアンカーの対応が明確である。
  naturalness: 「異邦人であるあなたがたに、私は言います」は明瞭で自然な現代標準日本語である。「私は異邦人への使徒である以上」は、ἐφ’ ὅσονの根拠・範囲を自然に表す。「私の務め」を用いることで、原文のμουとの対応も読み手に分かりやすくなる。
  terminology: 「異邦人」はローマ9―11章のイスラエルと諸民族の対照に適した用語である。「使徒」「務め」も本文脈にふさわしい。δοξάζωには「栄光を与える／栄誉を与える」の語義があるため、本文の「大いに重んじる」を補う別訳注を付す。
  issues:
