source:
  edition: SBLGNT
  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: ja
  text: 異邦人[a]であるあなたがたに、私は言います。私は異邦人への使徒である以上、私の務めを大いに重んじています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「異邦人」は、原語では「諸国民」とも訳せる。
    reason: ἔθνη／ἐθνῶνの語義上の別訳を示すため。
  - marker: b
    text: 「私の務めに栄誉を与えています」とも訳せる。
    reason: δοξάζωの語義上の別訳を示すため。
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: 異邦人であるあなたがたに言います
  rationale: Ὑμῖνと同格的なτοῖς ἔθνεσινを自然な日本語の呼びかけとしてまとめた。δέは話題の緩やかな移行を示すが、独立した接続語を補わなくても日本語で流れが伝わる。
- source_word: ἐφ’ ὅσον μὲν οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος
  choice: 私は異邦人への使徒であるかぎり
  rationale: ἐφ’ ὅσονを範囲・資格を示す「であるかぎり」とし、ἐγώの軽い強調を「私は」で表した。ἐθνῶνは文脈上、地政学的な諸国民ではなく非ユダヤ人を指す。
- source_word: τὴν διακονίαν μου
  choice: 自分の務め
  rationale: διακονίαはここでパウロに委ねられた使徒的奉仕を指す。「務め」は宗教的専門語に偏りすぎず、委託された働きという意味を保つ。
- source_word: δοξάζω
  choice: 重んじています
  rationale: 基本的には栄誉を与えることを表すが、ここでは自分の務めを尊び、その重要性を高く評価する意。「重んじる」は自己賛美との誤解を避けつつ文脈上の力を伝える。
theological_decisions:
- issue: パウロが自分の務めをδοξάζωするという表現
  choice: 自分の務めを重んじる
  alternative: 自分の務めに栄光を与える／自分の務めを高く評価する
  rationale: 目的語はパウロ自身ではなく「務め」である。訳文は自己誇示と断定せず、神から委ねられた働きを尊び、その意義を際立たせる意味を表す。
- issue: ἔθνη / ἐθνῶνの指示対象
  choice: 異邦人
  alternative: 諸国民
  rationale: ローマ9―11章ではイスラエルと非ユダヤ人との対照が中心であるため、「異邦人」が最も明確である。ただし原語が「諸国民」をも意味し得ることは注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体寄りの聖書文体。「ミニストリー」などの外来語を避け、一般読者にも理解しやすい「務め」を用いた。
