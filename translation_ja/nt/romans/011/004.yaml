id: ROM.11.4
reference: Romans 11:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: ja
  text: しかし、神からの答え[a]は彼に何と言っているでしょうか。「わたしは、バアルに膝をかがめなかった七千人の男を、自分のために残しておいた[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の応答」、または「託宣」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「取っておいた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: 神からの答え
  rationale: 文脈と列王記第一19章の引用元に照らし、エリヤに対する神の権威ある応答を指す。現代日本語として明瞭であり、「託宣」が持つ硬さを避けつつ神的起源を保つ。
- source_word: Κατέλιπον
  choice: 残しておいた
  rationale: アオリストの過去の行為と、その結果として残された者たちが存在する含みを自然な日本語で表す。「取っておいた」も可能だが、残りの者という文脈には「残しておいた」が適する。
- source_word: ἐμαυτῷ
  choice: 自分のために
  rationale: 再帰代名詞の与格を明示し、神がご自身のために彼らを残したという意味を保つ。
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: 七千人の男
  rationale: ἄνδρας は明示的に男性を表すため、一般化して「人々」とせず性別を保持する。
- source_word: οἵτινες
  choice: ～なかった…男
  rationale: 七千人を特徴づける関係節として、日本語では名詞を前から修飾する自然な形にする。
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: 膝をかがめなかった
  rationale: 礼拝的服従を示す原文の身体的比喩を保ち、現代日本語でも理解できる表現とする。
- source_word: τῇ Βάαλ
  choice: バアルに
  rationale: 固有名として音写し、礼拝・服従の対象を示す与格を「に」で表す。
theological_decisions:
- issue: 引用中の応答者が神であることを明示するか
  choice: 「神からの答え」とし、引用内の一人称を保持する
  alternative: 神的起源を明示せず「答え」または「応答」とする
  rationale: 文脈と旧約の引用元は神の応答であることを明らかにしており、χρηματισμός の意味を自然に示すもので、本文を越えた教理的付加ではない。
- issue: ἄνδρας の性別をどう訳すか
  choice: 「男」
  alternative: 「人」または「人々」
  rationale: 原文が男性を明示する語を用いるため、その情報を中性化せず保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用にふさわしい品位を保った。「何と言っていますか」は現在形 λέγει を反映し、「膝をかがめる」は原文の比喩を保持する。脚注記号は該当語句の直後に配置した。
