id: ROM.11.29
reference: Romans 11:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: ja
  text: 神の賜物と召しは、取り消されることがないからです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「後悔されることがない」または「撤回されることがない」。
    reason: ἀμεταμέληταには、後悔しないことと、与えたものを撤回しないことの両面があり得るため。
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: 取り消されることがない
  rationale: この語は「後悔の対象とならない」「撤回されない」という意味を持つ。ここでは神の賜物と召しが撤回されないことを、現代日本語で自然かつ明確に表した。「変わることがない」では意味を広げすぎるため避けた。
- source_word: γὰρ
  choice: からです
  rationale: 前の文の根拠・説明を導く接続語であるため、日本語では文末の「からです」によってその論理関係を自然に示した。
- source_word: τὰ χαρίσματα
  choice: 賜物
  rationale: 神の恵みによって与えられる贈り物を表す語として、聖書文脈でも通用し、簡潔で品位のある「賜物」を用いた。複数形は日本語では形態的に示さず、文脈に委ねた。
- source_word: ἡ κλῆσις
  choice: 召し
  rationale: 神が呼ぶ行為とその神学的な重みを保つ表現として「召し」を選んだ。「呼びかけ」や「招き」よりも、パウロ書簡の用法に適している。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格が、賜物と召しの源または帰属を示すという幅を保てる自然な訳である。
theological_decisions:
- issue: 「神の賜物と召し」が指す範囲
  choice: イスラエルへの特権と召しに限定する語句を補わず、原文どおり一般形で保つ。
  alternative: ローマ9～11章の文脈に基づき、イスラエルへの契約上の賜物と召しであることを本文で明示する。
  rationale: 直近の文脈はイスラエルを強く念頭に置いているが、この節自体は対象を明示していない。本文ではパウロの表現の広がりと神学的緊張を保持する。
- issue: ἀμεταμέληταが表す神の態度と行為
  choice: 神の賜物と召しが「取り消されることがない」と訳す。
  alternative: 神は賜物と召しを「後悔なさらない」と訳す。
  rationale: どちらも語義に含まれ得るが、この文脈では撤回されないという結果を示す訳が自然である。ただし「後悔されない」という語義上の別案は脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての簡潔さと品位を保った。「からです」によって前節との説明関係を明示し、「賜物」「召し」という定着した語を用いた。
