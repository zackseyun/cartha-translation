id: ROM.11.5
reference: Romans 11:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως οὖν καὶ ἐν τῷ νῦν καιρῷ λεῖμμα κατ’ ἐκλογὴν χάριτος γέγονεν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: ja
  text: ですから、今の時にも同じように、恵みによる選びに従った残りの者が存在している。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「恵みの選びに従った残りの者が生じている」。この句は「恵み深い選びに従って」または「恵みに基づく選びに従って」とも訳せる。
    reason: 「恵みの選び」（ἐκλογὴν χάριτος）という属格表現の関係と、γέγονενの完了形が示す成立して現在に至る状態について、主要な訳の可能性を示すため。
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: このように、…にも
  rationale: 直前のエリヤの時代の例から現在への推論と類比を自然な日本語で示す。οὖνの推論性は文脈上「このように」に含ませ、καίは「にも」で保持した。
- source_word: ἐν τῷ νῦν καιρῷ
  choice: 今の時に
  rationale: καιρόςが指す現在の時代・時期を簡潔に表し、エリヤの時代との対比を保つ。
- source_word: λεῖμμα
  choice: 残された者たち
  rationale: 単なる残量ではなく、神の民のうちに残る少数者を指す文脈に即した。「残りの者」も可能だが、現代日本語として意味が明瞭になるようにした。
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: 恵みによる選びに従って
  rationale: ἐκλογήを「選び」、χάριςを「恵み」とし、κατάの規準・対応関係を「に従って」で表した。属格の関係は「恵みによる」としつつ、恩恵的な選びという含みも脚注で示す。
- source_word: γέγονεν
  choice: いる
  rationale: γίνομαιの完了形が示す、成立して現在に至る状態を、日本語では自然な存在表現で示した。成立の動きを強調する訳は脚注に含めた。
theological_decisions:
- issue: パウロ書簡の教理的文脈におけるἐκλογή
  choice: 選び
  alternative: 選定／選ばれたこと
  rationale: 日本語聖書で定着し、名詞として原文の神学的重みを保つ「選び」を採用した。特定の教派的体系までは読み込まない。
- issue: κατ’ ἐκλογὴν χάριτοςにおける恵みと選びの関係
  choice: 恵みによる選びに従って
  alternative: 恵み深い選びに従って／恵みに基づく選びに従って
  rationale: χάριτοςを選びの源・根拠とみる自然な理解を示しつつ、性質を表す属格の可能性を脚注に残し、原文の簡潔な関係を狭く限定しない。
- issue: γέγονενの完了的意味と残りの者の現存
  choice: 残された者たちがいる
  alternative: 残された者たちが生じている
  rationale: 現在の存在状態を明瞭にする自然な日本語を優先した。「残された」は文脈的に受動的含意を持つが、神学的作用を本文で過度に明示しない。
translation_notes:
  register: 明瞭で現代的ながら、パウロの議論にふさわしい簡潔で格調ある文体。「選び」「恵み」は定着した聖書語として保持し、「残された者たち」でλεῖμμαの集合的意味を分かりやすく表した。
