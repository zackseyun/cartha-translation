reference: Romans 11:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: ja
  text: もしあなたが、本来の性質にかなった野生のオリーブの木から切り取られ、自然に反して栽培されたオリーブの木に接ぎ木されたのであれば、まして、本来の枝であるこの人たちは、自分たち自身のオリーブの木に接ぎ木されることでしょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上、「再び自分たち自身のオリーブの木に接ぎ木される」という意味が含まれますが、原文の「接ぎ木される」という動詞自体に「再び」の語はありません。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: 切り取られ
  rationale: ἐκκόπτωの「切り取る、切り離す」という語義を保ち、周辺の接ぎ木の比喩にも自然に合う。
- source_word: ἀγριελαίου
  choice: 野生のオリーブの木
  rationale: 栽培種との対比が明瞭になる、現代日本語として自然な表現。
- source_word: κατὰ φύσιν
  choice: 本来の性質に従って
  rationale: παρὰ φύσινとの対照を保ちつつ、単に「自然に」として接ぎ木作業の自然さと誤解されるのを避ける。
- source_word: παρὰ φύσιν
  choice: 自然に反して
  rationale: 定型的な対照表現を簡潔に再現する。
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: 接ぎ木された／接ぎ木される
  rationale: 園芸上の専門的比喩を明確かつ一般に理解できる日本語で表す。
- source_word: καλλιέλαιον
  choice: 栽培されたオリーブの木
  rationale: 野生種に対する栽培種という対比を、価値判断を加えずに示す。
- source_word: πόσῳ μᾶλλον
  choice: まして
  rationale: 小から大への論証を自然で簡潔な日本語にする。
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: この人たち、すなわち本来の枝
  rationale: οὗτοιが人々を指すことと、文脈上「枝」が補われることの双方を示し、イスラエルという名称は本文以上に明示しない。
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: 自分たちのオリーブの木に
  rationale: ἰδίᾳの帰属の強調と、接ぎ木先を示す与格を自然に表す。
theological_decisions:
- issue: 「この人たち」の指示対象をイスラエルまたはユダヤ人と明記するか
  choice: 本文では「この人たち、すなわち本来の枝」とし、指示対象の特定は文脈に委ねる。
  alternative: 「このイスラエル人たち」または「このユダヤ人たち」
  rationale: ローマ11章の文脈では民族的イスラエルを指すが、この節のギリシア語自体は民族名を用いず、オリーブの比喩の中で「本来のものたち」と述べるため。
- issue: 「枝」を補うか
  choice: 文脈上の補語として「枝」を本文に入れる。
  alternative: 「本来のものたち」とだけ訳す。
  rationale: 原文に「枝」は明記されないが、直前から続く枝と接ぎ木の比喩により強く含意されており、日本語で意味を明瞭にするための最小限の補足である。
- issue: 再び接ぎ木されるという帰還の意味を明示するか
  choice: 本文では「接ぎ木される」とし、「再び」は脚注に示す。
  alternative: 「再び接ぎ木される」
  rationale: 文脈上は元の木への回復が含意されるが、ἐγκεντρισθήσονταιそのものに「再び」の接頭辞や副詞はないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの「本来の性質に従って／自然に反して」という対照と、野生種・栽培種の接ぎ木の比喩を保持した。尊厳ある説明調としつつ、民族的指示対象や回復の含意を本文で過度に明文化しない。
