id: ROM.11.6
reference: Romans 11:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ χάριτι, οὐκέτι ἐξ ἔργων, ἐπεὶ ἡ χάρις οὐκέτι γίνεται ⸀χάρις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: ja
  text: しかし、恵みによるのであれば、もはや行いによるのではありません。そうでなければ、恵みはもはや恵みではなくなります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: 恵みによる
  rationale: 与格を手段・根拠として自然に表し、神から無償で与えられる恵みという文脈を保った。
- source_word: ἐξ ἔργων
  choice: 行いによる
  rationale: ἐκ の起源・根拠の意味を「による」で示し、人の行為を根拠とすることとの対比を明確にした。
- source_word: γίνεται
  choice: ではなくなります
  rationale: 「なる」という動詞性を保ちつつ、日本語として自然な形で、恵みが恵みとして成立しなくなるという論理を表した。
theological_decisions:
- issue: 恵みと行いの相互排他性
  choice: 「恵みによる」と「行いによる」を対句として保持した
  alternative: 「恵みで救われるなら、功績によるのではない」のように補足する
  rationale: 原文には「救い」や「功績」という語がないため補わず、パウロの簡潔な論理と文脈上の緊張を保った。
- issue: γίνεται χάρις の表現
  choice: 「恵みではなくなります」
  alternative: 「恵みはもはや恵みではありません」
  rationale: γίνεται の変化・成立を表す動詞的含意を日本語で保持した。
translation_notes:
  register: 明快で現代的な敬体。簡潔な対比と論理の流れを保ち、原文にない主語や神学用語を補わない。
