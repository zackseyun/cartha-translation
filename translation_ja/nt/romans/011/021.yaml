  text: εἰ γὰρ ὁ θεὸς τῶν κατὰ φύσιν κλάδων οὐκ ἐφείσατο, ⸀οὐδὲ σοῦ φείσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: ja
  text: というのも、神が生まれつきの枝を容赦されなかったのなら、あなたをも容赦されないでしょう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 〜のなら
  rationale: γάρが示す前文からの理由づけは、日本語では文脈の流れと条件表現によって自然に伝わるため、機械的に「というのは」を加えず「〜のなら」とした。
- source_word: ὁ θεὸς
  choice: 神が
  rationale: 主語としての定冠詞付きθεόςを、現代標準日本語で簡潔に表した。
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: 本来の枝
  rationale: κατὰ φύσινの「自然に従った、生来の」という意味を、オリーブの木の比喩を保ちながら自然な日本語で表した。文脈上の指示対象を本文中で明示しない。
- source_word: οὐκ ἐφείσατο
  choice: 惜しまれなかった
  rationale: φείδομαιの「害を加えずにおく、容赦する」という意味と、後半との動詞の反復を保つ表現。「惜しむ」はこの警告の文脈で「容赦する」の意に読める。
- source_word: οὐδὲ σοῦ φείσεται
  choice: あなたをも惜しまれないでしょう
  rationale: οὐδέの付加的否定を「〜をも…ない」で示し、σοῦの単数二人称を「あなた」として保持した。未来形は断定的予告を表す「〜ないでしょう」とした。
theological_decisions:
- issue: 「本来の枝」の指示対象
  choice: 比喩をそのまま保持し、本文では指示対象を明示しない。
  alternative: 「イスラエル」を補って明示する。
  rationale: 文脈上はイスラエルを指すが、この節自体は枝という比喩で述べているため、解釈を本文へ織り込まない。
- issue: 「あなた」への警告の射程
  choice: 単数の「あなた」に対する直接的な警告として訳す。
  alternative: 個人または共同体の救済論に関する特定の教理的枠組みを訳文に加える。
  rationale: 原文は現実の警告を発するが、個人的・共同体的選びや堅忍をめぐる体系的結論まではこの節だけで明示していないため、その緊張を保つ。
translation_notes:
  register: 明瞭で厳粛な現代標準日本語。神への敬意を示すため動詞に尊敬表現を用いたが、過度に古風な文語は避けた。原文の二つの節にあるφείδομαιの反復を「惜しむ」で再現した。
