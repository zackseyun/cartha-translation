- from: 神が、本来の枝を惜しまれなかったのなら、あなたをも惜しまれないでしょう。
  to: というのも、神が生まれつきの枝を容赦されなかったのなら、あなたをも容赦されないでしょう。
  rationale: 原文の条件・理由づけ（εἰ γάρ）、比喩的な「枝」、κατὰ φύσινの生来性、そして両節のφείδομαιの反復を、現代日本語で明瞭に保つために改めた。イスラエルという指示対象や警告の教理的射程は補足していない。
