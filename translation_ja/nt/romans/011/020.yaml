id: ROM.11.20
reference: Romans 11:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: ja
  text: そのとおりです。[a] 彼らは不信仰のために折り取られましたが、あなたは信仰によって立っています。[b] 高ぶってはなりません。[c] むしろ、恐れなさい。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「よろしい」または「確かにそうです」。
    reason: lexical_alternative
  - marker: b
    text: 「信仰によって」は、「信頼によって」とも訳せる。
    reason: alternative_reading
  - marker: c
    text: 直訳「高いことを思ってはなりません」。すなわち、自分を高く見てはならないということ。
    reason: lexical_alternative
  - marker: d
    text: ここでの「恐れ」は、単なる恐怖ではなく、思い上がらず、神の前で畏れと慎みを持つことを含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: καλῶς
  choice: そのとおりです
  rationale: 前節で想定された発言を肯定する応答として、簡潔で自然な現代日本語とした。
- source_word: ἀπιστίᾳ
  choice: 不信仰のために
  rationale: 与格の因果的な意味を明確にし、πίστιςとの対照を保った。
- source_word: ἐξεκλάσθησαν
  choice: 折り取られました
  rationale: 周囲のオリーブの木と枝の比喩を具体的に保つため、「切り捨てられた」ではなく「折り取られた」とした。
- source_word: πίστει
  choice: 信仰によって
  rationale: 与格が立つための手段または根拠を表すことを示し、ἀπιστίαとの対照を保った。
- source_word: ἕστηκας
  choice: 立っています
  rationale: 完了形が表す、現在も続く状態を自然な日本語で表した。
- source_word: ὑψηλὰ φρόνει
  choice: 高ぶってはなりません
  rationale: 直訳的な「高いことを思う」ではなく、自分を高く見るという慣用的意味を明瞭に伝えた。
- source_word: φοβοῦ
  choice: 恐れなさい
  rationale: 命令の鋭さと、神の前での畏れおよび慎みという文脈上の緊張を弱めずに保った。
theological_decisions:
- issue: πίστιςとἀπιστίαの対照
  choice: 信仰／不信仰
  alternative: 信頼／信頼しないこと
  rationale: この箇所では人の応答としての信仰が不信仰と明確に対照されている。「信実」と限定せず、本文では標準的な「信仰」を用いた。
- issue: φοβοῦの意味合い
  choice: 恐れなさい
  alternative: 畏れなさい／用心しなさい
  rationale: 単なる恐怖とも単なる敬意とも決めつけず、神の厳しさを前にした畏れと慎みを含む原文の緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準語。枝を主語とする複数形は文脈に従って「彼ら」とし、読者への単数の呼びかけは自然な「あなた」で表した。命令形は丁寧体の文脈に合わせつつ、警告の強さを保った。
