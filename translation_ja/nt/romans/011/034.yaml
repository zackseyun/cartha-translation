id: ROM.11.34
reference: Romans 11:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τίς γὰρ ἔγνω νοῦν κυρίου; ἢ τίς σύμβουλος αὐτοῦ ἐγένετο;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: ja
  text: というのは、だれが主の思いを知っただろうか。あるいは、だれが主の助言者となっただろうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: パウロはイザヤ書40章13節を踏まえている。そこでもギリシア語本文は、だれが主の思いを知り、だれが主の助言者となったのかと問うている。
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: だれが
  rationale: 修辞疑問を導く疑問代名詞。簡潔で自然な日本語とし、問いの力を保つ。
- source_word: γὰρ
  choice: いったい
  rationale: 直前の文を根拠づける接続的機能は文脈に委ねつつ、引用内の修辞疑問の強調を自然な日本語で示す。「というのは」は単独節では不自然になりやすい。
- source_word: ἔγνω
  choice: 知っただろうか
  rationale: γινώσκωのアオリスト。聖書引用として時を超えた修辞疑問を表すため、「知ったか」より自然で格調ある形にした。
- source_word: νοῦν
  choice: 思い
  rationale: 知性だけでなく意図・考えを含み得る語。「心」より知的側面を保ち、「精神」より自然である。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςを通常どおり「主」と訳し、イザヤ書背景の神への言及を保ちながら、本文以上に神名表記へ限定しない。
- source_word: ἢ
  choice: だれが
  rationale: 並行する第二の修辞疑問。日本語では「あるいは」を明示すると硬く不自然になりやすいため、独立した問いとして並置し、選言的な並行関係を保つ。
- source_word: σύμβουλος
  choice: 助言者
  rationale: 助言を与える者を指す。「相談相手」では対等な協議を暗示しやすく、「助言者」が意味と格調を適切に保つ。
- source_word: αὐτοῦ
  choice: 主の
  rationale: 日本語では「その方の」より先行詞を反復する方が明瞭で自然である。
- source_word: ἐγένετο
  choice: となっただろうか
  rationale: 「なる、そういう立場に就く」の意味を保ち、歴史を通じてそのような者はいないという修辞的含意を自然に示す。
theological_decisions:
- issue: イザヤ書由来の引用における「主」の指示対象
  choice: 本文どおり「主」とし、神を指す引用の力を保つ
  alternative: イザヤ書の神名背景を前面に出して「主なる神」などと明示する
  rationale: ギリシア語本文は κυρίου であり、パウロはギリシア語聖書の表現を用いている。神を指すことは文脈上明らかだが、訳文では本文を越えた限定を加えない。
- issue: 神に助言者が存在し得るかという修辞疑問
  choice: 否定を補わず、問いの形をそのまま保つ
  alternative: 「だれも主の助言者となったことはない」と平叙文で明示する
  rationale: 答えが「だれもいない」であることは明白だが、修辞疑問は神の知恵の測り知れなさを印象深く示すため、その形式を保持する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書引用にふさわしい簡潔で格調ある修辞疑問とした。「主の思い」「助言者」により原文の語義と神学的緊張を保った。
