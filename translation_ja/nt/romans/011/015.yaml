  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: ja
  text: というのも、彼らが退けられたことが世界の和解となったのなら、彼らが受け入れられることは、死者の中からの命[a]でなくて何でしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死者の中からの命」は、驚くべき霊的刷新を比喩的に指すとも、より具体的に死者の復活を指すとも理解できます。原文は意味を一つに限定していません。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ αὐτῶν
  choice: 彼らが退けられたこと
  rationale: ἀποβολήの排除・拒絶という関係的な意味を自然な日本語で表し、文脈上のイスラエルを指す「彼ら」を原文どおり保持する。
- source_word: καταλλαγὴ κόσμου
  choice: 世界の和解
  rationale: パウロ書簡でのκαταλλαγήの標準的な意味を「和解」とし、κόσμοςを異邦人だけに狭めず「世界」と訳す。
- source_word: πρόσλημψις
  choice: 受け入れられること
  rationale: ἀποβολήとの対照を明確にし、再び迎え入れられる含みも持ち得る自然な受動表現とした。
- source_word: ζωὴ ἐκ νεκρῶν
  choice: 死者の中からの命
  rationale: ἐκ νεκρῶνの簡潔で喚起的な表現を保ち、霊的刷新か復活かを本文で限定しない。
- source_word: εἰ μὴ
  choice: でなくて何でしょうか
  rationale: 修辞疑問における「ほかならない」という強い予想回答を、現代日本語として自然に表す。
- source_word: γὰρ
  choice: のなら
  rationale: 直前との論理的連結は条件文全体に織り込み、日本語で不自然な冒頭の接続語を避けた。
theological_decisions:
- issue: 「死者の中からの命」の意味
  choice: 霊的刷新、終末の復活、または両者を響かせる表現のいずれかに限定せず、圧縮された表現を保持する。
  alternative: 「驚くべき霊的再生」または「死者の復活」と明示する。
  rationale: 原文は簡潔で多義的であり、パウロがここで明示していない解釈を訳文に持ち込まないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、修辞疑問の格調と、原文にある「退ける／受け入れる」の対照を保った。脚注記号は解釈上の含みを持つ句の直後ではなく節末に置き、文の流れを妨げないようにした。
