  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: ja
  text: そして、わたしが彼らの罪を取り除くとき、これが彼らに対するわたしからの契約となる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「これが彼らに対する、わたしからの契約である」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὕτη
  choice: そして、これが……である
  rationale: 原文の接続と指示表現を保ち、動詞のない名詞文を自然な日本語で補った。未来的な文脈は従属節の「とき」で十分に示されるため、「となる」とは限定しなかった。
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: わたしから彼らに与える契約
  rationale: διαθήκη は預言書引用の文脈で神の拘束力ある約束としての「契約」。παρ’ ἐμοῦ の起点・出所を「わたしから」で明示しつつ、日本語として意味が通るよう「与える」を補った。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 与格の方向性を保つ。「彼らと」も契約を結ぶ日本語として可能だが、παρ’ ἐμοῦ と対になる「わたしから彼らに」という原文の構造を優先した。
- source_word: ὅταν
  choice: ……とき
  rationale: ここでは反復的な「そのたびに」ではなく、預言的約束が実現する時を指すため。
- source_word: ἀφέλωμαι
  choice: わたしが……取り除く
  rationale: 中動態形だが、文脈上、神が罪を除去する行為を自然かつ簡潔に表す。
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: 彼らの罪
  rationale: 複数形の ἁμαρτίας を日本語の自然な集合表現「罪」で訳し、所有関係も保持した。
theological_decisions:
- issue: διαθήκη の性質
  choice: 契約
  alternative: 遺言、取り決め
  rationale: パウロが引用する預言的・聖書的文脈では、神の救済の約束を指すため。「遺言」では文脈上の契約概念が失われる。
- issue: παρ’ ἐμοῦ と αὐτοῖς の関係
  choice: わたしから彼らに与える契約
  alternative: 彼らと結ぶわたしの契約
  rationale: 後者は自然だが、「わたしから彼らへ」という原文の方向性を弱める。本文では出所と受け手を示し、脚注でより逐語的な形を提示した。
- issue: ὅταν ἀφέλωμαι の時間的意味
  choice: わたしが彼らの罪を取り除くとき
  alternative: わたしが彼らの罪を取り除くたびに
  rationale: 救済史的な預言の実現を示し、反復条件には限定しない。時期そのものは特定せず、原文の緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」は引用中の神の発話として平仮名表記とした。語順は「罪を取り除くとき」を先に置き、日本語として自然にしつつ、契約と罪の除去との結び付きを保持した。
