id: ROM.11.12
reference: Romans 11:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: ja
  text: 彼らの過ちが世界に富をもたらし、彼らの損失[a]が異邦人に富をもたらしたのなら、彼らの満ちること[b]は、なおさらどれほどの富をもたらすことでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「損失」は、「敗北」または「減少」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「満ちること」は、「全数に達すること」または「完全に加えられること」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: παράπτωμα
  choice: 過ち
  rationale: 道を踏み外すこと、違反、罪過という道徳的含意を保ちつつ、現代日本語として自然で、意味を過度に限定しない。
- source_word: πλοῦτος
  choice: 富
  rationale: 神の恵みの豊かさを指す比喩を簡潔に保つ。末尾ではギリシア語の省略を日本語で自然に補うため「大きな富」とした。
- source_word: κόσμου
  choice: 世界
  rationale: イスラエルの外に広がる世界を幅広く指す表現として、原語の広がりを保つ。
- source_word: ἥττημα
  choice: 損失
  rationale: 敗北、減少、損失のいずれにもなり得る稀な語について、一つの解釈に狭めすぎない語を選び、別の可能性を脚注に示す。
- source_word: ἐθνῶν
  choice: 異邦人
  rationale: ローマ書におけるイスラエル／ユダヤ人との対照を明確に伝える。
- source_word: πόσῳ μᾶλλον
  choice: なおさらどれほど大きな
  rationale: 小さいものから大きいものへ論じる比較の力を、自然な日本語の反語的疑問として表す。
- source_word: πλήρωμα
  choice: 満ちること
  rationale: 人数が満ちること、完全に加えられること、回復・完成などに限定せず、原語の量的・質的な幅を保つ。
theological_decisions:
- issue: τὸ πλήρωμα αὐτῶν（彼らの満ちること）の指示内容と含意
  choice: 「彼らが満ちること」と広く訳し、イスラエルの全数、完全な参与、終末的回復のいずれかに限定しない。
  alternative: 「彼らの全数」「彼らが完全に加えられること」「彼らの回復・完成」
  rationale: パウロの表現は簡潔で多義的であり、この節だけでは論争のある神学的解釈を一つに決められないため、その緊張を本文に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ギリシア語末尾の省略された述語は、直前の「富」を受けて「どれほど大きな富となることでしょう」と補い、論旨を自然に伝えた。脚注記号は、それぞれ該当する語の直後に置いた。
