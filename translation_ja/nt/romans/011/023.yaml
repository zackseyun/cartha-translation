id: ROM.11.23
reference: Romans 11:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κἀκεῖνοι δέ, ἐὰν μὴ ⸀ἐπιμένωσι τῇ ἀπιστίᾳ, ἐγκεντρισθήσονται· δυνατὸς γάρ ⸂ἐστιν ὁ θεὸς⸃ πάλιν ἐγκεντρίσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: ja
  text: しかし、彼らも不信仰にとどまり続けなければ、接ぎ木されます。神には彼らを再び接ぎ木することができるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: しかし、彼らも
  rationale: δέの対照的な展開を「しかし」で示し、καίの付加的な力を「も」で表した。ἐκεῖνοιは文脈上、折り取られた枝として語られる人々を指す。
- source_word: ἐὰν μὴ ἐπιμένωσι τῇ ἀπιστίᾳ
  choice: 不信仰にとどまり続けなければ
  rationale: ἐάν＋接続法の条件を自然な日本語の条件形で表し、ἐπιμένωの継続・固執の意味を「とどまり続ける」で保持した。ἀπιστίαはローマ11章の信仰／不信仰の対比から「不信仰」とした。
- source_word: ἐγκεντρισθήσονται
  choice: 接ぎ木されます
  rationale: オリーブの木の比喩と未来受動をそのまま保った。ここにはπάλινがないため、「再び」は加えなかった。
- source_word: δυνατὸς γάρ ἐστιν ὁ θεὸς
  choice: 神には……することができるからです
  rationale: 神の能力を表す述語形容詞δυνατόςを、現代日本語で自然な可能表現にした。γάρは根拠を示す「から」で表した。
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: 彼らを再び接ぎ木すること
  rationale: πάλινの回復・反復の意味を明示的に「再び」で示し、同じ接ぎ木の比喩を一貫して保った。
theological_decisions:
- issue: ἀπιστίαの意味
  choice: 不信仰
  alternative: 不誠実
  rationale: 語としては「不誠実」の含意を持ち得るが、この箇所では信仰と不信仰、接ぎ木と切り離しの対比が中心であるため、「不信仰」が最も直接的である。
- issue: 最初のἐγκεντρισθήσονταιに回復の意味を明示するか
  choice: 「接ぎ木されます」とし、πάλινのある後半だけを「再び接ぎ木する」とした
  alternative: 最初から「再び接ぎ木されます」とする
  rationale: 回復の趣旨は文脈上明らかだが、ギリシア語で「再び」が明示されるのは後半だけであるため、語の配置を尊重した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。樹木の比喩を保ちつつ、条件と根拠の論理関係が自然に伝わる文体とした。
