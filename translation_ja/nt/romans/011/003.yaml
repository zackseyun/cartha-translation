source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: ja
  text: 「主よ、彼らはあなたの預言者たちを殺し、あなたの祭壇を取り壊しました。そして、私一人だけが残されました。そして彼らは、私の命を狙っています[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼らは私の魂を求めています」。ここで「魂」は命を意味する慣用表現。
    reason: ψυχήの字義的な訳語の可能性と、この文脈での慣用的意味を示すため。
lexical_decisions:
- source_word: Κύριε
  choice: 主よ
  rationale: 神への直接の呼びかけであるκύριοςの呼格。新約本文として、自然で荘重な「主よ」とした。
- source_word: ἀπέκτειναν
  choice: 殺し
  rationale: 動詞自体に「殺害」以上の法的・道徳的含意を加えず、現代日本語で自然な「殺す」とした。
- source_word: θυσιαστήριά
  choice: 祭壇
  rationale: 犠牲をささげる祭壇を指すが、文脈上「祭壇」で十分明瞭であり、「いけにえの祭壇」は冗長となる。
- source_word: κατέσκαψαν
  choice: 取り壊しました
  rationale: 掘り崩す、徹底的に壊すという具体性を、祭壇について自然な日本語で表した。
- source_word: κἀγὼ
  choice: そして、私
  rationale: καὶ ἐγώの連結を保ち、ギリシア語にない「私さえ」などの強調は加えなかった。
- source_word: ὑπελείφθην μόνος
  choice: 私一人だけが残されました
  rationale: 受動態と、μόνοςによる数的な唯一性の強調をともに保持した。
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: 私の命を狙っています
  rationale: この脅迫表現のψυχήは「魂」ではなく生命を指す。「命を求めています」より自然で、殺害の意図を表す日本語の慣用表現とした。
theological_decisions:
- issue: 脅迫の慣用句におけるψυχήの訳
  choice: 私の命
  alternative: 私の魂
  rationale: ここでは非物質的な魂について述べているのではなく、エリヤの生命を奪おうとしていることを意味するため。
- issue: καίによる最終節の接続
  choice: それなのに
  alternative: そして
  rationale: 原文のκαίは広い接続機能を持ち、直前の「私一人だけが残された」と「命を狙われている」との文脈的な逆接・追い打ちを自然な日本語で示す。ただし、単純な並列として読む余地は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語。神への呼びかけと引用文の荘重さを保ちつつ、過度に文語的な表現は避けた。敬体は、神に向けた祈りの言葉として自然に用いた。
