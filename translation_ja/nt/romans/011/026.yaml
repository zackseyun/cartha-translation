id: ROM.11.26
reference: Romans 11:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὕτως πᾶς Ἰσραὴλ σωθήσεται· καθὼς γέγραπται· Ἥξει ἐκ Σιὼν ὁ ⸀ῥυόμενος, ἀποστρέψει ἀσεβείας ἀπὸ Ἰακώβ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: ja
  text: 'こうして、イスラエル全体が救われます[a][b]。書かれているとおりです。


    「救い出す方がシオンから来られ[c]、


    ヤコブから不敬虔を取り除かれます。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「こうして」は「このように」とも訳せます。ギリシア語οὕτωςは、ここでは直前に述べられた過程・仕方を指すと考えられます。
    reason: lexical_alternative
  - marker: b
    text: 「イスラエル全体」が誰を指すかについては解釈が分かれます。本訳は、民族的イスラエル全体、信じる残りの者、あるいは神の民全体のいずれかに限定せず、原文の表現を保っています。
    reason: alternative_reading
  - marker: c
    text: 直訳的には「シオンから出て」とも表せますが、ここでは起点を自然な日本語で「シオンから」と訳しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: こうして
  rationale: 直前に述べられた過程・仕方を受ける自然な日本語とし、単なる結果とも方法の限定とも断定しすぎないようにした。
- source_word: πᾶς Ἰσραήλ
  choice: イスラエルは皆
  rationale: ギリシア語の範囲を保ちつつ自然な日本語にした。その指示対象が民族的イスラエル、残りの者、神の民全体のいずれであるかは本文で限定しない。
- source_word: σωθήσεται
  choice: 救われます
  rationale: 未来受動形とパウロ書簡における救済的な重みをそのまま表す。
- source_word: καθὼς γέγραπται
  choice: 次のように書かれているとおりです
  rationale: 聖書引用の定型句を明瞭で自然な現代日本語にした。
- source_word: Ἥξει
  choice: 来て
  rationale: 後続の動詞とつないだ日本語の預言詩として自然に表現し、未来の意味は文全体で保持した。
- source_word: ἐκ Σιὼν
  choice: シオンから
  rationale: 起点を示すἐκを最も自然に表し、「シオンの外から」のような不要な含意を避けた。
- source_word: ὁ ῥυόμενος
  choice: 救い出す方
  rationale: 冠詞付き分詞の実質的な名詞用法を、称号的な重みを保ちながら分かりやすく表した。
- source_word: ἀποστρέψει
  choice: 取り除く
  rationale: ここでは不敬虔をヤコブから離れさせる使役的な意味を自然に表す。「背ける」より意味が明瞭である。
- source_word: ἀσεβείας
  choice: 不敬虔
  rationale: 神への不敬を含む宗教的・倫理的な力を保つ標準的な訳語を採用した。
- source_word: ἀπὸ Ἰακώβ
  choice: ヤコブから
  rationale: 引用の固有名と詩的表現を保ち、「イスラエル」と同一化して言い換えない。
theological_decisions:
- issue: 「イスラエルは皆」の指示対象
  choice: 解釈的な補足を加えず「イスラエルは皆」とした。
  alternative: 民族的イスラエル全体、イスラエルの信じる残りの者、異邦人を含む神の民全体などに限定して訳す。
  rationale: 原文自体では論争のある指示対象が明示的に限定されていないため、その神学的緊張を保持する。
- issue: ὁ ῥυόμενοςの称号性とメシア的適用
  choice: 「救い出す方」とし、文脈上の称号的な重みを保った。
  alternative: 「救い出す者」または固有の称号として「救出者」とする。
  rationale: パウロの文脈ではメシア的に用いられるが、ギリシア語は固有名ではなく冠詞付き分詞なので、日本語で本文以上に固定的な称号へ狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書引用には簡潔で格調ある調子を保った。敬体で本文を整え、引用部では日本語の詩的な行分けを用いた。
