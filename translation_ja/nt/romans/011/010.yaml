  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σκοτισθήτωσαν οἱ ὀφθαλμοὶ αὐτῶν τοῦ μὴ βλέπειν, καὶ τὸν νῶτον αὐτῶν διὰ παντὸς σύγκαμψον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: ja
  text: 彼らの目を暗くして、見えないようにし、彼らの背を絶えず[b]かがませてください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「見ないために」または「見ないように」。ここは目的とも結果とも取れます。
    reason: syntactic_ambiguity
  - marker: b
    text: または「いつも」。継続していることを表す語です。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: 暗くなって……ますように
  rationale: 三人称複数の受動命令形が持つ祈願・呪詛的な力を「ますように」で表し、「見えなくする」と意訳しすぎず、原文の「暗さ」の比喩を保った。
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: 彼らの目
  rationale: 身体的な比喩の中心となる所有表現を、そのまま自然な日本語にした。
- source_word: τοῦ μὴ βλέπειν
  choice: 見えなくなりますように
  rationale: 否定を伴う冠詞付き不定詞が示す目的・結果を、日本語でどちらか一方に限定しすぎない形で表した。文脈上、目が暗くなることの帰結も自然に伝わる。
- source_word: τὸν νῶτον αὐτῶν
  choice: 彼らの背
  rationale: 原文の単数形と身体像を保ち、日本語でも集合的・配分的に理解できる「彼らの背」とした。
- source_word: διὰ παντός
  choice: 絶えず
  rationale: 継続的・恒常的な時間を表し、「永遠に」として終末的な意味を過度に強めない訳語を選んだ。
- source_word: σύγκαμψον
  choice: かがませてください
  rationale: 二人称単数の能動命令を、神への厳しい祈願として自然な敬体で表現した。「背」と結び付く身体的な屈曲の像も保っている。
theological_decisions:
- issue: 呪詛的引用と神の働き
  choice: 第一句を祈願形、第二句を神への直接の願いとして、裁きを求める原文の力を保つ。
  alternative: 将来の予告として訳す、または神の働きを示さない単なる結果として和らげる。
  rationale: この聖句引用は単なる予測ではなく、祈願・命令の形を保っている。厳しさを弱めず、同時に本文にない神学的説明は加えなかった。
- issue: τοῦ μὴ βλέπειν の目的と結果
  choice: 「見えなくなりますように」として、暗くなることの結果を自然に示しつつ、祈願された目的の含みも残す。
  alternative: 「見ないために」と目的だけに限定する、または「その結果、見えなくなる」と結果だけに限定する。
  rationale: ギリシア語構文は目的・結果の両方の含みを持ち得るため、日本語でも一方に断定しない表現を選んだ。
translation_notes:
  register: 現代の一般読者に通じる明瞭な敬体を用いながら、詩編引用の祈願的で厳粛な調子を保った。「目が暗くなる」「背をかがませる」という身体的比喩は説明に置き換えず、そのまま残した。
