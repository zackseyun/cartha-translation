  - severity: low
    issue: 「得られませんでした」に受動的な読みの余地がある
    rationale: ἐπέτυχενはイスラエルが求める対象に到達しなかったという能動的構文です。「得ることができませんでした」で非達成を明瞭にできます。
  - severity: low
    issue: 脚注bの説明が語義をやや限定する
    rationale: πωρόωは硬化・鈍麻の比喩を表しますが、この節の脚注では「霊的に」と明示せず、基本的な語義範囲を示すほうが中立的です。
