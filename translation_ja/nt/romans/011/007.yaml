id: ROM.11.7
reference: Romans 11:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: ja
  text: では、どういうことですか。イスラエルは追い求めているものを得ることができませんでした。しかし、選ばれた人々[a]はそれを得ました。一方、残りの人々はかたくなにされました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「選び」。ここでは、選ばれた人々を指すと考えられます。
    reason: lexical_alternative
  - marker: b
    text: または「感覚を鈍くされました」。この動詞には、硬くする、感覚を鈍くするという意味があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί οὖν
  choice: それでは、どういうことになりますか
  rationale: パウロが直前の議論から結論を問いかける定型的な修辞表現として、推論の流れと問いの力を自然な現代日本語で保った。
- source_word: ὃ ἐπιζητεῖ Ἰσραήλ
  choice: イスラエルは追い求めているもの
  rationale: ἐπιζητεῖの継続的な追求を「追い求めている」で表し、Ἰσραήλは文脈どおり集合的な呼称として保持した。
- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: 得られませんでした
  rationale: ἐπιτυγχάνωの「求めていたものを獲得する、達する」という意味を自然に表した。後半でも同じ動詞に「得ました」を用いて対比を保った。
- source_word: ἡ δὲ ἐκλογὴ
  choice: 選ばれた者たち
  rationale: ἐκλογήは字義的には「選び」だが、ここでは「残りの者たち」と対照される人々を換喩的に指すため、意味を明瞭にした。字義的な別訳は脚注に残した。
- source_word: οἱ δὲ λοιποὶ
  choice: しかし、残りの者たちは
  rationale: 選ばれた者たち以外の人々との対照を明示し、二つ目のδέも「しかし」で表した。
- source_word: ἐπωρώθησαν
  choice: かたくなにされました
  rationale: 受動態と心の霊的な鈍化・硬化の比喩を保ちつつ、行為者を補わなかった。
theological_decisions:
- issue: ἡ ἐκλογὴが抽象的な「選び」か、選ばれた人々か
  choice: 本文では「選ばれた者たち」とした。
  alternative: 「選び」
  rationale: 「残りの者たち」との対照から、ここでは選ばれた人々を指すと理解するのが自然である。ただし、ギリシア語の抽象名詞そのものの形は脚注で示し、語義上の含みを残した。
- issue: ἐπωρώθησανの受動態における行為者
  choice: 「かたくなにされました」とし、行為者を明示しない。
  alternative: 「神が彼らをかたくなにされました」または「彼らは自らかたくなになりました」
  rationale: 原文は受動態で行為者を明示していないため、神の司法的行為と人間の責任をめぐる緊張を本文で一方に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、修辞的な問い、二重の対照、受動態を保持した。「かたくな」は聖書的な響きを持つが現代の一般読者にも理解でき、原文の硬化の比喩にも対応する。
