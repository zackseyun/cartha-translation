  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: ja
  text: 枝々を見下して誇ってはなりません。[a] しかし、もし誇るなら、根を支えているのはあなたではなく、あなたを支えているのは根です。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その枝々に対して誇ってはなりません」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたが根を担っているのではなく、根があなたを担っているのです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: ～に対して誇る／誇る
  rationale: κατάを伴う動詞が表す、相手に対して優越を誇る意味を自然な現代日本語で示した。二度目は条件節に合わせて「もし誇るとしても」とした。
- source_word: τῶν κλάδων
  choice: その枝々
  rationale: 文脈にすでに登場する特定の枝を指す定冠詞を「その」で示し、オリーブの木の比喩を保った。
- source_word: τὴν ῥίζαν / ἡ ῥίζα
  choice: 根
  rationale: 二か所を一貫して訳し、木の源と支えを示す比喩をそのまま保った。
- source_word: βαστάζεις / βαστάζει（省略補充）
  choice: 支えている
  rationale: 「担う」「運ぶ」という像を背景に持ちながら、この文脈での養い支える関係を明瞭に表す。
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: あなたが根を支えているのではなく、根があなたを支えている
  rationale: σὺとἡ ῥίζαの対照、および依存関係の逆転を、日本語の「～のではなく、～」構文で強調した。
- source_word: μὴ
  choice: ～てはなりません
  rationale: 現在命令法を伴う禁止を、尊厳があり明瞭な現代日本語として訳した。継続相を過度に明示しない。
theological_decisions:
- issue: パウロのオリーブの木の比喩における「根」と「枝々」の意味
  choice: 根や枝々が具体的に何を指すかを本文では説明せず、比喩をそのまま残す。
  alternative: 根を族長たち、アブラハム、または契約の約束と明示して訳す。
  rationale: ギリシア語本文は比喩を提示するだけで、その指示対象をこの節で限定していない。翻訳中に特定すれば、本文が保つ解釈上・神学上の余地を狭めるため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。対人関係での優越的な誇りを「～に対して誇る」で表し、原文の木の比喩と対照構文を維持した。
