id: ROM.11.32
reference: Romans 11:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: ja
  text: というのも、神は、すべての者を不従順[b]の中に閉じ込めた[a]からです。それは、すべての者にあわれみを示すためです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「閉じ込めた」は、「囲い込んだ」または「閉じ込めておいた」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「不従順」は、文脈によっては「不信仰」とも訳せますが、ここでは従うことを拒むという、より広い意味だと考えられます。
    reason: lexical_alternative
  - marker: c
    text: 原文は「すべての者」を二度繰り返しています。この広い表現を訳文でも保っています。文脈では、ユダヤ人と異邦人が共に論じられています。
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: 閉じ込めた
  rationale: συγκλείωの「囲い込む、閉じ込める」という具体的な比喩を保つ。アオリストは完了した行為として簡潔な過去形で表した。「引き渡した」では比喩が薄れ、「投獄した」では刑罰的な含意が強すぎる。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前の議論を説明するγάρの機能を、現代日本語で自然に示す。
- source_word: τοὺς πάντας
  choice: すべての者
  rationale: 二度の反復をそのまま保ち、文脈上のユダヤ人と異邦人を含む広がりを訳文の段階で狭めない。「者」は人を指すことを明確にしつつ、原文の包括的で簡潔な表現に対応する。
- source_word: εἰς ἀπείθειαν
  choice: 不従順の中に
  rationale: εἰςの方向・結果の感触と、ἀπείθειαの服従を拒む広い意味を保つ。「不信仰」だけに限定しない。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的を表すἵναの力を、明瞭で自然な日本語にした。
- source_word: ἐλεήσῃ
  choice: あわれみを示す
  rationale: ἐλεέωの能動的な意味を明示する。「あわれむ」も可能だが、「あわれみを示す」は神の慈悲深い働きを自然に表す。
theological_decisions:
- issue: 二つの「すべての者」の範囲
  choice: 両方とも「すべての者」とし、同じ表現を反復する。
  alternative: 「ユダヤ人も異邦人も皆」「すべての人」と明示する。
  rationale: 原文は両節でτοὺς πάνταςを反復している。文脈ではユダヤ人と異邦人が共に視野に入るが、救いの普遍性をめぐる論争を翻訳で先取りせず、原文の広さと神学的緊張を保つ。
- issue: ἵναが示す関係
  choice: 神が閉じ込めた目的として「ためです」と訳す。
  alternative: 結果として「その結果……あわれみを示すことになった」と訳す。
  rationale: ἵναは目的と結果の両面を帯び得るが、ここでは神を主語とする意図的行為の連続として目的の表現が最も素直である。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「というのも……からです」でパウロの論証の流れを示した。神に対する過度な敬語は避け、簡潔で品位ある叙述とした。「すべての者」の反復と「閉じ込める」という原文の比喩を保持した。
