id: ROM.11.14
reference: Romans 11:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴ πως παραζηλώσω μου τὴν σάρκα καὶ σώσω τινὰς ἐξ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/014.yaml
  text: if somehow I may provoke my own people to jealousy and save some of them[a].
translation:
  language: ja
  text: 何とかして、私の同胞にねたみを起こさせ、彼らのうち幾人かを救いたいのです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の同胞」は、パウロと同じユダヤ人のこと。直訳は「私の肉」。
    reason: 原文の比喩的な血縁表現と、その文脈上の指示対象を示すため。
lexical_decisions:
- source_word: εἴ πως
  choice: 何とかして
  rationale: 確実な結果ではなく、パウロの切なる願いと目指すところを表す。現代日本語として自然でありつつ、原文の不確定性を保つ。
- source_word: παραζηλώσω
  choice: ねたみを起こさせ
  rationale: 異邦人の受け入れによってイスラエルにねたみを引き起こすという周辺文脈とのつながりを保つ。単に「奮起させる」とせず、原語のねたみという意味を明示する。
- source_word: μου τὴν σάρκα
  choice: 私の同胞
  rationale: 直訳は「私の肉」だが、ここではパウロと肉によるつながりを持つ民族的同胞、すなわちユダヤ人を指す。日本語本文では意味が明瞭な慣用表現とし、原文の比喩を脚注に残す。
- source_word: σώσω
  choice: 救いたい
  rationale: σῴζωの救済的な重みを「救う」で保つ。εἴ πωςを伴う接続法と文脈上の目的・願望を、自然な日本語の「救いたい」で表した。
- source_word: τινὰς ἐξ αὐτῶν
  choice: 彼らのうち幾人か
  rationale: 先に述べた同胞の中から一部の人々を指すという部分集合の意味を明確に表す。
theological_decisions:
- issue: μου τὴν σάρκα が指すもの
  choice: 本文では民族的・血縁的な意味を「私の同胞」と訳す
  alternative: 「私の肉」と直訳する
  rationale: ここでσάρξは「罪深い性質」ではなく、パウロの肉による同族を指す。日本語の「私の肉」はこの意味では不自然で誤解を招きやすいため、指示対象を本文で明確にし、文字どおりの表現を脚注で示す。
- issue: パウロが人を「救う」という表現
  choice: 原文どおり主語をパウロとして「救いたい」とする
  alternative: 神が救うことを明示するよう意訳する
  rationale: 究極的に救う方についての神学的説明を本文へ補わず、パウロが自らの宣教の働きを通して幾人かを救うと述べる原文の緊張を保持する。
translation_notes:
  register: 明瞭で現代的ながら、書簡としての品位を保つ。「ねたみ」は周辺文脈との語彙的連続性を優先した。「救いたい」は願い・目的を自然に表し、結果の確実性を示さない。
