id: ROM.11.19
reference: Romans 11:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐρεῖς οὖν· Ἐξεκλάσθησαν κλάδοι ἵνα ἐγὼ ἐγκεντρισθῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: ja
  text: すると、あなたは言うでしょう。「枝々が折り取られたのは、私が接ぎ木されるためだった」と。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: あなたは言うでしょう
  rationale: λέγωの未来能動直説法二人称単数。パウロが議論の中で想定上の相手に直接語りかける形を保ちつつ、現代日本語として自然な「言うでしょう」とした。
- source_word: οὖν
  choice: すると
  rationale: 先行する議論を受けた推論・談話上のつながりを示す。「それでは」も可能だが、想定される反論を導入する日本語として「すると」が自然である。
- source_word: Ἐξεκλάσθησαν
  choice: 折り取られた
  rationale: ἐκκλάωのアオリスト受動直説法。オリーブの木の比喩を保ち、単なる排除を表す「除かれた」ではなく、枝が木から折り取られる像を明確にした。
- source_word: κλάδοι
  choice: 枝々
  rationale: 無冠詞複数形。複数の枝であることを自然に示し、特定の全枝を意味するかのような「その枝々」は避けた。
- source_word: ἵνα
  choice: ためだった
  rationale: 目的または結果を導く接続詞。想定上の相手が述べる目的的な推論を保持するため、「ため」とした。文全体が過去の出来事について理由を述べる形なので、自然な日本語として「だった」を添えた。
- source_word: ἐγὼ
  choice: 私が
  rationale: 明示された一人称代名詞には強調があるため、「私が」として主語を際立たせた。
- source_word: ἐγκεντρισθῶ
  choice: 接ぎ木される
  rationale: ἐγκεντρίζωのアオリスト受動接続法。園芸上の比喩と受動態をそのまま保つ。「その中に」など、本文にない補足は加えなかった。
theological_decisions:
- issue: 発言者がパウロの議論における想定上の相手であることを明示するか
  choice: 二人称への直接の語りかけと引用だけを訳し、説明を加えない
  alternative: 「すると、ある人は言うでしょう」または「あなたはこう言うかもしれません」
  rationale: ギリシア語は単に二人称単数の未来形を用いる。想定問答の性格は文脈から分かるため、本文中に「ある人」などを補わない。
- issue: ἵνα節を神の意図についての確定的な教理命題として強めるか
  choice: 想定上の相手自身の主張として「私が接ぎ木されるためだった」と訳す
  alternative: 「神が私を接ぎ木するためだった」
  rationale: この節は異邦人側の誇りうる推論を引用しており、パウロ自身がその言い方を無条件に承認しているとは限らない。原文にない「神が」を加えず、緊張を保った。
translation_notes:
  register: 明晰な現代標準日本語を用い、想定問答としての格調を保った。「枝々」「折り取られた」「接ぎ木される」により、直前から続くオリーブの木の比喩を一貫して表現した。
