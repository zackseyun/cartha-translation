  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: ja
  text: というのも、ちょうどあなたがたがかつて神に従わなかったのに、今は彼らの不従順によってあわれみを受けましたように、】【a】
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: あなたがたも
  rationale: ὥσπερは後続節との「ちょうど…ように」という比較を導くが、本節だけでは比較が完結しない。日本語では、31節へ続く対応関係を「も」で自然に示す。γάρの説明的機能は文脈に織り込んだ。
- source_word: ὑμεῖς
  choice: あなたがた
  rationale: 二人称複数を明示する。文脈上は異邦人を指すが、本文にない「異邦人」は補わない。
- source_word: ποτε
  choice: かつては
  rationale: νῦνとの過去・現在の対照を明瞭に表す。
- source_word: ἠπειθήσατε τῷ θεῷ
  choice: 神に従いませんでした
  rationale: ἀπειθέωは不従順と不信の両義を帯びうる。「神に従わない」は神に対する関係的・意志的な意味を自然な現代日本語で表す。
- source_word: νῦν δὲ
  choice: しかし今は
  rationale: 過去の不従順と現在受けているあわれみとの強い対照を保つ。本文では前節との流れも考慮し、自然な接続として「が、今は」とした。
- source_word: ἠλεήθητε
  choice: あわれみを受けました
  rationale: 受動態を自然な日本語で表し、あわれみが与えられたことに焦点を置く。
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: 彼らの不従順によって
  rationale: 与格の手段的・因果的な幅を保つため「によって」とした。τούτωνは文脈上、現在従っていないイスラエルを指すが、本文どおり「彼ら」とする。
theological_decisions:
- issue: ἀπειθέω／ἀπείθειαの意味
  choice: 従わない／不従順
  alternative: 信じない／不信仰
  rationale: 両語は不信と不従順が重なる意味領域を持つ。本文では動詞と名詞の語彙的対応を保ち、認知的な不信だけに限定しない。別訳は脚注に示す。
- issue: τῇ τούτων ἀπειθείᾳの関係
  choice: 彼らの不従順によって
  alternative: 彼らの不従順のために
  rationale: ギリシア語の与格は手段または原因として理解できる。「によって」は救済史的な連関を示しつつ、厳密な因果関係に限定しすぎない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ。「憐れみ」ではなく読みやすい「あわれみ」を採用。比較構文は31節へ続くため、日本語では「あなたがたも」で未完の対応関係を自然に示した。
