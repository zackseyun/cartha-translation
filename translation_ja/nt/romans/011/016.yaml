id: ROM.11.16
reference: Romans 11:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: ja
  text: 初物が聖なるものであれば、練り粉のかたまりも聖なるものです。また、根が聖なるものであれば、枝も聖なるものです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: 初物
  rationale: 神に献げる最初の部分という旧約聖書以来の祭儀的・契約的な響きを保ち、簡潔な比喩として自然である。
- source_word: ἁγία
  choice: 聖なるもの
  rationale: 「聖別された」などと意味を限定せず、二つの比喩に共通する聖書的概念と神学的な含みを保つ。
- source_word: φύραμα
  choice: 練り粉のかたまり
  rationale: 混ぜて練った粉のまとまりを指す語であり、現代の読者にも具体的な像が伝わる表現とした。原文に明示されない「全体」は補わない。
- source_word: ῥίζα
  choice: 根
  rationale: 続くオリーブの木の比喩につながる、自然で正確な植物表現である。
- source_word: κλάδοι
  choice: 枝
  rationale: 植物の比喩における標準的で明瞭な訳語である。
- source_word: εἰ δὲ ... καὶ ...· καὶ εἰ ... καὶ ...
  choice: …であれば、…も…です。また、…であれば、…も…です
  rationale: 後半で省略されている繋辞を日本語では補い、二つの条件文の簡潔な並行関係を明確にした。δέは強い逆接にせず文脈上の軽い接続として処理した。
theological_decisions:
- issue: 初物・根から練り粉・枝へ及ぶ「聖」の性質
  choice: 「聖なるもの」と訳し、その聖性が契約的、代表的、救済的のいずれであるかを特定しない。
  alternative: 「聖別されている」として、神への帰属または契約的な聖別を前面に出す。
  rationale: この節は両者の派生的・代表的な関係を示すが、聖性のあり方を明示してはいないため、特定の教理的理解に限定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、格調を保ちながら簡潔な格言的並行構造を再現した。「初物」は聖書語として定着しており、ここでは説明的に言い換えない。読者向け注がないため、本文に脚注記号は付さない。
