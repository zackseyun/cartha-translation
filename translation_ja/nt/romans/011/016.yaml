  naturalness: 明瞭な現代標準語であり、簡潔な並行構造も保たれている。「聖なるものであれば、…も聖なるものです」の反復は、原文の格言的・論証的な響きに適している。「練り粉のかたまり」も意味が明確で、不自然ではない。
