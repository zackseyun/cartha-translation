revisions:
- from: 同じように、彼らも今は従わないでいます[a]。それは、あなたがたに示されたあわれみによって[b]、彼ら自身もまた今あわれみを受けるためです。
  to: 同じように、彼らも今、不従順になっています[a]。それは、あなたがたに示されたあわれみによって[b]、彼ら自身も今あわれみを受けるためです。
  rationale: 本文を最小限修正し、ἠπείθησανを「不従順になっています」と訳して、現在の救済史的状況を示すνῦνとの関係を自然に表した。τῷ ὑμετέρῳ ἐλέειの文脈的理解と、その別解を示す脚注は維持した。
