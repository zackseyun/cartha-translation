id: ROM.11.31
reference: Romans 11:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: ja
  text: 同じように、彼らも今、不従順になっています[a]。それは、あなたがたに示されたあわれみによって[b]、彼ら自身も今あわれみを受けるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信じていない」とも訳せる。ここで用いられている語は、不信と不従順の両方を表しうる。
    reason: lexical_ambiguity
  - marker: b
    text: 直訳に近くは「あなたがたのあわれみによって」。文脈上は、神があなたがたに示したあわれみを指すと考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同じように
  rationale: 直前の異邦人についての叙述との対応を示す比較・類比の働きを、自然な現代日本語で表す。
- source_word: οὗτοι
  choice: 彼ら
  rationale: 文脈上イスラエルを指す指示語。日本語では「これらの人々」より「彼ら」が自然であり、指示対象は文脈から明らかである。
- source_word: νῦν
  choice: 今は／今
  rationale: 救済史における現在の局面を示す二度の時間表現を、どちらも訳文に残す。最初は対照を自然に示すため「今は」とした。
- source_word: ἠπείθησαν
  choice: 従わないでいます
  rationale: 語が持つ不従順と不信の重なりを「従わない」で広く保ち、アオリストを文脈上の現在に及ぶ状態として自然な日本語で表した。
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: あなたがたに示されたあわれみによって
  rationale: 圧縮された与格表現を、文脈上、神が異邦人の読者に示したあわれみと理解して明確にした。ただし字義的な別訳は脚注に残した。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的・結果を導く節の関係を明瞭にしつつ、どちらか一方に過度に限定しない日本語表現とした。
- source_word: καὶ αὐτοὶ
  choice: 彼ら自身もまた
  rationale: イスラエルもあわれみに含まれるという包含と、αὐτοὶの強調を保つ。
- source_word: ἐλεηθῶσιν
  choice: あわれみを受ける
  rationale: 神があわれみを与えることを示す受動形を、硬すぎない現代日本語で表した。
theological_decisions:
- issue: 「あなたがたのあわれみ」が、異邦人の示すあわれみか、異邦人に神が示したあわれみか
  choice: あなたがたに示されたあわれみ
  alternative: あなたがたのあわれみによって
  rationale: 11章30～32節では、双方の不従順と神から受けるあわれみが対比されているため、神が異邦人に示したあわれみを指す理解が文脈に最もよく合う。ただしギリシア語の圧縮された表現が許す別の取り方を脚注で示した。
- issue: ἀπειθέωを不従順と不信のどちらとして訳すか
  choice: 従わない
  alternative: 信じない
  rationale: この語は信じないことと従わないことの両面を帯びうる。本文ではより広い「従わない」を採り、信仰との関係を排除しないよう別訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「憐れみ」ではなく常用的で読みやすい「あわれみ」を用い、パウロの論理関係を二文で明示した。原文に二度ある「今」をともに保持し、神学的な緊張や語義の幅は脚注で開示した。
