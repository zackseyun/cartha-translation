id: ROM.11.33
reference: Romans 11:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: ja
  text: ああ、神の富と知恵と知識の深さよ！[a] 神の裁きはなんと探り尽くしがたく、その道はなんとたどりがたいことか！[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ああ、神の知恵と知識という富の深さよ！」。ギリシア語の構文では、「富」を後に続く「知恵」と「知識」により緊密に結び付けることもできる。本文は、富、知恵、知識の三つを神に属するものとして並べている。
    reason: alternative_reading
  - marker: b
    text: 「たどりがたい」に当たる語は、足跡などを追って突き止めることができない、という意味を持つ。前の「探り尽くしがたい」とは異なるニュアンスを保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: ああ
  rationale: 頌栄的な驚嘆を導く感嘆詞として、現代日本語でも自然で格調のある「ああ」を用いた。
- source_word: βάθος
  choice: 深さ
  rationale: 神の富、知恵、知識の測り知れない奥深さを表す比喩を、そのまま明瞭に保持した。
- source_word: πλούτου
  choice: 富
  rationale: 単なる物質的財産に限定されない豊かさを含みつつ、パウロ書簡における比喩的な響きを保つ。
- source_word: σοφίας
  choice: 知恵
  rationale: 神の賢明な計画と働きを指す語として標準的であり、「知識」と区別した。
- source_word: γνώσεως
  choice: 知識
  rationale: γνῶσιςの基本的な意味を明瞭に表し、「知恵」へ吸収せず独立した語として訳した。
- source_word: κρίματα
  choice: 裁き
  rationale: 神の判断、決定、評価的な働きを含み得る語の幅を保つ、聖書文脈に自然な表現である。
- source_word: ἀνεξεραύνητα
  choice: 探り尽くしがたい
  rationale: 調査しても完全には究明できないという意味を表し、後続の「たどりがたい」と語感を区別した。
- source_word: ἀνεξιχνίαστοι
  choice: たどりがたい
  rationale: 足跡を追うように道筋をたどって突き止めることができない、という原語の比喩的ニュアンスを保持した。
- source_word: ὁδοὶ
  choice: 道
  rationale: 神の行動の仕方や歩みを表す原文の比喩を、日本語でも簡潔に保った。
theological_decisions:
- issue: 属格「神の」が「富と知恵と知識」にどう関係するか
  choice: 「神の」が富、知恵、知識の三語すべてにかかる読みを本文とした。
  alternative: 「神の知恵と知識の富の深さ」と取り、富を後続二語とより緊密に結び付ける。
  rationale: 語順には別の統語的理解の余地があるが、文脈上は神に属する三つのものを重ねる読みが自然である。曖昧さは脚注で明示した。
- issue: ἀνεξεραύνηταとἀνεξιχνίαστοιの区別
  choice: 「探り尽くしがたい」と「たどりがたい」と訳し分けた。
  alternative: 両語をともに「計り知れない」などの近似表現で訳す。
  rationale: 前者の究明不能と、後者の追跡不能という関連しつつ異なる像を保ち、原文の修辞的な豊かさを反映した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、感嘆文の反復と「ああ」「深さよ」によって頌栄としての格調を保った。「さばき」ではなく常用漢字の「裁き」とし、一般読者への読みやすさを優先した。
