id: ROM.11.35
reference: Romans 11:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ τίς προέδωκεν αὐτῷ, καὶ ἀνταποδοθήσεται αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/035.yaml
  text: Or who has first given to him[b][a], and it will be repaid to him?
translation:
  language: ja
  text: あるいは、だれがまず[a]神に与え、その人に返されるでしょうか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神に前もって与え」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: だれも、神に返礼の義務を負わせるような仕方で、神より先に何かを与えたことはない、という意味。
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: あるいは
  rationale: 直前から続く一連の修辞疑問を結ぶ選言的な接続詞として、簡潔で品位ある表現を採った。
- source_word: τίς
  choice: だれが
  rationale: 人物を問う疑問代名詞であり、ここでは否定の答えを前提とする修辞疑問として自然に表せる。
- source_word: προέδωκεν
  choice: まず…与え
  rationale: προ-が示す時間的・論理的先行を保ち、だれかが神より先に与えて神を負債者にできる、という想定を修辞的に退ける文意を伝える。
- source_word: αὐτῷ（第一例）
  choice: 神に
  rationale: 代名詞の指示対象は文脈上神である。日本語で単に「彼に」とすると不自然で指示が曖昧になるため、明示した。
- source_word: καὶ
  choice: その人に…というのでしょうか
  rationale: 二つの節の連結を、日本語の一続きの修辞疑問として自然に構成した。因果関係を断定的に加えず、並列された論理を保持している。
- source_word: ἀνταποδοθήσεται
  choice: 返してもらえる
  rationale: 返礼・返済されることを表す未来受動の意味を、行為者を本文以上に明示せず自然な日本語で表した。
- source_word: αὐτῷ（第二例）
  choice: その人に
  rationale: 最初の「だれ」を受益者として受け直し、返される相手が先に与えたと仮定される人物であることを明確にした。
theological_decisions:
- issue: 二つの αὐτῷ の指示対象
  choice: 第一例は「神に」、第二例は「その人に」とした。
  alternative: 両方を代名詞のまま「彼に」とする。
  rationale: ギリシア語では同形だが、第一例は神、第二例は先に与えたとされる人物を指す。日本語では指示対象を自然に区別しないと誤読を招くため、それぞれを明確にした。
- issue: προέδωκεν が示す神への先行的な贈与と返済義務
  choice: 「まず」を本文に残した。
  alternative: 単に「与え」と訳し、先行性を省く。
  rationale: 神より先に何かを与えて返礼を要求できる者はいない、という修辞疑問の力点を保つためであり、特定の教派的解釈は付加していない。
- issue: καὶ の論理関係
  choice: 修辞疑問の中で二節を連ねた。
  alternative: 「そのため」「それなら」など明示的な因果表現を用いる。
  rationale: 返礼の含意は文脈にあるが、接続詞自体は単純な καὶ であるため、因果を過度に明文化せず原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、パウロの荘重な修辞疑問を保った。「返してもらえる」は受動の意味を自然に示し、何が返されるかを原文以上に限定しない。
