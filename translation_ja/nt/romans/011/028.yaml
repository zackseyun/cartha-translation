id: ROM.11.28
reference: Romans 11:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: ja
  text: 福音に関しては、彼らはあなたがたのために[a]敵です。だが、選びに関しては、父祖たちのゆえに愛されている者たちです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたのゆえに」とも訳せる。
    reason: διά＋対格には、恩恵と理由・原因の両方の含みがあり得るため。
  - marker: b
    text: 「父祖たち」とは、特にアブラハム、イサク、ヤコブなど、イスラエルの族長たちを指す。
    reason: この語の契約史的な指示対象を明らかにするため。
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: 福音に関しては
  rationale: κατά＋対格が示す観点・領域を表し、μέν…δέの対照構造を自然な日本語で保つ。
- source_word: ἐχθροὶ
  choice: 敵
  rationale: 述語的な複数形の形容詞を名詞として訳し、単なる「敵対的」より強い関係的意味を保つ。誰の敵かは原文どおり明示しない。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのために
  rationale: διά＋対格の理由・恩恵の含みを踏まえ、イスラエルの現状が異邦人に益をもたらしたという文脈に合う表現とした。因果的な訳の可能性は注に残す。
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: 選びに関しては
  rationale: 前半と同じ構文を用いて二つの観点の対照を明瞭にし、ἐκλογήを神の選びを指す簡潔な聖書語として訳す。
- source_word: ἀγαπητοὶ
  choice: 愛されている者たち
  rationale: 受動的な意味と述語形を明確にし、「敵」と「愛されている者たち」というパウロの緊張を保つ。
- source_word: διὰ τοὺς πατέρας
  choice: 父祖たちのゆえに
  rationale: διά＋対格による理由・根拠を直接表し、πατέρεςの契約史的な呼称を保持する。
theological_decisions:
- issue: 「彼ら」の指示対象
  choice: ローマ9―11章の議論におけるイスラエル、すなわちユダヤ人を集合的に指すものとして訳すが、本文では代名詞のままとする。
  alternative: パウロと同時代の不信仰なユダヤ人だけを限定的に指す。
  rationale: 直近の文脈はイスラエルを集合的に扱う一方、その当時の不信仰という状況も含む。訳文で範囲を狭めず、原文の含みを残す。
- issue: 「敵」の意味
  choice: 福音という観点での敵という地位・関係を表す。
  alternative: 神に絶対的に憎まれている、または単に社会的に反対しているという意味。
  rationale: 同じ節が彼らを「愛されている者たち」とも述べるため、両極をそのまま保ち、一方によって他方を解消しない。
- issue: 「父祖たち」の意味
  choice: 特にアブラハム、イサク、ヤコブなど、イスラエルの族長たちを指す。
  alternative: 民族的な先祖一般を指す。
  rationale: ローマ9―11章では神の約束を受けた族長たちが自然な指示対象である。ただし本文では説明的に限定せず、原語に対応する「父祖たち」を用いる。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「福音」「選び」「父祖」というパウロ書簡の重要語を保持した。「敵」と「愛されている者たち」の対照を弱めず、自然で格調ある述語表現に整えた。
