id: ROM.11.25
reference: Romans 11:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: ja
  text: 兄弟たち、あなたがたが自分を賢いと思い込まないように、この奥義を知らずにいてほしくありません[a]。イスラエルには部分的なかたくなさが生じており、それは異邦人の満ちることが実現するまでです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。原文は「兄弟たち」だが、男女を含む集団への呼びかけであり得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「異邦人の満数が入るまで」。原文の「満ちること」は、満数、全面的な参与、完成などを意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: 知らずにいる
  rationale: パウロの定型的な言い回し「あなたがたに知らずにいてほしくない」を、非難めいた響きを避けつつ自然な現代日本語で表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数呼格の形を保つ。ローマの共同体全体への呼びかけであることは文脈から理解できる。
- source_word: μυστήριον
  choice: 奥義
  rationale: 単なる秘密ではなく、かつて隠され今や示された神のご計画というパウロ的な語感を保つ。
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: 自分を賢いと思い込むことのないよう
  rationale: 自己評価に基づく思い上がりへの警告を、過度な意訳を避けながら明瞭にした。
- source_word: πώρωσις
  choice: かたくなさ
  rationale: 霊的な鈍化・硬化を示す語として自然であり、「心」を原文にない形で補わずに表せる。
- source_word: ἀπὸ μέρους
  choice: 一部に
  rationale: 硬化がイスラエル全体ではなく部分的であるという範囲を示す解釈を簡潔に表した。期間が一時的という意味には限定しない。
- source_word: τῷ Ἰσραήλ γέγονεν
  choice: イスラエルの一部にかたくなさが生じた
  rationale: 完了形が示す、すでに生じて現在も続く状態を日本語として自然に表現した。
- source_word: πλήρωμα τῶν ἐθνῶν
  choice: 異邦人の満ちる時
  rationale: イスラエルと対照される非ユダヤ人を「異邦人」とし、πλήρωμαの多義性をできる限り残した。「時」は日本語の文を整える補足で、別解を脚注に示す。
- source_word: εἰσέλθῃ
  choice: 来る
  rationale: 「入る」という空間的比喩を日本語で不自然に際立たせず、到達点を表す従属節として訳した。入るという原義は脚注の代案に反映した。
theological_decisions:
- issue: 「異邦人の満ちること」の意味
  choice: 異邦人の満ちる時が来る
  alternative: 異邦人が満数に達して入って来る
  rationale: 「満ちること」が人数、全面的な参与、終末的完成のいずれを指すかを本文で断定しない。代表的な「満数」の理解は脚注に残す。
- issue: イスラエルに生じた硬化の範囲
  choice: イスラエルの一部に
  alternative: イスラエルに部分的なかたくなさが
  rationale: ἀπὸ μέρουςを硬化の範囲にかける一般的で自然な構文理解を採用し、イスラエル全体の全面的硬化とはしない。
- issue: ἄχρι οὗが示す期限
  choice: 来るまでのことです
  alternative: 来るまで生じています
  rationale: 硬化に終点が示されることは伝えるが、その後のイスラエルの状態や救済史的展開はこの節だけから補わない。
translation_notes:
  register: 現代の一般読者に理解できる、明瞭で荘重な文体。「奥義」はやや聖書的な語だが、μυστήριονの啓示史的な含意を「秘密」よりよく保つ。原文の長い一文は、日本語の可読性のため二文に分けた。脚注記号[a]は本文中に配置済み。
