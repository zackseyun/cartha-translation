  to: また、ダビデは言っています。「彼らの食卓が、わなとなり、捕獲の仕掛けとなり、つまずきとなり、彼らへの報いとなるように。」[a][b]
  rationale: αὐτοῖςを「彼らへの報い」として最終項に結び付け、原文の構文関係を日本語でも明確にした。また、θήρανを「捕獲の仕掛け」として、原文の捕獲に関わる語感と現代日本語としての自然さを両立させた。引用の願望・命令的な力と、厳しい内容は変更していない。
