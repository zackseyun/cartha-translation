id: ROM.11.9
reference: Romans 11:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: ja
  text: また、ダビデは言っています。「彼らの食卓が、わなとなり、捕獲の仕掛けとなり、つまずきとなり、彼らへの報いとなるように。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わなとなり、狩りの仕掛けとなり」とも訳せる。この二語はいずれも捕らえるものを指す近い意味の語である。
    reason: lexical_alternative
  - marker: b
    text: 「報い」は「応報」または「返報」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: ダビデ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: λέγει
  choice: 言っています
  rationale: 引用を導入するギリシア語の現在形を、自然な日本語の叙述現在として表した。
- source_word: Γενηθήτω
  choice: となるように
  rationale: アオリスト命令形の願望・命令的な力を保ち、単なる未来予告にはしなかった。
- source_word: ἡ τράπεζα αὐτῶν
  choice: 彼らの食卓
  rationale: 具体的な比喩を保ち、食物や宴席などに限定して解釈しなかった。
- source_word: παγίδα
  choice: わな
  rationale: 捕縛を表す一般的な語を選び、後続のθήρανとの近似性とわずかな差を示した。
- source_word: θήραν
  choice: 捕らえる仕掛け
  rationale: 狩猟・捕獲に関わる語感を示しつつ、文脈上の罠という意味を自然な日本語で表した。
- source_word: σκάνδαλον
  choice: つまずき
  rationale: 単なる不快感ではなく、倒れる原因という比喩を保持した。
- source_word: ἀνταπόδομα
  choice: 報い
  rationale: 応報・返報を意味するが、本文では懲罰性を必要以上に明示せず、文脈に委ねた。
- source_word: αὐτοῖς
  choice: 彼らにとって
  rationale: 列挙されたすべての述語と自然につながるように表現した。
theological_decisions:
- issue: 詩篇69篇からの呪詛的引用
  choice: 「となるように」と願望・命令の力を保持する
  alternative: 「となるだろう」と予告として訳す
  rationale: Γενηθήτωは命令形であり、厳しい裁きの願いを単なる予言へと弱めず、その緊張を残した。
- issue: ἀνταπόδομαの懲罰的含意
  choice: 報い
  alternative: 報復／懲罰
  rationale: 文脈には懲罰的な含意があるが、語自体の「返されるもの、応報」という幅を保つため、より限定の少ない訳語を選んだ。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。連続するκαίは日本語として過度に反復せず列挙で表し、原文の厳しい願望と四つの述語の積み重ねは保持した。脚注記号は該当する引用文末に配置した。
