source:
  edition: SBLGNT
  text: εὐδόκησαν γὰρ Μακεδονία καὶ Ἀχαΐα κοινωνίαν τινὰ ποιήσασθαι εἰς τοὺς πτωχοὺς τῶν ἁγίων τῶν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: ja
  text: というのも、マケドニアとアカイアの人々は、エルサレムにいる聖なる者たちの中の貧しい人々のために、いくらかの寄付をすることを喜んで決めたからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何らかの分かち合いをする」とも訳せる。原文の表現は、物質的な援助によって表される交わりや分かち合いを含意する。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: 喜んで…することにした
  rationale: 好意的な意志と自発的な決定の両面を表す。単なる「決めた」よりも、εὐδοκέωの肯定的な心情を保つ。
- source_word: γὰρ
  choice: というのも…からです
  rationale: 直前の内容に理由・説明を加える接続関係を、現代日本語で明確かつ自然に示す。
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: マケドニアとアカイアの人々
  rationale: 原文では地域名が共同体を換喩的に指す。日本語で地域そのものが献金すると読まれる不自然さを避けつつ、「教会」や「信者」と限定しすぎない。
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: 献金する
  rationale: この文脈では物質的援助としての分かち合いを指すため、「献金」が実際的意味を明瞭に伝える。τινάの不定性は、日本語では数量語を無理に足さず表現全体に含ませる。共同参与・分かち合いの含意は脚注で示す。
- source_word: εἰς τοὺς πτωχοὺς
  choice: 貧しい人々のために
  rationale: εἰςが示す受益・目的を自然に表し、実体詞的な形容詞を「貧しい人々」と訳す。
- source_word: τῶν ἁγίων
  choice: 聖なる者たちのうち
  rationale: 属格が、貧しい人々を「聖なる者たち」に属する一部として示す関係を明確にする。
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: エルサレムにいる
  rationale: 前置詞句が「聖なる者たち」を修飾する構造をそのまま自然な日本語で表す。
theological_decisions:
- issue: パウロ書簡におけるἅγιοιの訳語
  choice: 聖なる者たち
  alternative: 聖徒たち／神の民
  rationale: 神に属する者としての共同体的身分を保ちつつ、「聖人」という後代の列聖の含意を避ける。「神の民」は意味を説明するが、原語の「聖」の語義を弱める。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、説明的接続と共同体を表す神学語彙に品位を保った。「献金」は文脈上明確だが、κοινωνίαの広い含意を脚注で補った。
