  - severity: low
    issue: τινάの不定性が本文で明示されていない。
    rationale: 日本語では省略も可能だが、「いくらかの」を加えて、特定額を示さない原文の表現を無理なく反映できる。
  - severity: low
    issue: 「聖なる者たちのうち、貧しい人々」の係り受けが読点に依存している。
    rationale: 「聖なる者たちの中の貧しい人々」とすれば、貧しい人々が聖なる者たちという集団の一部であることが明瞭になる。
