  source_fidelity: 「献金する」はこの文脈の物質的支援を捉えているものの、受取人である貧しい聖なる者たちへのκοινωνίαを、宗教団体への献金という日本語の通常の含意にやや狭める。また、τινάの不定性が本文で表れていない。「いくらかの寄付をする」は、金銭的・物質的な寄与という文脈上の意味と不定性を自然に表せる。
  naturalness: 「というのも……からです」は明瞭で自然である。「聖なる者たちのうち、貧しい人々」は読点よりも「聖なる者たちの中の貧しい人々」とした方が修飾関係が明確である。
  terminology: ἅγιοιを「聖なる者たち」とするのは、後代の列聖を連想させうる「聖人」を避けつつ、原語の語彙的要素を保持しており適切である。κοινωνίαについては、本文を「寄付」とし、脚注で分かち合い・交わりの含意を示すのが妥当である。
  issues:
