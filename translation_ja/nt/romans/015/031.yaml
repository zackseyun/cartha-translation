  to: それは、私がユダヤにいる不従順な人々[a]から救い出され、また、エルサレムに向けた私の奉仕が聖徒たちに受け入れられるものとなるためです。
  rationale: 二つの目的節を「…救い出され、また、…受け入れられるものとなるためです」と明確に対応させた。「不従順な人々」は本文の曖昧さを保ち、信仰を拒むという文脈上有力な理解は脚注に留めた。「エルサレムに向けた私の奉仕」は、具体的な献金を補わずに奉仕の方向性を表す。「受け入れられるものとなる」はεὐπρόσδεκτοςとγένηταιを過不足なく反映する。
