id: ROM.15.31
reference: Romans 15:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: ja
  text: それは、私がユダヤにいる不従順な人々[a]から救い出され、また、エルサレムに向けた私の奉仕が聖徒たちに受け入れられるものとなるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤにいる信じようとしない人々」。ギリシア語は、信じることを拒むこと、したがって不従順であることを意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: それは、…ためです
  rationale: 前節から続く祈りの目的・内容を示す。二つの接続法を日本語では一つの目的表現の下に自然にまとめた。
- source_word: ῥυσθῶ
  choice: 私が…から救い出され
  rationale: 危険や敵対者からの解放を表す受動接続法の意味を、明瞭な現代日本語で示した。
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: 従わない人々から
  rationale: ἀπειθέωが含み得る『信じようとしない』ことと『従わない』ことの双方を一方に限定せず、脚注で別訳を示せる訳語とした。
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: ユダヤにいる
  rationale: 人々の所在を修飾する自然な日本語とした。
- source_word: ἡ διακονία μου ἡ εἰς Ἰερουσαλήμ
  choice: エルサレムのためにする私の奉仕
  rationale: διακονίαの広い奉仕の意味を保ちつつ、εἰςが示す奉仕の向かう先を『エルサレムのため』と表した。献金の運搬と限定する語は本文に補わなかった。
- source_word: εὐπρόσδεκτος
  choice: 喜んで受け入れられる
  rationale: 単に許容されるだけでなく、好意をもって歓迎される語感を自然な日本語で表した。
- source_word: τοῖς ἁγίοις
  choice: 聖徒たちに
  rationale: パウロ書簡で信者を指す定着した用語を保った。
- source_word: γένηται
  choice: …受け入れられる
  rationale: 日本語ではεὐπρόσδεκτοςと合わせて受容の出来事として表すのが自然であり、願われている将来の成就を示す。
theological_decisions:
- issue: ἀπειθούντωνが不信仰と不従順のどちらを表すか
  choice: 本文では『従わない人々』
  alternative: 『信じない人々』
  rationale: この分詞は、信じることを拒む意味と、その結果として従わない意味を帯び得る。本文で一方に狭く限定せず、文脈上有力な別訳を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祈りにふさわしい落ち着いた格調を保った。『奉仕』『聖徒』はパウロ的な語彙として維持し、文脈から推測される献金を本文へ明示的に補わなかった。
