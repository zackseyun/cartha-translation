  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: ja
  text: ですから、この務めを果たし、この実りを彼らに確実に引き渡してから、私はあなたがたのところを経て[a]イスパニアへ行きます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがたを通して」。パウロはイスパニアへ向かう途中でローマを経由する計画を述べていると思われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: そこで、この務めを果たし
  rationale: οὖνは前節までを受ける推論・移行として「そこで」とし、τοῦτοは直前から論じられている献金を届ける務めを指すため、日本語では文脈を明確にする「この務め」とした。アオリスト分詞は主動詞に先立つ完了動作として訳した。
- source_word: σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον
  choice: この実りを彼らに確かに届けた後
  rationale: σφραγίζωの字義は「封印する」だが、ここでは献金を受取人に正式かつ確実に引き渡すことを表す比喩的用法と判断した。「封印する」では現代日本語で意味が伝わりにくいため、文脈上の機能を表した。τὸν καρπὸνはパウロの比喩を保ち「実り」とした。
- source_word: δι’ ὑμῶν
  choice: あなたがたの所を通って
  rationale: διά＋属格の経由・通過の意味を、ローマを経由する旅程として自然な日本語にした。援助や同行まで断定しない。
- source_word: εἰς Σπανίαν
  choice: イスパニアへ
  rationale: 目的地を示す表現。聖書本文で伝統的かつ明瞭な地名表記「イスパニア」を採用した。
theological_decisions:
- issue: σφραγισάμενοςの比喩を字義どおり残すか、文脈上の意味を訳すか
  choice: 確かに届けた
  alternative: 封印した／正式に引き渡した
  rationale: 献金がエルサレムの聖徒たちへ確実かつ正式に渡されることを指す可能性が高い。日本語の「封印する」は贈り物を閉鎖・秘匿する印象を与えるため、比喩の機能を本文で明示した。ただし保証・認証・安全な引渡しという含みを一つに限定しすぎない表現を選んだ。
- issue: 「実り」の指示対象
  choice: 比喩を本文に保持する
  alternative: 献金／贈り物
  rationale: 直前の文脈では異邦人信者からエルサレムの聖徒たちへの献金を指すが、本文ではκαρπόςの比喩を保持し、解釈的な置換を避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、旅行計画を述べる書簡として自然でありつつ、丁寧すぎない荘重さを保った。「実り」は原文の比喩を保持し、「確かに届けた」は不自然な字義訳を避けて文脈上の意味を示す。
