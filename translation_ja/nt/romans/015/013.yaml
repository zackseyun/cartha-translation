reference: Romans 15:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: ja
  text: どうか、希望の神が、信じることにおいて、あらゆる喜びと平安であなたがたを満たしてくださいますように。そうして、聖霊の力によって、あなたがたが希望にあふれますように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: どうか、希望の神が
  rationale: δὲの弱い接続性は日本語で不自然な逆接を加えず、文脈上の移行に委ねた。属格は、希望を与え、その根拠でもある神を簡潔に「希望の神」と表した。
- source_word: πληρώσαι
  choice: 満たしてくださいますように
  rationale: アオリスト希求法による祈願を、現代日本語の自然で敬意ある願望表現にした。「満たす」という比喩も保持した。
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: あらゆる喜びと平安で
  rationale: πληρόωに伴う内容の属格を「で」で示し、πάσηςの包括性を「あらゆる」で保った。「平安」は聖書文体として定着しつつ、現代の読者にも理解できる。
- source_word: ἐν τῷ πιστεύειν
  choice: 信じることによる
  rationale: 信じている領域・状況と、それに伴う関係を自然な日本語で示した。名詞「信仰」へ置き換えず、動詞πιστεύεινの行為性を保った。
- source_word: εἰς τὸ περισσεύειν ὑμᾶς
  choice: そうして、あなたがたが…あふれますように
  rationale: εἰς τό＋不定詞が示す目的または結果を断定的に狭めず、前半から生じる意図された帰結として表した。
- source_word: ἐν τῇ ἐλπίδι
  choice: 希望にあふれ
  rationale: περισσεύωと自然に結びつく日本語として「希望にあふれる」とし、冒頭の「希望」との語彙的連関を保持した。
- source_word: ἐν δυνάμει πνεύματος ἁγίου
  choice: 聖霊の力によって
  rationale: ἐνの手段的用法を「によって」で明確にし、πνεύματος ἁγίουはパウロ書簡における指示対象に従い「聖霊」とした。
theological_decisions:
- issue: πνεύματος ἁγίουの指示対象
  choice: 聖霊
  alternative: 聖なる霊
  rationale: このパウロ書簡の文脈では神の聖霊を指すのが自然であり、日本語で定着した固有的呼称「聖霊」を用いる。本文以上の人格論的説明は加えない。
- issue: εἰς τὸ περισσεύεινの目的・結果の幅
  choice: そうして…あふれますように
  alternative: …あふれるためです
  rationale: 祈願文の流れを維持しながら、構文が許す目的と結果の重なりを保つため、硬い目的限定を避けた。
translation_notes:
  register: 明瞭な現代標準日本語による、祈願にふさわしい dignified な文体。「あなたがた」で複数形を明示し、二文に分けて読みやすくした。注記は不要と判断したため、本文に脚注記号はない。
