  source_fidelity: 「異邦人というささげ物」は、προσφορὰ τῶν ἐθνῶν の属格が保つ曖昧さを本文で解消しており、安全ではありません。また、εἰς τὰ ἔθνη は宣教の向かう対象を示すので、「異邦人に対して」のほうが適切です。ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ の祭司的な福音奉仕も、より直接に表せます。
  naturalness: 現行文は概ね明瞭ですが、「神の福音のために祭司の務めを果たす」は「福音」と祭司的奉仕との結び付きがやや弱くなっています。「神の福音を祭司として奉仕し」とすることで、現代標準日本語として不自然にならず、原文の比喩の連関も明確です。
  terminology: 「メシアであるイエス」「異邦人」「神の福音」「聖霊」は適切です。λειτουργός の奉仕と ἱερουργέω の祭司的性格を区別して「奉仕者」「祭司として奉仕する」とし、ἡγιασμένη は「聖なるものとされ」として保持します。
