id: ROM.15.16
reference: Romans 15:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: ja
  text: それは、私が異邦人[a]に対してメシアであるイエスに仕える奉仕者となり、神の福音を祭司として奉仕する[b]ためです。こうして、異邦人のささげ物[c]が、聖霊によって[d]聖なるものとされ、受け入れられるものとなるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民に対して」。ここではユダヤ人以外の人々を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「祭司として奉仕する」または「祭司的な務めを行う」。
    reason: lexical_alternative
  - marker: c
    text: 異邦人自身が神にささげられる供え物であるという意味が有力である。別の解釈では「異邦人がささげる供え物」。
    reason: alternative_reading
  - marker: d
    text: 別訳「聖霊にあって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: 仕える者
  rationale: 公的・宗教的な奉仕者を表し得る語。続く祭司的表現を保ちつつ、後代の特定の聖職制度を本文に持ち込まない自然な訳とした。
- source_word: Χριστοῦ Ἰησοῦ
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を明示し、日本語で不自然な「メシア・イエス」を避けた。
- source_word: εἰς τὰ ἔθνη
  choice: 異邦人のために
  rationale: ローマ書のユダヤ人との対照を踏まえ、諸国民一般ではなく非ユダヤ人への働きを明確にした。
- source_word: ἱερουργοῦντα
  choice: 祭司の務めを果たす
  rationale: 単なる奉仕ではなく祭儀的・祭司的な比喩を明確に保つ。
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: 神の福音
  rationale: パウロ書簡で定着した表現を簡潔かつ荘重に保った。
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: 異邦人というささげ物
  rationale: 文脈上、異邦人自身が神にささげられるものだという可能性が高いため、その比喩を本文で自然に示した。ただし属格の別解は脚注に残した。
- source_word: εὐπρόσδεκτος
  choice: 受け入れられるもの
  rationale: 供え物が好意をもって受納されるという祭儀的文脈に合い、原文に明示されない受け手を過度に補わない。
- source_word: ἡγιασμένη
  choice: 聖なるものとされ
  rationale: 完了受動分詞が表す、聖別された結果の状態を平明な現代日本語で示した。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 聖霊によって
  rationale: ἐνを手段・作用者として理解し、聖別が聖霊の働きによることを自然に表した。領域を示す読みも脚注に残した。
theological_decisions:
- issue: パウロの祭司的な自己描写
  choice: 異邦人への福音宣教を祭司の務めになぞらえる比喩として訳す。
  alternative: 正式な祭司職の主張と読む、または祭司的要素を一般的奉仕へ弱める。
  rationale: λειτουργός、ἱερουργέω、προσφοράが連動しているため祭司的比喩は保持すべきだが、本文は贖罪の犠牲や後代の聖職制度を主張してはいない。
- issue: 「異邦人のささげ物」の指示対象
  choice: 異邦人自身がささげ物であるとの有力な読みを本文に示す。
  alternative: 異邦人がささげる供え物と読む。
  rationale: 宣教と祭司の比喩の流れは、福音を受け入れた異邦人をパウロがささげ物として差し出す理解を支持する。ただしギリシア語属格には別の解釈の余地があるため脚注で保持した。
- issue: 聖霊と聖別の関係
  choice: 聖霊を聖別の作用者・手段として「聖霊によって」と訳す。
  alternative: 聖霊の領域内での聖別として「聖霊にあって」と訳す。
  rationale: ἐνには手段的用法と領域的用法の双方が可能であり、本文では自然な手段の読みを採り、別解を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、λειτουργός・ἱερουργέω・προσφοράが作る祭司的比喩を一貫して保った。「メシアであるイエス」は称号の意味を明示する。「聖なるものとされ」は神学的内容を保持しつつ、「聖別され」より一般読者に分かりやすい表現とした。
