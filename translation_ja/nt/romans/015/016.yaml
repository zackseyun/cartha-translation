revisions:
- from: それは、私が異邦人[a]のためにメシアであるイエスに仕える者となり、神の福音のために祭司の務めを果たす[b]ためです。こうして、異邦人というささげ物[c]が、聖霊によって[d]聖なるものとされ、受け入れられるものとなるのです。
  to: それは、私が異邦人[a]に対してメシアであるイエスに仕える奉仕者となり、神の福音を祭司として奉仕する[b]ためです。こうして、異邦人のささげ物[c]が、聖霊によって[d]聖なるものとされ、受け入れられるものとなるのです。
  rationale: 本文は、異邦人自身を供え物とする有力な解釈を脚注に示しつつ、原文の属格の曖昧さを「異邦人のささげ物」として保持した。「異邦人に対して」により宣教の対象を明確にし、「神の福音を祭司として奉仕する」により、奉仕者・祭司的奉仕・ささげ物という一連の祭儀的比喩を保った。
  reviewer_model: gpt-5.6-terra
