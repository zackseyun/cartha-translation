id: ROM.15.25
reference: Romans 15:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νυνὶ δὲ πορεύομαι εἰς Ἰερουσαλὴμ διακονῶν τοῖς ἁγίοις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/025.yaml
  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: ja
  text: しかし今、私は聖なる者たちに仕えるため、エルサレムへ向かっています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる者たちに奉仕しながら」とも訳せる。ここでの「仕える」は、エルサレムの信徒たちのための実際的な奉仕を指し、文脈上は彼らへの献金を届けることを含む（15:26参照）。
    reason: διακονῶνの分詞が目的または付帯状況を表し得ることと、文脈上の具体的内容を示すため。
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: しかし今
  rationale: νυνίの強調された現在時と、δέの穏やかな対比・転換を、自然な現代日本語で表す。
- source_word: πορεύομαι
  choice: 向かっています
  rationale: 目的地への移動または現在の旅の意向を示す現在形を自然に表し、「すでに道中にある」とまでは限定しない。
- source_word: εἰς Ἰερουσαλὴμ
  choice: エルサレムへ
  rationale: εἰςが示す目的地への方向を簡潔に表す。
- source_word: διακονῶν
  choice: 仕えるため
  rationale: 分詞が旅の目的または付帯状況を表し得る中で、直後の15:26から目的の含みが強い。「仕える」は実際的な奉仕を含む語義を保ち、援助金の運搬だけに本文を限定しない。
- source_word: τοῖς ἁγίοις
  choice: 聖なる者たちに
  rationale: パウロが信徒を指して用いる呼称の語形と神への帰属の含みを保つ。「聖徒」より一般読者に意味が伝わりやすく、「神の民」ほど解釈的でない。
theological_decisions:
- issue: 「聖なる者たち」の指示対象
  choice: 本文では「聖なる者たち」とし、エルサレムの信徒、とりわけ困窮者であることは文脈に委ねる
  alternative: 「エルサレムの信徒たち」または「神の民」と明示する
  rationale: 直後の15:26により対象はエルサレムの信徒たちと分かるが、本節自体の表現を説明的に言い換えず、パウロの呼称を保つ。
- issue: διακονῶνが示す関係
  choice: 目的を自然に示す「仕えるため」
  alternative: 付帯状況として「仕えながら」または具体化して「援助を届けるため」
  rationale: 文法上は付帯状況も可能だが、行き先と直後の献金記事から旅の目的として読むのが自然である。ただし奉仕の具体的内容は本文で援助金に限定せず、脚注で示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「聖なる者たち」は伝統的な「聖徒」より理解しやすく、原語の表現も保つ。脚注記号は該当する節全体の補足として文末に置いた。
