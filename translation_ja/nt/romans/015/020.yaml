id: ROM.15.20
reference: Romans 15:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: ja
  text: こうして私は、メシア[a]の名がすでに知られている所ではなく、福音を伝えることを志としています。これは、他人の土台の上に建てないためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」はギリシア語の称号「油を注がれた者」に当たる。「キリスト」とも訳せる。
    reason: Χριστόςの称号としての意味と、定着した別訳を示すため。
  - marker: b
    text: 直訳「他人の土台の上に建てないためです」。先に働いた人の宣教を「土台」にたとえる建築比喩。
    reason: ἀλλότριονの所有関係と原文の建築比喩を示すため。
lexical_decisions:
- source_word: οὕτως δὲ
  choice: こうして
  rationale: 直前までに述べられたパウロの宣教の進め方を受ける緩やかな接続として、簡潔で自然な日本語にした。
- source_word: φιλοτιμούμενον
  choice: 志してきました
  rationale: 熱心に目標とする、名誉ある務めとして励むという意志的な含みを、文脈に即した現代日本語で表した。
- source_word: εὐαγγελίζεσθαι
  choice: 福音を伝える
  rationale: 良い知らせを公に告げるという動詞の意味を保ちつつ、一般の読者にも理解しやすい定着した表現を用いた。
- source_word: οὐχ ὅπου ὠνομάσθη Χριστός
  choice: キリストの名がすでに告げられている所ではなく、まだ告げられていない所で
  rationale: 原文の否定的な場所表現を日本語として明確にし、「まだ告げられていない」は対照から補った。ただし単に「知られていない」とせず、ὠνομάσθη の「名を告げる」という像を残した。
- source_word: Χριστός
  choice: キリスト
  rationale: 日本語の聖書語彙として広く定着し、固有名に近い用法と称号の両方を不自然なく担える。称号としての意味は脚注で示した。
- source_word: ἵνα μὴ
  choice: それは、…ないためです
  rationale: 否定を伴う目的節であることを明瞭に示した。
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: ほかの人が据えた土台の上に
  rationale: ἀλλότριον は「他人に属する」を意味する。日本語では、先行する宣教者の働きを指す建築比喩が伝わるよう「ほかの人が据えた」とした。
- source_word: οἰκοδομῶ
  choice: 建てる
  rationale: 「土台」と対応する建築比喩をそのまま保持した。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: 本文は「キリスト」、脚注で「メシア」を示す
  alternative: 本文を「メシア」とする
  rationale: Χριστόςには「油を注がれた者」という称号性がある一方、この箇所の日本語では「キリストの名が告げられる」が自然で、パウロ書簡の通常の呼称とも調和する。称号としての意味を失わないよう脚注を付した。
- issue: パウロの宣教方針の射程
  choice: パウロ自身の志として訳す
  alternative: すべての宣教者に対する一般的禁止として表現する
  rationale: 一人称の意志を示す φιλοτιμούμενον に従い、未宣教地を目指すパウロ個人の方針として訳し、普遍的規則には拡張しなかった。
- issue: 「土台」の比喩
  choice: 先行する他者の働きを土台として建てるという比喩を保持する
  alternative: 他者の宣教地で働くこと、と説明的に置き換える
  rationale: 原文の建築比喩には使徒的働きの関係を考えさせる余地があるため、解釈を本文で固定せず保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、パウロの意志と建築比喩を保った。「志してきました」は dignified だが過度に文語的ではなく、継続してきた宣教方針として文脈に自然に読める。
