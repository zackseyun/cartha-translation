id: ROM.15.10
reference: Romans 15:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: ja
  text: また、こうも言っています。「異邦人よ[a]、神の民とともに喜べ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国の民よ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: また、こうも
  rationale: 別の聖書引用を重ねて提示する引用句の働きを、自然な現代日本語で表した。
- source_word: λέγει
  choice: 言っています
  rationale: 聖書が今も語っているものとして扱うギリシア語の現在時制を保持した。日本語では主語を補わず、原文で明示されていない主語を限定しない。
- source_word: Εὐφράνθητε
  choice: 喜べ
  rationale: 命令の力を簡潔に保ち、格調がありながら現代の読者にも明瞭な表現とした。
- source_word: ἔθνη
  choice: 異邦人
  rationale: ローマ15章の文脈では、イスラエル以外の民が神を賛美することが中心であるため。「諸国の民」という語義も脚注に残した。
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: 神の民とともに
  rationale: μετάの共同・同伴の意味を「とともに」で表した。αὐτοῦの指示対象は引用文脈上、神であり、日本語で不自然な「彼の民」を避けて明示した。
- source_word: λαοῦ
  choice: 民
  rationale: 契約共同体を指し得る語感を保つため「人々」ではなく「民」とした。原文にない「イスラエル」は本文に補わなかった。
theological_decisions:
- issue: パウロがユダヤ人と異邦人の一致を論じる箇所でのἔθνηの訳
  choice: 異邦人
  alternative: 諸国の民
  rationale: 直前から続く議論では、神の民とともに神を賛美する非ユダヤ人が焦点である。「異邦人」はその対比を明瞭にする一方、旧約引用としてのより広い語感は脚注に示した。
- issue: αὐτοῦの指示対象
  choice: 神の民
  alternative: その方の民／彼の民
  rationale: 引用における指示対象は神と理解するのが自然である。日本語の「彼の民」は不自然で、「その方の民」は本文外の敬称的ニュアンスを加えるため、「神の民」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用文には簡潔で dignified な命令形「喜べ」を採用した。「異邦人たちよ」より簡潔で聖書引用として自然な「異邦人よ」とした。
