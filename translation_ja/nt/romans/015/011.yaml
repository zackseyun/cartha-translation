source:
  edition: SBLGNT
  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: ja
  text: 'また、こうあります。


    「すべての国々[a]よ、主[b]をほめたたえよ。

    すべての民が、この方をほめたたえますように。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての異邦人」。ギリシャ語 ἔθνη は「国々」とも「異邦人」とも訳せる。ここでの引用は普遍的な意味を持つと同時に、異邦人についてのパウロの議論にも合致している。
    reason: lexical_alternative
  - marker: b
    text: 引用元のヘブライ語では、ここに神の名が用いられている。ギリシャ語本文では、それを κύριος（「主」）と表している。
    reason: source_text_note
lexical_decisions:
- source_word: καὶ πάλιν
  choice: また、こうあります
  rationale: 続けて別の聖書引用を導入する表現として、καὶ πάλιν の反復・追加の働きを自然な現代日本語で示した。
- source_word: Αἰνεῖτε
  choice: ほめたたえよ
  rationale: 二人称複数の命令を明確に表し、神に向けられた賛美として自然で品位ある表現を選んだ。
- source_word: πάντα τὰ ἔθνη
  choice: すべての国々
  rationale: ἔθνη の広い集合的意味を保ち、引用そのものが持つ普遍的な呼びかけを前面に出した。文脈上可能な「異邦人」は脚注に残した。
- source_word: τὸν κύριον
  choice: 主
  rationale: ギリシャ語 κύριος を新約本文として直接訳した。ヘブライ語引用元の神名を反映する読みについては脚注で説明した。
- source_word: ἐπαινεσάτωσαν
  choice: ほめたたえよ
  rationale: 三人称複数命令の勧奨的な力を、日本語では呼びかけの命令形によって自然に表した。
- source_word: αὐτόν
  choice: この方
  rationale: 直前の「主」を受ける代名詞的表現とし、不要な反復を避けながら指示対象を明確にした。
- source_word: πάντες οἱ λαοί
  choice: すべての民
  rationale: λαοί を「民」と訳し、先行する ἔθνη「国々」との語彙上の区別と並行法を保った。
theological_decisions:
- issue: パウロのユダヤ人・異邦人論の文脈における ἔθνη の訳
  choice: すべての国々
  alternative: すべての異邦人
  rationale: 引用句自体の普遍的な賛美への招きを保つため「国々」を本文に採用した。一方、ローマ15章の議論では「異邦人」の意味も重要なので脚注に残した。
- issue: 神名を指す旧約引用中の κύριος の訳
  choice: 主
  alternative: 主（引用元のヘブライ語では神名）
  rationale: SBLGNT の直接の語形 κύριος に即して「主」とした。ただし、引用元では神名が用いられ、ギリシャ語訳で κύριος と表されていることを脚注で明示した。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、聖書引用にふさわしい簡潔で品位ある調子と詩的な並行法を保った。「国々」と「民」を訳し分け、原文の語彙的対照を維持した。
