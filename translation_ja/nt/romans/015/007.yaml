  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: ja
  text: ですから、メシアがあなたがたを神の栄光のために迎え入れたように、あなたがたも互いに迎え入れなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の栄光のために」は、文脈上、「互いに迎え入れなさい」という勧め全体の目的・結果として理解することもできる。
    reason: 係り受けの曖昧さ
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す接続語として、論理的つながりを自然な現代日本語で表す。
- source_word: προσλαμβάνεσθε
  choice: 迎え入れなさい
  rationale: 共同体の中で互いを受け入れる積極的で関係的な行為を表す。単なる容認より温かみがあり、同じ動詞のアオリスト形との対応も保てる。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 相互性を簡潔かつ自然に表す。
- source_word: καθὼς καὶ
  choice: …が…ように、…も
  rationale: 比較を示す καθὼς と付加を示す καί の両方を、日本語として自然な対応構文で表す。
- source_word: ὁ Χριστὸς
  choice: メシア
  rationale: 定冠詞を伴い称号として用いられているため、油注がれた者という称号性を明確にする。
- source_word: προσελάβετο
  choice: 迎え入れてくださった
  rationale: 命令形と同じ訳語を用いてパウロの動詞上の対応を保つ。キリストの恵み深い行為を自然な敬意表現で述べる。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 二人称複数の直接目的語を明示する。
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: 神の栄光のために
  rationale: εἰς が示しうる目的・結果の幅を保ちつつ、現代日本語で自然に表現する。修飾範囲には統語上の曖昧さがあるため注記する。
theological_decisions:
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての性格が明瞭であり、その意味を読者に伝えるため「メシア」とした。キリスト論上の内容を変更するものではない。
- issue: προσλαμβάνομαι の共同体的含意
  choice: 迎え入れる
  alternative: 受け入れる／引き受ける
  rationale: ローマ14―15章の文脈における信徒相互の積極的な受容を表しつつ、特定の教派的理解を持ち込まない。
- issue: εἰς δόξαν τοῦ θεοῦ の修飾範囲
  choice: 節全体に関わりうる位置に置く
  alternative: メシアが迎え入れたことだけに結びつける
  rationale: ギリシア語では末尾の句が直近の動詞に結びつく可能性と、勧告全体の目的・結果を示す可能性がある。本文では広い係り受けが自然な語順を採り、別解を脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ですから」で前段との推論関係を示し、「迎え入れる」の反復によって原文の動詞上の並行を保持した。脚注記号は句点の後に置いた。
