  to: それは、あなたがたが心を一つにして、一つの口で[a]、私たちの主イエス・メシア[b]の神であり父である方をほめたたえるためです。
  rationale: 副詞ὁμοθυμαδόνの係り方を自然な日本語で示すため「心を一つにして」とし、「神また父である方」を「神であり父である方」に改めました。これにより原文の意味を変えず、現代標準日本語としての明瞭さと自然さを高めています。脚注アンカーと内容は原文および英語監査記録に適合しているため維持しました。
