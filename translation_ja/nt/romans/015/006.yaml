id: ROM.15.6
reference: Romans 15:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: ja
  text: それは、あなたがたが心を一つにして、一つの口で[a]、私たちの主イエス・メシア[b]の神であり父である方をほめたたえるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より自然な言い方では「声を合わせて」。ギリシア語は直訳すると「一つの口で」であり、一致した賛美を強調しています。
    reason: lexical_alternative
  - marker: b
    text: 伝統的な訳では「イエス・キリスト」。ギリシア語のΧριστός（クリストス）は「メシア」という称号です。
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: それは……ためです
  rationale: 前節の願い・勧めから続く目的を明確に示し、ギリシア語の目的を表す働きを自然な日本語で保つ。
- source_word: ὁμοθυμαδόν
  choice: 心を一つにし
  rationale: 共通の思いと志をもって一致する共同体的な意味を表す。続く「一つの口で」と区別し、内面的な一致と共同の賛美の両方を伝える。
- source_word: ἐν ἑνὶ στόματι
  choice: 一つの口で
  rationale: 「声を合わせて」よりやや直訳的だが、原文の身体的な比喩を保ち、一致した賛美を鮮明に表す。自然な慣用表現は脚注に示す。
- source_word: δοξάζητε
  choice: ほめたたえる
  rationale: 神の栄光を認め、賛美するという文脈上の意味を、現代の一般読者にも分かりやすく表す。「栄光を帰する」より自然である。
- source_word: τὸν θεὸν καὶ πατέρα
  choice: 神また父である方
  rationale: 一つの冠詞のもとに置かれた「神」と「父」が同じ方を指すことを、日本語で過度に説明せず明確にする。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主……の
  rationale: 属格関係と共同体的な「私たちの」をそのまま保ち、κύριοςを標準的に「主」と訳す。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Ἰησοῦを固有名「イエス」、Χριστοῦを称号「メシア」として訳す。日本語では中黒によって名前と称号の結び付きを自然に示す。
theological_decisions:
- issue: τὸν θεὸν καὶ πατέραが指す関係
  choice: 「私たちの主イエス・メシアの神また父である方」
  alternative: 「神、すなわち私たちの主イエス・メシアの父」
  rationale: 原文では「神」と「父」の双方が属格句「私たちの主イエス・メシアの」に結び付くのが自然であるため、その構造を保持する。神学的な言い換えによって一方の関係を弱めない。
- issue: Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでもΧριστόςはイエスに付された称号として理解できるため、その意味を訳して「メシア」とする。伝統的な音写は脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、礼拝的な品位を保った。「一つの口で」は意図的に原文の比喩を残し、やや不慣れな表現を脚注で補った。「神また父である方」は同一指示を明確にしつつ、説明的になりすぎない表現である。
