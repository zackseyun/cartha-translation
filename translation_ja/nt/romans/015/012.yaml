    諸国の民はこの方に望みを置く。」'
  to: 'また、イザヤはこう言っています。


    「エッサイの根が現れ、

    諸国の民を治めるために立ち上がる方も現れる。

    諸国の民はその方に望みを置く。」'
  rationale: 原文にない「来る」を削除し、ἔσταιの将来的な叙述を「現れる」で保った。καίに対応する「も」により二つの表現を並置しつつ、それらが厳密に同格であるかを説明的に固定しない。「その方」は後続のαὐτῷを自然に受ける。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:00Z'
review_pass:
  verdict: revise
  source_fidelity: 「来る」は原文にない動詞を加えており、ἔσται（「ある／現れるであろう」）の将来的な叙述を、後半について別の出来事として具体化している。原文のκαίによる並置と、両表現の関係の余地を保つため、両方に「現れる」を用いるのが安全である。ἐπ’ αὐτῷは「その方に」として希望の対象を適切に示せる。
  naturalness: 全体として明瞭で自然な現代標準日本語である。後半の「方が来る」を「方も現れる」に改めることで、引用文の並列構造も読み取りやすくなる。
  terminology: 「エッサイ」「諸国の民」「望みを置く」はいずれも許容され、教派的に限定された表現ではない。「立ち上がる方」はἀνιστάμενοςの語義の幅を保っており、「復活」と明示しない判断も適切である。
  issues:
  - severity: medium
    issue: 後半に「来る」が加えられている。
    rationale: ὁ ἀνιστάμενοςには「来る」に当たる語がなく、ἔσταιは引用全体の将来の存在・出現を述べる。『来る』は原文にない移動・到来の含意を加えるため、より中立的な『現れる』へ改める。
  - severity: low
    issue: 将来性が後半では明示されていない。
    rationale: 原文のἔσταιの将来性を、並列された二つの表現の双方に日本語として自然に反映するため、『も現れる』とする。これは両者の同一性を訳文で断定しない。
