source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: ja
  text: 'また、イザヤはこう言っています。


    「エッサイの根が現れ、

    諸国の民を治めるために立ち上がる方も現れる。

    諸国の民はその方に望みを置く。」'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: エッサイの根
  rationale: イザヤ書11章の比喩を保ち、メシア的な系譜の含意を訳文で説明しすぎないため。
- source_word: ὁ ἀνιστάμενος
  choice: 立ち上がる方
  rationale: 現在分詞の動的な表現を保つ。「復活する方」とも読める語だが、ここでは目的を表す不定詞「治めるために」と結びつく文脈上、まず『立ち上がる』とした。
- source_word: ἄρχειν ἐθνῶν
  choice: 諸国の民を治めるために
  rationale: ἄρχειν の支配・統治の意味と、目的を示す不定詞の働きを自然な日本語で表した。ἐθνῶν は同じ節内でイスラエル以外の民々を指すが、『異邦人』より原語の民族的広がりが伝わる『諸国の民』を採用した。
- source_word: ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν
  choice: 諸国の民はこの方に望みを置く
  rationale: ἐπί＋与格が示す、信頼・希望の向かう対象を『この方に』で明示し、ἐλπιοῦσιν を自然な日本語の『望みを置く』とした。
- source_word: Ἔσται
  choice: 現れ
  rationale: 直訳の『あるだろう』は日本語では不自然であるため、将来に存在が明らかになることを表す『現れる』を採用した。後続の並列を自然にするため連用形とした。
theological_decisions:
- issue: ὁ ἀνιστάμενος に復活の含意を明示するか
  choice: 立ち上がる方
  alternative: 復活して立つ方
  rationale: 語自体には起き上がる・立ち上がるという幅があり、ローマ書の文脈から復活を連想しうるが、この引用文だけでその含意を訳文に固定せず、原文の曖昧さを保った。
- issue: Ἔσται と καί の関係
  choice: 『エッサイの根が現れ、諸国の民を治めるために立ち上がる方が来る』と並列的に表現
  alternative: 『エッサイの根、すなわち諸国の民を治めるために立ち上がる方が現れる』
  rationale: ギリシア語には καί があり、二つの表現の同格関係を明示していない。両者が同一人物を指すとの理解は自然だが、『すなわち』を補わず、原文の構造と緊張を残した。
translation_notes:
  register: 現代標準日本語による、明瞭で格調を保った引用文。旧約引用らしい詩的な改行を用いた。『エッサイ』『諸国の民』『望みを置く』は一般読者にも理解可能で、教派固有の用語を避けている。
