  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: ja
  text: しかし今は、これらの地域にはもはや働く余地がなく[a]、また、何年も前からあなたがたのところへ行きたいと切望してきたので、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「場所がなく」。ここでは、単に物理的な場所がないというより、これらの地域に宣教の働きを広げる余地がもう残っていないことを指すとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: しかし今は
  rationale: 現在の状況への転換を示すνυνίと、文脈上の対照を表すδέを、自然な現代日本語で示した。
- source_word: μηκέτι τόπον ἔχων
  choice: もはや働く余地がなく
  rationale: μηκέτιの時間的な否定を「もはや」で表し、τόπον ἔχωνは宣教の働きを広げる余地が残っていないという文脈上の意味を簡潔に示した。「働く」は明示的な補足であるため、直訳の可能性は脚注に残した。
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: この地方には
  rationale: κλίμασιが指す複数の地域・一帯を、日本語として自然な集合表現「この地方」で表した。
- source_word: ἐπιποθίαν δὲ ἔχων
  choice: しかも……行きたいと切望してきた
  rationale: ἐπιποθίαの強い願望を「切望」で表し、δέは前節との併置を自然につなぐ「しかも」とした。継続していた願いは「してきた」で示した。
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: あなたがたのところへ行きたい
  rationale: 不定詞が示す願望の内容を自然な日本語で表し、「訪問する」のような原文に明示されない意味は加えなかった。
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: 何年も前から
  rationale: 過去の時点から現在まで続く期間を示す表現として、現代日本語で明瞭な「何年も前から」を用いた。
