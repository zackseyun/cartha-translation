source:
  edition: SBLGNT
  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: ja
  text: というのも、私は、異邦人[a]が従順に至るために、メシアが私を通して言葉と行いによって成し遂げたこと以外については、あえて語ろうとはしないからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」または「諸民族」。
    reason: lexical_alternative
  - marker: b
    text: 原文は直訳すると、「メシアが私を通して成し遂げなかった事柄について、私はあえて何かを語ろうとはしない」となる。否定を重ねた表現により、メシアが成し遂げたことだけを語る、という意味を表している。
    reason: translation_clarity
lexical_decisions:
- source_word: οὐ γὰρ τολμήσω
  choice: あえて……語ろうとはしません
  rationale: τολμάωの「大胆にも～する／あえて～する」という意味と未来形によるパウロの意志的な自制を、自然な現代日本語で表した。γάρは前後の論旨を受ける接続語だが、単独節として不自然になるため明示せず、文脈上の説明機能に委ねた。
- source_word: τι λαλεῖν ὧν οὐ κατειργάσατο
  choice: 成し遂げたこと以外は、あえて何も語ろうとはしません
  rationale: 直訳的な「キリストが成し遂げなかったことを何か語る」は日本語では誤解を招くため、この否定関係が表す限定、すなわちキリストが成し遂げたことだけを語るという意味を明確にした。
- source_word: Χριστὸς
  choice: キリスト
  rationale: 日本語聖書・一般的キリスト教用語で定着した表記であり、この箇所でも称号性を失わず自然に読める。
- source_word: δι’ ἐμοῦ
  choice: 私を通して
  rationale: 属格を伴うδιάの媒介・手段を保ち、働きの主体がキリストで、パウロはその媒介者であることを示す。
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: 異邦人の従順をもたらすために
  rationale: εἰςの目的・結果の幅を「もたらすために」で自然に表しつつ、ὑπακοήを「従順」として保持した。ローマ書の文脈ではἔθνηはユダヤ人以外の人々を指す可能性が高いため「異邦人」とした。
- source_word: λόγῳ καὶ ἔργῳ
  choice: 言葉と行いによって
  rationale: 二つの与格を手段と理解し、宣教の言葉と実際の行為の両方を通してキリストが働いたという構造を保った。
theological_decisions:
- issue: Χριστόςの訳語
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςには称号として「メシア」の意味があるが、日本語では「キリスト」も称号として定着しており、この文脈で人名化を強く示す要素はない。本文の自然さと標準的な理解可能性を優先した。
- issue: ἐθνῶνの指示対象
  choice: 異邦人
  alternative: 諸国民／諸民族
  rationale: ローマ書におけるユダヤ人と非ユダヤ人の対比、およびパウロの宣教文脈から「異邦人」が最も明確である。ただし語そのものには「諸国民」の意味もあるため脚注に残した。
- issue: 従順の主体と目的
  choice: 異邦人の従順をもたらすために
  alternative: 異邦人を従わせるために
  rationale: 属格ἐθνῶνを「異邦人が示す従順」と理解し、強制的に服従させるという不要な含意を避けた。何への従順かは本文が明示しないため補わなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あえて……語ろうとはしません」でパウロの慎みと意志を表し、「私を通して」によってキリストの主体性を保持した。文末の読点は節が次節へ続く原文に由来するが、単独節として提示されているため句点とした。
