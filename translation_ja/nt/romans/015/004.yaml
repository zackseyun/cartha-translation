id: ROM.15.4
reference: Romans 15:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: ja
  text: というのも、以前に書かれたものはすべて、私たちを教えるために書かれたからです。それは、私たちが忍耐によって、また聖書による励まし[a]によって、希望を持つためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「慰め」または「勧め」とも訳せる。
    reason: παράκλησιςには、励まし、慰め、勧告・勧めという意味の幅があるため。
lexical_decisions:
- source_word: ὅσα
  choice: ものはすべて
  rationale: 中性複数の関係代名詞が表す包括的な範囲を、自然な現代日本語で示す。
- source_word: προεγράφη
  choice: 以前に書かれた
  rationale: προ-の時間的意味を保ち、過去に記された聖書を指すことを明確にする。
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: 私たちを教えるために
  rationale: εἰςの目的的な働きと、διδασκαλίαの教育・訓練という意味を、平明な日本語で表す。
- source_word: ἐγράφη
  choice: 書かれた
  rationale: 前の動詞と同じ「書かれた」を繰り返し、原文の修辞的強調を保つ。
- source_word: ἵνα
  choice: それは、…ためです
  rationale: 目的を示す接続を日本語として明瞭に表す。
- source_word: διὰ τῆς ὑπομονῆς
  choice: 忍耐によって
  rationale: 困難の下で持ちこたえるὑπομονήの意味を、聖書文体として自然で理解しやすい語で表す。
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: 聖書による励ましによって
  rationale: παράκλησιςの中心的な意味を「励まし」とし、属格の関係を過度に限定せず「聖書による」と訳す。
- source_word: τῶν γραφῶν
  choice: 聖書
  rationale: パウロ書簡で聖なる文書を指す通常の用法に即し、現代日本語で定着した呼称を用いる。
- source_word: τὴν ἐλπίδα ἔχωμεν
  choice: 希望を持つ
  rationale: 定冠詞を日本語で不自然に明示せず、ἵναに続く現在接続法の目的を簡潔に表す。
- source_word: γὰρ
  choice: というのも、…からです
  rationale: 前節の内容に理由・根拠を加える論理関係を明示する。
theological_decisions:
- issue: 聖書と忍耐・励まし・希望との関係
  choice: 「忍耐」と「聖書による励まし」を、希望を持つための二つの経路として並べる。
  alternative: 忍耐も励ましも、ともに聖書が与えるものだと明示する。
  rationale: 原文では「聖書の」という属格は直近の「励まし」に付く一方、文脈上は忍耐にも聖書が関わると理解し得る。訳文では原文の語順上の結び付きを保ち、その神学的関係を一義的に決めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。γὰρを前文とのつながりが分かる形で訳し、「書かれた」の反復を保持した。英語で必要となる may/might の区別は日本語には対応しないため、脚注化していない。
source_grounding:
  english_pob_role: consult_only
