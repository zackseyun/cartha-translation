  text: ⸀τολμηρότερον δὲ ἔγραψα ⸀ὑμῖν ἀπὸ μέρους, ὡς ἐπαναμιμνῄσκων ὑμᾶς, διὰ τὴν χάριν τὴν δοθεῖσάν μοι ⸀ὑπὸ τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/015.yaml
  text: But I have written to you rather boldly in part, as reminding you again, because of the grace given to me by God,
translation:
  language: ja
  text: しかし私は、いくつかの点について、あなたがたにより大胆に書きました[a]。それは、あなたがたに改めて思い起こさせるためであり、神から私に与えられた恵みによるのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし私は、部分的にはあなたがたにより大胆に書きました」。原文の句は、「部分的に」とも、「いくつかの点について」とも理解できます。
    reason: lexical_alternative
  - marker: b
    text: この文脈で「神から私に与えられた恵み」は、一般的な神の恵みを指すにとどまらず、パウロに与えられた奉仕の務めや使命にも関わっています。
    reason: cross_reference
lexical_decisions:
- source_word: τολμηρότερον
  choice: かなり大胆に
  rationale: 比較級の強意的用法を自然な日本語で表しつつ、大胆さの程度を保持する。文脈によっては「より大胆に」とも取れるため脚注で示した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の称賛を受けた穏やかな対照と話の転換を表す。
- source_word: ἔγραψα
  choice: 書きました
  rationale: 手紙の執筆行為を指す書簡的アオリストとして、自然な日本語の過去形にした。
- source_word: ἀπὸ μέρους
  choice: いくつかの点について
  rationale: 「部分的に」と「ある事柄について」の両義性があるが、ここでは書いた内容の範囲を示す自然な表現を採用し、別解を脚注に残した。
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: あなたがたに改めて思い起こしてもらうため
  rationale: 接頭辞の反復・再提示の含みを「改めて」で表し、分詞の目的的ニュアンスを自然な日本語にした。
- source_word: διὰ τὴν χάριν
  choice: 恵みのゆえに
  rationale: διά＋対格の理由・根拠を示し、パウロ書簡での χάρις の広がりを狭めず「恵み」と訳した。
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: 神から私に与えられた
  rationale: 受動表現の行為者が神であることを明確かつ自然に示す。
theological_decisions:
- issue: この文脈における χάρις の意味
  choice: 本文では広い語「恵み」を保持し、脚注で使徒的奉仕の委任・賜物という文脈的含意を示す
  alternative: 「務め」「使命」と具体化する、または一般的な神の好意だけを指すとする
  rationale: 15–16節では異邦人への奉仕と結びつくが、原語自体は χάρις であり、本文で「使命」などに限定すると意味を狭めすぎるため。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、書簡にふさわしい品位を保った。「改めて思い起こしてもらう」は ἐπαναμιμνῄσκω の再想起の含みを明示する。
