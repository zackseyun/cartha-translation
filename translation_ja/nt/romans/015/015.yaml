- from: しかし、私はいくつかの点について、あなたがたにかなり大胆に書きました[a]。それは、神から私に与えられた恵みのゆえに[b]、あなたがたに改めて思い起こしてもらうためです。
  to: しかし私は、いくつかの点について、あなたがたにより大胆に書きました[a]。それは、あなたがたに改めて思い起こさせるためであり、神から私に与えられた恵みによるのです[b]。
  rationale: 使役動詞「思い起こさせる」により、原文の分詞が示すパウロの働きを保ちました。「より大胆に」で比較級を明示しつつ、比較対象は補っていません。文の因果関係を自然な日本語に整え、脚注aは ἀπὸ μέρους の範囲に関する解釈上の幅を、脚注bは χάρις の文脈的な奉仕の含意を、いずれも本文を過度に限定せずに示しています。
