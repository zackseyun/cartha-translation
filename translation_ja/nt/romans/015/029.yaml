  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: ja
  text: 私は、あなたがたのもとに行く際には、メシア[a]の祝福に満ちあふれて行くことを知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」と訳すこともできる。Χριστόςは「油を注がれた者」を意味する称号で、「メシア」に対応する。「キリスト」はその伝統的な訳語である。
    reason: Χριστόςの伝統的な訳語を示しつつ、本文の「メシア」が称号の意味を表すことを説明する。
lexical_decisions:
- source_word: οἶδα
  choice: 知っています
  rationale: パウロの確信を弱めず、現代日本語で自然に知識・確信を表す。
- source_word: δὲ
  choice: （訳出せず）
  rationale: ここでは談話を穏やかに進める接続詞であり、日本語では明示しないほうが自然である。
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: あなたがたのもとに行くときには
  rationale: 未来形の主動詞に対する分詞の時間的関係を明確にし、πρόςの方向性も「もとに」で表した。
- source_word: ἐν πληρώματι εὐλογίας
  choice: 祝福に満ちて
  rationale: 直訳調の「祝福の満ち満ちた中で」を避けつつ、πλήρωμαが表す充満・豊かさを自然な日本語で保持する。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは称号として機能するΧριστόςの意味を表す。日本語で広く定着した「キリスト」は脚注に示した。
- source_word: ἐλεύσομαι
  choice: 行く
  rationale: 話者であるパウロから読者のいる場所への移動として、日本語では「行く」が自然である。前の時間節との反復も原文に対応する。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: 称号としての意味を本文で明示しつつ、教会用語として定着した音写的表現も正当な代案として脚注に残す。
- issue: 「祝福」とΧριστοῦの関係
  choice: メシアの祝福
  alternative: メシアから来る祝福／メシアに属する祝福
  rationale: 属格が示し得る源泉・所属・性格を一つに限定せず、日本語の属格「の」によって原文の幅を保つ。
translation_notes:
  register: 明瞭で現代的な敬体を用いた。「祝福に満ちて」は原文の充満の比喩を保ちながら、過度に直訳的な日本語を避ける表現である。
