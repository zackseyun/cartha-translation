id: ROM.15.8
reference: Romans 15:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: ja
  text: というのも、私はこう言います。メシアは、神の真理[a]のために、父祖たちに与えられた約束を確かなものとするため、割礼を受けた者たちに仕える者となられたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神の真実さ」。神が契約の約束を忠実に守られることが強調されます。
    reason: ἀλήθεια θεοῦは「神の真理」とも「神の真実さ」とも訳し得るため。
lexical_decisions:
- source_word: λέγω γὰρ
  choice: というのも、私は言います
  rationale: γάρの説明的なつながりを「というのも」で示し、λέγωをパウロの論述にふさわしい「私は言います」とした。
- source_word: Χριστόν
  choice: メシア
  rationale: イスラエル、割礼、父祖への約束という救済史的文脈で称号として機能しているため、「キリスト」ではなく意味を示す「メシア」とした。
- source_word: διάκονον γεγενῆσθαι
  choice: 仕える者となられた
  rationale: διάκονοςの奉仕する役割と、γίνομαιの完了不定詞が示す結果的状態を自然な日本語で表した。教会職制上の「執事」という限定は避けた。
- source_word: περιτομῆς
  choice: 割礼を受けた者たちに
  rationale: 属格はここで割礼の民、すなわちユダヤ人を指す。「割礼の」と直訳せず、奉仕の対象として明瞭な日本語にした。
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: 神の真理のために
  rationale: ὑπέρの目的・利益の意味を「ために」で表し、ἀλήθειαが「真理」と「真実さ」の双方を含み得る曖昧さは本文と脚注で保持した。
- source_word: εἰς τὸ βεβαιῶσαι
  choice: 確かなものとするため
  rationale: 目的を表す構文を明示し、βεβαιόωの「堅固にする、確証する」という意味を平明な日本語で表した。
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: 父祖たちに与えられた約束
  rationale: 属格を、父祖たちに対してなされた約束という文脈上の関係として自然に表現した。「父祖」はイスラエルの族長的先祖を指す救済史的な語感を保つ。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名に近い用法よりも、イスラエルに約束された者という称号的意味が前面に出ている。
- issue: ἀλήθεια θεοῦの含意
  choice: 神の真理
  alternative: 神の真実さ
  rationale: 語句は神の真理一般とも、約束を守る神の真実さ・誠実さとも理解できる。本文では広い表現を採り、強い契約的含意を脚注に残した。
- issue: τῶν πατέρωνの関係
  choice: 父祖たちに与えられた約束
  alternative: 父祖たちの約束
  rationale: 約束の受領者を父祖たちと理解する文脈的関係を日本語で明確にしたが、「父祖」という救済史上の指示対象は保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、聖書本文としての品位を保った。「仕える者」は制度上の役職を想起させる語を避け、「父祖」は単なる一般的な先祖よりもイスラエルの救済史的背景を伝える語として採用した。
