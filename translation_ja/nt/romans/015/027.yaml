  to: 彼らは喜んでそうしたのです[a]。実際、彼らはその人々に負い目があるのです。異邦人[b]が彼らの霊的なもの[c]にあずかったのなら、異邦人も物質的なもの[d]によって彼らに仕える義務があるからです。
