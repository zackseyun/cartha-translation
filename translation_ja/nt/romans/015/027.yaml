id: ROM.15.27
reference: Romans 15:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: ja
  text: 彼らは喜んでそうしたのです[a]。実際、彼らはその人々に負い目があるのです。異邦人[b]が彼らの霊的なもの[c]にあずかったのなら、異邦人も物質的なもの[d]によって彼らに仕える義務があるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼らはよいと思った」。ここでは、直前に述べられた献金を喜んで行ったことを指す。
    reason: implicit_object
  - marker: b
    text: 別訳「諸国の民」。ここでは非ユダヤ人を指す。
    reason: lexical_alternative
  - marker: c
    text: 「霊的な祝福」とも訳せる。ギリシア語は直訳すると「彼らの霊的なもの」。
    reason: lexical_alternative
  - marker: d
    text: 直訳すると「肉的なもの」。ここでは霊的なものとの対照で、金銭を含む物質面・生活面の支援を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: 喜んでそうした
  rationale: 自発的な賛同や喜びを表す語であり、直前に述べられた献金を行ったことを文脈から補って、自然な日本語にした。
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: 彼らには恩義があります
  rationale: 単なる金銭上の負債ではなく、受けた霊的な恵みに基づく道義的な義務を表す。「恩義」はその関係を簡潔に伝える。
- source_word: τὰ ἔθνη
  choice: 異邦人
  rationale: ここではユダヤ人信者との対比で、非ユダヤ人を指すパウロ書簡の用法である。
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: 彼らの霊的なもの
  rationale: 名詞化された形容詞をできるだけそのまま訳し、原文に明示されていない「祝福」などの名詞を本文には補わなかった。
- source_word: ἐκοινώνησαν
  choice: あずかった
  rationale: 共有や参与を表す。霊的な益を受けたという文脈に合い、現代日本語としても自然である。
- source_word: ἐν τοῖς σαρκικοῖς
  choice: 物質的なものをもって
  rationale: ここでの σαρκικός は罪深さではなく、霊的なものと対照される身体的・物質的な領域を指す。直前の献金という文脈に即して訳した。
- source_word: λειτουργῆσαι
  choice: 仕える
  rationale: 奉仕する、務めを果たすという意味を保ちつつ、聖職者だけの働きと誤解されにくい一般的で品位ある表現とした。
- source_word: ὀφείλουσιν
  choice: 義務がある
  rationale: 霊的なものにあずかったことから生じる責任・負い目を明確に表す。
theological_decisions:
- issue: σαρκικοῖς と πνευματικοῖς の対照
  choice: 「物質的なもの」と「霊的なもの」
  alternative: 「肉的なもの」と「霊的なもの」
  rationale: 直前の文脈はエルサレムの聖徒への献金であるため、σαρκικοῖς は罪深い性質ではなく、生活を支える物質的・身体的なものを指す。
- issue: αὐτῶν / αὐτοῖς の指示対象
  choice: 直前の文脈にあるエルサレムの聖徒たち
  alternative: イスラエルまたはユダヤ人全般
  rationale: 救済史的な背景にはユダヤ人から異邦人へ及んだ霊的な益があるが、文法上の代名詞が直接指すのは、15章25–26節で献金の受取人とされたエルサレムの聖徒たちと読むのが自然である。
- issue: 異邦人の奉仕が義務とされる性質
  choice: 受けた霊的なものに対応する道義的な恩義
  alternative: 対価としての法的または金銭的債務
  rationale: ὀφειλέται と ὀφείλουσιν は強い義務を示すが、献金を霊的な益への購入代金とするのではなく、参与から生じた応答責任として表現した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロが示す自発的な喜びと道義的な義務との緊張を保った。「恩義」と「義務がある」を併用し、ὀφειλέται と ὀφείλουσιν の反復も意味上反映した。
