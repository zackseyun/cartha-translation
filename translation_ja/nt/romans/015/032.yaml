id: ROM.15.32
reference: Romans 15:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ἐν χαρᾷ ⸀ἐλθὼν πρὸς ὑμᾶς διὰ θελήματος ⸀θεοῦ συναναπαύσωμαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: ja
  text: それは、神のみこころによって、私が喜びをもってあなたがたのもとに行き、あなたがたと共に安らぎを得るためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたと互いに元気づけられる」または「あなたがたと共に憩う」。ギリシア語の動詞は、共に休息や力づけを得ることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: それは〜ためです
  rationale: 前節から続く目的節であることを、自然な現代日本語で明確に示す。
- source_word: ἐν χαρᾷ
  choice: 喜びをもって
  rationale: 喜びを伴う来訪という様態を示し、名詞「喜び」も保持する。
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: 私が…あなたがたのもとに行き
  rationale: 主動詞に従属するアオリスト分詞を、日本語では目的節内の自然な連用表現にした。
- source_word: διὰ θελήματος θεοῦ
  choice: 神のみこころによって
  rationale: διά＋属格が表す、神の意志を介し、それに基づいて実現するという意味を保つ。「みこころ」は聖書本文にふさわしく、現代でも理解可能である。
- source_word: συναναπαύσωμαι
  choice: あなたがたと共に安らぎを得る
  rationale: συν-が示す共有性と、ἀναπαύομαιの休息・安らぎの意味を自然な日本語で表す。相互性の含意は脚注で補う。
theological_decisions:
- issue: パウロとローマの信徒たちが共有する休息・慰めの相互性
  choice: あなたがたと共に安らぎを得る
  alternative: あなたがたと互いに元気づけられる／あなたがたと共に憩う
  rationale: パウロが一方的に仕えるだけでなく、彼らとの交わりの中で自らも共に休息や力づけを受けるという συναναπαύομαι の含みを保ちつつ、特定の神学的解釈に限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準語。「みこころ」は広く定着した聖書語として用いた。「安らぎを得る」により共有される休息を表し、語の相互的な含意は脚注で明示した。
