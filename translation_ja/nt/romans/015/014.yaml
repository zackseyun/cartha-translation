id: ROM.15.14
reference: Romans 15:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: ja
  text: さて、兄弟たち[a]、私自身、あなたがたについて確信しています。あなたがた自身も、善良さに満ち、あらゆる知識で満たされ、互いに諭し合う[b]ことができるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」に当たるギリシア語アデルフォイは、男性だけでなく女性も含め、信徒仲間全体への呼びかけとして用いられることがあります。
    reason: lexical_alternative
  - marker: b
    text: または「互いに教え合う」、あるいは「互いに戒め合う」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: 確信しています
  rationale: 完了形が表す、説得された結果として現在も続く確かな確信を、自然な現代日本語で表した。
- source_word: δέ
  choice: さて
  rationale: 強い逆接ではなく、前段からの穏やかな話題の移行を示すため。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: 呼びかけの親密さと原語の男性複数形を保った。ここでは女性を含む信徒共同体への呼称であることを脚注で明示する。
- source_word: καὶ αὐτὸς ἐγὼ
  choice: 私自身も
  rationale: パウロ本人の確信を強調する表現として、καίの付加的な響きとαὐτόςの強意を簡潔に表した。
- source_word: περὶ ὑμῶν
  choice: あなたがたについて
  rationale: περί＋属格の意味を明瞭かつ自然に訳した。
- source_word: καὶ αὐτοὶ
  choice: あなたがた自身も
  rationale: καίの「も」とαὐτοίの強調をともに保った。
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: 善意に満ち
  rationale: ἀγαθωσύνηが表す道徳的な善良さを「善意」とし、μεστός＋属格を「満ち」で表した。「善良さ」も可能だが、人物が善良さそのものに満ちるという硬さを避けた。
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: あらゆる知識に満たされていて
  rationale: 完了分詞が示す現在の充足状態と、πάσηςの広い範囲を保った。
- source_word: δυνάμενοι
  choice: ことができる
  rationale: 先に述べた資質に基づく能力を直接的で自然な日本語にした。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 共同体内の相互的な行為を簡潔に表す。
- source_word: νουθετεῖν
  choice: 諭し合う
  rationale: 単なる知識伝達ではなく、相手の思いや行動に働きかける教えや戒めを含む語義を保った。より強い「戒める」などの可能性は脚注に示す。
theological_decisions:
- issue: 混合された信徒共同体に対するἀδελφοίという呼称
  choice: 私の兄弟たち
  alternative: 兄弟姉妹の皆さん
  rationale: 原語の形を本文に残しつつ、当時の用法では女性を含む共同体全体を指し得ることを脚注で説明し、対象範囲を男性だけに限定しない。
- issue: νουθετεῖνの教導的・矯正的な含意
  choice: 互いに諭し合う
  alternative: 互いに教え合う／互いに戒め合う
  rationale: 称賛の文脈に合う建設的な響きと、必要な矯正を伴う語義の両方を「諭す」で表した。語の幅を狭めないよう代案を脚注に示す。
translation_notes:
  register: 明瞭で現代的ながら、使徒の温かな確信と共同体への敬意が伝わる品位ある文体とした。「あなたがた」を用いて複数の宛先を明示し、原文の反復的な強調も不自然にならない範囲で保持した。
