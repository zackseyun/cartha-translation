  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: ja
  text: ですから私は、メシアであるイエスにあって[b]、神に関する事柄について[c]誇る理由があります[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「誇りがあります」または「誇るところがあります」。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語では「キリスト・イエスにあって」。ここでは Χριστός が称号として用いられているため、「メシアであるイエス」と訳した。
    reason: alternative_reading
  - marker: c
    text: 別訳「神にかかわる事柄について」または「神に関する務めについて」。後者は文脈をより限定して表す訳。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: あります
  rationale: 現在形一人称の「持っている」という意味を、目的語の「誇る理由」と自然につながる現代日本語で表した。
- source_word: οὖν
  choice: ですから
  rationale: 直前までの議論から導かれる結論・帰結を、明瞭で自然な接続表現として示した。
- source_word: τὴν καύχησιν
  choice: 誇る理由
  rationale: καύχησις は「誇り／誇ること」と「誇る根拠」の両義を帯びうる。ここでは ἔχω との結びつきを自然に表すため「誇る理由」としたが、単なる自己賛美に狭めないよう代案を脚注に残した。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: メシアであるイエスにあって
  rationale: ἐν の領域・結合の含みを「にあって」で保ち、Χριστός が称号として機能していることを「メシアである」と明示した。
- source_word: τὰ πρὸς τὸν θεόν
  choice: 神に関する事柄について
  rationale: 神に向けられた事柄、神との関係に属する事柄を広く指す表現であり、祭儀や奉仕だけに限定せず訳した。
- source_word: θεόν
  choice: 神
  rationale: この文脈における θεός の標準的な訳語。
theological_decisions:
- issue: Χριστός の訳し方
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: ここでは Χριστός が称号として意味を保っているため、その称号性が日本語読者にも分かるよう「メシアである」と訳した。
- issue: パウロの καύχησις の性質
  choice: メシアであるイエスにあって、神に関する事柄について誇る理由がある
  alternative: 一般的な個人的自信、または単なる主観的喜び
  rationale: 誇りは「メシアであるイエスにあって」と「神に関する事柄について」によって限定されている。本文はこの限定を保ちつつ、それ以上に奉仕や功績へ意味を狭めていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロ書簡にふさわしい品位を保った。「ですから」は論理的つながりを平易に示し、「にあって」は神学的・関係的な ἐν の含みを保持するため採用した。
