  yaml_path: translation/nt/romans/015/022.yaml
  text: Therefore I also was often hindered from coming to you[a].
translation:
  language: ja
  text: そのため、私はあなたがたのところへ行くことを何度も妨げられていました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: そのため
  rationale: 直前の議論から導かれる結果を示す。現代日本語として自然に論理的つながりを保つ。
- source_word: καὶ
  choice: （明示せず）
  rationale: ここでは前文との結びつきを補強する語だが、日本語で「も」を加えると何との並列かが不自然になり得るため、文脈上の働きを「そのため」に含ませた。
- source_word: ἐνεκοπτόμην
  choice: 妨げられてきました
  rationale: 未完了過去の反復・継続的な受動の意味を表し、妨げた主体は特定しない。
- source_word: τὰ πολλὰ
  choice: 何度も
  rationale: 頻繁な反復を表す副詞的慣用句。文脈上不適切な「たいてい」ではなく、繰り返しを明確に示す。
- source_word: τοῦ ἐλθεῖν
  choice: 行くことを
  rationale: 妨げられた行為を示す属格の冠詞付き不定詞。日本語では「妨げられる」が目的語を「を」で取る自然な構文とした。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのところへ
  rationale: ローマの信徒たちを目指す移動を自然かつ明確に表す。
