id: ROM.15.3
reference: Romans 15:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: ja
  text: 'というのも、メシア[a]でさえ、ご自分を喜ばせることはなさらなかった。むしろ、こう書かれているとおりである。


    「あなたをそしる者たちのそしりが、


    　わたしの上に降りかかった。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。
    reason: Χριστόςは称号として「メシア」とも、日本語で定着した呼称として「キリスト」とも訳し得るため。
lexical_decisions:
- source_word: καὶ γὰρ
  choice: というのも、～でさえ
  rationale: γάρの前節を根拠づける働きを「というのも」で、καίの強調を「でさえ」で表し、文脈上の推論と強調の両方を自然な日本語で保持した。
- source_word: ὁ Χριστός
  choice: メシア
  rationale: 定冠詞を伴い、信徒の模範となる称号的な用法であるため、油注がれた者という称号性が伝わる「メシア」とした。
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: ご自分を喜ばせることはなさらなかった
  rationale: ἤρεσενの「喜ばせる」と再帰代名詞ἑαυτῷを明示しつつ、メシアを主語とする現代日本語として自然な敬意を添えた。自己満足や自己利益の追求といった解釈を本文に加えていない。
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: かえって、こう書かれているとおりである
  rationale: ἀλλάの対照を「かえって」で示し、完了形受動態γέγραπταιによる定型的な聖書引用句を「書かれている」と自然に表した。
- source_word: ὀνειδισμοί / ὀνειδιζόντων
  choice: そしり／そしる者たち
  rationale: 名詞と同根の分詞の反復を日本語でも同根表現によって保持した。「そしり」は侮辱と非難の両面を含み、引用文にふさわしい簡潔で格調ある語である。
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: わたしの上に降りかかった
  rationale: ἐπιπίπτωとἐπίの空間的な比喩を保持し、敵意や非難が話者に及んだことを自然に表現した。アオリストは完了を明示せず過去形とした。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは定冠詞を伴い、信徒の模範として提示される称号的な働きが強いため「メシア」とした。ただし日本語で定着した「キリスト」も可能なので脚注に示した。
- issue: 詩編引用の話者の同定
  choice: 引用をそのまま「わたし」とし、話者を本文中で特定しない
  alternative: 「わたし」をメシアまたはキリストと説明的に訳す
  rationale: パウロはこの引用をメシアに適用しているが、引用自体の一人称に説明を加えず、原文が持つ話者の表現と神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用には簡潔で格調ある調子を保った。「ご自分」「なさらなかった」は過度に古風にならない範囲で主語への敬意を示す。引用は改行して詩文であることを示した。
