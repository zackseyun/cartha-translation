id: ROM.15.30
reference: Romans 15:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: ja
  text: 兄弟たち、私は、私たちの主イエス・メシアによって、また聖霊の愛によって、私のために神に祈ることにより、私と共に力を尽くしてくださるよう、あなたがたにお願いします。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」はギリシア語では男性形だが、信仰共同体全体、すなわち兄弟姉妹を指す場合がある。「メシア」は「油を注がれた者」を意味し、「キリスト」とも訳される。「聖霊の愛」は、聖霊ご自身の愛とも、聖霊が生み出す愛とも理解できる。
    reason: 「兄弟たち」の包括的用法、「メシア」の代替訳、および「聖霊の愛」における属格の曖昧さを示すため。
lexical_decisions:
- source_word: Παρακαλῶ
  choice: お願いします
  rationale: ここでは切実で強い要請を表す。現代日本語として自然であり、単なる依頼より重みのある文脈は「力を尽くして」と全体の構文からも伝わる。
- source_word: δὲ
  choice: 無訳
  rationale: 弱い移行を示す接続辞であり、この一節だけの日本語では明示しないほうが自然で、強い対比を加えずに済む。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を保つ。ただし、この呼びかけは信仰共同体全体を含み得るため脚注で説明する。
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・メシアによって
  rationale: διά＋属格の根拠・媒介の含みを「によって」で保つ。Χριστόςは称号として「メシア」とした。
- source_word: ἀγάπης τοῦ πνεύματος
  choice: 御霊の愛
  rationale: 属格をそのまま保ち、御霊ご自身の愛とも、御霊が生み出す愛とも取り得る曖昧さを残す。
- source_word: συναγωνίσασθαί μοι
  choice: 私と共に力を尽くして
  rationale: συν-の共同性と、ἀγωνίζομαιの懸命な奮闘の意味を、自然な現代日本語で表した。
- source_word: ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: 私のために神に祈り
  rationale: 祈りの向かう先と執り成しの対象を明瞭にし、日本語では動詞句に組み替えて自然に表した。
theological_decisions:
- issue: 「御霊」の指示対象
  choice: 聖霊を指す「御霊」
  alternative: 人間の霊、または非人格的な霊
  rationale: パウロ書簡の用法とこの構文では聖霊が最も自然。ただし「愛」との属格関係は限定しない。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスに付された称号としての意味を明示する。「キリスト」は広く定着した代替訳として脚注に示す。
- issue: ἀδελφοίの範囲
  choice: 本文は「兄弟たち」
  alternative: 「兄弟姉妹たち」
  rationale: 文法上の男性複数形を本文に保持しつつ、会衆全体を指し得る包括的用法を脚注で説明する。
translation_notes:
  register: 明瞭な現代標準日本語。祈りにおける共同の奮闘を「共に力を尽くす」とし、荘重さを保ちながら過度に古風な表現は避けた。
