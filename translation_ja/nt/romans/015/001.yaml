source:
  edition: SBLGNT
  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: ja
  text: 強い私たちは、弱い人たちの弱さ[a]を担うべきであり、自分自身を喜ばせるべきではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「弱い人たちの弱点」。このギリシア語は、弱さ、制約、弱点などを意味し得ます。ここでは、前章で論じられた良心上のためらいや制約を指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: 担うべきであり
  rationale: 直説法で示された道徳的責務を、文脈に合う自然な勧告表現「べき」で表した。
- source_word: δὲ
  choice: （独立した語としては訳出しない）
  rationale: 前段を受ける軽い移行・連結を示すが、日本語で「さて」「しかし」を加えると関係を強く限定しすぎるため、文脈上のつながりに委ねた。
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: 力のある私たち
  rationale: 強い者と弱い者の対比を保ちつつ、身体的な強さだけに限定されにくい表現とした。
- source_word: τὰ ἀσθενήματα
  choice: 弱さ
  rationale: 良心上の制約や弱点を含み得る広い語義を保持し、「過ち」のような道徳的断罪を避けた。
- source_word: τῶν ἀδυνάτων
  choice: 力のない人たちの
  rationale: δυνατοίとの語的対比を保つ。「弱い人たち」も可能だが、同じ節の「弱さ」との不自然な反復を避けた。
- source_word: βαστάζειν
  choice: 担う
  rationale: 単に我慢するのではなく、他者の重荷を引き受けて支える含意を保った。
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: 自分を喜ばせるべきではありません
  rationale: 再帰的表現を明示し、自分自身の満足を優先しないという倫理的対比を自然に表した。
theological_decisions:
- issue: 「力のある人」と「力のない人」の意味
  choice: ローマ14章から続く文脈において、主として良心や信仰上の自由に関する強さと弱さを指す表現として訳す。
  alternative: 社会的権力の有無、または身体的な強弱を指す。
  rationale: 直前の文脈は食物や日の扱いをめぐる信者間の相違を論じている。ただし本文では説明を加えず、「力」という比喩の幅を保った。
- issue: 「弱さ」の倫理的評価
  choice: 制約、ためらい、弱点を含む中立的で幅のある表現とする。
  alternative: 「過ち」と訳し、道徳的失敗を前面に出す。
  rationale: ἀσθενήματαは失敗を含み得るが、この文脈で一義的に罪や過失と断定すると神学的緊張を解消しすぎる。
translation_notes:
  register: 現代の標準的な日本語による、明瞭で品位ある敬体。原文の強者・弱者の対比を保ちつつ、身体的能力や社会的権力だけを指すとの誤解を抑えるため「力のある／力のない」とした。
