reference: Romans 15:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: ja
  text: 'また異邦人が、神のあわれみのゆえに神をあがめるためです[a]。こう書かれています。


    「それゆえ、私は異邦人の間であなたをたたえ、

    　あなたの御名をたたえて歌います。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 二か所の「異邦人」は、いずれも「諸国民」とも訳せる。パウロはこの引用を特に異邦人に当てはめているが、引用元の表現にはより広く「国々の民」という意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη / ἔθνεσι
  choice: 異邦人／異邦人の間で
  rationale: ローマ書の文脈ではユダヤ人ではない人々を指すため「異邦人」とした。引用元ではより広く「諸国民」とも訳せるので、その含みを脚注に残した。
- source_word: ὑπὲρ ἐλέους
  choice: 神のあわれみのゆえに
  rationale: ὑπέρ＋属格が表す理由・根拠を明確にし、文脈上あわれみの主体が神であることを自然な日本語で示した。
- source_word: δοξάσαι
  choice: 神をあがめるため
  rationale: 前節に依存する不定詞の目的・結果の働きを「ため」で表し、δοξάζωを礼拝的な文脈に適した「あがめる」と訳した。
- source_word: καθὼς γέγραπται
  choice: こう書かれています
  rationale: 聖書引用を導入する定型表現として、明快で現代的な日本語を用いた。
- source_word: ἐξομολογήσομαί σοι
  choice: 私は…あなたをたたえ
  rationale: ここでは罪の告白ではなく、公に神を賛美・感謝する意味であり、後続のψαλῶとの並行も保つ表現とした。
- source_word: ψαλῶ
  choice: ほめ歌います
  rationale: 神に向けて賛美を歌う意味を、特定の詩編だけに限定せず自然に表した。
- source_word: τῷ ὀνόματί σου
  choice: あなたの御名を
  rationale: 日本語では「御名をほめ歌う」が自然で、神の名を賛美する聖書的表現も保持できる。
theological_decisions:
- issue: 冒頭の不定詞節が前節に依存すること
  choice: 「また異邦人が…神をあがめるためです」とし、前節から続く目的・結果として訳す
  alternative: 「また異邦人は…神をあがめる」と独立文のように訳す
  rationale: ギリシア語のδοξάσαιは15:8から構文的に続いている。「ためです」はこの依存関係を明示するが、目的と結果の境界を過度に限定しない。
- issue: ἐλέουςの主体
  choice: 「神のあわれみ」と明示する
  alternative: 「あわれみのゆえに」
  rationale: 文脈とτὸν θεόνから、異邦人がたたえる根拠は神のあわれみである。明示は指示関係を明瞭にするもので、特定の教派的解釈を加えるものではない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書引用にふさわしい品位を保った。「あわれみ」「御名」は広く理解される聖書的語彙として採用し、古風すぎる語尾や難解な漢語は避けた。
