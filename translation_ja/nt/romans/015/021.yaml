  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: ja
  text: 'しかし、次のように書かれているとおりです。


    「彼について告げられたことのない人々は見るであろう。[a][b]


    聞いたことのない人々は悟るであろう。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: イザヤ書52章15節からの引用。イザヤ書の文脈で「彼」はしもべの人物を指す。パウロはこの引用を自らの福音宣教に当てはめている。
    reason: cross_reference
  - marker: b
    text: 別訳、「彼について何も告げられなかった人々は見るであろう。聞いたことのない人々は悟るであろう。」
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前に述べられたパウロの宣教方針を受け、対照を示す自然な接続語とした。
- source_word: καθὼς γέγραπται
  choice: こう書かれているとおりです
  rationale: 聖書引用を導く定型表現であり、完了受動形の継続的な効力を自然な現代日本語で表した。
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: 彼について告げられていなかった人々
  rationale: 与格関係代名詞を日本語で自然な名詞句に組み替えつつ、受動の『告げられる』と περὶ αὐτοῦ の『彼について』を保持した。
- source_word: ὄψονται
  choice: 見
  rationale: 未来形の預言的意味は引用全体の文脈で明らかなため、後続の『悟る』と並ぶ簡潔な日本語とした。比喩的な『認識する』へ限定しなかった。
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: 聞いたことのなかった人々
  rationale: それまで聞く機会・経験がなかった人々という完了形の含意を、引用の将来的視点に合う自然な表現で示した。
- source_word: συνήσουσιν
  choice: 悟る
  rationale: 単なる情報理解にとどまらない συνίημι の認識の意味を、格調を保ちながら平明な日本語で表した。
theological_decisions:
- issue: イザヤ書引用における αὐτοῦ の指示対象
  choice: 本文では『彼』のまま保持する
  alternative: 『メシアについて』または『キリストについて』と明示する
  rationale: ローマ書の文脈では福音宣教に適用されるが、ギリシア語本文は固有の称号ではなく代名詞を用いる。本文で解釈を付加せず、イザヤ書のしもべとの関係は脚注で説明した。
- issue: ὄψονται の意味領域
  choice: 『見る』を保持する
  alternative: 『認める』『知る』と解釈的に訳す
  rationale: 後半の『悟る』との並行関係が認識的含意を示す一方、原文の視覚動詞を別の語へ置き換えず、詩的緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用としての簡潔さと格調を保った。『彼』と『見る』を解釈的に言い換えず、原文の曖昧さと詩的並行を保持した。脚注記号は対応する句の直後に置いた。
