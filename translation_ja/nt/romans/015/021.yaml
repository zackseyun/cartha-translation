    rationale: ὄψονταιとσυνήσουσινはいずれも未来形である。「見、…悟る」でも日本語の文脈上未来に読める余地はあるが、原文の預言的将来性を明瞭にするため「見るであろう／悟るであろう」とする。
  - severity: low
    issue: 「聞いたことのなかった」は時制関係がやや不自然
    rationale: ἀκηκόασινは完了形であり、未来の出来事に対する過去完了というより、「聞いたことがない」という未経験・未伝聞の状態を表す。「聞いたことのない人々」が自然である。
  - severity: low
    issue: 第一行の主語と述語の結び付きが弱い
    rationale: 「人々が見」よりも、「人々は見るであろう」と明示するほうが、独立した聖書引用として読みやすい。
