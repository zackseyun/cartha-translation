id: ROM.15.5
reference: Romans 15:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: ja
  text: どうか、忍耐と励ましの神が、あなたがたが互いに同じ思いを抱くことができるように[a]、メシアであるイエスにかなうように[b]、してくださいますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同じ思いでいる」または「心を一つにする」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「メシア・イエスに従って」。ここでは、メシアであるイエスにかなう、すなわち彼を基準とすることを表す。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: どうか、…神が
  rationale: δέの緩やかな接続は日本語では文脈に委ね、δῴηが作る祈願の調子を「どうか」で自然に示した。
- source_word: τῆς ὑπομονῆς
  choice: 忍耐の
  rationale: 圧力や困難のもとで耐え続ける意味を簡潔に表し、神がその源または与え主であるという属格の含みを保つ。
- source_word: τῆς παρακλήσεως
  choice: 励ましの
  rationale: 慰め、勧め、力づけを含みうる語だが、直前の15:4とのつながりでは、信徒を支え強める広い意味の「励まし」が適切。
- source_word: δῴη ὑμῖν
  choice: あなたがたが…できるようにしてくださいますように
  rationale: 祈願を表すアオリスト希求法を、明瞭で自然な現代日本語の願望表現にした。
- source_word: τὸ αὐτὸ φρονεῖν
  choice: 同じ思いを抱く
  rationale: φρονέωの思考、心構え、物の見方に関わる幅を保つ。あらゆる事柄で意見を完全に同一にするという意味には限定しない。
- source_word: ἐν ἀλλήλοις
  choice: 互いに
  rationale: 共同体の中で相互に共有される心構えを、自然な日本語で表す。
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: メシアであるイエスにかなうように
  rationale: κατάが示す基準・規範への適合を表し、Χριστόςを称号として訳した。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシアであるイエス
  alternative: キリスト・イエス
  rationale: Χριστόςの称号としての意味を読者に明示しつつ、日本語として自然な形にした。
- issue: τὸ αὐτὸ φρονεῖνの範囲
  choice: 互いに同じ思いを抱く
  alternative: あらゆる点で同一の意見を持つ
  rationale: 共同体における心構えの一致を表す一方、すべての問題に関する完全な意見の画一化までは本文に持ち込まない。
- issue: κατὰ Χριστὸν Ἰησοῦνの関係
  choice: メシアであるイエスにかなうように
  alternative: メシアであるイエスに倣って
  rationale: κατάの規範・基準の意味を保ち、単に模倣だけを意味すると断定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、祈願としての品位を「どうか」と「くださいますように」で表した。「メシア・イエス」という直訳的な語順は注に残し、本文では「メシアであるイエス」として理解しやすくした。
