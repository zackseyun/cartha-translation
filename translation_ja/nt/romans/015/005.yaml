  to: どうか、忍耐と励ましの神が、あなたがたが互いに同じ思いを抱くことができるように[a]、メシアであるイエスにかなうように[b]、してくださいますように。
  rationale: 本文の意味は維持したまま、脚注bにおける「直訳」という表現を改め、κατάが示す規範への適合を正確に説明した。また、脚注を各該当語句の直後に置いた。「抱くことができるように」は、祈願として神が一致を与えることを明瞭にする軽微な日本語上の整えである。
