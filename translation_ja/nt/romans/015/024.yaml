source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: ja
  text: スペインへ行くときには、途中であなたがたに会い、まずあなたがたとの交わりによって幾分満たされることができれば[a]、あなたがたにそこへ向かう旅を助けてもらいたい[b]と願っているからです。――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「まずあなたがたによって幾分満たされたなら」。この表現は、あなたがたとの交わりによる満足や喜びを比喩的に述べる。
    reason: lexical_alternative
  - marker: b
    text: 「そこへ向かう旅を助けてもらう」は、「そこへ送り出してもらう」「見送ってもらう」とも訳せる。この動詞は、同行や旅に必要な支援を含む場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι εἰς τὴν Σπανίαν
  choice: スペインへ行く時には
  rationale: ὡς ἄνと接続法が表す未確定の将来時を、自然な現代日本語で示した。反復を表す「いつでも」ではなく、将来の機会を指す「時には」とした。
- source_word: ἐλπίζω γὰρ
  choice: 願っているからです
  rationale: ἐλπίζωの期待を伴う願いと、γάρの説明的なつながりを自然に表した。
- source_word: διαπορευόμενος θεάσασθαι ὑμᾶς
  choice: 途中であなたがたに会い
  rationale: スペインへの途上でローマの信徒たちを訪ねるという文脈を、簡潔かつ自然に表した。
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: そこへ向かう旅をあなたがたに助けてもらいたい
  rationale: προπέμπωが含み得る見送り、同行、旅の支援を一つに限定せず、旅立ちを助ける一般的な意味を保った。
- source_word: ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ
  choice: まずはしばらくあなたがたとの交わりを楽しんだ後
  rationale: 直訳的な「あなたがたで一部分満たされる」は日本語では不自然なため、対面による満足を「交わりを楽しむ」と表した。ἀπὸ μέρουςは滞在の限られた性格を示すものとして「しばらく」としたが、別解を脚注に残した。
theological_decisions:
- issue: ローマの信徒たちがパウロの旅を支える具体的な方法
  choice: 旅を助けてもらう
  alternative: 見送ってもらう／同行してもらう／旅に必要な支援を受ける
  rationale: 本文は支援の具体的な形を明示していないため、財政的支援や正式な宣教派遣などに限定しなかった。
- issue: ἐμπλησθῶとἀπὸ μέρουςが表す満足の性質
  choice: しばらくあなたがたとの交わりを楽しむ
  alternative: あなたがたによって幾分満たされる
  rationale: 人々との対面による喜びや満足を文脈上明確にしつつ、「しばらく」と「幾分」のどちらとも取り得る限定の曖昧さを脚注で示した。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で品位ある文体。「交わり」はキリスト教文脈で通用する語だが、ここでは単なる会見以上の親しい交流を自然に示すために用いた。原文が前後へ続く文であることを末尾のダッシュで示した。
