source:
  edition: SBLGNT
  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: ja
  text: しるしと不思議の力により、また御霊の力によって[a]、私はエルサレムからその周辺一帯にわたり、イリリクムに至るまで、メシアの福音を余すところなく伝えました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊の力によって」。
    reason: alternative_reading
  - marker: b
    text: 直訳「メシアの福音を満たしました」。すなわち、福音を十分に宣べ伝え、行き渡らせたという意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν δυνάμει σημείων καὶ τεράτων
  choice: しるしと不思議な業の力により
  rationale: ἐν δυνάμει は手段・働きを表すものとして「力により」とし、定型的な対句 σημείων καὶ τεράτων は、現代日本語で超自然的な業を明確に示す「しるしと不思議な業」とした。
- source_word: ἐν δυνάμει πνεύματος
  choice: 御霊の力によって
  rationale: 文脈上 πνεύματος は神の霊を指す可能性が高い。「御霊」はその指示対象を自然に示しつつ、本文にない ἁγίου（聖なる）を補わない。
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ
  choice: エルサレムからその周辺一帯を経て
  rationale: κύκλῳ の副詞的な地理表現を、宣教活動が周辺諸地域に広がったことが伝わる自然な日本語にした。
- source_word: μέχρι τοῦ Ἰλλυρικοῦ
  choice: イリリクムに至るまで
  rationale: μέχρι が示す地理的到達範囲を簡潔に表した。Ἰλλυρικόν は当時の地域名として「イリリクム」と音写した。
- source_word: πεπληρωκέναι τὸ εὐαγγέλιον
  choice: 福音を余すところなく伝えました
  rationale: 直訳的な「福音を満たす」は現代日本語では意味が取りにくい。文脈上、福音を広い地域に十分行き渡らせたという完了的な成果を表すため、「余すところなく伝えました」とした。直訳に近い形は脚注に残した。
- source_word: τὸ εὐαγγέλιον τοῦ Χριστοῦ
  choice: キリストの福音
  rationale: εὐαγγέλιον はパウロ書簡で定着した「福音」、Χριστός は称号としても日本語で広く理解される「キリスト」とした。属格が表す関係は原文同様に限定せず「の」で保った。
theological_decisions:
- issue: πνεύματος の指示対象と異読
  choice: 御霊
  alternative: 聖なる御霊／霊
  rationale: 使徒的宣教、しるし、不思議な業を力づける主体という文脈から、神の霊を指すと読むのが自然である。ただし本文の読みには「聖なる」に当たる語がないため、本文では「御霊」とし、「聖なる御霊」とする異読を脚注に示した。
- issue: πεπληρωκέναι τὸ εὐαγγέλιον の意味
  choice: キリストの福音を余すところなく伝えました
  alternative: キリストの福音を満たしました
  rationale: この結びつきは、福音を十分に宣べ伝え、地域に行き渡らせることを意味し得る。自然な本文ではその文脈的意味を示しつつ、動詞 πληρόω の「満たす」という像と解釈上の余地を脚注に保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「不思議」だけでは抽象的に響くため「不思議な業」とした。「余すところなく」は完了的な広がりを自然に表しつつ、過度に口語的にならない表現である。
