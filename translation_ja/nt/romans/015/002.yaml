  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: ja
  text: 私たちは一人ひとり、隣人の益[a]となり、その人を築き上げる[b]ために、隣人を喜ばせましょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「善のために」または「良いことを目指して」。ここでは、単に相手の機嫌を取るのではなく、その人に益となることが強調されている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その人を成長させるために」。原語は文字どおりには「建て上げること」を指し、ここでは人を強めることの比喩として用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: 私たち一人ひとり
  rationale: 分配を表す単数形と属格の関係を、共同体全体の各人に向けた勧告として自然な現代日本語で表した。
- source_word: τῷ πλησίον
  choice: 隣人／その人
  rationale: 倫理的な意味で身近な他者を指す「隣人」とし、後続箇所では日本語として自然になるよう「その人」で受けた。
- source_word: ἀρεσκέτω
  choice: 喜ばせ……ましょう
  rationale: 三人称単数の現在命令形が持つ勧告の力を、文脈上の複数の聞き手に対する自然で明確な呼びかけとして表した。「気に入られようとする」ではなく、他者を喜ばせる意味を保つ。
- source_word: εἰς τὸ ἀγαθὸν
  choice: 益となるように
  rationale: 目的・方向を示す句として、単なる迎合や機嫌取りではなく、隣人にとって有益なことを目指すという限定を明示した。
- source_word: πρὸς οἰκοδομήν
  choice: その人を築き上げる
  rationale: οἰκοδομήの建築比喩を保持しつつ、人を強め成長させるという比喩的意味が現代日本語で伝わる形にした。目的語は文脈上の「隣人」から補った。
theological_decisions:
- issue: 隣人を喜ばせる命令の範囲
  choice: 隣人の益と、その人を築き上げることによって限定される命令として訳す。
  alternative: 他者への無条件の迎合や承認と読める訳。
  rationale: 原文の二つの目的句（εἰς τὸ ἀγαθὸν、πρὸς οἰκοδομήν）が「喜ばせる」の意味を限定しているため、その倫理的緊張を明確に保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「〜ましょう」により共同体への勧告を自然に表し、「築き上げる」というパウロ書簡の建築比喩を保持した。脚注記号は対応する概念の直後に置いた。
