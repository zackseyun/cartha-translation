  text: ὁ δὲ θεὸς τῆς εἰρήνης μετὰ πάντων ὑμῶν· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/033.yaml
  text: May the God of peace be with all of you. Amen.
translation:
  language: ja
  text: 平和の神が、あなたがたすべてと共にいてくださいますように。アーメン。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: （訳出しない）
  rationale: ここでは弱い接続・移行を示し、強い逆接ではない。結びの祝祷として日本語では明示しないほうが自然であり、時間を表す「今」を補う根拠もない。
- source_word: θεὸς τῆς εἰρήνης
  choice: 平和の神
  rationale: 属格を用いたパウロ特有の称号を、簡潔で定着した日本語として保持する。
- source_word: εἰρήνης
  choice: 平和
  rationale: 争いのない状態だけでなく、和解と健全な全体性を含み得る語だが、ここでは自然で十分に広い「平和」とする。
- source_word: μετὰ πάντων ὑμῶν
  choice: あなたがたすべてと共にいてくださいますように
  rationale: 原文には動詞がないが、書簡末尾の祝祷として願いを表す日本語を補う。πάντων の包括性を「すべて」で明示する。
- source_word: ἀμήν
  choice: アーメン
  rationale: 典礼的な結語として音写を保ち、厳粛な同意と確証の響きを伝える。
theological_decisions:
- issue: 動詞のない節を事実の叙述とするか、祝祷の願いとするか
  choice: 「いてくださいますように」と祝祷として訳す
  alternative: 「共におられます」と直説的に訳す
  rationale: 文法上は動詞が省略されているが、書簡の結びに置かれた定型表現としては願い・祈りと理解するのが自然である。原文にない時制を断定せず、発話機能を明確にした。
translation_notes:
  register: 明瞭な現代標準日本語。短い祝祷の荘重さを保ちつつ、「あなたがたすべて」で共同体全員への包括的な祝福を明示した。
