  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: ja
  text: 聖なる者たちの必要を共に担い、もてなしに努めなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「もてなしを追い求めなさい」。ここでの「もてなし」には、見知らぬ人や旅人を迎えることが含まれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: 必要
  rationale: 実際的・物質的な必要を表す。現代日本語として自然で、意味を金銭だけに限定しない。
- source_word: ἁγίων
  choice: 聖なる者たち
  rationale: パウロ書簡で神に属する信者たちを指す呼称としての意味を保ち、後代の特定の聖人という限定を避ける。
- source_word: κοινωνοῦντες
  choice: 共に担い
  rationale: 必要に参与し、それを満たすために分かち合う能動的な意味を表す。「献げる」より範囲を狭めない。
- source_word: φιλοξενίαν
  choice: 旅人をもてなすこと
  rationale: 語源的・文脈的に、客一般への歓待だけでなく、見知らぬ人や旅人を迎える意味を明確にする。
- source_word: διώκοντες
  choice: 励みなさい
  rationale: 機会を積極的に追い求める継続的な姿勢を、自然な勧告の日本語で表す。
theological_decisions:
- issue: 「聖なる者たち」の指示対象
  choice: 神に属する信者たち一般
  alternative: 後代の教会で特別に列聖された聖人たち
  rationale: パウロの通常の用法では、キリスト者共同体の成員を集合的に指す。
- issue: κοινωνοῦντες の支援の範囲
  choice: 必要を満たすため広く共に担うこと
  alternative: 金銭を献げることに限定する
  rationale: この動詞は参与・共有・寄与を含み得るため、支援を金銭だけに限定しない訳を採った。
translation_notes:
  register: 簡潔な勧告の並行性を保ちつつ、現代の一般読者に分かる、品位ある標準的な日本語とした。分詞二つは文脈上の命令の力を「〜なさい」で表した。
