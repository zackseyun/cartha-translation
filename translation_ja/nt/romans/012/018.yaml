  yaml_path: translation/nt/romans/012/018.yaml
  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: ja
  text: 可能であれば[a]、あなたがたにできる限り、すべての人と平和を保ちなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もし可能なら、あなたがたとしては、すべての人と平和を保ちなさい。」
    reason: εἰ δυνατόν と τὸ ἐξ ὑμῶν は、「もし可能なら」「あなたがたとしては」と、原文の語順と構文をより直接に反映して訳すこともできる。
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: できることなら
  rationale: 現実的な可能性を条件として示す句であり、命令を無条件のものにしない。現代日本語として自然で、簡潔に条件性を保つ。
- source_word: τὸ ἐξ ὑμῶν
  choice: あなたがたの側でできる限り
  rationale: 読者自身の側にある能力と責任の範囲を表す慣用句として訳した。単に努力の程度だけでなく、自分たちが左右できる範囲という限定を伝える。
- source_word: μετὰ πάντων ἀνθρώπων
  choice: すべての人と
  rationale: ἄνθρωποι はここでは男性だけでなく人間一般を指すため、包括的で自然な表現とした。
- source_word: εἰρηνεύοντες
  choice: 平和に過ごしなさい
  rationale: 文脈上、勧告として働く現在分詞であり、継続的な生き方を示す。「平和でありなさい」より自然に、他者との平和な関係を保って生活する意味を表す。
theological_decisions:
- issue: 平和を求める勧告の範囲と限界
  choice: すべての人との平和を命じつつ、その責任を本人たちの側で可能な範囲に限定する。
  alternative: 信者が正しく行動すれば、必ずすべての人との平和を実現できるという無条件の命令として訳す。
  rationale: εἰ δυνατόν と τὸ ἐξ ὑμῶν の二つの限定をともに明示し、普遍的な対象と現実的な責任の限界との緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、勧告としての品位を保った。「できることなら」と「あなたがたの側でできる限り」を併置し、原文にある二重の限定を省略しない。
