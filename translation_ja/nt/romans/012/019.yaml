id: ROM.12.19
reference: Romans 12:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: ja
  text: 愛する皆さん、自分で復讐してはいけません。むしろ、怒りに余地を与えなさい。[a] なぜなら、こう書かれているからです。「復讐はわたしのものだ。わたしが報いる」と主は言われます。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「怒りのために余地を残しなさい」とも訳せる。直後の引用から、神の怒りを指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: または「わたしが返報する」。ここでは、行いに応じて報いることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: 自分で復讐してはいけません
  rationale: μήを伴う現在分詞が文脈上命令として働くことを明示し、ἑαυτούςの再帰的意味とἐκδικέωの復讐の意味を自然な現代日本語で保った。
- source_word: ἀγαπητοί
  choice: 愛する者たち
  rationale: 呼びかけの親愛と信仰共同体における温かみを保ちつつ、現代日本語として明瞭で品位のある表現とした。
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: むしろ、怒りに場所を譲りなさい
  rationale: δότε τόπονの場所の比喩と、τῇ ὀργῇに所有者が明記されていない点を保持した。文脈上は神の怒りが有力だが、本文では補わない。
- source_word: γέγραπται γάρ
  choice: こう書かれているからです
  rationale: 聖書引用を導く定型表現を、自然な現代日本語で表した。
- source_word: Ἐμοὶ ἐκδίκησις
  choice: 復讐はわたしのもの
  rationale: 与格Ἐμοίによる所有を簡潔に表し、神に属する復讐の権限を明確にした。
- source_word: ἐγὼ ἀνταποδώσω
  choice: わたしが報いる
  rationale: 強調されたἐγώを「わたしが」で示し、ἀνταποδίδωμιの応報・返報の意味を簡潔に保った。
- source_word: λέγει κύριος
  choice: 主はこう言われます
  rationale: 引用後の定型句として自然な日本語にし、κύριοςを「主」と訳した。
theological_decisions:
- issue: τῇ ὀργῇ（怒り）の主体
  choice: 本文では「怒り」とだけ訳し、神の怒りとは明示しない
  alternative: 「神の怒りに場所を譲りなさい」／人間の怒り一般
  rationale: 直後の申命記32章35節の引用から神の怒りが最も自然だが、ギリシア語本文自体は「神の」と明記していないため、曖昧さを本文に残し、注で文脈上の理解を示した。
- issue: 復讐と報いの主体
  choice: 「復讐はわたしのもの。わたしが報いる」
  alternative: 「復讐するのはわたしである。わたしが仕返しする」
  rationale: 個人的復讐を禁じる根拠が、裁きと報いが主に属することにあるという対照を保ちつつ、「仕返し」の口語的・報復的な含意を避けた。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。命令は丁寧体で統一し、引用は簡潔で荘重な調子とした。「怒り」の主体を本文で補わず、原文の簡潔さと神学的緊張を保持した。
