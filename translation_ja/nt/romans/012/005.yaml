- from: 同じように、私たちも、大勢でありながら、メシア[a]にあって一つの体であり、一人一人は互いの器官です。
  to: このように、私たち大勢も、メシア[a]にあって一つの体であり、一人一人が互いに一つの体の部分です。
  rationale: 「このように」は前節の身体の比喩を受けるοὕτωςを自然に表します。「私たち大勢も」は、原文の一人称複数と多数性を簡潔に反映します。後半を「互いに一つの体の部分です」と改め、ἀλλήλων μέληの相互性を、日本語として不自然な所有表現を避けつつ、直前の「一つの体」の比喩の範囲内で明確にしました。脚注の別訳は本文の句に対応するよう「キリストにあって」としました。
