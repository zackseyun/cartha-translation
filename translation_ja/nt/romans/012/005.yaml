  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: ja
  text: このように、私たち大勢も、メシア[a]にあって一つの体であり、一人一人が互いに一つの体の部分です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリストにあって」。ギリシア語Χριστόςは「油注がれた者」を意味する称号で、「メシア」とも「キリスト」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: 同じように
  rationale: 直前の一つの体と多くの器官の比喩を、信じる者たちの共同体に当てはめる比較・帰結の働きを自然に示す。
- source_word: οἱ πολλοὶ
  choice: 私たちも、大勢でありながら
  rationale: ἐσμεν（一人称複数）により示される包括的な「私たち」を明示し、多数性と一体性の対比を保つ。
- source_word: ἓν σῶμά
  choice: 一つの体
  rationale: 共同体の一致を表す身体比喩をそのまま保持する。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: ἐνの結合・領域を表すパウロ的表現を「にあって」で保ち、Χριστόςの称号としての意味を「メシア」で示す。
- source_word: τὸ δὲ καθ’ εἷς
  choice: 一人一人は
  rationale: 各人を個別に捉える分配的な意味を、明瞭で自然な日本語にする。
- source_word: ἀλλήλων μέλη
  choice: 互いの器官
  rationale: 相互関係を表す属格と身体比喩を簡潔に保つ。「部分」よりも前節から続く身体のイメージが明確である。
theological_decisions:
- issue: ἐν ΧριστῷにおけるΧριστόςの訳語
  choice: メシアにあって
  alternative: キリストにあって
  rationale: Χριστόςを単なる固有名のように扱わず、「油注がれた者」という称号性を伝える。一方で、日本語で広く定着した「キリスト」も可能なため脚注に示す。
- issue: ἀλλήλων μέληが表す相互所属
  choice: 互いの器官
  alternative: 互いに属する器官
  rationale: 原文の簡潔な属格表現と相互性を保ち、本文には原文に明示されない「属する」を補わない。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、身体比喩と「メシアにあって」という神学的に重要な表現を保持した、簡潔で格調ある文体。
