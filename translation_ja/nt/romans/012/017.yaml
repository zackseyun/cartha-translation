  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: ja
  text: だれに対しても、悪に悪を返してはなりません。すべての人の目に良いこと[a]を心がけなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「立派なこと」または「尊いこと」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδενὶ
  choice: だれに対しても～ない
  rationale: 与格でἀποδιδόντεςの相手を示す。「だれに対しても…ない」として普遍的な範囲を自然な日本語で保った。
- source_word: κακὸν ἀντὶ κακοῦ
  choice: 悪に悪を
  rationale: ἀντίはここで報復的な交換、すなわち「悪への返礼として悪を」を表す。簡潔で定着した日本語表現にした。
- source_word: ἀποδιδόντες
  choice: 返してはなりません
  rationale: 現在分詞だが、文脈上は勧告・命令の力を帯びる。「返す」は相手から受けた悪への報復という意味を明瞭に伝える。
- source_word: προνοούμενοι
  choice: 心がけなさい
  rationale: 前もって考え、配慮するという継続的で意図的な姿勢を、現代日本語として自然に表した。単なる物質的な備えには限定しない。
- source_word: καλὰ
  choice: 良いとされること
  rationale: καλόςが持つ「良い」と「立派な・誉れある」の幅を保ちつつ、ἐνώπιον πάντων ἀνθρώπωνとの結び付きを示す表現とした。社会的評価だけに意味を狭めないよう、脚注に別訳を掲げた。
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: すべての人の前で
  rationale: 公に見られることと社会的な説明責任を含む、原文の直截な表現を自然な日本語で保った。ἀνθρώπωνは男女を含む一般的な「人」を指す。
theological_decisions:
- issue: 公的文脈におけるκαλάの倫理的含意
  choice: 良いとされること
  alternative: 立派なこと／誉れあること
  rationale: この句は道徳的な善と、人々の目にも立派であることの双方を含み得る。本文では両面を示し得る表現を採り、別訳を脚注に残して、単なる世評への迎合にも内面的善だけにも限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語。二つの分詞を文脈上の勧告として訳し、丁寧体で統一した。「心がけなさい」は意図的・継続的な配慮を表し、全体を簡潔で格調ある調子に整えた。
