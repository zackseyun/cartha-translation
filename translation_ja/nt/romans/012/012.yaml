lexical_decisions:
- source_word: ἐλπίδι
  choice: 希望をもって
  rationale: 冠詞付き与格を日本語として自然に表し、希望を喜びの根拠・領域として示す。
- source_word: χαίροντες
  choice: 喜び
  rationale: 現在分詞だが、三つの分詞が勧告として機能するため、末尾の「なさい」に統合した連用形で継続的な姿勢を表す。
- source_word: θλίψει
  choice: 苦難の中で
  rationale: 圧迫、悩み、苦しみを含む語であり、現代日本語で重みを保つ「苦難」を採用した。与格は状況を示す「中で」とした。
- source_word: ὑπομένοντες
  choice: 耐え忍び
  rationale: 困難の下にとどまって持ちこたえる継続的態度を簡潔に表す。「我慢する」よりも堅忍の含意を保つ。
- source_word: προσευχῇ
  choice: 祈りに
  rationale: 祈りという営みに継続して専念する関係を自然な助詞「に」で表した。
- source_word: προσκαρτεροῦντες
  choice: 励みなさい
  rationale: 継続して固く取り組む、専念するという意味を、一般読者に明瞭で自然な勧告として表す。単なる頻度ではなく献身的な継続を含む。
