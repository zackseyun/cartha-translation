reference: Romans 12:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: ja
  text: 互いに心を一つにしなさい。高いものに心を向けず[a]、身分の低い人々と交わりなさい[b]。自分を賢い者と思ってはなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「高いことを志さず」、または「高ぶらず」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「へりくだった人々と交わりなさい」とも訳せる。ギリシア語は「低い立場の人々」を指すとも、「低い事柄」を指すとも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: 互いに心を一つにしなさい
  rationale: 直訳的な「同じことを考える」ではなく、共同体の中で互いに調和した心構えを持つよう勧める慣用的な意味を、自然な現代日本語で表した。
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: 高いものに心を向けず
  rationale: 「高いもの」が誇り高い思い、社会的に高い地位、あるいは高望みを指し得るため、意味を一つに限定しない表現とした。
- source_word: τοῖς ταπεινοῖς
  choice: 身分の低い人々
  rationale: 文脈上、人々を指す男性複数として読む社会的な含意を本文に示した。ただし、ギリシア語は「低い事柄」を指す可能性もあるため脚注で明記した。
- source_word: συναπαγόμενοι
  choice: 交わりなさい
  rationale: 字義的には「共に連れて行かれる、共に導かれる」だが、ここでは低い立場の人々を避けず、その仲間となるという意味を自然に伝える。
- source_word: φρόνιμοι παρ’ ἑαυτοῖς
  choice: 自分を賢い者と思ってはなりません
  rationale: 自分自身の評価に基づいて賢いとうぬぼれる態度への警告を、簡潔で明瞭な日本語にした。
theological_decisions:
- issue: τὰ ὑψηλά と τοῖς ταπεινοῖς が、内面的な高慢を指すのか、社会的地位や低い事柄を指すのか
  choice: 本文では「高いもの」という広い表現を保ち、後半は文脈に即して「身分の低い人々」とした。
  alternative: 「高ぶらず、へりくだった人々と交わりなさい」または「高いことを志さず、低いことに身を任せなさい」
  rationale: パウロの勧めには、内面的な謙遜と社会的に低い立場の人々との連帯の双方が響いている。本文と脚注を合わせ、ギリシア語の文法上・意味上の幅を不必要に狭めないようにした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。命令の連続を「しなさい／なりません」で整え、説教調に偏りすぎず、共同体への勧告として読める文体にした。
