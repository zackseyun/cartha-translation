  text: τῇ σπουδῇ μὴ ὀκνηροί, τῷ πνεύματι ζέοντες, τῷ κυρίῳ δουλεύοντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/011.yaml
  text: Do not be lazy in zeal[a]; be fervent in spirit; serve the Lord.
translation:
  language: ja
  text: 熱心さにおいて怠らず、霊に燃え[a]、主に仕えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御霊に燃え立つ」とも訳せる。ここでの「霊」は、信じる者の霊を指すとも、聖霊を指すとも理解できる。
    reason: πνεύματιの指示対象には、人の霊と聖霊という二つの解釈が可能なため。
lexical_decisions:
- source_word: σπουδῇ
  choice: 熱心で
  rationale: σπουδήの「熱心さ・真剣さ」を、続くὀκνηροίとの対照が自然に伝わる現代日本語で表した。
- source_word: ὀκνηροί
  choice: 怠けることなく
  rationale: 消極的で動きの鈍い状態を戒める語。現代語として明快で、σπουδήとの対照も保つ。
- source_word: πνεύματι
  choice: 霊に
  rationale: 人の霊・内的あり方を指す読みと、聖霊を指す読みの双方を排除しない表現とした。
- source_word: ζέοντες
  choice: 燃え
  rationale: 原義の「沸き立つ」に由来する比喩的な熱烈さを、日本語で自然な「燃える」によって保った。
- source_word: κυρίῳ
  choice: 主に
  rationale: パウロ書簡におけるκύριοςの通常の称号として「主」とした。文脈上は主イエスを指す可能性が高いが、訳文では称号のまま保った。
- source_word: δουλεύοντες
  choice: 仕えなさい
  rationale: 奴隷として従属し奉仕する語義を背景に持つが、主への献身と服従を自然かつ端正に表す「仕える」がこの勧告に適する。
theological_decisions:
- issue: τῷ πνεύματιにおけるπνεύματιの指示対象
  choice: 本文では「霊に」とし、人の霊・内的あり方を第一の可能性として保つ
  alternative: 「御霊によって」すなわち聖霊を指す
  rationale: 冠詞を伴う与格表現だけでは指示対象を断定できない。倫理的勧告の並行構造には人の内なる霊という理解がよく合うが、聖霊を指す解釈も可能なので脚注に残した。
translation_notes:
  register: 明快な現代標準語を用い、三つの勧告が連続する原文のリズムを保った。「霊に燃え」は簡潔で品位があり、比喩と解釈上の曖昧さをともに保持する。
