  text: τῇ φιλαδελφίᾳ εἰς ἀλλήλους φιλόστοργοι, τῇ τιμῇ ἀλλήλους προηγούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: ja
  text: 兄弟姉妹としての愛をもって、互いに深い愛情を示しなさい。敬意を示すことでは、互いに先んじなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「互いに先んじなさい」は、「互いに相手を先に立てなさい」とも訳せる。
    reason: προηγούμενοιは、敬意を示すことに率先する意味にも、相手を先に立てる意味にも理解されるため、訳文は前者を採り、脚注で解釈上の幅を示す。
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: 兄弟姉妹として愛し
  rationale: 信仰共同体の成員相互の家族的な愛を表す。現代日本語では「兄弟愛」だけだと男性に限定して聞こえうるため、意味を明確にした。
- source_word: φιλόστοργοι
  choice: 深い愛情を抱きなさい
  rationale: 家族の間に見られるような、親愛に満ちた温かな愛情を表す語。直前のφιλαδελφίᾳとの重なりを保ちつつ、自然な日本語にした。
- source_word: τιμῇ
  choice: 尊ぶことでは
  rationale: ここでは互いに示す敬意・尊重を指すと解した。「誉れ」より対人関係上の行為が伝わりやすい。
- source_word: προηγούμενοι
  choice: 先を争いなさい
  rationale: 基本義は「先に行く／先導する」で、文脈上、互いを尊ぶことに率先する、競うように先んじるという力を保った。単に「優先しなさい」とすると競争的・率先的な含意が弱まる。
theological_decisions:
- issue: προηγούμενοιが相手を自分より上位に置くことを意味するか、敬意を示すことに率先することを意味するか
  choice: 敬意を示すことに互いに率先するという意味を前面に出した
  alternative: 互いに相手を自分より重んじなさい／互いに譲り合いなさい
  rationale: 動詞の「先に行く」という語感と、ἀλλήλουςによる相互性を保持し、特定の序列理解に限定しないため。脚注で別解を示した。
translation_notes:
  register: 命令の連続を簡潔で格調ある現代標準日本語にした。「兄弟姉妹」は教会共同体の家族的関係を明示し、「先を争う」は逆説的な勢いを保つ。
