id: ROM.12.14
reference: Romans 12:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὐλογεῖτε τοὺς ⸀διώκοντας, εὐλογεῖτε καὶ μὴ καταρᾶσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/014.yaml
  text: Bless those who persecute you[a]; bless and do not curse.
translation:
  language: ja
  text: あなたがたを迫害する者たちを祝福しなさい[a]。祝福し、呪ってはいけません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたを追い求める者たち」。ギリシア語の動詞には「追う」という意味もあるが、ここでは敵対的な迫害を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 祝福しなさい／祝福し
  rationale: 複数への命令。倫理的・宗教的な意味を簡潔に保つ「祝福する」を用い、パウロの強調を伝えるため反復も保持した。
- source_word: τοὺς διώκοντας
  choice: あなたがたを迫害する者たち
  rationale: 冠詞付き分詞は「迫害している者たち」を指す。διώκωには「追い求める」の意味もあるが、敵対者への態度を扱う文脈と新約での用法から、ここでは「迫害する」が自然である。目的語「あなたがた」はギリシア語本文では明示されないが、勧告の文脈に即して日本語で補った。
- source_word: καὶ
  choice: （並列による接続）
  rationale: 反復された肯定命令と否定命令を結ぶ単純な接続。日本語では句読点と連用形により自然に表した。
- source_word: μὴ καταρᾶσθε
  choice: 呪ってはいけません
  rationale: μήを伴う現在命令形の禁止。「祝福する」との鮮明な対照を保ちつつ、現代日本語として明快にした。
theological_decisions:
- issue: 文脈における διώκω の意味範囲
  choice: 敵対的に「迫害する」と訳す
  alternative: 「追い求める者たち」
  rationale: διώκω自体には広く「追う」の意味があるが、パウロ書簡および初期キリスト教の倫理的文脈では迫害を表すことが多く、祝福と呪いの対照も敵対的な扱いを想定させる。ただし語彙上の別訳は脚注に残した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「あなたがた」を用いて複数への呼びかけを示し、原文の「祝福しなさい」の反復を保持した。後半は現代語として自然な丁寧体の禁止表現にした。
