id: ROM.12.4
reference: Romans 12:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: ja
  text: というのも、ちょうど一つの体には多くの部分[a]があり、すべての部分が同じ働き[b]をしているわけではないように、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「体の各部」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「機能」または「活動」とも訳せる。ここでは体の比喩に合わせて「働き」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ
  choice: ちょうど…ように
  rationale: 次節で完結する比較を導く語として、ギリシャ語の比較の力を自然な日本語で表した。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の勧めを説明するつながりを明示し、理由・説明を導く接続語の働きを保った。
- source_word: ἐν ἑνὶ σώματι
  choice: 一つの体に
  rationale: 比喩をそのまま保ち、この節だけで教会を指すと説明的に言い換えることを避けた。
- source_word: πολλὰ μέλη
  choice: 多くの部分
  rationale: μέληは身体を構成する諸部分を指す。現代の一般読者に明瞭な「部分」を採用し、古風で教会用語として響きやすい「肢体」は避けた。
- source_word: ἔχομεν
  choice: …があって
  rationale: 直訳の「私たちは…を持っている」よりも、身体の構成を表す自然な日本語とした。意味上の一人称複数は、誰もが共有する身体の比喩の中に保たれている。
- source_word: τὰ δὲ μέλη πάντα
  choice: すべての部分が…わけではない
  rationale: 否定が「すべて」に及ぶこと、すなわち各部分の働きが同一ではないという意味を、日本語で誤解なく表した。
- source_word: πρᾶξιν
  choice: 働き
  rationale: 活動・機能を意味し得る語であり、身体の比喩と異なる賜物を扱う文脈には「働き」が自然に合う。特定の制度的な役職を連想させる「役割」に限定しなかった。
theological_decisions:
- issue: 体の比喩が指すもの
  choice: 「一つの体」と「多くの部分」という比喩をそのまま訳し、この節では教会を明示しない。
  alternative: 「一つの体である教会」のように説明を加える。
  rationale: 教会への適用は次節で明らかになるが、本節はまず身体の類比を提示している。原文の論述の進み方を保ち、本文に説明を持ち込まないため。
- issue: 各部分の働きの相違
  choice: 「すべての部分が同じ働きをしているわけではない」と訳す。
  alternative: 「それぞれに異なる役割がある」と積極的に言い換える。
  rationale: 原文は同一性を否定しているのであって、各部分に一つずつ固定的な役割があるとまでは明言していない。その余地を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「肢体」のような古風な宗教用語を避けた。文末の「ように、」は、比較が次節へ続くという原文の構造を保持している。
