translation:
  language: ja
  text: 奉仕であれば、奉仕に励みなさい。教える人であれば、教えることに励みなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴτε
  choice: 〜であれば
  rationale: 前節から続く賜物・働きの列挙を条件的に示す語として、簡潔で自然な日本語にした。後半では並行関係を明確にするため補って訳した。
- source_word: διακονίαν / ἐν τῇ διακονίᾳ
  choice: 奉仕／奉仕に励み
  rationale: διακονίαの広い意味を保ち、正式な教会職に限定しない「奉仕」とした。ἐν句は省略の多いギリシア語表現であり、その働きに専念する趣旨を自然な日本語の「励み」で表した。
- source_word: ὁ διδάσκων
  choice: 教える人
  rationale: 名詞化された現在分詞の機能的・継続的な響きを保ち、制度上の職名と断定しない表現とした。
- source_word: ἐν τῇ διδασκαλίᾳ
  choice: 教えることに励みなさい
  rationale: διδασκαλίαをこの文脈では教育活動として捉え、前半と並行する勧告が日本語で明確になるようにした。
theological_decisions:
- issue: διακονίαを教会制度上の用語として訳すか
  choice: 奉仕
  alternative: 務め、奉仕の務め
  rationale: 本文は恵みによる働きを列挙しており、正式な役職だけを指すとは限らないため、意味の幅を狭めない訳を選んだ。
- issue: ὁ διδάσκωνを職名として訳すか
  choice: 教える人
  alternative: 教師
  rationale: ギリシア語は行為に携わる人を表す分詞であり、教会の制度的役職と断定せず、その機能に焦点を置いた。
- issue: ἐν句の省略表現をどう補うか
  choice: 〜に励みなさい
  alternative: 〜において
  rationale: ギリシア語の簡潔さを日本語に逐語的に移すと不自然で意味が伝わりにくい。前後の勧告的文脈を踏まえて動詞を補ったが、専念・忠実さの度合いを過度に限定しない表現とした。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある勧告文とした。「ミニストリー」などの専門的・教派的に響きうる語を避け、前節から続く並行構造が明瞭になるよう整えた。
