id: ROM.12.1
reference: Romans 12:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: ja
  text: ですから、兄弟たち[a]、私は神の数々のあわれみによって、あなたがたに勧めます。あなたがたの体を、神に喜ばれる聖なる生きた犠牲として献げなさい。これが、あなたがたの理にかなった礼拝[b]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」という男性形だが、男女を含む共同体全体への呼びかけとして用いられることがある。
    reason: alternative_reading
  - marker: b
    text: 「あなたがたの霊的な礼拝」または「理性的な奉仕」とも訳せる。ギリシア語の表現には、理にかなった、ふさわしい、霊的な礼拝・奉仕という意味の幅がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 勧めます
  rationale: 単なる依頼ではなく、使徒として切実に促す語調を、現代日本語で自然かつ尊厳ある形にした。
- source_word: οὖν
  choice: ですから
  rationale: ローマ1—11章を受けた推論と勧告のつながりを明示する。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数呼格を本文に保ちつつ、共同体全体を含み得ることは脚注で示した。
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: 神の数々のあわれみによって
  rationale: διά＋属格の根拠・媒介の幅を残し、οἰκτιρμῶνの複数形も「数々の」で表した。
- source_word: παραστῆσαι τὰ σώματα ὑμῶν
  choice: 自分の体を…献げなさい
  rationale: παρίστημιの提示・供献の意味を、犠牲の文脈に合う自然な日本語で表し、σώματαを抽象化せず「体」とした。
- source_word: θυσίαν ζῶσαν
  choice: 生きた犠牲
  rationale: 死を伴う通常の犠牲との逆説的な対照をそのまま保った。
- source_word: ἁγίαν
  choice: 聖なる
  rationale: 神のために取り分けられた性質を表す標準的な訳語。
- source_word: εὐάρεστον τῷ θεῷ
  choice: 神に喜ばれる
  rationale: 単に許容されるという弱い響きを避け、神に喜ばれるという積極的意味を表した。
- source_word: λογικὴν λατρείαν
  choice: 理にかなった礼拝
  rationale: λογικόςの理性的・ふさわしい・霊的という意味の幅のうち、過度に一方向へ限定しない近接訳を本文に採り、別訳を脚注に残した。
theological_decisions:
- issue: 混合された共同体への呼びかけとしてのἀδελφοί
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／皆さん
  rationale: 文法上の男性形を本文で保持する一方、この呼称が女性を含む共同体全体に及び得ることを脚注で明示した。
- issue: λογικὴν λατρείανの解釈
  choice: 理にかなった礼拝
  alternative: 霊的な礼拝／理性的な奉仕
  rationale: 理性に即した、ふさわしい、霊的な、という解釈上の幅を一つに固定せず、本文は比較的形式的な訳とし、主要な別訳を脚注に示した。
- issue: 体を犠牲として献げる比喩
  choice: 自分の体を…生きた犠牲として献げなさい
  alternative: 自分自身を…献げなさい
  rationale: 全人格的献身を含意し得るが、原文の具体的な「体」を一般化せず、犠牲・礼拝の緊張ある比喩を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告としての厳粛さと犠牲・礼拝の祭儀的語感を保った。「あわれみ」は聖書語として理解可能であり、複数形を「数々の」で明示した。
