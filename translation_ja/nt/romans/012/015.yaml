id: ROM.12.15
reference: Romans 12:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χαίρειν μετὰ ⸀χαιρόντων, κλαίειν μετὰ κλαιόντων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: ja
  text: 喜ぶ人たちと共に喜び[a]、泣く人たちと共に泣きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「喜んでいる人たちと共に喜び、泣いている人たちと共に泣きなさい」。
    reason: 現在分詞の継続的な響きを明示する訳も可能であるため。
lexical_decisions:
- source_word: χαίρειν
  choice: 喜び
  rationale: 現在能動不定詞だが、勧告が連なる文脈では命令的な働きをする。日本語では後半の「泣きなさい」と結んで、一続きの自然な勧めとして表した。
- source_word: μετὰ
  choice: 〜と共に
  rationale: 属格を伴い、関わりや同伴を示す。「〜と共に」は意味を明確に保ちつつ、簡潔で自然である。
- source_word: χαιρόντων
  choice: 喜ぶ人たち
  rationale: 現在能動分詞の属格複数が名詞的に用いられている。一般的な複数を自然な現代日本語で表した。
- source_word: κλαίειν
  choice: 泣きなさい
  rationale: 現在能動不定詞だが、勧告の文脈に即して命令として訳した。「泣く」は悲しみを実際に共にする行為を直接表し、「嘆く」より原語の基本的な動作性を保つ。
- source_word: κλαιόντων
  choice: 泣く人たち
  rationale: 現在能動分詞の属格複数を名詞的に理解した。「喜ぶ人たち」との対句と並行性を保った。
theological_decisions:
- issue: 勧告の連続における不定詞の命令的用法
  choice: 二つの不定詞を一続きの命令・勧告として訳す
  alternative: 「喜ぶ人たちと共に喜ぶこと、泣く人たちと共に泣くこと」
  rationale: ギリシア語の形は不定詞だが、ローマ12章9～21節では勧告が連なっており、ここでも指示・命令の力を持つ。日本語では前半を連用形、後半を「〜なさい」とし、原文の並行性と自然な勧告調を両立させた。
translation_notes:
  register: 明快で格調を失わない現代標準日本語。二つの句の対称性を保ち、「共に」を用いて単なる観察ではなく同伴を表した。
