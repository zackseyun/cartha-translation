  source_fidelity: ギリシア語の二つの不定詞を、前後の勧告の連続に即して命令・勧告として適切に表している。「〜と共に」は属格を伴うμετάの सहभाग・同伴をよく伝え、「喜ぶ人たち／泣く人たち」の対句も原文の並行性を保つ。
  naturalness: 「喜ぶ人たちと共に喜び、泣く人たちと共に泣きなさい」は明快な現代標準日本語であり、前半を連用形、後半を終止的な勧告形にすることで、日本語として不自然に命令を重ねずに二項を結んでいる。
