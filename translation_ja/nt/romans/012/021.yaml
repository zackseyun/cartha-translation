  text: μὴ νικῶ ὑπὸ τοῦ κακοῦ, ἀλλὰ νίκα ἐν τῷ ἀγαθῷ τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/021.yaml
  text: Do not be overcome by evil[a], but overcome evil with good.
translation:
  language: ja
  text: 悪に打ち負かされてはいけません。[a] むしろ、善によって悪に打ち勝ちなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悪であるものに打ち負かされてはいけません。むしろ、善であるものによって悪であるものに打ち勝ちなさい」とも訳せる。ギリシア語では冠詞の付いた中性の形容詞が用いられており、抽象的な「悪」「善」とも、「悪であるもの」「善であるもの」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: 打ち負かされてはいけません
  rationale: μήを伴う現在受動命令として、悪に敗北し支配されることを禁じる意味を自然な現代日本語で表した。後半の能動命令「打ち勝ちなさい」との語義上の対応も保っている。
- source_word: ὑπὸ τοῦ κακοῦ
  choice: 悪に
  rationale: ὑπό＋属格が受動文の作用者・原因を示す。冠詞付き中性形は抽象的な「悪」または「悪いもの」と解せるが、本文では簡潔で自然な「悪」とした。
- source_word: ἀλλὰ νίκα
  choice: むしろ、…打ち勝ちなさい
  rationale: ἀλλάの強い対照を「むしろ」で示し、現在能動命令νίκαを継続的な倫理的命令として自然に訳した。前半の「打ち負かされる」と勝敗の比喩を共有する。
- source_word: ἐν τῷ ἀγαθῷ
  choice: 善によって
  rationale: ἐν＋与格を手段の用法と捉え、悪に勝つ手段が善であることを明確にした。「善をもって」も可能だが、「善によって」のほうが明快な現代標準語である。
- source_word: τὸ κακόν
  choice: 悪に
  rationale: 冠詞付き中性単数を一般的・抽象的な道徳カテゴリーとして訳した。特定の人格的存在を指すとは限定せず、前半との反復を保った。
theological_decisions:
- issue: κακός／ἀγαθόςを人格化するか、抽象的な道徳カテゴリーとして訳すか
  choice: 「悪」「善」という抽象的な道徳カテゴリー
  alternative: 「悪いもの」「善いもの」、または人格化した「悪しき者」
  rationale: いずれも中性形であり、直近の文脈は加害や報復に対する倫理的応答を扱っている。人格的な「悪しき者」、特にサタンへの限定は統語上必須ではないため避け、原文が許す「悪いもの／善いもの」という含みは脚注で示した。
- issue: ἐν τῷ ἀγαθῷの意味関係
  choice: 手段を表す「善によって」
  alternative: 領域・状態を表す「善のうちに」
  rationale: ここでは、悪に打ち勝つための手段として善を示す理解が文脈と対句に最もよく適合する。ただしギリシア語ἐνの基本的な幅を過度に説明的な訳で狭めないよう、簡潔に訳した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「打ち負かされる／打ち勝つ」によって原文のνικάωの反復と受動・能動の対照を再現した。敬体を用い、命令は強さを保ちつつ一般読者に自然な表現とした。
