  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: ja
  text: 勧める人は、その勧めに励みなさい[a]。分け与える人は、惜しみなく分け与えなさい[b]。指導する人は、熱心に指導しなさい[c][d]。憐れみを示す人は、喜んで憐れみを示しなさい[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「励ます人は、その励ましに励みなさい」。原語の動詞と名詞は、勧告と励ましの両方を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「分け与える人」は「与える人」「施す人」とも訳せる。また「惜しみなく」は「誠実に」「純一な心で」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「指導する人」は「治める人」「世話をする人」「管理する人」とも訳せる。
    reason: lexical_alternative
  - marker: d
    text: 「熱心に」は「勤勉に」「真剣に」とも訳せる。
    reason: lexical_alternative
  - marker: e
    text: 「喜んで」は「明るい心で」「進んで」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ παρακαλῶν … ἐν τῇ παρακλήσει
  choice: 勧める人は、その勧めに専念し
  rationale: 動詞と同根名詞の反復を「勧める／勧め」で示した。語義には励ましや慰めも含まれるため、別訳を脚注に残した。「専念し」は省略の多いギリシア語の列挙を自然な日本語にするための補足である。
- source_word: ὁ μεταδιδοὺς
  choice: 分け与える人
  rationale: 自分の持つものを他者と共有するという μεταδίδωμι のニュアンスを表し、単なる「与える」より原語の含意を保った。
- source_word: ἐν ἁπλότητι
  choice: 惜しみなく
  rationale: 分け与える行為との結び付きから、ここでは寛大さを表す可能性が高い。日本語では「惜しみなく」が自然であるが、誠実さ・純一さの語義も脚注に示した。
- source_word: ὁ προϊστάμενος
  choice: 指導する人
  rationale: 先頭に立つこと、世話や管理をすることを含み得るが、特定の教会職制に限定せず、広い指導の働きとして訳した。
- source_word: ἐν σπουδῇ
  choice: 熱心に
  rationale: σπουδή の熱意、真剣さ、勤勉さを簡潔で自然な日本語で表した。
- source_word: ὁ ἐλεῶν
  choice: 憐れみを示す人
  rationale: 単なる感情ではなく、憐れみに基づく能動的な行為を表す分詞の性格を保持した。
- source_word: ἐν ἱλαρότητι
  choice: 喜んで
  rationale: 明るさや喜ばしい心、進んで行う態度を表す ἱλαρότης を、行為に自然につながる副詞句で訳した。
theological_decisions:
- issue: προϊστάμενος の範囲
  choice: 一般的に「指導する人」と訳す
  alternative: 「治める人」「管理する人」、または特定の教会役職者
  rationale: 本文は明示的な役職名を使わず、恵みによる働きを分詞で列挙している。特定の教会制度に限定せず、原文の広がりを保った。
- issue: 分け与える際の ἁπλότης
  choice: 寛大さを表す「惜しみなく」
  alternative: 「誠実に」「純一な心で」
  rationale: 直接の文脈が資源を分け与える行為なので寛大さが最も自然だが、動機の純粋さという可能性を排除せず脚注に示した。
- issue: 命令表現の補足
  choice: 各働きを継続して行うよう促す文として訳す
  alternative: 「勧めなら勧めにおいて」のように省略をそのまま残す
  rationale: ギリシア語は前節から続く省略的な列挙で、明示された命令動詞はない。日本語として文を成立させるため「専念し」「行いなさい」などを補ったが、新たな役職や条件は加えていない。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準語とした。原文の簡潔な並列を保ちつつ、日本語として命令の流れが分かるよう最小限の述語を補った。「憐れみ」は聖書的な重みを保ちながら現代の読者にも理解できる表記とした。
