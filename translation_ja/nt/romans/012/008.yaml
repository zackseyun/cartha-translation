  rationale: 原文は前節から続く省略的な並列であるため、日本語としては勧告を補う必要がある。各節を「…しなさい」とそろえ、原文の各分詞が表す行為を明示して、不自然な「喜んで行いなさい」を解消した。「励みなさい」はἐν τῇ παρακλήσειの「勧めという働きにおいて」という含意を自然な日本語で表す補いであり、特定の職制や教義的解釈を加えるものではない。
