id: ROM.12.20
reference: Romans 12:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: ja
  text: しかし、あなたの敵が飢えているなら、食べ物を与えなさい。渇いているなら、飲み物を与えなさい。なぜなら、そうすることによって、あなたはその人の頭の上に燃える炭火[a]を積むことになるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「火の炭」。この比喩は、悔い改めに至る恥、痛切な良心の責め、あるいは迫る裁きを示すとも考えられます。本文ではギリシア語の比喩をそのまま残しています。
    reason: 語句の直訳と、解釈が分かれる比喩であることを示すため。
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: むしろ、…なら
  rationale: ἀλλάが直前の復讐の禁止と対照をなし、ἐάνが条件を示すため。「むしろ」で、敵に報復する代わりに善を行うという対照を自然に表した。
- source_word: πεινᾷ
  choice: 飢えている
  rationale: 条件節中の現在形。「空腹である」よりも簡潔で格調を保ちつつ、現代日本語として明瞭である。
- source_word: ὁ ἐχθρός σου
  choice: あなたの敵
  rationale: 定冠詞付き単数名詞と所有代名詞を自然に訳し、単数も保持した。
- source_word: ψώμιζε
  choice: 食べさせなさい
  rationale: 食物を与えることを命じる現在命令形。具体的な行為を平明な現代日本語で表した。
- source_word: διψᾷ
  choice: 渇いている
  rationale: 身体的な渇きを表す現在形。日本語では主語を繰り返さずとも敵を指すことが明らかである。
- source_word: πότιζε
  choice: 飲ませなさい
  rationale: 飲み物を与えることを表す命令形。原文が水に限定していないため、「水を飲ませなさい」とはしなかった。
- source_word: τοῦτο γὰρ ποιῶν
  choice: そうすることで、…からです
  rationale: 分詞の手段的な関係とγάρの理由・説明の働きを、自然な日本語の因果構文で表した。
- source_word: ἄνθρακας πυρὸς
  choice: 燃える炭火
  rationale: 直訳的には「火の炭」だが、不自然な硬さを避けつつ、具体的な比喩を保った。
- source_word: σωρεύσεις
  choice: 積むことになる
  rationale: 未来能動直説法の結果的な響きを保つ表現。「積み上げる」より簡潔で、比喩にも自然に合う。
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: その人の頭の上に
  rationale: 具体的な位置表現を保持した。「彼」を避けて、敵を指すことが明瞭な自然な日本語とした。
theological_decisions:
- issue: 「頭の上に燃える炭火を積む」という比喩の意味
  choice: 本文では比喩を解釈せず、そのまま保持する。
  alternative: 悔い改めに至る恥、痛切な良心の責め、または神の裁きを直接意味するものとして訳文に織り込む。
  rationale: この比喩の意味には複数の有力な理解があり、原文自体は一つに明示していない。訳文で解釈を決めず、神学的緊張と曖昧さを保った。
translation_notes:
  register: 平明な現代標準日本語を用いながら、命令形には「なさい」を用いて聖書本文にふさわしい品位を保った。敵を受ける代名詞は「その人」とし、自然さと明瞭さを優先した。
