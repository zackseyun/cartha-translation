  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: ja
  text: 愛には偽善があってはなりません。[a] 悪を忌み嫌い、善に固く結びつきなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「愛は偽善のないものでありなさい」。ギリシア語は直訳すると「偽善のない愛」で、動詞はありません。
    reason: 語義上の別訳と、原文が動詞を欠く名詞句であることを示すため。
lexical_decisions:
- source_word: ἀγάπη
  choice: 愛
  rationale: 現代日本語で自然かつ広い倫理的意味を保ち、文脈上のキリスト者相互の愛を不必要に限定しない。
- source_word: ἀνυπόκριτος
  choice: 偽りがあってはなりません
  rationale: 語の中心的意味である「偽善的でない、演じられたものでない」を平明に表す。ギリシア語は動詞を欠くが、勧告の文脈に即して命令的に補った。
- source_word: ἀποστυγοῦντες
  choice: 憎み
  rationale: 悪に対する強い嫌悪を簡潔に表す。「忌み嫌い」も可能だが、本文では明瞭で一般的な「憎む」を用いた。
- source_word: τὸ πονηρόν
  choice: 悪
  rationale: 実体詞的な中性形を、特定の一行為に狭めず、包括的な道徳カテゴリーとして訳した。
- source_word: κολλώμενοι
  choice: 固く結びつきなさい
  rationale: 接着するほど密着するという動詞の強さを保つ。「従う」よりも原語の結合・固着の比喩を明確に伝える。
- source_word: τῷ ἀγαθῷ
  choice: 善
  rationale: 実体詞的な中性形を「悪」と対照的に簡潔に訳し、包括的な善を示す。
theological_decisions:
- issue: 動詞のない冒頭句と二つの分詞が持つ勧告の力
  choice: 一連の勧告として「愛には……あってはなりません。悪を憎み、善に……なさい」と訳す。
  alternative: 「偽りのない愛。悪を憎み、善に結びついていて」のように、断片的な構文をそのまま残す。
  rationale: ローマ12章の勧告の連なりの中で、これらは実質的に命令・勧告として機能する。日本語ではその力を明示するほうが著者の意図を自然に伝えられる。
- issue: ἀνυπόκριτος の表現
  choice: 「偽りがあってはなりません」として、愛が見せかけでないことを表す。
  alternative: 「愛は真実なものでありなさい」または「愛には偽善があってはなりません」。
  rationale: 「真実」は滑らかだが原語の「演じること・偽善」の否定をやや一般化する。「偽り」は日常的で明瞭であり、特定の宗派的理解を加えない。
translation_notes:
  register: 平明な現代標準日本語を用いながら、勧告としての品位と強さを保った。「です・ます」調で統一し、「善に固く結びつく」により原語の密着の比喩を残した。
