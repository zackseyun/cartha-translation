revisions:
- from: 実に、私は、自分に与えられた恵みによって、あなたがたの中にいる一人ひとりに言います。自分を、評価すべき以上に高く評価してはなりません。むしろ、神が一人ひとりに分け与えられた信仰の量り[b]に応じて、健全な判断をしなさい[a]。
  to: というのも、私は、自分に与えられた恵みによって、あなたがたの中にいる一人ひとりにこう言います。自分を、評価すべき以上に高く評価してはなりません。むしろ、神が一人ひとりに分け与えた信仰の分量[b]に応じて、健全な判断をしなさい[a]。
  rationale: γάρ の説明的機能を「というのも」で自然に表し、「私は、」の不必要な読点を整えた。「信仰の量り」を明瞭な現代語の「信仰の分量」に改めたが、μέτρον の「尺度」という可能性と πίσττις の語義上の幅は脚注で保持した。その他の構文、勧告の調子、神学的曖昧さは維持している。
