    rationale: 「量り」はこの意味ではやや古風で、clear modern standard Japanese の目標に適しにくい。「信仰の分量」は、μέτρον の量的側面と神による分配を自然に表せる。脚注に「信仰の尺度」を残して、基準・尺度の可能性も示す。
