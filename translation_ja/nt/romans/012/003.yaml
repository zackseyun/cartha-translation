id: ROM.12.3
reference: Romans 12:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: ja
  text: というのも、私は、自分に与えられた恵みによって、あなたがたの中にいる一人ひとりにこう言います。自分を、評価すべき以上に高く評価してはなりません。むしろ、神が一人ひとりに分け与えた信仰の分量[b]に応じて、健全な判断をしなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「慎み深く考えなさい」または「節度ある考え方をしなさい」。
    reason: σωφρονεῖνには、健全な判断、分別、自制、慎み深さという重なり合う含みがあるため。
  - marker: b
    text: 別訳「信仰の尺度」。また、「信頼の分量」あるいは「忠実さの分量」の可能性もある。このギリシア語句は、神から与えられた、信仰に関わる分量や尺度を指し得るが、その厳密な意味までは特定していない。
    reason: μέτρονは分量と尺度の双方を、πίστιςは信仰、信頼、忠実さを意味し得るため。
lexical_decisions:
- source_word: Λέγω γὰρ
  choice: 実に、私は……言います
  rationale: γάρが前の勧めを受けて説明を加える働きを示しつつ、単独でも不自然にならない現代日本語とした。
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: 自分に与えられた恵みによって
  rationale: διά＋属格の手段・根拠の意味を保ち、パウロに授けられた恵みを明示した。
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: あなたがたの中にいる一人ひとりに
  rationale: παντίの個別的・包括的な力と共同体内の全員への呼びかけを自然に表した。
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: 自分を、評価すべき以上に高く評価してはなりません
  rationale: 自己評価について定められた限度を越えないよう求める意味を明確にし、φρονέωの認識・評価の含みを保った。
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: むしろ……健全な判断をしなさい
  rationale: φρονέω／σωφρονέωの語遊びを日本語で完全には再現できないため、節度があり分別ある自己認識という中心的意味を明瞭に示した。
- source_word: ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν
  choice: 神が一人ひとりに分け与えられた……に応じて
  rationale: 神を分配の主体として保ち、ἑκάστῳの個別的分配とὡςの基準・対応関係を表した。
- source_word: μέτρον πίστεως
  choice: 信仰の量り
  rationale: μέτρονの分量・尺度の両義性とπίστιςの幅を狭めずに残すため、やや聖書的だが理解可能な『量り』を採用した。
theological_decisions:
- issue: μέτρον πίστεως の意味
  choice: 「信仰の量り」とし、神が分け与える信仰に関わる量・尺度という広がりを保つ
  alternative: 「信仰の度合い」「信仰という尺度」「信頼／忠実さの分量」
  rationale: 直後の賜物の文脈は奉仕のための能力や範囲を示唆し得るが、本文自体は救いの信仰、賜物に応じた能力、判断の規準のいずれかに限定していないため。
- issue: σωφρονεῖν の倫理的・知的含意
  choice: 「健全な判断をする」
  alternative: 「慎み深く考える」「節度ある考え方をする」
  rationale: 謙遜だけに狭めず、分別、自制、正気で適切な自己評価を行うという含みを示すため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、使徒的権威を示す「恵みによって」と、自己評価への厳粛な勧告にふさわしい品位を保った。長いギリシア語文は日本語で二文に分け、論理関係を明確にした。「信仰の量り」は通常の会話より聖書的な表現だが、原文の神学的曖昧さを不用意に解消しないため採用した。
