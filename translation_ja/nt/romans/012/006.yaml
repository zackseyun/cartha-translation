source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: ja
  text: 私たちは、与えられた恵みに応じて、異なる賜物を持っています。預言であれば、信仰に応じて[a]預言しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の信仰の度合いに応じて」とも訳せる。あるいは、「キリスト教信仰の内容にかなって」の意味とも考えられる。ギリシア語の表現は、語る人に与えられた信仰の度合いを指す場合と、キリスト教信仰の内容との一致を指す場合の、どちらにも解し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: 私たちは……持っています
  rationale: 分詞は前節から続く文脈を受ける。日本語では独立した叙述として自然にし、δὲの弱い移行は文脈に委ねた。
- source_word: χαρίσματα
  choice: 賜物
  rationale: パウロ書簡における神から与えられた恵みの働きを示す定着した表現であり、後続する「恵み」との語義的なつながりも保てる。
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: 与えられた恵みに応じて
  rationale: κατάが表す対応・基準を「応じて」で示し、χάριςを神からの恵みとして簡潔に訳した。
- source_word: διάφορα
  choice: それぞれ異なる
  rationale: 賜物の多様性を自然な現代日本語で表した。
- source_word: εἴτε προφητείαν
  choice: 預言であれば
  rationale: 省略を含む列挙の開始を、日本語で明瞭かつ簡潔に表した。
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: 信仰に応じて
  rationale: ἀναλογίαの比例・対応という幅を保ち、πίστιςが本人の信仰を指すか、信仰内容を指すかを本文で限定しない表現とした。
theological_decisions:
- issue: κατὰ τὴν ἀναλογίαν τῆς πίστεως の意味
  choice: 信仰に応じて
  alternative: 自分の信仰の度合いに応じて／その信仰に即して
  rationale: ギリシア語は、預言する人に与えられた信仰の度合いとの釣り合いとも、キリスト教信仰の内容との一致とも解し得る。本文では曖昧さを保ち、主要な解釈を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「恵み」「賜物」「預言」「信仰」という聖書上重要な語を保持した。原文の省略された勧告は、日本語として文を完結させるため「預言しなさい」と補った。
