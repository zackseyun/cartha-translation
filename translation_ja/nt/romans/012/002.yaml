- from: また、この時代[a]に同調してはなりません。むしろ、心が新たにされることによって自分を変えていただきなさい。そうすれば、何が神のみこころであるか、すなわち、何が良いことで、神に喜ばれ[c]、完全であるかを見分ける[b]ことができます。
  to: また、この時代[a]に同調してはなりません。むしろ、心が新たにされることによって、変えられていきなさい。そうすれば、神のみこころ、すなわち、良い、神に喜ばれ[c]、完全なものが何かを見分ける[b]ことができます。
