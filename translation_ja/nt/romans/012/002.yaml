id: ROM.12.2
reference: Romans 12:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: ja
  text: また、この時代[a]に同調してはなりません。むしろ、心が新たにされることによって、変えられていきなさい。そうすれば、神のみこころ、すなわち、良い、神に喜ばれ[c]、完全なものが何かを見分ける[b]ことができます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この世」。ギリシア語は、より厳密には「時代」を意味し、現在の秩序や時代を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「神のみこころが何であるかを吟味して確かめる」。このギリシア語動詞には、吟味したうえで良いと認めるという意味もあります。
    reason: lexical_alternative
  - marker: c
    text: 「喜ばれ」は、神に喜ばれるという意味に理解できます。別訳「受け入れられる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: 同調してはなりません
  rationale: 外から与えられる型に自らを合わせることへの禁止を、現代日本語で自然に表し、μεταμορφοῦσθεとの対照も保つ。受動・中動の含みを過度に限定しない。
- source_word: αἰῶνι τούτῳ
  choice: この時代
  rationale: 被造世界そのものではなく、現在の時代・秩序を指す語義を優先した。「この世」も可能なので脚注に示す。
- source_word: μεταμορφοῦσθε
  choice: 自分を変えていただきなさい
  rationale: 深い変容を表す現在受動命令の意味を明確にし、変化の主体を人間だけに限定しない日本語とした。
- source_word: τῇ ἀνακαινώσει τοῦ νοός
  choice: 心が新たにされることによって
  rationale: 与格を手段として取り、νοῦςを思考・判断・道徳的認識を含む「心」と訳した。文脈上の所有関係は「心」により自然に含意される。
- source_word: εἰς τὸ δοκιμάζειν
  choice: 見分けることができます
  rationale: 目的・結果を表す構文として訳し、δοκιμάζωの吟味して認める含みを読みやすい「見分ける」で表した。より明示的な訳は脚注に示す。
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: 何が神のみこころであるか
  rationale: 疑問詞τίを保ち、神の意志を指す日本語として広く理解される「みこころ」を用いた。
- source_word: ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον
  choice: 何が良いことで、神に喜ばれ、完全であるか
  rationale: 三つの形容語を神のみこころの内容・性質を説明する同格として表した。εὐάρεστονの喜ばせる相手は文脈上神と理解されるが、文法上明示されないため脚注を付した。
theological_decisions:
- issue: 倫理的対照におけるαἰώνの訳
  choice: この時代
  alternative: この世／今の世の秩序
  rationale: 時間的・倫理的な現在の秩序というパウロの対照を保ち、被造世界そのものを否定する意味を持ち込まないため。
- issue: δοκιμάζεινと神のみこころの関係
  choice: 見分ける
  alternative: 吟味して確かめる／吟味し、良いと認める
  rationale: 人が神のみこころを裁くという印象を避けつつ、新たにされた心がそれを吟味し、認識し、是認するという語の幅を保つため。
- issue: μεταμορφοῦσθεの受動の扱い
  choice: 自分を変えていただきなさい
  alternative: 変えられなさい／変わりなさい
  rationale: 神による変容を示唆する受動の力と、命令として受け手に求められる応答の緊張を、日本語で不自然にならない範囲で保持するため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。敬体を用い、伝統的な「この世と同じ形になってはいけません」より簡潔な「同調」を採用した。神的受動を保つため「変えていただきなさい」とし、三形容詞の同格関係は日本語で意味が通るよう補足的に展開した。すべての脚注記号を本文中に配置した。
