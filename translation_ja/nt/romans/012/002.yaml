    rationale: 「自分を変えていただきなさい」は「いただく」によって行為者を敬意をもって暗示し、かつ「自分を変える」よう依頼する構文にも読める。原文は行為者を明示しない受動命令であるため、「変えられていきなさい」のほうが安全で自然である。
  - severity: medium
    issue: 末尾の三形容詞と「神のみこころ」の同格関係が日本語でやや曖昧である。
    rationale: 「何が良いことで…完全であるか」は、神のみこころの内容を問うようにも読める。原文では「神のみこころ」が「良い、神に喜ばれる、完全なもの」として説明されるため、「神のみこころ、すなわち…ものが何か」と明示する。
