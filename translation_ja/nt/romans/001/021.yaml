id: ROM.1.21
reference: Romans 1:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: ja
  text: というのも、彼らは神を知っていたにもかかわらず、神を神としてあがめることも、感謝することもせず、かえって、その思いにおいてむなしいものとなり、彼らの理解のない心は暗くなったからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διότι
  choice: （前節から続く理由説明として訳文全体に反映）
  rationale: 前節の主張の根拠を示す接続語。単独節として不自然な「というのは」を置かず、論理的つながりは文脈に委ねた。
- source_word: γνόντες τὸν θεὸν
  choice: 神を知っていたにもかかわらず
  rationale: アオリスト分詞の文脈上の譲歩的な力を明確にし、神を知りながら正しく応答しなかった対照を保った。
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: 神を神としてあがめることも…せず
  rationale: ὡς θεόν の資格・立場を示す意味を保持し、δοξάζω は神に向けた文脈で自然かつ重みのある「あがめる」とした。
- source_word: ἢ ηὐχαρίστησαν
  choice: 感謝することもせず
  rationale: 神への感謝が目的語として文脈上明らかなので、自然な日本語として目的語を補わずに表現した。
- source_word: ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: その思いはむなしくなり
  rationale: 受動形が表す状態変化を「むなしくなり」で保ち、διαλογισμοί の思考・推論を含む幅を、日常的で過度に限定しない「思い」で表した。
- source_word: ἐσκοτίσθη
  choice: 暗くなった
  rationale: 道徳的・知的な暗化の比喩を保ちつつ、日本語では自然な状態変化として表した。
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: 理解のない彼らの心
  rationale: ἀσύνετος を単なる知能の低さや軽率さに狭めず、「理解を欠く」という原義に近く訳した。καρδία の単数形も「心」の単数で保持した。
theological_decisions:
- issue: γνόντες の譲歩的解釈
  choice: 神を知っていたにもかかわらず
  alternative: 神を知りながら／神を知ったのに
  rationale: 文脈は、神についての認識があったにもかかわらず、それにふさわしい応答をしなかった責任を強調する。知識の性質や範囲を本文以上に教理的に限定しない。
- issue: ἐματαιώθησαν と ἐσκοτίσθη の受動態
  choice: むなしくなり／暗くなった
  alternative: むなしくされ／暗くされた
  rationale: ギリシア語の受動形は認めつつ、行為者が明示されていないため、日本語で神を暗黙の行為者として強く示す表現を避け、原因に関する曖昧さを保った。
translation_notes:
  register: 現代標準日本語による、明瞭で品位のある聖書文体。「あがめる」は一般読者にも理解でき、神に栄光を帰す意味を自然に伝える。「理解のない」はやや直訳的だが、道徳的・知的識別の欠如という原文の幅を保つ。
