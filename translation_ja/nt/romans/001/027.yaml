id: ROM.1.27
reference: Romans 1:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: ja
  text: 同じように、男性たちも女性との自然な関係を捨て、互いに対する欲望に燃え上がり、男性たちが男性たちと恥ずべきことを行い、自分たちの迷いに対して当然受けるべき報いを、その身に受けました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: 男性たち／女性
  rationale: 性別を明示するギリシア語の対照を保ちつつ、現代日本語で自然な表現とした。
- source_word: ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας
  choice: 女性との自然な関係を捨て
  rationale: χρῆσις の字義は「使用」だが、ここでは性的関係を指すため、「関係」とすることで意味を明確にしつつ、不必要に露骨な表現を避けた。属格は文脈上「女性との」と表現した。
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους
  choice: 互いに対する欲望に燃え上がり
  rationale: ἐξεκαύθησαν の火の比喩と、ὄρεξις の「欲望」を保持した。受動形は日本語では自動詞的に訳すのが自然である。
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: 男性が男性と
  rationale: 原文の反復と性別を明示する語感を保った。
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: 恥ずべきことを行い
  rationale: ἀσχημοσύνη の道徳的評価を保持し、具体的内容を原文以上に限定しない表現とした。
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: 当然伴う報い
  rationale: ἀντιμισθία の対応する返報・報いと、ἔδει の必然性ないし相応しさを簡潔に表した。「罰」と断定せず、語の返報的な幅を残した。
- source_word: τῆς πλάνης αὐτῶν ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: 自分たちの迷いに…その身に受けました
  rationale: πλάνη の逸脱・迷いという像と、ἐν ἑαυτοῖς の自己の内・身において受けるという再帰的意味を保った。
theological_decisions:
- issue: 性別を明示する語を関係的・社会的な語へ弱めるか
  choice: 男性たち／女性／男性が男性と
  alternative: 男たち／女／男が男と、または夫／妻に相当する関係語
  rationale: 原文はἀνήρ・γυνήではなく、性別を示すἄρσην・θῆλυ系の語を用いるため、その区別を保った。
- issue: ἀσχημοσύνηの道徳的評価をどこまで具体化するか
  choice: 恥ずべきこと
  alternative: みだらな行為、同性愛行為
  rationale: 原文の否定的評価は明示する一方、原文にない分類語や具体化は加えなかった。
- issue: ἀντιμισθία ἣν ἔδειを「罰」と断定するか
  choice: 当然伴う報い
  alternative: 当然の罰、受けるべき報い
  rationale: 文脈上は否定的な結果だが、ἀντιμισθία自体の「対応する返報」という幅と、ἔδειの必然・相応の含みを残した。
- issue: ἐν ἑαυτοῖςが示す受領の仕方を特定するか
  choice: その身に受けました
  alternative: 自分たちの内に受けました／互いの間で受けました
  rationale: 再帰的意味を示しつつ、身体的・心理的・社会的など、報いの具体的形態を本文以上に決めなかった。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体。ギリシア語の一文構造を日本語として読める範囲で保ち、道徳的な強さを弱めず、同時に原文以上の具体化を避けた。
