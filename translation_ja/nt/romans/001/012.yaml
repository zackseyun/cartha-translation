reference: Romans 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν συμπαρακληθῆναι ἐν ὑμῖν διὰ τῆς ἐν ἀλλήλοις πίστεως ὑμῶν τε καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/012.yaml
  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: ja
  text: つまり、あなたがたの間で、あなたがたと私が互いに持つ信仰によって、ともに励まされることです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「つまり、あなたがたの間で、あなたがたと私の双方の信仰によって、私があなたがたとともに励まされることです。」
    reason: ギリシア語の不定詞には主語が明示されていないが、前後の文脈からパウロを主語として理解することができるため。
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: つまり
  rationale: 直前の発言を説明し直す表現として、現代日本語で自然かつ明確に訳した。
- source_word: συμπαρακληθῆναι
  choice: ともに励まされること
  rationale: 接頭辞 συν- の共同・相互の含意と、παρακαλέω の励ましの意味を保つ。ギリシア語の不定詞には明示的な主語がないため、日本語でも主語を補いすぎない表現とした。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: ローマの信徒たちのただ中で起こる共同の励ましという、場所的・社会的意味を表す。
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: あなたがたと私、双方の信仰を通して
  rationale: διὰ の手段を「通して」で示し、ἐν ἀλλήλοις の相互性を後続の「あなたがたと私、双方」に結びつけて自然な日本語にした。
- source_word: πίστεως
  choice: 信仰
  rationale: ここでは神への信頼・信仰を指し、「忠実さ」より「信仰」が文脈に適する。
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: あなたがたと私、双方の
  rationale: ローマの信徒たちとパウロの両方を均衡して示し、相互性を明確にする。
theological_decisions:
- issue: 励ましが一方向か相互的か
  choice: パウロとローマの信徒たちがともに励まされるという相互性を示す
  alternative: パウロだけが彼らの信仰によって励まされると明示する
  rationale: συμπαρακληθῆναι の共同性と「あなたがたと私、双方」という結びが相互の励ましを示す。一方で不定詞の暗黙の主語には解釈の余地があるため、本文では日本語上の主語を明示せず、脚注で別訳を示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「相互に励まされる」より自然な「ともに励まされる」を用い、原文にない主語を本文で固定しないことで統語上の曖昧さを保った。
