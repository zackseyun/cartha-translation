  text: Claiming to be wise[a], they became fools[b],
translation:
  language: ja
  text: 自分は知恵があると主張しながら[a]、愚か者となりました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分は知恵があると公言しながら」。
