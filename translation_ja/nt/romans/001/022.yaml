lexical_decisions:
- source_word: φάσκοντες
  choice: 称えながら
  rationale: 自分についてそう言い張る、または公言するという現在分詞の意味を、現代日本語で自然に表した。文脈上の皮肉を保ち、内容を付け加えていない。
- source_word: εἶναι
  choice: だと
  rationale: φάσκοντεςの主張内容を示す不定詞を、日本語の引用表現として簡潔に表した。
- source_word: σοφοὶ
  choice: 知恵ある者
  rationale: 述語形容詞の評価的意味を保ちつつ、後半の「愚か者」との人物を指す鋭い対比を明確にした。
- source_word: ἐμωράνθησαν
  choice: 愚か者となりました
  rationale: アオリスト受動形の、愚かな状態に至ったという結果的・起動的な意味を自然に表し、前半との修辞的対照を保った。
theological_decisions:
- issue: ἐμωράνθησανを、性質の変化として「愚かになった」とするか、人物を指す強い表現として「愚か者となった」とするか
  choice: 愚か者となりました
  alternative: 愚かになりました／愚かにされました
  rationale: σοφοὶとの対照とパウロの鋭い皮肉を保つため、人物を指す表現を採用した。一方、神的受動か自発的変化かを本文で断定しないよう、「された」とは訳さなかった。
translation_notes:
  register: 明快な現代標準日本語としつつ、聖書本文にふさわしい簡潔で格調ある文体を用いた。前後のローマ書本文に合わせて丁寧体とした。
