id: ROM.1.13
reference: Romans 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: ja
  text: 兄弟たち、次のことを知っておいてほしいのです。私は、ほかの異邦人たちの間で得てきたのと同じように、あなたがたの間でも何らかの実を得るために、何度もあなたがたのところへ行こうと計画しました。しかし、今に至るまで妨げられてきました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「実」は、ここではパウロの宣教や奉仕によって生じる成果を指す比喩です。
    reason: cultural_note
lexical_decisions:
- source_word: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν
  choice: あなたがたに知らずにいてほしくありません
  rationale: 否定を用いた原文の慣用的な告知表現を保ちつつ、現代日本語として明瞭にした。δὲはここでは強い逆接ではなく談話を進める働きなので、独立した接続語を置かなかった。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを形式的に反映する。文脈上はローマの信徒共同体全体への呼びかけであり、女性も含み得る。
- source_word: πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς
  choice: 私は何度もあなたがたのところへ行こうと計画しました
  rationale: 繰り返し抱いた意図を、自然な現代日本語の「何度も…計画しました」で表した。
- source_word: ἐκωλύθην ἄχρι τοῦ δεῦρο
  choice: 今に至るまで妨げられてきました
  rationale: 受動態と、妨げが現在まで続いている時間的含意を保った。妨げた主体は原文同様に特定しない。
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: 何らかの実を得るためです
  rationale: καρπόςの農業的比喩を保持し、τινάの不特定性も「何らかの」で示した。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間でも
  rationale: ローマの信徒たちの間に生じる宣教・奉仕の成果という集団的文脈に即して「間で」とした。
- source_word: ἐν τοῖς λοιποῖς ἔθνεσιν
  choice: ほかの異邦人たちの間で
  rationale: パウロの異邦人宣教という文脈からἔθνηを「異邦人たち」とし、λοιποίがローマの読者もその範囲に含めることを「ほかの」で表した。
theological_decisions:
- issue: 「実」が指す内容
  choice: 本文では比喩を保持し、脚注で宣教・奉仕の成果を指すと説明する
  alternative: 「成果」または「収穫」と本文で明示する
  rationale: 具体的な成果の種類を原文は限定していないため、比喩と意味の幅を保つ。
- issue: パウロを妨げた主体
  choice: 主体を明示しない受動表現とする
  alternative: 神、サタン、事情などを補う
  rationale: この節のἐκωλύθηνは妨げた主体を明示しておらず、神学的に補完すべきではない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の長い一文は読みやすさのため三文に分けたが、論理関係は保持した。「兄弟たち」は共同体への呼びかけで、文脈上は女性の信徒も含み得る。
