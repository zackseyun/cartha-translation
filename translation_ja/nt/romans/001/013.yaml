revisions:
- from: 兄弟たち、あなたがたに知らずにいてほしくありません。私は何度もあなたがたのところへ行こうと計画しましたが、今に至るまで妨げられてきました。それは、ほかの異邦人たちの間でと同じように、あなたがたの間でも何らかの実を得るためです[a]。
  to: 兄弟たち、次のことを知っておいてほしいのです。私は、ほかの異邦人たちの間で得てきたのと同じように、あなたがたの間でも何らかの実を得るために、何度もあなたがたのところへ行こうと計画しました。しかし、今に至るまで妨げられてきました[a]。
  rationale: 冒頭を現代日本語として自然な告知表現に改め、目的節を「行こうと計画しました」に明確に係らせました。「何らかの実」、不特定の受動表現、「ほかの異邦人たち」という比較の意味は保持しています。脚注アンカーは「実」の直後に置くのが内容に最も直接対応します。
