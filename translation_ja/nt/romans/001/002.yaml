lexical_decisions:
- source_word: ὃ
  choice: この福音は……ものです
  rationale: 中性単数の関係代名詞は前節の「福音」を受ける。日本語では指示語を補って文を独立させ、前節との結び付きを明確にした。
- source_word: προεπηγγείλατο
  choice: 前もって約束された
  rationale: 動詞が持つ約束の意味と、接頭辞が示す先行性の双方を自然な日本語で保持した。
- source_word: διὰ τῶν προφητῶν αὐτοῦ
  choice: ご自分の預言者たちを通して
  rationale: 属格を伴う διά の媒介・手段の意味を「通して」で表し、αὐτοῦ が神を指すことを敬意ある再帰表現で明示した。
- source_word: ἐν γραφαῖς ἁγίαις
  choice: 聖なる書物の中で
  rationale: ἐν の場所・領域の意味を保ち、冠詞のない複数形 γραφαῖς の字義と聖書的用法の両方に配慮した。本文では自然で意味の広がりを保つ「聖なる書物」とし、定着した訳語を脚注に示した。
theological_decisions:
- issue: γραφαῖς ἁγίαις を「聖なる書物」とするか「聖書」とするか
  choice: 聖なる書物
  alternative: 聖書
  rationale: 文脈上は権威ある聖書文書を指すが、原文は冠詞のない「聖なる書物」という表現である。本文ではその表現を保持しつつ、読者に一般的な理解を脚注で示して、正典範囲を本文以上に限定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神については「ご自分」「された」によって自然で品位ある敬意を示した。前節に従属するギリシア語の関係節は、この節単独でも理解できる文として整えた。
