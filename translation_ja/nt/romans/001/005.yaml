id: ROM.1.5
reference: Romans 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: ja
  text: この方を通して、私たちは恵みと使徒としての務めを受けました。それは、その方の名のために、すべての国々[b]の間で信仰の従順[a]をもたらすためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信仰から生じる従順」、または「信仰である従順」。
    reason: alternative_reading
  - marker: b
    text: または「すべての異邦人」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: この方を通して
  rationale: 属格を伴うδιάの媒介・手段の意味を表し、直前のイエス・キリストを受ける関係代名詞のつながりも保った。
- source_word: ἐλάβομεν
  choice: 私たちは…受けました
  rationale: 一人称複数形をそのまま訳し、修辞的複数か共同体的複数かを本文で限定しなかった。
- source_word: χάριν καὶ ἀποστολὴν
  choice: 恵みと使徒としての務め
  rationale: 二つの対格名詞の並列を保った。「使徒職」よりも一般読者に分かりやすい「使徒としての務め」とした。
- source_word: εἰς ὑπακοὴν πίστεως
  choice: 信仰の従順をもたらすため
  rationale: εἰςの目的・目標を自然な日本語で示しつつ、属格句の解釈上の幅は「信仰の従順」という簡潔な形と脚注で保持した。
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: すべての国々の間で
  rationale: ἔθνηの広い民族的・地理的範囲を本文に採用し、「異邦人」の可能性は脚注に残した。
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: その方の名のために
  rationale: ὑπέρが示す目的・利益・動機を自然に表し、「名」が担う名誉や権威の含意を保った。
theological_decisions:
- issue: ὑπακοὴν πίστεως の解釈
  choice: 信仰の従順
  alternative: 信仰から生じる従順／信仰である従順
  rationale: この属格構文が、信仰を従順の源とするのか、従順の内容・同格とするのかは確定しないため、本文では圧縮された表現を保ち、解釈を脚注で示した。
- issue: ἐλάβομεν の一人称複数
  choice: 私たちは受けました
  alternative: 私は受けました
  rationale: パウロ個人を指す修辞的複数と見る余地はあるが、ギリシア語の人称と数を変更せず、解釈を固定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬体で統一した。「信仰の従順」は日常語としては圧縮された表現だが、原文の意味上の曖昧さを保つため本文に置き、理解を助ける別訳を脚注に示した。
