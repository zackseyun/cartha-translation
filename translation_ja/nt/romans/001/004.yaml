revisions:
- from: また、聖さの霊によれば[b]、死者の中からの復活によって、力ある神の子と定められた[a]方、すなわち、私たちの主イエス・メシアです。
  to: 聖さの霊によれば[b]、死者の中からの復活によって、力をもって神の子と定められた[a]方、すなわち私たちの主イエス・メシアです。
  rationale: 原文のἐν δυνάμειを「力をもって」としてὁρισθέντοςに近接して置き、「力ある御子」という一義的な解釈を避けました。「聖さの霊」は、聖霊を指す可能性を否定せずに原文の異例な表現と解釈の幅を保っています。単独でも自然に読めるよう「また」を除き、脚注aも本文の構文に合わせて更新しました。
