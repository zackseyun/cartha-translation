id: ROM.1.4
reference: Romans 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: ja
  text: 聖さの霊によれば[b]、死者の中からの復活によって、力をもって神の子と定められた[a]方、すなわち私たちの主イエス・メシアです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「力をもって神の子であると示された」、または「力をもって神の子として任命された」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「聖霊によれば」、または「その聖なる霊によれば」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: 定められた
  rationale: ὁρίζωが持つ「定める・任命する・明示する」という意味の幅を保つ。「宣言された」よりも原語の直接的な力を残しつつ、他の主要な訳語は脚注に示した。
- source_word: υἱοῦ θεοῦ
  choice: 神の子
  rationale: キリスト論的称号を、日本語で定着した自然かつ直接的な形で表した。
- source_word: ἐν δυνάμει
  choice: 力ある神の子
  rationale: 「力をもって定められた」として定める行為の様態だけに限定せず、復活に伴う力のうちにある御子の身分・現れを表せるようにした。
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: 聖さの霊によれば
  rationale: 直訳に近い異例の表現を残し、聖霊を直接指すのか、「肉によれば」と対照される聖なる霊的領域・あり方を指すのかを本文で断定しない。
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: 死者の中からの復活によって
  rationale: ἐξを根拠・契機として表し、νεκρῶνの複数的な集合表現も「死者の中から」によって自然に反映した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςを単なる固有名ではなく称号として理解できる「メシア」で表し、日本語として自然な結合にした。
- source_word: κυρίου ἡμῶν
  choice: 私たちの主
  rationale: パウロ書簡におけるκύριοςのキリスト論的響きを保つ標準的な訳語を用いた。
theological_decisions:
- issue: ὁρισθέντοςが、イエスは復活時に初めて神の子になったという意味を含むか
  choice: 「力ある神の子と定められた」とし、復活に伴う新たな力ある身分・顕現を示し得る表現にした。
  alternative: 「力ある神の子であると示された／宣言された」
  rationale: 原文は「初めて神の子になった」と明言していない一方、「定められた」という強い語を用いる。本文でこの緊張を解消せず、異なる理解が可能な訳を脚注に残した。
- issue: πνεῦμα ἁγιωσύνηςが特に聖霊を指すか
  choice: 「聖さの霊」とし、指示対象を開いたままにした。
  alternative: 「聖霊によれば」または「その聖なる霊によれば」
  rationale: この句は通常の「聖霊」という言い方ではなく、3節の「肉によれば」と対をなす可能性もあるため、解釈を本文に織り込まなかった。
translation_notes:
  register: 現代標準日本語の明瞭さと聖書本文としての品位を両立させた。「聖さの霊」は意図的に通常とは異なる言い回しを残し、原文の珍しい表現と解釈上の幅を保っている。本節が前節から続く属格構文であることを踏まえ、冒頭の「また」と末尾の「方、すなわち」で日本語の連続性を補った。
