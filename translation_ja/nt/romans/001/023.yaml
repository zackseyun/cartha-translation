id: ROM.1.23
reference: Romans 1:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: ja
  text: そして、朽ちることのない神の栄光を、朽ちる人間、鳥、四つ足の動物、地を這うものに似せた像と取り替えました。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「朽ちる人間、鳥、四つ足の動物、地を這うものの像の似姿と」。
    reason: lexical_alternative
  - marker: b
    text: 「地を這うもの」は「這う生き物」とも訳せる。現代の動物分類でいう爬虫類より広い意味を持ちうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: 取り替えました
  rationale: 文脈上、神の栄光を被造物の像で意図的に置き換えたことを表す。日本語として自然で、交換・代替の意味を保つ。
- source_word: δόξαν
  choice: 栄光
  rationale: 神の威光と尊厳を指す標準的かつ文脈に適した訳語。
- source_word: ἀφθάρτου
  choice: 朽ちることのない
  rationale: 腐敗や滅びに服さないという意味を明瞭にし、後続の φθαρτοῦ との対照を保つ。
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: …に似せた像と
  rationale: 直訳的な「像の似姿において」という重なった表現の意味を、単数の「像」を保ちながら自然な日本語で示す。交換対象を示す日本語の助詞「と」で ἤλλαξαν の構文を表す。
- source_word: φθαρτοῦ ἀνθρώπου
  choice: 朽ちる人間
  rationale: ἀφθάρτου との語形上・意味上の対照を「朽ちることのない／朽ちる」で明示し、ἄνθρωπος を性別に限定しない「人間」とする。
- source_word: πετεινῶν
  choice: 鳥
  rationale: 現代日本語で簡潔かつ自然な対応語。
- source_word: τετραπόδων
  choice: 四つ足の動物
  rationale: 四足の生き物という語義を、一般読者に明瞭な表現で伝える。
- source_word: ἑρπετῶν
  choice: 地を這うもの
  rationale: 現代的な動物分類としての「爬虫類」より広い語義を保ち、這って進む生き物を自然に表す。
theological_decisions:
- issue: ἀφθάρτου と φθαρτοῦ の対照
  choice: 「朽ちることのない神」と「朽ちる人間」
  alternative: 「不滅の神」と「死すべき人間」
  rationale: 原文は同じ語根による鮮明な対照を作るため、日本語でも「朽ちる」を反復してその修辞的・神学的対比を保った。
- issue: 偶像を表す ἐν ὁμοιώματι εἰκόνος の重層的表現
  choice: 「…に似せた像」
  alternative: 「…の像の似姿」
  rationale: 像と類似の両要素を保ちつつ、不自然な名詞の重複を避ける。何を表す像かは、人間・鳥・四つ足の動物・地を這うもののすべてに係るよう訳した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の不朽性と被造物の朽ちやすさの対照を格調ある表現で保持した。文頭の καί は前節との連続を示す「そして」とした。
