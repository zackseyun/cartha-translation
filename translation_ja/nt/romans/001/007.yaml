  text: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ ἀγαπητοῖς θεοῦ, κλητοῖς ἁγίοις· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν καὶ κυρίου Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: ja
  text: ローマにいる、神に愛され、召された聖なる者たちすべてへ[a]。私たちの父である神と、主イエス・メシア[b]から、恵みと平安があなたがたにありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖なる者として召された人たち」。伝統的には「聖徒となるよう召された人たち」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「キリスト」。メシアは「油を注がれた者」という称号。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: ローマにいるすべての人…へ
  rationale: 与格による宛先を日本語の書簡として自然な「…へ」で表し、πᾶσινの包括性と所在地を保った。
- source_word: ἀγαπητοῖς θεοῦ
  choice: 神に愛され
  rationale: 神を動作主とする受動的・関係的な意味を、現代日本語で簡潔に表した。
- source_word: κλητοῖς ἁγίοις
  choice: 聖なる者として召された人たち
  rationale: 二つの形容詞から成るギリシア語の結び付きを保ちつつ、日本語として意味が通るよう「として」を用いた。「聖徒」より一般読者に明瞭である。
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の挨拶における神学的含意を保つ、定着した自然な訳語。
- source_word: εἰρήνη
  choice: 平安
  rationale: 単なる争いの不在を超える挨拶および神学的な広がりを保つため、「平和」ではなく「平安」とした。
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: 私たちの父である神
  rationale: 修飾関係を明瞭にし、自然で尊厳ある現代日本語とした。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςのキリスト論的な称号性を保つ標準的な訳語。
- source_word: Χριστοῦ
  choice: メシア
  rationale: 語源的・称号的意味を可視化し、「油を注がれた者」という背景を保持する。日本語では固有名に連なる称号として自然に表した。
theological_decisions:
- issue: κλητοῖς ἁγίοιςを、召しによって聖なる者であるとの記述として訳すか、聖なる者になるよう召されたとの目的表現として訳すか
  choice: 聖なる者として召された人たち
  alternative: 聖なる者となるよう召された人たち／召された聖なる者たち
  rationale: 原文には「となるよう」に相当する不定詞や目的表現がない。「として」は召しと聖なる身分の関係を自然に示しながら、将来的な達成だけに限定する解釈を避ける。
- issue: Χριστόςを音写的伝統語で訳すか、称号の意味を示すか
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスに伴う称号としての性格を保ち、その意味を読者に見える形にする。「キリスト」も定着した代替訳として注記した。
- issue: χάρις ὑμῖν καὶ εἰρήνηを叙述文にするか祈願的挨拶にするか
  choice: 恵みと平安があなたがたにありますように
  alternative: あなたがたに恵みと平安
  rationale: 原文は動詞を省く挨拶定型であり、日本語では祈願形がその機能を最も自然に伝える。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で格調ある書簡調。「聖徒」のような教会内でのみ通じやすい語を本文では避けた。原文の宛先句が重なる構造は、日本語で過度に硬くならない範囲で保持した。
