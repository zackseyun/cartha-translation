source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: ja
  text: 神について知りうることは、彼らの間で明らかだからです。[a] 神が彼らにそれを明らかにしたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの内に」または「彼らの中に」。
    reason: ἐν αὐτοῖςは、「彼らの間で」という集団的な意味にも、「彼らの内に」という内面的な意味にも取りうるため。
lexical_decisions:
- source_word: διότι
  choice: だからです
  rationale: 直前の記述の根拠を示す接続詞であり、現代日本語として自然な因果関係を表す。
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: 神について知りうること
  rationale: 実体詞化された中性形容詞と属格を、神に関して人が知ることのできる内容として自然に表した。「知られていること」の可能性もあるが、文脈上の認識可能性をよく伝える。
- source_word: φανερόν ἐστιν
  choice: 明らか
  rationale: 隠されず、認識できる状態を簡潔に示し、後半の同根動詞との語の対応も保つ。
- source_word: ἐν αὐτοῖς
  choice: 彼らの間で
  rationale: ἐν の集団内・領域内の意味を採り、公に認識可能であるという文脈に適合させた。ただし内面的な意味も可能なので脚注に残す。
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: 神が彼らに明らかにされたのです
  rationale: 神を行為主体として保ち、ἐφανέρωσενを「明らかにされた」と訳してφανερόνとの対応を示す。γάρは説明的な「のです」で自然に表した。
theological_decisions:
- issue: ἐν αὐτοῖςの意味
  choice: 彼らの間で
  alternative: 彼らの内に／彼らの中に
  rationale: この句は、彼らの集団の間で明白であるとも、彼らの内面に明白であるとも解しうる。本文では周囲の被造世界による啓示の文脈に合う集団的・公的な意味を採り、内面的な可能性は脚注で保持した。
- issue: τὸ γνωστὸνの様相
  choice: 知りうること
  alternative: 知られていること
  rationale: 形容詞γνωστόςは文脈により「知られている」と「知ることができる」の双方を表しうる。ここでは神が明らかにしたため認識可能であるという論旨を踏まえ、「知りうる」とした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「明らか」を前後で反復し、原文のφανερόνとἐφανέρωσενの語彙的対応を反映した。
