id: ROM.1.26
reference: Romans 1:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: ja
  text: このため、神は彼らを恥ずべき情欲に引き渡されました。実際、彼らの女たちさえ、自然な交わり[a]を、自然に反するもの[b]と取り替えました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「自然な用い方」。ここでは性的な交わりを指します。
    reason: lexical_alternative
  - marker: b
    text: 「自然に逆らうもの」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: このため
  rationale: 直前の議論を受ける因果的・推論的なつながりを、簡潔で自然な日本語で示す。
- source_word: παρέδωκεν αὐτοὺς ὁ θεὸς
  choice: 神は彼らを……引き渡されました
  rationale: παραδίδωμι の「引き渡す」という司法的な響きを保ちつつ、神を主語として明示する。
- source_word: πάθη ἀτιμίας
  choice: 恥ずべき情欲
  rationale: 属格を性質・評価として自然に表し、本文にある否定的な道徳評価を弱めも強めもしない。
- source_word: αἵ τε γὰρ θήλειαι αὐτῶν
  choice: 実際、彼らの女たちさえ
  rationale: γάρ の説明的な働きを「実際」で、τε の強調を「さえ」で表す。θήλειαι は語彙上「雌・女性」を指すが、人間について自然な「女たち」とした。
- source_word: μετήλλαξαν
  choice: 取り替えました
  rationale: あるものを別のものへ交換するという意図的な転換を表す。
- source_word: τὴν φυσικὴν χρῆσιν
  choice: 自然な交わり
  rationale: χρῆσις の直訳「用い方」は日本語では対象が不明瞭で物象化した響きも生じるため、文脈上の性的関係を示しながら露骨な補足を避けた。
- source_word: εἰς τὴν παρὰ φύσιν
  choice: 自然に反するものへと
  rationale: 形容詞的に用いられた句の省略を保ち、「自然に反する」という本文の評価を明確に伝える。
theological_decisions:
- issue: パウロの道徳的評価を強めるか弱めるか
  choice: 「恥ずべき」「自然に反する」という評価語をそのまま保持する。
  alternative: 現代的な分類名を加える、または「不適切」などに弱める。
  rationale: 原文自体が評価を含む一方、具体的な現代的カテゴリーまでは名指していないため、説明を付加せず原文の緊張を保つ。
- issue: φύσις の意味を解釈的に限定するか
  choice: 「自然」と訳し、その基準が生物学的・社会慣習的・創造秩序的のいずれかを本文中で限定しない。
  alternative: 「創造の秩序」または「一般の慣習」などと明示する。
  rationale: この節だけでは φύσις の射程を一つに断定せず、原文の表現を保持するのが適切である。
translation_notes:
  register: 現代標準日本語の丁寧体を用い、荘重さと明瞭さを両立させた。「情欲」は日常語よりやや文語的だが、πάθη の強い欲情と道徳的文脈を簡潔に伝える聖書語として理解可能。脚注記号は該当句を含む文末に置いた。
