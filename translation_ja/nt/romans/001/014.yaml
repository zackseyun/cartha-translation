  text: Ἕλλησίν τε καὶ βαρβάροις, σοφοῖς τε καὶ ἀνοήτοις ὀφειλέτης εἰμί·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/014.yaml
  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: ja
  text: 私は、ギリシア人にもギリシア人でない人々[a]にも、知恵のある人にも愚かな人にも、責務を負っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は、ギリシア人に対して「ギリシア人でない人々」を指す一般的な文化上の呼び方である。必ずしも、現代語の「野蛮な人々」が含みうるような道徳的意味を表すものではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: ギリシア人
  rationale: 当時の民族的・文化的区分を表す与格複数であり、対になる語との関係を明確に保つ自然な訳。
- source_word: βαρβάροις
  choice: 異民族の人々
  rationale: ギリシア語を話す文化圏の人々に対する、それ以外の人々という慣用的区分を表す。現代日本語の「野蛮人」が伴う強い道徳的侮蔑を避けつつ、脚注で原語の歴史的表現を示す。
- source_word: σοφοῖς
  choice: 知恵のある人
  rationale: ἀνοήτοιςとの対照を保ち、知性・教養を含みうる原語の幅を不必要に狭めない。
- source_word: ἀνοήτοις
  choice: 愚かな人
  rationale: σοφοῖςとの簡潔な対照を保つ。「無学な人」では教育の有無に意味を限定しすぎる。
- source_word: ὀφειλέτης
  choice: 果たすべき務めがあります
  rationale: 字義的には「負債を負う者」だが、ここでは金銭的債務ではなく、福音を伝える責務を負っていることを表す。自然な日本語で義務の力を伝える。
- source_word: τε ... καὶ / τε ... καὶ
  choice: にも…にも／にも…にも
  rationale: 二組の均衡した並列関係を、日本語で明瞭かつ自然に再現する。
theological_decisions:
- issue: ὀφειλέτηςが表す義務の性質
  choice: 「果たすべき務めがあります」とし、義務の対象を本文どおり列挙する
  alternative: 「福音を伝える責任があります」と補足する
  rationale: 文脈上は福音宣教の責務だが、この節そのものには「福音を伝える」が明記されていないため、本文では説明を加えすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、二組の対照が持つ修辞的な均衡を保持した。「異民族の人々」は歴史的区分を伝えながら、現代語の「野蛮人」に生じる不必要な侮蔑的含意を避ける。
