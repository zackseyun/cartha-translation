  text: among whom you also are[a], called of Jesus the Messiah,
translation:
  language: ja
  text: その異邦人の中にいるあなたがたも、メシアであるイエスに属する者として召されています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシアであるイエスによって召されています」。直訳に近くは「メシアであるイエスの、召された者たちです」。
    reason: κλητοὶに続く属格Ἰησοῦ Χριστοῦは、所属・関係を表すとも、召しの行為者を表すとも解し得るため。
lexical_decisions:
- source_word: ἐν οἷς
  choice: その異邦人の中に
  rationale: 関係代名詞の先行詞は前節の「異邦人」であり、ローマの信徒もその集団に含まれることを明確にした。
- source_word: ἐστε καὶ ὑμεῖς
  choice: あなたがたもいて
  rationale: καίと明示されたὑμεῖςによる強調的な包含を、自然な現代日本語で保った。
- source_word: κλητοὶ
  choice: 召されています
  rationale: 神による召しという文脈上の重みを保ちつつ、受動の状態を表す自然な表現とした。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエスであるメシア
  rationale: Ἰησοῦを固有名、Χριστοῦを称号として訳し、両語が同一人物を指すことを明瞭にした。
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: イエスであるメシアのものとして召されています
  rationale: 圧縮された属格を、所属・関係を示す表現として本文に反映しつつ、行為者を示す可能性などは脚注に残した。
theological_decisions:
- issue: κλητοὶ Ἰησοῦ Χριστοῦにおける属格の関係
  choice: イエスであるメシアのものとして召されています
  alternative: イエスであるメシアによって召されています／イエスであるメシアに属する、召された者です
  rationale: 属格が所属・関係を表す可能性を本文で自然に示した。ただしギリシア語だけでは召しの行為者とも解し得るため、その曖昧さを脚注に明記した。
translation_notes:
  register: 明快で品位ある現代標準日本語。前節とのつながりを示すため「異邦人」を補い、Χριστόςは称号として「メシア」とした。
