  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: ja
  text: 私はいつも祈りの中で、何とかして、ついに神のみこころによってあなたがたのところへ行くことがかなう[a]ようにと願い求めています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたのところへ行くことに成功できるように」、または「あなたがたのところへ行く旅が順調になるように」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε ἐπὶ τῶν προσευχῶν μου
  choice: いつも祈りのたびに
  rationale: 継続的な祈りの習慣を、現代日本語として自然に表しつつ、πάντοτε の強調を保つ。
- source_word: δεόμενος
  choice: 願っています
  rationale: 祈りの中での切実な願いを表す分詞。前後とのつながりを自然にするため、主節相当の表現にした。
- source_word: εἴ πως
  choice: 何とかして
  rationale: 実現の仕方が定まらない中での希望と切望を保つ。
- source_word: ἤδη ποτὲ
  choice: 今度こそ
  rationale: 長く待ち望んできた訪問が、ついに実現してほしいという語勢を自然な日本語で表す。
- source_word: εὐοδωθήσομαι
  choice: 道が開かれる
  rationale: 語源的な『よい道を得る』という響きと、文脈上の『訪問が首尾よく実現する』という受動的意味を自然に伝え、金銭的な繁栄との誤解も避ける。
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: 神のみこころによって
  rationale: パウロの訪問が神の意志を決定的な条件・働きとして実現するとの意味を明確にする。
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: あなたがたのところへ行く
  rationale: 原文の単純な移動表現を保ち、『訪問する』という補足的ニュアンスを不要に加えない。
theological_decisions:
- issue: 神のみこころとパウロの訪問実現との関係
  choice: 神のみこころによって
  alternative: 神のみこころのうちに
  rationale: ἐν の意味には幅があるが、ここでは訪問の実現が神の意志に依存することを自然に示す。神の意志の具体的内容や予定論的含意までは付加しない。
translation_notes:
  register: 明瞭で現代的ながら、祈りの文脈にふさわしい品位を保った。「みこころ」は一般の聖書読者に通じる語として用い、「御心」の表記より読みやすさを優先した。
