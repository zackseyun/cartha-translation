id: ROM.1.32
reference: Romans 1:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: ja
  text: 彼らは、こうしたことを行う者は死に値するという神の正しい定め[a]を知っていながら、自らそれを行うだけでなく、それを行う者たちをも是認しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定め」は「規定」「要求」「裁き」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: 彼らは
  rationale: 前節までに述べられた人々を受ける関係表現。日本語では独立した文として自然につなぐため「彼らは」とした。
- source_word: τὸ δικαίωμα τοῦ θεοῦ
  choice: 神の正しい定め
  rationale: δικαίωμα の法的・道徳的な意味合いを保ち、神の判断が正しいことも示す。文脈上、続く「死に値する」がその内容を説明している。
- source_word: ἐπιγνόντες
  choice: 知っていながら
  rationale: 分詞の譲歩的な関係を自然な日本語で表し、知識に反して行動している対照を明示する。
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: こうしたことを行う者
  rationale: 継続的な行為を含み得る πράσσω を簡明に表し、直前の悪徳の列挙を「こうしたこと」で受ける。
- source_word: ἄξιοι θανάτου
  choice: 死に値する
  rationale: 司法的な重みを保ちながら、死の具体的範囲を本文以上に限定しない直訳的で自然な表現。
- source_word: οὐ μόνον αὐτὰ ποιοῦσιν
  choice: 自らそれを行うだけでなく
  rationale: αὐτά を前述の行為として受け、「自ら」によって他者への是認との対比を自然に示す。
- source_word: συνευδοκοῦσιν
  choice: 是認しています
  rationale: 単なる同意や黙認より強い、他者の行為を良しとして承認する意味を簡潔に表す。
- source_word: τοῖς πράσσουσιν
  choice: それを行う者たち
  rationale: 先行する行為との対応を保ち、他者による実行を明確にする。
theological_decisions:
- issue: 「死に値する」の範囲
  choice: 神の司法的判断として「死に値する」と訳し、死の種類や範囲は限定しない。
  alternative: 地上の死刑、または終末論的な死を明示する。
  rationale: 本文は θάνατος の範囲をここで詳しく定義していないため、その神学的緊張と広がりを保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、司法的・道徳的な重みを保った。「是認する」はやや改まった語だが、単なる賛同ではなく行為を良しと認める συνευδοκέω の意味に適している。
