id: ROM.1.1
reference: Romans 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παῦλος δοῦλος ⸂Χριστοῦ Ἰησοῦ⸃, κλητὸς ἀπόστολος, ἀφωρισμένος εἰς εὐαγγέλιον θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/001.yaml
  text: Paul[a], a servant of Messiah Jesus, called as an apostle, set apart for the gospel of God[d][c][b],
translation:
  language: ja
  text: パウロ、キリスト・イエス[b]の奴隷[a]、召された使徒[c]、神の福音のために選び分けられた者。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」は「僕」「仕える者」とも訳せる。ここでは、キリスト・イエスに全面的に属し、従う者という原語の強い意味を表す。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト」は「油を注がれた者」、すなわち「メシア」を意味する称号。別訳「メシアであるイエス」。
    reason: lexical_alternative
  - marker: c
    text: 「召された使徒」は、文脈上「使徒として召された者」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: パウロ
  rationale: 日本語で定着している人名表記を用いた。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 所有と服従を伴う身分を表す語の強さを保った。「僕」や「仕える者」では、その拘束性が弱まりうる。
- source_word: Χριστοῦ Ἰησοῦ
  choice: キリスト・イエス
  rationale: 原文の語順を保ちつつ、日本語の聖書用語として定着した表現を用いた。キリストは称号として「メシア」を意味する。
- source_word: κλητὸς ἀπόστολος
  choice: 使徒として召され
  rationale: 形容詞と名詞から成る簡潔な原文を、パウロが使徒の務めへ召されたという意味が自然に伝わる形にした。
- source_word: ἀφωρισμένος
  choice: 選び分けられた
  rationale: 受動の意味と、特定の目的のために取り分けられた含意を保った。
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: 神の福音のために
  rationale: εἰςの目的を簡潔に示し、属格 θεοῦ は原文に即して「神の」とした。
theological_decisions:
- issue: δοῦλοςが表すパウロとキリスト・イエスとの関係
  choice: 奴隷
  alternative: 僕／仕える者
  rationale: 現代日本語では強い語だが、原語が示す全面的な帰属と服従を曖昧にしないために採用した。歴史上の奴隷制度を肯定する意味を本文に加えてはいない。
- issue: Χριστόςを称号としてどう表すか
  choice: キリスト
  alternative: メシア
  rationale: 「キリスト」は日本語で定着している一方、称号の意味が固有名のように受け取られる可能性があるため、脚注で「メシア」の意味を示した。
- issue: κλητὸς ἀπόστολοςの統語的関係
  choice: 使徒として召され
  alternative: 召された使徒であり
  rationale: 「使徒になるよう召された」という自然な理解を示すが、原文に明示されない「なった」を加えないようにした。別の統語表現は脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ローマ書冒頭の差出人表示であり、後続節へ続く構文だが、日本語では単独節としても読めるよう「パウロから」とした。原語の並列構造を保ち、「奴隷」「召され」「選び分けられた」という三つの自己規定を簡潔に並べた。
