  yaml_path: translation/nt/romans/001/031.yaml
  text: senseless[a], faithless, heartless[b], merciless.
translation:
  language: ja
  text: 物事をわきまえず、約束を守らず[a]、肉親への情愛がなく[b]、憐れみのない者です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「信義に欠け」「契約を破り」。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「自然な愛情がなく」。特に家族や肉親に対する生来の情愛を指します。
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: 物事をわきまえず
  rationale: 理解力や判断力を欠くという道徳的・知的な意味を、単なる知能の低さと誤解されない自然な日本語で表した。
- source_word: ἀσυνθέτους
  choice: 約束を守らず
  rationale: 合意や誓約を守らず、信頼に値しないという意味を明確に表した。
- source_word: ἀστόργους
  choice: 肉親への情愛がなく
  rationale: στοργήが特に家族の間にある自然な愛情を指すため、その含意を本文で明示した。
- source_word: ἀνελεήμονας
  choice: 憐れみのない
  rationale: 他者への憐れみや慈悲を欠くという語義を、簡潔で格調ある現代日本語で表した。
theological_decisions: []
