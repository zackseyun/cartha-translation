id: ROM.1.17
reference: Romans 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: ja
  text: この福音には、神の義[a]が、信仰から信仰へと[b]啓示されています。こう書かれているとおりです。「正しい者は信仰によって生きる。」[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神の公正」。また、「神から与えられる義」と理解することもできる。
    reason: δικαιοσύνηと属格θεοῦの語義・関係には複数の可能性があるため。
  - marker: b
    text: 「信仰から信仰へと」に当たるギリシア語は解釈の難しい表現。「信仰によって始まり信仰に至る」「初めから終わりまで信仰によって」などとも理解される。
    reason: ἐκ πίστεως εἰς πίστινの前置詞関係と反復を保ちつつ、主要な解釈可能性を示すため。
  - marker: c
    text: または「信仰による正しい者は生きる」。
    reason: ἐκ πίστεωςが「正しい者」にかかる可能性があるため。
  - marker: d
    text: または「しかし、正しい者は信仰によって生きる」。ギリシア語の引用には接続語がある。
    reason: 引用冒頭のδὲを明示的に訳す可能性を記録するため。
lexical_decisions:
- source_word: δικαιοσύνη
  choice: 義
  rationale: パウロ書簡で神との正しい関係と神ご自身の正しさの双方を担いうる、簡潔で定着した訳語。法的・倫理的な「公正」という意味合いは脚注に残した。
- source_word: θεοῦ
  choice: 神の
  rationale: 属格を解釈的に「神から与えられる」と限定せず、神ご自身の義、神に由来する義などの可能性を保つ。
- source_word: ἐν αὐτῷ
  choice: そこには
  rationale: 中性代名詞が直前の「福音」を受けることを自然な日本語で示す。「そこ」は福音を指し、人を指す読みを避ける。
- source_word: ἀποκαλύπτεται
  choice: 啓示されています
  rationale: 現在受動形を表し、神によって明らかにされるという含みを保つ。神学的文脈にも適した現代日本語。
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: 信仰から信仰へと
  rationale: ἐκとεἰςの方向性およびπίστιςの反復を保ち、起点と到達点を特定する複数の解釈を本文で一つに絞らない。
- source_word: δίκαιος
  choice: 正しい者
  rationale: 実体詞的な単数形を自然な日本語で表し、性別を不必要に限定しない。「義人」より一般読者に理解しやすい。
- source_word: ἐκ πίστεως
  choice: 信仰によって
  rationale: 引用文ではζήσεταιにかかる読みを本文に採り、手段・あり方を自然に表す。δίκαιοςにかかる可能性は脚注に残す。
- source_word: ζήσεται
  choice: 生きる
  rationale: 日本語では引用された原則・約束を現在形で述べてもギリシア語未来形の確かさを自然に表せる。硬すぎる「生きるであろう」は避けた。
theological_decisions:
- issue: δικαιοσύνη θεοῦの意味
  choice: 神の義
  alternative: 神から与えられる義／神の公正
  rationale: 属格の意味を神ご自身の属性、神に由来する賜物、神の救済的な正しさのいずれかに限定せず、ローマ書における神学的緊張を保つ。
- issue: ἐκ πίστεως εἰς πίστινの意味
  choice: 信仰から信仰へと
  alternative: 信仰によって始まり信仰に至る／初めから終わりまで信仰によって
  rationale: 難解で多義的な句なので、二つの前置詞と語の反復を本文に残し、神の真実から人の信仰へ、信仰の始まりから完成へ、初めから終わりまで、といった特定の説明に固定しない。
- issue: ハバクク引用中のἐκ πίστεωςの係り先
  choice: 正しい者は信仰によって生きる
  alternative: 信仰による正しい者は生きる
  rationale: 本文はζήσεταιにかける伝統的で自然な読みを採るが、ギリシア語ではδίκαιοςを修飾する可能性もあるため脚注で明示する。
- issue: 引用冒頭のδὲ
  choice: 日本語本文では訳出しない
  alternative: しかし、正しい者は信仰によって生きる
  rationale: ここで引用は前文を裏づけており、日本語の「しかし」は強い対立を示して文脈を誤解させやすい。接続小辞を明示する形式的な可能性は脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「義」「啓示」はローマ書の神学的連関を保つため用いるが、文全体は平易な敬体とした。「そこ」は直前の福音を受ける。引用は簡潔な常体にして聖書引用として区別した。
