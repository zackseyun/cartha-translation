  source_fidelity: 本文は、τὰ ἀόρατα αὐτοῦを「神について目に見えないもの」として広く保ち、同格の「神の永遠の力と神性」を明示している。「世界の創造以来」はἀπὸ κτίσεως κόσμουの継続する時間的起点を適切に表す。「造られたものを通して理解され、はっきりと認められます」は、τοῖς ποιήμασινの手段と、νοούμεναおよびκαθορᾶταιの知性的把握と明白な知覚を無理なく反映している。結びも、εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτουςの結果を自然に伝えている。
  naturalness: 明瞭な現代標準日本語であり、文の論理的な流れも自然である。「目に見えないもの」と「認められます」の組み合わせは、被造物を通した理解という直前の限定により不自然さなく読める。
  terminology: θειότηςを「神性」とするのは適切であり、「神格」などよりも原語が示す神的性質・神性の含意を過度に強めない。注は「神としての性質」という有用な代案を示し、θεότηςと異なる語であることも正確に注意している。
