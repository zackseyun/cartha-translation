id: ROM.1.20
reference: Romans 1:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: ja
  text: 神について目に見えないもの、すなわち神の永遠の力と神性[a]は、世界の創造以来、造られたものを通して理解され、はっきりと認められます。そのため、人々には弁解の余地がありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神としての性質」とも訳せます。ここで使われているギリシア語はθειότηςで、θεότηςとは異なります。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: 神について目に見えないもの
  rationale: 直訳的な広がりを保ち、神に関して目には見えない事柄を指す中性複数形を、過度に体系化せず自然な日本語で表した。
- source_word: ἀπὸ κτίσεως κόσμου
  choice: 世界の創造以来
  rationale: ἀπόの時間的起点と、それ以来続く認識可能性を簡潔に表す。
- source_word: τοῖς ποιήμασιν
  choice: 造られたものを通して
  rationale: 与格の手段的用法を明示し、被造物が理解の媒介となることを表した。
- source_word: νοούμενα
  choice: 理解され
  rationale: 目に見えない事柄が被造物を介して知性によって把握されるという認知的含意を保つ。
- source_word: καθορᾶται
  choice: はっきりと認められます
  rationale: 「見る」だけでは生じる矛盾を避けつつ、κατάの強意と、明瞭に知覚できるという意味を表した。
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης
  choice: すなわち神の永遠の力と神性
  rationale: 前句への同格的説明を「すなわち」で示し、ἀΐδιοςとθειότηςを簡潔かつ尊厳ある日本語にした。
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: そのため、人々には弁解の余地がありません
  rationale: 結果を表す構文として訳し、αὐτούςの指示対象を文脈に即して「人々」と明示した。
theological_decisions:
- issue: θειότηςを存在論的に強く訳しすぎないこと
  choice: 神性
  alternative: 神としての性質／神格
  rationale: θειότηςは神的性質を表し、θεότηςとの語彙上の違いを消さない「神性」が簡潔で適切である。
- issue: εἰς τό構文の目的・結果の含み
  choice: 結果として「そのため」
  alternative: 目的として「彼らを弁解できない者とするため」
  rationale: 文脈上は啓示を受けた人間が弁解できない状態になる帰結が前面に出るが、ギリシア語構文に目的的な響きがあり得ることは注記する。
translation_notes:
  register: 明瞭な現代標準日本語。神学用語は「神性」に限定し、本文全体は一般読者にも理解できる語調とした。「神について目に見えないもの」という原文の広い表現を保ち、「属性」と限定しすぎないようにした。
