  source_fidelity: 「認識のうちに保つ」は、τὸν θεὸν ἔχειν ἐν ἐπιγνώσειの比喩的な表現をよく反映している。「引き渡す」も、文脈で反復されるπαρέδωκενの司法的・結果的な含意を適切に保つ。ただし現行の「行うに任せられました」は受け身の形となり、主語である神が「引き渡した」こととの統語関係が不明瞭である。
  naturalness: 「良しと認められない思い」は意味を取れるものの、現代標準語としてかなり不自然である。また「引き渡し、…任せられました」は同一の主語に対する能動・受動が混在する。より自然な表現に改める必要がある。
  terminology: 「認めるに値しない思い」はἀδόκιμον νοῦνの「承認されない／試験に通らない」という基本義を過度に教理化せずに表し、前半の「良しと認めなかった」との語の対応もある程度保つ。「思い」はνοῦςの文脈上の働きを分かりやすく表す。
