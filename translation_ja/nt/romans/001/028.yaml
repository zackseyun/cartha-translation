  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: ja
  text: また、彼らが神を自分たちの認識のうちに保つことを良しと認めなかった[a]ので、神は彼らを、認めるに値しない思い[b]に引き渡し、ふさわしくないことを行うようにされました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神を認めることを良しと認めなかった」。原文は直訳すれば「神を認識のうちに持つ」となります。
    reason: lexical_alternative
  - marker: b
    text: 「認めるに値しない」は、前半の「良しと認めなかった」と原文で関連する語を用い、パウロの語の響きを表しています。別訳「堕落した思い」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: …ので
  rationale: ここでは人間の拒絶と、それに対応する神の引き渡しを結び付けている。日本語では因果関係を明瞭にしつつ、文全体の対応関係を保つため「…ので」とした。
- source_word: οὐκ ἐδοκίμασαν
  choice: 良しとしなかった
  rationale: δοκιμάζωの、吟味して是認するという意味を表し、後のἀδόκιμονとの語の響きも可能な限り残した。
- source_word: τὸν θεὸν ἔχειν ἐν ἐπιγνώσει
  choice: 神を自分たちの認識のうちに保つ
  rationale: ἔχεινの「持つ、保つ」とἐν ἐπιγνώσειの表現を反映し、単に神の存在を知るだけでなく、神を認識の中に置いておくという原文の像を残した。
- source_word: παρέδωκεν
  choice: 引き渡し
  rationale: 直前の文脈で繰り返される神の裁きとしての「引き渡す」を一貫して表せる、明瞭で重みのある表現である。
- source_word: ἀδόκιμον νοῦν
  choice: 良しと認められない思い
  rationale: ἀδόκιμοςの「試験にかなわない、是認されない」という意味を表し、ἐδοκίμασανの「良しとする」との語義的な対応を残した。「堕落した」など、より強い体系的・教理的含意は本文に持ち込まない。
- source_word: ποιεῖν
  choice: 行うに任せられました
  rationale: 「引き渡した」に続く不定詞が示す結果を、自然な日本語で明確にした。
- source_word: τὰ μὴ καθήκοντα
  choice: ふさわしくないこと
  rationale: καθήκωが表す「適切である、ふさわしい」という意味を、過度に具体化せず自然に表した。
theological_decisions:
- issue: ἀδόκιμον νοῦνを「堕落した心」「邪悪な心」などと強く訳すか
  choice: 良しと認められない思い
  alternative: 堕落した思い
  rationale: この箇所には神による裁きとしての引き渡しが示されるが、ἀδόκιμος自体を後代の教理用語で強める必要はない。ἐδοκίμασανとの語の対応を示し、原文の緊張を保った。
- issue: καθὼςを比較として明示するか、理由として表すか
  choice: …ので
  alternative: ちょうど…ように
  rationale: ここでは前半が後半の裁きの根拠を成す。日本語で不自然な比較構文にせず、文脈上の因果的な力を明瞭にした一方、両節の応報的対応は語順と語の反復によって保った。
translation_notes:
  register: 現代の標準的な日本語を用い、荘重さを保ちながら一般読者にも理解できる文体とした。「認識のうちに保つ」はやや硬いが、原文の独特な表現と曖昧さを保存するため本文に残し、より自然な解釈的表現を脚注に示した。
