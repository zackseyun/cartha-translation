    rationale: 原文では「神は…引き渡した」が主節であり、ποιεῖνはその引き渡しに伴う目的・結果を示す不定詞である。日本語の受け身「任せられました」は、神が主語である前半と滑らかにつながらない。
  - severity: medium
    issue: 「良しと認められない思い」が不自然である。
    rationale: ἀδόκιμονは「認められない」「不適格な」の意であり、現行訳は語の対応を優先するあまり日本語としてぎこちない。
