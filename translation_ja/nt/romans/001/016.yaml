source:
  edition: SBLGNT
  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: ja
  text: というのも、私は福音[a]を恥じることはありません。福音は、信じるすべての人に救いをもたらす神の力だからです。まずユダヤ人に、そしてギリシア人[b]にも。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「福音」は「良い知らせ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここで「ギリシア人」は、より広くユダヤ人以外の人々、すなわち異邦人を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: 恥とはしません
  rationale: 羞恥を感じること、また恥じて公に退くことを表す動詞。現在の文脈では、福音を公然と告白するパウロの姿勢を自然かつ端的に示す。
- source_word: εὐαγγέλιον
  choice: 福音
  rationale: 「良い知らせ」を意味する語。日本語では「福音」が聖書用語として広く定着しており、簡潔で威厳ある表現となるため本文に採用し、語義を脚注で補う。
- source_word: δύναμις
  choice: 力
  rationale: 神が救いを実現する有効な働きを表す、簡潔で直接的な対応語。
- source_word: εἰς σωτηρίαν
  choice: 救いをもたらす
  rationale: εἰς の方向・結果の含みを自然な現代日本語で表し、福音が救いに至らせる神の力であることを示す。
- source_word: παντὶ τῷ πιστεύοντι
  choice: 信じるすべての人に
  rationale: παντί の包括的・個別的な範囲と、πιστεύοντι の分詞的な意味を明瞭に保つ。
- source_word: Ἰουδαίῳ
  choice: ユダヤ人
  rationale: Ἕλληνとの救済史的な対比では、地理的な「ユダヤ地方の人」より民族・宗教的な「ユダヤ人」が適切。
- source_word: πρῶτον
  choice: まず
  rationale: 時間的または救済史的な優先を簡潔に示し、その性質を本文で過度に限定しない。
- source_word: Ἕλληνι
  choice: ギリシア人
  rationale: 原文の具体的な語を本文に保持する。パウロ書簡では非ユダヤ人を広く代表し得ることを脚注で示す。
- source_word: τε ... καί
  choice: そして…にも
  rationale: ユダヤ人への優先に続く包含と付加を、自然な日本語で表す。
theological_decisions:
- issue: 「まずユダヤ人に」が示す優先の性質
  choice: 「まず」と訳し、その優先が時間的・救済史的・序列的のいずれかを本文で限定しない
  alternative: 「第一に」または説明を加えて救済史的優先と明示する
  rationale: πρῶτον は優先を表すが、この一節だけでその全性質を説明し切らないため、原文の簡潔さと解釈上の緊張を保つ。
- issue: 「Ἕλληνι」の範囲
  choice: 本文では「ギリシア人」とし、より広く非ユダヤ人を指し得ることを脚注に記す
  alternative: 本文で「異邦人」と訳す
  rationale: 原文の語彙的な具体性を保ちながら、パウロにおける代表的・包括的用法も読者に伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用い、過度に口語的にも古風にもならない端正な文体とした。「福音」は日本語聖書で定着した語として本文に残し、意味を脚注で明示した。原文の二度の γάρ は、第一を前文との論理関係を示す「だからです」に吸収し、第二文を理由説明として自然に接続した。
