id: ROM.1.24
reference: Romans 1:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: ja
  text: そのため、神は彼らを、彼らの心の欲望のうちに、彼らの身体が彼らの間で[a]辱められるに至る汚れへと引き渡しました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らのうちで」。あるいは「彼ら自身の内で」の可能性もある。
    reason: ἐν αὐτοῖςは簡潔で解釈に幅がある。本文では文脈上もっとも自然な集団内・相互的な意味として「彼らの間で」としたが、集団内または各人自身の内を指す可能性もある。
lexical_decisions:
- source_word: Διὸ
  choice: そのため
  rationale: 直前の議論から導かれる帰結を、現代日本語で自然かつ明確に示す。
- source_word: παρέδωκεν
  choice: 引き渡しました
  rationale: 人をある力や状態の支配に渡すという語の強さを保ちつつ、「見捨てた」などの解釈的な語を加えない。
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: その心の欲望のうちに
  rationale: ἐν の領域・状況を表す含みを保ち、「欲望のままに」と因果的・許容的に限定しすぎない。「心」は原文の聖書的な人間理解を保持する。
- source_word: ἐπιθυμίαις
  choice: 欲望
  rationale: 文脈上は性的な方向へ展開するが、この語自体を「情欲」だけに狭めず、広い意味を残す。
- source_word: ἀκαθαρσίαν
  choice: 汚れ
  rationale: 道徳的な不浄を簡潔に表し、現代日本語でも理解しやすい。
- source_word: τοῦ ἀτιμάζεσθαι
  choice: 辱められるという
  rationale: 冠詞付き不定詞と「汚れ」との密接な関係を名詞修飾として保ち、目的か結果かを有限節で断定しない。受動の形も維持する。
- source_word: τὰ σώματα αὐτῶν
  choice: 彼らの体
  rationale: パウロの身体への具体的な言及をそのまま明確に表す。
- source_word: ἐν αὐτοῖς
  choice: 互いの間で
  rationale: 文脈に合う相互的・社会的な意味を自然な日本語で表す。ただし原句には別の取り方も可能なため脚注を付す。
theological_decisions:
- issue: παρέδωκεν を神の司法的な遺棄として明示するか
  choice: 引き渡しました
  alternative: 見捨てました／裁きとして引き渡しました
  rationale: 神の行為の重みは保つ一方、原文にない体系的説明を訳文へ織り込まず、神の裁きと人間の欲望との緊張を残す。
- issue: τοῦ ἀτιμάζεσθαι を目的または結果のどちらかに限定するか
  choice: 辱められるという汚れ
  alternative: 辱められるために／その結果、辱められた
  rationale: ギリシア語の構文が許す目的・結果の含みを一方に固定せず、「汚れ」と身体の辱めとの関係を密接に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、論証の厳粛さを保った。「汚れへと引き渡しました」は日常会話より格調があるが、原文の方向性と神学的な重みを適切に伝える。
