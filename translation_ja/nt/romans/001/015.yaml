id: ROM.1.15
reference: Romans 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως τὸ κατ’ ἐμὲ πρόθυμον καὶ ὑμῖν τοῖς ἐν Ῥώμῃ εὐαγγελίσασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: ja
  text: ですから、私としては、ローマにいるあなたがたにも福音を告げ知らせたい[a]と切に願っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「福音を宣べ伝えたい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: ですから
  rationale: 直前の説明を受けて自分の意向を結論的に述べる接続表現として、現代日本語で自然な「ですから」とした。
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: 私としては……たいと切に願っています
  rationale: 省略を含むギリシア語の慣用的表現であり、単なる準備状態ではなく、進んで行おうとする強い意欲を表すため、このように訳した。
- source_word: καὶ ὑμῖν
  choice: あなたがたにも
  rationale: καὶがローマの人々も福音告知の対象に含まれることを示しているため、係り先を明確にして「にも」とした。
- source_word: τοῖς ἐν Ῥώμῃ
  choice: ローマにいるあなたがた
  rationale: 前置詞句が受け手である「あなたがた」を限定していることを、自然で明瞭な日本語で表した。
- source_word: εὐαγγελίσασθαι
  choice: 福音を告げ知らせたい
  rationale: 良い知らせ、すなわち福音を伝えるという動詞の意味を、特定の形式の説教だけに狭めず、一般読者にも分かりやすく表した。
theological_decisions:
- issue: ローマの信徒たちに対してεὐαγγελίσασθαιを用いること
  choice: あなたがたにも福音を告げ知らせたい
  alternative: あなたがたにも伝道したい
  rationale: 受け手がすでに信徒であるために動詞の意味を弱めたり、未信者への伝道に限定したりせず、本文が持つ緊張をそのまま保った。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、使徒の強い意欲が伝わるようにした。「告げ知らせる」は平易さと宣言的な響きを両立させ、「切に願っています」によってπρόθυμονの積極的な熱意を表した。
