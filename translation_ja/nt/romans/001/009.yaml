id: ROM.1.9
reference: Romans 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: ja
  text: 私が自分の霊において御子の福音に仕えている神は、私があなたがたについて絶えず言及していることの証人です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: 証人
  rationale: 誓約に近い訴えの中で、パウロの言葉が真実であることを証しする方を指すため、「証人」とした。
- source_word: λατρεύω
  choice: 礼拝している
  rationale: 神に対する宗教的奉仕を表す語であり、ここでは単なる一般的な奉仕との混同を避けつつ、祭儀的・献身的含意を伝えるため「礼拝する」とした。
- source_word: ἐν τῷ πνεύματί μου
  choice: 自分の霊をもって
  rationale: ἐνを手段・様態として理解し、パウロの内なる霊による礼拝を自然な日本語で表した。「自分の霊において」も可能。
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: 御子の福音に仕えつつ
  rationale: 二つ目のἐνはパウロの礼拝的奉仕が行われる領域・活動を示すと捉えた。「御子の福音」は属格の曖昧さを保ち、「御子についての福音」と限定しなかった。
- source_word: ἀδιαλείπτως
  choice: 絶えず
  rationale: 中断がまったくないことを必ずしも意味せず、継続的・常時的な言及を簡潔に表す。
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: あなたがたのことを口にしています
  rationale: 直訳は「あなたがたについて言及する」だが、通常は祈りの中で名を挙げることを示す。「覚えている」と過度に解釈せず、自然な日本語にした。
theological_decisions:
- issue: ἐν τῷ πνεύματί μουにおけるπνεῦμαの理解
  choice: 人間であるパウロ自身の霊として「自分の霊」と訳す
  alternative: 「心から」または聖霊への言及と理解する
  rationale: 所有代名詞「私の」が明示されているため、人間の内なる霊を指す表現をそのまま保った。「心から」は分かりやすいが、原文の霊という語を消してしまう。
- issue: τοῦ υἱοῦ αὐτοῦの属格
  choice: 御子の福音
  alternative: 御子についての福音
  rationale: 原文は福音と御子との関係を属格で示すのみで、内容を表す属格に限定していないため、日本語でも曖昧さを保った。
- issue: λατρεύωの宗教的含意
  choice: 礼拝する
  alternative: 仕える
  rationale: この語が神への祭儀的・宗教的奉仕を表す点を明確にした。ただし福音宣教という奉仕の側面も文脈に含まれるため、補助表現として「福音に仕えつつ」とした。
translation_notes:
  register: 現代標準語の丁寧体を用い、誓約的で荘重な調子を保った。「福音」「御子」「霊」「証人」は一般読者にも通じる伝統的な聖書語として残した。長いギリシア語文を日本語で明瞭にするため二文に分けた。
