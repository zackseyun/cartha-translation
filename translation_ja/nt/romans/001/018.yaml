id: ROM.1.18
reference: Romans 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: ja
  text: というのも、神の怒りは、真理を不義によって押さえつけている人々のあらゆる不敬虔と不義に対して、天から現されているのです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「現される」とも訳せます。ギリシア語は現在形です。
    reason: lexical_alternative
  - marker: b
    text: 「不義のうちに真理を押さえつけている人々の、あらゆる不敬虔と不義に対して」とも訳せます。「不義によって」と訳した句は、手段だけでなく、状態または領域を表す可能性もあります。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: 現されている
  rationale: 現在受動形の継続的な含みを保ちつつ、自然な現代日本語とした。「啓示されている」は日本語では専門語的に響きやすい。
- source_word: γὰρ
  choice: からです
  rationale: 直前の内容を根拠づける接続辞であることを、文末の説明表現で自然に示した。
- source_word: ὀργὴ θεοῦ
  choice: 神の怒り
  rationale: 神ご自身の人格的・裁きとしての怒りを弱めず、属格構文を直接的に訳した。
- source_word: ἀπ’ οὐρανοῦ
  choice: 天から
  rationale: 怒りが現される源を簡潔に表した。
- source_word: πᾶσαν ἀσέβειαν
  choice: あらゆる不敬虔
  rationale: 神への畏敬を欠くという語の方向性を保つため「不敬虔」とした。
- source_word: ἀδικίαν
  choice: 不義
  rationale: 単なる社会的不正に限定されない、道徳的・関係的な広がりを保った。
- source_word: ἀνθρώπων
  choice: 人々
  rationale: 男性に限らず人間一般を指す文脈に即した。
- source_word: τῶν ... κατεχόντων
  choice: 押さえつけている
  rationale: κατέχω がこの文脈で真理を抑圧し、その働きを妨げる意味を持つことを明瞭に表した。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: 定冠詞付きの名詞を、意味を狭めず直接的に訳した。
- source_word: ἐν ἀδικίᾳ
  choice: 正しくない行いによって
  rationale: 手段またはあり方を表す可能性を自然な日本語で示した。ただし「不義のうちに」という領域・状態の解釈も可能なため脚注に残した。
theological_decisions:
- issue: ὀργὴ θεοῦを人格的な神の裁きとして訳すか、非人格的な道徳的帰結として弱めるか
  choice: 神の怒り
  alternative: 悪がもたらす当然の結果
  rationale: 属格構文とパウロの議論は神ご自身の裁きとしての応答を示すため、本文の神学的な重みを保った。
- issue: ἐν ἀδικίᾳと前のἀδικίανの関係
  choice: 不義に対して／正しくない行いによって
  alternative: 人々が不義のうちに真理を押さえつけている、その不義に対して
  rationale: 前者は手段の含みを明確にし、後者は状態・領域の含みを保つ。ギリシア語は両方を許すため、本文で一方を採りつつ脚注で曖昧さを保存した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「不敬虔」「不義」は日常語より硬いが、原文の宗教的・道徳的区別と反復を保つため採用した。冒頭のγάρは日本語の自然な論理展開に合わせて文末の「からです」で表した。
