source:
  edition: SBLGNT
  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: ja
  text: 中傷する者、神を憎む者[a]、横暴な者、高慢な者、大言壮語する者、悪事を考え出す者、親に従わない者、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神に憎まれる者」とも訳せる。
    reason: θεοστυγεῖςは、神を憎む人を指す能動的な意味にも、神に憎まれる人を指す受動的な意味にも解されてきたため。
lexical_decisions:
- source_word: καταλάλους
  choice: 中傷する者
  rationale: 人について陰で悪く言い、その名誉を傷つける者を指す。現代日本語として明確で、語の倫理的な強さも保てる。
- source_word: θεοστυγεῖς
  choice: 神を憎む者
  rationale: 悪徳表の中で人間の態度を列挙する流れに合う能動的な意味を本文に採った。ただし、語形については受動的な解釈も歴史的に存在するため、脚注に残した。
- source_word: ὑβριστάς
  choice: 横暴な者
  rationale: 思い上がった態度で他者を侮辱し、乱暴に扱う含みを、身体的暴力だけに限定せず簡潔に表す。
- source_word: ὑπερηφάνους
  choice: 高慢な者
  rationale: 自分を他者より上に置く尊大さを表す、明瞭で品位ある現代日本語である。
- source_word: ἀλαζόνας
  choice: 大言壮語する者
  rationale: 実質以上に自分を誇示する、虚勢を伴う自慢の意味を表し、直前の「高慢」と区別できる。
- source_word: ἐφευρετὰς κακῶν
  choice: 悪事をたくらみ出す者
  rationale: 新たな悪を工夫して考え出すという句の生き生きした意味を、自然な日本語で保つ。
- source_word: γονεῦσιν ἀπειθεῖς
  choice: 親に従わない者
  rationale: 与格の γονεῦσιν と形容詞 ἀπειθεῖς の関係を素直に表し、親に対する不従順という関係的な焦点を保つ。
theological_decisions:
- issue: θεοστυγεῖς の態
  choice: 能動的に「神を憎む者」
  alternative: 受動的に「神に憎まれる者」
  rationale: この箇所は人間の性向や行為を並べる悪徳表であるため、能動的解釈が文脈によりよく合う。しかし受動的解釈も語義上・解釈史上の実質的な可能性なので、神の評価という異なる含意を消さず脚注に示した。
translation_notes:
  register: 簡潔な悪徳表のリズムを保つため、各項目を「〜者」で統一した。現代の一般読者に理解できる明瞭さを優先しつつ、口語的になりすぎない品位ある表現とした。節が次節へ続くため、末尾の読点を保持した。
