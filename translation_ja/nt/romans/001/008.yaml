id: ROM.1.8
reference: Romans 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: ja
  text: まず、イエス・メシアを通して、あなたがたすべてのために私の神に感謝します。あなたがたの信仰[a]が世界中で語り伝えられているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」は、「忠実さ」または「信頼」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: まず
  rationale: パウロが最初の論点を切り出す談話標識として、自然で簡潔な現代日本語にした。μὲνは独立して訳さず、「まず」に含めた。
- source_word: εὐχαριστῶ τῷ θεῷ μου
  choice: 私の神に感謝します
  rationale: 与格の相手と一人称の感謝を直接表し、パウロの個人的な信仰の語調を保った。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: イエス・メシアを通して
  rationale: 属格を伴うδιάの媒介の意味を「通して」で表し、Χριστόςは称号の意味を明示するため「メシア」とした。
- source_word: περὶ πάντων ὑμῶν
  choice: あなたがたすべてのことを
  rationale: 感謝の対象・理由に関わるπερίを、日本語として自然な「ことを」で表した。「すべて」によりπάντωνを保持した。
- source_word: ἡ πίστις ὑμῶν
  choice: あなたがたの信仰
  rationale: πίστιςの基本的で文脈に適した訳として「信仰」を採用し、「忠実さ」「信頼」という語義上の可能性は脚注に残した。
- source_word: καταγγέλλεται
  choice: 語り伝えられている
  rationale: 現在受動形の継続的かつ公に知らされる意味を、自然な日本語の受動表現で示した。
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: 世界中で
  rationale: 広い修辞的範囲を簡潔で自然な日本語として表し、ὅλῳの全体性を「中」によって伝えた。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστόςの訳
  choice: イエス・メシア
  alternative: イエス・キリスト
  rationale: Χριστόςを称号として意味の分かる「メシア」で訳した。日本語では固有名と称号の結合として中黒を用い、原文にない定冠詞は補わなかった。
- issue: ἡ πίστις ὑμῶνにおけるπίστιςの意味
  choice: あなたがたの信仰
  alternative: あなたがたの忠実さ／信頼
  rationale: この文脈ではローマの信徒たちの信仰が広く知られていることを指すと読むのが最も自然だが、語が持つ他の可能性を脚注で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、書簡の感謝表現にふさわしい端正さを保った。「全世界で」より自然な「世界中で」を選び、誇張を説明的に弱めず原文の修辞的広がりを残した。
