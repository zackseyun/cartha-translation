  text: περὶ τοῦ υἱοῦ αὐτοῦ, τοῦ γενομένου ἐκ σπέρματος Δαυὶδ κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/003.yaml
  text: concerning his Son[a], who was descended from the offspring of David according to the flesh[b],
translation:
  language: ja
  text: その御子に関するものです。御子は、肉によれば[a]、ダビデの子孫から出た方です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「肉によれば」とは、人間としての血筋、すなわち地上における出自を指し、罪深い性質を意味するものではありません。
    reason: cultural_note
lexical_decisions:
- source_word: περὶ τοῦ υἱοῦ αὐτοῦ
  choice: その御子に関するものです
  rationale: περίが前節の「福音」の内容を導く関係を示すため、「に関する」とした。「その」は神を受け、「御子」は現代日本語の聖書文体として自然に神の子を指す。
- source_word: τοῦ γενομένου
  choice: 生まれました
  rationale: この文脈のγίνομαιは、ダビデの血統から人として生じたことを表す。「生まれた」は起源と実際の誕生を自然に伝えつつ、御子の存在がその時に始まったと断定する表現にはしていない。
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: ダビデの子孫として
  rationale: σπέρμαの字義は「種」だが、ここでは血統・後裔を表す。「子孫として」は日本語で明瞭にダビデ系の出自を示す。
- source_word: κατὰ σάρκα
  choice: 肉によれば
  rationale: 神学的に重みのあるσάρξを解釈語に置き換えず、「肉」を保持した。「によれば」はκατάの観点・基準を表し、原文の簡潔さと含みを残す。
theological_decisions:
- issue: 神の御子とダビデ系の人間的出自との関係
  choice: 「御子」と「肉によれば、ダビデの子孫として生まれました」を併置する
  alternative: 「人性においてダビデの子孫であった」と教理的に言い換える
  rationale: 原文は御子であることと、ダビデにつながる現実の人間的出自を同時に述べるが、その関係を形而上学的に説明しない。その緊張を訳文でも保つ。
- issue: κατὰ σάρκαにおけるσάρξの意味
  choice: 本文では「肉」を保持し、注で人間的血統を指すと説明する
  alternative: 本文で「人間として」または「人間の血筋によれば」と明示する
  rationale: この箇所では罪深い性質ではなく地上的・人間的な系譜を指すが、パウロの重要語である「肉」を本文から消さない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「御子」「肉によれば」によって原文の荘重さと神学的含意を保持した。前節から続く構文を日本語で理解しやすくするため二文に分けた。
