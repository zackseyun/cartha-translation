  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: ja
  text: あらゆる不義[a]、邪悪、貪欲、悪意に満たされ、ねたみ、殺人、争い、欺き、意地の悪さに満ち、陰口を言う者[b]であり、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての不義」とも訳せる。ギリシア語の表現は包括的な範囲を示す。
    reason: lexical_alternative
  - marker: b
    text: 「うわさ話をする者」または「ひそかに人を中傷する者」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: 満たされ
  rationale: 完了受動分詞が表す、満たされた結果として現在も続く状態を、文脈につながる自然な日本語で表した。
- source_word: πάσῃ
  choice: あらゆる
  rationale: 単数の抽象名詞とともに用いられた包括的な範囲を、明瞭で自然な日本語にした。
- source_word: ἀδικίᾳ
  choice: 不義
  rationale: 社会的不正だけに限定せず、神と人に対する道徳的な正しさの欠如を広く表せる語を選んだ。
- source_word: πονηρίᾳ
  choice: 邪悪
  rationale: 一般的な道徳的悪を表し、後続する κακία と区別した。
- source_word: πλεονεξίᾳ
  choice: 貪欲
  rationale: より多くを得ようとする飽くことのない欲望を簡潔に表す。
- source_word: κακίᾳ
  choice: 悪意
  rationale: 対人的に害を及ぼそうとする意向を表し、広い意味の πονηρία と区別した。
- source_word: μεστοὺς
  choice: 満ち
  rationale: πεπληρωμένους の「満たされ」と表現を変えつつ、原文の語の違いと自然な列挙を保った。
- source_word: φθόνου
  choice: ねたみ
  rationale: 他者の恵まれた状態を快く思わない悪徳を、現代日本語で明瞭に表す。
- source_word: φόνου
  choice: 殺人
  rationale: 単なる殺害一般ではなく、悪徳表にふさわしい道徳的に非難される人殺しを指す。
- source_word: ἔριδος
  choice: 争い
  rationale: 対立や不和を引き起こす好争性を、簡潔で一般的な日本語にした。
- source_word: δόλου
  choice: 欺き
  rationale: 意図的に人をだますことを明瞭に表す。
- source_word: κακοηθείας
  choice: 悪だくみ
  rationale: 害意ある性向やたくらみを示し、すでに「悪意」と訳した κακία との重なりを避けながら区別を保った。
- source_word: ψιθυριστάς
  choice: 陰口を言う者
  rationale: 人に隠れて悪く言う者という語義を、現代の読者に分かりやすく表した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、悪徳表としての簡潔さと厳粛さを保った。節が前後の構文に続くことを示すため、末尾を「であり、」とした。
