id: ROM.1.11
reference: Romans 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπιποθῶ γὰρ ἰδεῖν ὑμᾶς, ἵνα τι μεταδῶ χάρισμα ὑμῖν πνευματικὸν εἰς τὸ στηριχθῆναι ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/011.yaml
  text: For I long to see you[a], so that I may impart some spiritual gift to you to strengthen you[b],
translation:
  language: ja
  text: あなたがたに会いたいと切に願っているからです。何らかの霊的な賜物[a]をあなたがたに分け与え、あなたがたが強められるようにするためです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「霊による賜物」。
    reason: 「霊的な」は、霊に由来する賜物という意味にも理解できるため。
  - marker: b
    text: 別訳「あなたがたを強めるためです」。
    reason: 原文は「あなたがたが強められる」という受動表現だが、日本語では能動的に表すこともできるため。
lexical_decisions:
- source_word: ἐπιποθῶ
  choice: 切に願っている
  rationale: 強い個人的な願いを、現代日本語で自然かつ明瞭に表す。
- source_word: γὰρ
  choice: からです
  rationale: 前節の内容に理由や説明を加える接続関係を示す。
- source_word: ἰδεῖν
  choice: 会いたい
  rationale: 字義は「見る」だが、人を目的語とするこの文脈では、対面することを表す「会う」が自然である。
- source_word: τι
  choice: 何らかの
  rationale: 賜物の内容を特定しない原文の不定性を保つ。
- source_word: μεταδῶ
  choice: 分け与える
  rationale: 単に一方的に授けるとの含みを強めすぎず、持っているものを相手にも与える語義を表す。
- source_word: χάρισμα πνευματικὸν
  choice: 霊的な賜物
  rationale: 特定の奇跡的能力に限定せず、また聖霊による賜物か広い意味での霊的恩恵かという幅を保つ。
- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: あなたがたが強められるよう
  rationale: 目的・意図を示しつつ、原文の受動態を保った自然な日本語とした。
theological_decisions:
- issue: 「霊的な賜物」が特定の奇跡的カリスマを指すか、より広い霊的恩恵を指すか
  choice: 霊的な賜物
  alternative: 御霊による賜物／霊的な恵み
  rationale: 原文は狭い専門的意味に限定していないため、解釈を一つに固定しない表現を採用した。
- issue: パウロが自ら彼らを強めるのか、彼らが強められるのか
  choice: あなたがたが強められるよう
  alternative: あなたがたを強めるため
  rationale: 神的受動の可能性を含む原文の受動態を本文に残し、行為者をパウロだけに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、感情の強さには「切に願う」、使徒的な働きには過度に権威的に響かない「分け与える」を採用した。文末の「からです」「ためです」により、前後の論理関係を読み取りやすくした。
