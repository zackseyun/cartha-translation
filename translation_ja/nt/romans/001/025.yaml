id: ROM.1.25
reference: Romans 1:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: ja
  text: 彼らは神の真理を偽りと取り替え、造り主ではなく造られたものをあがめ、これに仕えました。造り主は永遠にほめたたえられる方です。アーメン。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν
  choice: 取り替え
  rationale: 交換・置換を表す動詞の意味を明確かつ自然な現代日本語で表した。
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: 神の真理
  rationale: 属格の関係を限定しすぎず、原文の簡潔さと神学的な幅を保った。
- source_word: ἐν τῷ ψεύδει
  choice: 偽りと
  rationale: 交換構文に沿って訳した。定冠詞はあるが、日本語で「その偽り」とすると特定の虚偽を過度に限定しうるため、文脈上自然な「偽り」とした。
- source_word: ἐσεβάσθησαν
  choice: あがめ
  rationale: 畏敬・崇敬を示す語として、礼拝に限定しすぎない自然で尊厳ある表現を選んだ。
- source_word: ἐλάτρευσαν
  choice: 仕えました
  rationale: 宗教的奉仕を含む語だが、「仕える」によって原語の奉仕の側面を保ち、「あがめる」との重複を避けた。
- source_word: τῇ κτίσει
  choice: 造られたもの
  rationale: 「被造物」より一般読者に明瞭で、創造されたもの全体を指しうる表現とした。
- source_word: παρὰ τὸν κτίσαντα
  choice: 造り主ではなく
  rationale: 比較・優先を表すπαράがこの文脈では排他的対比をなすため、日本語で明確な対照として表した。
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: 永遠にほめたたえられる
  rationale: 神への頌栄としての受動的形容表現と永続性を自然な日本語で保持した。
theological_decisions:
- issue: 「神の真理」の属格
  choice: 神の真理
  alternative: 神についての真理／神から来る真理
  rationale: 原文が許す主観的・客観的・起源的な含みを一つに決めず、そのまま保持した。
- issue: κτίσιςの範囲
  choice: 造られたもの
  alternative: 被造物／創造された世界
  rationale: 人や物を含む創造物一般を指しうる原文の幅を保ち、「世界」だけに限定しなかった。
- issue: παράの対比
  choice: 造り主ではなく
  alternative: 造り主以上に
  rationale: 語義上は比較的表現も可能だが、偶像礼拝を論じる文脈と二つの動詞の目的語の対照から、置換を示す訳を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「創造主／被造物」の専門語的な対句を避けて「造り主／造られたもの」とした。文末の頌栄と「アーメン」は簡潔で荘重な調子を保った。
