reference: Romans 10:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: ja
  text: なぜなら、あなたが口で「イエスは主である」と告白し、心で、神がイエスを死者の中から復活させたと信じるなら、あなたは救われるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: なぜなら……からです
  rationale: 前節の言葉の根拠を示す接続語として因果関係を明確にし、日本語として自然な呼応表現にした。
- source_word: ἐὰν
  choice: なら
  rationale: 接続法を伴う条件を、明瞭で自然な現代日本語の条件表現で示した。
- source_word: ὁμολογήσῃς
  choice: 告白し
  rationale: 口によって公に認め、表明する意味を保ち、聖書文脈にもふさわしい語を選んだ。
- source_word: ἐν τῷ στόματί σου
  choice: 自分の口で
  rationale: 手段を表す句として自然に訳し、「自分の」は後続する「自分の心で」との対応を明確にする。
- source_word: κύριον Ἰησοῦν
  choice: 「イエスは主である」と
  rationale: 対格句の述語的な力を明示し、告白の内容がイエスの主権であることを自然な日本語で表した。
- source_word: πιστεύσῃς
  choice: 信じる
  rationale: 後続する内容節を真実として受け入れる内面的確信を、直接的に表す。
- source_word: ἐν τῇ καρδίᾳ σου
  choice: 自分の心で
  rationale: 聖書的な内面の確信という意味を保ちつつ、原文の表現に対応させた。
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν
  choice: 神がイエスを……復活させた
  rationale: 神を動作主とするアオリスト能動形を過去の出来事として明確に訳した。日本語では代名詞より指示対象を繰り返すほうが明瞭である。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 復活が死者たちの中からのものであるという原文の複数形と前置詞句を保った。
- source_word: σωθήσῃ
  choice: 救われる
  rationale: 未来受動形の救済論的意味を保持した。日本語では条件節と「なぜなら……からです」の構文により未来の帰結が自然に伝わる。
theological_decisions:
- issue: κύριος の告白定式における訳語
  choice: 主
  alternative: 主人
  rationale: 権威を示す称号であるとともに、周辺文脈の聖書引用との強い響き合いを保つため「主」とした。
- issue: κύριον Ἰησοῦν の統語的表現
  choice: 「イエスは主である」と告白する
  alternative: イエスを主と告白する
  rationale: 告白される内容を明示しつつ、固定した複合称号へ狭めず、述語的な理解を本文に反映した。別の自然な構文は脚注に示した。
- issue: σωθήσῃ の救済的意味
  choice: 救われる
  alternative: 助け出される
  rationale: ローマ書のこの箇所における救いの文脈を保ち、一般的な危難からの救出に限定しない表現を採った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。条件文を「なぜなら……からです」で包み、前節への因果的つながりを自然に示した。「自分の口」と「自分の心」を対応させ、外的な告白と内的な信仰の並行関係を保った。
