reference: Romans 10:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: ja
  text: しかし、信仰に基づく義[a]は、このように語ります。「心の中で、『だれが天に上るだろうか』と言ってはなりません。」[c]（すなわち、メシア[b]を天から連れ下ろすことです。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は「正義」とも訳せます。ここでのδικαιοσύνηには、正しさと正義の両方に関わる意味があります。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「クリストス（キリスト）」です。ここでは称号としての意味を示すため「メシア」と訳しました。
    reason: lexical_alternative
  - marker: c
    text: パウロは申命記30章12節を踏まえ、その言葉をメシアに当てはめています。
    reason: cross_reference
lexical_decisions:
- source_word: δικαιοσύνη
  choice: 義
  rationale: パウロ書簡での法廷的・契約的な響きを保ちつつ、日本語の聖書文体でも簡潔に理解できる語を選んだ。「正義」という意味の可能性は脚注に残した。
- source_word: ἐκ πίστεως
  choice: 信仰から来る
  rationale: ἐκの起点・由来の意味を明示し、直前の律法に基づく義との対比を保った。「信仰による」よりも手段だけに限定しない表現である。
- source_word: πίστεως
  choice: 信仰
  rationale: この箇所では「真実」「忠実」よりも、人が信じることを表す「信仰」が文脈に最も適する。
- source_word: οὕτως λέγει
  choice: こう語ります
  rationale: 現在形と義の擬人化を保ちながら、自然で格調ある現代日本語とした。
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: 心の中で……と言ってはなりません
  rationale: 申命記を踏まえた引用の形を保ち、καρδίαが思考や意志の内面を指すことを自然に表した。
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: だれが天に上るだろうか
  rationale: ἀναβαίνωの上方への移動と修辞疑問の形を簡潔に再現した。
- source_word: Χριστόν
  choice: メシア
  rationale: ここでは固有名のような用法よりも称号として機能しているため、Χριστόςの意味を示す「メシア」とした。
- source_word: καταγαγεῖν
  choice: 引き降ろす
  rationale: 天から下へ連れて来るという方向性を明確にし、説明的不定詞の簡潔さを保った。
theological_decisions:
- issue: 「信仰から来る義」の擬人化
  choice: 「義は、こう語ります」と擬人化を保持した。
  alternative: 「信仰による義については、こう言われています」のように非人格化する。
  rationale: δικαιοσύνηがλέγειの文法上の主語であり、前節との修辞的対比を形作っているため。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: 申命記の引用を救済史的に適用するこの文脈では、称号としての意味が前面に出ている。一方、原語がΧριστόςであることは脚注で明示した。
- issue: τοῦτ’ ἔστιν以下の関係
  choice: 「すなわち」として、先の問いが意味するところを説明する文にした。
  alternative: 「言い換えれば」または「それは……するためである」と訳す。
  rationale: τοῦτ’ ἔστινはパウロによる解説を導き、目的というより先の発言の含意を示すため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用にふさわしい簡潔で格調ある調子を保った。敬体によって擬人化された「義」の発言を自然に示し、原文の修辞疑問と神学的な含みを過度に説明しないようにした。
