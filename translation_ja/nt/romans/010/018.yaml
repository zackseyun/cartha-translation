id: ROM.10.18
reference: Romans 10:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: ja
  text: 'しかし、私は尋ねます。彼らは聞かなかったのでしょうか。もちろん、聞きました。


    「その声は全地に響き渡り、


    その言葉は人の住む世界の果てにまで届いた。」[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「声」は「音」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 詩篇19:4からの引用。パウロはその表現を、宣べ伝えられた知らせが広く届いたことに当てはめている。
    reason: cross_reference
lexical_decisions:
- source_word: Ἀλλὰ λέγω
  choice: しかし、私は尋ねます
  rationale: λέγω は字義的には「言う」だが、ここでは修辞的な問いを導くため、現代日本語では「尋ねます」が自然。「しかし」で議論の転換を示す。
- source_word: μὴ οὐκ ἤκουσαν
  choice: 彼らは聞かなかったのでしょうか
  rationale: μή οὐκ による、肯定の答えを予期する修辞疑問を自然な日本語で表した。アオリストの出来事性を「聞かなかった」で保つ。
- source_word: μενοῦνγε
  choice: いいえ、確かに聞きました
  rationale: 強い肯定を表す応答であり、省略された動詞を補って、問いへの答えを明瞭にした。「いいえ」は直前の否定疑問そのものを退ける。
- source_word: φθόγγος
  choice: 声
  rationale: 「音」も可能だが、続く「言葉」との詩的並行を生かし、伝達される響きを自然に表すため「声」とした。
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: 全地に
  rationale: 普遍的な広がりを表す詩的表現として簡潔な「全地に」を採用し、特定の領土を意味する「土地」は避けた。
- source_word: ἐξῆλθεν
  choice: 響き渡り
  rationale: 字義的には「出て行った」だが、主語が「声」であるため、日本語として自然な「響き渡り」とした。伝播のイメージを保つ。
- source_word: πέρατα
  choice: 果て
  rationale: 「世界の果て」という自然で詩的な慣用表現により、最遠部まで及ぶ意味を保った。
- source_word: οἰκουμένης
  choice: 人の住む世界
  rationale: 単なる物理的な地球ではなく「居住世界」を指す語義を、理解しやすい現代日本語で明示した。
- source_word: τὰ ῥήματα
  choice: 言葉
  rationale: 解釈的な「福音」や「メッセージ」を加えず、原語の複数形と「声」との並行関係を保った。
theological_decisions:
- issue: 詩篇引用中の「その」の指示対象
  choice: 指示対象を明示せず「その声」「その言葉」とする
  alternative: 詩篇19篇の文脈に従って「天の声」とする、またはパウロの適用に従って「宣教者たちの声」とする
  rationale: パウロは詩篇19:4の表現をここで用いているが、代名詞の指示対象を本文で説明していない。天を指すのか、宣教者または宣べ伝えられた知らせへ適用しているのかを訳文で決めず、相互本文的・神学的な緊張を保つ。
- issue: 「聞いた」内容の明示
  choice: 目的語を補わず「聞きました」とする
  alternative: 「福音を聞きました」または「知らせを聞きました」と明示する
  rationale: 文脈上は宣べ伝えられた知らせが念頭にあるが、この節のギリシア語には目的語がないため、訳文で限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。引用部は詩的並行を二行で示した。「人の住む世界」は οἰκουμένη の含意を保ちながら、専門的な「居住世界」より一般読者に分かりやすい表現とした。
