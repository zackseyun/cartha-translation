id: ROM.10.3
reference: Romans 10:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: ja
  text: なぜなら、彼らは神の義[a][b]を知らず、自分の義を打ち立てようとして、神の義に従わなかったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は「正義」とも訳せます。この節の二つの「義」は、正しさ、神との正しい関係、また神が人を正しくする道を含み得ます。
    reason: lexical_alternative
  - marker: b
    text: 「神の義」は、神ご自身の義、神から与えられる義、また神が救いにおいて示す正しい働き、という意味合いを持ち得ます。ギリシア語の表現は一つの意味だけに限定されません。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: 知らず
  rationale: 現在分詞が示す継続的・原因的な状況を、自然な日本語の連用形で表した。意図的な拒絶とまでは断定せず、認識していないことを示す。
- source_word: γὰρ
  choice: なぜなら……からです
  rationale: 前節を説明する接続関係を、現代日本語で明確かつ自然に示す。
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: 義
  rationale: パウロ書簡における、正しさ、正しい関係・身分、また神が人を正しくする働きまで含み得る語として、簡潔で伝統的かつ現代でも通用する「義」を採用した。「正義」の可能性は脚注に残した。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 日本語では属格を自然に「の」で表し、神ご自身の義、神から与えられる義、神の救済的な正しい働きという複数の含意を本文で限定しない。
- source_word: ἰδίαν
  choice: 自分の義
  rationale: ギリシア語では直前の「義」が省略されているが、日本語では補うことで何を打ち立てようとしたのかを明瞭にした。
- source_word: ζητοῦντες
  choice: ……ようとして
  rationale: 現在分詞が表す企て・追求を自然に表し、動機や成否を必要以上に断定しない。
- source_word: στῆσαι
  choice: 打ち立てる
  rationale: ここでのἵστημιは自らの義を確立するという慣用的意味。「打ち立てる」はその積極的な企てを明瞭に伝える。
- source_word: ὑπετάγησαν
  choice: 従わなかった
  rationale: 受動形ながら文脈上は自ら服する意を持つ。「従わなかった」は、神の義の下に服さなかったことを自然な日本語で表す。
theological_decisions:
- issue: 「神の義」（δικαιοσύνη τοῦ θεοῦ）の意味
  choice: 本文では「神の義」とし、属格の意味を一つに限定しない。
  alternative: 「神から与えられる義」「神ご自身の義」「神が救いにおいて示す正しい働き」
  rationale: ギリシア語は所有・起源・神の救済的活動などが重なり得る。特定の教理的解釈に狭めず、パウロの表現が持つ神学的緊張と多層性を保つ。
- issue: δικαιοσύνηの語義
  choice: 「義」
  alternative: 「正義」
  rationale: この文脈では単なる公正さだけでなく、神との正しい関係や神が人を正しくする道を含み得るため「義」を本文に置き、「正義」の語義も脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた丁寧体とした。「なぜなら……からです」で前節との説明関係を保ち、「義」という主要語を反復して原文の論理的対比を明確にした。
