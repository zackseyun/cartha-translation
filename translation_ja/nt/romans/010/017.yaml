  text: ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος ⸀Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/017.yaml
  text: So faith comes from hearing[a], and hearing through the word of Messiah.
translation:
  language: ja
  text: ですから、信仰は聞くことから生じ、聞くことはキリストのことば[a]によるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリストについてのことば」、または「キリストについての知らせ」とも訳せる。ギリシア語の属格は複数の意味に理解できる。
    reason: 「キリストの」に当たる属格が、キリストに由来することばを表すか、キリストを内容とすることばを表すか確定しないため。
lexical_decisions:
- source_word: ἄρα
  choice: ですから
  rationale: 直前の議論から結論を導く推論の接続語として、現代日本語で自然かつ明確にした。
- source_word: πίστις
  choice: 信仰
  rationale: 文脈は、宣べ伝えられた知らせを聞いた人の応答を扱っており、「忠実さ」よりも「信仰」が適切である。
- source_word: ἐξ ἀκοῆς
  choice: 聞くことから生じ
  rationale: ἐκが起源・源を示すため「から」とし、動詞のない原文を自然な日本語にするため「生じ」を補った。ἀκοήが持つ聞く行為と聞かれた内容との幅を過度に限定しないよう「聞くこと」とした。
- source_word: ἡ δὲ ἀκοὴ
  choice: 聞くことは
  rationale: δέは強い対立ではなく緩やかな継続を示すため、独立した逆接語を置かず「は」で次の節につないだ。同じἀκοήには同じ訳語を用いた。
- source_word: διὰ ῥήματος
  choice: ことばによる
  rationale: 属格を伴うδιάの手段・媒介の意味を「による」で表した。ῥῆμαは語られたことばを指し得るため、伝統的で明瞭な「ことば」とした。
- source_word: Χριστοῦ
  choice: キリストの
  rationale: Χριστόςを称号として日本語で定着した「キリスト」と訳し、属格をまず形式的に「の」で保持した。目的語的属格として「キリストについての」と取る可能性は脚注に残した。
theological_decisions:
- issue: この箇所におけるπίστιςの意味
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: 直前の文脈（ローマ10章14–16節）は、宣べ伝えられた福音を聞くことと、それに応答して信じることを扱うため。ただし、訳文に特定の教派的な信仰理解は付加していない。
- issue: ῥήματος Χριστοῦにおける属格の意味
  choice: キリストのことば
  alternative: キリストについてのことば／キリストについての知らせ
  rationale: ギリシア語の属格は、キリストから出ることばとも、キリストを内容とすることばとも理解し得る。本文では構造を保つ訳を採り、目的語的な理解を脚注に示して曖昧さを保存した。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、聖書本文にふさわしい落ち着いた調子を保った。「聞くこと」の反復によって原文の修辞的連鎖を残し、説明的に「宣教」や「福音」を本文へ補うことは避けた。
