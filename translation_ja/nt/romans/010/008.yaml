id: ROM.10.8
reference: Romans 10:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: ja
  text: では、何と言っているのでしょうか。「ことばはあなたの近くにあり、あなたの口に、またあなたの心にある。」[a] すなわち、私たちが宣べ伝えている信仰のことばです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 申命記30章14節からの引用。パウロはその表現を、宣べ伝えられる福音のことばに当てはめている。
    reason: cross_reference
  - marker: b
    text: 「信仰のことば」は「信仰のメッセージ」とも訳せる。「信仰」に当たるギリシア語は、文脈によって「信頼」または「忠実さ」を意味することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: では
  rationale: 直前の議論との対照を示しつつ、引用を導入する日本語として自然である。「しかし」よりも、この箇所の論の展開に滑らかにつながる。
- source_word: τί λέγει
  choice: 何と言っているのでしょうか
  rationale: 主語を補わず、ギリシア語にある暗黙性を保つ。文脈上は引用される聖書のことばを指す。
- source_word: Ἐγγύς σου
  choice: あなたの近くにあり
  rationale: 近接を表す簡潔な比喩を保ち、申命記からの引用の響きを伝える。
- source_word: τὸ ῥῆμα
  choice: ことば
  rationale: 「メッセージ」より原文の簡潔さを保ち、後半の同語との対応も明確にする。
- source_word: ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου
  choice: あなたの口に、またあなたの心にある
  rationale: 身体的・内面的な対句をそのまま保つ。「心」はκαρδίαの標準的で自然な訳語。
- source_word: τοῦτ’ ἔστιν
  choice: これは……のことです
  rationale: 引用中の「ことば」をパウロが説明している関係を、明瞭で自然な日本語にする。
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: 信仰のことば
  rationale: 先のῥῆμαとの語彙的連結を保ち、属格が示す内容・性質を一つに限定しすぎない。
- source_word: ὃ κηρύσσομεν
  choice: 私たちが宣べ伝えている
  rationale: 公に告げ知らせるκηρύσσωの意味を、聖書本文にふさわしい現代日本語で表す。
theological_decisions:
- issue: τὸ ῥῆμα τῆς πίστεωςにおけるπίστιςの解釈
  choice: 信仰
  alternative: 信頼／真実（忠実）
  rationale: この文脈では、信仰を内容または特徴とする宣教のことばを指すと理解できるが、属格の関係を本文で狭く確定せず「信仰のことば」とした。πίστιςの他の語義は注に示す。
- issue: 申命記30章14節の引用の適用
  choice: 引用とパウロの説明を本文で区別する
  alternative: 引用自体を福音のメッセージとして意訳する
  rationale: パウロは引用後に「これは」と説明を加えているため、その構造を保ち、元の引用とキリストを告げる宣教への適用を混同しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、引用部分は簡潔で格調ある調子を保った。「ことば」を反復して原文のῥῆμαの連結を示し、神学的な属格の曖昧さは解消しすぎないようにした。
