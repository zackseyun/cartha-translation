  source_fidelity: ギリシア語本文の受動態（ἀποσταλῶσιν）、「告げ知らせる」（κηρύξωσιν）、および引用中の「良いことを告げ知らせる人々」「足」という比喩は、全体として忠実に反映されている。本文には「平和」の語を加えず、SBLGNTの本文に従っている。もっとも、文頭の「また」はδέの論理的な接続を日本語でやや不自然な単純付加として響かせるため、「では」とするのが適切である。
  naturalness: 「では、遣わされなければ、どうして宣べ伝えるのでしょうか」は現代標準語として自然であり、前後の論証を受ける問いとして明確である。「宣べ伝える」はこの文脈では通用する格調を保つ。「次のように書かれています」は引用導入として「こう書かれています」よりわずかに自然で明確である。
  terminology: 「遣わされる」は受動態と送り手の含意を保つ。「宣べ伝える」は制度化された職務だけを指す「説教する」を避けつつκηρύσσωに対応する。「良いことを告げ知らせる人々」はτὰ ἀγαθάを「福音」に狭めず、εὐαγγελιζομένωνの知らせを伝える意を保つ。
