id: ROM.10.15
reference: Romans 10:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: ja
  text: では、遣わされなければ、どうして宣べ伝えるのでしょうか。次のように書かれています。「良いことを告げ知らせる人々[b]の足は、なんと美しいことか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「なんと喜ばしいことか」または「なんと時宜にかなっていることか」とも訳せる。この語は外見の美しさだけでなく、使者の到着が歓迎すべきもので、ふさわしい時に来たという含みを持ちうる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「良いことを告げ知らせる人々」。「良い知らせをもたらす人々」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: 宣べ伝える
  rationale: 公に告知する、布告するという意味を保ちつつ、文脈上の福音宣教を自然に表す。「説教する」ほど教会内の特定の行為に限定しない。
- source_word: ἀποσταλῶσιν
  choice: 遣わされなければ
  rationale: 他者によって派遣されることを示す受動態をそのまま保ち、送り手への依存を表した。
- source_word: καθὼς γέγραπται
  choice: こう書かれています
  rationale: 聖書引用を導入する定型句として、現代日本語で自然かつ格調を保つ表現とした。
- source_word: ὡραῖοι
  choice: 美しい
  rationale: 引用文の印象的な比喩を保持した。語には使者の到着が好ましく、時宜にかなっているという含みもあり、脚注で示した。
- source_word: πόδες
  choice: 足
  rationale: 知らせを携えて到着する使者を描く身体的な比喩を、原文どおり保持した。
- source_word: εὐαγγελιζομένων
  choice: 告げ知らせる人々
  rationale: 良い知らせを伝える行為を表す分詞として訳し、特定の教会職や形式的説教に限定しなかった。
- source_word: τὰ ἀγαθά
  choice: 良いこと
  rationale: 定冠詞付き中性複数形の「良い事柄」を明示し、直前の動詞と合わせて単に「福音」と一語にまとめることを避けた。
theological_decisions:
- issue: 使者についての引用と福音宣教との関係
  choice: 遣わされた者が公に告げ知らせるという流れを示しつつ、引用では良い知らせを携える使者の広いイメージを保持した。
  alternative: 「説教する者」「福音を説教する者」と訳し、制度的または礼拝内の宣教職を強く示す。
  rationale: パウロの議論には派遣と宣教の関係があるが、引用自体は良いことを告げる使者の到着を喜ぶ表現であり、特定の教会職に限定する根拠はない。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書引用には簡潔で格調ある調子を保った。「宣べ伝える」は宗教的文脈で通用するが、「説教する」より広い公的告知を表す。引用内では原文の「足」という具体的な比喩を残した。
