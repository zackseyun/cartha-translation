id: ROM.10.1
reference: Romans 10:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: ja
  text: 兄弟たち[a]、私の心の願いと、彼らのために神にささげる祈りは、彼らが救われることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹の皆さん」とも訳せる。ギリシャ語は男性複数形だが、男女を含む集まりへの呼びかけにも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: 兄弟たち
  rationale: 呼びかけに用いられた男性複数形を本文で保ちつつ、現代日本語として自然な形にした。文脈上は女性を含む会衆全体への呼びかけであり得るため、その点は脚注で示す。
- source_word: εὐδοκία τῆς ἐμῆς καρδίας
  choice: 私の心の願い
  rationale: ここでの εὐδοκία は、好意や喜悦よりもパウロが切に望むことを表す。「私の心の願い」は属格関係を保ちながら自然に伝える。
- source_word: δέησις
  choice: 祈り
  rationale: 神に向けられた切実な願い・嘆願を指す。本文では平明な「祈り」とし、「神にささげる」によって祈願の方向を明確にした。
- source_word: πρὸς τὸν θεόν
  choice: 神にささげる
  rationale: πρός が示す祈りの方向を、日本語として自然な連体修飾にした。単なる位置ではなく、神に向けた祈りであることを表す。
- source_word: ὑπὲρ αὐτῶν
  choice: 彼らのために
  rationale: ὑπέρ の利益・代理の意味を簡潔に表す。αὐτῶν の指示対象は前後の文脈に委ね、本文では代名詞を保った。
- source_word: εἰς σωτηρίαν
  choice: 彼らが救われること
  rationale: εἰς が表す目標を自然な日本語で明示した。原文には「彼らの」に当たる所有表現はないが、祈りの対象である αὐτῶν に関わる救いという統語上自然な意味を表す。
- source_word: μέν
  choice: 訳語を明示しない
  rationale: 談話上の軽い提示・対照を示すが、この節には対応する δέ がなく、日本語で「確かに」などを加えると過度に強調されるため、文の構成に含ませた。
theological_decisions:
- issue: Ἀδελφοί の性を含む呼びかけ
  choice: 本文は「兄弟たち」
  alternative: 「兄弟姉妹の皆さん」
  rationale: 原文の男性複数形を本文で保つ一方、当時の用法では男女を含む共同体全体を指し得るため、包括的な語用を脚注で明記した。
- issue: 救いの対象と祈りの目標
  choice: 「彼らが救われること」
  alternative: 「救いに至ること」または「彼らの救い」
  rationale: εἰς σωτηρίαν の目標の意味と、ὑπὲρ αὐτῶν との自然な結び付きを明瞭にした。ただし救いの仕組みや成就時点について本文以上の限定は加えていない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、呼びかけには聖書本文としての品位を保った。「神にささげる祈り」は方向性を自然に示し、「彼らが救われることです」は原文の名詞句を日本語として分かりやすく節に展開した。
