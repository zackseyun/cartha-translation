id: ROM.10.11
reference: Romans 10:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφή· Πᾶς ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/011.yaml
  text: For the Scripture says[a], “Everyone who believes in him will not be put to shame.”
translation:
  language: ja
  text: というのは、聖書はこう言っています。「この方を信じる者は、だれも辱められることがない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「恥じることがない」または「失望させられることがない」。
    reason: καταισχυνθήσεταιは、恥を感じること、公に辱められること、期待を裏切られて失望することの意味範囲を持ち得るため。
lexical_decisions:
- source_word: λέγει
  choice: 言っています
  rationale: 聖書引用の導入における現在形を、現代日本語で自然な継続的現在として表した。
- source_word: γὰρ
  choice: 実際
  rationale: 直前の主張を聖書によって根拠づける接続辞の働きを、文脈上自然な形で示した。
- source_word: ἡ γραφή
  choice: 聖書
  rationale: パウロの引用定型句では、単なる「書かれたもの」ではなく聖なる書を指すため。
- source_word: Πᾶς ὁ πιστεύων
  choice: 信じる者は、だれも
  rationale: 実体詞的な分詞句の包括的・一般的な意味を保ち、性別を限定せず自然な日本語で表した。
- source_word: ἐπ’ αὐτῷ
  choice: この方を
  rationale: πιστεύωとἐπί＋与格が表す、ある人物に信頼を置く意味を「信じる」と組み合わせて自然に表した。指示対象を固有名で補わず、代名詞的な表現を保った。
- source_word: οὐ καταισχυνθήσεται
  choice: 辱められることがありません
  rationale: 未来受動形と、公に恥や失望を被るというイザヤ書引用の含みを保った。日本語では確実な将来を丁寧な現在形で自然に表せる。
theological_decisions:
- issue: Πᾶς ὁ πιστεύωνの文法上の男性単数
  choice: 信じる者は、だれも
  alternative: 信じるすべての人は
  rationale: この男性単数形は男性だけを指すのではなく、一般的・包括的な用法であるため、性別を限定しない表現とした。
- issue: αὐτῷの指示対象
  choice: この方
  alternative: 彼／キリスト
  rationale: 文脈上はキリスト／主を指すが、引用文の代名詞的な形を保ち、本文中で固有の説明を加えなかった。
- issue: καταισχυνθήσεταιが表す恥の性質
  choice: 辱められることがありません
  alternative: 恥じることがありません
  rationale: 受動態を保ち、信じる者が最終的に失望させられたり面目を失ったりしないという公的な汚辱・ vindication の含みを優先した。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準語。「この方」は指示対象への敬意を保ちながら、ギリシア語の代名詞を過度に説明しない表現。「辱められる」はやや格調があるが、受動態と引用背景を簡潔に保持する。
