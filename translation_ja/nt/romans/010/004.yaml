  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: ja
  text: というのも、メシアは、信じるすべての人に義[b]をもたらすための律法の終わり[a]だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「目標」「完成」または「成就」とも訳せる。ここで「終わり」と訳したギリシャ語は、終結点だけでなく、目標や完成を意味することもある。
    reason: alternative_reading
  - marker: b
    text: パウロの用法では「正義」とも訳し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: 終わり
  rationale: 「終点」「目標」「完成・成就」を含み得る語であるため、本文では簡潔な「終わり」とし、その意味の幅を脚注で保持した。
- source_word: νόμου
  choice: 律法
  rationale: 文脈上、抽象的な法一般ではなく、イスラエルに与えられたモーセの律法を指す。日本語では定冠詞を補わず「律法」とするのが自然である。
- source_word: Χριστὸς
  choice: メシア
  rationale: ここではイスラエルの律法と契約の希望との関係が論じられており、固有名のような「キリスト」より称号としての意味を明示する「メシア」が適切である。
- source_word: εἰς δικαιοσύνην
  choice: 義をもたらす
  rationale: εἰς の目的・結果へ向かう力を自然な現代日本語で表した。圧縮されたギリシャ語の構文を明瞭にしつつ、義が信じる者に及ぶという方向性を保つ。
- source_word: δικαιοσύνην
  choice: 義
  rationale: パウロ書簡における神学的・関係的な含意を保つ標準的な訳語である。「正義」という語義の可能性は脚注に残した。
- source_word: παντὶ τῷ πιστεύοντι
  choice: 信じるすべての人に
  rationale: 分詞の継続的・人物指示的な形を保ち、対象が例外なくすべての信じる者であることを自然に表した。
- source_word: γὰρ
  choice: からです
  rationale: 前節までの議論を理由づける説明接続を、日本語の文末表現によって自然に示した。
theological_decisions:
- issue: τέλος νόμου がモーセの律法との関係で何を意味するか
  choice: 本文では「律法の終わり」とし、終結と目標・完成の両方を残す
  alternative: 「律法の目標」「律法の完成」「律法の成就」
  rationale: τέλος は終結点と目的・完成の双方を表し得る。どちらか一方に限定すると、この節にある真正な解釈上の緊張を解消してしまうため、本文と脚注を合わせて意味の幅を保持した。
- issue: Χριστός の訳し方
  choice: メシア
  alternative: キリスト
  rationale: イエスとイスラエルの律法との関係が中心となる文脈なので、称号としての意味が前景化している。
- issue: δικαιοσύνη の訳し方
  choice: 義
  alternative: 正義
  rationale: 「義」はこの文脈におけるδικαιοσύνηの法廷的・契約的・関係的な含みを過度に限定せず保持する。「正義」も語義上可能なので脚注に示した。
- issue: εἰς δικαιοσύνην の統語的関係
  choice: メシアが信じるすべての人に義をもたらすという結果・方向として表現
  alternative: 「信じるすべての人が義に至るための、律法の終わり」
  rationale: 原文は極度に圧縮されている。日本語として理解可能にするため結果の関係を明示したが、義の授与の仕組みや「義と認める」という法廷的解釈までは本文に加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、文末の「からです」でγάρの説明的なつながりを表した。「義とされる」のような解釈的補足を避け、原文の簡潔さと神学的な幅を保った。
