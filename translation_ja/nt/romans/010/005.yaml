id: ROM.10.5
reference: Romans 10:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: ja
  text: というのも、モーセは律法による義[a]について、「その義を行う人[b]は、その義によって生きる[c]」と書いています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は「正義」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では文法上男性単数だが、ここではその義を行う人一般を指す。
    reason: cultural_note
  - marker: c
    text: 別訳「その義の中で生きる」。パウロはレビ記18章5節を踏まえている。
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: というのも
  rationale: 直前の議論を説明する接続を、現代日本語で自然に示す。
- source_word: γράφει
  choice: 書いています
  rationale: 現在形の引用定型を保ち、聖書に現に記されていることを表す。
- source_word: δικαιοσύνην
  choice: 義
  rationale: ローマ書におけるパウロの対比と法廷的・神学的含意を簡潔に保つ定訳。別訳「正義」は脚注に示す。
- source_word: τὴν ἐκ τοῦ νόμου
  choice: 律法による
  rationale: ἐκの起源・源泉の意味を、日本語として自然に表しつつ、信仰による義との対比を保つ。
- source_word: ὁ ποιήσας ἄνθρωπος
  choice: それを行う人
  rationale: 分詞の一般原則的な意味を表し、ἄνθρωποςの代表的・包括的な指示を日本語の「人」で自然に示す。目的語を「それ」として、ギリシア語本文の指示関係を保つ。
- source_word: ζήσεται
  choice: 生きる
  rationale: 未来の宣言を日本語の引用文として自然に表し、レビ記18章5節への反響を保つ。
- source_word: ἐν αὐτῇ
  choice: それによって
  rationale: 単数女性代名詞の形を「それ」で保ち、ἐνの手段的理解を自然な日本語にする。より字義的な別訳は脚注に示す。
theological_decisions:
- issue: パウロの対比における δικαιοσύνη の訳語
  choice: 義
  alternative: 正義
  rationale: 「義」は律法による義と信仰による義の神学的連関を保つ。「正義」も語義上可能なので脚注に残す。
- issue: ὁ ποιήσας ἄνθρωπος の代表的意味
  choice: それを行う人
  alternative: それを行う者／男
  rationale: ギリシア語は文法上男性単数だが、原則の適用対象は一般の人である。日本語の「人」はこの代表的意味を自然に伝え、性別を不必要に限定しない。
- issue: ἐν αὐτῇ の指示対象と意味
  choice: それによって
  alternative: その中で
  rationale: 本文の単数形と曖昧さを「それ」で保ちつつ、レビ記18章5節を踏まえた手段的意味を本文に採用する。場所・領域を表す字義的可能性は脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「というのも」で前節との説明的接続を示し、引用部では「それ」を用いて原文の単数形と指示関係の余地を保った。
