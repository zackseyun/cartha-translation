id: ROM.10.14
reference: Romans 10:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: ja
  text: それでは、信じていない方を、人々がどうして呼び求めるのでしょうか。また、その方について聞いたことがない人が、どうして信じるのでしょうか。また、宣べ伝える人がいなければ、どうして聞くのでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「聞いたことのない方を、どうして信じるのでしょうか」。
    reason: οὗ οὐκ ἤκουσανは直訳すれば人物を聞く表現となるが、この文脈では通常、その方について告げ知らせを聞くことを指す。本文では自然な日本語でこの意味を明示し、直訳の形を脚注に残す。
lexical_decisions:
- source_word: Πῶς οὖν
  choice: それでは、どうして
  rationale: οὖνの推論的なつながりと、三つの修辞疑問からなる議論の流れを、自然な現代日本語で保った。
- source_word: ἐπικαλέσωνται
  choice: 呼び求めるのでしょうか
  rationale: 主を呼び求める、すなわち主に助けを求めてその名を呼ぶという直前の文脈を保つ。接続法を修辞疑問として自然に表した。
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: 信じたことのない方を
  rationale: εἰςが示す信仰の向かう対象を日本語の目的語で自然に示し、完了した経験の欠如を「たことのない」で表した。
- source_word: πιστεύσωσιν
  choice: 信じるのでしょうか
  rationale: πιστεύωを一貫して「信じる」とし、修辞疑問の連鎖を保った。
- source_word: οὗ οὐκ ἤκουσαν
  choice: 聞いたことのない方を
  rationale: 属格関係詞を過度に説明せず、「その方について聞く」と「その方自身を聞く」の間にある原文の解釈上の幅を可能な限り残した。
- source_word: ἀκούσωσιν
  choice: 聞くのでしょうか
  rationale: 前節のἤκουσανとの語彙的連鎖を保つため、同じ「聞く」を用いた。
- source_word: χωρὶς κηρύσσοντος
  choice: 宣べ伝える人がいなければ
  rationale: κηρύσσωの公に告げ知らせる働きを「宣べ伝える」で表し、分詞なので特定の職制名ではなく、その行為をする人として訳した。
theological_decisions:
- issue: πιστεύωに関する信仰表現
  choice: 信じる／信じた
  alternative: 信頼する／信仰を置く
  rationale: パウロの語彙上の連鎖を簡潔に保ち、特定の神学的定義を訳文へ付加しないため、「信じる」を採用した。
- issue: οὗ οὐκ ἤκουσανにおける聞く対象
  choice: 聞いたことのない方
  alternative: その方について聞いたこともない
  rationale: ギリシア語は「その方自身を聞く」と「その方について聞く」の両方に理解されうる。本文では日本語として簡潔で、ある程度その幅を残す表現を採用し、明示的な別訳を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、修辞疑問の反復と論理的な連鎖を保持した。「方」により指示対象への敬意を自然に示し、「宣べ伝える」は聖書語として定着しつつ一般読者にも理解可能な表現として採用した。
