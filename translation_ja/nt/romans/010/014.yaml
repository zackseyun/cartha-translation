revisions:
- from: それでは、信じたことのない方を、どうして呼び求めるのでしょうか。また、聞いたことのない方を、どうして信じるのでしょうか。また、宣べ伝える人がいなければ、どうして聞くのでしょうか。[a]
  to: それでは、信じていない方を、人々がどうして呼び求めるのでしょうか。また、その方について聞いたことがない人が、どうして信じるのでしょうか。また、宣べ伝える人がいなければ、どうして聞くのでしょうか。[a]
  rationale: 原文の修辞疑問、推論を示す「それでは」、および三段階の連鎖を維持した。「信じたことのない方を」を「信じていない方を」として、ギリシア語アオリストがこの論証で示す既存の不信を自然に表した。第二の問いは、日本語での誤解を避けるため『その方について聞いたことがない』とし、直訳可能性は脚注に保持した。
  reviewer_model: gpt-5.6-terra
