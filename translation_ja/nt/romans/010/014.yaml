    issue: οὗ οὐκ ἤκουσανの主文訳が日本語として曖昧かつ不自然
    rationale: 「聞いたことのない方を」は、聞く対象が人物そのものであるように響き、文脈上の『その方について聞く』を十分に伝えません。属格目的語を『その方について聞く』と訳すのが自然で、原文の通常の用法にも合います。
  - severity: low
    issue: 各問いの担い手と指示対象が省略されすぎている
    rationale: 日本語では「人々が」と「その方」を補うと、信じていない人々と呼び求められる方との関係が明瞭になり、原文の意味を変えずに読みやすくなります。
  revised_text: それでは、信じていない方を、人々がどうして呼び求めるのでしょうか。また、その方について聞いたことがない人が、どうして信じるのでしょうか。また、宣べ伝える人がいなければ、どうして聞くのでしょうか。[a]
