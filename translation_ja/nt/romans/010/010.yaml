  source_fidelity: 原文の二つの与格（「心で」「口で」）と、対応する二つのεἰς句（「義に至り」「救いに至る」）を過不足なく保持している。「人は」は一般的・格言的な叙述として、両動詞の非人称的な用法を自然な日本語で表している。文末の「からです」はγάρの説明的機能を反映し、前節から続く文脈に適切である。
  naturalness: 「人は心で信じて義に至り、口で告白して救いに至るからです」は明瞭で自然な現代標準日本語であり、原文の内面／外面および信仰／告白の並行もよく伝わる。「義に至る」はやや聖書的な表現だが、目標・結果を表すεἰςを余計に解釈せずに保つため、この文脈では適切である。
