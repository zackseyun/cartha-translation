id: ROM.10.10
reference: Romans 10:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: ja
  text: 人は心で信じて義[a]に至り、口で告白して救いに至るからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義」。ギリシア語「ディカイオシュネー」は「正義」とも訳せるが、パウロ書簡では通常「義」と訳される。
    reason: δικαιοσύνηの主要な語義上の別訳を示しつつ、パウロ的用法の標準訳を明確にするため。
lexical_decisions:
- source_word: καρδίᾳ
  choice: 心で
  rationale: 与格の手段・領域のニュアンスを自然な日本語で表し、内面的な信仰を示す。
- source_word: γὰρ
  choice: からです
  rationale: 前節を説明する接続機能を、日本語として自然な文末表現で保持する。
- source_word: πιστεύεται
  choice: 人は…信じて
  rationale: 受動形による一般的・非人称的な叙述を、自然な日本語の総称的な「人は」で表す。
- source_word: εἰς δικαιοσύνην
  choice: 義に至り
  rationale: εἰςの目標・結果への方向性を「に至る」で保ち、因果関係を必要以上に機械的に限定しない。
- source_word: δικαιοσύνην
  choice: 義
  rationale: パウロ書簡における法廷的・契約的・倫理的な意味の広がりを保つ標準的な聖書用語である。
- source_word: στόματι
  choice: 口で
  rationale: καρδίᾳとの内面・外面の並行関係を簡潔かつ自然に示す。
- source_word: δὲ
  choice: （読点による並列）
  rationale: 二つの節は対立よりも補完的な対応関係にあるため、明示的な逆接語を置かず並列で表す。
- source_word: ὁμολογεῖται
  choice: 告白して
  rationale: 直前の文脈にある、イエスを主と口で公に認める行為を表し、πιστεύεταιとの並行を保つ。
- source_word: εἰς σωτηρίαν
  choice: 救いに至る
  rationale: 目標または結果を示すεἰςを、前半と同じ構文で訳して原文の均整を保つ。
- source_word: σωτηρίαν
  choice: 救い
  rationale: パウロ的文脈における現在的・終末的な解放の幅を保つ標準的な訳語である。
theological_decisions:
- issue: 信仰・告白と義・救いとの関係
  choice: 「心で信じて義に至り、口で告白して救いに至る」と並行して訳す。
  alternative: 告白を救いの単なる証拠と明示する、または救いを獲得する追加的功績と明示する。
  rationale: 原文は二つのεἰς句を並行させているが、救いの秩序を機械的に説明してはいない。その緊張を訳文でも保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、説明節としての品位を保った。「人は」は一般化された主語であり、特定の集団に限定しない。前半と後半の構文をそろえ、原文の内面と外面の対句を保持した。
