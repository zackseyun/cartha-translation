review_pass:
  verdict: revise
  source_fidelity: 「すべての人が…わけではありません」はοὐ πάντεςの部分否定を正確に表し、「福音に従った」はὑπήκουσανの従順な応答を保っています。しかし、γάρは根拠・説明を導く語であり、草案の「イザヤもこう言っています」の「も」ではこの関係が表されず、「も」は原文にない付加的な含意も生みます。引用のἀκοήは「伝えたこと」でも文脈上可能ですが、主文は「知らせ／報告」とするほうが、語が指す伝達内容を過度に話者の行為として限定せず、原文と引用の表現により近くなります。
  naturalness: 丁寧体は明瞭で自然です。「なぜなら、イザヤはこう言っています」とすることで、現代標準日本語として不自然にならず、前文への論証上のつながりも明確になります。「私たちの知らせ」は引用文として自然です。
  terminology: 「福音」「主よ」「イザヤ」は標準的で適切です。「福音に従った」は、単なる聴取に弱めず、特定の教理的説明を加えない訳として適切です。ἀκοήの脚注は「聞かせたこと」を含めず、語義範囲に即して「聞き／聞いた知らせ（報告）」を示すのが安全です。
