    rationale: ここでのἀκοήは聞かれる内容、すなわち知らせ・報告を指す。日本語の「私たちの知らせ」はその内容性を自然に保ち、脚注で「聞き」という語の幅を示せる。
  - severity: low
    issue: 脚注の「私たちの聞かせたこと」は原語の直訳的説明として不正確である。
    rationale: ἀκοήは「聞くこと／聞かれた内容・知らせ」を表し、「聞かせる」という使役動作を語形自体は表さない。
