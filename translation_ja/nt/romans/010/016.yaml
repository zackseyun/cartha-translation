id: ROM.10.16
reference: Romans 10:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ· Ἠσαΐας γὰρ λέγει· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/016.yaml
  text: But not all obeyed the good news[a]. For Isaiah says, “Lord[b], who has believed our message?”
translation:
  language: ja
  text: しかし、すべての人が福音[a]に従ったわけではありません。なぜなら、イザヤはこう言っています。「主よ、だれが私たちの知らせ[b]を信じたでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「良い知らせ」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私たちの報告」。直訳的には「私たちの聞き」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の議論との対照を、簡潔で自然な現代日本語で示す。
- source_word: οὐ πάντες
  choice: すべての人が……わけではありません
  rationale: 全否定ではなく部分否定であることを明確に保つ。
- source_word: ὑπήκουσαν
  choice: 従った
  rationale: 単に聞くことではなく、聞いて応じ従うというὑπακούωの強い意味を保つ。
- source_word: τῷ εὐαγγελίῳ
  choice: 福音
  rationale: パウロ書簡で定着した自然で簡潔な訳語。語義を明示する「良い知らせ」は脚注に示す。
- source_word: Ἠσαΐας γὰρ λέγει
  choice: イザヤもこう言っています
  rationale: γάρが前文の根拠を示す流れを日本語の「も」で自然につなぎ、λέγειの現在形を「言っています」で表す。
- source_word: Κύριε
  choice: 主よ
  rationale: 呼格を、現代日本語でも自然で敬意ある呼びかけとして訳す。
- source_word: τίς ἐπίστευσεν
  choice: だれが……信じたでしょうか
  rationale: 修辞疑問の形を保持し、アオリストを文脈に即した自然な過去形で表す。
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: 私たちの伝えたこと
  rationale: ἀκοήがここでは聞かされた報告・知らせの内容を指すことを、曖昧さを過度に解消せず自然な日本語で示す。直訳に近い別案は脚注に残す。
theological_decisions:
- issue: ὑπήκουσαν τῷ εὐαγγελίῳが表す福音への応答
  choice: 「福音に従った」と訳す
  alternative: 「福音を聞き入れた」「福音に耳を傾けた」
  rationale: 原語は単なる聴取でなく服従を表すため、信仰と従順な応答との結び付きを保つ一方、救いの仕組みに関する特定教派の説明は加えない。
- issue: イザヤ引用中のἀκοήの意味
  choice: 「私たちの伝えたこと」と訳す
  alternative: 「私たちの知らせ」「私たちが聞いたこと」
  rationale: この箇所では宣べ伝えられ、聞かれる内容という意味が自然である。ただし語が「聞くこと／聞かされた知らせ」の双方に関係するため、別訳を脚注に示して意味の幅を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。部分否定を誤解なく示し、引用は自然な敬語調ではなく聖書本文に適した丁寧体で統一した。
