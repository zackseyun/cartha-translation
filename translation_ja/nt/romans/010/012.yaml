id: ROM.10.12
reference: Romans 10:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: ja
  text: ユダヤ人とギリシア人との間に区別はありません[a]。同じ主がすべての人の主であり[b]、主を呼び求めるすべての人に豊かに与えてくださるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「ギリシア人」。ここでは「ユダヤ人」との対句により、非ユダヤ人を指しています。「異邦人」と訳すこともできます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「同じ主がすべての人の上におられ」。
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: 区別
  rationale: 集団間に設けられる違いを表す語であり、文脈の社会的・救済論的な要点を過度に説明せず保つ。
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: ユダヤ人とギリシア人
  rationale: 原文の「ギリシア人」を保持する。この対句は文脈上、ユダヤ人と非ユダヤ人の対照として機能する。
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: すべての人の主は同じ方
  rationale: 無冠詞的な述語関係を自然な日本語で明示し、πάντωνを「すべての人の」として主の普遍的な支配を表す。別案「すべての人の上におられる同じ主」も可能。
- source_word: κύριος
  choice: 主
  rationale: ローマ10章の文脈でキリスト論的・聖書的な響きを持つ称号であり、「主人」などより適切である。
- source_word: πλουτῶν εἰς πάντας
  choice: すべての人に豊かに恵みを与えてくださる
  rationale: 直訳的な「豊かである」は現代日本語では対象への恩恵が伝わりにくいため、豊かさが呼び求める者へ及ぶという比喩の意味を自然に表した。「恵み」は文脈上補われた語で、主の惜しみない好意・恩恵を示す。
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: ご自分を呼び求めるすべての人
  rationale: ἐπικαλέωの、信頼をもって主に助けを求め、その名を呼ぶ意味を「呼び求める」で明確に表し、直後の10:13とのつながりを保つ。
theological_decisions:
- issue: 文脈における「主」の指示対象
  choice: 周囲の文脈で告白される主、すなわちイエスを指すと読めるが、訳文では説明を加えず「主」とする。
  alternative: 特にキリストと限定せず、一般的に神を指すと読む。
  rationale: ローマ10:9-13はイエスを主と告白することを中心とし、続いてヨエル書の「主を呼び求める」を引用する。称号をそのまま訳すことで、両者の結びつきと聖書的な響きを文脈から読ませる。
- issue: 「すべての人」の範囲
  choice: 「ご自分を呼び求める」によって限定されるすべての人。
  alternative: 無条件に全人類への救いを述べるものと読む。
  rationale: 原文では恩恵を受ける「すべて」が分詞句によって明確に限定される。ユダヤ人とギリシア人の別なく開かれている普遍性と、主を呼び求める者という限定の双方を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「〜との間に区別はありません」で論旨を明確にし、後半は原文のπλουτῶνの豊かさの比喩を、日本語として意味の通る「豊かに恵みを与えてくださる」で動的に表現した。敬語は神への言及に自然な範囲で用いた。
