revisions:
- from: しかし、イザヤは大胆にもこう言っています。「わたしを捜していなかった者たちに、わたしは見いだされた。わたしに尋ね求めなかった者たちに、わたしは自らを現した。」
  to: しかし、イザヤは大胆にもこう言っています。「わたしを求めていなかった者たちの間で、わたしは見いだされた。わたしについて尋ねなかった者たちに、わたしは現れた。」
  rationale: 顕現を表す句を「わたしは現れた」として、ἐμφανὴς ἐγενόμηνの意味を自然な日本語で保ちつつ、「自らを現した」に伴う解釈的な能動・再帰表現を避けました。ζητέωは「求める」、ἐπερωτάωは「について尋ねる」と訳し分けました。さらに、SBLGNT本文のἐνを「者たちの間で」に反映しました。脚注なしでも意味の必要な曖昧さは本文で保たれており、脚注アンカーは不要です。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:13:51Z'
review_pass:
  verdict: revise
  source_fidelity: 「自らを現した」は、日本語としては自然ですが、ἐμφανὴς ἐγενόμην（「明らかな者となった／現れた」）が明示しない再帰的・能動的自己開示を加えています。「現れた」として、原文の顕現表現と中動態的な成り行きをより近く保ちます。また、本文にあるἐνは「者たちの間で」と訳して反映します。
  naturalness: 改訂文は明瞭な現代標準日本語であり、引用の二つの並行句も自然に読めます。「尋ね求める」は日本語としてやや不自然で、ἐπερωτάωの基本義にも「について尋ねる」のほうが適合します。
  terminology: 「イザヤ」「大胆にも」「見いだされた」は適切です。「求める」はζητέωの聖書的な含みを保ちます。「現れた」は、特定の教義的説明を加えずに顕現を表せます。
  issues:
  - severity: medium
    issue: 「わたしは自らを現した」
    rationale: 原文は文字どおりには「わたしは明らかな者となった／現れた」であり、「自らを現した」は原文にない能動的・再帰的な意味を明示する。
  - severity: medium
    issue: ἐν の未反映
    rationale: 「者たちに」だけでは、本文にあるἐν τοῖςを反映しない。「者たちの間で」とすることで、写本・引用形に見られる前置詞を本文で保持できる。
  - severity: low
    issue: 「尋ね求めなかった」
    rationale: ἐπερωτάωはここでは「尋ねる／問い合わせる」であり、「尋ね求める」は不自然で、ζητέωとの意味の重なりを強めすぎる。
  revised_text: しかし、イザヤは大胆にもこう言っています。「わたしを求めていなかった者たちの間で、わたしは見いだされた。わたしについて尋ねなかった者たちに、わたしは現れた。」
  revised_footnotes: []
