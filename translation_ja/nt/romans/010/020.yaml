reference: Romans 10:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: ja
  text: しかし、イザヤは大胆にもこう言っています。「わたしを求めていなかった者たちの間で、わたしは見いだされた。わたしについて尋ねなかった者たちに、わたしは現れた。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: 大胆にもこう言っています
  rationale: 大胆に踏み込んで語るという現在形の動詞の力を、自然な現代日本語で表した。
- source_word: Εὑρέθην
  choice: わたしは見いだされた
  rationale: アオリスト受動態をそのまま保ち、引用中で神が御自身を指す表現を明確にした。
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: わたしを捜していなかった者たちに
  rationale: ἐν の字義に近い「中で」よりも、日本語の受動文として自然で、見いだした主体を示す「に」とした。
- source_word: ζητοῦσιν
  choice: 捜して
  rationale: 具体的に見つけようとする意味を保ちつつ、日常的で明瞭な語を選んだ。
- source_word: ἐμφανὴς ἐγενόμην
  choice: わたしは自らを現した
  rationale: 字義的には「明らかな者となった／姿を現した」だが、日本語では神の自己顕現を自然に示す「自らを現した」が明瞭である。行為主体を明示する点は解釈を含むため、神学的判断として記録した。
- source_word: ἐπερωτῶσιν
  choice: 尋ね求めなかった
  rationale: 単なる質問ではなく神を求めて問い合わせる並行表現を示しつつ、「呼び求める」という特定の神学的意味は持ち込まない。
- source_word: δὲ
  choice: しかし
  rationale: 直前の議論との対照を自然に示す。
- source_word: Ἠσαΐας
  choice: イザヤ
  rationale: 日本語聖書で定着した標準的な人名表記を用いた。
theological_decisions:
- issue: イザヤ引用における神の自己顕現の表現
  choice: わたしは自らを現した
  alternative: わたしは明らかな者となった／わたしの姿は明らかになった
  rationale: ἐμφανὴς ἐγενόμην は形式上「明らかな者となった」だが、そのままでは現代日本語として不自然である。「自らを現した」は神の自己開示を明瞭に伝える一方、原文が明示しない使役・再帰的ニュアンスを補うため、その解釈性をここに記録する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用は文語調に寄せすぎず、二つの平行句が聞き取れる語順にした。脚注は設けていないため、本文中の脚注記号もない。
