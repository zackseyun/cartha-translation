source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: ja
  text: 'しかし、私は問います。イスラエルは知らなかったのでしょうか。[a] まず、モーセがこう言っています。


    「わたしは、民でない者によって[b]、あなたがたにねたみを抱かせ、

    理解のない民によって、あなたがたを怒らせる。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「理解しなかったのでしょうか」とも訳せる。ここで「知る」は、聞いたことの意味を理解することを含む可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 申命記32章21節からの引用。「民でない者」は、真の民とは見なされていなかった人々、すなわち異邦人を指す可能性がある。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ λέγω
  choice: しかし、私は問います
  rationale: 直訳的な「しかし、私は言う」よりも、続く疑問文を導く談話上の働きを自然な現代日本語で表した。
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: イスラエルは知らなかったのでしょうか
  rationale: ἔγνωの基本義「知る」を保持し、μὴで導かれる修辞疑問の含みを「のでしょうか」で表した。「理解しなかった」も文脈上可能なので脚注に示した。
- source_word: πρῶτος Μωϋσῆς λέγει
  choice: まずモーセがこう言っています
  rationale: πρῶτοςの証言順序を示す働きを「まず」で表し、現在形λέγειは聖書の引用を現在の証言として提示する用法に合わせた。
- source_word: παραζηλώσω ὑμᾶς
  choice: あなたがたにねたみを起こさせ
  rationale: 動詞の使役的な意味を保ちつつ、自然な日本語にした。
- source_word: ἐπ’ οὐκ ἔθνει
  choice: 民でないものによって
  rationale: 「異邦人」と明示せず、申命記引用の逆説的で曖昧な表現と中性単数の形を可能な限り保持した。
- source_word: ἐπ’ ἔθνει ἀσυνέτῳ
  choice: 理解のない民によって
  rationale: ἀσύνετοςを道徳的な「愚かさ」へ狭めず、理解や分別の欠如という語義を明示した。
- source_word: παροργιῶ ὑμᾶς
  choice: あなたがたを怒らせる
  rationale: 怒りを引き起こすという使役的意味を簡潔に表した。
theological_decisions:
- issue: 「民でないもの」と「理解のない民」の指示対象
  choice: 本文では指示対象を特定せず、申命記32章21節の表現を保持する。
  alternative: 異邦人、またはイスラエルから真の民と見なされなかった人々と明示する。
  rationale: パウロの引用が持つ聖書的表現と解釈上の余地を残し、特定の神学的同定を本文へ持ち込まないため。
- issue: ἔγνωの意味
  choice: 本文では「知らなかった」とする。
  alternative: 「理解しなかった」「悟らなかった」。
  rationale: 基本的な語義を本文に置きつつ、直前の聞くこととのつながりから「理解する」の意味もあり得るため脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用には簡潔で格調ある調子を保った。「ねたみ」は現代でも理解可能で、引用の神学的語感を保つため平仮名表記とした。すべての脚注記号を本文に配置した。
