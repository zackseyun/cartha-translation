  text: Πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα κυρίου σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/013.yaml
  text: For everyone who calls on the name of the Lord will be saved[a][b].
translation:
  language: ja
  text: 「主の名を呼び求める者はだれでも救われる」からです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: パウロはヨエル書2:32を引用している。ヨエル書では「主」はヤハウェ（YHWH）を指すが、ここでは文脈上、パウロはこの言葉をイエスに適用している。
    reason: cross_reference
  - marker: b
    text: 「呼び求める」は、主の名を呼んで主に呼びかけ、助けを求めることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς ... ὃς ἂν
  choice: 者はだれでも
  rationale: 不定・一般化を表す構文で、例外のない普遍的範囲を自然な現代日本語で示す。文脈上、性別を限定しない。
- source_word: γὰρ
  choice: からです
  rationale: 直前の主張に対する聖書からの根拠を導入する接続関係を明確に表す。
- source_word: ἐπικαλέσηται
  choice: 呼び求める
  rationale: 単に名を口にすることではなく、主を名によって呼び、助けを求め、より頼むという聖書的用法を簡潔に伝える。
- source_word: τὸ ὄνομα
  choice: 名
  rationale: 聖書の定型表現を保ち、呼び求められる方の現された身分、権威、人格を含意する。
- source_word: κυρίου
  choice: 主
  rationale: ギリシア語本文のκύριοςをそのまま訳し、本文中で「イエス」または「主なる神」と説明的に限定しない。
- source_word: σωθήσεται
  choice: 救われる
  rationale: 未来受動形を日本語で自然に表し、ローマ書の文脈における救いの意味を保持する。
theological_decisions:
- issue: ヨエル書引用における「主」の指示対象
  choice: 本文では「主」とし、指示対象を説明的に補わない。
  alternative: 「主なる神」または「主イエス」とする。
  rationale: 引用元のヨエル2:32ではYHWHを指す一方、ローマ10章の文脈ではパウロがこの句をイエスに適用している。本文のκύριοςが持つ語形を保ち、この相互参照上の神学的緊張は脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「者」は引用句の簡潔さと聖書的な響きを保つために用いた。「からです」によりγάρと直前の議論との論理的つながりを自然に示した。
