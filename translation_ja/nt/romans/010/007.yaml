  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἤ· Τίς καταβήσεται εἰς τὴν ἄβυσσον; τοῦτ’ ἔστιν Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/007.yaml
  text: or[a], “Who will descend into the abyss?” (that is[b], to bring Messiah up from the dead).
translation:
  language: ja
  text: あるいは、「だれが深淵[a]に下るのか。」（これは、メシア[b]を死者の中から引き上げることです。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「深み」とも訳せます。パウロは申命記30章13節を踏まえていますが、ここでは「深淵」という語を用い、メシアを死者の中から引き上げることに当てはめています。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「クリストス」。ここでは称号として用いられているため、「メシア」と訳しました。
    reason: alternative_reading
lexical_decisions:
- source_word: ἤ
  choice: あるいは
  rationale: 申命記からの引用の第二の問いを導く接続詞として、前節との対比を簡潔かつ自然に示す。
- source_word: Τίς καταβήσεται
  choice: だれが……下るのか
  rationale: 未来形を含む修辞的疑問を、日本語で自然な問いとして表した。
- source_word: εἰς τὴν ἄβυσσον
  choice: 底知れぬ淵に
  rationale: ἄβυσσοςの深く測り知れない領域という像を保ち、「死者の世界」などの解釈に限定しない。
- source_word: τοῦτ’ ἔστιν
  choice: これは……ことです
  rationale: 引用された問いに対するパウロの説明であることを、明瞭で自然な現代日本語にした。
- source_word: Χριστόν
  choice: メシア
  rationale: ここでは固有名のような呼称よりも「油注がれた者」という称号として機能しているため、その称号的意味を表す。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 複数形νεκρῶνを反映し、メシアが死者たちの中から上へ導かれるという原文の表現を保つ。
- source_word: ἀναγαγεῖν
  choice: 引き上げる
  rationale: 「下る」と対応する空間的な上昇の像を保ちつつ、「復活させる」と解釈的に言い換えることを避ける。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では救い主の称号としての意味が明確であり、音写語より称号の意味を示す訳を採った。
- issue: ἄβυσσοςが指す領域
  choice: 底知れぬ淵
  alternative: 深み／死者の世界
  rationale: パウロは申命記30章の表現を応用し、メシアを死者の中から引き上げることに結びつけている。本文では比喩と含意を狭く限定せず、原語の像を保持した。
- issue: ἀναγαγεῖνと復活の関係
  choice: 引き上げる
  alternative: 復活させる
  rationale: 文脈上は復活を指すが、動詞自体の空間的な表現を残し、「淵に下る」との対照を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、引用部分は簡潔で格調ある修辞的な問いとした。括弧によって、引用に対するパウロの説明を区別した。
