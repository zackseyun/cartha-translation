  source_fidelity: πρὸς δὲ τὸν Ἰσραὴλ is appropriately rendered 「しかし、イスラエルについては」, while the viable directional sense is retained in note a. 「こう言っています」 preserves the citation-formula present without adding an explicit subject. 「一日中」「両手を差し伸べた」「民に向かって」 accurately convey the temporal extent, gesture, and direction of the Greek. 「従おうとせず、言い逆らう民」 preserves both ἀπειθοῦντα (refusal/disobedience, with possible unbelief) and ἀντιλέγοντα (active verbal opposition).
  naturalness: The rendering is clear, idiomatic modern standard Japanese and maintains a suitably restrained prophetic register. 「両手を差し伸べた」 is natural Japanese for the image, and 「従おうとせず、言い逆らう民」 clearly coordinates the two participial descriptions.
  terminology: 「イスラエル」 and 「民」 are appropriate. The translation neither narrows ἀπειθοῦντα to intellectual unbelief nor turns ἀντιλέγοντα into a merely inward attitude; the lexical alternatives are responsibly supplied in the notes.
