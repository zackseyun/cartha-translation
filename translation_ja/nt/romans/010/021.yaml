id: ROM.10.21
reference: Romans 10:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: ja
  text: 'しかし、イスラエルについては、こう言っています[a]。

    「わたしは一日中、従おうとせず[b]、言い逆らう[c]民に向かって、両手を差し伸べた。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、イスラエルに対しては、こう言っています」。ギリシャ語の構文は、イスラエルについての発言とも、イスラエルに向けた発言とも理解できます。
    reason: alternative_reading
  - marker: b
    text: 「従おうとせず」は、「信じようとせず」または「説得されようとせず」という意味にも取れます。
    reason: lexical_alternative
  - marker: c
    text: 「言い逆らう」は、「反対する」「否定する」「反論する」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: しかし、イスラエルについては
  rationale: πρόςとλέγειの構文を、イスラエルに関して語るものとして自然な日本語にした。ただし、イスラエルに向けて語る意味にも取れるため、脚注に残した。
- source_word: λέγει
  choice: こう言っています
  rationale: 引用を導く現在形の生き生きとした働きを保った。ギリシャ語で明示されていない主語を本文に補わず、文脈に委ねた。
- source_word: Ὅλην τὴν ἡμέραν
  choice: 一日中
  rationale: 時間の継続を表す対格を、簡潔で自然な現代日本語にした。
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: 両手を差し伸べた
  rationale: 神が呼びかけ、迎えようとする擬人的な姿を保った。日本語では身体の対になった部分について「両手」が自然である。
- source_word: πρὸς λαὸν
  choice: 民に向かって
  rationale: 差し伸べられた手の方向と、その働きかけの対象を明確に表した。
- source_word: ἀπειθοῦντα
  choice: 従おうとせず
  rationale: 単なる状態を表す「不従順な」よりも、神の呼びかけに説得されず従わないという能動的な拒否を表した。不信の意味合いも脚注に示した。
- source_word: ἀντιλέγοντα
  choice: 言い逆らう
  rationale: ἀντιλέγωの「反対して言う、言い返す」という発話を伴う抵抗を直接表し、一般的な「反抗する」へ広げすぎないようにした。
theological_decisions:
- issue: イスラエルの応答の描写
  choice: 「従おうとせず、言い逆らう民」
  alternative: 「信じようとせず、反抗する民」
  rationale: 神が一日中手を差し伸べる一方で、民が説得を拒み、言葉で反対するという、神の働きかけと人間の拒絶との緊張を保った。民族としてのイスラエルの地位について、本文を越えた結論は加えていない。
- issue: 引用導入部の話者
  choice: 主語を明示せず「こう言っています」
  alternative: 「神はこう言っています」
  rationale: 文脈上の話者は神と理解できるが、この節のギリシャ語本文では主語が明示されていないため、日本語でも不要な限定を加えなかった。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。引用部分では簡潔な預言者的調子を保ちつつ、「従おうとせず」「言い逆らう」によって二つの現在分詞が表す継続的・能動的な抵抗を自然に示した。
