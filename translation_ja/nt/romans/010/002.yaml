reference: Romans 10:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον θεοῦ ἔχουσιν· ἀλλ’ οὐ κατ’ ἐπίγνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/002.yaml
  text: For I testify about them that they have zeal for God[a], but not according to knowledge[b],
translation:
  language: ja
  text: というのも、私は彼らについて証言します。彼らには神に対する熱心さ[a]がありますが、それは知識にかなったものではありません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「神の熱心さ」。ギリシア語の属格には幅があるが、ここではおそらく神に向けられた熱心さを意味する。
    reason: lexical_alternative
  - marker: b
    text: 別訳「十分な知識を伴うものではありません」「知識に基づくものではありません」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρῶ
  choice: 証言します
  rationale: 現在直説法一人称単数の直接的な証言の力を保ちつつ、現代日本語として明瞭にした。
- source_word: γὰρ
  choice: （文脈上の説明関係として反映）
  rationale: 前節の願いの根拠を示す接続語。日本語では独立した「なぜなら」を置くより、続く断定そのものによって説明関係を自然に示した。
- source_word: αὐτοῖς
  choice: 彼らについて
  rationale: ここでは証言を受ける相手ではなく、証言の対象となる人々を指す与格と判断した。
- source_word: ζῆλον θεοῦ
  choice: 神に対する熱心さ
  rationale: θεοῦを目的語的属格と捉え、神へ向けられた熱意を表した。「神の熱心さ」では神自身の熱意とも読めるため避けたが、属格の曖昧さは脚注に残した。
- source_word: ἔχουσιν
  choice: 持っています
  rationale: 単純な現在の意味を自然な現代日本語で表した。
- source_word: ἀλλ’
  choice: しかし／が
  rationale: 彼らの熱心さを認めながら、その欠陥を指摘する強い対照を「が」で明確に示した。
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: 知識に基づくものではありません
  rationale: κατάの基準・準拠の意味を「に基づく」で自然に表現し、ἐπίγνωσιςを「完全な知識」「正しい知識」と限定しすぎず、原文の余地を保った。
theological_decisions:
- issue: イスラエルの熱心さの性質
  choice: 神へ向けられた熱心さはあるが、知識に基づいてはいない
  alternative: 神自身の熱心さを持つ／対象を特定しない宗教的熱心さを持つ
  rationale: 文脈上、ζῆλον θεοῦは神を対象とする属格と読むのが最も自然である。彼らの真剣さを認めつつ、その理解の不十分さを否定する本文の緊張を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。宗教語として定着した「熱心さ」を用い、過度に教派的・解釈的な「正しい知識」「真の知識」は本文に加えなかった。
