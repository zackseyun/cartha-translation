  text: πολλῷ οὖν μᾶλλον δικαιωθέντες νῦν ἐν τῷ αἵματι αὐτοῦ σωθησόμεθα δι’ αὐτοῦ ἀπὸ τῆς ὀργῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: ja
  text: それなら、今、キリストの血によって義と認められた[a][b]私たちは、なおさら、キリストを通して怒り[c]から救われるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「血によって」は、手段または根拠を表す。直訳的には「血において」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「義とされた」。
    reason: lexical_alternative
  - marker: c
    text: 文脈上、神の怒りを指す。
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: それならなおさら
  rationale: οὖνの推論的なつながりと、πολλῷ…μᾶλλονの強い比較・増大を、重複感のない自然な現代日本語で表した。
- source_word: δικαιωθέντες
  choice: 義と認められた
  rationale: アオリスト受動分詞が、未来の主動詞に先立つ完了した行為を示すことを保ちつつ、パウロ書簡における法廷的な語感を伝える。別訳「義とされた」も可能なため脚注に示した。
- source_word: νῦν
  choice: 今
  rationale: 義と認められた結果としての現在の状態を示す時間副詞を、そのまま簡潔に訳した。
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: この方の血によって
  rationale: ἐνをここでは手段・根拠として理解し、犠牲の血によることを説明的に言い換えずに表した。「血において」という直訳調は避けた。
- source_word: σωθησόμεθα
  choice: 救われます
  rationale: 未来受動の確かな言明を、文脈上未来を表せる日本語の非過去形で自然に訳した。「救われるでしょう」は推量に聞こえ得るため避けた。
- source_word: δι’ αὐτοῦ
  choice: この方を通して
  rationale: 属格を伴うδιάが示す媒介・手段を明確に保った。αὐτοῦの先行詞を本文以上に明示せず、同じ指示表現で訳した。
- source_word: ἀπὸ τῆς ὀργῆς
  choice: 怒りから
  rationale: ἀπόの分離・救出の意味を「から」で表した。文脈上は神の怒りだが、原文にθεοῦはないため、本文には「神の」を補わなかった。
theological_decisions:
- issue: δικαιωθέντεςにおける義認表現
  choice: 本文を「義と認められた」とする
  alternative: 義とされた
  rationale: 法廷的な宣告の語感を伝えながら、義認がどのように働くかについて特定教派の説明を持ち込まない。可能な別訳は脚注に残した。
- issue: ἡ ὀργήの指示対象
  choice: 本文では「怒り」とし、神を明示しない
  alternative: 神の怒り
  rationale: 文脈は神の怒りを強く示唆するが、ギリシア語本文は「神の」と明記していない。その緊張を保ち、文脈上の含意のみ脚注で説明した。
- issue: 未来の救いの確実性
  choice: 「救われます」と断定的に訳す
  alternative: 救われるでしょう
  rationale: 未来受動を推量に弱めず、なお将来に実現する救いという時間的側面を文脈に委ねた。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「この方」を用いて原文の代名詞を保ち、「神の怒り」「キリスト」など文脈から推測できても当該節に明記されない語は本文に補わなかった。冒頭は論理的推論と強調を自然に示す「それならなおさら」とした。
