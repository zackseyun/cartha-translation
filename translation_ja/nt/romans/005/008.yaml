  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: ja
  text: しかし神は、私たちがまだ罪人であった時に、メシア[b]が私たちのために[c]死んでくださったことによって、私たちに対する[a]ご自身の愛を示しておられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちに対する」は、直訳的には「私たちへ向けた」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語「クリストス」。伝統的には「キリスト」。ここでは称号として「メシア」と訳した。
    reason: lexical_alternative
  - marker: c
    text: 「私たちのために」は、「私たちの益のために」または「私たちに代わって」という含みを持ちうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: 明らかにしておられます
  rationale: 現在形の動詞が表す、愛を具体的な出来事によって示すという意味を、自然な現代日本語で表した。単なる主張ではなく実証する含みも保っている。
- source_word: δὲ
  choice: しかし
  rationale: 直前の議論との穏やかな対照を示す接続語として訳した。
- source_word: τὴν ἑαυτοῦ ἀγάπην
  choice: ご自身の愛
  rationale: 再帰代名詞ἑαυτοῦの強調を「ご自身の」で保ち、ἀγάπηは文脈に即して「愛」とした。
- source_word: εἰς ἡμᾶς
  choice: 私たちに対する
  rationale: 神の愛が私たちへ向けられているという方向性を明確かつ自然に表した。
- source_word: ὅτι
  choice: ことによって
  rationale: 後続の出来事が、神の愛がどのように明らかにされたかを説明する内容節であることを示した。
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: 私たちがまだ罪人であった時に
  rationale: 属格独立構文を時間的・譲歩的な含みのある節として訳し、ἔτιを「まだ」で明示した。
- source_word: Χριστὸς
  choice: メシア
  rationale: ここでは単なる固有名ではなく称号として機能しているため、その意味を訳出した。慣用的な「キリスト」は脚注に示した。
- source_word: ὑπὲρ ἡμῶν
  choice: 私たちのために
  rationale: 受益・代理にかかわる広い意味を保ち、贖罪論上の特定の理解だけに限定しない表現とした。
- source_word: ἀπέθανεν
  choice: 死んでくださった
  rationale: 死という出来事を直接表しつつ、ὑπὲρ ἡμῶνが示す私たちのための行為であることを自然な敬語表現に反映した。
theological_decisions:
- issue: パウロ書簡におけるΧριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号としての意味が生きているため「メシア」とした。ただし、日本語で定着した音訳「キリスト」も可能であるため脚注に残した。
- issue: ὑπὲρ ἡμῶνが表す死の意味
  choice: 私たちのために
  alternative: 私たちに代わって／私たちのためを思って
  rationale: この前置詞は受益や代理の意味を含みうるが、この一節だけで代償的置換の意味に限定せず、原文の幅と神学的緊張を保つため広い訳語を採用した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神については「ご自身」「おられます」、メシアの行為には「くださった」を用いて、一般読者にも自然で礼節のある聖書文体とした。長い一文は原文の論理関係を保ち、「ことによって」により愛の実証とメシアの死との関係を明示した。
