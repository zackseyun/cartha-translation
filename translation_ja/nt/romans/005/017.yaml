id: ROM.5.17
reference: Romans 5:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: ja
  text: というのも、もし一人の違反によって、死がその一人を通して支配したのなら、まして、あふれる恵みと義[a]という賜物を受ける人々は、一人の方、イエス・キリスト[b]を通して、いのちのうちに王として支配するでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正義」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「メシアであるイエス」とも訳せる。「メシア」は「油を注がれた者」の意。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: 違反
  rationale: 道を踏み外すことから生じる過ち・背反を表す語であり、この文脈ではアダムの行為が神への違反であることを明瞭かつ簡潔に示す。
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: 支配した／王として支配するでしょう
  rationale: 前半では日本語として自然な「死が支配した」とし、後半では人々が主語であるため「王として」を補って、同じ動詞にある王権の比喩を明示した。
- source_word: περισσείαν τῆς χάριτος
  choice: あふれる恵み
  rationale: 「恵みの豊かさ」という量的表現を、過度に説明的にせず、豊かに満ちる意味が伝わる自然な日本語にした。
- source_word: δωρεᾶς τῆς δικαιοσύνης
  choice: 義という賜物
  rationale: 属格の関係を、義そのものが賜物であることを示す同格的な表現として訳した。δικαιοσύνηの「正義」の可能性は脚注に残した。
- source_word: λαμβάνοντες
  choice: 受ける人々
  rationale: 分詞が、恵みと賜物を受ける者たちを特徴づけていることを簡潔に表した。
- source_word: ἐν ζωῇ
  choice: いのちのうちに
  rationale: 死の支配との対照を保ちつつ、領域・状態を表し得るἐνの簡潔さと含みを残した。
- source_word: διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ
  choice: 一人の方、イエス・キリストを通して
  rationale: 「一人」とイエス・キリストが同格であることを明瞭にし、前半の「一人」との対照を保った。日本語で定着した表記「キリスト」を本文に置き、語義上の称号「メシア」は脚注に示した。
theological_decisions:
- issue: δικαιοσύνηςの訳語と属格関係
  choice: 義という賜物
  alternative: 正義という賜物／義の賜物
  rationale: ローマ書の義認をめぐる文脈に適合する「義」を本文に採用しつつ、語が持つ正義・正しい秩序の含みを脚注で保持した。「という」により、賜物の内容が義であるとの自然な理解を示すが、説明を広げすぎない。
- issue: ἐν ζωῇ βασιλεύσουσινの解釈
  choice: いのちのうちに王として支配するでしょう
  alternative: いのちによって王として支配するでしょう
  rationale: ἐνを領域・状態として直截に訳し、死が支配することと、受ける人々がいのちの領域で支配することとの緊張を保持した。手段と断定する訳は避けた。
- issue: Χριστοῦの表記
  choice: キリスト
  alternative: メシア
  rationale: 日本語の固有名的結合「イエス・キリスト」が自然で広く理解されるため本文に採用したが、Χριστόςの称号としての意味を脚注で明示した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある聖書文体。「実に」「ましてなおさら」で論証の流れを示し、「一人」を反復してアダムとイエス・キリストの対照を保った。「いのち」は神学的・聖書的な含みを保つため平仮名表記とした。
