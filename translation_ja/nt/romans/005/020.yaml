id: ROM.5.20
reference: Romans 5:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νόμος δὲ παρεισῆλθεν ἵνα πλεονάσῃ τὸ παράπτωμα· οὗ δὲ ἐπλεόνασεν ἡ ἁμαρτία, ὑπερεπερίσσευσεν ἡ χάρις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/020.yaml
  text: The law came in alongside so that the trespass might increase; but where sin increased, grace overflowed all the more,
translation:
  language: ja
  text: 律法が加わったのは[a]、違反[b]が増すためでした。しかし、罪が増したところでは、恵みはなおいっそう満ちあふれました[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「傍らに入って来た」。また「入り込んで来た」とも訳せる。ギリシア語には、後から加わるという含みがある。
    reason: lexical_alternative
  - marker: b
    text: 「背き」または「過ち」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: または「はるかに豊かになりました」。原語は、単に増すことを超えた豊かさを強く表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: 律法
  rationale: 定冠詞とローマ書の文脈から、モーセの律法を指すと理解するのが最も自然であり、日本語聖書で定着した「律法」を用いた。
- source_word: παρεισῆλθεν
  choice: そこに加わった
  rationale: 単に「入った」だけでなく、すでにあるものの傍らに、また後から加わるという παρά の含みを、自然な現代日本語で表した。
- source_word: ἵνα πλεονάσῃ
  choice: 増すためでした
  rationale: ἵνα と接続法による目的の力を明確に保ち、単なる結果へと弱めなかった。
- source_word: τὸ παράπτωμα
  choice: 違反
  rationale: 定冠詞付きの単数形を保ちつつ、神の定めから踏み外す行為を簡潔に表す。「罪」と区別でき、直前のアダムの違反とのつながりも保たれる。
- source_word: οὗ
  choice: ところでは
  rationale: 場所的・領域的な関係を表す自然な日本語として「罪が増したところでは」とした。
- source_word: ἁμαρτία
  choice: 罪
  rationale: パウロ書簡における標準的で文脈に適した訳語。
- source_word: ὑπερεπερίσσευσεν
  choice: なおいっそう満ちあふれました
  rationale: 単なる増加を超える強意を持つ複合動詞なので、「なおいっそう」と「満ちあふれる」によって際立つ豊かさを表した。
- source_word: ἡ χάρις
  choice: 恵み
  rationale: χάρις の神学的意味を明瞭に伝える、現代日本語で定着した訳語。
theological_decisions:
- issue: 律法が加わった目的を示す ἵνα を、目的として訳すか結果として訳すか。
  choice: 「違反が増すためでした」と目的を表す形で訳した。
  alternative: 「その結果、違反が増しました」
  rationale: 原文の ἵνα と接続法が持つ目的の力を保ち、罪の増加に関する神学的緊張を訳文で解消しないため。この表現自体は、神が罪を道徳的に是認したという意味までは含まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、パウロの議論にふさわしい端正さを保った。「そこに加わった」で前後の文脈との関係を自然に示し、「増すためでした」によって原文の目的表現と神学的緊張を保持した。
