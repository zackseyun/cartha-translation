revisions:
- from: しかし、死はアダムからモーセまで支配し、アダムの違反と同じ仕方では罪を犯さなかった人々の上にさえ及びました。アダムは、来られる方の型[a]です。
  to: しかし、死はアダムからモーセまで支配しました。アダムの違反と同じ仕方で罪を犯さなかった人々の上にもです。アダムは、来るべき方の型[a]です。
  rationale: 死の王権的支配という原文の比喩を保つため、後半を「人々の上にもです」として前文の「支配しました」を補わせた。「来るべき方」は原文の将来的な人物指示を保ちつつ、敬語的な上乗せを避ける。脚注はτύποςの意味領域に即した代替語へ訂正した。
