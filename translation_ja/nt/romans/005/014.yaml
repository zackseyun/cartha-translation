id: ROM.5.14
reference: Romans 5:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: ja
  text: しかし、死はアダムからモーセまで支配しました。アダムの違反と同じ仕方で罪を犯さなかった人々の上にもです。アダムは、来るべき方の型[a]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「型」は、「ひな型」または「予型」とも訳せます。文脈では、来るべき方はキリストを指します。
    reason: lexical_alternative_and_referent
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前節との強い対比を、現代日本語として自然に示す。
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: 死は…支配し
  rationale: 死を支配者として描く擬人化を保ちつつ、「君臨した」より一般読者に明瞭な表現とした。
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: アダムからモーセまで
  rationale: 時間的範囲を簡潔かつ忠実に表す。
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: 罪を犯さなかった人々の上にさえ及びました
  rationale: καίの強調的な働きと、ἐπίが示す死の支配の及ぶ対象を自然な日本語で表す。
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: アダムの違反と同じ仕方では
  rationale: 類似・対応の意味を明確にしながら、何が同じでなかったかを過度に特定せず、原文の比較を保つ。
- source_word: παράβασις
  choice: 違反
  rationale: 命令の境界を踏み越える行為を示し、現代日本語で理解しやすい。
- source_word: τύπος
  choice: 型
  rationale: アダムと後に来る方との予型的対応を簡潔に保つ、定着した訳語である。
- source_word: τοῦ μέλλοντος
  choice: 来られる方
  rationale: 実質化された分詞の将来的な人物指示を保ち、本文でキリストと明示して原文以上に限定することを避ける。
theological_decisions:
- issue: 「来られる方」の指示対象
  choice: 本文では「来られる方」とし、キリストを明記しない
  alternative: 「来るべき方（キリスト）」または「キリスト」
  rationale: ローマ5章12–21の文脈ではキリストを指すが、原文は固有名を置かないため、その表現と含みを保持する。
- issue: アダムと罪を犯した人々との相違点
  choice: 「アダムの違反と同じ仕方では罪を犯さなかった」と訳す
  alternative: 律法上の明示的命令に違反しなかった、と説明的に訳す
  rationale: 文脈上その理解は有力だが、この節自体は相違の内容を詳述しないため、解釈を本文へ織り込みすぎない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「死」の擬人化とアダム―キリストの対応を保ちつつ、原文にない説明は本文へ加えない。
