id: ROM.5.10
reference: Romans 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: ja
  text: というのも、私たちが敵であったときに、御子の死を通して神と和解させられたのであれば、和解させられた私たちは、なおさら御子のいのちによって[a]救われるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御子のいのちのうちに救われる」とも訳せる。
    reason: ἐν τῇ ζωῇ αὐτοῦは、手段を表す「御子のいのちによって」のほか、領域または結びつきを表す「御子のいのちのうちに」とも理解できるため。
lexical_decisions:
- source_word: εἰ γὰρ
  choice: もし〜のなら
  rationale: γάρが示す前節からの論証関係は、日本語では文脈と条件構文そのものによって自然に伝わるため、硬い「というのは」を加えず、εἰの条件を明確にした。ここでの条件は事実を前提とする論証的な用法である。
- source_word: ἐχθροὶ ὄντες
  choice: 私たちが敵であったときにさえ
  rationale: 「敵」はἐχθροίの直接的な関係表現を保ち、「であったとき」はὄντεςの状況的分詞を自然な日本語にする。「にさえ」は、敵であった時点と和解後の現在を対比する論証の力を表す。
- source_word: κατηλλάγημεν / καταλλαγέντες
  choice: 和解させていただいた／和解させていただいた今
  rationale: いずれも受動態を保ち、和解を成立させた主体が神であることを示す。日本語の「神と和解させられた」は不自然で強制的な響きがあるため、恩恵を受ける受動を自然に表す「させていただいた」とした。後半のアオリスト分詞は先行する成立済みの出来事として「今」を添えた。
- source_word: τῷ θεῷ
  choice: 神と
  rationale: 日本語では「神に和解する」より「神と和解する」が自然であり、与格が示す和解の相手を明確にする。
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: 御子の死を通して
  rationale: διά＋属格の手段を「通して」で表し、τοῦ υἱοῦ αὐτοῦは文脈上神の子を指すため、尊称として自然な「御子」とした。
- source_word: πολλῷ μᾶλλον
  choice: なおさら
  rationale: パウロの小から大への論証を、簡潔で自然な現代日本語として表す。
- source_word: σωθησόμεθα
  choice: 救われるでしょう
  rationale: 未来受動の意味を保つ。「でしょう」は単なる不確実性ではなく、条件文の帰結を自然に示す。
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: 御子のいのちによって
  rationale: 死との対照から、ἐνを手段・根拠として読む。「いのち」は単なる生存期間ではなく、生きておられることを含む語として平仮名表記にした。
theological_decisions:
- issue: ἐν τῇ ζωῇ αὐτοῦ の意味
  choice: 手段的に「御子のいのちによって」
  alternative: 領域的・連合的に「御子のいのちのうちに」
  rationale: 直前の「御子の死を通して」との対照は、和解が死を通して与えられ、将来の救いが生きておられる御子のいのちによって実現するという手段的理解を支持する。ただしἐν本来の領域的・連合的意味も可能なので脚注に残した。
- issue: 神との和解における受動態
  choice: 「和解させていただいた」として神の働きを示す
  alternative: 「神と和解した」
  rationale: ギリシア語の受動態を能動的な自己和解へ変えず、和解が人間の独力によらないことを文法上保った。
- issue: 将来的な救い
  choice: 「救われるでしょう」と未来を明示
  alternative: 「救われています」
  rationale: σωθησόμεθαは未来形であり、すでに成立した和解と、なお将来に向かう救いとの緊張を保持した。
translation_notes:
  register: 明快な現代標準日本語としつつ、神学的な重みを保つ。「御子」「いのち」は聖書本文にふさわしい品位ある表記。条件節から「なおさら」へ進む論証を自然にし、受動態と未来性を明示した。脚注記号[a]は該当句ではなく文末に置き、節全体の代替訳であることを示した。
