reference: Romans 5:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: ja
  text: それだけではありません。私たちの主イエス・キリスト[a]を通して、神を誇りとしています。この方を通して、私たちは今、和解を受けたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」はギリシア語クリストスで、「メシア」という意味。
    reason: 称号の意味を明示するため。
lexical_decisions:
- source_word: οὐ μόνον δέ
  choice: それだけではありません
  rationale: 直前の内容を受ける移行句として、現代日本語で自然かつ明瞭に表現した。
- source_word: καυχώμενοι ἐν τῷ θεῷ
  choice: 神を誇りとしています
  rationale: καυχάομαιの『誇る／誇りとする』という意味を保ちつつ、自己高揚ではなく神を誇りの対象とする文脈を明確にした。分詞は文脈上、定動詞的に訳した。
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・キリストを通して
  rationale: διά＋属格の媒介を『通して』で表し、κύριοςは新約聖書のキリスト論的用法に即して『主』、Χριστόςは日本語で定着した称号『キリスト』とした。
- source_word: καταλλαγὴν
  choice: 和解
  rationale: 神と人との関係回復を表す標準的で明瞭な訳語。冠詞は直前の議論で述べられた特定の和解を指すが、日本語では不自然な限定表現を加えず文脈に委ねた。
- source_word: νῦν ... ἐλάβομεν
  choice: 今、和解を受けた
  rationale: νῦνを明示し、アオリストἐλάβομενを完了した受領として自然な日本語の過去形で表した。
theological_decisions:
- issue: καυχώμενοιの肯定的な神学的含意
  choice: 神を誇りとしています
  alternative: 神にあって喜んでいます
  rationale: 喜びという含意に狭めず、パウロが用いた『誇る』という語の緊張を保持しながら、誇りの対象が神であることを示した。
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστόςの訳
  choice: イエス・キリスト
  alternative: イエス・メシア／メシアであるイエス
  rationale: Χριστόςの称号性は認めつつ、この固有名と称号の結び付きには日本語で広く定着した『イエス・キリスト』を用いた。別訳を脚注で示した。
- issue: καταλλαγήの限定性
  choice: 和解
  alternative: その和解
  rationale: ギリシア語の冠詞は直前で説明された和解を指すが、日本語の『その和解』は指示性が強く不自然になり得るため、文脈上の限定性を保てる無冠詞の表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の反復するδιάを二度とも『通して』と訳し、キリストの媒介を明示した。
