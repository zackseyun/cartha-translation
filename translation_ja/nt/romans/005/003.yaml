  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: ja
  text: それだけでなく、私たちは苦難[b]をも喜びとします[a]。苦難が忍耐[c]を生み出すことを知っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誇りとします」または「大いに喜びます」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「患難」または「苦しみ」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「忍耐力」または「粘り強さ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: 喜びます
  rationale: 神の働きに基づく確信に満ちた喜びを、現代日本語で自然に表す。「誇ります」という意味合いもあるため、脚注で示した。
- source_word: θλίψεσιν / θλῖψις
  choice: 苦難
  rationale: 圧迫や苦しみを伴う状況を表す語として明瞭で自然であり、前半の複数形と後半の一般原則としての単数形は、日本語では同じ無標の名詞で表した。
- source_word: ὑπομονήν
  choice: 忍耐
  rationale: 圧迫のもとで耐え続けることを表す、一般読者に分かりやすく定着した訳語。
- source_word: κατεργάζεται
  choice: 生み出す
  rationale: 苦難が忍耐を結果としてもたらすという因果的・結果的な意味を自然に伝える。
- source_word: εἰδότες
  choice: 知っているからです
  rationale: 分詞が主節の喜びの根拠を示す文脈上の働きを、自然な日本語の理由節で表した。
theological_decisions:
- issue: 霊的に肯定的な文脈における καυχώμεθα の意味
  choice: 神の働きへの確信に基づいて「喜びます」
  alternative: 「誇ります」または「勝ち誇ります」
  rationale: 自己を高める自慢ではなく、神が苦難を通して成し遂げることへの確信ある喜びが文脈に合う。ただし原語の「誇る／歓喜する」という幅は脚注に残した。
- issue: 苦難と忍耐の関係
  choice: 「苦難が忍耐を生み出す」
  alternative: 「苦難が忍耐を働かせる」
  rationale: 本文は苦難そのものを善と断定するのではなく、それが忍耐をもたらすという結果を述べているため、その緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「そればかりではなく」で前節とのつながりを保った。「苦難の中にあっても」は、ἐν の領域・状況の意味と文脈上の譲歩的な含みを自然に表す。
