id: ROM.5.15
reference: Romans 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: ja
  text: しかし、賜物は違反と同じではありません。もし一人の人の違反によって多くの人々が死んだのであれば、まして、神の恵みと、一人の人、イエス・メシア[b]の恵みによる賜物[a]は、多くの人々に、はるかに豊かに注がれました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一人の人、イエス・メシアの恵みのうちにある賜物」または「その恵みから来た賜物」。
    reason: ἐν χάριτιは、手段、領域、または密接な関連を表し得るため。
  - marker: b
    text: または「イエス・キリスト」。
    reason: Χριστόςは「メシア」を意味する称号であり、「キリスト」という慣用的な音写も可能なため。
lexical_decisions:
- source_word: παράπτωμα
  choice: 違反
  rationale: 道徳的・法的な含みを保ちつつ、現代日本語で明瞭に理解できる語。アダムの一つの行為と神の賜物との対比にも適する。
- source_word: χάρισμα
  choice: 恵みの賜物
  rationale: 単なる贈り物ではなく、恵みから生じる無償の賜物という語感を自然な日本語で示す。
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: 多くの人々
  rationale: 「一人」と「多くの人々」というパウロの対比を保ち、「すべての人」と解釈して範囲を確定しない。日本語ではギリシア語の定冠詞を不自然なく明示できないため、自然な表現を採った。
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: 神の恵み
  rationale: 属格関係を明瞭かつ自然に表し、続く「恵みによる賜物」との語彙的連続性を保つ。
- source_word: ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου
  choice: 一人の人…の恵みによる賜物
  rationale: ἐν χάριτιを手段・関連として読みやすく表現しつつ、「恵みのうちにある賜物」という可能性は脚注に残す。
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: 一人の人
  rationale: 周辺文脈におけるアダムとイエスの「一人／多く」の対応を明確に保つ。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を示す。「イエス・キリスト」という慣用形は脚注に併記する。
- source_word: ἐπερίσσευσεν
  choice: はるかに豊かに及びました
  rationale: περισσεύωの豊かさ・超過の力を表し、πολλῷ μᾶλλονとの結びつきを自然な日本語で示す。
theological_decisions:
- issue: 「多くの人々」が指す範囲
  choice: 「多くの人々」と訳し、範囲を「すべての人」と確定しない。
  alternative: 代表的・包括的な意味を明示するため「すべての人」と訳す。
  rationale: 本文は意図的に「一人」と「多くの者たち」を対照させているため、この節だけでその神学的範囲を解消しない。
- issue: 「神の恵み」と「賜物」の関係
  choice: 二つを「神の恵みと…賜物」と並列的に保つ。
  alternative: 重言法とみなし「神の恵みによる賜物」と一つにまとめる。
  rationale: ギリシア語のκαίによる表面上の並列を保持し、両者を完全に同一視する解釈に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの「一人／多く」の反復と、違反・恵み・賜物の対照を保った。「賜物」は聖書語として定着しているが現在も理解可能で、文体の品位にも適する。
