  to: しかし、賜物は違反と同じではありません。もし一人の人の違反によって多くの人々が死んだのであれば、まして、神の恵みと、一人の人、イエス・メシア[b]の恵みによる賜物[a]は、多くの人々に、はるかに豊かに注がれました。
