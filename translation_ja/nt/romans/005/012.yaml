id: ROM.5.12
reference: Romans 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: ja
  text: こういうわけで、ちょうど一人の人を通して罪が世に入り、罪を通して死が入り、このようにして、すべての人が罪を犯したため[a]、死がすべての人に及んだ――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、伝統的には「その人にあって、すべての人が罪を犯した」。
    reason: ἐφ’ ᾧの代表的・包含的解釈を示す異訳。
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: こういうわけで
  rationale: 直前の議論を受ける推論的な接続を、自然な現代日本語で示す。
- source_word: ὥσπερ
  choice: ちょうど
  rationale: 比較を導く語を明示し、後続節へ続く未完の比較構文を保つ。
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: 一人の人を通して
  rationale: 属格を伴うδιάの媒介・手段の意味を保ちつつ、文脈上アダムを指す一人の男性という含意を自然に表す。
- source_word: ἡ ἁμαρτία
  choice: 罪
  rationale: パウロ書簡における標準的な語義を、原文にない説明を加えずに訳す。
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: 世に入り
  rationale: εἰςの方向性を簡潔に保ち、「世」は聖書文脈でも現代日本語として理解できる。
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: 罪を通して死が入り
  rationale: 「一人の人を通して罪が入り」との並行関係を明確にする。後の動詞から「入る」を補うことも日本語では自然である。
- source_word: οὕτως
  choice: このようにして
  rationale: 先に述べた経路と、その結果として全人類に死が及ぶこととの対応を示す。
- source_word: εἰς πάντας ἀνθρώπους
  choice: すべての人に
  rationale: ここでのἄνθρωποιは男性だけでなく人類全体を包括的に指す。
- source_word: ὁ θάνατος διῆλθεν
  choice: 死がすべての人に及んだ
  rationale: διέρχομαιが表す広がりと到達を、自然かつ明瞭な日本語で伝える。
- source_word: ἐφ’ ᾧ
  choice: ため
  rationale: 文脈上もっとも自然な原因・理由の用法として訳す一方、伝統的な別解は脚注に残す。
- source_word: πάντες ἥμαρτον
  choice: すべての人が罪を犯した
  rationale: アオリストを単純な過去として訳し、原文以上の時制・相の解釈を加えない。
theological_decisions:
- issue: ἐφ’ ᾧ πάντες ἥμαρτον の意味
  choice: 原因を示す「すべての人が罪を犯したため」
  alternative: 代表的・包含的な意味を示す「その人にあって、すべての人が罪を犯した」
  rationale: ἐφ’ ᾧはこの文脈では原因を表すと解するのが自然だが、アダムと人類の関係をめぐる神学的に重要な伝統的解釈を排除せず、脚注に明記する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の比較構文が次節以降へ続くことを「ちょうど」と文末のダッシュで保持した。
