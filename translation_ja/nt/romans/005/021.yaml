  to: それは、罪が死において支配したように、恵みもまた義[a]を通して支配し、私たちの主イエス・キリスト[b]を通して永遠のいのちに至るためです。
  rationale: 使役表現を避けて、恵みが義を通して支配し永遠のいのちに至るという原文の目的・到達点の関係を保った。また、冗長な「王として」を省き、自然な現代日本語に整えた。脚注のアンカーと内容は維持した。
