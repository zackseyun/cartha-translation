id: ROM.5.21
reference: Romans 5:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: ja
  text: それは、罪が死において支配したように、恵みもまた義[a]を通して支配し、私たちの主イエス・キリスト[b]を通して永遠のいのちに至るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義」は「正義」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「キリスト」は称号で、「メシア」の意。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἵνα
  choice: それは……ためです
  rationale: 前節を受ける目的・結果の節であることと、接続法を伴う構文の方向性を、自然な日本語で示した。
- source_word: ἐβασίλευσεν / βασιλεύσῃ
  choice: 王として支配した／王として支配し
  rationale: 罪と恵みを人格化するパウロの王権的な比喩を、二つの動詞で一貫して保った。
- source_word: ἐν τῷ θανάτῳ
  choice: 死のうちに
  rationale: ἐνが表す領域の意味を優先し、「死によって」と手段に限定することを避けた。
- source_word: ἡ χάρις
  choice: 恵み
  rationale: 罪との対照と人格化を保つ、明瞭で定着した訳語。
- source_word: διὰ δικαιοσύνης
  choice: 義を通して
  rationale: διά＋属格の手段を示しつつ、δικαιοσύνηのパウロ書簡における広がりを保った。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 永遠のいのちに至らせる
  rationale: εἰςの方向・到達点を日本語として明確にし、恵みの支配が向かう結果を表した。
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: 私たちの主イエス・キリストを通して
  rationale: διά＋属格を媒介として訳し、τοῦ κυρίου ἡμῶνをイエス・キリストに自然に結び付けた。
theological_decisions:
- issue: δικαιοσύνηの訳語
  choice: 義
  alternative: 正義
  rationale: 文脈上「義」が簡潔で定着しているが、δικαιοσύνηには公正・正義の含意もあるため、代案を脚注に残した。
- issue: Χριστόςを称号としてどう示すか
  choice: キリスト
  alternative: メシア
  rationale: 日本語で広く理解される形を本文に採用しつつ、単なる固有名ではなく「メシア」を意味する称号であることを脚注で明示した。
- issue: ἐν τῷ θανάτῳの関係
  choice: 死のうちに
  alternative: 死によって
  rationale: 領域の読みを本文で保ち、罪が死を手段として支配したという可能な読みへ一義的に限定しなかった。
translation_notes:
  register: 現代の一般読者に通じる端正な文体とし、「王として支配する」を反復して原文の擬人化と王権的比喩を保持した。「いのち」は聖書本文としての可読性と語感を考慮して平仮名表記とした。
