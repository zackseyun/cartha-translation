  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: ja
  text: というのは、律法が与えられるまで、罪は世にあったのです。しかし、律法がなければ、罪は勘定に付けられません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「算入されない」「数えられない」「人の勘定に付けられない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: というのは、律法以前にも
  rationale: ἄχρι νόμουが示す、律法に至るまでの期間を簡潔で自然な日本語にした。γάρは前節の説明を導く「というのは」で表した。文脈上はモーセの律法が念頭にあるが、本文に「モーセの」とは補わない。
- source_word: ἁμαρτία
  choice: 罪
  rationale: パウロ書簡での標準的な単数抽象名詞として訳し、罪の概念と擬人化され得る含みの両方を保った。
- source_word: ἐν κόσμῳ
  choice: 世に
  rationale: 罪が存在していた人間世界を指す自然で格調ある日本語表現。
- source_word: ἐλλογεῖται
  choice: 勘定に入れられない
  rationale: 会計上、ある者の勘定に付けるという語感を保ちつつ、「帰属」「転嫁」などの教義的に重い専門語を本文では避けた。
- source_word: μὴ ὄντος νόμου
  choice: 律法がなければ
  rationale: 律法の不在を条件として述べる属格独立構文を、明瞭で自然な条件表現にした。
theological_decisions:
- issue: νόμοςの指示対象
  choice: 「律法」と訳し、文脈上のモーセ律法への指示を暗示する
  alternative: 一般的な「法」と訳す、または「モーセの律法」と明示する
  rationale: アダムからモーセまでを論じる文脈ではモーセ律法が最も自然だが、原文自体には「モーセの」という限定がないため、それを本文に補わなかった。
- issue: ἐλλογεῖταιの神学的含意
  choice: 「勘定に入れられない」
  alternative: 「算入されない」「人の勘定に付けられない」「転嫁されない」
  rationale: 会計的・法廷的な含みを示しながら、罪の帰属や転嫁をめぐる特定の教理的解釈に本文で限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文としての落ち着きと論証的なつながりを保った。「世に」「勘定に入れられない」は日常語から離れすぎず、原文の簡潔さと会計的比喩を伝える。
