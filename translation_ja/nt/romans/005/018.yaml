  to: こういうわけで、一つの違反によってすべての人に有罪判決が及んだように、一つの正しい行いによって[a]、すべての人に命をもたらす義認が及んだのです。
  rationale: 中性単数の ἑνός が「人」ではなく「違反」および「正しい行い」を限定することを、日本語でも「一つの」により保ちました。「すべての人」の反復は維持し、後半の範囲を解釈的に限定していません。脚注は対象語句の直後に移し、本文との数的表現の不一致を解消しました。
