id: ROM.5.18
reference: Romans 5:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: ja
  text: こういうわけで、一つの違反によってすべての人に有罪判決が及んだように、一つの正しい行いによって[a]、すべての人に命をもたらす義認が及んだのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「一つの正しい行いを通して……命の義認へ」とも訳せます。
    reason: δικαιώματος と δικαίωσιν ζωῆς の、より字義的な訳し方を示すため。
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: こういうわけで
  rationale: 直前の議論を受けた推論・帰結を、自然な現代日本語で示す。
- source_word: παραπτώματος
  choice: 違反
  rationale: 神の定めに背く一つの行為を表し、「罪」一般へ抽象化しすぎない表現とした。
- source_word: κατάκριμα
  choice: 有罪判決
  rationale: 語の司法的な意味を明確にし、後半の「義認」との対照を保つ。
- source_word: δικαιώματος
  choice: 正しい行い
  rationale: この文脈で対比される一人の決定的な行為を指す。語そのものに明示されていない行為者や具体的内容は補わない。
- source_word: δικαίωσιν ζωῆς
  choice: 命をもたらす義認
  rationale: 属格の関係を結果として自然に表しつつ、「義認」という司法的概念と命との結び付きを保持する。
- source_word: πάντας ἀνθρώπους
  choice: すべての人
  rationale: 前半と後半で同一のギリシア語句が反復されているため、双方を同じく訳し、範囲を解釈によって狭めない。
theological_decisions:
- issue: 後半の「すべての人」の範囲を限定するか
  choice: 本文では「すべての人」をそのまま保持する。
  alternative: 「信じるすべての人」「義と認められるすべての人」などと限定する。
  rationale: 原文は比較の両側で同じ πάντας ἀνθρώπους を用いる。翻訳段階で後半だけを限定せず、文脈に残る神学的緊張を保つ。
- issue: δικαιώματος の行為者と内容を明示するか
  choice: 「一人の正しい行い」とし、本文にない「キリストの従順」などは補わない。
  alternative: 「一人の方の従順な行い」「キリストの義なる行為」と明示する。
  rationale: 文脈上の指示対象は明らかでも、この節の表現自体が持つ簡潔さと対応関係を保持する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、パウロの司法的な対照を示すため「有罪判決」「義認」を採用した。原文は両半とも動詞を省略しているが、日本語では「及んだ」を補って対句を明瞭にした。脚注記号は本文末に配置した。
