  naturalness: 「こういうわけで」「すべての人に…及んだ」は明快な現代標準日本語です。「一つの違反」はやや硬いものの、パウロの司法的・対照的な文脈では理解可能です。脚注記号は説明対象の直後に置くほうが、参照関係が明瞭です。
  terminology: 「有罪判決」は κατάκριμα の判決・処罰的な司法性を適切に表し、「義認」は δικαίωσις の確立した神学的・司法的用語として適切です。「命をもたらす義認」は δικαίωσιν ζωῆς の意味を過度に限定せず自然に示しています。
