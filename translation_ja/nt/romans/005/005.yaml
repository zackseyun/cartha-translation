id: ROM.5.5
reference: Romans 5:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: ja
  text: そして、この希望は私たちに恥をかかせることがありません。[a] 神の愛[b]が、私たちに与えられた聖霊を通して、私たちの心に注がれているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「失望に終わることがありません」。
    reason: lexical_alternative
  - marker: b
    text: 可能性は低いが、「神に対する私たちの愛」とも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: δέ
  choice: そして
  rationale: 軽い接続を示し、文脈にない強い対比を持ち込まないため。
- source_word: ἡ ἐλπίς
  choice: この希望
  rationale: 直前の文脈で語られた希望を自然な日本語で受けつつ、ἐλπίςの通常の意味を保つため。
- source_word: οὐ καταισχύνει
  choice: 私たちを恥じ入らせることがありません
  rationale: 語の中心にある恥の意味を保ち、日本語として理解できる表現にした。「失望させない」という結果的な意味も脚注に残す。
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: 神の愛
  rationale: 属格の形を簡潔に保つ。文脈上は神が私たちに示す愛が有力だが、神に対する愛という可能性を脚注に示す。
- source_word: ἐκκέχυται
  choice: 注がれている
  rationale: 完了形が示す、すでに注がれ、今もその結果が続いている状態を自然な日本語で表すため。
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: 私たちの心に
  rationale: 前置詞句を直接かつ自然に訳した。
- source_word: διὰ πνεύματος ἁγίου
  choice: 聖霊を通して
  rationale: 属格を伴うδιάの媒介・手段の意味を示すため。
- source_word: τοῦ δοθέντος ἡμῖν
  choice: 私たちに与えられた
  rationale: 分詞が聖霊を修飾する関係を、日本語の連体修飾で明確に表した。
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ における属格の意味
  choice: 神が私たちに注ぐ愛を文脈上の主たる意味とする「神の愛」
  alternative: 神に対する私たちの愛
  rationale: 聖霊を通して心に注がれたものが希望の確かさの根拠となるという因果関係は、神から私たちへの愛を強く支持する。ただしギリシア語の属格自体には別の解釈の余地があるため、脚注に保存した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「恥」というギリシア語の中核的な意味と完了形の継続的結果を保った。語順は日本語として自然になるよう整え、聖霊が与えられたことを連体修飾で示した。
