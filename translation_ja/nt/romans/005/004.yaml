id: ROM.5.4
reference: Romans 5:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: ja
  text: 忍耐は練られた品性[a]を生み、練られた品性は希望を生みます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「試されて確かとなった品性」、または「承認」。
    reason: δοκιμή は、試験を経て確かだと認められた状態や、その承認を表し得るため。
lexical_decisions:
- source_word: ὑπομονή
  choice: 忍耐
  rationale: 苦難のもとで持ちこたえ続けることを表す、明確で自然な現代日本語。文脈の連鎖にもよく合う。
- source_word: δοκιμή
  choice: 練られた品性
  rationale: 試練を経て確かであると示された人格・品性という結果的な意味を保つ。「品性」だけより試されたことが伝わり、「承認」より文脈上の人格形成を自然に表せる。
- source_word: ἐλπίς
  choice: 希望
  rationale: パウロ書簡における神に根ざした期待を含み得るが、ここでは標準的な「希望」が簡潔で十分。
- source_word: δὲ
  choice: —は／そして
  rationale: 強い逆接ではなく段階的な連鎖を示すため、日本語では対句構造と読点によって自然に接続した。
- source_word: 省略された動詞（κατεργάζεταιを補う）
  choice: 生みます
  rationale: 直前の5:3から補われる動詞を明示し、各段階が次の結果をもたらすという流れを自然な日本語で示す。
theological_decisions:
- issue: 聖化の連鎖における δοκιμή の意味
  choice: 試練を経て確かさが示された品性（「練られた品性」）
  alternative: 試す過程、または承認
  rationale: この連鎖では忍耐の結果として置かれているため、試験そのものよりも、試されて確かなものとなった人格的性質を表すと判断した。ただし「承認」という語義の可能性は脚注に残した。
translation_notes:
  register: 明確で格調を保った現代標準日本語。前後の文脈から続く文であるため、冒頭に接続詞を重ねず、反復構造によってギリシア語の段階的な連鎖を再現した。
