id: ROM.5.1
reference: Romans 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Δικαιωθέντες οὖν ἐκ πίστεως εἰρήνην ⸀ἔχομεν πρὸς τὸν θεὸν διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: ja
  text: したがって、信仰によって[b]義と認められた私たちは、私たちの主イエス・メシア[c]を通して、神との平和を得ています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「神との平和を得ようではありませんか」とあります。
    reason: textual_variant
  - marker: b
    text: 「信仰に基づいて」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語「クリストス」は「メシア」の意。伝統的には「キリスト」と訳されます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: 義と認められた
  rationale: アオリスト受動分詞の意味を、現代日本語で自然かつ法廷的含意を保つ表現にした。「義とされた」も可能だが、何が起きたかをやや明瞭に示す。
- source_word: οὖν
  choice: こういうわけで
  rationale: 直前までの議論から導かれる推論を、自然な現代日本語で示す。
- source_word: ἐκ πίστεως
  choice: 信仰によって
  rationale: ἐκの起点・根拠の含みを、このパウロ的構文に適した日本語で表す。「信仰に基づいて」も可能。
- source_word: εἰρήνην ἔχομεν
  choice: 平和を得ています
  rationale: 底本の直説法ἔχομενに従い、現在成立している状態を表す。日本語では「平和を持っています」より自然。異読の勧告法は脚注に残す。
- source_word: πρὸς τὸν θεὸν
  choice: 神との
  rationale: 平和の相手・関係を示す文脈なので、「神との」が最も自然である。
- source_word: διὰ τοῦ κυρίου ἡμῶν
  choice: 私たちの主…を通して
  rationale: διά＋属格の媒介を「を通して」で表し、κύριοςは敬称として「主」とする。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を「メシア」で保ち、日本語の人名・称号の連結として中黒を用いた。伝統的には「イエス・キリスト」。
theological_decisions:
- issue: δικαιωθέντεςの意味
  choice: 「義と認められた」とし、それ以上の教理的説明を本文に加えない。
  alternative: 「義とされた」「義と宣言された」「正しい者とされた」
  rationale: 神の義認の行為を表しつつ、それが「宣言」だけか内的変化も含むかという体系神学上の論争を本文で決着させない。
- issue: 「神との平和」の性質
  choice: 関係を表す「神との平和」と訳す。
  alternative: 「神との和解」「神から来る心の平安」
  rationale: 文脈上は神との回復された関係が中心だが、原語は「和解」ではなく「平和」であり、客観的関係とその広がりを狭めない。
- issue: ἔχομενとἔχωμενの本文異読
  choice: SBLGNTの直説法に従い「得ています」とする。
  alternative: 勧告法に基づく「平和を得ようではありませんか」
  rationale: 指定された底本を本文に採用し、重要な異読は脚注で明示する。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。論理接続を明示し、神学用語は一般読者にも理解可能な形にしつつ、重要な本文異読と語彙上の選択肢を脚注に保持した。
