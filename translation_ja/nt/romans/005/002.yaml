  rationale: 「導き入れられました」は、キリストを通して恵みに至るπροσαγωγήの趣旨を自然な日本語で表し、続く「私たちが今立っている」によって両完了形が指す継続した状態を保持します。「神の栄光への希望」は、栄光と希望の具体的関係を「あずかる」などと補足せず、解釈上の余地を保ちました。
