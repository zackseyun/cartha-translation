id: ROM.5.2
reference: Romans 5:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: ja
  text: この方を通して、私たちは信仰によって、私たちが今立っているこの恵みへと導き入れられました。そして、神の栄光への希望を誇りとしています[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「喜んでいます」または「大いに喜んでいます」。
    reason: καυχώμεθα は「誇る」のほか、文脈により「喜ぶ」「大いに喜ぶ」とも訳し得るため。
lexical_decisions:
- source_word: δι’ οὗ
  choice: この方を通して
  rationale: 直前のイエス・キリストを受ける関係代名詞句を明確にしつつ、媒介を表す διά の意味を保った。
- source_word: προσαγωγή
  choice: 入ることができました
  rationale: 神の恵みの領域へ近づき、受け入れられるという「接近・入場」の意味を、現代日本語として自然に表した。
- source_word: τῇ πίστει
  choice: 信仰によって
  rationale: 与格の手段的な意味を簡潔に表し、恵みに入る手段としての信仰を明示した。
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の文脈に即し、神から無償で与えられる好意と恩恵を表す定着した訳語を採用した。
- source_word: ἑστήκαμεν
  choice: 今立っている
  rationale: 完了形が示す、過去に成立して現在も続く状態を「今」によって自然に示した。「堅く立つ」として原文以上の強調は加えなかった。
- source_word: καυχώμεθα
  choice: 誇りとしています
  rationale: 単なる喜びに弱めず、パウロが肯定的に用いる「誇る」という意外性と修辞的な力を保ちながら、日本語として自然にした。
- source_word: ἐπ’ ἐλπίδι
  choice: 希望を
  rationale: 誇りの根拠・対象となる希望を自然な日本語で表した。「希望の中で」よりも文意が明瞭である。
- source_word: δόξης τοῦ θεοῦ
  choice: 神の栄光
  rationale: 属格構文を透明に訳し、それが神に属する栄光であることを保った。
theological_decisions:
- issue: καυχώμεθα の肯定的で緊張を伴う用法
  choice: 誇りとしています
  alternative: 喜んでいます／大いに喜んでいます
  rationale: 通常は否定的にも響く「誇る」をあえて残し、人間的な自己誇示ではなく、神の栄光への希望を誇るというパウロの神学的・修辞的緊張を解消しなかった。
- issue: τῆς δόξης τοῦ θεοῦ と希望との関係
  choice: 神の栄光への希望
  alternative: 神の栄光にあずかる希望
  rationale: 「あずかる」を補うと解釈が明瞭になる一方、原文には対応する動詞がないため、「への」によって希望の方向を示しつつ、栄光との具体的な関係は開いたままにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」は直前のキリストを指す。「今立っている」で完了形の継続状態を示し、「神の栄光への希望」は原文の簡潔さと解釈上の余地を保った。
