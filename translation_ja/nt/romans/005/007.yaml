  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: ja
  text: 正しい人のために死ぬ人は、めったにいません。しかし、善い人のためなら、ひょっとすると、あえて死ぬ人さえいるかもしれません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正しい人」と「善い人」の違いには、意図的な対照があるのかもしれません。また、「善い人」は「恩人」を意味する可能性もあります。
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: ほとんどいません
  rationale: 行為が極めてまれであることを表す文脈上の意味を、自然な現代日本語で示す。
- source_word: ὑπὲρ
  choice: 〜のために
  rationale: 受益・代理の含みを保ちつつ、日本語として簡潔で自然に訳す。
- source_word: δικαίου
  choice: 正しい人
  rationale: 実体詞的な形容詞を人として明示し、道徳的に正しいという語義を保つ。
- source_word: ἀποθανεῖται
  choice: 死ぬ者は…いません
  rationale: 未来形による一般的命題を、日本語では自然な一般論として表す。
- source_word: τοῦ ἀγαθοῦ
  choice: 善い人
  rationale: δικαίουとの語の違いを保ちながら、人格的・恩恵的な善さを限定しすぎない。
- source_word: τάχα
  choice: ひょっとすると
  rationale: 断定を避けた可能性を、現代日本語で明瞭に示す。
- source_word: καὶ
  choice: さえ
  rationale: 死を敢行するという意外性を強める上昇的用法を表す。
- source_word: τολμᾷ
  choice: 敢えてする者がいるかもしれません
  rationale: 大胆にも実行する可能性という意味を、τάχαと調和する自然な表現で示す。
- source_word: ἀποθανεῖν
  choice: 死ぬこと
  rationale: 前半との「死ぬ」の反復を保持する。
theological_decisions:
- issue: δικαίουとἀγαθοῦの区別を保持するか
  choice: 「正しい人」と「善い人」と訳し分ける
  alternative: 両方を近い同義語として同じ表現にする
  rationale: 二語の対照には意図がある可能性があり、原文にある神学的・修辞的な緊張を平板化しないため。
- issue: 「善い人」が恩人を特に指すか
  choice: 本文では広く「善い人」とする
  alternative: 「恩人」と限定して訳す
  rationale: 恩恵を施す人という解釈は可能だが、ἀγαθός自体はより広い意味を持つため、本文で一つの解釈に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語。丁寧体を用いて読みやすさと品位を両立し、「正しい」と「善い」の語彙的対照を保持した。
