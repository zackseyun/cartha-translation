id: ROM.5.19
reference: Romans 5:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: ja
  text: 一人の人の不従順によって、多くの者が罪人とされた[a]のと同じように、一人の人の従順によって、多くの者が正しい者とされる[b]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪人という立場に置かれた」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「正しい者という立場に置かれる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: 不従順
  rationale: 「従わないこと」を直接表し、後半のὑπακοή「従順」との対比を明確に保つ。
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: 一人の人
  rationale: 冠詞を伴う「一人」が文脈上アダムを指すことを保ちつつ、日本語として自然にした。
- source_word: ἁμαρτωλοὶ
  choice: 罪人
  rationale: 述語的に用いられた形容詞を、明快で標準的な名詞表現とした。
- source_word: κατεστάθησαν
  choice: とされた
  rationale: ある身分・状態に置かれたことを示す受動表現。単なる性質変化に限定せず、καθίστημιの含意を保つ。
- source_word: οἱ πολλοί
  choice: 多くの者
  rationale: 「多くの者」という範囲を解釈的に「すべての者」へ広げず、パウロの表現を保持する。日本語では定冠詞を独立して再現できないため自然な形にした。
- source_word: ὑπακοῆς
  choice: 従順
  rationale: παρακοή「不従順」と対をなす最も直接的な訳語。
- source_word: τοῦ ἑνὸς
  choice: 一人の方
  rationale: 原文では後半の「人」が省略される。その省略を保ちつつ、キリストを指す日本語として自然な敬意を示す「方」を用いた。
- source_word: δίκαιοι
  choice: 正しい者
  rationale: δικ-語群との意味的なつながりを保ちながら、現代日本語で理解しやすい表現とした。
- source_word: κατασταθήσονται
  choice: とされる
  rationale: 前半のκατεστάθησανと同じ動詞の未来受動であることを、対応する表現によって保つ。δικαιόωではないため「義と宣告される」とは限定しない。
- source_word: ὥσπερ γὰρ … οὕτως καὶ
  choice: …のと同じように、…からです
  rationale: 前節との理由づけを示すγάρと、両節の対応関係を自然な日本語で表した。
theological_decisions:
- issue: οἱ πολλοίの範囲
  choice: 多くの者
  alternative: すべての者
  rationale: 原文はοἱ πολλοίであり、その範囲を翻訳段階で「すべて」と確定せず、本文の神学的緊張を保つ。
- issue: καθίστημι＋述語形容詞が示す身分・状態
  choice: 罪人とされた／正しい者とされる
  alternative: 罪人と定められた／義と宣告される
  rationale: 同じ動詞による平行関係を保ち、法廷的宣告だけ、または内面的変化だけに意味を限定しない。
- issue: 後半のτοῦ ἑνὸςにおけるἀνθρώπουの省略
  choice: 一人の方
  alternative: 一人の人
  rationale: 原文の省略を反映しながら、前半との対応とキリストへの指示を自然な日本語で示す。
translation_notes:
  register: 明快な現代標準日本語を用い、荘重さを保った。「一人の人」と「一人の方」によって原文後半の名詞省略を映し、前後の平行も維持した。脚注はκαθίστημιが身分・状態に置くという含意を持つことを示し、特定の教理用語への限定を避ける。
