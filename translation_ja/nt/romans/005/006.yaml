id: ROM.5.6
reference: Romans 5:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: ja
  text: というのも、私たちがまだ弱かったとき、定められた時に、メシアは不敬虔な者たちのために死なれたからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Χριστὸς
  choice: メシア
  rationale: Χριστόςを称号として訳し、伝統的な音訳「キリスト」ではなく、その意味を明示する「メシア」とした。
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: 私たちがまだ弱かった時
  rationale: 属格独立構文を自然な時の節で表した。「弱かった」は、人間の無力さを示しつつ、その種類を必要以上に限定しない。
- source_word: ἔτι
  choice: まだ
  rationale: 継続していた状態を示す。ギリシア語では二度現れるが、日本語では一度明示することで、意味を保ちながら不自然な重複を避けた。
- source_word: κατὰ καιρὸν
  choice: 定められた時に
  rationale: 単なる時点ではなく、適切な、あるいは予定された時という含意を簡潔に表す。
- source_word: ὑπὲρ
  choice: 〜のために
  rationale: 利益・代表・身代わりの可能性を含む広い表現を選び、文脈上の神学的含意を一つに限定しない。
- source_word: ἀσεβῶν
  choice: 不敬虔な者たち
  rationale: 神への畏敬を欠く者という道徳的・宗教的意味を保つ、明確で格調ある表現。
- source_word: ἀπέθανεν
  choice: 死なれました
  rationale: 動詞の意味をそのまま表しつつ、メシアを主語とする日本語として自然な敬意を添えた。原文にない目的や結果は加えていない。
theological_decisions:
- issue: ὑπὲρ ἀσεβῶνが表すメシアの死の意味
  choice: 不敬虔な者たちのために
  alternative: 不敬虔な者たちに代わって
  rationale: 原文は、その死が不敬虔な者たちの益となることを明確にする一方、前置詞ὑπέρだけで代表や身代わりの厳密な体系を確定してはいない。本文では広い意味を保ち、より限定的な訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔さと聖書本文としての品位を両立させた。「実に」でγάρの説明・根拠提示の働きを表した。
