id: ROM.5.16
reference: Romans 5:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: ja
  text: また、その賜物は、一人の罪を犯した者によって生じたものとは同じではありません。[a] 裁きは一つの違反から有罪判決に至りましたが、恵みの賜物は多くの違反から義と認める判決に至ったからです。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「賜物は、一人の罪を犯した者によって生じたものとは同じではありません」。原文では比較される結果が省略されています。
    reason: 原文の省略を伴う比較構文と、「罪を犯した一人」という人称的指示を示すため。
  - marker: b
    text: 「一人から」とも訳せます。
    reason: ἐξ ἑνὸςは、文脈上「一つの違反」を指す可能性が高いものの、形の上では「一人」を指すことも可能なため。
  - marker: c
    text: 「正しい判決に」または「無罪判決に」とも訳せます。
    reason: δικαίωμαの司法的な語義の幅を示すため。
lexical_decisions:
- source_word: δώρημα
  choice: 賜物
  rationale: 与えられた贈り物を指す語。文脈にふさわしい品位を保ちつつ、現代日本語でも理解できる「賜物」とした。
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: 一人の人が罪を犯したことによってもたらされたもの
  rationale: ギリシア語の比較は省略を含むため、「もたらされたもの」を補って自然な日本語にしつつ、一人の罪を犯した者を介するという個人的な指示を保持した。
- source_word: κρίμα
  choice: 裁き
  rationale: 司法的な判断を表し、後続する「有罪判決」と区別しながら明瞭に伝える。
- source_word: ἐξ ἑνὸς
  choice: 一つの違反から
  rationale: 後半の「多くの違反」との対比から、ἑνόςを一つの違反と解した。原文上は「一人から」の可能性もあるため脚注に残した。
- source_word: κατάκριμα
  choice: 有罪判決
  rationale: 単なる非難ではなく、司法的に罪ありとする判決を具体的で分かりやすく表した。
- source_word: χάρισμα
  choice: 恵みの賜物
  rationale: χάριςとの語義的な結び付きを示し、前半のδώρημαとも訳し分けた。
- source_word: παραπτωμάτων
  choice: 違反
  rationale: 定めから踏み外す行為という道徳的・法的意味を、現代の読者に明瞭な語で表した。
- source_word: δικαίωμα
  choice: 義と認める判決
  rationale: κατάκριμαとの司法的な対照を保ち、「義認」の専門用語だけに頼らず判決としての具体性を示した。
theological_decisions:
- issue: κατάκριμαと対照されるδικαίωμαの司法的意味
  choice: 義と認める判決
  alternative: 無罪判決／義認
  rationale: 文全体の「裁き―有罪判決」と「恵みの賜物―δικαίωμα」という対照を明示する。δικαίωμαには「正しい判決」または「無罪とする判決」という具体的な含みがあり得るため、脚注で代案を示した。
- issue: ἐξ ἑνὸςが指すもの
  choice: 一つの違反
  alternative: 一人の人
  rationale: 直後の「多くの違反」との対称性を優先したが、属格形だけでは人を指す可能性を完全には排除できないため、その曖昧さを脚注に保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、パウロの司法的な対照を「裁き／有罪判決」と「恵みの賜物／義と認める判決」で保持した。「賜物」はやや格調のある聖書語だが、一般読者にも通じ、この文脈でのgiftを簡潔に表せる。
