  text: Ἀσπάσασθε Πρίσκαν καὶ Ἀκύλαν τοὺς συνεργούς μου ἐν Χριστῷ Ἰησοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/003.yaml
  text: Greet Prisca and Aquila[a], my fellow workers in Messiah Jesus[b],
translation:
  language: ja
  text: メシアであるイエスにあって[b]私と共に働くプリスカ[a]とアキラに、よろしく伝えてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「プリスカ」は原文にある名の形。別の箇所で用いられる、より親しみのある形「プリスキラ」と同じ人物を指す。
    reason: alternative_reading
  - marker: b
    text: 別訳「キリスト・イエスにあって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 書簡で挨拶を伝えるよう求める二人称複数の命令。日本語では「挨拶しなさい」よりも、この文脈に自然で明確な表現とした。
- source_word: Πρίσκαν
  choice: プリスカ
  rationale: 本文のΠρίσκαをそのまま音写した。別箇所で知られる「プリスキラ」と同一人物であることは脚注に示した。
- source_word: Ἀκύλαν
  choice: アキラ
  rationale: 人名Ἀκύλαςの標準的な日本語音写。
- source_word: συνεργούς μου
  choice: 私と共に働く
  rationale: パウロと共通の働きに携わる者という協働の意味を、現代日本語で自然に表した。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: キリスト・イエスにあって
  rationale: 彼らの共同の働きが成り立つ関係・領域を示す句として訳した。「キリスト」は日本語で定着した称号表現であり、称号の意味が明確になる別訳を脚注に示した。
theological_decisions:
- issue: パウロの定型句ἐν Χριστῷ ἸησοῦにおけるΧριστόςの訳し方
  choice: キリスト・イエスにあって
  alternative: メシアであるイエスにあって
  rationale: 「キリスト・イエス」は日本語聖書で定着し、原文の語順も保つ。一方、Χριστόςが本来「油注がれた者／メシア」という称号であることを隠さないため、意味を明示する訳を脚注に残した。
- issue: ἐνが示す関係
  choice: にあって
  alternative: に結ばれて
  rationale: 「にあって」は、単なる場所ではなく、キリストとの関係・結びつきの中で働くという幅を保つ。より説明的な「に結ばれて」に限定しなかった。
translation_notes:
  register: 明快な現代標準語を用い、書簡の挨拶として自然な「よろしく伝えてください」とした。敬体は命令を過度に強く響かせず、本文の指示として分かりやすい。人名は原文の形を尊重し、神学的に重要な称号とἐνの関係的含意は本文と脚注で保持した。
