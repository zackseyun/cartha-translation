  text: ἀσπάσασθε Ῥοῦφον τὸν ἐκλεκτὸν ἐν κυρίῳ καὶ τὴν μητέρα αὐτοῦ καὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/013.yaml
  text: Greet Rufus[a], the chosen one in the Lord, and his mother and mine.
translation:
  language: ja
  text: 主にあって選ばれたルフォス[a]に、また彼の母、そして私の母でもある方に、よろしく伝えてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主にあってすぐれた」とも訳せる。ギリシャ語は「選ばれた」のほか、「えり抜きの」「際立った」という意味にもなり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 複数の聞き手への命令で、手紙の結びにおける挨拶の依頼を、自然で丁寧な現代日本語で表す。
- source_word: Ῥοῦφον
  choice: ルフォス
  rationale: ギリシャ語の人名を、新約聖書で一般的な日本語表記に従って音写した。
- source_word: τὸν ἐκλεκτὸν
  choice: 選ばれた
  rationale: ἐκλεκτόςの基本的な意味を保ち、神による選びとも、際立った人物との評価とも理解し得る余地を残す。冠詞は日本語では独立した「者」を補わず、連体修飾として自然に表した。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 主との結びつき・領域を表す曖昧さを保持する、簡潔で尊厳ある定訳的表現。
- source_word: τὴν μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: 彼の母、そして私の母でもある方
  rationale: 直訳的な「彼の母と私の母」が二人の母を指すように誤読されるのを避け、同一人物がパウロにとっても母のような存在であることを自然に示す。
theological_decisions:
- issue: ἐκλεκτὸν ἐν κυρίῳ の意味
  choice: 「主にあって選ばれた」と訳し、選びの主体や具体的性質を限定しない。
  alternative: 「主にあってすぐれた」「主に選ばれた」
  rationale: 原文は、神の選びという含意と、主にある際立った人物という評価の双方を許し得る。「主にあって」をそのまま保つことで、特定の教理体系へ狭めない。
- issue: 「彼の母、そして私の母」の関係
  choice: 同一の女性がルフォスの実母であり、パウロにとっても母のような存在であることを示す。
  alternative: パウロの実母でもあるという字義的理解
  rationale: 文脈上は愛情と世話を表す比喩的・関係的な呼称が自然である。ただし説明的に「母のような」と置き換えず、原文の家族的表現を保った。
translation_notes:
  register: 明瞭な現代標準日本語。書簡末尾の丁寧な挨拶として「よろしく伝えてください」を用い、「主にあって」は原文の関係的・神学的な幅を保つため維持した。
