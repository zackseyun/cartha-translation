id: ROM.16.14
reference: Romans 16:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀσύγκριτον, Φλέγοντα, ⸂Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν⸃ καὶ τοὺς σὺν αὐτοῖς ἀδελφούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: ja
  text: アシンクリト、フレゴン、ヘルメス、パトロバ、ヘルマス、また彼らと一緒にいる兄弟たち[a]に、よろしく伝えてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、ここでは彼らと関わりのある信徒仲間を指すと考えられる。
    reason: 語が文脈上、実の兄弟ではなく共同体の仲間を指す用法であることを明確にするため。
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 手紙の結びに連なる挨拶の命令として、複数の読者に向けたアオリスト中動態命令を、現代日本語で自然かつ丁寧に表した。
- source_word: Ἀσύγκριτον, Φλέγοντα, Ἑρμῆν, Πατροβᾶν, Ἑρμᾶν
  choice: アシンクリト、フレゴン、ヘルメス、パトロバ、ヘルマス
  rationale: 人名として日本語の慣用的な音写を用い、特にἙρμῆν（ヘルメス）とἙρμᾶν（ヘルマス）を区別した。
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: 彼らと一緒にいる兄弟たち
  rationale: σὺν αὐτοῖςを「彼らと一緒にいる」と明示し、男性複数形ἀδελφούςを「兄弟たち」と訳した。ここでは名を挙げられた人々と関係するキリスト者仲間を指すと考えられるが、本文では原文の表現を保った。
theological_decisions:
- issue: 共同体への挨拶におけるἀδελφούςの訳し方
  choice: 兄弟たち
  alternative: 信徒たち／兄弟姉妹たち
  rationale: 原文は男性複数形であり、この短い挨拶句だけでは男女混合の集団だと明示されていないため、本文では形を保つ。一方、パウロ書簡では信仰を同じくする仲間を指し得ることを脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、手紙の結びの挨拶にふさわしい丁寧さを保った。列挙される人名は簡潔に音写し、命令表現は硬すぎる「挨拶せよ」ではなく「よろしく伝えてください」とした。
