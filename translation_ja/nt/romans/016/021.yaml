  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: ja
  text: 私の同労者テモテが、あなたがたによろしくと言っています。また、私の同族[a]であるルキオ、ヤソン、ソシパトロもよろしくと言っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の親族」、または「私と同じユダヤ人」とも訳せる。ギリシア語は、血縁関係だけでなく、より広い民族的なつながりを指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται ὑμᾶς
  choice: あなたがたによろしくと言っています
  rationale: 書簡の挨拶で用いられる表現として、複数の受取人に挨拶を送る意味を、現代日本語で自然かつ明確に表した。
- source_word: συνεργός
  choice: 同労者
  rationale: パウロと共に働く者を指す語であり、共同の働き、とりわけ宣教の働きを簡潔に表す定着した日本語を選んだ。
- source_word: Τιμόθεος
  choice: テモテ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: Λούκιος
  choice: ルキオ
  rationale: ギリシア語形に対応し、日本語聖書で通用する人名表記を用いた。
- source_word: Ἰάσων
  choice: ヤソン
  rationale: ギリシア語の人名を、日本語聖書で定着した形により表記した。
- source_word: Σωσίπατρος
  choice: ソシパトロ
  rationale: この節のギリシア語形Σωσίπατροςを反映し、短縮形に置き換えず日本語で慣用的な語尾を用いた。
- source_word: συγγενεῖς μου
  choice: 私の同族
  rationale: 血縁の親族にも、より広い民族的な同胞にもなり得る語の幅を保つため、「親族」や「同胞」と限定せず「同族」とした。
theological_decisions:
- issue: συγγενεῖς μουが示す関係の範囲
  choice: 私の同族
  alternative: 私の親族／私と同じユダヤ人
  rationale: この語は血縁関係を指す場合も、民族的なつながりを指す場合もある。この節だけでは特定できないため、本文では曖昧さを残し、脚注で可能な意味を示した。
translation_notes:
  register: 明瞭で現代的ながら品位のある文体とした。「よろしくと言っています」を反復して、最初の単数動詞と、続く三人も挨拶を送る構造を日本語で明確にした。
