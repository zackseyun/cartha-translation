  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: ja
  text: メシア[a]にあって認められたアペレに、よろしく伝えてください。アリストブロの家の人たちにも、よろしく伝えてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「キリストにあって」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 複数相手への命令で、挨拶を伝えるよう求める表現。現代日本語として自然であり、ローマ書16章に繰り返される挨拶の調子も保つ。
- source_word: Ἀπελλῆν
  choice: アペレ
  rationale: ギリシア語の人名を、日本語の聖書で通用している形に沿って音写した。
- source_word: τὸν δόκιμον
  choice: 真価を認められている
  rationale: δόκιμοςには、試されて真正であると認められたという含みがある。「真価を認められている」は称賛の力を保ちつつ、日本語として自然である。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: パウロ特有の、メシアとの結びつき・その領域を示す表現を、「にあって」として保持した。Χριστόςはここで称号としての意味を保つため「メシア」とした。
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: アリストブロの家の人たち
  rationale: 直訳的には「アリストブロに属する者たち」だが、本人ではなく、その家に属する人々を指す可能性が高い。原文の簡潔さを大きく損なわず、自然な日本語で表した。
theological_decisions:
- issue: パウロの句 ἐν Χριστῷ における Χριστῷ の訳
  choice: メシアにあって
  alternative: キリストにあって
  rationale: Χριστόςの称号性と、ἐνが表す結びつき・領域の神学的含みを保つため。「キリスト」は伝統的で親しまれた訳なので脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用い、命令は丁寧で自然な「よろしく伝えてください」とした。「にあって」はパウロの表現が持つ神学的な幅を性急に言い換えないため保持した。
