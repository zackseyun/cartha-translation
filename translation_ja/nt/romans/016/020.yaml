  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: ja
  text: 平和の神は、間もなくサタンをあなたがたの足の下に踏み砕かれます。私たちの主イエス・メシア[a]の恵みが、あなたがたとともにありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエス・キリスト」。
    reason: Χριστόςは「メシア」という称号を意味するが、日本語では伝統的に「キリスト」と音写される。
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: 平和の神は
  rationale: パウロ書簡に見られる属格表現を、定着した簡潔な称号として保った。δέは文脈上の軽い移行・対比を担うが、この一節だけの自然な日本語では明示しない。
- source_word: συντρίψει
  choice: 踏み砕いてくださいます
  rationale: 未来の確実な行為を表し、「足の下」と結びつく勝利・征服の比喩を自然に伝える。「くださいます」により、信徒のためになされる神の行為として日本語の敬意を示す。
- source_word: τὸν Σατανᾶν
  choice: サタンを
  rationale: 固有名として、新約聖書で広く通用する音写を用いた。「敵対者」と意訳して解釈を本文に持ち込むことを避けた。
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: あなたがたの足の下で
  rationale: ὑμῶνの複数形を「あなたがた」で明示し、ローマの信徒共同体への呼びかけを保った。「足の下」は服従・勝利を表す原文の比喩を保持する。
- source_word: ἐν τάχει
  choice: 間もなく
  rationale: ここでは行為の速さだけでなく時間的な近さを表すと判断し、自然な現代日本語の「間もなく」とした。
- source_word: ἡ χάρις
  choice: 恵みが
  rationale: パウロの祝福の定型句と主要な神学語を、教会用語としても一般に理解される「恵み」で保った。
- source_word: τοῦ κυρίου ἡμῶν
  choice: 私たちの主…の
  rationale: 属格の所有・源泉関係を自然な連体修飾で表し、ἡμῶνを「私たちの」と明示した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味「メシア」を本文で明示した。日本語で定着した伝統的表現「イエス・キリスト」は脚注に示す。
- source_word: μεθ’ ὑμῶν
  choice: あなたがたとともにありますように
  rationale: 原文で省略されている願望の動詞を、日本語の祝福文として自然な「ありますように」で補った。複数の受け手は「あなたがた」で保持した。
theological_decisions:
- issue: 結びの祝福における Χριστοῦ の訳
  choice: メシア
  alternative: キリスト
  rationale: この箇所ではイエスに付される称号としての意味を読者に明示するため「メシア」を採用した。一方、日本語で名の一部のように定着した「キリスト」も正当な訳であるため脚注に残し、原語が持つ称号性と伝統的表現の双方を確認できるようにした。
- issue: 神がサタンを信徒の足の下で砕くという主体関係
  choice: 神を行為主体としつつ「あなたがたの足の下で」を保持
  alternative: 神がご自分の足でサタンを砕くと説明的に言い換える
  rationale: 原文は神を主語としながら、サタンが信徒たちの足の下に置かれるという共同体的勝利の表現を用いる。この緊張を解消せず、そのまま保った。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で格調ある祝福文とした。共同体への複数形の呼びかけは「あなたがた」で明示し、終止部は日本語の祈願表現「ありますように」を用いた。
