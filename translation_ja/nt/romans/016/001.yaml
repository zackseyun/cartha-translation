id: ROM.16.1
reference: Romans 16:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: ja
  text: ケンクレアにある教会の奉仕者[a]でもある、私たちの姉妹フィベを、あなたがたに推薦します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「執事」または「仕える者」とも訳せる。ギリシア語ディアコノスは、教会で認められた奉仕の務めを指すことも、より一般的に仕える人を指すこともある。
    reason: διάκονοςの一般的用法と教会内の役割を指す用法との曖昧さを保持するため。
lexical_decisions:
- source_word: Συνίστημι
  choice: 推薦します
  rationale: 手紙の中で人物を受取人に好意的に紹介する用法を、明瞭で自然な現代日本語にした。「紹介します」よりも、受け入れるよう勧める含意を保つ。
- source_word: δὲ
  choice: （独立した語としては訳さない）
  rationale: ここでは強い逆接ではなく穏やかな話題転換を示す。日本語では文脈と語順によって自然に表せるため、「さて」などを補わなかった。
- source_word: Φοίβην
  choice: フィベ
  rationale: ギリシア語 Φοίβη の日本語聖書で定着した音写を用いた。
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: 私たちの姉妹
  rationale: 信仰共同体に属する仲間を家族語彙で呼ぶ表現を、そのまま簡潔に保った。
- source_word: οὖσαν καὶ
  choice: でもある
  rationale: 付加を表す καί と分詞構文を、フィベについての追加情報として自然な日本語にした。
- source_word: διάκονον
  choice: 奉仕者
  rationale: 教会における一定の務めを指す可能性と、より一般的に仕える者を指す可能性の双方を残し、後代の制度的職名に限定しない訳語を選んだ。職名としての「執事」の可能性は脚注に示した。
- source_word: τῆς ἐκκλησίας
  choice: 教会の
  rationale: パウロ書簡におけるキリスト者の地域共同体を指す標準的で明瞭な訳語。
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: ケンクレアにある
  rationale: 地名 Κεγχρεαί を慣用的に音写し、ἐν の場所的関係を自然な日本語で示した。
theological_decisions:
- issue: διάκονον が一般的な奉仕者を指すか、教会の職務名を指すか
  choice: 奉仕者
  alternative: 執事、仕える者
  rationale: 特定の教会との属格関係は公的または認知された務めを示唆し得るが、語そのものだけでは後代の制度的な職制まで確定できない。本文では意味範囲を比較的広く保ち、職名として理解する可能性を脚注に残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の推薦文としての機能を保ちつつ、語順を日本語として自然に整えた。διάκονοςを性別で言い換えず、教会制度を過度に特定しない表現とした。
