  text: Τῷ δὲ δυναμένῳ ὑμᾶς στηρίξαι κατὰ τὸ εὐαγγέλιόν μου καὶ τὸ κήρυγμα Ἰησοῦ Χριστοῦ, κατὰ ἀποκάλυψιν μυστηρίου χρόνοις αἰωνίοις σεσιγημένου,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/025.yaml
  text: '[A] to him who is able to strengthen you according to my gospel and the preaching of Jesus the Messiah, according to the revelation of the mystery kept secret for long ages,'
translation:
  language: ja
  text: あなたがたを、私の福音とイエス・メシアの宣教に従って、また、長い時代にわたって沈黙のうちに置かれていた奥義の啓示に従って、堅く立たせることのできる方に。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 25–27節は結びの頌栄です。古代写本では置かれる位置が異なり、ビザンツ系多数本文では14章末、現存する最古のパピルスでは15章の後、主要な4世紀写本とラテン語伝承ではここ16章末にあります。複数の位置に収める写本もあり、全体を欠く写本も少数あります。現代の多くの翻訳は、パウロの手紙の結びとしてここに置いています。「イエス・メシアの宣教」は、「イエス・メシアについての宣教」とも、「イエス・メシアによる宣教」とも理解できます。
    reason: textual_critical_and_translation
lexical_decisions:
- source_word: στηρίξαι
  choice: 堅く立たせる
  rationale: 信仰者を確立し、揺るがない者とする意味を、原語の「立たせる」という像を保ちながら自然な日本語で表す。
- source_word: τὸ εὐαγγέλιόν μου
  choice: 私の福音
  rationale: 「私が宣べ伝える福音」という意味だが、パウロの簡潔な所有表現と、後続節へ続く頌栄の構文を保持する。
- source_word: τὸ κήρυγμα Ἰησοῦ Χριστοῦ
  choice: イエス・キリストについての宣教
  rationale: 属格は「イエス・キリストによる宣教」とも取り得るが、ここでは福音の内容を示す目的格的理解を本文に採用し、別解を注記する。κήρυγμα は宣教行為または宣べ伝えられる内容を指し得るため、「宣教」とした。
- source_word: μυστηρίου
  choice: 奥義
  rationale: かつて隠され、今や神によって啓示された救いの計画を指す聖書的用法を表す。「謎」よりも啓示との結びつきを明確にする。
- source_word: χρόνοις αἰωνίοις
  choice: 永い時代にわたって
  rationale: 字義的な「永遠の時」の不自然さを避け、はるかな過去から長期間続いたことを示す慣用的意味を表す。
- source_word: σεσιγημένου
  choice: 語られずにいた
  rationale: 完了受動分詞の、過去からその時まで沈黙のうちに置かれていた状態を表す。「隠されていた」と意訳しすぎず、σιγάω の沈黙・不言の像を保つ。
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ の属格が κήρυγμα に対して示す関係
  choice: イエス・キリストについての宣教
  alternative: イエス・キリストによる宣教
  rationale: 文脈上、パウロが宣べ伝える福音の内容としてキリストを指す理解が自然だが、原文の属格自体は主体を示す解釈を排除しないため、脚注で曖昧さを保存する。
- issue: Χριστός の訳語
  choice: キリスト
  alternative: メシア
  rationale: 日本語では「イエス・キリスト」が称号を含む定着した表現であり、一般読者に明瞭で荘重である。語義上は「メシア、油注がれた者」である。
translation_notes:
  register: 現代標準日本語の荘重な書簡・頌栄調。25–27節で完結する長い統語構造の一部であるため、この節単独では意図的に「方に。」と未完結感を残した。脚注マーカーは本文に実在するものだけを用いるべきなので、空の[b]項目は公開稿では削除対象。
