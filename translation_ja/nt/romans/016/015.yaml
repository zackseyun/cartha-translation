id: ROM.16.15
reference: Romans 16:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: ja
  text: フィロロゴとユリア[a]に、ネレウスとその姉妹に、オリンパに、また彼らと共にいるすべての聖なる者たちに、よろしく伝えてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 男性名と解して「ユリアス」とする可能性もあるが、このギリシア語形は通常、女性名「ユリア」と理解される。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 書簡の結びにおいて挨拶を伝えるよう求める、アオリスト中動態命令法二人称複数。現代日本語では簡潔で自然な依頼表現とした。
- source_word: Φιλόλογον
  choice: フィロロゴ
  rationale: ギリシア語の人名 Φιλόλογος の日本語音写。語尾を原語の発音に近く表した。
- source_word: Ἰουλίαν
  choice: ユリア
  rationale: 対格形は通常、女性名 Ἰουλία と理解される。男性名とする可能性は脚注に残した。
- source_word: Νηρέα
  choice: ネレウス
  rationale: 主格形 Νηρεύς に基づく慣用的な日本語音写。
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: その姉妹
  rationale: ἀδελφή は実の姉または妹のいずれも表し得るため、年長・年少を特定しない「姉妹」とした。文脈上 αὐτοῦ は直前のネレウスを指す。
- source_word: Ὀλυμπᾶν
  choice: オリンパ
  rationale: 人名 Ὀλυμπᾶς の対格形を、日本語で一般的な表記に音写した。
- source_word: τοὺς σὺν αὐτοῖς
  choice: 彼らと共にいる
  rationale: σύν＋与格の連帯・同伴を自然な日本語で表した。αὐτοῖς は複数形で、名を挙げられた人々をまとめて指す。
- source_word: πάντας ἁγίους
  choice: 聖なる者たちすべて
  rationale: ἅγιοι はパウロ書簡で信徒を指す呼称。「聖徒」より意味が伝わりやすく、後代の列聖概念との混同を避けつつ、語の『聖なる』という意味を保持した。
theological_decisions:
- issue: パウロの挨拶における ἅγιοι の訳
  choice: 聖なる者たち
  alternative: 聖徒／神の聖なる民
  rationale: ここでは名を挙げられた人々と共にいる信徒たちを指す。原語の聖性という含意を保ち、特別に列聖された一部の人物だけを指すとの誤解を避けた。
- issue: Ἰουλίαν の性別
  choice: 女性名「ユリア」
  alternative: 男性名「ユリアス」
  rationale: この語形は女性名 Ἰουλία の対格と理解するのが最も自然である。ただし翻訳史上、男性名と解する説もあるため脚注に示した。
- issue: ἀδελφή が示す年長・年少
  choice: 姉妹
  alternative: 姉／妹
  rationale: ギリシア語は姉と妹を区別しないため、本文でどちらかに限定しなかった。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。人名を列挙する原文の構造を保ちつつ、各対象に助詞「に」を補って読みやすくした。「よろしく伝えてください」は複数の受取人に対する命令を、日本語として自然で丁寧な書簡表現にしたもの。
