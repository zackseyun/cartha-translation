id: ROM.16.4
reference: Romans 16:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: ja
  text: 二人は私の命のために、自分たちの首を差し出しました[a]。この二人に感謝しているのは私だけではありません。異邦人のすべての教会も感謝しています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「首を差し出す」は、自らを死の危険にさらすことを表す言い回し。ギリシア語では「首」は単数形である。
    reason: 原文の比喩的な慣用表現と文法上の単数形を説明するため。
  - marker: b
    text: 別訳「諸国民のすべての教会」。
    reason: ἐθνῶνの字義に近い訳語を示し、「異邦人」という文脈的訳の幅を保持するため。
lexical_decisions:
- source_word: οἵτινες
  choice: 二人は
  rationale: 前節のプリスカとアキラを受ける説明的な関係代名詞。日本語では指示対象を明示して文を続けるのが自然である。
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: 私の命のために
  rationale: ψυχήはここでは非物質的な「魂」ではなく、死の危険から守られるパウロの命を指す。
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: 自分たちの首を差し出してくれました
  rationale: 命を危険にさらすことを表す慣用句の具体的な比喩を保ちつつ、「くれました」によりパウロが受けた恩恵を自然な日本語で示す。
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: この二人に感謝しているのは、私だけでなく、…もです
  rationale: パウロだけではないという強調と、後続する諸教会との対比を明瞭で自然な日本語にする。
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: すべての教会
  rationale: 定冠詞を伴う複数形の全称表現を簡潔に反映する。
- source_word: τῶν ἐθνῶν
  choice: 異邦人の
  rationale: パウロの文脈でἔθνηは通常、ユダヤ人に対する非ユダヤ人を指すため、「諸国民」より「異邦人」が文脈上明確である。
theological_decisions:
- issue: ψυχήが指すもの
  choice: 命
  alternative: 魂
  rationale: 首を差し出すという死の危険を表す表現と結び付いており、ここではパウロの生命を意味する。
- issue: ἐθνῶνの意味
  choice: 異邦人
  alternative: 諸国民
  rationale: ローマ書におけるユダヤ人と非ユダヤ人の文脈を明確に伝えつつ、語が持つ民族的な意味を反映する。
- issue: 「首を差し出す」という比喩
  choice: 比喩を本文に保持する
  alternative: 命を危険にさらす
  rationale: 原文の鮮烈な身体的イメージを残し、慣用的意味は脚注で補うことで、意味と表現の双方を伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、原文の「首を差し出す」という具体的で力強い比喩を保持した。「くれました」は感謝の文脈に自然だが、過度に口語的にならない丁寧体として整えた。
