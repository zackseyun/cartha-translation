  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: ja
  text: 聖なる口づけをもって、互いに挨拶を交わしなさい。[a] メシアに属するすべての教会が、あなたがたに挨拶を送っています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖なる口づけ」は、信者どうしの聖なる親愛と交わりを表す、当時文化的に用いられていた挨拶でした。
    reason: cultural_note
  - marker: b
    text: 「メシア」は「キリスト」とも訳せます。したがって、「キリストに属するすべての教会」とも訳せます。
    reason: alternative_rendering
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: 互いに挨拶しなさい
  rationale: ἀσπάσασθεは手紙の結びで用いられる挨拶の命令、ἀλλήλουςは相互性を示すため、明瞭で自然な現代日本語とした。
- source_word: ἐν φιλήματι ἁγίῳ
  choice: 聖なる口づけを交わして
  rationale: ἐνはここでは挨拶の方法・伴う行為を示す。φίλημαを「口づけ」、ἁγίῳを「聖なる」とし、信徒間の挨拶としての行為を自然に表した。
- source_word: Ἀσπάζονται ὑμᾶς
  choice: あなたがたによろしくと言っています
  rationale: 書簡の挨拶表現として自然な日本語を採用し、ὑμᾶςが複数の受取人を指すことを「あなたがた」で明示した。
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: すべての教会
  rationale: 冠詞を伴うπᾶσαιの全体性を保ち、「すべての教会」とした。
- source_word: τοῦ Χριστοῦ
  choice: メシアの
  rationale: Χριστόςの称号としての意味を「メシア」で示し、属格の所属・関係性を簡潔な「の」で保持した。
theological_decisions:
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: この句では称号としての意味が認められるため、語源的・ユダヤ的背景を明示する「メシア」を本文に採用した。伝統的な音訳「キリスト」も可能なので脚注に示した。
- issue: 「聖なる口づけ」の性格
  choice: 本文では字義どおりに訳し、文化的説明を脚注に置く
  alternative: 聖い親愛を込めて挨拶しなさい
  rationale: 具体的な行為を一般的原則へ置き換えず、原文の歴史的・文化的表現を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、書簡の勧告と挨拶にふさわしい品位を保った。「口づけ」は原文の具体性を残すため維持し、その文化的意味は脚注で補った。
