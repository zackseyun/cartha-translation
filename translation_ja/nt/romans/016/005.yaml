id: ROM.16.5
reference: Romans 16:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: ja
  text: また、二人の家にある教会にもよろしく伝えてください。[a] 私の愛するエパイネトによろしく伝えてください。彼は、メシアのためのアジア州の初穂です。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二人の家に集まる教会」。
    reason: lexical_alternative
  - marker: b
    text: 「アジア州」は、現代のアジア大陸ではなく、ローマ帝国の属州を指す。
    reason: cultural_note
  - marker: c
    text: すなわち、「アジア州で最初にメシアを信じた人」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: また、二人の家にある教会にも
  rationale: κατάを伴う句が、その家に集う共同体を指すことを踏まえつつ、「家にある教会」として原文の簡潔さを保った。αὐτῶνは直前の夫婦を受けるため、日本語では「彼ら」より自然な「二人」とした。
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 書簡末尾の挨拶の文脈における自然な現代日本語であり、「挨拶しなさい」よりも日本語の手紙として明瞭である。
- source_word: Ἐπαίνετον
  choice: エパイネト
  rationale: ギリシア語名を日本語の聖書名として自然に音写した。
- source_word: τὸν ἀγαπητόν μου
  choice: 私の愛する
  rationale: パウロの個人的な愛情を、過度に古風な「愛する者」ではなく、自然で品位ある表現として保った。
- source_word: ἀπαρχὴ
  choice: 初穂
  rationale: 最初の収穫物という比喩を保持し、「最初の回心者」と解釈的に限定しなかった。
- source_word: τῆς Ἀσίας
  choice: アジア州の
  rationale: ここでのἈσίαが現代の大陸ではなくローマ属州を指すことを本文で簡潔に明示した。
- source_word: εἰς Χριστόν
  choice: メシアのための
  rationale: εἰςの方向・帰属の含みを「ための」で保ち、Χριστόςは称号として「メシア」とした。
theological_decisions:
- issue: Χριστόνの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号としての意味が保たれており、「メシア」はその語義を明示する。日本語で定着した「キリスト」も可能だが、本文では称号性を優先した。
- issue: ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόνの意味
  choice: メシアのためのアジア州の初穂
  alternative: アジア州で最初にメシアを信じた人
  rationale: 原文の初穂の比喩とεἰςの関係表現を本文に残し、最初の信者・回心者という妥当な解釈は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、書簡の挨拶として自然な「よろしく伝えてください」を採用した。「初穂」はパウロの比喩を保持するため残し、その意味を脚注で補った。
