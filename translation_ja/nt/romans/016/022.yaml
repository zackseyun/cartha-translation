  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: ja
  text: この手紙を書いた私テルティオが、主にあって、あなたがたに挨拶を送ります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳（可能性は低い）「主にあってこの手紙を書いた私テルティオが、あなたがたに挨拶を送ります。」ギリシア語の「主にあって」は「書いた」に係るとも取れるが、「挨拶を送ります」に係ると見るほうが自然である。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: 挨拶を送ります
  rationale: 手紙の結びにおける「挨拶する、よろしく伝える」という意味を、自然な現代日本語で表した。原文に明示されない感情的な強調は加えていない。
- source_word: ὑμᾶς
  choice: あなたがたに
  rationale: 二人称複数の目的語であることを日本語でも明示した。
- source_word: ἐγὼ Τέρτιος
  choice: 私テルティオが
  rationale: 明示された一人称代名詞と固有名を保ち、発話者がテルティオであることを明確にした。
- source_word: ὁ γράψας
  choice: 書いた
  rationale: アオリスト分詞を自然な連体修飾で表した。テルティオが実際に筆記したことを示すが、「口述筆記者」など原文にない役割名は補っていない。
- source_word: τὴν ἐπιστολήν
  choice: この手紙を
  rationale: 日本語では発話中の当該書簡を指す「この手紙」が自然である。「書簡」より一般読者に分かりやすい「手紙」を選んだ。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: パウロ書簡に特徴的な関係・領域を表す句を、神学的含意を狭めずに保持した。κύριος は「主」とした。
theological_decisions:
- issue: ἐν κυρίῳ の係り先
  choice: 主にあって挨拶を送る
  alternative: 主にあってこの手紙を書いた
  rationale: 語順と書簡の挨拶という文脈からは主動詞「挨拶する」に係る理解がより自然である。ただし、直前の「書いた」に係る文法上の可能性もあるため、脚注で残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、書簡の結びにふさわしい丁寧さを保った。「主にあって」は説明的に言い換えず、原文の関係的・神学的な幅を残した。
