id: ROM.16.19
reference: Romans 16:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: ja
  text: あなたがたの従順はすべての人に知れ渡っているからです[a]。ですから、私はあなたがたのことで喜んでいます[b]。しかし、あなたがたには、善については賢く、悪については純真であってほしいのです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたの従順は、すべての人にまで達した」。
    reason: 原文の比喩的表現と、本文で明示した文脈上の意味を示すため。
  - marker: b
    text: 別訳「私はあなたがたゆえに喜んでいます」。
    reason: ἐφ’ ὑμῖνが喜びの理由または契機を表す可能性を示すため。
  - marker: c
    text: 「純真」は、「純粋」「混じり気がない」「悪意がない」とも訳せる。
    reason: ἀκέραιοςの語義の幅を示すため。
lexical_decisions:
- source_word: ὑπακοή
  choice: 従順
  rationale: パウロ書簡では、単に聞くことではなく、聞いて従う応答を表すため、「従順」とした。
- source_word: εἰς πάντας ἀφίκετο
  choice: すべての人に知れ渡っている
  rationale: 字義的には「すべての人にまで達した」だが、従順についての評判が広く伝わったという文脈上の意味を自然な日本語で表した。「すべての人」は修辞的な広がりを保つ。
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: あなたがたのことで喜んでいます
  rationale: ἐπί＋与格は喜びの理由・契機を示し得る。「あなたがたのことで」は、対象と理由の含みを自然に伝える。
- source_word: σοφοὺς εἶναι εἰς τὸ ἀγαθόν
  choice: 善については賢く
  rationale: 善に関して実際的な知恵と識別力を働かせることを簡潔に表し、後半との対句を保った。
- source_word: ἀκεραίους δὲ εἰς τὸ κακόν
  choice: 悪については純真で
  rationale: ἀκέραιοςには「混じり気のない、純粋な、無垢な」の意味がある。「純真」は悪に染まらず、悪巧みに通じないという含みを保ちつつ、幼稚な無知とは断定しない。
theological_decisions:
- issue: πάνταςの範囲
  choice: 「すべての人」として、広く知れ渡ったという修辞的表現を保持した。
  alternative: 「すべての教会の人々」「あらゆる所の人々」などに限定する。
  rationale: 本文自体は対象を限定していないため、数学的な絶対普遍性とも特定集団への限定とも決めず、原文の広い表現を残した。
- issue: 善への知恵と悪へのἀκέραιοςの対照
  choice: 「善については賢く、悪については純真」とした。
  alternative: 「善には熟達し、悪には無知」「善に賢く、悪から潔白」など。
  rationale: 積極的な善の識別と、悪に染まらないあり方との緊張を保ち、悪について一切の知識を持つべきでないという解釈は持ち込まなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、勧告の格調と「善／悪」の対句を保持した。「知れ渡っている」は原文の字義から一歩踏み込むため脚注で直訳を示し、「純真」には語義上の幅があるため注記した。
