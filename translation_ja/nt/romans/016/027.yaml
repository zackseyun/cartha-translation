source:
  edition: robinson-pierpont-2005-byzantine
  text: μόνῳ σοφῷ θεῷ, διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς αἰῶνας. Ἀμήν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/027.yaml
  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: ja
  text: 唯一の知恵ある神に、イエス・キリストを通して、栄光が永遠にありますように。[a] アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、結びの頌栄（ローマ16:25–27）を締めくくる。この頌栄の有無と置かれる位置は初期の写本間で大きく異なるが、ここではビザンチン系多数本文の伝承に従って収録している。
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ σοφῷ θεῷ
  choice: 唯一の知恵ある神に
  rationale: μόνῳを「唯一の」とし、神が究極の知恵を独占的に持つことを示す与格句の形を保った。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: イエス・キリストを通して
  rationale: διά＋属格の媒介の意味を自然な現代日本語で表した。Χριστόςは日本語で定着した称号表現「キリスト」とした。
- source_word: ᾧ ἡ δόξα
  choice: 栄光が……ありますように
  rationale: 関係代名詞ᾧの帰属先には神とイエス・キリストの間に統語上の曖昧さがある。日本語では代名詞を明示せず、栄光を帰する祈願として表現することで、その曖昧さを不当に解消しないようにした。
- source_word: εἰς τοὺς αἰῶνας
  choice: 永遠に
  rationale: 直訳は「代々に至るまで」だが、永続性を表す慣用句として明瞭で格調ある「永遠に」を選んだ。
- source_word: Ἀμήν
  choice: アーメン
  rationale: 礼拝・聖書用語として広く定着した音写を用いた。
theological_decisions:
- issue: ᾧの先行詞
  choice: 日本語訳で「その方に」などを補わず、先行詞を明示しない
  alternative: 「その神に」または「その方に」として神を明示する／「キリストに」としてイエスを明示する
  rationale: ギリシャ語では直近のἸησοῦ Χριστοῦを受け得る一方、頌栄全体の統語と意味からθεῷを受けるとも理解できる。訳文で一方に限定せず、原文の緊張を保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、頌栄にふさわしい荘重さを保った。「栄光がありますように」は省略された願望表現を自然に補う。脚注記号[a]は本文中に配置した。
