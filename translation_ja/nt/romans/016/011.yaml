  rationale: 本文の意味は変更せず、脚注アンカーを説明対象の語句へ移した。「よろしく伝えてください」により、原文の反復された挨拶の命令を自然で明瞭な現代日本語にした。脚注bは、原文に「家」が明記されないことを本文で補わず、推定的背景だけを簡潔に示す形に整えた。
