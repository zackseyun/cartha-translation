id: ROM.16.11
reference: Romans 16:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: ja
  text: 私の同族[a]であるヘロディオンに、よろしく伝えてください。ナルキソに属する人々[b]のうち、主にある人々にもよろしく伝えてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同族」は、血縁のある親族を指す場合も、パウロと同じ民族に属するユダヤ人を指す場合もある。
    reason: lexical_alternative
  - marker: b
    text: おそらく、ナルキソの家の者、またはその家産に属する人々を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく
  rationale: 手紙の結びにおける複数命令形であり、日本語の書簡で自然な挨拶の伝達表現。「挨拶しなさい」よりも現在の日本語として自然である。
- source_word: Ἡρῳδίωνα
  choice: ヘロディオン
  rationale: 人名を一般的な日本語の音写で示した。
- source_word: συγγενῆ μου
  choice: 私の同族
  rationale: 血縁者にも、同じ民族に属する同胞にもなり得る語であるため、どちらかに限定しない「同族」を採用した。意味の幅は脚注で明示する。
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: ナルキソに属する人々
  rationale: ナルキソと結びついた人々を指すが、原文には「家」「家族」「家の者」に当たる名詞が明記されていないため、関係性を限定しすぎない表現とした。
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: 主にある人々
  rationale: ナルキソに属する人々のうちの一部を指す限定句。パウロ特有の「主にある」という表現とその神学的含意を保った。
- source_word: κυρίῳ
  choice: 主
  rationale: この箇所のκύριοςは、パウロ書簡におけるキリスト教的表現「主にあって」の一部であり、「主」とするのが適切である。
theological_decisions:
- issue: συγγενήςが示す関係
  choice: 「私の同族」とし、血縁者か同じユダヤ人かを本文では限定しない。
  alternative: 「私の親族」または「私と同じユダヤ人」
  rationale: この語は血縁関係と民族的な同胞関係のどちらも表し得る。文脈だけでは一方に確定できないため、曖昧さを保った。
- issue: ナルキソと人々との関係
  choice: 「ナルキソに属する人々」とし、「家の者たち」を本文に補わない。
  alternative: 「ナルキソの家の者たち」または「ナルキソの家に属する人々」
  rationale: 家の者や家産に属する者を指す可能性が高いが、原文には「家」に当たる語がない。推定される背景は脚注に置き、本文では原文が示す範囲にとどめた。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、書簡の挨拶としての簡潔さと品位を保った。「主にある」はパウロ特有の表現として訳し替えずに残した。
