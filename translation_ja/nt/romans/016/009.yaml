base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: ja
  text: キリストにあって私たちと共に働くウルバノと、私の愛するスタキスに、よろしく伝えてください。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 複数への命令で、挨拶を託す文脈に合う、自然で丁寧な現代日本語。
- source_word: Οὐρβανὸν
  choice: ウルバノ
  rationale: ギリシャ語形に基づき、日本語の聖書で通用する形に音写した。
- source_word: συνεργὸν ἡμῶν
  choice: 私たちと共に働く
  rationale: 共同で働く関係を明確にしつつ、修飾句として自然な日本語にした。「私たちの同労者」も可能。
- source_word: ἐν Χριστῷ
  choice: キリストにあって
  rationale: キリストとの結びつき、またその領域における働きという表現の幅を保つ、定着した日本語表現。
- source_word: Στάχυν
  choice: スタキス
  rationale: ギリシャ語名を日本語で通用する形に音写した。
- source_word: τὸν ἀγαπητόν μου
  choice: 私の愛する
  rationale: パウロの個人的な愛情を自然に表し、「愛する者」という名詞的表現より人名に滑らかにつながる。
theological_decisions:
- issue: ἐν ΧριστῷにおけるΧριστόςの訳し方
  choice: キリストにあって
  alternative: メシアにあって
  rationale: Χριστόςの称号性を失わない定着語「キリスト」を用い、ἐνの結合・領域の含意を「あって」で保った。「メシアにあって」は意味上可能だが、この定型句では日本語として不自然になりやすい。
translation_notes:
  register: 明瞭で品位ある現代標準語。挨拶一覧としての簡潔さを保ちつつ、命令形は「よろしく伝えてください」と自然な丁寧体にした。
