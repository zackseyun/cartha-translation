  verdict: approve
  source_fidelity: 本文はSBLGNTの命令形ἀσπάσασθεを、受け手が複数であることを保って「よろしく伝えてください」と適切に訳している。Μαριάμは標準的な「マリア」、ἥτις以下の説明節も自然に反映されている。「大いに労苦した」はπολλὰ ἐκοπίασενの多大で骨の折れる働きをよく伝え、εἰς ὑμᾶςは「あなたがたのために」として採用本文に忠実である。
  naturalness: 明瞭な現代標準日本語であり、書簡中の共同体に向けた呼びかけとしても自然である。「大いに労苦した」はやや格調のある表現だが、不自然ではなく、原語の労苦・尽力の強さにふさわしい。
  terminology: 「マリア」は定着した聖書人名表記である。「労苦した」はκοπιάωの単なる作業以上の骨折りを適切に表す。神学的に偏った語の選択はない。
