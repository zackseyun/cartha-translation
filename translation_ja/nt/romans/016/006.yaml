  text: ἀσπάσασθε ⸀Μαριάμ, ἥτις πολλὰ ἐκοπίασεν εἰς ⸀ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/006.yaml
  text: Greet Mary[a], who has worked very hard for you.
translation:
  language: ja
  text: あなたがたのために大いに労苦したマリアに、よろしく伝えてください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「私たちのために」または「あなたがたの間で」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 書簡中で人に挨拶を伝えるよう求める二人称複数の命令。現代日本語として自然で丁寧な表現とした。
- source_word: Μαριάμ
  choice: マリア
  rationale: 聖書の日本語表記として広く定着している形を用いた。
- source_word: ἥτις
  choice: （関係節として）…した
  rationale: マリアについて説明を加える関係代名詞。日本語では連体修飾節にして自然に表した。
- source_word: πολλὰ
  choice: 大いに
  rationale: ἐκοπίασενを副詞的に強め、労苦の程度が大きかったことを簡潔かつ品位ある日本語で示す。
- source_word: ἐκοπίασεν
  choice: 労苦した
  rationale: κοπιάωが含む骨折って働く、苦労して尽力するという強い意味を保った。ギリシア語のアオリストに即して過去形とした。
- source_word: εἰς ὑμᾶς
  choice: あなたがたのために
  rationale: 採用本文のεἰς ὑμᾶςを、対象者への益・尽力の方向を示す表現として自然に訳した。
theological_decisions:
- issue: 末尾句の本文異読
  choice: あなたがたのために
  alternative: 私たちのために／あなたがたの間で
  rationale: SBLGNTのεἰς ὑμᾶςに従った。意味のある異読であるεἰς ἡμᾶςおよびἐν ὑμῖνは、本文で混同せず脚注に保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、「大いに労苦した」によって原文の強い労働・尽力のニュアンスを保った。命令表現は共同体への書簡にふさわしい丁寧さを持たせた。
