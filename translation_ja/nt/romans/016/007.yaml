  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: ja
  text: 私の同族であり、共に囚われの身となったアンドロニコとユニア[a]に、よろしく伝えてください。二人は使徒たちの間で名高く[b]、私より先にメシアにある者となった人たちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユニア」は女性名と理解される。男性名「ユニアス」とする見方もあるが、ギリシア語の語形と歴史的用例からは女性名である可能性が高い。
    reason: alternative_reading
  - marker: b
    text: 「使徒たちの中で際立っている」とも訳せる。また、「使徒たちによく知られている」という理解もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 手紙における挨拶の命令。現代日本語の書簡表現として自然で、直接的な命令の力も保つ。
- source_word: Ἀνδρόνικον
  choice: アンドロニコ
  rationale: ギリシア語名を日本語の慣用に沿って音写した。
- source_word: Ἰουνίαν
  choice: ユニア
  rationale: この対格形は、歴史的用例から女性名ユニアと取るのが最も自然。男性名とする見方は脚注に示す。
- source_word: συγγενεῖς μου
  choice: 私の同族
  rationale: 血縁者にも民族的な同胞にもなり得る語であるため、どちらかに限定しすぎない「同族」とした。
- source_word: συναιχμαλώτους μου
  choice: 共に囚われの身となった
  rationale: 同じく捕らわれた者を表す複合語。実際の投獄・捕囚の具体性を保ちつつ自然な日本語にした。
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: 使徒たちの間で名高く
  rationale: ἐπίσημοιの「著名な、際立った」と、ἐνの基本的な「〜の間で」を反映する。ただし、使徒に含まれるのか、使徒たちによく知られていたのかは議論があるため脚注で明示する。
- source_word: πρὸ ἐμοῦ
  choice: 私より先に
  rationale: パウロとの時間的な前後関係を明瞭に表す。
- source_word: γέγοναν ἐν Χριστῷ
  choice: メシアにある者となっていました
  rationale: 完了形が示す、以前その状態に入り現在まで続く含みと、「メシアにある」というパウロ固有の表現を保つ。単に「信者になった」と解釈的に言い換えない。
theological_decisions:
- issue: Ἰουνίανの性別と名称
  choice: 女性名「ユニア」
  alternative: 男性名「ユニアス」
  rationale: 語形と古代の人名用例は女性名を強く支持する。ただし、歴史的に男性名とする解釈も存在するため脚注に残す。
- issue: ἐπίσημοι ἐν τοῖς ἀποστόλοιςの範囲
  choice: 「使徒たちの間で名高い」
  alternative: 「使徒たちによく知られている」
  rationale: ギリシア語は、二人が使徒の一員として際立っていたとも、使徒たちから高く評価されていたとも理解されてきた。本文では構文に近い訳を採り、真正な曖昧さを脚注で保持する。
- issue: ἐν Χριστῷの表現
  choice: 「メシアにある」
  alternative: 「メシアを信じる者である」
  rationale: 結合・帰属を表すパウロの神学的な定型句を、回心だけに限定せず保持する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。人名は一般読者が読みやすい形で音写し、「メシアにある」という原文の神学的表現と、使徒をめぐる構文上の曖昧さを保持した。
