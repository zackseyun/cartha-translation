  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: ja
  text: 聖なる者たちにふさわしい仕方で、主にあって彼女を迎え入れ、また、彼女があなたがたの助けを必要とするどのような事柄についても助けてください。彼女自身、多くの人の後援者[a]となり、私自身の後援者にもなったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「支援者」「援助者」。このギリシア語は、他の人々を支えた女性、特に資力や社会的な影響力を用いて支援した女性を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: 迎え入れ
  rationale: 単なる受け入れではなく、共同体が好意と歓待をもって迎える意味を自然な日本語で表す。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: キリストとの結びつきと信仰共同体における交わりの領域を示すパウロ特有の表現を保持する。
- source_word: ἀξίως τῶν ἁγίων
  choice: 聖なる者たちにふさわしく
  rationale: ἀξίωςの様態と、ἅγιοιが神に属する信徒たちを指すことの双方を保つ。
- source_word: παραστῆτε αὐτῇ
  choice: 彼女を助けてください
  rationale: この文脈では、彼女の傍らに立って必要な援助を与える意味。日本語の「助ける」が簡潔で自然である。
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: 彼女があなたがたを必要とするどんな事柄でも
  rationale: πρᾶγμαの広い意味を「事柄」で保ち、χρῄζῃ＋属格が彼らの助力を必要とすることを表す構文を明示する。
- source_word: προστάτις
  choice: 支援者
  rationale: 他者のために立ち、社会的・物質的な後援を行う女性を指し得る語。「支援者」は単なる手伝いより強く、制度化された役職とも断定しない。
- source_word: ἐμοῦ αὐτοῦ
  choice: 私自身をも
  rationale: αὐτοῦによる強調とκαίの付加的意味を自然な日本語で保持する。
theological_decisions:
- issue: フィベに用いられた προστάτις の訳
  choice: 支援者
  alternative: 後援者、援助者、保護者
  rationale: この語は一般的な手助け以上に、社会的地位や資力を用いて他者を支える役割を示し得る。「支援者」はフィベの能動的で重要な働きを保ちつつ、後代の教会職制や特定の制度的地位を読み込まない。脚注で「後援者」の可能性を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「主にあって」「聖なる者たち」などパウロ書簡の神学的表現を保持した。「支援者」は本文として理解しやすくし、古代社会における後援の含意は脚注で補った。
