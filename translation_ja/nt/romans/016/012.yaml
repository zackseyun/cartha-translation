id: ROM.16.12
reference: Romans 16:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: ja
  text: 主にあって労苦してきたトリファイナとトリフォサ[a]に挨拶を伝えてください。大いに主にあって労苦してきた、愛するペルシス[b]に挨拶を伝えてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主にあって懸命に働いてきた」とも訳せる。
    reason: κοπιάωは骨を折って熱心に働くことを表す。
  - marker: b
    text: 直訳は「その愛されている者」または「愛する者」。原文には「私の」に当たる語はない。
    reason: τὴν ἀγαπητήνは定冠詞付きの形容詞を名詞的に用いた表現であり、所有代名詞を含まない。
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 書簡末尾の挨拶の命令として、現代日本語で自然かつ丁寧に表した。「迎え入れてください」では文脈上強すぎる。
- source_word: Τρύφαιναν / Τρυφῶσαν / Περσίδα
  choice: トリファイナ／トリフォサ／ペルシス
  rationale: 人名として、原語の発音に沿う一般的な日本語表記に音写した。
- source_word: τὰς κοπιώσας / ἐκοπίασεν
  choice: 労苦した／労苦した
  rationale: κοπιάωの反復を同じ語で保ち、骨の折れる熱心な働きを表した。両方ともアオリスト形なので、本文では過去形を用いた。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 働きが主との結びつきの中でなされたというパウロ特有の広い含意を保ち、単に「主のために」と目的だけに限定しなかった。
- source_word: τὴν ἀγαπητήν
  choice: 愛されている
  rationale: 定冠詞付き形容詞の受動的な意味を保ち、原文にない「私の」を補わなかった。
- source_word: πολλὰ
  choice: 大いに
  rationale: 動詞を修飾する副詞的対格であり、ペルシスの労苦の大きさを自然な日本語で強調した。
theological_decisions:
- issue: ἐν κυρίῳが示す働きと主との関係
  choice: 主にあって
  alternative: 主のために／主に仕えて
  rationale: この句を単なる目的または奉仕の対象に狭めず、主との関係および主に属する領域の中での働きという神学的な幅を残した。
- issue: ἀγαπητήνに所有の意味を加えるか
  choice: 愛されている
  alternative: 私の愛する／親愛なる
  rationale: 原文には「私の」に当たるμουがないため、所有者を明示せず、原文の曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、書簡の挨拶にふさわしい丁寧さと簡潔さを保った。「主にあって」はパウロ的表現の神学的な厚みを残すため維持した。
