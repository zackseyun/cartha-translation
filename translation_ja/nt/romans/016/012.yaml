revisions:
- from: 主にあって労苦したトリファイナとトリフォサ[a]に、よろしく伝えてください。主にあって大いに労苦した、愛されているペルシス[b]に、よろしく伝えてください。
  to: 主にあって労苦してきたトリファイナとトリフォサ[a]に挨拶を伝えてください。大いに主にあって労苦してきた、愛するペルシス[b]に挨拶を伝えてください。
  rationale: 「愛されている」を、自然な呼称である「愛する」に改め、注で原文の形と所有代名詞がないことを明示した。これにより、本文に「私の」を追加せず、誰から愛されているかを特定しない原文の余地を保つ。「挨拶を伝えてください」として書簡的命令の意味を明瞭にし、κοπιάωの反復は「労苦してきた」で統一した。
