    rationale: ἀγαπητήνは定冠詞付きの形容詞を名詞的に用いた表現であり、所有代名詞はない。「愛するペルシス」とすれば自然な日本語で、本文に「私の」を補わず、愛情を示す呼称としての機能を保てる。
