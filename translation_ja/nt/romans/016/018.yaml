id: ROM.16.18
reference: Romans 16:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: ja
  text: このような者たちは、私たちの主であるメシア[a]に仕えるのではなく、自分の腹[b]に仕え、耳ざわりのよいことばとへつらいによって、疑うことを知らない人々[c]の心を欺いているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの主であるキリスト」。
    reason: Χριστόςの伝統的な音訳を示すため。
  - marker: b
    text: 直訳「自分の腹」。自分の欲望や自己満足のために生きることを表す鮮明な比喩。
    reason: 本文の具体的な比喩が持つ含意を明らかにするため。
  - marker: c
    text: 別訳「無邪気な人々」または「悪意のない人々」。
    reason: ἀκάκωνには、疑うことを知らない、無垢な、悪意がない、という意味の幅があるため。
lexical_decisions:
- source_word: οἱ γὰρ τοιοῦτοι
  choice: このような者たちは……のです
  rationale: τοιοῦτοιは前節で述べられた分裂を引き起こす者たちを指す。「このような者たち」で指示の力を保ち、γάρの説明的なつながりは文末の「のです」で自然に表した。
- source_word: τῷ κυρίῳ ἡμῶν Χριστῷ
  choice: 私たちの主であるメシア
  rationale: κύριοςを「主」、Χριστόςを称号として「メシア」と訳した。ギリシア語本文にない「イエス」は補わない。
- source_word: δουλεύουσιν
  choice: 仕える
  rationale: 奴隷として仕える、従属して奉仕するという意味を持つ。ここでは主に仕えることと自分の腹に仕えることの対比を、自然な日本語の「仕える」で保持した。
- source_word: κοιλίᾳ
  choice: 腹
  rationale: 自己充足的な欲望を表すパウロの具体的で鮮明な比喩を、解釈的な「欲望」に置き換えず保持した。
- source_word: χρηστολογίας
  choice: 耳ざわりのよいことば
  rationale: 人を引きつける快い、もっともらしい話しぶりを指す。欺きの文脈が伝わる現代日本語とした。
- source_word: εὐλογίας
  choice: へつらい
  rationale: ここでは真の祝福ではなく、相手に取り入るようなほめことばを指すため、操作的な含意を伝える「へつらい」とした。
- source_word: ἐξαπατῶσι
  choice: 欺いている
  rationale: 強い欺きを表す複合動詞。日本語では不自然に強調語を足さず、「欺く」で十分に意味を伝えた。
- source_word: τὰς καρδίας
  choice: 心
  rationale: 知性だけでなく内なる人全体を指し得る聖書的な表現を「心」で保持した。
- source_word: τῶν ἀκάκων
  choice: 疑うことを知らない人々
  rationale: 悪意がない、無邪気な、警戒していないという語義のうち、この欺きへの警告の文脈では無防備さを示す表現が適切である。
theological_decisions:
- issue: パウロの称号句における Χριστός の訳
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςを単なる固有名の一部としてではなく称号として訳した。伝統的な音訳「キリスト」は脚注に残し、読者が対応関係を確認できるようにした。
- issue: 「腹」の比喩の解釈
  choice: 具体的な比喩を本文に保持
  alternative: 自分の欲望／食欲
  rationale: 本文は対象をκοιλία（腹）と明示し、主への奉仕との衝撃的な対比を作る。欲望一般あるいは食欲だけに限定せず、含意を脚注で示した。
- issue: ἀκάκων が表す人々の性質
  choice: 疑うことを知らない人々
  alternative: 無邪気な人々／悪意のない人々
  rationale: 語は無垢さと無防備さの両方を含み得る。欺かれる文脈に即して後者を本文に置きつつ、別の語義を脚注に示して曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体とした。「耳ざわりのよいことば」は日常的すぎる俗語を避けつつ欺瞞的な快さを表し、「へつらい」と並べて原文の二語を区別した。説明を導くγάρは、孤立した節でも過度に硬い「なぜなら」を用いず、文末の「のです」で前節への説明的関係を示した。
