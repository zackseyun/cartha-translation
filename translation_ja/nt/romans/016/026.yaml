  text: φανερωθέντος δὲ νῦν, διά τε γραφῶν προφητικῶν, κατ' ἐπιταγὴν τοῦ αἰωνίου θεοῦ, εἰς ὑπακοὴν πίστεως εἰς πάντα τὰ ἔθνη γνωρισθέντος,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/026.yaml
  text: but[a] has now been revealed, and through the prophetic Scriptures made known to all nations, according to the command of the eternal God, to bring about the obedience of faith,
translation:
  language: ja
  text: しかし今や明らかにされ、預言的な諸文書を通して、永遠の神の命令に従い、信仰の従順に至らせるために、すべての国の人々に知らされました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、ローマ16章25～27節の結びの頌栄の続きです。その位置と写本上の証拠については、16章25節の注を参照してください。
    reason: textual_critical
lexical_decisions:
- source_word: φανερωθέντος
  choice: 明らかにされ
  rationale: 25節の「奥義」を受ける受動分詞であり、以前は隠されていたものが現されたことを自然な日本語で表す。
- source_word: γραφαῖς προφητικαῖς
  choice: 預言者たちの書
  rationale: 聖なる預言的文書を指す。日本語として明瞭で、旧約の預言的諸文書という意味を伝える。
- source_word: ἐπιταγήν
  choice: 命令
  rationale: 神の権威ある指示を率直に表す。
- source_word: ὑπακοὴν πίστεως
  choice: 信仰の従順
  rationale: 属格の意味を一義的に解消せず、1章5節との語句上の対応も保つ。
- source_word: πάντα τὰ ἔθνη
  choice: すべての国々
  rationale: ユダヤ人以外だけに限定せず、福音が知らされる普遍的な範囲を保つ。
- source_word: γνωρισθέντος
  choice: 知らされた
  rationale: φανερωθέντοςとの違いを保ち、奥義が諸国民に告知されたことを表す。
theological_decisions:
- issue: ὑπακοὴ πίστεως の属格関係
  choice: 信仰の従順
  alternative: 信仰による従順／信仰に従うこと
  rationale: 信仰が生む従順、信仰そのものとしての従順、信仰への従順という可能性を訳文で狭めず、原文の神学的緊張を保つ。
- issue: 二つの受動分詞の主語
  choice: 「ものです」によって25節の「奥義」への連結を示す
  alternative: 「その奥義は」を補う
  rationale: 本節が前節から続く長い頌栄文の一部であることを保ちつつ、日本語で文法的に理解できる形にする。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の長い統語構造と25節への従属関係を保ちつつ、「ものです」で日本語として読める形に整えた。脚注記号は節末に置いた。
