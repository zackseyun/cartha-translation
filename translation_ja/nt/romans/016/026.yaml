revisions:
- from: しかし今や明らかにされ、預言者たちの書を通して、永遠の神の命令に従い、信仰の従順へと導くため、すべての国々に知らされたものです。[a]
  to: しかし今や明らかにされ、預言的な諸文書を通して、永遠の神の命令に従い、信仰の従順に至らせるために、すべての国の人々に知らされました。[a]
  rationale: 「預言者たちの書」を、原文の形容詞的修飾と聖書文書の複数性を保つ「預言的な諸文書」に改めました。また、奥義が諸国民へ告知されたというγνωρισθέντοςの受動的意味を自然に表すよう文末を整えました。「信仰の従順」は、属格の解釈を一つに固定せずに保持しています。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:29Z'
review_pass:
  verdict: revise
  source_fidelity: 受動分詞二つが25節の「奥義」を受け、今や啓示され、預言的な諸文書を通して諸国民に知らせられたという原文の構造は保たれています。ただし、γραφαῖς προφητικαῖςを「預言者たちの書」とする表現は、預言者個人が書いた書物に限定するように響き得ます。原文は「預言的な諸文書／聖書」を指します。
  naturalness: 原案の「知らされたものです」は、前節からの継続を示そうとする意図は理解できますが、日本語としては修飾関係がやや重く不自然です。受け手である諸国民を明示し、完了した受動表現で結ぶと明瞭になります。
  terminology: 「永遠の神」「命令」「信仰の従順」は適切です。「信仰の従順」はやや定型的ですが、πίστεωςの属格の幅とローマ1章5節との対応を保てます。「すべての国々」は許容されますが、ἔθνηの人々を指す用法を日本語で自然に示すため「すべての国の人々」とします。
  issues:
