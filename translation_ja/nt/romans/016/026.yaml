    rationale: γραφαῖς προφητικαῖςは「預言的な諸文書」を意味し、特定の預言者たちが著した書物という含みを持つ「預言者たちの書」は原文の修飾関係を正確に反映しません。
  - severity: low
    issue: 「すべての国々に知らされたものです」
    rationale: γνωρισθέντοςは奥義を主語とする受動分詞であり、「国々」はその受け手です。「すべての国の人々に知らされました」とすると関係が明瞭で、現代日本語としても自然です。
