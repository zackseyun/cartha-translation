base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: ja
  text: 私たちの主イエス・キリストの恵みが、あなたがたすべてと共にありますように。[a] アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節を含む写本もあれば、欠く写本もある。多くの現代の校訂版は、ローマ書末尾における本文異読として括弧に入れるか、本文から外している。
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: パウロ書簡の祝祷で用いられる、神から無償で与えられる好意と賜物を表す標準的な訳語。
- source_word: κυρίου
  choice: 主
  rationale: イエスの主権を示すキリスト論的称号として、自然で定着した訳語。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: 日本語では「キリスト」が称号として広く定着しており、自然さと神学的意味を保てる。必要なら「メシア」と訳し得るが、本文では慣用形を採用した。
- source_word: μετὰ πάντων ὑμῶν
  choice: あなたがたすべてと共に
  rationale: μετά＋属格の「共に」と、πάντων ὑμῶνが示す受取人全員への包括性を保持した。
- source_word: Ἀμήν
  choice: アーメン
  rationale: 礼拝的な同意・確証を表す語として日本語で定着した音写。
theological_decisions:
- issue: Ἰησοῦ ΧριστοῦにおけるΧριστόςの訳し方
  choice: イエス・キリスト
  alternative: メシアであるイエス／イエス・メシア
  rationale: Χριστόςの称号性は認めつつ、日本語では「イエス・キリスト」が称号を含む定着表現であり、一般読者に明瞭で荘重でもあるため。
- issue: 祝祷表現における動詞の補充
  choice: ありますように
  alternative: あるように／共にある
  rationale: ギリシア語本文には明示的な動詞がないが、祝祷としての願望を自然な日本語で示し、断定へ狭めないため。
- issue: 節全体の本文上の位置づけ
  choice: 本文に収め、異読注を付す
  alternative: 本文から外す／角括弧に入れる
  rationale: SBLGNT提示本文に含まれる語句を訳出しつつ、写本による有無という重要な本文批評上の問題を注で明示するため。
translation_notes:
  register: 現代標準日本語による簡潔で荘重な祝祷。「あなたがたすべて」で会衆全体への包括性を明示し、「共にありますように」で祈願の調子を自然に表した。
