id: ROM.16.17
reference: Romans 16:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: ja
  text: 兄弟たち[a]、私はあなたがたに勧めます。あなたがたが学んだ教えに反して分裂を引き起こし、人をつまずかせる人々を警戒し、その人々から離れなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「兄弟姉妹たち」。ギリシア語は「兄弟たち」だが、ここでは会衆全体に呼びかけていると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: 私はあなたがたに勧めます
  rationale: 強い牧会的な訴えを、現代日本語として自然かつ厳粛に表す。「お願いします」より勧告の力を保ち、「勧告します」ほど事務的にしない。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数呼格を本文に保つ。パウロの用法では会衆全体を指す可能性が高いため、その点は脚注で示す。
- source_word: σκοπεῖν
  choice: 警戒し
  rationale: 注意深く見定めることと用心することの両方を、この文脈で簡潔に伝える。
- source_word: διχοστασίας
  choice: 分裂
  rationale: 共同体内に亀裂を生じさせる行為を明瞭に表す。
- source_word: σκάνδαλα
  choice: つまずき
  rationale: 人を信仰上つまずかせる障害という比喩を保つ。
- source_word: παρὰ τὴν διδαχὴν
  choice: 教えに反して
  rationale: παρά＋対格が示す、受けた教えという基準からの逸脱・対立を自然な日本語で表す。
- source_word: ἣν ὑμεῖς ἐμάθετε
  choice: あなたがたが学んだ
  rationale: 明示された主語を反映し、すでに受けて身につけた教えを指す簡潔な表現とする。
- source_word: ποιοῦντας
  choice: 引き起こす
  rationale: 分裂とつまずきを生じさせる人々という分詞の働きを自然な連体節で示す。
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: その人々から離れなさい
  rationale: 命令の力と、彼らから身をそらして距離を置く方向的なイメージを保つ。
theological_decisions:
- issue: ἀδελφοίがローマの会衆全体を代表して呼びかける可能性
  choice: 本文では「兄弟たち」とし、男女を含む会衆全体への呼びかけである可能性を脚注に示す。
  alternative: 本文で「兄弟姉妹たち」と訳す。
  rationale: 原語の形を本文で明示しつつ、パウロ書簡における包括的な用法を読者に知らせ、性別範囲を一方的に狭めないため。
- issue: σκάνδαλαの意味領域
  choice: 「つまずき」として信仰上・倫理上の障害という比喩を保つ。
  alternative: 「妨げ」または「誘惑」と訳して意味を限定する。
  rationale: 本文だけでは障害の具体的な性質が限定されていないため、原語の比喩と意味の幅を保持する。
translation_notes:
  register: 明瞭な現代標準語を用い、牧会的な勧告と命令の強さを保った。「警戒し、その人々から離れなさい」として、二つの要請の流れを自然に示した。
