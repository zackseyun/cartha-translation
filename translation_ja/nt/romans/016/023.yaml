id: ROM.16.23
reference: Romans 16:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: ja
  text: 私を迎え入れてくださり、また教会全体をもてなしてくださっているガイオが、あなたがたにあいさつを送っています。市の会計をつかさどるエラスト[a]と兄弟クアルトも、あなたがたにあいさつを送っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「市の管理官」とも訳せる。ギリシア語は市政を担う役人を広く指し得るが、ここでは市の財務担当者を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: よろしくと申しています
  rationale: パウロ書簡末尾の挨拶として自然な現代日本語であり、直接挨拶を送る意味を保つ。
- source_word: ξένος
  choice: もてなしてくれている
  rationale: ここでは「よそ者」ではなく、人を迎えて宿泊や世話をする者を指す。日本語では「主人」よりも行為として表すほうが、ガイオがパウロと教会全体を迎えている意味を自然に伝えられる。
- source_word: ὅλης τῆς ἐκκλησίας
  choice: 教会全体
  rationale: ἐκκλησίαをパウロ書簡におけるキリスト者共同体として「教会」とし、ὅληςの範囲を「全体」で明示した。
- source_word: οἰκονόμος τῆς πόλεως
  choice: 市の会計をつかさどる
  rationale: 市政上の管理職を表す語で、財務担当者であった可能性が高い。「会計係」より公職としての重みを示しつつ、職務範囲の不確かさは脚注で保持する。
- source_word: ὁ ἀδελφός
  choice: 兄弟
  rationale: 男性単数の信徒を指す比喩的な家族語を保った。ギリシア語にない所有表現「私たちの」は補わない。
theological_decisions:
- issue: ἐκκλησίαの訳語
  choice: 教会
  alternative: 集会／会衆
  rationale: ここでは単なる集合ではなく、キリスト者共同体を指すパウロの通例に沿う。「教会」は特定の教会制度を追加せず、現代日本語で最も自然である。
- issue: ὁ ἀδελφόςの家族的呼称
  choice: 兄弟
  alternative: 信徒仲間／私たちの兄弟
  rationale: 原文の男性単数と初期キリスト者共同体の家族的呼称を保持する。「私たちの」は原文に明示されず、「信徒仲間」は比喩を解消するため採らない。
- issue: ガイオの歓待の範囲
  choice: 私と教会全体をもてなしてくれている
  alternative: 私の主人であり、教会全体の主人でもある
  rationale: ξένοςの意味を日本語で誤解なく表し、ガイオがパウロだけでなく共同体にも歓待を示したという文の緊張を保つ。具体的に全員を宿泊させたとまでは限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。書簡末尾の挨拶として「よろしくと申しています」を用い、過度に口語的にも古風にもならないようにした。脚注記号は、説明対象であるエラストの職名を含む文の末尾に置いた。
