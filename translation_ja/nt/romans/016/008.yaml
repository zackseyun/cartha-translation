base_translation:
  language: en
  yaml_path: translation/nt/romans/016/008.yaml
  text: Greet Ampliatus[a], my beloved in the Lord.
translation:
  language: ja
  text: 主にあって、私の愛するアンプリアト[a]によろしく伝えてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アンプリアス」という読みを支持する写本もありますが、SBLGNTの本文は「アンプリアト」に対応するἈμπλιᾶτονです。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: よろしく伝えてください
  rationale: 書簡において挨拶を取り次ぐよう求めるアオリスト中動態命令法・二人称複数。現代日本語の自然な書簡表現とした。
- source_word: Ἀμπλιᾶτον
  choice: アンプリアト
  rationale: SBLGNTのἈμπλιᾶτονを、格語尾を除いた人名形Ampliatusに対応する形で音写した。
- source_word: τὸν ἀγαπητόν μου
  choice: 私の愛する
  rationale: パウロの親愛を簡潔に表し、「私の」という関係も保持する。日本語では名詞的な「私の愛する者」より、人名を直接修飾する形が自然である。
- source_word: ἐν κυρίῳ
  choice: 主にあって
  rationale: 主との関係・キリスト者としての交わりの領域を示すパウロ特有の表現を、伝統性と明瞭さを備えた日本語で保持した。「イエス」は原文にないため補わない。
theological_decisions:
- issue: パウロの愛情とἐν κυρίῳの係り方
  choice: 「主にあって」を「私の愛するアンプリアト」に結び付け、主にある交わりの中での愛情として訳す。
  alternative: 単に個人的な親愛を表す、または「主にあって」が挨拶の行為を修飾すると解する。
  rationale: 語順と統語上、τὸν ἀγαπητόν μου ἐν κυρίῳはアンプリアトを一まとまりで説明するのが最も自然である。神学的含意を弱めず、同時に過度な説明を本文へ加えない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、書簡としての品位を保った。「主にあって」はパウロ書簡の表現として定着した言い回しを採用した。
