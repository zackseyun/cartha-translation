id: ROM.6.17
reference: Romans 6:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: ja
  text: しかし、神に感謝します。あなたがたは罪の奴隷でしたが、心から、あなたがたが引き渡された教えの型[a]に従ったからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「教えの形」「教えの規範」。
    reason: lexical_alternative
  - marker: b
    text: より字義的には「その中へと引き渡された」。
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: しかし、神に感謝します
  rationale: 「神に感謝」という慣用的な感謝表現として訳し、δὲによる前後の対照を「しかし」で示した。
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: 罪の奴隷
  rationale: ローマ6章で中心となる支配・隷属の比喩を弱めず、罪に所有されていた状態を明確にした。
- source_word: ὑπηκούσατε
  choice: 従った
  rationale: 単に聞いたのではなく、服従したという動詞の倫理的な力を保った。
- source_word: ἐκ καρδίας
  choice: 心から
  rationale: καρδίαの比喩を自然な現代日本語で保ち、内面的で真実な服従を表した。
- source_word: τύπον διδαχῆς
  choice: 教えの型
  rationale: τύποςの「型・鋳型・規範」という像を残しつつ、διδαχήを明瞭に「教え」とした。
- source_word: παρεδόθητε
  choice: あなたがたが引き渡された
  rationale: 受動態を維持し、教えが彼らに渡されたのではなく、彼ら自身が教えの型へ移されたという印象的な構図を保った。
- source_word: εἰς ὃν
  choice: その…型に
  rationale: 方向を示すεἰςを日本語として自然な助詞「に」で表し、より字義的な「中へ」の可能性は脚注に残した。
theological_decisions:
- issue: δοῦλοιを「僕・仕える者」と和らげるか、「奴隷」とするか
  choice: 罪の奴隷
  alternative: 罪に仕える者
  rationale: この章では罪と義の支配下にあることを奴隷制の比喩で対照しているため、隷属と所有の強さを保った。
- issue: παρεδόθητεの受動構文を保つか、教えが信徒に伝えられたという能動的な表現に組み替えるか
  choice: あなたがたが引き渡された、その教えの型
  alternative: あなたがたに伝えられた教えの型
  rationale: ギリシア語では信徒が教えの型へ引き渡された者として描かれているため、その神学的に印象的な受動構文を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの奴隷制の比喩と「教えの型へ引き渡される」という特異な受動表現を保った。「あなたがた」の反復は、引き渡されたのが教えではなく信徒自身であることを曖昧にしないために採用した。
