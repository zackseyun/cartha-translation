id: ROM.6.3
reference: Romans 6:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: ja
  text: それとも、メシアであるイエス[a]へと洗礼を受けた私たちは皆、その死へと洗礼を受けたということを、あなたがたは知らないのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト・イエス」。原文は「クリストン・イエースーン」。
    reason: Χριστόςの称号としての訳と、日本語で慣用的な音訳の両方を示すため。原文の対格形Χριστὸν Ἰησοῦνに対応する音写へ訂正した。
lexical_decisions:
- source_word: ἢ
  choice: それとも
  rationale: 直前の議論を受ける論証上の移行と、穏やかな問いかけの響きを保つ。
- source_word: ἀγνοεῖτε
  choice: 知らないのですか
  rationale: 修辞疑問として自然な現代日本語にし、読者が共有しているはずの知識に訴える語調を保つ。
- source_word: ὅσοι
  choice: 私たちは皆
  rationale: 一人称複数の動詞と結びつく包括的な範囲を、明瞭な日本語で表す。
- source_word: ἐβαπτίσθημεν
  choice: 洗礼を受けた
  rationale: アオリスト受動態を出来事として率直に表し、洗礼の作用について特定の教派的説明を加えない。
- source_word: εἰς
  choice: へと
  rationale: 二度とも同じ訳語を用い、方向性と取り込まれるイメージを保ちながら、その神学的仕組みを説明しすぎない。
- source_word: Χριστὸν Ἰησοῦν
  choice: メシアであるイエス
  rationale: Χριστόςの称号としての意味を明示しつつ、自然で理解しやすい日本語にする。慣用的な音訳は脚注に示す。
- source_word: θάνατον αὐτοῦ
  choice: その死
  rationale: イエスを指す属格代名詞と「死」を簡潔に表し、余分な解釈を加えない。
theological_decisions:
- issue: 洗礼を伴う二つのεἰςが、秘跡的効力、象徴的同一化、契約的結合のいずれを意味するか。
  choice: 二つとも「へと」と訳す。
  alternative: 「に関わる」「に結ばれる」「と一つになる」
  rationale: 原文の方向性および参与・編入の強い含みを残しつつ、洗礼の厳密な神学的作用を特定の立場に限定しない。
- issue: Χριστόςを称号として訳すか、慣用的な固有名風の音訳にするか。
  choice: 本文では「メシアであるイエス」とする。
  alternative: 「キリスト・イエス」
  rationale: この句に残る「油注がれた者」という称号性を普通の読者に伝え、慣用訳も脚注で保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。修辞疑問の形を保ち、「洗礼」の意味や効力について教派的な説明を本文に持ち込まない。「へと」を反復して原文の並行構造を可視化した。
