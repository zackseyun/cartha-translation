base_translation:
  language: en
  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: ja
  text: なぜなら、死んだ者は罪から解放されているからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「罪から義とされている」。δικαιόωには法廷的に正しいと認める意味があるが、ここでは文脈上、罪から解放されていることを表すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: 死んだ者
  rationale: 冠詞を伴うアオリスト分詞を名詞的に訳した。性別を限定せず、簡潔で自然な日本語として代表的な意味合いも保つ。
- source_word: γὰρ
  choice: からです
  rationale: 直前の文を理由づけ、説明する接続辞であるため、日本語では文末の「からです」で自然に表した。
- source_word: δεδικαίωται
  choice: 無罪とされている
  rationale: δικαιόω の法廷的な含意を保ちつつ、「罪から」と自然につながる表現を選んだ。完了形が示す、成立した状態の継続も「されている」で表した。
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: 罪から
  rationale: ἀπό が示す分離を簡潔に表し、罪責からの解放だけにも罪の支配からの解放だけにも限定しないようにした。
theological_decisions:
- issue: δικαιόω を法廷的な「義とされる／無罪とされる」と取るか、文脈的な「解放される」と取るか。
  choice: 本文では「罪から無罪とされている」とした。
  alternative: 「罪から義とされている」、または「罪から解放されている」。
  rationale: ローマ6章の文脈は罪の支配からの解放を強調する一方、パウロは解放を直接表す一般的な動詞ではなく δικαιόω を用いている。「無罪とされている」は法廷的な力を保ち、脚注で「義とされている」と「解放されている」の可能性を示すことで、法廷と解放の両面にまたがる緊張を解消せずに残す。
translation_notes:
  register: 明瞭で現代的な標準日本語。理由を示す γάρ は日本語として自然な文末表現にし、法廷的な語感と罪からの解放という文脈の双方を保った。
