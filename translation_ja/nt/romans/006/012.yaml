id: ROM.6.12
reference: Romans 6:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: ja
  text: ですから、あなたがたがその欲望に従うことのないように、罪をあなたがたの死ぬべき体に支配させてはなりません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その欲望」は、文法上は「死ぬべき体」の欲望を指します。文脈から「罪の欲望」と理解することもあります。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す。現代日本語として自然であり、論理的なつながりも明確に保つ。
- source_word: βασιλευέτω
  choice: 支配し……ことがないようにしなさい
  rationale: 王として君臨する比喩を「支配する」によって自然に伝え、否定の命令として継続的に許してはならないという力を表す。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 「罪」としつつ、「支配する」と結びつけることで、パウロが罪を人格化し、支配する力として描く表現を保持する。
- source_word: θνητῷ
  choice: 死ぬべき
  rationale: 死を免れない現在の体という意味を、一般読者に明瞭な日本語で表す。「死すべき」より現代的である。
- source_word: σώματι
  choice: 体
  rationale: 身体を指す語として簡潔かつ直接的に訳し、不要な説明を加えない。
- source_word: εἰς τὸ ὑπακούειν
  choice: 従わせる
  rationale: 罪が支配することの目的または結果を表す構文として訳す。日本語では使役形により、罪の支配と欲望への服従との関係を明確かつ自然に示せる。
- source_word: ἐπιθυμίαις
  choice: 欲望
  rationale: 性的意味だけに限定せず、文脈上の道徳的な重みを保つ広い語として選ぶ。
- source_word: αὐτοῦ
  choice: その
  rationale: 文法上もっとも自然な先行詞である中性単数の「体」を受ける。ただし日本語では指示対象が表面上曖昧になり得るため、脚注で明示する。
theological_decisions:
- issue: 罪が単なる行為ではなく支配する力として描かれているか
  choice: 罪を主語とし、「支配する」という人格化を保つ。
  alternative: 罪深い行為が生活を左右する、という抽象的な意味に言い換える。
  rationale: βασιλευέτω は王権的な比喩を持つため、罪を支配者のように描くパウロの神学的緊張を解消せずに残す。
- issue: αὐτοῦ（その）の先行詞
  choice: 「体の欲望」と理解する。
  alternative: 文脈上、「罪の欲望」と理解する。
  rationale: αὐτοῦ は男性・中性単数属格であり、中性単数の σώματι に文法的に適合する一方、女性名詞 ἁμαρτία とは一致しない。文脈的に罪と結びつける理解もあるため脚注に残す。
- issue: εἰς τὸ ὑπακούειν が目的か結果か
  choice: 罪の支配が欲望への服従をもたらす関係として、目的と結果の双方を狭く限定しない表現にする。
  alternative: 「従うために」と明確な目的だけを示す。
  rationale: この構文は目的または結果を表し得るため、「支配し、従わせることがないように」として因果的な関係を保ち、いずれか一方に決めすぎない。
translation_notes:
  register: 明瞭で現代的かつ dignified な標準日本語。「死すべき」ではなく「死ぬべき」を用いて一般読者への分かりやすさを優先した。主節を「ことがないようにしなさい」と構成し、否定命令を自然に表現するとともに、罪が支配するという比喩を保持した。
