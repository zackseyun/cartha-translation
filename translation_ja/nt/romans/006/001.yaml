id: ROM.6.1
reference: Romans 6:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: ja
  text: それでは、何と言うべきでしょうか。恵みが増し加わるために、私たちは罪の中にとどまり続けるべきでしょうか。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪にとどまり続けるべきでしょうか」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「恵みが満ちあふれるために」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: それでは
  rationale: 直前の議論を受ける推論的な移行を、自然な現代日本語で示す。
- source_word: ἐροῦμεν
  choice: 何と言うべきでしょうか
  rationale: 未来形による熟慮的・修辞的な問いを、日本語で自然に表す。「べき」は後続する提案を検討する文脈上の力を示すが、結論を先取りしない。
- source_word: ἐπιμένωμεν
  choice: とどまり続けるべきでしょうか
  rationale: 現在接続法が示す、継続的な行動についての熟慮的な問いを保持する。「とどまり続ける」は継続と固執の両面を伝える。
- source_word: τῇ ἁμαρτίᾳ
  choice: 罪の中に
  rationale: 与格が示す、罪という領域・状態にとどまる意味を保つ。「罪を犯し続ける」よりも原文の比喩的表現に近い。
- source_word: ἵνα
  choice: ために
  rationale: 問いの中で提示される目的ないし意図された結果を明示する。
- source_word: ἡ χάρις
  choice: 恵み
  rationale: ここでは神の恵み深い好意と働きを指す、確立した自然な訳語。
- source_word: πλεονάσῃ
  choice: 増し加わる
  rationale: 量や程度がさらに大きくなるという語義を明確に伝えつつ、パウロ書簡にふさわしい格調を保つ。
theological_decisions:
- issue: 問いを許可・義務・単なる予測のどれとして表すか
  choice: 継続すべきかを問う熟慮的・倫理的な問いとして「とどまり続けるべきでしょうか」と訳す
  alternative: 「とどまり続けるのでしょうか」または「とどまり続けようではありませんか」
  rationale: ギリシア語の接続法は、提案された行動についての修辞的な熟慮を表す。「べきでしょうか」はその倫理的な力を示しつつ、次節の否定をこの節へ先取りして持ち込まない。
- issue: ἵνα節を目的と結果のどちらに限定するか
  choice: 「ために」として、問いの論理上提示された目的を前面に出す
  alternative: 「その結果、恵みが増し加わるように」
  rationale: ἵναの目的的な力を自然に表す一方、この主張が話者自身の是認ではなく修辞的に提示された推論であるという緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞的な問いの格調を保った。「私たちは」はギリシア語動詞の一人称複数を日本語で明確にするために補った。脚注記号[a][b]は本文末に置き、それぞれ継続表現と増大表現の訳語上の選択肢を示した。
source_grounding:
  english_pob_role: consult_only
