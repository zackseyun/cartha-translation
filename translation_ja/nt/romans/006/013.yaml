revisions:
- from: また、あなたがたの体の各部分を、不義の武器[a]として罪に差し出してはなりません。むしろ、死者の中から生きる者として自分自身を神に差し出し、体の各部分を義[b]の武器として神に差し出しなさい。
  to: また、あなたがたの体の各部分を、不義のための武器[a]として罪に差し出してはなりません。むしろ、死者の中から生きた者として自分自身を神に差し出し、体の各部分を義[b]のための武器として神に差し出しなさい。
  rationale: 主な修正は、ὡσεὶ ἐκ νεκρῶν ζῶνταςを自然な日本語で「死者の中から生きた者として」とした点である。これは死から命への対照を明瞭にしつつ、「生き返らされた」のような原文にない受動的説明を加えない。「不義／義のための武器」は、両句の対称性と武器が用いられる方向を明確にする軽微な自然化である。
