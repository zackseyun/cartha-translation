id: ROM.6.13
reference: Romans 6:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: ja
  text: また、あなたがたの体の各部分を、不義のための武器[a]として罪に差し出してはなりません。むしろ、死者の中から生きた者として自分自身を神に差し出し、体の各部分を義[b]のための武器として神に差し出しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「武器」は「道具」とも訳せる。後半の「義のための武器」も同様。
    reason: lexical_alternative
  - marker: b
    text: 「義」は「正義」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: 差し出す
  rationale: 同じ動詞を両方の命令で一貫して訳し、自分自身や身体を相手の用に供するという意味と、罪と神との鋭い対比を保つ。
- source_word: μέλη
  choice: 体の各部分
  rationale: 「肢体」より現代の一般読者に明瞭でありつつ、道徳的行為に用いられる身体の諸部分というパウロの表現を保つ。
- source_word: ὅπλα
  choice: 武器
  rationale: より広い「道具」も可能だが、文脈にある戦いの比喩を鮮明に伝える。
- source_word: ἀδικίας
  choice: 不義
  rationale: δικαιοσύνηςとの対句を保ち、倫理的・神学的な意味領域を簡潔に表す。
- source_word: ἁμαρτίᾳ
  choice: 罪
  rationale: ギリシア語を直接的に訳し、文脈における罪の擬人化や支配力を説明的に限定しない。
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: 死者の中から生きる者として
  rationale: ὡσείの比較的な力と、死から命への復活を思わせる対比を保ち、「生き返らされた」と受動態を補わない。
- source_word: δικαιοσύνης
  choice: 義
  rationale: パウロ書簡の倫理的・神学的文脈に自然で、ἀδικίαςの「不義」と明確な対をなす。「正義」という可能性は脚注に残す。
theological_decisions:
- issue: 罪と神が、身体を差し出す相手として対置されること
  choice: 「罪に」「神に」という与格の関係を直接保つ
  alternative: 「罪に仕えるため」「神に仕えるため」と説明的に訳す
  rationale: 奉仕や帰属の含意は文脈から伝わるため、原文にない説明を加えず、罪と神との対立をそのまま示す。
- issue: ὡσεὶ ἐκ νεκρῶν ζῶντας の復活的表現
  choice: 「死者の中から生きる者として」
  alternative: 「死者の中から生き返らされた者として」または「死者の中から生き返ったかのように」
  rationale: 復活との結びつきを伝えつつ、原文に明示されない受動態を補わず、ὡσείを単なる非現実の「かのように」に限定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、命令の厳粛さを保つため丁寧体で統一した。「肢体」ではなく「体の各部分」として一般読者への分かりやすさを優先しつつ、「不義／義」「武器」「差し出す」の反復と対照を保持した。
