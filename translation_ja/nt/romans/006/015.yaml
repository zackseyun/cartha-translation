  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: ja
  text: では、どうなのでしょうか。私たちは律法の下ではなく、恵みの下にいるのだから、罪を犯してよいのでしょうか。[a] 決してそうではありません。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「罪を犯しましょうか。」
    reason: lexical_alternative
  - marker: b
    text: 別訳「決してそうではない。」
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: では、どうなのでしょう
  rationale: パウロの議論を受ける簡潔な推論的問いとして、原文にない内容を補わず、現代日本語で自然に表した。
- source_word: ἁμαρτήσωμεν
  choice: 罪を犯してよいのでしょうか
  rationale: 一人称複数・アオリスト接続法の熟慮的用法を、単なる未来の予測ではなく、提案の是非を問う修辞的疑問として明瞭に表した。別訳は脚注に示した。
- source_word: ὅτι
  choice: 〜のだから
  rationale: 律法の下ではなく恵みの下にいることを、罪を犯すことの根拠として持ち出す論理関係を自然な日本語で示した。
- source_word: ὑπὸ νόμον
  choice: 律法の下
  rationale: 前置詞句の比喩を保ちつつ、νόμοςを文脈上定着した「律法」と訳した。「モーセの律法」と限定せず、指示範囲の解釈余地を残した。
- source_word: ὑπὸ χάριν
  choice: 恵みの下
  rationale: 律法との対照とὑπόの反復を保ち、パウロにおけるχάριςの神学的含意を不要な説明なしに伝える。
- source_word: μὴ γένοιτο
  choice: 決してそうではありません
  rationale: 強い否定と拒絶を、威厳を保った明瞭な現代日本語で表した。字義的願望表現より日本語として自然であり、別の簡潔な表現を脚注に示した。
theological_decisions:
- issue: νόμοςの指示範囲
  choice: 「律法」とし、「モーセの律法」とは明記しない
  alternative: 「法」「モーセの律法」
  rationale: 無冠詞のνόμοςが持ち得る広がりを保ち、契約史的・法的な範囲を本文で一義的に限定しないため。
- issue: 恵みの下にいることと罪との関係
  choice: 罪を許容する根拠として提示された問いを、そのまま修辞的疑問として訳す
  alternative: 恵みは罪を許容しないという説明を本文に補う
  rationale: パウロ自身の強い否定へ至る論証の緊張を保ち、説明的な神学解釈を本文へ追加しないため。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「〜の下」という原文の対句を維持した。「罪を犯してよい」は熟慮的接続法の含意を自然に示す一方、許可の響きがやや前面に出るため、より形式対応的な別訳を脚注に置いた。すべての脚注記号を本文に明示した。
