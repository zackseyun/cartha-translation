id: ROM.6.20
reference: Romans 6:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: ja
  text: というのも、あなたがたが罪の奴隷であった時、義[b]に関しては自由だった[a]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「義から自由だった」。
    reason: 与格を関係・観点ではなく、実質的に分離の意味で理解する訳の可能性を示すため。
  - marker: b
    text: 「義」は「正義」とも訳せる。
    reason: δικαιοσύνηが文脈により「正義」を含む倫理的意味を持ち得るため。
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴隷
  rationale: ローマ書6章では罪と義への相対する隷属が論旨の中心であり、拘束・所有の強い意味を保つため「奴隷」とした。
- source_word: τῆς ἁμαρτίας
  choice: 罪の
  rationale: 属格を、罪に属し、その支配下にある奴隷という関係を自然に表す「罪の」とした。
- source_word: ἐλεύθεροι
  choice: 自由だった
  rationale: 罪の奴隷であった者が義との関係では「自由」であったというパウロの鋭い対比と逆説を保った。
- source_word: τῇ δικαιοσύνῃ
  choice: 義に関しては
  rationale: 与格を関係・観点の用法として表し、「義が圧制者であり、そこから解放されていた」と一義的に断定しない訳とした。
- source_word: δικαιοσύνῃ
  choice: 義
  rationale: パウロ書簡における語の神学的・倫理的な広がりを保つ簡潔な訳語として「義」を用い、「正義」の可能性は脚注に示した。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前後の議論に対する説明の接続を、現代日本語で明確かつ自然に示した。
theological_decisions:
- issue: 義と「自由」との関係をどう表すか
  choice: 義に関しては自由だった
  alternative: 義から自由だった
  rationale: ギリシア語の与格が示し得る関係・観点を本文で保ちつつ、分離を強く示す読みも脚注に残した。これにより、罪への隷属と義に対する自由という修辞的緊張を解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「奴隷」「義」「自由」という章全体の対比語を保持した。「というのも……からです」によりγάρの説明的機能を自然に表した。
