  text: ἐλευθερωθέντες δὲ ἀπὸ τῆς ἁμαρτίας ἐδουλώθητε τῇ δικαιοσύνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/018.yaml
  text: And having been freed from sin[b][a], you were enslaved to righteousness.
translation:
  language: ja
  text: そして、あなたがたは罪から解放され、義の奴隷とされました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正義の奴隷とされました」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: 解放され
  rationale: アオリスト受動分詞の、受け手にもたらされた解放を自然な現代日本語で表す。主動詞に従属する状況を、日本語では連用形で明確にした。
- source_word: δὲ
  choice: しかし
  rationale: 直前までの罪への隷属との対照を示す緩やかな接続として訳した。文脈により「そして」も可能だが、ここでは対照が自然である。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 定冠詞付き単数形が持つ、抽象概念であると同時に支配する力として擬人化された含みを保つ。
- source_word: ἐδουλώθητε
  choice: 奴隷とされました
  rationale: アオリスト受動の意味と、罪から義へ主人が移るという鋭い奴隷の比喩を弱めずに表す。
- source_word: δικαιοσύνῃ
  choice: 義
  rationale: 与格を「義の奴隷」と自然に表し、パウロ書簡における道徳的・法廷的・契約的な広がりを過度に限定しない。
theological_decisions:
- issue: δουλόω の奴隷比喩
  choice: 義の奴隷とされました
  alternative: 義に仕える者となりました
  rationale: パウロの議論に中心的な、支配権の移行を示す奴隷の比喩を「仕える」と和らげず、受動態も保持した。
- issue: δικαιοσύνη の意味範囲
  choice: 義
  alternative: 正義
  rationale: ここでは個人の徳だけでなく神との正しい関係や正しいあり方を含み得るため、日本語聖書語として意味の幅を保てる「義」を本文に置く。「正義」は文脈上可能な語義として脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語。原文の受動態と奴隷比喩を保持しつつ、過度に古風な言い回しを避けた。
