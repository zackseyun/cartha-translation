  text: εἰ δὲ ἀπεθάνομεν σὺν Χριστῷ, πιστεύομεν ὅτι καὶ συζήσομεν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: ja
  text: 私たちがメシア[a]とともに死んだのなら、またメシアとともに生きることになると信じています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語 Χριστῷ（Christō）。
    reason: Χριστόςの称号を「メシア」と訳しつつ、伝統的な訳語「キリスト」も提示するため。
lexical_decisions:
- source_word: εἰ δὲ
  choice: 〜のなら
  rationale: εἰの条件を自然な日本語で示す。δέの軽い展開・対照の働きは文脈に委ね、ここでは不自然な接続語を補わない。
- source_word: ἀπεθάνομεν
  choice: 私たちが死んだ
  rationale: アオリスト直説法を、すでに起こった共同の死を指す簡潔な過去表現で訳す。
- source_word: σὺν Χριστῷ
  choice: メシアとともに
  rationale: σύνの結合・同行の意味を「とともに」で表し、Χριστόςは称号として「メシア」と訳す。
- source_word: πιστεύομεν
  choice: 私たちは信じています
  rationale: 信仰語彙としての基本的な意味を保ちつつ、現代日本語として自然な継続的確信の表現にする。
- source_word: ὅτι
  choice: 〜と
  rationale: 信じる内容を導くὅτιを、日本語の引用・内容節を示す助詞「と」で表す。
- source_word: καὶ
  choice: 〜にも
  rationale: 共同の死に対応する共同の生を付加する働きを「にも」で示す。
- source_word: συζήσομεν αὐτῷ
  choice: この方とともに生きることになる
  rationale: 未来形を「ことになる」で示し、συζάωと与格αὐτῷが表す共同の生を「この方とともに生きる」と自然に訳す。
theological_decisions:
- issue: Χριστῷの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスに対する称号としての意味を明示する一方、一般に定着した別訳を脚注に残す。
- issue: συζήσομεν αὐτῷが指す将来の生の性質
  choice: この方とともに生きることになる
  alternative: この方とともに復活の命に生きる
  rationale: ギリシア語が述べる将来の共同の生をそのまま保ち、それが現在的・終末的にどう関係するかを訳文で限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」は直前のメシアを受け、敬意を保ちながら代名詞の指示を明確にする。
