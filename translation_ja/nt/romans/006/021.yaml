  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: ja
  text: では、あなたがたはそのころ、今では恥じている事柄から、どんな実を結んでいたのでしょうか。それらの行き着く先は死だからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「行き着く先」は「結末」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα
  choice: どんな
  rationale: 修辞疑問として、以前の歩みが生んだ実の性質を問い、自然な現代日本語にする。
- source_word: καρπὸν
  choice: 実
  rationale: 行為が生み出す結果というパウロの比喩を保ち、「利益」「結果」と平板化しない。
- source_word: εἴχετε
  choice: 得ていた
  rationale: 未完了過去が示す以前の継続的状態を表しつつ、ἐφ’ οἷςとの関係を自然な日本語で示す。
- source_word: τότε
  choice: そのころ
  rationale: 過去の時点を示し、後続の「今では」と明確に対照させる。
- source_word: ἐφ’ οἷς
  choice: 事柄から
  rationale: 前置詞句を、以前の行いから実を得るという関係として自然に表し、暗黙の指示対象を「事柄」で補う。
- source_word: νῦν
  choice: 今では
  rationale: τότεとの時間的対照と、現在は評価が変わったことを明瞭にする。
- source_word: ἐπαισχύνεσθε
  choice: 恥じている
  rationale: 単なる気まずさではなく、道徳的な羞恥を伴う現在の状態を表す。
- source_word: τέλος
  choice: 行き着く先
  rationale: 終点と帰結の双方を含み得る語義を、明快な現代日本語で保つ。「結末」も可能なため脚注に示す。
- source_word: ἐκείνων
  choice: それら
  rationale: 直前の、今では恥じている事柄を簡潔に受ける。
- source_word: θάνατος
  choice: 死
  rationale: 原語の神学的重みと簡潔さをそのまま保つ標準的な訳語。
theological_decisions:
- issue: τέλοςを終点として訳すか、結果として訳すか
  choice: 行き着く先
  alternative: 結末／結果
  rationale: 以前の生き方の終着点とその帰結という両面を残し、一方に限定しない。
translation_notes:
  register: 明快で自然な現代標準語を用いながら、修辞疑問と「実」の比喩を保持した。文末のγάρは、直前の問いを説明する理由として「だからです」とした。
