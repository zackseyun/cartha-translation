    rationale: 原文のμηκέτι δουλεύεινは「もはや罪に奴隷として仕えない／隷属しない」ことであり、「奴隷とならない」は未然の奴隷化を否定する意味にも傾く。「罪の奴隷でなくなる」は、原文の『もはや』と隷属状態からの解放を自然に表せる。
  revised_text: 私たちはこのことを知っています。すなわち、私たちの古い人はキリストとともに十字架につけられました。それは、罪のからだが無力にされ[a]、私たちがもはや罪の奴隷でなくなるためです[b]。
