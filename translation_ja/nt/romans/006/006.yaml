id: ROM.6.6
reference: Romans 6:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: ja
  text: 私たちはこのことを知っています。すなわち、私たちの古い人はキリストとともに十字架につけられました。それは、罪のからだが無力にされ[a]、私たちがもはや罪の奴隷でなくなるためです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「無効にされ」、または「廃止され」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「私たちがもはや罪に奴隷として仕えないため」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γινώσκοντες
  choice: 私たちはこのことを知っています
  rationale: 分詞の継続的なつながりを保ちつつ、現代日本語で自然な独立節とした。「このこと」は直前の議論を受ける。
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: 私たちの古い人
  rationale: パウロ特有の人間論的表現を「古い自分」と説明的に限定せず、「人」という原文の像を残した。男女を含む共同的・人格的な意味である。
- source_word: συνεσταυρώθη
  choice: キリストとともに十字架につけられました
  rationale: συν-の共同性を「ともに」で明示した。目的語は原文では省略されているが、文脈上の指示対象を日本語で明確にするため「キリスト」を補った。
- source_word: καταργηθῇ
  choice: 無力にされ
  rationale: 存在の消滅と断定せず、働きや支配力を失わせる語義を簡潔に表した。別の可能性は脚注に示した。
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: 罪のからだ
  rationale: 属格構文の凝縮された曖昧さを保ち、「罪に支配されたからだ」などの解釈に固定しなかった。
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: 私たちがもはや罪の奴隷とならないためです
  rationale: δουλεύωの奴隷状態・隷属という強い比喩を保持し、単なる「仕える」よりも罪の支配下にある状態を明確にした。
theological_decisions:
- issue: 「古い人」の人間論的意味
  choice: 私たちの古い人
  alternative: 私たちの古い自分
  rationale: 自然さだけを優先して個人の内面的な「自己」に狭めず、原文のἄνθρωποςが持つ人格的・共同的な像と神学的緊張を残した。
- issue: καταργηθῇが示す作用
  choice: 無力にされ
  alternative: 廃止され／無効にされ
  rationale: 罪のからだの完全消滅まで読み込まず、その働きが効力を失う意味を主文に置いた。他の語義の幅は脚注で保持した。
- issue: συνεσταυρώθηの省略された共同者
  choice: キリストとともに
  alternative: 彼とともに
  rationale: ギリシア語には代名詞が明示されないが、6章3–5節の文脈から共同者はキリストである。日本語では補わないと不自然になりやすいため明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神学用語を過度に説明せず、「古い人」「罪のからだ」「奴隷」という原文の比喩と緊張を保持した。長いギリシア語構文は二文に分け、読解しやすくした。
