revisions:
- from: 私たちはこのことを知っています。すなわち、私たちの古い人はキリストとともに十字架につけられました。それは、罪のからだが無力にされ[a]、私たちがもはや罪の奴隷とならないためです[b]。
  to: 私たちはこのことを知っています。すなわち、私たちの古い人はキリストとともに十字架につけられました。それは、罪のからだが無力にされ[a]、私たちがもはや罪の奴隷でなくなるためです[b]。
  rationale: 結尾のみを「罪の奴隷でなくなる」に改めた。これにより、δουλεύεινが表す罪への隷属・奴隷的奉仕が終わることを保ちつつ、「奴隷とならない」が帯びうる将来的・未然の意味を避けた。ほかの表現、文脈上の「キリスト」の補い、および脚注アンカーは維持した。
