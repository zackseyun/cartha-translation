id: ROM.6.16
reference: Romans 6:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: ja
  text: あなたがたは知らないのですか。従うために自分自身を奴隷として差し出すなら、あなたがたは、従う相手の奴隷なのです。すなわち、死に至る罪の奴隷か、義[a]に至る従順の奴隷か、そのどちらかなのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義」。
    reason: δικαιοσύνη は「義」のほか、文脈により「正義」とも訳せるため。
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: 自分自身を……として差し出す
  rationale: 自分を相手の支配下に置き、その意のままに用いさせるという具体的な意味を保ちつつ、現代日本語として自然にした。
- source_word: δούλους / δοῦλοί
  choice: 奴隷
  rationale: 単なる奉仕者ではなく、主人に所有され服従する身分がこの対比の中心であるため、「しもべ」ではなく「奴隷」とした。
- source_word: εἰς ὑπακοήν
  choice: 従うために
  rationale: εἰς の目的を明確に表す。日本語では名詞形の「服従のために」より自然である。
- source_word: ᾧ ὑπακούετε
  choice: 従う相手
  rationale: 関係代名詞の与格が示す服従の対象を簡潔に表し、原文にない「主人」を補わなかった。
- source_word: ἁμαρτίας εἰς θάνατον
  choice: 死に至る罪
  rationale: 罪を擬人化された支配者として示す文脈を保ちながら、εἰς の方向・結果を「至る」で表した。
- source_word: ὑπακοῆς εἰς δικαιοσύνην
  choice: 義に至る従順
  rationale: 罪と従順を対置する原文の抽象名詞と、εἰς の方向・結果を保った。
- source_word: δικαιοσύνην
  choice: 義
  rationale: パウロ書簡における道徳的・神学的な広がりを持つ簡潔な定訳を用いた。「正義」も語義上可能なので脚注に残した。
theological_decisions:
- issue: パウロの対比における δικαιοσύνη の訳語
  choice: 義
  alternative: 正義
  rationale: ここでは、死に至る罪と対照される、従順が至る状態・領域を表す。「義」は法廷的・関係的・道徳的な含みを限定せずに保つ一方、「正義」も可能な語義として脚注に示した。
- issue: 罪と従順を奴隷の主人として扱う比喩
  choice: 「罪の奴隷」「従順の奴隷」という対称形を保つ
  alternative: 「罪に従う奴隷」「従順によって義に至る者」と説明的に訳す
  rationale: 原文は属格の「罪」「従順」を並列させており、抽象概念を主人のように扱う意図的な緊張があるため、これを解消しなかった。
translation_notes:
  register: 明快な現代標準語を用いながら、修辞疑問と奴隷の比喩の強さを保持した。「そのどちらかなのです」を補って二者択一の構造を自然に示した。
