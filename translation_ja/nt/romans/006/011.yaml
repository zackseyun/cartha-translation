  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς λογίζεσθε ἑαυτοὺς ⸂εἶναι νεκροὺς μὲν⸃ τῇ ἁμαρτίᾳ ζῶντας δὲ τῷ θεῷ ἐν Χριστῷ ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/011.yaml
  text: So also you[c][b][a], consider yourselves to be dead to sin but alive to God in Messiah Jesus.
translation:
  language: ja
  text: 同じように、あなたがたも、自分は罪に対して死んでいるが、神に対してはキリスト・イエスにあって生きている、と考えなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「考えなさい」は、「そのような者と見なしなさい」「そのような者として数えなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同じように、…も
  rationale: 直前の議論を受ける推論的なつながりを保ちつつ、自然な現代日本語とした。
- source_word: λογίζεσθε
  choice: 考えなさい
  rationale: 単なる想像ではなく、事実として見なし認める意味を文脈上伝える、平明な表現を選んだ。別訳は脚注に示した。
- source_word: ἑαυτοὺς εἶναι
  choice: 自分は…と
  rationale: ギリシア語の再帰表現と、λογίζεσθεに従属する『…であると』という構文を自然な日本語で明示した。複数の『あなたがた』各人を指すため『自分は』とした。
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: 罪に対して死んでいる
  rationale: 与格の関係を『…に対して』で保ち、μέν…δέの対照は『…が、…は』で表した。
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: 神に対しては…生きている
  rationale: 分詞の『生きている』を保持し、『罪に対して死んでいる』との対照を明確にした。
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: キリスト・イエスにあって
  rationale: ἐνの結合・領域を示すパウロ特有の含みを解消せず、『にあって』で保った。Χριστόςは日本語で定着した称号『キリスト』とした。
theological_decisions:
- issue: Χριστῷを称号としてどう表すか
  choice: キリスト
  alternative: メシア
  rationale: Χριστόςの称号性を保持しながら、日本語聖書語として広く理解される『キリスト』を用いた。固有名の一部に単純化する意図はない。
- issue: ἐν Χριστῷ Ἰησοῦの関係
  choice: キリスト・イエスにあって
  alternative: キリスト・イエスによって／キリスト・イエスのゆえに
  rationale: 手段や原因に限定せず、キリストとの結びつき、またその領域という原文の神学的な幅を保った。
- issue: 『死んでいる』『生きている』を命令の対象としてどう扱うか
  choice: そのような者であると考えなさい
  alternative: そのような者になりなさい
  rationale: 命令は死ぬこと、生きること自体ではなく、自分をそのような者として認めることに向けられているため、原文どおり認識の命令として訳した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。『キリスト・イエスにあって』は日常語よりやや聖書的だが、ἐνの重要な神学的含意と曖昧さを保つため採用した。脚注記号は本文の該当文末に置いた。
