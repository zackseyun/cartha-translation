id: ROM.6.2
reference: Romans 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ γένοιτο· οἵτινες ἀπεθάνομεν τῇ ἁμαρτίᾳ, πῶς ἔτι ζήσομεν ἐν αὐτῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/002.yaml
  text: Absolutely not! We who died to sin—how can we still live in it?[a]
translation:
  language: ja
  text: 決してそんなことはありません。罪に対して死んだ私たちが、どうしてなおも罪の中に生きることができるでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「断じてそうではありません」とも訳せる。強い拒絶を表す言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: 決してそんなことはありません
  rationale: パウロが用いる強い否定を、古風にならない明瞭で品位ある日本語で表した。直前の問いや主張を断固として退ける力を保っている。
- source_word: οἵτινες
  choice: 罪に対して死んだ私たちが
  rationale: 一人称複数の包括性を保ちつつ、後続する修辞疑問の主語として自然な日本語にした。
- source_word: ἀπεθάνομεν
  choice: 死んだ
  rationale: アオリストが示す決定的な出来事を単純過去で表し、原文の死の比喩を説明的に言い換えず保持した。
- source_word: τῇ ἁμαρτίᾳ
  choice: 罪に対して
  rationale: ἀποθνῄσκω とともに用いられた与格の関係的意味を表す。罪への感覚が鈍った、罪を離れた、などと狭く解釈しない。
- source_word: πῶς ἔτι
  choice: どうしてなおも
  rationale: 継続への強い疑念を示す修辞的な響きと、ἔτι の時間的意味の双方を自然に表した。
- source_word: ζήσομεν
  choice: 生きることができるでしょうか
  rationale: 未来直説法を修辞疑問として自然な日本語にし、不可能・不整合を問いただす文脈上の力を表した。
- source_word: ἐν αὐτῇ
  choice: 罪の中に
  rationale: 代名詞の指示対象を日本語では明示し、罪が人の生きる領域として描かれる空間的比喩を保持した。
theological_decisions:
- issue: この節が道徳的改善を述べるのか、罪との決定的な関係の断絶を述べるのか
  choice: 「罪に対して死んだ」という比喩をそのまま保持する
  alternative: 「罪から離れた」「罪に反応しなくなった」などと説明的に訳す
  rationale: 原文は比喩の意味をここで限定していない。直接的な表現を保つことで、罪の支配との断絶を示しながら、その具体的な仕組みを訳文で一つの教理的解釈に決めない。
translation_notes:
  register: 明瞭な現代標準語を用い、強い否定と修辞疑問の力を保った。「罪に対して死ぬ」「罪の中に生きる」というパウロの対照的な比喩は、説明を加えず本文に残した。
