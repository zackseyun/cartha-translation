  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: ja
  text: メシア[a]は死者の中から復活させられ、もはや死ぬことがなく、死はもはや彼を支配しないことを、私たちは知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: と私たちは知っています
  rationale: 分詞が周辺の議論を支える共有知識を表すことを自然な現代日本語で示しつつ、「ので」と組み合わせて文の論理関係を明確にした。
- source_word: Χριστὸς
  choice: メシア
  rationale: ここでは固有名の一部というより称号としての意味が保たれているため、「キリスト」ではなく称号の意味を伝える「メシア」とした。
- source_word: ἐγερθεὶς
  choice: 復活させられたので
  rationale: アオリスト受動分詞の受動態と、主動詞に先立つ復活の出来事を保持した。「よみがえった」よりも、神によって起こされたという原文の受動形を明示する。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: ἐκと複数形νεκρῶνを反映し、死者たちの中からの復活という表現を保った。
- source_word: οὐκέτι
  choice: もはや…ない
  rationale: 二度とも、以前の状態が決定的に終わったことを表す自然で格調ある日本語とした。
- source_word: ἀποθνῄσκει
  choice: 死ぬことはなく
  rationale: 現在形が示す継続的な現実を、日本語では「もはや…ことはない」によって自然に表現した。
- source_word: θάνατος
  choice: 死
  rationale: 原文どおり抽象名詞を主語として残し、死が人格的な力のように描かれるパウロの修辞を保持した。
- source_word: κυριεύει
  choice: 支配する
  rationale: 主権・支配力を及ぼす意味を、現代日本語で明瞭かつ力強く伝える語を選んだ。
theological_decisions:
- issue: パウロ書簡におけるΧριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号としての意味が認められるため、その意味内容を伝える「メシア」を本文に採用し、慣用的な「キリスト」を脚注に残した。
- issue: 復活を表す受動態
  choice: 復活させられた
  alternative: 復活した／よみがえった
  rationale: ἐγερθεὶςの神的受動とも解し得る受動形を保持し、行為者を本文で補わないことで、原文の含意と曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。原文の二つの節を一続きの自然な日本語文に整え、二度のοὐκέτιはそれぞれ「もはや」で明示した。
