review_pass:
  verdict: revise
  source_fidelity: 原文の主要な意味（キリスト／メシアが死者の中から復活させられ、もはや死なず、死がもはや彼を支配しない）は保たれている。だが、εἰδότεςは前節の主語に係る分詞であり、本文の「…ので、…と私たちは知っています」は、分詞を原因節として読み替えたうえで、知っている内容との構文上の関係もやや不自然にしている。
  naturalness: 現行文は意味を理解できるが、「復活させられたので、…と私たちは知っています」は現代日本語として係り受けが不安定である。「…ことを、私たちは知っています」として知識の内容を明瞭に示すのが自然である。
  terminology: 「メシア」とし、代替訳「キリスト」を脚注に置く方針は、Χριστόςを称号として扱う原文および英語監査記録と整合する。「復活させられた」はἐγερθείςの受動態を適切に保つ。
