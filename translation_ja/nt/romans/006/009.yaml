  rationale: 原文のアオリスト受動分詞ἐγερθείςを「復活させられ」と保ちつつ、「ので」を除いて不必要な因果関係を避けた。「…ことを、私たちは知っています」により、εἰδότεςが表す認識の内容を自然な現代日本語で示した。二つのοὐκέτιはそれぞれ「もはや」で保持し、θάνατοςの人格的な支配の比喩も「死は…支配しない」で維持した。
