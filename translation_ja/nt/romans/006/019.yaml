id: ROM.6.19
reference: Romans 6:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: ja
  text: 私は、あなたがたの肉[a]の弱さのために、人間的な言い方をしています。あなたがたがかつて、自分の体の各部分を汚れと不法の奴隷として差し出し、不法に至ったように、今は、自分の体の各部分を義[b]の奴隷として、聖なる者となるために差し出しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉」は、ここでより解釈的に「罪深い性質」と理解することもできますが、ギリシア語の表現はそれより広い意味を残しています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「正義」または「正しさ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: 人間的な言い方をしています
  rationale: 人間の理解に合わせた表現を用いているという慣用的な意味を、比喩と限定しすぎず自然な現代日本語で示す。
- source_word: ἀσθένειαν τῆς σαρκὸς ὑμῶν
  choice: あなたがたの肉の弱さ
  rationale: ἀσθένειαの広い意味を「弱さ」で保ち、σάρξは解釈を「罪深い性質」に限定せず「肉」とした。
- source_word: παρεστήσατε / παραστήσατε
  choice: 差し出し／差し出しなさい
  rationale: 過去の行為と現在の勧告における同一動詞の反復を保持し、自己をある支配のもとに置く含意を表す。
- source_word: τὰ μέλη ὑμῶν
  choice: 自分の体の各部分
  rationale: 「肢体」より現代の一般読者に明瞭であり、身体の諸部分や機能を指す意味を保つ。
- source_word: δοῦλα
  choice: 奴隷
  rationale: ローマ書6章を貫く支配と隷属の比喩の強さを、「僕」や「仕える者」へ弱めずに伝える。
- source_word: ἀκαθαρσίᾳ
  choice: 汚れ
  rationale: 道徳的・宗教的な不浄を含み得る語を、簡潔で自然な現代日本語にした。
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: 不法／不法
  rationale: 二度の語の反復を保ち、不法がさらに不法を生むという修辞的な進展を示す。
- source_word: δικαιοσύνῃ
  choice: 義
  rationale: パウロ的文脈での神学的・倫理的な広がりを保ち、「正義」だけに狭めない。
- source_word: ἁγιασμόν
  choice: 聖なる者となること
  rationale: 専門用語的な「聖化」を避けながら、聖性へ向かう過程・結果を自然な日本語で表す。
theological_decisions:
- issue: 「肉」（σάρξ）の解釈
  choice: 肉
  alternative: 罪深い性質
  rationale: ここでは堕落した人間のあり方が含意され得るが、ギリシア語は身体性を含むより広い表現であり、狭い教理的解釈に固定しない。
- issue: 「義」（δικαιοσύνη）の訳し方
  choice: 義
  alternative: 正義／正しさ
  rationale: 不法との倫理的対照を示しつつ、パウロにおける語の広い神学的含意を保持する。
- issue: εἰς ἁγιασμόν の方向性
  choice: 聖なる者となることへと進みなさい
  alternative: 聖化のために／聖化に至るように
  rationale: εἰςが示す目的・方向・結果の重なりを、一つに断定しすぎず動的な表現で伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、奴隷、不法、義というパウロの対照的な語彙と反復を保持した。「肢体」「聖化」のような教会内で通用しやすい専門語は本文では避け、意味が一般読者に直接伝わる表現にした。
