id: ROM.6.14
reference: Romans 6:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: ja
  text: 罪があなたがたを支配することはないのです。[a] あなたがたは律法の下に[b]いるのではなく、恵みの下にいるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたに対して主権を振るうことはない」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「律法の下に」。律法の権威または支配領域の下にあることを意味する表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: 罪
  rationale: パウロ書簡における標準的な訳語を用いる。ここでは罪が支配者のように擬人化されているが、訳文で固有名詞化するなどの解釈は加えない。
- source_word: κυριεύσει
  choice: 支配することはない
  rationale: 主権や支配力を行使することを表す動詞であり、罪を支配者として描く比喩を、明瞭で自然な現代日本語で保つ。未来形の断定的な約束も「ことはない」で表した。
- source_word: ὑπὸ νόμον
  choice: 律法の下に
  rationale: 律法の権威・支配領域の下にあることを示すパウロ的表現を保持する。文脈上、律法はモーセ律法を中心とする律法秩序を指すと考えられるが、本文では限定的な説明を加えない。
- source_word: ὑπὸ χάριν
  choice: 恵みの下に
  rationale: 律法との対比を保ち、神の恵みが支配する領域にあるという比喩を、前半と対応する形で表す。
- source_word: γὰρ ... γάρ
  choice: のです……からです
  rationale: 最初のγὰρが前文への説明を導き、二つ目のγάρが罪に支配されない根拠を示す構造を、自然な日本語の説明表現で再現する。
theological_decisions:
- issue: 罪の擬人化をどの程度明示するか
  choice: 「罪があなたがたを支配する」とし、擬人化を動詞によって保持する。
  alternative: 「罪があなたがたの主人となることはない」
  rationale: 原文は罪を支配力として描くが、「主人」と補うと比喩を強めすぎる。「支配する」は原文の神学的イメージを保ちつつ、余分な人格化を加えない。
- issue: 「律法の下」と「恵みの下」の対比
  choice: 両方を「〜の下に」と対応させる。
  alternative: 「律法の支配下ではなく、恵みの中に」
  rationale: 原文で反復されるὑπόの構造を保ち、律法と恵みという二つの領域・支配秩序の対比を解釈で弱めたり非対称にしたりしない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「支配」「律法の下」「恵みの下」というパウロの対照的な表現を保持した。「のです／からです」によって二つのγὰρの説明関係を自然に示している。
