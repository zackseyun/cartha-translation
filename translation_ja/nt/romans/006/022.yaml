id: ROM.6.22
reference: Romans 6:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: ja
  text: しかし今は、罪から解放され、神の奴隷とされたあなたがたは、聖化に至る実を得ており[a]、その終わりは永遠の命です。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖さに至る実を得ており」。
    reason: lexical_alternative
  - marker: b
    text: 「終わり」は、単なる停止ではなく最終的な帰結を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δέ
  choice: しかし今は
  rationale: 直前までの罪の支配下にあった状態との強い対比を、自然な現代日本語で示す。
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: 罪から解放され
  rationale: アオリスト受動分詞が表す、信徒が受けた決定的な解放を簡潔に保つ。単数の「罪」は行為の集合ではなく支配力・領域として読める形を維持する。
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: 神の奴隷とされた
  rationale: 受動態と、罪への隷属から神への隷属へ移るというパウロの意図的で強い比喩を弱めずに表す。
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: その実を得て
  rationale: καρπόςの結実の比喩を保持しつつ、「あなたがたの実」という不自然さを避け、ἔχετεの所有・享受の意味を自然に表す。
- source_word: εἰς ἁγιασμόν
  choice: 聖なる者とされていき
  rationale: εἰςの方向・帰結とἁγιασμόςの聖化の意味を、一般読者にも理解しやすい動的な日本語で表す。過程と結果の幅は脚注で補う。
- source_word: τὸ δὲ τέλος
  choice: その行き着くところ
  rationale: τέλοςがここで示す終局・最終的帰結を自然に表し、単なる停止としての「終わり」という誤解を避ける。
- source_word: ζωὴν αἰώνιον
  choice: 永遠の命
  rationale: 定着した明瞭な訳語であり、原文の神学的重みを保つ。
theological_decisions:
- issue: 神に対する奴隷の比喩
  choice: 「神の奴隷とされた」として強い隷属の比喩を保持する。
  alternative: 神に仕える者とされた／神に献身する者となった
  rationale: ローマ6章は罪への奴隷状態と神への奴隷状態を意図的に対照させる。穏当な奉仕表現に置き換えると論旨が弱まる。
- issue: ἁγιασμόςの過程と結果
  choice: 本文では「聖なる者とされていき」とし、方向性と継続的含意を自然に示す。
  alternative: 聖化に至り／聖さに至り
  rationale: ἁγιασμόςは聖化の過程にも聖なる状態にも関わりうるため、一方だけに固定せず脚注で別訳を示す。
- issue: τέλοςの意味
  choice: 文脈上の最終的帰結として「行き着くところ」と訳す。
  alternative: 終わり／結末
  rationale: 語の終局性を保ちながら、永遠の命が神への隷属の最終的な帰結であるという文脈を明瞭にする。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、パウロの強い奴隷比喩と「罪」「聖化」「永遠の命」の神学的重みを保持した。「奴隷」は現代日本語でも厳しい語だが、原文の対照構造上不可欠と判断した。
