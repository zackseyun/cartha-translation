    issue: ἁγιασμόνの構文上の関係が本文で不明瞭
    rationale: 「実を得て聖なる者とされていき」は、聖化を直接に「あなたがた」が経験する出来事として再構成しています。原文は「聖化に至るあなたがたの実」を持つ、と述べているため、「聖化に至る実」として関係を明示するのが安全です。
  - severity: low
    issue: ἔχετεの現在形が「得て」で弱まる
    rationale: 「得て」は後続の動作へつながる形に読まれやすいので、「得ており」にして現在の所有・享受を明示します。
  revised_text: しかし今は、罪から解放され、神の奴隷とされたあなたがたは、聖化に至る実を得ており[a]、その終わりは永遠の命です。[b]
  revised_footnotes:
