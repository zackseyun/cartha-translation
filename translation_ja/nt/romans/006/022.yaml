revisions:
- from: しかし今は、罪から解放され、神の奴隷とされたあなたがたは、その実を得て聖なる者とされていき[a]、その行き着くところは永遠の命です。[b]
  to: しかし今は、罪から解放され、神の奴隷とされたあなたがたは、聖化に至る実を得ており[a]、その終わりは永遠の命です。[b]
  rationale: 原文の「実—聖化—終わり—永遠の命」という連鎖を明瞭に保つため、「聖なる者とされていき」を「聖化に至る実を得ており」に改めました。これによりἔχετεの現在の所有とεἰς ἁγιασμόνの方向・帰結をより直接に反映します。「終わり」はτέλοςに対応させ、脚注で文脈上の帰結の意味を補いました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T18:11:57Z'
review_pass:
  verdict: revise
  source_fidelity: 「聖なる者とされていき」はἁγιασμόν（聖化／聖さ）を動詞句として解釈し、さらに「実を得て」と結び付けるため、原文の「聖化に至る実を得る」という構文と意味関係がやや不明瞭になっています。ἔχετεは現在形なので、「得ている」とするのがより直接的です。罪からの解放と神への奴隷化という受動的対照、および終局としての永遠の命は適切に反映されています。
  naturalness: 原案は概ね自然ですが、「その実を得て聖なる者とされていき」は、何が聖なる者とされるのか、また「実」との関係が何かを一読で取りにくい表現です。「聖化に至る実を得ており」とすれば、原文の修飾関係を保ちながら明瞭な現代標準日本語になります。
  terminology: 「罪」「神の奴隷とされた」「聖化」「永遠の命」は、ローマ6章の対照と主要語を適切に保持します。「奴隷」を「仕える者」などに弱めない判断は妥当です。「行き着くところ」は自然ですが、τέλοςとの対応を本文でより透明にするため「終わり」を用い、脚注で最終的帰結の意味を示します。
  issues:
