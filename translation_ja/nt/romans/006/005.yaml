id: ROM.6.5
reference: Romans 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: ja
  text: というのも、もし私たちが、キリストの死の似姿においてキリストと結ばれた者となっている[a]なら、私たちは同じように、その復活の似姿においてもキリストと結ばれる者となる[b]のです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリストと共に育った者となった」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の後半は簡潔に「しかしまた、復活のものともなる」と述べる。「キリストと結ばれる」と「似姿において」は前半から補っている。
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: 一つに結ばれた
  rationale: この語が表す、有機的に共に結び付いた状態や一体的な参与を、現代日本語で明瞭に示すため。「共に成長した」という原義的な表現は脚注に残した。
- source_word: γεγόναμεν
  choice: 結ばれた
  rationale: 過去に成立し現在も続く状態を表す完了形である。日本語では「一つに結ばれた」とすることで、その結果としての状態を自然に含ませた。
- source_word: τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ
  choice: キリストの死と同じ姿になって
  rationale: ὁμοίωμαの「似た姿・かたち」を保ちつつ、与格が示す関係を自然な日本語で表した。「死そのもの」と無限定に同一視せず、「同じ姿」という限定を維持した。
- source_word: ἀλλὰ καὶ
  choice: 必ず…も
  rationale: 前半を受けて後半を強く付加する表現であり、日本語では確かな帰結を示す「必ず」と、対応関係を示す「も」で表した。
- source_word: τῆς ἀναστάσεως
  choice: キリストの復活と同じ姿になって
  rationale: 原文では前半の「同じ姿」が省略されているが、対句関係から補うのが自然である。αὐτοῦも反復されないものの、指示対象がキリストの復活であることを日本語で明示した。
- source_word: ἐσόμεθα
  choice: キリストと一つに結ばれる
  rationale: 原文は直訳すれば「私たちは…のものとなる／…であるだろう」だが、述語内容は前半のσύμφυτοιから補われる。日本語で文意が明瞭になるよう反復した。
theological_decisions:
- issue: キリストとの結合を、秘跡的・神秘的・比喩的な意味のいずれかに限定するか
  choice: 「キリストと一つに結ばれた」とし、結合のあり方をそれ以上説明しない
  alternative: 「洗礼によってキリストと一体になった」または「キリストの歩みに倣った」
  rationale: 本文はキリストへの現実的な参与を語る一方、「同じ姿」という限定も置いている。翻訳ではその緊張を保ち、結合がどのように成立するかについて特定の教理的説明を加えなかった。
- issue: 復活への参与を現在的なものと将来的なもののどちらに限定するか
  choice: 未来形に従って「結ばれる」とした
  alternative: 「今すでに復活の命に生きている」または「終末の日にのみ復活する」
  rationale: ἐσόμεθαの未来性を保持しつつ、この一節だけで参与の時期や範囲を狭く規定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、パウロの対句構造と「死／復活」「同じ姿」の対応を保った。「一つに結ばれる」は日常的に理解でき、同時に本文の荘重さを損なわない表現とした。
