id: ROM.6.4
reference: Romans 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: ja
  text: ですから、私たちは洗礼を通してメシアとともに死へと葬られました。それは、メシアが御父の栄光によって死者の中からよみがえらされたように、私たちもまた、いのちの新しさにあって歩むためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετάφημεν
  choice: この方とともに葬られました
  rationale: アオリスト受動態と συν- の共同性を保ちつつ、現代日本語として自然に表現した。αὐτῷは原文どおり指示表現で受けた。
- source_word: οὖν
  choice: ですから
  rationale: 前節までの議論から導かれる推論を、明瞭な現代日本語で示す。
- source_word: διὰ τοῦ βαπτίσματος
  choice: 洗礼を通して
  rationale: 属格を伴う διά の手段的意味を保ち、洗礼の働きについて特定の教派的理解を訳文に付加しない。
- source_word: εἰς τὸν θάνατον
  choice: 死へと
  rationale: εἰς の方向性を保ち、単に『死に際して』ではなく、死へ入るという表現を反映した。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的を表す接続を自然な日本語で明示した。
- source_word: Χριστὸς
  choice: メシア
  rationale: Χριστόςの称号としての意味を明確に伝えるため、『メシア』とした。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 複数形 νεκρῶν と ἐκ の『中から』という意味を明示した。
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: 御父の栄光によって
  rationale: διά の手段的用法と δόξα の意味を保ち、『力』などに狭めなかった。
- source_word: ἐν καινότητι ζωῆς
  choice: いのちの新しさの中を
  rationale: 抽象名詞 καινότης を保ち、『新しい人生』という平板な言い換えを避けた。
- source_word: περιπατήσωμεν
  choice: 歩む
  rationale: 生き方を歩みにたとえるパウロの比喩を保持した。
theological_decisions:
- issue: διὰ τοῦ βαπτίσματοςが洗礼について特定の秘跡論を意味するように訳すか
  choice: 洗礼を通して
  alternative: 洗礼によって
  rationale: 文法上の手段性は伝えながら、洗礼とメシアとの結合の関係について、原文以上に特定の教派的結論を強調しない。
- issue: διὰ τῆς δόξης τοῦ πατρόςにおける『栄光』を『力』と説明的に訳すか
  choice: 御父の栄光によって
  alternative: 御父の力によって
  rationale: 栄光が力を含み得るとしても、原語の豊かな意味と神学的緊張を狭めず、そのまま保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。『葬られました』『よみがえらされた』によって受動態を保ち、『歩む』によって原文の比喩を残した。英語相談層の脚注『Or Christ』は、提示位置およびギリシア語本文に対応する根拠が不明確なため採用しなかった。
