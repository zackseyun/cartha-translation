  text: ὃ γὰρ ἀπέθανεν, τῇ ἁμαρτίᾳ ἀπέθανεν ἐφάπαξ· ὃ δὲ ζῇ, ζῇ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: ja
  text: なぜなら、キリストが死なれたのは、罪に対して[a]、ただ一度限り死なれたのであり、生きておられるのは、神に対して生きておられるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪のために」、または「罪との関わりにおいて」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: というのも、キリストが死なれたその死は
  rationale: 中性関係代名詞ὃと反復される動詞が死という出来事を指すギリシア語の言い回しを、「死なれたその死」として日本語で明確にした。γάρは前節への説明を示すため「というのも」とした。主語は文脈上キリストであり、日本語での明瞭さのため補った。
- source_word: τῇ ἁμαρτίᾳ ἀπέθανεν
  choice: 罪に対して死なれた
  rationale: 与格を関係・方向性として取り、後半の「神に対して」との対照を保持する。「罪のために」という可能性は脚注に残した。
- source_word: ἐφάπαξ
  choice: ただ一度
  rationale: 一回限りの決定的な出来事であることを、自然で簡潔な現代日本語で表す。
- source_word: ὃ δὲ ζῇ
  choice: しかし、今生きておられるその命は
  rationale: 前半との死と命の並行を保ち、現在形ζῇの継続的な生を「今生きておられる」と表した。δέの対照は「しかし」で示した。
- source_word: ζῇ τῷ θεῷ
  choice: 神に対して生きておられる
  rationale: τῷ θεῷを関係・方向性の与格として訳し、「罪に対して」との意図的な対照を保持した。
theological_decisions:
- issue: τῇ ἁμαρτίᾳがキリスト自身に罪があったことを示すように読まれ得るか
  choice: 罪に対して
  alternative: 罪のために／罪との関わりにおいて
  rationale: 本文ではパウロの「罪に対して／神に対して」という緊張を保ち、キリストの個人的罪を示すという説明も、それを否定する説明的言い換えも本文へ持ち込まない。別の与格理解は脚注で示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。キリストへの敬語として「死なれた」「生きておられる」を用いた。脚注記号は、節全体に関わる訳語の別案として文末に置いた。
