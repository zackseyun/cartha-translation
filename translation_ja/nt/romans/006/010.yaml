revisions:
- from: というのも、キリストが死なれたその死は、ただ一度、罪に対して死なれたものだからです。しかし、今生きておられるその命は、神に対して生きておられるものです。[a]
  to: なぜなら、キリストが死なれたのは、罪に対して[a]、ただ一度限り死なれたのであり、生きておられるのは、神に対して生きておられるのです。
  rationale: γάρは「なぜなら」として前節への説明を明示した。ὃ γὰρ ἀπέθανεν／ὃ δὲ ζῇの並行は、「死なれたのは／生きておられるのは」という自然な日本語の対句で再現した。τῇ ἁμαρτίᾳとτῷ θεῷの対照は本文で「罪に対して／神に対して」と保持し、前者の別解は該当箇所に脚注を置いた。ἐφάπαξは「ただ一度限り」として、その一回的・非反復的な意味を表した。
