id: ROM.6.23
reference: Romans 6:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: ja
  text: 罪が支払う報酬は死です。しかし、神の賜物[a]は、私たちの主メシア・イエスにある永遠のいのちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恵みの賜物」とも訳せます。
    reason: χάρισμαには、恵みによって無償で与えられるものという含みがあるため。
lexical_decisions:
- source_word: ὀψώνια
  choice: 報酬
  rationale: 働きなどに対して支払われるものを表し、罪によって得るものと神から無償で与えられるものとの対比を明確に保つ。属格を単に「罪の報酬」とせず「罪が支払う報酬」として、自然な日本語で比喩を示した。
- source_word: ἁμαρτίας
  choice: 罪が支払う
  rationale: 属格は、罪に属する報酬、または罪が支払う報酬という関係を表す。後者を本文に採り、罪が報酬を支払う主体であるかのようなパウロの比喩を明瞭にした。
- source_word: θάνατος
  choice: 死
  rationale: 死の種類を本文で限定せず、原文の簡潔さと神学的な広がりを保つ。
- source_word: χάρισμα
  choice: 賜物
  rationale: 恵みによって無償で与えられるものを表す語。「報酬」との対比を保ちつつ、簡潔で聖書文体として定着した現代日本語を用いた。
- source_word: ζωὴ αἰώνιος
  choice: 永遠のいのち
  rationale: 時間的な永続性と神学的な含意をともに保つ、自然で定着した訳語。
- source_word: ἐν
  choice: にある
  rationale: 単なる手段を示す「によって」に狭めず、キリストを領域または結びつきとして示すパウロ的表現の幅を保つ。
- source_word: Χριστῷ Ἰησοῦ
  choice: キリスト・イエス
  rationale: Χριστόςの称号性を保ちながら、日本語の新約聖書で自然かつ広く理解される語順と表記を採った。
- source_word: κυρίῳ ἡμῶν
  choice: 私たちの主
  rationale: 初期キリスト教の告白的な重みを保ち、現代標準語として明瞭に訳した。
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ の意味合い
  choice: 「キリスト・イエスにある」
  alternative: 「キリスト・イエスによって」
  rationale: 原文は手段だけでなく、キリストとの結びつきやその領域を表し得る。「にある」とすることで、その神学的な幅を狭めずに保った。
- issue: θάνατος が指す死の範囲
  choice: 限定せず「死」
  alternative: 「永遠の死」または「霊的な死」
  rationale: 原文自体は修飾を付けていないため、特定の神学的説明を本文に持ち込まなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「です」で二つの対照項をそろえた。「いのち」は神学的な響きと一般読者への読みやすさを両立するため、ひらがな表記とした。
