id: ROM.14.13
reference: Romans 14:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: ja
  text: ですから、もう互いに裁くのはやめましょう。むしろ、兄弟[a]の前に妨げとなるものや、つまずかせるもの[b]を置かない、と決めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」または「信仰の仲間」とも訳せる。ギリシア語は単数の「兄弟」だが、ここでは同じ信仰に属する人を指す。
    reason: alternative_reading
  - marker: b
    text: 「わな」または「つまずきの原因」とも訳せる。単に相手の感情を害するものではなく、相手の信仰や行いをつまずかせるものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: ですから、もう……のはやめましょう
  rationale: οὖνの推論的なつながりを「ですから」で示し、Μηκέτιと勧告の接続法を、継続中の行為をやめるよう促す自然な日本語で表した。
- source_word: ἀλλήλους κρίνωμεν
  choice: 互いに裁くのはやめましょう
  rationale: 相互性と勧告の語調を保つ。「裁く」は後半のκρίνατεとの語の反復もある程度伝える。
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: むしろ……と決めなさい
  rationale: 同じκρίνωが後半では他人への裁断でなく、自分の行動についての決断を指すため「決める」とした。μᾶλλονは「むしろ」で保持した。
- source_word: τὸ μὴ τιθέναι
  choice: ……を置かない、と
  rationale: 定冠詞付き不定詞が決断の内容を示す構造を、引用内容に近い日本語で表した。
- source_word: πρόσκομμα
  choice: つまずきとなるもの
  rationale: 他者の信仰上・倫理上の歩みを妨げるという比喩を、現代日本語で理解しやすく保った。
- source_word: τῷ ἀδελφῷ
  choice: 兄弟の前に
  rationale: 男性単数形を本文では「兄弟」とし、同じ信仰に属する人を代表的に指すことを注で明示した。与格はτιθέναιとの関係から「前に」と訳した。
- source_word: ἢ σκάνδαλον
  choice: や、罪に陥らせるもの
  rationale: ἢの選言性を日本語の並列「や」で自然に表し、σκάνδαλονが単に感情を害することではなく、罠となって罪や信仰上の転倒へ導くものを指すことを明確にした。
theological_decisions:
- issue: ἀδελφῷの代表的男性単数
  choice: 兄弟
  alternative: 兄弟姉妹／信仰の仲間
  rationale: 原文の男性単数を本文に反映しつつ、文脈上は男女を問わず同じ信仰に属する人を指し得ることを脚注で示した。
- issue: σκάνδαλονの倫理的・霊的意味
  choice: 罪に陥らせるもの
  alternative: 罠／つまずきとなるもの／害となるもの
  rationale: πρόσκομμαとの重なりを保ちながら、現代語で誤解されやすい単なる「不快感」ではなく、相手を罪や信仰上の転倒へ導く意味を明示した。二語が厳密に別種のものかどうかは断定していない。
- issue: κρίνωの反復と意味の転換
  choice: 裁く／決める
  alternative: 裁く／判断する
  rationale: ギリシア語の修辞的反復を完全には再現できないが、前半の対人的な裁断と後半の自己の行動についての決断という意味の転換を自然な日本語で伝えた。
translation_notes:
  register: 明快で格調を保った現代標準日本語。前半は共同体全体への勧告として「やめましょう」、後半は各人への決断の促しとして「決めなさい」とした。二つの比喩的名詞の近接性は保ちつつ、同語反復を避けて意味を明瞭にした。
