revisions:
- from: しかし、あなたはなぜ自分の兄弟[a]を裁くのですか。また、あなたも、なぜ自分の兄弟を見下すのですか。私たちは皆、神[b]の裁きの座の前に立つことになるのです。
  to: しかし、あなたはなぜ自分の兄弟[a]を裁くのですか。あるいは、あなたも、なぜ自分の兄弟を見下すのですか。なぜなら、私たちは皆、神[b]の裁きの座の前に立つことになるからです。
  rationale: 原文のἢを「あるいは」とし、γάρを「なぜなら」で表して、二つの修辞質問の対照と結論の根拠関係を明確にした。それ以外の本文と脚注は、原文への忠実さ、自然さ、異読の扱いの点で維持できる。英語監査資料では脚注記号と注内容が入れ替わっているが、日本語案の脚注配置は正しい。
