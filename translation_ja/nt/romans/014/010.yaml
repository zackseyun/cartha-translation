id: ROM.14.10
reference: Romans 14:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: ja
  text: しかし、あなたはなぜ自分の兄弟[a]を裁くのですか。あるいは、あなたも、なぜ自分の兄弟を見下すのですか。なぜなら、私たちは皆、神[b]の裁きの座の前に立つことになるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」または「同じ信仰を持つ人」とも理解できる。ギリシア語は単数形で「兄弟」。
    reason: lexical_alternative
  - marker: b
    text: 一部の写本は「キリスト」とする。
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: しかし、あなたは
  rationale: δέの対照的な働きと、文頭のσύによる「あなた」への強調を、自然な現代日本語で保った。
- source_word: τί κρίνεις
  choice: なぜ……裁くのですか
  rationale: 修辞疑問におけるτίを「なぜ」とし、κρίνωは文脈を越えて「罪に定める」と限定せず「裁く」とした。
- source_word: τὸν ἀδελφόν σου
  choice: 自分の兄弟
  rationale: 男性単数形ἀδελφόνを本文では直接的に「兄弟」と訳した。この文脈では同じ信仰共同体の成員を指し得ることを脚注で示した。
- source_word: ἢ καὶ σὺ
  choice: また、あなたも
  rationale: 二つ目の問いへの移行と、καίの付加的な意味、σύの強調を保った。
- source_word: τί ἐξουθενεῖς
  choice: なぜ……見下すのですか
  rationale: ἐξουθενέωの「取るに足りない者として扱う」という軽蔑の意味を、明快で自然な現代語の「見下す」で表した。
- source_word: πάντες γὰρ
  choice: 私たちは皆
  rationale: πάντεςがパウロ自身と読者を含むことを明示し、γάρの説明的関係は前後の自然なつながりによって表した。
- source_word: παραστησόμεθα
  choice: 前に立つことになる
  rationale: 法廷に出て立つという未来の意味を保ち、日本語として自然にした。
- source_word: τῷ βήματι
  choice: 裁きの座
  rationale: βῆμαの法廷・審判者席という司法的な比喩を保つ、定着した明瞭な表現を選んだ。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: SBLGNT本文の属格をそのまま訳し、異読は脚注に置いた。
theological_decisions:
- issue: すべての人がその裁きの座の前に立つ方の同定
  choice: 神
  alternative: キリスト
  rationale: 提示されたSBLGNT本文はτοῦ θεοῦ（「神の」）と読むため本文ではそれに従った。一部写本の「キリストの」という異読は、本文を調和させず脚注に保存した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、修辞疑問の厳粛さと法廷の比喩を保った。「見下す」は日常的に理解しやすい一方、原語の強い軽蔑の意味にも対応する。
