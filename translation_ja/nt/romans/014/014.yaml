  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἶδα καὶ πέπεισμαι ἐν κυρίῳ Ἰησοῦ ὅτι οὐδὲν κοινὸν δι’ ⸀ἑαυτοῦ· εἰ μὴ τῷ λογιζομένῳ τι κοινὸν εἶναι, ἐκείνῳ κοινόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: ja
  text: 私は主イエスにあって、知っており、確信しています。どんなものも、それ自体で汚れたもの[a]ではありません。しかし、何かを汚れたものとみなす人にとっては、それは汚れたものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚れたもの」と訳したギリシア語は、字義的には「共通の」を意味します。ここでは、聖なるものと区別されたもの、すなわち儀礼的に俗なもの、または汚れたものを指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: 知り
  rationale: 単純な認識を表す動詞として自然な「知る」を用い、後続のπέπεισμαιと並列させた。
- source_word: πέπεισμαι
  choice: 確信しています
  rationale: 完了形が示す、すでに形成され現在も続く確固たる確信を、現代日本語で自然に表す。
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: 主イエスにあって
  rationale: ἐνの関係を「主イエスによって」などと限定せず、パウロ書簡にふさわしい簡潔で荘重な表現を保つ。
- source_word: κοινόν
  choice: 汚れている／汚れたもの
  rationale: 食物と清浄規定をめぐる文脈では、単なる「共通の」ではなく、宗教的に俗なもの、汚れたものと見なされる意味を持つため。語の字義的背景は脚注で示す。
- source_word: δι’ ἑαυτοῦ
  choice: それ自体で
  rationale: 内在的・本来的な性質について述べる慣用句として、原文の表現に近く自然な日本語を採った。
- source_word: τῷ λογιζομένῳ
  choice: 考える人にとっては
  rationale: λογίζομαιの「～と見なす、判断する」という認識上の働きを明瞭に表す。
- source_word: τι
  choice: 何かを
  rationale: 一般的な不定対象を示す原文に対応する自然な表現。
- source_word: ἐκείνῳ κοινόν
  choice: それは汚れたものなのです
  rationale: 直前の「その人にとっては」を受け、当人に関してそうなるという個別的な効力を明示する。
theological_decisions:
- issue: κοινόςと食物・清浄の関係
  choice: 本文では「汚れている」と訳し、何ものも本来的に汚れてはいないが、そう判断する人にとっては汚れたものとなる、という緊張を保った。
  alternative: 「俗なもの」「普通のもの」
  rationale: この文脈でκοινόςは儀礼的に清くない、あるいは聖別されていないという意味で用いられている。「汚れたもの」が現代の一般読者に意味を最も明瞭に伝える一方、その判断が対象の本質ではなく当人との関係に属することを訳文の構造で保持した。
- issue: ἐν κυρίῳ Ἰησοῦが示す関係
  choice: 「主イエスにあって」とし、確信が主との関係のうちにあることを表した。
  alternative: 「主イエスによって」
  rationale: 手段・啓示源と限定して解釈せず、原文のἐνが持つ幅を残すため。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、「主イエスにあって」で書簡にふさわしい品位を保った。「私は、主イエスにあって知り、確信しています」は原文の二つの動詞の並列を保持する。脚注記号[a]は対象語の初出に近づけると文意を遮るため、節末に置いた。
