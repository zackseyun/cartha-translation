id: ROM.14.8
reference: Romans 14:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: ja
  text: というのも、私たちは、生きるなら主のために生き[a]、死ぬなら主のために死ぬからです。ですから、生きるにしても死ぬにしても、私たちは主のものです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主に向けて生き、主に向けて死ぬ」とも訳せる。ギリシア語の与格は、主との関係、主への方向づけ、また主のためという意味を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「私たちは主に属しています」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: というのも、……なら
  rationale: γάρの説明的なつながりを「というのも」で示し、ἐάν τεが導く対応する二条件を「……なら」で自然に表した。
- source_word: ζῶμεν / ζῶμεν
  choice: 生きる／生きる
  rationale: 条件節と帰結節の双方でζάωを一貫して「生きる」とし、一般的な生のあり方を表した。
- source_word: τῷ κυρίῳ
  choice: 主に対して
  rationale: 与格が示し得る関係、方向づけ、利益の幅を不必要に一つへ限定せず、反復される構文も保った。「主のために」も可能だが、目的・利益の意味にやや狭まりやすい。
- source_word: κύριος
  choice: 主
  rationale: 文脈上は主イエスを指すと考えられるが、原文どおり称号「主」を保ち、本文で指示対象を過度に明示しなかった。
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: 死ぬ／死ぬ
  rationale: 一般的な死の事実を表す現在形として、簡明に「死ぬ」と訳した。
- source_word: οὖν
  choice: ですから
  rationale: 先行する二つの対応節から導かれる結論を、現代日本語の明確な推論表現で示した。
- source_word: τοῦ κυρίου ἐσμέν
  choice: 私たちは主のものです
  rationale: 属格を所有・帰属として自然に表し、簡潔で力のある結論とした。
theological_decisions:
- issue: κύριοςの指示対象と称号としての力
  choice: 「主」とし、本文ではそれ以上特定しない
  alternative: 「主イエス」または権威を強調する「主人」
  rationale: 直後の14:9はキリストを指し示すが、この節自体はκύριοςとのみ述べる。称号をそのまま保つことで、文脈上のキリスト論的な指示と聖書的な響きの双方を残した。
- issue: 主に生き、主に死ぬという与格の関係的含意
  choice: 「主に対して」と訳し、主への方向づけと関係を広く保つ
  alternative: 「主のために」と訳し、奉仕・利益を前面に出す
  rationale: 反復される与格と、末尾の「主のもの」という帰属表現を合わせて読むと、奉仕だけでなく、主との関係、主への方向づけ、主への帰属が含まれる。単一の含意に狭めなかった。
- issue: τοῦ κυρίου ἐσμένの帰属表現
  choice: 「私たちは主のものです」
  alternative: 「私たちは主に属しています」
  rationale: 所有を示す属格の強さを簡潔に保つ。「属しています」は意味を明確にするが、原文の短く断定的な形からやや説明的になる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「主に対して」は日常語よりやや改まった表現だが、原文の与格が持つ幅と二つの節の反復を保持するため採用した。
