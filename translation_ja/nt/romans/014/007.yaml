  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: ja
  text: というのは、私たちのうち、だれ一人、自分のために生きる者はなく、自分のために死ぬ者もいない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分に対して」とも訳せる。ギリシア語は字義的には反射代名詞の与格だが、ここでは、生きることや死ぬことの究極の目的を自分自身に置く、という意味と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς ... ἡμῶν
  choice: 私たちのうち、だれ一人……ない
  rationale: 部分属格を伴う全否定を、自然な日本語で明確に表し、二つの節に及ぶ並行性を保つ。
- source_word: γὰρ
  choice: （独立した接続語としては訳出しない）
  rationale: 14章全体、とりわけ直前の節を受ける説明・根拠の働きは日本語の文脈と語順で十分伝わり、「というのは」などを置くより自然である。
- source_word: ἑαυτῷ
  choice: 自分のために
  rationale: 与格の反射代名詞が示す、自分自身を生と死の目的・基準とする含意を自然に表す。ただし「自分に対して」という、より字義的な理解の余地は脚注に残す。
- source_word: ζῇ
  choice: 生きる
  rationale: 一般的・格言的な現在時制を、日本語の非過去形で表す。
- source_word: καὶ
  choice: ……も
  rationale: 否定の並行節を日本語として自然につなぎ、「生きる」と「死ぬ」の双方を同じ否定の下に置く。
- source_word: ἀποθνῄσκει
  choice: 死ぬ
  rationale: 一般的真理を述べる現在時制を簡潔な非過去形で表し、「生きる」との対照を保つ。
theological_decisions:
- issue: 二度の反射代名詞与格 ἑαυτῷ の意味
  choice: 自分のために
  alternative: 自分に対して／自分自身を目的として
  rationale: 次節で明示される「主のために」との対照を踏まえ、生と死が自己を究極の目的・基準としてはいないという方向性を表す。同時に、与格自体の幅を脚注で示し、意味を過度に限定しない。
- issue: 単数男性形の一般的用法
  choice: だれ一人／自分
  alternative: 彼自身
  rationale: ギリシア語の男性単数形はここで一般的に用いられている。日本語では性別を付加しない「だれ一人」「自分」が、数の個別性と包括性を自然に保つ。
translation_notes:
  register: 明瞭で現代的かつ端正な標準語。「だれ一人……者はなく、……者もいない」により原文の全否定と二節の並行を保った。脚注記号は該当文末に置き、両方の ἑαυτῷ に関わる注であることを示した。
