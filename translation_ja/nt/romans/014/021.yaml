  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: ja
  text: 肉を食べることも、ぶどう酒を飲むことも、また、あなたの兄弟[a]がつまずいたり、つまずかされたり、弱くなったりするようなことも、しないほうがよいのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟」は、文脈上、姉妹を含む仲間の信者を指し得ます。
    reason: lexical_alternative
  - marker: b
    text: 「つまずかされたり、弱くなったり」に当たる語句を含まないギリシャ語写本もあります。
    reason: textual_variant
lexical_decisions:
- source_word: καλὸν
  choice: よいのです
  rationale: ここでは、その行動が道徳的にふさわしく、望ましいことを表す。現代日本語として自然であり、評価の幅も保つ。
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: 肉を食べることも……しない
  rationale: 冠詞付き不定詞が表す行為を名詞的に訳し、否定は文末の「しない」にまとめて日本語として自然にした。κρέαは食物としての肉を指す。
- source_word: μηδὲ πιεῖν οἶνον
  choice: ぶどう酒を飲むことも……しない
  rationale: μηδέによる並列的な自制を「も……しない」で表した。「ぶどう酒」はοἶνοςを明確かつ一般的に示す。
- source_word: μηδὲ ἐν ᾧ
  choice: また……するようなことも、しない
  rationale: ギリシャ語では動作が省略された表現であるため、日本語では「こと」を補い、仲間に害を及ぼすあらゆる行為を指すことが分かるようにした。
- source_word: ὁ ἀδελφός σου
  choice: あなたの兄弟
  rationale: 男性単数形を本文に保った。文脈上はキリストを信じる仲間を代表的に指し、女性も含み得ることを脚注で示した。
- source_word: προσκόπτει
  choice: つまずいたり
  rationale: 何かにぶつかるという原義から生じた、信仰上・倫理上の妨げを受ける比喩を自然に保つ。
- source_word: σκανδαλίζεται
  choice: 罪に陥ったり
  rationale: 受動形が表す、わなや誘惑によって誤った行動へ導かれる意味を示し、直前の「つまずく」と完全に重複させないようにした。
- source_word: ἀσθενεῖ
  choice: 弱くなったり
  rationale: この文脈では身体的な病気ではなく、良心や信仰の面で弱くなることを指すが、本文では限定しすぎず原語の広さを残した。
theological_decisions:
- issue: ἀδελφόςの代表的・包括的な用法
  choice: 本文は「あなたの兄弟」とし、脚注で姉妹を含み得ることを示す
  alternative: 「仲間の信者」または「兄弟姉妹」
  rationale: 原文の男性単数形を保ちながら、ローマ14章の文脈では性別を問わず仲間の信者を指し得ることも明示するため。
- issue: προσκόπτει、σκανδαλίζεται、ἀσθενεῖの関係
  choice: 「つまずく」「罪に陥る」「弱くなる」と三つの表現を区別する
  alternative: 三語をまとめて「信仰を損なう」とする
  rationale: 意味の重なりを認めつつ、原文が並べる三つの動詞と、その神学的・倫理的な緊張を一語に解消しないため。
translation_notes:
  register: 明快な現代標準日本語を用いながら、勧告としての落ち着きと品位を保った。列挙は「も……も……も、しない」とし、禁令よりも自発的な配慮を勧める原文の調子を表した。
