  terminology: 「ぶどう酒」「兄弟」は適切である。「つまずく」と受動の「つまずかされる」により、προσκόπτει と σκανδαλίζεται の近接しつつ異なる形を不自然に神学用語化せずに表せる。兄弟の包括的な文脈を示す脚注も適切である。
