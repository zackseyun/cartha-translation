source:
  edition: SBLGNT
  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: ja
  text: しかし、疑いを抱く人が食べるなら、その人は罪に定められています。それが信仰[a]から出たことではないからです。信仰から出ていないことはすべて、罪です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「確信に基づくものではない」。ギリシア語は「信仰から」といい、神の前で確かな信念をもって行動するという意味を含み得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: 疑いながら…人
  rationale: 食べることへの内面的な迷いやためらいを表す文脈なので、他者との論争ではなく、本人が疑念を抱いていることが自然に伝わる表現とした。
- source_word: ἐὰν φάγῃ
  choice: 食べる
  rationale: ἐάνを伴うアオリスト接続法の条件的意味を、前の分詞と合わせて自然な日本語の「疑いながら食べる人は」で表した。
- source_word: κατακέκριται
  choice: 罪に定められます
  rationale: 完了受動形が示す、行為の結果として有罪とされる状態を表す。受動の主体は原文どおり特定しない。
- source_word: ὅτι
  choice: からです
  rationale: 罪に定められる理由を明確に示す、現代日本語として自然な因果表現。
- source_word: ἐκ πίστεως
  choice: 信仰から出た／信仰から出ていない
  rationale: ἐκの起点・源泉の比喩と、パウロにおける πίστις の語彙的・神学的広がりを保つ。「確信に基づく」という文脈上の含意は脚注に示す。
- source_word: πᾶν ... ὃ
  choice: …ことは、すべて
  rationale: 中性単数の包括的表現を、明瞭で自然な日本語として再現する。
- source_word: ἁμαρτία ἐστίν
  choice: 罪です
  rationale: 形容詞的な「罪深い」ではなく、述語名詞による原文の断定的な表現を保つ。
theological_decisions:
- issue: 道徳的文脈における πίστις の訳
  choice: 信仰
  alternative: 確信、信頼、忠実
  rationale: この文脈では神の前での確信を含むが、「確信」だけに狭めず、パウロのより広い神学的語彙とのつながりを保つため「信仰」とした。文脈上の含意は脚注で補う。
- issue: κατακέκριται における有罪判定の主体
  choice: 罪に定められます
  alternative: 自らを罪に定めることになります／神の前で罪に定められます
  rationale: ギリシア語の受動形は行為主体を明示しないため、神の裁きか良心による自己断罪かを訳文で限定せず、原文の神学的緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保った敬体。原文の因果関係を読み取りやすくするため二文に分け、ἐκ πίστεως は一貫して「信仰から出る」と訳した。
