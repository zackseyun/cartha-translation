  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: ja
  text: ですから、あなたがたの良いことが悪く言われないようにしなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そしられないようにしなさい」「中傷されないようにしなさい」。原語は、侮辱的または名誉を傷つける言葉を口にすることを表す。字義的には「冒涜される」とも訳せるが、ここでは対象が神ではなく「良いこと」である。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ... βλασφημείσθω
  choice: 悪く言われないようにしなさい
  rationale: μήを伴う現在受動命令の禁止を、自然な現代日本語で表した。βλασφημέωはここでは神への冒瀆に限定されず、悪く言う、そしるという意味なので、「冒瀆される」ではなく「悪く言われる」とした。
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論から導かれる帰結を示す推論接続詞として、明確で自然な表現を選んだ。
- source_word: ὑμῶν τὸ ἀγαθόν
  choice: あなたがたにとって良いもの
  rationale: 属格ὑμῶνと名詞的に用いられた中性形τὸ ἀγαθόνの簡潔さを保ちつつ、日本語として意味が通る形にした。文脈上の指示対象を「自由」や「権利」に限定していない。
theological_decisions:
- issue: 「あなたがたの良いもの」（ὑμῶν τὸ ἀγαθόν）の指示対象
  choice: 「あなたがたにとって良いもの」と広く訳す
  alternative: 「あなたがたの自由」「あなたがたの権利」「あなたがたの良い証し」
  rationale: ギリシア語は指示対象を明示しておらず、論争のある事柄について信者が有する確信や自由、それに伴う益などを含み得る。特定の解釈に狭めず、原文の簡潔さと神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、勧告としての品位を保った。「ですから」で前節との論理的つながりを示し、「良いもの」の曖昧さは意図的に保持した。
