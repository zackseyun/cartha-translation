source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: ja
  text: その日を重んじる人は、主のために重んじます。食べる人は、主のために食べます。神に感謝するからです。また、食べない人は、主のために食べず、神に感謝します。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φρονῶν / φρονεῖ（φρονέω）
  choice: 重んじる／重んじています
  rationale: 単に心の中で考えることではなく、ある日を特別に意識し、顧みるという文脈上の意味を表す。「守る」より意味を限定せず、実際的な尊重も伝える。
- source_word: τὴν ἡμέραν
  choice: その日
  rationale: 定冠詞のある表現を、直前の議論で問題となっている特定の日を指す自然な日本語として訳した。安息日、祭日、断食日などとは特定しない。
- source_word: κυρίῳ
  choice: 主のために
  rationale: 行為が主を目当てとし、主に向けてなされることを自然な日本語で示す。「主に対して」も可能だが、ここでは目的・志向を明瞭にする。
- source_word: ὁ ἐσθίων / ἐσθίει
  choice: 食べる人／食べています
  rationale: 食物をめぐる継続的・習慣的な実践を表し、後半の「食べない人」との並行を保つ。
- source_word: εὐχαριστεῖ τῷ θεῷ
  choice: 神に感謝している／神に感謝しています
  rationale: 感謝の向かう相手を明示し、現在形が表す実際の行為・姿勢を自然に表現する。
- source_word: ὁ μὴ ἐσθίων
  choice: 食べない人
  rationale: 否定された分詞を直接的に訳し、「食べる人」との対照と原文の反復を保つ。
theological_decisions:
- issue: 「その日を重んじる」の具体的な対象
  choice: ローマ14章で問題となっているある日を一般的に指す表現として保持する
  alternative: 安息日、ユダヤの祭日、または断食日を特定して指すと解する
  rationale: 原文はἡμέραとだけ述べており、どの日かを明示していない。訳文でも特定の慣行に限定せず、意図的な幅を保つ。
- issue: κύριοςの指示対象
  choice: 「主」と訳す
  alternative: 「神」と明示する
  rationale: この文脈のパウロ書簡用法では主イエスを指すのが自然だが、訳文は原語どおり「主」を保持する。一方、感謝の相手は原文に従い「神」とする。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、反復と対句をできるだけ保持した。「守る」は特定の宗教規定の遵守を強く連想させうるため避け、「重んじる」とした。
