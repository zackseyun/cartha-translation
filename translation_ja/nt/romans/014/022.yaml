id: ROM.14.22
reference: Romans 14:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: ja
  text: あなたが持っている信仰[a]は、自分だけのものとして、神の前で保ちなさい。自分がよいと認める事柄について、自分を裁かない人は幸いです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたが持っている確信」。ここで「信仰」は、論争のある事柄についての個人的な確信を指すことができます。
    reason: lexical_alternative
  - marker: b
    text: 「自分を裁かない」は、「自分を罪に定めない」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: 信仰
  rationale: 通常の訳語「信仰」を保ちつつ、この文脈では論争のある事柄について神の前で抱く個人的な確信を指しうる。別訳を脚注に示す。
- source_word: κατὰ σεαυτὸν
  choice: 自分自身のうちに
  rationale: 自らの確信を他者に押しつけず、自分の内に保つという文脈上の意味を表す。「自分だけのものとして」も可能だが、原文の表現により近い訳を採った。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の前で
  rationale: 神に対する責任と、神の御前でその確信を保つという含意を簡潔に保持する。
- source_word: μακάριος
  choice: 幸いです
  rationale: 単なる主観的な幸福ではなく、神の前での恵まれた状態を表す聖書的な語調を保つ。
- source_word: κρίνων ἑαυτὸν
  choice: 自分を裁かない
  rationale: κρίνω の基本的な幅を保つ。「罪に定めない」という強い意味も文脈上可能なので脚注に残す。
- source_word: ἐν ᾧ δοκιμάζει
  choice: 自分がよいと認めることによって
  rationale: δοκιμάζω を、吟味したうえで是認する意味の「よいと認める」とした。ἐν はここでは手段・根拠に近い働きとして訳した。
theological_decisions:
- issue: 倫理上の論争事項という文脈における πίστις の意味
  choice: 本文では「信仰」とし、当該事項について神の前で抱く個人的な確信を含ませる
  alternative: 「確信」
  rationale: 直前からの文脈は食物などの論争事項と良心を扱うため、救いに至る信仰だけを指すとは限定できない。一方、重要語 πίστις の通常訳を本文で保ち、文脈的な別の意味を脚注で明示する。
- issue: κρίνων の強さ
  choice: 裁く
  alternative: 罪に定める
  rationale: 語の意味上どちらも可能であり、本文では広い「裁く」を採用する。自らの是認した行為によって良心の呵責や自己断罪に至る含意は、別訳として脚注に示す。
translation_notes:
  register: 現代の標準的な日本語で、勧告の厳粛さを保った。「自分自身のうちに保ちなさい」はやや改まった表現だが、κατὰ σεαυτόν と ἐνώπιον τοῦ θεοῦ を混同せず、個人的な確信と神の前での責任を区別して伝える。
