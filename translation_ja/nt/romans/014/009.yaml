id: ROM.14.9
reference: Romans 14:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: ja
  text: というのも、メシアはこのために死に、再び生きた[a]。すなわち、死んだ者たちと生きている者たちの両方を支配するためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「生きた」。文脈上、死後に再び生きたことを指す。「よみがえった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: このために
  rationale: 目的・目標を示す慣用句として簡潔で自然な日本語にした。後続のἵνα節がその目的の内容を明らかにする。
- source_word: γὰρ
  choice: 実に
  rationale: 前節を根拠づける説明の接続を示す。日本語では独立した一節としても論証の流れが伝わるよう「実に」とした。
- source_word: Χριστὸς
  choice: メシア
  rationale: Χριστόςの称号としての意味を明示し、固有名詞化した「キリスト」より原語の称号性を保った。
- source_word: ἀπέθανεν
  choice: 死んで
  rationale: 単純な過去の出来事として「死んだ」に相当するが、続くκαὶ ἔζησενとの結合を自然に表すため連用形にした。
- source_word: ἔζησεν
  choice: 再び生きた
  rationale: 字義は「生きた」だが、「死んで」との並列は死後の生、すなわち復活を示唆する。「再び」は文脈上の含意を明瞭にしつつ、「復活した」とまで限定しない。
- source_word: ἵνα
  choice: それは……ためである
  rationale: 目的を示す接続詞の機能を、現代日本語で明確な目的構文として表した。
- source_word: νεκρῶν
  choice: 死んだ者たち
  rationale: 実体詞的な複数形を自然に表し、ζώντωνとの対照を保った。
- source_word: ζώντων
  choice: 生きている者たち
  rationale: 現在分詞の継続的な意味を保ち、νεκρῶνと対になる人物群として訳した。
- source_word: κυριεύσῃ
  choice: 支配する
  rationale: 「主である」ではなく、動詞が表す統治・権威の行使を直接表現した。
theological_decisions:
- issue: ἔζησενの復活との関係
  choice: 「再び生きた」とし、死後の生を示唆する
  alternative: 「生きた」または「復活した」
  rationale: 原語自体は通常の「生きる」だが、「死んで」との連続は復活の文脈を強く示す。「再び生きた」はその含意を伝えながら、原語をより明示的な復活動詞に置き換えない。
- issue: κυριεύσῃのキリスト論的重み
  choice: 「支配する」
  alternative: 「主となる」または「主である」
  rationale: κύριοςとの語彙的関連はあるが、ここでは動詞として死者と生者への支配権を表すため、称号を補うよりも動的な意味を優先した。
- issue: νεκρῶν καὶ ζώντωνの範囲
  choice: 「死んだ者たちと生きている者たち、その両方」
  alternative: 「死者にも生者にも」
  rationale: 二つの集団を包括するκαὶ……καὶの力を明示し、メシアの支配が双方に及ぶという本文の主張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「死者／生者」よりも一般読者に直ちに分かる「死んだ者たち／生きている者たち」を採用し、目的構文は二文に分けて論理関係を明確にした。
