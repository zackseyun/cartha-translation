  text: ὃς μὲν πιστεύει φαγεῖν πάντα, ὁ δὲ ἀσθενῶν λάχανα ἐσθίει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/002.yaml
  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: ja
  text: ある人は何でも食べてよいと信じています[a]が、弱い人[b]は野菜を食べます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何でも食べられると確信しています」。
    reason: lexical_alternative
  - marker: b
    text: ここで「弱い」とは、食物に関する実践についての信仰または良心の弱さを指します（14章1節参照）。
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: ある人は
  rationale: μέν…δέの対照の第一項を、性別を限定せず、現代日本語として自然な代表的単数で表した。
- source_word: πιστεύει
  choice: 信じています
  rationale: ここでは不定詞を伴い、救いに至る信仰そのものではなく、食べることについての信念・確信を表す。語の基本的な対応を保つため「信じています」とした。
- source_word: φαγεῖν πάντα
  choice: 何でも食べてよい
  rationale: πάνταは食物に制限がないことを表す。許容の意味は文脈から含意されるため、日本語として自然な「何でも食べてよい」とした。直訳的には「すべてのものを食べられると確信している」も可能である。
- source_word: ὁ δὲ
  choice: しかし、弱い人は
  rationale: δέによる第二項の対照を「しかし」で明示し、 substantival participle と合わせて自然な日本語にした。
- source_word: ἀσθενῶν
  choice: 弱い人
  rationale: 分詞を名詞的に訳した。何について弱いのかは14章1節の文脈に委ね、この節の本文には「信仰の弱い」を補わなかった。
- source_word: λάχανα
  choice: 野菜
  rationale: 庭で栽培される青物・野菜を指す語であり、現代日本語では「野菜」が最も明瞭である。
- source_word: ἐσθίει
  choice: 食べます
  rationale: 原文は単に食べる対象を述べており、「だけ」は明記されていないため補わなかった。
theological_decisions:
- issue: ἀσθενῶνにおける「弱さ」の性質
  choice: 本文では「弱い人」とし、何について弱いかを明記しない。
  alternative: 「信仰の弱い人」
  rationale: 直前の14章1節は信仰における弱さを示すが、この節自体には限定語がない。原文の簡潔さと文脈による含みを保ち、解釈的な補足は脚注に置いた。
- issue: 野菜食の排他性
  choice: 「野菜を食べます」とし、「野菜だけ」とはしない。
  alternative: 「野菜だけを食べます」
  rationale: 二つの節の対照から排他性は強く含意されるが、μόνονに相当する語は原文にないため、本文で明示しなかった。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文にふさわしい落ち着いた文体と丁寧体を採用した。原文にない「だけ」は加えず、「弱い」の意味も本文では限定しないことで、原文の含みを保った。
