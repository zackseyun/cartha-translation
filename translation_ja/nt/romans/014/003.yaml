  source_fidelity: 原文の対句構造（食べる人／食べない人）と、二つの禁止（ἐξουθενείτω／κρινέτω）、および神がその人を受け入れたことを根拠として示すγάρ節が、過不足なく訳出されている。「その人」はαὐτόνの単数性と、その指示対象に残る文脈上の含みを適切に保っている。
  naturalness: 「食べる人は、食べない人を軽んじてはならない。…神がその人を受け入れたからである」は、明瞭で自然な現代標準日本語であり、戒めとその根拠を示す本文として整っている。「また」は対照的な並行を損なわず、二文に分けた構成も読みやすい。
  terminology: 「軽んじる」はἐξουθενέωの軽蔑・取るに足りないものとみなす意味をよく表す。「裁く」はここでのκρίνωを不必要に「罪に定める」へ狭めない標準的な訳語である。「受け入れた」はπροσλαμβάνομαιの受容の意味を保ち、脚注で「迎え入れた」と交わりの含意を補えている。
