id: ROM.14.3
reference: Romans 14:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: ja
  text: 食べる人は、食べない人を軽んじてはならない[a]。また、食べない人は、食べる人を裁いてはならない[b]。神がその人を受け入れた[c]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見下してはならない」または「侮ってはならない」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「判断を下してはならない」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「迎え入れた」。この語には、交わりの中へ迎えるという意味合いもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: 食べる人
  rationale: 冠詞付き現在分詞を、食べることを特徴とする人を指す自然な日本語で表した。
- source_word: τὸν μὴ ἐσθίοντα
  choice: 食べない人
  rationale: 原文の単純な対比を保ち、何を食べないのかを本文で補足しない表現とした。
- source_word: ἐξουθενείτω
  choice: 軽んじてはならない
  rationale: 相手を取るに足りない者と見なす、侮るという意味を、明瞭で品位ある現代日本語で表した。
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: また、食べない人は
  rationale: δέによる対照は並行する二文で明確なため、「また」で相互的な戒めを自然につないだ。
- source_word: κρινέτω
  choice: 裁いてはならない
  rationale: 仲間に対して判断を下す意味を広く保ち、「罪に定める」と限定しなかった。
- source_word: ὁ θεὸς
  choice: 神が
  rationale: 説明節の主語として明示し、前文との因果関係を自然に示した。
- source_word: γὰρ
  choice: からである
  rationale: 先行する二つの禁止の根拠を示す説明的な接続を文末で表した。
- source_word: αὐτὸν
  choice: その人を
  rationale: 単数代名詞を保ちつつ、性別を不必要に前面に出さない自然な日本語とした。指示対象の含みは解消していない。
- source_word: προσελάβετο
  choice: 受け入れた
  rationale: 受容および交わりへ迎える含意を持つ語として簡潔に訳した。完了した行為をアオリストに即して表した。
theological_decisions:
- issue: 食べる／食べないという対比の範囲
  choice: 何を食べるかを補わず、「食べる人」と「食べない人」と訳す。
  alternative: 「何でも食べる人」と「ある食物を控える人」と明示する。
  rationale: 周辺文脈は食物をめぐる問題を扱うが、この節自体は対象を明示せず、食べることと食べないことを対比しているため。
- issue: 「その人」の指示対象
  choice: 単数の「その人」を保ち、特定の側に限定しない。
  alternative: 直前の「食べる人」だけを指すと明示する。
  rationale: 文法上は直前の「食べる人」が最も近いが、相互的な戒め全体に及ぶ修辞的含みを損なわないよう、原文の単数代名詞の曖昧さを保持した。
- issue: 神による受容の性質
  choice: 「受け入れた」とする。
  alternative: 「迎え入れた」または「交わりに迎え入れた」とする。
  rationale: 関係的な受容の意味を保ちながら、本文に「交わり」という説明を付加しないため。
translation_notes:
  register: 明瞭な現代標準語を用い、相互に対応する禁止を二文に分けて読みやすくした。「ならない」「からである」により、簡潔で品位ある聖書本文の調子を保った。
