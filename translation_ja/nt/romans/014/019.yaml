  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: ja
  text: ですから、平和につながることと、互いを築き上げることとを追い求めましょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「平和に関わる事柄と、互いを築き上げることに関わる事柄とを」。
    reason: ギリシア語では「〜に関わる事柄」に当たる並行した名詞句が二度用いられていることを示すため。
lexical_decisions:
- source_word: ἄρα οὖν
  choice: ですから
  rationale: 二つの推論を示す小辞が、それまでの議論を受けた結論を導く。現代日本語として自然な「ですから」でその推論の力を表した。
- source_word: τὰ τῆς εἰρήνης
  choice: 平和につながること
  rationale: 属格を伴う中性複数の名詞句を、平和に属する事柄、すなわち平和を促すこととして自然に表現した。
- source_word: διώκωμεν
  choice: 追い求めましょう
  rationale: 現在接続法の勧奨用法であり、共同体が継続して力を注ぐよう促す語勢を保った。
- source_word: τὰ τῆς οἰκοδομῆς
  choice: 築き上げること
  rationale: οἰκοδομήの建築比喩を保ちつつ、教会用語に偏らない明瞭な現代日本語とした。
- source_word: τῆς εἰς ἀλλήλους
  choice: 互いを
  rationale: 共同体内の相互的な方向性を日本語として自然に示し、「築き上げる」の対象として表した。
theological_decisions:
- issue: 共同体を築き上げることの範囲
  choice: 信徒たちが共同で、平和と相互の成長に資することを追求する勧めとして訳す
  alternative: 各人の個人的な道徳的向上だけに限定して読む
  rationale: 一人称複数の勧奨と相互代名詞ἀλλήλουςは、良心をめぐる対立の文脈にある共同体的・相互的な行動を示すため。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。勧奨の共同性を「～ましょう」で表し、οἰκοδομήの比喩は「築き上げる」として保持した。
