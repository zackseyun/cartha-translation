review_pass:
  verdict: revise
  source_fidelity: 原文の修辞的な問い、主人に対する責任という比喩、「立つ／倒れる」の対比、および未来受動態から主の働きへ至る論理はおおむね保たれています。ただし、οἰκέτηςは家に属する奴隷・召使いを指す語であり、「他人の家のしもべ」は所属関係と隷属的身分をやや弱く表します。また「立たされます」は現代日本語では強制的に立たせられる含みを帯びやすいため、神が支えて立たせるという文脈により適する表現へ改めます。
  naturalness: 全体は明瞭ですが、「自分の主人の前でのことです」はやや説明調で、「立たされます」は不自然さと不要な強制の含意があります。「その人は、自分の主人の前で立つか、倒れるかする」とし、受動態は「立たせられるでしょう」とすることで、現代標準語として自然にしつつ原文の比喩と受動性を保てます。
  terminology: κύριοςの最初の用例を「主人」、最後を神学的称号として「主」とする区別は適切です。原語で同語が反復される点は脚注で示すのがよいでしょう。οἰκέτηςはこの比喩の社会的前提を隠さないよう、「家の奴隷」とします。
  issues:
  - severity: medium
    issue: οἰκέτηςの訳語が隷属的・所属的な意味を弱めている
    rationale: 「他人の家のしもべ」は家で働く者一般にも読めます。οἰκέτηςは家に属する奴隷または家僕を指し、ここでは主人との対照にもその関係が重要です。
  - severity: medium
    issue: 「立たされます」が日本語として不自然で、強制の響きを持つ
    rationale: σταθήσεταιは未来受動で、主がその人を立たせることを示します。「立たせられるでしょう」は受動性を保ちつつ、直後の「主は…できる」と自然につながります。
  - severity: low
    issue: 脚注アンカーが文末にあり、対象となる「主」から離れている
    rationale: 脚注は最後の「主」の直後に置くと、主人との語の連関および指示対象に関する注であることが明確になります。
