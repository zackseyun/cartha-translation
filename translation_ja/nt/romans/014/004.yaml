  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: ja
  text: 他人の家の奴隷を裁くとは、あなたは何者ですか。その人は、自分の主人の前で立つか、倒れるかするのです。しかし、その人は立たせられるでしょう。主[a]は彼を立たせることができるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 最後の「主」は、しもべの主人という比喩を引き継ぐとも読めますが、信者を立たせることのできる主を指すと読むのが有力です。原文では、前の「主人」と最後の「主」に同じ語が使われています。
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: 裁くとは、あなたは何者ですか
  rationale: 強意の代名詞を伴う修辞的な問いの厳しい響きを保ちつつ、現代日本語として自然な語順にした。
- source_word: ἀλλότριον οἰκέτην
  choice: 他人の家のしもべ
  rationale: οἰκέτηςが家に属する奉公人・奴隷を指すことを「家のしもべ」で示す。「奴隷」と断定するより語義の幅を保ち、比喩の主従関係も伝える。
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: 自分の主人の前で
  rationale: 与格が示す帰属・責任関係を自然な日本語で表し、後半の神学的称号「主」と区別しながら原語κύριοςの連関も残した。
- source_word: στήκει ἢ πίπτει
  choice: 立つのも倒れるのも
  rationale: 対をなす比喩を解釈的に言い換えず、そのまま保持した。
- source_word: σταθήσεται
  choice: 立たされます
  rationale: 未来受動形を明示し、直後に示される主の働きを保持した。
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: 主には彼を立たせる力があるからです
  rationale: 因果関係と「立つ／立たせる」の語の連鎖を保った。
theological_decisions:
- issue: 最後のὁ κύριοςの指示対象
  choice: 神学的称号としての「主」
  alternative: 比喩の中の、そのしもべの主人
  rationale: 定冠詞を伴うパウロ書簡での用法と、信者を立たせる力への言及から神学的意味が有力。ただし比喩上の主人との意図的な重なりが残るため、脚注で別解を示す。
translation_notes:
  register: 明瞭で格調ある現代標準語。「しもべ」は日常語ではやや文語的だが、家に属する奉公人または奴隷というοἰκέτηςの幅と、主人との関係を簡潔に保つため採用した。脚注記号は関連する最終文の末尾に置いた。
