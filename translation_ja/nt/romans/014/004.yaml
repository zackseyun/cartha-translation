  to: 他人の家の奴隷を裁くとは、あなたは何者ですか。その人は、自分の主人の前で立つか、倒れるかするのです。しかし、その人は立たせられるでしょう。主[a]は彼を立たせることができるからです。
  rationale: 家に属する奴隷というοἰκέτηςの意味を「家の奴隷」で明示しました。「立つか、倒れるかする」で現在形の比喩的対比を保ち、未来受動態は「立たせられるでしょう」で表しました。最後の主の指示対象に残る比喩的重なりは、本文で断定せず脚注に保存しています。
