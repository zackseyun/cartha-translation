  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: ja
  text: このようにキリストに仕える人は、神に喜ばれ、人々にも認められるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: このように
  rationale: 直前の文脈で述べられたあり方を指す表現として自然に訳した。指示内容を本文中で限定しすぎない。
- source_word: δουλεύων τῷ Χριστῷ
  choice: キリストに仕える人
  rationale: δουλεύω の奉仕・隷属の意味を保ちつつ、現代日本語の聖書文体として明瞭にした。
- source_word: εὐάρεστος τῷ θεῷ
  choice: 神に喜ばれ
  rationale: 神にとって喜ばしい、受け入れられるという意味を簡潔で自然な受動表現にした。
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: 人々にも認められる
  rationale: δόκιμος の試されて是認された、評価に値するという含意を「認められる」で表し、τοῖς ἀνθρώποις は性別を限定しない「人々」とした。
theological_decisions:
- issue: 「このように」が指す範囲
  choice: 指示表現のまま保持する
  alternative: 「義と平和と聖霊による喜びのうちに」と明示する
  rationale: ἐν τούτῳ の指示対象には文脈上の解釈余地があるため、訳文で説明を加えて一義的に固定しない。
- issue: 人々からの評価と救済上の承認の区別
  choice: 一般的な対人的評価として「認められる」とする
  alternative: 「人々に是認される」
  rationale: 本文は神に喜ばれることと人々に認められることを並置するが、後者を救済論的な宣告として強めない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。原文の因果接続 γάρ を文末の「からです」で表し、簡潔で dignified な聖書本文調を保った。
