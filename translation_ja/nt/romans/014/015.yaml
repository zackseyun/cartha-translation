id: ROM.14.15
reference: Romans 14:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: ja
  text: というのも、もし食べ物のことであなたの兄弟が心を痛めているなら、あなたはもはや愛に従って歩んでいません。あなたの食べ物によって、メシアがその人のために死なれたその人を滅ぼしてはなりません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滅ぼす」とも、「破滅させる」「滅びに至らせる」とも訳せる強い語。ここで最終的な滅びを意味するのか、深刻な霊的損害を意味するのかは、この節だけでは特定されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: 食べ物／あなたの食べ物によって
  rationale: 特定の肉ではなく食物一般を指す語であるため、「食べ物」とした。与格は手段・契機を表すものとして「によって」と訳した。
- source_word: ἀδελφός
  choice: 兄弟
  rationale: 男性単数形を保ちつつ、文脈上は信仰共同体の仲間を指す。日本語の聖書的・共同体的用法として自然である。
- source_word: λυπεῖται
  choice: 悲しんでいる
  rationale: 悲しみや心痛を受けている状態を表し、その原因や程度を必要以上に限定しない。
- source_word: κατὰ ἀγάπην
  choice: 愛に従って
  rationale: κατάの規範・基準の意味を自然な現代日本語で示した。
- source_word: περιπατεῖς
  choice: 歩んではいません
  rationale: パウロの倫理的な「歩む」という比喩を保持した。
- source_word: ἀπόλλυε
  choice: 滅ぼしてはなりません
  rationale: 強い警告を保ちながら、永遠の滅びか一時的・霊的破滅かを本文で決めつけない。
- source_word: ὑπὲρ οὗ
  choice: その人のため
  rationale: ὑπέρ＋属格の代理的・犠牲的含意を、自然な日本語で表した。
- source_word: Χριστός
  choice: メシア
  rationale: ここでは称号として機能しているため、その意味を明示する「メシア」とした。
- source_word: ἀπέθανεν
  choice: 死なれた
  rationale: 死亡という出来事を端的に表しつつ、主語への自然な敬意を示す日本語とした。
- source_word: ἐκεῖνον
  choice: その人
  rationale: 指示語の強調を保ち、前述の兄弟を自然に受ける表現とした。
- source_word: εἰ γὰρ
  choice: もし…なら
  rationale: 条件構文を明示した。γάρの前文との論理的接続は、この一節単独の日本語で不自然になる「というのは」を避け、文脈に委ねた。
theological_decisions:
- issue: ἀπόλλυεが弱い兄弟について示す破滅の範囲
  choice: 「滅ぼしてはなりません」と強い警告として訳す
  alternative: 「破滅させてはなりません」「滅びに至らせてはなりません」
  rationale: 語の深刻さは保つが、救いの喪失、永遠の滅び、現世的・霊的損害のいずれかに限定しない。
- issue: ἀδελφόςの指示範囲
  choice: 「兄弟」
  alternative: 「兄弟姉妹の一人」「信仰の仲間」
  rationale: 原文の男性単数形を本文に反映し、文脈上の代表的・包括的な適用を排除しない。
- issue: Χριστόςの訳語
  choice: 「メシア」
  alternative: 「キリスト」
  rationale: 固有名のように処理せず、油注がれた者という称号としての機能を明確にした。
translation_notes:
  register: 明瞭で現代的ながら、パウロの倫理的比喩と警告の厳粛さを保つ文体。「愛に従って歩む」は原文の比喩を残し、「メシアが死なれたのは、その人のため」と語順を整えて日本語での焦点を明確にした。
