revisions:
- from: もし、食べ物のことであなたの兄弟が悲しんでいるなら、あなたはもはや愛に従って歩んではいません。あなたの食べ物によって、その人を滅ぼしてはなりません[a]。メシアが死なれたのは、その人のためなのです。
  to: というのも、もし食べ物のことであなたの兄弟が心を痛めているなら、あなたはもはや愛に従って歩んでいません。あなたの食べ物によって、メシアがその人のために死なれたその人を滅ぼしてはなりません[a]。
  rationale: γάρを「というのも」で訳出し、前文との論理的接続を保った。「悲しんでいる」は許容されるが、λυπεῖταιの受ける心痛・苦痛を自然に表す「心を痛めている」とした。後半は「メシアがその人のために死なれたその人」を「滅ぼしてはなりません」の目的語として置き、ἐκεῖνονおよびὑπὲρ οὗ Χριστὸς ἀπέθανενの構文と個人への強調を保持した。脚注は語義の幅を示しつつ、滅びの性質について結論を押し付けない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:28:48Z'
