source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: ja
  text: ある人は、ある日をほかの日より重んじ[a]、別の人は、どの日も同じだと考える[b]。各自、自分の考えについて十分に確信を持ちなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ある日をほかの日より重要とみなす」。ここでの「重んじる」は、評価して区別するという意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳「すべての日を」。前半との対照から、「どの日も同じ」と考える意味。
    reason: lexical_alternative
  - marker: c
    text: または「十分に納得していなさい」「十分に確信していなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: 重要だと考え／同じだと考え
  rationale: ここでの動詞は、罪に定める意味ではなく、日について評価し区別することを表す。対照関係が現代日本語で明瞭になるように訳した。
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: ある日をほかの日より重要だと
  rationale: παράによる日と日の比較を明示しつつ、安息日、祭日、断食日など、原文が特定していない内容は補わない。
- source_word: πᾶσαν ἡμέραν
  choice: どの日も同じだと
  rationale: 字義上は「すべての日」だが、前半との対照から、日々の間に区別を設けないという含意を自然な日本語で表した。
- source_word: ἕκαστος
  choice: 各自
  rationale: 単数で配分的な意味を持つ語を、性別を限定せず、個々人を指す簡潔で自然な日本語にした。
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: 自分の考えに
  rationale: νοῦςは思考、理解、判断を担う心を指す。日本語では「自分の考えに」が文脈上自然で、各人自身の判断であることを保つ。
- source_word: πληροφορείσθω
  choice: 十分な確信を持ちなさい
  rationale: 十分に納得し、確信している状態を求める現在命令形の力を、明瞭な現代日本語で表した。
theological_decisions:
- issue: ここで言う「日」が何を指すか
  choice: 単に「日」とし、その種類を特定しない
  alternative: 安息日やユダヤ教の祭日、または断食日などと明示する
  rationale: パウロ自身がこの節で日を特定していないため、解釈上の可能性を翻訳によって一つに限定しない。
- issue: πᾶσαν ἡμέρανの対照的含意
  choice: 「どの日も同じだと」と訳す
  alternative: 字義どおり「すべての日を考える」とする
  rationale: 「同じ」は独立したギリシア語として存在しないが、ある日をほかの日より重要と見る立場との対照から明確に含意される。脚注で字義を示し、補足の透明性を保った。
- issue: 個人の確信の表現
  choice: 「自分の考えに十分な確信を持ちなさい」
  alternative: 共同体の規範または客観的正しさについて確信せよ、と解釈的に展開する
  rationale: 本文は各人のνοῦςにおける確信を命じている。何を正しい結論とすべきかはこの節だけでは指定されていないため、その緊張を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、礼拝朗読にも耐える落ち着いた文体とした。「安息日」「祭日」などの解釈的限定は避け、原文の一般性を保持した。
