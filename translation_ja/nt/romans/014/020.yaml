id: ROM.14.20
reference: Romans 14:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: ja
  text: 食べ物のために、神の働きを壊してはなりません。すべてのものは確かに清いのですが[a]、つまずきを伴って食べる人にとっては、悪いことです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「すべてのものは確かに清い」。ここでは食べ物について語られているので、「どの食べ物も清い」とも訳せます。
    reason: 原文の広い表現と、文脈による限定を説明するため。
  - marker: b
    text: 「つまずきのゆえに食べる人にとっては」とも訳せます。原文だけでは、その人が他の人をつまずかせるのか、本人が良心につまずきながら食べるのかを明示していません。
    reason: διὰ προσκόμματοςの構文と、つまずきの向きに残る曖昧さを保持するため。
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: 食べ物のために
  rationale: ἕνεκεν＋属格が表す理由・動機を自然に示し、食べ物のことで神の働きを損なってはならないという対比を保つ。
- source_word: κατάλυε
  choice: 壊してはなりません
  rationale: καταλύωの、組み上げられたものを解体する比喩を「壊す」で表し、μήを伴う現在命令の禁止を明瞭にした。
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: 神の働き
  rationale: 神が信徒や共同体のうちで行っていることを含み得る広がりを、解釈で限定せずに保つ。
- source_word: πάντα μὲν καθαρά
  choice: すべてのものは確かに清い
  rationale: πάνταの広い表現と、文脈上は食べ物を指す含みの両方を保った。καθαράは宗教的・儀礼的な清さの語感を残すため「清い」とした。μένは「確かに」で軽く表した。
- source_word: κακὸν
  choice: 悪いこと
  rationale: 倫理的な否定評価を明確にしつつ、日本語の述語として自然な形にした。
- source_word: τῷ ἀνθρώπῳ
  choice: 人にとっては
  rationale: ἄνθρωποςはここでは一般的・代表的に人を指すため、性別を不必要に限定しない自然な日本語とした。
- source_word: διὰ προσκόμματος ἐσθίοντι
  choice: つまずきを引き起こすような食べ方をする
  rationale: πρόσκομμαの「つまずき」の比喩を保ち、食べる行為が他者のつまずきの契機となるという文脈上有力な意味を自然に表した。ただし構文上の含みは脚注で示した。
theological_decisions:
- issue: 「すべてのものは清い」の範囲
  choice: 本文では「すべてのもの」と広く訳し、文脈上食べ物を指すことを脚注で示す。
  alternative: 「どの食べ物も清い」と明示する。
  rationale: 原文のπάνταは「食べ物」と明記していないが、直前直後の食事の文脈から食べ物が中心である。本文では原文の広さを保持し、脚注で文脈を明らかにする。
- issue: διὰ προσκόμματοςが示すつまずきの方向
  choice: 他者のつまずきを引き起こすように食べることとして訳す。
  alternative: 食べる本人が良心につまずきながら食べること、または単に「つまずきを伴って食べること」とする。
  rationale: 章全体、とりわけ14:13、15、21は兄弟姉妹をつまずかせない責任を強調するため、他者への作用が文脈上有力である。一方、ギリシア語句自体は作用の方向を完全には明示しないので、別の理解を脚注に残す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「神の働き」「清い」「つまずき」というパウロの比喩的・神学的語彙を保持した。命令は丁寧で格調のある「～してはなりません」とした。
