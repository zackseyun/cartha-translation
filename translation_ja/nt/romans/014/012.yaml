id: ROM.14.12
reference: Romans 14:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἄρα ἕκαστος ἡμῶν περὶ ἑαυτοῦ λόγον ⸀δώσει.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/012.yaml
  text: So then[a], each of us will give an account of himself.
translation:
  language: ja
  text: したがって、私たち一人ひとりは、自分自身について[a]申し開きをすることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「自分自身のことで」。「自分自身について」が直訳。
    reason: περὶ ἑαυτοῦの直訳を保持しつつ、文脈に即した自然な日本語の言い換えを示すため。
lexical_decisions:
- source_word: ἄρα
  choice: したがって
  rationale: 直前の議論から導かれる結論を示す推論の接続語として、現代日本語で明確かつ自然。
- source_word: ἕκαστος ἡμῶν
  choice: 私たちは一人ひとり
  rationale: ἕκαστοςの個別的・分配的な意味と、ἡμῶνの『私たちのうち』という関係を自然な日本語で表す。
- source_word: περὶ ἑαυτοῦ
  choice: 自分自身について
  rationale: περί＋属格の基本的な『〜について』を保持し、各人が自分自身を対象として申し開きすることを明示する。
- source_word: λόγον δώσει
  choice: 申し開きをすることになります
  rationale: 『説明・弁明を差し出す』という評価・裁きの場面での慣用的意味を、自然で厳粛な日本語にする。未来形は『ことになります』で表した。
theological_decisions:
- issue: λόγονを与える相手の明示
  choice: 神に
  alternative: 相手を明示せず『申し開きをする』
  rationale: 直前の14:10–11では神の裁きの座と神への告白が明示され、この節でも説明の相手は文脈上神である。ただし本文の当該節には与格の目的語がないため、補足であることを脚注で示す。
- issue: 単数再帰代名詞の一般的用法
  choice: 自分自身について
  alternative: 自分のことを
  rationale: 日本語の『自分自身』は性を不必要に付加せず、ἕκαστοςに対応して各人を個別に指す再帰性を保てる。
translation_notes:
  register: 明快な現代標準語を用いながら、裁きの文脈にふさわしい厳粛さを保った。「申し開き」は日常語よりやや改まっているが、λόγον διδόναιの説明責任・弁明という含意を簡潔に伝える。
