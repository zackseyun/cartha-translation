id: ROM.14.17
reference: Romans 14:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: ja
  text: なぜなら、神の国は食べることと飲むことではなく、聖霊にあっての義と平和と喜びだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: 国
  rationale: 「神の国」は日本語の聖書表現として自然で定着しており、神の支配という含みも保てる。
- source_word: βρῶσις καὶ πόσις
  choice: 食べることや飲むこと
  rationale: 二つの行為名詞を並行する自然な日本語で表し、食物や飲物そのものより、文脈上問題となっている飲食の行為を示した。
- source_word: δικαιοσύνη
  choice: 義
  rationale: パウロ書簡における語の神学的・倫理的な幅を保つ標準的な訳語。社会的な「正義」の意味もあり得るため脚注に示した。
- source_word: εἰρήνη
  choice: 平和
  rationale: 神との平和と共同体における調和の双方を含み得る、自然で簡潔な訳語。
- source_word: χαρά
  choice: 喜び
  rationale: 感情だけに限定せず、パウロ的な霊的喜びを自然に表す。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 聖霊にある
  rationale: ἐν の領域・関与の含みを一方に決めず、「聖霊による」と道具的意味だけに限定しない表現とした。
- source_word: γάρ
  choice: だからです
  rationale: 前節までの勧めを説明する接続関係を、現代日本語で自然に示した。
theological_decisions:
- issue: δικαιοσύνη の訳し方
  choice: 義
  alternative: 正義
  rationale: パウロ書簡での継続性と、神の前および人間関係における正しさという広がりを保つため本文では「義」とした。「正義」も語義上可能なので脚注に残した。
- issue: ἐν πνεύματι ἁγίῳ における ἐν の意味
  choice: 聖霊にある
  alternative: 聖霊による
  rationale: 聖霊がもたらすという手段・原因の意味と、聖霊を領域とする意味の両方を許すため、原文の曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「神の国」「聖霊にある義」など、内容の神学的な厚みを保つ簡潔で格調ある文体とした。
