  text: Τὸν δὲ ἀσθενοῦντα τῇ πίστει προσλαμβάνεσθε, μὴ εἰς διακρίσεις διαλογισμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: ja
  text: 信仰の弱い人を受け入れなさい[a]。考えをめぐる論争のために受け入れてはなりません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「迎え入れなさい」とも訳せる。ギリシア語は、自分たちの仲間として、また交わりに受け入れることを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: または「さまざまな考えを裁くためではありません」「推論をめぐる争いのためではありません」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: 弱い人
  rationale: 定冠詞を伴う現在分詞の実名詞的用法。「弱さ」を良心などに限定せず、動詞的な含みを自然な日本語で表す。
- source_word: τῇ πίστει
  choice: 信仰の
  rationale: 与格を弱さの領域・点として捉え、「信仰において弱い」を自然な連体表現にした。「信仰内容」という客観的体系に限定しない。
- source_word: προσλαμβάνεσθε
  choice: 受け入れなさい
  rationale: 自分たちの交わりへ迎え入れるという中動態命令の意味を、明瞭で現代的な日本語にした。
- source_word: μὴ εἰς
  choice: ただし、…ためではありません
  rationale: 避けるべき目的を示す構文として訳し、前半の命令に付された否定的な目的規定を明確にした。
- source_word: διακρίσεις
  choice: 言い争う
  rationale: ここでは中立的な区別より、考えを裁定し合う論争的な行為を指す。名詞構文を自然な動詞表現にした。
- source_word: διαλογισμῶν
  choice: その人の考えを巡って
  rationale: 「考え・推論」を表す属格を、争いの対象として理解した。単なる「意見」よりも内的な思案を含む広さを保つ。
- source_word: δὲ
  choice: 無標
  rationale: 軽い移行・接続を示すが、単独節の自然な日本語では「さて」「しかし」を明示すると対比や時間的転換を強めすぎるため、訳語を置かない。
theological_decisions:
- issue: πίστις の訳語
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: 文脈は論争のある実践に関する信者の確信の弱さを扱う。「信仰」が最も広く自然であり、「信頼」や「忠実さ」に限定しない。
- issue: διακρίσεις διαλογισμῶν の統語的・意味的関係
  choice: その人の考えを巡って言い争う
  alternative: 考えを裁く／推論同士の争い
  rationale: 属格を論争の対象と取る理解を本文に採用したが、διακρίσεις には判断・裁定、διαλογισμοί には推論という含みもあり、別解を注記して曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準語。共同体への受容を命じる厳粛さを保ちつつ、名詞を重ねた不自然な直訳を避けた。すべての脚注記号を本文中に配置した。
