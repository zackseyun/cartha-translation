  to: 'こう書かれているからです。


    「わたしは生きている、と主は言われる。


    すべての膝がわたしの前にかがみ、


    すべての舌が神に告白する[a]。」'
  rationale: 本文では「神に告白する」として、ἐξομολογήσεταιの基本語義とτῷ θεῷの与格を明示した。脚注には公的承認と賛美という可能な語調を残した。また、「膝がかがむ」という比喩を保ちつつ、「わたしの前に」により日本語として自然な表現に整えた。「主」「わたし」「神」の表現上の移り変わりは変更していない。
