id: ROM.14.11
reference: Romans 14:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: ja
  text: 'こう書かれているからです。


    「わたしは生きている、と主は言われる。


    すべての膝がわたしの前にかがみ、


    すべての舌が神に告白する[a]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神に公に認める」「神をほめたたえる」。このギリシア語動詞には、告白する、公に認める、賛美するという意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 完了受動形が示す、聖書に記されて今も権威を持つ状態を、自然な現代日本語の引用導入句で表した。
- source_word: Ζῶ ἐγώ
  choice: わたしは生きている
  rationale: 神の命にかけた厳粛な宣言という含みを保ちつつ、原文の簡潔な表現に従った。
- source_word: κύριος
  choice: 主
  rationale: κύριοςの通常の訳語を採用し、引用背景を理由に本文で「主なる神」などへ拡張しなかった。
- source_word: ἐμοὶ κάμψει πᾶν γόνυ
  choice: すべての膝はわたしに向かってかがみ
  rationale: 膝を人格の換喩として用いる原文の身体的イメージを残し、与格ἐμοίの方向性も明示した。
- source_word: πᾶσα γλῶσσα
  choice: すべての舌
  rationale: 「すべての人」と言い換えず、聖書引用の比喩と響きを保持した。
- source_word: ἐξομολογήσεται
  choice: 公に認める
  rationale: この動詞が持つ告白・承認・賛美の幅のうち、ここでの公然たる承認を自然な日本語で表した。「告白する」は現代日本語では罪や個人的感情の告白に狭く受け取られやすいため避けたが、別の含みは脚注に残した。
- source_word: τῷ θεῷ
  choice: 神を
  rationale: 日本語では「認める」が目的語を「を」で取るため、ギリシア語の与格を機械的に「神に」とせず、「神を公に認める」と自然に表現した。
theological_decisions:
- issue: 引用内の「主」「わたし」と「神」との関係
  choice: 「主は言われる」「わたしに向かって」「神を」と、原文にある指示表現の移り変わりをそのまま保った。
  alternative: 末尾を「わたしを公に認める」と平行化する、または訳文自体で「主」をイエスと明示する。
  rationale: 本文は第一人称の神的発言から「神」へと表現を移している。訳文で同一表現にそろえたり、キリスト論的帰結を明記したりせず、原文の形と神学的緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用部分は詩的な行分けを用い、「すべての膝」「すべての舌」という原文の並行表現を保持した。
