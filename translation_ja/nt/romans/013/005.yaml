id: ROM.13.5
reference: Romans 13:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὸ ἀνάγκη ὑποτάσσεσθαι, οὐ μόνον διὰ τὴν ὀργὴν ἀλλὰ καὶ διὰ τὴν συνείδησιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: ja
  text: したがって、怒り[b]のゆえだけでなく、良心のゆえにも、従う[a]必要があります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「服する」。
    reason: lexical_alternative
  - marker: b
    text: 「怒り」は、統治者による処罰を指すとも、より広く、統治権力を通して働く神の怒りを指すとも考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: したがって
  rationale: 直前の議論から結論を導く推論の接続詞として、論理関係を明確に保つ自然な現代日本語。
- source_word: ἀνάγκη
  choice: 必要があります
  rationale: 非人称的に必要性を表す語の力を保ち、「しなければならない」よりも原文の構文に近く表現した。
- source_word: ὑποτάσσεσθαι
  choice: 従う
  rationale: 統治権力の下に身を置く姿勢を、絶対的服従という含意を加えず、簡潔で自然な日本語で表した。
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: …だけでなく、…にも
  rationale: 原文の相関構文による対比と付加を自然な日本語で再現した。
- source_word: διὰ τὴν ὀργὴν
  choice: 怒りのゆえ
  rationale: διάと対格が示す理由・動機を表し、ὀργήを「処罰」と限定せず、誰の怒りかという原文の曖昧さを保持した。
- source_word: διὰ τὴν συνείδησιν
  choice: 良心のゆえ
  rationale: 外的な制裁だけでなく、内的な道徳意識も服従の理由であることを、原文に沿って簡潔に示した。
theological_decisions:
- issue: 「怒り」（ὀργή）が誰の怒りを指すか
  choice: 「怒り」とだけ訳し、指示対象を特定しない
  alternative: 神の怒り／統治者による処罰
  rationale: 直前の文脈には、神による権威の秩序づけと、剣を帯びて罰を執行する統治者の双方が現れる。原文はここで指示対象を明示しないため、その神学的緊張を保持した。
- issue: 統治権力に対するὑποτάσσεσθαιの意味合い
  choice: 従う
  alternative: 服する／服従する
  rationale: 求められる姿勢を明瞭に表しつつ、本文が述べていない無条件・絶対的な服従という教理的含意を持ち込まないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「怒りのゆえ」「良心のゆえ」と並行させ、原文の理由を示す構造を見える形で保った。
