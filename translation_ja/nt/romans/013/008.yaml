source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: ja
  text: だれにも、何の借りもあってはいけません。ただし、互いに愛し合うことを除いては。ほかの人を愛する者は、律法を全うしているからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: だれに対しても、何一つ負い目を持っていてはなりません
  rationale: 二重の否定による包括性を保ちつつ、金銭的な負債にも広い意味での義務にも通じるὀφείλετεを「負い目を持つ」で表した。借り入れ一般を明示的に禁じる解釈には限定しない。
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: ただし、互いに愛し合うことは別です
  rationale: εἰ μήの例外提示と、実質名詞的な不定詞句を自然な現代日本語で表現した。愛が継続して負うべき例外的な務めであるという含みを保つ。
- source_word: ὁ γὰρ ἀγαπῶν
  choice: 愛する者は……からです
  rationale: 実質名詞的な現在分詞の代表的・継続的な意味を、簡潔で格調を損なわない日本語にした。
- source_word: τὸν ἕτερον
  choice: ほかの人
  rationale: 字義どおりの「もう一方の者／他者」を自然に表し、本文にない「隣人」を先取りして補わない。
- source_word: νόμον πεπλήρωκεν
  choice: 律法を全うしている
  rationale: νόμοςをパウロの文脈に即して「律法」とし、完了形の達成とその現存する結果を「全うしている」で表した。
theological_decisions:
- issue: 負債禁止の範囲
  choice: 「負い目を持っていてはなりません」と訳し、負債・義務という語義を保持する。
  alternative: あらゆる借金を絶対的に禁じる命令、または道徳的義務だけを指す比喩として訳す。
  rationale: ギリシア語は負債または義務の双方に関わり得るため、翻訳では倫理的論争を決着させず、本文の幅を残す。
- issue: 愛と律法の関係
  choice: 「律法を全うしている」とし、愛する者についての完了的な言明をそのまま保つ。
  alternative: 「律法を完全に守った」または「律法の要求を満たす」と説明的に限定する。
  rationale: πληρόωの神学的な厚みと、愛が律法を成就するという緊張を解説で狭めず保持する。
translation_notes:
  register: 明瞭な現代標準日本語の敬体。命令の厳粛さを保ちながら、古風すぎる語法は避けた。「負い目」は金銭的負債と一般的義務の両方に開かれた表現である。
