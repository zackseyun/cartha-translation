source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: ja
  text: あなたがたが税を納めるのも、このためです。彼らは神に仕える者であり、まさにこの務めに専念しているからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: 税を納める
  rationale: φόροςはここでは統治権力に納める直接税・貢納を指し、τελεῖτεはその支払いを表すため、自然で正確な「税を納める」とした。
- source_word: λειτουργοὶ θεοῦ
  choice: 神に仕える者
  rationale: λειτουργόςは公的な奉仕者・職務執行者を表しうる。日本語の「奉仕者」や「祭司」は宗教的役職に狭く響きやすいため、属格θεοῦとの関係を保ちつつ、この文脈で自然な「神に仕える者」とした。
- source_word: εἰς αὐτὸ τοῦτο προσκαρτεροῦντες
  choice: まさにこの務めに専念している
  rationale: προσκαρτερέωの継続的な従事・専念を表し、αὐτὸ τοῦτοの強調を「まさに」で保持した。「務め」は直前の公的奉仕を受ける補足である。
theological_decisions:
- issue: 統治者を「神に仕える者」と呼ぶ意味
  choice: 原文どおり統治者の公的職務を神との関係で述べるが、人格や行為全体への無条件の是認とは表現しない。
  alternative: 「神の祭司」または「神聖な奉仕者」として宗教的身分を強く示す。
  rationale: λειτουργοίには奉仕の語感があるものの、この文脈では徴税を含む統治上の職務が焦点であり、特定の宗教的聖職位を意味すると限定すべきではない。
translation_notes:
  register: 明快で現代的な標準日本語を用い、説明的になりすぎない荘重さを保った。前後の因果関係は「このためです」「からです」で明示した。
