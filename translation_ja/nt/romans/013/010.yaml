  text: ἡ ἀγάπη τῷ πλησίον κακὸν οὐκ ἐργάζεται· πλήρωμα οὖν νόμου ἡ ἀγάπη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: ja
  text: 愛は隣人に害を加えません[a]。ですから、愛は律法の成就です[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「愛は隣人に悪を行いません」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「愛は律法の満たされるところです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ ἀγάπη
  choice: 愛
  rationale: 現代日本語で自然かつ簡潔な対応語であり、節内で二度繰り返される語のつながりも保持する。
- source_word: τῷ πλησίον
  choice: 隣人に
  rationale: 与格が害の及ぶ相手を示している。定冠詞を不自然に訳出せず、一般的な倫理命題として表した。
- source_word: κακὸν οὐκ ἐργάζεται
  choice: 害を加えません
  rationale: ἐργάζομαι は「行う、生じさせる」、κακόν はこの文脈では隣人への害や悪事を指す。日本語として自然に、行為が相手に及ぶ意味を示した。
- source_word: οὖν
  choice: ですから
  rationale: 前半から導かれる結論を、明瞭で現代的な接続表現によって示す。
- source_word: πλήρωμα
  choice: 成就
  rationale: 律法をその意図された完成に至らせるものという文脈上の意味を表し、原文の名詞述語も保つ。
- source_word: νόμου
  choice: 律法の
  rationale: 文脈上、パウロが論じている認識可能な律法、特にモーセ律法を指すため、定着した訳語「律法」を用いる。
theological_decisions:
- issue: 愛と律法との関係
  choice: 愛は律法の成就です
  alternative: 愛は律法を満たすものです／愛は律法の満ち満ちたものです
  rationale: 原文は動詞文ではなく、πλήρωμα を述語とする名詞文である。「成就」はその構文と、愛が律法を完成に至らせるという主張を保ちつつ、個々の戒めとの関係を必要以上に説明しない。
translation_notes:
  register: 明瞭な現代標準日本語の丁寧体を用いた。「成就」はやや格調のある語だが、原文の名詞構文と神学的な含みを簡潔に保持する。脚注記号は、それぞれ対応する句の直後に置いた。
