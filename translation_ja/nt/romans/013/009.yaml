id: ROM.13.9
reference: Romans 13:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: ja
  text: というのは、「姦淫してはならない」「殺人をしてはならない」[a]「盗んではならない」「むさぼってはならない」などの戒めは、ほかにどのような戒めがあっても、「隣人を自分自身のように愛しなさい」というこのことば[b]に要約されるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「殺してはならない」とも訳せますが、ギリシア語の動詞は、ここでは不法に人を殺すこと、すなわち殺人を指します。
    reason: lexical_alternative
  - marker: b
    text: 「この言明に」とも訳せます。ここでの「ことば」は、一つの単語ではなく、後に続く引用文を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: なぜなら
  rationale: γάρの説明・根拠を示す働きを自然な日本語で表した。中性冠詞は後続する戒めの引用内容をまとめて受けるため、「という戒めも」という構文の中で表現した。
- source_word: μοιχεύσεις
  choice: 姦淫してはならない
  rationale: 十戒の引用としての禁止命令を保ちつつ、聖書的・法的な重みを持つ定着した表現とした。
- source_word: φονεύσεις
  choice: 殺人をしてはならない
  rationale: φονεύωは殺害一般ではなく不法に人を殺すことを指すため、「殺してはならない」より語義を明確にした。
- source_word: κλέψεις
  choice: 盗んではならない
  rationale: 十戒の禁止命令として簡潔で自然な現代日本語にした。
- source_word: ἐπιθυμήσεις
  choice: むさぼってはならない
  rationale: 十戒の文脈では単なる願望ではなく、他者のものを欲する貪欲を指すため、伝統的かつ文脈に即した「むさぼる」を採った。
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: ほかにどのような戒めがあっても
  rationale: τιςの不定性と、列挙外の戒め全般へ範囲を広げる条件節の意味を自然に表した。
- source_word: ἀνακεφαλαιοῦται
  choice: 要約される
  rationale: 複数の戒めが一つの要点のもとにまとめられるという受動形の意味を、明瞭な現代語で表した。
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: このことばに
  rationale: λόγοςを一語ではなく、後続する聖書の言明として理解しつつ、原文の簡潔さを保つため「ことば」とした。
- source_word: Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν
  choice: 隣人を自分自身のように愛しなさい
  rationale: レビ記からの引用とのつながりを保ち、命令の力と比較表現を過不足なく伝えた。
theological_decisions:
- issue: 十戒およびレビ記からの引用における命令形
  choice: 「してはならない」「愛しなさい」という聖書引用の命令形
  alternative: 「するな」「愛せ」という直接的で強い命令形
  rationale: ギリシア語の未来形が引用中で命令の働きをしていることを示しつつ、現代日本語として品位と可読性を保った。
- issue: λόγοςの範囲
  choice: 後続する引用全体を指す「ことば」
  alternative: 「言明」「教え」
  rationale: ここでは単独の語ではなく要約的な聖書の言明を指すが、「教え」として解釈を狭めず、原語の幅を保った。
- issue: ἀνακεφαλαιοῦταιが示す戒めの統合
  choice: 「要約される」
  alternative: 「この一つに尽きる」「置き換えられる」
  rationale: 戒めが廃棄・置換されると断定せず、一つの言明のもとにまとめられるという原文の意味と神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、十戒とレビ記の引用には簡潔で荘重な命令表現を保った。「姦淫」「むさぼる」は日常語よりやや聖書的だが、文脈上の精度と引用の連続性を優先した。
