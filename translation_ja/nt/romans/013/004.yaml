  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: ja
  text: というのも、統治する権威は、あなたの益となるために神に仕える者だからです。しかし、あなたが悪を行うなら、恐れなさい。その権威は、無意味に剣を帯びているのではありません[a]。それは神に仕える者であり、悪を行う者に怒りを下す、報復を行う者なのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いたずらに剣を帯びているのではありません」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「悪を行う者に怒りを下す者なのです」。
    reason: alternative_reading
lexical_decisions:
- source_word: διάκονός
  choice: しもべ
  rationale: 統治する権威が神の委託を受けて仕える者であることを表す。教会職を連想させやすい「執事」や「奉仕者」より、この文脈に適する。
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: あなたの益となるための
  rationale: 与格 σοὶ と目的・結果を示す句を一体として捉え、読者への利益という意味を自然な日本語で表した。
- source_word: τὸ κακὸν ποιῇς
  choice: 悪を行う
  rationale: κακόν の倫理的意味を簡潔に保つ。
- source_word: φοβοῦ
  choice: 恐れなさい
  rationale: 命令形の直接性と、権威の処罰的役割を恐れるという文脈を保持する。
- source_word: εἰκῇ
  choice: いたずらに
  rationale: 「目的もなく、無意味に」という意味を、格調を保ちつつ簡潔に表す。
- source_word: μάχαιραν φορεῖ
  choice: 剣を帯びている
  rationale: μάχαιρα の具体的な比喩を残し、φορέω の継続的・公的な携行を自然に表現する。
- source_word: ἔκδικος
  choice: 報復者
  rationale: 正義に基づいて応報を執行する者という意味を保持する。「復讐者」より私的報復の印象が弱い。
- source_word: εἰς ὀργὴν
  choice: 怒りを下す
  rationale: 目的・結果を日本語として自然に示しつつ、その怒りの主体を本文で明示しないことで原文の簡潔さと曖昧さを保つ。
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: 悪を行う者に
  rationale: 実質的分詞を自然に訳し、悪い行為をする者が対象であることを明確にする。
theological_decisions:
- issue: 権威が執行する怒りと神の怒りとの関係
  choice: 「怒りを下す」とし、怒りの主体を明示しない
  alternative: 「神の怒りを下す」または「処罰する」
  rationale: 文脈上は神の権威を委ねられた統治者による刑罰を指すが、原文の εἰς ὀργὴν は「神の」を明記しない。神学的つながりを保ちながら、原文以上に限定しない。
- issue: 剣の意味
  choice: 比喩を解釈語に置き換えず「剣」と訳す
  alternative: 「処罰する権限」または「武器」
  rationale: 剣は公権力の処罰的権威を示唆するが、原文の具体的表現を残し、その範囲を訳文で過度に確定しない。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、聖書本文としての品位を保った。「しもべ」「剣」「怒り」「報復者」という原文の強い語感と神学的緊張を弱めず、統治権力の役割を説明的に言い換えすぎないようにした。
