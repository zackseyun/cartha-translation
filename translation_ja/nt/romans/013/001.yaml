reference: Romans 13:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: ja
  text: すべての人は、統治する権威に服従しなさい。[a] 神によらない権威はないからです。現にある権威は、神によって定められています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「上位の権威」または「優位にある権威」。
    reason: lexical_alternative
  - marker: b
    text: 「定められています」は、「配置されています」または「秩序づけられています」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: すべての人
  rationale: 直訳は「すべての魂」だが、ここでは一人一人の人を指す慣用表現である。現代日本語として自然で、πᾶσαの分配的な意味も保つ。
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: 上に立つ権威
  rationale: ἐξουσίαιςは権威を持つ者たちを指し、ὑπερεχούσαιςは「上にある、優位に立つ」の意。「上に立つ権威」は統治上の位置を示しつつ、「政府」だけに意味を狭めない。
- source_word: ὑποτασσέσθω
  choice: 従いなさい
  rationale: 秩序のもとに身を置くことを命じる現在命令形。日本語では「従いなさい」が明瞭で自然であり、ここにない無条件の服従という説明までは加えない。
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: 神によらない権威はない
  rationale: ὑπὸ θεοῦを起源・究極的根拠として簡潔に表す。「神から出た」より自然で、「神の許可による」などの解釈を本文に付加しない。
- source_word: αἱ δὲ οὖσαι
  choice: 現にある権威
  rationale: 女性複数形は先行するἐξουσίαιςを受ける。「現にある」により、抽象的な権威一般ではなく、存在している権威を指すことを明示する。
- source_word: τεταγμέναι
  choice: 定められています
  rationale: τάσσωの完了受動分詞で、神が秩序の中に置いた結果が続いていることを示す。「定められている」は任命・配置・秩序づけの幅を保ち、すべての行為への道徳的承認まで含意しない。
theological_decisions:
- issue: 政治的権威と神との関係の範囲
  choice: 現に存在する統治上の権威が神によって秩序の中に置かれているという本文の主張を、そのまま訳す。
  alternative: あらゆる政権とその個々の行為が神に全面的に是認されていると明示する、または権威という抽象原理だけを指すと限定する。
  rationale: 本文は具体的な「現にある権威」を神が定めたと述べる一方、そのすべての行為への道徳的評価までは述べていない。その緊張を解消せず保持する。
- issue: ὑποτάσσωが求める従属の性質
  choice: 「従いなさい」と訳し、権威の下で秩序を守る命令を表す。
  alternative: 「絶対に服従しなさい」として無条件性を付加する、または「尊重しなさい」として命令の力を弱める。
  rationale: ギリシア語の命令の力を保ちながら、この一節だけでは明示されない例外や無条件性を訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令文には自然で dignified な「従いなさい」を採用した。「上に立つ権威」は原文の比喩をある程度保ちつつ、一般読者にも統治上の権威と理解できる表現である。脚注記号は対応箇所の文末に置いた。
