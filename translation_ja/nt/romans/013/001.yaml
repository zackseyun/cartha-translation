  source_fidelity: 本文は全体として原文に忠実である。Πᾶσα ψυχὴを「すべての人」、ὑπὸ θεοῦを「神によらない」、αἱ οὖσαιを「現にある権威」、τεταγμέναιを「神によって定められています」とする点はいずれも適切である。ただし、ὑποτασσέσθωは単なる一般的な「従う」よりも、権威への服従・従属を表す語であり、「服従しなさい」がこの文脈ではより直接的である。
  naturalness: 「上に立つ権威」は理解可能だが、現代標準日本語としてはやや直訳調で、何の権威かが少し曖昧である。「統治する権威」は原文の市民的文脈を自然に明示し、「上位の権威」という脚注代案も保持できる。文の流れは「すべての人は、統治する権威に服従しなさい」とすると明瞭である。
  terminology: ἐξουσίαις ὑπερεχούσαιςには「統治する権威」、ὑποτασσέσθωには「服従しなさい」を用いる。これは特定の政治制度に限定せず、また個々の統治行為への神的是認を含意しない。テタγμέναιの「定められています」は、完了受動の結果状態を自然に表しており維持する。
