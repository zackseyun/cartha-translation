source:
  edition: SBLGNT
  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: ja
  text: 浮かれ騒ぎや泥酔、淫行や放縦、争いやねたみ[a]に身をゆだねず、昼間にふさわしく、品位をもって歩みましょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ねたみ」は「嫉妬」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: 昼間にいるように
  rationale: 直訳的な「昼にあるように」の比喩を、周囲の昼と夜の対照を保ちながら、自然な現代日本語で表した。
- source_word: εὐσχημόνως
  choice: 品位をもって
  rationale: 人前にふさわしい、慎みある立派な振る舞いを表す副詞であり、「品位をもって」は明瞭で格調も保てる。
- source_word: περιπατήσωμεν
  choice: 歩みましょう
  rationale: 勧告の接続法を「ましょう」で表し、パウロに特徴的な生き方の比喩として「歩む」を保持した。
- source_word: κώμοις
  choice: 浮かれ騒ぎ
  rationale: 飲酒を伴う騒々しい宴を指す。現代語で理解しやすく、性的意味に狭めすぎない表現を選んだ。
- source_word: μέθαις
  choice: 泥酔
  rationale: 酒に酔った状態や飲酒による酩酊を簡潔に表す。
- source_word: κοίταις
  choice: 淫行
  rationale: 字義は「寝床」だが、ここでは不品行な性的関係を指す慣用的用法であるため、その意味を明示した。
- source_word: ἀσελγείαις
  choice: 放縦
  rationale: 恥を顧みない無節制な行為を広く表し、性的意味だけに限定しない語を選んだ。
- source_word: ἔριδι
  choice: 争い
  rationale: 対立、不和、競い合いを表す語として、明瞭な現代語を用いた。
- source_word: ζήλῳ
  choice: ねたみ
  rationale: 語自体には熱心さ、嫉妬、ねたみなどの幅があるが、悪徳表では否定的意味となる。「ねたみ」はその意味を自然に伝える。
theological_decisions:
- issue: 昼と闇の倫理的対照
  choice: 「昼間にいるように」として比喩をそのまま保った。
  alternative: 「昼の時代に属する者らしく」と終末論的意味を明示する。
  rationale: 直前の文脈には終末論的含意があるが、この節の表現そのものを越えて教理的説明を本文へ加えないため。
- issue: κοίταις の性的な慣用義
  choice: 「淫行」と意味を訳した。
  alternative: 字義どおり「寝床」とする。
  rationale: 日本語で「寝床」とすると倫理的・性的意味が不明瞭になるため、文脈上明らかな慣用義を表した。
- issue: ζήλῳ の否定的意味の幅
  choice: 本文では「ねたみ」とした。
  alternative: 「嫉妬」とする。
  rationale: 悪徳表の文脈により肯定的な「熱心」は適さないが、「ねたみ」と「嫉妬」のいずれも可能なため、別訳を注記した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、勧告としての格調とパウロの「歩む」という比喩を保持した。「放縦」「淫行」はやや改まった語だが、悪徳表の簡潔さと品位を保ち、一般読者にも理解可能である。
