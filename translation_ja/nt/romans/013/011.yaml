id: ROM.13.11
reference: Romans 13:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: ja
  text: そして、今がどのような時かをわきまえて、このことを行いなさい。今はすでに、あなたがたが[a]眠りから目を覚ます時です。私たちの救いは、私たちが信じた時[b]よりも今や近いのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「あなたがたが」に当たる箇所を「私たちが」とする。
    reason: textual_variant
  - marker: b
    text: 「私たちが初めて信じた時」とも訳せる。ギリシア語本文は単に「私たちが信じた時」と言う。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: そして、……このことを行いなさい
  rationale: τοῦτοは直前の勧めを受ける。ギリシア語では省略されている命令の力を文脈から補い、現代日本語として明瞭にした。
- source_word: εἰδότες τὸν καιρόν
  choice: 今がどのような時かをわきまえて
  rationale: καιρόςは単なる時刻ではなく、意味を帯びた決定的な時を指す。「わきまえて」により分詞の認識的・状況的な含みを自然に表した。
- source_word: ὅτι ὥρα ἤδη
  choice: ……べき時は、すでに来ています
  rationale: ὥραの切迫感とἤδηの「すでに」を保ちつつ、日本語で自然な述語表現とした。
- source_word: ὑμᾶς
  choice: あなたがたが
  rationale: SBLGNT本文の二人称複数を明示した。異読の一人称複数は脚注に残した。
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: 眠りから目を覚ます
  rationale: 眠りの比喩をそのまま保ち、現代日本語で自然かつ品位のある表現とした。
- source_word: νῦν γὰρ ἐγγύτερον
  choice: 今やさらに近づいているからです
  rationale: γάρの理由提示、νῦνの現在性、比較級ἐγγύτερονを明瞭に表した。
- source_word: ἡ σωτηρία
  choice: 私たちの救い
  rationale: 救いが信者に属しながら、なお近づきつつあるという終末論的な緊張を限定せずに保持した。
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: 私たちが信じた時よりも
  rationale: 原文は「初めて」に相当する語を含まないため補わず、ἐπιστεύσαμενの簡潔さを保った。
theological_decisions:
- issue: 信じた者にとって「救い」がなお近づいているという表現
  choice: 「私たちの救い」を限定せず、そのまま未来へ近づくものとして訳す
  alternative: 「最終的な救い」「主の再臨時の救い」「救いの完成」
  rationale: 本文は救いを「私たちのもの」としつつ、なお近づいているとも述べる。特定の教理的段階に狭めず、すでに／いまだの緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、勧告としての切迫感と聖書本文にふさわしい品位を両立させた。「救い」の意味は教派的に限定せず、原文の神学的緊張を保った。脚注記号は、それぞれが説明する語句の直後に配置した。
