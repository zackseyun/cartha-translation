  - severity: low
    issue: 「べき」の付加的な含み
    rationale: 「目を覚ますべき時」は勧告の文脈では可能だが、原文は「目を覚ます時」と述べる。「べき」を省くことで、本文の時間的緊急性を保ちつつ余分な義務表現を避けられる。
