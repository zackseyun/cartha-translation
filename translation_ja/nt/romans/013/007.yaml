  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: ja
  text: すべての人に、その人に負っているものを返しなさい。税を受けるべき人には税を、関税を受けるべき人には関税を、恐れを受けるべき人には恐れを、敬意を受けるべき人には敬意を払いなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: 返しなさい／払いなさい
  rationale: 基本義は「返す、支払う、与えるべきものを与える」。冒頭では負債との結び付きを保つため「返しなさい」、列挙の結びでは自然な日本語として「払いなさい」とした。
- source_word: φόρον
  choice: 税
  rationale: 人や土地などに課される直接税・貢納を指しうる語で、一般的かつ文脈に適した「税」とした。
- source_word: τέλος
  choice: 関税
  rationale: φόροςとの区別を示し、物品などに課される間接税・通行税・関税を表しうる語として「関税」を選んだ。
- source_word: φόβον
  choice: 恐れ
  rationale: 原語の明示的な「恐れ」を弱めて「尊敬」だけに限定せず、直前の服従に関する文脈にある緊張と意味の幅を保持した。
- source_word: τιμήν
  choice: 敬意
  rationale: 人に与えるべき「誉れ、尊重」を現代日本語で自然に表し、φόβοςとの区別も保つ。
theological_decisions:
- issue: 権威に対する φόβος の強さ
  choice: 「恐れ」と訳し、原語の強さを保持する
  alternative: 「尊敬」「畏敬」
  rationale: 「尊敬」では τιμή との区別が曖昧になり、原文の表現を弱める。「畏敬」は宗教的含意を加えやすいため避けた。
- issue: πᾶσι の範囲
  choice: 「すべての人に」とし、対象を限定しない
  alternative: 「彼らすべてに」「すべての権威者に」
  rationale: 文脈上は統治者を含むが、本文自体の一般的な表現を保ち、訳文で範囲を狭めない。
translation_notes:
  register: 命令の簡潔さと反復的な修辞を保ちつつ、明瞭で格調ある現代標準日本語とした。「税／関税」「恐れ／敬意」の対比を明示し、原文の四項列挙を維持した。
