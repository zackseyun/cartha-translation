id: ROM.13.14
reference: Romans 13:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: ja
  text: むしろ、主イエス・キリストを身にまといなさい。そして、肉の欲望を満たすための備えをしてはなりません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉」とは、ここでは神に従う生き方に逆らう、罪に傾いた人間の欲求や衝動を指す。「罪深い性質」とも訳せる。
    reason: σάρξ の字義を保ちながら、この文脈での比喩的意味と訳の可能性を示すため。
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: 身にまといなさい
  rationale: 衣服を着る比喩を保ちつつ、ある生き方や人格を自分のものとするよう命じる中動態の含意を、自然で格調ある現代日本語で表す。
- source_word: κύριον
  choice: 主
  rationale: イエスに対する称号としての神学的重みを保つ、定着した訳語。
- source_word: Χριστόν
  choice: キリスト
  rationale: 日本語では「イエス・キリスト」が称号を含む固有の呼称として広く定着しており、原文の語順を自然に表せる。
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: 備えをしてはなりません
  rationale: 前もって考え、必要なものを用意するという πρόνοια と ποιεῖσθε の結び付きを簡潔に表す。
- source_word: σάρξ
  choice: 肉
  rationale: 倫理的文脈でもパウロの語を直訳し、「罪深い性質」と限定して解釈することを避け、神学的な緊張を保つ。
- source_word: εἰς ἐπιθυμίας
  choice: 欲望を満たすための
  rationale: εἰς が示す目的・帰結を日本語として明瞭にし、備えが肉の欲望の実現へ向けられることを表す。
theological_decisions:
- issue: 倫理的文脈における σάρξ の訳
  choice: 肉
  alternative: 罪深い性質
  rationale: ここでは神に逆らう人間の衝動が念頭にあるが、「罪深い性質」とするとパウロの比喩と人間理解を狭く確定してしまうため、本文では「肉」を保持し、注で意味を補う。
- issue: Χριστός の日本語表記
  choice: キリスト
  alternative: メシア
  rationale: Χριστός は称号に由来するが、日本語の「主イエス・キリスト」は自然で定着した聖書語法である。「メシア」と言い換えて意味を明示するより、原文の呼称を一般読者に通じる形で保つ。
translation_notes:
  register: 明快な現代標準日本語。命令の厳粛さと衣服の比喩を保ち、「肉」は本文に残して注で説明した。
