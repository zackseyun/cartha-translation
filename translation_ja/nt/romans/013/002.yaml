id: ROM.13.2
reference: Romans 13:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: ja
  text: したがって、権威に逆らう者は、神の定め[a]に逆らっているのです。逆らった者たちは、自ら裁き[b]を受けることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神が定めた秩序」とも訳せます。
    reason: lexical_alternative
  - marker: b
    text: 「裁き」は「有罪判決」または「断罪」とも訳せますが、ここでのギリシア語が必ずしも最終的な断罪という強い意味を要求するわけではありません。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: したがって
  rationale: 直前の節から導かれる帰結を示す推論の接続語として、論理的な力を自然な現代日本語で表す。
- source_word: ὁ ἀντιτασσόμενος
  choice: 逆らう者
  rationale: 冠詞付き現在分詞の一般的・実質的用法を表し、権威に対して抵抗する者を簡潔に示す。
- source_word: τῇ ἐξουσίᾳ
  choice: 権威
  rationale: 単数形を保ちつつ、統治権力を指すことは直前の文脈に委ねる。
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: 神の定め
  rationale: διαταγήが表す、神によって定められた秩序・取り決め・命令という幅を、過度に法令的に限定せず表す。
- source_word: ἀνθέστηκεν
  choice: 背いている
  rationale: 完了形が示す、すでに取られ現在も意味を持つ対抗的な立場を表す。前半の「逆らう」と意味上の対応を保ちつつ、不自然な反復を避ける。
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: 背いた者たちは
  rationale: 完了分詞が示す、権威および神の定めに対抗する立場を取った者たちを表す。
- source_word: ἑαυτοῖς
  choice: 自ら
  rationale: その結果が抵抗した当人たちに帰するという再帰的な意味を自然な日本語で示す。
- source_word: κρίμα
  choice: 裁き
  rationale: 「有罪判決」「断罪」まで含み得る語だが、この箇所だけでは最終的な永遠の断罪に限定されないため、より広い「裁き」とする。
- source_word: λήμψονται
  choice: 受けることになります
  rationale: 未来形による帰結を明確にし、「受ける」という基本的な動詞の意味を保つ。
theological_decisions:
- issue: κρίμαの範囲
  choice: 裁き
  alternative: 有罪判決、断罪
  rationale: 警告の重大さを保ちながら、この節が明示していない最終的・永遠的な断罪に意味を限定しない。
- issue: ἐξουσίαの指示対象
  choice: 文脈上の統治権威を指す「権威」
  alternative: より一般的・抽象的な権威
  rationale: ローマ13章1節の直近の文脈は統治する権威を扱っているが、本文では原語の単数形と簡潔さを保ち、「統治する」などの説明を追加しない。
- issue: 神の定めと現存する権威との関係
  choice: 原文どおり、権威への抵抗が神の定めへの抵抗となるという命題を保持
  alternative: 権威の正当性に関する条件や例外を本文に補う
  rationale: この一節自体が述べる緊張を保ち、本文にない政治神学上の条件や例外を翻訳へ持ち込まない。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、聖書本文としての品位を保った。「権威」「神の定め」「裁き」という簡潔な語を選び、文脈を越える説明や特定教派の立場を本文に加えていない。
