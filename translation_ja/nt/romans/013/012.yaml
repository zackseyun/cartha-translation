  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: ja
  text: 夜はすでに更け[a]、日は近づきました。ですから、闇の行いを脱ぎ捨て、光の武具[b]を身に着けましょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「夜はかなり進んだ」。ギリシア語の動詞は、夜が進行したこと、すなわち夜が大きく過ぎ去ったことを表します。
    reason: lexical_alternative
  - marker: b
    text: 「光の武器」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ νὺξ
  choice: 夜
  rationale: 「日」と対をなす時間的な比喩をそのまま保ち、ここで「暗闇」や「悪の時代」と説明的に置き換えない。
- source_word: προέκοψεν
  choice: 更け
  rationale: 本来は「進んだ」を意味するが、日本語では夜がかなり進んだことを「夜は更けた」と自然に表せる。アオリストの進展のイメージは脚注で補う。
- source_word: ἡ ἡμέρα
  choice: 日
  rationale: 「夜」との時間的・倫理的・終末論的な対比を保ち、その指示内容を訳文で限定しない。
- source_word: ἤγγικεν
  choice: 近づきました
  rationale: 接近した結果として今や近いという完了形の含みを、自然な現代日本語で表す。
- source_word: ἀποβαλώμεθα
  choice: 脱ぎ捨て…ましょう
  rationale: 勧告的接続法を「ましょう」で表し、後続の「身に着ける」と呼応する、衣服を脱ぐような鮮明な比喩を保つ。
- source_word: τὰ ἔργα
  choice: 行い
  rationale: 倫理的文脈で自然な日本語であり、「業」より一般読者に明瞭である。
- source_word: τοῦ σκότους
  choice: 闇の
  rationale: 原文の属格と光との対比を簡潔に保ち、「悪い」と解釈的に言い換えない。
- source_word: ἐνδυσώμεθα
  choice: 身に着けましょう
  rationale: 勧告的接続法を再現し、ἐνδύω の着衣の比喩と、前半の「脱ぎ捨てる」との対応を明確にする。
- source_word: τὰ ὅπλα
  choice: 武具
  rationale: ὅπλα は武器にも防具にもなり得る。「身に着ける」と自然に結びつきつつ、攻撃用の武器だけに狭めない「武具」を採用する。
- source_word: τοῦ φωτός
  choice: 光の
  rationale: 闇との倫理的・終末論的対比を保ち、比喩の意味を説明的に限定しない。
theological_decisions:
- issue: 夜と日の終末論的比喩
  choice: 「夜」「日」という原文の比喩をそのまま残す。
  alternative: 「暗い時代は終わりかけ、新しい時代が近い」などと意味を明示する。
  rationale: この比喩には時間的、倫理的、救済史的な含みが重なっている。説明的な訳で一つに限定せず、その緊張と広がりを保つ。
- issue: ὅπλα τοῦ φωτός の意味
  choice: 「光の武具」
  alternative: 「光の武器」または「光のよろい」
  rationale: 「身に着ける」は防具を連想させる一方、ὅπλα 自体は武器を指すこともある。「武具」は両方の可能性を比較的よく保ち、別訳を脚注に示せる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、荘重さを保ちながら過度に文語的な表現を避けた。「ですから」「ましょう」により、論理的つながりと共同体への勧告を自然に示した。
