  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: ja
  text: 支配者たちは、善い行いをする者にとっては恐るべき存在ではなく、悪い行いをする者にとっては恐るべき存在です。[a] では、あなたは権威を恐れずにいたいのですか。[b] 善を行いなさい。そうすれば、その権威から称賛を受けるでしょう。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「善い行いにとっては恐れではなく、悪い行いにとって」。ギリシア語は、一般的な倫理上の善と悪を対比しています。
    reason: lexical_alternative
  - marker: b
    text: 「では、権威を恐れたくないのですか」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「その権威」は、統治する権威を指します。
    reason: referent_clarification
lexical_decisions:
- source_word: ἄρχοντες
  choice: 支配者たち
  rationale: 統治する者、または統治上の地位にある者を指す。政治的文脈を保ちつつ、特定の官職には限定しない。
- source_word: φόβος
  choice: 恐るべき存在
  rationale: 述語名詞の具体的な用法を、日本語で自然に『恐れを引き起こす対象』として表した。
- source_word: τῷ ἀγαθῷ ἔργῳ … τῷ κακῷ
  choice: 善い行いにとって……悪い行いにとって
  rationale: 単数形のἔργῳが一般的な行為を表すことと、善悪の対照を明示した。後半で省略されている『行い』を補って自然な日本語にした。
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: それでは、あなたは……恐れずにいたいのですか
  rationale: θέλειςと否定不定詞の構造を、条件文に変えず修辞疑問として保った。δὲは文脈上の展開を『それでは』で表した。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 統治権力ないしその担い手を指す語の幅を保ち、単に個々の役人へ限定しない。
- source_word: τὸ ἀγαθὸν ποίει
  choice: 善を行いなさい
  rationale: 冠詞付き形容詞が示す一般的な倫理的善を簡潔に表した。
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: その権威から称賛を受けるでしょう
  rationale: 日本語では『称賛を持つ』より『称賛を受ける』が自然であり、ἐξ αὐτῆςの指示対象も明示した。
theological_decisions:
- issue: 支配者についての記述の範囲
  choice: 統治権威の通常または本来的な働きについての記述として訳し、本文の断定自体は保持する。
  alternative: あらゆる支配者が常に善を称賛し悪を罰するという無条件の普遍命題、または皮肉として訳す。
  rationale: 原文には限定も皮肉の明示もないため、それらを訳文に付加しない。一方、特定の教理的結論へ意味を強めることも避ける。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語。修辞疑問から命令、結果の約束へ進む原文の流れを保ち、『権威』の制度と担い手の両義性を過度に限定しない。
