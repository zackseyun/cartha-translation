  text: Τὸ δὲ τέλος πάντες ὁμόφρονες, συμπαθεῖς, φιλάδελφοι, εὔσπλαγχνοι, ⸀ταπεινόφρονες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/008.yaml
  text: Finally[a], all of you, be like-minded, sympathetic, loving as brothers, tenderhearted, humble-minded[b],
translation:
  language: ja
  text: 最後に、あなたがたは皆、心を一つにし、互いに共感し、兄弟姉妹として愛し合い[a]、あわれみ深く、謙遜な思いを持ちなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は、信仰共同体の人々をきょうだいと見る家族的な表現を用いている。「きょうだい愛に満ち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「謙遜な思い」の代わりに「礼儀正しく」または「親切で」と読んでいる。
    reason: textual_variant
lexical_decisions:
- source_word: Τὸ δὲ τέλος
  choice: 最後に
  rationale: 勧告を締めくくる要約を導く談話表現として、現代日本語で自然かつ簡潔に訳した。
- source_word: πάντες
  choice: あなたがたは皆
  rationale: 共同体全体への直接の呼びかけであることを明示した。
- source_word: ὁμόφρονες
  choice: 心を一つにし
  rationale: 単なる意見の一致に狭めず、思いや姿勢の調和と一致を自然な日本語で表した。
- source_word: συμπαθεῖς
  choice: 互いに共感し
  rationale: 他者の感情や経験を共にするという語義を保ち、相互的な共同体の文脈を明確にした。
- source_word: φιλάδελφοι
  choice: 兄弟姉妹として愛し合い
  rationale: 信仰共同体におけるきょうだい同士の家族的な愛という比喩を保ちつつ、対象が男女を含むことを自然に示した。
- source_word: εὔσπλαγχνοι
  choice: 心からあわれみ
  rationale: 内面から湧く深い同情と慈しみを表す語の情感を、読みやすく品位ある表現で伝えた。
- source_word: ταπεινόφρονες
  choice: 謙遜な思いを持ちなさい
  rationale: 謙遜が外面的な振る舞いだけでなく、心と思考の姿勢に関わるという複合語の含意を保った。
theological_decisions:
- issue: φιλάδελφοιの家族的・性別を伴う表現
  choice: 兄弟姉妹として愛し合い
  alternative: きょうだい愛に満ち
  rationale: ギリシア語のきょうだい家族の比喩を保持しながら、男女から成る信仰共同体全体への勧告であることを示した。
- issue: 節末の形容詞の本文異読
  choice: ταπεινόφρονες＝謙遜な思いを持ちなさい
  alternative: φιλόφρονες＝礼儀正しく／親切でありなさい
  rationale: SBLGNTの本文を採用し、意味の異なる異読は脚注に保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、五つの勧告を並列的なリズムでまとめた。命令の意味は節末の「持ちなさい」に集約し、原文の簡潔さと品位を保った。
