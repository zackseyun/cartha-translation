source:
  edition: SBLGNT
  text: ἀλλ’ ὁ κρυπτὸς τῆς καρδίας ἄνθρωπος ἐν τῷ ἀφθάρτῳ τοῦ ⸂πραέως καὶ ἡσυχίου⸃ πνεύματος, ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/004.yaml
  text: but the hidden person of the heart[a], in the imperishable beauty of a gentle and quiet spirit[c][b], which is very precious before God.
translation:
  language: ja
  text: むしろ、心の内に隠れた人[a]、すなわち、柔和で穏やかな霊の朽ちることのない美しさ[b][c]です。これは神の御前で非常に尊いものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「心の隠れた人」。内面の自己を指します。
    reason: lexical_alternative
  - marker: b
    text: 原文は直訳すると「柔和で穏やかな霊の朽ちないもの」という圧縮された表現です。「美しさ」は前節の外面的な装いとの対比から補いました。
    reason: lexical_alternative
  - marker: c
    text: 「穏やかな」は、必ずしも黙っていることではなく、平静で争いを起こさない性質を表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: 心のうちに隠れた人
  rationale: 「内なる人」と意味を明示しすぎず、κρυπτόςの「隠れた」とἄνθρωποςの一般的な「人」を保つ。文脈上は内面の自己を指す。
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: 朽ちることのない美しさで
  rationale: ギリシア語は名詞が省略された圧縮表現である。直前の外面的な装いとの対比から「美しさ」を補い、日本語として意味を明瞭にした。補足であることは脚注に示す。
- source_word: πραέως
  choice: 柔和な
  rationale: 穏やかさと相手を威圧しない性質を表す、現代日本語の聖書的・品位ある語として採用した。
- source_word: ἡσυχίου
  choice: 穏やかな
  rationale: 単に発言しないことではなく、平静で争いを起こさない性質を表すため、「静かな」より誤解の少ない表現とした。
- source_word: πνεύματος
  choice: 霊
  rationale: 「性質」と意訳せず、原文の人間論的表現と解釈の幅を保った。
- source_word: ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές
  choice: これは神の御前で非常に尊いものです
  rationale: 関係代名詞が直前の霊ないしその朽ちない美しさを受ける曖昧さを「これ」で保ち、神による高い評価を自然な日本語で表した。
theological_decisions:
- issue: 性別を伴う文脈でのἄνθρωπος
  choice: 「人」と訳し、内面の自己を指す表現とした。
  alternative: 「心の隠れた人間」「内なる人」
  rationale: ἄνθρωποςはここで男性を特定せず、人の内面的自己を指す。「内なる」は分かりやすいが、κρυπτόςの「隠れた」という像を弱めるため本文では避けた。
- issue: ἀφθάρτῳに省略された名詞の補足
  choice: 文脈に基づいて「美しさ」を補った。
  alternative: 「柔和で穏やかな霊の朽ちないもの」「朽ちない性質」
  rationale: 3節の外面的な装いとの対照を自然な日本語で示すため。ただし原文に「美しさ」という名詞は明記されていないので脚注で透明性を確保した。
- issue: 関係代名詞ὅの指示対象
  choice: 「これ」とし、柔和で穏やかな霊とその朽ちない美しさの複合全体を受け得る形にした。
  alternative: 「その霊は」「その美しさは」
  rationale: 原文の中性関係代名詞は直前の表現をまとめて受けると考えられ、指示対象を一方に限定しない訳が適切である。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格調を保った。「御前」「柔和」は本文の宗教的文脈に適した語として残した。命令「飾りなさい」は3節から続く対比と省略を日本語で明示するために補っている。
