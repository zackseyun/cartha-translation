source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: ja
  text: 彼らはかつて、ノアの時代に箱舟が造られていた間、神が忍耐をもって待っておられた時に、従わなかった者たちです。その箱舟に入って、水を通って無事に救われたのは、わずかな人々、すなわち八人[a]だけでした[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「八つの魂」。ここで「魂」は人を指します。
    reason: lexical_alternative
  - marker: b
    text: 別訳「水によって無事に救われた」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: 従わなかった者たち
  rationale: 拒んで従わないことを表す語であり、「信じなかった」と知的な不信だけに限定せず、不従順の意味を明確にした。
- source_word: ποτε
  choice: かつて
  rationale: 本文の叙述より前の時を自然な現代日本語で示す。
- source_word: ἀπεξεδέχετο
  choice: 待っておられた
  rationale: 未完了過去が示す継続的な待機を表した。敬語は神を主語とする日本語として自然である。
- source_word: ἡ τοῦ θεοῦ μακροθυμία
  choice: 神が忍耐深く
  rationale: 直訳的な「神の忍耐が待っていた」は日本語では不自然なため、神を主語にして、裁きを猶予する忍耐を副詞的に表した。
- source_word: κατασκευαζομένης
  choice: 造られていた
  rationale: 箱舟の建造が進行中であったことを、受動の継続表現で明確にした。
- source_word: κιβωτοῦ
  choice: 箱舟
  rationale: ノアの物語における定着した正確な訳語である。
- source_word: εἰς ἣν
  choice: その箱舟に入って
  rationale: εἰςが示す箱舟の中への移動を保ちつつ、自然な日本語の節にした。
- source_word: ὀλίγοι
  choice: わずかな人々
  rationale: 救われた人数の少なさを明瞭に表す。
- source_word: ψυχαί
  choice: 人々
  rationale: ここでは人間を数える換喩であり、心身を分離する含意を避けて明瞭に訳した。字義的な訳は脚注に残した。
- source_word: διεσώθησαν
  choice: 無事に救われた
  rationale: 危険の中を安全に通されるというδιασῴζωの具体的な意味を「無事に」で示しつつ、「救われた」という語も保持した。
- source_word: δι’ ὕδατος
  choice: 水を通り
  rationale: 洪水の水の中を通って保護されたという文脈を自然に表す。διάの手段的理解も可能なため、脚注に代案を示した。
theological_decisions:
- issue: διεσώθησαν δι’ ὕδατοςにおける救いと水の関係
  choice: 水を通り、無事に救われた
  alternative: 水によって救われた
  rationale: 洪水を通過して保護されたという具体的出来事を本文で示しつつ、διάを手段と取る可能性を脚注に残し、次節の洗礼との関係を訳文で一義的に決めないようにした。
- issue: ψυχαίの人間観に関わる訳語
  choice: 人々
  alternative: 魂
  rationale: ここでは箱舟にいた人間の人数を数えており、肉体から区別された魂についての技術的主張ではない。字義的対応は脚注で示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。前節から続く「彼ら」を補って文を成立させた。原文の長い統語構造は二文に分けたが、ノアの時代、箱舟の建造、神の忍耐、不従順、八人の救出という論理関係を保持した。
