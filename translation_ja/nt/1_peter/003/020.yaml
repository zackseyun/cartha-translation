revisions:
- from: 彼らはかつて、ノアの時代に箱舟が造られていた間、神が忍耐深く待っておられた時に、従わなかった者たちです。その箱舟に入って、水を通り、無事に救われたのは、わずかな人々、すなわち八人[a]だけでした[b]。
  to: 彼らはかつて、ノアの時代に箱舟が造られていた間、神が忍耐をもって待っておられた時に、従わなかった者たちです。その箱舟に入って、水を通って無事に救われたのは、わずかな人々、すなわち八人[a]だけでした[b]。
  rationale: 原文の意味と曖昧さを保ったまま、διὰ ὕδατοςに対応する日本語を自然化し、脚注bを当該語句の代案として簡潔かつ正確に整えました。「神が忍耐をもって待っておられた」は、神の忍耐が待機していたという原文の表現を、現代日本語で無理なく表すものです。
