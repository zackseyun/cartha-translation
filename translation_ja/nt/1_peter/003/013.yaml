id: 1PE.3.13
reference: 1 Peter 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ τίς ὁ κακώσων ὑμᾶς ἐὰν τοῦ ἀγαθοῦ ⸀ζηλωταὶ γένησθε;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/013.yaml
  text: And who will harm you if you become zealous for what is good?[a]
translation:
  language: ja
  text: 善いことに熱心な者となるなら、だれがあなたがたに害を加えるでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「善いことを熱心に求めるなら」。
    reason: ζηλωτήςは「熱心な者」だけでなく、何かを熱心に求める者という意味でも表せるため。
lexical_decisions:
- source_word: Καὶ
  choice: （訳出せず）
  rationale: 前後の流れを受ける接続詞だが、日本語では文脈上明らかなため、独立した節として自然に読めるよう明示しない。
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: だれがあなたがたに害を加えるでしょうか
  rationale: 実質的に名詞化された未来分詞を、未来的な意味を保つ自然な修辞疑問として訳した。複数のὑμᾶςは「あなたがた」と明示した。
- source_word: ἐὰν
  choice: なら
  rationale: 接続法を伴う条件を、簡潔で自然な現代日本語の条件表現で示した。
- source_word: τοῦ ἀγαθοῦ
  choice: 善いことに
  rationale: 中性形が表す抽象的な「善」を、ζηλωταίの対象として自然な日本語にした。
- source_word: ζηλωταὶ γένησθε
  choice: 熱心な者となる
  rationale: ζηλωτήςの名詞的表現とγίνομαιの「なる」という変化の含意をともに保った。「熱心」は強い意欲・献身を伝える。
theological_decisions:
- issue: 義を行っても苦しむ可能性と修辞疑問の関係
  choice: 「だれが…害を加えるでしょうか」という一般的な励ましとして修辞疑問を保持する。
  alternative: 信者にはだれも真の意味で害を与えられない、という絶対的保証として明確化する。
  rationale: 直後の文脈は善を行って苦しむ可能性を認めているため、苦難からの絶対的免除とはせず、原文の修辞性と神学的緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「善い」は倫理的な善を示し、「害を加える」は広い意味の危害や不当な扱いを含む。
