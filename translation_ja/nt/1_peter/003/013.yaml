  source_fidelity: 原文の修辞疑問「καὶ τίς ὁ κακώσων ὑμᾶς」と条件節「ἐὰν…γένησθε」を適切に反映している。「だれがあなたがたに害を加えるでしょうか」は未来的・一般的な問いの力を保ち、「善いことに熱心な者となるなら」はτοῦ ἀγαθοῦ、ζηλωταί、γένησθεを過不足なく表す。
  naturalness: 明瞭な現代標準日本語であり、文の語順も自然である。「あなたがた」は原文の複数を明示し、公共的な聖書翻訳として許容される格調を備える。「善いこと」はやや文語的な表記だが、倫理的な善を指す文脈で自然に機能している。
