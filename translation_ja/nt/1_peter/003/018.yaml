id: 1PE.3.18
reference: 1 Peter 3:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: ja
  text: キリストもまた、罪のためにただ一度、苦しみを受けられました[a]。正しい方が正しくない者たちのために苦しまれたのです。それは、あなたがたを神のもとへ導くためでした。キリストは肉においては死に渡され、霊においては生かされました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本では「苦しみを受けられました」の代わりに「死なれました」とあります。
    reason: textual_variant
  - marker: b
    text: 「霊においては生かされました」は、「御霊によって生かされました」とも訳せます。ギリシア語の「霊」は、霊という領域・側面を指すとも、聖霊の働きを指すとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: キリスト
  rationale: 日本語で定着した称号「キリスト」を用い、単なる固有名としてではなく救い主としての称号を保つ。
- source_word: ἅπαξ
  choice: ただ一度
  rationale: 一回性を明確にしつつ、「一度限りで永遠に」など本文以上の強調は加えない。
- source_word: περὶ ἁμαρτιῶν
  choice: 罪のために
  rationale: 贖罪・犠牲の文脈における自然な日本語であり、原因だけに限定せず、罪に関わる受難の目的と意義を表す。
- source_word: ἔπαθεν
  choice: 苦しみを受けられました
  rationale: SBLGNTの本文「苦しんだ」に従い、異読「死んだ」は脚注に示す。尊敬表現は現代日本語の聖書文体として主語への敬意を自然に表す。
- source_word: δίκαιος
  choice: 正しい方
  rationale: 実体詞的な形容詞を自然な日本語にし、続く「正しくない者たち」との対照を保つ。
- source_word: ὑπὲρ ἀδίκων
  choice: 正しくない者たちのために
  rationale: 他者の利益のため、また代表的・身代わり的な含みを保ちながら、特定の贖罪理論まで明示しない。
- source_word: προσαγάγῃ
  choice: 神のもとへ導く
  rationale: 神の臨在へ近づけ、近づく道を開くという語義を、明瞭で自然な日本語で表す。
- source_word: θανατωθεὶς
  choice: 死に渡されました
  rationale: 受動態を保ちながら、単なる自然死ではなく死に処されたことを自然に表す。
- source_word: σαρκὶ
  choice: 肉において
  rationale: πνεύματιとの平行関係を保ち、「罪深い性質」と解釈せず、身体を伴う死すべき存在の側面・領域を示す。
- source_word: ζῳοποιηθεὶς
  choice: 生かされました
  rationale: 受動態を簡潔かつ自然に保持する。
- source_word: πνεύματι
  choice: 霊において
  rationale: 領域・側面を表す読みを本文に置き、聖霊の働きを表す手段・行為者の読みも脚注で保持する。
theological_decisions:
- issue: 最後の節における「肉／霊」の対照
  choice: 「肉において……霊において」とし、平行する二つの与格を領域・側面として読める形にした。
  alternative: 「肉体において……御霊によって」または「肉体では……霊では」
  rationale: ギリシア語は簡潔で、πνεύματιが存在の領域・側面を指すのか、聖霊を行為者として指すのか確定しない。本文で一方に限定せず、別の読みを脚注に残す。
- issue: 「正しい方が正しくない者たちのために」の意味
  choice: 代表的・身代わり的な力を持つ「ために」を用いた。
  alternative: 「罪のない方が罪人に代わって」などの説明的表現
  rationale: ὑπέρが示す他者のためという意味を保つ一方、本文が明示しない詳細な贖罪理論や、「正しい」を「罪のない」に置き換える解釈は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、敬体による品位ある聖書文体とした。長いギリシア語文は意味関係が読み取りやすいよう四文に分けた。「キリスト」は日本語で定着した称号として用い、「正しい方／正しくない者たち」の対照と「肉において／霊において」の平行を保持した。脚注記号[a]は本文異読の直後、[b]は「霊において」の解釈に関わる最後の対照節へ入る前に置いた。
