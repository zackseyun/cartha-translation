source:
  edition: SBLGNT
  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: ja
  text: あなたがたの飾りは、髪を編むことや金の装飾品を身に着けること、あるいは衣服を着ることといった外面的な飾りであってはなりません[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「あなたがたの飾りは、髪を編むこと、金の装飾品を身に着けること、あるいは衣服を着ることという外面的なものであってはならない」。次節は「心の内にある隠れた人」と対照させるため、この箇所は外面的な装いを全面的に禁じるよりも、内なる品性を優先するよう求めるものと理解されることがあります。
    reason: 原文の否定命令を保ちつつ、「単に」という原文にない限定を本文へ加えず、文脈に基づく比較的・優先順位的理解を脚注で示すため。
lexical_decisions:
- source_word: ὧν
  choice: あなたがたの
  rationale: 前節で呼びかけられている妻たちを受ける属格複数の関係代名詞。日本語では所有を明示する「あなたがたの」が自然である。
- source_word: ἔστω οὐχ
  choice: であってはなりません
  rationale: εἰμίの三人称現在命令をοὐχが否定する勧告を、明瞭で品位ある現代日本語の禁止表現で示した。
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: 外面的な……飾り
  rationale: κόσμοςはここでは「世界」ではなく、整えること・装飾を表す。ἔξωθενとの結びつきを保ち、次節の内面的なものとの対照が伝わる表現とした。
- source_word: ἐμπλοκῆς τριχῶν
  choice: 髪を編むこと
  rationale: ἐμπλοκήの行為名詞としての性格と、τριχῶνとの属格構文を自然な日本語で表した。
- source_word: περιθέσεως χρυσίων
  choice: 金の装飾品を身に着けること
  rationale: περίθεσιςは周りに置く、身に着ける行為を表し、χρυσίωνは金製の品、特に装飾品を指す。
- source_word: ἢ ἐνδύσεως ἱματίων
  choice: 衣服を着ること
  rationale: ἢの選言と、ἐνδύσεως ἱματίωνの着衣行為を簡潔に表した。文脈にない「上等な」などの限定は加えていない。
theological_decisions:
- issue: 外面的な身だしなみを全面的に禁じるのか、内面的な品性より優先しないよう求めるのか
  choice: 本文ではギリシャ語の否定命令をそのまま保ち、比較的・優先順位的な理解は脚注で示す
  alternative: 「単に外面的なものであってはなりません」と本文で補い、全面禁止ではないことを明示する
  rationale: 原文には「単に」に相当する語がなく、否定表現そのものには強さがある。一方、次節との対照と、一覧に「衣服を着ること」まで含まれることは、主眼が外見の全面禁止ではなく内なる人の優先にある可能性を強く示す。本文で曖昧さを消さず、脚注で文脈上の理解を説明した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告の厳粛さを保った。原文の文が次節へ続くことを末尾のダッシュで示した。「装飾品」は日常的に理解でき、かつ「アクセサリー」より聖書本文にふさわしい落ち着いた語調である。
