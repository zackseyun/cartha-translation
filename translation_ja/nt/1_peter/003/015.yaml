reference: 1 Peter 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: ja
  text: むしろ、主であるメシアを、あなたがたの心の中で聖なる方として敬いなさい。[a] あなたがたのうちにある希望について理由を尋ねるすべての人に対して、いつでも弁明をする用意をしていなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳すれば、「あなたがたの心の中で、主であるメシアを聖別しなさい」。ここで「聖別する」とは、メシアを聖なる主として認め、敬うことを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「弁明」は、法廷での弁護や説明にも用いられる語である。単なる言い逃れを意味しない。
    reason: lexical_clarification
lexical_decisions:
- source_word: κύριον ... τὸν Χριστὸν
  choice: メシアを主として
  rationale: Χριστόςを称号として「メシア」と訳し、κύριοςの「主」を保った。語順を日本語として自然に整えつつ、メシアを主と認める告白的な構文を明示した。
- source_word: ἁγιάσατε
  choice: 聖なる方としなさい
  rationale: 基本義である「聖別する、聖なるものとする」を保ちつつ、信者がメシア自身を聖なる存在に変えるという誤解を避け、心の中で聖なる方として認め、崇敬する意味を表した。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: あなたがたの心の中で
  rationale: καρδίαが表す内面の領域と複数形の受け手を、明瞭な現代日本語で保持した。
- source_word: ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν
  choice: 弁明できるよう、いつも用意していなさい
  rationale: ἀπολογίαの弁護・説明という含みを「弁明」で保ち、述語的なἕτοιμοιとἀείを自然な命令表現にした。
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον
  choice: 理由を求める人には誰にでも
  rationale: λόγοςをこの文脈で「理由、説明」と解し、παντίの包括的・分配的意味を「誰にでも」で表した。
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: あなたがたのうちにある希望について
  rationale: ἐν ὑμῖνが個々人の内面にも共同体の中にも関わり得る余地を、「あなたがたのうちに」で保った。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここではκύριοςと結びつく称号としての性格が明瞭であるため、固有名のように音写せず「メシア」とした。
- issue: ἁγιάσατεがメシアを目的語に取る意味
  choice: メシアを主として聖なる方としなさい
  alternative: 主であるメシアを聖別しなさい
  rationale: 原語の聖性の語義を残しながら、人がメシアを本質的に聖化するとの誤解を避け、主として聖なる方と認め敬う命令として表現した。
- issue: ἐν ὑμῖνの範囲
  choice: あなたがたのうちにある
  alternative: あなたがたの心にある
  rationale: 個人的内面に限定せず、複数の受け手の内または共同体の中という原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「メシア」「主」「聖なる方」「弁明」など原文の称号的・法廷的な響きを保った。命令の厳粛さを維持し、過度に口語的な表現は避けた。
