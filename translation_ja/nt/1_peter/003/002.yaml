  text: ἐποπτεύσαντες τὴν ἐν φόβῳ ἁγνὴν ἀναστροφὴν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/002.yaml
  text: when they observe your pure conduct in fear.
translation:
  language: ja
  text: 彼らが、あなたがたが畏れをもって営む清い生き方を目にするときです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「畏れ」：ギリシア語は畏れの対象を明記していません。神への畏敬と理解することもできます。
    reason: ἐν φόβῳ の対象について、本文が保持する曖昧さを明示しつつ、自然な日本語本文を保つため。
lexical_decisions:
- source_word: ἐποπτεύσαντες
  choice: 目にする
  rationale: 単に気づくのではなく、実際に目撃し観察する意味を自然な日本語で表した。分詞は文脈上の従属関係を保ち、「からです」とした。
- source_word: τὴν ... ἁγνὴν ἀναστροφὴν
  choice: 純真な生き方
  rationale: ἁγνός は道徳的・性的な清さを含む「純真な」、ἀναστροφή は一時的な行為でなく生活態度・振る舞い全体を指すため「生き方」とした。
- source_word: ἐν φόβῳ
  choice: 神を畏れる
  rationale: 直訳は「畏れのうちに」。直前の3:1の夫ではなく、1ペトロ書での用法（1:17、2:17–18）に照らして神への畏敬と理解し、恐怖との誤解を避けるため対象を補った。
theological_decisions:
- issue: ἐν φόβῳ の畏れの対象
  choice: 神への畏れと明示する
  alternative: 「畏れのうちに」と対象を明示しない
  rationale: ギリシア語自体は対象を明記しないため曖昧さはあるが、書簡内の語法と、妻が夫を恐れることを勧めるとの誤読を避ける必要から、神への敬虔な畏れを本文で明示した。
translation_notes:
  register: 現代の一般読者に分かりやすく、かつ品位のある文体。「純真」は「清い」よりも、この箇所で焦点となる誠実で汚れのない生活態度を伝えやすい。節単独では理由節なので、前節とのつながりを示す「からです」で結んだ。
