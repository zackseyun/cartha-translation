review_pass:
  verdict: revise
  source_fidelity: 'ἐποπτεύσαντες is an aorist participle functioning temporally in the sentence continued from 3:1: “when they observe,” not a straightforward causal “because.” The object of φόβος is not expressed in this verse; specifying God resolves an ambiguity that the Greek leaves open. ἁγνή is better represented by 「清い」 than 「純真な」, which can primarily suggest innocence or sincerity rather than moral purity.'
  naturalness: 「畏れをもって営む清い生き方」 is clear, contemporary, and suitably dignified. Retaining a temporal dependent clause appropriately reflects both the Greek syntax and this verse’s dependence on the preceding verse.
  terminology: 「清い」 preserves the ethical and likely marital-purity sense of ἁγνή without narrowing it to a denominational interpretation. 「畏れ」 preserves φόβος while the note records that its object is unstated.
  issues:
  - severity: high
    issue: 「からです」が分詞を因果関係として固定している。
    rationale: 原文の ἐποπτεύσαντες は前節の主節にかかる時間的分詞であり、英語POBも “when” としている。因果に限定しない訳にする必要がある。
  - severity: medium
    issue: 「神を畏れる」が φόβος の対象を本文で補っている。
    rationale: この節のギリシア語は畏れの対象を明示しない。書簡内の用法から神への畏敬は有力でも、本文では曖昧さを保つべきである。
  - severity: medium
    issue: 「純真な」は ἁγνή の清さ・純潔の含意を十分に表さない。
    rationale: 「清い」は道徳的な清さを自然に表し、文脈上の含意も保持する。
  revised_text: 彼らが、あなたがたが畏れをもって営む清い生き方を目にするときです。[a]
