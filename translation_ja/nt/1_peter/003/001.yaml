id: 1PE.3.1
reference: 1 Peter 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: ja
  text: 同じように、妻たちよ、自分の夫に従いなさい。たとえ、みことばに従わない夫がいるとしても[a]、妻たちの生き方を通して、ことばを用いずに[b]、夫たちが獲得されるようになるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「みことばに従わない」は、「知らせを受け入れない」、すなわち福音を信じようとしない、という意味にも取れる。
    reason: ἀπειθέωには、不従順と不信の両方の含みがあるため。
  - marker: b
    text: 「ことばを用いずに」は、妻たちがことばで説得しなくても、という意味。
    reason: ἄνευ λόγουは、妻たちの発言や言葉による説得なしに、という文脈上の含みを表すため。
lexical_decisions:
- source_word: Ὁμοίως
  choice: 同じように
  rationale: 直前の勧めとのつながりを示す談話接続表現として、自然な現代日本語で明示した。
- source_word: γυναῖκες
  choice: 妻たちよ
  rationale: 「自分の夫」と対になっているため、一般的な「女性」ではなく婚姻関係を表す「妻」とした。
- source_word: ὑποτασσόμεναι
  choice: 従いなさい
  rationale: 日本語では分詞のままでは不自然なため、文脈上補われる勧告として訳した。「服従しなさい」より日常的でありつつ、秩序ある関係に身を置く意味を保ち、「言うことを何でも聞く」という強い意味は加えていない。
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: 自分の夫に
  rationale: ἀνήρはここでは夫を指し、ἰδίοιςの強調も「自分の」によって保持した。
- source_word: ἵνα καὶ εἴ τινες
  choice: たとえ…がいても、…ためです
  rationale: καίを伴う条件節の譲歩的な力と、ἵναの目的・期待される結果を日本語で自然に表した。
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: みことばに従わない
  rationale: ἀπειθέωが持つ不信と不従順の重なりを、「従わない」によって保持した。τῷ λόγῳはこの文脈で福音の知らせを指すが、本文では聖書的な慣用表現「みことば」とした。
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: 妻の生き方によって
  rationale: ἀναστροφήは単発の振る舞いより生活態度・生き方を表す。属格は該当する夫たちの妻を指すものとして自然に訳した。
- source_word: ἄνευ λόγου
  choice: ことばによらずに
  rationale: 直前のτῷ λόγῳとの語の響きを「みことば／ことば」である程度保ち、妻による言葉での説得なしに、という含みを過度に説明しなかった。
- source_word: κερδηθήσονται
  choice: 得られる
  rationale: κερδαίνωの受動態が持つ「獲得される、勝ち取られる」という比喩を保持した。「信仰に導かれる」と解釈を限定しすぎない表現を選んだ。
theological_decisions:
- issue: ὑποτασσόμεναιが表す夫婦関係
  choice: 「自分の夫に従いなさい」とし、本文以上の絶対的服従や妻の劣等性を加えない。
  alternative: 「自分の夫に服従しなさい」「自分の夫の言うことを聞きなさい」
  rationale: 原語は関係上の秩序を表すが、「従順である」を表す別の動詞そのものではない。勧めの力を保ちつつ、本文にない教理的主張を持ち込まないようにした。
- issue: ἀπειθοῦσιν τῷ λόγῳにおける不信と不従順
  choice: 「みことばに従わない」と訳す。
  alternative: 「福音を信じない」「知らせに聞き従わない」
  rationale: ἀπειθέωには信じないことと従わないことの双方が重なる。「従わない」は意志的・倫理的な含みを保ち、脚注で福音を受け入れない意味を明らかにした。
- issue: κερδηθήσονταιの到達点
  choice: 「得られる」と比喩を保つ。
  alternative: 「信仰に導かれる」「救われる」「勝ち取られる」
  rationale: 文脈上は夫が福音へと獲得されることを指すが、「救われる」と明示して原文より限定せず、また人間が救いを実現するとの含みも避けた。
translation_notes:
  register: 明瞭で品位ある現代標準日本語とした。呼びかけの「妻たちよ」は聖書本文らしい格調を保ちつつ理解しやすい。「みことば」と「ことば」を書き分け、同じλόγοςの反復を部分的に示しながら、前者が福音の知らせ、後者が妻の発言を指す文脈上の差も伝えた。
