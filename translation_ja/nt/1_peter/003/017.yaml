id: 1PE.3.17
reference: 1 Peter 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἀγαθοποιοῦντας, εἰ θέλοι τὸ θέλημα τοῦ θεοῦ, πάσχειν ἢ κακοποιοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: ja
  text: というのも、もし神のみこころがそう望むのであれば[b]、悪を行って苦しむよりも、善を行って苦しむ[a]ほうがよいからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「善を行ったために苦しむ……悪を行ったために苦しむ」とも訳せる。ギリシア語の分詞は、苦しみの理由を示すとも、苦しんでいる時の状況を示すとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「もし神のみこころがそう望むなら」。同じ語根の名詞と動詞を重ねた強調表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: ほうがよい
  rationale: 比較を表す述語的な形容詞。「悪を行って苦しむよりも」と対応させ、自然な日本語の比較構文にした。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 直前の勧めに理由や説明を加える接続関係を明示する、自然な日本語表現。
- source_word: ἀγαθοποιοῦντας
  choice: 善を行って
  rationale: 現在分詞が表す行為の状況を保ち、因果関係だけに限定しない。「善を行ったために」も文脈上可能なので脚注に示した。
- source_word: εἰ θέλοι
  choice: もし……そう望むのであれば
  rationale: εἰと希求法による仮定的・可能的な条件を「もし」「のであれば」で表した。
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: 神のみこころ
  rationale: 神の意志・御旨を表す日本語聖書として自然で品位のある表現。動詞θέλοιとの語根上の反復は「みこころがそう望む」で可能な限り保った。
- source_word: πάσχειν
  choice: 苦しむ
  rationale: 苦難を受けることを簡潔かつ直接的に表す。
- source_word: ἢ
  choice: よりも
  rationale: κρεῖττονに伴う比較を自然な日本語で示す。
- source_word: κακοποιοῦντας
  choice: 悪を行って
  rationale: ἀγαθοποιοῦνταςとの対照と並行性を保ち、因果関係に限定しない分詞表現とした。
theological_decisions:
- issue: 苦しみと神のみこころとの関係
  choice: 善を行う者の苦しみが神のみこころのうちに起こり得ることを条件的に述べる。
  alternative: 神が苦しみの一つ一つを決定する、または単に許すだけである、と明示する解釈。
  rationale: 本文は神のみこころに条件的に言及するが、決定と許容をめぐる体系的な立場までは定めていないため、その緊張を訳文に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「みこころ」によって聖書本文にふさわしい品位を保った。原文の分詞が持つ因果・状況の両義性と、神のみこころに関する条件表現を脚注を含めて保持した。
