revisions:
- from: というのも、いのちを愛し、幸いな日々を見たいと願う者は、舌を悪から遠ざけ、唇で欺き[a]を語るのをやめよ。
  to: なぜなら、いのちを愛し、良い日々を見たいと願う者は、舌で悪を語るのをやめ、唇で欺きを語るのをやめよ。
  rationale: παυσάτωに支配される二つの並行句を、日本語で明瞭な二つの「語るのをやめよ」として表した。これにより、γλῶσσα（舌）とχείλη（唇）の具体的な比喩を維持しつつ、悪や欺きを口にすることを控えるという原文の命令内容を正確に伝える。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:41:31Z'
review_pass:
  verdict: revise
  source_fidelity: 主文は全体として原文の構文と並行法をよく捉えているが、「舌を悪から遠ざけ」は日本語では不自然で、舌そのものを悪から物理的に離すようにも読める。原文の、悪を語ることをやめるという意味を明確にする必要がある。
  naturalness: 「舌で悪を語るのをやめ、唇で欺きを語るのをやめよ」とすれば、身体語彙と二つの並行する禁止を保ちながら、明瞭な現代標準日本語になる。「なぜなら」は、文脈依存の説明的接続詞 γάρ を自然に表す。
  terminology: 「いのち」「舌」「唇」「欺き」は適切である。「良い日々」は ἀγαθάς の広い意味を自然に表し、「幸いな」が帯びうる宗教的・評価的な限定を避ける。脚注はδόλοςの語義を「欺き、偽り、たくらみ」とし、裏切りを独立した主要語義として強調しない形に整える。
  issues:
  - severity: medium
    issue: 「舌を悪から遠ざけ」の不自然さと意味の曖昧さ
    rationale: τὴν γλῶσσαν ἀπὸ κακοῦ は、舌による悪（悪い発言）をやめるよう求める表現である。現訳は「舌」を「悪」から離すという日本語として不自然な関係になり、発話の意味が明瞭でない。
  - severity: low
    issue: 脚注の語義列挙
    rationale: δόλοςの中心は欺き・偽り・たくらみである。「裏切り」は文脈によって関係しうるものの、この語の直接的な代表訳として並列すると語義をやや広げすぎる。
  revised_text: なぜなら、いのちを愛し、良い日々を見たいと願う者は、舌で悪を語るのをやめ、唇で欺きを語るのをやめよ。
  revised_footnotes:
  - marker: a
    text: 別訳「偽り」。ギリシア語は、欺き、偽り、たくらみを意味し得る。
    reason: lexical_alternative
  revision_rationale: παυσάτωに支配される二つの並行句を、日本語で明瞭な二つの「語るのをやめよ」として表した。これにより、γλῶσσα（舌）とχείλη（唇）の具体的な比喩を維持しつつ、悪や欺きを口にすることを控えるという原文の命令内容を正確に伝える。
