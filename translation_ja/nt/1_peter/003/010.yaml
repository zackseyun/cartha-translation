source:
  edition: SBLGNT
  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: ja
  text: なぜなら、いのちを愛し、良い日々を見たいと願う者は、舌で悪を語るのをやめ、唇で欺きを語るのをやめよ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: 願う者
  rationale: 冠詞付き現在分詞の一般的・代表的な単数を、性別を限定せず自然な日本語で表した。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の勧めを聖書の引用によって根拠づける説明的な接続を明確にした。
- source_word: ζωὴν ἀγαπᾶν
  choice: いのちを愛し
  rationale: 原文の具体的で簡潔な表現を保った。「いのち」は文脈上、人の生そのものを指す。
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: 幸いな日々を見たい
  rationale: ἰδεῖν の「見る」という比喩を残しつつ、ἀγαθὰς を物質的繁栄に狭めない「幸いな」とした。
- source_word: παυσάτω
  choice: 遠ざけ、…語るのをやめよ
  rationale: アオリスト命令形の強い勧告を保ち、二つの並行句が日本語として理解できるよう表現した。
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: 舌を悪から遠ざけ
  rationale: 「舌」という身体的比喩と、意味範囲の広い「悪」を保持した。
- source_word: χείλη
  choice: 唇
  rationale: 詩的な並行法にある具体的な身体表現をそのまま残した。
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: 唇で欺きを語るのをやめよ
  rationale: 抑止を表す不定詞句を自然な禁止的命令として訳し、δόλος の中心義を「欺き」で表した。
theological_decisions:
- issue: 一般的な単数と性別表現
  choice: 「願う者」とし、性別を示す代名詞を用いない
  alternative: 「その人」または男性を明示する表現を用いる
  rationale: ギリシア語の単数形を一般的・代表的な人物として受け取り、男性だけに限定する含意を加えずに保った。
- issue: 「幸いな日々」の意味範囲
  choice: 物質的繁栄に限定しない「幸いな日々」
  alternative: 「繁栄の日々」
  rationale: ἀγαθός は広く良い状態を表し、富や現世的成功だけを意味するとは限らないため。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、詩編引用の簡潔で格調ある並行表現を保った。「いのち」「舌」「唇」「見る」など原文の具体的な語を維持した。
