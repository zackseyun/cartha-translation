source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: ja
  text: というのも、かつて神に望みを置いていた[a]聖なる女たちも、このように、自分の夫に従いつつ、自らを飾っていました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神に望みをかけていた」。
    reason: ἐλπίζουσαι εἰς θεὸνは、神を希望の向かう先として表す言い方であり、日本語では複数の自然な表現が可能である。
lexical_decisions:
- source_word: οὕτως
  choice: このように
  rationale: 直前の文脈で述べられた飾り方を指す様態の副詞として、指示の働きを自然な日本語で保つ。
- source_word: γάρ
  choice: 訳文では明示しない
  rationale: 前文を受けて根拠や実例を示す接続詞だが、単節としても自然な日本語になるよう、文脈上の説明関係に含ませた。必要なら文脈では「実際」と訳し得る。
- source_word: ποτε
  choice: かつて
  rationale: 以前の時代の女性たちを指す時間的意味を、簡潔で自然に表す。
- source_word: ἅγιαι γυναῖκες
  choice: 聖なる女たち
  rationale: ἅγιαι の標準的な意味を弱めず、神に属する者としての性格を表す。
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: 神に望みを置いていた
  rationale: 継続的な特徴を表す現在分詞と、希望が神へ向けられていることを示す εἰς を自然に表現する。
- source_word: ἐκόσμουν ἑαυτάς
  choice: 自分を飾りました
  rationale: 直前の文脈にある「飾り」との語彙的なつながりを保ち、外見だけに限定しない表現とする。
- source_word: ὑποτασσόμεναι
  choice: 従うことによって
  rationale: 分詞が、自分をどのように飾ったかを示す様態・手段として働く関係を明確にする。
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: 自分の夫に
  rationale: 家庭・婚姻の文脈で ἀνήρ は「夫」を意味する。ἰδίοις を「自分の」と訳し、対象が各自の夫に限られることを保つ。
theological_decisions:
- issue: 妻が夫に従うことの範囲と統語関係
  choice: 自分の夫に従うことによってです
  alternative: 夫に服していたのです
  rationale: 「自分の」を保持して婚姻関係に範囲を限定し、すべての女性と男性一般についての主張へ広げない。また、分詞を前の「自分を飾りました」に結び付け、その飾り方を説明する構造を表す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「聖なる」「飾る」など本文の重要語を保持した。「服従する」より一般読者に自然な「従う」を採用しつつ、対象を「自分の夫」に限定した。
