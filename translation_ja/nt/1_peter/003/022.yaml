source:
  edition: SBLGNT
  text: ὅς ἐστιν ἐν ⸀δεξιᾷ θεοῦ πορευθεὶς εἰς οὐρανὸν ὑποταγέντων αὐτῷ ἀγγέλων καὶ ἐξουσιῶν καὶ δυνάμεων.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/022.yaml
  text: who is at the right hand of God[a], having gone into heaven, with angels and authorities and powers subjected to him.
translation:
  language: ja
  text: この方は天へ行かれ[a]、神の右におられます。御使いたちも、権威も、力も、この方に服従させられました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には「天に入って行かれ」。
    reason: εἰς は「天へ」という方向を示し、文脈によっては「天に入って」という移動の到達点を明示することもできる。本文では自然な日本語として「天へ」とした。
lexical_decisions:
- source_word: ὅς
  choice: この方は
  rationale: 前節のイエス・キリストを受ける関係代名詞。日本語では文脈上のつながりを明確にしつつ、敬意ある自然な表現とした。
- source_word: ἐν δεξιᾷ θεοῦ
  choice: 神の右におられます
  rationale: 高い地位と栄誉を表す聖書固有の空間的・関係的表現を、説明的に言い換えず保持した。
- source_word: πορευθεὶς εἰς οὐρανόν
  choice: 天へ行き
  rationale: アオリスト分詞の先行動作を自然な連用形で表した。εἰς の方向性は「へ」で示し、より字義的な表現は脚注に置いた。
- source_word: ὑποταγέντων αὐτῷ
  choice: この方に従わせられています
  rationale: 受動態と、従属させられた結果が現在も成り立っていることを示す。「この方」として指示対象を明確にした。
- source_word: ἀγγέλων
  choice: 御使いたち
  rationale: 宇宙的諸力と並ぶ文脈なので、人間の使者ではなく天的存在を指す。
- source_word: ἐξουσιῶν
  choice: 権威
  rationale: δυνάμεων と区別しつつ、人格的存在か権威そのものかを日本語で不必要に限定しない表現とした。
- source_word: δυνάμεων
  choice: 力
  rationale: 宇宙的諸力の列挙を簡潔に保ち、ἐξουσιῶνとの語義上の区別も示した。
theological_decisions:
- issue: キリストが神の右におられることの性質
  choice: 「神の右」という聖書的な空間・関係表現をそのまま保つ。
  alternative: 「神に次ぐ最高の栄誉の座におられる」と説明する。
  rationale: 原文の比喩性や空間性を一方的に解消せず、キリストの高挙を示す表現を翻訳として保持するため。
- issue: 「御使いたち、権威、力」の正体と道徳的性質
  choice: 天的・宇宙的な存在または諸力を広く指す列挙として訳し、善悪を特定しない。
  alternative: 善い天使だけ、または敵対する悪霊的勢力だけを指すと限定する。
  rationale: 原文はこれらの道徳的分類を明示しておらず、その曖昧さを保つ必要があるため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、キリストへの敬意を「この方」「おられます」で表した。二文に分け、長い分詞構文と属格絶対的な構造を日本語で読みやすくした。
