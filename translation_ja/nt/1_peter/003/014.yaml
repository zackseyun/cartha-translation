id: 1PE.3.14
reference: 1 Peter 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: ja
  text: しかし、たとえ義のために苦しむことがあっても、あなたがたは幸いです。彼らの恐れを恐れてはならず[a]、動揺してはなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らを恐れてはならず」または「彼らが恐れるものを恐れてはならず」。ギリシア語は直訳すると「彼らの恐れ」で、イザヤ書8章12節（七十人訳）の表現を踏まえており、複数の意味に取ることができます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ
  choice: しかし、たとえ……ても
  rationale: 前節との対照と、現実に起こり得る事態を認める譲歩条件の両方を、自然な現代日本語で表す。
- source_word: πάσχοιτε
  choice: 苦しむことがあっても
  rationale: 希求法を伴う条件節が示す、可能性はあるが断定はしない含みを保つ。
- source_word: διὰ δικαιοσύνην
  choice: 義のために
  rationale: διά＋対格の原因・理由を表し、δικαιοσύνηの倫理的・神学的な広がりを「正しいことをしたため」と限定せずに保つ。
- source_word: μακάριοι
  choice: あなたがたは幸いです
  rationale: 述語形容詞の宛先を補い、単なる感情的な幸福ではなく、神の前での恵まれた状態を示す聖書的な響きを保つ。
- source_word: τὸν ... φόβον αὐτῶν
  choice: 彼らの恐れ
  rationale: イザヤ書8章12節の七十人訳を思わせる語形と、彼らへの恐れ・彼らが抱く恐れ・彼らが恐れるもの、という解釈上の幅を本文で保つ。
- source_word: μὴ φοβηθῆτε
  choice: 恐れず
  rationale: φόβοςとφοβέομαιの語の反復を「恐れを恐れず」として再現する。後続の禁止表現と自然につなぐ。
- source_word: μηδὲ ταραχθῆτε
  choice: 動揺してはなりません
  rationale: 内面的にかき乱される意味を、過度に説明せず、明確で品位ある禁止表現にする。
theological_decisions:
- issue: δικαιοσύνηの訳語
  choice: 義
  alternative: 正しさ／正しいこと
  rationale: この箇所は神と人の前での正しい歩みによる苦難を指す。「義」は倫理的・神学的な含意を保ち、「正義」だけに狭めない。
- issue: τὸν φόβον αὐτῶνの解釈
  choice: 彼らの恐れ
  alternative: 彼らを恐れること／彼らが恐れるもの
  rationale: 属格αὐτῶνの関係は複数の理解が可能であり、イザヤ書8章12節との響きもあるため、本文では曖昧さを解消せず、別解を脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の厳粛さと聖書的な語感を保った。「彼らの恐れを恐れず」は日常語としてやや特異だが、原文の語の反復、旧約との間本文的な響き、意図的な曖昧さを保持するために採用し、脚注で読みの可能性を説明した。
