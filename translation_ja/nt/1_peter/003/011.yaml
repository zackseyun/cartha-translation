id: 1PE.3.11
reference: 1 Peter 3:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: ja
  text: 悪から離れて善を行い、平和を求めて、それを追い求めよ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: 離れて
  rationale: 方向転換を表す語義を保ちつつ、「悪から離れる」という自然で明確な日本語にした。三人称単数命令形は、詩編引用における一般的な勧告として、日本語では命令形で表した。
- source_word: δὲ
  choice: （明示せず）
  rationale: δέは緩やかな対照・継続を示すが、この一節だけの日本語で「しかし」を置くと対照が強くなりすぎるため、命令の連続によって流れを表した。
- source_word: ἀπὸ κακοῦ
  choice: 悪から
  rationale: ἀγαθόνとの倫理的対照を保ち、κακόνを災難ではなく道徳的な「悪」と解した。
- source_word: ποιησάτω ἀγαθόν
  choice: 善を行い
  rationale: 倫理的行為を端的に示し、「悪」と「善」の対照も保持する。
- source_word: ζητησάτω
  choice: 求めて
  rationale: ζητέωの基本的な「求める」を採り、後続するより強いδιώκωとの段階的な表現を保った。
- source_word: εἰρήνην
  choice: 平和
  rationale: 個人的な和解を含み得る広い聖書的意味を限定せず、標準的な訳語を用いた。
- source_word: διωξάτω αὐτήν
  choice: それを追い求めよ
  rationale: διώκωの積極的で持続的な追求の強さを「追い求める」で示し、「それ」によって平和を受けた。
- source_word: 3rd person singular imperatives
  choice: 命令形「～よ」
  rationale: ギリシア語は代表的な一人を指す三人称単数命令だが、日本語で「彼は～せよ」とすると特定の男性を指すように響く。性別を不必要に限定せず、一般的勧告として自然な命令形にした。
theological_decisions:
- issue: 命令形の男性単数が持つ代表的・一般的な力
  choice: 主語を明示せず、一般的な命令「～よ」とする
  alternative: 「その人は～せよ」または「彼は～せよ」
  rationale: 文法上は男性単数だが、引用文中で代表的・一般的に用いられている。日本語の無主語命令は単数・性を不当に特定せず、命令の力を保てる。
translation_notes:
  register: 明快な現代標準日本語。詩的な並行と、「求める」から「追い求める」への強まりを保ちつつ、簡潔で格調ある勧告文とした。
