  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: ja
  text: サラがアブラハムに従い、彼を「主人」と呼んだように、あなたがたも、善を行い、どんな脅威[a]にもおびえないなら、サラの子どもとなったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「どんな恐怖にも」または「どんな恐ろしいものにも」とも訳せる。
    reason: πτόησις は、恐怖・動揺のほか、恐れを引き起こすものをも指し得るため。
lexical_decisions:
- source_word: ὡς
  choice: …のと同じです
  rationale: 前の勧めに対応するサラの模範を示す比較の力を、現代日本語で明確かつ自然に表した。
- source_word: ὑπήκουσεν
  choice: 従い
  rationale: ὑπακούω の通常の意味である「従う、聞き従う」を直接表す。文脈以上の夫婦関係の教理を付加しない。
- source_word: κύριον αὐτὸν καλοῦσα
  choice: 彼を「主人」と呼んだ
  rationale: κύριος はここでは神への称号ではなく、アブラハムに対する敬意ある呼称。「主人」はその非神的用法を自然に示す。分詞は、サラが従ったことの現れとして訳した。
- source_word: ἧς ἐγενήθητε τέκνα
  choice: サラの子どもとなったのです
  rationale: 関係代名詞の指示先を「サラ」と明示し、γίνομαι の状態への移行とその結果を「となった」で保った。τέκνα の比喩的な家族像も保持した。
- source_word: ἀγαθοποιοῦσαι
  choice: 善を行い
  rationale: 「良いことをする」という継続的実践を簡潔に表す。後続の分詞とともに主節に条件的な含みを持つため、「なら」で関係を明示した。
- source_word: μὴ φοβούμεναι μηδεμίαν πτόησιν
  choice: どんな脅威にもおびえない
  rationale: φοβέομαι の恐れを「おびえる」で表し、πτόησις が指し得る恐怖・威嚇・恐ろしいものの幅を「脅威」である程度保持した。別訳は脚注に示した。
theological_decisions:
- issue: サラの従順をキリスト者の妻の模範として述べる範囲
  choice: ὑπήκουσεν を「従い」と訳し、本文が述べる模範をそのまま示す。
  alternative: 文化的な響きを弱めるため「敬意を示し」などと意訳する。
  rationale: 原語の明白な意味を文化的・教派的配慮から弱めず、同時に、この一節を越えた包括的な結婚論も訳文に持ち込まない。
- issue: ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι と主節の関係
  choice: 「…なら」として条件的な含みを明示する。
  alternative: 「善を行い、…おびえることなく」と、付帯状況または描写として訳す。
  rationale: 分詞はサラの子どもであることを実践的に示すあり方を述べ、文脈上は条件的に理解できる。ただし厳密な条件節だけに限定し得る形ではないため、代替理解の余地を認識する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「主人」「サラの子ども」という原文の敬意表現と家族的比喩を保持した。「おびえない」は単に判断として恐れないことよりも、圧力に屈して動揺しない態度を自然に表す。
