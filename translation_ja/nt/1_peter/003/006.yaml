  terminology: 「サラ」「アブラハム」は標準的です。「主人」は創世記18章12節を踏まえた敬称として使用可能であり、神への称号とは読まれにくいようかぎ括弧も適切です。「善を行う」「サラの子ども」も明瞭で、不要な教理的拡張をしていません。
