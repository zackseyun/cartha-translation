  to: ただし、柔和と恐れをもって[a]、良い良心を保ちながら答えなさい。そうすれば、あなたがたが悪く言われているその点で[b]、メシアにあって送るあなたがたの良い生き方を非難する者たちが、恥をかくことになります。
