  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: ja
  text: ただし、柔和と恐れをもって[a]、良い良心を保ちながら答えなさい。そうすれば、あなたがたが悪く言われているその点で[b]、メシアにあって送るあなたがたの良い生き方を非難する者たちが、恥をかくことになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「柔和と畏敬をもって」または「柔和と敬意をもって」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「あなたがたが悪く言われている点において」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πραΰτητος
  choice: 柔和
  rationale: 高ぶらず、荒々しくない態度を表す語として、聖書的な重みを保ちつつ現代日本語でも理解できる「柔和」を選んだ。
- source_word: φόβου
  choice: 恐れ
  rationale: 対象が本文中で明示されておらず、「畏敬」や「敬意」と限定せず原文の幅と緊張を保つため。
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: 良い良心を保ちながら
  rationale: 分詞の付帯状況を自然な日本語で表し、継続的に良心を良く保つ含みを伝える。
- source_word: ἐν ᾧ
  choice: その事柄について
  rationale: 悪く言われている領域・事柄を指す圧縮された関係表現を、過度に限定せず明瞭にした。
- source_word: καταλαλεῖσθε
  choice: 悪く言われている
  rationale: 敵意をもって人を非難する意味を自然な現代日本語で表し、「中傷されている」よりも語義の幅を保つ。
- source_word: καταισχυνθῶσιν
  choice: 恥じ入ることになります
  rationale: ἵνα節の目的・結果の含みを保ち、受動形の帰結を日本語として自然に表した。
- source_word: ἐπηρεάζοντες
  choice: 侮辱する者たち
  rationale: 悪意ある攻撃や侮蔑を表す語として、単に批判する以上の敵対性を伝える。
- source_word: ἀναστροφήν
  choice: 生き方
  rationale: 一時的な行動ではなく生活態度・振る舞い全体を指すため、一般読者に明快な「生き方」とした。
- source_word: ἐν Χριστῷ
  choice: メシアにあっての
  rationale: Χριστόςの称号としての意味を「メシア」で示し、ἐνの結合・領域の意味を「あっての」で保った。
- source_word: ἀγαθὴν
  choice: 良い
  rationale: 良心と生き方の双方に用いられるἀγαθόςの簡潔な道徳的意味と、本文内の語の反復を保つ。
theological_decisions:
- issue: φόβουの意味と対象
  choice: 「恐れ」とし、対象を明示しない
  alternative: 「畏敬」「敬意」「神への恐れ」
  rationale: 直近の本文は恐れの対象を明示していないため、神への畏敬か人への敬意かを翻訳で決めず、解釈上の余地を保った。
- issue: Χριστῷの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味が保たれているため「メシア」とし、伝統的な音訳は脚注に示した。
- issue: ἵνα節の機能
  choice: 「そうすれば」で目的・結果の双方に開かれた表現
  alternative: 「恥じ入らせるためです」
  rationale: ἵναが目的または意図された結果を表し得るため、どちらか一方に過度に固定しない日本語とした。
translation_notes:
  register: 明瞭で品位ある現代標準語。「答えなさい」は前節から続く統語関係を日本語で明示したもの。敵対的発言を表す二つの語は、「悪く言う」と「侮辱する」で区別した。
