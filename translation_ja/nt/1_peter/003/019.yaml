  text: in which also he went and proclaimed to the spirits in prison[c][b][a],
translation:
  language: ja
  text: その霊において[a]、キリストは牢にいる霊たち[c]のところへも行き、宣言した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その方にあって」。あるいは「それによって」。ギリシア語は、直前の句との関係について複数の理解が可能である。
    reason: alternative_reading
  - marker: b
    text: または「宣べ伝えた」。この動詞は公に告げ知らせることを意味するが、ここでは告げた内容が明記されていない。
    reason: lexical_alternative
  - marker: c
    text: 「牢にいる霊たち」が誰を指すかについては見解が分かれており、死んだ人間の霊、または堕落した天使的存在などと解釈されている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: その霊において
  rationale: 関係代名詞は中性単数与格で、直前の「霊」を受けるのが文法上自然である。「において」として、領域・状態・手段のいずれかに限定しすぎないようにした。
- source_word: καὶ
  choice: も
  rationale: 前節の内容にもう一つの行為を加える付加的な働きを、日本語として自然な「も」で表した。
- source_word: τοῖς ... πνεύμασιν
  choice: 霊たち
  rationale: πνεύμασινを直接的に訳し、それが死者の霊なのか堕落した霊的存在なのかを本文で特定しない。
- source_word: ἐν φυλακῇ
  choice: 獄にいる
  rationale: φυλακήの拘禁・監禁の意味を、簡潔で定着した日本語によって表した。
- source_word: πορευθεὶς
  choice: 行き
  rationale: 移動を表すアオリスト分詞を、日本語では主動詞につながる連用形として自然に訳した。時間的な前後関係は必要以上に強調していない。
- source_word: ἐκήρυξεν
  choice: 宣言した
  rationale: κηρύσσωは布告者として告げ知らせることを表すが、ここではその内容が福音、裁き、勝利のいずれか明記されていないため、幅を残す「宣言した」とした。
theological_decisions:
- issue: ἐν ᾧの指示対象と用法
  choice: 「その霊において」とし、直前の「霊」とのつながりを示しつつ、厳密な意味関係は注で開いた。
  alternative: 「その方にあって」または「それによって」
  rationale: ギリシア語の構文には解釈上の余地があり、キリストの宣言のあり方について特定の教理的理解に固定しないため。
- issue: 「獄にいる霊たち」の正体
  choice: 本文では「霊たち」とだけ訳し、正体を特定しない。
  alternative: 死んだ人間の霊、堕落した天使的存在、またはより広い意味で拘禁された霊的存在
  rationale: ギリシア語本文だけでは対象を十分に限定できず、主要な解釈が複数存在するため。
- issue: キリストが告げた内容
  choice: 「宣言した」と訳し、内容を明示しない。
  alternative: 福音を宣べ伝えた、裁きを告げた、勝利を布告した
  rationale: ἐκήρυξεν自体は公の告知を示すが、その内容や目的まではこの節で明記していないため。
translation_notes:
  register: 明快な現代標準語を用い、「獄」「宣言」によって簡潔で品位ある聖書文体を保った。原文で明示されていない主語は補わず、前節から続く文として訳した。
