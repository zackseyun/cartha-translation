  naturalness: 「正しい良心」より「良い良心」のほうが、ἀγαθῆςの基本的意味を保ち、日本語の聖書的・現代的用法としても自然です。文を一文に整え、否定・肯定の限定と「復活を通して」を洗礼が救うという主張に明確に係らせます。
