id: 1PE.3.21
reference: 1 Peter 3:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: ja
  text: この水に対応するもの、すなわち洗礼が、今、あなたがたを救います。それは肉体の汚れを取り除くことではなく、神に対して良い良心を願い求めること[a]として、イエス・キリストの復活を通して救うのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神に対する良い良心の誓い（あるいは応答）」。ここで「願い求めること」と訳したギリシア語は、「誓い」や「応答」と理解することもできます。また、「良い良心」は、願いの対象ではなく、願いや誓いの源・性質を表すとも解釈できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: この水に対応するもの
  rationale: 直前の洪水の水を受ける関係を明示しつつ、「原型・対型」のような専門用語を避け、類型的な対応関係を自然な日本語で表した。
- source_word: σῴζει
  choice: 救います
  rationale: 現在直説法の直接的な主張を弱めずに保持した。
- source_word: βάπτισμα
  choice: 洗礼
  rationale: 現代日本語の聖書・キリスト教文脈で広く理解される標準的な訳語。直後に外面的な洗浄ではないとの限定があるため、「洗い」とは言い換えない。
- source_word: σαρκὸς ἀπόθεσις ῥύπου
  choice: 肉体の汚れを取り除くこと
  rationale: 単なる身体的洗浄を指す否定表現として、原文の「肉／肉体」と「汚れの除去」を明瞭に保った。
- source_word: συνειδήσεως ἀγαθῆς
  choice: 正しい良心を
  rationale: ἀγαθόςを文脈に即して「正しい」とし、圧縮された属格を、神に求める対象として読める自然な日本語にした。ただし属格関係の別解は注で保持する。
- source_word: ἐπερώτημα εἰς θεόν
  choice: 神に願い求めること
  rationale: εἰς θεόνの方向性と、ἐπερώτημαの「求め・訴え」の意味を自然に表した。誓約または応答という語義も可能なので注記した。
- source_word: δι’ ἀναστάσεως
  choice: 復活を通して
  rationale: 属格を伴うδιάの手段・媒介の意味を保持した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリスト
  rationale: Χριστόςの称号的背景を持ちながら、日本語で定着し、一般読者に最も自然で明瞭な表現を採用した。
theological_decisions:
- issue: 洗礼と救いの関係
  choice: 「洗礼も、今、あなたがたを救います」という直接的な主張を保持し、続く否定と肯定の説明、およびキリストの復活を通してという限定に意味を委ねた。
  alternative: 「洗礼は救いを象徴します」と弱める、または特定の教派的な効力論を訳文に加える。
  rationale: 原文の緊張を解消せず、洗礼を単なる外面的洗浄とも単なる象徴とも訳文だけで決めつけないため。
- issue: ἐπερώτημαの意味
  choice: 本文では「願い求めること」とした。
  alternative: 「誓い」「約束」「応答」。
  rationale: 神への方向性には願い・訴えの意味がよく適合するが、誓約または応答という解釈にも語義上の根拠があるため、注で明示した。
- issue: συνειδήσεως ἀγαθῆςの属格関係
  choice: 「正しい良心を」神に求めるものとして訳した。
  alternative: 「正しい良心から出る願い」または「正しい良心による神への誓い」。
  rationale: 属格の機能は曖昧である。本文では読みやすく有力な目的的理解を採ったが、別の統語的理解を注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体寄りの敬体を用いた。「この水」と補って直前の文脈とのつながりを明確にし、「すなわち」によって洗礼が対応物である構文を読みやすくした。末尾は日本語で修飾関係が曖昧にならないよう「救うのです」を補い、救いの手段がイエス・キリストの復活であることを示した。
