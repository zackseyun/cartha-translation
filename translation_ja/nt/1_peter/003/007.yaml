id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: ja
  text: 同じように、夫たちも、理解をもって[a]妻と共に暮らしなさい。妻を、より弱い器[b]として、また、いのちの恵みを共に受け継ぐ者[c]として尊びなさい。あなたがたの祈りが妨げられないように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「知識に従って」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「より弱い器」は比喩であり、身体的または社会的に相対的に弱い立場を指す可能性が高い。価値が低いという意味ではない。続く句は、妻も「いのちの恵みを共に受け継ぐ者」であると明言している。
    reason: cultural_note
  - marker: c
    text: 「いのちの恵みの共同相続人」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: 夫たち
  rationale: 直前の妻への勧め（3:1）に続く家庭上の文脈なので、一般の男性ではなく夫を指す。
- source_word: ὁμοίως
  choice: 同じように
  rationale: 先行する勧めとのつながりと比較の力を保つ。
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: 知識に基づいて妻と共に暮らし
  rationale: 共同の結婚生活を表す分詞を自然な日本語にしつつ、κατὰ γνῶσιν の幅を狭めないよう比較的形式的に訳した。
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: 女性を、より弱い器として
  rationale: 比較級と「器」の比喩を保持し、本文で身体的・社会的など一つの意味に限定しない。
- source_word: ἀπονέμοντες τιμήν
  choice: 尊びなさい
  rationale: 相手にふさわしい敬意を与えるという意味を、現代日本語で簡潔かつ品位ある命令表現にした。
- source_word: συγκληρονόμοις
  choice: 共に受け継ぐ者
  rationale: 共有される相続を明確にしつつ、「共同相続人」より一般読者に分かりやすい表現とした。
- source_word: χάριτος ζωῆς
  choice: いのちの恵み
  rationale: 属格構文を保ち、それが「いのちという恵み」か「いのちを与える恵み」かを本文で限定しない。
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: あなたがたの祈りが妨げられないためです
  rationale: 目的を示す構文と受動の意味を自然な日本語で保った。
theological_decisions:
- issue: 「より弱い器」の意味
  choice: 相対的な弱さを述べる比喩を本文に残し、価値や霊的地位の劣等とは解さない。
  alternative: 身体的に弱い、社会的に弱い立場にある、または別の種類の弱さを特定する。
  rationale: 本文は弱さの種類を明示せず、直後に妻を尊ぶことと、いのちの恵みを共に受け継ぐ者であることを述べるため、特定の説明を本文へ入れず緊張を保った。
- issue: 共有される相続の内容
  choice: 妻も夫と共に「いのちの恵み」を受け継ぐ者である。
  alternative: 永遠のいのちを共に受け継ぐ者、またはより広く神からのいのちの賜物を共に受ける者。
  rationale: 妻が共有する相続人であることは明示しつつ、「いのちの恵み」の範囲は原文以上に限定しなかった。
- issue: ὡς καί の関係
  choice: 「また……として」と訳し、妻を尊ぶ際のもう一つの認識として示した。
  alternative: 「……なのだから」と明示的な理由にする。
  rationale: 理由の含意はあり得るが、原文にない明示的な因果接続を加えず、ὡς καί の比較・資格づけの形を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「器」「いのちの恵み」など原文の比喩と神学的な幅が重要な箇所は保持した。分詞が連なるギリシア語は、日本語では勧告として読みやすい「暮らし、……尊びなさい」とし、目的句は独立した文にして明確にした。
