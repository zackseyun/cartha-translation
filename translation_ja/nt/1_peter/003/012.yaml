id: 1PE.3.12
reference: 1 Peter 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: ja
  text: 'なぜなら、主の目は正しい人たちに注がれ、

    その耳は彼らの祈りに傾けられている。

    しかし、主の顔は悪を行う者たちに敵対する。'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 訳文には独立した接続語を置かない
  rationale: 本節は詩編引用の途中にあり、ὅτι は直前の内容を支える理由を導く。日本語ではこの一節だけで「なぜなら」を置くと後続を予期させて不自然になりやすいため、行間の因果関係に委ねた。
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: 主の目は正しい人たちに注がれ
  rationale: 「主の目」という擬人的な比喩を保ちつつ、ἐπί の方向・注意の意味を自然な日本語の「注がれる」で表した。δικαίους は複数の実体的用法なので「正しい人たち」とした。
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: その耳は彼らの願いに傾けられている
  rationale: 原文の省略的な「その耳は彼らの願いへ」を、日本語で意味が通るように補った。「耳を傾ける」は注意深く聞くことを示し、擬人的イメージも保持する。δέησις はここでは神への切実な求めを含む「願い」とした。
- source_word: πρόσωπον δὲ κυρίου
  choice: しかし、主の顔は
  rationale: δέ の対照を「しかし」で明示し、πρόσωπον の「顔」という詩的・擬人的表現を解釈的に言い換えず保持した。
- source_word: ἐπὶ ποιοῦντας κακά
  choice: 悪を行う者たちに敵対する
  rationale: 否定的な対照の中で ἐπί が表す敵対的な方向性を「敵対する」とし、分詞句 ποιοῦντας κακά の動作性を「悪を行う者たち」で保った。
theological_decisions:
- issue: 神の目、耳、顔という擬人的表現
  choice: 三つの身体的イメージを訳文にそのまま残す
  alternative: 「主は正しい人を見守り、その祈りを聞かれるが、悪を行う者には立ち向かわれる」のように意味を説明する
  rationale: 原文は詩編の表現を受け、神の好意、傾聴、敵対を身体的イメージの対照によって示す。比喩を保持することで、神の身体性を断定せずに文学的・神学的な力を伝えられる。
- issue: 「正しい人たち」の意味
  choice: δικαίους を評価語のまま「正しい人たち」とする
  alternative: 「義とされた人たち」または「信仰者たち」と解釈して訳す
  rationale: この語が指す正しさの根拠や仕方を訳文で教理的に限定せず、文脈と原語が持つ幅を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、詩編引用らしい並行法と荘重さを三行で保った。「御目」「御耳」のような古風な敬語表記は避け、「主の目」「その耳」「主の顔」とした。
