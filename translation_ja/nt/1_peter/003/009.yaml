id: 1PE.3.9
reference: 1 Peter 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: ja
  text: 悪に悪を返したり、侮辱に侮辱を返したりせず[a]、それどころか、祝福しなさい。あなたがたは、このことのために召されたのです[b]。それは、祝福を受け継ぐためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「侮辱」は「ののしり」とも訳せる。原語は、人を傷つける侮蔑的・罵倒的な言葉を指す。
    reason: lexical_alternative
  - marker: b
    text: 「このこと」は、直前の、報復せずに祝福することを指すと考えられる。一方、後に続く「祝福を受け継ぐこと」を指すと読むこともできる。
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: 返したりせず
  rationale: 先に受けた仕打ちへの報復として返すという相互的な意味を、現代日本語で自然に表す。μήを伴う分詞の勧告的な働きは、後続の「祝福しなさい」と結び付けた。
- source_word: κακὸν ἀντὶ κακοῦ
  choice: 悪に悪を
  rationale: κακόνの倫理的な重みを保ち、ἀντίが示す報復・交換の関係を簡潔な定型表現で示す。
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: 侮辱に侮辱を
  rationale: λοιδορίαは人を傷つける侮蔑的・罵倒的な発言を指す。「侮辱」は現代の一般読者に明瞭で、前句との並行も保てる。
- source_word: τοὐναντίον δὲ
  choice: それどころか
  rationale: 単なる追加ではなく、報復とは正反対の行動への強い転換を表す。
- source_word: εὐλογοῦντες
  choice: 祝福しなさい
  rationale: 文脈上の勧告として自然な命令形にした。「祝福する」は、相手について良いことを語る意味と神の恵みを願う意味の双方を保持し、原文にない目的語は補わない。
- source_word: ὅτι
  choice: のです
  rationale: 直前の勧告の根拠を示す説明的・理由的なつながりを、日本語として自然に表した。
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: あなたがたはこのことへと召された
  rationale: 神による召しを示す受動表現を保ちつつ、「このこと」の指示内容を本文で過度に限定しない。
- source_word: ἵνα
  choice: それは、…ためです
  rationale: 目的または意図された結果を表すἵναの働きを、独立した文で明瞭に示す。
- source_word: εὐλογίαν
  choice: 祝福を
  rationale: 神から受ける恵みを示しつつ、同節の「祝福する」との語の響き合いを保つ。
- source_word: κληρονομήσητε
  choice: 受け継ぐ
  rationale: 単に受け取るのではなく、相続人として与えられるという契約的・家族的な含みを保持する。
theological_decisions:
- issue: εἰς τοῦτοの指示内容
  choice: 本文では「このこと」とし、直前の、報復せず祝福する生き方を自然な第一の指示対象として残した。
  alternative: 後続のἵνα節、すなわち「祝福を受け継ぐこと」を前もって指すと読むこともできる。また、苦難の中で報復しないキリスト者の召し全体を指す可能性もある。
  rationale: 原文の指示語には前方・後方双方との関連を認める余地があるため、本文で一つの教理的理解に固定せず、脚注で主要な可能性を示した。
- issue: 召す主体
  choice: 日本語でも「召された」として、聖書的文脈で神を含意する受動表現を用いた。
  alternative: 「神があなたがたを召された」と主体を明示する。
  rationale: 神が主体であることは文脈上理解できるが、原文には主体が明示されていないため、本文では補足しなかった。
translation_notes:
  register: 明瞭な現代標準語を用いながら、勧告としての厳粛さを保った。「仕返し」のような口語に寄せすぎず、「悪に悪を」「祝福を受け継ぐ」という聖書的な倫理・相続の語感を残した。
