  text: ἀναγεγεννημένοι οὐκ ἐκ σπορᾶς φθαρτῆς ἀλλὰ ἀφθάρτου, διὰ λόγου ζῶντος θεοῦ καὶ ⸀μένοντος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: ja
  text: あなたがたは、朽ちる種からではなく、朽ちない種から、生きていていつまでも残る神のことば[a]によって、新しく生まれたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「生きていて、いつまでもおられる神のことば」。ギリシア語の「生きていて」と「いつまでも残る」に当たる語は、「ことば」と「神」のどちらにもかかり得るが、文脈は「ことば」にかかる読みを支持する。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: 新しく生まれたのです
  rationale: 完了受動分詞が表す、すでに起こり現在まで結果が続く新生を、自然な現代日本語で表した。文脈上の主語「あなたがた」を補い、単独でも意味が通る文とした。
- source_word: σπορᾶς
  choice: 種
  rationale: 誕生の比喩と、朽ちるもの・朽ちないものとの対比を明確かつ簡潔に保つ。
- source_word: φθαρτῆς / ἀφθάρτου
  choice: 朽ちる／朽ちない
  rationale: 原文の語彙的な対照を、日本語でも同じ語幹を用いて明瞭に再現した。
- source_word: διὰ
  choice: によって
  rationale: 属格を伴うδιάが示す手段を、自然な日本語で表した。
- source_word: λόγου
  choice: ことば
  rationale: 「メッセージ」より原語に近く、神からの語りかけという聖書的用法にも自然に適合する。
- source_word: ζῶντος
  choice: 生きていて
  rationale: 現在分詞の継続的な性質を直接的で分かりやすい日本語にした。
- source_word: θεοῦ
  choice: 神の
  rationale: λόγουにかかる属格として、「神のことば」という自然で直接的な構文を採った。
- source_word: μένοντος
  choice: いつまでも残る
  rationale: 継続・存続を表す語義を、古風になりすぎず、直後の文脈にある神のことばの永続性にも合う形で表した。
theological_decisions:
- issue: ζῶντοςとμένοντοςが「ことば」と「神」のどちらを修飾するか
  choice: 両分詞を「ことば」にかけ、「生きていて、いつまでも残る神のことば」とした。
  alternative: 両分詞を「神」にかけ、「生きていて、いつまでもおられる神のことば」とする。
  rationale: 属格男性単数の各語は文法上いずれにも結びつき得るが、25節の「主のことばは永遠に残る」とのつながりから、「ことば」を修飾すると読むのが文脈上より自然である。ただし、真正な統語上の曖昧さは脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ表現を採用した。「すなわち」により、朽ちない種が神のことばによって働くという比喩的関係を読みやすく示した。
