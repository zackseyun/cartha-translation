id: 1PE.1.2
reference: 1 Peter 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: ja
  text: 父なる神の予知[a]に従い、聖霊による聖別[b]において、従順と、イエス・メシアの血を振りかけられること[c]のために。恵みと平安が、あなたがたにますます豊かにありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「予知」と訳した語は、神が前もって知っておられること、前もって選んでおられること、またはその両方を含むと理解されてきた。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「聖霊の聖別において」。ここでは、聖霊が行う聖別という意味に理解した。
    reason: grammatical_ambiguity
  - marker: c
    text: 「血を振りかける」という表現は、特に出エジプト記24章8節に見られる、契約締結や清めのイメージを背景としていると考えられる。
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: 予知に従い
  rationale: κατά＋対格が示す基準・一致を「〜に従い」で表した。πρόγνωσιςは、単なる先見とも予定的な選びとも限定せず、「予知」として語義上の緊張を保った。
- source_word: θεοῦ πατρός
  choice: 父なる神
  rationale: 神が父であるという同格的な関係を、現代日本語の聖書文体として自然な形で示した。
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: 御霊による聖別のうちに
  rationale: 三者的な構造からπνεῦμαを聖霊と理解し、「御霊」とした。属格の働きは行為者を示すものと解しつつ、「聖別のうちに」によってἐνも可視化した。
- source_word: εἰς ὑπακοὴν
  choice: 従順となり…ために
  rationale: εἰςの目的・帰結の方向性を日本語の目的構文で表した。ὑπακοήは簡潔に「従順」とした。
- source_word: καὶ ῥαντισμὸν αἵματος
  choice: 血を振りかけられる
  rationale: 日本語として自然な受け身にし、血による注ぎかけを受ける意味を表した。契約締結・清めを背景とする旧約的な表象は訳語と注で保持した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を明示するため「メシア」とした。「イエス・キリスト」という名称的な訳も可能である。
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: 恵みと平安が、あなたがたにますます豊かにありますように
  rationale: 希求法の祝福・願望を「ありますように」で表し、πληθυνθείηは直訳的な「増し加えられる」より自然な「ますます豊かに」とした。
theological_decisions:
- issue: πρόγνωσιςと選びの関係
  choice: 「予知」と訳し、意味を限定しない
  alternative: 「あらかじめの選び」「あらかじめ定められたみ旨」
  rationale: この語が神の事前の知識、事前の選び、またはその両方を強調するかは議論があるため、本文で特定の教理体系に決着させない。
- issue: πνεύματοςの指示対象
  choice: 聖霊を指す「御霊」
  alternative: 人間の霊、または非人格的な霊的性質
  rationale: 「父なる神」「御霊」「イエス・メシア」という構造から、聖霊を指すと理解するのが最も自然である。
- issue: Χριστοῦの機能
  choice: 称号として「メシア」
  alternative: 名称化した「キリスト」
  rationale: この文脈でも「油注がれた者」という称号的な力が保たれていると判断したが、日本語で定着した「キリスト」も可能である。
- issue: ῥαντισμὸν αἵματοςの背景
  choice: 血を振りかけられることとして訳す
  alternative: 血による清め、と意味を展開する
  rationale: 出エジプト記24章8節などの契約・清めの表象を示唆するが、本文では「清め」だけに意味を限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、祝福の文には品位ある祈願表現を採用した。「聖別」「御霊」「メシア」は神学的内容を保持するため用い、必要な曖昧さは脚注で示した。
