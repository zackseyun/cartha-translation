source:
  edition: SBLGNT
  text: τοὺς δι’ αὐτοῦ ⸀πιστοὺς εἰς θεὸν τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν καὶ δόξαν αὐτῷ δόντα, ὥστε τὴν πίστιν ὑμῶν καὶ ἐλπίδα εἶναι εἰς θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: ja
  text: あなたがたは、この方を通して神を信じる者です[a]。神はこの方を死者の中から復活させ、この方に栄光をお与えになりました。その結果、あなたがたの信仰と希望は神に向けられています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神に忠実な者」とも訳せますが、ここでは「この方を通して神を信じる者」という意味である可能性が高いと考えられます。
    reason: lexical_alternative
  - marker: b
    text: 「その結果、あなたがたの信仰と希望が神に向けられるように」とも訳せます。ギリシア語は、結果と目的のどちらにも取れる余地があります。
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: この方を通して
  rationale: διά＋属格が示す媒介を自然に表し、キリストを通して神を信じるという関係を保つ。
- source_word: πιστοὺς εἰς θεόν
  choice: 神を信じる者
  rationale: πιστόςには「忠実な者」の意味もあるが、εἰς θεόνとの結びつきから、ここでは神を信頼し信じる者を指す可能性が最も高い。
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: 神はこの方を死者の中から復活させ
  rationale: 復活を表す定型的な表現を、現代日本語で明確に訳した。「死者の中から」によりἐκ νεκρῶνを保持した。
- source_word: δόξαν αὐτῷ δόντα
  choice: 栄光をお与えになりました
  rationale: 神がキリストに栄光を与えたという並列する行為を直接に表現した。
- source_word: ὥστε
  choice: その結果
  rationale: 後続節が神の復活・栄光付与から生じる帰結であることを明瞭にしつつ、目的の含意も完全には排除しない。
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: あなたがたの信仰と希望
  rationale: 二つの名詞を対応する標準的な聖書語彙で簡潔に再現した。
- source_word: εἶναι εἰς θεόν
  choice: 神に向けられています
  rationale: 直訳的な「神の中にある」は日本語では不自然なため、εἰςが示す信仰と希望の方向・対象を明確にした。
theological_decisions:
- issue: πιστούςの意味
  choice: 神を「信じる者」
  alternative: 神に「忠実な者」
  rationale: εἰς θεόνが信仰の対象・方向を示すため、一般的な忠実さよりも信じることを表すと判断した。ただし語彙上の別の可能性は脚注に残した。
- issue: キリストを通した神への信仰
  choice: 「この方を通して」として媒介関係を示す
  alternative: 「この方によって」または「この方のゆえに」
  rationale: διά＋属格の媒介的意味を保ち、本文以上の教理的説明は加えなかった。
- issue: ὥστε節の力
  choice: 「その結果」として帰結を前面に出す
  alternative: 「それによって」「それは……ためです」と目的寄りに訳す
  rationale: 不定詞を伴うὥστεは結果を自然に表すが、目的との境界が常に厳密とは限らないため、脚注で幅を示した。
- issue: 信仰と希望の対象
  choice: 「神に向けられています」
  alternative: 「神にあります」
  rationale: εἰς θεόνの方向性を自然な日本語で示し、信仰と希望が神を対象としていることを明確にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」ではなく「この方」を用いて指示対象であるキリストを自然に示した。原文の一続きの関係を保ちながら、日本語として読みやすい三文に分けた。
