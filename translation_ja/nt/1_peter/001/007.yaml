id: 1PE.1.7
reference: 1 Peter 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: ja
  text: それは、火によって試されながらも滅びゆく金より尊い、あなたがたの信仰の確かさ[a]が、イエス・メシア[b]の現れの時に、称賛と栄光と誉れをもたらすものと認められるためです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの信仰が試されること」。ギリシア語は、試す過程にも、その結果として確かだと証明されたことにも重点を置き得る。
    reason: lexical_alternative
  - marker: b
    text: 一般には「イエス・キリスト」。ここではΧριστόςを、その称号としての意味に即して「メシア」と訳した。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「称賛と栄光と誉れに至るものと見いだされる」。
    reason: previous_rendering
lexical_decisions:
- source_word: δοκίμιον
  choice: 確かさ
  rationale: 試験の過程だけでなく、試されて真正であると示された性質を簡潔に表す。過程を指す可能性は脚注に残した。
- source_word: πίστεως
  choice: 信仰
  rationale: この文脈では、試練によって確かさが示される信仰を指す。
- source_word: πολυτιμότερον
  choice: はるかに尊い
  rationale: 金との価値の比較を自然な現代日本語で明確にする。比較級の強意は文脈上許容される。
- source_word: χρυσίου
  choice: 金
  rationale: 比較対象を直接的に訳した。
- source_word: ἀπολλυμένου
  choice: 滅びゆく
  rationale: 金でさえ究極的には失われるという一時性を、分詞の動的な響きを保って表す。
- source_word: διὰ πυρὸς ... δοκιμαζομένου
  choice: 火によって試されながらも
  rationale: 火が試験の手段であることと、金が試されてもなお滅びるという逆接を自然に表す。
- source_word: εὑρεθῇ εἰς
  choice: もたらすものと認められる
  rationale: 受動態の『見いだされる／認められる』と、εἰς が示す結果を現代日本語で表した。より形式的な別訳を脚注に示す。
- source_word: ἔπαινον καὶ δόξαν καὶ τιμήν
  choice: 称賛と栄光と誉れ
  rationale: 三語の並列を保持し、その帰属先は原文同様に明示しない。
- source_word: ἐν ἀποκαλύψει
  choice: 現れの時に
  rationale: 終末におけるイエス・メシアの顕現という時間的意味を自然に表す。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςを固有名のように音写せず、称号としての意味を表す。一般的な『イエス・キリスト』は脚注に示す。
theological_decisions:
- issue: τὸ δοκίμιον ὑμῶν τῆς πίστεως の意味
  choice: 試されて確かだと示された信仰の性質
  alternative: 信仰が試される過程
  rationale: δοκίμιονはこの文脈では試験の結果として立証された真正さを指す可能性が高いが、過程の意味も排除せず脚注に残す。
- issue: 「称賛と栄光と誉れ」の帰属先
  choice: 原文どおり明示しない
  alternative: 信者に与えられるもの、または神／メシアに帰されるものと特定する
  rationale: ギリシア語本文は誰が受ける称賛・栄光・誉れなのかを明示していないため、神学的な緊張と曖昧さを保つ。
- issue: ἀποκάλυψις の表現
  choice: 現れ
  alternative: 啓示、現れる時
  rationale: ここではイエス・メシアが公に現れる出来事を指すため、『現れ』が普通の読者に明瞭である。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。長いギリシア語構文を一文のまま保ちつつ、挿入句を読点で区切った。『称賛と栄光と誉れ』の受け手は補わず、原文の曖昧さを維持した。
