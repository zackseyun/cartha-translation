source:
  edition: SBLGNT
  text: τὸ δὲ ῥῆμα κυρίου μένει εἰς τὸν αἰῶνα. τοῦτο δέ ἐστιν τὸ ῥῆμα τὸ εὐαγγελισθὲν εἰς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: ja
  text: 「しかし、主のことばは永遠に残る。」そして、これがあなたがたに良い知らせとして告げられたことばです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたに福音として宣べ伝えられたことばです。」
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: ことば
  rationale: 語られた言葉・告知を表し得る語であり、直前のイザヤ書40章8節の引用との響きを保つため、両節で一貫して「ことば」とした。
- source_word: κυρίου
  choice: 主の
  rationale: 属格を自然に表し、新約本文の κύριος を過度に解釈せず「主」と訳した。
- source_word: μένει
  choice: 残る
  rationale: 継続して存在するという意味を、現代日本語で簡潔かつ自然に表す。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: 終わりなく続くことを表す定型句として、明瞭で格調ある現代日本語を用いた。
- source_word: τοῦτο δέ ἐστιν
  choice: そして、これこそ…です
  rationale: δέ の緩やかな展開を「そして」で示し、指示語 τοῦτο の同定を「これこそ」で自然に際立たせた。
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: 良い知らせとして告げられたことば
  rationale: εὐαγγελίζω の「良い知らせを告げる」という動詞的意味を明示しつつ、教会用語だけに依存しない分かりやすい表現とした。
- source_word: εἰς ὑμᾶς
  choice: あなたがたに
  rationale: 告知が聞き手へ向けられたことを、日本語で最も素直に表す。
theological_decisions:
- issue: イザヤ書40章8節の「主のことば」と、読者に告げられた良い知らせとの関係
  choice: 引用では「主のことば」を保ち、後半でそれを読者に告げられた良い知らせとして同定する。
  alternative: 全体を「主からの知らせ」などと解釈的に統一する。
  rationale: 聖書引用とペトロによる福音的適用との連続性を示しながら、両者を説明的な言い換えによって平板化しないため。
- issue: εὐαγγελισθέν の訳し方
  choice: 「良い知らせとして告げられた」と動詞的に訳す。
  alternative: 「福音として宣べ伝えられた」
  rationale: 原語の「良い知らせを告げる」という意味を一般の読者にも明瞭にし、原文にない教理的内容を加えないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用部分には簡潔で格調ある調子を保った。「ことば」は相互参照の響きを保つため平仮名表記とし、後半では「良い知らせ」として意味を明らかにした。
