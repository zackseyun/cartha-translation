id: 1PE.1.5
reference: 1 Peter 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: ja
  text: あなたがたは、終わりの時[b]に現される備えの整った救いに至るため、神の力によって、信仰[a]を通して守られています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼を通して」とも訳せる。ここで「忠実さを通して」とする可能性は低い。
    reason: lexical_alternative
  - marker: b
    text: 「最後の時に」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουρουμένους
  choice: 守られています
  rationale: 現在受動分詞が表す、神による継続的な保護を自然な現代日本語で示す。「警護されています」より広く通じながら、保護・守備の含意を保つ。
- source_word: ἐν δυνάμει θεοῦ
  choice: 神の力によって
  rationale: 受動表現に伴う手段・力を表すἐνとして理解し、守りの源が神の力であることを明確にする。
- source_word: διὰ πίστεως
  choice: 信仰を通して
  rationale: διάと属格が示す媒介を保つ。πίστιςは文脈上「信仰」が最も自然だが、「信頼」の意味合いも脚注に残す。
- source_word: εἰς σωτηρίαν
  choice: 救いにあずかるため
  rationale: εἰςの目標・到達点を自然な日本語で表す。「あずかる」は原文に明示された別動詞ではないが、守られることが将来の救いを目指す関係を明瞭にする。
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: 現される用意ができている
  rationale: ἑτοίμηνの準備完了の状態と、受動不定詞ἀποκαλυφθῆναιをともに反映する。
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: 終わりの時に
  rationale: καιρόςを決定的・定められた時として捉えつつ、特定の終末論体系を持ち込まず簡潔に訳す。
- source_word: τοὺς
  choice: あなたがたは
  rationale: 前節から続く受け手を日本語で明示し、この一節だけでも文の対象が分かるようにする。
theological_decisions:
- issue: 神による保持と人間の信仰との関係
  choice: 神の力が守りの源であり、信仰がその媒介として示される訳にする。
  alternative: 信仰を単なる付加的説明とする、またはπίστιςを主として「忠実さ」と解する。
  rationale: ἐν δυνάμει θεοῦとδιὰ πίστεωςの双方を区別して訳し、堅忍や離反について本文以上の教派的結論を加えない。
- issue: 救いの時間的側面
  choice: ここでは、終わりの時に現される将来的な救いを表す。
  alternative: 現在の回心だけを指す、または新約聖書における救いの現在的側面を全面的に否定する。
  rationale: 「現される用意ができている」「終わりの時」という表現の将来志向を保ちつつ、他の箇所における救いの用法までは規定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の継続的な受動、神の力と信仰の関係、救いの将来的な顕現を保持した。脚注記号[a][b]は対応箇所を含む文末に置いた。
