id: 1PE.1.19
reference: 1 Peter 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: ja
  text: そうではなく、傷も汚れもない小羊の血のような、メシア[a]の尊い血によってです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「キリスト」。ギリシア語 Χριστός は「油を注がれた者」を意味する称号で、「メシア」とも「キリスト」とも訳せます。
    reason: 称号の意味を示す訳と、伝統的な音訳の両方を提示するため。
lexical_decisions:
- source_word: ἀλλὰ
  choice: そうではなく
  rationale: 前節の「朽ちるものによってではなく」という否定を受ける強い対照を、現代日本語で自然に示す。
- source_word: τιμίῳ
  choice: 尊い
  rationale: 高い価値と敬意の両方を表し、「血」との結びつきにもふさわしい格調を保つ。
- source_word: αἵματι
  choice: 血
  rationale: 具体的な名詞をそのまま訳し、犠牲の死という含意は説明に置き換えず本文に残す。
- source_word: ὡς
  choice: 血のような
  rationale: 比較対象が小羊そのものではなく、文法上まず「血」であることを日本語で明確にするため、「血」を補って表現する。
- source_word: ἀμνοῦ
  choice: 小羊
  rationale: 犠牲を想起させる標準的で直接的な訳語。
- source_word: ἀμώμου
  choice: 傷もない
  rationale: 祭儀的に欠陥がないことを表す語として訳し、単に道徳的な「非の打ち所がない」とはしない。
- source_word: καὶ
  choice: も
  rationale: 「傷も汚れもない」という日本語の並列構文で二つの形容を等しく結ぶ。
- source_word: ἀσπίλου
  choice: 汚れもない
  rationale: ἀμώμουとの違いを保ちながら、しみや汚点のない清浄さを自然な日本語で示す。
- source_word: Χριστοῦ
  choice: メシア
  rationale: ここでは称号としての意味が明瞭であり、油注がれた者という背景を伝える「メシア」を本文に採用する。
theological_decisions:
- issue: Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名の一部というより称号として機能しているため、その意味を透明に伝える「メシア」を採る。伝統的な音訳「キリスト」も正当な訳として脚注に示す。
- issue: 小羊との比較の範囲
  choice: 「小羊の血のような」として、明示的には血を比較する
  alternative: 「小羊のようなメシアの」として、メシアを小羊になぞらえる
  rationale: ὡς ἀμνοῦは直前のαἵματιに係り、「小羊の血のような」という比較を形成する。ただし属格Χριστοῦにより、その血がメシアのものであること、ひいてはメシアが小羊になぞらえられる含意も保たれる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「尊い血」「小羊」によって聖書本文にふさわしい格調を保った。前節から続く文であるため、冒頭は「そうではなく」、末尾は「によってです」とし、対照構文を明示した。
