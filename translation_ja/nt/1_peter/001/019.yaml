  naturalness: 「そうではなく、…によってです」は前節から続く対照構文として自然であり、明瞭な現代標準日本語である。「小羊の血のような、メシアの尊い血」はやや格調ある語順だが、聖書本文として不自然ではなく、比較対象を明確にする利点がある。
