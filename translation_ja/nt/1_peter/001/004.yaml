id: 1PE.1.4
reference: 1 Peter 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: ja
  text: 朽ちることも、汚れることも、しぼむこともない財産を受け継ぐためです。それは、あなたがたのために天に保たれています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομίαν
  choice: 受け継ぐ財産
  rationale: 「相続財産」より自然で分かりやすく、神から与えられる受け継ぎの財産という語義を保つ。前置詞 εἰς の方向・目的も「受け継ぐため」に反映した。
- source_word: ἄφθαρτον
  choice: 朽ちることもない
  rationale: 腐敗や滅びを免れている性質を、現代日本語で明瞭に表す。
- source_word: ἀμίαντον
  choice: 汚れることもない
  rationale: 汚染されず、汚れのない性質を直接的に表す。
- source_word: ἀμάραντον
  choice: しぼむこともない
  rationale: 花などがしおれ、輝きを失う比喩的語感を保つため、「色あせない」ではなく原義に近い表現を選んだ。
- source_word: τετηρημένην
  choice: 保たれています
  rationale: 完了受動分詞が示す、すでに守られ、現在もその状態にあることを自然に表す。
- source_word: ἐν οὐρανοῖς
  choice: 天に
  rationale: 複数形 οὐρανοῖς は日本語では通常、集合的・領域的な「天」とするのが自然。
- source_word: εἰς ὑμᾶς
  choice: あなたがたのために
  rationale: 受益者・将来の受領者を示す方向性を、自然な日本語で表した。
theological_decisions:
- issue: κληρονομία を何と捉えるか
  choice: 神から受け継ぐ財産として表現する
  alternative: 抽象的に「受け継ぐもの」または「嗣業」とする
  rationale: 具体的な相続・継承の含意を残しつつ、財産の内容を本文以上に特定しない。
- issue: 天に保たれている対象と受領者の関係
  choice: 財産が読者のために保たれているとする
  alternative: 読者自身が天で守られているかのように訳す
  rationale: 女性単数分詞 τετηρημένην は女性単数の κληρονομίαν に一致し、保たれている対象は「財産」である。
translation_notes:
  register: 明快で現代的ながら、三つの否定的形容を並行表現で保持し、荘重さと修辞的なリズムを残した。前節から続く文法上のつながりは、単独節としても読めるよう「ためです」で示した。
