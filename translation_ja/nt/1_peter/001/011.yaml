id: 1PE.1.11
reference: 1 Peter 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: ja
  text: 彼らは、自分たちのうちにおられるメシアの霊が、メシアに関わる苦しみ[a]と、それに続く栄光の数々とを前もって証ししておられたとき、だれを、あるいはどのような時を示しておられたのか、探り求めていました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシアの苦しみ」。
    reason: 原文の「メシアに関わる苦しみ」は、「メシアの苦しみ」と理解することもできるため。
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: 探り求めていました
  rationale: 前節から続く預言者たちの継続的で入念な探究を表し、単なる質問より強い調査の含みを自然な日本語で伝える。
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: だれを、あるいはどのような時を
  rationale: τίναを人についての問い、ποῖον καιρόνを時の性質についての問いとして訳し、難解な二重の問いを時間だけに限定しない。
- source_word: ἐδήλου
  choice: 示しておられた
  rationale: 未完了過去の継続的な指示を表す。主語が霊であるため、現代日本語として自然な敬意表現を用いた。
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: 自分たちのうちにおられるメシアの霊
  rationale: 霊が預言者たちのうちにおられたことと、メシアとの直接的な結びつきを保つ。Χριστόςは称号として「メシア」とした。
- source_word: προμαρτυρόμενον
  choice: 前もって証ししておられた
  rationale: προ-の先行性とμαρτυρέωの証言・証しの要素をともに保持する。
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: メシアに関わる苦しみ
  rationale: εἰςの関係性を保持しつつ、「メシアの苦しみ」と断定して曖昧さを消さない。「メシアに向けられた苦しみ」より自然で、文脈上の幅を残す。
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: それに続く栄光の数々
  rationale: μετὰ ταῦταの時間的順序とδόξαςの複数形を明示する。
theological_decisions:
- issue: 預言者たちと「メシアの霊」との関係
  choice: 「自分たちのうちにおられるメシアの霊」という直接的な表現を保持する。
  alternative: 「メシアについて語る預言の霊」または「メシアから与えられた霊」
  rationale: 原文はメシアと結びつく霊が預言者たちのうちに働いていたと述べるが、その関係をさらに定義してはいないため、説明的な言い換えを避けた。
- issue: τὰ εἰς Χριστὸν παθήματαにおけるεἰςの意味
  choice: 本文を「メシアに関わる苦しみ」とし、関係性を保ちながら曖昧さを残す。
  alternative: 「メシアの苦しみ」または「メシアに向けられた苦しみ」
  rationale: この構文は単純な所有格と同一ではなく解釈に幅がある。本文で過度に限定せず、文脈上有力な伝統的理解を脚注に示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。霊を主語とする動詞には自然な敬意表現を用いた。原文の長い構文は維持しつつ、日本語で関係が追いやすい語順に整えた。
