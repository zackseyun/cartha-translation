id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: ja
  text: 彼らには、これらのことについて、自分たちのためではなく、あなたがたのために仕えていたのだと示されました。[a] そして今や、それらのことは、天から遣わされた聖霊によってあなたがたに良い知らせを告げ知らせた人々を通して、あなたがたに伝えられました。[b] 天使たちも、これらのことを身をかがめてのぞき込みたいと願っています。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちにではなく、あなたがたに仕えていた」とも訳せます。ギリシア語の与格は、その奉仕によって益を受ける者を示しています。
    reason: lexical_alternative
  - marker: b
    text: 「聖霊にあって」とも訳せます。また「良い知らせを告げ知らせた」は「福音を宣べ伝えた」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「身をかがめてのぞき込む」は、注意深く熱心に見ようとする様子を表します。「詳しく見たい」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς
  choice: 彼らには
  rationale: 前節の預言者たちを受ける与格関係代名詞。日本語では指示対象と受け手の関係を明確にするため「彼らには」とした。
- source_word: ἀπεκαλύφθη
  choice: 示されました
  rationale: アオリスト受動態。啓示によって知らされた意味を保ちつつ、現代日本語として自然に表現し、行為者は本文どおり明示しない。
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ
  choice: 自分たちのためではなく、あなたがたのために
  rationale: 対照される二つの与格を受益者として明示し、ギリシア語の対比を自然な日本語で保持した。
- source_word: διηκόνουν
  choice: 仕えていた
  rationale: 未完了過去が示す継続的な奉仕を「〜ていた」で表した。「奉仕していた」より平明で、宗教的専門語に限定されない。
- source_word: αὐτά
  choice: これらのこと
  rationale: 直前まで述べられた預言上の事柄を指す中性複数代名詞。指示内容を日本語で明確にした。
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: そして今や、それらのことは……あなたがたに伝えられました
  rationale: νῦνの救済史的な現在性と受動態を保持した。「伝えられました」はἀναγγέλλωを過度に専門化せず表す。
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: あなたがたに良い知らせを告げた人々を通して
  rationale: εὐαγγελίζωの動詞的意味を平明に訳し、「福音」という名詞を原文以上に専門用語化することを避けた。
- source_word: πνεύματι ἁγίῳ
  choice: 聖霊によって
  rationale: ここでは福音告知の手段・働き手を表す道具の与格と理解した。文脈上、神の聖霊を指すため「聖霊」とした。
- source_word: ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: 天から遣わされた
  rationale: 聖霊を修飾する受動分詞の使命的意味を簡潔に保持した。
- source_word: ἐπιθυμοῦσιν
  choice: 願っています
  rationale: 現在形の継続的な強い願望を自然な現代日本語で表した。文脈上の熱望は後続表現によっても伝わる。
- source_word: παρακύψαι
  choice: 身をかがめてのぞき込む
  rationale: 単に「見る」よりも、前かがみになって注意深く中を見ようとする語感を保持した。
- source_word: ἄγγελοι
  choice: 御使いたち
  rationale: 天的文脈にある超自然的な使者を指す。日本語聖書で通用しつつ「天使」より原語の使者性も残す語を選んだ。
theological_decisions:
- issue: πνεύματι ἁγίῳの指示対象と与格の機能
  choice: 福音告知に働く神の聖霊、および手段を示す「聖霊によって」
  alternative: 「聖霊にあって」、または一般的な聖なる霊的力
  rationale: この救済史的文脈では人格的な神の聖霊を指すのが自然である。ただし与格には領域的な理解の余地もあるため脚注で代案を示した。
- issue: 預言者の奉仕の受益者
  choice: 預言者たちは後代の読者である「あなたがた」のために仕えた
  alternative: 預言者たちは自分たち自身または同時代人だけに仕えた
  rationale: οὐχ ἑαυτοῖς ὑμῖν δὲという明示的対照に従い、預言と現在の良い知らせの連続性を保った。
- issue: 御使いたちが見たい対象
  choice: 預言され、今告げ知らされた救いに関する「これらのこと」
  alternative: 聖霊または宣教者そのもの
  rationale: 中性複数のεἰς ἃは直前までの複数の事柄を受けるため、内容を限定しすぎず「これらのこと」とした。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、聖書本文にふさわしい品位を保った。長いギリシア語文は理解しやすいよう二文に分けたが、預言者の奉仕、現在の告知、御使いの願望という論理的連続は維持した。「御使い」はやや聖書的な語だが、天的使者という原語の意味と日本語読者への通用性を両立するため採用した。
