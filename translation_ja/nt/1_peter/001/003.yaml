id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: ja
  text: 私たちの主イエス・メシア[a]の神であり父である方が、ほめたたえられますように。この方は、その豊かなあわれみに従い、イエス・メシアが死者の中から復活されたことを通して、生きた希望を抱くよう、私たちを新たに生まれさせてくださいました。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス・キリスト」とも訳せる。ギリシア語の「クリストス」は、「メシア（油注がれた者）」という称号である。
    reason: alternative_reading
  - marker: b
    text: 「私たちに新しい誕生を与えてくださいました」とも訳せる。原語の動詞には、再び生まれる、または新たに生まれるという比喩がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: ほめたたえられますように
  rationale: 神に向けた頌栄の定型的な感嘆を、現代日本語で自然かつ礼拝的に表した。単なる状態描写の「祝福された」ではなく、賛美の呼びかけとして訳した。
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: 神また父
  rationale: 一つの冠詞のもとに置かれた二つの名詞を保ち、主イエスとの関係を示す「神」と「父」の双方を明示した。
- source_word: κυρίου
  choice: 主
  rationale: 敬称に弱めず、イエスに対する称号として訳した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を見える形で保つため「メシア」とした。日本語で一般的な「キリスト」は脚注に示した。
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: その大いなるあわれみにより
  rationale: 神の行為がその豊かなあわれみに即してなされたことを表しつつ、自然な日本語にした。
- source_word: ἀναγεννήσας
  choice: 私たちを新たに生まれさせ
  rationale: 神が行為主体であることと、再び生まれるという比喩の双方を保持した。「新しい誕生を与える」より具体的な出生の像が残る。
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: 生ける望みへと入れて
  rationale: εἰςの方向・到達点のニュアンスを示し、ζῶσανの生き生きとした比喩を「生ける」で保持した。日本語として補った「入れて」は、新生がこの望みを到達点とする構造を表す。
- source_word: δι’ ἀναστάσεως
  choice: 復活したことを通して
  rationale: διά＋属格が示す手段・媒介を「通して」で明確にした。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 復活表現の集合的背景を保ち、イエスが死者たちの中から復活したことを自然な日本語で示した。
theological_decisions:
- issue: Χριστόςをキリスト論的称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: 固有名の一部として不透明にせず、「油注がれた者」という称号性を読者に意識させるため「メシア」を本文に置いた。ただし日本語聖書で定着した形は脚注に示した。
- issue: ἀναγεννήσαςにおける神の主体性
  choice: 神は……私たちを新たに生まれさせ
  alternative: 私たちは新しく生まれ
  rationale: 原文では神が明示的な行為主体であるため、その主体性を保持した。一方で、この一節を越える教理体系は付加していない。
- issue: εἰς ἐλπίδα ζῶσανが示す新生の方向・結果
  choice: 生ける望みへと入れて
  alternative: 生ける望みを持つように
  rationale: 「持つように」だけではεἰςの方向性が弱まるため、望みを新生の到達点・領域として表現した。因果関係や望みの内容を過度に限定していない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、頌栄には「ほめたたえられますように」、復活による希望には「生ける望み」を用いて、聖書本文にふさわしい品位を保った。長いギリシア語一文は、日本語で理解しやすいよう二文に分けたが、神が主体であることと各修飾関係は保持した。
