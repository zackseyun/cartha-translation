reference: 1 Peter 1:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: ja
  text: あなたがたは、真理に従うことによって自らの魂を清め、偽りのない兄弟愛を目指しているのですから、心から互いに熱心に愛しなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡγνικότες
  choice: 清めたのですから
  rationale: 完了分詞が示す、すでになされ現在にも関わる行為を表した。日本語では主命令との関係を自然に示すため「のですから」としたが、清めの手段や根拠を過度に補ってはいない。
- source_word: τὰς ψυχὰς ὑμῶν
  choice: 自分の魂を
  rationale: ψυχήの基本的な語感を保ちつつ、各人が自らの全人格的・内面的な命を清めるという文脈を表した。「あなたがたの魂」より自然な再帰表現とした。
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: 真理に従うことによって
  rationale: ἐνの手段的な含意を明確で自然な日本語にし、真理への従順が清めと密接に結びつくことを保った。
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: 偽りのない兄弟愛に向けて
  rationale: εἰςが表し得る目的・到達方向を「に向けて」で示し、目的か結果かを一方に断定しすぎないようにした。ἀνυπόκριτοςは平明に「偽りのない」とした。
- source_word: φιλαδελφίαν
  choice: 兄弟愛
  rationale: 信仰共同体における家族的な愛情を表す語であり、後続のἀγαπάωとの語彙上の違いも保てる。女性の信徒も含むことは脚注で説明した。
- source_word: ἐκ καρδίας
  choice: 心から
  rationale: SBLGNT本文には「清い」に当たる形容詞がないため、そのまま「心から」と訳した。異読は脚注に残した。
- source_word: ἀλλήλους ἀγαπήσατε
  choice: 互いを…愛しなさい
  rationale: 相互性とアオリスト命令の直接的な勧告を、自然で品位ある現代日本語で表した。
- source_word: ἐκτενῶς
  choice: 熱心に
  rationale: 愛の強さと持続的な真剣さを示しつつ、誇張や古風さを避けた。
theological_decisions:
- issue: φιλαδελφίαとἀγαπάωの訳し分け
  choice: 「兄弟愛」と「愛しなさい」を用いて違いを保つ
  alternative: 双方を一般的な「愛」で訳す
  rationale: 原文は関連しながら異なる二つの愛の表現を用いる。語感の進展を残す一方、両者に厳密な神学的区別があるとは断定しない。
- issue: φιλαδελφίαの性別を含む範囲
  choice: 本文は「兄弟愛」とし、姉妹を含む信者相互の家族的愛であることを脚注で示す
  alternative: 本文を「信仰を共にする人々への愛」または「兄弟姉妹への愛」とする
  rationale: 原語の家族的な比喩と後続動詞との違いを保ちつつ、現代の読者が男性だけを指すと誤解しないよう注記した。
- issue: ἐκ καρδίαςに関する本文異読
  choice: SBLGNTに従い「心から」とする
  alternative: 「清い心から」とする
  rationale: 指定された原文にはκαθαρᾶςがない。写本異読は本文へ取り込まず、脚注で知らせた。
- issue: εἰςが表す目的または結果
  choice: 「兄弟愛に向けて」とし、方向性を示す
  alternative: 「兄弟愛に至るために」または「兄弟愛に至り」とする
  rationale: 目的と結果のいずれにも開かれ得る前置詞の含みを、可能な限り一方に限定せず保持した。
translation_notes:
  register: 明快な現代標準語を用い、勧告としての品位を保った。「魂」「兄弟愛」は原文の語彙的な質感を残し、誤解が生じ得る点を脚注で補った。
