id: 1PE.1.18
reference: 1 Peter 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: ja
  text: あなたがたが父祖から受け継いだむなしい生き方から贖い出されたのは、銀や金のような朽ちるものによってではない、と知っているからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖い出された」は、代価を払って解放されたという意味を含みます。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: 知っているからです
  rationale: 完了形の分詞で、周囲の勧告の根拠を示す副詞的用法と理解した。「知っていて」も可能だが、日本語では理由を明示するほうが自然である。
- source_word: ἐλυτρώθητε
  choice: 贖い出された
  rationale: 代価によって解放するという λυτρόομαι の意味を保ち、続く銀・金との対比にもつながる表現である。
- source_word: φθαρτοῖς
  choice: 朽ちるもの
  rationale: 文脈では名詞的に用いられ、次節の価値あるものとの対比をなす。消滅し劣化する性質を平明に表す。
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: 銀や金のような
  rationale: 銀と金を「朽ちるもの」の具体例として自然な日本語で示す。与格は手段を表すため、後続の「による」と結びつけた。
- source_word: ἐκ
  choice: から
  rationale: 以前の生き方からの分離・解放という起点を表す。
- source_word: ματαίας
  choice: むなしい
  rationale: 実を結ばず、空虚で無益であるという μάταιος の意味を、現代日本語で簡潔に表す。
- source_word: ἀναστροφῆς
  choice: 生き方
  rationale: 単なる個々の行為ではなく、生活態度や振る舞い全体を指す語として自然である。
- source_word: πατροπαραδότου
  choice: 先祖から受け継いだ
  rationale: 「父祖から伝えられた」という意味を、祖先一般を指す日本語として明確に表す。「父たちから伝えられた」より自然で、世代的継承の含意も保つ。
theological_decisions:
- issue: 受け継がれた伝統を表す語
  choice: 先祖から受け継いだ
  alternative: 父祖から伝えられた
  rationale: πατροπαράδοτος は祖先から伝承されたことを表す。日本語の「先祖」は原語の集合的な父祖の意味を自然に伝え、特定の民族的・宗教的伝統に限定しない。
- issue: 贖いの用語
  choice: 贖い出された
  alternative: 身代金を払って解放された
  rationale: 原語の代価による解放の比喩を保ちつつ、この節だけで贖いの仕組みを必要以上に説明しない。銀や金との対比と次節によって代価のイメージが明らかになる。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「むなしい生き方」は日常的な理解しやすさを保ち、「贖い出された」で聖書的な重みと原語の身代金・解放のイメージを伝えた。節末の分詞は文脈との論理関係を自然に示すため「知っているからです」とした。
