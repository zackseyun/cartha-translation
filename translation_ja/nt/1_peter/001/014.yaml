  text: ὡς τέκνα ὑπακοῆς, μὴ συσχηματιζόμενοι ταῖς πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν ἐπιθυμίαις,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/014.yaml
  text: as children of obedience[a], not conforming yourselves to the desires you formerly had in your ignorance,
translation:
  language: ja
  text: 従順な子どもとして[a]、かつて無知であったときに抱いていた欲望に自分を合わせず、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「従順の子どもとして」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: として
  rationale: 勧告を受ける者のあり方・立場を示す表現として、現代日本語で自然な「として」とした。
- source_word: τέκνα ὑπακοῆς
  choice: 従順の子ども
  rationale: 属格を形容詞に置き換えきらず、従順によって特徴づけられる者という原文の比喩的・倫理的な身分表現を保った。日本語ではやや特異な表現であるため、脚注に自然な言い換えを示した。
- source_word: μὴ συσχηματιζόμενοι
  choice: 自分を合わせず
  rationale: 現在分詞の継続的な勧告の力と、中動態的に理解できる自己の関与を表す。「同じ形にならず」より明瞭で、「倣わず」より原語の同調・適合の含みを保つ。
- source_word: ταῖς ... ἐπιθυμίαις
  choice: 欲望に
  rationale: 文脈上は道徳的に秩序を失った強い願望を指すため「欲望」とした。性的意味だけに限定される表現は避けた。
- source_word: πρότερον
  choice: 以前
  rationale: 読者の過去の生き方を示す時間表現として簡潔に訳した。
- source_word: ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: 無知であったとき
  rationale: 前置詞句を自然な時間表現として訳しつつ、神とその御心を知らなかった以前の状態という意味を、本文以上に限定せず保った。
theological_decisions:
- issue: τέκνα ὑπακοῆςを形容詞的に平滑化するか
  choice: 本文では「従順の子ども」とし、原文の属格構文を見える形で保つ
  alternative: 「従順な子ども」
  rationale: 単なる性質の描写に弱めず、従順によって特徴づけられる者というアイデンティティーの力を保つ一方、脚注で自然な日本語の意味を明示した。
- issue: ἐν τῇ ἀγνοίᾳ ὑμῶνの「無知」の内容を具体化するか
  choice: 「無知であったとき」とし、対象を明示しない
  alternative: 「神を知らなかったとき」
  rationale: 文脈上その含意はあり得るが、この節自体は無知の対象を明示していないため、訳文で解釈を固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、原文の「従順の子ども」という特徴的な身分表現を残した。節末は原文どおり次の勧告へ続く分詞構文であるため、読点で終えている。
