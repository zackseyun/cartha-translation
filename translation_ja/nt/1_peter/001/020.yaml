source:
  edition: SBLGNT
  text: προεγνωσμένου μὲν πρὸ καταβολῆς κόσμου, φανερωθέντος δὲ ἐπ’ ⸀ἐσχάτου τῶν χρόνων δι’ ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: ja
  text: この方は、世界の基が据えられる前に、あらかじめ知られていました[a]。しかし、時代の終わりに、あなたがたのために明らかにされました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「前もって選ばれていました」。ギリシア語は「あらかじめ知られていた」と言っており、神の目的を含意することはありますが、必ずしも本文で「選ばれた」と訳す必要はありません。
    reason: lexical_alternative
  - marker: b
    text: 別訳「終わりの時代に」。
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: あらかじめ知られていました
  rationale: アオリスト受動分詞で、19節のキリストを受ける。「選ばれていた」と解釈を強めず、「前もって知る」という語義を保った。
- source_word: πρὸ καταβολῆς κόσμου
  choice: 世界の基が据えられる前から
  rationale: 創造以前を指す慣用句の比喩を保ちつつ、現代日本語として理解しやすくした。
- source_word: φανερωθέντος
  choice: 現されました
  rationale: 見える形で明らかにされたという受動の意味を簡潔に表し、キリストの出現という文脈にも合う。
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: 時代の終わりに
  rationale: 原文の終末論的な時間表現を保ち、原文に明示されない「この」を補わなかった。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのために
  rationale: διά＋対格がここで表す、読者の益のためという意味を自然に伝える。
theological_decisions:
- issue: 創造以前のキリストについての προεγνωσμένου の意味
  choice: 本文では「あらかじめ知られていました」とし、神の選定や予定まで明示しない。
  alternative: 「あらかじめ選ばれていました」または「あらかじめ定められていました」
  rationale: 神の目的を含意し得るが、原語自体は「前もって知る」であり、選びや予定という特定の解釈に本文を限定しないことで神学的な含みを保つ。
- issue: ἐπ’ ἐσχάτου τῶν χρόνων の時間的意味
  choice: 「時代の終わりに」
  alternative: 「この終わりの時代に」
  rationale: 終末的な時期を示しつつ、ギリシア語に明示されていない指示語「この」を本文に加えない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「この方」で前節のキリストを受け、受動表現を保った。二つの対照的な分詞は、日本語で読みやすいよう二文に分け、「しかし」で対比を明示した。
