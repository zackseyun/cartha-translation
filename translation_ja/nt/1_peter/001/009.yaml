  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: ja
  text: あなたがたは、あなたがたの信仰の結果[a]、すなわち魂の救い[b]を受け取っているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの信仰の終わり」「あなたがたの信仰の目標」または「あなたがたの信仰の到達点」。
    reason: lexical_alternative
  - marker: b
    text: 「魂」は、「命」または「人そのもの」とも訳せる。ギリシア語は文脈により、魂、命、人を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: 受けている
  rationale: 現在分詞の継続的な響きを保ちつつ、信仰がもたらすものを現に受け取っていることを自然な日本語で表した。中動態・受動態の区別は文脈上決定的でないため、過度に明示しない。
- source_word: τέλος
  choice: 結ぶ実
  rationale: ここでは単なる時間的な「終わり」ではなく、信仰がもたらす到達点・結果を指す。「結ぶ実」はその実現した結果を自然に表す。別訳を脚注に残した。
- source_word: πίστεως ὑμῶν
  choice: 信仰の
  rationale: ὑμῶνは読者の信仰を示すが、日本語では文頭の「あなたがたは」によって所有関係が明らかなため、「あなたがたの」を重ねず簡潔にした。πίστιςは文脈上、読者の信仰を指す。
- source_word: σωτηρίαν
  choice: 救い
  rationale: 本書簡の文脈に適合する標準的な訳語であり、現在経験されている救いと将来完成する救いの両方への含みを保つ。
- source_word: ψυχῶν
  choice: 魂
  rationale: 語の直接的な意味を保った。ただしψυχήは文脈により「命」や「人そのもの」も表し得るため、その幅を脚注で示し、身体を排除する二元論を本文に持ち込まない。
theological_decisions:
- issue: πίστιςの意味
  choice: 信仰
  alternative: 信頼、忠実さ
  rationale: この箇所では、読者がキリストを信じることを指すのが最も自然である。語が持ち得る別の意味を本文に持ち込んで解釈を限定しない。
- issue: 「魂の救い」が指す範囲
  choice: 魂の救い
  alternative: 命の救い、人そのものの救い
  rationale: 原文に近い表現を保ちつつ、これを身体から切り離された魂だけの救いと断定しない。ψυχήの意味の広がりは脚注で明示する。
- issue: τέλοςの時間的・目的的・結果的含意
  choice: 信仰の結ぶ実
  alternative: 信仰の終わり、目標、結果
  rationale: 文脈では信仰によって得られる実現した結果が前面に出るが、原語には「終わり」「目標」「到達点」の含みもあるため、脚注で曖昧さを保存する。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体とした。「信仰の結ぶ実、すなわち魂の救い」によって、後半が前半の内容を説明する同格関係を自然に示した。文末の「のです」は、前文を受ける現在分詞の説明的なつながりを表す。
