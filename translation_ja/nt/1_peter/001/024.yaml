id: 1PE.1.24
reference: 1 Peter 1:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: ja
  text: なぜなら、「すべての人[a]は草のようで、その栄え[b]はみな草の花のようだ。草は枯れ、花は落ちた」からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「すべての肉なるもの」。人間が死すべき、はかない存在であることを強調し、イザヤ書40章6節を踏まえています。
    reason: lexical_alternative
  - marker: b
    text: 「栄え」は、「輝き」または「誉れ」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: なぜなら……からです
  rationale: 直前の内容の根拠を示す因果関係を、明瞭で自然な現代日本語で表した。
- source_word: πᾶσα σὰρξ
  choice: すべての人[a]
  rationale: 直訳は「すべての肉」だが、ここでは人間の死すべき弱さとはかなさを指す。本文は自然な日本語とし、原文の比喩は脚注に残した。
- source_word: ὡς χόρτος
  choice: 草のようで
  rationale: 人間のはかなさを草にたとえる直喩を簡潔に保持した。
- source_word: πᾶσα δόξα αὐτῆς
  choice: その栄えはみな[b]
  rationale: δόξαがここで表す人間の誉れ、華やかさ、輝きを「栄え」で表し、πᾶσαの包括性を「みな」で保持した。
- source_word: ὡς ἄνθος χόρτου
  choice: 草の花のようだ
  rationale: イザヤ書からの引用にある属格表現と、草に咲く花の像を保った。
- source_word: ἐξηράνθη
  choice: 枯れ
  rationale: 草が乾いて枯れることを、詩的かつ自然な日本語で表した。
- source_word: ἐξέπεσεν
  choice: 落ちた
  rationale: 花が茎から落ちる像を簡潔に表し、ギリシア語のアオリストに対応して過去形とした。
theological_decisions:
- issue: 死すべき人間を指す σάρξ の訳し方
  choice: 本文では「すべての人」、脚注で直訳「すべての肉なるもの」
  alternative: すべての肉なるもの
  rationale: ここでσάρξは罪深い性質ではなく、もろく死すべき人間全体を指す。「すべての肉」は現代日本語では意味が伝わりにくいため本文を明瞭にしつつ、イザヤ40章6節との語句上の響きと身体性を脚注で保存した。
- issue: δόξα の意味領域
  choice: 栄え
  alternative: 輝き／誉れ
  rationale: 人間が誇る美しさ、華やかさ、誉れを含み得る語の幅を、文脈に合う「栄え」で保った。特定の神学的意味に限定しない。
translation_notes:
  register: 聖書引用としての詩的な並行表現を保ちながら、一般の読者に分かりやすい現代標準日本語とした。引用全体を因果構文「なぜなら……からです」で包み、原文のδιότιを明示した。「草は枯れ、花は落ちた」ではギリシア語の時制と簡潔な詩調を保った。
