  text: ἐν ᾧ ἀγαλλιᾶσθε, ὀλίγον ἄρτι εἰ ⸀δέον λυπηθέντες ἐν ποικίλοις πειρασμοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: ja
  text: 'あなたがたはこのことを大いに喜んでいます。たとえ今しばらくの間、必要であれば、さまざまな試練[a]の中で悲しみを味わっていても。


    [a] 「試練」と訳したギリシア語は「試すこと」を意味し、文脈によっては「誘惑」を指すこともある。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「試練」と訳したギリシア語は「試すこと」を意味し、文脈によっては「誘惑」を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: このことを
  rationale: 直前に述べられた救い、希望、朽ちない財産を含む内容を受ける表現として、関係代名詞の指示範囲を過度に限定せず、自然な日本語にした。
- source_word: ἀγαλλιᾶσθε
  choice: 大いに喜んでいます
  rationale: 強い喜び、歓喜を表す動詞の力を、「喜ぶ」だけで弱めず、現代日本語として明瞭に表した。
- source_word: ὀλίγον ἄρτι
  choice: 今しばらく
  rationale: 現在の時点を表すἄρτιと、期間の短さを表すὀλίγονの双方を簡潔で自然な日本語にした。
- source_word: εἰ δέον
  choice: 必要ならば
  rationale: 必要性を表すδέονと条件を表すεἰを保ち、その必要の主体や神学的理由は補わなかった。
- source_word: λυπηθέντες
  choice: 悲しみを味わっている
  rationale: 悲しみを被る受動的な経験を、日本語として不自然な受動形を避けつつ表した。
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: さまざまな試練に遭って
  rationale: 文脈は苦難と信仰の吟味を扱うためπειρασμοίを「試練」とした。ἐνは、その悲しみが生じる状況を自然な日本語で示した。
theological_decisions:
- issue: 苦難の文脈におけるπειρασμοῖςの意味
  choice: 試練
  alternative: 試すこと／誘惑
  rationale: 次節では信仰が試されることが語られ、ここでは外から受ける苦難が中心である。「誘惑」へ狭めず、同時に語の意味の広がりは脚注に残した。
- issue: εἰ δέονが示す必要性
  choice: 必要ならば
  alternative: 必要なので／神が必要とされるなら
  rationale: 原文の条件的な言い方を保ち、苦難の必要性を断定したり、その主体を明示したりしなかった。
translation_notes:
  register: 明瞭で品位ある現代標準語。「今しばらく」で簡潔さを保ち、「大いに喜ぶ」と「悲しみを味わう」の対照を際立たせた。脚注記号は説明対象である「試練」の直後に置いた。
