id: 1PE.1.13
reference: 1 Peter 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: ja
  text: ですから、心の腰に帯を締め[a]、冷静さを保ち、イエス・メシアが現れる時にもたらされる恵みに、ひたすら希望を置きなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたの心の腰に帯を締め」。行動できるよう心を整える、という意味。
    reason: lexical_alternative
  - marker: b
    text: 「ひたすら冷静さを保ち、……恵みに希望を置きなさい」とも訳せる。「ひたすら」に当たる語は、「冷静さを保ち」と「希望を置きなさい」のどちらにかかるとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Διὸ
  choice: ですから
  rationale: 直前の議論を受ける推論的な接続を、自然な現代日本語で示す。
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: 心の腰に帯を締め
  rationale: 行動に備えて長衣の裾を帯にたくし上げるという原文の比喩を保つ。「思い」よりも文脈上自然な「心」を用いた。
- source_word: νήφοντες
  choice: 冷静さを保ち
  rationale: 新約で比喩的に用いられ、ここでは精神的な覚醒と自己統御を表す。飲酒との対比を不必要に持ち込まない。
- source_word: τελείως
  choice: ひたすら
  rationale: ἐλπίσατεにかけ、希望を余すところなく恵みに向ける意味を自然に表す。ただし分詞νήφοντεςにかかる可能性も脚注で示す。
- source_word: ἐλπίσατε
  choice: 希望を置きなさい
  rationale: アオリスト命令形の、意志的かつ決定的に希望を定める響きを表す。
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: もたらされる恵みに
  rationale: 現在受動分詞の「運ばれて来る／もたらされる」という動きを保ちつつ、終末的に与えられる恵みを表現する。
- source_word: ἐν ἀποκαλύψει
  choice: 現れる時に
  rationale: ἀποκάλυψιςの「覆いが取り除かれて現れること」を平明な日本語で表し、ここでの時間的関係も明確にする。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςが称号として生きているため、「キリスト」を音写せず「メシア」と訳す。日本語では中黒により一まとまりの称号名として自然に示す。
theological_decisions:
- issue: 「心の腰」という比喩を本文に残すか
  choice: 「心の腰に帯を締め」として比喩を保持する
  alternative: 心を引き締めて行動に備え
  rationale: 原文の身体的で鮮明な比喩を保持し、意味は脚注で補う。
- issue: τελείωςが修飾する語
  choice: 主命令「希望を置きなさい」にかけて「ひたすら」と訳す
  alternative: 「完全に冷静さを保ち」としてνήφοντεςにかける
  rationale: 語順上どちらも可能である。本文では命令への係りを自然に表し、真正な統語的曖昧さは脚注で明示する。
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名化しきった姓ではなく、終末的に現れる者の称号としての働きが聞き取れる。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の印象的な比喩は保持し、難解さを脚注で補った。「冷静さを保つ」は禁酒の含意を避けつつ、精神的な覚醒を伝える。
