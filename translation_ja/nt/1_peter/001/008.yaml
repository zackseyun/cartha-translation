id: 1PE.1.8
reference: 1 Peter 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: ja
  text: あなたがたは、この方を見たことがないのに愛しており、今も見てはいないのに、この方を信じ、言葉では言い表せない、栄光に満ちた[a]喜びにあふれています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「栄光を与えられた喜び」。または「栄光ある喜び」とも訳せる。
    reason: δεδοξασμένῃ は完了受動分詞であり、喜びが栄光を与えられた状態を示すとも、栄光に満ちていることを示すとも理解できるため。
lexical_decisions:
- source_word: ὃν οὐκ ἰδόντες
  choice: この方を見たことがないのに
  rationale: 関係代名詞の指示対象は直前の文脈にあるイエス・キリスト。「見たことがない」はアオリスト分詞が示す過去から現在までの非経験を自然な日本語で表す。
- source_word: ἀγαπᾶτε
  choice: 愛しており
  rationale: 現在形の継続的な状態を示し、後続節と一文として自然につなぐ。
- source_word: ἄρτι μὴ ὁρῶντες
  choice: 今も見てはいないのに
  rationale: ἄρτιの現在時を明示し、現在分詞が表す現時点での非視認を保つ。「も」は先行する非視認との連続を自然に示す。
- source_word: εἰς ὃν ... πιστεύοντες
  choice: この方を信じ
  rationale: πιστεύω εἰςが表す、人物を対象とする信仰を明確で自然な日本語にした。
- source_word: δὲ ἀγαλλιᾶσθε
  choice: 喜びにあふれています
  rationale: δὲの対照は「のに」で表し、ἀγαλλιάωの強い歓喜を「喜びにあふれる」で自然に伝える。
- source_word: χαρᾷ ἀνεκλαλήτῳ
  choice: 言葉では言い表せない…喜び
  rationale: ἀνεκλάλητοςが示す、言語による表現を超えた喜びを明瞭に表す。
- source_word: δεδοξασμένῃ
  choice: 栄光に満ちた
  rationale: 完了受動分詞が喜びの現にある栄光ある状態を表す。日本語で不自然な「栄光化された」を避けつつ、δόξαとの語彙的つながりを保つ。
theological_decisions:
- issue: πιστεύοντες εἰς ὃν の訳し方
  choice: この方を信じ
  alternative: この方に信頼し
  rationale: ここでは論争的な属格構文ではなく、信仰の対象を示す通常の πιστεύω εἰς である。「信じる」が原語に透明で、現代日本語としても自然。
- issue: δεδοξασμένῃ χαρᾷ の解釈
  choice: 栄光に満ちた喜び
  alternative: 栄光を受けた喜び／栄光ある喜び
  rationale: 完了受動分詞の動詞性を日本語で完全に再現すると不自然になるため、喜びが栄光を帯びた状態を表す自然な表現を本文に採用し、受動的な読みの可能性を脚注に残す。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準語。「彼」ではなく敬意と指示の明確さを兼ねる「この方」を用いた。原文の一続きの構文と、見ないこと・信じること・喜ぶことの緊張関係を保った。
