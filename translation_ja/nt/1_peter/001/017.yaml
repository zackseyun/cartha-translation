id: 1PE.1.17
reference: 1 Peter 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: ja
  text: また、もしあなたがたが、一人ひとりの行いに応じてえこひいきなく裁く方を父と呼び求める[a]のであれば、あなたがたの寄留の時を、恐れをもって[c]過ごしなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「父と呼ぶ」。この語には、神を父として呼びかける、または神に訴えるという含みがある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「異郷に暮らす期間を」または「一時滞在の期間を」。原語は、外国人や一時滞在者として暮らすことを表す。
    reason: lexical_alternative
  - marker: c
    text: または「畏敬をもって」「畏怖のうちに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: 呼ぶ
  rationale: 中動態の動詞と述語的な「父」を合わせ、「父と呼ぶ」とした。神に呼びかけ、神を父として仰ぐ意味を、自然な現代日本語で表す。
- source_word: πατέρα
  choice: 父
  rationale: 冠詞のない対格は述語的に機能し、神を父と呼ぶことを示す。日本語では固有名詞的な大文字表記がないため、簡潔に「父」とした。
- source_word: ἀπροσωπολήμπτως
  choice: えこひいきなく
  rationale: 身分や外面的事情によって人を偏って扱わないことを、一般読者に明瞭な表現で示す。
- source_word: κρίνοντα
  choice: 裁く方
  rationale: 現在分詞が神を修飾しているため、その継続的・特徴的な働きを自然な連体表現で訳した。
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: 一人ひとりの行いに応じて
  rationale: κατάの基準の意味と、ἔργονの単数集合的な意味を保ち、各人の責任を示す。功績や救済論について本文以上の解釈は加えない。
- source_word: ἐν φόβῳ
  choice: 恐れをもって
  rationale: φόβοςが持つ恐れ、畏敬、畏怖の幅を狭めず、父である神の公平な裁きとの緊張を保つ。
- source_word: παροικίας
  choice: 寄留
  rationale: 外国人または一時滞在者として住むことを表す語であり、「亡命」と限定せず、第一ペトロの寄留者という主題を保つ。
- source_word: ἀναστράφητε
  choice: 過ごしなさい
  rationale: ここでは生活態度を含めて日々を生きるよう命じるアオリスト命令形。期間を表す目的語との組み合わせに自然な「過ごす」を用いた。
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: 寄留の時を
  rationale: 対格のχρόνονが継続期間を表すことを保ちつつ、簡潔で格調ある日本語とした。
theological_decisions:
- issue: 父である神、また裁く神との関係における φόβος の意味
  choice: 本文を「恐れをもって」とする
  alternative: 「畏敬をもって」「畏れのうちに」
  rationale: 神の父性と公平な裁きが同時に語られる文脈で、語の道徳的な厳粛さと神学的緊張を残す。単なる敬意へと弱めず、脚注で畏敬・畏怖の可能性を示す。
- issue: 行いに応じた裁きの範囲
  choice: 「一人ひとりの行いに応じて」と直接的に訳す
  alternative: 信者の行為に対する終末的裁き、または神の評価に関する一般原則と明示する
  rationale: 原文は各人の行いを基準とする公平な裁きを述べるが、功績、救い、確信をめぐる特定の教派的体系までは明示しないため、それを補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の厳粛さにふさわしい格調を保った。「えこひいきなく」は「偏り見ることなく」より一般読者に分かりやすい。「寄留」はやや文語的だが、外国人・一時滞在者としての生活という原語の含意を簡潔に保持できるため採用し、脚注で説明した。
