  text: Πέτρος ἀπόστολος Ἰησοῦ Χριστοῦ ἐκλεκτοῖς παρεπιδήμοις διασπορᾶς Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/001.yaml
  text: Peter[a], an apostle of Jesus the Messiah, to the chosen sojourners of the dispersion in Pontus, Galatia, Cappadocia, Asia, and Bithynia[e][d][c][b],
translation:
  language: ja
  text: イエス・メシア[a]の使徒ペトロから、ポントス、ガラテヤ、カパドキア、アジア、ビティニアに離散している、選ばれた寄留者たち[b][c]へ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス・キリスト」とも表せる。
    reason: lexical_alternative
  - marker: b
    text: 「寄留者」は、故郷を離れて他所に一時的に住む者、または在留外国人として暮らす者を表す。
    reason: lexical_alternative
  - marker: c
    text: 「離散」はユダヤ人のディアスポラを想起させると同時に、神の民が真の故郷を離れて暮らしているという、より広い含みを持つ可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: Πέτρος
  choice: ペトロ
  rationale: ギリシア語の人名を現代日本語で明瞭に音写した。
- source_word: ἀπόστολος
  choice: 使徒
  rationale: 書簡冒頭の自己紹介における、権威を伴う定着した職名として訳した。単なる一般的な「使者」には狭めない。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςの称号としての意味を「メシア」で保ちつつ、属格関係を「イエス・メシアの」と自然に示した。日本語で定着した「イエス・キリスト」も脚注に掲げる。
- source_word: ἐκλεκτοῖς
  choice: 選ばれた人々
  rationale: 神によって選ばれた者という意味を保ちながら、特定の教派的体系を連想させやすい専門語を避けた。
- source_word: παρεπιδήμοις
  choice: 寄留している
  rationale: 自分の本来の故郷ではない土地に一時的に住む者という意味を、官僚的にならない現代日本語で表した。
- source_word: διασπορᾶς
  choice: 離散し
  rationale: 各地に散らされた民という語感を保ち、ユダヤ人の離散と、真の故郷を離れて暮らす神の民という含みの双方を許す表現とした。
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: ポントス、ガラテヤ、カパドキア、アジア、ビティニアに
  rationale: 当時の地域名を標準的に音写し、ギリシア語の属格による地理的関係を日本語では助詞「に」で明示した。
theological_decisions:
- issue: ἐκλεκτοῖςの訳し方
  choice: 選ばれた人々
  alternative: 選民／選ばれた者たち
  rationale: 本文が明言する神の選びを保持しつつ、特定の予定論体系を訳語だけで持ち込まないため。
- issue: παρεπιδήμοις διασπορᾶςの指示範囲
  choice: 離散し、寄留している
  alternative: 離散の民である寄留者たち／故郷を追われた人々
  rationale: 実際の社会的・地理的境遇、ユダヤ人のディアスポラへの響き、神の民の霊的な寄留という可能性を一つに限定しない。
- issue: Χριστοῦの称号性
  choice: メシア
  alternative: キリスト
  rationale: 「油を注がれた者」という称号の意味を読者に示す一方、日本語で定着した別表現を脚注に残した。
translation_notes:
  register: 書簡の差出人と宛先が一読で分かる、現代的で品位ある文体とした。原文の名詞句を日本語では「離散し、寄留している」と展開し、意味関係を明瞭にした。地域名は列挙のリズムを保ち、「アジア」は現代の大陸全体ではなく当時のローマ属州名として用いている。
