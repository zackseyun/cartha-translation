  text: ἀλλὰ κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον καὶ αὐτοὶ ἅγιοι ἐν πάσῃ ἀναστροφῇ γενήθητε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/015.yaml
  text: but as the Holy One who called you is holy[a], you yourselves also be holy in all your conduct[b],
translation:
  language: ja
  text: むしろ、あなたがたを召してくださった聖なる方にならい、あなたがた自身も、あらゆる行いにおいて聖なる者となりなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生活のあらゆる面で、聖でありなさい」とも訳せる。「行い」と訳したギリシア語は、人の生き方や生活態度全体を指すことがある。また「聖なる者となりなさい」は「聖でありなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 前節にある以前の欲望に従う生き方との強い対照を自然に示す。
- source_word: κατὰ τὸν καλέσαντα ὑμᾶς ἅγιον
  choice: あなたがたを召してくださった聖なる方にならい
  rationale: κατάが示す規範・対応の意味を「にならい」で表し、ἅγιονが召した方の性質を表す構造を保持する。「くださった」は神の召しを自然な敬語で表す。
- source_word: καὶ αὐτοὶ
  choice: あなたがた自身も
  rationale: αὐτοίの強調とκαίの付加的な意味をともに保持する。
- source_word: ἐν πάσῃ ἀναστροφῇ
  choice: あらゆる行いにおいて
  rationale: ἀναστροφήは個々の行為だけでなく生活態度全般を指しうるが、本文では簡潔で格調ある表現を選んだ。
- source_word: γενήθητε
  choice: 聖なる者となりなさい
  rationale: γίνομαιのアオリスト命令形が持ちうる、ある状態に至り、その状態を示すよう求める力を訳出する。日本語でも自然な勧告となる。
theological_decisions:
- issue: 神の聖さと信者への命令との対応
  choice: 聖なる方にならい……聖なる者となりなさい
  alternative: 召してくださった方が聖であるように……聖でありなさい
  rationale: 原文のκατάによる規範的対応と、ἅγιον／ἅγιοιの反復を保つ。神の聖さを信者の聖さの基準として示しつつ、説明的な因果関係を付加しない。
- issue: γενήθητεの命令の力
  choice: 聖なる者となりなさい
  alternative: 聖でありなさい
  rationale: 「となりなさい」は原語のγίνομαιをより直接に反映する一方、聖化の過程について特定の教理体系を読み込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告としての格調を保った。「聖なる方」と「聖なる者」の反復によって原文の対応関係を示した。
