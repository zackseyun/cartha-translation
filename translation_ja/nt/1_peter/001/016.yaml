  text: διότι γέγραπται ⸀ὅτι Ἅγιοι ⸀ἔσεσθε, ὅτι ἐγὼ ⸀ἅγιος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/016.yaml
  text: because it is written[a], “You shall be holy, because I am holy.”
translation:
  language: ja
  text: それは、こう書かれているからです。「あなたがたは聖なる者となりなさい。[a]わたしが聖なる者だからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたは聖なる者となる」。ギリシア語は聖書の引用に従って未来形を用いているが、ここでは命令の力を持つ。
    reason: 未来形の形式と命令的な用法の双方を示し、原文の緊張を保つため。
lexical_decisions:
- source_word: διότι
  choice: それは、～からです
  rationale: 直前の勧めを聖書によって根拠づける因果関係を、自然な現代日本語で明示する。
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 聖書引用を導入する定型表現であり、完了受動形が示す、書かれた言葉の現在も続く効力を保つ。
- source_word: ὅτι（第一）
  choice: 直接引用として表す
  rationale: 引用導入のὅτιは、日本語では「と」を重ねず、かぎ括弧による直接引用で自然に表現できる。
- source_word: Ἅγιοι
  choice: 聖なる者
  rationale: 神への帰属と倫理的な聖さの双方を含む文脈に適し、「取り分けられた者」より意味を狭めない。
- source_word: ἔσεσθε
  choice: となりなさい
  rationale: 形態上は未来形だが、七十人訳の律法的・勧告的な引用における命令の力を自然な日本語で表しつつ、単純な状態命令「聖でありなさい」とはせず、未来形の含みもある程度残す。
- source_word: ὅτι（第二）
  choice: ～からである
  rationale: 神の聖さが勧めの根拠であるという因果関係を明確に示す。
- source_word: ἐγὼ
  choice: わたしが
  rationale: 明示された代名詞による神の自己言及を保持し、主語を省略しない。
- source_word: ἅγιος
  choice: 聖なる者
  rationale: 前半と同じ語で訳し、神の聖さと読者に求められる聖さとの対応を保つ。
theological_decisions:
- issue: 聖さを求める引用における未来形ἔσεσθεの力
  choice: 本文では「聖なる者となりなさい」とし、未来形に由来する含みを脚注で示す。
  alternative: 「あなたがたは聖なる者となる」／「聖なる者でありなさい」
  rationale: ギリシア語はレビ記の引用に従って未来形を用いるが、律法的・勧告的文脈では命令の力を持つ。本文は現代日本語でその勧告性を明確にし、予告とも読める形式上の余地は脚注で保存する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用部は神の発言として「わたし」を用い、因果関係を明示した。脚注記号[a]は対応箇所の直後に置いた。
