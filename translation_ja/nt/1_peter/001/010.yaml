  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: ja
  text: この救いについて、あなたがたに及ぶ恵みを預言した預言者たちは、熱心に探し求め、詳しく調べました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: この救いについて
  rationale: περί＋属格は話題を示し、関係代名詞ἧςは直前に述べられた救いを受ける。「どの救いについて」よりも、前文との照応が明確で自然な日本語とした。
- source_word: ἐξεζήτησαν καὶ ἐξηραύνησαν
  choice: 熱心に探り求め、詳しく調べました
  rationale: 二つの動詞による強調を保ちつつ、ἐκζητέωの熱心な探求とἐξεραυνάωの綿密な調査を、日本語で意味の異なる二表現として訳し分けた。
- source_word: προφῆται οἱ … προφητεύσαντες
  choice: …を預言した預言者たちは
  rationale: 冠詞付き分詞句が預言者を限定している構造を、自然な連体修飾で表した。
- source_word: περὶ τῆς εἰς ὑμᾶς χάριτος
  choice: あなたがたに向けられた恵み
  rationale: περίは預言の内容を示し、εἰς ὑμᾶςの方向性を「に向けられた」で表した。χάριςは救済史的文脈で神の恵みを指すため「恵み」とした。
theological_decisions:
- issue: 「あなたがたへの恵み」に未来の意味を明示するか
  choice: 本文では未来を示す語を補わず、「あなたがたに向けられた恵み」とする
  alternative: あなたがたに与えられることになっていた恵み
  rationale: 預言という文脈から未来志向は推測できるが、この節のギリシア語自体には未来を明示する動詞や分詞がない。本文では原文の曖昧さを保ち、文脈から可能な未来的理解を脚注に示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文にふさわしい落ち着いた文体とした。「探り求め、詳しく調べました」により、原文の二動詞が表す入念な探求を自然に伝えている。
