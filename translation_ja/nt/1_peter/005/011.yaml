  text: ⸀αὐτῷ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/011.yaml
  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: ja
  text: 支配の力が、世々限りなく神にありますように[a]。アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「世々の世に至るまで」。終わりのない永遠を強調する慣用表現。
    reason: 原文の強調された時を表す慣用句を示すため。
lexical_decisions:
- source_word: αὐτῷ
  choice: 神に
  rationale: 三人称代名詞の与格で、直前の文脈にある神を指す。日本語では指示対象を明示したほうが自然であり、賛美の向かう先も明確になる。
- source_word: κράτος
  choice: 支配する力
  rationale: 単なる腕力ではなく、統治し支配する強い力を表す。現代日本語で意味が伝わるよう「支配する力」とした。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: いつまでも
  rationale: 直訳的には「代々の時代に至るまで」という強調表現で、終わりのない持続を意味する。本文では自然で明瞭な「いつまでも」とし、原文の表現は脚注に示した。
- source_word: ἀμήν
  choice: アーメン
  rationale: 礼拝的な結びの肯定を保つ、聖書翻訳で定着した音写を用いた。
theological_decisions:
- issue: 動詞のない頌栄句における述語の補足
  choice: 神にありますように
  alternative: 支配する力は神のものです
  rationale: ギリシア語には明示された動詞がない。「ありますように」は神に力が付与されるという意味ではなく、その永遠の支配力を賛美の中で認める願望・頌栄表現として訳した。断定形も可能だが、原文の礼拝的な調子をよりよく保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、短い頌栄句としての荘重さを保った。「支配する力」によって κράτος の統治的な含意を示し、「いつまでも」で通常の読者に自然な永続性を伝えた。
