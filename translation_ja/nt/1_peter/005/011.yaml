    issue: 「支配する力」 is awkward and only indirectly renders κράτος.
    rationale: κράτος in this doxology denotes ruling or sovereign power. 「支配の力」 is more natural Japanese and retains that sense.
  - severity: medium
    issue: The footnote's 「代々の時代に至るまで」 is an unclear rendering of εἰς τοὺς αἰῶνας τῶν αἰώνων.
    rationale: The Greek literally has an emphatic 'ages of ages' construction. 「世々の世に至るまで」 more transparently represents it, while the explanatory sentence clarifies its idiomatic force.
