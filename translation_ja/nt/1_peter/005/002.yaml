id: 1PE.5.2
reference: 1 Peter 5:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: ja
  text: あなたがたのもとにいる神の群れを、羊飼いとして世話をしなさい。強いられてではなく、自ら進んで、神に従って[a]見守りなさい。また、恥ずべき利得を求めてではなく、熱意をもって見守りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神が望まれるように」「神の御心にかなうように」。
    reason: κατὰ θεόνは簡潔で含意の広い表現であり、「神に従って」という本文訳だけでは神の意志・基準・神にかなう仕方という諸含意のいずれかに限定されうるため。
lexical_decisions:
- source_word: ποιμάνατε
  choice: 牧し
  rationale: 長老たちに神の群れを羊飼いとして世話するよう命じる牧会的比喩を保持しつつ、「牧師」という後代の職名に限定しないため。
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: あなたがたの間にいる神の群れ
  rationale: 群れが長老たちの所有物ではなく神に属することを明示し、ἐν ὑμῖν の場所的・関係的意味を「間にいる」で表した。
- source_word: ἐπισκοποῦντες
  choice: 監督しなさい
  rationale: 分詞は群れを牧する具体的なあり方を示す。「監督」は見守りと責任ある統率を表すが、特定教派の職制名としては用いていない。日本語として命令の流れを明確にするため定動詞化した。
- source_word: μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως
  choice: 強いられてではなく、…自ら進んで
  rationale: 外からの強制による奉仕と、自発的な奉仕との対照を自然な現代日本語で表した。
- source_word: κατὰ θεόν
  choice: 神に従って
  rationale: 直訳調の「神に従って」を保ち、神のみこころ、基準、望まれるあり方のいずれか一つに意味を狭めないようにした。
- source_word: μηδὲ αἰσχροκερδῶς
  choice: また、恥ずべき利益を求めてではなく
  rationale: 不正または卑しい利得を動機とすることへの否定を、倫理的な強さを保った明瞭な日本語で示した。
- source_word: ἀλλὰ προθύμως
  choice: 進んで行いなさい
  rationale: προθύμως の熱意と積極的な心構えを表し、先のἑκουσίωςと完全に同じ語にはせず、文脈上の行為を補って自然な日本語にした。
theological_decisions:
- issue: ἐπισκοποῦντεςを教会の技術的職名として訳すか
  choice: 職名ではなく活動を表す「監督しなさい」と訳した。
  alternative: 監督者として仕えなさい／司教として務めなさい
  rationale: 文脈では長老たちが担う働きを述べており、後代の固定的な教会職制を本文に持ち込まないため。
- issue: κατὰ θεόνをどこまで明示的に解釈するか
  choice: 「神に従って」とし、圧縮された表現を比較的そのまま保った。
  alternative: 神のみこころに従って／神が望まれるように
  rationale: 原文は神のみこころ、神の基準、神にふさわしい仕方を含み得るため、一つに限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。牧者の比喩と神の所有権を保持し、教派固有の職制用語を避けた。原文の分詞構文は、日本語で命令の関係が明確になるよう定動詞として表現した。
