reference: 1 Peter 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: ja
  text: 私は、私が忠実な兄弟と認めているシルワノを通して、あなたがたに短く[a]書きました。あなたがたを励まし、これが神のまことの恵みであることを証ししながら書いたのです。この恵みに堅く立ちなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「わずかな言葉で書きました」。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「この恵みにあなたがたは立っています」とある。
    reason: textual_variant
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: シルワノを通して
  rationale: 属格を伴うδιάの媒介・代理の意味を保ちつつ、シルワノが書記だったのか配達者だったのかは特定しない。
- source_word: τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι
  choice: 忠実な兄弟だと認めている
  rationale: πιστόςを「忠実な」、λογίζομαιを個人的評価を表す「認めている」とし、シルワノについての挿入的な推薦を自然な日本語にまとめた。
- source_word: δι’ ὀλίγων ἔγραψα
  choice: 短く書き送りました
  rationale: 「わずかな言葉によって書いた」という慣用表現を、書簡の結びにふさわしい自然な日本語で表した。ἐγραψαの書簡的アオリストも受取人の視点に合う表現とした。
- source_word: παρακαλῶν
  choice: 励まし
  rationale: 文脈上、慰めだけでなく勧告を含むが、現代日本語で過度に硬くならない「励ます」を採用した。
- source_word: ἐπιμαρτυρῶν
  choice: 証しする
  rationale: 単なる主張ではなく、厳粛に確証する証言の力を保った。
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: これこそ神のまことの恵みである
  rationale: ταύτηνの指示範囲を限定せず、「これ」によって手紙の内容または読者が受けた恵みを指し得る余地を残した。「こそ」で証言の強調を自然に表した。
- source_word: εἰς ἣν στῆτε
  choice: この恵みに堅く立ちなさい
  rationale: στῆτεを命令形として訳し、比喩的な確固不動の意味を「堅く立つ」で表した。指示代名詞の先行詞である「恵み」を明示して日本語の流れを整えた。
theological_decisions:
- issue: 「これ」（ταύτην）が指す範囲
  choice: 「これ」と訳して、ペトロが書いた内容とそこで証言される恵みを広く指し得る形にした。
  alternative: 読者が現在経験している恵み、またはシルワノを通して伝えられた福音だけを指すと限定する。
  rationale: 執筆・勧告・証言という直前の文脈は手紙の内容を示唆するが、原文自体は指示対象を狭く限定していないため、その幅を保存した。
- issue: 末尾のστῆτεの法と本文異読
  choice: SBLGNT本文に従い、命令形「堅く立ちなさい」とした。
  alternative: 異読ἑστήκατεに従い、「あなたがたはその恵みに立っています」とする。
  rationale: 指定された批判本文の命令形を本文に採用し、直説法の異読は脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。シルワノの役割を過度に特定せず、ταύτηνの指示範囲と末尾の本文異読に関わる神学的・本文批評上の緊張を保持した。
