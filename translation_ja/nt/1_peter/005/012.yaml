revisions:
- from: 私は、忠実な兄弟だと認めているシルワノを通して、あなたがたを励まし、これこそ神のまことの恵みであると証しするために、短く書き送りました[a]。この恵みに堅く立ちなさい[b]。
  to: 私は、私が忠実な兄弟と認めているシルワノを通して、あなたがたに短く[a]書きました。あなたがたを励まし、これが神のまことの恵みであることを証ししながら書いたのです。この恵みに堅く立ちなさい[b]。
  rationale: シルワノへの個人的評価を「私が…認めている」と明示して自然な現代日本語に整えた。「短く書きました」として書簡的アオリストを過不足なく訳し、二つの分詞は「励まし、…証ししながら書いた」として目的に限定せず保持した。「これこそ」を「これが」に改め、指示対象の幅を保った。本文はSBLGNTの命令形στῆτεに従い、異読は脚注に保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:41:58Z'
