id: 1PE.5.5
reference: 1 Peter 5:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: ja
  text: 同じように、若い男性たちは[a]長老たちに服しなさい。また、皆、互いに対して謙遜を身にまといなさい[b]。なぜなら、「神は高ぶる者に敵対し、へりくだる者に恵みを与える」とあるように[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「若い人たち」。ギリシア語は男性複数形ですが、会衆の若い構成員をより広く指すと解することもできます。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「謙遜を身に締め着けなさい」。用いられている動詞は、衣服や前掛けを結び留めて身に着ける姿を思わせます。
    reason: lexical_alternative
  - marker: c
    text: 七十人訳ギリシア語聖書の箴言3:34からの引用または引喩。
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: 同じように
  rationale: 直前の長老たちへの勧めと、この節の若い者たちへの勧めを結ぶ談話標識として、自然で明瞭な表現を選んだ。
- source_word: νεώτεροι
  choice: 若い男性たち
  rationale: 男性複数形を明示し、πρεσβυτέροιςとの対照を保った。ただし、より一般的に会衆の若い構成員を指す可能性は脚注に示した。
- source_word: ὑποτάγητε
  choice: 従いなさい
  rationale: 共同体内で長老の指導に服するよう求める命令を、現代日本語で簡潔に表した。
- source_word: πρεσβυτέροις
  choice: 長老たち
  rationale: 直前の5:1–4で教会の長老が明示されているため、単なる年長者ではなく共同体の長老を指すと判断した。
- source_word: πάντες δὲ ἀλλήλοις
  choice: また、皆、互いに対して
  rationale: 対象が若い男性たちから共同体全体へ広がることと、謙遜の相互的な方向性を明確にした。
- source_word: ταπεινοφροσύνην
  choice: 謙遜
  rationale: 心の低さ、へりくだった姿勢を表す、明瞭で一般的な現代日本語を採用した。
- source_word: ἐγκομβώσασθε
  choice: 身にまといなさい
  rationale: 衣服や前掛けを締めて身に着ける比喩を保ちつつ、日本語として自然な表現にした。より具体的な『身に締め着ける』という含みは脚注で補った。
- source_word: ἀντιτάσσεται
  choice: 敵対し
  rationale: 神が高ぶる者に対して自らを置くという強い対抗の意味を、弱めず簡潔に表した。
- source_word: δίδωσιν χάριν
  choice: 恵みを与える
  rationale: χάριςの神学的含意を保つ標準的な訳語を用いた。
theological_decisions:
- issue: πρεσβυτέροιςの指示対象
  choice: 教会の長老たち
  alternative: 一般の年長者たち
  rationale: 直前の5:1–4が長老たちとその牧会的責任を扱っているため、ここでも同じ集団を指す可能性が最も高い。
- issue: νεώτεροιの性と範囲
  choice: 若い男性たち
  alternative: 若い人たち、または会衆の若い構成員たち
  rationale: ギリシア語の男性複数形を本文で可視化した。一方、共同体の若年層を広く指す解釈も可能なので脚注に残し、続くπάντεςが謙遜の命令を全員に広げる構造も保持した。
- issue: 箴言3:34との関係
  choice: 引用として鉤括弧に入れる
  alternative: 明示的な引用符を置かず、著者自身の文として続ける
  rationale: 文言は七十人訳箴言3:34への明瞭な引用・引喩であり、鉤括弧は現代の読者に根拠句の範囲を示す。ただし原文写本に現代的な引用符があるわけではない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、勧告には品位のある「〜なさい」を採用した。衣服の比喩、神の敵対という強い表現、若い男性と長老たちの対照を保ちつつ、不自然な逐語調は避けた。
