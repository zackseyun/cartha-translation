  source_fidelity: 本文は全体としてギリシア語の構文と意味をよく反映している。πρεσβυτέροιςを文脈に即して「長老たち」としたこと、πάντες以下を共同体全体への勧めとして訳したこと、ἐγκομβώσασθεの衣服の比喩を保ったことは適切である。ただし、ὑποτάγητεは単なる一般的な「従う」よりも、「服しなさい／従いなさい」のように自らを権威・秩序のもとに置く意味を含むため、「長老たちに服しなさい」とするのがより明確である。
  naturalness: 「若い男性たちよ」は呼びかけとして不自然ではないが、現代標準日本語では「若い男性たちは」のほうが文の流れが滑らかである。また、引用符の後に[c]を置くより、引用導入部の「とあるように」に脚注を付すほうが、引用・引喩の注としての係り先が明瞭になる。
  terminology: 「長老たち」「謙遜」「恵み」は文脈と日本語の聖書用語として適切である。「高ぶる者」「へりくだる者」も原文の対照を自然に表す。「敵対する」はἀντιτάσσεταιの強い意味を保っている。
