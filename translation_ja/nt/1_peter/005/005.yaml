revisions:
- from: 同じように、若い男性たち[a]よ、長老たちに従いなさい。また、皆、互いに対して謙遜を身にまといなさい[b]。なぜなら、「神は高ぶる者に敵対し、へりくだる者に恵みを与える」[c]からです。
  to: 同じように、若い男性たちは[a]長老たちに服しなさい。また、皆、互いに対して謙遜を身にまといなさい[b]。なぜなら、「神は高ぶる者に敵対し、へりくだる者に恵みを与える」とあるように[c]。
  rationale: 最小限の修正として、ὑποτάγητεの服従の意味を「服しなさい」で明確にした。また、原文のὅτιが導く聖書的根拠句を、日本語として自然な「とあるように」で示し、引用・引喩の脚注アンカーをその導入部に移した。性別を示すνεώτεροι、長老という文脈上の指示対象、相互的な謙遜、衣服を着ける比喩、神の恵みという主要語は維持した。
