id: 1PE.5.10
reference: 1 Peter 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: ja
  text: しかし、あらゆる恵みの神、すなわち、メシアにあってご自分の永遠の栄光へとあなたがたを召してくださった方は、あなたがたがしばらく苦しみを受けた後、ご自身であなたがたを回復させ[a]、堅く立たせ、強め、土台を据えて[b]くださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「回復させ」は、「整え」「完全なものとし」とも訳せる。この動詞には、損なわれたものを本来の状態に整える意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「土台を据え」は、「基礎づける」「堅い土台の上に据える」とも訳せる。原文では基礎を据える比喩が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: あらゆる恵みの
  rationale: 神が与える恵みの包括性を保ちつつ、現代日本語として自然に表現した。
- source_word: καλέσας
  choice: 召してくださった
  rationale: アオリスト分詞を過去の行為として訳し、神を主語とする文脈にふさわしく敬意を表す補助動詞を用いた。
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: ご自分の永遠の栄光へと
  rationale: εἰς の方向性を「へと」で保ち、栄光への召しを過度に解釈しない表現とした。
- source_word: ἐν Χριστῷ
  choice: メシアにあって
  rationale: Χριστόςを称号として「メシア」と訳し、ἐν の結合・領域を表す神学的含みを伝統的かつ簡潔な「にあって」で保持した。
- source_word: ὀλίγον παθόντας
  choice: しばらく苦しみを受けた後
  rationale: ὀλίγονを時間的に取り、苦しみが限られた期間であることと、後続する神の働きとの時間関係を自然に示した。
- source_word: αὐτός
  choice: ご自身で
  rationale: 神ご自身が行動するという強調を明示した。
- source_word: καταρτίσει
  choice: 回復させ
  rationale: 損なわれたものを適切な状態へ整える語義を文脈に即して表した。「完全なものとする」という意味もあり得るため脚注で示した。
- source_word: στηρίξει
  choice: 堅く立たせ
  rationale: 確立し、動揺しないようにする意味を、隣接する動詞との違いが分かる自然な日本語で表した。
- source_word: σθενώσει
  choice: 強め
  rationale: 力を与えて強くするという直接的な意味を簡潔に訳した。
- source_word: θεμελιώσει
  choice: 揺るがない土台の上に据え
  rationale: 基礎を置くという原語の比喩を保ちつつ、日本語で意味が明瞭になるよう補って表現した。
theological_decisions:
- issue: Χριστῷの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味が生きているため「メシア」とした。ただし日本語で定着した「キリスト」も可能である。
- issue: 苦しみと神の働きの時間的関係
  choice: しばらく苦しみを受けた後
  alternative: しばらく苦しみを受けるとき
  rationale: 分詞を後続する未来動詞に先立つものとして自然に訳したが、苦しみの神学的目的や仕組みまでは本文に加えなかった。
- issue: 四つの未来動詞の区別
  choice: 回復させ、堅く立たせ、強め、揺るがない土台の上に据え
  alternative: 完全なものとし、確立し、力づけ、基礎を据え
  rationale: 類義的な連続を一語にまとめず、それぞれの修復、安定、強化、基礎というニュアンスを可能な限り保持した。
translation_notes:
  register: 明瞭で現代的かつ礼節のある標準日本語を用いた。「メシアにあって」は神学的関係性を保つための簡潔な表現であり、四つの動詞は原文の畳みかける調子と意味の差を残した。
