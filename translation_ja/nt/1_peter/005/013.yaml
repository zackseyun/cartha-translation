id: 1PE.5.13
reference: 1 Peter 5:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς ἡ ἐν Βαβυλῶνι συνεκλεκτὴ καὶ Μᾶρκος ὁ υἱός μου.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: ja
  text: バビロン[a]にいる、あなたがたと共に選ばれた方[b]が、あなたがたにあいさつを送っています。私の子[c]マルコも同じようにあいさつを送っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「バビロン」は、初期キリスト教の用法ではローマを象徴的に指す呼び名である可能性があります。ただし、本文そのものには「バビロン」とあります。
    reason: cultural_note
  - marker: b
    text: ギリシア語では、名詞を伴わない女性単数形の表現です。「バビロンにいる、あなたがたと共に選ばれた教会」と理解することもできます。
    reason: alternative_reading
  - marker: c
    text: 「私の子」は、実の親子関係ではなく、信仰上の親子関係を表している可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: よろしくと伝えています
  rationale: 書簡の結びにおける挨拶を表す動詞として、現代日本語で自然な表現を用いた。「挨拶します」よりも、離れた場所から挨拶を送る文脈が明確になる。
- source_word: ἡ ... συνεκλεκτὴ
  choice: あなたがたとともに選ばれている者
  rationale: 原文は女性単数の冠詞と形容詞を用いるが、修飾される名詞は明記されていない。日本語本文では「教会」や特定の女性を補わず、「者」として指示対象の曖昧さを保った。
- source_word: ἐν Βαβυλῶνι
  choice: バビロンにいて
  rationale: 原文の地名をそのまま訳し、ローマという解釈を本文に持ち込まなかった。
- source_word: συνεκλεκτὴ
  choice: ともに選ばれている
  rationale: 他の信者たちと同じく選ばれているという共同性を、自然な日本語で表した。
- source_word: Μᾶρκος
  choice: マルコ
  rationale: 日本語聖書で一般的な固有名詞の表記を採用した。
- source_word: ὁ υἱός μου
  choice: 私の子
  rationale: 原文の親子を表す比喩的または実際的な関係を限定せずに保持する。「霊的な子」とは本文で補わない。
theological_decisions:
- issue: ἡ ... συνεκλεκτὴ の指示対象
  choice: 名詞を補わず「者」とし、指示対象を確定しない。
  alternative: 「バビロンにある教会」またはペトロの妻など特定の女性とする。
  rationale: ギリシア語は女性単数形だが、名詞そのものは省略されている。教会を指すとの理解は有力であるものの、本文でそれを確定せず、原文の曖昧さを脚注とともに保つ。
- issue: 「バビロン」の意味
  choice: 本文では「バビロン」を保持する。
  alternative: 象徴的な呼称と解して「ローマ」と訳す。
  rationale: 原文が明記する地名を優先し、歴史的・象徴的同定は脚注に委ねる。
- issue: マルコに対する「私の子」
  choice: 比喩か実子かを限定せず「私の子」とする。
  alternative: 「私の霊的な子」と解釈的に訳す。
  rationale: 霊的な親子関係を指す可能性は高いが、原文自体に「霊的な」という限定はないため、その含意を本文に加えない。
translation_notes:
  register: 明瞭で落ち着いた現代標準日本語とした。書簡末尾の挨拶として自然な「よろしくと伝えています」を用い、原文にない「教会」「ローマ」「霊的な」は本文に補わず脚注で示した。
