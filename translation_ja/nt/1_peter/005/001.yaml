id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: ja
  text: ですから、私は、私も長老の一人であり、メシア[a]の苦しみの証人であり、また、やがて現される[b]栄光にあずかる者として、あなたがたの中にいる長老たちに勧めます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。ギリシア語の称号Χριστόςは、どちらの語でも表すことができる。
    reason: lexical_alternative
  - marker: b
    text: 「現されようとしている」とも訳せる。将来に現されることへの期待を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: 長老たち
  rationale: ここでは単に年長の男性ではなく、共同体を担う指導者を指す。「長老」は後代の特定教派の職制を持ち込まず、教会的文脈を明確に伝える。
- source_word: οὖν
  choice: そこで
  rationale: 前段を受けた推論的・展開的なつながりを、現代日本語として自然に示す。
- source_word: ἐν ὑμῖν
  choice: あなたがたの中にいる
  rationale: 人々の間にいるという関係的な意味を明瞭に表す。
- source_word: παρακαλῶ
  choice: 勧めます
  rationale: 単なる依頼よりも重みのある牧会的な促しを表しつつ、現代の一般読者にも自然な語を選んだ。
- source_word: συμπρεσβύτερος
  choice: 同じ長老
  rationale: 話者が長老たちと同じ立場を共有しているという複合語の意味を、簡潔で自然な日本語にした。
- source_word: μάρτυς
  choice: 証人
  rationale: 実際に見た者と証言する者の双方を含み得る原語の幅を保ち、「殉教者」とは限定しない。
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: メシアの苦しみ
  rationale: 属格を、メシアが受けた苦しみとして自然に訳した。文脈上、Χριστόςの称号としての意味を保つ。
- source_word: κοινωνός
  choice: あずかる者
  rationale: 栄光を共有し、それに参与する意味を、宗教的文章として自然で理解しやすい日本語で表した。
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: やがて現される栄光
  rationale: 受動態と将来への期待を保ちつつ、日本語として過度に硬くならないようにした。μέλλωの切迫感を完全に単純未来へ解消しないため、注で直訳を示す。
theological_decisions:
- issue: Χριστοῦを称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςの「油注がれた者」という称号性がこの箇所でも生きているため「メシア」とした。伝統的な「キリスト」も可能であり、注に残した。
- issue: μελλούσης ἀποκαλύπτεσθαιの将来性と切迫感
  choice: やがて現される
  alternative: 現されようとしている
  rationale: 将来の啓示に対する期待を自然な日本語で示した。終末の時期を断定しない一方、原文にあるμέλλωのニュアンスは注で保持した。
- issue: μάρτυςの意味範囲
  choice: 証人
  alternative: 証言する者
  rationale: 著者が苦しみの目撃者であることを指す可能性と、それについて証言する者である可能性を、どちらか一方に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、使徒的勧告にふさわしい落ち着いた格調を保った。原文の長い同格構造は維持しつつ、日本語で関係が追いやすい語順に整えた。節末は次節の勧告内容へ続くが、この節単独でも不自然にならない形とした。
