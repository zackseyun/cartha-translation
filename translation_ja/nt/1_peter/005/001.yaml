  source_fidelity: 本文は原文の主要な構文と意味をよく伝えている。Πρεσβυτέρουςは共同体の指導者としての「長老たち」、συμπρεσβύτεροςは話者がその立場を共有すること、μάρτυςは「証人」、κοινωνόςは栄光への参与として適切に表現されている。οὖνは「そこで」でも文脈上理解できるが、「ですから」の方が推論的接続を明確に保つ。
  naturalness: 現行文は理解可能だが、「同じ長老として」は「同じ」という修飾の対象がやや曖昧である。「私も長老の一人で」とすることで、同労者・同じ職分に属するという意味が明瞭で自然になる。
