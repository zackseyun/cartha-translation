id: 1PE.5.4
reference: 1 Peter 5:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: ja
  text: そして、大牧者が現れるとき[a]、あなたがたは、しぼむことのない栄光の冠[b]を受けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「現されるとき」。または「姿を現すとき」。
    reason: 原文は受動形で顕現を表すが、日本語では「現れる」と訳すのが自然であるため。
  - marker: b
    text: 「冠」に当たるギリシア語は、特に王の冠という意味ではなく、勝者に栄誉の賞として授けられる花冠や葉冠を指すことがある。
    reason: 王権の冠と、勝利や栄誉を表す冠との語義上の違いを明確にするため。
lexical_decisions:
- source_word: φανερωθέντος
  choice: 現れるとき
  rationale: 属格独立構文のアオリスト受動分詞を時の表現として訳した。日本語では「現されるとき」より「現れるとき」が自然であり、終末における顕現の意味を明瞭に伝える。受動形そのものの含みは脚注に残した。
- source_word: ἀρχιποίμενος
  choice: 大牧者
  rationale: 群れを導く最高位の牧者を表す複合語。文脈上キリストを指す称号として、簡潔で格調があり、日本語の聖書用語としても理解しやすい「大牧者」とした。
- source_word: κομιεῖσθε
  choice: 受けます
  rationale: 未来中動態で、賞として与えられるものを受け取ることを表す。日本語では「受けます」が簡潔で自然であり、受領の意味を保つ。
- source_word: ἀμαράντινον
  choice: しぼむことのない
  rationale: 花や草冠が鮮やかさを失わず、しおれないことを表す形容詞。比喩を保ちつつ現代の読者に明瞭な表現とした。
- source_word: τῆς δόξης
  choice: 栄光の
  rationale: 属格をそのまま生かし、「栄光に満ちた」と説明的に限定せず、原文の凝縮された比喩と解釈の幅を保った。
- source_word: στέφανον
  choice: 冠
  rationale: 栄誉や勝利の賞として授けられる花冠・葉冠を指し得る語。「冠」は本文として自然で簡潔であり、王冠に限らない点を脚注で補った。
theological_decisions:
- issue: 「大牧者」の指示対象
  choice: 文脈上イエスを指す称号として「大牧者」と訳す
  alternative: 「最高の牧者」
  rationale: 直前の牧者の比喩と終末的な顕現の文脈からイエスを指すが、本文に固有名を補わず、原文の称号表現を保った。
- issue: 終末的顕現を表す受動表現
  choice: 現れるとき
  alternative: 現されるとき
  rationale: 原文は受動形だが、日本語の「現される」は不自然になりやすい。「現れる」は顕現の意味を自然に伝え、受動形に即した別訳は脚注に示すことで原文の含みも保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「大牧者」「栄光の冠」という簡潔で格調ある比喩を保持した。「しぼむことのない」は植物で作られた冠の像を生かし、一般読者にも直感的に理解できる表現とした。
