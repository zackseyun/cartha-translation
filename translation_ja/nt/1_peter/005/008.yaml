source:
  edition: SBLGNT
  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: ja
  text: 冷静さを保ち[a]、目を覚ましていなさい。あなたがたの敵である悪魔が、ほえたける獅子のように歩き回り[b]、だれかを食い尽くそうと捜しています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「しらふでいなさい」「自制していなさい」。ギリシア語は字義的には「酒に酔わずにいる」ことを表しますが、ここでは比喩的に、冷静さと自制を保つよう求めています。
    reason: lexical_alternative
  - marker: b
    text: 文脈に即して「うろつき回り」とも訳せます。ギリシア語は、より字義的には「歩き回る」という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: 冷静さを保ち
  rationale: 字義的には酒に酔っていないことを表し得るが、新約での用法は比喩的であり、ここでは霊的な脅威のもとで明晰さと自制を保つよう命じている。続く「目を覚まして」と意味を重ねすぎない表現とした。
- source_word: γρηγορήσατε
  choice: 目を覚ましていなさい
  rationale: 眠らずに警戒するという比喩を保ち、継続的な警戒を自然な現代日本語で表す。
- source_word: ἀντίδικος
  choice: 敵
  rationale: 法廷での相手方を指すこともある語だが、ここでは読者に敵対する者を広く指す。日本語では「敵」が簡潔で自然であり、法廷的意味に限定しない。
- source_word: διάβολος
  choice: 悪魔
  rationale: 語源的には「中傷する者」だが、ここではサタンを指す定着した呼称として用いられている。
- source_word: ὡς λέων ὠρυόμενος
  choice: ほえたける獅子のように
  rationale: 明示された直喩と、獲物を威嚇する力強い咆哮のイメージを保つ。「獅子」は聖書本文として品位を保ちつつ一般にも理解できる。
- source_word: περιπατεῖ
  choice: 歩き回り
  rationale: 基本義である「歩く、歩き回る」を透明に訳し、脅威の含意は獅子の比喩に担わせた。文脈的な「うろつく」は脚注に示す。
- source_word: ζητῶν
  choice: 捜しています
  rationale: 獲物を求め続ける行為を自然な日本語で表す。
- source_word: τινα
  choice: 者
  rationale: 不定の単数対象を表す。日本語では後続する「食い尽くす」の目的語として「食い尽くす者」が自然である。
- source_word: καταπιεῖν
  choice: 食い尽くす
  rationale: 字義は「のみ込む」だが、獅子の捕食比喩では「食い尽くす」が暴力的な破壊の力を自然に伝える。
theological_decisions:
- issue: διάβολοςを普通名詞「中傷する者」とするか、サタンを指す呼称とするか
  choice: 悪魔
  alternative: 中傷する者
  rationale: 定冠詞を伴うこの文脈では、信徒に敵対する人格的な悪の存在を指す定着した呼称と読むのが自然であり、本文以上の教派的説明は加えない。
- issue: περιπατεῖに獅子の捕食行動をどこまで織り込むか
  choice: 歩き回り
  alternative: うろつき
  rationale: ギリシア語動詞の通常の意味を本文に保ち、捕食者としての脅威は直喩そのものに語らせる。文脈に即した強意訳は脚注で示す。
- issue: καταπιεῖνの比喩的な結末をどこまで具体化するか
  choice: 食い尽くす
  alternative: のみ込む
  rationale: 滅ぼす、信仰から脱落させる等の具体的神学解釈には限定せず、原文の捕食比喩をそのまま保持する。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、警告の厳粛さを保った。「獅子」は「ライオン」より聖書本文としての品位があり、意味も広く通じると判断した。二つの命令は「冷静さ」と「警戒」の区別が伝わるよう訳し分けた。
