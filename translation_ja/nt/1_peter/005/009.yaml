id: 1PE.5.9
reference: 1 Peter 5:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: ja
  text: '信仰に堅く立って[a]、悪魔に抵抗しなさい。世界中のあなたがたの兄弟姉妹[c]も、同じ苦しみを受けている[b]ことを知っているからです。


    [a] 「信仰によって堅く立って」とも訳せる。


    [b] より直訳に近くは「同じ苦しみが成し遂げられている」または「全うされつつある」。


    [c] 「兄弟姉妹」は、男性だけでなく、信仰者の共同体全体を指す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰によって堅く立って」とも訳せる。
    reason: grammatical_ambiguity
  - marker: b
    text: より直訳に近くは「同じ苦しみが成し遂げられている」または「全うされつつある」。
    reason: lexical_alternative
  - marker: c
    text: 「兄弟姉妹」は、男性だけでなく、信仰者の共同体全体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ᾧ
  choice: 悪魔に
  rationale: 関係代名詞は直前の5章8節にある「悪魔」を指す。日本語では指示対象を明示するほうが自然である。
- source_word: ἀντίστητε
  choice: 抵抗しなさい
  rationale: 決然と立ち向かうことを命じるアオリスト命令形の力を、簡潔で自然な現代日本語で表した。
- source_word: στερεοὶ τῇ πίστει
  choice: 信仰に堅く立って
  rationale: στερεοὶの確固とした状態を「堅く立つ」で表し、τῇ πίστειが信仰への堅持とも信仰による抵抗とも取れる余地を脚注で残した。
- source_word: εἰδότες
  choice: 知っているからです
  rationale: 分詞が抵抗の根拠を示す文脈上の働きを、自然な理由表現として訳した。
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: 同じ苦しみ
  rationale: 属格を伴うギリシア語表現が示す、同種の苦しみという意味を、過度に説明的にせず簡潔に表した。
- source_word: τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι
  choice: 世界にいるあなたがたの兄弟姉妹
  rationale: 信仰者の共同体を指す集合的な家族語を、日本語で自然かつ包含的な教会用語にし、共同体全体を指すことを脚注で明示した。
- source_word: ἐπιτελεῖσθαι
  choice: 受けている
  rationale: 苦しみが世界の信仰者共同体において生じているという受動形の文脈的意味を自然に表した。完遂・成就の語感は脚注に保存した。
theological_decisions:
- issue: τῇ πίστει の意味
  choice: 信仰に堅く立って
  alternative: 信仰によって堅く立って
  rationale: 定冠詞と勧告の文脈はキリスト者の信仰への堅持を支持するが、信頼によって抵抗するという手段的理解も排除しないため、本文と脚注で両方の余地を保った。
- issue: ἐπιτελεῖσθαι の意味
  choice: 苦しみを受けている
  alternative: 苦しみが成し遂げられている／完遂されつつある
  rationale: 日本語本文の明瞭さを優先しつつ、この動詞に含まれ得る完遂・成就のニュアンスを脚注に残し、苦しみの神学的目的を断定しなかった。
- issue: ἀδελφότητι の指示範囲
  choice: 兄弟姉妹
  alternative: 信仰者の共同体
  rationale: 男性だけでなく信仰者共同体全体を指す集合名詞であるため、日本語で定着した包含的な家族表現を用いた。
translation_notes:
  register: 明瞭で現代的ながら、命令と勧告にふさわしい端正な文体。「悪魔」は前節の先行詞を補って明示した。「兄弟姉妹」は一般読者にも理解しやすい共同体表現とし、語義上の範囲を脚注で補った。
