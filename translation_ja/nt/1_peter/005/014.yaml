  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: ja
  text: 愛の口づけをもって、互いにあいさつを交わしなさい。メシアにある[a]皆さんすべてに、平安がありますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「キリストにある」とも訳される。
    reason: Χριστόςの称号としての訳「メシア」に対し、日本語で定着した音写「キリスト」を示すため。
lexical_decisions:
- source_word: ἀσπάσασθε ἀλλήλους
  choice: 互いにあいさつを交わしなさい
  rationale: 相互的な行為を命じるアオリスト中動態命令を、共同体内で互いにあいさつするという自然な現代日本語で表した。
- source_word: ἐν φιλήματι ἀγάπης
  choice: 愛の口づけをもって
  rationale: ἐνの手段・様態を「をもって」で表し、φίλημαを「口づけ」、属格ἀγάπηςを「愛の」として語句の構造を保った。
- source_word: εἰρήνη ὑμῖν πᾶσιν
  choice: 皆さんに、平安がありますように
  rationale: 動詞を欠く簡潔な祝福句であるが、日本語では祈願の力を自然に伝えるため「ありますように」を補った。πᾶσινの包括性は「皆さん」で示した。
- source_word: τοῖς ἐν Χριστῷ
  choice: メシアにある皆さん
  rationale: 冠詞付き前置詞句の実質名詞的用法を「皆さん」で明示し、ἐν Χριστῷという結合・帰属を表す定型的な表現を「メシアにある」とした。Χριστόςはここで称号として理解できるため、意味を意識させる「メシア」を本文に採った。
theological_decisions:
- issue: ἐν ΧριστῷにおけるΧριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: Χριστόςは「油注がれた者」という称号であり、この祝福句でもその方との結合・帰属を示す。「メシア」を本文に置き、日本語のキリスト教伝統で定着した「キリスト」は脚注に残して、意味と慣用の双方を示した。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、書簡末尾の勧告と祝福にふさわしい品位を保った。「口づけ」は現代の日常語としてはやや文語的だが、原文の具体的な行為を弱めずに伝えるため採用した。
