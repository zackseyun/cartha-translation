  text: πᾶσαν τὴν μέριμναν ὑμῶν ἐπιρίψαντες ἐπ’ αὐτόν, ὅτι αὐτῷ μέλει περὶ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/007.yaml
  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: ja
  text: あなたがたの思い煩い[a]をすべて、その方[c]に委ねなさい[b]。その方があなたがたのことを心にかけておられるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「思い煩い」は「心配」「気がかり」とも訳せる。ここでは不安を伴う心配を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その方の上に投げかけて」。原文ではこの語は分詞で、6節の「へりくだりなさい」に結びついている。
    reason: lexical_and_syntactic_alternative
  - marker: c
    text: 「その方」は、直前の6節の文脈では神を指す。
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: あなたがたの思い煩いをすべて
  rationale: πᾶσαν の包括的な力と、μέριμνα がこの文脈で表す不安を伴う心配を、自然な現代日本語で示す。「あなたがた」は複数形を保つ。
- source_word: ἐπιρίψαντες ἐπ’ αὐτόν
  choice: その方に委ねなさい
  rationale: 字義的には「その方の上に投げかけて」だが、重荷を移す比喩を日本語で自然に伝えるため「委ねる」とした。分詞は前節の命令に従属するが、単独節として明瞭に読めるよう命令形で表し、その統語関係は注記する。
- source_word: ὅτι
  choice: からです
  rationale: 勧めの理由を導く接続詞として、明確で自然な理由表現を用いた。
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: その方があなたがたを心にかけていてくださる
  rationale: μέλει の継続的で人格的な配慮を表す。「心にかける」は単なる関心以上の思いやりを自然に伝え、「くださる」は話者から受け手への恩恵的な配慮を丁寧に示す。
theological_decisions:
- issue: αὐτόν／αὐτῷの指示対象
  choice: 本文では「その方」とし、神を指すことを脚注で示す
  alternative: 本文で直接「神」とする
  rationale: 直前の5章6節にある「神」が最も自然な指示対象だが、ギリシア語本文自体は代名詞なので、その形を保ちつつ文脈上の指示対象を注記した。
- issue: ἐπιρίψαντες の命令との関係
  choice: 本文では独立した勧めとして「委ねなさい」とする
  alternative: 「委ねて」として5章6節の命令に直接つなぐ
  rationale: 原文の分詞は5章6節の「へりくだりなさい」に結びつき、へりくだるあり方を説明すると理解できる。節単独でも明瞭な日本語にするため命令形を採ったが、原文の統語的つながりを脚注で明示した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、牧会的で品位ある調子を保った。「その方」によって原文の代名詞を維持し、「委ねなさい」によって重荷を移す比喩を過度に口語化せず自然に表した。
