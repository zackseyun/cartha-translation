  text: Ταπεινώθητε οὖν ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ, ἵνα ὑμᾶς ὑψώσῃ ἐν καιρῷ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: ja
  text: ですから、神の力強い御手のもとで、自分を低くしなさい[a]。神が、ふさわしい時にあなたがたを高く上げてくださるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「低くされなさい……神が定められた時に、あなたがたを高く上げてくださるように」。ギリシア語の命令形は受動形ですが、ここでは一般に「自分を低くしなさい」という再帰的な意味に理解されます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: 自分を低くしなさい
  rationale: 形はアオリスト受動命令だが、この勧告の文脈では再帰的・中動的な意味に理解できる。自然な現代日本語で命令の力を保ちつつ、受動形の可能性は脚注に残した。
- source_word: οὖν
  choice: ですから
  rationale: 直前の、神が高ぶる者に敵対し、へりくだる者に恵みを与えるという言葉からの帰結を示す。
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ
  choice: 神の力強い御手のもとで
  rationale: 神の強大な働きと支配を表す旧約聖書的な比喩を保った。「御手」は神への敬意を示す自然な聖書語であり、「もとで」は服従の位置を表す。
- source_word: ἵνα ὑμᾶς ὑψώσῃ
  choice: そうすれば、神は……あなたがたを高くしてくださいます
  rationale: ἵναの目的・結果の含みを自然な日本語で表し、直前の「神」を主語として明示した。ὑψόωは、単なる物理的上昇ではなく、神が名誉や回復を与える意味を含むため「高くする」とした。
- source_word: ἐν καιρῷ
  choice: ふさわしい時に
  rationale: καιρόςが単なる時刻ではなく、適切な、定められた時を指すことを明瞭に表す。
theological_decisions:
- issue: Ταπεινώθητεの態と行為主体
  choice: 本文では再帰的に「自分を低くしなさい」と訳し、神の力強い御手への服従として示した。
  alternative: 「低くされなさい」または「へりくだらされなさい」
  rationale: 人が神の前で低い立場を取る責任と、受動形が示し得る神の働きとの緊張を、本文と脚注を合わせて保つ。後半では、高くする主体が神であることを明示した。
- issue: ἵναの目的・結果関係
  choice: 「そうすれば」と訳し、へりくだることと神が高くすることの関係を示した。
  alternative: 「神が……高くしてくださるためです」
  rationale: 目的と結果のどちらか一方に限定しすぎず、自然な勧告文として因果的なつながりを保つ。
translation_notes:
  register: 明瞭で品位ある現代標準語。「へりくだる」より意味が直接伝わる「自分を低くする」を採用し、「御手」で聖書的比喩と敬意を保った。
