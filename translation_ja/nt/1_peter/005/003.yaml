  text: μηδ’ ὡς κατακυριεύοντες τῶν κλήρων ἀλλὰ τύποι γινόμενοι τοῦ ποιμνίου·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/003.yaml
  text: not domineering over those allotted to your care[a], but becoming examples to the flock.
translation:
  language: ja
  text: あなたがたに委ねられた人々を高圧的に支配するのではなく[a]、むしろ群れの模範となりなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「割り当て分を高圧的に支配するのではなく」。ギリシア語の「割り当て分」は、おそらく各長老に世話を委ねられた神の群れの人々を指すが、担当の区分を指す可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: ～のではなく
  rationale: 前節から続く禁止された牧会のあり方を、自然な現代日本語で示す。
- source_word: κατακυριεύοντες
  choice: 威張る
  rationale: 正当な指導そのものではなく、権威をかさに着て支配することを指す。一般読者に明瞭で、否定的な語感も保つ。
- source_word: τῶν κλήρων
  choice: あなたがたに割り当てられた人々
  rationale: 直訳は「割り当てられた分々」。文脈上、各長老の世話に委ねられた神の群れの人々を指すと理解されるため、割り当ての語義を本文に残しつつ対象を明示する。
- source_word: ἀλλὰ
  choice: むしろ
  rationale: 禁じられる態度と求められる態度との強い対照を自然に表す。
- source_word: τύποι
  choice: 模範
  rationale: 見習うべき型・手本という意味を、簡潔で品位ある日本語で伝える。
- source_word: γινόμενοι
  choice: となりなさい
  rationale: 単に静的に「である」のではなく、実際の振る舞いにおいて模範となるよう求める動的な意味を保つ。
- source_word: τοῦ ποιμνίου
  choice: 群れ
  rationale: 信仰共同体を羊の群れにたとえる牧会的比喩をそのまま保持する。
theological_decisions:
- issue: κλήρωνと教会指導者との関係
  choice: 長老たちに世話が割り当てられた人々を指す
  alternative: 「割り当てられた分々」または長老たちの管轄区域
  rationale: 直前の文脈は神の群れを牧する長老たちへの勧めである。人々を長老の所有物とせず、託された務めであることを示しながら、κλῆροςの「割り当て」の像を保持する。
- issue: κατακυριεύοντεςの禁止範囲
  choice: 高圧的・横暴な権威行使を禁じる
  alternative: 長老によるあらゆる指導や統治を禁じる
  rationale: 動詞は権威を振りかざして支配する否定的な態度を表す。節は指導そのものではなく、横暴な指導を模範による指導と対比している。
translation_notes:
  register: 明瞭で現代的ながら、勧告としての品位を保った。「威張る」はκατακυριεύωの横暴な権威行使を一般読者に直接伝える表現。「群れ」は原文の牧会的比喩を維持した。
