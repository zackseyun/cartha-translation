  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: ja
  text: なぜなら、善を行うことによって愚かな人々の無知を黙らせることが、神の御心だからです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「黙らせる」と訳した語は、直訳では「口輪をはめる」。ここでは、敵対的な言葉を封じる意味で比喩的に用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: だからです
  rationale: 前の勧めの根拠を示す因果的な接続として訳した。
- source_word: οὕτως
  choice: （文全体の「…こと」に反映）
  rationale: 神の御心の内容・あり方を、後続する行為によって示す構文として自然な日本語に組み込んだ。
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: 神の御心
  rationale: 神の意志・望みを表す、明瞭で品位のある定着した表現を採用した。
- source_word: ἀγαθοποιοῦντας
  choice: 善を行うことによって
  rationale: 分詞の手段的な意味を明示し、φιμοῦνとの関係を自然に表した。
- source_word: φιμοῦν
  choice: 黙らせる
  rationale: 字義は「口輪をかける」だが、ここでは無知に基づく敵対的な言動を封じる比喩であるため、その比喩性を保てる表現とした。
- source_word: ἀγνωσίαν
  choice: 無知
  rationale: 知識や理解の欠如を直接表し、原文が言動そのものではなく「無知」を目的語としている点を保持した。
- source_word: ἀφρόνων ἀνθρώπων
  choice: 愚かな人々
  rationale: ἄφρωνの非難的意味を保ちつつ、ἄνθρωποιを男性だけに限定しない総称として訳した。
theological_decisions:
- issue: ἀνθρώπωνの性別を含む表現
  choice: 人々
  alternative: 男たち／人間たち
  rationale: 文法上は男性形だが、指示対象は男性に限られない一般的な反対者であるため。
- issue: 神の御心と善行の関係
  choice: 善を行うことによって無知を黙らせることが神の御心である
  alternative: 善行そのものだけを神の御心とする
  rationale: 不定詞φιμοῦνと手段を示す分詞ἀγαθοποιοῦνταςの関係を保ち、善行が無知を封じる手段であることを明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「神の御心」「善を行う」により聖書本文としての品位を保った。「無知を黙らせる」という原文の擬人的な比喩は、説明的に言い換えず本文に残した。
