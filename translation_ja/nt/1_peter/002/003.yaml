  text: if indeed you have tasted that the Lord is good[a][b].
translation:
  language: ja
  text: もし本当に、主が恵み深いことを味わったのなら[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主が恵み深いことを味わったのですから」とも訳せる。ギリシア語は条件形だが、その条件が満たされていることを前提としている場合がある。
    reason: alternative_reading
  - marker: b
    text: 「恵み深い」は、「良い」または「親切な」とも訳せる。この表現は詩篇34:8を響かせている。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: もし本当に……のなら
  rationale: ギリシア語の条件表現を保ちつつ、ここでは読者が実際に味わったことを前提としている可能性を「本当に」で示した。
- source_word: ἐγεύσασθε
  choice: 味わった
  rationale: 文字どおりの味覚の比喩を残した。直前の乳を求めるという養いのイメージ、および詩篇34:8への響きに適合するため、「経験した」と抽象化しなかった。
- source_word: ὅτι
  choice: ……ことを
  rationale: 味わった内容を導く接続詞として、日本語では名詞節「……ことを」で自然に表した。
- source_word: χρηστὸς
  choice: 良い方
  rationale: 善良さ、親切さ、恵み深さを含み得る広い語義を保つため「良い」とした。「方」を補い、主について述べる日本語として整えた。
- source_word: κύριος
  choice: 主
  rationale: 文脈上イエスを指す可能性が高い一方、詩篇34:8の主への言及も響いているため、「キリスト」などの説明を本文に加えず「主」とした。
theological_decisions:
- issue: 条件節 εἰ の効力
  choice: 「もし本当に……味わったのなら」と条件形を維持する
  alternative: 「……味わったのですから」
  rationale: 読者の経験を事実として想定する修辞的条件である可能性は高いが、原文の条件形式を断定表現に置き換えず、その緊張を保った。
- issue: 「主」の指示対象
  choice: 本文では単に「主」とする
  alternative: 「主キリスト」
  rationale: 第一ペトロ2章の文脈ではイエスとの結びつきが強いが、詩篇34:8への響きも保つため、指示対象を本文で明示的に限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、「味わう」という聖書的な比喩と「主」という荘重な称号を保持した。節単独では条件節の形だが、前節から続く構文を反映している。
