id: 1PE.2.10
reference: 1 Peter 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: ja
  text: かつて民でなかったあなたがたは、今は神の民です[a]。かつて憐れみを受けていなかったあなたがたは、今は憐れみを受けた者です[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ペテロはホセア書1章9―10節、2章23節を踏まえ、イスラエルの回復を語る言葉を、読者が今や神の民とされていることに当てはめています。
    reason: cross_reference
  - marker: b
    text: 別訳「憐れみを示されていなかったあなたがたは、今は憐れみを示された者です」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: あなたがたが
  rationale: 前節で呼びかけられている読者を受ける複数関係代名詞。日本語では主題を明示し、二つの対句を自然につなぐため「あなたがたが」とした。
- source_word: ποτε / νῦν
  choice: かつては／今は
  rationale: 以前の状態と現在の状態との鮮明な対照を、現代日本語で簡潔に表す。
- source_word: οὐ λαὸς
  choice: 民ではなかった
  rationale: 原文は「神の民ではなかった」とまでは明示せず、単に「民ではなかった」とする。ホセアへの反響と原文の非対称性を保った。
- source_word: λαὸς θεοῦ
  choice: 神の民
  rationale: 属格 θεοῦ を自然な所属表現とし、契約共同体としての意味合いを保つ。
- source_word: οὐκ ἠλεημένοι / ἐλεηθέντες
  choice: 憐れみを受けていなかった／憐れみを受けています
  rationale: 受動態を、神の憐れみの受け手となったことを示す自然な日本語で表現した。前半の完了的な状態と、現在に及ぶ後半の結果を対照させる。
- source_word: δὲ
  choice: （対照構文「かつては…今は…」）
  rationale: 日本語では「しかし」を反復せず、「かつては／今は」の対応によって二度の対照を明瞭にした。
theological_decisions:
- issue: ホセアへの暗示と神の民としての共同体的身分
  choice: 第一句を「民ではなかった」、第二句を「神の民」と訳し、原文の非対称性を保つ。
  alternative: 両方を「神の民ではなかった／神の民」と補って対称的に訳す。
  rationale: ギリシア語の第一句には θεοῦ がないため、それを補わず、同時にホセア由来の契約的回復の響きを脚注で示す。特定の民族的・教派的解釈には限定しない。
- issue: 憐れみの行為者
  choice: 本文では「憐れみを受ける」と訳し、行為者を明示しない。
  alternative: 「神に憐れんでいただく」と行為者を補う。
  rationale: 文脈上、憐れみの源は神と理解されるが、この節の受動表現自体は行為者を明記しないため、本文では補足しない。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書本文にふさわしい品位を保った。「民」は共同体的・契約的な響きを保つため採用し、「人々」や「国民」は避けた。二つの逆転を並行構文で示した。
