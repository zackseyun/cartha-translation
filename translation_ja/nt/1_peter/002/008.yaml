revisions:
- from: また、「つまずきの石、妨げとなる岩」である。彼らはみことばに従わないため、つまずく。そして、そのことへと彼らは定められてもいた。
  to: また、「つまずきの石、つまずかせる岩」である。彼らはみことばに従わないため、つまずく。そして、彼らはそのためにも定められていた。
  rationale: 引用句のσκάνδαλονを「つまずかせる」と訳し、原文のつまずきの比喩と並行関係を明確にした。εἰς ὃは「そのため」として、つまずき・不従順・その事態全体のいずれを先行内容と見るかを本文で決めずに保った。ἐτέθησανの受動態についても行為者を明示していない。
