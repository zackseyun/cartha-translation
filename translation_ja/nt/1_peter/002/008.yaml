  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: ja
  text: また、「つまずきの石、つまずかせる岩」である。彼らはみことばに従わないため、つまずく。そして、彼らはそのためにも定められていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: つまずきの石
  rationale: イザヤ書8章14節を踏まえた比喩を保ち、πρόσκομμαの『つまずかせるもの』という意味を簡潔に表した。
- source_word: πέτρα σκανδάλου
  choice: 妨げとなる岩
  rationale: σκάνδαλονは罠、つまずき、罪への誘因などの幅を持つ。直前との不自然な重複を避けつつ、人をつまずかせる障害という意味を表した。
- source_word: τῷ λόγῳ
  choice: みことばに
  rationale: 文脈上、宣べ伝えられた神のことばを指すため、聖書的でありながら現代日本語でも通用する『みことば』とした。
- source_word: ἀπειθοῦντες
  choice: 従わないため
  rationale: 語には『信じない』と『従わない』の両面がある。与格τῷ λόγῳとの結びつきを自然に示し、応答を拒む含意を保つため『従わない』とした。
- source_word: ἐτέθησαν
  choice: 定められてもいた
  rationale: τίθημιの受動形が持つ『置かれた／定められた』という意味を、この文脈に即して表現した。行為者は本文に明示されないため補わなかった。
theological_decisions:
- issue: εἰς ὃ（『そのことへ』）が何を指すか
  choice: 『そのことへと』として指示内容の曖昧さを保つ
  alternative: 『不従順になるように』または『つまずくように』と明示する
  rationale: 関係代名詞ὃの先行内容は、直前の『つまずく』、不従順を伴う事態全体、あるいはその帰結を指し得る。特定の予定論的解釈に限定せず、原文の緊張を残した。
- issue: 神的受動態の行為者
  choice: 『定められてもいた』とし、誰が定めたかを本文で補わない
  alternative: 『神によって定められていた』
  rationale: 神が暗黙の行為者である可能性は高いが、原文には明示されていないため、翻訳本文では補足しない。
translation_notes:
  register: 引用句は簡潔で格調ある表現とし、後半は現代の読者が構文を追いやすいよう二文に分けた。『みことば』以外は過度に教会的な専門語を避け、予定と人間の不従順をめぐる本文固有の緊張を解消しない訳とした。
