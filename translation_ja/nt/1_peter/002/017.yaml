id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: ja
  text: すべての人を敬い、兄弟姉妹の共同体[a]を愛し、神を恐れ、王[b]を敬いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹の共同体」は、同じ信仰を持つ人々の共同体を指す。
    reason: lexical_clarification
  - marker: b
    text: 直訳は「王」。当時のローマ支配下という文脈では、皇帝を指すと考えられる。
    reason: historical_context
lexical_decisions:
- source_word: πάντας
  choice: すべての人
  rationale: 実質的に名詞として用いられた複数形で、例外なく人々全体を指すため、自然で明確な「すべての人」とした。
- source_word: τιμήσατε / τιμᾶτε
  choice: 敬う
  rationale: 節の初めと終わりに反復される同じ動詞の対応を保ち、「尊重する」よりも敬意を表す意味を明確にした。ギリシア語では二つの命令の時制・相が異なるが、この簡潔な命令の連続では、日本語で不自然に区別しない。
- source_word: ἀδελφότητα
  choice: 兄弟姉妹の共同体
  rationale: 信者同士の家族的な結びつきと、その集団全体を指す語である。「兄弟」だけに限定して聞こえることを避けつつ、血縁ではなく信仰共同体を表した。
- source_word: ἀγαπᾶτε
  choice: 愛する
  rationale: 継続的な態度を求める現在命令の意味を、日本語の自然な命令表現「愛し」で表した。
- source_word: θεὸν
  choice: 神
  rationale: φοβεῖσθεの直接目的語であり、標準的に「神」と訳した。
- source_word: φοβεῖσθε
  choice: 恐れる
  rationale: 語の強さを弱めず、「王を敬う」との違いを保つため「恐れる」とした。文脈上、単なる恐怖だけでなく神への畏敬を含みうる。
- source_word: βασιλέα
  choice: 王
  rationale: 語そのものの基本義を本文に残した。ペトロのローマ支配下という歴史的文脈では皇帝を指す可能性が高いため、その点は脚注で示した。
theological_decisions:
- issue: 神に対する応答と地上の支配者に対する応答の区別
  choice: 神は「恐れ」、王は「敬う」と訳し、異なる動詞を明確に保つ。
  alternative: 神を「畏敬し」、王を「尊重する」と訳す。
  rationale: 原文は、すべての人への敬意、信仰共同体への愛、神への恐れ、王への敬意を区別している。神にだけ用いられた強い語を弱めず、同時にこの一節から特定の政治神学を読み込まないようにした。
translation_notes:
  register: 簡潔な四つの命令が並ぶ原文の修辞を、一つの流れのよい現代日本語文として再現した。「敬う」を冒頭と末尾で反復し、原文の枠構造を保った。神への動詞には直接的な「恐れる」を用い、普通の読者にも理解できる格調ある標準語とした。
