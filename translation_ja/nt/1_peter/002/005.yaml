source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: ja
  text: あなたがた自身もまた、生きた石として、霊の家として築き上げられ、聖なる祭司の集団となって、イエス・メシアを通して神に受け入れられる霊のいけにえを献げるのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: あなたがた自身もまた
  rationale: 複数の読者への直接的な呼びかけと、αὐτοίの強調、καίの付加的な意味を保つ。
- source_word: ὡς λίθοι ζῶντες
  choice: 生きた石として
  rationale: 直前の「生きた石」とのつながりを保ちつつ、比喩を自然な現代日本語で表す。
- source_word: οἰκοδομεῖσθε
  choice: 築き上げられ
  rationale: 現在受動形を反映し、建てる主体を本文にない形で明示しない。日本語では継続的な形成の含みも持つ。
- source_word: οἶκος πνευματικὸς
  choice: 霊の家
  rationale: πνευματικόςを単に非物質的という意味に狭めず、神の霊にかかわる家という含みを簡潔に保つ。
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: 聖なる祭司団となります
  rationale: εἰςの目標・結果の意味を「となる」で自然に表し、ἱεράτευμαを個々の祭司ではなく共同体として示す。
- source_word: ἀνενέγκαι
  choice: 献げる
  rationale: 犠牲を神に献げる祭儀的文脈に合う日本語を用いる。
- source_word: πνευματικὰς θυσίας
  choice: 霊のいけにえ
  rationale: 祭儀的比喩を保持し、その具体的内容を本文以上に限定しない。
- source_word: εὐπροσδέκτους θεῷ
  choice: 神に受け入れられる
  rationale: 犠牲が神に受納されるという文脈を明瞭に表す。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: イエス・メシアを通して
  rationale: διά＋属格の媒介を保ち、Χριστόςをここでは称号として訳す。
theological_decisions:
- issue: οἰκοδομεῖσθεの態と行為主体
  choice: 受動態で訳し、行為主体を明示しない
  alternative: 「自分たちを築き上げなさい」
  rationale: 形態と文脈は受動の理解を支持するが、本文が明示しない主体を「神」と補わず、神学的含みを保持する。
- issue: οἶκος πνευματικὸςとεἰς ἱεράτευμα ἅγιονの統語関係
  choice: 「霊の家に築き上げられ、聖なる祭司団となります」
  alternative: 「聖なる祭司団となるための霊の家に築き上げられます」
  rationale: 家と祭司団という二つの共同体的比喩を自然に並べつつ、εἰςの目標・結果の幅を脚注で示す。
- issue: Χριστοῦの訳語
  choice: メシア
  alternative: キリスト
  rationale: この句ではイエスに付された称号としての機能が明瞭なため、称号の意味を訳出する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「祭司団」はἱεράτευμαの集合的意味を示す。「いけにえ」は祭儀的比喩として一般読者にも理解しやすい表記を採用した。
