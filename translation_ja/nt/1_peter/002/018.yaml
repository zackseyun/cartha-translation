source:
  edition: SBLGNT
  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: ja
  text: 家に仕える奴隷たち[a]は、十分な敬意をもって[b]主人たちに従いなさい。善良で寛大な主人だけでなく、ねじ曲がった主人にも従いなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家の使用人たち」とも訳せる。ギリシア語は、特に家に属して仕える奴隷または隷属的な使用人を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「すべての畏れのうちに」。ここでは敬意を含む畏れを表し得る。畏れの対象は原文では明示されていない。
    reason: lexical_ambiguity
  - marker: c
    text: 「理不尽な」「不正な」「厳しい」とも訳せる。ギリシア語の字義は「曲がった、ねじれた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: 家に仕える奴隷たち
  rationale: 一般的な僕ではなく、家に属して働く隷属身分の者を指す。現代日本語で家庭内という範囲と奴隷身分の現実をともに明示した。
- source_word: ὑποτασσόμενοι
  choice: 従いなさい
  rationale: 分詞だが、文脈上は勧告を表す命令的用法であるため、自然な現代日本語の命令形とした。
- source_word: ἐν παντὶ φόβῳ
  choice: 深い畏れをもって
  rationale: 直訳的な「すべての畏れをもって」を自然な日本語にしつつ、φόβοςが持つ恐れと敬意・畏敬の幅を「畏れ」に残した。畏れの対象は原文で明示されないため、本文でも限定しなかった。
- source_word: δεσπόταις
  choice: 主人たち
  rationale: 家に仕える奴隷に権限を持つ主人を指す。「所有者」より自然で、「主」として神を指す表現との混同も避けられる。
- source_word: ἀγαθοῖς
  choice: 善良で
  rationale: 人物の道徳的な良さを表す基本的意味を保持した。
- source_word: ἐπιεικέσιν
  choice: 寛大な
  rationale: 穏やかさ、公平さ、寛容さを含む語であり、主人の人道的で思いやりある態度を自然に表す。
- source_word: σκολιοῖς
  choice: ねじ曲がった
  rationale: 「曲がった、ねじれた」という比喩を保ち、単に厳しいだけでなく、不正・不当・偏屈である意味の広がりを残した。
theological_decisions:
- issue: οἰκέταιの社会的身分を弱めず、同時に家庭内という範囲を示す方法
  choice: 「家に仕える奴隷たち」
  alternative: 「家の使用人たち」「家内奴隷たち」
  rationale: 「使用人」では隷属身分を弱めるおそれがあり、「家内奴隷」は学術的で一般読者には硬い。採用訳は歴史的現実と具体的な生活領域を明確にする。
- issue: φόβοςを恐怖、敬意、畏敬のどれとして表すか
  choice: 「深い畏れ」
  alternative: 「十分な敬意」「あらゆる恐れ」
  rationale: 文脈上は敬意を伴う従順を表すが、原語には恐れの意味もあり、その対象も明記されていない。「畏れ」はこの緊張と曖昧さを保ち、単なる恐怖とも礼儀上の敬意だけとも限定しない。
- issue: σκολιόςの比喩を保持するか、文脈的意味に置き換えるか
  choice: 「ねじ曲がった」
  alternative: 「理不尽な」「厳しい」「不正な」
  rationale: 比喩を保持することで、不正、偏屈、過酷さを含み得る原語の意味を一つに狭めない。脚注で文脈上の意味を補った。
translation_notes:
  register: 明快な現代標準語を用いながら、奴隷制という歴史的背景を婉曲化しなかった。「畏れ」と「ねじ曲がった」には原文の意味の幅と比喩を残し、脚注で補足した。「主人たち」は原文の複数形を反映するが、日本語として読みやすい語順に整えた。
