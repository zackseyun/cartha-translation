source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: ja
  text: 自由な者として、自由を悪の覆いとして用いるのではなく、神の奴隷[a]として生きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神のしもべとして」とも訳せる。ここでは、「自由な者」との強い対照を保つため「奴隷」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: 自由な者
  rationale: 社会的・身分的な自由という語感を保ちつつ、性別を限定せず、現代日本語として自然にした。
- source_word: ἐπικάλυμμα
  choice: 覆い隠すもの
  rationale: 本来の「覆い」という比喩と、悪を隠すために自由を利用するという文脈上の機能をともに伝える。
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: その自由を…として用いる
  rationale: 直訳的には「自由を…として持つ」だが、手段として利用する意味を自然な日本語で表した。
- source_word: κακίας
  choice: 悪
  rationale: 「悪意」に狭めず、広く道徳的な悪を指し得る語義を保持した。
- source_word: θεοῦ δοῦλοι
  choice: 神の奴隷
  rationale: 自由な者でありながら神に全面的に属するという強い逆説を保つため、δοῦλοιを弱めずに訳した。
theological_decisions:
- issue: キリスト者の身分を表す δοῦλοι の訳語
  choice: 神の奴隷
  alternative: 神のしもべ
  rationale: 本文は「自由な者」と「神に属する奴隷」を意図的に対置している。「しもべ」は自然で伝統的だが、所有と拘束を伴う原語の強さを弱めるため、本文では「奴隷」とした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「生きなさい」は文脈から補った述語で、ギリシア語の省略的な分詞句を日本語の命令文として完結させる。脚注標識は、この補足ではなく「奴隷」の訳語説明に対応するため文末に置いた。
