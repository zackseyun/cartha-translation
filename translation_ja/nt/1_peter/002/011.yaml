  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: ja
  text: 愛する皆さん。私は、寄留者、また一時滞在者であるあなたがたに、肉の欲望[b]を避けるよう勧めます。それらは魂[c]に対して戦いを挑んでいます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留者、また一時滞在者」は、「在留外国人、またよそから来た滞在者」とも訳せる。この二つの語は、あなたがたが今の時代や社会に完全には属していないことを強調する。
    reason: lexical_alternative
  - marker: b
    text: 「肉の欲望」は、「肉的な欲望」または、より解釈を加えて「罪深い欲望」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「魂」は、「命」または「自己」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 愛する者たちよ
  rationale: 呼格複数の温かな呼びかけを、現代日本語として明瞭かつ dignified に表し、ἀγαπάω／ἀγάπηとの語彙的なつながりも保つ。
- source_word: παρακαλῶ
  choice: 私は……勧めます
  rationale: ここでは慰めではなく、切実な勧告を表す。過度に硬い「勧告する」より自然でありながら、単なる依頼より強い。
- source_word: ὡς παροίκους καὶ παρεπιδήμους
  choice: 寄留者また旅人であるあなたがたに
  rationale: ὡςを身分・立場を示す表現として訳し、二語を区別しつつ、現住地に完全には属さないという組み合わせの力を保つ。日本語では勧告対象として自然になるよう「あなたがたに」を補った。
- source_word: ἀπέχεσθαι
  choice: 避けなさい
  rationale: 自らを継続的に遠ざけるよう求める意味を、明瞭で自然な命令表現にした。「慎みなさい」より対象から離れる含意が明確。
- source_word: τῶν σαρκικῶν ἐπιθυμιῶν
  choice: 肉の欲望
  rationale: σάρξ系の比喩を保持し、「罪深い欲望」と解釈的に限定しすぎない。「肉的な欲望」より自然な現代日本語。
- source_word: αἵτινες στρατεύονται κατὰ τῆς ψυχῆς
  choice: 魂に戦いを挑む
  rationale: 軍事的比喩と敵対の力を保つ。「戦いを挑む」は、継続して敵対する動きを自然な日本語で表す。
- source_word: ψυχῆς
  choice: 魂
  rationale: 「命」「自己」に限定せず、原語の人間論的な重みと曖昧さを比較的よく保つ。
theological_decisions:
- issue: σαρκικῶν の道徳的文脈での訳
  choice: 肉の
  alternative: 罪深い／肉的な
  rationale: 欲望が有害であることは後続句から明らかだが、本文ではσάρξの比喩を残し、特定の「罪の性質」理解を訳文に持ち込まない。
- issue: ψυχή の意味範囲
  choice: 魂
  alternative: 命／自己
  rationale: 人の内的生命また全人格を指し得る緊張を残すため、伝統的で広がりのある「魂」を本文に置き、別訳を注記する。
- issue: παροίκους καὶ παρεπιδήμους の身分の含意
  choice: 寄留者また旅人
  alternative: 在留外国人また一時滞在者
  rationale: 社会的な非定住・非所属の意味と、この書簡における神学的響きの双方を保ちつつ、現代の法的身分だけに狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、書簡の温かく厳粛な勧告調を保った。「愛する者たちよ」「寄留者」「魂」はやや格調ある語だが、聖書本文として一般読者に理解可能な範囲にある。注記の標識[a][b]は該当文末に置いた。
