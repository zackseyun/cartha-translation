  text: εἴτε ἡγεμόσιν ὡς δι’ αὐτοῦ πεμπομένοις εἰς ἐκδίκησιν κακοποιῶν ἔπαινον δὲ ἀγαθοποιῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: ja
  text: また、悪を行う者を処罰し、善を行う者を称賛するために、王[a]を通して遣わされた総督たちにも従いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼を通して」。前節の王（皇帝）を指すと理解するのが最も自然である。一方で、神が定める権威の秩序を指すと理解する人もいる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: また
  rationale: 前節の「王」に続く選択肢を示す語。日本語では文脈上「また」が自然で、従属の命令を補って続けられる。
- source_word: ἡγεμόσιν
  choice: 総督たち
  rationale: ローマの統治下で王・皇帝から権限を委ねられた地方統治者を指す文脈に合う。特定の官職制度に過度に限定せず、公的な統治者を自然に表す。
- source_word: δι’ αὐτοῦ πεμπομένοις
  choice: 王によって遣わされた
  rationale: διά＋属格はここで媒介・代理を表し、直近の先行詞である前節の王を自然な指示対象とする。日本語では「王によって」が明瞭である一方、別解は脚注に残す。
- source_word: εἰς ἐκδίκησιν
  choice: 罰し
  rationale: 統治者の司法的機能を表す文脈なので、「復讐」よりも公的処罰を表す「罰する」が適切。
- source_word: κακοποιῶν
  choice: 悪を行う者
  rationale: 人を固定的に「悪人」と規定するより、原語の行為を表す語感を保つ。
- source_word: ἔπαινον
  choice: ほめる
  rationale: ἐκδίκησιν と並ぶ統治者の役割を、現代日本語で理解しやすい動詞表現にした。「称賛」より平明。
- source_word: ἀγαθοποιῶν
  choice: 善を行う者
  rationale: 原語の行為的意味を保ち、κακοποιῶν の訳と対照をなす。
theological_decisions:
- issue: δι’ αὐτοῦ の αὐτοῦ が誰を指すか
  choice: 前節の王（皇帝）を指すものとして本文では「王によって」とする
  alternative: 神を指し、統治者が神の摂理または秩序を通して遣わされるという理解
  rationale: 文法上もっとも近い先行詞は前節の「王」であり、地方統治者への権限委任という文脈にもよく合う。ただし神を指すとする理解もあるため、本文で神学的含意を決着させず脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く文であるため、単独でも意味が通るよう「従いなさい」を補った。「総督たち」は公的統治者を表しつつ、ローマの特定官職へ過度に限定しない。
