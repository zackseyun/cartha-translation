id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: ja
  text: この方は自ら、木の上で、その身に私たちの罪を負われました[a]。それは、私たちが罪に対して死に、義に生きるためです。あなたがたは、この方の傷[b]によって癒やされました[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「木の上で」は、十字架上を指す。原文は「木」であり、申命記21章23節の表現を響かせている可能性がある。別訳「十字架の上で」。
    reason: alternative_reading
  - marker: b
    text: 「傷」は単数形。別訳「打ち傷」または「あざ」。イザヤ書53章5節の表現を響かせている。
    reason: lexical_alternative
  - marker: c
    text: ここで癒やしは広く表現されている。文脈上、罪と義に深く結びついているが、本文はその意味を身体的癒やしだけ、または霊的癒やしだけに限定していない。
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: 負い
  rationale: 「運び上げる」「供え物として献げる」「負う」の意味領域を持つ。ここでは目的語が「私たちの罪」であり、イザヤ書53章の響きもあるため、「負い」が罪を担う意味を自然に保つ。
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: その身に
  rationale: 身体をもって実際に苦しんだ具体性を保ちつつ、現代日本語として自然で簡潔に表した。
- source_word: ἐπὶ τὸ ξύλον
  choice: 木の上で
  rationale: ξύλονの字義である「木」を残し、申命記21章23節を想起させる表現を保持した。「十字架」は指示対象を明確にするが、本文では原語より解釈的になるため脚注に示す。
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: 罪に対して死に
  rationale: ἀπογίνομαιが表す罪との決定的な断絶を、日本語で理解できる聖書的表現として訳した。単なる一時的な中止ではなく、生き方の転換を示す。
- source_word: τῇ δικαιοσύνῃ ζήσωμεν
  choice: 義のために生きる
  rationale: 与格が示す、生が義へと向けられる関係を自然な日本語で表した。「義」はδικαιοσύνηの神学的・倫理的な広がりを保つ。
- source_word: μώλωπι
  choice: 傷
  rationale: 打撃によってできた傷やあざを指す単数名詞。現代日本語で自然な「傷」を本文に置き、イザヤ書53章5節との響きを脚注で補った。
- source_word: ἰάθητε
  choice: 癒やされました
  rationale: アオリスト受動態をそのまま表し、身体的治癒だけにも、罪からの霊的回復だけにも限定しない語を選んだ。
- source_word: αὐτὸς
  choice: 自ら
  rationale: 強意代名詞の強調を明示し、この方自身が罪を負ったことを表した。
theological_decisions:
- issue: 最後の節における「癒やし」の範囲
  choice: 「癒やされました」とし、身体的か霊的かを本文で限定しない。
  alternative: 罪からの霊的癒やしに限定する、または身体的癒やしに限定する。
  rationale: 直前の文脈は罪と義を中心としているが、ἰάθητε自体は広い癒やしの表現であり、イザヤ書53章の引用的響きもある。本文が持つ広がりを保った。
- issue: ξύλονの訳語
  choice: 本文では「木」とする。
  alternative: 「十字架」とする。
  rationale: 指示対象はキリストの十字架刑だが、原文はσταυρόςではなくξύλονを用いる。申命記21章23節との関連を保持するため、原語に即して「木」とした。
- issue: キリストの受苦と罪を負うことの関係
  choice: 「その身に負い、木の上で苦しみを受けられました」と表す。
  alternative: 「罪を供え物として献げた」と祭儀的意味に限定する。
  rationale: ἀναφέρωには祭儀的含意の可能性があるが、ここで専門的な贖罪理論に限定せず、罪を担ったことと身体的受苦の双方を明確にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」は直前の文脈にいるキリストを受ける。敬語は過度に重くせず、「受けられました」「癒やされました」により自然な敬意を示した。
