  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: ja
  text: 'ですから、信じるあなたがたには誉れがあります[a]。しかし、信じない者たちには[b]、


    「家を建てる者たちが退けた石、

    それが隅のかなめとなった[c]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信じるあなたがたにとって、その石は尊い」。直前の節の「選ばれた尊い石」を受ける理解。
    reason: alternative_reading
  - marker: b
    text: 「従わない者たち」とも訳せる。この語は、信じることを拒み、その結果として従わないという含みを持つことがある。
    reason: lexical_alternative
  - marker: c
    text: 「隅のかなめ」は、伝統的には「隅石」または「土台の隅石」などと訳される。原文は直訳すると「隅の頭」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: 誉れ
  rationale: 「誉れ、尊敬、価値」を表し得る語。ここでは、直前の「信じる者」と後続の「信じない者」の対比、および恥を受けないという文脈を踏まえ、信じる者に属する「誉れ」と訳した。石そのものの「尊さ」を指す可能性は脚注に残した。
- source_word: τοῖς πιστεύουσιν
  choice: 信じるあなたがたには
  rationale: ὑμῖν と与格の分詞を合わせ、直接の呼びかけと「信じる者」という性格の両方を自然な日本語で示した。
- source_word: ἀπιστοῦσιν
  choice: 信じない者たちには
  rationale: πιστεύουσιν との明確な対比を保つため、「信じない」とした。不信が不従順として現れる含みは脚注に示した。
- source_word: λίθος
  choice: 石
  rationale: 建築の比喩と引用元の表現に適合する標準的な訳語。
- source_word: ἀπεδοκίμασαν
  choice: 退けた
  rationale: 吟味した上で不適格として拒む意味を、簡潔で自然な日本語にした。
- source_word: οἱ οἰκοδομοῦντες
  choice: 家を建てる者たち
  rationale: 実体化された分詞の建築的イメージを明確に伝える。「建築家」では職業的な設計者を連想しやすいため避けた。
- source_word: κεφαλὴν γωνίας
  choice: 隅のかしら
  rationale: 直訳的な「隅の頭」では日本語として意味を取りにくいため、「かしら」で首位・主要部の比喩を保持した。「隅の親石」など特定の建築解釈に限定せず、伝統的な理解は脚注に示した。
theological_decisions:
- issue: ἡ τιμήと信じる者および石であるキリストとの関係
  choice: 信じる者に誉れがあるという文として訳す。
  alternative: 信じる者にとって、その石は尊い。
  rationale: ὑμῖν οὖν ἡ τιμή は最も自然には、信じる者に「誉れ」が属することを述べる。直前の「尊い石」を受けて石の尊さを指す可能性もあるため、脚注で保持した。
- issue: κεφαλὴ γωνίαςの建築的・キリスト論的意味
  choice: 「隅のかしら」とし、原文の比喩的な形を保つ。
  alternative: 隅の親石／礎の隅石／最も重要な隅石
  rationale: この句がどの位置の石を指すかを本文で一つに限定せず、「隅」と「かしら」の要素を保持した。一般的な建築上の理解は脚注に置いた。
translation_notes:
  register: 明瞭で現代的ながら、聖書引用にふさわしい品位を保った。「誉れ」「退けた」「かしら」は一般読者にも理解可能な範囲で格調を持たせる語として選択した。引用部は詩的な改行を用い、οὗτος の強調を「それが」で表した。
