source:
  edition: SBLGNT
  text: ⸀Ὑποτάγητε πάσῃ ἀνθρωπίνῃ κτίσει διὰ τὸν κύριον· εἴτε βασιλεῖ ὡς ὑπερέχοντι,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/013.yaml
  text: Submit yourselves to every human institution for the Lord’s sake[a], whether to a king as one in authority[b],
translation:
  language: ja
  text: 主のゆえに、人間のあらゆる制度[a]に従いなさい。最高の権威を持つ者としての王にも[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「人間のあらゆる被造物（または創造物）」。伝統的には「人間が定めたあらゆる規定」とも訳される。ここでは、続いて王や総督が挙げられることから、人間社会の公的な制度や権威を指すと理解した。
    reason: lexical_alternative
  - marker: b
    text: 別訳「上に立つ者としての王にも」または「最高の者としての王にも」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: 従いなさい
  rationale: 受動形ながら自発的服従を命じる用法として、現代日本語で自然かつ勧告の力を保つ表現とした。
- source_word: πάσῃ
  choice: あらゆる
  rationale: 単数名詞を伴う配分的な意味を表し、それぞれの制度を包括する。
- source_word: ἀνθρωπίνῃ κτίσει
  choice: 人間社会のあらゆる制度
  rationale: κτίσιςの基本義は「創造されたもの」だが、直後の王や総督という例から、ここでは人間社会に設けられた公的秩序・制度を指す。「人間社会の」とすることで、人間一人一人への服従との誤解を避けつつ、制度の人間的・社会的性格を示した。語義上の曖昧さは脚注に残した。
- source_word: διὰ τὸν κύριον
  choice: 主のために
  rationale: 対格を伴うδιάが示す理由・動機を簡潔に表す。「主」が神かイエスかは本文どおり特定しない。
- source_word: εἴτε βασιλεῖ
  choice: 王にも
  rationale: εἴτεは次節へ続く選択的列挙を導く。日本語では「にも」によって後続する総督との並列を自然に示した。βασιλεύςは歴史的には皇帝を指し得るが、語の広がりを保って「王」とした。
- source_word: ὡς ὑπερέχοντι
  choice: 最高位にある者としての
  rationale: ὑπερέχωの「上位にある、卓越する」という関係的意味を表す。権威が無制限・絶対的であると断定せず、統治秩序上の地位を示す表現とした。
theological_decisions:
- issue: ἀνθρωπίνῃ κτίσειが指すもの
  choice: 人間社会の制度
  alternative: 人間による創造物／人間が定めた規定／すべての人間
  rationale: 王と総督が例示される文脈から、市民社会の制度・権威を指すと判断した。ただしκτίσιςの通常の語義との緊張は脚注で明示した。
- issue: κύριονの指示対象
  choice: 「主」のまま保持
  alternative: イエス／神
  rationale: ギリシャ語本文は指示対象を明示していないため、訳文でも限定しない。
- issue: 王の権威の範囲
  choice: 統治秩序において最高位にある者
  alternative: 絶対的・至高の者
  rationale: ὑπερέχωνは上位性を示すが、神学的に無制限の至上権を王に帰すとは限らないため、関係的な地位として訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「従いなさい」で命令の直接性を保ち、「人間社会の制度」により文脈上の意味を自然に示した。文は次節へ続くため、末尾を読点とした。
