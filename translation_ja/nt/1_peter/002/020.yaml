id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: ja
  text: 罪を犯して殴られ、それに耐え忍んでも、何の誉れがあるでしょうか。しかし、善を行って苦しみを受け、それに耐え忍ぶなら、それは神の御前で恵みです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これは神の好意を得ることです」または「これは神の御前で称賛に値することです」。
    reason: χάρις と παρὰ θεῷ は、この文脈では神から好意や肯定的評価を受けることを表す可能性があるため。
lexical_decisions:
- source_word: κλέος
  choice: 誉れ
  rationale: この修辞疑問では、広い意味での名声ではなく、行為に対して得られる称賛や評価を指す。「誉れ」はその肯定的評価を簡潔に表す。
- source_word: ἁμαρτάνοντες
  choice: 罪を犯して
  rationale: 一般的な「悪いことをして」よりも、原語の道徳的・神学的な意味を明確に保つ。
- source_word: κολαφιζόμενοι
  choice: 殴られ
  rationale: 拳で打つ、または身体的に打ちたたくという具体的な意味を、現代日本語で自然かつ明瞭に表す。
- source_word: ὑπομενεῖτε
  choice: 耐え忍ぶ
  rationale: 苦難のもとにとどまり続ける意味を表し、二つの条件節で同じ訳語を反復して原文の対照を保つ。
- source_word: ἀγαθοποιοῦντες
  choice: 善を行って
  rationale: 正しいこと、良いことを行うという意味を直接的かつ自然に表す。
- source_word: πάσχοντες
  choice: 苦しみを受け
  rationale: 不当な扱いだけに限定せず、原語が持つ広い「苦しむ」の意味を保つ。
- source_word: χάρις
  choice: 恵み
  rationale: 文脈上は神の好意や称賛を受けることを意味し得るが、「恵み」という語の神学的響きと語彙上の透明性を本文に残し、文脈的な別訳は脚注に示す。
- source_word: παρὰ θεῷ
  choice: 神の御前で
  rationale: 神の臨在と神による評価の双方を含み得る関係的な表現として訳した。「神にとって」「神のもとで」も可能だが、「御前で」は簡潔で荘重さも保つ。
theological_decisions:
- issue: 結びの τοῦτο χάρις παρὰ θεῷ の意味
  choice: 本文を「それは神の御前で恵みです」とし、神の好意・称賛という意味を脚注に残す。
  alternative: 「これは神の好意を得ることです」または「これは神の御前で称賛に値することです」
  rationale: χάρις は神学的な「恵み」と、文脈上の「好意・評価」の両方を響かせ得る。本文と脚注を併用することで、一方に限定せず原文の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「誉れ」「耐え忍ぶ」「神の御前」「恵み」によって聖書本文にふさわしい品位を保った。原文の二つの条件節の並行性を、日本語でも「それに耐え忍ぶ」の反復によって示した。
