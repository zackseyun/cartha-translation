  - severity: low
    issue: 「王の祭司団」は βασίλειον の意味を日本語で狭く受け取られる可能性がある。
    rationale: 「王の」は所有格として読まれやすく、王に属する祭司団という一義的理解を招き得る。原語の「王的な／王に属する」の幅を保つため、「王的な祭司団」とし、脚注で別の理解を示すのが安全である。
  - severity: low
