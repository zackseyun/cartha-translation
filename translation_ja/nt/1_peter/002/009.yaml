reference: 1 Peter 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: ja
  text: しかし、あなたがたは、選ばれた民[a]、王的な祭司団[b]、聖なる国民、神のものとされた民です。それは、あなたがたを闇からご自分の驚くべき光へと召してくださった方のすぐれた特質[c]を、告げ知らせるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「選ばれた種族」とも訳せる。ギリシア語は、血統、種族、民などを表し得る。ここでは、現代の民族的・人種的な意味に限定されるとの誤解を避け、共同体としての意味を示すため「民」とした。
    reason: lexical_alternative
  - marker: b
    text: 「王に属する祭司団」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「称賛されるべき事柄」または「力あるみわざ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: しかし、あなたがたは
  rationale: δὲによる直前との対比と、明示されたὙμεῖςの強調を、自然な現代日本語で保った。
- source_word: γένος ἐκλεκτόν
  choice: 選ばれた民
  rationale: γένοςは血統、種族、民を表し得る。現代の民族・人種概念への誤解を避けつつ、共同体として選ばれたという意味を示すため「民」とした。別訳は脚注に残した。
- source_word: βασίλειον ἱεράτευμα
  choice: 王の祭司団
  rationale: βασίλειονの王的・王に属するという含みと、ἱεράτευμαの集合的な意味を簡潔に表した。出エジプト記19章6節の七十人訳との響きも保つ。解釈可能性は脚注に示した。
- source_word: ἔθνος ἅγιον
  choice: 聖なる国民
  rationale: ἔθνοςの共同体・国民としての意味と、ἅγιονの神のために取り分けられたという契約的な意味を直接に表した。
- source_word: λαὸς εἰς περιποίησιν
  choice: 神ご自身のものとされた民
  rationale: περιποίησιςが表す特別な所有・獲得の関係を自然な日本語にした。所有者である神は文脈上明らかなため補ったが、愛情や価値の含みを過度に加える「宝の民」などは避けた。
- source_word: ὅπως
  choice: それは……ためです
  rationale: ὅπωςが導く目的を明確な日本語の目的構文で表した。
- source_word: τὰς ἀρετὰς
  choice: すばらしさ
  rationale: ἀρετήの、称賛に値する卓越性・徳・力ある働きに及ぶ幅を保つため、特定の行為だけに狭めない表現を選んだ。別の可能性は脚注に示した。
- source_word: ἐξαγγείλητε
  choice: 告げ知らせる
  rationale: ἐξαγγέλλωの、公に広く宣べ伝える力を、明快で自然な表現で示した。
- source_word: τοῦ ... καλέσαντος
  choice: 召してくださった方
  rationale: 属格の分詞構文を、神をその行為によって指し示す日本語にした。敬語は神を指す文脈に即した自然な日本語表現である。
- source_word: ἐκ σκότους ... εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: 闇の中からご自分の驚くべき光の中へと
  rationale: ἐκからεἰςへの移動の対照と、闇・光という領域的な比喩を保った。θαυμαστόςは驚嘆を呼ぶ性質として「驚くべき」とした。
theological_decisions:
- issue: イスラエルの契約上の称号に由来する共同体的表現
  choice: 「選ばれた民」「王の祭司団」「聖なる国民」を直接的な集合名詞として保持する。
  alternative: 抽象的な霊的比喩へと言い換える。
  rationale: 本文は旧約由来の契約的な呼称を読者共同体に明確に適用している。その神学的緊張を弱めず、同時に、この一節だけでは定まらないイスラエルと教会の体系的関係を訳文に持ち込まないためである。
- issue: λαὸς εἰς περιποίησινの所有者
  choice: 文脈上の所有者を「神ご自身」と明示する。
  alternative: 「所有のための民」のように所有者を明示しない。
  rationale: ギリシア語句そのものには所有者を表す代名詞がないが、直後の召した方との関係および旧約的背景から神が所有者であることは明らかである。日本語で関係を理解可能にするための文脈上妥当な明示であり、追加の教理を導入するものではない。
- issue: βασίλειον ἱεράτευμαの王的意味
  choice: 本文では簡潔な「王の祭司団」とし、王に属する意味と王的な意味の双方を閉ざさない。
  alternative: 「王に仕える祭司団」または「王である祭司団」と一義的に解釈する。
  rationale: βασίλειονは「王の・王に属する」と「王的な」の両方向に理解され得るため、訳文で一方だけに固定せず、脚注で可能性を示した。
translation_notes:
  register: 明快な現代標準語を用いながら、列挙の荘重さと旧約的な契約用語の響きを保った。「祭司団」によりἱεράτευμαの集合性を示し、「召してくださった」には神を指す文脈にふさわしい敬意を自然に織り込んだ。
