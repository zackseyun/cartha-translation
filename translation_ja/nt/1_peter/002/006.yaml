  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: ja
  text: 'なぜなら、聖書にはこう記されています。


    「見よ、わたしはシオンに、選ばれ、尊ばれた隅石を据える。


    この方[a]を信じる者は、決して恥を受けることがない。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この方」は、字義的には直前の「隅石」を受ける「これ」または「この石」とも訳せます。ここでは2章4～8節の文脈における、この石のキリストへの適用を反映しています。なお、「隅石」は「隅の親石」とも訳せます。
    reason: lexical_and_referential_alternatives
lexical_decisions:
- source_word: διότι
  choice: ～からです／こう記されています
  rationale: 直前の主張を聖書によって根拠づける接続である。日本語では「聖書にはこう記されています」として説明の流れを自然に示した。
- source_word: περιέχει ἐν γραφῇ
  choice: 聖書にはこう記されています
  rationale: 直訳的には「聖書の中に含まれている」に近い慣用表現だが、現代日本語として自然で、引用を導入する機能も明確な表現を選んだ。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 預言の引用における注意喚起と荘重さを保つ。
- source_word: τίθημι
  choice: 据える
  rationale: 建築用の重要な石を定位置に置く比喩に適した、自然で格調ある語である。
- source_word: ἐν Σιὼν
  choice: シオンに
  rationale: 場所を表すἐνを、日本語の自然な助詞「に」で表した。
- source_word: λίθον ἀκρογωνιαῖον
  choice: 隅の親石
  rationale: 建物の隅に据えられ、その基準となる重要な石を指す語として、比喩を保ちつつ意味が比較的伝わる表現を選んだ。
- source_word: ἐκλεκτὸν
  choice: 選ばれた
  rationale: 神による選定の意味を、現代日本語で直接かつ自然に表す。
- source_word: ἔντιμον
  choice: 尊い
  rationale: この語が持つ「重んじられている」と「高い価値がある」の両面を簡潔に伝える。「高価な」より人格的な適用にもなじむ。
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: この方を信じる者
  rationale: 石の比喩を受けながらも、周囲の文脈ではキリストに人格的に適用されているため、「この方」とした。日本語では「この方を信じる」が自然である。
- source_word: οὐ μὴ καταισχυνθῇ
  choice: 決して恥を受けることがない
  rationale: οὐ μήによる強い否定を「決して～ない」で示し、καταισχύνωの受動形を「恥を受ける」と訳した。
theological_decisions:
- issue: ἐπ’ αὐτῷの指示対象
  choice: 人格を示す「この方」
  alternative: 石の比喩に即した「これ」または「この石」
  rationale: 文法上は直前の「石」を受ける一方、ペトロは2:4–8でその石をキリストに適用している。「この方」はその文脈上の人格的指示を表すが、石の比喩自体は引用内に残した。
- issue: ἀκρογωνιαῖονの建築上の意味
  choice: 隅の親石
  alternative: 隅石、礎石、かしら石
  rationale: この語が基礎の隅石か頂部の石かについて過度に限定せず、建物の隅で基準となる主要な石という一般的な像を保った。
- issue: ἔντιμονの意味領域
  choice: 尊い
  alternative: 高価な、尊ばれている
  rationale: 価値と名誉の双方を含み得るため、一方だけに狭めにくい「尊い」を用いた。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、聖書引用では「見よ」「据える」により適度な荘重さを保った。「決して～ない」で原文の強い否定を明示した。
