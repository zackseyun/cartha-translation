id: 1PE.2.4
reference: 1 Peter 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: ja
  text: あなたがたがこの方のもとに来るとき、この方は生きた石です。人々には退けられましたが、神のもとでは選ばれ、尊ばれています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρὸς ὃν προσερχόμενοι
  choice: この方のもとに近づきなさい
  rationale: 前置詞句の方向性と現在分詞の継続的・勧告的な流れを、自然な現代日本語で表した。分詞は次節へ続く構文だが、単独節として読めるよう命令形にした。
- source_word: λίθον ζῶντα
  choice: 生ける石
  rationale: λίθοςの建築用の石という比喩と、ζῶνταが生む逆説を保持する。「生きた石」よりも聖書本文として簡潔で品位ある表現を選んだ。
- source_word: ὑπὸ ἀνθρώπων
  choice: 人々には
  rationale: ἄνθρωποιはここで神との対比に置かれた人間一般を指すため、性別を限定しない自然な日本語とした。
- source_word: ἀποδεδοκιμασμένον
  choice: 退けられました
  rationale: 吟味の末に不適格とされ、拒絶されたという完了受動分詞の結果状態を明瞭に伝える。
- source_word: παρὰ δὲ θεῷ
  choice: 神の前では
  rationale: 神との関係における評価・位置づけを示すπαρά＋与格を、簡潔かつ自然に表した。
- source_word: ἐκλεκτὸν
  choice: 選ばれた
  rationale: 神による選択を保ちつつ、専門的な神学用語に寄りすぎない現代語とした。
- source_word: ἔντιμον
  choice: 尊い
  rationale: 高く評価され、価値あるものという意味を表し、石の比喩にも自然に合う。
theological_decisions:
- issue: 「この方」と生ける石の指示対象
  choice: 代名詞的な「この方」を保ち、文脈上キリストを指すものとする
  alternative: 「イエス・キリスト」と明示する
  rationale: 2章3節からの流れと2章6～8節の石に関する引用はキリストを指すが、原文はここで固有名を補わず関係代名詞を用いているため、翻訳でも明示的な名前を挿入しない。
- issue: 現在分詞 προσερχόμενοι の構文的扱い
  choice: 「近づきなさい」と勧告として訳す
  alternative: 「近づいて、あなたがたも……」として5節まで一続きにする
  rationale: 原文の分詞は5節の主節と密接につながり、時間的・継続的意味にも取り得る。今回は単独の節として自然に成立させつつ、文脈の勧告的力を伝えた。
- issue: ἔντιμον の意味合い
  choice: 「尊い」
  alternative: 「価値ある」または「重んじられた」
  rationale: 神の評価における高い価値と栄誉の両面を含み得るため、一方に狭く限定しない「尊い」を採用した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「生ける石」という中心的な逆説と荘重さを保持した。「人々」は人間一般を自然に指し、神の評価との対比を明確にする。原文では4～5節が構文上連続するが、指定された4節単独でも読めるよう文を整えた。
