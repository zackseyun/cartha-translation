  source_fidelity: ギリシア語の二つの否定（「罪を犯さず」「欺きも…なかった」）と、εὑρέθηの非人称的な受動表現「見いだされなかった」を適切に保っている。「その口には」もἐν τῷ στόματι αὐτοῦを忠実に反映し、イザヤ53:9への語句上の響きを損なわない。
