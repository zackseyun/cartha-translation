id: 1PE.2.22
reference: 1 Peter 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ἁμαρτίαν οὐκ ἐποίησεν οὐδὲ εὑρέθη δόλος ἐν τῷ στόματι αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: ja
  text: この方は罪を犯さず、その口には欺き[a]も見いだされなかった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「偽り」。ギリシア語は、欺瞞、詐欺、裏切りを含み得る。
    reason: lexical_alternative
  - marker: b
    text: この表現はイザヤ53:9を反映している。
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: この方は
  rationale: 直前のキリストを受ける関係代名詞。日本語では文脈を自然につなぎ、指示対象への敬意も保つ「この方は」とした。
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: 罪を犯さず
  rationale: ποιέωは直訳すれば「行う」だが、ἁμαρτίαとの結び付きでは「罪を犯す」が自然で正確である。否定を簡潔に保った。
- source_word: οὐδὲ
  choice: も…なかった
  rationale: 前半に続く第二の否定を、日本語で自然な添加的否定として表した。
- source_word: εὑρέθη
  choice: 見いだされなかった
  rationale: アオリスト受動態を受動表現で保ち、誰が見いだしたかを補わず、イザヤ書との響きも維持した。
- source_word: δόλος
  choice: 欺き
  rationale: 意図的な偽り、策略、欺瞞を表す語。「欺き」は現代日本語として明瞭で、意味範囲を狭めすぎない。
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: その口には
  rationale: 原文の身体的比喩を保つとともに、イザヤ53章との語句上のつながりを伝える。
theological_decisions:
- issue: イザヤ53:9を思わせる表現によるキリストの無罪性と真実性
  choice: 「罪を犯さず、その口には欺きも見いだされなかった」と、原文の二つの否定と受動表現を保った。
  alternative: 「一度も罪を犯さず、偽りを語ることもなかった」のように説明的に言い換える。
  rationale: 説明を加えずに原文の神学的主張と旧約聖書への響きを保ち、罪や欺きの範囲を翻訳で不必要に限定しないため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「見いだされなかった」はやや文語的だが、受動態と聖書間の響きを保ちつつ、一般読者にも理解可能である。
