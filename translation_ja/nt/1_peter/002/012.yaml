id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: ja
  text: 異邦人の間で、あなたがたの生活を立派なものに保ちなさい。そうすれば、彼らがあなたがたを悪事を行う者として悪く言うことについて、あなたがたの立派な行いをよく見て、神の訪れの日に神をあがめるようになります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の訪れの日」は、神が人を顧みられる時を指す。救いのための訪れとも、裁きのための訪れとも理解できる。
    reason: 原語ἐπισκοπήの意味の幅と、この句に残る神学的な曖昧さを示すため。
lexical_decisions:
- source_word: ἀναστροφή
  choice: 生活
  rationale: 単なる個々の「行い」ではなく、生き方や日常の振る舞い全体を指すため。後半の「行い」との区別も保てる。
- source_word: ἐν τοῖς ἔθνεσιν
  choice: 異邦人の間で
  rationale: ユダヤ人ではない諸民族を指す新約聖書の通常の用法を保持した。
- source_word: καλήν / καλῶν
  choice: 立派に／立派な
  rationale: 倫理的に善く、外から見ても称賛に値するという語感を自然な日本語で表す。
- source_word: ἐν ᾧ
  choice: その事柄においても
  rationale: 原文の関係表現を保ち、「～なのに」と譲歩へ確定しすぎないようにした。文脈上の譲歩的含みは「も」で穏やかに示した。
- source_word: ἐποπτεύοντες
  choice: よく見て
  rationale: 注意深く目撃・観察する意味を簡潔な現代日本語で表した。
- source_word: ἡμέρᾳ ἐπισκοπῆς
  choice: 訪れの日
  rationale: ἐπισκοπήの『訪問・顧み』という幅を保ち、裁きか救いかを本文で一義的に限定しない。
theological_decisions:
- issue: 「訪れの日」の性格
  choice: 神の救済的な顧みとも裁きの訪れとも取り得る表現を保持する
  alternative: 「神が顧みてくださる日」または「裁きの日」
  rationale: ἐπισκοπήと文脈だけでは性格を完全には確定できないため、神学的緊張を訳文で解消しない。
- issue: 異邦人が神をあがめる時点と仕方
  choice: 「訪れの日に神をあがめるようになります」
  alternative: 「神の訪れを受ける日に神をほめたたえるでしょう」
  rationale: 目的を示すἵναと未来的なδοξάσωσινを自然に表しつつ、その賛美が回心によるものか、裁きの際の承認かは限定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、命令の力を保ちながら過度に古風な表現を避けた。「生活」と「行い」を使い分け、前者は生き方全体、後者は観察可能な善い行為を表す。
