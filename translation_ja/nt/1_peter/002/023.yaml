  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: ja
  text: 侮辱されても、侮辱し返さず、苦しまれても、脅すこともなく、しかし、正しく裁く方にご自分を委ね続けられました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιδορούμενος / ἀντελοιδόρει
  choice: 侮辱されても、侮辱し返さず
  rationale: 言葉による悪罵と、それに同じ仕方で応酬しないことを、対応する現代日本語で表した。両動詞の語彙的な結び付きも保っている。
- source_word: πάσχων
  choice: 苦しみを受けても
  rationale: 先行する分詞句と並行する状況を表し、自然な譲歩表現とした。
- source_word: οὐκ ἠπείλει
  choice: 脅すことをせず
  rationale: 脅しの言葉を発しなかったという意味を、明確で自然な日本語にした。
- source_word: παρεδίδου
  choice: ご自分を委ね続けました
  rationale: 未完了過去が示す継続的・反復的な態度を「続けました」で表し、文脈上補われる再帰的目的語を明示した。
- source_word: τῷ κρίνοντι δικαίως
  choice: 正しく裁く方に
  rationale: 冠詞付き分詞と副詞を記述的に訳し、原文にない称号や位格名を加えなかった。
- source_word: δὲ
  choice: （前後の対照として）…せず、…委ね続けました
  rationale: 日本語では接続詞「しかし」を明示せずとも、否定句から肯定句への構文的対照で自然に表せる。
- source_word: ὃς
  choice: （主語を前節から継続）
  rationale: 日本語では関係代名詞を逐語的に再現できないため、前節のキリストを主語として自然に継続させた。
theological_decisions:
- issue: 「正しく裁く方」の指示対象
  choice: 原文どおり「正しく裁く方」と記述し、神を指すことを文脈に委ねる
  alternative: 「正しく裁かれる父なる神」と明示する
  rationale: 文脈上は神が示唆されるが、原文は位格や称号を明記していないため、過度に限定しない。
- issue: παρεδίδου の省略された目的語
  choice: 「ご自分を」と補って、キリストが自らを神に委ねたと訳す
  alternative: 目的語を明示せず「委ねておられた」、または「そのことを委ねた」と訳す
  rationale: 文脈と一般的な統語理解に基づく自然な補足だが、何を委ねたかは原文に明示されていない。この曖昧さを注で示すほど訳文理解に支障はないと判断した。
translation_notes:
  register: 明快な現代標準日本語。キリストへの敬意を「ご自分」で表しつつ、過度に古風な語法は避けた。「侮辱」を反復して原文の語根の対応を可視化し、格調と平易さを両立させた。
