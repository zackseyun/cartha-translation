    rationale: πάσχων は簡潔に「苦しむこと」を表すため、「苦しまれても」は現代日本語として滑らかで、受難の意味を損なわない。
  revised_text: 侮辱されても、侮辱し返さず、苦しまれても、脅すこともなく、しかし、正しく裁く方にご自分を委ね続けられました。
