  source_fidelity: 原文は、侮辱を受けた際の非報復、苦難の際の非威嚇、そして正しく裁く方への継続的な委託を対照させる。草案はこの内容を正確に伝えており、「正しく裁く方」も指示対象を過度に限定していない。παρεδίδου の目的語は原文で明示されないが、文脈上「ご自分を」と補うことは自然である。
  naturalness: 「脅すことをせず」は意味は明瞭だが、現代標準日本語では「脅すこともなく」のほうが、前後の連結と否定から肯定への対照を自然に表せる。また「苦しみを受けても」は「苦しんでも」よりやや重い表現なので、原文の簡潔な πάσχων に合わせて「苦しまれても」とする。
  terminology: 「侮辱されても／侮辱し返さず」は λοιδορούμενος と ἀντελοιδόρει の語彙上の対応と反復的な非報復をよく保つ。「委ね続けられました」は未完了形の継続的な含みを自然に表す。「方」は神を指す文脈にふさわしい敬意を示す一方、原文にない「父」などの称号を加えない。
  issues:
