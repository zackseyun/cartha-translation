id: 1PE.2.25
reference: 1 Peter 2:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: ja
  text: というのも、あなたがたは羊のように迷っていましたが[a]、今はあなたがたのたましいの牧者、また監督者である方のもとに立ち帰りました[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「さまよっていました」、または「迷わされていました」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「立ち帰らされました」とも理解できる。ギリシア語の形は受動だが、自動詞的に「立ち帰った」と理解されることもある。
    reason: alternative_reading
  - marker: c
    text: 「監督者」は「見守る方」または「守り手」とも訳せる。伝統的には「司教」と訳されることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: あなたがたは……いました
  rationale: γάρは前節を受けて理由や説明を示すが、日本語では文脈上これを明示せずともつながりが自然である。ἦτεの未完了的な過去の状態は「いました」で表した。
- source_word: ὡς πρόβατα
  choice: 羊のように
  rationale: ὡςの比較を自然に保ち、πρόβαταは集合的な複数として「羊」とした。
- source_word: πλανώμενοι
  choice: 迷っていました
  rationale: 羊の比喩に沿って、さまようことと道を逸れることの双方を含み得る「迷う」を用いた。受動的な『迷わされる』まで本文で限定しない。
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: 今は……立ち帰ったのです
  rationale: ἀλλάの強い対照は「が、今は」で示した。ἐπεστράφητεは形態上受動だが、自動詞的・中動的にも理解できるため、自然な「立ち帰った」を本文とし、受動の可能性を注で残した。
- source_word: ἐπὶ τὸν ποιμένα
  choice: 牧者……のもとに
  rationale: ποιμήνは羊の比喩を保つ「牧者」とし、ἐπίは人格的な帰着点を自然に示す「のもとに」とした。
- source_word: καὶ ἐπίσκοπον
  choice: また見守る方
  rationale: ἐπίσκοποςの監督し配慮する意味を、現代日本語で教会制度上の役職に限定されにくい表現で示した。
- source_word: τῶν ψυχῶν ὑμῶν
  choice: あなたがたのたましいの
  rationale: ψυχήの伝統的かつ文脈に適した意味を保ちつつ、硬すぎない表記として「たましい」を採用した。
theological_decisions:
- issue: ἐπίσκοποςをキリストへの称号としてどう訳すか
  choice: 見守る方
  alternative: 監督者／守り手
  rationale: キリストが民を見守り配慮する意味を示しつつ、後代の教会職制を直接持ち込む「司教」は避けた。「監督者」は語形に近いが、現代語では職場や役職の響きが強いため代案とした。
- issue: ἐπεστράφητεの態の含み
  choice: 立ち帰った
  alternative: 立ち帰らされた
  rationale: 受動形を神の働きの明示と断定せず、自動詞的・中動的用法の可能性を本文に採った。一方、受動的な理解も文法上可能なので脚注に残し、神の働きと人の応答の関係を過度に解決しない。
- issue: ψυχήの範囲
  choice: たましい
  alternative: いのち／あなたがた自身
  rationale: 霊的な配慮という文脈と伝統的な語感を保つ。ただしψυχήは非物質的部分だけでなく、人のいのちや存在全体を指し得るため、その幅を脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「牧者」「立ち帰る」によって聖書的な羊の比喩と格調を保った。「見守る方」は制度的・教派的な含みを避けつつ、キリストの継続的な配慮を伝える表現である。
