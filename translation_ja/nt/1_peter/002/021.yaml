id: 1PE.2.21
reference: 1 Peter 2:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: ja
  text: 'あなたがたが召されたのは、このためです。メシアもあなたがたのために苦しみを受け、あなたがたがその足跡に従うようにと、模範[a]を残されたからです。


    [a] 「手本」とも訳せる。ギリシア語は、学ぶ者がなぞるために示された書き見本を指す語。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「手本」とも訳せる。ギリシア語は、学ぶ者がなぞるために示された書き見本を指す語。
    reason: ὑπογραμμός の教育的な比喩と訳語の幅を示すため。
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: このため
  rationale: 直前で語られた、不当な苦しみに耐えることを指す表現として、目的・方向を保ちつつ自然な日本語にした。
- source_word: ἐκλήθητε
  choice: 召された
  rationale: 神による呼びかけという含みを保ちながら、その働きの神学的な仕組みまでは限定しない表現とした。
- source_word: ὅτι
  choice: からです
  rationale: メシアの苦しみと模範が、召しの根拠・説明であることを明確にした。
- source_word: Χριστὸς
  choice: メシア
  rationale: 固有名のようにではなく、『油注がれた者』という称号として用いられている点を示した。
- source_word: ἔπαθεν
  choice: 苦しみを受け
  rationale: 苦しみの具体的な様態や死を本文以上に補わず、動詞の意味を簡潔に表した。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたのために
  rationale: 受益・代理の幅を保ち、身代わりという特定の意味だけに狭めない表現とした。
- source_word: ὑμῖν ὑπολιμπάνων
  choice: あなたがたが……模範を残された
  rationale: メシアが読者のために模範を残したという間接目的語の関係が、日本語で自然に伝わるようにした。
- source_word: ὑπογραμμὸν
  choice: 模範
  rationale: 従うべき見本という文脈上の意味を明確にし、学習者がなぞる書き見本という具体的な語感は脚注に残した。
- source_word: ἵνα
  choice: ようにと
  rationale: 模範を残した目的を自然な現代日本語で示した。
- source_word: ἐπακολουθήσητε
  choice: 従う
  rationale: 後について行くという意味を足跡の比喩と結びつけ、目的節の中で自然に表した。
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: その足跡に
  rationale: 歩み方や行動にならうことを表す原文の足跡の比喩を保持した。
theological_decisions:
- issue: メシアの苦しみに関する ὑπὲρ ὑμῶν の意味
  choice: あなたがたのために
  alternative: あなたがたに代わって
  rationale: この句には受益的・代理的な広がりがあり得るが、直近の文脈は模範としての苦しみにも重点を置くため、身代わりの意味だけに限定しない訳とした。
- issue: 苦しみと模範の関係
  choice: 苦しみを受け……模範を残された
  alternative: 模範を残すために苦しみを受けた
  rationale: 原文は苦しみそのものと模範を残すことを結びつけるが、苦しみの目的を模範の提示だけに限定してはいないため、両者の関係を過度に説明しない形にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。敬体を用い、『足跡』の比喩を保持した。長いギリシア語一文は、因果関係を保ちながら二文に分けて読みやすくした。
