  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: ja
  text: なぜなら、だれかが神を意識して、不当に苦しみを受けつつ、それに耐えるなら、それは恵みだからです。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神を心に留めて」、または「神に対する良心のゆえに」。
    reason: lexical_alternative
  - marker: b
    text: ここで「恵み」は、好ましいこと、称賛に値すること、または好意を受けるに値することを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: この文脈では「好ましいこと」「称賛に値すること」「神の好意を受けること」という評価的な意味を帯びるが、ペトロ書簡および新約聖書における語のつながりを保つため「恵み」とした。文脈上の意味は脚注で補った。
- source_word: διὰ συνείδησιν θεοῦ
  choice: 神を意識するがゆえに
  rationale: συνείδησιςには「良心」と「意識・自覚」の両面があり、θεοῦは神に向けられた意識を示すと理解した。「神を意識する」はその幅を比較的よく保ち、διὰの理由・動機も「がゆえに」で明示する。
- source_word: ὑποφέρει
  choice: 耐える
  rationale: 困難の下で持ちこたえることを表す。現代日本語として自然で、忍耐の意味も明確である。
- source_word: λύπας
  choice: 苦痛
  rationale: 感情的な悲しみに限定せず、苦悩や痛みを広く表せる語を選んだ。
- source_word: πάσχων ἀδίκως
  choice: 不当に苦しめられながらも
  rationale: 不正な扱いによって苦しむ状況を自然な日本語で表し、分詞の付帯状況と逆接的含みを「ながらも」で示した。
- source_word: τις
  choice: だれか
  rationale: 不定の単数を性別を限定せずに表した。
- source_word: τοῦτο γὰρ
  choice: というのも……それは……だからです
  rationale: γάρが前文への説明を導くことと、τοῦτοが後続の条件内容を受けることの双方を、日本語の呼応表現で明確にした。
theological_decisions:
- issue: χάριςの文脈上の意味
  choice: 本文では「恵み」と訳した。
  alternative: 「称賛に値すること」「神に喜ばれること」「好意を受けること」
  rationale: 評価的な用法ではあるが、本文に明示されていない「神に」を補って意味を一つに限定せず、「恵み」という神学的・語彙的な響きを保持した。
- issue: συνείδησις θεοῦの解釈
  choice: 「神を意識する」とした。
  alternative: 「神を心に留める」「神に対する良心のゆえに」「神の御前で良心に従うため」
  rationale: 神への自覚と良心の両方が含まれ得る難しい句なので、本文では意識・自覚を前面に出しつつ、脚注に良心を含む別訳を掲げて曖昧さを残した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語を用いた。「神を意識するがゆえに」はやや凝縮された表現だが、原文の神に向けられた動機を保ち、「不当に苦しめられながらも」との誤った係り受けを避けるため、耐える行為の直前に置いた。
