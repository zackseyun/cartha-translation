  - severity: medium
    issue: 「苦痛に耐える」が不自然で、原文の二つの表現の関係を十分に明瞭にしない。
    rationale: λύπαςは苦痛一般よりも苦しみ・苦難・悲しみを指し得る。πάσχωνとの重なりを日本語で自然に処理するため、「苦しみを受けつつ、それに耐える」とする。
  - severity: low
    issue: 「がゆえに」がやや文語的である。
    rationale: 明瞭な現代標準日本語として、「神を意識して」のほうが自然であり、神を意識することが耐え忍ぶ動機である流れも保てる。
