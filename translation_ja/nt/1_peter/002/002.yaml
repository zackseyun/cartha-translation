id: 1PE.2.2
reference: 1 Peter 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: ja
  text: 救いに至るまで[b]成長するために、生まれたばかりの赤ん坊のように、混じり気のない霊的な乳[a]を切に求めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊的な」と訳したギリシア語は、「理性的な」「理にかなった」とも訳せる。乳が比喩として用いられているため、この語の意味には別の理解もある。
    reason: λογικόςの重要な語義上の幅と、文脈に基づく訳語選択を保持するため。
  - marker: b
    text: 一部の古代写本には「救いに至るまで」に当たる語句がない。
    reason: εἰς σωτηρίανはSBLGNTで括弧に入れられており、写本上の異読を示すため。
lexical_decisions:
- source_word: ὡς
  choice: 〜のように
  rationale: 同一性ではなく比喩・比較を示す自然な現代日本語。
- source_word: ἀρτιγέννητα βρέφη
  choice: 生まれたばかりの乳飲み子
  rationale: ἀρτιγέννηταの「たった今／新しく生まれた」という強調と、βρέφηの幼い乳児という像を保つ。
- source_word: τὸ λογικὸν
  choice: 霊の
  rationale: 文字どおりの乳ではなく、内なる人を養うものという比喩を自然に伝える。ただし「理にかなった／理性的な」という語義上の可能性を脚注に残した。
- source_word: ἄδολον
  choice: 混じり気のない
  rationale: 混ぜ物がなく、偽りのない純粋さを、乳との自然な結びつきで具体的に表す。
- source_word: γάλα
  choice: 乳
  rationale: 新生児を養うという節の中心的な比喩をそのまま保持する。
- source_word: ἐπιποθήσατε
  choice: 切に求めなさい
  rationale: 強い願望を表す命令の力を保ちつつ、現代日本語として品位ある表現にした。
- source_word: ἵνα
  choice: 〜ためです
  rationale: 目的を示す節であることを明確にする。
- source_word: ἐν αὐτῷ
  choice: それによって
  rationale: 中性単数代名詞が「乳」を受け、成長の手段を示すことを自然に表す。
- source_word: αὐξηθῆτε
  choice: 成長していく
  rationale: 受動形を不自然に直訳せず、継続的な成長の意味を自然な日本語で表した。
- source_word: εἰς σωτηρίαν
  choice: 救いへと
  rationale: εἰςの方向・目標の力を保ち、救いを純粋に現在または未来だけに限定する教理的説明を加えない。
theological_decisions:
- issue: 乳を修飾するλογικόςの意味
  choice: 本文では「霊の」と訳し、非物質的・内面的な養いという文脈上の意味を示す
  alternative: 「理にかなった」「理性的な」
  rationale: λογικόςには理性や内的生命に関わる意味があり、ここでは新生児と乳の比喩の中で信仰者を養う非文字的な乳を指すと考えられる。しかし語義の幅は真正な曖昧さなので脚注で明示した。
- issue: εἰς σωτηρίανの方向性
  choice: 「救いへと成長していく」
  alternative: 「救いに至るまで成長する」「救いのために成長する」
  rationale: 救いを目標とする方向性を保持しつつ、救いと成長の関係について特定教派の体系へ狭めない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「乳飲み子」「切に求める」によって聖書的な比喩の格調を保ち、「混じり気のない」でἄδολονを具体的かつ平易に表した。
