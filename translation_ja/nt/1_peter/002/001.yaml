  text: Ἀποθέμενοι οὖν πᾶσαν κακίαν καὶ πάντα δόλον καὶ ⸀ὑποκρίσεις καὶ φθόνους καὶ πάσας καταλαλιάς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/001.yaml
  text: Therefore[a], having put away all malice and all deceit and hypocrisies and envies and all slanders[b],
translation:
  language: ja
  text: ですから、あらゆる悪意、あらゆる欺き、偽善、ねたみ、あらゆる悪口[b]を捨て去り[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「脱ぎ捨てて」。この分詞は、2節の命令に先立つ行為として訳すことも、「捨て去りつつ」と訳すこともできる。
    reason: lexical_alternative
  - marker: b
    text: または「人を悪く言うあらゆることば」。原語は、他者について悪く言うことを広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: 捨て去り
  rationale: アオリスト中間分詞が二節の命令に先立つ準備的な行為を表すため、日本語では後続節につながる連用形とした。「脱ぎ捨てる」という比喩的な訳も可能だが、文脈上の意味を明瞭に示した。
- source_word: οὖν
  choice: ですから
  rationale: 1章22–25節を受ける推論・帰結を、明瞭で自然な現代日本語で示す。
- source_word: πᾶσαν κακίαν
  choice: あらゆる悪意
  rationale: この徳目表では、一般的な「悪」よりも、他者に向けられる害意という具体的な意味が適切である。
- source_word: πάντα δόλον
  choice: あらゆる欺き
  rationale: δόλοςが表す欺瞞や策略を、簡潔で現代的な語で訳した。
- source_word: ὑποκρίσεις
  choice: 偽善
  rationale: ギリシア語は複数形で、さまざまな偽善の現れを含み得る。日本語では無標の名詞が自然に総称的意味を担うため、形式的な複数表現は加えなかった。
- source_word: φθόνους
  choice: ねたみ
  rationale: 複数形が示す個々のねたみやその諸相を含めつつ、日本語として自然な総称形にした。
- source_word: πάσας καταλαλιάς
  choice: あらゆる悪口
  rationale: 他者に逆らって、または他者を傷つけるように語ることを指す。簡潔な本文訳を採りつつ、その意味の広さを脚注で示した。
theological_decisions:
- issue: 悪徳目録の範囲
  choice: 各悪徳を具体的に訳し、教理的な説明を本文に加えない。
  alternative: κακίαを広く「あらゆる悪」とし、καταλαλιάςを「中傷」と限定的に訳す。
  rationale: ここは倫理的勧告であり、具体的な対人悪を列挙する原文の力点を保つのが適切である。
- issue: 分詞と二節の命令との関係
  choice: 「捨て去り」として、文が二節へ続く形を保つ。
  alternative: 独立した命令として「捨て去りなさい」と訳す。
  rationale: Ἀποθέμενοιは命令形ではなく、二節の命令を修飾する分詞であるため、独立命令に変えない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。原文が二節へ続く分詞構文で終わることを、末尾の連用形と読点で保持した。ギリシア語の複数形は、不自然な「数々の」を機械的に加えず、日本語の総称名詞で表した。
