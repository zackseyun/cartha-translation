id: 1PE.4.12
reference: 1 Peter 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: ja
  text: 愛する人たちよ、あなたがたを試すために、あなたがたの間で起こっている火のような苦難[a]を、何か思いがけないことがあなたがたに起こっているかのように、驚いてはなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「火のような試練」とも訳せる。原語は文字どおりには燃えることや火を思わせ、ここでは人を試す厳しい苦難を表す。
    reason: 原語の火の比喩と、「苦難／試練」という訳語の幅を示すため。
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: 愛する人たちよ
  rationale: 複数への温かな呼びかけであり、愛を表す語とのつながりを保ちつつ、現代日本語で自然かつ品位ある表現とした。
- source_word: ξενίζεσθε
  choice: 驚いてはなりません
  rationale: ここでは、苦難を異質で予想外のものと見なして驚くことを表す。後半の ξένου は「思いがけないこと」とし、同じ意味領域の反復を文全体で示した。
- source_word: πυρώσει
  choice: 火のような苦難
  rationale: 原語が喚起する焼却・火の比喩を明示しながら、文脈上、それが共同体に降りかかる厳しい苦難を指すことが分かるようにした。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: 共同体への複数形の呼びかけと苦難の文脈から、集団のただ中で起こるという意味を自然に表した。
- source_word: πρὸς πειρασμόν
  choice: あなたがたを試すために
  rationale: この文脈では罪への誘惑より、苦難によって真価が試されることを指す。目的を表す構文として明瞭に訳した。
- source_word: γινομένῃ
  choice: 起こっている
  rationale: 進行中の出来事を表す現在分詞の意味を、自然な現代日本語で保持した。
- source_word: ὡς ξένου
  choice: 何か思いがけないことが
  rationale: ξένος の「異質な、なじみのない、予想外の」という意味を、この文脈で自然な「思いがけない」とした。
- source_word: συμβαίνοντος
  choice: 自分たちに起こっている
  rationale: 何かが当人たちの身に生じるという意味を明示し、ὑμῖν を日本語の再帰的な表現で自然に受けた。
theological_decisions:
- issue: πειρασμός の性質
  choice: 試すこと、試練
  alternative: 罪への誘惑
  rationale: 直近の文脈は信者が受ける苦難を扱っているため、内面的に罪へ誘う誘惑ではなく、苦難を通して試されることを表すと判断した。
- issue: 火の比喩の扱い
  choice: 火のような苦難
  alternative: 精錬の火
  rationale: 原文には火・焼却のイメージがあるが、「精錬」とまで限定する語はないため、火の比喩を保ちつつ特定の神学的解釈を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、牧会的な温かさと勧告の厳粛さを両立させた。「愛する人たちよ」は呼びかけの品位を保ち、「驚いてはなりません」は過度に古風にならない禁止表現とした。
