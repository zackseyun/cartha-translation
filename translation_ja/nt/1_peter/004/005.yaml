  yaml_path: translation/nt/1_peter/004/005.yaml
  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: ja
  text: 彼らは、生きている者と死んだ者を裁く用意ができている方に、申し開きをしなければなりません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「裁く準備ができている方」。ギリシア語の表現は直訳すれば「裁く備えを持っている方」です。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: 彼らは
  rationale: 前節で述べられた人々を受ける関係代名詞。日本語では独立した文として「彼らは」とすることで、指示対象を自然に示した。
- source_word: ἀποδώσουσιν λόγον
  choice: 申し開きをすることになります
  rationale: 責任を問われて弁明し、釈明するという法廷的な含みを保つ。「ことになります」により未来の確実な帰結を明瞭に表した。
- source_word: τῷ
  choice: 方に
  rationale: 冠詞付き分詞を人格的な「方」として訳し、原文が裁く者をこの節では明示的に神またはキリストと名指ししていない点を保った。
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: 裁く備えのできている
  rationale: 「裁く用意・備えがある」という現在の態勢を自然な日本語で表し、直ちに裁ける状態にあるという語感を保った。
- source_word: ζῶντας καὶ νεκρούς
  choice: 生きている者と死んだ者
  rationale: 簡潔で包括的な対句をそのまま保ち、終末的な裁きの対象範囲を限定しなかった。
theological_decisions:
- issue: 「生きている者と死んだ者を裁く方」の同定
  choice: 本文では「方」とし、神またはキリストと明示しない
  alternative: 「神」または「キリスト」と明記する
  rationale: 原文はここで裁く者を固有に名指しせず、冠詞付き分詞で表している。新約聖書には神の裁きとキリストの裁きの双方を語る箇所があるため、この節の表現が持つ神学的緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁きの場を思わせる厳粛さを保った。「申し開き」は一般読者にも理解可能で、ἀποδώσουσιν λόγον の法廷的含意を簡潔に伝える。
