lexical_decisions:
- source_word: φιλόξενοι
  choice: もてなしなさい
  rationale: 原語は「客を親切に迎える、もてなす者である」という意味の形容詞だが、文脈上は命令として働いている。現代日本語では動詞による「もてなしなさい」が自然で、勧告の力も明確に表せる。
- source_word: εἰς ἀλλήλους
  choice: 互いに
  rationale: 共同体の成員が相互に向けて行うことを表す。「互いに」は簡潔で自然に相互性を保持する。
- source_word: ἄνευ
  choice: ～ず
  rationale: 何かを伴わないことを示す。日本語では「不平を言わず」とすることで、原語の「～なしに」を自然に表現できる。
- source_word: γογγυσμοῦ
  choice: 不平を言うこと
  rationale: 不満から出るぶつぶつとした訴えや文句を指す。「不平を言う」は、古風になりすぎず、共同生活における不満の表出という含意をよく伝える。
