reference: 1 Peter 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: ja
  text: ですから[a]、キリストが肉において[b]苦しみを受けたので、あなたがたも同じ思いで武装しなさい。肉において苦しみを受けた者は、罪から離れている[c]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ですから」は、直前の文脈を受けて導かれる結論を示す。ギリシア語の「キリスト」（Christos）は称号であり、「メシア」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「肉において」はギリシア語 sarx を字義に近く訳した表現で、ここでは身体をもつ人間としての存在を指し、「罪深い性質」を意味するとは限らない。この表現は後半でも繰り返される。
    reason: lexical_alternative
  - marker: c
    text: 「肉において苦しみを受けた者は、罪から離れている」という句の解釈には議論がある。特にキリストを指すとも、その歩みに従う信者を指すとも、苦しみによって罪との決定的な断絶が生じるという一般的原則を述べるとも考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστοῦ
  choice: キリスト
  rationale: Χριστόςの称号としての意味を保ちつつ、日本語で広く定着している「キリスト」とした。属格名詞と分詞の構文は「キリストが……苦しみを受けたのですから」と自然な理由・前提の節にした。
- source_word: οὖν
  choice: ですから
  rationale: 直前の文脈を受ける推論・帰結を、現代日本語で明瞭に示す。
- source_word: παθόντος / παθὼν
  choice: 苦しみを受けた
  rationale: 二度のアオリスト分詞を同じ表現で訳し、原文の反復と、苦しみを経験したという意味を保った。
- source_word: σαρκὶ
  choice: 肉において
  rationale: σάρξを字義に近く訳し、二度の反復も保った。ここでは罪深い性質と限定せず、身体をもつ人間としての存在を指し得る表現である。
- source_word: ἔννοιαν
  choice: 同じ思い
  rationale: 考え方、心構え、意図を含み得る語の幅を保つため、「覚悟」と狭く限定せず「思い」とした。
- source_word: ὁπλίσασθε
  choice: 武器として身に着けなさい
  rationale: 中動態命令の自己に備える意味と軍事的比喩を保ち、「同じ思い」を武器のように身に着けるという自然な日本語にした。
- source_word: ὅτι
  choice: からです
  rationale: 勧告の根拠を導く因果関係を明示した。
- source_word: ὁ παθὼν
  choice: 苦しみを受けた者
  rationale: 実体詞的分詞を一般的に読める形で訳し、指示対象をキリストまたは信者のみに限定しなかった。
- source_word: πέπαυται
  choice: 離れている
  rationale: 完了形が示す、やめた結果として現在も続く状態を表す。「罪から」と組み合わせ、分離の意味を自然な日本語で示した。
- source_word: ἁμαρτίας
  choice: 罪から
  rationale: παύωに伴う属格を分離の意味に取り、単数形を保って、個々の罪ではなく罪という領域・営みを指し得る訳とした。
theological_decisions:
- issue: 「肉において苦しみを受けた者は、罪から離れている」の指示対象と意味
  choice: キリスト、キリストに倣って苦しむ信者、または罪との決定的な断絶を述べる一般的命題のいずれとも読める形を本文で保った。
  alternative: キリストだけを指すと明示する、または信者だけを指すと明示する。
  rationale: ギリシア語は圧縮された表現で、指示対象と神学的な射程には議論がある。本文に説明語を加えて一つの解釈に固定せず、脚注で主要な可能性を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告の厳粛さと「武装する」という原文の強い比喩を保った。「肉において」は日常語としてやや硬いが、原文の反復と意味の幅を保持するため採用し、脚注で説明した。
