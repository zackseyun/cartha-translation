  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: ja
  text: というのも、あなたがたのうち、殺人者、盗人、悪を行う者、あるいは他人のことに口出しする者として苦しむ人がいてはなりません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「他人のことに干渉する者」。直訳的には「他人のことを監督する者」。自分に属さない事柄に立ち入る人を指すと理解されます。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ τις ὑμῶν πασχέτω
  choice: あなたがたのうち……として苦しむ人がいてはなりません
  rationale: 否定を伴う三人称現在命令形の禁止を、自然で明確な現代日本語にした。γάρの説明的なつながりは日本語では文脈上明らかなため、機械的な「というのは」を置かなかった。πάσχωは刑罰に限定せず「苦しむ」とした。
- source_word: ὡς φονεύς
  choice: 殺人者として
  rationale: φονεύςは一般的な「人を殺す者」よりも、非道な殺害を行う「殺人者」を指す。ὡςは苦しみを受ける立場・理由を示す「として」で表した。
- source_word: κλέπτης
  choice: 盗人
  rationale: 他人の物を盗む者を表す標準的な語義を保ち、強盗という限定的な意味を加えなかった。
- source_word: κακοποιός
  choice: 悪を行う者
  rationale: 犯罪者に狭めず、悪事を行う者という語の広い道徳的意味を保持した。
- source_word: ἀλλοτριεπίσκοπος
  choice: 他人の事に口出しする者
  rationale: まれな複合語であり、文字どおりには他人の事を監督する者を思わせるが、ここでは自分に属さない事柄への不当な干渉を表す。現代日本語で自然に伝わる表現を選び、脚注で語義の幅を示した。
theological_decisions:
- issue: ἀλλοτριεπίσκοποςの意味
  choice: 他人の事に口出しする者
  alternative: 他人の事に干渉する者／他人の事を監督する者
  rationale: この語は新約聖書でここだけに現れ、解釈に幅がある。文脈上は責められるべき行為の列挙なので、不当な介入という否定的意味を本文で明確にした一方、「監督者」という教会職の含意は持ち込まなかった。
translation_notes:
  register: 明確で格調を保った現代標準日本語。「盗人」は簡潔で広く理解される語として採用し、「悪を行う者」は原語の広さを保った。難語ἀλλοτριεπίσκοποςは本文を自然にしつつ、脚注で直訳と代案を示した。
