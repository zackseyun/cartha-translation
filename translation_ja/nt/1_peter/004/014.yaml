id: 1PE.4.14
reference: 1 Peter 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: ja
  text: メシア[a]の名のゆえに侮辱されるなら、あなたがたは幸いです。栄光の霊、また神の霊が、あなたがたの上にとどまっておられるからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「キリスト」。ここでは称号としての意味を表すため「メシア」とした。
    reason: lexical_alternative
  - marker: b
    text: 別訳「栄光に満ちた神の霊」。または「栄光の霊、すなわち神の霊」。
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: 侮辱される
  rationale: 現在受動形が表す、言葉による非難や辱めを受けることを、自然な現代日本語で表した。
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: メシアの名のゆえに
  rationale: ἐν ὀνόματι がここではメシアの名・身分との結びつき、およびそれを理由とする苦難を示すため、「名」を残しつつ因果関係が伝わる表現とした。
- source_word: Χριστοῦ
  choice: メシア
  rationale: Χριστός の称号としての働きを明示し、「油を注がれた者」という背景を保つ。日本語で一般的な「キリスト」は脚注に示した。
- source_word: μακάριοι
  choice: 幸いです
  rationale: 単なる主観的な幸福感ではなく、神の前で祝福された状態を表す聖書的な宣言として自然な表現を選んだ。
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: 栄光の、そして神の霊
  rationale: 二つの属格を一つの「霊」が受ける圧縮された構文を、解釈で一義化せず可能な限り見える形にした。
- source_word: ἀναπαύεται
  choice: 上にとどまっておられる
  rationale: 「休む、留まる」を意味する動詞と ἐπί の組み合わせを表し、霊が人の上に留まるという聖書的響きを保った。敬語は神の霊への自然な敬意を示す。
theological_decisions:
- issue: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα の解釈
  choice: 「栄光の、そして神の霊」とし、二つの属格が単数の「霊」にかかる構造を保つ。
  alternative: 「神の栄光に満ちた霊」または「栄光の霊、すなわち神の霊」
  rationale: 原文は「栄光」と「神」を並列的な限定と見ることも、後者を前者の説明と見ることもできる。本文ではその緊張を解消せず、脚注で自然な別訳を示した。
- issue: Χριστός を称号として訳すか
  choice: 「メシア」と訳す。
  alternative: 「キリスト」
  rationale: この箇所では「名」と結びつき、イエスの称号・身分が前景化しているため、称号の意味が伝わる「メシア」を本文に採用した。
translation_notes:
  register: 明快で格調のある現代標準日本語。「あなたがた」を用いて複数形を明示し、「幸いです」で祝福宣言の響きを保った。原文の圧縮された霊についての表現は、多少の非日常性を残して神学的曖昧さを保持した。
