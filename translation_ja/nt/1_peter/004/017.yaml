id: 1PE.4.17
reference: 1 Peter 4:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: ja
  text: 神の家[a]から裁きが始まる時が来ているからです。そして、まず私たちから始まるのなら、神の福音に従わない人たち[b]の行く末[c]は、いったいどうなるのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の家族」とも訳せる。ギリシア語のοἶκοςは「家」と「家に属する者たち」の両方を意味し得る。ここでは、続く「私たち」が示すように、神の民を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「従わない」は、「信じることを拒む」とも訳せる。このギリシア語は、福音に応答しないことについて、不従順と不信の両方を含み得る。
    reason: lexical_alternative
  - marker: c
    text: 「行く末」は、「終わり」または「結果」とも訳せる。ギリシア語のτέλοςには、終わり、帰結、最終的な結果という意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 前節までの勧めの理由を示す接続語として、因果関係が自然に伝わる文末表現とした。
- source_word: ὁ καιρός
  choice: 時が来ている
  rationale: 単なる時間ではなく、ふさわしい時、定められた時が到来しているという含みを自然な日本語で表した。
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: 裁きが始まる
  rationale: 関節付き不定詞の内容を日本語の節として表し、κρίμαは断罪や懲らしめに限定せず「裁き」とした。
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: 神の家から
  rationale: ἀπόを「から」で保ち、οἶκοςが建物としての家と家に属する共同体の双方を表し得る余地を残した。直後の「私たち」が、ここでは神の民を指すことを明らかにする。
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: そして、まず私たちから始まるのなら
  rationale: 前文から動詞「始まる」を補って日本語として明確にし、繰り返されるἀπόを「から」で保持した。δέは軽い接続として「そして」とした。
- source_word: ἀπειθούντων
  choice: 従わない人たち
  rationale: 福音に対する不従順を表すと同時に、信じることを拒む含みも持つ語であるため、基本義を保つ表現とした。
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: 神の福音に
  rationale: 与格を「に」で表し、福音への応答という関係を明示した。属格は、神に属し神から来る福音を簡潔に示す「神の福音」とした。
- source_word: τέλος
  choice: 行く末
  rationale: 時間的な終止だけに狭めず、最終的な結果や帰結を含む自然な日本語とした。
theological_decisions:
- issue: 神の民に対するκρίμαの性質
  choice: 「裁き」と訳し、断罪とも懲らしめとも限定しない。
  alternative: 「断罪」または「懲らしめ」
  rationale: 本文は神の家から始まる厳粛な裁きと、福音に従わない者の行く末を対比している。「断罪」では信者に対する意味を狭めすぎ、「懲らしめ」では司法的な厳しさを弱めるため、緊張を保つ「裁き」が適切である。
- issue: 「神の家」の指示対象
  choice: 本文では「神の家」とし、文脈上は神の民を指すものとして脚注で説明する。
  alternative: 「神の家族」または神殿という建物
  rationale: οἶκος自体の語義的な幅を残しつつ、直後の「私たち」によって共同体としての神の民が意図されていることを伝えられる。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文にふさわしい落ち着きと厳粛さを保った。「いったいどうなるのでしょうか」により原文の修辞疑問の切迫感を自然に表現した。
