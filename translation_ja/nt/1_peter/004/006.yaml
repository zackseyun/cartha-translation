revisions:
- from: このため、死者にも福音が告げ知らされたのです。それは、肉において、人間に従って裁かれても[a]、霊において[b]、神に従って生きるためでした。
  to: このため、死者にも福音が告げ知らされたのです。それは、彼らが肉において人の基準では裁かれても[a]、霊において[b]神の基準では生きるためです。
  rationale: 「人間に従って／神に従って」を、現代日本語で意味のぶれが少ない「人の基準では／神の基準では」に改めた。これにより、κατάの並行的な基準・観点の用法を保ちつつ、人間または神が裁きの行為者であること、あるいは人間・神に従順であることを本文で決めつけない。「死者」の同定、裁きの具体的内容、肉／霊およびπνεύματιの詳細な指示対象は引き続き限定していない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T02:42:46Z'
