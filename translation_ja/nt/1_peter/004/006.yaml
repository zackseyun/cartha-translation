id: 1PE.4.6
reference: 1 Peter 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: ja
  text: このため、死者にも福音が告げ知らされたのです。それは、彼らが肉において人の基準では裁かれても[a]、霊において[b]神の基準では生きるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「人の目から見て」。ギリシア語は「人に従って」と「神に従って」を対照させており、ここでは人の基準または観点を表す。
    reason: lexical_alternative
  - marker: b
    text: または「霊にあって」。肉における生と対照される霊的な生の領域を指すと考えられるが、「御霊によって」と理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: このため
  rationale: 前の議論を受けて理由または目的を示す表現として、簡潔で自然な日本語にした。目的の含みは後続のἵνα節にも保たれている。
- source_word: νεκροῖς
  choice: 死者にも
  rationale: 形容詞の名詞的用法をそのまま簡潔に表現し、誰を指すかについて解釈を加えない。「にも」によりκαίの付加的な意味も示した。
- source_word: εὐηγγελίσθη
  choice: 福音が告げ知らされた
  rationale: εὐαγγελίζωの受動態。日本語では内容を「福音」と明示するのが自然であり、宣教の意味を保ちながら過度に教会用語的な表現を避けた。
- source_word: ἵνα
  choice: それは、…ためでした
  rationale: 目的を示す接続詞として訳し、二つの接続法を一つの目的構文の中に収めた。
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: 裁かれても…生きる
  rationale: μέν…δέの対照を、日本語で自然な譲歩構文「…ても…」によって表した。受動の「裁かれる」と目的としての「生きる」は維持した。
- source_word: κατὰ ἀνθρώπους
  choice: 人間に従って
  rationale: κατάが示す基準・観点を保ち、κατὰ θεόνとの意図的な並行と対照が見える訳にした。「人間」は性別を限定せず、代表的な複数形ἀνθρώπουςに対応する。
- source_word: σαρκὶ
  choice: 肉において
  rationale: πνεύματιとの対照を保つため「肉」と訳した。ここで「罪深い性質」などの解釈を持ち込まず、身体的・人間的存在の領域を示し得る表現とした。
- source_word: κατὰ θεὸν
  choice: 神に従って
  rationale: κατὰ ἀνθρώπουςと同じ構文で訳し、神の基準・観点という意味を特定しすぎずに対照を保った。
- source_word: πνεύματι
  choice: 霊において
  rationale: σαρκίと並行する領域の与格として訳した。本文だけでは聖霊を明示しているとは断定できないため、「霊」とした。
theological_decisions:
- issue: 「死者」の同定
  choice: 単に「死者」と訳し、福音が告げられた時点で肉体的に死んでいた者か、今は死んでいる者か、霊的な意味で死んでいた者かを特定しない。
  alternative: 生前に福音を聞いて今は死んでいる人々、霊的に死んでいる人々、または3章19節と結び付く死者と明示する。
  rationale: νεκροῖς自体はこれらの解釈を決定しないため、原文の曖昧さを保持した。
- issue: 「肉において裁かれる」と「霊において生きる」の意味
  choice: 肉／霊、人間／神という二重の対照をそのまま保ち、裁きの主体や具体的内容を限定しない。
  alternative: 人間による断罪、すべての人に及ぶ肉体の死、または神による裁きのいずれかに特定する。
  rationale: 原文は裁きの主体を明記せず、複数の近接した解釈が可能であるため、神学的緊張を訳文で解消しない。
- issue: πνεύματιが人の霊か聖霊か
  choice: 本文では「霊において」とし、領域・あり方として読む余地を残す。
  alternative: 「御霊によって」と訳し、聖霊の働きを明示する。
  rationale: 無冠詞のπνεύματιは文脈上σαρκίと対応しており、聖霊を指す可能性を排除はできないものの、本文で断定するには不十分である。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「肉」「霊」「人間に従って」「神に従って」という原文の対称構造を保った。「告げ知らされたのです」「ためでした」によって説明の流れを自然にし、荘重さを損なわない文体とした。
