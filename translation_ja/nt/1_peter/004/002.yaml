reference: 1 Peter 4:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: ja
  text: それは、肉体をもって生きる残りの時を[a]、もはや人間の欲望に従ってではなく、神の御心に従って生きるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「肉にあって残りの時を」。ここでの「肉」は、必ずしも「罪深い性質」ではなく、身体をもつ地上の生を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὸ ... βιῶσαι
  choice: それは……生きるためです
  rationale: 冠詞付き不定詞を、前節との目的・結果のつながりが分かる自然な日本語で表した。
- source_word: μηκέτι
  choice: もはや……ではなく
  rationale: 以前の生き方が終わったことを示す語の力を保ち、後続の対比にも自然につなげた。
- source_word: ἀνθρώπων ἐπιθυμίαις
  choice: 人間の欲望に従って
  rationale: ἀνθρώπωνは性別を限定しない一般的な『人間の』とし、ἐπιθυμίαιは性的意味に狭めず、文脈上否定的な『欲望』とした。与格は生き方を方向づける基準として『に従って』で表した。
- source_word: ἀλλὰ θελήματι θεοῦ
  choice: 神のみこころに従って
  rationale: 二つの与格句の強い対比を同じ構文で示した。θέλημαは神の意志・望みを表すため、現代日本語でも理解される『みこころ』を用いた。
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: 残されている時を
  rationale: 地上の生涯のうち今後に残る期間を指すことを、簡潔で自然な表現にした。
- source_word: ἐν σαρκὶ
  choice: 肉にあって
  rationale: σάρξを解釈的に『罪深い性質』とせず、身体をもって営む地上の生を指す原文の表現を保った。意味の誤解を避けるため脚注を付した。
theological_decisions:
- issue: ἐν σαρκὶにおけるσάρξの意味
  choice: 身体をもつ地上の生（『肉にあって』）
  alternative: 罪深い性質の中で
  rationale: この句は残された生涯の時間を限定しており、内的な罪の原理よりも、死すべき身体をもつ現世の生を指す。直訳的表現を本文に残し、意味を脚注で明確にした。
- issue: 人間の欲望と神のみこころの対比
  choice: 両者を『に従って』で並列する
  alternative: 欲望のため／神のみこころのために生きる
  rationale: 原文の二つの与格が示す、生き方を方向づける基準の対比を明確にしつつ、欲望や神のみこころを目的物として過度に実体化しない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。『肉にあって』は原語の重要な表現を保持し、『に従って』の反復によって対比を分かりやすくした。
