id: 1PE.4.19
reference: 1 Peter 4:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: ja
  text: ですから、神のみこころに従って苦しみを受ける人々も、善を行いつつ、信頼できる創造主に自分のたましい[a]を委ねなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いのち」または「自分自身」とも訳せる。ギリシア語は、たましい、いのち、またはその人自身を指しうる。
    reason: ψυχήの意味範囲を示し、本文だけで一つの人間観に狭めないため。
lexical_decisions:
- source_word: ὥστε
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す推論的な接続語として、現代日本語で自然に論理関係を伝える。
- source_word: οἱ πάσχοντες
  choice: 苦しみを受ける人々
  rationale: 現在分詞の名詞的用法を、継続的または特徴的に苦しむ人々を指す自然な日本語で表した。
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: 神のみこころに従って
  rationale: κατάの一致・規準の意味を保ちつつ、その苦しみが神の許容・定め・是認のいずれによるかを訳文で限定しない。
- source_word: πιστῷ κτίστῃ
  choice: 真実な創造者に
  rationale: πιστόςが示す誠実さと信頼に値する性質を「真実な」で表し、κτίστηςは神を創造者として明示する「創造者」とした。無冠詞であることから、日本語では文脈上自然な形にした。
- source_word: παρατιθέσθωσαν
  choice: 委ねなさい
  rationale: 他者の保護と管理に託すという中動態命令の意味を、簡潔で自然な勧告・命令として表した。
- source_word: τὰς ψυχὰς αὐτῶν
  choice: 自分のたましい
  rationale: ψυχήの伝統的・神学的な響きを保つ一方、「いのち」「自分自身」という広い意味の可能性は脚注に示した。
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: 善を行いつつ
  rationale: 委ねることに伴う継続的な善行を表す句として、ἐνの随伴・様態的な働きを自然な日本語にした。
theological_decisions:
- issue: 苦しみと神のみこころの関係
  choice: 神のみこころに従って苦しみを受ける
  alternative: 神のみこころによって苦しみを受ける
  rationale: 原文は苦しみが神のみこころに沿うことを述べるが、神の許容、定め、是認の具体的関係までは説明していない。「に従って」により、その神学的緊張を解消せずに残した。
- issue: ψυχήの意味範囲
  choice: たましい
  alternative: いのち／自分自身
  rationale: 本文では語の伝統的な対応と神学的な響きを保ち、文脈上可能な全人格的意味は脚注で明示した。
- issue: πιστόςの神への適用
  choice: 真実な創造者
  alternative: 信頼できる創造者
  rationale: 神が信頼に値するという実質を含みつつ、単なる主観的評価ではなく、神ご自身の誠実さを表す訳語を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「みこころ」「たましい」は聖書文体として広く理解される語だが、古語的な構文は避けた。「善を行いつつ」によって、苦難の中でも善行を続けながら神に委ねるという文の流れを簡潔に示した。
