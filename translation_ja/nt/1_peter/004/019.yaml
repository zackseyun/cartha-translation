  terminology: 「神のみこころ」「たましい」は一貫した聖書的用語として許容できる。ψυχήの広い意味は脚注で適切に保持されている。「信頼できる創造主」はπιστόςの信頼に値するという意味を明確にし、教派的な含意を加えない。
