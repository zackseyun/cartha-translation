  rationale: 本文は基本的に原文に忠実であり、改訂はπιστῷ κτίστῃの訳語に限定した。「信頼できる」は、神に自らを委ねるという文脈におけるπιστόςの信頼性・誠実さを自然な現代日本語で表す。「創造主」は神を指す語として明瞭である。苦しみと神のみこころの関係、およびψυχήの意味上の幅は、原文以上に限定せず維持した。
