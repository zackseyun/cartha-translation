source:
  edition: SBLGNT
  text: ἐν ᾧ ξενίζονται μὴ συντρεχόντων ὑμῶν εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν, βλασφημοῦντες·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: ja
  text: そのことで彼らは、あなたがたが彼らと一緒に同じ放蕩の奔流[c]へ走って行かないのを不思議に思い[a]、あなたがたを悪く言います[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「意外に思い」または「奇異に感じ」。
    reason: lexical_alternative
  - marker: b
    text: 「悪く言います」は、「ののしります」または「中傷します」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳「同じ放蕩のあふれ（または、流れ出し）へ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: そのことで
  rationale: 直前に述べられた生き方の変化を受ける関係表現。日本語では因果的含意を持つ「そのことで」が自然であり、文脈との結び付きを明確にする。
- source_word: ξενίζονται
  choice: 不思議に思い
  rationale: 「異様に感じる、意外に思う」という意味を、過度に強めず現代日本語で自然に表す。
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: あなたがたが……一緒に走って行かないのを
  rationale: 属格絶対構文を自然な従属節にしつつ、συντρέχω の「共に走る」という比喩を保持する。
- source_word: εἰς τὴν αὐτὴν τῆς ἀσωτίας ἀνάχυσιν
  choice: 同じ放蕩の奔流へ
  rationale: ἀνάχυσις の「流れ出すこと、あふれ」を「奔流」として生き生きと保ち、ἀσωτία の浪費的で節度のない生活を「放蕩」で簡潔に示す。
- source_word: βλασφημοῦντες
  choice: あなたがたを悪く言います
  rationale: ここでは神への冒瀆より、信者に向けられた中傷・罵言が文脈に適する。分詞の付帯的関係を保ちながら、日本語として明瞭な述語にする。
theological_decisions:
- issue: βλασφημοῦντες が指す敵対的発言の対象と性質
  choice: 信者を悪く言うこと
  alternative: 神を冒瀆すること、または対象を特定しない悪口
  rationale: 直前の「あなたがた」に対する周囲の反応が主題であり、対人的な中傷・罵言と取るのが最も自然。ただし「中傷」と限定しすぎず「悪く言う」として意味幅を残す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、原文の走行と奔流の比喩を保持した。「放蕩」はやや文語的だが、ἀσωτία の浪費的・無節制な生活を簡潔かつ品位を保って伝える語として採用した。
