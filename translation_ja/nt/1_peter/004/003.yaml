  source_fidelity: 冒頭の「その時」はὁ παρεληλυθὼς χρόνος（これまでに過ぎ去った時）をやや不自然かつ曖昧に指す。「その中を歩んできた」も、列挙された行為・実践に対するπεπορευμένουςの倫理的比喩としては日本語が不自然である。改訂では、過去の時が異邦人の意向を実行するにはすでに十分であったこと、また列挙された行為にふけって生きてきたことを明瞭にした。
  naturalness: 「これまで、…の中を歩んできた、その時はもう十分」という構文は係り受けが重く、現代標準日本語として不自然である。「これまでの時は、…行ってきたのでもう十分です」とし、悪徳表には「にふけって歩んできた」を用いると自然である。
  terminology: 「異邦人」は文脈上のἐθνῶνに適切である。「放縦」「情欲」「偶像礼拝」も妥当である。οἰνοφλυγίαιςは単なる酩酊状態である「泥酔」より、過度の飲酒行為を表す「度を越した酒飲み」とするほうが適切である。κῶμοιςとπότοιςは「宴会騒ぎ」「酒宴」として区別した。ἀθεμίτοιςは「許されない」で保持し、脚注の代案も原語の意味幅を適切に示す。
