id: 1PE.4.3
reference: 1 Peter 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: ja
  text: 'というのも、あなたがたがこれまで、放縦な行い、情欲、度を越した酒飲み、宴会騒ぎ、酒宴、そして許されない偶像礼拝[a]にふけって歩み、異邦人たちの望むことを行ってきた時は、もう十分だからです。


    [a] 「許されない」は、「不法な」または「禁じられた」とも訳せる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「許されない」は、「不法な」または「禁じられた」とも訳せる。
    reason: ἀθέμιτοςが持つ、規範に反する、許容されない、禁じられたという意味の幅を示すため。
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: その時はもう十分だからです
  rationale: 過ぎ去った時間がすでに十分であるという意味と、γάρの説明的なつながりを、自然な日本語で表した。
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: 異邦人たちの望むこと
  rationale: βούλημαの意志・願望の意味を保ち、ἐθνῶνはこの文脈で非ユダヤ人社会を指すため、聖書日本語として定着した「異邦人」とした。
- source_word: κατειργάσθαι
  choice: 行い
  rationale: 実行し、成し遂げてきたという意味を簡潔に表す。文全体の「これまで」「歩んできた」によって、完了した過去の営みという側面も示した。
- source_word: πεπορευμένους
  choice: その中を歩んできた
  rationale: 倫理的な生き方を表す「歩む」という原文の比喩を保持した。
- source_word: ἀσελγείαις
  choice: 放縦
  rationale: 性的な乱れを含み得る、恥知らずで節度のない行為全般を表せる語を選んだ。
- source_word: ἐπιθυμίαις
  choice: 情欲
  rationale: 悪徳表の文脈における、秩序を失った強い欲望を表した。
- source_word: οἰνοφλυγίαις
  choice: 泥酔
  rationale: 過度の飲酒と酩酊を、現代日本語で明瞭に表した。
- source_word: κώμοις
  choice: 浮かれ騒ぎ
  rationale: 酒や逸脱を伴う騒々しい宴楽という意味を、一般読者に分かりやすく表した。
- source_word: πότοις
  choice: 酒盛り
  rationale: 飲酒を目的とする集まりや飲み騒ぎを指す語として、「浮かれ騒ぎ」との区別も保った。
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: 許されない偶像礼拝
  rationale: 神的・道徳的規範に反し、許容されないというἀθέμιτοςの力を表し、単なる感情的嫌悪に狭めなかった。
theological_decisions:
- issue: ἐθνῶνの指示対象
  choice: 異邦人たち
  alternative: 諸国民／異教徒たち
  rationale: ここでは地政学的な諸国民ではなく、読者の以前の生活を特徴づける非ユダヤ人社会を指す。「異教徒」は宗教的評価を前面に出しすぎるため避けた。
- issue: ἀθεμίτοις εἰδωλολατρίαιςの道徳的な力
  choice: 許されない偶像礼拝
  alternative: 不法な偶像礼拝／忌まわしい偶像礼拝
  rationale: 原語は規範に反して許されないことを示す。「忌まわしい」のように感情的な嫌悪へ限定せず、客観的な違反の意味を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「歩む」という聖書的な倫理の比喩は保持しつつ、「浮かれ騒ぎ」「酒盛り」によって悪徳表の各項目を一般読者にも区別しやすくした。ギリシア語の複数形は、日本語では数を明示しなくても反復的・類型的な行為を自然に含むため、無理に複数標識を加えていない。
