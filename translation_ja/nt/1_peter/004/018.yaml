id: 1PE.4.18
reference: 1 Peter 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: ja
  text: また、正しい人がかろうじて救われるのなら[a]、神を敬わない者と罪人は、どこに現れるのだろうか[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「困難のうちに救われる」または「救われるのがやっとである」とも訳せる。ここでは、苦難と裁きという文脈の中で救いに伴う困難さが強調されていると理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「どこに見いだされるのだろうか」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: δίκαιος
  choice: 正しい人
  rationale: 冠詞を伴う単数の形容詞が名詞的に用いられており、代表的な単数として自然な現代日本語にした。「義人」も可能だが、一般読者には「正しい人」のほうが明瞭である。
- source_word: μόλις
  choice: かろうじて
  rationale: 困難さ、または危ういほどの狭さを表す語であり、その緊張を解消せず簡潔に保持する。文脈上、苦難や裁きを通って救われる困難さを含み得るが、本文では解釈を付け加えない。
- source_word: σῴζεται
  choice: 救われる
  rationale: 現在形の受動または中動形。格言的な文脈では「救われる」が自然であり、進行の意味を明示的に加えない。
- source_word: ἀσεβής
  choice: 神を敬わない者
  rationale: 神への畏敬を欠くという宗教的・倫理的意味を、現代の一般読者に分かる表現で示す。
- source_word: ἁμαρτωλός
  choice: 罪人
  rationale: 一般的で正確な訳語。「神を敬わない者」と一つにまとめず、原文の並列を保つ。
- source_word: ποῦ
  choice: どこに
  rationale: 場所を問う疑問副詞を直接訳し、修辞疑問の形を保つ。
- source_word: φανεῖται
  choice: 現れる
  rationale: φαίνωの未来中動形が持つ「現れる」の意味を直接示し、箴言11章31節の七十人訳を思わせる表現と修辞的な曖昧さを保つ。
theological_decisions:
- issue: μόλις σῴζεται が示す救いの困難さ
  choice: 「かろうじて救われる」とし、原文の緊張を保持する。
  alternative: 「困難を経て救われる」「救われるのも難しい」と説明的に訳す。
  rationale: 直前の文脈は苦難と神の裁きを扱っているため、救いに伴う厳しい過程を指し得る。しかし、最終的な救いが不確実だとも、単に苦難を通過することだけだとも本文中で断定せず、原文の幅を残す。
- issue: 単数男性形の代表的用法
  choice: 「正しい人」という代表的単数で訳す。
  alternative: 「正しい人々」「義人」。
  rationale: 原文の単数形と格言的な簡潔さを保ちつつ、日本語として自然で性別を不必要に限定しない表現にする。
- issue: ἀσεβής と ἁμαρτωλός の区別
  choice: 「神を敬わない者と罪人」と二つの呼称を並列する。
  alternative: 両者をまとめて「神に背く罪人」とする。
  rationale: 原文は二つの語を καί で結んでおり、神への不敬と罪ある者という重なりつつ異なる表現を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格言的で厳粛な修辞疑問を保った。「不敬虔な者」のような専門的・古風な語を避けて「神を敬わない者」とした。脚注記号は、それぞれ対応する語句の直後に置いた。
