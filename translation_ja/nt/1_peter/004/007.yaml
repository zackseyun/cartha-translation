id: 1PE.4.7
reference: 1 Peter 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: ja
  text: しかし、万物の終わりが近づいています。[a] ですから、祈るために、分別を保ち、冷静でいなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「近い」。ギリシア語の完了形は、近づいた結果として今や近い状態にあることを表し得ます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「健全な判断力を持ち、目を覚ましていなさい」。二つの命令は、明晰な判断と霊的な目覚めを強調しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: 万物の
  rationale: 中性複数属格を「すべてのもの」の意味に取り、τὸ τέλοςと結びつく終末論的な表現を、簡潔で自然な日本語にした。
- source_word: δὲ
  choice: しかし
  rationale: 前の文脈からの緩やかな転換を示しつつ、この宣言の切迫感を保つ。
- source_word: τὸ τέλος
  choice: 終わり
  rationale: この文脈では「結果」や「目的」より、終末論的な「終わり」が最も直接的である。
- source_word: ἤγγικεν
  choice: 近づいています
  rationale: 完了形が表す、近づいた結果として今や近い状態にあるという含みを、日本語で自然に表した。別訳「近い」も脚注に示した。
- source_word: σωφρονήσατε
  choice: 分別を保ち
  rationale: 健全な判断と節度ある思考を求める命令として訳し、単なる感情抑制に狭めなかった。
- source_word: οὖν
  choice: ですから
  rationale: 万物の終わりが近いという宣言から、続く勧告が導かれる論理関係を明示した。
- source_word: νήψατε
  choice: 冷静でいなさい
  rationale: 新約での比喩的用法に即し、酒を断つことに限定せず、祈りに必要な精神的覚醒と明晰さを表した。
- source_word: εἰς προσευχάς
  choice: 祈るために
  rationale: εἰςの目的の意味を明確にした。複数形は繰り返される祈りを含み得るが、日本語では動詞句にするほうが自然である。
theological_decisions:
- issue: 「万物の終わり」の終末論的意味
  choice: 将来の終末を率直に告げる表現として保持し、時期や終末の体系は特定しない。
  alternative: 「万物の目的」など、終末性を弱めた意味に取る。
  rationale: 本文は万物の終わりが近いことを倫理的勧告の根拠としており、その緊迫感を保つ一方、特定の終末論的立場を持ち込まない。
- issue: 祈りと二つの命令の関係
  choice: 「分別を保つこと」と「冷静でいること」の双方を、祈るために必要な姿勢として訳す。
  alternative: εἰς προσευχάςを直前の「冷静でいること」だけに結びつける。
  rationale: 語順上の近接はあるものの、二つの並列命令全体が祈りを目的とすると読むのが自然であり、日本語でもそのつながりを保った。
translation_notes:
  register: 明瞭な現代標準語を用い、終末の切迫感と勧告の厳粛さを保った。「分別」「冷静」は日常的に理解できる語でありながら、祈りに向かう思考の健全さと覚醒を品位ある調子で伝える。
