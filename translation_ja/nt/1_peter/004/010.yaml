id: 1PE.4.10
reference: 1 Peter 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: ja
  text: それぞれ、受けた賜物に応じて、それを用いて互いに[a]仕えなさい。神のさまざまな恵みの良い管理者として。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちの間で」とも、「互いのために」「互いに対して」とも訳せる。
    reason: εἰς ἑαυτούςは、共同体内部を奉仕の範囲または受益者として示し得るため。
lexical_decisions:
- source_word: ἕκαστος
  choice: それぞれ
  rationale: 共同体の一人一人を個別に指す分配的な表現を、自然な現代日本語で表す。
- source_word: καθὼς ἔλαβεν χάρισμα
  choice: 賜物を受けたのですから
  rationale: καθὼςによる受領と奉仕の対応を、日本語の勧告として自然な理由・前提の形で示す。ἔλαβενは受領の事実を保ち、与え主を動詞に補わない。
- source_word: χάρισμα
  choice: 賜物
  rationale: 恵みによって与えられたものを指すが、原語だけでは『霊の賜物』という狭い専門的意味に限定されない。文脈に適した定着語を用いる。
- source_word: εἰς ἑαυτοὺς
  choice: 互いに
  rationale: 複数の再帰代名詞が示す共同体内部の受益者・方向を、簡潔で自然な日本語で表す。前置詞の幅は脚注に残す。
- source_word: αὐτὸ διακονοῦντες
  choice: その賜物を互いに仕えるために用いなさい
  rationale: 直訳的な『それを仕えなさい』を避け、分詞の勧告的な力と、賜物を奉仕に役立てる意味を明瞭に表す。
- source_word: καλοὶ οἰκονόμοι
  choice: 良い管理者
  rationale: 他者から託されたものを管理する責任を示す。『忠実な』は文脈上含意され得るが、καλοί以上に限定するため採らない。
- source_word: ποικίλης χάριτος θεοῦ
  choice: 神のさまざまな恵み
  rationale: ποικίληςが示す多様な現れを『さまざまな』で表し、属格を自然な所有表現にする。
theological_decisions:
- issue: χάρισμαを『霊の賜物』と限定するか
  choice: 賜物
  alternative: 霊の賜物／恵みの賜物
  rationale: 教会内の奉仕という文脈はあるが、名詞そのものは技術的に限定された意味を必須としないため、原語の幅を保つ。
- issue: εἰς ἑαυτούςの共同体的な方向性
  choice: 互いに
  alternative: 自分たちの間で／互いのために／互いに対して
  rationale: 共同体の構成員が互いに奉仕の受益者となる意味を自然に示す一方、εἰςの関係を一つに固定しすぎないよう脚注で代案を示す。
- issue: 分詞διακονοῦντεςの勧告的効力
  choice: 用いなさい
  alternative: 仕えつつ／奉仕しなさい
  rationale: 周辺文脈の勧告として理解し、日本語で独立した命令として明確にする。ただし奉仕の内容は『互いに仕える』として保持する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。『賜物』は聖書語として定着しているため保持し、『管理者』に『託された』を添えてοἰκονόμοςの受託責任を日常の読者にも分かるようにした。脚注標識は本文末の該当文に置いた。
