  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: ja
  text: 何よりも、互いに対するひたむきな愛を保ちなさい。愛は多くの罪を覆うからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この表現は箴言10章12節を思わせます。「覆う」は、過ちを蒸し返さないという意味にも理解できます。
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: πρὸ πάντων
  choice: 何よりもまず
  rationale: 時間的な先行よりも優先性を示す慣用表現として、勧告の強さを自然な日本語で表した。
- source_word: τὴν εἰς ἑαυτοὺς ἀγάπην
  choice: 互いに対する愛
  rationale: 共同体内部での相互的な愛を明確にしつつ、原文の方向性を保った。
- source_word: ἐκτενῆ ἔχοντες
  choice: 熱心に保ちなさい
  rationale: ἐκτενήςの強さ・持続性と、文脈上勧告として働く現在分詞ἔχοντεςを、自然な命令表現にした。
- source_word: ὅτι
  choice: からです
  rationale: 先の勧告の理由を導く因果関係を明示した。
- source_word: καλύπτει
  choice: 覆う
  rationale: 箴言10章12節を思わせる比喩を保持し、『見過ごす』『赦す』など一つの解釈に限定しなかった。
- source_word: πλῆθος ἁμαρτιῶν
  choice: 多くの罪
  rationale: 集合的な多数を、現代日本語として簡潔かつ自然に表した。
theological_decisions:
- issue: 「愛は多くの罪を覆う」の意味
  choice: 「覆う」という比喩をそのまま保持する
  alternative: 愛は多くの過ちを見過ごす／愛によって多くの罪が赦される
  rationale: 原文は、誰の罪をどのような意味で覆うかを明示していない。比喩を保持することで、功績による赦し、単なる隠蔽、心理的な黙認などに解釈を固定することを避けた。
translation_notes:
  register: 明瞭で現代的かつ品位ある勧告調とした。前節から続く分詞構文は、日本語で独立して読めるよう命令形にした。「熱心に」は愛の強さだけでなく、たゆまず保つ含みも持たせている。
