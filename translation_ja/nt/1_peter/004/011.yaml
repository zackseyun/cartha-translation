id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: ja
  text: 語る人がいるなら、神のことばにふさわしく語りなさい[a]。仕える人がいるなら、神が与えてくださる力によって仕えなさい[b]。それは、すべてのことにおいて、イエス・メシアを通して神が栄光をお受けになるためです。栄光と支配は、世々限りなく、この方のものです[c][d]。アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の託宣を語る者として」とも訳せる。λόγια は、神による厳かな発言やお告げを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「神が与えてくださる力から出るものとして」。ここでは、奉仕する力の源が神であることが強調されている。
    reason: lexical_alternative
  - marker: c
    text: 「この方」は文法上、最も近い「イエス・メシア」を指すのが自然である。ただし、直前に神が栄光をお受けになるとあるため、この頌栄を父なる神に向けたものと理解することもできる。
    reason: alternative_reading
  - marker: d
    text: 直訳は「世々の世に至るまで」。終わりのない永続を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: 語る
  rationale: 一般条件文の現在形を自然に表し、公の説教だけに意味を限定しない。
- source_word: λόγια θεοῦ
  choice: 神の語られたことば
  rationale: λόγια が普通の言葉ではなく、神に由来する厳かな発言・託宣を指すことを示しつつ、現代の一般読者にも理解できる表現とした。属格 θεοῦ は「神の」との結びつきを保ち、発言者自身の言葉を直ちに神の直接啓示と断定しない。
- source_word: διακονεῖ
  choice: 仕える
  rationale: 奉仕全般を指す広い語義を保ち、教会の正式な職務だけに限定しない。
- source_word: ἐξ ἰσχύος
  choice: 力によって
  rationale: 日本語として自然にしながら、続く「神が与えてくださる」によって、その力の源が神であることを明示した。
- source_word: ἧς χορηγεῖ ὁ θεός
  choice: 神が与えてくださる
  rationale: χορηγέω の供給・備えの意味を平明に表し、神を主語とする原文の強調を保った。
- source_word: ἐν πᾶσιν
  choice: すべてのことにおいて
  rationale: 包括的な範囲を、格調を保った明瞭な現代日本語で表した。
- source_word: δοξάζηται
  choice: 栄光をお受けになる
  rationale: 日本語では受動形「栄光を与えられる」より自然であり、神が栄光を帰されるという受動の意味を保つ。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: イエス・メシアを通して
  rationale: διά の媒介を「通して」で表し、Χριστός は称号として「メシア」と訳した。
- source_word: κράτος
  choice: 支配
  rationale: 頌栄における統治権・主権的な力の意味を簡潔に表す。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 字義的な反復の荘重さと永続性を、日本語聖書文体として自然な慣用句で表した。
theological_decisions:
- issue: 二つの節における ὡς の力
  choice: 「語りなさい」「仕えなさい」を補い、勧告として訳す
  alternative: 「語る人がいるなら、神の語られたことばのように。仕える人がいるなら、神が与える力から出るもののように」と省略をそのまま残す
  rationale: ギリシア語は比較表現を省略形で置くが、日本語では述語を補うほうが明瞭である。補った命令形は文脈上の勧告を表し、新しい内容を加えない。
- issue: 頌栄の関係代名詞 ᾧ（「この方に」）の指示対象
  choice: 最も近い先行詞であるイエス・メシアを指す形で本文を訳す
  alternative: 直前の目的節の中心である父なる神を指すと理解する
  rationale: 文法上は直近の「イエス・メシア」が最も自然だが、先行する「神が栄光をお受けになる」との結びつきから神を指すとの理解も可能であるため、脚注で曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、頌栄では「世々限りなく」「ありますように」を用いて礼拝文にふさわしい品位を保った。「お受けになる」「与えてくださる」は神に対する自然な敬意を示すが、過度に古風な敬語は避けた。
