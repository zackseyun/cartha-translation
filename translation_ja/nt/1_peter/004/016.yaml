source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: ja
  text: しかし、キリスト者として苦しむのであれば、恥じてはなりません。むしろ、この名において[a]神をあがめなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「この名において」。これはおそらく「キリスト者」という名を指す。「このことにおいて」または「この名のゆえに」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、……のであれば
  rationale: δέの穏やかな対照とεἰの条件を、現代日本語として自然な形で表した。
- source_word: ὡς Χριστιανός
  choice: キリスト者として
  rationale: Χριστιανόςは定着した呼称であり、「キリスト者」が明瞭で品位ある日本語である。文脈上、省略されている「苦しむ」を補い、条件節の意味を明確にした。
- source_word: μὴ αἰσχυνέσθω
  choice: 恥じてはなりません
  rationale: 三人称命令の勧告的な力を保ちつつ、一般の読者に自然な丁寧体で表現した。
- source_word: δοξαζέτω δὲ
  choice: むしろ、……神をあがめなさい
  rationale: 前半の「恥じる」との強い対照を「むしろ」で示し、δοξάζωを神に向けられた文脈に自然な「あがめる」とした。
- source_word: τὸν θεόν
  choice: 神
  rationale: δοξαζέτωの直接目的語として、そのまま明瞭に訳した。
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: この名によって
  rationale: 直前の「キリスト者」という呼び名との結び付きを保った。「この名において」という逐語訳は日本語では不自然なため、「によって」とし、ἐνの解釈上の幅は脚注に残した。
theological_decisions:
- issue: 「この名」（ἐν τῷ ὀνόματι τούτῳ）が何を指すか
  choice: 直前の「キリスト者」という名・呼称を指すものとして訳す。
  alternative: 「このことにおいて」または「この名のゆえに」と理解する。
  rationale: 最も近い先行語はΧριστιανόςであり、ὄνομαは自然に名・呼称を意味する。ただし前置詞ἐνが表す関係には解釈の余地があるため、脚注で代替理解を示した。
- issue: 条件節における「苦しむ」の補充
  choice: 文脈から「苦しむ」を本文に補う。
  alternative: 「キリスト者としてなら」として、原文の省略をそのまま残す。
  rationale: ギリシア語では直前の文脈から「苦しむ」が省略されている。日本語で省略を保つと不自然で意味が曖昧になるため、文脈上明白な動詞を補った。
translation_notes:
  register: 明瞭な現代標準日本語の丁寧体を用いた。「キリスト者」「あがめる」により、自然さと聖書本文としての品位を両立させた。
