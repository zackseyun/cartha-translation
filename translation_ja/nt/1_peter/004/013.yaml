id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: ja
  text: むしろ、あなたがたはメシア[a]の苦しみにあずかっている分だけ、喜びなさい。そうすれば、その方の栄光の現れに際して[b]も、歓喜にあふれて喜ぶことができます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」はギリシア語 Χριστός の称号としての意味を訳したもの。「キリスト」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 直訳的には「その方の栄光の啓示に際して」。ここでの「現れ」は、「覆いが取り除かれて明らかになること」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὸ
  choice: あずかっている分だけ
  rationale: 比例を表す語として、単なる「〜するとき」ではなく、苦しみに参与する度合いに応じて喜ぶという関係を自然な日本語で示した。
- source_word: κοινωνεῖτε
  choice: あずかっている
  rationale: 苦しみへの実際の参与を表し、「共感する」だけに狭めない、聖書文体として自然な表現を選んだ。
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: メシアの苦しみ
  rationale: 属格構文を自然な所有・関連表現にしつつ、その苦しみへの参与が何を意味するかについては本文で限定しなかった。
- source_word: Χριστοῦ
  choice: メシア
  rationale: Χριστόςの称号としての意味を示し、ユダヤ的・メシア的背景を保った。日本語で定着した「キリスト」は脚注に代案として示した。
- source_word: χαίρετε
  choice: 喜びなさい
  rationale: 現在の苦しみの中で能動的に喜ぶよう命じる命令形を、明瞭で格調のある現代日本語にした。
- source_word: ἵνα
  choice: それは、〜ためです
  rationale: 現在の喜びと将来の喜びを結ぶ目的の関係を明示した。結果の含みを排除しきらない自然な目的表現でもある。
- source_word: ἀποκαλύψει
  choice: 現される時
  rationale: ここでの将来的な栄光の顕現を自然に表した。「啓示」「覆いが取り除かれること」という語形上の含みは脚注で補った。
- source_word: δόξης αὐτοῦ
  choice: その方の栄光
  rationale: αὐτοῦを直前のメシアに結び付け、同じ称号の不自然な反復を避けながら指示対象を保った。
- source_word: χαρῆτε ἀγαλλιώμενοι
  choice: 歓喜にあふれて喜ぶ
  rationale: χαίρωとの語彙的連続を「喜ぶ」で保ちつつ、ἀγαλλιάωの強められた喜びを「歓喜にあふれて」で表現した。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号としての意味が生きているため「メシア」とした。ただし、日本語で固有名のように定着した「キリスト」も可能なので脚注に残した。
- issue: 「メシアの苦しみ」への参与の性質
  choice: メシアの苦しみにあずかる
  alternative: メシアのために苦しむ／メシアと同じ苦しみを受ける
  rationale: 原文は参与を述べるが、それを贖罪的苦難の反復とも、単にメシアのための迫害とも明示的に限定していないため、神学的緊張を保った。
- issue: ἵνα節の機能
  choice: 〜ためです
  alternative: そうすれば〜喜ぶことになります
  rationale: 目的を前面に出しつつ、目的と結果が重なり得るギリシア語の含みを過度に説明しなかった。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「あずかる」「歓喜」などの適度に格調ある語を採用した。命令と目的節の関係を読み取りやすくし、現在の喜びと将来の喜びの反復も保持した。脚注記号[a][b]は該当箇所に置いた。
