  text: πᾶς ὁ ἐρχόμενος πρός με καὶ ἀκούων μου τῶν λόγων καὶ ποιῶν αὐτούς, ὑποδείξω ὑμῖν τίνι ἐστὶν ὅμοιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/047.yaml
  text: Everyone who comes to me and hears my words and does them—I will show you what he is like:[a][b]
translation:
  language: ja
  text: わたしのもとに来て、わたしのことばを聞き、それを行う人は皆、だれに似ているかを、あなたがたに示そう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ἐρχόμενος πρός με
  choice: わたしのもとに来て……人は皆
  rationale: πᾶςと冠詞付き分詞による一般的・包括的な表現を、現代日本語として自然な「人は皆」で表した。πρός μεは人への接近を示すため「わたしのもとに」とした。
- source_word: ἀκούων μου τῶν λόγων
  choice: わたしのことばを聞き
  rationale: μου τῶν λόγωνをイエスに属する、またイエスが語ることばとして訳した。「聞く」はἀκούωの基本的意味を保ち、従順の意味を先取りしない。
- source_word: ποιῶν αὐτούς
  choice: それを行う
  rationale: ποιέωが教えや命令について用いられた際の、実際に行うという意味を直接表した。「それ」は直前の「ことば」を受け、日本語で不自然な複数表現を避けている。
- source_word: ὑποδείξω ὑμῖν
  choice: あなたがたに示そう
  rationale: 未来形が、これから提示するたとえを導入している。「示そう」は説明の意を加えすぎず、簡潔で格調も保つ。
- source_word: τίνι ἐστὶν ὅμοιος
  choice: どんな人に似ているか
  rationale: τίνιは形式上与格で「だれに」に当たるが、後続の人物との比較を自然な日本語で示すため「どんな人に似ているか」とした。
theological_decisions:
- issue: 男性単数形による一般的な人の表現
  choice: 「人は皆」とし、性別を限定する代名詞を置かない
  alternative: 「その人は、どんな男に似ているか」と男性形を明示する
  rationale: ギリシア語の男性単数形はここで、来て、聞いて、行う者を一般的に指す。日本語の「人」には文法上の性がなく、普遍的な範囲と代表単数の意味を自然に保てる。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの発言としての簡潔さと品位を保った。「聞き、それを行う」という並行を維持し、聞くことと実行することの緊張を解釈で弱めていない。
