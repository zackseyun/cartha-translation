  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ μὴ κρίνετε, καὶ οὐ μὴ κριθῆτε· ⸀καὶ μὴ καταδικάζετε, καὶ οὐ μὴ καταδικασθῆτε. ἀπολύετε, καὶ ἀπολυθήσεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/037.yaml
  text: And do not judge[a], and you will certainly not be judged; and do not condemn, and you will certainly not be condemned. Forgive, and you will be forgiven.
translation:
  language: ja
  text: 人を裁いてはいけません。そうすれば、あなたがたも決して裁かれません。人を罪に定めてはいけません。そうすれば、あなたがたも決して罪に定められません。赦しなさい[a]。そうすれば、あなたがたも赦されます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「解き放ちなさい」「釈放しなさい」とも訳せる。ギリシア語は「解放する」「釈放する」「免じる」などを意味し、ここでは「赦す」と理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνετε
  choice: 裁く
  rationale: 一般的な判断・審判を表す語であり、対応する受動形との反復も保てる。
- source_word: οὐ μὴ κριθῆτε
  choice: 決して裁かれません
  rationale: οὐ μήによる強い否定を、自然な現代日本語で明示する。
- source_word: καταδικάζετε
  choice: 罪に定める
  rationale: κρίνωより強く、有罪と断じる意味を表し、原文の意味上の強まりを保つ。
- source_word: οὐ μὴ καταδικασθῆτε
  choice: 決して罪に定められません
  rationale: 強い否定と能動・受動の対応を保つ。
- source_word: ἀπολύετε
  choice: 解放しなさい
  rationale: この語の『解き放つ、釈放する、免じる』という幅を保ち、『赦す』だけに限定しない。目的語が省かれているため、日本語では文脈上の対象として『人を』を補った。
- source_word: ἀπολυθήσεσθε
  choice: 解放されます
  rationale: 能動形との語の対応と、この格言の相互的な構造を保つ。
- source_word: καὶ
  choice: そうすれば
  rationale: 命令とその帰結を結ぶ反復構造を、ぎこちない逐語的な『そして』を避けて自然に示す。
theological_decisions:
- issue: ἀπολύετε／ἀπολυθήσεσθεを『赦す／赦される』に限定するか
  choice: 本文では『解放する／解放される』とする
  alternative: 『赦す／赦される』『釈放する／釈放される』
  rationale: 裁きと断罪を扱う直前の文脈では、要求や負い目から解くこと、あるいは釈放・免除することを含み得る。広い語義を本文に残し、文脈上有力な『赦す』は脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。三つの命令と帰結の並行を短文で示し、οὐ μήの強意を「決して」で表した。
