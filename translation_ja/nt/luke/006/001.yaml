  text: Ἐγένετο δὲ ἐν ⸀σαββάτῳ διαπορεύεσθαι αὐτὸν ⸀διὰ σπορίμων, καὶ ἔτιλλον οἱ μαθηταὶ αὐτοῦ ⸂καὶ ἤσθιον τοὺς στάχυας⸃ ψώχοντες ταῖς χερσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/001.yaml
  text: It happened on a Sabbath that he was passing through grainfields[a], and his disciples were plucking and eating the heads of grain[b], rubbing them in their hands.
translation:
  language: ja
  text: ある安息日に、イエスが穀物畑の中を通っていると、弟子たちは穂を摘み、手でもみながら[a]食べていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 穂を手でもみ、食べられる粒を取り出した。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ある……日に、……と
  rationale: ルカに多い出来事導入の表現。日本語では独立した「そのことが起こった」などを置かず、時を示す従属節に組み込むことで、自然に物語を進めた。δέの緩やかな接続も文脈に委ねた。
- source_word: ἐν σαββάτῳ
  choice: ある安息日に
  rationale: 冠詞のない単数形で、既出の特定の日ではなく、一度の安息日の出来事として自然に表した。
- source_word: διαπορεύεσθαι αὐτὸν
  choice: イエスが……通っておられると
  rationale: 継続中の動作を表す不定詞を、日本語の自然な従属節にした。αὐτόνの指示対象は文脈上イエスなので、読者の明瞭さのため固有名で示した。
- source_word: διὰ σπορίμων
  choice: 麦畑の中を
  rationale: σπόριμοςは種をまいた耕地、特に穀物畑を指す。日本語では「麦畑」が簡潔で自然だが、原文は小麦・大麦などの種類を特定していない。
- source_word: ἔτιλλον
  choice: 摘み
  rationale: 穂を摘み取る継続的な動作を、後続する動作と自然に連結した。
- source_word: καὶ ἤσθιον τοὺς στάχυας
  choice: 穂を……食べていた
  rationale: στάχυαςは穀類の穂を指す。「食べていた」により未完了過去の継続性を保った。
- source_word: ψώχοντες ταῖς χερσίν
  choice: 手でもんで
  rationale: 手で穂をこすり、食べられる粒を取り出す具体的な動作を簡潔に表した。
