id: LUK.6.7
reference: Luke 6:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀παρετηροῦντο ⸀δὲ οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι εἰ ἐν τῷ σαββάτῳ ⸀θεραπεύει, ἵνα εὕρωσιν ⸀κατηγορεῖν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/007.yaml
  text: And the scribes and the Pharisees were watching him closely to see whether he would heal on the Sabbath[b][a], so that they might find grounds to accuse him.
translation:
  language: ja
  text: 律法学者たちとファリサイ派の人々は、イエスが安息日に癒やすかどうか、じっと見張っていた[a]。イエスを訴える口実を見つけるためであった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「注意深く見ていた」。ギリシア語の動詞は、注意深く観察することを表し、文脈によっては警戒的、敵対的に見張る含みを持つ。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「イエスを訴えるための根拠を見つけるため」。ここでは、訴える根拠や機会を探す意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετηροῦντο
  choice: じっと見張っていた
  rationale: 未完了過去の継続的な動作と、告発を意図した警戒的・敵対的な観察を自然な日本語で表す。目的語の「イエス」は文脈から補った。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 福音書の文脈で、律法の解釈と教育に携わった人々を現代の一般読者に分かりやすく示す定着した訳語。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団名を標準的に音写し、「派の人々」によって自然な日本語にした。
- source_word: εἰ
  choice: かどうか
  rationale: 観察の対象となる間接疑問を、日本語で簡潔かつ自然に表す。
- source_word: ἐν τῷ σαββάτῳ
  choice: 安息日に
  rationale: 時間を示す前置詞句を自然な日本語で表し、単数形も保持する。
- source_word: θεραπεύει
  choice: 病気を治す
  rationale: ここでは病人の癒やしを指すため、動作の内容が明確な現代日本語とした。ギリシア語の現在形は、見張っていた時点から見た未確定の行為として「治すかどうか」と表した。
- source_word: ἵνα εὕρωσιν
  choice: 見つけるため
  rationale: ἵνα節の目的を、簡潔で自然な日本語の目的表現によって保持する。
- source_word: κατηγορεῖν αὐτοῦ
  choice: イエスを訴える口実
  rationale: εὕρωσινとの結びつきから、単に告発するというより、その根拠や機会を探す意味を日本語で明示する。
theological_decisions:
- issue: 反対者たちの意図の描写
  choice: 告発を目的とする敵対的な監視として訳す
  alternative: 中立的に「注意深く見ていた」と訳す
  rationale: παρετηροῦντο自体には注意深い観察という幅があるが、後続の「訴える口実を見つけるため」が敵対的意図を明示する。「じっと見張っていた」はその文脈を反映しつつ、本文以上の動機を付け加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「癒やす」より意味が直接伝わる「病気を治す」を採用し、敵対性は「見張る」と目的節によって表した。脚注記号は対応箇所の直後に置いた。
