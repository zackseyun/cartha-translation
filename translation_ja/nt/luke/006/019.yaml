source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ὄχλος ⸀ἐζήτουν ἅπτεσθαι αὐτοῦ, ὅτι δύναμις παρ’ αὐτοῦ ἐξήρχετο καὶ ἰᾶτο πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/019.yaml
  text: And the whole crowd was trying to touch him[a], because power was coming out from him and healing them all.
translation:
  language: ja
  text: 群衆は皆、イエスに触れようとしていた。イエスから力が出て[a]、皆を癒やしていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスから力が出て行き」。
    reason: ἐξήρχετο（出ていく／出る）について、本文の中立的な「出て」に対する語彙的別訳を示す。
lexical_decisions:
- source_word: πᾶς ὁ ὄχλος
  choice: 群衆は皆
  rationale: 集合体としての群衆全体を表す。現代日本語として自然であり、πᾶς の包括性も保つ。
- source_word: ἐζήτουν
  choice: 触れようとしていた
  rationale: 未完了過去が示す継続的・反復的な試みを、「ようとしていた」で自然に表した。
- source_word: ἅπτεσθαι αὐτοῦ
  choice: イエスに触れようと
  rationale: ἅπτομαι はこの癒やしの文脈では「触れる」が最も自然。代名詞の指示対象を明瞭にするため「イエス」とした。
- source_word: δύναμις
  choice: 力
  rationale: 癒やしをもたらす有効な力を指すが、原文にない「奇跡の」を補わず、簡潔に「力」とした。
- source_word: παρ’ αὐτοῦ ἐξήρχετο
  choice: イエスから力が出て来て
  rationale: イエスを起点として力が発していたことと、未完了過去の進行的な様相を自然な日本語で表す。「出て行く」という視点も可能なため注記した。
- source_word: ἰᾶτο πάντας
  choice: すべての人を癒やしていた
  rationale: ἰᾶτο の未完了過去を「癒やしていた」で表し、πάντας の包括性を「すべての人」で明示した。文法上、癒やす主体は直前の「力」である。
theological_decisions:
- issue: イエスから出る δύναμις の性質
  choice: 「イエスから力が出て来て」と訳し、その力が癒やしていたという原文の叙述を保つ。
  alternative: 「イエスから奇跡の力が出て来て」
  rationale: 本文はイエスを癒やしの力の源として描くが、δύναμις に「奇跡の」という語は明示されていないため、説明的な教理表現を加えなかった。
- issue: 癒やしの範囲 πάντας
  choice: 「すべての人」と包括的に訳す。
  alternative: 文脈上の病人・苦しむ人に限定して明示する。
  rationale: 原文の πάντας が持つ包括性を保持し、対象を翻訳段階で狭めない。文脈がその対象を理解させる。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「癒やす」は常用的な表記とし、継続相を「していた」で示した。
