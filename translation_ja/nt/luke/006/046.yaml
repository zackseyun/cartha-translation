id: LUK.6.46
reference: Luke 6:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τί δέ με καλεῖτε· Κύριε κύριε, καὶ οὐ ποιεῖτε ἃ λέγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/046.yaml
  text: Why do you call me[a], ‘Lord, Lord,’ and not do what I say?
translation:
  language: ja
  text: なぜあなたがたは私を「主よ、主よ」[a]と呼びながら、私の言うことを行わないのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主人よ、主人よ」。ギリシア語は「キュリオス、キュリオス」。
    reason: κύριοςには文脈により「主」のほか、主人への呼びかけに相当する意味もありうるため。
lexical_decisions:
- source_word: Τί
  choice: なぜ
  rationale: ここでは理由を問う副詞的な用法であり、非難を含む問いとして自然な「なぜ」とした。
- source_word: δέ
  choice: —
  rationale: 弱い接続辞であり、前後の文脈と「ながら」による対比で機能が十分伝わるため、独立した接続語は置かなかった。
- source_word: με
  choice: 私を
  rationale: καλεῖτεの直接目的語として素直に訳した。
- source_word: καλεῖτε
  choice: 呼びながら
  rationale: 現在形の「呼ぶ」を保ちつつ、後半との対照を現代日本語で自然に示すため「ながら」を用いた。
- source_word: Κύριε κύριε
  choice: 主よ、主よ
  rationale: 呼格と反復を保ち、敬称としての重みと、口での告白と行動との対照を伝えた。
- source_word: καὶ οὐ
  choice: ながら、…ない
  rationale: ギリシア語の並列がこの文脈で表す強い対照を、日本語として自然な逆接的構文で表した。
- source_word: ποιεῖτε
  choice: 行わない
  rationale: ここではイエスの言葉を実行する意味であり、「する」よりも明確で、聖書本文にふさわしい自然な表現とした。
- source_word: ἃ
  choice: ことを
  rationale: 中性複数関係代名詞が指す発言内容を、日本語で自然な集合表現「こと」とした。
- source_word: λέγω
  choice: 私の言う
  rationale: 原文の単純な「私が言う」を過不足なく表し、「命じる」などの解釈を加えなかった。
theological_decisions:
- issue: κύριοςをイエスへの称号としてどう訳すか
  choice: 主
  alternative: 先生／主人
  rationale: κύριοςはこの直接呼びかけにおいて敬意だけでなくキリスト論的な重みも帯びうるため、曖昧さと伝統的な称号性を保つ「主」を本文に採用した。別の語義の可能性は脚注に示した。
translation_notes:
  register: 明快な現代標準語を用い、問いの厳しさを保ちながら過度に古風な表現を避けた。「主よ」のみ、呼格として定着した簡潔で品位ある形を採用した。
