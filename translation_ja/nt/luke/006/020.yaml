id: LUK.6.20
reference: Luke 6:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ ἔλεγεν· Μακάριοι οἱ πτωχοί, ὅτι ὑμετέρα ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/020.yaml
  text: 'And he[a], lifting up his eyes toward his disciples, was saying: “Blessed are the poor[b], because yours is the kingdom of God.”'
translation:
  language: ja
  text: 'イエスは目を上げて弟子たちの方に目を向け、こう語っていた。


    「貧しい人たちは幸いです。[a]


    神の国はあなたがたのものだからです。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ルカは「貧しい人たち」と記しており、「心の貧しい人たち」とは記していない（マタイ5章3節参照）。また、ギリシア語ではここは第三人称の形だが、次の「あなたがたのもの」によって弟子たちへの直接の語りかけとなっている。
    reason: 原文の表現とマタイの並行箇所との差、および第三人称から二人称への移行を明示するため。
lexical_decisions:
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τοὺς μαθητὰς αὐτοῦ
  choice: 目を上げて弟子たちを見つめ
  rationale: 直訳的な「弟子たちの方へ目を上げて」より自然な現代日本語としつつ、視線を弟子たちへ向けた具体的な動作を保った。
- source_word: ἔλεγεν
  choice: こう語っておられた
  rationale: 未完了過去の継続的・導入的な側面を「語っておられた」で示した。文脈上のイエスへの敬意を自然な日本語の敬語で表した。
- source_word: Μακάριοι
  choice: 幸いです
  rationale: 単なる感情としての幸福ではなく、神の前で恵まれた状態を告げる祝福宣言として理解でき、現代の一般読者にも明瞭な表現を選んだ。
- source_word: οἱ πτωχοί
  choice: 貧しい人たち
  rationale: 定冠詞付き形容詞の第三人称形式をそのまま自然な日本語で表した。直後の「あなたがたのもの」が、弟子たちへの直接の語りかけであることを明らかにする。
- source_word: ὅτι
  choice: だからです
  rationale: 祝福されている理由を示す因果関係を、明快で自然な日本語として表した。
- source_word: ὑμετέρα ἐστὶν
  choice: あなたがたのもの
  rationale: 述語的位置の所有形容詞を明確に訳し、複数の聞き手への直接的な二人称を保持した。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 神の支配とその領域の双方を含みうる慣用的で広い表現を用い、意味を一方に狭めなかった。
theological_decisions:
- issue: πτωχοίを霊的な貧しさとして明示するか
  choice: 貧しい人たち
  alternative: 心の貧しい人たち
  rationale: ルカ本文には「心において」に相当する限定がないため、マタイ5章3節と調和させる補足をせず、経済的・社会的意味を含みうる原文の簡潔さを保った。
- issue: 祝福宣言を第三人称形と直接呼びかけのどちらで訳すか
  choice: 貧しい人たちは幸いです
  alternative: 貧しいあなたがたは幸いです
  rationale: οἱ πτωχοίの文法上の第三人称形式を保持し、続く二人称複数「あなたがたのもの」によって直接の呼びかけへ移る原文の緊張を残した。
- issue: βασιλείαを領域か統治かに限定するか
  choice: 神の国
  alternative: 神の支配
  rationale: 「神の国」は日本語聖書で定着しており、王的支配とその実現領域を含む語の幅を一方に限定しない。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。至福の宣言は簡潔な口語調とし、説明的な補足を本文へ持ち込まず脚注に置いた。
