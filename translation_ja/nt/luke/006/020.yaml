  terminology: 「幸いです」「貧しい人たち」「神の国」はいずれも適切です。「貧しい人たち」に「心の」を補わず、βασιλείαを「支配」に限定しない点も原文に忠実です。脚注は本文の形態上の第三人称と文脈上の二人称への移行を適切に説明しています。
