id: LUK.6.12
reference: Luke 6:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις ⸂ἐξελθεῖν αὐτὸν⸃ εἰς τὸ ὄρος προσεύξασθαι, καὶ ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/012.yaml
  text: It happened in those days that he went out to the mountain to pray[a], and he spent the whole night in prayer to God.
translation:
  language: ja
  text: そのころ、イエスは祈るために山へ出て行き、夜を徹して神に祈っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神への祈りのうちに夜を過ごしていた」。
    reason: ἦν διανυκτερεύων ἐν τῇ προσευχῇ τοῦ θεοῦの継続的な言い回しを、より形式的に示す別訳。
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ταύταις
  choice: そのころ
  rationale: ルカに特徴的な出来事の導入と時を示す句を、現代日本語で自然な物語の移行として表した。「そして、これらの日々に起こった」と逐語的にはせず、前後の時期を指す意味を保った。
- source_word: ἐξελθεῖν αὐτὸν
  choice: イエスは…出て行き
  rationale: 不定詞と対格主語を日本語の定形節で表した。αὐτόνの指示対象は文脈上イエスであり、「彼」より明瞭で自然な固有名を用いた。
- source_word: εἰς τὸ ὄρος
  choice: 山へ
  rationale: ὄροςの基本義を保った。定冠詞は日本語で不自然に特定性を強めず、簡潔に表した。
- source_word: προσεύξασθαι
  choice: 祈るために
  rationale: 移動の目的を示す不定詞として明確に訳した。
- source_word: ἦν διανυκτερεύων
  choice: 夜を徹して…祈っていた
  rationale: 迂言的な未完了表現の継続性と、διανυκτερεύωが示す夜通しの行為を自然な日本語で表した。
- source_word: ἐν τῇ προσευχῇ τοῦ θεοῦ
  choice: 神に祈って
  rationale: 属格τοῦ θεοῦを祈りの向かう相手として理解し、誤解のない自然な日本語にした。
theological_decisions:
- issue: τοῦ θεοῦとイエスの祈りとの関係
  choice: 神に祈って
  alternative: 神への祈りのうちに
  rationale: この句はイエスが神に向かって祈ることを述べるものと解した。「神の祈り」とすると神自身が祈る意味に誤解され得るため避けたが、本文以上の教理的説明は加えていない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、祈りに出た目的、夜通しの継続、祈りが神に向けられたことを保持した。語調は簡潔で品位ある物語文とした。
