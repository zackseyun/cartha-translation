id: LUK.6.35
reference: Luke 6:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν καὶ ἀγαθοποιεῖτε καὶ δανίζετε μηδὲν ἀπελπίζοντες· καὶ ἔσται ὁ μισθὸς ὑμῶν πολύς, καὶ ἔσεσθε υἱοὶ Ὑψίστου, ὅτι αὐτὸς χρηστός ἐστιν ἐπὶ τοὺς ἀχαρίστους καὶ πονηρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/035.yaml
  text: But love your enemies[a], and do good, and lend, expecting nothing in return; and your reward will be great, and you will be sons of the Most High[b], because he is kind to the ungrateful and evil.
translation:
  language: ja
  text: しかし、あなたがたの敵を愛し、善を行い、何も返してもらおうと期待せずに貸しなさい。[a] そうすれば、あなたがたの受ける報いは大きく、あなたがたは、いと高き方の子らとなります。[b] いと高き方ご自身が、恩知らずな者にも悪い者にも親切だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何も返してもらおうと期待せずに」に当たるギリシア語は解釈の難しい表現で、「だれにも見切りをつけずに」または「決して望みを失わずに」と理解することもできます。ここでは、貸すことについての文脈から、返済や見返りを期待しないという意味に取っています。
    reason: lexical_alternative
  - marker: b
    text: 「子ら」に当たるギリシア語は、字義的には男性複数形の「息子たち」ですが、ここでは代表的な意味で用いられていると理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: しかし
  rationale: 直前の互恵的な愛との強い対照を、自然な現代日本語で示す。
- source_word: ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν
  choice: あなたがたの敵を愛し
  rationale: 命令の直接性と「敵」という語の衝撃を弱めずに保つ。
- source_word: ἀγαθοποιεῖτε
  choice: 善を行い
  rationale: 単なる善意ではなく、実際に善をなす行為を表す。
- source_word: δανίζετε
  choice: 貸しなさい
  rationale: 目的語を補って金銭だけに限定せず、原文の命令を自然に表す。
- source_word: μηδὲν ἀπελπίζοντες
  choice: 何も返してもらおうと期待せずに
  rationale: 貸すことと互恵性を扱う文脈では、返済や見返りを期待しない意味と取るのが最も自然である。ただし語句自体に解釈上の難しさがあるため異なる理解を脚注に残す。
- source_word: μισθὸς ὑμῶν πολύς
  choice: あなたがたの受ける報いは大きく
  rationale: μισθόςを倫理的・終末論的文脈に適した「報い」とし、日本語として必要な「受ける」を補った。
- source_word: υἱοὶ Ὑψίστου
  choice: いと高き方の子ら
  rationale: υἱοίは字義的には男性複数の「息子たち」だが、この文脈で神との関係や神に似る者を代表的に指す用法を、自然で包摂的な日本語の「子ら」で表す。字義は脚注で明示する。
- source_word: χρηστός
  choice: 親切
  rationale: ふさわしくない者にも向けられる神の慈愛ある善意を、明瞭な現代日本語で表す。
- source_word: ἀχαρίστους καὶ πονηρούς
  choice: 恩知らずな者にも悪い者にも
  rationale: 二つの形容詞をそれぞれ人を指す名詞句として明確に訳し、ἐπίの対象を「にも」で表す。
theological_decisions:
- issue: υἱοὶ Ὑψίστουの性別表現
  choice: いと高き方の子ら
  alternative: いと高き方の息子たち
  rationale: ギリシア語は男性複数形だが、ここでは聞き手全体に向けた代表的用法であり、日本語の「子ら」が意味を自然に伝える。形態上の情報は脚注に残し、曖昧さを隠さない。
- issue: μηδὲν ἀπελπίζοντεςの解釈
  choice: 何も返してもらおうと期待せずに
  alternative: だれにも見切りをつけずに／決して望みを失わずに
  rationale: 直近の貸与と返礼の文脈から、返済や見返りを期待しないという理解を本文に採る。一方、ἀπελπίζωの語義に基づく別解は真正な解釈上の可能性として脚注に示す。
- issue: 「子らとなる」と神の子としての身分の関係
  choice: 原文どおり結果・将来を表す「子らとなります」を保持
  alternative: いと高き方の子らであることを示します
  rationale: ἔσεσθεは「〜となる／〜であるだろう」と述べており、行為が身分を獲得させるのか、神に似た性質を示すのかを訳文で教義的に決着させない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「いと高き方」は神の称号として定着した荘重さを保つ。「ご自身」を補って後半の主語を明確にし、原文の理由節を自然に接続した。すべての脚注記号を本文中に配置した。
