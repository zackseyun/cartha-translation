id: LUK.6.42
reference: Luke 6:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀πῶς δύνασαι λέγειν τῷ ἀδελφῷ σου· Ἀδελφέ, ἄφες ἐκβάλω τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ σου, αὐτὸς τὴν ἐν τῷ ὀφθαλμῷ σοῦ δοκὸν οὐ βλέπων; ὑποκριτά, ἔκβαλε πρῶτον τὴν δοκὸν ἐκ τοῦ ὀφθαλμοῦ σοῦ, καὶ τότε διαβλέψεις ⸂τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου ἐκβαλεῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/042.yaml
  text: How can you say to your brother[a], ‘Brother, let me take out the speck that is in your eye,’ while you yourself do not see the beam that is in your own eye? Hypocrite, first take the beam out of your own eye[c][b], and then you will see clearly to take out the speck that is in your brother’s eye.
translation:
  language: ja
  text: どうしてあなたは、自分自身の目にある梁[c]が見えていないのに、兄弟[a]に、『兄弟よ、あなたの目にある小さな木くず[b]を取り除かせてください』と言えるのですか。偽善者よ、まず自分の目から梁を取り除きなさい。そうすれば、兄弟の目にある小さな木くずを取り除くために、はっきり見えるようになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」と訳したギリシア語ἀδελφόςは、男性単数の親族呼称です。この教えはより広く当てはまり得ますが、原文の表現は男性形です。
    reason: cultural_note
  - marker: b
    text: 「小さな木くず」と訳したギリシア語κάρφοςは、乾いた素材のごく小さな断片を指します。「小枝のかけら」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「梁」と訳したギリシア語δοκόςは、大きな木材を指します。「丸太」または「厚板」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασαι λέγειν
  choice: どうして……と言えるのですか
  rationale: 可能性と妥当性を問いただす修辞疑問を、自然な現代日本語で表した。
- source_word: ἀδελφῷ / Ἀδελφέ / ἀδελφοῦ
  choice: 兄弟に／兄弟よ／兄弟の
  rationale: 原文の男性単数の親族呼称を保ち、呼びかけでは「兄弟よ」とした。
- source_word: ἄφες ἐκβάλω
  choice: 取らせてくれ
  rationale: ここでのἄφεςは許可を求める命令形であり、「私に取り除かせよ」という語用を簡潔に再現した。
- source_word: κάρφος
  choice: 小さな木くず
  rationale: 乾いた素材のごく小さな断片を指す語であり、目に入る微小な異物として理解しやすく、梁との誇張された対比も保てる。
- source_word: δοκός
  choice: 梁
  rationale: 大きな建築用材を指すため、「丸太」より原義に近い「梁」を採用し、小さな木くずとの極端な対比を保った。
- source_word: αὐτὸς ... οὐ βλέπων
  choice: 自分自身の……が見えていないのに
  rationale: αὐτόςの強調を「自分自身」で示し、他人への指摘と自己認識の欠如との対照を保った。
- source_word: ὑποκριτά
  choice: 偽善者よ
  rationale: 単数呼格の直接的で厳しい叱責を保った。
- source_word: διαβλέψεις
  choice: はっきり見えるようになります
  rationale: 単に「見る」ではなく、明瞭に見抜けるようになるという動詞の意味を反映した。
- source_word: ἐκβάλω / ἔκβαλε / ἐκβαλεῖν
  choice: 取らせてくれ／取り除きなさい／取り除く
  rationale: 目から異物を除く比喩に合う自然な日本語を用い、命令・不定法など各構文に応じて形を整えた。
theological_decisions:
- issue: 倫理的教えにおける男性単数形ἀδελφός
  choice: 兄弟
  alternative: 仲間／兄弟姉妹
  rationale: 教えの適用範囲を狭める意図は断定せず、原文が一貫して男性単数形を用いることを本文と注で明示した。
- issue: κάρφοςとδοκόςの比喩的対比
  choice: 小さな木くず……梁
  alternative: ちり……丸太／木片……厚板
  rationale: 他人の小さな欠点と自分の重大な欠点との誇張された対比を、具体的な木材のイメージを保って表した。
- issue: διαβλέψειςと自己吟味・他者への助けの関係
  choice: 取り除くために、はっきり見えるようになります
  alternative: そうすれば、はっきり見えて取り除けます
  rationale: 自己の梁を除いた後には他者の木くずを除くため明瞭に見える、という原文の目的を保ち、他者への関与そのものを禁じる意味には限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、修辞疑問と「偽善者よ」という厳しい呼びかけの格調を保った。「取らせてくれ」は許可を求める原文の構文を自然に示し、末尾は目的を表す不定法の関係を明示した。
