source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, οἱ ἐμπεπλησμένοι ⸀νῦν, ὅτι πεινάσετε. ⸀οὐαί, οἱ γελῶντες νῦν, ὅτι πενθήσετε καὶ κλαύσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/025.yaml
  text: Woe to you who are full now[a], because you will be hungry. Woe to you who are laughing now[b], because you will mourn and weep.
translation:
  language: ja
  text: 今、満腹しているあなたがたは災いだ。[a] あなたがたは飢えるからだ。今、笑っているあなたがたは災いだ。あなたがたは嘆き、泣くからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「災いだ」は、「ああ」とも訳せる。ただし、ここでは嘆きだけでなく、警告と裁きの響きを伴う。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: 災いだ
  rationale: 単なる同情ではなく、預言者的な警告と来たる裁きの重みを保つ。現代日本語でも簡潔で理解しやすい。
- source_word: ἐμπεπλησμένοι
  choice: 満腹している
  rationale: 満たされた結果として現在満腹である状態を表す完了分詞の意味を保ち、後の「飢える」との具体的な対比を明確にする。
- source_word: νῦν
  choice: 今
  rationale: 現在の状態と将来の逆転との時間的対照を明示する。
- source_word: πεινάσετε
  choice: やがて飢える
  rationale: 未来の欠乏を自然な日本語で表す。「やがて」によって未来形の意味を示しつつ、時期を過度に特定しない。
- source_word: γελῶντες
  choice: 笑っている
  rationale: 現在進行中の笑いを率直に表し、「喜んでいる」のように意味を広げすぎない。
- source_word: πενθήσετε
  choice: やがて嘆き
  rationale: 深い悲しみや喪の重みを表し、続く「泣く」と区別しながら並列の強調を保つ。
- source_word: κλαύσετε
  choice: 泣く
  rationale: 嘆きが実際の泣く行為として現れる意味を自然な現代日本語で表す。
- source_word: ὅτι
  choice: からだ
  rationale: 災いの宣告の根拠を示す因果関係を、明瞭な現代日本語で表す。
theological_decisions:
- issue: 災いの言葉の性質
  choice: 現在満たされ、気楽に笑っている者に対する、将来の逆転と裁きについての預言的警告
  alternative: 境遇の移り変わりについての単なる社会的観察
  rationale: 反復される οὐαί、未来形、周囲の幸いの言葉との対照は、中立的な観察以上の警告を示す。ただし、その逆転がいつ、どのような仕方で起こるかは本文以上に限定しない。
- issue: 未来形が示す時期
  choice: 「やがて」により将来の逆転を示すが、時期は特定しない
  alternative: 終末時のみに明示的に限定する
  rationale: 文脈は終末的な裁きの響きを持つが、この一節自体は実現の時点や仕方を詳述していないため、その緊張を保つ。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。「災いだ」の反復と、「今」から「やがて」への対照によって原文の修辞構造を保っている。
