id: LUK.6.22
reference: Luke 6:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μακάριοί ἐστε ὅταν μισήσωσιν ὑμᾶς οἱ ἄνθρωποι, καὶ ὅταν ἀφορίσωσιν ὑμᾶς καὶ ὀνειδίσωσιν καὶ ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν ἕνεκα τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/022.yaml
  text: Blessed are you when people hate you[a], and when they exclude you and insult you and reject your name as evil because of the Son of Man.
translation:
  language: ja
  text: 人の子のために、人々があなたがたを憎み、あなたがたを排除し、侮辱し、あなたがたの名を悪いものとして退けるとき、あなたがたは幸いです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの名を悪いものとして退ける」とは、あなたがたを道徳的に悪い者として公然と非難し、受け入れないことを指すとも考えられます。
    reason: 「名を退ける」という原文の慣用的表現が示す社会的・公的な排斥の意味を補足するため。
lexical_decisions:
- source_word: Μακάριοί
  choice: 幸いです
  rationale: 祝福を告げる教えの定型的な響きを保ちつつ、現代日本語で自然かつ荘重に表現する。単なる主観的な幸福感には限定しない。
- source_word: ὅταν
  choice: 〜とき
  rationale: 接続法を伴う不定の状況を自然な日本語で表す。文脈上、「そのようなことが起こるとき」という反復可能な含みも保たれる。
- source_word: μισήσωσιν ὑμᾶς οἱ ἄνθρωποι
  choice: 人々があなたがたを憎み
  rationale: οἱ ἄνθρωποι は男性だけでなく一般の人々を指すため、「人々」とする。μισέω の強い敵意は「憎む」で明確に表す。
- source_word: ἀφορίσωσιν ὑμᾶς
  choice: あなたがたを仲間外れにし
  rationale: 共同体や交わりから切り離すという社会的排除の意味を、普通の読者に分かりやすい現代語で示す。
- source_word: ὀνειδίσωσιν
  choice: 侮辱し
  rationale: 非難やののしりを含む言葉による辱めを、簡潔で現代的な語で表す。
- source_word: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρὸν
  choice: あなたがたの名を悪いものとして退ける
  rationale: 直訳的な「名を投げ出す」は日本語では不明瞭なため、名や評判を悪として公に排斥する意味を示す。一方、「名」を残して原文の具体的表現と解釈上の幅を保つ。
- source_word: ἕνεκα
  choice: 〜のために
  rationale: ここでは迫害の理由・原因を示す。日本語の「ために」は自然であり、帰依に伴う理由という含みを保てる。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの称号として定着した訳語を用い、旧約との関連や称号としての含意を保つ。
theological_decisions:
- issue: ἐκβάλωσιν τὸ ὄνομα ὑμῶν ὡς πονηρόν の慣用表現
  choice: 「あなたがたの名を悪いものとして退ける」と訳す。
  alternative: 「あなたがたを悪人呼ばわりする」「あなたがたの名を悪として投げ捨てる」
  rationale: 公然たる拒絶・排斥や評判の否定を示しながら、「名」という原文の表現を保持し、具体的な社会的手段を一つに限定しない。
- issue: οἱ ἄνθρωποι の包括的指示
  choice: 「人々」とする。
  alternative: 「男たち」「人間」
  rationale: ここでは性別を限定せず、弟子たちを迫害する社会一般の人々を指す。
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου の称号性
  choice: 「人の子」とする。
  alternative: 「人間の子」「人なる者」
  rationale: ギリシア語の形と福音書全体での用法、さらに聖書内の響きを保つため、定着した称号を採用する。
- issue: μακάριος の神学的含意
  choice: 「幸いです」とする。
  alternative: 「幸福です」「祝福されています」
  rationale: 神の評価と恵みを告げる含みを保ちつつ、原文が明示しない受動表現を補わず、祝福句の伝統的かつ自然な日本語にする。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祝福句としての品位を保った。「仲間外れ」は平易だが口語に崩れすぎず、社会的排除を直ちに理解できる表現として採用した。脚注記号は節末に置き、表現全体への注であることを示した。
