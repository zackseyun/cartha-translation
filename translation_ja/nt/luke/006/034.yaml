id: LUK.6.34
reference: Luke 6:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸀δανίσητε παρ’ ὧν ἐλπίζετε ⸀λαβεῖν, ποία ὑμῖν χάρις ἐστίν; ⸀καὶ ἁμαρτωλοὶ ἁμαρτωλοῖς δανίζουσιν ἵνα ἀπολάβωσιν τὰ ἴσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/034.yaml
  text: And if you lend to those from whom you expect to receive[a], what credit is that to you? Even sinners lend to sinners so that they may receive back the same amount.
translation:
  language: ja
  text: また、貸したものを返してもらえると期待する人に貸したとしても、あなたがたは、それによってどんな称賛を受けるでしょうか。[a] 罪人たちでさえ、同じだけ返してもらうために、罪人たちに貸します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それによってあなたがたはどんな感謝を受けるでしょうか」とも訳せる。ギリシア語のχάριςは「感謝」も意味するが、ここでは行為に対する称賛や好意的な評価を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δανίσητε / δανίζουσιν
  choice: 貸す
  rationale: 金銭や物を貸すことを表す一般的な動詞であり、現代日本語でも自然に金融上の意味を保てる。
- source_word: παρ’ ὧν
  choice: …人に
  rationale: 貸す相手を自然な日本語で示し、続く「返してもらえる」によって、その相手から受け取る関係も明確にした。
- source_word: ἐλπίζετε λαβεῖν
  choice: 貸したものを返してもらえると期待する
  rationale: ἐλπίζω の文脈上の「期待する」と、λαβεῖν の「受け取る」を、貸借の場面に即して明瞭に表した。単なる願望ではなく、返却を見込む意味を伝える。
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: それがあなたがたの何の称賛に値するでしょうか
  rationale: ここでの χάρις は救済論的な「恵み」よりも、行為に対する好意的評価や称賛を指す。修辞疑問として自然な日本語にした。
- source_word: ἁμαρτωλοὶ
  choice: 罪人たち
  rationale: 実体詞的に用いられた語の道徳的カテゴリーを、そのまま簡潔に保った。
- source_word: ἵνα ἀπολάβωσιν
  choice: 返してもらうために
  rationale: ἀπολαμβάνω の、貸したものを戻してもらうという返礼・返却の意味を自然に表した。
- source_word: τὰ ἴσα
  choice: 同じだけ
  rationale: 貸したものと等しい分を受け取る意味を示し、利息や利益まで含むとは限定しない表現にした。
theological_decisions:
- issue: イエスの修辞疑問における χάρις の意味
  choice: 救いの「恵み」ではなく、行為に対する「称賛」とした。
  alternative: 「感謝」「恵み」「益」
  rationale: 直前から反復される問いは、弟子たちの行為が罪人の行為と比べて何に値するかを問うている。抽象的な救済の恵みと断定せず、好意的評価という文脈上の意味を訳した。
- issue: 貸付けに対して期待される返却の性質
  choice: 「同じだけ返してもらう」とし、等価の返却を中立的に表した。
  alternative: 利息を受け取る／利益を加えて全額返済してもらう
  rationale: τὰ ἴσα は等しいもの・同等の分を示すため、利息や利得を本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの修辞疑問の厳粛さを保った。「返してもらえる」「同じだけ」は日常的で理解しやすく、貸借の文脈も明確である。
