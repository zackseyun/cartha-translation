  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐγένετο ἡμέρα, προσεφώνησεν τοὺς μαθητὰς αὐτοῦ, καὶ ἐκλεξάμενος ἀπ’ αὐτῶν δώδεκα, οὓς καὶ ἀποστόλους ὠνόμασεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/013.yaml
  text: And when day came[a], he called his disciples, and chose twelve from among them[b], whom he also named apostles.
translation:
  language: ja
  text: 夜が明けると、イエスは弟子たちを呼び寄せ[a]、その中から十二人を選び、その十二人を使徒と名づけた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「弟子たちに呼びかけ」。ギリシア語の動詞は「呼びかける」「話しかける」という意味にも取れるが、ここでは十二人を選ぶために弟子たちを呼び集めた文脈と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その十二人を使徒とも呼んだ」。「名づけた」と「呼んだ」のどちらにも訳せる。本文では、前の「呼び寄せ」と区別するため「名づけた」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡμέρα
  choice: 夜が明けると
  rationale: 昼になったことを示す時間表現を、文脈に即した自然な現代日本語で表した。
- source_word: προσεφώνησεν
  choice: 呼び寄せ
  rationale: この文脈では、選任のため弟子たちを自分のもとに集める意味が中心である。「呼びかけた」も語義上可能だが、ここでは集合の動作が明確な表現を採った。
- source_word: μαθητὰς
  choice: 弟子たち
  rationale: 福音書における標準的で分かりやすい訳語であり、師に従って学ぶ者という関係性を保つ。
- source_word: ἐκλεξάμενος
  choice: 選び
  rationale: 十二人をより大きな弟子の集団から選定した動作を、簡潔かつ自然に表す。
- source_word: ἀπ’ αὐτῶν
  choice: その中から
  rationale: 十二人が弟子たちの集団の中から選ばれたというἀπόの文脈上の意味を明確にする。
- source_word: δώδεκα
  choice: 十二人
  rationale: 日本語では人物を数えるため「人」を補い、自然にした。
- source_word: ἀποστόλους
  choice: 使徒
  rationale: ここでは単なる「遣わされた者」ではなく、イエスが十二人に与えた呼称として機能するため、定着した訳語を用いた。
- source_word: ὠνόμασεν
  choice: 名づけた
  rationale: 呼称を与えたことを示し、前の「呼び寄せ」と区別する。「使徒と呼んだ」も可能である。
theological_decisions:
- issue: ἀποστόλουςを一般的な意味の「遣わされた者」とするか、称号として「使徒」とするか
  choice: 使徒
  alternative: 遣わされた者／使者
  rationale: この箇所では、十二人に与えられる名称として用いられている。「使徒」は物語上の称号としての働きを保ちつつ、それ以上の教派的主張を加えない。
- issue: προσεφώνησενを発話として訳すか、召集として訳すか
  choice: 呼び寄せ
  alternative: 呼びかけた
  rationale: 語そのものには呼びかける意味もあるが、続く十二人の選任という文脈では、弟子たちを自分のもとへ集めた動作として理解するのが自然である。ただし語義上の別の可能性は脚注に残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「イエス」はギリシア語本文では代名詞だが、日本語で主語を明確にし、単独節としての可読性を確保するため補った。二つの異なる動詞προσεφώνησενとὠνόμασενは「呼び寄せ」「名づけた」と訳し分けた。
