  text: Οὐ γάρ ἐστιν δένδρον καλὸν ποιοῦν καρπὸν σαπρόν, οὐδὲ ⸀πάλιν δένδρον σαπρὸν ποιοῦν καρπὸν καλόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/043.yaml
  text: For there is no good tree producing rotten fruit, nor again a rotten tree producing good fruit.
translation:
  language: ja
  text: というのは、良い木が腐った実を結ぶことはなく、また、腐った木が良い実を結ぶこともない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悪い実」「悪い木」とも訳せる。ギリシア語σαπρόςは、「腐った」「傷んだ」「悪い」などの意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ γάρ ἐστιν
  choice: …ことはなく
  rationale: 存在を否定する構文を、直前の文脈を受ける説明の流れも保ちながら自然な日本語にした。γάρは独立した接続語にせず、文脈上のつながりに含ませた。
- source_word: δένδρον καλὸν
  choice: 良い木
  rationale: καλόςの農業的意味と倫理的含意の両方を限定せずに保つ。
- source_word: ποιοῦν καρπὸν
  choice: 実を結ぶ
  rationale: 木が果実を生じることを表す自然な日本語で、分詞の継続的・特徴的な働きを伝える。
- source_word: σαπρόν
  choice: 腐った
  rationale: 単なる『悪い』よりも、傷んで役に立たない果実や木という具体的な比喩を保持する。
- source_word: οὐδὲ πάλιν
  choice: また…もない
  rationale: 第二の否定を並列し、πάλινが示す反対側からの対応を自然な日本語で表す。
- source_word: καρπὸν καλόν
  choice: 良い実
  rationale: 前半との対照と語彙上の並行を保つ。
theological_decisions:
- issue: 農業的比喩と道徳的含意の強さ
  choice: σαπρόςを『腐った』と訳す
  alternative: 『悪い』『傷んだ』
  rationale: 具体的な農業的イメージを本文に残し、道徳的意味を訳語によって先回りして限定しないため。
translation_notes:
  register: 現代の一般読者に明瞭な標準語。格言らしい簡潔さと前後半の対称性を保ち、『実を結ぶ』で自然かつ品位ある聖書表現とした。
