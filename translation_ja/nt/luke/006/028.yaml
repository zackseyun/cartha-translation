base_translation:
  language: en
  yaml_path: translation/nt/luke/006/028.yaml
  text: Bless those who curse you[a]; pray for those who mistreat you.
translation:
  language: ja
  text: あなたがたを呪う者を祝福し、あなたがたをひどく扱う者[a]のために祈りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ひどく扱う」は、「侮辱する」または「虐待する」とも訳せる。ギリシア語は、敵意を伴う不当な扱いを幅広く表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐλογεῖτε
  choice: 祝福しなさい
  rationale: 複数への命令形。日本語の聖書語として定着しつつ、相手のために祝福を願うという、呪いとの鮮明な対照を保つ。後続の命令と自然につなぐため、本文では連用形「祝福し」を用いた。
- source_word: τοὺς καταρωμένους ὑμᾶς
  choice: あなたがたを呪う者
  rationale: 冠詞付き分詞を実体的に訳し、相手に呪いを向ける敵対的な言動を簡潔に表した。
- source_word: προσεύχεσθε
  choice: 祈りなさい
  rationale: 複数への現在命令形。継続的な態度を含み得るが、現代日本語では単純な命令形がその力を最も自然に伝える。
- source_word: περὶ τῶν ἐπηρεαζόντων ὑμᾶς
  choice: あなたがたをひどく扱う者のために
  rationale: περίは祈りの対象を示す「〜のために」とした。ἐπηρεάζωは侮辱、虐待、不当な扱いを含み得るため、特定の形に狭めない「ひどく扱う」を選んだ。
theological_decisions:
- issue: 敵を愛する命令の範囲
  choice: 敵対する者への祝福と祈りを、説明を加えず直接的な倫理命令として訳す。
  alternative: 報復しないことや赦しなどの教理的説明を本文に補う。
  rationale: 原文は敵意への応答を端的に命じており、翻訳でその緊張を解消したり、特定の教派的説明を加えたりすべきではない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「祝福する」「祈る」は一般にも理解可能で、本文の宗教的・倫理的重みを保つ。脚注記号は該当表現の直後ではなく節末に置き、文の流れを妨げない形とした。
