  text: αὐτοὶ δὲ ἐπλήσθησαν ἀνοίας, καὶ διελάλουν πρὸς ἀλλήλους τί ἂν ποιήσαιεν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/011.yaml
  text: But they were filled with rage[a], and they discussed with one another what they might do to Jesus.
translation:
  language: ja
  text: ところが、彼らはすっかり分別を失い、イエスをどうしようかと互いに話し合っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτοὶ δὲ
  choice: ところが、彼らは
  rationale: δὲの対照を自然な現代日本語の「ところが」で表した。αὐτοὶの強調は主語「彼らは」によって文脈上十分に伝わり、「彼ら自身は」のような不自然な硬さを避けた。
- source_word: ἐπλήσθησαν ἀνοίας
  choice: 無分別な怒りに満たされ[a]
  rationale: 受動の比喩「満たされ」を保ちつつ、ἄνοιαの中核である分別・理性の欠如と、この文脈での激しい敵意を合わせて表した。ἄνοια自体が単純に「怒り」を意味するわけではないため、注で直訳と語義の幅を明示した。
- source_word: διελάλουν πρὸς ἀλλήλους
  choice: 互いに話し合っていた
  rationale: 未完了過去の継続的な相談・協議を「話し合っていた」で表し、πρὸς ἀλλήλουςの相互性を「互いに」で示した。
- source_word: τί ἂν ποιήσαιεν
  choice: どうしようか
  rationale: τίとἄνを伴う希求法が示す間接的な熟慮・可能性を、自然な日本語の「どうしようか」で表した。「何をすべきか」ほど義務を強めず、「何ができるか」ほど能力に限定しない。
- source_word: τῷ Ἰησοῦ
  choice: イエスを
  rationale: ποιέωと与格が表す、イエスに向けて何らかのことをするという意味を、日本語の慣用的な「イエスをどうしようか」で表した。「イエスに対して何をするか」より自然であり、「イエスを害する」と敵意の具体的内容を限定しない。
theological_decisions:
- issue: ἀνοίαςを心理的な「狂気」とするか、道徳的・理性的な無分別と激しい敵意を表すか
  choice: 無分別な怒り
  alternative: 無分別／愚かさ／狂気
  rationale: 安息日の癒やしに対する彼らの反応には敵意と感情的激しさがあるが、ἄνοιαの語義の中心は理性や分別の欠如にある。「無分別な怒り」は両面を文脈的に表しつつ、現代的な精神疾患の含みを避ける。語そのものの曖昧さは脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述体。「話し合っていた」により継続的な協議を示し、「どうしようか」により企ての内容を原文以上に具体化しない。
