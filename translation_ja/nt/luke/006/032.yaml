source:
  edition: SBLGNT
  text: Καὶ εἰ ἀγαπᾶτε τοὺς ἀγαπῶντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; καὶ γὰρ οἱ ἁμαρτωλοὶ τοὺς ἀγαπῶντας αὐτοὺς ἀγαπῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/032.yaml
  text: And if you love those who love you[a], what credit is that to you? For even sinners love those who love them.
translation:
  language: ja
  text: あなたがたが自分を愛する人たちを愛するなら、あなたがたに何の評価があるでしょうか。[a] というのも、罪人たちでさえ、自分を愛する人たちを愛しているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたにどんな恵みがあるでしょうか」。ギリシア語の「カリス」は「恵み」「好意」「称賛」などを意味する。ここでは、称賛に値する点、または好意的な評価を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾶτε / ἀγαπῶντας / ἀγαπῶσιν
  choice: 愛する／愛してくれる
  rationale: 三つの用例をすべて「愛する」で結び、原文の反復を保った。分詞は日本語として自然な「愛してくれる人たち」とした。
- source_word: ποία
  choice: 何の
  rationale: χάριςと組み合わせた修辞疑問を、自然な日本語で簡潔に表した。
- source_word: χάρις
  choice: 称賛
  rationale: ここでは救済論的な「恵み」よりも、行為に対する好意的評価・称賛を指す。「称賛」は文脈上の倫理的な対比を明確にしつつ、語の幅は脚注で示した。
- source_word: ἁμαρτωλοὶ
  choice: 罪人たち
  rationale: 実詞的な形容詞を、新約聖書で一般的かつ直接的な表現として訳した。
- source_word: καὶ γὰρ
  choice: でさえ
  rationale: γάρの説明的関係は文の連続によって自然に伝え、καίの強調を「でさえ」で明示した。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 与格の関係を保ち、「あなたがたに何の称賛があるか」という日本語にした。
theological_decisions:
- issue: イエスの言葉におけるχάριςの意味
  choice: 救済論的な「恵み」ではなく、行為への「称賛」
  alternative: 恵み／感謝／報い
  rationale: 直後の説明は、愛を返してくれる相手だけを愛することに何の評価すべき点があるのかを問うている。ただしχάρις本来の意味の広がりを失わせないため、脚注に別訳を示した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、修辞疑問の力と「愛する」の三度の反復を保った。「愛してくれる」は相互性を自然に示す。「称賛」はやや格調を保ちながら一般読者にも理解しやすい。
