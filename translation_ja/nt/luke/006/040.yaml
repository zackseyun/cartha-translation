id: LUK.6.40
reference: Luke 6:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν ⸀διδάσκαλον, κατηρτισμένος δὲ πᾶς ἔσται ὡς ὁ διδάσκαλος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/040.yaml
  text: A disciple is not above his teacher[b][a], but everyone when fully trained will be like his teacher.
translation:
  language: ja
  text: 弟子は師より上にいることはない。しかし、十分に訓練された者は皆、自分の師のようになる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「十分に整えられた者は皆、自分の師のようになる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μαθητής
  choice: 弟子
  rationale: 単なる学習者ではなく、師に従って教えと人格的な形成を受ける者という関係的な意味を保つ。
- source_word: ὑπὲρ
  choice: 超える
  rationale: ここでは地理的な「上」ではなく、身分・到達度において師より上であることを表すため、現代日本語として自然な「超える」とした。
- source_word: διδάσκαλος
  choice: 師
  rationale: 「教師」よりも、弟子との継続的で人格的な形成関係を自然に表し、この格言の簡潔で荘重な調子にも合う。
- source_word: κατηρτισμένος
  choice: 十分に訓練された
  rationale: 完了受動分詞が示す、整えられ訓練を受けた状態を文脈に即して表す。「完成された」として過度な完全性を読み込まない。
- source_word: πᾶς
  choice: 者は皆
  rationale: 男性単数形の一般的用法を、日本語で包括的かつ自然に表す。
- source_word: ὡς
  choice: のようになる
  rationale: 師との比較を明確に示す。
- source_word: αὐτοῦ
  choice: 自分の
  rationale: 弟子ないし訓練された各人と、その人の師との個別の対応関係を、性を不必要に補わず自然な日本語で保つ。
theological_decisions:
- issue: κατηρτισμένος が示す形成の程度と性質
  choice: 十分に訓練された
  alternative: 整えられた／完成された
  rationale: 弟子と師という文脈では訓練・形成が中心だが、語には「整える、備える」という幅がある。そのため本文では自然な文脈訳を採用し、脚注で語義の幅を示す。
- issue: 一般的な男性単数表現
  choice: 「者は皆、自分の師」とする
  alternative: 「すべての人は、その師」とする
  rationale: 日本語には文法的性の一致がないため、性別を補わずに一般性と単数的な対応関係を保持する。
translation_notes:
  register: 明瞭な現代標準日本語。格言としての簡潔さと品位を保つため「弟子」「師」を用いた。脚注記号は該当する後半句の末尾に置いた。
