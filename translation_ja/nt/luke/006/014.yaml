  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σίμωνα
  choice: シモン
  rationale: この使徒を指す新約聖書で定着した日本語表記を用いた。
- source_word: ὃν καὶ ὠνόμασεν Πέτρον
  choice: イエスは彼をペテロとも名づけた
  rationale: ὀνομάζωの命名の意味を「名づけた」で表し、主語を日本語で明確にするため文脈上の「イエス」を補った。καίは「とも」として反映した。
- source_word: Πέτρον
  choice: ペテロ
  rationale: 日本語聖書で広く定着している人名表記を採用した。
- source_word: Ἀνδρέαν
  choice: アンデレ
  rationale: 日本語聖書で広く定着している人名表記を採用した。
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: その兄弟
  rationale: αὐτοῦが直前のシモンを指す関係を自然な日本語で表した。ἀδελφόςはここでは実の兄弟を意味する。
- source_word: Ἰάκωβον
  choice: ヤコブ
  rationale: ギリシア語名Ἰάκωβοςに対応し、日本語聖書でこの使徒に定着している表記を用いた。
- source_word: Ἰωάννην
  choice: ヨハネ
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: Φίλιππον
  choice: フィリポ
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: Βαρθολομαῖον
  choice: バルトロマイ
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: καὶ
  choice: 、
  rationale: 人名列挙に反復されるκαίは、現代日本語では読点でつなぐのが自然であり、列挙関係は保持される。
