  source_fidelity: 原文は「人々があなたがたにしてほしいと望むとおりに、あなたがたも彼らに同じようにしなさい」という相互対応の命令である。改訂案は、καθὼςとὁμοίωςの対応、θέλετε＋ἵνα＋接続法が表す願望内容、ποιέωの広い「する」、および複数形の呼びかけを保つ。
  naturalness: 現行の「人にしてもらいたい」は意味を取り得るものの、「人から」を補うほうが、誰が行為者であるかを明瞭にし、日本語として滑らかである。また後半の「人にしなさい」は、文脈上は理解できても「人にする」と読める曖昧さがあるため、「人にも…しなさい」とするほうが明快である。
