  text: καὶ καθὼς θέλετε ἵνα ποιῶσιν ὑμῖν οἱ ⸀ἄνθρωποι, ποιεῖτε αὐτοῖς ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/031.yaml
  text: And just as you want people to do for you[a], do the same for them.
translation:
  language: ja
  text: 人からしてもらいたいと望むとおりに、あなたがたも人に同じようにしなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: …とおりに
  rationale: 行動の基準となる比較を示す。日本語として自然で、原文の「そのように」という対応関係を保つ。
- source_word: θέλετε
  choice: …たいと思う
  rationale: ここでは通常の願望や希望を表す。現代日本語で自然な表現を採った。
- source_word: ἵνα ποιῶσιν ὑμῖν οἱ ἄνθρωποι
  choice: 人にしてもらいたい
  rationale: ἵνα節は願う内容を示す。受益・被行為の関係を日本語の「してもらう」で簡潔に表した。ἄνθρωποιは男性に限定されないため、総称的な「人」とした。
- source_word: ποιεῖτε
  choice: しなさい
  rationale: 命令の力を明確に示す。現在命令形の継続的な含みは文脈上の倫理的原則として伝わるため、不自然な過剰明示を避けた。
- source_word: αὐτοῖς
  choice: 人に
  rationale: 前半の総称的な「人」と対応させ、相手に対する行為であることを自然に示した。
- source_word: ὁμοίως
  choice: 同じように
  rationale: 前半で望んだ行為と後半で命じられる行為との対応を明示し、原文の反復的な比較構造を保った。
theological_decisions:
- issue: οἱ ἄνθρωποι の総称性
  choice: 人
  alternative: 人々／男たち
  rationale: 文脈では人間一般を指し、男性だけを意味しない。「人」は日本語で自然な総称表現であり、適用範囲を不当に限定しない。
- issue: 黄金律の表現を「扱う」と意訳するか
  choice: する
  alternative: 接する／扱う
  rationale: ποιέω の広い意味と前後の反復を保ち、行為の内容を特定の対人態度だけに狭めない。
translation_notes:
  register: 明快で簡潔な現代標準日本語。命令形は威圧的になりすぎず、教えとしての格調を保つ「しなさい」とした。原文にある καθὼς と ὁμοίως の対応を、「とおりに」と「同じように」で再現した。
