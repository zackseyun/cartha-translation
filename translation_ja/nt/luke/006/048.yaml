id: LUK.6.48
reference: Luke 6:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομοῦντι οἰκίαν ὃς ἔσκαψεν καὶ ἐβάθυνεν καὶ ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν· πλημμύρης δὲ γενομένης προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ, καὶ οὐκ ἴσχυσεν σαλεῦσαι αὐτὴν ⸂διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/048.yaml
  text: He is like a man building a house[a], who dug deep and laid a foundation on the rock. And when a flood came, the river burst against that house and was not able to shake it, because it had been well built.
translation:
  language: ja
  text: その人は、家を建てる人に似ている。その人は深く掘り下げ、岩の上に土台を据えた。洪水が起こると、川はその家に激しくぶつかったが、揺り動かすことができなかった。その家がよく建てられていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: その人は、…人に似ている
  rationale: 直前の文脈で示される人物を、たとえの中の一人の建築者と直接比較する表現として、自然な現代日本語にした。
- source_word: οἰκοδομοῦντι οἰκίαν
  choice: 家を建てる
  rationale: 現在分詞が描く建築中の人物像を、簡潔で日常的な表現で示した。
- source_word: ἔσκαψεν καὶ ἐβάθυνεν
  choice: 深く掘り下げ
  rationale: 二つの動詞による、掘って深くしたという強調を、一つの自然な日本語表現に保った。
- source_word: ἔθηκεν θεμέλιον ἐπὶ τὴν πέτραν
  choice: 岩の上に土台を据えた
  rationale: 建築の比喩を保ちつつ、θεμέλιονを「土台」、πέτραを解釈的な「岩盤」ではなく「岩」とした。
- source_word: πλημμύρης δὲ γενομένης
  choice: 洪水が起こると
  rationale: 属格独立構文の時間・状況関係を、出来事の発生として明瞭に表した。
- source_word: προσέρηξεν ὁ ποταμὸς τῇ οἰκίᾳ ἐκείνῃ
  choice: 川はその家に激しくぶつかった
  rationale: 動詞が示す激しい衝突を「激しくぶつかった」で伝え、ποταμόςは基本義に沿って「川」とした。
- source_word: οὐκ ἴσχυσεν σαλεῦσαι αὐτήν
  choice: 揺り動かすことができなかった
  rationale: 能力・力の不足と、家を不安定にする動きをともに保った。
- source_word: διὰ τὸ καλῶς οἰκοδομῆσθαι αὐτήν
  choice: その家がしっかり建てられていたからである
  rationale: 理由を示す構文と受動態を保ち、καλῶςを建築の堅固さが伝わる自然な「しっかり」で表した。
theological_decisions:
- issue: ἀνθρώπῳの性別と代表性
  choice: 人
  alternative: 男
  rationale: ἄνθρωποςは文法上男性単数だが、語彙自体は人間・人を広く指し得る。この箇所では建築者の性別を明示する必要がないため「人」とし、単数の代表例であることは保った。
translation_notes:
  register: 明快な現代標準日本語を用い、たとえの力強い動きを保った。「据えた」「揺り動かす」「しっかり建てられていた」により、平易さと聖書本文としての品位を両立させた。
