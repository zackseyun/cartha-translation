    rationale: οἱ μετ’ αὐτοῦ ὄντες は字義的に「彼と共にいた者たち」であり、従者・家来を意味する語ではない。身分や関係性を限定しない訳語へ改める必要がある。
  - severity: low
    issue: 「そこで」
    rationale: καί はここでは基本的な接続であり、「そこで」は前文からの結果・展開をやや明示しすぎるため、「イエスは」とするほうが安全である。
