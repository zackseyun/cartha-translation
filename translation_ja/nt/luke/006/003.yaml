  yaml_path: translation/nt/luke/006/003.yaml
  text: And Jesus answered them, “Have you not even read this, what David did when he was hungry, he and those who were with him?”
translation:
  language: ja
  text: イエスは彼らに答えられた。「ダビデ自身と彼と一緒にいた人たちが空腹になったとき、ダビデが何をしたかを、あなたがたはこのことさえ読んだことがないのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: 答えた
  rationale: 分詞と定動詞を重ねるコイネー・ギリシア語の慣用表現を、自然な現代日本語で簡潔に表した。
- source_word: πρὸς αὐτούς
  choice: 彼らに
  rationale: 応答の相手を明示し、日本語として自然な「彼らに答えた」とした。
- source_word: Οὐδὲ τοῦτο ἀνέγνωτε
  choice: このことさえ読んだことがないのですか
  rationale: οὐδέ の強意を「さえ」で保ち、聖書を読んで知っているはずだという修辞疑問の響きを自然な日本語で表した。
- source_word: ὃ ἐποίησεν Δαυίδ
  choice: ダビデが…何をしたか
  rationale: 間接疑問に近い内容を自然な日本語の語順で示し、原文の指示内容を保った。
- source_word: ὁπότε ἐπείνασεν
  choice: 空腹になったとき
  rationale: アオリストの出来事性を「なった」で表し、簡潔な時間節とした。
- source_word: αὐτὸς καὶ οἱ μετ’ αὐτοῦ ὄντες
  choice: 自分も供の者たちも
  rationale: ダビデ本人と同行者の双方が空腹だったことを明示する。「供の者たち」は同行していた人々を簡潔かつ品位ある日本語で表す。
