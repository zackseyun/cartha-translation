  source_fidelity: 「供の者たち」は原文の οἱ μετ’ αὐτοῦ ὄντες（彼と一緒にいた人たち）を「従者・家来」と狭めており、本文にない身分関係を加える。「そこで」も単なる接続詞 καί に因果・帰結の含みを与えうる。
