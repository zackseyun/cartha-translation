reference: Luke 6:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἕκαστον γὰρ δένδρον ἐκ τοῦ ἰδίου καρποῦ γινώσκεται· οὐ γὰρ ἐξ ἀκανθῶν συλλέγουσιν σῦκα, οὐδὲ ἐκ βάτου ⸂σταφυλὴν τρυγῶσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/044.yaml
  text: For each tree is known by its own fruit[a]. For they do not gather figs from thorns[b], nor do they harvest grapes from a bramble bush.
translation:
  language: ja
  text: というのも、木はそれぞれ自分の実によって見分けられる。茨からいちじくを集めることはなく、いばらの茂みからぶどうを収穫することもない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστον ... δένδρον
  choice: 木はそれぞれ
  rationale: 単数形とἕκαστονの配分的な意味を、自然な現代日本語で表した。
- source_word: γὰρ
  choice: というのも……からである／文脈上の理由説明として表現
  rationale: 最初のγάρが直前の教えを説明する働きを「というのも……からである」で示した。二つ目のγάρは同じ説明を具体例で裏づけるため、日本語では接続語を重ねず、文の連続によってその論理を保った。
- source_word: ἐκ τοῦ ἰδίου καρποῦ γινώσκεται
  choice: その実によって見分けられる
  rationale: ἐκの判断根拠を「によって」で示し、γινώσκεταιの習慣的・一般的な認識を「見分けられる」とした。ἰδίουは「その」によって各々の木自身の実との対応を保った。
- source_word: ἀκανθῶν
  choice: 茨
  rationale: とげのある植物を広く指す語として、簡潔で一般的な「茨」を用いた。
- source_word: συλλέγουσιν σῦκα
  choice: いちじくを集める
  rationale: συλλέγωの一般的な採集の意味と、σῦκαの複数的な産物を自然に表した。
- source_word: βάτου
  choice: いばらの茂み
  rationale: 単なる低木ではなく、からみ合うとげのある低木・茂みという語感を保ち、ἀκάνθωνとの完全な同一化を避けた。
- source_word: σταφυλὴν τρυγῶσιν
  choice: ぶどうを摘み取る
  rationale: τρυγάωが熟した果実、特にぶどうの収穫に用いられることを、自然な日本語の「摘み取る」で表した。単数形のσταφυλήは日本語では集合的な「ぶどう」とした。
theological_decisions:
- issue: 実の比喩が指すもの
  choice: 農業上の比喩をそのまま残し、道徳的性質や行いと明示しない
  alternative: 「行い」「人格」などを訳文に補って比喩を解釈する
  rationale: 原文はこの節で適用対象を明文化せず、木と実の対応関係をことわざ的に述べる。文脈上の含意は保ちつつ、訳文で一つの解釈に限定しないため。
translation_notes:
  register: 明瞭な現代標準語を用い、ことわざ的な荘重さを保った。「というのも……からである」は前節との説明関係を示しつつ、日常語に偏りすぎない文体とした。
