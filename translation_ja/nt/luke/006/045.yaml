id: LUK.6.45
reference: Luke 6:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἀγαθὸς ἄνθρωπος ἐκ τοῦ ἀγαθοῦ θησαυροῦ τῆς καρδίας ⸀αὐτοῦ προφέρει τὸ ἀγαθόν, καὶ ὁ ⸀πονηρὸς ἐκ τοῦ ⸀πονηροῦ προφέρει τὸ πονηρόν· ἐκ γὰρ ⸀περισσεύματος καρδίας λαλεῖ τὸ στόμα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/045.yaml
  text: The good man brings forth what is good out of the good treasure of his heart[a], and the evil man out of his evil treasure brings forth what is evil; for out of the overflow of the heart his mouth speaks.
translation:
  language: ja
  text: 善い人は心の善い蓄えから善を取り出し、悪い人は悪い蓄えから悪を取り出す。というのも、口は心に満ちあふれていることを語るからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「口は心の豊かさを語るからである。」
    reason: περισσεύματοςは「満ちあふれ」のほか、「豊かさ」「豊富にあるもの」とも訳せるため。
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἄνθρωπος / ὁ πονηρὸς
  choice: 善い人／悪い人
  rationale: 代表的な人間を指す対照表現として、現代日本語で自然かつ倫理的な意味が明確になるように訳した。ἀγαθόςとπονηρόςの道徳的対比を保っている。
- source_word: θησαυρός
  choice: 蓄えられた…もの
  rationale: 内に貯えられ、そこから外へ取り出されるものという比喩を、日本語として明瞭に伝えるため。「宝」と直訳すると財宝そのものと誤解されやすい。
- source_word: καρδία
  choice: 心
  rationale: 意志、思い、感情を含む内なる人を表す標準的で自然な訳語。
- source_word: προφέρει
  choice: 取り出す
  rationale: 内に蓄えられたものを外へ持ち出すという語の動きを保ち、二つの節で対称的に訳した。
- source_word: περίσσευμα
  choice: 満ちあふれているもの
  rationale: 単なる量の多さだけでなく、満ちて外に現れる含意を自然な日本語で表した。
- source_word: τὸ στόμα αὐτοῦ λαλεῖ
  choice: その人の口が語る
  rationale: 「口」を明示する原文の身体的比喩を保持し、心の内が外に表れることを際立たせた。
theological_decisions:
- issue: ἀγαθόςとπονηρόςによる人間の倫理的対照
  choice: 「善い人」と「悪い人」という道徳的区分を保つ
  alternative: 「良い人／良くない人」または機能的な表現に弱める
  rationale: この箇所は人の内面の道徳的性質と、その外的な表れを対照しているため、倫理的な力を弱めない。
- issue: 心と発言の因果関係
  choice: 心に満ちているものを口が語る、と訳す
  alternative: 発言は心を反映する、と説明的に意訳する
  rationale: 原文の因果関係と「心／口」の比喩をそのまま保ち、特定の人間論へ過度に展開しない。
translation_notes:
  register: 明快な現代標準日本語。格調を保ちながら古風な言い回しを避けた。「善い」は道徳的な善を示すため漢字表記とし、「心」と「口」の対照を保持した。
