id: LUK.6.24
reference: Luke 6:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν οὐαὶ ὑμῖν τοῖς πλουσίοις, ὅτι ἀπέχετε τὴν παράκλησιν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/024.yaml
  text: But woe to you who are rich[b][a], for you have received your comfort.
translation:
  language: ja
  text: しかし、富んでいるあなたがたには災いがある。あなたがたはすでに自分の慰め[b]を受けている[a]からだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受けている」と訳した語には、「受けるべきものをすべて受け取っている」という意味合いもある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「慰安」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: しかし
  rationale: 直前の幸いの宣言との強い対照を、明瞭で自然な現代日本語で示す。
- source_word: οὐαὶ ὑμῖν
  choice: あなたがたは災いだ
  rationale: 預言的な警告と断罪の厳粛さを保ち、単なる嘆きに弱めない直接的な表現。
- source_word: τοῖς πλουσίοις
  choice: 富んでいるあなたがた
  rationale: 実質的に名詞として用いられた形容詞による直接の呼びかけを保ち、「富を頼る者」など原文にない限定を加えない。
- source_word: ἀπέχετε
  choice: すでに…受けている
  rationale: 現在形の状態的な意味と、すでに受領しているという含みを自然な日本語で表す。「全額受け取る」に相当する完了的・商取引的な語感は脚注に残す。
- source_word: παράκλησιν
  choice: 慰め
  rationale: この文脈における comfort/consolation の意味を、一般読者に明瞭な語で表す。
- source_word: ὑμῶν
  choice: 自分の
  rationale: 主語と同一の複数二人称を指す所有を、日本語として自然に示す。
theological_decisions:
- issue: 富んでいる者への警告の性質
  choice: 富んでいる者を直接「災いだ」と告げる
  alternative: 「ああ、富んでいる人たちよ」と哀惜的に訳す、または「富を頼りにする者」と限定する
  rationale: 原文は富んでいる者を直接指して οὐαί を宣告している。厳しさを保つ一方、その理由を原文以上に説明しない。
- issue: ἀπέχετε の時間的・慣用的な力
  choice: 本文では「すでに…受けている」とし、現在の受領・所有を表す
  alternative: 「すっかり受け取ってしまった」「全額受け取った」
  rationale: 現在形を尊重しつつ、すでに受領済みであるという慣用的な含みも示す。『全額受領』のニュアンスを断定せず脚注に置き、語義上の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの警告の厳粛さと直接性を保った。「災いだ」は日常会話より格調があるが、聖書の預言的宣告として自然である。
