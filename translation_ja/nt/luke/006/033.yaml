  text: ⸀καὶ ἐὰν ἀγαθοποιῆτε τοὺς ἀγαθοποιοῦντας ὑμᾶς, ποία ὑμῖν χάρις ἐστίν; ⸁καὶ οἱ ἁμαρτωλοὶ τὸ αὐτὸ ποιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/033.yaml
  text: And if you do good to those who do good to you[a], what credit is that to you? Even sinners do the same.
translation:
  language: ja
  text: また、あなたがたによくしてくれる人によくするなら、あなたがたはどんな評価を受けるでしょうか。[a] 罪人たちでさえ、同じことをしています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたにどんな恵みがあるでしょうか」とも訳せる。ギリシア語は「恵み」「好意」「感謝」「評価」などを意味し得る。ここでは、自分によくしてくれる人によくするという相互的な行為に対する、特別な好意的評価を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαθοποιῆτε / ἀγαθοποιοῦντας
  choice: よくする／よくしてくれる人
  rationale: この動詞は、他者のために善を行い、益をもたらすことを表す。同じ日本語表現を反復して、原文にある動詞と分詞の語彙的な対応を保った。
- source_word: ποία ὑμῖν χάρις ἐστίν
  choice: あなたがたは何の称賛を受けるでしょうか
  rationale: この文脈の χάρις は救いに関する「恵み」よりも、その行為に対して与えられる好意的な評価や称賛を指す。修辞疑問として自然な日本語にした。
- source_word: οἱ ἁμαρτωλοί
  choice: 罪人たち
  rationale: ルカ福音書における社会的・宗教的な呼称を弱めず、標準的で直接的に訳した。
- source_word: τὸ αὐτὸ ποιοῦσιν
  choice: 同じことをしています
  rationale: 原文の簡潔な表現を、明瞭で自然な現代日本語で再現した。
- source_word: καί
  choice: また／でさえ
  rationale: 最初の καί は並行する教えの流れを示す「また」とし、二つ目は強意的な働きを「でさえ」で表した。
theological_decisions:
- issue: 倫理的教えにおける χάρις の意味
  choice: 称賛
  alternative: 恵み、好意、感謝、評価
  rationale: ここでは、互いに善を返すだけの行為が特別な好意的評価に値するかが問われている。「恵み」と直訳して救済論的な意味に限定することは避けつつ、原語の意味の幅は脚注で示した。
translation_notes:
  register: 明瞭で自然な現代標準語を用い、イエスの一連の修辞疑問にふさわしい簡潔で dignified な調子とした。「よくする」の反復により原文の語彙的対応を保ち、「罪人たちでさえ」で後半の強調を示した。
