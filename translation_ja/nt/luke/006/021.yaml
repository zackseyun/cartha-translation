  text: μακάριοι οἱ πεινῶντες νῦν, ὅτι χορτασθήσεσθε. μακάριοι οἱ κλαίοντες νῦν, ὅτι γελάσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/021.yaml
  text: Blessed are you who are hungry now[a], because you will be filled. Blessed are you who weep now[b], because you will laugh.
translation:
  language: ja
  text: '今、飢えているあなたがた[a]は幸いです。あなたがたは満たされる[b]からです。


    今、泣いているあなたがたは幸いです。あなたがたは笑うからです。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「今、飢えている人々は幸いです……今、泣いている人々は幸いです」。ギリシア語は冠詞付き分詞ですが、後続する動詞と文脈は二人称への直接の呼びかけを示しています。
    reason: alternative_reading
  - marker: b
    text: または「十分に満足させられる」。この語は食物で腹が満たされることを表し、広く十分な充足を指すこともあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριοι
  choice: 幸いです
  rationale: イエスの幸いの宣言として定着した重みを保ちつつ、現代日本語で自然かつ明瞭である。「幸福です」より主観的感情に限定されにくい。
- source_word: οἱ πεινῶντες
  choice: 飢えているあなたがた
  rationale: 冠詞付き現在分詞の継続的状態を表し、後続する二人称複数の動詞と文脈上の直接呼びかけを日本語で明示する。
- source_word: νῦν
  choice: 今
  rationale: 現在の欠乏と将来の逆転との時間的対照を簡潔に保つ。
- source_word: χορτασθήσεσθε
  choice: あなたがたは満たされる
  rationale: 食物によって腹が満ちるという具体的な像と、より広い充足の含みの双方を残す。受動態も保持し、満たす主体を補わない。
- source_word: οἱ κλαίοντες
  choice: 泣いているあなたがた
  rationale: κλαίωの具体的な『泣く』を保ち、死別に限定され得る『悲しむ』を避ける。現在分詞の継続性と直接呼びかけも表す。
- source_word: γελάσετε
  choice: あなたがたは笑うようになる
  rationale: γελάωの具体的な『笑う』を保持する。『喜ぶ』と抽象化せず、現在の涙との鮮明な逆転を示す。日本語では『笑うようになる』により将来の状態変化を自然に表す。
- source_word: ὅτι
  choice: からです
  rationale: 幸いである理由を導く因果関係を、明瞭な現代日本語で示す。
theological_decisions:
- issue: 直接呼びかけか、一般的な第三人称の幸いの宣言か
  choice: 「飢えているあなたがた」「泣いているあなたがた」と直接呼びかける。
  alternative: 「飢えている人々」「泣いている人々」
  rationale: ギリシア語の主語は冠詞付き分詞だが、約束の動詞は二人称複数であり、周囲の文脈も弟子たちへの直接の語りかけである。脚注で形式上可能な第三人称訳も示す。
- issue: 約束された逆転の性質
  choice: 「満たされる」「笑う」という具体的表現を保ち、実現の時期や様態を特定しない。
  alternative: 霊的充足または終末時の逆転に限定して訳す。
  rationale: 本文自体は逆転を約束するが、それが時間的、霊的、終末論的のいずれであるかをこの節だけでは限定していないため、解釈上の緊張を残す。
- issue: χορτασθήσεσθε の受動態における行為者
  choice: 「満たされる」とし、満たす主体を明示しない。
  alternative: 「神が満たしてくださる」
  rationale: 神的受動の可能性はあるが、原文は行為者を明記していないため、訳文でも補わない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。『幸いです』でルカの幸いの宣言の形式を保ち、現在の欠乏と将来の逆転を短い二文で際立たせた。二人称複数は『あなたがた』と明示し、原文の具体的な身体像を維持した。
