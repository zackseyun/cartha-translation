id: LUK.6.30
reference: Luke 6:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀παντὶ αἰτοῦντί σε δίδου, καὶ ἀπὸ τοῦ αἴροντος τὰ σὰ μὴ ἀπαίτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/030.yaml
  text: Give to everyone who asks you[a], and from the one who takes what is yours, do not demand it back.
translation:
  language: ja
  text: あなたに求める人には皆、与えなさい。あなたのものを持って行く人に、それを返すよう要求してはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたのものを持って行く人に、返還を求めてはならない」。
    reason: ἀπαιτέωは、取られたものを返すよう求める、または返還を要求することを表す。
lexical_decisions:
- source_word: παντὶ αἰτοῦντί σε
  choice: あなたに求める人には、だれにでも
  rationale: παντίの分配的で広い範囲と、αἰτοῦντί σεの「あなたに求める」を、自然な現代日本語で保った。「物乞いする」とすると、原文にない社会的立場を限定してしまう。
- source_word: δίδου
  choice: 与えなさい
  rationale: 現在命令形の直接的な命令を明確に表す。継続・習慣性を過度に明示せず、日本語として自然な形にした。
- source_word: ἀπὸ τοῦ αἴροντος τὰ σὰ
  choice: あなたのものを持って行く人から
  rationale: αἴρωの「取り去る、持って行く」という意味を表しつつ、「盗む」と法的・道徳的性格を限定しない。τὰ σὰは範囲を狭めない「あなたのもの」とした。
- source_word: μὴ ἀπαίτει
  choice: 取り戻そうとしてはならない
  rationale: ἀπαιτέωが持つ返還要求・回収の意味を自然に表す。「要求してはならない」より日本語として目的が明確であり、力ずくの奪還だけに限定しない。
theological_decisions:
- issue: イエスの倫理的命令の範囲と強さ
  choice: 普遍的で直接的な命令として訳す
  alternative: 誇張表現として弱める、施しだけに限定する、または窃盗の法的返還だけに限定する
  rationale: 原文は「だれにでも」に相当する広い表現と直接命令を用いている。適用を翻訳で限定せず、この言葉が持つ倫理的緊張を保つ。
translation_notes:
  register: 明快で現代的ながら、命令の厳粛さを保つ文体。「くれと言う人」などの口語に寄りすぎる表現は避けた。
