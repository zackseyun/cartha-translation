  to: 彼らは、イエスの話を聞き、自分たちの病気から癒やされるために来た。また、汚れた霊に苦しめられていた人々も癒やされていた。
  rationale: 受動不定詞ἰαθῆναιを「癒やされる」として直接反映し、ἀπόの分離・解放の意味を「病気から」で保った。「次々に」を削除して、ἐθεραπεύοντοの未完了過去が表す継続的な描写を「癒やされていた」で過不足なく表した。英語監査記録の「unclean spirits」の語彙的代替に関する注は、日本語本文では必須の曖昧さや本文異読を扱うものではないため、脚注は設けない。
