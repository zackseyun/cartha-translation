  text: οἳ ἦλθον ἀκοῦσαι αὐτοῦ καὶ ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν· καὶ οἱ ⸂ἐνοχλούμενοι ἀπὸ⸃ πνευμάτων ⸀ἀκαθάρτων ἐθεραπεύοντο·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/018.yaml
  text: who came to hear him and to be healed of their diseases[a]; and those troubled by unclean spirits were being healed.
translation:
  language: ja
  text: 彼らは、イエスの話を聞き、自分たちの病気から癒やされるために来た。また、汚れた霊に苦しめられていた人々も癒やされていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἳ ἦλθον
  choice: 彼らは…来ていた
  rationale: 前節の群衆を受ける関係節。日本語では独立した主題として自然につなぎ、場面の背景を示すアオリストを「来ていた」とした。
- source_word: ἀκοῦσαι αὐτοῦ
  choice: イエスの話を聞き
  rationale: 目的を表す不定詞。代名詞の指示対象を日本語で明確にし、「話を聞く」という自然な表現にした。
- source_word: ἰαθῆναι ἀπὸ τῶν νόσων αὐτῶν
  choice: 病気を治していただく
  rationale: 受動不定詞と分離を示すἀπόの意味を、敬意を保った自然な日本語で表した。「病気から癒やされる」より日常的で明瞭。
- source_word: ἐνοχλούμενοι ἀπὸ πνευμάτων ἀκαθάρτων
  choice: 汚れた霊に苦しめられていた
  rationale: ἐνοχλέωの継続的な被害・圧迫を「苦しめられる」で表し、ἀπόは原因・作用者として「に」とした。
- source_word: πνευμάτων ἀκαθάρτων
  choice: 汚れた霊
  rationale: 福音書で定着した聖書的表現を保ち、「悪霊」と言い換えて語義を狭めることを避けた。
- source_word: ἐθεραπεύοντο
  choice: 次々に癒やされていた
  rationale: 未完了過去受動態の進行・反復的な様相を、日本語で自然に伝えるため「次々に」と「ていた」を用いた。
theological_decisions:
- issue: πνευμάτων ἀκαθάρτωνの表現
  choice: 汚れた霊
  alternative: 悪霊／不浄な霊
  rationale: 人格的な霊的存在を指す文脈を保ちつつ、原語のἀκάθαρτοςを直接反映する伝統的で理解しやすい表現とした。
- issue: ἐθεραπεύοντοの時制・相
  choice: 次々に癒やされていた
  alternative: 癒やされた
  rationale: 未完了過去の継続または反復を平板化せず、場面の中で癒やしが進んでいたことを示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、福音書にふさわしい落ち着いた文体とした。前節から続く一文だが、単独でも読めるよう主語を明示した。
