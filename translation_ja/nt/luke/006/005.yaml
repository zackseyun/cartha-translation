id: LUK.6.5
reference: Luke 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν ⸀αὐτοῖς· Κύριός ἐστιν ⸂τοῦ σαββάτου ὁ υἱὸς τοῦ ἀνθρώπου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/005.yaml
  text: And he was saying to them[a], “The Son of Man is Lord of the Sabbath.”
translation:
  language: ja
  text: そして、彼らに言われた。「人の子は安息日の主である[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人の子は安息日を治める主である」。
    reason: 「安息日の主」という属格表現が、安息日に対する権威を意味することを明示する訳。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前の文脈とのつながりを自然に示しつつ、原文にない強い時間的意味を加えない。
- source_word: ἔλεγεν
  choice: 言われた
  rationale: 未完了過去形だが、ここでは発言を導入する物語上の用法として自然な日本語の単純過去で表した。「言っておられた」では、日本語で不必要に継続中の発話を強調する可能性がある。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 与格複数代名詞を、文脈上の相手を特定しすぎずにそのまま表す。
- source_word: Κύριος
  choice: 主
  rationale: 単なる敬称ではなく、安息日に対する権威を示す述語名詞であるため、「主人」ではなく、簡潔で定着した「主」とした。
- source_word: τοῦ σαββάτου
  choice: 安息日の
  rationale: κύριοςに続く属格を簡潔に保持し、安息日に関する支配権・権威を表す。「安息日を治める」は意味を明示するが、原文より説明的になる。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己指示的称号として定着しており、セム語的背景とダニエル書7章への関連可能性を保つ。
theological_decisions:
- issue: 安息日に対する「人の子」の権威というキリスト論的主張
  choice: 「人の子は安息日の主である」
  alternative: 「人の子は安息日を治める主である」
  rationale: 原文の属格構文を保ちながら、人の子が安息日に対して権威を持つという強い主張を明確に伝える。「さえ」「も」は本文に明示されないため加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「である」により宣言の簡潔さと重みを保ち、過度に古風な表現は避けた。
