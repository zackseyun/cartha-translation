id: LUK.6.17
reference: Luke 6:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ καταβὰς μετ’ αὐτῶν ἔστη ἐπὶ τόπου πεδινοῦ, καὶ ὄχλος ⸀πολὺς μαθητῶν αὐτοῦ, καὶ πλῆθος πολὺ τοῦ λαοῦ ἀπὸ πάσης τῆς Ἰουδαίας καὶ Ἰερουσαλὴμ καὶ τῆς παραλίου Τύρου καὶ Σιδῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/017.yaml
  text: And coming down with them[a], he stood on a level place, with a large crowd of his disciples and a great multitude of the people from all Judea and Jerusalem and the coastal region of Tyre and Sidon,
translation:
  language: ja
  text: イエスは彼らと一緒に下って、平らな場所[a]に立たれた。そこには、大勢の弟子たちと、ユダヤ全土、エルサレム、さらにティルスとシドンの沿岸地方から来た大勢の民衆がいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「平地に」。ギリシア語の句は直訳すると「平らな場所に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταβὰς μετ’ αὐτῶν
  choice: 彼らと一緒に下って来て
  rationale: アオリスト分詞の先行的な動作と下方への移動を、自然な日本語の連用形で表した。「彼ら」は直前の文脈にある一行を指すが、本文が明示する範囲を越えて特定しない。
- source_word: ἔστη
  choice: 立たれた
  rationale: ἵστημιの基本的な意味である、立つ位置を取ることを表す。イエスに対する日本語として自然な敬意を保ちつつ、過度な尊敬表現は避けた。
- source_word: ἐπὶ τόπου πεδινοῦ
  choice: 平らな場所に
  rationale: τόπος「場所」と πεδινός「平らな、平地の」を透明に反映し、広大な平原と断定しない訳とした。
- source_word: ὄχλος πολὺς μαθητῶν αὐτοῦ
  choice: イエスの弟子たちの大きな群れ
  rationale: ὄχλοςを「群れ」、πολύςを「大きな」とし、その群れが弟子たちから成るという属格の関係を明確にした。
- source_word: πλῆθος πολὺ τοῦ λαοῦ
  choice: おびただしい数の民衆
  rationale: πλῆθος πολύが示す非常に多数の集まりを「おびただしい数」で表し、λαόςは弟子の集団と区別される広い人々の集まりとして「民衆」とした。
- source_word: ἀπὸ πάσης τῆς Ἰουδαίας
  choice: ユダヤ全土から
  rationale: πάσηςの包括性を「全土」で自然に表した。
- source_word: Ἰερουσαλήμ
  choice: エルサレム
  rationale: 日本語聖書・一般用法で定着した地名表記を用いた。
- source_word: τῆς παραλίου Τύρου καὶ Σιδῶνος
  choice: ティルスとシドンの沿岸地方
  rationale: παράλιοςの海沿いという地理的意味を「沿岸地方」で表し、両都市に属する海岸地域を指す構造を保った。
theological_decisions:
- issue: 説教の舞台に関する地形表現
  choice: 平らな場所に
  alternative: 平地に
  rationale: ルカ本文の語彙的な幅を保ち、マタイの山上という舞台との調和や対立を訳文に持ち込まない。「平らな場所」は地形の規模を不必要に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体とした。原文では二つの集団が並置されるため、「弟子たちの大きな群れ」と「おびただしい数の民衆」を明確に区別した。日本語では名詞句だけの並置が不自然になるため、「そこには……がいた」と補って自然な文に整えた。
