  text: ⸀γίνεσθε οἰκτίρμονες ⸀καθὼς ὁ πατὴρ ὑμῶν οἰκτίρμων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/036.yaml
  text: Be merciful[a], just as your Father is merciful.
translation:
  language: ja
  text: あなたがたも、あなたがたの父が憐れみ深いように、憐れみ深く[a]ありなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「思いやり深く」。このギリシア語は、人への深い同情から憐れみを示す性質を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεσθε
  choice: ありなさい
  rationale: 現在命令形が示す継続的な生き方への勧めを、現代日本語で自然かつ簡潔に表す。「なりなさい」も可能だが、ここでは性質を身につけて保つよう求める文脈に適する。
- source_word: οἰκτίρμονες / οἰκτίρμων
  choice: 憐れみ深い
  rationale: 苦しむ者を気の毒に思い、憐れみを示す性質を表す。前半と後半で同じ語根の形容詞が用いられているため、訳語も統一した。
- source_word: καθὼς
  choice: ように
  rationale: 理由ではなく比較と模範を示す語として訳し、父の憐れみが弟子たちの行動の型であることを保つ。
- source_word: ὁ πατὴρ ὑμῶν
  choice: あなたがたの父
  rationale: 原文には「天の」に当たる語がないため補わず、二人称複数の関係表現を明示した。
theological_decisions:
- issue: 命令と父の性質との関係
  choice: 父の憐れみを弟子たちの模範として示す比較表現
  alternative: 父が憐れみ深いから、あなたがたも憐れみ深くありなさい
  rationale: καθὼς はここでは因果よりも比較を表す。「ように」と訳すことで、本文を越えた理由づけを加えず、倫理的模倣という関係を保持する。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔ながら dignified な命令文とした。「憐れみ」は聖書語として通用しつつ意味も明瞭であり、父と弟子たちに用いられた同一語の対応を保っている。
