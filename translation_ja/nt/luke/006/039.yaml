id: LUK.6.39
reference: Luke 6:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ παραβολὴν αὐτοῖς· Μήτι δύναται τυφλὸς τυφλὸν ὁδηγεῖν; οὐχὶ ἀμφότεροι εἰς βόθυνον ⸀ἐμπεσοῦνται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/039.yaml
  text: 'And he also told them a parable: “Can a blind man guide a blind man? Will not both fall into a pit?”[a][b]'
translation:
  language: ja
  text: また、イエスは彼らにたとえを語られた。「目の見えない人が、目の見えない人を案内できるだろうか。二人とも穴に落ちるのではないか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「穴」は「溝」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: δέと組み合わされた付加的なつながりを、自然な日本語で示す。
- source_word: παραβολὴν
  choice: たとえ
  rationale: 福音書における比喩的・例示的な語りを表す、現代日本語で一般的な訳語。
- source_word: Μήτι δύναται
  choice: できるだろうか
  rationale: 否定の答えを予期する修辞疑問を、日本語として自然に保つ。
- source_word: τυφλὸς ... τυφλὸν
  choice: 目の見えない人が、目の見えない人を
  rationale: ギリシア語の男性単数形は格言的・代表的に用いられており、日本語では性別を不必要に限定せず、その一般的な指示範囲を自然に表す。
- source_word: ὁδηγεῖν
  choice: 案内する
  rationale: 一人がもう一人の進路を導くという場面に適した、明瞭で自然な表現。
- source_word: οὐχὶ ἀμφότεροι
  choice: 二人とも……のではないか
  rationale: 肯定の答えを予期する修辞疑問と、ἀμφότεροιの『両者』を自然な日本語で表す。
- source_word: βόθυνον
  choice: 穴
  rationale: 掘られた穴やくぼみを指し得る語。文脈の像を明瞭にしつつ、『溝』という可能性は脚注に残す。
- source_word: ἐμπεσοῦνται
  choice: 落ちる
  rationale: 未来形の予測を日本語の非過去形による修辞疑問として自然に表す。
theological_decisions:
- issue: τυφλόςの男性単数・名詞的用法
  choice: 目の見えない人
  alternative: 目の見えない男／盲人
  rationale: 文法上は男性単数だが、格言の中で一般的人間を代表している。日本語では『人』がその代表的な広がりを正確かつ自然に伝える。
- issue: 二つの修辞疑問の方向性
  choice: 第一問は否定、第二問は肯定を予期する形を維持
  alternative: 断定文に言い換える
  rationale: μήτιとοὐχίが作る対照的な修辞的力を保ち、イエスの問いかけの形式を崩さない。
translation_notes:
  register: 明瞭な現代標準日本語。格言的なたとえの簡潔さと、二つの修辞疑問の力を保った。「イエス」は主語を明示し、日本語で指示対象を自然にした。
