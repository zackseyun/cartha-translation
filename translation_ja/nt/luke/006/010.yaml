  text: καὶ περιβλεψάμενος πάντας αὐτοὺς εἶπεν αὐτῷ· Ἔκτεινον τὴν χεῖρά σου· ὁ δὲ ἐποίησεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/010.yaml
  text: And after looking around at them all[a], he said to him, “Stretch out your hand.” And he did so, and his hand was restored.
translation:
  language: ja
  text: そして、彼ら全員を見回してから、その人に言った。「手を伸ばしなさい。」その人はそのとおりにした。すると、その手は元どおりになった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その手は癒やされた」。ギリシア語は直訳すると「その手は元の状態に戻された」で、本来あるべき状態への回復を強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: 見回してから
  rationale: アオリスト中動態分詞が、イエスが一同を見回した後に語ったという動作の順序を示すため、自然な現代日本語で表した。
- source_word: πάντας αὐτούς
  choice: 彼ら全員を
  rationale: その場の人々を一人残らず見たという全体性を保つ。
- source_word: εἶπεν αὐτῷ
  choice: その人に言った
  rationale: 相手が手の不自由な男性であることを文脈に即して明確にしつつ、発話行為を意味上補わない簡潔な表現とした。
- source_word: Ἔκτεινον τὴν χεῖρά σου
  choice: 手を伸ばしなさい
  rationale: 命令形の直接性を保ち、χείρを通常の意味どおり「手」と訳した。日本語では所有者が明白なため「あなたの」は省略した。
- source_word: ὁ δὲ ἐποίησεν
  choice: その人がそのとおりにすると
  rationale: ποιέωが直前の命令を実行したことを指すため「そのとおりに」とし、後続の結果へ自然につないだ。
- source_word: ἀπεκατεστάθη
  choice: 元どおりになった
  rationale: ἀποκαθίστημιの、以前の正常な状態へ回復するという意味を、明瞭で自然な日本語にした。「癒やされた」と限定せず、原語の回復表現を保った。
- source_word: ἡ χεὶρ αὐτοῦ
  choice: その手
  rationale: 原文が「手」を明示して奇跡の結果を焦点化しているため反復し、日本語として自然な指示表現にした。
theological_decisions:
- issue: ἀπεκατεστάθηが表す奇跡の性質
  choice: 「元どおりになった」という回復の表現
  alternative: 「癒やされた」または「治った」
  rationale: 原語は手が本来の状態に戻されたことを強調する。「癒やされた」も文脈上可能だが、医療的な意味へ限定せず、原語の回復という語感を優先した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「彼」は連続すると指示対象が曖昧になりやすいため、命令を受けた男性を「その人」とした。命令文は自然な強さの「伸ばしなさい」を用いた。
