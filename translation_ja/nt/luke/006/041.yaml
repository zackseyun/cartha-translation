source:
  edition: SBLGNT
  text: τί δὲ βλέπεις τὸ κάρφος τὸ ἐν τῷ ὀφθαλμῷ τοῦ ἀδελφοῦ σου, τὴν δὲ δοκὸν τὴν ἐν τῷ ἰδίῳ ὀφθαλμῷ οὐ κατανοεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/041.yaml
  text: But why do you see the speck in your brother’s eye[c][b][a], yet do not notice the beam in your own eye?
translation:
  language: ja
  text: では、なぜあなたは、兄弟の目にある小さなごみ[a][b]は見るのに、自分自身の目にある梁[c]には気づかないのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「小さなごみ」は、「木くず」または「わらくず」とも訳せる。ギリシア語は、梁と対照されるごく小さな異物を指す。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟」は男性単数のギリシア語を訳したもの。この文脈では、実の兄弟だけに限定される表現ではない。
    reason: cultural_note
  - marker: c
    text: 「梁」は建物を支える大きな材木。原文は、小さなごみとの極端な対比を描いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: τί δὲ
  choice: それなのに、なぜ
  rationale: τίはこの修辞疑問で理由を問う「なぜ」と解し、δὲは直前の教えを受ける対照的な展開として「それなのに」で表した。
- source_word: βλέπεις
  choice: 見える
  rationale: 視覚の比喩を保ちつつ、後半の「気づかない」と自然に対照させた。意図的に見ることより、他人の欠点が目に入るという文脈にも合う。
- source_word: κάρφος
  choice: 小さなごみ
  rationale: 乾いたわらくずなどの微小な異物を指す。現代日本語で目に入る物として自然で、巨大な梁との誇張された対比も明瞭になる。
- source_word: ἀδελφοῦ
  choice: 兄弟
  rationale: 男性単数の語形を保持した。実の男兄弟だけに限定されない用法であることは脚注で示す。
- source_word: δοκόν
  choice: 梁
  rationale: 建物に用いる大きな横木を指すため、原文の具体像と誇張を簡潔に保持できる。
- source_word: ἰδίῳ
  choice: 自分の
  rationale: ἴδιοςの所有の強調を表し、「兄弟の目」との対照を明確にした。
- source_word: κατανοεῖς
  choice: 気づかない
  rationale: 注意深く認める、よく見るという意味を、この文脈では自然な現代日本語の「気づく」で表した。単なる視認以上の認識を示す。
theological_decisions:
- issue: ἀδελφοῦの範囲
  choice: 兄弟
  alternative: 仲間／兄弟姉妹
  rationale: 原文の男性単数を本文で保持しつつ、この道徳的教えが実の男兄弟だけに限定されないことを脚注で明示した。
translation_notes:
  register: 明瞭で現代的な敬体。修辞疑問の戒めとしての力を保ち、目の中の微小な異物と建築用の梁という意図的な誇張を自然な日本語で示した。
