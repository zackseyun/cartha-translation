  text: Ἀλλὰ ὑμῖν λέγω τοῖς ἀκούουσιν, ἀγαπᾶτε τοὺς ἐχθροὺς ὑμῶν, καλῶς ποιεῖτε τοῖς μισοῦσιν ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/027.yaml
  text: 'But I say to you who are listening: love your enemies[a]; do good to those who hate you,'
translation:
  language: ja
  text: 「しかし、聞いているあなたがたに、わたしは言います。あなたがたの敵を愛し、あなたがたを憎む者たちに善を行いなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: しかし
  rationale: 直前の内容との強い対照を示しつつ、現代日本語で自然かつ簡潔な接続表現とした。
- source_word: ὑμῖν λέγω
  choice: あなたがたに、わたしは言います
  rationale: 複数の聞き手への直接的な呼びかけと発言定型を明示する。語順は「聞いているあなたがた」との結びつきを保つために整えた。
- source_word: τοῖς ἀκούουσιν
  choice: 聞いているあなたがた
  rationale: 現在分詞の継続的・能動的な響きを自然な現代日本語で表し、単に音が聞こえるという意味より、今耳を傾けている聞き手を示した。
- source_word: ἀγαπᾶτε
  choice: 愛しなさい
  rationale: 現在命令形の直接的な倫理命令を保ち、意味を弱めたり限定したりしない。後続の命令と日本語として自然に並べるため連用形「愛し」を用いた。
- source_word: τοὺς ἐχθροὺς ὑμῶν
  choice: あなたがたの敵
  rationale: 所有関係を明示した直接的で自然な訳とした。敵の範囲に原文にない限定を加えていない。
- source_word: καλῶς ποιεῖτε
  choice: 善を行いなさい
  rationale: 行為とその道徳的性質の双方を保つ、明瞭で品位ある日本語表現とした。
- source_word: τοῖς μισοῦσιν ὑμᾶς
  choice: あなたがたを憎む者たちに
  rationale: 与格を「に」で表し、μισέωの明白な意味を「憎む」として弱めずに訳した。
theological_decisions:
- issue: 敵対する者への倫理的命令
  choice: 命令を普遍的で直接的な形のまま訳し、その対象を原文以上に限定しない。
  alternative: 個人的な敵だけに限定する、または修辞的誇張として訳文上で弱める。
  rationale: 本文は二人称複数の直接的な命令を示し、明示的な限定を置いていないため、その徹底した倫理的緊張を訳文に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの直接的な語りとしての品位と力を保った。「あなたがた」を反復して複数への呼びかけを明確にし、原文の対照と二つの命令を自然に表現した。
