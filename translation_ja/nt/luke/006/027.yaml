  naturalness: 全体として明瞭な現代標準日本語であり、直接的な教えとして自然である。「あなたがた」の反復は日本語ではやや重なりうるが、原文の複数の呼びかけと対称的な命令を明確にするため、この短い節では許容される。
  terminology: 「敵を愛し」「憎む者たちに善を行いなさい」は、ἀγαπᾶτε、μισοῦσιν、καλῶς ποιεῖτεを弱めずに伝える。とくに「愛」を情緒的好意に限定せず命令として保持し、「善を行う」も倫理的行為という原文の趣旨に合う。
