source:
  edition: SBLGNT
  text: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας ὅμοιός ἐστιν ἀνθρώπῳ οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου, ᾗ προσέρηξεν ὁ ποταμός, καὶ ⸂εὐθὺς συνέπεσεν⸃, καὶ ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/049.yaml
  text: But the one who heard and did not act is like a man who built a house on the ground without a foundation[a]. When the river burst against it, it immediately collapsed[b], and the ruin of that house was great.
translation:
  language: ja
  text: しかし、聞いても行わなかった[a]人は、土台なしで地面に家を建てた人に似ている。川がその家に激しくぶつかると、家はたちまち崩れ、その家の損壊は甚大だった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「行わなかった」は、「実行しなかった」とも訳せる。原語は単に「行う」を意味し、ここではイエスの言葉を実行することを指す。
    reason: lexical_alternative
  - marker: b
    text: 「損壊」と訳した語は、「裂け目」「破損」「崩壊」を表すことができる。ここでは家が崩れた結果としての破壊の大きさを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀκούσας καὶ μὴ ποιήσας
  choice: しかし、聞いても行わなかった人
  rationale: 冠詞付きアオリスト分詞を一般的な一人の人物として表し、聞くことと行うことの対照を自然な現代日本語の「聞いても行わなかった」で保持した。ποιέωは文脈上イエスの言葉を実行することを指すが、本文では原語の簡潔さを保った。
- source_word: ὅμοιός ἐστιν ἀνθρώπῳ
  choice: 人に似ている
  rationale: 比較を表す標準的で明瞭な日本語とした。ἀνθρώπῳはこのたとえに登場する一人の人物を指すため、日本語では不自然な性別の明示を加えず「人」とした。
- source_word: οἰκοδομήσαντι οἰκίαν ἐπὶ τὴν γῆν χωρὶς θεμελίου
  choice: 土台なしで地面に家を建てた
  rationale: γῆを建築面としての「地面」、θεμέλιονを「土台」と訳し、無基礎で建てたという像を簡潔に保持した。
- source_word: ᾗ προσέρηξεν ὁ ποταμός
  choice: 川がその家に激しくぶつかると
  rationale: 関係代名詞ᾗの先行詞である家を「その家」と明示した。προσρήγνυμιの強い衝突を「激しくぶつかる」で表し、関係節は自然な時間節にした。
- source_word: εὐθὺς συνέπεσεν
  choice: 家はたちまち崩れ
  rationale: συμπίπτωは建物が倒壊することを表すため「崩れ」とし、εὐθύςを「たちまち」で保持した。
- source_word: ἐγένετο τὸ ῥῆγμα τῆς οἰκίας ἐκείνης μέγα
  choice: その家の壊れ方はひどかった
  rationale: ῥῆγμαが示しうる破損・裂け・崩壊の結果を、文脈に合う自然な日本語で表した。μέγαは程度の大きさとして「ひどかった」としたが、語の幅は脚注に残した。
theological_decisions:
- issue: たとえの人物を表すἀνθρώπῳの性別表現
  choice: 人
  alternative: 男
  rationale: ἀνθρώπῳは文法的には男性単数だが、語自体は人間・人物を広く表しうる。この箇所では代表的な一人を指すため、現代日本語で自然かつ意味に忠実な「人」とし、原文にない性別上の限定を強めなかった。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。「たちまち」はεὐθύςの即時性を簡潔に伝える。「壊れ方はひどかった」は字義的な「裂け目が大きかった」より自然だが、原語の意味の幅を脚注で示した。
