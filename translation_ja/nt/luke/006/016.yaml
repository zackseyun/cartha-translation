reference: Luke 6:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ Ἰούδαν Ἰακώβου καὶ Ἰούδαν ⸀Ἰσκαριὼθ ⸀ὃς ἐγένετο προδότης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/016.yaml
  text: and Judas son of James[a], and Judas Iscariot, who became a traitor.
translation:
  language: ja
  text: また、ヤコブの子ユダ[a]、そして裏切り者となったイスカリオテのユダである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤコブの兄弟ユダ」。ギリシア語は直訳すると「ヤコブのユダ」で、関係を明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰούδαν Ἰακώβου
  choice: ヤコブの子ユダ
  rationale: 属格Ἰακώβουは関係を明示しない省略表現だが、使徒名簿として自然な日本語にするため「子」を補った。「兄弟」の可能性は脚注に残す。
- source_word: Ἰσκαριὼθ
  choice: イスカリオテ
  rationale: 人名に付された呼称として、日本語で定着している音写を用いた。
- source_word: ὃς ἐγένετο
  choice: となった
  rationale: ἐγένετοの変化・成立の意味を保ち、単に「であった」とはしない。日本語では後ろからの関係節を名前の前に置いて自然に表現した。
- source_word: προδότης
  choice: 裏切り者
  rationale: 人を裏切る者という名詞の力を、明快で一般的な現代日本語で表した。
- source_word: καὶ
  choice: また／そして
  rationale: 名簿の連続性と最後の二名の並列を、自然な日本語の接続で示した。
theological_decisions:
- issue: 「Ἰούδαν Ἰακώβου」において属格が示す関係
  choice: 本文では「ヤコブの子ユダ」とする
  alternative: 「ヤコブの兄弟ユダ」、または関係を補わない「ヤコブのユダ」
  rationale: ギリシア語は正確な親族関係を明示していない。名簿として自然な本文には最も蓋然性の高い「子」を補う一方、原文の曖昧さと別解を脚注で明示する。
translation_notes:
  register: 明快で格調を保った現代標準日本語。前後が使徒名簿であることを踏まえ、「また」「そして」で列挙を自然につないだ。
