id: LUK.6.29
reference: Luke 6:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τῷ τύπτοντί σε ἐπὶ τὴν σιαγόνα πάρεχε καὶ τὴν ἄλλην, καὶ ἀπὸ τοῦ αἴροντός σου τὸ ἱμάτιον καὶ τὸν χιτῶνα μὴ κωλύσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/029.yaml
  text: To the one who strikes you on the cheek[a], offer the other also; and from the one who takes away your cloak[c][b], do not withhold your tunic also.
translation:
  language: ja
  text: あなたの頬[a]を打つ者には、もう一方の頬も差し出しなさい。また、あなたの上着[b]を取り去る者には、内着も拒んではなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あご」。
    reason: lexical_alternative
  - marker: b
    text: 「上着」は外側に着る衣（ἱμάτιον）、「内着」はその内側に着る衣（χιτών）を指す。
    reason: cultural_note
lexical_decisions:
- source_word: τῷ τύπτοντί
  choice: 打つ者には
  rationale: 冠詞付き現在分詞を一般的な人物を指す表現として捉え、簡潔で自然な日本語にした。
- source_word: ἐπὶ τὴν σιαγόνα
  choice: 頬を
  rationale: σιαγώνには「あご」と「頬」の語義があるが、顔を打つという文脈では「頬」が自然であり、別訳を脚注に示した。
- source_word: πάρεχε
  choice: 差し出しなさい
  rationale: παρέχωの「提供する、差し出す」という意味を保ち、マタイの並行箇所に由来する「向けなさい」へ調和させなかった。
- source_word: καὶ τὴν ἄλλην
  choice: もう一方の頬も
  rationale: 省略されている「頬」を日本語では補い、ἄλληνとκαίの「もう一方」「も」を明示した。
- source_word: ἀπὸ τοῦ αἴροντός σου
  choice: あなたの…を取り去る者には
  rationale: αἴρωの取り上げて持ち去る意味を表し、ἀπόを含む構文全体を自然な日本語の対象表現にした。
- source_word: τὸ ἱμάτιον
  choice: 上着
  rationale: 外側に着る衣を指すため、現代の一般読者に分かりやすい「上着」とした。
- source_word: τὸν χιτῶνα
  choice: 下着
  rationale: 体に近く着る内衣を指し、ἱμάτιονとの対比が明確になる語を選んだ。現代日本語の「下着」には肌着の含意があるため、衣服の文化的区別を脚注で説明した。
- source_word: μὴ κωλύσῃς
  choice: 拒んではなりません
  rationale: 直訳的な「妨げる」より、この文脈で追加の衣を渡すことを拒否しないという意味を自然に伝える。
theological_decisions:
- issue: ルカの表現を、マタイのよく知られた「もう一方の頬を向ける」に調和させるか
  choice: ルカ固有の「もう一方の頬も差し出しなさい」を保持する
  alternative: もう一方の頬も向けなさい
  rationale: 原文はστρέφωではなくπάρεχεを用いるため、「差し出す」と訳して福音書間の表現の違いを保った。
- issue: 命令に解釈上の限定を加えるか
  choice: 命令を直接的な形のまま訳す
  alternative: 無抵抗、非報復、誇張などの解釈を本文に織り込む
  rationale: 原文の命令の強さと神学的緊張を保ち、その適用範囲を翻訳本文で決めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令文としての厳粛さを保った。「差し出しなさい」によってルカ独自の動詞を反映し、後半は現代日本語で自然な「拒んではなりません」とした。
