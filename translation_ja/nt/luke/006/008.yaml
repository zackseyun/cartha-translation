id: LUK.6.8
reference: Luke 6:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐτὸς δὲ ᾔδει τοὺς διαλογισμοὺς αὐτῶν, ⸂εἶπεν δὲ⸃ τῷ ⸀ἀνδρὶ τῷ ξηρὰν ἔχοντι τὴν χεῖρα· ⸀Ἔγειρε καὶ στῆθι εἰς τὸ μέσον· ⸀καὶ ἀναστὰς ἔστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/008.yaml
  text: But he knew their thoughts[a], and he said to the man who had the withered hand[c][b], “Get up and stand in the middle.” And he got up and stood there.
translation:
  language: ja
  text: しかし、イエスは彼らの考え[a]を知っていた。そして、片手が萎えた[b]男に言った。「立ち上がって、真ん中に[c]立ちなさい。」男は立ち上がり、そこに立った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの思案」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「片手がしなびた男」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「真ん中へ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 知っていた
  rationale: οἶδαの過去完了形はここで「知っている」という状態を物語の過去時点で表す。「知っていた」は自然な日本語であり、知った方法については補足しない。
- source_word: διαλογισμοὺς
  choice: 考え
  rationale: 「考え」「思案」「心の内の論議」を表し得る語。文脈上は敵対的な思案だが、「考え」とすることで、その内容や動機を本文以上に限定しない。
- source_word: ἀνδρὶ
  choice: 男
  rationale: ἀνήρは成人男性を指すため、性別を明確に保つ。
- source_word: ξηρὰν ... τὴν χεῖρα
  choice: 手の萎えた
  rationale: 身体の一部について用いられるξηρόςは、機能を失って萎縮した状態を表す。「手の萎えた」は簡潔で自然な医学的描写となる。
- source_word: Ἔγειρε
  choice: 立ち上がって
  rationale: その場から起き上がるよう命じる語。続くστῆθιとの区別を保つ。
- source_word: στῆθι
  choice: 立ちなさい
  rationale: 「立つ」という命令を明示し、先行する「立ち上がって」と二段階の動作として訳す。
- source_word: εἰς τὸ μέσον
  choice: 真ん中に
  rationale: 集まっている人々の中央へ出ることを表す。日本語では「真ん中に立つ」が自然であり、公開の場に立たせる情景も保たれる。
- source_word: ἀναστὰς ἔστη
  choice: 立ち上がり、そこに立った
  rationale: 分詞と主動詞が示す連続動作を保ち、命令に応じて起き上がり、指定された場所に立ったことを自然に表す。
theological_decisions:
- issue: イエスが人々の内心を知っていたこと
  choice: 「彼らの考えを知っていた」と叙述どおりに訳す。
  alternative: 「彼らの意図を見抜いていた」「超自然的な力で彼らの思案を知っていた」
  rationale: 本文はイエスが彼らの考えを知っていたと述べるが、その手段は説明していない。したがって、知識の性質や仕組みを神学的に補足しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文として落ち着きのある文体とした。イエスの二つの命令と男の二段階の応答を保ち、本文が明示しない知識の手段や病状の詳細は加えていない。
