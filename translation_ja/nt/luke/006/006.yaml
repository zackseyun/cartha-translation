  yaml_path: translation/nt/luke/006/006.yaml
  text: It happened on another Sabbath that he entered the synagogue and was teaching[a]. And a man was there whose right hand was withered.
translation:
  language: ja
  text: 別の安息日のこと、イエスは会堂に入って教えておられた。そこに、右手が萎えていた[a]人がいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しなびた」。ギリシア語は「乾いた」「枯れた」状態を表し、ここでは右手が不自由であったことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ ἐν ἑτέρῳ σαββάτῳ
  choice: 別の安息日のこと
  rationale: ルカに多い出来事を導入する構文を、現代日本語の自然な物語表現で示す。δὲの弱い接続機能を過度に明示せず、ἑτέρῳの「別の機会」を保った。
- source_word: εἰσελθεῖν αὐτὸν εἰς τὴν συναγωγὴν καὶ διδάσκειν
  choice: イエスは会堂に入って教えておられた
  rationale: 不定詞構文を自然な定形節に改め、διδάσκεινの継続的な側面を「教えておられた」で表した。文脈上の指示対象を日本語で明確にするため「イエス」とした。
- source_word: καὶ ἦν ἄνθρωπος ἐκεῖ
  choice: そこに……人がいた
  rationale: 存在文を簡潔で自然な日本語にした。ἄνθρωποςはこの文脈で男性を指すが、日本語の「人」で意味が十分に伝わる。
- source_word: ἡ χεὶρ αὐτοῦ ἡ δεξιὰ
  choice: 右手の
  rationale: ギリシア語が特定する患部を、日本語の連体修飾として自然に表した。
- source_word: ξηρά
  choice: 萎えた
  rationale: 字義的には「乾いた、枯れた」を表し、ここでは機能を失い縮んだ手の状態を指す。「萎えた」は伝統的かつ簡潔で、単なる乾燥や特定の医学的診断に限定しない。
