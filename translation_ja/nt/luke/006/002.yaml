reference: Luke 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τινὲς δὲ τῶν Φαρισαίων ⸀εἶπαν· Τί ποιεῖτε ὃ οὐκ ⸀ἔξεστιν τοῖς σάββασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/002.yaml
  text: But some of the Pharisees said[a], “Why are you doing what is not lawful on the Sabbaths?”
translation:
  language: ja
  text: ところが、ファリサイ派のある人たちが言った。「なぜあなたがたは、安息日にしてはならないことをしているのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς
  choice: ある人たち
  rationale: ファリサイ派全体ではなく、その中の不特定の一部を指す。現代日本語として自然である。
- source_word: δὲ
  choice: すると
  rationale: 前節からの物語の展開を示しつつ、弟子たちの行為に対する反応への転換を自然に表す。
- source_word: τῶν Φαρισαίων
  choice: ファリサイ派の
  rationale: 当時のユダヤ教内の集団名として、現代日本語で明確な慣用表記を用いる。
- source_word: εἶπαν
  choice: 言った
  rationale: アオリストの発話事象を単純に叙述する。
- source_word: Τί ποιεῖτε
  choice: なぜあなたがたは……しているのですか
  rationale: τί は字義的には「何」だが、この問いでは目前の行為を非難して理由を問う語用論的な働きを持つ。ποιεῖτε の複数二人称と現在の行為を明示した。
- source_word: ὃ οὐκ ἔξεστιν
  choice: してはならないこと
  rationale: 安息日規定をめぐる文脈で、「許されていない／合法でない」という意味を、自然な日本語の禁止表現で示す。
- source_word: τοῖς σάββασιν
  choice: 安息日に
  rationale: ギリシア語は複数形だが、週ごとの安息日または安息日の時を表す慣用的用法であり、日本語では単数的な「安息日に」が自然かつ正確である。
theological_decisions:
- issue: 安息日表現の複数形
  choice: 安息日に
  alternative: 安息日々に／安息日には
  rationale: τοῖς σάββασιν は形態上複数だが、安息日を表す一般的な慣用表現である。不自然な複数を形式的に再現せず、規定が適用される日を自然に示した。
- issue: οὐκ ἔξεστιν の法的・宗教的響き
  choice: してはならない
  alternative: 許されていない／律法にかなっていない
  rationale: 原文は何によって禁じられるかを明示していないため、「律法に」を補わない。一方、単なる個人的許可ではなく規範上の禁止を示す表現を選んだ。
translation_notes:
  register: 明瞭で現代的な標準日本語。ファリサイ派の問いの非難的な調子は保ちつつ、過度に硬い法律用語は避けた。原文にない「弟子たち」を補わず、複数二人称を「あなたがた」で明示した。
