  text: Οὐαὶ ὅταν ⸂καλῶς ὑμᾶς⸃ εἴπωσιν ⸀πάντες οἱ ἄνθρωποι, κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς ψευδοπροφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/026.yaml
  text: Woe when all people speak well of you[b][a], for their fathers used to do the same to the false prophets.
translation:
  language: ja
  text: すべての人があなたがたをほめる[a]とき、あなたがたは災いである。人々の先祖も、同じように偽預言者たちをほめていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ほめる」は、「あなたがたのことを好意的に語る」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί
  choice: 災いだ
  rationale: 預言者的な警告と断罪の響きを保ちつつ、現代日本語で明確かつ荘重に表す。
- source_word: ὅταν
  choice: とき
  rationale: 一般的・将来的な場合を示す接続表現として自然であり、警告の力を保つ。
- source_word: καλῶς ὑμᾶς εἴπωσιν
  choice: あなたがたをほめる
  rationale: 直訳的な「良く言う」ではなく、人について好意的・称賛的に語るという慣用的意味を自然な日本語で表す。
- source_word: πάντες οἱ ἄνθρωποι
  choice: すべての人
  rationale: 性別を限定しない一般的な人々を表し、原文の複数名詞句にも対応する。
- source_word: κατὰ τὰ αὐτά
  choice: 同じこと
  rationale: ποιέωとの組み合わせを自然に「同じことをする」と訳し、過去の扱いとの対応関係を示す。
- source_word: γάρ
  choice: からである
  rationale: 先行する災いの宣告に理由を与える説明的接続を明示する。
- source_word: ἐποίουν
  choice: していた
  rationale: 未完了過去の反復的・慣習的な行為を日本語で簡潔に表す。
- source_word: τοῖς ψευδοπροφήταις
  choice: 偽預言者たちに
  rationale: 行為が向けられた相手を示す与格を素直に表す。
- source_word: οἱ πατέρες αὐτῶν
  choice: 彼らの先祖
  rationale: 字義は「彼らの父たち」だが、ここでは以前の世代を指すため、現代日本語で誤解の少ない「先祖」とする。
theological_decisions:
- issue: 偽預言者との比較が意味する警告の範囲
  choice: すべての人から称賛されることを、過去の世代が偽預言者を好意的に扱った歴史的型との関連で警告する。
  alternative: 他者から好意的に語られることを例外なくすべて非難する。
  rationale: γάρとκατὰ τὰ αὐτάは災いの理由を過去の偽預言者への扱いとの類比に置く。翻訳はこの比較を保持し、あらゆる称賛を一律に否定する解釈までは加えない。
translation_notes:
  register: 明快な現代標準日本語。山上ならぬ平地の説教における荘重な警告として、「災いだ」「からである」を用いた。原文の二人称複数は「あなたがた」で保持した。
