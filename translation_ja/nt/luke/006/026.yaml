  naturalness: 「あなたがたは災いだ」も理解可能だが、警告・宣告としては「あなたがたは災いである」のほうが自然で荘重である。また、「彼らの先祖」は直前の「すべての人」を受ける指示関係がやや曖昧なため、「人々の先祖」とする。
  terminology: 「偽預言者たち」は定着した聖書用語として適切である。「ほめる」は καλῶς…εἴπωσιν の自然な訳語であり、脚注の代案も有用である。
