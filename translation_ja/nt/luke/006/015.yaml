  text: ⸀καὶ Μαθθαῖον καὶ Θωμᾶν ⸁καὶ ⸀Ἰάκωβον Ἁλφαίου καὶ Σίμωνα τὸν καλούμενον Ζηλωτὴν
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/015.yaml
  text: and Matthew and Thomas[a], and James son of Alphaeus, and Simon who was called the Zealot
translation:
  language: ja
  text: また、マタイ、トマス、アルファイの子ヤコブ、そして「熱心者」[a]と呼ばれるシモン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「熱心党員」とも訳せる。ギリシア語の呼び名は「熱心な者」という異名である可能性もあり、それ自体では、後に政治運動として知られる集団への正式な所属を必ずしも意味しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また／そして
  rationale: 使徒名簿をつなぐ接続詞。日本語として不自然にならないよう、冒頭では「また」、最後の名の前では「そして」とした。
- source_word: Μαθθαῖον
  choice: マタイ
  rationale: 日本語で定着している人名表記を用いた。
- source_word: Θωμᾶν
  choice: トマス
  rationale: 原語の人名に対応する、日本語で定着した音写を用いた。
- source_word: Ἰάκωβον Ἁλφαίου
  choice: アルファイの子ヤコブ
  rationale: 属格Ἁλφαίουは、この命名形式では父子関係を示すと考えるのが自然であり、同名の人物を区別する表現として明示した。
- source_word: Σίμωνα
  choice: シモン
  rationale: 日本語で定着している人名表記を用いた。
- source_word: τὸν καλούμενον
  choice: と呼ばれる
  rationale: 冠詞を伴う現在受動分詞の限定的用法を、人物を特定する自然な日本語で表した。
- source_word: Ζηλωτὴν
  choice: 熱心者
  rationale: 熱心さを表す呼び名とも、特定の運動との関係を示す称号とも理解し得るため、政治的集団への正式所属を訳文だけで確定しない表現を選んだ。
theological_decisions:
- issue: Ζηλωτήςが政治的党派名か、熱心さを表す異名か
  choice: 本文では「熱心者」とし、正式な党派所属を断定しない。
  alternative: 「熱心党員」または「熱心な者」
  rationale: 原語はシモンを識別する異名を示すが、それだけでは後代に知られる政治運動への正式所属までは確定できない。本文と注でこの曖昧さを保った。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある名簿調の日本語とした。原文が前後に続く列挙の一部であるため、動詞を補わず体言止めとした。
