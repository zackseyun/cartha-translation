source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ ὁ Ἰησοῦς πρὸς αὐτούς· ⸀Ἐπερωτῶ ὑμᾶς, ⸀εἰ ἔξεστιν ⸂τῷ σαββάτῳ⸃ ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ⸀ἀπολέσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/009.yaml
  text: But Jesus said to them[a], “I ask you, is it lawful on the Sabbath to do good or to do harm[b], to save a life or to destroy it?”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「あなたがたに尋ねよう。安息日に許されているのは、善を行うことか、害を加えることか[a]、命を救うことか、それとも滅ぼすことか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悪を行うこと」とも訳せる。原語は、善い行いと悪い、または有害な行いとを対照させている。
    reason: lexical_alternative
  - marker: b
    text: 「魂を救うことか、それとも滅ぼすことか」とも訳せる。ここで「命」と訳した語は「魂」を意味することもあるが、この文脈では人の生命を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 物語を進めながら、敵対者たちの思惑に対するイエスの応答という穏やかな対照を示す。
- source_word: Ἐπερωτῶ ὑμᾶς
  choice: あなたがたに尋ねよう
  rationale: 単なる情報要求ではなく、相手に判断を迫る問いの力を、自然で品位ある現代日本語で表す。
- source_word: εἰ ἔξεστιν
  choice: 許されているのは…か
  rationale: 安息日をめぐる文脈で、律法上・倫理上何が認められるかという含意を保つ。
- source_word: τῷ σαββάτῳ
  choice: 安息日に
  rationale: 時を表す与格を簡潔で慣用的な日本語にした。
- source_word: ἀγαθοποιῆσαι
  choice: 善を行うこと
  rationale: κακοποιῆσαιとの倫理的な対照を明示的に保つ。
- source_word: κακοποιῆσαι
  choice: 害を加えること
  rationale: 癒やしをめぐる直近の文脈と、後続する救う／滅ぼすという対比に合う具体的な表現である。
- source_word: ψυχὴν
  choice: 命
  rationale: ここでは非物質的な魂に限定せず、人の生命を保つか失わせるかという具体的意味が中心である。
- source_word: σῶσαι
  choice: 救うこと
  rationale: この場面での生命の救助・保全という意味に合い、聖書全体に見られる語彙的つながりも保つ。
- source_word: ἀπολέσαι
  choice: 滅ぼすこと
  rationale: 「救う」との強い対照を保ちつつ、「殺す」よりも原語の広がりを残す。目的語は前節の「命」から補って理解できるため反復しない。
theological_decisions:
- issue: ψυχήの意味範囲
  choice: 「命を救うことか、それとも滅ぼすことか」
  alternative: 「魂を救うことか、それとも滅ぼすことか」
  rationale: 安息日の癒やしという直近の文脈は、人の生命とその保全を問題にしている。人間を魂と身体に分ける後代の教理的枠組みを持ち込まず、同時に脚注で原語の意味の幅を示す。
- issue: κακοποιῆσαιの倫理的・具体的含意
  choice: 「害を加えること」
  alternative: 「悪を行うこと」
  rationale: 原語は倫理的な悪を表し得るが、この文脈では人に害を及ぼす具体的行為との対照が前面に出る。「害を加える」を本文に置き、「悪を行う」の可能性は脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの問いの厳粛さと鋭さを保った。「尋ねよう」は口語に寄りすぎず、過度に古風でもない。二組の対比を短い文に分け、修辞的な力を読み取りやすくした。
