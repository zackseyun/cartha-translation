id: LUK.6.38
reference: Luke 6:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δίδοτε, καὶ δοθήσεται ὑμῖν· μέτρον καλὸν πεπιεσμένον ⸀σεσαλευμένον ὑπερεκχυννόμενον δώσουσιν εἰς τὸν κόλπον ὑμῶν· ⸂ᾧ γὰρ μέτρῳ⸃ μετρεῖτε ἀντιμετρηθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/038.yaml
  text: 'Give[a], and it will be given to you: a good measure—pressed down, shaken together, overflowing—they will give into your lap. For with the measure by which you measure[b], it will be measured back to you.'
translation:
  language: ja
  text: 与えなさい。そうすれば、あなたがたにも与えられます。良い量を、押し固め、揺すって、あふれるほどにして、人々はあなたがたの懐に入れるでしょう。あなたがたが用いる量りで、あなたがたにも量り返されるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίδοτε
  choice: 与えなさい
  rationale: 現在命令形の継続的な含みを過度に明示せず、一般的な勧めとして自然に表した。
- source_word: δοθήσεται ὑμῖν
  choice: あなたがたにも与えられます
  rationale: 未来受動形を保ち、与える主体を特定しないことで、原文の含みを残した。
- source_word: μέτρον καλὸν
  choice: 十分な量
  rationale: μέτρονの『量られた分量』という意味を自然な日本語で示し、καλόνを解釈的な『気前のよい』ではなく『十分な』とした。
- source_word: πεπιεσμένον
  choice: 押し固め
  rationale: 容器の中身を圧して隙間を減らす市場の計量描写を簡潔に表した。
- source_word: σεσαλευμένον
  choice: 揺すって詰め
  rationale: 揺することで中身を沈ませ、さらに詰める動作が日本語読者に伝わるよう文脈的に表した。
- source_word: ὑπερεκχυννόμενον
  choice: あふれるほどにして
  rationale: 容器から中身があふれ出るほど満たされた状態を鮮明かつ自然に表した。
- source_word: δώσουσιν
  choice: 人々は…入れてくれます
  rationale: 主語不定の三人称複数を、受動形へ均さず、不特定の『人々』による能動表現として保持した。
- source_word: εἰς τὸν κόλπον ὑμῶν
  choice: あなたがたの懐に
  rationale: 衣の前の折り返し部分に品物を受ける古代の情景を保ちつつ、日本語として簡潔な『懐』を用いた。文化的意味は脚注で補った。
- source_word: ᾧ γὰρ μέτρῳ μετρεῖτε
  choice: あなたがたが量るその量りで
  rationale: 同じ語根による『量る／量り』の反復を保ち、応報の比喩を明示した。
- source_word: ἀντιμετρηθήσεται ὑμῖν
  choice: あなたがたにも量り返される
  rationale: ἀντίが示す返報性を『量り返される』で表し、未来受動形によって行為主体を特定しなかった。
theological_decisions:
- issue: この教えを金銭・施しだけに限定するか
  choice: 与えることと返される量についての広い表現を保つ
  alternative: 物質的な施しや金銭的献金に限定して訳す
  rationale: 直前の文脈には慈悲、裁かないこと、赦しも含まれ、原文は与える対象を金銭に限定していない。繁栄の約束や狭義の施しへ解釈を固定せず、原文の広がりを残した。
- issue: 受動表現の行為主体を神と明示するか
  choice: 主体を明示せず受動表現を保つ
  alternative: 『神があなたがたに与える／量り返す』と明示する
  rationale: 神的受動の可能性はあるが、原文は主体を明記していないため、翻訳で確定しない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、格言的な力を保つため簡潔で端正な文体とした。『量るその量り』『量り返される』によって原文の語根反復と応報性を保持した。
