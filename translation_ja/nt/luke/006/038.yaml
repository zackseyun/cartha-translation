  to: 与えなさい。そうすれば、あなたがたにも与えられます。良い量を、押し固め、揺すって、あふれるほどにして、人々はあなたがたの懐に入れるでしょう。あなたがたが用いる量りで、あなたがたにも量り返されるからです。
