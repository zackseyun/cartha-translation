  to: その日には喜び、躍り上がりなさい。見よ、あなたがたの報いは天で大きいからです。彼らの先祖も、預言者たちに対して同じことをしていたのです。
  rationale: 「同じようなこと」を「同じこと」に改め、先祖が預言者たちに行ったことが、現在の敵対者の行為と同じであったという原文の比較を保持した。「に対して」は与格の対象を自然な日本語で示すが、行為の内容を「迫害」「虐待」などと限定しないため、ποιέωの一般性を保つ。「天で」は原文の所在表現を自然に訳した。
