id: LUK.6.23
reference: Luke 6:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χάρητε ἐν ἐκείνῃ τῇ ἡμέρᾳ καὶ σκιρτήσατε, ἰδοὺ γὰρ ὁ μισθὸς ὑμῶν πολὺς ἐν τῷ οὐρανῷ· κατὰ ⸂τὰ αὐτὰ⸃ γὰρ ἐποίουν τοῖς προφήταις οἱ πατέρες αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/023.yaml
  text: Rejoice in that day and leap for joy[a], for behold, your reward is great in heaven[b]; for in the same way their fathers used to do to the prophets.
translation:
  language: ja
  text: その日には喜び、躍り上がりなさい。見よ、あなたがたの報いは天で大きいからです。彼らの先祖も、預言者たちに対して同じことをしていたのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρητε
  choice: 喜びなさい
  rationale: アオリスト命令形の直接的な勧めを、自然で格調ある現代日本語で表す。
- source_word: σκιρτήσατε
  choice: 躍り上がりなさい
  rationale: 喜びが身体の動きとしてあふれる語感を保ち、「跳びはねる」よりも文脈に合う dignified な表現とした。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 後続する理由へ注意を促す談話上の働きを簡潔に保持する。
- source_word: ὁ μισθὸς ὑμῶν
  choice: あなたがたの受ける報い
  rationale: μισθόςの肯定的な報償という意味を示しつつ、「受ける」を補って自然な日本語にする。
- source_word: πολὺς
  choice: 大きい
  rationale: 報いの大きさを表す述語形容詞として、原文の簡潔さを保つ。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天において
  rationale: 報いの所在・領域を示す表現を、神学的説明を加えずに訳す。
- source_word: κατὰ τὰ αὐτά
  choice: 同じようなことを
  rationale: 直訳的な「同じ事柄に従って」の意味を自然な日本語で表し、直前の迫害・排斥との対応を保つ。
- source_word: ἐποίουν
  choice: していた
  rationale: 未完了過去の継続的・反復的な含みを表す。
- source_word: τοῖς προφήταις
  choice: 預言者たちに
  rationale: 与格をそのまま「に」で示し、何をしたかは文脈に委ねる。
- source_word: οἱ πατέρες αὐτῶν
  choice: 彼らの先祖
  rationale: ここでは直系の父親ではなく過去の世代を指すため、現代日本語で誤解の少ない「先祖」とする。
theological_decisions:
- issue: 約束された報いの所在と性質
  choice: あなたがたの受ける報いは天において大きい
  alternative: 神とともに天にあるあなたがたの報いは大きい
  rationale: 原文は「天において」とだけ述べているため、報いの仕組みや神との関係を説明的に補わない。
- issue: 「彼らの先祖」が指すもの
  choice: 彼らの先祖
  alternative: 彼らの父たち
  rationale: 反対者たちの前代と預言者迫害の歴史的連続性を示しつつ、現代日本語で実父と誤解されにくい語を選ぶ。
- issue: 先祖が預言者たちにした行為
  choice: 同じようなことをしていた
  alternative: 同じように扱っていた
  rationale: ποιέωの一般的な表現を保持し、敵対的な扱いという意味を訳文だけで過度に明示せず、直前の文脈から理解できる形にする。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「見よ」には聖書本文としての簡潔で格調ある響きを残した。命令の力と喜びの身体的表現を保ち、後半は原文のやや圧縮された言い回しを不自然にならない範囲で維持した。
