id: LUK.6.4
reference: Luke 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὡς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ καὶ τοὺς ἄρτους τῆς προθέσεως ⸀λαβὼν ἔφαγεν καὶ ⸀ἔδωκεν τοῖς μετ’ αὐτοῦ, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ μόνους τοὺς ἱερεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/006/004.yaml
  text: how he entered into the house of God[a], and took and ate the bread of the Presence, and gave some to those with him—which it is not lawful to eat except for the priests alone?
translation:
  language: ja
  text: 神の家に入り、祭司たち以外には食べることが許されていない供えのパン[a]を取って食べ、共にいた者たちにも与えたことを。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の前に供えられたパン」「臨在のパン」。神の前に並べて供える聖別されたパンを指す。
    reason: τῆς προθέσεωςが指す祭儀用のパンを補足し、本文と同じ「供えのパン」という説明上の重複を避けるため。
lexical_decisions:
- source_word: ὡς
  choice: 〜ことを
  rationale: 前節の「読んだことがないのか」に続き、ダビデが行ったことの内容を導く。日本語では独立した「どのように」より、引用内容を自然につなぐ「〜ことを」が明瞭である。
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: 神の家に入り
  rationale: οἶκοςを「神殿」と限定せず、「神の家」と訳して旧約の先例に即した表現を保つ。
- source_word: τοὺς ἄρτους τῆς προθέσεως
  choice: 供えのパン[a]
  rationale: 神の前に供え置かれた聖別されたパンを指す。「供えのパン」は簡潔で現代日本語として理解しやすく、πρόθεσιςの提示・供置の意味も伝える。
- source_word: λαβὼν ἔφαγεν
  choice: 取って食べ
  rationale: 分詞と主動詞の時間的な流れを、自然な日本語の連用表現で示す。
- source_word: καὶ ἔδωκεν τοῖς μετ’ αὐτοῦ
  choice: 共にいた者たちにも与えた
  rationale: καίの付加的意味を「も」で表し、τοῖς μετ’ αὐτοῦを解釈的な「仲間」ではなく「共にいた者たち」と訳す。
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν
  choice: それは……食べることを許されていないもの
  rationale: 複数形のパンを日本語では集合的に「それ」と受け、ἔξεστινの法的・宗教的な許可の意味を「許されていない」で自然に示す。
- source_word: εἰ μὴ μόνους τοὺς ἱερεῖς
  choice: 祭司たちのほかは
  rationale: 例外と排他性を簡潔に表し、食べることが祭司だけに認められているという意味を保つ。
theological_decisions:
- issue: 聖別されたパンに関する祭儀上・律法上の制限
  choice: 「祭司たちのほかは食べることを許されていない」と訳す
  alternative: 「祭司たち以外が食べることは律法で許されていない」
  rationale: 宗教的・法的な制限を保持しつつ、「律法で」を本文に明示して原文以上に限定することは避けた。
- issue: 「神の家」が指す場所
  choice: 神の家
  alternative: 神殿
  rationale: 原文のοἶκοςを保ち、幕屋か神殿かについて本文が与える以上の特定をしない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く疑問文であることを末尾の「ではないか」で示した。「神の家」「共にいた者たち」は原文の表現を過度に具体化せず保持した。
