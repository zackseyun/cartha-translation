  text: καὶ θρὶξ ἐκ τῆς κεφαλῆς ὑμῶν οὐ μὴ ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/018.yaml
  text: And not a hair from your head will perish[a].
translation:
  language: ja
  text: また、あなたがたの頭の毛一本も、決して失われません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には「あなたがたの頭から、髪の毛一本も決して失われない」。ギリシア語の強い否定表現は、確かな保証を表している。
    reason: 原文の語順に近い表現と、強意をもつ否定を示すため。
lexical_decisions:
- source_word: καὶ
  choice: しかし
  rationale: 直訳的には「そして」だが、直前で弟子たちの一部が殺されることが語られており、日本語では逆接で受けると文脈上の緊張が自然に伝わる。新たな解釈を加えず、接続詞καίが文脈に応じて持ちうる展開上の対照を表した。
- source_word: θρὶξ
  choice: 髪の毛一本
  rationale: 単数形を日本語の自然な数量表現で示し、一本たりとも失われないということわざ的な全面性を保った。
- source_word: ἐκ τῆς κεφαλῆς ὑμῶν
  choice: あなたがたの髪の毛
  rationale: ギリシア語では「あなたがたの頭から」と表現されるが、日本語では「あなたがたの髪の毛一本」が自然で、部分を表す意味も明瞭である。
- source_word: οὐ μὴ
  choice: 決して…ません
  rationale: アオリスト接続法を伴う強い二重否定を、現代日本語で明確な確約を表す「決して…ない」によって再現した。
- source_word: ἀπόληται
  choice: 失われません
  rationale: ἀπόλλυμιの「失われる／滅びる」という意味のうち、髪の毛を主語とする日本語として自然な「失われる」を採用した。「滅びる」よりも比喩的表現に適し、身体的危害が全くないとの意味に限定しない。
theological_decisions:
- issue: 直前の迫害と死の予告との見かけ上の緊張
  choice: 究極的な守りを確約することわざ的表現として読める訳を採用しつつ、その解釈を本文に明記しない。
  alternative: 身体には一切の危害が及ばないという字義どおりの約束として訳す。
  rationale: 直前には弟子の一部が殺されるとの予告があるため、緊張を訳文で解消してはならない。「髪の毛一本さえ、決して失われません」は原文の強い確約と比喩性を保ち、その射程の判断を読者に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「髪の毛一本さえ」と「決して」により、原文のことわざ的表現と強い否定を自然に表した。
