id: LUK.21.25
reference: Luke 21:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ⸀ἔσονται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ⸀ἤχους θαλάσσης καὶ σάλου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/025.yaml
  text: And there will be signs in sun and moon and stars[a], and on the earth distress of nations in perplexity because of the roaring of the sea and the surging waves[b],
translation:
  language: ja
  text: また、太陽と月と星にしるしが現れる[a]。地上では、海とそのうねりのとどろきに、諸国の民が途方に暮れ、苦しむ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「太陽、月、星の中に、しるしが現れる」。
    reason: 前置詞ἐνの形式をより直接的に映す別訳。
  - marker: b
    text: 直訳「海とそのうねりの音に（途方に暮れて）」。「うねり」は激しい揺動、騒動とも訳せる。
    reason: ἤχους θαλάσσης καὶ σάλουの圧縮された係り方と、σάλοςの幅広い語義を示すため。
lexical_decisions:
- source_word: σημεῖα
  choice: しるし
  rationale: 超自然的・終末的な現象を指し得る広い語義を保ち、「前兆」として不吉な意味に限定しないため。
- source_word: ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις
  choice: 太陽と月と星に
  rationale: ἐν＋与格が示す現象の生じる領域を、自然な現代日本語で表した。天体現象が文字どおりか象徴的かは限定しない。
- source_word: συνοχὴ ἐθνῶν
  choice: 諸国の民が……苦しむ
  rationale: συνοχήの圧迫されるような苦悩と、ἐθνῶνが世界の諸民族を指すことを、自然な主語述語構文で表した。
- source_word: ἐν ἀπορίᾳ
  choice: なすすべもなく
  rationale: ἀπορίαが表す、どう対処すべきか分からず行き詰まった状態を簡潔で明瞭に表した。
- source_word: ἤχους θαλάσσης καὶ σάλου
  choice: 海のとどろきと大波
  rationale: ἦχοςを「とどろき」、σάλοςを海の激しい揺れ・うねりを具体化する「大波」とし、聴覚的かつ動的な情景を自然に伝えた。
theological_decisions:
- issue: 天体のしるしの性質
  choice: 天体に現れる終末的なしるしとして、そのまま訳す。
  alternative: 文字どおりの天文異変、または象徴的・政治的表象と明示する。
  rationale: 本文自体は、それが文字どおりか象徴的か、あるいは両方かを説明していないため、その解釈上の幅を保った。
- issue: 諸国の苦悩と海の現象との関係
  choice: 「ために」で原因・契機として表す。
  alternative: 「音に際して」「音に直面して」と、より形式的に訳す。
  rationale: ἐν ἀπορίᾳ ἤχους…の属格句には構文上の圧縮があり、海の騒音と激動によって人々が途方に暮れる文脈的関係を、過度に説明せず自然な日本語にした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、終末預言にふさわしい簡潔で荘重な調子を保った。「しるし」はひらがな表記として読みやすくし、「なすすべもなく」でἀπορίαの切迫した行き詰まりを表現した。
