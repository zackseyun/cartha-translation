lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: 物語の流れを自然につなぎ、原文の接続を保つ。
- source_word: εἶπεν παραβολὴν αὐτοῖς
  choice: イエスは彼らにたとえを語った
  rationale: 日本語では「たとえを語る」が自然である。主語は文脈上のイエスを明示し、「彼らに」により αὐτοῖς も保持した。
- source_word: Ἴδετε
  choice: 見なさい
  rationale: 注意を向けるよう促す命令形を、明快で自然な現代日本語にした。
- source_word: τὴν συκῆν
  choice: いちじくの木
  rationale: 果実ではなく樹木を指すため、「木」を明示した。
- source_word: πάντα τὰ δένδρα
  choice: すべての木
  rationale: 原文にない「ほかの」を補わず、複数の全体表現をそのまま保った。
