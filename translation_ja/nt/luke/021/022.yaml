  yaml_path: translation/nt/luke/021/022.yaml
  text: For these are days of vengeance[b][a], that all the things written may be fulfilled.
translation:
  language: ja
  text: なぜなら、これらは、書かれているすべてのことが実現するための報復の日々だからです[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「報復」は、「正当な報い」または「処罰」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「その結果、書かれているすべてのことが実現する」とも訳せる。原文の表現は目的とも帰結とも理解できる。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὅτι
  choice: なぜなら〜だからです
  rationale: 直前の警告の理由を示す説明的・因果的な接続として、現代日本語で明確に表した。
- source_word: ἡμέραι ... αὗταί εἰσιν
  choice: これらの日は〜日々だからです
  rationale: 指示詞の強調と複数形の「日々」を保ちつつ、日本語として自然な述語文にした。
- source_word: ἐκδικήσεως
  choice: 報復
  rationale: 正当な裁きとしての応報・処罰という厳しい意味を保つ。「正義」では刑罰的側面が弱まり、「復讐」では私的な怨恨を連想させやすいため避けた。
- source_word: τοῦ πλησθῆναι
  choice: 実現するための
  rationale: τοῦ＋不定詞が持ちうる目的・帰結の幅を踏まえ、本文では簡潔な目的表現とし、帰結として読む可能性を脚注に残した。
- source_word: πάντα τὰ γεγραμμένα
  choice: 書かれていることがすべて
  rationale: 完了受動分詞の継続的な状態と πάντα の包括性を表した。「聖書」と明示せず、原文どおり指示対象の広がりを保った。
theological_decisions:
- issue: ἐκδίκησιςが表す裁きの性質
  choice: 報復
  alternative: 正当な報い／処罰／裁き
  rationale: 神の司法的な応報という文脈上の厳しさを保ちながら、それを単に一般的な「正義」へ弱めないようにした。誰の報復かは本文で補わなかった。
- issue: τοῦ＋不定詞の目的・帰結の幅
  choice: 書かれていることがすべて実現するための
  alternative: その結果、書かれていることがすべて実現する
  rationale: 本文では構文上素直な目的表現を採りつつ、目的だけに限定されない帰結的理解を脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語の敬体を用いた。「報復の日々」という荘重で厳しい聖書的表現を保ちつつ、私的な怨恨と断定されないよう脚注で意味域を補った。
