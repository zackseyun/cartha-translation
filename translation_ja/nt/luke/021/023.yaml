id: LUK.21.23
reference: Luke 21:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὐαὶ ταῖς ἐν γαστρὶ ἐχούσαις καὶ ταῖς θηλαζούσαις ἐν ἐκείναις ταῖς ἡμέραις· ἔσται γὰρ ἀνάγκη μεγάλη ἐπὶ τῆς γῆς καὶ ⸀ὀργὴ τῷ λαῷ τούτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/023.yaml
  text: Woe to those who are pregnant and to those who are nursing infants in those days! For there will be great distress upon the land[a], and wrath against this people[b],
translation:
  language: ja
  text: その日々には、身ごもっている人たちと乳を飲ませている人たちには、なんと災いだろう。大きな苦難がこの地[a]に臨み、怒りがこの民[b]に及ぶからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地上に」。ギリシア語のγῆは「土地」または「地上」を意味し得る。ここでは周囲の文脈がエルサレムとユダヤに焦点を当てているため、「この地」と訳した。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「この民に怒りが」。その怒りの主体は原文に明記されていない。
    reason: ambiguity
lexical_decisions:
- source_word: οὐαί
  choice: なんと災いなことか
  rationale: 預言的な嘆きと災いの宣告という両面を保ちつつ、現代日本語として自然で重みのある表現とした。
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: 身重の女たち
  rationale: 直訳すれば「胎内に持つ者たち」だが、妊娠中の女性を指す簡潔で品位ある現代日本語を採用した。
- source_word: ταῖς θηλαζούσαις
  choice: 乳飲み子を抱える女たち
  rationale: 動詞が表す授乳中の母親という意味を自然に示す。「抱える」は単なる授乳動作だけでなく、乳児を養育していて避難が困難な状態を簡潔に伝える。
- source_word: ἀνάγκη μεγάλη
  choice: 大きな苦難
  rationale: この災厄の文脈では、単なる「必要」ではなく、切迫した困窮・苦難を意味するため。
- source_word: ἐπὶ τῆς γῆς
  choice: この地に
  rationale: γῆには「地」と「全地・地上」の幅がある。直前のエルサレムとユダヤをめぐる文脈から地域的意味を本文に採ったが、語の曖昧さは脚注に残した。ギリシア語にない「この」は文脈上の指示を日本語で自然に示す補いである。
- source_word: ὀργή
  choice: 怒り
  rationale: 神の怒りと理解され得る重い語だが、原文に主体が明記されないため「神の」を加えず、語義そのものを保った。
- source_word: τῷ λαῷ τούτῳ
  choice: この民に下る
  rationale: 与格が怒りの及ぶ対象を示すことを自然な日本語にした。「民」はλαόςの共同体的・聖書的響きを保つ。
theological_decisions:
- issue: γῆと「この民」の指示範囲
  choice: 「この地」とし、第一義的にエルサレムとユダヤを中心とする土地を示す訳
  alternative: 「地上」または「全地」として普遍的範囲を示す訳
  rationale: 直近の文脈はエルサレムの包囲とユダヤからの避難を扱うため地域的理解が有力。ただしγῆ自体の広い意味の可能性は脚注で保持した。
- issue: ὀργήの主体と性質
  choice: 主体を補わず「怒り」と訳す
  alternative: 「神の怒り」または解釈的な「裁き」
  rationale: 文脈上は神的・審判的な怒りと理解され得るが、原文は「神の」と明記せず、ὀργήを「裁き」とも言い換えていないため、神学的緊張を残した。
- issue: οὐαίの機能
  choice: 嘆きと災いの宣告を兼ねる「なんと災いなことか」
  alternative: 同情に重点を置く「ああ」
  rationale: 苦境への哀惜を含みながら、預言的警告の強さを弱めないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、預言的発言の厳粛さを保った。「身重」「乳飲み子」「民」は一般読者に理解でき、かつ聖書本文にふさわしい品位を持つ語として選んだ。
