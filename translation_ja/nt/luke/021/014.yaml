  text: Therefore[a], settle it in your hearts not to prepare beforehand to defend yourselves[b],
translation:
  language: ja
  text: ですから、前もって弁明の準備をしないことを、心に決めて[a]おきなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「心に定めておきなさい」「心に決意しておきなさい」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「前もって、どのように弁明するかを練習しておかないことを、心に決めておきなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέτε
  choice: 決めておきなさい
  rationale: τίθημιのアオリスト能動命令形であり、「心に置く」という慣用表現の中で、内面的に固く決意することを表す。現代日本語として自然な命令表現にした。
- source_word: οὖν
  choice: ですから
  rationale: 直前の文脈からの帰結を示す接続詞。論理的なつながりを明確にしつつ、自然で格調を損なわない表現を選んだ。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: 心に
  rationale: 複数の聞き手の内面を指す聖書的な慣用表現。日本語では「あなたがたの心の中に」よりも簡潔な「心に」が自然で、内的決意という意味も保てる。
- source_word: μὴ προμελετᾶν
  choice: 前もって考えておかないよう
  rationale: προμελετάωは、事前に考え抜く、または練習しておくことを表す。ここでは弁明の内容をあらかじめ準備する意味を自然な日本語で表した。
- source_word: ἀπολογηθῆναι
  choice: 弁明すること
  rationale: 法廷や公的な場で自己の立場を弁護して答えることを指す。「弁明」は文脈に適し、単なる説明よりも正式な自己弁護の含意を保つ。
