  yaml_path: translation/nt/luke/021/019.yaml
  text: By your endurance you will gain your lives[a][b].
translation:
  language: ja
  text: 忍耐によって、あなたがたは自分の命を得なさい。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本では「忍耐によって、あなたがたは自分の命を得るでしょう」。
    reason: textual_variant
  - marker: b
    text: 「命」と訳したギリシア語は、文脈により「魂」または「自分自身」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονῇ
  choice: 忍耐
  rationale: 試練や迫害の中で揺るがず耐え抜くことを表す。簡潔で自然な「忍耐」が文脈に適している。
- source_word: κτήσασθε
  choice: 得なさい
  rationale: SBLGNT本文のアオリスト中態命令形をそのまま命令として訳した。「獲得しなさい」より自然でありつつ、結果として自分の命を得るという表現上の緊張を保つ。
- source_word: ψυχὰς
  choice: 命
  rationale: ψυχήは文脈により「命」「自分自身」「魂」を意味し得る。迫害と死の危険を扱うこの箇所では、狭い心身二元論を持ち込まない「命」が最も適切である。
- source_word: ἐν
  choice: によって
  rationale: ここでは与格を伴って手段を示すと理解し、自然な現代日本語で「によって」とした。
theological_decisions:
- issue: 終末的な迫害の文脈におけるψυχήの意味
  choice: 人全体を視野に入れた「命」
  alternative: 「魂」または「自分自身」
  rationale: 身体的な危険と究極的な救いの双方を含み得る語義の幅を保ち、非物質的な魂だけが問題であるとは限定しない。
- issue: κτήσασθεの命令形と異読の未来形
  choice: SBLGNT本文に従い「得なさい」
  alternative: 異本に従い「得ることになります」
  rationale: 提示された原語本文の命令形を優先し、未来形の異読は脚注に残して本文上の証拠を明示する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令形を曖昧に未来形へ変えず、同時に異読を脚注で示した。「自分の命」は各人のψυχήを自然に表し、「魂」への限定を避ける。
