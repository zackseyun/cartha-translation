translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。イエスへの敬語は「おられた」にとどめ、過度に荘重な表現を避けた。ἱερόνの意味は本文で「神殿の境内」と明示したため、その語義についての脚注は設けていない。
