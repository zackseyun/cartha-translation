  text: Ἦν δὲ τὰς ἡμέρας ⸂ἐν τῷ ἱερῷ διδάσκων⸃, τὰς δὲ νύκτας ἐξερχόμενος ηὐλίζετο εἰς τὸ ὄρος τὸ καλούμενον Ἐλαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/037.yaml
  text: And during the days he was teaching in the temple[b][a], but at night he would go out and lodge on the mountain called the Mount of Olives.
translation:
  language: ja
  text: イエスは昼間は神殿の境内で教え、夜には外へ出て、オリーブ山で夜を過ごしておられた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「夜を過ごす」と訳した語は、野外で夜を明かすことを含む場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν ... διδάσκων
  choice: 教えておられた
  rationale: 迂言的な未完了形が表す継続的・習慣的な活動を、自然な現代日本語で示す。
- source_word: τὰς ἡμέρας
  choice: 日中
  rationale: 時間の対格を簡潔に表し、後半の「夜」との対照を明確にする。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内で
  rationale: ἱερόνは内陣そのものではなく神殿域全体を指すため、日本語本文で意味範囲を明示する。
- source_word: τὰς δὲ νύκτας
  choice: 夜になると
  rationale: 反復される昼夜の行動パターンとδέによる対照を、自然な日本語で表す。
- source_word: ἐξερχόμενος
  choice: 外へ出て
  rationale: 神殿域から出る反復的な動作を、分詞構文の関係を保ちながら簡潔に表す。
- source_word: ηὐλίζετο
  choice: 夜を過ごしておられた
  rationale: 宿泊または野外での夜営を含み得る語義を、方法を限定せずに表す。
- source_word: εἰς τὸ ὄρος
  choice: 山で
  rationale: 移動の到達先が夜を過ごす場所となることを、日本語の自然な場所表現で示す。
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: オリーブ山と呼ばれる山
  rationale: 定着した日本語地名「オリーブ山」を用いつつ、「と呼ばれる」という原文の構造を保持する。
