id: LUK.21.15
reference: Luke 21:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ γὰρ δώσω ὑμῖν στόμα καὶ σοφίαν ᾗ οὐ δυνήσονται ⸂ἀντιστῆναι ἢ ἀντειπεῖν⸃ ⸀ἅπαντες οἱ ἀντικείμενοι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/015.yaml
  text: For I will give you words and wisdom that all who oppose you will not be able to withstand or contradict.
translation:
  language: ja
  text: わたしがあなたがたに、ことばと知恵を授けるからです。あなたがたに敵対する者は皆、それに抵抗することも、反論することもできません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στόμα
  choice: ことば
  rationale: 直訳は「口」だが、ここでは弁明の際に語る能力や発言内容を表す換喩である。現代日本語では「ことば」が意味を自然かつ明瞭に伝える。
- source_word: σοφίαν
  choice: 知恵
  rationale: 弁明に必要な洞察と適切な判断を表す語として、通常の対応語「知恵」を用いた。
- source_word: ἀντιστῆναι
  choice: 抵抗する
  rationale: 相手のことばと知恵に対抗して持ちこたえる、という意味を保つ。
- source_word: ἀντειπεῖν
  choice: 反論する
  rationale: 言葉をもって言い返す、論駁するという意味を自然な現代日本語で表す。
- source_word: οἱ ἀντικείμενοι ὑμῖν
  choice: あなたがたに敵対する者
  rationale: 単なる意見の相違ではなく、弟子たちに対立し敵対する者を指すため。
theological_decisions:
- issue: イエスが授けるものと、それに敵対者が抵抗・反論できないことの関係
  choice: 二文に分けつつ、「それに」で「ことばと知恵」を受ける構造を明示した。
  alternative: 「わたしがあなたがたに、すべての敵対者が抵抗も反論もできない口と知恵を授けるからです」と一文で訳す。
  rationale: 原文の関係代名詞ᾗは文法上「知恵」に対応しうるが、文脈上は授けられる発言と知恵を一体として受ける可能性がある。日本語では「それに」により、この自然な広がりを保ち、教理的に狭く限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの約束としての荘重さを保った。「言葉」ではなく聖書本文で視認性のよい「ことば」とした。
