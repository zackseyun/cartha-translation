id: LUK.21.6
reference: Luke 21:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα ἃ θεωρεῖτε, ἐλεύσονται ἡμέραι ἐν αἷς οὐκ ἀφεθήσεται λίθος ἐπὶ ⸀λίθῳ ὃς οὐ καταλυθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/006.yaml
  text: As for these things that you are looking at[b][a], days will come in which not one stone will be left upon another that will not be torn down.
translation:
  language: ja
  text: あなたがたが見ているこれらのもの[a]について言えば、石が一つとして石の上に残されず、すべてが崩される日が来ます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたが目にしているこれらのもの」とも訳せる。原語の動詞は、広く「見る」、または「眺める、よく見る」という意味を持つ。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「石の上に残されて、崩されない石は一つもない」。建造物が徹底的に破壊されることを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα ἃ θεωρεῖτε
  choice: あなたがたが見ているこれらのものについては
  rationale: 前置されたΤαῦταの主題化を「～については」で示した。θεωρεῖτεは継続的に目を向けていることを表し得るため、自然で過度に限定しない「見ている」とした。
- source_word: ἐλεύσονται ἡμέραι ἐν αἷς
  choice: ～日が来ます
  rationale: 将来そのような時が到来するというギリシア語の慣用表現を、現代日本語で自然な「日が来ます」とした。複数形を機械的に「日々」とすると不自然になるため、意味を保って単数表現にした。
- source_word: οὐκ ἀφεθήσεται
  choice: 残る石が一つもない
  rationale: ἀφίημιの受動形がこの文脈で表す「残される」を、日本語の否定構文に合わせて「残る石が一つもない」と明確に表した。
- source_word: λίθος ἐπὶ λίθῳ
  choice: ほかの石の上に残る石
  rationale: 石が積み重なった建造物を指す表現を自然な日本語にしつつ、石と石の位置関係を保持した。
- source_word: ὃς οὐ καταλυθήσεται
  choice: 崩されずに
  rationale: καταλύωは建造物を解体し、崩すことを表す。石そのものに「取り壊す」を用いる不自然さを避け、「崩される」とした。
theological_decisions:
- issue: 神殿建造物に関するイエスの予告の範囲と力点
  choice: 目に見える建造物が徹底的に破壊されるという具体的な予告として訳す
  alternative: 象徴的な裁きの宣言として限定する、または特定の終末論体系に結び付ける
  rationale: 本文は石がほかの石の上に残らないほどの破壊を具体的に語っている。訳文ではその力を保ちつつ、この節が明言しない時期や終末論的枠組みを付加しない。
translation_notes:
  register: 明快な現代標準日本語を用い、荘重さを保ちながら過度に文語的な表現を避けた。二重否定を日本語で理解しやすい語順に整えたが、原文の「崩されないまま残る石はない」という論理関係は維持した。
