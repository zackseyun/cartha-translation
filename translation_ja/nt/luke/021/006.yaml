    issue: 「崩されずにほかの石の上に残る石」の修飾関係が不自然である。
    rationale: 原文の関係節は「他の石の上に残される石で、取り壊されないものはない」という完全破壊の強調である。草案の語順では「崩されずに」が「残る」にかかることは分かるものの、石が崩される対象であるように響き、意味の把握に一拍を要する。
  - severity: low
    issue: 「日が来ます」が単数形となっている。
    rationale: ἡμέραιは複数形だが、日本語の慣用表現として単数の「日が来ます」は許容され、意味上の損失もない。完全破壊の内容を明瞭にするため、本文ではこの自然な表現を維持する。
