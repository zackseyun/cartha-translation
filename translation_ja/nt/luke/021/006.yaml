  verdict: revise
  source_fidelity: 原文は、見ている建造物について、将来、石が他の石の上に残ることもなく、完全に取り壊されるという予告を述べる。草案も全体的な意味を伝えているが、「崩されずに…残る石」は修飾関係がやや取りにくく、石そのものが「崩される」対象である点も不自然に響く。
  naturalness: 「あなたがたが見ているこれらのものについては」は自然だが、「について言えば」のほうが主題提示として滑らかである。主節は「石が一つとして石の上に残されず、すべてが崩される」とすることで、明快な現代標準日本語になる。
  terminology: θεωρεῖτεは「見ている」で適切。ἀφεθήσεταιは「残される」、καταλυθήσεταιは建造物についての「崩される」で適切に表せる。ただし後者を石に直接かけるより、建造物全体の徹底的破壊として述べるほうが日本語として明瞭である。
  issues:
