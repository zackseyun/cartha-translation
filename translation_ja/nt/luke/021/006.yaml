  rationale: 原文の二重否定的な関係節が表す完全破壊を、「石が一つとして石の上に残されず、すべてが崩される」と明示した。これにより、石の積み重なりが一切残らないことと、取り壊しの徹底性の双方を保持しつつ、不自然な修飾連鎖を避けた。終末論的・象徴的な解釈は加えていない。
