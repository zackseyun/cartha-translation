  text: ὡς παγίς· ⸂ἐπεισελεύσεται γὰρ⸃ ἐπὶ πάντας τοὺς καθημένους ἐπὶ πρόσωπον πάσης τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/035.yaml
  text: like a trap[c][b][a]. For it will come upon all those dwelling on the face of the whole earth.
translation:
  language: ja
  text: わなのように[a]。その日は、全地[c]の表に住む[b]すべての人に臨むからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「捕らえるわなのように」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「座っている」。ここでは、地上に住み、または居を定めている人々を指す慣用表現。
    reason: lexical_alternative
  - marker: c
    text: 「その全土」とも訳せるが、ここでは「全地」が文脈に最もよく合う。
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς παγίς
  choice: わなのように
  rationale: παγίςの、突然人を捕らえて逃れにくくする仕掛けという比喩を、現代日本語で簡潔に伝える。
- source_word: ἐπεισελεύσεται
  choice: 臨む
  rationale: 何かが人々の上に到来する意味を、警告にふさわしい自然で荘重な日本語にした。文脈上の主語である「その日」を補った。
- source_word: γὰρ
  choice: からである
  rationale: 直前の警告の理由を示す説明的な接続関係を明確にする。
- source_word: ἐπὶ πάντας
  choice: すべての人に
  rationale: 到来が例外なく人々に及ぶことを自然な日本語で表した。
- source_word: τοὺς καθημένους
  choice: 住む
  rationale: 字義的には「座っている」だが、この句では地上に居住する人々を指す慣用的用法である。
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: 全地の面に
  rationale: 「地の面に」というセム語的な聖書表現を保ちつつ、πάσηςによる全体的な範囲を「全地」で示した。
theological_decisions:
- issue: 終末的警告における γῆ の範囲
  choice: 全地
  alternative: その全土
  rationale: γῆには「地」と「土地」の両義があるが、「その面に住むすべての人」という表現とこの警告の文脈では、普遍的な範囲が最も自然である。ただし地域的な「全土」の可能性は脚注に残した。
- issue: ἐπεισελεύσεται の省略された主語
  choice: その日
  alternative: それ
  rationale: 主語は直前の節で言及された「その日」である。日本語で意味を明瞭にするため補ったが、新たな解釈内容は加えていない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「全地の面」という聖書的な表現と警告の荘重さを保った。「臨む」は過度に説明的にせず、突然の到来という文脈にも適する。
