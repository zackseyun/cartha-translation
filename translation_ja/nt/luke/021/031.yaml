id: LUK.21.31
reference: Luke 21:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ἴδητε ταῦτα γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/031.yaml
  text: So also you[a], when you see these things happening[b], know that the kingdom of God is near.
translation:
  language: ja
  text: あなたがたも同じように、これらのことが起こっているのを見たとき[a]、神の国[b]が近いと知りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらのことが起こるのを見たとき」。
    reason: lexical_alternative
  - marker: b
    text: 「神の支配」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同じように、あなたがたも
  rationale: 直前のたとえを弟子たちに当てはめる推論的なつながりと、明示された代名詞ὑμεῖςの強調を、自然な日本語で表した。
- source_word: ὅταν ἴδητε
  choice: 見たなら
  rationale: ὅτανとアオリスト接続法が示す将来の条件を表す。「見るとき」よりも、この文脈では条件的な「見たなら」が自然である。
- source_word: ταῦτα γινόμενα
  choice: これらのことが起こるのを
  rationale: ταῦταが直前に語られた出来事を指すことを保ち、γινόμεναを現代日本語で明瞭に表した。
- source_word: γινώσκετε
  choice: 知りなさい
  rationale: 二人称複数現在命令形として、しるしの意味を認識するよう求める語調を直接に表した。
- source_word: ἐγγύς ἐστιν
  choice: 近い
  rationale: 空間的・時間的な近さの比喩を、どちらか一方に限定せず簡潔に保った。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 領域と王としての支配の両方を含み得る定着した聖書表現であり、ここで意味を一方に狭めない。
theological_decisions:
- issue: 終末論的文脈における「神の国」の意味
  choice: 解釈を付加せず「神の国」とする。
  alternative: 神の支配
  rationale: 本文は、語られた出来事との関連で神の国が近いことを示すが、それが顕現、完成、あるいは正しさの立証のどれを主に指すかは明示しないため、その緊張を保った。
- issue: γινώσκετεの法の判定
  choice: 命令として「知りなさい」とする。
  alternative: 直説法として「あなたがたは知る」
  rationale: 語形だけなら直説法にも命令法にもなり得るが、しるしを見た際の弟子たちへの指示という統語と文脈に最もよく合う命令として訳した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「知りなさい」によって教えとしての格調を保った。「あなたがたも」を明示し、原文の強調を自然に反映した。
