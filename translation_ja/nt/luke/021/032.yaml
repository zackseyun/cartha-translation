  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη ἕως ἂν πάντα γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/032.yaml
  text: Truly I say to you[c][b][a], this generation will certainly not pass away until all things happen.
translation:
  language: ja
  text: まことに、あなたがたに言います。この世代[a]は、すべてのこと[b]が起こる[c]までは決して過ぎ去ることはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この民」または「この時代」とも理解できます。ギリシャ語の語には複数の理解がありますが、「この世代」が最も直接的な訳です。
    reason: alternative_reading
  - marker: b
    text: または「これらすべてのこと」。ギリシャ語は直訳すると「すべてのこと」で、「これら」に当たる語はありません。
    reason: lexical_alternative
  - marker: c
    text: または「生じる」「実現する」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: 厳粛で権威ある確言を導く語。音写よりも、現代日本語で自然かつ格調のある「まことに」がその働きを明確に伝える。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 二人称複数を明示しつつ、直接的な発言定型を自然な現代敬体で表す。
- source_word: οὐ μὴ παρέλθῃ
  choice: 決して過ぎ去りません
  rationale: οὐ μήとアオリスト接続法による強い否定を「決して」で表し、παρέρχομαιの基本的な比喩用法を「過ぎ去る」で保つ。
- source_word: ἡ γενεὰ αὕτη
  choice: この世代
  rationale: γενεάの最も直接的な意味を採用し、その指示対象を本文で解釈的に限定しない。
- source_word: ἕως ἂν
  choice: までは
  rationale: 前文の状態が続く時間的限界を、自然な日本語で示す。
- source_word: πάντα
  choice: これらすべてのこと
  rationale: 語そのものは「すべてのこと」だが、日本語では直前まで述べられた事柄を受ける指示語がないと対象が過度に無限定に響くため、「これら」を補って文脈上の照応を明確にする。補足であることは脚注に示す。
- source_word: γένηται
  choice: 起こる
  rationale: ここでは出来事が生じることを表す。未来的な時を示す「までは」に続けて「起こる」とし、「成就する」のような追加的神学含意を避ける。
theological_decisions:
- issue: 終末に関する言葉における「この世代」の意味
  choice: 「この世代」と語義どおりに訳し、指示対象を確定しない。
  alternative: 「この民」「この時代」、または「これらを見る世代」
  rationale: ἡ γενεὰ αὕτηの指示対象には解釈上の議論がある。本文は最も直接的な語義を保ち、イエスと同時代の人々、しるしを見る世代、特定の民などのいずれかに限定しない。
- issue: πάνταの文脈上の範囲
  choice: 本文では「これらすべてのこと」とし、「これら」が補足であることを注記する。
  alternative: 「すべてのこと」
  rationale: πάντα自体に指示語はないが、文脈上は直前に述べられた一連の事柄を指すと読むのが自然である。日本語の明瞭さを確保しながら、原文との差を脚注で透明にする。
translation_notes:
  register: 明瞭な現代標準日本語の敬体を用い、イエスの厳粛な宣言にふさわしい格調を保った。「決して」により強い否定を明示し、論争のある「この世代」の指示対象は本文で解決しない。すべての脚注記号を対応する語句の直後に配置した。
