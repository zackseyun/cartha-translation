id: LUK.21.11
reference: Luke 21:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σεισμοί τε μεγάλοι ⸂καὶ κατὰ τόπους⸃ ⸂λιμοὶ καὶ λοιμοὶ⸃ ἔσονται, φόβητρά τε καὶ ⸂σημεῖα ἀπ’ οὐρανοῦ μεγάλα⸃ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/011.yaml
  text: There will be great earthquakes[a], and in various places famines and plagues[c][b]; and there will be terrors and great signs from heaven.
translation:
  language: ja
  text: 大きな地震が起こり、各地で飢饉や疫病が起こる。また、恐ろしい出来事が起こり、天[a]から大きなしるしが現れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「空」。ギリシア語のοὐρανόςは「天」と「空」のどちらも意味し得るため、目に見える天空の現象を指している可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: σεισμοί μεγάλοι
  choice: 大きな地震
  rationale: 地震の規模または激しさを表す自然な現代日本語で、μέγαςの意味を過度に限定しない。
- source_word: κατὰ τόπους
  choice: 各地で
  rationale: 場所ごとに分布して起こるという慣用的意味を、簡潔で自然な日本語で表す。
- source_word: λιμοὶ
  choice: 飢饉
  rationale: 単なる食糧不足より深刻な famine の意味を直接表す定着した語。
- source_word: λοιμοὶ
  choice: 疫病
  rationale: 流行性の疾病や災厄を指す語義を、現代の読者に明瞭な語で表す。
- source_word: φόβητρα
  choice: 恐ろしい出来事
  rationale: 恐怖を引き起こす物事・現象を指す稀な複数形を、抽象的な「恐怖」ではなく出来事として自然に表す。
- source_word: σημεῖα
  choice: しるし
  rationale: 黙示的な前兆という含みを持ち得るが、より広い基本義を保ち、解釈を限定しない。
- source_word: ἀπ’ οὐρανοῦ
  choice: 天から
  rationale: οὐρανόςが持つ「天」と「空」の双方の可能性を踏まえ、本文ではルカ的・神学的響きを保つ「天」を採り、別の可能性を注で示す。
- source_word: μεγάλα
  choice: 大きな
  rationale: しるしの重大さや規模を表しつつ、「力強い」などの解釈的含意を加えない。
- source_word: ἔσονται / ἔσται
  choice: があり／が起こる／が現れる
  rationale: 同じ存在動詞を日本語の各主語に適した自然な述語で表し、すべて将来の出来事であることは文脈と並列構造に委ねる。
theological_decisions:
- issue: 黙示的文脈におけるοὐρανόςの意味
  choice: 天から
  alternative: 空から
  rationale: 目に見える天空の現象を指す可能性を残しつつ、ルカ文書にある神学的な響きを本文で保持する。意味を一方に固定しないため、語義上の別案を脚注に明記する。
- issue: σημεῖαの黙示的含意
  choice: しるし
  alternative: 前兆
  rationale: 「前兆」は終末的予告の意味を強めるが、σημεῖονの広い語義を狭めるため、本文では「しるし」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、終末的な場面にふさわしい厳粛さを保った。「疫病」「飢饉」は意味の強さを保つ一般的な語とし、「恐ろしい出来事」でφόβητραの具体的かつ不吉な響きを自然に表した。
