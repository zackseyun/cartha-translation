id: LUK.21.36
reference: Luke 21:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀγρυπνεῖτε ⸀δὲ ἐν παντὶ καιρῷ δεόμενοι ἵνα ⸀κατισχύσητε ἐκφυγεῖν ⸀ταῦτα πάντα τὰ μέλλοντα γίνεσθαι, καὶ σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/036.yaml
  text: But stay awake at all times[a], praying that you may have strength to escape all these things that are about to happen[c][b], and to stand before the Son of Man.
translation:
  language: ja
  text: しかし、あなたがたはいつも目を覚まし、起ころうとしているこれらすべてのことを逃れ、人の子の前に立つことができるように[a]祈っていなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本では、「起ころうとしているこれらすべてのことを逃れ、人の子の前に立つにふさわしいと認められるよう」とある。
    reason: textual_variant
  - marker: b
    text: 「人の子の前に立つ」には、人の子の前で受け入れられ、または正しいと認められて立つという含みがあり得るが、ギリシア語本文はそれを明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγρυπνεῖτε
  choice: 目を覚ましていなさい
  rationale: 警戒を怠らず目覚めているよう命じる現在命令形。比喩を保ちつつ、現代日本語として自然にした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の警告を受けた緩やかな対照・移行を表す。
- source_word: ἐν παντὶ καιρῷ
  choice: いつも
  rationale: あらゆる時に絶えず、という継続的な意味を簡潔で自然に表す。
- source_word: δεόμενοι
  choice: 力を求めて
  rationale: 祈りの中で切に願うことを表す分詞。後続する内容と結び付け、何を願うかが明瞭になるよう訳した。
- source_word: ἵνα κατισχύσητε
  choice: できるよう、力を求めて
  rationale: κατισχύωの「十分な力がある、成し遂げる」を表し、異読の「ふさわしいと認められる」を本文に持ち込まない。
- source_word: ἐκφυγεῖν
  choice: 逃れ
  rationale: 迫る事柄から逃げおおせることを示す。
- source_word: ταῦτα πάντα τὰ μέλλοντα γίνεσθαι
  choice: 起ころうとしているこれらすべてのこと
  rationale: μέλλω＋不定詞が持つ将来性と切迫感の両方を保つ。
- source_word: σταθῆναι
  choice: 立つ
  rationale: 受け入れや無罪宣告を明示せず、原文の「立つ」という像と含意を保つ。
- source_word: ἔμπροσθεν
  choice: 前に
  rationale: ある者の面前・臨在を示す簡潔で自然な表現。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書における定着した称号として、セム語的背景とキリスト論的用法を保持する。
theological_decisions:
- issue: 終末的な出来事を逃れることに関する κατισχύσητε の意味
  choice: 力があって「逃れ…立つことができる」と訳す。
  alternative: 「逃れるにふさわしいと認められる」
  rationale: SBLGNTのκατισχύσητεは力や成し遂げる能力を表す。「ふさわしいと認められる」は重要な異読なので脚注に残す。
- issue: σταθῆναι ἔμπροσθεν τοῦ υἱοῦ τοῦ ἀνθρώπου の含意
  choice: 「人の子の前に立つ」とする。
  alternative: 「人の子の前に受け入れられて立つ」または「人の子の前に現れる」
  rationale: 終末における受容・弁明を含意し得るが、ギリシア語はそれを明示しないため、本文では解釈を限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを保った。「目を覚ましていなさい」「人の子の前に立つ」によって原文の比喩を保持し、神学的含意を本文で過度に説明しない。すべての脚注記号を本文に配置した。
