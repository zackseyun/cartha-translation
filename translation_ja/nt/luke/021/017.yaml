  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/017.yaml
  text: And you will be hated by all because of my name[a].
translation:
  language: ja
  text: そして、あなたがたは、わたしの名のために[a]、すべての人から憎まれます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしのために」。ここで「わたしの名」は、イエスご自身、その身分と権威、またイエスに従うことの表明を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσεσθε μισούμενοι
  choice: 憎まれます
  rationale: 未来形のコピュラと受動分詞の組み合わせを、自然な現代日本語の受身表現で訳した。文脈上、未来のことを述べているのは明らかであり、「憎まれることになります」より簡潔で力強い。
- source_word: ὑπὸ πάντων
  choice: すべての人から
  rationale: ὑπό＋属格が示す行為者を、日本語の受身に自然な助詞「から」で表した。πάντωνの包括的な響きを保つため「すべての人」とした。
- source_word: διὰ τὸ ὄνομά μου
  choice: わたしの名のために
  rationale: διά＋対格の理由・原因を「ために」で表し、τὸ ὄνομά μουを直訳的に「わたしの名」として、その豊かな含意を保持した。
theological_decisions:
- issue: 迫害の理由としての「わたしの名」の意味
  choice: 「わたしの名のために」を本文に保持する
  alternative: 「わたしのために」／「わたしに従っているために」
  rationale: 原文は明示的に「わたしの名」と述べる。これはイエスの人格・身分・権威、およびイエスへの信仰告白や帰属を含み得るため、一つの意味に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あなたがた」「わたし」は聖書本文として自然で、普通の読者にも理解しやすい表記とした。
