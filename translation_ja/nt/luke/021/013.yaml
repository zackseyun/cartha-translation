id: LUK.21.13
reference: Luke 21:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀποβήσεται ὑμῖν εἰς μαρτύριον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/013.yaml
  text: This will turn out for you as a testimony[a].
translation:
  language: ja
  text: それは、あなたがたにとって証しとなります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それは、あなたがたが証しをする機会となります。」
    reason: μαρτύριονを、証しそのものではなく証言の機会として明示する解釈上の可能性を示すため。
lexical_decisions:
- source_word: ἀποβήσεται
  choice: となります
  rationale: 未来形が表す成り行き・結果を、簡潔で自然な日本語で示す。単なる出来事ではなく、先に述べられた迫害がある結果に至ることを表す。
- source_word: ὑμῖν
  choice: あなたがたにとって
  rationale: この与格は、その結果が弟子たちとの関係で生じることを示すため、「あなたがたにとって」とした。
- source_word: εἰς
  choice: （証し）となる
  rationale: εἰςはここで結果または目的を表し、日本語では「証しとなる」という述語構文で自然に表現できる。
- source_word: μαρτύριον
  choice: 証し
  rationale: 証言する行為・内容と、公の場での証言という含みを保つ。「証拠」と限定せず、文脈上の幅を残した。
theological_decisions:
- issue: 権力者の前で弟子たちが受ける苦難の意味
  choice: 予告された出来事が、弟子たちにとって証しとなる機会または結果になるという読みを保つ。
  alternative: その出来事自体が、敵対者を不利にする証拠となる。
  rationale: ルカの文脈では、逮捕され支配者たちの前に連れ出されることが、弟子たちによるイエスについての証言につながると読むのが自然である。ただし本文は、伝道の機会か法廷的な証拠かを明示的に限定していないため、「証し」という表現で幅を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「証し」は聖書文脈で定着している一方、一般読者にも理解可能であり、法廷的・宣教的な両方の含みを保つ。
