id: LUK.21.1
reference: Luke 21:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀναβλέψας δὲ εἶδεν τοὺς βάλλοντας ⸂εἰς τὸ γαζοφυλάκιον τὰ δῶρα αὐτῶν⸃ πλουσίους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/001.yaml
  text: Then he looked up and saw rich people putting their gifts into the treasury[a][b].
translation:
  language: ja
  text: さて、イエスは目を上げ、裕福な人々が献金所[a]に自分たちのささげ物[b]を入れているのをご覧になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「献金所」と訳したギリシア語は、神殿の献金を管理する区域、または献金を入れる容器を指すことがある。
    reason: cultural_note
  - marker: b
    text: 別訳「贈り物」。ここでは神にささげる金銭などを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναβλέψας
  choice: 目を上げ
  rationale: 視線を上方へ向ける具体的な動作を、自然な現代日本語で表した。
- source_word: δὲ
  choice: さて
  rationale: 強い対比ではなく、場面の進行を示す軽い接続として訳した。
- source_word: εἶδεν
  choice: ご覧になった
  rationale: 単純な視覚認識を表しつつ、イエスを主語とする日本語として自然で品位ある表現を選んだ。
- source_word: τοὺς βάλλοντας
  choice: 人々が……入れている
  rationale: 定冠詞付き分詞を人として明示し、献金の文脈に合う自然な動詞「入れる」で表した。
- source_word: εἰς τὸ γαζοφυλάκιον
  choice: 献金所
  rationale: 神殿の献金を納める場所または容器を指し得る語なので、一方に限定しすぎない簡潔な表現を選んだ。
- source_word: τὰ δῶρα αὐτῶν
  choice: 自分たちのささげ物
  rationale: αὐτῶνの所有関係を明示し、δῶραの「贈り物」という基本義を保ちながら、礼拝上の文脈に自然な語を用いた。
- source_word: πλουσίους
  choice: 裕福な人々
  rationale: 実体詞的に用いられた形容詞を、階層名のように響きすぎない自然な現代日本語で表した。
theological_decisions: []
