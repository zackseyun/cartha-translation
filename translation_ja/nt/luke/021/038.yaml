  text: καὶ πᾶς ὁ λαὸς ὤρθριζεν πρὸς αὐτὸν ἐν τῷ ἱερῷ ἀκούειν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/038.yaml
  text: And all the people would come early in the morning to him in the temple to hear him[a].
translation:
  language: ja
  text: 民衆は皆、朝早く、神殿[a]でイエスのもとに来て、彼の話を聞いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語は、聖所の内部だけでなく、中庭などを含む神殿域全体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: 民衆は皆
  rationale: 民全体を広く指す集合的・包括的な表現として、個々人の例外なき全員と過度に限定せず、自然な現代日本語にした。
- source_word: ὤρθριζεν
  choice: 朝早くから……来て……いた
  rationale: 動詞の早朝・夜明けの時間的含意と、未完了過去が示す習慣的・反復的な行為を表した。
- source_word: πρὸς αὐτόν
  choice: イエスのもとに
  rationale: 対格を伴う πρός の、人に向かって行く意味を自然に表し、日本語では指示対象を明確にするため「イエス」とした。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόν を標準的で簡潔な「神殿」と訳し、内陣ではなく境内・中庭を含む神殿域を指す点は脚注で明示した。
- source_word: ἀκούειν αὐτοῦ
  choice: その話を聞いていた
  rationale: 不定詞の目的の意味を文脈に自然に組み込み、イエスの教えを聞くことを現代日本語で明瞭に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。未完了過去の反復性を「来て、その話を聞いていた」で示し、「朝早くから」によって早朝に集まる情景を自然に表現した。
