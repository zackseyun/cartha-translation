id: LUK.21.16
reference: Luke 21:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παραδοθήσεσθε δὲ καὶ ὑπὸ γονέων καὶ ⸂ἀδελφῶν καὶ συγγενῶν καὶ φίλων⸃, καὶ θανατώσουσιν ἐξ ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/016.yaml
  text: But you will be handed over even by parents and brothers and relatives and friends[a], and they will put some of you to death.
translation:
  language: ja
  text: しかし、あなたがたは、両親や兄弟[a]、親族、友人にさえ引き渡され、彼らはあなたがたのうち何人かを殺します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「兄弟姉妹」「きょうだい」。ここで用いられているギリシア語の男性複数形は、姉妹を含むきょうだい全体を指すこともある。
    reason: ἀδελφῶνが男性の兄弟だけでなく、男女を含む同胞集団を指し得るという語彙上の幅を示すため。
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: 引き渡され
  rationale: παραδίδωμιの未来受動形。敵対者や権力者の手に渡されるという基本義を保ちつつ、親しい者による裏切りの含みを文脈に委ねる。
- source_word: δὲ
  choice: しかし
  rationale: 前節から話を続けながら、弟子たちへの保証とこれから述べる迫害との穏やかな対照を示す。
- source_word: καὶ
  choice: にさえ
  rationale: 外部の者だけでなく、身近な家族や友人までもが引き渡す側になるという強調を自然な日本語で表す。
- source_word: ὑπὸ
  choice: に
  rationale: 受動文で行為者を示すὑπόを、日本語の受動文に自然な助詞「に」で表した。
- source_word: γονέων
  choice: 両親
  rationale: γονεύςの複数形で、父母を集合的に指す。現代日本語で簡潔かつ自然な訳語。
- source_word: ἀδελφῶν
  choice: 兄弟
  rationale: 原文の男性複数形に対応する訳を本文に置く。ただし、同胞一般を指して姉妹を含み得るため、その可能性を脚注に示す。
- source_word: συγγενῶν
  choice: 親族
  rationale: 同じ家族・血縁集団に属する人々を指す広い語義を、明瞭な現代日本語で表す。
- source_word: φίλων
  choice: 友人
  rationale: φίλοςの複数形を、自然で品位のある現代日本語に訳した。
- source_word: θανατώσουσιν
  choice: 殺します
  rationale: θανατόωの未来能動形である。「死刑にします」では公的処刑に限定しすぎるため、意図的に死に至らせる意味を明確に表す「殺します」とした。
- source_word: ἐξ ὑμῶν
  choice: あなたがたのうち何人か
  rationale: 部分を表すἐκの慣用を自然な日本語にし、全員ではなく一部が殺されることを明示する。
theological_decisions:
- issue: 親族一覧におけるἀδελφῶνの範囲
  choice: 本文は「兄弟」
  alternative: 「兄弟姉妹」または「きょうだい」
  rationale: 男性複数形を本文で保持しながら、この親族語が文脈によって姉妹を含む同胞全体を指し得ることを脚注で保存し、範囲を一方的に確定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、迫害の予告にふさわしい厳粛さを保った。原文の一文構造と能動・受動の切り替えを維持し、「彼ら」によって殺害の主体を曖昧にしすぎないようにした。
