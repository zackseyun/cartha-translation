id: LUK.21.28
reference: Luke 21:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/028.yaml
  text: But when these things begin to happen[a], straighten up and lift up your heads[c][b], because your redemption is drawing near.
translation:
  language: ja
  text: しかし、これらのことが起こり始めたら[a]、身をまっすぐに起こし、頭を上げなさい[b]。あなたがたの贖い[c]が近づいているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらのことが起こり始めるとき」。
    reason: lexical_alternative
  - marker: b
    text: 「身をまっすぐに起こし」は「上を仰ぎ」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「贖い」は「解放」とも訳せる。ここでは、イエスに従う者たちに近づいている最終的な解放を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχομένων δὲ τούτων γίνεσθαι
  choice: しかし、これらのことが起こり始めたら
  rationale: 属格独立構文の時間的意味を自然な現代日本語で表し、ἀρχομένωνとγίνεσθαιの双方を「起こり始める」に反映した。δέは、直前の苦難から励ましへの穏やかな転換・対照として「しかし」とした。
- source_word: ἀνακύψατε
  choice: 身をまっすぐに起こし
  rationale: かがんだ姿勢から身を起こすという身体的な像と、勇気を取り戻す含意を保つ。「上を仰ぐ」という語義の可能性は脚注に示した。
- source_word: ἐπάρατε τὰς κεφαλὰς ὑμῶν
  choice: 頭を上げなさい
  rationale: 希望と確信を示す原文の身体的な像を、簡潔で自然な日本語として保持した。
- source_word: διότι
  choice: からです
  rationale: 命令の理由を明確に示す因果関係として、現代日本語に自然な文末表現を用いた。
- source_word: ἐγγίζει
  choice: 近づいている
  rationale: 現在進行中の接近を表す現在形の動的なニュアンスを保った。
- source_word: ἀπολύτρωσις
  choice: 贖い
  rationale: 解放・救出を含む救済論的な厚みを保持する標準的な訳語を採用し、より一般的な「解放」は脚注に示した。
theological_decisions:
- issue: 終末的な文脈における「あなたがたの贖い」の意味
  choice: 「あなたがたの贖い」と訳し、イエスに従う者たちに近づく最終的な解放・救いを指し得る表現として保持する。
  alternative: 目前の歴史的危機からの救出だけを指すと限定する、または終末性を除いて純粋に内面的・霊的な贖いと解する。
  rationale: 文脈は未来的・終末的だが、この一節自体は贖いの具体的な様態を詳述していない。そのため、政治的救出や非終末的な内面状態のいずれかに狭めず、原語の幅と神学的緊張を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「贖い」は一般語としてやや専門的だが、原語の救済論的な厚みを保つため本文に置き、意味を脚注で補った。命令形は威圧的になりすぎない「〜なさい」とした。
