id: LUK.21.7
reference: Luke 21:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐπηρώτησαν δὲ αὐτὸν λέγοντες· Διδάσκαλε, πότε οὖν ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ταῦτα γίνεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/007.yaml
  text: And they asked him[a], saying, “Teacher, when then will these things be, and what will be the sign when these things are about to happen?”
translation:
  language: ja
  text: そこで彼らは彼に尋ねた。「先生、それでは、これらのことはいつ起こるのですか。また、これらのことが起ころうとしている[a]とき、どんなしるしがあるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これらのことが起こることになっているとき」。ギリシア語の動詞は、「起ころうとしている」より広い意味にも訳せる。
    reason: μέλλῃには切迫性を表す用法がある一方、より一般的に将来の予定・成り行きを示す場合もあるため。
lexical_decisions:
- source_word: Ἐπηρώτησαν
  choice: 尋ねた
  rationale: アオリスト直説法による単純な過去の出来事を、直接の質問に最も自然な現代日本語で表した。
- source_word: δὲ
  choice: そこで
  rationale: 強い対比ではなく、直前の発言を受けて物語を進める緩やかな接続を表す。
- source_word: αὐτόν
  choice: 彼に
  rationale: 原文の代名詞を保ち、文脈上の指示対象を訳文内で不必要に特定し直さない。
- source_word: λέγοντες
  choice: （直接話法として表現）
  rationale: 日本語では「言って」と重ねず、引用を直結させることで、質問内容を導入する分詞の機能を自然に表した。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 教える者への呼びかけとして、現代日本語で明瞭かつ自然であり、「主人」などのより強い権威的含意を加えない。
- source_word: πότε οὖν
  choice: それでは、いつ
  rationale: πότεの時を問う意味と、直前の発言から問いを導くοὖνの推論的なつながりの両方を保った。
- source_word: ταῦτα ἔσται
  choice: これらのことはいつ起こる
  rationale: εἰμίの未来形はここでは出来事の生起を指すため、日本語では「ある」より「起こる」が自然である。複数的な指示の広がりは「これらのこと」で保った。
- source_word: σημεῖον
  choice: 徴
  rationale: 将来の出来事を示す意味深いしるしを指す語として、聖書本文にふさわしい簡潔で格調ある表現を選んだ。
- source_word: ὅταν
  choice: とき
  rationale: 接続法を伴う未来志向の時を表す節を、自然な日本語の時間表現にした。
- source_word: μέλλῃ
  choice: 起ころうとしている
  rationale: 単なる未来よりも、出来事が迫りつつある含みを示しながら、その近さを具体的に限定しない表現とした。
- source_word: γίνεσθαι
  choice: 起こる
  rationale: 出来事が生じることを指す文脈で、明瞭な現代日本語を用いた。
theological_decisions:
- issue: 終末的出来事の時期とμέλλῃの時間的含意
  choice: 「起ころうとしている」として切迫性の含みを残す
  alternative: 「起こることになっている」または単に「起こる」とする
  rationale: 弟子たちの問いが時期と徴の双方に向けられていることを保ちつつ、出来事がどれほど近いか、また何を指すかについて特定の終末論的枠組みを訳文に持ち込まないため。
translation_notes:
  register: 明瞭な現代標準語を基調とし、質問の口調は自然な丁寧体とした。「徴」は日常語の「しるし」よりやや格調があるが、この終末論的文脈で意味を明確に伝える語として採用した。原文の反復（ταῦτα）も「これらのこと」と二度訳して保った。
