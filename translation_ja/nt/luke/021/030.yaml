translation:
  language: ja
  text: 木々がすでに芽を出すと[a]、あなたがたはそれを見て、自分で夏がもう近いことが分かります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文をより直訳すると、「（木々が）すでに何かを出すと」となります。原文には「芽」や「葉」に当たる語はありませんが、木々についての文脈から「芽」を補っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ～すると
  rationale: 条件を伴う時を示す接続詞。季節の兆しについての一般的な例えとして、自然な日本語にした。
- source_word: προβάλωσιν
  choice: 芽を出す
  rationale: 基本義は何かを外へ出すこと。この文脈では木々が新しい成長を見せることを指すため、「芽を出す」が自然で分かりやすい。ただし原文には「芽」に当たる名詞が明記されていないため注を付した。
- source_word: ἤδη
  choice: すでに／もう
  rationale: 原文で二度用いられている時間的な強調を保ちつつ、それぞれの箇所で自然な日本語となるよう訳し分けた。
- source_word: βλέποντες
  choice: それを見て
  rationale: 観察することが認識の根拠となる分詞の関係を、自然な日本語で表した。
- source_word: ἀφ’ ἑαυτῶν
  choice: 自分で
  rationale: 外から教えられなくても、自らの観察によって判断できるという慣用的な意味を表す。
- source_word: γινώσκετε
  choice: 分かります
  rationale: 目にした兆しから季節を認識するという文脈に合う、明快で自然な表現。
- source_word: ἐγγὺς
  choice: 近い
  rationale: 時間的な接近を表す基本的で自然な訳語。
- source_word: θέρος
  choice: 夏
  rationale: 季節としての夏を指す明瞭な訳語。
