source:
  edition: SBLGNT
  text: Προσέχετε δὲ ἑαυτοῖς μήποτε βαρηθῶσιν ⸂ὑμῶν αἱ καρδίαι⸃ ἐν κραιπάλῃ καὶ μέθῃ καὶ μερίμναις βιωτικαῖς, καὶ ⸂ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος⸃ ἡ ἡμέρα ἐκείνη
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/034.yaml
  text: But watch yourselves[a], lest your hearts be weighed down with dissipation and drunkenness and the worries of life, and that day come upon you suddenly
translation:
  language: ja
  text: しかし、自分自身に気をつけなさい。飲み騒ぎ[a]や泥酔や日々の暮らしの思い煩いで心が重くなり、その日が不意にあなたがたを襲うことのないように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: このギリシア語は、度を越して酒を飲む放縦な振る舞いだけでなく、その後に残る吐き気や頭痛などを指すこともあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε δὲ ἑαυτοῖς
  choice: しかし、自分自身に気をつけなさい
  rationale: 警戒を促す現在命令の力を保ち、再帰代名詞も明示した。δὲは前後との対照・展開を示すため「しかし」とした。
- source_word: μήποτε βαρηθῶσιν ὑμῶν αἱ καρδίαι
  choice: そうでないと、…心が重くなり
  rationale: μήποτεの予防的警告を自然な日本語で示し、βαρέωの「重くする」という比喩を保持した。「心」は感情だけでなく内面全体を指す。
- source_word: κραιπάλῃ
  choice: 飲み騒ぎ[a]
  rationale: 過度の飲酒に伴う放縦や、その後の不快な影響まで指し得る語である。本文では一般読者に明瞭な「飲み騒ぎ」とし、語義の幅を脚注で示した。
- source_word: μέθῃ
  choice: 泥酔
  rationale: 酩酊・酒に酔った状態を明確かつ簡潔に表し、隣接するκραιπάληとの区別もある程度保った。
- source_word: μερίμναις βιωτικαῖς
  choice: 日々の暮らしの思い煩い
  rationale: βιωτικόςが通常の現世生活に関することを表すため、「日々の暮らし」とした。μερίμναιの不安や心配のニュアンスを「思い煩い」で表した。
- source_word: ἐπιστῇ ἐφ’ ὑμᾶς αἰφνίδιος
  choice: 突然あなたがたに迫る
  rationale: ἐφίστημιの、思いがけず目前に到来するという切迫感を「迫る」で表し、αἰφνίδιοςは自然な日本語に合わせて副詞的に訳した。
- source_word: ἡ ἡμέρα ἐκείνη
  choice: その日
  rationale: 終末論的含意は文脈に委ね、原文にない「裁き」などを補わず指示表現をそのまま保った。
theological_decisions:
- issue: 「その日」の終末論的指示対象
  choice: その日
  alternative: 裁きの日／終わりの日
  rationale: 談話の文脈では決定的な終末の日を指すが、原文はἡ ἡμέρα ἐκείνηとのみ述べる。 doctrinalな説明を本文へ加えず、原文の簡潔さと含みを保った。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、命令と終末的警告の厳粛さを保った。「心が重くなる」は原文の比喩を生かし、「その日」は説明的に言い換えなかった。
