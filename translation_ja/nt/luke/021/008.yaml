reference: Luke 21:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Βλέπετε μὴ πλανηθῆτε· πολλοὶ γὰρ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου ⸀λέγοντες· Ἐγώ εἰμι καί· Ὁ καιρὸς ἤγγικεν· ⸀μὴ πορευθῆτε ὀπίσω αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/008.yaml
  text: And he said[a], “See that you are not led astray. For many will come in my name, saying, ‘I am he,’ and, ‘The time has drawn near.’ Do not go after them.”
translation:
  language: ja
  text: イエスは言われた。「惑わされないように気をつけなさい。多くの者がわたしの名によって現れ、『わたしがその者だ』[a]とか、『時が近づいた』とか言うからである。彼らについて行ってはならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「わたしはある」または「わたしだ」。期待されている者、おそらくメシアを自称する言葉と考えられる。
    reason: 原文の省略的な自己同定と、その文脈上の含意を示すため。
lexical_decisions:
- source_word: Βλέπετε μὴ πλανηθῆτε
  choice: 惑わされないように気をつけなさい
  rationale: 警戒を促す命令と、それに続く受動形の警告を、自然な現代日本語で一体として表した。「惑わされる」は、真理からそれるという原語の含みも保つ。
- source_word: ἐλεύσονται ἐπὶ τῷ ὀνόματί μου
  choice: わたしの名によって現れ
  rationale: イエスの名や権威を根拠として来るという表現を保ちつつ、文脈に合う自然な日本語とした。「名を名乗って」よりも、原文の前置詞句を過度に限定しない。
- source_word: Ἐγώ εἰμι
  choice: わたしがそれだ
  rationale: 省略された補語を日本語で最小限に補い、偽の自己同定であることを伝える一方、「メシアだ」とまでは明示しない。原語の簡潔さと曖昧さは脚注で示す。
- source_word: Ὁ καιρὸς ἤγγικεν
  choice: その時は近づいた
  rationale: καιρόςを決定的・定められた時として「その時」と訳し、完了形の現在に及ぶ近接を「近づいた」で表した。
- source_word: μὴ πορευθῆτε ὀπίσω αὐτῶν
  choice: 彼らについて行ってはならない
  rationale: その者たちの後を追い、従うことを禁じる方向的な比喩を、明瞭な日本語で保持した。
theological_decisions:
- issue: 偽の主張者が語る Ἐγώ εἰμι の訳し方
  choice: わたしがそれだ
  alternative: わたしはある／わたしだ／わたしがメシアだ
  rationale: 文脈上は期待される者を自称する発言だが、原文は「メシア」を明記していない。「わたしがそれだ」は暗黙の補語を最小限に示し、神的自己啓示との関連を断定せず、原文の神学的緊張を残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イエス」は直前の文脈で明らかな主語を補い、「そこで」で叙述の流れを示した。命令は過度に古風にせず、厳粛さを保つ表現とした。
