  naturalness: 「わたしがその者だ」は、省略された自己同定を日本語として自然に表しつつ、原文にない「メシア」を本文へ持ち込まない。「時が近づいた」も明快で自然である。文頭の「そこで」はδὲの弱い接続をやや強く因果・帰結的に響かせるため、省く。
  terminology: 「惑わされないように気をつけなさい」「わたしの名によって現れ」「彼らについて行ってはならない」は適切である。「名によって」は、名・権威を根拠とする含意を残しており、本文では維持できる。
