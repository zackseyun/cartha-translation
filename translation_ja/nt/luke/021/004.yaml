id: LUK.21.4
reference: Luke 21:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀πάντες γὰρ οὗτοι ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον εἰς τὰ ⸀δῶρα, αὕτη δὲ ἐκ τοῦ ὑστερήματος αὐτῆς ⸀πάντα τὸν βίον ὃν εἶχεν ἔβαλεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/004.yaml
  text: For all these gave into the gifts out of their abundance, but she, out of her lack, put in all the livelihood she had.
translation:
  language: ja
  text: というのは、これらの人たちは皆、有り余るものの中から献金[a]をささげたのです。しかし、この女は乏しさの中から、生活のために持っていたものをすべてささげたのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ささげ物」。ギリシア語は「贈り物」を意味し、ここでは神殿にささげられたものを指す。
    reason: lexical_alternative
  - marker: b
    text: 「生活のために持っていたものをすべて」は、彼女の全生涯という意味ではなく、暮らしていくための資力をすべて指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: πάντες γὰρ οὗτοι
  choice: この人たちは皆
  rationale: πάντεςとοὗτοιを自然な現代日本語で表した。γάρの説明的なつながりは、文脈と「この人たちは」によって十分に伝わるため、機械的に「というのは」を加えなかった。
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: 有り余る中から
  rationale: περισσεύωが表す余剰・豊かさを、後半の「乏しい中から」と対照が明確になる形で訳した。
- source_word: ἔβαλον εἰς τὰ δῶρα
  choice: 献金をささげました
  rationale: βάλλωの投入する動作と、神殿でのδῶραという文脈を、日本語として自然な献金行為の表現にした。δῶραの直訳に近い語は脚注に残した。
- source_word: αὕτη δὲ
  choice: しかし、この女は
  rationale: 既出のやもめを指す女性形の指示代名詞と、δέの明確な対比を保持した。
- source_word: ἐκ τοῦ ὑστερήματος αὐτῆς
  choice: 乏しい中から
  rationale: ὑστέρημαの不足・欠乏を自然に表し、必ずしも社会的身分としての「貧困」に限定しない表現とした。
- source_word: πάντα τὸν βίον ὃν εἶχεν
  choice: 持っていた生活の糧をすべて
  rationale: βίοςを存在としての「命」ではなく、暮らしを支える資力・生計の意味に取り、ὃν εἶχενも明示した。
- source_word: ἔβαλεν
  choice: ささげた
  rationale: 献金箱へ入れる具体的行為を含みつつ、神殿への奉献という文脈に自然な動詞を用いた。
theological_decisions:
- issue: βίοςが指すもの
  choice: 生活の糧
  alternative: 命、生計のすべて
  rationale: 金銭をささげる文脈では、βίοςは生活手段・暮らしの資力を指す。「命」とすると、文字どおり生命を差し出したとの過度な解釈を招きうる。
- issue: τὰ δῶραの指示対象
  choice: 献金
  alternative: ささげ物、神殿の献金箱
  rationale: 神殿で寄付された金銭という直前の文脈を明瞭に伝えつつ、原文にない「献金箱」という具体物までは本文に補わなかった。語義上の別訳は脚注で示した。
- issue: やもめの行為に対する評価
  choice: 行為を記述するにとどめる
  alternative: 模範として称賛された行為、搾取の悲劇として批判された行為
  rationale: この節自体は金額と境遇の対比を述べるが、明示的な称賛または非難を付していないため、解釈上の緊張を本文で解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ささげる」を用いて神殿の文脈を自然に示しながら、本文に原文以上の制度的・神学的説明を加えないようにした。
