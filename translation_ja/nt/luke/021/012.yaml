id: LUK.21.12
reference: Luke 21:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πρὸ δὲ τούτων πάντων ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν καὶ διώξουσιν, παραδιδόντες εἰς ⸀τὰς συναγωγὰς καὶ φυλακάς, ⸀ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας ἕνεκεν τοῦ ὀνόματός μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/012.yaml
  text: But before all these things[a], they will lay their hands on you and persecute you, handing you over to synagogues and prisons[b], bringing you before kings and governors because of my name.
translation:
  language: ja
  text: しかし、これらすべてのことに先立って、彼らはあなたがたに手をかけて[a]迫害し、会堂や牢獄に引き渡し、わたしの名のゆえに王や総督たちの前へ連れて行きます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたに手をかけて」は、「あなたがたを捕らえて」とも訳せる。ギリシア語では直訳すると「あなたがたの上に手を置く」で、ここでは敵意をもって拘束したり危害を加えたりすることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τούτων πάντων
  choice: しかし、これらすべてのことに先立って
  rationale: πρό＋属格の時間的な先行を明示し、πάντωνを「すべて」として保持した。δέは前節との対照・展開を示すため「しかし」とした。
- source_word: ἐπιβαλοῦσιν ἐφ’ ὑμᾶς τὰς χεῖρας αὐτῶν
  choice: 彼らはあなたがたに手をかけて
  rationale: 敵意ある拘束や危害を表す慣用句である。「手をかける」はギリシア語の具体的な像を残しつつ、文脈上、逮捕・加害の意味で理解できる自然な日本語である。
- source_word: διώξουσιν
  choice: 迫害し
  rationale: 弟子たちがイエスの名のゆえに公権力の前へ連行される文脈なので、単なる追跡ではなく「迫害する」が適切である。
- source_word: παραδιδόντες
  choice: 引き渡し
  rationale: 迫害の具体的なあり方を示す分詞として、司法的・敵対的な含みを保つ「引き渡す」を用いた。
- source_word: εἰς τὰς συναγωγὰς καὶ φυλακάς
  choice: 会堂や牢獄に
  rationale: 施設名を解釈的に「会堂の当局」などと展開せず保持した。並列は日本語として自然な「や」で表し、εἰςの方向性を「に」で示した。
- source_word: ἀπαγομένους ἐπὶ βασιλεῖς καὶ ἡγεμόνας
  choice: 王や総督たちの前へ連れて行きます
  rationale: ἀπαγομένουςは対格複数の受動分詞で、弟子たちが連行されることを表す。日本語では主節の敵対者を動作主とする使役的な表現に整えつつ、ἐπίの司法的な「前へ」を保持した。
- source_word: ἕνεκεν τοῦ ὀνόματός μου
  choice: わたしの名のゆえに
  rationale: 「名」がイエスの人格・権威・告白を担う聖書的表現を解釈的に「わたしのために」と置き換えず保持した。「ゆえに」は原因と理由の両面を自然に伝える。
theological_decisions:
- issue: 迫害の理由としての「わたしの名」
  choice: 「わたしの名のゆえに」を本文に保持する
  alternative: 「わたしのために」「あなたがたがわたしに属しているために」
  rationale: τοῦ ὀνόματός μουが持つ、イエスの人格と権威を指し示す聖書的な響きを残し、特定の神学的説明に狭めないため。
- issue: 会堂の機能
  choice: 「会堂」と施設名のまま訳す
  alternative: 「会堂の裁判」「会堂の当局」
  rationale: 文脈上は取り調べや処罰の場・主体が含意され得るが、原文は制度・施設名のみを記しているため、解釈的な補足を本文に加えない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、預言的な談話にふさわしい落ち着きと尊厳を保った。「シナゴーグ」ではなく定着した聖書語「会堂」、「監獄」より自然な「牢獄」を採用した。脚注記号は説明対象である「手をかけて」の直後に置くのが最も明確だが、節全体の可読性を保つため文末に配置した。
