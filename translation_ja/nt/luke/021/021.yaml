id: LUK.21.21
reference: Luke 21:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη, καὶ οἱ ἐν μέσῳ αὐτῆς ἐκχωρείτωσαν, καὶ οἱ ἐν ταῖς χώραις μὴ εἰσερχέσθωσαν εἰς αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/021.yaml
  text: Then let those in Judea flee to the mountains[a], and let those in the midst of her depart, and let those in the countryside not enter into her.
translation:
  language: ja
  text: その時、ユダヤにいる者たちは山々へ逃げなさい。その都[a]の中にいる者たちはそこから立ち退きなさい。田園地帯にいる者たちは、その都に入ってはなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その都」はエルサレムを指す。ギリシア語では、ここで都を女性形の代名詞で受けている。
    reason: 指示対象と原文の女性形表現を説明するため。
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 直前に述べられたしるしを受け、その時点で取るべき行動を示す時間表現として自然である。
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: ユダヤにいる者たち
  rationale: 前置詞句が人々を限定している構造を、明瞭な現代日本語で表した。
- source_word: φευγέτωσαν εἰς τὰ ὄρη
  choice: 山々へ逃げなさい
  rationale: 三人称現在命令形の切迫した命令を保ち、ὄρηの複数形も「山々」で示した。
- source_word: οἱ ἐν μέσῳ αὐτῆς
  choice: その都の中にいる者たち
  rationale: αὐτῆςの指示対象は直前の文脈にあるエルサレムである。日本語では性を持つ代名詞をそのまま再現できず、「その都」として自然かつ明確にした。
- source_word: ἐκχωρείτωσαν
  choice: そこから立ち退きなさい
  rationale: その場所を離れ、外へ退くよう命じる意味を、避難の文脈に合う「立ち退く」で表した。
- source_word: οἱ ἐν ταῖς χώραις
  choice: 田園地帯にいる者たち
  rationale: χῶραιはここでは都市の外側にある地方・田園地帯を指すため、個々の畑に限定しない表現を選んだ。
- source_word: μὴ εἰσερχέσθωσαν εἰς αὐτήν
  choice: その都に入ってはなりません
  rationale: 否定命令の強さを保ちつつ、αὐτήνの指示対象を日本語で明示した。
theological_decisions:
- issue: αὐτῆς／αὐτήνの指示対象と女性形
  choice: 本文では「その都」とし、エルサレムを指すことを脚注で明示する。
  alternative: 「その中」「そこに」とだけ訳して指示対象を明示しない。
  rationale: ギリシア語の女性形代名詞は、直前の20節で言及されたエルサレムを受ける。日本語には対応する文法的性がなく、曖昧な代名表現では直前の「ユダヤ」を指すようにも読めるため、指示対象を明確にした。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。三つの命令を独立した文にして切迫感と並行性を保った。「なさい」と「入ってはなりません」により命令・禁止を明確にしつつ、過度に古風な文体は避けた。
source_grounding:
  english_pob_role: consult_only
