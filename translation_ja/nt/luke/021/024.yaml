id: LUK.21.24
reference: Luke 21:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πεσοῦνται στόματι μαχαίρης καὶ αἰχμαλωτισθήσονται εἰς ⸂τὰ ἔθνη πάντα⸃, καὶ Ἰερουσαλὴμ ἔσται πατουμένη ὑπὸ ἐθνῶν, ἄχρι ⸀οὗ ⸀πληρωθῶσιν καιροὶ ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/024.yaml
  text: And they will fall by the edge of the sword and will be led captive into all the nations[c][b][a], and Jerusalem will be trampled by the nations until the times of the nations are fulfilled.
translation:
  language: ja
  text: そして彼らは剣の刃に倒れ、捕虜としてあらゆる国々へ連れて行かれる。[a] エルサレムは、諸国によって、諸国の時が満ちるまで踏みにじられる。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あらゆる異邦人の間へ」とも訳せる。ここで「国々」と訳したギリシア語は、文脈によって「異邦人」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「エルサレムは異邦人に踏みにじられ、異邦人の時が満ちるまで」とも訳せる。ギリシア語の同じ語が、この節では「諸国」と訳されている。
    reason: alternative_reading
lexical_decisions:
- source_word: πεσοῦνται
  choice: 倒れ
  rationale: 戦争の文脈で、剣によって殺されることを示す「倒れる」という比喩を保ち、直接「死ぬ」と言い換えすぎない。
- source_word: στόματι μαχαίρης
  choice: 剣の刃にかかって
  rationale: 直訳は「剣の口によって」だが、日本語では「剣の刃にかかる」が具体的な像と致死的な意味を自然に伝える。
- source_word: αἰχμαλωτισθήσονται
  choice: 捕らわれて…連れて行かれる
  rationale: 受動態と、捕虜として他国へ移送される含意の双方を明確に表す。
- source_word: εἰς τὰ ἔθνη πάντα
  choice: あらゆる国々へ
  rationale: εἰς の移動方向を「へ」で示す。ἔθνη はここでは流刑先となる諸国を指すため「国々」とした。
- source_word: Ἰερουσαλὴμ
  choice: エルサレム
  rationale: 現代日本語で定着している地名表記。
- source_word: ἔσται πατουμένη
  choice: 踏みにじられ、その時は…続く
  rationale: 迂言的未来が示す継続状態を自然な日本語で表しつつ、「踏みにじる」という支配・蹂躙の像を保つ。
- source_word: ὑπὸ ἐθνῶν
  choice: 諸国の民に
  rationale: 行為主体を示す。単なる国家より人々を指す用法に適し、非ユダヤ人という可能性も排除しない表現とした。
- source_word: ἄχρι οὗ
  choice: …まで
  rationale: 時間的限界を簡潔かつ自然に示す。
- source_word: πληρωθῶσιν
  choice: 満ちる
  rationale: 定められた期間が満了する意味と、神学的な「成就」の含みを保てる日本語であり、特定の終末論を持ち込まない。
- source_word: καιροὶ ἐθνῶν
  choice: 諸国の民の時
  rationale: καιροί の意義ある時期・定められた期間という含みと、属格が示す関係の曖昧さを保持する。
theological_decisions:
- issue: ἔθνη の三つの用例の訳し分け
  choice: 流刑先では「国々」、行為主体および καιροί との属格では「諸国の民」
  alternative: すべて「異邦人」または「諸国」と統一する
  rationale: 同一語の結びつきを失わない範囲で、日本語の各構文に自然な表現を採用した。「諸国の民」は非ユダヤ人を指す可能性を残しつつ、それだけに意味を限定しない。脚注で「異邦人」という文脈上可能な訳を明示する。
- issue: καιροὶ ἐθνῶν の意味
  choice: 諸国の民の時が満ちる
  alternative: 異邦人の時が成就する／諸国に定められた期間が終わる
  rationale: 期間が神によって限定されている可能性と成就の含みを保ちながら、その期間の性質や終末論上の位置づけを本文で断定しない。
- issue: ἔσται πατουμένη の継続性
  choice: その時は…続く
  alternative: 踏みにじられるだろう
  rationale: 現在分詞と ἔσται による迂言的未来が表す継続状態を、日本語で曖昧にせず示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、戦争と捕囚の厳粛さにふさわしい格調を保った。「剣の刃にかかって倒れ」「踏みにじられ」によって原文の具体的な比喩を残した。長い一文を二文に分け、後半の継続性を「その時は…続く」で明示した。
