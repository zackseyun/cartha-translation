id: LUK.21.9
reference: Luke 21:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν δὲ ἀκούσητε πολέμους καὶ ἀκαταστασίας, μὴ πτοηθῆτε· δεῖ γὰρ ταῦτα γενέσθαι πρῶτον, ἀλλ’ οὐκ εὐθέως τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/009.yaml
  text: But when you hear of wars and upheavals[a], do not be terrified; for these things must happen first[b], but the end is not at once.
translation:
  language: ja
  text: しかし、戦争や騒乱[a]について聞くとき、おびえてはなりません。なぜなら、これらのことはまず起こらなければならないからです。しかし、終わりがすぐに来るわけではありません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「騒動」「混乱」「動乱」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「しかし、終わりはすぐではない」。または「しかし、終わりはすぐには来ない」。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν δὲ
  choice: しかし、…聞いても
  rationale: ὅτανの将来に関する時の意味を「…ても」で自然に表し、δέは前節からの展開と軽い対比を示す「しかし」とした。
- source_word: ἀκούσητε
  choice: …のことを聞いても
  rationale: 戦争や騒乱についての知らせを耳にするという文脈を、現代日本語で自然に表した。
- source_word: πολέμους
  choice: 戦争
  rationale: 武力衝突を指す通常の語義を明確に表す。ギリシア語は複数形だが、日本語では無標の「戦争」で複数の出来事を包含できる。
- source_word: ἀκαταστασίας
  choice: 騒乱
  rationale: 社会的・政治的な無秩序や動揺を広く表し、「暴動」や「反乱」に限定しない語を選んだ。
- source_word: μὴ πτοηθῆτε
  choice: おびえてはなりません
  rationale: 恐怖に襲われ、動揺することを禁じる強い表現を、明瞭で dignified な勧告として表した。
- source_word: δεῖ γὰρ ταῦτα γενέσθαι πρῶτον
  choice: これらのことはまず起こらなければなりません
  rationale: δεῖの必然性、γίνομαιの出来事が生じる意味、πρῶτονの時間的順序を保った。日本語では前後関係からγάρの説明的機能が明らかなため、独立した接続詞を加えずに表した。
- source_word: ἀλλ’ οὐκ εὐθέως τὸ τέλος
  choice: しかし、終わりがすぐに来るわけではありません
  rationale: 動詞のない簡潔なギリシア語を自然な日本語にするため「来る」を補った。「すぐに…わけではない」により、騒乱の直後に終わりが到来するとは限らないという否定を明確にした。
theological_decisions:
- issue: 終末の時期に関する発言
  choice: 戦争や騒乱はまず起こる必要があるが、それによって終わりが直ちに来るわけではない
  alternative: これらは終わり以前の時期に起こる出来事であり、終わりそのものではない
  rationale: 本文は騒乱の知らせと「終わり」の即時到来を同一視しないよう戒めるが、特定の終末論体系や詳細な時間表は示していない。その緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの警告にふさわしい落ち着いた格調を保った。「おびえてはなりません」は強さと読みやすさを両立させ、「終わり」には説明を加えず、原文の終末論的な含みを保持した。
