  to: しかし、戦争や騒乱[a]について聞くとき、おびえてはなりません。なぜなら、これらのことはまず起こらなければならないからです。しかし、終わりがすぐに来るわけではありません[b]。
  rationale: 主な修正は、「聞いても」を原文の未来時の条件・時を表す「聞くとき」に改めたことである。「なぜなら」を加えてγάρの説明的なつながりを明示した。終末の時期については、戦争や騒乱の報告があっても終わりが即時に到来するとはいえない、という本文の限定を保ち、特定の終末論的解釈は加えていない。脚注bは、原文が動詞を省いた簡潔な表現であることと、自然な補足訳を示すよう整えた。
