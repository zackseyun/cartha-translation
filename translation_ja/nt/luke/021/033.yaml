  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ μὴ παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/033.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: ja
  text: 天と地は過ぎ去る。しかし、わたしの言葉は決して過ぎ去らない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς καὶ ἡ γῆ
  choice: 天と地
  rationale: 宇宙的な全体を表す定型的な対句として、現代日本語でも自然で荘重な「天と地」とした。
- source_word: παρελεύσονται
  choice: 過ぎ去る
  rationale: παρέρχομαι の「消滅する、終わりに至る」という意味を保ちつつ、前後で同じ訳語を用いて原文の対照と反復を再現した。
- source_word: οἱ λόγοι μου
  choice: わたしの言葉
  rationale: λόγοι はここでイエスの語った言葉を指す。「言葉」は直接的で自然であり、複数形の集合的意味も日本語で適切に表せる。
- source_word: οὐ μὴ
  choice: 決して…ない
  rationale: 未来形とともに用いられた強い否定を、明瞭な現代日本語の「決して…ない」で表した。
- source_word: δὲ
  choice: しかし
  rationale: 天地の移ろいやすさとイエスの言葉の不変性との明確な対照を示す。
theological_decisions:
- issue: イエスの言葉が存続するという主張の強さ
  choice: 「決して過ぎ去らない」として、οὐ μὴ の強い否定を明示した。
  alternative: 「過ぎ去ることはない」
  rationale: 単純な否定へ弱めず、天地との鮮明な対照と発言の絶対的な力を保つ一方、本文以上の教理的説明は加えない。
translation_notes:
  register: 明瞭で格調のある現代標準語。短い宣言文の力を保つため、原文の反復を維持し、不要な補足や脚注は置かなかった。
