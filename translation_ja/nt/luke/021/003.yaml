  verdict: approve
  source_fidelity: SBLGNTの語順・意味関係を適切に反映している。「まことに、あなたがたに言います」はἈληθῶς λέγω ὑμῖνの厳粛な断言を保ち、「この貧しいやもめ」はἡ χήρα ἡ πτωχὴ αὕτηの指示性と貧困の描写を過不足なく伝える。「だれよりも多く入れました」はπλεῖον πάντωνおよび献金の文脈におけるἔβαλενを自然に表す。次節の理由（生活費を投じたこと）を先取りしていない。
  naturalness: 明瞭で自然な現代標準日本語である。「やもめ」と「まことに」はやや格調を帯びるが、聖書本文の発話として定着しており、意味も十分に明確である。
  terminology: 「やもめ」はχήραの標準的かつ正確な訳語であり、「貧しい」「入れました」も本文の語義と神殿献金の場面に適合する。神学的解釈や教派的な含意を加えていない。
