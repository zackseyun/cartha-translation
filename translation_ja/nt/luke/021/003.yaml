reference: Luke 21:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ἀληθῶς λέγω ὑμῖν ὅτι ἡ χήρα ⸂ἡ πτωχὴ αὕτη⸃ πλεῖον πάντων ἔβαλεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/003.yaml
  text: And he said[a], “Truly I tell you that this poor widow put in more than all of them.”
translation:
  language: ja
  text: そして言われた。「まことに、あなたがたに言います。この貧しいやもめは、だれよりも多く入れました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀληθῶς
  choice: まことに
  rationale: イエスの厳粛で強い断言を示す副詞として、品位がありつつ現代日本語でも理解しやすい表現。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の呼びかけと権威ある発言の力を保ち、明瞭な現代日本語とした。
- source_word: χήρα
  choice: やもめ
  rationale: 夫を亡くした女性を指す語。聖書本文として定着し、簡潔で正確な表現。
- source_word: πτωχή
  choice: 貧しい
  rationale: 困窮の度合いを本文で必要以上に限定せず、形容詞の基本的意味を自然に伝える。
- source_word: αὕτη
  choice: この
  rationale: 目の前の特定のやもめを指し示す指示的な力を保持した。
- source_word: πλεῖον πάντων
  choice: だれよりも多く
  rationale: 他の献金者全員との比較を自然な日本語で表し、次節にある理由の説明を先取りしない。
- source_word: ἔβαλεν
  choice: 入れました
  rationale: 神殿の献金箱に金銭を納めたという文脈を、過度に物理的な響きを与えず自然に表す。
theological_decisions:
- issue: やもめの献金についての比較
  choice: だれよりも多く入れました
  alternative: ほかのすべての人よりも多く入れました
  rationale: πλεῖον πάντωνは他の献金者全員との比較を表す。簡潔な比較表現にとどめ、割合や犠牲の大きさという次節の説明をここへ持ち込まない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。発言導入の主語「イエスは」は原文の接続的文脈では明示されないため補わず、「そして言われた」とした。「やもめ」はやや文語的だが、意味が明確で聖書文体として広く通用する。
