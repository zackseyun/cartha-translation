  text: Καί τινων λεγόντων περὶ τοῦ ἱεροῦ, ὅτι λίθοις καλοῖς καὶ ἀναθήμασιν κεκόσμηται εἶπεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/005.yaml
  text: And as some were speaking about the temple[a], that it had been adorned with beautiful stones and votive offerings, he said[b],
translation:
  language: ja
  text: ある人たちが、神殿[a]は美しい石や奉納物[b]で飾られている、と話していると、こう言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語は、内側の聖所だけでなく、境内を含む神殿域全体を指す。
    reason: cultural_note
  - marker: b
    text: 神にささげられ、神殿に飾られていた奉納品。別訳「ささげ物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινων λεγόντων
  choice: ある人たちが……話していると
  rationale: 属格絶対を自然な時の節として訳し、現在分詞の継続的な動作も表した。
- source_word: τοῦ ἱεροῦ
  choice: 神殿
  rationale: ἱερόνは内陣だけでなく神殿域全体を指す。本文では一般的で読みやすい「神殿」とし、範囲は注で明示した。
- source_word: λίθοις καλοῖς
  choice: 美しい石
  rationale: καλόςがここで表す、石の見事さや美観を簡潔に伝える。
- source_word: ἀναθήμασιν
  choice: 奉納物
  rationale: 神にささげられ、神殿に置かれた品を指すため、祭儀的な意味を保ちつつ現代日本語で通じる語を選んだ。
- source_word: κεκόσμηται
  choice: 飾られている
  rationale: 完了受動形が示す、飾られた結果として現にその状態にあるという意味を自然に表した。
- source_word: εἶπεν
  choice: こう言われた
  rationale: ギリシア語に明示されていない主語名を補わず、後続する発言へのつながりを「こう」で自然に示した。
