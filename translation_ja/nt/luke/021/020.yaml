id: LUK.21.20
reference: Luke 21:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε κυκλουμένην ὑπὸ ⸀στρατοπέδων Ἰερουσαλήμ, τότε γνῶτε ὅτι ἤγγικεν ἡ ἐρήμωσις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/020.yaml
  text: But when you see Jerusalem surrounded by armies[b][a], then know that her desolation has drawn near.
translation:
  language: ja
  text: しかし、エルサレムが軍勢に包囲されているのを見たなら[a]、その時、エルサレムの荒廃[b]が近づいたことを知りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「軍勢」は「軍営」または「陣営」とも訳せる。ギリシア語は軍隊の宿営地や、そこに陣取る軍勢を指し得る。ここではエルサレムを包囲する軍事勢力を表す。
    reason: lexical_alternative
  - marker: b
    text: 「荒廃」は、預言書に見られる裁きの表現を響かせている。関連する表現については、マタイ24章15節、マルコ13章14節を参照。
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: しかし、…見たなら
  rationale: δὲの穏やかな転換を「しかし」で示し、ὅτανと接続法による将来の条件を自然な日本語の「見たなら」で表した。
- source_word: κυκλουμένην ὑπὸ στρατοπέδων
  choice: 軍勢に包囲されている
  rationale: κυκλουμένηνの進行中の受動的状態と軍事的文脈を明確にする。στρατόπεδονは軍営・陣営とも軍勢とも取り得るため、本文では包囲する部隊を指す自然な表現を選び、語義の幅を脚注に残した。
- source_word: Ἰερουσαλήμ
  choice: エルサレム
  rationale: 現代日本語の聖書用語として定着した地名表記。
- source_word: τότε γνῶτε
  choice: その時、…と知りなさい
  rationale: τότεの時間的帰結と、γνῶτεのアオリスト命令法が求める認識を直接的に表す。
- source_word: ἤγγικεν
  choice: 近づいた
  rationale: 完了形が示す、近づいた結果として今や間近にある状態を簡潔に表現した。
- source_word: ἡ ἐρήμωσις αὐτῆς
  choice: その都が荒廃する時
  rationale: αὐτῆςがエルサレムを指すことを明示し、名詞的な直訳の不自然さを避けつつ、ἐρήμωσιςの預言的な「荒廃」という語感を保持した。「時」は日本語としてἤγγικενとの結びつきを自然にする補足。
theological_decisions:
- issue: エルサレムに迫る裁きの意味
  choice: 「その都が荒廃する時が近づいた」とし、都市に迫る荒廃を述べるにとどめる。
  alternative: 「滅亡が近い」と意訳する、または本文で「荒らす忌まわしいもの」と明示的に結びつける。
  rationale: ἐρήμωσιςの預言的・神学的響きを保ちながら、この節自体が明示しない終末論的枠組みや他箇所との同一視を本文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「包囲されている」で軍事的状況を具体的にし、「荒廃」によって原文の預言的響きを保持した。脚注記号は対応箇所に置き、[a]を語句の直後、[b]を節末に配置した。
