  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ, αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/026.yaml
  text: with people fainting from fear and expectation of the things coming upon the inhabited world[b][a], for the powers of the heavens will be shaken.
translation:
  language: ja
  text: 人々は、恐怖と、人の住む世界[a]に迫り来る事柄への予期のために、気を失う。天の諸力[b]が揺り動かされるからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「世界」または「地上」。ギリシア語は「人の住む世界」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「天の力」「天上の勢力」。この表現は、天体や宇宙的・天上的な力を広く指しうる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποψυχόντων ἀνθρώπων
  choice: 人々は……気を失う
  rationale: ἀποψύχωは恐怖のために力が抜け、失神するほどになることを表す。属格絶対に近い構文を、日本語では自然な主節として表現した。「心が弱る」より身体的・心理的な強さを保つ。
- source_word: ἀπὸ φόβου
  choice: 恐怖に襲われ
  rationale: ἀπόはここでは原因を示す。直訳的な「恐怖から」ではなく、強い恐れが人々を失神させるという因果関係を自然な日本語で示した。
- source_word: προσδοκίας τῶν ἐπερχομένων
  choice: 起ころうとしていることを予期して
  rationale: προσδοκία自体は期待・予期を意味し、必ずしも語義に「不吉な予感」を含まない。文脈の恐ろしさを保ちつつ、過剰な意味を加えない。「こと」により中性複数の出来事を日本語らしくまとめた。
- source_word: τῇ οἰκουμένῃ
  choice: 人の住む世界
  rationale: οἰκουμένηが指す、人間社会を含む居住世界という含意を明示する。「世界」「地上」も可能なため脚注を付した。
- source_word: αἱ δυνάμεις τῶν οὐρανῶν
  choice: 天の力
  rationale: 属格複数を日本語で簡潔に表し、天体、宇宙的な諸力、天上の諸勢力のいずれかに限定しない。
- source_word: σαλευθήσονται
  choice: 揺り動かされる
  rationale: 未来受動態の形と、終末的・宇宙的動揺のイメージを保持する。
theological_decisions:
- issue: 終末的文脈における「天の力」の意味
  choice: 「天の力」として曖昧さを保つ
  alternative: 「天体」または「天使的な諸勢力」と特定する
  rationale: この表現は天体、宇宙を支える力、天上の勢力を広く想起させうる。ギリシア語が一つに限定していないため、本文でも解釈を狭めず、脚注で可能な理解を示した。
translation_notes:
  register: 明瞭で現代的ながら、終末預言にふさわしい荘重さを保った。「人の住む世界」と「天の力」は原文の宇宙的な広がりと曖昧さを維持する。
