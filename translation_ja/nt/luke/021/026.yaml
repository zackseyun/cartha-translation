  to: 人々は、恐怖と、人の住む世界[a]に迫り来る事柄への予期のために、気を失う。天の諸力[b]が揺り動かされるからである。
  rationale: 原文の構文に従い、「恐怖」と「迫り来る事柄への予期」を、気を失うことの並列した原因として明示した。「迫り来る事柄」によりἐπερχομένωνの到来・襲来の含みを保ち、「天の諸力」によりδυνάμειςの複数形を反映した。いずれの修正も、天の諸力が天体か天上の勢力かという原文の曖昧さを解消しない。
