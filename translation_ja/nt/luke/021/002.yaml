  yaml_path: translation/nt/luke/021/002.yaml
  text: And he saw a poor widow putting in two small copper coins there,[a]
translation:
  language: ja
  text: また、貧しいやもめが、そこにレプタ銅貨を二枚入れるのをご覧になった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レプタ」は、非常に小さな銅貨。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδεν
  choice: ご覧になった
  rationale: ὁράωのアオリストを素直に訳した。文脈上の主語はイエスであり、現代日本語として自然な敬語を用いた。
- source_word: δέ
  choice: また
  rationale: 強い対比ではなく、前節から叙述を穏やかにつなぐ接続詞として訳した。
- source_word: τινα
  choice: （不定性を明示せず）
  rationale: τιςは人物が特定されていないことを示すが、日本語では「ある」を加えなくても自然にその不定性が伝わる。
- source_word: χήραν πενιχρὰν
  choice: 貧しいやもめ
  rationale: χήραは「やもめ」、πενιχρόςは乏しい暮らしを表す。「貧しい」は意味を過度に強めず、平明である。
- source_word: βάλλουσαν
  choice: 入れる
  rationale: βάλλωの基本義は「投げる」だが、献金を納める場面では「入れる」が自然で正確である。
- source_word: ἐκεῖ
  choice: そこに
  rationale: 直前の文脈で示された献金箱の場所を指す場所副詞として、そのまま訳した。
- source_word: λεπτὰ δύο
  choice: レプタ銅貨二枚
  rationale: 貨幣名称を保持して原文の具体性を伝え、「銅貨」を添えて何であるかを本文でも分かるようにした。価値の小ささは脚注で説明する。
theological_decisions: []
