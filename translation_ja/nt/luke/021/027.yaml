  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/027.yaml
  text: And then they will see the Son of Man coming in a cloud with power and great glory[a].
translation:
  language: ja
  text: その時、人々は、人の子が力と大いなる栄光を帯びて、雲の中を来るのを見る[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「雲に乗って」。ギリシア語は単数形で、直訳すれば「雲の中に」。この表現には、人の子が雲とともに来るダニエル書7章などのイメージが響いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: 見る
  rationale: 未来の視覚的認知を表す。文脈上の主語を自然な日本語にするため「人々は」を補い、簡明に「見る」とした。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 新約聖書で定着した称号であり、ダニエル書7章との結びつきも保つ。
- source_word: ἐρχόμενον
  choice: 来る
  rationale: 見る対象の動作を表す現在分詞であり、終末論的文脈でも自然で過度な解釈を加えない。
- source_word: ἐν νεφέλῃ
  choice: 雲の中に
  rationale: ἐνと単数与格の形を尊重し、場所・領域を示す表現として訳した。「雲に乗って」という可能性は脚注に残す。
- source_word: μετὰ δυνάμεως
  choice: 力を帯びて
  rationale: μετά＋属格が示す随伴を自然な日本語で表し、力を伴う到来であることを明確にする。
- source_word: δόξης πολλῆς
  choice: 大いなる栄光
  rationale: πολλῆςの程度を荘重で自然な聖書日本語として表現する。
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπουというキリスト論的称号
  choice: 人の子
  alternative: 人間である者
  rationale: 称号としての用法とダニエル書7章への響きを保ち、単なる人間性の説明へ還元しない。
- issue: 雲の表象とダニエル書・神顕現の響き
  choice: 雲の中に
  alternative: 雲に乗って
  rationale: ルカ本文の単数形νεφέλῃとἐνを優先しつつ、別の自然な解釈は脚注で示して、イメージを一義的に固定しない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、終末論的宣言にふさわしい品位を保った。「大いなる」はやや荘重だが、δόξης πολλῆςの強さを自然に伝える。
