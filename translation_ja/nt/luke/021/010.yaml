id: LUK.21.10
reference: Luke 21:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε ἔλεγεν αὐτοῖς· Ἐγερθήσεται ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/021/010.yaml
  text: Then he said to them[a], “Nation will rise against nation, and kingdom against kingdom,”
translation:
  language: ja
  text: それから、イエスは彼らに言われた。「民族は民族に対して、王国は王国に対して立ち上がる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「起こる」。
    reason: ἐγείρω のこの形は、この文脈では自動詞的に「立ち上がる」とも「起こる」とも訳し得るため。
lexical_decisions:
- source_word: τότε
  choice: それから
  rationale: 直前の文脈を受ける時間的・談話的なつながりを、自然な現代日本語で示す。
- source_word: ἔλεγεν αὐτοῖς
  choice: イエスは彼らに言われた
  rationale: 未完了過去の進行・反復性を過度に強調せず、直接話法を導く自然な日本語とした。日本語で「彼は」とする不自然さを避け、文脈上の話者を明示した。
- source_word: Ἐγερθήσεται
  choice: 敵対して立ち上がる
  rationale: 未来の中動・受動形だが、この対立表現では自動詞的な「立ち上がる」が自然であり、外的な行為者を不必要に示唆しない。
- source_word: ἔθνος
  choice: 民族
  rationale: 政治的・集団的な民を指し、後続の βασιλεία との語義上の区別も保つ。
- source_word: ἐπ’ ἔθνος
  choice: 民族に
  rationale: ἐπίと対格がこの定型的な対立表現で表す敵対関係を、「敵対して」と合わせて明確にした。
- source_word: βασιλεία
  choice: 国
  rationale: ここでは抽象的な王権ではなく政治的領域・国家を指すため、現代日本語で自然な「国」とした。
- source_word: ἐπὶ βασιλείαν
  choice: 国に
  rationale: 前半と並行する敵対関係を簡潔に保った。
theological_decisions:
- issue: 終末論的な対立の定型句
  choice: 民族や国家間の動乱についての率直な予告として訳し、特定の終末論体系を読み込まない。
  alternative: エルサレム陥落だけを指すと限定する、または終末の詳細な時系列として訳す。
  rationale: この節自体は民族と国が互いに敵対して立つことを述べるにとどまるため、より広い終末論上の論争は訳文で解決しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「民族は民族に、国は国に」という並行構造を維持し、原文で一度だけ現れる動詞を日本語でも両項にかかる形にした。
