id: LUK.18.9
reference: Luke 18:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸀καὶ πρός τινας τοὺς πεποιθότας ἐφ’ ἑαυτοῖς ὅτι εἰσὶν δίκαιοι καὶ ἐξουθενοῦντας τοὺς λοιποὺς τὴν παραβολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/009.yaml
  text: And he also told this parable to some who trusted in themselves that they were righteous and treated the rest with contempt:[a]
translation:
  language: ja
  text: また、自分自身に頼り、自分は正しい者だと考え、ほかの人々を見下している人たちに、イエスはこのたとえを語られた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ほかの人々を軽蔑している」、または「ほかの人々を取るに足りない者とみなしている」とも訳せる。
    reason: ἐξουθενοῦνταςは、他者を無価値な者、取るに足りない者とみなす意味を持つため。
lexical_decisions:
- source_word: Εἶπεν
  choice: 語られた
  rationale: 目的語が「このたとえ」であるため、現代日本語では「たとえを語る」が自然である。主語のイエスは文脈から補い、敬語で表した。
- source_word: δὲ
  choice: また
  rationale: 強い対照ではなく、物語を進める穏やかな接続として訳した。後続のκαίの付加的意味も日本語として自然にまとめている。
- source_word: καὶ
  choice: また
  rationale: 新たに加えられた教えであることを示す付加の意味を、δὲと合わせて文頭の「また」で表した。
- source_word: πρός τινας
  choice: 人たちに
  rationale: 発話動詞に伴うπρόςは、たとえが向けられた相手を示す。「ある人たちに」も可能だが、後続の修飾を受ける日本語として簡潔にした。
- source_word: τοὺς πεποιθότας ἐφ’ ἑαυτοῖς
  choice: 自分は……と自信を持ち
  rationale: 完了分詞が表す定着した自己確信を「自信を持ち」で表し、ἐφ’ ἑαυτοῖςの自己依拠を「自分は」によって明示した。
- source_word: ὅτι εἰσὶν δίκαιοι
  choice: 自分は正しい者だと
  rationale: δίκαιοιの道徳的・宗教的な意味を「正しい者」で保持し、文脈上の批判を訳語そのものに先取りさせなかった。
- source_word: ἐξουθενοῦντας
  choice: 見下している
  rationale: 相手を取るに足りないものとみなす意味を、明瞭で自然な現代日本語で表した。「軽蔑している」も可能である。
- source_word: τοὺς λοιπούς
  choice: ほかの人々
  rationale: 「残りの者たち」という字義を、この文脈で自然な「ほかの人々」とした。自己を他者全体から区別する含みを保っている。
- source_word: τὴν παραβολὴν ταύτην
  choice: このたとえ
  rationale: 共観福音書におけるπαραβολήの定着した自然な訳語として「たとえ」を用いた。
theological_decisions:
- issue: 自己義認を批判する文脈でのδίκαιοι
  choice: 正しい者
  alternative: 義人／自分は正しい
  rationale: 原語自体は軽蔑的な語ではないため、「独善的」などの解釈を織り込まず、話者による評価ではなく当人たちの自己認識として表した。
- issue: ἐφ’ ἑαυτοῖςが示す自己依拠
  choice: 自分は正しい者だと自信を持ち
  alternative: 自分自身に頼って、自分は正しいと考え
  rationale: 「自分自身に頼る」と明示する訳も可能だが、ここではπεποιθόταςの確信と、その内容を示すὅτι節の結び付きを自然に保った。救済論的な意味を必要以上に限定していない。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、聖書本文にふさわしい落ち着いた語調を保った。「イエス」はギリシア語本文では省略されているが、直前の文脈で明らかな主語を日本語の理解のために補った。
