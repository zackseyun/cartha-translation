id: LUK.18.8
reference: Luke 18:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/008.yaml
  text: I tell you that he will bring about justice for them quickly[a]. Nevertheless, when the Son of Man comes[b], will he really find faith on the earth?
translation:
  language: ja
  text: あなたがたに言います。神は彼らのために速やかに正義を実現します[a]。しかし、人の子が来るとき、果たして地上に信仰[b]を見いだすでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らの権利を回復します」「彼らのために正義を行います」または「彼らを正当と認めます」とも訳せる。ギリシア語は、法的に正当と認めることや、ある人のために正義を実現することを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「信頼」または「忠実さ」とも訳せる。ギリシア語は、信仰、信頼、忠実さを表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: 神は彼らのために正しい裁きを行います
  rationale: 直前の文脈にある神を主語として明示した。ἐκδίκησις は報復だけでなく、法的な権利の回復や正義の実現を表し得るため、やもめの訴えという文脈に即して「正しい裁き」とした。αὐτῶν は、その裁きを受ける者を「彼らのために」と表した。
- source_word: ἐν τάχει
  choice: 速やかに
  rationale: 行動が迅速で、遅延しないことを表す。特定の時期を断定しやすい「すぐに」よりも、原文の幅を保つ。
- source_word: πλὴν
  choice: しかし
  rationale: 神が正しい裁きを速やかに行うという断言から、その後の鋭い問いへ移る強い対照を、自然な現代日本語で示す。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着しており、ダニエル書7章との関連も保持する。
- source_word: ἐλθὼν
  choice: 来るとき
  rationale: アオリスト分詞を時間的に解し、主動詞「見いだす」との関係を自然な日本語で表した。
- source_word: ἆρα
  choice: 果たして
  rationale: 答えを深く問いかける修辞的な疑問の響きを保持する。
- source_word: τὴν πίστιν
  choice: 信仰
  rationale: πίστις の意味の広がりを狭めず、定冠詞を伴う表現も日本語として自然に訳した。文脈上は祈り続ける信頼や忠実さも含み得るため、脚注に代案を示した。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上に
  rationale: 終末的な問いの広い射程に合い、γῆ の通常の意味を簡潔で自然な日本語にした。
theological_decisions:
- issue: πίστις が「信仰」「信頼」「忠実さ」のいずれを指すか
  choice: 信仰
  alternative: 信頼、または忠実さ
  rationale: 本文では語義の広がりを保つ「信仰」を採用した。たゆまず祈るという文脈から「信頼」や「忠実さ」も可能だが、本文で一つに限定せず脚注に残した。
- issue: ποιήσει の省略された主語
  choice: 神
  alternative: 彼は
  rationale: 直前の18章7節で明示される神が継続する主語であるため、日本語で不自然な代名詞を避けて明示した。これは新たな解釈の付加ではなく、文脈上の指示対象を明確にしたものである。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの教えにふさわしい落ち着いた丁寧体とした。「果たして」で結びの問いの厳粛さを保ちつつ、過度に古風な表現は避けた。
