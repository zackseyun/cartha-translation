id: LUK.18.24
reference: Luke 18:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ αὐτὸν ὁ ⸀Ἰησοῦς εἶπεν· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες ⸂εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/024.yaml
  text: And Jesus[a], seeing him, said, “How difficult it is for those who have wealth to enter into the kingdom of God!”
translation:
  language: ja
  text: イエスは彼を見て言われた。「財産[a]を持つ人たちが神の国に入るのは、なんと難しいことか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「お金」とも訳せる。
    reason: χρήματαは金銭、財物、財産を意味し得るため、より字義的な語義を示す。
lexical_decisions:
- source_word: Ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς εἶπεν
  choice: イエスは彼を見て言われた
  rationale: アオリスト分詞Ἰδώνを、主動詞との関係が自然に伝わる連用表現「見て」で訳した。δέは軽い物語上の接続であり、日本語では明示しないほうが自然である。αὐτόνは文脈上、直前の裕福な指導者を指すため「彼」とした。
- source_word: Πῶς δυσκόλως
  choice: なんと難しいことか
  rationale: 疑問ではなく、困難の程度を強く示す感嘆表現として訳した。「不可能」とまでは言わない原文の強さを保っている。
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: 財産を持つ人たち
  rationale: 分詞句を保ちつつ、χρήματαが金銭だけでなく財物・富を指し得ることを「財産」で自然に表した。「富裕層」のような固定的な階級名にはしなかった。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσπορεύονται
  choice: 神の国に入る
  rationale: εἰςと移動動詞の組み合わせを日本語の自然な「神の国に入る」で表した。「神の国」は定着した、原文に透明な表現である。
theological_decisions:
- issue: 財産を持つ人が神の国に入ることについての発言の強さ
  choice: 入ることは非常に難しいという一般的な感嘆として訳す
  alternative: 財産を持つ人が入ることは絶対に不可能だと訳す
  rationale: この節のδυσκόλωςは「困難に」を意味し、それ自体は絶対的不可能を表さない。後続文脈によって先回りして意味を強めず、この節固有の緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの発言には簡潔で品位ある感嘆形「なんと難しいことか」を採用した。主語と対象の関係を明確にしつつ、原文の簡潔さを保った。
