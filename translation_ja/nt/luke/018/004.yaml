  text: しばらくの間、彼は応じようとしなかった。しかし、その後、心の中でこう言った。「私は神を恐れず、人を敬わないが、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἤθελεν
  choice: 応じようとしなかった
  rationale: 未完了過去が示す、一定期間続いた意志的な拒みを表す。目的語は直前のやもめの訴えから補い、日本語として自然にした。
- source_word: ἐπὶ χρόνον
  choice: しばらくの間
  rationale: 長さを特定しない時間的な幅を、自然で簡潔な日本語で表した。
- source_word: μετὰ ταῦτα δὲ
  choice: しかし、その後
  rationale: 時間の推移と、裁判官の態度に転機が生じる軽い対比の両方を保った。
- source_word: εἶπεν ἐν ἑαυτῷ
  choice: 心の中でこう言った
  rationale: 単なる思考ではなく、自己に向けた内的発話として表現した。
- source_word: Εἰ καὶ
  choice: 〜が
  rationale: ここでは仮定ではなく譲歩を表す。引用が次節へ続く日本語の構文に合わせ、文末の「が」でその譲歩関係を保った。
- source_word: τὸν θεὸν οὐ φοβοῦμαι
  choice: 私は神を恐れず
  rationale: 神への畏敬を含み得るが、裁判官自身が認める道徳的欠如を率直に表すため、「神を恐れる」という聖書的な表現を保持した。
- source_word: οὐδὲ ἄνθρωπον ἐντρέπομαι
  choice: 人を人とも思わない
  rationale: 人に敬意や配慮を示さないという意味を、単数のἄνθρωπονが持つ一般的な人間への言及を保ちつつ、明瞭で自然な日本語の慣用表現にした。
theological_decisions:
- issue: 単数形ἄνθρωπονの一般的用法
  choice: 人を人とも思わない
  alternative: だれをも顧みない
  rationale: 神との対比を保ちながら、特定の男性ではなく人間一般を指すことが自然に伝わる表現を選んだ。
- issue: Εἰ καὶの譲歩的意味
  choice: 引用末尾の「が」で表す
  alternative: たとえ〜なくても
  rationale: 裁判官が実際に神を恐れず人を顧みないことを認めているので、仮定と誤解され得る表現を避け、現実を前提とした譲歩として訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁判官の冷淡な自己認識が率直に響く、簡潔で品位ある語調とした。引用文は次節へ続くため、閉じ括弧を置かず「が、」で終えた。
