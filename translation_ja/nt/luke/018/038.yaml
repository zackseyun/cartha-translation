  text: And he cried out[a], saying, “Jesus, Son of David, have mercy on me!”
translation:
  language: ja
  text: 彼は大声で叫んだ。「ダビデの子[a]イエスよ、私をあわれんでください！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ダビデの子」は、約束されたダビデ系の王を想起させるメシア的称号。より一般的には「ダビデの子孫」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβόησεν
  choice: 大声で叫んだ
  rationale: 動詞 βοάω が表す声の大きさと訴えの切迫感を、自然な現代日本語で明確に伝える。
- source_word: λέγων
  choice: 直接話法で表現
  rationale: ギリシア語では発言を導く分詞だが、日本語では「言って」を重ねず、引用を直接続けるほうが自然である。
- source_word: Ἰησοῦ
  choice: イエスよ
  rationale: 呼格であるため、標準的な固有名表記に呼びかけの助詞「よ」を添えた。
- source_word: υἱὲ Δαυίδ
  choice: ダビデの子
  rationale: 単なる血統の説明に限定せず、文脈上の王的・メシア的称号の響きを保つ。
- source_word: ἐλέησόν με
  choice: 私をあわれんでください
  rationale: あわれみに基づく行為を求める切実な命令・嘆願を、尊敬を伴う自然な日本語で表した。
theological_decisions:
- issue: υἱὲ Δαυίδ のメシア的含意
  choice: 「ダビデの子」という称号として訳す。
  alternative: 「ダビデの子孫」として系譜的に訳す。
  rationale: ルカの物語では約束されたダビデ系の王を想起させる呼称として機能する。「ダビデの子」は、その含意を説明で固定しすぎず保持できる。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、切迫した呼びかけにふさわしい品位を保った。「憐れむ」ではなく、一般読者が読みやすい「あわれむ」を用いた。
