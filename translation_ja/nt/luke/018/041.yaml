  text: ⸀Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπεν· Κύριε, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/041.yaml
  text: “What do you want me to do for you?” And he said[a], “Lord[b], that I may see again.”
translation:
  language: ja
  text: 「わたしに何をしてほしいのか。」彼は答えた。「主よ[a]、もう一度見えるようにしてください[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「先生」とも訳せる。ギリシア語の κύριε は敬意を示す呼びかけとしても用いられるが、本訳では κύριος の基本訳である「主」を用いた。
    reason: alternative_reading
  - marker: b
    text: 別訳「視力を取り戻させてください」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί σοι θέλεις ποιήσω
  choice: 何をしてほしいのか
  rationale: 直訳調の「あなたに何をすることを望むか」ではなく、受益者を表す σοι と θέλεις ποιήσω の関係を、現代日本語の自然な問いとして表した。文脈上、行為者がイエスであることは明らかである。
- source_word: ὁ δὲ εἶπεν
  choice: 彼は答えた
  rationale: δέ はここでは強い逆接ではなく話者の交替を示す。直前の問いへの返答なので、日本語では「答えた」が自然である。
- source_word: Κύριε
  choice: 主よ
  rationale: κύριος の基本訳を保ち、敬意ある呼びかけと、イエスに対するより深い認識の可能性の両方を残した。
- source_word: ἵνα ἀναβλέψω
  choice: もう一度見えるようにしてください
  rationale: ἵνα は願いの内容を導き、ἀναβλέπω はこの治癒の文脈では視力の回復を意味する。日本語の直接的な願いとして自然に表現した。
theological_decisions:
- issue: イエスへの直接呼格 κύριε の訳
  choice: 主よ
  alternative: 先生、どうか
  rationale: 単なる丁寧な「先生」に限定せず、「主」という呼称が持ちうるキリスト論的含意を残す。一方、ギリシア語が敬称としても用いられることは脚注で示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、対話の簡潔さと品位を保った。「主よ」は聖書的な響きを保つが、曖昧さは脚注で明示した。
