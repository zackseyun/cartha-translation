  text: saying[a], “There was a certain judge in a certain city who did not fear God and did not respect people.
translation:
  language: ja
  text: こう言われた。「ある町に、神を恐れず、人を敬わない裁判官がいた。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγων
  choice: こう言われた
  rationale: 前節の「たとえを話された」を受けて、その内容を導入する現在分詞。日本語では独立した発話導入として自然な定動詞表現にした。
- source_word: Κριτής τις
  choice: ある裁判官
  rationale: 不定代名詞 τις の、名を特定せず物語の登場人物を導入する働きを「ある」で表した。
- source_word: ἔν τινι πόλει
  choice: ある町に
  rationale: 二度目の τις も「ある」とし、場所が特定されていないことを保った。πόλις はこのたとえの文脈では自然な「町」とした。
- source_word: τὸν θεὸν μὴ φοβούμενος
  choice: 神を恐れず
  rationale: 裁判官の恒常的な性質を表す分詞句。「恐れる」は神への畏れを含む原文の宗教的・倫理的含意を保持する。
- source_word: ἄνθρωπον μὴ ἐντρεπόμενος
  choice: 人を顧みない
  rationale: 単数の ἄνθρωπον は人一般を代表する総称用法。「人」は日本語で数を限定せず自然に総称を表せる。ἐντρέπομαι はここでは人への敬意や配慮を払う意味であり、「顧みない」が文脈に即して自然である。
theological_decisions:
- issue: 神への畏れと人への配慮の対比
  choice: 「神を恐れず、人を顧みない」
  alternative: 「神を恐れず、誰をも敬わない」
  rationale: 原文の対句と、ἄνθρωπον の総称的な単数を「人」で保持した。「誰をも」とすると意味は明確になるが、原文の「神／人」という簡潔な対比が弱まる。
translation_notes:
  register: 明瞭で格調を保った現代標準語。裁判の役職名には一般読者に分かりやすい「裁判官」を用い、物語導入の簡潔さと原文の反復的な不特定性を保った。
