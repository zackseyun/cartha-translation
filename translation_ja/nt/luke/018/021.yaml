  text: And he said[a], “I have kept all these things from my youth.”
translation:
  language: ja
  text: 彼は言った。「これらはすべて、若いころから守ってきました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: すると彼は言った
  rationale: δέは弱い接続辞であり、ここでは強い対比を加えず、応答の流れを自然に示す「すると」とした。
- source_word: Ταῦτα πάντα
  choice: そのすべてを
  rationale: 直訳的には「これらすべて」で、直前の戒めを指す。「戒め」を本文に補わず、自然な日本語で指示内容を保った。
- source_word: ἐφύλαξα
  choice: 守ってきました
  rationale: φυλάσσωは戒めを守る、遵守する意。アオリスト形だが、若い時を起点として現在までの履歴を主張する文脈を、日本語の「守ってきました」で自然に表した。
- source_word: ἐκ νεότητος μου
  choice: 若い時から
  rationale: ἐκ＋属格は時間的起点を示す。νεότηςは「若さ、青年期」であり、「子どもの時」と限定せず「若い時」とした。
