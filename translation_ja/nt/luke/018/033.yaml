  yaml_path: translation/nt/luke/018/033.yaml
  text: And after flogging him[a], they will kill him, and on the third day he will rise.
translation:
  language: ja
  text: 彼らは彼をむちで打った後、殺す。そして、彼は三日目によみがえる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は三日目によみがえらされる」。ここでのギリシア語は、より直接的には「よみがえる」。
    reason: alternative_reading
lexical_decisions:
- source_word: μαστιγώσαντες
  choice: むちで打ってから
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、「打ってから」とした。「むちで打つ」は現代日本語で明瞭であり、行為の苛酷さも伝える。
- source_word: ἀποκτενοῦσιν
  choice: 殺す
  rationale: 未来能動三人称複数で、文脈上の敵対者たちを主語とする。原語の基本的な意味を、余分な法的・道徳的含意を加えず簡潔に表した。
- source_word: αὐτόν
  choice: 彼を
  rationale: 文脈上、人の子であるイエスを指す目的格代名詞なので、自然な日本語の代名詞とした。
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: 三日目に
  rationale: 時を示す与格を、自然で定着した日本語表現で訳した。
- source_word: ἀναστήσεται
  choice: よみがえる
  rationale: 未来中動態をここでは自動詞的に理解し、原文により直接的な「よみがえる」とした。日本語として自然で、復活の意味も明瞭に伝わる。
theological_decisions:
- issue: 復活の表現
  choice: 彼は三日目によみがえる
  alternative: 彼は三日目によみがえらされる
  rationale: ギリシア語は未来中動態であり、ここでは自動詞的な「よみがえる」が最も直接的である。他の箇所にある、神がイエスをよみがえらせたという表現を否定せず、この節の文法上の形を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「しかし」によって殺害と復活の対照を自然に示しつつ、原文の単純な接続を過度に解釈しないようにした。脚注記号は対応する復活表現の直後に置いた。
