  text: ὃς ⸀οὐχὶ μὴ ⸀ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/030.yaml
  text: who will certainly receive many times more in this time[a], and in the age to come, eternal life.
translation:
  language: ja
  text: その人は、この時に何倍も多く受け、来るべき世では永遠の命を受けることは間違いない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: その人は
  rationale: 前節で述べられた人を受ける関係代名詞。日本語では文の継続を自然に示すため「その人は」とした。
- source_word: οὐχὶ μὴ
  choice: 受けることは間違いない
  rationale: アオリスト接続法を伴う強い否定表現を、日本語では確実な肯定として自然かつ力強く表した。
- source_word: ἀπολάβῃ
  choice: 受け
  rationale: 文脈上、手放したものに対して与えられるものを受け取る意。接頭辞の「返して」を過度に明示せず、簡潔に訳した。
- source_word: πολλαπλασίονα
  choice: 何倍ものもの
  rationale: 中性複数の名詞的用法を保ち、原文が受ける対象を明示していないことを維持した。「報い」は自然だが、原文にない解釈を加えるため避けた。
- source_word: ἐν τῷ καιρῷ τούτῳ
  choice: この今の時に
  rationale: 特定の現在の時を指し、後続する「来るべき世」との対比を保つ。「この時代」と訳して αἰών の意味を先取りしないようにした。
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: 来るべき世では
  rationale: 新約聖書に見られる現在と将来の二つの世の対比を自然な日本語で保持した。
- source_word: ζωὴν αἰώνιον
  choice: 永遠の命
  rationale: 福音書における定着した訳語であり、将来の世に属する命という終末論的含意と、その永続性を簡潔に伝える。
theological_decisions:
- issue: αἰῶνι τῷ ἐρχομένῳ の終末論的表現
  choice: 来るべき世
  alternative: これから来る時代
  rationale: 単なる未来の時点ではなく、現在の秩序と対照される将来の世を示す表現として訳し、二つの世の緊張を保った。
- issue: 現在に受ける πολλαπλασίονα の内容
  choice: 何倍ものもの
  alternative: 何倍もの報い
  rationale: 原文は受ける対象を明示していないため、「報い」と限定せず、その開かれた表現を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。前節から続く関係節は、日本語で独立して理解できるよう「その人は」と受けた。強い二重否定は直訳的な否定構文を避け、「間違いない」で確実性を表現した。
