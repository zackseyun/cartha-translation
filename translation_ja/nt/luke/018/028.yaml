  yaml_path: translation/nt/luke/018/028.yaml
  text: Then Peter said[a], “Look, we have left our own and followed you.”
translation:
  language: ja
  text: すると、ペトロが言った。「ご覧ください。私たちは自分たちのもの[a]を後にして、あなたに従って来ました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちのもの」は、「自分たちに属するもの」または「自分たちの財産」とも訳せる。ギリシャ語の表現は幅が広く、ペトロたちが後にしたものを具体的に限定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ ὁ Πέτρος
  choice: すると、ペトロが言った
  rationale: δέを文脈の展開を示す「すると」とし、λέγωのアオリストは平明な物語表現「言った」とした。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 相手の注意を促す語の働きを保ちつつ、ペトロがイエスに語りかける場面にふさわしい自然な敬語表現とした。
- source_word: ἡμεῖς
  choice: 私たちは
  rationale: 明示された代名詞の強調を保つ。「ご覧ください」との組み合わせにより、ペトロが自分たちと直前の人物を対比している含みも自然に伝わる。
- source_word: ἀφέντες
  choice: 後にして
  rationale: 「捨てて」ほど強く断絶を断定せず、何かを残して立ち去る意味を自然な日本語で表した。
- source_word: τὰ ἴδια
  choice: 自分たちのもの
  rationale: 所有物だけでなく、家や生活上のつながりなども含み得る広い表現なので、対象を限定しない訳語を選んだ。
- source_word: ἠκολουθήσαμέν σοι
  choice: あなたに従って来ました
  rationale: 弟子として人に従うἀκολουθέωの意味を保ち、過去に始まった従属が発言時まで続いている文脈を自然な日本語で表した。
