  text: Καὶ ἐπηρώτησέν τις αὐτὸν ἄρχων λέγων· Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/018.yaml
  text: And a ruler asked him[a], saying, “Good Teacher, what must I do to inherit eternal life?”
translation:
  language: ja
  text: ある役人がイエスに尋ねた。「善い先生、永遠のいのちを受け継ぐには、何をすればよいでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησέν
  choice: 尋ねた
  rationale: 質問することを表す一般的な動詞であり、現代日本語の物語文として自然に訳した。
- source_word: τις ἄρχων
  choice: ある指導者
  rationale: τιςの不特定性を「ある」で示し、ἄρχωνは権威ある立場の人物を指すため、職位を過度に限定しない「指導者」とした。
- source_word: αὐτόν
  choice: イエスに
  rationale: 日本語では代名詞の「彼に」よりも指示対象を明示するほうが自然であり、文脈上の対象であるイエスを補った。
- source_word: Διδάσκαλε ἀγαθέ
  choice: 善い先生
  rationale: ἀγαθόςを次節の応答とのつながりが保たれる「善い」とし、διδάσκαλοςを現代日本語で自然な「先生」とした。
- source_word: τί ποιήσας
  choice: 何をしなければなりませんか
  rationale: アオリスト分詞と未来動詞の組み合わせが示す、行為を相続の前提・手段として問う趣旨を自然な日本語で表した。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: ルカの文脈で確立した意味を保ちつつ、聖書文体として親しまれ、かつ明瞭な表現を採用した。
- source_word: κληρονομήσω
  choice: 受け継ぐ
  rationale: 単なる獲得ではなく相続の比喩を保つため、「得る」ではなく「受け継ぐ」とした。
theological_decisions:
- issue: 永遠のいのちと人間の行為との関係を問う表現
  choice: 永遠のいのちを受け継ぐためには、何をしなければなりませんか
  alternative: 何をしたら、永遠のいのちを受け継ぐことになるのでしょうか
  rationale: この問いは指導者自身が永遠のいのちを必要な行為との関係で捉えていることを表す。翻訳では、その枠組みを肯定も修正もせず、続くイエスの応答に先立つ神学的緊張をそのまま残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、敬意ある問いかけと相続の比喩を保持した。「いのち」は聖書語としてのまとまりを示しつつ、過度に古風にならない表記とした。
