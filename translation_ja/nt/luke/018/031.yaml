id: LUK.18.31
reference: Luke 18:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Παραλαβὼν δὲ τοὺς δώδεκα εἶπεν πρὸς αὐτούς· Ἰδοὺ ἀναβαίνομεν εἰς ⸀Ἰερουσαλήμ, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/031.yaml
  text: Then taking the twelve aside[a], he said to them, “Look, we are going up to Jerusalem, and everything written through the prophets about the Son of Man will be fulfilled.”
translation:
  language: ja
  text: イエスは十二人をそばに連れて、彼らに言った。「見なさい。わたしたちはエルサレムへ上って行く。そして、預言者たちを通して人の子について[a]書かれたことは、すべて成就する。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近く「人の子のために」または「人の子に対して」とも訳せる。ここでは、預言者たちが人の子について書いた、という意味に理解した。
    reason: alternative_reading
lexical_decisions:
- source_word: Παραλαβὼν
  choice: そばに連れて
  rationale: 基本義の「連れて行く／伴う」を保ちつつ、この場面では十二人に向けた個別の教えであることを自然に示す。「脇へ連れ出して」ほど強く、本文に明示されない隔離を断定しない。
- source_word: τοὺς δώδεκα
  choice: 十二人
  rationale: 原文の定着した呼称をそのまま訳し、「弟子たち」を補わない。
- source_word: Ἰδοὺ
  choice: 見なさい
  rationale: 聞き手の注意を促す談話標識としての力を保つ。現代日本語でも理解できる、簡潔で格調ある命令表現とした。
- source_word: ἀναβαίνομεν
  choice: 上って行く
  rationale: 進行中または目前の移動を表す現在形と、エルサレムへの地理的・慣用的な「上る」の両方を保持する。
- source_word: Ἰερουσαλήμ
  choice: エルサレム
  rationale: 日本語で定着した地名表記。
- source_word: τελεσθήσεται
  choice: 成就する
  rationale: 未来受動形が示す、書かれた事柄が完成・実現に至る意味を、預言の文脈にふさわしい日本語で表す。日本語では受動態を機械的に再現せずとも、その実現される意味は保たれる。
- source_word: πάντα τὰ γεγραμμένα
  choice: 書かれたことは、すべて
  rationale: πάνταの全体性と、γεγραμμέναの完了的な「書かれている」状態を自然な語順で示す。
- source_word: διὰ τῶν προφητῶν
  choice: 預言者たちを通して
  rationale: διά＋属格の媒介・行為者の意味を保ち、神が預言者を通して語ったという聖書的な表現にも適合する。
- source_word: τῷ υἱῷ τοῦ ἀνθρώπου
  choice: 人の子について
  rationale: 与格を、預言者たちが書いた内容・対象を示すものとして自然に訳した。ただし「人の子のために／人の子に対して」という、より字義的な可能性は脚注に残す。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου というキリスト論的称号
  choice: 人の子
  alternative: 人間である者
  rationale: 伝統的かつ原語の形に近い「人の子」を用い、ダニエル書との響きと称号としての神学的含意を保持する。一般的な「人間」という意味に解消しない。
- issue: τῷ υἱῷ τοῦ ἀνθρώπου の与格の機能
  choice: 人の子について
  alternative: 人の子のために／人の子に対して
  rationale: 文脈上は預言の内容・関係対象を示す理解が自然だが、ギリシア語の与格にはより字義的な方向性・利害関係として読む余地があるため、その曖昧さを脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には簡潔で格調ある常体を採用した。「見なさい」「成就する」により、注意喚起と預言実現の重みを保った。
