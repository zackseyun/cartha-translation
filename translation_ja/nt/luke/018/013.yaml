revisions:
- from: しかし、徴税人は遠く離れて立ち、目を天に上げようとさえせず、胸をたたき続けて言った。「神よ、この罪人の私をあわれんでください。[a]」
  to: しかし、徴税人は遠く離れた所に立っていて、目を天に上げようとさえせず、自分の胸をたたき続けて言った。「神よ、この罪人である私を憐れんでください。」[a]
  rationale: 脚注の不正確になりうる代替訳を、原語の祈願として可能な意味に修正した。本文は意味を変えず、姿勢・反復動作・自己卑下の強調を保ちながら、現代標準日本語としてより自然な表現に整えた。
