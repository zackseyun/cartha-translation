id: LUK.18.13
reference: Luke 18:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς ⸂ἐπᾶραι εἰς τὸν οὐρανόν⸃, ἀλλ’ ⸀ἔτυπτε τὸ στῆθος ⸀αὐτοῦ λέγων· Ὁ θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/013.yaml
  text: But the tax collector[a], standing far off, was not willing even to lift up his eyes to heaven, but kept beating his chest, saying, ‘God, be merciful to me, the sinner.’
translation:
  language: ja
  text: しかし、徴税人は遠く離れた所に立っていて、目を天に上げようとさえせず、自分の胸をたたき続けて言った。「神よ、この罪人である私を憐れんでください。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私に対して恵み深くあってください」。この動詞は、贖いと宥めに関わる語群と関連している。
    reason: ἱλάσθητί の「憐れむ／恵み深くある」という文脈上の意味を保ちつつ、贖い・宥めに関わる語彙上の含みを、過度に特定の教義的解釈へ限定せず示すため。
lexical_decisions:
- source_word: τελώνης
  choice: 徴税人
  rationale: 当時の税を徴収する者を指す現代日本語として明確であり、文脈上の社会的な含みも保てる。
- source_word: μακρόθεν ἑστὼς
  choice: 遠く離れて立ち
  rationale: 空間的な隔たりを自然に表し、人物の姿勢も明示する。
- source_word: οὐκ ἤθελεν οὐδὲ
  choice: ようとさえせず
  rationale: 単にできなかったのではなく、そうしようとはしなかったという意志・ためらいを表す。
- source_word: ἐπᾶραι εἰς τὸν οὐρανόν
  choice: 目を天に上げる
  rationale: ギリシア語の身体表現と方向性を、自然な日本語で保つ。
- source_word: ἔτυπτε τὸ στῆθος αὐτοῦ
  choice: 胸をたたき続けて
  rationale: 未完了時制が示す継続・反復の動作を明確に伝える。
- source_word: ἱλάσθητί μοι
  choice: 私をあわれんでください
  rationale: 祈りとして自然で理解しやすい表現を採りつつ、贖罪・宥めに関係する語義上の含みは脚注に残す。
- source_word: τῷ ἁμαρτωλῷ
  choice: この罪人の私
  rationale: 定冠詞を伴う自己卑下の強調を、日本語として自然に伝える。「罪人である私」よりも祈りの切実さが表れる。
theological_decisions:
- issue: ἱλάσθητί μοι に含まれる、あわれみと贖罪・宥めとの関係
  choice: 本文では「私をあわれんでください」とする
  alternative: 「私のために償いをしてください」「私に対して宥められてください」
  rationale: 直接の祈りとして明瞭な日本語を優先する一方、動詞が贖罪・宥めに関わる語群に属することを脚注で示し、神学的な含みを失わせない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あわれむ」は聖書的な響きを残しつつ一般読者にも理解可能。反復動作は「たたき続けて」で明示し、τῷ ἁμαρτωλῷ の強調は「この罪人の私」で再現した。
