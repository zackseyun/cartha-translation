id: LUK.18.19
reference: Luke 18:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/019.yaml
  text: But Jesus said to him, “Why do you call me good? No one is good except one—God.”
translation:
  language: ja
  text: しかし、イエスはその人に言われた。「なぜ私を善いと呼ぶのですか。善い方は、神おひとりのほかにはいません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 文脈上、相手の呼びかけを受けて問い返す軽い対比・修正の響きを表す。「すると」も可能だが、ここでは応答の対照性を明確にした。
- source_word: εἶπεν ... ὁ Ἰησοῦς
  choice: イエスは…言われた
  rationale: λέγω の基本的な意味を保った。「答えられた」とすると応答性を補うため、より直接的な「言われた」とした。
- source_word: αὐτῷ
  choice: その人に
  rationale: 日本語では「彼に」よりも直前の人物を自然かつ明確に指す。「その人」は指示対象を過度に説明せず、代名詞の機能を伝える。
- source_word: Τί
  choice: なぜ
  rationale: τί は形式上「何」だが、τί με λέγεις ἀγαθόν という問いでは理由を問う「なぜ」が自然な日本語となる。
- source_word: με λέγεις ἀγαθόν
  choice: わたしを善いと呼ぶ
  rationale: λέγεις と補語 ἀγαθόν の関係を直接的に表し、「善いと言う」より呼称への問いであることを明確にした。
- source_word: ἀγαθόν / ἀγαθὸς
  choice: 善い／善い方
  rationale: 二つの用例を同じ語幹「善い」で対応させた。後者は人格を指すため「方」を補い、現代日本語として自然にした。「道徳的に善い」は意味を限定しすぎる。
- source_word: οὐδεὶς
  choice: …方は…いません
  rationale: 人を指す全面的な否定を、後続の例外表現と合わせて自然な日本語にした。
- source_word: εἰ μὴ εἷς
  choice: ただひとり…だけ
  rationale: 例外構文と εἷς の強調を日本語で明瞭に表す。やや重なる表現だが、唯一性を自然に強調できる。
- source_word: ὁ θεός
  choice: 神
  rationale: 定冠詞付きの θεός を、特定の唯一の神を指す日本語の通常表現「神」とした。
theological_decisions:
- issue: イエスの問いが持つキリスト論的含意
  choice: イエスがご自身の善性を否定したとも、ご自身の神性を直接宣言したとも訳文で明示せず、問いの形をそのまま保つ。
  alternative: 「わたしは善くない」と否定するように意訳する、または「わたしが神だから善い」と主張するように意訳する。
  rationale: ギリシア語本文は問いと、善い方は神だけだという宣言を並べるが、その含意をこの節だけで明示的に解説してはいない。したがって、神学的緊張と解釈上の余地を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には「です・ます」体を採用して品位を保った。「良い」ではなく倫理的・人格的な含みを伝えやすい「善い」を用いた。
