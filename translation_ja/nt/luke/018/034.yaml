id: LUK.18.34
reference: Luke 18:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ’ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/034.yaml
  text: And they understood none of these things[a], and this saying was hidden from them[c][b], and they did not understand the things being said.
translation:
  language: ja
  text: 彼らはこれらのことを何一つ理解しなかった。このことば[a]は彼らから隠されており[b]、彼らには語られていること[c]が分からなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この発言」または「この知らせ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 原文の受動表現は、誰または何が隠したのかを明示していない。
    reason: alternative_reading
  - marker: c
    text: 「語られていたこと」または「語られたこと」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: 悟らなかった
  rationale: 前に語られた受難と復活の予告を知的に把握できなかったことを表す。「理解しなかった」も可能だが、後半の ἐγίνωσκον との語彙上の違いをある程度保つため「悟る」とした。
- source_word: οὐδὲν τούτων
  choice: これらのことを何一つ
  rationale: 直前の複数の予告内容を指す τούτων の複数性と、οὐδέν の全面的否定を自然な日本語で明示した。
- source_word: τὸ ῥῆμα τοῦτο
  choice: このことば
  rationale: ῥῆμα は発言、その内容、知らせを指し得る。「ことば」はその幅を保ちつつ文脈にも適するため採用し、別訳を脚注に示した。
- source_word: κεκρυμμένον ἀπ’ αὐτῶν
  choice: 彼らから隠されており
  rationale: 完了受動分詞と ἦν による、隠された結果としての継続状態を表す。行為者を補わず、原文の受動表現を保った。
- source_word: ἐγίνωσκον
  choice: 分からなかった
  rationale: ここでは語られている内容を認識・理解できない意味。「悟らなかった」と言い換えることで、前半の συνῆκαν と完全に同じ訳語へ平板化するのを避けた。
- source_word: τὰ λεγόμενα
  choice: 語られていること
  rationale: 現在受動分詞の継続的な含みを保ちながら、現代日本語として自然に表現した。
theological_decisions:
- issue: 弟子たちにことばが隠されていた原因と行為者
  choice: 受動表現のまま「彼らから隠されており」とし、誰または何が隠したかを特定しない。
  alternative: 神が彼らに隠したと明示する、または彼らの心理的混乱だけを原因として示す。
  rationale: 原文は受動形で行為者を示していないため、神的・摂理的な隠蔽と人間的な理解不能との間にある神学的緊張を訳文で解消しない。
- issue: 三重に描かれる無理解
  choice: 「何一つ悟らなかった」「隠されており」「分からなかった」という三つの叙述をすべて残す。
  alternative: 重複とみなして一つか二つの表現にまとめる。
  rationale: ルカが重ねた無理解の強調を保持し、その性質を訳者が単純化しないため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての落ち着きと尊厳を保った。「ことば」は意味の幅を残すため平仮名表記とし、二つの認識動詞は「悟る」と「分かる」で訳し分けた。
