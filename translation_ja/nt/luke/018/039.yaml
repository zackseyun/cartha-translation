id: LUK.18.39
reference: Luke 18:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα ⸀σιγήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/039.yaml
  text: And those going ahead were rebuking him so that he would be silent; but he kept crying out all the more, “Son of David, have mercy on me!”
translation:
  language: ja
  text: 先を行く人々は、黙るようにと彼を叱りつけていた。しかし彼は、なおいっそう叫び続けた。「ダビデの子よ、私をあわれんでください！」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: 先を行く人々
  rationale: 実詞的に用いられた現在分詞であり、群衆または一行の前方を進んでいた人々を指す。役割を『先導者』と限定せず、空間的な意味を保った。
- source_word: ἐπετίμων
  choice: 叱りつけていた
  rationale: 強い制止や叱責を表す語であり、未完了過去の継続的・反復的な様相も『ていた』で示した。
- source_word: ἵνα σιγήσῃ
  choice: 黙るようにと
  rationale: ἵναと接続法が示す目的を自然な日本語で表し、単なる助言ではなく、彼を沈黙させようとする意図を保持した。
- source_word: πολλῷ μᾶλλον
  choice: なおいっそう
  rationale: 比較を強める表現。原文に明記されていない『大声で』などを補わず、行為の増大をそのまま示した。
- source_word: ἔκραζεν
  choice: 叫び続けた
  rationale: 未完了過去が示す持続または反復を明確にし、制止されても叫ぶのをやめなかったことを表した。
- source_word: Υἱὲ Δαυίδ
  choice: ダビデの子よ
  rationale: 呼格のダビデ的称号を訳出し、王的・メシア的含意を説明的に膨らませず保持した。
- source_word: ἐλέησόν με
  choice: 私をあわれんでください
  rationale: 切実な命令・嘆願を、明瞭で敬意ある現代日本語にした。『あわれむ』は慈悲を求める意味と聖書的響きを保つ。
theological_decisions:
- issue: Υἱὲ Δαυίδのメシア的意義
  choice: 本文で『ダビデの子よ』と称号として訳す
  alternative: 単なる敬称とみなして意義を弱める
  rationale: ルカの物語においてダビデ王家とメシアへの期待を帯びる称号である。原文以上の解説は加えず、称号そのものを直接訳すことで含意を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、嘆願の厳粛さを保った。二つの未完了過去は『叱りつけていた』『叫び続けた』として継続性を表現した。
