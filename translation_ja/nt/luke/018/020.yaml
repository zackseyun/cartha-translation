id: LUK.18.20
reference: Luke 18:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ μοιχεύσῃς, Μὴ φονεύσῃς, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν ⸀μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/020.yaml
  text: 'You know the commandments: Do not commit adultery[a], do not murder, do not steal, do not bear false witness, honor your father and mother.'
translation:
  language: ja
  text: あなたは戒めを知っています。「姦淫してはならない。殺してはならない。盗んではならない。偽証してはならない。あなたの父と母を敬いなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: 戒め
  rationale: 十戒のよく知られた規定を指す文脈であり、権威ある命令という意味と聖書上の響きを自然に保つ。
- source_word: οἶδας
  choice: 知っているでしょう
  rationale: οἶδαは形態上は完了形だが現在の意味で用いられる。ここでは相手の既知の事柄を示す語用論的な力も含め、自然な問いかけとして訳した。
- source_word: Μὴ μοιχεύσῃς
  choice: 姦淫してはならない
  rationale: μοιχεύωの婚姻関係に対する不貞という具体的意味を保ち、十戒の引用としての荘重さも示す。
- source_word: Μὴ φονεύσῃς
  choice: 殺してはならない
  rationale: φονεύωは不法に人を殺すことを表す。日本語の十戒として定着した簡潔な表現を採り、あらゆる殺害行為をめぐる解釈を本文で過度に限定しない。
- source_word: Μὴ κλέψῃς
  choice: 盗んではならない
  rationale: κλέπτωの基本義を簡潔で明瞭な現代日本語で表す。
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: 偽証してはならない
  rationale: 偽りの証言をするという意味を端的に表し、十戒の法的・証言的な響きを保つ。
- source_word: Τίμα
  choice: 敬いなさい
  rationale: τιμάωがここで表す、親に敬意と重んじる態度を示す倫理的命令を自然に表す。
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: あなたの父と母
  rationale: 双方の親を明示する原文をそのまま保ちつつ、日本語として自然にまとめた。
theological_decisions:
- issue: 十戒形式の禁止命令の訳し方
  choice: 「〜してはならない」
  alternative: 「〜するな」
  rationale: ギリシア語の禁止命令の力を明確にしながら、十戒引用にふさわしい品位と、現代日本語での理解しやすさを両立する。
- issue: φονεύωの意味範囲
  choice: 「殺してはならない」
  alternative: 「殺人を犯してはならない」
  rationale: 原語は一般に不法な殺人を指すが、「殺人を犯す」は日本語ではやや説明的で法律用語的になる。伝統的な十戒の響きを保ち、適用範囲を本文だけで狭く確定しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、十戒の引用にふさわしい簡潔で荘重な調子を保った。引用中の禁止命令は統一して「〜してはならない」とした。
