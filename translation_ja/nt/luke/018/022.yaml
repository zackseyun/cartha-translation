source:
  edition: SBLGNT
  text: ἀκούσας ⸀δὲ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν ⸀οὐρανοῖς, καὶ δεῦρο ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/022.yaml
  text: 'When Jesus heard this, he said to him, “One thing still lacks for you: sell all that you have and distribute it to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: ja
  text: イエスはこれを聞くと、その人に言われた。「あなたには、なお一つ欠けていることがある。[a] 持っている物をすべて売り、貧しい人々に分け与えなさい。そうすれば、天に宝を持つことになる。[b] 来て、わたしに従いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたには、なお一つ足りないものがある」。ギリシア語では「一つのものが、なおあなたに欠けている」という構造。
    reason: lexical_alternative
  - marker: b
    text: 「天」に当たるギリシア語は複数形だが、日本語では通常「天」と訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: イエスはこれを聞くと
  rationale: アオリスト分詞を自然な時間節として訳し、直前の発言を受ける「これ」を補って発話の順序を明確にした。δέはここでは強い逆接にせず、文脈の推移として表した。
- source_word: Ἔτι ἕν σοι λείπει
  choice: あなたには、なお一つ欠けていることがある
  rationale: λείπειの「欠けている」という意味と、ἕνを主語とする原文の構造をできる限り保ちつつ、現代日本語として理解しやすくした。
- source_word: πάντα ὅσα ἔχεις
  choice: 持っている物をすべて
  rationale: πάντα ὅσαの包括性を明確にし、所有物を指す自然な日本語とした。
- source_word: πώλησον
  choice: 売り
  rationale: 決定的な行為を命じるアオリスト命令法を、簡潔な命令表現の一部として訳した。
- source_word: διάδος πτωχοῖς
  choice: 貧しい人々に分け与えなさい
  rationale: διαδίδωμιの配分する含意を「分け与える」で表し、πτωχοῖςを人格的で自然な「貧しい人々」とした。目的語は直前の売却物またはその価値を受けるため、日本語では明示せず自然に含意させた。
- source_word: ἕξεις θησαυρὸν ἐν οὐρανοῖς
  choice: 天に宝を持つことになる
  rationale: 未来形ἕξειςを結果を示す自然な日本語で表した。οὐρανοῖςは形態上複数だが、日本語では数を区別しない「天」が自然であり、意味を損なわない。
- source_word: δεῦρο ἀκολούθει μοι
  choice: それから来て、わたしに従いなさい
  rationale: δεῦροの招きと、現在命令法ἀκολούθειの継続的な弟子としての歩みを、過度に説明せず自然な命令として表した。「それから」は一連の命令の順序を示す。
theological_decisions:
- issue: 放棄と弟子として従うことの関係
  choice: この人物に向けられた具体的な全財産の売却・施与と、イエスに従う招きを、そのまま強い命令として訳した。
  alternative: すべての信者への普遍的な財産放棄命令と明示する、または経済的要求を単なる象徴として弱める。
  rationale: 原文はこの人物に対する具体的命令を述べ、その頂点を「わたしに従いなさい」に置く。翻訳ではその緊張を保持し、適用範囲について本文が明言しない教理的結論を付加しない。
- issue: 「欠けている」の主体
  choice: 「あなたには、なお一つ欠けていることがある」とし、人物に不足がある意味と、原文で「一つ」が文法上の主語である点を両立させた。
  alternative: 「あなたはなお一つ欠いている」として人物を直接の文法的主語にする。
  rationale: 原文の構造を保つことで、その人の達成を全面否定するよりも、なお残る一つの不足を指摘する表現上の力点を維持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスの命令は率直にしつつ、古風な語法は避けた。「分け与える」により配分のニュアンスを保ち、「従いなさい」で継続的な弟子道を自然に含ませた。
