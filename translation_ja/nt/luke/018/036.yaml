  yaml_path: translation/nt/luke/018/036.yaml
  text: And hearing a crowd passing by[a], he was asking what this meant.
translation:
  language: ja
  text: 群衆が通り過ぎるのを聞いて、これは何事かと尋ねていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これは何事なのだろうかと尋ねていた」「これは何事かと尋ね始めた」。未完了過去の動詞は、繰り返し尋ねていたことも、尋ね始めたことも表し得る。また、間接疑問の希求法には「何なのだろうか」というやや控えめな響きを認めることもできる。
    reason: 文法上の別訳
lexical_decisions:
- source_word: ἀκούσας
  choice: 聞いて
  rationale: アオリスト分詞の状況的・時間的な関係を、自然な日本語の接続形で表した。
- source_word: ὄχλου διαπορευομένου
  choice: 群衆が通り過ぎるのを
  rationale: 属格絶対に近い構造で、聞こえた事柄を示す。進行中の移動を表す現在分詞を「通り過ぎる」と訳した。
- source_word: ἐπυνθάνετο
  choice: 尋ねていた
  rationale: 未完了過去が示し得る継続的または反復的な問いかけを保った。「尋ね始めた」という起動的理解も可能である。
- source_word: τί εἴη τοῦτο
  choice: これは何事か
  rationale: 過去時制の動詞に従う間接疑問の希求法を、簡潔で自然な日本語にした。希求法に若干の不確かさを認めることもできるが、ここでは必ずしも強調しない。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、物語文として簡潔かつ品位ある調子にした。「何事か」は日常語よりやや改まっているが、この場面では自然であり、原文の「これは何か」を過度に解釈しない。
