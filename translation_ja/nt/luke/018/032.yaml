lexical_decisions:
- source_word: παραδοθήσεται
  choice: 引き渡され
  rationale: παραδίδωμιの未来受動形。受け渡しの主体や動機を限定せず、受動態を自然な日本語で保つ。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の受難予告を説明するγάρの機能を、現代日本語で明確に示す。
- source_word: τοῖς ἔθνεσιν
  choice: 異邦人
  rationale: この文脈では抽象的な「諸国民」ではなく、ユダヤ人ではない人々、とりわけ非ユダヤ人の権力者を指す。
- source_word: ἐμπαιχθήσεται
  choice: あざけられ
  rationale: 嘲弄されることを表す未来受動形。受難の文脈にふさわしい、明瞭で重みのある表現。
- source_word: ὑβρισθήσεται
  choice: 侮辱され
  rationale: 辱めや不当な扱いを含み得る語だが、ここでは並列された虐待行為の一つとして「侮辱され」が簡潔で適切。意味の幅は脚注に示す。
- source_word: ἐμπτυσθήσεται
  choice: 唾をかけられる
  rationale: 具体的な屈辱行為を、自然で直接的な現代日本語にする。
theological_decisions:
- issue: 受動動詞の省略された主語
  choice: 「人の子」を補う
  alternative: 代名詞相当の「彼」を補う、または主語を明示しない
  rationale: ギリシア語本文にはこの節内で主語が明記されていないが、直前の18章31節の「人の子」が明白な先行詞である。日本語で指示対象を明確にするため補ったもので、新たな神学的内容は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、受難予告にふさわしい簡潔で荘重な調子を保った。原文で反復される未来受動形は「引き渡され、あざけられ、侮辱され、唾をかけられる」と並列して再現した。
