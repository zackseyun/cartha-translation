  terminology: 「やもめ」はχήραに対応する、現代でも理解可能で簡潔な語です。「裁判官」「相手」も法的文脈に適合します。「正義を行う」より日常的な「正しい裁きをする」を採用しつつ、脚注で法的救済・権利擁護という語義の幅を示します。
