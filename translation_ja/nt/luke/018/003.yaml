  text: χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ καὶ ἤρχετο πρὸς αὐτὸν λέγουσα· Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/003.yaml
  text: And there was a widow in that city[a], and she kept coming to him, saying, ‘Give me justice against my adversary.’
translation:
  language: ja
  text: その町には、ひとりのやもめがいた。彼女は何度もその裁判官のところへ来て、こう言った。「私の相手に対して、私のために正しい裁きをしてください。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の相手から私を守ってください」または「私の相手に対して、私のために正義を行ってください」。このギリシア語の動詞は、必ずしも個人的な復讐ではなく、法的な救済や権利の擁護を得させることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: やもめ
  rationale: 夫を亡くした女性を指す語。物語の社会的背景を保ちつつ、聖書本文にふさわしい簡潔な日本語とした。
- source_word: δὲ
  choice: （明示せず）
  rationale: 物語を継続する接続辞であり、日本語では文脈上省略する方が自然である。
- source_word: ἦν ἐν τῇ πόλει ἐκείνῃ
  choice: その町には一人の……がいて
  rationale: 存在を表す構文を自然な現代日本語で表現した。πόλις は規模を過度に限定しない「町」とした。
- source_word: ἤρχετο πρὸς αὐτόν
  choice: 何度も裁判官のもとに来ては
  rationale: 未完了過去が文脈上示す反復・継続を「何度も」「来ては」で明示した。αὐτόν の指示対象である裁判官を補って読みやすくした。
- source_word: λέγουσα
  choice: 言った
  rationale: 反復を表す「来ては」と組み合わせることで、そのたびに訴えたことが自然に伝わる。
- source_word: Ἐκδίκησόν με
  choice: 私が正当な裁きを受けられるようにしてください
  rationale: 法的文脈での権利擁護・正義の実現を表し、個人的な復讐と誤解されるのを避けた。
- source_word: ἀπὸ τοῦ ἀντιδίκου μου
  choice: 相手を訴えているこの件で
  rationale: ἀντίδικος の訴訟上の相手という意味と、ἀπόを伴う救済要求を、日本語の司法的な訴えとして自然に表した。
theological_decisions:
- issue: ἐκδικέω の意味領域
  choice: 正当な裁きを受けられるようにする
  alternative: 私の相手に報復してください
  rationale: 裁判官への嘆願という文脈では法的救済・権利擁護が中心であり、報復に限定しない。ただし原語が含み得る「正当と認める／相手から救済する」という幅は脚注で示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「やもめ」は一般語の「未亡人」より原文の簡潔さと聖書的社会背景を保つ。「裁判官」は直前節から指示対象を補ったもの。
