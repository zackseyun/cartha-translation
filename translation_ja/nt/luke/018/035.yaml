id: LUK.18.35
reference: Luke 18:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν ⸀ἐπαιτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/035.yaml
  text: As he was approaching Jericho[a], a certain blind man was sitting beside the road[b], begging.
translation:
  language: ja
  text: イエスがエリコに近づいておられた時[a]、ある目の見えない人[b]が道端に座り、物乞いをしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エリコに近づいて行かれる間に」。原文は、近づく動作と次の出来事が同時に進んでいたことを表す。
    reason: grammatical_alternative
  - marker: b
    text: 「一人の目の見えない人」とも訳せる。原文の「ある」に当たる語には、その人を軽く取り立てて示すニュアンスがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （独立した語句としては訳出せず）
  rationale: ここでは物語を進めるための慣用的な導入表現であり、日本語で「さて」や「すると」を機械的に加えなくても、時を示す従属節によって自然に場面転換が伝わる。
- source_word: ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχὼ
  choice: イエスがエリコに近づいておられた時
  rationale: ἐν＋冠詞付き不定詞は同時進行の時を表す。ἐγγίζειν の継続的な様子と、εἰς のエリコへ向かう方向性を自然な日本語で表した。αὐτόν の指示対象は文脈上イエスなので、単独でも明瞭になるよう固有名で示した。
- source_word: τυφλός τις
  choice: ある目の見えない人
  rationale: τυφλός は現代日本語で自然な「目の見えない人」とし、τις の不定かつ軽い個別化のニュアンスを「ある」で保った。
- source_word: ἐκάθητο
  choice: 座り
  rationale: 未完了過去が示す背景的・継続的な状態は、文末の「物乞いをしていた」と組み合わせることで、日本語として自然に場面描写全体へ反映した。
- source_word: παρὰ τὴν ὁδὸν
  choice: 道端に
  rationale: παρά＋対格が示す道路沿いの位置を、簡潔で一般的な現代日本語にした。
- source_word: ἐπαιτῶν
  choice: 物乞いをしていた
  rationale: 施しを求めていた継続的な行為を明確に表す。「金を求めていた」と限定せず、原文の意味範囲を保った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、イエスへの敬意は過度に古風にならない補助動詞「おられた」で示した。「盲人」よりも一般読者に配慮した「目の見えない人」を採用し、場面描写の流れを保つため「座り、物乞いをしていた」とした。
