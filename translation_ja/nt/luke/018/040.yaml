  text: σταθεὶς δὲ ⸀ὁ Ἰησοῦς ἐκέλευσεν αὐτὸν ἀχθῆναι πρὸς αὐτόν. ἐγγίσαντος δὲ αὐτοῦ ἐπηρώτησεν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/040.yaml
  text: So Jesus stood still and ordered that he be brought to him[a]. And when he came near, he asked him[b],
translation:
  language: ja
  text: そこで、イエスは立ち止まり、彼を自分のところへ連れて来るように命じた。彼が近くに来ると、イエスは彼に尋ねた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταθεὶς
  choice: 立ち止まり
  rationale: ἵστημιのアオリスト受動分詞がここでは自動詞的に用いられ、進行を止めたことを自然な現代日本語で表す。
- source_word: δὲ
  choice: そこで
  rationale: 弱い接続を表し、直前の出来事を受けた自然な物語の進行を示す。強い逆接にはしない。
- source_word: ἐκέλευσεν
  choice: 命じた
  rationale: κελεύωの権威ある指示という語感を、簡潔で格調ある日本語で保つ。
- source_word: ἀχθῆναι πρὸς αὐτόν
  choice: その人を自分のところへ連れて来るよう
  rationale: ἄγωの受動不定詞を日本語では使役的な能動表現に転換し、周囲の人々がその人をイエスのもとへ導く場面を自然に表す。
- source_word: ἐγγίσαντος δὲ αὐτοῦ
  choice: その人が近くに来ると
  rationale: 属格独立構文の時間的関係を表し、αὐτοῦの指示対象が直前の盲人であることを日本語で明確にする。
- source_word: ἐπηρώτησεν αὐτόν
  choice: イエスは尋ねた
  rationale: ἐπερωτάωの通常の意味を保つ。日本語では主語を補って、尋ねた者と尋ねられた者の混同を避ける。目的語の内容は次節へ続くため省略する。
