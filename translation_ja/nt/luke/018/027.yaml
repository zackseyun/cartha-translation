  text: ὁ δὲ εἶπεν· Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατὰ ⸂παρὰ τῷ θεῷ ἐστιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/027.yaml
  text: But he said[a], “What is impossible with men is possible with God.”
translation:
  language: ja
  text: しかし、イエスは言われた。「人には不可能なことも、神には可能です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: しかし、イエスは言われた
  rationale: δέの穏やかな対比を「しかし」で示す。日本語では主語を補わないと前節の話者との区別が不明瞭になり得るため、文脈上の話者である「イエス」を明示した。
- source_word: Τὰ ἀδύνατα
  choice: 不可能なこと
  rationale: 中性複数形の形容詞が名詞的に用いられているため、「不可能なこと」と自然に表現した。
- source_word: παρὰ ἀνθρώποις
  choice: 人には
  rationale: παρά＋与格が示す人間の領域・能力を、現代日本語で自然な「人には」とした。ἀνθρώποιςは人間一般を指す。
- source_word: δυνατὰ
  choice: 可能です
  rationale: ἀδύναταとの明確な対照を保ち、実現可能であることを端的に表した。
- source_word: παρὰ τῷ θεῷ
  choice: 神には
  rationale: 人間の場合との対照を同じ「には」の構文で示し、神のもとでは可能であるという関係・領域を自然な日本語で表した。
theological_decisions:
- issue: 神にとって可能であることの範囲
  choice: 人間には不可能なことが神には可能である、という本文の対比をそのまま示す。
  alternative: あらゆる抽象的・論理的可能性を含む、神の絶対的能力についての格言として明示する。
  rationale: 文脈は救いと富む者が神の国に入ることを扱っている。訳文は広い言明を保ちつつ、本文を超える哲学的限定や拡張を加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。イエスの発言には丁寧体を用い、簡潔な対句構造を保持した。
