id: LUK.18.26
reference: Luke 18:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπαν δὲ οἱ ἀκούσαντες· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/026.yaml
  text: Then those who heard it said, “And who can be saved?”
translation:
  language: ja
  text: これを聞いた人々は言った。「それでは、だれが救われることができるのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπαν
  choice: 言った
  rationale: アオリスト直説法を、物語の単純な過去として自然に訳した。
- source_word: δὲ
  choice: は
  rationale: ここでは前の発言を受けて聞き手の反応へ移る軽い接続であり、日本語では主題提示の「は」によって自然に談話の推移を表した。
- source_word: οἱ ἀκούσαντες
  choice: これを聞いた人々
  rationale: 実体詞的なアオリスト分詞を「聞いた人々」とし、直前のイエスの言葉を指す目的語を文脈に即して「これ」と補った。
- source_word: Καὶ
  choice: それでは
  rationale: 驚きを伴って直前の内容から導かれる問いを導入する用法を、現代日本語で自然な「それでは」とした。単なる並列の「そして」より文脈上の反応をよく表す。
- source_word: τίς
  choice: だれが
  rationale: 問いの焦点である人物を示す疑問代名詞を直接的に訳した。
- source_word: δύναται
  choice: できる
  rationale: 能力または可能性を表す語義を保持し、σωθῆναι と合わせて「救われることができる」とした。
- source_word: σωθῆναι
  choice: 救われる
  rationale: 神の国に入ることをめぐる文脈なので、単なる危険からの救出ではなく救済の意味を表す標準的な訳語を選んだ。受動形も保持した。
theological_decisions:
- issue: σωθῆναι の文脈上の意味
  choice: 救済論的な「救われる」
  alternative: 「助け出される」「救出される」
  rationale: 前後は神の国に入ることと富む者の困難を論じているため、一般的・物理的な救出ではなく救済が中心である。ただし、だれがどのように救うかという説明は本文に加えなかった。
- issue: δύναται の可能・能力の保持
  choice: 「救われることができる」
  alternative: 「救われるのか」
  rationale: 後者も自然だが、原文の δύναται が明示する可能性・能力の問いを保つため、「できる」を訳出した。
translation_notes:
  register: 明瞭な現代標準日本語。会話として自然でありながら品位を保った。「それでは」により、直前の発言を聞いた人々の驚きと帰結的な問いを表現した。
