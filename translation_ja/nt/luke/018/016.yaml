id: LUK.18.16
reference: Luke 18:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸂προσεκαλέσατο αὐτὰ λέγων⸃· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με καὶ μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/016.yaml
  text: But Jesus called them to him[a], saying, “Let the children come to me, and do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: ja
  text: しかし、イエスは子どもたちを呼び寄せて、こう言われた。「子どもたちがわたしのところに来るのを許しなさい。邪魔してはいけません。神の国は、このような者たちのものだからです。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「このような者たちのものです、神の国は」。
    reason: ギリシア語の「このような者たちのもの」が前置される語順を示すため。本文が保つ指示範囲を解釈で限定しない。
lexical_decisions:
- source_word: προσεκαλέσατο αὐτὰ
  choice: 子どもたちを呼び寄せて
  rationale: 中動態の動詞は、自分のもとへ呼ぶ、呼び寄せることを表す。代名詞の指示対象を日本語で明確にし、自然な表現とした。
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: 子どもたちがわたしのところに来るのを許しなさい
  rationale: ἄφετε はここでは「許す」の命令であり、来ることを妨げず認めるよう求める直接的な命令として訳した。
- source_word: μὴ κωλύετε αὐτά
  choice: 邪魔してはいけません
  rationale: κωλύω の「妨げる、阻む」という広い意味を、平明で直接的な現代日本語で表した。目的語は直前の文脈から明白なので省略した。
- source_word: τῶν ... τοιούτων
  choice: このような者たち
  rationale: その場にいる子どもたちだけに限定せず、彼らに代表される者たちを指す表現として、ギリシア語の範囲を保った。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 定着した明瞭な訳語であり、神の王としての支配とその領域を一語義に限定しない。
- source_word: τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国は、このような者たちのものだからです
  rationale: 属格を伴う「〜のものである」という構文を自然な日本語で再現し、神の国とこのような者たちとの所属・関係を明確にした。
theological_decisions:
- issue: τῶν τοιούτων の指示範囲
  choice: 目の前の子どもたちを代表例として、このような者たち全般を指す
  alternative: 連れて来られた子どもたちだけを指す
  rationale: τοιοῦτος は通常、目の前の対象と同じ種類・性質の者へ範囲を広げる。ただし、どのような性質が念頭にあるかはこの節だけでは特定しない。
- issue: 「神の国は〜のもの」の関係
  choice: 所属・帰属を表す日本語で訳す
  alternative: 「神の国はこのような者たちから成る」と理解する
  rationale: 属格構文の幅を保ちながら、本文が明示していない神の国の構成にまで意味を限定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、イエスの命令の直接性を保った。「言われた」は品位ある聖書本文の文体として用い、命令部分は日常的に理解しやすい表現とした。
