  text: イエスは彼らに言われた。「まことに、あなたがたに言います。神の国のために、家、妻、兄弟、両親、あるいは子どもを後にした者で、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: イエスの厳粛な宣言を、現代日本語として明瞭かつ格調を保って表した。
- source_word: ἀφῆκεν
  choice: 後にした
  rationale: 物理的に捨てることだけに限定せず、神の国のために家族や家を離れるという文脈上の広がりを保つ。
- source_word: οἰκίαν
  choice: 家
  rationale: 建物としての家と家庭・家の営みの双方を含み得る語の幅を、日本語の「家」で保持する。
- source_word: ἕνεκεν τῆς βασιλείας τοῦ θεοῦ
  choice: 神の国のために
  rationale: 目的・理由を示すἕνεκενを自然に訳し、βασιλεία τοῦ θεοῦの標準的で明瞭な訳語を用いた。
theological_decisions:
- issue: 神の国のために家族を『離れる／捨てる』ことの意味
  choice: 後にした
  alternative: 捨てた／離れた
  rationale: 弟子としての犠牲を弱めず、それが家族への無責任な遺棄を必ず意味するかのような解釈も訳文に持ち込まない。
- issue: 文の未完結性
  choice: 節末を読点で終える
  alternative: 句点で完結させる
  rationale: 原文は次節の報いについての節へ統語的に続くため、18:29単独でもその継続関係を保持した。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの発言には丁寧体を用いて自然な威厳を保ち、列挙の順序と原文の継続構文を維持した。
