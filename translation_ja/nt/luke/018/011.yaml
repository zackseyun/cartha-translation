  to: ファリサイ派の人は一人で立ち、こう祈っていた。[a]「神よ、私は、ほかの人々のように、人から奪い取る者、不正な者、姦通をする者ではなく、ましてこの徴税人のようでもないことを、あなたに感謝します。」
  rationale: πρὸς ἑαυτόνについては、本文では空間的な「一人で」を採用し、自己に向けた祈りという可能な含意は脚注に保持した。ἢ καίの強調を「まして」によって明示し、語順と列挙表現を現代日本語として整えた。
