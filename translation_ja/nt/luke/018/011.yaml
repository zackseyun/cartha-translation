  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ Φαρισαῖος σταθεὶς ⸂πρὸς ἑαυτὸν ταῦτα⸃ προσηύχετο· Ὁ θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ⸀ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/011.yaml
  text: 'The Pharisee[a], standing by himself, was praying these things: ‘God, I thank you that I am not like the rest of men—extortioners, unrighteous, adulterers—or even like this tax collector.’'
translation:
  language: ja
  text: ファリサイ派の人は一人で立ち、こう祈っていた。[a]「神よ、私は、ほかの人々のように、人から奪い取る者、不正な者、姦通をする者ではなく、ましてこの徴税人のようでもないことを、あなたに感謝します。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「立ち、自分に向かってこう祈っていた」。ギリシア語の句は、彼が一人で立っていたとも、その祈りが皮肉にも自分自身に向けられていたとも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: 立ち
  rationale: アオリスト分詞を場面を導く付帯状況として自然な日本語にした。姿勢を保ちつつ、過度に形式的な「立ってから」は避けた。
- source_word: πρὸς ἑαυτὸν
  choice: 一人離れて
  rationale: 空間的に「自分だけで、離れて」を表す読みを本文に採用した。ただし「自分に向かって」という再帰的な読みも可能なため、脚注に残した。
- source_word: ταῦτα
  choice: こう
  rationale: 直訳は「これらのこと」だが、後続する祈りの内容を導く現代日本語として「こう」が明瞭で自然である。指示語の働きは保たれている。
- source_word: προσηύχετο
  choice: 祈っていた
  rationale: 未完了過去の継続的な側面を「ていた」で表した。
- source_word: εὐχαριστῶ σοι
  choice: あなたに感謝します
  rationale: 与格代名詞を明示し、現代日本語として自然な感謝の表現にした。
- source_word: ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων
  choice: ほかの人々のように
  rationale: λοιποίの対比を自然に示し、ἄνθρωποιの一般的な意味を性別を限定せずに表した。
- source_word: ἅρπαγες
  choice: 奪い取る者
  rationale: 貪欲に他者のものを奪う者という広い意味を保つ。「強盗」では物理的犯罪に狭まり、「ゆすり取る者」では恐喝に限定されやすいため避けた。
- source_word: ἄδικοι
  choice: 不正な者
  rationale: 道徳的・宗教的な正しさに反する意味を、現代日本語で明瞭に表した。
- source_word: μοιχοί
  choice: 姦通する者
  rationale: 婚姻関係を破る性的な不貞という語義を直接かつ尊厳ある表現で示した。
- source_word: ἢ καὶ ὡς οὗτος ὁ τελώνης
  choice: この徴税人のようでもない
  rationale: ἢ καίの強調を「ようでもない」で表し、目の前の人物を見下す語調を保った。τελώνηςは当時の税徴収に携わる者として「徴税人」とした。
theological_decisions:
- issue: πρὸς ἑαυτόνが示す祈りのあり方
  choice: 本文では、ほかの人から離れて立ったという空間的意味に訳した。
  alternative: 「立って、自分に向かってこう祈っていた」または「立ち、心の中でこう祈っていた」。
  rationale: この句は空間的な孤立とも、自分に向けた祈りという皮肉とも解し得る。本文で一方を採りつつ、もう一方を脚注に明示して、原文の曖昧さと神学的緊張を保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祈りの引用には丁寧体を採用した。ファリサイ派の人の自己義認的な比較は弱めず、同時に訳語だけで解釈を過度に断定しないようにした。
