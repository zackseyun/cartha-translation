    issue: ἢ καίの強調が本文で明瞭でない
    rationale: ἢ καίは、一般の悪人との比較に加えて「ましてこの徴税人」のようではない、という軽蔑を強める。日本語では「まして」を入れると、この強調を自然に再現できる。
  - severity: low
    issue: 一部の表現がやや不自然
    rationale: 「一人離れて立ち」は不自然ではないが、「一人で立ち」の方が現代標準日本語として簡潔で自然である。「姦通をする者」も列挙の名詞句としてより滑らかである。
