  text: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην ἐκδικήσω αὐτήν ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/005.yaml
  text: yet because this widow keeps causing me trouble[a], I will give her justice[b], so that by continually coming she may not wear me out.”
translation:
  language: ja
  text: だが、このやもめが私に面倒をかけ続けるから、彼女に正当な裁きをしてやろう[a]。そうしなければ、彼女はいつまでもやって来て、私をへとへとにしてしまう[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼女の訴えを認めてやろう」とも訳せる。ギリシア語の動詞は文脈によって「復讐する」を意味することもあるが、ここでは法的な裁き・救済を与えることを指す。
    reason: alternative_reading
  - marker: b
    text: 直訳は「私の目の下を打つ」。ここでは慣用的に「私を疲れ果てさせる」「私を打ちのめす」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην
  choice: だが、このやもめが私に面倒をかけ続けるから
  rationale: διά＋冠詞付き不定詞の理由を表す構文と、γεの強調を「だが……から」で示した。現在不定詞の継続的な含みは「かけ続ける」で表し、παρέχειν ... κόπονの慣用的意味を自然な現代日本語にした。
- source_word: τὴν χήραν ταύτην
  choice: このやもめ
  rationale: 指示詞と名詞をそのまま明示し、物語で重要な彼女の社会的立場を保った。
- source_word: ἐκδικήσω αὐτήν
  choice: 彼女のために正しい裁きをしてやろう
  rationale: 法廷の文脈では、個人的な復讐よりも、訴えに法的な決着を与えることを指す。「正しい裁き」は後続節の主題ともつながり、日本語として明瞭である。
- source_word: ἵνα μὴ
  choice: そうしなければ……してしまう
  rationale: 裁判官が望ましくない結果を避けようとする目的を、自然な日本語の条件表現で示した。
- source_word: εἰς τέλος ἐρχομένη
  choice: いつまでもやって来て
  rationale: εἰς τέλοςがこの文脈で表す、終わりなく繰り返される来訪を「いつまでも」で表し、現在分詞の反復的な含みも保った。
- source_word: ὑπωπιάζῃ με
  choice: 私をへとへとにしてしまう
  rationale: 語の字義は「目の下を打つ」だが、ここでは執拗な働きかけによって疲弊させるという比喩的用法が自然である。強い口語的ニュアンスを保ちつつ、身体的暴行と断定しない訳とした。
theological_decisions:
- issue: 法廷のたとえにおけるἐκδικήσωの意味
  choice: 彼女のために正しい裁きをしてやろう
  alternative: 彼女のあだを討ってやろう／彼女を擁護してやろう
  rationale: この場面は不正な裁判官に法的救済を求める訴えであり、私的な報復を意味するとは限らない。「正しい裁き」は周辺文脈の正義という主題を保ちながら、報復の意味を不必要に持ち込まない。
- issue: ὑπωπιάζῃを身体的攻撃と比喩のどちらで訳すか
  choice: 私をへとへとにしてしまう
  alternative: 私の目の下を殴る／私に黒い目を負わせる
  rationale: 字義的な攻撃の像は語に残るが、この裁判官の独白では、絶え間ない来訪に消耗させられるという比喩的理解が文脈に最もよく合う。脚注で字義を示し、語の強さと曖昧さを保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、裁判官の苛立った独白として自然に響く程度の口語性を持たせた。「やもめ」は聖書語として定着している一方、現代の一般読者にも理解可能であり、簡潔さと物語上の反復を保つ。
