id: LUK.18.25
reference: Luke 18:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὐκοπώτερον γάρ ἐστιν κάμηλον διὰ ⸂τρήματος βελόνης⸃ εἰσελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/025.yaml
  text: For it is easier for a camel to enter through the eye of a needle than for a rich man to enter the kingdom of God[a][b].
translation:
  language: ja
  text: 実に、金持ちが神の国に入るよりも、らくだが針の穴を通るほうが易しい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「針の穴」という名の狭い門を指す、また「らくだ」ではなく「綱」の意味だとする解釈も提案されてきたが、ここのギリシア語本文は「らくだ」と読んでいる。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐκοπώτερον
  choice: ほうが易しい
  rationale: 比較表現を現代日本語として自然に示し、二つの不定詞句の対比を明確にする。
- source_word: γάρ
  choice: 実に
  rationale: 直前の発言を根拠づけ、強く説明する文脈上の働きを、日本語で不自然にならない接続表現として示す。
- source_word: κάμηλον
  choice: らくだ
  rationale: κάμηλοςの通常の語義をそのまま採用し、本文上の根拠がない「綱」などの解釈に置き換えない。
- source_word: διὰ τρήματος βελόνης
  choice: 針の穴を通る
  rationale: 「針の開口部を通って」という空間的意味を、定着した自然な日本語で表す。
- source_word: εἰσελθεῖν
  choice: 入る／通る
  rationale: 神の国については「入る」、針の穴については日本語の語法に合わせて「通る」とし、同じ動作の方向性を自然に表現する。
- source_word: πλούσιον
  choice: 金持ち
  rationale: 男性単数の形容詞の名詞的用法だが、ここでは一般的な富裕者を指すため、性別を不必要に限定しない自然な日本語とする。
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国に
  rationale: 聖書の主要概念である「神の国」を保持し、εἰςの方向性を助詞「に」で示す。
theological_decisions:
- issue: らくだと針の穴の比喩の解釈
  choice: 「らくだが針の穴を通る」という本文どおりの誇張的な像を保持する。
  alternative: 「針の穴」という名の狭い門を指すとする説明、または「らくだ」を「綱」と解する説。
  rationale: 提示されたギリシア語本文はκάμηλον（らくだ）と読む。本文にない後代の説明を訳文へ持ち込まず、意図的に不可能と思える対比が持つ神学的緊張を保つ。
translation_notes:
  register: 明快な現代標準日本語。「実に」で前節への説明的なつながりを示し、「金持ち」「らくだ」「針の穴」という平易で定着した語を用いた。誇張表現の衝撃を弱める補足は本文に加えていない。
