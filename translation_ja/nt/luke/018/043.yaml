id: LUK.18.43
reference: Luke 18:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ παραχρῆμα ἀνέβλεψεν, καὶ ἠκολούθει αὐτῷ δοξάζων τὸν θεόν. καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/043.yaml
  text: And immediately he received his sight[a], and he followed him, glorifying God. And all the people, when they saw it[b], gave praise to God.
translation:
  language: ja
  text: すると、彼はたちまち目が見えるようになり[a]、神をあがめながらイエスについて行った。民衆は皆、これを見て、神をほめた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「再び見えるようになり」「視力を取り戻し」。ギリシア語は、視力を得ること、または回復することを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: たちまち
  rationale: 遅れなく直ちに起こったことを表す副詞。物語文として自然であり、時間的な即時性を保つ。
- source_word: ἀνέβλεψεν
  choice: 目が見えるようになり
  rationale: 癒やしの文脈では、視力を得る、または回復することを表す。以前から見えなかった可能性を排除せず、日本語として自然に訳した。
- source_word: ἠκολούθει
  choice: ついて行った
  rationale: 未完了過去は継続的な追随を描くが、日本語では文脈上「ついて行った」でもその開始後の継続が自然に含意される。「ついて行っていた」では場面描写的になりすぎるため、自然な叙述を優先した。
- source_word: δοξάζων
  choice: あがめながら
  rationale: 神に栄光を帰し、その偉大さをたたえる随伴動作を表す。後半のαἶνονとの語彙上の区別も保つ。
- source_word: λαός
  choice: 民衆
  rationale: その場に集まった人々を集合的に指す。「群衆」も可能だが、λαόςの語感を保ちつつ現代日本語で明瞭な「民衆」とした。
- source_word: ἰδὼν
  choice: これを見て
  rationale: 単数形は集合名詞λαόςに一致する。目的語は明示されていないため、直前の癒やしとその後の行動を広く受けられる「これ」とした。
- source_word: ἔδωκεν αἶνον
  choice: ほめた
  rationale: 直訳は「賛美を与えた」だが、日本語では不自然であるため、神への称賛を自然に表す動詞で訳した。
- source_word: θεός / θεῷ
  choice: 神
  rationale: 標準的な訳語。原文どおり二度の言及を保ち、男と民衆の応答がともに神へ向けられていることを示した。
theological_decisions:
- issue: 視力が与えられたのか、回復したのか
  choice: 目が見えるようになり
  alternative: 再び見えるようになり／視力を取り戻し
  rationale: ἀναβλέπωは視力の回復を表し得るが、この人物が以前は見えていたと本文だけから断定しない表現を選んだ。
- issue: 癒やされた人の追随の継続性
  choice: イエスについて行った
  alternative: イエスについて行っていた
  rationale: ἠκολούθειの未完了過去には継続的な側面がある。しかし日本語の自然な物語叙述では「ついて行った」も継続する追随を表し得るため、過度に説明的な形を避けた。
- issue: αὐτῷの指示対象
  choice: イエス
  alternative: 彼
  rationale: 直前の文脈で指示対象はイエスであり、日本語では「彼」より固有の指示を明示するほうが自然で誤解がない。
- issue: 民衆が見たものの範囲
  choice: これを見て
  alternative: 彼がイエスについて行くのを見て／癒やしを見て
  rationale: ἰδώνには目的語がなく、癒やしだけか、その後の応答まで含むかを原文は限定しない。「これ」によってその曖昧さを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、簡潔ながら聖書本文としての品位を保った。「あがめる」と「ほめる」を使い分け、δοξάζωとαἶνοςの語彙上の違いを反映した。
