  text: And they told him[a], “Jesus the Nazarene is passing by.”
translation:
  language: ja
  text: 人々は彼に、「ナザレ人イエス[a]が通りかかっている」と知らせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ナザレのイエス」。ギリシア語は直訳すると「ナザレ人イエス」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: 知らせた
  rationale: 情報を伝えることを表す動詞。ここでは盲人の問いに周囲の人々が事情を伝える場面なので、現代日本語として自然な「知らせた」とした。
- source_word: δὲ
  choice: そこで
  rationale: 強い逆接ではなく、物語を先へ進める緩やかな接続を表すため、文脈に自然な「そこで」とした。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 与格の間接目的語を明示し、直前の盲人を指す「彼に」とした。
- source_word: ὅτι
  choice: 「……」
  rationale: 内容を導くὅτιを直接話法で表現した。伝えられた内容を変えず、日本語の物語として自然になる。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: ὁ Ναζωραῖος
  choice: ナザレ人イエス
  rationale: ギリシア語は地名を示す前置詞句ではなく呼称を用いている。「ナザレ人」はその形を保ちながら、現代日本語でも理解できる。語順は自然な日本語に合わせた。
- source_word: παρέρχεται
  choice: お通りになるところだ
  rationale: 現在進行中の動きを表す現在形を「ところだ」で示した。イエスを主語とする語りにふさわしい自然で穏当な敬語を用いた。
theological_decisions:
- issue: イエスを指すΝαζωραῖοςの訳し方
  choice: ナザレ人イエス
  alternative: ナザレのイエス
  rationale: この語は主として地理的由来に結びつく呼称であり、本文以上のキリスト論的意味を加えない。ギリシア語の名詞的な呼称を保つため「ナザレ人」とし、一般的な別訳を脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。会話の内容は自然な直接話法とし、原文の呼称「ナザレ人」を本文に残した。脚注記号[a]は本文末に配置した。
