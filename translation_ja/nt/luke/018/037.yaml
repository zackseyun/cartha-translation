  terminology: 「ナザレ人イエス」は、Ναζωραῖοςの名詞的な呼称を保つ、自然で理解可能な表現である。「ナザレのイエス」は有用な別訳として脚注に残す。イエスへの敬語は原文の語法自体には示されないため、本文では中立的な叙述にした。
