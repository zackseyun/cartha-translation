id: LUK.18.7
reference: Luke 18:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς οὐ μὴ ποιήσῃ τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων ⸀αὐτῷ ἡμέρας καὶ νυκτός, καὶ ⸀μακροθυμεῖ ἐπ’ αὐτοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/007.yaml
  text: And will not God bring justice for his chosen ones[a], who cry out to him day and night? Will he delay long over them?
translation:
  language: ja
  text: まして神は、昼も夜もご自分に叫び求めている選ばれた者たちのために、正しい裁きをしてくださらないでしょうか。彼らのために長く行動を遅らせるでしょうか[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らに対して忍耐しておられるとしても」または「彼らに対して忍耐しておられるでしょうか」。ギリシア語の句は、行動の遅れではなく、忍耐や寛容を表すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκδίκησιν
  choice: 正義を行う
  rationale: 不正な裁判官と訴え続ける者という文脈では、個人的な復讐ではなく、訴えに正当な裁きを与えて権利を回復することを指す。自然な現代日本語で司法的意味を保つ。
- source_word: ἐκλεκτῶν
  choice: 選ばれた者たち
  rationale: 名詞的に用いられた形容詞であり、神に選ばれた人々という意味を、特定の教派的理解に限定せず明瞭に表す。
- source_word: βοώντων
  choice: 叫び求めている
  rationale: 切迫した反復的な訴えを表す。「叫ぶ」だけでなく、祈りとして神に願い求める文脈も自然に伝える。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼も夜も
  rationale: 時間を問わず絶えず訴えるという強調を、日本語の自然な慣用表現で保持する。
- source_word: μακροθυμεῖ ἐπ’ αὐτοῖς
  choice: 彼らのことをいつまでも待たせる
  rationale: μακροθυμέωの基本的な「忍耐する」という意味を踏まえつつ、8節の速やかな裁きとの流れから、彼らのために行動するのを長く延ばすかという修辞疑問として訳した。意味上の曖昧さは脚注に残す。
- source_word: οὐ μὴ ποιήσῃ
  choice: 行ってくださらないでしょうか
  rationale: οὐ μήとアオリスト接続法による強い否定が、肯定の答えを期待する修辞疑問を形作る。日本語では丁寧な反語疑問によってその力を自然に示す。
- source_word: θεὸς
  choice: 神
  rationale: 定冠詞は主語を明示しており、ここでは標準的に「神」と訳す。
theological_decisions:
- issue: μακροθυμεῖ ἐπ’ αὐτοῖςが、神の行動の遅延を指すのか、神の忍耐を指すのか
  choice: 本文では「彼らのことをいつまでも待たせるでしょうか」とし、神が選ばれた者たちへの正義の実行を長く延ばすかという問いとして表した。
  alternative: 「彼らに対して忍耐しておられるとしても」または「彼らに対して忍耐しておられるでしょうか」。
  rationale: 直後の8節が速やかな正義の実行を述べるため、遅延についての修辞疑問が文脈に適合する。しかし、ギリシア語自体には忍耐・寛容という意味があり、その神学的緊張を脚注で保持した。
translation_notes:
  register: 明瞭で現代的ながら、修辞疑問の荘重さを保つ。「まして」で直前の不正な裁判官との対比を示し、「ご自分」「くださる」により神への自然な敬意を表した。
