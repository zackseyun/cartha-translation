source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/017.yaml
  text: Truly I tell you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: ja
  text: まことに、あなたがたに言います。神の国を子どものように[a]受け入れない者は、決してそこに入ることはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子どもとして」とも訳せます。この表現が、子どものように物事を受け入れる姿勢、信頼、謙遜、依存のどれを特に指すのかは、ギリシア語では明示されていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: まことに
  rationale: イエスが発言の冒頭で用いる厳粛な確言の力を保ちつつ、現代日本語として明瞭にした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 複数の聞き手への直接的な語りかけを、自然で品位ある現代日本語で表した。
- source_word: ὃς ἂν μὴ δέξηται
  choice: 受け入れない者は
  rationale: 不定の一般条件を表すὃς ἂνを「者は」で示し、δέχομαιの受容と承認の両面を「受け入れる」で表した。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 日本語聖書語彙として広く理解される表現であり、神の支配という含意を狭く限定しない。
- source_word: ὡς παιδίον
  choice: 子どものように
  rationale: 比較または様態をそのまま表し、受容、信頼、謙遜、依存のどれか一つに意味を限定しない。
- source_word: οὐ μὴ εἰσέλθῃ
  choice: 決して……入ることはありません
  rationale: οὐ μήとアオリスト接続法による強い否定を、明瞭で自然な日本語の強調否定で再現した。
- source_word: εἰς αὐτήν
  choice: そこに
  rationale: 女性単数代名詞が直前の「神の国」を指すことを自然な日本語で示し、「入る」との結びつきも保った。
theological_decisions:
- issue: 「子どものように」神の国を受け入れることの意味
  choice: 比喩を限定せず「子どものように」と訳す
  alternative: 子どものような謙遜をもって／子どものように信頼して／子どもとして
  rationale: ギリシア語本文は比較される性質を明示していないため、受容性、信頼、謙遜、依存などの一つに解釈を固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な宣言にふさわしい品位を保った。「決して……ありません」で強い否定を示し、比喩の解釈上の幅は脚注に残した。
