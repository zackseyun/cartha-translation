  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ· Ἀνάβλεψον· ἡ πίστις σου σέσωκέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/042.yaml
  text: And Jesus said to him[a], “Receive your sight[b]; your faith has saved you.”
translation:
  language: ja
  text: そして、イエスは彼に言われた。「見えるようになりなさい[a]。あなたの信仰があなたを救ったのです[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「もう一度見えるようになりなさい」「視力を取り戻しなさい」。ギリシア語の命令形は、癒やしの文脈では再び見えるようになることを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: または「あなたを治した」「あなたを癒やした」。ギリシア語の動詞は、救いだけでなく、治癒を指すこともある。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: すると
  rationale: 単純な物語の接続を、文脈の流れに即した自然な現代日本語で表した。強い因果関係は加えていない。
- source_word: εἶπεν αὐτῷ
  choice: 彼に言われた
  rationale: 与格の間接目的語を明示しつつ、イエスの発言を自然で品位ある敬語表現にした。
- source_word: Ἀνάβλεψον
  choice: 目が見えるようになりなさい
  rationale: この癒やしの文脈では、単に『上を見なさい』ではなく、視力を得る、または回復することを指す。以前は見えていた可能性を本文で断定しない表現を選んだ。
- source_word: πίστις
  choice: 信仰
  rationale: ここではイエスに信頼して頼ることを指すが、神学的な広がりを保つ一般的な訳語『信仰』を用いた。
- source_word: σέσωκέν
  choice: 救った
  rationale: 完了形の結果の持続を簡潔に表し、身体的な癒やしとより広い救いの双方を含み得る語義上・神学上の重なりを保った。
theological_decisions:
- issue: 癒やしの物語における σῴζω の範囲
  choice: 救った
  alternative: 治した／癒やした
  rationale: 文脈上は視力の回復を含むが、この動詞は身体的な癒やしにも、より広い意味での救いにも用いられる。『救った』とすることで、その真正な含意の重なりを狭めずに残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら聖書本文にふさわしい品位を保った。イエスへの敬意は日本語の語りの慣例に従って『言われた』で示し、発言内容には過度な古語や宗派的表現を用いていない。
