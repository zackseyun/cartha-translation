  text: Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ⸀ἐπετίμων αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/015.yaml
  text: They were even bringing infants to him so that he might touch them[a], but when the disciples saw it[c][b], they rebuked them.
translation:
  language: ja
  text: '人々は、乳飲み子までイエスのもとに連れて来て、イエスにその子たちに触れていただこうとしていた[a][b]。ところが、弟子たちはそれを見て、彼らを叱った[c]。


    [a] 「乳飲み子」と訳したギリシア語は、ごく幼い子、すなわち乳児を指す。「赤ん坊」とも訳せる。


    [b] マタイ19章13節とマルコ10章13、16節では、イエスが子どもたちに触れることは、手を置いて祝福することと結び付けられている。


    [c] 原文は「彼らに」とだけいう。ここでは、乳飲み子を連れて来た人々を指すと考えられる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「乳飲み子」と訳したギリシア語は、ごく幼い子、すなわち乳児を指す。「赤ん坊」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: マタイ19章13節とマルコ10章13、16節では、イエスが子どもたちに触れることは、手を置いて祝福することと結び付けられている。
    reason: cross_reference
  - marker: c
    text: 原文は「彼らに」とだけいう。ここでは、乳飲み子を連れて来た人々を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέφερον
  choice: 連れて来て…していた
  rationale: 未完了過去の継続的・反復的な動作を「していた」で表した。「連れて来る」は、人々が幼子をイエスのもとへ運ぶ場面に自然である。
- source_word: δὲ
  choice: ところが
  rationale: 前半の人々の行動と、それを制止する弟子たちの行動との対照を、自然な物語の接続として示した。
- source_word: αὐτῷ
  choice: イエスのもとに
  rationale: 原文は「彼に」だが、日本語では指示対象を明示した方が自然であり、文脈上イエスを指す。
- source_word: καὶ
  choice: まで
  rationale: 乳飲み子さえ連れて来たという強調を、「乳飲み子まで」で簡潔に表した。
- source_word: τὰ βρέφη
  choice: 乳飲み子
  rationale: βρέφοςはごく幼い子、特に乳児を表す。「幼子」より年齢範囲が明確で、「赤ん坊」よりも本文の文体にふさわしい。
- source_word: ἵνα αὐτῶν ἅπτηται
  choice: その子たちに触れていただこうとして
  rationale: ἵναの目的を「ようとして」で示し、ἅπτομαιの基本義「触れる」を保持した。祝福や按手は本文へ補わず、並行箇所との関係を注に示した。
- source_word: ἰδόντες
  choice: それを見て
  rationale: アオリスト分詞を、主節に先立つ状況を示す自然な日本語として訳した。「それ」は乳飲み子を連れて来る出来事全体を受ける。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: 定冠詞付き名詞を文脈に即して素直に訳した。原文にない所有表現「イエスの」は加えていない。
- source_word: ἐπετίμων
  choice: 叱った
  rationale: ἐπιτιμάωの強い非難・制止の語感を、現代日本語で自然な「叱った」にした。「戒めた」より場面が理解しやすい。
- source_word: αὐτοῖς
  choice: 連れて来た人々を
  rationale: 代名詞の最も自然な指示対象を本文で明示し、子どもたちを叱ったとの誤読を避けた。原文が代名詞であることは注に残した。
theological_decisions:
- issue: イエスが乳飲み子に行おうとしたことの性質
  choice: 触れる
  alternative: 祝福する／手を置く
  rationale: ルカ本文のἅπτηταιは「触れる」であり、並行福音書が示す祝福や按手を本文に取り込まなかった。関連は脚注で示し、ルカ固有の簡潔な表現を保った。
- issue: 弟子たちが叱った相手
  choice: 乳飲み子を連れて来た人々
  alternative: 乳飲み子たち
  rationale: αὐτοῖςは文法上近くの複数対象を受け得るが、行為を制止される対象としては連れて来た人々が最も自然である。原文の代名詞表現は脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語本文としての品位を保った。「触れていただこうとして」は、連れて来た人々の願いを自然に表す敬意表現であり、イエスの行為を「祝福」に解釈して本文へ加えるものではない。
