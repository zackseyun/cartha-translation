  source_fidelity: 「週に二度断食し」は、νηστεύω の習慣的現在と δὶς τοῦ σαββάτου の「週に二度」という慣用的時間表現を正確に伝えている。κτῶμαι も「手に入れる」として取得の意味を保っている。ただし、「手に入れるものすべての十分の一」は日本語では「取得物全体の十分の一」とも読め、πάντα ὅσα κτῶμαι の包括的な対象範囲をやや曖昧にするため、「手に入れるものすべてについて十分の一を」とするのがより明確である。
