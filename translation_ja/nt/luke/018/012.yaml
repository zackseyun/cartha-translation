  text: νηστεύω δὶς τοῦ σαββάτου, ⸀ἀποδεκατῶ πάντα ὅσα κτῶμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/012.yaml
  text: I fast twice a week[a]; I tithe everything I acquire.
translation:
  language: ja
  text: 私は週に二度断食し[a]、手に入れるものすべてについて十分の一を納めています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「安息日の二度」。これは「週に二度」を意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: νηστεύω
  choice: 断食し
  rationale: 現在形は、この人物が習慣として行っていると主張する行為を表す。後半と自然につなぐため連用形とした。
- source_word: δὶς τοῦ σαββάτου
  choice: 週に二度
  rationale: 字義的には「安息日の二度」だが、コイネー・ギリシア語では一週間を単位とする頻度を表す慣用句である。
- source_word: ἀποδεκατῶ
  choice: 十分の一を納めています
  rationale: 収入・取得物の十分の一を宗教的義務として差し出す意味を、一般読者にも明瞭な表現で示した。
- source_word: πάντα ὅσα
  choice: ものすべて
  rationale: 取得するものを包括的に指す関係表現として、自然な現代日本語にした。
- source_word: κτῶμαι
  choice: 手に入れる
  rationale: 中動態の動詞はここでは、単に所有していることよりも、自分のものとして取得することを意味する。
theological_decisions:
- issue: τοῦ σαββάτου の意味
  choice: 一週間を表す慣用的な時間表現
  alternative: 字義的に「安息日の」
  rationale: ここは安息日遵守について述べる箇所ではなく、断食の頻度を述べている。字義訳によって安息日に二度断食するという誤解を招かないよう、慣用的意味を本文に反映した。
- issue: ἀποδεκατῶ の訳し方
  choice: 十分の一を納めています
  alternative: 十分の一を献げています／十分の一税を納めています
  rationale: 行為の宗教的背景を保ちつつ、「税」と限定せず、何を誰に差し出すかという本文に明記されない点も過度に補わない表現とした。
translation_notes:
  register: 自負を列挙する祈りの口調として、丁寧体を用いた。現代の一般読者に明瞭でありながら、聖書本文にふさわしい簡潔で端正な調子を保った。
