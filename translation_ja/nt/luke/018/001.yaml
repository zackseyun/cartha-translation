  text: Ἔλεγεν ⸀δὲ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι ⸀αὐτοὺς καὶ μὴ ἐγκακεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/001.yaml
  text: He was telling them a parable about their need to pray always and not lose heart,[a]
translation:
  language: ja
  text: イエスは、いつも祈り、くじけてはならないことを示すため、彼らに一つのたとえを語っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスは、彼らがいつも祈り、くじけずにいる必要について、彼らに一つのたとえを語っていた。」
    reason: πρὸς τὸ＋不定詞は目的だけでなく、主題・関連を示す表現とも理解できるため。
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 語っていた
  rationale: 未完了過去の継続的・場面設定的な側面を自然な日本語で表す。文脈上の主語であるイエスを明示した。
- source_word: δὲ
  choice: （訳出せず）
  rationale: ここでは弱い談話上の接続を示す。日本語では無理に「さて」「また」を加えないほうが自然であり、意味上の対立や時間的順序を過度に強めない。
- source_word: παραβολὴν
  choice: 一つのたとえ
  rationale: 共観福音書における標準的なジャンル表示を保ち、現代日本語として明瞭にした。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: Ἔλεγενの与格目的語をそのまま表し、対象を本文以上に「弟子たち」などと限定しない。
- source_word: πρὸς τὸ δεῖν
  choice: …なければならないことを示すため
  rationale: 目的を表し得るπρὸς τὸ＋不定詞と、必要性を示すδεῖνの双方を、自然な日本語の目的節として表した。
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的な祈りを簡潔に表す。「絶え間なく」として一瞬も中断しない祈りを機械的に含意することは避けた。
- source_word: προσεύχεσθαι
  choice: 祈り
  rationale: 文脈に即した標準的で明瞭な訳語。
- source_word: μὴ ἐγκακεῖν
  choice: くじけてはならない
  rationale: 勇気を失う、落胆する、あきらめるという語義範囲を、持続的な祈りの文脈に合う自然な日本語で表した。
theological_decisions:
- issue: 祈り続けることへの必要性・義務性
  choice: 「いつも祈り、くじけてはならない」と訳し、δεῖνの必要性を明示する。
  alternative: 「いつも祈り、落胆しない必要がある」または、より弱く「祈り続けるように」
  rationale: 本文の勧告的な強さを保つ一方、祈りの効力について特定の教派的体系を付加しない。
- issue: πρὸς τὸ δεῖνの構文的含み
  choice: たとえの目的を示す表現として本文に反映する。
  alternative: たとえの主題・関連事項として「…必要について」と訳す。
  rationale: 目的の解釈が自然だが、構文は主題・関連を表すとも取り得るため、その余地を脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての落ち着いた調子を保った。「彼ら」を「弟子たち」と特定せず、原文の指示対象の幅を維持した。
