id: LUK.18.14
reference: Luke 18:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ⸂παρ’ ἐκεῖνον⸃· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/014.yaml
  text: I tell you[a], this man went down to his house justified rather than the other; because everyone who exalts himself will be humbled, but the one who humbles himself will be exalted.
translation:
  language: ja
  text: あなたがたに言います。この人は、あの人よりも[a]義と認められて、自分の家へ下って行きました。自分を高くする者はみな低くされ、自分を低くする者は高くされるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あの人と比べて」。この句は二人の礼拝者を対照しています。
    reason: παρ’ ἐκεῖνονは比較・対照を表し、「あの人よりも」とも「あの人と比べて」とも訳し得るため、その語義上の幅を示す。
lexical_decisions:
- source_word: δεδικαιωμένος
  choice: 義と認められて
  rationale: 完了受動分詞が表す、すでに下された神の好意的な判定とその継続する結果を、現代日本語で簡潔に示す。「正しい者とされて」も可能だが、「義と認められて」は法廷的な含みを保ちつつ自然である。
- source_word: παρ’ ἐκεῖνον
  choice: あの人よりも
  rationale: 比較・対照を示すπαρά＋対格を自然な日本語にした。取税人とパリサイ人との対照を明示するが、比較表現が持つ解釈上の幅は脚注に残す。
- source_word: κατέβη
  choice: 下って行きました
  rationale: 神殿からの具体的な下降を表す動きを保持する。「帰りました」だけではκαταβαίνωの空間的イメージが失われる。
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: 自分の家へ
  rationale: 主語自身の家へ向かうことを自然な日本語で示す。文脈上「家に帰る」の意味合いはあるが、原文の名詞と方向表現を保った。
- source_word: πᾶς ὁ ὑψῶν ἑαυτόν
  choice: 自分を高くする者はみな
  rationale: 一般原則を示す冠詞付き分詞と再帰表現を保つ。「高ぶる者」よりも、後半との語の対照が明瞭である。
- source_word: ταπεινωθήσεται
  choice: 低くされ
  rationale: 未来受動を受動表現のまま訳し、行為者を原文と同様に明示しない。
- source_word: ὁ δὲ ταπεινῶν ἑαυτόν
  choice: 自分を低くする者は
  rationale: 前半との平行と対照を保ち、再帰的な意味を明示する。「へりくだる者」も自然だが、ὑψόω／ταπεινόωの上下の対比を優先した。
- source_word: ὑψωθήσεται
  choice: 高くされる
  rationale: 未来受動を保ち、「自分を高くする」との反転を明瞭に示す。
- source_word: ὅτι
  choice: からです
  rationale: 先行する判定の理由・根拠を示す因果関係を、現代日本語の文末表現で自然に表した。
- source_word: οὗτος
  choice: この人
  rationale: 直前の取税人を指し、もう一人の礼拝者との人的対照を自然に示す。
theological_decisions:
- issue: δικαιόωが示す判定の性質
  choice: 神から「義と認められた」という好意的・法廷的な判定
  alternative: 社会的・一般的な意味で正しさが証明された
  rationale: 神の前でのパリサイ人と悔い改める取税人の対照が直接の文脈である。「義と認められて」は神の判定という重みを保つ一方、この一節を越えた体系的教義を訳文に持ち込まない。
- issue: 二つの未来受動形の行為者
  choice: 「低くされ」「高くされる」とし、行為者を明示しない
  alternative: 神が低くし、神が高くする
  rationale: 神が暗黙の行為者である可能性は高いが、原文は行為者を明記していないため、その含意を説明的に確定しない。
- issue: 一般命題の人称表現
  choice: 「者」を用いて包括的な単数の一般命題として表す
  alternative: 男性を明示する表現
  rationale: ギリシア語の男性単数はここでは代表的・一般的用法であり、日本語の「者」は性別を不必要に限定せず、その一般性を自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの宣言と格言にふさわしい簡潔で厳かな調子を保った。「下って行きました」で神殿からの具体的な移動を残し、「高くする／低くする」「低くされる／高くされる」の反転構造を見える形にした。
