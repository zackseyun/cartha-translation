  text: εἶπεν δὲ ὁ κύριος· Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/006.yaml
  text: And the Lord said[a], “Hear what the unrighteous judge says.”
translation:
  language: ja
  text: そして、主は言われた。「不正な裁判官[a]が言っていることを聞きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「不正（または不義）の裁判官」。また「不公正な裁判官」とも訳せる。
    reason: τῆς ἀδικίας は字義的には属格表現であり、道徳的な不義と司法上の不公正の両方を含み得るため。
lexical_decisions:
- source_word: εἶπεν
  choice: 言われた
  rationale: 物語中の単純過去として訳し、主イエスへの自然で敬意ある日本語表現とした。
- source_word: δὲ
  choice: そこで
  rationale: 物語と発言の流れを受ける接続を自然な現代日本語で示す。時間的意味を必要以上に強めない。
- source_word: ὁ κύριος
  choice: 主
  rationale: ルカの語りにおいてイエスを指す称号としての重みを保つ。「主人」では文脈上のキリスト論的含意が弱まる。
- source_word: Ἀκούσατε
  choice: 聞きなさい
  rationale: 注意して聞くよう求めるアオリスト命令形の力を、明瞭で自然な命令表現で伝える。
- source_word: τί
  choice: こと
  rationale: 裁判官の発言の内容を指すため、「言っていること」とした。
- source_word: ὁ κριτὴς
  choice: 裁判官
  rationale: たとえにすでに登場した司法上の人物を指す語として明確に訳した。日本語では文脈上の既知性を「この」で表した。
- source_word: τῆς ἀδικίας
  choice: 不正な
  rationale: 属格による性質描写「不正／不義の」を自然な日本語の形容表現にした。法的な不公平さと道徳的な悪さの双方を含み得る語として「不正」を選んだ。
- source_word: λέγει
  choice: 言っている
  rationale: ギリシア語の現在形が持つ生き生きとした即時性を、日本語の進行的な表現で自然に示した。
theological_decisions:
- issue: イエスを指す κύριος の訳語
  choice: 主
  alternative: 主人
  rationale: ルカの叙述における称号としての意味合いを保ち、本文を超える教理的説明は加えない。
- issue: τῆς ἀδικίας の道徳的・法的含意
  choice: 不正な裁判官
  alternative: 不義な裁判官／不公正な裁判官
  rationale: 「不正」は法的な不公平だけに限定せず、人物の道徳的性質も表し得る。「不義」はより形式的だが、一般読者にはやや硬い。
translation_notes:
  register: 明瞭な現代標準語を用いながら、主イエスの発言にふさわしい簡潔で品位ある調子とした。「お聞きなさい」より直接的で本文の命令形に近い「聞きなさい」を採用した。
