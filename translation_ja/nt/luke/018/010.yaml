id: LUK.18.10
reference: Luke 18:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι, ⸀ὁ εἷς Φαρισαῖος καὶ ὁ ἕτερος τελώνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/018/010.yaml
  text: Two men went up into the temple to pray[a], one a Pharisee and the other a tax collector.
translation:
  language: ja
  text: 二人の男が祈るために神殿[a]へ上って行った。一人はファリサイ人で、もう一人は徴税人だった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語は、内陣だけでなく、神殿の建物や庭を含む境内全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωποι δύο
  choice: 二人の男
  rationale: ἄνθρωποι自体は広く「人々」を意味し得るが、続く男性単数形の人物描写と具体的な登場人物から、ここでは男性二人を指す。
- source_word: ἀνέβησαν
  choice: 上って行った
  rationale: 神殿があるエルサレムへ向かう地理的・慣用的な上りを保ちつつ、現代日本語として自然に表した。
- source_word: εἰς τὸ ἱερὸν
  choice: 神殿へ
  rationale: εἰςの方向性を「へ」で自然に示した。ἱερόνは内陣だけでなく神殿境内全体を指すため、その点は脚注で明示した。
- source_word: προσεύξασθαι
  choice: 祈るために
  rationale: アオリスト中動態不定詞が示す目的を明確で自然な日本語にした。
- source_word: ὁ εἷς ... ὁ ἕτερος
  choice: 一人は……もう一人は
  rationale: 二人を対比する分配的表現を、明瞭で自然な日本語の対句にした。
- source_word: Φαρισαῖος
  choice: ファリサイ人
  rationale: ユダヤ教の一派を指す、現代日本語の聖書用語として定着した表記を用いた。
- source_word: τελώνης
  choice: 徴税人
  rationale: 税や通行税などの徴収請負人を指す語であり、「取税人」より現代的で簡潔な表現を選んだ。
theological_decisions:
- issue: ἱερόνとναόςの区別
  choice: 本文では「神殿」、脚注で神殿境内全体を指し得ることを説明
  alternative: 神殿の境内
  rationale: ἱερόνの範囲を正確に伝えながら、本文では一般読者に自然で定着した表現を保った。
- issue: ἄνθρωποιの性別表現
  choice: 二人の男
  alternative: 二人の人
  rationale: 語そのものは一般的に「人」を意味し得るが、この場面では男性二人が明示されるため、文脈上の性別を保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「上って行った」で原文の移動表現を残し、「徴税人」で古風な「取税人」を避けた。
