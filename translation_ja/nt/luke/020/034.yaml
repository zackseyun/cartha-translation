  text: ⸀Καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Οἱ υἱοὶ τοῦ αἰῶνος τούτου γαμοῦσιν καὶ ⸀γαμίσκονται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/034.yaml
  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: ja
  text: イエスは彼らに言われた。「この時代の子ら[a]は、妻をめとったり、嫁に出されたりする。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この時代の人々」。原文は「この時代の息子たち」（男性複数形）で、現在の時代に属する人々を指す代表的な表現。
    reason: 語彙上の別訳と、原文の男性複数形による代表表現の説明。
lexical_decisions:
- source_word: Καὶ
  choice: （訳出せず）
  rationale: 日本語では直前の場面からのつながりが明らかであり、文頭の接続詞を省くほうが自然である。「すると」とすると時間的・展開的な意味を加えすぎる。
- source_word: εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: イエスは彼らに言われた
  rationale: 語順を自然な日本語に整えつつ、λέγωの基本義「言う」と与格「彼らに」を保った。イエスの発言には敬意を示す慣用的な尊敬表現を用いた。
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: この時代の子ら
  rationale: υἱοίの比喩的な帰属表現と、αἰώνが示す終末論的な「時代」を保つ。「世の人々」では来るべき時代との対比が弱まりうるため避けた。
- source_word: γαμοῦσιν καὶ γαμίσκονται
  choice: めとったり、嫁いだりする
  rationale: 能動形と受動形の対を、伝統的な婚姻の立場を表す自然な日本語の対句で示した。単に「結婚する」とまとめず、原文の二つの動詞を保った。
theological_decisions:
- issue: 男性複数形を用いた代表的表現
  choice: この時代の子ら
  alternative: この時代の人々／この時代に属する者たち
  rationale: 原文の「子ら」という帰属・特徴づけの比喩を本文に残しつつ、男性だけを指すのではないことを脚注で明示した。
- issue: αἰώνの終末論的意味
  choice: この時代
  alternative: この世
  rationale: 後続箇所の「かの時代」との対比を明確にし、物理的世界ではなく現在の秩序・時代を指す含みを保った。
- issue: 婚姻を表す能動形と受動形
  choice: めとったり、嫁いだりする
  alternative: 結婚する／妻をめとり、嫁に出される
  rationale: 原文の形式上の対照を保ちながら、日本語として過度に説明的にならない表現を選んだ。これは当時の婚姻表現を反映するもので、婚姻に関する追加の教理的含意は加えていない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「子ら」は聖書的な帰属表現として残し、誤解を避けるため脚注を付した。「めとる／嫁ぐ」は現代でも理解可能で、原文の能動・受動の対を簡潔に再現する。
