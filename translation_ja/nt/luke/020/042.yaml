id: LUK.20.42
reference: Luke 20:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: ja
  text: 実に、ダビデ自身が詩篇の書にこう言っています。「主[a]は私の主に言われた。『わたしの右に座っていなさい』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引用元である詩篇110篇1節のヘブライ語本文では、最初の「主」は神名ヤハウェである。その本文に従えば、「主（ヤハウェ）は私の主に言われた」とも訳せる。
    reason: 引用元のヘブライ語の神名と、ルカによる福音書のギリシア語κύριοςとの関係を示すため。
lexical_decisions:
- source_word: αὐτὸς γὰρ Δαυὶδ
  choice: ダビデ自身が
  rationale: αὐτόςの強調を「自身」で表した。γάρは直前の問いに対する根拠を導くが、日本語では文脈上明らかなため、独立した接続詞を置かず自然に示した。
- source_word: λέγει
  choice: こう言っています
  rationale: 引用導入の現在形を保ちつつ、現代日本語として自然な継続的・文学的現在で表した。
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: 詩篇の書の中で
  rationale: βίβλοςと属格複数ψαλμῶνを明示的に反映した。「詩篇」は日本語聖書で広く認識される書名。
- source_word: Εἶπεν κύριος τῷ κυρίῳ μου
  choice: 主は私の主に言われた
  rationale: 二つのκύριοςをともに「主」とし、原文の反復と区別を保った。最初の動詞は神を主語とするため、自然で敬意ある「言われた」とした。
- source_word: Κάθου
  choice: 座っていなさい
  rationale: κάθημαιの現在命令が示す着座・その位置にとどまる含みを、自然な日本語で表した。単なる動作開始に限定する「座りなさい」より文脈に適する。
- source_word: ἐκ δεξιῶν μου
  choice: わたしの右に
  rationale: この慣用句が示す、話者の右側という栄誉ある位置を簡潔に表現した。「右の手に」は日本語では身体部位の上に座るようにも響くため避けた。
theological_decisions:
- issue: 詩篇110:1のヘブライ語本文では神名に当たる最初のκύριοςの訳
  choice: 主
  alternative: 主（ヤハウェ）
  rationale: ルカのギリシア語本文κύριοςを優先し、本文では「主」とした。一方、引用元のヘブライ語では神名יהוהであることを脚注に示し、原典間の差異を隠さない。
- issue: キリスト論的意義を持つ二番目のκύριος
  choice: 私の主
  alternative: 私の主人
  rationale: 「私の主」は語の反復と引用の神学的緊張を保つ。「主人」も語義上可能だが、この箇所でκύριοςの反復を弱めるため採らなかった。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「私」と引用中の「わたし」を使い分け、詩篇引用内の神の発話を視覚的にも区別した。脚注記号[a]は本文に付した。
