  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: ja
  text: 民全体が聞いているところで[a]、イエスは弟子たちに言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民全体が聞いている間に、イエスは弟子たちに言われた」。ギリシア語は属格独立構文を用いて、イエスが語った際の状況を示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκούοντος
  choice: 聞いている中で
  rationale: 現在分詞を用いた属格独立構文であり、イエスが語った時と同時進行の状況を示す。現代日本語として自然に、その継続性を表した。
- source_word: δὲ
  choice: （独立した接続語としては訳出しない）
  rationale: ここでは物語を穏やかに進める接続辞。日本語では前後関係と「中で」によって連続性が十分に示されるため、機械的に「そして」を置かなかった。
- source_word: παντὸς τοῦ λαοῦ
  choice: 民が皆
  rationale: 単数形のλαόςにπᾶςが付き、民全体を指す。「群衆」ではなく、ルカにおける共同体的な響きも保てる「民」を選んだ。
- source_word: εἶπεν
  choice: 言われた
  rationale: λέγωのアオリストを通常の発話動詞で表した。主語は文脈上イエスであり、日本語で明確にするため名を補い、敬意を表す自然な聖書文体とした。
- source_word: τοῖς μαθηταῖς
  choice: 弟子たちに
  rationale: 直接の聞き手を示す与格。「その弟子たち」とせず、原文に明示されない所有表現を加えなかった。
theological_decisions:
- issue: 場面における聞き手の区別
  choice: 民が皆聞いている公の場で、イエスが弟子たちを直接の相手として語る。
  alternative: 民全体に直接語る、または民から離れて弟子たちだけに私的に語る。
  rationale: 属格独立構文は民全体が聞いている状況を示し、τοῖς μαθηταῖςは直接の発話対象を示す。両者を区別したまま訳文に保った。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語。「人々」より原語λαόςの共同体的な語感を保つ「民」を採用した。主語「イエス」は原文では代名詞もなく文脈から補われるが、日本語での明瞭さのため明示した。
