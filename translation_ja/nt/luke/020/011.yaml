source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: ja
  text: そこで彼は、さらにもう一人の奴隷を遣わした。ところが農夫たちは、その奴隷も打ちたたいて辱め、手ぶらで追い返した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέθετο … πέμψαι
  choice: さらに…遣わした
  rationale: 「加えて送った」という継続・追加の意味を、自然な現代日本語で表した。
- source_word: ἕτερον
  choice: 別の
  rationale: 先に遣わされた者とは異なる、もう一人の人物であることを簡潔に示す。
- source_word: δοῦλον
  choice: 奴隷
  rationale: ぶどう園の主人に属し、その代理として遣わされる人物という隷属的な身分を保持するため。
- source_word: δείραντες
  choice: 打ちたたいて
  rationale: 暴力を加えたことを明確にしつつ、殴打の具体的方法を原文以上に限定しない。
- source_word: ἀτιμάσαντες
  choice: 辱め
  rationale: 単なる侮辱だけでなく、不名誉な扱いを受けさせる社会的な含意を保つ。
- source_word: ἐξαπέστειλαν
  choice: 追い返した
  rationale: 相手を外へ送り去ったという文脈上の強いニュアンスを自然に表す。
- source_word: κενόν
  choice: 何も持たせずに
  rationale: 期待された収穫を受け取れないまま帰されたという、文脈上の「手ぶらで」の意味を明瞭にする。
theological_decisions:
- issue: たとえにおける δοῦλος の訳語
  choice: 奴隷
  alternative: しもべ／僕
  rationale: ここでは主人との所有・隷属関係が物語上重要であり、「奴隷」が当時の社会的身分をより直接に伝える。特定の教派的解釈は付加しない。
translation_notes:
  register: 明瞭な現代標準日本語。物語の荘重さを保ちながら、過度に文語的な表現を避けた。「農夫たち」は直前の文脈で明らかな指示対象を自然に補ったもの。
