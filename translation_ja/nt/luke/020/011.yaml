  source_fidelity: 原文の出来事の順序と内容はおおむね忠実です。ただし κενόν は追い返された者の状態（「手ぶらで」）を表し、「何も持たせずに」は使役的な言い回しとなって原文の表現からわずかに離れます。
  naturalness: 全体として自然な現代標準日本語です。「さらに別の」も理解可能ですが、「さらにもう一人の」のほうが、追加して別の奴隷を送るという προσέθετο と ἕτερον の流れをより滑らかに伝えます。
  terminology: δοῦλος を「奴隷」とする選択は、このたとえにおける身分関係を明示し、原語に忠実です。「辱め」は ἀτιμάσαντες の不名誉な扱いという含意を適切に保っています。
  issues:
