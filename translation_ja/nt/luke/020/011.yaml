- from: そこで彼は、さらに別の奴隷を遣わした。ところが農夫たちは、その者も打ちたたいて辱め、何も持たせずに追い返した。
  to: そこで彼は、さらにもう一人の奴隷を遣わした。ところが農夫たちは、その奴隷も打ちたたいて辱め、手ぶらで追い返した。
