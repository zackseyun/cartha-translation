  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ συνελογίσαντο πρὸς ἑαυτοὺς λέγοντες ὅτι Ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/005.yaml
  text: But they reasoned among themselves[a], saying, “If we say, ‘From heaven,’ he will say[b], ‘Why did you not believe him?’”
translation:
  language: ja
  text: しかし、彼らは互いにこう論じ合った。「もし『天からだ』と言えば、彼は『なぜ彼を信じなかったのか』と言うだろう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: 互いに論じ合った
  rationale: 動詞の熟慮・推論の含みと、集団内で相談したことの両方を、自然な現代日本語で表す。
- source_word: λέγοντες
  choice: （直接話法で表現）
  rationale: 主動詞と同時の発言を示す分詞であり、日本語では独立した引用として続けるのが自然である。
- source_word: Ἐὰν εἴπωμεν
  choice: もし…と言えば
  rationale: 条件の未確定性を、自然な日本語の条件表現で示す。
- source_word: Ἐξ οὐρανοῦ
  choice: 天からだ
  rationale: 神的な起源・権威を指す表現だが、原文の婉曲表現「天」をそのまま保つ。
- source_word: ἐρεῖ
  choice: 言うだろう
  rationale: 後続内容は質問だが、原文の一般的な発話動詞を保持する。
- source_word: Διὰ τί οὐκ ἐπιστεύσατε αὐτῷ
  choice: では、なぜ彼を信じなかったのか
  rationale: πιστεύω＋与格はここではヨハネの証言を真実として受け入れる意味であり、「彼を信じる」が適切。「では」は議論上の帰結を自然に示す。
theological_decisions:
- issue: 「天から」が示すヨハネの洗礼の由来
  choice: 「天からだ」と原文の婉曲表現を保持する
  alternative: 「神からだ」と明示する
  rationale: 神に由来する権威が含意されるが、原文は「天」と述べているため、その含意を訳文で明示しすぎない。
- issue: ἐπιστεύσατε αὐτῷ の信仰的な強さ
  choice: 「彼を信じなかった」
  alternative: 「彼を信頼しなかった」「彼を信じる信仰を持たなかった」
  rationale: 文脈はヨハネの言葉を信じたかどうかであり、人格への宗教的帰依まで意味を強めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の熟慮・相談のニュアンスを「互いに論じ合った」で表し、過度に古風な「彼ら自身の間で思案した」などは避けた。
