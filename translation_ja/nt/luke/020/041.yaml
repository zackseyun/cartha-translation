  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς αὐτούς· Πῶς λέγουσιν τὸν χριστὸν ⸂εἶναι Δαυὶδ υἱόν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「どうして人々は、メシア[a]がダビデの子[b]だと言うのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語「クリストス」は「油注がれた者」を意味する称号。ここでは、ダビデにつながる待望の救済者が問題となっているため「メシア」と訳した。
    reason: alternative_reading
  - marker: b
    text: 直訳「ダビデの子」。文脈によっては、称号としての「ダビデの子」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 穏やかな接続・話題転換を示す語であり、ここではイエスが問いを投げかける展開への転換を自然に表す。
- source_word: πρὸς αὐτούς
  choice: 彼らに
  rationale: 発話の相手を示す標準的な表現として、簡潔で自然な日本語にした。
- source_word: Πῶς
  choice: どうして
  rationale: 単なる方法よりも、続く主張がどのように成り立つのかを問う文脈なので、日本語では「どうして」が自然である。
- source_word: λέγουσιν
  choice: 人々は…と言う
  rationale: 三人称複数の主語は本文中で明示されていないため、不特定の主体を表す「人々」を補い、曖昧さを過度に限定しないようにした。
- source_word: τὸν χριστόν
  choice: メシア
  rationale: 冠詞を伴う称号であり、ダビデとの関係が問われるユダヤ的な待望の文脈を明瞭に伝える。
- source_word: εἶναι
  choice: …だ
  rationale: λέγουσινに従属する不定詞を、自然な日本語の引用節「…だと言う」で表した。
- source_word: Δαυὶδ υἱόν
  choice: ダビデの子
  rationale: 属格と無冠詞の「子」を直截に表し、「一人の子」や固定化した称号のいずれにも限定しない。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここではダビデ系の待望された王的救済者という称号の意味が前面に出ているため、「メシア」とした。別訳も脚注に示して語の伝統的な訳を保持する。
- issue: ダビデとの子関係
  choice: ダビデの子
  alternative: ダビデの一人の子／『ダビデの子』
  rationale: 原文の簡潔な属格表現を保ち、この後の議論が扱う神学的緊張を、称号化や定冠詞の補足によって先取りして解消しないようにした。
translation_notes:
  register: 現代標準日本語の丁寧体を用い、イエスの問いとして自然でありながら格調を保った。「人々」は原文の主語不明示の三人称複数を日本語で読める形にするための最小限の補足。
