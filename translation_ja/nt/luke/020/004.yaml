id: LUK.20.4
reference: Luke 20:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τὸ βάπτισμα Ἰωάννου ἐξ οὐρανοῦ ἦν ἢ ἐξ ἀνθρώπων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/004.yaml
  text: Was John's baptism from heaven or from men?[a]
translation:
  language: ja
  text: ヨハネの洗礼は、天からのものだったのか、それとも人からのものだったのか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神からのもの」。直訳は「天から」で、神に由来することや神の権威によることを敬意を込めて表す言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: 洗礼
  rationale: ヨハネに結びついた儀礼・実践を指す名詞であり、現代日本語の聖書用語として「洗礼」が最も明確で自然。
- source_word: Ἰωάννου
  choice: ヨハネの
  rationale: 属格を、ヨハネに属する、またはヨハネが授けた洗礼という関連を自然に表す連体表現とした。
- source_word: ἐξ οὐρανοῦ
  choice: 天からのもの
  rationale: 直訳的な「天から」を保ち、神に由来する権威という含意を本文で明示しすぎない。「もの」を補うことで日本語として自然な対比にした。
- source_word: ἐξ ἀνθρώπων
  choice: 人からのもの
  rationale: 神的・天的な起源または権威に対する、人間に由来するものという対比を、性別を限定しない「人」で表した。
- source_word: ἦν
  choice: ものだったのか
  rationale: ギリシア語の連結動詞と起源を示す句の構造を、日本語で自然な名詞述語として表現した。
- source_word: ἢ
  choice: それとも
  rationale: 二つの選択肢を明確に対置する疑問文として、現代日本語で自然な接続表現を用いた。
theological_decisions:
- issue: ヨハネの洗礼が「天から」であることの意味
  choice: 本文では「天から」を保持する。
  alternative: 「神から」と明示する。
  rationale: この表現は神的な起源または権威を示す敬虔な言い方だが、原文は明示的に「神」とは言わず「天」と述べるため、その含意と表現上の余地を保った。
translation_notes:
  register: 明瞭で現代的ながら品位のある疑問文とした。「バプテスマ」ではなく、一般読者に広く理解される「洗礼」を採用。「人々」よりも起源の対比を簡潔に示す「人」を用いた。
