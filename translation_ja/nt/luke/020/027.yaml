  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: ja
  text: さて、復活があることを否定する[a]サドカイ派の者たちのうち何人かが、イエスのもとに来て、尋ねた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「復活はないと言う」。
    reason: οἱ ἀντιλέγοντες は文脈上「否定する」と訳すのが明瞭だが、原文の表現により近い平明な言い方として「復活はないと言う」も可能である。
lexical_decisions:
- source_word: Προσελθόντες
  choice: 近寄って来て
  rationale: イエスのもとへ近づく動きを自然な現代日本語で表し、主動詞に先立つアオリスト分詞の働きも保った。
- source_word: δέ
  choice: さて
  rationale: 強い逆接ではなく、新たな場面への展開を示す談話標識として訳した。
- source_word: τινες τῶν Σαδδουκαίων
  choice: サドカイ派の人々が何人か
  rationale: 部分を表す属格を反映し、サドカイ派全員ではなく、そのうちの何人かであることを明示した。
- source_word: οἱ ἀντιλέγοντες
  choice: 主張する
  rationale: ここでは後続する不定詞句を内容として述べる用法と取り、彼らの立場を自然に示した。語そのものが持つ『反対して言う』含意は、断定的な内容によって文脈上保たれる。
- source_word: ἀνάστασιν μὴ εἶναι
  choice: 復活はないと
  rationale: 不定詞構文の内容を簡潔な引用節として訳し、復活の存在を否定する立場を過不足なく表した。
- source_word: ἐπηρώτησαν αὐτόν
  choice: イエスに尋ねた
  rationale: ἐπερωτάωの基本的な問いかけを自然に表した。代名詞の指示対象を日本語で明確にするため『イエス』とした。後続文脈の挑戦的性格を先取りして『問い詰めた』とはしなかった。
theological_decisions:
- issue: サドカイ派の復活に関する立場
  choice: 復活はないと主張する
  alternative: 復活を否定する
  rationale: 原文は彼らが『復活は存在しない』と述べる立場を示している。『主張する』は内容節との結び付きを自然に保ち、後代の教理的説明を加えない。
translation_notes:
  register: 明瞭で現代的かつ品位のある叙述体。『サドカイ人』より集団・党派として分かりやすい『サドカイ派の人々』を用いた。脚注標識は節末に置き、文全体の別訳であることを示した。
