  yaml_path: translation/nt/luke/020/040.yaml
  text: For they no longer dared to ask him anything.
translation:
  language: ja
  text: というのも、彼らはもはや、あえてイエスに何一つ尋ねようとはしなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: もはや～なかった
  rationale: それまでの行為がこの時点から途絶えたことを示す時間的意味を、自然な現代日本語で表す。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の文脈に対する理由・説明のつながりを明示する。
- source_word: ἐτόλμων
  choice: ～ようとはしなかった
  rationale: τολμάωの「敢えてする、思い切ってする」という意味を含ませつつ、οὐκέτιと不定詞を伴う文全体を自然に表現する。「尋ねる勇気がなかった」ほど心理状態を断定しない。
- source_word: ἐπερωτᾶν
  choice: 尋ねる
  rationale: 質問する行為を指す不定詞。公の場での問いかけという文脈にも合い、現代日本語として自然で品位がある。
- source_word: αὐτὸν
  choice: イエスに
  rationale: 代名詞の指示対象を日本語で明確にし、前後の文脈からイエスを指すことを表す。
- source_word: οὐδέν
  choice: 何一つ
  rationale: 否定文の中で「何も、どんなことも」という全面的な否定を強調して表す。
