id: LUK.20.36
reference: Luke 20:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: ja
  text: 彼らはもはや死ぬことができません。御使いたちに等しい者であり、神の子であり、復活の子であるからです[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「御使いたちのような者で」。
    reason: lexical_alternative
  - marker: b
    text: 原文では「神の子」と「復活の子」。ここで「子」は身分と帰属を表し、男性だけを指すものではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται
  choice: 彼らはもはや死ぬことができないからです
  rationale: δύνανταιを能力・可能性として「できない」とし、ἔτιを「もはや」で表した。冒頭のοὐδὲ γάρは前節とのつながりを示すが、単独節としても自然な説明文になるよう文末の「からです」に反映した。
- source_word: ἰσάγγελοι
  choice: 御使いたちに等しく
  rationale: ἴσοςとἄγγελοςから成る語の比較的直接的な意味「御使いたちに等しい」を保持し、御使いそのものになるという意味にはしない。「御使い」は聖書文体として定着しつつ、現代の読者にも理解できる。
- source_word: υἱοί εἰσιν θεοῦ
  choice: 神の子なのです
  rationale: υἱοίの身分・帰属を示す比喩を「子」として保持した。日本語の複数主語「彼ら」に対しては「子ら」とせずとも複数性が明白で、自然な表現となる。
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: 復活の子であるので
  rationale: 属格を含む原文の比喩「復活の子」を保持した。分詞ὄντεςには説明的・理由的な含みがあるため「であるので」としたが、復活との結びつき以上の教理的説明は加えていない。
- source_word: γάρ ... γάρ
  choice: からです。…ので
  rationale: 二つのγάρが担う説明の連鎖を、日本語で不自然な反復を避けながら二段階の理由として表した。
theological_decisions:
- issue: 終末論的文脈における「神の子」「復活の子」
  choice: 二つの「子」の比喩を本文に残す
  alternative: 「神の子ども」「復活に属する者」と意訳する
  rationale: 原文はυἱοίを反復し、神との関係および復活によって特徴づけられる身分を表す。日本語の「子」は文法上男性だけに限定されないため、包摂性を保ちながら原文の修辞的対応も維持できる。
- issue: 復活した者と御使いとの関係
  choice: 「御使いたちに等しく」と比較として訳す
  alternative: 「御使いのようで」と訳す
  rationale: ἰσάγγελοιは同一性ではなく類似・同等性を示す。より直接的な「等しく」を本文に置き、「ようで」を脚注の自然な別訳として示した。
translation_notes:
  register: 明快な現代標準語を基調としつつ、聖書語として広く定着した「御使い」を用いた。「復活の子」という原文の緊張を残し、説明的に平板化しない。二文に分けて論理関係を読み取りやすくした。
