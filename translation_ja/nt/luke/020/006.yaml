id: LUK.20.6
reference: Luke 20:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπωμεν· Ἐξ ἀνθρώπων, ⸂ὁ λαὸς ἅπας⸃ καταλιθάσει ἡμᾶς, πεπεισμένος γάρ ἐστιν Ἰωάννην προφήτην εἶναι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: ja
  text: しかし、もし『人からだ』と言えば、民はみな私たちを石で打つだろう。ヨハネは預言者だと確信しているからだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヨハネは預言者だったと確信しているからだ」。ギリシア語の不定詞は、それ自体では時を特定しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: しかし、もし……と言えば
  rationale: ἐάν＋接続法が示す現実的な条件を自然な現代日本語で表し、δέの対比的な流れを「しかし」で保った。
- source_word: Ἐξ ἀνθρώπων
  choice: 人からだ
  rationale: 直前の文脈にあるヨハネの洗礼の由来を受けた省略表現であるため、日本語でも簡潔な形を保った。「人間に由来する」より直接的である。
- source_word: ὁ λαὸς ἅπας
  choice: 民はみな
  rationale: λαόςの集合的な「民」と、ἅπαςの包括性を簡潔かつ自然に表した。
- source_word: καταλιθάσει ἡμᾶς
  choice: 私たちを石で打つだろう
  rationale: 動詞の意味を過不足なく表し、原文に明記されない「殺すまで」は補わなかった。
- source_word: πεπεισμένος γάρ ἐστιν
  choice: 確信しているからだ
  rationale: 完了分詞の結果状態と、集合名詞である「民」を受ける単数形を、日本語で自然に表した。
- source_word: Ἰωάννην προφήτην εἶναι
  choice: ヨハネは預言者だと
  rationale: 対格＋不定詞構文を自然な引用内容節にした。εἶναιは時制を独立に明示しないため、民のその時点での確信を日本語の「だ」で表し、過去か現在かを不必要に固定しない。
theological_decisions:
- issue: 民によるヨハネの評価の時間的表現
  choice: ヨハネは預言者だ
  alternative: ヨハネは預言者だった
  rationale: ギリシア語不定詞εἶναι自体は時間を限定しない。日本語の引用節では「だ」が自然であり、民がその時点で抱いていた確信を示しつつ、ヨハネの預言者性を過去だけに限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「民」「預言者」など聖書本文にふさわしい品位ある語を選んだ。会話内の省略表現は原文どおり簡潔に保った。
