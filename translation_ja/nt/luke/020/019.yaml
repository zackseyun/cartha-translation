  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: ja
  text: 律法学者たちと祭司長たちは、まさにその時、イエスを捕らえようとした[a]。しかし、民衆を恐れた。イエスがこのたとえを自分たちに対して語ったと知ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼に手をかけようとした」。ここでは「彼を押さえる」「彼を逮捕する」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτησαν
  choice: 〜ようとした
  rationale: アオリストの動詞が示す企てと意図を自然な日本語で表し、実際に捕らえたとは含意しない。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 福音書の文脈における、律法の解釈と教授に携わった特定の集団を現代の読者に明瞭に伝える。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数形は同時に複数いた大祭司ではなく、祭司階級の指導者層を指すため。
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: イエスを捕らえる
  rationale: 直訳は「彼の上に手を置く」だが、ここでは敵対的に身柄を押さえる慣用表現である。「手をかける」は日本語では殺害の含みを帯びうるため避けた。原文の比喩は脚注に残す。
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: まさにその時
  rationale: 直前の出来事と結びついた即時性と強調を、自然な現代日本語で保持する。
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: 民衆を恐れた
  rationale: λαόςは単なるその場の群衆より広く民衆を指し、指導者たちの社会的・政治的な懸念を保つ。
- source_word: ἔγνωσαν
  choice: 分かった
  rationale: たとえの標的が自分たちだと認識したことを、平明な現代日本語で示す。
- source_word: πρὸς αὐτοὺς
  choice: 自分たちに向けて
  rationale: 「彼らに」または文脈上「彼らに対して」という方向性を保ち、非難の含意を本文で過度に限定しない。再帰的な「自分たち」は主語である宗教指導者たちの認識を明確にする。
- source_word: παραβολὴν
  choice: たとえ
  rationale: 福音書における παραβολή の定着した、一般読者にも自然な訳語。
theological_decisions:
- issue: πρὸς αὐτούς が示す、たとえと宗教指導者たちとの関係
  choice: 「自分たちに向けて」とし、たとえが彼らを標的としていた含みを保つ。
  alternative: 「自分たちを非難して」または「自分たちを指して」
  rationale: 直前の文脈では彼らが自分たちを悪い農夫になぞらえられたと悟ったことが明らかだが、πρός自体を「非難して」と明示すると解釈を本文に織り込みすぎる。「向けて」は対決的な文脈と語の方向性の双方を保持する。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「イエス」は日本語で主語を補って指示対象を明確にした。原文の二つの καί は、日本語の自然な談話展開に合わせて文を分け、「しかし」で対照を明示した。
