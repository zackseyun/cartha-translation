  source_fidelity: 全体として原文の構文と意味をよく反映している。ἰδόντες は「見ると」、διελογίζοντο πρὸς ἀλλήλους は相互の思案として「互いに相談して」、κληρονόμος は文脈に即して「跡取り」、ἵνα節とγένηταιは「そうすれば…ものになる」と適切に表されている。ただし、ἀποκτείνωμεν に対する「殺してしまおう」は完遂・決着の含みをやや加えるため、「殺そう」のほうが直接的である。
  naturalness: 「ぶどう園の耕作人たち」は意味は通るものの、明瞭な現代標準語としてはやや不自然である。「ぶどう園の農夫たち」がより自然で、農耕者というγεωργοίの語義も保てる。
  terminology: 「跡取り」と「相続財産」の組合せは、物語のせりふとして自然であり、κληρονόμοςとκληρονομίαの区別も保たれている。「農夫たち」はここでは性別を限定する意図ではなく伝統的な職業名として用いるが、注で「耕作する人々」という語義を示すのがよい。
