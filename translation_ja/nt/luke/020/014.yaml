  text: ἰδόντες δὲ αὐτὸν οἱ γεωργοὶ διελογίζοντο πρὸς ⸀ἀλλήλους λέγοντες· Οὗτός ἐστιν ὁ κληρονόμος· ⸀ἀποκτείνωμεν αὐτόν, ἵνα ἡμῶν γένηται ἡ κληρονομία·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/014.yaml
  text: But when the vine-growers saw him[a], they reasoned with one another, saying, ‘This is the heir. Let us kill him, so that the inheritance may become ours.’
translation:
  language: ja
  text: ところが、ぶどう園の農夫たち[a]はその息子を見ると、互いに相談して言った。「あれが跡取りだ。殺そう。そうすれば、相続財産は私たちのものになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「農夫たち」とも訳せる。文脈上は「借地農たち」と理解することもできる。ギリシア語は農耕に携わる人々を指し、このたとえでは特にぶどう園を耕す人々である。
    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: ぶどう園の耕作人たち
  rationale: 語そのものは農耕に携わる者を指し、このたとえではぶどう園を耕しているため、文脈上の具体性を自然に示した。「借り農夫」は周辺文脈にある賃借関係を明示するが、この名詞自体の語義より狭い。
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: 互いに相談して
  rationale: 未完了過去と相互表現が示す、彼ら同士の思案・協議を自然な日本語で表した。「議論した」では対立の含みが強すぎる。
- source_word: κληρονόμος
  choice: 跡取り
  rationale: 物語中の地主の息子を指す語として、現代の一般読者に自然で明瞭。「相続人」も正確だが、せりふとしてはやや法律用語的である。
- source_word: ἀποκτείνωμεν
  choice: 殺してしまおう
  rationale: 一人称複数の勧奨的な接続法を直接的に表した。「殺害しよう」ほど硬くせず、「 murder 」に相当する道徳的評価も語義以上に加えていない。
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: そうすれば、相続財産は私たちのものになる
  rationale: ἵναの目的・意図と、γένηταιの「〜になる」という変化を保ちつつ、企みを述べる日本語として自然にした。
- source_word: δὲ
  choice: ところが
  rationale: 物語の進展と軽い対照を示し、息子を見た耕作人たちの反応への転換を明確にする。
- source_word: ἰδόντες δὲ αὐτὸν
  choice: その息子を見ると
  rationale: アオリスト分詞を時間的に訳した。αὐτόνの指示対象が直前の「愛する息子」（20:13）であることを、日本語で曖昧にならないよう示した。
theological_decisions:
- issue: ぶどう園のたとえにおける γεωργοί の呼称
  choice: 「ぶどう園の耕作人たち」と訳す。
  alternative: 「借り農夫たち」または「農夫たち」
  rationale: 原語の農業従事者という意味と、ぶどう園という直接の物語文脈を優先した。賃借人としての立場は周辺文脈から分かるが、この名詞だけに法的関係を読み込まない。
- issue: ἵνα節が表す企ての因果・目的
  choice: 「そうすれば」とし、耕作人たちが殺害によって相続財産を得られると見込んだ企てを表す。
  alternative: 「相続財産を私たちのものにするために」
  rationale: 目的の力を保ちながら、彼らの誤った推論を断定的な神学説明へ変えず、せりふとして自然にした。
translation_notes:
  register: 明瞭な現代標準語を用い、たとえ話の直接的で緊迫したせりふを保った。「跡取り」は口頭の相談として自然であり、「相続財産」と組み合わせることで法的意味も明確にした。
