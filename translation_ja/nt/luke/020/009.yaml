revisions:
- from: それから、イエスは民にこのたとえを語り始めた。「ある人がぶどう園を作り、それを農夫たちに貸して、長い間旅に出た[a]。」
  to: それから、イエスは人々にこのたとえを語り始めた。「ある人がぶどう園を植え、それを農夫たちに貸し、かなり長い間、遠方へ出かけていた[a]。」
  rationale: ἀπεδήμησεν と χρόνους ἱκανούς の組合せを、遠方への不在が相当期間続いたこととして自然に表した。「人々」は λαός の集合的意味を保ちながら、対象方針である明瞭な現代標準日本語に合わせた。φυτεύω の「植える」は、ぶどう園を造成・設置したとのみ述べるより原語の動作を忠実に伝える。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:19:49Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として原文の構文と内容をよく伝えている。しかし、ἀπεδήμησεν は単に「旅に出る」ことよりも、自分の居所・地域を離れて不在であることを指すため、「長い間旅に出た」は日本語としても期間の係り方がやや不自然であり、原語の不在の含意を十分に表しにくい。
  naturalness: 「民」は聖書文体として可能だが、明瞭な現代標準日本語としては「人々」のほうが自然である。「ぶどう園を植え」は原語の φυτεύω を具体的に保ちつつ、この文脈では理解可能である。
  terminology: 「たとえ」「ぶどう園」「農夫たち」は適切である。「ある人」は日本語の物語導入として自然であり、原文が特定の男性人物を導入していることを不必要に一般化するものではない。脚注は本文の「あちらへ出かけていた」に対応させ、外国への移動を本文で断定しないよう維持する。
  issues:
  - severity: medium
    issue: 「長い間旅に出た」
    rationale: χρόνους ἱκανούς は不在の期間を表す。日本語では「旅に出た」に「長い間」を直接かけると、出発時点の動作と継続期間の関係が不明瞭になる。ἀποδημέω の「居所を離れている」含意も弱くなる。
  revised_text: それから、イエスは人々にこのたとえを語り始めた。「ある人がぶどう園を植え、それを農夫たちに貸し、かなり長い間、遠方へ出かけていた[a]。」
