id: LUK.20.9
reference: Luke 20:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἤρξατο δὲ πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην· ⸀Ἄνθρωπος ἐφύτευσεν ἀμπελῶνα, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν χρόνους ἱκανούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: ja
  text: それから、イエスは人々にこのたとえを語り始めた。「ある人がぶどう園を植え、それを農夫たちに貸し、かなり長い間、遠方へ出かけていた[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「かなり長い間、外国へ出かけていた」。この動詞は、自分の住む地域を離れ、外国を含む遠方に滞在することを表す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο
  choice: 語り始めた
  rationale: 語り出すという行為の開始を示す。λέγεινと合わせ、日本語として自然な一続きの表現にした。
- source_word: δὲ
  choice: それから
  rationale: 物語の進行と場面の移行を示す接続辞として、現代日本語で自然に表した。
- source_word: πρὸς τὸν λαὸν
  choice: 民に
  rationale: λαόςの集合的な意味を保ち、『群衆』と限定せず、イエスが語りかけた相手を示した。
- source_word: λέγειν τὴν παραβολὴν ταύτην
  choice: このたとえを語り
  rationale: παραβολήを福音書で定着した『たとえ』とし、λέγεινは目的語との組み合わせに合う『語る』とした。
- source_word: Ἄνθρωπος
  choice: ある人
  rationale: 物語に一人の人物を導入する日本語の慣用表現。文法上の男性形を不自然に強調せず、特定の一人物であることを保つ。
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: ぶどう園を作り
  rationale: 直訳的には『ぶどう園を植え』だが、日本語では不自然なため、ぶどうを植えて園を設けた意味を自然に表した。
- source_word: ἐξέδετο
  choice: 貸して
  rationale: 土地を他者に貸し出す意味。現代の一般読者に明瞭で、賃貸借の文脈も伝わる。
- source_word: γεωργοῖς
  choice: 農夫たち
  rationale: 耕作に従事する者を指す語義を保った。借り手であることは動詞『貸して』によって示される。
- source_word: ἀπεδήμησεν
  choice: 旅に出た
  rationale: 自分の土地・地域を離れて不在になる意味を自然に表し、本文だけでは明示されない『外国』を断定しない。
- source_word: χρόνους ἱκανούς
  choice: 長い間
  rationale: 相当な期間を表す複数形の慣用表現を、簡潔で自然な日本語にした。
theological_decisions:
- issue: たとえの冒頭のἌνθρωποςが示す人物の性別
  choice: ある人
  alternative: ある男
  rationale: ギリシア語は男性単数形だが、物語の人物を導入する日本語では『ある人』が自然であり、人物を一般的人類と解するものではない。性別を否定せず、同時に原文以上に強調しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、福音書のたとえとして落ち着いた品位を保った。原文に主語名はないが、直前の文脈で話者がイエスであるため、日本語で主語を明確にする目的で『イエスは』を補った。脚注記号は語義上対応する『旅に出た』の直後に置いた。
