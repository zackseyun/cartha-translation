lexical_decisions:
- source_word: κατανοήσας
  choice: 見抜いて
  rationale: 単なる視認ではなく、相手の内にある企みを認識したことを表す。文脈上自然でありながら、超自然的な知識まで明示しない。
- source_word: δὲ
  choice: しかし
  rationale: 罠を仕掛けようとする者たちに対するイエスの応答への、穏やかな対比と展開を示す。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: 属格を自然な日本語の所有表現にした。
- source_word: πανουργίαν
  choice: 悪巧み
  rationale: 抜け目のない、不正な策略という否定的意味を、現代日本語で明瞭かつ簡潔に表す。「欺き」だけでは計算高い策略の要素が弱く、「狡猾さ」より具体的で分かりやすい。
- source_word: εἶπεν
  choice: 言われた
  rationale: 標準的な物語表現。主語がイエスであるため、自然で節度ある敬語を用いた。
- source_word: πρὸς αὐτούς
  choice: 彼らに
  rationale: 発言の相手を示すπρός＋対格を、自然な日本語で表した。
