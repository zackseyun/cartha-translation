  text: καὶ προσέθετο ⸂τρίτον πέμψαι⸃· οἱ δὲ καὶ τοῦτον τραυματίσαντες ἐξέβαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/012.yaml
  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: ja
  text: そこで彼は、さらに三人目を遣わした[a]。ところが彼らは、この者にも傷を負わせ、外に放り出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では直訳すると「三人目を遣わすことを付け加えた」。これは「さらに三人目を遣わした」「続いて三人目を遣わした」という意味の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: さらに…遣わした
  rationale: προστίθημι＋不定詞は、ある行為をさらに続けることを表す慣用表現である。「さらに」によって反復・継続の意味を自然な日本語で示した。
- source_word: τρίτον πέμψαι
  choice: 三人目を遣わした
  rationale: 原文では目的語の名詞が省かれ、「三人目を遣わす」とある。前の文脈からしもべを指すことは明らかなので、日本語でも名詞を補わず簡潔に訳した。
- source_word: οἱ δὲ
  choice: ところが彼らは
  rationale: δέが示す場面の展開と対照を「ところが」で表した。「彼ら」は文脈上、ぶどう園の農夫たちを指す。
- source_word: καὶ τοῦτον
  choice: この者にも
  rationale: καίの付加・反復の意味を助詞「も」で表し、三人目も同様に扱われたことを明確にした。
- source_word: τραυματίσαντες
  choice: 傷を負わせ
  rationale: τραυματίζωは傷つける、負傷させることを意味するため、具体性を保つ「傷を負わせ」とした。
- source_word: ἐξέβαλον
  choice: 外に放り出した
  rationale: ἐκβάλλωの外へ追い出すという方向性と暴力的な響きを、現代日本語として自然な「外に放り出した」で表した。
