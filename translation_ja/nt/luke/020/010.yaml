revisions:
- from: 時が来ると、彼はぶどう園の農夫たちのところへ奴隷[a]を一人遣わした。ぶどう園の実りの一部を自分に渡してもらうためであった。ところが農夫たちは、その奴隷を殴ったうえ、何も持たせずに追い返した。
  to: 適切な時に、彼はぶどう園の農夫たちのところへ奴隷[a]を遣わした。ぶどう園の実りの一部を彼に渡してもらうためであった。ところが農夫たちは、その奴隷を殴ったうえ、何も持たせずに追い返した。
  rationale: καιρῷの意味を「適切な時に」として反映し、αὐτῷの指示対象を「彼に」と明確化した。その他の表現は、原文の農業的設定、実りの一部という部分性、殴打の後に何も得ず送り返されたという出来事の順序を自然な現代日本語で保っている。
