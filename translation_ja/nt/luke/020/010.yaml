source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: ja
  text: 適切な時に、彼はぶどう園の農夫たちのところへ奴隷[a]を遣わした。ぶどう園の実りの一部を彼に渡してもらうためであった。ところが農夫たちは、その奴隷を殴ったうえ、何も持たせずに追い返した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」とも訳せる。ギリシア語のこの語は奴隷を指し、この文脈ではその身分を明確にするため「奴隷」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: 時が来ると
  rationale: καιρόςが表す、ふさわしい時・定められた時という意味を保ちつつ、収穫期とまでは明示しない自然な日本語とした。
- source_word: γεωργούς
  choice: ぶどう園の農夫たち
  rationale: γεωργός自体に借地人という法的身分を読み込まず、直後の「ぶどう園」と結びつけて農業上の役割を明確にした。
- source_word: δοῦλον
  choice: 奴隷
  rationale: 当時の拘束された社会的身分を曖昧にしない直接的な訳語を採った。日本語で伝統的な「しもべ」も可能なので脚注に示した。
- source_word: ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος δώσουσιν αὐτῷ
  choice: ぶどう園の実りの一部を自分に渡してもらうため
  rationale: ἵναの目的を明示し、ἀπόの部分的な意味を「一部」で自然に表した。「取り分」などの語で明示されていない契約上の権利までは付加していない。
- source_word: δείραντες
  choice: 殴ったうえ
  rationale: δέρωの打つ・殴るという意味を保ち、特定の刑罰としての鞭打ちには限定しなかった。
- source_word: ἐξαπέστειλαν αὐτὸν ... κενόν
  choice: 何も持たせずに追い返した
  rationale: 「空のまま送り出した」という原文の意味を、何の収穫も渡されなかったことが明瞭な現代日本語で表した。
theological_decisions: []
