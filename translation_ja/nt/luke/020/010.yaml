  terminology: δοῦλονを「奴隷」とする方針は原語の社会的身分を不必要に弱めず、適切です。脚注は、当該語が文脈により「しもべ」とも訳されることを示しつつ、「奴隷」の訳語選択を説明する表現へ整えます。
