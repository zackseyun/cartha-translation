  terminology: 「先生」「モーセ」「妻」「子」は適切である。「妻を迎え」は結婚関係を表す文脈上自然であり、原文にない制度説明を本文へ過剰に加えていない。「死んだ兄弟のために子孫をもうける」は、子孫が死亡した兄弟のために立てられるという与格の趣旨を保つ。
