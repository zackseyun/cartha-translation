id: LUK.20.28
reference: Luke 20:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: ja
  text: 「先生、モーセは私たちのためにこう書きました。『もし、ある人の兄弟が妻を残して死に[a]、子がいなかったなら、その人のもう一人の兄弟は残された妻を迎え、死んだ兄弟のために子孫をもうけなければならない[b]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「妻がいる状態で死に」。
    reason: 「妻を残して」は自然な日本語だが、原文の分詞ἔχων（「持っている、いる」）を解釈的に表したものであるため。
  - marker: b
    text: 「子孫をもうける」は申命記25章5節に響く法的な言い回しで、死んだ兄弟のために子孫を立てることを表す。直訳は「種を起こす」。
    reason: 原文の聖書的・法的慣用句ἐξαναστήσῃ σπέρμαの背景と字義を示すため。
lexical_decisions:
- source_word: Διδάσκαλε
  choice: 先生
  rationale: イエスへの呼びかけとして、現代日本語で自然かつ敬意のある表現。
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: モーセは私たちのためにこう書いています
  rationale: ἡμῖνは直接の宛先というより、イスラエルに与えられた律法が自分たちに関わることを示す与格として訳した。
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: もし、ある人の兄弟が…死に
  rationale: τινοςの不定・一般的な意味と、条件文の単数形を自然な日本語で保った。
- source_word: ἔχων γυναῖκα
  choice: 妻を残して死に
  rationale: 直訳は「妻がいる状態で死ぬ」だが、日本語では死亡時に妻が存命であることを自然に表す「妻を残して死ぬ」とした。解釈を明示するため直訳を脚注に示した。
- source_word: οὗτος ἄτεκνος ᾖ
  choice: 子がいなかったなら
  rationale: οὗτοςは死亡した兄弟を指す。ἄτεκνοςを、子の性別を限定せず平明に訳した。
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: その兄弟は残された妻を迎え
  rationale: レビラト婚の文脈で「妻として迎える」という意味を簡潔に表し、単なる引き取りと誤解されにくくした。
- source_word: ἐξαναστήσῃ σπέρμα
  choice: 子孫をもうける
  rationale: 字義的な「種を起こす」ではなく、亡くなった兄弟の名を継ぐ子孫を得させるという法的慣用句の意味を、現代日本語で明瞭に表した。
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: 死んだ兄弟のために
  rationale: 与格が示す受益・帰属を「ために」で表し、指示対象が死亡した兄弟であることを明確にした。
theological_decisions:
- issue: レビラト婚に関する律法用語を、後代の教理や文化的説明を持ち込まずに訳すこと
  choice: 「その兄弟は残された妻を迎え、死んだ兄弟のために子孫をもうけなければならない」
  alternative: 「その兄弟は未亡人と結婚し、兄弟のために子をもうけなければならない」
  rationale: 申命記25章5節を踏まえた法的義務を示しつつ、原文にない「未亡人」という名詞や説明を本文へ過度に補わない。「なければならない」はἵνα節が引用された規定の内容を表すことを明瞭にする。
translation_notes:
  register: 明瞭な現代標準語を用い、引用された律法にふさわしい端正さを保った。「めとる」「子種」など古風または誤解を招きやすい語は避けた。
