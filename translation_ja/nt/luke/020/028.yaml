revisions:
- from: 「先生、モーセは私たちのためにこう書いています。『もし、ある人の兄弟が妻を残して死に[a]、子がいなかったなら、その兄弟は残された妻を迎え、死んだ兄弟のために子孫をもうけなければならない[b]。』」
  to: 「先生、モーセは私たちのためにこう書きました。『もし、ある人の兄弟が妻を残して死に[a]、子がいなかったなら、その人のもう一人の兄弟は残された妻を迎え、死んだ兄弟のために子孫をもうけなければならない[b]。』」
  rationale: アオリストἔγραψενに合わせて「書きました」とした。また、生存している兄弟を指すὁ ἀδελφὸς αὐτοῦが日本語で曖昧にならないよう、「その人のもう一人の兄弟」とした。その他の訳語と脚注の基本方針は、原文の法的慣用表現と現代日本語としての明瞭さをよく両立しているため維持した。
