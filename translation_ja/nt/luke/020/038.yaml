id: LUK.20.38
reference: Luke 20:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: ja
  text: 神は死んだ者たちの神ではなく、生きている者たちの神です。すべての者は、神にとって生きているのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての者は神の前で生きているのです。」
    reason: αὐτῷ の与格は、「神にとって」とも「神の前で」とも理解し得るため。
lexical_decisions:
- source_word: θεὸς
  choice: 神
  rationale: 冠詞はないが、ユダヤ的一神教の文脈では定 definite に理解されるため、自然に「神」とした。
- source_word: δὲ
  choice: しかし
  rationale: 穏やかな継続・対比を示す接続辞。ここでは直後の「死んだ者たちではなく、生きている者たち」という対比を導くため、「しかし」とした。
- source_word: νεκρῶν
  choice: 死んだ者たち
  rationale: 実体詞的に用いられた複数形の形容詞を、現代日本語で明瞭な表現にした。
- source_word: ζώντων
  choice: 生きている者たち
  rationale: 実体詞的な現在分詞であり、「死んだ者たち」との簡潔な対比を保った。
- source_word: πάντες
  choice: すべての者
  rationale: 文脈上は先祖たちを念頭に置きつつ、ギリシア語の広い表現を限定せずに残した。
- source_word: αὐτῷ
  choice: 神に対して
  rationale: 与格の圧縮された関係的意味を保ち、「神のために」や「神の前では」と一義的に解釈しすぎない表現を選んだ。日本語で指示対象が明瞭になるよう「彼」ではなく「神」とした。
- source_word: ζῶσιν
  choice: 生きている
  rationale: 現在能動直説法を率直に表し、継続する生を示した。
theological_decisions:
- issue: πάντες γὰρ αὐτῷ ζῶσιν における αὐτῷ の意味
  choice: すべての者は神に対して生きているからです
  alternative: すべての者は神の前で生きているからです
  rationale: αὐτῷ の与格は「神との関係において」「神の前で」「神にとって」などと理解できる。本文では原文の関係的な含みを残し、復活についての議論を本文以上に体系化しないようにした。
translation_notes:
  register: 明瞭で現代的かつ格調を保った敬体。「死者／生者」よりも一般読者に直ちに理解しやすい「死んだ者たち／生きている者たち」を用いた。原文の神学的緊張と αὐτῷ の曖昧さは脚注で保持した。
