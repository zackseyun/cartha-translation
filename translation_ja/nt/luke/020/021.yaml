revisions:
- from: 彼らはイエスに尋ねた。「先生、私たちは、あなたが正しいことを語り、教えておられ、人を分け隔てせず[a]、真実に基づいて[b]神の道を教えておられることを知っています。」
  to: 彼らはイエスに尋ねた。「先生、私たちは、あなたが正しく語り、正しく教えておられ、人を分け隔てず[a]、真理に基づいて[b]神の道を教えておられることを知っています。」
  rationale: 原文の意味、語順上の重点、ならびに現代日本語の自然さを保ちながら、ὀρθῶς が二つの動詞にかかることを本文で明示した。また、ἐπ’ ἀληθείας を「真理に基づいて」とし、可能な言い換えを脚注に残した。既存の脚注アンカーは、それぞれ対応する語句の直後に置かれており、構造上の問題はない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:19:56Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として原文の構文と意味をよく保っている。とくに οὐ λαμβάνεις πρόσωπον を「人を分け隔てせず」としたこと、τὴν ὁδὸν τοῦ θεοῦ を「神の道」としたことは適切である。ただし、ὀρθῶς は「語る」と「教える」の両方にかかるため、「正しいことを語り、教えておられ」よりも、両動詞を明示して「正しく語り、正しく教えておられ」とするほうが原文に忠実で曖昧さがない。
  naturalness: 敬語を用いた引用文は自然で、現代標準日本語として明瞭である。「真実に基づいて」も理解可能だが、この文脈では「真理に基づいて」のほうが、教えの内容・方法が真理に即しているという ἐπ’ ἀληθείας の意味を自然に表せる。
  terminology: 「先生」「人を分け隔てず」「神の道」はいずれも適切である。「真理」はここで教派的な専門語を導入せず、ἀλήθεια の通常の意味を自然に伝える。脚注aは慣用句の説明として有用であり、脚注bは本文の訳語に合わせて代替訳を簡潔に整える。
  issues:
