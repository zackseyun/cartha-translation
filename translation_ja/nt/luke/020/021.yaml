    rationale: 原文の副詞は λέγεις と διδάσκεις の双方を修飾する。「正しいことを語り、教えておられ」でも大意は通るが、後者の「教える」が正しさを含むことを明示するほうが対応関係を保てる。
  - severity: low
    issue: 「真実に基づいて」がやや硬く、脚注の代替訳との対応が弱い
    rationale: ἐπ’ ἀληθείας は「真理に基づいて／真実に即して」と、教えが真理にかなうさまを表す。「真理に基づいて」とすれば日本語として滑らかで、脚注にも「真実に即して」という代替を提示できる。
