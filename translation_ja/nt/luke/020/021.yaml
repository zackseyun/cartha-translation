id: LUK.20.21
reference: Luke 20:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: ja
  text: 彼らはイエスに尋ねた。「先生、私たちは、あなたが正しく語り、正しく教えておられ、人を分け隔てず[a]、真理に基づいて[b]神の道を教えておられることを知っています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「顔を受け取らず」。人の外見や地位によって扱いを変えない、という慣用表現。
    reason: lexical_alternative
  - marker: b
    text: または「真実に即して神の道を教えておられ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: 尋ねた
  rationale: 質問することを表す基本的な語。文脈には試そうとする意図があるが、この動詞自体に敵対性を過度に持ち込まない自然な訳とした。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとしての「教師」に当たり、現代日本語で自然かつ敬意のある表現。
- source_word: οἴδαμεν
  choice: 私たちは…知っています
  rationale: 話し手たちが確信を装って述べる内容を率直に表す。文脈上の追従は本文で説明的に補わない。
- source_word: ὀρθῶς
  choice: 正しいことを
  rationale: 語る内容と教える内容の正しさを自然な日本語で示す。「正しく語り、教える」も可能だが、二つの動詞に無理なくかかる表現を選んだ。
- source_word: λέγεις καὶ διδάσκεις
  choice: 語り、教えておられ
  rationale: 原文の二つの動詞を保持し、呼びかけに続く丁寧な発話として自然な敬語にした。
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: 人を分け隔てせず
  rationale: 字義的には「顔を受け取らない」だが、人の身分や外見によって扱いを変えないという慣用的意味を、明瞭な現代日本語で表した。
- source_word: ἐπ’ ἀληθείας
  choice: 真実に基づいて
  rationale: 教え方が真実に即していることを示す句として訳した。「本当に」という強意にも取れる余地を脚注に示した。
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: 神の道
  rationale: 神の御心にかなう生き方・道筋という比喩と神学的な響きを保つ簡潔な訳。
- source_word: ἀλλ’
  choice: （人を分け隔てせず、）真実に基づいて
  rationale: 日本語では否定形の連用表現から肯定内容へ自然につなげることで、原文の「そうではなく、むしろ」という対比を表した。
theological_decisions:
- issue: οὐ λαμβάνεις πρόσωπον の慣用表現
  choice: 人を分け隔てせず
  alternative: 外見に左右されず／人をえこひいきせず
  rationale: 社会的地位や外見によって判断を曲げないという意味を伝えつつ、字義訳の不透明さを避けた。特定の教派的含意は加えていない。
- issue: ἐπ’ ἀληθείας の係り方と意味
  choice: 真実に基づいて神の道を教える
  alternative: 本当に神の道を教える
  rationale: この句は教える行為のあり方を示し、「真実に即して」とも「本当に」とも表現できる。本文では前者を採り、後者を脚注で残して曖昧さを示した。
translation_notes:
  register: 明瞭で現代的ながら品位のある口調。話し手がイエスに向ける表面的な敬意を自然な敬語で表し、彼らの隠れた意図はこの節の訳文に説明として持ち込まなかった。
