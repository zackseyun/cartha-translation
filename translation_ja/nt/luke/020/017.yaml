id: LUK.20.17
reference: Luke 20:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: ja
  text: 'しかし、イエスは彼らを見つめて言われた。「では、こう書かれているとは、どういうことですか。


    『家を建てる者たちが退けた石、

    これが隅のかしら石となった。』[a]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「隅の礎石」または「隅石」とも訳せる。別の理解では「頂石」。ギリシア語の表現は直訳すると「隅のかしら」である。
    reason: 原文の建築表現が、基礎となる隅石を指すのか、上部を仕上げる頂石を指すのか確定しないため。
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: 彼らを見つめて
  rationale: ἐμβλέπωが表す、相手に目を向けてじっと見る動作を自然な現代日本語で示した。「凝視して」ほど強さを限定しない。
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: では、次のように書かれているのは、どういうことですか
  rationale: γεγραμμένονの完了受動の引用表現を「書かれている」で保ちつつ、τί ἐστινの修辞的な問いを日本語として明瞭に表した。「聖書は何を意味するのか」と説明的に言い換えることは避けた。
- source_word: Λίθον
  choice: 石
  rationale: 引用内では日本語の詩的表現として冠詞相当語を補わず、特定の石であることは後続する「これ」によって明確になる。
- source_word: ἀπεδοκίμασαν
  choice: 退けた
  rationale: 不適格と判断して拒む意味を簡潔に表し、引用文にふさわしい格調も保つ。
- source_word: οἱ οἰκοδομοῦντες
  choice: 家を建てる者たち
  rationale: 実体詞的分詞を明示的に訳し、建築の比喩を保った。「建築家」ではなく、実際に建てる者たちを指す表現とした。
- source_word: οὗτος
  choice: これ
  rationale: 強意的な指示語を明示し、石を擬人的にキリストへ直接置き換えることなく原文の強調を保った。
- source_word: ἐγενήθη εἰς
  choice: となった
  rationale: ある役割・地位に至った結果を、日本語の引用文として自然かつ簡潔に表す。
- source_word: κεφαλὴν γωνίας
  choice: 隅のかしら
  rationale: 「隅の礎石」か「頂石」かという建築上の像を本文で一方に限定せず、κεφαλήと γωνία の構成を比較的透明に残した。
theological_decisions:
- issue: 詩編118:22引用における建築上の比喩
  choice: 隅のかしら
  alternative: 隅の礎石／隅石、または頂石
  rationale: κεφαλὴ γωνίαςが基礎の隅石を指すか、建物上部の頂石を指すかには解釈の幅がある。本文では直訳的な表現によって緊張を保ち、一般的な理解と別の可能性を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、聖書引用には簡潔で dignified な調子を持たせた。話者は文脈上の主語を明確にするため「イエス」とした。引用部分は詩的な改行を用い、原文の対照と指示語の強調を見えやすくした。
