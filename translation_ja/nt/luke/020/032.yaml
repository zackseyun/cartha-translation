  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕστερον
  choice: その後
  rationale: 物語上の後続を示す副詞。「その後」は時間的順序を自然かつ簡潔に表し、「最後に」のように段階の終結を必要以上に強調しない。
- source_word: καὶ
  choice: も
  rationale: 先に死んだ兄弟たちと同様に女も死んだことを示す添加の意味として訳した。
- source_word: ἡ γυνή
  choice: 女
  rationale: γυνήには「女」と「妻」の両義があるが、ここでは複数の兄弟と順次結婚した同一人物を指すため、特定の一人の妻という印象を避ける「女」が明確である。
- source_word: ἀπέθανεν
  choice: 死んだ
  rationale: 死という出来事を端的に述べるアオリスト。「亡くなった」よりも原文の直接的な表現を保つ。
