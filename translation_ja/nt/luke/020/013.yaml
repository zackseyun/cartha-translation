  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: ja
  text: そこで、ぶどう園の主人[a]は言った。「どうしようか。私の愛する息子を送ろう。もしかすると、この子を敬うだろう[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ぶどう園の主」。ここでは、ぶどう園の所有者・主人を指す。
    reason: lexical_alternative
  - marker: b
    text: 「敬う」と訳した語には、「その人を前に恥じ入る」「その人に敬意を払う」という意味合いもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: ぶどう園の主人
  rationale: 所有・管理の立場にある人物を自然な現代日本語で表す。「主」という称号を物語上の人物に不用意に持ち込まず、同時に「主人」が持つ権威の含みを保つ。
- source_word: Τί ποιήσω;
  choice: どうしようか
  rationale: 話者が自ら思案するアオリスト接続法の deliberative な問いを、簡潔で自然な独語として表す。
- source_word: πέμψω
  choice: 送ろう
  rationale: 決断した行動を示す未来形を、直前の自問に続く意志形で自然に表す。
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: 私の愛する息子
  rationale: υἱόςを性別も含めて「息子」とし、ἀγαπητόςの愛情とルカにおける神の子への響きを、解釈的に拡張せず保つ。
- source_word: ἴσως
  choice: もしかすると
  rationale: 確実ではない期待を表す副詞として、文脈と語調に合う自然な表現。
- source_word: τοῦτον
  choice: この子なら
  rationale: 指示代名詞の強調を保ち、先に遣わされた僕たちとの対比が日本語で伝わるよう「なら」を添える。息子を指すため「この子」とした。
- source_word: ἐντραπήσονται
  choice: 敬ってくれるだろう
  rationale: この文脈では、相手を前に恥じ入って態度を改め、敬意を示す意味。「敬う」が中心的な対人的含意を明瞭に伝え、「くれる」が話者側から見た期待を自然に表す。
theological_decisions:
- issue: 神を類型的に表し得るたとえの人物に用いられた κύριος の訳
  choice: ぶどう園の主人
  alternative: ぶどう園の主
  rationale: 直接の物語レベルではぶどう園を所有・管理する人物である。「主人」はその意味と権威を自然に伝えつつ、神学的称号としての「主」を翻訳によって強制しない。類型的連想は読者に開かれたまま保たれる。
- issue: 「愛する息子」が持つキリスト論的な響き
  choice: 私の愛する息子
  alternative: 私の息子、愛する者
  rationale: 洗礼や変貌の記事を想起させ得る ἀγαπητός の響きを保ちながら、たとえの中の父子関係としても自然な日本語にする。説明的な語を本文に加えない。
- issue: ἐντραπήσονται に含まれる恥と敬意の緊張
  choice: 敬ってくれるだろう
  alternative: この子の前では恥じ入るだろう
  rationale: 文脈上の帰結である敬意を本文で明瞭にしつつ、原語が持ち得る「その人を前に恥じ入る／遠慮する」という語感を脚注で示して意味の幅を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、たとえ話の直接的な語り口と品位を両立させた。「どうしようか」「送ろう」で主人の独語と決断の流れを自然にし、「この子なら」によって τοῦτον の指示的な強調を保った。脚注記号[a][b]は本文中にすべて配置した。
