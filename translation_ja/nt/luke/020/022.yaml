  text: ἔξεστιν ⸀ἡμᾶς Καίσαρι φόρον δοῦναι ἢ οὔ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/022.yaml
  text: Is it lawful for us to pay taxes to Caesar[a], or not?
translation:
  language: ja
  text: 私たちがカエサルに税を納めることは許されているのか、それとも許されていないのか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔξεστιν
  choice: 許されている
  rationale: 単なる可能性ではなく、法的・宗教的にしてよいかという許可・適法性を表す。日本語では「許されている」が、何の法を基準とするかを限定せず自然にその含みを保つ。
- source_word: ἡμᾶς
  choice: 私たちが
  rationale: 不定詞の意味上の主語を表す対格であり、「私たちが…すること」と訳す。原文にない「ユダヤ人」を補わない。
- source_word: Καίσαρι
  choice: カエサルに
  rationale: ローマ皇帝を指す固有の称号・名であり、歴史的・政治的な具体性を保つ。
- source_word: φόρον
  choice: 税を
  rationale: 支配権力に納める税・貢税を指す。本文では自然で明瞭な「税」とし、その政治的含意は文脈に委ねる。
- source_word: δοῦναι
  choice: 納めること
  rationale: δίδωμι は字義的には「与える」だが、φόροςとの組み合わせでは日本語の「税を納める」が正確で自然である。
- source_word: ἢ οὔ
  choice: それとも許されていないのか
  rationale: 日本語では述語を補って対立を明示すると、二者択一の問いが自然かつ明瞭になる。
theological_decisions:
- issue: 「許されている」の判断基準
  choice: ローマ法か神の律法かを特定せず、許可・適法性を問う表現とした。
  alternative: 「神の律法では許されているのか」または「ローマ法上、合法なのか」
  rationale: 原文は何を基準とした許可かを明示しておらず、政治的・宗教的な緊張を意図的に残しているため。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準語。「合法か」よりも日常的に理解しやすい「許されているのか」を用い、原文の基準の曖昧さを保持した。
