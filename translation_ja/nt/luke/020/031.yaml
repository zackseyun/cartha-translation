  text: καὶ ὁ τρίτος ἔλαβεν ⸀αὐτήν, ὡσαύτως δὲ καὶ οἱ ἑπτὰ οὐ κατέλιπον τέκνα καὶ ἀπέθανον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: ja
  text: 三番目の者も彼女を妻に迎えた[a]。そして七人とも同じように、子を残さずに死んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼女を取った」。ここでは、彼女を妻としたという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: 三番目の者
  rationale: 原文は「兄弟」を繰り返さず、直訳すれば「三番目の者」となる。文脈で誰を指すか明らかなため、省略を保った。
- source_word: ἔλαβεν αὐτήν
  choice: 彼女を妻に迎えた
  rationale: 字義的には「彼女を取った」だが、このレビラト婚の文脈では妻とすることを表す慣用句である。現代日本語として自然で意味の明確な表現を採った。
- source_word: ὡσαύτως δὲ καὶ
  choice: そして……同じように
  rationale: 同様の経過が続いたことと、前文からの接続の両方を自然な日本語で示した。
- source_word: οἱ ἑπτὰ
  choice: 七人とも
  rationale: 一連の七人全員を指す総括的な表現であり、日本語では「七人とも」が自然である。
- source_word: οὐ κατέλιπον τέκνα
  choice: 子を残さずに
  rationale: 死後に子孫を残さなかったという καταλείπω の含意を保ちつつ、τέκνα を簡潔に「子」と訳した。
- source_word: ἀπέθανον
  choice: 死んだ
  rationale: 婉曲化せず、原語の直接的な意味を明瞭に表した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いた。「三番目の者」に原文の省略を残しつつ、結婚を表す慣用句は本文で自然に意味が伝わるよう「妻に迎えた」とした。
