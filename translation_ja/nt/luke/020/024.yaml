  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: ja
  text: 「このデナリ銀貨[a]をわたしに見せなさい。そこには、だれの肖像と銘文が刻まれていますか。」彼らは答えた。「カイザルのものです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: デナリ銀貨は、当時広く用いられていたローマの貨幣です。
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: 見せなさい
  rationale: アオリスト命令形の直接的な命令を、明瞭で自然な現代日本語にした。
- source_word: δηνάριον
  choice: デナリ銀貨
  rationale: 歴史的な貨幣名を保ちつつ、「銀貨」を添えて一般読者にも何を指すか分かるようにした。
- source_word: τίνος ἔχει
  choice: だれの…が刻まれていますか
  rationale: 直訳的には「だれのものを持っているか」だが、貨幣の肖像と銘について尋ねる自然な日本語として表現した。
- source_word: εἰκόνα
  choice: 肖像
  rationale: 貨幣上の人物像という文脈では「肖像」が具体的かつ自然であり、εἰκώνの意味を適切に伝える。
- source_word: ἐπιγραφήν
  choice: 銘
  rationale: 貨幣に記された文字・銘文を簡潔かつ正確に表す語を選んだ。
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: 彼らは答えた
  rationale: 分詞と定動詞の組み合わせを、物語の流れに合う自然な日本語の定動詞表現にした。
- source_word: Καίσαρος
  choice: 皇帝のものです
  rationale: Καῖσαρはここではローマ皇帝の称号として理解できるため「皇帝」とし、属格だけの簡潔な返答を日本語として補って表現した。
theological_decisions:
- issue: Καίσαρος の訳語
  choice: 皇帝
  alternative: カエサル
  rationale: 固有名に由来する称号だが、この場面ではローマ皇帝を指す。普通の現代日本語で直ちに意味が通る「皇帝」を本文に採用し、特定個人名への不要な限定を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。問答の簡潔さを維持し、貨幣の歴史的背景は脚注で補った。
