id: LUK.20.16
reference: Luke 20:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: ja
  text: 主人はやって来て、この小作人たち[a]を滅ぼし、ぶどう園をほかの人々に与える。」これを聞いた人々は言った。「そんなことがあってはならない！[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「農夫たち」または「借地人たち」とも訳せる。ギリシア語は、他人の土地を耕作していた人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 「断じてそんなことはない！」とも訳せる。ギリシア語は強い拒絶を表し、字義的には「そんなことが起こりませんように」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: 主人はやって来て
  rationale: 主語は直前の文脈にあるぶどう園の主人。単に「来る」という意味を保ち、「戻って来る」などの解釈は加えない。
- source_word: ἀπολέσει
  choice: 滅ぼし
  rationale: 殺害だけに限定せず、厳しい破滅と裁きを表す語の幅を保つ。
- source_word: τοὺς γεωργοὺς τούτους
  choice: この小作人たち
  rationale: γεωργόςはこのたとえでは他人のぶどう園を借りて耕作する者を指すため、「農夫」より社会的関係が明確な「小作人」とした。τούτουςの近称も「この」で保持した。
- source_word: δώσει τὸν ἀμπελῶνα ἄλλοις
  choice: ぶどう園をほかの人々に与える
  rationale: δίδωμιの簡潔な意味を「与える」で保ち、ἄλλοιςが誰を指すかは本文同様に特定しない。
- source_word: ἀκούσαντες δὲ εἶπαν
  choice: これを聞いた人々は言った
  rationale: アオリスト分詞の時間的関係を自然な現代日本語で示し、δὲは場面の転換として語順に反映した。
- source_word: Μὴ γένοιτο
  choice: そんなことがあってはならない！
  rationale: 願望を表す希求法による強い拒絶と衝撃を、自然で力のある日本語として表した。
theological_decisions:
- issue: 聞き手の応答 Μὴ γένοιτο の力
  choice: 願望的な強い拒絶として「そんなことがあってはならない！」
  alternative: 「決してそんなことはない！」または「そんなことが起こりませんように！」
  rationale: 単なる事実否定ではなく、告げられた結末に対する感情的・意志的な拒絶を表す。字義的な願望形だけに寄せて不自然な日本語にすることも避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。たとえの農地賃貸関係は「小作人」で簡潔に示し、応答は古風すぎる願望表現を避けながら原文の強い拒絶を保持した。
