  text: until I make your enemies a footstool for your feet[a].
translation:
  language: ja
  text: わたしがあなたの敵をあなたの足台とするまで。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕως ἂν
  choice: まで
  rationale: 将来の時点を終点として示す表現であり、日本語では文末の「まで」が自然かつ簡潔に対応する。
- source_word: θῶ
  choice: とする
  rationale: τίθημιの基本義は「置く」だが、敵を足台にするという結果を表すこの比喩では「とする」が自然で、原文の使役的・結果的な意味を保つ。
- source_word: τοὺς ἐχθρούς σου
  choice: あなたの敵
  rationale: 対格目的語と二人称単数の所有を、そのまま明瞭に表した。敵対関係を弱めたり解釈し直したりしない。
- source_word: ὑποπόδιον
  choice: 足台
  rationale: 足を載せる台を指す語であり、詩篇引用の王権的な服従の比喩を保持する。
- source_word: τῶν ποδῶν σου
  choice: あなたの足の
  rationale: 属格を形式的に反映し、原文の「あなたの足の足台」という表現を保持する。日本語ではやや重複感があるため、より自然な言い換えを脚注に示す。
theological_decisions:
- issue: 詩篇110:1引用における敵の服従の比喩
  choice: 「あなたの敵を、あなたの足の足台とする」と比喩をそのまま残す。
  alternative: 「あなたの敵をあなたの足の下に置く」
  rationale: 王の敵が足台とされる詩的・王権的イメージを、敗北や支配という説明的表現に置き換えず保持する。キリスト論的含意を過度に解説せず、本文が持つ緊張を残す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「わたし」は直前の詩篇引用における発言者を保ち、「足台」という聖書的比喩を維持した。
