revisions:
- from: 彼らはイエスの様子をうかがい、正しい人を装う者たちを間者として送り込んだ。それは、イエスのことばじりを捕らえ[a]、総督の支配と権限のもとに引き渡すためであった。[b]
  to: 彼らはイエスの様子をうかがい、正しい人のふりをする密偵を送り込んだ。イエスの発言をとらえ[a]、こうして彼を総督の統治権と権限のもとに引き渡すためであった。[b]
  rationale: 「ことばじり」を、原文の意味範囲を保つ「発言」に改めた。また、現代語としてより分かりやすい「密偵」を用い、ὥστε 以下が罠の企図された帰結であることを「こうして」で明示した。脚注aは「発言をとらえ」に、脚注bは節末の統治権・権限の句にそれぞれ対応する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:20:55Z'
