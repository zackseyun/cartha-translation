id: LUK.20.20
reference: Luke 20:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: ja
  text: 彼らはイエスの様子をうかがい、正しい人のふりをする密偵を送り込んだ。イエスの発言をとらえ[a]、こうして彼を総督の統治権と権限のもとに引き渡すためであった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼のことばを捕らえる」。発言を口実にして彼を陥れることを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「総督の統治権と権威に引き渡す」とも訳せる。「統治権」と「権限」という二つの語は、総督の公的な管轄と権力を強調していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: 様子をうかがい
  rationale: 敵意ある監視の含みを自然な現代日本語で表した。目的語「イエス」は文脈から補った。
- source_word: ἐγκαθέτους
  choice: 間者として
  rationale: ひそかに送り込まれ、陥れる機会を狙う者を指すため、「スパイ」よりも本文の格調になじむ「間者」とした。
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: 正しい人を装う者たち
  rationale: 偽りの自己呈示を「装う」で示し、δίκαιοςの道徳的・宗教的含意を「正しい人」に保った。
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: イエスのことばじりを捕らえ
  rationale: 発言を材料に陥れるという慣用的意味を明瞭に表しつつ、「捕らえる」に原文の比喩を残した。
- source_word: ὥστε παραδοῦναι
  choice: 引き渡すため
  rationale: ὥστεが示す企図された帰結を、前の目的節と連なる自然な日本語で表現した。
- source_word: τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος
  choice: 総督の支配と権限のもとに
  rationale: ἀρχήとἐξουσίαをそれぞれ「支配」「権限」と訳し、総督の公的な統治権と司法的権能を強調する対語を保持した。
- source_word: τοῦ ἡγεμόνος
  choice: 総督
  rationale: ローマ属州の統治官を指す文脈に即し、分かりやすく定着した訳語を採った。
theological_decisions:
- issue: 偽装されたδίκαιοςの道徳的・宗教的意味
  choice: 正しい人
  alternative: 義人／公正な人
  rationale: 「義人」ほど専門的な響きを持たせず、単なる法的公正にも限定せず、神と人の前で正しく見える者という含みを保った。
- issue: ἀρχήとἐξουσίαの関係
  choice: 支配と権限
  alternative: 統治権と権威／当局と権力
  rationale: 二語を一つにまとめず、公的な統治領域と行使権限という重なり合う意味を並置した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「間者」はやや文語的だが、秘密裏に配置された敵対者というἐγκαθέτουςの意味を簡潔に示す。脚注記号は該当句と節末に配置した。
