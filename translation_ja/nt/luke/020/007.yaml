  text: καὶ ἀπεκρίθησαν μὴ εἰδέναι πόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/007.yaml
  text: So they answered that they did not know where it was from[a].
translation:
  language: ja
  text: そこで彼らは、「どこからのものかは分からない」と答えた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どこから」。ギリシア語は起源または出所を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そこで
  rationale: 単なる接続の「そして」よりも、直前の相談を受けた結果としての応答という物語の流れを、自然な現代日本語で表す。
- source_word: ἀπεκρίθησαν
  choice: 彼らは…と答えた
  rationale: ἀποκρίνομαι のアオリストとして、叙述に適した簡潔な「答えた」と訳す。
- source_word: μὴ εἰδέναι
  choice: 分からない
  rationale: 応答内容を示す不定詞による間接話法を、日本語では引用の形にして自然に表す。「知らない」も可能だが、由来について判断できないとの発言には「分からない」が自然である。
- source_word: πόθεν
  choice: どこからのものか
  rationale: 起源・出所を問う語であり、文脈上はヨハネの洗礼を指す。指示対象を本文で補いすぎず、原文の簡潔さと起源の意味を保つ。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準語。原文ではヨハネの洗礼を指す目的語が明示されていないため、「それ」や「ヨハネの洗礼」を補わず、「もの」で最小限に受けた。
