  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: ja
  text: しかし、イエスは彼らに答えて言われた。「わたしもあなたがたに一つ尋ねよう[a]。わたしに答えなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「わたしもあなたがたに一つの事柄（または、言葉）を尋ねよう」。ここで「一つ」と訳したギリシア語はλόγονで、文脈上は尋ねる内容、すなわち「問い」を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: すると、イエスは彼らに答えた
  rationale: 分詞と主動詞を重ねるギリシア語の応答表現を、現代日本語では自然な一つの述語にまとめた。δέは場面の推移と応答を示す「すると」で表し、文脈上の話者を明確にするため「イエス」を補った。
- source_word: Ἐρωτήσω ὑμᾶς κἀγὼ
  choice: わたしもあなたがたに一つ尋ねよう
  rationale: κἀγώ（καὶ ἐγώ）の応酬的な強調を「わたしも」で保ち、未来形Ἐρωτήσωは反対質問を持ちかける意志を示す「尋ねよう」とした。複数のὑμᾶςは「あなたがた」と明示した。
- source_word: λόγον
  choice: 一つ
  rationale: λόγοςの基本義は「言葉」「事柄」だが、ἐρωτάωとともに用いられ、ここでは尋ねる内容、すなわち問いを指す。「一つ尋ねる」とすることで、日本語として自然にその機能を表した。
- source_word: καὶ εἴπατέ μοι
  choice: 答えなさい
  rationale: 直訳は「そして、わたしに言いなさい」だが、先行する問いかけへの返答を求める命令なので「答えなさい」が自然である。命令形の直接性も保った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの反対質問が持つ落ち着いた権威と直接性を保った。「尋ねよう」「答えなさい」により、口語的すぎず、現代の一般読者にも理解しやすい格調とした。
