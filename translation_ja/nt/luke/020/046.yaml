source:
  edition: SBLGNT
  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: ja
  text: 律法学者たちに気をつけなさい。彼らは、長い衣服[a]をまとって歩き回りたがり、市場であいさつを受けること、会堂で上席に座ること、宴会で上座に着くことを好みます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「長い衣服」は、身分や威信を人目につく形で示す格式ある衣服を指します。
    reason: cultural_note
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: 〜に気をつけなさい
  rationale: προσέχω ἀπό の警告表現を、現代日本語で自然かつ十分に強い命令として表した。
- source_word: γραμματέων
  choice: 律法学者たち
  rationale: 福音書の社会的・宗教的文脈における書記・律法専門家を、一般読者に分かりやすく示す定着した訳語。
- source_word: τῶν θελόντων περιπατεῖν ἐν στολαῖς
  choice: 長い衣をまとって歩き回ることを好み
  rationale: θέλω の意欲・好みと、στολή が示す丈の長い格式ある衣服、また人目につく場を歩く含意を、過度に動機づけせず表した。
- source_word: φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
  choice: 広場で挨拶されること…を好み
  rationale: ここで好まれているのは公の場で敬意を示す挨拶を受けることだという文脈上の意味を、日本語の受け身で明瞭にした。ἀγορά は社交の場でもある公共広場として訳した。
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: 会堂では上席に…着くこと
  rationale: πρωτοκαθεδρία は単なる前方の席ではなく名誉ある主要席を指すため、「上席」とした。
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: 宴会では上座に着くこと
  rationale: 食事の席における最も名誉ある場所を、現代日本語で機能的に対応する「上座」で表した。
theological_decisions:
- issue: 律法学者たちへの社会的・宗教的批判の範囲
  choice: 本文どおり「律法学者たち」を警戒の対象とし、続く行動によってその批判内容を限定して示す。
  alternative: すべての律法学者を例外なく全面的に断罪する表現にする。
  rationale: 定冠詞付きの集団名とそれを特徴づける分詞句を保ちつつ、本文が挙げていない教義的・人格的非難を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「会堂」「上席」「上座」は宗教的・社会的背景を簡潔に伝える。原文の一文構造は、日本語で読みやすい二文に整えた。
