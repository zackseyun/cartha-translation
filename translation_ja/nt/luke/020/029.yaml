  text: ἑπτὰ οὖν ἀδελφοὶ ἦσαν· καὶ ὁ πρῶτος λαβὼν γυναῖκα ἀπέθανεν ἄτεκνος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/029.yaml
  text: There were seven brothers; and the first[a], having taken a wife, died childless.
translation:
  language: ja
  text: さて、七人の兄弟がいました。一番目の兄弟[a]は妻を迎え、子のないまま死にました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「第一の者」。年齢上の長男を指すとは限りません。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἑπτὰ οὖν ἀδελφοὶ ἦσαν
  choice: さて、七人の兄弟がいました
  rationale: οὖνの談話を進める働きを「さて」で自然に示しつつ、七人が男性の兄弟であることを明確にした。
- source_word: ὁ πρῶτος
  choice: 最初の者
  rationale: 兄弟のうち順番上の第一の者を指す。原文だけでは年齢上の長男と断定できないため、「長男」とはしなかった。
- source_word: λαβὼν γυναῖκα
  choice: 妻を迎えましたが
  rationale: 直訳は「妻を取って」だが、結婚を表す慣用表現なので、現代日本語で自然かつ品位のある「妻を迎える」とした。分詞と主動詞の関係は文脈に即して接続した。
- source_word: ἀπέθανεν ἄτεκνος
  choice: 子のないまま死にました
  rationale: 子を持たずに死んだという法的・物語的に重要な点を、簡潔で自然な日本語で表した。
theological_decisions:
- issue: ὁ πρῶτοςが出生順の長男を意味するか
  choice: 本文では「最初の者」とし、順序だけを示す
  alternative: 長男
  rationale: 復活をめぐる仮定の中で最初に結婚した兄弟を指すが、語そのものは年齢上の最年長者と明示していないため、その含みを保存した。
translation_notes:
  register: 明快な現代標準日本語。物語上の仮定を落ち着いた口調で示し、「妻を取る」のような不自然または古風に響く直訳は避けた。
