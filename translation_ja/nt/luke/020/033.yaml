  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ἡ γυνὴ οὖν ἐν τῇ⸃ ἀναστάσει τίνος αὐτῶν γίνεται γυνή; οἱ γὰρ ἑπτὰ ἔσχον αὐτὴν γυναῖκα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: ja
  text: では、復活の時には[a]、この女性は彼らのうちだれの妻になるのでしょうか[b]。その七人は彼女を妻としていたのです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「復活において」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼女は彼らのうちだれの妻なのでしょうか」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「その七人が彼女を妻として持っていた」。別訳「その七人は彼女と結婚した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: この女
  rationale: 既出のレビラト婚の事例に登場する特定の女性を指す。ここでは「妻」よりも、人物を指す「この女」が自然であり、後の述語「妻」との区別も保てる。
- source_word: οὖν
  choice: では
  rationale: サドカイ派の議論を受けて結論的な問いへ進む推論・再開の働きを、現代日本語で自然に示す。
- source_word: ἐν τῇ ἀναστάσει
  choice: 復活の時
  rationale: 復活という出来事・時点において、という意味を自然な日本語で表す。「復活において」も可能だが、やや硬い。
- source_word: τίνος αὐτῶν
  choice: 彼らのうちだれの
  rationale: 属格の疑問詞が示す関係を、「だれの妻」という日本語の自然な構文で保持する。
- source_word: γίνεται
  choice: なる
  rationale: 単に「である」とせず、復活時にどのような身分・関係になるのかを問う γίνομαι の変化・成立の含みを保つ。
- source_word: γυνή
  choice: 妻
  rationale: 述語位置では婚姻関係を明示しているため、「妻」と訳す。
- source_word: οἱ γὰρ ἑπτὰ
  choice: 七人とも
  rationale: 直訳は「その七人」だが、既出の七兄弟全員が彼女を妻としたという論拠を、日本語で簡潔かつ明瞭に示す。「とも」は明示的な πᾶς の訳ではなく、定冠詞付きの七人全体を指す文脈的総括である。
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: 彼女を妻としていた
  rationale: ἔχω＋対格＋γυναῖκα の関係・状態を、「結婚した」という行為よりも忠実に表す。
theological_decisions:
- issue: サドカイ派の問いにおける復活の意味
  choice: 「復活」とのみ訳し、説明を加えない
  alternative: 「死者の復活」と補う
  rationale: 本文には ἀνάστασις のみがあり、文脈上理解できても「死者の」を本文に補わないことで、原文の簡潔さと問いの枠組みを保つ。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準語。「この女」は文脈上の既出人物を明確に指し、口語的に崩れすぎない。「妻としていた」により原文の婚姻関係の状態性を保持した。
