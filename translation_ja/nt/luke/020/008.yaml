  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: ja
  text: そこでイエスは彼らに言われた。「わたしも、何の権威によってこれらのことをしているのか、あなたがたには言わない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: そこでイエスは彼らに言われた
  rationale: καίを直訳的な「そして」ではなく、直前の応答を受ける自然な接続「そこで」で表した。εἶπεν αὐτοῖςは、現代日本語の聖書文体として自然な「彼らに言われた」とした。
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: わたしも…あなたがたには言わない
  rationale: οὐδέは、直前に指導者たちが答えなかったことへの対応を示すため、「わたしも…言わない」とした。λέγωは答えの内容を知らせる意なので、日本語では「言わない」が自然である。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 何の権威によって
  rationale: 行為の根拠または資格を問う句として「何の権威によって」と訳した。単なる力ではなく、正当な権限という含意を保つ。
- source_word: ταῦτα
  choice: これらのこと
  rationale: ギリシア語の複数形を保ち、問題とされているイエスの一連の行為を指す表現とした。
- source_word: ποιῶ
  choice: している
  rationale: 現在形が示す継続中の活動を、文脈に自然な日本語「している」で表した。
theological_decisions:
- issue: イエスが指導者たちへの回答を拒むこと
  choice: 権威の出所を彼らには告げないという直接的な拒否として訳す
  alternative: 質問をはぐらかした、または彼らの不信仰を裁いたと明示する
  rationale: 本文は回答しないことだけを述べ、その理由を明示していないため、評価や教理的説明を訳文に加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、発話の威厳を保った。「わたし」「あなたがた」は福音書の対話として自然で、相手との対照も明確にする。原文上ここに必要な異読・訳語注はないため、脚注は付さない。
