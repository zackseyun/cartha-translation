id: LUK.20.44
reference: Luke 20:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Δαυὶδ οὖν ⸂αὐτὸν κύριον⸃ καλεῖ, καὶ πῶς ⸂αὐτοῦ υἱός⸃ ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/044.yaml
  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: ja
  text: それでは、ダビデがその方を「主」と呼んでいるのに、どうしてその方がダビデの子[a]なのでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「子孫」。ギリシア語は直訳すると「子」だが、王統に連なる子孫を指すこともある。本文では、この問いの明示的な表現を保った。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: ダビデ
  rationale: 日本語聖書で定着している固有名詞表記を用いた。
- source_word: οὖν
  choice: それでは
  rationale: 直前の引用から導かれる推論を示しつつ、修辞疑問へ自然につなげる。
- source_word: αὐτὸν κύριον
  choice: その方を「主」と
  rationale: αὐτόνの指示対象を自然な日本語で「その方」とし、κύριονはメシアをめぐる議論の重みを保つ「主」とした。
- source_word: καλεῖ
  choice: 呼んでいる
  rationale: 現在形の継続的・引用上の効力を、自然な日本語の「呼んでいる」で表した。
- source_word: πῶς
  choice: どうして
  rationale: 両方の呼称がどう両立するのかを問う修辞疑問として自然である。
- source_word: αὐτοῦ υἱός
  choice: ダビデの子
  rationale: 日本語では代名詞の連続による曖昧さを避けて所有者を明示し、υἱόςの明示的な語を「子」として保持した。王統上の「子孫」という含みは脚注に示した。
- source_word: ἐστιν
  choice: なのでしょうか
  rationale: 存在・同定を表す現在形を、文脈に即した丁寧な修辞疑問として訳した。
theological_decisions:
- issue: メシア論的議論における κύριος の訳語
  choice: 主
  alternative: 主人
  rationale: ダビデがメシアを自分より上位の称号で呼ぶという議論の語義と神学的重みを保ちつつ、本文以上の説明を加えない。
- issue: υἱός を王統上の「子孫」と展開するか
  choice: 子
  alternative: 子孫
  rationale: ギリシア語の明示的な親族名称と、イエスの問いが持つ緊張を本文にそのまま残した。「子孫」という可能な意味は脚注で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語とし、修辞疑問の品位を保った。「彼」の反復を避けて「その方」を用い、所有者は「ダビデ」と明示した。脚注記号は内容上対応する「子」の直後に置いた。
