  text: ὁ δὲ εἶπεν ⸂πρὸς αὐτούς· Τοίνυν ἀπόδοτε⸃ τὰ Καίσαρος Καίσαρι καὶ τὰ τοῦ θεοῦ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「それなら、カイザルのものはカイザルに、神のものは神に返しなさい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「返しなさい」と訳した語には、当然与えるべきものを「与える」「納める」という意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: しかし、イエスは彼らに言われた
  rationale: δέの軽い対照を「しかし」で表し、日本語では主語が明確になるよう文脈上の話者イエスを補った。「言われた」は聖書本文にふさわしい自然で敬意ある表現。
- source_word: Τοίνυν
  choice: それなら
  rationale: 直前のやり取りを受けた推論・帰結を、現代日本語で自然に示す。硬い「したがって」や口語的すぎる「では」より、この応答の論理を明瞭に保つ。
- source_word: ἀπόδοτε
  choice: 返しなさい
  rationale: ἀποδίδωμιが持つ、属するもの・当然与えるべきものを渡す、または返すという含みを簡潔に表す。「納めなさい」では税だけに狭めるおそれがある。
- source_word: τὰ Καίσαρος Καίσαρι
  choice: 皇帝のものは皇帝に
  rationale: Καῖσαρはここではローマ皇帝を指す称号として、普通の日本語読者に明瞭な「皇帝」とした。τὰの広い範囲を「もの」で保ち、税に限定しない。
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: 神のものは神に
  rationale: 前半との簡潔な並行構造を保ち、神に属するものの範囲を訳文で限定しない。
theological_decisions:
- issue: 皇帝と神に対する義務の範囲
  choice: 「皇帝のものは皇帝に、神のものは神に」と並行関係をそのまま保つ
  alternative: 政教分離、国家権力への無制限な服従、または納税だけを明示する
  rationale: ギリシア語は各々に属するものを返す原則を述べるが、両者の領域や限界を詳しく定義していない。後代の政治神学を持ち込まず、本文の広がりと緊張を保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。命令形は「返せ」ではなく「返しなさい」とし、強さを保ちながら過度に荒い響きを避けた。脚注記号は該当する発言全体の直後に置いた。
