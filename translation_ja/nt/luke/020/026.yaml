  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: ja
  text: 彼らは、民衆の前でイエスのことばじりを捕らえることができず[a]、その答えに驚いて黙り込んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「その発言を捕らえることができず」。
    reason: ἐπιλαβέσθαι τοῦ ῥήματοςの比喩的表現と、日本語本文の慣用的表現との対応を示すため。
lexical_decisions:
- source_word: οὐκ ἴσχυσαν
  choice: できず
  rationale: 能力・可能性の否定を、簡潔で自然な現代日本語で表した。
- source_word: ἐπιλαβέσθαι τοῦ ῥήματος
  choice: ことばじりを捕らえる
  rationale: 発言を手がかりに相手を陥れようとする文脈を示しつつ、原文の「捕らえる」という比喩を保った。
- source_word: ἐναντίον τοῦ λαοῦ
  choice: 民衆の前で
  rationale: ἐναντίονの「面前で」と、ルカにおけるλαόςの公の民衆という意味を自然に表した。
- source_word: θαυμάσαντες ἐπὶ τῇ ἀποκρίσει αὐτοῦ
  choice: その答えに驚いて
  rationale: 分詞が示す反応と、その理由となったイエスの答えを明瞭に表した。
- source_word: ἐσίγησαν
  choice: 黙り込んだ
  rationale: 単なる沈黙の状態ではなく、その場で沈黙に至った動きを自然な日本語で表した。
