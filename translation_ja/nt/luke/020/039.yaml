base_translation:
  language: en
  yaml_path: translation/nt/luke/020/039.yaml
  text: Then some of the scribes answered[a], “Teacher, you have spoken well.”
translation:
  language: ja
  text: すると、律法学者たちのうちの何人かが答えた。「先生、よくおっしゃいました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: 答えた
  rationale: アオリスト分詞だが、日本語では主動詞として表すのが自然であり、先行するイエスの発言への応答であることも明確になる。
- source_word: δέ
  choice: すると
  rationale: 弱い談話上の移行を示す。強い対比を持ち込まず、直前の議論に続く反応として自然に示す。
- source_word: τινες τῶν γραμματέων
  choice: 律法学者たちのうちの何人か
  rationale: τινεςと属格による部分表現を明示し、律法学者全員ではなく、その一部が応答したことを保つ。
- source_word: γραμματέων
  choice: 律法学者たち
  rationale: 福音書の文脈におけるγραμματεῖςの役割を、現代日本語の読者に分かりやすく伝える定着した訳語。単なる筆記者という誤解を避ける。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼格διδάσκαλοςの自然な現代日本語。敬意を伴う呼びかけとして簡潔で分かりやすい。
- source_word: καλῶς
  choice: よく
  rationale: 発言の質または正しさを称賛する幅を保ち、「正しく」と限定しすぎない自然な表現。
- source_word: εἶπας
  choice: おっしゃいました
  rationale: アオリストを自然な過去の発言として表し、呼びかけの「先生」に合う敬意を示す。
theological_decisions: []
