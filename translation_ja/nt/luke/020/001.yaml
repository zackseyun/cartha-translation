id: LUK.20.1
reference: Luke 20:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: ja
  text: ある日のこと、イエスが神殿[b]で民を教え、福音を告げ知らせていると[a]、祭司長たちと律法学者たちが、長老たちとともに近づいて来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「福音を宣べ伝えていると」または「良い知らせを告げていると」。
    reason: lexical_alternative
  - marker: b
    text: ここで「神殿」と訳したギリシア語は、聖所の建物内部だけでなく、境内を含む神殿域全体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: ある日のこと
  rationale: ルカに特徴的な物語の移行表現と、特定されていない一日という意味を、古風にならない自然な日本語で表した。
- source_word: διδάσκοντος αὐτοῦ
  choice: イエスが…教え…ていると
  rationale: 属格独立構文が示す同時進行の状況を、後続する出来事へ自然につながる形で訳した。文脈上の主語を明確にするため「イエス」を補った。
- source_word: τὸν λαὸν
  choice: 民
  rationale: 単なるその場の群衆ではなく、広く民を指す λαός の意味を保った。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόν を簡潔で一般的な日本語にした。ここでは聖所内部に限らず神殿境内全体を指し得るため、注で明示した。
- source_word: εὐαγγελιζομένου
  choice: 福音を告げ知らせている
  rationale: 「良い知らせを告げる」という動詞の力を保ちつつ、現代日本語の聖書文体として理解しやすい表現を選んだ。
- source_word: ἐπέστησαν
  choice: 近づいて来た
  rationale: 彼らがイエスのもとへ直接やって来た動きを表しつつ、「詰め寄った」のように敵意を過度に明示しない訳とした。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数形は複数の大祭司職在任者ではなく、祭司階級の指導者層を指すため、定着した歴史的呼称を用いた。
- source_word: οἱ γραμματεῖς
  choice: 律法学者たち
  rationale: 当時の律法解釈と教育を担った集団であることが普通の読者に伝わる、現代日本語で定着した呼称を選んだ。
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: 長老たちとともに
  rationale: σύν が示す同行・連携を明確に表した。
theological_decisions:
- issue: εὐαγγελιζομένου を物語的文脈でどう表すか
  choice: 福音を告げ知らせている
  alternative: 良い知らせを告げている／福音を宣べ伝えている
  rationale: イエスの公の活動を表す動詞として、その内容が「良い知らせ」であることと宣言する行為の双方を保った。「宣べ伝える」より現代的だが、「福音」という本文全体で重要な語は維持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「ある日のこと」でルカの物語的移行を自然に示し、指導者たちの敵意は文脈に委ねて本文では過度に強めていない。
