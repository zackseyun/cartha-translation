id: LUK.20.2
reference: Luke 20:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: ja
  text: そして彼らはイエスに言った。「私たちに言いなさい。あなたは何の権威によって、これらのことをしているのですか。それとも、あなたにこの権威を与えたのは誰ですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の出来事にこの問いかけを結び付ける単純な接続辞として、時間的意味を加えすぎず自然な物語の流れを保つ。
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: 彼らはイエスに言った
  rationale: 「言った」と「言いながら」が重なるギリシア語の構文を、日本語として自然な発話導入にまとめた。文脈上の指示対象を明確にするため、代名詞は「イエス」とした。
- source_word: Εἰπὸν ἡμῖν
  choice: 私たちに答えなさい
  rationale: 直訳的な「私たちに言いなさい」よりも、問いただす場面での命令の機能を明瞭かつ自然に表す。
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: 何の権威によって
  rationale: ἐνはここで行為の根拠・資格を示す。「どんな権威で」も可能だが、「何の権威によって」は問いの制度的な含意を明確に保つ。
- source_word: ταῦτα ποιεῖς
  choice: これらのことをしている
  rationale: ταῦταの複数性と、目前の一連の行為を指す現在形の継続的な響きを保った。
- source_word: ἢ
  choice: それとも
  rationale: 同じ問いを別の角度から提示する選択的・言い換え的な接続を自然に表す。
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: あなたに…与えたのは誰ですか
  rationale: 冠詞付き分詞ὁ δούςの「与えた者」という実質的意味を、日本語の焦点構文で自然に表した。
- source_word: τὴν ἐξουσίαν ταύτην
  choice: この権威
  rationale: ταύτηνの指示性を保ち、先の権威を受けていることを明示する。ἐξουσίαは単なる能力や力ではなく、行為する資格・権限を表す。
theological_decisions:
- issue: 神殿での対決におけるἐξουσίαの意味
  choice: 権威
  alternative: 力／権利／権限
  rationale: 宗教指導者たちはイエスの能力ではなく、その行為の正当な根拠と授与者を問いただしている。「権威」は制度的・神学的な含みを狭めずに保つ。
- issue: 二つの疑問文の関係
  choice: 「それとも」により、権威の根拠と授与者を問う二つの密接な問いとして保持
  alternative: 第二の問いを第一の説明として一文に統合する
  rationale: ἢの形式を残すことで、権威そのものと、それを与えた者という原文の二重の問いかけを解消せずに示す。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある直接話法。「答えなさい」は対立的な問いただしの調子を示すが、過度に古風または粗暴にはしていない。
