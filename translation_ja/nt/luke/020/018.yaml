id: LUK.20.18
reference: Luke 20:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς ὁ πεσὼν ἐπ’ ἐκεῖνον τὸν λίθον συνθλασθήσεται· ἐφ’ ὃν δ’ ἂν πέσῃ, λικμήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: ja
  text: あの石の上に落ちる者はみな、粉々に砕かれる。[a] しかし、その石がだれかの上に落ちれば、その人を打ち砕く。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ばらばらに砕かれる」。
    reason: lexical_alternative
  - marker: b
    text: 「粉々にして散らす」または「もみ殻のように吹き散らす」とも訳せる。ギリシア語の動詞は、単に衝突する以上の強い意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: 落ちる者はみな
  rationale: 冠詞付き分詞の総称的・実詞的用法を、日本語として自然な形で表し、例外のない範囲を保った。
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: あの石の上に
  rationale: ἐπί＋対格が示す、石の上へ落ちる方向性と、ἐκεῖνονの指示の力を明示した。
- source_word: συνθλασθήσεται
  choice: 粉々に砕かれる
  rationale: 未来受動形が示す、ばらばらに砕かれる深刻な結果を明確に伝える。
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: しかし、その石がだれかの上に落ちれば
  rationale: 関係代名詞、ἄν、接続法による不定条件を自然な現代日本語の条件節で表した。主語の「その石」は文脈から補い、指示対象を明瞭にした。
- source_word: λικμήσει
  choice: 打ち砕く
  rationale: 粉砕して散らすほどの強い破壊を表す語であり、本文では簡潔で理解しやすい「打ち砕く」とした。さらに強い含意は脚注に残した。
- source_word: αὐτόν
  choice: その人を
  rationale: 単数の人物を指す代名詞を、性別を不必要に限定せず、現代日本語として明瞭に表した。
theological_decisions:
- issue: 石による裁きの比喩
  choice: 石を決定的で破壊的な裁きの主体として保つ。
  alternative: 単なるつまずきや軽い負傷を表す穏やかな表現にする。
  rationale: συνθλασθήσεταιとλικμήσειはいずれも強い破壊を示すため、その厳しさを弱めず、同時に節を越える解釈は加えなかった。
- issue: 総称的な男性単数代名詞
  choice: 「その人」と訳す。
  alternative: 「彼」としてギリシア語の男性単数形を形式的に再現する。
  rationale: αὐτόνは文法上男性単数だが、先行対象は不特定の「だれか」であり、ここでの男性形は総称的である。日本語の「その人」は単数性と人物指示を保ちつつ、原文にない性別の限定を避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あの石」で直前の引用にある石を指し、「しかし」で二つの対照的な落下像を結んだ。両動詞の激しい裁きの響きを保ちつつ、本文は朗読しやすい語順とした。
