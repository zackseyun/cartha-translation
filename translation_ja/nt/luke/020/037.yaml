  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: ja
  text: しかし、死者がよみがえらされることは、モーセも柴についての箇所[a]で明らかにしました。彼は主[b]を「アブラハムの神、イサクの神、ヤコブの神」と呼んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「柴のところで」とも訳せる。このギリシア語表現は、燃える柴の場面そのもの、または慣用的にそのことを記した聖書箇所（出エジプト記3章）を指し得る。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「主」。これは、出エジプト記3章で神の名を通常「主」と訳す七十人訳の慣例を反映している。
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: よみがえらされる
  rationale: 現在受動形を保ち、死者の復活が暗に神の働きであることを示す。日本語としても復活の文脈が明瞭である。
- source_word: οἱ νεκροὶ
  choice: 死者
  rationale: 実質的に名詞として用いられた複数形容詞の集合的意味を、簡潔で自然な日本語で表す。
- source_word: ἐμήνυσεν
  choice: 明らかにしました
  rationale: 「知らせる、示す」という意味を表し、モーセの記述が復活の根拠を示すという文脈上の力を保つ。
- source_word: ἐπὶ τῆς βάτου
  choice: 柴の箇所で
  rationale: 燃える柴そのものの場面と、それを記した聖書箇所の双方を想起させる表現とした。曖昧さは脚注で明示する。
- source_word: ὡς λέγει
  choice: 彼は…と呼んでいます
  rationale: κύριον とそれに続く同格的な神称号を自然に結び、モーセが主をどのように呼んでいるかを表す。
- source_word: κύριον
  choice: 主
  rationale: 神を指す称号として、現代日本語の聖書文体で定着した訳語を用いる。
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: アブラハムの神、イサクの神、ヤコブの神
  rationale: θεόν の三度の反復を保ち、出エジプト記の引用が持つ強調とリズムを再現する。
theological_decisions:
- issue: サドカイ派への議論における復活の表現
  choice: 死者がよみがえらされる
  alternative: 死者がよみがえる
  rationale: 受動形を反映して、復活を起こす主体が暗に神であることを保ちつつ、本文が明示していない説明は加えない。
- issue: イスラエルの神についての引用における κύριος の訳
  choice: 主
  alternative: 主なる神／ヤハウェ
  rationale: ギリシア語本文の κύριος をそのまま称号として訳し、背後にある神名との関係は本文に持ち込まず脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、引用部では「アブラハムの神、イサクの神、ヤコブの神」という反復を残して荘重さを保った。「柴の箇所」は一般読者にも文学的参照だと伝わる表現とし、原文に残る場所／聖書箇所の曖昧さを脚注で保持した。
