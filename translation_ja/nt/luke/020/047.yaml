  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: ja
  text: やもめたちの家を食い尽くし、見せかけのために[a]長々と祈る者たちです。このような者たちは、いっそう重い裁き[b]を受けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「口実として」または「見せかけとして」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「いっそう厳しい断罪」または「いっそう厳しい刑罰」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: 食い尽くし
  rationale: 文字どおりの食事ではなく、やもめの財産や生活基盤を貪欲に奪うことを表す比喩。原語の生々しく厳しい非難を保つ。
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: やもめたちの家
  rationale: οἰκίαςの基本義である「家」を保持する。文脈上は家屋だけでなく家産や暮らし全体を指し得るが、本文ではその含みを限定しない。
- source_word: προφάσει
  choice: 見せかけで
  rationale: 長い祈りが真実な信仰からではなく、偽りの外観として行われることを自然な現代日本語で表す。「口実として」という可能性は脚注に残す。
- source_word: μακρὰ προσεύχονται
  choice: 長々と祈る
  rationale: μακράの副詞的用法を、祈りの長さを示す自然な日本語で表現する。
- source_word: λήμψονται
  choice: 受けます
  rationale: 将来の裁きの結果として受けることを、厳粛かつ平明に表す。
- source_word: περισσότερον κρίμα
  choice: いっそう重い裁き
  rationale: 比較の意味を「いっそう重い」で示し、κρίμαは意味の幅を保つため「裁き」とする。文脈上、それが不利な神の裁きであることは明白だが、「断罪」と限定しすぎない。
theological_decisions:
- issue: κρίμαが指す裁きの性質
  choice: 裁き
  alternative: 断罪／より厳しい刑罰
  rationale: 宗教指導者への非難という文脈から不利な神の裁きであることは明らかだが、原語の語義の広がりと表現上の緊張を保つため、「断罪」と狭く確定しない。
- issue: 「やもめたちの家」の範囲
  choice: 家
  alternative: 財産／家産
  rationale: 搾取の対象として財産を含む可能性は高いが、原文の換喩を解きほぐさず、「家」という具体的で強い表現を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳しい非難を弱めない。「食い尽くす」で比喩の力を保ち、「長々と」は自然で理解しやすい表現とした。文頭は前節から続く関係節であるため、「者たちです」で自然につないだ。
