source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: ja
  text: そして、彼をぶどう園の外に放り出して、殺した。では、ぶどう園の主人[a]は彼らをどうするだろうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ぶどう園の所有者」。ギリシア語はキュリオスで、称号としては「主」と訳されることが多いが、ここではたとえ話の中でぶどう園を所有する人物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: 放り出して
  rationale: アオリスト分詞が主動詞に先立つ行為を示している。「放り出して」は、単なる移動ではなく強制的に外へ追い出す語感を、明瞭で自然な現代日本語で表す。
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: ぶどう園の外に
  rationale: 内側から外側への移動先を表す句として、日本語では「ぶどう園の外に」が自然である。
- source_word: ἀπέκτειναν
  choice: 殺した
  rationale: 動詞の基本的意味を直接表す。「殺害した」より平明であり、「処刑した」のような制度的含意や、「殺してしまった」のような付加的ニュアンスを持ち込まない。
- source_word: τί οὖν
  choice: では、…どうするだろうか
  rationale: οὖνの推論・展開の働きを「では」で示し、問いとして自然な現代日本語にした。
- source_word: ποιήσει αὐτοῖς
  choice: 彼らをどうするだろうか
  rationale: ποιέωの広い意味と、文脈上のαὐτοῖςに向けられる行為を、日本語の慣用的な問い「彼らをどうする」で表した。
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: ぶどう園の主人
  rationale: κύριοςはここではたとえ話の中のぶどう園の所有者・管理権者を指す。「主人」はその関係を自然に表し、神への称号としての「主」と誤解されにくい。語義上可能な「所有者」は脚注に示す。
theological_decisions:
- issue: たとえ話の中の非神的指示対象に対するκύριοςの訳語
  choice: 主人
  alternative: 所有者、主
  rationale: 文脈上はぶどう園を所有し支配する人間を指すため、称号的な「主」ではなく「主人」とした。これにより、たとえの神学的含意を否定せず、物語の表現そのものに直接的な神称号を読み込むことも避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「放り出して」により原文の強い排除の動きを保ち、後半は「では」で推論的な問いへの転換を自然に示した。
