  source_fidelity: 主語を「彼女たち」と明示することは前節から自然に補える。μνημεῖονを「墓」とするのも適切である。ただし「石が転がして取りのけられている」は日本語として統語的に不自然で、「転がして」は石自身が動作を行うようにも読める。ἀποκεκυλισμένονの完了受動が表す、石が転がされて墓から離れた結果状態を、自然な受動表現で示す必要がある。
  naturalness: 「すると」は文脈によっては直後の意外な結果を導く語感が強く、軽い物語接続のδέには「そして」がより中立的である。また、語順を整えて「石が墓から転がされていた」とすれば、現代標準日本語として明瞭である。
  terminology: 「墓」はこの文脈のμνημεῖονに適切である。「石」も定着した自然な訳語である。行為者は原文で示されないため、受動表現により特定しない。
  issues:
