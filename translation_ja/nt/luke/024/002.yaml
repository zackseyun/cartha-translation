    issue: 「転がして取りのけられている」が不自然で、受動関係が不明瞭である。
    rationale: ἀποκεκυλισμένονは完了受動分詞である。「転がして」は他動詞の連用形であり、主語の「石」との関係が不自然になる。石が転がされた結果、墓から離れているという状態を明瞭に表す必要がある。
  - severity: low
    issue: 「すると」はδέの軽い接続としてやや限定的である。
    rationale: 「すると」には前件から結果が生じる、または意外な展開という含みが出やすい。ここでは叙述を先へ進める中立的な「そして」が適切である。
