  text: そして彼女たちは、石が墓から転がされていたのを見つけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὗρον
  choice: 見つけた
  rationale: アオリスト能動直説法三人称複数。主語は前節から続く女性たちであり、日本語では文脈上省略も可能だが、ここでは節の理解を明確にするため「彼女たちは」と示した。「見つけた」は、到着時にその状態を認めたという意味を自然に表す。
- source_word: δὲ
  choice: すると
  rationale: 強い逆接ではなく物語を先へ進める軽い接続辞である。前節の到着に続いて目にした事態を示すため、現代日本語の物語文として自然な「すると」とした。
- source_word: τὸν λίθον
  choice: 石
  rationale: 埋葬された墓の入口をふさいでいた特定の石を指す。日本語では文脈によって特定性が明らかなため、冠詞に相当する語を加えず「石」とする。
- source_word: ἀποκεκυλισμένον
  choice: 転がして取りのけられている
  rationale: 完了受動分詞で、石が転がされて移され、その状態にあることを表す。「転がして取りのけられている」は動作の態様、受動性、結果状態を保つ。
- source_word: ἀπὸ τοῦ μνημείου
  choice: 墓から
  rationale: μνημεῖονは福音書の埋葬記事では「墓」が自然である。ἀπόは石が墓から離されたことを示すため「墓から」と訳す。
theological_decisions:
- issue: ギリシア語の節に主語が明記されていないこと
  choice: 彼女たちは
  alternative: 主語を省略する
  rationale: 三人称複数の動詞の主語は前節の女性たちである。日本語では省略できるが、この一節単独でも参照関係が分かるよう明示した。新たな神学的内容は加えていない。
- issue: 石を動かした行為者が示されていないこと
  choice: 転がして取りのけられている
  alternative: 転がして取りのけてある
  rationale: 原文は受動形で行為者を明示しないため、日本語でも行為者を特定しない受動表現を用い、神的受動などと断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語として自然でありながら、完了受動分詞が示す結果状態と行為者の非明示を保った。
