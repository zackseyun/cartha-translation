id: LUK.24.17
reference: Luke 24:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Τίνες οἱ λόγοι οὗτοι οὓς ἀντιβάλλετε πρὸς ἀλλήλους περιπατοῦντες; καὶ ⸀ἐστάθησαν σκυθρωποί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/017.yaml
  text: And he said to them[a], “What are these words that you are exchanging with one another as you walk?” And they stood still[b], looking sad.
translation:
  language: ja
  text: イエスは二人に言った。「歩きながら互いに交わしているその話[a]は、何のことですか。」二人は悲しそうな顔で立ち止まった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「これらの言葉」。ここでは、二人が話し合っていた事柄を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「二人は沈んだ顔をして立ち止まった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς αὐτούς
  choice: イエスは二人に言った
  rationale: λέγωの基本義を「言った」で保ち、文脈上の話者と聞き手を明示して自然な日本語にした。δέは物語を穏やかに進める接続辞なので、独立した訳語を置かなかった。
- source_word: Τίνες οἱ λόγοι οὗτοι
  choice: その話は、何のことですか
  rationale: λόγοιは字義的には「言葉」だが、ここでは二人が交わしている会話・話題を指す。「その話」とすることで指示性を保ちつつ、現代日本語として自然にした。
- source_word: ἀντιβάλλετε πρὸς ἀλλήλους
  choice: 互いに交わしている
  rationale: ἀντιβάλλωが表す、言葉を相互にやり取りする意味を保った。「議論している」では対立の含みを強めすぎるため避けた。
- source_word: περιπατοῦντες
  choice: 歩きながら
  rationale: 分詞が主動詞と同時進行の動作を示すことを、自然な時間表現で表した。
- source_word: ἐστάθησαν
  choice: 立ち止まった
  rationale: この文脈では、歩いていた二人が停止したことを表す。「立っていた」よりも出来事の推移が明確である。
- source_word: σκυθρωποί
  choice: 悲しそうな顔で
  rationale: σκυθρωπόςが悲しみや沈んだ気持ちの表情への現れを表すことを、自然な日本語で明示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会話は丁寧だが過度に改まらない調子とした。原文の相互的な会話、歩行中の動作、悲しみが顔に表れている様子を保った。
