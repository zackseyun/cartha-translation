source:
  edition: SBLGNT
  text: ἐμφόβων δὲ γενομένων αὐτῶν καὶ κλινουσῶν ⸂τὰ πρόσωπα⸃ εἰς τὴν γῆν εἶπαν πρὸς αὐτάς· Τί ζητεῖτε τὸν ζῶντα μετὰ τῶν νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/005.yaml
  text: And when they became terrified and bowed their faces to the ground[a], they said to them, “Why are you seeking the living one among the dead?”
translation:
  language: ja
  text: 女たちが恐れおののき、顔を地面に伏せていると、二人は女たちに言った。「なぜ、生きている方を死者たちの中に捜すのですか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には、「生きている方を死者たちと共に、何を捜しているのですか」とも訳せる。τίは字義的には「何を」とも取りうるが、文脈では「なぜ」の意味である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμφόβων ... γενομένων
  choice: 恐れおののいて
  rationale: ἔμφοβος の強い恐れと、γενομένων の状態への移行を、自然で重みのある日本語で表す。
- source_word: κλινουσῶν τὰ πρόσωπα εἰς τὴν γῆν
  choice: 顔を地面に伏せていると
  rationale: 顔を地へ傾ける具体的な姿勢と、現在分詞の継続的な情景を保つ。
- source_word: εἶπαν πρὸς αὐτάς
  choice: 二人は言った
  rationale: 主語は直前の24:4に登場する二人を指す。日本語では単に「彼ら」とすると指示が曖昧になるため、文脈上明白な「二人」を補う。目的語の「女たちに」は前半から明らかなので省略し、自然な日本語とした。
- source_word: Τί ζητεῖτε
  choice: なぜ…捜すのですか
  rationale: τί の字義は「何」だが、ここでは捜す行為の不適切さを問う用法であり、「なぜ」が文脈上自然である。ζητεῖτε の現在時制は「捜す」で表した。
- source_word: τὸν ζῶντα
  choice: 生きている方
  rationale: 単数・人格的な実詞用法の分詞を保ちつつ、復活の文脈にふさわしい自然で敬意ある日本語とした。
- source_word: μετὰ τῶν νεκρῶν
  choice: 死人たちの中に
  rationale: μετά＋属格の「共に／間に」の意味を、この対比では「中に」とするのが自然である。νεκρῶν の複数も「死人たち」で明示した。
theological_decisions:
- issue: τὸν ζῶντα が示す復活の含意
  choice: 生きている方
  alternative: 生きている者
  rationale: イエスが死者と対照的に生きていることを示すが、「復活した方」などの説明は加えず、原文の簡潔さと神学的含意を保った。
- issue: τί の疑問の力
  choice: なぜ
  alternative: 何を
  rationale: 字義的な「何を」も可能だが、目的語 τὸν ζῶντα がすでに続くため、問いは捜す理由・不適切さに向けられている。「なぜ」はその語用論的な意味を明確にする。
translation_notes:
  register: 明瞭な現代標準日本語を用い、恐れと畏敬を伴う場面の荘重さを保った。「方」は人格的指示と文脈上の敬意を自然に示す。脚注標識[a]は該当する問いの末尾に置いた。
