  - severity: low
    issue: 「戻って」が原文に明示されていない
    rationale: ἦλθονは「来た」です。墓から帰った文脈はあるものの、この節では「来て」と訳して原文の表現を保つのがよいです。
  - severity: medium
    issue: 報告構文が日本語として重複し、不明瞭である
    rationale: 「見たと言うのです」「告げているというのです」の連続は読みにくく、誰の発言かを追いにくくします。λέγουσαιとοἳ λέγουσινをそれぞれ自然な発話報告として分けます。
  revised_text: そして、その方の遺体を見つけられずに来て、天使たちの幻をも見たと言ったのです。その天使たちは、その方が生きていると言っているのです。[a]
