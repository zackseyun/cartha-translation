  text: καὶ μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ ἦλθον λέγουσαι καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι, οἳ λέγουσιν αὐτὸν ζῆν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/023.yaml
  text: and not finding his body[a], they came saying that they had also seen a vision of angels[b], who say that he is alive.
translation:
  language: ja
  text: そして、その方の遺体を見つけられずに来て、天使たちの幻をも見たと言ったのです。その天使たちは、その方が生きていると言っているのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その天使たちは」に当たる語を、天使たちではなく女たちを指すものと取り、「女たちは、その方が生きていると言っている」と訳すこともできるが、その可能性は低い。
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ εὑροῦσαι τὸ σῶμα αὐτοῦ
  choice: その方の遺体が見つからなかったので
  rationale: 女性たちを受けるアオリスト分詞を理由・状況を示す自然な日本語にした。埋葬と墓の文脈では「遺体」が明瞭であり、αὐτοῦは語り手たちがイエスを指して用いる敬意ある「その方」とした。
- source_word: ἦλθον λέγουσαι
  choice: 戻って来て、…と言うのです
  rationale: ἦλθον自体は「来た」だが、墓から一行のもとへ来た文脈を自然に示すため「戻って来て」とした。λέγουσαιは報告内容を導く形で表した。
- source_word: καὶ ὀπτασίαν ἀγγέλων ἑωρακέναι
  choice: 御使いたちの幻も見た
  rationale: καίは、遺体がなかったことに加えて幻を見たという報告を示すため「も」とした。ὀπτασίαは超自然的な光景を表す「幻」、ἑωρακέναιは間接話法の完了不定詞として「見た」と自然に訳した。
- source_word: οἳ λέγουσιν αὐτὸν ζῆν
  choice: その御使いたちは、その方が生きていると告げている
  rationale: 男性複数の関係代名詞οἳは、最も近い男性複数のἀγγέλωνを受けるのが自然。「告げている」は天使の伝言という文脈と現在形λέγουσινを表し、ζῆνは復活を説明しすぎず「生きている」とした。
theological_decisions:
- issue: οἳ λέγουσινの先行詞
  choice: 「御使いたち」を先行詞とする
  alternative: 女性たちを指し、「女たちは、その方が生きていると言っている」と理解する
  rationale: 文法上、男性複数形οἳは直前の男性複数属格ἀγγέλωνと自然に一致する。ただし、発話構造上は女性たちを意味内容上の主体と取る余地がわずかにあるため、脚注に保存した。
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた語り口。「天使」ではなく聖書本文として品位のある「御使い」を採用し、話者たちがまだイエスを名指ししていないためαὐτόςは「その方」とした。脚注記号[a]は該当する解釈上の節末に置いた。
