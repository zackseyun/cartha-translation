  source_fidelity: 主文の大意と、οἳを天使たちに受ける判断は原文に適合しています。しかし、μὴ εὑροῦσαιを理由を明示する「ので」とするより、分詞の状況を保つ「見つけられずに」とするほうが適切です。また、ἦλθονは原文どおり「来て」とし、文脈から「戻って」を補うことは避けます。
  naturalness: 現行の「戻って来て、…見たと言うのです。その御使いたちは、…告げているというのです」は、「言うのです／というのです」が重なり、間接話法の入れ子が不自然です。報告の内容を「…見たと言ったのです」とし、天使の発言を別文で明快に示します。
