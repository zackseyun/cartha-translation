  text: καὶ παρεβιάσαντο αὐτὸν λέγοντες· Μεῖνον μεθ’ ἡμῶν, ὅτι πρὸς ἑσπέραν ἐστὶν καὶ κέκλικεν ⸀ἤδη ἡ ἡμέρα. καὶ εἰσῆλθεν τοῦ μεῖναι σὺν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/029.yaml
  text: But they urged him strongly[a], saying, “Stay with us[b], because it is toward evening and the day has already declined.” And he went in to stay with them.
translation:
  language: ja
  text: しかし二人は、「私たちと一緒にお泊まりください。もう夕方に近く、日もすでに傾いていますから」と言って、強く願った[a]。そしてイエスは、二人と一緒に泊まるため、中に入られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「強く頼んだ」「強く引き止めた」。直訳に近くは「無理に引き止めた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεβιάσαντο
  choice: 強く引き止めた
  rationale: この文脈では物理的な強制ではなく、相手を行かせまいと熱心に勧めることを表す。強意を保ちつつ、現代日本語として自然にした。
- source_word: Μεῖνον μεθ’ ἡμῶν
  choice: 私たちと一緒にお泊まりください
  rationale: 宿泊を勧める場面なので、単なる「とどまってください」よりも文脈に即した丁寧で自然な依頼表現とした。
- source_word: πρὸς ἑσπέραν ἐστὶν
  choice: もう夕方に近く
  rationale: πρός が示す夕方への接近を保ち、「もう」によって時が進んでいる含みを自然に表した。
- source_word: κέκλικεν ἤδη ἡ ἡμέρα
  choice: 日もすでに傾いています
  rationale: κλίνω の「傾く」という比喩と完了形の結果状態を保ち、日暮れが迫る様子を明瞭に表した。
- source_word: εἰσῆλθεν
  choice: 中に入られた
  rationale: 入った場所は本文で明示されないため「家」と補わず、移動を自然に表した。イエスを主語とする日本語聖書文体に合わせて尊敬表現を用いた。
- source_word: τοῦ μεῖναι σὺν αὐτοῖς
  choice: 二人と一緒に泊まるため
  rationale: 属格付き冠詞的不定詞を目的として訳し、先の宿泊の依頼との語義的なつながりを保った。
