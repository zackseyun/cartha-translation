  text: καὶ ἦσαν διὰ παντὸς ἐν τῷ ἱερῷ ⸀εὐλογοῦντες τὸν ⸀θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/053.yaml
  text: And they were continually in the temple[a], blessing God.
translation:
  language: ja
  text: そして彼らは、いつも神殿にいて、神をほめたたえていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「神を祝福していた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の出来事と結ぶ単純な接続語として、自然な物語の流れを保つ。
- source_word: ἦσαν
  choice: 彼らは…いた
  rationale: 未完了過去の継続的な状態を表し、「いつも」と合わせて持続性を自然に示す。
- source_word: διὰ παντός
  choice: いつも
  rationale: 継続的・常習的であることを表す慣用句。現代日本語で簡潔かつ自然である。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿にいて
  rationale: ἱερόνは内陣だけでなく神殿境内全体を指し得る。「神殿」は文脈上十分に広く理解できる標準的な訳語である。
- source_word: εὐλογοῦντες
  choice: ほめたたえていた
  rationale: 字義は「祝福する」だが、神を目的語とする場合の意味を、普通の現代日本語で自然に表す。原語の字義は脚注に残す。
- source_word: τὸν θεόν
  choice: 神を
  rationale: 動詞εὐλογοῦντεςの直接目的語をそのまま明確に訳す。
theological_decisions:
- issue: 神に向けられるεὐλογοῦντεςの礼拝表現
  choice: 神をほめたたえていた
  alternative: 神を祝福していた
  rationale: 「神を祝福する」は原語の語形に近い一方、現代日本語では神が祝福を受けるという誤解や不自然さを招き得る。「ほめたたえる」はこの文脈での意味を明瞭に伝え、字義的な別訳も脚注で明示する。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。結語としての落ち着いた調子を保ち、「いつも」によって継続的な礼拝を自然に表現した。
