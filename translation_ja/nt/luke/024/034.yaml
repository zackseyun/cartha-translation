review_pass:
  verdict: revise
  source_fidelity: ἠγέρθη is an aorist passive (‘was raised’), while ὤφθη is the conventional resurrection-appearance idiom, appropriately rendered ‘appeared.’ The draft’s 「復活させられ」 attempts to retain the passive but is not an acceptable or natural Japanese expression for resurrection.
  naturalness: 「復活させられ」 is markedly awkward and can suggest an unnecessarily mechanical causative-passive construction. 「よみがえられ」 is a natural, suitably dignified biblical Japanese expression; the note can explicitly preserve the Greek passive observation. 「と言っていた」 appropriately links the participle to the preceding narrative context.
  terminology: 「主」 correctly renders ὁ κύριος in this context, and 「シモン」 correctly avoids adding 「ペトロ」 where the Greek has only Σίμων.
  issues:
  - severity: medium
    issue: 「復活させられ」 is unnatural Japanese.
    rationale: Although intended to reproduce the Greek passive, this causative-passive wording is not idiomatic for resurrection and obscures rather than communicates the source sense. A natural Japanese resurrection expression should be used, with the passive morphology documented in a note.
  revised_text: 「主は確かによみがえられ、シモンに現れた」と言っていた。
  revised_footnotes:
  - marker: a
    text: 直訳的には「起こされた」。ギリシア語は受動形であり、「よみがえった」または「復活した」とも訳せる。
    reason: ギリシア語の復活動詞が受動形であることと、日本語で可能な別訳を示すため。
  revision_rationale: 復活の受動態を日本語の不自然な「復活させられ」で機械的に再現せず、自然で荘重な「よみがえられ」に改めた。脚注では原文の受動形とその直訳可能性を明示し、原文上のニュアンスを保持した。ほかの要素は原文および英語監査記録に忠実である。
