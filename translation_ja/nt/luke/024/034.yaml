revisions:
- from: 「主は確かに復活させられ[a]、シモンに現れた」と言っていた。
  to: 「主は確かによみがえられ、シモンに現れた」と言っていた。
  rationale: 復活の受動態を日本語の不自然な「復活させられ」で機械的に再現せず、自然で荘重な「よみがえられ」に改めた。脚注では原文の受動形とその直訳可能性を明示し、原文上のニュアンスを保持した。ほかの要素は原文および英語監査記録に忠実である。
