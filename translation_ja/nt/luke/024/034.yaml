id: LUK.24.34
reference: Luke 24:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγοντας ὅτι ⸂ὄντως ἠγέρθη ὁ κύριος⸃ καὶ ὤφθη Σίμωνι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/034.yaml
  text: saying[a], “The Lord has truly been raised and has appeared to Simon!”
translation:
  language: ja
  text: 「主は確かによみがえられ、シモンに現れた」と言っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντας
  choice: と言っていた
  rationale: 現在分詞・対格男性複数で、前節の人々に結び付く。日本語では引用を受ける「と言っていた」として、継続中の発言を自然に表した。
- source_word: ὄντως
  choice: 確かに
  rationale: 復活の事実性を強く断言する副詞。「本当に」も可能だが、「確かに」は簡潔で品位のある肯定を表す。
- source_word: ἠγέρθη
  choice: 復活させられ
  rationale: ἐγείρωのアオリスト受動形。復活という文脈上の意味を明確にしつつ、ギリシア語の受動態を保持した。
- source_word: ὁ κύριος
  choice: 主
  rationale: ここではイエスを指す称号であり、キリスト論的な重みを保つ標準的な訳語とした。
- source_word: ὤφθη
  choice: 現れた
  rationale: ὁράωのアオリスト受動形だが、復活後の顕現を表す慣用的用法。「見られた」よりも現代日本語として自然で、シモンへの顕現を明確にする。
- source_word: Σίμωνι
  choice: シモンに
  rationale: 固有名を音写し、与格を顕現の相手を示す「に」で表した。原文にない「ペトロ」は補わない。
theological_decisions:
- issue: 復活動詞の態
  choice: 復活させられ
  alternative: 復活した／よみがえった
  rationale: 原文のἠγέρθηは受動形であるため、行為者を明示せず受動態を保った。これにより、神によって起こされたという含みを消さず、同時に原文が行為者を明記していないことも守る。
- issue: κύριοςの訳
  choice: 主
  alternative: 主人
  rationale: 復活したイエスに対する称号として用いられているため、「主」とし、そのキリスト論的な意味を弱めない。
- issue: ὤφθηの訳し方
  choice: 現れた
  alternative: 見られた
  rationale: 形態上は受動形だが、復活顕現について「現れた」の意味で用いられる。日本語で「見られた」とすると偶然目撃されたという不適切な含みが生じ得るため、慣用上の意味を採った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、復活の宣言にふさわしい簡潔で厳かな調子を保った。前節に従属する分詞構文なので、「と言っていた」で文脈との連結を示した。
