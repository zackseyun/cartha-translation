id: LUK.24.46
reference: Luke 24:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὅτι οὕτως ⸀γέγραπται παθεῖν τὸν χριστὸν καὶ ἀναστῆναι ἐκ νεκρῶν τῇ τρίτῃ ἡμέρᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/046.yaml
  text: And he said to them[a], “Thus it is written[b], that the Messiah would suffer and rise from the dead on the third day,”
translation:
  language: ja
  text: そして彼らに言われた。「こう書かれている。『メシア[a]は苦しみを受け、三日目に死者の中から復活する』と。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語Χριστόςは「油を注がれた者」を意味する称号。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως γέγραπται
  choice: こう書かれている
  rationale: οὕτωςの指示的な意味と、聖書に記された内容が今も有効であることを表すγέγραπταιの完了形を、自然な日本語の聖書引用導入句で表した。
- source_word: παθεῖν
  choice: 苦しみを受け
  rationale: 不定詞を引用内容の一部として訳し、原文に明示されない義務・必然の助動表現は加えなかった。
- source_word: τὸν χριστόν
  choice: メシア
  rationale: 定冠詞を伴う称号として用いられており、ユダヤ的・聖書的な『油注がれた者』の背景を保つため『メシア』とした。
- source_word: ἀναστῆναι
  choice: 復活する
  rationale: 能動形の自動詞的意味を保ち、日本語で死者から生き返ることを明確かつ自然に表した。受動の『復活させられる』にはしなかった。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: ἐκの起点と、複数形νεκρῶνが示す『死者たちの中から』という含みを、日本語として通じる形で保持した。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 三日目に
  rationale: 時を示す与格を、簡潔で自然な日本語にした。
- source_word: ὅτι
  choice: 引用末の「と」
  rationale: 後続する記述内容を導くὅτιの働きを、日本語では引用内容の末尾に置く『と』で自然に表した。
theological_decisions:
- issue: 受難と復活の要約におけるΧριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは人名の一部のような用法ではなく、定冠詞を伴う称号であるため、『メシア』として聖書的な油注ぎの背景を明示した。
- issue: 復活動詞ἀναστῆναιの態
  choice: 復活する
  alternative: 復活させられる
  rationale: 原文は能動不定詞であるため、その態を保った。神がイエスを復活させたという新約聖書の別の表現を、この節へ受動形として持ち込まない。
- issue: 受難に必然性を示す助動表現を加えるか
  choice: 苦しみを受け
  alternative: 苦しみを受けなければならない
  rationale: 文脈上は聖書に記された成就が示されるが、この節のπαθεῖν自体にはδεῖに相当する明示的な必然表現がないため、本文では補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、イエスの発言と聖書引用にふさわしい端正さを保った。『こう書かれている』の後で一度文を切り、引用内容の末尾を『と』で結ぶことで、原文のὅτι節を日本語として自然に示した。
