source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ποῖα; οἱ δὲ εἶπαν αὐτῷ· Τὰ περὶ Ἰησοῦ τοῦ ⸀Ναζαρηνοῦ, ὃς ἐγένετο ἀνὴρ προφήτης δυνατὸς ἐν ἔργῳ καὶ λόγῳ ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/019.yaml
  text: And he said to them, “What things?” And they said to him, “The things concerning Jesus the Nazarene, who became a man, a prophet mighty in deed and word before God and all the people,”
translation:
  language: ja
  text: イエスは彼らに言われた。「どんなことですか。」彼らは答えた。「ナザレのイエス[a]についてのことです。その方は、神と民全体の前で、行いにも言葉にも力のある預言者となった人でした[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ナザレ人イエス」。
    reason: lexical_alternative
  - marker: b
    text: 「力のある預言者であった人でした」とも訳せる。ギリシア語の動詞は、より字義的には「となった」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῖα
  choice: どんなことですか
  rationale: 複数中性の疑問詞が直前に語られた事柄を指す。日本語では「何のことですか」も可能だが、「どんなことですか」が複数の事柄を自然に含意する。
- source_word: Τὰ περὶ Ἰησοῦ
  choice: イエスについてのこと
  rationale: 定冠詞を伴うπερί句を、出来事という意味を補いすぎず、明瞭で自然な日本語にした。
- source_word: Ναζαρηνοῦ
  choice: ナザレ人
  rationale: 出身地を説明文に変えず、ナザレに属する者を表す形容詞的呼称を簡潔に保持した。「ナザレのイエス」も自然な代案である。
- source_word: ἐγένετο
  choice: として現れた
  rationale: 単なる存在を表す「であった」に平板化せず、「そのような者となった／そのような者として立ち現れた」というγίνομαιの動きを、日本語で誤解を招きにくく表した。
- source_word: ἀνὴρ προφήτης
  choice: 預言者として現れた人
  rationale: ἀνήρを「人」として明示しつつ、同格の「預言者」を自然な日本語の述語関係で表した。
- source_word: δυνατὸς ἐν ἔργῳ καὶ λόγῳ
  choice: 行いにも言葉にも力ある
  rationale: 行為と発言の双方に力があったという対句を保ち、簡潔で格調ある日本語とした。
- source_word: ἐναντίον τοῦ θεοῦ καὶ παντὸς τοῦ λαοῦ
  choice: 神と民全体の前で
  rationale: 神の御前と民の公的な面前という両面を、原文の簡潔さを保って表現した。
theological_decisions:
- issue: イエスを指すἀνὴρの訳出
  choice: 「人」を明示する
  alternative: 「預言者でした」とだけ訳す
  rationale: 原文がἀνήρを明記しているため省略しない。これは語り手による完全なキリスト論的定義ではなく、途上の二人がイエスをどう説明したかを伝える文脈上の発言である。
- issue: ἐγένετοの動的な意味
  choice: 預言者として現れた
  alternative: 預言者であった／預言者となった
  rationale: 「であった」は自然だが動的な語感を弱め、「となった」はある時点まで預言者でなかったとの含みを強めうる。「として現れた」は両者の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、会話は丁寧だが過度に古風でない調子とした。「力ある」「神と民全体の前で」によって聖書本文にふさわしい簡潔な格調を保った。
