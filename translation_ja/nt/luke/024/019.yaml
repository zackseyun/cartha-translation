revisions:
- from: その方は彼らに、「どんなことですか」と言われた。彼らは答えた。「ナザレ人イエス[a]についてのことです。この方は、神と民全体の前で、行いにも言葉にも力ある預言者として現れた人でした。[b]」
  to: イエスは彼らに言われた。「どんなことですか。」彼らは答えた。「ナザレのイエス[a]についてのことです。その方は、神と民全体の前で、行いにも言葉にも力のある預言者となった人でした[b]。」
  rationale: 原文のἀνήρ（人）とπροφήτης（預言者）をともに訳出しつつ、ἐγένετοの動的な語感を「となった」で過度な補足なく反映した。「ナザレのイエス」は自然な日本語として本文に置き、原語の形容詞的呼称は脚注で明示した。脚注アンカーはそれぞれ該当する語句の直後に置いた。
