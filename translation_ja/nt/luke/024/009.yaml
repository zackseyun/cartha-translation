id: LUK.24.9
reference: Luke 24:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑποστρέψασαι ἀπὸ τοῦ μνημείου ἀπήγγειλαν ταῦτα πάντα τοῖς ἕνδεκα καὶ πᾶσιν τοῖς λοιποῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/009.yaml
  text: And returning from the tomb, they reported all these things to the eleven and to all the rest.
translation:
  language: ja
  text: そして、墓から戻ると、これらのことをすべて十一人と、そのほかの人たち全員に知らせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: 戻ると
  rationale: アオリスト能動分詞・女性複数で、前の文脈に登場する女たちを受ける。主動詞に先立つ動作を、自然な現代日本語の接続表現で示した。
- source_word: μνημείου
  choice: 墓
  rationale: イエスが葬られた場所を指す語であり、この復活物語の文脈では「墓」が簡潔で正確である。
- source_word: ἀπήγγειλαν
  choice: 知らせた
  rationale: 見聞きした内容を伝達する意味を自然に表す。「報告した」より日常的だが、「告げた」ほど文語的ではなく、物語の品位も保つ。
- source_word: ταῦτα πάντα
  choice: これらのことをすべて
  rationale: 指示語 ταῦτα と πάντα の包括性をともに明示する。
- source_word: τοῖς ἕνδεκα
  choice: 十一人
  rationale: 原文は「使徒」を補わず、定着した集団呼称として単に「十一人」とする。
- source_word: πᾶσιν τοῖς λοιποῖς
  choice: そのほかの人たち全員
  rationale: 十一人と、それ以外のより広い集団との区別、および πᾶσιν の包括性を明瞭に示す。
theological_decisions:
- issue: 女性複数形の分詞と動詞が指す主体
  choice: 直前の文脈に登場する女たちを、明示せず文脈上の主語として保つ
  alternative: 「女たちは」と補う
  rationale: ギリシア語の文法上、主体は女性複数だが、この節自体には名詞や代名詞がない。日本語でも主語を補わず自然に連結でき、原文の結束を保てる。
- issue: 使徒集団の呼称
  choice: 「十一人」
  alternative: 「十一人の使徒」
  rationale: 原文の τοῖς ἕνδεκα にない「使徒」を補わず、ユダを欠いた集団を指す慣用的な呼称をそのまま訳す。
translation_notes:
  register: 明瞭な現代標準日本語。簡潔で品位ある物語調とし、原文の分詞構文は自然な「戻ると」で表現した。主語は前後の文脈に委ね、過剰な補足を避けた。
