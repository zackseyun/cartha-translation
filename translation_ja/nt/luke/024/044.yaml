id: LUK.24.44
reference: Luke 24:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ ⸂πρὸς αὐτούς⸃· Οὗτοι οἱ λόγοι ⸀μου οὓς ἐλάλησα πρὸς ὑμᾶς ἔτι ὢν σὺν ὑμῖν, ὅτι δεῖ πληρωθῆναι πάντα τὰ γεγραμμένα ἐν τῷ νόμῳ Μωϋσέως ⸀καὶ προφήταις καὶ ψαλμοῖς περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/044.yaml
  text: 'Then he said to them[c][b][a], “These are my words that I spoke to you while I was still with you: that everything written about me in the Law of Moses and the Prophets and the Psalms must be fulfilled.”'
translation:
  language: ja
  text: それからイエスは彼らに言われた。「これらは、わたしがまだあなたがたと一緒にいたとき、あなたがたに話したわたしの言葉です。すなわち、わたしについて[a]モーセの律法と預言者たちと詩編[b]に書かれているすべてのこと[c]は、成就しなければならない、ということです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしに関して」。
    reason: lexical_alternative
  - marker: b
    text: 「モーセの律法と預言者たちと詩編」は、イスラエルの聖書の主要な区分を指すと考えられる。「詩編」は詩編そのものを指すとも、より広く「諸書」を代表する名称とも考えられる。
    reason: cultural_note
  - marker: c
    text: 直訳「書かれているすべてのこと」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ πρὸς αὐτούς
  choice: それからイエスは彼らに言われた
  rationale: δέは弱い接続として物語を進める「それから」とした。日本語では主語を補わないと発話者が分かりにくいため、文脈上明白な「イエス」を明示した。πρὸς αὐτούςは「彼らに」とした。
- source_word: Οὗτοι οἱ λόγοι μου
  choice: わたしが…話した言葉とは、このことです
  rationale: 直訳的な「これらはわたしの言葉です」は現代日本語では後続内容とのつながりが不自然になりやすい。指示表現を後置し、ὅτι以下が以前の発言内容であることを自然に示した。
- source_word: οὓς ἐλάλησα πρὸς ὑμᾶς
  choice: あなたがた…に話した言葉
  rationale: λαλέωの基本的な意味「話す」を保ち、πρὸς ὑμᾶςの相手を「あなたがたに」で表した。
- source_word: ἔτι ὢν σὺν ὑμῖν
  choice: まだあなたがたと一緒にいたとき
  rationale: 分詞構文の時間的関係とἔτιの「まだ」を明確で自然な日本語にした。
- source_word: ὅτι
  choice: すなわち…ということです
  rationale: ὅτιが以前語られた言葉の内容を導くことを、日本語の説明構文で明示した。
- source_word: δεῖ πληρωθῆναι
  choice: 成就しなければならない
  rationale: δεῖの必然性を「しなければならない」で保ち、聖書本文の実現を表すπληρόωには定着した「成就する」を用いた。
- source_word: πάντα τὰ γεγραμμένα
  choice: 書かれていることは、すべて
  rationale: 完了受動分詞の、書かれたまま存在しているという含みを「書かれている」で表し、πάνταの包括性を「すべて」で保持した。
- source_word: ἐν τῷ νόμῳ Μωϋσέως καὶ προφήταις καὶ ψαλμοῖς
  choice: モーセの律法と預言者たちと詩編に
  rationale: 三つの名称を区別しつつ、原文の並列を保った。「預言者たち」はπροφήταιςの複数形を反映する。「詩編」は文書名とも聖書区分とも取り得る表現として採用した。
- source_word: περὶ ἐμοῦ
  choice: わたしについて
  rationale: περί＋属格の参照・関連の意味を、明快な現代日本語で表した。
theological_decisions:
- issue: 聖書の成就に伴う必然性
  choice: 「成就しなければならない」
  alternative: 「成就することになっていた」「実現しなければならない」
  rationale: δεῖの強い必然性を保つ一方、その必然性の仕組みや預言成就の理論を本文に付加しない。
- issue: 「モーセの律法と預言者たちと詩編」の範囲
  choice: 三つの名称を本文にそのまま並べ、解釈は脚注で示す
  alternative: 「律法・預言書・諸書」という三部区分として明示する、または「詩編」を詩編だけに限定する
  rationale: イスラエルの聖書の主要区分を指す可能性は高いが、「詩編」が詩編そのものか、より広く諸書を代表するかは本文だけでは確定しないため、曖昧さを保持した。
- issue: περὶ ἐμοῦの関係
  choice: 「わたしについて」
  alternative: 「わたしに関して」
  rationale: イエスと記された内容との関連をそのまま示し、具体的にどの箇所がどのように該当するかは規定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの発言にふさわしい落ち着いた格調を保った。「わたし」「あなたがた」「成就」を用い、過度に口語的にも古語的にもならないようにした。すべての脚注記号を対応箇所の本文中に配置した。
