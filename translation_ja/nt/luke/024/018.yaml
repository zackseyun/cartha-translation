base_translation:
  language: en
  yaml_path: translation/nt/luke/024/018.yaml
  text: Then one of them[a], named Cleopas, answered and said to him, “Are you the only visitor to Jerusalem who does not know the things that have happened there in these days?”
translation:
  language: ja
  text: すると、二人のうち、クレオパという名の人が彼に答えた。「エルサレムに滞在していて[a]、この数日の間にそこで起こったことを知らないのは、あなただけなのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エルサレムによそ者として住んでいて」。このギリシア語には、よそから来た者または一時的な居住者として滞在するという含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: すると、……答えた
  rationale: δέを穏やかな物語上の展開として「すると」で表し、分詞ἀποκριθείςは日本語として自然な主動詞「答えた」にまとめた。
- source_word: εἷς ὀνόματι Κλεοπᾶς
  choice: 二人のうち、クレオパという名の人
  rationale: εἷςは直前の文脈にある二人の弟子の一人を指すため、「二人のうち」と明示した。ὀνόματιは自然に「という名の」とした。
- source_word: εἶπεν πρὸς αὐτόν
  choice: 彼に答えた
  rationale: ἀποκριθείςとεἶπενを日本語で重複させず、一つの発話導入として表した。αὐτόνは原文どおり固有名を補わず「彼」とした。
- source_word: Σὺ μόνος
  choice: あなただけなのですか
  rationale: μόνοςの排他的な強調を、疑問文末の「あなただけ」で自然かつ明瞭に表した。
- source_word: παροικεῖς
  choice: 滞在している
  rationale: よそ者・一時的居住者として身を寄せる意味を持つが、本文では現代日本語として自然な「滞在している」を採用し、外来者としての含みは脚注で示した。
- source_word: οὐκ ἔγνως
  choice: 知らない
  rationale: アオリスト形だが、最近の出来事を現在も知らずにいるという結果状態を問う文脈なので、日本語では「知らない」が自然である。
- source_word: τὰ γενόμενα ἐν αὐτῇ
  choice: そこで起こったこと
  rationale: 実質化された分詞τὰ γενόμεναを「起こったこと」とし、ἐν αὐτῇがエルサレムを受けることを自然な「そこで」で示した。
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: この数日の間に
  rationale: 話者の直近の日々を指す表現として、現代日本語で明瞭な「この数日の間に」とした。
