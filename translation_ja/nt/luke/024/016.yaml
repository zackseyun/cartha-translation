  text: οἱ δὲ ὀφθαλμοὶ αὐτῶν ἐκρατοῦντο τοῦ μὴ ἐπιγνῶναι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/016.yaml
  text: But their eyes were kept from recognizing him[a].
translation:
  language: ja
  text: しかし、二人の目は、イエスだと分からないように妨げられていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二人の目は、イエスだと分からないように抑えられていた」または「二人はイエスだと認めることができないようにされていた」。ギリシア語では、誰が、または何がそうしたのかは明示されていない。
    reason: 語義上の別訳と、受動態の行為者が明示されていないことを示すため。
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 穏やかな展開・対照を示す接続詞。イエスが共に歩いているのに二人が気づかないという対照を自然に示す。
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: 二人の目
  rationale: 直前の二人を受け、ギリシア語の具体的な「目」という身体的イメージを保つ。
- source_word: ἐκρατοῦντο
  choice: 遮られていて
  rationale: 受動態を維持し、何者か・何かによって認識が妨げられたことを示しつつ、原文が明示しない行為者を補わない。
- source_word: τοῦ μὴ ἐπιγνῶναι
  choice: イエスだと分からなかった
  rationale: ἐπιγινώσκω はこの文脈では一般的に知ることではなく、人物を見分けて認識することを表す。日本語として自然な結果表現にした。
- source_word: αὐτόν
  choice: イエスだと
  rationale: 代名詞の指示対象は文脈上イエスであり、日本語では名を補うことで、誰だと分からなかったのかを明瞭かつ自然に示す。
theological_decisions:
- issue: 認識を妨げた行為者を明示するか
  choice: 「二人の目は遮られていて」と受動表現にし、行為者を明示しない。
  alternative: 「神が二人の目を遮った」または単に「二人にはイエスだと分からなかった」とする。
  rationale: ギリシア語は受動態で行為者を示していない。神の直接的働きと断定せず、同時に外的な作用をうかがわせる受動の含みを消さない。
translation_notes:
  register: 明瞭な現代標準語を用いた。「認識する」より日常的な「イエスだと分かる」を選びつつ、「目」という原文の具体的表現と、行為者不明の受動態を保った。
