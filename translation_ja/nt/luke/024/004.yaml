  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ⸀ἀπορεῖσθαι αὐτὰς περὶ τούτου καὶ ἰδοὺ ἄνδρες δύο ἐπέστησαν αὐταῖς ἐν ⸂ἐσθῆτι ἀστραπτούσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/004.yaml
  text: And it happened[a], while they were perplexed about this, that behold, two men stood by them in dazzling clothing.
translation:
  language: ja
  text: 女たちがこのことに途方に暮れていると、見よ、まばゆく輝く衣[a]を着た二人の男が、彼女たちのそばに立った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「稲妻のように光る衣」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγένετο
  choice: 〜ていると
  rationale: ルカに多い出来事導入の定型表現。日本語では独立して「そして、こうなった」とせず、後続する時間構文と合わせて「〜ていると」とすることで、自然な現代語の物語文として新たな出来事の発生を示した。
- source_word: ἐν τῷ ἀπορεῖσθαι αὐτὰς
  choice: 女たちが…途方に暮れていると
  rationale: ἐν＋冠詞付き不定詞の時間的用法を「〜ていると」で表現した。ἀπορέωは単なる不思議や疑問ではなく、どう理解すべきか分からず困惑する意味なので「途方に暮れる」とした。文脈上の指示対象を明確にするため、αὐτάςは「女たち」と明示した。
- source_word: περὶ τούτου
  choice: このことに
  rationale: 直前に記された空の墓の状況を指す、簡潔で自然な表現とした。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 突然の展開に読者の注意を向ける標識性を保った。「すると」だけでは語の強い注意喚起が薄れるため、「見よ」を採用した。
- source_word: ἄνδρες δύο
  choice: 二人の男
  rationale: この節の叙述どおり、二人を男性として提示した。周辺文脈から「御使い」と解釈して本文に持ち込むことは避けた。
- source_word: ἐπέστησαν αὐταῖς
  choice: 彼女たちのそばに立った
  rationale: 突然近くに現れて立つという空間的な意味を保った。「現れた」だけにすると、立っていたという原文の描写が弱まる。
- source_word: ἐν ἐσθῆτι ἀστραπτούσῃ
  choice: まばゆく輝く衣を着た
  rationale: ἐσθήςを「衣」、ἀστράπτωの強烈な光を「まばゆく輝く」と自然な日本語で表した。稲妻を思わせる原語の具体的な比喩は脚注に残した。
theological_decisions:
- issue: 二人の人物の正体
  choice: 本文では「二人の男」とする
  alternative: 「二人の御使い」とする
  rationale: 広い文脈では天からの使者と理解されるが、この節自体はἄνδρες δύοと述べている。直近の叙述を越えて正体を明示せず、原文が保つ提示の仕方を維持した。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「見よ」は日常会話より高い文体だが、ἰδούの注意喚起と物語上の鮮烈さを保つため採用した。
