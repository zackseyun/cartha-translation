id: LUK.24.41
reference: Luke 24:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔτι δὲ ἀπιστούντων αὐτῶν ἀπὸ τῆς χαρᾶς καὶ θαυμαζόντων εἶπεν αὐτοῖς· Ἔχετέ τι βρώσιμον ἐνθάδε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/041.yaml
  text: And while they still were disbelieving because of joy and were marveling[a], he said to them, “Do you have anything here to eat?”
translation:
  language: ja
  text: 彼らが喜びのあまり、まだ信じられず、驚いていると、イエスは彼らに言われた。「ここに何か食べる物がありますか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτι δὲ
  choice: まだ……いると
  rationale: ἔτιの継続の意味を「まだ」で示し、δέは日本語の流れに合わせて従属節と主節の接続に自然に織り込んだ。
- source_word: ἀπιστούντων
  choice: 信じられず
  rationale: 現在分詞の継続的・状況的な反応を表しつつ、文脈上、固定的な不信仰と断定しない自然な日本語とした。
- source_word: ἀπὸ τῆς χαρᾶς
  choice: 喜びのあまり
  rationale: ἀπόが示す原因・源を、日本語で自然な因果表現にした。喜びゆえに現実を信じきれないという逆説も保たれる。
- source_word: θαυμαζόντων
  choice: 驚いている
  rationale: 驚嘆し不思議に思う継続的反応を、現代日本語で明瞭に表した。
- source_word: Ἔχετέ τι βρώσιμον ἐνθάδε
  choice: ここに何か食べる物がありますか
  rationale: 語順と意味を保ちつつ、質問として自然で明瞭な現代日本語にした。βρώσιμονは名詞的に「食べる物」と訳した。
theological_decisions:
- issue: 復活したイエスを見た弟子たちの反応の性質
  choice: 喜びがあまりにも大きいため、なお現実として受け止めきれず驚いている複雑な反応として訳す。
  alternative: 単に「まだ信じなかった」とし、懐疑や不信を前面に出す。
  rationale: ἀπιστούντων、ἀπὸ τῆς χαρᾶς、θαυμαζόντωνが一続きになっており、不信、喜び、驚きの緊張を本文どおり保持する必要がある。「信じられず」は一時的な心理状態を自然に示すが、その不信の要素自体は消していない。
translation_notes:
  register: 明瞭で現代的な標準日本語。叙述は簡潔で品位を保ち、イエスへの敬語は「言われた」にとどめた。原文の感情的・神学的緊張を説明的に解消しない。
