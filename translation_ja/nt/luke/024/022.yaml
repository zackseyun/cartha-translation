  text: ἀλλὰ καὶ γυναῖκές τινες ἐξ ἡμῶν ἐξέστησαν ἡμᾶς, γενόμεναι ⸀ὀρθριναὶ ἐπὶ τὸ μνημεῖον
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/022.yaml
  text: But also[a], some women from among us astonished us, having gone early in the morning to the tomb[b],
translation:
  language: ja
  text: そればかりか、私たちの仲間の女性たちが何人か、私たちを驚かせました。[a] 彼女たちは朝早く[b]墓へ行ったのですが、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仰天させました」または「当惑させました」とも訳せる。ギリシャ語の動詞は、強い驚きや動揺を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「夜明けごろ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: そればかりか
  rationale: 前節までの失望を受けつつ、意外な出来事を付け加える逆接的・添加的な力を、自然な現代日本語で表した。
- source_word: γυναῖκές τινες
  choice: 女性が何人か
  rationale: 不定複数を自然な現代日本語で表し、「ある女たち」のような硬さを避けた。
- source_word: ἐξ ἡμῶν
  choice: 私たちの仲間の
  rationale: 女性たちが話者たちの弟子の一団に属していたことを明確にする。
- source_word: ἐξέστησαν ἡμᾶς
  choice: 私たちを驚かせました
  rationale: 強い驚きや動揺を生じさせたという語義を保ちつつ、混乱だけに意味を限定しない表現とした。
- source_word: γενόμεναι
  choice: 行ったのですが
  rationale: ὀρθριναὶおよび方向を示す前置詞句と結び付いた慣用的な意味を、日本語では移動を明示して自然に表した。文が次節へ続くことも示している。
- source_word: ὀρθριναὶ
  choice: 朝早く
  rationale: 早朝または夜明けごろという時間的意味を、明快で自然な日本語にした。
- source_word: ἐπὶ τὸ μνημεῖον
  choice: 墓へ
  rationale: ἐπί＋対格が表す墓への移動方向を保った。文脈上、イエスが葬られた墓を指す。
theological_decisions:
- issue: 復活の報告という文脈におけるἐξέστησανの強さ
  choice: 驚かせました
  alternative: 仰天させました／当惑させました
  rationale: 女性たちの知らせに対する弟子たちの強い反応を示しながら、彼らが信じたとも拒んだとも決めつけず、物語上の緊張を保つ。
translation_notes:
  register: 明快で品位ある現代標準日本語。叙述の流れを自然にするため後半で「その人たちは」と主語を補い、次節へ続く構文を「のですが」で保った。
