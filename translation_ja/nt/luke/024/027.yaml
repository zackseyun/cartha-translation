source:
  edition: SBLGNT
  text: καὶ ἀρξάμενος ἀπὸ Μωϋσέως καὶ ἀπὸ πάντων τῶν προφητῶν ⸀διερμήνευσεν αὐτοῖς ἐν πάσαις ταῖς γραφαῖς τὰ περὶ ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/027.yaml
  text: And beginning with Moses and all the Prophets[b][a], he interpreted to them in all the Scriptures the things concerning himself.
translation:
  language: ja
  text: そして、モーセとすべての預言者から始めて[b]、聖書全体にわたり、ご自分に関することを彼らに解き明かされた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「説明された」「詳しく説き明かされた」とも訳せる。ギリシア語の動詞は、意味を詳しく解釈して説明することを表しうる。
    reason: lexical_alternative
  - marker: b
    text: 「モーセとすべての預言者」は、モーセに結び付けられた書物と預言書を指す表現。
    reason: cultural_note
lexical_decisions:
- source_word: ἀρξάμενος ἀπὸ Μωϋσέως
  choice: モーセ……から始めて
  rationale: 分詞による主動作とのつながりと、聖書解説の起点を自然な現代日本語で示す。ここでの「モーセ」は、文脈上モーセに結び付けられた書物を指す。
- source_word: πάντων τῶν προφητῶν
  choice: すべての預言者
  rationale: モーセと並ぶ聖書上の区分を指す表現として訳し、個々の預言者だけに限定しないことを脚注で補う。
- source_word: διερμήνευσεν
  choice: 解き明かされた
  rationale: 詳しく解釈し、意味を説明する動詞の含意を自然かつ品位ある日本語で表す。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 与格の間接目的語を簡潔に表す。
- source_word: ἐν πάσαις ταῖς γραφαῖς
  choice: 聖書全体にわたり
  rationale: γραφήを聖なる書としての「聖書」とし、πάσαιςの広がりを「全体にわたり」で表す。ただし各節すべてが直接言及するとの意味には限定しない。
- source_word: τὰ περὶ ἑαυτοῦ
  choice: ご自分について書かれていること
  rationale: イエスに関する事柄や箇所を広く指す中性複数を表す。「書かれている」を補うことで日本語として自然にしつつ、預言だけ、予型だけなど特定の解釈類型には狭めない。
theological_decisions:
- issue: イエスによる聖書解説の範囲
  choice: 聖書全体にわたって、ご自分に関する事柄を解き明かしたと表現する
  alternative: 直接的なメシア預言だけを説明した、または旧約聖書の各箇所が例外なく直接イエスを指すと表現する
  rationale: 原文はキリストに関する広範な聖書解説を示すが、そのすべてを直接預言に限定することも、個々の全箇所が直接言及すると断定することもないため、その幅と緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら、聖書朗読に適する品位を保った。「解き明かされた」は敬意を示す主語敬語として自然であり、原文にない教派的な解釈用語は加えていない。脚注記号は対応する語句の直後に配置した。
