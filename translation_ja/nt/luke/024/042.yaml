lexical_decisions:
- source_word: οἱ δὲ
  choice: そこで弟子たちは
  rationale: οἱは直前の文脈にいる弟子たちを指す実質的な代名詞用法。δέは弱い接続を表すため、応答の流れが自然に伝わる「そこで」とした。日本語では指示対象を明確にするため「弟子たち」を補った。
- source_word: ἐπέδωκαν
  choice: 差し出した
  rationale: ἐπιδίδωμιはここで「与える、手渡す」の意。食べ物を求めたイエスへの応答として、自然で具体的な「差し出した」とした。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 三人称代名詞の与格で、与える相手を示す。日本語では指示対象を明確にするため、文脈上の人物名「イエス」を用いた。
- source_word: ἰχθύος ὀπτοῦ μέρος
  choice: 焼いた魚を一切れ
  rationale: μέροςは「一部分、一切れ」、ἰχθύος ὀπτοῦは焼いて調理した魚を表す。「焼いた魚を一切れ」は語義を保ちつつ、現代日本語として自然である。
- source_word: ὀπτοῦ
  choice: 焼いた
  rationale: ὀπτόςは火で焼いた、あぶった食物を指す。調理器具を限定しすぎない一般的で明瞭な「焼いた」を選んだ。
theological_decisions:
- issue: ルカ24章42節の本文形
  choice: SBLGNTの短い本文に従い、「焼いた魚を一切れ」のみを本文とする。
  alternative: 後代の一部写本には「また、蜂の巣から取ったもの」を加える異読がある。
  rationale: 提示された批判本文はμέροςで終わり、蜂の巣への言及を含まない。原語本文を優先しつつ、異読は脚注で明示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「差し出した」により直前の求めへの応答を表しつつ、簡潔で品位ある叙述調を保った。
