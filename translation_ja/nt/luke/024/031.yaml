  text: αὐτῶν δὲ διηνοίχθησαν οἱ ὀφθαλμοὶ καὶ ἐπέγνωσαν αὐτόν· καὶ αὐτὸς ἄφαντος ἐγένετο ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/031.yaml
  text: Then their eyes were opened[a], and they recognized him; and he became unseen by them.
translation:
  language: ja
  text: 二人の目が開かれ、二人はイエスだと分かった。すると、イエスは二人には見えなくなった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「二人の前から姿を消した」「二人の視界から消えた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διηνοίχθησαν
  choice: 開かれ
  rationale: アオリスト受動態をそのまま受動表現とし、二人の認識が自力で生じたのではなく、開かれたことを示す。
- source_word: οἱ ὀφθαλμοὶ
  choice: 二人の目
  rationale: 属格代名詞を自然な日本語の所有表現にし、エマオ途上の二人を指すことを明確にした。
- source_word: ἐπέγνωσαν αὐτόν
  choice: イエスだと分かった
  rationale: ここでのἐπιγινώσκωは、それまで正体に気づかなかった相手を認める意味。日本語では「彼を認識した」よりも文脈に即して自然である。
- source_word: ἄφαντος ἐγένετο ἀπ’ αὐτῶν
  choice: 二人から見えなくなった
  rationale: 「見えないものとなった」という表現とἀπόの関係的な含みを保ち、どのような仕方で姿が見えなくなったかを断定しない。
- source_word: δὲ
  choice: その時
  rationale: 物語の展開を示す接続辞として、直前の出来事との時間的なつながりを自然に表した。
theological_decisions:
- issue: イエスが見えなくなった出来事の性質
  choice: 二人から見えなくなった
  alternative: 二人の前から姿を消した
  rationale: ἄφαντοςとγίνομαιの組み合わせを反映しつつ、消失の仕組みを特定せず、本文に残る神秘性と曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「二人」は文脈上の指示対象を自然に示し、「見えなくなった」によって機序を説明しすぎない簡潔で品位ある語調とした。
