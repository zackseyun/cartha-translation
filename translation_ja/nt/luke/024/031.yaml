  naturalness: 原文の「二人から見えなくなった」は意味は通るが、現代標準日本語では「二人には見えなくなった」の方が、誰にとって見えなくなったのかを自然かつ明確に表す。また「その時」と「すると」が近接しており、接続表現がやや重なる。
