  text: ὑμεῖς ⸀ἐστε μάρτυρες τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/048.yaml
  text: You are witnesses of these things[a].
translation:
  language: ja
  text: あなたがたは、これらのことの証人です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがたは、これらのことについて証言する者です」。ギリシア語の「これら」は、イエスが直前に語られた出来事を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがた
  rationale: 二人称複数代名詞が明示され、弟子たちを強調している。現代標準日本語では「あなたがた」と明示することで、その力点を自然に表せる。
- source_word: ἐστε
  choice: です
  rationale: 現在直説法の「～である」。文全体を明瞭で dignified な現代日本語とするため、丁寧体の「です」とした。
- source_word: μάρτυρες
  choice: 証人
  rationale: ここでは、イエスの受難と復活など、直前に語られた出来事を証言する者を指す。後代の「殉教者」という意味を持ち込まず、文脈に即して「証人」とした。
- source_word: τούτων
  choice: これらのことの
  rationale: 属格複数の指示代名詞で、直前にイエスが語った出来事を受ける。「これらのことの」は指示対象と証人との関係を明確かつ自然に示す。
theological_decisions:
- issue: 弟子たちが μάρτυρες と呼ばれる意味
  choice: 弟子たちは、直前に述べられた出来事を証言する者である
  alternative: 後代のキリスト教用語としての「殉教者」という含意を前面に出す
  rationale: この文脈では、イエスの苦難、復活、そして悔い改めと罪の赦しの宣べ伝えについて証言する役割が中心である。後に生じた殉教の含意を訳文へ読み込まない。
- issue: τούτων の指示対象
  choice: 直前に語られた一連の出来事を指すものとして「これらのこと」とする
  alternative: 指示対象を特定の一事に限定する
  rationale: ギリシア語の複数指示代名詞は直前の内容を広く受けうるため、範囲を訳文で不必要に限定しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語の丁寧体。「証人」は聖書的な重みを保ちながら一般読者にも理解しやすい。「あなたがた」を明示して原文の代名詞の強調を反映した。
