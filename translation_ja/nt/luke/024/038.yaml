source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Τί τεταραγμένοι ἐστέ, καὶ διὰ τί διαλογισμοὶ ἀναβαίνουσιν ἐν ⸂τῇ καρδίᾳ⸃ ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/038.yaml
  text: And he said to them[a], “Why are you troubled, and why do doubts arise in your hearts?”
translation:
  language: ja
  text: イエスは彼らに言われた。「なぜ動揺しているのですか。なぜ心に疑い[a]が湧き起こるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「疑い」は「考え」または「推論」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί
  choice: なぜ
  rationale: 述語的な分詞とともに理由を問う用法であり、自然な日本語では「なぜ」が適切。
- source_word: τεταραγμένοι
  choice: 取り乱している
  rationale: 完了受動分詞が、動揺させられた結果として現在も続く内的な混乱状態を表す。
- source_word: διαλογισμοὶ
  choice: 疑い
  rationale: 語自体は「考え」「論議・推論」も意味し得るが、復活したイエスを見て戸惑う直近の文脈では「疑い」が否定的な逡巡を自然に伝える。語義の幅は脚注に残す。
- source_word: ἀναβαίνουσιν
  choice: 湧き起こる
  rationale: 直訳的には「上って来る」だが、心の内に生じる思考を表す日本語として「湧き起こる」が自然で、比喩的な動きも保つ。
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: 心に
  rationale: 単数の「心」と複数の「あなたがたの」による配分的表現。日本語では聞き手一人一人の内面を表す「心に」が自然で、複数性を不自然に明示しない。
- source_word: καρδία
  choice: 心
  rationale: 感情だけでなく思考や意志を含む内なる人を指す聖書的表現を保ち、「頭」や「精神」へ狭めない。
theological_decisions:
- issue: καρδίαが表す人間の内面
  choice: 心
  alternative: 精神／内面
  rationale: この箇所では思考も「心」に生じる。現代的な感情対理性の区分を持ち込まず、原文の人間観の幅を保つ。
- issue: διαλογισμοίの文脈的含意
  choice: 疑い
  alternative: 考え／推論
  rationale: 出現したイエスを霊だと思って恐れる文脈では疑念・逡巡の含意が強い。ただし語彙上の幅を断定的に消さないよう脚注で代案を示す。
translation_notes:
  register: 明瞭で現代的ながら、イエスの発言にふさわしい落ち着いた品位を保った。「取り乱す」は内的動揺を具体的に示し、「湧き起こる」は原文の上昇比喩を自然な日本語で表す。脚注記号[a]は該当語を含む文の末尾に置いた。
