  text: καὶ ἀπῆλθόν τινες τῶν σὺν ἡμῖν ἐπὶ τὸ μνημεῖον, καὶ εὗρον οὕτως καθὼς ⸀καὶ αἱ γυναῖκες εἶπον, αὐτὸν δὲ οὐκ εἶδον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/024.yaml
  text: And some of those with us went to the tomb and found it just as the women had said, but they did not see him.
translation:
  language: ja
  text: また、私たちと一緒にいた人たちの何人かが墓へ行き、女たちが言ったとおりであることを確かめました。しかし、その方を見ませんでした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθόν
  choice: 行ってみると
  rationale: 墓へ赴いた後に確認したという物語の流れを、自然な現代日本語で表す。「行った」だけでも可能だが、後続する発見とのつながりを明瞭にした。
- source_word: τινες τῶν σὺν ἡμῖν
  choice: 私たちの仲間の何人か
  rationale: 話し手たちと行動を共にしていた集団の一部を指す。「私たちと一緒にいた者たちの何人か」より簡潔で自然であり、所属関係を過度に限定しない。
- source_word: ἐπὶ τὸ μνημεῖον
  choice: 墓へ
  rationale: この復活物語ではイエスの遺体が納められた墓を指す。日本語の聖書文脈で自然かつ明確な訳語である。
- source_word: εὗρον οὕτως καθὼς καὶ αἱ γυναῖκες εἶπον
  choice: 女たちが言ったとおりであることが分かりました
  rationale: 墓の状態が女たちの報告と一致していたという意味を表す。「見いだした」の直訳は日本語では対象が不明瞭になりやすいため、内容を補わずに一致の確認を自然に示した。καίの付加・強調的な含みは比較構文の中に自然に反映されるため、別に「も」を置かなかった。
- source_word: αὐτὸν
  choice: あの方の姿
  rationale: 指示対象はイエスだが、固有名を補わず代名詞的な結束を保つ。単なる「彼」は現代日本語では距離感や敬意の面で不自然になりうるため、「あの方」とし、εἶδονとの自然な結びつきのため「姿」を添えた。
- source_word: δὲ οὐκ εἶδον
  choice: しかし、…見ませんでした
  rationale: 墓についての報告は確認された一方、イエス本人は見なかったという穏やかな対照を明確にする。動詞は「見つける」ではなく「見る」とした。
theological_decisions:
- issue: 復活物語における確認内容とイエス不在の対照
  choice: 墓の状態について女たちの報告どおりだったことと、訪問者たちがイエス本人を見なかったことを区別して訳す
  alternative: 他の復活記事を踏まえて、空の墓や御使いなど確認された内容を具体的に補う
  rationale: ギリシア語本文は確認内容を詳述せず、女たちの報告との一致と、イエスを見なかったことだけを述べる。並行記事との調和を訳文に持ち込まず、本文の簡潔さと物語上の緊張を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語。エマオ途上の弟子たちによる丁寧な語り口に合わせて敬体とし、荘重さを保ちつつ古風な語法は避けた。
