revisions:
- from: しかし私たちは、この方こそイスラエルを贖う[a]はずの方だ[b]と、望みをかけていました。そればかりか、こうしたことが起こってから、今日でもう三日目です。
  to: しかし私たちは、この方こそイスラエルを贖う[a]はずの方だ[b]と、望みをかけていました。しかも、それに加えて、こうしたことが起こってから、今日でもう三日目です。
  rationale: 接続表現のみを「しかも、それに加えて」に改めた。これにより、ἀλλά γε καὶ σὺν πᾶσιν τούτοις の逆接を含む累加的な力を自然な現代日本語で表す。他の訳語と両脚注は原文への忠実さ、用語の適切さ、神学的な意味の非限定性を保っているため維持した。
