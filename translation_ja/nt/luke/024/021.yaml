  source_fidelity: 全体として、未完了過去の「望みをかけていました」、希望内容内の現在形を保つ「方だと」、および「イスラエルを贖う」は、ギリシア語の構文と意味の幅をよく反映している。「今日でもう三日目です」も、出来事から数えて三日目に至っているという τρίτην ταύτην ἡμέραν ἄγει の慣用表現を明瞭に伝える。
  naturalness: 「そればかりか」は通常「それだけでなく、さらに」という追加説明を導く表現であり、この文脈の ἀλλά γε καὶ σὺν πᾶσιν τούτοις（『しかも／それに加えて、これらすべてのことがあるのに』）が表す累加的かつ逆接的なつながりにはやや不適切である。「しかも、それに加えて」とすることで、自然さと原文の力点を保てる。
  terminology: 「贖う」は λυτροῦσθαι の解放・救済の含意を保ち、政治的解放か霊的救いかを限定しないため適切である。脚注aもその曖昧さを適切に説明している。「この方こそ」と「方だと」は αὐτός の強調および ἐστιν の現在形を無理なく反映する。
