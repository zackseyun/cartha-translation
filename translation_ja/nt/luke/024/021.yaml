  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ ἠλπίζομεν ὅτι αὐτός ἐστιν ὁ μέλλων λυτροῦσθαι τὸν Ἰσραήλ· ἀλλά γε ⸀καὶ σὺν πᾶσιν τούτοις τρίτην ταύτην ἡμέραν ⸀ἄγει ἀφ’ οὗ ταῦτα ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/021.yaml
  text: But we were hoping that he is the one who is about to redeem Israel[a]. Yet besides all this[b], it is now the third day since these things happened.
translation:
  language: ja
  text: しかし私たちは、この方こそイスラエルを贖う[a]はずの方だ[b]と、望みをかけていました。しかも、それに加えて、こうしたことが起こってから、今日でもう三日目です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贖う」は「解放する」「救い出す」とも訳せる。ここでは、政治的解放だけ、または霊的救いだけに意味を限定していない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イスラエルを贖うはずの方だった」。ギリシア語では、過去の「望みをかけていた」という表現の中に現在形の「方である」が保たれている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: しかし私たちは
  rationale: δέの対照的な働きと、明示された主語ἡμεῖςの強調を、自然な現代日本語で表した。
- source_word: ἠλπίζομεν
  choice: 望みをかけていました
  rationale: 未完了過去が示す、過去に持続していたものの今は挫折しかけている期待を表す。単なる「望みました」より文脈に合う。
- source_word: ὅτι αὐτός ἐστιν
  choice: この方こそ……方だと
  rationale: αὐτόςの強意を「こそ」で示し、過去の希望の内容に置かれた現在形ἐστινを日本語の「だ」によって保った。
- source_word: ὁ μέλλων λυτροῦσθαι
  choice: 贖うはずの方
  rationale: μέλλωνの、期待されている将来の行為という意味を、意図的に行動を試みるとの誤解を招きやすい「贖おうとしている」ではなく、自然な「はずの」で表した。
- source_word: λυτροῦσθαι
  choice: 贖う
  rationale: 解放・救出の意味と、イスラエルに関する契約的・救済的な響きの双方を保つ。「政治的解放」や「霊的救い」の一方に限定しない。
- source_word: τὸν Ἰσραήλ
  choice: イスラエル
  rationale: 契約の民全体を指す直接目的語を簡潔にそのまま訳した。
- source_word: ἀλλά γε καὶ σὺν πᾶσιν τούτοις
  choice: そればかりか
  rationale: 前述のすべてに加わる、さらに落胆させる事情を導入する累加的・対照的な力を、過度に逐語的にならない日本語で示した。
- source_word: τρίτην ταύτην ἡμέραν ἄγει
  choice: 今日でもう三日目です
  rationale: 時の経過を表すἄγειの慣用的用法を明瞭に訳し、ταύτηνの近接的なニュアンスを「今日」で示した。
- source_word: ἀφ’ οὗ ταῦτα ἐγένετο
  choice: こうしたことが起こってから
  rationale: 時間を数え始める起点を示すἀφ’ οὗを自然な日本語で表した。
theological_decisions:
- issue: 「イスラエルを贖う」が指す救いの範囲
  choice: 「贖う」とし、救いの様態を限定しない
  alternative: 「イスラエルを政治的に解放する」または「イスラエルを霊的に救う」
  rationale: メシアへの希望には民族的解放や救済的意味が重なり得るが、本文はその範囲を明示していないため、神学的緊張を保った。
- issue: 過去形ἠλπίζομενに続く現在形ἐστινの時間的関係
  choice: 「方だと」として、希望内容内の現在形を保つ
  alternative: 「方だったと」と全面的に過去へ移す
  rationale: ギリシア語は過去の希望の内容に現在形を残している。周囲の文脈が失望を示すため、訳文で命題そのものを過去へ移して解釈を固定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「贖う」は聖書的な重みを保つ語だが、脚注で意味を補った。「そればかりか」と「今日でもう三日目です」により、累加と時間経過を自然に表現した。
