id: LUK.24.39
reference: Luke 24:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἴδετε τὰς χεῖράς μου καὶ τοὺς πόδας μου ὅτι ⸂ἐγώ εἰμι αὐτός⸃· ψηλαφήσατέ με καὶ ἴδετε, ὅτι πνεῦμα σάρκα καὶ ὀστέα οὐκ ἔχει καθὼς ἐμὲ θεωρεῖτε ἔχοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/039.yaml
  text: Look at my hands and my feet[a], that it is I myself. Touch me and see[d][c][b], because a spirit does not have flesh and bones as you see that I have.
translation:
  language: ja
  text: わたしの手と足を見なさい。まさしくわたしです[a]。わたしに触れて、見なさい[b]。霊には肉も骨もありません。しかし、あなたがたが見ているように、わたしには肉と骨があります[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「わたしこそ、その者です」。ギリシア語では「わたし自身」であることが強調されています。なお、「わたし自身なのだから」と理由を表す文に取ることもできます。
    reason: 語句の強調とὅτιの統語的曖昧さを示すため。
  - marker: b
    text: 「わたしを手で触って確かめなさい」とも訳せます。
    reason: ψηλαφάωが、単なる接触だけでなく手で確かめる意味を持つため。
  - marker: c
    text: 「霊」は、文脈上「幽霊」とも訳せます。
    reason: πνεῦμαの文脈的な別訳を示しつつ、本文では原語に近い訳を保持するため。
lexical_decisions:
- source_word: ἴδετε
  choice: 見なさい／よく見なさい
  rationale: 複数へのアオリスト命令で、直ちに目で確かめるよう求める表現。二度目は文脈上、触覚と併せた確認を表すため「よく見なさい」とした。
- source_word: τὰς χεῖράς μου καὶ τοὺς πόδας μου
  choice: わたしの手と足
  rationale: 身体を示す具体的な語をそのまま自然な日本語にした。傷跡を示唆し得るが、本文に明記されないため補わない。
- source_word: ὅτι ἐγώ εἰμι αὐτός
  choice: まさしくわたしです
  rationale: ἐγώとαὐτόςによる強調を、現代日本語で自然に本人確認を表す「まさしくわたしです」で伝えた。
- source_word: ψηλαφήσατέ με
  choice: わたしに触れて
  rationale: 手で触れて確かめる意味。過度に強い「つかむ」や古風な「さわってみる」ではなく、明瞭で自然な表現を選んだ。
- source_word: πνεῦμα
  choice: 霊
  rationale: 非物質的存在を指す語の直接的な訳。「幽霊」も文脈上は可能だが、原語より意味を限定し、文化的含意も加えるため本文では避けた。
- source_word: σάρκα καὶ ὀστέα
  choice: 肉も骨も
  rationale: 身体の実在性を示す字義どおりの表現。「も…も」により、霊がその双方を持たないという日本語の自然な対比を作った。
- source_word: θεωρεῖτε
  choice: 見ている
  rationale: 注意深く観察する含みはあるが、継続中の知覚を自然な現代日本語で表した。
- source_word: ἔχοντα
  choice: わたしにはそれがあります
  rationale: ἐμέを修飾する分詞を日本語の独立した節に展開し、「それ」で直前の「肉も骨も」を受けた。
theological_decisions:
- issue: 復活したイエスの身体的実在性
  choice: 「霊には肉も骨もありません。…わたしにはそれがあります」と身体的対比を明示する
  alternative: 身体性を弱める説明的・比喩的な訳
  rationale: 見ること、触れること、肉と骨への言及を原文どおり保ち、復活後のイエスが触知できる身体を伴って現れたという本文の主張を、追加の教理説明なしに示した。
- issue: πνεῦμαの指示内容
  choice: 「霊」
  alternative: 「幽霊」
  rationale: 弟子たちが亡霊と思った文脈にも適合しつつ、原語が持つ幅を狭めず、本文にある身体との対比を保つ。
- issue: ὅτι ἐγώ εἰμι αὐτόςの統語的関係
  choice: 「見なさい」の認識内容として区切り、「まさしくわたしです」とする
  alternative: 理由として「わたし自身なのだから」とする
  rationale: ὅτιは内容節にも理由節にも取り得る。ここでは「手と足を見て、本人だと認める」という流れを優先したが、接続関係の別解を脚注で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの命令と身体的対比の荘重さを保った。「御覧なさい」などの敬語は話者と聞き手の関係に不要な含意を加えるため避け、「見なさい」とした。
