id: LUK.24.49
reference: Luke 24:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἐγὼ ⸀ἐξαποστέλλω τὴν ἐπαγγελίαν τοῦ πατρός μου ἐφ’ ὑμᾶς· ὑμεῖς δὲ καθίσατε ἐν τῇ ⸀πόλει ἕως οὗ ἐνδύσησθε ⸂ἐξ ὕψους δύναμιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/049.yaml
  text: And look, I am sending the promise of my Father upon you. But stay in the city until you are clothed with power from on high.
translation:
  language: ja
  text: 見なさい。わたしは、わたしの父の約束をあなたがたの上に送ります。しかしあなたがたは、いと高き所からの力を身にまとうまで、都にとどまっていなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: さあ
  rationale: 注意を促す談話標識として、現代日本語で自然に聞き手の注意を向ける表現を選んだ。
- source_word: ἐξαποστέλλω
  choice: 送ります
  rationale: 現在形の直接性を保ち、聖霊という解釈を本文に補わず表現した。
- source_word: τὴν ἐπαγγελίαν τοῦ πατρός μου
  choice: 父が約束されたもの
  rationale: 『約束』がここでは約束された賜物を指す換喩であることを自然な日本語で示しつつ、その具体的内容を本文で限定しない。
- source_word: ἐφ’ ὑμᾶς
  choice: あなたがたの上に
  rationale: 方向を表す比喩を保ち、『与える』などへ平板化しない。
- source_word: καθίσατε ἐν τῇ πόλει
  choice: 都にとどまっていなさい
  rationale: καθίζω は文脈上『滞在する、とどまる』の意。既知のエルサレムを指す定冠詞は、日本語では文脈的な『都』で表した。
- source_word: ἐνδύσησθε
  choice: 身にまとう
  rationale: 力を衣服のように着る原文の比喩を保持した。
- source_word: ἐξ ὕψους δύναμιν
  choice: いと高き所からの力
  rationale: ὕψος の天的な含意を、荘重だが理解可能な伝統的表現で保った。
theological_decisions:
- issue: 『父の約束』の具体的指示対象
  choice: 父が約束されたもの
  alternative: 父が約束された聖霊
  rationale: 文脈上は聖霊を指すと理解できるが、この節のギリシャ語本文は明示していないため、訳文で補わない。
- issue: 『力を身にまとう』という比喩
  choice: 比喩をそのまま保持
  alternative: 力を授けられる
  rationale: 原文の印象的な受動表現と、力が外から与えられるという含意を保つため。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、イエスの厳粛な告別の言葉にふさわしい品位を保った。『いと高き所』のみやや荘重な語調だが、天的起源を簡潔に伝えるため採用した。
