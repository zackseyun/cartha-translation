  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂οὐκ ἔστιν ὧδε, ἀλλὰ ἠγέρθη.⸃ μνήσθητε ὡς ἐλάλησεν ὑμῖν ἔτι ὢν ἐν τῇ Γαλιλαίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/006.yaml
  text: He is not here[a], but has been raised. Remember how he spoke to you while he was still in Galilee,
translation:
  language: ja
  text: ここにはおられません。しかし、よみがえらされたのです[a]。まだガリラヤにおられたころ、あなたがたにどのように話されたかを思い出しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「よみがえったのです」。ギリシア語の動詞は受動態で、直訳すると「よみがえらされた」となる。
    reason: 原文の受動態と、日本語で一般的な自動詞表現との関係を示すため。
lexical_decisions:
- source_word: οὐκ ἔστιν ὧδε
  choice: ここにはおられません
  rationale: ギリシア語では主語が省略されているが、文脈上イエスを指すことは明白である。日本語では主語を補わずとも自然に理解できるため、省略を保った。ὧδε は場所を示す「ここに」とした。
- source_word: ἀλλὰ
  choice: （文を分けて対照を表現）
  rationale: 日本語では「しかし」を明示するより、「ここにはおられません。よみがえらされたのです」と二文を並べるほうが、簡潔で力強い対照を自然に示せる。
- source_word: ἠγέρθη
  choice: よみがえらされたのです
  rationale: ἐγείρω のアオリスト受動態を反映し、復活が成し遂げられた出来事であることと、暗示される神の働きを保った。「のです」により、墓にいない理由を告げる宣言として自然にした。
- source_word: μνήσθητε
  choice: 思い出しなさい
  rationale: アオリスト命令形の直接的な呼びかけを、明瞭で現代的な命令表現にした。
- source_word: ὡς ἐλάλησεν ὑμῖν
  choice: あなたがたにどのように話されたか
  rationale: ὡς の様態・内容を導く働きを「どのように」で保ち、λαλέω は過度に内容を限定しない「話す」とした。
- source_word: ἔτι ὢν ἐν τῇ Γαλιλαίᾳ
  choice: まだガリラヤにおられたころ
  rationale: ἔτι の「まだ」と、分詞句の時間的な意味を自然な日本語の従属節で表した。地名は慣用形「ガリラヤ」とした。
theological_decisions:
- issue: 復活を表す ἠγέρθη の受動態
  choice: よみがえらされたのです
  alternative: よみがえったのです／復活されたのです
  rationale: 原文の受動態を本文で保ち、暗示される神的行為を消さないようにした。同時に、別訳が復活という同じ出来事を自動詞的に表すことを脚注で示し、原文が明示していない行為者を本文に補わなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、天使の宣言と命令の簡潔さを保った。イエスへの言及には「おられる」「話される」を用いて自然な敬意を示したが、主語や復活の行為者は原文以上に補っていない。
