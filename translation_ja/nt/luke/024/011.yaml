  text: καὶ ἐφάνησαν ἐνώπιον αὐτῶν ὡσεὶ λῆρος τὰ ῥήματα ⸀ταῦτα, καὶ ἠπίστουν αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/011.yaml
  text: And these words seemed like nonsense to them, and they did not believe the women.
translation:
  language: ja
  text: しかし、彼らにはその話がたわごとのように思われ[a]、女たちを信じなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「くだらない話のように」または「うわごとのように」。ギリシア語は、意味をなさない、ばかげた話とみなされた言葉を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφάνησαν ἐνώπιον αὐτῶν
  choice: 彼らには……と思われ
  rationale: 評価を表すこの構文では、視覚的な「現れた」ではなく、「彼らには……と思われた」という意味になる。日本語では「彼らには」を先に置き、自然に視点を示した。
- source_word: ὡσεὶ λῆρος
  choice: たわごとのように
  rationale: ὡσεὶ の比喩を「ように」で保ち、λῆρος が表す、意味をなさない、ばかげた話という否定的評価を「たわごと」で簡潔に伝えた。
- source_word: τὰ ῥήματα ταῦτα
  choice: その話
  rationale: 直訳的な「これらの言葉」よりも、直前に女たちが語った内容を指す日本語として自然であり、複数の発言内容を一まとまりの報告として表す。
- source_word: ἠπίστουν
  choice: 信じなかった
  rationale: 未完了過去の継続的な不信を、過度に意志性を加える「信じようとしなかった」ではなく、自然な「信じなかった」で表した。
- source_word: αὐταῖς
  choice: 女たちを
  rationale: 女性複数代名詞の指示対象は直前の文脈に登場する女たちである。日本語の「彼女たち」よりも指示対象が明確で自然なため、名詞で示した。
- source_word: καί
  choice: しかし
  rationale: 前節で女たちが使徒たちに出来事を告げたことと、彼らがそれを信じなかったことの対照を、日本語で自然な逆接として表した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「たわごと」は強い否定的評価を保ちながら、本文の反応を簡潔に伝える。語順は「彼らには」を前置して判断主体を明確にし、後半では同じ主語を自然に省略した。
