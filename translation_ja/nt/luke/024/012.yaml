id: LUK.24.12
reference: Luke 24:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂Ὁ δὲ Πέτρος ἀναστὰς ἔδραμεν ἐπὶ τὸ μνημεῖον· καὶ παρακύψας βλέπει τὰ ⸀ὀθόνια μόνα· καὶ ἀπῆλθεν πρὸς ⸀αὑτὸν θαυμάζων τὸ γεγονός.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/012.yaml
  text: But Peter got up and ran to the tomb; and stooping to look in, he sees the linen cloths alone, and he went away to himself, marveling at what had happened.
translation:
  language: ja
  text: しかし、ペトロは立ち上がって墓へ走った。身をかがめて中をのぞくと、亜麻布だけが見えた。そこで彼は、起こったことに驚きながら、自分のところへ帰って行った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分のところへ」は、自宅または滞在先へ帰ったという意味とも、「自分自身のもとへ」とも取れる表現。
    reason: πρὸς αὑτόν の意味と構文には解釈上の幅があり、日本語本文だけではその曖昧さが見えにくいため。
lexical_decisions:
- source_word: μνημεῖον
  choice: 墓
  rationale: 遺体を納める墓を指す文脈であり、現代日本語で自然かつ明瞭。
- source_word: παρακύψας
  choice: 身をかがめて中をのぞくと
  rationale: 入口から身をかがめて中を見る動作を具体的に表す。
- source_word: τὰ ὀθόνια μόνα
  choice: 亜麻布だけ
  rationale: ὀθόνια は遺体を包む亜麻布を指し、μόνα の『それだけ』という限定を保持する。
- source_word: βλέπει
  choice: 見えた
  rationale: 歴史的現在の臨場感を、日本語の物語として自然な過去時制で表した。直訳的には『見る』。
- source_word: πρὸς αὑτόν
  choice: 自分のところへ
  rationale: 本文の表現をなるべく保ち、帰宅を意味する可能性と『自分自身のもとへ』という字義上の含みを注で示す。
- source_word: θαυμάζων
  choice: 驚きながら
  rationale: 不思議に思う、驚嘆するという意味を、文脈に即して過度な解釈なしに表す。
theological_decisions:
- issue: ペトロが向かった先を示す πρὸς αὑτόν の解釈
  choice: 自分のところへ帰って行った
  alternative: 驚嘆しながら一人で帰って行った／自分自身の内で驚きながら立ち去った
  rationale: 通常は自宅または滞在先へ戻る意味に理解されるが、ギリシア語表現には字義上の曖昧さがあるため、本文では直訳寄りにし、注で別の理解を示した。
- issue: βλέπει の歴史的現在
  choice: 見えた
  alternative: 見る
  rationale: 時制そのものに教理的含意はなく、現代日本語の物語としての自然さを優先しつつ、原文が現在形で場面を生き生きと描くことは注記不要と判断した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、叙事の簡潔さと品位を保った。「ペトロ」はギリシア語名 Πέτρος に対応する一般的な表記。原文の歴史的現在は日本語の自然な過去叙述に整えた。
