source:
  edition: SBLGNT
  text: καὶ ἀναστάντες αὐτῇ τῇ ὥρᾳ ὑπέστρεψαν εἰς Ἰερουσαλήμ, καὶ εὗρον ⸀ἠθροισμένους τοὺς ἕνδεκα καὶ τοὺς σὺν αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/033.yaml
  text: And rising that very hour[a], they returned to Jerusalem and found the Eleven and those with them gathered together,
translation:
  language: ja
  text: 彼らはその時すぐに立ち上がってエルサレムに戻り、十一人と彼らと共にいた人々が集まっていた[a]のを見つけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「集められていた」。ギリシア語は完了受動分詞で、彼らが見つけられた時には、すでに集まった状態にあったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστάντες
  choice: 立ち上がって
  rationale: アオリスト分詞を主動詞に先立つ動作として自然に表し、身体的に立ち上がる動作を保った。
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: まさにその時
  rationale: 特定の時点との結びつきと強調を保ち、単なる「すぐに」への言い換えを避けた。
- source_word: ὑπέστρεψαν
  choice: 戻り
  rationale: 移動の文脈におけるὑποστρέφωの標準的な意味を簡潔に表した。
- source_word: Ἰερουσαλήμ
  choice: エルサレム
  rationale: 現代日本語で定着した地名表記を用いた。
- source_word: εὗρον
  choice: 見いだした
  rationale: εὑρίσκωの基本的意味を保ちつつ、人々がある状態にあるのを認めたという補語構文に対応させた。
- source_word: ἠθροισμένους
  choice: 集まっている
  rationale: 完了受動分詞が示す、すでに集められてその状態にあることを日本語の継続状態で表した。
- source_word: τοὺς ἕνδεκα
  choice: 十一人
  rationale: 原文の定着した集団呼称をそのまま訳し、「使徒」など原文にない説明を加えなかった。
- source_word: τοὺς σὺν αὐτοῖς
  choice: 彼らと一緒にいた人々
  rationale: 十一人と共にいた他の人々を指す表現を、対象を限定しすぎず明確に訳した。
theological_decisions:
- issue: ユダの不在後の集団を「十一人」と呼ぶこと、および全員がその場にいたかどうか
  choice: 集団呼称として「十一人」を保持する
  alternative: 「十一人の使徒たち」または「残った弟子たち」
  rationale: τοὺς ἕνδεκαというルカの表現を保ち、その場の正確な人数や構成について調和的説明を加えない。
- issue: ἠθροισμένουςが修飾する範囲
  choice: 「十一人」と「彼らと一緒にいた人々」の双方が集まっていると訳す
  alternative: 「十一人」だけが集まっていると訳す
  rationale: 一つの冠詞句として並ぶ二つの目的語全体が分詞によって状態づけられているというギリシア語の自然な構造を反映した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、物語文としての品位を保った。「まさにその時」で原文の時間的強調を残し、「見いだした」はεὗρονと目的格補語構文を明示するため、やや格調のある語を選んだ。
