lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: 中に入ってみると
  rationale: アオリスト能動分詞・女性複数で、前節の女たちを受ける。時間的なつながりを自然な現代日本語で表し、「中に」は墓の内部に入ったことを文脈に即して示す。「みると」は試行よりも、入った結果として予想外の事態を目にしたという叙述の流れを表す。
- source_word: δὲ
  choice: しかし
  rationale: 物語を進めつつ、墓に来た女たちの予想に反する結果との軽い対照を示すため、「しかし」とした。
- source_word: οὐχ εὗρον
  choice: 見当たらなかった
  rationale: 単純な否定過去である。日本語では、そこにあるはずのものが見つからない場面に自然な「見当たらなかった」で叙述の簡潔さを保つ。
- source_word: τὸ σῶμα
  choice: その体
  rationale: σῶμαの基本義を「体」とした。「遺体」も文脈上可能だが、原語以上に死体として固定せず、復活物語における身体との語彙的つながりを保つ。定冠詞は、文脈上すでに特定されているイエスの体を指すため「その」で表した。
theological_decisions:
- issue: 誰の体かを本文で明示するか
  choice: その体
  alternative: 主イエスの体
  rationale: 提示されたSBLGNT本文はτὸ σῶμα（「その体」）のみであり、「主イエスの」は含まない。より長い異読を本文へ取り込まず、写本上の相違は脚注で示す。
translation_notes:
  register: 明瞭で自然な現代標準日本語。簡潔な物語調と節度ある格調を保ち、原文の省略と本文異読を区別した。
