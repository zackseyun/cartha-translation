  text: But when they entered[a], they did not find the body.
translation:
  language: ja
  text: しかし、女たちが中に入ると[a]、体は見当たらなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「主イエスの体」とあります。
