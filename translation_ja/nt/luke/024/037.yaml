  text: πτοηθέντες δὲ καὶ ἔμφοβοι γενόμενοι ἐδόκουν πνεῦμα θεωρεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/037.yaml
  text: But being startled and becoming afraid[a], they thought they were seeing a spirit.
translation:
  language: ja
  text: しかし、彼らはぎょっとして恐ろしくなり、霊[a]を見ているのだと思った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幽霊」。ギリシア語はπνεῦμαで、より直訳的には「霊」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πτοηθέντες
  choice: ぎょっとして
  rationale: 突然の衝撃や動揺を表し、後続する明示的な恐れと不必要に重ならない自然な現代語とした。
- source_word: δὲ
  choice: しかし
  rationale: 直前のイエスの出現と弟子たちの反応との展開上の対照を示す。
- source_word: ἔμφοβοι γενόμενοι
  choice: 恐れ
  rationale: 恐れの状態になったという変化を簡潔に表す。日本語では「恐れるようになり」より、この場面の即時的反応として自然である。
- source_word: ἐδόκουν
  choice: と思った
  rationale: 彼らがその時抱いていた判断・思い込みを自然に表す。未完了過去の継続的側面は、後続する「見ている」で補われる。
- source_word: πνεῦμα
  choice: 霊
  rationale: 語の直接的な対応を保ち、復活したイエスを非身体的存在と誤認したという文脈を、民間伝承的含意を加えずに伝える。
- source_word: θεωρεῖν
  choice: 見ている
  rationale: 現在不定詞が表す、現に目の前で見ているという継続的な知覚を反映する。
theological_decisions:
- issue: 復活顕現の文脈における πνεῦμα の訳
  choice: 霊
  alternative: 幽霊
  rationale: 「霊」は πνεῦμα により直接的であり、弟子たちがイエスを身体のない存在と思ったという物語上の緊張を保つ。「幽霊」も文脈上可能だが、原語にない民間的・文化的連想を帯びやすい。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「ぎょっとして」で突然の驚愕を、「恐れ」で続く恐怖を区別した。簡潔さと品位を保ちつつ、原文の分詞構文を無理に逐語化していない。
