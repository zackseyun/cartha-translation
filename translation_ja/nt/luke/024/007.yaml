source:
  edition: SBLGNT
  text: λέγων ⸂τὸν υἱὸν τοῦ ἀνθρώπου ὅτι δεῖ⸃ παραδοθῆναι εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν καὶ σταυρωθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/007.yaml
  text: saying that the Son of Man must be delivered into the hands of sinful men and be crucified and on the third day rise again[a][b].
translation:
  language: ja
  text: 「人の子は、罪深い者たちの手に引き渡され[a]、十字架につけられ、三日目によみがえらなければならない」と言っておられたことを。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「渡され」。ここでは、裏切りだけでなく、人の支配下に引き渡されることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: 「……」と言われたことを
  rationale: 現在分詞は前節の「語られたことを思い出しなさい」に従属する。節を独立した発言に変えず、日本語でも前節から続く目的語として表した。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの自己呼称として定着しており、ダニエル書との相互本文的な響きも保つ。
- source_word: ὅτι δεῖ
  choice: ……なければならない
  rationale: 単なる未来予告ではなく、神の計画に基づく必然性を示す δεῖ の力を自然な日本語で保つ。
- source_word: παραδοθῆναι
  choice: 引き渡され
  rationale: 逮捕と処刑に至るまで他者の権力下へ渡されることを表す受動形。ユダの裏切りだけに限定する「裏切られ」は避けた。
- source_word: εἰς χεῖρας ἀνθρώπων ἁμαρτωλῶν
  choice: 罪深い者たちの手に
  rationale: 「手に」という支配・権力の比喩を保った。「者たち」は ἀνθρώπων を明示しつつ、文脈上の実行者を自然に指す。
- source_word: σταυρωθῆναι
  choice: 十字架につけられ
  rationale: 受動不定詞が表す十字架刑を、標準的で明確な日本語にした。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 三日目に
  rationale: 時を示す与格を簡潔かつ自然に表した。
- source_word: ἀναστῆναι
  choice: よみがえらなければならない
  rationale: 能動形の不定詞を、自動詞「よみがえる」で表した。「よみがえらされる」という受動的な表現にはしなかった。
theological_decisions:
- issue: 受難予告における δεῖ の意味
  choice: 「なければならない」とし、神の計画に基づく必然性を示す
  alternative: 単なる未来として「ことになる」「だろう」とする
  rationale: ルカ文書で δεῖ はしばしば神の救済計画の成就に伴う必然性を示すため、その神学的重みを説明しすぎずに保持した。
- issue: ἀναστῆναι の態
  choice: 能動・自動詞の「よみがえる」
  alternative: 受動的な「よみがえらされる」
  rationale: この箇所のギリシア語は能動形である。神がよみがえらせるという他箇所の表現をここへ持ち込まず、本文の態を保った。
- issue: ἀνθρώπων ἁμαρτωλῶν の指示範囲
  choice: 罪深い者たち
  alternative: 罪人たち／罪深い男たち
  rationale: 人間である実行者を明示しつつ、ギリシア語の文法的男性複数だけを根拠に日本語で性別を過度に強調しない。文脈上の具体的な実行者も排除しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、受難予告にふさわしい簡潔で荘重な調子とした。前節への文法的なつながりを保つため、意図的に「ことを」で結ぶ形にしている。
