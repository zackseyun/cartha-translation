  naturalness: 全体として明快だが、「私たちの心は内で燃えていた」は「内で」の指示対象がやや不自然である。「私たちの心の内で」とすると、現代標準日本語として滑らかである。
  terminology: 「心」「聖書」「解き明かす」は適切である。「解き明かす」はここでのδιανοίγωの比喩的用法を自然に表す。「くださった」は原文にない敬語的な視点を加え、直前の「語り」とも敬語の統一が取れていないため、本文では用いない。
