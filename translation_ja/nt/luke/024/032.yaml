  rationale: 歩行を明示する語を「道で」に改め、未完了過去の継続的な二つの行為を「語り、…解き明かしていた」で保った。「その内で」は直前の「私たちの心」を受け、ἐν ἡμῖνの内面的な場所を不自然な重複なく示す。比喩的な「燃える」と肯定を期待する修辞疑問は維持した。
