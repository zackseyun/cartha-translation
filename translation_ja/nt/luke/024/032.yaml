  text: καὶ εἶπαν πρὸς ἀλλήλους· Οὐχὶ ἡ καρδία ἡμῶν καιομένη ἦν ⸂ἐν ἡμῖν⸃ ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ, ⸀ὡς διήνοιγεν ἡμῖν τὰς γραφάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/032.yaml
  text: And they said to one another[a], “Was not our heart burning within us as he was speaking to us on the road[c][b], as he was opening the Scriptures to us?”
translation:
  language: ja
  text: 二人は互いに言った。「あの方が道で私たちに語り、聖書を解き明かしていたとき、私たちの心はその内で燃えていたではないか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ἀλλήλους
  choice: 互いに
  rationale: 相互に語り合うことを表す自然で簡潔な現代日本語。
- source_word: Οὐχὶ ... ἦν
  choice: 燃えていたではないか
  rationale: 肯定の答えを予期する修辞疑問の力を保つ。
- source_word: ἡ καρδία ἡμῶν
  choice: 私たちの心
  rationale: 原文の単数形を保ち、二人に共通する内的な反応として表現する。
- source_word: καιομένη
  choice: 燃えていた
  rationale: 感情的、霊的、認識的な経験のいずれかに限定せず、原文の比喩をそのまま保つ。
- source_word: ἐν ἡμῖν
  choice: 内で
  rationale: 彼らの内面で生じた経験を簡潔に示す。
- source_word: ὡς ἐλάλει ἡμῖν ἐν τῇ ὁδῷ
  choice: あの方が道を歩きながら私たちに語り
  rationale: 未完了過去の継続性と旅の途上という場面を自然な日本語で表す。
- source_word: ὡς διήνοιγεν ἡμῖν τὰς γραφάς
  choice: 聖書を解き明かしてくださったとき
  rationale: διανοίγωの「開く」という比喩がこの文脈では意味を明らかにすることを指すため、日本語で定着した「解き明かす」を用いる。未完了過去の継続性は、直前の「語り」と一続きの時間表現によって伝える。
theological_decisions:
- issue: 「心が燃える」という比喩の意味
  choice: 「私たちの心は内で燃えていた」と比喩を保持する
  alternative: 「深く感動していた」「霊的に目が開かれていた」
  rationale: 原文はその経験を感情、霊的作用、理解の深まりのいずれか一つに限定していないため、解釈を狭めず比喩と緊張を残す。
- issue: 「聖書を開く」の表現
  choice: 「聖書を解き明かす」
  alternative: 「聖書を開く」
  rationale: 物理的に巻物を開くことではなく、聖書の意味を理解できるようにする文脈上の比喩である。「解き明かす」は意味を不当に具体化せず、現代日本語で自然にその機能を伝える。
translation_notes:
  register: 明快で品位ある現代標準日本語。「あの方」は復活したイエスを指す文脈に適し、過度に宗教語的な言い換えを避けた。修辞疑問は「ではないか」で再現した。
