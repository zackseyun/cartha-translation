base_translation:
  language: en
  yaml_path: translation/nt/luke/024/035.yaml
  text: And they themselves were recounting the things that had happened on the road[b][a], and how he was made known to them in the breaking of the bread.
translation:
  language: ja
  text: 二人もまた、道中での出来事と、パンを裂くときにイエスが彼らにどのように知られるようになったかを語っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らはイエスだと分かった」。ギリシア語は受動形で、彼らがイエスを認めたことにも、イエスが彼らに知られるようになったことにも重点を置き得る。
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτοὶ
  choice: 二人も
  rationale: 直前に戻って来た二人の弟子を明示し、καὶ と強意代名詞 αὐτοὶ が示す「彼らの側でも」という文脈上の強調を自然な日本語で表した。
- source_word: ἐξηγοῦντο
  choice: 語った
  rationale: 出来事を順に詳しく報告する意味。日本語では継続相を無理に明示せず、「語った」で自然に叙述する。
- source_word: τὰ ἐν τῇ ὁδῷ
  choice: 道中での出来事
  rationale: 直訳的には「道でのこと」。省略された内容を日本語として自然に補い、エマオへの途上で起きた事柄を指すことを示す。
- source_word: ὡς
  choice: 次第
  rationale: 認知がどのように生じたかという様態・経緯を導く語として訳した。
- source_word: ἐγνώσθη αὐτοῖς
  choice: イエスが彼らに知られた
  rationale: 受動形を保ち、弟子たちが認識したことと、イエスが彼らに示されたこととの両方を含み得る原文の緊張を残した。日本語では主語を補って指示対象を明確にした。
- source_word: ἐν τῇ κλάσει τοῦ ἄρτου
  choice: パンを裂いたときに
  rationale: 名詞句を自然な現代日本語の時を表す節にした。定冠詞は直前の具体的な食事場面によって文脈上表現される。
theological_decisions:
- issue: ἐγνώσθη を人間側の認知として訳すか、受動の含みを残すか
  choice: 「イエスが彼らに知られた」と受動で表現する。
  alternative: 「彼らがイエスだと分かった」
  rationale: 原文の受動態は、弟子たちによる認知にも、イエスが知らされるに至ったことにも重心を置き得る。直前の24章31節との関係を踏まえつつ、神的働きを訳文で断定せず曖昧さを保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「パンを裂く」は聖書的背景を持つ表現だが、この具体的な食事場面でも無理なく理解できる。
