  text: Καὶ ἰδοὺ δύο ἐξ αὐτῶν ⸂ἐν αὐτῇ τῇ ἡμέρᾳ ἦσαν πορευόμενοι⸃ εἰς κώμην ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ, ᾗ ὄνομα Ἐμμαοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/013.yaml
  text: And behold[a], two of them were going that very day to a village sixty stadia from Jerusalem, whose name was Emmaus,
translation:
  language: ja
  text: すると、見よ、ちょうどその日、彼らのうちの二人が、エルサレムから六十スタディオン[a]離れた、エマオという名の村へ向かっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: スタディオンは古代の距離の単位。六十スタディオンは約十一キロメートルに当たる。
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: すると、見よ
  rationale: 物語の展開を示す接続と、読者の注意を促す表現の力を保った。「見よ」はやや格調があるが、明瞭であり、原文の談話上の働きを省略しない。
- source_word: δύο ἐξ αὐτῶν
  choice: 彼らのうちの二人
  rationale: 部分を表す表現を自然な日本語で訳し、文脈以上に彼らの身分を特定しない。
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: ちょうどその日
  rationale: 強調された「その同じ日」という意味と、出来事の時間的な近さを自然に表す。
- source_word: ἦσαν πορευόμενοι
  choice: 向かっていた
  rationale: 迂言的未完了過去が表す、過去に進行中だった移動を日本語の継続表現で示す。目的地への移動も明確になる。
- source_word: εἰς κώμην
  choice: 村へ
  rationale: κώμηを規模に即して「村」とし、方向を表すεἰςを自然な助詞「へ」で訳した。
- source_word: ἀπέχουσαν σταδίους ἑξήκοντα ἀπὸ Ἰερουσαλήμ
  choice: エルサレムから六十スタディオン離れた
  rationale: 原文の古代の距離単位を本文に保持し、現代の概算値は脚注で補った。
- source_word: ᾗ ὄνομα Ἐμμαοῦς
  choice: エマオという名の
  rationale: 名称を明示する原文の関係節を簡潔で自然な日本語にしつつ、「名」という要素を保持した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「見よ」によって原文の注意喚起を保ち、聖書本文としての格調も維持した。古代の単位は音写して本文に残し、読者に必要な換算を脚注に置いた。
