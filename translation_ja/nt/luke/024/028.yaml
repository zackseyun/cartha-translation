id: LUK.24.28
reference: Luke 24:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἤγγισαν εἰς τὴν κώμην οὗ ἐπορεύοντο, καὶ αὐτὸς ⸀προσεποιήσατο ⸀πορρώτερον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/028.yaml
  text: And they came near to the village where they were going[a], and he acted as though he were going farther.
translation:
  language: ja
  text: 一行が目指していた村に近づくと、イエスはさらに先へ行くような様子を見せた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「さらに先へ行くふりをした」または「さらに先へ行こうとするそぶりを見せた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγγισαν
  choice: 近づくと
  rationale: 村への接近を表すアオリストを、物語の流れに自然な「近づくと」で表した。
- source_word: κώμην
  choice: 村
  rationale: κώμηは通常、都市より小規模な集落を指すため、「村」とした。
- source_word: οὗ ἐπορεύοντο
  choice: 目指していた
  rationale: 継続中の旅の目的地を示す表現として、自然な現代日本語にした。
- source_word: προσεποιήσατο
  choice: 行くような様子を見せた
  rationale: 実際に先へ進む印象を与えたという叙述を保ちつつ、「ふりをした」が帯び得る欺瞞の含意を本文で必要以上に強めない表現とした。
- source_word: πορρώτερον
  choice: さらに先へ
  rationale: 移動距離の比較を表す副詞を、文脈に即して自然に訳した。
- source_word: πορεύεσθαι
  choice: 行く
  rationale: προσεποιήσατοを補う不定詞として、先へ進むという見かけ上の行動を簡潔に表した。
theological_decisions:
- issue: イエスの行動に関する προσεποιήσατο の訳し方
  choice: さらに先へ行くような様子を見せた
  alternative: さらに先へ行くふりをした
  rationale: ギリシア語が持つ「そのように見せる／ふりをする」という幅を踏まえ、欺きだったとの判断を本文で確定せず、物語上の緊張を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語。一行の主語を明示し、文脈上の人物を「イエス」と補って読みやすくした。
