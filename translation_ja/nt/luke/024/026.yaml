  yaml_path: translation/nt/luke/024/026.yaml
  text: Was it not necessary for the Messiah to suffer these things and to enter into his glory?[a]
translation:
  language: ja
  text: メシア[a]がこれらの苦しみを受け、自分の栄光に入ることは、必要ではなかったか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語の「クリストス」は「油を注がれた者」を意味する称号。ここでは、聖書の成就という文脈を明確にするため「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχὶ ... ἔδει
  choice: 必要ではなかったか
  rationale: 肯定の答えを予期する修辞疑問と、文脈上の神的・聖書的必然性を、自然な現代日本語で保つ。
- source_word: ταῦτα παθεῖν
  choice: これらの苦しみを受け
  rationale: ταῦταが直前までに語られた出来事を指すことを示しつつ、日本語では「これらを苦しむ」より自然に表現する。
- source_word: τὸν χριστόν
  choice: メシア
  rationale: Χριστόςはここで固有名ではなく、聖書の成就に関わる称号として機能しているため、その意味が伝わる訳語を用いる。
- source_word: καὶ εἰσελθεῖν
  choice: …受け、…入る
  rationale: 二つの不定詞を並列させるκαίを保ち、「その後」など原文に明示されない語は加えない。
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: ご自分の栄光に入る
  rationale: εἰςの到達・移行の意味とαὐτοῦの所有関係を保つ。「ご自分の」は主語であるメシアを明確に指す自然な敬語表現。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: 預言と聖書成就を論じる文脈で称号としての意味を明確にする。別訳も脚注に残す。
- issue: ἔδειの必然性
  choice: 必要ではなかったか
  alternative: そうならなければならなかったのではないか
  rationale: 神の計画・聖書の成就に基づく必然性を含み得るが、説明を本文へ追加せず、原文の簡潔さと含意を保つ。
- issue: 「栄光」の所属と意味
  choice: ご自分の栄光
  alternative: 定められた栄光
  rationale: αὐτοῦを直接訳し、復活・高挙など特定の解釈へ本文で限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。修辞疑問の力を保ち、「苦しみを受ける」「栄光に入る」という聖書的表現を過度に説明せず残した。
