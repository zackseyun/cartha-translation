id: LUK.24.45
reference: Luke 24:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε διήνοιξεν αὐτῶν τὸν νοῦν τοῦ συνιέναι τὰς γραφάς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/045.yaml
  text: Then he opened their minds to understand the Scriptures[b][a],
translation:
  language: ja
  text: その時、イエスは聖書を理解できるように、彼らの心を開いた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼らの理解力を開いた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 物語の順序を示す時間副詞。簡潔で自然な日本語として「その時」とした。
- source_word: διήνοιξεν
  choice: 開いた
  rationale: διανοίγωの具体的な比喩を保ち、「理解させた」と意訳しすぎないようにした。
- source_word: αὐτῶν τὸν νοῦν
  choice: 彼らの心
  rationale: νοῦςは理解・認識を担う内的機能を指す。「理解力」も可能だが、「開く」という比喩を自然に保つため「心」とした。
- source_word: τοῦ συνιέναι
  choice: 理解できるように
  rationale: 冠詞付き不定詞が表す目的または結果を、両者を過度に限定せず自然な日本語で表した。
- source_word: τὰς γραφάς
  choice: 聖書
  rationale: この文脈ではイスラエルの聖なる諸文書を指す。日本語で確立した総称「聖書」が適切である。
theological_decisions:
- issue: イエスが彼らの理解を開いたという行為の性質
  choice: 「彼らの心を開いた」という直接的な表現を保持する。
  alternative: 「彼らに理解させた」「彼らに聖書を説明した」
  rationale: 原文の比喩と、イエスが主体となって理解を開くという主張を保ちつつ、照明に関する後代の教理や、単なる説明という解釈を持ち込まない。
- issue: τοῦ συνιέναιの目的・結果の含み
  choice: 「理解できるように」
  alternative: 「理解するために」
  rationale: ギリシア語の属格冠詞付き不定詞は目的ないし結果を表し得るため、自然な日本語の中でその幅を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「心を開いた」という原文の比喩を維持し、目的・結果の表現は日本語として自然な「理解できるように」とした。
