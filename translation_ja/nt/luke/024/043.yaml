  text: καὶ λαβὼν ἐνώπιον αὐτῶν ἔφαγεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/043.yaml
  text: And taking it[a], he ate it before them.
translation:
  language: ja
  text: そして、それを取ると、彼らの前で食べた。 [a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「取って」「食べた」の目的語は明示されていない。前節の文脈から、魚の一切れを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節から続く動作を自然につなぐ標準的な接続表現。ギリシア語以上の時間的意味は加えない。
- source_word: λαβὼν
  choice: 受け取って
  rationale: λαμβάνω のアオリスト能動分詞で、主動詞に先立つ付帯動作を表す。日本語では「受け取って」と接続することで自然に表現でき、目的語は前節から理解できるため本文では補わない。
- source_word: ἐνώπιον αὐτῶν
  choice: 彼らの前で
  rationale: 彼らの面前、すなわち目の届くところで行われたことを簡潔に表し、この場面の目撃性も保つ。
- source_word: ἔφαγεν
  choice: 食べた
  rationale: ἐσθίω のアオリスト直説法で、完結した出来事を物語る。目的語は前節の魚から明らかで、日本語では省略しても自然である。
theological_decisions:
- issue: 分詞と主動詞の省略された目的語を本文で明示するか
  choice: 日本語本文では目的語を補わず、「受け取って…食べた」とする
  alternative: 「それを受け取って、彼らの前で食べた」
  rationale: ギリシア語には直接目的語が明示されておらず、前節の魚の一切れから補われる。日本語では目的語を省略しても自然かつ明瞭なので、原文の省略を保つ。何を食べたかは脚注で示し、復活したイエスが弟子たちの面前で実際に食べたという叙述を過度に解説しない。
translation_notes:
  register: 明快で現代的かつ品位ある物語文。「彼らの前で」は日常的に理解しやすく、原文の「彼らの面前で」という意味を保つ。
