id: LUK.24.10
reference: Luke 24:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦσαν δὲ ἡ Μαγδαληνὴ Μαρία καὶ Ἰωάννα καὶ Μαρία ⸀ἡ Ἰακώβου καὶ αἱ λοιπαὶ σὺν αὐταῖς· ⸀ἔλεγον πρὸς τοὺς ἀποστόλους ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/010.yaml
  text: They were Mary Magdalene[a], Joanna, Mary the mother of James, and the other women with them; they were telling these things to the apostles.
translation:
  language: ja
  text: その女たちは、マグダラのマリア、ヨハンナ、ヤコブの母マリア[a]、そして彼女たちと一緒にいたほかの女たちであった。彼女たちは、これらのことを使徒たちに話していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では直訳すると「ヤコブのマリア」。「ヤコブの母マリア」を意味する可能性が高いが、「ヤコブの妻マリア」の可能性もある。
    reason: 原文で省略されている家族関係について、主要訳を示しつつ別の可能性を保存するため。
lexical_decisions:
- source_word: ἦσαν δὲ
  choice: その女たちは、…であった
  rationale: 直前まで述べられていた女性たちの身元を示す未完了過去。δέは弱い談話上のつながりであり、日本語では文脈と「その」によって自然に表した。
- source_word: ἡ Μαγδαληνὴ Μαρία
  choice: マグダラのマリア
  rationale: 日本語で定着した地名由来の呼称を用いた。
- source_word: Ἰωάννα
  choice: ヨハンナ
  rationale: ギリシア語の人名に即した一般的な音写。
- source_word: Μαρία ἡ Ἰακώβου
  choice: ヤコブの母マリア
  rationale: 属格だけで関係が省略されているが、福音書の人物同定表現として母を指す可能性が最も高い。原文の曖昧さは脚注に残した。
- source_word: αἱ λοιπαὶ σὺν αὐταῖς
  choice: 彼女たちと一緒にいたほかの女たち
  rationale: 女性複数形が指す名詞を補い、同行していたほかの女性たちであることを明確にした。
- source_word: ἔλεγον
  choice: 話していた
  rationale: 未完了過去の継続的な側面を自然な日本語で表した。
- source_word: πρὸς τοὺς ἀποστόλους
  choice: 使徒たちに
  rationale: イエスの使徒団を指す定着した訳語を採用した。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 複数指示代名詞が直前の出来事と知らせを受けることを保持した。
theological_decisions:
- issue: Μαρία ἡ Ἰακώβου におけるヤコブとマリアの関係
  choice: ヤコブの母マリア
  alternative: 「ヤコブの妻マリア」、または字義的に「ヤコブのマリア」
  rationale: ギリシア語は関係を明示しないが、人物同定の慣用と文脈から「母」が最も可能性が高く、日本語としても明瞭である。ただし原文上は妻を意味する可能性も排除できないため、脚注で示した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体。「女たち」は文脈上明確な指示対象を保ち、二つの主節を分けてギリシア語の構造と未完了過去の継続性を表した。
