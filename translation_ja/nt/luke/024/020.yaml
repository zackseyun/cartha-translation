  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅπως τε παρέδωκαν αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ἄρχοντες ἡμῶν εἰς κρίμα θανάτου καὶ ἐσταύρωσαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/020.yaml
  text: and how our chief priests and rulers handed him over to a sentence of death and crucified him[a][b].
translation:
  language: ja
  text: そして、私たちの祭司長たちと指導者たちが、この方を死刑の判決を受けるように引き渡し[a]、十字架につけた[b]ことです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死刑に定めるために引き渡し」または「死刑の判決に引き渡し」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「十字架につけさせた」。実際の処刑をローマ当局が執行したとしても、指導者たちにその責任があることを明示する訳。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπως τε
  choice: そして、…ことです
  rationale: 前節から続く説明内容を導くὅπωςと、接続の力を持つτεを、現代日本語として自然な文のつながりで表した。
- source_word: παρέδωκαν
  choice: 引き渡し
  rationale: 司法的な文脈で、権力者の手に渡したことを示す。『裏切った』という限定的な意味は持ち込まない。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 第二神殿期のユダヤ教指導層を指す慣用的で明瞭な訳語であり、複数の大祭司が同時に在職していたとの誤解も避けられる。
- source_word: οἱ ἄρχοντες ἡμῶν
  choice: 私たちの…指導者たち
  rationale: ἄρχοντεςの統治・指導上の立場と、ἡμῶνが示す話者たちの共同体への帰属を保った。
- source_word: εἰς κρίμα θανάτου
  choice: 死刑の判決を受けるよう
  rationale: κρίμαの司法的な『判決・有罪宣告』と、θανάτουが示す死という刑罰を、自然な現代日本語で表した。εἰςの方向・帰結は『受けるよう』で示し、目的とも帰結とも取り得る幅を過度に狭めないようにした。
- source_word: ἐσταύρωσαν
  choice: 十字架につけた
  rationale: 能動態の直接的な表現を維持し、祭司長たちと指導者たちに責任を帰す原文の修辞的・道徳的な力を保った。
theological_decisions:
- issue: イエスの処刑における行為主体
  choice: 『十字架につけた』と能動的に訳す
  alternative: 『十字架につけさせた』
  rationale: 原文では祭司長たちと指導者たちを主語とする能動態が用いられている。ローマ側が実際の処刑を執行したという歴史的媒介を訳文に補わず、彼らに責任を帰す本文の表現を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、司法的な場面にふさわしい品位を保った。『この方』は直前から語られているイエスを自然に指し示す表現である。脚注記号は該当箇所の直後に配置した。
