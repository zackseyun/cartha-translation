  rationale: αὐτόςによる人物同定の強調を保持した。
- source_word: ἐγγίσας
  choice: 近づいて来て
  rationale: 彼らのところへ接近する動きを自然な日本語で示した。
- source_word: συνεπορεύετο
  choice: 一緒に歩いておられた
  rationale: 未完了過去が示す継続的な同行を表し、文脈上の徒歩での旅に即した。
theological_decisions:
