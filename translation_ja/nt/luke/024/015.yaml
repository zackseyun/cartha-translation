- source_word: ἐγένετο ἐν τῷ
  choice: 〜していると
  rationale: ルカの叙述上の移行句と時間を表す構文を、現代日本語で自然な出来事の展開として表した。
- source_word: ὁμιλεῖν
  choice: 語り合い
  rationale: 互いに会話するという通常の意味を簡潔に表す。
- source_word: συζητεῖν
