  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν λαβὼν τὸν ἄρτον εὐλόγησεν καὶ κλάσας ἐπεδίδου αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/030.yaml
  text: And it happened that[a], when he reclined at the table with them, he took the bread, blessed it, and after breaking it[b], began giving it to them.
translation:
  language: ja
  text: そして、イエスが彼らとともに食卓に着いた[a]ときのことである。イエスはパンを取り、祝福し、それを裂いて、彼らに渡し始めた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼らとともに食卓で横たわった」。当時の食事では、寝台にもたれて横たわる姿勢を取ることがあった。
    reason: cultural_note
  - marker: b
    text: 「彼らに渡していた」とも訳せる。ギリシア語の未完了過去は動作の継続を表すことがあり、文脈によっては動作の開始を表すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ときのことである
  rationale: ルカに特徴的な物語の移行表現を省かず、古風な言い回しを避けて自然な現代日本語で表した。
- source_word: ἐν τῷ κατακλιθῆναι αὐτὸν μετ’ αὐτῶν
  choice: イエスが彼らとともに食卓に着いたとき
  rationale: 冠詞付き不定詞とἐνの時間的用法を「とき」とした。κατακλίνωは当時の食事姿勢である横臥を指すが、本文では自然な「食卓に着く」とし、文化的具体性は脚注に残した。代名詞の指示対象は文脈上明白なため「イエス」と明示した。
- source_word: λαβὼν τὸν ἄρτον
  choice: パンを取り
  rationale: アオリスト分詞を後続動作との自然な連続として訳した。定冠詞は、食卓にあった特定のパンを文脈が示すものの、日本語では無標が自然である。
- source_word: εὐλόγησεν
  choice: 祝福し
  rationale: 原文には明示的な目的語がないため、「パンを祝福した」「祝福を唱えた」のいずれかに限定せず、簡潔な表現で曖昧さを保った。εὐχαριστέωではないので「感謝した」とはしなかった。
- source_word: κλάσας
  choice: それを裂いて
  rationale: アオリスト分詞が主要動詞に先立つ動作を示すことを、自然な動作の順序として表した。「それ」はパンを明確に受ける。
- source_word: ἐπεδίδου
  choice: 配り始めた
  rationale: 未完了過去の継続性または起動的な含みのうち、この場面で配布が開始されたことを自然に表す訳を採用した。継続的な「配っていた」も可能なので脚注に示した。
theological_decisions:
- issue: 食事の動作に聖餐・秘跡的な含意をどこまで持たせるか
  choice: 本文では通常の食事の動作として訳し、原文の「取る・祝福する・裂く・配る」という連なりをそのまま保つ
  alternative: 主の晩餐をより直接的に想起させる教会用語を用いる
  rationale: この動作の連なりには先行する食事記事との響きがあるが、節そのものはこれを秘跡的儀式と明示していないため、特定教派の解釈を本文に加えない。
- issue: εὐλόγησενの対象
  choice: 目的語を補わず「祝福し」とする
  alternative: 「パンを祝福し」または「神をほめたたえ」
  rationale: ギリシア語本文は目的語を明示しておらず、食事の祝福について複数の自然な理解がありうるため、その緊張を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、ルカの物語的な導入句は保持した。過度な敬語や古語を避けつつ、聖書本文としての簡潔さと品位を保った。
