  text: καὶ ἐγένετο ἐν τῷ εὐλογεῖν αὐτὸν αὐτοὺς διέστη ἀπ’ αὐτῶν ⸂[καὶ ἀνεφέρετο εἰς τὸν οὐρανόν]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/051.yaml
  text: And it happened that[a], while he was blessing them, he parted from them and was carried up into heaven.
translation:
  language: ja
  text: そして、イエスが彼らを祝福しておられる間に、彼らから離れ、天に上げられた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そして、天に上げられた」という部分を欠く写本もある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο
  choice: 独立した定型句としては訳出せず、「間に」という自然な時間構文に統合
  rationale: ルカに多い出来事導入の定型表現。日本語で「そして、…ということが起こった」とすると重く不自然になるため、出来事の展開を示す「そして」と従属節の構成で機能を保った。
- source_word: ἐν τῷ εὐλογεῖν αὐτὸν αὐτούς
  choice: イエスが彼らを祝福しておられる間に
  rationale: ἐν＋冠詞付き不定詞の同時進行を「間に」で表した。「しておられる」は動作の継続と、イエスに対する自然で敬意ある日本語を両立する。代名詞の連続による曖昧さを避けるため、主語を「イエス」と明示した。
- source_word: εὐλογεῖν
  choice: 祝福しておられる
  rationale: 宗教的文脈でも一般読者に理解できる標準的な訳語「祝福する」を用い、進行中の動作を表した。
- source_word: διέστη ἀπ’ αὐτῶν
  choice: 彼らから離れ
  rationale: 物理的な分離・立ち去りを簡潔に表す。後続する上昇の節とのつながりも自然である。
- source_word: ἀνεφέρετο
  choice: 上げられた
  rationale: 受動形を保ち、行為主体を本文以上に特定しない。「運ばれた」より自然で、上方への移動を明確に示す。ギリシャ語の未完了的な相を日本語で過度に説明的にはしなかった。
- source_word: εἰς τὸν οὐρανόν
  choice: 天に
  rationale: この文脈のοὐρανόςは単なる空ではなく神の領域としての天を指す。「天へ」も可能だが、受動表現「上げられた」と自然に結びつく「天に」を採用した。
theological_decisions:
- issue: 括弧付き異読 καὶ ἀνεφέρετο εἰς τὸν οὐρανόν
  choice: 「天に上げられた」を本文に含め、写本上の異読を脚注で示す
  alternative: この句を本文から省く
  rationale: SBLGNTはこの句を角括弧に入れて本文に掲げ、本文批評上の不確実性を示している。提供された本文に従って訳出しつつ、省く写本があることを明記して判断を読者に隠さない。
- issue: ἀνεφέρετοの受動表現における行為主体
  choice: 「上げられた」と受動のまま訳す
  alternative: 「神によって上げられた」または「昇って行かれた」
  rationale: 原文は行為主体を明示しない。「神によって」を補わず、また自発的な上昇へと言い換えず、原文の受動性と余白を保った。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「イエス」を補って指示関係を明確にし、冗長な直訳調は避けた。脚注記号[a]は、異読の対象となる句の直後に置いた。
