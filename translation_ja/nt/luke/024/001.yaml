  text: τῇ δὲ μιᾷ τῶν σαββάτων ὄρθρου βαθέως ⸂ἐπὶ τὸ μνῆμα ἦλθον⸃ φέρουσαι ἃ ἡτοίμασαν ⸀ἀρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/001.yaml
  text: But on the first day of the week[a], at early dawn, they came to the tomb, bringing the spices they had prepared.
translation:
  language: ja
  text: しかし、週の初めの日[a]の明け方早く、女たちは用意しておいた香料を携えて墓に来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「安息日（複数形）の第一」。これは「週の初めの日」を意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ δὲ μιᾷ τῶν σαββάτων
  choice: しかし、週の初めの日
  rationale: δὲによる場面の展開を「しかし」で示し、セム語的・コイネー的な時の慣用句は、現代日本語で自然かつ正確な「週の初めの日」とした。字義的な「安息日の第一」は本文では意味が伝わりにくいため脚注に残した。
- source_word: ὄρθρου βαθέως
  choice: 夜明けもまだ早いころ
  rationale: βαθέωςが夜明けの早い時刻を強めることを、直訳調の「深い夜明け」ではなく、自然で情景の浮かぶ日本語によって表した。
- source_word: ἐπὶ τὸ μνῆμα
  choice: 墓に
  rationale: 移動を表す動詞に伴うἐπίは到達方向を示す。μνῆμαはこの埋葬文脈では「墓」が簡潔で自然である。
- source_word: ἦλθον
  choice: 女たちは……来た
  rationale: 三人称複数の主語は直前の23章55節の女性たちであり、日本語で主語を明確にするため「女たちは」を補った。アオリストの単純な到来は「来た」とした。
- source_word: φέρουσαι
  choice: 携えて
  rationale: 主動詞と同時の行為を表す女性複数分詞。埋葬用の香料を持参したことを、簡潔で品位ある「携えて」で表した。
- source_word: ἃ ἡτοίμασαν ἀρώματα
  choice: 用意しておいた香料
  rationale: ἀρώματαは埋葬に用いる芳香性の香料を指す。先行する準備を日本語の「しておいた」で示し、関係節を自然な連体修飾に組み替えた。
theological_decisions:
- issue: 復活物語におけるτῇ μιᾷ τῶν σαββάτωνの暦上の意味
  choice: 週の初めの日
  alternative: 安息日の第一の日／安息日の翌日
  rationale: 通常の慣用的意味を本文に採用し、字面から特定の教派的・暦法的主張を導入しない。「安息日」を含む直訳形は脚注で開示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔でありながら品位を保った。「夜明けもまだ早いころ」で原文の強意を自然に再現し、「携えて」は口語に崩れすぎない叙述調とした。
