  yaml_path: translation/nt/luke/024/050.yaml
  text: Then he led them out as far as Bethany[a], and lifting up his hands, he blessed them.
translation:
  language: ja
  text: それから、イエスは弟子たちをベタニアの辺りまで[a]連れ出し、両手を上げて彼らを祝福した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ベタニアまで」または「ベタニアの近くまで」。ギリシア語は直訳すると「ベタニアの方へ至るまで」に近い表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐξήγαγεν
  choice: 連れて行き
  rationale: ἐξάγωは「外へ導き出す、連れ出す」を表す。直前の場面から移動したことが日本語として自然に伝わるよう「連れて行き」とした。
- source_word: δὲ
  choice: それから
  rationale: 強い対比ではなく物語の進行を示すため、自然な接続表現とした。
- source_word: ἕως πρὸς Βηθανίαν
  choice: ベタニアの辺りまで
  rationale: ἕωςとπρόςの組み合わせが示す到達範囲と方向性を保ちつつ、目的地そのものかその近辺かという原文の幅を残した。
- source_word: Βηθανίαν
  choice: ベタニア
  rationale: 地名の日本語における標準的な音写を用いた。
- source_word: ἐπάρας τὰς χεῖρας αὐτοῦ
  choice: 両手を上げて
  rationale: 複数形の「手」を日本語で自然に明示し、祝福に伴う身振りを保持した。アオリスト分詞は主動詞に先行または付随する動作として「上げて」とした。
- source_word: εὐλόγησεν αὐτούς
  choice: 彼らを祝福した
  rationale: 弟子たちに対して祝福を与える行為を、典礼的な意味を付加せず簡潔に表した。
theological_decisions:
- issue: イエスが弟子たちを祝福する行為の性質
  choice: 彼らを祝福した
  alternative: 彼らの上に祝福を宣言した
  rationale: 原文は祝福という行為を簡潔に述べているため、後代の典礼的・祭司的区分を持ち込まず、そのまま保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた語調と簡潔さを保った。「辺りまで」により、ἕως πρὸςのやや幅のある地理的表現を本文でも伝えた。
