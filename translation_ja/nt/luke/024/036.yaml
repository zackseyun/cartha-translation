id: LUK.24.36
reference: Luke 24:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα δὲ αὐτῶν λαλούντων ⸀αὐτὸς ἔστη ἐν μέσῳ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/036.yaml
  text: While they were saying these things[a], he himself stood among them.
translation:
  language: ja
  text: 彼らがこれらのことを話していると、イエスご自身が彼らのただ中に立たれた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、この後に「そして彼らに言われた。『平安があなたがたにあるように。』」と付け加えています。
    reason: textual_variant
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 直前まで語られていた複数の事柄を受ける中性複数の指示語であり、談話上のつながりと複数形を明示する。
- source_word: δὲ … αὐτῶν λαλούντων
  choice: 彼らが…話していると
  rationale: 現在分詞を伴う属格独立構文が表す、発話の継続中に起きた出来事という同時性を、自然な現代日本語で示す。δὲはここでは強い逆接ではなく場面の推移を担う。
- source_word: αὐτὸς
  choice: イエスご自身
  rationale: 明示された代名詞の強調を「ご自身」で保つ。日本語では「彼ご自身」より、文脈上の人物を「イエス」と明示するほうが自然で誤解がない。
- source_word: ἔστη
  choice: 立たれた
  rationale: ἵστημιのアオリストが表す、立つ位置を取った出来事を直接訳す。「現れた」や「来て立った」のような、原文に明示されない様態や移動は加えない。敬語はイエスについての日本語聖書文体として自然な主体敬語である。
- source_word: ἐν μέσῳ αὐτῶν
  choice: 彼らのただ中に
  rationale: 集団の中に位置したことを明確にしつつ、現代日本語として理解しやすく、荘重さも保つ。「彼らの間に」も可能だが、二者間の意味に取られる余地がある。
theological_decisions:
- issue: 後代の一部写本にある「そして彼らに言われた。『平安があなたがたにあるように。』」を本文に含めるか
  choice: 提示されたSBLGNTに従い、本文には含めず脚注に記す。
  alternative: 「そして彼らに言われた。『平安があなたがたにあるように。』」を本文に含める。
  rationale: 指定されたギリシア語本文は「彼らのただ中に立たれた」で終わるため、翻訳伝統や並行的な記憶によって補わない。ただし重要な異読なので脚注で保存する。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「ただ中」「立たれた」によって聖書本文にふさわしい品位を保った。属格独立構文は「…していると」で自然に表し、αὐτόςの強調は「ご自身」で保持した。
