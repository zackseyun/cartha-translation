  text: καὶ αὐτοὶ ὡμίλουν πρὸς ἀλλήλους περὶ πάντων τῶν συμβεβηκότων τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/014.yaml
  text: And they were talking with one another about all these things that had happened[a].
translation:
  language: ja
  text: そして二人は、起こったこれらすべてのことについて、互いに話していた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「二人は、これらすべての起こった出来事について、互いに語り合っていた。」
    reason: 「ὡμίλουν」の会話という意味と、「τῶν συμβεβηκότων」の出来事という表現を示す別表現。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の物語との素直なつながりを示し、原文に明示されない時間的含意を加えない。
- source_word: αὐτοὶ
  choice: 二人は
  rationale: 文脈上、旅をしている二人を指す。日本語では単なる「彼ら」より指示対象が明確で自然であり、代名詞の軽い明示性も保てる。
- source_word: ὡμίλουν
  choice: 話し合っていた
  rationale: 未完了過去の継続的な会話を表す。「話し合う」は相互の会話を自然に示し、過度に形式的な討議には限定しない。
- source_word: πρὸς ἀλλήλους
  choice: 互いに
  rationale: 相互に言葉を交わしていたことを簡潔で自然な日本語で表す。
- source_word: περὶ
  choice: について
  rationale: 会話の話題を示す現代日本語の標準的な表現。
- source_word: πάντων
  choice: すべての
  rationale: 話題となった出来事の全体を明確に表す。
- source_word: τῶν συμβεβηκότων τούτων
  choice: 起こったこれら…のこと
  rationale: 完了分詞が示す、すでに生じて現在の状況に関わる出来事を、自然な日本語で表す。「出来事」と限定せず、原文の表現の幅を保つ。
