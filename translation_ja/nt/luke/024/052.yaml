  text: καὶ αὐτοὶ ⸂[προσκυνήσαντες αὐτὸν]⸃ ὑπέστρεψαν εἰς Ἰερουσαλὴμ μετὰ χαρᾶς μεγάλης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/052.yaml
  text: And they[a], after worshiping him, returned to Jerusalem with great joy[b],
translation:
  language: ja
  text: そして彼らは、イエスを礼拝してから[a]、大きな喜びを抱いてエルサレムに戻った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスを礼拝してから」を欠く写本もある。また、「イエスの前にひれ伏してから」または「イエスに敬意を表してから」とも訳せる。
    reason: 本文異読とπροσκυνέωの語義上の選択肢を明示するため。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な物語のつながりを自然な現代日本語で示し、原文にない強い時間的含意を加えない。
- source_word: αὐτοὶ
  choice: 弟子たちは
  rationale: 明示された代名詞の主語を、文脈上の指示対象が分かる自然な日本語として表した。強意的な「彼ら自身は」はここでは過度に不自然となる。
- source_word: προσκυνήσαντες αὐτόν
  choice: イエスを礼拝してから
  rationale: アオリスト分詞が主動詞に先行する行為を示すことを「してから」で表現した。αὐτόνの指示対象を日本語で明確にするため「イエス」とした。復活・昇天の文脈では「礼拝する」が適切だが、語がひれ伏す行為や敬意を表す意味も持つことは脚注に示した。
- source_word: ὑπέστρεψαν
  choice: 帰った
  rationale: エルサレムへ戻る動作を、簡潔で自然な物語文として表す。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムへ
  rationale: 都市への方向を示すεἰςを、日本語で自然な方向格「へ」によって表した。
- source_word: μετὰ χαρᾶς μεγάλης
  choice: 大きな喜びに満たされて
  rationale: 直訳的な「大きな喜びとともに」より自然な日本語としつつ、χαράとμεγάληςの強さを保持した。
theological_decisions:
- issue: 復活したイエスに向けられたπροσκυνέωの訳
  choice: 礼拝する
  alternative: ひれ伏す／敬意を表す
  rationale: 復活と昇天の文脈では「礼拝する」が有力であり、キリスト論的な重みを弱めない。一方、この語自体が身体的にひれ伏すことや敬意を表すことも意味し得るため、その語義上の幅を脚注で保持した。
- issue: 校訂本文で角括弧に置かれたπροσκυνήσαντες αὐτόν
  choice: 本文に含め、本文異読を脚注で示す
  alternative: 本文から省く
  rationale: 提供されたSBLGNTでは語句が記載されつつ不確実性が示されているため、本文に訳出し、写本上の異読を脚注で明示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。分詞の先行性を自然な「してから」で表し、喜びの強さは日本語として流麗な「大きな喜びに満たされて」とした。
