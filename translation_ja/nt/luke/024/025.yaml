source:
  edition: SBLGNT
  text: καὶ αὐτὸς εἶπεν πρὸς αὐτούς· Ὦ ἀνόητοι καὶ βραδεῖς τῇ καρδίᾳ τοῦ πιστεύειν ἐπὶ πᾶσιν οἷς ἐλάλησαν οἱ προφῆται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/025.yaml
  text: And he said to them[a], “O foolish ones[c][b], and slow of heart to believe all that the prophets have spoken!”
translation:
  language: ja
  text: 彼は二人に言った。「ああ、愚かで、預言者たちが語ったすべてのことを信じるのに心の鈍い人たちよ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς εἶπεν πρὸς αὐτούς
  choice: 彼は二人に言った
  rationale: καίは文脈上、日本語では必ずしも明示せず、自然な物語文とした。αὐτούςは直前から続く二人の弟子を指すため、「彼ら」より明瞭な「二人」とした。
- source_word: Ὦ
  choice: ああ
  rationale: 呼びかけを強める間投詞の力と、厳粛な叱責の調子を保つ。
- source_word: ἀνόητοι
  choice: 物分かりが悪く
  rationale: 単なる道徳的邪悪さではなく、理解や洞察の欠如を表す語義を、現代日本語で自然に伝える。
- source_word: βραδεῖς τῇ καρδίᾳ
  choice: 心の鈍い
  rationale: 「心」という原文の比喩を保持し、知性だけでなく内面全体における受容と信頼の鈍さを表す。
- source_word: τοῦ πιστεύειν
  choice: 信じるには
  rationale: βραδεῖςとの結び付きを、日本語として自然な「信じるには……鈍い」で表した。
- source_word: ἐπὶ πᾶσιν οἷς
  choice: ことすべてを
  rationale: 預言者の発言の全体を信じるという包括的範囲を明確にした。
- source_word: ἐλάλησαν οἱ προφῆται
  choice: 預言者たちが語った
  rationale: 預言者による宣言を「語った」で表し、過去の発言を指すアオリストを自然な日本語の過去形にした。
theological_decisions:
- issue: イエスの叱責の性質
  choice: 預言者の言葉に対する理解と信頼の双方の不足を叱責する表現とした。
  alternative: 主として道徳的な愚かさへの断罪、または単なる知的誤解と解する。
  rationale: ἀνόητοιと「心の鈍い」「信じる」が組み合わされているため、理解力だけにも道徳性だけにも限定せず、内面から信頼して受け入れることの鈍さを保持した。
- issue: 「すべて」の範囲
  choice: 預言者たちが語ったことの全体を指す包括的表現を保持した。
  alternative: メシアの苦難に関する預言だけに訳文上限定する。
  rationale: 文脈はメシアについての預言を念頭に置くが、πᾶσινの包括性を訳文で狭めないため。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、「ああ」「人たちよ」によって原文の直接的な呼びかけと厳粛な叱責を保持した。「心の鈍い」は日常語よりやや格調があるが、原文の比喩と神学的緊張を損なわず理解できる表現である。
