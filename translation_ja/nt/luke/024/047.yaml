id: LUK.24.47
reference: Luke 24:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κηρυχθῆναι ἐπὶ τῷ ὀνόματι αὐτοῦ μετάνοιαν ⸀καὶ ἄφεσιν ἁμαρτιῶν εἰς πάντα τὰ ἔθνη— ⸀ἀρξάμενοι ἀπὸ Ἰερουσαλήμ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/024/047.yaml
  text: and that repentance for the forgiveness of sins should be proclaimed in his name to all the nations[b][a], beginning from Jerusalem.
translation:
  language: ja
  text: そして、彼の名において、罪の赦しのための悔い改め[a]が、エルサレムから始めて、すべての国々に[b]宣べ伝えられること。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悔い改めと罪の赦しが」。ギリシア語は、宣べ伝えられる内容として二つを並列しているとも取れる。
    reason: alternative_reading
  - marker: b
    text: 「すべての異邦人に」とも訳せる。ここで「国々」と訳したギリシア語は、文脈によって「異邦人」を意味することがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρυχθῆναι
  choice: 宣べ伝えられる
  rationale: 公に告げ知らせることを表す受動不定詞。直前から続く、聖書に記されている事柄の内容として自然に表現した。
- source_word: ἐπὶ τῷ ὀνόματι αὐτοῦ
  choice: 彼の名によって
  rationale: イエスの人格と権威を根拠・よりどころとして告知する意味を保つ。
- source_word: μετάνοιαν
  choice: 悔い改め
  rationale: 単なる心変わりではなく、神に向き直ることを含む定着した現代日本語の聖書用語である。
- source_word: καὶ ἄφεσιν ἁμαρτιῶν
  choice: 罪の赦しに至る
  rationale: 本文の二つの対格名詞の密接な関係を自然な日本語で示す。ただし「悔い改めと罪の赦し」という並列理解も可能なため脚注に残した。
- source_word: εἰς πάντα τὰ ἔθνη
  choice: すべての国々の民に
  rationale: 全世界の諸民族への広がりを示し、日本語で国という政治単位だけに聞こえるのを避けた。文脈によっては「異邦人」を意味し得ることを脚注で示した。
- source_word: ἀρξάμενοι ἀπὸ Ἰερουσαλήμ
  choice: エルサレムから始めて
  rationale: ἀπόが示す出発点と、複数主語に対応する分詞の働きを自然に表した。
theological_decisions:
- issue: 宣べ伝えられる悔い改めと罪の赦しの関係
  choice: 罪の赦しに至る悔い改め
  alternative: 悔い改めと罪の赦し
  rationale: 二つを密接に結びつける読みを本文に採ったが、救いの順序を本文以上に体系化せず、並列の可能性を脚注に明記した。
- issue: ἔθνηの範囲
  choice: すべての国々の民
  alternative: すべての異邦人
  rationale: 復活後の使命の普遍的範囲を保ち、非ユダヤ人だけに狭めない一方、語の別義を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「宣べ伝える」「悔い改め」「罪の赦し」は一般読者にも理解可能な定着表現として用いた。脚注記号は該当句の直後ではなく、節末にまとめて配置し、本文の流れを保った。
