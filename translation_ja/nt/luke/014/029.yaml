  text: ἵνα μήποτε θέντος αὐτοῦ θεμέλιον καὶ μὴ ἰσχύοντος ἐκτελέσαι πάντες οἱ θεωροῦντες ἄρξωνται ⸂αὐτῷ ἐμπαίζειν⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/029.yaml
  text: otherwise[a], after he has laid a foundation and is not able to finish, all who see it may begin to mock him,
translation:
  language: ja
  text: そうでないと[a]、土台を据えた後、完成させることができず、見る人が皆、その人をあざけり始めるかもしれない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「土台を据えた後で完成させることができず、見る人が皆、その人をあざけり始めることがないように。」
    reason: ἵνα μήποτεは、避けるべき結果を目的・懸念の形で導く表現とも訳せるため。
lexical_decisions:
- source_word: ἵνα μήποτε
  choice: そうでないと
  rationale: 避けるべき結果を導く警告表現として、文脈に即した自然な現代日本語とした。「ひょっとすると～しないように」という可能性の含みは脚注で示す。
- source_word: θέντος αὐτοῦ θεμέλιον
  choice: 土台を据えたものの
  rationale: 属格独立構文が示す先行動作を表しつつ、後続する未完成との対照を自然に示す。「据える」は建築の土台にふさわしい品位ある表現である。
- source_word: μὴ ἰσχύοντος ἐκτελέσαι
  choice: 完成させることができず
  rationale: ἰσχύωを単なる身体的強さではなく能力として取り、ἐκτελέσαιの最後まで成し遂げる意味を建築文脈で「完成させる」とした。
- source_word: πάντες οἱ θεωροῦντες
  choice: それを見ている人たちが皆
  rationale: θεωρέωの継続的に見守る・目にする含みを「見ている」で表し、「それ」は土台だけが据えられた状況を自然に受ける。
- source_word: ἄρξωνται αὐτῷ ἐμπαίζειν
  choice: その人をあざけり始めるかもしれない
  rationale: ἄρχομαιと不定詞の組み合わせを「～し始める」とし、警告構文にある可能性を「かもしれない」で保持した。ἐμπαίζωは、口語的すぎず強意も保つ「あざける」とした。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、たとえ話の警告としての厳粛さを保った。「あざける」は「からかう」よりも原語の非難的な強さと聖書本文に適した品位を伝える。
