  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: こう言った
  rationale: 前節の「見る者たち」を受ける現在分詞。日本語では文を区切り、発言内容へ自然につなぐため「こう言った」とした。継続的・同時的なニュアンスは文脈に委ねる。
- source_word: ὅτι
  choice: 『…』
  rationale: 発言内容を導く接続詞であり、現代日本語では直接話法の括弧で自然に表した。
- source_word: Οὗτος ὁ ἄνθρωπος
  choice: この人
  rationale: 指示詞と男性単数名詞を簡潔に反映する。「こいつ」など、原文以上に侮蔑的な語感は加えない。
- source_word: ἤρξατο οἰκοδομεῖν
  choice: 建て始めた
  rationale: 開始を表す動詞と不定詞を、自然で簡潔な複合動詞として訳した。目的語は原文に明示されていないため補わない。
- source_word: οὐκ ἴσχυσεν
  choice: できなかった
  rationale: ここでは身体的な強さに限定せず、完成に至る能力・力量がなかったことを表す。より語形に即した別訳は脚注に示す。
- source_word: ἐκτελέσαι
  choice: 完成させる
  rationale: 建築を最後まで成し遂げる意味を明確に表す。「仕上げる」よりも文脈を限定しすぎず、現代日本語として自然である。
