id: LUK.14.1
reference: Luke 14:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ἐλθεῖν αὐτὸν εἰς οἶκόν τινος τῶν ἀρχόντων τῶν Φαρισαίων σαββάτῳ φαγεῖν ἄρτον καὶ αὐτοὶ ἦσαν παρατηρούμενοι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/001.yaml
  text: And it happened that when he went into the house of one of the rulers of the Pharisees on the Sabbath to eat bread[b][a], they were watching him closely.
translation:
  language: ja
  text: さて、ある安息日のこと、イエスは食事をするため、ファリサイ派の指導者の一人の家に入られた。彼らはイエスの様子を注意深くうかがっていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「注意深く観察していた」とも訳せる。ギリシア語には、疑いや敵意をもって見張るという含みがあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: さて、ある安息日のこと
  rationale: ルカに特徴的な場面導入の定型表現を、現代日本語の自然な物語の書き出しとして表した。時の情報とまとめることで冗長さを避けた。
- source_word: ἐν τῷ ἐλθεῖν αὐτὸν
  choice: イエスは…入られた
  rationale: ἐν＋冠詞付き不定詞の時間的意味を文脈に組み込み、主語を明確にした。敬意を示す自然な叙述として尊敬表現を用いた。
- source_word: οἶκόν
  choice: 家
  rationale: 住居と会食の場の双方を自然に表す、直接的な訳語。
- source_word: τινος τῶν ἀρχόντων τῶν Φαρισαίων
  choice: ファリサイ派の指導者の一人
  rationale: ἀρχόντωνを単なる有力者ではなく集団内の指導的立場として表し、τινοςの『一人』も保持した。
- source_word: σαββάτῳ
  choice: ある安息日
  rationale: 無冠詞の単数形を、特定の日付を示さない物語上の一日として自然に表した。
- source_word: φαγεῖν ἄρτον
  choice: 食事をするため
  rationale: 直訳は『パンを食べる』だが、ここでは食事を取ることを意味する慣用句なので、意味を明瞭に伝えた。
- source_word: αὐτοὶ
  choice: 人々は
  rationale: 直前のファリサイ派側の同席者を指す複数主語を、日本語で曖昧になりすぎないよう文脈的に表した。誰を含むかは限定しすぎていない。
- source_word: παρατηρούμενοι αὐτόν
  choice: イエスの様子を注意深くうかがっていた
  rationale: 継続的で入念な観察と、場合によっては疑念や敵意を帯びる含みを『うかがう』で保ちつつ、露骨な悪意までは断定しない訳とした。
theological_decisions:
- issue: ファリサイ派側の観察に含まれる敵意
  choice: 注意深くうかがっていた
  alternative: 見張っていた／注意深く観察していた
  rationale: παρατηρέωは疑念や敵意を伴う監視を示し得るが、この節だけでは悪意を明言していない。中立的すぎず、断定的すぎない表現で緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語として自然でありながら品位ある調子を保った。「パンを食べる」は日本語では実際のパンに狭く受け取られやすいため「食事をする」とした。観察者の意図は断定せず、原文の緊張を維持した。
