  text: οὔτε εἰς γῆν οὔτε εἰς κοπρίαν εὔθετόν ἐστιν· ἔξω βάλλουσιν αὐτό. ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/035.yaml
  text: It is fit neither for the soil nor for the manure pile[a]; they throw it outside. The one who has ears to hear[b], let him hear.
translation:
  language: ja
  text: 土にも肥やしの山[a]にも適さない。外に投げ捨てられる。聞く耳のある者は、聞きなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「糞の山」または「堆肥の山」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聞く耳のある人は、聞きなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: γῆν
  choice: 土
  rationale: 農耕の比喩における耕作の土を指すため、宇宙的な「地」ではなく、自然で具体的な「土」とした。
- source_word: κοπρίαν
  choice: 肥やしの山
  rationale: 糞や堆肥を積んだ場所を指す語であり、現代の一般読者に分かりやすく、農業的な具体性も保つ表現とした。
- source_word: εὔθετόν
  choice: 役に立たず
  rationale: 原語は「用途に適した、役立つ」を意味する。日本語では「土にも…にも適さない」より、この文脈で自然な否定表現となる。
- source_word: ἔξω βάλλουσιν αὐτό
  choice: 外に投げ捨てられる
  rationale: ギリシア語は不特定の複数主語による能動形だが、日本語で「人々は」と補うより受動形が自然であり、外へ廃棄する具体的な像を保つ。
- source_word: ὁ ἔχων ὦτα ἀκούειν ἀκουέτω
  choice: 聞く耳のある者は、聞きなさい
  rationale: 慣用的な勧告として自然な現代日本語にしつつ、ἀκουέτωの命令の力を保った。「者」は性を明示しないが、原文の代表的・一般的な指示を過不足なく伝える。
theological_decisions:
- issue: 結びの勧告における男性単数形
  choice: 聞く耳のある者は、聞きなさい
  alternative: 聞く耳のある人は、聞きなさい
  rationale: ギリシア語の男性単数は一般的・代表的に機能する。日本語では文法的性を再現できず、「者」によって格調と一般性を保ち、特定の性に限定しない原意を伝えた。
translation_notes:
  register: 明快な現代標準日本語を用い、格調ある命令表現と農業的な比喩の具体性を保った。本文中の脚注記号は該当表現の直後に配置した。
