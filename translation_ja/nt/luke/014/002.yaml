  text: καὶ ἰδοὺ ἄνθρωπός τις ἦν ὑδρωπικὸς ἔμπροσθεν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/002.yaml
  text: And behold[a], a certain man with dropsy was before him.
translation:
  language: ja
  text: そして、見よ、イエスの前に、水腫[a]を患っているある人がいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「水腫」は、体内に水分が異常にたまり、体がむくむ状態を指す。原語は、そのような症状を患う人を表す。
    reason: 現代の読者にはなじみの薄い病名を説明し、原語が示す症状を明確にするため。
lexical_decisions:
- source_word: καὶ
  choice: すると
  rationale: 物語のつながりを自然な現代日本語で示す。単なる並列に限定せず、場面の展開を表すが、強い時間的意味は加えない。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 読者の注意を突如現れた人物へ向ける談話標識の力を保つ。やや格調はあるが、聖書本文として明瞭である。
- source_word: ἄνθρωπός τις
  choice: 人
  rationale: 特定されているが名の示されない人物を指す。日本語では「ある人」も可能だが、「人がいた」で不定性が自然に伝わる。
- source_word: ἦν
  choice: いた
  rationale: 人物の存在を表す未完了過去を、自然な日本語の存在表現で訳す。
- source_word: ὑδρωπικὸς
  choice: 水腫を患っている
  rationale: 体液の異常な貯留による腫れを伴う状態を指す形容詞。「水腫」は原語の医学的意味を簡潔に保ち、「患っている」によって人物の病状であることを明示する。
- source_word: ἔμπροσθεν αὐτοῦ
  choice: イエスの前に
  rationale: 空間的な「前」と、その場にいるという意味の両方を保つ。日本語で「彼の前に」とすると指示対象が不明瞭になりやすいため、文脈上の指示対象であるイエスを明示する。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、ἰδοὺの注意喚起を「見よ」で残して、ルカの叙述の鮮明さと格調を保った。病名は口語的に言い換えすぎず、脚注で意味を補った。
