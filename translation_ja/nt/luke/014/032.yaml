id: LUK.14.32
reference: Luke 14:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ μήγε, ἔτι ⸂αὐτοῦ πόρρω⸃ ὄντος πρεσβείαν ἀποστείλας ἐρωτᾷ ⸀τὰ πρὸς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/032.yaml
  text: But if not[a], while the other is still far away[b], he sends a delegation and asks for terms of peace.
translation:
  language: ja
  text: そうでなければ、相手がまだ遠くにいるうちに、使節団[a]を送って、和平の条件[b]を求めます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「使節」または「使節たち」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「平和にかかわる事柄」。すなわち、和平を成立させるための条件。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ μήγε
  choice: そうでなければ
  rationale: 直前の条件が満たせない場合を受ける逆接的な条件表現。現代日本語では「そうでなければ」が自然で、文脈上の論理も明確に保つ。
- source_word: ἔτι αὐτοῦ πόρρω ὄντος
  choice: 相手がまだ遠くにいるうちに
  rationale: 属格独立構文が示す同時的状況を自然な日本語にした。αὐτοῦはこの王ではなく進軍して来る相手の王を指すため、「相手」として指示対象を明確にした。
- source_word: πρεσβείαν
  choice: 使節団
  rationale: ここでは和平交渉のために派遣される使節の一団を指す。「使節団」は現代日本語で意味が明瞭であり、政治的・軍事的文脈にも適する。
- source_word: ἀποστείλας
  choice: 送って
  rationale: アオリスト分詞を連用形で表し、使節団を送った上で和平を求めるという行為の自然なつながりを保持した。
- source_word: ἐρωτᾷ
  choice: 求めます
  rationale: ここでのἐρωτάωは単に質問するのでなく、和平に必要な条件を申し入れ、求める意味。「求めます」が目的語との結びつきに適する。
- source_word: τὰ πρὸς εἰρήνην
  choice: 和平の条件
  rationale: 字義的には「平和にかかわる事柄」だが、軍事的対立の文脈では和平成立の条件を指す。「和平の条件」は意味を明瞭に伝えつつ、脚注で原文の幅を示す。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準語を用い、たとえ話にふさわしい端正な敬体とした。「和平」は王同士の軍事的文脈に適した語である。
