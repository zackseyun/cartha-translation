reference: Luke 14:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τῷ κεκληκότι αὐτόν· Ὅταν ποιῇς ἄριστον ἢ δεῖπνον, μὴ φώνει τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους, μήποτε καὶ αὐτοὶ ⸂ἀντικαλέσωσίν σε⸃ καὶ γένηται ⸂ἀνταπόδομά σοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/012.yaml
  text: And he was also saying to the one who had invited him[a], “When you give a luncheon or a dinner, do not invite your friends or your brothers or your relatives or rich neighbors[c][b], lest they also invite you in return and it become repayment to you.”
translation:
  language: ja
  text: さらに、イエスは自分を招いた人にも言われた。「昼の食事や晩餐を催すときには、友人や兄弟、親族、裕福な近所の人たちを招いてはなりません。そうすると、彼らもあなたを招き返し、それがあなたへの報いとなるかもしれないからです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ
  choice: またイエスは……にも言われた
  rationale: 未完了形は継続的な発話を表し得るが、この場面では日本語の自然な物語叙述として単純過去で表現した。δὲとκαὶの追加的なつながりは「また」「にも」で保持した。主語の「イエス」は文脈上明らかな指示対象を明示したもの。
- source_word: τῷ κεκληκότι αὐτόν
  choice: 自分を招いた人
  rationale: 完了分詞が指す、先にイエスを食事へ招いた人物を、解釈的な「主人」ではなく原文に近い表現で示した。
- source_word: Ὅταν ποιῇς ἄριστον ἢ δεῖπνον
  choice: 昼の食事や晩餐を催すとき
  rationale: ποιέωは食事を設けてもてなす意味なので「催す」とした。ἄριστονは現代的な朝食とは限らない早い時間の食事で、δεῖπνονとの対照を自然に示すため「昼の食事」とした。δεῖπνονは後刻の主要な食事として「晩餐」と訳した。
- source_word: μὴ φώνει
  choice: 招いてはなりません
  rationale: 食事の文脈でφωνέωは「呼ぶ」より「招く」が自然。禁止の力を明確にした。
- source_word: τοὺς φίλους σου μηδὲ τοὺς ἀδελφούς σου μηδὲ τοὺς συγγενεῖς σου μηδὲ γείτονας πλουσίους
  choice: 友人や兄弟、親族、裕福な近所の人たち
  rationale: 列挙を明瞭な現代日本語で表現し、ἀδελφούςの男性複数形は「兄弟」として保持した。πλουσίουςがγείτοναςを修飾する関係もそのまま示した。
- source_word: μήποτε καὶ αὐτοὶ ἀντικαλέσωσίν σε
  choice: 彼らもあなたを招き返し、……かもしれないから
  rationale: ἀντικαλέωの相互的意味を「招き返す」で明示した。μήποτεは望ましくない可能性への警戒を表すため、「かもしれないから」と自然に表した。
- source_word: καὶ γένηται ἀνταπόδομά σοι
  choice: それがあなたへの報いとなる
  rationale: 直訳的な構造と、返礼がすでに受け取る報いになるという含意を保持した。
theological_decisions:
- issue: 家族や富裕な隣人を招くことへの禁止の射程
  choice: 原文どおり直接的な禁止として訳し、一般原則・誇張・当該場面限定などの解釈を本文で限定しない
  alternative: 「そのような人たちだけを招いてはならない」など、排他性への禁止として補足する
  rationale: 原文に「だけ」はなく、ここで補えば教えの修辞的緊張を解消してしまうため。
- issue: ἀνταπόδομαの含意
  choice: 「報い」
  alternative: 「返礼」「埋め合わせ」
  rationale: 社交上の返礼という文脈を含みつつ、直後の終末論的な「報い」との語義的・神学的連関を保持できる。
translation_notes:
  register: 明瞭で現代的ながら、イエスの教えにふさわしい丁寧で格調ある「です・ます」調を採用した。「晩餐」は「夕食」よりやや格調があるが、宴席としてのδεῖπνονを自然に示す。注がないため本文に脚注記号は置いていない。
