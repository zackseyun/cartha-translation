revisions:
- from: またイエスは、自分を招いた人にも言われた。「昼の食事や晩餐を催すときには、友人や兄弟、親族、裕福な近所の人たちを招いてはなりません。彼らもあなたを招き返し、それがあなたへの報いとなるかもしれないからです。」
  to: さらに、イエスは自分を招いた人にも言われた。「昼の食事や晩餐を催すときには、友人や兄弟、親族、裕福な近所の人たちを招いてはなりません。そうすると、彼らもあなたを招き返し、それがあなたへの報いとなるかもしれないからです。」
  rationale: 本文の語彙選択と列挙は維持しつつ、μήποτεが導く警告的な結果を「そうすると」で明示した。「かもしれない」は日本語でμήποτεの懸念・可能性を自然に表す。原文には現代の朝食・昼食の時刻区分を厳密に定める情報がないが、「昼の食事」は英語監査記録の選択と整合し、この文脈では十分に安全であるため、脚注を新設しない。
