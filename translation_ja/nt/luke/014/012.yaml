  verdict: revise
  source_fidelity: 全体として原文の列挙、相互的な招待（ἀντικαλέω）、および「報い」（ἀνταπόδομα）はよく反映されている。ただし、μήποτε以下は「……からです」という原因説明というより、「そうならないように」という警告的な結果・目的節であるため、日本語でもその関係を明示するほうが正確である。
  naturalness: 「昼の食事」「晩餐を催す」「招き返す」は明瞭で、教えの文体としても自然である。「またイエスは、自分を招いた人にも言われた」より、「さらに、イエスは自分を招いた人にも言われた」のほうが、καὶの追加とτῷ κεκληκότι αὐτόνへの発話を自然に示す。
  terminology: 「兄弟」は男性複数形を不必要に中和せず保持している。「親族」「裕福な近所の人たち」「報い」も適切である。「晩餐」はやや格調高いが、δεῖπνονにふさわしく、聖餐を意味するような文脈上の混同も生じない。
  issues:
  - severity: medium
    issue: μήποτε以下の論理関係が「……かもしれないからです」と因果説明として表されている。
    rationale: μήποτεは、彼らが招き返し、そのことが報いとなる事態を避けるための警告を導く。日本語では「そうすると」「そうならないように」などで結果を示すと、原文の警告的な接続をより忠実に保てる。
  - severity: low
    issue: 「またイエスは、自分を招いた人にも言われた」はやや重く、「また」と「にも」の連結が不自然に響きうる。
    rationale: δὲ καὶは軽い接続と追加であり、「さらに、イエスは……にも言われた」とすれば明瞭で自然である。
  revised_text: さらに、イエスは自分を招いた人にも言われた。「昼の食事や晩餐を催すときには、友人や兄弟、親族、裕福な近所の人たちを招いてはなりません。そうすると、彼らもあなたを招き返し、それがあなたへの報いとなるかもしれないからです。」
