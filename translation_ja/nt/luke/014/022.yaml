  yaml_path: translation/nt/luke/014/022.yaml
  text: And the servant said[a], ‘Lord, what you commanded has been done[b], and there is still room.’
translation:
  language: ja
  text: すると、そのしもべ[a]は言った。「ご主人様、お命じになったとおりにいたしました。そして、まだ席があります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」は「奴隷」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: しもべ
  rationale: 家の主人に仕える者を指す語。現代語として理解でき、たとえ話における主人との従属関係も保つ。「奴隷」という語義もあるため脚注に示す。
- source_word: Κύριε
  choice: ご主人様
  rationale: この呼びかけは、たとえ話の家の主人に向けられている。神への称号と先取りして断定せず、場面に即した自然で敬意ある呼称とした。
- source_word: γέγονεν ὃ ἐπέταξας
  choice: お命じになったとおりにいたしました
  rationale: 完了形の結果性と、命令が遂行済みであることを自然な日本語で表す。原文の非人称的な「成った」を、発話場面に合う表現へ整えた。
- source_word: ἔτι
  choice: まだ
  rationale: 命令の遂行後にも空きが残っているという継続状態を簡潔に表す。
- source_word: τόπος
  choice: 席
  rationale: 宴席への招待という文脈では、単なる物理的空間よりも、客を迎え入れられる場所・定員の余裕を「席」が自然に表す。
theological_decisions:
- issue: Κύριεを神学的称号として訳すか、物語内の主人への呼称として訳すか
  choice: ご主人様
  alternative: 主よ
  rationale: 直接にはたとえ話の家の主人への呼びかけであるため、物語上の意味を優先した。たとえの神学的含意を否定はしないが、訳文で明示的に確定しない。
translation_notes:
  register: 明瞭な現代標準語。会話として自然な敬語を用いながら、たとえ話にふさわしい落ち着きと品位を保った。
