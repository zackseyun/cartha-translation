  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς γὰρ ἐξ ⸀ὑμῶν θέλων πύργον οἰκοδομῆσαι οὐχὶ πρῶτον καθίσας ψηφίζει τὴν δαπάνην, εἰ ⸀ἔχει εἰς ἀπαρτισμόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/028.yaml
  text: For which of you[a], wanting to build a tower, does not first sit down and calculate the cost[b], whether he has enough to complete it?
translation:
  language: ja
  text: あなたがたのうち、塔を建てようとする人で、まず座って費用を計算し、完成までに必要な資金があるかどうかを確かめない人がいるでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「完成のために持っているかどうか」。文脈上は、工事を完成させるのに十分な資金があるかどうかという意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς γὰρ ἐξ ὑμῶν
  choice: あなたがたのうち、…人が…ないでしょうか
  rationale: 聴衆に直接問いかけ、肯定の答えを予期する修辞疑問として自然な現代日本語にした。γάρは前文を受けた例示・理由づけとして文全体の流れに含ませた。
- source_word: θέλων πύργον οἰκοδομῆσαι
  choice: 塔を建てようとする
  rationale: θέλωνの意志・意向を「建てようとする」で表し、πύργοςの具体的な像をそのまま保った。
- source_word: πρῶτον καθίσας
  choice: まず座って
  rationale: 主動詞に先立つ行為を簡潔かつ自然に示す。
- source_word: ψηφίζει τὴν δαπάνην
  choice: 費用を計算し
  rationale: ψηφίζωは数えることから計算・見積もりを意味し、建築費の文脈では「費用を計算する」が明瞭である。
- source_word: εἰ ἔχει εἰς ἀπαρτισμόν
  choice: 完成させるだけのものがあるかどうか
  rationale: 原文は文字どおりには「完成のために持っているか」。資力に限定しすぎず、必要なものを十分持つという含みと原文の省略を保った。
- source_word: οὐχὶ
  choice: 確かめないでしょうか
  rationale: 肯定の答えを期待する修辞疑問の力を、日本語の「ないでしょうか」で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、たとえの具体性と修辞疑問を保持した。「もの」は原文が具体的な資金・資材等を明示しない点を反映する。
