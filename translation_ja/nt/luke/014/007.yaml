  text: Ἔλεγεν δὲ πρὸς τοὺς κεκλημένους παραβολήν, ἐπέχων πῶς τὰς πρωτοκλισίας ἐξελέγοντο, λέγων πρὸς αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/007.yaml
  text: 'He was telling a parable to those who had been invited[a], noticing how they were choosing the places of honor, saying to them:'
translation:
  language: ja
  text: 招かれた人々がどのように上席[a]を選んでいるかに目を留め、彼らに次のたとえを語られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「最上位の席」。ギリシア語は、宴席で最も名誉ある場所を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 語って、こう言われた
  rationale: 未完了過去の継続的・場面設定的な働きを踏まえつつ、後続する直接話法を自然な日本語で導入した。
- source_word: δὲ
  choice: 明示的には訳出しない
  rationale: ここでは弱い叙述上の接続を示すため、日本語では文脈の流れに委ねるのが自然であり、明示的な逆接や時間表現を加えない。
- source_word: τοὺς κεκλημένους
  choice: 招かれた人々
  rationale: καλέωの完了分詞が表す、招待を受けた状態にある人々という意味を保った。
- source_word: παραβολήν
  choice: たとえ
  rationale: 福音書で用いられる標準的な語義を、現代日本語で分かりやすく表した。
- source_word: ἐπέχων πῶς
  choice: 様子に目を留め
  rationale: 注意深く観察したことと、その観察がたとえの契機となったことを自然に表す。
- source_word: πρωτοκλισίας
  choice: 上席
  rationale: 宴席における最も名誉ある場所を指す語であり、日本語の宴席文化でも社会的な含意が伝わる。
- source_word: ἐξελέγοντο
  choice: 選んでいる
  rationale: 未完了過去の進行・反復的な側面を表す。中動態の自己利益的な含みは文脈上明らかなため、不自然な説明を本文に加えない。
- source_word: λέγων πρὸς αὐτούς
  choice: 彼らに……こう言われた
  rationale: 後続する直接話法への導入を明確にしながら、敬意ある自然な叙述とした。
