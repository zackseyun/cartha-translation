id: LUK.14.9
reference: Luke 14:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ὁ σὲ καὶ αὐτὸν καλέσας ἐρεῖ σοι· Δὸς τούτῳ τόπον, καὶ τότε ἄρξῃ μετὰ αἰσχύνης τὸν ἔσχατον τόπον κατέχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/009.yaml
  text: and the one who invited both you and him will come and say to you[a], ‘Give this man your place,’ and then you will begin with shame to take the last place.
translation:
  language: ja
  text: すると、あなたとその人を招いた人が来て、あなたに『この人に席を譲りなさい』と言うだろう。その時、あなたは恥をかきながら、いちばん末の席[a]に着くことになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いちばん低い席」。ギリシア語の表現は順序で最後の位置を指し、この宴席の文脈では、最も名誉の低い席を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σὲ καὶ αὐτὸν καλέσας
  choice: あなたとその人を招いた人
  rationale: 冠詞付き分詞を名詞的に訳し、招いた側の人物を示すとともに、二人の招待客の対比を保った。
- source_word: ἐλθὼν ... ἐρεῖ σοι
  choice: 来て、あなたに……と言うだろう
  rationale: アオリスト分詞を後続の未来動詞と一連の動作として自然に表し、発話の相手も明示した。
- source_word: Δὸς τούτῳ τόπον
  choice: この人に席を譲りなさい
  rationale: 宴席の文脈では単に場所を与えるのでなく、自分の席を相手に明け渡すことを意味するため、「席を譲る」とした。命令の力も保った。
- source_word: μετὰ αἰσχύνης
  choice: 恥をかきながら
  rationale: αἰσχύνηが表す公の場での羞恥を、現代日本語で自然かつ十分な強さを持つ表現にした。
- source_word: τὸν ἔσχατον τόπον
  choice: いちばん末の席
  rationale: ἔσχατοςの基本的な「最後」の意味を保ちつつ、宴席での座る位置であることを明確にした。席次上の最低位という含意は脚注で示した。
- source_word: ἄρξῃ ... κατέχειν
  choice: 着くことになる
  rationale: 直訳の「占め始める」は日本語では不自然である。状況の成り行きとしてその席に移る意味を自然に表したが、強制を明示する語は加えていない。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえの公的な宴席にふさわしい落ち着いた語調と直接話法を保った。
