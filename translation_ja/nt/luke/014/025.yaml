- source_word: Συνεπορεύοντο
  choice: 一緒に旅をしていた
  rationale: 未完了過去が示す、群衆が道中継続して同行していた様子を、自然な現代日本語で表した。単なる随伴だけでなく移動中であることも保持する。
- source_word: δὲ
  choice: 訳文では独立した接続語を置かない
