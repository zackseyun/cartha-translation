- source_word: αὐτῷ
  choice: イエスと
  rationale: ギリシア語は代名詞だが、日本語の「彼と」は指示対象が不自然または曖昧になりやすいため、文脈上の指示対象を明示した。
- source_word: ὄχλοι πολλοί
  choice: 大勢の群衆
  rationale: 複数の群衆、または非常に多くの人々という意味を、慣用的で分かりやすい日本語にした。
- source_word: καὶ
  choice: 文を分けて連続を示す
  rationale: 単純な接続であり、日本語では二文に分けても出来事の連続が自然に保たれる。
- source_word: στραφεὶς
  choice: 振り向いて
  rationale: 移動中のイエスが同行する群衆の方を向いたという場面に自然に合い、分詞が示す先行・付帯動作を表す。
- source_word: εἶπεν
  choice: 言った
  rationale: λέγωのアオリストに対する標準的で自然な物語表現。
- source_word: πρὸς αὐτούς
  choice: 彼らに
  rationale: 発言の相手を示すπρός＋対格とギリシア語の代名詞を簡潔に保持した。
