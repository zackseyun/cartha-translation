id: LUK.14.8
reference: Luke 14:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅταν κληθῇς ὑπό τινος εἰς γάμους, μὴ κατακλιθῇς εἰς τὴν πρωτοκλισίαν, μήποτε ἐντιμότερός σου ᾖ κεκλημένος ὑπ’ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/008.yaml
  text: When you are invited by someone to a wedding feast, do not recline in the place of honor, lest someone more honored than you has been invited by him.
translation:
  language: ja
  text: だれかに婚宴へ招かれたときは、上席[a]に身を横たえてはならない[b]。あなたよりも重んじられている人が、その人から招かれているかもしれないからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 宴席で最も名誉ある場所。
    reason: cultural_note
  - marker: b
    text: 古代の正式な宴席では、食卓のそばに身を横たえて食事をするのが一般的だった。
    reason: cultural_note
lexical_decisions:
- source_word: Ὅταν κληθῇς ὑπό τινος
  choice: だれかに……招かれたときは
  rationale: 宴席への招待を表す καλέω の受動形と、不定の行為者 τινος を自然な現代日本語で表した。ὅταν は一般的な場合を示すため「ときは」とした。
- source_word: εἰς γάμους
  choice: 婚宴へ
  rationale: 複数形 γάμους はここでは婚礼に伴う祝宴、とりわけ食事の席を指す。「結婚式」だけでは宴席の文脈が弱くなるため「婚宴」とした。
- source_word: μὴ κατακλιθῇς
  choice: 身を横たえてはならない
  rationale: 古代の正式な食事で横になって食卓につく動作を保った。「座ってはならない」より原文の文化的情景に忠実である。
- source_word: εἰς τὴν πρωτοκλισίαν
  choice: 上席に
  rationale: 宴席で最も名誉ある場所を指す。現代日本語で簡潔かつ自然な「上席」を採用した。
- source_word: μήποτε
  choice: かもしれないからである
  rationale: 禁止の理由となる懸念・可能性を示す。日本語では節末の「かもしれない」によって警告の含意を自然に表した。
- source_word: ἐντιμότερός σου
  choice: あなたよりも重んじられている人
  rationale: 比較級が示す、宴席においてより高い敬意や待遇を受ける人物という意味を表す。「身分の高い」と限定せず、敬意・評価に関する原文の幅を保った。
- source_word: ᾖ κεκλημένος ὑπ’ αὐτοῦ
  choice: その人から招かれているかもしれない
  rationale: 完了受動分詞と接続法の迂言形が示す、すでに招待済みである状態と可能性を表した。「その人」は冒頭の招待者を指す。
theological_decisions: []
translation_notes:
  register: 明快で品位ある現代標準語。「婚宴」「上席」により宴席の場面を簡潔に示し、古代の食事姿勢は本文で保持して脚注で説明した。原文の μήποτε と接続法が含む懸念は「かもしれない」で保持した。
