source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς τοὺς νομικοὺς καὶ Φαρισαίους λέγων· ⸀Ἔξεστιν τῷ σαββάτῳ ⸂θεραπεῦσαι ἢ οὔ⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/003.yaml
  text: And Jesus answered and said to the lawyers and Pharisees[a], “Is it lawful to heal on the Sabbath, or not?”
translation:
  language: ja
  text: イエスは答えて、律法の専門家たち[a]とファリサイ派の人々に言われた。「安息日に癒やすことは許されているか、それとも許されていないか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法学者たち」とも訳せる。ギリシア語は、ユダヤの律法を専門とする人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: 答えて言われた
  rationale: 「答えて、言った」というギリシア語の二重表現を保ちつつ、イエスへの敬意を表す自然な現代日本語とした。明言された問いだけでなく、場の状況や暗黙の挑戦への応答である可能性も残す。
- source_word: νομικοὺς
  choice: 律法の専門家たち
  rationale: 現代の弁護士ではなく、ユダヤの律法に通じた専門家を指すため、誤解の少ない表現を本文に採用した。「律法学者」とも訳せるが、γραμματεύςとの語彙上の区別を見えやすくした。
- source_word: Φαρισαίους
  choice: ファリサイ派の人々
  rationale: 宗教的集団の名称であることが一般読者にも明確になる現代的な表現。
- source_word: Ἔξεστιν
  choice: 律法で許されているか
  rationale: 単なる一般的な許可ではなく、安息日規定をめぐる法的・宗教的問いであることを明確にする。
- source_word: τῷ σαββάτῳ
  choice: 安息日に
  rationale: 時間を示す与格を、簡潔で標準的な日本語にした。
- source_word: θεραπεῦσαι
  choice: 人を癒やすこと
  rationale: 福音書の治癒の文脈に自然な「癒やす」を用いた。目的語は原文で明示されないが、日本語では治療行為を自然に表すため一般的な「人を」を補った。
- source_word: ἢ οὔ
  choice: いないか
  rationale: 二者択一の問いを明確に保ち、イエスの結論を先取りしない。
theological_decisions:
- issue: 安息日の治癒をめぐる問いに結論を加えないこと
  choice: 「安息日に人を癒やすことは律法で許されているか、いないか」
  alternative: 「安息日に人を癒やしてもよいか」
  rationale: 原文の法的・神学的な問いと「それとも否か」という対立を保ち、憐れみ、必要性、またはイエスの権威について、この節にない説明を加えない。
- issue: ἀποκριθείςが何への返答か
  choice: 「答えて」とし、返答の対象を特定しない
  alternative: 「彼らの考えを見抜いて」
  rationale: 直前に明示的な発言がなくても、ἀποκρίνομαιは状況や暗黙の問題への応答を表しうる。原文にない心理描写を補わない。
translation_notes:
  register: 明瞭で品位のある現代標準語。νομικόςを現代の弁護士と誤解させないため「律法の専門家」とし、ファリサイ派は集団名であることを明示した。疑問文は法的な緊張を保つ簡潔な形にした。
