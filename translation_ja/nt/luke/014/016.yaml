  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπός τις ⸀ἐποίει δεῖπνον μέγα, καὶ ἐκάλεσεν πολλούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/016.yaml
  text: But he said to him[a], “A certain man was making a great dinner and invited many,”
translation:
  language: ja
  text: イエスはその人に言った。「ある人が盛大な宴会[a]を用意していて、多くの人を招いた。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「盛大な食事」または「盛大な晩餐」。ギリシア語は一日の主要な食事を指し、ここでは客を招いて催す正式な会食を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: そこで、イエスはその人に言った
  rationale: δέによる前の発言からの応答への移行を「そこで」で自然に示した。ギリシア語では主語が代名詞的に示されるが、日本語では文脈上の話者であるイエスを明示すると分かりやすい。
- source_word: Ἄνθρωπός τις
  choice: ある人が
  rationale: 不定代名詞τιςを伴うたとえ話の導入を、現代日本語で自然な「ある人」とした。
- source_word: ἐποίει
  choice: 催すことにして
  rationale: ποιεῖν δεῖπνονは食事を設ける、催すという意味であり、未完了過去が示す背景的・進行的な状況を、招待に先立つ計画として自然に表した。単なる「作っていた」では料理の調理に限定されかねない。
- source_word: δεῖπνον μέγα
  choice: 盛大な宴会
  rationale: δεῖπνονは主要な食事を指し、ここでは客を招く正式な会食である。μέγαは規模や盛大さを表すため、「盛大な宴会」とした。
- source_word: καὶ ἐκάλεσεν πολλούς
  choice: 大勢の人を招いた
  rationale: 会食の文脈でκαλέωは「招待する」の意。「大勢の人」でπολλούςを自然かつ明確に表した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある物語調とした。「晩餐」はやや古風で時間帯を強く示すため本文では避け、主催される正式な食事という文脈を「宴会」で表した。
