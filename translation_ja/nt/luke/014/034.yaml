  text: Καλὸν ⸀οὖν τὸ ἅλας· ἐὰν δὲ ⸀καὶ τὸ ἅλας μωρανθῇ, ἐν τίνι ἀρτυθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/034.yaml
  text: Salt[a], then, is good; but if even the salt becomes tasteless, with what will it be seasoned?
translation:
  language: ja
  text: ですから、塩は良いものです。しかし、塩でさえ塩気を失った[a]なら、何によって味付けされるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「塩が塩気を失ったなら」とも訳せる。ギリシア語の動詞は字義的には「愚かになる」を意味し得るが、ここでは塩が味を失うことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καλὸν
  choice: 良いものです
  rationale: 塩を一般的に肯定する表現として、自然で過度に意味を限定しない訳とした。
- source_word: οὖν
  choice: ですから
  rationale: 直前の教えを受けた推論・帰結を明確にしつつ、現代日本語として自然にした。
- source_word: ἅλας
  choice: 塩
  rationale: ことわざ的な比喩を解釈的に展開せず、原文どおりの像を保った。
- source_word: ἐὰν δὲ καὶ
  choice: しかし、その塩さえ…なら
  rationale: δέの対照とκαίの強調をともに表し、塩でさえそうなった場合という意外性を保った。
- source_word: μωρανθῇ
  choice: 味を失った
  rationale: 本来は「愚かになる」の意味を持つ動詞だが、塩については味がなくなることを表す慣用的用法である。自然な日本語として「味を失う」とした。
- source_word: ἐν τίνι
  choice: 何によって
  rationale: 味付けを行う手段を問う表現として原文の構造を比較的よく保つ。
- source_word: ἀρτυθήσεται
  choice: 味をつけられるでしょうか
  rationale: 受動態と料理の比喩を保ち、「元に戻す」などの解釈を加えなかった。
theological_decisions:
- issue: 塩の言葉の比喩的意味
  choice: 弟子道への適用を本文中で説明せず、塩の比喩をそのまま残す。
  alternative: 「弟子がその特色を失うなら」などと解釈的に展開する。
  rationale: 具体的な適用は文脈に委ね、原文が持つ比喩と神学的緊張を保持するため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。論理接続は「ですから」、対照は「しかし」で明示し、修辞疑問の形を維持した。
