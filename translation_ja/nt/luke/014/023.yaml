source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ κύριος πρὸς τὸν δοῦλον· Ἔξελθε εἰς τὰς ὁδοὺς καὶ φραγμοὺς καὶ ἀνάγκασον εἰσελθεῖν, ἵνα γεμισθῇ ⸂μου ὁ οἶκος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/023.yaml
  text: And the master said to the servant[a], ‘Go out into the roads and hedges, and compel them to come in, so that my house may be filled.’
translation:
  language: ja
  text: 主人は奴隷に言った。「道や垣根沿いへ出て行き、人々に入って来るよう強く迫りなさい[a]。私の家がいっぱいになるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「無理にでも入らせなさい」。ギリシア語の動詞は「強いる、迫る」という強い意味を持つが、このたとえでは必ずしも物理的な力の行使を意味しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主人
  rationale: たとえの物語内では家と宴席を取り仕切る人物を指すため、神的称号と断定せず、その社会的役割を自然に表した。
- source_word: δοῦλον
  choice: 奴隷
  rationale: δοῦλος が示す隷属身分を「僕」や「しもべ」で弱めず、現代日本語で明確に伝えた。
- source_word: Ἔξελθε
  choice: 出て行き
  rationale: ἐξέρχομαι の外へ向かう方向性を保持した。
- source_word: ὁδοὺς καὶ φραγμοὺς
  choice: 道や垣根沿い
  rationale: ὁδός と φραγμός の具体的な景観を保ちつつ、人を捜す場所として自然な日本語にした。φραγμός は柵とも訳せるが、ここでは道端の境界を表す「垣根」が文脈に合う。
- source_word: ἀνάγκασον
  choice: 強く迫りなさい
  rationale: 動詞の強い働きかけを保ちながら、このたとえに物理的暴力を明示的に持ち込まない表現とした。語のさらに強い訳語は脚注に示した。
- source_word: εἰσελθεῖν
  choice: 入って来るよう
  rationale: 話し手の家へ入ることなので、日本語では「入って来る」が自然である。
- source_word: ἵνα γεμισθῇ μου ὁ οἶκος
  choice: 私の家をいっぱいにするためだ
  rationale: ἵνα の目的を明示し、受動形を日本語として自然な目的表現に転換した。οἶκος は宴席の場所である家を指す。
theological_decisions:
- issue: たとえにおける κύριος の訳語
  choice: 主人
  alternative: 主
  rationale: ここでは物語内の家の主人を指す。直接の神的称号と決めつけず、たとえが持つ神学的含意は文脈から読み取れるようにした。
- issue: ἀνάγκασον の強制性
  choice: 入って来るよう強く迫りなさい
  alternative: 無理にでも入らせなさい
  rationale: 原語の強さを「強く迫る」で保持した一方、文脈が必ずしも身体的強制を意味しないことを脚注で示し、語の緊張を解消し切らないようにした。
translation_notes:
  register: 明快な現代標準日本語を用い、たとえの命令口調にふさわしい簡潔さと品位を保った。「奴隷」は歴史的な身分を曖昧にしないため採用し、「強く迫る」は原語の強さと文脈上の曖昧さを両立させた。
