  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι οὐδεὶς τῶν ἀνδρῶν ἐκείνων τῶν κεκλημένων γεύσεταί μου τοῦ ⸀δείπνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/024.yaml
  text: For I tell you that none of those men who were invited will taste my dinner[a].
translation:
  language: ja
  text: あなたがたに言っておくが、招かれていたあの男たちのうち、だれ一人として、私の食事[a]を味わうことはない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私の宴」。伝統的には「私の晩餐」。
    reason: δεῖπνονは食事を指し、文脈によっては宴会・祝宴の食事を指しうるため。
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: あなたがたに言っておく
  rationale: γάρは直前の宣言を受けて理由や確証を示すが、日本語では文脈上明らかなため独立した接続詞を置かず、厳粛な直接話法として自然に表した。複数のὑμῖνも「あなたがた」で保持した。
- source_word: οὐδεὶς τῶν ἀνδρῶν ἐκείνων
  choice: あの人たちのうち、だれ一人
  rationale: οὐδείςの全面的かつ強い否定を「だれ一人」で表し、ἐκείνωνの指示性を「あの」で保持した。ἀνδρῶνは男性を指し得るが、現代日本語の「人たち」は文脈中の招待客を自然に指し、性別を不必要に強調しない。
- source_word: τῶν κεκλημένων
  choice: 招かれていた
  rationale: καλέωの完了受動分詞が示す、すでに招待を受けた状態を自然な日本語で表した。宴席の文脈なので「呼ばれていた」より「招かれていた」が明確である。
- source_word: γεύσεταί
  choice: 味わうことはない
  rationale: γεύομαιの具体的な食事のイメージを保つため「食べる」「あずかる」ではなく「味わう」とした。未来の否定は「ことはない」で明確にした。
- source_word: μου τοῦ δείπνου
  choice: 私の宴の食事
  rationale: μουの所有を「私の」で保持した。δεῖπνονは主要な食事、夕食、宴席の食事を指し得るため、祝宴の文脈と実際の食事の双方が伝わる「宴の食事」とした。
theological_decisions:
- issue: 主人の一人称所有表現とたとえの神学的含意
  choice: 「私の宴の食事」とし、話者である主人の言葉として保持する
  alternative: 「神の国の宴」などと明示的に寓意化する
  rationale: 原文はたとえの物語内でμουを用いている。訳文では排除の厳しさを含む所有表現を保ちつつ、その宴が何を象徴するかを本文中で断定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、宣告の厳粛さを保った。節末の閉じかぎ括弧は、この発言が直前から続く直接話法であることを示す。
