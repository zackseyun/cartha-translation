id: LUK.14.26
reference: Luke 14:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἴ τις ἔρχεται πρός με καὶ οὐ μισεῖ τὸν πατέρα ⸀ἑαυτοῦ καὶ τὴν μητέρα καὶ τὴν γυναῖκα καὶ τὰ τέκνα καὶ τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς, ἔτι ⸀τε καὶ τὴν ⸂ψυχὴν ἑαυτοῦ⸃, οὐ δύναται ⸂εἶναί μου μαθητής⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/026.yaml
  text: If anyone comes to me and does not hate his own father and mother and wife and children and brothers and sisters—and even his own life—he cannot be my disciple[a][b].
translation:
  language: ja
  text: 誰でも、わたしのもとに来て、自分の父と母、妻、子ども、兄弟、姉妹を、さらには自分のいのち[b]さえも憎まない[a]なら、わたしの弟子になることはできない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の父や母などを、わたしよりも愛するなら」とも理解できる。動詞の字義は「憎む」だが、ここでは、最も近い家族との結びつきよりもイエスへの忠誠を優先するよう求める表現である。マタイ10章37節参照。
    reason: lexical_alternative
  - marker: b
    text: 「自分の魂」とも訳せる。ここで「いのち」とした語は、弟子となる代価についての文脈では、その人自身の生命や生を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μισεῖ
  choice: 憎まないなら
  rationale: 動詞の直接的で強い語義「憎む」を本文に残し、イエスの言葉が持つ意図的な厳しさを弱めない。家族よりイエスへの忠誠を優先する比較的な含みは脚注で示す。
- source_word: ἔρχεται πρός με
  choice: わたしのもとに来て
  rationale: πρός με の方向性と関係性を自然な現代日本語で表し、原文にない「わたしについて来る」を持ち込まない。
- source_word: πατέρα ἑαυτοῦ
  choice: 自分の父
  rationale: 再帰代名詞 ἑαυτοῦ の個人的な強調を「自分の」で明示する。
- source_word: γυναῖκα
  choice: 妻
  rationale: 家族成員を列挙する文脈では、γυνή は一般的な「女」ではなく「妻」を指す。
- source_word: τὰ τέκνα
  choice: 子ども
  rationale: 性別を限定しない τέκνα を、明快で自然な現代日本語にする。
- source_word: τοὺς ἀδελφοὺς καὶ τὰς ἀδελφάς
  choice: 兄弟、姉妹
  rationale: 原文が男性・女性双方のきょうだいを明記しているため、両方を訳出する。
- source_word: ἔτι τε καὶ
  choice: さらには…さえも
  rationale: 列挙の最後に置かれた項目を際立たせる原文の累加的・頂点的な強調を表す。
- source_word: ψυχὴν ἑαυτοῦ
  choice: 自分のいのち
  rationale: 弟子となる代価という文脈では ψυχή は狭義の非物質的な「魂」よりも、その人自身の生命・生そのものを指す。「いのち」はこの意味を自然に伝える。
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: わたしの弟子になることはできない
  rationale: 単なる禁止ではなく、弟子であることとの両立不能を示す οὐ δύναται の強さを保つ。
theological_decisions:
- issue: μισεῖ の厳しい表現を本文で比較表現に和らげるか
  choice: 本文では「憎む」を保ち、比較・優先順位の含みを脚注で説明する。
  alternative: 本文を「わたしより少なく愛さないなら」または「わたし以上に愛するなら」とする。
  rationale: 原文の表現は意図的に峻烈であり、本文で比較表現に置き換えると解釈によって緊張を解消してしまう。脚注により、家族への敵意を命じるというより、イエスへの忠誠を最優先させる要求である可能性を示す。
- issue: ψυχή の意味
  choice: 「いのち」と訳す。
  alternative: 「魂」または「自分自身」と訳す。
  rationale: 弟子となる代価を語るこの文脈では、自分の生命・生への究極的な執着まで従属させることが焦点であり、「いのち」が現代日本語で最も明瞭である。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、イエスの発言の荘重さと衝撃を保った。「いのち」は本文の宗教的・倫理的な重みを自然に表すため、ひらがな表記とした。家族関係の列挙は簡潔にし、最後の「自分のいのち」を「さらには」「さえも」で際立たせた。
