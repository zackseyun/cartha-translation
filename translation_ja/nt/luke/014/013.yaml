id: LUK.14.13
reference: Luke 14:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν ⸂δοχὴν ποιῇς⸃, κάλει πτωχούς, ἀναπείρους, χωλούς, τυφλούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/013.yaml
  text: But whenever you give a banquet[a], invite the poor, the crippled, the lame[b], the blind.
translation:
  language: ja
  text: しかし、宴会を催すときには[a]、貧しい人たち、体の不自由な人たち[b]、足の不自由な人たち、目の見えない人たちを招きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祝宴を開くときには」または「もてなしの会を設けるときには」。
    reason: lexical_alternative
  - marker: b
    text: 「体に障害のある人たち」とも訳せる。ギリシア語は身体に障害や損傷のある人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の、招くべきでない人々についての教えと対照をなす逆接を、簡潔で自然な日本語で示す。
- source_word: ὅταν
  choice: ときには
  rationale: 接続法を伴う不定の時を表し、一度限りでなく、そのような機会ごとに当てはまる指示であることを示す。日本語では「宴会を催すときには」が自然にこの一般性を伝える。
- source_word: δοχὴν ποιῇς
  choice: 宴会を催す
  rationale: 「宴・会食を設ける」という慣用表現。単なる食事より広いもてなしの場を表し、現代日本語として自然である。
- source_word: κάλει
  choice: 招きなさい
  rationale: 会食への招待という文脈での命令形なので、「呼びなさい」ではなく「招きなさい」とする。
- source_word: πτωχούς
  choice: 貧しい人たち
  rationale: 実体詞的な形容詞を、現代日本語で人を明示する自然な表現にした。
- source_word: ἀναπείρους
  choice: 体の不自由な人たち
  rationale: 身体に障害・損傷のある人々を指す語。χωλούςとの区別を保ちつつ、侮蔑的に響きうる古い表現を避けた。
- source_word: χωλούς
  choice: 足の不自由な人たち
  rationale: 歩行に支障のある人々を特に指すため、より広いἀναπείρουςと区別して表す。
- source_word: τυφλούς
  choice: 目の見えない人たち
  rationale: 視覚を失った人々を指す語を、明瞭で一般的な現代日本語にした。
theological_decisions:
- issue: 身体的障害を表す二語ἀναπείρουςとχωλούςの訳し分け
  choice: 「体の不自由な人たち、足の不自由な人たち」とし、広い身体障害と歩行障害を区別する。
  alternative: 両者を「障害のある人たち」などにまとめる、または「不具の人たち、足の不自由な人たち」のような伝統的表現を用いる。
  rationale: 原文が別々に列挙する社会的に疎外された集団の区別を保つ一方、現代日本語で不用意に侮蔑的となる語を避ける。本文は障害の性質について教理的定義をするのではなく、見返りを期待できない人々へのもてなしを命じている。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の簡潔な列挙を保ちながら、日本語では各項目に「人たち」を補って自然さと人への配慮を確保した。
