  text: But they kept silent[a]. And taking hold of him[b], he healed him and sent him away.
translation:
  language: ja
  text: しかし、彼らは黙っていた[a]。イエスはその人をつかみ、癒やしてから帰らせた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何も言わなかった」「沈黙していた」。
    reason: lexical_alternative
  - marker: b
    text: または「去らせた」「解放した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: しかし、彼らは
  rationale: οἱは直前の律法の専門家たちとファリサイ派の人々を指し、δέはイエスの問いに対する対照的な反応を示すため、「しかし」とした。
- source_word: ἡσύχασαν
  choice: 黙っていた
  rationale: この文脈では、問いに答えず沈黙していたことを自然な現代日本語で表す。アオリストを必要以上に瞬間的な動作として限定しない。
- source_word: ἐπιλαβόμενος
  choice: その人に手をかけ
  rationale: ἐπιλαμβάνομαιの身体的に触れてつかむ含意を保ちつつ、日本語で乱暴な印象を与えにくい表現とした。
- source_word: ἰάσατο αὐτόν
  choice: 癒やして
  rationale: ἰάομαιの身体的な治癒を、聖書文体として定着しつつ現代でも明瞭な「癒やす」で表した。目的語は前節から明白であり、直前にも「その人」と示したため省略した。
- source_word: ἀπέλυσεν
  choice: 帰らせた
  rationale: ἀπολύωには「解放する」「立ち去らせる」の幅がある。拘束からの釈放を示す文脈ではないため、治癒後にその場から送り出したことを自然に表す「帰らせた」を本文に採用し、別訳を注記した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準語。「そこで」により、相手たちの沈黙を受けたイエスの次の行為を自然につないだ。「手をかけ」は接触を保持するが、治癒の具体的な手技までは補わない。
