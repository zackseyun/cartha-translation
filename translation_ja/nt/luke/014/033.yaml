id: LUK.14.33
reference: Luke 14:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως οὖν πᾶς ἐξ ὑμῶν ὃς οὐκ ἀποτάσσεται πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν οὐ δύναται ⸂εἶναί μου⸃ μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/033.yaml
  text: So then[b][a], every one of you who does not renounce all his own possessions cannot be my disciple.
translation:
  language: ja
  text: ですから、あなたがたのうち、自分の持ち物すべてに別れを告げない人は、だれ一人として、わたしの弟子になることができません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の持っているものをすべて手放さない人」とも訳せる。ギリシア語の動詞は「別れを告げる」という意味を持ち、ここでは所有物に対する権利や執着を放棄することを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως οὖν
  choice: ですから
  rationale: 直前の二つのたとえを受け、その結論を導く推論のつながりを、自然な現代日本語で示す。οὕτωςの「このように」という響きも文脈の中に含ませる。
- source_word: πᾶς ἐξ ὑμῶν
  choice: あなたがたのうち…だれも
  rationale: 各人に例外なく要求が及ぶという分配的な強調を、日本語として自然な構文で表す。
- source_word: ὃς οὐκ ἀποτάσσεται
  choice: 別れを告げない人
  rationale: ἀποτάσσομαιの基本的な「別れを告げる、いとまを告げる」という比喩を保ち、所有物を物理的に処分することだけに意味を限定しない。
- source_word: πᾶσιν τοῖς ἑαυτοῦ ὑπάρχουσιν
  choice: 自分の持ち物すべてに
  rationale: ὑπάρχουσινを所有物・財産の意味に取り、ἑαυτοῦの再帰的な意味を「自分の」で明示する。
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: わたしの弟子になることができません
  rationale: 単なる不適切さではなく、不可能・不能を表すοὐ δύναταιの強さを保つ。
- source_word: μαθητής
  choice: 弟子
  rationale: 福音書におけるイエスへの従属と学びの関係を示す定着した訳語である。
theological_decisions:
- issue: 所有物に関する要求の性質
  choice: 「自分の持ち物すべてに別れを告げる」と訳し、あらゆる所有権や執着を放棄するという厳しい要求を表す。
  alternative: 「自分の持ち物をすべて手放す」とし、実際の処分をより前面に出す。
  rationale: ἀποτάσσεταιの語義上の比喩を保持し、文字どおりの全面的財産処分か、所有への権利・執着の放棄かを本文だけで断定しない。要求の厳しさと解釈上の緊張をともに残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの言葉としての厳粛さを保った。「別れを告げる」は原語の比喩を生かすため、やや印象的だが普通の読者にも理解できる表現とした。日本語では「自分」が性別を特定せず、ギリシア語の総称的な男性単数形を自然に包含するため、性に関する注は不要と判断した。
