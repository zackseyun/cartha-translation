revisions:
- from: また、どんな王が、ほかの王と戦おうとして出て行くとき、まず座って、二万人を率いて攻めて来る相手を、一万人で迎え撃つことができるかどうか、よく考えないでしょうか。
  to: また、ほかの王と戦うために出て行く王が、二万人を率いて攻めて来るほかの王を一万人で迎え撃つことができるかどうか、まず座って考えないでしょうか。
  rationale: 原文の相手が王であることを訳文に明示し、原文にない強調語「よく」を省いた。それ以外は、軍事的比喩、兵力の比率、肯定的な答えを期待する修辞疑問を保っている。
