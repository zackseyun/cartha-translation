review_pass:
  verdict: revise
  source_fidelity: 全体として原文の修辞疑問、兵力の対比、敵対して進軍して来る状況を適切に伝えている。ただし、原文で繰り返し指示される相手が「王」であることを訳文でも明示するほうが忠実である。「よく」はβουλεύσεται（熟慮する／検討する）に含意されうるが、必須ではないため省く。
  naturalness: 現代標準日本語として自然で明瞭である。「まず座って考えないでしょうか」は、比喩的・修辞的な流れを損なわず、καθίσας πρῶτον βουλεύσεταιを素直に表す。
  terminology: 「王」「戦う」「一万人／二万人」「迎え撃つ」は文脈に適した語である。「迎え撃つ」は軍事的なὑπαντῆσαιの文脈上の意味を自然に反映する。
  issues:
  - severity: low
    issue: 「二万人を率いて攻めて来る相手」では、原文の指示対象である「王」が明示されていない。
    rationale: 直前に「ほかの王」が出ているため意味は通じるが、τῷ…ἐρχομένῳはその敵対する王を指す。『ほかの王』を明記すると指示関係と原文の表現をより明確に保てる。
  - severity: low
    issue: 「よく」は原文に明示されない程度の強調である。
    rationale: βουλεύσεταιは単に考えるより熟慮する意味を持つが、日本語の文脈と『まず座って』で十分に表現されるため、余分な強調は避けられる。
