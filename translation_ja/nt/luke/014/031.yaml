id: LUK.14.31
reference: Luke 14:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ τίς βασιλεὺς πορευόμενος ⸂ἑτέρῳ βασιλεῖ συμβαλεῖν⸃ εἰς πόλεμον οὐχὶ καθίσας πρῶτον ⸀βουλεύσεται εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν ⸀ὑπαντῆσαι τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/031.yaml
  text: Or what king[a], going to meet another king in war, will not first sit down and consider whether he is able with ten thousand to oppose the one coming against him with twenty thousand?
translation:
  language: ja
  text: また、ほかの王と戦うために出て行く王が、二万人を率いて攻めて来るほかの王を一万人で迎え撃つことができるかどうか、まず座って考えないでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ
  choice: また
  rationale: 直前のたとえに続く第二の比較を自然に導く接続表現。
- source_word: τίς βασιλεὺς
  choice: どんな王が
  rationale: 肯定の答えを期待する一般的な修辞疑問として自然な日本語。
- source_word: πορευόμενος ἑτέρῳ βασιλεῖ συμβαλεῖν εἰς πόλεμον
  choice: ほかの王と戦おうとして出て行くとき
  rationale: 移動の意と、別の王との武力衝突に赴く目的を明確かつ自然に表す。
- source_word: οὐχὶ καθίσας πρῶτον βουλεύσεται
  choice: まず座って……よく考えないでしょうか
  rationale: 行動の順序と熟慮の意味を保ち、肯定を期待する修辞疑問を現代日本語で表した。
- source_word: εἰ δυνατός ἐστιν ἐν δέκα χιλιάσιν
  choice: 一万人で……ことができるかどうか
  rationale: 兵力を手段・随伴として示すἐνと、能力を問う表現を簡潔に訳した。
- source_word: ὑπαντῆσαι
  choice: 迎え撃つ
  rationale: 基本的な『会う、出迎える』という像を残しつつ、軍事的文脈で敵軍に対抗する意味を自然に示す。
- source_word: τῷ μετὰ εἴκοσι χιλιάδων ἐρχομένῳ ἐπ’ αὐτόν
  choice: 二万人を率いて攻めて来る相手
  rationale: 敵対的に迫る相手と、その兵力を明瞭に表現した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえ話としての格調を保った。『一万』『二万』ではなく人数であることが明白な『一万人』『二万人』とし、『迎え撃つ』によって軍事的状況を過不足なく示した。
