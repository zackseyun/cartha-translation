id: LUK.14.21
reference: Luke 14:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ παραγενόμενος ὁ ⸀δοῦλος ἀπήγγειλεν τῷ κυρίῳ αὐτοῦ ταῦτα. τότε ὀργισθεὶς ὁ οἰκοδεσπότης εἶπεν τῷ δούλῳ αὐτοῦ· Ἔξελθε ταχέως εἰς τὰς πλατείας καὶ ῥύμας τῆς πόλεως, καὶ τοὺς πτωχοὺς καὶ ἀναπείρους καὶ ⸂τυφλοὺς καὶ χωλοὺς⸃ εἰσάγαγε ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/021.yaml
  text: And when the servant came back[a], he reported these things to his lord. Then the master of the house, becoming angry, said to his servant, ‘Go out quickly into the broad streets and lanes of the city[b], and bring in here the poor and disabled and blind and lame.’
translation:
  language: ja
  text: そのしもべ[a]が戻って来て、これらのことを主人に報告した。すると、家の主人は怒って、しもべに言った。「すぐに町の大通りや路地へ出て行き、貧しい人たち、身体に障害のある人たち[b]、目の見えない人たち、足の不自由な人たちを、ここに連れて来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」とも訳せる。原語（δοῦλος）は、主人に属して仕える者を表す。
    reason: lexical_alternative
  - marker: b
    text: 「手足の不自由な人たち」とも訳せる。原語（ἀνάπηρος）は、身体機能が損なわれた人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγενόμενος
  choice: 戻って来て
  rationale: このしもべが先の指示を実行した後、主人のもとへ戻って報告するという物語の流れを、自然な日本語で明示した。
- source_word: δοῦλος
  choice: しもべ
  rationale: 奴隷身分を表し得る語だが、ここではたとえ話の中の家内的な上下関係と使者としての役割が前景化されているため、「しもべ」とした。別訳の可能性は脚注に示した。
- source_word: ἀπήγγειλεν
  choice: 報告した
  rationale: 得た返答を主人に伝える場面なので、上位者への伝達を自然に表す「報告した」が適切である。
- source_word: κυρίῳ
  choice: 主人
  rationale: ここでは神への称号ではなく、しもべの人間の主人を指す。日本語では「主人」が関係を明確に表す。
- source_word: ὀργισθεὶς
  choice: 怒って
  rationale: 主人が報告を受けて怒り、その後に命令したという分詞の時間的・反応的な関係を簡潔に保った。
- source_word: οἰκοδεσπότης
  choice: 家の主人
  rationale: 家や世帯を治める者という語の構成と、宴会を催す家の場面を保つ表現である。
- source_word: πλατείας
  choice: 大通り
  rationale: 広い道路・公の通りを表す語であり、次の狭い「路地」との対照を自然に示す。
- source_word: ῥύμας
  choice: 路地
  rationale: 町の比較的狭い道を指すため、「大通り」と対照的な「路地」とした。
- source_word: ἀναπείρους
  choice: 身体に障害のある人たち
  rationale: 身体機能が損なわれた人々を広く指す語として、現代日本語で明確かつ尊厳ある表現を選んだ。より限定的な解釈は脚注に示した。
- source_word: τυφλοὺς
  choice: 目の見えない人たち
  rationale: 現代の一般読者に明瞭で自然な表現とした。
- source_word: χωλοὺς
  choice: 足の不自由な人たち
  rationale: 歩行に障害のある人を指す語義を、直前のより広い表現と区別して明確にした。
- source_word: εἰσάγαγε ὧδε
  choice: ここに連れて来なさい
  rationale: 外から中へ導き入れる方向性と、話者のいる場所を示す「ここ」を保った。
theological_decisions:
- issue: たとえ話における δοῦλος の訳語
  choice: しもべ
  alternative: 奴隷
  rationale: 原語は法的・社会的な奴隷身分を含み得るが、この節では主人の命令を受けて報告する家内の役割が中心である。「しもべ」は物語上の関係を自然に示しつつ、原語の別の側面を脚注で保持する。
- issue: 人間を指す κύριος の訳語
  choice: 主人
  alternative: 主
  rationale: この箇所の指示対象はたとえ話の中の人間の主人であり、神的・キリスト論的称号ではない。「主人」とすることで、その区別を明確にした。
- issue: ἀνάπηρος と χωλός の区別
  choice: 「身体に障害のある人たち」と「足の不自由な人たち」
  alternative: 「手足の不自由な人たち」と「足の不自由な人たち」
  rationale: 前者の意味範囲を広く取り、後者の歩行障害との重なりを過度に狭めず、原文の列挙を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、たとえ話にふさわしい落ち着いた語調を保った。「しもべ」は本文の語調と家内的関係を示すため平仮名表記とし、障害に関する表現は原語の区別を保ちつつ、現代の読者に尊厳ある言い方を採用した。
