  yaml_path: translation/nt/luke/014/017.yaml
  text: And at the hour of the dinner he sent his servant to say to those who had been invited[a], ‘Come, because it is already ready.’
translation:
  language: ja
  text: 夕食の時刻に、主人は自分の召使いを遣わし、すでに招かれていた人々にこう言わせた。「お越しください。もう用意が整っています[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「もうすべての用意が整っています」。ギリシア語は集合的な複数形を用いていますが、何が整ったのかは明示していません。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 遣わし
  rationale: 使者として送り出す動作を、文脈に合う自然で格調ある日本語で表した。
- source_word: τὸν δοῦλον αὐτοῦ
  choice: 主人は僕を
  rationale: 日本語では所有代名詞を直訳するより、文脈上の主体を「主人」と補うほうが自然。「僕」は家に仕える者という物語上の役割を簡潔に示す。
- source_word: τῇ ὥρᾳ τοῦ δείπνου
  choice: 夕食の時刻になると
  rationale: 食事の定められた時が来たことを明確にしつつ、現代日本語として自然にした。
- source_word: τοῖς κεκλημένοις
  choice: 招かれていた人々に
  rationale: 完了受動分詞が示す、すでに招待を受けていた状態を保持した。
- source_word: Ἔρχεσθε
  choice: おいでください
  rationale: 招待客への呼びかけとして自然な丁寧さを持たせ、命令の力を不必要に強めない。
- source_word: ἤδη ἕτοιμά ἐστιν
  choice: もう用意ができています
  rationale: 中性複数形容詞と単数動詞による集合的で主語省略的な表現を、日本語でも対象を限定しすぎず自然に訳した。
