id: LUK.14.14
reference: Luke 14:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μακάριος ἔσῃ, ὅτι οὐκ ἔχουσιν ἀνταποδοῦναί σοι, ἀνταποδοθήσεται γάρ σοι ἐν τῇ ἀναστάσει τῶν δικαίων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/014.yaml
  text: And you will be blessed[a], because they cannot repay you[b]; for you will be repaid at the resurrection of the righteous.
translation:
  language: ja
  text: そうすれば、あなたは幸いな者となります。なぜなら、彼らはあなたに返礼できないからです。あなたは、正しい人たちの復活の時に報いを受けるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: 幸いです
  rationale: イエスの幸いの宣言に通じる宗教的・終末的な重みを保ちつつ、現代日本語として自然にした。「幸福です」よりも主観的感情に限定されにくい。
- source_word: οὐκ ἔχουσιν ἀνταποδοῦναί σοι
  choice: 彼らにはあなたにお返しすることができない
  rationale: 直訳的には「返すものを持っていない」に近いが、ここでは資力・手段がなく返礼できないことを表す。「返す必要がない」という誤解を避けた。
- source_word: ἀνταποδοθήσεται γάρ σοι
  choice: あなたは……報いていただけるからです
  rationale: 未来受動を、究極的な報いの授与者である神を本文に明示せずに示唆する日本語の受益表現で訳した。前半の人間による「お返し」と後半の終末的な「報い」の対応も保つ。
- source_word: ἐν τῇ ἀναστάσει
  choice: 復活の時に
  rationale: ἐν の時間的用法を自然な現代日本語で表した。
- source_word: τῶν δικαίων
  choice: 正しい者たちの
  rationale: 属格をそのまま保ち、復活が「正しい者たち」に関連づけられていることを明確にした。「義人」は簡潔だが、一般読者への明瞭さを優先した。
theological_decisions:
- issue: 「正しい者たちの復活」の意味
  choice: 正しい者たちに結びつく将来の復活として、そのまま訳す
  alternative: 一般的復活のうち正しい者に焦点を当てる理解、または他の者とは別個の復活とする理解
  rationale: 本文は将来の復活における報いを述べるが、復活の順序や構造までは確定していないため、特定の終末論体系を訳文に持ち込まない。
- issue: 報いを与える主体
  choice: 「報いていただける」とし、神を明示的に補わない
  alternative: 「神があなたに報いてくださる」
  rationale: ギリシア語は神的受動と理解できるが、行為者を明記していない。自然な日本語を保ちながら、原文以上の明示を避けた。
translation_notes:
  register: 明瞭で現代的な敬体。直前の勧めを受ける「そうすれば」を補い、因果関係を二文で読みやすく示した。尊厳を保ちつつ、文語的な「義人」「報いられる」は避けた。
