source:
  edition: SBLGNT
  text: καὶ ἤρξαντο ἀπὸ μιᾶς ⸂πάντες παραιτεῖσθαι⸃. ὁ πρῶτος εἶπεν αὐτῷ· Ἀγρὸν ἠγόρασα καὶ ἔχω ἀνάγκην ⸀ἐξελθὼν ἰδεῖν αὐτόν· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/018.yaml
  text: But they all alike began to excuse themselves[a]. The first said to him, ‘I have bought a field, and I need to go out and see it. I ask you[b], consider me excused.’
translation:
  language: ja
  text: ところが、皆がそろって断り始めた[a]。最初の人は彼に言った。「畑を買ったので、見に行かなければなりません。どうか、辞退したものとして扱ってください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「皆が一様に」、あるいは「皆が一斉に」。ギリシア語の表現は「皆がそろって」「一つになって」という意味の慣用句である。動詞は、理由を申し立てて招待を断ることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: ところが
  rationale: 直前の招待に対して客たちが拒むという展開の転換を、自然な現代日本語で示す。
- source_word: ἤρξαντο ... πάντες παραιτεῖσθαι
  choice: 皆が…断り始めた
  rationale: παραιτεῖσθαι はここでは招待を辞退することを表し、ἤρξαντο の開始相と πάντες の全体性を明示する。後続の発言から、理由を添えて断る含みもある。
- source_word: ἀπὸ μιᾶς
  choice: 一様に
  rationale: 字義的には「一つから」だが、「そろって」「同じように」を意味する慣用句。日本語では「一様に」が全員に共通する反応を簡潔に表す。
- source_word: Ἀγρόν
  choice: 畑
  rationale: ἀγρός の基本義である畑・土地の一区画を直接的に訳し、「農場」のような余分な含意を避ける。
- source_word: ἠγόρασα
  choice: 買った
  rationale: アオリストの完了した過去の行為を自然な日本語で表す。
- source_word: ἔχω ἀνάγκην
  choice: …なければなりません
  rationale: 必要・必然を表す慣用表現を、発話として自然で明確な日本語にする。
- source_word: ἐξελθὼν ἰδεῖν αὐτόν
  choice: 見に行く
  rationale: 外へ出てそれを見るという付帯的な動作を自然な語順で表す。「検分する」は原文以上に専門的な意味を加えうるため避ける。
- source_word: ἐρωτῶ σε
  choice: どうか
  rationale: 明示的な依頼表現を、日本語の丁寧な願いとして自然に表す。
- source_word: ἔχε με παρῃτημένον
  choice: 辞退したものとして扱ってください
  rationale: 完了分詞が示す辞退済みの状態と、それを相手に受け入れてもらう依頼を保持する。「お許しください」では罪責や赦免の含意が強くなりうる。
- source_word: ὁ πρῶτος
  choice: 最初の人
  rationale: 一連の辞退者のうち第一の者を明確に示す。
