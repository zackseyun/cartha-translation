  text: καὶ ἕτερος εἶπεν· Ζεύγη βοῶν ἠγόρασα πέντε καὶ πορεύομαι δοκιμάσαι αὐτά· ἐρωτῶ σε, ἔχε με παρῃτημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/019.yaml
  text: And another said[a], ‘I have bought five yoke of oxen, and I am going to test them. I ask you[b], consider me excused.’
translation:
  language: ja
  text: 別の人は言った。「牛を五組[a]買ったので、これからその牛を試しに行くところです。どうか、欠席をお許しください[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「五くびきの牛」。一くびきは、共にくびきをかけて働かせる一対の牛を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「私を免除された者として扱ってください」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: また別の人
  rationale: 招待された人々が次々に断る文脈で、系列中のもう一人を自然に示す。
- source_word: Ζεύγη βοῶν πέντε
  choice: 牛を五組
  rationale: ζεῦγοςは一緒にくびきをかけて働かせる一対を指す。「五組」は現代日本語として明瞭で、各組が一対であることは脚注で補った。
- source_word: ἠγόρασα
  choice: 買った
  rationale: アオリストの完了した購入を自然な日本語の過去形で表し、その結果が現在の断りの理由であることは文脈から明らかである。
- source_word: πορεύομαι δοκιμάσαι αὐτά
  choice: これから試しに行くところです
  rationale: 現在の移動・差し迫った意図と、購入した牛の働き具合を試す目的を、自然な現代日本語で表す。
- source_word: ἐρωτῶ σε
  choice: どうか
  rationale: 依頼を導く丁寧な表現として訳し、原文の直接的な願いを過度に強めない。
- source_word: ἔχε με παρῃτημένον
  choice: 欠席をお許しください
  rationale: 直訳調を避けつつ、宴席への招待を断り、自分を免除された者として扱ってほしいという慣用的意味を伝える。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準語を用い、話者の丁寧な断り口調を保った。「五くびき」は現代の一般読者には分かりにくいため本文では「五組」とし、農耕上の具体的な意味を脚注で示した。
