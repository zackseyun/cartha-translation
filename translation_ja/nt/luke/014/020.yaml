  yaml_path: translation/nt/luke/014/020.yaml
  text: And another said[a], ‘I have married a wife, and for this reason I cannot come.’
translation:
  language: ja
  text: また別の人は言った。「妻を迎えました[a]。そのため、行くことができません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「妻をめとりました」。すなわち、「結婚しました」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερος
  choice: また別の人
  rationale: 断りを述べる人がさらに一人続くことを、文脈に即して自然に示す。
- source_word: Γυναῖκα ἔγημα
  choice: 妻を迎えました
  rationale: γυνήはγαμέωの目的語なので「妻」の意味。日本語では「妻をめとった」より「妻を迎えました」が現代的で自然であり、結婚したという完了した出来事を表せる。時制だけから「結婚したばかり」とまでは限定しない。
- source_word: διὰ τοῦτο
  choice: そのため
  rationale: 結婚したことを、出席できないとする理由として明確につなぐ。
- source_word: οὐ δύναμαι ἐλθεῖν
  choice: 行くことができません
  rationale: 話し手が主張する不可能・不能を保つ。招待を受けた側の日本語として「行く」が自然であり、原文にない敬語的含意は加えない。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、話者の丁寧な返答として「ました／ません」体にした。原文が明示しない結婚の新しさや法的・宗教的理由は補わず、述べられた因果関係だけを保持した。
