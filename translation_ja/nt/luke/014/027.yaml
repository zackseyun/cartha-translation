id: LUK.14.27
reference: Luke 14:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὅστις οὐ βαστάζει τὸν σταυρὸν ⸀ἑαυτοῦ καὶ ἔρχεται ὀπίσω μου, οὐ δύναται εἶναί μου μαθητής.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/027.yaml
  text: Whoever does not carry his own cross and come after me cannot be my disciple[a][b].
translation:
  language: ja
  text: 自分の十字架を背負い[a]、わたしの後について来る[b]のでなければ、だれもわたしの弟子になることはできない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「担い」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「わたしの後ろに来る」。「わたしについて来る」という一般的な弟子への招きの表現と比較。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: だれも〜のでなければ
  rationale: 不定関係代名詞が示す一般的・普遍的な条件を、現代日本語で自然な条件構文として表した。
- source_word: βαστάζει
  choice: 背負い
  rationale: 基本義は「運ぶ、担う」。十字架を処刑場まで運ぶ具体的な像と、弟子として負う代償の比喩的な力の双方を自然に伝える。
- source_word: τὸν σταυρὸν ἑαυτοῦ
  choice: 自分の十字架
  rationale: σταυρόςの標準的な訳語を用い、再帰代名詞ἑαυτοῦの「自分自身の」という個別的な強調も保持した。日本語の「自分」は、原文の総称的な単数を不自然な性別表現なしに表せる。
- source_word: ἔρχεται ὀπίσω μου
  choice: わたしの後について来る
  rationale: 直訳的な「わたしの後ろに来る」という移動の像を保ちつつ、弟子として従う含意が自然に伝わる表現とした。単に「従う」として像を解消しなかった。
- source_word: οὐ δύναται εἶναί μου μαθητής
  choice: わたしの弟子になることはできない
  rationale: 禁止ではなく、弟子であることとの不両立・不可能性を表す構文であるため、「できない」とした。
- source_word: μαθητής
  choice: 弟子
  rationale: 福音書の文脈で、単なる学習者ではなく、師に従う者を表す定着した訳語である。
theological_decisions:
- issue: 十字架の具体的な処刑の像と、弟子としての代償という比喩的含意
  choice: 「自分の十字架を背負い」として、具体的な像をそのまま保持する
  alternative: 「自分に課された苦難を耐え忍び」などと意味を説明して訳す
  rationale: 原文は解釈を説明せず、処刑器具である十字架の強烈な像によって弟子道の代償を語る。訳文でもその緊張と比喩の開かれた意味を保つ。
- issue: οὐ βαστάζει … καὶ ἔρχεταιの否定の及ぶ範囲
  choice: 「背負い、…来るのでなければ」とし、二つを一まとまりの弟子道の条件として表す
  alternative: 「背負って、…来ない者は」とし、表面上は後半だけを否定する形にする
  rationale: 原文では否定辞が関係節の連結された行為全体を支配する。日本語で否定の範囲が後半だけに狭まる誤解を避けつつ、両行為の結びつきを保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「だれも〜のでなければ」とすることでὅστιςの普遍性を自然に示し、否定の範囲も明確にした。「背負う」「後について来る」により、具体的な移動の像と弟子道の含意をともに保持した。
