id: LUK.14.15
reference: Luke 14:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀκούσας δέ τις τῶν συνανακειμένων ταῦτα εἶπεν αὐτῷ· Μακάριος ⸀ὅστις φάγεται ⸀ἄρτον ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/015.yaml
  text: But one of those reclining at the table with him[a], when he heard these things, said to him[b], “Blessed is whoever will eat bread in the kingdom of God.”
translation:
  language: ja
  text: すると、食卓に着いていた人の一人がこれを聞いて、イエスに言った。「神の国でパンを食べる人は幸いです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「神の国でパンを食べる人は幸いです」。「パンを食べる」は、食事を共にすることを表す言い方でもあります。
    reason: cultural_note
lexical_decisions:
- source_word: Ἀκούσας
  choice: これを聞いて
  rationale: アオリスト分詞の時間的・付帯的関係を、自然な現代日本語で表した。ταῦτα は直前の発言内容を指すため「これ」とした。
- source_word: δέ
  choice: すると
  rationale: 直前の発言を受けた穏やかな場面展開を示す。日本語では逆接の「しかし」より、応答への移行を表す「すると」が自然である。
- source_word: τις τῶν συνανακειμένων
  choice: 同席していた人の一人
  rationale: 食卓を共にしていた無名の一人を指す。古代の姿勢まで本文で明示する「横になっていた」は日本語では誤解を招きやすいため、会食の意味を明確にした。
- source_word: εἶπεν αὐτῷ
  choice: イエスに言った
  rationale: 代名詞の指示対象を日本語で明瞭にするため、文脈上の「彼」を「イエス」とした。
- source_word: Μακάριος
  choice: 幸いです
  rationale: 単なる心理的な幸福ではなく、神の恵みにあずかる祝福された状態を表し、聖書的な重みを保ちながら現代日本語として自然である。
- source_word: ὅστις φάγεται ἄρτον
  choice: 食事をする人
  rationale: 直訳は「パンを食べる人」だが、「パンを食べる」はギリシア語で食事を共にすることを表し得る。日本語で同じ慣用的意味を自然に伝えるため「食事をする」とした。未来形の終末的指示は「神の国で」という文脈により保たれる。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 神の国で
  rationale: 前置詞句を簡潔かつ直接的に訳し、原文に明示されない「宴会」などは加えなかった。
theological_decisions:
- issue: 終末の食事に関する Μακάριος の祝福表現
  choice: 神の国で食事をする人は、幸いです
  alternative: 神の国でパンを食べる人は、幸いです
  rationale: 「幸い」は神の恵みにあずかる状態という神学的含意を保つ。「食事をする」は ἄρτον を含むギリシア語の食事表現を日本語として自然に伝えるが、具体的な宴会像や参加条件を本文に付加しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、会食の場にふさわしい簡潔で品位ある語調とした。「幸いです」によって祝福宣言の重みを保った。
