id: LUK.14.11
reference: Luke 14:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται καὶ ὁ ταπεινῶν ἑαυτὸν ὑψωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/011.yaml
  text: For everyone who exalts himself will be humbled[b][a], and the one who humbles himself will be exalted.
translation:
  language: ja
  text: 自分を高くする者は皆、低くされ、自分を低くする者は高くされるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前の教えの理由を示す接続語として、説明の働きを自然な現代日本語で保つ。
- source_word: πᾶς ὁ ὑψῶν ἑαυτὸν
  choice: 自分を高くする者は皆
  rationale: 現在分詞の一般的・普遍的な意味を「者は皆」で表し、自己を高めるという比喩も保つ。
- source_word: ταπεινωθήσεται
  choice: 低くされ
  rationale: 未来受動の形を保ち、誰がそうするかを明示せず、後半との対照を明確にする。
- source_word: καὶ
  choice: （読点による並列）
  rationale: 日本語では読点で二つの対照的な節を自然に結び、ギリシア語の並列関係を保てる。
- source_word: ὁ ταπεινῶν ἑαυτὸν
  choice: 自分を低くする者
  rationale: 自発的に自分を低くする意味を、前半と均衡する表現で示す。
- source_word: ὑψωθήσεται
  choice: 高くされる
  rationale: 未来受動を保ち、前半の「低くされる」と語彙的・修辞的な対照をなす。
theological_decisions:
- issue: 未来受動形の動作主
  choice: 「低くされる」「高くされる」と受動形のまま訳す
  alternative: 「神に低くされる」「神に高くされる」
  rationale: 文脈上は神の働きが含意され得るが、原文は動作主を明示していないため、訳文でも補わない。
- issue: 一般的な男性単数形
  choice: 性別を限定しない「者」で一般的意味を表す
  alternative: 「自分自身を高くする男」
  rationale: ギリシア語の男性単数形はここでは一般的用法であり、日本語の「者」は数や性を不必要に限定せず、その普遍的な意味を正確に伝える。
translation_notes:
  register: 簡潔で格言的な対句を保った。ὑψόω／ταπεινόωの反復と反転を「高くする／低くされる」「低くする／高くされる」で対応させ、明快で dignified な現代標準日本語とした。
