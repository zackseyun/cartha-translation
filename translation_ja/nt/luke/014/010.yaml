id: LUK.14.10
reference: Luke 14:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅταν κληθῇς πορευθεὶς ἀνάπεσε εἰς τὸν ἔσχατον τόπον, ἵνα ὅταν ἔλθῃ ὁ κεκληκώς σε ⸀ἐρεῖ σοι· Φίλε, προσανάβηθι ἀνώτερον· τότε ἔσται σοι δόξα ἐνώπιον ⸀πάντων τῶν συνανακειμένων σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/010.yaml
  text: But when you are invited[a], go and recline in the lowest place, so that when the one who invited you comes, he will say to you, ‘Friend[b], move up higher.’ Then there will be honor for you in the presence of all who are reclining with you.
translation:
  language: ja
  text: しかし、招かれたときは、行って末席に着きなさい。[a] そうすれば、あなたを招いた人が来て、「友よ、もっと上席へお移りください」[b]と言ってくれるだろう。そのとき、あなたは同席しているすべての人の前で誉れを受ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「最も低い場所で横になりなさい」。当時は食事の際、身を横たえて食卓に着いた。
    reason: 古代の食事姿勢と原語の具体的意味を示すため。
  - marker: b
    text: 直訳では「友よ、もっと上へ上がりなさい」。ここでは、より名誉ある席へ移ることを意味する。
    reason: 原文の上昇表現と宴席における社会的意味を示すため。
lexical_decisions:
- source_word: κληθῇς
  choice: 招かれたとき
  rationale: 宴席という文脈での καλέω は、単に「呼ぶ」ではなく「招待する」を意味するため。
- source_word: πορευθεὶς
  choice: 行って
  rationale: 主命令に伴う分詞を、日本語で自然な連続動作として表した。
- source_word: ἀνάπεσε
  choice: 席に着きなさい
  rationale: 原語は食事の席で横になることを指すが、現代日本語では「席に着く」が明瞭で自然。古代の食事姿勢は脚注で補った。
- source_word: ἔσχατον τόπον
  choice: 末席
  rationale: 宴席における最も低い位置、すなわち最も名誉の低い席を簡潔かつ自然に表す。
- source_word: ὁ κεκληκώς σε
  choice: あなたを招いた人
  rationale: 「主人」と意訳しすぎず、完了分詞の指示内容を明示した。
- source_word: Φίλε
  choice: 友よ
  rationale: 呼格による親しみと丁重さを保ち、原文にない所有表現は加えない。
- source_word: προσανάβηθι ἀνώτερον
  choice: もっと上席へお移りください
  rationale: より名誉ある位置へ移るという意味を宴席の文脈に即して明瞭に表した。発話として自然になるよう丁寧な依頼形を用いた。
- source_word: δόξα
  choice: 誉れ
  rationale: ここでは神的な「栄光」ではなく、人々の前で与えられる公の名誉を指す。
- source_word: ἐνώπιον πάντων τῶν συνανακειμένων σοι
  choice: 同席しているすべての人の前で
  rationale: 公然と誉れを受ける点と、食卓を共にする人々という意味を自然な日本語で保持した。
theological_decisions:
- issue: 教えの性質
  choice: 謙遜と名誉の逆転を示すたとえの中の実際的な勧めとして訳し、社会的意味と終末的含意のどちらにも限定しない。
  alternative: 単なる宴席作法として読む、または終末的報いだけを指すものとして読む。
  rationale: 本文は宴席の具体的な場面を用いる一方、その文脈では謙遜と高挙という広い主題を担う。翻訳自体でいずれか一方に意味を固定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「末席」「上席」「誉れ」により宴席での席次と公的名誉の対照を簡潔に示した。会話部分は現代の読者に自然な丁寧さを持たせつつ、「友よ」で原文の呼びかけを保持した。
