source:
  edition: SBLGNT
  text: ⸀καὶ πρὸς αὐτοὺς εἶπεν· Τίνος ὑμῶν υἱὸς ἢ βοῦς εἰς φρέαρ ⸀πεσεῖται, καὶ οὐκ εὐθέως ἀνασπάσει αὐτὸν ⸀ἐν ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/014/005.yaml
  text: And he said to them[a], “Which of you, if a son or an ox falls into a well, will not immediately pull him out on the Sabbath day?”
translation:
  language: ja
  text: そして彼らに言われた。[a]「あなたがたのうちのだれが、自分の息子か牛のどちらかが井戸に落ちたら、安息日にすぐに引き上げないでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「息子」の代わりに「ろば」とするものもある。
    reason: textual_variant
lexical_decisions:
- source_word: Τίνος ὑμῶν
  choice: あなたがたのうち……人がいるでしょうか
  rationale: 直訳的な「あなたがたのうち誰の」を避け、答えが否定となる修辞疑問の力を自然な現代日本語で表した。
- source_word: υἱὸς
  choice: 自分の息子
  rationale: 男性単数の「息子」を保ち、修辞疑問の所有関係が日本語で明瞭になるよう「自分の」を補った。
- source_word: βοῦς
  choice: 牛
  rationale: 牛科の家畜を指す語。日本語では「雄牛」より「牛」が自然で、性別を必要以上に限定しない。
- source_word: φρέαρ
  choice: 井戸
  rationale: この語の基本的な意味を採用し、並行箇所に合わせて「穴」とはしなかった。
- source_word: πεσεῖται
  choice: 落ちたなら
  rationale: 修辞的な仮定を自然な日本語の条件表現とした。
- source_word: εὐθέως
  choice: すぐに
  rationale: 救出を遅らせない時間的な切迫性を、平明で自然に表す。
- source_word: ἀνασπάσει
  choice: 引き上げない
  rationale: 井戸の中から上方へ引き出す動作を具体的に表す。否定修辞疑問に合わせて否定形とした。
- source_word: ἐν ἡμέρᾳ τοῦ σαββάτου
  choice: 安息日だからといって
  rationale: 単なる時点だけでなく、安息日であることが救出を妨げるかという文脈上の対比を自然に示す。
theological_decisions:
- issue: 例に挙げられる対象についての本文異読
  choice: 息子か牛
  alternative: ろばか牛
  rationale: 提示されたSBLGNTのυἱὸς（息子）に従い、異読は脚注に保存した。
- issue: 安息日の問いの修辞的性格
  choice: 安息日だからといって、すぐに引き上げない人がいるでしょうか
  alternative: 安息日にすぐ引き上げないだろうか
  rationale: 期待される答えが「そのような人はいない」であることを明瞭にしつつ、イエスの論証を説明文へ置き換えず疑問形のまま保った。
translation_notes:
  register: 平明で品位ある現代標準日本語。「彼ら」は直前の対話相手を受ける。引用部では修辞疑問を日本語らしく整えたが、「息子」「牛」「井戸」「すぐに」「安息日」という原文の具体的要素を保持した。
