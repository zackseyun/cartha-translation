  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: ja
  text: いと高き所では、神に栄光があるように。地の上では、み心にかなう人々に平和があるように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本には「地の上では平和が、人々には好意があるように」とある。
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: 栄光
  rationale: 神に帰される栄光を告げる賛美の表現。「誉れ」や「賛美」よりも、語の典礼的・神学的な重みを保つ。
- source_word: ἐν ὑψίστοις
  choice: いと高き所では
  rationale: 地上との空間的対照を保ちつつ、最高の天上領域を指す慣用句として、荘重で理解しやすい日本語にした。
- source_word: θεῷ
  choice: 神に
  rationale: 与格による帰属・献呈を自然な日本語で示す。
- source_word: ἐπὶ γῆς
  choice: 地の上では
  rationale: 「いと高き所」との対照を明示し、原文の空間表現を保つ。
- source_word: εἰρήνη
  choice: 平和
  rationale: 個人的な平安だけに狭めず、聖書的な広がりを持つ語として訳した。
- source_word: ἐν ἀνθρώποις
  choice: 人々の間に
  rationale: ἄνθρωποι はここで人間一般を指し、現代日本語では「人々」が自然で性別を不必要に限定しない。
- source_word: εὐδοκίας
  choice: み心にかなう
  rationale: 属格を、神の好意・喜びの対象である人々を修飾する表現として自然に訳した。神が暗黙の主体であることを示しつつ、特定の教理体系を持ち込まない。
theological_decisions:
- issue: 属格 εὐδοκίας が何を意味するか
  choice: 平和は「み心にかなう人々」の間にある、と訳す
  alternative: 「地には平和、人々には好意」と三項並列にする異読、または形式的に「好意の人々」とする
  rationale: SBLGNT 本文の属格 εὐδοκίας は ἀνθρώποις を限定し、人々が神の好意の対象であることを示すと解するのが自然である。日本語では「み心にかなう」がその関係を明瞭かつ簡潔に伝える。主格 εὐδοκία の異読は脚注に残した。
translation_notes:
  register: 天使の賛歌にふさわしい品位を保ちながら、現代の一般読者にも明瞭な文体とした。「み心」は荘重だが広く理解される表現。原文には明示的な動詞がないため、日本語では祝願・賛美として自然な「あるように」を補った。
