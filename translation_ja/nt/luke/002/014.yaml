  source_fidelity: 本文の基本的な対応は適切です。δόξα、θεῷ、ἐν ὑψίστοις、ἐπὶ γῆς、εἰρήνηはいずれもよく反映されています。ただし、ἐν ἀνθρώποις εὐδοκίαςは「好意／恵みを受ける人々に平和」という受益者・対象を示す句であり、「人々の間に平和」とすると、平和がその集団の内部に存在するという関係へ少しずれます。
  naturalness: 「み心にかなう人々の間に平和があるように」も理解可能ですが、「み心にかなう人々に平和があるように」の方が、現代標準語として簡潔で、ギリシャ語の構文にもより近くなります。全体の荘重で明瞭な調子は維持できます。
  terminology: 「栄光」「平和」「み心」は文脈と文体にふさわしい用語です。「み心にかなう」は、εὐδοκίαςが示す神の好意との関係を日本語で自然に表せています。ただし、人々の内的な相互関係ではなく、その人々に向けられる平和を表すため、助詞を改めます。異読の脚注も主格εὐδοκίαに基づく三項的な読みを適切に示しています。
  issues:
