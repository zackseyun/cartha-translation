  to: そして、両親はイエスを見ると驚いた。母はイエスに言った。「わが子よ、どうして私たちにこんなことをしたのですか。ご覧なさい。あなたのお父さんと私は、胸を痛めながらあなたを捜していたのですよ。」
  rationale: τέκνονを「わが子よ」と訳出し、母の情愛を伴う呼びかけを回復した。「あなたのお父さんと私は」としてὁ πατήρ σουの所有関係を明示した。それ以外は、原文の驚き、訴え、注意喚起、および苦悩のうちに続いた捜索を保つ既存の自然な表現を維持した。
