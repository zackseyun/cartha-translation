    rationale: 日本語では逐語的な呼びかけがやや文語的になり得るものの、原文には母親から子への明示的な呼びかけがある。これを完全に省くと、発話の情愛と直接性が弱まる。現代語として無理のない「わが子よ」を補うのが安全である。
  - severity: low
    issue: 「お父さんも私も」はσουの関係を暗黙化している。
    rationale: 会話としては理解できるが、「あなたのお父さんと私は」とすれば、原文の「あなたの父」を保ちつつ、日本語でも自然で明確になる。
