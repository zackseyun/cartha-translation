  source_fidelity: 主な意味内容はよく保たれており、「胸を痛めながらあなたを捜していた」はὀδυνώμενοιと未完了形ἐζητοῦμενの継続的で苦痛を伴う捜索を適切に表す。ただし、呼びかけのτέκνονがまったく訳出されておらず、母親の直接的で情愛を帯びた呼びかけが失われている。
  naturalness: 全体として明瞭な現代日本語である。「お父さんも私も」も会話として自然だが、「あなたのお父さんと私は」とするほうが、σου（あなたの）を明示し、指示関係がより明確になる。
  terminology: 「お父さん」は、マリアの発話におけるὁ πατήρ σουの自然な訳であり、「地上の」などの解釈的限定を加えない点は適切である。「胸を痛めながら」は神学的な含意を過剰に加えず、語の情緒的苦痛をよく反映する。
  issues:
