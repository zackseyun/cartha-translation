  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδόντες αὐτὸν ἐξεπλάγησαν, καὶ ⸂εἶπεν πρὸς αὐτὸν ἡ μήτηρ αὐτοῦ⸃· Τέκνον, τί ἐποίησας ἡμῖν οὕτως; ἰδοὺ ὁ πατήρ σου καὶ ἐγὼ ὀδυνώμενοι ⸀ἐζητοῦμέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: ja
  text: そして、両親はイエスを見ると驚いた。母はイエスに言った。「わが子よ、どうして私たちにこんなことをしたのですか。ご覧なさい。あなたのお父さんと私は、胸を痛めながらあなたを捜していたのですよ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες αὐτόν
  choice: 両親はイエスを見ると
  rationale: 分詞を自然な時間表現として訳した。主語は直前の文脈から両親とし、日本語で指示対象が明瞭になるよう「イエス」を補った。
- source_word: ἐξεπλάγησαν
  choice: 驚いた
  rationale: 強い驚きを表す語。現代日本語では簡潔な「驚いた」が自然であり、文脈上その強さも伝わる。
- source_word: Τέκνον
  choice: （独立した呼びかけとしては訳出せず）
  rationale: 母から子への呼びかけだが、日本語で「子よ」「わが子よ」とすると文語的または付加的になりやすい。直後の問いかけの丁寧な母語調によって親子関係を自然に表した。
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: どうして私たちにこんなことをしたのです
  rationale: τίを理由を問う「どうして」とし、ἡμῖνとοὕτωςの対人的な訴えを「私たちにこんなこと」として保持した。
- source_word: ἰδού
  choice: ご覧なさい
  rationale: 注意を促す間投詞の強調を、母の発話として自然で品位ある現代語にした。
- source_word: ὁ πατήρ σου
  choice: お父さん
  rationale: ギリシア語どおり父を指す語を無修飾で訳し、「地上の」などの解釈的限定を加えなかった。
- source_word: ὀδυνώμενοι
  choice: 胸を痛めながら
  rationale: 単なる心配よりも強い情緒的苦痛を表す分詞を、捜索中の継続的な苦悩として自然に表した。
- source_word: ἐζητοῦμέν σε
  choice: あなたを捜していた
  rationale: 未完了過去の継続的な捜索を「捜していた」で表した。「探す」より、見失った人を求める場面に適した表記とした。
theological_decisions:
- issue: イエスに対するヨセフの呼称
  choice: 「お父さん」を本文にそのまま残す
  alternative: 「地上のお父さん」
  rationale: 本文はマリアの言葉として単に「あなたの父」と述べる。限定語を加えず、処女懐胎および次節の神的子性との物語上の緊張を保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある口語体。マリアの発話は親しい母子関係を示しつつ、過度にくだけない「です・ます」調とした。本文に脚注は設けていない。
