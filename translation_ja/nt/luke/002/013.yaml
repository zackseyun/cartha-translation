id: LUK.2.13
reference: Luke 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξαίφνης ἐγένετο σὺν τῷ ἀγγέλῳ πλῆθος στρατιᾶς ⸀οὐρανίου αἰνούντων τὸν θεὸν καὶ λεγόντων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/013.yaml
  text: 'And suddenly there was with the angel a multitude of the heavenly host[a], praising God and saying:'
translation:
  language: ja
  text: すると突然、その御使いとともに、おびただしい数の天の軍勢[a]が現れ、神を賛美して言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天の軍隊」または「天軍」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαίφνης
  choice: 突然
  rationale: 出来事の唐突さと物語上の驚きを、明瞭で自然な現代日本語で表す。
- source_word: ἐγένετο
  choice: 現れ
  rationale: この存在提示の構文は、その場に大群が突如として存在するようになったことを示す。日本語では「現れ」が場面に即して自然だが、視覚的な出現だけに限定する意図はない。
- source_word: σὺν τῷ ἀγγέλῳ
  choice: その御使いとともに
  rationale: σύν＋与格の同伴の意味を保つ。「その」により直前の御使いを指すことを明確にする。
- source_word: πλῆθος
  choice: おびただしい数
  rationale: 非常に多い集団を意味する語を、現代の読者に分かりやすく、かつ格調を損なわない表現にした。
- source_word: στρατιᾶς οὐρανίου
  choice: 天の軍勢
  rationale: 天に属する秩序ある軍勢という軍事的比喩を保ち、「天使たち」と一般化しない。
- source_word: αἰνούντων
  choice: 賛美して
  rationale: 継続中の行為を表す現在分詞を、後続の発言へ自然につながる連用形で訳す。
- source_word: τὸν θεόν
  choice: 神を
  rationale: 賛美の直接目的語として標準的に訳す。
- source_word: λεγόντων
  choice: 言った
  rationale: 次節の賛美の言葉を導入する分詞を、日本語の文として自然な定動詞で表す。
theological_decisions:
- issue: στρατιᾶς οὐρανίου の訳し方
  choice: 天の軍勢
  alternative: 天の軍隊／天軍
  rationale: 原語が持つ軍勢のイメージを保ちながら、この場面での活動が戦闘ではなく神への賛美であることも損なわない。「天使の群れ」として軍事的含意を消すことは避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、降誕物語にふさわしい簡潔で荘重な調子を保った。「御使い」は文脈上の天的使者を指す慣用的な聖書語として採用し、全体は次節の直接話法へ自然につながる形にした。
