  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: ja
  text: 「主の律法に、『胎を開く男子はみな、主のための聖なる者と呼ばれる』と書かれているとおりである。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「胎を開く男子」とは、最初に生まれる男子、すなわち男の初子を指す。その者は主のものとして聖別された者とされる（出エジプト記13章2、12節参照）。
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: こう書かれているとおりである
  rationale: καθὼςの対応・根拠を示す働きと、γέγραπταιの完了受動が表す現に効力を持つ記述を、自然な聖書引用定型で示した。
- source_word: ἐν νόμῳ κυρίου
  choice: 主の律法に
  rationale: νόμοςをモーセ律法という特定の権威ある教えとして「律法」とし、κύριοςはギリシア語本文に即して「主」とした。
- source_word: ὅτι
  choice: こう…『…』
  rationale: 書かれている内容を導くὅτιを、日本語では引用を予告する「こう」とかぎ括弧によって自然に表した。
- source_word: Πᾶν ἄρσεν
  choice: 男子はみな
  rationale: 男性を明示するἄρσενと全称のπᾶνを簡潔に保持した。文脈上は男の初子を指すが、本文には「子」を補わなかった。
- source_word: διανοῖγον μήτραν
  choice: 胎を開く
  rationale: 律法引用に由来する慣用的な表現を保持し、第一に生まれる男子という含意は脚注で明らかにした。
- source_word: ἅγιον τῷ κυρίῳ
  choice: 主のために聖なる者
  rationale: ἅγιονの「聖なる」を保持し、与格が示す帰属・献納の関係を自然な日本語の「主のために」で表した。
- source_word: κληθήσεται
  choice: 呼ばれる
  rationale: 未来受動を引用文中の規定・宣言として日本語の現在形受動で自然に表した。「呼ばれる」という原語の語義を保持した。
theological_decisions:
- issue: イスラエルの律法からの引用におけるκύριος
  choice: 主
  alternative: 主〔ヤハウェ〕／主なる神
  rationale: 翻訳対象のギリシア語本文はκύριοςであるため「主」とし、背後のヘブライ語本文の神名を本文に直接持ち込まなかった。
- issue: ἅγιονの聖性と献納の関係
  choice: 主のために聖なる者
  alternative: 主にささげられた者／主のものとして聖別された者
  rationale: 本文では「聖なる」という語を保ち、初子が主に属するものとして取り分けられる意味は脚注で説明した。
- issue: 「胎を開く者」の指示対象
  choice: 直訳的表現を本文に保持
  alternative: 初めに生まれる男子／男の初子
  rationale: 原文の律法的な比喩表現を残しつつ、実質的に第一に生まれる男子を指すことを脚注で補った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、律法引用としての荘重さを保った。「胎を開く」は日常語ではないが、原文の表現と旧約引用とのつながりを保持するため本文に残し、脚注で説明した。
