base_translation:
  language: en
  yaml_path: translation/nt/luke/002/005.yaml
  text: to register with Mary[b][a], who was betrothed to him and was pregnant.
translation:
  language: ja
  text: 彼と婚約していて[a]、身ごもっていた[b]マリアとともに、登録するためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼のいいなずけであり」とも訳せる。ここでいう婚約は、現代の一般的な婚約よりも法的・社会的な拘束の強い正式な関係であった。
    reason: 語義上の別訳と歴史的背景
  - marker: b
    text: 別訳「妊娠していた」。
    reason: 語義上の別訳
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: 登録する
  rationale: 住民登録の文脈における行政上の意味を、現代日本語で簡潔かつ自然に表す。中動態を不自然な受け身にはしない。
- source_word: σὺν
  choice: とともに
  rationale: 同行・随伴を表す標準的な意味を、品位のある自然な日本語で示す。
- source_word: Μαριὰμ
  choice: マリア
  rationale: 日本語聖書で広く定着している人名表記を用いる。
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: 彼と婚約しており
  rationale: 完了受動分詞が示す、すでに成立して継続中の正式な婚姻約束を表す。「いいなずけ」より現代的で理解しやすい一方、古代の婚約が現代の一般的な婚約より強い法的・社会的拘束を持つことは注で補う。αὐτῷも「彼と」と明示する。
- source_word: οὔσῃ ἐγκύῳ
  choice: 身ごもっていた
  rationale: その時点でのマリアの状態を自然で品位ある日本語にする。「妊娠していた」も可能だが、「身ごもっていた」は物語文体になじむ。
theological_decisions:
- issue: ヨセフに対するマリアの婚姻上の身分
  choice: 彼と婚約しており
  alternative: 彼の妻であり／彼のいいなずけであり
  rationale: 原文は正式な婚約関係を表し、この節自体では婚姻の完了を「妻」として明言していない。「妻」は原文以上の身分を読み込みうるため避け、「婚約」を採用しつつ、古代の制度的な強さを注記する。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、物語文としての品位を保った。「身ごもっていた」は婉曲すぎず、一般読者にも理解しやすい表現である。原文が前節から続く目的句であることを踏まえ、文末を「登録するためであった」として日本語の節として整えた。
