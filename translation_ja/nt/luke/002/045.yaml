base_translation:
  language: en
  yaml_path: translation/nt/luke/002/045.yaml
  text: And when they did not find him[a], they returned to Jerusalem, searching for him.
translation:
  language: ja
  text: そして、イエスを見つけられなかったので、二人はイエスを捜しながらエルサレムへ引き返した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: しかし
  rationale: 直前の捜索にもかかわらず見つからなかったという展開を、現代日本語の物語として自然に接続する。単純な「そして」も可能だが、ここでは軽い逆接が文脈上明確である。
- source_word: μὴ εὑρόντες
  choice: 見つからなかったので
  rationale: 否定を伴うアオリスト分詞を、先行事情・理由の両面を含み得る自然な従属節として訳した。
- source_word: ὑπέστρεψαν
  choice: 二人は…引き返した
  rationale: ὑποστρέφωの「戻る、引き返す」を表す。「二人は」は両親を指す複数主語を日本語で明確にするための文脈的補足。
- source_word: εἰς Ἰερουσαλὴμ
  choice: エルサレムへ
  rationale: 都市を目的地とするεἰςを、自然な現代日本語の方向表現で訳した。
- source_word: ἀναζητοῦντες
  choice: 捜しながら
  rationale: 継続的で念入りな捜索を示す分詞を、主動詞と同時進行する動作として表した。「探す」より、人を見つけようとする意味に適した「捜す」を用いた。
- source_word: αὐτόν
  choice: イエスを
  rationale: 代名詞の指示対象を日本語で明確にし、目的語の重複や曖昧さを避けた。
