source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: ja
  text: そして、モーセの律法に従って、彼らの清め[a]の日数が満ちたとき、彼らはその子を主の御前にささげるため、エルサレムへ連れて上った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「彼女の清め」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: 満ちた
  rationale: 期間が定められた長さに達したことを表す受動形の慣用表現。「満ちた」は時間的な含みとやや格調ある語調を保つ。
- source_word: καθαρισμοῦ
  choice: 清め
  rationale: 出産後にモーセの律法が定める儀礼的な清めを指す。現代日本語の聖書文体として明瞭で、単なる衛生上の洗浄とは区別できる。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: SBLGNT本文の複数代名詞をそのまま反映し、レビ記の背景から単数に調整しない。指示対象を狭く確定しすぎず、原文の緊張を残す。
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: モーセの律法に従って
  rationale: 律法の規定への適合を自然な現代日本語で明確に示す。
- source_word: ἀνήγαγον
  choice: 連れて上った
  rationale: その子を伴って行ったことと、エルサレムへ上るという方向的ニュアンスの両方を保つ。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 日本語で定着している地名表記。
- source_word: παραστῆσαι
  choice: 御前にささげる
  rationale: この祭儀的・法的文脈では、単に立たせることではなく、神の前に差し出して献呈することを表す。「御前に」を補うことで日本語として意味を明確にする。
- source_word: κυρίῳ
  choice: 主
  rationale: 神を指すκύριοςの標準的で敬意ある訳語。与格の関係は「主の御前にささげる」で自然に表現した。
theological_decisions:
- issue: 「清め」に伴う代名詞の数
  choice: 本文で複数の「彼らの清め」を保持する
  alternative: 「彼女の清め」
  rationale: 提示されたSBLGNT本文は複数形αὐτῶνであるため、本文ではその形を反映する。レビ記の規定や異読に基づいて単数に解消せず、異読は脚注に示す。
- issue: παραστῆσαι τῷ κυρίῳの祭儀的意味
  choice: 「主の御前にささげる」
  alternative: 「主の前に立たせる」
  rationale: ここでは幼子を神に献呈する行為が意図されているため、「ささげる」が文脈上自然である。ただし所有権移転などの後代的な教義までは含意させない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、律法と礼拝に関わる場面にふさわしい品位を保った。「彼らの清め」は日本語としてやや異例でも、原文の複数形とそこにある解釈上の緊張を保持するため本文に残した。
