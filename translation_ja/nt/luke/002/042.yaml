base_translation:
  language: en
  yaml_path: translation/nt/luke/002/042.yaml
  text: And when he was twelve years old[a], as they were going up according to the custom of the feast[b],
translation:
  language: ja
  text: そして、イエスが十二歳になったとき、彼らが祭り[a]の慣習に従って上って行き、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 前の節にある「過越の祭り」を指す。
    reason: cross_reference
lexical_decisions:
- source_word: ἐγένετο ἐτῶν δώδεκα
  choice: 十二歳になった
  rationale: γίνομαιと年齢を表す属格による慣用表現で、十二歳に達したことを自然な日本語で表す。文脈上の主語であるイエスを明示した。
- source_word: ἀναβαινόντων
  choice: 上って行き
  rationale: エルサレムへの巡礼に用いられる「上る」という方向感を保ちつつ、分詞の継続性と次節への文のつながりを連用形で表した。原文にこの節では目的地が明記されていないため、「エルサレムへ」は補わなかった。
- source_word: αὐτῶν
  choice: 彼らが
  rationale: 直前の文脈に登場する家族、特に両親を指すが、原文の代名詞以上に限定しないため「彼ら」とした。属格絶対構文の動作主を日本語で明示した。
- source_word: κατὰ τὸ ἔθος
  choice: 慣習に従って
  rationale: 定まった慣行に沿って行動する意味を、明瞭で自然な現代日本語にした。
- source_word: τῆς ἑορτῆς
  choice: 祭り
  rationale: 宗教的な祝祭を指す語。前節で過越の祭りと特定されているため、本文では原文どおり一般名詞の「祭り」とした。
- source_word: καὶ ὅτε
  choice: そして、……とき
  rationale: καίの物語上の連続と、ὅτεの時間関係をともに保った。
