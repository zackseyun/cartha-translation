  source_fidelity: 「イエスが十二歳になったとき」は、ἐγένετο ἐτῶν δώδεκα の年齢表現を自然に再現している。「彼らが祭りの慣習に従って上って行き」は、属格絶対の同時的状況、ἀναβαίνω の「上る」、および目的地が当節で明示されない点を適切に保つ。文が次節に続くため、末尾を連用形にした処理も原文の構文に忠実である。
