  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: ja
  text: イエスの父と母は、イエスについて語られていることに驚いていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「彼の父」。ここでは、物語における日常的な家族・社会的、あるいは法的な意味でヨセフを指す。先に記されたイエスの処女懐胎との誤解を避けるため、「ヨセフと母」とする訳もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: その子の父
  rationale: ギリシア語本文の「彼の父」をそのまま訳した。日本語では指示対象を明確にするため「その子」とし、ヨセフへの言い換えによって本文の表現を調整することは避けた。
- source_word: μήτηρ
  choice: 母
  rationale: 標準的な訳語。前の「その子の」を父と母の双方に自然に係らせ、「その子の父と母」とした。
- source_word: θαυμάζοντες
  choice: 驚いていた
  rationale: ἦν と現在分詞による迂言的な未完了過去の継続的な様相を「〜ていた」で表した。θαυμάζω の驚嘆を、現代日本語として自然な「驚く」で訳した。
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: 語られていることに
  rationale: 受動分詞の意味を「語られている」で保ち、複数形の内容を日本語で自然な集合表現「こと」とした。ἐπί が示す驚きの対象は助詞「に」で表した。
- source_word: περὶ αὐτοῦ
  choice: その子について
  rationale: περί＋属格の標準的な意味を「〜について」とした。日本語で代名詞の指示が曖昧にならないよう「その子」と訳した。
theological_decisions:
- issue: 処女懐胎を述べる文脈でヨセフを「その子の父」と呼ぶこと
  choice: 本文どおり「その子の父」と訳し、物語上の日常的・家族的または法的な呼称であることを脚注で説明する。
  alternative: 「ヨセフと母」と訳す。
  rationale: 原文は明確に「彼の父」と述べており、ルカが先に記した処女懐胎との緊張を翻訳者が本文内で解消すべきではない。ヨセフを家族的・社会的な意味で父と呼ぶことは、その先行記事を否定するものではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「驚いていた」により過去における継続的な反応を自然に示した。「その子」を反復して、指示対象を明確にした。
