reference: Luke 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: ja
  text: そして彼女は、最初に生まれた息子を産み、布でくるんで[a]、飼い葉桶[b]に寝かせた。客間[c]には彼らのための場所がなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「産着のような布で包んで」とも訳せる。この語は、乳児を細長い布などで包むことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「まぐさ桶」とも訳せる。ギリシア語は、動物の餌を置く場所や餌を入れる桶を指す。
    reason: lexical_alternative
  - marker: c
    text: 伝統的には「宿屋」。ギリシア語κατάλυμαは客間または宿泊場所を意味し得る。ルカは商業的な宿屋について、10章34節で別の語を用いている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: 産み
  rationale: 出産を表すτίκτωの具体的な意味を、現代日本語で自然かつ簡潔に伝える。
- source_word: τὸν υἱὸν αὐτῆς τὸν πρωτότοκον
  choice: 初めての子である男の子
  rationale: υἱόςの男性性とπρωτότοκοςの出生順位をともに明示する。「長男」は家族内の身分や後続の子どもの存在を必要以上に連想させ得るため避けた。
- source_word: ἐσπαργάνωσεν
  choice: 布でくるんで
  rationale: 乳児を布で包む行為を指す。専門的・古風な表現にせず、現代の一般読者に分かる言い方とした。
- source_word: ἀνέκλινεν
  choice: 寝かせた
  rationale: この文脈では乳児を横たえることを表すため、「置いた」より具体的で自然な訳とした。
- source_word: φάτνῃ
  choice: 飼い葉桶
  rationale: 動物の餌を入れる場所または容器を指す語の具体的な意味を伝える、日本語聖書でも理解しやすい表現。
- source_word: τόπος
  choice: 場所
  rationale: τόποςの広い意味を保ち、客間の中に彼らを受け入れる余地がなかったことを自然に表す。
- source_word: καταλύματι
  choice: 客間
  rationale: κατάλυμαは宿泊場所または客間を意味し得る。ルカ22:11で客間を指し、ルカ10:34では商業的な宿屋に別語πανδοχεῖονが用いられるため、ここでは「客間」を本文に採用した。
theological_decisions:
- issue: κατάλυμαを伝統的な「宿屋」とするか、家の客用空間を表す「客間」とするか
  choice: 客間
  alternative: 宿屋／宿泊所
  rationale: 原語は商業的な宿屋に限定されず、ルカ自身の語法も「客間」を支持する。ただし「宿泊所」という一般的な意味の可能性を完全には排除せず、伝統的理解を脚注に示した。
- issue: πρωτότοκοςが後にほかの子どもが生まれたことを含意するか
  choice: 出生順位のみを表す「初めての子」
  alternative: 長男
  rationale: この語は当該の子が最初に生まれたことを示すが、この節だけで後続の子どもの有無を確定しない。「長男」が生み得る余分な含意を避けた。
translation_notes:
  register: 明瞭な現代標準語を用い、簡潔で品位ある叙述調とした。「彼女」は直前の文脈を受ける原文の代名詞を保持する。読点により「初めての子である男の子」と、その後の一連の動作を読み取りやすくした。
