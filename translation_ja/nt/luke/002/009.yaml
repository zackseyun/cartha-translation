id: LUK.2.9
reference: Luke 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: ja
  text: すると、主の天使が羊飼いたちのそばに立ち[a]、主の栄光が彼らの周りを照らした。彼らは非常に恐れた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らのところに突然現れた」または「彼らの前に立った」とも訳せる。ギリシア語の動詞は、そばに立つことと突然姿を現すことの両方を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「大きな恐れを恐れた」。非常に激しく恐れたことを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: 主の使い
  rationale: ἄγγελοςはこの天上の出現という文脈では「使者」一般より「（天）使」を指す。「主の使い」は日本語聖書として自然で、冠詞のない構文に「その」を加えない。
- source_word: ἐπέστη αὐτοῖς
  choice: 羊飼いたちのそばに立ち
  rationale: ἐφίστημιには「そばに立つ」「近づく」「突然現れる」の幅がある。与格代名詞の指示対象を明示しつつ、具体的な「立つ」を保ち、突然の出現という含みは脚注に示す。
- source_word: δόξα κυρίου
  choice: 主の栄光
  rationale: δόξαの神的な輝きと威光の双方を保つ、簡潔で定着した訳語。
- source_word: περιέλαμψεν αὐτούς
  choice: 彼らの周りを照らした
  rationale: περιλάμπωの、周囲を光で照らす意味を自然な現代日本語で表す。
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: 彼らは非常に恐れた
  rationale: 同根の動詞と目的語による強意表現を、意味を弱めず自然な日本語にする。直訳調の反復は脚注で示す。
theological_decisions:
- issue: 二つの属格句におけるκύριοςの訳
  choice: 主
  alternative: 主人
  rationale: ここでは神を指すため、「主」が神学的重みと新約文書での用法を適切に保つ。
- issue: ἄγγελος κυρίουの限定性
  choice: 主の使い
  alternative: その主の使い
  rationale: ἄγγελοςに冠詞がなく、特定の唯一的存在であると訳文上断定しない。日本語では「主の使い」だけで不定性を自然に保てる。
translation_notes:
  register: 明快な現代標準語を用いながら、神的出現にふさわしい簡潔で荘重な調子を保った。「すると」で場面の急展開を示し、原文の反復するκαίは日本語として自然な文の連なりに整えた。
