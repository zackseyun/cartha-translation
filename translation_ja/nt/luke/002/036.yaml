  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἦν Ἅννα προφῆτις, θυγάτηρ Φανουήλ, ἐκ φυλῆς Ἀσήρ (αὕτη προβεβηκυῖα ἐν ἡμέραις πολλαῖς, ζήσασα ⸂μετὰ ἀνδρὸς ἔτη⸃ ἑπτὰ ἀπὸ τῆς παρθενίας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/036.yaml
  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: ja
  text: また、アシェル族の者で、ファヌエルの娘である女預言者アンナがいた。彼女は非常に年を取っており、結婚してから七年間、夫と暮らしたが、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προφῆτις
  choice: 女預言者
  rationale: 女性形の名詞であることと、神からのことばを語る預言者としての役割を、自然で明確な現代日本語で示す。
- source_word: θυγάτηρ Φανουήλ
  choice: ファヌエルの娘
  rationale: 父娘関係を示す単純な系譜表現として、そのまま自然に訳した。
- source_word: ἐκ φυλῆς Ἀσήρ
  choice: アシェル族の出身
  rationale: ἐκ が示す出自・所属を明確にし、日本語として自然に表した。
- source_word: προβεβηκυῖα ἐν ἡμέραις πολλαῖς
  choice: 非常に年を取っており
  rationale: 直訳的には「多くの日々を重ねていた」だが、老齢を示すギリシア語の慣用表現として、意味が明瞭な現代日本語にした。
- source_word: ζήσασα μετὰ ἀνδρὸς ἔτη ἑπτὰ
  choice: 七年間、夫と暮らした
  rationale: ここでの ἀνήρ は婚姻関係にある夫を指すため、「夫」とした。分詞の時間的関係を保ちながら自然に訳した。
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: 処女の時を終えてから
  rationale: 直訳の「彼女の処女性から」では日本語として不自然なため、結婚によって未婚の処女である時期を終えた時点から七年を数える表現として訳した。ただし語句の含意は脚注で示した。
theological_decisions:
- issue: アンナの προφῆτις としての身分
  choice: 「女預言者」と明示する
  alternative: 単に「預言者」とする、または宗教的な敬虔さだけを表す語に弱める
  rationale: 原文は女性形の標準的な「預言者」という名詞を用いているため、その性別と役割をともに保持した。
- issue: 年齢表現の解釈
  choice: 「非常に年を取っており」と慣用的に訳す
  alternative: 「多くの日々を重ねており」と逐語的に訳す
  rationale: これは老齢を表す慣用句であり、次節の年齢に関する文を先取りせず、この節の範囲で自然かつ明確に意味を伝える。
- issue: ἀπὸ τῆς παρθενίας αὐτῆς の時間的意味
  choice: 結婚により処女である時期を終えてから七年間、夫と暮らしたと表す
  alternative: 「処女の時から七年間」と形式的に訳し、起点の意味を未解決のまま残す
  rationale: 文脈上は結婚生活の長さを、未婚の処女であった時期の終了から数えている。ただし原文特有の表現を過度に説明しないよう、補足は脚注に置いた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「女預言者」は原文の女性形を保持し、「非常に年を取って」はギリシア語の年齢慣用句を自然に表す。節末は次節へ文が続くため、「が、」で接続した。
