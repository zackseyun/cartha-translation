id: LUK.2.35
reference: Luke 2:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: ja
  text: そして、あなた自身の魂をも、剣が貫くでしょう[a][b]。それは、多くの人の心の内にある思いが明らかにされるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「剣があなた自身の魂をも通り抜けます」。剣の比喩に即して、本文では「貫くでしょう」とした。
    reason: lexical_alternative
  - marker: b
    text: 「剣」は、一般にマリアが経験する深い苦しみを表す比喩と理解される。その具体的な成就の仕方は本文には明記されていない。
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: あなた自身の
  rationale: 属格代名詞に強意の αὐτῆς が添えられているため、マリアへの個人的な強調を自然な日本語で表した。
- source_word: ψυχή
  choice: 魂
  rationale: ここでは単なる肉体的生命ではなく、深い苦悩を受ける内なる人を指す。「魂」は比喩の重みを保つ。
- source_word: διελεύσεται
  choice: 貫きます
  rationale: 動詞自体は字義的には「通り抜ける」だが、主語が剣である日本語では「剣が魂を通り抜ける」より「貫く」が自然で、同じ像を明瞭に伝える。字義的な形は脚注に残した。
- source_word: ῥομφαία
  choice: 剣
  rationale: 大型の剣を指し得るが、この比喩では一般的で格調ある「剣」が過剰な限定を避ける。
- source_word: ὅπως ἂν
  choice: こうして…のです
  rationale: 目的または結果を導く表現。前文とのつながりを保ちつつ、日本語として不自然な目的限定を避け、原文の幅を残した。
- source_word: ἀποκαλυφθῶσιν
  choice: 明らかにされる
  rationale: 受動態と、隠れていたものが開示される意味を保持した。
- source_word: ἐκ πολλῶν καρδιῶν
  choice: 多くの人の心から出る
  rationale: ἐκ の起点・源の意味を明示し、思いが心の内から現れるという関係を自然な日本語で示した。
- source_word: διαλογισμοί
  choice: 思い
  rationale: 内的な思考、推論、企てを含み得る広い語であり、文脈上の評価を訳文で限定しない。
theological_decisions:
- issue: マリアへの呼びかけと剣の比喩が指す苦しみ
  choice: マリア自身が深い苦しみを経験するとの預言として訳し、その具体的な成就の仕方は本文で限定しない。
  alternative: 剣をイエスの十字架刑に際するマリアの悲嘆、またはイエスの働きが生む分裂による痛みと明示する。
  rationale: 原文はマリアを直接指すが、苦しみの具体的な歴史的契機までは述べていないため、その緊張を保った。
- issue: ὅπως ἂν の目的・結果の含み
  choice: 「こうして」により、目的と結果の双方に開かれたつながりを保つ。
  alternative: 「それは…ためです」として明確な目的に限定する。
  rationale: 接続表現は目的を示し得る一方、文脈では結果的な展開としても理解できるため、日本語で一方に狭めなかった。
translation_notes:
  register: 明瞭で現代的ながら、預言の厳粛さを保つ文体とした。「あなた自身」「魂」「剣」により原文の強調と比喩を保持し、結びは説明的になりすぎない自然な敬体に整えた。
