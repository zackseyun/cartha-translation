id: LUK.2.25
reference: Luke 2:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: ja
  text: すると、エルサレムにシメオンという人がいた。この人は正しい人で、敬虔であり、イスラエルの慰め[a]を待ち望んでいた。聖霊が彼の上に臨んでいた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルに与えられる慰め」とも訳せる。神がイスラエルを慰め、回復してくださるという待望を指す。
    reason: lexical_alternative
  - marker: b
    text: 原文は形式上、「聖なる霊が彼の上に臨んでいた」とも理解し得るが、ルカの文脈では聖霊を指すのが最も自然である。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面に注意を向け、新たな人物を印象的に登場させるルカの談話標識を残した。「さて」を添えて、現代日本語の物語としてのつながりも整えた。
- source_word: ἄνθρωπος
  choice: 人
  rationale: シメオンという男性個人を指すが、日本語では「人」が自然であり、性別は固有名と文脈から明らかである。
- source_word: ᾧ ὄνομα Συμεών
  choice: シメオンという人
  rationale: ギリシア語の「その名はシメオン」という同定表現を、簡潔で自然な現代日本語にした。
- source_word: δίκαιος
  choice: 正しく
  rationale: 神と人との前で正しいという道徳的・契約的含意を保ちつつ、人物描写として自然にした。
- source_word: εὐλαβής
  choice: 敬虔で
  rationale: 神を畏れ敬い、信仰に慎み深い人物であることを簡潔に表す。
- source_word: προσδεχόμενος
  choice: 待ち望んでいた
  rationale: 単なる待機ではなく、期待をもって継続的に待つ姿勢を表した。
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: イスラエルの慰め
  rationale: 「慰め」と「回復」を含む預言的希望の響きを保ち、属格の簡潔さと余韻を維持した。
- source_word: πνεῦμα ἅγιον
  choice: 聖霊
  rationale: 無冠詞ではあるが、直後の2章26–27節を含むルカの文脈では神の聖霊を指すのが最も自然である。日本語では定冠詞の有無を直接表さないため、通例どおり「聖霊」とした。
- source_word: ἐπ’ αὐτόν
  choice: 彼の上に臨んでいた
  rationale: 聖霊の現存・働きがその人の上にあるという聖書的表現を、自然な日本語で示した。未完了過去の継続的な状態も「ていた」で表した。
theological_decisions:
- issue: πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν の指示対象
  choice: 聖霊が彼の上に臨んでいた
  alternative: 聖なる霊が彼の上に臨んでいた
  rationale: 原文の語順と無冠詞性だけなら一般的な「聖なる霊」という形式的可能性は残る。しかし、ルカ文書の用法と直近の26–27節では神の聖霊を指すのが最も自然である。本文ではその読みを採り、原文上の形式的可能性は脚注に残した。
- issue: παράκλησις τοῦ Ἰσραήλ の意味範囲
  choice: イスラエルの慰め
  alternative: イスラエルの回復／イスラエルに与えられる慰め
  rationale: イスラエルが神から受ける慰めと回復への希望を指すが、本文では「回復」だけに限定せず、原文の比喩と預言的響きを保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「見よ」は日常会話より高い文体だが、ἰδοὺの注意喚起と物語上の強調を保つため採用した。文を適度に分け、一般読者にも追いやすくした。
