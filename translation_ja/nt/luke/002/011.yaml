id: LUK.2.11
reference: Luke 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐτέχθη ὑμῖν σήμερον σωτὴρ ὅς ἐστιν χριστὸς κύριος ἐν πόλει Δαυίδ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: ja
  text: なぜなら、今日、あなたがたのために、ダビデの町で救い主がお生まれになったからです。その方は、メシアであり、主である方です[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は字義的には「メシア、主」。伝統的には「主キリスト」とも訳される。また、「主のメシア」と理解する可能性もある。
    reason: χριστὸς κύριοςという二つの称号の関係と、伝統的な訳し方を示すため。
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 前節の天使の告知を受け、その理由・内容を示す接続語。日本語では文末の「からです」によって説明の働きを自然に表した。
- source_word: ἐτέχθη
  choice: 生まれた
  rationale: τίκτωのアオリスト受動形。誕生の出来事を簡潔に述べる日本語として「生まれた」が自然であり、不必要な敬語表現は加えない。
- source_word: ὑμῖν
  choice: あなたがたのために
  rationale: 受益の与格を明示し、この誕生が羊飼いたちにとっての良い知らせであることを伝える。
- source_word: σήμερον
  choice: 今日
  rationale: 時間を示す基本的な副詞を、明瞭な現代日本語で訳した。
- source_word: σωτὴρ
  choice: 救い主
  rationale: 救出する者という意味と、この文脈における称号としての重みをともに保つ定着した訳語。
- source_word: ὅς ἐστιν
  choice: その方は……です
  rationale: 先行する「救い主」を受ける関係節を、自然な日本語になるよう独立した文で表した。指示語「その方」によって同一人物であることを明確にする。
- source_word: χριστὸς
  choice: メシア
  rationale: ここでは固有名ではなく、ダビデに結びつく油注がれた者の称号として用いられているため、「キリスト」ではなく意味の分かる称号「メシア」とした。
- source_word: κύριος
  choice: 主
  rationale: 権威と強い神学的含意を保つ定着した訳語。「主人」ではこの箇所の称号として弱すぎる。
- source_word: ἐν πόλει Δαυίδ
  choice: ダビデの町で
  rationale: 場所を表すἐνを自然な助詞「で」で訳し、ダビデ王家との関連を保った。文脈上ベツレヘムを指すが、本文には地名を補わない。
theological_decisions:
- issue: χριστὸς κύριος の関係
  choice: 主であるメシア
  alternative: 主のメシア／主キリスト
  rationale: ギリシア語ではχριστόςとκύριοςがともに主格で並び、救い主を二つの称号で特定していると読むのが最も直接的である。ただし冠詞のない簡潔な表現には統語上の緊張があるため、「主のメシア」という別解と伝統的な「主キリスト」を脚注に示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。前節との接続を保つため「からです」を用い、長く不自然な一文を避けて二文に分けた。称号には敬意を保ちつつ、原文にない尊敬語は加えていない。
