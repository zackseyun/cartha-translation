source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: ja
  text: そのころ、皇帝アウグストゥスから、全世界の住民を登録せよとの勅令が出た[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ローマ世界全体」または「帝国全土」とも訳せる。このギリシア語は、ローマ帝国という文脈で考えられた、人の住む世界を指すことが多い。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: そのころ
  rationale: 物語を次の出来事へ進める導入表現。直訳的な「起こった」よりも、後続の時句と合わせて自然な現代日本語の場面転換とした。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: そのころ
  rationale: 直訳は「その日々に」。日本語では「そのころ」が簡潔で自然であり、当時という時間的背景を示す。
- source_word: ἐξῆλθεν δόγμα
  choice: 勅令が出た
  rationale: 皇帝に由来する公的命令であることを、自然で格調ある日本語で表す。
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: 皇帝アウグストゥスから
  rationale: παρά＋属格の起点・発信源を「から」で保ち、Καῖσαρが皇帝の称号であることを明確にした。
- source_word: ἀπογράφεσθαι
  choice: 住民を登録せよ
  rationale: 公的な登録を表す中動態不定詞。人口調査や課税まで本文以上に限定せず、命令内容として自然に表現した。
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: 全世界の住民
  rationale: οἰκουμένηの「人の住む世界」という意味を、日本語として自然に表した。文脈上のローマ世界という範囲は脚注に残した。
theological_decisions:
- issue: οἰκουμένηの範囲
  choice: 全世界の住民
  alternative: ローマ世界全体／帝国全土
  rationale: 語の表面的な広がりを本文に保ちつつ、ローマ帝国の文脈で限定的に用いられ得ることを脚注で示し、歴史的範囲を断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として自然でありながら、皇帝の公的命令にふさわしい格調を保った。「勅令」「登録」は一般読者にも理解できる範囲の行政語である。
