id: LUK.2.50
reference: Luke 2:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ οὐ συνῆκαν τὸ ῥῆμα ὃ ἐλάλησεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/050.yaml
  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: ja
  text: そして両親は、イエスが自分たちに語ったことば[a]を理解できなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「発言」「事柄」。
    reason: ῥῆμαは「ことば」のほか、「発言」や「事柄」を意味しうる。ここではイエスが直前に語った内容を指す。
lexical_decisions:
- source_word: καὶ
  choice: しかし
  rationale: 直訳的には「そして」だが、直前のイエスの発言と両親の無理解との対照を、文脈に即して自然な現代日本語で示す。ギリシア語の接続詞が文脈上持ちうる弱い逆接的機能を表している。
- source_word: αὐτοὶ
  choice: 両親は
  rationale: 文脈上、指示対象はイエスの両親である。日本語では代名詞「彼ら」よりも指示対象を明示したほうが自然で分かりやすい。
- source_word: οὐ συνῆκαν
  choice: 理解できなかった
  rationale: συνίημι の基本義である「理解する」を明確に表す。部分的理解や拒絶という意味を加えない。
- source_word: τὸ ῥῆμα
  choice: ことば
  rationale: ῥῆμα は「ことば」「発言」「事柄」を意味しうる。ここでは直前にイエスが語った内容を指すため、「ことば」が自然であり、原語の語義の幅も比較的よく保つ。
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: イエスが自分たちに語った
  rationale: 関係節を名詞の前に置く自然な日本語とした。主語は文脈からイエスと明示し、αὐτοῖς は両親を基準とする「自分たちに」で表した。アオリストは通常の過去として訳す。
theological_decisions:
- issue: イエスの両親の反応の描写
  choice: 両親がイエスのことばを理解できなかったと、そのまま述べる。
  alternative: 「十分には理解できなかった」または「受け入れなかった」
  rationale: 原文は理解の欠如を述べており、程度を限定したり、拒絶へ意味を変えたりしていない。イエスの身分と使命をめぐる物語上の緊張を説明によって解消しない。
translation_notes:
  register: 明快で現代的かつ品位ある叙述。主語を「両親」と明示して指示関係を分かりやすくし、神学的説明は加えず原文の緊張を保った。
