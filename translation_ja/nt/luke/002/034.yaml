id: LUK.2.34
reference: Luke 2:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: ja
  text: シメオンは彼らを祝福し、彼の母マリアに言った。「見なさい。この子は、イスラエルの多くの人の倒れと立ち上がりのために、また反対されるしるしとなるために定められています。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「反対される」は、「異議を唱えられる」または「拒まれる」とも訳せる。
    reason: ἀντιλεγόμενονには、言葉による反論から敵対的な拒絶まで意味の幅があるため。
lexical_decisions:
- source_word: εὐλόγησεν
  choice: 祝福し
  rationale: 基本的な意味をそのまま保ち、現代日本語の聖書文体として自然にした。
- source_word: Ἰδοὺ
  choice: 見なさい
  rationale: 注意を促す語の力を、古風すぎない明瞭な命令表現で伝えた。
- source_word: οὗτος
  choice: この子
  rationale: 文脈上は幼子イエスを指すため、日本語で自然かつ明確にした。
- source_word: κεῖται εἰς
  choice: …ために定められ
  rationale: 直訳的な「置かれている」より、ここでの任命・定めの含意を自然に表した。ただし行為者は補わなかった。
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: 倒れさせ、また立ち上がらせる
  rationale: 対照性を保持しつつ、抽象名詞を日本語で理解しやすい動詞表現にした。ἀνάστασιςが復活を含意し得る余地も「立ち上がる」に残した。
- source_word: σημεῖον ἀντιλεγόμενον
  choice: 反対を受けるしるし
  rationale: 分詞の継続的・受動的な意味を自然に表し、単なる議論ではなく敵対的反対も含み得る表現にした。
theological_decisions:
- issue: 「倒れ」と「立ち上がり」の対象関係
  choice: 同じ「イスラエルの多くの人」に両方が関わり得る形を保った
  alternative: ある人々は倒れ、別の人々は立ち上がる、と明示する
  rationale: ギリシア語は二群を明示せず、同一人物の転倒と回復という読みも、異なる人々の没落と高揚という読みも排除しないため。
- issue: κεῖταιの背後の行為者
  choice: 「定められ」としつつ、神を明示しない
  alternative: 「神によって定められ」
  rationale: 神的受動の可能性は高いが、原文に行為者の明示がないため補わなかった。
- issue: ἀνάστασιςの意味範囲
  choice: 「立ち上がらせる」
  alternative: 「復活させる」または「再起させる」
  rationale: 身体的復活、回復、立ち上がりのいずれかに限定せず、原語の幅と神学的緊張を保つため。
translation_notes:
  register: 明瞭で現代的だが、預言的発言にふさわしい品位を保った。「幼子の母マリア」として指示関係を自然にし、「この子」で文脈上の対象を明確にした。
