  to: シメオンは彼らを祝福し、彼の母マリアに言った。「見なさい。この子は、イスラエルの多くの人の倒れと立ち上がりのために、また反対されるしるしとなるために定められています。[a]」
  rationale: 原文の名詞句「倒れと立ち上がり」を保持し、誰が倒れ、誰が立ち上がるか、またその両者が同一か別々かという原文の開かれた含意を保った。「定められている」を両方のεἰς句に自然に係らせ、反対されるしるしという受動的表現も維持した。
