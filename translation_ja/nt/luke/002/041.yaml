  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: ja
  text: さて、イエスの両親は毎年、過越の祭りのためにエルサレムへ行っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: 行っていた
  rationale: 未完了過去形が表す過去の習慣的・反復的な行動を、「毎年」と組み合わせて自然に示す。
- source_word: οἱ γονεῖς αὐτοῦ
  choice: イエスの両親
  rationale: γoνεῖςの通常の意味をそのまま「両親」とし、文脈上の指示対象を明確にするためαὐτοῦを「イエスの」と表した。
- source_word: κατ’ ἔτος
  choice: 毎年
  rationale: κατά＋対格の反復・分配的な意味を、現代日本語で簡潔かつ自然に表す。
- source_word: Ἰερουσαλήμ
  choice: エルサレム
  rationale: 日本語聖書で広く定着している地名表記を用いる。
- source_word: τῇ ἑορτῇ
  choice: 祭りのために
  rationale: 移動を表す動詞との関係から、祭りが旅の機会・目的であることを自然な日本語で示す。
- source_word: τοῦ πάσχα
  choice: 過越の
  rationale: ユダヤ教の特定の祭りを指す定着した日本語表現「過越の祭り」を用いる。
theological_decisions:
- issue: イエスの家族への言及
  choice: イエスの両親
  alternative: イエスの父と母
  rationale: 原文のγονεῖςは通常「両親」を意味する。この語をそのまま訳し、ルカが別の箇所で語る処女懐胎との関係を訳文で説明したり解消したりしない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「さて」で新しい場面への移行を示し、「行っていた」によって毎年の習慣を表した。祭礼名は定着した「過越の祭り」とした。
