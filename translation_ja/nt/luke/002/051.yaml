id: LUK.2.51
reference: Luke 2:51
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: ja
  text: イエスは両親と一緒に下ってナザレへ行き、二人に従っていた。[a] 母は、これらのことをすべて心に留めていた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二人に服従していた」とも訳せる。ギリシア語の表現は、従順な状態や行動が続いていたことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「これらの言葉をすべて」とも訳せる。ギリシア語の「レーマタ」は、語られた言葉や発言、またそれらが指す事柄を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη μετ’ αὐτῶν
  choice: 両親と一緒に下って
  rationale: エルサレムからナザレへの地理的な下降を「下って」で保ち、μετ’ αὐτῶνの同行を自然な日本語で表した。文脈上の指示対象を明確にするため「彼ら」ではなく「両親」とした。
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: ナザレへ行き
  rationale: ἔρχομαιは視点により「来る／行く」の両方になり得る。この叙述では現代日本語として自然な「行き」を選び、「帰り」の意味は原文に明示されないため加えなかった。
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: 二人に従っていた
  rationale: 迂言的未完了形が示す継続的な服従・従順を「従っていた」で表した。「服従していた」よりも親子関係に即した自然な表現でありながら、原文の意味を弱めない。
- source_word: διετήρει
  choice: 心に留めていた
  rationale: διατηρέωの、失わず保ち続ける意味を、ἐν τῇ καρδίᾳ αὐτῆςと一体化した自然な日本語で表した。「大切にしていた」のような感情的含意は加えない。
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: これらのことをすべて
  rationale: ῥήματαは「言葉／語られたこと」から「出来事・事柄」まで指し得る。この文脈では日本語として自然な「こと」を本文に置き、「言葉」の可能性は脚注に残した。
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: 心に
  rationale: 内面的な記憶と思索を示す聖書的な心の表現を簡潔に保持した。
theological_decisions:
- issue: 地上の両親に対するイエスの関係
  choice: 二人に従っていた
  alternative: 二人に服従していた／二人に従う者であった
  rationale: 原文が述べる継続的な従順をそのまま示し、キリスト論上の説明を本文に持ち込まず、緊張を解消しない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、簡潔で品位ある叙述とした。「両親」「二人」により日本語での指示対象を明確にしつつ、原文以上の教理的説明は加えていない。脚注記号は対応する表現の直後に置いた。
