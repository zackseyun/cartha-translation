  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: ja
  text: これが、あなたがたへのしるしです。あなたがたは、布にくるまれ、飼い葉おけ[a]に横たわっている赤ん坊を見つけます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「家畜の餌箱」。
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: しるし
  rationale: 羊飼いたちがその子を見分けるための目印・徴を指す。奇跡的な証拠と限定せず、原文の含みを保つ。
- source_word: εὑρήσετε
  choice: あなたがたは見つけます
  rationale: εὑρίσκωの未来直説法二人称複数を、予告として明確かつ自然に表した。
- source_word: βρέφος
  choice: 赤ん坊
  rationale: ごく幼い子を指す語であり、現代の一般読者に自然で明瞭な表現を選んだ。
- source_word: ἐσπαργανωμένον
  choice: 布にくるまれて
  rationale: 幼児を布で包む具体的な状態を表す。特殊な育児用語に限定せず、動作を分かりやすく伝える。
- source_word: κείμενον
  choice: 寝かされている
  rationale: 赤ん坊が横たわっている状態を日本語として自然に表す。文脈上、誰が寝かせたかは明示しない。
- source_word: φάτνῃ
  choice: 飼い葉おけ
  rationale: 家畜の餌を入れる設備を指す語として定着し、降誕物語の文脈でも理解しやすい。
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: これは、あなたがたのためのしるしです
  rationale: 動詞が省略されたギリシア語の句を、日本語で自然な判断文として補った。直後の内容を識別のしるしとして導入する。
theological_decisions:
- issue: 羊飼いたちに与えられた「しるし」の性質
  choice: その子を見分けるための具体的なしるしとして訳す
  alternative: 神による超自然的な証明という意味を訳文で明示する
  rationale: 本文は、布にくるまれて飼い葉おけにいる赤ん坊を見つけることに焦点を置く。「しるし」とだけ訳し、神学的な広がりを排除せず、同時に奇跡的証明とも断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、語りの簡潔さと品位を保った。「飼い葉おけ」は慣用的な聖書語彙だが、具体的な意味を脚注で補った。
