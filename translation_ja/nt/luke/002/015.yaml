  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: ja
  text: 御使いたちが彼らを離れて天に去ると、羊飼いたちは互いに言った。「さあ、ベツレヘムまで行って、主が私たちに知らせてくださったこの出来事[a]を見よう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「起こったこの事柄」とも訳せる。ギリシア語の「レーマ」は「言葉」「事柄」「出来事」を意味しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο ὡς
  choice: ～すると
  rationale: ルカに特徴的な物語進行の表現を、古風な「さて、…ということが起こった」ではなく、出来事の推移を明瞭に示す自然な現代日本語で表した。
- source_word: ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανόν
  choice: 彼らを離れて天に去る
  rationale: ἀπόによる離別とεἰςによる方向をともに保った。「天」はここでは単なる空よりも神的領域を指す文脈に適する。
- source_word: οἱ ἄγγελοι
  choice: 御使いたち
  rationale: 聖書本文として品位を保ちつつ、ἄγγελοιを神の使者として明確に表す一般的な訳語を採用した。
- source_word: ἐλάλουν πρὸς ἀλλήλους
  choice: 互いに言った
  rationale: 未完了過去の形を過度に継続的にせず、直接話法を導く自然な日本語とした。
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: さあ、ベツレヘムまで行って
  rationale: 勧奨の接続法を「行こう」、δὴの即時性・促しを「さあ」で表し、ἕωςの到達範囲を「まで」で保持した。後続の「見よう」と自然につなぐため「行って」とした。
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: この起こった出来事
  rationale: ῥῆμαの「言葉／事柄」という幅を踏まえ、ここでは実際に生じた事柄を指すため「出来事」とした。ただし語義上の別の可能性を脚注に示した。
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: 主が私たちに知らせてくださった
  rationale: ἐγνώρισενを「知らせた」とし、日本語として神に向ける敬意を補助動詞「くださった」で自然に表した。「啓示した」のような専門的含意は加えていない。
theological_decisions:
- issue: ὁ κύριοςの指示対象
  choice: 「主」と訳し、指示対象を訳文でさらに限定しない
  alternative: 「神」と明示する、または新生児である主メシアとの含意を前面に出す
  rationale: 直前の文脈では天使を通して知らせた神が自然な指示対象だが、本文自体はκύριοςと述べるため、「主」としてルカの降誕物語にある響きと緊張を保った。
- issue: ῥῆμαの意味範囲
  choice: 本文では「出来事」
  alternative: 「言葉」または「事柄」
  rationale: τὸ γεγονός（起こった）によって、告知の文言だけでなく生起した事柄を見に行く意味が前景化する。ただし「言葉」の語義を完全には排除せず脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも耐える文体。「御使い」「主」で聖書的な品位を保ち、文全体は過度に古風にしなかった。発話は「さあ」「行って…見よう」により羊飼いたちの即時の応答を自然に表現した。
