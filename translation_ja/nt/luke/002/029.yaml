  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: ja
  text: 主人よ、今、あなたはおことばどおり、あなたの奴隷[a]を平安のうちに去らせてくださいます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」とも訳せる。ギリシア語のδοῦλοςは「奴隷」と「しもべ」のどちらも意味し得るが、ここでは「主人」という呼びかけと対になっている。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では、より字義的には「解放してくださいます」または「暇を与えてくださいます」。文脈上は、シメオンが平安のうちに世を去る用意ができたことを意味する。
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: 今こそ
  rationale: シメオンが待ち望んでいたことの現在における成就を示す。日本語では「こそ」を添えることで、この時がついに来たという文脈上の力点を自然に表せる。
- source_word: ἀπολύεις
  choice: 去らせてくださいます
  rationale: 基本義は「解放する、立ち去らせる、暇を与える」。ここでは死が含意されるが明言はされないため、死への旅立ちを暗示しつつ比喩を保つ表現とした。敬語は神への直接の呼びかけとして自然である。
- source_word: τὸν δοῦλόν σου
  choice: あなたの奴隷
  rationale: δοῦλοςは「奴隷」「しもべ」の双方で訳し得るが、直後のδέσποτα（主人）との対になって所有と服従の関係が明瞭なため、「奴隷」を本文に採用した。
- source_word: δέσποτα
  choice: 主人よ
  rationale: δέσποτηςは権威と所有権を持つ主人を表す。δοῦλοςとの対応を明確に保つため、「主よ」ではなく「主人よ」とした。
- source_word: κατὰ τὸ ῥῆμά σου
  choice: おことばどおり
  rationale: κατά＋対格が示す一致・準拠を自然な日本語で表し、ῥῆμαが指す神の告げた約束とのつながりも保つ。
- source_word: ἐν εἰρήνῃ
  choice: 安らかに
  rationale: 直訳は「平安のうちに」。この文脈では、神の約束が成就したことによる平安のうちに去るという意味を、明瞭で自然な日本語にした。
theological_decisions:
- issue: シメオンの言葉を死への明示的な言及として訳すか
  choice: 死を明言せず、「去らせる」という表現で含意を保つ
  alternative: 今こそ、この奴隷を安らかに死なせてくださいます
  rationale: 文脈上、シメオンが安らかに死を迎える用意ができたことは強く示唆される。しかしἀπολύω自体は「死なせる」ではなく「解放する、去らせる」を意味するため、原文の比喩と余韻を保持した。
- issue: δοῦλοςとδέσποτηςの関係をどう表すか
  choice: 「奴隷」と「主人」の対応を本文で明示する
  alternative: 「しもべ」と「主」
  rationale: 原文では二語が主人と奴隷の関係を明確に形作っている。「しもべ／主」は典礼的で自然だが、その所有・服従関係を弱め得るため、原文の語感を優先した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神への祈りとしての威厳を保った。「今こそ」と敬語表現により自然な祈りの調子を整えた一方、「奴隷／主人」は原文の意図的な対応を保持するために採用した。
