  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: ja
  text: 羊飼いたちは、聞き、見たすべてのことが自分たちに語られたとおりであったので、神をあがめ、賛美しつつ帰って行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: 帰って行き
  rationale: 訪問先から元いた場所または務めへ戻ることを表す。日本語では「帰って行き」が自然で、物語の移動も明確になる。
- source_word: οἱ ποιμένες
  choice: 羊飼いたち
  rationale: この物語ですでに登場している複数の羊飼いを指す標準的な訳。
- source_word: δοξάζοντες
  choice: あがめ
  rationale: 神の栄光をたたえる意味を、現代日本語で自然かつ荘重に表す。「賛美」と区別しつつ並列を保つ。
- source_word: αἰνοῦντες
  choice: 賛美した
  rationale: 神をほめたたえる行為を表す標準的な聖書語であり、δοξάζοντεςとの重なりを保ちながら一語にまとめない。
- source_word: ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον
  choice: 聞いたこと、見たことがすべて……であったので
  rationale: ἐπί＋与格が示す賛美の根拠・契機を「ので」で明確にし、πᾶσινを「すべて」で保持する。
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: 自分たちに語られたとおりであった
  rationale: καθώςの一致を「とおり」で示し、受動態と語り手が明示されていない点を保つ。「語られた」は原文のλαλέωに比較的近い。
theological_decisions:
- issue: 彼らに語った主体を明示するか
  choice: 「自分たちに語られた」として主体を明示しない
  alternative: 「御使いに告げられた」または「御使いが語った」
  rationale: 文脈上は御使いの知らせを指すが、この節のギリシア語は行為者を示さない受動態であるため、本文にない主体を補わない。
- issue: 「聞いたこと、見たこと」と「語られたとおり」の関係
  choice: 聞き、見た事柄が語られた内容と一致したことを表す
  alternative: 「語られたとおりに聞き、見た」と、聞く・見る行為の仕方に直接かける
  rationale: 語順上は両方が可能な余地を持つが、文脈では羊飼いたちが確認した事柄と告知内容との一致が中心である。日本語として自然にその関係を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「あがめ、賛美した」によって二つの分詞を保った。文を過度に逐語的にせず、理由関係と告知内容との一致が普通の読者に伝わる語順に整えた。
