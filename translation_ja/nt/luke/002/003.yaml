reference: Luke 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπορεύοντο πάντες ἀπογράφεσθαι, ἕκαστος εἰς τὴν ⸀ἑαυτοῦ πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/003.yaml
  text: And everyone was going to be registered[b][a], each to his own city.
translation:
  language: ja
  text: 人々は皆、登録を受けるため、それぞれ自分の町へ向かっていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「登録を受ける」は「名簿に記載される」とも訳せる。人口調査に伴う公的な登録を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: 向かっていた
  rationale: 未完了過去の継続的・進行的な動きを自然な日本語で表し、単なる完了した移動とはしなかった。
- source_word: πάντες
  choice: 人々は皆
  rationale: 「すべての者」を文脈に即して自然に表し、後半の個別配分表現とも対応させた。
- source_word: ἀπογράφεσθαι
  choice: 登録を受けるため
  rationale: 人口調査に伴う公的な登録という受動的意味を明確にした。「届け出る」とすると本人の能動性を強めすぎるため避けた。
- source_word: ἕκαστος
  choice: それぞれ
  rationale: 一人一人が各自の町へ向かったという配分的意味を、簡潔で自然な現代日本語にした。
- source_word: ἑαυτοῦ
  choice: 自分の
  rationale: 主語への再帰的な帰属を示す。日本語では性を表示せずに単数・配分的意味を自然に保てる。
- source_word: πόλιν
  choice: 町
  rationale: πόλιςは「都市、町」を意味し、この行政上の移動先について日本語では「町」が自然である。「故郷」は本文にない祖先の地という解釈を加えるため避けた。
theological_decisions:
- issue: ἕκαστος … ἑαυτοῦ の単数男性形
  choice: 「それぞれ自分の町」と訳す
  alternative: 「一人一人、彼自身の町」と性と単数を明示する
  rationale: ギリシア語は文法上男性単数だが、日本語の「それぞれ自分の」は性を不必要に補わず、配分的・再帰的関係を正確に保持する。男性だけが登録に赴いたかどうかを本文以上に断定しない。
- issue: 「自分の町」の意味範囲
  choice: 本文どおり「自分の町」にとどめる
  alternative: 「自分の故郷」または「先祖の町」
  rationale: この節のπόλις自体は「故郷」や「先祖の町」を明示しないため、後続文脈による説明を先取りしない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。未完了過去は「向かっていた」で表し、行政的な語であるἀπογράφεσθαιは一般読者に分かる「登録を受ける」とした。脚注記号は該当文末に置いた。
