id: LUK.2.40
reference: Luke 2:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: ja
  text: さて、幼子は成長して強くなり、知恵に満たされていった。そして、神の恵み[a]が彼の上にあった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の好意」とも訳せる。
    reason: χάριςには「恵み」と「好意」の両方の意味があり、この文脈では後者も可能であるため。
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: さて、幼子は
  rationale: παιδίονは直前の乳幼児期の文脈に合う「幼子」とし、δέは場面の展開を自然に示す「さて」で表した。
- source_word: ηὔξανεν
  choice: 成長して
  rationale: 未完了過去が示す継続的な成長を、続く動詞と自然につながる形で表した。
- source_word: ἐκραταιοῦτο
  choice: 強くなり
  rationale: 未完了過去の進行的な強まりを「強くなり」と訳し、身体面だけに限定しない原文の幅を保った。
- source_word: πληρούμενον σοφίᾳ
  choice: 知恵に満たされていった
  rationale: 現在分詞による継続的・随伴的な状態を「満たされていった」で表し、σοφίᾳは内容を示すものとして「知恵に」とした。
- source_word: χάρις θεοῦ
  choice: 神の恵み
  rationale: χάριςの基本的な意味領域を保ち、日本語の聖書文体でも自然な「恵み」を採用した。文脈上の「好意」も可能なので脚注に示した。
- source_word: ἦν ἐπ’ αὐτό
  choice: その上にあった
  rationale: ἐπίが表す、その人の上に及び留まる神の恵みという表現を、原文に即して簡潔に訳した。
theological_decisions:
- issue: 受肉した御子の成長を述べる文脈での χάρις θεοῦ
  choice: 神の恵み
  alternative: 神の好意
  rationale: χάριςを教理的に狭く規定せず、神の恵み深い臨在・好意の双方を含み得る「恵み」とした。「好意」という文脈的な理解も脚注で保持した。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、物語文にふさわしい落ち着きと尊厳を保った。「その上にあった」は原文の比喩的な位置表現を残すため、より説明的な「注がれていた」などにはしなかった。
