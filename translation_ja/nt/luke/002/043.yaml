  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: ja
  text: 祭りの期間を終え、両親が帰る途中、少年イエスはエルサレムに残っていた[a]。両親はそのことを知らなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あとに残った」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「彼の両親」。ここでルカが通常の家族表現を用いていることは、この福音書の前段で述べられた処女懐胎を否定するものではない。
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: 祭りの日程を終えて
  rationale: 属格絶対による先行状況を表す。直訳的な「日々を終えて」では日本語として意味が取りにくいため、文脈上の祭りの期間を自然な「祭りの日程」とした。
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: 一行が帰途についたとき
  rationale: ἐν＋冠詞付き不定詞が示す同時進行の時間関係を自然な日本語で表した。複数代名詞は、巡礼の同行者を含む文脈に即して「一行」とした。
- source_word: ὑπέμεινεν
  choice: 残っていた
  rationale: この文脈では「その場にとどまる、後に残る」の意。「残っていた」は帰る一行との対照を自然に示す。
- source_word: ὁ παῖς
  choice: 少年イエス
  rationale: 直前の文脈で十二歳とされるため、παῖςの年齢に即した自然な訳として「少年」を選んだ。
- source_word: ἐν Ἰερουσαλήμ
  choice: エルサレムに
  rationale: 場所を示すἐνを標準的な日本語の助詞「に」で表した。
- source_word: οὐκ ἔγνωσαν
  choice: そのことに気づかなかった
  rationale: ここでγινώσκωは、イエスが残った事実を認識していなかったことを表す。「そのこと」を補って指示内容を明確にした。
- source_word: οἱ γονεῖς αὐτοῦ
  choice: 両親
  rationale: γονεῖςの直接的な意味を保ち、日本語で自然な家族呼称とした。
theological_decisions:
- issue: マリアとヨセフをイエスのγονεῖςと呼ぶこと
  choice: 両親
  alternative: 父と母
  rationale: 原文は明確に「両親」と述べている。ルカ福音書が先に語る処女懐胎との緊張を訳文で調和させず、日常的な家族表現として原文どおり保持した。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある物語文とした。「祭り」は直前の過越祭を受ける。「しかし」を用いて、一行の帰路と両親の不認知との物語上の対照を明確にした。脚注記号は、それぞれ「残っていた」と「両親」に関係する位置に置いた。
