  text: ὃ ἡτοίμασας κατὰ πρόσωπον πάντων τῶν λαῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/031.yaml
  text: which you prepared before the face of all the peoples[b][a],
translation:
  language: ja
  text: あなたがあらゆる民[a]の前に[b]お備えになったものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あらゆる民」は「すべての諸国民」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 直訳すると「顔の前に」。すべての民の目に触れるよう、公に備えられたことを表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: もの
  rationale: 中性単数の関係代名詞で、前節の「救い」を受ける。日本語では関係節を「もの」で結ぶことで、前節とのつながりを自然に示す。
- source_word: ἡτοίμασας
  choice: あなたが備えられた
  rationale: 神に向けた二人称単数のアオリスト。敬意を示しつつ、完了時制を必要以上に明示しない表現とした。
- source_word: κατὰ πρόσωπον
  choice: 前に
  rationale: 直訳的には「顔の前に」だが、ここでは人々の面前、目に見えるところに置くという慣用的な意味を自然な日本語で表す。
- source_word: πάντων τῶν λαῶν
  choice: あらゆる民
  rationale: 複数の民を包括する表現。「すべての人」として個人の総数に平板化せず、複数の民・集団という含みを保つ。
theological_decisions:
- issue: λαῶνの範囲と次節との関係
  choice: あらゆる民
  alternative: すべての諸国民
  rationale: 複数の民全体を指す広がりを保ちつつ、次節が異邦人とイスラエルを明示する前に意味を一方へ限定しない。
- issue: ὃが指す内容
  choice: 前節の「救い」を受ける「もの」
  alternative: 「救い」をこの節で反復する
  rationale: 原文の関係代名詞による前節との統語的連続を保ち、訳文に原文にはない名詞の反復を加えない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「面前に」は硬すぎ、「顔の前に」は日本語では不自然なため、本文では「前に」とした。前節から続けて読まれる一文として訳している。
