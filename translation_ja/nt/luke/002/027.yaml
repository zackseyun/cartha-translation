source:
  edition: SBLGNT
  text: καὶ ἦλθεν ἐν τῷ πνεύματι εἰς τὸ ἱερόν· καὶ ἐν τῷ εἰσαγαγεῖν τοὺς γονεῖς τὸ παιδίον Ἰησοῦν τοῦ ποιῆσαι αὐτοὺς κατὰ τὸ εἰθισμένον τοῦ νόμου περὶ αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/027.yaml
  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: ja
  text: シメオンは聖霊によって神殿に来た。[a] そして、両親が、幼子イエスを神殿に連れて来たとき、彼について律法で定められた慣例に従って行うために、[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊にあって神殿に来た」。ギリシア語は直訳すると「霊にあって」であり、「聖霊によって」とも訳せる。直前の文脈から、この霊は聖霊を指す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「両親」。ここでルカは、イエスを養育するマリアとヨセフについて、通常の家族を表す言葉を用いている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν τῷ πνεύματι
  choice: 御霊に導かれて
  rationale: 直訳的な「御霊にあって」も可能だが、ここでは移動を促す聖霊の働きを自然な現代日本語で表す。「御霊」は直前の文脈から聖霊を指す。
- source_word: ἱερόν
  choice: 神殿
  rationale: 内陣だけでなく神殿域を指す語だが、日本語では文脈上「神殿」が簡潔で自然である。
- source_word: ἐν τῷ εἰσαγαγεῖν
  choice: 連れて入って来たとき
  rationale: ἐνを伴う冠詞付き不定詞の時間的意味を、自然な従属節で表した。
- source_word: γονεῖς
  choice: 両親
  rationale: 語の通常の意味をそのまま訳し、物語上マリアとヨセフがイエスを養育する家族として描かれていることを示す。
- source_word: παιδίον Ἰησοῦν
  choice: 幼子イエス
  rationale: この場面では乳児であるため、παιδίονを「幼子」とした。
- source_word: τοῦ ποιῆσαι αὐτοὺς ... περὶ αὐτοῦ
  choice: 幼子イエスのために……行うため
  rationale: 不定詞の主語は両親であり、περὶ αὐτοῦは行為がイエスに関することを示す。日本語では「彼のために行う」が自然である。
- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: 律法の慣例どおりに
  rationale: 律法に従って慣例となっていた務めを表し、原文の「慣例」の要素を保持した。
theological_decisions:
- issue: シメオンの行動における「霊」の指示対象
  choice: 聖霊（御霊）
  alternative: シメオン自身の霊、または心の状態
  rationale: ルカ2:25–27で聖霊への言及が重ねられているため、ここも聖霊を指す可能性が高い。ただし前置詞句の訳し方には幅があるため脚注で示した。
- issue: マリアとヨセフを「両親」と呼ぶこと
  choice: γονεῖςを通常どおり「両親」と訳す
  alternative: 「保護者」または「ヨセフとマリア」
  rationale: ルカの物語上の通常の家族表現を保持する。これは生物学的父性について別の主張を加えるものではない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。長いギリシア語文を読みやすく二文に分けつつ、第二文が次節へ続く構造を保持した。「御霊」は聖霊を指す伝統的で理解しやすい語として採用した。
