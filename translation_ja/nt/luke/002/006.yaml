  text: ἐγένετο δὲ ἐν τῷ εἶναι αὐτοὺς ἐκεῖ ἐπλήσθησαν αἱ ἡμέραι τοῦ τεκεῖν αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/006.yaml
  text: And while they were there[a], the days were fulfilled for her to give birth.
translation:
  language: ja
  text: 彼らがそこにいる間に、彼女が出産する時が満ちた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼女が出産するための日々が満たされた。」
    reason: 原文は複数形の「日々」を用い、出産に至る期間が満了したことを表す。
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: （独立した表現を置かず、文脈の進行として表現）
  rationale: ἐγένετο δέ はここでは物語を進める慣用表現であり、日本語で「そして、…ということが起こった」と逐語的に訳すと不自然になるため、後続の時間節と主節によって自然に表した。
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: 彼らがそこにいる間に
  rationale: ἐν＋冠詞付き不定詞は同時性を表す。「いる間に」は、滞在中に出産の時期を迎えたという時間関係を明確かつ自然に伝える。
- source_word: ἐπλήσθησαν
  choice: 満ちた
  rationale: πίμπλημι の受動形が示す、定められた期間が満了したという含みを保つ。「時が来た」より原文の満ちるという表現に近く、過度な神学的説明も加えない。
- source_word: αἱ ἡμέραι
  choice: 日
  rationale: 原文の「日々」を反映しつつ、日本語では「出産する日が満ちた」とすることで、出産までの期間が満了したという慣用的意味を伝える。
- source_word: τοῦ τεκεῖν αὐτήν
  choice: 彼女が出産する
  rationale: 属格の冠詞付き不定詞を、期間の内容・到達点を示す連体修飾として表した。αὐτήν が不定詞 τεκεῖν の意味上の主語であることも明示できる。
theological_decisions:
- issue: ἐπλήσθησαν αἱ ἡμέραι に含まれ得る、摂理または定められた時という響き
  choice: 「日が満ちた」として、ルカの満了表現を保持する
  alternative: 「出産の時が来た」／「出産する日数が満了した」
  rationale: 文脈上は妊娠期間の満了を述べるが、「満ちた」という語には成就を思わせる響きもあり得る。明示されていない神学的意味を付加せず、その含みを平板化もしない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「日が満ちた」という簡潔で格調ある聖書的表現を保持した。「彼女」は直前の文脈のマリアを指す。
