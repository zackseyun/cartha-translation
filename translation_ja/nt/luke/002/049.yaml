id: LUK.2.49
reference: Luke 2:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: ja
  text: イエスは二人に言った。「なぜ私を捜していたのですか。私が父の家にいなければならないことを、知らなかったのですか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私が父に属する事柄に関わっていなければならないことを」。ギリシア語は「私の父に属するもの」の名詞を省いた表現で、「父の家」を指すとも、「父に関わる事柄や務め」を指すとも理解できる。
    reason: 原文の省略表現が持つ、場所と父に関わる事柄・務めの両方の解釈可能性を保持するため。
lexical_decisions:
- source_word: Τί ὅτι
  choice: どうして
  rationale: 理由を問うギリシア語の慣用表現。現代日本語として自然で、問いの力を保つ。
- source_word: ἐζητεῖτέ
  choice: 捜した
  rationale: この文脈では、見失ったイエスを両親が捜していたことを表すため、「求めた」より「捜した」が自然。未完了形が示す継続的な捜索は、前後の文脈によって十分伝わる。
- source_word: οὐκ ᾔδειτε
  choice: 知らなかったのですか
  rationale: 知識・認識を問う修辞疑問を直接的かつ自然に表す。
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: 自分の父の家に
  rationale: 直訳的には「わたしの父のもの（こと）の中に」という省略表現。直前の神殿という場所から「父の家」が有力だが、「父のことに携わる」という意味も可能なので脚注に残す。日本語では発話者を明確にするため「自分の父」とした。
- source_word: δεῖ
  choice: いなければならない
  rationale: 単なる予定ではなく、神的・必然的な必要を表す語の重みを保つ。
- source_word: εἶναί με
  choice: わたしが…いる
  rationale: δεῖに続く対格主語付き不定詞を、日本語の従属節として自然に表した。
- source_word: πατρός μου
  choice: 自分の父
  rationale: ここではヨセフではなく神を指す文脈上の対照を保つ。日本語では通常、表記上の大文字による区別ができないため、説明を本文に加えない。
theological_decisions:
- issue: 省略表現 ἐν τοῖς τοῦ πατρός μου の意味
  choice: 本文では「自分の父の家に」
  alternative: 「自分の父のことに携わって」／「自分の父に属するものの中に」
  rationale: 神殿で見つかったという直近の文脈は場所としての「父の家」を強く支持する一方、原文の中性複数定冠詞を伴う省略表現は、父の事柄・務めを指す可能性も残す。本文を自然にしつつ、真正の曖昧さを脚注で保持した。
- issue: 「父」の指示対象
  choice: 神を指す表現として、そのまま「自分の父」と訳す
  alternative: 「神であるわたしの父」などと明示する
  rationale: 神殿という場面とヨセフとの対照から指示対象は神と理解されるが、原文にない説明を本文へ挿入せず、イエスの子としての主張をそのまま保つ。
translation_notes:
  register: 明瞭で現代的ながら、イエスの発言にふさわしい落ち着いた丁寧体を用いた。「二人」は直前の両親を受ける。日本語には大文字・小文字の区別がないため、「父」を特殊表記せず、文脈に委ねた。
