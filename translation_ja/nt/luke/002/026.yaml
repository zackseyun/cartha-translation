id: LUK.2.26
reference: Luke 2:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: ja
  text: そして彼は、主のメシア[a]を見るまでは死を見ることはない、と聖霊によって示されていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「主のキリスト」。または「主の油注がれた者」。
    reason: χριστόςの称号について、伝統的音訳と語義を示すため。
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: 示されていた
  rationale: 完了受動分詞が表す、神から告知を受け、その内容が引き続き有効である状態を、自然な現代日本語で表す。文中で聖霊が動作主として明示されるため、「示された」の神的啓示の意味も明確である。
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: 聖霊によって
  rationale: 属格を伴うὑπόが示す人格的な動作主を保持する。
- source_word: μὴ ἰδεῖν θάνατον
  choice: 死を見ることはない
  rationale: 単に「死なない」と意訳せず、原文の「死を見る」という比喩的表現を、日本語として理解可能な形で保持する。
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: 見るまでは
  rationale: 将来の出来事が起こる以前には死なない、という時間的順序と条件性を自然な日本語で表す。
- source_word: τὸν χριστὸν κυρίου
  choice: 主のメシア
  rationale: χριστόςがここでは称号として用いられているため「メシア」とし、属格κυρίουとの関係を簡潔な「主の」で保持する。
- source_word: κυρίου
  choice: 主の
  rationale: κύριοςを「主」と訳し、属格を自然な連体修飾で表す。
theological_decisions:
- issue: 称号としてのΧριστόςの訳語
  choice: メシア
  alternative: キリスト／主の油注がれた者
  rationale: ここでは人名の一部というより、主に属し、主から遣わされる待望の者を指す称号である。「メシア」はその称号性とユダヤ的背景を明瞭に伝える。「キリスト」という伝統的表現は脚注に残す。
- issue: 「死を見る」という表現の保持
  choice: 死を見ることはない
  alternative: 死ぬことはない
  rationale: 意味は「死なない」だが、原文固有の比喩を保ち、啓示の厳粛な響きを伝える。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、聖霊の人格的働きと「死を見る」という原文の厳粛な比喩を保持した。「彼」は直前のシメオンを受ける。
