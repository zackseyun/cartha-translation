  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: ja
  text: そして羊飼いたちは、幼子を見て、この子について自分たちに告げられていたこと[a]を知らせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ことば」。または「語られた事柄」「知らせ」。
    reason: ῥῆμαには「ことば」「発言」「事柄」「知らせ」などの意味があり、ここでは御使いがこの子について語った内容を指す。
lexical_decisions:
- source_word: ἰδόντες
  choice: その子を見ると
  rationale: アオリスト分詞の時間的な働きを自然な日本語で表した。目的語は原文では明示されないが、直前の文脈から幼子を指すため「その子」を補った。
- source_word: δὲ
  choice: そして
  rationale: 強い対比ではなく物語を進める緩やかな接続なので、「そして」とした。
- source_word: ἐγνώρισαν
  choice: 人々に知らせた
  rationale: γνωρίζωの「知らせる、明らかにする」という使役的な意味を簡潔に表した。日本語として意味を明瞭にするため、受け手として文脈上の「人々に」を補った。
- source_word: περὶ τοῦ ῥήματος
  choice: こと
  rationale: ῥῆμαは「ことば」「発言」「告げられた事柄」を意味し得る。ここでは御使いが幼子について語った内容を指すため、現代日本語で自然な「こと」とした。語義の幅は脚注に残した。
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: 自分たちに告げられていた
  rationale: 羊飼いたちに先に語られたことを示す受動表現と時間関係を保った。
- source_word: περὶ τοῦ παιδίου τούτου
  choice: この子について
  rationale: παιδίονを文脈に即して平明な「子」とし、τούτουの指示性を「この」で保持した。
theological_decisions:
- issue: 御使いの告知を指すῥῆμαの訳し方
  choice: こと
  alternative: ことば／知らせ／語られた事柄
  rationale: 特別な専門用語や教派的含意を持ち込まず、実際に語られた内容を自然に指せる訳を採用した。一方で、原語が「ことば」そのものを表し得る点は脚注で明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての簡潔さと品位を保った。「羊飼いたち」と「人々に」は文脈から補い、誰が誰に知らせたのかを日本語で明確にした。
