  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: ja
  text: 彼らは急いで来て、マリアとヨセフ、そして飼い葉桶の中に横たわっている赤ん坊を見つけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθαν
  choice: 行き
  rationale: 話の中で羊飼いたちが告げられた場所へ向かう動きを、現代日本語の自然な視点で表した。
- source_word: σπεύσαντες
  choice: 急いで
  rationale: 主動詞に伴う動作の仕方と切迫感を、簡潔で自然な日本語で表した。
- source_word: ἀνεῦραν
  choice: 見つけた
  rationale: 探した末に発見するという語義に合い、文脈上も自然である。
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: マリアとヨセフ
  rationale: 固有名詞を日本語で定着した形に音写し、τε ... καὶ の結び付きを自然な並列で表した。
- source_word: τὸ βρέφος
  choice: 赤ん坊
  rationale: 誕生直後の幼子を指すことが明確で、一般の読者に分かりやすい現代語である。
- source_word: κείμενον
  choice: 横たわっている
  rationale: 誰かが寝かせた行為ではなく、その時の姿勢・状態を表す現在分詞の意味を保った。
- source_word: ἐν τῇ φάτνῃ
  choice: 飼い葉桶の中に
  rationale: φάτνηが指す家畜の餌を入れる容器を、伝統的な文脈にも合う明瞭な日本語で表した。
- source_word: καὶ ... τε ... καὶ ... καὶ
  choice: 彼らは…マリアとヨセフ、そして…赤ん坊
  rationale: 原文の加算的な並列を保ちながら、日本語として過度に接続詞を重ねない形に整えた。
