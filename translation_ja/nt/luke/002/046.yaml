id: LUK.2.46
reference: Luke 2:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: ja
  text: 三日後、両親はイエスを神殿[a]で見つけた。イエスは教師たちの間に座って、彼らの話を聞き、彼らに質問していた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語は、内陣だけでなく、境内を含む神殿域全体を指す。
    reason: cultural_note
  - marker: b
    text: 別訳「彼らに問いかけていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: 〜のこと
  rationale: ルカに特徴的な場面導入の語法を、古風すぎない現代日本語で表した。接続詞「そして」と合わせて物語の進行を示す。
- source_word: μετὰ ἡμέρας τρεῖς
  choice: 三日の後
  rationale: μετά＋対格の時間的用法を語順も含めて比較的忠実に表した。「三日後」より原文に近く、自然さも保てる。
- source_word: εὗρον αὐτόν
  choice: 二人はイエスを見つけた
  rationale: 日本語では主語と目的語を明示したほうが場面を追いやすい。直前の文脈にいる二人を「二人」、αὐτόνを「イエス」とした。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: 標準的で読みやすい訳語を採用した。ἱερόνが内陣に限らず神殿境内を指すことは脚注で補った。
- source_word: καθεζόμενον ἐν μέσῳ τῶν διδασκάλων
  choice: 教師たちの間に座り
  rationale: 継続中の姿勢と位置を自然な日本語で描写した。διδάσκαλοιに原文にない「律法の」を補わず、「教師たち」とした。
- source_word: ἀκούοντα αὐτῶν
  choice: 彼らの話を聞いたり
  rationale: 属格を伴うἀκούωを、注意して聞く継続的な行為として自然に表した。後続の行為との並行関係を「〜たり」で示した。
- source_word: ἐπερωτῶντα αὐτούς
  choice: 彼らに質問したり
  rationale: 対話への積極的な参加を示しつつ、敵対的な詰問という含みを加えない表現とした。
theological_decisions:
- issue: イエスと教師たちとのやり取りの性質
  choice: 「彼らの話を聞いたり、彼らに質問したり」とし、聞くことと問うことの両方を並列した。
  alternative: 「彼らを問いただしていた」または「彼らに問いかけていた」
  rationale: この場面に示されるイエスの謙虚な傾聴と積極的な知的参加の双方を保ち、挑戦や尋問であったと断定しない。後続節が語る知恵を先取りして過度に説明することも避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語の格調を保った。「そして、三日の後のこと」によってルカの場面導入表現を自然に反映し、分詞が描く一続きの情景は二文に分けて読みやすくした。
