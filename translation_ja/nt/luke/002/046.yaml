  - severity: medium
    issue: 「聞いたり、…質問したりしていた」の「〜たり」
    rationale: 「〜たり」は行為の例示または反復を示しやすい。原文は、見つけた時点でイエスが座り、聞き、質問している一続きの場面を描くため、「聞き、…質問していた」とするほうが適切である。
