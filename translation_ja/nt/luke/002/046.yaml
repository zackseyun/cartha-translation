  to: 三日後、両親はイエスを神殿[a]で見つけた。イエスは教師たちの間に座って、彼らの話を聞き、彼らに質問していた[b]。
  rationale: 文の骨格と用語は維持しつつ、現代日本語として不自然な時間表現を「三日後」に改めた。また、反復・例示の含みを帯びうる「〜たり」構文を、原文の継続的で一続きの情景を表す「聞き、…質問していた」に改めた。
