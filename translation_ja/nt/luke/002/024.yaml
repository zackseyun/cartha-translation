id: LUK.2.24
reference: Luke 2:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: ja
  text: また、主の律法に述べられているとおり[a]、「山鳩一つがい、または鳩のひな二羽」をいけにえとして献げるためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「主の律法に言われているとおり」。
    reason: κατὰ τὸ εἰρημένον は、律法の中ですでに語られ、なお有効な内容を指す。本文は自然な日本語として「述べられている」としたが、「言われている」も原文のλέγω（言う）をより直接に反映する訳語として可能である。
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: いけにえとして献げるため
  rationale: 属格付き定冠詞不定詞は文脈上目的を表す。δίδωμι は直訳すれば「与える」だが、θυσίαν との結び付きでは日本語の祭儀表現として「いけにえとして献げる」が自然で、意味も明確である。
- source_word: κατὰ τὸ εἰρημένον
  choice: 言われているとおり
  rationale: 完了受動分詞は、律法の中ですでに語られ、今も有効なものとして記されている内容を指す。「定められている」と解釈的に言い換えず、λέγω の発話概念と継続的効力を保つ。
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: 主の律法に
  rationale: νόμος はここではモーセ律法を指すため「律法」とし、κύριος は新約本文に即して「主」とした。日本語では「主の律法に言われている」が自然である。
- source_word: ζεῦγος τρυγόνων
  choice: 山鳩一つがい
  rationale: ζεῦγος は二羽から成る一組、τρυγών は特定の鳩であるキジバト類（turtledove）を指す。聖書翻訳で通用し、一般読者にも分かりやすい「山鳩」を採用した。
- source_word: δύο νοσσοὺς περιστερῶν
  choice: 家鳩のひな二羽
  rationale: νοσσός はひな・若鳥を表し、περιστερά はここでは家鳩を指す。原文の「二羽」と若い鳥である点をともに明示した。
theological_decisions:
- issue: 律法の引用句における κύριος の訳し方
  choice: 主
  alternative: 主なる神／【主】
  rationale: ギリシア語本文は κύριος であり、新約本文として通常の「主」を用いる。背後にある旧約の神名表記を推定して特殊表記に置き換えず、本文が持つ表現を保つ。
- issue: κατὰ τὸ εἰρημένον の時間的含意
  choice: 言われているとおり
  alternative: かつて言われたとおり／定められているとおり
  rationale: 完了形には、過去に語られた結果が現在も存続する含意がある。「言われている」は日本語でその現存性を自然に示し、「定められた」という規定性を本文以上に前面化しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祭儀文脈にふさわしい品位を保った。「献げる」は神への供献を示す慣用表記。「また」で前節から続く並列的な目的を示し、単独節としても読めるよう末尾を「ためであった」と補った。
