- from: すると御使いは彼らに言った。「恐れることはありません。見なさい。私は、民全体に及ぶ大きな喜びの知らせを、あなたがたに告げます。[a]」
  to: すると天使は彼らに言った。「恐れないでください。というのも、見なさい。私はあなたがたに大きな喜びの良い知らせを告げます。この喜びは民全体のものとなります。[a]」
  rationale: γάρを「というのも」で明示し、ἰδούの注意喚起を「見なさい」で保ちました。「大きな喜びの良い知らせ」はεὐαγγελίζομαιとχαρὰν μεγάληνを自然な日本語で表し、続く「この喜び」によって関係節が喜びを受けることを明確にしています。「民全体」は定冠詞付きのλαόςの限定された集合的響きを保持し、脚注で可能なより広い理解を示します。
