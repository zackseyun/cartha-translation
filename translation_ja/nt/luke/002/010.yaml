id: LUK.2.10
reference: Luke 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: ja
  text: すると天使は彼らに言った。「恐れないでください。というのも、見なさい。私はあなたがたに大きな喜びの良い知らせを告げます。この喜びは民全体のものとなります。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての人のものとなる」。ギリシア語はより直訳的には「民全体のものとなる」であり、この文脈では特定の民を指すとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: 御使い
  rationale: 定冠詞は直前に登場した御使いを指す。日本語では文脈上特定されるため、指示語を加えず「御使い」とした。
- source_word: Μὴ φοβεῖσθε
  choice: 恐れることはありません
  rationale: 複数の羊飼いたちへの禁止・安心の呼びかけを、自然で穏やかな現代日本語として表した。
- source_word: ἰδοὺ γὰρ
  choice: 見なさい
  rationale: ἰδούの注意喚起を明示した。γάρの理由関係は、後続する知らせの内容と文脈によって自然に伝わるため、硬い接続表現は置かなかった。
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: 大きな喜びの知らせを、あなたがたに告げます
  rationale: 動詞の基本義である「良い知らせを告げる」を保ち、ὑμῖνの複数性も「あなたがた」で明示した。
- source_word: χαρὰν μεγάλην
  choice: 大きな喜び
  rationale: 語順と強意を素直に保ち、知らせがもたらす大きな喜びを表した。
- source_word: ἥτις ἔσται
  choice: に及ぶ
  rationale: 直訳的な「あることになる」より自然な日本語としつつ、その喜びが民全体のためのものとなる未来的な広がりを表した。
- source_word: παντὶ τῷ λαῷ
  choice: 民全体に
  rationale: 定冠詞を伴うλαόςの集合的・限定的な響きを保つ。「すべての人」として普遍化せず、直近の文脈で特定の民、すなわちイスラエルを指し得る余地を残した。
theological_decisions:
- issue: παντὶ τῷ λαῷの範囲
  choice: 民全体に
  alternative: すべての人に
  rationale: ギリシア語は定冠詞を伴う単数の「民」であり、ルカの直近の物語ではイスラエルの民を指す可能性が高い。より広い救済史的展開を否定せず、この節だけで対象を全人類と確定しない訳とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御使い」は聖書文体として広く理解される語を採用し、「見よ」などの文語表現は避けた。
