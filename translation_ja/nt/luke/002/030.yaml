  text: because my eyes have seen your salvation[a]
translation:
  language: ja
  text: 私の目があなたの救い[a]を見たからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 意訳「あなたの救い主を」。ギリシア語は「あなたの救い」であり、文脈上、それはイエスにおいて示された神の救いを指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前の「安らかに去らせてくださいます」を受け、その理由を示す接続表現。現代日本語では文末の「からです」が因果関係を明確かつ自然に表す。
- source_word: εἶδον
  choice: 見た
  rationale: ギリシア語アオリストの完了した出来事を素直に表す。日本語の過去形は、今その結果を語っているという文脈にも自然に適合する。
- source_word: οἱ ὀφθαλμοί μου
  choice: 私の目が
  rationale: 単に「私は」とせず、原文の身体的で生き生きとした表現を保つ。
- source_word: τὸ σωτήριόν σου
  choice: あなたの救い
  rationale: σωτήριον は通常、人格を直接指す「救い主」ではなく、救い・解放を表す。幼子イエスにおいて神の救いが目の前に現れているという文脈上の含みを残しつつ、原文の語形を保つ。
theological_decisions:
- issue: τὸ σωτήριόν σου を抽象的な「あなたの救い」とするか、幼子イエスを指す「あなたの救い主」と人格化して訳すか
  choice: あなたの救い
  alternative: あなたの救い主
  rationale: 原文は通常の人格名詞 σωτήρ（救い主）ではなく σωτήριον（救い、救済）を用いている。「あなたの救い」と訳すことで、神の救いがイエスという人格において現れているという神学的な重なりを、説明し切らずに保持する。
translation_notes:
  register: 明瞭で現代的ながら、シメオンの賛歌にふさわしい品位を保った。「私の目が」は原文の荘重で具体的な言い回しを維持し、「からです」で前節との論理的なつながりを自然に示した。
