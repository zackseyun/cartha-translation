- from: 八日が満ちて、この子に割礼を施す時になると[a]、その子はイエスと名付けられた[b]。それは、この子が胎内に宿る前に、御使いによって付けられていた名である[c]。
  to: 割礼を施すための八日が満ちると、その名はイエスと呼ばれた[b]。それは、この子が胎内に宿る前に天使によって告げられていた名である[c]。
  rationale: 時間表現を原文の「割礼のための八日が満ちたとき」に対応する一つの自然な日本語表現へ整理した。命名の受動表現は「その名はイエスと呼ばれた」として明示的な「名」を保持した。最後の分詞句は、天使が前もってその名を告げたことを表す形に改め、受胎前という時系列を保持した。脚注aは、改訂本文では単独の語句に対応する有用な代替訳を提供しないため削除した。
