id: LUK.2.21
reference: Luke 2:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν ἡμέραι ὀκτὼ τοῦ περιτεμεῖν αὐτόν, καὶ ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς, τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: ja
  text: 割礼を施すための八日が満ちると、その名はイエスと呼ばれた[b]。それは、この子が胎内に宿る前に天使によって告げられていた名である[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 直訳「その名はイエスと呼ばれた」。
    reason: lexical_alternative
  - marker: c
    text: 文脈上、マリアの胎内に宿る前を指す。1章31節参照。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: 八日が満ちて
  rationale: 日数が満了したことを表す受動的・完了的な語感を保ちつつ、ルカのやや荘重な表現を自然な現代日本語で伝える。
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: この子に割礼を施す時になると
  rationale: 属格付き不定詞が示す目的・時の関係を、日本語として明瞭に表した。指示対象を「この子」として補い、代名詞の曖昧さを避けた。
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: その子はイエスと名付けられた
  rationale: ギリシア語の受動態と命名行為を保ちながら、「その名はイエスと呼ばれた」という不自然な直訳を避けた。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 新約聖書の人名として定着した日本語表記を用いた。語源的に対応する「ヨシュア」には置き換えない。
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: 御使いによって付けられていた名
  rationale: 「名」と受動の意味を明示し、前節で登場した特定の御使いを定冠詞に即して表した。「呼ばれていた」よりも命名の文脈に自然である。
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: この子が胎内に宿る前に
  rationale: ここでの συλλαμβάνω は受胎を、κοιλία は胎内を指す。「宿る」は受胎の意味を明瞭かつ自然に伝え、原文にない教理的説明を加えない。
theological_decisions:
- issue: 受胎についての句とキリスト論との関係
  choice: この子が胎内に宿る前に
  alternative: この子が胎内で受胎する前に
  rationale: 本文が述べる人としての受胎と命名の時系列をそのまま示し、後代の神学用語や説明を本文へ持ち込まない。「宿る」は自然な日本語でありつつ、受胎前という原文の意味を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「八日が満ちて」でルカの荘重な語調を残した。「御使い」は聖書文体として広く理解される語を採用し、全体は朗読にも適した端正な文体とした。
