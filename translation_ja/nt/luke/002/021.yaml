    rationale: 「八日が満ちて、この子に割礼を施す時になると」は、同一の時点を「八日が満ちて」と「時になると」で二重に表している。原文の簡潔な χρον的構文を損なわずに整理できる。
  - severity: low
    issue: 「御使い」と「付けられていた」の語調・意味合い
    rationale: 「御使い」は聖書的ではあるが、明瞭な現代標準日本語では「天使」がより中立的である。「付けられていた」は名を授ける行為を強く含意するため、天使がその名を告げたルカ1章の文脈に即して「告げられていた」とするほうが自然である。
  revised_text: 割礼を施すための八日が満ちると、その名はイエスと呼ばれた[b]。それは、この子が胎内に宿る前に天使によって告げられていた名である[c]。
