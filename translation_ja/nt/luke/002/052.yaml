source:
  edition: SBLGNT
  text: Καὶ Ἰησοῦς προέκοπτεν ⸂σοφίᾳ καὶ ἡλικίᾳ⸃ καὶ χάριτι παρὰ θεῷ καὶ ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/052.yaml
  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: ja
  text: イエスは、知恵と背丈[a]において、また神と人々の前での好意においても、成長していった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「年齢」または「成熟」とも訳せる。
    reason: ἡλικίαは「背丈」のほか、「年齢」や「成熟」を意味し得るため。
lexical_decisions:
- source_word: προέκοπτεν
  choice: 増し、伸びていき／ますます…受けた
  rationale: 未完了過去が表す継続的な進展を、各目的語に合う自然な日本語で表した。一度きりの変化ではなく、時とともに成長したことを示す。
- source_word: σοφίᾳ
  choice: 知恵
  rationale: 理解力や判断力を含む σοφία の標準的で明瞭な訳語。
- source_word: ἡλικίᾳ
  choice: 背丈
  rationale: ἡλικία には「年齢」と「背丈」の両義がある。この文脈では目に見える身体的成長を自然に表す「背丈」を本文に採り、別訳を脚注に残した。
- source_word: χάριτι
  choice: 好意
  rationale: ここでは抽象的・救済論的な「恵み」よりも、神および人々との関係における好意や喜ばれることを指す。
- source_word: παρὰ θεῷ
  choice: 神から
  rationale: 与格を伴う παρά が示す、神との関係・神の目から見た評価を、並行する人々との関係と合わせて自然な日本語にした。
- source_word: ἀνθρώποις
  choice: 人々
  rationale: ἄνθρωποι はここで男性だけでなく人間一般を指すため、現代日本語で正確かつ自然な「人々」とした。
theological_decisions:
- issue: イエスの真の人間的成長とキリスト論上の緊張
  choice: 知恵と身体における継続的な成長、および神と人々から受ける好意の増加を率直に訳す。
  alternative: 神学的な緊張を避けるため、イエスの発達を弱めたり曖昧にしたりする。
  rationale: ギリシア語はイエスが実際に進展したと明記している。その真の人間性についての記述を和らげず、本文の緊張をそのまま保つ。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、簡潔ながら品位ある聖書本文の調子を保った。「人々」は性別を限定せず、原語の一般的用法を直接表すため、英語版のような性別語に関する脚注は不要と判断した。
