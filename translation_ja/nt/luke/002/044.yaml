  text: νομίσαντες δὲ αὐτὸν ⸂εἶναι ἐν τῇ συνοδίᾳ⸃ ἦλθον ἡμέρας ὁδὸν καὶ ἀνεζήτουν αὐτὸν ἐν τοῖς συγγενεῦσιν ⸀καὶ τοῖς γνωστοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/044.yaml
  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: ja
  text: しかし二人は、イエスが旅の一行[a]の中にいるものと思い、一日分の道のりを進んだ。それから、親族や知人の中にイエスを捜し始めた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「旅の仲間」、または「隊商」とも訳せる。ギリシア語は、共に旅をする一団を指す。
    reason: lexical_alternative
  - marker: b
    text: 「捜していた」とも訳せる。未完了形は、捜索が続いていたことを強調し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: νομίσαντες
  choice: いるものと思い
  rationale: イエスが同行しているとの暫定的な判断を表す。文脈に自然で、確認済みという含みを避けた。
- source_word: δὲ
  choice: しかし
  rationale: 前節からの穏やかな対照と、イエスの不在に気づかず出発したという物語上の転換を示す。
- source_word: εἶναι ἐν τῇ συνοδίᾳ
  choice: 旅の一行の中にいる
  rationale: συνοδίαを、共に旅をする集団として明瞭かつ自然に表した。
- source_word: ἦλθον ἡμέρας ὁδὸν
  choice: 一日分の道のりを進んだ
  rationale: 一日かけて進む距離または行程を指すギリシア語の慣用表現を自然な日本語にした。
- source_word: ἀνεζήτουν
  choice: 捜し始めた
  rationale: 未完了過去が示し得る起動的かつ継続的な捜索を文脈に即して表現した。継続面は脚注で別訳を示す。
- source_word: συγγενεῦσιν
  choice: 親族
  rationale: 性別を限定せず、広く血縁・姻戚関係にある人々を表す現代標準語。
- source_word: γνωστοῖς
  choice: 知人
  rationale: 必ずしも親しい友人に限らない、顔見知りを含む既知の人々という範囲を保つ。
theological_decisions: []
