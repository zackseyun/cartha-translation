  source_fidelity: 原文の主要な意味はよく保たれている。νομίσαντες の暫定的な判断、「旅の一行」、一日分の行程、親族・知人という区別はいずれも適切である。ただし、ἀνεζήτουν の目的語 αὐτόν（イエス）を後半にも明示し、「親族や知人の間を捜す」というやや不自然で対象がぼやける表現を整えるのが望ましい。
  naturalness: 全体として明瞭な現代標準日本語である。「親族や知人の間を捜し始めた」は、場所を『捜す』ようにも読め、誰を捜したかが文面上は省かれているため、「親族や知人の中にイエスを捜し始めた」のほうが自然で明確である。
  terminology: 「旅の一行」「親族」「知人」は適切で、神学用語上の問題はない。脚注bの動詞形の説明は、日本語では「未完了形」とするほうが正確で自然である。
