  - severity: low
    issue: 「親族や知人の間を捜し始めた」がやや不自然である。
    rationale: 人々の中から捜す意味には「親族や知人の中にイエスを捜し始めた」が自然で、ἐν τοῖς συγγενεῦσιν καὶ τοῖς γνωστοῖς の範囲も保てる。
  - severity: low
