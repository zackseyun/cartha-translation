  text: φῶς εἰς ἀποκάλυψιν ἐθνῶν καὶ δόξαν λαοῦ σου Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/032.yaml
  text: a light for revelation to the Gentiles[a], and glory to your people Israel.
translation:
  language: ja
  text: 異邦人[a]に啓示をもたらす光、あなたの民イスラエルの栄光です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民」。ギリシア語は一般に「国々、諸国民」を意味しますが、ここではイスラエルとの対比から、イスラエル以外の民、すなわち異邦人を指すと考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: 光
  rationale: 無冠詞の名詞だが、日本語では冠詞を補わず「光」とするのが自然で、幼子を詩的に描く述語的表現を保てる。
- source_word: εἰς ἀποκάλυψιν
  choice: 照らす啓示の
  rationale: εἰς が示す目的・結果と、ἀποκάλυψις の「覆いを除いて明らかにする」意味を、日本語として理解しやすい連体表現にした。「啓示」を残して神による開示という響きも保った。
- source_word: ἐθνῶν
  choice: 異邦人
  rationale: 直訳は「諸国民」も可能だが、直後のイスラエルとの対比から、ここではイスラエル以外の民を指すことが明確であるため「異邦人」とした。
- source_word: καὶ
  choice: 、
  rationale: 二つの並行句を日本語の読点で滑らかにつなぎ、ギリシア語の並列関係を保った。
- source_word: δόξαν
  choice: 栄光
  rationale: 誉れと輝きの両面を持つ語であり、聖書的な響きも保つ標準的な訳語。
- source_word: λαοῦ σου Ἰσραήλ
  choice: あなたの民イスラエル
  rationale: イスラエルが「あなたの民」を同格的に特定する構造を、簡潔で格調ある現代日本語で表した。
theological_decisions:
- issue: ἐθνῶνとイスラエルの関係
  choice: 異邦人
  alternative: 諸国民
  rationale: 語そのものは広く「諸国民」を意味し得るが、この節では「あなたの民イスラエル」と対置されているため、「異邦人」が文脈上の意味を明瞭に伝える。語義上の別訳は脚注で保持した。
- issue: ἀποκάλυψινの統語的意味
  choice: 異邦人を照らす啓示
  alternative: 異邦人の啓示／諸国民が明らかにされるため
  rationale: 属格 ἐθνῶν は、啓示を受ける対象として理解するのが文脈上自然である。ただし原文の圧縮された詩的構造を過度に説明せず、「照らす」で光の比喩との結び付きを示した。
translation_notes:
  register: シメオンの賛歌にふさわしい簡潔で格調ある詩的表現としつつ、現代の一般読者に理解しやすい語順にした。「啓示」はやや聖書的な語だが、原語の神的開示という含意を保つため採用した。
