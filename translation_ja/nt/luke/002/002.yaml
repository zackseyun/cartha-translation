  yaml_path: translation/nt/luke/002/002.yaml
  text: This registration took place first while Quirinius was governing Syria[a][b].
translation:
  language: ja
  text: （この住民登録は、キリニウスがシリアを統治していた時に最初に行われたものである[a][b]。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この住民登録は、キリニウスがシリアを統治する以前に行われた」。ここで「最初に」と訳したギリシア語を、比較を含む時間的な意味に理解する見方がある。
    reason: alternative_reading
  - marker: b
    text: 「住民登録」は「人口調査」とも訳せる。ギリシア語は公的な登録を指し、多くの場合、課税と関係していた。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: この
  rationale: 直前の2章1節で述べられた住民登録を指す指示語として、自然な現代日本語の「この」を用いた。
- source_word: ἀπογραφή
  choice: 住民登録
  rationale: 課税などに関係する公的な登録を表す語であり、行政上の登録という意味を明確にしつつ、「人口調査」ほど範囲を限定しない表現とした。
- source_word: πρώτη
  choice: 最初に
  rationale: まず通常の序数的意味を本文に採用した。歴史的・統語的に議論のある「以前に」という理解は脚注に残した。
- source_word: ἐγένετο
  choice: 行われた
  rationale: 住民登録という行政上の出来事が実施されたことを、自然な日本語で表した。
- source_word: ἡγεμονεύοντος
  choice: 統治していた時に
  rationale: 属格独立構文の同時性を保ち、ギリシア語が特定の官職名を明示していないため、「総督だった」と限定せず動詞的に訳した。
- source_word: τῆς Συρίας
  choice: シリア
  rationale: 地名の標準的な日本語表記を用いた。
- source_word: Κυρηνίου
  choice: キリニウス
  rationale: 人名の日本語聖書における一般的な表記を用いた。
theological_decisions:
- issue: 歴史的に議論のある節における πρώτη の解釈
  choice: 本文では通常の序数的意味を採り、「最初に」と訳す。
  alternative: 「キリニウスがシリアを統治する以前に、この住民登録は行われた」と訳す。
  rationale: πρώτη の最も直接的な意味は「最初の／最初に」である。一方、比較を含む時間的用法として「以前に」と理解する説もあるため、歴史上の問題を訳文で一方的に解消せず脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の括弧も保持した。「統治していた」により、原文が明示しない特定の官職名を補わず、時間的な属格独立構文を自然に表現した。
