id: LUK.2.18
reference: Luke 2:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἀκούσαντες ἐθαύμασαν περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: ja
  text: そして、聞いた人々は皆、羊飼いたちから自分たちに語られたことに驚いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「感嘆した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の物語との単純な連結を保ちつつ、現代日本語の自然な叙述とした。
- source_word: πάντες οἱ ἀκούσαντες
  choice: 聞いた人々は皆
  rationale: 冠詞付きアオリスト分詞の名詞的用法を表す。目的語はギリシア語本文に明示されないため、日本語でも補わず、文脈に委ねた。
- source_word: ἐθαύμασαν
  choice: 驚いた
  rationale: 聞いた内容に対する驚嘆・驚きを自然な現代日本語で表す。「感嘆した」も可能だが、やや限定的で硬い。
- source_word: περὶ τῶν λαληθέντων
  choice: 語られたことに
  rationale: περί＋属格の対象・関連の意味と、受動分詞の内容を日本語として自然に表した。「ことについて驚いた」よりも「ことに驚いた」が慣用的である。
- source_word: ὑπὸ τῶν ποιμένων
  choice: 羊飼いたちから
  rationale: 受動構文の行為者を示すὑπό＋属格を、日本語の伝達表現に自然な「から」で示した。
- source_word: πρὸς αὐτούς
  choice: 自分たちに
  rationale: 聞いた人々を指す再帰的な関係が日本語で明確になるようにした。ただし指示対象を本文以上に具体化してはいない。
theological_decisions:
- issue: ἐθαύμασανが表す反応の性質
  choice: 驚きという反応のみを述べ、信仰または不信仰とは規定しない
  alternative: 聞いた人々が信仰をもって応答した、または単に好奇心を示したと訳す
  rationale: θαυμάζωは驚嘆や驚きを表すが、その反応が救いに至る信仰であったかどうかを本文は明示しないため、神学的な開放性を保った。
translation_notes:
  register: 明快で現代的ながら、聖書叙述にふさわしい落ち着いた文体。「聞いたこと」を重ねず、原文同様に最初の聞く対象は文脈に委ねた。
