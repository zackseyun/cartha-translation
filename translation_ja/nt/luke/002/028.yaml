base_translation:
  language: en
  yaml_path: translation/nt/luke/002/028.yaml
  text: And he took him into his arms and blessed God and said,[a]
translation:
  language: ja
  text: そしてシメオンは幼子を腕に抱き、神をほめたたえて言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: そしてシメオンは
  rationale: 直前の文脈で指示される人物を明示し、現代日本語で自然に主語をつなぐ。αὐτόςの強意を「自ら」として過度に強調しない。
- source_word: ἐδέξατο αὐτό
  choice: 幼子を…抱き
  rationale: δέχομαιの基本的な「受け入れる、受け取る」という意味は、εἰς τὰς ἀγκάλαςとの結び付きにより、幼子を腕に受けて抱く身体的動作を表す。中性代名詞αὐτόは文法上の形を直訳せず、指示対象である幼子として訳す。
- source_word: εἰς τὰς ἀγκάλας
  choice: 腕に
  rationale: ἀγκάλαιは抱いたり支えたりする腕を指す。ギリシア語に所有代名詞はないが、日本語では動作主自身の腕であることが自然に理解されるため、「自分の」は補わない。
- source_word: εὐλόγησεν τὸν θεόν
  choice: 神をほめたたえて
  rationale: 神を目的語とするεὐλογέωは、神を賛美することを表す。日本語の「神を祝福する」は神に祝福を与える意味に誤解されやすいため、機能的に明瞭な「ほめたたえる」とする。
- source_word: καὶ εἶπεν
  choice: 言った。
  rationale: 後続する発言を導く単純な叙述。日本語では主語を繰り返さず自然につなぐ。
theological_decisions:
- issue: 中性代名詞αὐτόの指示対象
  choice: 幼子イエスを指すものとして「幼子」と訳す。
  alternative: 文法的な中性形を反映して非人格的な代名表現にする。
  rationale: 代名詞の文法性は指示対象の非人格性を意味しない。日本語で人物を非人格的に扱う誤解を避け、物語上の指示対象を明確にする。
- issue: εὐλόγησεν τὸν θεόνの表現
  choice: 「神をほめたたえて」と訳す。
  alternative: 「神を祝福して」と形式的に対応させる。
  rationale: ここでは人が神に祝福を授けるという意味ではなく、神への賛美を表す。現代日本語で神学的誤解を招かない語を選ぶ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「幼子」はルカ2章の降誕物語に適した聖書的かつ一般に理解可能な語。「ほめたたえる」により、神を対象とするεὐλογέωを自然に表現した。
