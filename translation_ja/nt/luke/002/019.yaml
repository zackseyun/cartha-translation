  text: ἡ δὲ ⸀Μαρία πάντα συνετήρει τὰ ῥήματα ταῦτα συμβάλλουσα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: ja
  text: しかしマリアは、これらのことばをすべて大切に保ち[a]、それらを心の中で思い巡らしていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらのことをすべて心に留めていた」とも訳せる。「ことば」は、語られた内容・事柄を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「思い巡らしていた」は、心の中でそれらを突き合わせ、考え合わせていた、という意味を含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の人々の驚きと、マリアの内面的な応答との穏やかな対照を示す。
- source_word: συνετήρει
  choice: 大切に保ち
  rationale: 未完了過去の継続的な意味と、注意深く保存するという語感を自然な日本語で表す。
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: これらのことばをすべて
  rationale: ῥήματαを直前に告げられた内容と結びつく「ことば」とし、πάνταの包括性を保つ。文脈上は「これらの出来事」とも理解できる。
- source_word: συμβάλλουσα
  choice: 思い巡らしていた
  rationale: 事柄を心の中で突き合わせ、考え合わせる継続的な内省を、明瞭で自然な現代日本語にする。
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: 心に
  rationale: 思考と内面的な省察を表す聖書的な「心」の比喩を保持する。
- source_word: Μαρία
  choice: マリア
  rationale: 日本語聖書で定着した人名表記を用いる。
theological_decisions:
- issue: マリアの応答の性質
  choice: 告げられたことを大切に保ち、継続して思い巡らした
  alternative: 出来事を単に記憶した、またはその時点ですべてを完全に理解した
  rationale: 本文は注意深い保持と内省を述べるが、完全な理解までは明言しないため、その緊張を保つ。
translation_notes:
  register: 明瞭で品位ある現代標準語。「大切に保ち」と「思い巡らしていた」により、継続的な保持と省察を区別しつつ自然につないだ。脚注記号は対応箇所を文全体に関わるものとして文末に置いた。
