  yaml_path: translation/nt/luke/002/047.yaml
  text: And all who heard him were astonished at his understanding and his answers[a].
translation:
  language: ja
  text: 彼の話を聞いていた人は皆、彼の理解力と答えに非常に驚いていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「驚嘆していた」とも訳せる。ギリシア語の動詞は強い驚きを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξίσταντο
  choice: 驚嘆していた
  rationale: 未完了過去形が表す継続的な反応と、強い驚きを自然な現代日本語で示す。「驚いていた」より強く、「我を忘れていた」のような誤解も避けられる。
- source_word: δὲ
  choice: （明示せず）
  rationale: 弱い接続辞であり、日本語では文脈上あえて訳出しないほうが自然な物語の流れになる。
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: 彼の話を聞いていた人は皆
  rationale: 現在分詞の継続的な聴取を「聞いていた」で表し、πάντεςの全称的範囲を「皆」で保持する。属格αὐτοῦは、単に声を聞くというより彼の語る内容を聞く意味が明瞭になるよう「彼の話」とした。
- source_word: ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: その理解力と受け答えに
  rationale: ἐπί＋与格が驚きの根拠・対象を示すため「に」とした。σύνεσιςは文脈上の理解・洞察を「理解力」で、複数のἀπόκρισιςは対話場面に自然な「受け答え」で表す。
- source_word: αὐτοῦ
  choice: その
  rationale: 二度目の代名詞は、日本語で「彼の」を繰り返す不自然さを避けつつ、イエスの理解力と受け答えを指すことを明確にするため「その」とした。
theological_decisions: []
translation_notes:
