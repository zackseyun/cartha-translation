source:
  edition: SBLGNT
  text: Καὶ ποιμένες ἦσαν ἐν τῇ χώρᾳ τῇ αὐτῇ ἀγραυλοῦντες καὶ φυλάσσοντες φυλακὰς τῆς νυκτὸς ἐπὶ τὴν ποίμνην αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/008.yaml
  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: ja
  text: さて、その同じ地方に、羊飼いたちがいて、野宿をし[a]、夜、自分たちの羊の群れを見張っていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「野外で夜を過ごし」。このギリシア語動詞は、羊飼いたちが野外で夜を過ごしていたことを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「自分たちの羊の群れの上で夜の見張りを守っていた」。複数形の「見張り」は、夜間の見張りの区分、場合によっては交替を示唆する。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: さて
  rationale: 物語が新しい場面へ移ることを自然な現代日本語で示す。καίの継続的な働きを保ちつつ、機械的な「そして」を避けた。
- source_word: ποιμένες
  choice: 羊飼いたち
  rationale: 羊を世話する者を指す標準的で明確な訳語。
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: その同じ地方では
  rationale: χώραの「地方、地域」の意味を取り、直前に述べられたベツレヘム周辺を指す表現として自然に訳した。
- source_word: ἀγραυλοῦντες
  choice: 野宿をし
  rationale: 野外、とりわけ牧草地で夜を過ごすという動詞の意味を簡潔に表す。「野に住んでいた」よりも一時的な宿営を自然に伝える。
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: 夜には交代で…見張っていた
  rationale: 同族語を重ねた原文は直訳すれば「夜の見張りを守る」。複数の夜警の時間帯を受け持つ含みを「交代で」によって明示し、自然な日本語にした。
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: 自分たちの羊の群れを
  rationale: ποίμνηの集合的な意味を「羊の群れ」として明確にし、見張る対象を自然な目的語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、聖書本文として落ち着きのある文体。「野宿」は一般読者に分かりやすく、「交代で」は原文の複数形 φυλακάς が示唆する夜警の区分を本文で伝える。脚注記号は該当表現の直後に配置した。
