  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: ja
  text: ヨセフも、ガリラヤの町ナザレからユダヤへ、ダビデの町と呼ばれるベツレヘムへ上って行った。彼がダビデの家系と一族[a]に属していたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「ダビデの家と一族」。ギリシア語は、家系や祖先とのつながりを表す二つの関連語を用いて、ヨセフがダビデの系統に属することを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέβη
  choice: 上って行った
  rationale: ユダヤ地方へ向かう移動を表す原文の「上る」という地理的な語感を保ちつつ、現代日本語として自然にした。
- source_word: δὲ καὶ
  choice: も
  rationale: 物語の流れを軽くつなぎ、ヨセフも移動したことを示す。日本語では不要な接続語を足さず、「も」で καί の意味を明確にした。
- source_word: ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ
  choice: ガリラヤの町ナザレから
  rationale: 二重の起点表現を簡潔な日本語にまとめながら、地域名と町名の関係を保った。
- source_word: εἰς τὴν Ἰουδαίαν
  choice: ユダヤにある
  rationale: 目的地ベツレヘムがユダヤ地方にあることを、後続句と自然に結び付けた。
- source_word: εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: ベツレヘムと呼ばれるダビデの町へ
  rationale: ベツレヘムという名称と「ダビデの町」という重要な結び付きを、原文の説明関係を保って表した。
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: 彼が…出身だったからである
  rationale: 理由を表す διά と冠詞付き不定詞を、明瞭で自然な理由節として訳した。
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: ダビデの家系と一族の出身
  rationale: οἶκος の王統・家系の含意と、πατριά の祖先を同じくする一族の含意を区別し、二語を一つに畳み込まないようにした。
theological_decisions:
- issue: ヨセフのダビデ系の出自を表す二つの語
  choice: ダビデの家系と一族の出身
  alternative: ダビデの家と血筋に属していた
  rationale: 原文の οἶκος と πατριά の重なり合う二つの系譜語をともに示し、ヨセフのダビデ系の出自を強調する一方、本文を越えた教理的説明は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書物語にふさわしい落ち着いた文体とした。長いギリシア語文は理由節の前で二文に分け、意味関係を明確にした。
