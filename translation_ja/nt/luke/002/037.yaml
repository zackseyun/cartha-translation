id: LUK.2.37
reference: Luke 2:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: ja
  text: また彼女は、八十四歳のやもめであった[a]。彼女は神殿の境内[b]を離れず、夜も昼も、断食と祈願[c]をもって神に仕えていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「八十四年間やもめであった」。ギリシア語は、アンナの年齢とも、やもめであった期間とも理解できる。
    reason: alternative_reading
  - marker: b
    text: ここでいう「神殿」は、内陣そのものではなく、建物や庭を含む神殿域を指す。
    reason: cultural_note
  - marker: c
    text: または「嘆願」「願いの祈り」。
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: やもめ
  rationale: 夫に先立たれた女性を表す語。文脈上、結婚生活の後に続いたアンナの身分を述べている。現代でも聖書の格調に合う簡潔な表現とした。
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: 八十四歳になるまで
  rationale: 省略を含むギリシア語句をアンナの年齢と解した。やもめであった期間を指す可能性もあるため、本文で一方に断定しきらず脚注に別解を示した。
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: 神殿の境内を離れず
  rationale: 未完了過去形が表す継続的・習慣的な行動を自然な日本語で表した。ἱερόνの範囲も明確にした。
- source_word: ἱεροῦ
  choice: 神殿の境内
  rationale: ἱερόνは内陣そのものではなく、より広い神殿域を指すため、「神殿」だけでなく「境内」とした。
- source_word: νηστείαις
  choice: 断食
  rationale: 複数形は繰り返された実践を示すが、日本語では集合的に「断食」とするのが自然である。
- source_word: δεήσεσιν
  choice: 祈願
  rationale: 一般的な祈りの中でも願い求める祈りを表す語義を保持した。
- source_word: λατρεύουσα
  choice: 神に仕えていた
  rationale: 宗教的奉仕・礼拝を表す分詞。目的語の神は文脈上明らかな補足であり、日本語では「神に仕える」が自然に聖なる奉仕を伝える。
- source_word: νύκτα καὶ ἡμέραν
  choice: 夜も昼も
  rationale: ギリシア語の語順を保ち、絶え間ない献身を表す慣用的な日本語とした。
theological_decisions:
- issue: アンナの年齢か、やもめであった期間か
  choice: 本文では、八十四歳になるまでやもめであったと読む。
  alternative: 八十四年間やもめであった、と読むこともできる。
  rationale: ギリシア語の圧縮された構文には両方の解釈が可能である。本文の可読性のため年齢の解釈を採りつつ、原文の真正な曖昧さを脚注に保存した。
- issue: λατρεύουσα が表す行為
  choice: 「神に仕えていた」と訳し、礼拝を含む宗教的奉仕として表す。
  alternative: 「礼拝していた」と訳すこともできる。
  rationale: 断食と祈願を伴う継続的な献身という文脈では、「仕える」がλατρεύωの奉仕と礼拝の両面を保ちやすい。特定の制度的奉仕を意味するとは限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「やもめ」は簡潔で聖書文体になじむ語として採用した。「神殿の境内」によりἱερόνと内陣を指すναόςとの区別を本文で伝えた。節頭のκαὶ αὐτήは前節から続く構文であり、「そして」として接続を保った。
