  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: ja
  text: まさにその時[a]、彼女もそこに来て、神に感謝をささげ、エルサレムの贖いを待ち望んでいるすべての人に、彼について語っていた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ちょうどその同じ時」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 文脈上は幼子イエスを指すのが最も自然だが、ギリシア語で最も近い明示的な先行詞は「神」である。
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: まさにその時
  rationale: 時を示す与格表現に、αὐτῇの強調を「まさに」で反映し、アンナがその場に現れた即時性を自然な日本語で示した。
- source_word: ἐπιστᾶσα
  choice: 近寄って来て
  rationale: この文脈では、その場に近づいて来たことを表すアオリスト分詞。動作の仕方を過度に特定せず、場面への到来を明瞭にした。
- source_word: ἀνθωμολογεῖτο τῷ θεῷ
  choice: 神に感謝をささげていた
  rationale: 未完了過去の継続性を「ていた」で表した。動詞は神に向けた感謝または賛美を表し得るが、与格のτῷ θεῷと自然につながる「感謝をささげる」を本文に採用した。原文に明示されない「始めた」は補わなかった。
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: この方のことを語っていた
  rationale: 未完了過去の継続的な発話を「語っていた」で示した。αὐτοῦを固有名に置き換えず、男性単数代名詞に対応する敬意ある指示表現を用いた。
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: 待ち望んでいるすべての人に
  rationale: προσδέχομαιが含む期待を伴う待望を「待ち望む」で表し、πᾶσινも「すべての人」と明示した。
- source_word: λύτρωσιν Ἰερουσαλήμ
  choice: エルサレムの贖い
  rationale: λύτρωσιςの解放・救済という重みを「贖い」で保ち、政治的解放か霊的救済かなどを本文で限定しなかった。
theological_decisions:
- issue: 「この方」（αὐτοῦ）が誰を指すか
  choice: 本文では「この方」とし、文脈上は幼子イエスを指すと理解できる形を保った。
  alternative: 直前に明示された「神」を指すと読む余地もある。
  rationale: 物語の焦点と贖いを待つ人々への告知という文脈からは幼子イエスが最も自然だが、ギリシア語では神が最も近い明示的な先行詞である。固有名に置き換えず、注で曖昧さを示した。
- issue: 「エルサレムの贖い」の範囲
  choice: 原文どおり「エルサレムの贖い」とし、意味を限定しなかった。
  alternative: 「エルサレムの解放」または神の民の霊的救済と明示する訳。
  rationale: この表現は、エルサレムと結びついた神の民への救いの働きを広く指し、共同体的・終末的な響きを持ち得るため、一つの解釈に狭めなかった。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で品位ある常体を採用した。「贖い」は日常語ではないものの、原語の救済的な重みを保つため採用した。二つの未完了過去を「語っていた」などで表し、継続性を保った。
