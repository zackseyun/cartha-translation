id: LUK.2.39
reference: Luke 2:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: ja
  text: 主の律法に従ってすべてのことを済ませた後[a]、彼らはガリラヤにある自分たちの町[b]ナザレへ帰った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主の律法が求めることをすべて済ませた後」。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語は「都市」とも訳せる語。ここではナザレが小規模な集落だったことから「町」とした。
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: すると
  rationale: アオリスト動詞を伴って後続の行動の時を示す。直前の務めが完了した後の物語の流れを自然に表しつつ、「すぐに」とまでは限定しない。
- source_word: ἐτέλεσαν
  choice: 済ませる
  rationale: 定められた一連の務めを完了したことを表す。「成就した」では預言成就の含みが強くなり得るため避けた。
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: 主の律法に従ってすべてを
  rationale: 主の律法に沿う事柄のすべて、または律法が求めるすべてを指す。本文ではギリシャ語の簡潔さを保ち、義務性を明示する言い換えは脚注に置いた。
- source_word: νόμον κυρίου
  choice: 主の律法
  rationale: 聖書的な表現を保ちつつ、現代日本語として自然な属格表現にした。
- source_word: κυρίου
  choice: 主
  rationale: この文脈では神を指すκύριοςの通常の訳語であり、神の律法という意味を明瞭に伝える。
- source_word: ἐπέστρεψαν
  choice: 帰った
  rationale: 旅行の文脈における「戻る」を、目的地が自分たちの町であることに合わせて自然な日本語で表した。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ
  rationale: 目的地を示すεἰςを日本語で自然に表した。
- source_word: εἰς πόλιν ἑαυτῶν
  choice: 自分たちの町へ
  rationale: ἑαυτῶνの強調を「自分たちの」で保った。πόλιςは都市・町を広く指し得るが、ナザレの規模を踏まえて「町」とした。
- source_word: Ναζαρέθ
  choice: ナザレ
  rationale: 日本語聖書で定着した地名表記を用いた。
theological_decisions:
- issue: 「主の律法」における「主」の指示対象
  choice: 聖書に示された律法を与えた神を指す
  alternative: この文脈で神学的に重大な別解はない
  rationale: ユダヤ教・聖書的文脈での標準的な表現として素直に訳し、家族が律法に従ったこと以上の教理的主張を加えない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。物語の時間的推移を自然に示し、律法遵守の内容について原文以上の神学的含意を加えない。
