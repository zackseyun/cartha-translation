  terminology: 「主」はκύριονにふさわしく、「彼らの神である主」はτὸν θεὸν αὐτῶνとの同格を自然に示す。「イスラエルの子ら」は原文の表現を保持し、脚注がより慣用的な代案を示している。脚注アンカー[a]も本文中の該当句に適切に付されている。
