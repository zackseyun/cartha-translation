id: LUK.1.16
reference: Luke 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πολλοὺς τῶν υἱῶν Ἰσραὴλ ἐπιστρέψει ἐπὶ κύριον τὸν θεὸν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/016.yaml
  text: And he will turn many of the sons of Israel to the Lord their God[a].
translation:
  language: ja
  text: そして、イスラエルの子らの多くを、彼らの神である主に立ち帰らせる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの民の多くを」または「イスラエル人の多くを」とも訳せる。ギリシア語は直訳すると「イスラエルの子らの多くを」で、伝統的な契約表現を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節から続く預言の流れを示す接続詞として、自然な現代日本語の「そして」を用いた。
- source_word: πολλοὺς
  choice: 多くを
  rationale: 後続の属格句を伴う名詞的用法であり、「イスラエルの子らの多くを」と簡潔に表した。
- source_word: τῶν υἱῶν Ἰσραὴλ
  choice: イスラエルの子らの
  rationale: 直訳的な契約表現と聖書内の響きを保つため、「イスラエル人」と平板化せず、υἱῶνの男性複数も反映した。
- source_word: ἐπιστρέψει
  choice: 立ち帰らせる
  rationale: 未来・能動で、ヨハネが人々を神へ向き直らせる使役的な他動詞の力を表す。「回心させる」より解釈を限定せず、神への帰還という含意を自然に示す。
- source_word: ἐπὶ
  choice: に
  rationale: ἐπιστρέφωと対格を伴い、向かう先を示すため、日本語では「主に立ち帰らせる」とした。
- source_word: κύριον
  choice: 主
  rationale: ここでは人間の主人ではなくイスラエルの神を指すので、契約的・神学的な重みを保つ「主」とした。
- source_word: τὸν θεὸν αὐτῶν
  choice: 彼らの神である
  rationale: 「主」と同格であることを日本語で明確かつ自然に示し、「彼らの神である主」とした。
theological_decisions:
- issue: 契約表現 τῶν υἱῶν Ἰσραὴλ の訳
  choice: イスラエルの子ら
  alternative: イスラエルの民／イスラエル人
  rationale: 原文の「子ら」という形と伝統的な契約表現の響きを本文に残した。日本語では性別を明示しない「子ら」も可能だが、ここでは原語表現を保つことを優先し、慣用的な代案を脚注に示した。
- issue: κύριον τὸν θεὸν αὐτῶν の関係
  choice: 彼らの神である主
  alternative: 主、彼らの神
  rationale: κύριονとτὸν θεὸν αὐτῶνの同格関係を明示し、主がイスラエルの神であるという契約的意味を保持した。
- issue: ἐπιστρέψει の使役性と帰還の含意
  choice: 立ち帰らせる
  alternative: 向き直らせる／回心させる
  rationale: ヨハネが主体となって多くの者を神へ向ける他動詞的意味を保ちつつ、「回心」という教義用語に狭めないようにした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。語順は日本語として自然に整えつつ、「イスラエルの子ら」と「立ち帰らせる」によって聖書的な響きと原文の使役性を保持した。
