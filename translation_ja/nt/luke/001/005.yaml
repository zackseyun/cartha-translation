id: LUK.1.5
reference: Luke 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο ἐν ταῖς ἡμέραις ⸀Ἡρῴδου βασιλέως τῆς Ἰουδαίας ἱερεύς τις ὀνόματι Ζαχαρίας ἐξ ἐφημερίας Ἀβιά, ⸀καὶ γυνὴ ⸀αὐτῷ ἐκ τῶν θυγατέρων Ἀαρών, καὶ τὸ ὄνομα αὐτῆς Ἐλισάβετ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/005.yaml
  text: In the days of Herod[a], king of Judea, there was a priest named Zechariah, from the division of Abijah; and he had a wife from the daughters of Aaron[b], and her name was Elizabeth.
translation:
  language: ja
  text: ユダヤの王ヘロデの時代、アビヤ組[a]に属する祭司で、名をザカリヤという人がいた。その妻はアロンの娘たち[b]の一人で、名をエリサベトといった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アビヤ組」は、神殿で交替して奉仕した祭司の組の一つ。
    reason: cultural_note
  - marker: b
    text: 別訳「アロンの子孫」。「アロンの娘たち」は、祭司の家系に属する女性たちを指す表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο ἐν ταῖς ἡμέραις
  choice: 〜の時代、…人がいた
  rationale: 物語を導入する存在表現と時を示す句を、現代日本語で自然な形にした。
- source_word: Ἡρῴδου βασιλέως τῆς Ἰουδαίας
  choice: ユダヤの王ヘロデ
  rationale: 属格による支配領域と称号を簡潔に表した。Ἰουδαίαは歴史的地域名として「ユダヤ」とした。
- source_word: ἱερεύς τις ὀνόματι Ζαχαρίας
  choice: 祭司で、名をザカリヤという人
  rationale: τιςによる人物の初出を「ある」と重ねず、「人がいた」で自然に示した。
- source_word: ἐξ ἐφημερίας Ἀβιά
  choice: アビヤ組に属する
  rationale: ἐφημερίαは神殿奉仕を交替で担う祭司の組を指すため、「組」とし、所属関係を明示した。
- source_word: γυνὴ αὐτῷ
  choice: その妻は
  rationale: 所有の与格を日本語の自然な関係表現に置き換えた。
- source_word: ἐκ τῶν θυγατέρων Ἀαρών
  choice: アロンの娘たちの一人
  rationale: ギリシア語の具体的な親族表現を本文に残しつつ、ἐκの出自・所属の意味を自然に表した。
- source_word: τὸ ὄνομα αὐτῆς Ἐλισάβετ
  choice: 名をエリサベトといった
  rationale: 命名の定型句を、簡潔で品位のある現代日本語にした。
theological_decisions:
- issue: エリサベトの祭司家系を示す表現
  choice: アロンの娘たちの一人
  alternative: アロンの子孫
  rationale: 原文の「娘たち」という女性形の親族表現を保持し、一般化した「子孫」だけに置き換えないことで、本文の具体的なイメージを残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文は一文だが、日本語の読みやすさのため二文に分けた。人名は日本語聖書で広く通用する「ヘロデ、ザカリヤ、アビヤ、アロン、エリサベト」を用いた。
