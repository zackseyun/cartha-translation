id: LUK.1.22
reference: Luke 1:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξελθὼν δὲ οὐκ ⸀ἐδύνατο λαλῆσαι αὐτοῖς, καὶ ἐπέγνωσαν ὅτι ὀπτασίαν ἑώρακεν ἐν τῷ ναῷ· καὶ αὐτὸς ἦν διανεύων αὐτοῖς, καὶ διέμενεν κωφός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/022.yaml
  text: But when he came out[a], he was not able to speak to them, and they realized that he had seen a vision in the sanctuary[b]. And he kept making signs to them and remained mute.
translation:
  language: ja
  text: 彼は外に出て来ると、人々に話すことができなかった。そこで人々は、彼が聖所で幻を見たのだと悟った。彼は人々に身振りをし続け、口が利けないままであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「耳が聞こえないままであった」とも訳し得る。ギリシア語は、口が利けないことを表す場合と、耳が聞こえないことを表す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθὼν δὲ
  choice: ところが、彼は外に出て来ても
  rationale: アオリスト分詞による先行動作を自然な時間関係として表し、δέは、外に出れば祝福を告げるはずなのに話せなかったという文脈上の対照を「ところが」で示した。
- source_word: οὐκ ἐδύνατο λαλῆσαι αὐτοῖς
  choice: 人々に話すことができなかった
  rationale: δύναμαι＋不定詞が示す能力の欠如を明示し、αὐτοῖςの対象も保った。
- source_word: ἐπέγνωσαν
  choice: 悟った
  rationale: 目の前の様子から事情をはっきり理解したことを、簡潔で自然な日本語で表した。
- source_word: ὀπτασίαν
  choice: 幻
  rationale: この文脈では超自然的・啓示的な光景を指すため、日本語聖書語としても一般読者に理解しやすい「幻」とした。
- source_word: ἐν τῷ ναῷ
  choice: 聖所で
  rationale: ναόςは神殿域全体よりも聖所そのものを指すため、「神殿」ではなく「聖所」として語彙上の区別を保った。
- source_word: ἦν διανεύων
  choice: 身振りをし続け
  rationale: 迂言的未完了形の継続性を「し続け」で表し、διανεύωは意思を伝える身振りとして自然に訳した。
- source_word: διέμενεν κωφός
  choice: 口が利けないままであった
  rationale: διαμένωの継続状態を「ままであった」で示した。κωφόςは聾を意味し得るが、直前の発話不能を受けるこの箇所では、まず発話不能を本文に出した。
theological_decisions:
- issue: ゼカリヤの状態を表すκωφόςの範囲
  choice: 本文では「口が利けない」とし、発話不能を前面に出す。
  alternative: 「耳が聞こえず、口も利けない」または「耳が聞こえない」
  rationale: 直前のοὐκ ἐδύνατο λαλῆσαιが明示するのは発話不能であり、身振りの描写もそれと整合する。一方、κωφόςには聴覚障害を表す用法もあるため、その可能性は脚注に残し、物語上の緊張を断定的に解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「聖所」「幻」など本文の宗教的場面にふさわしい簡潔で端正な語調を保った。脚注記号[a]は該当するκωφόςの訳の直後に置いた。
