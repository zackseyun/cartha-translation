  yaml_path: translation/nt/luke/001/008.yaml
  text: It happened[a], while he was serving as priest before God in the order of his division,
translation:
  language: ja
  text: さて、ゼカリヤが自分の組の定められた順番で、神の前で祭司として仕えていたときのことである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: さて、…ときのことである
  rationale: 物語の展開を示す定型表現と弱い接続を、古風にならない自然な日本語で表した。独立した時間語としての「今」は加えていない。
- source_word: ἐν τῷ ἱερατεύειν αὐτὸν
  choice: ゼカリヤが…祭司の務めをしていたとき
  rationale: ἐν＋冠詞付き不定詞の時間的用法を「…していたとき」とし、ἱερατεύωの祭司職に固有の意味を明示した。主語は直前の文脈からゼカリヤと補った。
- source_word: ἐν τῇ τάξει τῆς ἐφημερίας αὐτοῦ
  choice: 自分の組の当番に従い
  rationale: τάξιςは定められた順序、ἐφημερίαは交替で奉仕する祭司の組を指す。「組の当番」で制度と勤務の巡番を簡潔に伝えた。
- source_word: ἔναντι τοῦ θεοῦ
  choice: 神の前で
  rationale: 神の臨在のもとで行う奉仕を示す簡潔で定着した表現とした。
theological_decisions:
- issue: ゼカリヤの神殿祭司奉仕を表す祭儀用語
  choice: 自分の組の当番に従い、神の前で祭司の務めをしていた
  alternative: 自分の祭司組の定められた順番で、神の御前に祭司として仕えていた
  rationale: 歴史的な祭司の組別奉仕を明確にしつつ、後代の教会職制を連想させる用語を持ち込まない。「神の前」は原文の簡潔さを保った。
translation_notes:
  register: 明瞭な現代標準日本語。物語として自然でありながら、神殿祭儀の歴史的背景と原文の構造を保つ、端正で平易な文体。
