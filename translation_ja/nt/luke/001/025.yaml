id: LUK.1.25
reference: Luke 1:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι Οὕτως μοι ⸀πεποίηκεν κύριος ἐν ἡμέραις αἷς ἐπεῖδεν ⸀ἀφελεῖν ὄνειδός μου ἐν ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/025.yaml
  text: because this is how the Lord has dealt with me in the days when he looked on me[a], to take away my reproach among people.
translation:
  language: ja
  text: 「主は、私に目を留めてくださったこの時に、人々の間で受けていた私の恥辱[a]を取り除くため、このようにしてくださったのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恥」「不名誉」とも訳せる。原語は特に、人々の間で受ける非難や社会的な不名誉を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 引用文全体で内容を示す
  rationale: 直前の「言った」（1:24）を受けて発言内容を導く接続詞と理解した。日本語では引用符によってその機能が明らかなため、「なぜなら」などを加えない。理由を示す可能性も文脈上はあるが、この節を自然な発言として訳した。
- source_word: Οὕτως μοι πεποίηκεν κύριος
  choice: 主は……このようにしてくださった
  rationale: οὕτως の指示的な強調と、μοι を伴う ποιέω が表す本人に対する主の働きを保つ。「くださった」により、エリサベトが神の行為を恵みとして語る自然な日本語にした。
- source_word: ἐν ἡμέραις αἷς
  choice: この時に
  rationale: 直訳的な「その日々に」よりも、ある期間を指す時間表現として現代日本語で自然。「この」は、彼女が経験している現在の出来事を指す。
- source_word: ἐπεῖδεν
  choice: 私に目を留めてくださった
  rationale: 単に視覚的に見るだけでなく、顧みて注意を向ける意味を表す。「私」はギリシア語では明示されないが、文脈と μοι から自然に補った。
- source_word: ἀφελεῖν
  choice: 取り除くため
  rationale: 目的を表す不定詞として訳し、主が目を留めたことと恥辱の除去との関係を保持した。
- source_word: ὄνειδός μου
  choice: 私の恥辱
  rationale: 個人の内面的な羞恥心より、人々から受ける非難や社会的不名誉を中心に表す語として「恥辱」を選んだ。
- source_word: ἐν ἀνθρώποις
  choice: 人々の間で受けていた
  rationale: 恥辱が社会的な場で経験されたことを明確にする。「受けていた」は日本語として補った表現で、原文の社会的意味を自然に伝える。
theological_decisions:
- issue: κύριος の指示対象
  choice: 神を指す称号として「主」
  alternative: この箇所でキリストを指すと限定する読み
  rationale: 文脈では、エリサベトは不妊による恥辱を取り除いた神の働きを語っている。直近の文脈にないキリスト論的限定を持ち込まない。
- issue: ὄνειδος の社会的意味
  choice: 外から受ける不名誉を示す「恥辱」
  alternative: 内面的感情に重点を置く「恥ずかしさ」または一般的な「恥」
  rationale: 不妊が当時の社会で非難や不名誉の対象とされた文脈を保ちつつ、本文が明示しない心理状態に限定しない。
- issue: ἐπεῖδεν と ἀφελεῖν の関係
  choice: 「目を留め……取り除くため」と目的関係を示す
  alternative: 結果として「目を留め、取り除いてくださった」と並列的に訳す
  rationale: 不定詞の目的的な力を明示しつつ、主の顧みと恥辱の除去の結び付きを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、エリサベトの感謝にふさわしい品位を保った。「主」「恥辱」は聖書的な重みを残し、「この時に」「目を留めてくださった」で一般読者にも理解しやすくした。
