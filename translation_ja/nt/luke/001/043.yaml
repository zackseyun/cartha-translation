  text: And why is this granted to me[a], that the mother of my Lord should come to me?
translation:
  language: ja
  text: 私の主の母が私のところに来るとは、どうして私にこのようなことが起こったのでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「これはどこから私に起こったのでしょうか」。思いがけない栄誉を受けたことへの驚きを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόθεν μοι τοῦτο
  choice: どうして私にこのようなことがあったのでしょうか
  rationale: 直訳すれば「どこから私にこのことが」となるが、ここでは思いがけない栄誉への驚きを表す慣用的な問いである。現代日本語として自然な疑問表現にしつつ、「私に」「このようなこと」によって原文の要素を保った。
- source_word: ἵνα ἔλθῃ
  choice: 来てくださるとは
  rationale: ἵνα節は、驚きの対象となった出来事の内容を示す。「とは」で感嘆の調子を表し、「来てくださる」は、訪問を思いがけない厚意として受け止める文脈を自然な日本語で伝える。
- source_word: ἡ μήτηρ τοῦ κυρίου μου
  choice: 私の主の母
  rationale: 語順と関係を簡潔に保ち、κύριοςは尊称およびキリスト論的含意を弱めない「主」とした。後代の教理的称号は付加していない。
- source_word: πρὸς ἐμέ
  choice: 私のところに
  rationale: エリサベトのもとへの移動を自然に表す。「私の家に」と限定する情報は原文にないため加えない。
theological_decisions:
- issue: τοῦ κυρίου μου における κύριος の訳
  choice: 私の主
  alternative: 私の主人
  rationale: 「主」はこの箇所の敬意とキリスト論的な重みを保つ一方、本文が明言していない後代の教理表現を持ち込まない。
- issue: πόθεν μοι τοῦτο の慣用表現
  choice: どうして私にこのようなことがあったのでしょうか
  alternative: どこから私にこのことがあるのでしょうか
  rationale: 逐語訳の不自然さを避け、与えられた栄誉に対する驚きという含意を明瞭にした。字義的な形は脚注に残した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「来てくださるとは」と疑問形を組み合わせ、エリサベトの謙遜と驚きを自然に表した。
