source:
  edition: SBLGNT
  text: καὶ ⸀εἰσελθὼν πρὸς αὐτὴν εἶπεν· Χαῖρε, κεχαριτωμένη, ὁ κύριος μετὰ ⸀σοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/028.yaml
  text: And coming in to her[a], he said, “Greetings, favored one[b]; the Lord is with you.”
translation:
  language: ja
  text: 御使いはマリアのところへ入って行き、言った。「喜びなさい[a]、恵みを受けた方[b]。主があなたと共におられます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「喜びなさい」。ここでは挨拶としても用いられており、「こんにちは」とも訳せる。伝統的には「めでたし」。
    reason: lexical_alternative
  - marker: b
    text: 「恵まれた方」とも訳せる。伝統的には「恵みに満ちた方」。ギリシア語は、恵みまたは好意を与えられた人を表す。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθὼν πρὸς αὐτὴν
  choice: マリアのところに入って来て
  rationale: アオリスト分詞と方向を示す前置詞句を、御使いが彼女のいる場所へ入ったことが自然に伝わる日本語にした。文脈上の指示対象を明確にするため「彼女」ではなく「マリア」とした。
- source_word: Χαῖρε
  choice: おめでとう
  rationale: 形式上は「喜べ」という命令形だが、ここでは挨拶として機能する。「おめでとう」は挨拶の性格と喜びの含みをともに伝えるが、他の訳し方も脚注に示した。
- source_word: κεχαριτωμένη
  choice: 恵みを受けた方
  rationale: χαριτόω の完了受動分詞として、マリアが恵み・好意を与えられた者であることを明示する。完了形が示す継続的な結果を過度に説明せず、受動の意味を保った。
- source_word: ὁ κύριος
  choice: 主
  rationale: 神を指す標準的な聖書的称号として、簡潔で尊厳ある「主」とした。
- source_word: μετὰ σοῦ
  choice: あなたと共におられます
  rationale: 「あなたと共に」を意味する句に、日本語として必要な述語を補った。神の臨在を語るため敬意を表す「おられます」を用いた。
theological_decisions:
- issue: マリアに対する κεχαριτωμένη の訳
  choice: 恵みを受けた方
  alternative: 恵まれた方／恵みに満ちた方
  rationale: ギリシア語の受動的な語義、すなわちマリアが恵みの受領者であることを前面に出した。「恵みに満ちた方」という伝統的表現が持ちうる意味を排除はしないが、原文だけでは明示されない内在的性質や後代の教理を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、御使いの言葉には丁寧で尊厳ある調子を持たせた。「おめでとう」は現代日本語で祝いの言葉に限定して聞こえる可能性があるため、原語が挨拶であり「喜びなさい」の語義も含むことを脚注で補った。
