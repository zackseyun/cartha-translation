base_translation:
  language: en
  yaml_path: translation/nt/luke/001/051.yaml
  text: He has shown strength with his arm[b][a]; he has scattered the proud in the thoughts of their hearts.
translation:
  language: ja
  text: 主はその御腕で力を現され、心の思いにおいておごり高ぶる者たちを散らされた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その心の思いによって、おごり高ぶる者たちを散らされた」。ギリシア語のこの句は、おごり高ぶる者たちの内なる思いを指すとも、彼らを散らす際の事情または手段を指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐποίησεν κράτος
  choice: 力を現し
  rationale: 直訳的な「力を行った」ではなく、神が力を発揮したことを表すギリシア語の連語として、自然な日本語にした。
- source_word: ἐν βραχίονι αὐτοῦ
  choice: その御腕で
  rationale: ἐνを手段と取り、旧約聖書を響かせる神の「腕」という比喩を保った。敬意を示す自然な表記として「御腕」とした。
- source_word: διεσκόρπισεν
  choice: 散らされた
  rationale: 人々を分散させるという動詞の具体的な像を保ちつつ、神を主語とする文にふさわしい敬語表現にした。
- source_word: ὑπερηφάνους
  choice: おごり高ぶる者たち
  rationale: 実体詞的な複数形容詞であり、単なる自尊ではなく傲慢さを表すため、「おごり高ぶる者たち」とした。
- source_word: διανοίᾳ καρδίας αὐτῶν
  choice: 心の思いの
  rationale: 「心」を思考・意志を含む内面の中心として残し、διάνοιαとの重なりも「心の思い」という聖書的で理解可能な表現にした。構文上の関係には複数の可能性があるため脚注を付した。
theological_decisions:
- issue: マリアの歌におけるアオリストの訳し方
  choice: 日本語では完了を明示せず、「現し」「散らされた」と過去の決定的行為として訳す
  alternative: 「力を現されたことがある」「すでに散らされた」など、完了・継続的意義を明示する
  rationale: 日本語には英語の現在完了に直接対応する形式がなく、文脈上は神の決定的な行為を述べる詩的な過去として自然に訳す。預言的・総括的な響きを限定しすぎない。
- issue: διανοίᾳ καρδίας αὐτῶν の統語関係
  choice: 高ぶりが内面の思いにある者たち、と結び付ける
  alternative: 神が彼らをその心の企てによって散らした、と手段的に取る
  rationale: 「心の思いにおいておごり高ぶる者」という理解は自然だが、ἐνの省略を補うような与格の手段的理解も可能なので、本文で一義的に解消せず脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら、賛歌にふさわしい品位を保った。「御腕」は旧約的な比喩と神への敬意を保つ。主語の「主」は直前の文脈から補った。脚注記号は該当する節末に置いた。
