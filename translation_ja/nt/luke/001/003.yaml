id: LUK.1.3
reference: Luke 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔδοξε κἀμοὶ παρηκολουθηκότι ἄνωθεν πᾶσιν ἀκριβῶς καθεξῆς σοι γράψαι, κράτιστε Θεόφιλε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/003.yaml
  text: it seemed good to me also[a], having followed all things closely from the beginning, to write them to you in orderly sequence, most excellent Theophilus[b],
translation:
  language: ja
  text: そこで、すべてのことを初めから詳しくたどった[a]私も、それを順序立てて[b]あなたに書くのがよいと考えました。尊敬するテオフィロ様。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべてのことを初めから注意深く調べた私も」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「順に」とも訳せる。この表現は、厳密な年代順ではなく、秩序ある構成を指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔδοξε κἀμοὶ
  choice: 私も…書くのがよいと考えました
  rationale: 熟慮した上での判断を表す慣用句として訳し、καίによる先行する著述者とのつながりも「私も」で保持した。
- source_word: παρηκολουθηκότι
  choice: 詳しくたどった
  rationale: 出来事を綿密に追跡し把握したという意味を自然な日本語で表しつつ、「調査した」に限定しないようにした。
- source_word: ἄνωθεν
  choice: 初めから
  rationale: この歴史叙述的文脈では、出来事の起点からという時間的意味が最も自然である。
- source_word: πᾶσιν ἀκριβῶς
  choice: すべてのことを…詳しく
  rationale: 対象の包括性と、注意深く正確に追ったことの双方を簡潔に表した。
- source_word: καθεξῆς
  choice: 順序立てて
  rationale: 秩序ある配列を表しながら、厳密な年代順とまでは断定しない表現を選んだ。
- source_word: κράτιστε Θεόφιλε
  choice: 尊敬するテオフィロ様
  rationale: κράτιστεの正式な敬称としての性格を、現代日本語で自然かつ丁重な呼びかけにした。
theological_decisions:
- issue: καθεξῆςが示す歴史的配列の性質
  choice: 順序立てて
  alternative: 年代順に
  rationale: 語は連続性または秩序ある構成を示し得るが、厳密な年代順を必ず意味するわけではないため、その曖昧さを保った。
translation_notes:
  register: ルカの序文にふさわしい端正で丁重な文体を保ちつつ、一般の現代日本語読者に明瞭な表現とした。脚注記号は、それぞれが関係する語句の直後に置くのが望ましい。
