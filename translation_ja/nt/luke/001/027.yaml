  text: πρὸς παρθένον ⸀ἐμνηστευμένην ἀνδρὶ ᾧ ὄνομα Ἰωσὴφ ἐξ οἴκου Δαυίδ, καὶ τὸ ὄνομα τῆς παρθένου Μαριάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/027.yaml
  text: to a virgin pledged in marriage to a man whose name was Joseph, from the house of David; and the virgin’s name was Mary.
translation:
  language: ja
  text: 御使いは、ダビデの家に属するヨセフという人と婚約していた[a]処女のもとへ遣わされた。その処女の名はマリア[b]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「婚約」は、当時の婚姻に先立つ正式で拘束力のある関係を指す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の形により近く音写すれば「マリアム」。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρθένον / παρθένου
  choice: 処女
  rationale: この語の通常の意味とルカの文脈を明確に表し、同じ節での反復も保つため。
- source_word: ἐμνηστευμένην
  choice: 婚約していた
  rationale: 婚姻に先立つ正式な拘束関係に置かれていたことを、現代日本語で自然に示す。完了分詞が表す継続中の状態も「していた」で伝える。
- source_word: ἀνδρὶ
  choice: 人
  rationale: ここではヨセフを婚約相手として紹介しているため、「夫」として婚姻の段階を先取りせず、日本語として自然な「人」とする。
- source_word: ᾧ ὄνομα Ἰωσὴφ
  choice: ヨセフという
  rationale: ギリシア語の命名表現を、意味を損なわない自然な日本語にする。
- source_word: ἐξ οἴκου Δαυίδ
  choice: ダビデの家に属する
  rationale: 「家」という聖書的・王朝的表現を保ちつつ、ヨセフへの修飾関係を日本語で明確にする。
- source_word: Μαριάμ
  choice: マリア
  rationale: 日本語聖書と一般用法で定着した人名表記を採用する。
theological_decisions:
- issue: παρθένοςの処女性を訳文に明示するか
  choice: 処女
  alternative: 若い女性
  rationale: 語の通常の意味、節内での反復、ルカの直近の文脈はいずれも「処女」を支持する。本文以上の教理を加えずに語義を明確に保つ。
- issue: ἐξ οἴκου Δαυίδが誰を修飾するか
  choice: ヨセフがダビデの家に属することを明示
  alternative: 処女マリアがダビデの家に属すると読む余地を残す語順
  rationale: ギリシア語ではこの句が直前のヨセフを指すのが自然であり、日本語でもその統語関係を明確にした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「処女」「ダビデの家」など本文の重要な反復と聖書的表現を保持した。「遣わされた」は前節から続くギリシア語の文を、日本語の節単位でも読めるよう補っている。
