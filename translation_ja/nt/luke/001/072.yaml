  text: ποιῆσαι ἔλεος μετὰ τῶν πατέρων ἡμῶν καὶ μνησθῆναι διαθήκης ἁγίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/072.yaml
  text: to show mercy to our fathers and to remember his holy covenant[c][b][a],
translation:
  language: ja
  text: 私たちの父祖に憐れみを示し[a]、ご自分の聖なる契約を思い起こすためである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私たちの父祖と共に、憐れみを行い」。ここで「父祖」はイスラエルの先祖、特に族長たちを指す。別訳「私たちの先祖に憐れみを示し」。
    reason: lexical_alternative
  - marker: b
    text: 聖書の契約の言葉遣いで、神が契約を「思い起こす」ことは、単に記憶するだけでなく、以前の約束に忠実に行動することを含む場合が多い。
    reason: cultural_note
lexical_decisions:
- source_word: ποιῆσαι ἔλεος
  choice: あわれみを示し
  rationale: ποιεῖν ἔλεος は直訳的な「憐れみを行う」ではなく、「あわれみを示す」という慣用的意味を持つ。日本語として自然にしつつ、ἔλεος の意味を保った。
- source_word: μετὰ τῶν πατέρων ἡμῶν
  choice: 私たちの父祖に
  rationale: μετά＋属格は字義的には「～と共に」だが、この表現では父祖との関係においてあわれみを施すことを示す。「父祖」はイスラエルの先祖、とりわけ族長たちを想起させる簡潔で格調ある表現である。
- source_word: μνησθῆναι
  choice: 心に留める
  rationale: 単なる想起に限定されない「覚える」の契約的含意を自然な現代日本語で表す。一方、「実現する」とまでは訳さず、原文の表現上の緊張を保った。
- source_word: διαθήκης ἁγίας αὐτοῦ
  choice: ご自分の聖なる契約
  rationale: διαθήκη はこの救済史的文脈では「契約」。αὐτοῦ は神を指す再帰的な関係が日本語で明瞭になるよう「ご自分の」とした。
theological_decisions:
- issue: 神が契約を「覚える」こと
  choice: ご自分の聖なる契約を心に留める
  alternative: ご自分の聖なる契約を果たす
  rationale: 聖書の契約用語では、神が「覚える」ことは約束に忠実に行動することを含意しうるが、原文は「果たす」と明言しないため、その含意を本文で確定しなかった。
- issue: πατέρων ἡμῶν の指示対象
  choice: 私たちの父祖
  alternative: 私たちの先祖
  rationale: イスラエルの先祖、特に族長たちという男性形と契約史的響きを保つため「父祖」とした。
translation_notes:
  register: 明瞭な現代標準語を基調とし、「父祖」「聖なる契約」によって本文の契約史的な格調を保った。節が前文から続く目的表現であるため、末尾を「ためである」とした。
