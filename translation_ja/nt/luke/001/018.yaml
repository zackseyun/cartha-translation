id: LUK.1.18
reference: Luke 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν Ζαχαρίας πρὸς τὸν ἄγγελον· Κατὰ τί γνώσομαι τοῦτο; ἐγὼ γάρ εἰμι πρεσβύτης καὶ ἡ γυνή μου προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/018.yaml
  text: And Zechariah said to the angel[a], “How will I know this? For I am an old man, and my wife is advanced in her days.”
translation:
  language: ja
  text: ザカリヤは天使に言った。「何を根拠に、このことを知るのでしょうか。私は年老いており、妻も高齢です[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「妻も自分の日々において進んでいます」。高齢であることを表す慣用句。
    reason: 本文の「高齢です」が、原文の「日々において進んでいる」という比喩的慣用表現を自然に訳したものであることを示すため。
lexical_decisions:
- source_word: εἶπεν
  choice: 言った
  rationale: 物語の中で発言を導く標準的な動詞であり、現代日本語として自然かつ簡潔である。
- source_word: πρὸς τὸν ἄγγελον
  choice: 御使いに
  rationale: 発話動詞とともに用いられた πρός は相手を示す。「御使い」は、この文脈で天的な使者を指す ἄγγελος の明確で品位ある訳語である。
- source_word: Κατὰ τί
  choice: 何によって
  rationale: その知らせが真実だと知るための根拠または手段を尋ねる表現である。単に「どうして」とすると理由を尋ねる意味にも取れるため、「何によって」として問いの焦点を保った。
- source_word: γνώσομαι
  choice: 分かるのでしょうか
  rationale: 未来形が示す、今後確かに知るに至ることを自然な日本語で表す。「知ることができる」は能力の意味を強めるため避けた。
- source_word: τοῦτο
  choice: そのこと
  rationale: 御使いが直前に告げた内容を受ける指示語であり、日本語では「そのこと」が自然である。
- source_word: πρεσβύτης
  choice: 年老いており
  rationale: 役職としての長老ではなく、高齢の男性であることを表す。日本語では述語として自然になるよう「私は年老いており」とした。
- source_word: ἡ γυνή μου
  choice: 妻も
  rationale: 所有表現を伴い、文脈上は一般的な「女」ではなく配偶者を指す。καί は、ザカリヤ自身に加えて妻も高齢であることを示すため「も」とした。
- source_word: προβεβηκυῖα ἐν ταῖς ἡμέραις αὐτῆς
  choice: 年を重ねています
  rationale: 直訳的には「自分の日々において進んでいる」という高齢を表す慣用句である。原文の「日々を進む」という像と自然な現代日本語の両方を考慮し、「年を重ねています」とした。
theological_decisions:
- issue: ἄγγελος の訳し分け
  choice: 御使い
  alternative: 使者
  rationale: ἄγγελος は一般に「使者」とも訳せるが、この場面ではガブリエルという天的存在を指すことが直近の文脈から明らかである。「御使い」はその指示対象を過不足なく示す。
- issue: ザカリヤの問いの性質
  choice: 何によって、そのことが分かるのでしょうか
  alternative: どうすれば信じられるでしょうか
  rationale: 原文は知るための根拠・手段を問うが、「信じる」という語は明示していない。後続文脈から不信の含みを読み取ることはできても、ここではそれを訳文に加えず、問いの表現を保持した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文にふさわしい落ち着いた語調と敬意を保った。御使いに対する問いには丁寧体を用い、地の文は簡潔な常体とした。
