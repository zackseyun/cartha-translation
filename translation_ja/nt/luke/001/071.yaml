  text: salvation from our enemies and from the hand of all who hate us,[a]
translation:
  language: ja
  text: 私たちの敵から、また私たちを憎むすべての者の手からの救い。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの敵から、また私たちを憎むすべての者の力からの解放。」
    reason: 「救い」は「解放」とも訳せ、「手」は慣用的に「力」または「支配」を意味し得るため。
lexical_decisions:
- source_word: σωτηρίαν
  choice: 救い
  rationale: 敵対者から救い出される具体的意味と、ルカ福音書における広い救済的意味の双方を保つ。
- source_word: ἐξ ἐχθρῶν ἡμῶν
  choice: 私たちの敵から
  rationale: ἐξの分離・離脱の意味を自然に表し、原文に明示されない「力」を本文へ補わない。
- source_word: ἐκ χειρὸς
  choice: 手から
  rationale: 支配や力を表す聖書的慣用句を保持し、旧約聖書ギリシア語訳を思わせる響きも残す。
- source_word: πάντων τῶν μισούντων ἡμᾶς
  choice: 私たちを憎むすべての者
  rationale: 実体詞的な現在分詞の継続的・特徴的意味を、自然で明瞭な現代日本語で表す。
- source_word: καὶ
  choice: また
  rationale: 二つの前置詞句を並列する働きを明確かつ自然に示す。
theological_decisions:
- issue: ゼカリヤの預言における救いの性質
  choice: 敵対者からの具体的解放と、より広い救済的意味の両方を含み得る「救い」とする。
  alternative: 政治的・民族的解放だけに限定する、または罪からの霊的救済だけに限定する。
  rationale: この節は敵と憎む者を明示する一方、ルカ1章全体では「救い」がより広い贖いの意味も帯びるため、その緊張を解消せずに保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「手から」という聖書的比喩は本文に残し、意味を脚注で示した。文脈上、前節から続く名詞句として訳している。
