source:
  edition: SBLGNT
  text: Εὐλογητὸς κύριος ὁ θεὸς τοῦ Ἰσραήλ, ὅτι ἐπεσκέψατο καὶ ἐποίησεν λύτρωσιν τῷ λαῷ αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/068.yaml
  text: Blessed is the Lord, the God of Israel, because he has visited and brought redemption to his people,
translation:
  language: ja
  text: 「イスラエルの神、主は、ほめたたえられますように。主はその民を顧み[a]、その民のために贖いを成し遂げられたからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「訪れ」。ここでは、神が民を心に留め、救うために働かれることを表す聖書的な言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: ほめたたえられますように
  rationale: 神への頌栄を表す述語形容詞。直訳的な「祝福された」は現代日本語では意味が伝わりにくいため、祈願的な賛美の定型として自然に表した。
- source_word: κύριος ὁ θεὸς τοῦ Ἰσραήλ
  choice: イスラエルの神である主
  rationale: κύριοςを神の称号「主」とし、同格の「イスラエルの神」を自然な現代日本語で結んだ。旧約聖書的な賛美の響きも保つ。
- source_word: ὅτι
  choice: （句点で受けて理由・根拠を示す）
  rationale: 頌栄に続く神の行為を日本語では独立した文として示す方が自然であり、その行為が賛美の根拠である関係は文脈上明瞭である。
- source_word: ἐπεσκέψατο
  choice: 顧み
  rationale: 単なる訪問ではなく、神が民に目を留めて救いのために介入する聖書的用法を簡潔に表す。「訪れ」は字義的だが、現代日本語では意図された含意が弱くなりうるため脚注で示す。
- source_word: ἐποίησεν λύτρωσιν
  choice: 贖いをもたらしてくださった
  rationale: 字義的な「贖いを行った」より自然で、λύτρωσιςの救出・解放と贖いの重みを保つ。敬語補助動詞により、神を賛美する発話として自然にした。
- source_word: τῷ λαῷ αὐτοῦ
  choice: その民を／（贖いの受益者として）その民に
  rationale: ギリシア語では与格がἐποίησεν λύτρωσινの受益者を示しうる。日本語では共有される「その民」を前の動詞の目的語として置き、後続の贖いも同じ民に及ぶことが自然に理解される構文とした。
theological_decisions:
- issue: 神の訪れを表すἐπισκέπτομαιの救済的含意
  choice: 顧み
  alternative: 訪れ／助けに来て
  rationale: 神が注意を向け、実際に救済へ介入するという聖書的緊張を、「助けに来て」と説明し切らずに保った。字義的表現は脚注で明示する。
- issue: λύτρωσιςの意味範囲
  choice: 贖い
  alternative: 救い／解放
  rationale: 救出・解放の意味を含みつつ、贖いに関わる語彙上の重みを保持するため「贖い」とした。特定の贖罪理論までは訳文に持ち込まない。
- issue: 預言的完了としてのアオリスト
  choice: もたらしてくださった
  alternative: もたらしてくださる
  rationale: 原文の過去形を保持し、救済の確実性を未来形へ解釈し直さない。物語上すでに始まった神の介入として読める余地も残す。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、ザカリヤの賛歌にふさわしい格調を保った。「ほめたたえられますように」は頌栄の調子を示し、「くださった」は日本語の神への賛美として自然な敬意を添える。脚注記号[a]は対応語「顧み」の直後に置いた。
