  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν, τῷ Ἀβραὰμ καὶ τῷ σπέρματι αὐτοῦ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/055.yaml
  text: just as he spoke to our fathers[b][a], to Abraham and to his offspring forever.
translation:
  language: ja
  text: 私たちの父祖[a]に語られたとおり、アブラハムとその子孫[b]に対して、永遠に。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「私たちの父たち」。文脈上、イスラエルの父祖・先祖を指します。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「その種」。ギリシア語は単数形の集合名詞で、「子孫」全体を指すことができます。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ～とおりに
  rationale: 先行する内容と、かつて語られた約束との対応を自然な日本語で示す。
- source_word: ἐλάλησεν πρὸς τοὺς πατέρας ἡμῶν
  choice: 私たちの父祖に……語られた
  rationale: 「父祖」は、直訳的な「私たちの父たち」より自然でありながら、イスラエルの契約史における先祖を指す男性複数形の響きを保つ。神を主語とする能動形は文脈上明らかだが、日本語では受動形にして主語の補足を避けた。
- source_word: τῷ Ἀβραὰμ
  choice: アブラハムと
  rationale: 「父祖」を具体化する同格関係が伝わるよう、後続の「その子孫」と並列した。
- source_word: τῷ σπέρματι αὐτοῦ
  choice: その子孫
  rationale: σπέρμαは単数形の集合名詞である。「子孫」は現代日本語として自然で、アブラハムから続く一群を集合的に表せる。字義的な「種」は脚注に残した。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に及ぶものとして
  rationale: 単に「永遠に語られた」とすると、語る行為が永続するとの誤解を招くため、先行節の約束・憐れみが永続する趣旨を示す表現とした。
theological_decisions:
- issue: 「父祖」とアブラハムおよびその子孫との関係
  choice: 読点を用いて同格的な関係を保つ
  alternative: 「父祖、すなわちアブラハムとその子孫に」
  rationale: ギリシア語では後半が前半を具体化すると読めるが、「すなわち」を補うと関係を必要以上に限定するため、原文同様に並置した。
- issue: σπέρμαの契約的含意
  choice: 子孫
  alternative: 種
  rationale: 「子孫」は集合的意味を自然に伝える一方、単数集合名詞の形と聖書間の語彙的響きは弱くなる。そのため「種」を脚注に示し、解釈可能性を閉ざさない。
- issue: εἰς τὸν αἰῶναの係り先
  choice: 約束された内容が永遠に及ぶとの理解を本文に反映
  alternative: 「アブラハムとその子孫に、永遠に語られたとおりに」
  rationale: 語順上は「その子孫」と近接するが、文脈では神の憐れみと約束の永続性を表すと理解するのが自然である。ただしギリシア語の簡潔な構造が持つ係り方の余地を過度に教義化しない表現にした。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「父祖」と「永遠」によって聖書本文としての品位と契約史的な響きを保った。節が前節から続く従属句であることを、文末の「とおりに」でそのまま示している。
