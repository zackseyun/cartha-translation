  text: the oath that he swore to Abraham our father[a], to grant to us
translation:
  language: ja
  text: 私たちの父アブラハムに誓われた誓い、すなわち、私たちに授けてくださるということです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちの祖先アブラハム」とも訳せる。ギリシア語は直訳すると「私たちの父アブラハム」で、アブラハムを指す聖書の父祖表現を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅρκον
  choice: 誓い
  rationale: 前節から続く目的格で、特定の誓いを指す。日本語では文脈上、冠詞に相当する語を加えず「誓い」とした。
- source_word: ὃν ὤμοσεν
  choice: 誓われた
  rationale: 関係節を自然な日本語に組み替えつつ、ὅρκονとὤμοσενの語根上の響きを「誓い／誓われた」で保った。主語は前文脈の神であり、敬意を表す受身形で示した。
- source_word: πρὸς Ἀβραὰμ
  choice: アブラハムに
  rationale: 誓いが向けられた相手を表すπρόςを、簡潔で自然な「に」と訳した。
- source_word: τὸν πατέρα ἡμῶν
  choice: 私たちの父アブラハム
  rationale: 字義的かつ契約的な聖書表現である「父」を保持した。日本語として自然になるよう同格関係の語順を整えた。
- source_word: τοῦ δοῦναι ἡμῖν
  choice: 私たちに授けると
  rationale: 属格付き不定詞は誓いの内容または目的・結果を導く。次節に内容が続くため、「授けると」として未完の構文を保った。δοῦναιは賛歌の格調に合わせて「授ける」とした。
theological_decisions:
- issue: アブラハムに関する契約的な父祖表現
  choice: 私たちの父アブラハム
  alternative: 私たちの祖先アブラハム
  rationale: 「父」は原文のπατήρを直接反映し、アブラハムをめぐる聖書の契約的・共同体的な言い回しを保つ。「祖先」も意味上可能だが、この響きを弱める。
- issue: τοῦ δοῦναιの統語的関係
  choice: 誓いの内容を導く「私たちに授けると」
  alternative: 目的・結果を明示する「私たちに授けるためである」
  rationale: この不定詞は誓いの内容と目的・結果の双方に開かれているため、日本語でも一方に限定しすぎず、次節へ続く形にした。
translation_notes:
  register: ザカリアの賛歌にふさわしい格調を保ちつつ、現代の読者に通じる標準的な日本語とした。この節は前後にまたがる文の一部なので、「授けると」で次節への連続性を示した。
