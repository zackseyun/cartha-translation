review_pass:
  verdict: revise
  source_fidelity: 原文は「アブラハムに立てられた誓い」ではなく、「アブラハムに誓った誓い」であり、ὤμοσεν（彼〔神〕が誓った）を「授けると誓われた」とする現行訳は、誓いを修飾する関係節と後続するτοῦ δοῦναι（与えること）との関係を不正確にしている。τοῦ δοῦναιは次節に続く内容を伴うため、その連続性を保つ必要がある。
  naturalness: 現行の「誓い、私たちに授けると誓われたことです」は「誓い」と「誓われたこと」が重複し、何を授けるのかも不自然に未完である。「誓われた誓い、すなわち」とすると、原文の反復を保ちつつ現代標準日本語としても読める。
  terminology: 「私たちの父アブラハム」はπατέρα ἡμῶνを直接反映し、聖書的な共同体表現として維持できる。脚注の「契約的な」は原文の語彙自体を説明するというより解釈的なので、「聖書で用いられる父祖表現」としてより中立にする。δοῦναιには「授ける」を用い、神を指す文脈に沿って「くださる」とする。
  issues:
  - severity: high
    issue: 「私たちに授けると誓われたことです」は統語関係を取り違えている。
    rationale: ὃν ὤμοσενはὅρκονを修飾し、「〔神が〕誓った誓い」を意味する。τοῦ δοῦναιは別に続く不定詞であり、「授けると誓われた」と一まとまりにすることはできない。
  - severity: medium
    issue: 「立てられた誓い」はπρὸς Ἀβραὰμの方向性を十分に表さない。
    rationale: πρόςはここで誓いの相手を示すため、「アブラハムに誓われた」と明示するのが適切である。
  - severity: medium
    issue: 脚注の「契約的な言い回し」は説明としてやや解釈的である。
    rationale: 「父」は字義的に保持でき、脚注では「父祖」という聖書的用法を示すにとどめるほうが中立的である。
  revised_text: 私たちの父アブラハムに誓われた誓い、すなわち、私たちに授けてくださるということです。[a]
