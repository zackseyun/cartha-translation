  text: καὶ τὸ ἔλεος αὐτοῦ εἰς γενεὰς ⸂καὶ γενεὰς⸃ τοῖς φοβουμένοις αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/050.yaml
  text: And his mercy is for those who fear him from generation to generation[a][b][c].
translation:
  language: ja
  text: また、そのあわれみは、神を恐れる者たちに、代々にわたって及びます。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語を直訳すると「世代へ、また世代へ」。神のあわれみが相次ぐ世代に及ぶことを表します。別訳「世代から世代へ」。
    reason: lexical_alternative
  - marker: b
    text: 「神を恐れる」とは、単におびえることだけでなく、神への畏敬をもって生きることを含みます。別訳「神を畏れる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεος
  choice: あわれみ
  rationale: 困窮する者に示される慈しみ、同情、恵みを表す語。ここではマリアの賛歌の響きに合い、意味を過度に限定しない「あわれみ」とした。
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: 代々にわたって
  rationale: 直訳的には「幾つもの世代へ」で、神のあわれみが相次ぐ世代に及ぶことを表す。現代日本語として自然な「代々にわたって」がこの継続性をよく伝える。
- source_word: τοῖς φοβουμένοις αὐτόν
  choice: 神を恐れる者たちに
  rationale: 神に対するφοβέομαιは、単なる恐怖だけでなく、畏敬をもって神に向き合うことを表し得る。「恐れる」を残して原文の強さと聖書的な含みを保ち、代名詞の指示対象は文脈上明白な「神」とした。
- source_word: καὶ
  choice: また
  rationale: 前節までの賛歌にこの行を結び付ける接続詞。日本語の詩的な積み重ねとして自然な「また」とした。
- source_word: αὐτοῦ / αὐτόν
  choice: その／神を
  rationale: いずれも直前の文脈における神を指す。所有は自然な「その」で受け、目的語では日本語で指示対象が曖昧にならないよう「神」と明示した。
theological_decisions:
- issue: 神を「恐れる」の意味
  choice: 本文では「神を恐れる」とし、恐れと畏敬の両方を含み得る表現を保った。
  alternative: 神を敬う／神を畏れる
  rationale: 神が目的語である場合、この語は敬虔な畏敬を指すことが多い。しかし「敬う」だけでは原語の恐れの要素を弱め、「畏れる」だけでは解釈を一方向に定めやすいため、本文では「恐れる」を用い、注で含意を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、マリアの賛歌にふさわしい簡潔で格調ある調子を保った。「あわれみ」「恐れる」という聖書的な語を残し、必要な意味の幅は脚注で補った。
