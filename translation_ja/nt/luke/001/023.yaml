    rationale: 文化注は「務め」、語彙注は「自分の家」に対応するため、それぞれの語句の直後に置く必要がある。
  - severity: low
    issue: 「その務めの日々」がやや不自然である。
    rationale: 原文は奉仕に割り当てられた日数・期間が満ちたことをいうため、「祭司の務めの期間」のほうが自然で明確である。
  - severity: low
    issue: 家についての脚注が、この文脈での目的地の意味を超えて「家庭や家の者」まで強調している。
    rationale: οἶκοςには広い語義があるが、εἰς τὸν οἶκον αὐτοῦ はここでは家・自宅へ行くことを指す。脚注はこの文脈に即した代替表現を示すのが適切である。
