  text: καὶ ἐγένετο ὡς ἐπλήσθησαν αἱ ἡμέραι τῆς λειτουργίας αὐτοῦ, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/023.yaml
  text: And it happened that when the days of his service were completed[b][a], he went to his home.
translation:
  language: ja
  text: 祭司の務め[b]の期間が終わると、彼は自分の家[a]に帰った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の家」は「自宅」とも訳せる。ギリシア語は建物としての家、またはより広く住まいを指しうる。
    reason: lexical_alternative
  - marker: b
    text: 「務め」とは、ゼカリヤに割り当てられた神殿での祭司の奉仕を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἐγένετο
  choice: （独立した語としては訳出しない）
  rationale: ルカに特徴的な物語進行の定型句。ここでは後続の時間節と主節を自然につなぐ日本語の構文によってその談話機能を表した。
- source_word: ὡς
  choice: 〜すると
  rationale: 時間を示す接続表現。務めの期間が終わった時点で帰宅したという流れを、明瞭で自然な日本語にした。
- source_word: ἐπλήσθησαν αἱ ἡμέραι
  choice: 日々が終わる
  rationale: 割り当てられた期間が満了することを表す。字義に近い「日々が満ちる」より、現代日本語で意味が明確な表現を選んだ。
- source_word: λειτουργίας
  choice: 務め
  rationale: 文脈上、祭司として割り当てられた神殿での奉仕を指す。本文では簡潔に訳し、文化的背景を脚注で明示した。
- source_word: ἀπῆλθεν
  choice: 帰った
  rationale: 直訳的には「去った」だが、行き先が自分の家であるため、日本語では「帰った」が自然であり、移動の意味を過不足なく伝える。
- source_word: εἰς τὸν οἶκον αὐτοῦ
  choice: 自分の家に
  rationale: οἶκοςは建物としての家だけでなく、家庭・住まいも指し得る。本文では自然な「家」を用い、その語義の幅を脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準語を用い、簡潔ながら品位のある物語文とした。原文の定型句 καὶ ἐγένετο は、日本語で不自然な「そして、起こった」を避け、時間節から主節への構文に吸収した。脚注記号は対応する語句の直後に置いた。
