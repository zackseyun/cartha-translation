  text: And Zechariah was troubled when he saw him[a], and fear fell upon him.
translation:
  language: ja
  text: ザカリヤは彼を見て[a]動揺し、恐れが彼を襲った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「見て」。原文には目的語が明示されていないが、文脈上は前節の御使いを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐταράχθη
  choice: 動揺し
  rationale: 内面をかき乱され、心が騒ぐことを表す受動形。続く「恐れ」と区別しつつ、心理的な揺れを自然な現代日本語で示す。
- source_word: Ζαχαρίας
  choice: ザカリヤ
  rationale: 日本語の聖書で広く定着している人名表記を用いる。
- source_word: ἰδών
  choice: 彼を見て
  rationale: アオリスト分詞の時間的な関係を自然に表す。目的語は原文に明示されていないが、直前の文脈では御使いを指す。
- source_word: φόβος
  choice: 恐れ
  rationale: 語の基本的な意味を保ち、「恐怖」などによって強さを不必要に限定しない。
- source_word: ἐπέπεσεν ἐπ’ αὐτόν
  choice: 彼を襲った
  rationale: 直訳的には「彼の上に降りかかった」。突然その人を圧倒するという比喩を、明瞭で自然な日本語で表す。
