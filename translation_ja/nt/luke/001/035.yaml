id: LUK.1.35
reference: Luke 1:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ· Πνεῦμα ἅγιον ἐπελεύσεται ἐπὶ σέ, καὶ δύναμις Ὑψίστου ἐπισκιάσει σοι· διὸ καὶ τὸ γεννώμενον ἅγιον κληθήσεται, υἱὸς θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/035.yaml
  text: And the angel answered and said to her[a], “The Holy Spirit will come upon you, and the power of the Most High will overshadow you[b]; therefore also the holy one being born will be called the Son of God.”
translation:
  language: ja
  text: 御使いは彼女に答えた。「聖霊があなたの上に臨み、いと高き方の力があなたを影で覆うでしょう。それゆえ、生まれる者[a]は聖なる者、神の子[b]と呼ばれます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「生まれる子」。ギリシア語は字義的には「生まれる者」または「生まれつつあるもの」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の「神の子」には定冠詞がないが、この文脈では不定の「神の一人の子」ではなく、称号として用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῇ
  choice: 御使いは彼女に答えた
  rationale: 「答えて言った」というギリシア語の定型的な言い回しを、応答の意味を保ちながら自然な現代日本語にした。ἄγγελος は文脈上、天的存在を指すため「御使い」とした。
- source_word: Πνεῦμα ἅγιον
  choice: 聖霊
  rationale: この文脈では神の霊を指す定着した呼称であり、単なる力や性質を意味する表現にはしない。
- source_word: ἐπελεύσεται ἐπὶ σέ
  choice: あなたの上に臨み
  rationale: ἐπί の方向性と、神的な働きが人に及ぶ意味を保つ。「臨む」は明瞭でありつつ格調もある。
- source_word: δύναμις Ὑψίστου
  choice: いと高き方の力
  rationale: Ὕψιστος を神への称号として訳し、属格関係もそのまま明示した。
- source_word: ἐπισκιάσει σοι
  choice: あなたを覆います
  rationale: 影で覆うという語の比喩を自然な日本語で保ち、本文が述べていない生物学的・性的な説明を加えない。
- source_word: διὸ καὶ
  choice: それゆえ
  rationale: 結果・帰結を示す διό を明確に表した。καί の含意は文脈上この帰結全体に反映されるため、日本語では不自然な「また」を加えなかった。
- source_word: τὸ γεννώμενον
  choice: 生まれる者
  rationale: 現在受動分詞の表現を簡潔に保ち、胎児か出生後の子かを訳文で過度に限定しない。
- source_word: ἅγιον κληθήσεται
  choice: 聖なる者……と呼ばれます
  rationale: ἅγιον を κληθήσεται の補語として読めるギリシア語の形を保ち、子の聖さを明示した。
- source_word: υἱὸς θεοῦ
  choice: 神の子
  rationale: 冠詞のない表現だが、この文脈では不定の一例ではなく称号・身分を示す。「神の子」は日本語で自然な定訳である。
theological_decisions:
- issue: Πνεῦμα ἅγιον の主体性
  choice: 聖霊
  alternative: 聖なる霊／聖なる息
  rationale: ルカの文脈では受胎に働く神の霊を指す。人格性を過剰に説明せず、同時に単なる非人格的な力へ還元しない訳語を選んだ。
- issue: 神の働きの描写
  choice: あなたを覆います
  alternative: あなたを包みます
  rationale: ἐπισκιάζω の覆うイメージと神的臨在の含みを保ち、受胎の仕組みについて原文にない説明を加えない。
- issue: ἅγιον と υἱὸς θεοῦ の統語関係
  choice: 生まれる者は聖なる者、神の子と呼ばれます
  alternative: 生まれる聖なる者は神の子と呼ばれます
  rationale: ギリシア語は句読法と統語の取り方に一定の幅がある。採用訳は ἅγιον と υἱὸς θεοῦ の双方を κληθήσεται に関係させる読みを自然な日本語で示しつつ、「聖なる者」を単なる限定修飾に固定しない。
- issue: υἱὸς θεοῦ の定性
  choice: 神の子
  alternative: 神の一人の子
  rationale: ギリシア語に冠詞はないが、不定性を必然的に意味しない。この告知の文脈では称号として機能するため、不定の一員であるかのような語を補わない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神的称号には「いと高き方」、天的存在には「御使い」を用いて聖書本文としての品位を保った。文末はマリアへの直接の語りかけに合う丁寧体とした。脚注記号 [a] と [b] は、それぞれ説明対象の語句の直後に配置した。
