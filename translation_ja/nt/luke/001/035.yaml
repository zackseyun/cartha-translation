revisions:
- from: 御使いは彼女に答えた。「聖霊があなたの上に臨み、いと高き方の力があなたを覆います。それゆえ、生まれる者[a]は聖なる者、神の子[b]と呼ばれます。」
  to: 御使いは彼女に答えた。「聖霊があなたの上に臨み、いと高き方の力があなたを影で覆うでしょう。それゆえ、生まれる者[a]は聖なる者、神の子[b]と呼ばれます。」
  rationale: 本文は原則として維持し、ἐπισκιάσει の『影』の比喩を明示した。脚注bはギリシア語の冠詞に関する説明対象を正確にするため、「子」から「神の子」へ修正した。いずれも本文の意味や神学的含意を追加・変更しない最小限の修正である。
