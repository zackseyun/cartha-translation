  text: And his mother answered[a], “No; rather, he shall be called John.”
translation:
  language: ja
  text: しかし、彼の母親は答えた。「いいえ、むしろ、この子はヨハネと名づけられます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεῖσα
  choice: 答えた
  rationale: アオリスト分詞だが、日本語では主節と結んで「答えた」とするのが自然であり、発言への応答という機能を明確に表す。
- source_word: ἡ μήτηρ αὐτοῦ
  choice: その母親
  rationale: 直訳的な「彼の母」よりも、この場面で指示対象を自然に示す現代日本語とした。
- source_word: Οὐχί
  choice: いいえ
  rationale: 先の命名案をはっきり退ける強い否定を、対話として自然な形で表す。
- source_word: ἀλλὰ
  choice: この子は
  rationale: ἀλλάの訂正的な対比は、否定の後で新しい命名を明示する日本語の文の切り替えによって表現した。
- source_word: κληθήσεται
  choice: 名づけられます
  rationale: 未来受動形の命名の意味を保ちつつ、文脈上自然で明瞭な日本語にした。単なる呼称より、子の名を定める場面に適する。
- source_word: Ἰωάννης
  choice: ヨハネ
  rationale: 日本語聖書で定着している人名表記を採用した。
