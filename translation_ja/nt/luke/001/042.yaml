id: LUK.1.42
reference: Luke 1:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀνεφώνησεν ⸀κραυγῇ μεγάλῃ καὶ εἶπεν· Εὐλογημένη σὺ ἐν γυναιξίν, καὶ εὐλογημένος ὁ καρπὸς τῆς κοιλίας σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/042.yaml
  text: And she cried out with a loud voice and said[a], “Blessed are you among women, and blessed is the fruit of your womb.”
translation:
  language: ja
  text: そして、彼女は大声で叫んで言った[a]。「あなたは女たちの中で祝福されています。あなたの胎の実も祝福されています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「声高く叫んだ」。
    reason: ἀνεφώνησενとκραυγῇ μεγάλῃの重なりを、日本語で一まとまりの発声表現として訳すこともできるため。
lexical_decisions:
- source_word: ἀνεφώνησεν
  choice: 叫んで
  rationale: 大きな声を発して語ることを表す動詞であり、苦痛ではなく力強い発声であることが文脈から分かるため、「叫んで」とした。
- source_word: κραυγῇ μεγάλῃ
  choice: 大声で
  rationale: 発声の仕方と強さを表す与格句を、自然な現代日本語で表した。
- source_word: Εὐλογημένη
  choice: 祝福されています
  rationale: 完了受動分詞による祝福の宣言を表し、単なる好意や幸福に意味を狭めない訳とした。
- source_word: ἐν γυναιξίν
  choice: 女たちの中で
  rationale: 「すべての」に当たる語を補わず、女性たちの中で際立って祝福されているという比較的・関係的な表現を保った。
- source_word: εὐλογημένος
  choice: 祝福されています
  rationale: 前半と同じ祝福の表現を用い、マリアと胎の実に対する宣言の並行性を保った。
- source_word: ὁ καρπὸς
  choice: 実
  rationale: 子を指すことは明らかだが、原文の「実」という比喩を保った。
- source_word: τῆς κοιλίας σου
  choice: あなたの胎の
  rationale: 妊娠の文脈でκοιλίαは胎を指すため、「胎の実」という簡潔で尊厳ある表現にした。
theological_decisions:
- issue: マリアに向けられた祝福の宣言
  choice: あなたは女たちの中で祝福されています
  alternative: 女たちの中で、あなたは祝福された方です
  rationale: マリアが祝福を受けた者であるという本文の受動的表現を保ちつつ、本文を超える後代の教義的含意を加えないようにした。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、祝福の宣言には簡潔で格調ある調子を用いた。「胎の実」は原文の比喩を保つ聖書的表現だが、文脈上、胎内の子を指すことは十分理解できる。
