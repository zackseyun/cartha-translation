id: LUK.1.6
reference: Luke 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦσαν δὲ δίκαιοι ἀμφότεροι ⸀ἐναντίον τοῦ θεοῦ, πορευόμενοι ἐν πάσαις ταῖς ἐντολαῖς καὶ δικαιώμασιν τοῦ κυρίου ἄμεμπτοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/006.yaml
  text: And both of them were righteous before God[b][a], walking blamelessly in all the commandments and ordinances of the Lord.
translation:
  language: ja
  text: 二人はともに神の前で正しい人であり、主のすべての戒めと定めに従って歩み、非難されるところがなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίκαιοι
  choice: 正しい人
  rationale: 神による評価という文脈で、道徳的・契約的な正しさを自然な現代日本語で表す。単に法的な公正さへ限定しない。
- source_word: ἀμφότεροι
  choice: 二人はともに
  rationale: ザカリアとエリサベトの双方に同じ評価が当てはまるという強調を明示する。
- source_word: ἐναντίον τοῦ θεοῦ
  choice: 神の前で
  rationale: 神の御前および神の評価において、という関係的・評価的意味を簡潔に保つ。
- source_word: πορευόμενοι
  choice: 歩み
  rationale: 生活態度を表す聖書的な歩行の比喩を保持しつつ、現代日本語でも理解可能な表現とする。
- source_word: ἐν πάσαις ταῖς ἐντολαῖς
  choice: すべての戒めに従って
  rationale: πορεύομαι と ἐν の組み合わせが示す、戒めに即した生き方を自然な日本語で表し、πάσαις の包括性も保持する。
- source_word: δικαιώμασιν
  choice: 定め
  rationale: 命令を表す「戒め」と並ぶ、規定・法令という意味を簡潔で格調ある日本語で区別する。
- source_word: τοῦ κυρίου
  choice: 主の
  rationale: イスラエルの神を指すκύριοςを、聖書日本語として定着した「主」で表す。
- source_word: ἄμεμπτοι
  choice: 非難されるところがなかった
  rationale: 形容詞として二人の状態を述べる構文を保ち、絶対的無罪性を訳文に付加せず、非の打ち所のない忠実な生活という強い評価を自然に表す。
- source_word: ἦσαν δὲ
  choice: 二人は…であり
  rationale: δέは弱い叙述上の接続であり、日本語では明示的な接続詞を置かず自然に文脈を継続する。ἦσανの継続的な状態は「であり」で表す。
theological_decisions:
- issue: ἄμεμπτοιが絶対的な無罪・罪なき完全性を意味するか
  choice: 神の戒めと定めに即した生活が非難されるところのないものであった、と訳す。
  alternative: 罪が全くなかった、または完全無欠であった、と解する。
  rationale: 本文は二人の忠実で非難されない歩みを強く肯定するが、形而上学的な罪なき完全性を明言してはいない。強い評価を弱めず、同時に本文以上の教理的限定を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「神の前」「主」「戒め」「定め」「歩み」という聖書的で格調ある語彙を保持した。分詞πορευόμενοιと述語形容詞ἄμεμπτοιの関係は、「従って歩み、非難されるところがなかった」として自然かつ構文的に明確にした。
