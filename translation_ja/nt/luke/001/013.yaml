revisions:
- from: しかし、御使いは彼に言った。「恐れることはない、ザカリヤ。あなたの祈り[a]は聞き入れられた。あなたの妻エリサベトは、あなたに男の子を産む。その子をヨハネと名づけなさい[b]。」
  to: 天使は彼に言った。「恐れないでください、ザカリヤ。あなたの祈り[a]は聞き入れられました。あなたの妻エリサベツは、あなたに男の子を産みます。その子をヨハネと名づけなさい[b]。」
  rationale: 弱い接続詞δέを無訳とし、不必要な逆接を避けました。「御使い」を現代語として明快な「天使」に改め、人名を「ザカリヤ、エリサベツ、ヨハネ」の慣用的な表記系列に統一しました。受動表現「聞き入れられました」は、原文どおり聞き手を明示せず、神的受動の含みを保っています。命名句は原文の未来形が告知において指示として働くことを踏まえ、自然な日本語の「名づけなさい」とし、直訳を脚注に保持しました。
