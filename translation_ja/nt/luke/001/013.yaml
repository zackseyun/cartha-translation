id: LUK.1.13
reference: Luke 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ ἄγγελος· Μὴ φοβοῦ, Ζαχαρία, διότι εἰσηκούσθη ἡ δέησίς σου, καὶ ἡ γυνή σου Ἐλισάβετ γεννήσει υἱόν σοι, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/013.yaml
  text: But the angel said to him[a], “Do not be afraid, Zechariah, because your prayer has been heard, and your wife Elizabeth will bear you a son[b], and you shall call his name John.”
translation:
  language: ja
  text: 天使は彼に言った。「恐れないでください、ザカリヤ。あなたの祈り[a]は聞き入れられました。あなたの妻エリサベツは、あなたに男の子を産みます。その子をヨハネと名づけなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「願い」あるいは「願い求め」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「あなたは彼の名をヨハネと呼ぶ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: しかし、…言った
  rationale: δέは弱い接続辞だが、直前のザカリヤの恐れに対する御使いの応答への移行を示すため、「しかし」とした。強い対立にはしない。
- source_word: ὁ ἄγγελος
  choice: 御使い
  rationale: 文脈上、天から遣わされた存在を指す。現代日本語の聖書文体として分かりやすく、単なる人間の「使者」との混同も避けられる。
- source_word: Μὴ φοβοῦ
  choice: 恐れることはない
  rationale: 恐れているザカリヤに対する禁止・安心の呼びかけ。自然でありながら、告知場面にふさわしい品位を保つ。
- source_word: Ζαχαρία
  choice: ザカリヤ
  rationale: 日本語の新約聖書で広く定着している表記を採用した。
- source_word: διότι
  choice: （後続文で理由を直接提示）
  rationale: 日本語では「恐れることはない」に続けて「あなたの祈りは…」と述べれば理由関係が明瞭であり、「なぜなら」を補わないほうが自然である。
- source_word: εἰσηκούσθη
  choice: 聞き入れられた
  rationale: 単に音として聞かれたのではなく、願いが受け止められたことを表す。受動形を保ち、聞いた主体である神を本文に明示的に補わない。
- source_word: ἡ δέησίς σου
  choice: あなたの祈り
  rationale: 神への切実な願いを表す語で、この文脈では「祈り」が最も自然。「願い」のニュアンスは脚注に残した。
- source_word: ἡ γυνή σου Ἐλισάβετ
  choice: あなたの妻エリサベト
  rationale: 所有表現と夫婦の文脈から γυνή は「妻」を意味する。固有名は日本語で定着した表記とした。
- source_word: γεννήσει υἱόν σοι
  choice: あなたに男の子を産む
  rationale: 女性を主語とする γεννάω の「産む」という意味を明確にし、σοι が示すザカリヤに与えられる子という関係も保った。
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ Ἰωάννην
  choice: その子をヨハネと名づけなさい
  rationale: ギリシア語の命名慣用句を、現代日本語で自然な告知・指示として訳した。直訳的な形は脚注に示した。
- source_word: Ἰωάννην
  choice: ヨハネ
  rationale: 日本語の新約聖書で定着している名称を用いた。
theological_decisions:
- issue: 「聞き入れられた」の受動表現の主体
  choice: 神を暗示する受動表現のまま訳す
  alternative: 「神があなたの祈りを聞き入れた」と主体を明示する
  rationale: 祈りの文脈では神が主体であることが自然に理解されるが、原文は神を明示していないため、訳文でも主体を補わず、その含みを保った。
- issue: καλέσεις の命名指示としての力
  choice: 「名づけなさい」
  alternative: 「名をヨハネと呼ぶことになる」または「名をヨハネとしなければならない」
  rationale: 未来形が告知場面で命名の指示として機能している。日本語では自然な指示形を用いるが、必要以上に義務性を強めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、告知場面にふさわしい簡潔で品位ある調子とした。「御使い」は宗教的文脈で天的存在を自然に示す伝統的表現だが、文全体は古語調にしなかった。脚注記号は対応する語句の直後に配置した。
