  text: καὶ ἔσται χαρά σοι καὶ ἀγαλλίασις, καὶ πολλοὶ ἐπὶ τῇ ⸀γενέσει αὐτοῦ χαρήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/014.yaml
  text: And there will be joy and exultation for you[a], and many will rejoice at his birth.
translation:
  language: ja
  text: あなたには喜びと歓喜があるでしょう。多くの人も、その子の誕生[a]を喜ぶでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その子の誕生のゆえに」。ギリシア語の表現は、誕生が喜びの機会であることも、その理由であることも示し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσται
  choice: あり
  rationale: 未来に実現することを表す文脈に沿い、後続する二つの名詞を簡潔に受ける表現とした。日本語では文末の「でしょう」と節全体の将来性によって未来が明らかになる。
- source_word: χαρά
  choice: 喜び
  rationale: χαράの一般的で自然な訳語であり、現代日本語でも明瞭である。
- source_word: σοι
  choice: あなたには
  rationale: 喜びを経験する当事者を示す与格を、自然な日本語で表した。
- source_word: ἀγαλλίασις
  choice: 歓喜
  rationale: χαράとの語義上の重なりを保ちつつ、より強く祝祭的な喜びを表す語として区別した。
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 実体詞的に用いられた形容詞を、日本語で対象が明確になるように訳した。
- source_word: ἐπὶ τῇ γενέσει αὐτοῦ
  choice: その子の誕生を
  rationale: ἐπί＋与格が示し得る喜びの機会・対象を自然な日本語で表した。「その子」は直前の文脈で告げられた子を指す。原因・根拠の含みは注に残した。
- source_word: χαρήσονται
  choice: 喜ぶでしょう
  rationale: χαίρωの未来形を自然な敬体の未来表現で訳し、χαράとの語根上のつながりも「喜び／喜ぶ」によって保った。
theological_decisions:
- issue: ἔσταιの主語の解釈
  choice: 明示的な主語を補わず、「あなたには喜びと歓喜があり」とした
  alternative: 「その子はあなたにとって喜びと歓喜となり」
  rationale: ギリシア語では主語が明示されず、非人称的に将来の喜びを告げる読みと、前文の子を暗黙の主語とする読みの余地がある。日本語でも主語を補わず、曖昧さを不必要に解消しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語の敬体を用いた。「喜びと歓喜」は意味が近いものの、原文の二語を保ち、後者のより強い祝祭的な響きを伝える。
