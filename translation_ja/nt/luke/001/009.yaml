  text: κατὰ τὸ ἔθος τῆς ἱερατείας ἔλαχε τοῦ θυμιᾶσαι εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/009.yaml
  text: according to the custom of the priesthood[a], he was chosen by lot to burn incense when he entered into the temple of the Lord,
translation:
  language: ja
  text: 祭司職の慣例に従い、彼はくじの結果、主の神殿[a]に入って香をたく務めを受け持つことになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主の聖所」とも訳せる。ギリシア語の「ナオス」は、神殿の境内全体ではなく、神殿の建物そのもの、特に聖所を指すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὸ ἔθος τῆς ἱερατείας
  choice: 祭司職の慣例に従って
  rationale: κατά＋対格は慣例への一致を表し、ἱερατείαは個々の祭司ではなく祭司の職務・制度を指す。「祭司職の慣例」で制度的な意味を保ちつつ、現代日本語として明瞭にした。
- source_word: ἔλαχε
  choice: くじを引いたところ、…役に当たった
  rationale: λαγχάνωが表す、くじによって務めを得るという意味を自然な日本語で明示した。単に「選ばれた」とせず、本人がくじを引き、その結果として役目が割り当てられたという文脈を表した。
- source_word: τοῦ θυμιᾶσαι
  choice: 香をたく役
  rationale: θυμιάωは香をたく、または香をささげる行為を指す。ここではくじで割り当てられた務めの内容として、具体的で分かりやすい「香をたく役」とした。
- source_word: εἰσελθὼν εἰς τὸν ναὸν τοῦ κυρίου
  choice: 主の神殿に入って
  rationale: アオリスト分詞を、香をたく行為に伴う先行動作として自然に接続した。ναόςは神殿域全体より神殿の建物、文脈上は特に聖所を指し得るが、本文では一般読者に明瞭な「神殿」とし、限定的な意味を脚注で示した。
theological_decisions:
- issue: 神殿礼拝の文脈における ναός の訳語
  choice: 神殿
  alternative: 聖所
  rationale: ναόςは広い神殿境内ではなく神殿建物そのものを指すことが多く、香をたく場面では「聖所」が文脈的に有力である。ただし語自体の射程と一般読者への分かりやすさを考慮して本文を「神殿」とし、より限定的な訳を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔ながら礼拝の場面にふさわしい品位を保った。「くじを引いたところ、…役に当たった」により、原文のくじによる選定を自然に表現した。
