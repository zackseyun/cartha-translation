  - severity: low
    issue: 「不妊の女」の語調
    rationale: 原語στείρᾳは女性を指す名詞的用法ですが、現代の丁寧で明瞭な本文では「不妊の女性」がより自然です。καλουμένῃの受動的な呼称は維持します。
