source:
  edition: SBLGNT
  text: καὶ ἰδοὺ Ἐλισάβετ ἡ ⸀συγγενίς σου καὶ αὐτὴ ⸀συνείληφεν υἱὸν ἐν γήρει αὐτῆς, καὶ οὗτος μὴν ἕκτος ἐστὶν αὐτῇ τῇ καλουμένῃ στείρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/036.yaml
  text: And look, Elizabeth your relative has also conceived a son in her old age, and this is the sixth month for her who was called barren.
translation:
  language: ja
  text: ご覧なさい。あなたの親族エリサベトも、年を取ってから男の子を身ごもっています。不妊の女性と呼ばれていた彼女は、今、妊娠六か月目です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: ご覧なさい
  rationale: 注意を促す提示表現として、現代日本語で明瞭かつ品位のある命令形とした。
- source_word: συγγενίς
  choice: 親族
  rationale: 具体的な続柄を本文が示していないため、広い親族関係を表す語を選んだ。
- source_word: συνείληφεν υἱόν
  choice: 男の子を身ごもっています
  rationale: 完了形が示す、すでに懐妊し現在も妊娠中である状態を自然な日本語で表した。
- source_word: ἐν γήρει αὐτῆς
  choice: 年老いているのに
  rationale: 老年という状況の意外性を日本語として自然に示した。
- source_word: τῇ καλουμένῃ στείρᾳ
  choice: 不妊の女と呼ばれていた彼女
  rationale: 受動分詞の『呼ばれていた』を保ち、本人の本質を断定するより周囲からの呼称であることを明示した。
- source_word: οὗτος μὴν ἕκτος ἐστὶν αὐτῇ
  choice: 今や妊娠六か月目です
  rationale: 直訳的な『これは彼女にとって第六の月』を、日本語で意味が明確になるよう妊娠月数として表現した。
theological_decisions:
- issue: マリアとエリサベトの親族関係
  choice: 親族
  alternative: いとこ
  rationale: 原語は具体的な続柄を確定しないため、『いとこ』のように限定しなかった。
- issue: στείραの叙述
  choice: 不妊の女と呼ばれていた
  alternative: 不妊であった
  rationale: 本文の『呼ばれていた』という表現を保ち、医学的・本質的な断定へ置き換えないようにした。
translation_notes:
  register: 明瞭な現代標準日本語。天使の発言にふさわしい品位を保ちつつ、古風な『見よ』は避けた。原文の二つの節を、日本語で理解しやすい三文に整えた。
