id: LUK.1.66
reference: Luke 1:66
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔθεντο πάντες οἱ ἀκούσαντες ἐν τῇ καρδίᾳ αὐτῶν, λέγοντες· Τί ἄρα τὸ παιδίον τοῦτο ἔσται; καὶ ⸀γὰρ χεὶρ κυρίου ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/066.yaml
  text: And all who heard it laid it up in their hearts[a], saying[b], “What then will this child become?” For the hand of the Lord was with him.
translation:
  language: ja
  text: これを聞いた人々は皆、このことを心に留め、「いったい、この子は何になるのだろうか」と言った。[a] なぜなら、主の御手がこの子と共にあったからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いったい、この子はどのような子になるのだろうか」。原文の動詞は単に「なる／ある」を意味するが、ここではこの子の将来を問うている。
    reason: lexical_alternative
  - marker: b
    text: 「主の御手」は、神の力、恵み、導きなど、その積極的な働きを表す聖書的な言い回し。
    reason: cultural_note
lexical_decisions:
- source_word: ἔθεντο ... ἐν τῇ καρδίᾳ αὐτῶν
  choice: このことを心に留めて
  rationale: 直訳的な「彼らの心に置いた」という比喩の意味を、現代日本語で自然に伝える。「心に留める」は、出来事を重く受け止め、忘れずに考える含意を保つ。
- source_word: πάντες οἱ ἀκούσαντες
  choice: これを聞いた人々は皆
  rationale: 文脈上、聞いた内容を「これ」で受け、πάντες の全称性を「皆」で明示する。
- source_word: Τί ἄρα
  choice: いったい
  rationale: ἄρα が示す、先の出来事を踏まえた推量と問いの強さを、自然な日本語の「いったい」で表す。
- source_word: τὸ παιδίον τοῦτο
  choice: この子
  rationale: 年齢や役割を必要以上に限定せず、通常の日本語として自然に訳す。
- source_word: ἔσται
  choice: 何になるのだろうか
  rationale: 動詞自体は「ある、いる」だが、ここでは子どもの将来の身分・役割・行く末を問う文脈であるため、「なる」とする。原語に即した別訳を脚注に示す。
- source_word: καὶ γὰρ
  choice: 実に
  rationale: 本文の理由・根拠を補強して導入する粒子の組み合わせを、日本語で不自然にならないよう「実に」と表した。
- source_word: χεὶρ κυρίου
  choice: 主の御手
  rationale: 神の力、恵み、導きなどを示し得る聖書的比喩を解釈語に置き換えず保持する。「御手」により神への敬意と定着した聖書語法を保つ。
- source_word: μετ’ αὐτοῦ
  choice: この子と共に
  rationale: μετά＋属格の「共に」をそのまま保ち、代名詞の指示対象を日本語では明確にする。
theological_decisions:
- issue: 「主の御手が彼と共にあった」の意味
  choice: 神の積極的な臨在、力、恵み、導きを含み得る比喩として「主の御手」を保持する。
  alternative: 「主がこの子を助けておられた」「神の力がこの子の上にあった」
  rationale: 原文は神の働きの具体的な様態を一つに限定していない。比喩を残すことで、その神学的な広がりを保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御手」は日常語ではないが、原文の身体比喩と聖書内の響きを保つため採用した。問いは自然な口語性を持たせつつ、本文全体は朗読にも適する文体とした。
