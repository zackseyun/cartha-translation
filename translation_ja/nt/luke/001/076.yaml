id: LUK.1.76
reference: Luke 1:76
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ σὺ ⸀δέ, παιδίον, προφήτης Ὑψίστου κληθήσῃ, προπορεύσῃ γὰρ ⸀ἐνώπιον κυρίου ἑτοιμάσαι ὁδοὺς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/076.yaml
  text: And you also[a], child, will be called a prophet of the Most High, for you will go before the Lord to prepare his ways[b],
translation:
  language: ja
  text: 幼子よ、あなたも、いと高き方の預言者と呼ばれるだろう。あなたは主の前[a]を進み、その方の道[b]を整えるためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主の前」は、「主に先立って」とも、「主の御前で」とも理解できる。原語の表現は、ある方より先に進むことも、その方の御前で仕えることも表し得る。
    reason: lexical_alternative
  - marker: b
    text: この表現は、主の道を整えるという預言の約束を響かせている（イザヤ40:3、マラキ3:1参照）。ルカの物語では、これはイエスに先立つヨハネの働きにおいて成就する。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ σὺ δέ
  choice: あなたも
  rationale: 話題の移行と幼子への強調を、現代日本語で自然に表す。
- source_word: παιδίον
  choice: 幼子よ
  rationale: 幼いヨハネへの呼びかけであることを明確にしつつ、性別を語そのもの以上に強調しない。
- source_word: προφήτης Ὑψίστου
  choice: いと高き方の預言者
  rationale: Ὑψίστουを神への尊称として保ち、属格関係もそのまま表す。
- source_word: κληθήσῃ
  choice: 呼ばれる
  rationale: 将来の designation・認知を表す未来受動の意味を、文脈上明らかな日本語の非過去形で表す。
- source_word: προπορεύσῃ
  choice: 前を進み
  rationale: 先行する働きを表し、「主の前」と結びつく自然な表現とした。
- source_word: ἐνώπιον κυρίου
  choice: 主の前
  rationale: 先立って行く意味と、主の御前で仕える意味の双方を許容する表現。
- source_word: ἑτοιμάσαι ὁδοὺς αὐτοῦ
  choice: その道を整える
  rationale: 目的を自然に示し、預言的背景を響かせる。ギリシア語の複数形は、日本語では集合的な「道」が自然であるため単数形で表した。
theological_decisions:
- issue: 「主」の指示対象
  choice: 本文では「主」とし、指示対象を限定しない
  alternative: 旧約背景に即して神と明示する／ルカの物語上の成就に即してイエスと明示する
  rationale: 旧約の預言では主なる神の道を整える表現であり、ルカの物語ではヨハネがイエスに先立つ。この重なりを訳文で解消しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「いと高き方」は聖書的な尊称として理解可能な範囲で保持した。脚注記号は、それぞれ「主の前」と節末の預言的表現に対応させるため本文末尾に連続して置いた。
