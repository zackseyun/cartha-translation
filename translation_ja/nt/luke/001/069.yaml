  text: καὶ ἤγειρεν κέρας σωτηρίας ἡμῖν ⸀ἐν οἴκῳ ⸀Δαυὶδ παιδὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/069.yaml
  text: and has raised up a horn of salvation for us in the house of David his servant,[a]
translation:
  language: ja
  text: 神は私たちのために、ご自分のしもべダビデの家に救いの角[a]を立ててくださった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「力強い救い主」。直訳は「救いの角」。角は聖書で、救いをもたらす強い力を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγειρεν
  choice: 立ててくださった
  rationale: アオリストを自然な日本語の完了した行為として訳す。「立てる」は、神が救いをもたらす者を起こすという聖書的表現を保ち、「くださった」によってἡμῖνの受益性も自然に表す。
- source_word: κέρας σωτηρίας
  choice: 救いの角
  rationale: 力と勝利を伴う救いを表す旧約聖書由来の比喩を保持し、原文の属格構造も反映する。意味は脚注で補う。
- source_word: ἡμῖν
  choice: 私たちのために
  rationale: 方向よりも受益を表す与格として訳し、神の救いの行為が民のためであることを明示する。
- source_word: ἐν οἴκῳ Δαυὶδ
  choice: ダビデの家に
  rationale: 「家」が家系・王朝を指す聖書的表現を保持する。ἐνはここでは、その家系の中に救いの力を立てるという意味で「に」とする。
- source_word: παιδὸς αὐτοῦ
  choice: しもべダビデ
  rationale: παῖςはここで未成年の子ではなく、神に仕える選ばれた者としてのダビデを指す。「しもべ」は七十人訳的な契約表現との響きを保つ。
theological_decisions:
- issue: 「救いの角」という比喩を保持するか、解釈して「力強い救い主」とするか
  choice: 本文では「救いの角」を保持する。
  alternative: 力強い救い主
  rationale: 原文は旧約聖書の王権・戦い・救出のイメージを担う具体的な比喩を用いている。これを保持することで文学的・神学的連続性を残し、意味の説明を脚注に委ねる。
translation_notes:
  register: 現代の標準的な日本語を用いながら、賛歌にふさわしい簡潔で格調ある調子と、旧約聖書に根差す比喩を保った。「しもべ」は伝統的だが現在も理解可能で、神との関係を明確にするため平仮名表記とした。
