id: LUK.1.17
reference: Luke 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς προελεύσεται ἐνώπιον αὐτοῦ ἐν πνεύματι καὶ δυνάμει Ἠλίου, ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα καὶ ἀπειθεῖς ἐν φρονήσει δικαίων, ἑτοιμάσαι κυρίῳ λαὸν κατεσκευασμένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/017.yaml
  text: And he will go before him in the spirit and power of Elijah[a], to turn the hearts of fathers to children, and the disobedient to the wisdom of the righteous[c][b], to prepare for the Lord a people made ready.
translation:
  language: ja
  text: 彼はエリヤの霊と力をもって[a]、その方に先立って進みます。それは、父たちの心を子どもたちに向け[b]、不従順な者たちを正しい人々の思慮へと立ち返らせ[c]、主のために、整えられた民を用意するためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エリヤの霊と力」とは、エリヤに結び付けられた預言者的な働きと力を指す。エリヤ本人の文字どおりの再来を必ずしも意味しない。
    reason: cross_reference
  - marker: b
    text: 直訳に近くは「父たちの心を子どもたちに向けて」。マラキ書4章6節を踏まえ、家族の間の和解と回復を含み得る。
    reason: lexical_alternative
  - marker: c
    text: 別訳「正しい人々の考え方へと」または「正しい人々の賢明さのうちへ」。ここでの「思慮」は、正しく判断して生きる実践的な理解を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: προελεύσεται ἐνώπιον αὐτοῦ
  choice: その方の前を進みます
  rationale: 「先立って行く」と「その面前を行く」の両面を保ちつつ、現代日本語として自然に表現した。「その方」は文脈上の指示対象を本文で明示しすぎない。
- source_word: ἐν πνεύματι καὶ δυνάμει Ἠλίου
  choice: エリヤの霊と力をもって
  rationale: ἐν の手段・様態を自然な日本語で示し、エリヤ本人との同一視ではなく、エリヤに連なる預言者的な霊と力を表す。
- source_word: ἐπιστρέψαι καρδίας πατέρων ἐπὶ τέκνα
  choice: 父たちの心を子どもたちに向け
  rationale: マラキ書への響きを残し、ἐπί の方向性を「向け」で表した。家族関係の回復という含意は保つが、本文で限定しない。
- source_word: ἀπειθεῖς
  choice: 不従順な者たち
  rationale: 説得を拒み従わない態度を表す語であり、「不信仰な者」に狭めず、倫理的・霊的反抗の幅を保つ。
- source_word: ἐν φρονήσει δικαίων
  choice: 正しい人々の思慮へと
  rationale: φρόνησις の実践的な理解力・判断のあり方を「思慮」とし、ἐπιστρέψαι に続く方向的な関係を「へと」で自然に示した。
- source_word: κυρίῳ λαὸν κατεσκευασμένον
  choice: 主のために、整えられた民
  rationale: 与格を「主のために」とし、完了受動分詞の結果状態を「整えられた」で表した。続く ἑτοιμάσαι と日本語で不自然に重複しないよう区別した。
theological_decisions:
- issue: エリヤ表現が示す身元と役割
  choice: エリヤの霊と力を帯びた預言者的働きとして訳す
  alternative: エリヤ本人の文字どおりの再来と解する
  rationale: 本文は「エリヤ」その人としてではなく、「エリヤの霊と力をもって」と述べているため、預言者的連続性を保ち、人格的同一性までは訳文に持ち込まない。
- issue: 「その方」と「主」の指示対象
  choice: ギリシア語どおり指示表現と称号を保つ
  alternative: 本文で「メシア」または「イエス」と明示する
  rationale: 文脈は指示対象を示すが、この節自体は αὐτοῦ と κυρίῳ を用いる。曖昧さと主への言及を保ち、説明的な固有名への置換を避けた。
- issue: 父たちの心と子どもたちの関係
  choice: 「子どもたちに向け」と方向性を保つ
  alternative: 「子どもたちと和解させる」と解釈的に明示する
  rationale: マラキ書の反響には和解の含意があるが、本文はそれを明示しないため、関係回復を含み得る表現にとどめた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「です・ます」調で前後の天使の発言に適合させた。「用意する」と「整えられた」を使い分け、ἑτοιμάσαι と κατεσκευασμένον の語義上の重なりと完了状態を表現した。すべての脚注記号を該当箇所の本文中に配置した。
