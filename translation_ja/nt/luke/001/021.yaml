id: LUK.1.21
reference: Luke 1:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἦν ὁ λαὸς προσδοκῶν τὸν Ζαχαρίαν, καὶ ἐθαύμαζον ἐν τῷ χρονίζειν ⸂ἐν τῷ ναῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/021.yaml
  text: And the people were waiting for Zechariah[a], and they were marveling at his delay in the temple.
translation:
  language: ja
  text: さて、民衆はザカリヤを待っていたが、彼が聖所[a]に長くとどまっていることを不思議に思っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所」は、境内や庭を含む神殿域全体ではなく、祭司が務めを行う神殿本体を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: ὁ λαὸς
  choice: 民衆
  rationale: 祭司の務めが終わるのを外で待っていた、集まった人々を指す集合的な表現として、自然で簡潔な「民衆」とした。
- source_word: προσδοκῶν
  choice: 待っていた
  rationale: ἦνとの迂言的未完了形が表す継続的な動作を、現代日本語で自然に表した。
- source_word: Ζαχαρίαν
  choice: ザカリヤ
  rationale: 聖書の人名として日本語で広く通用する表記を採用した。
- source_word: ἐθαύμαζον
  choice: 不思議に思っていた
  rationale: 未完了形による継続的な反応を保ちつつ、驚きと訝しみの両方を含み得る文脈に合う表現とした。
- source_word: ἐν τῷ χρονίζειν
  choice: 手間取っているのを
  rationale: 予想以上に時間がかかっているという意味を自然に表し、意図的に遅らせたとの含意を避けた。
- source_word: ἐν τῷ ναῷ
  choice: 聖所の中で
  rationale: ναόςは神殿域全体ではなく祭司が入る神殿本体・聖所を指すため、文脈上の空間的な正確さを優先した。
- source_word: αὐτόν
  choice: 彼が
  rationale: 不定詞χρονίζεινの対格主語であり、日本語の従属節では主格相当の「彼が」とした。
theological_decisions:
- issue: ναόςが指す範囲
  choice: 聖所
  alternative: 神殿
  rationale: ここではザカリヤが香をたくために入った神殿本体を指し、外庭を含む神殿域全体ではない。特定の教派的解釈ではなく、語彙上の区別を反映した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、叙事文としての品位を保った。「手間取る」により、単なる滞在ではなく予想以上に時間がかかったことを自然に示した。
