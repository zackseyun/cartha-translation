  text: καὶ ἰδοὺ συλλήμψῃ ἐν γαστρὶ καὶ τέξῃ υἱόν, καὶ καλέσεις τὸ ὄνομα αὐτοῦ Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/031.yaml
  text: And behold[a], you will conceive in your womb and bear a son, and you will call his name Jesus.
translation:
  language: ja
  text: 見なさい、あなたは身ごもり、男の子を産み、その子をイエスと名づけます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の名をイエスと呼びます」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: さあ
  rationale: 注意を促し、告知を際立たせる談話標識として、現代日本語で自然かつ荘重さも保てる表現を選んだ。
- source_word: συλλήμψῃ ἐν γαστρὶ
  choice: あなたは身ごもって
  rationale: 「胎内に宿す」という意味を自然な現代日本語で表す。「妊娠する」より告知の文体になじみ、原文の受胎の意味を明確に伝える。
- source_word: τέξῃ υἱόν
  choice: 男の子を産み
  rationale: τίκτω の出産の意味と υἱός の男性を示す意味を、簡潔で明瞭な日本語にした。
- source_word: καλέσεις τὸ ὄνομα αὐτοῦ
  choice: その子を…と名づけます
  rationale: 字義的には「彼の名を…と呼ぶ」だが、日本語では命名を表す定型として「その子を…と名づける」が自然であり、意味を過不足なく伝える。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 新約聖書の人名として定着した標準的な日本語表記を用いた。
theological_decisions:
- issue: καλέσεις τὸ ὄνομα αὐτοῦ の命名表現
  choice: その子をイエスと名づけます
  alternative: その名をイエスと呼びます
  rationale: 教理上の相違はない。自然な現代日本語を本文に採用し、原文のセム語的な命名定型に近い表現を注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、天使の告知にふさわしい簡潔で dignified な調子を保った。「さあ」は ἰδού の注意喚起機能を示し、「名づけます」は日本語として自然な命名表現である。
