  yaml_path: translation/nt/luke/001/062.yaml
  text: So they motioned to his father to find out what he wanted him to be called.
translation:
  language: ja
  text: そこで人々は、その子を何と呼びたいのか、父親に身振りで尋ねた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνένευον
  choice: 身振りで尋ねた
  rationale: 動詞は、合図や身振りによって意思を伝えることを表す。この文脈では、問いの内容が続くため、「身振りで尋ねた」が自然で明確である。
- source_word: δὲ
  choice: そこで
  rationale: 物語を前へ進める穏やかな接続辞であり、直前の出来事を受けた展開を自然に示す。
- source_word: τῷ πατρὶ αὐτοῦ
  choice: 父親に
  rationale: 与格は身振りを向けた相手を示す。αὐτοῦはその子を指すが、日本語では文脈上明らかなため「その子の」を重ねず、自然な表現とした。
- source_word: τὸ τί ἂν θέλοι
  choice: 何と呼びたいのか
  rationale: 冠詞付き間接疑問が身振りによる問いの内容を導く。ἄνを伴う願望法の控えめな可能性は、日本語の間接疑問「のか」によって不自然にならない範囲で表した。
- source_word: καλεῖσθαι αὐτό
  choice: その子を何と呼びたい
  rationale: 受動不定詞は直訳すれば「その子が何と呼ばれることを望むか」だが、日本語では命名者の意向を表す能動形が自然で、指示対象も明瞭である。
