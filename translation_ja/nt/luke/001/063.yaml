  text: καὶ αἰτήσας πινακίδιον ἔγραψεν λέγων· Ἰωάννης ⸀ἐστὶν ὄνομα αὐτοῦ. καὶ ἐθαύμασαν πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/063.yaml
  text: And after asking for a writing tablet[a], he wrote, saying, “John is his name.” And they all marveled.
translation:
  language: ja
  text: 彼は書き板を求めて、こう書いた。「この子の名はヨハネです。」皆が驚いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰτήσας
  choice: 求め
  rationale: アオリスト分詞が主動詞に先立つ行為を示すため、「求め、」として自然な順序を保った。文脈上、求めた主体はザカリヤである。
- source_word: πινακίδιον
  choice: 書き板
  rationale: 筆記に用いる小さな板を指す。「板」だけより用途が明確で、現代の電子端末との混同も避けられる。
- source_word: ἔγραψεν λέγων
  choice: こう書いた
  rationale: 直訳的な「書いて言った」は日本語では不自然であるため、λέγωνが記された内容を導入する働きを「こう」で表した。
- source_word: Ἰωάννης
  choice: ヨハネ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: ἐστὶν ὄνομα αὐτοῦ
  choice: が、この子の名です
  rationale: 現在形を保ち、「名となる」とはしなかった。原文で文頭に置かれた「ヨハネ」の強調を、主題化せず「ヨハネが」として表し、αὐτοῦは日本語で自然かつ指示対象が明確な「この子の」とした。
- source_word: ἐθαύμασαν πάντες
  choice: 皆は驚いた
  rationale: θαυμάζωの驚き・感嘆の意味を、現代日本語の物語文として明瞭な「驚いた」で表し、πάντεςの全体性を「皆」で保持した。
theological_decisions:
- issue: 子の名についての宣言が現在の事実か将来の命名か
  choice: 「ヨハネが、この子の名です」
  alternative: 「この子の名はヨハネとなります」
  rationale: 原文は現在形ἐστίνを用いており、すでに神から与えられた名を断定的に確認する響きを保つ。未来的な「となる」は不要な解釈を加えるため避けた。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、物語文としての簡潔さと品位を保った。原文の語順による「ヨハネ」の強調は、「ヨハネが、この子の名です」として自然な範囲で再現した。
