  yaml_path: translation/nt/luke/001/074.yaml
  text: that[a], having been rescued from the hand of our enemies[c][b], we might serve him without fear
translation:
  language: ja
  text: 敵の手から救い出された私たちが、恐れることなく[a]神に仕えるように。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「恐れずに」。
    reason: lexical_alternative
  - marker: b
    text: 「仕える」は、神への礼拝を含む奉仕を表すことがある。別訳「神を礼拝する」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφόβως
  choice: 恐れることなく
  rationale: 「恐れなしに」「恐れずに」を意味する副詞。自然な現代日本語で、神に仕える際の恐れの不在を明確に表す。
- source_word: ἐκ χειρὸς ἐχθρῶν
  choice: 敵の手から
  rationale: 支配や力からの解放を表す聖書的な慣用表現。「手」の比喩を保ちつつ、日本語でも理解できる。ギリシア語にない所有代名詞は本文では補わない。
- source_word: ῥυσθέντας
  choice: 救い出された私たちが
  rationale: アオリスト受動分詞で、仕えることに先立つ救出を示す。主語は文脈上の一人称複数なので、日本語では「私たち」を明示する。
- source_word: λατρεύειν
  choice: 仕える
  rationale: 神にささげる奉仕・礼拝を表す語。「仕える」は礼拝行為だけに狭めず、献身と奉仕の幅を保つ。
- source_word: αὐτῷ
  choice: 神に
  rationale: 代名詞の指示対象は前の文脈にある神。独立した日本語の節として明瞭にするため、指示対象を明示した。
theological_decisions:
- issue: 神に対する λατρεύειν の意味範囲
  choice: 神に仕える
  alternative: 神を礼拝する
  rationale: この語は神への礼拝的奉仕を意味し得る。「仕える」とすることで、典礼的な礼拝だけに限定せず、献身と従順を含む広がりを保つ。
- issue: 救出される「敵」の所有関係
  choice: 敵
  alternative: 私たちの敵
  rationale: ギリシア語本文には所有代名詞がないため、本文では「私たちの」を補わず、文脈上の関係を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「敵の手」という原文の比喩を残し、「恐れることなく」は自然な語順で λατρεύειν に結び付けた。節単独でも意味が通るよう結びを「ことです」とし、文脈上の指示対象を「神」と明示した。
