lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 入った
  rationale: εἰςを伴うεἰσέρχομαιのアオリストで、ある場所の中へ入る動作を表す。「家に入った」が簡潔で自然である。
- source_word: οἶκον
  choice: 家
  rationale: ここではεἰςとともに物理的な場所を指しているため、「家」と訳す。
- source_word: Ζαχαρίου
  choice: ザカリヤ
  rationale: 日本語聖書で広く用いられる、分かりやすい人名表記を採用した。
- source_word: ἠσπάσατο
  choice: 挨拶した
  rationale: ἀσπάζομαιの基本的な意味を文脈に即して自然に表し、歓迎の度合いや儀礼性を付加しない。
- source_word: Ἐλισάβετ
  choice: エリサベト
  rationale: 日本語聖書で広く定着している人名表記を採用した。
- source_word: καὶ
  choice: そして／（動作の連結）
  rationale: 最初のκαίは前節から物語をつなぐ「そして」とし、二つ目は日本語では連用形「入り」で自然に連結した。
