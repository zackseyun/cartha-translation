source:
  edition: SBLGNT
  text: Μετὰ δὲ ταύτας τὰς ἡμέρας συνέλαβεν Ἐλισάβετ ἡ γυνὴ αὐτοῦ· καὶ περιέκρυβεν ἑαυτὴν μῆνας πέντε, λέγουσα
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/024.yaml
  text: After these days Elizabeth his wife conceived[a], and she kept herself hidden for five months, saying[b],
translation:
  language: ja
  text: その後、彼の妻エリサベトは身ごもった。そして五か月の間、身を隠していた。こう言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταύτας τὰς ἡμέρας
  choice: その後
  rationale: μετά＋対格は時間的な後続を表す。ταύτας τὰς ἡμέραςを逐語的に「これらの日々の後」とせず、現代日本語の自然な物語表現にした。δέは軽い接続であり、続く「そして」によって文脈上の連結を表した。
- source_word: συνέλαβεν
  choice: 身ごもった
  rationale: この文脈では子を宿すことを意味する。自然で品位のある現代日本語として「身ごもった」を採用した。
- source_word: Ἐλισάβετ
  choice: エリサベト
  rationale: ギリシア語名Ἐλισάβετに対応する、日本語聖書で広く知られた音写を用いた。
- source_word: ἡ γυνὴ αὐτοῦ
  choice: 妻エリサベト
  rationale: γυνήはここでは所有表現αὐτοῦと文脈により「妻」を意味する。日本語として自然になるよう、名前の前に身分を置いた。
- source_word: περιέκρυβεν ἑαυτὴν
  choice: 身を隠して
  rationale: 再帰的な「自分を隠す」を自然に表した。未完了過去の継続性は、期間を示す「五か月の間」と接続形によって十分に伝わる。
- source_word: μῆνας πέντε
  choice: 五か月の間
  rationale: 対格による時間の継続を明示する自然な日本語。
- source_word: λέγουσα
  choice: こう言った
  rationale: 分詞が次節の発言内容を導く働きを、日本語では有限動詞にして自然に表した。「こう」により後続する引用との結び付きを示した。
theological_decisions: []
