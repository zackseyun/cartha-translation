  text: ὅτι οὐκ ἀδυνατήσει παρὰ ⸂τοῦ θεοῦ⸃ πᾶν ῥῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/037.yaml
  text: For no word from God will be impossible[a].
translation:
  language: ja
  text: 神から出るどんなことばも、実現不可能にはならないからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神にとって不可能なことは何一つないからです。」
    reason: παρὰ τοῦ θεοῦを「神のもとで／神にとって」と、ῥῆμαを「こと／事柄」と理解することも文法的に可能であるため。
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前の御使いの言明の根拠を示す接続語として、現代日本語で自然な理由表現にした。
- source_word: οὐκ ἀδυνατήσει
  choice: 実現できないものは何一つない
  rationale: ἀδυνατέωの「不可能である」という意味を保ちつつ、神から出たことばについて述べる日本語として、そのことばが実現不能ではないという趣旨を明瞭にした。
- source_word: παρὰ τοῦ θεοῦ
  choice: 神から出た
  rationale: 属格を伴う παρά の起点・源の意味を採り、ῥῆμαと結びつけて、神に由来することばという読みを保持した。
- source_word: πᾶν
  choice: 何一つない
  rationale: 否定された述語とともに普遍的否定を表すため、日本語では「何一つない」と自然に表現した。
- source_word: ῥῆμα
  choice: ことば
  rationale: 発言・宣言・事柄を表し得る語だが、文脈上は御使いが告げた神の宣言とのつながりを保つ「ことば」とした。
theological_decisions:
- issue: παρὰ τοῦ θεοῦ πᾶν ῥῆμα の解釈
  choice: 神から出たことばで、実現できないものは何一つない。
  alternative: 神に不可能なことは何一つない。
  rationale: 本文に明示される ῥῆμα を主文で「ことば」として保持し、神に由来する宣言が実現不能ではないという読みを採った。一方、「神にとって不可能なことはない」という伝統的で文法的にも可能な読みを脚注に残し、解釈上の幅を保持した。
translation_notes:
  register: 明瞭な現代標準日本語。神の宣言の確実な実現という含意を伝えながら、過度に教義的な語を加えず、簡潔で品位ある文体とした。
