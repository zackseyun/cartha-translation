  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ Μαριάμ· Ἰδοὺ ἡ δούλη κυρίου· γένοιτό μοι κατὰ τὸ ῥῆμά σου. καὶ ἀπῆλθεν ἀπ’ αὐτῆς ὁ ἄγγελος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/038.yaml
  text: And Mary said[a], “Behold, I am the Lord’s servant[b]. May it happen to me according to your word.” And the angel departed from her.
translation:
  language: ja
  text: マリアは言った。「ご覧のとおり、私は主のしもべです。[a] どうか、あなたの言葉どおり、私の身に起こりますように。[b]」そして天使は彼女のもとを去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主の女奴隷」とも訳せる。ギリシア語の「ドゥーレー」は、女性の奴隷またはしもべを指す。ここでは、神に対するマリアの謙遜な服従を表すため、本文では「しもべ」とした。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは、「あなたの言葉どおり、私にありますように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: すると
  rationale: 弱い接続辞として直前の御使いの言葉を受け、時間的順序を過度に強調せず、自然な物語の流れを示す。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 注意を促す標識語の力と厳かな自己提示を保ちつつ、現代日本語として理解しやすくした。
- source_word: ἡ δούλη κυρίου
  choice: 私は主のしもべです
  rationale: δούληは女性の奴隷または僕を指す。ここでは主への謙遜な服従が前面に出るため「しもべ」とし、所有・隷属の強い含意は脚注で明示する。日本語ではコピュラを補って自然な発言にした。
- source_word: γένοιτό μοι
  choice: どうか、この身になりますように
  rationale: アオリスト中動態希求法が表す、出来事を自らに受け入れる願いと同意を「どうか」「なりますように」で表した。「この身に」は単なる客観的発生ではなく、マリア自身に及ぶことを自然に示す。
- source_word: κατὰ τὸ ῥῆμά σου
  choice: あなたのおことばどおり
  rationale: κατάの一致・準拠の意味を「どおり」で、ῥῆμαが指す御使いの具体的な告知を「おことば」で表す。敬意を含む文脈上自然な表記である。
- source_word: ἀπῆλθεν ἀπ’ αὐτῆς
  choice: 彼女のもとを去った
  rationale: 御使いがマリアのいる場から離れたという物語上の結びを、簡潔で品位ある日本語にした。
- source_word: ὁ ἄγγελος
  choice: 御使い
  rationale: この文脈では人間の使者ではなく天的存在を指すため、日本語聖書で通用する明確な語を選んだ。
theological_decisions:
- issue: マリアの自己呼称 δούλη の訳
  choice: 主のしもべ
  alternative: 主の女奴隷／主の奴隷
  rationale: 原語には所有下にある女性奴隷という強い意味がありうるが、ここでは主への謙遜な服従と献身が発言の焦点である。「しもべ」は文脈に自然で、その強い社会的・法的含意を脚注に残すことで意味幅を隠さない。
- issue: γένοιτό μοι の希求法の力
  choice: どうか、あなたのおことばどおり、この身になりますように
  alternative: あなたのおことばどおり、私にありますように／私に起こりますように
  rationale: 単なる未来予測や受動的諦念ではなく、告知されたことを自分に受け入れる願いを表す。後代の教理的表現を加えず、同意と希求の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、マリアの応答の厳かさを保った。「ご覧ください」「おことば」「御使い」はやや高い文体だが、一般読者にも理解可能で、場面の品位に適する。脚注記号[a][b]は対応箇所に置いた。
