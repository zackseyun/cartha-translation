revisions:
- from: するとマリアは言った。「ご覧ください。私は主のしもべです。[a] どうか、あなたのおことばどおり、この身になりますように。[b]」そして御使いは彼女のもとを去った。
  to: マリアは言った。「ご覧のとおり、私は主のしもべです。[a] どうか、あなたの言葉どおり、私の身に起こりますように。[b]」そして天使は彼女のもとを去った。
  rationale: γένοιτό μοιを「私の身に起こりますように」と改め、告知された事柄がマリア自身に実現することへの希求的な受諾を正確に表した。「ご覧のとおり」はἸδούの強調的な自己提示を自然な現代日本語で再現する。「そして」はδὲの弱い接続を過不足なく反映する。脚注はδούληの奴隷という意味可能性、およびγένοιτό μοιのより直訳的な表現を保持する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:26:22Z'
review_pass:
  verdict: revise
  source_fidelity: δούληを「主のしもべ」とし、脚注で「主の女奴隷」の可能性を示す方針は、原語の意味幅と文脈上の謙遜な自己提示の双方を適切に保っている。γένοιτό μοιは希求・受諾の表現であり、「私の身に起こりますように」とすることで、原文に忠実かつ誤解のない日本語になる。
  naturalness: 現行の「この身になりますように」は、「この身になる」（ある状態・身分になる）のようにも読め、告知された出来事がマリアに生じるという意味を自然に表せていない。「私の身に起こりますように」へ改める必要がある。また、自己紹介としてのἸδούを「ご覧ください」と直訳すると、聞き手に見るよう命じる響きがやや強いので、「ご覧のとおり」とするほうが現代日本語として自然である。
  terminology: 「主」はκύριοςの神的称号として適切である。「しもべ」はやや聖書的な語だが、明瞭で定着しており、この厳かな応答にふさわしい。「天使」は現代標準日本語として明確であり、ἄγγελοςの指示対象を正しく伝える。「あなたの言葉」は、天使への直接の呼びかけとして自然で、不要な敬語的含意を加えない。
  issues:
  - severity: medium
    issue: 「この身になりますように」はγένοιτό μοιの意味を不正確に伝える。
    rationale: 原文は「それが私に起こりますように／私の身に実現しますように」という希求であり、「この身になる」ではない。日本語としても意味が取りにくく、別の意味に解されうる。
  - severity: low
    issue: 「ご覧ください」はἸδούの日本語としてやや不自然である。
    rationale: この箇所のἸδούは相手に見るよう命じる語というより、マリアが自らを示す強調表現である。「ご覧のとおり、私は…」のほうが自然にその機能を表す。
  - severity: low
    issue: 「すると」はδὲに比してやや強い時間的推移を示す。
    rationale: δὲはここでは軽い接続であるため、「そして」または接続詞なしで自然につなぐほうが、過度の時間的含意を避けられる。
  revised_text: マリアは言った。「ご覧のとおり、私は主のしもべです。[a] どうか、あなたの言葉どおり、私の身に起こりますように。[b]」そして天使は彼女のもとを去った。
