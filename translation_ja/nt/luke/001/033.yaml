  text: καὶ βασιλεύσει ἐπὶ τὸν οἶκον Ἰακὼβ εἰς τοὺς αἰῶνας, καὶ τῆς βασιλείας αὐτοῦ οὐκ ἔσται τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/033.yaml
  text: And he will reign over the house of Jacob forever[a], and of his kingdom there will be no end.
translation:
  language: ja
  text: 彼は永遠に[a]ヤコブの家を治め、その王国に終わりはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸時代に至るまで」。ギリシア語の慣用句は、終わりなく続くことを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεύσει
  choice: 治め
  rationale: 未来時制の王としての統治を表す。日本語では主語が王であることと後続の「王国」によって王権の意味が明らかなため、「治める」が自然で格調も保てる。
- source_word: ἐπὶ τὸν οἶκον Ἰακώβ
  choice: ヤコブの家を
  rationale: ἐπί＋対格はここで支配の対象を示す。「ヤコブの家」という契約的・集合的な聖書表現を保ち、「イスラエルの民」などと解釈的に言い換えない。
- source_word: εἰς τοὺς αἰῶνας
  choice: とこしえに
  rationale: 複数形の「時代」を用いるギリシア語慣用句で、終わりのない継続を表す。「とこしえに」は現代日本語でも理解でき、文体上の品位と永続性を伝える。
- source_word: βασιλείας
  choice: 王国
  rationale: βασιλείαは「王としての支配」と「王国」の双方を表し得る。ここでは「終わりがない」の主語として「王国」が自然で、王的支配の含意も保持する。
- source_word: οὐκ ἔσται τέλος
  choice: 終わりがありません
  rationale: 存在を否定する未来表現。丁寧体の本文として自然に、将来にわたり終わりが存在しないことを明確に表す。
theological_decisions:
- issue: 「ヤコブの家」の範囲
  choice: 「ヤコブの家」をそのまま保持する
  alternative: 「イスラエルの民」または「神の民」
  rationale: 原文の伝統的な契約表現を保ち、その範囲を後代の神学によって拡張または限定しない。
- issue: 統治と王国の持続期間
  choice: 「とこしえに」「終わりがありません」として無期限の継続を表す
  alternative: 「幾世代にもわたって」「諸時代に至るまで」
  rationale: εἰς τοὺς αἰῶναςという慣用句と、続く「終わりがない」という明示的表現を合わせ、終わりのない統治を自然な日本語で示す。
translation_notes:
  register: 明瞭で現代的な丁寧体を用いながら、「ヤコブの家」「とこしえ」という聖書的で格調ある表現を保持した。「支配する」よりも自然で過度に強圧的な響きを避ける「治める」を選んだ。
