  text: καὶ εἶπεν ὁ ἄγγελος αὐτῇ· Μὴ φοβοῦ, Μαριάμ, εὗρες γὰρ χάριν παρὰ τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/030.yaml
  text: And the angel said to her[a], “Do not be afraid, Mary, for you have found favor with God.”
translation:
  language: ja
  text: 天使は彼女に言った。「恐れることはありません、マリア。あなたは神の前で好意を得たのです。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恵みを得た」とも訳せる。ギリシア語の語は「恵み」または「好意」を意味するが、ここでは「神の前で好意を得る」という慣用的な表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: 言った
  rationale: λέγωの物語叙述におけるアオリストであり、直接話法を導く現代日本語として自然である。
- source_word: ἄγγελος
  choice: 天使
  rationale: ルカの誕生物語では天上の存在を指すため、一般的な「使者」ではなく「天使」とする。
- source_word: Μὴ φοβοῦ
  choice: 恐れることはありません
  rationale: μήを伴う現在命令形による禁止・安心の呼びかけを、丁寧で自然な現代日本語にした。
- source_word: Μαριάμ
  choice: マリア
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: εὗρες
  choice: 受けたのです
  rationale: 直訳は「見いだした」だが、「恵みを見いだす」は現代日本語では不自然になりやすい。神から好意を得て現在その状態にあるという文脈上の結果を自然に表す。
- source_word: χάριν
  choice: 恵み
  rationale: χάριςの神から与えられる好意という意味を表し、日本語として自然な「恵みを受ける」という連語を用いた。「好意」も可能なため脚注で示す。
- source_word: παρὰ τῷ θεῷ
  choice: 神の前で
  rationale: παρά＋与格が表す、神の御前・神から見た関係を簡潔に保つ。「神から」とすると起点の意味を必要以上に強めるため避けた。
theological_decisions:
- issue: マリアへの告知における χάριν の訳語
  choice: 恵み
  alternative: 好意
  rationale: 定型表現 εὑρίσκω χάριν παρά は「（だれかの）好意を得る」を意味しうるが、日本語では「神の前で恵みを受ける」が自然であり、神の恩恵を表す。後代のマリア論的含意を本文に付加せず、語義上の別案「好意」は脚注に残す。
translation_notes:
  register: 明快で丁寧な現代標準日本語。天使の安心を与える呼びかけにふさわしく敬体を用い、宗派固有の表現や古風な言い回しを避けた。
