  text: ἡ δὲ ⸂ἐπὶ τῷ λόγῳ διεταράχθη⸃ καὶ διελογίζετο ποταπὸς εἴη ὁ ἀσπασμὸς οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/029.yaml
  text: But she was greatly troubled at the message[b][a], and kept considering what kind of greeting this might be.
translation:
  language: ja
  text: しかし、マリアはその言葉にひどく心を乱され[a]、この挨拶はいったいどのようなものなのだろうかと、考え続けていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その言葉のために」または「その知らせに」とも訳せる。ギリシア語の λόγος は「言葉」「発言」「知らせ」などを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「思い巡らしていた」または「考え込んでいた」とも訳せる。ギリシア語の未完了過去は、思案が続いていたことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の挨拶からマリアの反応へと移る際の穏やかな対照を示す。
- source_word: ἐπὶ τῷ λόγῳ
  choice: その言葉に
  rationale: λόγοςは天使が今語った内容を指す。「言葉」は日本語で発言内容全体を自然に表せる一方、「知らせ」と断定せず原語の幅も保つ。
- source_word: διεταράχθη
  choice: ひどく心を乱され
  rationale: 強い動揺を表す動詞の力を示しつつ、それが罪深い恐れや不信だったとは限定しない。
- source_word: διελογίζετο
  choice: 考え続けていた
  rationale: 未完了過去が表す、内面で思案し続ける継続的な動きを明示する。
- source_word: ποταπὸς
  choice: どのようなもの
  rationale: 挨拶の性質や種類を問う表現であり、「何を意味する」と解釈を狭めずに訳す。
- source_word: εἴη
  choice: なのだろうか
  rationale: 過去時制に続く間接話法の希求法が帯びる思案と不確かさを、自然な現代日本語で表す。
- source_word: ἀσπασμὸς οὗτος
  choice: この挨拶
  rationale: 直前に語られた特定の挨拶を指すことを簡潔に示す。
theological_decisions:
- issue: マリアが動揺した対象と反応の性質
  choice: マリアは天使の「言葉」に強く動揺し、その挨拶がどのようなものかと思案した。
  alternative: 天使の姿そのものを恐れた、または不信仰ゆえに動揺した。
  rationale: 本文は動揺をἐπὶ τῷ λόγῳによって語られた言葉と結びつけ、続いて内面的な思案を描くが、その反応を不信仰や道徳的な過失とは評価していない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「心を乱され」は強い動揺を表し、「考え続けていた」は継続的な内省を平易に伝える。固有名「マリア」は日本語で主語を明確にするため文脈から補った。
