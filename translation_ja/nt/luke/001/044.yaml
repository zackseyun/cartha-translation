id: LUK.1.44
reference: Luke 1:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ γὰρ ὡς ἐγένετο ἡ φωνὴ τοῦ ἀσπασμοῦ σου εἰς τὰ ὦτά μου, ἐσκίρτησεν ⸂ἐν ἀγαλλιάσει τὸ βρέφος⸃ ἐν τῇ κοιλίᾳ μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/044.yaml
  text: For behold[a], when the sound of your greeting came into my ears, the baby leaped for joy in my womb.
translation:
  language: ja
  text: ご覧なさい。あなたのあいさつの声が私の耳に届いたとき、私の胎内の子は歓喜して[a]躍ったのですから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「歓喜のうちに」。
    reason: ἐν ἀγαλλιάσειは、歓喜を伴う様態を表す句である。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見てください
  rationale: 注意を促す談話標識としての生き生きとした力を保ちつつ、現代日本語で自然な表現とした。文脈上、出来事を強調する位置に置いた。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の発言に対する理由・説明を導く接続詞として自然に表した。
- source_word: ὡς ἐγένετο
  choice: 届いたとき
  rationale: φωνήとεἰς τὰ ὦτά μουを合わせ、音声が耳に達した時点を表す自然な日本語にした。
- source_word: ἡ φωνὴ τοῦ ἀσπασμοῦ σου
  choice: あなたのあいさつの声
  rationale: φωνήの聴覚的な具体性と、ἀσπασμόςが指すあいさつの内容をともに保持した。
- source_word: εἰς τὰ ὦτά μου
  choice: 私の耳に届いた
  rationale: εἰςの方向性を、日本語で自然な「耳に届く」によって表した。
- source_word: ἐσκίρτησεν
  choice: 躍った
  rationale: 胎内の子の突然の動きと、文脈にある歓喜の含みを、品位ある簡潔な語で表した。
- source_word: ἐν ἀγαλλιάσει
  choice: 喜びにあふれて
  rationale: 単なる快さより強い歓喜・歓喜に満ちた様態を明確に伝える表現とした。
- source_word: τὸ βρέφος
  choice: 胎内の子
  rationale: βρέφοςがここでは胎児を指すことを文脈に即して自然に示しつつ、語そのもの以上の教理的主張は加えない。
- source_word: ἐν τῇ κοιλίᾳ μου
  choice: 胎内の
  rationale: 日本語の重複を避けながら、子がエリサベトの胎内にいるという位置関係を明示した。
theological_decisions:
- issue: 胎内のヨハネを指すβρέφοςの訳
  choice: 胎内の子
  alternative: 赤ちゃん／幼子
  rationale: 原語が胎児または乳幼児を指し得ることと、この箇所では胎内にいるという文脈を保つ。本文を超える教理的含意は付加しない。
- issue: ἐν ἀγαλλιάσειが示す喜びの主体・様態
  choice: 胎内の子が喜びにあふれて躍った
  alternative: 胎内で子が歓喜のうちに躍った
  rationale: 文法上、喜びを伴って躍ったのはτὸ βρέφοςであるという最も自然な構造を示す一方、喜びの心理的性質を必要以上に定義しない。
translation_notes:
  register: 明瞭で現代的な標準日本語。会話中の説明として自然でありながら、聖書本文にふさわしい品位を保った。「見てください」はἰδούの注意喚起を保持し、「というのも」でγάρの説明的つながりを示した。
