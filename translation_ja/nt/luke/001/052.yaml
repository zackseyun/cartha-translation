translation:
  language: ja
  text: 権力者たちを王座から引き降ろし、低い立場にある人たちを高く上げた。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「権力者たち」は「力ある者たち」とも訳せる。ギリシア語は広く有力者を指し得るが、「王座から」という表現は支配者の意味を示唆する。
    reason: lexical_alternative
  - marker: b
    text: 「低い立場にある人たち」は「へりくだる者たち」とも訳せる。ギリシア語は、謙遜な人と、社会的に低い境遇にある人の両方を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεῖλεν
  choice: 引き降ろし
  rationale: 高い地位から下ろすという意味を、王座のイメージと結びつけて自然に表す。「失脚させる」ほど政治的意味に限定せず、「打ち倒す」ほど暴力性を強調しない。
- source_word: δυνάστας
  choice: 権力者たち
  rationale: 広く力ある者を指し得るが、「王座から」という句により、ここでは支配的な権力を持つ者が前景化されている。「支配者たち」も可能。
- source_word: ἀπὸ θρόνων
  choice: 王座から
  rationale: 具体的な王権・支配のイメージを保つ。「その王座から」と所有を補わず、原文の簡潔さを維持する。
- source_word: ὕψωσεν
  choice: 高く上げられた
  rationale: 地位を高める意味と神学的な高揚の響きの両方を保ちながら、現代日本語で理解しやすく表す。
- source_word: ταπεινούς
  choice: 低くされた人たち
  rationale: 内面的な謙遜だけに限定せず、低い社会的境遇に置かれた者という文脈上の意味を前面に出す。ただし語には「へりくだった人たち」という意味もあり、脚注で示す。
theological_decisions:
- issue: マニフィカトにおけるアオリストの時制・相
  choice: 「引き降ろし……高く上げられた」と完了した行為として訳す
  alternative: 「引き降ろされた……高く上げられた」という現在完了的表現、または一般的・預言的な現在形
  rationale: ギリシア語のアオリストは神の決定的な行為を歌うが、その厳密な時間的位置が過去・預言的完了・賛歌的総括のいずれかを訳文で断定しないよう、自然な日本語の過去形で表した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神を主語とする前節からの連続を受け、敬語の補助動詞「られた」を用いた。対照構造と王座の具体的イメージを保持した。
