  text: ἀνεῴχθη δὲ τὸ στόμα αὐτοῦ παραχρῆμα καὶ ἡ γλῶσσα αὐτοῦ, καὶ ἐλάλει εὐλογῶν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/064.yaml
  text: And immediately his mouth was opened[a], and his tongue also, and he began speaking[b], blessing God.
translation:
  language: ja
  text: すると、たちまち彼の口が開き、舌も自由になり[a]、神をほめたたえながら語り始めた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「そして彼の舌も」。原文は舌について動詞を明示しておらず、「舌がほどけた」に当たる語もありません。
    reason: lexical_alternative
  - marker: b
    text: または「語っていた」。この未完了過去形は、語り始めたことだけでなく、語り続けていたことを示す可能性もあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεῴχθη
  choice: 開き
  rationale: アオリスト受動形。日本語では身体部位について「口が開く」と自動詞で表すのが自然であり、突然発話が回復した出来事を、行為者を限定せずに伝える。
- source_word: δὲ
  choice: すると
  rationale: 物語を次へ進める弱い接続辞。ここでは対比よりも直前の出来事に続く展開を自然に示す。
- source_word: παραχρῆμα
  choice: たちまち
  rationale: 出来事が即座に起こったことを、明快で品位のある現代日本語で表す。
- source_word: τὸ στόμα αὐτοῦ
  choice: 彼の口
  rationale: 身体部位を指す表現をそのまま明瞭に訳す。
- source_word: καὶ ἡ γλῶσσα αὐτοῦ
  choice: 舌もまた元どおりになって
  rationale: 原文は動詞を繰り返さず「そして彼の舌も」と述べる。日本語で「舌も開いた」とする不自然さを避け、発話能力の回復という文脈上の意味を表した。
- source_word: ἐλάλει
  choice: 語り始めた
  rationale: 未完了過去は継続する発話とも、発話の開始とも理解できる。沈黙を強いられていた直前の文脈では開始を表す訳が自然だが、継続の可能性は脚注に残す。
- source_word: εὐλογῶν
  choice: ほめたたえながら
  rationale: 神を対象とする εὐλογέω の意味を自然な日本語で表す。「祝福しながら」では、現代日本語で人が神に恩恵を与えるかのように誤解されうる。現在分詞の付帯状況も「ながら」で保持する。
- source_word: τὸν θεόν
  choice: 神を
  rationale: 分詞 εὐλογῶν の目的語として標準的に訳す。
theological_decisions:
- issue: 神に対する εὐλογέω の訳語
  choice: 神をほめたたえながら
  alternative: 神を祝福しながら
  rationale: 語の基本的な連関を保ちつつ、神に向けられた場合の感謝と賛美の意味を現代日本語で誤解なく伝える。特定の教派的解釈は加えない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「たちまち」と「ほめたたえる」によって、物語文としての品位と一般読者への分かりやすさを両立させた。原文の省略構文は本文では自然化し、直訳上の形を脚注で示した。
