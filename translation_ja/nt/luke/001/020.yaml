id: LUK.1.20
reference: Luke 1:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι ἄχρι ἧς ἡμέρας γένηται ταῦτα, ἀνθ’ ὧν οὐκ ἐπίστευσας τοῖς λόγοις μου, οἵτινες πληρωθήσονται εἰς τὸν καιρὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/020.yaml
  text: And behold[a], you will be silent and unable to speak until the day these things happen, because you did not believe my words[b], which will be fulfilled in their appointed time.
translation:
  language: ja
  text: 見よ、あなたは沈黙し、これらのことが起こる日まで話すことができなくなる。定めの時[a]に実現する私の言葉を、あなたが信じなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定めの時」は、「ふさわしい時」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 天使の宣告における注意喚起と厳粛さを保つ。現代日本語ではやや荘重だが、聖書本文として明瞭である。
- source_word: ἔσῃ σιωπῶν καὶ μὴ δυνάμενος λαλῆσαι
  choice: 口がきけなくなり…話すことができない
  rationale: 単なる自発的な沈黙ではなく、発話能力を奪われた状態であることを、重なる二表現を用いて示す。
- source_word: ἄχρι ἧς ἡμέρας γένηται ταῦτα
  choice: これらのことが起こる日まで
  rationale: 時の限界と、約束された出来事の実現を自然な現代日本語で表す。
- source_word: ἀνθ’ ὧν
  choice: …からである
  rationale: ここでは不信に対する結果の理由を導く因果表現として訳す。
- source_word: οὐκ ἐπίστευσας τοῖς λόγοις μου
  choice: 私の言葉を、あなたが信じなかった
  rationale: πιστεύωと与格のλόγοιςを、告げられた言葉を真実として受け入れなかったという意味で直接的に訳す。
- source_word: πληρωθήσονται
  choice: 実現する
  rationale: 言葉・約束が現実となることを表す受動形を、日本語では自然な自動詞表現にする。
- source_word: εἰς τὸν καιρὸν αὐτῶν
  choice: 定めの時に
  rationale: καιρόςが示す、単なる時点ではなく適切に定められた時という含意を保つ。
theological_decisions:
- issue: ザカリヤの沈黙の性質
  choice: 神から科された、話すことのできない状態として訳す
  alternative: 自発的に黙っている状態と解する
  rationale: 「沈黙している」と「話すことができない」が併置されており、単なる沈黙命令ではなく、強制された発話不能を示している。
- issue: 言葉が実現する時
  choice: 「定めの時」とする
  alternative: 「ふさわしい時」「その時期」とする
  rationale: 誰が定めたかを本文以上に明示せず、神的な時の含意と表現上の曖昧さをともに保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、天使の厳粛な宣告に合わせて「見よ」「…からである」を用いた。「口がきけない」は文脈上の強制的な発話不能を自然に示す。
