  text: Ἐπειδήπερ πολλοὶ ἐπεχείρησαν ἀνατάξασθαι διήγησιν περὶ τῶν πεπληροφορημένων ἐν ἡμῖν πραγμάτων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/001.yaml
  text: Since many have undertaken to compile an account concerning the matters that have been fulfilled among us,[a]
translation:
  language: ja
  text: 多くの人が、私たちの間で成就した[a]事柄についての物語をまとめようと着手したので、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「成し遂げられた」、または「私たちの間で十分に確証された」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπειδήπερ
  choice: ので
  rationale: 後続する主節の背景・理由を示す接続表現。日本語では節末の「ので」によって、原文の因果関係と文が次節以降へ続く構造を自然に表した。
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 明示されていない「ほかの人々」などの意味を加えず、数量を簡潔に示した。
- source_word: ἐπεχείρησαν
  choice: 取り組んできた
  rationale: 企てや着手を表しつつ、失敗を暗示しやすい「試みた」を避けた。完了した過去の取り組みが現在の序文につながることも自然に示す。
- source_word: ἀνατάξασθαι
  choice: 書きまとめること
  rationale: 資料や出来事を配列して叙述を作成する文学的営みを、現代日本語で明瞭に表した。
- source_word: διήγησιν
  choice: 物語
  rationale: 出来事を順に語る叙述を指す。「報告」より広く、「叙述」より一般の読者に分かりやすい。
- source_word: περὶ
  choice: について
  rationale: 対象を示す自然な現代日本語であり、文全体の品位も損なわない。
- source_word: τῶν πεπληροφορημένων
  choice: 成就した
  rationale: 完了受動分詞が示す、出来事が実現・達成されたという有力な意味を採った。確証の意味の可能性は脚注に残した。
- source_word: ἐν ἡμῖν
  choice: 私たちの間で
  rationale: 共同体のただ中で起きたことを表しつつ、「信者」など原文にない範囲指定を加えない。
- source_word: πραγμάτων
  choice: 事柄
  rationale: 出来事、行為、現実を含みうる語の広さを保つ。「出来事」より限定せず、文脈にも自然に合う。
theological_decisions:
- issue: ルカの序文における πεπληροφορημένων の意味
  choice: 成就した
  alternative: 成し遂げられた／私たちの間で十分に確証された
  rationale: πραγμάτων と結びつくこの箇所では、救済史上の事柄が実現・達成されたという意味が最も自然である。ただし、十分な確証・確信を表す語義の可能性も排除せず、脚注で明示した。
translation_notes:
  register: 格調ある序文の調子を保ちながら、現代の一般読者に明瞭な語彙を用いた。原文の長い一文が次節以降へ続くため、節末を「ので、」として従属節のまま残した。脚注記号は該当語句の直後に置いた。
