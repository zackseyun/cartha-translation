source:
  edition: SBLGNT
  text: καὶ εἶπαν πρὸς αὐτὴν ὅτι Οὐδείς ἐστιν ⸂ἐκ τῆς συγγενείας⸃ σου ὃς καλεῖται τῷ ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/061.yaml
  text: And they said to her[a], “None of your relatives is called by this name.”
translation:
  language: ja
  text: すると人々は彼女に言った。「あなたの親族には、その名で呼ばれている人は一人もいません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπαν πρὸς αὐτὴν
  choice: 彼女に言った
  rationale: 語りかける相手を示す πρός＋対格を、自然な現代日本語の「彼女に言った」とした。アオリストは物語上の出来事として訳した。
- source_word: Οὐδείς ἐστιν ἐκ τῆς συγγενείας σου
  choice: あなたの親族には…人は一人もいません
  rationale: συγγένεια は血縁・親族集団を表すため「親族」とした。ἐκ の部分的な意味と οὐδείς の全面否定を、日本語で自然な「親族には…一人もいません」で表した。
- source_word: ὃς καλεῖται
  choice: 呼ばれている人
  rationale: 名前について用いられる καλέω の現在受動態を、原文の形に近く自然な「呼ばれている」とした。「名づけられている」よりも、現にその名を用いている意味が明瞭である。
- source_word: τῷ ὀνόματι τούτῳ
  choice: その名で
  rationale: 直前に提案された「ヨハネ」という名を指す指示表現なので、日本語の談話では自然な「その名」とした。与格の用法は「名で」と表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「すると」で前節への応答の流れを示し、親族関係と命名慣習に関する発言を簡潔に保った。
