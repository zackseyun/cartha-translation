  text: ἵνα ἐπιγνῷς περὶ ὧν κατηχήθης λόγων τὴν ἀσφάλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/004.yaml
  text: so that you may know the certainty of the things about which you were instructed[a][b].
translation:
  language: ja
  text: それは、あなたが教えを受けた[b]事柄について、その確かさ[a]を知るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信頼性」。このギリシア語は、確実性、揺るぎなさ、信頼性を表すことがあります。
    reason: lexical_alternative
  - marker: b
    text: 別訳「教えられた」。この動詞は、口頭で教えを授けることを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ～ためです
  rationale: 目的を示す接続詞の働きを、現代日本語で自然な目的表現として訳した。
- source_word: ἐπιγνῷς
  choice: 知っていただく
  rationale: 目的節中のアオリスト接続法。文脈上の相手への敬意を保ちつつ、「十分に」を加えて語義を過度に強めることは避けた。
- source_word: περὶ ὧν
  choice: 事柄が…ことを
  rationale: 日本語として不自然な「それらについての確かさを知る」を避け、教えられた内容とその確かさの関係を節構造で明確にした。
- source_word: κατηχήθης
  choice: 教えを受けた
  rationale: 口頭で教授・指導されたことを自然に表し、後代の専門用語「教理教育を受けた」を本文に持ち込まない。
- source_word: λόγων
  choice: 事柄
  rationale: ここでは個々の「言葉」より、教えの内容・事項を指すと考えられるため、日本語で自然な「事柄」とした。
- source_word: τὴν ἀσφάλειαν
  choice: 確かなものである
  rationale: 確実性、信頼性、揺るぎなさを含み得る語。名詞を叙述表現にして自然な日本語としつつ、その意味の幅を保った。
theological_decisions:
- issue: ルカが執筆によって知らせようとした「確かさ」の性質
  choice: 教えられた事柄が「確かなものである」と訳し、客観的信頼性とそれを知ることによる確信の双方を含み得る表現とした。
  alternative: 「真実である」「間違いない」「安心できる」と限定して訳す。
  rationale: ἀσφάλειαは確実性・安全性・信頼性を表し得るため、内面的な安心だけ、または歴史的事実性だけに限定せず、原文の認識論的・神学的な幅を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。テオフィロへの丁寧な語調を「知っていただく」に反映した。脚注記号は対応語句の直後に置いた。
