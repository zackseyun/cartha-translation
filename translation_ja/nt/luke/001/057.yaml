base_translation:
  language: en
  yaml_path: translation/nt/luke/001/057.yaml
  text: The time was fulfilled for Elizabeth to give birth[a], and she bore a son.
translation:
  language: ja
  text: さて、エリサベトは出産する時が満ちて、男の子を産んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エリサベトは出産の時を迎え、男の子を産んだ。」
    reason: 「時が満ちる」という原文に近い表現に対し、より慣用的な日本語を示す。
lexical_decisions:
- source_word: δὲ
  choice: さて
  rationale: 物語を穏やかに先へ進める接続辞。明示的な時間副詞とはせず、現代日本語で自然な場面転換を示す。
- source_word: ἐπλήσθη ὁ χρόνος
  choice: 時が満ち
  rationale: 期間が完了したことを表す原文の比喩的表現を保ちつつ、日本語として簡潔で荘重な言い方とした。
- source_word: τοῦ τεκεῖν αὐτήν
  choice: エリサベトは出産の
  rationale: 属格付き冠詞的不定詞が示す、彼女が産むべき時という内容を、主語を明確にして自然な日本語にした。
- source_word: ἐγέννησεν
  choice: 産んだ
  rationale: 完了した出産の出来事を表すアオリストを、簡潔な物語過去として訳した。
- source_word: υἱόν
  choice: 男の子
  rationale: 息子であることを明示する語の性別情報を保持し、この出産場面で自然な日本語とした。
- source_word: Ἐλισάβετ
  choice: エリサベト
  rationale: 日本語聖書で広く定着した音写を用いた。
