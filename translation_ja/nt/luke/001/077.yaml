  text: τοῦ δοῦναι γνῶσιν σωτηρίας τῷ λαῷ αὐτοῦ ἐν ἀφέσει ἁμαρτιῶν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/077.yaml
  text: to give knowledge of salvation to his people in the forgiveness of their sins,[a]
translation:
  language: ja
  text: その民に、彼らの罪の赦しのうちにある救いについての知識を与えるためである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの罪の赦しを通して救いを知ること」または「彼らの罪の赦しによって救いを知ること」。
    reason: ἐν ἀφέσει は、領域・様態のほか、手段に近い意味にも理解できるため。
lexical_decisions:
- source_word: τοῦ δοῦναι
  choice: 与えるためである
  rationale: 冠詞付き不定詞が前節に続く目的を表すため、日本語では文脈とのつながりが明瞭な「与えるためである」とした。
- source_word: γνῶσιν σωτηρίας
  choice: 救いの知識
  rationale: 属格を保ちつつ、γνῶσιςを過度に解釈せず「知識」と訳した。「救い」はルカ文書の文脈にも適合する。
- source_word: τῷ λαῷ αὐτοῦ
  choice: その民に
  rationale: 与えられる知識の受け手を示す与格として訳した。αὐτοῦが誰を指すかは前後の文脈に委ね、「その民」として指示関係を保持した。
- source_word: ἐν ἀφέσει ἁμαρτιῶν αὐτῶν
  choice: 彼らの罪が赦されることにある
  rationale: ἐνの領域・様態の含みを「ことにある」で表し、救いの知識と罪の赦しとの密接な関係を示しつつ、手段や原因だけに限定しないようにした。ἁμαρτιῶνの複数形は、日本語では自然な集合表現「罪」で表した。
theological_decisions:
- issue: 救いと罪の赦しとの関係
  choice: 救いの知識は、彼らの罪が赦されることにある
  alternative: 救いの知識は、彼らの罪が赦されることを通して／それによって与えられる
  rationale: ἐν ἀφέσειは領域・様態・手段に近い複数の理解が可能である。本文では「にある」として結びつきを保ち、手段または原因の一義に狭めず、別訳を脚注に示した。
translation_notes:
  register: 現代標準日本語の明瞭で品位ある文体。「赦し」という名詞の重なりを避け、「罪が赦されること」として一般読者に自然な表現にした。前節から続く目的節であることを「ためである」で明示した。
