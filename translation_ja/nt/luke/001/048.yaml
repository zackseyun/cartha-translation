id: LUK.1.48
reference: Luke 1:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐπέβλεψεν ἐπὶ τὴν ταπείνωσιν τῆς δούλης αὐτοῦ, ἰδοὺ γὰρ ἀπὸ τοῦ νῦν μακαριοῦσίν με πᾶσαι αἱ γενεαί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/048.yaml
  text: because he has looked upon the humble state of his servant[a]. For behold[b], from now on all generations will call me blessed.
translation:
  language: ja
  text: ご自分の奴隷である私[a]の低い境遇[b]に目を留めてくださったからです。見よ、今から後、代々の人々は皆、私を幸いな者と呼ぶでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」は、「仕える者」または伝統的に「はしため」とも訳せる。原語は女性形で、主人に属する者を指す。
    reason: 語義の強さと伝統的な訳語の選択肢を示すため。
  - marker: b
    text: 「低い境遇」は、「低い身分」「卑しさ」または「辱め」とも訳せる。ここでは内面的な謙遜だけでなく、置かれた状態の低さを指す。
    reason: ταπείνωσις の語義的な幅と解釈上の緊張を保持するため。
lexical_decisions:
- source_word: ἐπέβλεψεν ἐπὶ
  choice: 目を留めてくださった
  rationale: 単に見るだけでなく、相手に顧みの目を向ける意味を表す。日本語では敬意を含む補助動詞「くださった」により、マリアが神の恵み深い顧みを賛美している文脈を自然に示した。
- source_word: ταπείνωσιν
  choice: 低い境遇
  rationale: 内面的な謙遜だけに限定せず、身分や置かれた状態の低さを表すため。「辱め」という意味の可能性は脚注に残した。
- source_word: δούλης
  choice: 奴隷である私
  rationale: 女性形の名詞であり、神に全面的に属する者という強い自己規定を弱めずに表した。「女奴隷」よりも現代日本語として自然な構文にした。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を促す強調表現を、賛歌の格調に合う簡潔な命令形で保持した。
- source_word: ἀπὸ τοῦ νῦν
  choice: 今から後
  rationale: 現在を起点として将来へ続く時間的意味を明確に表す。
- source_word: μακαριοῦσίν με
  choice: 私を幸いな者と呼ぶ
  rationale: マリアを幸いな者と認め、公にそう言うという意味を自然に保持した。
- source_word: πᾶσαι αἱ γενεαί
  choice: 代々の人々は皆
  rationale: ' successive generations を指す慣用的な意味を、単なる各世代という抽象表現ではなく人々を指す日本語として明瞭にした。'
theological_decisions:
- issue: マリアの自己規定 δούλη の訳し方
  choice: 奴隷である私
  alternative: 仕える者である私／はしためである私
  rationale: 神への奉仕だけでなく、神に属する者という語の強さを保った。後代のマリア論を付加せず、伝統的で柔らかな訳語の可能性は脚注で示した。
- issue: ταπείνωσις が表す低さの性質
  choice: 低い境遇
  alternative: 低い身分／卑しさ／辱め
  rationale: この箇所をマリアの内面的な謙遜だけに解消せず、社会的・外的な低い状態を中心に表した。一方で、原語が辱めや卑しさも表し得る幅は脚注に残した。
- issue: ἐπέβλεψεν に含まれる神の顧み
  choice: 目を留めてくださった
  alternative: 目を向けられた／顧みられた
  rationale: 神が単に認識したというより、低い者に好意をもって注意を向けたという賛歌の含意を自然な敬語で表した。
translation_notes:
  register: 現代標準日本語を基調としつつ、マリアの賛歌にふさわしい格調を「見よ」で保った。「奴隷である私」は原語の強さを保持しながら、「女奴隷」という不自然で侮蔑的にも響き得る名詞句を避けた。原文で明示されていない神の称号は補わず、日本語で主語を省略して前文脈とのつながりを保った。
