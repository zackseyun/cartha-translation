id: LUK.1.32
reference: Luke 1:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτος ἔσται μέγας καὶ υἱὸς Ὑψίστου κληθήσεται, καὶ δώσει αὐτῷ κύριος ὁ θεὸς τὸν θρόνον Δαυὶδ τοῦ πατρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/032.yaml
  text: He will be great and will be called the Son of the Most High[a], and the Lord God will give him the throne of David his father[c][b],
translation:
  language: ja
  text: この方[a]は偉大な者となり、いと高き方の子と呼ばれます[b]。主なる神は、この方に、その父ダビデの王座をお与えになります[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は指示代名詞で始まり、直訳すれば「この者は」。文脈上、これから生まれる子を指す。
    reason: lexical_alternative
  - marker: b
    text: 「いと高き方の子と名づけられます」とも訳せる。ここでは称号を与えられる意味。
    reason: lexical_alternative
  - marker: c
    text: 「父」はここで、ダビデ王家の系統における祖先ダビデを指す。
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: この方
  rationale: 直前に告げられた子を指す指示代名詞の働きを保ちつつ、人物への敬意を伴う自然な日本語とした。
- source_word: ἔσται μέγας
  choice: 偉大な者となり
  rationale: 未来形と、μέγαςが持つ広い意味での偉大さ・卓越性を、権力など一面に限定せず表した。
- source_word: υἱὸς Ὑψίστου
  choice: いと高き方の子
  rationale: Ὕψιστοςを神への称号として保ち、υἱόςの子としての関係を弱めずに訳した。
- source_word: κληθήσεται
  choice: 呼ばれます
  rationale: καλέωの未来受動形を素直に訳し、称号として呼ばれることを表した。
- source_word: κύριος ὁ θεὸς
  choice: 主なる神
  rationale: κύριοςを「主」とし、定冠詞を伴うまとまりを自然で格調ある日本語にした。
- source_word: δώσει αὐτῷ
  choice: この方に…お与えになります
  rationale: 与える主体が神であるため敬語を用い、与えられる相手を日本語で明確にした。
- source_word: τὸν θρόνον Δαυὶδ
  choice: ダビデの王座
  rationale: 王権とダビデへの約束を示す属格表現を簡潔に保持した。
- source_word: τοῦ πατρὸς αὐτοῦ
  choice: その父ダビデ
  rationale: πατήρの直接的な語義を保ち、単なる「先祖」と言い換えて王朝的な父子表現を薄めないようにした。
theological_decisions:
- issue: υἱὸς Ὑψίστουにおけるキリスト論的称号
  choice: 「いと高き方の子」として、子であることと称号の重みをそのまま示した。
  alternative: 「いと高き方の一人の子」
  rationale: 無冠詞であっても、この文脈では述語的・称号的な表現であり、不定の一人に限定する日本語を避けた。
- issue: κύριοςの訳語
  choice: 「主なる神」
  alternative: 「主である神」または「主なる神、ヤハウェ」
  rationale: ギリシア語本文はκύριοςを用いており、神名を明示していないため、神名を補わず「主」とした。
- issue: ダビデを「父」と呼ぶ王朝的表現
  choice: 本文では「その父ダビデ」を保持した。
  alternative: 「その先祖ダビデ」
  rationale: 系譜上の祖先という意味を注で明らかにしつつ、本文ではダビデ王朝の父子関係を示す聖書的表現を残した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、天使の告知にふさわしい品位を保った。「この方」と敬語表現を用いて自然な日本語にし、「いと高き方」「主なる神」「王座」によって聖書的・王的な響きを保持した。
