  text: Καὶ εἶπεν Μαριάμ· Μεγαλύνει ἡ ψυχή μου τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/046.yaml
  text: And Mary said[a], “My soul magnifies the Lord,”
translation:
  language: ja
  text: そして、マリアは言った。「私の魂は主をあがめます[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の魂は主の偉大さを告げ知らせます。」
    reason: μεγαλύνειは、主を「あがめる」とも、主の偉大さを宣言するとも表しうるため。
lexical_decisions:
- source_word: Καὶ
  choice: すると
  rationale: 単純な接続を保ちつつ、日本語の物語の流れとして自然に前節から発言を導く。強い時間的意味は加えていない。
- source_word: εἶπεν
  choice: 言った
  rationale: λέγωのアオリストを、物語の発言導入として自然な現代日本語で表した。
- source_word: Μαριάμ
  choice: マリア
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: Μεγαλύνει
  choice: あがめます
  rationale: ここでは、主を偉大な方としてたたえるという μεγαλύνω の賛美的意味を、自然で格調ある日本語にした。現在形の継続的・詩的な響きも表している。
- source_word: ἡ ψυχή μου
  choice: 私の魂
  rationale: 単なる「私」へ平板化せず、原文のセム語的・詩的な身体観・人間観を伴う表現を保持した。
- source_word: τὸν κύριον
  choice: 主
  rationale: 神を指す敬称としての κύριος を、聖書的重みを保つ定着した日本語で訳した。
theological_decisions:
- issue: κύριος の訳語
  choice: 主
  alternative: 主人
  rationale: この文脈では神に向けた聖書的な賛美の称号であり、「主人」では意味が狭くなるため、「主」とした。
- issue: ἡ ψυχή μου の人間論的表現
  choice: 私の魂
  alternative: 私は／私の全存在は
  rationale: 原文の詩的・神学的表現を解消せずに残し、現代的な心理概念だけに限定することも避けた。
- issue: μεγαλύνει の賛美表現
  choice: あがめます
  alternative: 偉大さを告げ知らせます
  rationale: 人が主を文字どおり大きくするという意味に誤解されない自然な日本語を選びつつ、主を偉大な方として宣言し、たたえるという含意を保持した。別訳は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、賛歌の冒頭にふさわしい簡潔で格調ある調子を保った。「私の魂」「主」により原文の聖書的・詩的表現を維持した。
