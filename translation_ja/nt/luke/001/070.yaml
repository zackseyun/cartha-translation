translation:
  language: ja
  text: 神が、昔からの聖なる預言者たちの口を通して語られたとおりである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「遠い昔から」。この表現は非常に古い時代を指し得る。「永遠の昔から」と取ることもできるが、ここでは預言者たちへの言及があるため、「昔から」の意味が適切である。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: とおりである
  rationale: 直前の内容が、神が以前に語ったことと一致していることを示す。日本語では節末に置くことで自然にその対応関係を表せる。
- source_word: ἐλάλησεν
  choice: 語られた
  rationale: λαλέωのアオリストを自然に表す。後続の「口を通して」という媒介表現ともよく結びつく。神を主語とする文脈に合わせて敬語形を用いた。
- source_word: διὰ στόματος
  choice: 口を通して
  rationale: 預言者を媒介として神が語るという聖書的な具体的比喩を保ち、単なる「通して」へ平板化しない。
- source_word: τῶν ἁγίων ... προφητῶν
  choice: ご自分の聖なる預言者たち
  rationale: ἁγίωνがπροφητῶνを修飾する構造を明確にし、神に属し、神のために聖別された預言者という意味を保つ。
- source_word: ἀπ’ αἰῶνος
  choice: 昔から
  rationale: 預言者たちへの言及に照らし、救済史における遠い過去からという時間的意味を、明瞭で現代的な日本語で表す。
- source_word: αὐτοῦ
  choice: ご自分の
  rationale: 文脈上、神を指す再帰的な所有関係を自然な日本語で示す。
theological_decisions:
- issue: ἀπ’ αἰῶνοςの時間的範囲
  choice: 救済史上の遠い昔（「昔から」）
  alternative: 「永遠の昔から」または「古代から」
  rationale: 直後ではなく同じ句内の「預言者たち」が時間表現の枠を定めているため、抽象的な永遠よりも、古くから続く預言者による証言を指すと理解するのが文脈に適う。ただし語句が遠い過去を幅広く表し得ることは脚注に残す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「口を通して」という原文の具体的な預言媒介の比喩を保持した。単独節として自然に読めるよう、καθὼςを節末の「とおりである」で表した。
