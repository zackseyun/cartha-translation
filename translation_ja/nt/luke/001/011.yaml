id: LUK.1.11
reference: Luke 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὤφθη δὲ αὐτῷ ἄγγελος κυρίου ἑστὼς ἐκ δεξιῶν τοῦ θυσιαστηρίου τοῦ θυμιάματος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/011.yaml
  text: Then an angel of the Lord appeared to him, standing at the right side of the altar of incense.
translation:
  language: ja
  text: すると、主の使いが彼に現れ、香の祭壇の右側に立っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: 現れ
  rationale: ὁράωのアオリスト受動形だが、ここでは自動詞的に「現れた」の意味で用いられている。突然、目に見える形で姿を現した出来事を自然な日本語で表す。
- source_word: δὲ
  choice: すると
  rationale: 物語の進展を示す接続辞。前後の出来事の流れを自然に示し、強い逆接は持ち込まない。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 出現を目撃した人物がザカリヤであることを、原文の与格に沿って明示する。
- source_word: ἄγγελος
  choice: 使い
  rationale: 神から遣わされた天的存在を表す文脈であり、「主の使い」は明瞭で格調ある聖書的表現である。
- source_word: κυρίου
  choice: 主の
  rationale: 属格構文ἄγγελος κυρίουを「主の使い」と訳し、κύριοςの称号としての意味を保つ。
- source_word: ἑστὼς
  choice: 立っていた
  rationale: ἵστημιの完了能動分詞で、現れた時点でその場所に立っている姿勢・状態を描く。日本語では継続状態として表すのが自然である。
- source_word: ἐκ δεξιῶν
  choice: 右側に
  rationale: 位置を示す慣用句であり、祭壇の右手側にいたことを簡潔に表す。誰の視点からの右かは原文同様に限定しない。
- source_word: θυσιαστηρίου τοῦ θυμιάματος
  choice: 香の祭壇
  rationale: 属格τοῦ θυμιάματοςが祭壇の種類を特定している。「香の祭壇」は、香をたくための祭壇を指す自然で簡潔な表現である。
theological_decisions:
- issue: ἄγγελος κυρίουにおけるκύριοςの訳
  choice: 主
  alternative: 主なる神
  rationale: 原文は単にκύριοςであり、「主」とすることで称号を保ちつつ、「神」を補って指示対象を過度に明示しない。
- issue: ἄγγελοςの訳語
  choice: 使い
  alternative: 天使
  rationale: 文脈上は天的存在だが、ἄγγελοςの「遣わされた者」という語義を保つ「使い」を採用する。「天使」も可能だが、原語にない「天」を訳語の形として加えない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「主の使い」「香の祭壇」によって簡潔で品位ある聖書本文の調子を保った。語順は日本語として自然になるよう整え、分詞ἑστὼςは「立っていた」と状態描写にした。
