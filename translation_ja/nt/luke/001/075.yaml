  text: ἐν ὁσιότητι καὶ δικαιοσύνῃ ἐνώπιον αὐτοῦ ⸂πάσαις ταῖς ἡμέραις⸃ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/075.yaml
  text: in holiness and righteousness before him all our days[a].
translation:
  language: ja
  text: 御前で、私たちのすべての日々を通して、聖さと正しさ[a]をもって。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義」。
    reason: δικαιοσύνηには倫理的な正しさのほか、公正・正義という意味もあり得るため。
lexical_decisions:
- source_word: ἐν ὁσιότητι καὶ δικαιοσύνῃ
  choice: 聖さと正しさをもって
  rationale: ἐνはここでは生き方・奉仕のあり方を表すため、「をもって」と自然に訳した。ὁσιότηςは神との関係における敬虔な聖さ、δικαιοσύνηは神の御前での倫理的な正しさを表し、両者の区別を保った。
- source_word: ἐνώπιον αὐτοῦ
  choice: 御前で
  rationale: αὐτοῦは文脈上、神を指す。「御前で」は神の臨在と評価のもとにあることを簡潔かつ敬意ある日本語で表す。
- source_word: πάσαις ταῖς ἡμέραις ἡμῶν
  choice: 生涯のすべての日々
  rationale: 直訳的な「私たちのすべての日々」が意味する、生きている間ずっとという継続性を、自然な日本語で明確にした。
theological_decisions:
- issue: δικαιοσύνηの訳語
  choice: 正しさ
  alternative: 正義
  rationale: ここではὁσιότηςと並び、神の御前での生活上の正しさを表す。「正義」も語義上可能だが、社会的・司法的な意味に限定されやすいため、本文ではより広い「正しさ」を採用し、別訳を脚注に残した。
translation_notes:
  register: 現代標準日本語による簡潔で格調ある表現。これは前節から続く目的句の一部なので、単独節として不要な述語を補わず、原文の構造を保った。
