id: LUK.1.15
reference: Luke 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔσται γὰρ μέγας ἐνώπιον ⸀τοῦ κυρίου, καὶ οἶνον καὶ σίκερα οὐ μὴ πίῃ, καὶ πνεύματος ἁγίου πλησθήσεται ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/015.yaml
  text: For he will be great before the Lord[a], and he will drink neither wine nor strong drink[c][b], and he will be filled with the Holy Spirit even from his mother’s womb.
translation:
  language: ja
  text: 主の前で偉大な者となるからです。ぶどう酒も強い酒[a]も決して飲まず、母の胎内にいる時から[b]聖霊に満たされます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「強い酒」は、ぶどう酒以外の酩酊性のある酒を指します。
    reason: cultural_note
  - marker: b
    text: 別訳「すでに母の胎内で」または「母の胎から」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μέγας
  choice: 偉大な者
  rationale: 人物の地位と重要性を含む標準的な訳であり、偉大さの性質を過度に限定しない。
- source_word: ἐνώπιον τοῦ κυρίου
  choice: 主の前で
  rationale: 神の御前で認められるという関係的・評価的な含みを簡潔に保つ。
- source_word: οἶνον καὶ σίκερα
  choice: ぶどう酒も強い酒も
  rationale: οἶνοςを明確にぶどう酒とし、σίκεραはぶどう酒以外の酩酊性飲料を広く指す伝統的表現で訳す。
- source_word: οὐ μὴ πίῃ
  choice: 決して飲まず
  rationale: οὐ μήとアオリスト接続法による強い否定を自然な日本語で表しつつ、命令か予告かを一方的に確定しない。
- source_word: πνεύματος ἁγίου πλησθήσεται
  choice: 聖霊に満たされます
  rationale: 未来受動の意味を保ち、ルカにおける神の霊という指示対象を自然に示す。
- source_word: ἔτι ἐκ κοιλίας μητρὸς αὐτοῦ
  choice: 母の胎内にいる時から
  rationale: 誕生前という非常に早い時点からの聖霊の働きを示し、『胎から』より自然で明瞭な現代日本語とする。
theological_decisions:
- issue: οὐ μὴ πίῃが予告か、献身に伴う禁止・義務か
  choice: 「決して飲まず」として強い否定を表す
  alternative: 「決して飲んではならず」として禁止を明示する
  rationale: 文法上は強い未来否定であり、文脈には献身の義務も含意され得るため、本文では強調を保ちながら様態を決めすぎない。
- issue: πνεύματος ἁγίουの指示対象
  choice: 「聖霊」
  alternative: 「聖なる霊」
  rationale: ルカの文脈では神の霊を指すのが自然であり、日本語の標準的な聖書用語を用いる。
- issue: ἔτι ἐκ κοιλίαςの時間的範囲
  choice: 「母の胎内にいる時から」
  alternative: 「母の胎から」または「すでに母の胎内で」
  rationale: 出生前の時点を示すことを明確にしつつ、受胎時からなのか胎内のある時点からなのかは限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準語。天使の発言に合わせて丁寧体を用いた。「主の前で」「聖霊」など定着した聖書語は保持し、強い否定と胎内からという時間表現の曖昧さを損なわないようにした。
