  text: καὶ ἐγένετο ἐπὶ πάντας φόβος τοὺς περιοικοῦντας αὐτούς, καὶ ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας διελαλεῖτο πάντα τὰ ῥήματα ταῦτα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/065.yaml
  text: And fear came upon all those living around them[b][a], and throughout all the hill country of Judea all these things were being talked about.
translation:
  language: ja
  text: すると、彼らの周りに住む人々は皆、恐れ[a]を抱いた。そして、これらの出来事[b]はすべて、ユダヤの山地一帯で話題にされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「恐れ」は、神の明らかな働きに触れて抱く「畏れ」の意味も含み得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳「これらの言葉はすべて」。ギリシア語は、語られた言葉だけでなく、語られている事柄や出来事をも指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐπὶ πάντας φόβος
  choice: 皆、恐れを抱いた
  rationale: 「恐れがすべての人の上に生じた」というギリシア語の出来事性を、明瞭で自然な現代日本語にした。単なる心理描写に狭めず、神の働きを目の当たりにした共同体全体の反応を表す。
- source_word: φόβος
  choice: 恐れ
  rationale: 語の基本的な意味を保ち、「畏敬」と断定して文脈の緊張を解消しない。ここでは神の明白な働きへの畏れを含み得るため、脚注でその幅を示す。
- source_word: τοὺς περιοικοῦντας αὐτούς
  choice: 彼らの周りに住む人々
  rationale: περιοικέω の「周囲・近くに住む」という空間的意味を明示し、「近所の人々」より原文に即した表現とした。
- source_word: ἐν ὅλῃ τῇ ὀρεινῇ τῆς Ἰουδαίας
  choice: ユダヤの山地一帯で
  rationale: ὀρεινήを地理的な「山地」とし、ἐν ὅλῃ の広がりを「一帯で」によって自然に表した。
- source_word: διελαλεῖτο
  choice: 語り合われていた
  rationale: 未完了過去の継続性と、人々の間で繰り返し話題にされていたという相互的・公的な言語活動を表した。
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: これらの出来事はすべて
  rationale: ῥήματαは「言葉」だけでなく、語られている事柄や出来事も指し得る。物語の要約として自然な「出来事」を本文に採りつつ、脚注で語義の幅を保持した。
theological_decisions:
- issue: 神の働きに対する φόβος の含意
  choice: 本文では「恐れ」と訳す
  alternative: 畏れ／畏敬
  rationale: 神の働きへの反応として恐怖と畏敬の双方を含み得るため、本文で一方に限定せず、基本義を保ったうえで脚注に含意を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書叙述にふさわしい落ち着いた語調と、原文の未完了過去が示す継続的な語り合いを保った。
