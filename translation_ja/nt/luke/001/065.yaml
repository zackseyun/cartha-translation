  terminology: 「恐れ」を本文に保ち、神の働きへの畏れの含意を脚注で示す処理は、φόβος の意味の幅を不必要に教義的に限定しない。「出来事」の脚注も、ῥήματα が「言葉」「事柄」を指し得ることを適切に示す。
