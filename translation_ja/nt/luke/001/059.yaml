id: LUK.1.59
reference: Luke 1:59
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῇ ⸂ἡμέρᾳ τῇ ὀγδόῃ⸃ ἦλθον περιτεμεῖν τὸ παιδίον, καὶ ἐκάλουν αὐτὸ ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ Ζαχαρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/059.yaml
  text: And it happened that on the eighth day they came to circumcise the child[a], and they were calling him Zechariah[b], after the name of his father.
translation:
  language: ja
  text: さて、八日目になると、幼子に割礼を施すために人々がやって来た。そして、父の名にちなんで、幼子をザカリヤと名づけようとしていた[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「幼子をザカリヤと名づけていた」。ギリシア語の未完了過去は、命名が進行中だったこと、またはそうしようとしていたことを示し得る。後者は、次節で母が異議を唱える展開によく合う。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「父の名によって幼子をザカリヤと呼んでいた」。家族の一員にちなんで子どもに名を付ける慣習を指す。
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: さて、～になると
  rationale: ルカに特徴的な物語導入句を、古風すぎない自然な現代日本語で表し、次の出来事への展開を示した。
- source_word: ἐν τῇ ἡμέρᾳ τῇ ὀγδόῃ
  choice: 八日目になると
  rationale: 特定の時点を示す表現として自然な日本語にした。割礼が八日目に行われたという時期を明確に保っている。
- source_word: ἦλθον
  choice: 人々がやって来た
  rationale: ギリシア語の主語は明示されない複数形である。日本語では文を明瞭にするため「人々」としたが、特定の集団名は加えていない。
- source_word: περιτεμεῖν
  choice: 割礼を施すために
  rationale: 目的を表す不定詞の働きを明確にし、「割礼を施す」という現代日本語として自然で敬意ある表現を用いた。
- source_word: τὸ παιδίον
  choice: 幼子
  rationale: 文脈上の乳幼児を指すπαιδίονを、聖書文として品位がありつつ理解しやすい「幼子」とした。
- source_word: ἐκάλουν
  choice: 名づけようとしていた
  rationale: 未完了過去が示し得る進行中または未遂の命名を表し、次節で母が異議を唱える流れにも適合する。ただし単に「名づけていた」とも訳せるため脚注に示した。
- source_word: ἐπὶ τῷ ὀνόματι τοῦ πατρὸς αὐτοῦ
  choice: 父の名にちなんで
  rationale: 父と同じ名を付けることを表す慣用句の意味を、自然で簡潔な日本語で明示した。
- source_word: Ζαχαρίαν
  choice: ザカリヤ
  rationale: 日本語聖書で広く通用する、この人物名の標準的な表記を採用した。
theological_decisions: []
