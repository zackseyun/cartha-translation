  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤκουσαν οἱ περίοικοι καὶ οἱ συγγενεῖς αὐτῆς ὅτι ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς, καὶ συνέχαιρον αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/058.yaml
  text: And her neighbors and relatives heard that the Lord had shown great mercy to her[a], and they rejoiced with her.
translation:
  language: ja
  text: 近所の人々と親族は、主が彼女に大きなあわれみを示された[a]ことを聞き、彼女とともに喜んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「彼女とともに、ご自分のあわれみを大いなるものとされた」。
    reason: 原文の μεγαλύνω（「大きくする」）と μετά（「ともに」）の字義的な形を示すため。
lexical_decisions:
- source_word: περίοικοι
  choice: 近所の人々
  rationale: 周囲に住む人々を指す。「近所の人々」は現代日本語として自然で、複数の住民を明確に表す。
- source_word: συγγενεῖς
  choice: 親族
  rationale: 血縁関係にある人々を指す、簡潔で品位ある現代語。
- source_word: ἐμεγάλυνεν
  choice: 大きな……を示された
  rationale: 字義的には「大きくする」だが、ἔλεος と結び付いたここでは、神が豊かなあわれみを実際に表されたことを意味する。日本語ではこの表現が自然であり、「大きな」に原語の強意も残る。
- source_word: κύριος
  choice: 主
  rationale: 文脈上、神を指す称号。冠詞のない形だが、定まった神的称号として訳す。
- source_word: ἔλεος
  choice: あわれみ
  rationale: 慈しみを伴う憐憫と恵みを表す。ルカの降誕物語における聖書的響きを保ちつつ、現代の読者にも理解できる語。
- source_word: μετ’ αὐτῆς
  choice: 彼女に
  rationale: 字義的には「彼女とともに」だが、ἐμεγάλυνεν τὸ ἔλεος の慣用的な結び付きでは、あわれみが彼女に向けて示されたことを表す。日本語の自然さを優先して与格的に訳した。
- source_word: συνέχαιρον αὐτῇ
  choice: 彼女とともに喜んだ
  rationale: 彼女の喜びを一緒に喜んだことを直接かつ自然に表し、「祝福した」などへの意味の限定を避ける。
theological_decisions:
- issue: ἐμεγάλυνεν κύριος τὸ ἔλεος αὐτοῦ μετ’ αὐτῆς の訳し方
  choice: 主が彼女に大きなあわれみを示された
  alternative: 主が彼女とともにご自分のあわれみを大いなるものとされた
  rationale: 原文の構成は字義的には「あわれみを大きくした」「彼女とともに」だが、全体として主が彼女に豊かなあわれみを施されたことを述べる慣用表現である。本文は自然な日本語で意味を伝え、原語の比喩的構成は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「あわれみ」は平仮名表記として読みやすさを確保し、「主」「親族」に聖書本文としての簡潔な品位を持たせた。
