source:
  edition: SBLGNT
  text: καὶ ἐγένετο ὡς ἤκουσεν ⸂τὸν ἀσπασμὸν τῆς Μαρίας ἡ Ἐλισάβετ⸃, ἐσκίρτησεν τὸ βρέφος ἐν τῇ κοιλίᾳ αὐτῆς, καὶ ἐπλήσθη πνεύματος ἁγίου ἡ Ἐλισάβετ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/041.yaml
  text: And it happened that[a], when Elizabeth heard Mary’s greeting, the baby leaped in her womb, and Elizabeth was filled with the Holy Spirit,
translation:
  language: ja
  text: さて、エリサベトがマリアの挨拶を聞くと、エリサベトの胎内の子が躍り、エリサベトは聖霊に満たされた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: さて
  rationale: ルカに特徴的な物語進行の定型句。出来事の発生を不自然に重ねず、現代日本語で場面の展開を示す。
- source_word: ὡς
  choice: ～すると
  rationale: アオリスト動詞を伴う時間表現として、挨拶を聞いた直後の出来事を自然に示す。
- source_word: ἀσπασμός
  choice: 挨拶
  rationale: マリアが口にした挨拶を指す、明瞭で現代的な訳語。
- source_word: ἐσκίρτησεν
  choice: 躍り
  rationale: 胎内の子の突然の生き生きとした動きを表し、原語の鮮明さを保つ。
- source_word: βρέφος
  choice: 子
  rationale: 胎内にいるヨハネを指す。日本語では「胎内の子」が自然であり、年齢や出生後の状態を余分に限定しない。
- source_word: κοιλία
  choice: 胎内
  rationale: この文脈では母の子宮内を指すため、品位があり自然な日本語とした。
- source_word: ἐπλήσθη
  choice: 満たされた
  rationale: 受動態を保持し、働きかける主体を本文以上に明示しない。
- source_word: πνεύματος ἁγίου
  choice: 聖霊
  rationale: ルカ文書で神の霊を指す通常の表現として、日本語の定着した訳語を用いる。
theological_decisions:
- issue: πνεύματος ἁγίου の指示対象
  choice: 神の霊を指す「聖霊」
  alternative: 「聖なる霊」または「ある聖なる霊」
  rationale: ルカ文書でこの表現は通常、預言的な語りをもたらす神の霊を指す。本文を越えた教理説明は加えず、定着した呼称を用いた。
- issue: 胎内の βρέφος の訳し方
  choice: 子
  alternative: 赤ん坊、幼子
  rationale: 胎内にいるヨハネへの具体的な言及を保ちつつ、現代日本語の「胎内の子」という自然な表現にした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。ルカの物語進行は「さて」で示し、出来事の即時的な連続は「聞くと」で簡潔に表した。
