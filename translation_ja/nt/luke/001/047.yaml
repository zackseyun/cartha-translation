  text: καὶ ἠγαλλίασεν τὸ πνεῦμά μου ἐπὶ τῷ θεῷ τῷ σωτῆρί μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/047.yaml
  text: and my spirit has rejoiced in God my Savior[a].
translation:
  language: ja
  text: そして、私の霊は私の救い主である神を大いに喜びました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「歓喜しました」。
    reason: ἠγαλλίασενが表す強い喜びを示す別訳。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節との詩的な並行関係を明確に結ぶ、自然な接続表現とした。
- source_word: ἠγαλλίασεν
  choice: 喜びにあふれました
  rationale: この動詞が表す強くあふれる喜びを、現代日本語で自然に伝える。アオリスト直説法は、ここでは完了した喜びの表明として過去形で表した。
- source_word: τὸ πνεῦμά μου
  choice: 私の霊
  rationale: 前節の「私の魂」との詩的な並行を保ちつつ、異なるギリシア語が用いられていることも保持した。
- source_word: ἐπὶ τῷ θεῷ
  choice: 神にあって
  rationale: 喜びの根拠・対象となる神との関係を簡潔に表す。「神のゆえに」も可能だが、原因だけに狭めず原文の含みを残した。
- source_word: τῷ σωτῆρί μου
  choice: 私の救い主である
  rationale: 神を話者自身の救い主と直接呼ぶ原文を、説明を加えず明確に訳した。
theological_decisions:
- issue: 神を「私の救い主」と呼ぶ表現
  choice: 私の救い主である神
  alternative: 私を救い出してくださる神
  rationale: σωτήρの直接的で神学的な重みを保ち、救いの具体的な様態を訳文で限定しないため。
- issue: 「私の霊」と前節の「私の魂」との関係
  choice: 異なる語として「私の霊」を保持する
  alternative: 「私の心」などに統合する
  rationale: 両者には詩的な意味の重なりがあるが、原文が異なる語を用いるため、その区別と解釈上の余地を残した。
- issue: ἐπί＋与格が示す喜びの関係
  choice: 神にあって
  alternative: 神のゆえに
  rationale: 神が喜びの根拠・機縁であるという意味を保ちながら、単なる原因関係に限定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、賛歌にふさわしい品位を保った。「神にあって」はやや聖書的な表現だが、ἐπί＋与格の関係的・根拠的な幅を簡潔に保持するため採用した。
