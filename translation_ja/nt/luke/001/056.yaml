  text: Ἔμεινεν δὲ Μαριὰμ σὺν αὐτῇ ⸀ὡς μῆνας τρεῖς, καὶ ὑπέστρεψεν εἰς τὸν οἶκον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/056.yaml
  text: And Mary stayed with her about three months[a], and returned to her home.
translation:
  language: ja
  text: マリアは彼女と一緒に三か月ほど過ごし、それから自分の家に帰った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔμεινεν
  choice: 過ごし
  rationale: ここでは、ある場所に一定期間とどまったことを表す。「滞在し」も可能だが、「彼女と一緒に」と自然につながる現代日本語として「過ごし」を選んだ。
- source_word: δὲ
  choice: （独立した語では訳出しない）
  rationale: 弱い叙述上の接続を示す語であり、日本語では文脈の流れによって十分に表せるため、機械的な接続詞は置かなかった。
- source_word: Μαριὰμ
  choice: マリア
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: σὺν αὐτῇ
  choice: 彼女と一緒に
  rationale: σύνと与格が示す同伴を明確に表す。代名詞の指示対象は文脈上エリサベトだが、原文どおり代名詞を保った。
- source_word: ὡς μῆνας τρεῖς
  choice: 三か月ほど
  rationale: 時間表現に伴うὡςの概数の意味を、自然な日本語の「ほど」で表した。
- source_word: καὶ
  choice: それから
  rationale: 二つの出来事の叙述上の連続を、自然な日本語で明示した。
- source_word: ὑπέστρεψεν
  choice: 帰った
  rationale: 元いた場所へ戻ることを表す。目的地が自分の家なので、「戻った」より「帰った」が自然である。
- source_word: εἰς τὸν οἶκον αὐτῆς
  choice: 自分の家に
  rationale: 移動先としてのοἶκοςを「家」とし、αὐτῆςが主語マリアを指すことを日本語の再帰表現「自分の」で明確にした。
