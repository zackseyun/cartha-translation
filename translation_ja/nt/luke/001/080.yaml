source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανε καὶ ἐκραταιοῦτο πνεύματι, καὶ ἦν ἐν ταῖς ἐρήμοις ἕως ἡμέρας ἀναδείξεως αὐτοῦ πρὸς τὸν Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/080.yaml
  text: And the child kept growing and becoming strong in spirit[c][b][a], and he was in the wilderness until the day of his public appearance to Israel.
translation:
  language: ja
  text: さて、その子は成長し続け、霊において強くなっていった。[a] そして、イスラエルの前に公に現れる日まで、荒れ野にいた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御霊において」とも訳せる。ギリシア語は、内面的・霊的に強くなったこととも、聖霊との関わりにおいて強められたこととも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「荒れ野の各地に」とも訳せる。ギリシア語は複数形で、文字どおりには「荒れ野の諸地域」「人里離れた場所」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδίον
  choice: その子
  rationale: 幼年期のヨハネを指す。年齢段階を「少年」とまで限定せず、文脈上自然な「その子」とした。
- source_word: ηὔξανε
  choice: 成長し続け
  rationale: 未完了過去の継続的な成長を表す。
- source_word: ἐκραταιοῦτο
  choice: 強くなっていった
  rationale: 進行する強化を示し、受動か自動詞的意味かを不必要に限定しない。
- source_word: πνεύματι
  choice: 霊において
  rationale: 与格が示す領域・点を保ち、内面的な霊を指すか聖霊との関係を指すかを本文で断定しない。
- source_word: ἐν ταῖς ἐρήμοις
  choice: 荒れ野に
  rationale: 複数形は荒涼とした諸地域を示し得るが、日本語本文では集合的な「荒れ野」が自然である。複数の含みは脚注に残す。
- source_word: ἀναδείξεως
  choice: 公に現れる
  rationale: 人々の前に示され、公的活動へ登場する意味を、現代日本語で明瞭に表す。
- source_word: πρὸς τὸν Ἰσραήλ
  choice: イスラエルの前に
  rationale: イスラエルの民を相手・聴衆として公に現れる方向性を自然に表す。
theological_decisions:
- issue: πνεύματιがヨハネの内なる霊を指すか、聖霊を指すか
  choice: 本文は「霊において」とし、指示対象を限定しない
  alternative: 「御霊によって」「霊的に」
  rationale: 無冠詞のπνεύματιだけでは聖霊への明示的言及と断定できない一方、単なる心理的強さにも狭めるべきでないため、原文の幅を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「さて」で前節からの場面転換を示し、二つの未完了過去は「成長し続け」「強くなっていった」として継続性を表した。
