  text: ἀντελάβετο Ἰσραὴλ παιδὸς αὐτοῦ, μνησθῆναι ἐλέους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/054.yaml
  text: He has helped Israel his servant[a], in remembrance of mercy[b],
translation:
  language: ja
  text: 神は、憐れみを覚えて、ご自分のしもべであるイスラエルを助けられた。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ご自分の子であるイスラエル」とも訳せる。ギリシア語のπαῖς（パイス）は「しもべ」と「子」のどちらも意味しうるが、ここでは旧約聖書でイスラエルが神のしもべと呼ばれる用法を踏まえ、「しもべ」とした。
    reason: lexical_alternative
  - marker: b
    text: 「憐れみ」には、契約に根差した憐れみ、または憐れみ深い真実さという含みもありうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντελάβετο
  choice: 助け
  rationale: この動詞は、支えるために手を取ること、すなわち援助することを表す。日本語では「助け」が簡潔で自然であり、神の救いの働きを示すアオリストの要約的な力も伝えられる。
- source_word: Ἰσραὴλ
  choice: イスラエル
  rationale: 固有名を標準的な日本語表記で示した。文脈上、族長個人ではなくイスラエルの民を集合的に指す。
- source_word: παιδὸς
  choice: しもべ
  rationale: παῖςには「しもべ」と「子」の両義があるが、ここでは旧約聖書における神のしもべイスラエルという表現との響き合いから「しもべ」を本文に採用した。語義上の別の可能性は脚注に残した。
- source_word: αὐτοῦ
  choice: ご自分の
  rationale: 神とイスラエルとの所属関係を自然な敬意ある日本語で表した。
- source_word: μνησθῆναι
  choice: 思い起こされた
  rationale: 神があわれみを覚えて行動に移すという意味を、本文の語順と不定詞の関連を保ちながら自然な日本語で示した。
- source_word: ἐλέους
  choice: あわれみ
  rationale: ἔλεοςの中心的意味である慈悲と同情を簡潔に表す。契約に根差した忠実なあわれみという含みは、本文に説明を加えず脚注で示した。
theological_decisions:
- issue: イスラエルを指すπαῖςの意味
  choice: ご自分のしもべイスラエル
  alternative: ご自分の子イスラエル
  rationale: 語そのものには両義性があるが、七十人訳、とりわけイザヤ書に見られる「しもべイスラエル」との間テクスト的な響きを考慮した。家族的な意味の可能性を排除せず、脚注で保持する。
- issue: μνησθῆναι ἐλέουςの意味合い
  choice: あわれみを思い起こされた
  alternative: あわれみを心に留められた
  rationale: 神の想起があわれみ深い行動として現れることを示しつつ、「契約」という語を本文に補って意味を限定することは避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、賛歌にふさわしい簡潔さと品位を保った。「しもべ」は現代語としてやや荘重だが、聖書的な間テクスト性を伝えるために適切である。神への敬意は「ご自分」「られた」で自然に示した。
