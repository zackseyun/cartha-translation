id: LUK.1.2
reference: Luke 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς παρέδοσαν ἡμῖν οἱ ἀπ’ ἀρχῆς αὐτόπται καὶ ὑπηρέται γενόμενοι τοῦ λόγου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/002.yaml
  text: just as those who from the beginning were eyewitnesses and became servants of the word handed them down to us,[a]
translation:
  language: ja
  text: 初めから目撃者であり、ことば[a]に仕える者となった人たちが、私たちに伝えたとおりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「知らせ」。ギリシア語の λόγος（ロゴス）は「ことば」「知らせ」「語られた内容」などを意味し、ここではイエスについて宣べ伝えられた知らせを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: とおり
  rationale: 前節の内容との対応を示す接続語であり、日本語では文末の「伝えたとおり」とすることで自然にその比較・対応関係を表せる。
- source_word: παρέδοσαν
  choice: 伝えた
  rationale: 受け継いだ出来事や証言を他者へ伝達する意味。日本語の「伝えた」は、権威ある伝承という含みを過度に制度化せず、文脈に即して表す。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 与格の間接目的語を明確に訳した。
- source_word: οἱ ἀπ’ ἀρχῆς
  choice: 初めから…人たち
  rationale: 定冠詞を伴う句が一群の人々を指すことと、その人々が出来事の初めから関わっていたという時間的意味を保つ。
- source_word: αὐτόπται
  choice: 目撃者
  rationale: 自分の目で直接見た者を指す標準的で明瞭な訳語。
- source_word: ὑπηρέται
  choice: 仕える者
  rationale: 奉仕する者という意味を表しつつ、特定の教会職制を連想させうる「教役者」などを避けた。
- source_word: γενόμενοι
  choice: となった
  rationale: 「なる」を意味する分詞の動きを保ち、「目撃者であり、ことばに仕える者となった」と訳した。
- source_word: τοῦ λόγου
  choice: ことば
  rationale: λόγοςの語義の広がりを保つ簡潔な訳。ここではイエスについて宣べ伝えられた知らせを指す可能性が高いが、本文ではそれに限定せず、脚注で示す。
theological_decisions:
- issue: τοῦ λόγουが何を指すか
  choice: 本文では「ことば」とし、イエスについての宣教の知らせを指す可能性を脚注で示す
  alternative: 「知らせ」または「語られた内容」
  rationale: ここでλόγοςをキリスト論的称号としての「ロゴス」と断定する根拠は乏しく、イエスについて伝えられた知らせを指す可能性が高い。ただし、その意味に狭く限定せず原語の幅を残した。
- issue: γενόμενοιと二つの名詞の関係
  choice: 「目撃者であり、ことばに仕える者となった」
  alternative: 「目撃者またことばに仕える者であった」
  rationale: γενόμενοιの「となった」という動きを表しながら、本文にない明示的な「後に」は加えない。
translation_notes:
  register: 明瞭な現代標準語を用い、文脈上前節と続く構文であることを「とおり」で示した。「みことば」は解釈的・宗教的な響きを強めうるため、原語に近い「ことば」とした。
