id: LUK.1.79
reference: Luke 1:79
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπιφᾶναι τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις, τοῦ κατευθῦναι τοὺς πόδας ἡμῶν εἰς ὁδὸν εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/079.yaml
  text: to shine on those sitting in darkness and the shadow of death[a], to guide our feet into the way of peace.
translation:
  language: ja
  text: 闇と死の陰に座っている者たちを照らし[a]、私たちの足を平和の道へと導くためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死の影」。この句をより広く「深い闇」と理解する見方もあるが、ギリシア語には「死」が明記されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιφᾶναι
  choice: 照らし
  rationale: 光が闇の中に差し込む比喩を保ちつつ、現代日本語として自然にした。不定詞は前後の文脈に結びつく目的を表すため、後半の「導くため」と一体の構文にした。
- source_word: τοῖς ἐν σκότει καὶ σκιᾷ θανάτου καθημένοις
  choice: 闇と死の陰に座っている者たち
  rationale: καθημένοις の「座っている」という具体的な像を残し、イザヤ書を思わせる表現との響きも保った。「住む」などへの平滑化は避けた。
- source_word: σκότει
  choice: 闇
  rationale: 字義的意味と比喩的意味の双方を保てる標準的で簡潔な訳語。
- source_word: σκιᾷ θανάτου
  choice: 死の陰
  rationale: θανάτου を明示し、聖書的な比喩と原文の属格構造を保った。「暗黒」と意訳して死への言及を消すことは避けた。
- source_word: τοῦ κατευθῦναι
  choice: 導くため
  rationale: 足と道の比喩に自然に合い、方向づける働きを表す。定冠詞付き不定詞の目的的な機能も「ため」で示した。
- source_word: τοὺς πόδας ἡμῶν
  choice: 私たちの足
  rationale: 身体的な比喩を抽象化せず、そのまま明瞭な日本語で残した。
- source_word: εἰς ὁδὸν εἰρήνης
  choice: 平和の道へと
  rationale: εἰς の方向性を「へと」で表し、ὁδός の道の比喩と εἰρήνης の幅を保った。「平和をもたらす道」のような因果的解釈は加えていない。
theological_decisions:
- issue: 闇、死の陰、足、道という比喩をどこまで解釈して訳すか
  choice: 比喩を本文にそのまま残す
  alternative: 「霊的な闇と死にある者を照らし、平和をもたらす生き方へ私たちを導く」と説明的に訳す
  rationale: 原文は詩的かつ聖書間の響きを持つため、闇を無知、道を倫理的生活など一義的な内容に限定せず、神学的な広がりと緊張を保った。
- issue: σκιᾷ θανάτου における θανάτου の扱い
  choice: 「死の陰」として死を明示する
  alternative: 「深い闇」と訳す
  rationale: 旧約の対応表現には「深い闇」と理解できる余地があるが、ここでのギリシア語は θανάτου を明示するため、本文では「死」を保持した。別解は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、賛歌の詩的で荘重な調子を保った。「座っている」「足」「道」という具体的な像を残し、説明的な意訳は避けた。
