id: LUK.1.19
reference: Luke 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ὁ ἄγγελος εἶπεν αὐτῷ· Ἐγώ εἰμι Γαβριὴλ ὁ παρεστηκὼς ἐνώπιον τοῦ θεοῦ, καὶ ἀπεστάλην λαλῆσαι πρὸς σὲ καὶ εὐαγγελίσασθαί σοι ταῦτα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/019.yaml
  text: And the angel answered him[a], “I am Gabriel, who stands in the presence of God, and I was sent to speak to you and to bring you this good news.”
translation:
  language: ja
  text: すると天使は彼に答えた。「私はガブリエル、神の御前に立つ者です。あなたに語り、この良い知らせを伝えるために遣わされたのです。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「これらのことを良い知らせとしてあなたに告げるため」。 「これらのこと」は、ガブリエルが今しがた告げた内容を指す。
    reason: ταῦταを含む原文の語法と、より字義的な訳を示すため。
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 答えた
  rationale: 直訳的な分詞構文を避け、直接話法を自然に導く日本語の定動詞で表した。
- source_word: ἄγγελος
  choice: 天使
  rationale: ガブリエルと名乗る天上の使者であるという文脈から、「使者」よりも具体的な「天使」が適切である。
- source_word: Ἐγώ εἰμι Γαβριὴλ
  choice: 私はガブリエル
  rationale: 明示された一人称代名詞の強調を「私は」で保ち、固有名は日本語で定着した形に音写した。
- source_word: ὁ παρεστηκὼς
  choice: 立つ者
  rationale: 完了分詞が示す、神の前に立って仕える継続的な身分・状態を簡潔に表した。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の御前に
  rationale: 神の臨在と宮廷的な場面の両方を伝える、自然で荘重な表現を選んだ。
- source_word: ἀπεστάλην
  choice: 遣わされた
  rationale: アオリスト受動態を受動表現で保ち、神からの派遣という含意を余計に補わず伝えた。
- source_word: λαλῆσαι πρὸς σὲ
  choice: あなたに語り
  rationale: 派遣の目的を示す不定詞と、語りかける相手を明示する前置詞句を簡潔に反映した。
- source_word: εὐαγγελίσασθαί σοι ταῦτα
  choice: この良い知らせを伝える
  rationale: εὐαγγελίζωの「良い知らせを告げる」という意味を現代日本語で自然に示し、ταῦταは直前に告げられた内容を指すまとまりとして訳した。字義的な形は脚注に示した。
theological_decisions:
- issue: εὐαγγελίζωを天使の告知場面でどう訳すか
  choice: 良い知らせを伝える
  alternative: 福音を宣べ伝える／喜びの知らせを告げる
  rationale: 後代の専門用語として受け取られやすい「福音」を避けつつ、動詞本来の「良い知らせを告げる」という意味と神学的な響きを保った。
- issue: ὁ παρεστηκὼςが表すガブリエルの立場
  choice: 神の御前に立つ者
  alternative: 神の御前に立っている者／神に仕える者
  rationale: 「仕える」は文脈上あり得る含意だが原文には明記されていないため補わず、「立つ」という比喩的・宮廷的表現を保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、天使の自己紹介には「神の御前」「遣わされた」という品位ある聖書的表現を採用した。文末の「のです」は、叱責に先立つガブリエルの権威ある説明を自然に響かせる。
