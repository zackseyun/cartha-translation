source:
  edition: SBLGNT
  text: Ἀναστᾶσα δὲ Μαριὰμ ἐν ταῖς ἡμέραις ταύταις ἐπορεύθη εἰς τὴν ὀρεινὴν μετὰ σπουδῆς εἰς πόλιν Ἰούδα,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/039.yaml
  text: In those days Mary arose and went with haste into the hill country[a], to a town of Judah,
translation:
  language: ja
  text: そのころ、マリアは立ち上がり、急いで山地にあるユダ地方の町[a]へ向かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダ地方の都市へ」「ユダヤ地方の町へ」、または「ユダという町へ」。ギリシア語の「ポリス」は「町」と「都市」のいずれも意味し得る。「ユダ」はユダ地方（ユダヤ地方）を指すとも、町の名を指すとも解し得る。
    reason: πόλιςの規模とἸούδαの地理的・構文的な解釈に幅があるため。
lexical_decisions:
- source_word: Ἀναστᾶσα
  choice: 立ち上がり
  rationale: アオリスト分詞で、主動詞に先立つ動作を示す。「出発し」と意訳せず、物語の動作の順序を保った。
- source_word: δὲ
  choice: （独立した語としては訳出しない）
  rationale: 弱い場面転換を示す接続辞であり、日本語では冒頭の「そのころ」と文脈の流れによって自然に表した。
- source_word: ἐν ταῖς ἡμέραις ταύταις
  choice: そのころ
  rationale: 字義的には「その日々に」だが、現代日本語で自然な時間表現とした。
- source_word: ἐπορεύθη
  choice: 向かった
  rationale: πορεύομαιはここでは移動を表す。「行った」よりも、後続する目的地とのつながりが自然である。
- source_word: εἰς τὴν ὀρεινὴν
  choice: 山地に
  rationale: 形容詞ὀρεινήの名詞的用法で、山岳・丘陵地域を指す。簡潔で自然な「山地」とした。
- source_word: μετὰ σπουδῆς
  choice: 急いで
  rationale: σπουδήには熱心さ、勤勉さ、急ぐことの意味幅があるが、移動の文脈では迅速さを表す「急いで」が最も自然である。
- source_word: εἰς πόλιν Ἰούδα
  choice: ユダ地方の町へ
  rationale: πόλιςは町にも都市にも使われる。Ἰούδαはこの文脈では地域・部族名と理解し、「ユダ地方の町」としたが、別の構文理解も注で示した。
theological_decisions:
- issue: Ἰούδαの同定
  choice: 地域・部族を示す「ユダ地方」
  alternative: 「ユダヤ地方」、または「ユダという町」
  rationale: 文脈上は地域名と取るのが自然だが、ギリシア語の形だけでは「ユダ」という町名と取る可能性を完全には排除できないため、本文では有力な読みを採り、注で曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、物語文としての品位を保った。「そのころ」で時間設定と緩やかな場面転換をまとめて表し、「立ち上がり」「急いで」「向かった」によって原文の動作の順序を保った。
