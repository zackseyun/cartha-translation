  text: And the whole multitude of the people was praying outside at the hour of the incense offering[a].
translation:
  language: ja
  text: 民の群衆全体が、香をたく時刻に[a]、外で祈っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「香の時に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν τὸ πλῆθος
  choice: 群衆は皆
  rationale: 集合体全体を指す強調を、現代日本語として自然な「群衆は皆」で表した。
- source_word: τοῦ λαοῦ
  choice: 民の
  rationale: 神殿の文脈では契約の民が想定されるが、原文に明記されない「イスラエル」は補わず、「民」とした。
- source_word: προσευχόμενον
  choice: 祈っていた
  rationale: ἦνとの迂言的構文が示す継続中の動作を自然に表した。「一緒に」は明示されていないため加えていない。
- source_word: ἔξω
  choice: 外で
  rationale: 原文どおり場所を「外」とし、「聖所の外」などの文脈上の補足は本文に加えなかった。
- source_word: τῇ ὥρᾳ
  choice: 時刻に
  rationale: 定められた礼拝の時を示すὥραについて、予定された一点を自然に示す「時刻」を選んだ。
- source_word: τοῦ θυμιάματος
  choice: 香をたく
  rationale: 神殿祭儀における香をたく行為を、一般読者に明瞭な表現で示した。θυμίαμα自体を「香」と取る余地は脚注に残した。
theological_decisions:
- issue: θυμίαμαの神殿祭儀用語としての表現
  choice: 香をたく時刻
  alternative: 香の時刻
  rationale: 祭儀の場面を分かりやすく示しつつ、「いけにえ」など原文以上の神学的含意は加えなかった。名詞「香」により近い表現も脚注で示した。
translation_notes:
  register: 明瞭で現代的かつ品位のある標準日本語。「民」は聖書的文脈を保ちながら、原文にない「イスラエル」を補わない。「群衆は皆」によりπᾶνの全体性を自然に表現した。
