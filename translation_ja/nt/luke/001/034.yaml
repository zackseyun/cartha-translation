base_translation:
  language: en
  yaml_path: translation/nt/luke/001/034.yaml
  text: But Mary said to the angel[a], “How will this be, since I have not known a man?”
translation:
  language: ja
  text: マリアは天使に言った。「このことは、どのようにして起こるのでしょうか。私は男の人を知りません[a]から。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「男の人を知りません」は、男性と性的関係を持ったことがないという意味の婉曲な表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 天使の告知を受けたマリアの問いへの転換と、そこにある軽い対照を自然な日本語で示す。強い反論を表すものではない。
- source_word: Μαριὰμ
  choice: マリア
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: πρὸς τὸν ἄγγελον
  choice: 天使に
  rationale: ἄγγελος は「使者」の意味も持つが、ここでは天上の存在を指すことが文脈上明らかなため、「天使」とした。
- source_word: Πῶς ἔσται τοῦτο
  choice: このことは、どのようにして起こるのでしょうか
  rationale: Πῶς の方法・成り行きを問う意味を「どのようにして」で明示し、ἔσται τοῦτο は告げられた受胎と出産が実現することを指すため、自然な日本語の「起こる」とした。
- source_word: ἐπεὶ
  choice: のに
  rationale: 問いの根拠を示しつつ、マリアが置かれた状況との隔たりを文末の「のに」で自然に表した。
- source_word: ἄνδρα οὐ γινώσκω
  choice: 私は男の人を知りません
  rationale: 原文の婉曲表現「男を知らない」を本文に保ち、性的関係を持ったことがないという文脈上の意味は脚注で明示した。γινώσκω は現在形なので、過去完了的な形に限定せず訳した。
theological_decisions:
- issue: マリアの言葉とイエスの受胎
  choice: 原文の婉曲表現に沿って「私は男の人を知りません」とした。
  alternative: 「私は男の人と関係を持ったことがありません」または「私は処女です」
  rationale: この句は文脈上、マリアに性的経験がないことを表すが、原文は「処女」という名詞を直接用いていない。本文では原文の表現を保ち、脚注で意味を説明することで、処女受胎との関わりを示しつつ原文以上の明示化を避けた。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、天使への応答にふさわしい丁寧さを保った。「どのようにして」は「なぜ」ではなく、実現の仕方を問う原文の趣旨を示す。
