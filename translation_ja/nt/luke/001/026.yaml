  rationale: 本文は「第六の月」の曖昧さを保持し、ἀπεστάληの受動態を「送られた」で保った。ἀπὸ τοῦ θεοῦは余分な場所的含意を避けて「神から」とし、ἄγγελοςは現代標準日本語で明瞭な「天使」とした。脚注aは文脈上の指示対象を説明するにとどめ、本文へ補い込んでいない。
