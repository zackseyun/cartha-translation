  terminology: ἄγγελοςはこの文脈で天上の使者を指すので「天使」が明確で、現代日本語の標準的な聖書用語でもある。「神」「ガブリエル」「ガリラヤ」「ナザレ」は適切。第六の月の指示対象は本文で補わず、脚注で文脈を示す方針を維持する。
