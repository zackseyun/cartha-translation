source:
  edition: SBLGNT
  text: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ ἀπεστάλη ὁ ἄγγελος Γαβριὴλ ⸀ἀπὸ τοῦ θεοῦ εἰς πόλιν τῆς Γαλιλαίας ᾗ ὄνομα Ναζαρὲθ
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/026.yaml
  text: In the sixth month[a], the angel Gabriel was sent from God to a city of Galilee named Nazareth[b],
translation:
  language: ja
  text: 第六の月に[a]、天使ガブリエルが神から、ガリラヤのナザレという町へ[b]送られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、エリサベトが身ごもって第六か月のこと。1:24、36参照。
    reason: cross_reference
  - marker: b
    text: 別訳「ガリラヤにある、ナザレという町へ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ μηνὶ τῷ ἕκτῳ
  choice: さて、第六の月に
  rationale: ἐν＋与格の時を表す用法を「第六の月に」とした。δέは弱い談話上の接続を示すため、時間的な「今」を加えず、自然な場面転換を表す「さて」で訳した。
- source_word: ἀπεστάλη
  choice: 遣わされた
  rationale: アオリスト受動態を保ち、使命を帯びて送られるという文脈にも自然な「遣わされた」とした。
- source_word: ὁ ἄγγελος
  choice: 御使い
  rationale: この文脈では人間の使者ではなく天的存在を指すため、現代日本語の聖書文体で明瞭な「御使い」とした。
- source_word: Γαβριὴλ
  choice: ガブリエル
  rationale: 日本語で定着している人名表記を採用した。
- source_word: ἀπὸ τοῦ θεοῦ
  choice: 神のもとから
  rationale: ἀπό＋属格が示す出所を明示し、「神によって」として行為者だけを前面に出すことを避けた。
- source_word: εἰς πόλιν τῆς Γαλιλαίας
  choice: ガリラヤ地方の……町へ
  rationale: εἰςの到達点を「へ」で表し、属格によるガリラヤとの地理的関係を自然な日本語にした。
- source_word: ᾗ ὄνομα Ναζαρὲθ
  choice: ナザレという名の
  rationale: 直訳的には「その名はナザレ」であり、その内容を自然かつ明確な日本語で表した。
theological_decisions:
- issue: 「第六の月」が何を指すか
  choice: 本文では「第六の月」とだけ訳し、エリサベトの妊娠第六か月という理解は脚注に置く。
  alternative: 本文で「エリサベトが身ごもって六か月目に」と補う。
  rationale: 直前と1:36から指示対象は明らかだが、この節のギリシア語自体は対象を言い直していないため、本文では原文の簡潔さと含みを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御使い」「遣わされた」は聖書叙述として自然でありつつ、一般読者にも理解できる語を選んだ。
