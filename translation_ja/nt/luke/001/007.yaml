  text: καὶ οὐκ ἦν αὐτοῖς τέκνον, καθότι ⸂ἦν ἡ Ἐλισάβετ⸃ στεῖρα, καὶ ἀμφότεροι προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/007.yaml
  text: And they had no child[a], because Elizabeth was barren, and both of them were advanced in years.
translation:
  language: ja
  text: 二人には子どもがいなかった。エリサベトが不妊だったからである。また、二人ともすでに高齢であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「二人とも自分たちの日々において進んでいた」。すなわち、二人とも高齢であったという意味。
    reason: 原文の年齢を表す慣用句の直訳と意味を示すため。
lexical_decisions:
- source_word: τέκνον
  choice: 子ども
  rationale: 単数形を保ちつつ、現代日本語で自然に夫妻の子を指す表現とした。
- source_word: καθότι
  choice: からである
  rationale: 夫妻に子がいなかった理由を示す因果関係を明確に表す。
- source_word: στεῖρα
  choice: 子を産めなかった
  rationale: 単なる『子がいない』という結果ではなく、不妊であったことを、侮蔑的に響き得る語を避けて明確に表した。文脈上の結果を述べる表現であり、原因の医学的特定はしない。
- source_word: ἀμφότεροι
  choice: 二人とも
  rationale: ゼカリヤとエリサベトの双方に当てはまることを自然に強調する。
- source_word: προβεβηκότες ἐν ταῖς ἡμέραις αὐτῶν
  choice: すでに年を重ねていた
  rationale: 直訳的な『自分たちの日々において進んでいた』という慣用句の意味を、敬意のある自然な日本語で表した。
- source_word: οὐκ ἦν αὐτοῖς
  choice: 二人には…いなかった
  rationale: ギリシア語の所有を表す与格構文を、日本語で自然な存在構文として訳した。
theological_decisions: []
translation_notes:
  register: 明快で現代的かつ品位ある文体。『不妊だった』よりも一般読者に直接伝わる『子を産めなかった』を用い、高齢を表す慣用句は『年を重ねていた』と敬意を込めて訳した。脚注標識は、それが説明する年齢表現の直後に置いた。
