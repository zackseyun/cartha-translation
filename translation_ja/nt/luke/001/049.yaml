  text: ὅτι ἐποίησέν μοι ⸀μεγάλα ὁ δυνατός, καὶ ἅγιον τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/049.yaml
  text: because the Mighty One has done great things for me[a], and holy is his name.
translation:
  language: ja
  text: 力ある方が、私のために偉大なことをしてくださったからです。そして、御名は聖なるものです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聖なるものです、その御名は」。ギリシア語では「聖なる」が「その御名」に先行して置かれ、強調されています。
    reason: 原文の語順による「聖なる」の強調を示すため。
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前でマリアが主をあがめ、喜ぶ理由を示す接続詞として、因果関係が明瞭な現代日本語にした。
- source_word: ἐποίησέν
  choice: してくださった
  rationale: アオリストが表す神の決定的な行為を過去形で示し、恩恵を受けたマリアの賛美という文脈に即して敬意と受益を自然に表した。
- source_word: μοι
  choice: 私のために
  rationale: ここでの与格は受益者を示すため、「私に」よりも「私のために」が自然で正確である。
- source_word: μεγάλα
  choice: 偉大なこと
  rationale: 中性複数形の形容詞が名詞的に用いられている。神の大いなる働きを限定しすぎずに表す。
- source_word: ὁ δυνατός
  choice: 力ある方
  rationale: 冠詞付き形容詞が神を指す称号として機能していることを保ちつつ、自然で荘重な現代日本語とした。
- source_word: ἅγιον
  choice: 聖なるもの
  rationale: 神の御名の聖性を述べる述語形容詞。前置された語順の強調を次文として保った。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 御名
  rationale: 神の「名」を指すことを保持し、日本語の聖書文体として自然な敬語接頭辞を用いた。
theological_decisions:
- issue: ὁ δυνατόςを神の称号としてどう訳すか
  choice: 力ある方
  alternative: 全能の方／力強い方
  rationale: 「全能」は原語以上に意味を特定する可能性があるため避け、冠詞付き形容詞の称号的用法を簡潔に表した。
- issue: καὶ ἅγιον τὸ ὄνομα αὐτοῦ の語順
  choice: 御名は聖なるものです
  alternative: 聖なるもの、それがその御名です／その御名は聖なるものです
  rationale: 原文は「聖なる」を前置して強調するが、日本語でそのまま倒置すると不自然になりやすい。本文は明瞭さを優先し、原文の強調は脚注で示した。
translation_notes:
  register: 明瞭で現代的ながら、マリアの賛歌にふさわしい品位を保った。「してくださった」は日本語として自然な敬意と受益性を表し、「御名」は神を指す文脈で一般読者にも理解しやすい。
