  text: καὶ μακαρία ἡ πιστεύσασα ὅτι ἔσται τελείωσις τοῖς λελαλημένοις αὐτῇ παρὰ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/045.yaml
  text: And blessed is she who believed that there will be a fulfillment of what was spoken to her by the Lord[a][b].
translation:
  language: ja
  text: そして、主から彼女に語られたことが実現すると信じた彼女は、幸いです[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして、主から彼女に語られたことが実現するので、信じた彼女は幸いです」。ここで「〜と」と訳したギリシア語の接続詞は、「〜なので」と理由を表す場合もありますが、この箇所では信じた内容を表すと考えるほうが自然です。
    reason: alternative_reading
  - marker: b
    text: 「実現」は「完成」または「成就」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακαρία
  choice: 幸いです
  rationale: 単なる主観的な幸福ではなく、神の恵みのもとにある者への祝福の宣言として読める、自然で聖書的な日本語を選んだ。
- source_word: ἡ πιστεύσασα
  choice: 信じた人
  rationale: 冠詞付きアオリスト分詞の実質名詞的用法を保ち、神の言葉を信じた行為を簡潔に表した。文脈上はマリアを指すが、原文どおり三人称で訳した。
- source_word: ὅτι
  choice: 〜と
  rationale: ここでは πιστεύσασα の信じた内容を導く接続詞と解するのが構文上最も自然である。因果を示す可能性は脚注に残した。
- source_word: τελείωσις
  choice: 実現
  rationale: 語られた神の言葉が成し遂げられることを、現代日本語で自然に表す。原語には『完成』『成就』の含みもあるため脚注で示した。
- source_word: τοῖς λελαλημένοις αὐτῇ
  choice: 彼女に語られたこと
  rationale: 冠詞付き完了受動分詞が指す、すでに彼女に告げられた内容を簡潔に表現し、受動の形も保持した。
- source_word: παρὰ κυρίου
  choice: 主から
  rationale: παρά＋属格が示す言葉の源・由来を明確にし、その言葉が主から出たものであることを表した。
- source_word: κυρίου
  choice: 主
  rationale: この文脈では約束の言葉の源であるイスラエルの神を指すため、κύριος の標準的な訳語を用いた。
theological_decisions:
- issue: マリアの幸いと、信仰および主の言葉の実現との関係
  choice: 主から語られたことが実現すると信じた人として、マリアが幸いだと宣言される。
  alternative: 主から語られたことが実現するから、信じた人は幸いである。
  rationale: ὅτι を信仰内容を示す節と取るのが統語的・文脈的により自然であり、神の約束への信仰というルカの強調を保つ。一方、因果的解釈の可能性も排除せず脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、祝福の宣言にふさわしい品位を保った。「彼女」は原文の三人称を保持しており、文脈上マリアを指す。
