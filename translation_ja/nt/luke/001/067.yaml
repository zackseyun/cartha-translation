  text: Καὶ Ζαχαρίας ὁ πατὴρ αὐτοῦ ἐπλήσθη πνεύματος ἁγίου καὶ ⸀ἐπροφήτευσεν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/067.yaml
  text: 'And Zechariah his father was filled with the Holy Spirit and prophesied, saying:'
translation:
  language: ja
  text: そして、ヨハネの父ザカリヤは聖霊に満たされ、こう預言した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: 直前の出来事との物語上の連続を自然な現代日本語で示す。
- source_word: Ζαχαρίας
  choice: ザカリヤ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ὁ πατὴρ αὐτοῦ
  choice: ヨハネの父
  rationale: αὐτοῦの指示対象は直前の文脈にいる幼子ヨハネであり、日本語では固有名を補うことで曖昧さを避けつつ、親子関係を自然に表せる。
- source_word: ἐπλήσθη
  choice: 満たされ
  rationale: アオリスト受動形の出来事性と受動の意味を簡潔に保持する。
- source_word: πνεύματος ἁγίου
  choice: 聖霊に
  rationale: πίμπλημιに伴う属格を、日本語で自然な『〜に満たされる』として表し、ルカ文書における神の霊への言及を『聖霊』とした。
- source_word: ἐπροφήτευσεν
  choice: 預言した
  rationale: 神から与えられたことばを語る行為を、定着した明瞭な聖書用語で直接表す。
- source_word: λέγων
  choice: こう
  rationale: 後続する預言の内容を導く分詞を、日本語では『こう預言した』と自然に統合した。
theological_decisions:
- issue: πνεύματος ἁγίουの指示対象
  choice: 聖霊
  alternative: 聖なる霊
  rationale: ルカ文書では、神による預言的発話の文脈にあるこの表現は神の聖霊を指す。定冠詞がないことを理由に不定の霊とせず、同時に本文を越える教理的説明も加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。後続する直接話法への導入として文末を『こう預言した。』とし、原文のλέγωνの機能を自然に表した。
