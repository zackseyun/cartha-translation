  text: διὰ σπλάγχνα ἐλέους θεοῦ ἡμῶν, ἐν οἷς ⸀ἐπισκέψεται ἡμᾶς ἀνατολὴ ἐξ ὕψους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/001/078.yaml
  text: because of the tender mercy of our God[a], by which the sunrise from on high will visit us,
translation:
  language: ja
  text: 私たちの神の深いあわれみのゆえに、高みからの夜明けが私たちを訪れる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ σπλάγχνα ἐλέους
  choice: 深いあわれみによって
  rationale: διά＋対格の原因・根拠を「によって」で表した。σπλάγχνα ἐλέουςは直訳すれば「慈しみの内臓」だが、深い内面的な慈悲を指す慣用表現なので、自然な現代日本語で「深いあわれみ」とした。
- source_word: θεοῦ ἡμῶν
  choice: 私たちの神の
  rationale: 属格関係をそのまま自然な日本語の所有表現で示した。
- source_word: ἐν οἷς
  choice: によって
  rationale: 先行する「あわれみ」を、訪れの根拠または働く領域として受ける。日本語では前置詞句全体とまとめて「深いあわれみによって」とするのが自然で、因果・媒介の含みも保てる。
- source_word: ἐπισκέψεται
  choice: 訪れる
  rationale: 未来形の「訪れる」を保持した。聖書語法には救いのために顧みる含意があるが、本文では説明的に広げず、文脈に委ねた。
- source_word: ἀνατολή
  choice: 昇る光
  rationale: 基本的な「昇ること」から夜明け・日の出を指し、次節の光の比喩にもつながる。「昇る光」は日本語として自然で、人物的・救済的な比喩にも開かれている。
- source_word: ἐξ ὕψους
  choice: いと高き所から
  rationale: 天上の領域を指す敬意ある表現として、原文の「高みから」に近い聖書的で理解可能な日本語を選んだ。「天から」と断定的に説明しすぎることを避けた。
theological_decisions:
- issue: メシア的文脈におけるἀνατολήの意味
  choice: 本文では「昇る光」
  alternative: 「夜明け」「日の出」、または七十人訳の預言書に響く「若枝」
  rationale: 直後の1:79が暗闇に照る光を語るため、光・夜明けの像を主要な意味とした。一方、ゼカリヤ3:8、6:12の七十人訳におけるメシア的な「若枝」の響きもあり得るため、脚注で保持し、本文では一義的に決めつけなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を基本としつつ、頌歌の格調を保つため「いと高き所」を用いた。「深いあわれみ」は古風な直訳を避けながら、原文の内面的で切実な慈悲を表す。
