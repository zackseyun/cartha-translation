  yaml_path: translation/nt/luke/001/053.yaml
  text: He has filled the hungry with good things[a], and sent the rich away empty.
translation:
  language: ja
  text: 飢えている人々を良いもので満たし、富んでいる人々を空のまま送り返し。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πεινῶντας
  choice: 飢えている人々
  rationale: 現在分詞の名詞的用法。飢餓の程度を過度に強めず、具体的に空腹な人々を指す表現とした。
- source_word: ἐνέπλησεν
  choice: 満たし
  rationale: 「満たす、いっぱいにする」という動作を直接表す。賛歌に連続するアオリストの決定的行為を、日本語では文脈に自然な連用形で示した。
- source_word: ἀγαθῶν
  choice: 良いもの
  rationale: 充足の内容を示す属格。贈り物という意味を加えず、形容詞の名詞的用法を自然に訳した。
- source_word: πλουτοῦντας
  choice: 富んでいる人々
  rationale: 現在分詞の名詞的用法を保ち、「飢えている人々」と対応する具体的な社会的対照を示した。
- source_word: ἐξαπέστειλεν
  choice: 送り返された
  rationale: 「外へ送り出す、去らせる」という意味を、この場面で自然な日本語にした。敬語は主語である神への敬意を示す。
- source_word: κενούς
  choice: 何も持たせずに
  rationale: 送り出される者の空の状態を自然な日本語で表す。「手ぶらで」より口語的響きを抑えつつ、物質的対照を明瞭にした。
theological_decisions:
- issue: マリアの賛歌における社会的・神学的逆転
  choice: 「飢えている人々」と「富んでいる人々」という具体的対照を保つ。
  alternative: 霊的に乏しい者と自己満足した者という比喩に限定して訳す。
  rationale: ギリシア語は具体的に飢えた人々と富んだ人々を指している。霊的含意に限定せず、ルカ福音書に見られる神による逆転の緊張をそのまま残した。
translation_notes:
  register: 明瞭な現代標準日本語。マリアの賛歌にふさわしい簡潔で格調ある調子を保ち、過度に文語的または口語的な表現を避けた。
