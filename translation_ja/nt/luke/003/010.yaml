  text: 群衆はヨハネに尋ねていた。「それでは、私たちは何をすればよいのでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: 尋ね続けた
  rationale: 未完了過去が示す継続・反復的な問いかけを、自然な現代日本語で表した。
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: 複数形は、集合的な「群衆」で自然に表現できる。文脈上、その場に集まった人々を指す。
- source_word: αὐτόν
  choice: ヨハネに
  rationale: 日本語では代名詞「彼に」よりも、直前の話者であるヨハネを明示するほうが自然で、指示対象も明確になる。
- source_word: λέγοντες
  choice: （直接話法として統合）
  rationale: 問いの内容を導く分詞であり、「言って」と逐語的に重ねず、引用文を直接続けることで自然な日本語にした。
- source_word: Τί οὖν
  choice: それでは、何を
  rationale: οὖνが直前の勧告から導かれる実践的な帰結を問う接続語であることを「それでは」で保った。
- source_word: ποιήσωμεν
  choice: すればよいのでしょうか
  rationale: 熟慮を表すアオリスト接続法の問いを、取るべき行動を尋ねる自然で丁寧な日本語にした。
