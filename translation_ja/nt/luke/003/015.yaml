id: LUK.3.15
reference: Luke 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: ja
  text: 民衆が期待を抱いて待っており、皆がヨハネについて、もしかすると彼こそメシア[a]ではないかと心の中で考えていたとき、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語：ホ・クリストス。
    reason: 称号ὁ χριστόςには「メシア」と「キリスト」の両方の訳し方があるため。
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: 期待に胸を膨らませて待っており
  rationale: 継続的に待つことと、強い期待を抱くことの両方を、自然な現代日本語で表した。属格独立構文は後続節の背景を示す形にした。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは強い逆接ではなく物語の展開を示す軽い接続であり、日本語では文脈と従属節の形によって自然に示せるため、接続語を補わなかった。
- source_word: τοῦ λαοῦ
  choice: 民衆
  rationale: その場の人々を集合的に指す語として簡潔で自然であり、「群衆」よりもλαόςの広い意味を保つ。
- source_word: διαλογιζομένων πάντων
  choice: 皆が…心の中で考えていた
  rationale: 全員に及ぶ内面的な思案を表す。「考えていた」は過度に論理的な響きを避けつつ、継続する熟考を自然に伝える。
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: 心の中で
  rationale: 聖書的な「心」の含意を保ちながら、内面的な思考であることを明瞭にした。
- source_word: περὶ τοῦ Ἰωάννου
  choice: ヨハネについて
  rationale: περί＋属格の意味を直接かつ自然に表した。
- source_word: μήποτε … εἴη
  choice: もしかすると…ではないか
  rationale: 間接的な思案における可能性とためらいを保ち、断定にしなかった。
- source_word: αὐτὸς
  choice: 彼こそ
  rationale: 主語を指すだけでなく、「ほかならぬ彼が」という焦点化された含みを「こそ」で表した。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは人々が待望する者を指す称号として用いられているため、ユダヤ的な文脈が伝わる「メシア」とした。
theological_decisions:
- issue: 称号ὁ χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ヨハネの身元について民衆が抱いた待望を述べる箇所で、固有名のような用法ではなく称号として機能している。「メシア」はその文脈を明確にしつつ、別訳を脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語としての品位を保った。原文が後続節へ続く属格独立構文であるため、末尾を「とき、」として未完の形にした。
