language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: ja
  text: ヨハネは皆に答えて言った。「私は水であなたがたにバプテスマを授けている。しかし、私よりも力のある方が来られる。私はその方の履物のひもを解く資格もない。その方は、聖霊と火によって[a]、あなたがたにバプテスマをお授けになる。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖霊と火の中で」または「聖霊と火をもって」とも訳せる。原文の前置詞は、手段、領域、要素などの意味に理解し得る。
    reason: lexical_alternative
  - marker: b
    text: ここで「火」が浄化を表すのか、裁きを表すのか、それとも「聖霊と火」による一つのバプテスマの像の一部なのかは、本文では明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: ヨハネは皆に答えて言った
  rationale: 応答を表すἀπεκρίνατο、発話を導くλέγων、対象を示すπᾶσινを明示しつつ、現代日本語の聖書文体として自然に整えた。
- source_word: Ἐγὼ μὲν ... δὲ
  choice: 私は……しかし
  rationale: μένとδέによるヨハネと来る方との対比を、日本語では「しかし」によって明瞭に示した。μένを不自然に逐語訳することは避けた。
- source_word: ὕδατι βαπτίζω ὑμᾶς
  choice: 私は水であなたがたにバプテスマを授けている
  rationale: 与格ὕδατιは手段または要素を表し得るが、日本語では自然な「水で」とした。βαπτίζωは教派的な限定を避け、定着した「バプテスマを授ける」と訳した。
- source_word: ἔρχεται δὲ ὁ ἰσχυρότερός μου
  choice: しかし、私よりも力のある方が来られる
  rationale: 比較級ἰσχυρότεροςを「私よりも力のある」と明示し、指示対象への敬意にかなう自然な日本語として「方」「来られる」を用いた。
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: 私はその方の……にも値しない
  rationale: この謙遜表現におけるἱκανόςは、単なる能力不足より資格・価値の欠如を表すため、「値しない」とした。
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: その方の履物のひもを解く
  rationale: 履物を留めるひもを解くという卑しい奉仕を、古風すぎず具体的な日本語で表した。複数形の履物は日本語では総称的な単数表現が自然である。
- source_word: αὐτὸς ὑμᾶς βαπτίσει
  choice: その方は……あなたがたにバプテスマをお授けになる
  rationale: 強意的なαὐτόςを「その方は」で受け、ヨハネとの対比を保った。未来形は「お授けになる」で表した。
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: 聖霊と火の中で
  rationale: ἐνの空間・領域・要素・手段の幅を狭めないため「中で」とし、「火」が浄化か裁きかを本文で決めないよう直訳的に保持した。πνεῦμα ἅγιονは神の霊を指すため「聖霊」とした。
theological_decisions:
- issue: 「聖霊と火の中でバプテスマを授ける」の意味
  choice: 聖霊と火を並列のまま保持し、火の機能を特定しない
  alternative: 火を浄化の比喩とする、または聖霊のバプテスマと裁きの火を別々の対象に配分する
  rationale: 本文だけでは「火」が浄化、裁き、あるいは一つの複合的な像の一部であるかを断定できないため、その神学的緊張を訳文に残した。
- issue: ἐνの訳し方
  choice: 「中で」とし、原文の像を前面に出す
  alternative: 「聖霊と火によって」または「聖霊と火をもって」
  rationale: ἐνは手段、領域、要素など複数のニュアンスを担い得る。「によって」は手段に寄せすぎるため、脚注を付して曖昧さを保った。
translation_notes:
  register: 明瞭で現代的ながら dignified な標準語を用いた。「バプテスマ」は日本語聖書で定着した語として保持し、「浸す」など特定の様式を強く示す語は避けた。敬語は過度に重くせず、来る方への敬意とヨハネとの対比を自然に表した。
