  text: イエスの子、エリエゼルの子、ヨリムの子、マタテの子、レビの子、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ
  choice: イエス
  rationale: ギリシア語名Ἰησοῦの属格形。新約聖書の人名として一般的な日本語表記を用いた。
- source_word: Ἐλιέζερ
  choice: エリエゼル
  rationale: ギリシア語の音写に沿い、旧約由来の人名として定着した表記を用いた。
- source_word: Ἰωρίμ
  choice: ヨリム
  rationale: ギリシア語の発音に近く、現代日本語で読みやすい表記とした。
- source_word: Μαθθάτ
  choice: マタテ
  rationale: 語末子音を日本語で表しつつ、マタイとの混同を避ける音写とした。
- source_word: Λευί
  choice: レビ
  rationale: 聖書日本語で広く定着している人名表記を用いた。
theological_decisions:
- issue: 反復される属格冠詞τοῦが示す系譜関係
  choice: 節単独では名を読点で連ね、前節から続く「その子」の連鎖として表す
  alternative: 各名の間に「の子」を補って「イエスの子、エリエゼルの子…」とする
  rationale: ギリシア語本文には「子」に当たる語が各箇所で明記されず、3:23のὢν υἱόςから属格の連鎖が続く。日本語では系譜全体の構文に従って名を列挙するほうが自然で、原文の省略も保てる。
translation_notes:
  register: 現代標準日本語の聖書系譜として、簡潔で格調を損なわない人名列挙とした。句末の読点は次節へ系譜が継続することを示す。
