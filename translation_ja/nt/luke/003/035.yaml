  text: the son of Serug[a], the son of Reu, the son of Peleg, the son of Eber, the son of Shelah[b],
translation:
  language: ja
  text: セルグの子、レウの子、ペレグの子、エベルの子、シェラの子。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「セロクの、ラガウの、ファレクの、エベルの、サラの」。ルカの系図では、親子関係を示す語が文脈から補われる属格の連鎖になっているため、「子」を補った。人名は旧約聖書で一般的な日本語表記に合わせた。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: の子
  rationale: 系図の文脈では、各固有名詞に付く属格冠詞が、前後から補われる親子関係を表す。日本語では「の」だけでは関係が不明瞭になるため、「の子」と明示した。
- source_word: Σεροὺχ
  choice: セルグ
  rationale: ギリシア語形はセロクに近いが、創世記の同一人物として一般的な日本語聖書名「セルグ」を用いた。
- source_word: Ῥαγαὺ
  choice: レウ
  rationale: ギリシア語形はラガウだが、創世記の同一人物として広く用いられる「レウ」を採用した。
- source_word: Φάλεκ
  choice: ペレグ
  rationale: 創世記の系図との対応が明瞭になる標準的な日本語名「ペレグ」を用いた。
- source_word: Ἔβερ
  choice: エベル
  rationale: ヘブライ語聖書の同一人物に対応する一般的な日本語名「エベル」を用いた。
- source_word: Σαλὰ
  choice: シェラ
  rationale: ギリシア語形はサラだが、創世記の系図における同一人物として標準的な日本語名「シェラ」を用いた。
theological_decisions: []
translation_notes:
  register: 簡潔な系図のリズムを保ちつつ、現代日本語で関係が明確になるよう「の子」を反復した。人名は旧約聖書とのつながりが認識しやすい慣用表記を採用した。
