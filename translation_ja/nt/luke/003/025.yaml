  text: マタティアの子、アモスの子、ナホムの子、エスリの子、ナガイの子、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ
  choice: 〜の子
  rationale: ルカの系図では、固有名詞に繰り返し付く属格冠詞が、前後の文脈で示された親子関係を省略的に表している。日本語では各名の後に「の子」を補い、系図の連鎖を明確かつ自然にした。
- source_word: Ματταθίου
  choice: マタティア
  rationale: 人名として音写した。属格語尾は名前そのものに含めず、現代日本語の聖書で理解しやすい形を採った。
- source_word: Ἀμὼς
  choice: アモス
  rationale: 人名として一般的な日本語表記を用いた。預言者アモスと同形だが、ここでは系図中の祖先名である。
- source_word: Ναοὺμ
  choice: ナホム
  rationale: 人名として、日本語で定着している聖書名の表記を採った。
- source_word: Ἑσλὶ
  choice: エスリ
  rationale: ギリシア語の人名を素直に音写し、日本語で慣用的な表記を採った。
- source_word: Ναγγαὶ
  choice: ナガイ
  rationale: 人名としてギリシア語の発音に沿って音写し、日本語として読みやすい表記にした。
