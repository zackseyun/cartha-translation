lexical_decisions:
- source_word: ὄψεται
  choice: 見る
  rationale: ὁράωの未来形で、ここでは素直な未来の意味を表す。「見る」は具体的な視覚表現を保ちつつ、現代日本語として自然である。
- source_word: πᾶσα σὰρξ
  choice: すべての肉なる者
  rationale: 直訳的な「すべての肉」を日本語として理解可能な形にしつつ、イザヤ40章5節を響かせる預言的表現を保持した。意味は全人類を指すが、本文で「すべての人」と平板化せず、脚注で説明する。
- source_word: σωτήριον
  choice: 救い
  rationale: 冠詞を伴って名詞的に用いられている。イザヤ書とのつながりと、神の救済の幅広い意味を保つ、簡潔で定着した訳語である。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格の形をそのまま保ち、神に属する救い、または神から来る救いという含みを残す。「神からの」は可能だが、解釈を一段明示するため脚注の別訳とした。
theological_decisions:
- issue: πᾶσα σὰρξの意味
  choice: 全人類を指す普遍的範囲を持ちながら、「肉」という聖書的・預言的表現を本文に残す。
  alternative: 「すべての人」と訳して指示対象を直接明示する。
  rationale: 文脈上はイザヤ書からの引用であり、人類全体を指す。一方、「肉なる者」という表現を保つことで、引用の響きと原文の身体的な比喩を失わず、意味は脚注で明らかにできる。
- issue: τοῦ θεοῦの属格
  choice: 「神の救い」とし、所属・起源の両方の可能性を保つ。
  alternative: 「神からの救い」として起源を明示する。
  rationale: ギリシア語の属格は「神の」と形式的に訳すことができ、救いが神に属し、神からもたらされるという含みを自然に保持する。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、旧約引用の荘重さと語句上の響きを保った。「肉なる者」は日常語ではないが、脚注を伴う聖書本文として理解可能であり、原文の表現と相互参照性を優先した。
