  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: ja
  text: 徴税人たちも洗礼を受けるために来て、彼に言った。「先生、私たちは何をすればよいのでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον
  choice: やって来て
  rationale: アオリスト直説法を文脈上の単純な出来事として表し、後続の発言と自然につないだ。
- source_word: δὲ καὶ τελῶναι
  choice: 取税人たちも
  rationale: δέの展開機能とκαίの追加・強調を、日本語では「も」によって自然に表した。「取税人」は当時の徴税請負に関わる者を指す聖書語として明確である。
- source_word: βαπτισθῆναι
  choice: 洗礼を受けるために
  rationale: 受動態不定詞の目的用法を明示した。
- source_word: εἶπαν πρὸς αὐτόν
  choice: ヨハネに言った
  rationale: 原文は「彼に言った」だが、日本語で指示対象を明確にするため、文脈上の人物名「ヨハネ」を用いた。質問内容であっても、動詞λέγωに即して「尋ねた」ではなく「言った」とした。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとして自然な現代日本語で、教える者という意味を保つ。
- source_word: τί ποιήσωμεν
  choice: 私たちは何をすればよいのでしょうか
  rationale: 熟慮を表すアオリスト接続法の、取るべき行動を問う含意を丁寧で自然な疑問文にした。
theological_decisions:
- issue: ヨハネの悔い改めの呼びかけに応答する、社会的に蔑視された集団の強調
  choice: 「取税人たちも」として追加の意味を保つ
  alternative: 「取税人たちまでが」として意外性を強く示す
  rationale: καίには追加と文脈上の強調があるが、「までが」は驚きや評価を強めすぎる可能性があるため、「も」で原文の意味を過不足なく保持した。
translation_notes:
  register: 明快で現代的かつ丁寧な標準語。会話では取るべき行動を真剣に問う調子を「何をすればよいのでしょうか」で表した。
