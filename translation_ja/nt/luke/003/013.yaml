id: LUK.3.13
reference: Luke 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτούς· Μηδὲν πλέον παρὰ τὸ διατεταγμένον ὑμῖν πράσσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: ja
  text: そこでヨハネは彼らに言った。「あなたがたに定められている額を超えて、取り立ててはならない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: そこでヨハネは
  rationale: δέは弱い接続を表す。日本語では応答の流れを自然に示す「そこで」とし、直前の文脈から話者ヨハネを明示した。
- source_word: εἶπεν πρὸς αὐτούς
  choice: 彼らに言った
  rationale: λέγω＋πρόςの標準的で自然な訳。相手は直前に登場する徴税人たちである。
- source_word: Μηδὲν πλέον παρὰ
  choice: 額を超えて……はならない
  rationale: 「何も、それ以上に」を表す禁止。徴税の文脈で比較の対象が金額であることを自然な日本語で明示した。
- source_word: τὸ διατεταγμένον ὑμῖν
  choice: あなたがたに定められている額
  rationale: διατάσσωの完了受動分詞が持つ、公的に規定・指定されたものという含意と、現在も有効な結果状態を保った。
- source_word: πράσσετε
  choice: 取り立ててはならない
  rationale: πράσσωは一般には「行う」だが、ここでは徴税人への指示であり、徴収する行為を指す。「取り立てる」は不当徴収に限定せず、文脈上の活動を明確にする。
theological_decisions:
- issue: πράσσετεに省略されている徴税行為の明示
  choice: 「取り立ててはならない」として徴税行為を明示する
  alternative: 「定められていることを超えて、何もしてはならない」
  rationale: 直前の節で相手が徴税人であるため、命令はその職務上の徴収について述べている。教理的限定を加えるのではなく、日本語で必要な文脈上の目的語を補った。
- issue: τὸ διατεταγμένονの内容
  choice: 「定められている額」とする
  alternative: 「命じられていること」「定められているもの」
  rationale: 中性単数分詞自体は広く「定められたもの」を意味し得るが、徴税と「それ以上」の比較から金額が意図される。文脈を明瞭にしつつ、誰が定めたかは本文同様に特定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、命令は威厳のある「〜てはならない」とした。「徴収する」より日常的に理解しやすい「取り立てる」を採用したが、過度に口語的・非難的にならない文脈で用いている。
