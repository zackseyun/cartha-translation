  text: τοῦ Ἐνὼς τοῦ Σὴθ τοῦ Ἀδὰμ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/038.yaml
  text: the son of Enosh[a], the son of Seth, the son of Adam, the son of God.
translation:
  language: ja
  text: エノシュの子[a]、セツの子、アダムの子、神の子。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語原文は、直訳すると「エノシュの、セツの、アダムの、神の」と同じ属格表現を繰り返しています。「子」は系図の文脈から補っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: エノシュの子
  rationale: 属格冠詞と固有名詞の反復は、直前から続く系図の省略表現であり、文脈上「子」を補うと現代日本語で関係が明確になる。Ἐνώςは旧約の名に対応する慣用表記「エノシュ」とした。
- source_word: τοῦ Σὴθ
  choice: セツの子
  rationale: 同じ属格構文が親子関係を表すため「子」を補った。Σήθは日本語聖書で広く用いられる「セツ」と表記した。
- source_word: τοῦ Ἀδὰμ
  choice: アダムの子
  rationale: 系図の同一構文として親子関係を示す。「人」と訳さず、この箇所では固有名詞として「アダム」を保った。
- source_word: τοῦ θεοῦ
  choice: 神の子
  rationale: 原文では他の名と同じ属格の連鎖に置かれているため、統語上の対応を保って「神の子」とした。これにより、アダムと神との関係について原文が持つ簡潔さと神学的緊張を残す。
theological_decisions:
- issue: アダムの系図を結ぶ τοῦ θεοῦ の訳し方
  choice: 神の子
  alternative: 神による者／神から出た者／神のもの
  rationale: ギリシア語は字義的には単に「神の」という属格句だが、系図全体で省略されている関係語を一貫して補えば「神の子」となる。「神から造られた」と説明的に限定せず、原文の系図的形式と含意を保持した。
translation_notes:
  register: 簡潔な系図のリズムを保ちつつ、現代日本語で親子関係が明瞭になるよう「の子」を補った。固有名詞は一般的な日本語聖書の表記を採用し、文体は平明で荘重なものとした。
