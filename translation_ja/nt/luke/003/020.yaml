id: LUK.3.20
reference: Luke 3:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσέθηκεν καὶ τοῦτο ἐπὶ πᾶσιν, ⸀καὶ κατέκλεισεν τὸν Ἰωάννην ⸀ἐν φυλακῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/020.yaml
  text: 'He added this also to them all: he locked John up in prison[a].'
translation:
  language: ja
  text: そして、これまでのすべての悪事に加えて、ヘロデはヨハネを牢に閉じ込めるということまでした[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「これらすべてに、このことも加えた」。すなわち、ヘロデはそれまでのすべての悪事に、ヨハネを投獄するという行為をさらに加えた。
    reason: ἐπὶ πᾶσιν の省略された指示内容と、原文の累積的な表現を示すため。
lexical_decisions:
- source_word: προσέθηκεν
  choice: 加えて……までした
  rationale: このアオリストは、先に挙げられた行為にもう一つの行為を重ねたことを表す。日本語では「加えて」と「までした」を組み合わせ、累積的な力を自然に示した。
- source_word: τοῦτο
  choice: ……ということ
  rationale: 後続するヨハネ投獄の行為を指す指示語であり、日本語では内容を受ける「ということ」で明確に表した。
- source_word: ἐπὶ πᾶσιν
  choice: これまでのすべての悪事に加えて
  rationale: 直前の文脈で列挙されたヘロデの悪事すべてに、さらにこの行為を加えたという意味。原文だけでは「悪事」が明示されないため、その補足を注で知らせる。
- source_word: κατέκλεισεν
  choice: 牢に閉じ込める
  rationale: 「中に閉じ込める、拘禁する」という具体的な意味を保ち、続く ἐν φυλακῇ と一体にして自然な現代日本語とした。
- source_word: Ἰωάννην
  choice: ヨハネ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: ἐν φυλακῇ
  choice: 牢に
  rationale: ここでは拘禁される場所を指す。「牢に閉じ込める」とすることで、重複を避けつつ原文の具体性を保った。
theological_decisions:
- issue: ἐπὶ πᾶσιν の指示対象と働き
  choice: ヘロデが、それまでのすべての悪事にヨハネ投獄をさらに加えた、という累積的な意味
  alternative: 「これらすべてに加えて」のように、何が加算対象かを本文では明示しない訳
  rationale: 直前の19節はヘロデが行ったすべての悪事に言及しており、20節は投獄をもう一つの悪事として加える構文になっている。ただし「悪事」は20節そのものでは省略されているため、注でより字義的な形も示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。主語「ヘロデ」はギリシア語本文では省略されているが、直前の文脈から明白であり、日本語で自然に理解できるよう補った。「牢に閉じ込める」は「投獄する」より具体的で、κατακλείω と ἐν φυλακῇ の双方を簡潔に反映する。
