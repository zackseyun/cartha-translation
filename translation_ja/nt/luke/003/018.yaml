  text: Πολλὰ μὲν οὖν καὶ ἕτερα παρακαλῶν εὐηγγελίζετο τὸν λαόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/018.yaml
  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: ja
  text: そこでヨハネは、ほかにも多くのことを勧めながら[a]、民に良い知らせを告げていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「ほかにも多くのことを勧めながら」。ギリシア語では、「多くの」が指す内容は明示されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: ほかにも多くのことを
  rationale: 中性複数形が名詞的に用いられ、目的語は明示されていない。「こと」と補うことで、原文の含みを保ちながら自然な日本語にした。
- source_word: μὲν οὖν
  choice: そこで
  rationale: 前文を受けた継続と推移を示す粒子の組み合わせ。個々の粒子を過度に訳し分けず、自然な談話の流れを表した。
- source_word: παρακαλῶν
  choice: 勧めながら
  rationale: 文脈上、励ましだけでなく悔い改めを促す勧告を含む。「勧める」は、その訴えかけを現代日本語で簡潔に伝える。
- source_word: εὐηγγελίζετο
  choice: 良い知らせを告げていた
  rationale: 未完了過去の継続性と、単なる説教ではなく「良い知らせ」を伝えるという語義を保った。
- source_word: τὸν λαόν
  choice: 民に
  rationale: λαόςの共同体的な響きを残しつつ、本文が明示しない限定を加えない。「群衆」より原語に近い。
theological_decisions:
- issue: ヨハネの宣教における εὐηγγελίζετο の意味
  choice: 良い知らせを告げていた
  alternative: 宣べ伝えていた／知らせていた
  rationale: 厳しい勧告を含むヨハネの宣教を、原文自体が「良い知らせを告げる」と表現している。その神学的緊張を弱めずに残した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体。「ヨハネ」は直前の文脈から補って主語を明確にし、「民」は原語の共同体的な含みを保つため採用した。
