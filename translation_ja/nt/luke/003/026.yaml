  text: τοῦ Μάαθ τοῦ Ματταθίου τοῦ Σεμεῒν τοῦ ⸀Ἰωσὴχ τοῦ Ἰωδὰ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/026.yaml
  text: the son of Maath[a], the son of Mattathias, the son of Semein, the son of Josech, the son of Joda,
translation:
  language: ja
  text: マアトの子[a]、マタティアの子、セメインの子、ヨセクの子、ヨダの子であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、それぞれの名の前に「～の」に当たる語だけが繰り返されている。ここでは前後の系図の文脈に従い、「～の子」と補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: ～の子
  rationale: 系図の前後の文脈から、属格冠詞の反復は省略された親子関係を表す。日本語では関係を明確かつ自然に示すため「～の子」と補った。
- source_word: Μάαθ
  choice: マアト
  rationale: ギリシア語の人名を、現代日本語で読みやすい形に音写した。
- source_word: Ματταθίου
  choice: マタティア
  rationale: 属格形の背後にある人名 Ματταθίας を日本語に音写した。
- source_word: Σεμεῒν
  choice: セメイン
  rationale: 本文のギリシア語形を素直に反映して音写した。
- source_word: Ἰωσὴχ
  choice: ヨセク
  rationale: SBLGNTの綴りἸωσήχを反映し、語末のχを「ク」で表した。
- source_word: Ἰωδὰ
  choice: ヨダ
  rationale: 本文のギリシア語形Ἰωδάを直接的に音写した。
theological_decisions: []
