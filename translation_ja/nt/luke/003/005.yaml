id: LUK.3.5
reference: Luke 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: ja
  text: すべての谷[a]は埋められ、すべての山と丘は低くされる。曲がった所はまっすぐになり、でこぼこの道は滑らかな道になる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「谷」は「谷間」または「峡谷」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: この節はイザヤ書40章4節を踏まえ、主の道を備えることを道路整備の情景で描いている。
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: すべての谷
  rationale: φάραγξは谷、谷間、峡谷を表す。イザヤ書を背景とする地形の描写として、自然で広く理解できる「谷」を採用した。より狭く険しい地形を示す「谷間」も可能である。
- source_word: πληρωθήσεται
  choice: 埋められ
  rationale: πληρόωの未来受動形。地形について「満たされる」よりも「埋められる」が自然で、低地をならす道路整備の像を明瞭に伝える。
- source_word: πᾶν ὄρος καὶ βουνός
  choice: すべての山と丘
  rationale: ὄροςとβουνόςの近義語二語を「山」と「丘」として区別し、原文の詩的な並行表現を保った。
- source_word: ταπεινωθήσεται
  choice: 低くされる
  rationale: この地形的文脈では、ταπεινόωの受動形は高い土地が低くされることを指す。「低くされる」は具体像を保ちつつ、この語が持ちうる比喩的な響きも消さない。
- source_word: τὰ σκολιά
  choice: 曲がった所
  rationale: 中性複数の形容詞が名詞的に用いられている。道路や地形を想定しつつも、原文にない「道」をここで明示しすぎないよう「所」とした。
- source_word: εἰς εὐθείαν
  choice: まっすぐになり
  rationale: 変化の結果を示すεἰςを、日本語として自然な「まっすぐになる」で表した。
- source_word: αἱ τραχεῖαι
  choice: 険しい道
  rationale: 女性複数の名詞的形容詞で、道を補って理解する表現。「険しい」は凹凸があり通行しにくい状態を自然に示す。
- source_word: εἰς ὁδοὺς λείας
  choice: 平らな道になる
  rationale: ὁδούςを「道」、λείαςを「平らな」と訳した。λεῖοςには「滑らかな」も可能だが、道路整備の地形的文脈では「平らな」が明瞭である。
theological_decisions:
- issue: ルカが引用するイザヤ40章4節の預言的・地形的比喩
  choice: 地形と道路整備の具体的な描写を保持する。
  alternative: 「へりくだる者は上げられ、高ぶる者は低くされる」など、道徳的・霊的意味を訳文に織り込む。
  rationale: この節は主の道を備える文脈で具体的な地形の語を用いている。含意を訳文で限定せず、詩的な道路整備の像と神学的緊張をそのまま残す。
translation_notes:
  register: 明快な現代標準日本語を用い、預言の荘重さと並行法を保った。「埋められ」「低くされる」という受動表現を維持し、行為者を原文以上に特定していない。
