  text: ἀποκριθεὶς δὲ ⸀ἔλεγεν αὐτοῖς· Ὁ ἔχων δύο χιτῶνας μεταδότω τῷ μὴ ἔχοντι, καὶ ὁ ἔχων βρώματα ὁμοίως ποιείτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: ja
  text: ヨハネは彼らに答えて言った。「衣服[a]を二着持っている人は、持っていない人に分け与えなさい。食べ物を持っている人も、同じようにしなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「キトン」。肌に近く着る基本的な衣服を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: そこでヨハネは彼らに答えた
  rationale: 分詞と未完了過去から成る応答の導入を、現代日本語の自然な物語文として訳した。主語は直前の文脈からヨハネであるため明示し、δέは穏やかな展開を示す「そこで」とした。未完了過去の継続・反復性はここで断定せず、通常の発話導入とした。
- source_word: Ὁ ἔχων δύο χιτῶνας
  choice: 下着を二枚持っている人
  rationale: χιτώνは肌に近く着る基本的な衣服を指す。「下着」は現代の肌着だけを連想させる可能性もあるが、「上着」や一般的な「服」より古代の衣服区分を反映する。一般化された単数は「人」で自然に表した。
- source_word: μεταδότω τῷ μὴ ἔχοντι
  choice: 一枚も持っていない人に分けなさい
  rationale: μεταδότωの第三人称命令の明確な勧告・命令を「分けなさい」で示した。欠けている目的語は文脈上χιτώνなので、「一枚も」と補って意味を明瞭にした。
- source_word: βρώματα
  choice: 食べ物
  rationale: 食べる物や食料を広く表す語なので、平明で自然な「食べ物」とした。
- source_word: ὁμοίως ποιείτω
  choice: 同じようにしなさい
  rationale: 前半と同じ命令の力を保ち、衣服を分ける場合と同様に食べ物も分けるよう求める並行関係を自然に示した。
theological_decisions:
- issue: 一般化された男性単数分詞の表現
  choice: 持っている人／持っていない人
  alternative: 持つ者／持たない者
  rationale: ギリシア語の男性単数分詞はここで性別を限定せず、一般的な人を指す。現代日本語で包括性と代表単数の意味を自然に伝え、不要な男性限定を持ち込まない表現を選んだ。
- issue: 命令の強さ
  choice: 分けなさい／同じようにしなさい
  alternative: 分けるべきです／同じようにするべきです
  rationale: 二つの第三人称現在命令形の直接的な勧告を保った。「べき」は命令を一般原則へ弱めるおそれがあるため避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、ヨハネの勧告の簡潔さと威厳を保った。χίτωνは文化的距離のある語だが、本文では理解しやすさを優先して「下着」とした。
