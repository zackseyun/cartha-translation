id: LUK.3.9
reference: Luke 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: ja
  text: 斧はすでに木々の根元に置かれている。だから、良い実を結ばない木はみな切り倒され、火に投げ込まれる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: すでに
  rationale: ἤδηの切迫した時間的意味を明確にし、δὲ καὶは日本語では文脈上不自然な逐語訳を避けて流れに含ませた。
- source_word: ἡ ἀξίνη
  choice: 斧
  rationale: 木を切る道具を指す比喩を、現代日本語で簡潔かつ明瞭に表す。
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: 木々の根元に置かれている
  rationale: 斧が根元に据えられ、伐採が迫っている情景を自然な日本語で保つ。κεῖταιの状態的な現在も反映する。
- source_word: πᾶν οὖν δένδρον
  choice: だから、…木はみな
  rationale: οὖνの推論・帰結を「だから」で示し、πᾶνの包括性を「みな」で自然に表す。
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: 良い実を結ばない
  rationale: 果樹について日本語で通常用いる「実を結ぶ」により、直喩と倫理的含意の双方を保つ。
- source_word: ἐκκόπτεται
  choice: 切り倒され
  rationale: 木を根元から伐採する場面に即した自然で鮮明な受動表現。
- source_word: εἰς πῦρ βάλλεται
  choice: 火に投げ込まれる
  rationale: 受動態と厳しい裁きのイメージを保ちつつ、πῦρに定冠詞がないため日本語では単に「火」とした。
theological_decisions:
- issue: 裁きの比喩が指す範囲
  choice: 斧、実を結ばない木、火という農耕的な裁きの比喩をそのまま保持する
  alternative: 「火」を明示的に地獄、あるいはイスラエルへの歴史的裁きと解釈して訳す
  rationale: 本文は切迫した厳しい裁きを示すが、その火の具体的な指示対象を限定していないため、終末論的・歴史的意味のいずれかに訳文で固定しない。
translation_notes:
  register: 明瞭で現代的ながら、警告の荘重さと切迫感を保つ文体。「木々」は複数形を示し、「木はみな」でπᾶνの分配的意味を表した。不要な解釈的補足は加えていない。
