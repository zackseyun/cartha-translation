  source_fidelity: 原文の主要要素を忠実に反映している。「すでに」はἤδηの切迫性を、「木々の根元に置かれている」はπρὸς τὴν ῥίζαν τῶν δένδρων κεῖταιの準備された状態を、「木はみな」はπᾶν δένδρονの包括性を適切に表す。「切り倒され、火に投げ込まれる」は二つの受動動詞ἐκκόπτεται καὶ εἰς πῦρ βάλλεταιを保ち、火の意味を解釈的に限定していない。δὲ καὶの添加的なニュアンスは明示されないが、日本語の自然な文として許容され、意味上の重要な欠落とはならない。
