  text: τοῦ Ἰακὼβ τοῦ Ἰσαὰκ τοῦ Ἀβραὰμ τοῦ Θάρα τοῦ Ναχὼρ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/034.yaml
  text: the son of Jacob[a], the son of Isaac, the son of Abraham, the son of Terah[c][b], the son of Nahor
translation:
  language: ja
  text: ヤコブの子、イサクの子、アブラハムの子、テラの子[a]、ナホルの子[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語名は「タラ」に近い形。ここでは旧約聖書で広く用いられる名に合わせて「テラ」とした。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語名は「ナコル」に近い形。ここでは旧約聖書で広く用いられる名に合わせて「ナホル」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: ～の子
  rationale: 系図の前後の文脈から補われる親子関係を明示する。ギリシア語では属格を示す語が各名の前に反復されるが、現代日本語では「～の子」とすることで系図の連鎖が自然かつ明瞭になる。
- source_word: Ἰακώβ
  choice: ヤコブ
  rationale: 旧約聖書の族長として日本語聖書で広く定着している表記を用いた。
- source_word: Ἰσαάκ
  choice: イサク
  rationale: 旧約聖書の人物名として日本語で定着している表記を用いた。
- source_word: Ἀβραάμ
  choice: アブラハム
  rationale: 旧約聖書の族長名として日本語で定着している表記を用いた。
- source_word: Θάρα
  choice: テラ
  rationale: ギリシア語形は「タラ」に近いが、同一人物を示す旧約聖書のヘブライ語名תֶּרַחに対応する、日本語で定着した「テラ」を採用した。
- source_word: Ναχώρ
  choice: ナホル
  rationale: ギリシア語形を機械的に写すより、旧約聖書の同一人物として日本語で定着している「ナホル」を採用した。
theological_decisions:
- issue: 省略された系図上の関係の補足
  choice: 各属格名を「～の子」と訳す
  alternative: 「～の」とだけ訳して名を連ねる
  rationale: 原文は周囲の系図形式を受け、属格の連鎖だけで親子関係を表す。日本語では関係を明示しないと不自然で分かりにくいため、「子」を補った。これは系図の統語上含意される関係を明確にするもので、神学的内容を付加するものではない。
- issue: 旧約人物名の表記
  choice: 旧約聖書で定着した「テラ」「ナホル」を用いる
  alternative: ギリシア語形により近い「タラ」「ナコル」を用いる
  rationale: ルカが列挙している旧約系図上の人物との同一性を明瞭にし、一般の読者が認識しやすい慣用表記を採用した。本文の人物同定や神学的含意は変更しない。
translation_notes:
  register: 簡潔な系図の調子を保ちつつ、現代標準日本語として明瞭な「～の子」の反復を採用した。人名は一般的な日本語聖書の旧約表記に合わせ、荘重すぎる古語や説明的な言い換えは避けた。
