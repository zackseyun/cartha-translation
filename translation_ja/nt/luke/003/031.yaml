base_translation:
  language: en
  yaml_path: translation/nt/luke/003/031.yaml
  text: the son of Melea[a], the son of Menna, the son of Mattatha, the son of Nathan, the son of David[b],
translation:
  language: ja
  text: メレア[a]の子、メンナ[b]の子、マタタの子、ナタンの子、ダビデの子、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では直訳すると「メレアの、メンナの、マタタの、ナタンの、ダビデの」。ルカの系図で繰り返されるこの構文では、「～の子」という関係が省略されている。
    reason: lexical_alternative
  - marker: b
    text: 一部の英語訳の伝統では、この名を「メナン」とする。ここではSBLGNTの本文Μεννάに従い、「メンナ」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: ～の子
  rationale: この系図では、各固有名詞に付く属格冠詞が、周囲の系図表現から補われる「～の子」という関係を省略して示している。日本語では関係を明示することで、原文の意味と反復構造を自然に伝えられる。
- source_word: Μελεὰ
  choice: メレア
  rationale: ギリシア語の固有名 Μελεά を日本語で直接音写した。
- source_word: Μεννὰ
  choice: メンナ
  rationale: 底本SBLGNTの Μεννά を直接音写した。「メナン」などの形を採る伝統もあるため、異読情報を脚注に示す。
- source_word: Ματταθὰ
  choice: マタタ
  rationale: ギリシア語 Ματταθά の語末を過度に補わず、日本語として簡潔に音写した。
- source_word: Ναθὰμ
  choice: ナタン
  rationale: ギリシア語 Ναθάμ に対応し、日本語聖書で広く認識される旧約の固有名表記「ナタン」を用いた。
- source_word: Δαυὶδ
  choice: ダビデ
  rationale: ギリシア語 Δαυίδ に対応する、日本語で定着した聖書名「ダビデ」を用いた。
theological_decisions:
- issue: 系図における省略表現
  choice: 各属格名に「～の子」を補う。
  alternative: 「メレアの、メンナの、マタタの、ナタンの、ダビデの」と属格だけを並べる。
  rationale: 原文は系図全体の構文に依存した属格の連鎖であり、親子関係を文脈上明確に含意する。「～の子」を補うことは新たな神学的情報の追加ではなく、現代日本語でその省略を自然に展開するものである。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。系図の反復を保持し、固有名は底本のギリシア語形を基礎にしつつ、日本語で定着した聖書名については慣用表記を採用した。節が次へ続くことを示す読点も維持した。
