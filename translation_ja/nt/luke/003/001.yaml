id: LUK.3.1
reference: Luke 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: ja
  text: さて、ティベリウス・カエサルの治世の第十五年[a]、ポンティオ・ピラトがユダヤを治め、ヘロデがガリラヤの四分領主であり、彼の兄弟フィリポがイツラヤとトラコニティス地方の四分領主であり、リサニアがアビレネの四分領主であった時[b]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「治世の第十五年の間」。
    reason: ἐν ἔτειは、その年の中の時点または期間を示し得るため。
  - marker: b
    text: 「四分領主」は、ローマの権威のもとで一定の地域を治めた統治者の称号。
    reason: 古代の政治的称号についての文化・歴史的説明。
lexical_decisions:
- source_word: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ
  choice: さて、…第十五年
  rationale: ἐν ἔτει の時を示す枠組みを「第十五年」で明確にし、δέの弱い叙述上の移行を自然な「さて」で表した。
- source_word: τῆς ἡγεμονίας Τιβερίου Καίσαρος
  choice: ティベリウス・カエサルの治世
  rationale: 皇帝の統治期間を指すため、現代日本語で自然かつ歴史的文脈に適した「治世」とした。
- source_word: ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας
  choice: ポンティオ・ピラトがユダヤを治め
  rationale: 分詞の動作性と属格絶対の状況説明を保ち、肩書きへ固定せず「治め」と訳した。
- source_word: τετρααρχοῦντος
  choice: 領主…であった
  rationale: ローマ支配下の地域統治者という歴史的役職を、本文では分かりやすい「領主」とし、厳密な意味を脚注で補った。
- source_word: Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ
  choice: 彼の兄弟フィリポ
  rationale: αὐτοῦが直前のヘロデを指す関係を保ち、自然な日本語の同格表現とした。
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: イトラヤとトラコニティス地方
  rationale: χώραの地域・領域という意味を「地方」で明示し、二つの地名を並列にした。
- source_word: τῆς Ἀβιληνῆς
  choice: アビレネ
  rationale: 古代の地域名として標準的な音写を用いた。
theological_decisions:
- issue: τετρααρχοῦντοςという政治的称号の訳し方
  choice: 本文では「領主」、脚注で「四分領太守」の歴史的意味を説明する。
  alternative: 「四分領太守であった」または一般化して「治めていた」
  rationale: 固有の役職を単なる統治動作へ平板化せず、それと同時に一般読者が本文を無理なく理解できるようにした。神学的含意を付加せず、歴史的具体性を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文が後続節へ続く長文であることを反映し、文末を読点で結んだ。人名・地名は日本語聖書で広く認識される形を基本とし、歴史的称号は本文の可読性と脚注の精密さを組み合わせた。
