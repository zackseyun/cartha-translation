id: LUK.3.7
reference: Luke 3:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: ja
  text: そこでヨハネは、自分から洗礼を受けるために出て来た群衆に、こう言っていた。「まむしの子らよ、迫り来る怒りから逃れるよう、誰があなたがたに教えたのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 言っていた
  rationale: 未完了時制が表す継続的または反復的な発言を、頻度を限定せず自然な日本語で示す。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けた物語上の展開を、現代日本語として自然に示す。
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: 出て来る群衆に
  rationale: ヨハネのもとへ外に出て来る動きを保ちつつ、簡潔で自然な表現とする。
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: 自分から洗礼を受けようと
  rationale: 受動不定詞と動作主を保ち、群衆が出て来た目的を自然な日本語で表す。「自分」は文の主語であるヨハネを指す。
- source_word: Γεννήματα ἐχιδνῶν
  choice: まむしの子ら
  rationale: γέννημαの出生・産出されたものという意味と、ἐχιδνῶνの強い比喩を、明瞭で定着した日本語として伝える。
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: 誰があなたがたに教えたのか
  rationale: ὑποδείκνυμιの「示す、知らせる、教える」の幅を保つ。文脈上は警告の含意があるが、「警告した」と限定しすぎない。
- source_word: φυγεῖν
  choice: 逃れられると
  rationale: 危険から逃げるという像を保ちつつ、ὑπέδειξενに従属する不定詞を自然な日本語にする。
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: 迫り来る怒りから
  rationale: μέλλουσαの将来性と切迫感を表し、ὀργήを解釈的に「裁き」へ置き換えず「怒り」として保持する。
theological_decisions:
- issue: ὀργήが指すもの
  choice: 「怒り」と訳し、迫り来る神の裁きという含意を保ちながら、その形態や時期を限定しない
  alternative: 「終末の裁き」または「迫り来る刑罰」と明示する
  rationale: 文脈は悔い改めを神の裁きと結び付けるが、この節自体はὀργήという広い語を用いるため、特定の終末論的枠組みに狭めない。
- issue: τίς ὑπέδειξεν ὑμῖνの修辞的力
  choice: 「誰があなたがたに教えたのか」
  alternative: 「誰があなたがたに警告したのか」
  rationale: 警告の含意は文脈にあるが、原語は「示す・知らせる・教える」も意味しうるため、問いの皮肉や非難を保ちながら語義を狭めすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヨハネの厳しい呼びかけと修辞疑問の力を保った。「洗礼」は一般読者に通じる定着語として採用し、「怒り」は神学的緊張を解消せず原語に沿って残した。
