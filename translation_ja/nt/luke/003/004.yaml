id: LUK.3.4
reference: Luke 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: ja
  text: '預言者イザヤの言葉を記した書に、こう書かれている。


    「荒野で[b]叫ぶ者の声。


    『主[a]の道を整えよ。


    その方の道筋をまっすぐにせよ。』」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 引用元のイザヤ書40章3節のヘブライ語では、ここに神の名YHWHが用いられている。
    reason: source_background
  - marker: b
    text: 「荒野で」は、ここに示したように「叫ぶ」にかけることも、後の命令にかけて、「叫ぶ者の声。『荒野に主の道を整えよ』」と読むこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὡς γέγραπται
  choice: こう書かれている
  rationale: 聖書引用を導く完了受動の定型表現を、書かれた内容が今も効力を持つことを自然な日本語で表した。
- source_word: ἐν βίβλῳ λόγων Ἠσαΐου τοῦ προφήτου
  choice: 預言者イザヤの言葉を記した書に
  rationale: βίβλος と λόγοι の双方を反映しつつ、「言葉の書」という不自然さを避け、現代日本語として明瞭にした。
- source_word: Φωνὴ βοῶντος
  choice: 叫ぶ者の声
  rationale: 属格分詞の人的な意味を保ち、預言的な簡潔さも維持した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: ヨハネの活動場所と預言的背景に適する「荒野」を採用し、本文ではギリシア語の通常の読み方に従って「叫ぶ」に結び付けた。別の係り受けは脚注に示した。
- source_word: Ἑτοιμάσατε τὴν ὁδὸν κυρίου
  choice: 主の道を整えよ
  rationale: 命令形と道を備える比喩を簡潔に保持した。「整えよ」は道路の準備と迎える備えの双方を含み得る。
- source_word: κυρίου
  choice: 主
  rationale: ルカのギリシア語本文の κύριος を直接反映した。引用元のヘブライ語にある神名YHWHとの関係は脚注で明示した。
- source_word: εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ
  choice: その方の通る道をまっすぐにせよ
  rationale: αὐτοῦ の指示対象を敬意ある自然な日本語で示し、τρίβοι を道路準備の文脈に即して「通る道」とした上で、命令の力を保った。
theological_decisions:
- issue: イザヤ書でYHWHを指す引用中の κύριος の訳し方
  choice: 主
  alternative: 神名を示す表記（「主」〔YHWH〕など）
  rationale: 本文はSBLGNTの κύριος を訳して「主」とし、引用元で神名YHWHが用いられている事実は脚注に残す。これにより、ルカの文脈にあるキリスト論的な響きを過度に限定せず、同時に旧約の背景も隠さない。
- issue: ἐν τῇ ἐρήμῳ の係り受け
  choice: 「叫ぶ」に結び付ける
  alternative: 後続の命令に結び付けて「荒野に主の道を整えよ」と読む
  rationale: ルカのギリシア語の語順と通常の句読法に従いながら、文法上・引用史上の別の理解を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書引用にふさわしい簡潔で格調ある命令形「整えよ」「まっすぐにせよ」を採用した。引用内の並行法と道路準備の比喩を保ち、不自然な逐語調は避けた。
