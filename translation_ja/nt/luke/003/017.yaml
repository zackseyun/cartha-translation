id: LUK.3.17
reference: Luke 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: ja
  text: その方は手に箕[a]を持ち、脱穀場をすっかりきれいにし、麦を倉に集める。しかし、もみ殻は消すことのできない火[b]で焼き尽くす。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「箕」は、穀物を空中にあおり上げ、実ともみ殻を選り分けるための農具。
    reason: lexical_clarification
  - marker: b
    text: 「消すことのできない火」は、「消えない火」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: 箕
  rationale: 穀物を空中にあおり上げ、実ともみ殻を選り分ける農具を指す。日本語では伝統的かつ簡潔な対応語である。
- source_word: διακαθᾶραι
  choice: 隅々まで清め
  rationale: 接頭辞の強意を保ちつつ、脱穀場から不要物を徹底的に取り除く動作を自然に表す。
- source_word: ἅλωνα
  choice: 脱穀場
  rationale: 脱穀と選別を行う場所を示す標準的な訳語で、農耕による比喩を保つ。
- source_word: συναγαγεῖν
  choice: 集める
  rationale: 選別後の麦を一か所へ収める動作を素直に表す。
- source_word: σῖτον
  choice: 麦
  rationale: 広く穀物を指し得るが、もみ殻との対比および文脈上、日本語では「麦」が自然である。
- source_word: ἀποθήκην
  choice: 倉
  rationale: 収穫物を保管する場所を簡潔に表し、建物の種類を不必要に限定しない。
- source_word: ἄχυρον
  choice: もみ殻
  rationale: 選別によって穀粒から分けられる不要部分を指す文脈に適する。「わら」より選別場面が明確である。
- source_word: κατακαύσει
  choice: 焼き尽くす
  rationale: 完全に焼くという複合動詞の強い意味を自然な日本語で保つ。
- source_word: πυρὶ ἀσβέστῳ
  choice: 消すことのできない火で
  rationale: 火が消され得ないという意味を明確にし、裁きの比喩の強さを弱めない。
- source_word: οὗ
  choice: その方は
  rationale: 直前の「来られる方」を受ける属格関係代名詞を、日本語で自然な主題提示に転換した。所有関係は続く「手に箕を持ち」で表される。
theological_decisions:
- issue: 農耕比喩における選別と裁き
  choice: 麦を倉に集め、もみ殻を消せない火で焼き尽くすという救いと裁きの対照をそのまま保つ。
  alternative: イスラエルに対する歴史的・一時的裁きだけに限定する、または体系化された地獄の教理を明示的に読み込む。
  rationale: 本文は決定的な選別と裁きを明瞭に描くが、その時期や教理上の詳細までは説明していないため、比喩の力を保ちながら範囲を限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「その方」で直前の来るべき方を受け、「隅々まで」により動詞の強意を表した。農耕語「箕」は本文に残し、脚注で説明した。
