base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: ja
  text: アンナスとカイアファが大祭司職にあった時に[a]、荒野にいたゼカリヤの子ヨハネに、神のことばが臨んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「アンナスとカイアファの大祭司職の時に」。原文は「大祭司」を単数形で記しながら、アンナスとカイアファの二人を挙げている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: アンナスとカイアファの大祭司在任中
  rationale: 属格を伴うἐπίの時間的用法を「在任中」とし、年代設定を自然な日本語で示した。ἀρχιερέωςが単数であることを反映して「大祭司たち」とはせず、二人の名と単数形の役職との緊張を保った。
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: 神のことばが臨んだ
  rationale: 預言者への啓示を表す聖書的な定型表現である。「臨んだ」はἐγένετοの出来事性と、神からことばが与えられたことを、簡潔で品位ある日本語で伝える。
- source_word: ἐπὶ Ἰωάννην
  choice: ヨハネに
  rationale: 啓示のことばが向けられた相手を示すἐπί＋対格を、現代日本語として自然な「に」で表した。
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: ゼカリヤの子ヨハネ
  rationale: 同格表現によるヨハネの特定を、自然かつ簡潔に再現した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野にいた
  rationale: ἔρημοςは砂だけの砂漠に限らず、人里離れた地域を指すため「荒野」とした。語順を調整し、この場所句がヨハネに関係することを日本語で明確にした。
theological_decisions:
- issue: 単数形ἀρχιερέωςと、アンナスおよびカイアファという二名の関係をどう訳すか
  choice: 「アンナスとカイアファの大祭司在任中」として、役職表現を単数的・制度的に保つ
  alternative: 「アンナスとカイアファが大祭司であったころ」
  rationale: 別案は二人が同時に同じ官職に就いていたと平板に読まれやすい。本文の単数形と二名の併記が生む歴史的・文学的な緊張を、調和的説明を加えず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、預言的定型句「神のことばが臨んだ」と地理的表現「荒野」によって、ルカの叙述にふさわしい簡潔で品位ある文体とした。
