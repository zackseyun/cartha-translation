id: LUK.3.23
reference: Luke 3:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: ja
  text: さて、イエス自身は、始めたころ[a]、およそ三十歳であった。人々にはヨセフの子と思われていた[b]。ヨセフはエリの子であった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 何を始めたかはギリシア語本文に明記されていないが、文脈上はイエスの公の活動の開始を指す。
    reason: lexical_alternative
  - marker: b
    text: すなわち、イエスは一般にヨセフの子と見なされていた。
    reason: clarification
  - marker: c
    text: ギリシア語の系図では「子」という語がここから省略され、属格の名が連ねられている。
    reason: source_form
lexical_decisions:
- source_word: Καὶ
  choice: さて
  rationale: 直前の洗礼の記事から新しい叙述へ移る接続を、現代日本語で自然に示す。単なる並列の「そして」より、この箇所の話題転換に適する。
- source_word: αὐτὸς Ἰησοῦς
  choice: イエス自身
  rationale: αὐτόςの強調を保ちつつ、過度に敬語的な表現を避け、明快で品位ある日本語とした。
- source_word: ἦν … ἀρχόμενος
  choice: 働きを始めたころ
  rationale: 迂言的な構文を自然な時間表現にした。何を始めたかは原文に明記されないため、「公の宣教」などと限定せず、文脈上の活動を広く表す「働き」とし、その補足性を脚注で明示した。
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: およそ三十歳
  rationale: ὡσεὶの概数性を「およそ」で保持し、年齢表現を自然な現代日本語にした。
- source_word: ὢν υἱός, ὡς ἐνομίζετο, Ἰωσήφ
  choice: 人々にはヨセフの子と思われていた
  rationale: ὡς ἐνομίζετοが示す一般的な認識と、語り手自身の断定との距離を明確に表した。
- source_word: τοῦ Ἠλὶ
  choice: ヨセフはエリの子であった
  rationale: 系図で反復省略される属格を、日本語で理解できるよう「子」を補って明示した。
theological_decisions:
- issue: 「そう思われていた」が修飾する親子関係
  choice: イエスがヨセフの子であるという世間の認識を示す
  alternative: ヨセフとの親子関係を限定せず、系図全体への漠然とした留保として訳す
  rationale: 語順とルカ福音書の処女懐胎の記事を踏まえ、ヨセフの父性を生物学的事実として断定せず、社会的・一般的認識として提示する。ただし、法的父子関係など原文が明言しない説明は本文に加えない。
- issue: ἀρχόμενοςの省略された目的語
  choice: 本文では広い意味の「働き」を補い、脚注で原文の省略を示す
  alternative: 「公の宣教を始めた」と特定する、または「始めたころ」とだけ訳す
  rationale: 文脈上はイエスの公の活動の開始を指す可能性が高いが、原文に「宣教」や「務め」はない。日本語としての明瞭さを確保しながら、脚注によって原文の曖昧さを保存した。
- issue: ヨセフとエリの関係
  choice: 通常の系図構文として「ヨセフはエリの子」と訳す
  alternative: 逐語的に「エリのヨセフ」として関係を明示しない
  rationale: τοῦを連ねるギリシア語系図では「〜の子」が省略されている。日本語では補わなければ不明瞭になるため、通常の親子関係として表したが、姻戚関係などの調和的説明は加えない。
translation_notes:
  register: 明快な現代標準日本語を用い、系図の導入部を短い文に分けて読みやすくした。「ご自身」「始められた」のような敬語は避けつつ、「さて」「およそ」によって落ち着いた聖書本文の格調を保った。
