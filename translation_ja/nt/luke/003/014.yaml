source:
  edition: SBLGNT
  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: ja
  text: 兵士たちもヨハネに尋ねた。「私たちも何をすればよいのですか。」ヨハネは彼らに言った。「だれからも金品を脅し取ってはならない[a]。だれかを偽って訴えてもならない。自分の給料[b]で満足しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「脅し取る」に当たる語は、字義的には「激しく揺さぶる」という意味を持ち、ここでは威圧して不当に金品を取り立てることを指す。
    reason: lexical_alternative
  - marker: b
    text: 「給料」と訳した語は、兵士に支給される報酬や糧食を指すことがあり、「給与」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: 兵士たち
  rationale: 軍務に就いている人々を指す現在分詞。文脈上、現代日本語では「兵士たち」が簡潔で自然。
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: では、私たちも何をすればよいのですか
  rationale: 熟慮を表す接続法を「何をすればよい」で表し、καὶ ἡμεῖς の明示的な強調を「私たちも」として保持した。
- source_word: διασείσητε
  choice: 金品を脅し取ってはならない
  rationale: 原義には「激しく揺さぶる」があるが、ここでは権力や威圧を用いて不当に財物を取り立てる行為を指す。「金品」は金銭だけに狭めず、利得目的の強要を自然に表す。
- source_word: συκοφαντήσητε
  choice: 偽って訴えてもならない
  rationale: 人を不当に告発する意味を明確にしつつ、恐喝とまで限定せず、原文が含み得る法的・社会的な幅を残した。
- source_word: ἀρκεῖσθε
  choice: 満足しなさい
  rationale: 継続的な態度を求める現在命令形の倫理的な力を、明快な現代日本語で表した。
- source_word: ὀψωνίοις
  choice: 給金
  rationale: 兵士への報酬または支給物を指し得る語。軍務の文脈に合い、単なる一般賃金よりも当時の兵士の給与を想起させる「給金」を採用した。
theological_decisions:
- issue: 兵士に対する倫理的な指示
  choice: 兵役を離れるよう命じるのではなく、兵士として権力を乱用せず、貪欲を避けるよう命じる言葉として訳した。
  alternative: この節自体が兵役そのものを暗に非難していると解する。
  rationale: 原文は軍務に就いている者たちに対し、その立場を利用した強奪と偽りの告発を禁じ、給金に満足するよう命じている。軍務の是非について、本文に明記されていない教理的結論は訳文に加えない。
translation_notes:
  register: 明瞭で品位のある現代標準語。会話は丁寧さを保ちながら簡潔にし、καὶ ἡμεῖς の「私たちも」という強調を自然な語順で残した。発話者がヨハネであることは章の文脈から明らかだが、単独節としての可読性を高めるため代名詞を固有名で示した。
