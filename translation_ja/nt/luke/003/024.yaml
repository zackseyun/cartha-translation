  text: the son of Matthat[a], the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph,
translation:
  language: ja
  text: マタテの子、レビの子、メルキの子、ヤンナイの子、ヨセフの子、[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「マタテの、レビの、メルキの、ヤンナイの、ヨセフの」。ギリシア語は属格を繰り返して系図を続けており、前後の文脈から「の子」が補われます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: 〜の子
  rationale: この属格冠詞の反復は、前後の系図の構文に依存して親子関係を省略して表している。日本語では各名の後に「の子」を補い、意味を明確にした。
- source_word: Μαθθὰτ
  choice: マタテ
  rationale: ギリシア語の人名を、現代日本語で読みやすい慣用的な形に音写した。
- source_word: Λευὶ
  choice: レビ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: Μελχὶ
  choice: メルキ
  rationale: ギリシア語 Μελχί の音を明瞭に反映する日本語表記とした。
- source_word: Ἰανναὶ
  choice: ヤンナイ
  rationale: 語末の二重母音を含むギリシア語 Ἰανναί の形を保つ音写とした。
- source_word: Ἰωσὴφ
  choice: ヨセフ
  rationale: 日本語聖書で定着している人名表記を用いた。
theological_decisions:
- issue: 系図における省略表現
  choice: 各人名に「の子」を補う
  alternative: 属格を形式的に反映して「マタテの、レビの、メルキの、ヤンナイの、ヨセフの」とする
  rationale: 原文は属格冠詞と人名だけを連ねるが、前後の系図から親子関係が明白である。日本語として理解できるよう、原文が含意する「の子」を明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。系図の反復を自然に示しつつ、人名は日本語で読みやすい音写とした。句末の読点は次節へ系図が続くことを示す。
