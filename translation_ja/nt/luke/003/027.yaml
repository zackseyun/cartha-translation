  text: the son of Joanan[a], the son of Rhesa, the son of Zerubbabel, the son of Shealtiel, the son of Neri[b],
translation:
  language: ja
  text: ヨアナンの子[a]、レサの子、ゼルバベルの子、シェアルティエル[b]の子、ネリの子、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では各人名に「～の」に当たる形が繰り返されている。「子」は系図の文脈から補った。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語形は「サラティエル」。旧約聖書の名「シェアルティエル」と同一と伝統的に理解されている。
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: ～の子
  rationale: 系図の前後の文脈によって補われる親子関係を、自然で明瞭な日本語にするため明示した。ギリシア語自体は各固有名詞に属格冠詞を繰り返している。
- source_word: Ἰωανὰν
  choice: ヨアナン
  rationale: ギリシア語の人名を、現代日本語で読みやすい形に音写した。
- source_word: Ῥησὰ
  choice: レサ
  rationale: ギリシア語の人名を日本語の慣用的な音写で表した。
- source_word: Ζοροβαβὲλ
  choice: ゼルバベル
  rationale: 旧約聖書でも知られる人物名として、日本語聖書で広く認識される形を用いた。
- source_word: Σαλαθιὴλ
  choice: シェアルティエル
  rationale: ギリシア語形の直接音写「サラティエル」ではなく、旧約聖書の同名人物とのつながりが分かる慣用形を採用した。
- source_word: Νηρὶ
  choice: ネリ
  rationale: ギリシア語の人名を簡潔に音写した。
theological_decisions:
- issue: 系図における省略表現
  choice: 各人名を「～の子」と訳す
  alternative: 属格を形式的に「～の」とだけ訳して人名を連ねる
  rationale: ギリシア語では周囲の系図表現から親子関係が補われる。日本語で「子」を明示することは解釈上の付加ではなく、省略された統語関係を自然に表すものである。
translation_notes:
  register: 簡潔な系図のリズムを保ちつつ、現代の一般読者に親子関係が明確に伝わる表現とした。人名は日本語聖書で認識しやすい慣用形を優先した。
