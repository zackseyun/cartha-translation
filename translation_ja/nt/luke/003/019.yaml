source:
  edition: SBLGNT
  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: ja
  text: しかし、領主ヘロデは、兄弟の妻ヘロディアのことや、自分が行ったあらゆる悪事のことで、ヨハネから非難されていたが、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τετραάρχης
  choice: 領主
  rationale: 特定地域を治める歴史的な称号を、現代日本語で理解しやすく、かつ単なる「王」と誤解されない語で表した。
- source_word: ἐλεγχόμενος
  choice: 戒められていた
  rationale: 未完了的・同時的な分詞の働きと、悪事を指摘して道徳的に非難する意味を自然な日本語で表した。誤りを明るみに出す含みもあり得るが、文脈では預言者的な戒めが中心である。
- source_word: ὑπ’ αὐτοῦ
  choice: ヨハネから
  rationale: ギリシア語は代名詞だが、日本語で「彼から」とすると指示対象が不自然に曖昧になるため、直前の文脈上の指示対象であるヨハネを明示した。
- source_word: περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: 兄弟の妻ヘロディアのこと
  rationale: 属格の連鎖と告発の焦点を保ちながら、自然な日本語の語順にした。「兄弟」は原文どおり特定の兄弟名を補わない。
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: 自分が行ったあらゆる悪事のことで
  rationale: πάντων と複数の πονηρῶν が示す、ヘロデの悪い行為全般を簡潔で明瞭に表した。
- source_word: δὲ
  choice: しかし
  rationale: 先行するヨハネの宣教からヘロデとの対立へ移る物語上の対照を示した。
theological_decisions:
- issue: ヨハネによる批判の道徳的な強さ
  choice: 「戒められていた」
  alternative: 「責められていた」「悪事を暴かれていた」
  rationale: ἐλέγχω の道徳的な指摘・非難を保ちつつ、法廷的断罪や単なる暴露へ意味を限定しない表現とした。
- issue: ヘロディアとヘロデの関係の叙述
  choice: 「兄弟の妻ヘロディア」
  alternative: 「兄弟の元妻ヘロディア」
  rationale: 原文は「兄弟の妻」と述べており、「元妻」という歴史的・解釈的補足を本文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。3:20へ続くギリシア語の長い統語構造を反映し、節末を「が、」として次節への継続を示した。歴史的称号 τετραάρχης は、音写の「テトラルケス」より一般読者に通じる「領主」とした。
