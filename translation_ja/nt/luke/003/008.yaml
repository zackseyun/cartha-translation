id: LUK.3.8
reference: Luke 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: ja
  text: だから、悔い改めにふさわしい実を結びなさい[a]。『私たちの父はアブラハムだ』と、自分たちの間で言い始めてはいけません[b]。あなたがたに言いますが、神はこれらの石からでも、アブラハムの子どもたちを起こすことがおできになるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「悔い改めにふさわしい数々の実」。ギリシア語の「実」は複数形で、真の悔い改めにかなうさまざまな行いを指します。
    reason: lexical_alternative
  - marker: b
    text: 「自分自身のうちで」または「自分たちに向かって」とも訳せます。内心の独り言とも、仲間内で交わす言葉とも理解できます。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ποιήσατε οὖν
  choice: だから、…結びなさい
  rationale: οὖνの推論的なつながりを自然な現代日本語の「だから」で示し、ποιέωと「実」の結びつきは日本語の慣用表現「実を結ぶ」で表した。アオリスト命令の明確な要求も保っている。
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: 悔い改めにふさわしい実
  rationale: 複数形καρπούςは、日本語では集合的に「実」とするのが自然である。ἀξίουςは「ふさわしい」とし、行いが悔い改めに対応するという意味を、功績による救いと解釈せずに保った。μετάνοιαは文脈上、単なる心変わりではなく神への方向転換を含む「悔い改め」とした。
- source_word: μὴ ἄρξησθε λέγειν
  choice: 言い始めてはいけません
  rationale: 「言い始めるな」という原文の開始相と禁止の力をそのまま自然に示した。
- source_word: ἐν ἑαυτοῖς
  choice: 自分たちの間で
  rationale: 複数の再帰代名詞を踏まえ、集団内で互いに言う意味を本文に採った。ただし、内心で言う可能性もあるため脚注で曖昧さを保持した。
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: 私たちの父はアブラハムだ
  rationale: アブラハムを自分たちの父祖として頼みにする主張を、明快で自然な日本語にした。
- source_word: ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: これらの石からでも、アブラハムの子孫を起こす
  rationale: ἐγείρωの「起こす」を保ちつつ、τέκναはここでは血統・帰属が問題となるため「子孫」とした。「でも」により、石からさえ可能だという強調を自然に表した。
theological_decisions:
- issue: 「悔い改めにふさわしい実」の意味
  choice: 真の悔い改めに対応し、それを行動に表す実
  alternative: 「悔い改めにかなう実」または「悔い改めにふさわしい数々の実」
  rationale: この句は悔い改めと行動との一致を要求するが、その行動が赦しを獲得するとは述べていない。本文ではその緊張を説明で解消せず保持した。
- issue: アブラハムの子であることへの信頼
  choice: 肉体的な出自を神の裁きからの安全の根拠とする主張への否定
  alternative: 「子」を霊的子孫と明示的に限定する読み
  rationale: 原文は神がアブラハムに子らを起こせると述べるが、その子らの性質をここで明示的に定義してはいない。そのため「真の」「霊的な」などを本文に補わなかった。
- issue: τέκνα τῷ Ἀβραάμ の訳語
  choice: アブラハムの子孫
  alternative: アブラハムの子どもたち
  rationale: 文脈は父祖アブラハムとの系譜的・契約的帰属を論じるため「子孫」が自然である。ただし、単なる生物学的後裔に限定する神学的説明は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語。ヨハネの厳しい命令口調を保ちつつ、過度に古風な「汝ら」「実を結べ」などは避けた。「あなたがた」は複数への呼びかけを明示するため用いた。
