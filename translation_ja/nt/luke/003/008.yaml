  to: だから、悔い改めにふさわしい実を結びなさい[a]。『私たちの父はアブラハムだ』と、自分たちの間で言い始めてはいけません[b]。あなたがたに言いますが、神はこれらの石からでも、アブラハムの子どもたちを起こすことがおできになるのです。
