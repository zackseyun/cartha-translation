  text: Ἐγένετο δὲ ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν καὶ Ἰησοῦ βαπτισθέντος καὶ προσευχομένου ἀνεῳχθῆναι τὸν οὐρανὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: ja
  text: さて、民が皆洗礼を受け、イエスも洗礼を受けて祈っていたとき、天[a]が開かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「空」とも訳せる。ギリシア語は、目に見える空と天上の領域のどちらも指し得るが、ここでは啓示が起こる文脈に「天」がよく合う。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: さて、……が開いた
  rationale: ルカの物語を進める表現。δὲの推移を「さて」で示し、Ἐγένετοは日本語で不自然な「起こった」を重ねず、主節の出来事として表した。
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: 民が皆洗礼を受け
  rationale: ἐν＋冠詞付き不定詞の時間的用法を、自然な従属節で表した。ἅπαντα τὸν λαόνは「民が皆」とし、人々全体を指す意味を保った。
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: イエスも洗礼を受けて
  rationale: καίの付加の意味を「も」で示した。分詞は後続する祈りに先立つ出来事として、自然な連用形で表した。
- source_word: καὶ προσευχομένου
  choice: 祈っていたとき
  rationale: 天が開く時点で祈りが継続中だったことを「ていた」で示した。原文にない敬語的含意は加えていない。
- source_word: ἀνεῳχθῆναι
  choice: 開いた
  rationale: 受動形だが、日本語では「天が開いた」が自然であり、何者が開いたかを明示しない原文の含みも保てる。「裂けた」のような強い像は持ち込まない。
- source_word: τὸν οὐρανὸν
  choice: 天
  rationale: 直後の聖霊の降下と天からの声を伴う啓示的文脈には「天」が最も適する。ただし語自体は可視的な空も指し得るため、脚注で代案を示した。
theological_decisions:
- issue: 洗礼の場面における οὐρανός の指示対象
  choice: 天
  alternative: 空
  rationale: 聖霊の降下と神の声へ続く文脈では、神的領域を含意する「天」が適切である。一方、語彙上の「空」という可能性は排除せず脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、簡潔で格調を保った。イエスに対する敬語は原文に明示されないため加えず、出来事の順序と祈りの継続性を自然な日本語で示した。
