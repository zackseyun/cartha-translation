  source_fidelity: 「身体を伴う姿で」は、σωματικῷ εἴδει（身体的・可視的な形で）を「身体を伴う」という別の意味合いに寄せ、また「鳩のような」との結び付きも不自然である。本文は「鳩のような、目に見える姿で」として、可視的な現れと比較表現の双方を保つのが適切である。εὐδόκησαはアオリストであるため、本文の現在的表現を維持する場合も、脚注で過去形相当を明示することができる。
