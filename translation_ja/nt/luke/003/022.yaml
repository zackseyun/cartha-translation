id: LUK.3.22
reference: Luke 3:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: ja
  text: また、聖霊が鳩のような、目に見える姿でイエスの上に降り、天から声がした。「あなたはわたしの愛する子だ。わたしはあなたを喜んでいる。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「わたしはあなたを喜んだ」。または「わたしはあなたを喜びとした」。
    reason: εὐδόκησαはアオリスト形である。本文では宣言として自然な現在的表現を用い、脚注で形式上の過去形および別訳を示す。
lexical_decisions:
- source_word: καταβῆναι
  choice: 降り
  rationale: 下方への動きを保ちつつ、出来事の連続を自然な現代日本語で表す。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 定冠詞を伴う句に対応する、現代日本語で標準的かつ明確な訳語。
- source_word: σωματικῷ εἴδει
  choice: 身体を伴う姿で
  rationale: 目に見える具体的な現れを示す一方、聖霊が文字どおり肉体を得たと断定しすぎない表現。
- source_word: ὡς περιστερὰν
  choice: 鳩のような
  rationale: ὡςの比較を保ち、聖霊が文字どおり鳩になったとは断定しない。
- source_word: ἐπ’ αὐτόν
  choice: イエスの上に
  rationale: 代名詞の指示対象を日本語で明確にし、降下の到達点を自然に表す。
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: 天から声がした
  rationale: φωνήとγίνομαιによる出来事の表現を、簡潔で自然な日本語にする。
- source_word: Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός
  choice: あなたはわたしの愛する子
  rationale: 明示されたΣύの強調を「あなたは」で示し、ἀγαπητόςを重みのある自然な表現で訳す。
- source_word: ἐν σοὶ εὐδόκησα
  choice: わたしはあなたを喜ぶ
  rationale: ἐν σοὶの対象関係と、εὐδοκέωの喜び・満足の意味を自然な日本語で表す。アオリストの形式的な過去性は脚注に残す。
theological_decisions:
- issue: 聖霊の現れの性質
  choice: 聖霊が鳩に似た、目に見える身体的な姿で降ったと表現する。
  alternative: 聖霊が実際の鳩となって降った。
  rationale: σωματικῷ εἴδειは具体的で可視的な現れを示し、ὡς περιστερὰνは比較を示すため、両方を保ち、存在論的な断定を加えない。
- issue: εὐδόκησαの時制と意味
  choice: 本文では「わたしはあなたを喜ぶ」とし、現在にも通じる神の喜びを自然に表す。
  alternative: わたしはあなたを喜んだ／あなたを喜びとした。
  rationale: ギリシア語はアオリストだが、この宣言では喜び・満足の表明が中心である。形式に近い過去表現を脚注に示して時間的ニュアンスを保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御霊」「愛する者」など文語的・教派的に響きうる表現を避けた。「身体を伴う姿」はσωματικῷ εἴδειの具体性を保ちながら、過度な存在論的断定を避ける。
