  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: ja
  text: そしてヨハネはヨルダン川周辺一帯に行き、罪の赦しに至る悔い改めのバプテスマを宣べ伝えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: ヨルダン川周辺の全地域を巡り
  rationale: 直訳的な「全周辺地域へ来た」より自然な日本語としつつ、εἰςによる移動とπᾶσαν περίχωρονの地域全体に及ぶ意味を保った。主語は文脈上のヨハネを明示した。
- source_word: κηρύσσων
  choice: 宣べ伝えた
  rationale: 公に告げ知らせるκηρύσσωの力を保ち、現代日本語の聖書文体として明瞭にした。
- source_word: βάπτισμα
  choice: バプテスマ
  rationale: 水を用いる宗教的行為を指す語として定着した表現を採用し、一般的な洗浄と混同しないようにした。
- source_word: μετανοίας
  choice: 悔い改めの
  rationale: 属格を簡潔に保ち、バプテスマと悔い改めの関係を過度に説明しない。
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: 罪の赦しに至る
  rationale: εἰςの方向・帰結の含みを示しつつ、バプテスマが赦しの手段なのか、しるしなのかを訳文で確定しない。ἄφεσιςは文脈に即して「赦し」とした。
theological_decisions:
- issue: バプテスマ、悔い改め、罪の赦しの関係
  choice: 「罪の赦しに至る悔い改めのバプテスマ」
  alternative: 「罪の赦しのための悔い改めのバプテスマ」
  rationale: 原文のβάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶνが持つ密接な結び付きを保ちながら、その因果的・秘跡的・象徴的関係を訳文で断定しない。「に至る」はεἰςの方向性を比較的透明に表す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そして」はκαίを反映する。「ヨハネ」は直前文脈から補って主語を明確化した。句読点は日本語として整えた。
