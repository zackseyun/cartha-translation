  text: the son of Melchi[a], the son of Addi, the son of Cosam, the son of Elmadam, the son of Er
translation:
  language: ja
  text: メルキの子、アディの子、コサムの子、エルマダムの子、エルの子である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、各人名に属格の定冠詞（τοῦ）が繰り返されており、「子」に当たる語はここでは明示されていない。前後の系図の文脈に基づき、親子関係を明確にするため「の子」を補った。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ
  choice: の子
  rationale: 系図の直前の文脈から、各属格冠詞は親子関係を省略して示している。日本語では「の子」を補うことで、その関係を自然かつ明確に表せる。
- source_word: Μελχὶ
  choice: メルキ
  rationale: ギリシア語の人名を、現代日本語で読みやすい形に音写した。
- source_word: Ἀδδὶ
  choice: アディ
  rationale: 二重子音を日本語で不自然に強調せず、ギリシア語の人名を簡潔に音写した。
- source_word: Κωσὰμ
  choice: コサム
  rationale: ギリシア語の語頭Κを「コ」で表し、人名を日本語として明瞭に音写した。
- source_word: Ἐλμαδὰμ
  choice: エルマダム
  rationale: ギリシア語の人名の音形に沿い、現代日本語で読みやすく音写した。
- source_word: Ἢρ
  choice: エル
  rationale: ギリシア語Ἢρの語末のρを日本語の「ル」で表し、人名として音写した。
