  text: τοῦ Καϊνὰμ τοῦ Ἀρφαξὰδ τοῦ Σὴμ τοῦ Νῶε τοῦ Λάμεχ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/036.yaml
  text: the son of Cainan[a], the son of Arphaxad, the son of Shem, the son of Noah, the son of Lamech[c][b],
translation:
  language: ja
  text: カイナム[a][b]の子、アルファクサド[c]の子、セムの子、ノアの子、レメクの子、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「カイナン」と表記されることもある。
    reason: lexical_alternative
  - marker: b
    text: 一部の伝承では、旧約聖書の特定の系図形式により近づけるため、ここにある「カイナム」を省いている。
    reason: textual_variant
  - marker: c
    text: 「アルファクサド」は、ルカのギリシア語形を反映した表記。旧約聖書では、ヘブライ語形に基づいて「アルパクシャド」と表記されることが多い。
    reason: cross_reference
lexical_decisions:
- source_word: τοῦ
  choice: ～の子
  rationale: 系図の前後の構文によって親子関係を表す属格冠詞なので、日本語では省略された関係を補い、「～の子」と明示した。
- source_word: Καϊνὰμ
  choice: カイナム
  rationale: ギリシア語の固有名 Καϊνάμ を、日本語で読みやすい形に音写した。別表記について脚注を付した。
- source_word: Ἀρφαξὰδ
  choice: アルファクサド
  rationale: ルカ本文のギリシア語形を反映した音写。旧約聖書のヘブライ語形に基づく「アルパクシャド」との違いは脚注で示した。
- source_word: Σὴμ
  choice: セム
  rationale: 日本語聖書で広く定着している表記を採用した。
- source_word: Νῶε
  choice: ノア
  rationale: ギリシア語形の機械的な音写ではなく、同一人物について日本語聖書で定着している表記を採用した。
- source_word: Λάμεχ
  choice: レメク
  rationale: 同一人物の旧約聖書での名称として日本語で定着している表記を採用した。
theological_decisions:
- issue: アルファクサドとセムの間にカイナムを含めるか
  choice: SBLGNT本文に従い、カイナムを本文に残す。
  alternative: 旧約聖書の一部の系図形式との一致を図り、カイナムを省く伝承もある。
  rationale: 翻訳対象であるルカ3章36節のギリシア語本文には Καϊνάμ があるため、旧約の別形式に調和させず、そのまま訳した。
translation_notes:
  register: 現代標準日本語による簡潔で格調ある系図表現。各属格を「～の子」と補って関係を明確にし、固有名は日本語聖書で定着した形を尊重しつつ、ルカ固有のギリシア語形が重要な箇所では音写と脚注を用いた。
