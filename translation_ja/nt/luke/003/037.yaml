  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: ja
  text: メトシェラの子、エノクの子、ヤレドの子、マハラルエルの子、カイナン[a]の子、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「カイナム」。本文の「カイナン」はこの名の慣用的な日本語表記であり、「カイナム」とも表記される。旧約聖書の系図に合わせる場合は「ケナン」とされることもある。ルカのギリシア語本文にはこの名が含まれている。
    reason: 本文の「カイナン」、ギリシア語形に近い「カイナム」、および旧約系図との調和による「ケナン」の関係を明確にし、本文がΚαϊνάμを保持していることを示すため。
lexical_decisions:
- source_word: τοῦ
  choice: ～の子
  rationale: ルカの系図では、各人名に付く属格の定冠詞が、前節から続く親子関係を省略的に表している。日本語では「～の子」と補うことで、その関係を自然かつ明確に示す。
- source_word: Μαθουσαλά
  choice: メトシェラ
  rationale: 旧約聖書の同一人物として広く認識される標準的な日本語名を用いた。
- source_word: Ἑνώχ
  choice: エノク
  rationale: 旧約聖書の同一人物に対応する、一般的な日本語聖書名を用いた。
- source_word: Ἰάρετ
  choice: ヤレド
  rationale: 旧約聖書の同一人物に対応する、一般的な日本語聖書名を用いた。
- source_word: Μαλελεήλ
  choice: マハラルエル
  rationale: 旧約聖書の系図に現れる同一人物として認識しやすい、一般的な日本語名を用いた。
- source_word: Καϊνάμ
  choice: カイナン
  rationale: ギリシア語本文の固有名をそのまま反映し、旧約の系図に合わせて別名へ調和させなかった。
theological_decisions:
- issue: 系図における属格表現の省略
  choice: 各人名の後に「の子」を補う
  alternative: 「～の」とだけ訳して属格の連鎖を保つ
  rationale: 文脈上、属格は親子関係を表す省略表現である。「の子」を補うことは解釈を不当に限定するのではなく、日本語で系図の構造を明瞭にする。
- issue: Καϊνάμ の扱い
  choice: 本文に「カイナン」として含める
  alternative: 旧約の系図に合わせて「ケナン」とする、または省く
  rationale: SBLGNT本文には Καϊνάμ が明記されているため、その名を保持する。旧約系図との調和を目的とした変更は行わない。
translation_notes:
  register: 現代標準日本語による簡潔で品位ある系図表現とした。固有名は日本語聖書で認識されやすい形を優先し、節が次へ続くため末尾に読点を置いた。注記記号は対象語である「カイナン」の直後に配置した。
