  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: ja
  text: アミナダブ[a]の子、アドミンの子、アルニの子、ヘツロンの子、ペレツの子、ユダの子、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、この箇所を「アミナダブの子、アドミンの子、アラムの子」とする。また別の写本は「アドミンの子」を欠き、「アミナダブの子、アラムの子」とする。
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: の子
  rationale: ルカの系図では、各人名に付く属格冠詞が前から続く親子関係を省略して表している。日本語では「の」だけより「の子」とするほうが関係が明確で自然である。
- source_word: Ἀμιναδάβ
  choice: アミナダブ
  rationale: ギリシア語の人名を、旧約聖書で広く認識される形に合わせて表記した。
- source_word: Ἀδμίν
  choice: アドミン
  rationale: SBLGNT本文の固有名詞を音写した。
- source_word: Ἀρνί
  choice: アルニ
  rationale: SBLGNT本文の読みを直接反映した。異読の「アラム」は脚注に残した。
- source_word: Ἑσρώμ
  choice: ヘツロン
  rationale: ギリシア語形の音写よりも、旧約聖書の同一人物として認識しやすい慣用形を採用した。
- source_word: Φαρές
  choice: ペレツ
  rationale: 旧約聖書の同一人物とのつながりが明瞭になる慣用形を採用した。
- source_word: Ἰούδα
  choice: ユダ
  rationale: 旧約の部族祖の名として定着した日本語表記を用いた。
