translation_notes:
  register: 簡潔な系図の反復構造を保ちつつ、現代日本語で親子関係が明確になるよう「の子」を補った。人名は原文本文を尊重しながら、旧約由来の人物には一般的な日本語聖書の形を用いた。脚注記号は該当する本文単位の末尾に置いた。
