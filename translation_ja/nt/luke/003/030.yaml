lexical_decisions:
- source_word: τοῦ
  choice: 〜の子
  rationale: ルカの系図では、固有名詞に反復される属格冠詞が、前の節から続く親子関係を省略的に示している。日本語では「〜の」だけより「〜の子」とするほうが関係が明確で自然である。
- source_word: Συμεὼν
  choice: シメオン
  rationale: 聖書の人名として定着し、原語の形にも対応する標準的な日本語表記。
- source_word: Ἰούδα
  choice: ユダ
  rationale: ギリシア語本文の人名を、日本語聖書で一般的な表記に従って「ユダ」とした。英語の Judah/Judas の区別は日本語では通常どちらも「ユダ」となるため、注記を要しない。
- source_word: Ἰωσὴφ
  choice: ヨセフ
  rationale: 日本語聖書で定着している標準的な人名表記。
- source_word: Ἰωνὰμ
  choice: ヨナム
  rationale: SBLGNT本文のἸωνάμの語末ミューを反映した音写。
- source_word: Ἐλιακὶμ
  choice: エルヤキム
  rationale: このセム系人名の日本語聖書における慣用的で分かりやすい表記。
theological_decisions: []
