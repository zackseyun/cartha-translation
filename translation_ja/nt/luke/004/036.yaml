id: LUK.4.36
reference: Luke 4:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο θάμβος ἐπὶ πάντας, καὶ συνελάλουν πρὸς ἀλλήλους λέγοντες· Τίς ὁ λόγος οὗτος ὅτι ἐν ἐξουσίᾳ καὶ δυνάμει ἐπιτάσσει τοῖς ἀκαθάρτοις πνεύμασιν, καὶ ἐξέρχονται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/036.yaml
  text: And amazement came upon everyone[a], and they were speaking with one another, saying, “What is this word, that with authority and power he commands the unclean spirits, and they come out?”
translation:
  language: ja
  text: すると、一同は驚きに包まれ、互いに話し合っていた。「これはいったい、どんなことば[a]なのか。権威と力をもって汚れた霊たちに命じると、霊たちは出て行くではないか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ことば」は、「メッセージ」または「事柄」とも訳せる。
    reason: λόγοςには「ことば」「メッセージ」「事柄」などの意味があり、この箇所ではイエスの発した命令とその内容の双方が含意されうるため。
lexical_decisions:
- source_word: θάμβος
  choice: 驚き
  rationale: 強い驚愕を表す語。現代日本語として自然であり、文脈上の強さも保てる。
- source_word: ἐγένετο ... ἐπὶ πάντας
  choice: 皆は驚きに包まれ
  rationale: 驚きが一同に及んだというギリシア語の構図を、自然な日本語の慣用表現で示す。
- source_word: συνελάλουν πρὸς ἀλλήλους
  choice: 互いにこう語り合った
  rationale: 相互に言葉を交わしていたことを表し、単なる独白ではなく、その場の継続的なやり取りを伝える。
- source_word: Τίς ὁ λόγος οὗτος
  choice: これはいったい、どんなことばなのか
  rationale: λόγοςの広がりを「ことば」に残しつつ、τίςがここで表す驚きと性質への問いを「どんな」で自然に表現する。
- source_word: ἐν ἐξουσίᾳ καὶ δυνάμει
  choice: 権威と力をもって
  rationale: 正当な権威と実効的な力という二つの概念を区別し、原文の語順も保つ。
- source_word: ἐπιτάσσει
  choice: 命じる
  rationale: 命令を下すという現在形の生き生きした叙述を、簡潔な日本語で表す。
- source_word: τοῖς ἀκαθάρτοις πνεύμασιν
  choice: 汚れた霊たち
  rationale: 福音書における宗教的・物語的背景を保ち、心理的比喩へと還元しない直訳的で定着した表現。
- source_word: ἐξέρχονται
  choice: 霊たちは出て行く
  rationale: 人から霊が退出するという文脈を明瞭にし、日本語で主語が曖昧にならないよう「霊たちは」を補う。
theological_decisions:
- issue: 悪霊追放の文脈における存在の呼称
  choice: 汚れた霊たち
  alternative: 不浄な霊たち
  rationale: 原文のἀκάθαρτοςを保ち、福音書の超自然的な物語枠組みを弱めず、同時に過度な解釈も加えない。
- issue: ἐξουσίαとδύναμιςの関係
  choice: 権威と力
  alternative: 権能
  rationale: 二語を一語にまとめず、命じる正当な権威と、それを実現する力との緊張と並置を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、引用部の驚きと畏敬を保った。「ではないか」によって、ὅτι以下が問いの理由・内容を示すことを自然に表した。
