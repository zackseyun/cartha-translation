  text: καὶ ἐπιστὰς ἐπάνω αὐτῆς ἐπετίμησεν τῷ πυρετῷ, καὶ ἀφῆκεν αὐτήν· παραχρῆμα δὲ ἀναστᾶσα διηκόνει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/039.yaml
  text: And standing over her[a], he rebuked the fever, and it left her. Immediately she got up and began serving them.
translation:
  language: ja
  text: イエスは彼女の枕元に立って、熱を叱りつけられた。すると、熱は彼女から去った。[a] 彼女はすぐに起き上がり、人々に仕え始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、熱そのものが叱られる対象であり、続いて彼女から去るものとして描かれている。
    reason: 原文の擬人的な表現と、「熱」が去るものとなる文法上のつながりを明示するため。
lexical_decisions:
- source_word: ἐπιστὰς ἐπάνω αὐτῆς
  choice: 彼女の傍らに立ち、その上から
  rationale: イエスが横たわる女性のすぐそばに立ち、上から臨む具体的な位置関係を、現代日本語として不自然にならない形で表した。
- source_word: ἐπετίμησεν τῷ πυρετῷ
  choice: 熱を叱りつけられた
  rationale: 熱そのものを強く叱るという原文の表現と、イエスの権威ある行為を保った。文脈にない悪霊的原因は付け加えていない。
- source_word: ἀφῆκεν αὐτήν
  choice: 熱は彼女から去った
  rationale: 直前の「熱」を暗黙の主語とする原文の構造を明示し、擬人的な描写を保った。
- source_word: παραχρῆμα
  choice: すぐに
  rationale: いやしが即時であったことを、明快で自然な現代日本語で示した。
- source_word: ἀναστᾶσα
  choice: 起き上がり
  rationale: 横たわっていた女性が回復して身を起こす動作を自然に表した。
- source_word: διηκόνει αὐτοῖς
  choice: 一同に仕え始めた
  rationale: 未完了過去の開始的・継続的な含みを「仕え始めた」で表し、居合わせた複数の人々を「一同」とした。
theological_decisions:
- issue: 熱を叱るという表現が悪霊的原因を意味するか
  choice: 原文どおり、イエスが「熱を叱りつけた」と訳す
  alternative: 「病を治された」など、擬人的表現を弱める
  rationale: 原文は熱そのものを叱責の対象としているが、その原因を悪霊だとは明言していない。そこで、イエスの権威を示す表現を保持しつつ、病因についての解釈は加えなかった。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「彼女の上に立ち」という不自然で誤解を招きやすい直訳を避けつつ、イエスが女性の上から臨む位置関係を保持した。敬意を表すため、イエスの動作には尊敬表現を用いた。
