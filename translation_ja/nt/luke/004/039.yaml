  to: イエスは彼女の枕元に立って、熱を叱りつけられた。すると、熱は彼女から去った。[a] 彼女はすぐに起き上がり、人々に仕え始めた。
  rationale: 位置関係を不明瞭にする「その上から」を、病床の場面で自然な「彼女の枕元に立って」に改めた。これは「彼女の上方に立つ」という原文の具体的場面を、日本語で不自然な物理的含意（彼女の身体の上に立つこと）を生じさせずに伝えるためである。「熱を叱りつけられた」「熱は彼女から去った」は、病因についての解釈を加えずに原文の表現を保持する。
