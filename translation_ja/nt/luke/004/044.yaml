  text: καὶ ἦν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ τῆς ⸀Ἰουδαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/044.yaml
  text: And he was preaching in the synagogues of Judea[a].
translation:
  language: ja
  text: そしてイエスは、ユダヤの諸会堂で宣べ伝えておられた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本では「ユダヤ」ではなく「ガリラヤ」となっている。本文は、ここで用いたギリシア語本文の「ユダヤ」に従った。
    reason: textual_variant
lexical_decisions:
- source_word: ἦν κηρύσσων
  choice: 宣べ伝えておられた
  rationale: εἰμίの未完了過去と現在分詞による迂言的未完了過去で、過去における継続的・反復的な活動を表す。「宣べ伝えておられた」はその相を自然な日本語で示す。
- source_word: κηρύσσων
  choice: 宣べ伝えて
  rationale: κηρύσσωは公に告げ知らせることを意味する。会堂での活動という文脈に合い、「説教する」よりも宣言という原語の意味を保つ。
- source_word: εἰς τὰς συναγωγάς
  choice: 諸会堂で
  rationale: εἰςは通常方向を表すが、ここでは宣教活動が行われた場所・範囲を示す用法と理解し、自然な日本語の場所表現「で」とした。複数形は「諸会堂」で表した。
- source_word: συναγωγάς
  choice: 会堂
  rationale: この文脈ではユダヤ人の集会所・礼拝の場であるシナゴーグを指す。聖書日本語として通用し、簡潔な「会堂」を用いた。
- source_word: Ἰουδαίας
  choice: ユダヤ
  rationale: SBLGNT本文のἸουδαίαςをそのまま地名「ユダヤ」と訳し、周辺のガリラヤ文脈に合わせて改変しない。
theological_decisions:
- issue: 周辺のガリラヤ文脈と地理名 τῆς Ἰουδαίας の関係
  choice: ユダヤ
  alternative: ガリラヤ、またはユダヤ人の地全般を指す広義の「ユダヤ」
  rationale: 採用されたギリシア語本文を優先して「ユダヤ」を保持する。文脈上の緊張を翻訳で調和させず、写本異読は脚注で明示する。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「イエス」はギリシア語本文では代名詞的に省略されている主語を文脈から補い、敬体的な尊敬表現「おられた」を用いた。
