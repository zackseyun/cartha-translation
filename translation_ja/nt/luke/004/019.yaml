  text: to proclaim the favorable year of the Lord[a][b].
translation:
  language: ja
  text: 主の恵みの年を告げ知らせるためである。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主に受け入れられる年を告げ知らせるためである」。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「主に受け入れられる年」とも訳される。この表現はイザヤ書61章2節を踏まえており、ヨベルの年を連想させる可能性がある。
    reason: cross_reference
lexical_decisions:
- source_word: κηρύξαι
  choice: 告げ知らせる
  rationale: 公に宣言するというκηρύσσωの布告的な響きを保ちつつ、現代日本語として自然に表した。不定詞は前節から続く目的を示すため、「ためである」とした。
- source_word: ἐνιαυτὸν
  choice: 年
  rationale: 通常の語義である「年」を保持し、明示されていない「ヨベルの年」や一般化した「時」とはしなかった。
- source_word: κυρίου
  choice: 主の
  rationale: κύριοςを「主」とし、属格を自然な日本語で表した。イザヤ書への言及を踏まえても、本文で「主なる神」などと限定しすぎない。
- source_word: δεκτόν
  choice: 恵みの
  rationale: ここでは主に受け入れられ、好意を示されるという意味を持つ。日本語の聖書的文脈で自然な「恵みの」は神の好意を伝えるが、直訳的な「受け入れられる」より意味が明瞭である。
theological_decisions:
- issue: イザヤ61章2節への言及とヨベルの年との関連
  choice: 本文では「年」を残し、「ヨベルの年」と明記しない。
  alternative: 主の恵みの時を告げ知らせる／主のヨベルの年を告げ知らせる
  rationale: ギリシア語はイザヤ61章2節を響かせ、ヨベルの年を連想させうるが、「ヨベル」という語自体はない。暗示を保ち、解釈を本文に付加しない。
- issue: κύριοςの訳語
  choice: 主
  alternative: 主なる神／主人
  rationale: イザヤ書引用の伝統に適合しつつ、本文だけで指示対象や神名表記を過度に特定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「告げ知らせる」で公的な宣言の意味を保ち、「恵みの年」は日本語として自然な聖書的表現とした。前後の目的構文との連続を示すため文末を「ためである」とした。
