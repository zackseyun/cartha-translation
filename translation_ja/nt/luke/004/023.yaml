source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Πάντως ἐρεῖτέ μοι τὴν παραβολὴν ταύτην· Ἰατρέ, θεράπευσον σεαυτόν· ὅσα ἠκούσαμεν γενόμενα ⸂εἰς τὴν Καφαρναοὺμ⸃ ποίησον καὶ ὧδε ἐν τῇ πατρίδι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/023.yaml
  text: And he said to them[a], “Surely you will say to me this proverb, ‘Physician, heal yourself.’ Whatever we have heard was done in Capernaum, do here also in your hometown.”
translation:
  language: ja
  text: そして、イエスは彼らに言われた。「あなたがたはきっと、わたしにこのことわざを言うだろう。『医者よ、自分を治せ。』カファルナウムで[a]なされたと私たちが聞いたことはすべて、ここ、あなたの故郷でも行え。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「カファルナウムで」は、直訳に近くは「カファルナウムへ／その中へ」。ギリシア語は通常「…へ／…の中へ」を表す前置詞を用いているが、ここでは出来事が起こった場所を示すと理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντως
  choice: きっと
  rationale: 話し手が相手の今後の発言を確信をもって予期する強調を、自然な現代日本語で表す。
- source_word: ἐρεῖτέ μοι
  choice: わたしに…言うだろう
  rationale: 未来直説法の予告的な力を保ち、命令や単なる可能性にはしない。
- source_word: παραβολὴν
  choice: ことわざ
  rationale: ここでは物語形式の「たとえ」ではなく、「医者よ、自分自身を治せ」という短い格言を指す。
- source_word: Ἰατρέ
  choice: 医者よ
  rationale: 医療を行う者への呼びかけを、格言らしい簡潔さと品位を保って訳す。
- source_word: θεράπευσον σεαυτόν
  choice: 自分自身を治せ
  rationale: アオリスト命令法の直接的な命令を保ち、σεαυτόνの再帰性も明示する。
- source_word: ὅσα ἠκούσαμεν γενόμενα
  choice: 行われたと私たちが聞いていること
  rationale: 人々の知識が伝聞に基づくことを示しつつ、文脈上、カファルナウムでなされた働きを求める含意を自然に表す。γενόμενα自体はより広く「起こった」とも訳せる。
- source_word: εἰς τὴν Καφαρναοὺμ
  choice: カファルナウムで
  rationale: εἰςは通常「へ・に」だが、出来事が生じた場所を表すこの構文では、文脈に即して場所を示す「で」とする。異例の前置詞用法は脚注で示す。
- source_word: ποίησον καὶ ὧδε
  choice: ここ…でも行え
  rationale: ποίησονを特定の奇跡用語に狭めず「行え」とし、καίの追加の意味を「でも」で表す。
- source_word: ἐν τῇ πατρίδι σου
  choice: あなたの故郷
  rationale: ナザレの文脈で、出身地・郷里を指す自然で明瞭な表現とする。
theological_decisions:
- issue: この文脈におけるπαραβολήの性質
  choice: 「ことわざ」と訳す
  alternative: 「たとえ」「格言」
  rationale: 続く言葉は物語形式のたとえではなく、簡潔な慣用的格言であるため。ただし語そのものには「たとえ」という広い意味域がある。
- issue: γενόμεναが示す出来事の主体性
  choice: 「行われた」と訳す
  alternative: 「起こった」
  rationale: 文脈ではイエスがカファルナウムでなした働きを故郷でも行うよう求める発言なので、「行われた」が自然である。一方、ギリシア語は出来事の発生を広く述べるため、特定の種類の業や奇跡に限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの予告と引用されたことわざの格調を保った。「イエス」は直前の文脈で明らかな主語を補ったもの。「あなたがた」と引用内の「私たち」は、聞き手が自分たちの言葉として述べる構造が分かるよう区別した。脚注記号は該当するカファルナウムの表現を含む文の末尾に置いた。
