  to: そして、イエスは彼らに言われた。「あなたがたはきっと、わたしにこのことわざを言うだろう。『医者よ、自分を治せ。』カファルナウムで[a]なされたと私たちが聞いたことはすべて、ここ、あなたの故郷でも行え。」
