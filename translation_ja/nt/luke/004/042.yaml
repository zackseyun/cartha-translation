source:
  edition: SBLGNT
  text: Γενομένης δὲ ἡμέρας ἐξελθὼν ἐπορεύθη εἰς ἔρημον τόπον· καὶ οἱ ὄχλοι ἐπεζήτουν αὐτόν, καὶ ἦλθον ἕως αὐτοῦ, καὶ κατεῖχον αὐτὸν τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/042.yaml
  text: And when day came[a], he went out and went to a deserted place. And the crowds were seeking him[b], and they came to him and were trying to keep him from going away from them.
translation:
  language: ja
  text: 夜が明けると、イエスは外に出て、人里離れた場所[a]へ向かった。群衆はイエスを捜し求め、彼のところまで来て、イエスが自分たちから去らないよう、引き止めようとしていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寂しい場所」「荒れ野」とも訳せる。ギリシア語は、人が住んでいない、あるいは人里から離れた場所を表す。
    reason: lexical_alternative
  - marker: b
    text: 「引き止めていた」「行かせまいとしていた」とも訳せる。群衆がイエスの出発を妨げようとしていたという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γενομένης δὲ ἡμέρας
  choice: 夜が明けると
  rationale: 属格絶対による時間の移行を、自然な現代日本語で表した。単に「朝になると」とするより、夜から昼への推移を明確に伝える。
- source_word: ἐξελθὼν ἐπορεύθη
  choice: 外に出て、…へ向かわれた
  rationale: 先行するアオリスト分詞と主動詞の連続を保ちつつ、日本語で不自然な「出て、行った」という重複を避けた。文脈上の主語イエスには、本文全体の品位を保つ穏当な尊敬表現を用いた。
- source_word: εἰς ἔρημον τόπον
  choice: 人里離れた場所
  rationale: ἔρημος はここで必ずしも砂漠を指さず、人のいない孤立した場所を表す。「荒野」と限定せず、地理的な曖昧さを保った。
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: 複数形だが、日本語では集合的な「群衆」が自然であり、多数の人々を正確に表す。
- source_word: ἐπεζήτουν αὐτόν
  choice: イエスを捜し求め
  rationale: 未完了過去の継続的な捜索を表し、単なる願望としての「求める」に狭めない。「イエス」は日本語で指示対象を明確にするため補った。
- source_word: ἦλθον ἕως αὐτοῦ
  choice: 彼のところまで来ると
  rationale: ἕως の到達点を示す働きを「ところまで」で明示した。日本語の文脈上、後続動作とのつながりを「来ると」で自然に表した。
- source_word: κατεῖχον αὐτὸν
  choice: 引き止めようとした
  rationale: κατέχω の制止・抑留の意味を文脈に即して表し、必ずしも物理的に拘束したとは断定しない。未完了過去による継続的な試みも伝える。
- source_word: τοῦ μὴ πορεύεσθαι ἀπ’ αὐτῶν
  choice: 自分たちから離れて行かないよう
  rationale: 否定を伴う冠詞付き不定詞が示す、出発を妨げる意図・内容を明確にした。「彼らを見捨てる」などの含意は加えていない。
theological_decisions:
- issue: イエスへの敬語の程度
  choice: 「向かわれた」を用い、後半の代名詞・動詞では過度な敬語を避けた
  alternative: 全編を常体の「向かった」とする、またはすべてを尊敬語で統一する
  rationale: 原文に敬語体系はないため神学的身分を文法に過剰に持ち込まず、日本語聖書としての自然な品位と読みやすさを両立させた。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。原文の動作の連続と未完了過去の継続性を保ちながら、逐語的な重複は避けた。脚注記号は、それぞれが説明する語句・節の直後に置いた。
