  text: and[a], ‘On their hands they will carry you[b], lest you strike your foot against a stone.’
translation:
  language: ja
  text: また、「彼らはその手であなたを支え上げる[a]。あなたの足が石に打ち当たる[b]ことのないように。」とも書いてある。
  philosophy: optimal-equivalence
