    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτι
  choice: また、…とも書いてある
  rationale: 前節の「書いてある」に続いて、もう一つの引用内容を加える表現。日本語では文脈上のつながりを明示して自然にした。
- source_word: Ἐπὶ χειρῶν
  choice: その手で
  rationale: 複数の者の手によって支えられるという保護の比喩を、自然な現代日本語で表した。
- source_word: ἀροῦσίν σε
  choice: あなたを支え上げる
  rationale: αἴρωの「持ち上げる、担う」という意味を保ち、単なる移動としての「運ぶ」ではなく、落下や衝突から守る文脈を反映した。
- source_word: μήποτε
  choice: ことのないように
  rationale: 危害を防ぐ否定的な目的・結果を、自然な日本語で表した。
- source_word: προσκόψῃς πρὸς λίθον τὸν πόδα σου
  choice: あなたの足が石に打ち当たる
  rationale: 足が石にぶつかるという具体的な像を保ち、原文の単数形「足」も維持した。
theological_decisions:
- issue: 詩編引用における守護の比喩
  choice: 「その手であなたを支え上げる」
  alternative: 「その手にあなたを載せて運ぶ」
  rationale: 天使による保護という像を保ちながら、αἴρωの持ち上げて支える意味を明瞭にした。特定の教派的解釈は加えていない。
- issue: μήποτε節の統語的な係り方
  choice: 独立した引用文として「ことのないように」と訳す
  alternative: 「石に打ち当たらないよう、あなたを支え上げる」と一文に統合する
  rationale: 原文の詩的な句の並びと目的的ニュアンスを保ち、因果関係を過度に説明しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く聖書引用であることが単独の節でも分かるよう、「とも書いてある」を補った。
