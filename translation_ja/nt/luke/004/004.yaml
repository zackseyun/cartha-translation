id: LUK.4.4
reference: Luke 4:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθη ⸂πρὸς αὐτὸν ὁ Ἰησοῦς⸃· Γέγραπται ὅτι Οὐκ ἐπ’ ἄρτῳ μόνῳ ζήσεται ⸀ὁ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/004.yaml
  text: 'And Jesus answered him[b][a], “It is written: ‘Man will not live by bread alone.’”'
translation:
  language: ja
  text: イエスは彼に答えられた。「こう書かれている。『人はパンだけで生きるのではない。』」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: イエスは申命記8章3節を引用している。
    reason: cross_reference
  - marker: b
    text: 「人間はパンだけで生きるのではない」とも訳せる。ここでの「人」は人類一般を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη πρὸς αὐτὸν ὁ Ἰησοῦς
  choice: イエスは彼に答えられた
  rationale: ἀποκρίνομαι＋πρόςの応答の意味を、現代日本語として自然に表した。「答えて言われた」のような原語にない発話動詞の重複は避けた。
- source_word: Γέγραπται
  choice: こう書かれている
  rationale: 聖書引用の定型句である完了受動形を、書かれた言葉が今も有効である含みを保つ自然な日本語にした。
- source_word: ὅτι
  choice: 引用符で表現
  rationale: ここでは後続の引用内容を導入するため、日本語では接続語を逐語的に置かず、句点と引用符で明示した。
- source_word: ἐπ’ ἄρτῳ μόνῳ
  choice: パンだけで
  rationale: ἐπίはここで生命を支える基盤・手段を示す。「パンだけによって」より簡潔で自然であり、パンのみを生命の支えとする意味を保つ。
- source_word: ζήσεται
  choice: 生きるのではない
  rationale: 未来形を含む引用文を、日本語の一般的・原則的な言明として自然に表した。否定の焦点が「パンだけで」にあることも明瞭である。
- source_word: ὁ ἄνθρωπος
  choice: 人
  rationale: 単数形が人間一般を代表する用法であるため、現代日本語で同じ総称的意味を持つ「人」とした。性別を限定せず、抽象的な集合名詞にも変えていない。
theological_decisions:
- issue: 申命記8章3節の引用におけるὁ ἄνθρωποςの総称的意味
  choice: 人
  alternative: 人間
  rationale: 原文は単数形で人一般を指す。日本語の「人」は代表的単数と普遍的適用の双方を自然に保ち、男性だけを指すとの誤解も生じにくい。
- issue: 申命記8章3節との引用関係
  choice: 本文は現存するルカ本文の引用範囲のみ訳し、出典を脚注で示す
  alternative: 申命記本文の後半まで補う
  rationale: SBLGNTのルカ4章4節には「神の口から出るすべてのことばによって」の部分がないため補わず、引用元だけを注記した。
translation_notes:
  register: 明快で現代的ながら、聖書引用としての品位を保つ文体。「こう書かれている」は引用定型句として自然であり、入れ子のかぎ括弧でイエスの発言中の聖書引用を区別した。脚注記号は本文中にすべて明示した。
