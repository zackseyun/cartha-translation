  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ⸀ἀπ’ αὐτοῦ. καὶ ῥίψαν αὐτὸν τὸ δαιμόνιον εἰς ⸀τὸ μέσον ἐξῆλθεν ἀπ’ αὐτοῦ μηδὲν βλάψαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/035.yaml
  text: And Jesus rebuked it[a], saying, “Be silent and come out of him.” And after throwing him into the midst[b], the demon came out of him without harming him at all.
translation:
  language: ja
  text: そこでイエスは悪霊を叱って言われた。「黙れ[a]。この人から出て行け。」すると悪霊はその人を真ん中に投げつけ、それから少しも害を加えずに出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「口輪をはめられよ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν αὐτῷ
  choice: 悪霊を叱りつけて
  rationale: ἐπιτιμάωの権威ある厳しい叱責を自然な現代日本語で表した。目的語は文脈上の悪霊であり、日本語では指示代名詞より明示した方が明瞭である。
- source_word: Φιμώθητι
  choice: 黙れ
  rationale: 原義には「口輪をはめられよ」という比喩があるが、発話を禁じる鋭い命令として簡潔かつ自然に訳した。
- source_word: ἔξελθε ἀπ’ αὐτοῦ
  choice: この人から出て行け
  rationale: 悪霊に対する直接の命令を保ち、αὐτοῦの指示対象が取りつかれた人であることを日本語で明瞭にした。
- source_word: ῥίψαν αὐτὸν
  choice: その人を…投げ倒してから
  rationale: アオリスト分詞が主動詞に先立つ動作を示すことを「してから」で表した。ῥίπτωの激しい動作は「投げ倒す」が文脈上自然である。
- source_word: εἰς τὸ μέσον
  choice: 人々の真ん中に
  rationale: 直訳は「真ん中へ」。周囲にいた人々の中へという場面を、日本語として自然になる最小限の補足で示した。
- source_word: τὸ δαιμόνιον
  choice: 悪霊
  rationale: δαιμόνιονを現代日本語の聖書文体で明瞭な「悪霊」とした。抽象的な力や病状へと読み替えず、物語の直接呼びかけと退出の描写を保つ。
- source_word: μηδὲν βλάψαν αὐτόν
  choice: 何の傷も負わせずに
  rationale: μηδένの全面否定と、激しい動作にもかかわらず本人に害がなかったという対照を自然に表した。「害を加えずに」も可能である。
theological_decisions:
- issue: δαιμόνιονの描写
  choice: イエスに命じられて人から出て行く悪霊として訳す
  alternative: 「邪悪な力」や「精神的な病」と抽象化する
  rationale: 本文は悪霊への直接命令と、その悪霊が人から出る出来事を語っているため、その叙述を解消せずに保持した。
- issue: 男性代名詞αὐτόςの指示対象
  choice: 取りつかれていた人を「この人」「その人」と表す
  alternative: 「彼」と訳す
  rationale: 日本語では「彼」を重ねるとイエス、悪霊、当人の区別が曖昧になるため、指示対象を自然に明示した。
translation_notes:
  register: 明快で格調を失わない現代標準日本語。イエスの命令は短く鋭い形にし、叙述では代名詞の指示対象を必要な範囲で明示した。脚注標識[a]は、該当する文末に置いた。
