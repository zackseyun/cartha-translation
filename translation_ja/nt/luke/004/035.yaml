revisions:
- from: そこでイエスは悪霊を叱りつけて言われた。「黙れ。この人から出て行け。」すると悪霊は、その人を人々の真ん中に投げ倒してから、何の傷も負わせずに出て行った。[a]
  to: そこでイエスは悪霊を叱って言われた。「黙れ[a]。この人から出て行け。」すると悪霊はその人を真ん中に投げつけ、それから少しも害を加えずに出て行った。
  rationale: 原文の動作（投げる）、方向（真ん中へ）、および無害性（少しも害を加えずに）を過不足なく反映するように改めた。「悪霊」「黙れ」「この人から出て行け」は、叙述の直接性と命令の強さを保っている。脚注はΦιμώθητιにアンカーし、原義の「口輪」の比喩を示した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:15Z'
review_pass:
  verdict: revise
  source_fidelity: 「投げ倒して」は、ῥίψαν（投げる）に「倒す」という結果を加えており、εἰς τὸ μέσον（真ん中へ）にも「人々の」を補っている。文脈上あり得る情景ではあるが、この節の語句により近い表現へ改めるのが安全である。また、βλάψανは身体的な傷に限定されないため、「害を加えずに」が適切である。
  naturalness: 命令の「黙れ。この人から出て行け」は明快で自然である。「悪霊はその人を真ん中に投げつけ、それから…」は、出来事の順序を保ちつつ現代標準日本語として自然である。
  terminology: δαιμόνιονを一貫して「悪霊」とすることは適切である。Φιμώθητιの比喩的な原義は、「黙れ」の直後に脚注を置いて示すのが、英語POBの監査記録および原語の語感を最もよく反映する。
  issues:
  - severity: medium
    issue: ῥίψαν αὐτὸν εἰς τὸ μέσονの訳に「投げ倒して」「人々の」を加えている。
    rationale: ῥίπτωは「投げる」であり、「倒す」は本文に明示されない。また「人々」は直前の文脈から推測できても、この節のギリシア語にはない。「真ん中に投げつけ」とすれば、動作と方向を保ちつつ不要な補足を避けられる。
  - severity: medium
    issue: μηδὲν βλάψαν αὐτόνを「何の傷も負わせずに」としている。
    rationale: βλάπτωは傷害に限らない「害を加える」を表すため、「傷」では意味がやや狭まる。
  - severity: low
    issue: 脚注がΦιμώθητιの「口輪をはめる」という原義ではなく、末尾句の別訳だけを示している。
    rationale: 英語POBの脚注aに対応する語彙上の含意を、「黙れ」に直接結び付けて示すと、原語の比喩を保持できる。末尾句は本文を「少しも害を加えずに」とすれば十分明瞭であり、別訳脚注は必須ではない。
  revised_text: そこでイエスは悪霊を叱って言われた。「黙れ[a]。この人から出て行け。」すると悪霊はその人を真ん中に投げつけ、それから少しも害を加えずに出て行った。
  revised_footnotes:
