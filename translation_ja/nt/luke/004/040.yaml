  text: Δύνοντος δὲ τοῦ ἡλίου ⸀ἅπαντες ὅσοι εἶχον ἀσθενοῦντας νόσοις ποικίλαις ἤγαγον αὐτοὺς πρὸς αὐτόν· ὁ δὲ ἑνὶ ἑκάστῳ αὐτῶν τὰς χεῖρας ⸂ἐπιτιθεὶς ἐθεράπευεν⸃ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/040.yaml
  text: When the sun was setting[a], all who had people sick with various diseases brought them to him; and he laid his hands on each one of them and healed them.
translation:
  language: ja
  text: 日が沈みかけたころ[a]、さまざまな病気にかかっている人のいる人々は皆、その人たちをイエスのもとに連れて来た。イエスはその一人一人に手を置き、彼らを癒やされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「日が沈みつつあったとき」。ギリシア語では現在分詞を伴う属格独立構文が用いられ、これらの出来事が起こった時を示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δύνοντος δὲ τοῦ ἡλίου
  choice: 日が沈みかけたころ
  rationale: 属格独立構文と現在分詞が示す同時的な時を自然な日本語で表した。「日没時」では動作の進行性が弱まるため、「沈みかけたころ」とした。δέはここでは軽い接続であり、文脈上、日本語に明示しなくても流れが保たれる。
- source_word: ἅπαντες ὅσοι
  choice: 者は皆
  rationale: 該当する者を漏れなく含む強い包括性を、「皆」によって簡潔に表した。
- source_word: εἶχον ἀσθενοῦντας νόσοις ποικίλαις
  choice: さまざまな病気にかかっている人がいる
  rationale: 病人を家族や同居人に限定せず、身近に病人を有していたという関係を保った。「抱えている」は負担という含みを帯びうるため避けた。
- source_word: ἤγαγον αὐτοὺς πρὸς αὐτόν
  choice: その人たちをイエスのもとに連れて来た
  rationale: ἄγωをこの場面に自然な「連れて来た」とし、代名詞の指示対象を文脈に従って「イエス」と明示した。
- source_word: ἑνὶ ἑκάστῳ αὐτῶν
  choice: その一人一人に
  rationale: 重ねられた配分表現が強調する、各人への個別の働きかけを保持した。
- source_word: τὰς χεῖρας ἐπιτιθεὶς
  choice: 手を置き
  rationale: 身体的で具体的な行為を、後代の儀礼的意味を付加せず、日本語の定着した表現で訳した。
- source_word: ἐθεράπευεν
  choice: 癒やされた
  rationale: 病を治す行為を福音書の文脈に合う「癒やす」で表した。未完了過去の反復性は、直前の「一人一人に」によって自然に伝わる。
theological_decisions:
- issue: 一人一人に手を置く行為の表現
  choice: イエスはその一人一人に手を置き
  alternative: イエスは彼ら一人一人に手を置いておられた
  rationale: 本文が述べるイエスの個別的かつ具体的な癒やしの行為を保持しつつ、秘跡や教会制度に関する後代の意味を読み込まないようにした。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、福音書本文にふさわしい落ち着いた文体とした。「癒やされた」は主語への敬意を示す自然な叙述であり、特定教派の用語は用いていない。
