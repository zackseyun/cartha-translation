  terminology: 「悪魔」「イエス」「エルサレム」「神の子」は標準的で一貫している。「神殿境内」はἱερόνとναόςの区別を適切に反映する。「神の子」は称号性を損なわず、条件文の神学的・修辞的緊張を教義的に解消していない。
