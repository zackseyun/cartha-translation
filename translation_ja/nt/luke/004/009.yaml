id: LUK.4.9
reference: Luke 4:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂Ἤγαγεν δὲ⸃ αὐτὸν εἰς Ἰερουσαλὴμ καὶ ⸀ἔστησεν ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦ, καὶ εἶπεν αὐτῷ· Εἰ υἱὸς εἶ τοῦ θεοῦ, βάλε σεαυτὸν ἐντεῦθεν κάτω·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/009.yaml
  text: Then he led him to Jerusalem and set him on the pinnacle of the temple[a], and said to him, “If you are the Son of God[c][b], throw yourself down from here;”
translation:
  language: ja
  text: それから悪魔はイエスをエルサレムに連れて行き、神殿境内[a]の突端[b]に立たせて言った。「もしあなたが神の子[c]なら、ここから身を投げ下ろしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿境内」と訳したギリシア語は、内陣だけでなく、中庭などを含む神殿域全体を指す。
    reason: cultural_note
  - marker: b
    text: 直訳では「神殿の翼」。神殿域にある建造物の張り出した端、または高い地点を指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: 「あなたは神の子なのだから」とも理解できる。ギリシア語の条件文にはその含みもあり得るが、本文では誘惑者の挑戦を保つため「もし」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: ⸂Ἤγαγεν δὲ⸃
  choice: それから……連れて行き
  rationale: δέによる物語の進行を「それから」で示し、ἄγωの能動的な移動を自然な現代日本語の「連れて行き」で表した。主語と目的語は文脈上の指示対象を明確にするため「悪魔」「イエス」とした。
- source_word: Ἰερουσαλήμ
  choice: エルサレム
  rationale: 現代日本語で定着した地名表記。
- source_word: ἔστησεν
  choice: 立たせて
  rationale: ἵστημιの使役的な他動詞用法を保ち、悪魔がイエスをその場所に立たせたことを表す。
- source_word: ἐπὶ τὸ πτερύγιον
  choice: 突端に
  rationale: πτερύγιονは字義的には「小さな翼」だが、ここでは建造物の張り出した端または高所を指す。「頂」だけに限定せず、建築上の端という含みを保つため「突端」とした。
- source_word: τοῦ ἱεροῦ
  choice: 神殿境内の
  rationale: ἱερόνは内陣そのもの（ναός）ではなく、建物や中庭を含む神殿域を指すため、「神殿境内」とした。
- source_word: Εἰ υἱὸς εἶ τοῦ θεοῦ
  choice: もしあなたが神の子なら
  rationale: εἰ＋直説法は文脈により「既にそうなのだから」に近い含みも持ち得るが、誘惑者の挑戦という緊張を明示的に解消しないよう「もし」とした。υἱὸς τοῦ θεοῦは称号的な「神の子」と訳した。
- source_word: βάλε σεαυτὸν
  choice: 身を投げ下ろしなさい
  rationale: βάλλωの命令と再帰代名詞を、明瞭で自然かつ場面にふさわしい表現で示す。
- source_word: ἐντεῦθεν κάτω
  choice: ここから……下ろし
  rationale: 現在地点を示すἐντεῦθενと下方への運動を示すκάτωを、日本語の複合動詞「投げ下ろす」に自然に組み込んだ。
theological_decisions:
- issue: 悪魔によるイエスの身分への挑戦
  choice: もしあなたが神の子なら
  alternative: あなたは神の子なのだから
  rationale: ギリシア語の条件文が既知の事実を前提とする読みも排除しないことを脚注で示しつつ、本文では誘惑の挑発的な響きと物語上の緊張を保った。語り手がイエスの身分を疑っているとの意味には限定しない。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「投げ下ろしなさい」は命令の強さを保ちつつ古語調を避けた。「神殿境内」はἱερόνの広い指示範囲を本文で明確にする選択である。
