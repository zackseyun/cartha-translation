  source_fidelity: ギリシア語本文に忠実である。Ἤγαγεν δὲを「それから悪魔は…連れて行き」、ἔστησενを「立たせて」と適切に表し、ἐπὶ τὸ πτερύγιον τοῦ ἱεροῦも「神殿境内の突端」として、πτερύγιονの建築的な端・高所という不確定さとἱερόνの神殿域という広い指示範囲を保っている。条件文は「もし」とし、挑戦的用法を自然に維持している。βάλε σεαυτὸν ἐντεῦθεν κάτωも「ここから身を投げ下ろしなさい」で過不足なく訳出されている。
