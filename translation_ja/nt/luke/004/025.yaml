id: LUK.4.25
reference: Luke 4:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν, πολλαὶ χῆραι ἦσαν ἐν ταῖς ἡμέραις Ἠλίου ἐν τῷ Ἰσραήλ, ὅτε ἐκλείσθη ὁ οὐρανὸς ⸀ἐπὶ ἔτη τρία καὶ μῆνας ἕξ, ὡς ἐγένετο λιμὸς μέγας ἐπὶ πᾶσαν τὴν γῆν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/025.yaml
  text: But I tell you truly, there were many widows in Israel in the days of Elijah, when the sky was shut up for three years and six months, as a great famine came over all the land.
translation:
  language: ja
  text: しかし、まことにあなたがたに言います。エリヤの時代、天が三年六か月の間閉ざされ、全土に大飢饉が起こったとき、イスラエルには多くのやもめがいました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπ’ ἀληθείας δὲ λέγω ὑμῖν
  choice: しかし、まことにあなたがたに言います
  rationale: δὲの対照を「しかし」で示し、ἐπ’ ἀληθείαςはイエスの発言の真実性を強調する「まことに」とした。語順は自然な現代日本語に整えた。
- source_word: χῆραι
  choice: やもめ
  rationale: 夫を亡くした女性を指す語。聖書本文として品位を保ちつつ一般にも理解できる伝統的な語を採用した。
- source_word: ἐκλείσθη ὁ οὐρανὸς
  choice: 天が…閉ざされ
  rationale: 雨が降らなかったことを指す比喩を説明に置き換えず、原文の表現を保持した。受動態も維持した。
- source_word: ἐπὶ ἔτη τρία καὶ μῆνας ἕξ
  choice: 三年六か月の間
  rationale: 期間を表すἐπίを自然な日本語で明示した。
- source_word: ἐπὶ πᾶσαν τὴν γῆν
  choice: 全土に
  rationale: γῆは文脈上「地、土地、国土」の幅がある。「全地」より自然で、必ずしも全世界と断定しない「全土」を選んだ。
theological_decisions:
- issue: 飢饉の及んだ範囲（πᾶσαν τὴν γῆν）
  choice: 全土
  alternative: 全地／地上全体
  rationale: γῆの地理的範囲には語義上の幅があるため、宇宙的・世界的範囲を読み込まず、物語の地域的文脈にも適合する表現とした。
- issue: 天が閉ざされた主体
  choice: 受動表現のまま保持
  alternative: 神が天を閉ざされた
  rationale: 原文は神を明示しない神的受動とも理解できるが、翻訳では主体を補わず、原文の含みを保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの厳粛な宣言にふさわしい品位を保った。「まことに」はやや格調があるが、意味が明瞭で発言の強調をよく伝える。
