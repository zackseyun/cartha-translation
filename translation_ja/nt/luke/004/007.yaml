id: LUK.4.7
reference: Luke 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σὺ οὖν ἐὰν προσκυνήσῃς ἐνώπιον ἐμοῦ, ἔσται σοῦ πᾶσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/007.yaml
  text: Therefore[a], if you worship before me, it will all be yours.
translation:
  language: ja
  text: だから、もしあなたが私の前にひれ伏すなら[a]、すべてはあなたのものになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私を礼拝するなら」。ギリシア語の動詞は、ひれ伏して敬意を表すことにも、礼拝することにも用いられる。ここでは悪魔に宗教的な崇敬をささげることが求められている。
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺ
  choice: あなたが
  rationale: 明示された二人称単数代名詞を主語として訳し、条件を突きつける強調を自然な日本語の範囲で保った。
- source_word: οὖν
  choice: だから
  rationale: 直前の申し出を受けた帰結を示す。現代日本語として明瞭で自然な接続表現を選んだ。
- source_word: ἐὰν
  choice: もし…なら
  rationale: 接続法を伴う条件節を、標準的な日本語の条件表現で訳した。
- source_word: προσκυνήσῃς
  choice: ひれ伏す
  rationale: 語が表す身体的な伏拝と礼拝的敬意の双方を保持できる。文脈上は悪魔への宗教的崇敬を求める行為だが、「礼拝する」と限定せず、原語の語義幅を脚注で示した。
- source_word: ἐνώπιον ἐμοῦ
  choice: 私の前に
  rationale: 空間的・関係的意味を簡潔に保ち、伏拝の相手が話者であることを明示する。
- source_word: ἔσται σοῦ πᾶσα
  choice: すべてはあなたのものになる
  rationale: 女性単数のπᾶσαは前節の支配権や栄華を含む内容全体を受ける省略表現であり、名詞を補いすぎず総体性と所有の約束を自然に表した。
theological_decisions:
- issue: προσκυνέωを身体動作として訳すか、宗教的礼拝として訳すか
  choice: 本文では「ひれ伏す」とし、脚注で「礼拝する」の可能性を示す
  alternative: 私を礼拝する
  rationale: 原語は伏して敬意を表す行為にも礼拝にも用いられる。次節によって宗教的崇敬が問題であることは明らかだが、本文では語の具体的な動作性と神学的緊張をともに残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、誘惑者の直接的で尊大な条件提示を簡潔に表した。前後の引用符を考慮し、節末に閉じ引用符を置いた。
