id: LUK.4.5
reference: Luke 4:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἀναγαγὼν ⸀αὐτὸν ἔδειξεν αὐτῷ πάσας τὰς βασιλείας τῆς οἰκουμένης ἐν στιγμῇ χρόνου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/005.yaml
  text: And after leading him up[b][a], he showed him all the kingdoms of the inhabited world in a moment of time.
translation:
  language: ja
  text: そして悪魔はイエスを上へ連れて行き、ほんの一瞬のうちに、人の住む世界のすべての国々を見せた。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「世界の」とも訳せる。ギリシア語はしばしば「人の住む世界」を意味し、文脈によっては文明世界または帝国領を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: 「たちまち」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναγαγὼν αὐτὸν
  choice: イエスを高い所へ連れて行き
  rationale: ἀνάγωの上方への動きを自然な日本語で表した。「山」とは特定せず、ルカ本文にない情報を補わない。分詞は後続動作との自然な連続として訳した。
- source_word: ἔδειξεν αὐτῷ
  choice: 見せた
  rationale: δείκνυμιの標準的な叙述用法を簡潔に表す。
- source_word: πάσας τὰς βασιλείας
  choice: すべての国々
  rationale: ここでのβασιλείαは抽象的な王権より、複数の国・領域を指す。「王国」より現代日本語として自然な「国々」を選んだ。
- source_word: τῆς οἰκουμένης
  choice: 人の住む世界の
  rationale: οἰκουμένηの「人が居住する世界」という語義を保ち、単に「世界」と平板化せず、同時に「ローマ帝国」と狭く限定しない。
- source_word: ἐν στιγμῇ χρόνου
  choice: ほんの一瞬のうちに
  rationale: στιγμήが示す時間上の一点・極端な短さを、明瞭で自然な現代日本語で表した。
theological_decisions:
- issue: 悪魔が諸国を見せた方法
  choice: どのような仕方で見せたかを特定せず、本文どおり叙述する
  alternative: 幻によって見せた、または文字どおり高所から見せたと明示する
  rationale: ギリシア語本文は見せたという事実のみを述べ、その仕組みが幻視的、超自然的、地理的なもののいずれかを説明していないため、曖昧さを保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「高い所」は上方への移動を示すが、「山」とは特定しない。脚注記号は対応箇所である節末に置いた。
