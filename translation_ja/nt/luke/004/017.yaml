  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπεδόθη αὐτῷ βιβλίον ⸂τοῦ προφήτου Ἠσαΐου⸃ καὶ ⸀ἀναπτύξας τὸ βιβλίον εὗρεν τὸν τόπον οὗ ἦν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/017.yaml
  text: 'And the scroll of the prophet Isaiah was handed to him[a], and after unrolling the scroll, he found the place where it was written:'
translation:
  language: ja
  text: 預言者イザヤの巻物[a]がイエスに手渡された。イエスは巻物を広げ、次のように書かれている箇所を見つけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「書物」とも訳せる。ギリシア語の βιβλίον は一般に文書を指し得るが、この会堂の場面では巻物を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεδόθη
  choice: 手渡された
  rationale: 受動態の「与えられた、手渡された」を、会堂で朗読用の巻物を渡す場面に即して自然に表した。
- source_word: βιβλίον
  choice: 巻物
  rationale: 語自体は広く文書や書物を指し得るが、第一世紀の会堂という文脈では巻物を指す可能性が高く、歴史的な形態を明確に表せる。
- source_word: τοῦ προφήτου Ἠσαΐου
  choice: 預言者イザヤの
  rationale: 属格構文を簡潔かつ自然に訳し、イザヤの預言者としての称号も保持した。
- source_word: ἀναπτύξας
  choice: 広げ
  rationale: 巻物を開いて広げる動作を自然な日本語で表し、主動詞に先立つ行為として順序を保持した。
- source_word: εὗρεν
  choice: 見つけた
  rationale: εὑρίσκωの基本的な意味を過度な含意なく表した。
- source_word: τόπον
  choice: 箇所
  rationale: 文字どおりには「場所」だが、文書内の位置を指す日本語として「箇所」が明瞭で自然である。
- source_word: οὗ ἦν γεγραμμένον
  choice: 次のように書かれている
  rationale: 後続の引用を導く節として自然に表し、完了の結果状態である「書かれたものがそこにある」という意味合いを「書かれている」で保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「彼」ではなく「イエス」を用いて日本語で指示対象を明確にした。後続する聖書引用への導入として、文末はコロンに頼らず自然な日本語の句点とした。
