  text: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς ὅτι Σήμερον πεπλήρωται ἡ γραφὴ αὕτη ἐν τοῖς ὠσὶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/021.yaml
  text: Then he began to say to them[a], “Today this Scripture has been fulfilled in your hearing.”
translation:
  language: ja
  text: そこでイエスは彼らに語り始めた。「今日、この聖書の言葉は、あなたがたが聞いているところで[a]成就した。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたがたの耳において」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξατο δὲ λέγειν πρὸς αὐτοὺς
  choice: そこでイエスは彼らに語り始めた
  rationale: δὲは強い対比ではなく、朗読後の物語の展開を示すため「そこで」とした。日本語では主語を明示すると場面が自然につながるので、文脈上の主語「イエス」を補った。ἤρξατο＋λέγεινは開始を表す「語り始めた」とした。
- source_word: Σήμερον
  choice: 今日
  rationale: 文頭の強調と、成就の切迫した現在性をそのまま保つ。
- source_word: πεπλήρωται
  choice: 実現した
  rationale: 完了受動形が示す、成就がすでに起こり、その結果が現在に及んでいることを、自然な現代日本語で表す。「成就した」も可能だが、一般読者への明瞭さを優先した。
- source_word: ἡ γραφὴ αὕτη
  choice: この聖書の言葉
  rationale: 直前に朗読されたイザヤ書の箇所を指す。単に「この聖書」では書物全体とも取れうるため、γραφήの聖なる文書・聖句という意味を自然に示した。
- source_word: ἐν τοῖς ὠσὶν ὑμῶν
  choice: あなたがたが聞いている中で
  rationale: 字義は「あなたがたの耳の中で」だが、ここでは彼らが今その宣言を聞く場で実現したという意味の慣用表現である。「聞くところで」より現代語として明瞭で、出来事の同時性も保つ。
theological_decisions:
- issue: 聖書の言葉の実現の主体と仕方
  choice: 「この聖書の言葉は…実現した」とだけ訳し、実現の主体や方法を説明しない。
  alternative: 「この預言は、わたしによって今実現した」と説明的に訳す。
  rationale: 文脈はイエスによる実現を強く示すが、ギリシア語本文には「預言」「わたしによって」に相当する明示的な語がない。本文の神学的な力と余韻を保ち、解釈を訳文へ付加しない。
- issue: ἐν τοῖς ὠσὶν ὑμῶνと実現の関係
  choice: 「あなたがたが聞いている中で」とし、聞く行為そのものが実現を引き起こしたとは断定しない。
  alternative: 「あなたがたが聞いたことによって実現した」と因果的に訳す。
  rationale: ἐνはここで状況・場を示しうるが、因果関係までは明示しないため、原文の幅を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「成就」は教会語として定着しているが、一般読者にも直ちに伝わる「実現」を採用した。引用文の簡潔さと「今日」の強調を保持した。
