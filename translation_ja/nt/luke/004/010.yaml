  text: 'For it is written: ‘He will command his angels concerning you[c][b][a], to guard you,’'
translation:
  language: ja
  text: こう書かれているからです。『神は、あなたについて、その天使たちに、あなたを守るよう命じる。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: こう書かれている
  rationale: 聖書に記された内容が今も効力を持つことを、現代日本語で自然に示す。
- source_word: γὰρ
  choice: からです
  rationale: 直前の発言を聖書引用によって根拠づける説明的なつながりを表す。
- source_word: ὅτι
  choice: 引用符による導入
  rationale: 日本語では「と」を重ねず、引用符で内容節を自然に導入する。
- source_word: Τοῖς ἀγγέλοις αὐτοῦ
  choice: ご自分の御使いたちに
  rationale: 与格を命令の相手として表し、αὐτοῦの再帰的な所有関係を自然な敬意ある日本語にする。
- source_word: ἐντελεῖται
  choice: 命じる
  rationale: 未来形の予告を日本語の引用文に自然な非過去形で表し、指示・命令を与える意味を保つ。
- source_word: περὶ σοῦ
  choice: あなたについて
  rationale: περί＋属格の「〜について、〜に関して」という意味を直接保ち、「あなたのために」として受益の意味に限定しない。
- source_word: τοῦ διαφυλάξαι σε
  choice: あなたを守るように
  rationale: 目的を表す冠詞付き不定詞を、「命じる」の内容・目的として自然に表し、διαφυλάσσωの保護する意味を簡潔に伝える。
theological_decisions:
- issue: 詩編引用における暗黙の主語
  choice: 「神は」と明示する
  alternative: 「その方は」または主語を省略する
  rationale: ギリシア語では動詞の主語が省略されているが、αὐτοῦ（ご自分の）と引用元の文脈から神を指す。日本語で主語を完全に省くと所有関係が不自然になるため、解釈を拡張せず指示対象を明示した。
- issue: 詩編91編11節の引用範囲
  choice: ルカが記す語句だけを訳す
  alternative: 詩編本文の省略部分も補って訳す
  rationale: 引用元の詩編にある続きや追加句を補わず、ルカ本文に実際に記された引用範囲を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書引用としての品位を保った。「御使い」は宗教文脈で通用する語として採用した。後半を「あなたを守るように、と」と独立させ、τοῦ διαφυλάξαι σεが命令の目的を説明する構造を見えやすくした。
