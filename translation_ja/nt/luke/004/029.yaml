review_pass:
  verdict: revise
  source_fidelity: 「突き落とそうとした」は文脈上理解可能ですが、ὥστε＋不定詞が表す目的を、本文に明示されない未遂のアスペクトとして「～ようとした」と言い換えています。また「崖際」はὀφρύς（山の縁・端）から一段具体化した地形描写です。
  naturalness: 現行訳は全体として明快で自然です。ただし「自分たちの町が建っている山」は、ᾠκοδόμητο の過去完了受動の含みを弱めます。「山の縁」はやや字義的ですが、この箇所では原文の地形表現を過度に具体化せずに保てます。
  terminology: 「追い出し」「連れて行って」は、それぞれἐξέβαλον、ἤγαγονに適切です。「突き落とす」はκατακρημνίσαιの暴力的な落下行為を自然に表します。固有名「イエス」の補足も日本語として適切です。
  issues:
  - severity: medium
    issue: ὥστε＋不定詞を「突き落とそうとした」と訳している
    rationale: 原文は彼らがイエスを連行した目的・意図を表しており、ここで行為が実行に移されたかどうかを「～ようとした」として明示する必要はありません。「突き落とすために」がより直接的です。
  - severity: low
    issue: ὀφρύςを「崖際」と具体化している
    rationale: ὀφρύςは山・高所の「縁、端、張り出し」を指し得ますが、「崖」を語そのものが明示するわけではありません。「山の縁」として地形上の具体化を抑えるのが安全です。
  - severity: low
    issue: ᾠκοδόμητοの過去完了受動の含みが「建っている」で失われている
    rationale: 日本語では直訳的な過去完了は不自然になり得ますが、「建てられていた」とすることで、町がその山の上に建設されていたという原文の叙述をより保てます。
  revised_text: そして人々は立ち上がり、イエスを町の外へ追い出し、自分たちの町が建てられていた山の縁まで連れて行き、突き落とすためにそうした。
