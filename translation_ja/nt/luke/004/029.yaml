revisions:
- from: そして人々は立ち上がり、イエスを町の外へ追い出し、自分たちの町が建っている山の崖際まで連れて行って、そこから突き落とそうとした。
  to: そして人々は立ち上がり、イエスを町の外へ追い出し、自分たちの町が建てられていた山の縁まで連れて行き、突き落とすためにそうした。
  rationale: 目的を表すὥστε＋不定詞を「突き落とすために」と訳し、未遂を本文に付加しないようにした。「崖際」を「山の縁」としてὀφρύςの地形的な幅を保ち、ᾠκοδόμητοは「建てられていた」で過去完了受動の意味を反映した。なお、末尾は日本語の語順を自然にするため「連れて行き、突き落とすためにそうした」とした。
