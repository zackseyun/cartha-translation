  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀναστάντες ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως, καὶ ἤγαγον αὐτὸν ἕως ὀφρύος τοῦ ὄρους ἐφ’ οὗ ἡ πόλις ⸂ᾠκοδόμητο αὐτῶν, ὥστε⸃ κατακρημνίσαι αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/029.yaml
  text: And rising up[a], they drove him out of the town and led him to the brow of the hill on which their town had been built[b], so as to throw him down.
translation:
  language: ja
  text: そして人々は立ち上がり、イエスを町の外へ追い出し、自分たちの町が建てられていた山の縁まで連れて行き、突き落とすためにそうした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: 立ち上がり
  rationale: アオリスト分詞が示す、人々が行動を起こしたことを自然に表す。単に「立って」より物語上の動きを保てる。
- source_word: ἐξέβαλον αὐτὸν ἔξω τῆς πόλεως
  choice: イエスを町の外へ追い出し
  rationale: ἐκβάλλω の強制的な排除を「追い出す」で表し、代名詞の指示対象は日本語で明確にするため「イエス」とした。πόλις は文脈上「町」が自然である。
- source_word: ἤγαγον αὐτὸν
  choice: 連れて行って
  rationale: ἄγω の広い意味に忠実で、文脈にない「引きずる」ほどの暴力性は加えない。
- source_word: ἕως ὀφρύος τοῦ ὄρους
  choice: 山の崖際まで
  rationale: ὀφρύς は文字どおりには「眉」で、高所の張り出した縁を指す。「崖際」は現代日本語で地形と切迫した状況を明瞭に伝える。
- source_word: ἐφ’ οὗ ἡ πόλις ᾠκοδόμητο αὐτῶν
  choice: 自分たちの町が建っている山
  rationale: 属格的な αὐτῶν を「自分たちの町」とし、過去完了受動は日本語で不自然な「建てられていた」を避け、現にそこにある町を「建っている」と自然に表現した。
- source_word: ὥστε κατακρημνίσαι αὐτόν
  choice: そこから突き落とそうとした
  rationale: ὥστε＋不定詞がこの文脈で示す意図を「〜ようとした」で表す。κατακρημνίζω の高所から投げ落とす意味は「突き落とす」で簡潔に伝え、「そこから」は日本語上の参照点を明確にする。
theological_decisions:
- issue: 群衆の暴力と殺意をどの程度明示するか
  choice: 「追い出し」「突き落とそうとした」と訳し、殺害の意図が一連の行動から明らかになるようにした。
  alternative: 「引きずり出して殺そうとした」など、意図を説明的に明示する。
  rationale: 本文は致命的な暴力を企てたことを示すが、「殺す」という語自体はないため、原文の行為描写を保って読者にその意味を伝える。
- issue: ὥστε＋不定詞の目的・結果の含み
  choice: 文脈に即して企図を表す「突き落とそうとした」とした。
  alternative: より形式的に「突き落とすためであった」または結果的表現の「突き落とすことになるほど」とする。
  rationale: 群衆が崖際まで連れて行く動作と不定詞の内容から、ここでは未遂の意図として読むのが最も自然である。ただし「殺そうとした」まで説明を加えない。
translation_notes:
  register: 明快な現代標準日本語を用い、叙事の緊迫感を保ちながら過度に口語的または説明的にならないようにした。「崖際」「突き落とす」により地形と行為を自然に示す。
