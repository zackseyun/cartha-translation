id: LUK.4.20
reference: Luke 4:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πτύξας τὸ βιβλίον ἀποδοὺς τῷ ὑπηρέτῃ ἐκάθισεν· καὶ πάντων ⸂οἱ ὀφθαλμοὶ ἐν τῇ συναγωγῇ⸃ ἦσαν ἀτενίζοντες αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/020.yaml
  text: And after rolling up the scroll and giving it back to the attendant[a], he sat down[b]. And the eyes of everyone in the synagogue were fixed on him.
translation:
  language: ja
  text: イエスは巻物[a]を巻き、係の者[b]に返してから、腰を下ろした。会堂にいたすべての人の目が、彼に注がれていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「書物」とも訳せる。ここでは会堂で朗読に用いられた形状に即して「巻物」とした。
    reason: lexical_alternative
  - marker: b
    text: 会堂で巻物の取り扱いなどを担った係の者。
    reason: cultural_note
lexical_decisions:
- source_word: πτύξας
  choice: 巻き
  rationale: 巻物を物理的に巻く動作を表す。写本冊子を「閉じる」と受け取られかねない表現を避け、当時の形状に即して訳した。
- source_word: βιβλίον
  choice: 巻物
  rationale: 語自体は広く書物を指し得るが、一世紀の会堂で朗読されたイザヤ書は巻物であり、文脈上の具体的な形状を明示した。
- source_word: ἀποδοὺς
  choice: 返してから
  rationale: 使用後に本来の管理者へ返すという動詞の意味と、座る前の動作の順序を自然な日本語で表した。
- source_word: ὑπηρέτῃ
  choice: 係の者
  rationale: この文脈では巻物などを取り扱う会堂の奉仕者を指す。「しもべ」や「役人」よりも役割を誤解なく伝える。
- source_word: ἐκάθισεν
  choice: 腰を下ろした
  rationale: 座る動作を自然な現代日本語で表す。教える姿勢であった可能性を本文で説明的に断定しない。
- source_word: πάντων οἱ ὀφθαλμοὶ
  choice: すべての人の目が
  rationale: ギリシア語の鮮明な身体表現を保ちつつ、日本語として自然な所有関係にした。
- source_word: ἀτενίζοντες
  choice: 注がれていた
  rationale: 一同が持続的に注意深く見つめていたことを表し、敵意や無礼さを余分に含ませない。
- source_word: συναγωγῇ
  choice: 会堂
  rationale: この場面ではユダヤ人の礼拝・集会の場所を指す。日本語聖書で定着し、文脈にも適した表現である。
theological_decisions:
- issue: 会堂で用いられた βιβλίον の歴史的形状
  choice: 「巻物」と訳す
  alternative: 「書物」「本」
  rationale: 教理上の判断ではなく、原語が許容する範囲内で歴史的・文脈的に具体的な形状を示す選択である。
- issue: ἐκάθισεν が示す座る行為の含意
  choice: 本文では「腰を下ろした」とだけ訳す
  alternative: 「教えるために座った」
  rationale: 当時、座ることが教える姿勢と結び付く場合はあるが、この節自体は目的を明示していないため、含意を本文に付加しない。
translation_notes:
  register: 明瞭で自然な現代標準語を用い、物語の厳粛さを保った。「腰を下ろした」「目が注がれていた」により、動作と場面の緊張感を過度な説明なしに表現した。
