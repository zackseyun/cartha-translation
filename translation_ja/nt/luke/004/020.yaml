  source_fidelity: 本文は、πτύξας を「巻き」、ἀποδοὺς を「返してから」、ἐκάθισεν を「腰を下ろした」と順序を保って自然に訳している。「巻物」はこの会堂朗読の文脈で βιβλίον を適切に具体化しており、「会堂にいたすべての人の目」が彼に「注がれていた」は πάντων οἱ ὀφθαλμοὶ…ἀτενίζοντες αὐτῷ の全体性と持続的な注視をよく表す。
  naturalness: 明瞭な現代標準語であり、叙述の流れも自然である。「係の者」「腰を下ろした」「目が、彼に注がれていた」は文脈にふさわしい平明さと落ち着いた文体を保っている。
  terminology: 「会堂」は新約のユダヤ教的集会・礼拝の場を指す定着した適切な語である。「巻物」とその注記は歴史的文脈を正確に示し、「係の者」も ὑπηρέτης を不必要に身分的・制度的に限定していない。
