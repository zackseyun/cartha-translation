id: LUK.4.41
reference: Luke 4:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξήρχετο δὲ καὶ δαιμόνια ἀπὸ πολλῶν ⸀κραυγάζοντα καὶ λέγοντα ὅτι Σὺ ⸀εἶ ὁ υἱὸς τοῦ θεοῦ. καὶ ἐπιτιμῶν οὐκ εἴα αὐτὰ λαλεῖν, ὅτι ᾔδεισαν τὸν χριστὸν αὐτὸν εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/041.yaml
  text: Demons also were coming out of many[a], crying out and saying, “You are the Son of God!” But rebuking them, he would not allow them to speak, because they knew that he was the Messiah.
translation:
  language: ja
  text: また、多くの人から悪霊が出て来て、「あなたは神の子です」と叫んでいた。しかし、イエスは悪霊を叱って、語ることを許さなかった。彼らが、イエスこそメシア[a]であると知っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語 Χριστός（クリストス）は、「油を注がれた者」を意味する称号。
    reason: 称号 Χριστός の主要な別訳と語義を示すため。
lexical_decisions:
- source_word: δαιμόνια
  choice: 悪霊ども
  rationale: 「悪霊」を直接表す語であり、別のギリシア語表現である「汚れた霊」とは区別した。「ども」により複数であることを自然に示した。
- source_word: ἐξήρχετο
  choice: 出て来て
  rationale: 未完了過去が表す継続的・反復的な出来事を、後続の「叫んでいた」と結び付けて自然な日本語で表した。
- source_word: ἀπὸ πολλῶν
  choice: 多くの人から
  rationale: 原文では「多くの」の対象が省略されているが、文脈上は人を指すため、日本語として明瞭になる最小限の補足をした。
- source_word: κραυγάζοντα καὶ λέγοντα
  choice: 「……」と叫んでいた
  rationale: 二つの分詞が示す発声とその内容を、日本語では重複を避けつつ、激しい声で繰り返し叫ぶ様子として表した。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: 称号としての定着した表現を保ち、そのキリスト論的な重みを弱めないようにした。
- source_word: ἐπιτιμῶν
  choice: 叱りつけ
  rationale: 単なる注意ではなく、権威をもって厳しく制止する語感を表した。
- source_word: οὐκ εἴα
  choice: 許さなかった
  rationale: 未完了過去が示し得る反復的な制止は文脈全体で伝わるため、簡潔で自然な表現とした。
- source_word: λαλεῖν
  choice: ものを言うこと
  rationale: 発言を許さなかったという意味を自然に示しつつ、何を語ることかを原文以上に限定しなかった。
- source_word: ᾔδεισαν
  choice: 知っていた
  rationale: οἶδα の状態的な意味と過去の継続を自然な日本語で表した。
- source_word: τὸν χριστὸν
  choice: メシア
  rationale: ここでは固有名のような用法ではなく、「油を注がれた者」という称号として用いられているため、「メシア」とした。別訳は脚注に示した。
- source_word: αὐτὸν εἶναι
  choice: イエスこそ……である
  rationale: 日本語では指示対象を明示し、「彼こそがメシアである」という対格不定詞構文の述語関係を自然に表した。
theological_decisions:
- issue: 悪霊による Χριστός の告白をどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: Χριστός はここで称号として機能しているため意味の伝わる「メシア」を本文に置き、「キリスト」を脚注で保持した。
- issue: 「神の子」と「メシア」の関係
  choice: 二つの称号を区別して保持する
  alternative: 一つの説明的表現にまとめる
  rationale: 悪霊の発言は「神の子」、語り手の説明は「メシア」としており、原文が示す関連性と区別の双方を、そのまま残した。
- issue: 悪霊に語ることを許さなかった理由
  choice: 彼らがイエスをメシアだと知っていたため、とだけ述べる
  alternative: イエスが悪霊からの証言を拒んだ意図まで説明する
  rationale: 本文は理由として悪霊の認識を述べるだけであり、その背後の神学的意図を訳文に付加しなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、物語としての力強さと聖書本文にふさわしい品位を保った。「悪霊ども」は複数性を明確にするが、会話的になりすぎない範囲の表現である。原文で省略された人間の対象と主語イエスは、日本語の明瞭さのため必要最小限に補った。
