  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ὅτι ἐν ἐξουσίᾳ ἦν ὁ λόγος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/032.yaml
  text: And they were astonished at his teaching[a], because his word had authority.
translation:
  language: ja
  text: 人々はイエスの教えに大いに驚いた。イエスの言葉には権威があった[a]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスの言葉は権威を帯びていた」または「イエスは権威をもって語った」。
    reason: λόγος（言葉）とἐν ἐξουσίᾳ（権威をもって／権威あるものとして）の結びつきは、発言そのものが権威をもつこととしても、権威をもった語り方としても表現できる。
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: 驚嘆した
  rationale: 未完了形が示す、その場の人々の強い驚きの反応を、明瞭で品位ある現代日本語で表した。
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: その教えに
  rationale: ἐπί＋与格が示す驚きの対象・根拠を簡潔に表し、διδαχήの内容と教える行為の双方を含み得る「教え」を用いた。
- source_word: ἐν ἐξουσίᾳ
  choice: 権威があった
  rationale: 発言に備わる権威ある性質を自然な日本語で示す。単に威厳のある話し方だったという意味に狭めない。
- source_word: ὁ λόγος αὐτοῦ
  choice: イエスの語ること
  rationale: 文脈上の指示対象を明確にしつつ、λόγοςがここで指す発言・語られた言葉を自然に表す。「教え」と同語反復にせず、発話そのものへの焦点を保った。
- source_word: ὅτι
  choice: からである
  rationale: 人々が驚嘆した理由を導く因果関係を明示した。
theological_decisions:
- issue: イエスの言葉にある権威の性質
  choice: 「イエスの語ることには権威があった」と記述する
  alternative: 「イエスは神の権威によって語った」など、権威の由来を明示する
  rationale: 本文はイエスの発言が権威を帯びていたことを述べるが、その権威の由来についてこの節では説明していないため、神学的説明を補わない。
translation_notes:
  register: 明瞭な現代標準語を用い、物語文として品位ある「である」調にした。「その教え」と「イエスの語ること」を使い分け、原文のδιδαχήとλόγοςの区別を可能な限り保った。
