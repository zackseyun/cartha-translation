  naturalness: 「大勢」はやや口語的で、原文の単純な「多く」を超えて強調する響きもあり得る。「多くいた」が明瞭な現代標準語として適切である。また、例外を「ナアマンのほかには一人もいなかった」と表すと、自然で誤読の余地がない。
  terminology: 「重い皮膚病」と注記は、λεπροίを現代のハンセン病へ限定しない点で適切である。「清められた」はκαθαρίζωの身体的・儀礼的背景を保つ。「シリア人ナアマン」もὁ Σύροςを適切に反映する。
