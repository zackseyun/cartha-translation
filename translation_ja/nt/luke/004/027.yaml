  text: καὶ πολλοὶ λεπροὶ ἦσαν ⸂ἐν τῷ Ἰσραὴλ ἐπὶ Ἐλισαίου τοῦ προφήτου⸃, καὶ οὐδεὶς αὐτῶν ἐκαθαρίσθη, εἰ μὴ Ναιμὰν ὁ Σύρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/027.yaml
  text: And there were many lepers in Israel in the time of Elisha the prophet, and none of them was cleansed except Naaman the Syrian.
translation:
  language: ja
  text: また、預言者エリシャの時代には、イスラエルに重い皮膚病[a]の人が多くいたが、そのうち清められた者は、シリア人ナアマンのほかには一人もいなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「重い皮膚病」—原語は、現代医学でいうハンセン病に限らず、さまざまな皮膚疾患を指し得る。伝統的には「らい病」と訳されてきた。
    reason: λεπροίの指示範囲を現代の特定の病名に限定せず、伝統的訳語との関係も示すため。
lexical_decisions:
- source_word: λεπροὶ
  choice: 重い皮膚病の人
  rationale: この語は聖書時代に「汚れ」とされた各種の皮膚疾患を指し得て、現代医学でいうハンセン病だけに限定できない。人を病名で呼ぶ表現を避けつつ、文脈上の疾患を明確にした。
- source_word: ἐν τῷ Ἰσραὴλ
  choice: イスラエルには
  rationale: 場所またはその共同体の範囲を表す句。日本語では存在文に合わせて「イスラエルには」とするのが自然で、土地か民かを不必要に限定しない。
- source_word: ἐπὶ Ἐλισαίου τοῦ προφήτου
  choice: 預言者エリシャの時代
  rationale: ἐπί＋属格の時間的用法を、明瞭で自然な現代日本語にした。「預言者」という同格的説明も保持した。
- source_word: ἐκαθαρίσθη
  choice: 清められた
  rationale: 単なる治癒だけでなく、皮膚疾患に伴う儀礼的な汚れからの清めという聖書的含意を保つ受動表現。
- source_word: εἰ μὴ
  choice: だけであった
  rationale: οὐδεὶςとの組み合わせで例外を示す。「一人もなく……だけであった」として、日本語で対比を自然かつ明確に表した。
- source_word: Ναιμὰν ὁ Σύρος
  choice: シリア人ナアマン
  rationale: 定冠詞を伴う民族的呼称を簡潔な日本語の連体表現で保持し、清められた唯一の者がイスラエル人ではなくシリア人だったという修辞的対比を伝える。
theological_decisions:
- issue: 皮膚疾患に関する清めの言葉
  choice: 「清められた」と訳し、身体的治癒と儀礼的清めが重なる表現を保つ。
  alternative: 「癒やされた」「治った」
  rationale: καθαρίζωを医学的治癒だけに狭めず、旧約聖書の皮膚疾患と清浄規定を背景とする語感を保持するため。
- issue: ナアマンの民族的呼称の働き
  choice: 本文に「シリア人」を明記する。
  alternative: 「ナアマン」だけとする、または民族名を注に移す。
  rationale: ギリシア語本文が明示する呼称であり、イスラエルにいた多くの患者と、清めを受けた外国人との緊張を保つため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「預言者」「清められた」という聖書的語彙を保持した。文の対比構造を「一人もなく……だけであった」で再現し、簡潔で朗読しやすい調子に整えた。
