source:
  edition: SBLGNT
  text: ⸀Ἔα, τί ἡμῖν καὶ σοί, Ἰησοῦ Ναζαρηνέ; ἦλθες ἀπολέσαι ἡμᾶς; οἶδά σε τίς εἶ, ὁ ἅγιος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/034.yaml
  text: Ah! What have you to do with us[e][d][c][b][a], Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God.
translation:
  language: ja
  text: 「ああ、ナザレのイエス、私たちとあなたに何の関わりがあるのか。[a][b][c] 私たちを滅ぼしに来たのか。私はあなたが誰か知っている。神の聖なる方だ。」[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ああ」は、驚き、警戒、または抗議を表す唐突な叫び。文脈上は「放っておいてくれ」と意訳することもできる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私たちに、またあなたに何があるのか」。相手との関わりを拒む、または敵対的に抗議する慣用表現。
    reason: cultural_note
  - marker: c
    text: 「私たち」が誰を含むかは原文に明記されていない。悪霊が自分を代表として語っているとも、より広く悪霊の領域を指しているとも考えられる。
    reason: alternative_reading
  - marker: d
    text: 別訳「神の聖者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔα
  choice: ああ
  rationale: 驚き、警戒、抗議を表す唐突な叫びとして、原文の間投詞を簡潔に保った。「放っておいてくれ」のように文脈上の意味を本文へ補いすぎない。
- source_word: τί ἡμῖν καὶ σοί
  choice: 私たちとあなたに何の関わりがあるのですか
  rationale: 直訳的には「私たちに、またあなたに何があるか」というセム語的な離反・抗議の慣用句。対立的な距離を保ちつつ、現代日本語で理解できる形にした。
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: ナザレのイエス
  rationale: 呼格による呼びかけを自然な日本語にし、出身地または呼称としての幅を保った。
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: 私たちを滅ぼしに来たのですか
  rationale: 目的を表す不定詞と到来を表すアオリストを、目前の到来を問う自然な日本語で表した。ἀπόλλυμιの強い破壊・滅亡の意味には「滅ぼす」を用いた。
- source_word: οἶδά σε τίς εἶ
  choice: 私はあなたがどなたか知っています
  rationale: 話者の認識の主張を明瞭に伝え、余分な説明を加えない。
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: 神の聖なる方
  rationale: 属格関係と称号としての重みを保ちながら、日本語として自然にした。
theological_decisions:
- issue: 悪霊の発言における複数形 ἡμῖν／ἡμᾶς
  choice: 「私たち」と訳し、指示対象を特定しない。
  alternative: 悪霊界全体、または悪霊と取りつかれた人を指すと明示する。
  rationale: ギリシア語は一人称複数だが、その範囲を明示していないため、解釈上の緊張を本文で解消しない。
- issue: ὁ ἅγιος τοῦ θεοῦ のキリスト論的称号
  choice: 「神の聖なる方」と訳し、称号をそのまま提示する。
  alternative: 「神に遣わされた聖者」「メシア」などと説明的に展開する。
  rationale: 重要なキリスト論的告白だが、この節自体は称号の意味を詳説していないため、後代の教理表現を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、悪霊の切迫した叫びと称号の荘重さを保った。呼びかけには過度に古風な語尾を避け、敬体によって認識と畏怖を自然に表現した。
