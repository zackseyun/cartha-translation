id: LUK.4.16
reference: Luke 4:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν ⸀εἰς Ναζαρά, οὗ ἦν τεθραμμένος, καὶ εἰσῆλθεν κατὰ τὸ εἰωθὸς αὐτῷ ἐν τῇ ἡμέρᾳ τῶν σαββάτων εἰς τὴν συναγωγήν, καὶ ἀνέστη ἀναγνῶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/016.yaml
  text: And he came to Nazara[a], where he had been brought up, and as was his custom, he entered the synagogue on the Sabbath day, and stood up to read.
translation:
  language: ja
  text: それからイエスは、ご自分が育ったナザラ[a]に来た。いつものように安息日に会堂に入り、朗読するために立ち上がった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ナザレ」。ここのギリシャ語本文は「ナザラ」。
    reason: alternative_reading
lexical_decisions:
- source_word: Ναζαρά
  choice: ナザラ
  rationale: この節のギリシャ語形 Ναζαρά を直接音写した。日本語で一般的な地名「ナザレ」は脚注に示し、本文の語形を別の形に同化させなかった。
- source_word: τεθραμμένος
  choice: 育った
  rationale: τρέφω の完了受動分詞がここで表す養育・成育の意味を、自然な現代日本語で簡潔に表した。
- source_word: κατὰ τὸ εἰωθὸς αὐτῷ
  choice: いつものように
  rationale: イエスの習慣的な行動を表す慣用句を、明快で自然な日本語にした。
- source_word: ἐν τῇ ἡμέρᾳ τῶν σαββάτων
  choice: 安息日に
  rationale: 複数形 σαββάτων を含むギリシャ語の慣用表現を、文脈上の単数の意味に沿って訳した。
- source_word: συναγωγήν
  choice: 会堂
  rationale: 当時のユダヤ教の集会場所を指す語として、日本語聖書で広く理解される簡潔な表現を用いた。
- source_word: ἀνέστη ἀναγνῶναι
  choice: 朗読するために立ち上がった
  rationale: 動詞と目的を示す不定詞の関係を保ち、公の場で声に出して読むという文脈に適した「朗読する」を選んだ。
theological_decisions:
- issue: 地名 Ναζαρά の表記
  choice: ナザラ
  alternative: ナザレ
  rationale: 教理上の相違ではないが、翻訳上は本文に実際にあるギリシャ語形を優先した。一般に定着した「ナザレ」は読者の理解のため脚注に残した。
translation_notes:
  register: 明快で現代的かつ品位ある叙述とした。「ご自分」は主語であるイエスを自然に受け、「いつものように」で習慣性を簡潔に示した。
