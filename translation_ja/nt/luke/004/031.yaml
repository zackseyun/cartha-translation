id: LUK.4.31
reference: Luke 4:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ κατῆλθεν εἰς Καφαρναοὺμ πόλιν τῆς Γαλιλαίας. καὶ ἦν διδάσκων αὐτοὺς ἐν τοῖς σάββασιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/031.yaml
  text: And he went down to Capernaum[a], a city of Galilee. And he was teaching them on the Sabbaths.
translation:
  language: ja
  text: それから、ガリラヤにある町カペナウムへ下って行った。そして、安息日には[a]人々を教えていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は複数形で、「安息日（のたび）に」とも訳せる。複数回の安息日にわたることを指す可能性がある。
    reason: 複数形の語感を示しつつ、反復の頻度を本文で過度に限定しないため。
lexical_decisions:
- source_word: κατῆλθεν
  choice: 下って行った
  rationale: 移動の方向を表す κατέρχομαι の意味を保ちつつ、現代日本語として自然にした。カペナウムへの移動が低い方へ向かうことを示すが、その地理的理由までは本文に加えていない。
- source_word: Καφαρναοὺμ
  choice: カペナウム
  rationale: 日本語の聖書・キリスト教文献で広く定着している地名表記を用いた。
- source_word: πόλιν τῆς Γαλιλαίας
  choice: ガリラヤにある町
  rationale: 属格の関係を自然な所在地表現として訳し、冠詞のない πόλιν に対応して不特定の「町」とした。
- source_word: ἦν διδάσκων
  choice: 教えていた
  rationale: 迂言的な未完了表現が示す継続的・反復的な行為を、日本語の「〜ていた」で表した。
- source_word: αὐτοὺς
  choice: 人々を
  rationale: 直訳の「彼らを」はこの節だけでは指示対象が不明瞭で不自然になるため、特定の集団を過度に限定せず、文脈上そこにいる人々を指す自然な表現とした。
- source_word: ἐν τοῖς σάββασιν
  choice: 安息日ごとに
  rationale: 複数形が示唆する反復性を自然な日本語で明確にし、単一の安息日の出来事に限定しないようにした。
theological_decisions:
- issue: 複数形 σάββασιν を単数的な慣用表現にするか、反復の意味を示すか
  choice: 安息日ごとに
  alternative: 安息日に
  rationale: 教えが複数の安息日にわたって行われた可能性を保ち、未完了的な「教えていた」との対応も明確にするため。教理上の結論を付加するものではない。
translation_notes:
  register: 明快で品位のある現代標準語。「それから」「そして」で原文の二つの καί を自然に反映した。主語は原文どおりこの節では明示せず、前後の文脈から理解できる形にした。
