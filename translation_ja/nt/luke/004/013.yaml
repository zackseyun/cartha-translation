  text: καὶ συντελέσας πάντα πειρασμὸν ὁ διάβολος ἀπέστη ἀπ’ αὐτοῦ ἄχρι καιροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/013.yaml
  text: And after finishing every temptation[a], the devil departed from him until an opportune time.
translation:
  language: ja
  text: 悪魔はあらゆる誘惑[a]を終えた後、好機が訪れるまでイエスから離れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「試み」。ギリシア語は「誘惑」と「試み」のどちらも意味し得るが、ここでは悪魔が誘惑を仕掛けている文脈なので、「誘惑」のほうが自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: συντελέσας
  choice: 終えると
  rationale: アオリスト能動分詞で、主語「悪魔」が主動詞の行為に先立って誘惑を一通り終えたことを示す。日本語では「終えると」が時間的な前後関係を自然かつ簡潔に表す。
- source_word: πάντα πειρασμόν
  choice: あらゆる誘惑
  rationale: 単数形の πειρασμόν に付く πάντα の包括的・分配的意味を「あらゆる」で表した。文脈では悪魔がイエスを忠実な従順からそらそうとしているため、本文では「誘惑」が自然である。
- source_word: ὁ διάβολος
  choice: 悪魔
  rationale: ルカの物語では人格を持つ超自然的な敵対者を指すため、現代日本語で定着した「悪魔」と訳す。
- source_word: ἀπέστη ἀπ’ αὐτοῦ
  choice: イエスのもとを離れた
  rationale: ἀφίστημι はここで、ある人から離れる・退く意。「彼」ではなく指示対象の「イエス」を明示し、「もとを離れた」によって自然な現代日本語とした。
- source_word: ἄχρι καιροῦ
  choice: 時が来るまで
  rationale: καιρός は単なる時間ではなく、ふさわしい機会・時機を表し得る。「時が来るまで」は、悪魔の退去が一時的で、再び機会をうかがう含みを自然に保つ。
theological_decisions:
- issue: πειρασμός がイエスの経験について持つ意味
  choice: 誘惑
  alternative: 試み
  rationale: πειρασμός は「誘惑」と「試み」の両方を意味し得る。ここでは行為者が悪魔であり、イエスを忠実な従順からそらそうとする場面なので、本文には「誘惑」を採用する。ただし、この出来事がイエスを試す働きも持つという語の幅を失わないよう、別訳を脚注に示す。
- issue: ἄχρι καιροῦ の時機性
  choice: 時が来るまで
  alternative: しばらくの間／好機が来るまで
  rationale: 原文は退去の終点を表し、καιρός には適切な時機という含みがある。「時が来るまで」は不自然な説明を加えず、その戦略的・一時的なニュアンスを保つ。
translation_notes:
  register: 明快な現代標準日本語。短い物語文としての流れと品位を保ちつつ、直訳調の「すべての誘惑を完了して」は避けた。脚注記号 [a] は本文中の対応語の直後に置いた。
