lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: 満たされ
  rationale: πίμπλημιのアオリスト受動態の形を保ちつつ、感情に圧倒されたことを自然な日本語で表す。
- source_word: πάντες
  choice: 人々は皆
  rationale: 会堂にいた全員を集合的に指す。日本語では「人々は皆」とすると明瞭で自然。
- source_word: θυμοῦ
  choice: 怒り
  rationale: θυμόςはここで激しい怒りを表す。「激怒」も可能だが、本文では語義を過度に強めない「怒り」とし、脚注で強い訳語を示す。
- source_word: ἐν τῇ συναγωγῇ
  choice: 会堂にいた
  rationale: 場所を示す句を、πάντεςに自然に結び付けて「会堂にいた人々」とした。
- source_word: ἀκούοντες
  choice: これを聞いて
  rationale: 主動詞と同時的で、その怒りのきっかけを示す分詞。「聞いて」が簡潔で自然。
- source_word: ταῦτα
  choice: これ
  rationale: 直前のイエスの発言内容全体を受ける。日本語では複数形を明示する「これらのこと」より「これ」が自然で、指示範囲の広さも保てる。
