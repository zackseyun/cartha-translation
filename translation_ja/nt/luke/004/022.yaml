id: LUK.4.22
reference: Luke 4:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πάντες ἐμαρτύρουν αὐτῷ καὶ ἐθαύμαζον ἐπὶ τοῖς λόγοις τῆς χάριτος τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ, καὶ ἔλεγον· ⸂Οὐχὶ υἱός ἐστιν Ἰωσὴφ οὗτος⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/022.yaml
  text: And all were speaking well of him and were marveling at the gracious words coming from his mouth[a], and they were saying[b], “Is this not Joseph’s son?”
translation:
  language: ja
  text: 人々は皆、イエスのことをよく言い、その口から出て来る恵みに満ちた言葉に驚いていた[a]。そして、「この人はヨセフの息子ではないか」と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスについて証言し、その口から出て来る恵みの言葉に驚いていた」とも訳せる。ギリシア語の表現は、イエスを好意的に語ることも、イエスについて証言することも意味し得る。また「恵みに満ちた言葉」は、直訳すると「恵みの言葉」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρουν αὐτῷ
  choice: イエスのことをよく言い
  rationale: この表現には「彼のために証言する」と「彼を好意的に評価する」の両義があるが、ここでは「驚いていた」と並ぶため、好意的な反応を自然な現代日本語で表した。
- source_word: ἐθαύμαζον
  choice: 驚いていた
  rationale: 未完了過去の継続的な反応を「〜ていた」で示した。「感嘆していた」より平明であり、驚きと称賛の両方を許す。
- source_word: ἐπὶ τοῖς λόγοις
  choice: 言葉に
  rationale: ἐπί＋与格が驚きの対象または契機を示すことを、自然な日本語の助詞「に」で表した。
- source_word: τῆς χάριτος
  choice: 恵みに満ちた
  rationale: 属格を性質を表すものと理解し、言葉が恵み、好意、魅力を帯びていたことを示した。「恵みの言葉」という直訳的な可能性も注で保持する。
- source_word: τοῖς ἐκπορευομένοις ἐκ τοῦ στόματος αὐτοῦ
  choice: その口から出て来る
  rationale: 言葉の出所を具体的に描く原文の比喩を保ちつつ、自然な現代日本語とした。
- source_word: Οὐχὶ
  choice: ではないか
  rationale: 肯定の答えを予期する修辞疑問の力を、日本語の「ではないか」で保持した。
- source_word: υἱός ἐστιν Ἰωσὴφ οὗτος
  choice: この人はヨセフの息子
  rationale: 群衆の認識を簡潔かつ率直に訳し、原文にない神学的説明を加えなかった。
theological_decisions:
- issue: 処女懐胎との関係でイエスをヨセフの息子と呼ぶこと
  choice: 群衆の発言を「この人はヨセフの息子ではないか」とそのまま訳す。
  alternative: 誤解を避けるために「ヨセフの息子と思われている人」などの説明を加える。
  rationale: これは語り手による教理的断定ではなく群衆の認識を報告する発言である。説明を本文に加えず、物語上の緊張を保つ。
- issue: λόγοις τῆς χάριτος の意味
  choice: 「恵みに満ちた言葉」とし、恵みや好意を帯びた言葉という質的意味を前面に出す。
  alternative: 「恵みの言葉」とし、恵みを内容とする言葉とも読める形を取る。
  rationale: 属格の関係には幅があるため本文では自然な質的表現を採り、より直訳的で神学的含意を持ち得る読みを脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「皆」「この人」「ではないか」により、群衆の一体的な反応と修辞疑問を自然に表した。本文中の脚注記号[a]は、関連する二つの語義上の幅を一つの注にまとめて示す。
