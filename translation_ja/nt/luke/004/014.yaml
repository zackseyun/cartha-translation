  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὑπέστρεψεν ὁ Ἰησοῦς ἐν τῇ δυνάμει τοῦ πνεύματος εἰς τὴν Γαλιλαίαν. καὶ φήμη ἐξῆλθεν καθ’ ὅλης τῆς περιχώρου περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/014.yaml
  text: And Jesus returned to Galilee in the power of the Spirit[a], and a report about him went out through all the surrounding region.
translation:
  language: ja
  text: イエスは聖霊の力を受けてガリラヤへ帰られた。そして、イエスについての知らせ[a]が周辺一帯に広まった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「評判」「うわさ」とも訳せる。原語は広く伝わる知らせを指し、それが好意的か否定的かは明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: 帰られた
  rationale: 物語中の移動を表す「戻る、帰る」の意。日本語では目的地ガリラヤとの組み合わせに「帰る」が自然であり、イエスへの敬意を示す通常の敬語表現とした。
- source_word: ἐν τῇ δυνάμει
  choice: 力のうちに
  rationale: ἐν が示す領域・状態・様態を断定的に手段へ限定せず、原文の表現と含みを保つ。
- source_word: τοῦ πνεύματος
  choice: 御霊の
  rationale: 直前の文脈では聖霊を指す。「聖」は本文に明記されていないため補わず、日本語で神の霊を指すことが明瞭な「御霊」とした。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ
  rationale: 移動の目的地を自然な現代日本語で表す。
- source_word: φήμη
  choice: 評判
  rationale: 人について広く伝わる話・風聞を表す語として自然である。ただし日本語の「評判」は肯定的に受け取られる場合もあるため、原語が価値判断を明示しないことを脚注で補う。
- source_word: ἐξῆλθεν
  choice: 広まった
  rationale: 原文の「出て行った」という拡散の比喩を、日本語で情報が伝播する際の自然な表現にした。
- source_word: καθ’ ὅλης τῆς περιχώρου
  choice: 周辺一帯に
  rationale: κατά＋属格の広がりと、περίχωρος の周辺地域という地理的意味を簡潔に表す。
- source_word: περὶ αὐτοῦ
  choice: イエスについての
  rationale: 指示対象を日本語で明確にし、περί＋属格の話題・対象の意味を自然に表す。
theological_decisions:
- issue: πνεύματος の指示対象
  choice: 聖霊を指す「御霊」
  alternative: 一般的または非特定の「霊」
  rationale: ルカ4章直前の文脈では一貫して聖霊がイエスを導いている。原文にない「聖」を本文へ追加せず、「御霊」によって文脈上の指示対象を示した。
- issue: ἐν τῇ δυνάμει の関係
  choice: 「御霊の力のうちに」とし、領域・状態・様態の含みを保つ
  alternative: 「御霊の力によって」として手段に特定する
  rationale: ἐν は手段を含み得るが、この句ではイエスが御霊の力に満たされ、その力の領域・状態にあって帰ったという含みもあるため、一義的に手段へ限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。イエスには日本語聖書として自然な敬語を用い、情報の伝播は直訳調の「出て行った」ではなく「広まった」とした。脚注記号[a]は該当語の直後に置いた。
