  text: αὐτὸς δὲ διελθὼν διὰ μέσου αὐτῶν ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/030.yaml
  text: But he[a], passing through their midst, went on his way.
translation:
  language: ja
  text: しかし、イエスは彼らの真ん中を通り抜けて[a]、去って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は、イエスが彼らの真ん中を通って去って行ったことを述べているが、それがどのように起こったかは説明していない。
    reason: 原文がその移動・脱出の方法を明示しておらず、奇跡的かどうかを訳文で決めないため。
lexical_decisions:
- source_word: αὐτὸς
  choice: イエスは
  rationale: ギリシア語では明示された代名詞に多少の強調がある。日本語で「彼自身は」とすると強すぎるため、文脈上の指示対象を固有名で示し、自然で明瞭な主語とした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の群衆の敵意と、イエスがそこを去ったこととの穏やかな対照を表す。
- source_word: διελθὼν
  choice: 通り抜け
  rationale: διέρχομαιのアオリスト分詞が表す、ある空間を通過する動きを、主動詞との関係を保ちながら自然な日本語で表した。
- source_word: διὰ μέσου αὐτῶν
  choice: 彼らの真ん中を
  rationale: 集団の中央・ただ中を通るという空間的な描写を保ち、「彼らの間を」より原文のμέσουを明確に反映した。
- source_word: ἐπορεύετο
  choice: そのまま立ち去った
  rationale: 未完了形が示す進行・継続的な移動を「そのまま」で補い、単なる瞬間的な退出ではなく、道を進んで去る様子を自然に表した。
theological_decisions:
- issue: この脱出が奇跡であったと訳文で明示するか
  choice: 仕組みを説明せず、「彼らの真ん中を通り抜け」と描写する
  alternative: 「奇跡的に彼らの間を通り抜け」など、超自然的な脱出を明示する
  rationale: ギリシア語本文はイエスが群衆のただ中を通って去ったことを述べるだけで、それがどのように可能になったかは説明していない。読者の解釈の余地と本文の神学的緊張を保つため、描写的に中立な表現とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「真ん中」は日常的で理解しやすい一方、文全体は聖書本文にふさわしい簡潔で落ち着いた調子を保っている。
