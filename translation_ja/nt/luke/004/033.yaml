  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐν τῇ συναγωγῇ ἦν ἄνθρωπος ἔχων πνεῦμα δαιμονίου ἀκαθάρτου, καὶ ἀνέκραξεν φωνῇ μεγάλῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/033.yaml
  text: And in the synagogue there was a man having an unclean spirit of a demon[a], and he cried out with a loud voice[b],
translation:
  language: ja
  text: 会堂に、汚れた悪霊につかれた男がいて[a]、大声で叫んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「汚れた悪霊の霊を持つ男」。ギリシア語には「霊」と「悪霊」の両方の語がある。
    reason: 原文のπνεῦμαとδαιμόνιονの重なりを示すため。
lexical_decisions:
- source_word: συναγωγῇ
  choice: 会堂
  rationale: この文脈ではユダヤ人が礼拝と教えのために集まる場所を指す。日本語の聖書用語として定着し、簡潔で文脈にも適している。
- source_word: ἄνθρωπος
  choice: 男
  rationale: 物語中の単数男性を指すため、一般的な「人」ではなく「男」とした。
- source_word: ἔχων
  choice: 宿す
  rationale: 字義は「持っている」だが、「悪霊を持つ」は現代日本語では不自然である。「宿す」は悪霊との関係を自然に示しつつ、「取りつかれた」ほど明示的に状態を規定しない。
- source_word: πνεῦμα δαιμονίου ἀκαθάρτου
  choice: 汚れた悪霊
  rationale: ギリシア語には「霊」と「悪霊」の両語が含まれるが、日本語で「悪霊の霊」とすると著しく不自然になるため、本文では「汚れた悪霊」とし、原文の重なった表現は脚注に示した。ἀκαθάρτουは形態上δαιμονίουと一致する。
- source_word: ἀνέκραξεν
  choice: 叫んだ
  rationale: 大きな声を発したことを表す物語のアオリストであり、続く「大声で」と合わせて自然に訳した。
- source_word: φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 字義的な「大きな声で」に相当し、現代日本語では「大声で」が簡潔で自然である。
theological_decisions:
- issue: 悪霊に関する用語の重なり
  choice: 本文を「汚れた悪霊」とし、脚注で「汚れた悪霊の霊」という原文の構造を示す
  alternative: 汚れた悪霊の霊
  rationale: 原文はπνεῦμαとδαιμόνιονの双方を明記するが、日本語では「悪霊」自体に「霊」が含まれる。本文の明瞭さを保ちながら、脚注によって原文の明示的な二語を省略せず伝える。
- issue: ἔχωνが示す悪霊との関係
  choice: 宿す
  alternative: 取りつかれた
  rationale: 「取りつかれた」は文脈に即した解釈ではあるが、原文はより広い「持つ」を用いる。「宿す」により、悪霊による苦しみという文脈を自然に表しながら、憑依のあり方を必要以上に詳しく規定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「会堂」は文脈上の専門性を保ち、「宿す」は字義と自然さの均衡を図る表現とした。文末は次節の直接話法へ続くため、「叫んだ」とした。
