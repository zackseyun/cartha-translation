source:
  edition: SBLGNT
  text: Ἀναστὰς δὲ ⸀ἀπὸ τῆς συναγωγῆς εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος. πενθερὰ δὲ τοῦ Σίμωνος ἦν συνεχομένη πυρετῷ μεγάλῳ, καὶ ἠρώτησαν αὐτὸν περὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/038.yaml
  text: And after rising from the synagogue[a], he entered Simon’s house. Now Simon’s mother-in-law was afflicted with a high fever, and they asked him about her.
translation:
  language: ja
  text: イエスは会堂を出て、シモンの家に入った。シモンの義母は高熱に苦しめられていたので、人々は彼女のことをイエスに願い出た[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼女について彼に尋ねた」。この表現は、彼女のために助けを求めたことを含意しうる。
    reason: ἠρώτησαν αὐτὸν περὶ αὐτῆςは字義的には「彼女について彼に尋ねた」であり、文脈上は依頼・嘆願の意味を帯びうるが、求めた内容は明示されていない。
lexical_decisions:
- source_word: Ἀναστὰς δὲ ἀπὸ τῆς συναγωγῆς
  choice: 会堂を立って出ると
  rationale: アオリスト分詞が主動詞に先立つ動作を示す。「立って会堂から」の語順を日本語として自然に整え、会堂を去って次の場所へ向かう動きを表した。
- source_word: εἰσῆλθεν εἰς τὴν οἰκίαν Σίμωνος
  choice: シモンの家に入った
  rationale: εἰσέρχομαι と εἰς が示す内部への移動を、簡潔で自然な日本語にした。
- source_word: πενθερὰ τοῦ Σίμωνος
  choice: シモンのしゅうとめ
  rationale: πενθερά は「妻または夫の母」を意味する親族名称であり、本文が明示する関係だけを訳した。現代日本語で読みやすいよう平仮名表記とした。
- source_word: ἦν συνεχομένη πυρετῷ μεγάλῳ
  choice: 高熱に苦しめられていた
  rationale: 受動分詞 συνεχομένη の、病に捕らえられ圧迫されているという強い含みを「苦しめられていた」で表し、πυρετῷ μεγάλῳ は自然な医学的表現「高熱」とした。
- source_word: ἠρώτησαν αὐτὸν περὶ αὐτῆς
  choice: 人々は彼女のことでイエスに願った
  rationale: ἐρωτάω は「尋ねる」と「願う」の両義を持つが、癒やしを求める文脈に合う「願った」を採用した。一方、περὶ αὐτῆς の控えめな表現を「彼女のことで」として残し、具体的な願いの内容を本文に補わなかった。原文の幅は脚注で示した。
theological_decisions:
- issue: πενθερά が含意するシモンの婚姻状況
  choice: 「シモンのしゅうとめ」と親族関係のみを直接訳す。
  alternative: シモンが結婚していたことを説明として本文に補う。
  rationale: 婚姻は親族名称から自然に含意されるが、原文はそれ以上の歴史的・教理的結論を述べていないため。
- issue: ἠρώτησαν αὐτὸν περὶ αὐτῆς における依頼の明示度
  choice: 「彼女のことでイエスに願った」とし、何を願ったかは明記しない。
  alternative: 「彼女を治してくださるようイエスに願った」または「彼女についてイエスに尋ねた」。
  rationale: 文脈上は助けや癒やしの依頼と考えられるが、原文はその内容を明言しない。「願った」は動詞の語義と文脈を反映しつつ、目的を補いすぎない。
translation_notes:
  register: 明瞭な現代標準語を用い、簡潔で品位ある叙述調とした。日本語では主語を繰り返さないほうが自然なため、前半の暗黙の主語は原文同様に文脈に委ねたが、後半の αὐτόν は指示対象を明確にするため「イエス」とした。「姑」は読みの揺れや硬さを避けて「しゅうとめ」と表記した。
