id: LUK.4.3
reference: Luke 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂εἶπεν δὲ⸃ αὐτῷ ὁ διάβολος· Εἰ υἱὸς εἶ τοῦ θεοῦ, εἰπὲ τῷ λίθῳ τούτῳ ἵνα γένηται ἄρτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/003.yaml
  text: Then the devil said to him[a], “If you are the Son of God, tell this stone to become bread.”
translation:
  language: ja
  text: そこで悪魔はイエスに言った。「もしあなたが神の子なら、この石に、パンになれと言いなさい。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたは神の子なのだから」とも理解できる。ギリシア語の条件文は、挑戦のために前提を事実として認めている場合があるが、本文では条件の形を残した。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 弱い接続を示しつつ、直前の空腹を受けた物語の展開を自然な現代日本語で表す。
- source_word: ὁ διάβολος
  choice: 悪魔
  rationale: この文脈では人格的存在の呼称であり、日本語聖書で定着した明瞭な訳語。
- source_word: Εἰ
  choice: もし…なら
  rationale: 条件文の形と誘惑の挑戦的な響きを保ち、「…なのだから」と前提を確定しない。
- source_word: υἱὸς ... τοῦ θεοῦ
  choice: 神の子
  rationale: このキリスト論的文脈では不定の「神の一人の子」ではなく、称号的・限定的な意味を持つ。日本語では冠詞を補わず「神の子」とするのが自然。
- source_word: εἰπὲ τῷ λίθῳ τούτῳ
  choice: この石に…と言いなさい
  rationale: λέγωの通常の発話行為を保ち、「命じなさい」と必要以上に強めない。指示詞τούτῳも「この」で明示する。
- source_word: ἵνα γένηται ἄρτος
  choice: パンになれ
  rationale: 発言内容を日本語の直接命令として自然に表現し、γίνομαιの変化の意味とἄρτοςの基本義を簡潔に保つ。
theological_decisions:
- issue: 条件節 Εἰ υἱὸς εἶ τοῦ θεοῦ の含意
  choice: もしあなたが神の子なら
  alternative: あなたは神の子なのだから
  rationale: ギリシア語の条件形式を本文に残し、悪魔の言葉が前提を認めた挑戦なのか、身分への疑念を誘うものなのかを訳文で断定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「イエス」はギリシア語の代名詞が指す人物を日本語で明確にするため補った。「パンになれ」は石に向けた発話内容として簡潔かつ自然。
