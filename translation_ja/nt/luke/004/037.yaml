  text: And news about him was spreading into every place in the surrounding region[a].
translation:
  language: ja
  text: そして、イエスについての知らせは、周辺地域の至る所に広まっていった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「イエスについての知らせが、周辺地域のあらゆる場所へ伝わっていった」。原語は字義的には「音・響き」を表すが、ここではイエスについての知らせや報告を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: こうして
  rationale: 直前の出来事を受ける物語上の連結を、現代日本語で自然に示す。単純な「そして」も可能だが、ここでは結果的な展開にもよくなじむ。
- source_word: ἐξεπορεύετο
  choice: 広まっていった
  rationale: 未完了過去が表す継続的・進行的な動きを保ちつつ、ἦχοςを主語とする文脈に自然な日本語とした。より直訳的には「出て行った／伝わっていった」。
- source_word: ἦχος
  choice: 評判
  rationale: 本来は「音、響き」を表すが、περὶ αὐτοῦを伴うこの文脈では、イエスについて広がる知らせ・評判を指す。「知らせ」も可能だが、人物について広く伝わるという含みを自然に表すため「評判」とした。
- source_word: περὶ αὐτοῦ
  choice: イエスについての
  rationale: 代名詞の指示対象を日本語で明確にし、その人物に関する評判であることを示した。
- source_word: εἰς πάντα τόπον
  choice: 至る所に
  rationale: 直訳は「すべての場所へ」だが、分配的な意味を自然な現代日本語で表した。
- source_word: τῆς περιχώρου
  choice: 周辺一帯の
  rationale: περίχωροςの「周囲の地域、近隣地方」という地理的意味を簡潔かつ自然に表した。
