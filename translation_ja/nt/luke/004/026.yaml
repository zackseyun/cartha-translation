id: LUK.4.26
reference: Luke 4:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πρὸς οὐδεμίαν αὐτῶν ἐπέμφθη Ἠλίας εἰ μὴ εἰς Σάρεπτα τῆς ⸀Σιδωνίας πρὸς γυναῖκα χήραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/026.yaml
  text: And Elijah was sent to none of them[a], except to Zarephath of Sidon, to a widow.
translation:
  language: ja
  text: エリヤは彼女たちのだれのもとにも遣わされず、ただシドン地方のサレプタ[a]にいた一人のやもめのもとにだけ遣わされました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「サレプタ」は、通常、旧約聖書の「ツァレファテ」（列王記第一17章9節）と同定される地名です。
    reason: ギリシャ語形「サレプタ」と旧約聖書で一般的な地名表記「ツァレファテ」との伝統的な対応を示すため。
lexical_decisions:
- source_word: ἐπέμφθη
  choice: 遣わされました
  rationale: 受動態を保ち、文脈上想定される神を送り手として明示せず、原文の抑制を維持した。
- source_word: πρὸς οὐδεμίαν αὐτῶν
  choice: 彼女たちのだれのもとにも……ず
  rationale: 直前の複数のやもめを受ける女性複数代名詞の指示と、οὐδεμίανによる全面的な除外を自然な日本語で表した。
- source_word: εἰ μὴ
  choice: ただ……だけ
  rationale: 条件ではなく例外を示す構文として訳し、唯一の例外であることを明確にした。
- source_word: Σάρεπτα
  choice: サレプタ
  rationale: ギリシャ語の地名形を直接音写し、旧約で一般的な表記との対応は注で示した。
- source_word: τῆς Σιδωνίας
  choice: シドン地方の
  rationale: 属格による地理的所属を、都市そのものとの混同を避けつつ自然に表現した。
- source_word: γυναῖκα χήραν
  choice: 一人のやもめ
  rationale: 『女、すなわちやもめ』という同格的表現を、意味を損なわない自然な現代日本語にした。
theological_decisions:
- issue: エリヤを遣わした主体が受動文で明示されていないこと
  choice: 「遣わされました」として主体を明示しない
  alternative: 「神はエリヤを遣わされました」
  rationale: 文脈上は神の働きが想定されるが、ギリシャ語本文は送り手を明記していないため、その含みを保った。
translation_notes:
  register: 明瞭で格調ある現代標準語。前節から続く発言であるため丁寧体を用いた。「もとに」を反復して、派遣の行き先が人であることを明確にし、例外の強調を保った。
