  text: ἡμέρας τεσσεράκοντα πειραζόμενος ὑπὸ τοῦ διαβόλου. καὶ οὐκ ἔφαγεν οὐδὲν ἐν ταῖς ἡμέραις ἐκείναις, καὶ συντελεσθεισῶν ⸀αὐτῶν ἐπείνασεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/002.yaml
  text: for forty days, being tempted by the devil. And he ate nothing during those days, and when they were completed, he was hungry.
translation:
  language: ja
  text: イエスは四十日間、悪魔に誘惑されていた。[a] その間、何も食べず、その日々が終わると、空腹を覚えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「試された」。ギリシア語の動詞は「誘惑する」と「試す」のどちらの意味にもなり得るが、ここでは行為者が悪魔なので、「誘惑されていた」が文脈に最もよく合う。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμέρας τεσσεράκοντα
  choice: 四十日間
  rationale: 期間を表す対格を、自然で簡潔な現代日本語にした。
- source_word: πειραζόμενος
  choice: 誘惑を受けた
  rationale: この語には「試される」の意味もあるが、行為者が悪魔であるため、ここでは敵対的・道徳的な働きを表す「誘惑を受けた」が文脈に最も適する。分詞の継続的な意味合いは「四十日間」との結びつきによって保たれる。
- source_word: ὑπὸ τοῦ διαβόλου
  choice: 悪魔から
  rationale: 受動文における行為者を自然な日本語で示した。διάβολοςはここでは固有の人格的存在を指す呼称なので、標準的な「悪魔」とした。
- source_word: οὐκ ἔφαγεν οὐδὲν
  choice: 何も食べず
  rationale: 強い否定を自然に保ち、後続節へ滑らかにつなげた。
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: その間
  rationale: 直前の「四十日間」を受け、その期間中であることを重複なく明確に表す。
- source_word: συντελεσθεισῶν αὐτῶν
  choice: その日々が終わると
  rationale: 属格独立構文を時間節として訳し、期間が満了したことを自然な現代日本語で表した。
- source_word: ἐπείνασεν
  choice: 空腹を覚えた
  rationale: 四十日の終了時に空腹が現れたことを示すアオリストの推移的な含みを、自然で dignified な日本語にした。
theological_decisions:
- issue: 荒野でのイエスの経験を表すπειραζόμενοςの訳
  choice: 誘惑を受けた
  alternative: 試された
  rationale: 悪魔が行為者である直接の文脈から「誘惑」が最も適切である。ただし、ギリシア語が持ち得る「試す」という語義を脚注に残し、キリストの誘惑可能性について教理的な説明を付加して緊張を解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、聖書本文としての品位を保った。「その日々」は原文の照応関係を見える形で残し、「空腹を覚えた」は古風な「飢えた」より自然に、空腹の発生を表す。
