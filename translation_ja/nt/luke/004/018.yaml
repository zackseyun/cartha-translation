id: LUK.4.18
reference: Luke 4:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πνεῦμα κυρίου ἐπ’ ἐμέ, οὗ εἵνεκεν ἔχρισέν με εὐαγγελίσασθαι πτωχοῖς, ἀπέσταλκέν ⸀με κηρύξαι αἰχμαλώτοις ἄφεσιν καὶ τυφλοῖς ἀνάβλεψιν, ἀποστεῖλαι τεθραυσμένους ἐν ἀφέσει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/018.yaml
  text: The Spirit of the Lord is upon me[a], because he has anointed me to proclaim good news to the poor. He has sent me to proclaim release to the captives and recovery of sight to the blind, to send out the oppressed in release[b],
translation:
  language: ja
  text: 「主の霊が私の上にある。貧しい人々に良い知らせを告げ知らせるために、主が私に油を注いだからである。主は私を遣わした。捕らわれている人々に解放[a]を、目の見えない人々に視力の回復を告げ知らせ、虐げられている人々[b]を解放して送り出すためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「解放」と訳したギリシャ語ἄφεσιςは、「赦し」とも訳せる。ここでは、捕らわれている人々や虐げられている人々という文脈から「解放」とした。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「打ち砕かれた人々」。ここでは文脈に即して「虐げられている人々」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πνεῦμα κυρίου ἐπ’ ἐμέ
  choice: 主の霊が私の上にある
  rationale: 動詞が省略されたギリシャ語の名詞文を自然な日本語で補いながら、イザヤ書引用の荘重な響きとἐπίの空間的比喩を保った。
- source_word: οὗ εἵνεκεν ἔχρισέν με
  choice: 主が私に油を注がれたからである
  rationale: οὗ εἵνεκενの理由を示す働きを明確にし、χρίωのメシア的背景を損なわない「油を注ぐ」を採用した。主語は文脈上の「主」を補った。
- source_word: εὐαγγελίσασθαι πτωχοῖς
  choice: 貧しい人々に良い知らせを告げる
  rationale: εὐαγγελίζωを教会用語に限定せず、公に良い知らせを伝える意味で訳した。πτωχοίは物質的・社会的含意を狭めず「貧しい人々」とした。
- source_word: ἀπέσταλκέν με κηρύξαι
  choice: 主は私を遣わされた。……告げ……ためである
  rationale: 完了形が示す、遣わされた結果が今も続く含みを日本語の文脈で表し、κηρύσσωの公的な告知を「告げる」とした。長い一文を分けて可読性を高めた。
- source_word: αἰχμαλώτοις ἄφεσιν
  choice: 捕らわれている人々に解放を
  rationale: 捕囚・拘束の文脈ではἄφεσιςの解放の意味が前景化するため「解放」としたが、「赦し」の可能性は脚注に残した。
- source_word: τυφλοῖς ἀνάβλεψιν
  choice: 目の見えない人々に視力の回復を
  rationale: ἀνάβλεψιςの、見えるようになる、または視力を取り戻す意味を「視力の回復」で明示した。
- source_word: τεθραυσμένους
  choice: 虐げられている人々
  rationale: 直訳は「打ち砕かれた人々」だが、解放を語る引用の文脈に即して自然な慣用的意味を本文に採り、字義的表現は脚注に示した。
- source_word: ἀποστεῖλαι … ἐν ἀφέσει
  choice: 解放して送り出す
  rationale: ἀποστέλλωの「送り出す」を保持しつつ、ἐν ἀφέσειが表す解放された状態を自然な日本語で表現した。
theological_decisions:
- issue: イザヤ書引用におけるἄφεσιςの意味
  choice: 解放
  alternative: 赦し
  rationale: 直近の「捕らわれている人々」「虐げられている人々」という語彙場は社会的・身体的な解放を強く示す。一方、ルカ文書ではἄφεσιςが罪の赦しにも用いられるため、その神学的な響きを排除せず脚注で代案を示した。
- issue: τεθραυσμένουςが指す状態
  choice: 虐げられている人々
  alternative: 打ち砕かれた人々
  rationale: 完了受動分詞は字義的には「打ち砕かれた者たち」だが、この解放宣言では圧迫によって傷つけられた人々を指す慣用的表現と理解できる。本文では文脈上の意味を優先し、字義を脚注に保存した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、会堂で朗読される預言書引用にふさわしい荘重さを保った。「福音を宣べ伝える」のような定型的教会用語に偏らず、一般の読者にも理解しやすい表現とした。
