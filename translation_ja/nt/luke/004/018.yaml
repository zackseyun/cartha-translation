  to: 「主の霊が私の上にある。貧しい人々に良い知らせを告げ知らせるために、主が私に油を注いだからである。主は私を遣わした。捕らわれている人々に解放[a]を、目の見えない人々に視力の回復を告げ知らせ、虐げられている人々[b]を解放して送り出すためである。」
