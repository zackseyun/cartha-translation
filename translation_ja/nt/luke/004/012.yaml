id: LUK.4.12
reference: Luke 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Εἴρηται· Οὐκ ἐκπειράσεις κύριον τὸν θεόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/012.yaml
  text: 'And Jesus answered him[b][a], “It is said: You shall not put the Lord your God to the test.”'
translation:
  language: ja
  text: イエスは彼に答えた。「こう言われている。『あなたの神である主を試してはならない。』」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「こう言われている」――伝統的な訳では「こう書かれている」とされることが多いですが、ここのギリシア語は文字どおりには「こう言われている」です。
    reason: alternative_reading
  - marker: b
    text: 申命記6章16節からの引用です。引用元のヘブライ語では、ここに神の名YHWHがあります。これは多くの翻訳で「主」と訳されます。
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτῷ
  choice: 彼に答えた
  rationale: 分詞と定動詞を重ねるセム語的な言い回しを、意味を損なわず自然な現代日本語にした。αὐτῷは文脈上、悪魔を指す。
- source_word: ὅτι
  choice: —
  rationale: 答えの内容を直接引用で示す日本語では、対応する接続表現を明示する必要がない。
- source_word: Εἴρηται
  choice: こう言われている
  rationale: λέγωの完了受動形であり、直訳的には「言われており、その言葉が有効である」という含みを持つ。聖書引用の権威性と、γράφωではなくλέγωである点の双方を保った。
- source_word: Οὐκ ἐκπειράσεις
  choice: 試してはならない
  rationale: ἐκπειράζωは相手を試みにかけ、その真実性や力を証明させようとすることを表す。「誘惑してはならない」では、罪へ誘う意味に誤解されやすい。
- source_word: κύριον τὸν θεόν σου
  choice: あなたの神である主
  rationale: κύριοςを「主」、τὸν θεόν σουを同格的に「あなたの神である」と訳し、申命記引用の契約的な表現を保った。
theological_decisions:
- issue: 聖書引用句 Εἴρηται
  choice: こう言われている
  alternative: こう書かれている／こう言われた
  rationale: ギリシア語はγράφω（書く）ではなくλέγω（言う）の完了受動形であるため、伝統的な「書かれている」に置き換えず、原文の語を反映した。完了形の継続的効力は「言われている」で表した。
- issue: 申命記6章16節の引用における κύριος
  choice: 主
  alternative: 主〔ヤハウェ〕
  rationale: ルカのギリシア語本文にあるκύριοςを主本文では「主」とした。引用元のヘブライ語には神の固有名YHWHがあることを脚注で示し、ギリシア語本文と引用元との関係を透明にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用句は命令の重みを保ちつつ、古風すぎない「試してはならない」とした。脚注記号は対応する引用文の直後に置いた。
