base_translation:
  language: en
  yaml_path: translation/nt/luke/004/001.yaml
  text: And Jesus[a], full of the Holy Spirit, returned from the Jordan and was being led by the Spirit in the wilderness.
translation:
  language: ja
  text: さて、イエスは聖霊に満ちてヨルダン川から戻り、荒野で聖霊に[a]導かれていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊のうちに導かれていた」とも訳せる。ギリシア語は字義的には「霊のうちに」であり、ここでは聖霊がイエスを導いたことを表すと理解されることが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλήρης πνεύματος ἁγίου
  choice: 聖霊に満ちて
  rationale: πλήρης＋属格の「〜に満ちた」という継続的な状態を自然な日本語で表し、一時的な充満の出来事とは限定しない。
- source_word: ὑπέστρεψεν
  choice: 戻り
  rationale: ὑποστρέφωの基本義「戻る」を簡潔に表し、前後の動作を自然につなぐ。
- source_word: ἀπὸ τοῦ Ἰορδάνου
  choice: ヨルダン川から
  rationale: 日本語では地名だけの「ヨルダン」より「ヨルダン川」が明瞭で自然であり、指示対象を説明的に明示する。
- source_word: ἤγετο
  choice: 導かれていた
  rationale: 未完了過去の受動態が表す、過去に継続していた導きを保持する。
- source_word: ἐν τῷ πνεύματι
  choice: 聖霊に
  rationale: 受動態のἄγωとともに用いられたἐνを手段・動作主として理解し、直前の「聖霊」と同じ指示対象がイエスを導くことを明瞭にする。より字義的な可能性は脚注に残す。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: ἔρημοςを、砂漠に限定せず、人里離れた場所を表す聖書的かつ自然な語「荒野」で訳す。
- source_word: δὲ
  choice: さて
  rationale: δέの穏やかな場面転換を、現代日本語の物語文で自然な接続語によって示す。
theological_decisions:
- issue: ἐν τῷ πνεύματιのπνεῦμαが指すもの
  choice: 聖霊
  alternative: イエスの内的な霊的状態
  rationale: 直前の「聖霊に満ちて」とルカ文書における聖霊の能動的な働きから、同じ聖霊がイエスを導いていると読むのが最も自然である。ただしἐνの表現上の幅は脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準語。未完了過去の継続性を「導かれていた」で表し、「聖霊」を繰り返して指示対象を明確にした。
