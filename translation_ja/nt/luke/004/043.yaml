id: LUK.4.43
reference: Luke 4:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτοὺς ὅτι Καὶ ταῖς ἑτέραις πόλεσιν εὐαγγελίσασθαί με δεῖ τὴν βασιλείαν τοῦ θεοῦ, ὅτι ⸀ἐπὶ τοῦτο ⸀ἀπεστάλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/043.yaml
  text: But he said to them[a], “I must also proclaim the good news of the kingdom of God to the other cities[b], because I was sent for this.”
translation:
  language: ja
  text: しかし、イエスは彼らに言った。「わたしはほかの町々にも、神の国の良い知らせを告げなければならない。[a] そのために、わたしは遣わされたのだから。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の国の福音を宣べ伝えなければならない」。
    reason: εὐαγγελίσασθαιの伝統的・教会的な訳語を示すため。
  - marker: b
    text: または「この目的のために、わたしは遣わされた」。
    reason: ἐπὶ τοῦτοの目的をより明示する訳を示すため。
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: しかし、イエスは彼らに言った
  rationale: δέが示す、群衆の願いに対する穏やかな対比を「しかし」で表した。日本語では主語を明確にするため、文脈上の指示対象である「イエス」を用いた。
- source_word: Καὶ ταῖς ἑτέραις πόλεσιν
  choice: ほかの町々にも
  rationale: καίの付加的意味を「にも」で表し、ἑτέραιςは現在いる場所とは別の町々を指すものとして訳した。πόλιςは規模を限定しすぎない自然な日本語の「町」とした。
- source_word: εὐαγγελίσασθαί
  choice: 良い知らせを告げ知らせる
  rationale: εὐαγγελίζωの動詞的な力を保ちつつ、教会用語だけに限定されない明瞭な現代語とした。目的語「神の国」との関係が自然になるよう「神の国の良い知らせ」と構成した。
- source_word: δεῖ
  choice: しなければならない
  rationale: ルカ文書で使命に伴う強い必要性を表す語であり、その力を自然な日本語で保持した。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 神の支配と領域の双方を含み得る中心的表現であるため、一方に限定せず、定着した透明な訳語を採用した。
- source_word: ἐπὶ τοῦτο
  choice: そのために
  rationale: 直前に述べられた宣教使命を受ける目的表現として自然に訳した。「この目的のために」という明示的な訳も可能である。
- source_word: ἀπεστάλην
  choice: わたしは遣わされた
  rationale: アオリスト受動態の使命・派遣の意味を保持した。送り手は文脈上神が示唆されるが、原文が明記しないため訳文でも補わなかった。
theological_decisions:
- issue: イエスの使命に伴う必要性
  choice: 「しなければならない」により、神的使命を示唆する強い必要性を保つ
  alternative: 「する必要がある」
  rationale: δεῖは単なる実務上の必要以上の含意を持ち得るが、「神が命じた」と明示して原文を越えないようにした。
- issue: 派遣した主体
  choice: 受動形のまま「遣わされた」とする
  alternative: 「神に遣わされた」
  rationale: ἀπεστάληνは神による派遣を強く示唆するが、節内では送り手が明示されていない。その含意と余白の両方を保存した。
- issue: 「神の国」の意味範囲
  choice: 「神の国」と訳し、神の支配か領域かを限定しない
  alternative: 「神の支配」
  rationale: βασιλείαは支配・王権と領域の両面を帯び得るため、本文で一義的に解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言にふさわしい簡潔で荘重な調子を保った。「町々」「告げ知らせる」は一般読者に理解しやすく、「神の国」「遣わされた」は原文の神学的含意を過度に説明せず保持する。
