id: LUK.4.8
reference: Luke 4:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸂ὁ Ἰησοῦς εἶπεν αὐτῷ⸃· Γέγραπται· ⸂Κύριον τὸν θεόν σου προσκυνήσεις⸃ καὶ αὐτῷ μόνῳ λατρεύσεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/008.yaml
  text: 'And Jesus answered him[a], “It is written: ‘You shall worship the Lord your God[b], and you shall serve only him.’”'
translation:
  language: ja
  text: イエスは彼に答えた。「こう書かれている。『あなたの神である主を礼拝し[a]、ただ主に仕えよ。』」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「礼拝し」は、より字義的には「ひれ伏し」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: この引用は申命記6章13節を踏まえている。
    reason: cross_reference
lexical_decisions:
- source_word: ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: イエスは彼に答えた
  rationale: 分詞と定動詞を組み合わせたギリシア語の応答表現を、意味を保ちながら自然な現代日本語にまとめた。
- source_word: Γέγραπται
  choice: こう書かれている
  rationale: 聖書引用を導入する完了受動形であり、書かれた言葉が今も効力を持つという含みを自然に表す。
- source_word: Κύριον τὸν θεόν σου
  choice: あなたの神である主
  rationale: κύριον と τὸν θεόν σου の同格関係を明確にし、引用中で神を指す「主」の重みを保った。
- source_word: προσκυνήσεις
  choice: 礼拝し
  rationale: 本来は身をかがめる行為も表すが、ここでは神に向けられる崇敬を指すため「礼拝する」とした。字義的な別訳は脚注に示した。
- source_word: αὐτῷ μόνῳ λατρεύσεις
  choice: ただこの方に仕えよ
  rationale: λατρεύω が神にささげる奉仕を表すことを文脈で保ちつつ、μόνῳ の排他性を「ただこの方に」で明示した。未来形は引用内で命令の効力を持つため、日本語では命令形にした。
theological_decisions:
- issue: 神を指す κύριος の訳語
  choice: 主
  alternative: 主人
  rationale: 申命記を踏まえた聖書引用で、契約の神を指すため、「主人」ではなく伝統的かつ現代日本語でも理解可能な「主」とした。新約ギリシア語本文にない固有名を補わなかった。
- issue: προσκυνέω と λατρεύω の区別
  choice: 「礼拝する」と「仕える」
  alternative: 「ひれ伏す」と「礼拝奉仕をする」
  rationale: 前者は崇敬、後者は神への奉仕という語義上の違いを保ちつつ、過度に専門的でない自然な表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用文は聖書的な命令の力を表すため「仕えよ」とし、古語的な語尾や不必要に専門的な宗教用語は避けた。
