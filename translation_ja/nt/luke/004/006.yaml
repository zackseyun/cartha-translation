id: LUK.4.6
reference: Luke 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ ὁ διάβολος· Σοὶ δώσω τὴν ἐξουσίαν ταύτην ἅπασαν καὶ τὴν δόξαν αὐτῶν, ὅτι ἐμοὶ παραδέδοται καὶ ᾧ ⸀ἂν θέλω δίδωμι αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/006.yaml
  text: And the devil said to him[a], “I will give you all this authority and their glory, because it has been handed over to me, and I give it to whomever I want.”
translation:
  language: ja
  text: 悪魔はイエスに言った。「このすべての権威と、それらの栄光[a]をあなたに与えよう。それは私に引き渡されており、私は私の望む者にそれを与えるからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それらの輝かしさ」「それらの壮麗さ」。ここでのギリシア語は、栄光、輝かしさ、壮麗さを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: 悪魔
  rationale: 誘惑物語に登場するサタンの人格的呼称であり、語源的な「中傷する者」ではなく、日本語で定着した「悪魔」が指示対象を明確に伝える。
- source_word: Σοὶ δώσω
  choice: あなたに与えよう
  rationale: 文頭の与格代名詞による強調を、「あなたに」を述語の前に置く自然な日本語で表した。未来の申し出として「与えよう」とした。
- source_word: τὴν ἐξουσίαν ταύτην ἅπασαν
  choice: このすべての支配権
  rationale: ἐξουσίαの統治上の権限という文脈を「支配権」で表し、ταύτην ἅπασανの包括性を「このすべての」によって保持した。
- source_word: τὴν δόξαν αὐτῶν
  choice: それらの栄華
  rationale: αὐτῶνは直前の4:5で示された諸国を指す。「栄華」はここでのδόξαが表す輝かしさ、威光、繁栄を自然に伝える。
- source_word: ἐμοὶ παραδέδοται
  choice: 私に引き渡されており
  rationale: 完了受動形が示す、過去に引き渡されて現在もその状態にあるという含意を保った。悪魔の主張の正当性までは含ませていない。
- source_word: ᾧ ἂν θέλω δίδωμι αὐτήν
  choice: 私は望む者にそれを与える
  rationale: 不定の相手を表す関係表現を「望む者に」とし、現在形の一般的・習慣的な主張を簡潔に表した。
theological_decisions:
- issue: 悪魔が諸国の支配権を持つという主張を、訳文が事実として承認するか
  choice: 悪魔自身の直接話法として、限定や評価を加えずそのまま訳す
  alternative: 「自分に引き渡されたと主張し」など、訳者による距離を示す表現を加える
  rationale: ギリシア語本文は悪魔の発言を直接提示している。語り手はその主張の真偽をここで明示的に判定していないため、訳文でも承認も否定も付加せず、神学的緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体とした。話者と受け手を明確にするため、文脈上のαὐτῷを「イエスに」と明示した。「諸国」は直前の節にあるため本文には補わず、代名詞αὐτῶνを「それらの」として照応を保った。
