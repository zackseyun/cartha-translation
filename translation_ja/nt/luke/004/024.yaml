  yaml_path: translation/nt/luke/004/024.yaml
  text: And he said[a], “Truly I tell you, no prophet is accepted in his hometown.”
translation:
  language: ja
  text: そしてイエスは言われた。「まことに、あなたがたに言います。預言者はだれも、自分の故郷では受け入れられません。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の郷里では」または「自分の国では」とも訳せる。ギリシア語の「パトリス」は、故郷の町、出身地域、祖国を指し得る。ここではナザレでの出来事が背景にある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: そしてイエスは言われた
  rationale: δέはここでは物語を穏やかにつなぐ接続語。「そして」とし、日本語では文脈上の話者を明確にするため主語「イエス」を補った。
- source_word: Ἀμὴν
  choice: まことに
  rationale: イエスの厳粛な確言を導く語。音写の「アーメン」より、現代日本語でその機能を明瞭に伝える。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 二人称複数への直接の語りかけを保ちつつ、自然な現代語にした。
- source_word: οὐδεὶς προφήτης
  choice: 預言者はだれも
  rationale: 例外のない否定を自然な日本語で表す。
- source_word: δεκτός
  choice: 受け入れられません
  rationale: 好意的に迎えられ、認められるという社会的・評価的意味を広く保つ。
- source_word: ἐν τῇ πατρίδι αὐτοῦ
  choice: 自分の故郷では
  rationale: πατρίςは故郷の町、郷里、祖国を指し得る。ナザレという直近の文脈に適合しつつ、原語の意味の幅を過度に狭めない「故郷」を採用した。
