  text: καὶ αὐτὸς ἐδίδασκεν ἐν ταῖς συναγωγαῖς αὐτῶν, δοξαζόμενος ὑπὸ πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/004/015.yaml
  text: And he was teaching in their synagogues[a], being glorified by all.
translation:
  language: ja
  text: そしてイエスは、彼らの会堂で教えており、皆から称賛を受けていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皆からあがめられていた」または「皆から栄光を与えられていた」とも訳せる。ギリシア語の語は、公に称賛され、尊ばれることを表すことがあり、「栄光」と結びつく語でもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 直前の物語を受ける単純な接続を、余分な時間的意味を加えず自然な日本語で表した。
- source_word: αὐτὸς
  choice: イエスは
  rationale: ギリシア語では明示された代名詞で、文脈上の指示対象はイエス。日本語で単に「彼は」とするより明瞭であり、過度な強調も避けられる。
- source_word: ἐδίδασκεν
  choice: 教え続け
  rationale: 未完了過去が示す継続的または反復的な活動を表す。「教えていた」も可能だが、後続の分詞と合わせて自然な一文にした。
- source_word: ἐν ταῖς συναγωγαῖς αὐτῶν
  choice: 彼らの会堂で
  rationale: 場所を示す前置詞句と所有代名詞をそのまま保った。「会堂」は当時のユダヤ人の集会・礼拝の場を指す定着した訳語。
- source_word: δοξαζόμενος
  choice: 称賛を受けていた
  rationale: この文脈では、人々がイエスを高く評価し、ほめたことを自然な現代日本語で表す。受動分詞であることも「受けていた」により保持した。
- source_word: ὑπὸ πάντων
  choice: 皆から
  rationale: ὑπόと属格による行為者を自然な日本語で示し、広範な好意的反応を表した。
theological_decisions:
- issue: イエスに対する δοξαζόμενος の訳し方
  choice: 皆から称賛を受けていた
  alternative: 皆からあがめられていた／皆から栄光を受けていた／皆からほめられていた
  rationale: δοξάζωには「栄光を帰す」「あがめる」のほか「称賛する・尊敬する」の意味がある。この場面はガリラヤでの公の好評を描くため、「称賛」が自然である。一方、ルカ文書における栄光語彙とのつながりは脚注で示し、語の神学的含みを消さないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「教え続け」と「称賛を受けていた」により、主動詞の未完了相と同時進行の受動分詞を自然に表現した。脚注標識[a]は該当する文末に置いた。
