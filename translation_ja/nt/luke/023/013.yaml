  yaml_path: translation/nt/luke/023/013.yaml
  text: But Pilate, having called together the chief priests and the rulers and the people,
translation:
  language: ja
  text: そこでピラトは、祭司長たち、指導者たち、そして民を呼び集め、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: ピラト
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: δὲ
  choice: そこで
  rationale: 直前の場面からピラトの行動へ話を移す、弱い展開・移行の働きを自然な日本語で示す。強い逆接に限定しない。
- source_word: συγκαλεσάμενος
  choice: 呼び集め
  rationale: アオリスト中動態分詞が表す、後続する発言に先立つ召集を簡潔に表現した。この節が次節へ続くため、連用形と読点で未完の統語構造を保った。
- source_word: τοὺς ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数形は複数の大祭司職保持者ではなく、指導的な祭司層を指すため、定着した訳語を採用した。
- source_word: τοὺς ἄρχοντας
  choice: 議員たち
  rationale: ここでは祭司長たちと並ぶユダヤ人社会の統治的指導者を指す。単なる一般的な「指導者たち」より公的立場を示し、日本語として自然な「議員たち」とした。
- source_word: τὸν λαὸν
  choice: 民
  rationale: λαόςの集合的な意味を保ち、「群衆」と狭く限定しない。聖書文体として定着しつつ現代日本語でも理解できる語を用いた。
