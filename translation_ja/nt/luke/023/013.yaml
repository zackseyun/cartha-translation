  source_fidelity: Πιλᾶτος δέ is appropriately rendered as a narrative transition, and 「呼び集め」 accurately represents the aorist middle participle συγκαλεσάμενος while retaining the unfinished syntax that continues into the next verse. 「祭司長たち」 and 「民」 are faithful renderings. However, ἄρχοντας denotes rulers/authorities more broadly and does not specifically identify members of a legislative council.
  naturalness: The phrasing is clear, natural modern Japanese, and the final comma appropriately signals continuation into verse 14. 「指導者たち」 is natural in this coordinated list.
  terminology: 「ピラト」「祭司長たち」「民」 follow established and intelligible Japanese biblical terminology. Replacing 「議員たち」 with 「指導者たち」 avoids adding the narrower institutional sense of legislative council members.
