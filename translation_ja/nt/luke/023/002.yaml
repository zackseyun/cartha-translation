  text: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ λέγοντες· Τοῦτον εὕραμεν διαστρέφοντα τὸ ἔθνος ⸀ἡμῶν καὶ κωλύοντα ⸂φόρους Καίσαρι⸃ διδόναι ⸀καὶ λέγοντα ⸀αὑτὸν χριστὸν βασιλέα εἶναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/002.yaml
  text: And they began to accuse him[a], saying, “We found this man misleading our nation and forbidding us to pay taxes to Caesar, and saying that he himself is Messiah[c][b], a king.”
translation:
  language: ja
  text: 彼らはイエスを訴え始め、こう言った。「私たちは、この男が私たちの民を惑わし[a]、カエサルに税[b]を納めることを禁じ、自分はメシアであり王であると言っているのを見つけました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちの民を道からそらし」「私たちの民を乱し」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ここでいう税は、カエサル、すなわちローマ皇帝に納める税または貢税を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἤρξαντο δὲ κατηγορεῖν αὐτοῦ
  choice: そこで彼らはイエスを訴え始め
  rationale: ἤρξαντοと不定詞の組み合わせが持つ開始の意味を保ち、κατηγορεῖνの法廷的な意味を「訴える」で自然に表した。日本語では指示対象を明確にするためαὐτοῦを「イエス」とした。δέは文脈を受ける「そこで」とした。
- source_word: Τοῦτον
  choice: この男は
  rationale: 指示的で非敬意的な響きを、現代日本語として自然な「この男」で表した。
- source_word: εὕραμεν
  choice: ことが分かりました
  rationale: 直訳の「見つけました」より、調査の結果として事実を把握したと主張する告発の言い回しに適した表現とした。
- source_word: διαστρέφοντα τὸ ἔθνος ἡμῶν
  choice: 私たちの民を惑わし
  rationale: διαστρέφωには、道を誤らせることから秩序を乱すことまで幅がある。「惑わす」は過度に政治的反乱へ限定せず、ἔθνοςを民族共同体としての「民」と訳した。別の含意は脚注に示した。
- source_word: κωλύοντα φόρους Καίσαρι διδόναι
  choice: 皇帝に税を納めることを禁じ
  rationale: κωλύωの禁止・妨害の力を「禁じる」で保った。Καῖσαρはここではローマ皇帝を指す称号なので、一般読者に明瞭な「皇帝」とした。
- source_word: λέγοντα αὑτὸν χριστὸν βασιλέα εἶναι
  choice: しかも自分が王であるメシアだと言っている
  rationale: αὑτόνの自己言及を「自分が」で表し、χριστόςを称号として「メシア」とした。βασιλεύςとの関係は「王であるメシア」として、政治的な告発の焦点を明瞭にしつつ両語を保持した。
theological_decisions:
- issue: 政治的告発におけるχριστόνの訳
  choice: メシア
  alternative: キリスト／油注がれた者
  rationale: ここでは固有名のような用法ではなく、王権と結びつく称号として用いられているため「メシア」とした。
- issue: χριστὸν βασιλέαの統語的関係
  choice: 王であるメシア
  alternative: メシア、すなわち王／メシアであり王である
  rationale: 二つの対格補語が同一人物の身分を述べる構造を自然な日本語にした。両称号を残し、告発がイエスの王位主張を問題にしていることを示した。
- issue: 告発内容の歴史的真偽
  choice: 告発者の発言としてそのまま提示
  alternative: 本文中で虚偽であることを示す
  rationale: この節は告発の内容を報告しており、語り手がここでその真偽を判定してはいないため、説明を本文へ加えなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法廷での告発としての改まった調子を保った。「この男」によって原文の指示的で距離を置く響きを再現した。
