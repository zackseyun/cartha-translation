revisions:
- from: そこで彼らはイエスを訴え始め、こう言った。「この男は、私たちの民を惑わし[a]、皇帝に税[b]を納めることを禁じ、しかも自分が王であるメシアだと言っていることが分かりました。」
  to: 彼らはイエスを訴え始め、こう言った。「私たちは、この男が私たちの民を惑わし[a]、カエサルに税[b]を納めることを禁じ、自分はメシアであり王であると言っているのを見つけました。」
  rationale: 「私たちは…見つけました」によりεὕραμενの一人称複数と告発としての直接性を回復した。「カエサル」を本文に保持して原文の名称を明示し、歴史的指示は脚注で補った。三つの現在分詞による告発を並列させ、「メシアであり王である」によりχριστὸν βασιλέαの二つの補語を、過度に一つの固定称号へ統合せずに訳した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:21:31Z'
review_pass:
  verdict: revise
  source_fidelity: 基本的な告発の三項目（民を惑わすこと、カエサルへの納税を禁じること、自らをメシア・王と称すること）は捉えている。しかし、εὕραμενを「ことが分かりました」とすると、告発者が「見いだした」と主張する直接的な表現が弱まる。また、固有の称号Καίσαριを単に「皇帝」とするより「カエサル」と明示するのが原文に忠実である。
  naturalness: 現行文は概ね自然だが、「この男は…ことが分かりました」は引用内で主語・構文がやや不自然である。「私たちは、この男が…と言っているのを見つけました」とすると、現代標準日本語として明瞭で、原文の告発の調子も保てる。
  terminology: χριστόνは称号として「メシア」が適切である。ただし「王であるメシア」は二つの対格補語を一つの限定句に結び付けるため、「メシアであり王である」と並列して表すほうが統語上の曖昧さを保つ。「しかも」はκαί以上の強調を加えるため削除する。
  issues:
  - severity: medium
    issue: εὕραμενの訳が「ことが分かりました」になっている。
    rationale: εὑρίσκωの一人称複数アオリストは、告発者の「私たちは見つけた」という主張である。「分かりました」は発見・把握の結果を述べる表現に変え、主語も不明瞭にする。
  - severity: medium
    issue: Καίσαριが「皇帝」と一般化されている。
    rationale: ここではローマ支配者の称号としての固有の呼称「カエサル」が用いられている。本文で名称を保持し、脚注でローマ皇帝を指すと説明するのが最も明瞭である。
  - severity: low
    issue: 「しかも」がκαίの連結以上の付加的強調を加えている。
    rationale: 原文は三つ目の告発事項を単純にκαίで接続しているため、中立的な「または」または並列構文がよい。
  - severity: low
    issue: 脚注aの「堕落させ」「扇動し」は代替訳として意味を狭めたり強めたりする。
    rationale: διαστρέφωは「道を誤らせる／曲げる」の広い意味を持つ。「堕落」は道徳的含意を、「扇動」は政治的反乱の含意を過度に前景化する。
