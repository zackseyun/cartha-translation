  text: A large crowd of people followed him, including women who were beating their breasts and mourning for him.
translation:
  language: ja
  text: 大勢の民衆がイエスの後について行っていた。その中には、胸をたたき、イエスのことを嘆き悲しんでいる女たちもいた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἠκολούθει
  choice: 後について行った
  rationale: 未完了過去が表す継続中の動作を、日本語の物語として自然な過去形で表した。「後について行く」はἀκολουθέωと与格の関係を明確に伝える。
- source_word: δὲ
  choice: 独立には訳出しない
  rationale: ここでは物語を続ける軽い接続辞であり、日本語では文脈上、接続語を置かないほうが自然である。
- source_word: αὐτῷ
  choice: イエスの後に
  rationale: 日本語の「彼」は指示対象が曖昧になりやすいため、文脈上の指示対象であるイエスを明示した。
- source_word: πολὺ πλῆθος τοῦ λαοῦ
  choice: 大勢の民衆
  rationale: ギリシア語の数量と集合性を、現代日本語で明快かつ自然に表した。
- source_word: καὶ γυναικῶν
  choice: その中には…女たちもいた
  rationale: 女性たちを同行する群衆の中に位置づけ、後続する女性複数形の関係代名詞が女たちだけを受けることを明確にした。
- source_word: ἐκόπτοντο
  choice: 胸をたたきながら
  rationale: 喪の場面におけるκόπτομαιは、悲嘆のしるしとして胸をたたく行為を指す。字義的で不自然な「自分を打つ」を避け、文化的動作を明瞭にした。
- source_word: ἐθρήνουν
  choice: 嘆き悲しむ
  rationale: 声や身ぶりを伴う深い悲嘆を表す語として、現代日本語で自然かつ重みのある表現を選んだ。
- source_word: αὐτόν
  choice: イエスのために
  rationale: 悲嘆の対象がイエスであることを自然な日本語で明示した。「イエスを嘆く」よりも意味が伝わりやすい。
