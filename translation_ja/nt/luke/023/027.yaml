  naturalness: 二文構成は明快で自然です。「行った」および連体形の「嘆き悲しむ」でも場面の意味は通じますが、三つの未完了過去が描く進行中の情景を「行っていた」「嘆き悲しんでいる」として可視化すると、現代日本語として不自然にならず、原文の叙述的な持続性をよりよく反映できます。
  terminology: 「民衆」「イエス」「女たち」「胸をたたく」「嘆き悲しむ」は、明瞭な現代標準日本語として適切です。神学用語上の問題はありません。
