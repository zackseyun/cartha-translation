  yaml_path: translation/nt/luke/023/049.yaml
  text: But all those who knew him[a], and the women who had followed him from Galilee, were standing at a distance, watching these things.
translation:
  language: ja
  text: さて、イエスの知人たちは皆[a]、またガリラヤからイエスについて来た女たちも、遠く離れて立ち、これらのことを見ていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスを知る人々は皆」。ギリシャ語の γνωστοί は、ある人の知人・知り合い、またはその人を知る人々を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: 立ち
  rationale: 過去完了形が示す、その場で立ち続けていた情景を、後続の「見ていた」と組み合わせて自然な日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の場面から、遠くで見守る人々へ視点を移す緩やかな対照を示す。
- source_word: πάντες οἱ γνωστοὶ αὐτῷ
  choice: イエスを知る人々は皆
  rationale: γνωστοί は「知人たち」とも訳せるが、親密さの程度を限定せず、与格 αὐτῷ との関係も明瞭に表す。
- source_word: μακρόθεν
  choice: 遠く離れて
  rationale: 空間的な隔たりを、現代日本語として自然かつ明確に示す。
- source_word: γυναῖκες αἱ συνακολουθοῦσαι αὐτῷ ἀπὸ τῆς Γαλιλαίας
  choice: ガリラヤからイエスについて来た女たち
  rationale: 定冠詞付き分詞句が特定する既知の女性たちと、ガリラヤ以来の同行を簡潔に表現する。
- source_word: ὁρῶσαι ταῦτα
  choice: これらのことを見ていた
  rationale: 分詞の継続的な目撃の意味と、複数形 ταῦτα を保った。
