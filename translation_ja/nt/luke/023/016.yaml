  text: παιδεύσας οὖν αὐτὸν ⸀ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/016.yaml
  text: Therefore[a], after disciplining him, I will release him.
translation:
  language: ja
  text: そこで、彼を罰したうえで[a]、釈放しよう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「懲らしめたうえで」とも訳せる。この語は矯正のための処罰を表すことがある。ここでは特にむち打ちを指すと理解されることもあるが、ギリシア語自体の意味はそれより広い。
    reason: lexical_alternative
lexical_decisions:
- source_word: παιδεύσας
  choice: 罰したうえで
  rationale: アオリスト分詞を先行する行為として表した。παιδεύωには教育する、懲らしめる、罰するという意味の幅があるが、ピラトの裁判上の発言という文脈では処罰の意味が適切である。具体的に「むち打つ」とまでは限定しない。
- source_word: οὖν
  choice: そこで
  rationale: 前の発言を受けた推論・帰結を示しつつ、現代日本語の発話として自然に接続する。
- source_word: αὐτόν
  choice: 彼を
  rationale: イエスを指す対格代名詞を明示した。
- source_word: ἀπολύσω
  choice: 釈放しよう
  rationale: 拘束・裁判の文脈における法的な解放を自然な日本語で表し、一人称未来形の意志的な響きを「しよう」で示した。
theological_decisions:
- issue: ピラトの提案における παιδεύω の範囲
  choice: 司法的・処罰的な意味で「罰したうえで」と訳す。
  alternative: 「懲らしめたうえで」または、文脈から具体化して「むち打ったうえで」
  rationale: 裁判の文脈では教育より処罰が意図されている。一方、原語そのものは処罰方法をむち打ちに限定しないため、その具体化を本文には持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。ピラトの公的な発言にふさわしい簡潔さと一定の格調を保ち、「釈放しよう」によって決定・意向を自然に表した。
