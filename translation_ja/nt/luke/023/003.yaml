  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸀ἠρώτησεν αὐτὸν λέγων· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/003.yaml
  text: Then Pilate asked him[a], saying, “Are you the king of the Jews?” And answering him, he said[b], “You say so.”
translation:
  language: ja
  text: そこでピラトはイエスに尋ねた。「あなたはユダヤ人[a]の王なのか。」イエスは答えた。「あなたがそう言っている。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ユダヤの人々」。ギリシア語は文脈により「ユダヤ人」または「ユダヤの人々」を指し得る。この箇所では「ユダヤ人の王」が定着した称号である。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「あなたが言っている」。この簡潔な返答は、「そのとおりだ」という限定的な肯定とも、問いの表現をピラト自身に帰する言い方とも受け取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 強い対比ではなく、物語を次へ進める緩やかな接続を自然な現代日本語で表す。
- source_word: ἠρώτησεν αὐτόν
  choice: イエスに尋ねた
  rationale: ἐρωτάωの直接的な問いかけを「尋ねた」とし、代名詞の指示対象は日本語で明瞭になるよう「イエス」とした。
- source_word: Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
  choice: あなたはユダヤ人の王なのか。
  rationale: 文脈上の疑問文を自然に表し、βασιλεύςの王権的意味を「王」で保持する。Ἰουδαῖοιは受難物語における慣用的な称号に即して「ユダヤ人」とした。
- source_word: ἀποκριθεὶς αὐτῷ ἔφη
  choice: イエスは答えた
  rationale: ギリシア語の応答を示す分詞と発話動詞の重なりを、日本語では簡潔かつ自然に表す。
- source_word: Σὺ λέγεις
  choice: あなたがそう言っている
  rationale: 簡潔で間接的な応答を、単純な「はい」に強めず、また否定にも弱めずに保持する。主語Σύの明示による含みも「あなたが」で表した。
theological_decisions:
- issue: イエスの応答 Σὺ λέγεις の効力
  choice: 「あなたがそう言っている」
  alternative: 「そのとおりだ」または「あなたがそう言うのだ」
  rationale: 原文は端的で、限定を伴う肯定とも、ピラトの言い方に帰する応答とも理解し得る。明白な肯定や否認へ決め切らず、修辞的・神学的緊張を残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。発話導入のλέγωνや「答えて言った」という重複は、日本語として不自然にならないよう簡潔にした。「ユダヤ人の王」は政治的・宗教的称号として定着した自然な表現であり、この文脈では「ユダヤ地方の人々の王」とする必要性が低いため、語義上の別案を注記していない。
