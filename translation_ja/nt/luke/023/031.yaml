id: LUK.23.31
reference: Luke 23:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι εἰ ἐν ⸀τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/031.yaml
  text: For if they do these things when the wood is green[b][a], what will happen when it is dry?
translation:
  language: ja
  text: なぜなら、生木[a][b]の場合にこのようなことをするのなら、乾いた木の場合には何が起こるだろうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「湿った木に……乾いた木に」。ここでは、水分を含む木を自然な日本語で「生木」とした。
    reason: lexical_alternative
  - marker: b
    text: この比喩は、燃えにくい生木にこのようなことが行われるなら、燃えやすい乾いた木にはなおさら何が起こるのか、という小から大への対照を示すと考えられる。ただし、それぞれが具体的に誰または何を指すかは明示されていない。
    reason: cultural_note
lexical_decisions:
- source_word: ὅτι
  choice: なぜなら
  rationale: 前節の嘆きと警告の理由を導く接続詞として、因果関係を明確に保つ。
- source_word: ἐν τῷ ὑγρῷ ξύλῳ
  choice: 生木に対して
  rationale: ἐν はここでは対象・場合を示すと理解し、ὑγρόςとξηρόςの対照を、日本語で木の含水状態を自然に表す「生木」と「乾いた木」によって保持した。
- source_word: ὑγρῷ
  choice: 生
  rationale: 基本的には「湿った、みずみずしい」の意。木について、乾いておらず燃えにくい状態を表す自然な日本語として「生木」を採用した。
- source_word: ξύλῳ
  choice: 木
  rationale: 「木、木材、樹木」を表し得るが、ここでは生木と乾いた木の対照が中心なので、解釈を狭めない「木」とした。
- source_word: ταῦτα
  choice: このようなこと
  rationale: 複数形の指示内容を一つの出来事に限定せず、現在行われている一連の行為を広く指せる表現とした。
- source_word: ποιοῦσιν
  choice: する
  rationale: ギリシア語では主語が明示されていないため、日本語でも不特定の主語を補わず、その開かれた指示を保った。
- source_word: ἐν τῷ ξηρῷ
  choice: 乾いた木には
  rationale: 先行するξύλῳを補って訳し、生木との対照を明瞭にした。「枯れ木」ではなく「乾いた木」とすることで、ξηρόςの直接的な意味を保った。
- source_word: τί γένηται
  choice: 何が起こるだろうか
  rationale: 修辞疑問として予想される成り行きを問う力を、現代日本語で自然に表した。
theological_decisions:
- issue: 生木と乾いた木の比喩の指示対象
  choice: 比喩を本文にそのまま残し、指示対象を特定しない。
  alternative: 生木をイエス、乾いた木をエルサレムまたはその民と明示する、あるいは小から大への裁きの格言として説明的に訳す。
  rationale: この言葉は、現在イエスに行われていることから、さらに重大な将来の事態へ目を向けさせると考えられるが、生木と乾いた木が厳密に何を指すかは本文だけでは確定しないため、神学的緊張と曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「なぜなら」で前節との因果関係を示し、修辞疑問は「何が起こるだろうか」とした。比喩は説明に置き換えず、本文中に保持した。
