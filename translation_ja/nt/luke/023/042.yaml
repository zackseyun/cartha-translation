source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν· Ἰησοῦ, μνήσθητί ⸀μου ὅταν ἔλθῃς ⸂ἐν τῇ βασιλείᾳ⸃ σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/042.yaml
  text: And he said[a], “Jesus, remember me when you come in your kingdom.”
translation:
  language: ja
  text: そして彼は言った。「イエスよ、あなたが御国に[a]おいでになる時、私を覚えていてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたが御国へおいでになる時」。一部の写本は、より明確に「御国へ」と読むが、SBLGNT本文は「御国に」と読む。
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 物語をつなぐ通常の接続詞として、解釈を加えず自然に訳した。
- source_word: ἔλεγεν
  choice: 彼は言った
  rationale: 未完了過去形だが、ここでは発話を導入する物語上の慣用として自然な単純過去で表した。
- source_word: Ἰησοῦ
  choice: イエスよ
  rationale: 呼格であることを、現代日本語の自然な呼びかけで示した。
- source_word: μνήσθητί μου
  choice: 私を覚えていてください
  rationale: 依頼を表す命令形を丁寧な願いとして訳した。「覚える」には顧みて行動する含みもあり得るが、本文では明示しすぎない。
- source_word: ὅταν ἔλθῃς
  choice: おいでになる時
  rationale: 未来の到来を表す節。イエスへの直接の呼びかけにふさわしい敬意を保ちつつ、方向を過度に限定しない表現とした。
- source_word: ἐν τῇ βασιλείᾳ σου
  choice: あなたが御国においでになる
  rationale: SBLGNTのἐνを踏まえ、「御国のうちに／御国を伴って来る」という余地を残すため、「御国においでになる」と自然に表した。異読εἰςを前提とする「御国へ入る」とはしなかった。
- source_word: βασιλείᾳ
  choice: 御国
  rationale: 神聖な文脈で王国・王的支配の双方を想起できる、定着した自然な訳語を用いた。
theological_decisions:
- issue: イエスの御国への到来に関する終末論的含意
  choice: 将来、イエスが御国においでになる時に自分を覚えてほしいとの願いとして訳す。
  alternative: イエスが王として支配を携えて来る時、または完成した御国に入る時と明示する。
  rationale: 本文はイエスの将来の王権を前提とするが、その時期や到来の様態を詳しく定めてはいないため、曖昧さを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語。十字架上の切迫した願いに合う簡潔さを保ち、「イエスよ」「御国」「覚えていてください」によって尊厳と自然さを両立させた。
