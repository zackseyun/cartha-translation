  text: τότε ἄρξονται λέγειν τοῖς ὄρεσιν· Πέσετε ἐφ’ ἡμᾶς, καὶ τοῖς βουνοῖς· Καλύψατε ἡμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/030.yaml
  text: Then they will begin to say to the mountains[a], ‘Fall on us,’ and to the hills[b], ‘Cover us.’
translation:
  language: ja
  text: そのとき、人々は山々に[a]「私たちの上に落ちてくれ」と、丘々に[b]「私たちを覆ってくれ」と言い始める。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この表現は、預言的な裁きの言葉、とくにホセア10:8を思い起こさせる。
    reason: cross_reference
  - marker: b
    text: 直訳は「私たちを覆ってくれ」。ここでは、迫る裁きから身を隠すという意味合いを含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 直前の文脈を受けて、これから起こることの時を示す自然な表現。
- source_word: ἄρξονται λέγειν
  choice: 言い始める
  rationale: 未来形の開始相を保ち、単に「言う」とはしない。日本語では文末の非過去形で予告の未来を自然に表す。
- source_word: τοῖς ὄρεσιν
  choice: 山々に
  rationale: 後続の βουνοῖς「丘々」との語彙的な対比を保つ。
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: 私たちの上に崩れ落ちてくれ
  rationale: 命令形の切迫した願いを現代日本語で表す。「崩れ落ちる」は、山が人々の上へ落ちるという具体的な像を自然に伝える。
- source_word: τοῖς βουνοῖς
  choice: 丘々には
  rationale: ὄρεσιν「山々」と区別し、βουνός の比較的小さな高まりを表す。助詞「は」で並行する二つの呼びかけを明瞭にする。
- source_word: Καλύψατε ἡμᾶς
  choice: 私たちを覆い隠してくれ
  rationale: καλύπτω の基本義「覆う」と、文脈上の「隠す」の含意を一つの自然な日本語表現で保つ。
theological_decisions:
- issue: 預言的な裁きの言葉との間テクスト性
  choice: 山と丘への具体的な叫びを本文にそのまま残す。
  alternative: 「迫る裁きから隠してくれ」などと意味を説明して訳す。
  rationale: ホセア10:8を響かせる具体的な比喩と裁きの緊張を保ち、本文中で解釈を付け加えない。
translation_notes:
  register: 明瞭で現代的ながら、切迫した預言的調子を保った。「〜てくれ」により、命令形がここでは絶望的な嘆願であることを自然に示す。
