revisions:
- from: その時、人々は山々に[a]、『私たちの上に崩れ落ちてくれ』と言い、丘々には[b]、『私たちを覆い隠してくれ』と言い始める。
  to: そのとき、人々は山々に[a]「私たちの上に落ちてくれ」と、丘々に[b]「私たちを覆ってくれ」と言い始める。
  rationale: 本文では命令形の嘆願的な調子を「〜てくれ」で保ちつつ、Πέσετε を「落ちてくれ」、καλύψατε を「覆ってくれ」と直接訳しました。これにより、崩壊や隠蔽を本文で付加・強調せず、文脈上の含意は脚注で示しています。二つの呼びかけを一つの「と言い始める」に結び、未来の開始相が双方に及ぶことも明確にしました。
  reviewer_model: gpt-5.6-terra
