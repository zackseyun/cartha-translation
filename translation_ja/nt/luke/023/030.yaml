review_pass:
  verdict: revise
  source_fidelity: 「言い始める」は ἄρξονται λέγειν の開始相を適切に保ち、「山々／丘々」の区別も原文に忠実です。ただし「崩れ落ちてくれ」は Πέσετε（「落ちよ」）に「崩れる」という限定的な様態を加え、「覆い隠してくれ」は καλύψατε の「覆え」に「隠す」を本文で重ねています。いずれも注で扱える含意なので、本文はより直接的に訳すのが安全です。
  naturalness: 現代標準語として自然です。「山々に……、丘々に……と言い始める」と一つの「言い始める」にまとめると、ギリシア語の並行した二つの呼びかけと、その双方に及ぶ開始相が明瞭になります。
  terminology: 「山々」「丘々」は ὄρη と βουνοί の対照を保っています。「覆ってくれ」は καλύπτω の基本義を保ち、隠れるという文脈上の含意は脚注で示します。ホセアへの脚注は「預言者が語った」という不必要に限定的な表現を避け、預言的裁きの表現として記述します。
  issues:
  - severity: medium
    issue: 「崩れ落ちてくれ」が原文以上の様態を加えている。
    rationale: Πέσετε は「落ちよ」であり、山が崩壊することを語彙上明示してはいません。「落ちてくれ」とすることで具体的イメージを保ちつつ追加を避けられます。
  - severity: medium
    issue: 「覆い隠してくれ」が本文で二つの語義を併記している。
    rationale: καλύπτω の直接的な表現は「覆う」です。隠蔽の含意は文脈的であり、脚注に置くことで本文の語義を過度に確定しません。
  - severity: low
    issue: 二つの引用に対する「言い始める」の係り方がやや不均衡である。
    rationale: 現行文は最初の引用には「と言い」、二つ目だけには「と言い始める」と読めます。両方を並列して一つの「と言い始める」に係らせると原文の構文をよく反映します。
  revised_text: そのとき、人々は山々に[a]「私たちの上に落ちてくれ」と、丘々に[b]「私たちを覆ってくれ」と言い始める。
