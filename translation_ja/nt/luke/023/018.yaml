id: LUK.23.18
reference: Luke 23:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ἀνέκραγον δὲ παμπληθεὶ λέγοντες· Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν ⸀τὸν Βαραββᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/018.yaml
  text: But they all cried out together[a], saying, “Take this man away, and release Barabbas to us!”
translation:
  language: ja
  text: しかし、人々はこぞって叫んだ。「この男を取り除け。私たちにはバラバを釈放しろ！」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀνέκραγον
  choice: 叫んだ
  rationale: 大声で声を上げることを表す動詞。日本語では簡潔な「叫んだ」が強さと自然さを保つ。
- source_word: δὲ
  choice: しかし
  rationale: 直前のピラトの発言に対する群衆の反対を示すため、逆接として訳した。
- source_word: παμπληθεὶ
  choice: こぞって
  rationale: 群衆全体が一斉に行動したという集合性を、自然で簡潔な現代日本語で表す。必ずしも完全な意見の一致まで過度に断定しない。
- source_word: λέγοντες
  choice: （直接話法で表現）
  rationale: 叫びの内容を導く分詞であり、日本語では引用を直結させる方が自然なため、独立した「言って」は置かない。
- source_word: Αἶρε
  choice: 取り除け
  rationale: 命令形はその場から排除する要求を表す。文脈上は処刑を含意し得るが、語そのものが処刑方法を明示しないため「殺せ」とはしない。
- source_word: τοῦτον
  choice: この男
  rationale: イエスを指す男性単数の指示代名詞。指示性と突き放した調子を保つ。
- source_word: ἀπόλυσον
  choice: 釈放しろ
  rationale: 拘束・裁判の文脈に合う法的な解放を表す。群衆の強い命令口調を保つため「しろ」とした。
- source_word: ἡμῖν
  choice: 私たちには
  rationale: 要求の受益者を示す与格。「この男」とバラバの対比が自然に伝わるよう係助詞「は」を用いた。
- source_word: τὸν Βαραββᾶν
  choice: バラバ
  rationale: 人名を日本語の標準的な聖書表記で音写した。
theological_decisions:
- issue: Αἶρε が要求する排除の範囲
  choice: 「取り除け」とし、直接にはその場からの排除を表す
  alternative: 「殺せ」または「処刑しろ」
  rationale: 受難物語の文脈では死刑要求へ向かうが、この命令語自体は処刑を明示しない。原文の含みと緊張を残した。
translation_notes:
  register: 明快で現代的ながら、裁判場面にふさわしい緊迫感と品位を保った。群衆の二つの命令は強い常体で統一した。
