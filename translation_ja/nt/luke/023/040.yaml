  text: ἀποκριθεὶς δὲ ὁ ἕτερος ⸂ἐπιτιμῶν αὐτῷ ἔφη⸃· Οὐδὲ φοβῇ σὺ τὸν θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/040.yaml
  text: But the other answered[a], rebuking him, “Do you not even fear God, since you are under the same sentence?”
translation:
  language: ja
  text: しかし、もう一人は答え、彼をたしなめて言った。「おまえは同じ刑を受けているのに、神を恐れもしないのか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同じ判決のもとにいるのに」または「同じ裁きを受けているのに」とも訳せる。ギリシア語の「クリマ」は、裁き、判決、刑を意味し得る。ここでは、二人に共通する刑罰的な判決・帰結を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ ἕτερος
  choice: しかし、もう一人は……言った
  rationale: δέの対照を「しかし」で示し、ἀποκριθείςは日本語では重複的な「答えて言った」を避け、応答であることが文脈から明らかな自然な叙述にまとめた。
- source_word: ἐπιτιμῶν αὐτῷ
  choice: 彼をたしなめて
  rationale: ἐπιτιμάωの非難・叱責の力を保ちつつ、同じ処刑を受ける者同士の発話として、明瞭で自然な現代日本語を選んだ。
- source_word: Οὐδὲ φοβῇ σὺ τὸν θεόν
  choice: おまえは……神を恐れもしないのか
  rationale: οὐδέの強調を「〜もしない」で表し、明示されたσὺは「おまえ」で対人的な強調を保った。「神を恐れる」という聖書的表現は解釈的に弱めず保持した。
- source_word: ὅτι ἐν τῷ αὐτῷ κρίματι εἶ
  choice: 同じ刑を受けているのに
  rationale: ὅτιはここでは非難の根拠を示し、日本語の修辞疑問に自然な逆接的理由「〜のに」で表した。κρίμαは文脈上、彼らが共に置かれた刑罰的判決を指すため「刑」とした。
theological_decisions:
- issue: 「神を恐れる」の意味
  choice: 神を恐れもしないのか
  alternative: 神を畏れ敬いもしないのか／神への敬意もないのか
  rationale: φοβέομαιの直接的な語感と、神への畏敬および神の前での責任を含む聖書的緊張を保ち、説明的な言い換えを本文に持ち込まなかった。
- issue: κρίμαの刑罰的・司法的含意
  choice: 同じ刑を受けている
  alternative: 同じ有罪判決の下にいる／同じ裁きを受けている
  rationale: 十字架刑の場面では共有された刑罰的帰結が前景化しているため「刑」が自然で明瞭。ただし語自体には判決・裁きの幅があるので脚注で示した。
translation_notes:
  register: 明瞭で現代的ながら、受難記事にふさわしい落ち着いた文体とした。「おまえ」は明示的なσὺと厳しい叱責を自然に伝える。脚注記号は対象となる文末に置いた。
