id: LUK.23.26
reference: Luke 23:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι ⸂Σίμωνά τινα Κυρηναῖον ἐρχόμενον⸃ ἀπ’ ἀγροῦ ἐπέθηκαν αὐτῷ τὸν σταυρὸν φέρειν ὄπισθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/026.yaml
  text: And as they led him away[a], they seized a certain Simon of Cyrene, coming in from the countryside[b], and laid the cross on him to carry behind Jesus.
translation:
  language: ja
  text: 彼らがイエスを連行して行く途中、田園から来た[a]キレネ出身のあるシモンをつかまえ、十字架[b]を彼に負わせて、イエスの後ろから担わせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「畑から来た」とも訳せる。ギリシア語は、特定の畑を指す場合も、町の外の田園地帯を広く指す場合もある。
    reason: lexical_alternative
  - marker: b
    text: ここで「十字架」は、より具体的には「十字架の横木」を指すと理解する人もいる。ただし、ギリシア語本文は単に「十字架」としている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγαγον
  choice: 連行していく
  rationale: 拘束下でイエスを引いて行く場面なので、単なる移動ではなく、現代日本語で強制性を自然に示す「連行する」とした。
- source_word: ἐπιλαβόμενοι
  choice: 捕らえ
  rationale: 人を物理的につかまえる強制的な動作を、文脈に即して簡潔に表す。
- source_word: Σίμωνά τινα Κυρηναῖον
  choice: キレネ人シモンという人
  rationale: τιναによる未紹介の人物の導入を「という人」で自然に表し、Κυρηναῖονの出身地との関係も保持した。
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: 田園から来た
  rationale: ἀγρόςは特定の畑にも市外の田園地帯にもなり得るため、本文では広い意味を選び、限定しすぎないよう注を付した。
- source_word: ἐπέθηκαν αὐτῷ τὸν σταυρὸν
  choice: 十字架を彼に背負わせて
  rationale: 十字架がシモンに負わされたという強制的かつ身体的な動作を、自然な日本語で示す。
- source_word: τὸν σταυρὸν
  choice: 十字架
  rationale: ギリシア語はより限定的な「横木」ではなくσταυρόςと言っているため、歴史的再構成を本文に持ち込まず直接的に訳した。
- source_word: φέρειν
  choice: 運ばせた
  rationale: 物理的に担いで運ぶ意味を明確にし、使役構文によって命じられた行為であることを示した。
- source_word: ὄπισθεν τοῦ Ἰησοῦ
  choice: イエスの後ろを
  rationale: ὄπισθενの空間的な意味を保ち、比喩的な弟子道などに解釈を限定しない。
theological_decisions:
- issue: 受難記事のσταυρόςを「横木」と特定するか
  choice: 十字架
  alternative: 十字架の横木
  rationale: 原文は部材を特定する語ではなくσταυρόςを用いている。本文では素直な語義を採り、より具体的な歴史的推定は脚注にとどめた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、受難記事にふさわしい簡潔で重みのある調子とした。「シモンという人」はτιναの導入機能を自然に表し、「後ろを」は原文の空間的関係を保っている。
