  text: καὶ εἶπεν ⸀αὐτῷ· Ἀμήν ⸂σοι λέγω⸃ σήμερον μετ’ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/043.yaml
  text: And he said to him[a], “Truly I tell you, today you will be with me in paradise.”
translation:
  language: ja
  text: イエスは彼に言われた。[a]「まことに、あなたに言います。今日、あなたはわたしとともに楽園にいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳（可能性は低い）：「まことに、今日あなたに言います。あなたはわたしとともに楽園にいます。」古代のギリシア語本文には現代のような句読点がなかったため、この読みでは「今日」を「言います」にかける。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀμήν
  choice: まことに
  rationale: イエスが権威ある宣言を導入する厳粛な肯定表現。現代日本語で自然かつ荘重であり、単なる音写より機能を明確に伝える。
- source_word: σοι λέγω
  choice: あなたに言います
  rationale: ギリシア語の語順と意味を保ちつつ、現代標準日本語として明瞭な談話表現。
- source_word: σήμερον
  choice: 今日
  rationale: 本文では後続の「います」にかかり、その日のうちに楽園でともにいるとの約束を表すと解した。句読法に依存する別解は脚注に残した。
- source_word: μετ’ ἐμοῦ
  choice: わたしとともに
  rationale: ' προσωπ的な同伴・交わりを明確に保ち、「わたしと一緒に」よりやや荘重な本文の文体に合わせた。'
- source_word: ἔσῃ
  choice: います
  rationale: 未来の意味は「今日」という時の指定と文脈によって明白であり、日本語では「いるでしょう」より確実な約束の力を自然に表す。
- source_word: παραδείσῳ
  choice: 楽園
  rationale: 終末論的文脈における παράδεισος の定着した訳語であり、原文が述べる以上の場所や状態の詳細を付け加えない。
theological_decisions:
- issue: 句読法によって解釈が分かれる σήμερον（「今日」）の係り先と、中間状態に関わる含意
  choice: 「今日」を「わたしとともに楽園にいます」にかける
  alternative: 「今日」を「あなたに言います」にかけ、「まことに、今日あなたに言います。あなたはわたしとともに楽園にいます」と読む
  rationale: 古代ギリシア語本文には現代的な句読点がなく、句読法自体が解釈を伴う。しかし、語順、コイネー・ギリシア語の自然な用法、発言の流れからは、「今日」が実現時を示す読みがより自然である。神学的影響を持つ別解を排除せず脚注に明記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛で権威ある宣言にふさわしい格調を保った。「彼」は直前の犯罪人を指し、「イエス」を補って話者を自然に明示した。脚注記号 [a] は該当する発言導入部に置いた。
