id: LUK.23.53
reference: Luke 23:53
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀καθελὼν ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν ⸀αὐτὸν ἐν μνήματι λαξευτῷ οὗ οὐκ ἦν ⸂οὐδεὶς οὔπω⸃ κείμενος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/053.yaml
  text: And after taking him down[a], he wrapped him in a linen cloth and placed him in a tomb cut in stone[b], where no one had yet been laid.
translation:
  language: ja
  text: そして、イエスを降ろし、亜麻布で包んで、岩をくりぬいた墓[a]に納めた。そこには、まだだれも葬られていなかった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「岩を削って造った墓」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「そこには、まだだれも横たわっていなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθελὼν
  choice: 十字架から降ろし
  rationale: καθαιρέωのアオリスト分詞。文脈上、イエスの遺体を十字架から取り降ろすことを指す。日本語では動作の順序を自然に示すため連用形とし、「十字架から」は文脈上明白な補足として示した。
- source_word: ἐνετύλιξεν
  choice: 包んで
  rationale: ἐντυλίσσωは布で包むことを表す。埋葬方法について本文以上の細部を加えず、現代日本語として自然な語を選んだ。
- source_word: σινδόνι
  choice: 亜麻布で
  rationale: σινδώνは亜麻製の布を指し、与格は手段を表す。「布」だけでなく素材を保持しつつ、「経帷子」など解釈性や古風さの強い語を避けた。
- source_word: ἔθηκεν
  choice: 納めた
  rationale: τίθημιはここでは遺体を墓に置くこと。「置いた」より埋葬文脈にふさわしく品位のある自然な表現であり、正式な葬送儀礼などは含意しない。
- source_word: μνήματι
  choice: 墓に
  rationale: μνῆμαは埋葬場所・墓を意味する。簡潔で一般読者に明瞭な「墓」を採用した。
- source_word: λαξευτῷ
  choice: 岩を掘って造った
  rationale: λαξευτόςは石や岩を削って造られたことを表す。日本語で墓の構造が明瞭に伝わるよう表現した。
- source_word: οὗ
  choice: そこには
  rationale: 墓を受ける関係副詞。日本語では文を分け、「そこには」とすることで自然に関係を示した。
- source_word: οὐδεὶς οὔπω κείμενος
  choice: まだだれも葬られたことがなかった
  rationale: 直訳的には「まだだれも横たえられていなかった／横たわっていなかった」。埋葬文脈で墓が未使用だったことを明瞭にしつつ、οὔπωの「まだ」を保持した。
theological_decisions:
- issue: 墓の種類と未使用であったこと
  choice: イエスは岩を掘って造った墓に納められ、その墓にはまだだれも葬られたことがなかった。
  alternative: イエスは石を切り出して造った墓に置かれ、そこにはまだだれも横たわったことがなかった。
  rationale: 歴史的な埋葬描写をそのまま伝え、並行記事から所有者、場所、形状などの情報を補わない。「葬られた」は文脈に即した自然な表現だが、別の遺体がかつて置かれた可能性を否定する原文の趣旨も保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イエス」はギリシア語の代名詞αὐτόνの指示対象を日本語で明確にするため補った。「納めた」は埋葬文脈に自然だが、儀礼的な意味を過度に加えない。すべての脚注記号を本文に配置した。
