  text: Καὶ ἰδοὺ ἀνὴρ ὀνόματι Ἰωσὴφ βουλευτὴς ὑπάρχων, ⸀ἀνὴρ ἀγαθὸς καὶ δίκαιος—
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/050.yaml
  text: And behold[a], a man named Joseph, who was a council member, a good and righteous man—
translation:
  language: ja
  text: すると、見よ、ヨセフという名の人がいた。彼は評議会の一員で、善良で正しい人であった—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: すると見よ
  rationale: 物語の展開を示す καί と注意を促す ἰδού の力を残しつつ、現代日本語で明瞭な表現とした。
- source_word: ἀνὴρ
  choice: 人
  rationale: ここでは成人男性ヨセフを指すが、日本語では固有名と文脈によって性別が明らかなため、自然な「人」とした。
- source_word: ὀνόματι Ἰωσὴφ
  choice: ヨセフという名の
  rationale: 名前を導入する与格表現を、自然で格調ある日本語にした。
- source_word: βουλευτὴς ὑπάρχων
  choice: 彼は議員で
  rationale: βουλευτής を統治評議会の構成員という意味で「議員」とし、分詞 ὑπάρχων は日本語の連用的な接続で表した。具体的に「最高法院」と断定せず、原文の表現範囲を保った。
- source_word: ἀνὴρ ἀγαθὸς καὶ δίκαιος
  choice: 善良で正しい人
  rationale: 反復された ἀνήρ を「人」として明示し、ἀγαθός は人格の善良さ、δίκαιος は倫理的・宗教的な正しさを表す語として訳した。
theological_decisions:
- issue: 人物描写における δίκαιος の訳語
  choice: 正しい
  alternative: 義にかなった／公正な
  rationale: δίκαιος は倫理的な正しさと神の前での正しさの双方を含み得る。「正しい」はその幅を保ち、法廷的意味だけに限定せず、専門的な教義用語にも狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」でルカの注意喚起を保持した。原文が次節へ続くため、末尾のダッシュも残した。
