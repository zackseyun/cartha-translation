source:
  edition: SBLGNT
  text: ⸀καὶ Πιλᾶτος ἐπέκρινεν γενέσθαι τὸ αἴτημα αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/024.yaml
  text: And Pilate decided that their demand should be granted[a].
translation:
  language: ja
  text: ピラトは、彼らの要求が実現されるようにと裁定した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ピラトは、彼らの願いが実現するようにと判決を下した。」
    reason: 「ἐπέκρινεν γενέσθαι」の司法的な裁定と、「要求された事態が起こる」という構文上の意味を示すため。
lexical_decisions:
- source_word: καὶ
  choice: そこで
  rationale: 直前まで続く群衆の要求を受けてピラトが判断を下したという物語上のつながりを、自然な現代日本語で示す。明示的な時間情報は加えていない。
- source_word: Πιλᾶτος
  choice: ピラト
  rationale: 日本語聖書で広く定着している固有名の表記を用いた。
- source_word: ἐπέκρινεν
  choice: 判決を下した
  rationale: この語が表す司法的な決定の含みを明確に保つ。「決めた」より法的性格が伝わり、「刑を宣告した」のように刑罰の宣告へ意味を狭めない。
- source_word: γενέσθαι
  choice: どおりにする
  rationale: 補語的不定詞として、要求された事柄が実現されるよう裁定したことを、日本語として自然に表す。
- source_word: τὸ αἴτημα αὐτῶν
  choice: 彼らの要求
  rationale: αἴτημαは「願い、求め、要求」を意味する。文脈では人々が強く迫っているため「要求」が適切であり、αὐτῶνの所有関係も「彼らの」で明示した。
theological_decisions:
- issue: ピラトの行為の司法的ニュアンス
  choice: 彼らの要求どおりにするとの判決を下した
  alternative: 彼らの願いを実行することに決めた
  rationale: ピラトが単に私的な決断をしたのではなく、公的・司法的な裁定を下したという原文の含みを保つ一方、誰が具体的に要求を実行するかは補わない。
translation_notes:
  register: 明瞭で現代的ながら、裁判場面にふさわしい品位と司法的な語感を保った。「要求どおりにする」は自然な日本語を優先した最適等価の訳であり、脚注により原文の構文に近い別訳を示した。
