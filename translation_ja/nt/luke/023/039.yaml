  text: Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν ⸀λέγων· ⸀Οὐχὶ σὺ εἶ ὁ χριστός; σῶσον σεαυτὸν καὶ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/039.yaml
  text: One of the criminals who were hanging there was reviling him[a], saying, “Are you not the Messiah? Save yourself and us.”
translation:
  language: ja
  text: 掛けられていた犯罪人の一人が、イエスをののしって言った。「あなたはメシア[a]ではないか。自分と私たちを救え。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語は「ホ・クリストス」。
    reason: alternative_reading
lexical_decisions:
- source_word: Εἷς δὲ
  choice: 一人が
  rationale: δέの軽い展開・対照は日本語の自然な文脈に委ね、不要な接続語を加えない。
- source_word: τῶν κρεμασθέντων κακούργων
  choice: 十字架に掛けられていた犯罪人の
  rationale: κρεμασθέντωνは字義的には「掛けられていた」だが、直前の受難場面を踏まえ、「十字架に」を補って自然かつ明確にした。κακούργωνは現代語として「犯罪人」とした。
- source_word: ἐβλασφήμει αὐτόν
  choice: イエスをののしって
  rationale: ここでは対象への侮辱的発言を表すため、宗教的専門語に限定されやすい「冒瀆する」より「ののしる」が文脈に合う。未完了過去の継続性は「ののしって言った」という場面描写で自然に示す。αὐτόνの指示対象は日本語で明確にするため「イエス」とした。
- source_word: λέγων
  choice: 言った
  rationale: 付帯状況を表す分詞を、日本語の自然な発話導入として訳した。
- source_word: Οὐχὶ σὺ εἶ ὁ χριστός;
  choice: おまえはメシアではないか。
  rationale: οὐχίが肯定を予期する反語的・挑発的な問いであることを「ではないか」で保った。「おまえ」は侮蔑的な発話場面を反映する。
- source_word: σῶσον σεαυτὸν καὶ ἡμᾶς
  choice: 自分と俺たちを救ってみろ。
  rationale: 命令の嘲弄的な響きを「救ってみろ」で示し、「俺たち」は犯罪人の粗野で自己本位な発話に合う。σῴζωの救済語彙とのつながりを保つため「救う」とした。
theological_decisions:
- issue: ὁ χριστόςの称号としての訳
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法ではなく、油注がれた者というユダヤ的称号を指すため「メシア」とした。神学的な含意を狭めず、嘲弄の対象となっている称号性を保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、地の文は端正に、犯罪人の発話は侮蔑と挑発が伝わる口調にした。脚注記号は対応語「メシア」の直後ではなく引用文末に置いたが、脚注内容は同語の異訳を示す。
