  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπεν· Πάτερ, εἰς χεῖράς σου ⸀παρατίθεμαι τὸ πνεῦμά μου. ⸂τοῦτο δὲ⸃ εἰπὼν ἐξέπνευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/046.yaml
  text: And Jesus[a], crying out with a loud voice, said, “Father, into your hands I commit my spirit.” Having said this[c][b], he breathed his last.
translation:
  language: ja
  text: イエスは大声で叫んで言われた。「父よ、わたしの霊をあなたの御手に委ねます。」[a][b] こう言って、息を引き取られた。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「委ねます」は、「お預けします」とも訳せる。原語には、何かを他者の保護や管理に託す意味がある。
    reason: lexical_alternative
  - marker: b
    text: この言葉は、詩篇31:6（七十人訳では詩篇30:6）にある「わたしの霊を御手に委ねます」という言葉を響かせている。
    reason: cross_reference
  - marker: c
    text: 「息絶えられた」、または単に「亡くなられた」とも訳せる。原語は字義的には息を吐き出すことに関係する。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας φωνῇ μεγάλῃ
  choice: 大声で叫んで
  rationale: 同語根を重ねたギリシア語の強調を、自然な現代日本語で、声の大きさと力強い発声の両方が伝わるように表した。
- source_word: Πάτερ
  choice: 父よ
  rationale: 所有代名詞を補わず、呼格による直接の呼びかけを簡潔かつ荘重に表した。
- source_word: εἰς χεῖράς σου
  choice: あなたの御手に
  rationale: 複数形の「手」が表す保護・委託の慣用的意味を保ちつつ、神への祈りにふさわしい自然で敬意ある日本語とした。方向を示す εἰς は日本語の「に」で表した。
- source_word: παρατίθεμαι
  choice: 委ねます
  rationale: 他者の保護・管理に託すという現在中動態の意味を自然に表し、意志的な自己委託を保った。
- source_word: τὸ πνεῦμά μου
  choice: わたしの霊
  rationale: πνεῦμα の「息」という語義も意識しつつ、父への祈りとして自らを委ねる文脈では「霊」が意味の広がりと神学的重みを最もよく保つ。
- source_word: τοῦτο δὲ εἰπών
  choice: こう言って
  rationale: 主動詞に先立つ発言を示すアオリスト分詞を、簡潔で自然な日本語の継起表現にした。
- source_word: ἐξέπνευσεν
  choice: 息を引き取られた
  rationale: 息を吐き出すことに由来する原語の像と、死を意味する日本語の慣用表現を両立させた。主語への敬意を表すため尊敬形を用いた。
theological_decisions:
- issue: τὸ πνεῦμά μου の訳し方
  choice: わたしの霊
  alternative: わたしの息
  rationale: 意識的に父へ語り、自らを委ねる祈りの文脈を重視した。ただし πνεῦμα の語義を生理的な息だけに限定せず、後代の教理を本文へ付加することも避けた。
- issue: παρατίθεμαι の現在中動態
  choice: 委ねます
  alternative: お預けします
  rationale: この場で行われる意志的・遂行的な自己委託を、現代日本語として自然な単純現在で表した。
- issue: ἐξέπνευσεν と死の描写
  choice: 息を引き取られた
  alternative: 亡くなられた
  rationale: 死を明確に伝えながら、原語にある呼吸の像を残した。「霊を委ねる」と「息を引き取る」の関係について、本文以上の説明は加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祈りと臨終の場面にふさわしい簡潔で荘重な調子を保った。イエスの発話と動作には過度に古風でない尊敬表現を用いた。脚注記号は対応箇所の直後に置いた。
