source:
  edition: SBLGNT
  text: οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις αἰτούμενοι αὐτὸν σταυρωθῆναι, καὶ κατίσχυον αἱ φωναὶ ⸀αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/023.yaml
  text: But they kept pressing with loud voices[a], asking that he be crucified, and their voices prevailed.
translation:
  language: ja
  text: しかし彼らは、大声を上げて、イエスを十字架につけることを執拗に要求し続けた。そして、彼らの声が優勢になっていった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの叫び声が優勢になっていった」。ギリシア語では、「声」に当たる語が前半と後半で繰り返されており、この文脈では「叫び声」と訳すこともできる。
    reason: 語彙の別訳。本文の「大声／声」という反復を保ちながら、φωνήの文脈上の別の自然な訳語を示す。
lexical_decisions:
- source_word: ἐπέκειντο
  choice: 執拗に要求し続けた
  rationale: 未完了形が表す継続的な圧力と強い固執を、自然な現代日本語で示す。後続のαἰτούμενοιも一体として訳し、単なる一度の願いではないことを明確にした。
- source_word: φωναῖς μεγάλαις
  choice: 大声で
  rationale: φωνήの聴覚的要素とμέγαςの強さを簡潔に保つ。文脈上「叫び声」も可能だが、語義を限定しすぎない表現を採った。
- source_word: αἰτούμενοι
  choice: 要求し
  rationale: 基本義は「求める」だが、ἐπέκειντοと裁判場面の文脈によって強い要求となっているため、「要求する」が適切である。
- source_word: αὐτὸν σταυρωθῆναι
  choice: イエスを十字架につけるようにと
  rationale: 受動不定詞の内容を自然な日本語の引用内容として表現した。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: κατίσχυον
  choice: 押し切った
  rationale: 彼らの声が優勢となり、結果として要求が通ったことを、司法的な圧力の文脈に合う自然な日本語で示す。未完了形の進行性は「優勢になっていった」とも訳せるため脚注で示した。
- source_word: αἱ φωναὶ αὐτῶν
  choice: 彼らの声
  rationale: 前半のφωνήとの語の反復を保ち、声そのものの力が優勢となったという原文の強調を再現した。
theological_decisions: []
translation_notes:
  register: 明快で格調ある現代標準日本語。継続する圧力は「執拗に要求し続けた」で表し、φωνήの反復は「大声／声」によって可能な限り保持した。
