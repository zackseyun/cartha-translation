id: LUK.23.33
reference: Luke 23:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅτε ⸀ἦλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτὸν καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/033.yaml
  text: And when they came to the place called Skull[a], there they crucified him and the criminals[b], one on the right and one on the left.
translation:
  language: ja
  text: 彼らが「どくろ」と呼ばれる場所[a]に着くと、そこで彼らはイエスを十字架につけ、二人の犯罪者も、一人を右側に、もう一人を左側に十字架につけた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の場所の呼称 Κρανίον は、字義どおりには「頭蓋骨、どくろ」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると、「一人を右側に、もう一人を左側に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον ἐπὶ τὸν τόπον
  choice: その場所に着くと
  rationale: 移動を表すἔρχομαιとἐπί＋対格の組み合わせを、到着の意味が自然に伝わる現代日本語で表した。
- source_word: τὸν καλούμενον Κρανίον
  choice: 「どくろ」と呼ばれる場所
  rationale: Κρανίονは「頭蓋骨、どくろ」を意味する普通名詞に由来する場所の呼称である。音写せず意味を訳し、明瞭な現代語の「どくろ」を用いた。
- source_word: ἐσταύρωσαν
  choice: 十字架につけた
  rationale: σταυρόωの標準的で簡潔な訳。釘の使用など、動詞自体が明示しない細部は加えていない。
- source_word: αὐτόν
  choice: イエスを
  rationale: 原文は代名詞「彼を」だが、日本語では節単独でも指示対象が明瞭になるよう、文脈上の指示対象であるイエスの名を用いた。
- source_word: κακούργους
  choice: 犯罪人たち
  rationale: κακοῦργοςは犯罪者・悪事を行う者を指す。「強盗」や「反逆者」と限定せず、ルカ独自の広い表現を保った。
- source_word: ὃν μὲν ἐκ δεξιῶν ὃν δὲ ἐξ ἀριστερῶν
  choice: 一人は右に、もう一人は左に
  rationale: 二人を左右に振り分ける対照構文を自然な日本語で表した。「イエスの」は文脈上含意されるが原文に明記されていないため本文には補わなかった。
theological_decisions:
- issue: Κρανίονという場所の呼称
  choice: どくろ
  alternative: されこうべ／頭蓋骨／クラニオン
  rationale: 意味内容を保ちながら、古語的な「されこうべ」、臨床的な「頭蓋骨」、意味の伝わりにくい音写を避けた。並行箇所に由来する別の伝統的名称は持ち込まなかった。
- issue: イエスと共に十字架につけられた二人の呼称
  choice: 犯罪人たち
  alternative: 悪人たち／強盗たち
  rationale: κακοῦργοιの意味範囲を保ち、他の福音書の用語と調和させて「強盗」と狭く解釈することを避けた。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「どくろ」は平易さを優先し、「犯罪人」は古風な「悪人」や意味を狭める「強盗」を避けた。物語の流れを保つため冒頭を「彼らが…着くと」とした。
