  naturalness: 現行本文は概ね自然であるが、「犯罪人たちも、一人は右に」は係り方がやや取りにくい。「二人の犯罪者も、一人を右側に、もう一人を左側に」とすると、誰が十字架につけられたのかと配列が明瞭になる。
  terminology: 「十字架につけた」はσταυρόωの標準的な訳として適切。「どくろ」は場所の呼称として平易であり、音写や並行箇所の伝統的名称を持ち込まない。「犯罪者」は現代標準語として明瞭で、κακοῦργοιを「強盗」などに狭めない。
