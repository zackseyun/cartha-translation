id: LUK.23.15
reference: Luke 23:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐδὲ Ἡρῴδης, ⸂ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς⸃· καὶ ἰδοὺ οὐδὲν ἄξιον θανάτου ἐστὶν πεπραγμένον αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/015.yaml
  text: But neither did Herod, for he sent him back to us. And look, nothing deserving of death has been done by him.
translation:
  language: ja
  text: しかし、ヘロデもまた、この人に死に値する罪を認めませんでした。彼を私たちのもとへ送り返したからです。見なさい。この人は死に値するようなことを何一つしていません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見なさい。この人には、死に値するようなことは何一つ見いだされません。」
    reason: αὐτῷを行為者ではなく、関係・所在を示す与格として理解することも可能であるため。
lexical_decisions:
- source_word: ἀλλ’ οὐδὲ Ἡρῴδης
  choice: ヘロデもまた、この人に罪を認めませんでした
  rationale: 前節のピラトの判断にヘロデの判断を重ねる省略表現。日本語では文脈上補う必要があるため、「罪を認めませんでした」と明示した。οὐδέの「〜もまた…ない」を保持する。
- source_word: ἀνέπεμψεν γὰρ αὐτὸν πρὸς ἡμᾶς
  choice: 彼を私たちのもとに送り返してきたからです
  rationale: ἀναπέμπωはこの叙述状況では、ヘロデがイエスをピラト側へ送り返すことを表す。γάρの説明関係も「からです」で明示した。
- source_word: καὶ ἰδοὺ
  choice: 見なさい
  rationale: 聞き手の注意を結論へ向ける談話標識として、現代語でありながら荘重さも保つ表現を選んだ。
- source_word: οὐδὲν ἄξιον θανάτου
  choice: 死に値することを何一つ
  rationale: 死刑に相当する行為がないという司法的含意を自然な日本語で保持した。
- source_word: ἐστὶν πεπραγμένον αὐτῷ
  choice: この人は…していません
  rationale: 完了受動分詞と与格を、文脈上イエスに帰せられる行為についての判断として捉え、日本語では能動表現にした。完了の現在的効力は判決的な断言に反映される。
theological_decisions:
- issue: πεπραγμένον αὐτῷ における αὐτῷ の意味
  choice: 行為者に関わる意味—「この人は…していません」
  alternative: 関係・所在の意味—「この人には…認められません」
  rationale: ピラトはイエスが死刑に相当する行為をしていないと宣言している。日本語の能動文がこの司法的趣旨を最も明瞭に伝える一方、別解も脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法廷での公式な発言にふさわしい端正さを保った。「この人」は被告を指す公的な言い方として用い、「見よ」よりも現代の読者に理解しやすい「見なさい」を採用した。
