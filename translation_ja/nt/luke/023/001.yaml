  text: Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν ἤγαγον αὐτὸν ἐπὶ τὸν Πιλᾶτον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/001.yaml
  text: And the whole assembly of them rose and led him to Pilate[a].
translation:
  language: ja
  text: そして、一同[a]は立ち上がり、イエスをピラトのもとへ連れて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの群衆全体」。
    reason: πλῆθοςは「群衆」「大勢の人々」「集団」を意味し得るため。本文の「一同」は文脈に即して集合全体を自然に表した訳。
lexical_decisions:
- source_word: Καὶ
  choice: そこで
  rationale: 物語の次の出来事への移行と連続性を、現代日本語で自然に示す。単なる並列以上の強い因果関係は加えていない。
- source_word: ἀναστὰν
  choice: 立ち上がり
  rationale: アオリスト分詞が主動詞に先立つ動作を表すことを、自然な連用形で保持した。
- source_word: ἅπαν τὸ πλῆθος αὐτῶν
  choice: 一同
  rationale: 集まっていた者たち全体を指す集合的表現として簡潔で自然。πλῆθοςを公式機関と限定せず、ἅπανの全体性も表す。別訳は脚注に示した。
- source_word: ἤγαγον
  choice: 連れて行った
  rationale: ἄγωの、人物を目的地へ導き伴う意味を、この拘束下の場面に適した自然な日本語で表した。
- source_word: αὐτὸν
  choice: イエスを
  rationale: 日本語では「彼を」より指示対象を明示するほうが自然であり、直前の文脈が指すイエスを補った。
- source_word: ἐπὶ τὸν Πιλᾶτον
  choice: ピラトのもとへ
  rationale: 移動を表す動詞と対格を伴うἐπίが示す、ピラトのいる所への方向を自然に表した。「ピラトの前へ」ほど司法的な意味を明示的に加えない。
- source_word: Πιλᾶτον
  choice: ピラト
  rationale: 日本語で定着した人名表記を用いた。
theological_decisions:
- issue: 司法的文脈における集合的主語の訳し方
  choice: 一同
  alternative: 彼らの群衆全体／彼ら全員
  rationale: 直前の審議に集まった者たち全体を示しつつ、πλῆθοςを「議会」などの公式機関に限定しない。神学的解釈を付加せず、集合性と全体性を保った。
translation_notes:
  register: 明瞭な現代標準日本語。物語文として自然でありながら品位を保ち、「一同」によって原文の集合性と全体性を簡潔に示した。
