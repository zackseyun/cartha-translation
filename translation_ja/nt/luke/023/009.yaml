  register: 明瞭で現代的な標準日本語としつつ、聖書本文としての品位を保った。「長々と」と「問い続けた」はやや意味が重なるが、原文の未完了時制と ἐν λόγοις ἱκανοῖς がともに示す持続的な尋問を自然に再現するため採用した。
