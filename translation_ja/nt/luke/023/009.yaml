  yaml_path: translation/nt/luke/023/009.yaml
  text: So he questioned him at considerable length[a], but he answered him nothing.
translation:
  language: ja
  text: そこでヘロデは、イエスに多くの言葉を費やして問いかけた[a]。しかし、イエスは彼に何もお答えにならなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「長い間問いかけた」「多くの質問をした」。直訳「多くの言葉で」。ギリシア語の表現は、言葉を重ねて問いかけたことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτα
  choice: 問い続けた
  rationale: 未完了時制が示す継続的・反復的な質問を自然な日本語で表す。単に「尋ねた」より、問いかけが続いたことが明確になる。
- source_word: δὲ
  choice: そこで／しかし
  rationale: 最初の δέ は物語を穏やかに進める接続として「そこで」、二つ目はヘロデの質問とイエスの沈黙との対照を示すため「しかし」とした。
- source_word: ἐν λόγοις ἱκανοῖς
  choice: 長々と
  rationale: 直訳的には「多くの言葉で」だが、文脈では長時間にわたる言葉による質問を表す。「長々と」はその継続と量を簡潔で自然に伝える。
- source_word: αὐτὸν／αὐτός／αὐτῷ
  choice: イエスに／イエスは
  rationale: 日本語では代名詞だけだと指示対象が曖昧になりやすいため、文脈上の人物名を補って明瞭にした。αὐτός の軽い強調と対照は「しかし、イエスは」で表した。
- source_word: οὐδὲν ἀπεκρίνατο
  choice: 何もお答えにならなかった
  rationale: 「何一つ答えなかった」という内容を自然に保持する。イエスへの敬意を示す標準的な敬語を用いたが、意味上の情報は加えていない。
theological_decisions: []
