id: LUK.23.51
reference: Luke 23:51
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν— ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς ⸀προσεδέχετο τὴν βασιλείαν τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/051.yaml
  text: This man had not agreed with their plan and action—he was from Arimathea[a], a city of the Jews, and he was waiting for the kingdom of God.
translation:
  language: ja
  text: この人は、彼らの決定と行動に同意していなかった[a]。彼はユダヤ人の町アリマタヤの出身で[b]、神の国を待ち望んでいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの計画と行いに賛同していなかった」。
    reason: βουλήとπρᾶξιςには、それぞれ「計画」「行い」と訳せる語義上の幅があるため。
  - marker: b
    text: または「ユダヤ地方の町アリマタヤの出身で」。
    reason: τῶν Ἰουδαίωνは、住民との関係を表す「ユダヤ人の」と、地域との関係を表す「ユダヤ地方の」のどちらにも解し得るため。
lexical_decisions:
- source_word: συγκατατεθειμένος
  choice: 同意していなかった
  rationale: ἦνを伴う完了分詞で、彼らに同調しなかった確定的な立場を表す。「賛成しなかった」も可能だが、「同意していなかった」は議決への投票だけに意味を限定しない。
- source_word: βουλῇ καὶ πράξει
  choice: 決定と行動
  rationale: βουλήはここでは会議体そのものではなく、協議の結果としての意図・決定を指し、πρᾶξιςはそれを実行に移した行動を指す。両者の区別を簡潔に保った。
- source_word: ἀπὸ Ἁριμαθαίας πόλεως τῶν Ἰουδαίων
  choice: ユダヤ人の町アリマタヤの出身で
  rationale: ギリシア語の同格的な構造を自然な日本語にした。τῶν Ἰουδαίωνは「ユダヤ人の」とも「ユダヤ地方の」とも理解できるため、別訳を脚注に示した。
- source_word: προσεδέχετο
  choice: 待ち望んでいた
  rationale: 未完了過去が表す継続的で期待を伴う待望を、「待っていた」より明確に伝える。
- source_word: βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: ルカ文書で一貫して用いられる、明瞭で定着した表現であり、神の支配とその領域という含みを不用意に一方へ限定しない。
- source_word: οὗτος
  choice: この人は
  rationale: 前節のヨセフを強調して受け直す指示代名詞の働きを保つ。
theological_decisions:
- issue: イエスの死に関する最高法院の決定と行動からヨセフがどのように距離を置いたか
  choice: 彼らの決定と行動に同意していなかった
  alternative: 彼らの決議に賛成票を投じず、その行為にも加わらなかった
  rationale: 本文はヨセフの不同意を明言するが、投票の有無や具体的な手続きまでは述べていない。そのため、歴史的状況を過度に補わず、彼の不同意を明確に訳した。
- issue: 「神の国」の性格
  choice: 神の国
  alternative: 神の支配
  rationale: βασιλείαは王的支配を含むが、ここで「支配」と訳して意味を動的側面だけに限定せず、ルカにおける表現の神学的な幅を保った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文にふさわしい落ち着いた文体とした。「待ち望んでいた」により期待を伴う継続的な姿勢を自然に表し、歴史的手続きや教派的解釈は補わなかった。
