id: LUK.23.55
reference: Luke 23:55
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατακολουθήσασαι δὲ ⸀αἱ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι ⸂ἐκ τῆς Γαλιλαίας αὐτῷ⸃, ἐθεάσαντο τὸ μνημεῖον καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/055.yaml
  text: The women who had come with him from Galilee followed and saw the tomb and how his body was laid[a].
translation:
  language: ja
  text: ガリラヤからイエスと一緒に来ていた女たちは、後について行き、墓と、イエスの遺体がどのように納められたかを見届けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακολουθήσασαι
  choice: 後について行き
  rationale: アオリスト分詞を、主動詞に先立つ一連の行動として自然な日本語の連用形で表した。誰の後かは文脈に委ね、原文にない対象を補っていない。
- source_word: δέ
  choice: 無表示
  rationale: ここでは弱い物語上の移行を示す。日本語では段落の流れ自体で十分に伝わり、「さて」「すると」などを加えると意味を強めすぎるため、明示しなかった。
- source_word: αἱ γυναῖκες
  choice: 女たちは
  rationale: 定冠詞が示す、文脈上すでに知られた女性たちの一団を表す。
- source_word: αἵτινες ἦσαν συνεληλυθυῖαι ἐκ τῆς Γαλιλαίας αὐτῷ
  choice: ガリラヤからイエスと一緒に来ていた
  rationale: 先行する同行を示す迂言的な形を「来ていた」で表し、出発地と同行関係の双方を保った。日本語で代名詞が不明瞭になるのを避けるため、文脈上の指示対象を「イエス」と明示した。
- source_word: ἐθεάσαντο
  choice: 見届けた
  rationale: 単に視界に入っただけでなく、墓と遺体の納め方を注意して見たという文脈上の含みを、自然な日本語で表した。
- source_word: τὸ μνημεῖον
  choice: 墓
  rationale: 埋葬場面における岩墓を含め、簡潔で一般的な訳語を採用した。
- source_word: ὡς ἐτέθη
  choice: どのように納められたか
  rationale: ὡςが表す方法・様態を「どのように」で保ち、遺体を墓に置く場面にふさわしくτίθημιの受動形を「納められた」とした。
- source_word: τὸ σῶμα αὐτοῦ
  choice: イエスの遺体
  rationale: 埋葬文脈なのでσῶμαを「遺体」とし、αὐτοῦの指示対象を明瞭にするため「イエスの」と表した。
theological_decisions:
- issue: 分詞κατακολουθήσασαιと主動詞ἐθεάσαντοの物語上の順序
  choice: 「後について行き……見届けた」と、連続する行動として訳す
  alternative: 「後について行った女たちは……見届けた」と分詞構文を修飾節として訳す
  rationale: どちらも文法的に可能だが、連用形は、女性たちが後について行ったうえで墓と埋葬の様子を見たという順序を、自然な日本語で保持する。教理上の判断ではない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「見届けた」「納められた」により埋葬場面の慎重な観察を簡潔に表し、原文にない行為者や同行対象は補わなかった。
