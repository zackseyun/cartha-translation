  text: Πιλᾶτος δὲ ⸀ἀκούσας ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/006.yaml
  text: But Pilate[a], hearing this, asked whether the man was a Galilean,
translation:
  language: ja
  text: ピラトはこれを聞くと、その人がガリラヤ人かどうか尋ねた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιλᾶτος
  choice: ピラト
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: δὲ
  choice: （明示せず）
  rationale: 穏やかな展開を示す接続詞であり、日本語では前後関係によって自然に表されるため、独立した接続語を置かなかった。
- source_word: ἀκούσας
  choice: これを聞くと
  rationale: アオリスト分詞が示す先行・契機を自然な日本語で表した。「これ」は直前の発言内容を指す文脈上の補足である。
- source_word: ἐπηρώτησεν
  choice: 尋ねた
  rationale: 質問・照会を表す一般的な動詞として、自然で品位のある表現を選んだ。
- source_word: εἰ
  choice: かどうか
  rationale: 間接疑問を導く語を現代日本語で明確に表した。
- source_word: ὁ ἄνθρωπος
  choice: その人
  rationale: 直前まで問題となっている人物を指す定冠詞付き名詞として訳し、原文にない指示の強調や固有名への置換を避けた。
- source_word: Γαλιλαῖός
  choice: ガリラヤ人
  rationale: 地域的帰属を示す述語形容詞を、日本語で定着した住民・出身者の呼称として表した。
- source_word: ἐστιν
  choice: （「かどうか」に含める）
  rationale: ギリシア語では現在形だが、日本語の間接疑問では時制を明示せず自然に同じ内容を表せる。
