base_translation:
  language: en
  yaml_path: translation/nt/luke/023/036.yaml
  text: The soldiers also mocked him[a], coming up and offering him sour wine,
translation:
  language: ja
  text: 兵士たちもイエスをあざけり、彼に近寄って、酸いぶどう酒[a]を差し出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「酢」。ギリシア語は、庶民や兵士が飲んだ酸味のある安価なぶどう酒を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: あざけり
  rationale: 敵意と侮蔑を伴う嘲弄を表す。現代日本語として自然で、場面にふさわしい重みも保つ。
- source_word: δὲ … καὶ οἱ στρατιῶται
  choice: 兵士たちも
  rationale: δέによる物語の継続と、καίが示す追加の意味を合わせ、先に述べられた者たちに兵士たちも加わって嘲弄したことを自然に表す。
- source_word: αὐτῷ
  choice: イエスを／（酒を）差し出した
  rationale: 最初の与格は「あざける」の対象、後の与格は差し出す相手を指し、いずれもイエスである。日本語では重複を避けつつ指示対象を明確にした。
- source_word: οἱ στρατιῶται
  choice: 兵士たち
  rationale: ローマの処刑場面にいる兵士を指す、明瞭で標準的な訳語。
- source_word: προσερχόμενοι
  choice: 近寄って
  rationale: イエスのもとへ近づく動作を表す分詞を、後続動作との自然な連用関係で訳した。
- source_word: ὄξος
  choice: 酸いぶどう酒
  rationale: 飲み物としての酸味を帯びた安価なぶどう酒を指す。「酢」では現代の調味料を連想させやすいため、実体が伝わる表現を採用した。
- source_word: προσφέροντες
  choice: 差し出した
  rationale: 相手に飲み物を提供する動作を明確に表す。「与えた」とはせず、実際に飲んだかどうかをこの節だけで確定しない。
theological_decisions:
- issue: 兵士がὄξοςを差し出した行為の性格
  choice: 嘲弄の文脈に置きつつ、行為そのものは「差し出した」と中立的に表現する。
  alternative: 憐れみとして飲ませようとした、または純粋な嫌がらせとして突きつけた、と動機まで明示する。
  rationale: この節は兵士たちの行動全体を嘲弄として描く一方、飲み物を差し出した個別の動機は明言しない。訳文では文脈上の緊張を保ち、心理や神学的意味を補わない。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、受難物語に適した節度ある文体を採用した。「イエス」は原文では代名詞だが、日本語で主語・対象を明確にするため名を補った。
