id: LUK.23.48
reference: Luke 23:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, ⸀θεωρήσαντες τὰ γενόμενα, ⸀τύπτοντες τὰ στήθη ὑπέστρεφον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/048.yaml
  text: And all the crowds that had gathered for this spectacle[a], after seeing what had happened, were returning[b], beating their chests.
translation:
  language: ja
  text: この光景を見に集まっていたすべての群衆は、起こったことを目の当たりにして、胸をたたきながら[a]帰って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「胸をたたく」は、悲しみ、嘆き、または衝撃を表すしぐさ。
    reason: cultural_note
lexical_decisions:
- source_word: συμπαραγενόμενοι
  choice: 集まっていた
  rationale: その場にともに来て集まったことを表す分詞。日本語では簡潔で自然な「集まっていた」とし、集合の意味を保った。
- source_word: ὄχλοι
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語の集合名詞「群衆」は単数形でも複数の人々を自然に表せる。
- source_word: ἐπὶ τὴν θεωρίαν ταύτην
  choice: この光景を見ようと
  rationale: θεωρίαには見物、眺め、見世物という幅がある。十字架刑を「見世物」と断定する語感を避けつつ、見物のために来たという方向性を自然な日本語で示した。
- source_word: θεωρήσαντες τὰ γενόμενα
  choice: 起こったことを目の当たりにして
  rationale: アオリスト分詞が主動詞に先立つ認知を表す。「目の当たりにして」は実際に見届けたという θεωρέω のニュアンスを自然に伝える。
- source_word: τύπτοντες τὰ στήθη
  choice: 胸をたたきながら
  rationale: 身体動作をそのまま訳し、悲嘆、衝撃、悔恨のいずれかに意味を限定しない。
- source_word: ὑπέστρεφον
  choice: 帰って行った
  rationale: その場から戻って行く意味を自然に表現した。ギリシア語未完了過去の情景的・継続的な側面は「ながら」と「行った」を組み合わせて伝えた。
theological_decisions:
- issue: 群衆が胸をたたいた行為の内面的意味
  choice: 身体動作だけを本文に記し、悲嘆、衝撃、悔恨の可能性を残す
  alternative: 「悔い改めて」または「悲しんで」と内面を明示する
  rationale: 原文は行為を描写するだけで、その心情や霊的状態を明示していないため、特定の神学的解釈に限定しない。
translation_notes:
  register: 明瞭で現代的ながら品位ある叙述。「見世物」は現代日本語で侮蔑的に響きやすいため本文では避け、「この光景を見ようと」とした。脚注記号は該当する動作を含む文末に置いた。
