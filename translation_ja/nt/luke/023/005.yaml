id: LUK.23.5
reference: Luke 23:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπίσχυον λέγοντες ὅτι Ἀνασείει τὸν λαὸν διδάσκων καθ’ ὅλης τῆς Ἰουδαίας, ⸀καὶ ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/005.yaml
  text: But they kept insisting[a], saying, “He stirs up the people, teaching throughout all Judea[c][b], beginning from Galilee even to here.”
translation:
  language: ja
  text: しかし彼らはなおも強く言い張った。「この男は、ガリラヤから始めてここに至るまで、ユダヤ全土[a]で教えながら、民衆を扇動している[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ」は、狭義のユダヤ地方を指す場合と、文脈によってはユダヤ人の土地をより広く指す場合がある。ここでは、イエスの活動が広範囲に及んだという告発が強調されている。
    reason: cultural_note
  - marker: b
    text: 別訳「民衆を騒ぎ立たせている」。このギリシア語には、人々をかき立てて騒動を起こさせるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίσχυον
  choice: なおも強く言い張った
  rationale: 未完了過去が示す継続的な強い主張を、自然な現代日本語で表した。単に「言った」とせず、告発を押し通そうとする力強さを保っている。
- source_word: Ἀνασείει
  choice: 扇動しています
  rationale: 民衆をかき立て、騒乱へ向かわせるという敵対的な告発の含みを表す一方、反乱罪などの具体的な政治犯罪まで本文に持ち込まない訳語とした。
- source_word: τὸν λαὸν
  choice: 民衆
  rationale: その場に集まった特定の群衆ではなく、広く一般の人々を指すため、「群衆」より「民衆」が文脈に合う。
- source_word: διδάσκων
  choice: 教え
  rationale: 現在分詞が表す継続的な活動を簡潔に示し、その教える行為が告発内容と結び付けられている構文を保った。
- source_word: καθ’ ὅλης τῆς Ἰουδαίας
  choice: ユダヤ全土で
  rationale: κατάと属格が示す地域全体にわたる広がりを、簡潔で自然な日本語にした。「ユダヤ」の地理的範囲にあり得る幅は脚注で示した。
- source_word: ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε
  choice: ガリラヤから始めてここに至るまで
  rationale: 活動の起点がガリラヤであり、ピラトのいる現在地にまで及んだという地理的な進展と、ὧδεの直示性を保った。
theological_decisions:
- issue: イエスに対する告発の性格
  choice: 「民衆を扇動しています」と訳し、社会的な騒動を引き起こすとの告発として表現する。
  alternative: 「民衆を反乱へ駆り立てています」または「民衆を惑わしています」
  rationale: ἀνασείειは民衆をかき立てるという否定的意味を持つが、それ自体で反乱という特定の犯罪を明示するわけではない。告発の政治的な響きを保ちつつ、原文以上に限定しない。
- issue: 「ユダヤ」の地理的範囲
  choice: 本文では固有地名として「ユダヤ」とし、範囲の可能性を脚注で示す。
  alternative: 「ユダヤ地方」または「ユダヤ人の全地域」
  rationale: Ἰουδαίαは狭義のユダヤ地方を指すことも、文脈によってより広いユダヤ人の土地を指すこともあり得る。本文で一方に決めず、告発が活動範囲の広さを強調している点を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法廷で告発者たちが強く主張する場面にふさわしい、簡潔でやや改まった調子にした。引用内は自然な敬体とし、ピラトへの訴えとして読めるようにした。
