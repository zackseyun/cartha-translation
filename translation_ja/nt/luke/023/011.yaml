id: LUK.23.11
reference: Luke 23:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξουθενήσας δὲ αὐτὸν ⸀καὶ ὁ Ἡρῴδης σὺν τοῖς στρατεύμασιν αὐτοῦ καὶ ἐμπαίξας ⸀περιβαλὼν ἐσθῆτα λαμπρὰν ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/011.yaml
  text: But Herod also[a], together with his soldiers, treated him with contempt and mocked him. Dressing him in splendid clothing, he sent him back to Pilate.
translation:
  language: ja
  text: ヘロデもまた、自分の兵士たちとともに、イエスを侮り、あざけった。そして、華やかな衣[a]を着せ、ピラトのもとへ送り返した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「輝く衣」または「華麗な衣」とも訳せる。ここで用いられた語には、明るい、輝かしい、見事な、という意味がある。この衣は、イエスに見せかけの栄誉を与えてあざけることに関わっている可能性がある。
    reason: λαμπράν の語義の幅を示しつつ、衣の嘲弄上の意味を本文以上に断定しないため。
lexical_decisions:
- source_word: ἐξουθενήσας
  choice: 侮り
  rationale: 相手を取るに足りない者とみなして軽んじる意味を、簡潔で自然な日本語で表す。文脈上、公然と辱める行為も含意される。
- source_word: σὺν τοῖς στρατεύμασιν αὐτοῦ
  choice: 自分の兵士たちとともに
  rationale: στράτευμα は軍勢または兵士たちを指す。この場面では、現代の読者に明瞭な「兵士たち」が適切である。
- source_word: ἐμπαίξας
  choice: あざけった
  rationale: 嘲弄することを表す標準的で品位ある表現であり、受難物語の文体にも合う。
- source_word: περιβαλὼν
  choice: 着せ
  rationale: 衣を人の身にまとわせる動作を、自然な日本語で表す。
- source_word: ἐσθῆτα λαμπρὰν
  choice: 華やかな衣
  rationale: ἐσθής は衣服、λαμπρός は明るい、輝かしい、華麗な、見事な、などの幅を持つ。「華やかな衣」は特定の王衣と断定せず、目立つ豪華さと嘲弄的な場面の双方を保つ。
- source_word: ἀνέπεμψεν
  choice: 送り返した
  rationale: この司法的な文脈では、先の権威者であるピラトのもとへ戻す意味を明確に表す。
- source_word: τῷ Πιλάτῳ
  choice: ピラトのもとへ
  rationale: 人名を慣用的に音写し、送付先を自然な日本語で示す。
- source_word: δὲ ... καὶ ὁ Ἡρῴδης
  choice: ヘロデもまた
  rationale: 文脈を進める δέ と、主語に添えられた καί の追加的な意味を、日本語として自然に表す。
theological_decisions:
- issue: 衣が嘲弄の中で持つ意味
  choice: 華やかな衣と訳し、嘲弄的な栄誉という含みは文脈に委ねる。
  alternative: 王の衣と明示する、または狂人・道化を示す衣と解釈する。
  rationale: 本文は侮りと嘲弄を明記しているため、この衣もその行為の一部と考えられるが、ギリシア語は衣の象徴的意味を限定していない。訳文では特定の解釈を付加せず、緊張と曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、受難物語にふさわしい簡潔で品位ある調子とした。分詞の連続は日本語として読みやすい二文に整理し、代名詞 αὐτόν は文脈上の指示対象を明確にするため「イエス」とした。
