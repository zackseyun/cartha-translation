id: LUK.23.47
reference: Luke 23:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδὼν δὲ ὁ ἑκατοντάρχης τὸ γενόμενον ⸀ἐδόξαζεν τὸν θεὸν λέγων· Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/047.yaml
  text: When the centurion saw what had happened[a], he glorified God, saying, “Certainly this man was righteous.”
translation:
  language: ja
  text: 百人隊長は、起こったことを見て、神をあがめて言った。「確かに、この人は正しい人[a]だった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「無実だった」または「義人だった」とも訳せる。ギリシア語は、道徳的に正しいことも、文脈によっては法的に無実であることも表し得る。
    reason: δίκαιοςが持つ道徳的正しさと法的無罪の両方の可能性を示すため。
lexical_decisions:
- source_word: Ἰδὼν
  choice: 見て
  rationale: アオリスト分詞を、主動詞に先立つ知覚を自然に示す接続形で訳した。
- source_word: δὲ
  choice: （独立した語としては訳出しない）
  rationale: 弱い談話接続辞であり、日本語では文脈と語順だけで自然な物語の進行が伝わるため、過度な対比や時間表現を加えなかった。
- source_word: ὁ ἑκατοντάρχης
  choice: 百人隊長
  rationale: ローマ軍の職位を表す、日本語聖書で定着した簡潔で正確な名称。
- source_word: τὸ γενόμενον
  choice: 起こったこと
  rationale: 直前に生じ、目撃された出来事を指す冠詞付き分詞を自然な日本語にした。
- source_word: ἐδόξαζεν τὸν θεὸν
  choice: 神をあがめて
  rationale: δοξάζωの神に栄光を帰す意味を保つ。未完了過去の継続・始動の含みを日本語で不必要に限定せず、発話へ自然につないだ。
- source_word: λέγων
  choice: 言った
  rationale: 発言内容を導く現在分詞を、日本語の自然な叙述として主動詞と組み合わせた。
- source_word: Ὄντως
  choice: 確かに
  rationale: 話者の強い肯定を、明瞭で現代的な表現で示した。
- source_word: ὁ ἄνθρωπος οὗτος
  choice: この人
  rationale: イエスを指す指示表現を簡潔かつ自然に訳した。
- source_word: δίκαιος
  choice: 正しい人
  rationale: 道徳的な正しさを保ちつつ、文脈上可能な法的無罪の意味を本文で一義的に確定しない表現とした。別訳は脚注に示した。
- source_word: ἦν
  choice: だった
  rationale: 過去時制の連結動詞を自然な日本語の過去形で表した。
theological_decisions:
- issue: 百人隊長の言葉におけるδίκαιοςの意味
  choice: 正しい人だった
  alternative: 無実だった／義人だった
  rationale: 本文は百人隊長の言葉を他福音書の「神の子」と同一化しておらず、δίκαιος自体の道徳的・神学的重みを保つ必要がある。一方、ルカの受難記事ではイエスの無罪も重要な文脈であるため、その可能性を脚注に残して意味を断定しなかった。
translation_notes:
  register: 明瞭な現代標準語を用いながら、受難記事にふさわしい簡潔で品位ある調子とした。「あがめる」は神へのδοξάζωを自然に表す定着語として用いた。
