  text: But they kept shouting, saying, “Crucify, crucify him!”
translation:
  language: ja
  text: しかし、彼らは叫び続けた。「十字架につけろ、十字架につけろ、彼を！」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼を十字架にかけて処刑しろ、彼を十字架にかけて処刑しろ。」
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: しかし、人々は
  rationale: οἱは文脈上、先に言及された群衆を指す名詞的用法。δέは直前のピラトの発言との対照を示すため「しかし」とした。
- source_word: ἐπεφώνουν
  choice: 叫び続けた
  rationale: ἐπιφωνέωの大声で叫ぶ意味と、未完了過去が示す継続的・反復的な動作を表した。
- source_word: λέγοντες
  choice: （直接話法で内容を導入）
  rationale: 主動詞と同時の分詞で、叫んだ内容を導く。日本語では「言って」を加えず、引用を直接続けるほうが自然で簡潔である。
- source_word: Σταύρου σταύρου
  choice: 十字架につけろ、十字架につけろ
  rationale: 現在命令形の反復による切迫した要求を保った。「十字架につける」はσταυρόωの具体的な処刑方法を正確に示す。
- source_word: αὐτόν
  choice: そいつを
  rationale: 命令形の目的語である三人称単数代名詞。敵意を帯びた群衆の叫びとして自然で、直前のイエスを明確に指す。
theological_decisions:
- issue: σταύρουが示す処刑要求
  choice: 十字架につけろ
  alternative: 十字架にかけて処刑しろ
  rationale: 動詞は十字架刑を具体的に指す。「十字架につけろ」は簡潔で定着した表現であり、語義を保ちながら説明を過度に加えない。
translation_notes:
  register: 群衆の激しい反復要求を、現代日本語の直接的な命令表現で再現した。「そいつを」は敵意のある叫びとして自然だが、本文全体の呼称統一を優先する場合は「彼を」も可能。
