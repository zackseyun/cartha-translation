  text: στραφεὶς δὲ πρὸς αὐτὰς ⸀ὁ Ἰησοῦς εἶπεν· Θυγατέρες Ἰερουσαλήμ, μὴ κλαίετε ἐπ’ ἐμέ· πλὴν ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/028.yaml
  text: But turning toward them[a], Jesus said, “Daughters of Jerusalem, do not weep for me; instead, weep for yourselves and for your children,”
translation:
  language: ja
  text: しかし、イエスは彼女たちのほうを振り向いて言われた。「エルサレムの娘たち[a]、わたしのために泣いてはいけません。むしろ、あなたがた自身と、あなたがたの子どもたちのために泣きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「エルサレムの女たち」。ギリシア語は直訳すると「エルサレムの娘たち」で、預言的な呼びかけです。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς δὲ πρὸς αὐτὰς
  choice: しかし、イエスは彼女たちのほうを振り向いて
  rationale: アオリスト分詞による身体の向きの変化を自然な日本語で表し、δὲの穏やかな転換・対照を「しかし」で示した。
- source_word: Θυγατέρες Ἰερουσαλήμ
  choice: エルサレムの娘たち
  rationale: 預言書的な呼びかけの響きと比喩的・共同体的な表現を保持するため、字義に沿って訳した。現代日本語での意味は脚注で補った。
- source_word: μὴ κλαίετε ἐπ’ ἐμέ
  choice: わたしのために泣いてはいけません
  rationale: 現在命令法の禁止を、すでに始まった行為の中止に限定せず表現した。ἐπίが示す嘆きの対象は自然な「～のために」とした。
- source_word: πλὴν
  choice: むしろ
  rationale: 前の命令を訂正し、嘆くべき対象を対照的に示す機能を明確にした。
- source_word: ἐφ’ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν
  choice: 自分自身と自分の子どもたちのために泣きなさい
  rationale: ἐπ’ ἐμέとの並行を「～のために」で保ち、再帰代名詞の強調を「自分自身」として示した。τέκναは平明に「子どもたち」とした。
theological_decisions:
- issue: Θυγατέρες Ἰερουσαλήμの呼称
  choice: エルサレムの娘たち
  alternative: エルサレムの女たち
  rationale: 単なる女性集団の呼称に平板化せず、聖書に見られる預言書的・共同体的な響きを残した。特定の教派的解釈は加えていない。
- issue: μὴ κλαίετεの相
  choice: 泣いてはいけません
  alternative: 泣くのをやめなさい
  rationale: 現在命令法とμήは進行中の行為の中止を含み得るが、それだけに確定しないため、原文の幅を保つ一般的な禁止表現を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には丁寧で厳粛な調子を持たせた。「娘たち」は日常語としてやや異質だが、原文の聖書的な響きを保持し、脚注で意味を明確にした。
