  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπέλυσεν δὲ τὸν διὰ στάσιν καὶ φόνον βεβλημένον ⸀εἰς φυλακὴν ὃν ᾐτοῦντο, τὸν δὲ Ἰησοῦν παρέδωκεν τῷ θελήματι αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/025.yaml
  text: So he released the man who had been thrown into prison for insurrection and murder[a], whom they were asking for[b]; but he handed Jesus over to their will.
translation:
  language: ja
  text: そこでピラトは、反乱と殺人のために牢獄に投げ込まれていた男、彼らが求めていた者を釈放し、イエスのほうは彼らの望むままに引き渡した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέλυσεν
  choice: 釈放し
  rationale: 拘禁されている者を解放する司法的文脈に合い、現代日本語として自然で正確である。
- source_word: διὰ στάσιν καὶ φόνον
  choice: 暴動と殺人のために
  rationale: διά＋対格の原因を明示する。στάσιςはこの政治的・刑事的文脈では単なる争いではなく、騒乱・反乱を指すため「暴動」とした。
- source_word: βεβλημένον εἰς φυλακήν
  choice: 牢獄に投げ込まれていた
  rationale: βάλλωの生々しい語感を保ちつつ、完了受動分詞が示す、その結果として拘禁状態にあったことを「投げ込まれていた」で表した。
- source_word: ὃν ᾐτοῦντο
  choice: 彼らが求めていた者
  rationale: 未完了過去が示す継続的な要求を「求めていた」で表し、「要求していた」ほど強く限定しない。
- source_word: παρέδωκεν
  choice: 引き渡した
  rationale: 司法的な移管を表すπαραδίδωμιに対応し、受難物語での語の重みも保つ自然な訳である。
- source_word: τῷ θελήματι αὐτῶν
  choice: 彼らの望むままに
  rationale: 直訳的な「彼らの意志に」は日本語では不自然になりやすいため、θέλημαの意志・願望の意味を自然に表した。
- source_word: δὲ ... δὲ
  choice: そこで…し、…のほうは
  rationale: 最初のδέによる物語の進行と、二つ目のδέによる男とイエスとの対照を、自然な日本語の接続と対比で示した。
theological_decisions:
- issue: 暴動者の釈放とイエスの引き渡しの対照を、贖罪論的解釈を付加せずに訳すこと
  choice: 「男…を釈放し、イエスのほうは…引き渡した」として叙述上の対照だけを明示した。
  alternative: 「イエスの代わりに」など、身代わりの意味を訳文に加える。
  rationale: 本文はピラトの二つの行為を対照的に記すが、この節自体は「代わりに」とは明言していないため、神学的含意を訳文へ先取りして加えない。
translation_notes:
  register: 明瞭で現代的だが、受難叙述にふさわしい落ち着きと尊厳を保った。「牢獄に投げ込まれていた」は原文の比喩的な強さを残し、「彼らの望むままに」は日本語としての自然さを優先した。
