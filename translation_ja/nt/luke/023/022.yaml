source:
  edition: SBLGNT
  text: ὁ δὲ τρίτον εἶπεν πρὸς αὐτούς· Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/022.yaml
  text: And he said to them a third time[a], “Why? What evil has this man done? I have found in him no grounds for death. Therefore, after disciplining him[c][b], I will release him.”
translation:
  language: ja
  text: しかしピラトは三度目に彼らに言った。「なぜだ。この人がどんな悪事をしたというのか。[a] 私はこの人に死刑を科す根拠を何も見いださなかった。[b] だから、この人を懲らしめた上で釈放しよう。」[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「この人がいったいどんな悪事をしたというのか」。ギリシア語冒頭の Τί は、独立した抗議の問い「なぜだ」とも、後続の「どんな悪事」と一続きとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「この人のうちに、死に値する理由となるものを何も見いださなかった」。また「死刑に値する罪を何も認めなかった」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「罰した上で」とも訳せる。文脈上「むちで打った上で」を指す可能性もあるが、ギリシア語 παιδεύσας 自体は刑罰の具体的な方法を特定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: τρίτον
  choice: 三度目に
  rationale: 反復を表す副詞的対格。ピラトが同じ群衆に三度語りかけたという物語上の強調を、自然な日本語で保つ。
- source_word: Τί γὰρ κακὸν ἐποίησεν οὗτος;
  choice: なぜだ。この人がどんな悪事をしたというのか。
  rationale: 冒頭の Τί を抗議的な短い問いとして表し、続く κακὸν の問いと併置した。κακόν は道徳的・司法的な重みを保つため「悪事」とした。構文を一つの問いと取る可能性は脚注に残す。
- source_word: οὐδὲν αἴτιον θανάτου
  choice: 死刑にする根拠を何も
  rationale: 司法的文脈の αἴτιον を「根拠」とし、θανάτου は単なる死の原因ではなく死刑判決に関わることが明確になるよう表現した。
- source_word: εὗρον ἐν αὐτῷ
  choice: 私は…この人に認められなかった
  rationale: εὗρον の調査・判断の含意を、日本語の司法的文脈に自然な「認める」で表した。ἐν αὐτῷ の「この人に」を保持し、ピラト自身の判断であることを「私は」で明示した。
- source_word: παιδεύσας
  choice: 懲らしめた上で
  rationale: この文脈では教育一般でなく、処刑より軽い懲罰的処置を指す。「懲らしめる」は処罰の性格を示しつつ、語自体が特定しない刑罰方法を限定しない。
- source_word: ἀπολύσω
  choice: 釈放しよう
  rationale: 司法的拘束から解放する意味を簡潔かつ自然に示す。未来形にはここでピラトの意向が表れているため、文脈に合う意志表現とした。
theological_decisions:
- issue: ピラトが παιδεύσας によって提案した処置の性質
  choice: 具体的な方法を限定せず、懲罰的処置として「懲らしめた上で」と訳す。
  alternative: 「罰した上で」または、歴史的文脈を踏まえて「むちで打った上で」
  rationale: 本文は、ピラトがイエスに死刑の根拠を認めない一方、より軽い懲罰を提案するという緊張を含む。παιδεύω はこの文脈で懲罰を表し得るが、この語だけでは刑罰の具体的形態を確定できないため、本文では広い意味を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、法廷場面にふさわしい端正さを保った。「この人」を繰り返して、ピラトが目前のイエスを指す原文の οὗτος／αὐτός を明確にした。会話文は過度に古風な「〜せん」などを避けつつ、軽すぎない調子に整えた。
