  text: ⸂ὁ δὲ Ἰησοῦς ἔλεγεν· Πάτερ, ἄφες αὐτοῖς, οὐ γὰρ οἴδασιν τί ποιοῦσιν.⸃ διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ ἔβαλον ⸀κλήρους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/034.yaml
  text: But Jesus was saying[a], “Father, forgive them, for they do not know what they are doing.” And dividing his garments, they cast lots.
translation:
  language: ja
  text: しかし、イエスはこう言っておられた。[a]「父よ、彼らをお赦しください。彼らは何をしているのか分かっていないのです。」その後、イエスの衣を分け、くじを引いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「父よ、彼らをお赦しください。彼らは何をしているのか分かっていないのです」という句を欠いています。
    reason: textual_variant
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言っておられた
  rationale: 未完了過去の継続的・反復的な側面を保ちつつ、イエスの祈りにふさわしい自然で敬意ある日本語とした。
- source_word: Πάτερ
  choice: 父よ
  rationale: 所有表現を補わず、呼格による直接の呼びかけを簡潔に表した。
- source_word: ἄφες
  choice: お赦しください
  rationale: 神に向けて加害者のために願う文脈では「赦す」が最も自然であり、命令形を祈願として丁寧に表した。
- source_word: αὐτοῖς
  choice: 彼らを
  rationale: 指示対象を本文以上に特定せず、ギリシア語代名詞の曖昧さを保った。
- source_word: οὐ γὰρ οἴδασιν τί ποιοῦσιν
  choice: 彼らは、自分たちが何をしているのか分かっていないのです
  rationale: οἶδαを「分かる」とし、知識の欠如を自然な現代日本語で表した。「理解していない」のような解釈的な拡張は避けた。
- source_word: διαμεριζόμενοι
  choice: 分け
  rationale: 衣類を複数人の間で分配する行為を、簡潔で自然な日本語にした。
- source_word: τὰ ἱμάτια αὐτοῦ
  choice: イエスの衣
  rationale: 代名詞の指示対象を日本語で明確にしつつ、「衣」によって物語の品位ある文体を保った。
- source_word: ἔβαλον κλήρους
  choice: くじを引いた
  rationale: 古代の抽選行為を表す日本語の定着した自然な表現を用いた。
- source_word: δὲ
  choice: しかし／（無表示）
  rationale: 最初のδὲは前後の転換を「しかし」で示し、二つ目は日本語の流れを重くしないよう独立した接続語を置かなかった。
theological_decisions:
- issue: 「父よ、彼らをお赦しください。彼らは、自分たちが何をしているのか分かっていないのです」という言葉の本文上の真正性
  choice: 本文に含める
  alternative: この言葉を欠く写本がある
  rationale: 指定されたSBLGNTは本文にこの句を掲げつつ、記号で重要な異読を示している。その本文を訳し、写本上の異読は脚注で明示した。
- issue: 「彼ら」が指す範囲
  choice: 対象を特定せず「彼ら」とする
  alternative: ローマ兵、指導者、群衆などに限定する
  rationale: αὐτοῖςだけでは対象の範囲が明示されないため、神学的・歴史的解釈によって限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祈りには敬意ある表現を採用した。「言っておられた」で未完了過去の側面を示す。後半の行為者は直前の文脈から兵士であるため、日本語として自然になるよう「兵士たちは」と明示した。
