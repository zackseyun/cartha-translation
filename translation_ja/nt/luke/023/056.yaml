  source_fidelity: 原文のアオリスト分詞ὑποστρέψασαιを「戻ってから」として主動詞「用意した」に先行する動作として適切に表している。女性複数の分詞の指示対象を文脈に従って「女たち」としたことも妥当である。ἀρώματαとμύραを「香料と香油」と区別し、安息日に「戒めに従って休んだ」とした後半も、κατὰ τὴν ἐντολήνの単数形と安息日文脈を忠実に反映する。
