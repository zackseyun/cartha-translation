id: LUK.23.56
reference: Luke 23:56
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/056.yaml
  text: Then after returning[a], they prepared spices and ointments. And on the Sabbath they rested according to the commandment[b],
translation:
  language: ja
  text: 女たちは戻ってから[a]、香料と香油[b]を用意した。そして安息日には、戒めに従って休んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「戻って」。ギリシア語の分詞は、「用意した」より前に戻ったことを示す。
    reason: lexical_alternative
  - marker: b
    text: 「香油」は「香りのよい油」または「香膏」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποστρέψασαι
  choice: 戻ってから
  rationale: アオリスト能動分詞・女性複数で、前の文脈に登場する女たちを指す。主動詞「用意した」に先立つ動作を、自然な現代日本語で明確に表す。
- source_word: δὲ
  choice: （独立には訳さず、文の流れで表現）
  rationale: ここでは物語を穏やかに進める接続語であり、「戻ってから」という連続した叙述によってその働きが自然に伝わる。
- source_word: ἡτοίμασαν
  choice: 用意した
  rationale: 埋葬に用いる香料類を準備したことを表す、簡潔で自然な訳語。
- source_word: ἀρώματα
  choice: 香料
  rationale: 埋葬の文脈で、遺体に用いる芳香性の物質を指す。「香料」は意味を限定しすぎず、現代日本語として明瞭である。
- source_word: μύρα
  choice: 香油
  rationale: 香りをつけた油または軟膏状の香料を指す。ἀρώματαとの区別を保ち、日本語の聖書文脈でも理解しやすい。
- source_word: τὸ μὲν σάββατον
  choice: 安息日には
  rationale: 時間を示す表現として自然に訳した。μένの軽い対照・移行の働きは「には」で穏やかに反映した。
- source_word: ἡσύχασαν
  choice: 休んだ
  rationale: 安息日の文脈では、活動をやめて休む意味を表す。「静かにしていた」より文脈に即している。
- source_word: κατὰ τὴν ἐντολήν
  choice: 戒めに従って
  rationale: 特定の戒めに適合して行動したことを自然に表し、単数形の意味を保つ。
theological_decisions:
- issue: 「戒め」が何を指すか
  choice: 本文では単に「戒め」とし、安息日遵守に関するモーセ律法上の戒めを文脈から読み取れる形にする
  alternative: 「安息日についての戒め」または「神の戒め」と明示する
  rationale: 文脈上は律法における安息日の戒めを指すが、原文は説明を加えず「その戒め」とだけ述べる。本文で解釈的な補足をせず、原文の簡潔さを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「女たちは」はギリシア語分詞の女性複数と直前の文脈に基づいて補った。「そして」により後半のΚαίを自然に表し、原文の叙述順序を保った。
