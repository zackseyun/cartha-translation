  text: Ἤγοντο δὲ καὶ ἕτεροι ⸂κακοῦργοι δύο⸃ σὺν αὐτῷ ἀναιρεθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/032.yaml
  text: And two others[a], who were criminals[b], were being led with him to be put to death.
translation:
  language: ja
  text: ほかに二人の犯罪者も、イエスとともに処刑されるため、連れて行かれていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「殺されるため」。ここでは司法的に命を奪われることを指す。この語自体は処刑方法を特定しないが、続く文脈から十字架刑であることが分かる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤγοντο
  choice: 連れて行かれていた
  rationale: 未完了過去の受動態が表す、過去に進行中だった移動を自然な日本語で示す。
- source_word: δὲ καὶ
  choice: ほかにも
  rationale: δέの穏やかな物語上の接続と、καίが示す追加・包含を、日本語の流れの中で簡潔に表す。
- source_word: ἕτεροι κακοῦργοι δύο
  choice: 二人の犯罪人
  rationale: 語順を日本語として自然に整えつつ、イエス以外の二人が有罪判決を受けた犯罪者であることを明確にする。「ほかにも」によりἕτεροιの意味を表した。
- source_word: σὺν αὐτῷ
  choice: イエスとともに
  rationale: 代名詞を「イエス」と明示し、現代日本語で指示対象を分かりやすくする。σύνの同伴の意味は「とともに」で保持する。
- source_word: ἀναιρεθῆναι
  choice: 死刑にされるため
  rationale: 司法的文脈での「命を奪う、死に至らせる」を自然に表す。この動詞自体は処刑方法を特定しないため、「十字架につけられる」とはしない。
theological_decisions:
- issue: ἀναιρεθῆναιの訳で十字架刑を明示するか
  choice: 「死刑にされる」とし、方法を特定しない。
  alternative: 「十字架につけられる」または「処刑される」
  rationale: 文脈上は十字架刑だが、この動詞そのものは死に至らせることを表し、方法までは示さない。原文の語義範囲を保つ。
translation_notes:
  register: 明快な現代標準日本語。荘重さを保ちながら古風な「悪人」「刑死させる」などを避けた。文脈上の指示対象を明確にするため、αὐτῷは「イエス」とした。
