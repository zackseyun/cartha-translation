  text: and saying[a], “If you are the King of the Jews, save yourself.”
translation:
  language: ja
  text: そして、こう言った。「もしおまえがユダヤ人[a]の王なら、自分を救ってみろ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々の王」とも訳せる。ギリシア語の「Ἰουδαίων」は、文脈によりユダヤ人、またはユダヤ地方の人々を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ λέγοντες
  choice: そして、こう言った
  rationale: 前節の複数の兵士を受ける分詞句を、現代日本語として自然な連続動作にした。「あざけって」とは補わず、嘲弄の意味合いは発言内容と文脈に委ねた。
- source_word: Εἰ σὺ εἶ
  choice: もしおまえが…なら
  rationale: 挑発的な条件を「もし…なら」で保持した。明示された二人称代名詞の強調と侮蔑的な場面の調子を「おまえ」に反映した。
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: ユダヤ人の王
  rationale: 受難物語における政治的・メシア的な称号として定着した自然な訳語を採用した。Ἰουδαίωνの地域的な意味の可能性は脚注に残した。
- source_word: σῶσον σεαυτόν
  choice: 自分を救ってみろ
  rationale: σῴζωとの語彙的連関を保つため「救う」とした。裸の命令形が持つ挑発・嘲弄の調子を、自然な日本語の「…てみろ」で表した。
theological_decisions:
- issue: βασιλεὺς τῶν Ἰουδαίωνという王号の訳
  choice: ユダヤ人の王
  alternative: ユダヤ地方の人々の王
  rationale: 十字架刑の文脈ではイエスへの告発と嘲弄に結びつく王号であり、「ユダヤ人の王」が日本語の福音書表現として明瞭である。一方、Ἰουδαῖοςが地域的意味を帯びうる点は脚注で保持した。
- issue: 兵士たちの言葉における条件とイエスの王権
  choice: 「もし…なら」として嘲弄的な条件を保持
  alternative: 「…なのだから」
  rationale: 話者が王権を認めていると断定せず、表面的な疑義と物語上の皮肉との緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語。兵士から十字架上のイエスへの嘲弄的な直接話法として「おまえ」「救ってみろ」を用いたが、動詞λέγοντες自体には「あざける」を加えなかった。
