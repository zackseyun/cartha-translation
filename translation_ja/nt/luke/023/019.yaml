base_translation:
  language: en
  yaml_path: translation/nt/luke/023/019.yaml
  text: who had been thrown into prison for a certain uprising that had taken place in the city[a], and for murder.
translation:
  language: ja
  text: この男は、町で起こったある暴動[a]と殺人のために、牢に投げ込まれていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「反乱」。ギリシア語の「スタシス」は、暴動、蜂起、反乱を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅστις
  choice: この男は
  rationale: 前節のバラバを受ける関係代名詞。単独の節としても自然に参照先が分かるよう、「この男は」とした。
- source_word: διὰ
  choice: ～のために
  rationale: 対格を伴って投獄の理由を表す。στάσιςとφόνοςの双方にかかる因果関係を自然な日本語で示す。
- source_word: στάσιν τινὰ
  choice: ある暴動
  rationale: τινάの不特定性を「ある」で保持した。στάσιςは都市内の政治的・暴力的騒擾を指し得るため、本文では平明な「暴動」とし、別訳を脚注に示した。
- source_word: γενομένην ἐν τῇ πόλει
  choice: 町で起こった
  rationale: στάσινを修飾する分詞句を連体修飾として訳した。「町」は原文どおり固有名を補わない。
- source_word: φόνον
  choice: 殺人
  rationale: 単なる殺害一般ではなく、司法的文脈における homicide/murder の意味を明確に表す。
- source_word: βληθεὶς ἐν τῇ φυλακῇ
  choice: 牢に投げ込まれていた
  rationale: βάλλωの強い表現を保ちつつ、過去の投獄の結果として拘禁されていたことを自然に示す。
