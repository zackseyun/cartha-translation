id: LUK.23.45
reference: Luke 23:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂τοῦ ἡλίου ἐκλιπόντος⸃, ἐσχίσθη ⸀δὲ τὸ καταπέτασμα τοῦ ναοῦ μέσον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/045.yaml
  text: the sun having been darkened[c][b][a], and the curtain of the temple was torn in the middle.
translation:
  language: ja
  text: 太陽が光を失い[a]、神殿の垂れ幕[b]は真ん中で裂けた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「太陽が暗くなり」。ここを「日食が起こり」と訳すこともあるが、ギリシア語は必ずしも特定の天文現象を意味しない。
    reason: alternative_reading
  - marker: b
    text: 別訳「神殿の幕」。ここでいう神殿は、特に聖所を指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「真ん中から裂けた」または「二つに裂けた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἡλίου ἐκλιπόντος
  choice: 太陽が光を失い
  rationale: 属格独立構文を、前後の出来事との連続性が自然に伝わる節として訳した。ἐκλείπω の「尽きる、失われる」という語義を保ちつつ、日食という特定の天文現象には限定しない。
- source_word: ἐσχίσθη
  choice: 裂けた
  rationale: 布が引き裂かれることを表す自然で明確な日本語。受動の形を逐語的に再現しなくても、主語である垂れ幕に生じた出来事として原文の意味を保てる。
- source_word: δὲ
  choice: （読点による接続）
  rationale: ここでは弱い接続を表すため、独立した接続詞を置かず、読点で自然に二つの出来事をつないだ。
- source_word: τὸ καταπέτασμα
  choice: 垂れ幕
  rationale: 聖所を仕切る掛け布を指す。現代の一般読者に分かりやすく、物としての性質も明確な語を選んだ。伝統的な「幕」は脚注に残した。
- source_word: τοῦ ναοῦ
  choice: 神殿の
  rationale: ναός はここでは神殿の聖所を指し得るが、日本語では「神殿の垂れ幕」が自然で認識しやすい。より限定的な理解を本文に持ち込まない。
- source_word: μέσον
  choice: 真ん中で
  rationale: 裂けた位置またはあり方を表す原文を直接的に訳した。「二つに」は結果を明示するため、本文では避けた。
theological_decisions:
- issue: 太陽について用いられた ἐκλιπόντος の意味
  choice: 「太陽が光を失い」と非専門的に訳す。
  alternative: 「太陽が暗くなり」または「日食が起こり」
  rationale: 本文はイエスの死に伴う暗闇を描くが、動詞自体は天文学的な日食を必ずしも意味しない。現象を伝えながら、その仕組みを断定しない表現とした。
- issue: καταπέτασμα の訳語
  choice: 本文では「垂れ幕」とする。
  alternative: 「幕」または「聖所の幕」
  rationale: 神殿内部を仕切る幕という指示対象を、教派的な解釈を加えず、現代の読者に分かる語で示した。
- issue: μέσον が示す裂け方
  choice: 「真ん中で裂けた」とし、位置・様態の曖昧さを保つ。
  alternative: 「真ん中から裂けた」または「二つに裂けた」
  rationale: 原文は中央を表すが、裂け始めた地点や結果を細かく明示してはいないため、それらを本文で断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「垂れ幕」によって古風すぎる宗教用語を避け、「光を失い」によって日食という過度に限定的な解釈を避けた。
