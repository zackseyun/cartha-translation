  text: καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν ἀνέπεμψεν αὐτὸν πρὸς Ἡρῴδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/007.yaml
  text: And when he learned that he was under Herod’s jurisdiction[a], he sent him to Herod, who himself was also in Jerusalem in those days.
translation:
  language: ja
  text: そして、イエスがヘロデの管轄下にあることを知ると[a]、ピラトはイエスをヘロデのもとへ送った。ヘロデ自身もそのころエルサレムにいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヘロデの権限のもとにあることを知ると」。ギリシア語の表現は、ヘロデの統治領域または法的権限を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: 知ると
  rationale: アオリスト分詞が主動詞に先立つ認識を表すため、自然な時間関係を示す「知ると」とした。
- source_word: ἐκ τῆς ἐξουσίας Ἡρῴδου ἐστὶν
  choice: ヘロデの管轄下にある
  rationale: ἐξουσίαはこの司法・行政的文脈では抽象的な力より、ヘロデの統治権または裁判権が及ぶ範囲を指す。「管轄下」はその意味を簡潔に伝える。
- source_word: ἀνέπεμψεν αὐτὸν
  choice: ピラトはイエスを……送った
  rationale: 動詞は司法的な送致の含みを持ち得るが、本文では過度に専門化せず「送った」とした。日本語では代名詞の指示を明確にするため、文脈上の主語と目的語を固有名で示した。
- source_word: πρὸς Ἡρῴδην
  choice: ヘロデのもとへ
  rationale: 人を目的地とするπρόςの自然な日本語表現であり、単なる方向ではなく本人のところへ送ったことを示す。
- source_word: ὄντα καὶ αὐτὸν
  choice: ヘロデ自身も……いた
  rationale: καὶ αὐτόνの追加と強調を「自身も」で保持した。
- source_word: ἐν Ἱεροσολύμοις
  choice: エルサレムに
  rationale: 地名の現代日本語における標準的な表記。
- source_word: ἐν ταύταις ταῖς ἡμέραις
  choice: そのころ
  rationale: 直訳的な「これらの日々には」より自然で、物語中の当時を指す時間表現を明瞭に伝える。
theological_decisions:
- issue: ヘロデとの関係におけるἐξουσίαの政治的・法的意味
  choice: 管轄
  alternative: 権限、支配領域
  rationale: ここではピラトが、イエスの出身地域に対するヘロデ・アンティパスの統治上・司法上の権限を認めた場面である。「管轄」は神学的な意味を持ち込まず、法行政的文脈をよく表す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いギリシア語の一文を二文に分け、指示対象の混同を避けるため「ピラト」「イエス」を補った。脚注記号[a]は該当箇所の直後に置いた。
