  source_fidelity: 原文の場面設定（民衆が立って見ていること）と、指導者たちによる継続的で侮蔑的な嘲笑を正確に伝えている。「ほかの人々を救ったのだ」と「自分を救ってみろ」により、σῴζωの反復と嘲笑の皮肉も保たれている。「もしこの者が神のメシア、選ばれた者なら」は、条件節と二つの称号の並置を損なわない。
  naturalness: 明瞭な現代標準語として自然である。「立って見ていた」「あざ笑って言った」は簡潔で読みやすく、直接話法の「この者」「救ってみろ」も、この文脈での敵対的な嘲りを不自然な俗語化なしに表している。
  terminology: 「神のメシア」はὁ χριστὸς τοῦ θεοῦの称号性を適切に反映する。「選ばれた者」もὁ ἐκλεκτόςを過度に解釈せず、称号として自然に訳している。「指導者たち」はἄρχοντεςを特定の集団に限定しない適切な訳語である。
