id: LUK.23.35
reference: Luke 23:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ⸀ἄρχοντες λέγοντες· Ἄλλους ἔσωσεν, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ χριστὸς ⸂τοῦ θεοῦ, ὁ⸃ ἐκλεκτός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/035.yaml
  text: And the people stood watching. But even the rulers were mocking him[a], saying, “He saved others; let him save himself, if this is God’s Messiah, the Chosen One.”
translation:
  language: ja
  text: 民衆は立って見ていた。一方、指導者たちもあざ笑って言った。「ほかの人々を救ったのだ。もしこの者が神のメシア、選ばれた者なら、自分を救ってみろ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἱστήκει
  choice: 立っていた
  rationale: 状態を表す過去完了形に由来する形を、場面設定として自然な継続状態で表した。
- source_word: θεωρῶν
  choice: 見ていた
  rationale: 民衆がその光景を継続して見ていることを、簡潔で自然な現代日本語で表した。
- source_word: ἐξεμυκτήριζον
  choice: あざ笑って
  rationale: 鼻で笑うような侮蔑的嘲弄を含む動詞の意味を、明瞭で一般的な日本語にした。目的語の「彼を」は文脈上明らかなため、自然な日本語として明示しなかった。
- source_word: ἄρχοντες
  choice: 指導者たち
  rationale: この文脈の統治的・宗教的な有力者を指す語として、過度に限定せず分かりやすい表現を選んだ。
- source_word: Ἄλλους ἔσωσεν
  choice: ほかの人々を救った
  rationale: σῴζωを「救う」とし、後続する同じ動詞との反復と皮肉を保った。
- source_word: σωσάτω ἑαυτόν
  choice: 自分を救ってみろ
  rationale: 三人称命令の挑発的な力を、嘲りの直接話法に適した自然な日本語で表した。
- source_word: εἰ οὗτός ἐστιν
  choice: もしこの者が…なら
  rationale: 指示代名詞の距離感と、この場面での軽蔑的な響きを「この者」で保った。
- source_word: ὁ χριστὸς τοῦ θεοῦ
  choice: 神のメシア
  rationale: χριστόςはここでは称号であり、「メシア」と訳して油注がれた者という称号性を示した。属格は簡潔に「神の」とした。
- source_word: ὁ ἐκλεκτός
  choice: 選ばれた者
  rationale: 称号としての重みを保ちつつ、現代の一般読者に明瞭な訳語とした。
theological_decisions:
- issue: χριστόςの称号としての訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法ではなく、神に属する油注がれた者という称号なので、「メシア」とした。
- issue: ὁ ἐκλεκτόςの称号性
  choice: 選ばれた者
  alternative: 選ばれた方
  rationale: 原文の称号的な意味を保ちながら、嘲る話者の口調に敬意を加えない「者」を選んだ。
- issue: εἰ節に込められた嘲弄
  choice: もし…なら、自分を救ってみろ
  alternative: …であるなら、自分を救え
  rationale: 条件文を事実認定へ変えず、指導者たちの挑発と皮肉を自然な日本語で保持した。
translation_notes:
  register: 明瞭な現代標準語を用い、叙述部分は簡潔で dignified な調子にした。直接話法では原文の侮蔑と挑発を保つため「この者」「救ってみろ」としたが、俗悪すぎる表現は避けた。
