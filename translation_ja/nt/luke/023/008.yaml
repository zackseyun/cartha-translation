  text: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν, ἦν γὰρ ⸂ἐξ ἱκανῶν χρόνων θέλων⸃ ἰδεῖν αὐτὸν διὰ τὸ ⸀ἀκούειν περὶ αὐτοῦ, καὶ ἤλπιζέν τι σημεῖον ἰδεῖν ὑπ’ αὐτοῦ γινόμενον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/008.yaml
  text: When Herod saw Jesus[a], he rejoiced greatly, for he had for a long time wanted to see him because he had heard about him[b], and he was hoping to see some sign done by him.
translation:
  language: ja
  text: ヘロデはイエスを見ると、大いに喜んだ。というのも、イエスについて耳にしていたため、長い間イエスを見たいと望んでおり、また、イエスによって行われる何らかのしるし[b]を見たいと期待していたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「何らかの奇跡」とも訳せる。原語は「しるし」（σημεῖον）で、奇跡的な行為を指すことがあるが、それが意味を持つ徴であることも含意する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ Ἡρῴδης ἰδὼν τὸν Ἰησοῦν
  choice: ヘロデはイエスを見ると
  rationale: δέは場面の進行を示す軽い接続として日本語では明示せず、アオリスト分詞ἰδώνと主動詞の時間関係を自然な「見ると」で表した。
- source_word: ἐχάρη λίαν
  choice: 大いに喜んだ
  rationale: χαίρωの喜びとλίανの強意を、簡潔で品位ある現代日本語で表す。
- source_word: ἐξ ἱκανῶν χρόνων θέλων ἰδεῖν αὐτόν
  choice: 長い間、彼を見たいと思っており
  rationale: 迂言的な未完了の継続性と、ἐξ ἱκανῶν χρόνωνが示す長期間を保った。「会いたい」よりも原文のἰδεῖνとの語彙的対応が明確な「見たい」を選んだ。
- source_word: διὰ τὸ ἀκούειν περὶ αὐτοῦ
  choice: イエスのことを以前からたびたび耳にしていたので
  rationale: διά＋冠詞付き不定詞の原因を「ので」で示し、現在不定詞ἀκούεινの継続的・反復的な含みを「以前からたびたび耳にしていた」で自然に表した。
- source_word: ἤλπιζέν τι σημεῖον ἰδεῖν
  choice: 何かのしるしを見られるのではないかと期待していた
  rationale: ἐλπίζωの希望を伴う期待を表しつつ、σημεῖονを「奇跡」に限定せず「しるし」とした。
- source_word: ὑπ’ αὐτοῦ γινόμενον
  choice: イエスが行う
  rationale: ὑπόが示す行為者を能動構文に転換し、γινόμενονを自然な日本語の連体修飾として表した。指示対象を明確にするため「彼」ではなく「イエス」とした。
theological_decisions:
- issue: σημεῖονの意味範囲
  choice: しるし
  alternative: 奇跡
  rationale: 文脈上は奇跡的な行為が想定されるが、σημεῖονはその行為が意味を帯びた徴であることも表すため、原語の幅を保持した。
- issue: ヘロデの期待の確信度
  choice: 見られるのではないかと期待していた
  alternative: 見るものと期待していた
  rationale: ἤλπιζενは希望と期待の両面を持つため、確実視していたと過度に強めない表現を選んだ。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、叙事の品位を保った。長いギリシア語一文は日本語の可読性のため二文に分けたが、後半の「からである」によって喜びの理由という論理関係を維持した。
