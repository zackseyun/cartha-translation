  terminology: 「取り調べる」「訴える」は法的文脈に適切である。αἴτιονはここで被告に認められる告発の根拠・罪責を指すため、「罪状」としてよいが、「訴えているような罪状」より「訴えている事柄について、何の罪状も」のほうが原文の係り方を明瞭にする。
