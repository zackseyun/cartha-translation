  to: 彼らに言った。「あなたがたは、この男が民を惑わしているとして、私のところに連れて来た。見よ、私はあなたがたの前でこの男を取り調べた結果、あなたがたが彼に対して訴えている事柄について、この男には何の罪状も認めなかった[a]。」
  rationale: 逆接を含む「だが」を除き、審問（ἀνακρίνας）とその後の司法的判断（οὐθὲν εὗρον ... αἴτιον）の関係を「取り調べた結果」で示した。「彼に対して訴えている事柄について」として、αἴτιονと関係節（ὧν κατηγορεῖτε κατ’ αὐτοῦ）の関係を明確にし、本文の閉じ引用符を補った。
