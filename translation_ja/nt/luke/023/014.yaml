id: LUK.23.14
reference: Luke 23:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν πρὸς αὐτούς· Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον ὡς ἀποστρέφοντα τὸν λαόν, καὶ ἰδοὺ ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας ⸀οὐθὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/014.yaml
  text: He said to them[a], “You brought this man to me as one who was misleading the people, and behold, after examining him before you[b], I found no basis in this man for the charges you bring against him.”
translation:
  language: ja
  text: 彼らに言った。「あなたがたは、この男が民を惑わしているとして、私のところに連れて来た。見よ、私はあなたがたの前でこの男を取り調べた結果、あなたがたが彼に対して訴えている事柄について、この男には何の罪状も認めなかった[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたがたが彼に対して訴えている事柄について、この男には何の罪状も見いださなかった」。
    reason: 原文の法的表現と語順を示し、「罪状」が告発に関して認められる根拠・罪責を指すことを明確にするため。
lexical_decisions:
- source_word: Προσηνέγκατέ μοι
  choice: 私のところに連れて来た
  rationale: 完了した行為を表すアオリストを自然な日本語で示し、ピラトのもとへ連行した法廷的状況を保つ。
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: この男
  rationale: 文脈上、特定の成人男性であるイエスを指すため、簡潔で正確な表現とした。
- source_word: ὡς ἀποστρέφοντα τὸν λαόν
  choice: 民を惑わしているとして
  rationale: ἀποστρέφωの「そらす、迷わせる」という意味を、扇動という強い意味に狭めず、告発内容として自然に表した。
- source_word: τὸν λαόν
  choice: 民
  rationale: ルカ文書における集合的な民衆を、聖書本文にふさわしい簡潔で現代にも通じる語で表した。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を促す談話標識の力を保ちつつ、格調ある本文表現とした。
- source_word: ἐνώπιον ὑμῶν ἀνακρίνας
  choice: あなたがたの前で取り調べた
  rationale: 公開された司法的審理を明示し、ἀνακρίνωの法的な意味を「取り調べる」で表した。
- source_word: οὐθὲν εὗρον ... αἴτιον
  choice: 罪状を……何一つ認めなかった
  rationale: 法的文脈におけるαἴτιονを「罪状」とし、εὗρονを証拠・根拠を確認できなかったという司法判断に自然な「認めなかった」で表した。
- source_word: ὧν κατηγορεῖτε κατ’ αὐτοῦ
  choice: あなたがたが訴えているような
  rationale: κατηγορέωの法廷的な「訴える、告発する」を保ち、関係節とαἴτιονの結びつきを自然な日本語にした。
theological_decisions:
- issue: ピラトの宣言の範囲
  choice: 告発された罪状を認めなかったという司法判断として訳す
  alternative: この男には何の罪もない
  rationale: ἀνακρίνω、αἴτιον、κατηγορέωという法的語彙に即し、一般的・絶対的な道徳的無罪宣言へ意味を拡張しない。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、法廷場面に合う「取り調べ」「罪状」「訴える」を用いた。「見よ」はἰδούの注意喚起を保つための格調ある表現。
