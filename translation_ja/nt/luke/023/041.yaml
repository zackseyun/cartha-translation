  to: 私たちは正当に罰を受けている。自分たちのしたことにふさわしい報いを受けているのだから。だが、この人は何一つ悪いことをしていない。[a]
  rationale: 原文の μὲν…δὲ による対比、δικαίως の正当な処罰という含意、ἄξια…ἀπολαμβάνομεν の行為に相応する報いを現在受けているという意味を明確にした。「この人」として指示詞の対照を保ち、イエスの無実を、本文以上の教理的主張を加えずに表した。
