    rationale: 「正当に罰を受けている」とすれば、処罰が正当であるという原文の主張と、直後の理由節との関係が明確になる。
  - severity: low
    issue: 「この方」は原文の οὗτος より敬称的な響きを加えうる。
    rationale: 話者の対照的な指示を中立に保つため、「この人」がより直接的である。
  - severity: low
    issue: 「不当なこと」は日本語では『不公平なこと』とも受け取られうる。
    rationale: ἄτοπον の広い意味を本文では「悪いこと」と自然に表し、脚注で「道理に外れたこと」という代替を示す。
  revised_text: 私たちは正当に罰を受けている。自分たちのしたことにふさわしい報いを受けているのだから。だが、この人は何一つ悪いことをしていない。[a]
