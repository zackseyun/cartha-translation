  text: καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/041.yaml
  text: And we indeed justly[a], for we are receiving what our deeds deserve[b]; but this man has done nothing wrong.
translation:
  language: ja
  text: 私たちは正当に罰を受けている。自分たちのしたことにふさわしい報いを受けているのだから。だが、この人は何一つ悪いことをしていない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何一つ道理に外れたことをしていない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαίως
  choice: 当然の報いを受けている
  rationale: 副詞の司法的・応報的な意味を、直後の説明とのつながりが明確になる自然な日本語で表した。
- source_word: ἄξια ὧν ἐπράξαμεν
  choice: 自分たちがしたことにふさわしいもの
  rationale: 行為に相応する結果という意味を保ち、原文の関係節も明示した。
- source_word: ἀπολαμβάνομεν
  choice: 受けている
  rationale: 現在形が示す、刑罰を今まさに受けている状況を表した。
- source_word: οὗτος
  choice: この方
  rationale: 目の前のイエスを指す指示性を保ちつつ、現代日本語として自然で、この場面にふさわしい表現とした。
- source_word: οὐδὲν ἄτοπον
  choice: 何一つ不当なことをしていない
  rationale: ἄτοπος の『不適切な、道理に外れた、悪い』という幅を保ちながら、司法的文脈での無実の証言を明瞭にした。
- source_word: ἔπραξεν
  choice: していない
  rationale: 日本語では『何一つ不当なことをしていない』が自然であり、これまでの行為についての否定を適切に表す。
theological_decisions:
- issue: 犯罪人によるイエスの無実の証言
  choice: だが、この方は何一つ不当なことをしていない
  alternative: だが、この人は何一つ間違ったことをしていない
  rationale: 直近の司法的文脈における無実の主張を明確にしつつ、本文が直接述べていないより広い教理的結論は訳文に加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。対比の μὲν…δὲ を「私たちは……だが、この方は」で示し、説明を二文に分けて読みやすくした。脚注は ἄτοπον の語義の幅を示す。
