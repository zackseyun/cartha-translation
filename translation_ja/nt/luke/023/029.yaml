source:
  edition: SBLGNT
  text: ὅτι ἰδοὺ ἔρχονται ἡμέραι ἐν αἷς ἐροῦσιν Μακάριαι αἱ στεῖραι καὶ ⸀αἱ κοιλίαι αἳ οὐκ ἐγέννησαν καὶ μαστοὶ οἳ οὐκ ⸀ἔθρεψαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/029.yaml
  text: For look, days are coming in which they will say, ‘Blessed are the barren women, and the wombs that never bore, and the breasts that never nursed.’
translation:
  language: ja
  text: 見よ、やがてこう言われる日々が来る。『子を産めない女たち、子を産んだことのない胎、乳を飲ませたことのない乳房は幸いだ。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 目前の発言へ注意を促す預言的な語調を、簡潔で格調ある日本語で保持した。
- source_word: αἱ στεῖραι
  choice: 子を産まない女たち
  rationale: 不妊の女性を指すが、続く胎と乳房との並行を保ちつつ、過度に医学的・侮蔑的に響く表現を避けた。
- source_word: αἱ κοιλίαι αἳ οὐκ ἐγέννησαν
  choice: 子を宿したことのない胎
  rationale: κοιλίαι の身体的比喩を「胎」で保ち、ἐγέννησαν は文脈上、出産に至る母胎の経験全体を自然に表した。
- source_word: μαστοὶ οἳ οὐκ ἔθρεψαν
  choice: 乳を飲ませたことのない乳房
  rationale: ἔθρεψαν の「養う」という意味を、乳房を主語とする文脈に即して授乳として明確にした。
- source_word: Μακάριαι
  choice: 幸いだ
  rationale: 祝福・幸いを宣言する定型的意味を保持し、迫る災厄のため通常の価値判断が逆転する緊張も残した。
theological_decisions:
- issue: 子を持たないことを「幸い」とする逆説
  choice: 引用された将来の叫びとして、そのまま「幸いだ」と訳した
  alternative: 「まだましだ」「恵まれている」など災厄との比較を明示する
  rationale: 原文は比較表現を明示せず Μακάριαι を用いるため、迫る裁き・苦難を背景とする逆説を説明的に解消しなかった。
translation_notes:
  register: 現代の一般読者に分かる日本語を用いつつ、「見よ」「胎」によって原文の預言的で荘重な響きと身体表現の並行を保持した。
