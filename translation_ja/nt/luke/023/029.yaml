  - severity: low
    issue: στεῖραι の「子を産まない女たち」は能力・状態よりも選択的な非出産も含みうる。
    rationale: 文脈では、産むことのできない女性、すなわち不妊・不生産の状態が意図される。「子を産めない女たち」とすれば、侮蔑的な語を避けつつ原文の意味を明確にできる。
  revised_text: 見よ、やがてこう言われる日々が来る。『子を産めない女たち、子を産んだことのない胎、乳を飲ませたことのない乳房は幸いだ。』
