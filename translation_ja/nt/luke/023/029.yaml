  naturalness: 全体として明瞭で自然な現代日本語であり、引用の逆説的な響きも保たれている。「胎」は身体的並行を保つ文脈上、許容される。
  terminology: μακάριαι を「幸いだ」とするのは適切。μαστοὶ οἳ οὐκ ἔθρεψαν の「乳を飲ませたことのない乳房」も、文脈上の授乳・養育を自然に表している。
