  yaml_path: translation/nt/luke/023/020.yaml
  text: But Pilate called out again[a], wanting to release Jesus.
translation:
  language: ja
  text: しかし、ピラトはイエスを釈放したいと思い、再び呼びかけた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「再び語りかけた」。
    reason: προσεφώνησενは「呼びかけた」のほか、「語りかけた」「話しかけた」とも訳せるため。
lexical_decisions:
- source_word: πάλιν
  choice: 再び
  rationale: 動作の反復を表す副詞として、簡潔で自然な対応語。
- source_word: δὲ
  choice: しかし
  rationale: 直前の群衆の要求に対するピラトの応答という、文脈上の緩やかな対比を表す。
- source_word: ὁ Πιλᾶτος
  choice: ピラト
  rationale: 日本語聖書で定着している人名表記。冠詞は日本語では表さない。
- source_word: προσεφώνησεν
  choice: 群衆に呼びかけた
  rationale: 公の場で相手に声をかける意味を自然に表す。目的語は原文では明示されないが、文脈上は群衆であるため補った。語義の幅は脚注に残す。
- source_word: θέλων
  choice: 釈放したいと望んで
  rationale: 主動詞と同時的なピラトの意向を示す現在分詞のニュアンスを保つ。
- source_word: ἀπολῦσαι
  choice: 釈放したい
  rationale: 拘束・裁判の文脈に適した法的な日本語表現。
- source_word: τὸν Ἰησοῦν
  choice: イエスを
  rationale: 日本語で定着した人名表記を用い、対格を助詞「を」で示す。
