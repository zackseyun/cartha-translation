id: LUK.23.10
reference: Luke 23:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἱστήκεισαν δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς εὐτόνως κατηγοροῦντες αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/010.yaml
  text: And the chief priests and the scribes stood there[a], vehemently accusing him.
translation:
  language: ja
  text: 祭司長たちと律法学者たちはそこに立ち、激しくイエスを訴えていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスを猛烈な勢いで告発していた」。
    reason: εὐτόνωςとκατηγοροῦντεςの組み合わせには、告発の激しさと、正式に訴えを起こす響きの両方があるため。
lexical_decisions:
- source_word: εἱστήκεισαν
  choice: そこに立ち
  rationale: 過去完了形だが、ここではその場に立っていたという継続的な状態を表す。日本語では後続の継続動作と自然につなぐため「そこに立ち」とした。
- source_word: δὲ
  choice: （無訳）
  rationale: 物語を進める弱い接続辞であり、日本語では明示しないほうが自然で、強い対比も持ち込まない。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 単数の大祭司職に複数人が同時に就いていたという意味ではなく、祭司層の指導者たちを指す福音書の標準的な表現。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 単なる筆記者ではなく、律法の専門家である当時の集団を、現代の一般読者に明瞭な慣用訳で示す。
- source_word: εὐτόνως
  choice: 激しく
  rationale: 告発の強さと勢いを簡潔かつ自然に表す。
- source_word: κατηγοροῦντες
  choice: 訴えていた
  rationale: 継続中の告発行為を示す現在分詞を、日本語の継続表現で再現する。「訴える」はこの司法的場面にも適する。
- source_word: αὐτοῦ
  choice: イエスを
  rationale: ギリシア語は代名詞だが、日本語では節単独でも指示対象が明瞭になるよう固有名を補った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、裁判場面にふさわしい品位を保った。「律法学者」は日本語聖書で定着し、一般読者にも役割が伝わりやすい表現。
