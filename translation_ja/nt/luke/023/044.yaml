  text: ⸂Καὶ ἦν⸃ ⸀ἤδη ὡσεὶ ὥρα ἕκτη καὶ σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/044.yaml
  text: And it was already about the sixth hour[b][a], and darkness came over the whole land until the ninth hour.
translation:
  language: ja
  text: すでに第六時ごろ[a]であった。暗闇が全土を覆い、第九時[a]まで続いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 第六時は正午ごろ、第九時は午後三時ごろ。
    reason: cultural_note
lexical_decisions:
- source_word: ἤδη
  choice: すでに
  rationale: 物語がこの時点にすでに達していたことを明示する、自然で直接的な訳語。
- source_word: ὡσεὶ
  choice: ごろ
  rationale: 時刻が厳密ではなく概略であることを、現代日本語で簡潔に示す。
- source_word: ὥρα ἕκτη
  choice: 第六時
  rationale: 古代の時刻表現と原文の語感を本文に保ち、現代の時刻に相当する内容は注で説明する。
- source_word: σκότος
  choice: 暗闇
  rationale: この文脈で自然かつ明瞭に、光が失われた状態を表す。
- source_word: ἐγένετο
  choice: 暗闇に覆われ
  rationale: 直訳的な「暗闇が生じた」より自然な日本語としつつ、暗闇が到来した出来事としての力を保つ。
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: 全土が
  rationale: γῆの地域的な意味を本文で過度に宇宙的・全世界的に限定せず表す。「全地／全世界」の可能性は注に残す。
- source_word: ἕως ὥρας ἐνάτης
  choice: 第九時まで
  rationale: 「第六時」と対応する原文の時刻表現を保ち、現代時刻は注で補う。
theological_decisions:
- issue: 暗闇が及んだγῆの範囲
  choice: 全土
  alternative: 全地、全世界
  rationale: γῆは「土地・地域」と「地・世界」の双方を意味し得る。本文では範囲を全世界と断定しない訳を採り、より広い解釈の可能性を注で明示して、歴史的・宇宙的範囲に関する緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としながら、「第六時」「第九時」によって原文の歴史的な時刻表現を保持した。「暗闇に覆われ」は自然で荘重な叙述とし、「全土」に注を付して原語の範囲の曖昧さを保存した。
