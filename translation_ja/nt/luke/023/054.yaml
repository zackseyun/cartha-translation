  text: καὶ ἡμέρα ἦν ⸂παρασκευῆς, καὶ⸃ σάββατον ἐπέφωσκεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/054.yaml
  text: And it was the day of Preparation[a], and the Sabbath was dawning.
translation:
  language: ja
  text: その日は備えの日で、安息日が始まろうとしていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の動詞は通常「明ける」「明るくなり始める」の意も持つ。ここでは、夕方に安息日が始まろうとしていたことを指す。
    reason: 語義上の別の語感を示しつつ、日本語の「安息日が明ける」が安息日の終了を意味しうる誤解を避けるため。
lexical_decisions:
- source_word: παρασκευῆς
  choice: 備えの日
  rationale: ユダヤ・ギリシア語で安息日の前日を指す定着した呼称である。単に「金曜日」と置き換えず、「備え」という原語の意味を保った。
- source_word: σάββατον
  choice: 安息日
  rationale: 文脈上、受難週の週ごとの安息日を指す。日本語では冠詞に相当する語を補わなくても特定性が自然に伝わる。
- source_word: ἐπέφωσκεν
  choice: 始まろうとしていた
  rationale: 字義的には「明けようとしていた」とも訳せるが、ここでは夕方に始まる安息日の到来を表す。朝と誤解されない自然な日本語とし、字義的表現は脚注に残した。
- source_word: ἡμέρα ἦν παρασκευῆς
  choice: その日は備えの日で
  rationale: 属格構文の意味を自然な現代日本語で表し、直前の物語とのつながりも「その日は」によって示した。
- source_word: καὶ
  choice: で、
  rationale: 二つの節の並列関係を、日本語で過度に重くならない接続によって保持した。
theological_decisions:
- issue: 安息日の開始とἐπέφωσκενの意味
  choice: 安息日が夕方に始まりつつあったことを表す「始まろうとしていた」
  alternative: 安息日が明けようとしていた
  rationale: ユダヤの一日は夕方から始まるため、この箇所は朝の夜明けではなく安息日の開始を指す。ただし、動詞にある「明ける」という比喩的・字義的表現は脚注で保持した。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書本文にふさわしい落ち着いた文体とした。「備えの日」は歴史的背景と原語の透明性を保つ表現である。
