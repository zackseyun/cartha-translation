  text: ἦν δὲ καὶ ⸀ἐπιγραφὴ ἐπ’ ⸀αὐτῷ· Ὁ βασιλεὺς τῶν Ἰουδαίων ⸀οὗτος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/038.yaml
  text: 'And there was also an inscription over him: “This is the King of the Jews.”[a][b][c][d]'
translation:
  language: ja
  text: また、イエスの上[b]には、「この者はユダヤ人の王」[c]と書かれた掲示[a]があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「掲示」は「銘文」「札」または「掲示文」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「イエスの上」は「イエスの上方」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語の語順に近くは、「ユダヤ人の王、この者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιγραφή
  choice: 書いた札
  rationale: 十字架上の人物に付された文面を指す。日本語では「銘」よりも「札」が場面を明瞭に伝え、「罪状書き」と断定することも避けられる。
- source_word: ἐπ’ αὐτῷ
  choice: イエスの上に
  rationale: ἐπί＋与格の位置関係を文脈に即して表す。代名詞を「イエス」として日本語で指示対象を明確にした。
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων οὗτος
  choice: この者はユダヤ人の王
  rationale: 動詞のない原文を自然な日本語にしつつ、後置されたοὗτοςの指示的な強調を「この者は」で保った。
- source_word: Ἰουδαίων
  choice: ユダヤ人
  rationale: この磔刑の称号では、民族的・政治的呼称として定着し文脈にも適する「ユダヤ人」とした。
- source_word: δὲ καὶ
  choice: また……も
  rationale: 物語をつなぐ力と、さらに一つの詳細を加える添加の力を自然な日本語で表した。
theological_decisions:
- issue: 十字架上の札の性質
  choice: 掲示された文面を「この者はユダヤ人の王」とそのまま訳し、札そのものを報告する。
  alternative: 正式な罪状と明示する、または皮肉・政治的意味を訳文に補う。
  rationale: 本文は札の存在と文言を報告するだけなので、告発、皮肉、メシア告白などの解釈を訳文へ持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「この人」よりも掲示文らしい簡潔さを持つ「この者」を採用した。すべての脚注標識を本文に配置した。
