  text: He had an obligation[a] to release one man to them at the festival.
translation:
  language: ja
  text: ピラトには、祭りの際、彼らに一人を釈放する義務があった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節全体は、最も古いギリシア語写本のいくつか（3世紀のパピルス75、4世紀のバチカン写本など）と初期のコプト語訳にはない。一方、ほかの主要な初期写本（4世紀のシナイ写本など）、ラテン語訳の伝統、後代のビザンティン系多数写本には見られる。マタイ27章15節とマルコ15章6節に記された釈放の慣例にルカの記事を調和させるため、この文が加えられた可能性があると考える研究者もいる。この文を18節の後に置く写本もある。
    reason: textual_critical
lexical_decisions:
- source_word: ἀνάγκην … εἶχεν
  choice: 義務があった
  rationale: 「必要に迫られている、義務を負っている」という慣用表現。ここでは祭りに伴う慣例上の拘束を自然な現代日本語で表す。
- source_word: ἀπολύειν
  choice: 釈放する
  rationale: 拘束されている者を自由にするという司法・刑事上の文脈に合う。
- source_word: αὐτοῖς
  choice: 彼らのために
  rationale: 与格が示す受益者を明確にし、群衆の求めに応じて一人を釈放する意味を表す。
- source_word: κατὰ ἑορτήν
  choice: 祭りの際に
  rationale: 祭りに応じた慣例を示す表現として自然であり、過越祭という公的・宗教的祝祭の文脈にも適する。
- source_word: ἕνα
  choice: 一人
  rationale: 男性形だが、ここでは釈放される一人の人物を指すため、日本語では簡潔に「一人」とする。
