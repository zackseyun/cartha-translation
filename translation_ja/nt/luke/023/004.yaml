  yaml_path: translation/nt/luke/023/004.yaml
  text: Then Pilate said to the chief priests and the crowds[a], “I find no basis for a charge against this man.”
translation:
  language: ja
  text: そこでピラトは、祭司長たちと群衆に言った。「この人について、告発の根拠[a]は何も見当たらない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この人には何の罪も認められない」。ギリシア語の「アイティオン」は「罪、責められる点」を意味し得るが、ここでは告発・訴追の根拠という司法的な意味合いを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: そこで
  rationale: 弱い接続を表し、直前の尋問を受けた物語の進行を自然な現代日本語で示す。
- source_word: Πιλᾶτος
  choice: ピラト
  rationale: 日本語聖書で広く定着している人名表記を用いる。
- source_word: εἶπεν πρὸς
  choice: ～に言った
  rationale: 相手に向けて発言したことを、簡潔で自然な日本語にする。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数形を保ち、ユダヤの上級祭司指導者層を指す定着した訳語を用いる。
- source_word: ὄχλους
  choice: 群衆
  rationale: 原文は複数形だが、日本語では集合的な「群衆」が自然であり、そこにいた人々の集まりを過不足なく表す。
- source_word: Οὐδὲν εὑρίσκω
  choice: 何も見当たらない
  rationale: 現在の司法的判断として、該当するものを認めないという意味を自然に表す。
- source_word: αἴτιον
  choice: 訴える根拠
  rationale: 語が持つ「責め・罪過」の可能性を脚注に残しつつ、ここでの法廷的文脈を明確に伝える。
- source_word: ἐν τῷ ἀνθρώπῳ τούτῳ
  choice: この人には
  rationale: ἐνの表現を日本語として自然に保ち、この人物について訴追理由が認められないという意味を示す。
