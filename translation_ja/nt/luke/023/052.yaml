  text: この人はピラトのもとへ行き、イエスの遺体を求めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: この人
  rationale: 直前のアリマタヤ出身のヨセフを指す指示代名詞の照応を明確に保ち、現代日本語としても自然である。
- source_word: προσελθὼν τῷ Πιλάτῳ
  choice: ピラトのもとへ行き
  rationale: アオリスト分詞は主動詞に先立つ随伴的な行為を表す。与格の相手を含め、「近づいて」より物語文として自然にした。
- source_word: ᾐτήσατο
  choice: 引き取りたいと願い出た
  rationale: αἰτέω の中動態は、ここでは自分のために求める、願い出る意。日本語では遺体の引き渡しを求めたことを自然かつ明確に表す。
- source_word: τὸ σῶμα
  choice: 遺体
  rationale: 語義は「体」だが、文脈上は死後の体であり、現代日本語の葬埋場面では「遺体」が自然で敬意ある表現。「死体」ほど語調が強くない。
- source_word: τοῦ Ἰησοῦ
  choice: イエスの
  rationale: 単純な属格関係を自然な連体修飾で表した。原文にない「ポンテオ」などは補わない。
