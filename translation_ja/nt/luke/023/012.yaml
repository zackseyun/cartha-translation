source:
  edition: SBLGNT
  text: ἐγένοντο δὲ φίλοι ὅ τε ⸂Ἡρῴδης καὶ ὁ Πιλᾶτος⸃ ἐν αὐτῇ τῇ ἡμέρᾳ μετ’ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ⸀αὑτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/023/012.yaml
  text: And Herod and Pilate became friends with each other on that very day[b][a], for previously they had been in hostility toward one another.
translation:
  language: ja
  text: まさにその日、ヘロデとピラトは互いに友人となった[a]。それまでは、互いに敵対関係にあったのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「互いに親しくなった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένοντο
  choice: となった
  rationale: 関係の変化を表すアオリストの γίνομαι を、自然な現代日本語で明確に示す。
- source_word: φίλοι
  choice: 友人
  rationale: 述語名詞として両者が友人または盟友となったことを直接表す。「親しくなった」より語の名詞性を保つ。
- source_word: ὅ τε Ἡρῴδης καὶ ὁ Πιλᾶτος
  choice: ヘロデとピラト
  rationale: 両者を結ぶ相関構文を、日本語で過不足なく自然に表す。
- source_word: ἐν αὐτῇ τῇ ἡμέρᾳ
  choice: その日
  rationale: 文脈で指示されたまさに同じ日を表す。日本語では「その日」を前置することで時間的対照にも焦点が当たる。
- source_word: μετ’ ἀλλήλων
  choice: 互いに
  rationale: 明示された相互関係を簡潔で自然な日本語にする。
- source_word: προϋπῆρχον
  choice: それまでは…あった
  rationale: その日に起きた変化以前から継続していた状態を、時間的対照を伴って表す。
- source_word: ἐν ἔχθρᾳ ὄντες πρὸς αὑτούς
  choice: 互いに敵対関係にあった
  rationale: 相互の敵意・不和という継続状態を、原文の名詞的表現に近く、かつ自然な現代日本語で示す。
theological_decisions:
- issue: ヘロデとピラトの関係変化の性質
  choice: 「互いに友人となった」と訳し、友人または政治的盟友となったという幅を残す。
  alternative: 「互いに親しくなった」
  rationale: φίλοι は「友人」を直接意味し得るが、親密な個人的友情か政治的な友好関係かを本文は限定しないため、動機や神学的意味を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半の関係成立と後半の従前の敵対を二文に分け、対照を読み取りやすくした。「のである」は γάρ の説明的機能を自然に示す。
