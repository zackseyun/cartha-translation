base_translation:
  language: en
  yaml_path: translation/nt/luke/019/048.yaml
  text: And they could not find what they might do[a], because all the people were hanging on his words as they listened.
translation:
  language: ja
  text: そして彼らは、何をすべきかを見いだせなかった。民は皆、イエスの言葉に聞き入っていたからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「民は皆、聞きながら彼にすがるようにしていた」。ギリシア語の慣用表現で、イエスに強く心を引かれ、熱心に耳を傾けていたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ εὕρισκον
  choice: 見いだせなかった
  rationale: 否定を伴う未完了過去は、取るべき手段を見つけられない状態が続いていたことを示す。現代日本語では「見いだせなかった」がその実際的な不能を自然に表す。
- source_word: τὸ τί ποιήσωσιν
  choice: どうすればよいのか
  rationale: τίと接続法による間接疑問は、彼らが講じるべき方策について思案していたことを表す。「何をするか」よりも日本語として自然で、熟慮的な含みも保つ。
- source_word: ὁ λαὸς γὰρ ἅπας
  choice: 民が皆……からである
  rationale: γάρの理由を示す働きを「からである」で明示し、λαόςは文脈にふさわしく「民」、ἅπαςは「皆」とした。
- source_word: ἐξεκρέματο αὐτοῦ
  choice: イエスの話に聞き入っていた
  rationale: 字義的には「彼にぶら下がっていた」だが、ここでは熱心に注意を傾ける慣用表現。ἀκούωνとの結びつきを自然な日本語にまとめた。「イエス」は文脈上の指示対象を明確にする補足である。
- source_word: ἀκούων
  choice: 聞き入っていた
  rationale: 現在分詞は、民が夢中になっていた際の同時的な行為・様態を示す。日本語では主動詞の慣用的意味と統合して「聞き入っていた」とするのが簡潔で自然。
theological_decisions: []
