- from: だが、私が彼らを王として支配することを望まなかった、この私の敵どもをここに連れて来て、私の目の前で皆殺しにせよ。
  to: だが、私が王として彼らを治めることを望まなかった、この私の敵たちをここに連れて来て、私の目の前で殺してしまえ。
  rationale: 原文の直接的で苛烈な命令、指示詞τούτουςによる強調、王として治めるというβασιλεύωの意味、話者の面前というἔμπροσθέν μουを維持した。その一方で、日本語訳が原文以上に侮蔑的または全滅的になる箇所を抑制した。たとえ話内の発言であることを訳文に説明的に補うことはせず、物語中の直接話法をそのまま保っている。
