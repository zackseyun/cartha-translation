id: LUK.19.27
reference: Luke 19:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν τοὺς ἐχθρούς μου ⸀τούτους τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτοὺς ἀγάγετε ὧδε καὶ κατασφάξατε ⸀αὐτοὺς ἔμπροσθέν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/027.yaml
  text: But as for these enemies of mine[a], who did not want me to reign over them[b], bring them here and slaughter them in front of me.
translation:
  language: ja
  text: だが、私が王として彼らを治めることを望まなかった、この私の敵たちをここに連れて来て、私の目の前で殺してしまえ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: だが
  rationale: 最後の命令へ強く転じる逆接・転換の働きを、簡潔で自然な現代日本語で表した。
- source_word: τοὺς ἐχθρούς μου τούτους
  choice: この私の敵ども
  rationale: τούτουςの指示と強調を「この」で、複数の敵対者に対する厳しい呼称を「敵ども」で保持した。
- source_word: τοὺς μὴ θελήσαντάς με βασιλεῦσαι ἐπ’ αὐτούς
  choice: 私が彼らを王として支配することを望まなかった
  rationale: 分詞句を自然な関係節として訳し、βασιλεύωの「王として治める」という動詞的意味を明示した。日本語では主語と目的語の関係が曖昧にならないよう「私が彼らを」とした。
- source_word: ἀγάγετε ὧδε
  choice: ここに連れて来て
  rationale: 人物を話者のいる場所へ移動させる命令として、自然で直接的な表現を選んだ。
- source_word: κατασφάξατε
  choice: 皆殺しにせよ
  rationale: 単なる「殺せ」より強く、複数の対象を徹底して殺すというκατασφάζωの苛烈さを保った。「処刑せよ」は原文に明示されない司法的含意を加えるため避けた。
- source_word: ἔμπροσθέν μου
  choice: 私の目の前で
  rationale: 話者の目前・面前という空間的で生々しい意味を、現代日本語で明確に表した。
theological_decisions:
- issue: たとえ話の中の話者と命令の扱い
  choice: 貴族である王の直接命令として、その暴力性を弱めずに訳す
  alternative: たとえにすぎないことを訳文に補い、命令との距離を明示する
  rationale: 原文はたとえ話の登場人物の発言として直接提示している。訳文ではその物語上の力を保ちつつ、これをたとえの外でイエスが直接下した命令だと断定する解釈も付け加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、王の命令にふさわしい厳しい命令形「せよ」を採用した。「敵ども」と「皆殺しにせよ」によって原文の敵意と暴力性を隠さず、同時に過度に古風な語や司法的な説明語は避けた。
