revisions:
- from: 彼らは、あなたと、あなたの中にいる子らを地にたたき倒し、あなたの中で石を一つもほかの石の上に残さない。それは、あなたが自分への訪れ[a]の時を認めなかったからである。
  to: 彼らはあなたを、またあなたの中にいるあなたの子らを地に打ち倒し、あなたの中で石を一つもほかの石の上に残さない。それは、あなたがあなたへの訪れ[a]の時を認めなかったからである。
  rationale: 原文の二人称による都市の人格化、子らの比喩、完全な破壊を表す石の慣用表現、そしてἐπισκοπήの意図的な幅を維持した。変更は主に日本語の自然さと指示関係の明瞭化のためであり、神が訪れることを本文に補ったり、訪れを救済または裁きのいずれかに限定したりしていない。
