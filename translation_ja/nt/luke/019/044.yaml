id: LUK.19.44
reference: Luke 19:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐδαφιοῦσίν σε καὶ τὰ τέκνα σου ἐν σοί, καὶ οὐκ ἀφήσουσιν ⸂λίθον ἐπὶ λίθον ἐν σοί⸃, ἀνθ’ ὧν οὐκ ἔγνως τὸν καιρὸν τῆς ἐπισκοπῆς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/044.yaml
  text: and they will level you to the ground[a], and your children within you, and they will not leave one stone upon another within you, because you did not recognize the time of your visitation.
translation:
  language: ja
  text: 彼らはあなたを、またあなたの中にいるあなたの子らを地に打ち倒し、あなたの中で石を一つもほかの石の上に残さない。それは、あなたがあなたへの訪れ[a]の時を認めなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「査察」とも訳せる。ギリシア語は、特に神による訪れや査察を指すことがあり、その訪れはあわれみまたは裁きをもたらしうる。
    reason: ἐπισκοπήの語義の幅と、神の訪れに伴う肯定的側面と裁きの両義的な含みを示すため。
lexical_decisions:
- source_word: ἐδαφιοῦσίν
  choice: 地にたたき倒し
  rationale: 地面にまで倒して壊滅させるという動詞の強い意味を保ちつつ、現代日本語として自然にした。
- source_word: σε
  choice: あなた
  rationale: エルサレムを人格化して二人称単数で呼びかける原文の修辞を保ち、「都」と説明的に置き換えなかった。
- source_word: τὰ τέκνα σου ἐν σοί
  choice: あなたの中にいる子ら
  rationale: 文脈上はエルサレムの住民を指すが、τέκναの「子ら」という母なる都の比喩を平板な「住民」に変えずに残した。
- source_word: οὐκ ἀφήσουσιν λίθον ἐπὶ λίθον ἐν σοί
  choice: あなたの中で石を一つもほかの石の上に残さない
  rationale: 徹底した破壊を表す原文の表現と、ἐν σοίによるエルサレムへの再度の言及を明示した。
- source_word: ἀνθ’ ὧν
  choice: それは、…からである
  rationale: ここでは直前の裁きの理由を導く因果関係を、明瞭な現代日本語で表した。
- source_word: ἔγνως
  choice: 認めなかった
  rationale: 単に知識がなかったのではなく、神の決定的な働きを見分けて受け止めなかったという「認識する」の含意を表した。
- source_word: καιρὸν
  choice: 時
  rationale: 特別な意味を持つ時機を指すが、「定められた」を本文に補わず、後続する属格句にその重みを担わせた。
- source_word: τῆς ἐπισκοπῆς σου
  choice: 自分への訪れ
  rationale: ἐπισκοπήが持ちうる訪問・査察の幅と、神の訪れが慈しみと裁きのどちらにも関わりうる含みを残した。「自分への」は、エルサレムに関わる訪れを示すσουを自然に表す。
theological_decisions:
- issue: 裁きの文脈におけるἐπισκοπήの意味
  choice: 「訪れ」と訳し、神の訪れであることは本文で明示しない
  alternative: 「査察」または「神があなたを訪れた時」
  rationale: 文脈は神の決定的な訪れを認めなかったことへの裁きを示すが、名詞自体は恵みまたは裁きをもたらす訪れ・査察を表しうる。明示的な言い換えを避け、原文の神学的緊張を保った。
translation_notes:
  register: 明瞭で格調ある現代標準語。エルサレムへの直接の呼びかけは「あなた」で統一し、都市の人格化と「子ら」の比喩を保持した。
