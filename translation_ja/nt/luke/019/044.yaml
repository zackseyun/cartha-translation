    rationale: 原文のσουはエルサレムに関わる訪れを表す。「自分への」は主語の再帰を連想させうるため、「あなたへの訪れ」とするのが自然で原文の関係を明瞭に保つ。
  - severity: low
    issue: 最初の目的語の並列がやや読みにくい。
    rationale: 「あなたを、またあなたの中にいるあなたの子らを」として、σεとτὰ τέκνα σου ἐν σοίの並列関係および所有関係を明確にする。
  - severity: low
    issue: 脚注の「慈しみ」は語調がやや限定的である。
    rationale: ἐπισκοπήに伴いうる肯定的側面はmercyとされており、「あわれみ」は過度に解釈を加えず、現代の聖書日本語としても自然である。
