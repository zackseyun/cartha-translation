  text: ὅτι ἥξουσιν ἡμέραι ἐπὶ σὲ καὶ ⸀παρεμβαλοῦσιν οἱ ἐχθροί σου χάρακά σοι καὶ περικυκλώσουσίν σε καὶ συνέξουσίν σε πάντοθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/043.yaml
  text: For days will come upon you when your enemies will build an embankment against you and surround you and hem you in on every side,[a]
translation:
  language: ja
  text: あなたには、やがて日々が来る。そのとき、あなたの敵はあなたに対して土塁[a]を築き、あなたを取り囲み、四方から圧迫する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「包囲柵」「包囲の土塁」。原語は、包囲戦で敵を閉じ込めるために設ける柵や土塁などの構築物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: （独立した文として無表示）
  rationale: 直前の嘆きと予告の理由・内容を導く接続詞。日本語では「なぜなら」を補うより、荘重な予告として直接述べるほうが自然で、文脈上の因果関係も保たれる。
- source_word: ἥξουσιν ἡμέραι ἐπὶ σὲ
  choice: おまえに災いの日々が迫っている
  rationale: 直訳的な「日々がおまえの上に来る」では意味が不明瞭になるため、敵の包囲という文脈から、その日々が災いをもたらすことを明示した。「迫っている」は未来の到来と切迫感を表す。
- source_word: οἱ ἐχθροί σου
  choice: 敵
  rationale: 所有関係は後続の「おまえに向かって」で明瞭であり、日本語では「おまえの敵」より簡潔で自然。
- source_word: παρεμβαλοῦσιν ... χάρακά σοι
  choice: おまえに向かって包囲の柵を築き
  rationale: παρεμβάλλω と χάραξ の組み合わせを、攻城用の構築物を築く行為として表現した。与格 σοι は敵対的な方向を「おまえに向かって」で示した。
- source_word: περικυκλώσουσίν σε
  choice: おまえを取り囲み
  rationale: 軍勢による完全な包囲を、明快で自然な現代日本語で表した。
- source_word: συνέξουσίν σε πάντοθεν
  choice: 四方から締めつける
  rationale: συνέχω の拘束・圧迫の含意と πάντοθεν の全方向性を、包囲戦の文脈に合う表現で保持した。
theological_decisions:
- issue: 二人称単数の指示対象
  choice: 「おまえ」を一貫して用い、人格化されたエルサレムへの単数の呼びかけを保持する。
  alternative: 「あなたがた」または「その住民」として住民集団を明示する。
  rationale: ギリシア語は一貫して単数形であり、直前の文脈ではエルサレムが人格化されている。住民を含む可能性を排除せず、本文が明示しない集合的解釈を訳文に持ち込まない。
translation_notes:
  register: 現代の読者に明瞭でありながら、預言的な厳粛さを保つ文体とした。呼称は、イエスが人格化された都に直接語りかける強い調子を示すため「おまえ」とした。「包囲の柵」は理解しやすさを優先し、語の幅は脚注で補った。
