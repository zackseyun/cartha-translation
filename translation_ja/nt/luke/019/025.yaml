lexical_decisions:
- source_word: καὶ
  choice: すると
  rationale: 単純な物語の接続を、文脈上の発言の流れに沿う自然な現代日本語で表した。強い逆接は加えていない。
- source_word: εἶπαν
  choice: 彼らは……言った
  rationale: アオリスト直説法を、物語に自然な単純過去として訳した。
- source_word: αὐτῷ
  choice: その人に
  rationale: たとえの中の王となった人物を指す男性単数の間接目的語。日本語で指示対象が自然に分かるよう「その人」とした。
- source_word: Κύριε
  choice: ご主人様
  rationale: 権威ある主人への呼びかけとして自然で、敬意を保つ表現。ここで明示的な神学的告白と断定せず、「主よ」という可能性は脚注に残した。
- source_word: ἔχει
  choice: 持っています
  rationale: 現在形の所有を素直に表現した。原文に明示されない「すでに」は加えていない。
- source_word: δέκα
  choice: 十
  rationale: 基数詞をそのまま訳した。
- source_word: μνᾶς
  choice: ミナ
  rationale: 古代の貨幣単位を現代通貨に置き換えず音写し、歴史的背景を保持した。
theological_decisions:
- issue: たとえの中の呼びかけ κύριος の訳し方
  choice: ご主人様
  alternative: 主よ／旦那様
  rationale: この場面では、僕たちが権威ある主人に呼びかける語として読める。「主よ」も語義上可能で、物語が持つ響きを否定できないため脚注に示す一方、本文では明示的なキリスト論的告白に限定しない自然な呼称を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえの主人に対する敬意を「ご主人様」で表した。末尾のダッシュは、次の展開へ続く異議の発言であることを示す原資料の提示形式に合わせて保持した。
