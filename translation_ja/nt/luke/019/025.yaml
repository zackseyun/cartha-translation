  text: And they said to him[a], ‘Lord[b], he has ten minas—’
translation:
  language: ja
  text: 彼らは彼に言った。「ご主人様[a]、彼は十ミナ[b]持っています――」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「主よ」。文脈により「主人」とも訳せる。
