  timestamp: '2026-07-17T06:19:35Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な内容は原文に沿っているが、「こう言わせた」はλέγοντες（『言って』）を使役に変えており、発話の担い手・叙述関係を不必要に変更する。また「彼の後を追う」は、ὀπίσω αὐτοῦの時間的・順序的な『彼の後から』よりも、追跡行為をやや強く示す。
  naturalness: 「彼の国の民」より「その国の市民」のほうが、πολῖταιの政治共同体の構成員という意味を自然で明確な現代日本語で表せる。文全体も使役を避けることで自然になる。
  terminology: 「使節団」はπρεσβείαの公的代表団という意味に適切であり、脚注もその語に正しく対応している。「この男」は指示詞のよそよそしく退ける調子を保つ。「私たちの王として治める」は、βασιλεῦσαι ἐφ’ ἡμᾶςの王権と『私たちの上に』という関係を明確にする。
  issues:
  - severity: medium
    issue: 「こう言わせた」が使役表現になっている
    rationale: 原文は『使節団を送って、〔こう〕言った』という内容の分詞であり、市民が使節団に発言させたという使役を明示しない。日本語でも直接話法を導く「こう言った」が原文により近い。
  - severity: low
    issue: 「彼の後を追う」が追跡の含みを強める
    rationale: ὀπίσω αὐτοῦはここでは彼の出発後に使節団を送った順序を示す。「彼の後から」が余分な追跡のニュアンスを避ける。
  - severity: low
    issue: 「彼の国の民」はやや不自然で、政治的な市民性が曖昧
    rationale: πολῖταιは王の臣民ではなく政治共同体の市民を指す。「その国の市民」は現代日本語として明瞭で、拒否される王権を先取りしない。
  revised_text: ところが、その国の市民は彼を憎んでおり、彼の後から使節団[a]を送って、こう言った。「この男が私たちの王として治めることを、私たちは望まない。」
  revised_footnotes:
