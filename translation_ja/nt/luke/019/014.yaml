id: LUK.19.14
reference: Luke 19:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ πολῖται αὐτοῦ ἐμίσουν αὐτόν, καὶ ἀπέστειλαν πρεσβείαν ὀπίσω αὐτοῦ λέγοντες· Οὐ θέλομεν τοῦτον βασιλεῦσαι ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/014.yaml
  text: But his citizens hated him[a], and sent a delegation after him, saying, ‘We do not want this man to reign over us.’
translation:
  language: ja
  text: ところが、その国の市民は彼を憎んでおり、彼の後から使節団[a]を送って、こう言った。「この男が私たちの王として治めることを、私たちは望まない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「使節」とも訳せる。ギリシア語は、公的な使命のために派遣される代表者またはその一団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολῖται
  choice: 国の民
  rationale: 政治共同体に属する人々という意味を保ちつつ、現代日本語の「市民」が帯びやすい都市住民という限定を避けた。「臣民」では、彼らが拒んでいる王権を先取りしてしまう。
- source_word: ἐμίσουν
  choice: 憎んでおり
  rationale: 未完了過去が示す継続的・特徴的な敵意を、自然な日本語で表した。
- source_word: ἀπέστειλαν
  choice: 送って
  rationale: アオリストの物語上の出来事を、簡潔で自然な動詞によって表した。
- source_word: πρεσβείαν
  choice: 使節団
  rationale: 公的な使命を帯びた代表者の一団という政治的意味を、現代日本語で明確に伝える。
- source_word: ὀπίσω αὐτοῦ
  choice: 彼の後を追う
  rationale: 単なる位置的な「後ろ」ではなく、彼の出発後にその後を追って派遣されたという文脈上の意味を表した。
- source_word: λέγοντες
  choice: こう言わせた
  rationale: 使節団が伝える発言内容を導入する分詞を、日本語の使役表現によって派遣の目的と自然につないだ。
- source_word: Οὐ θέλομεν
  choice: 私たちは望まない
  rationale: 意志と拒絶を表す θέλω を、明瞭かつ dignified な現代日本語で訳した。
- source_word: τοῦτον
  choice: この男
  rationale: 指示語が持つ距離を置いた調子を保ちつつ、過度に侮蔑的な表現を避けた。
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: 私たちの王となる
  rationale: 一般的な統治ではなく王権を表す βασιλεύω の意味を明示し、彼らの拒絶の対象が王位であることを保った。
theological_decisions:
- issue: たとえにおける政治的・王権的含意
  choice: 「私たちの王となる」として王権の語感を明示する
  alternative: 「私たちを治める」「私たちを支配する」
  rationale: 一般的な権威へと平板化せず、本文の王権のイメージを保つ一方、たとえの各要素について本文を越えた寓意的解釈は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「臣民」は王権を先取りするため避け、「この男」は原文の距離を置く調子を過度に俗悪にせず表した。脚注記号は、その説明対象である「使節団」の直後に置いた。
