revisions:
- from: ところが、彼の国の民は彼を憎んでおり、彼の後を追う使節団[a]を送って、こう言わせた。「この男が私たちの王となることを、私たちは望まない。」
  to: ところが、その国の市民は彼を憎んでおり、彼の後から使節団[a]を送って、こう言った。「この男が私たちの王として治めることを、私たちは望まない。」
  rationale: 市民が使節団を派遣して伝えたメッセージという原文の叙述を、使役を用いずに再現した。「その国の市民」によりπολῖταιの市民的・政治的意味を保ち、「私たちの王として治める」により王として彼らの上に統治するというβασιλεῦσαι ἐφ’ ἡμᾶςの意味を自然な現代日本語で表した。脚注の位置と内容は適切なため維持した。
