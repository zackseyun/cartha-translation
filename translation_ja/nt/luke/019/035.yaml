  yaml_path: translation/nt/luke/019/035.yaml
  text: And they brought it to Jesus[a], and after throwing their cloaks on the colt[b], they put Jesus on it.
translation:
  language: ja
  text: 彼らはその子ろばをイエスのもとに連れて来て、自分たちの上着を子ろばに掛けると、イエスをその上に乗せた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: 連れて来て
  rationale: ἄγωはここでは子ろばをイエスのもとまで導いて来ることを表す。「連れて来る」は動物にも自然に用いられ、移動の意味を明確に伝える。
- source_word: αὐτὸν
  choice: その子ろばを
  rationale: 男性単数代名詞は直前の文脈にある子ろばを指す。日本語では指示対象を名詞で明示するほうが自然で、性別を不必要に示さない。
- source_word: πρὸς τὸν Ἰησοῦν
  choice: イエスのもとに
  rationale: 対格を伴うπρόςが、人に向かう移動を表す。「イエスのもとに」は明瞭で自然な現代日本語である。
- source_word: ἐπιρίψαντες
  choice: 掛けると
  rationale: アオリスト分詞が主動詞に先立つ動作を表すことを、自然な継起表現で示した。衣を動物の背に置く場面では「掛ける」が「投げる」より自然である。
- source_word: αὐτῶν τὰ ἱμάτια
  choice: 自分たちの上着
  rationale: ἱμάτιαはこの場面では外衣を指す。「自分たちの」は主語である人々との帰属関係を明確にする。
- source_word: ἐπὶ τὸν πῶλον
  choice: 子ろばに
  rationale: 対格を伴うἐπίは、衣を子ろばの上へ置く動作を表す。日本語では「掛ける」と組み合わせて「子ろばに」とするのが自然である。
- source_word: πῶλον
  choice: 子ろば
  rationale: πῶλος自体は若い乗用動物を指し得るが、この物語の文脈ではろばの子である。「子ろば」は簡潔で、現代の読者にも場面が明瞭である。
- source_word: ἐπεβίβασαν
  choice: お乗せした
  rationale: この動詞は人を乗り物や動物に乗せる使役的意味を持つ。敬語の「お乗せした」は、物語文として自然にイエスへの敬意を表しつつ、原文の使役の意味を保つ。
- source_word: τὸν Ἰησοῦν
  choice: イエス
  rationale: 固有名詞Ἰησοῦςの標準的な日本語表記。
