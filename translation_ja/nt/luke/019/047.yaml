source:
  edition: SBLGNT
  text: Καὶ ἦν διδάσκων τὸ καθ’ ἡμέραν ἐν τῷ ἱερῷ· οἱ δὲ ἀρχιερεῖς καὶ οἱ γραμματεῖς ἐζήτουν αὐτὸν ἀπολέσαι καὶ οἱ πρῶτοι τοῦ λαοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/047.yaml
  text: And he was teaching day by day in the temple. But the chief priests and the scribes[a], and the leading men of the people, were seeking to destroy him,
translation:
  language: ja
  text: イエスは毎日、神殿で教えていた。しかし、祭司長たちと律法学者たち、そして民の有力者たち[a]は、イエスを殺そうとしていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「民の第一の者たち」。民の中で地位や影響力のある人々を指す。別訳「民の指導者たち」。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「イエスを滅ぼそうとしていた」。ここでは殺害して除き去ろうとする意図を指す。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἦν διδάσκων
  choice: 教えていた
  rationale: 迂言的未完了過去が表す、過去における継続的・反復的な行為を自然な現代日本語で示す。
- source_word: τὸ καθ’ ἡμέραν
  choice: 毎日
  rationale: 日ごとに繰り返されることを表す慣用句を、簡潔で自然な日本語にした。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόνは内陣だけでなく神殿境内全体を指し得るが、文脈上は標準的で簡潔な「神殿」とした。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: ユダヤの祭司指導層を指す定着した訳語を用いた。
- source_word: οἱ γραμματεῖς
  choice: 律法学者たち
  rationale: 単なる書記ではなく、律法の専門家としての歴史的役割が現代の読者に明確に伝わる訳語とした。
- source_word: ἐζήτουν
  choice: ～ようとしていた
  rationale: 未完了過去が示す継続的な企てを、自然な日本語で保持した。
- source_word: ἀπολέσαι
  choice: 滅ぼそう
  rationale: 文脈上は殺害を含む敵対的な排除を指すが、「殺す」より広いἀπόλλυμιの語義を保持した。殺害の意味も脚注で示した。
- source_word: οἱ πρῶτοι τοῦ λαοῦ
  choice: 民の有力者たち
  rationale: 直訳的には「民の第一の者たち」であり、民の中で高い地位や影響力を持つ人々を指すため、自然で過度に制度化しない表現とした。
theological_decisions:
- issue: οἱ πρῶτοι τοῦ λαοῦが指す集団の性格
  choice: 民の有力者たち
  alternative: 民の指導者たち／民の主だった人々
  rationale: この句は正式な役職名とは限らず、社会的・政治的に著名な人々を指し得るため、「指導者」と断定せず、地位と影響力の含意を保った。日本語では文法上の男性複数を不自然に明示しなかった。
- issue: ἀπολέσαιの敵対行為の範囲
  choice: 滅ぼそう
  alternative: 殺そう／死なせよう
  rationale: この文脈では殺害の意図が強い一方、原語には破滅させる、除き去るという広がりもあるため、本文では「滅ぼす」とし、より限定的な読みを脚注に残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。継続・反復を「毎日」「教えていた」「～ようとしていた」で示し、原文の未完了過去の流れを保った。節単独でも対象が明確になるよう、代名詞αὐτόνは「イエス」とした。
