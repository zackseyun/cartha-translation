source:
  edition: SBLGNT
  text: καλέσας δὲ δέκα δούλους ἑαυτοῦ ἔδωκεν αὐτοῖς δέκα μνᾶς καὶ εἶπεν πρὸς αὐτούς· ⸀Πραγματεύσασθε ⸂ἐν ᾧ⸃ ἔρχομαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/013.yaml
  text: After calling ten of his own servants[a], he gave them ten minas and said to them[c][b], “Do business until I come.”
translation:
  language: ja
  text: そこで彼は、自分の奴隷十人を呼び、彼らに十ミナ[a]を渡して言った。「私が帰って来るまで、商売をしなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ミナは古代の貨幣単位。
    reason: cultural_note
lexical_decisions:
- source_word: καλέσας
  choice: 呼び
  rationale: アオリスト分詞が主動詞に先立つ行為を示す。日本語では連用形により、自然に出来事の順序を表した。
- source_word: δούλους ἑαυτοῦ
  choice: 自分の奴隷
  rationale: δοῦλος は文脈により僕・奴隷を意味するが、ここでは主人に属する者という古代の主従関係が明確であるため「奴隷」とした。ἑαυτοῦ の再帰的な所有関係も「自分の」で保持した。
- source_word: δέκα μνᾶς
  choice: 十ミナ
  rationale: 古代の貨幣単位を現代通貨に置き換えず、歴史的名称を音写した。
- source_word: Πραγματεύσασθε
  choice: これで商売をしなさい
  rationale: 命じられているのは、渡された金を用いた取引・事業活動である。「商売をする」は方法を投資などに限定せず、現代日本語として明瞭である。ギリシア語では目的語が明示されないが、文脈上の手段を「これで」で自然に補った。
- source_word: ἐν ᾧ ἔρχομαι
  choice: 私が帰って来るまで
  rationale: この時間表現は、この文脈では主人が戻る時までを意味する。「帰って」を補うことで、単なる接近ではなく不在からの帰還であることを自然に示した。
theological_decisions:
- issue: たとえにおける δοῦλος の訳語
  choice: 奴隷
  alternative: 僕／召使い
  rationale: 所有を強調する ἑαυτοῦ と主人・奴隷という社会的枠組みを踏まえ、古代の拘束的身分関係を弱めない訳語を選んだ。比喩の神学的意味を訳語で先取りしてはいない。
- issue: ἐν ᾧ ἔρχομαι が示す帰還
  choice: 私が帰って来るまで
  alternative: 私が来るまで
  rationale: 物語では主人が旅立とうとしており、ここでの到来は帰還を指す。文脈上の意味を明確にしつつ、帰還の時期についてそれ以上の解釈は加えなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「そこで」は δέ の談話上の接続を自然に示す。「奴隷」は歴史的社会関係を明示する語として用い、婉曲化を避けた。命令文は硬すぎない「しなさい」とした。
