  yaml_path: translation/nt/luke/019/029.yaml
  text: And it happened that[a], as he came near to Bethphage and Bethany, toward the mount called Olives, he sent two of the disciples
translation:
  language: ja
  text: さて、イエスが、オリーブ山と呼ばれる山の方にあるベトファゲとベタニアに近づいたとき、弟子たちのうち二人を遣わした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: さて、…とき
  rationale: ルカの物語を進める定型句。日本語では出来事の発生を独立して述べるより、後続の時間節とまとめて「さて、…とき」とする方が自然で、物語上の接続も保てる。
- source_word: ὡς
  choice: …とき
  rationale: ここでは時間を示す接続表現。接近の途上という含みは「近づき」と文脈によって保持する。
- source_word: ἤγγισεν εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: ベトファゲとベタニアに近づき
  rationale: ἐγγίζω と εἰς の組み合わせを、二地点への接近として自然な現代日本語で表した。
- source_word: πρὸς τὸ ὄρος
  choice: 山の方まで来た
  rationale: πρός の方向・位置関係を表しつつ、直前の「近づき」と不自然に重ならないよう、移動の到達局面として表現した。
- source_word: τὸ καλούμενον Ἐλαιῶν
  choice: 「オリーブ」と呼ばれる山
  rationale: ギリシア語の圧縮された名称（字義的には「オリーブ〔の木々〕」）を本文に残し、慣用的な地名は脚注に示した。
- source_word: ἀπέστειλεν
  choice: 遣わした
  rationale: 単純な派遣を表す。聖書文として品位があり、現代日本語でも理解しやすい「遣わした」を採用した。
- source_word: δύο τῶν μαθητῶν
  choice: 弟子たちのうち二人
  rationale: 部分属格を明示的に表し、原文にない所有表現「自分の」は加えなかった。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、物語本文としての品位を保った。「遣わした」はやや文語的だが、現在も広く理解される自然な聖書語彙。地名表記は「ベトファゲ」「ベタニア」とした。
