  - severity: medium
    issue: 「『オリーブ』と呼ばれる山」および脚注の字義説明が、地名としての表現を不自然にしている。
    rationale: Ἐλαιῶν はこの箇所で「オリーブ山」という既知の地名の一部として機能する。日本語本文で「オリーブ山」と訳すことで固有名としての意味を自然に保持でき、語形を「オリーブ（の木々）」と説明する脚注は本文理解に不要である。
