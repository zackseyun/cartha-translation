id: LUK.19.33
reference: Luke 19:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λυόντων δὲ αὐτῶν τὸν πῶλον εἶπαν οἱ κύριοι αὐτοῦ πρὸς αὐτούς· Τί λύετε τὸν πῶλον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/033.yaml
  text: And as they were untying the colt[a], its owners said to them, “Why are you untying the colt?”
translation:
  language: ja
  text: 二人がその子ろばをほどいていると、持ち主たちが彼らに言った。「なぜ子ろばをほどくのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυόντων / λύετε
  choice: ほどいている／ほどく
  rationale: 動物をつないでいるものを解く具体的な動作として自然であり、同じ語根の反復も日本語で保った。
- source_word: δὲ
  choice: 〜と
  rationale: ここでは強い対比ではなく物語を進める軽い接続であり、分詞構文と主動詞の同時性を自然な日本語の「〜ていると」で表した。
- source_word: αὐτῶν
  choice: 二人が
  rationale: 直前の文脈で遣わされた二人を指す。日本語では単なる「彼ら」より指示対象が明確になる。
- source_word: τὸν πῶλον
  choice: その子ろば
  rationale: πῶλος自体は若い動物を指すが、直前の文脈でろばと特定されているため、「子ろば」が明瞭で自然。定冠詞は文脈上既知であることを「その」で示した。
- source_word: εἶπαν ... πρὸς αὐτούς
  choice: 彼らに言った
  rationale: 発話動詞と方向表現を簡潔に保ち、疑問内容であっても原文どおり「言った」とした。
- source_word: οἱ κύριοι αὐτοῦ
  choice: 持ち主たち
  rationale: κύριοιは複数形で、ここでは子ろばを所有・管理する人々を指す。「主人たち」より現代日本語で自然であり、神学的な「主」との誤解も避けられる。
- source_word: Τί
  choice: なぜ
  rationale: この疑問文では行為の理由・目的を尋ねる用法であり、日本語の「なぜ」が自然。
theological_decisions:
- issue: 非神学的な所有関係を表す κύριοι の訳
  choice: 持ち主たち
  alternative: 主人たち／主たち
  rationale: ここでκύριοιは子ろばの人間の所有者または管理者を指す。複数形を保ちつつ、キリストへの称号「主」を連想させない文脈的な訳を採用した。
translation_notes:
  register: 明快な現代標準日本語。物語の流れを「〜ていると」で自然に示し、「ほどく」の反復と「持ち主たち」の複数性を保持した。
