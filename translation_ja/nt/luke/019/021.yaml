  text: ἐφοβούμην γάρ σε ὅτι ἄνθρωπος αὐστηρὸς εἶ, αἴρεις ὃ οὐκ ἔθηκας καὶ θερίζεις ὃ οὐκ ἔσπειρας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/021.yaml
  text: 'for I was afraid of you[a], because you are a severe man: you take what you did not put down[b], and you reap what you did not sow.'
translation:
  language: ja
  text: あなたが怖かったからです。あなたは厳しい方で、置かなかったものを取り[a]、蒔かなかったものを刈り取るからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「置かなかったものを取る」。文脈により、「預けなかったものを回収する」と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβούμην
  choice: 怖かった
  rationale: 未完了過去が示す過去の継続的な恐れを、自然な現代日本語で表した。
- source_word: γάρ
  choice: からです
  rationale: 直前の発言の理由を示す説明的な接続を、日本語の文末表現で明確にした。
- source_word: ἄνθρωπος αὐστηρὸς
  choice: 厳しい方
  rationale: αὐστηρόςの厳格で容赦のない響きを保ちつつ、主人への直接発話として自然な敬称を用いた。これは僕自身の非難めいた評価であり、語り手の断定とはしていない。
- source_word: αἴρεις ὃ οὐκ ἔθηκας
  choice: 預けなかったものを取り立て
  rationale: 直訳的には「置かなかったものを取る」だが、金銭を巡る文脈で意味が伝わるよう最小限に具体化した。「取り立て」は不当に回収するという僕の非難の響きも保持する。
- source_word: θερίζεις ὃ οὐκ ἔσπειρας
  choice: 蒔かなかったものを刈り取る
  rationale: 種蒔きと収穫の農耕比喩および二つの動詞の対句をそのまま保った。
theological_decisions:
- issue: 僕による主人の描写を、主人像を擁護するために弱めるか
  choice: 僕の非難的な言い方を弱めずに保持する
  alternative: 「厳格な」「要求の多い」など、否定的な響きの弱い表現にする
  rationale: これは僕自身の弁明と告発である。翻訳は、その評価が客観的に正しいかを決めず、物語にある神学的・修辞的緊張を残す。
- issue: ὃ οὐκ ἔθηκαςの経済的含意をどこまで明示するか
  choice: 本文では「預けなかったもの」とし、直訳を脚注に示す
  alternative: 本文を「置かなかったもの」として語形対応を最優先する
  rationale: 前後の金銭的文脈では「預ける」が自然だが、τίθημι自体は特定の商業用語ではないため、脚注で直訳と別訳可能性を明示する。
translation_notes:
  register: 明瞭な現代標準日本語。主人への直接発話なので「方」を用いる一方、僕の恐れと非難の強さは保った。節末には引用の閉じ括弧を置き、この節が直前から続く発話の終わりであることを示した。
