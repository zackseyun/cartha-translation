id: LUK.19.8
reference: Luke 19:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σταθεὶς δὲ Ζακχαῖος εἶπεν πρὸς τὸν κύριον· Ἰδοὺ τὰ ⸀ἡμίσιά ⸂μου τῶν ὑπαρχόντων⸃, κύριε, ⸂τοῖς πτωχοῖς δίδωμι⸃, καὶ εἴ τινός τι ἐσυκοφάντησα ἀποδίδωμι τετραπλοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/008.yaml
  text: But Zacchaeus stood and said to the Lord[a], “Look, Lord, I give half of my possessions to the poor, and if I have extorted anything from anyone[b], I repay it fourfold.”
translation:
  language: ja
  text: そこで、ザアカイは立ち、主に言った。「主よ、ご覧ください。私は自分の財産の半分を貧しい人々に与えます。そして、もしだれかから何かを脅し取ったことがあれば[a]、四倍にして返します[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれかから何かをだまし取ったことがあれば」。このギリシア語動詞は、脅し取り、搾取、詐取を指すことがあり、虚偽の訴えによる場合もあります。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の「与えます」と「返します」は現在形ですが、「与えることにします」「返すことにします」という、その場での決意を表すとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: σταθεὶς
  choice: 立ち上がって
  rationale: ἵστημιのアオリスト受動分詞を自動詞的に用いた形。発言に際して姿勢を定めたという物語上の動作を、現代日本語で自然に表す。
- source_word: κύριον / κύριε
  choice: 主／主よ
  rationale: イエスを指す称号・呼びかけとしてのκύριοςを保ち、単なる敬称の「先生」に限定しない。
- source_word: Ἰδοὺ
  choice: ご覧ください
  rationale: 相手の注意を強く促す語。呼びかけの相手に敬意を示しつつ、古風すぎない表現とした。
- source_word: τὰ ἡμίσιά μου τῶν ὑπαρχόντων
  choice: 自分の財産の半分
  rationale: ὑπάρχονταはここでは所有物・財産を指し、部分を表す構文を明瞭な日本語にした。
- source_word: τοῖς πτωχοῖς
  choice: 貧しい人々に
  rationale: πτωχόςの名詞的用法を、社会的・経済的困窮を示す自然な日本語で表した。
- source_word: δίδωμι
  choice: 与えます
  rationale: 現在直説法を日本語の非過去形で表し、現在の習慣か、その場での決意かを本文だけで決めない。
- source_word: εἴ τινός τι
  choice: もしだれかから何かを
  rationale: 不定代名詞を重ねた「だれかから何かを」という意味を、日本語として明瞭な語順で保持した。
- source_word: ἐσυκοφάντησα
  choice: 脅し取ったことがあれば
  rationale: συκοφαντέωは、権力の濫用や虚偽の訴えなどによる強要・詐取を表し得る。徴税人という文脈と返還の話に適合する「脅し取る」を本文に採り、より広い「だまし取る」の可能性は脚注に示した。
- source_word: ἀποδίδωμι
  choice: 返します
  rationale: 受け取ったものを返却・弁償する意味。日本語では「四倍にして」と組み合わせることで、償還の意味が明確になる。
- source_word: τετραπλοῦν
  choice: 四倍にして
  rationale: 四倍の償いを表す副詞的対格を、自然で正確な日本語にした。
theological_decisions:
- issue: δίδωμιとἀποδίδωμιの現在時制が表す時間的意味
  choice: 日本語の非過去形「与えます」「返します」とする
  alternative: 「今から与えます」「返すことにします」として、その場での決意を明示する／「いつも与えています」「返しています」として従来の習慣を明示する
  rationale: ギリシア語の現在直説法は、現在の実践とも、その場で表明された即時の決意とも理解され得る。日本語の非過去形を用いることで、ザアカイが以前から正しく行っていたのか、新たに悔い改めを表明したのかという神学的緊張を一方に決めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話には敬意と品位を持たせた。「見よ」のような古風な語は避けつつ、ザアカイの強調は「ご覧ください」で保持した。本文中の[a]は語義の幅が問題となる箇所、[b]は二つの現在形をまとめて注記できる文末に置いた。
