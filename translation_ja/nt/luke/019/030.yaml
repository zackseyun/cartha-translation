  text: ⸀λέγων· Ὑπάγετε εἰς τὴν κατέναντι κώμην, ἐν ᾗ εἰσπορευόμενοι εὑρήσετε πῶλον δεδεμένον, ἐφ’ ὃν οὐδεὶς πώποτε ἀνθρώπων ἐκάθισεν, ⸀καὶ λύσαντες αὐτὸν ἀγάγετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/030.yaml
  text: saying, “Go into the village opposite you, in which, as you enter, you will find a colt tied up, on which no one among men has ever sat. Untie it and bring it.”
translation:
  language: ja
  text: こう言われた。「向かいの村へ行きなさい。そこに入ると、これまでだれも乗ったことのない、つながれている子ろばを見つけます。それを解いて、連れて来なさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κώμη
  choice: 村
  rationale: 集落を指す一般的な語であり、現代日本語として自然で明確。
- source_word: πῶλον
  choice: 子ろば
  rationale: 語自体は若い馬・ろばを指し得るが、ルカ19章の文脈にある引用・物語上の対象を踏まえ、自然な日本語で「子ろば」とした。
- source_word: δεδεμένον
  choice: つながれている
  rationale: δέωの完了受動分詞が示す、つながれた状態を自然に表す。
- source_word: λύσαντες
  choice: 解いて
  rationale: つないでいるものを外す動作を簡潔に表現する。
- source_word: ἀγάγετε
  choice: 連れて来なさい
  rationale: 話者のもとへ動物を導いて来る命令として自然。
theological_decisions:
- issue: 「だれも乗ったことがない」という記述の保持
  choice: まだだれも乗ったことのない
  alternative: 人間のうちだれも、かつてその上に座ったことのない
  rationale: 原文の強調を保ちつつ、動物について日本語で自然な「乗る」を用いた。儀礼的・象徴的意味は本文で説明せず、記述そのものを保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語。命令文は威圧的になりすぎない「〜なさい」で統一し、聖書本文としての品位を保った。
