id: LUK.19.46
reference: Luke 19:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων αὐτοῖς· Γέγραπται· ⸂Καὶ ἔσται⸃ ὁ οἶκός μου οἶκος ⸀προσευχῆς, ὑμεῖς δὲ αὐτὸν ἐποιήσατε σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/046.yaml
  text: saying to them[a], “It is written[b], ‘And my house shall be a house of prayer,’ but you have made it a den of robbers.”
translation:
  language: ja
  text: 彼らに言われた。「こう書かれている。『そして、わたしの家は祈りの家となる。』[a] だが、あなたがたはそれを強盗たちの巣にしてしまった。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そして、わたしの家は祈りの家となる」はイザヤ56:7を踏まえた引用。ここで「家」は神殿を指す。
    reason: cross_reference
  - marker: b
    text: 「強盗たちの巣」はエレミヤ7:11を踏まえた表現。「強盗たち」は「盗賊たち」とも訳せる。
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: λέγων αὐτοῖς
  choice: 彼らに言われた
  rationale: 分詞は直前の物語に従属するが、日本語では独立した発話導入にすると自然であり、イエスが彼らに語ったことも明確になる。
- source_word: Γέγραπται
  choice: こう書かれている
  rationale: 完了受動形による聖書引用の定型表現を、権威ある記述が現在も有効である含意を保つ自然な日本語で表した。
- source_word: Καὶ ἔσται ὁ οἶκός μου οἶκος προσευχῆς
  choice: わたしの家は祈りの家となる
  rationale: οἶκοςを二度とも「家」とし、イザヤ56:7との語句上の響きを保持した。文頭のκαίは引用元の文脈を受ける語だが、単独の日本語引用では不自然なため明示しなかった。
- source_word: ὑμεῖς δὲ
  choice: ところが、あなたがたは
  rationale: 明示された主語ὑμεῖςの強調と、前半との鋭い対比を自然な日本語で示した。
- source_word: ἐποιήσατε
  choice: してしまった
  rationale: アオリストの行為を表しつつ、神の家を変質させた非難と、その結果としての現状を自然に伝える。
- source_word: σπήλαιον λῃστῶν
  choice: 強盗たちの巣
  rationale: エレミヤ7:11を反映する慣用的な比喩として「巣」を用いた。λῃστήςは強盗・追いはぎ・武装した賊を指し得るため、政治的意味に限定しない「強盗」とした。
theological_decisions:
- issue: 神殿を指すοἶκοςの訳語
  choice: わたしの家
  alternative: わたしの神殿
  rationale: 文脈上は神殿を指すが、ギリシア語とイザヤ56:7の引用は「家」としている。比喩と聖書間のつながりを解釈的に平板化しないため、「家」を本文に残した。
- issue: λῃστῶνの意味範囲
  choice: 強盗たち
  alternative: 追いはぎたち／武装した賊たち
  rationale: 語は暴力的な略奪者や武装集団も指し得るが、ここで政治的反乱者に限定する根拠はない。広い意味を保つ「強盗たち」とした。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書引用には簡潔で格調ある調子を保った。「家」「祈りの家」「強盗たちの巣」という原文の対照を明確にした。
