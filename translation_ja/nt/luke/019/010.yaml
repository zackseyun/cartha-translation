  text: For the Son of Man came to seek and to save the lost[a].
translation:
  language: ja
  text: 人の子は、失われたものを捜して救うために来たのである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「失われた者」。ギリシア語の表現は中性単数で、総称的に理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: 来た
  rationale: アオリスト直説法を、この使命を要約する文にふさわしい簡潔な過去形で表した。
- source_word: γὰρ
  choice: のである
  rationale: 直前の発言に理由・説明を与える接続関係を、日本語として自然な文末表現で示した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称であり、ダニエル書を背景とする称号として、伝統的かつ明瞭な訳語を保持した。
- source_word: ζητῆσαι
  choice: 捜して
  rationale: 意図的に見いだそうとする行為を表し、後続の「救う」と目的を自然に連結した。
- source_word: σῶσαι
  choice: 救う
  rationale: 身体的救出に限定されない、ルカ福音書における広い救済的意味を保った。
- source_word: τὸ ἀπολωλός
  choice: 失われた者
  rationale: 完了分詞が示す「失われた状態」と、文脈上の人への適用を自然に表した。ギリシア語は中性単数で総称的にも理解できるため、その幅は脚注で示した。
theological_decisions:
- issue: τὸ ἀπολωλός の範囲とニュアンス
  choice: 失われた者
  alternative: 失われたもの
  rationale: 直近ではザアカイという人物に当てはまりつつ、イエスの使命を広く述べる総称的表現として読める訳にした。中性単数を「一人の男性」だけに限定せず、別訳を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、宣言としての格調を保った。「のである」によって前節への説明関係を示し、語順は使命の主体と目的が明確になるよう整えた。
