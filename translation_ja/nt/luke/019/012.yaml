id: LUK.19.12
reference: Luke 19:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν· Ἄνθρωπός τις εὐγενὴς ἐπορεύθη εἰς χώραν μακρὰν λαβεῖν ἑαυτῷ βασιλείαν καὶ ὑποστρέψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/012.yaml
  text: So he said[a], “A certain nobleman went to a distant country to receive a kingdom for himself and return.”
translation:
  language: ja
  text: そこで、こう言われた。「ある高貴な生まれの人が、自分のために王国[a]を授かって帰って来るため、遠い国へ旅立った。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「王位」または「王権」とも訳せる。ギリシア語は、王国そのものを指す場合と、王として治める地位や権威を指す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受ける推論的・叙述的なつながりを、現代日本語で自然に示す。
- source_word: Ἄνθρωπός τις
  choice: ある…人
  rationale: たとえ話に登場する不特定の人物を導入する表現として自然であり、τιςの不定性を保つ。
- source_word: εὐγενὴς
  choice: 高貴な生まれの
  rationale: 単に人格が高潔であるという意味ではなく、高い家柄や身分の出身であることを明示する。
- source_word: ἐπορεύθη
  choice: 旅立った
  rationale: 遠国への移動を表す文脈に合い、単なる「行った」よりも旅程を自然に伝える。
- source_word: εἰς χώραν μακρὰν
  choice: 遠い国へ
  rationale: χώραの地域・国という意味と、μακράの地理的な隔たりを簡潔に表す。
- source_word: λαβεῖν
  choice: 授かって
  rationale: この政治的文脈では、自力で奪取するよりも、王国または統治権を上位者から認められて受ける意味が適切である。
- source_word: ἑαυτῷ
  choice: 自分のために
  rationale: 再帰代名詞の与格が示す、本人自身のために受けるという意味を明示する。
- source_word: βασιλείαν
  choice: 王国
  rationale: 領域としての王国と王としての支配・権威の双方を取り得る語であるため、本文では伝統的かつ具体的な「王国」を採り、意味の幅を脚注に残す。
- source_word: ὑποστρέψαι
  choice: 帰って来る
  rationale: 出発地点へ戻る動作を、現代日本語で明瞭に表す。λαβεῖνと並ぶ目的を「授かって帰って来るため」と自然に構成した。
theological_decisions:
- issue: 政治的含意を持つたとえにおける βασιλείαν の意味
  choice: 王国
  alternative: 王位、王権
  rationale: 語は支配領域としての王国にも、王としての身分・統治権にもなり得る。本文で一方に限定せず、脚注で政治的な権威授与という解釈可能性を明示する。
translation_notes:
  register: 明快で格調のある現代標準日本語。主語はギリシア語本文に明示されていないため、「イエス」を補わず「こう言われた」とした。「高貴な生まれの」によって家柄・身分の意味を誤解なく示した。
