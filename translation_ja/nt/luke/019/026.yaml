source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν ὅτι παντὶ τῷ ἔχοντι δοθήσεται, ἀπὸ δὲ τοῦ μὴ ἔχοντος καὶ ὃ ἔχει ⸀ἀρθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/026.yaml
  text: I tell you that to everyone who has[a], more will be given; but from the one who does not have, even what he has will be taken away.
translation:
  language: ja
  text: あなたがたに言います。持っている人はだれでも、与えられます。しかし、持っていない人からは、持っているものまでも取り上げられます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: あなたがたに言う
  rationale: 現在形による直接的で重みのある導入を、簡潔で自然な現代日本語にした。
- source_word: παντὶ τῷ ἔχοντι
  choice: 持っている人はだれでも
  rationale: πᾶςと名詞的に用いられた分詞の組み合わせが示す一般的な範囲を保ち、何を持つかは原文どおり明示しない。
- source_word: δοθήσεται
  choice: さらに与えられる
  rationale: 語形そのものは「与えられる」だが、前後の対照が示す増加の含意を自然な日本語で表すため「さらに」を補った。原文に明示されない補足であることは脚注に示した。
- source_word: ἀπὸ δὲ τοῦ μὴ ἔχοντος
  choice: しかし、持っていない人は
  rationale: δέの対照を「しかし」で示した。日本語では受身文の起点を表す「から」を後続の「取り上げられる」とともに直訳すると不自然になりやすいため、主題化して明瞭にした。
- source_word: καὶ ὃ ἔχει
  choice: 持っているものまで
  rationale: ここで強意的に働くκαίを「まで」とし、すでに所有しているものさえ失うという対照を表した。
- source_word: ἀρθήσεται
  choice: 取り上げられる
  rationale: αἴρωの未来受動形がここで表す、所有物を奪われる意味を簡潔に表した。
theological_decisions:
- issue: 増加と喪失を述べる格言の解釈範囲
  choice: 救い、功績、予定などの教理的説明を訳文に加えず、格言として簡潔に訳す。
  alternative: たとえの文脈に限定した管理責任の原則、またはより広い神の国の原則として明示的に訳す。
  rationale: 本文自体は、この原則が働く神学的仕組みや適用範囲を明示していないため、その緊張と解釈の余地を保った。
translation_notes:
  register: 明瞭で簡潔な現代標準語。イエスの宣言の重みを保ちながら、古風な語法や説明的な教理用語を避けた。
