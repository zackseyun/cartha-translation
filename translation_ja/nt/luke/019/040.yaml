source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀εἶπεν· Λέγω ὑμῖν, ⸀ὅτι ἐὰν οὗτοι ⸀σιωπήσουσιν, οἱ λίθοι ⸀κράξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/040.yaml
  text: And answering[a], he said, “I tell you, if these become silent, the stones will cry out.”
translation:
  language: ja
  text: イエスは答えて言われた。「あなたがたに言います。もしこの人たちが黙れば[a]、石が叫びます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「黙るなら」または「声を出さなくなるなら」。
    reason: σιωπάωは、声を上げるのをやめて黙ること、または黙った状態にあることを表しうるため。
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 答えて言われた
  rationale: 応答を表す分詞と、発言を表す定動詞の両方を保ちつつ、日本語として通る形にした。文脈上の話者がイエスであることは、日本語で自然に明示した。
- source_word: Λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 相手への直接的で権威ある告知を、古風になりすぎない現代標準語で表した。
- source_word: οὗτοι
  choice: この人たち
  rationale: 文脈では弟子たち、または賛美している人々を指すが、対象をそれ以上限定せず、指示語の力を自然な日本語で表した。
- source_word: σιωπήσουσιν
  choice: 黙れば
  rationale: 現在声を上げている者たちが発言をやめるという条件を簡潔に表した。ギリシア語の未来形は条件節内にあり、日本語では単純な条件表現が自然である。
- source_word: οἱ λίθοι
  choice: 石が
  rationale: 定冠詞を独立して訳し分けにくい日本語の性質に従い、具体的で鮮烈な『石』という像をそのまま保った。
- source_word: κράξουσιν
  choice: 叫び出します
  rationale: 大きな声を上げる意味と、沈黙との鮮明な対比を表した。『出す』により、石が声を上げ始める劇的な動きを自然に伝える。
theological_decisions:
- issue: 石が叫ぶという言葉を比喩または奇跡として明示するか
  choice: 『石が叫び出します』という像を説明なしに保持する
  alternative: 『被造物そのものが神を賛美する』などと解釈して訳す
  rationale: 原文はこの像の性質を説明していないため、誇張、預言的イメージ、奇跡の可能性のいずれかに限定せず、修辞的・神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの発言には簡潔で dignified な調子を保った。敬体の直接話法により権威ある語り口を示し、『石が叫ぶ』という原文の鮮烈さと曖昧さは解釈で弱めていない。
