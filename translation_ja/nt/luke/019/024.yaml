id: LUK.19.24
reference: Luke 19:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τοῖς παρεστῶσιν εἶπεν· Ἄρατε ἀπ’ αὐτοῦ τὴν μνᾶν καὶ δότε τῷ τὰς δέκα μνᾶς ἔχοντι—
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/024.yaml
  text: And he said to those standing by[a], ‘Take the mina from him and give it to the one who has the ten minas.’
translation:
  language: ja
  text: そして、そばに立っていた人々に言った。「その人からその一ミナ[a]を取り上げ、十ミナを持っている者に与えなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ミナは古代の貨幣単位。伝統的には「ポンド」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῖς παρεστῶσιν
  choice: そばに立っていた人々
  rationale: 定冠詞を伴う完了能動分詞の実質名詞用法。近くに居合わせた人々を指し、場面の具体性を保ちながら自然な日本語とした。
- source_word: Ἄρατε ἀπ’ αὐτοῦ
  choice: その人から…取り上げなさい
  rationale: αἴρωはここでは持ち上げることではなく、所有者から取り去ることを表す。ἀπόの分離の意味も明示した。
- source_word: τὴν μνᾶν
  choice: その一ミナ
  rationale: μνᾶを古代の貨幣単位名「ミナ」として音写し、定冠詞は文脈上すでに言及された一ミナを示す「その」で表した。
- source_word: δότε
  choice: 与えなさい
  rationale: δίδωμιのアオリスト命令法複数。単純な移譲を表すため、明快な「与えなさい」とした。
- source_word: τῷ τὰς δέκα μνᾶς ἔχοντι
  choice: 十ミナを持っている者に
  rationale: 定冠詞付き分詞の実質名詞用法を「者」と訳し、原文に明示されない性別を補わなかった。十ミナは前に登場した特定の額だが、日本語では定性を無理なく文脈に委ねた。
theological_decisions:
- issue: 貨幣単位 μνᾶ の訳し方
  choice: ミナ
  alternative: ポンド
  rationale: 現代の重量・通貨単位との混同を避け、ギリシア語が示す古代の貨幣単位を歴史的名称のまま保持した。教理的意味を付加しない。
translation_notes:
  register: 明快な現代標準語を用い、命令の直接性と物語の格調を保った。「その人」は直前の僕を指し、「者」は原文にない性別情報を加えない表現である。
