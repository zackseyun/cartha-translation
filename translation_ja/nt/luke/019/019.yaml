  yaml_path: translation/nt/luke/019/019.yaml
  text: And he said to this one also[a], ‘And you, be over five cities.’
translation:
  language: ja
  text: また、もう一人にも言った。「あなたも五つの町を治めなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ καὶ τούτῳ
  choice: また、もう一人にも言った
  rationale: δέとκαίが示す前のしもべとの連続性を「また」「にも」で表した。τούτῳは直訳すれば「この者」だが、現代日本語の物語として自然な「もう一人」とした。
- source_word: Καὶ σὺ
  choice: あなたも
  rationale: καίが示す追加と、σύによる直接的で強調された呼びかけを簡潔に保った。
- source_word: ἐπάνω γίνου
  choice: 治めなさい
  rationale: ἐπάνωとγίνουの組み合わせは、複数の町の上に立つ権限を与える命令を表す。「治める」は統治権を自然に示しつつ、任命か権限行使かを過度に限定しない。
- source_word: πέντε πόλεων
  choice: 五つの町
  rationale: πόλιςを現代日本語で広く自然に通じる「町」とした。属格はἐπάνωにかかり、統治の対象を示す。
