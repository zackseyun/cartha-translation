  text: And he hurried down and welcomed him joyfully[a].
translation:
  language: ja
  text: そこで彼は急いで降りて来て、喜んでイエスを迎え入れた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は急いで降りて来て、喜びながらイエスを受け入れた。」
    reason: 「ὑπεδέξατο」は「受け入れた」、「χαίρων」は「喜びながら」とも訳せるため。
lexical_decisions:
- source_word: σπεύσας
  choice: 急いで
  rationale: アオリスト分詞が示す、すぐに行動したことと熱意を、自然な現代日本語で表す。
- source_word: κατέβη
  choice: 降りて来て
  rationale: 木の上から下へ移動する方向を明確にし、日本語の物語文として自然につなぐ。
- source_word: ὑπεδέξατο
  choice: 迎え入れた
  rationale: 単に受け取るのではなく、人を快く受け入れるという語のもてなしの含意を保つ。
- source_word: αὐτόν
  choice: イエスを
  rationale: 日本語では代名詞の「彼を」だとザアカイを指すようにも読めるため、文脈上の指示対象であるイエスを明示する。
- source_word: χαίρων
  choice: 喜んで
  rationale: 迎え入れる行為に伴う喜びを表す現在分詞を、自然な副詞表現で訳す。
- source_word: καὶ ... καὶ
  choice: そこで…て
  rationale: 単純な出来事の連続を保ちつつ、直前の命令に応じた展開として自然な日本語の接続にする。
