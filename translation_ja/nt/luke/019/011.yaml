id: LUK.19.11
reference: Luke 19:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀκουόντων δὲ αὐτῶν ταῦτα προσθεὶς εἶπεν παραβολὴν διὰ τὸ ἐγγὺς ⸂εἶναι Ἰερουσαλὴμ αὐτὸν⸃ καὶ δοκεῖν αὐτοὺς ὅτι παραχρῆμα μέλλει ἡ βασιλεία τοῦ θεοῦ ἀναφαίνεσθαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/011.yaml
  text: As they were hearing these things[a], he went on and told a parable, because he was near Jerusalem and because they supposed that the kingdom of God was about to appear immediately.
translation:
  language: ja
  text: 人々がこれらのことを聞いていると、イエスは続けて一つのたとえを話された。エルサレムの近くにおられ、また人々が、神の国はすぐにも現れる[a]と思っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すぐにも明らかになる」。この動詞は、見えるようになること、または明らかになることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀκουόντων δὲ αὐτῶν ταῦτα
  choice: 人々がこれらのことを聞いていると
  rationale: 属格独立構文と現在分詞が示す同時進行を、自然な現代日本語で表した。
- source_word: προσθεὶς εἶπεν παραβολὴν
  choice: 続けて一つのたとえを話された
  rationale: 発言をさらに続けるという慣用的な意味を表し、「たとえ」という福音書で定着した用語を保った。
- source_word: διὰ τὸ ἐγγὺς εἶναι Ἰερουσαλὴμ αὐτὸν
  choice: エルサレムの近くにおられ
  rationale: διάと冠詞付き不定詞の理由を表す働きを保ち、近くにいたのがイエスであることを明瞭にした。
- source_word: δοκεῖν αὐτοὺς
  choice: 人々が……と思っていた
  rationale: 人々の認識・予想を示し、確信の度合いを強めすぎない一般的で自然な表現とした。
- source_word: παραχρῆμα
  choice: すぐにも
  rationale: 切迫した即時性を自然な日本語で表す。
- source_word: μέλλει ... ἀναφαίνεσθαι
  choice: 現れる
  rationale: μέλλωの切迫性は「すぐにも」で示し、ἀναφαίνεσθαιの「目に見えるようになる、顕現する」という意味を簡潔に表した。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: ルカ福音書全体との用語上の連続性を保つ、標準的で明瞭な訳語である。
theological_decisions:
- issue: 神の国がどのように現れると期待されていたか
  choice: 「神の国はすぐにも現れる」とし、顕現の形態を特定しない
  alternative: 政治的に樹立される／終末に完全に現される
  rationale: 本文は人々が神の国の差し迫った顕現を予想していたことを述べるが、それが政治的、黙示的、霊的なもののいずれかを明示していないため、その緊張と曖昧さを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、福音書にふさわしい落ち着いた敬体的叙述とした。「イエス」は日本語で主語を明確にするため文脈から補った。脚注記号は対応語「現れる」の直後に置いた。
