id: LUK.19.9
reference: Luke 19:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτὸν ὁ Ἰησοῦς ὅτι Σήμερον σωτηρία τῷ οἴκῳ τούτῳ ἐγένετο, καθότι καὶ αὐτὸς υἱὸς Ἀβραάμ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/009.yaml
  text: And Jesus said to him[a], “Today salvation has come to this house, because he too is a son of Abraham.”
translation:
  language: ja
  text: イエスは彼に言われた。「今日、この家[a]に救いが訪れた。彼もまたアブラハムの子なのだから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家」は、建物そのもののほか、そこに属する世帯や家の者を指すこともある。
    reason: οἶκοςの『家／世帯』という語義の幅を示すため。
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: そこで……言われた
  rationale: δέは弱い接続を示す。日本語の物語の流れに自然につなげ、強い対比を持ち込まない「そこで」とした。イエスへの敬意を自然に表すため「言われた」を用いた。
- source_word: πρὸς αὐτὸν
  choice: 彼に
  rationale: ギリシア語の代名詞をそのまま反映した。本文にない「ザアカイ」を補わない。
- source_word: Σήμερον
  choice: 今日
  rationale: 文頭の位置を保ち、時間的な強調を明確に伝える現代日本語である。
- source_word: σωτηρία
  choice: 救い
  rationale: ルカ文書における神学的な含意を保ちつつ、一般の読者にも自然で明瞭な語を選んだ。
- source_word: τῷ οἴκῳ τούτῳ
  choice: この家に
  rationale: οἶκοςの直接的な意味と、家族・家の者を含みうる幅を日本語の「家」によって保った。
- source_word: ἐγένετο
  choice: 訪れた
  rationale: 字義的には「生じた／起こった」だが、σωτηρίαとの結びつきでは、救いの到来を自然に表す「訪れた」が適切である。
- source_word: καθότι
  choice: ……なのだから
  rationale: 前の宣言の理由を示す接続詞の働きを、自然で明瞭な日本語として表した。
- source_word: καὶ αὐτὸς
  choice: 彼もまた
  rationale: ザアカイを包摂する強調を過不足なく保つ。
- source_word: υἱὸς Ἀβραάμ
  choice: アブラハムの子
  rationale: 民族的子孫と契約共同体への帰属の両方を響かせうる原文の慣用表現を保持した。
theological_decisions:
- issue: 「アブラハムの子」の意味
  choice: 「アブラハムの子」という表現をそのまま保ち、民族的血統、信仰・契約上の帰属、またはその両方のいずれかに限定しない。
  alternative: 「アブラハムの子孫」または「アブラハムの信仰に連なる者」と明示する。
  rationale: この節だけでは意味を一つに限定できない。原文の神学的な緊張と含意の幅を保存する。
- issue: 「この家」が指す範囲
  choice: 本文では「この家」とし、建物だけでなく家族・家の者を含みうる表現として読む。
  alternative: 「この家族」または「この家の者たち」と限定する。
  rationale: οἶκοςには家屋と世帯の両義があり、日本語の「家」も一定程度その幅を保持できるため、本文で一方に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。短い宣言の力強さを保ち、教派的解釈を付加しない。
