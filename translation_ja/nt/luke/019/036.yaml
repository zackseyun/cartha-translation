base_translation:
  language: en
  yaml_path: translation/nt/luke/019/036.yaml
  text: And as he went[a], they were spreading their cloaks on the road.
translation:
  language: ja
  text: イエスが進んで行くと、人々は自分たちの上着[a]を道に敷いていった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「衣服」、または「外衣」。
    reason: ἱμάτιαは衣服一般を指すことも、外側に着る衣を指すこともあり、語義に幅があるため。
lexical_decisions:
- source_word: πορευομένου δὲ αὐτοῦ
  choice: イエスが進んで行くと
  rationale: 属格絶対の現在分詞が、主動詞と同時に進行する動作を示す。「進んで行くと」は自然な現代日本語で場面の推移を表す。αὐτοῦは文脈上イエスを指すため、明瞭さを優先して固有名で示した。
- source_word: δέ
  choice: （「と」による文の接続に含める）
  rationale: ここでは弱い物語上の接続であり、独立した逆接語を置かず、従属節から主節への自然なつながりに反映した。
- source_word: ὑπεστρώννυον
  choice: 敷いていった
  rationale: 未完了過去が示す継続的・反復的な動作を表し、人々が進行に合わせて次々と道に衣を敷く情景を伝える。
- source_word: τὰ ἱμάτια ἑαυτῶν
  choice: 自分たちの上着
  rationale: ἱμάτιαは一般に衣服、とりわけ外に着る衣を指し得る。この場面で道に敷く具体的な物として、現代日本語で自然な「上着」を採用した。再帰代名詞の意味は「自分たちの」で明示した。
- source_word: ἐν τῇ ὁδῷ
  choice: 道に
  rationale: 衣を敷く場所を示す。日本語では動作の到達・配置場所として「道に」が最も自然で、「道の上に」より簡潔である。
