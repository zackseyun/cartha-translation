  text: So those who were sent went away and found it just as he had told them[a].
translation:
  language: ja
  text: そこで、遣わされた二人は出かけて行き、イエスが彼らに言われたとおりであるのを見つけた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼が彼らに言ったとおりに見つけた」。原文では「見つけた」の目的語は明示されていない。文脈では、イエスが述べられた子ろばとその状況を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπελθόντες
  choice: 行ってみると
  rationale: アオリスト分詞が主動詞に先立つ移動を表す。日本語では「行ってみると」とすることで、出かけた後に発見したという自然な物語の流れを示す。
- source_word: δὲ
  choice: そこで
  rationale: 物語の進行と、直前の指示を受けた行動を自然に結ぶ接続表現とした。
- source_word: οἱ ἀπεσταλμένοι
  choice: 遣わされた二人
  rationale: 冠詞付き完了受動分詞の受動的意味を保つ。人数は直前の19:29に明示されているため、文脈上の指示対象を日本語で明確にした。
- source_word: εὗρον
  choice: とおりであった
  rationale: 原文では目的語が明示されず、文脈から子ろばを見つけたことが理解される。日本語では後続の比較句と合わせて「言われたとおりであった」とし、目的語を補わず自然に表現した。
- source_word: καθὼς
  choice: とおり
  rationale: イエスの言葉と実際の状況との一致を、過度に強調せず自然に表す。
- source_word: εἶπεν αὐτοῖς
  choice: イエスが言われた
  rationale: 主語は原文では代名詞的に省略されているが、文脈上イエスであるため明示した。敬意を伴う現代日本語として「言われた」を用いた。αὐτοῖς（彼らに）は日本語では文脈から明白なため省略した。
