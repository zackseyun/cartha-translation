  text: ⸀λέγει αὐτῷ· Ἐκ τοῦ στόματός σου κρίνω σε, πονηρὲ δοῦλε· ᾔδεις ὅτι ἐγὼ ἄνθρωπος αὐστηρός εἰμι, αἴρων ὃ οὐκ ἔθηκα καὶ θερίζων ὃ οὐκ ἔσπειρα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/022.yaml
  text: He said to him[a], ‘Out of your own mouth I will judge you, wicked servant. You knew that I am a harsh man[d][c][b], taking up what I did not lay down and reaping what I did not sow?’
translation:
  language: ja
  text: 彼はその者に言った。「悪い奴隷よ。おまえ自身の口から出たことばによって、私はおまえを裁こう。[a] おまえは、私が厳しい人間で、私が置かなかったものを取り上げ、種をまかなかったものを刈り取る者だと知っていたのか。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「おまえ自身のことばに基づいて、私はおまえを裁こう」。直訳は「おまえの口から、私はおまえを裁こう」。
    reason: lexical_alternative
  - marker: b
    text: 「置かなかったもの」は、文脈上「預けなかったもの」とも訳せる。また、原文は「種をまかなかった所で」ではなく、「種をまかなかったものを」となっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ τοῦ στόματός σου
  choice: おまえ自身の口から出たことばによって
  rationale: 「あなたの口から」を直訳的に残しつつ、判断の根拠が本人の発言であるというギリシア語の慣用的意味が現代日本語で明確に伝わる形にした。
- source_word: κρίνω
  choice: 裁こう
  rationale: 未来形の意味を保ち、「罪に定める」と限定せず、広い意味を持つ「裁く」を用いた。
- source_word: πονηρὲ
  choice: 悪い
  rationale: 直接呼びかけにおける道徳的非難を自然に表す。「邪悪な」はこの文脈ではやや強く荘重すぎる。
- source_word: δοῦλε
  choice: 奴隷
  rationale: 主人に所有・支配される従属的身分がたとえの中で明瞭なため、「しもべ」ではなく「奴隷」とした。
- source_word: ᾔδεις
  choice: 知っていたのか
  rationale: οἶδαの過去的な形を自然な日本語で表し、SBLGNTの疑問符に従って修辞的な問いとして訳した。
- source_word: αὐστηρός
  choice: 厳しい
  rationale: 要求が厳しく容赦しないという否定的含みを持ちながら、現代日本語として過度に解釈的でない。
- source_word: αἴρων
  choice: 取り上げ
  rationale: αἴρωの基本的な像を保ち、後続する「置かなかったもの」と対応させた。
- source_word: ὃ οὐκ ἔθηκα
  choice: 自分が置かなかったもの
  rationale: τίθημιの広い意味と動作の比喩を保ち、金融上の「預ける」に限定しなかった。
- source_word: θερίζων
  choice: 刈り取る
  rationale: 「種をまく」と対になる農耕の比喩を自然に保持した。
- source_word: ὃ οὐκ ἔσπειρα
  choice: 種をまかなかったもの
  rationale: 関係代名詞が場所ではなく目的語を指す形を保ち、「まかなかった所で」とはしなかった。
theological_decisions:
- issue: たとえの主人とδοῦλοςの関係をどう表すか
  choice: 奴隷
  alternative: しもべ／僕
  rationale: この場面では主人への法的・社会的従属が前景化しているため、古代の身分関係を弱めずに表した。
- issue: 主人の自己描写を事実として断定するか、奴隷の主張の引用として示すか
  choice: 原文どおり「知っていたのか」という修辞的問いの中に置く
  alternative: 「おまえの言うとおり、私は厳しい人間だ」または「おまえは私を厳しい人間だと言った」
  rationale: 本文は主人の性格についての神学的評価を明示せず、奴隷自身のことばを用いて裁く修辞を展開している。説明を加えて一方に決めず、その緊張を残した。
translation_notes:
  register: 現代の一般読者に明瞭な、威厳のある口語体。主人の強い叱責は保つが、古風な終助詞や過度に芝居がかった表現は避けた。「おまえ」は上下関係と直接的な非難を示すために採用した。
