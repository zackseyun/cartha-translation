  text: καὶ ἰδοὺ ἀνὴρ ὀνόματι ⸀καλούμενος Ζακχαῖος, καὶ αὐτὸς ἦν ἀρχιτελώνης καὶ ⸀αὐτὸς πλούσιος·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/002.yaml
  text: And behold[a], a man named Zacchaeus; he was a chief tax collector and was rich.
translation:
  language: ja
  text: すると、見よ、ザアカイという名の[a]男がいた。彼は徴税人の長で、裕福であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「ザアカイと呼ばれる」。ギリシア語には「呼ばれる」という表現が含まれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἰδοὺ
  choice: すると、見よ
  rationale: καίによる物語の進行と、ἰδούの注意を引く働きをともに保った。「見よ」は現代語ではやや格調があるが、意味が明瞭で、場面の鮮明さを伝える。
- source_word: ἀνὴρ
  choice: 男
  rationale: 男性単数の人物を指すため、性別を明確に保った。
- source_word: ὀνόματι καλούμενος Ζακχαῖος
  choice: ザアカイという名の
  rationale: ギリシア語には字義的に「呼ばれる」が含まれるが、日本語では「という名の」が自然であり、同じ内容を過不足なく伝える。
- source_word: ἀρχιτελώνης
  choice: 徴税人の頭
  rationale: ἀρχι-が示す首位・統率的立場を明確にしつつ、一般の読者に理解しやすい表現とした。
- source_word: πλούσιος
  choice: 裕福であった
  rationale: 財産に富んでいたことを、自然で格調を損なわない現代日本語で表した。
- source_word: αὐτὸς … αὐτὸς
  choice: 彼は…裕福であった
  rationale: 繰り返される代名詞は主語の再提示と軽い強調を担う。日本語で「彼自身」を反復すると過度に強く不自然になるため、主語を「彼は」で明示し、二つの述語を並べた。
