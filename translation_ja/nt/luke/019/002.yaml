translation_notes:
  register: 明瞭な現代標準語を基調としつつ、ἰδούは物語上の注意喚起を保つため「見よ」とした。冒頭の名詞句だけでは日本語の文として完結しないため、「いた」を補って自然にしたが、場所を特定する語は加えていない。
