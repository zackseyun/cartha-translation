  source_fidelity: 「イエスは都に近づき、その都を見ると、都のために涙を流された」は、ὡς ἤγγισεν、ἰδὼν τὴν πόλιν、ἔκλαυσεν ἐπ’ αὐτήνの順序と意味関係を適切に伝えている。「都に近づき」は文脈上明らかな対象を日本語として補ったものであり、過度な補足ではない。「都のために」はκλαίω＋ἐπί（対格）の嘆きの対象を自然に表す。
