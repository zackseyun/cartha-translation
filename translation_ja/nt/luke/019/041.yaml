  text: Καὶ ὡς ἤγγισεν, ἰδὼν τὴν πόλιν ἔκλαυσεν ἐπ’ ⸀αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/041.yaml
  text: And as he drew near[a], seeing the city, he wept over it,
translation:
  language: ja
  text: そして、イエスは都に近づき、その都を見ると、都のために涙を流された。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὡς ἤγγισεν
  choice: そして、イエスは都に近づき
  rationale: 接続詞 καί と、近づくことを表す ὡς ἤγγισεν を自然な現代日本語にした。日本語では主語を補わないと文意が取りにくいため、文脈上明白な「イエス」を補った。また、近づいた対象である都も文脈と直後の目的語から補った。
- source_word: ἰδὼν τὴν πόλιν
  choice: その都を見ると
  rationale: アオリスト分詞 ἰδών が主動詞に先立つ、またはほぼ同時の知覚を示すため、「見ると」と訳して、都を目にしたことと涙を流したことの直接的なつながりを保った。πόλις は固有名を補わず「都」とした。
- source_word: ἔκλαυσεν
  choice: 涙を流された
  rationale: κλαίω の嘆き泣く意味を、過度な激しさを加えず、自然で品位ある日本語で表した。イエスの行為を述べる文脈にふさわしい敬体ではない尊敬表現を用いた。
- source_word: ἐπ’ αὐτήν
  choice: 都のために
  rationale: κλαίω とともに用いられる ἐπί＋対格は、嘆きの対象を示す。日本語では「都の上に泣く」は不自然なので、「都のために」として意味関係を明確にした。αὐτήν の女性形は πόλις との文法的一致であり、日本語では性をもつ代名詞で再現しない。
theological_decisions:
- issue: エルサレムを女性として擬人化する可能性を訳文で明示するか
  choice: 「都のために」とし、性別を示す代名詞を用いない
  alternative: 「彼女のために」など、都の女性的擬人化を前面に出す
  rationale: αὐτήν の女性形は女性名詞 πόλις との文法的一致だけでも十分説明でき、この一節だけから擬人化を確定するべきではない。日本語の自然な表現では名詞を反復することで、嘆きの対象を曖昧にせず、擬人化の有無も不必要に決定しない。
- issue: 涙の強さをどの程度表すか
  choice: 「涙を流された」
  alternative: 「激しく泣かれた」「号泣された」
  rationale: κλαίω は泣くことを明確に表すが、この動詞だけでは「激しく」「号泣」といった程度まで確定しないため、情感を保ちつつ強度を加えない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語。簡潔で品位ある聖書本文の調子を保ちつつ、原文の分詞構文は自然な時系列表現に整えた。本文に脚注標識はないため、脚注も設けていない。
