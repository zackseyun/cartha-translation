id: LUK.19.15
reference: Luke 19:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ ἐπανελθεῖν αὐτὸν λαβόντα τὴν βασιλείαν καὶ εἶπεν φωνηθῆναι αὐτῷ τοὺς δούλους τούτους οἷς ⸀δεδώκει τὸ ἀργύριον, ἵνα ⸀γνοῖ τί ⸀διεπραγματεύσαντο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/015.yaml
  text: And it happened[a], when he returned after receiving the kingdom, that he ordered these servants to whom he had given the money to be called to him[b], so that he might know what they had gained by trading.
translation:
  language: ja
  text: そこで、その人は王権[a]を受けて帰って来ると、金銭を与えておいた奴隷たち[b]を自分のもとに呼ぶよう命じた。彼らが商売で何を得たか[c]を知るためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「王位」または「王国」とも訳せる。ここでは、王として治める地位・権限を受けたという意味。
    reason: lexical_alternative
  - marker: b
    text: 「しもべたち」または「召使いたち」とも訳せる。ギリシア語は、主人に属して仕える「奴隷」を指す語。
    reason: lexical_alternative
  - marker: c
    text: 「どんな商売をしたか」または「どれだけもうけたか」とも訳せる。ギリシア語の動詞は、商売を行うこととその成果の両方を含みうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: こうして
  rationale: ルカに見られる物語進行の定型表現。日本語では独立した「起こった」を置かず、場面の推移を自然に示す。
- source_word: ἐν τῷ ἐπανελθεῖν αὐτὸν
  choice: その人は…帰って来ると
  rationale: ἐν＋冠詞付き不定詞の時間的意味を、明瞭な現代日本語で表す。
- source_word: λαβόντα τὴν βασιλείαν
  choice: 王権を受けて
  rationale: 分詞の先行的な動作を保つ。「受ける」は、力ずくで奪うという含みを加えず、任命によって支配権を得る文脈に合う。
- source_word: βασιλείαν
  choice: 王権
  rationale: ここでは領土としての「王国」よりも、その人が受ける王としての地位・統治権が中心である。語の幅は脚注に示す。
- source_word: φωνηθῆναι αὐτῷ
  choice: 自分のもとに呼ぶよう
  rationale: 受動不定詞の意味を自然な日本語に組み替え、主人のもとへ召集することを明示する。
- source_word: δούλους
  choice: 奴隷たち
  rationale: 主人の権威の下にあり、その金を任されて報告を求められる社会的身分を率直に表す。「しもべ」という訳語の可能性は脚注に残す。
- source_word: δεδώκει
  choice: 与えておいた
  rationale: 過去完了が示す、帰還以前に完了していた行為を日本語の「ておいた」で表す。
- source_word: ἀργύριον
  choice: 金
  rationale: 字義は銀または貨幣。ここでは前に渡された資金を指すため、一般読者に自然な「金」とする。
- source_word: ἵνα γνοῖ
  choice: 知るためであった
  rationale: 目的節の機能を明確に保つ。
- source_word: τί διεπραγματεύσαντο
  choice: 商売で何を得たか
  rationale: τίの広さを保ちつつ、動詞に含まれる商取引とその成果の両面を表す。利益額だけに限定しない。
theological_decisions:
- issue: たとえ話の経済的文脈における δοῦλος の訳語
  choice: 奴隷
  alternative: しもべ／召使い
  rationale: 主人への従属と拘束された身分が文脈上明瞭であるため「奴隷」とした。ただし、この語が担いうる奉仕者の側面を否定しないよう別訳を脚注に示す。
- issue: βασιλείαν が指すもの
  choice: 王権
  alternative: 王国／王位
  rationale: この貴族が国外で受けて帰るものは、文脈上、主として王として統治する権限・地位である。領土そのものに限定せず、語義上の幅を脚注に残す。
- issue: διεπραγματεύσαντο の成果性
  choice: 商売で何を得たか
  alternative: どんな商売をしたか／どれだけもうけたか
  rationale: 商売を行うことと、その結果を調べることの双方を表し、利益額だけを問うとの解釈に狭めない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。物語の流れを滑らかにしつつ、王権、奴隷、商取引という歴史的・社会的要素を弱めない。すべての脚注記号を対応する語句の直後に配置した。
