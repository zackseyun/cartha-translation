id: LUK.19.34
reference: Luke 19:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/034.yaml
  text: And they said[a], “The Lord has need of it.”
translation:
  language: ja
  text: 二人は言った。[a]「主がお入り用なのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、「主人がお入り用なのです」。κύριοςをイエスの称号「主」ではなく、子ろばの主人・持ち主の意味に取る場合。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: 二人は
  rationale: 定冠詞の名詞的用法は直前の二人の弟子を指す。δέは弱い接続であり、日本語では文脈上あえて接続詞を置かないのが自然。
- source_word: εἶπαν
  choice: 言った
  rationale: λέγωのアオリストであり、応答の文脈でも原語にない意味を加えず、簡潔に訳した。
- source_word: ὅτι
  choice: かぎ括弧で表現
  rationale: 直接話法を導くὅτιの機能は、日本語では引用のかぎ括弧によって自然に示される。
- source_word: Ὁ κύριος
  choice: 主
  rationale: ルカ文書における用法と直近の文脈から、イエスを指す称号「主」を本文に採用した。ただし「持ち主／主人」の意味も語義上可能なため注記した。
- source_word: αὐτοῦ
  choice: （明示せず）
  rationale: 日本語の「お入り用だ」は、直前に話題となった子ろばを目的語として自然に補える。代名詞を機械的に「それを」とすると不自然になるため省略した。
- source_word: χρείαν ἔχει
  choice: お入り用なのです
  rationale: 「必要としている」の意味を、使者が理由を述べる場面に合う自然で丁寧な現代日本語で表した。原文の「必要がある」という句構造の調子も保っている。
theological_decisions:
- issue: 弟子たちの返答におけるκύριοςの指示対象
  choice: 「主」と訳し、文脈上イエスを指すものとして読める形にした。
  alternative: 「主人」または「持ち主」と訳し、子ろばの所有者を指すと取る。
  rationale: この言葉はイエスがあらかじめ弟子たちに命じた返答であり、ルカはκύριοςをイエスの称号として頻繁に用いる。一方、語自体には「主人」の意味もあるため、その真正な曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら品位ある物語文。「お入り用なのです」は、理由を説明する直接話法として自然な丁寧さを持たせた。脚注記号[a]は本文の発話導入部に置き、英語POBの注記位置を踏襲した。
