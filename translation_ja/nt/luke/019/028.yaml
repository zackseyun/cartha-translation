  naturalness: 「イエスはこう言ってから、先に立ってエルサレムへ上って行かれた。」は明瞭な現代標準日本語であり、聖書本文としても落ち着いた文体である。「こう言ってから」は直前の発言を自然に受け、「エルサレムへ上って行かれた」も日本語として滑らかである。
  terminology: 「イエス」「エルサレム」は標準的な表記である。敬語の「行かれた」は本文全体で用いられる敬意表現として自然で、原文にない神学的・教理的含意を加えていない。「上って」は地理的表現とルカの語りの響きを保持している。
