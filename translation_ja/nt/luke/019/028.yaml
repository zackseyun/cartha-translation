  text: Καὶ εἰπὼν ταῦτα ἐπορεύετο ἔμπροσθεν ἀναβαίνων εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/028.yaml
  text: And after saying these things, he went on ahead, going up to Jerusalem.
translation:
  language: ja
  text: イエスはこう言ってから、先に立ってエルサレムへ上って行かれた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: （独立した語としては訳出せず、文脈の連続を自然な文の運びで示す）
  rationale: 物語を次の出来事へつなぐ接続詞。日本語では冒頭に「そして」を置かなくても連続性が明瞭であり、自然な叙述となる。
- source_word: εἰπὼν ταῦτα
  choice: こう言ってから
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、「言ってから」とした。ταῦταは直前の発言全体を受け、日本語では「こう」が自然である。
- source_word: ἐπορεύετο
  choice: 行かれた
  rationale: 移動を表す未完了過去形。日本語では進行中・継続的な移動を文脈上自然に表せる「行かれた」とし、イエスへの通常の敬意を保った。
- source_word: ἔμπροσθεν
  choice: 先に立って
  rationale: 前方を進むことを表す副詞。「先に」だけでは時間的先行とも取れるため、「先に立って」として一行の前を進む空間的な意味を明確にした。
- source_word: ἀναβαίνων
  choice: 上って
  rationale: 主動詞と同時の行為を表す現在分詞。エルサレムへの地理的な上りとルカの叙述上の響きを保つため、一般的な「向かって」には平板化しなかった。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムへ
  rationale: 目的地への移動を示す。「へ」は到着や入城を必要以上に断定せず、方向と目的地を自然に表す。
theological_decisions:
- issue: エルサレムへの上昇表現を保持するか
  choice: 「エルサレムへ上って行かれた」と直訳的な上昇表現を保持する
  alternative: 「エルサレムへ向かわれた」「エルサレムへの道を進まれた」
  rationale: ἀναβαίνωνは地理的に自然であると同時に、ルカのエルサレムへ向かう物語の語感にも関わる。意味を付加せず、原文の神学的な余韻を残した。
- issue: 原文で省略された主語を明示するか
  choice: 「イエスは」と明示する
  alternative: 主語を省略して「こう言ってから」と始める
  rationale: 動詞の主語は文脈上イエスである。日本語の独立した一節として読みやすくし、指示対象の曖昧さを避けるために補ったが、新たな解釈は加えていない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての落ち着きと品位を保った。「行かれた」により過度に古風にならない範囲で敬意を示し、「上って行かれた」で原文の移動と上昇の両要素を自然に一体化した。
