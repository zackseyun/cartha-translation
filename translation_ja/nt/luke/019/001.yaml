  rationale: アオリスト能動分詞が主動詞に先立つ動作を示すことを、自然な連用形で表した。
- source_word: διήρχετο
  choice: 通っておられた
  rationale: 未完了過去が表す進行中の動作を「通っておられた」で保持した。文脈上の主語イエスへの敬意も自然に示している。
- source_word: τὴν Ἰεριχώ
  choice: エリコに……そこを
  rationale: エリコに入って、その町を通過していたという移動を、日本語として明瞭に表した。
