  text: καὶ προδραμὼν ⸂εἰς τὸ⸃ ἔμπροσθεν ἀνέβη ἐπὶ συκομορέαν ἵνα ἴδῃ αὐτόν, ὅτι ἐκείνης ἤμελλεν διέρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/004.yaml
  text: So he ran on ahead and climbed up into a sycamore tree so that he might see him[a], because he was about to pass that way.
translation:
  language: ja
  text: そこで彼は先回りして走って行き、イエスを見るためにいちじく桑の木[a]に登った。イエスがその道を通るところだったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「シカモアイチジク」。
    reason: συκομορέα（Ficus sycomorus）の植物名について、通用する別名を示すため。
lexical_decisions:
- source_word: προδραμὼν εἰς τὸ ἔμπροσθεν
  choice: 先に走って行き
  rationale: 分詞と方向を示す句を自然な日本語にまとめ、走って前方へ回った動作を表した。
- source_word: ἀνέβη ἐπὶ
  choice: …に登った
  rationale: 木を目当てに上へ移動する動作を、現代日本語で簡潔かつ自然に表した。
- source_word: συκομορέαν
  choice: いちじく桑の木
  rationale: Ficus sycomorusを指す語であり、一般的な『桑』や日本語で別種を連想しやすい『シカモア』を避け、植物上の性質が伝わる訳語を採用した。
- source_word: ἵνα ἴδῃ αὐτόν
  choice: イエスを見ようとして
  rationale: ἵνα節の目的を自然に示した。代名詞は日本語で指示対象が曖昧になるのを避けるため、文脈上の人物名で表した。
- source_word: ἐκείνης
  choice: そこを
  rationale: 明示されていない道や場所を過度に補わず、その場所を通るという省略的な表現を保った。
- source_word: ἤμελλεν διέρχεσθαι
  choice: 通ることになっていた
  rationale: μέλλωの予定・近接未来の含みを文脈に即して表し、単なる可能性とはしなかった。
