  text: παρεγένετο δὲ ὁ πρῶτος λέγων· Κύριε, ἡ μνᾶ σου ⸂δέκα προσηργάσατο⸃ μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/016.yaml
  text: Then the first came, saying, ‘Lord, your mina has earned ten minas.’
translation:
  language: ja
  text: すると、最初の者が来て言った。「ご主人さま[a]、あなたの一ミナが、さらに十ミナを稼ぎました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「主よ」。ギリシア語のκύριεは「主よ」とも訳せるが、目上の人や主人に対する敬意ある呼びかけにも用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: παρεγένετο
  choice: 来て
  rationale: 「来る、到着する」を表す語。ここでは主人の前に来たという物語の進行を、簡潔で自然な日本語にした。
- source_word: δὲ
  choice: すると
  rationale: 対比よりも物語の次の展開を示しているため、順接的な「すると」とした。
- source_word: ὁ πρῶτος
  choice: 最初の者
  rationale: 順番の最初に報告する者を指す。文脈上「しもべ」を補わず、原文の簡潔さを保った。
- source_word: Κύριε
  choice: ご主人様
  rationale: たとえ話の中で、しもべが自分より上位の主人に敬意をもって呼びかける場面であるため、現代日本語で自然な「ご主人様」とした。「主よ」という訳も可能なので脚注に示した。
- source_word: ἡ μνᾶ σου
  choice: あなたの一ミナ
  rationale: 所有を表す σου と単数形 μνᾶ を明確にし、古代の貨幣単位名「ミナ」を現代の通貨に置き換えず保持した。
- source_word: δέκα προσηργάσατο μνᾶς
  choice: 十ミナを稼ぎました
  rationale: προσεργάζομαι は働きによって利益を得ることを表す。元の一ミナを主語として成果を報告する原文の表現を保ち、「十ミナを稼ぎました」と自然に訳した。
theological_decisions:
- issue: たとえ話における κύριος の呼びかけ
  choice: ご主人様
  alternative: 主よ
  rationale: ここでは貴人に対するしもべの敬称として用いられており、「ご主人様」が場面に即している。一方、κύριος には「主」という訳語もあるため、その可能性を脚注で保持した。
- issue: 利益を生んだ主体の表現
  choice: あなたの一ミナが十ミナを稼ぎました
  alternative: 私はあなたの一ミナで十ミナを稼ぎました
  rationale: 原文はしもべ自身ではなく「あなたのミナ」を文法上の主語とし、成果を主人の資金に帰している。その含意を解釈的に平準化せず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえ話のしもべが主人に報告する場面にふさわしい丁寧さを保った。貨幣単位「ミナ」は歴史的固有性を保つため音写した。
