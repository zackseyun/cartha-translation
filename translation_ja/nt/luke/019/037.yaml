  source_fidelity: 属格絶対を「イエスが……近づかれたとき」と時間節で適切に表し、πρὸς τῇ καταβάσειの近接関係も「オリーブ山の下り坂に近づかれた」で保っている。ἅπαν τὸ πλῆθος τῶν μαθητῶν、χαίροντες、ἤρξαντο…αἰνεῖν、φωνῇ μεγάλῃ、およびπερὶ πασῶν…δυνάμεωνの各要素も過不足なく反映されている。「自分たちが目にした」は弟子たちを自然に指し、ὧν εἶδονに忠実である。
