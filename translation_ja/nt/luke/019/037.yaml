id: LUK.19.37
reference: Luke 19:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγγίζοντος δὲ αὐτοῦ ἤδη πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν ἤρξαντο ἅπαν τὸ πλῆθος τῶν μαθητῶν χαίροντες αἰνεῖν τὸν θεὸν φωνῇ μεγάλῃ περὶ ⸀πασῶν ὧν εἶδον δυνάμεων,
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/037.yaml
  text: And as he was already drawing near[a], at the descent of the Mount of Olives, the whole multitude of the disciples began rejoicing and praising God with a loud voice for all the mighty works that they had seen,
translation:
  language: ja
  text: イエスがすでにオリーブ山の下り坂に近づかれたとき、弟子たちの群れ全体は、自分たちが目にしたあらゆる力あるわざ[a]のことで喜び、大声で神を賛美し始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奇跡」または「力強い行い」とも訳せる。ギリシア語は、力の現れとしてのわざを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζοντος δὲ αὐτοῦ ἤδη
  choice: イエスがすでに……近づかれたとき
  rationale: 属格絶対を自然な時の従属節として表した。日本語では指示代名詞だけでは主語が曖昧になりやすいため「イエス」と明示し、敬意を表す自然な語形を用いた。
- source_word: πρὸς τῇ καταβάσει τοῦ Ὄρους τῶν Ἐλαιῶν
  choice: オリーブ山の下り坂に
  rationale: κατάβασιςを、地形と移動の方向が伝わる「下り坂」とした。πρόςと与格による近接は「近づく」と組み合わせて表現した。
- source_word: ἅπαν τὸ πλῆθος τῶν μαθητῶν
  choice: 弟子たちの群れ全体
  rationale: πλῆθοςの大勢から成る集団という意味と、ἅπανの包括性を保った。
- source_word: χαίροντες
  choice: 喜び
  rationale: 賛美に伴う分詞の様態を、自然な連用形で表した。
- source_word: ἤρξαντο ... αἰνεῖν τὸν θεὸν
  choice: 神を賛美し始めた
  rationale: 開始を表すἤρξαντοと不定詞の構造を簡潔に保持した。
- source_word: φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 字義を保ちつつ、現代日本語で自然な副詞句とした。
- source_word: περὶ πασῶν ὧν εἶδον δυνάμεων
  choice: 自分たちが目にしたあらゆる力あるわざのことで
  rationale: περίの理由・話題の含みを「ことで」とし、δύναμιςは力の現れとしての行為という幅を残す「力あるわざ」とした。
theological_decisions:
- issue: 奇跡の文脈におけるδύναμιςの訳
  choice: 力あるわざ
  alternative: 奇跡／力強い行い
  rationale: 「奇跡」と限定しすぎず、神の力が行為として現れたという語の含意を保持するため。
translation_notes:
  register: 明瞭で現代的ながら、聖書叙述にふさわしい品位を保った。「オリーブ山」は日本語で定着した地名表記を採用した。
