  to: イエスはその場所に来ると、見上げて彼に言った。「ザアカイ、急いで降りて来なさい。今日は、わたしがあなたの家に滞在しなければならない[a]。」
  rationale: μένωを「滞在する」として、宿泊に限定しうる「泊まる」を避けた。また、「上を見上げて」を簡潔で自然な「見上げて」に改めた。その他は原文の時系列、緊急の命令、今日という限定、家での滞在、δεῖの必然性を適切に伝えている。
