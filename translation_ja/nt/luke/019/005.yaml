  naturalness: 「上を見上げて」は意味は通るが、「見上げて」で十分自然である。改訂文は明瞭な現代標準日本語であり、呼びかけと命令の調子も自然である。
  terminology: 「ザアカイ」は定着した人名表記で適切。「滞在する」はμένωの意味領域を不必要に限定せず、δεῖの神学的含みも本文で断定しない。脚注はδεῖに直接付し、使命・神の計画との関連を可能性として述べる。
  issues:
