  text: καὶ ὡς ἦλθεν ἐπὶ τὸν τόπον, ἀναβλέψας ὁ ⸀Ἰησοῦς εἶπεν πρὸς αὐτόν· Ζακχαῖε, σπεύσας κατάβηθι, σήμερον γὰρ ἐν τῷ οἴκῳ σου δεῖ με μεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/005.yaml
  text: And when Jesus came to the place[a], he looked up and said to him, “Zacchaeus, hurry and come down[b], because today I must stay at your house.”
translation:
  language: ja
  text: イエスはその場所に来ると、見上げて彼に言った。「ザアカイ、急いで降りて来なさい。今日は、わたしがあなたの家に滞在しなければならない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滞在しなければならない」に当たるギリシア語は強い必然性を表し、イエスの使命や神のご計画に結びつく含みを持つ場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: 来ると
  rationale: 物語の時間的なつながりを示すため、自然な現代日本語の「来ると」とした。
- source_word: ἐπὶ τὸν τόπον
  choice: その場所に
  rationale: ザアカイのいた地点を指す簡潔な場所表現として、原文の意味を保った。
- source_word: ἀναβλέψας
  choice: 上を見上げて
  rationale: 木の上にいるザアカイへ視線を向ける動作が明確に伝わる表現とした。
- source_word: εἶπεν πρὸς αὐτόν
  choice: 彼に言った
  rationale: 標準的な発話表現を明瞭で自然な日本語にした。
- source_word: Ζακχαῖε
  choice: ザアカイ
  rationale: 日本語聖書で広く定着している音写を用いた。
- source_word: σπεύσας κατάβηθι
  choice: 急いで降りて来なさい
  rationale: 分詞と命令形が表す緊迫した命令を、自然な日本語で再現した。話し手のいる所へ降りるため「来なさい」とした。
- source_word: σήμερον γὰρ
  choice: 今日は
  rationale: γάρが示す理由は後続する必要表現と文脈から明らかなため、日本語では不自然な接続を避けつつ、命令の理由として読める語順にした。
- source_word: ἐν τῷ οἴκῳ σου
  choice: あなたの家に
  rationale: οἶκοςを、この場面で滞在先となるザアカイの住まいとして自然に表した。
- source_word: δεῖ
  choice: なければならない
  rationale: 単なる希望や必要性より強い必然性を保ちつつ、その由来を本文で断定しない表現とした。
- source_word: μεῖναι
  choice: 泊まる
  rationale: ザアカイの家で一定時間とどまることを、この文脈に即して自然に表す。原語の「とどまる／滞在する」という幅は保ちつつ、訪問先での滞在を明瞭にした。
theological_decisions:
- issue: ルカ文書における δεῖ の必然性
  choice: 「泊まらなければならない」と訳し、強い必然性を示した。
  alternative: 「泊まる必要がある」「ぜひ泊まりたい」
  rationale: δεῖはルカ文書で、イエスの使命や神の計画に結びつく必然性を帯びることがある。ただし、この一節だけで必然性の由来を明示せず、原文の神学的含みを残した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、イエスの言葉には簡潔で dignified な調子を保った。「泊まらなければならない」によって δεῖ の強さを残し、その神学的由来は脚注でも断定していない。英語参照文の脚注記号は説明対象と位置がずれていたため、日本語稿では δεῖ に対応する箇所へ正しく付した。
