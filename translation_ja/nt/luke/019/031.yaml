id: LUK.19.31
reference: Luke 19:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμᾶς ἐρωτᾷ· Διὰ τί λύετε; οὕτως ⸀ἐρεῖτε ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/031.yaml
  text: 'And if anyone asks you[a], ‘Why are you untying it?’ you shall say this: ‘The Lord has need of it.’'
translation:
  language: ja
  text: もしだれかがあなたがたに、『なぜそれをほどくのか』と尋ねたら、こう言いなさい。『主[a]がそれを必要としておられるのです。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主人がそれを必要としているのです。」
    reason: κύριος は「主」のほか、文脈によって「主人」を意味し得るため。
lexical_decisions:
- source_word: ἐρωτᾷ
  choice: 尋ねたら
  rationale: 質問することを表す一般的な動詞であり、条件文の中で自然な現代日本語となる。
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う表現を、簡潔で自然な日本語にした。
- source_word: λύετε
  choice: それをほどくのか
  rationale: 直前の子ろばをつないでいるものから解く場面なので「ほどく」が明確である。ギリシア語では目的語が省略されているが、日本語では文脈上の対象を「それ」と補った。
- source_word: οὕτως ἐρεῖτε
  choice: こう言いなさい
  rationale: 未来形が文脈上、弟子たちへの指示として用いられているため、命令の力を自然に表した。
- source_word: κύριος
  choice: 主
  rationale: この文脈ではイエスを指す可能性が高く、ルカにおける称号としての響きも保持する。一方で「主人」という一般的な意味の余地は脚注に示した。
- source_word: αὐτοῦ
  choice: それを
  rationale: 属格代名詞は直前の子ろばを指すと理解し、「必要としている」の目的語として自然な形にした。
- source_word: χρείαν ἔχει
  choice: 必要としておられる
  rationale: 「必要がある」という意味を明確に伝えつつ、主語である「主」に対応する敬意を自然な日本語で表した。
theological_decisions:
- issue: Ὁ κύριος の指示対象と意味
  choice: 「主」とし、イエスを指す称号としての神学的な響きを保った。
  alternative: 「主人」とし、所有者または上位者を指す一般的な語として理解する。
  rationale: ルカの物語では κύριος がイエスに用いられることが多く、この場面でも「主」が最も妥当である。ただし語そのものには「主人」の意味もあるため、解釈を完全に閉ざさず脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こう言いなさい」で指示の力を表し、「おられる」によって主語への自然な敬意を示した。引用符は日本語として読みやすい鉤括弧を用いた。
