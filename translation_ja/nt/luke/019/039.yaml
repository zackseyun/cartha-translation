id: LUK.19.39
reference: Luke 19:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καί τινες τῶν Φαρισαίων ἀπὸ τοῦ ὄχλου εἶπαν πρὸς αὐτόν· Διδάσκαλε, ἐπιτίμησον τοῖς μαθηταῖς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/039.yaml
  text: And some of the Pharisees from the crowd said to him[a], “Teacher[b], rebuke your disciples.”
translation:
  language: ja
  text: すると、群衆の中にいたファリサイ派の人々のうち何人かが、イエスに言った。「先生、あなたの弟子たちを叱ってください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινες τῶν Φαρισαίων
  choice: ファリサイ派の人々のうち何人か
  rationale: τινεςと部分属格の組み合わせを明示し、ファリサイ派全体ではなく、そのうちの一部であることを自然な現代日本語で表した。
- source_word: ἀπὸ τοῦ ὄχλου
  choice: 群衆の中にいた
  rationale: ἀπόの起点・出所の意味を文脈に即して表し、彼らが群衆の中から発言したことを自然に示した。「群衆から」では所属関係と誤解されやすいため避けた。
- source_word: εἶπαν πρὸς αὐτόν
  choice: イエスに言った
  rationale: 日本語の標準的な叙述表現とした。代名詞の「あの方に／彼に」より、指示対象を明確にするため「イエス」とした。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼格の敬称として、教育者・教師への呼びかけを自然な現代日本語で表す。「師よ」は格調がある一方で現代の日常的理解から離れやすい。
- source_word: ἐπιτίμησον
  choice: 叱ってください
  rationale: 強い言葉で制止・戒めるよう求める命令を、敬意を伴う依頼形の自然な日本語で表した。「黙らせてください」は結果を明示しすぎるため採らなかった。
- source_word: τοῖς μαθηταῖς σου
  choice: あなたの弟子たち
  rationale: 教師と弟子の関係を保つため μαθητής を「弟子」とし、所有代名詞 σου も明示した。
theological_decisions:
- issue: Διδάσκαλεをイエスへの呼称としてどう訳すか
  choice: 先生
  alternative: 主よ／師よ
  rationale: この語自体は教える者への呼称であり、ここで「主よ」とすると原文以上のキリスト論的告白を読み込むことになる。「先生」は話者の敬意を示しつつ、語の教育的意味を保つ。
- issue: ἐπιτίμησονが求める行為の範囲
  choice: 叱ってください
  alternative: 黙らせてください
  rationale: 原文は叱責・戒告を命じており、弟子たちを沈黙させることは文脈上の意図ではあっても、動詞そのものに結果として明示されてはいないため、解釈を狭めない訳を選んだ。
translation_notes:
  register: 明瞭で自然な現代標準日本語。会話ではファリサイ派の人々がイエスに一定の敬意をもって要求する調子を保ち、「師よ」「叱責しなさい」のような文語的・硬質な表現は避けた。
