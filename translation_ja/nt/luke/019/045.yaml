  yaml_path: translation/nt/luke/019/045.yaml
  text: And entering the temple[a], he began to drive out those who were selling,
translation:
  language: ja
  text: そして、イエスは神殿[a]に入ると、売っている者たちを追い出し始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神殿の境内」。ギリシア語の「ヒエロン」は、内側の聖所だけでなく、神殿の境内全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσελθὼν
  choice: 入ると
  rationale: アオリスト分詞が主動詞に先立つ動作を表すため、自然な現代日本語で動作の順序を示した。
- source_word: ἱερὸν
  choice: 神殿
  rationale: ἱερόνは内陣だけでなく神殿境内全体を指す。本文では簡潔で一般的な「神殿」とし、範囲を脚注で明示した。
- source_word: ἤρξατο
  choice: 始めた
  rationale: 不定詞を伴うἄρχομαιの開始相をそのまま表した。
- source_word: ἐκβάλλειν
  choice: 追い出し
  rationale: 強制的に外へ出すという語勢を、古風にならない自然な日本語で表した。
- source_word: πωλοῦντας
  choice: 売っている者たち
  rationale: 何を売っていたかは本文で特定せず、現在分詞が示す継続中の行為を保った。
theological_decisions:
- issue: イエスの行動が行われたἱερόνの範囲
  choice: 本文では「神殿」とし、神殿境内全体を指す語であることを脚注で示す。
  alternative: 神殿の境内／神殿の庭／聖所
  rationale: ἱερόνは通常、内陣を表すναόςとは異なり、神殿の建物と庭を含む境内を指す。「聖所」と狭く限定せず、空間的な含みを保持した。
translation_notes:
  register: 明快で品位ある現代標準語。「者たち」は叙事的な文体に適し、「そこで」を補って、売る行為が神殿境内で行われていたことを自然に示した。主語「イエス」はギリシア語では省略されているが、文脈上明白であり、日本語の単独節としての明瞭さのために補った。
