source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· ⸀Εὖγε, ἀγαθὲ δοῦλε, ὅτι ἐν ἐλαχίστῳ πιστὸς ἐγένου, ἴσθι ἐξουσίαν ἔχων ἐπάνω δέκα πόλεων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/017.yaml
  text: And he said to him[a], “Well done, good servant; because you were faithful in a very small matter, have authority over ten cities.”
translation:
  language: ja
  text: そして彼はその人に言った。「よくやった、良いしもべよ。おまえはごく小さなことに忠実だったから、十の町を治める権限を持ちなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὖγε
  choice: よくやった
  rationale: 相手の働きを認めて褒める感嘆表現として、現代日本語で自然かつ簡潔に訳した。
- source_word: ἀγαθὲ δοῦλε
  choice: 良いしもべ
  rationale: ἀγαθόςの率直な評価を「良い」で表し、δοῦλοςは主人に従属して仕える者という比喩の関係を保つ「しもべ」とした。隷属身分を明示する別訳は脚注に残した。
- source_word: ἐν ἐλαχίστῳ
  choice: ごく小さなことに
  rationale: 最小限の事柄における忠実さを表す慣用的な句として、意味を補いすぎず自然な日本語にした。
- source_word: πιστὸς ἐγένου
  choice: 忠実だった
  rationale: ここでのγίνομαιと述語形容詞の組み合わせを、評価の根拠となる過去の状態として簡潔に表した。「忠実であることを証明した」のような解釈的な強調は加えなかった。
- source_word: ἴσθι ἐξουσίαν ἔχων
  choice: 権限を持ちなさい
  rationale: 権限を有する状態に就かせる命令を、原文の迂言的命令構文に対応する明瞭な日本語で表した。
- source_word: ἐπάνω δέκα πόλεων
  choice: 十の町を治める
  rationale: ἐπάνωがここでは統治上の支配を示すため、「権限」に自然につながる形で訳した。πόλιςは文脈上「町」とした。
theological_decisions:
- issue: たとえ話の主人とδοῦλοςの関係をどう表すか
  choice: しもべ
  alternative: 奴隷
  rationale: 主人への従属を保ちつつ、日本語のたとえ話として過度に身分制度だけを前景化しない「しもべ」を本文に採用した。ただしδοῦλοςには「奴隷」の意味もあるため、語義上の幅を脚注に明示した。
translation_notes:
  register: 明瞭な現代標準語を基調としながら、たとえ話の主人と従者の関係にふさわしい簡潔で品位ある語調とした。「おまえ」は上下関係を自然に示すが、侮蔑的になりすぎない文脈上の呼びかけとして用いた。
