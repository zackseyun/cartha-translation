  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδόντες πάντες διεγόγγυζον λέγοντες ὅτι Παρὰ ἁμαρτωλῷ ἀνδρὶ εἰσῆλθεν καταλῦσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/007.yaml
  text: And when they all saw it[a], they began to grumble, saying, “He has gone in to stay with a sinful man.”
translation:
  language: ja
  text: これを見た人々は皆、「あの人は罪深い男のところに泊まるために入った[a]」と言って、不平を言い始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「泊まるために」は、「客となるために」とも訳せる。
    reason: καταλῦσαιは、単なる滞在だけでなく、客として宿を取ることを表し得るため。
lexical_decisions:
- source_word: ἰδόντες
  choice: これを見た
  rationale: アオリスト分詞を時間・契機を表す自然な日本語にした。「これ」は、イエスがザアカイと共に行こうとした出来事を文脈から補う。
- source_word: πάντες
  choice: 人々は皆
  rationale: その場の人々全体に及ぶ反応を明確にしつつ、自然な日本語の語順にした。
- source_word: διεγόγγυζον
  choice: 不平を言い始めた
  rationale: 不満を込めてつぶやく語義と、未完了過去が表し得る開始・継続の側面を自然に伝える。
- source_word: λέγοντες
  choice: と言って
  rationale: 不平の具体的な内容を導く分詞として訳した。
- source_word: παρὰ ἁμαρτωλῷ ἀνδρὶ
  choice: 罪深い男のところに
  rationale: παρά＋与格が示す滞在先を「ところに」で表し、形容詞ἁμαρτωλόςと男性名詞ἀνήρの双方を「罪深い男」として保持した。
- source_word: εἰσῆλθεν
  choice: 入った
  rationale: ザアカイのいる所へ入ったという完了した動作を簡潔に表す。日本語では発話時との関連性を時制形式で過度に補わない。
- source_word: καταλῦσαι
  choice: 泊まりに
  rationale: 文脈上の「滞在する、宿を取る」という意味を、現代日本語で明瞭に表した。「客となるために」という含意も脚注に残した。
theological_decisions:
- issue: 群衆によるザアカイの呼び方
  choice: 罪深い男
  alternative: 罪人
  rationale: 原文は名詞化された形容詞だけでなく、形容詞ἁμαρτωλόςと男性名詞ἀνήρを用いる。群衆の非難を保ちつつ、この二語の構造と男性指示を反映した。
translation_notes:
  register: 明瞭な現代標準語を用い、群衆の非難の調子を保った。「あの人」は発話内でイエスを距離を置いて指す自然な表現であり、原文の省略された主語を文脈に即して明示している。
