  text: καὶ ἦλθεν ὁ δεύτερος λέγων· ⸂Ἡ μνᾶ σου, κύριε⸃, ἐποίησεν πέντε μνᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/018.yaml
  text: And the second came, saying, ‘Your mina, Lord, has made five minas.’
translation:
  language: ja
  text: 二番目の者も来て、言った。「ご主人様、あなたの一ミナが五ミナを生み出しました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: 二番目の者
  rationale: 順番を示す表現であり、直前の僕に続く者を自然な日本語で表した。
- source_word: Ἡ μνᾶ σου
  choice: あなたの一ミナ
  rationale: μνᾶは当時の貨幣・重量単位なので「ミナ」と音写し、単数であることを「一ミナ」で明示した。所有を表すσουも保持した。
- source_word: κύριε
  choice: ご主人様
  rationale: たとえの中で僕が主人に呼びかける語であり、敬意と関係性を自然に示す。ここでは神学的称号と断定せず、物語上の呼称として訳した。
- source_word: ἐποίησεν πέντε μνᾶς
  choice: 五ミナを生み出しました
  rationale: 元手そのものが利益を生んだと述べる原文の主語構造を保ちつつ、金銭的な増加を現代日本語で自然に表した。
theological_decisions:
- issue: κύριεの敬称・称号としての解釈
  choice: ご主人様
  alternative: 主よ
  rationale: 直接の場面では僕から主人への呼びかけであるため、その物語上の意味を優先した。たとえの神学的含意を否定はしないが、訳文で称号性を過度に確定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語。たとえ話の僕が主人に報告する丁寧な口調を用い、簡潔で品位ある表現にした。
