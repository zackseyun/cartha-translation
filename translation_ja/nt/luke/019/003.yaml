source:
  edition: SBLGNT
  text: καὶ ἐζήτει ἰδεῖν τὸν Ἰησοῦν τίς ἐστιν, καὶ οὐκ ἠδύνατο ἀπὸ τοῦ ὄχλου ὅτι τῇ ἡλικίᾳ μικρὸς ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/003.yaml
  text: And he was trying to see who Jesus was[a], but he could not because of the crowd, because he was small in stature.
translation:
  language: ja
  text: そして彼は、イエスがだれなのか見ようとしていたが、群衆に遮られて見ることができなかった。背が低かったからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐζήτει
  choice: 見ようとしていた
  rationale: 未完了時制が表す継続的な試みを、自然な現代日本語で示す。単なる願望ではなく、実際に見ようと努めていたことを表す。
- source_word: ἰδεῖν
  choice: 見る
  rationale: ζητέωと結びついて試みの目標を表す。不必要に意味を加えず、平明に訳した。
- source_word: τίς ἐστιν
  choice: イエスがどのような方なのか
  rationale: τίς ἐστινは人物の同一性だけでなく、その人がどのような人物かを問う含みも持ちうる。目の前にいるイエスを見ようとする文脈では、後者の含みが自然だが、性質を細かく規定しない表現にした。
- source_word: οὐκ ἠδύνατο
  choice: 見ることができなかった
  rationale: δύναμαιの未完了形を自然な日本語で表し、文脈上省かれている『見る』を補って意味を明確にした。
- source_word: ἀπὸ τοῦ ὄχλου
  choice: 群衆に遮られて
  rationale: ἀπόがここでは妨げとなる原因を示すため、日本語では状況を明瞭かつ自然に伝える表現を選んだ。
- source_word: ὅτι
  choice: からである
  rationale: 彼が見ることのできなかった理由を導く接続詞として訳した。
- source_word: τῇ ἡλικίᾳ μικρὸς ἦν
  choice: 背が低かった
  rationale: ἡλικίαには年齢と体格・身長の用法があるが、群衆越しに見られないという文脈は身体的な身長を明確に指す。現代日本語で最も自然な表現を採用した。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、物語文としての品位を保った。原文の二つの未完了形が示す継続的な試みと不可能な状態を反映した。本文に脚注は設けていない。
