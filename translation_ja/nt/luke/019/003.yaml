    issue: τίς ἐστιν を「イエスがどのような方なのか」としている。
    rationale: この表現は「どんな人物・性質の人か」という意味を前景化し、原文の通常の「だれなのか（who he is）」より解釈を狭める。本文では中立な「イエスがだれなのか」とすることで、同一性と人物について知ろうとする含みを不必要に限定せず保持できる。
  revised_text: そして彼は、イエスがだれなのか見ようとしていたが、群衆に遮られて見ることができなかった。背が低かったからである。
