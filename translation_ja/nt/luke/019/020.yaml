  to: また、もう一人が来て言った。「ご主人様、ご覧ください。こちらがあなたの一ミナです。私はこれを布[a]に包んで保管していました。」
  rationale: 接続を原文のκαίに即して「また」とし、保管の継続状態を「保管していました」で表した。布については本文の一般性を保ち、脚注では原語の一般的用法と自然な代替訳だけを示した。
