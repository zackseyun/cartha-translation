  text: καὶ ⸀ὁ ἕτερος ἦλθεν λέγων· Κύριε, ἰδοὺ ἡ μνᾶ σου ἣν εἶχον ἀποκειμένην ἐν σουδαρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/020.yaml
  text: And the other came[a], saying, ‘Lord, look, here is your mina, which I kept laid away in a cloth.’
translation:
  language: ja
  text: また、もう一人が来て言った。「ご主人様、ご覧ください。こちらがあなたの一ミナです。私はこれを布[a]に包んで保管していました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ハンカチ」とも訳せる。ギリシア語のスーダリオンは、顔や汗を拭くのにも用いられた布を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἕτερος
  choice: もう一人
  rationale: 先に登場した僕たちに続く別の一人を指す。日本語では「もう一人」が自然であり、本文が明示しない『最後の一人』という限定は加えない。
- source_word: ἦλθεν λέγων
  choice: 来て言った
  rationale: 分詞構文が示す動作の流れを、自然な現代日本語の連続動作として表した。
- source_word: Κύριε
  choice: ご主人様
  rationale: たとえ話の中で僕が主人に呼びかけているため、関係性と敬意を自然に示す呼称とした。
- source_word: ἰδοὺ
  choice: ご覧ください。こちらが
  rationale: 注意を促しながら実物を差し出す指示的な働きを、現代日本語で明確に表した。
- source_word: ἡ μνᾶ σου
  choice: あなたの一ミナ
  rationale: 古代の貨幣・重量単位を現代の通貨に換算せず「ミナ」と音写し、文脈上預けられた一ミナであることを明示した。
- source_word: ἣν εἶχον ἀποκειμένην
  choice: 私はこれを…しまっておきました
  rationale: εἶχονと受動分詞が表す、取り置かれた状態を継続していた意味を、自然な日本語で保持した。
- source_word: ἐν σουδαρίῳ
  choice: 布に包んで
  rationale: 容器のように布の中に置いて保管した状況を日本語として自然に表した。布の具体的用途は本文で限定せず、脚注に示した。
theological_decisions:
- issue: たとえ話の直接呼格における κύριος の訳語
  choice: ご主人様
  alternative: 主よ
  rationale: 文脈上は僕から主人への呼びかけであり、「ご主人様」が語用上自然である。たとえの含意を否定するものではないが、直接のキリスト論的告白であるかのようには訳さない。
translation_notes:
  register: 明瞭で品位のある現代標準語。僕が主人に語る場面にふさわしい敬語を用い、古風な「見よ」「主よ」は避けた。
