    rationale: 原文は単純に「そして／また」と次の人物の登場をつなぐ。
  - severity: medium
    issue: 「しまっておきました」が継続的な保管状態を弱める。
    rationale: εἶχον＋ἀποκειμένηνは、そのミナをしまわれた状態で保持していたことを表すため、「保管していました」がより対応する。
  - severity: low
    issue: 脚注の「小さな布」は原語の意味として限定的すぎる。
    rationale: σουδάριονは顔や汗を拭く布、ハンカチ等を指し得るが、大きさを本文・脚注で断定する必要はない。
