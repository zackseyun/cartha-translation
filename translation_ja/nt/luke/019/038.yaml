id: LUK.19.38
reference: Luke 19:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγοντες· Εὐλογημένος ὁ ἐρχόμενος ⸀βασιλεὺς ἐν ὀνόματι κυρίου· ⸂ἐν οὐρανῷ εἰρήνη⸃ καὶ δόξα ἐν ὑψίστοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/038.yaml
  text: saying[b][a], “Blessed is the King who comes in the name of the Lord! Peace in heaven and glory in the highest!”
translation:
  language: ja
  text: こう言った。「主の名によって来られる王[a]は、祝福されている。天に平和、いと高き所に栄光。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ルカの本文には、よく知られた「主の名によって来られる方」という形に加えて、「王」という語が明記されている。
    reason: alternative_reading
  - marker: b
    text: ルカ2章14節の賛歌と響き合うが、そこでは「地には平和」、ここでは「天には平和」となっている。
    reason: cross_reference
lexical_decisions:
- source_word: λέγοντες
  choice: こう言った
  rationale: 前節の群衆の行為を受ける現在分詞。日本語では文脈とのつながりを保ちつつ、自然な導入句とした。
- source_word: Εὐλογημένος
  choice: 祝福があるように
  rationale: 詩編的な歓呼の祝福表現を、現代日本語で明瞭かつ荘重に表す。単に「ほめたたえられよ」とせず、語の祝福の意味を保持した。
- source_word: ὁ ἐρχόμενος βασιλεὺς
  choice: 来られる王
  rationale: 本文に明記された βασιλεὺς を省かず、定冠詞付き分詞と王という名詞のまとまりを簡潔に表した。「来る方である王」より自然であり、敬意を示す「来られる」を用いた。
- source_word: ἐν ὀνόματι κυρίου
  choice: 主の名によって
  rationale: セム語的背景を持つ定着した表現を保ち、主の権威と委任の含意を過度に説明しない。
- source_word: ἐν οὐρανῷ εἰρήνη
  choice: 天には平和
  rationale: 動詞のない歓呼文の簡潔さを保ち、ルカ2章14節の「地」と対照をなす「天」を明示した。
- source_word: δόξα ἐν ὑψίστοις
  choice: いと高き所には栄光
  rationale: ὕψιστα の複数形による最高の領域という慣用的意味を、聖書的な響きと現代の理解可能性を両立させて表した。
theological_decisions:
- issue: エルサレム入城における王としての歓呼
  choice: βασιλεὺς を「王」と明記する。
  alternative: 「主の名によって来られる方」として王を省く。
  rationale: SBLGNT本文は「王」を明記しており、ルカの王的・メシア的強調を解釈的に弱めず保持するため。
- issue: ルカ2章14節との関係
  choice: 「天には平和」と訳す。
  alternative: よく知られた「地には平和」に調和させる。
  rationale: 原文は明確に ἐν οὐρανῷ と読み、降誕時の賛歌との意図的な響き合いと緊張をそのまま残すため。
- issue: 動詞のない二つの歓呼句
  choice: 両句に「あるように」を補い、願望・歓呼として表す。
  alternative: 「天には平和、いと高き所には栄光」と名詞句のままにする。
  rationale: ギリシア語の省略を日本語で自然に補う一方、断定か祈願かという含みを完全には固定しない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、群衆の詩的で荘重な歓呼として読める調子を保った。「主」「祝福」「いと高き所」は聖書的な連続性を保ちながら一般読者にも理解可能な語として採用した。
