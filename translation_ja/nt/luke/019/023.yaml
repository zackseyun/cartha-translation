  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ διὰ τί οὐκ ἔδωκάς ⸂μου τὸ ἀργύριον⸃ ἐπὶ τράπεζαν; κἀγὼ ἐλθὼν σὺν τόκῳ ἂν ⸂αὐτὸ ἔπραξα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/023.yaml
  text: And why did you not put my money in the bank? Then when I came[a], I would have collected it with interest.
translation:
  language: ja
  text: では、なぜ私の金銭を両替商に預けておかなかったのか。[a] そうすれば、私が来たとき、利息とともにそれを回収できたものを。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私の金銭を台の上に渡す」。ここで「台」は両替商や金融業者が取引に用いた台を指す。別訳「私の金銭を銀行業者に預けておく」。
    reason: τράπεζαの字義と、古代の金融取引における含意を示すため。
lexical_decisions:
- source_word: διὰ τί
  choice: なぜ
  rationale: 理由を問いただす自然な疑問表現であり、主人の叱責の調子も保つ。
- source_word: ἔδωκάς ... ἐπὶ τράπεζαν
  choice: 銀行に預けておかなかった
  rationale: 直訳は「台の上に渡す」だが、τράπεζα はこの金融的文脈では両替商・銀行業者の台、ひいては預金先を指す。「銀行に預ける」は現代の一般読者に意図が明瞭で、「ておく」により主人の帰還まで預けておく含みを自然に示す。
- source_word: μου τὸ ἀργύριον
  choice: 私の金
  rationale: ἀργύριον は字義的には銀だが、ここでは通貨・金銭を意味するため、日本語では「金」が自然である。
- source_word: κἀγὼ ἐλθὼν
  choice: そうすれば、私が帰って来た時
  rationale: 分詞を自然な時の節として訳し、κἀγώ と反実仮想の流れを「そうすれば」で表した。物語上、主人は旅から戻るので「帰って来た」が文脈に合う。
- source_word: σὺν τόκῳ
  choice: 利息を付けて
  rationale: τόκος の金融上の通常の意味を明確かつ自然に表す。道徳的評価を含む「高利」などは加えない。
- source_word: αὐτὸ ἔπραξα
  choice: 受け取れたものを
  rationale: πράσσω はここでは金銭を取り立てる・回収する意味。日本語では元金を利息とともに回収することを「受け取る」と簡潔に表し、ἄν の反実仮想を「ものを」で保つ。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いながら、主人が僕を問いただす威厳ある調子を保った。反実仮想は「そうすれば……受け取れたものを」で自然に表現した。
