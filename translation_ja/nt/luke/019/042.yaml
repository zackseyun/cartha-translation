  text: λέγων ὅτι Εἰ ἔγνως ⸂ἐν τῇ ἡμέρᾳ ταύτῃ καὶ σὺ⸃ τὰ πρὸς ⸀εἰρήνην— νῦν δὲ ἐκρύβη ἀπὸ ὀφθαλμῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/019/042.yaml
  text: saying[a], “If you had known on this day, even you[c][b], the things that make for peace—but now they have been hidden from your eyes.”
translation:
  language: ja
  text: こう言って言われた。「もしこの日、あなたも平和につながる事柄を知っていたなら。[a] だが今は、それはあなたの目から隠されている。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「もしこの日、あなたも平和につながる事柄を知ってさえいたなら」とも訳せる。原文は後件を述べず、嘆きの余韻を残している。
    reason: lexical_alternative
  - marker: b
    text: 「それ」は「平和につながる事柄」を指す。ギリシア語の動詞は単数形であり、この句全体を一つの内容として受けていると理解できる。「それらはあなたの目から隠されている」と訳すこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγων
  choice: こう言われた
  rationale: 現在分詞で前節の叙述に続く語だが、日本語では独立した節として自然に読めるよう発言導入句にした。受け身の敬語ではなく、「言う」の丁寧で荘重な叙述形として用いている。
- source_word: Εἰ ἔγνως
  choice: もし…知っていたなら
  rationale: 実現しなかったことを嘆く条件表現として訳した。「ただ…さえ」のような原文に明示されない語は本文に加えず、未完の条件文が持つ嘆きの余韻を保った。
- source_word: ἐν τῇ ἡμέρᾳ ταύτῃ
  choice: この日に
  rationale: 時間を表す前置詞句を簡潔で自然な現代日本語にした。「まさに」を加えて強調しすぎることは避けた。
- source_word: καὶ σὺ
  choice: あなたも
  rationale: エルサレムへの直接的で強い呼びかけを保持した。「あなたでさえ」も可能だが、日本語では軽蔑的に響きうるため避けた。
- source_word: τὰ πρὸς εἰρήνην
  choice: 平和につながること
  rationale: 直訳は「平和に向かう事柄」。平和にかかわり、そこへ導く事柄という幅を、過度に具体化せず自然な日本語で表した。
- source_word: νῦν δὲ
  choice: しかし今
  rationale: 知り得たはずのことと、現在それが見えなくなっている状態との鋭い対照を示した。
- source_word: ἐκρύβη ἀπὸ ὀφθαλμῶν σου
  choice: それらはあなたの目から隠されている
  rationale: 受動態と「目から」という知覚の比喩を保った。アオリストが文脈上もたらす現在の結果は「隠されている」で表した。
theological_decisions:
- issue: 条件文が未完のまま終わる嘆きの表現
  choice: 「もし…知っていたなら。」と結びを明示せず、嘆きの余韻を残す
  alternative: 「もし…知っていたなら、よかったのに」
  rationale: 後件が原文に明示されていないため、願望の内容を補わず、修辞的な中断と悲嘆を保持した。
- issue: ἐκρύβηの意味上の主語
  choice: 直前の「平和につながること」を「それら」で受ける
  alternative: 非人称的に「今は、それがあなたの目に隠されている」とする
  rationale: ギリシア語では中性複数の内容を単数動詞でまとめて受けることができる。日本語では複数の事柄とのつながりを明確にするため「それら」としたが、単一の概念として受ける理解も可能である。
- issue: 平和の意味範囲
  choice: 「平和」
  alternative: 「安寧」「繁栄」
  rationale: εἰρήνηが持つ広い幸福・安寧の含意を排除しない一方、政治的安全や内面的平安の一方だけに限定しない標準的な訳語を採用した。
translation_notes:
  register: 明快な現代標準語を用いながら、エルサレムに向けられた厳粛な嘆きを保った。条件文の中断を説明的に埋めず、原文の感情的・神学的緊張を残している。
