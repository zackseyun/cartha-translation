source:
  edition: SBLGNT
  text: ⸀ἀποκριθεὶς Σίμων εἶπεν· Ὑπολαμβάνω ὅτι ᾧ τὸ πλεῖον ἐχαρίσατο. ὁ δὲ εἶπεν αὐτῷ· Ὀρθῶς ἔκρινας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/043.yaml
  text: Simon answered[a], “I suppose the one to whom he forgave more.” And he said to him[b], “You have judged rightly.”
translation:
  language: ja
  text: シモンは答えた。「より多くを赦してもらった[b]人だと思います[a]。」そこで、イエスは彼に言った。「あなたは正しく判断しました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そう推察します」「そう考えます」とも訳せる。ギリシア語は控えめな推量を表す。
    reason: lexical_alternative
  - marker: b
    text: 「より多くの借金を帳消しにしてもらった人」とも訳せる。この動詞は、恵みによって負債を免除する意味を表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 答えた
  rationale: 分詞と定動詞を組み合わせて応答を導入するギリシア語の慣用表現なので、現代日本語では簡潔に「答えた」とした。
- source_word: Ὑπολαμβάνω
  choice: だと思います
  rationale: 断定ではなく、推量を控えめに述べる語感を自然な日本語で表した。
- source_word: ᾧ τὸ πλεῖον
  choice: より多く…もらったほう
  rationale: 比較の対象となる人物を「ほう」で示し、与格が表す恩恵の受け手という構造を「もらった」で自然に反映した。
- source_word: ἐχαρίσατο
  choice: 赦してもらった
  rationale: 直前の負債のたとえにおける恩恵としての免除と、周辺文脈の赦しとのつながりを保つ。「もらった」によって、債権者が相手に与えた恩恵であることも示した。
- source_word: Ὀρθῶς ἔκρινας
  choice: あなたの判断は正しい
  rationale: 直前に下した判断をイエスが正しいと認める意味を、明瞭で自然な現代日本語にした。
theological_decisions:
- issue: たとえにおけるἐχαρίσατοの意味
  choice: 「赦してもらった」と訳し、赦しの主題との語義的なつながりを保つ。
  alternative: 「借金を帳消しにしてもらった」
  rationale: 直前のたとえは負債の免除を扱う一方、この段落全体では罪の赦しが中心となる。「赦す」は両者のつながりを保ち、負債の具体像は注で明示できる。
- issue: 発言者ὁ δέの明示
  choice: 文脈上の発言者を「イエス」と明示する。
  alternative: 「すると、彼はシモンに言った」
  rationale: ギリシア語の代名詞的表現が指す人物は文脈上イエスであり、日本語で「彼」を重ねる曖昧さを避けるため明示した。新たな解釈は加えていない。
translation_notes:
  register: 明瞭で自然な現代標準語を用いながら、会話としての丁寧さと聖書本文にふさわしい落ち着きを保った。シモンの慎重な答えは「と思います」で表し、イエスの評価は簡潔で格調を損なわない表現とした。
