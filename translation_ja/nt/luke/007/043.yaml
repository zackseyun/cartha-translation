- from: シモンは答えた。「より多く赦してもらったほうだと思います[a][b]。」すると、イエスは彼に言った。「あなたの判断は正しい。」
  to: シモンは答えた。「より多くを赦してもらった[b]人だと思います[a]。」そこで、イエスは彼に言った。「あなたは正しく判断しました。」
  rationale: 原文の慎重な推量、より大きな免除の受益者、そしてイエスによる正しい判断の承認を保った。目的語を「より多く」として原文の省略を保ち、負債という文脈は注で示す。各脚注アンカーを対応する語句へ移し、構造と参照先を明確にした。
