id: LUK.7.22
reference: Luke 7:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Πορευθέντες ἀπαγγείλατε Ἰωάννῃ ἃ εἴδετε καὶ ἠκούσατε· ⸀τυφλοὶ ἀναβλέπουσιν, χωλοὶ περιπατοῦσιν, λεπροὶ καθαρίζονται, ⸀κωφοὶ ἀκούουσιν, νεκροὶ ἐγείρονται, πτωχοὶ εὐαγγελίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/022.yaml
  text: 'And answering[a], he said to them, “Go and report to John what you have seen and heard: the blind receive sight, the lame walk, lepers are cleansed, the deaf hear, the dead are raised[b], the poor have good news proclaimed to them.”'
translation:
  language: ja
  text: イエスは彼らに答えて言われた。「行って、あなたがたが見聞きしたことをヨハネに知らせなさい。目の見えない人が見えるようになり、足の不自由な人が歩き、重い皮膚病の人が清められ[a]、耳の聞こえない人が聞き、死者が生き返らされ、貧しい人々に良い知らせが告げられる[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「重い皮膚病」は、古代に「汚れている」とされたさまざまな皮膚の病を指し、現代のハンセン病だけを意味するものではありません。「清められる」には、病が癒やされることに加え、宗教的・社会的に清い者とされる意味もあります。
    reason: lexical_and_cultural_clarification
  - marker: b
    text: 別訳「貧しい人々は良い知らせを聞かされる」。原文は受動形で、良い知らせを告げる者を明示していません。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν αὐτοῖς
  choice: そこでイエスは彼らに答えた
  rationale: 応答を示す分詞と発話動詞を、自然な現代日本語で一つの表現にまとめた。文脈上の話者を明確にするため「イエス」を補った。
- source_word: Πορευθέντες ἀπαγγείλατε
  choice: 行って…知らせなさい
  rationale: 先行する分詞が命令に伴う動作を表すため、日本語でも連用形と命令形で自然に表した。「知らせる」は、観察した事柄をヨハネに報告する意味を保つ。
- source_word: ἃ εἴδετε καὶ ἠκούσατε
  choice: あなたがたが見聞きしたこと
  rationale: 「見たこと、聞いたこと」を簡潔で自然な「見聞きしたこと」とし、目撃と聴取の両方を保持した。
- source_word: τυφλοὶ ἀναβλέπουσιν
  choice: 目の見えない人が見えるようになり
  rationale: ἀναβλέπωがこの文脈で視力の獲得・回復を指すことを、平明で包摂的な現代語で表した。
- source_word: χωλοὶ περιπατοῦσιν
  choice: 足の不自由な人が歩き
  rationale: 身体的状態を侮蔑的でない現代日本語で表し、動詞の直接的な意味を保った。
- source_word: λεπροὶ καθαρίζονται
  choice: 重い皮膚病の人が清められ
  rationale: λεπρόςは現代のハンセン病と厳密に同定できないため広い表現を採用し、καθαρίζονταιの治癒だけに限定されない清めの含意は「清められ」で保持した。
- source_word: κωφοὶ ἀκούουσιν
  choice: 耳の聞こえない人が聞き
  rationale: κωφόςは文脈により聾または唖を指し得るが、ἀκούουσινとの対比から聴覚障害を指すと判断した。
- source_word: νεκροὶ ἐγείρονται
  choice: 死者が生き返らされ
  rationale: 受動態を維持し、行為者を明示しなかった。「起こされる」より、この文脈で死から命へ戻される意味が明瞭である。
- source_word: πτωχοὶ εὐαγγελίζονται
  choice: 貧しい人々に良い知らせが告げられている
  rationale: 受動の意味を自然な日本語で保ち、教会用語に偏り得る「福音を宣べ伝えられる」を避けた。継続的に起きている事実として現在進行的に表した。
theological_decisions:
- issue: 奇跡の列挙とイエスの身分・使命との関係
  choice: 回復の出来事をそのまま列挙し、メシア預言の成就であるとの説明は本文に加えない
  alternative: イザヤ書への暗示を明示し、「預言が実現している」などと補う
  rationale: 原文は、これらの出来事そのものをヨハネへの返答として提示する。預言的な響きは語句に残しつつ、明記されていない解釈を本文に加えない。
- issue: 受動態の行為者
  choice: 「清められ」「生き返らされ」「告げられている」と受動表現を保つ
  alternative: 「神が死者を生き返らせる」「わたしが貧しい人に告げる」のように行為者を明示する
  rationale: ギリシア語は行為者を明示しない受動態であり、その神学的な余白を保持する。
- issue: λεπροίが指す病態
  choice: 「重い皮膚病の人」と訳し、現代医学上の特定疾患に限定しない
  alternative: 「らい病人」または「ハンセン病の人」と訳す
  rationale: 古代のλεπρόςはレビ記的な皮膚疾患の広い範囲を指し得るため、現代のハンセン病との同一視を避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。障害や病気を表す語には人を先に置く表現を用いた。列挙のリズムを保ち、原文の受動態と預言的な響きを可能な限り維持した。
