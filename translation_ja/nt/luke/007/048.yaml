  text: εἶπεν δὲ αὐτῇ· Ἀφέωνταί σου αἱ ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/048.yaml
  text: Then he said to her[a], “Your sins are forgiven.”
translation:
  language: ja
  text: それから、イエスは彼女に言われた。「あなたの罪は赦されている[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの罪は赦された」。ギリシア語の完了受動形は、すでに成し遂げられた行為と、その結果が今も続いていることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: 言われた
  rationale: λέγωのアオリスト。「言った」が基本だが、イエスの直接の発言を自然で品位ある現代日本語にするため、敬語の「言われた」とした。
- source_word: δὲ
  choice: それから
  rationale: ここでは強い対比ではなく、物語を先へ進める穏やかな接続を表す。
- source_word: αὐτῇ
  choice: 彼女に
  rationale: 与格の代名詞が発言の相手を示しているため、日本語では「彼女に」とする。
- source_word: Ἀφέωνταί
  choice: 赦されている
  rationale: ἀφίημιの完了受動直説法で、完了した行為の結果として現在も続く状態を表す。「赦された」だけより結果状態を明示しつつ、「赦されている」という自然な宣言にした。
- source_word: σου
  choice: あなたの
  rationale: 二人称単数属格で、「罪」を修飾する所有表現として訳した。
- source_word: αἱ ἁμαρτίαι
  choice: 罪
  rationale: 神に対する道徳的な罪過を指す。日本語では複数形を機械的に明示せず、集合的に「罪」とするのが自然である。
theological_decisions:
- issue: 赦しの宣言における完了受動形Ἀφέωνταίの力点
  choice: 「あなたの罪は赦されている」
  alternative: 「あなたの罪は赦された」
  rationale: ギリシア語の完了形は、赦しがすでに成し遂げられ、その結果が現在も存続していることを含み得る。「赦されている」は結果状態を前面に出す一方、赦しの時点や行為者について本文以上の説明を加えない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、直接話法には簡潔で品位ある調子を保った。「イエス」はギリシア語本文では代名詞的な主語も明示されていないが、直前の文脈に基づく話者を日本語で明確にするため補った。
