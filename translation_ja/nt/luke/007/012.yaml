  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς δὲ ἤγγισεν τῇ πύλῃ τῆς πόλεως, καὶ ἰδοὺ ἐξεκομίζετο τεθνηκὼς ⸂μονογενὴς υἱὸς⸃ τῇ μητρὶ αὐτοῦ, καὶ αὐτὴ ⸀ἦν χήρα, καὶ ὄχλος τῆς πόλεως ἱκανὸς ⸁ἦν σὺν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/012.yaml
  text: As he came near to the gate of the city[a], behold, a dead man was being carried out, the only son of his mother, and she was a widow, and a considerable crowd from the city was with her.
translation:
  language: ja
  text: イエスが町の門に近づいたとき、ちょうど、死んだ人が運び出されるところだった。その人は母親の一人息子で、母親は夫を亡くしていた。町の大勢の人々が彼女と一緒にいた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἤγγισεν
  choice: イエスが……近づかれたとき
  rationale: 時間的な接続を自然な現代日本語で表し、ἐγγίζωの接近の意味を保った。日本語では主語を明示したほうが文脈上分かりやすいため「イエス」を補った。
- source_word: τῇ πύλῃ τῆς πόλεως
  choice: 町の門に
  rationale: 都市の出入口である門を簡潔かつ自然に表した。
- source_word: καὶ ἰδοὺ
  choice: ちょうど
  rationale: 新たに目に入った場面へ注意を向けるἰδούの談話機能を、過度に古風な「見よ」を避けて文脈に即して表した。
- source_word: ἐξεκομίζετο
  choice: 運び出されるところであった
  rationale: 未完了過去受動態が示す進行中の動作を保ち、葬送の場面を自然に表した。
- source_word: τεθνηκώς
  choice: 亡くなった人
  rationale: 死んだ状態にある人を指す完了分詞を、明瞭で品位ある現代日本語にした。
- source_word: μονογενὴς υἱός
  choice: 一人息子
  rationale: この家族的文脈では、母親にほかの息子がいないことを自然に表す。「独り子」も可能だが、日本語ではキリスト論的連想が強いため本文では避けた。
- source_word: καὶ αὐτὴ ἦν χήρα
  choice: しかも母親はやもめであった
  rationale: αὐτήによる母親への焦点と、彼女の境遇を重ねて示す文の力を「しかも」で表した。「やもめ」は聖書文体にもなじみつつ理解可能な語である。
- source_word: ὄχλος τῆς πόλεως ἱκανός
  choice: 町から大勢の人々
  rationale: ἱκανόςがここで示す相当数の群衆を、誇張せず自然な日本語で表した。属格は出所・所属の意味に取り「町から」とした。
- source_word: ἦν σὺν αὐτῇ
  choice: 彼女に付き添っていた
  rationale: 単なる同席でなく葬送行列への同行を示す文脈上の意味を自然に明示した。
theological_decisions:
- issue: 非キリスト論的文脈におけるμονογενήςの訳
  choice: 一人息子
  alternative: 独り子／ただ一人の息子
  rationale: ここでは母親との家族関係における唯一性を表す。ヨハネ文書などでの神学的用法を持ち込まず、同時に「唯一の子」という可能性を脚注で示した。
translation_notes:
  register: 明瞭で現代的ながら、葬送場面にふさわしい品位と厳粛さを保った。「見よ」のような古風な直訳は避け、ἰδούの注意喚起を「ちょうど」で自然に表現した。
