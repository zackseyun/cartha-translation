revisions:
- from: イエスが町の門に近づかれたとき、ちょうど、亡くなった人が運び出されるところであった。その人は母親の一人息子[a]で、しかも母親はやもめであった。町から大勢の人々が彼女に付き添っていた。
  to: イエスが町の門に近づいたとき、ちょうど、死んだ人が運び出されるところだった。その人は母親の一人息子で、母親は夫を亡くしていた。町の大勢の人々が彼女と一緒にいた。
  rationale: 原文にない敬語と死の婉曲表現を除き、明瞭な現代標準日本語に整えた。「一人息子」はμονογενὴς υἱόςを自然かつ十分に表す。現行脚注は意味のある代案を示さず、唯一の子どもという含意を過度に導入しうるため、脚注アンカーごと削除した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:59Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は全体としてギリシア語の構文と場面をよく伝えている。ἐξεκομίζετοの進行中の受動、μονογενὴς υἱόςの母親との関係、母親が寡婦であること、相当数の町の人々が共にいたことはいずれも保持されている。ただし、「近づかれた」は原文にない敬語的含みを加え、「亡くなった人」はτεθνηκώς（死んだ人）の表現を婉曲にしている。
  naturalness: 「町の門」「一人息子」「運び出されるところだった」は明瞭で自然である。一方、現代標準日本語としては、原文にない敬意を避けた「近づいた」、死の事実を明示する「死んだ人」のほうが直接的で適切である。「夫を亡くしていた」は、やもめという語を使わずに自然にその状態を表せる。
  terminology: μονογενὴς υἱόςは、この非キリスト論的文脈では「一人息子」が適切である。現行脚注の「ただ一人の息子」は実質的に本文と同義であり、続く「子どもがこの人一人だけだったことを表す場合もある」という説明は、この箇所の「息子」という明示を不必要に曖昧化するため、削除するのが安全である。
  issues:
  - severity: low
    issue: 「近づかれた」による敬語
    rationale: ἤγγισενは単に「近づいた」であり、原文は敬語・敬称を標示しない。日本語の敬語は神学的主張ではないとしても、原文にない対人的敬意を加えるため、中立な叙述に改める。
  - severity: low
    issue: 「亡くなった人」という婉曲表現
    rationale: τεθνηκώςは死んだ状態にある者を指す。葬送場面において「死んだ人」は現代日本語として不自然ではなく、原文の直接性を保つ。
  - severity: medium
    issue: μονογενήςの脚注が本文と重複し、説明が不正確に広がっている
    rationale: 「一人息子」と「ただ一人の息子」は有意味な訳語対立を形成していない。また、この節はυἱόςを明示しているので、「唯一の子ども」とする可能性を脚注で前面に出す必要はない。英語監査資料の代案も「his one and only son」であり、同じく「唯一の息子」の強調である。
  revised_text: イエスが町の門に近づいたとき、ちょうど、死んだ人が運び出されるところだった。その人は母親の一人息子で、母親は夫を亡くしていた。町の大勢の人々が彼女と一緒にいた。
  revised_footnotes: []
