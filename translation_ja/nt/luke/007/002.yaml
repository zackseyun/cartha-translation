  source_fidelity: 本文はἙκατοντάρχου ... τινοςを「ある百人隊長の」、δοῦλοςを「奴隷」、κακῶς ἔχωνを「病気で」、ἤμελλεν τελευτᾶνを「死にかけていた」と適切に訳している。ὃς ἦν αὐτῷ ἔντιμοςも「この奴隷は百人隊長に重んじられていた」とし、百人隊長がその奴隷を高く評価していたことを忠実に伝える。二文への分割は意味関係を損なわない。
