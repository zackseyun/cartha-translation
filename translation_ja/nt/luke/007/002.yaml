id: LUK.7.2
reference: Luke 7:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἑκατοντάρχου δέ τινος δοῦλος κακῶς ἔχων ἤμελλεν τελευτᾶν, ὃς ἦν αὐτῷ ἔντιμος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/002.yaml
  text: A certain centurion’s servant[a], who was sick and about to die, was highly valued by him.
translation:
  language: ja
  text: ある百人隊長の奴隷[a]が病気で、死にかけていた。この奴隷は百人隊長に重んじられていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「僕」「使用人」。ギリシア語ドゥーロスは、他者に所有され従属する身分の人を指す。
    reason: 原語が示す拘束された身分を本文で保ちつつ、文脈上の役割に着目した伝統的な訳語も示すため。
lexical_decisions:
- source_word: Ἑκατοντάρχου ... τινος
  choice: ある百人隊長の
  rationale: 属格による所有関係と、τινοςの不定性を自然な日本語で表した。
- source_word: δέ
  choice: （独立した語としては訳さない）
  rationale: 弱い叙述上の移行を示すが、この一節を自然な現代日本語にするため、文脈に織り込んだ。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 第一世紀の所有・従属関係を曖昧にせず示すため。「僕」や「使用人」では拘束された身分が弱まる。
- source_word: κακῶς ἔχων
  choice: 病気で
  rationale: 直訳的には「悪い状態にあり」だが、死が迫る文脈では病気であることを指す自然な表現。
- source_word: ἤμελλεν τελευτᾶν
  choice: 死にかけていた
  rationale: μέλλω＋不定詞が表す死の切迫を、明快で自然な日本語にした。
- source_word: ὃς ἦν αὐτῷ ἔντιμος
  choice: この奴隷は百人隊長に重んじられていた
  rationale: ἔντιμοςが示す高い評価・尊重を保ちつつ、「大切にされていた」ほど感情的な親愛に限定しない表現とした。代名詞の指示対象を明確にするため名詞を補った。
theological_decisions:
- issue: 家庭内奴隷制の文脈におけるδοῦλοςの訳
  choice: 奴隷
  alternative: 僕／使用人
  rationale: 当時の社会的な所有・従属関係を保つため「奴隷」とした。ただし、この語が担っていた具体的役割に注目して「僕」と訳す伝統もあるため、脚注に代案を示した。
- issue: ἔντιμοςが示す関係の性質
  choice: 重んじられていた
  alternative: 大切にされていた
  rationale: 高く評価され尊重されていたことは示す一方、本文だけでは確定できない感情的な親愛を過度に読み込まないようにした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。長い関係節を二文に分け、指示関係を明確にした。「重んじられていた」により、評価の高さを表しながら感情面を断定しない。
