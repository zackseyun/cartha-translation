  naturalness: 「神をあがめ続けて言った」は、「続けて」が「あがめる」にだけ掛かるため、発話とのつながりがやや硬い。現代標準日本語では「神をあがめ、こう言った」が自然であり、λέγοντεςがあがめる行為の内容を導く関係も明瞭になる。
  terminology: 「預言者」「神」「民」「顧みてくださった」は適切である。「起こされた」は預言者に関するἠγέρθηの受動性を自然な聖書語彙で反映する。脚注には、より慣用的な「現れた」を代案として示す。
