  - severity: low
    issue: 「神をあがめ続けて言った」の連結
    rationale: 未完了過去を示そうとする意図は理解できるが、「続けて」が引用導入と不自然に連結する。「神をあがめ、こう言った」の方が自然で、原文の分詞構文にも対応する。
