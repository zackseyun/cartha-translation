id: LUK.7.16
reference: Luke 7:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλαβεν δὲ φόβος πάντας, καὶ ἐδόξαζον τὸν θεὸν λέγοντες ὅτι Προφήτης μέγας ⸀ἠγέρθη ἐν ἡμῖν, καὶ ὅτι Ἐπεσκέψατο ὁ θεὸς τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/016.yaml
  text: And fear seized them all[a], and they were glorifying God, saying, “A great prophet has arisen among us[c][b], and God has visited his people.”
translation:
  language: ja
  text: すると、すべての人が恐れに捕らえられ、神をあがめ、こう言った。「偉大な預言者が私たちの間に起こされた[a]。神はご自分の民を顧みてくださった[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「偉大な預言者が私たちの間に現れた」。原文は受動形で、神が預言者を起こしたことを示唆する表現とも取れる。
    reason: lexical_alternative
  - marker: b
    text: 「顧みる」は、神がご自分の民に心を向け、配慮と救いをもって臨まれることを表す聖書的な言い方。
    reason: cultural_note
lexical_decisions:
- source_word: ἔλαβεν ... φόβος πάντας
  choice: すべての人が恐れに捕らえられ
  rationale: φόβοςを「畏敬」と限定せず「恐れ」とし、奇跡を前にした強く突然の反応と、畏れをも含みうる緊張を保った。ギリシア語の慣用表現は自然な日本語の受け身で表した。
- source_word: δὲ
  choice: すると
  rationale: 弱い接続辞を、物語の流れを自然につなぐ表現とした。強い対比は持ち込んでいない。
- source_word: ἐδόξαζον τὸν θεὸν
  choice: 神をあがめ続けて
  rationale: δοξάζωの「栄光を帰す、あがめる」という意味を保ちつつ、未完了過去の継続的な様相を「続けて」で示した。
- source_word: λέγοντες
  choice: 言った
  rationale: 分詞が神をあがめる発言内容を導入しているため、現代日本語として自然な引用導入にした。
- source_word: Προφήτης μέγας
  choice: 偉大な預言者
  rationale: μέγαςの評価的な力を、明瞭で一般的な表現にした。
- source_word: ἠγέρθη
  choice: 現れた
  rationale: 預言者が共同体の中に起こされた／立ち現れたという意味を自然な日本語で表した。受動形に含まれうる神の働きは本文で断定せず、脚注に残した。
- source_word: ἐν ἡμῖν
  choice: 私たちの間に
  rationale: 共同体のただ中という意味を直接かつ自然に表した。
- source_word: Ἐπεσκέψατο
  choice: 顧みてくださった
  rationale: 聖書的用法における、神が関心と救いの配慮をもって民に臨む意味を、日本語で誤解なく伝える表現とした。「訪れた」という直訳より文脈上の含意が明瞭である。
- source_word: τὸν λαὸν αὐτοῦ
  choice: ご自分の民を
  rationale: 所有関係と契約共同体としての響きを簡潔に保った。神への敬意を自然な日本語の「ご自分」に反映した。
theological_decisions:
- issue: 奇跡の後の φόβος の意味
  choice: 恐れ
  alternative: 畏敬、畏れ
  rationale: 語の強さを保ち、単なる感嘆や敬意へ解消しない。文脈上は神への畏敬も含みうる。
- issue: 預言者について用いられた ἠγέρθη の受動性
  choice: 現れた
  alternative: 起こされた
  rationale: 自然な日本語を本文に置きつつ、神が預言者を起こしたという受動的・神的働きの可能性を脚注で示し、曖昧さを保存した。
- issue: 神の ἐπισκέπτομαι の意味
  choice: 顧みてくださった
  alternative: 訪れてくださった
  rationale: 単なる来訪ではなく、配慮と救いをもって民に臨む聖書的含意を伝える一方、「救った」と限定して意味を狭めない。
- issue: 二つの ὅτι 節の引用関係
  choice: 一つの発言として二文を同じ引用内に置く
  alternative: 二つの別個の発言として引用する
  rationale: λέγοντεςに続く並列内容としての統一性を保ちながら、各宣言の独立した力も句点で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、語調は平易ながら礼拝朗読に耐える品位を保った。「恐れ」は原文の緊張を維持し、「顧みてくださった」は神の来訪を表す聖書的慣用の意味を自然に伝える。
