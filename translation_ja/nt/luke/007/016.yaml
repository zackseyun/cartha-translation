- from: すると、すべての人が恐れに捕らえられ、神をあがめ続けて言った。「偉大な預言者が私たちの間に現れた[a]。神はご自分の民を顧みてくださった[b]。」
  to: すると、すべての人が恐れに捕らえられ、神をあがめ、こう言った。「偉大な預言者が私たちの間に起こされた[a]。神はご自分の民を顧みてくださった[b]。」
  rationale: 本文ではἠγέρθηの受動性を「起こされた」によって保ち、自然な慣用的表現「現れた」は脚注に移した。また、「あがめ続けて言った」を自然な引用導入に改めた。二つのὅτι節は原文どおり同一の発言内容として一つの引用内に保持している。
