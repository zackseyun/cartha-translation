  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐλήλυθεν ὁ υἱὸς τοῦ ἀνθρώπου ἐσθίων καὶ πίνων, καὶ λέγετε· Ἰδοὺ ἄνθρωπος φάγος καὶ οἰνοπότης, φίλος τελωνῶν καὶ ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/034.yaml
  text: The Son of Man has come eating and drinking[a], and you say, ‘Look, a glutton and a drunkard, a friend of tax collectors and sinners!’
translation:
  language: ja
  text: 人の子は、食べたり飲んだりしながら来た。そして、あなたがたは言う。『見ろ、大食漢で大酒飲みの男だ[a]。徴税人や罪人たちの友だ！』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「見よ、一人の男、大食漢で酒を飲む者だ」。ここでは非難の言葉として使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: 来て
  rationale: 完了形が示す「来た結果、今ここにいる」という含みを、後続する「している」と合わせて自然な日本語で表した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自称として定着した訳語を用い、称号としての響きとダニエル書を想起させうる含みを保った。
- source_word: ἐσθίων καὶ πίνων
  choice: 食べたり飲んだりしている
  rationale: 来訪に伴う継続的な振る舞いを自然な現代日本語で表し、直前のヨハネとの対比を保った。
- source_word: λέγετε
  choice: あなたがたは言う
  rationale: 現在形による直接的な非難を簡潔に表した。
- source_word: Ἰδοὺ
  choice: 見ろ
  rationale: 注意を引き、相手を指し示して非難する強い語調を、古風にならない命令形で表した。
- source_word: ἄνθρωπος φάγος καὶ οἰνοπότης
  choice: 大食漢で大酒飲みの男
  rationale: ἄνθρωποςを明示しつつ、二つの侮蔑的な名詞の鋭さが伝わる自然な日本語にした。οἰνοπότηςは字義的には「酒を飲む者」だが、ここでは敵対者による非難なので「大酒飲み」とした。
- source_word: φίλος
  choice: 友
  rationale: 社会的な付き合い以上に親しい関係を非難する表現として、原語に直接対応する「友」を保った。
- source_word: τελωνῶν
  choice: 徴税人
  rationale: 当時の租税徴収に携わった者を指す標準的で明瞭な訳語。
- source_word: ἁμαρτωλῶν
  choice: 罪人たち
  rationale: 敵対者が用いた社会的・宗教的な呼称を、評価を加えずそのまま保った。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουの称号性
  choice: 人の子
  alternative: 人間
  rationale: 一般的な人間という意味に解消せず、イエスの自称としての称号性と聖書間の響きを保つため。
- issue: イエスに対する非難の強さ
  choice: 大食漢で大酒飲みの男
  alternative: よく食べ、酒を飲む男
  rationale: 発言は中立的な描写ではなく敵対者による中傷であるため、原文の侮蔑的な力を弱めないようにした。ただし、この評価が語り手自身の判断であるかのようには表現していない。
- issue: 徴税人や罪人との関係
  choice: 友
  alternative: 仲間
  rationale: φίλοςの基本的な意味を保ち、イエスが彼らと交わることへの非難と、その関係の積極的な含みの両方を一方的に解消しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、直接話法の鋭さと聖書的な品位を保った。「見よ」ではなく「見ろ」として、Ἰδοὺがこの中傷の中で持つ攻撃的な調子を伝えた。
