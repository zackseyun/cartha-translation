    issue: 場所句「家からもう遠くない所まで来られた」
    rationale: 「家から」が移動の起点にも読めるため、ἀπὸ τῆς οἰκίας が示す距離関係を「その家から遠くない所」と明示する必要がある。
  - severity: medium
    issue: 「あなたを…お迎えする」
    rationale: ἵνα…εἰσέλθῃς は「あなたが…入る」であり、「お迎えする」は接遇の行為を補って主語関係を変える。
  - severity: low
    issue: 脚注aの代替訳「先生」
    rationale: κύριε はこの文脈では敬意ある呼びかけとして「主よ」または文脈上「あなた様／閣下」相当となり得るが、「先生」はδιδάσκαλεに近く、語義上の代替として不適切。
