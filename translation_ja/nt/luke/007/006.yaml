revisions:
- from: そこで、イエスは彼らと一緒に向かわれた。ところが、イエスが家からもう遠くない所まで来られた時、百人隊長は友人たちを遣わし、こう伝えさせた。「主よ[a]、どうかご足労には及びません。私は、あなたを自分の屋根の下にお迎えするにふさわしい者ではないからです[b]。」
  to: イエスは彼らと一緒に向かって行かれた。だが、イエスがその家から遠くない所に来られた時、百人隊長は友人たちを遣わし、イエスにこう言わせた。「主よ[a]、どうかご自分を煩わせないでください。私は、あなたが私の屋根の下にお入りになるにふさわしい者ではないからです[b]。」
  rationale: 距離を表す属格独立構文を誤解のない日本語にし、εἰσέλθῃςの主語と「屋根の下に入る」という表現を保持しました。未完了形の叙述的な動きを「向かって行かれた」で表し、κύριεの脚注から語義的に不適切な「先生」を除きました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:54Z'
review_pass:
  verdict: revise
  source_fidelity: 「家からもう遠くない所まで」は日本語では「家から来た」とも受け取れ、原文の「家から遠くない」を曖昧にし得ます。また、「お迎えする」は原文の「あなたが私の屋根の下に入る」を、家の主人による接遇行為へと言い換えています。これらを原文の関係と主語を保つ表現に改めます。
  naturalness: 全体として読みやすく敬意ある語調ですが、「そこで」に続く「ところが」は対比を重ねています。「イエスは彼らと一緒に向かって行かれた。だが、…」とすると、未完了形の進行中の動きと文のつながりが自然です。「ご足労には及びません」も不自然ではありませんが、「ご自分を煩わせないでください」は原文の動詞をより直接に伝えます。
  terminology: 「百人隊長」「主よ」「屋根の下」は適切です。κύριε を「先生」とする脚注は、κύριοςのこの用法に対する適切な代替訳としては不正確です。「主よ」を保ち、単に敬意を表す呼びかけとしても用いられ得ることを注記します。
  issues:
