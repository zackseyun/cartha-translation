id: LUK.7.6
reference: Luke 7:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐπορεύετο σὺν αὐτοῖς. ἤδη δὲ αὐτοῦ οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας ἔπεμψεν ⸂φίλους ὁ ἑκατοντάρχης⸃ λέγων αὐτῷ· Κύριε, μὴ σκύλλου, οὐ γὰρ ⸂ἱκανός εἰμι⸃ ἵνα ὑπὸ τὴν στέγην μου εἰσέλθῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/006.yaml
  text: So Jesus went with them[a]. But when he was already not far from the house, the centurion sent friends, saying to him, “Lord, do not trouble yourself[b], for I am not worthy that you should come under my roof.”
translation:
  language: ja
  text: イエスは彼らと一緒に向かって行かれた。だが、イエスがその家から遠くない所に来られた時、百人隊長は友人たちを遣わし、イエスにこう言わせた。「主よ[a]、どうかご自分を煩わせないでください。私は、あなたが私の屋根の下にお入りになるにふさわしい者ではないからです[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「主よ」。これは単に敬意を表す呼びかけとしても用いられ、ここではイエスの権威を認める意味も含み得る。
    reason: alternative_reading
  - marker: b
    text: または「資格がない」「十分な者ではない」。原語は、ふさわしさ、適格さ、十分さを表し得る。ここでは百人隊長の謙遜が示されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπορεύετο
  choice: 向かわれた
  rationale: 未完了過去が表す移動を文脈に即して自然に訳した。「進んでおられた」も可能だが、日本語の物語文として簡潔な表現を選んだ。
- source_word: σὺν αὐτοῖς
  choice: 彼らと一緒に
  rationale: 同行を示す前置詞句を明確に保った。
- source_word: ἤδη ... οὐ μακρὰν ἀπέχοντος ἀπὸ τῆς οἰκίας
  choice: 家からもう遠くない所まで来られた時
  rationale: 時を示す属格独立構文と、「近く」と言い換えずに「遠くない」という原文の否定表現を保った。
- source_word: ἔπεμψεν φίλους
  choice: 友人たちを遣わし
  rationale: 冠詞のない複数形 φίλους を過度に限定せず、「友人たち」とした。
- source_word: ὁ ἑκατοντάρχης
  choice: 百人隊長
  rationale: ローマ軍の階級を表す、日本語聖書で定着し一般にも理解可能な訳語。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけであり、イエスの権威への認識をも含み得るため「主よ」とした。ただし、単なる敬称としての可能性は脚注に残した。
- source_word: μὴ σκύλλου
  choice: どうかご足労には及びません
  rationale: 直訳的な「ご自分を煩わせないでください」の意味を、百人隊長の丁重な依頼として自然な現代日本語で表した。
- source_word: ἱκανός εἰμι
  choice: ふさわしい者ではない
  rationale: ἱκανός の「十分である、適任である」という幅を踏まえつつ、この場面で示される謙遜を自然に表した。価値判断を一義的に固定しないよう別訳を脚注に示した。
- source_word: ἵνα ... εἰσέλθῃς
  choice: あなたを……お迎えする
  rationale: 原文は「あなたが入る」だが、日本語では家の主の立場からの丁重な表現として「お迎えする」が自然であり、内容を損なわない。
- source_word: ὑπὸ τὴν στέγην μου
  choice: 自分の屋根の下に
  rationale: 住居への立ち入りを意味する慣用表現だが、原文の具体的な「屋根」の比喩を保持した。
theological_decisions:
- issue: イエスへの直接呼称 κύριος の訳
  choice: 主よ
  alternative: 先生／だんな様
  rationale: κύριος はこの文脈で敬称としても用い得る一方、イエスの権威へのより深い認識を含む可能性もある。「主よ」はその両義的な重みを保持し、脚注で敬称としての用法を明示する。
- issue: 百人隊長の ἱκανός による自己評価
  choice: ふさわしい者ではない
  alternative: 資格がない／十分な者ではない
  rationale: 謙遜と不適格・不十分さの双方を伝えつつ、道徳的無価値など特定の神学的解釈へ限定しない表現を選んだ。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスへの敬意と百人隊長の丁重な語調を保った。「向かわれた」「来られた」「お迎えする」「ご足労には及びません」により、過度に古風にならない格調ある語り口とした。
