  text: διὸ οὐδὲ ἐμαυτὸν ἠξίωσα πρὸς σὲ ἐλθεῖν· ἀλλὰ εἰπὲ λόγῳ, καὶ ⸀ἰαθήτω ὁ παῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/007.yaml
  text: Therefore I did not even consider myself worthy to come to you. But say the word[a], and let my servant be healed.
translation:
  language: ja
  text: ですから、私自身、あなたのもとに伺うのにふさわしいとは思いませんでした。ただ一言おっしゃってください。そうすれば、私のしもべ[a]は癒やされますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の少年」または「私の子ども」。ギリシア語は、文脈により子ども、若者、しもべを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の発言から導かれる理由・帰結を、自然な現代日本語で明確に示す。
- source_word: οὐδὲ ἐμαυτὸν ἠξίωσα
  choice: 私自身も…資格はないと思いました
  rationale: οὐδὲの「…さえしない」という強意と、ἀξιόωの「ふさわしいと見なす」を、日本語として自然に表した。前節とのつながりを「も」で保つ。
- source_word: πρὸς σὲ ἐλθεῖν
  choice: あなたのもとに伺う
  rationale: イエスへの直接の接近を表しつつ、百人隊長の敬意に合う謙譲表現とした。
- source_word: ἀλλὰ εἰπὲ λόγῳ
  choice: ただ、おことばを下さい
  rationale: 対照を「ただ」で示し、権威ある発言を求める慣用的な日本語とした。λόγῳは無冠詞だが、ここでは特定の命令の発話を指すため「おことば」が自然である。
- source_word: ἰαθήτω
  choice: そうすれば…癒やされます
  rationale: 形態上はアオリスト受動命令法三人称単数だが、発話によって生じると確信される結果を願う表現として、日本語では条件・帰結の形が最も自然である。受動態は維持した。
- source_word: ὁ παῖς μου
  choice: 私のしもべ
  rationale: παῖςには子ども・少年・しもべの意味があるが、百人隊長とその配下の者という文脈では「しもべ」が最も明瞭である。語義の幅は脚注に残した。
theological_decisions:
- issue: 百人隊長の物言いにおけるπαῖςの解釈
  choice: 私のしもべ
  alternative: 私の少年／私の子ども
  rationale: 文脈は百人隊長の権威下にある家人を示唆するため「しもべ」を本文に採用するが、親愛的または家族的な含みを排除しないよう脚注で別訳を示す。
- issue: ἰαθήτωの命令法の表現
  choice: そうすれば…癒やされます
  alternative: …が癒やされますように／…を癒やしてください
  rationale: ギリシア語の命令法が示す願いを、イエスのことばの権威に対する確信と結びついた自然な日本語の帰結表現で表した。イエスが直接治療行為をするという意味に限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「伺う」「おことば」で百人隊長の敬意を表しつつ、過度に古風な文体は避けた。「しもべ」は聖書文脈で理解可能な語として用い、意味の幅を脚注で補った。
