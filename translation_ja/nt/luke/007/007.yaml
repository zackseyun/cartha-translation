  rationale: 「一言おっしゃってください」により、εἰπὲ λόγῳが求める発話を明示した。「ふさわしいとは思いませんでした」はἠξίωσαの自己評価とοὐδὲの強調を自然に表す。後半は「そうすれば」で百人隊長の確信とのつながりを保ちつつ、「癒やされますように」によってἰαθήτωの受動命令・願望の形式を反映した。
