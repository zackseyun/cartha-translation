id: LUK.7.47
reference: Luke 7:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗ χάριν, λέγω σοι, ἀφέωνται αἱ ἁμαρτίαι αὐτῆς αἱ πολλαί, ὅτι ἠγάπησεν πολύ· ᾧ δὲ ὀλίγον ἀφίεται, ὀλίγον ἀγαπᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/047.yaml
  text: For this reason I tell you[a], her many sins have been forgiven, because she loved much. But the one who is forgiven little loves little.
translation:
  language: ja
  text: このため、あなたに言います。彼女の多くの罪は赦されています。彼女が深く愛したからです。[a] しかし、少ししか赦されない者は、少ししか愛しません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのため、彼女は深く愛したのです」。ギリシア語の接続表現は、彼女の愛が赦しの原因ではなく、すでに赦されていることの証拠であることを際立たせるものとしても理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗ χάριν
  choice: だから
  rationale: 直前のたとえと判断を受ける因果・推論のつながりを、現代日本語で自然かつ簡潔に示す。
- source_word: ἀφέωνται
  choice: 赦されています
  rationale: 完了受動形が表す、すでに成し遂げられ現在も続く赦された状態を表現する。
- source_word: ἁμαρτίαι αὐτῆς αἱ πολλαί
  choice: この人の多くの罪
  rationale: 強調的な語順を自然な日本語にし、文脈上指し示されている女性を「この人」とした。
- source_word: ὅτι
  choice: からです
  rationale: 接続詞の因果的な表現を保持し、愛が赦しの原因か証拠かという文脈上の緊張を本文で解消しない。
- source_word: ἠγάπησεν πολύ
  choice: 深く愛した
  rationale: πολύの程度を自然な日本語の「深く」で表し、アオリストは過去形とした。
- source_word: ᾧ δὲ
  choice: しかし、…者は
  rationale: 対照を示しつつ、ギリシア語が要求しない性別を日本語に持ち込まない一般的表現とした。
- source_word: ὀλίγον ἀφίεται
  choice: 少ししか赦されない
  rationale: 量の少なさを表すὀλίγονと現在受動形を、日本語の対比が明瞭になる形で表した。
- source_word: ὀλίγον ἀγαπᾷ
  choice: 少ししか愛しません
  rationale: 前半との「少し」の並行関係と格言的な簡潔さを保つ。
theological_decisions:
- issue: ὅτιが、女性の愛を赦しの功績的原因として示すか
  choice: 「彼女が深く愛したからです」と因果表現を本文に残す
  alternative: 「それゆえ、彼女は深く愛したのです」として、愛を赦されたことの結果または証拠として明示する
  rationale: ὅτιの通常の因果的力を尊重する一方、直前のたとえと50節は赦しが愛に先立つ理解を支える。本文の圧縮された因果表現と神学的緊張を保持し、別解を脚注で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの発言としての落ち着いた威厳を保った。「愛した」「赦されています」という一般読者に理解しやすい聖書語彙を採用した。
