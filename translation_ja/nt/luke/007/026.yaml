id: LUK.7.26
reference: Luke 7:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; προφήτην; ναί, λέγω ὑμῖν, καὶ περισσότερον προφήτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/026.yaml
  text: But what did you go out to see? A prophet? Yes[a], I tell you, and more than a prophet.
translation:
  language: ja
  text: では、何を見に出て行ったのですか。預言者ですか。そうです、あなたがたに言います。しかも、預言者を超える者です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: では
  rationale: 直前の修辞疑問を受けて問いを進める対照・転換の接続辞。日本語では「しかし」より「では」が自然に反復的な問いを導く。
- source_word: τί ἐξήλθατε ἰδεῖν
  choice: 何を見に出て行ったのですか
  rationale: τίを目的語「何を」、ἰδεῖνを目的「見に」、ἐξήλθατεを過去の二人称複数「出て行った」として、自然な現代日本語の疑問文にした。
- source_word: προφήτην
  choice: 預言者ですか
  rationale: 省略を伴う修辞疑問を、日本語で明瞭な名詞述語の疑問文として表した。
- source_word: ναί
  choice: そうです
  rationale: 先行する「預言者ですか」に対する強い肯定。文脈に即して「はい」より自然で荘重さも保つ。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 定型的な直接話法を、二人称複数を明示しつつ現代標準日本語で表した。
- source_word: καὶ
  choice: しかも
  rationale: 単なる並列だけでなく、肯定をさらに強めて比較表現へ進む累加的な力を自然に示す。
- source_word: περισσότερον προφήτου
  choice: 預言者を超える者
  rationale: 比較級と属格の意味を保ち、ヨハネが預言者以上の位置にあることを自然な日本語で表す。「者」は中性単数形の実質的用法を文脈上の人物に即して明示するが、その優越の具体的性質は限定しない。
theological_decisions:
- issue: イエスが示すバプテスマのヨハネの身分と位置
  choice: ヨハネを預言者として肯定し、さらに「預言者を超える者」と述べるが、何の点で超えるかはこの節では説明しない。
  alternative: 「最も偉大な預言者」または「終末の使者」と具体化する。
  rationale: 原文の簡潔な比較表現を保ち、直後の文脈による説明をこの節へ先取りして持ち込まないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、修辞疑問の反復と最後の力強い上昇を保った。「おまえたち」のような強い口調や古語的表現は避けた。
