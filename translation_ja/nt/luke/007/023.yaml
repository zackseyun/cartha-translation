id: LUK.7.23
reference: Luke 7:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μακάριός ἐστιν ὃς ἐὰν μὴ σκανδαλισθῇ ἐν ἐμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/023.yaml
  text: And blessed is the one who is not caused to stumble by me[a].
translation:
  language: ja
  text: また、わたしのことでつまずかない人は幸いです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしを不快に思わない人」または「わたしのために離れていかない人」。
    reason: 「つまずく」に当たる語は、反感を抱くことから信仰上離反することまでを含み得るため。
lexical_decisions:
- source_word: μακάριος
  choice: 幸いです
  rationale: イエスの祝福の言葉としての宗教的な重みを保ちつつ、現代日本語で自然に伝わる。「幸福です」よりも聖書的な宣言の響きがある。
- source_word: ὃς ἐὰν μή
  choice: …ない人
  rationale: 不定的な関係節と一般条件を、性別を限定せず明瞭な現代日本語で表す。
- source_word: σκανδαλισθῇ
  choice: つまずかない
  rationale: 語の比喩を保持し、単なる感情的な反感から信仰上の離反に至り得る意味の幅を残す。ギリシア語は受動形だが、日本語で「つまずかされない」とすると不自然で、イエスが直接つまずかせるという因果を過度に強調し得るため、自然な自動詞表現とした。
- source_word: ἐν ἐμοί
  choice: わたしのことで
  rationale: ここでの原因・契機を表す用法を自然な日本語にし、イエス自身がつまずきの契機となるという緊張を保つ。
theological_decisions:
- issue: イエスを理由として抱く反発と信仰上のつまずきの意味範囲
  choice: 「わたしのことでつまずかない」とし、つまずきの比喩を保持する
  alternative: 「わたしに腹を立てない」または「わたしのために離れていかない」
  rationale: 原文は、単なる不快感より深く、イエスを受け入れられず信仰上つまずく可能性を含む。一方で、必ず背教を意味すると限定せず、原文の意味の幅と神学的緊張を残した。
translation_notes:
  register: 明瞭で自然な現代標準日本語。簡潔な祝福宣言の格調を保ち、「また」によって直前の発言とのつながりも示した。
