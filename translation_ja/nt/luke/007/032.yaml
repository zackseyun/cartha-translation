source:
  edition: SBLGNT
  text: ὅμοιοί εἰσιν παιδίοις τοῖς ἐν ἀγορᾷ καθημένοις καὶ προσφωνοῦσιν ἀλλήλοις, ⸂ἃ λέγει⸃· Ηὐλήσαμεν ὑμῖν καὶ οὐκ ὠρχήσασθε· ⸀ἐθρηνήσαμεν καὶ οὐκ ἐκλαύσατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/032.yaml
  text: 'They are like children sitting in the marketplace and calling to one another[a], who say: ‘We played the flute for you, and you did not dance; we sang a lament[b], and you did not weep.’'
translation:
  language: ja
  text: '彼らは、市場に座って互いに呼びかけ、こう言う子どもたちに似ている。


    「私たちが君たちのために笛を吹いたのに、君たちは踊らなかった。


    私たちが嘆きの歌を歌ったのに[a]、君たちは泣かなかった。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちが嘆いたのに」。この語は、葬送の哀歌を歌うことを含め、嘆き悲しむことを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμοιοί εἰσιν
  choice: 似ている
  rationale: 比喩を導く標準的な表現として、自然で明瞭な現代日本語。
- source_word: παιδίοις
  choice: 子どもたち
  rationale: 年齢や性別を不必要に限定せず、複数形を自然に表す。
- source_word: ἐν ἀγορᾷ
  choice: 広場に
  rationale: ἀγοράは市場としても用いられる公共の広場を指す。この場面では、子どもたちが集まって遊ぶ場所として「広場」が自然。
- source_word: καθημένοις
  choice: 座り
  rationale: 現在分詞の描写を簡潔に保つ。
- source_word: προσφωνοῦσιν ἀλλήλοις
  choice: 互いに呼びかけて
  rationale: 相互性と、声をかける場面を明確に表す。
- source_word: ἃ λέγει
  choice: こう言う
  rationale: 本文の単数形には集合的な用法または本文上の揺れがありうるが、日本語では先行する複数の子どもたちを受けて自然に表現した。
- source_word: Ηὐλήσαμεν ὑμῖν
  choice: 笛を吹いてあげたのに
  rationale: αὐλέωが笛・管楽器を奏でることを具体的に表すため、「音楽を奏でる」と一般化しない。ὑμῖνは子どもの発話として自然な受益表現にした。
- source_word: οὐκ ὠρχήσασθε
  choice: 君たちは踊らなかった
  rationale: 動作を具体的に保ち、祝い・喜びなどの解釈を訳文に持ち込まない。
- source_word: ἐθρηνήσαμεν
  choice: 嘆きの歌を歌ってあげた
  rationale: θρηνέωの、嘆くことにも哀歌を歌うことにもなりうる幅を踏まえ、笛を吹く遊びとの対照が分かる遂行的な表現を採用。別の可能性は脚注に示す。
- source_word: οὐκ ἐκλαύσατε
  choice: 君たちは泣かなかった
  rationale: κλαίωの具体的な反応を、日常的でありながら品位ある日本語で表す。
theological_decisions:
- issue: 子どもたちの対照的な行動が持つ比喩的意味
  choice: 「笛を吹く」「踊る」「嘆きの歌を歌う」「泣く」という具体的な描写を保持する
  alternative: 「祝った」「悲しんだ」など、適用を先取りする解釈的表現にする
  rationale: この節自体はたとえの情景を提示しているため、その神学的適用を訳文で一義的に決めず、原文の比喩と緊張を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、引用部は子ども同士の呼びかけとして「君たち」を用いた。「〜てあげたのに」は子どもの不満を自然に表すが、過度にくだけない調子に整えた。脚注記号[a]は該当語句の直後に配置した。
