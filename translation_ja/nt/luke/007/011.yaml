  yaml_path: translation/nt/luke/007/011.yaml
  text: And it happened on the next day that he went into a town called Nain[a], and his disciples and a large crowd were going with him.
translation:
  language: ja
  text: その翌日[a]、イエスはナインという町へ行かれた。弟子たちと大勢の群衆も、イエスと一緒に行っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は「その後間もなく」と読む。
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: その後…
  rationale: ルカに特徴的な場面導入の定型句。日本語では「そして、…ということが起こった」と逐語的にせず、後続の時間表現と一体化して自然な物語の導入とした。
- source_word: ἐν τῷ ἑξῆς
  choice: その後間もなく
  rationale: 冠詞が中性形である本文は、特定して「翌日」とするより、直前の出来事に続く時を表す「その後」「ほどなくして」と理解するのが自然。「間もなく」により出来事の連続性を明確にした。
- source_word: ἐπορεύθη
  choice: 行かれた
  rationale: πορεύομαι の単純な移動を現代日本語で自然に表した。主語は文脈上イエスなので明示し、福音書の叙述にふさわしい穏やかな敬語を用いた。
- source_word: εἰς πόλιν
  choice: 町へ
  rationale: πόλις は都市・町を指し得るが、ナインの規模を踏まえて「町」とした。εἰς の方向性は「へ」で自然に表した。
- source_word: καλουμένην Ναΐν
  choice: ナインという
  rationale: καλουμένην を、地名を紹介する現代日本語の自然な表現「〜という」で訳した。Ναΐν は「ナイン」と音写した。
- source_word: συνεπορεύοντο αὐτῷ
  choice: イエスと一緒に進んでいた
  rationale: 未完了過去の継続的な同行を「進んでいた」で保持した。代名詞の指示先を「イエス」と明示して読みやすくした。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たち
  rationale: 所有関係は後続の「イエスと一緒に」で明らかなため、重複を避けて簡潔にした。
- source_word: ὄχλος πολύς
  choice: 大勢の群衆
  rationale: πολύς が表す人数の多さを、明快で自然な現代日本語「大勢の」で表した。
