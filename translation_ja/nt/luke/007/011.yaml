translation_notes:
  register: 明快な現代標準語を用い、物語文として自然でありながら品位を保った。イエスの行為には過度でない敬語を用いた。本文の ἐν τῷ ἑξῆς は「その後間もなく」とし、「翌日」という異読は脚注に残した。
