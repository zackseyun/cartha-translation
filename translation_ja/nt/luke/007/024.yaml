id: LUK.7.24
reference: Luke 7:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀπελθόντων δὲ τῶν ἀγγέλων Ἰωάννου ἤρξατο λέγειν ⸂πρὸς τοὺς ὄχλους⸃ περὶ Ἰωάννου· Τί ⸀ἐξήλθατε εἰς τὴν ἔρημον θεάσασθαι; κάλαμον ὑπὸ ἀνέμου σαλευόμενον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/024.yaml
  text: 'After John''s messengers had gone away[a], he began to speak to the crowds about John: “What did you go out into the wilderness to look at? A reed shaken by the wind?”'
translation:
  language: ja
  text: ヨハネの使者たちが去ってから、イエスは群衆にヨハネについて語り始めた。「あなたがたは何を見に荒野へ出て行ったのですか。風に揺られる葦ですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπελθόντων
  choice: 立ち去ると
  rationale: 属格独立構文のアオリスト分詞を時間的に訳し、使者たちの退出に続いて語り始めたという順序を自然な日本語で示す。
- source_word: ἀγγέλων
  choice: 使者たち
  rationale: ここではヨハネから遣わされた人間を指すため、「天使」ではなく文脈に即して「使者」とする。
- source_word: Ἰωάννου
  choice: ヨハネの／ヨハネについて
  rationale: 最初の属格は所属を、περίとともに用いられた箇所は話題を表す。
- source_word: ἤρξατο λέγειν
  choice: 語り始めた
  rationale: 発話の開始を明示する構文の力を保ち、群衆へのまとまった語りに自然な表現とする。主語は直前の文脈からイエスであることを明示した。
- source_word: πρὸς τοὺς ὄχλους
  choice: 群衆に
  rationale: 複数形を日本語の集合表現「群衆」で自然に表し、発話の相手を示す。
- source_word: περὶ Ἰωάννου
  choice: ヨハネについて
  rationale: περί＋属格の標準的な話題提示を明瞭に訳す。
- source_word: Τί ἐξήλθατε
  choice: 何を見に……出て行ったのですか
  rationale: τίは主として目的物を問う。「なぜ」ではなく「何を」とし、後続する不定詞と結びつけて自然な日本語にする。
- source_word: εἰς τὴν ἔρημον
  choice: 荒野へ
  rationale: ヨハネの活動した人里離れた地域を指す福音書の文脈に合い、聖書日本語としても一般的な「荒野」を用いる。
- source_word: θεάσασθαι
  choice: 見に
  rationale: 注意を向けて見る意味を持つが、ここでは「何を見に」とするのが明快で自然であり、修辞疑問の勢いも保てる。
- source_word: κάλαμον
  choice: 葦
  rationale: 風に揺れる植物という字義的な像を保つ。
- source_word: ὑπὸ ἀνέμου σαλευόμενον
  choice: 風に揺られる
  rationale: 風によって動かされる葦の姿を自然かつ鮮明に表し、比喩を説明しすぎない。
theological_decisions:
- issue: ヨハネに関する修辞疑問の比喩的意味
  choice: 「風に揺られる葦ですか」という像をそのまま残す。
  alternative: 「風向き次第で態度を変える弱い人ですか」など、意味を説明する意訳。
  rationale: 本文は字義的な像によってヨハネの不動性を暗示しており、その含意を訳文内で一つに確定せず、修辞的緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの問いの格調と修辞性を保った。「ですか」により群衆への直接的な問いを自然に示す。原文で主語が省略されている箇所は、日本語で参照先を明確にするため「イエス」を補った。
