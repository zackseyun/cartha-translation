id: LUK.7.9
reference: Luke 7:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς ἐθαύμασεν αὐτόν, καὶ στραφεὶς τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ εἶπεν· Λέγω ὑμῖν, ⸀οὐδὲ ἐν τῷ Ἰσραὴλ τοσαύτην πίστιν εὗρον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/009.yaml
  text: When Jesus heard these things[a], he marveled at him, and turning to the crowd following him, he said, “I tell you[b], not even in Israel have I found such faith.”
translation:
  language: ja
  text: イエスはこれらのことを聞いて、その人に驚嘆し、振り向いて、ついて来ていた群衆に言われた。「あなたがたに言いますが、イスラエルの中でさえ、これほどの信仰[a][b]を見いだしたことはありません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これほど大きな信仰」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「信頼」とも訳せる。ギリシア語は、しばしば「信仰」と訳される語。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ ταῦτα
  choice: これらのことを聞くと
  rationale: アオリスト分詞の時間的な先行関係を自然な現代日本語で示し、ταῦταの複数指示も「これらのこと」として保った。δέはここでは弱い叙述上の移行なので、独立した接続語を置かなかった。
- source_word: ἐθαύμασεν αὐτόν
  choice: その人に驚き
  rationale: θαυμάζωが表す驚嘆を簡潔に表し、αὐτόνが百人隊長を指すことを「その人」で明確にした。
- source_word: στραφεὶς
  choice: 振り向いて
  rationale: 文脈における身体動作を自然に表し、主動詞に先立つ分詞の流れを保った。
- source_word: τῷ ἀκολουθοῦντι αὐτῷ ὄχλῳ
  choice: ついて来ていた群衆に
  rationale: 現在分詞の継続的な動作を「ついて来ていた」で表現した。
- source_word: Λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の呼びかけと宣言の力を保つ、明瞭で自然な定型表現とした。
- source_word: οὐδὲ ἐν τῷ Ἰσραὴλ
  choice: イスラエルの中でさえ
  rationale: οὐδέの強調を「さえ」で示し、「イスラエル」が土地または民を含意し得る原文の表現を狭く限定しなかった。
- source_word: τοσαύτην πίστιν
  choice: これほどの信仰
  rationale: τοσαύτηνが示す程度の大きさを「これほどの」で表し、πίστιςには文脈上の基本訳「信仰」を採用した。
- source_word: εὗρον
  choice: 見いだしたことはありません
  rationale: 「見いだす」という原語の意味を保ちつつ、これまでの経験を述べる日本語として自然な形にした。
theological_decisions:
- issue: πίστιςの訳語
  choice: 信仰
  alternative: 信頼
  rationale: 百人隊長がイエスの権威を信じて寄せる確信が中心であり、一般的かつ神学的に中立な「信仰」を本文に採用した。「信頼」も文脈上可能なので脚注に残した。
- issue: イエスが驚いたことの表現
  choice: その人に驚き
  alternative: その人に驚嘆し
  rationale: ἐθαύμασενを弱めたり、キリスト論上の前提から言い換えたりせず、原文が述べる驚きをそのまま表した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスの発話には丁寧体を用い、地の文では過度な古語や硬い直訳調を避けた。脚注記号は該当する「信仰」の直後に配置した。
