  rationale: 引用導入句を現代日本語として自然かつ原文に忠実な形に改めた。二つの前置詞句は、最初を「あなたの前に」、最後を「あなたに先立って」と訳し分け、原文の反復と先行の意味を保持した。「顔」の具体的表現は本文に不自然な形で残さず、脚注で明示した。
