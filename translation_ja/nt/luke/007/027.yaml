  text: οὗτός ἐστιν περὶ οὗ γέγραπται· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν σου ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/027.yaml
  text: 'This is he about whom it is written: ‘Behold[a], I am sending my messenger before your face[b], who will prepare your way before you.’'
translation:
  language: ja
  text: 'この人こそ、次のように書かれている人です。


    「見よ、わたしはあなたの前に、わたしの使者[a]を遣わす。彼はあなたに先立って、あなたの道を整える。」[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「使者」に当たるギリシア語は「御使い」とも訳せるが、ここでは人間の使者であるヨハネを指す。
    reason: lexical_alternative
  - marker: b
    text: 最初の「あなたの前に」は、ギリシア語では直訳すると「あなたの顔の前に」。自然な日本語では「あなたの前に」または「あなたに先立って」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν περὶ οὗ γέγραπται
  choice: この人こそ、こう書かれている人である
  rationale: ヨハネを指し示すοὗτόςの強調を「この人こそ」で表し、聖書引用を導く完了受動の定型句を明瞭な現代日本語にした。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 預言的引用の注意喚起と荘重さを保つ、簡潔で定着した表現。
- source_word: ἀποστέλλω
  choice: 遣わす
  rationale: 使命を与えて送り出す意味に適し、預言の現在形が持つ生き生きとした確実性も保てる。
- source_word: τὸν ἄγγελόν μου
  choice: わたしの使者
  rationale: ἄγγελοςは使信を携える者を意味し、ここでは人間であるヨハネを指すため、「御使い」ではなく「使者」とした。語の別義は脚注に残した。
- source_word: πρὸ προσώπου σου
  choice: あなたの顔の前に
  rationale: πρόσωπονの具体的な像と引用文の表現を残した。日本語ではやや非日常的だが理解可能であり、自然な意味を脚注で示した。
- source_word: ὃς κατασκευάσει τὴν ὁδόν σου
  choice: 彼は……あなたの道を整える
  rationale: 関係代名詞の先行詞である使者を「彼」で明示し、κατασκευάζωを道を用意する比喩に自然な「整える」とした。
- source_word: ἔμπροσθέν σου
  choice: あなたの前で
  rationale: 先行する「あなたの顔の前に」と区別しつつ、使者が相手に先立って道を整える位置関係を簡潔に表した。
theological_decisions:
- issue: マラキ書・出エジプト記を背景とする引用が、ヨハネとイエスの関係に適用されていること
  choice: 「あなた」「あなたの道」という二人称をそのまま保持した
  alternative: 「主の道」「メシアの道」など、指示対象を解釈して明示する
  rationale: ギリシア語本文は二人称で語っており、その適用が持つ神学的含意を説明的な言い換えで限定せず、本文の緊張を保つため。
- issue: ἄγγελοςの存在論的な理解
  choice: 人間の任命された伝令を示す「使者」
  alternative: 天的存在を通常示す「御使い」
  rationale: 直前からの文脈で指示対象は洗礼者ヨハネである。一方、原語自体の語義範囲は脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を基本としながら、聖書引用には「見よ」「遣わす」を用いて節度ある荘重さを保った。「あなたの顔の前に」は意図的に原文の像を残し、脚注で自然な意味を補った。
