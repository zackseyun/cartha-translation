id: LUK.7.5
reference: Luke 7:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀγαπᾷ γὰρ τὸ ἔθνος ἡμῶν καὶ τὴν συναγωγὴν αὐτὸς ᾠκοδόμησεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/005.yaml
  text: For he loves our nation[a], and he himself built the synagogue for us.
translation:
  language: ja
  text: というのも、この方は私たちの民を愛し、私たちのために自ら会堂を建ててくれた[a]のです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は単に「建てた」と言っており、本人が建築に携わったとも、資金を提供するなどして建てさせたとも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπᾷ
  choice: 愛し
  rationale: 現在形と語の強さを保ち、単なる好意や親近感に弱めず、現代日本語で自然な「愛する」とした。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の願いを正当化する理由を導く説明的な接続を、自然な日本語で示した。
- source_word: τὸ ἔθνος ἡμῶν
  choice: 私たちの民
  rationale: 話者たちが自らのユダヤ共同体を民族的・集合的に指す表現。「国」では政治的領域の意味が強くなり、「民族」よりも文脈に自然な「民」を選んだ。
- source_word: τὴν συναγωγήν
  choice: 会堂
  rationale: 定冠詞はあるが所有語はないため、「私たちの会堂」とは補わず、地域のユダヤ教会堂を指す定着した訳語とした。
- source_word: αὐτὸς
  choice: 自ら
  rationale: 強意を明示し、この百人隊長自身が建設を担った、あるいはその実現に直接責任を負ったという強調を保った。
- source_word: ᾠκοδόμησεν
  choice: 建ててくれた
  rationale: アオリストの単純な過去の出来事を表しつつ、ἡμῖν の受益性を自然な日本語に織り込んだ。本人の施工か資金提供かは本文で限定せず、脚注で曖昧さを示した。
- source_word: ἡμῖν
  choice: 私たちのために…てくれた
  rationale: 共同体の利益を表す与格として理解し、日本語の受益表現で自然に訳した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用いながら、長老たちの敬意を「この方」で示した。「会堂」はこの文脈でのシナゴーグを指す一般的な聖書用語として用いた。脚注記号は、その内容が関係する「建ててくれた」の直後に置いた。
