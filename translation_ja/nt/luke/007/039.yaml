  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Φαρισαῖος ὁ καλέσας αὐτὸν εἶπεν ἐν ἑαυτῷ λέγων· Οὗτος εἰ ⸀ἦν προφήτης, ἐγίνωσκεν ἂν τίς καὶ ποταπὴ ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ, ὅτι ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/039.yaml
  text: When the Pharisee who had invited him saw this[a], he said to himself, “If this man were a prophet, he would know who and what sort of woman this is who is touching him[b], because she is a sinner.”
translation:
  language: ja
  text: イエスを招いたファリサイ派の人は、これを見て、心の中で言った。「もしこの人が預言者なら、この人に触れている女性がだれで、どのような女性なのか、分かるはずだ。彼女が罪人なのだから。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: これを見て
  rationale: アオリスト分詞の状況的・時間的な働きを自然な日本語で表した。「これ」は直前の女性の行為を受ける文脈上の補足。δέはここでは強い逆接ではなく物語の展開を示すため、独立した接続語を置かなかった。
- source_word: ὁ Φαρισαῖος ὁ καλέσας αὐτὸν
  choice: イエスを招いたファリサイ派の人
  rationale: 食事の文脈におけるκαλέωを「招く」とし、指示対象を明確にするためαὐτόνを「イエス」と表した。Φαρισαῖοςは現代日本語で分かりやすい集団名として「ファリサイ派の人」とした。
- source_word: εἶπεν ἐν ἑαυτῷ λέγων
  choice: 心の中で言った
  rationale: 内的発話を表す慣用句として自然に訳し、εἶπενとλέγωνの重複は日本語では再現しなかった。
- source_word: Οὗτος
  choice: この人
  rationale: イエスに対する距離を感じさせる指示語の響きを保ちつつ、過度に侮蔑的な表現にはしなかった。
- source_word: εἰ ἦν προφήτης, ἐγίνωσκεν ἂν
  choice: もしこの人が預言者なら、…分かるはずだ
  rationale: 話者が事実ではないと見なす条件の含みを、日本語として自然な「もし…なら、…はずだ」で表した。
- source_word: τίς καὶ ποταπὴ
  choice: だれで、どんな女なのか
  rationale: τίςとποταπήの組み合わせが示す、女性の身元と性質・評判の両面を保った。
- source_word: ἡ γυνὴ ἥτις ἅπτεται αὐτοῦ
  choice: 自分に触れている女
  rationale: ἅπτεταιの現在時制が示す進行中の接触を「触れている」で表し、αὐτοῦはファリサイ派の人の内語として自然な「自分」とした。
- source_word: ὅτι ἁμαρτωλός ἐστιν
  choice: 彼女は罪深い女なのだから
  rationale: ὅτιをここでは理由を示す節として訳した。「罪人」よりも、この場面で女性について述べる自然な日本語として「罪深い女」を採用した。
theological_decisions:
- issue: イエスが預言者であることについての条件文の力
  choice: 「もしこの人が預言者なら、…分かるはずだ」
  alternative: 「もしこの人が預言者であるなら、…分かるだろう」
  rationale: εἰ ἦνとἐγίνωσκεν ἂνは、ファリサイ派の人がイエスを預言者ではないと推定している反事実的な響きを持つ。語り手がその判断を承認しているようにはせず、人物の内的判断として保持した。
- issue: ὅτι節と直前の認識内容との関係
  choice: 「彼女は罪深い女なのだから」と理由として表現
  alternative: 「彼女が罪深い女だということを」と認識内容に含める
  rationale: 文脈上は理由の読みが自然だが、ὅτιには認識内容を導く可能性もある。ただし日本語本文では文意の明瞭さを優先して理由として訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、人物の内語には自然さと品位を保った。原文の反事実的条件と、女性の身元・性質を二重に問う表現を保持した。今回は本文中に脚注マーカーを置かず、脚注も設けていない。
