  to: イエスを招いたファリサイ派の人は、これを見て、心の中で言った。「もしこの人が預言者なら、この人に触れている女性がだれで、どのような女性なのか、分かるはずだ。彼女が罪人なのだから。」
  rationale: イエスを指す代名詞を「この人に」と明示して指示の曖昧さを解消した。「女性」と「罪人」に改め、原文の中立的なγυνήと、女性性を重ねずにその人物を「罪人」と評するἁμαρτωλόςを自然な現代日本語で反映した。反事実的な条件の含み、進行中の接触、身元と性質・評判の両面、理由としてのὅτιは維持している。
