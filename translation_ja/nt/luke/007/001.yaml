id: LUK.7.1
reference: Luke 7:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ἐπειδὴ ἐπλήρωσεν πάντα τὰ ῥήματα αὐτοῦ εἰς τὰς ἀκοὰς τοῦ λαοῦ, εἰσῆλθεν εἰς Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/001.yaml
  text: When he had finished all his words in the hearing of the people[a], he entered Capernaum.
translation:
  language: ja
  text: イエスは、民衆が聞いているところで、ご自分の言葉をすべて語り終えると、カファルナウムに入られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπειδὴ
  choice: ～終えると
  rationale: ここでは原因ではなく、先行する出来事と主文の出来事との時間的なつながりを示す。日本語の物語として自然な「～すると」に相当する形にした。
- source_word: ἐπλήρωσεν
  choice: 語り終える
  rationale: 本来は「満たす、完了する」だが、ῥήματαを目的語とするこの文脈では、発言を完了する、すなわち「語り終える」という意味になる。
- source_word: πάντα τὰ ῥήματα αὐτοῦ
  choice: これらのことをすべて
  rationale: 直訳は「彼のすべての言葉」。直前の教え全体を指すため、現代日本語では「これらのことをすべて」が自然であり、内容の総体を保持する。
- source_word: εἰς τὰς ἀκοὰς τοῦ λαοῦ
  choice: 民衆が聞いているところで
  rationale: 字義的には「民の耳へ」だが、人々に聞こえるよう公に語ったことを表す慣用句。聴衆の存在を保ちつつ自然な日本語にした。
- source_word: λαοῦ
  choice: 民衆
  rationale: 集合としての人々を指す。「群衆」ほど場面を限定せず、「人々」よりも集合的な響きを保つ。
- source_word: εἰσῆλθεν
  choice: 入られた
  rationale: 単純に「入った」の意。主語であるイエスへの日本語聖書文体上の穏当な敬意を示す尊敬表現とした。
- source_word: Καφαρναούμ
  choice: カファルナウム
  rationale: ギリシア語の音形に近く、日本語の聖書で広く通用する地名表記を採用した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、過度に古風な語法は避けた。原文の時間的順序と、公に民衆へ語ったという含意を自然な文に織り込んだ。イエスを主語とする述語には穏当な尊敬語を用いた。
