  text: ἐλήλυθεν γὰρ Ἰωάννης ὁ βαπτιστὴς ⸀μὴ ⸂ἐσθίων ἄρτον μήτε πίνων οἶνον⸃, καὶ λέγετε· Δαιμόνιον ἔχει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/033.yaml
  text: For John the Baptist has come eating no bread and drinking no wine[a], and you say, ‘He has a demon.’
translation:
  language: ja
  text: というのも、洗礼者ヨハネは、パンを食べず、ぶどう酒も飲まずに来たのに、あなたがたは、『彼には悪霊がついている[a]』と言う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は悪霊に取りつかれている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθεν
  choice: 来て
  rationale: 完了形が示す、ヨハネが到来してその働きをしているという現在とのつながりを、後続する生活様式の描写と自然に結びつけた。単純に過去の出来事へ限定しない表現である。
- source_word: γὰρ
  choice: というのも
  rationale: 直前の発言に理由・説明を加える接続語として、現代日本語で自然かつ明瞭に訳した。
- source_word: Ἰωάννης ὁ βαπτιστὴς
  choice: 洗礼者ヨハネ
  rationale: 人物を明確に特定しつつ、βαπτιστήςの動作主としての意味を簡潔に表す、定着した日本語表現を採用した。
- source_word: μὴ ἐσθίων ἄρτον μήτε πίνων οἶνον
  choice: パンを食べず、ぶどう酒も飲まないでいる
  rationale: 分詞が表すヨハネの禁欲的な生活様式を継続的な描写として訳した。ἄρτονを一般化して「食物」とせず、具体的な「パン」を保持した。
- source_word: λέγετε
  choice: あなたがたは……と言う
  rationale: 聞き手に向けられた現在形を、彼らの特徴的・反復的な反応として自然な日本語の現在形で表した。
- source_word: Δαιμόνιον ἔχει
  choice: 彼には悪霊がついている
  rationale: 「悪霊を持っている」という不自然な直訳を避けながら、「悪霊がいる」という原文の直接的な言い方を保った。「悪霊に取りつかれている」という解釈的で慣用的な表現は脚注に示した。
theological_decisions:
- issue: ヨハネに対する非難における δαιμόνιον の訳語
  choice: 悪霊
  alternative: 汚れた霊
  rationale: 本文は「汚れた霊」に当たる別のギリシア語表現ではなく δαιμόνιον を用いているため、「悪霊」と訳し、関連語との不必要な調和を避けた。
- issue: Δαιμόνιον ἔχει の表現
  choice: 彼には悪霊がついている
  alternative: 彼は悪霊に取りつかれている
  rationale: 原文の所有構文の直接性を可能な限り残し、悪霊による支配の程度を本文で過度に明確化しないようにした。より慣用的な理解は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、語り手の説明から聞き手への非難へ移る流れを「というのも」と直接話法で保った。「飲まないでいる」により、一時的な行為ではなくヨハネの生活様式であることを自然に示した。
