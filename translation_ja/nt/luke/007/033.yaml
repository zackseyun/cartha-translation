revisions:
- from: というのも、洗礼者ヨハネが来て、パンを食べず、ぶどう酒も飲まないでいると、あなたがたは、『彼には悪霊がついている[a]』と言う。
  to: というのも、洗礼者ヨハネは、パンを食べず、ぶどう酒も飲まずに来たのに、あなたがたは、『彼には悪霊がついている[a]』と言う。
  rationale: 条件を示す「と」を、文脈上の不釣り合いを自然に示す「のに」に改めた。また、分詞句を「パンを食べず、ぶどう酒も飲まずに来た」として、ヨハネの到来を特徴づける禁欲的生活を簡潔に表した。完了形の現在への含意は日本語の自然な叙述では明示しにくいため、「来た」としたが、文脈上ヨハネの到来とその生活様式を指すことは保たれている。
