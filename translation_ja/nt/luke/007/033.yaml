  source_fidelity: 冒頭の「というのも」、人物名「洗礼者ヨハネ」、パンとぶどう酒の否定、また「悪霊」という用語は原文に即している。しかし「飲まないでいると」は条件を表し、「ヨハネがそのようにしている場合には、あなたがたが言う」という条件関係を生じさせる。原文の分詞句はヨハネの到来を特徴づける描写であり、ここに条件はない。
  naturalness: 「飲まないでいると」は文法的には自然だが、この文脈では不適切な条件表現となる。「パンを食べず、ぶどう酒も飲まずに来たのに」とすれば、現代標準日本語として明瞭であり、文脈上の対照も自然に表せる。
  terminology: 「洗礼者ヨハネ」は適切であり、「悪霊」も δαιμόνιον に対応する。本文の「彼には悪霊がついている」は日本語として自然で、原文の「悪霊を持っている」という非難の表現を過度に教義的に限定しない。脚注の「取りつかれている」は慣用的な代替表現として有用である。
