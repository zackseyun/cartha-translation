source:
  edition: SBLGNT
  text: Ἠρώτα δέ τις αὐτὸν τῶν Φαρισαίων ἵνα φάγῃ μετ’ αὐτοῦ· καὶ εἰσελθὼν εἰς ⸂τὸν οἶκον⸃ τοῦ Φαρισαίου ⸀κατεκλίθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/036.yaml
  text: One of the Pharisees was asking him to eat with him[a], and after entering the Pharisee’s house[b], he reclined at the table.
translation:
  language: ja
  text: ファリサイ人の一人が、自分と一緒に食事をしてほしいと、イエスに頼んでいた[a]。イエスはそのファリサイ人の家に入り、食卓に着き、身を横たえた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「自分と一緒に食べるよう、イエスに頼んでいた」。
    reason: lexical_alternative
  - marker: b
    text: 当時、このような食事では、椅子にまっすぐ座るのではなく、寝台などに身を横たえて食べるのが慣習だった。
    reason: cultural_note
lexical_decisions:
- source_word: Ἠρώτα
  choice: 頼んでいた
  rationale: 未完了過去の継続的な相を反映しつつ、この文脈で食事への招きを表す自然な日本語とした。単純な「頼んだ」よりも原文の相を保つ。
- source_word: δέ
  choice: （独立した接続語を置かない）
  rationale: 弱い物語上の接続であり、日本語では文脈と語順だけで自然に進行を示せるため、「さて」などを加えて意味を強めなかった。
- source_word: τις … τῶν Φαρισαίων
  choice: ファリサイ派のある人
  rationale: 部分属格を自然な現代日本語で表した。「ある人」により、不特定の一人であることを保つ。
- source_word: ἵνα φάγῃ μετ’ αὐτοῦ
  choice: 一緒に食事をしてほしいと
  rationale: ἵνα＋接続法の内容・目的を、依頼を表す日本語として自然にした。「食事に招いた」とまでは意訳せず、原文の「食べる」という内容を保持した。
- source_word: εἰσελθὼν εἰς τὸν οἶκον τοῦ Φαρισαίου
  choice: そのファリサイ派の人の家に入り
  rationale: アオリスト分詞が主動詞に先行する動作を示すことを、日本語の連用形による自然な順序で表した。οἶκοςは直接的に「家」とした。
- source_word: κατεκλίθη
  choice: 食事の席に身を横たえた
  rationale: 当時の正式な食事で横になって食べる姿勢を明示し、「席に着いた」だけでは失われる身体姿勢を保った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「ファリサイ人」より集団名として分かりやすい「ファリサイ派」を採用。代名詞の連続による曖昧さを避けるため、文脈上の指示対象を「イエス」と明示した。
