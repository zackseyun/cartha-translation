    rationale: τὶς τῶν Φαρισαίωνは「ファリサイ人の一人」とするのが、部分属格と日本語での呼称の両方に最も自然に対応する。
  - severity: low
    issue: 文化注の「当時の正式な食事」は、原文そのものが食事の公式性を明示するように読める可能性がある。
    rationale: κατεκλίθηは食事時の横たわる姿勢を示す。注では「このような食事では」として、本文にない限定を避けるのが安全である。
  revised_text: ファリサイ人の一人が、自分と一緒に食事をしてほしいと、イエスに頼んでいた[a]。イエスはそのファリサイ人の家に入り、食卓に着き、身を横たえた[b]。
