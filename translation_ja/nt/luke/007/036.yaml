  to: ファリサイ人の一人が、自分と一緒に食事をしてほしいと、イエスに頼んでいた[a]。イエスはそのファリサイ人の家に入り、食卓に着き、身を横たえた[b]。
  rationale: 原文の部分属格、食事の相手を示すμετ’ αὐτοῦ、ならびに食事時に横たわるκατεκλίθηを、現代日本語として明瞭かつ過度な解釈を加えずに表した。未完了形の継続的な相は「頼んでいた」に保持した。
