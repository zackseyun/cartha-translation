id: LUK.7.28
reference: Luke 7:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀λέγω ὑμῖν, μείζων ἐν γεννητοῖς γυναικῶν ⸀Ἰωάννου οὐδείς ἐστιν· ὁ δὲ μικρότερος ἐν τῇ βασιλείᾳ τοῦ θεοῦ μείζων αὐτοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/028.yaml
  text: I tell you[a], among those born of women no one is greater than John[c][b]; yet the least in the kingdom of God is greater than he is.
translation:
  language: ja
  text: あなたがたに言います。[a] 女から生まれた者の中で、ヨハネより偉大な者は一人もいません。[b] しかし、神の国で最も小さい者も、ヨハネより偉大です。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「わたしはあなたがたに言う」。
    reason: lexical_alternative
  - marker: b
    text: 「女から生まれた者」は、人間一般を指す慣用表現。
    reason: cultural_note
  - marker: c
    text: 「最も小さい者」に当たる原文は比較級であり、「小さいほうの者」とも訳せる。何の点でヨハネより偉大なのかは、原文では明示されていない。
    reason: lexical_and_theological_ambiguity
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 聞き手に直接語りかける定型表現として、現在の日本語で自然かつ明瞭にした。現在形の直接性も保っている。
- source_word: μείζων
  choice: 偉大な／偉大です
  rationale: 比較級の意味を保ちつつ、何の点で偉大なのかを「地位」「特権」「人格」などに限定しない表現とした。
- source_word: ἐν γεννητοῖς γυναικῶν
  choice: 女から生まれた者の中で
  rationale: 人間一般を指す慣用表現だが、原文のセム語的な言い回しを残し、意味も理解できる形にした。
- source_word: Ἰωάννου
  choice: ヨハネ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: οὐδείς ἐστιν
  choice: 一人もいません
  rationale: 存在を全面的に否定する原文を、比較構文の中で自然な現代日本語にした。
- source_word: ὁ δὲ μικρότερος
  choice: しかし、最も小さい者も
  rationale: 冠詞を伴う比較級の名詞的用法を、文脈上自然な最上級相当の日本語で表した。「しかし」でヨハネとの逆説的な対比を示し、「も」によって最小の者でさえ、という含意を自然に伝えた。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 神の国で
  rationale: 定着した「神の国」を用い、ἐν の領域・範囲を簡潔な「で」で示した。
- source_word: μείζων αὐτοῦ ἐστιν
  choice: ヨハネより偉大です
  rationale: 代名詞の指示対象を日本語で明確にするため「ヨハネ」と補い、比較の意味を自然に表した。
theological_decisions:
- issue: ヨハネと「神の国で最も小さい者」との比較が何を意味するか
  choice: 何の点で「偉大」なのかを説明せず、原文の逆説的な比較をそのまま保つ。
  alternative: 神の国に属する者の救済史上の特権、霊的・道徳的卓越、地位や名誉の比較などと特定する。
  rationale: 原文は比較の基準を明示していないため、特定の教派的・神学的解釈を本文に持ち込まない。
- issue: ὁ μικρότερος の比較級としての含み
  choice: 本文では自然な日本語として「最も小さい者」とし、脚注で「より小さい者」という比較級に近い訳を示す。
  alternative: 本文を「より小さい者」として、比較対象を明示しないまま残す。
  rationale: この表現は文脈上、ある集団内での最小者を指す用法として理解できる一方、語形自体は比較級である。その両面を本文と脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格調を損なわない簡潔な宣言文とした。「女性」ではなく慣用句の形を保つため「女」を用いた。「ヨハネより」を後半でも繰り返し、代名詞では曖昧になりやすい日本語の指示関係を明確にした。
