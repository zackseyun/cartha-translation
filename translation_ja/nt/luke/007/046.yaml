  text: ἐλαίῳ τὴν κεφαλήν μου οὐκ ἤλειψας· αὕτη δὲ μύρῳ ἤλειψεν ⸂τοὺς πόδας μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/046.yaml
  text: You did not anoint my head with oil[a], but she has anointed my feet with perfume.
translation:
  language: ja
  text: あなたはわたしの頭に油を塗らなかった。しかし、この女性はわたしの足に香油を塗った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλαίῳ
  choice: 油を
  rationale: 手段を表す与格。ここでは客を迎える際に用いる一般的な油を指し、自然で過度に限定しない「油」とした。
- source_word: ἤλειψας / ἤλειψεν
  choice: 塗ってくれなかった／塗ってくれた
  rationale: ἀλείφωは油や香油を体に塗ることを表す。日本語の「油を注ぐ」は液体を上からかける印象や儀礼的含意が強いため、頭と足の双方に自然に使え、歓待と敬意の対比も保つ「塗る」を選んだ。「くれる」はイエスに対してなされた歓待行為としての関係を自然に示す。
- source_word: τὴν κεφαλήν μου
  choice: わたしの頭
  rationale: 目的語と所有関係を直接かつ自然に訳した。
- source_word: αὕτη δὲ
  choice: しかし、この人は
  rationale: 指示代名詞の指示性と、直前の「あなた」との強い対比を保つ。「この女」は現代日本語では不要に突き放した響きを持ちうるため、「この人」とした。
- source_word: μύρῳ
  choice: 香油を
  rationale: μύρονは香りのある油または軟膏を指す。古代の具体的な物質と普通の油との対比を保つ、日本語聖書語彙としても理解可能な「香油」を選んだ。
- source_word: τοὺς πόδας μου
  choice: わたしの足
  rationale: 複数形だが、日本語では通常、両足を含めて集合的に「足」と言うため自然な単数形表現とした。
theological_decisions:
- issue: イエスへの歓待と敬意をめぐる対比
  choice: 一般の油を頭に塗らなかった相手と、香油を足に塗った女性との対比を、行為そのものに即して訳す。
  alternative: 「油を注ぐ」など、任職・聖別・メシア的油注ぎをより強く連想させる表現を用いる。
  rationale: 文脈の中心は、客への歓待を怠ったシモンと、並外れた敬意を示した女性との対比である。原文の語義を保ちつつ、本文だけで儀礼的・秘跡的意味を上乗せしない。
translation_notes:
  register: 明瞭で現代的な標準日本語。「しかし」で対比を明示しつつ、尊厳を保った自然な語調とした。香油は古代的対象を簡潔に示せるため注を付けず本文に採用した。
