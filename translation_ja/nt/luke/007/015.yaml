  text: καὶ ἀνεκάθισεν ὁ νεκρὸς καὶ ἤρξατο λαλεῖν, καὶ ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/015.yaml
  text: And the dead man sat up and began to speak[a], and he gave him to his mother.
translation:
  language: ja
  text: そして、死んでいた人は上体を起こして座り、話し始めた。イエスはその人を母親に渡した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「母親に返した」または「母親のもとに戻した」とも訳せる。ギリシア語は直訳すると「母親に渡した」だが、文脈上、母親のもとへ息子が回復されたという意味が含意されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνεκάθισεν
  choice: 起き上がって座り
  rationale: 横たわった姿勢から身を起こして座る動作を表す。単に「起き上がった」として立ち上がる意味に取られるのを避けつつ、現代日本語として自然にした。
- source_word: ὁ νεκρός
  choice: 死んでいた人
  rationale: 直訳的な「死者」よりも、この人が死んだ状態から生き返ったという文脈に自然に合い、非人格的な「遺体」も避けられる。
- source_word: ἤρξατο λαλεῖν
  choice: 話し始めた
  rationale: ἄρχομαιと不定詞による動作開始の意味を明確に表し、λαλέωを自然な現代日本語で訳した。
- source_word: ἔδωκεν αὐτὸν τῇ μητρὶ αὐτοῦ
  choice: イエスは、その人を母親に渡した
  rationale: δίδωμιの基本義「与える／渡す」を保ち、「返した」という回復の意味を本文に明示的には加えない。主語はギリシア語では省略されているが、文脈上イエスであり、日本語での指示の曖昧さを避けるため明示した。
theological_decisions:
- issue: 息子が母親のもとに回復されたことを「返した」と明示するか
  choice: 本文では「母親に渡した」とする
  alternative: 「母親に返した」または「母親のもとに戻した」
  rationale: 文脈は回復を明らかに含意するが、原文のδίδωμι自体には「返す」を明示する要素がないため、本文では簡潔な語義を保ち、含意は注で示す。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、物語としての厳粛さを保った。「死人」のような伝統的だが硬い表現や、「遺体」のような非人格的・臨床的な表現は避けた。
