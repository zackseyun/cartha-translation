  text: And when the Lord saw her[a], he was moved with compassion for her and said to her, “Do not weep.”
translation:
  language: ja
  text: 主は彼女を見ると、彼女を深くあわれに思い、彼女に「泣かないで」と言われた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「泣いてはいけません」「もう泣くのをやめなさい」。ギリシア語は、一般的に泣くことを禁じる言葉とも、今している嘆きをやめるよう促す言葉とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 見ると
  rationale: アオリスト分詞が主動詞に先立つ状況を示すため、自然な日本語の時を表す節で訳した。
- source_word: ὁ κύριος
  choice: 主
  rationale: ルカの物語においてイエスを指す称号として用いられており、そのキリスト論的な響きを保つ。
- source_word: ἐσπλαγχνίσθη
  choice: 深くあわれみ
  rationale: 内から湧き起こる強い同情とあわれみを表す動詞の情感を、簡潔で自然な日本語にした。
- source_word: ἐπ’ αὐτῇ
  choice: 彼女を
  rationale: あわれみが向けられる相手を表すἐπί＋与格を、日本語の慣用に従い目的語として表現した。
- source_word: εἶπεν αὐτῇ
  choice: 言われた
  rationale: λέγωの基本義を保ちつつ、主に対する現代標準日本語の自然で品位ある敬語表現とした。
- source_word: Μὴ κλαῖε
  choice: 泣かないでいなさい
  rationale: κλαίωの『泣く』を保ち、μή＋現在命令法が一般的な禁止とも現在の行為の中止とも受け取れる余地を残した。
theological_decisions:
- issue: イエスに対するκύριοςの称号
  choice: 主
  alternative: 主人
  rationale: 単なる社会的な『主人』に限定せず、ルカの語りが持つ高いキリスト論的な称号の響きを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として自然でありながら品位を保った。「深くあわれみ」で動詞の強い情感を示し、命令表現では原文の相の曖昧さを脚注で明示した。
