  yaml_path: translation/nt/luke/007/042.yaml
  text: Since they did not have the means to repay[a], he graciously forgave both. So which of them will love him more?
translation:
  language: ja
  text: 二人には返済する資力がなかったので、彼は二人の負債を免除した。[a] では、二人のうちどちらが、彼をより深く愛するだろうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は二人を惜しみなく赦した」。ギリシア語の動詞には、無償で与えることや、負っているものを免除することという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἐχόντων αὐτῶν ἀποδοῦναι
  choice: 二人には返すものがなかったので
  rationale: 属格独立構文が示す事情と理由の流れを「ので」で表した。負債の文脈にあるため、ἀποδοῦναι は「返す」とし、支払い能力がなかったことを自然な日本語で示した。
- source_word: ἀμφοτέροις ἐχαρίσατο
  choice: 彼は二人とも惜しみなく赦した
  rationale: ἐχαρίσατο には、好意によって無償で与えることと、負債を免除することの両面がある。「惜しみなく赦した」により、恵み深い行為と直後の赦しをめぐる文脈を保ちつつ、財務的意味は脚注で明示した。
- source_word: τίς οὖν αὐτῶν
  choice: では、二人のうち、どちらが
  rationale: οὖν の推論的なつながりを自然な「では」で表し、二人の比較であることを明確にした。
- source_word: πλεῖον ἀγαπήσει αὐτόν
  choice: 彼をより深く愛するだろうか
  rationale: 未来形を「だろうか」で表した。πλεῖον は愛の程度の比較であり、日本語として自然な「より深く」を採用した。ἀγαπάω は一貫して「愛する」とした。
theological_decisions:
- issue: 負債のたとえにおける χαρίζομαι の訳し方
  choice: 惜しみなく赦した
  alternative: 二人の負債を免除した
  rationale: 直接の場面は金銭債務だが、このたとえは赦しと愛を照らし出す。「赦した」はその広がりを保ち、「惜しみなく」で無償の好意という語感を反映する。財務的な読みを失わないよう脚注に別訳を示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語を用いた。「惜しみなく」は語義上の恵み深さを伝えるが、特定の教派的表現には寄せていない。疑問文は口頭で語られるたとえとして自然な調子にした。
