  text: καὶ προσελθὼν ἥψατο τῆς σοροῦ, οἱ δὲ βαστάζοντες ἔστησαν, καὶ εἶπεν· Νεανίσκε, σοὶ λέγω, ἐγέρθητι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/014.yaml
  text: And coming up[a], he touched the bier, and the men carrying it stood still, and he said, “Young man, I say to you, arise.”
translation:
  language: ja
  text: イエスは近づき、遺体を載せた台[a]に触れた。すると、それを担いでいた人たちは立ち止まった。イエスは言った。「若者よ、あなたに言う。起きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「棺」とも訳せる。ギリシア語は、葬列で遺体を載せて運ぶ台を指し、現代の密閉式の棺とは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: 近寄って
  rationale: アオリスト分詞の先行動作を自然な日本語で表し、イエスが棺台へ近づいてから触れたという順序を保った。
- source_word: ἥψατο
  choice: 手を触れた
  rationale: この文脈でのἅπτω中動態は「触れる」を意味する。つかみ続けたとまでは限定せず、自然で明瞭な日本語とした。
- source_word: σοροῦ
  choice: 棺台[a]
  rationale: σορόςは葬列で遺体を載せて運ぶ台を指し得るため、現代の密閉式の「棺」と断定せず、歴史的情景を伝える語を選んだ。
- source_word: οἱ δὲ βαστάζοντες
  choice: すると、それを担いでいた人たちは
  rationale: 担いでいた対象を文脈から「それ」と補い、δὲによる場面の推移を「すると」で自然に示した。
- source_word: ἔστησαν
  choice: 立ち止まった
  rationale: 移動をやめ、その場に止まったというἵστημιの文脈上の意味を簡潔に表した。
- source_word: Νεανίσκε
  choice: 若者よ
  rationale: 若い男性への直接の呼びかけである呼格を、簡潔で品位のある現代日本語にした。
- source_word: σοὶ λέγω
  choice: あなたに言う
  rationale: 明示された与格代名詞σοίの直接性と強調を省かずに保った。
- source_word: ἐγέρθητι
  choice: 起きなさい
  rationale: 死者に向けられた命令として自然であり、「起き上がれ」ほど粗くなく、「起こされなさい」のように受動の解釈を不自然に固定しない。
theological_decisions:
- issue: 死んだ若者に対するイエスの命令の調子
  choice: 「起きなさい」
  alternative: 「立ち上がりなさい」／「起こされなさい」
  rationale: ἐγέρθητιは形態上受動形だが、この命令では「起きる」という意味に自然に理解できる。命令の権威と厳粛さを保ちつつ、奇跡の教理的意味を訳文で説明し足さない表現とした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、直接話法には簡潔で品位のある調子を保った。単独の節として主語が分かるよう「イエス」を補った。
