id: LUK.7.29
reference: Luke 7:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: (καὶ πᾶς ὁ λαὸς ἀκούσας καὶ οἱ τελῶναι ἐδικαίωσαν τὸν θεόν, βαπτισθέντες τὸ βάπτισμα Ἰωάννου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/029.yaml
  text: And all the people[a], when they heard this, including the tax collectors, declared God to be righteous[b], having been baptized with John's baptism.
translation:
  language: ja
  text: 民衆は皆、徴税人たちも含めて、このことを聞き、ヨハネの洗礼を受けて[b]、神を正しいと認めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「神を義とした」。すなわち、神が正しい方であることを認めたという意味。
    reason: lexical_alternative
  - marker: b
    text: この分詞は原因を表し、「ヨハネの洗礼を受けたので」と理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ λαὸς
  choice: 民衆は皆
  rationale: 単数の集合名詞と πᾶς の広い範囲を、自然な現代日本語で表した。
- source_word: ἀκούσας
  choice: このことを聞き
  rationale: アオリスト分詞を文脈上の時間的な動作として訳し、目的語は直前の発言を指すものとして補った。
- source_word: οἱ τελῶναι
  choice: 徴税人たち
  rationale: 当時の税の徴収に携わる者を表す、明確で一般的な現代語を用いた。
- source_word: ἐδικαίωσαν τὸν θεόν
  choice: 神を正しいと認めた
  rationale: 人々が神を正しい方、正当な方と認定したという意味を表し、人が神を義なる者にしたかのような誤解を避けつつ、δικαιόω の法廷的な含みを保った。
- source_word: βαπτισθέντες
  choice: 洗礼を受けて
  rationale: アオリスト受動分詞を、明示的に原因と断定しない接続形で訳し、主動詞との状況的なつながりを保った。
- source_word: τὸ βάπτισμα Ἰωάννου
  choice: ヨハネの洗礼
  rationale: 属格を簡潔で自然な所有・関係表現として訳した。
theological_decisions:
- issue: 「神を義とした」の意味
  choice: 人々が神を正しいと認めた
  alternative: 神を義とした
  rationale: この句は神の性質や身分を人が変えたという意味ではなく、神が正しいと認定・表明したことを指す。本文は意味を明確にし、直訳的な表現は脚注に残した。
- issue: βαπτισθέντες の分詞の働き
  choice: 状況・背景を示すものとして「洗礼を受けて」と訳す
  alternative: 原因を示すものとして「洗礼を受けたので」と訳す
  rationale: 文脈上、原因の含みはあり得るが、ギリシア語の分詞そのものは原因を明示しないため、本文では解釈を限定せず、可能な因果的理解を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「神を正しいと認めた」により原文の法廷的な含みを読みやすく表し、「洗礼を受けて」によって分詞の解釈上の余地を残した。
