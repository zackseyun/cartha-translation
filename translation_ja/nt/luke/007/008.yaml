id: LUK.7.8
reference: Luke 7:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γὰρ ἐγὼ ἄνθρωπός εἰμι ὑπὸ ἐξουσίαν τασσόμενος, ἔχων ὑπ’ ἐμαυτὸν στρατιώτας, καὶ λέγω τούτῳ· Πορεύθητι, καὶ πορεύεται, καὶ ἄλλῳ· Ἔρχου, καὶ ἔρχεται, καὶ τῷ δούλῳ μου· Ποίησον τοῦτο, καὶ ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/008.yaml
  text: For I too am a man placed under authority[a], with soldiers under me; and I say to this one, ‘Go,’ and he goes; and to another, ‘Come,’ and he comes; and to my servant, ‘Do this,’ and he does it.
translation:
  language: ja
  text: というのも、私もまた権威の下に置かれている人間であり、私の下には兵士たちがいます。私は、この者に『行け』と言えば行き、別の者に『来い』と言えば来ます。また、私の奴隷[a]に『これをしろ』と言えば、そのとおりにします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」とも訳せる。ギリシア語ドゥーロスは、他者の所有または拘束下にある身分の者を指すが、文脈によっては広く「使用人」の意味でも用いられる。
    reason: δοῦλοςの隷属的身分を本文で明示しつつ、日本語で可能な文脈的訳語も提示するため。
lexical_decisions:
- source_word: καὶ γὰρ
  choice: というのも
  rationale: 百人隊長が直前の発言の根拠を説明する接続表現。καίを不自然に逐語化せず、γάρの説明的な働きを明確にした。
- source_word: ἐγὼ ἄνθρωπός εἰμι
  choice: 私もまた…人間であり
  rationale: 明示されたἐγώの強調と、καίが示す「私も」という比較を保った。ἄνθρωποςは話者自身を指すため、「人間」と訳した。
- source_word: ὑπὸ ἐξουσίαν τασσόμενος
  choice: 権威の下に置かれている
  rationale: τάσσωの受動的な意味と、軍事的な指揮系統の中に配置されている含意を保持した。単に「権威の下にいる」とするより原文に近い。
- source_word: ἔχων ὑπ’ ἐμαυτὸν στρατιώτας
  choice: 私の下には兵士たちがいます
  rationale: 百人隊長自身も上位の権威に服しながら、配下を持つという階層関係を、明瞭で自然な日本語で表した。
- source_word: λέγω τούτῳ
  choice: この者に…と言えば
  rationale: 指示代名詞τούτῳの指示的な力を「この者」で保ち、反復的・一般的な命令と応答を日本語の条件表現で自然に示した。
- source_word: Πορεύθητι / πορεύεται
  choice: 『行け』と言えば行き
  rationale: 命令とその実行の簡潔な対応関係を保持した。
- source_word: Ἔρχου / ἔρχεται
  choice: 『来い』と言えば来ます
  rationale: 原文の命令・応答の並行構造を明確に再現した。
- source_word: τῷ δούλῳ μου
  choice: 私の奴隷
  rationale: δοῦλοςが示す隷属・所有下の身分が、この権威関係の比喩では重要であるため「奴隷」とした。文脈に応じてより広く「しもべ」と訳す余地は脚注に示した。
- source_word: Ποίησον τοῦτο, καὶ ποιεῖ
  choice: 『これをしろ』と言えば、そのとおりにします
  rationale: τοῦτοを受ける実行内容を日本語で自然かつ明確にするため「そのとおりに」を補った。命令が直ちに実行される趣旨は維持している。
theological_decisions:
- issue: 百人隊長の権威とイエスの権威の類比
  choice: 「私もまた権威の下に置かれている」と訳し、従属と委任された権威の両面を保つ
  alternative: 「私も権威を持つ者だから」と意訳する
  rationale: 原文は百人隊長が権威を持つだけでなく、自らも権威の下に配置されていることを明記する。イエスとの類比がどの点にあるかを訳文で一義的に決めず、原文の神学的な緊張と含意を保持した。
- issue: δοῦλοςの社会的身分
  choice: 奴隷
  alternative: しもべ／使用人
  rationale: この例では命令に服する身分と権威構造が中心であり、「奴隷」が原語の社会的現実を最も明確に伝える。ただし、家内奉仕者を指す文脈的な訳語の可能性は脚注で示した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、百人隊長の礼節ある語り口として文末は丁寧体にした。引用内の命令は軍事的な簡潔さを保つため「行け」「来い」「これをしろ」とした。
