source:
  edition: SBLGNT
  text: φίλημά μοι οὐκ ἔδωκας· αὕτη δὲ ἀφ’ ἧς εἰσῆλθον οὐ διέλιπεν καταφιλοῦσά μου τοὺς πόδας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/045.yaml
  text: You gave me no kiss[a], but from the time I came in[b], she has not stopped kissing my feet.
translation:
  language: ja
  text: あなたは私に口づけ[a]をしなかった。だが、この女性は、私が入って来た時から、私の足に口づけをするのをやめなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 挨拶の口づけとも訳せる。口づけは客を迎える際の慣習的な歓待のしるしだった。
    reason: cultural_note
  - marker: b
    text: 「口づけをする」に当たる語は、愛情を込めて、または繰り返し口づけすることを表し得る。「私の足に何度も口づけをし続けた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: φίλημά μοι οὐκ ἔδωκας
  choice: あなたは私に口づけをしなかった
  rationale: ギリシア語は直訳すれば「あなたは私に口づけを与えなかった」だが、日本語では「口づけをする」が自然である。μοιの間接目的語の意味は「私に」で明示した。
- source_word: αὕτη δὲ
  choice: だが、この女は
  rationale: δέの対比を「だが」で示し、指示代名詞αὕτηは場面にいる女性を指すため「この女」とした。
- source_word: ἀφ’ ἧς εἰσῆλθον
  choice: 私が入って来てからずっと
  rationale: ἀφ’ ἧςの起点から発話時まで続く時間的意味を、自然な日本語で明確にした。「ずっと」は後続する継続表現と合わせて継続性を伝える。
- source_word: οὐ διέλιπεν καταφιλοῦσά
  choice: 口づけするのをやめなかった
  rationale: διαλείπωの「やめる、途切れさせる」と現在分詞の継続的な行為を素直に表した。καταφιλέωの愛情のこもった、または反復的な含みは本文で限定せず脚注に示した。
- source_word: μου τοὺς πόδας
  choice: 私の足に
  rationale: τοὺς πόδαςは複数形だが、日本語の「足」は通常、両足を含めて単数形の語で自然に表せる。動作の対象は助詞「に」で示した。
theological_decisions:
- issue: 口づけに含意される客への挨拶と歓待の慣習
  choice: 本文では行為を「口づけ」とだけ訳し、慣習的意味は脚注に置く
  alternative: 「挨拶の口づけ」または「客を迎える口づけ」と本文で説明する
  rationale: 本文のギリシア語は単に「口づけ」と述べている。シモンの歓待不足と女性の献身の対比は文脈から伝わるため、文化的説明を本文へ織り込まず、解釈を不必要に固定しない。
- issue: καταφιλέωの強意・反復性
  choice: 本文は「口づけするのをやめなかった」とし、強意的な含みを脚注で示す
  alternative: 「何度も熱心に口づけし続けた」
  rationale: この動詞は愛情のこもった口づけや繰り返す口づけを表し得るが、強意の程度を一つに限定しない。οὐ διέλιπενが継続を明示しているため、本文は簡潔に保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの厳粛な対比が保たれるよう「だが」を採用した。「接吻」より一般読者に自然で品位のある「口づけ」を選んだ。人称表記は読みやすい「私」で統一した。
