  text: καὶ ὑποστρέψαντες ⸂εἰς τὸν οἶκον οἱ πεμφθέντες⸃ εὗρον ⸀τὸν δοῦλον ὑγιαίνοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/010.yaml
  text: And when those who had been sent returned to the house[a], they found the servant healthy.
translation:
  language: ja
  text: 遣わされた人たちが家に戻ると、その奴隷[a]が元気でいるのを見つけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「召使い」。ギリシア語ドゥーロスは、文脈により「奴隷」または「召使い」と訳し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: 戻ると
  rationale: アオリスト分詞の時間的な働きを自然な日本語で表し、戻った後に確認したという出来事の順序を保つ。
- source_word: εἰς τὸν οἶκον
  choice: 家に
  rationale: εἰςの移動先を簡潔に示し、「自宅」と限定せず、具体的な場所としての家を保つ。
- source_word: οἱ πεμφθέντες
  choice: 遣わされた人たち
  rationale: 受動の意味を保ちつつ、「使者」という名詞を補わずに集団を表す。
- source_word: εὗρον
  choice: 見た
  rationale: ここでは、戻った人々が奴隷の健康な状態を実際に確認したことを表す自然な叙述。直訳的な「見いだした」より現代日本語として明瞭である。
- source_word: τὸν δοῦλον
  choice: その奴隷
  rationale: δοῦλοςが示す隷属的な社会的身分を明示する。定冠詞と先行文脈を「その」で受ける。
- source_word: ὑγιαίνοντα
  choice: 元気である
  rationale: ὑγιαίνωの「健康である、健全である」という状態を表し、「癒やされていた」と原因や過程まで明示することを避ける。
theological_decisions:
- issue: 癒やしの物語におけるδοῦλοςの訳語
  choice: 奴隷
  alternative: 召使い
  rationale: 当時の隷属的身分を曖昧にしないため「奴隷」を本文に採用する。一方、文脈上は主人に仕える者として「召使い」とも訳せるため、脚注に代案を示す。
translation_notes:
  register: 明瞭な現代標準日本語。物語の簡潔さを保ち、受動表現と出来事の順序を自然に再現した。
