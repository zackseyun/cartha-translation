id: LUK.7.20
reference: Luke 7:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: παραγενόμενοι δὲ πρὸς αὐτὸν οἱ ἄνδρες εἶπαν· Ἰωάννης ὁ βαπτιστὴς ⸀ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/020.yaml
  text: When the men came to him[a], they said, “John the Baptist has sent us to you, saying, ‘Are you the one who is to come, or should we expect another?’”
translation:
  language: ja
  text: その男たちはイエスのもとに来て、言った。「バプテスマのヨハネが私たちをあなたのもとに遣わし、こう尋ねています。『来るべき方[a]は、あなたですか。それとも、別の方を待ち望むのでしょうか。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「来る方」。待望されている人物を指す表現。
    reason: ギリシア語の定冠詞付き現在分詞が持つ字義と、文脈上の称号的な含みを示すため。
lexical_decisions:
- source_word: παραγενόμενοι δὲ πρὸς αὐτόν
  choice: イエスのもとに来て
  rationale: 到着・接近を表すアオリスト分詞と方向を表す前置詞句を、自然な物語の流れで表した。代名詞の指示対象は文脈上イエスなので、現代日本語で明確になるよう固有名を用いた。
- source_word: οἱ ἄνδρες
  choice: その人たちは
  rationale: 男性の使者たちを指すが、日本語の「男たち」は不自然に粗い響きを帯びやすい。「その人たち」で既出の一行を自然に受けた。
- source_word: Ἰωάννης ὁ βαπτιστής
  choice: バプテスマのヨハネ
  rationale: 日本語の聖書用語として広く理解され、ヨハネをバプテスマを授ける者として特定する表現である。
- source_word: ἀπέστειλεν ἡμᾶς πρὸς σὲ λέγων
  choice: 私たちをあなたのもとに遣わし、こう尋ねています
  rationale: 派遣と伝言の関係を明確にしつつ、λέγων が導く内容が質問であることを自然な日本語で表した。現在形「尋ねています」は、使者がその場で委託された問いを伝えている現時点での関連性を示す。
- source_word: ὁ ἐρχόμενος
  choice: 来るべき方
  rationale: 定冠詞付き分詞が文脈上、待望される人物を指す称号的表現であることを、簡潔で格調ある日本語にした。「べき」はここでは義務ではなく、予期・定めを表す。
- source_word: ἄλλον προσδοκῶμεν
  choice: ほかの方を待つべきでしょうか
  rationale: ἄλλον は別の人物を、προσδοκῶμεν は期待しつつ待つことを表す。日本語では人物への敬意と対句の自然さを保つため「ほかの方」とした。
theological_decisions:
- issue: ὁ ἐρχόμενος のメシア的・終末論的な含意
  choice: 「来るべき方」と訳し、称号的な響きを保つ
  alternative: 「来られる方」または「来ようとしている方」
  rationale: この句は単に移動中の人物を描写するだけでなく、待望される人物を指す。しかし「メシア」などの解釈語を本文に加えず、誰を指すかという問いの緊張をそのまま残した。
translation_notes:
  register: 明快な現代標準日本語を用い、会話として自然でありながら聖書本文にふさわしい品位を保った。「来るべき方」は広く理解できる伝統的表現だが、義務の意味に限定されないよう脚注で補った。
