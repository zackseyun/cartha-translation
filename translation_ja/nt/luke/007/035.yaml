  text: καὶ ἐδικαιώθη ἡ σοφία ἀπὸ ⸂πάντων τῶν τέκνων αὐτῆς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/035.yaml
  text: Yet wisdom was vindicated by all her children[a][b][c].
translation:
  language: ja
  text: しかし、知恵は、そのすべての子どもたちによって正しいと認められた[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「知恵は正しさを立証された」または「知恵が正しいことは明らかになった」。
    reason: lexical_alternative
  - marker: b
    text: 「子どもたち」は、知恵が正しいことを自らの応答や生き方によって示す人々を表す比喩。
    reason: lexical_alternative
  - marker: c
    text: マタイ11:19では「知恵が正しいことは、その行いによって証明された」となっている。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: しかし
  rationale: 直前で、この時代の人々がヨハネにも人の子にも難癖をつけたことを受ける対照を自然な日本語で示す。
- source_word: ἐδικαιώθη
  choice: 正しいことは…証明された
  rationale: ここでは法廷的な義認というより、知恵が正しいと示される意味。受動形と公に立証される含意を保つ。
- source_word: ἡ σοφία
  choice: 知恵
  rationale: 標準的な訳語。後続する「その…子どもたち」という比喩によって擬人化も保たれる。
- source_word: ἀπὸ πάντων
  choice: そのすべての…によって
  rationale: 受動動詞に伴うἀπόを、立証する主体・根拠を表す自然な日本語の「によって」とした。πάντωνの「すべて」も明示する。
- source_word: τῶν τέκνων αὐτῆς
  choice: そのすべての子どもたち
  rationale: τέκναの直接的な比喩表現を保持し、「行い」「結果」などと解釈して置き換えない。日本語では文脈上、知恵に属する子どもたちを「その」で自然に表す。
theological_decisions:
- issue: 「知恵の子どもたち」が指すもの
  choice: 知恵に属し、応答や生き方によってその正しさを示す者たちを表す比喩として、本文では字義どおり「子どもたち」と訳す。
  alternative: 知恵が生み出す結果や実、またはマタイ11:19の「行い」に寄せて解する。
  rationale: ルカ本文はτέκνων（子どもたち）と読むため、比喩と神学的緊張を本文に残し、特定の解釈へ限定しない。
translation_notes:
  register: 明瞭で現代的かつ格調を保つ文体。「立証された」より日常的に理解しやすい「証明された」を採用しつつ、受動構文と原文の比喩を維持した。
