reference: Luke 7:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ⸀ἐκείνῃ τῇ ὥρᾳ ἐθεράπευσεν πολλοὺς ἀπὸ νόσων καὶ μαστίγων καὶ πνευμάτων πονηρῶν, καὶ τυφλοῖς πολλοῖς ⸀ἐχαρίσατο βλέπειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/021.yaml
  text: In that hour he healed many from diseases and afflictions and evil spirits[c][b][a], and to many blind people he granted sight.
translation:
  language: ja
  text: その時[a]、イエスは病気や苦しみ[b]、悪霊から多くの人を癒やし、多くの目の見えない人に視力を授けた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「まさにその時」とも訳せる。このギリシア語表現は、特定の時点に焦点を当てている。
    reason: lexical_alternative
  - marker: b
    text: 「鞭打ち」「災厄」、または「ひどい患い」とも訳せる。ギリシア語は文字どおりには鞭や鞭打ちを指し、転じて激しい身体的苦痛や災いを表す。
    reason: lexical_alternative
  - marker: c
    text: 直訳すると「見ることを恵みとして与えた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: その時
  rationale: 時間の具体性を保ちつつ、現代日本語として自然な表現とした。指示語を含むため、直前の出来事とのつながりも示される。
- source_word: ἐθεράπευσεν
  choice: 癒やし
  rationale: 福音書の治癒の文脈で一般的かつ自然な訳語であり、身体的な病だけでなく、ここで並記される苦しみや悪霊からの回復も含められる。
- source_word: πολλοὺς
  choice: 多くの人を
  rationale: ギリシア語では目的語の名詞が省略されているが、日本語では「人」を補うことで意味を自然かつ明瞭にした。性別は限定しない。
- source_word: ἀπὸ νόσων
  choice: 病気から
  rationale: ἀπόが表す、患いから離されるという意味を「から」で保った。νόσοςには現代日本語で広く通じる「病気」を用いた。
- source_word: μαστίγων
  choice: 苦しみ
  rationale: 原義は鞭や鞭打ちだが、ここでは転じて人をひどく苦しめる災厄や患いを指す。「苦しみ」は比喩的意味を明瞭に伝え、原義と別訳は脚注に残した。
- source_word: πνευμάτων πονηρῶν
  choice: 悪霊
  rationale: πνεῦμαとπονηρόςを直接反映し、単なる病気の比喩へ還元せず、人格的・霊的存在を指す本文の通常の意味を保った。
- source_word: τυφλοῖς πολλοῖς
  choice: 目の見えない多くの人に
  rationale: 与格を受益者として表し、性別を不必要に限定せず、現代の一般読者に明瞭な言い方とした。
- source_word: ἐχαρίσατο
  choice: 授けた
  rationale: 単に「与えた」よりも、好意によって恵みとして与えるというχαρίζομαιの含意を簡潔に伝える。
- source_word: βλέπειν
  choice: 視力
  rationale: 字義は「見ること」だが、「視力を授けた」とすることで日本語として自然にし、見る能力の回復を明確にした。字義的表現は脚注に示した。
theological_decisions:
- issue: πνευμάτων πονηρῶνの性質
  choice: 「悪霊」と訳し、イエスが悪霊に対して権威を行使したことを、癒やしの働きの一部として示す。
  alternative: 精神的・身体的な病気を非人格的に表す比喩として訳す。
  rationale: この語句は通常、悪い霊的存在を指すため、その明白な意味を保った。現代的な還元解釈も、本文以上の体系的説明も持ち込まない。
- issue: ἐχαρίσατοに含まれる恵みのニュアンス
  choice: 「授けた」と訳し、自由な好意による賜物という含みを残す。
  alternative: 「見えるようにした」とだけ訳し、結果のみを前面に出す。
  rationale: χαρίζομαιの恩恵的な含意を消さず、同時に特定の教理体系を本文へ付加しない表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔ながら福音書にふさわしい品位を保った。「目の見えない人」は性別を限定せず自然な表現とし、「視力を授けた」によって原文の恩恵的な動詞と日本語の読みやすさを両立させた。
