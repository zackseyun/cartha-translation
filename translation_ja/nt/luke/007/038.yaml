id: LUK.7.38
reference: Luke 7:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ στᾶσα ⸂ὀπίσω παρὰ τοὺς πόδας αὐτοῦ⸃ κλαίουσα, ⸂τοῖς δάκρυσιν ἤρξατο βρέχειν τοὺς πόδας αὐτοῦ⸃ καὶ ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς ἐξέμασσεν, καὶ κατεφίλει τοὺς πόδας αὐτοῦ καὶ ἤλειφεν τῷ μύρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/038.yaml
  text: and standing behind him at his feet[a], weeping, she began to wet his feet with her tears, and was wiping them with the hair of her head[b], and was kissing his feet and anointing them with the perfume.
translation:
  language: ja
  text: そして女は、イエスの後ろ、足もとに立って泣きながら、涙でその足をぬらし始め、自分の髪の毛でぬぐっていた。そして、その足に何度も口づけをし[a]、香油を塗っていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その足に口づけし続け」。ギリシア語の動詞と時制は、繰り返された、または続けられた動作を示し得る。
    reason: lexical_alternative
  - marker: b
    text: 「香油」は、香りのある油または軟膏を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: στᾶσα
  choice: 立って
  rationale: アオリスト分詞の場面設定を、自然な日本語の連用形で表した。
- source_word: ὀπίσω παρὰ τοὺς πόδας αὐτοῦ
  choice: イエスの後ろ、その足もとに
  rationale: ὀπίσωとπαρά＋対格の位置関係を保ち、食卓で横になっているイエスの足側に女がいた情景を明確にした。
- source_word: κλαίουσα
  choice: 泣きながら
  rationale: 継続する泣く行為と、続く動作との同時性を簡潔に表す。
- source_word: τοῖς δάκρυσιν ἤρξατο βρέχειν
  choice: 涙でその足をぬらし始め
  rationale: ἤρξατοの開始相とβρέχεινの基本義を過不足なく保持した。
- source_word: ἐξέμασσεν
  choice: ぬぐっていた
  rationale: 未完了過去の継続性を示しつつ、『乾かした』のように結果を限定せず、拭う動作を表した。
- source_word: ταῖς θριξὶν τῆς κεφαλῆς αὐτῆς
  choice: 自分の髪の毛で
  rationale: 日本語では『頭の髪』は冗長なため、指示対象を明確にしながら自然に訳した。
- source_word: κατεφίλει
  choice: 何度も口づけし
  rationale: 未完了過去と強意的な複合動詞が示し得る反復性を、過度な感情解釈を加えずに表した。
- source_word: ἤλειφεν
  choice: 塗っていた
  rationale: 未完了過去の進行・継続を保持し、香油を足に施す具体的動作として自然に表した。
- source_word: τῷ μύρῳ
  choice: 香油
  rationale: μύρονが指す芳香のある油または軟膏を、聖書文脈でも一般読者にも通じやすい語で訳した。
theological_decisions:
- issue: 女がイエスの足に行った行為の描写
  choice: 泣く、涙でぬらす、髪でぬぐう、口づけする、香油を塗るという具体的行為をそのまま描写した。
  alternative: 『献身を示した』など、行為の宗教的意味を本文に織り込む。
  rationale: 原文は鮮烈な身体的・感情的行為を描くが、その意味をこの節自体では抽象的な神学用語に置き換えていないため。
- issue: κατεφίλειの強意・反復性
  choice: 本文では『何度も口づけし』とした。
  alternative: 単に『口づけし』、または『熱烈に口づけし』とする。
  rationale: 未完了過去と動詞の強意的性格から反復を表し得る一方、『熱烈に』は感情の質を解釈的に限定しやすいため避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、場面の厳粛さと生々しい動作描写を保った。『御足』などの古風・敬語的表現は原文にない社会的含意を加え得るため避け、『足』とした。
