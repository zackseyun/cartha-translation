id: LUK.7.30
reference: Luke 7:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ Φαρισαῖοι καὶ οἱ νομικοὶ τὴν βουλὴν τοῦ θεοῦ ἠθέτησαν εἰς ἑαυτούς, μὴ βαπτισθέντες ὑπ’ αὐτοῦ.)
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/030.yaml
  text: But the Pharisees and the lawyers rejected God's purpose for themselves[b][a], not having been baptized by him.
translation:
  language: ja
  text: しかし、ファリサイ派の人々と律法の専門家たちは、ヨハネから洗礼を受けないまま、自分たちに関わる神の計画を拒んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちのための神の計画」、あるいは「自分たちに対する神の計画」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: νομικοὶ
  choice: 律法の専門家たち
  rationale: モーセの律法に通じた者を指す。「法律家」では現代の法曹と誤解されやすく、「律法学者」よりも原語の専門性を明瞭に伝える。
- source_word: βουλὴν
  choice: ご計画
  rationale: βουλήの「意図・計画」という意味を、神についての文脈にふさわしい自然で格調ある日本語で表す。「み旨」より具体的で、「助言」という誤解も避けられる。
- source_word: ἠθέτησαν
  choice: 拒んだ
  rationale: ἀθετέωが表す拒絶・退ける行為を簡潔に伝える。「無効にした」では神の計画そのものを無効化できたとの含意が強くなりすぎる。
- source_word: εἰς ἑαυτούς
  choice: 自分たちに対する
  rationale: 彼ら自身に関わる神の計画という関係を示しつつ、「彼らに逆らう」と断定しない。「自分たちのための」も可能だが、εἰςの曖昧さをやや狭める。
- source_word: μὴ βαπτισθέντες ὑπ’ αὐτοῦ
  choice: ヨハネから洗礼を受けず
  rationale: 否定されたアオリスト受動分詞を自然な日本語の付帯状況として表し、明示的な因果表現は加えない。日本語では代名詞「彼」だけでは指示対象が不明瞭なため、直前の文脈上の指示対象ヨハネを本文で明示する。
- source_word: δὲ
  choice: しかし
  rationale: 前節でヨハネの洗礼を受けた人々との対照を明確に示す。
theological_decisions:
- issue: ファリサイ派と律法の専門家たちに関する神のβουλήの意味
  choice: 自分たちに対する神のご計画
  alternative: 自分たちのための神のご計画／自分たちに不利な神の御旨
  rationale: 神の計画が彼ら自身に関わることを保ちつつ、それが絶対的な決定なのか、救いへの意図なのか、裁きの宣告なのかを本文だけで決めない。神の主権と人間による拒絶との緊張も解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「律法の専門家」で歴史的意味を明確化した。神への敬意を示すため「ご計画」とした。原文末の閉じ括弧は節単独では対応する開き括弧がないため採用していない。
