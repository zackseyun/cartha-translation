revisions:
- from: しかし、ファリサイ派の人々と律法の専門家たちは、ヨハネから洗礼を受けず、自分たちに対する神のご計画を拒んだ。[a]
  to: しかし、ファリサイ派の人々と律法の専門家たちは、ヨハネから洗礼を受けないまま、自分たちに関わる神の計画を拒んだ。[a]
  rationale: 本文は原文の対比、律法専門家の歴史的意味、神のβούληへの拒絶を保った。εἰς ἑαυτούςは「自分たちに関わる」として、彼らに向けられた計画、彼らのための計画、彼ら自身に関する計画という解釈上の幅を本文で不必要に限定しない。脚注も、神の計画が彼らに害を意図するとの読みへ傾けず、中立的な訳語の選択肢だけを示した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:59Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は主要語を概ね正確に反映している。νομικοίを「律法の専門家たち」とするのは適切であり、ἠθέτησανも「拒んだ」でよい。ただし、μὴ βαπτισθέντες ὑπ’ αὐτοῦは因果を明示しない付帯的な分詞であるため、「受けず」よりも「受けないまま」のほうが、拒絶の手段・原因・単なる付帯状況のいずれにも確定しない原文の含みをよく保つ。αὐτοῦの指示対象をヨハネと明示することは、直前の文脈に照らした自然な明確化として許容できる。
  naturalness: 「自分たちに対する神のご計画」も理解可能だが、「自分たちに関わる神の計画」のほうが現代標準日本語として自然で、εἰς ἑαυτούςの関係的な幅も保てる。「神のご計画」は不自然ではないものの、本文では「神の計画」として簡潔にする。
  terminology: 「ファリサイ派の人々」「律法の専門家たち」「洗礼」は適切である。脚注の「自分たちに不利な神の御旨」は、「彼ら自身に対して／彼らに関して」という構文上の代案を、神の意図が彼らに害を与えるという意味に狭めうるため修正が必要である。
  issues:
  - severity: medium
    issue: 脚注の代案「自分たちに不利な神の御旨」
    rationale: εἰς ἑαυτούςについて「自分たちに対して」「自分たちに関して」、文脈上「自分たちを害して」と理解する可能性はあるが、「神の御旨」が彼らに不利であるという意味に固定する訳は過度に解釈的になりうる。代案はより中立的に示すべきである。
  - severity: low
    issue: 「ヨハネから洗礼を受けず」の分詞処理
    rationale: 誤訳ではないが、日本語の「～ず」は文脈によって因果・手段の結び付きをやや強く感じさせることがある。「受けないまま」は原文の分詞が持つ未確定の関係をより保つ。
