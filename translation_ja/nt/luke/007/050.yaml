base_translation:
  language: en
  yaml_path: translation/nt/luke/007/050.yaml
  text: And he said to the woman[a], “Your faith has saved you[b]; go in peace.”
translation:
  language: ja
  text: そして、イエスはその女性に言われた。「あなたの信仰[a]があなたを救った[b]。平安のうちに行きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの信頼」とも訳せる。「あなたの忠実さ」は、この文脈では可能性が低い。
    reason: lexical_alternative
  - marker: b
    text: 「あなたを癒やした」とも訳せる。ギリシア語の動詞は「救う」「助け出す」「癒やす」を意味し得るが、ここでは文脈上、罪の赦しと救いが強調されている。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ πρὸς τὴν γυναῖκα
  choice: そして、その女に言われた
  rationale: δέを物語の継続を示す「そして」とし、εἶπενは日本語として自然で敬意を保つ「言われた」とした。γυνήは文脈上「妻」ではなく、場面に登場する「女」を指す。
- source_word: Ἡ πίστις σου
  choice: あなたの信仰
  rationale: πίστιςはここではイエスに寄せた信頼を表すが、救いとの結びつきと語の幅を保つため、本文では「信仰」とした。「信頼」も可能であるため脚注に示した。
- source_word: σέσωκέν σε
  choice: あなたを救った
  rationale: σῴζωの完了形であり、完了した行為とその持続する結果を示す。この箇所では罪の赦しが中心であるため「救った」が最も適切である。
- source_word: πορεύου εἰς εἰρήνην
  choice: 平安のうちに行きなさい
  rationale: 直訳的な「平安へ行きなさい」ではなく、出発後も平安にあることを願う慣用的な表現として、自然かつ荘重な日本語にした。
theological_decisions:
- issue: σῴζωが示す救いと癒やしの関係
  choice: 救った
  alternative: 癒やした／元気にした
  rationale: 直前の文脈は罪の赦しと女の信仰を強調しているため、治療的意味だけに限定せず「救った」とした。ただしσῴζω自体には身体的回復を表す用法もあるため、その可能性を脚注に残した。
- issue: πίστιςの意味
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: この文脈では女がイエスに寄せた信頼が中心である。「忠実さ」も語義上はあり得るが、ここでは可能性が低い。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、イエスの発言には自然な敬意と簡潔な荘重さを持たせた。「平安のうちに」は聖書的な響きを保ちながら、現代の読者にも理解できる表現である。
