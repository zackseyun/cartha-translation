id: LUK.7.3
reference: Luke 7:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ ἀπέστειλεν πρὸς αὐτὸν πρεσβυτέρους τῶν Ἰουδαίων, ἐρωτῶν αὐτὸν ὅπως ἐλθὼν διασώσῃ τὸν δοῦλον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/003.yaml
  text: When he heard about Jesus[a], he sent to him elders of the Jews, asking him to come and save his servant.
translation:
  language: ja
  text: 百人隊長はイエスのことを聞くと、ユダヤ人の長老たちをイエスのもとに送り、来て自分の奴隷[a]を救ってくださるよう頼んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「僕（しもべ）」または「召使い」。ギリシア語ドゥーロスは、文脈により「奴隷」または「僕」を意味する。ここでは百人隊長の権威のもとにある隷属身分を明確にするため、「奴隷」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας δὲ περὶ τοῦ Ἰησοῦ
  choice: イエスのことを聞くと
  rationale: アオリスト分詞が主動詞に先立つ状況を示すため、自然な現代日本語で時間的関係を表した。δέは弱い接続辞なので独立した語にはせず、文の流れに含めた。
- source_word: ἀπέστειλεν πρὸς αὐτὸν
  choice: イエスのもとに送り
  rationale: 代名詞の指示対象を日本語で明確にするため「イエス」と補い、派遣したという動作を直接表した。
- source_word: πρεσβυτέρους τῶν Ἰουδαίων
  choice: ユダヤ人の長老たち
  rationale: 単に年長者ではなく共同体の指導者を指すπρεσβύτεροιの意味と、属格構文を自然に伝える。
- source_word: ἐρωτῶν αὐτὸν ὅπως ἐλθὼν
  choice: 来て…くださるよう頼んだ
  rationale: 依頼の内容を示すὅπως節を、日本語の敬意を伴う自然な依頼表現にした。分詞ἐλθώνの「来る」という動作も保持した。
- source_word: διασώσῃ
  choice: 救って
  rationale: 重病から救うという文脈に合い、「癒やす」とだけ限定せず、διασῴζωが持つ救助・保全の幅を残した。
- source_word: τὸν δοῦλον αὐτοῦ
  choice: 自分の奴隷
  rationale: この家政的・社会的文脈では、δοῦλοςが示す隷属身分を「奴隷」で明示する。「自分の」は主語である百人隊長への再帰的関係を自然に表す。
theological_decisions:
- issue: 家の従属者を指すδοῦλοςの訳語
  choice: 奴隷
  alternative: 僕（しもべ）／召使い
  rationale: 百人隊長の権威下にある人物の隷属的な社会身分を曖昧にしないため「奴隷」とした。ただし、奉仕の役割に重点を置く伝統的な訳語も脚注に残した。
- issue: διασώσῃを身体的治癒に限定するか
  choice: 救って
  alternative: 癒やして
  rationale: 直前の文脈では重病からの回復を指すが、語そのものの「救い出す、無事にする」という広がりを保つため「救って」とした。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、聖書本文にふさわしい落ち着いた語調を保った。ギリシア語では主語が省略されているが、前節から明らかな「百人隊長」を独立した節でも理解しやすいよう補った。
