source:
  edition: SBLGNT
  text: ἀλλὰ τί ⸀ἐξήλθατε ἰδεῖν; ἄνθρωπον ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον; ἰδοὺ οἱ ἐν ἱματισμῷ ἐνδόξῳ καὶ τρυφῇ ὑπάρχοντες ἐν τοῖς βασιλείοις εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/025.yaml
  text: But what did you go out to see? A man dressed in soft clothing? Look[b][a], those who are in splendid clothing and luxury are in royal palaces.
translation:
  language: ja
  text: しかし、何を見に出て行ったのですか。柔らかな衣服[a]を身に着けた人ですか。見なさい。華麗な衣服を身に着け、ぜいたくに暮らしている人々は、王宮[b]にいるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「上質な衣服」。ここでいう「柔らかな」は、ぜいたくと結びついた繊細で上等な衣服を指し、人格の弱さを意味しない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「王たちの宮廷」。原語は王の住居、または宮廷を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 先行する問いを受けて対照的な問いを重ねる接続詞。現代日本語で自然な逆接として表した。
- source_word: ἐξήλθατε ἰδεῖν
  choice: 何を見に出て行ったのですか
  rationale: 不定詞の目的用法とアオリストの過去の行為を、自然な日本語の修辞疑問として表した。
- source_word: ἄνθρωπον
  choice: 人
  rationale: ここでは目にする一人の男性を指すが、日本語では文脈上「人」が自然であり、指示対象の性別を否定しない。
- source_word: ἐν μαλακοῖς ἱματίοις ἠμφιεσμένον
  choice: 柔らかな衣をまとった
  rationale: μαλακόςの具体的な「柔らかい、上質な」という衣服の性質を保ち、道徳的な弱さという含意を持ち込まない。「まとった」は完了分詞が示す着衣状態を自然に表す。
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 聞き手の注意を次の説明へ向ける指示表現として、荘重さを保ちつつ現代語で明瞭にした。
- source_word: ἐν ἱματισμῷ ἐνδόξῳ
  choice: 華やかな衣を着て
  rationale: ἐνδόξῳが表す目立つ豪華さや壮麗さを、衣服について自然な「華やかな」で表した。
- source_word: τρυφῇ ὑπάρχοντες
  choice: ぜいたくに暮らしている
  rationale: τρυφήはぜいたくや享楽的な暮らしを指す。単に所有物ではなく生活状態を述べる構文として自然に表した。
- source_word: ἐν τοῖς βασιλείοις
  choice: 王宮に
  rationale: βασίλειαは王の住居や宮廷を指す。ギリシャ語は複数形だが、日本語の総称的表現では「王宮に」が自然で、王侯の住まいという対照を保持する。
theological_decisions:
- issue: μαλακοῖςがこの文脈で表す意味
  choice: 柔らかく上質な衣服への具体的言及
  alternative: 軟弱さや女性的性質を暗示する表現
  rationale: 荒野にいたヨハネと宮廷のぜいたくを対照させる文脈であり、後半の華やかな衣とぜいたくな生活が社会的・経済的対照を明示している。人格への道徳的評価は訳文に加えない。
- issue: βασιλείοιςが指す場所
  choice: 王宮
  alternative: 王たちの宮廷
  rationale: 王の住居と宮廷環境の双方を含み得るため、本文では簡潔で自然な「王宮」とし、別訳を注記した。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの連続する修辞疑問と、荒野の質素さに対する宮廷生活の華やかさという対照を保った。「衣」「まとった」「王宮」によって品位を保ちつつ、古語的になりすぎない表現とした。
