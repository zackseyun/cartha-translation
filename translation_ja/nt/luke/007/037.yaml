revisions:
- from: すると、見よ、その町に罪人である一人の女がいた。彼女は、イエスがそのファリサイ派の人の家で食卓に横になっておられる[a]ことを知り、香油の入った雪花石膏の壺[b]を持って来た。
  to: すると見よ、その町に罪人である一人の女がいた。彼女は、イエスがそのファリサイ人の家で食卓で横になっておられる[a]ことを知り、香油の入った雪花石膏の壺[b]を持って来た。
  rationale: ファリサイ派の一員を指す固有の呼称を「ファリサイ人」に改めた。また、横臥して食事をする意味を保ちつつ、日本語としての誤解を減らすため「食卓で横になっておられる」とした。その他の文言、特に女の罪を特定しない「罪人」と、町との関係を限定しない表現は維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:28:04Z'
review_pass:
  verdict: revise
  source_fidelity: 原文の主要な意味はよく保たれている。「罪人」は罪の内容を特定せず、ἐν τῇ πόλειも限定的に解釈していない。κατάκειταιの食事時の横臥も本文と注で適切に示されている。ただし、Φαρισαίουはユダヤ教内の集団・成員を指す「ファリサイ人」であり、「ファリサイ派の人」は現代日本語として不自然で、用語としても不正確である。
  naturalness: 全体は明瞭な現代標準日本語である。「すると見よ」はやや文語的だが、ἰδοὺの注意喚起を保つ聖書本文の表現として許容できる。「食卓で横になっておられる」とすると、「食卓に横になって」より自然で、横臥して食事をする状況も誤解されにくい。
  terminology: 「ファリサイ人」に修正する必要がある。「罪人」「香油」「雪花石膏」は文脈に適した伝統的かつ理解可能な用語である。女を娼婦などと特定しない方針は原文に忠実である。
  issues:
  - severity: medium
    issue: 「そのファリサイ派の人」
    rationale: Φαρισαῖοςは通常「ファリサイ人」と訳す。この箇所は特定の一人のファリサイ人の家であり、「ファリサイ派の人」は日本語として不自然なうえ、集団名と個人の呼称を不適切に混ぜている。
  - severity: low
    issue: 「食卓に横になっておられる」
    rationale: 意味は通るが、日本語では「食卓に」は文字どおり卓上に横たわる印象も生じうる。「食卓で横になっておられる」のほうが、食事の際の横臥というκατάκειταιの意味を自然に表せる。
