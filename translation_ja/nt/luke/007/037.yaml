source:
  edition: SBLGNT
  text: καὶ ἰδοὺ γυνὴ ⸂ἥτις ἦν ἐν τῇ πόλει⸃ ἁμαρτωλός, ⸀καὶ ἐπιγνοῦσα ὅτι ⸀κατάκειται ἐν τῇ οἰκίᾳ τοῦ Φαρισαίου, κομίσασα ἀλάβαστρον μύρου
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/037.yaml
  text: And behold[a], a woman in the city, who was a sinner, having learned that he was reclining at table in the Pharisee’s house[c][b], brought an alabaster jar of perfume.
translation:
  language: ja
  text: すると見よ、その町に罪人である一人の女がいた。彼女は、イエスがそのファリサイ人の家で食卓で横になっておられる[a]ことを知り、香油の入った雪花石膏の壺[b]を持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当時、正式な食事では、食卓のそばで横になって食べる習慣があった。
    reason: cultural_note
  - marker: b
    text: 「香油の入った雪花石膏の小瓶」とも訳せる。香油は、香料を加えた油または軟膏。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面に注意を引き、意外な人物の登場を生き生きと示す談話標識として訳出した。やや格調があるが、聖書本文として明瞭である。
- source_word: ἥτις ἦν ἐν τῇ πόλει ἁμαρτωλός
  choice: その町に罪人である一人の女がいた
  rationale: ἐν τῇ πόλειを「その町に」と保ち、居住者・出身者・町で有名だった者などに限定しない。ἁμαρτωλόςは罪の種類を特定せず「罪人」とした。
- source_word: ἐπιγνοῦσα
  choice: ことを知り
  rationale: 主動詞に先立って情報を得たことを、自然な現代日本語で表した。
- source_word: κατάκειται
  choice: 食卓に横になっておられる
  rationale: 当時の正式な食事で横になって食べる姿勢を保持し、単なる「食事をしている」や「座っている」への解釈的な平板化を避けた。
- source_word: κομίσασα
  choice: 持って来た
  rationale: 容器を携えてその場へ来たという意味を、簡潔で自然な日本語にした。
- source_word: ἀλάβαστρον μύρου
  choice: 香油の入った雪花石膏の壺
  rationale: 容器の材質・呼称と、中身が香りのある油または軟膏であることを明示した。「壺」は携帯用容器として理解できる平易な語を選んだ。
theological_decisions:
- issue: 女に対する道徳的 characterization
  choice: 罪人である一人の女
  alternative: 罪深い女／娼婦
  rationale: 原文はἁμαρτωλόςとだけ述べ、具体的な罪を示していない。伝統的に想定される「娼婦」を本文へ持ち込まず、名詞的な評価と曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」でルカの鮮明な導入を保持した。敬語はイエスを指す箇所に自然な範囲で用いた。原文が特定しない女の罪の内容は特定していない。
