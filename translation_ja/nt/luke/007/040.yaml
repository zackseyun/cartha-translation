  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτόν· Σίμων, ἔχω σοί τι εἰπεῖν. ὁ δέ· ⸂Διδάσκαλε, εἰπέ, φησίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/040.yaml
  text: And Jesus answered and said to him[a], “Simon, I have something to say to you.” And he said, “Teacher, say it.”
translation:
  language: ja
  text: イエスは彼に答えて言われた。「シモン、あなたに言いたいことがあります。」シモンは言った。「先生、おっしゃってください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: 答えて
  rationale: 後続する発話動詞とともに用いられる定型的な語りの表現。文脈に明示的な問いはないが、相手の内心への応答としての含みを保つ。
- source_word: εἶπεν πρὸς αὐτόν
  choice: 彼に…言われた
  rationale: λέγω＋πρός＋対格を自然な現代日本語で表し、イエスへの敬意を示す通常の敬語を用いた。
- source_word: Σίμων
  choice: シモン
  rationale: 人名を日本語で慣用的に音写した。
- source_word: ἔχω σοί τι εἰπεῖν
  choice: あなたに言いたいことがあります
  rationale: σοίを「あなたに」と明示し、ギリシア語の慣用表現を自然かつ簡明な日本語にした。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 「教師、教える者」を意味する呼びかけを、現代日本語で自然な敬称として訳した。「主」や「主人」のような強い権威の意味は加えていない。
- source_word: εἰπέ
  choice: おっしゃってください
  rationale: 単純な命令形「言ってください」の意味を、話者がイエスに向ける敬意を踏まえた自然な日本語で表した。目的語を補わず、原文の簡潔さを保った。
- source_word: φησίν
  choice: 彼は言った
  rationale: 歴史的現在を、日本語の物語文で自然な過去形として表した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。ギリシア語の「答えて言った」という重複的な語り口は、「答えて言われた」として保持した。シモンの返答では対人敬語を用い、自然な会話としている。
