source:
  edition: SBLGNT
  text: Τίνι οὖν ὁμοιώσω τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης, καὶ τίνι εἰσὶν ὅμοιοι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/031.yaml
  text: To what, then, shall I compare the men of this generation, and what are they like?
translation:
  language: ja
  text: そこで、わたしはこの時代の人々を何にたとえようか。彼らは何に似ているだろうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἀνθρώπους τῆς γενεᾶς ταύτης
  choice: この時代の人々
  rationale: ἄνθρωποι はここでは男女を含む人々を指す一般語であり、γενεά は同時代の人々を指すため、自然な現代日本語で「この時代の人々」とした。
- source_word: Τίνι…ὁμοιώσω
  choice: 何にたとえようか
  rationale: 与格の疑問代名詞と ὁμοιόω の組み合わせを、比較対象を問う日本語として明確に表した。
- source_word: τίνι εἰσὶν ὅμοιοι
  choice: 何に似ているだろうか
  rationale: 直訳的な問いの反復を保ちつつ、自然で格調ある日本語にした。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けて結論的に問いを導く接続を示した。
theological_decisions: []
