  text: οἱ δὲ παραγενόμενοι πρὸς τὸν Ἰησοῦν παρεκάλουν αὐτὸν σπουδαίως λέγοντες ὅτι Ἄξιός ἐστιν ᾧ ⸀παρέξῃ τοῦτο,
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/004.yaml
  text: When they came to Jesus[a], they earnestly appealed to him, saying, “He is worthy that you should grant this to him.”
translation:
  language: ja
  text: 彼らはイエスのもとに来ると、しきりに願った。「彼は、あなたが彼のためにこのことをしてくださるに値する人です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγενόμενοι πρὸς τὸν Ἰησοῦν
  choice: イエスのもとに来ると
  rationale: 分詞の時間的な働きを自然な日本語で表し、単なる移動ではなくイエスのもとに到着したことを示した。
- source_word: παρεκάλουν
  choice: 願って
  rationale: 敬意をもって強く求める文脈に合い、「懇願した」ほど過度に切迫させず、依頼の意味を明確にした。
- source_word: σπουδαίως
  choice: 熱心に
  rationale: 真剣さと強い熱意を表す副詞として、現代日本語で自然な表現を選んだ。
- source_word: Ἄξιός
  choice: 値する人
  rationale: その百人隊長が恩恵を受けるにふさわしいという長老たちの評価を明確に保った。
- source_word: ᾧ παρέξῃ τοῦτο
  choice: あなたにこのことをしていただく
  rationale: 与格関係とπαρέχωの広い意味を、日本語の受益表現で自然に表した。「このこと」は直前の依頼内容を指す原文の指示性を保持する。
theological_decisions:
- issue: 百人隊長の「ふさわしさ」
  choice: 長老たちの発言として「値する人」と訳す
  alternative: 神学的評価として語調を弱め、「してあげてもよい人」とする
  rationale: 本文は話者たちの評価をそのまま伝えており、イエス自身の最終的な評価だとは断定していないため、その緊張を解消せず保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、長老たちの敬意と切実さが伝わる品位ある文体とした。「このこと」を残して、文脈への指示を説明的に言い換えすぎないようにした。
