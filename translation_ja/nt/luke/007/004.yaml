  source_fidelity: 原文の時間的分詞、切実な願い、そして長老たちによる百人隊長の「ふさわしさ」の評価は、全体としてよく反映されている。ただし「あなたにこのことをしていただくに値する人」は、依頼を受ける者を主語にした日本語としてやや構文が取りにくく、与格関係（その人のために行う）も明瞭でない。
  naturalness: 「熱心に願って言った」は理解可能だが、「しきりに願った」のほうが、σπουδαίωςの強い真剣さを自然な日本語で簡潔に表せる。引用部は「あなたが彼のためにこのことをしてくださるに値する人です」とすると、発話相手への敬意を保ちつつ明瞭である。
  terminology: 「イエス」「値する」は適切であり、神学用語上の問題はない。「彼」は直前文脈の百人隊長を指すため、原文の関係代名詞の照応を自然に明示する範囲にとどまる。
