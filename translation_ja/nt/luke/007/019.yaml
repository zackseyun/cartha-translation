id: LUK.7.19
reference: Luke 7:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔπεμψεν πρὸς τὸν ⸀κύριον λέγων· Σὺ εἶ ὁ ἐρχόμενος ἢ ⸀ἄλλον προσδοκῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/019.yaml
  text: He sent to the Lord, saying, “Are you the Coming One, or should we expect another?”
translation:
  language: ja
  text: そこでヨハネは彼らを主のもとに送り、こう言わせた。「来るべき方はあなたですか。それとも、ほかの方を待つべきでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεμψεν
  choice: 送り
  rationale: アオリスト能動直説法の物語上の過去として訳した。直前の文脈で選ばれた弟子たちが目的語であるため、日本語では「彼らを」を補うと自然である。
- source_word: πρὸς τὸν κύριον
  choice: 主のもとに
  rationale: πρός＋対格の人物への方向を自然な日本語で表した。κύριος はルカの語りにおけるイエスへの敬称であり、キリスト論的な含みも保持する「主」とした。
- source_word: λέγων
  choice: こう言わせた
  rationale: 主語ヨハネ自身が同行して発言するのではなく、遣わした者に問いを伝えさせる構文として、日本語で誤解のない使役表現にした。
- source_word: Σὺ εἶ
  choice: あなたですか
  rationale: 形式上は「あなたは〜である」だが、ἢ と対をなす選択疑問として自然な疑問文にした。Σύ の明示による焦点は「あなた」で保持した。
- source_word: ὁ ἐρχόμενος
  choice: 来るべき方
  rationale: 冠詞付き現在分詞の名詞的用法で、文脈上は待望される人物を指す称号的表現。「来られる方」より自然で、「待望の方」のような説明的意味を過度に加えない。
- source_word: ἄλλον
  choice: ほかの方
  rationale: 人物を指す対格であるため、「別のもの」ではなく敬意を保った「ほかの方」とした。
- source_word: προσδοκῶμεν
  choice: 待つべきでしょうか
  rationale: 現在能動直説法一人称複数。ここでは今後の期待・待望について問う審議的な用法であり、日本語では「待つべきでしょうか」が自然である。「期待すべき」は人物を目的語にするとやや不自然。
theological_decisions:
- issue: κύριος をイエスへの称号としてどう訳すか
  choice: 主
  alternative: 主人
  rationale: 単なる社会的な主人という意味に狭めず、ルカの叙述でイエスに用いられる敬称とキリスト論的な重みを保持する。
- issue: ὁ ἐρχόμενος の称号性と記述性
  choice: 来るべき方
  alternative: 来られる方
  rationale: 待望される終末論的・メシア的な人物を指す称号性を伝えつつ、原文が明示しない「メシア」という語は補わない。「来るべき方」は称号的にも記述的にも読めるため、原文の含みを保つ。
- issue: 問いに表れるヨハネ側の不確かさ
  choice: 選択疑問をそのまま保持
  alternative: あなたこそ待望のメシアなのですか
  rationale: 疑問の動機やヨハネ自身の信仰状態を説明せず、「あなたか、ほかの者か」という原文の神学的緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語。聖書本文としての品位を保ちつつ、硬すぎる直訳を避けた。「そこで」と「彼らを」は前節からのつながりを日本語で明確にする文脈補足である。
