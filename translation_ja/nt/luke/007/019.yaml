  source_fidelity: 原文の「（ヨハネが）…を主のもとに送り、こう言わせた」という構文を、前節で明示される二人の弟子を受ける「彼らを」と使役表現によって正確かつ明瞭に表している。πρὸς τὸν κύριον は「主のもとに」、選択疑問 Σὺ εἶ … ἢ … προσδοκῶμεν は「…あなたですか。それとも…でしょうか」と自然に再現されている。
  naturalness: 明瞭な現代標準日本語であり、聖書本文として適切な品位もある。「そこで」「彼らを」は直前の文脈を日本語として滑らかにつなぐ補足で、本文の意味を過度に拡張していない。
  terminology: 「主」は κύριος のイエスに対する用法を適切に保持する。「来るべき方」は ὁ ἐρχόμενος の称号的響きと記述的な含みをともに保つ、確立した自然な日本語表現である。「ほかの方」も人物を指す ἄλλον にふさわしい。
