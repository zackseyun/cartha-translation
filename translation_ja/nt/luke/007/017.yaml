  text: καὶ ἐξῆλθεν ὁ λόγος οὗτος ἐν ὅλῃ τῇ Ἰουδαίᾳ περὶ αὐτοῦ ⸀καὶ πάσῃ τῇ περιχώρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/017.yaml
  text: And this report about him went out through all Judea and all the surrounding region[a].
translation:
  language: ja
  text: この方についての知らせは、ユダヤ全土と周辺一帯に広まった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 広まった
  rationale: 直訳は「出て行った」だが、知らせが各地へ伝わるという文脈上の慣用的意味を、現代日本語で自然に表した。
- source_word: ὁ λόγος οὗτος
  choice: この知らせ
  rationale: λόγοςはここでは単独の「ことば」よりも、直前の出来事について伝わった知らせ・話を指す。「知らせ」は文脈に即し、平明である。
- source_word: ἐν ὅλῃ τῇ Ἰουδαίᾳ
  choice: ユダヤ全土に
  rationale: ὅλῃの包括的な範囲を「全土」で表し、伝播の到達範囲として自然な助詞「に」を用いた。
- source_word: περὶ αὐτοῦ
  choice: この方についての
  rationale: περί＋属格の「〜について」を保った。αὐτοῦは直前のイエスを指すが、原文同様に名を補わず、敬意を損なわない「この方」とした。
- source_word: πάσῃ τῇ περιχώρῳ
  choice: その周辺一帯
  rationale: περίχωροςが表す周囲の地域全体を、行政区分を過度に想起させない自然な日本語で表した。
- source_word: καὶ ... καὶ
  choice: 〜と〜
  rationale: 二つの地理的範囲を累加的に結ぶ機能を、日本語の簡潔な並列で表した。
theological_decisions: []
translation_notes:
  register: 平明な現代標準日本語を用いながら、指示対象への敬意が自然に伝わる文体とした。
