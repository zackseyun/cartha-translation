source:
  edition: SBLGNT
  text: δύο χρεοφειλέται ἦσαν δανιστῇ τινι· ὁ εἷς ὤφειλεν δηνάρια πεντακόσια, ὁ δὲ ἕτερος πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/041.yaml
  text: 'Two debtors owed a certain moneylender: one owed five hundred denarii[a], and the other fifty.'
translation:
  language: ja
  text: 「ある金貸しには、二人の債務者がいた。一人は五百デナリ[a]、もう一人は五十デナリの借りがあった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一デナリはローマの標準的な銀貨で、一般に労働者一日分ほどの賃金に相当した。
    reason: cultural_note
lexical_decisions:
- source_word: χρεοφειλέται
  choice: 債務者
  rationale: 金銭上の負債を負う人を表す語であり、簡潔で正確な現代日本語として「債務者」を採用した。
- source_word: δανιστῇ τινι
  choice: ある金貸し
  rationale: δανιστήςは金銭を貸す者を指し、τινιは物語に特定されない人物を導入するため、「ある金貸し」とした。
- source_word: ὤφειλεν
  choice: 借りがあった
  rationale: 未完了過去はその時点で負債を負っていた状態を示す。日本語では「借りがあった」が自然で、債務関係も明瞭に伝える。
- source_word: δηνάρια
  choice: デナリ
  rationale: 歴史的な貨幣単位を保つため音写し、その価値の目安は脚注で補った。
- source_word: πεντακόσια
  choice: 五百
  rationale: δηνάριαを修飾する基数をそのまま訳した。
- source_word: ὁ δὲ ἕτερος
  choice: もう一人は
  rationale: ὁ εἷςとの対比を、二人を自然に数える日本語の対句「一人は、もう一人は」で表した。
- source_word: πεντήκοντα
  choice: 五十デナリ
  rationale: 原文では貨幣単位が省略されるが、日本語で金額を明確かつ滑らかに示すため補った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「金貸し」はδανιστήςの具体性を保ち、「債務者」との組み合わせで物語の法的・金銭的構図を簡潔に示した。
