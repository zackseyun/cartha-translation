base_translation:
  language: en
  yaml_path: translation/nt/luke/007/049.yaml
  text: And those reclining at the table with him began to say among themselves[a], “Who is this, who even forgives sins?”
translation:
  language: ja
  text: そして、一緒に食卓に着いていた人々は、互いに[a]言い始めた。「罪をも赦すこの人は、いったい何者なのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それぞれ心の中で言い始めた」とも訳せる。ギリシア語の表現は、客同士のひそかなやり取りとも、各自の内心の思いとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: 言い始めた
  rationale: 不定詞を伴うἄρχομαιのアオリストが示す動作の開始を、自然な現代日本語で明示する。
- source_word: οἱ συνανακείμενοι
  choice: 一緒に食卓に着いていた人々
  rationale: 古代の食事姿勢を逐語的に「横になっていた」とすると現代日本語では不自然になりやすいため、会食の場とσυν-の共同性を明確に伝える表現とした。
- source_word: λέγειν ἐν ἑαυτοῖς
  choice: 互いに言い始めた
  rationale: 複数の客の間で交わされた発言という文脈に適した訳。内心での発言とも取り得る原文の幅は脚注に残す。
- source_word: Τίς οὗτός ἐστιν
  choice: この人は、いったい何者なのか
  rationale: 驚きと問いの鋭さを自然な日本語で表す。「人」は日本語上必要な指示表現として補ったが、人物についての説明は加えていない。
- source_word: καὶ
  choice: まで
  rationale: ここでの上昇的なκαίが示す驚き、すなわち罪を赦すことにまで及ぶという含意を表す。
- source_word: ἁμαρτίας ἀφίησιν
  choice: 罪を赦す
  rationale: この文脈でἀφίημιは罪の赦免を指す定着した表現であり、明瞭かつ神学的含意を保つ。
theological_decisions:
- issue: イエスが罪を赦す権威を持つことの含意
  choice: 客たちの驚きに満ちた問いを、そのまま未解決の問いとして示す。
  alternative: イエスの身分や権威について説明を本文に補う。
  rationale: 本文はキリスト論的な問いを暗示するが、ここでは結論を明言していない。その緊張を保ち、教理的説明を訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「食卓に着く」により自然な会食表現とし、「いったい何者なのか」で原文の驚きと問いの力を伝えた。脚注記号[a]は対応箇所の直後に置いた。
