source:
  edition: SBLGNT
  text: καὶ στραφεὶς πρὸς τὴν γυναῖκα τῷ Σίμωνι ἔφη· Βλέπεις ταύτην τὴν γυναῖκα; εἰσῆλθόν σου εἰς τὴν οἰκίαν, ὕδωρ ⸀μοι ἐπὶ ⸀πόδας οὐκ ἔδωκας· αὕτη δὲ τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας καὶ ταῖς ⸀θριξὶν αὐτῆς ἐξέμαξεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/007/044.yaml
  text: And turning toward the woman[a], he said to Simon, “Do you see this woman? I entered your house; you gave me no water for my feet, but she wet my feet with her tears and wiped them with her hair.”
translation:
  language: ja
  text: それから、イエスはその女のほうを向いて、シモンに言われた。「この女を見ていますか。わたしがあなたの家に入ったとき、あなたはわたしの足のための水をくれませんでした[a]。しかし、この女は涙でわたしの足をぬらし、自分の髪で拭ってくれました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には「わたしの足の上に水をくれませんでした」。客の足を洗うための水を用意する習慣を指しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς πρὸς τὴν γυναῖκα
  choice: その女のほうを向いて
  rationale: イエスが女のほうへ身体を向けたことを、自然な現代日本語で表した。アオリスト分詞が主動詞に先立つ動作を示すことも保っている。
- source_word: τῷ Σίμωνι ἔφη
  choice: シモンに言われた
  rationale: 発言の相手がシモンであることを明確にしつつ、福音書の語りにふさわしい丁寧で自然な敬語とした。
- source_word: Βλέπεις ταύτην τὴν γυναῖκα;
  choice: この女を見ていますか
  rationale: βλέπεις の直接的な「見る」を保ち、単なる視認以上に注意を向けさせる修辞的な問いとしても自然に読める表現とした。
- source_word: εἰσῆλθόν σου εἰς τὴν οἰκίαν
  choice: わたしがあなたの家に入ったとき
  rationale: 直訳的には「わたしはあなたの家に入った」だが、後続するもてなしの欠如との時間的関係を日本語で自然に示した。
- source_word: ὕδωρ μοι ἐπὶ πόδας οὐκ ἔδωκας
  choice: あなたはわたしの足に水をくれませんでした
  rationale: 原文が明示するのは足を洗う行為ではなく、足に対して水を与えることであるため、「洗う」を本文に補わず、ἐπὶ πόδας の表現も反映した。
- source_word: τοῖς δάκρυσιν ἔβρεξέν μου τοὺς πόδας
  choice: 涙でわたしの足をぬらし
  rationale: 道具・手段を示す与格を「涙で」とし、βρέχω の基本義を過度に強めず「ぬらす」と訳した。
- source_word: ταῖς θριξὶν αὐτῆς ἐξέμαξεν
  choice: 自分の髪で拭ってくれました
  rationale: αὐτῆς の再帰的な関係を自然な日本語の「自分の」で示し、ἐκμάσσω は文脈に合う「拭う」とした。「くれました」はシモンの不作為との対照を自然に表す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら福音書にふさわしい品位を保った。「女」はγυνήの直接的な訳であり、文脈上「妻」ではない。イエスの発言には「言われた」を用いたが、過度に古風な敬語は避けた。
