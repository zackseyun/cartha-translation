  to: それから、イエスはその女のほうを向いて、シモンに言われた。「この女を見ていますか。わたしがあなたの家に入ったとき、あなたはわたしの足のための水をくれませんでした[a]。しかし、この女は涙でわたしの足をぬらし、自分の髪で拭ってくれました。」
