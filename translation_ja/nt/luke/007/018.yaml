lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: 知らせた
  rationale: 出来事について情報を伝える、報告するという意味を自然な現代日本語で表す。「報告した」より会話的すぎず、過度に事務的でもない。
- source_word: Ἰωάννῃ
  choice: ヨハネに
  rationale: 与格の間接目的語を日本語の助詞「に」で表した。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: ヨハネの弟子たち
  rationale: 直訳の「彼の弟子たち」では指示対象が曖昧になりやすいため、文脈上の指示対象であるヨハネを明示した。
- source_word: περὶ πάντων τούτων
  choice: これらのことをすべて
  rationale: περίの話題・内容の意味を「知らせた」の目的語として自然に組み込み、πάντωνの包括性とτούτωνの指示性を保った。
- source_word: προσκαλεσάμενος
  choice: 呼び寄せ
  rationale: 自分のもとへ呼ぶという中動態動詞の意味を簡潔で自然な日本語にした。
- source_word: δύο τινὰς
  choice: 二人
  rationale: τινάςは特定の二人を選んだという不定のニュアンスを伴うが、日本語では部分表現「弟子の中から二人」で十分に伝わるため、不自然な「ある二人」は避けた。
- source_word: τῶν μαθητῶν αὐτοῦ
  choice: 弟子の中から
  rationale: 部分属格を明確に表し、ヨハネが弟子の集団から二人を選んで呼んだことを示した。
- source_word: ὁ Ἰωάννης
  choice: そこでヨハネは
  rationale: ギリシア語で明示された主語を保ちつつ、καίを文脈上自然な展開を示す「そこで」とした。
