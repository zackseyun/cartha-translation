  yaml_path: translation/nt/luke/022/038.yaml
  text: And they said[a], “Lord, look, here are two swords.” And he said to them, “It is enough.”
translation:
  language: ja
  text: 彼らは言った。「主よ、ご覧ください。ここに剣が二振りあります。」イエスは彼らに言った。「それで十分だ。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「十分だ」とも訳せる。二振りの剣で足りるという意味ではなく、「その話はもうよい」と会話を打ち切った意味である可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: すると弟子たちは言った
  rationale: δέは弱い接続辞であり、ここでは物語と対話の流れを自然に示す「すると」とした。οἱは直前の対話相手である弟子たちを指すため、日本語では明示した。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの呼びかけであり、新約聖書におけるκύριοςの称号的な響きも保つ。
- source_word: ἰδοὺ
  choice: ご覧ください
  rationale: 注意を促す命令的・直示的な力を、敬意を伴う現代日本語の呼びかけとして表した。
- source_word: μάχαιραι
  choice: 剣
  rationale: 刃のある武器を指すが、短剣などと限定せず、伝統的かつ一般的な訳語を採用した。助数詞は刀剣に自然な「振り」とした。
- source_word: ὧδε δύο
  choice: ここに…二振りあります
  rationale: 場所を示すὧδεと数量δύοを、自然な日本語の語順でともに明示した。
- source_word: Ἱκανόν ἐστιν
  choice: もう十分だ
  rationale: ἱκανόςの「十分な」という意味を簡潔に表す。「もう」は会話を打ち切る含みを持ちうる一方、剣の数が足りるという理解も排除せず、原文の解釈上の緊張を保つ。
theological_decisions:
- issue: イエスの返答Ἱκανόν ἐστινの解釈上の曖昧さ
  choice: もう十分だ
  alternative: それで十分だ／その話はもうよい
  rationale: ギリシア語は、二振りの剣で足りるという数量的判断とも、誤解した弟子たちとの話を打ち切る言葉とも読める。本文ではいずれか一方に確定せず、脚注で両義性を明示した。
translation_notes:
  register: 明快で現代的な標準日本語としつつ、直接話法には簡潔で品位ある調子を保った。「二振り」によって日本語として自然に剣を数えた。
