revisions:
- from: それからイエスは弟子たちに言われた。「わたしがあなたがたを、財布も旅袋[a]も履物も持たせずに遣わした時、何か足りないものがあったか。」彼らは「何もありませんでした」と答えた。
  to: イエスは彼らに言われた。「わたしがあなたがたを、財布も旅袋[a]も履物も持たずに遣わした時、何か足りないものがあったか。」彼らは「何もなかった」と言った。
