  text: Καὶ εἶπεν αὐτοῖς· Ὅτε ἀπέστειλα ὑμᾶς ἄτερ βαλλαντίου καὶ πήρας καὶ ὑποδημάτων, μή τινος ὑστερήσατε; οἱ δὲ εἶπαν· Οὐθενός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/035.yaml
  text: And he said to them[a], “When I sent you out without a money bag and a travel bag and sandals, did you lack anything?” And they said, “Nothing.”
translation:
  language: ja
  text: イエスは彼らに言われた。「わたしがあなたがたを、財布も旅袋[a]も履物も持たずに遣わした時、何か足りないものがあったか。」彼らは「何もなかった」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「背負い袋」とも訳せる。
    reason: πήραは旅の食糧などを入れる袋を指し、その形状について「旅袋」「背負い袋」などの訳が可能なため。
lexical_decisions:
- source_word: ἄτερ
  choice: 持たせずに
  rationale: 単なる「なしに」よりも、派遣時に携行させなかったという文脈を自然な日本語で表す。欠如・不携行の意味は保持している。
- source_word: βαλλαντίου
  choice: 財布
  rationale: 金銭を携帯する袋を指す。現代日本語で簡潔かつ明瞭である。
- source_word: πήρας
  choice: 旅袋
  rationale: 旅の食糧や必需品を入れる袋を指すため、機能と時代的情景の双方を伝える「旅袋」とした。袋の具体的な形状は限定しない。
- source_word: ὑποδημάτων
  choice: 履物
  rationale: 語義はサンダルを含む履物一般であり、複数形も自然に処理できる。「履物」は原文の範囲を不必要に狭めない。
- source_word: μή τινος ὑστερήσατε
  choice: 何か足りないものがあったか
  rationale: μήを伴う否定応答を予期する問いの調子を、日本語で不自然に明示しすぎず保持する。ὑστερέωの不足・欠乏の意味を直接表した。
- source_word: Οὐθενός
  choice: 何もありませんでした
  rationale: 属格による簡潔な「何一つ〔不足しなかった〕」という応答を、直前の問いを受けた自然で丁寧な日本語にした。
- source_word: ἀπέστειλα
  choice: 遣わした
  rationale: 使命を与えて送り出す文脈に適した、聖書本文として自然で格調ある現代日本語である。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発話には自然な威厳を保った。αὐτοῖςは文脈上の指示対象を明確にするため「弟子たち」とした。末尾の応答は日本語の会話として自然になるよう敬体で表現した。
