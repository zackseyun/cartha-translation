  rationale: 本文の意味は維持したまま、「そこで」を原文の中立的な叙述接続により近い「立ち去り」へ改めた。脚注aは、代替訳がτὸ πῶςを含むことを明示し、παραδίδωμιの説明を自然で非限定的な日本語に修正した。脚注マーカーは、引き渡しの表現と警備隊長の同定に適切に対応している。
