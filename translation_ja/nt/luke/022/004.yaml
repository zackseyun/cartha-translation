source:
  edition: SBLGNT
  text: καὶ ἀπελθὼν συνελάλησεν τοῖς ἀρχιερεῦσιν καὶ στρατηγοῖς τὸ πῶς ⸂αὐτοῖς παραδῷ αὐτόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/004.yaml
  text: And he went away and discussed with the chief priests and officers how he might hand him over to them[a][b].
translation:
  language: ja
  text: ユダは立ち去り、祭司長たちや警備隊長たちと、イエスをどのように彼らに引き渡すか[a][b]を相談した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どのようにイエスを裏切るか」。「引き渡す」と訳したギリシア語は、「引き渡す」「相手の手に委ねる」という意味を持ち、この文脈では「裏切る」という意味を含む。
    reason: lexical_alternative
  - marker: b
    text: 「警備隊長たち」は、ローマ兵の隊長ではなく、神殿の警備に携わる役人、または神殿警備隊の指揮官と考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπελθὼν
  choice: 出て行き
  rationale: アオリスト分詞を主動詞に先立つ行為として自然な日本語で表し、ユダがその場から赴いたという動きを保った。
- source_word: συνελάλησεν
  choice: 相談した
  rationale: 単に話しただけでなく、引き渡しの方法について協議したことを示す共同的・ deliberative な意味を自然に表す。
- source_word: ἀρχιερεῦσιν
  choice: 祭司長たち
  rationale: 当時の指導的な祭司層を指す定着した訳語であり、複数の大祭司が同時に在職していたとの誤解を避ける。
- source_word: στρατηγοῖς
  choice: 警備隊長たち
  rationale: エルサレム神殿の文脈で、ローマ軍の一般的な将校ではなく神殿警備に関わる指揮官を指すため。詳細は脚注で補う。
- source_word: τὸ πῶς
  choice: どのように……か
  rationale: 相談の内容を導くギリシア語の慣用表現を、明瞭で自然な間接疑問の形にした。
- source_word: παραδῷ
  choice: 引き渡す
  rationale: 裏切りという文脈上の含みを保ちつつ、語そのものの基本的で具体的な意味を訳した。「裏切る」は脚注に代替訳として示す。
- source_word: αὐτοῖς ... αὐτόν
  choice: イエスを彼らに
  rationale: 日本語では代名詞「彼を」だと指示対象が曖昧になりやすいため、αὐτόνの指示対象を「イエス」と明示し、αὐτοῖςは「彼らに」として両者を区別した。
theological_decisions:
- issue: ユダの行為における παραδῷ の訳
  choice: 引き渡す
  alternative: 裏切る
  rationale: 文脈上は明らかに背信行為だが、ギリシア語動詞は「引き渡す」「引き渡して権力下に置く」というより広い意味を持つ。本文では具体的な語義を保ち、道徳的・神学的含意を一語で確定しすぎないよう、解釈的な代替訳を脚注に置いた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての品位を保った。「そこで」は前節からの叙述の連続を示す。人物名を補って日本語での指示の曖昧さを避けつつ、動作の順序と相談の内容を簡潔に示した。
