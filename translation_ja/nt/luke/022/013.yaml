  text: ἀπελθόντες δὲ εὗρον καθὼς ⸀εἰρήκει αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/013.yaml
  text: So they went and found it just as he had told them[a], and they prepared the Passover.
translation:
  language: ja
  text: 二人は出かけて行き、イエスが彼らに言われたとおりであることを見いだした。そして、過越[a]のための用意をした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「過越の食事」あるいは「過越の小羊」とも訳せる。ギリシア語は、過越の祭り全体を広く指す場合も、その食事や犠牲をより具体的に指す場合もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπελθόντες δὲ
  choice: そこで二人が行ってみると
  rationale: δέは強い対比ではなく物語を進める軽い接続を表すため「そこで」とした。分詞ἀπελθόντεςは主動詞εὗρονに先立つ行為を示し、日本語では「行ってみると」として発見への自然な流れを表した。主語は直前の文脈で遣わされた二人であるため補った。
- source_word: εὗρον καθὼς εἰρήκει αὐτοῖς
  choice: イエスが言われたとおりであった
  rationale: εὗρονには明示的な目的語がなく、彼らが目にした状況が先の言葉どおりだったという意味である。「見つけた」と直訳して不自然な目的語を補うより、「とおりであった」として原文の含意を自然に伝えた。εἰρήκειは先行する発言を示す過去完了であり、文脈上の話者「イエス」を明示した。
- source_word: ἡτοίμασαν
  choice: 用意をした
  rationale: 準備して整えることを表す。現代日本語で簡潔かつ自然な「用意をした」とした。
- source_word: τὸ πάσχα
  choice: 過越
  rationale: πάσχαは過越の祭り全体、過越の食事、または犠牲の小羊を指し得る。本文では範囲を限定せず、原語の広がりを保つため「過越」とした。
theological_decisions:
- issue: πάσχαが指す範囲
  choice: 過越
  alternative: 過越の食事／過越の小羊
  rationale: 直近の文脈は過越を食べるための準備に関わるが、ギリシア語自体は食事や犠牲だけに限定していない。本文では広い語を保ち、可能な限定的意味は注で示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語文として簡潔でありながら落ち着いた調子を保った。「過越」は聖書用語として尊重し、原文が持つ指示範囲の曖昧さを注記によって保持した。
