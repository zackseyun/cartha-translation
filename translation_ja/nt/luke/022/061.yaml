- from: 主は振り向いて、ペトロを見つめられた[a]。するとペトロは、主が自分に言われたことを思い出した。「今日、鶏が鳴く前に、あなたは三度わたしを知らないと言う。」
  to: 主は振り向いて、ペトロを見つめられた[a]。ペトロは、主が自分にこう言われたことを思い出した。「今日、鶏が鳴く前に、あなたは三度わたしを否認する。」
  rationale: ἀπαρνέομαιを「否認する」として、イエスとの関係を否定するという原文の直接的な意味を、特定の発話内容に狭めずに訳した。引用導入に「こう」を補い、日本語としての結び付きを整えた。視線の強さは本文と脚注の組合せで保持し、脚注の表示をその内容に正確な「別訳」とした。
