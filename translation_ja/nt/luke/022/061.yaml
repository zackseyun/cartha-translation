  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ στραφεὶς ὁ κύριος ἐνέβλεψεν τῷ Πέτρῳ, καὶ ὑπεμνήσθη ὁ Πέτρος τοῦ ⸀λόγου τοῦ κυρίου ὡς εἶπεν αὐτῷ ὅτι Πρὶν ἀλέκτορα φωνῆσαι ⸀σήμερον ἀπαρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/061.yaml
  text: And the Lord turned and looked at Peter[a], and Peter remembered the word of the Lord, how he had said to him, “Before a rooster crows today, you will deny me three times.”
translation:
  language: ja
  text: 主は振り向いて、ペトロを見つめられた[a]。ペトロは、主が自分にこう言われたことを思い出した。「今日、鶏が鳴く前に、あなたは三度わたしを否認する。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ペトロをじっと見られた」。このギリシア語動詞は、相手をまっすぐ、あるいは注意深く見ることを含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: 振り向いて
  rationale: アオリスト分詞が、見る動作に先立つ主の動きを示す。「振り向いて」は自然な日本語で動作の順序を保つ。
- source_word: κύριος
  choice: 主
  rationale: ここでイエスに用いられる称号の意味と新約聖書での重みを保つ。
- source_word: ἐνέβλεψεν
  choice: 見つめられた
  rationale: ἐμβλέπω が表し得る、相手に視線をまっすぐ向ける含みを自然に伝える。敬語は主語であるイエスへの物語上の敬意を表す。
- source_word: ὑπεμνήσθη
  choice: 思い出した
  rationale: 形態上は受動的な含みもあり得るが、文脈の焦点はペトロが主の言葉を想起したことにある。
- source_word: λόγου
  choice: 言われたこと
  rationale: ここでは特定の発言を指す。日本語では「主の言葉」よりも後続の引用へ自然につながり、内容が明確になる。
- source_word: ὡς εἶπεν αὐτῷ
  choice: 主が自分に言われた
  rationale: ὡς は想起した発言内容を導く。「自分に」により αὐτῷ の指示対象がペトロであることを自然に示す。
- source_word: Πρὶν ἀλέκτορα φωνῆσαι
  choice: 鶏が鳴く前に
  rationale: πρίν と不定詞による先行時を明確に表す。冠詞のない ἀλέκτωρ は、日本語では単に「鶏」とするのが自然。
- source_word: σήμερον
  choice: 今日
  rationale: 予告の切迫性をそのまま明確に伝える。
- source_word: ἀπαρνήσῃ
  choice: わたしを知らないと言う
  rationale: この受難物語での否認の具体的な内容を、現代日本語で自然に表す。「否む」などの文語を避けつつ、関係の否定という意味を伝える。
- source_word: τρίς
  choice: 三度
  rationale: 簡潔で格調を保ちながら、現代日本語でも明瞭である。
theological_decisions:
- issue: イエスに対する κύριος の訳
  choice: 主
  alternative: 先生／主人
  rationale: 物語上の呼称とキリスト論的な重みの双方を保ち、より限定的な「先生」「主人」に狭めない。
- issue: ἀπαρνέομαι の訳し方
  choice: わたしを知らないと言う
  alternative: わたしを否認する／わたしとの関係を否定する
  rationale: 神学的専門語に寄せすぎず、ペトロの三度の否認が実際に取った形を分かりやすく示す。一方で、単なる発言の訂正ではなくイエスとの関係を否定する重みを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、受難物語にふさわしい簡潔さと品位を保った。イエスの発言には「わたし」、ペトロへの呼びかけには「あなた」を用いた。主語交替は「すると」で明確にした。
