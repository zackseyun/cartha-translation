  naturalness: 全体は明瞭な現代標準日本語であり、簡潔な叙述として自然である。「ペトロは、主が自分に言われたことを思い出した」も理解できるが、「主が自分にこう言われたこと」とすると、後続する直接引用とのつながりがより自然で明確になる。
  terminology: 「主」はκύριοςに適切であり、「ペトロ」も一貫した固有名表記である。「否認する」はやや改まった語だが、現代日本語として通用し、この受難物語におけるἀπαρνέομαιの重みと直接性を保てる。注の「直訳に近くは」は、ギリシア語の逐語訳ではないため、「別訳」へ改める。
