  naturalness: 改訂文は明瞭で自然な現代標準日本語です。「いつものように」はκατὰ τὸ ἔθοςを日本語の慣用的な形で適切に表しています。冒頭のκαίは、日本語では明示的な接続語を置かずに自然に連結できます。
  terminology: 「オリーブ山」は定着した地名表記です。「弟子たち」もοἱ μαθηταίに適切です。「ついて行った」はこの場面の移動を明示しつつ、弟子が師に従うという文脈上の響きを不当に神学化せずに保ちます。
