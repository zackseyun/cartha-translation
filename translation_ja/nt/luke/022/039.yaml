id: LUK.22.39
reference: Luke 22:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐξελθὼν ἐπορεύθη κατὰ τὸ ἔθος εἰς τὸ Ὄρος τῶν Ἐλαιῶν· ἠκολούθησαν δὲ αὐτῷ καὶ οἱ ⸀μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/039.yaml
  text: And going out[a], he went as was his custom to the Mount of Olives, and the disciples also followed him.
translation:
  language: ja
  text: イエスは外に出て、いつものようにオリーブ山へ行った。弟子たちもイエスについて行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθὼν
  choice: 外に出て
  rationale: アオリスト分詞が主動詞に先立つ動作を表すため、自然な日本語の連用形で訳した。どこから出たかは本文に明示されていないので補わない。
- source_word: ἐπορεύθη
  choice: 向かった
  rationale: 目的地を示す εἰς とともに用いられているため、「行った」よりも方向性が自然に伝わる「向かった」とした。
- source_word: κατὰ τὸ ἔθος
  choice: いつものように
  rationale: 習慣に従った行動を表す慣用句として、現代日本語で明瞭かつ自然に表現した。文脈上その習慣の主体はイエスである。
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: オリーブ山へ
  rationale: 定着した地名表記を用い、移動の到達方向を助詞「へ」で表した。
- source_word: ἠκολούθησαν
  choice: 従った
  rationale: 実際について行く動作と、弟子が師に従う含意の双方を保てる語を選んだ。
- source_word: οἱ μαθηταί
  choice: 弟子たち
  rationale: 定冠詞を伴う既知の集団を、文脈に即して自然に訳した。「イエスの」はギリシア語に明示されないため名詞句には加えなかった。
- source_word: καὶ…δὲ…καὶ
  choice: それから……。……も
  rationale: 冒頭の καί と δέ の緩やかな物語の継続、および二つ目の καί の付加的意味を、自然な日本語の接続と助詞「も」で表した。
theological_decisions:
- issue: 習慣の主体を明示するか
  choice: 「いつものように」とし、文の主語としてイエスを明示する
  alternative: 「習慣に従って」として主体の明示を避ける
  rationale: κατὰ τὸ ἔθος 自体には所有代名詞がないが、文法と文脈から行動および習慣の主体がイエスであることは明白である。日本語では「いつものように」が自然であり、新たな神学的意味を付加しない。
- issue: ἀκολουθέω の含意
  choice: 「従った」
  alternative: 「ついて行った」
  rationale: この場面での物理的な同行を表しつつ、弟子とイエスの関係に伴う語の含意も残す。特定の教派的解釈までは読み込まない。
translation_notes:
  register: 明瞭な現代標準日本語。物語として自然な流れを優先しつつ、簡潔で品位ある文体とした。日本語では主語の省略も可能だが、単独の節として指示対象が明瞭になるよう「イエス」を補った。敬語形は原文にないため用いていない。
