id: LUK.22.40
reference: Luke 22:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γενόμενος δὲ ἐπὶ τοῦ τόπου εἶπεν αὐτοῖς· Προσεύχεσθε μὴ εἰσελθεῖν εἰς πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/040.yaml
  text: When he came to the place[a], he said to them, “Pray that you may not enter into temptation.”
translation:
  language: ja
  text: その場所に着くと、イエスは弟子たちに言った。「誘惑[a]に陥らないように、祈りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」と訳したギリシア語は、「試練」または「試み」を意味することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος δὲ ἐπὶ τοῦ τόπου
  choice: その場所に着くと
  rationale: γίνομαιのアオリスト分詞と場所を示す句を、到着が主動詞に先立つことを自然な現代日本語で表した。「その場所」は文脈上すでに知られている場所を指す。δέは独立した接続語にせず、時間的なつながりに含めた。
- source_word: εἶπεν αὐτοῖς
  choice: イエスは弟子たちに言った
  rationale: 直訳的には「彼は彼らに言った」だが、日本語で指示対象を明確にするため、文脈上の人物を補った。λέγωの基本的な意味に従い「言った」とした。
- source_word: Προσεύχεσθε
  choice: 祈りなさい
  rationale: 現在命令形には継続的・習慣的な含みがあり得るが、日本語では単純な命令形が自然で、その含みも妨げない。
- source_word: μὴ εἰσελθεῖν
  choice: 陥らないように
  rationale: 字義は「入らないように」だが、日本語では「誘惑に入る」が不自然なため、誘惑に屈する状況に至らないことを表す慣用的な「陥る」を用いた。祈りの内容・目的を「ように」で示した。
- source_word: πειρασμόν
  choice: 誘惑
  rationale: 弟子たちの差し迫った霊的失敗を警告する文脈には「誘惑」が最も自然である。ただし、語が持つ「試練」「試み」の可能性は脚注に残した。
theological_decisions:
- issue: πειρασμόςが指すもの
  choice: 誘惑
  alternative: 試練、試み
  rationale: 直後に迫る弟子たちの霊的なつまずきという文脈から「誘惑」を本文に採用したが、ギリシア語はより広く試練や試みも表し得るため、意味を一つに限定せず脚注で示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。会話部分は自然な命令表現とし、不要な古語や教派特有の言い回しを避けた。脚注記号は、その説明対象である「誘惑」の直後に置いた。
