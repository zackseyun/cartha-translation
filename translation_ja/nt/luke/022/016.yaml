id: LUK.22.16
reference: Luke 22:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι οὐ μὴ φάγω ⸀αὐτὸ ἕως ὅτου πληρωθῇ ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/016.yaml
  text: For I tell you that I will certainly not eat it until it is fulfilled in the kingdom of God[a][b].
translation:
  language: ja
  text: あなたがたに言っておくが、わたしは、それが神の国で成就するまで、それを食べることは決してない[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それが神の国で成就するまで、決して再びそれを食べることはない」。ギリシア語は将来食べることを強く否定している。文脈から「再び」を補うことはできるが、原文にその語はない。
    reason: lexical_alternative
  - marker: b
    text: 「それ」は、前の節で述べられた過越を指す。
    reason: cross_reference
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: あなたがたに言っておくが
  rationale: λέγω＋与格を自然な発言導入句とし、γάρが前節の発言に理由・説明を添えるつながりは、文脈に自然な接続助詞「が」で保持した。
- source_word: ὅτι
  choice: （直接には訳出せず、後続節を発言内容として示す）
  rationale: ὅτιは発言内容を導くが、日本語では独立した接続語を置かないほうが自然であり、統語関係も明瞭である。
- source_word: οὐ μὴ φάγω
  choice: 決してそれを食べない
  rationale: οὐ μή＋アオリスト接続法による将来についての強い否定を「決して…ない」で明確に表した。
- source_word: αὐτό
  choice: それ
  rationale: 前節の過越を受ける代名詞として訳し、この節に明示されていない「過越の食事」を本文へ補わないようにした。
- source_word: ἕως ὅτου
  choice: …時まで
  rationale: 時間的な限界を自然な現代日本語で表す。
- source_word: πληρωθῇ
  choice: 成就する
  rationale: 受動形は日本語では自動詞的な「成就する」で自然に表現でき、完成と救済史的実現の含みを保てる。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 神の国で
  rationale: 場所・領域を示すἐνを「で」とし、βασιλείαの支配と領域の両方を含み得る定着した聖書用語「神の国」を用いた。
theological_decisions:
- issue: αὐτό（「それ」）が指すもの
  choice: 前節で言及された過越を受ける代名詞のまま訳す。
  alternative: 「この過越の食事」と明示する。
  rationale: 直近の文脈は過越の食事を示すが、過越の祭儀・出来事をより広く含む可能性を狭めないよう、本文ではギリシア語の簡潔さを保った。
- issue: 「神の国で成就する」の意味
  choice: 成就の具体的な仕方を特定せず、終末的完成を示す表現を保持する。
  alternative: 神の国の到来によって成就する、またはメシアの宴で成就すると具体化する。
  rationale: 本文は成就の機序や出来事を明示していないため、特定の教理的説明を訳文へ持ち込まない。
- issue: 将来の食事に関する強い否定
  choice: 「決して…食べない」と訳し、「再び」は脚注に置く。
  alternative: 「決して再び食べない」と本文で明示する。
  rationale: οὐ μήは強い将来否定だが、「再び」に当たる語はギリシア語本文にない。文脈上の含意と明文を区別した。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳粛な発言にふさわしい格調を保った。「成就する」「神の国」は重要な聖書語として維持し、原文にない説明は本文へ補わなかった。
