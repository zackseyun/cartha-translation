  text: καὶ ἕτερα πολλὰ βλασφημοῦντες ἔλεγον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/065.yaml
  text: And they were saying many other blasphemous things against him[a][b].
translation:
  language: ja
  text: 彼に向かって[b]、そのほかにも多くの侮辱の言葉を浴びせ続けた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「冒瀆的なこと」とも訳せる。このギリシア語は、文脈によって、ののしり、中傷、侮辱のような発言を表すことがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「彼に対して」とも訳せる。ここでは、発言が彼に向けられたことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そのほかにも
  rationale: 直前に記された侮辱行為に、さらに別の発言が加わったことを自然な日本語で示す。
- source_word: ἕτερα πολλὰ
  choice: 多くの……こと
  rationale: ἕτερα の「ほかの」は「そのほかにも」に含め、πολλὰ の複数性と量を「多くの」で保持した。
- source_word: βλασφημοῦντες
  choice: 冒瀆的な
  rationale: βλασφημέω は、ののしりや中傷を含む強い非難の発言を表す。ここでは語の重みを保ちつつ、ἔλεγον の内容を修飾する自然な日本語とした。
- source_word: ἔλεγον
  choice: 言い続けた
  rationale: 未完了過去が示す継続的または反復的な発言を簡潔に表した。
- source_word: εἰς αὐτόν
  choice: 彼に対して
  rationale: 敵対的な発言の向けられた相手を示す文脈上の力を保ち、「彼に向かって」よりも自然で広く理解できる表現とした。
theological_decisions:
- issue: βλασφημοῦντες を一般的な侮辱に弱めるか、強い意味を保つか
  choice: 「冒瀆的な」として強い意味を保つ
  alternative: 「侮辱するような」「罵るような」
  rationale: この語は一般的なののしりも表し得るが、イエスに向けられた発言について用いられており、「冒瀆」は原語の強さと意味の幅を最もよく保つ。脚注でより広い語義も示し、解釈を一つに限定しない。
- issue: εἰς αὐτόν の方向性を敵対的に訳すか、単に相手を示すか
  choice: 「彼に対して」
  alternative: 「彼に向かって」
  rationale: 文脈上の敵意を伝えながらも、「反対して」などと意味を過度に限定しない表現を選んだ。
translation_notes:
  register: 現代標準語の明快で格調ある文体。「冒瀆」はやや硬いが、原語の強い響きを保つため採用した。「言い続けた」により未完了過去の継続・反復を表した。
