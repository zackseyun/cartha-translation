  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ περὶ αὐτὸν τὸ ἐσόμενον ⸀εἶπαν· Κύριε, εἰ πατάξομεν ἐν μαχαίρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/049.yaml
  text: And when those around him saw what was about to happen[a], they said, “Lord, shall we strike with the sword?”
translation:
  language: ja
  text: イエスの周りにいた人々は、起ころうとしていることを見て、「主よ、剣[a]で打ちかかりましょうか」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の「マカイラ」は、剣のほか、短い剣や短剣を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: 見て
  rationale: アオリスト分詞を主動詞「言った」に伴う時間的な動作として表し、「見たとき」の意味を自然な日本語で保った。
- source_word: οἱ περὶ αὐτὸν
  choice: イエスの周りにいた人々
  rationale: 直訳的な「彼の周りの者たち」では指示対象が不自然になりやすいため、文脈上の指示対象を明示しつつ、「弟子たち」と限定しすぎない表現にした。
- source_word: τὸ ἐσόμενον
  choice: これから起ころうとしていること
  rationale: 冠詞付き未来分詞が示す、目前に迫った出来事という意味を保持した。
- source_word: εἶπαν
  choice: 言った
  rationale: 後続する発話は疑問文だが、λέγωの基本義を保ち、「尋ねた」と言い換えなかった。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの直接の呼びかけとして、敬意と称号としての重みを保つ標準的な訳語を用いた。
- source_word: εἰ πατάξομεν
  choice: 打ちかかりましょうか
  rationale: εἰを伴う未来直説法の熟慮的な問いを、日本語の意向形による質問で自然に表した。πατάσσωの「打つ、襲いかかる」という力を、武器を用いる文脈に即して示した。
- source_word: ἐν μαχαίρῃ
  choice: 剣で
  rationale: ἐνを手段として訳した。μάχαιραの形状には幅があるため、本文では一般的な「剣」を採用し、短剣の可能性を注で示した。
theological_decisions:
- issue: イエスへの呼びかけとしての κύριος
  choice: 主
  alternative: 先生／主人
  rationale: 単なる社会的敬称に狭めず、κύριοςという称号が持つ意味の広がりと神学的な響きを保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、直接話法の「主よ」と「打ちかかりましょうか」に緊迫感と品位を保った。ギリシア語にない「弟子たち」という限定は加えていない。
