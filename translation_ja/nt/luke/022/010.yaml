revisions:
- from: そこでイエスは彼らに言った。「見なさい。[a] あなたがたが町に入ると、水の入ったかめ[b]を運んでいる一人の男に出会います。その人について行き、彼が入る家に入りなさい。」
  to: イエスは彼らに言った。「さあ、あなたがたが町に入ると、水がめを運んでいる男があなたがたに出会うでしょう。その人が入って行く家の中まで、ついて行きなさい。」
  rationale: 原文の未来の叙述に合わせて男を「出会う」の主語とし、Ἰδούを自然な現代会話の注意喚起として「さあ」と訳しました。また、「彼について家の中へ」という命令のまとまりを「その人が入って行く家の中まで、ついて行きなさい」として明瞭にしました。脚注a・bは各語句に対応する位置で維持してください。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:20:57Z'
review_pass:
  verdict: revise
  source_fidelity: 「あなたがたが町に入ると」「水の入ったかめを運んでいる一人の男」「彼が入る家」という主要な情報はおおむね原文に忠実です。ただし、συναντήσει ὑμῖν は男を文法上の主語として「あなたがたに出会う」と述べており、現行の「男に出会います」は日本語として自然である一方、主語関係を入れ替えています。また、ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν は「彼について、その家の中へ入る」一続きの命令です。現行の「ついて行き、…家に入りなさい」でも意味は通りますが、命令を二つに分けるより原文の関係を明瞭にできます。
  naturalness: 現行文は概して明快です。しかし、会話の冒頭の「見なさい。」は現代日本語ではやや硬く、独立した短文にすると不自然さが増します。「さあ、」はἸδούの注意喚起を自然な会話調で表せます。「水がめ」は「水の入ったかめ」より簡潔で、この文脈では自然です。
  terminology: 「イエス」「町」「男」「家」は適切です。「水がめ」はκεράμιον ὕδατοςに対応し、土器である可能性は脚注で保持できます。神学用語に関する問題はありません。
  issues:
  - severity: medium
    issue: συναντήσει ὑμῖν の主語関係が日本語で反転している。
    rationale: ギリシア語では「水がめを運ぶ男」が「あなたがたに出会う」。日本語の「男に出会います」は慣用的で意味上ほぼ同じですが、原文の叙述の焦点を保つため、男を主語にする訳がより適切です。
  - severity: low
    issue: 「見なさい。」が現代会話としてやや不自然である。
    rationale: Ἰδούは注意を促す語であり、「さあ、」は明確な現代標準日本語でその機能を果たす。「見よ」は脚注の代案として保持できる。
  - severity: low
    issue: 「ついて行き、彼が入る家に入りなさい」は原文の一続きの「彼について家の中へ」の関係をやや弱める。
    rationale: 「彼が入って行く家の中までついて行きなさい」とすることで、追従と家への進入を一つの命令として自然に表せる。
  revised_text: イエスは彼らに言った。「さあ、あなたがたが町に入ると、水がめを運んでいる男があなたがたに出会うでしょう。その人が入って行く家の中まで、ついて行きなさい。」
  revised_footnotes:
