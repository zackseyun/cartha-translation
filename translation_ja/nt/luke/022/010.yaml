  text: ὁ δὲ εἶπεν αὐτοῖς· Ἰδοὺ εἰσελθόντων ὑμῶν εἰς τὴν πόλιν συναντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ εἰς τὴν οἰκίαν ⸂εἰς ἣν⸃ εἰσπορεύεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/010.yaml
  text: And he said to them[a], “Look, when you enter the city, a man carrying a jar of water will meet you[b]. Follow him into the house that he enters.”
translation:
  language: ja
  text: イエスは彼らに言った。「さあ、あなたがたが町に入ると、水がめを運んでいる男があなたがたに出会うでしょう。その人が入って行く家の中まで、ついて行きなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 見なさい
  rationale: 注意を促す間投詞的な命令として、原文の指示的な力を保ちつつ、現代日本語で理解しやすい表現とした。
- source_word: εἰσελθόντων ὑμῶν εἰς τὴν πόλιν
  choice: あなたがたが町に入ると
  rationale: 属格絶対を時間を表す従属節として訳し、町に入った際に続く出来事を自然に示した。
- source_word: συναντήσει ὑμῖν
  choice: 一人の男に出会います
  rationale: 日本語では出会う側を弟子たちとして表すほうが自然であり、遭遇するという意味を明確に伝える。
- source_word: ἄνθρωπος
  choice: 一人の男
  rationale: 文脈上の特定の男性を、性別を曖昧にせず自然に表した。
- source_word: κεράμιον ὕδατος
  choice: 水の入ったかめ
  rationale: 容器に水が入っている意味を明瞭に示した。κεράμιονが土器を特に指し得る点は脚注に残した。
- source_word: βαστάζων
  choice: 運んでいる
  rationale: 男がその時に容器を携えている継続的な動作を自然な現代日本語で表した。
- source_word: ἀκολουθήσατε αὐτῷ
  choice: その人について行き
  rationale: アオリスト命令の直接的な指示を、文脈に即した自然な命令表現で伝えた。
- source_word: οἰκίαν
  choice: 家
  rationale: 方向を示す具体的な建物として、簡潔で原文に沿う語を用いた。
- source_word: εἰς ἣν εἰσπορεύεται
  choice: 彼が入る家に入りなさい
  rationale: 関係節が特定する家と、そこへ入るよう命じる方向性を、日本語で明確かつ自然に表した。
