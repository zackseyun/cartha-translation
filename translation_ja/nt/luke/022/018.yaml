id: LUK.22.18
reference: Luke 22:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν, ⸀οὐ μὴ πίω ἀπὸ τοῦ ⸂νῦν ἀπὸ τοῦ⸃ γενήματος τῆς ἀμπέλου ἕως ⸀οὗ ἡ βασιλεία τοῦ θεοῦ ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/018.yaml
  text: For I tell you[a], from now on I will certainly not drink from the fruit of the vine until the kingdom of God comes.
translation:
  language: ja
  text: というのも、わたしはあなたがたに言います。今から後、神の国が来るまでは、ぶどうの実からできたもの[a]を決して飲みません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ぶどう酒」とも訳せる。ギリシア語では直訳すると「ぶどうの実からできたもの」であり、通常の「ぶどう酒」という語を使わずに、杯の中身を指していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: あなたがたに言っておきますが
  rationale: λέγω＋与格の直接呼びかけを自然な現代日本語にし、γάρが直前の発言を説明するつながりも、文頭の導入表現全体で示した。
- source_word: οὐ μὴ πίω
  choice: わたしは…決して飲みません
  rationale: οὐ μή＋アオリスト接続法による強い未来否定を「決して…ません」で表した。後続の「…までは」という期限を保ち、「二度と」として無期限の否定にはしなかった。
- source_word: ἀπὸ τοῦ νῦν
  choice: 今から後
  rationale: 発話時点を起点とすることを明確にしつつ、厳粛な文脈にもなじむ自然な表現とした。
- source_word: ἀπὸ τοῦ γενήματος τῆς ἀμπέλου
  choice: ぶどうの実からできたもの
  rationale: γένημαの「産物、実」という幅を保ち、杯の中身を指す文脈を明瞭にしながら、原文にない通常語「ぶどう酒」へ狭めなかった。
- source_word: ἕως οὗ
  choice: …までは
  rationale: 否定が及ぶ時間的な限界を、日本語で明確かつ自然に示す。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 共観福音書で定着した自然な訳語であり、王としての支配と領域の両面を不必要に限定しない。
- source_word: ἔλθῃ
  choice: 来る
  rationale: ἕως οὗに続く未来志向のアオリスト接続法を、日本語の時間節で自然な非過去形にした。
theological_decisions:
- issue: γενήματος τῆς ἀμπέλουを「ぶどう酒」と訳すか、原文の広い表現を残すか
  choice: ぶどうの実からできたもの
  alternative: ぶどう酒
  rationale: 食事の杯の中身はぶどう酒と考えられるが、ギリシア語は通常の「ぶどう酒」という語を用いていない。そこで原文の婉曲的・典礼的な響きを残し、脚注で一般的な理解を示した。
- issue: 神の国が「来る」ことの様態や段階を訳文で特定するか
  choice: 神の国が来るまでは
  alternative: 神の国が完全に到来するまでは
  rationale: 本文は将来の時間的限界を述べるが、到来の様態や段階を特定していない。「完全に」などを補わず、終末論上の含みを開いたまま保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの厳粛な宣言にふさわしい調子を保った。「言っておきますが」は内容を導く日本語として用い、逆接を強く含ませない。「今から後」と「決して…ません」により、起点と強い否定をともに明示した。
