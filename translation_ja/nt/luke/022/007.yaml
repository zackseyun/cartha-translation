id: LUK.22.7
reference: Luke 22:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἦλθεν δὲ ἡ ἡμέρα τῶν ἀζύμων, ⸀ᾗ ἔδει θύεσθαι τὸ πάσχα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/007.yaml
  text: Then the day of Unleavened Bread came[a], on which the Passover had to be sacrificed.
translation:
  language: ja
  text: さて、種なしパンの日が来た。この日には、過越のいけにえ[a]を屠らなければならなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「過越」。ここでは、過越祭のために屠られるいけにえを指す。「過越の子羊」とも訳せる。
    reason: πάσχα は過越祭全体を指すことも、その祭りでささげる犠牲を指すこともあるため。
lexical_decisions:
- source_word: Ἦλθεν
  choice: 来た
  rationale: 時や日の到来を表す慣用的な用法。簡潔で自然な日本語として時の到来を保つ。
- source_word: δὲ
  choice: さて
  rationale: 物語の進行と場面の移行を示す。強い対比を持ち込まず、現代日本語で自然につなぐ。
- source_word: ἡ ἡμέρα τῶν ἀζύμων
  choice: 種なしパンの日
  rationale: 原文の単数「日」を保ちつつ、ユダヤの祭りに結びついた日を明瞭に表す。
- source_word: ᾗ
  choice: この日には
  rationale: 先行する「日」を受ける関係代名詞の時間的意味を、自然な日本語で明示する。
- source_word: ἔδει
  choice: …なければならなかった
  rationale: 祭儀暦に基づく必要・義務を表す未完了過去の意味を自然に伝える。
- source_word: θύεσθαι
  choice: 屠られなければ
  rationale: 祭儀のために動物を殺す意味を持つ。目的語の「いけにえ」と組み合わせ、犠牲としての行為を明確にする。
- source_word: τὸ πάσχα
  choice: 過越のいけにえ
  rationale: θύεσθαιとの組み合わせでは過越祭そのものではなく、屠られる犠牲を指す。ただし子羊と限定せず、原語の語義の幅を保つ。
theological_decisions:
- issue: 祭儀的文脈における τὸ πάσχα の指示対象
  choice: 本文では「過越のいけにえ」と訳す。
  alternative: 「過越の子羊」または「過越の犠牲」
  rationale: 動詞 θύεσθαι により、ここでは屠られる祭儀上の犠牲が指される。「子羊」は文脈上有力だが、πάσχα 自体が動物の種類を明示しないため本文では限定を避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「種なしパン」「過越」は聖書読者に通用する簡潔な祭儀用語とし、「屠る」によって儀礼的な殺害を端的に表した。
