  yaml_path: translation/nt/luke/022/005.yaml
  text: And they rejoiced and agreed to give him money[a].
translation:
  language: ja
  text: すると彼らは喜び、彼に金銭[a]を与えることに合意した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「銀」。ギリシア語は、文字どおりの銀を指すことも、より一般的に金銭を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρησαν
  choice: 喜び
  rationale: アオリスト形が表す彼らの感情的な反応を、簡潔で自然な現代日本語にした。「喜んだ」も可能だが、後続する動詞と滑らかに結ぶため連用形とした。
- source_word: συνέθεντο
  choice: 合意した
  rationale: 中動態の συντίθεμαι がこの文脈で表す「条件を取り決める、同意する」という意味を保つ。「約束した」よりも、双方の合意という語義を明確に示す。
- source_word: αὐτῷ
  choice: 彼に
  rationale: δοῦναι の間接目的語として明示し、原文の与える相手を自然な日本語で示した。文脈上はユダを指すが、この節では代名詞のままとした。
- source_word: ἀργύριον
  choice: 金銭
  rationale: 文字どおりには「銀」だが、取引の文脈では貨幣・金銭を意味する。「金銭」は現代日本語で明瞭かつ品位があり、字義的な選択肢は脚注に残した。
- source_word: δοῦναι
  choice: 与える
  rationale: συνέθεντο の内容を示す不定詞を直接的に訳した。「支払う」は文脈上可能だが、原語以上に取引的な意味を限定するため採らなかった。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すると」で前節からの展開を示し、「ことで合意した」により、金銭を与えることが合意内容であるという原文の構造を自然に表した。
