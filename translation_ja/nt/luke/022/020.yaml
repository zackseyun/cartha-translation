id: LUK.22.20
reference: Luke 22:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸄καὶ τὸ ποτήριον ὡσαύτως⸅ μετὰ τὸ δειπνῆσαι, λέγων· Τοῦτο τὸ ποτήριον ἡ καινὴ διαθήκη ἐν τῷ αἵματί μου, τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον]⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/020.yaml
  text: And likewise the cup after supper[a], saying, “This cup is the new covenant in my blood[b], which is poured out for you.”
translation:
  language: ja
  text: 食事の後、同じように杯を取り、こう言われた。「この杯は、わたしの血による新しい契約である。わたしの血は、あなたがたのために注ぎ出される。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποτήριον
  choice: 杯
  rationale: 飲み物を入れる器を表す自然で格調ある訳。典礼上の特殊な器を意味する語は避けた。
- source_word: ὡσαύτως
  choice: 同じようにして
  rationale: 直前のパンについての行為とのつながりを保ちつつ、日本語として通じる形にした。
- source_word: μετὰ τὸ δειπνῆσαι
  choice: 食事の後
  rationale: 食事を終えた後という時間的順序を簡潔かつ自然に表した。
- source_word: λέγων
  choice: こう言われた
  rationale: 分詞の機能を自然な日本語の発話導入に置き換え、イエスへの敬意を表す通常の聖書文体とした。
- source_word: καινὴ διαθήκη
  choice: 新しい契約
  rationale: 旧約の契約と契約の血を背景とする語義を保つ。「新約」という書名的表現や「遺言」はここでは避けた。
- source_word: ἐν τῷ αἵματί μου
  choice: わたしの血による
  rationale: ἐν の関係を日本語で自然に示しつつ、血によって成立・確証される契約という文脈を伝える。「立てられる」など原文にない動詞は補わなかった。
- source_word: τὸ ὑπὲρ ὑμῶν ἐκχυννόμενον
  choice: わたしの血は、あなたがたのために注ぎ出される
  rationale: 文脈上もっとも自然な指示対象を「わたしの血」として明示した。ὑπὲρ は「ために」とし、特定の贖罪理論に限定しなかった。
theological_decisions:
- issue: 聖餐・契約の文脈における διαθήκη の訳
  choice: 新しい契約
  alternative: 新しい遺言／新約
  rationale: 契約の血という聖書的背景には「契約」が最も適切であり、後代の書名や遺言制度の意味を持ち込まない。
- issue: ἐκχυννόμενον の指示対象
  choice: 意味上「わたしの血」を受けるものとして本文で明示
  alternative: 文法上「この杯」に直接かかる形を保つ
  rationale: ποτήριον と αἷμα はともに中性であり形の一致だけでは決まらないが、注ぎ出されるものは文脈上イエスの血と理解するのが最も自然である。原文の統語上の余地は脚注に残した。
- issue: ἐν τῷ αἵματί μου が示す契約と血の関係
  choice: わたしの血による
  alternative: わたしの血における／わたしの血で立てられる
  rationale: 自然な日本語を優先しながら、血が契約の根拠・媒介であるという関係を表した。原文にない「立てる」を本文へ加えることは避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、発話には簡潔で格調ある文体を保った。「杯も同じようにして」は前節の行為を受ける省略を反映し、原文にない具体的動作を過度に補わない表現である。
