  text: Ἤγγιζεν δὲ ἡ ἑορτὴ τῶν ἀζύμων ἡ λεγομένη Πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/001.yaml
  text: The Feast of Unleavened Bread[a], which is called Passover, was drawing near.
translation:
  language: ja
  text: 過越の祭りと呼ばれる種なしパンの祭り[a]が近づいていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 過越の祭りと種なしパンの祭りは互いに密接に関係する行事で、ユダヤ人の用法では一続きの祭りとして扱われたり、名称が重なって用いられたりしました。
    reason: cultural_note
lexical_decisions:
- source_word: Ἤγγιζεν
  choice: 近づいていた
  rationale: 未完了過去の継続的な様相を自然な日本語で表し、祭りが間近に迫りつつあったことを示す。
- source_word: δὲ
  choice: 明示的には訳出しない
  rationale: ここでは弱い談話上の移行を示す。日本語で「さて」などを補わなくても文脈上自然であり、不要な強調を避けられる。
- source_word: ἡ ἑορτὴ τῶν ἀζύμων
  choice: 種なしパンの祭り
  rationale: ユダヤ教の祭りの名称として、意味が明瞭で現代の一般読者にも理解しやすい表現を採る。
- source_word: ἡ λεγομένη
  choice: いわゆる
  rationale: 別名・通称を説明する分詞句の働きを、簡潔で自然な日本語に移す。
- source_word: Πάσχα
  choice: 過越の祭り
  rationale: 祭りを指す文脈であることを明確にし、日本語で定着した名称を用いる。
theological_decisions:
- issue: 「種なしパンの祭り」と「過越の祭り」の関係
  choice: ルカの説明的な同定を保ち、「種なしパンの祭り、いわゆる過越の祭り」と訳す。
  alternative: 両者を厳密に別個の祭りとして区別する訳にする。
  rationale: 本文は語り手の視点から両名称を結びつけており、当時の用法では祭りの期間全体を指して名称が重なり得た。技術的な区別や調和を本文以上に持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「除酵祭」のような専門的な名称より意味の分かる「種なしパンの祭り」を採用し、説明関係は「いわゆる」で簡潔に示した。
