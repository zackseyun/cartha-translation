  text: εἶπεν δὲ ὁ Πέτρος· Ἄνθρωπε, οὐκ οἶδα ὃ λέγεις. καὶ παραχρῆμα ἔτι λαλοῦντος αὐτοῦ ἐφώνησεν ἀλέκτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/060.yaml
  text: But Peter said[a], “Man, I do not know what you are saying.” And immediately, while he was still speaking, a rooster crowed.
translation:
  language: ja
  text: しかし、ペトロは言った。「あなた、何を言っているのか、私には分からない。」すると、ペトロがまだ話しているうちに、すぐに鶏が鳴いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の आरोप accusation に対するペトロの否認という対比を示しつつ、物語の流れを自然につなぐ。
- source_word: Ἄνθρωπε
  choice: あなた
  rationale: 男性への呼びかけを、日本語で過度に粗野にも丁重にもせず自然に表す。「男よ」は現代日本語では不自然である。
- source_word: οὐκ οἶδα ὃ λέγεις
  choice: あなたが何を言っているのか、私には分からない
  rationale: 否定と発言内容を直接的に保ち、「何のことか分からない」のように意味を広げすぎない。
- source_word: παραχρῆμα
  choice: すぐに
  rationale: 出来事が間を置かず起きたことを、明瞭な現代日本語で示す。
- source_word: ἔτι λαλοῦντος αὐτοῦ
  choice: 彼がまだ話しているうちに
  rationale: 属格絶対構文が示す同時性と、ἔτι の「まだ」を保持する。
- source_word: ἐφώνησεν ἀλέκτωρ
  choice: 鶏が鳴いた
  rationale: 日本語では雄鶏の鳴き声について通常「鶏が鳴く」と表現でき、文脈上も明瞭である。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語。ペトロの否認の直接性と、発言中に鶏が鳴く時間的な切迫感を保った。
