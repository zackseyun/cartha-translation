  naturalness: 全体として自然な現代標準日本語です。「あなた、何を言っているのか、私には分からない」は、呼びかけを保ちながら不自然な「男よ」を避ける表現です。後半は主語を「ペトロ」として明示すると、「彼」の指示対象がより明確になります。
  terminology: 「ペトロ」「鶏が鳴いた」は適切です。ἀλέκτωρはこの文脈で「雄鶏」と限定することもできますが、日本語の慣用表現「鶏が鳴いた」で十分に意味が伝わり、注は不要です。
