  rationale: 呼格Ἄνθρωπεを「あなた、」として明示し、原文の直接的な呼びかけを保った。また、「彼」を「ペトロ」に改め、鶏が鳴いた時点でなお話していた人物を明確にした。δὲの対比、οὐκ οἶδαの否認、παραχρῆμαの即時性、ἔτι λαλοῦντος αὐτοῦの継続中の同時性は保持している。
