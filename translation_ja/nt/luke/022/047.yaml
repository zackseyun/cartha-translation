- from: イエスがまだ話しておられると、見よ、群衆が現れた。「十二人」の一人で、ユダと呼ばれる者が彼らの先頭に立っていた[a]。ユダはイエスに口づけしようと近寄った。
  to: イエスがまだ話しておられる間に、見よ、群衆が現れた。そして、十二人の一人で、ユダと呼ばれる者が彼らに先立って進んでいた[a]。彼はイエスに口づけするために近づいた。
  rationale: 同時進行を表す原文の構文を自然な日本語に改め、引用符を除いた。さらに、ユダが群衆の前にいたという基本的な叙述を本文で直接示し、先導という可能な含意は脚注に保持した。ユダの行為を「裏切り」と明示する解釈的追加は行っていない。
