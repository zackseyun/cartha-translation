source:
  edition: SBLGNT
  text: ⸀Ἔτι αὐτοῦ λαλοῦντος ἰδοὺ ὄχλος, καὶ ὁ λεγόμενος Ἰούδας εἷς τῶν δώδεκα προήρχετο αὐτούς, καὶ ἤγγισεν τῷ Ἰησοῦ φιλῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/047.yaml
  text: While he was still speaking[a], behold, a crowd came, and the one called Judas, one of the twelve, was going before them, and he came near to Jesus to kiss him.
translation:
  language: ja
  text: イエスがまだ話しておられる間に、見よ、群衆が現れた。そして、十二人の一人で、ユダと呼ばれる者が彼らに先立って進んでいた[a]。彼はイエスに口づけするために近づいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らを先導していた」または「彼らの前を進んでいた」。
    reason: προήρχετο αὐτούςは、群衆に先立って進むことを表し、文脈によっては彼らを導くことを含意し得る。
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: イエスがまだ話しておられると
  rationale: 属格独立構文による同時進行を自然な現代日本語で表し、ἔτιの「まだ」と現在分詞の継続性を保った。文脈上の指示対象を「イエス」と明示した。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 突然現れた群衆へ読者の注意を向ける談話標識の力と、物語の緊迫感を保持した。
- source_word: ὄχλος
  choice: 群衆が現れた
  rationale: ὄχλοςを「群衆」とし、ギリシア語では省かれている述語を日本語の文として成立させるため、文脈に即して「現れた」を補った。
- source_word: ὁ λεγόμενος Ἰούδας
  choice: ユダと呼ばれる者
  rationale: 分詞句の識別的な働きを保ち、「いわゆる」のような否定的含意を加えなかった。
- source_word: εἷς τῶν δώδεκα
  choice: 「十二人」の一人
  rationale: イエスが選んだ十二人の集団を指す定型的呼称として訳し、ユダもその一員であったという叙述上の緊張を保持した。
- source_word: προήρχετο αὐτούς
  choice: 彼らの先頭に立っていた
  rationale: 未完了過去の継続的な場面描写と、「彼らより前に進む／彼らを先導する」という意味範囲を簡潔に表した。正式な指揮者だったと断定しない表現とした。
- source_word: ἤγγισεν τῷ Ἰησοῦ
  choice: イエスに近寄った
  rationale: ἐγγίζωの接近する動きを、明瞭で自然な日本語で表した。
- source_word: φιλῆσαι αὐτόν
  choice: イエスに口づけしようと
  rationale: 目的を表す不定詞を「しようと」で示し、φιλέωの文脈上の意味を「口づけする」と直接的に訳した。
theological_decisions:
- issue: ユダの行為に対する物語上の評価
  choice: 接近と意図された口づけをそのまま描写し、「裏切るため」とは本文に補わない。
  alternative: 「口づけして裏切ろうと近寄った」のように、周辺文脈から目的を明示する。
  rationale: 裏切りであることは周辺文脈から明らかだが、この節自体は接近と口づけの意図を叙述している。原文にない道徳的・神学的評価を加えず、物語が生む緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、ἰδοὺは物語上の注意喚起を保つため格調ある「見よ」とした。「口づけ」は「キス」より聖書物語の文体に調和し、なお現代の読者にも理解しやすい。「十二人」は固有の集団名として括弧を付した。
