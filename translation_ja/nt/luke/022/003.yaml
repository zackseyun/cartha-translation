source:
  edition: SBLGNT
  text: Εἰσῆλθεν δὲ Σατανᾶς εἰς Ἰούδαν τὸν ⸀καλούμενον Ἰσκαριώτην, ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/003.yaml
  text: Then Satan entered into Judas[a], the one called Iscariot[c][b], who was of the number of the twelve.
translation:
  language: ja
  text: すると、サタンがイスカリオテと呼ばれるユダの中に入った。ユダは十二人の一人[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「十二人の数の中から（出た者で）あった」。すなわち、十二人の一人であった。
    reason: ἐκ τοῦ ἀριθμοῦ τῶν δώδεκαの「数」の語を含む表現を示しつつ、本文の自然な訳が意味する所属関係を明らかにするため。
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: すると、…入った
  rationale: δέを物語の進行を示す自然な接続として「すると」とし、アオリストの出来事を「入った」と表した。
- source_word: Σατανᾶς
  choice: サタン
  rationale: 新約聖書で固有名・称号として定着している標準的な音写を用いた。
- source_word: εἰς Ἰούδαν
  choice: ユダの中に
  rationale: εἰςが人の内部への進入を明示するため、「ユダに」だけでなく「中に」としてその強い表現を保った。
- source_word: τὸν καλούμενον Ἰσκαριώτην
  choice: イスカリオテと呼ばれるユダ
  rationale: 現在分詞の限定的用法を、現代日本語で自然な連体修飾として訳した。
- source_word: ὄντα ἐκ τοῦ ἀριθμοῦ τῶν δώδεκα
  choice: ユダは十二人の一人であった
  rationale: 直訳的な「十二人の数に属していた」より自然で明瞭に、定員として数えられる集団への所属を表した。
theological_decisions:
- issue: ユダに対するサタンの働きの性質
  choice: 「サタンが…ユダの中に入った」と明示する
  alternative: 「サタンがユダに影響を及ぼした」「サタンがユダを捕らえた」
  rationale: εἰσῆλθεν…εἰςの強い進入表現を弱めずに保持する一方、悪霊憑依の厳密な性質やユダの責任との関係について、本文を越えた説明は加えない。
- issue: 「十二人」の集団名としての扱い
  choice: 普通名詞として「十二人」とする
  alternative: 称号的に「十二使徒」「十二弟子」とする
  rationale: 原文はδώδεκαとのみ述べるため、「使徒」「弟子」を補わず、文脈上認識される集団をそのまま示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、サタンの進入を述べる原文の強さと厳粛さを保った。「イスカリオテ」は日本語聖書で広く通用する表記とした。
