  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γενόμενος ἐν ἀγωνίᾳ ἐκτενέστερον προσηύχετο· ⸄καὶ ἐγένετο⸅ ὁ ἱδρὼς αὐτοῦ ὡσεὶ θρόμβοι αἵματος καταβαίνοντες ἐπὶ τὴν γῆν.⸃
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/044.yaml
  text: And being in agony[a], he was praying more intensely[c][b]; and his sweat became like drops of blood falling to the ground.
translation:
  language: ja
  text: 苦悶のうちにあって、イエスはさらにひたすらに祈り続けていた。[a] その汗は、地面に落ちる血の滴のようになった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: いくつかの写本には22章43–44節がなく、ほかの写本にはある。SBLGNTは、この本文上の不確かさを示すため、この二節を括弧に入れている。
    reason: textual_variant
  - marker: b
    text: ギリシア語は「血の滴（または血の塊）のように」。汗が血そのものであったと断定せず、比較として述べている。
    reason: lexical_alternative
lexical_decisions:
- source_word: γενόμενος ἐν ἀγωνίᾳ
  choice: 苦悶のうちにあって
  rationale: 分詞句が示すイエスの状態を自然な日本語で表し、ἀγωνίαが持つ激しい苦しみと葛藤の意味を保った。
- source_word: ἐκτενέστερον
  choice: さらにひたすらに
  rationale: 比較級の「それまで以上に」という力と、祈りの強さ・専心を表す。単に「熱心に」として比較の意味を失わないようにした。
- source_word: προσηύχετο
  choice: 祈り続けていた
  rationale: 未完了過去が示す継続中の行為を日本語で明確にした。
- source_word: ἐγένετο
  choice: なって
  rationale: 汗がある様相を呈するに至ったという動きを簡潔に表した。
- source_word: ὡσεὶ
  choice: ように
  rationale: 同一性ではなく類似を示す比較表現を保持した。
- source_word: θρόμβοι αἵματος
  choice: 血の滴
  rationale: 地面へ落ちるという文脈に合う自然な表現を本文に採用し、θρόμβοιが「血の塊、凝血」をも意味し得ることは脚注に示した。
- source_word: καταβαίνοντες ἐπὶ τὴν γῆν
  choice: 地面に落ちた
  rationale: 下方へ動いて地面に達する情景を、明瞭で自然な現代日本語にした。
theological_decisions:
- issue: 「血の滴のように」という表現が示す汗と血の関係
  choice: 汗が血の滴に似ていたという比喩を保持する。
  alternative: 汗そのものが実際の血であったと断定する。
  rationale: ὡσεὶは明示的な比較標識であるため、本文は類似を表すにとどめた。これにより、医学的現象または奇跡であったかを翻訳によって決めず、原文の余地を残す。
- issue: ルカ22章43–44節の本文上の不確かさ
  choice: SBLGNTに従って本文に訳出し、写本上の異同を脚注で明示する。
  alternative: 異同のある二節を本文から除外する。
  rationale: SBLGNTはこの節を括弧付きで収録しているため、本文として提示しつつ、その伝承に重大な不確かさがあることを読者に知らせる。
translation_notes:
  register: 明瞭で品位ある現代標準日本語とした。「苦悶」「ひたすらに」によって場面の厳粛さを保ち、「祈り続けていた」で継続相を伝えた。
