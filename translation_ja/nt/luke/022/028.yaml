id: LUK.22.28
reference: Luke 22:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὑμεῖς δέ ἐστε οἱ διαμεμενηκότες μετ’ ἐμοῦ ἐν τοῖς πειρασμοῖς μου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/028.yaml
  text: But you are the ones who have remained with me in my trials[a].
translation:
  language: ja
  text: しかし、あなたがたこそ、わたしの試練[a]の中で、わたしと共にとどまり続けてきた人たちです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」または「試み」とも訳せる。ギリシア語は誘惑と試練のどちらも表し得るが、ここではイエスが経験した苦難や困難を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: あなたがたこそ
  rationale: 二人称複数代名詞が文頭に明示されている強調を、「こそ」によって自然な日本語で表した。
- source_word: δέ
  choice: しかし
  rationale: 直前の文脈との対比を示す接続辞として訳した。
- source_word: οἱ διαμεμενηκότες
  choice: とどまり続けてきた人たち
  rationale: 冠詞付き完了能動分詞が示す、過去から現在まで共に踏みとどまってきた特定の人々という意味を保持した。
- source_word: μετ’ ἐμοῦ
  choice: わたしと共に
  rationale: 属格を伴う μετά の、同行・結びつきを示す基本的な意味を訳した。
- source_word: ἐν τοῖς πειρασμοῖς μου
  choice: わたしの試練の中で
  rationale: πειρασμός の意味幅を踏まえつつ、ここではイエスが経験した困難や苦難を指す文脈に最も合う「試練」を本文に採用した。
theological_decisions:
- issue: イエスに関して用いられた πειρασμοῖς の意味
  choice: 試練
  alternative: 誘惑、試み
  rationale: 弟子たちがイエスと共に耐え続けた困難という文脈には「試練」が適する。一方、原語は誘惑や試みも表し得るため、その意味の広がりを脚注に残し、神学的な含みを一義的に限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「あなたがたこそ」で原文の強調を示し、「とどまり続けてきた」で完了形の継続性を自然に表現した。
