  text: And after going outside, he wept bitterly.
translation:
  language: ja
  text: そして、外に出ると、激しく泣いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「苦く泣いた」。深い苦痛を伴う泣き方を表す。
    reason: 原語πικρῶςの直訳的な比喩と本文の自然な訳との関係を示すため。
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な物語上のつながりを示し、文脈にない強い時間的・因果的意味を加えない。
- source_word: ἐξελθὼν ἔξω
  choice: 外に出ると
  rationale: アオリスト分詞と方向を示す副詞を自然な日本語で表し、外へ出たことに続いて主動詞の行為が起きたという流れを保つ。
- source_word: ἔκλαυσεν
  choice: 泣いた
  rationale: κλαίωの通常の意味を、現代日本語で自然かつ厳粛に表す。主語は文脈上明らかなため、ギリシア語と同様に固有名を補わない。
- source_word: πικρῶς
  choice: 激しく
  rationale: 泣き方の強さと深い苦痛を自然な日本語で伝える。直訳的な「苦く」は現代日本語では不自然になりやすいため、脚注で原語の比喩を示す。
