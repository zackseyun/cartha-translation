id: LUK.22.52
reference: Luke 22:52
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ Ἰησοῦς πρὸς τοὺς παραγενομένους ἐπ’ αὐτὸν ἀρχιερεῖς καὶ στρατηγοὺς τοῦ ἱεροῦ καὶ πρεσβυτέρους· Ὡς ἐπὶ λῃστὴν ⸀ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/052.yaml
  text: But Jesus said to the chief priests[a], the officers of the temple, and the elders who had come against him, “Have you come out as against a robber, with swords and clubs?”
translation:
  language: ja
  text: しかしイエスは、自分を捕らえに来た祭司長たち、神殿警備隊の指揮官たち、長老たちに言われた。「強盗[a]を捕らえに行くかのように、剣やこん棒を持って出て来たのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「盗賊」とも訳せる。ギリシア語は、強盗、武装した無法者、反乱者などを指し得る。ここでイエスは、彼らが危険な犯罪者を捕らえるかのように武装して来たことを問いただしている。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 逮捕に来た者たちの行動に対するイエスの応答へ移る際の、穏やかな対照を示す。
- source_word: παραγενομένους ἐπ’ αὐτόν
  choice: 自分に向かって来た
  rationale: ἐπί＋対格が示す、イエスを標的として近づいた動きを自然に表しつつ、「敵対して」を本文に補いすぎない。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数形で祭司階級の指導者層を指す標準的な訳語。
- source_word: στρατηγοὺς τοῦ ἱεροῦ
  choice: 神殿警備隊の指揮官たち
  rationale: 神殿の治安維持を担う役職者であることを、現代の読者に明瞭に伝える。
- source_word: πρεσβυτέρους
  choice: 長老たち
  rationale: 単なる高齢者ではなく、共同体の公認された指導者たちを指す。
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: 強盗にでも向かうように
  rationale: 逮捕対象に向かうという句の方向性と、イエスの修辞的な非難を自然な日本語で保持する。λῃστήςの意味の幅は脚注で示す。
- source_word: ἐξήλθατε
  choice: 出て来たのですか
  rationale: 直前に行われた行動を問いただすアオリストを、場面に即した自然な日本語の問いとして表す。
- source_word: μαχαιρῶν
  choice: 剣
  rationale: 逮捕場面で武器として携えられたμάχαιραの通常の訳語。
- source_word: ξύλων
  choice: こん棒
  rationale: 字義的には木製の物を表すが、この文脈では打撃用の武器を指すため。
theological_decisions:
- issue: λῃστήςが示す犯罪者像
  choice: 本文では「強盗」とし、脚注で「盗賊、武装した無法者、反乱者」の可能性を示す
  alternative: 本文を「反乱者」または「盗賊」とする
  rationale: 語には暴力的な強盗から反乱者まで意味の幅があり、本文で一つの政治的含意に限定せず、イエスが彼らの武装した接近を危険人物への対応になぞらえる緊張を保つ。
translation_notes:
  register: 明瞭で現代的かつ威厳ある文体。「言われた」で敬意を保ち、発言は過度に古風にせず、問いただす調子が伝わる「のですか」とした。脚注記号[a]を該当語の直後に置いた。
