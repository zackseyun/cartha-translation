  to: しかしイエスは、自分を捕らえに来た祭司長たち、神殿警備隊の指揮官たち、長老たちに言われた。「強盗[a]を捕らえに行くかのように、剣やこん棒を持って出て来たのですか。」
  rationale: 日本語の曖昧さ・不自然さを解消するため、逮捕場面における原文の方向性を「強盗を捕らえに行くかのように」と明示した。また、敵対的に来たことを自然な日本語で表すため「自分を捕らえに来た」とした。いずれも文脈上明白な逮捕目的を表現したもので、原文の意味やλῃστήςの意味の幅を狭めない。
