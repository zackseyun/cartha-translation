  terminology: 「祭司長たち」「神殿警備隊の指揮官たち」「長老たち」「剣」「こん棒」は適切である。「強盗」はλῃστήςの主要な訳語として可能であり、脚注で盗賊・武装した無法者・反乱者という意味の幅を示す方針も妥当である。
