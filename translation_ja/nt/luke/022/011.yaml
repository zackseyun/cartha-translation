source:
  edition: SBLGNT
  text: καὶ ἐρεῖτε τῷ οἰκοδεσπότῃ τῆς οἰκίας· Λέγει σοι ὁ διδάσκαλος· Ποῦ ἐστιν τὸ κατάλυμα ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/011.yaml
  text: And you will say to the master of the house[a], ‘The Teacher says to you, “Where is the guest room where I may eat the Passover with my disciples?”’
translation:
  language: ja
  text: そして、その家の主人にこう言いなさい。『先生があなたにこう言っておられます。「わたしが弟子たちと一緒に過越の食事を取る客間[a]はどこですか。」』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「宿泊場所」。ギリシア語κατάλυμαは宿泊のための場所や客用の部屋を指す。ここで「宿屋」や「二階の広間」を意味するわけではなく、「二階の広間」は次節で初めて述べられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκοδεσπότῃ τῆς οἰκίας
  choice: その家の主人
  rationale: οἰκοδεσπότηςは家または世帯を取り仕切る者を指す。「その家の主人」は、所有者と限定せず、権限を持つ家長という含みを自然な現代日本語で表す。
- source_word: ὁ διδάσκαλος
  choice: 先生
  rationale: διδάσκαλοςを意味に即して訳し、弟子たちがイエスを指す呼称として自然な「先生」とした。「師」より平明であり、「主」という別の称号も持ち込まない。
- source_word: κατάλυμα
  choice: 客間
  rationale: 文脈上、宿泊や客のために用意された家内の部屋を指す。「宿屋」は不適切であり、「二階の広間」という情報は次節で初めて示されるため、ここでは加えない。
- source_word: τὸ πάσχα
  choice: 過越の食事
  rationale: πάσχαは祭り全体も食事も指し得るが、φάγω（食べる）との組み合わせにより、ここでは過越の食事が直接念頭にある。日本語では「過越を食べる」より自然で明確である。
- source_word: μετὰ τῶν μαθητῶν μου
  choice: わたしが弟子たちと一緒に
  rationale: μαθητήςは福音書における継続的な従従関係を表すため、定着した「弟子」と訳す。μετάの共同性を「一緒に」で明示する。
- source_word: φάγω
  choice: 食事をする
  rationale: 接続法φάγωは、場所を尋ねる間接疑問の中で予定・意図された行為を表す。日本語では「食事をする」が自然で、可能か意志かを不必要に限定しない。
- source_word: ἐρεῖτε
  choice: こう言いなさい
  rationale: 形は未来直説法だが、文脈では弟子への指示として機能する。日本語では命令表現にすることで談話上の働きを自然に示す。
- source_word: Λέγει σοι
  choice: あなたに…と言っておられます
  rationale: 現在形λέγειを伝言の定型として自然な敬意を伴う日本語にした。敬語は弟子たちが先生について家の主人へ語る場面に適合する。
theological_decisions:
- issue: イエスの自己指示に用いられる称号διδάσκαλος
  choice: 先生
  alternative: 教師／師／主
  rationale: 称号を音写せず意味に即して訳す。「先生」は弟子と指導者の関係を自然に示し、「主」という別のキリスト論的称号を混入しない。「教師」は職業名の響きが強く、「師」はやや文語的である。
- issue: πάσχαが祭り全体か食事か
  choice: 過越の食事
  alternative: 過越
  rationale: 語自体には幅があるが、「食べる」という動詞がこの場面では食事を強く示す。祭り全体を否定するのではなく、この文で意図される具体的行為を自然な日本語で表した。
translation_notes:
  register: 明快な現代標準語を用いながら、伝言としての丁寧さと聖書本文にふさわしい落ち着きを保った。κατάλυμαは本文で「客間」と十分に表現できるため脚注を設けず、次節の「二階の広間」を先取りしなかった。入れ子の直接話法は、日本語のかぎ括弧と二重かぎ括弧で明示した。
