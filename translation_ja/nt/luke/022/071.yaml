id: LUK.22.71
reference: Luke 22:71
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ εἶπαν· Τί ἔτι ⸂ἔχομεν μαρτυρίας χρείαν⸃; αὐτοὶ γὰρ ἠκούσαμεν ἀπὸ τοῦ στόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/071.yaml
  text: Then they said[a], “Why do we still need testimony? For we ourselves have heard it from his own mouth.”
translation:
  language: ja
  text: そこで彼らは言った。「これ以上、証言が必要だろうか。[a] 私たち自身が、本人の口から聞いたのだから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「なぜ、なお証言が必要だろうか。」
    reason: τί ἔτιを、追加の必要性を問う「これ以上」とも、自然な理由疑問の形「なぜ、なお」とも表せるため。
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: そこで彼らは言った
  rationale: δέはここでは強い対比ではなく物語を進める軽い接続を表すため、「そこで」として自然な順接を示した。
- source_word: Τί ἔτι ἔχομεν μαρτυρίας χρείαν
  choice: これ以上、何の証言が必要だろうか
  rationale: τί ἔτιとχρείαν ἔχεινの構造を生かしつつ、反語として自然な現代日本語にした。「これ以上」によりἔτιの意味を明示した。
- source_word: μαρτυρίας
  choice: 証言
  rationale: 審理の文脈にあるμαρτυρίαは「証人」そのものより、証人が述べる「証言」を指すと取るのが適切である。
- source_word: αὐτοὶ γὰρ
  choice: 私たち自身が……のだから
  rationale: αὐτοίの強調を「私たち自身が」で保持し、γάρは先の反語の根拠を示す「のだから」で自然に表した。
- source_word: ἠκούσαμεν
  choice: 聞いた
  rationale: ギリシア語アオリストの出来事を簡潔な過去形で表し、直前に本人から直接聞いたという文脈上の即時性は語順と文脈に委ねた。
- source_word: ἀπὸ τοῦ στόματος αὐτοῦ
  choice: 本人の口から
  rationale: 直にその人物の発言を聞いたことを示す慣用表現として訳した。「本人」は直接性を自然に際立たせる。
theological_decisions:
- issue: 彼らが聞いた内容を、イエスの自己告白または自らを罪に定める発言として明示するか
  choice: 目的語を補わず、「本人の口から聞いた」とした
  alternative: 本人の口からその証言を聞いた／本人の主張を直接聞いた
  rationale: 原文はἠκούσαμενの目的語を明示していない。「証言」「主張」などを補うと、彼らが聞いた内容の性格を翻訳側で確定することになるため、原文の簡潔さと司法的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、審理の場面にふさわしい簡潔で厳粛な調子を保った。反語は「必要だろうか」とし、過度に古風な「要ろうか」や硬すぎる直訳調を避けた。
