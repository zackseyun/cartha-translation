lexical_decisions:
- source_word: ὤφθη
  choice: 現れ
  rationale: 受動形だが、顕現を表す定型的な用法なので、現代日本語として自然な「現れ」とした。
- source_word: δὲ
  choice: すると
  rationale: ここでは強い対比ではなく物語の進行を示すため、「すると」とした。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 指示対象を日本語で明確にするため、代名詞ではなく「イエスに」とした。
- source_word: ἄγγελος
  choice: 御使い
  rationale: 天から来る存在という文脈に即して「使者」ではなく「御使い」とした。
- source_word: ἀπ’ οὐρανοῦ
  choice: 天から
  rationale: 起源を表す前置詞句を、簡潔で自然な日本語にした。
- source_word: ἐνισχύων
  choice: 力づけた
  rationale: 現れるのに伴ってイエスに力を与える行為を表す。日本語では分詞を定動詞として訳すのが自然である。
- source_word: αὐτόν
  choice: 彼を
  rationale: 目的語がイエスであることを保ちつつ、直前の固有名詞の反復を避けた。
theological_decisions:
- issue: ルカ22章43節の本文上の位置づけ
  choice: 提示されたSBLGNT本文に従い、節を本文に含める。
  alternative: 一部の写本では43～44節が欠けている。
  rationale: 提供されたギリシャ語本文を訳しつつ、重要な本文異同は脚注で明示し、判断を隠さないため。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「御使い」は聖書文体として通用しながらも理解しやすい語。「彼」はイエスを指す。
