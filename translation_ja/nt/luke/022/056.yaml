id: LUK.22.56
reference: Luke 22:56
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ αὐτὸν παιδίσκη τις καθήμενον πρὸς τὸ φῶς καὶ ἀτενίσασα αὐτῷ εἶπεν· Καὶ οὗτος σὺν αὐτῷ ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/056.yaml
  text: Then a certain servant girl[a], seeing him seated by the light and looking intently at him, said, “This man also was with him.”
translation:
  language: ja
  text: すると、一人の女の召使いが、ペトロが明かりのそばに座っているのを見て、彼をじっと見つめ、言った。「この人も、イエスと一緒にいました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοῦσα
  choice: 見つけ
  rationale: アオリスト分詞が、女がペトロに気づいたことを示す。後続の「じっと見つめて」と自然につながるよう、「見つけ」とした。
- source_word: δὲ
  choice: すると
  rationale: 強い対比ではなく物語の進行を示すため、現代日本語で場面の展開を自然に表す「すると」とした。
- source_word: παιδίσκη τις
  choice: 一人の召使いの女
  rationale: παιδίσκηは若い女性の召使いまたは奴隷を指し、τιςは不特定性を添える。身分を必要以上に強調せず、自然な日本語で表した。
- source_word: καθήμενον
  choice: 座っていた
  rationale: ペトロの継続中の姿勢を自然な日本語で表す。目的語が男性であることは文脈上ペトロと明示した。
- source_word: πρὸς τὸ φῶς
  choice: 明かりのそばに
  rationale: πρόςの位置関係を保ち、光源の近くにいたという意味を自然に表した。火であることはこの句自体には明示されないため補わない。
- source_word: ἀτενίσασα αὐτῷ
  choice: 彼をじっと見つめて
  rationale: 注意を集中して凝視する動作を、過度に口語的にならない自然な表現で示した。
- source_word: Καὶ οὗτος
  choice: この人も
  rationale: 指示語の特定する力とκαίの追加の意味を簡潔に保持した。
- source_word: σὺν αὐτῷ ἦν
  choice: あの方と一緒にいました
  rationale: 同行・仲間関係を直接表す。「あの方」は同一文中のペトロを指す「この人」と区別し、イエスへの言及を自然に示す。敬称は日本語の自然さのためで、話者の信仰告白を含意しない。
theological_decisions:
- issue: αὐτόςで指されるイエスの表し方
  choice: あの方
  alternative: あの人／彼
  rationale: 日本語では「この人も彼と一緒にいた」は指示対象が紛らわしい。「あの方」はペトロとの区別を明確にする一方、原文にない称号や神学的説明は加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。原文の分詞の連続は、日本語として自然な継起表現に整えた。固有名「ペトロ」は原文では代名詞だが、日本語で目的語を明確にするため文脈上の指示対象を明示した。
