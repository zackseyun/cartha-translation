  text: But if I ask[a], you will certainly not answer.
translation:
  language: ja
  text: しかし、わたしが尋ねても、あなたがたは決して答えないだろう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: ても
  rationale: アオリスト接続法とともに条件を示す。日本語では「尋ねても」とすることで、この文脈に自然な仮定条件を表す。
- source_word: δὲ
  choice: しかし
  rationale: 前後の発言との対比を明確にする逆接として訳した。
- source_word: ἐρωτήσω
  choice: わたしが尋ねても
  rationale: 質問する行為を広く表す語であり、敵対的な尋問という意味を不必要に加えない「尋ねる」が適切である。
- source_word: οὐ μὴ
  choice: 決して…ない
  rationale: 接続法を伴う強い否定を、明瞭で自然な現代日本語の「決して…ない」で保持した。
- source_word: ἀποκριθῆτε
  choice: あなたがたは…答えない
  rationale: 形は受動態だが、ここでは「答える」を意味する。主語が複数二人称であることも明示した。
