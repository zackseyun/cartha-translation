  text: πλὴν ἰδοὺ ἡ χεὶρ τοῦ παραδιδόντος με μετ’ ἐμοῦ ἐπὶ τῆς τραπέζης·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/021.yaml
  text: But look, the hand of the one betraying me is with me on the table.
translation:
  language: ja
  text: だが、見よ、私を裏切る者の手が、私と共に食卓の上にある。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλὴν
  choice: だが
  rationale: 直前の発言との強い対照・転換を、簡潔で自然な現代日本語で示す。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を強く促す提示表現を保持する。日常語の「見なさい」より簡潔で、聖書本文にふさわしい威厳も保つ。
- source_word: τοῦ παραδιδόντος με
  choice: 私を裏切る者
  rationale: 現在分詞の定冠詞付き用法を人物表現として訳す。文脈上の敵への引き渡しが裏切りを意味するため、「引き渡す者」より自然で明確。
- source_word: μετ’ ἐμοῦ
  choice: 私と共に
  rationale: 同席と近接を示すμετά属格の意味を保持する。
- source_word: ἐπὶ τῆς τραπέζης
  choice: 食卓の上に
  rationale: ἐπί＋属格の位置関係をそのまま保ちつつ、会食の文脈に適した「食卓」を用いる。
theological_decisions:
- issue: 「手」が食卓の上にあるという比喩的・換喩的表現
  choice: 原文どおり「手」を保持する
  alternative: 「私を裏切る者が私と同じ食卓に着いている」
  rationale: 原文の印象的な身体表現と、裏切る者の不穏な近さを保つため。明示的に「同席している」と解釈し切らない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「見よ」「共に」によって簡潔な威厳を保った。「手が…食卓の上にある」という原文の際立った表現は平滑化せず残した。
