id: LUK.22.54
reference: Luke 22:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Συλλαβόντες δὲ αὐτὸν ἤγαγον καὶ ⸀εἰσήγαγον εἰς ⸂τὴν οἰκίαν⸃ τοῦ ἀρχιερέως· ὁ δὲ Πέτρος ἠκολούθει μακρόθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/054.yaml
  text: After arresting him[a], they led him away and brought him into the high priest’s house; but Peter was following at a distance.
translation:
  language: ja
  text: 人々はイエスを捕らえると、連れて行き、大祭司の家に連れて入った。しかし、ペトロは遠くから[a]後についていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「遠くから」。別訳「遠く離れて」。
    reason: μακρόθενは、ペトロが後についていた際の空間的な距離を表す。
lexical_decisions:
- source_word: Συλλαβόντες
  choice: 捕らえると
  rationale: アオリスト分詞が主要動詞に先立つ行為を表すことを自然な日本語で示し、拘束・逮捕の文脈も保った。
- source_word: ἤγαγον
  choice: 連れて行き
  rationale: 拘束下にあるイエスを移動させる意味を簡潔に表した。
- source_word: εἰσήγαγον
  choice: 家の中へ引き入れた
  rationale: εἰςとの組み合わせが示す内部への方向性を明示し、直前の「連れて行き」との単調な反復を避けた。
- source_word: οἰκίαν
  choice: 家
  rationale: ここでは建物としての物理的な場所を指すため、最も直接的で一般的な訳語を選んだ。
- source_word: ἀρχιερέως
  choice: 大祭司
  rationale: 新約聖書におけるἀρχιερεύςの標準的かつ文脈に即した訳語である。
- source_word: ἠκολούθει
  choice: 後についていた
  rationale: 未完了過去の継続的な動作を表しつつ、現代日本語として自然な表現にした。
- source_word: μακρόθεν
  choice: 遠く離れて
  rationale: 空間的な隔たりを明確に表し、ペトロの動機や心理を訳文に付加しない表現とした。
- source_word: δὲ
  choice: しかし
  rationale: イエスを連行する人々と、距離を置いて後を追うペトロとの穏やかな対照を示した。
theological_decisions:
- issue: 逮捕後のイエスに対するペトロの関わり方
  choice: 「遠く離れて後についていた」とし、身体的な距離と継続する動作のみを述べた。
  alternative: 「おびえながら」「人目を避けて」など、ペトロの心理や動機を明示する。
  rationale: 本文はペトロが離れて後を追った事実を描くが、その動機を明言していないため、評価的・心理的な説明を加えず物語上の緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、受難物語にふさわしい簡潔で格調ある叙述にした。「イエス」は文脈上の指示対象を日本語で明確にするため補った。
