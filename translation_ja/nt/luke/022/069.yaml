review_pass:
  verdict: revise
  source_fidelity: 原文は未来形ἔσταιと現在分詞καθήμενοςによって、今後成立する着座（高挙）の状態を述べる。草案の「座に着いている」は日本語では現在の状態として読まれやすく、未来の意味が十分に表れていない。また「神の力ある右の座」は、「力ある」が「右の座」を修飾する形となり、τῆς δυνάμεως τοῦ θεοῦ（神の力）の属格構造を正確に反映しない。
  naturalness: 「今から後」は通じるが、「今から後」より「今から後」もしくは「これから後」が自然である。ここでは聖書本文として定着した明瞭な表現「神の力の右の座に着くことになる」を用いる。
  terminology: 「人の子」は維持する。「右の座」はἐκ δεξιῶνの聖書的・王権的慣用表現を自然な日本語で保つ。「神の力」はδύναμις τοῦ θεοῦを省略も再解釈もせずに訳す。原文にはθεοῦが明記されるため、「力」だけを神への婉曲的敬称とする脚注は本文の構造をかえって不明瞭にする。
  issues:
  - severity: high
    issue: 未来のἔσταιが本文で十分に表されていない。
    rationale: 「今から後」と「着いている」の組合せは日本語として不自然であり、現在すでに着座しているという読みを招く。未来に成立する状態を「着くことになる」で明示する必要がある。
  - severity: high
    issue: 「神の力ある右の座」の修飾関係が原文と異なる。
    rationale: 原文は「神の力の右（の座）」であり、「神の力ある右の座」は「力ある」が座を修飾する日本語になる。
  - severity: medium
    issue: 脚注がδύναμιςを単独で神への婉曲表現と扱い、原文に明記されたτοῦ θεοῦを曖昧にしている。
    rationale: この句は「神の力」であり、本文で神が明示されている。脚注の提示する「『力』の右」は日本語本文の理解を助けず、原文の語句関係も十分に示さない。
  revised_text: しかし、今から後、人の子は神の力の右の座に着くことになる。
