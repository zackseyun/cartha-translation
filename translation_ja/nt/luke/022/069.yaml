  text: ἀπὸ τοῦ νῦν ⸀δὲ ἔσται ὁ υἱὸς τοῦ ἀνθρώπου καθήμενος ἐκ δεξιῶν τῆς δυνάμεως τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/069.yaml
  text: But from now on the Son of Man will be seated at the right hand of the power of God[a].
translation:
  language: ja
  text: しかし、今から後、人の子は神の力の右の座に着くことになる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τοῦ νῦν
  choice: 今から後
  rationale: この時点以後を示す自然な現代日本語で、将来に向かう時間的な意味を保つ。
- source_word: δὲ
  choice: しかし
  rationale: 直前の応答から、対照を伴う重大な宣言へ転じる働きを明確に表す。
- source_word: ἔσται … καθήμενος
  choice: 座に着いている
  rationale: 未来の時点に成立する着座状態を表す迂言的未来である。「座に着いている」は王的な着座と継続する状態を自然に伝える。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの特徴的な自己呼称を字義的に保ち、ダニエル書を含む聖書的響きと解釈上の幅を維持する。
- source_word: ἐκ δεξιῶν
  choice: 右の座に
  rationale: 最高の栄誉と権威の位置を表す聖書的慣用句を、日本語として理解しやすく、王座の含意も伝わる形で表す。
- source_word: τῆς δυνάμεως τοῦ θεοῦ
  choice: 神の力ある
  rationale: 属格の連なりを「神の力ある右の座」として自然に表し、神に属する力を明示する。別の統語的理解は脚注に残す。
theological_decisions:
- issue: 人の子の高挙と神的権威を示す表現
  choice: 人の子は神の力ある右の座に着いている
  alternative: 人の子は「力」の右に座っている
  rationale: 詩編110篇とダニエル7章を想起させる着座と権威の主張を保ちつつ、本文の「神」を明示する語を省かない。δύναμιςを神への敬称と見る可能性は脚注で提示する。
translation_notes:
  register: 明瞭で格調ある現代標準語。「人の子」は定着した聖書用語として保持し、「右の座に着く」で王的な着座と権威を表した。
