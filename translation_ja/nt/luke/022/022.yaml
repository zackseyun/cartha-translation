id: LUK.22.22
reference: Luke 22:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ὅτι ὁ υἱὸς μὲν⸃ τοῦ ἀνθρώπου ⸂κατὰ τὸ ὡρισμένον πορεύεται⸃, πλὴν οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ παραδίδοται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/022.yaml
  text: For the Son of Man indeed goes as it has been determined[a], but woe to that man through whom he is betrayed.
translation:
  language: ja
  text: というのも、人の子は定められたとおりに進んで行かれます。しかし、その方を裏切るその者[a]には、災いがあります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その方を引き渡すその者」とも訳せる。ギリシア語の動詞は、文脈により「裏切る」と「引き渡す」のどちらの意味にもなり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: （訳出せず、文脈上のつながりに含める）
  rationale: 前文の理由・説明を導く接続詞だが、単独の節として自然な現代日本語にするため、明示的な「なぜなら」は置かない。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した訳であり、旧約聖書との間の響きも保つ。
- source_word: μέν ... πλὴν
  choice: …ます。しかし
  rationale: 神による決定と、引き渡す者への災いとの強い対照を、自然な日本語で明確に示す。
- source_word: κατὰ τὸ ὡρισμένον
  choice: 定められているとおりに
  rationale: すでになされた決定への適合を表しつつ、行為者を本文以上に明示しない受動的な表現を保つ。
- source_word: πορεύεται
  choice: 進んで行きます
  rationale: 単なる移動ではなく、死へ向かう定められた道程を含意する文脈に自然に合う。
- source_word: οὐαὶ τῷ ἀνθρώπῳ ἐκείνῳ
  choice: その方を裏切る者には災いがあります
  rationale: οὐαίの預言的な災禍の宣告を明瞭に伝え、特定の男性を指すことは文脈と動詞句によって示す。
- source_word: δι’ οὗ
  choice: …者に（関係節として表現）
  rationale: 直訳的な「その者を通して」より自然な日本語としつつ、行為者との関係を保持する。
- source_word: παραδίδοται
  choice: 裏切る
  rationale: ユダの行為という直近の文脈では背信を表す「裏切る」が自然。ただし「引き渡す」という基本的意味も脚注に残す。
theological_decisions:
- issue: 神の定めと人間の責任の関係
  choice: 「定められているとおり」と「しかし…災いがあります」を並置する
  alternative: 神の定めを弱める、または裏切る者の責任を弱める訳
  rationale: ギリシア語本文は、定められた計画と裏切る者への災いを明確に併置しているため、その緊張を特定の神学体系によって解消しない。
- issue: ὡρισμένονの決定主体
  choice: 「定められている」と受動表現にする
  alternative: 「神がお定めになった」と主体を明示する
  rationale: 文脈上は神の決定が示唆されるが、この節のギリシア語は主体を明記していないため、本文では補わない。
translation_notes:
  register: 明瞭で現代的な敬体を用いながら、「人の子」「災い」など聖書本文にふさわしい尊厳と響きを保った。「その方」はイエスを指し、敬意を自然に示す。
