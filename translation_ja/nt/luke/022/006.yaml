  text: And he agreed[a], and began seeking an opportunity to hand him over to them apart from the crowd.
translation:
  language: ja
  text: そこで彼は承諾し、群衆のいない時にイエスを彼らに引き渡す[a]機会を探し始めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「裏切る」。ギリシア語の動詞は字義的には「引き渡す」「渡す」を意味するが、ユダの行為については「裏切る」も文脈に即した訳である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξωμολόγησεν
  choice: 承諾し
  rationale: この文脈では、ユダが祭司長たちの申し出に同意したことを表す。「告白する」という一般的な語義ではなく、文脈に即した「承諾する」とした。
- source_word: ἐζήτει
  choice: 探し始めた
  rationale: 未完了過去が表し得る継続・開始の含みのうち、承諾後の物語の進展を自然に示す開始的な訳を採った。
- source_word: εὐκαιρίαν
  choice: 機会
  rationale: 行動に適した好機・折を意味し、現代日本語として簡潔で自然である。
- source_word: τοῦ παραδοῦναι
  choice: 引き渡す
  rationale: παραδίδωμιの基本的意味を保ち、受難物語における同語の反復にも対応する。「裏切る」はこの文脈では妥当だが、解釈を一段加えた訳なので脚注に示した。
- source_word: ἄτερ ὄχλου
  choice: 群衆のいない時に
  rationale: 群衆から離れた、または群衆が居合わせない状況であることを、自然な日本語で表した。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 直前の文脈に登場する祭司長たちと神殿守衛長たちを、引き渡しの相手として示す与格である。
