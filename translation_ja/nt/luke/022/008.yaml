id: LUK.22.8
reference: Luke 22:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν Πέτρον καὶ Ἰωάννην εἰπών· Πορευθέντες ἑτοιμάσατε ἡμῖν τὸ πάσχα ἵνα φάγωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/008.yaml
  text: And he sent Peter and John[a], saying, “Go and prepare the Passover for us, so that we may eat it.”
translation:
  language: ja
  text: イエスはペテロとヨハネを遣わして、こう言った。「行って、私たちが食べられるように、過越の食事[a]の用意をしなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「過越」。ギリシア語は過越祭を広く指すこともあるが、ここでは用意して食べるという文脈から、過越の食事を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 遣わして
  rationale: 単なる移動ではなく、務めを託して送り出すことを表すため、「遣わす」とした。文脈上の主語イエスを明示し、分詞 εἰπών との連続を自然な日本語にした。
- source_word: εἰπών
  choice: こう言われた
  rationale: 後続する直接話法を導く分詞であり、日本語では主動詞とつないで「遣わして、こう言われた」とするのが自然である。イエスへの敬意を示す標準的な敬語表現を用いた。
- source_word: Πορευθέντες
  choice: 行って
  rationale: 形の上ではアオリスト分詞だが、命令の文脈では後続の「用意しなさい」に先立つ行為を命じる。「行って」が簡潔で自然である。
- source_word: ἑτοιμάσατε
  choice: 用意をしなさい
  rationale: 食事に必要な実際の準備を命じる語として、現代日本語で明瞭な表現を選んだ。
- source_word: ἡμῖν
  choice: 私たちが
  rationale: 受益者を表す与格だが、ἵνα φάγωμεν と合わせ、日本語では「私たちが食べられるように」と目的節の主語として自然に表現した。
- source_word: τὸ πάσχα
  choice: 過越の食事
  rationale: πάσχα は祭り全体、食事、犠牲の小羊などを指し得るが、ここでは「用意する」「食べる」という直近の文脈から食事を指すことが明瞭である。「過越」だけでは現代日本語で食べる対象として不自然になりやすいため、本文では「過越の食事」とし、語の広がりは脚注で保持した。
- source_word: ἵνα φάγωμεν
  choice: 私たちが食べられるように
  rationale: ἵνα と接続法が表す目的を自然な日本語で示した。「食べられる」は可能というより、準備の目的・実現を表す文脈的表現である。
theological_decisions:
- issue: τὸ πάσχα の指示範囲
  choice: 本文では「過越の食事」とし、脚注で原語のより広い指示範囲を示す。
  alternative: 「過越」または「過越の小羊」
  rationale: 食べるために用意するという文脈は食事を強く示す一方、原語 πάσχα 自体は過越祭をより広く指すこともある。「過越の小羊」に限定する根拠は本文だけでは十分でないため避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。会話は自然な命令形とし、古風な「備えよ」などは避けた。固有名は一般的な聖書表記「ペテロ」「ヨハネ」を採用した。
