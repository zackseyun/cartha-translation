id: LUK.22.25
reference: Luke 22:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Οἱ βασιλεῖς τῶν ἐθνῶν κυριεύουσιν αὐτῶν καὶ οἱ ἐξουσιάζοντες αὐτῶν εὐεργέται καλοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/025.yaml
  text: But he said to them[a], “The kings of the Gentiles lord it over them[b], and those exercising authority over them are called benefactors.”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「異邦人[a]の王たちはその人々を支配し、その人々に権力を行使する者たちは『恩人』[b]と呼ばれている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「諸国民」。
    reason: lexical_alternative
  - marker: b
    text: 「恩人」は、公共のために善を行う者と見なされた支配者や有力な後援者に用いられた名誉称号である。
    reason: cultural_note
lexical_decisions:
- source_word: βασιλεῖς
  choice: 王たち
  rationale: 一般的な支配者ではなく、王を具体的に指す名詞なので、その政治的称号を保った。
- source_word: τῶν ἐθνῶν
  choice: 異邦人の
  rationale: ルカ文書でしばしばユダヤ人以外の諸民族を指す用法に従った。ただし「諸国民の」という語義もあり得るため脚注に示した。
- source_word: κυριεύουσιν
  choice: 支配し
  rationale: 他者の上に主人として立って治めるという意味を、文脈に合う自然な日本語で表した。強圧性を過度に付加する「横暴に支配する」などは避けた。
- source_word: ἐξουσιάζοντες
  choice: 権力を振るう者たち
  rationale: 単に地位に就いているだけでなく、権威を実際に行使する分詞の能動的な意味を保った。
- source_word: εὐεργέται
  choice: 『恩人』
  rationale: 善を施す者という語義と、支配者や有力な後援者に用いられた名誉称号の性格を簡潔に伝える。かぎ括弧によって称号としての用法を示した。
- source_word: καλοῦνται
  choice: 呼ばれている
  rationale: そのような称号で呼ばれることを表す受動態を素直に訳した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の弟子たちの議論に対してイエスの言葉が対照をなすため、穏やかな逆接として訳した。
theological_decisions:
- issue: τῶν ἐθνῶν の文脈上の意味
  choice: 異邦人の
  alternative: 諸国民の／諸国の
  rationale: ここでは、弟子たちに示される指導のあり方と、ユダヤ人以外の世界で見られる政治的支配とが対比されている可能性が高い。ただし語そのものが持つ「諸国民」という広い意味は脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語とした。「イエス」はギリシア語本文では代名詞だが、日本語で話者を明確にするため文脈に基づいて補った。「その民／民」として αὐτῶν の指示対象を自然に示しつつ、原文の反復による重さをある程度保った。
