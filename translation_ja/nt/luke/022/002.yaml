reference: Luke 22:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς τὸ πῶς ἀνέλωσιν αὐτόν, ἐφοβοῦντο γὰρ τὸν λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/002.yaml
  text: And the chief priests and the scribes were seeking how they might kill him[a], for they were afraid of the people.
translation:
  language: ja
  text: 祭司長たちと律法学者たちは、イエスをどのように殺すかを探っていた。民を恐れていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐζήτουν
  choice: 方法を探していた
  rationale: 未完了過去の継続的な動きを表し、単に「探した」ではなく、実行の方法を探り続けていたことを自然な日本語で示す。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: エルサレムの祭司階級の指導者層を指す、福音書で定着した訳語。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 単なる筆写者ではなく、律法を専門とする者という当時の役割が現代の読者に明確に伝わる。
- source_word: τὸ πῶς
  choice: どうやって……か
  rationale: 冠詞を伴う πῶς の「どのように、どんな方法で」という意味を自然に表す。
- source_word: ἀνέλωσιν
  choice: 殺そう
  rationale: この文脈の ἀναιρέω は死に至らせることを明確に意味するため、敵意を弱めず、同時に司法手続きを不必要に特定しない。
- source_word: ἐφοβοῦντο
  choice: 恐れていた
  rationale: 未完了過去が示す継続的な恐れの状態を保つ。
- source_word: τὸν λαόν
  choice: 民
  rationale: λαός の集合的な意味を保ち、その場の群衆だけに限定しない。聖書叙述にふさわしく、現代日本語でも理解できる語。
theological_decisions:
- issue: 指導者たちの意図における ἀνέλωσιν の強さ
  choice: 「イエスを殺そう」と訳し、殺害の意図を明示する。
  alternative: 「イエスを亡き者にしよう」「イエスを死刑にしよう」
  rationale: 原文は敵意を婉曲化していない。一方、「死刑にする」はこの段階で正式な司法手続きを特定しすぎるため避けた。
- issue: λαός の指示範囲
  choice: 集合的な「民」とする。
  alternative: 「群衆」
  rationale: その場に集まった人々だけに狭めず、民衆の反応を恐れる指導者たちという物語上の緊張を保つ。
- issue: αὐτόν の日本語での明示
  choice: 「イエス」と訳す。
  alternative: 「彼」
  rationale: 日本語では「彼」が不自然または曖昧になりやすいため、文脈上の指示対象を明示する。新たな解釈を加えるものではない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「祭司長」「律法学者」は福音書の歴史的役職を分かりやすく示す定着語とし、「民」は λαός の集合性を保持した。
