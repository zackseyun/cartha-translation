  text: καὶ λαβὼν ἄρτον εὐχαριστήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς λέγων· Τοῦτό ἐστιν τὸ σῶμά μου ⸂[τὸ ὑπὲρ ὑμῶν διδόμενον· τοῦτο ποιεῖτε εἰς τὴν ἐμὴν ἀνάμνησιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/019.yaml
  text: And taking bread[a], after giving thanks he broke it and gave it to them, saying, “This is my body, which is given for you[c][b]. Keep doing this in remembrance of me.”
translation:
  language: ja
  text: そして、パンを取り、感謝をささげてからそれを裂き、彼らに与えて、こう言われた。「これは、あなたがたのために与えられる[b]わたしの体です。[c] わたしを覚えるために、これを行い続けなさい。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「あなたがたのために与えられる」から「わたしを覚えるために、これを行い続けなさい」までの部分がありません。
    reason: textual_variant
  - marker: b
    text: 「あなたがたのために、今、与えられている」とも訳せます。
    reason: lexical_alternative
  - marker: c
    text: 「これはわたしの体です」は、ギリシア語本文の表現どおりに訳しています。「これはわたしの体を表します」と解釈する人もいますが、ギリシア語本文自体は「です」に当たる語を用いています。
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν ἄρτον
  choice: パンを取り
  rationale: アオリスト分詞による先行動作を、日本語の自然な連用形で簡潔に表した。ἄρτοςは食事の文脈に即して「パン」とした。
- source_word: εὐχαριστήσας
  choice: 感謝をささげてから
  rationale: パンを裂く前の感謝を示す先行動作であることを「てから」で明確にしつつ、感謝の相手を本文以上に補わなかった。
- source_word: ἔκλασεν καὶ ἔδωκεν αὐτοῖς
  choice: それを裂き、彼らに与えて
  rationale: κλάωを直接的に「裂く」とし、目的語は日本語で明瞭になるよう「それ」を補った。αὐτοῖςは本文どおり「彼ら」とした。
- source_word: Τοῦτό ἐστιν τὸ σῶμά μου
  choice: これは……わたしの体です
  rationale: 連結動詞ἐστινを「です」として率直に訳し、「表す」「象徴する」などの解釈を本文に持ち込まなかった。
- source_word: τὸ ὑπὲρ ὑμῶν διδόμενον
  choice: あなたがたのために与えられる
  rationale: 冠詞付き現在分詞を自然な連体的表現にし、ὑπέρは受益・身代わりの含みを狭く決めすぎない「ために」とした。現在分詞の進行的理解も脚注に残した。
- source_word: τοῦτο ποιεῖτε
  choice: このことを行い続けなさい
  rationale: 現在命令形がこの文脈で持つ継続・反復の力を「行い続けなさい」で明示した。
- source_word: εἰς τὴν ἐμὴν ἀνάμνησιν
  choice: わたしを覚えて
  rationale: ἀνάμνησιςの記念・想起の行為を、現代日本語で分かりやすく表現した。「行い続けなさい」と合わせて、単なる一時的な心中の回想ではなく反復される記念行為であることを伝える。
theological_decisions:
- issue: 聖餐の文脈における「これはわたしの体です」の意味
  choice: 本文の連結表現をそのまま「これは……わたしの体です」とした。
  alternative: 「これはわたしの体を表します」「これはわたしの体を象徴します」
  rationale: ギリシア語本文はἐστιν（「である」）を用いており、比喩・象徴・実在などをめぐる教派的解釈を翻訳で確定しないため。
- issue: ルカ22章19節後半の本文批評上の位置づけ
  choice: 異読のある長い読みを本文に収め、脚注で写本上の省略を示した。
  alternative: 「これはわたしの体です」で節を終える短い読み
  rationale: 提示されたSBLGNTは当該句を本文に角括弧付きで収録しているため、その本文を採用しつつ、重要な写本異読を明示した。
- issue: διδόμενονの時制的ニュアンス
  choice: 「与えられる」と訳した。
  alternative: 「今、与えられている」
  rationale: 現在分詞の進行的な響きを保ち得る一方、日本語本文では自然で過度に限定しない表現を選び、代案を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語の流れは自然な連用形で整えた。イエスの発言は敬体にして、読みやすさと品位を両立させた。「ささげる」は宗教的文脈に自然だが、本文にない感謝の相手は補っていない。
