  text: And he will show you a large furnished upper room[a]; prepare there.
translation:
  language: ja
  text: その人があなたがたに、整えられた広い二階の部屋[a]を見せる。そこで準備しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しつらえられた広い二階の部屋」または「敷物などが整えられた広い二階の部屋」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνος
  choice: すると、その人が
  rationale: καί＋ἐκεῖνοςは、直前に言及された家の主人を受けつつ指示の流れを続ける。日本語では「すると、その人が」が自然で、指示対象も明確になる。
- source_word: ὑμῖν δείξει
  choice: 見せてくれます
  rationale: δείξειは未来形で「見せる」、ὑμῖνはその受け手を示す。文脈上、日本語の授受表現を用いると自然だが、行為内容は過不足なく保持される。
- source_word: ἀνάγαιον μέγα
  choice: 広い二階の部屋
  rationale: ἀνάγαιονは建物の上階にある部屋、μέγαはその大きさを表す。「広い二階の部屋」は現代日本語として明瞭で、用途を限定しない。
- source_word: ἐστρωμένον
  choice: 整えられた
  rationale: στρώννυμιの完了受動分詞で、何かが敷かれ、食事のためにしつらえられた状態を示し得る。「整えられた」は、家具付きか食事の設備が配置済みかという語義上の幅を保つ。
- source_word: ἐκεῖ ἑτοιμάσατε
  choice: そこで準備をしなさい
  rationale: ἐκεῖの場所指定と、ἑτοιμάσατεの複数へのアオリスト命令を、明瞭で dignified な現代日本語の命令文として表した。
theological_decisions: []
