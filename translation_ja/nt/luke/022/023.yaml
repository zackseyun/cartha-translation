  text: καὶ αὐτοὶ ἤρξαντο συζητεῖν πρὸς ἑαυτοὺς τὸ τίς ἄρα εἴη ἐξ αὐτῶν ὁ τοῦτο μέλλων πράσσειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/023.yaml
  text: And they began to discuss among themselves which one of them might be the one about to do this[a].
translation:
  language: ja
  text: 彼らは、自分たちのうちのだれがそのことをしようとしているのかと、互いに話し合い始めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちのうち、そのことをしようとしているのはいったいだれなのか」。ここで「そのこと」とは、前の節で告げられた裏切りを指す。
    reason: 語順の別訳と、指示語が文脈上指す内容を示すため。
lexical_decisions:
- source_word: ἤρξαντο
  choice: 始めた
  rationale: 不定詞を伴うἄρχομαιのアオリストが示す動作の開始を、自然な現代日本語で表した。
- source_word: συζητεῖν
  choice: 論じ
  rationale: 共に話し合い、問いただす意味を保ちつつ、敵対的な口論とまでは限定しない語を選んだ。
- source_word: πρὸς ἑαυτούς
  choice: 互いに
  rationale: 集団内での相互的なやり取りを簡潔で自然な日本語にした。
- source_word: τὸ τίς ἄρα εἴη ἐξ αὐτῶν
  choice: 自分たちのうち、いったいだれが…なのか
  rationale: 既知の集団から一人を問う間接疑問と、ἄραの思案・詮索の響き、εἴηの不確かさを一体として表した。
- source_word: τοῦτο
  choice: そのこと
  rationale: 直前に告げられた行為を指す指示語を保持し、本文中で「裏切る」と明示する解釈的補足を避けた。
- source_word: μέλλων πράσσειν
  choice: しようとしている
  rationale: 間近に行おうとしていることを表すμέλλω＋不定詞を自然に訳した。「するつもり」として意図だけに狭めないようにした。
theological_decisions:
- issue: 「そのこと」が裏切りを指すことを本文で明示するか
  choice: 原文どおり「そのこと」とし、指示内容は文脈に委ねる。
  alternative: 「イエスを裏切ろうとしている」と明示する。
  rationale: 文脈上は裏切りを指すが、この節自体はτοῦτο πράσσεινという間接的表現を用いるため、その表現上の距離を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「論じる」は議論の含みを保つが、激しい口論までは示さない。「いったい」によりἄραを伴う思案と当惑を自然に表現した。
