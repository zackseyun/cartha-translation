id: LUK.22.32
reference: Luke 22:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἐδεήθην περὶ σοῦ ἵνα μὴ ἐκλίπῃ ἡ πίστις σου· καὶ σύ ποτε ἐπιστρέψας ⸀στήρισον τοὺς ἀδελφούς σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/032.yaml
  text: But I have prayed for you[a], that your faith may not fail; and you, when you have turned back[b], strengthen your brothers.
translation:
  language: ja
  text: しかし、わたしはあなたのために、あなたの信仰[a]が尽きないように祈りました。あなたは、立ち返ったときには[b]、兄弟たちを力づけなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼」または「忠実さ」とも訳せる。ギリシア語にはこれらの意味が重なっている。
    reason: alternative_reading
  - marker: b
    text: 「戻ったとき」または「再び向きを変えたとき」とも訳せる。この表現は、ペトロがやがて失敗した後に回復することを示唆する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδεήθην
  choice: 祈りました
  rationale: 熱心な願いを表す動詞。日本語では文脈上「祈りました」が自然で、すでになされた執り成しを明確に伝える。
- source_word: περὶ σοῦ
  choice: あなたのために
  rationale: 祈りを表す動詞に伴う περί＋属格は、単に「あなたについて」ではなく執り成しの対象を示す。
- source_word: ἵνα μὴ ἐκλίπῃ
  choice: 尽きないように
  rationale: ἐκλείπω の「尽きる、絶える、力を失う」という意味を自然に表し、ペトロの信仰が完全に消滅するとの断定を避ける。
- source_word: πίστις
  choice: 信仰
  rationale: 信頼と忠実さの重なりを保てる広い訳語。「忠実」「信頼」に限定せず、別の含みは脚注に示す。
- source_word: ποτε
  choice: とき
  rationale: ここでは将来のある時点を示し、分詞とともに「立ち返ったとき」とするのが自然。
- source_word: ἐπιστρέψας
  choice: 立ち返った
  rationale: 向きを変えて戻る比喩と、失敗後の回復という含みを保つ。「悔い改めた」と限定しすぎない。
- source_word: στήρισον
  choice: 力づけなさい
  rationale: 他者を堅くし、支えるよう命じる語。現代日本語として明瞭で、霊的・共同体的な支えの双方を表せる。
- source_word: ἀδελφούς
  choice: 兄弟たち
  rationale: 直近の文脈では男性の弟子たちを指すため、原文の男性複数形を保持する。
theological_decisions:
- issue: πίστις が「信仰」「信頼」「忠実さ」の重なりを持つこと
  choice: 信仰
  alternative: 信頼、忠実さ
  rationale: 主要訳では意味の幅を保持する「信仰」を用い、試練の中での信頼や忠実さという含みを脚注に残す。
- issue: ἐπιστρέψας が示すペトロの将来の回復
  choice: 立ち返ったとき
  alternative: 戻ったとき、再び向きを変えたとき、悔い改めたとき
  rationale: 失敗後の回復を示しつつ、原文にない専門的・教理的な「悔い改め」に意味を狭めない。
- issue: ἀδελφούς の指示対象
  choice: 兄弟たち
  alternative: 仲間の信者たち、兄弟姉妹たち
  rationale: この場面で直接念頭に置かれているのは男性の弟子たちであり、混合集団へ一般化しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」「あなた」を用い、命令形は威圧的にならない「力づけなさい」とした。前後の対比を示す δέ は「しかし」、後半の καί σύ はペトロへの転換と責任を自然に示すため「だからあなたは」と訳した。
