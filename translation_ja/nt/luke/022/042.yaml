id: LUK.22.42
reference: Luke 22:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων· Πάτερ, εἰ βούλει ⸀παρένεγκε ⸂τοῦτο τὸ ποτήριον⸃ ἀπ’ ἐμοῦ· πλὴν μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν ⸀γινέσθω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/042.yaml
  text: saying[a], “Father, if you are willing, take this cup away from me. Nevertheless, not my will[c][b], but yours be done.”
translation:
  language: ja
  text: こう言われた。「父よ、もしお望みなら、この杯[b]をわたしから取り去ってください。[a] しかし、わたしの意志ではなく、あなたの意志が行われますように。[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この杯をわたしから遠ざけてください」とも訳せる。
    reason: παρένεγκε ... ἀπ’ ἐμοῦ の語義上の別訳
  - marker: b
    text: 「杯」は聖書で、人に割り当てられた分、特に苦難や裁きを表す比喩として用いられる。
    reason: 聖書的比喩の説明
  - marker: c
    text: 別訳「わたしが望むことではなく、あなたがお望みになることが行われますように。」
    reason: 名詞表現を動詞表現にした別訳
lexical_decisions:
- source_word: λέγων
  choice: こう言われた
  rationale: 現在分詞で祈りの言葉を導入している。日本語では前後とのつながりを保ちつつ自然な導入となるよう、敬意を含む「こう言われた」とした。
- source_word: Πάτερ
  choice: 父よ
  rationale: 神への呼びかけである。現代日本語として明瞭で、原文の直接的な呼格を保つ。
- source_word: εἰ βούλει
  choice: もしお望みなら
  rationale: βούλομαι は意志や願いを表す。条件をそのまま保ち、神への呼びかけにふさわしい敬語表現とした。
- source_word: παρένεγκε ... ἀπ’ ἐμοῦ
  choice: 私から取りのけてください
  rationale: παραφέρω の命令形と ἀπ’ ἐμοῦ を一体として、杯を自分から遠ざけるよう求める意味を自然な日本語で表した。
- source_word: τοῦτο τὸ ποτήριον
  choice: この杯
  rationale: 苦難や裁きを暗示する聖書的比喩を説明語に置き換えず、原文の象徴性と相互参照性を保った。
- source_word: πλὴν
  choice: しかし
  rationale: 最初の願いから父の意志への服従へ転じる強い対照を、簡潔で現代的な接続語で示した。
- source_word: μὴ τὸ θέλημά μου ἀλλὰ τὸ σὸν
  choice: 私の意志ではなく、あなたの意志が
  rationale: θέλημα の名詞表現と「私の／あなたの」という対照を明示し、両者の区別を弱めずに保った。
- source_word: γινέσθω
  choice: 実現しますように
  rationale: γίνομαι の三人称命令形が、父の意志が成るようにとの祈願を表すため、「実現する」を用いて自然な祈願文にした。
theological_decisions:
- issue: イエスの意志と父の意志との関係
  choice: 「私の意志ではなく、あなたの意志が実現しますように」と、両者の対照と服従をそのまま訳す。
  alternative: 「私が望むことではなく、あなたがお望みになることが実現しますように」
  rationale: 原文はイエス自身の意志と父の意志を区別しつつ、父の意志への服従を示す。後代の教理的説明を加えたり緊張を和らげたりせず、その対照を保持した。
- issue: 「杯」の比喩的意味
  choice: 本文では「杯」を保持する。
  alternative: 「この苦しみ」または「この試練」
  rationale: 本文中で苦難や裁きと説明してしまうと、原文の比喩と聖書全体における響きを狭めるため、解釈を本文に織り込まなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りとしての厳粛さを保った。「御心」は自然な宗教語だが、原文の「私の意志／あなたの意志」という明示的な対照を見えにくくし得るため避けた。
