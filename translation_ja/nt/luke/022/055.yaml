  yaml_path: translation/nt/luke/022/055.yaml
  text: And after they had kindled a fire in the middle of the courtyard and sat down together[a], Peter was sitting among them.
translation:
  language: ja
  text: 人々が中庭の中央に火をたき、一緒に座ったあと、ペテロは彼らの中に座っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ペテロは彼らの中に座った」とも訳せる。ギリシア語の未完了過去形は、ペテロが座っていた場面を描写している。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιαψάντων
  choice: 火をたき
  rationale: アオリスト能動分詞で、主動詞に先立つ状況を示す。日本語では「火をたく」が自然で、火を起こしたことを明確に表す。
- source_word: πῦρ
  choice: 火
  rationale: 文脈上、中庭で起こされた具体的な火を指す。日本語では冠詞に相当する語を補わず「火」とするのが自然。
- source_word: ἐν μέσῳ τῆς αὐλῆς
  choice: 中庭の中央で
  rationale: 具体的な空間的位置を簡潔かつ明瞭に表す。αὐλήは大祭司の邸宅の中庭を指す。
- source_word: συγκαθισάντων
  choice: 一緒に座ると
  rationale: アオリスト能動分詞で、σύνの共同性を「一緒に」によって保つ。二つの属格絶対を日本語として自然な連続動作にまとめた。
- source_word: ἐκάθητο
  choice: 座っていた
  rationale: 未完了過去の継続的な場面描写を日本語の「ていた」で表す。
- source_word: μέσος αὐτῶν
  choice: 彼らの中に
  rationale: ペテロがその集団のただ中に位置していたことを、自然な現代日本語で表す。
- source_word: δὲ
  choice: （明示せず）
  rationale: 弱い物語接続辞であり、日本語では文脈上ゼロ接続が自然。意味上の展開は語順と文の継続で十分に示される。
