base_translation:
  language: en
  yaml_path: translation/nt/luke/022/046.yaml
  text: And he said to them, “Why are you sleeping? Get up and pray, so that you may not enter into temptation.”
translation:
  language: ja
  text: そして彼らに言われた。「なぜ眠っているのですか。起きて祈りなさい。試みに陥らないように。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθεύδετε
  choice: 眠っている
  rationale: 現在形の問いを、自然な現代日本語でそのまま表した。
- source_word: ἀναστάντες
  choice: 起きて
  rationale: 分詞の命令的な働きを保ちつつ、文脈に合う平明な表現とした。
- source_word: προσεύχεσθε
  choice: 祈っていなさい
  rationale: 現在命令形が示す継続的な行為への促しを表した。
- source_word: πειρασμόν
  choice: 試み
  rationale: 誘惑だけでなく試練をも含み得る語の幅を保つため、「試み」とした。
- source_word: εἰσέλθητε εἰς
  choice: 陥らない
  rationale: 直訳は「入らない」だが、日本語では試みの支配下に入る意味を自然に伝える「陥る」を用いた。
theological_decisions:
- issue: πειρασμόςの意味範囲
  choice: 試み
  alternative: 誘惑
  rationale: 罪への誘惑に限定せず、試練・試みを含む原語の曖昧さを保持した。
- issue: ἵνα節の関係
  choice: 試みに陥らないためです
  alternative: 試みに陥らないように
  rationale: 祈る目的を明確にしながら、祈りと試みを免れることの関係について本文以上の説明を加えなかった。
