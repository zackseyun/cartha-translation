  text: ἵνα ⸀ἔσθητε καὶ πίνητε ἐπὶ τῆς τραπέζης μου ⸂ἐν τῇ βασιλείᾳ μου⸃, καὶ ⸀καθήσεσθε ἐπὶ θρόνων ⸂τὰς δώδεκα φυλὰς κρίνοντες⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/030.yaml
  text: so that you may eat and drink at my table in my kingdom[a], and you will sit on thrones judging the twelve tribes of Israel.
translation:
  language: ja
  text: それは、あなたがたがわたしの王国で、わたしの食卓に着いて食べ、飲むためである。そしてあなたがたは王座に座り、イスラエルの十二部族を裁く[a]ことになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルの十二部族を治める」または「イスラエルの十二部族を統治する」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: それは……ためである
  rationale: 前節から続く目的・結果を表す接続を保ちつつ、現代日本語として明瞭な形にした。
- source_word: ἔσθητε καὶ πίνητε
  choice: 食べたり飲んだりする
  rationale: 二つの行為がともにἵναの支配下にあることを自然な日本語で示した。
- source_word: ἐπὶ τῆς τραπέζης μου
  choice: わたしの食卓に着いて
  rationale: 食卓を囲む交わりを表す日本語の慣用表現であり、場所関係も明確に伝える。
- source_word: ἐν τῇ βασιλείᾳ μου
  choice: わたしの王国で
  rationale: 宴席と王座という文脈に合う領域的意味を中心に訳しつつ、王としての支配という含意も失わない。
- source_word: καθήσεσθε ἐπὶ θρόνων
  choice: 王座に座り……ことになる
  rationale: 未来形を明示し、王権・司法権を象徴する王座のイメージを保持した。
- source_word: κρίνοντες
  choice: 裁く
  rationale: κρίνωの最も直接的な司法的意味を採り、統治の含意へ一義的に限定しなかった。
- source_word: τὰς δώδεκα φυλὰς τοῦ Ἰσραήλ
  choice: イスラエルの十二部族
  rationale: 原文の契約共同体への言及を標準的かつ透明に表した。
theological_decisions:
- issue: 弟子たちがイスラエルの十二部族をκρίνωする将来の役割の性質
  choice: 本文では「裁く」とし、司法的表現を保持する。
  alternative: 「治める」または「統治する」
  rationale: κρίνωには司法と統治の両方に関わる語義の幅があるため、最も直接的な訳を本文に置き、別の可能性を脚注に残して神学的緊張を解消しないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「食卓に着く」により宴席での交わりを自然に表し、「王国」「王座」「裁く」によって原文の王権・司法のイメージを保った。
