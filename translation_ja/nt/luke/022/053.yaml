id: LUK.22.53
reference: Luke 22:53
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθ’ ἡμέραν ὄντος μου μεθ’ ὑμῶν ἐν τῷ ἱερῷ οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ· ἀλλ’ αὕτη ⸂ἐστὶν ὑμῶν⸃ ἡ ὥρα καὶ ἡ ἐξουσία τοῦ σκότους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/053.yaml
  text: Day after day[a], while I was with you in the temple, you did not lay hands on me. But this is your hour[b], and the authority of darkness.
translation:
  language: ja
  text: 私が毎日、神殿であなたがたと一緒にいた時、あなたがたは私を捕らえなかった[a]。しかし、今はあなたがたの時であり、闇が支配する時である[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私に向かって手を伸ばさなかった」。ここでは、敵対的に手を出して捕らえることを指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「闇の権威」。または「闇の力」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: 毎日
  rationale: 日ごとの反復を表す自然で明瞭な現代日本語。
- source_word: ὄντος μου μεθ’ ὑμῶν
  choice: 私が……あなたがたと一緒にいた時には
  rationale: 属格独立構文の時間的・状況的な働きを、日本語の自然な従属節で表した。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόνは内陣だけでなく神殿域を指すが、日本語では文脈上「神殿」で明瞭に伝わる。
- source_word: οὐκ ἐξετείνατε τὰς χεῖρας ἐπ’ ἐμέ
  choice: 私に手をかけなかった
  rationale: 直訳は「私に向かって手を伸ばさなかった」だが、ここでは敵対的に手を出して捕らえる行為を指す。「手をかける」は逮捕の文脈を保ちつつ過度に限定しない。
- source_word: ἀλλ’ αὕτη ἐστὶν ὑμῶν ἡ ὥρα
  choice: しかし、今はあなたがたの時
  rationale: αὕτηの現在的な指示を「今」で自然に表し、ὥραが単なる時刻でなく彼らに許された決定的な時を指すという含みを「あなたがたの時」に残した。
- source_word: ἐξουσία τοῦ σκότους
  choice: 闇の権威
  rationale: ἐξουσίαの中心的な意味である権威・行使権を保ち、「闇」という原文の人格化された比喩を解釈的に言い換えなかった。
theological_decisions:
- issue: 「闇の権威」がサタンまたは悪の支配を明示するか
  choice: 「闇の権威」として原文の比喩を保持する。
  alternative: 「サタンの権威」「悪の支配」と明示する。
  rationale: 原文はサタンを直接名指しせず「闇」と述べるため、その霊的・神学的含みを保ち、特定の解釈で限定しない。
- issue: 「あなたがたの時」と「闇の権威」の関係
  choice: 「あなたがたの時、闇の権威の時」と並置する。
  alternative: 「あなたがたが闇の権威を振るう時」と一体化して解釈する。
  rationale: 原文のκαίによる並置と、両者の密接だが明示され切らない関係を保持するため。
translation_notes:
  register: 明瞭で現代的ながら、受難場面の厳粛さを保つ文体とした。「手をかける」は口語的すぎず、原文の身体的比喩と逮捕の含意をともに伝える。「闇の権威」は解釈的な説明を加えず、原文の神学的緊張を残した。
