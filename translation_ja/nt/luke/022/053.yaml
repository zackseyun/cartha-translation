  source_fidelity: 「毎日」「神殿で」「あなたがたと一緒にいた」は原文を適切に反映している。一方、「闇の権威の時」は、ἐξουσία（権威・支配）を単に「時」の修飾語として読ませやすく、二つ目の並置項の意味が不明瞭になる。「闇の支配」とすることで、闇に属する／闇による支配という原文の比喩的表現を自然な日本語で保てる。
  naturalness: 「私に手をかけなかった」は逮捕の意味にもなり得るが、現代日本語では傷害・殺害の含意も強い。「私を捕らえなかった」は当該場面で明確かつ自然であり、身体的な慣用表現の直訳は注で保持できる。末尾は「闇が支配する時」として、厳粛さを損なわず自然に整える。
  terminology: ἐξουσίαはここで「権威」とも訳せるが、日本語では「闇の権威」より「闇の支配」のほうが、闇の比喩性を保ちつつ作用・勢力の意味を明瞭に伝える。サタンや悪を本文で明示しない方針は維持する。
