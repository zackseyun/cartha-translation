revisions:
- from: 私が毎日、神殿であなたがたと一緒にいた時には、あなたがたは私に手をかけなかった[a]。しかし、今はあなたがたの時、闇の権威[b]の時である。
  to: 私が毎日、神殿であなたがたと一緒にいた時、あなたがたは私を捕らえなかった[a]。しかし、今はあなたがたの時であり、闇が支配する時である[b]。
  rationale: 逮捕場面における慣用句を本文で明瞭にし、その字義的表現は注で保存した。結びは、原文の「あなたがたの時」と「闇の権威」の並置および闇の比喩性を損なわず、明瞭な現代標準日本語となるよう「闇が支配する時」とした。
