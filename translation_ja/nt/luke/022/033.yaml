source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Κύριε, μετὰ σοῦ ἕτοιμός εἰμι καὶ εἰς φυλακὴν καὶ εἰς θάνατον πορεύεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/033.yaml
  text: But he said to him, “Lord, I am ready to go with you both to prison and to death.”
translation:
  language: ja
  text: しかし、ペトロはイエスに言った。「主よ、私はあなたと一緒に、牢獄にも死にも行く覚悟ができています。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: しかし、ペトロは
  rationale: 定冠詞は代名詞的に直前のペトロを指し、δέはイエスの先の言葉に対する軽い対比を示す。日本語では指示対象を明示したほうが自然である。
- source_word: εἶπεν αὐτῷ
  choice: イエスに言った
  rationale: αὐτῷの指示対象は文脈上イエスであり、日本語では「彼に」より明示するほうが明瞭で自然である。
- source_word: Κύριε
  choice: 主よ
  rationale: 呼格としての直接の呼びかけを示し、κύριοςが持つ敬意と称号としての含みを保つ。
- source_word: μετὰ σοῦ
  choice: あなたと一緒なら
  rationale: μετά＋属格の同行を自然な日本語で表す。「なら」はペトロが主との同行を前提に覚悟を表明する文のつながりを明瞭にする。
- source_word: ἕτοιμός εἰμι
  choice: 覚悟ができています
  rationale: 単なる準備完了ではなく、投獄や死を受け入れる意志を表す文脈に即して、現代日本語で自然に表現する。
- source_word: καὶ εἰς φυλακὴν καὶ εἰς θάνατον
  choice: 牢獄にも死にも
  rationale: 対応する二つのκαίを「にも…にも」で表し、二つの行き先を並列かつ強調している構造を保つ。
- source_word: φυλακή
  choice: 牢獄
  rationale: ここでは拘禁される場所または状態を指す。「牢獄」は「死」と並ぶ重大な行き先として簡潔で格調も保つ。
- source_word: πορεύεσθαι
  choice: 行く
  rationale: ἕτοιμός εἰμιを補う不定詞であり、投獄と死に至る道を共に進む意志を表す。日本語では「行く」が最も自然である。
theological_decisions:
- issue: イエスへの称号κύριοςの訳
  choice: 主
  alternative: 先生
  rationale: 「主」は直接呼称としての敬意とキリスト論的な響きの双方を保持する。「先生」では称号の意味を狭める可能性がある。
- issue: ペトロの自己表明におけるἕτοιμοςの意味
  choice: 覚悟ができています
  alternative: 用意ができています
  rationale: 投獄と死を受け入れる意志を表すため、「覚悟」が文脈に適する。ただし、実際にその覚悟を果たせるとの評価を訳文に加えず、ペトロ自身の強い主張として保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、直接話法の厳粛さを保った。「牢獄にも死にも行く」という原文の方向表現と並列を維持し、過度な説明は加えていない。
