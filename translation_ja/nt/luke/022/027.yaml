  terminology: ἀνακείμενοςを本文で「食卓に着いている者」とし、古代の横臥による食事習慣を脚注で補う方針は妥当です。διακονῶνを一貫して「仕える者」とすることも、δοῦλοςの身分概念を持ち込まず、原文の分詞的・行為的表現を保っています。
