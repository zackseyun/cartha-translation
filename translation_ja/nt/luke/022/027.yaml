- from: 食卓に着いている者と、仕える者では、どちらが偉いでしょうか。[a] 食卓に着いている者ではありませんか。しかし、わたしは、仕える者としてあなたがたの間にいます。
  to: というのは、食卓に着いている者と仕える者では、どちらが上でしょうか。[a] 食卓に着いている者ではありませんか。しかし、わたしは、仕える者としてあなたがたの間にいます。
  rationale: μείζωνを「上」として食事の場における通常の地位の比較を明瞭にし、γάρを「というのは」で反映した。脚注は古代の宴席の横臥習慣をより正確な「横たわって」として補った。ほかは原文の反復と対照を保つ既訳を維持した。
