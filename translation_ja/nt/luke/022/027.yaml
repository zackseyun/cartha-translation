id: LUK.22.27
reference: Luke 22:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς γὰρ μείζων, ὁ ἀνακείμενος ἢ ὁ διακονῶν; οὐχὶ ὁ ἀνακείμενος; ἐγὼ δὲ ⸂ἐν μέσῳ ὑμῶν εἰμι⸃ ὡς ὁ διακονῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/027.yaml
  text: For who is greater[a], the one reclining at the table or the one serving? Is it not the one reclining at the table? But I am among you as one who serves.
translation:
  language: ja
  text: というのは、食卓に着いている者と仕える者では、どちらが上でしょうか。[a] 食卓に着いている者ではありませんか。しかし、わたしは、仕える者としてあなたがたの間にいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食卓に着いている者」は、より直訳的には「横になっている者」。当時の宴席では、客は横たわって食事をし、給仕する者がそばで仕えた。
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: どちら
  rationale: 二者を比較する疑問代名詞であり、日本語では「誰」より「どちら」が自然に対比を表す。
- source_word: γὰρ
  choice: （独立した訳語を置かず、問いの説明的な流れで表現）
  rationale: 直前の発言を根拠づける接続辞。日本語で「というのは」を明示すると重くなりやすいため、文脈上の説明関係として保った。
- source_word: μείζων
  choice: 偉い
  rationale: ここでは社会的な地位や重要性の高さを表す。「偉い」は平易で、比較の意味を過度に限定しない。
- source_word: ὁ ἀνακείμενος
  choice: 食卓に着いている者
  rationale: 食事の席で横になっている客を指す。当時の姿勢を本文で逐語的に表すより、現代日本語で役割が分かる表現とし、文化的背景は脚注で示した。
- source_word: ὁ διακονῶν
  choice: 仕える者
  rationale: 食事の場で給仕する者との対比を含みつつ、同じ語で語られるイエスの自己描写にも自然に通じる。「奉仕者」のような教会用語化を避けた。
- source_word: οὐχί
  choice: ではありませんか
  rationale: 肯定の答えを予期する修辞疑問を、明瞭な現代日本語で再現した。
- source_word: ἐγὼ δὲ
  choice: しかし、わたしは
  rationale: 通常の社会的序列とイエスのあり方との対照を明示する。
- source_word: ἐν μέσῳ ὑμῶν εἰμι
  choice: あなたがたの間にいます
  rationale: 集団のただ中にいることを表す慣用句を、自然で格調を損なわない日本語にした。
- source_word: ὡς ὁ διακονῶν
  choice: 仕える者として
  rationale: ὡςの様態・比較の意味を保ち、イエスが自らを「奴隷」という名詞で呼んでいるかのようには訳さない。
theological_decisions:
- issue: イエスの自己描写における奉仕の表現
  choice: 仕える者としてあなたがたの間にいます
  alternative: 僕としてあなたがたの間にいます
  rationale: 原文は名詞 δοῦλος（奴隷、僕）ではなく、動詞 διακονέω の分詞を用いる。したがって、行為と役割を表す「仕える者」とし、奴隷身分の意味を本文へ持ち込まない。同時に、前半と同じ語を反復して食卓の対比との結びつきを保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「者」「仕える」によって聖書本文にふさわしい品位を保った。宴席で横になる古代の習慣は本文では自然な日本語に置き換え、脚注で補足した。
