id: LUK.22.64
reference: Luke 22:64
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ περικαλύψαντες ⸂αὐτὸν ἐπηρώτων⸃ λέγοντες· Προφήτευσον, τίς ἐστιν ὁ παίσας σε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/064.yaml
  text: And after covering him[a], they kept asking, saying, “Prophesy! Who is the one who struck you?”
translation:
  language: ja
  text: そして、人々はイエスに覆いをかけ[a]、繰り返しこう尋ねた。「預言せよ。あなたを殴ったのは誰だ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「目隠しをして」。
    reason: lexical_alternative
lexical_decisions:
- source_word: περικαλύψαντες
  choice: 覆いをかけ
  rationale: 動詞の基本的な意味である「覆う、覆い隠す」を保ち、文脈上あり得る目隠しという具体的解釈は本文で断定せず脚注に示した。
- source_word: ἐπηρώτων
  choice: 繰り返しこう尋ねた
  rationale: 未完了過去が表す継続的・反復的な問いかけを、自然な現代日本語で示した。
- source_word: λέγοντες
  choice: こう尋ねた
  rationale: 発言内容を導く分詞を、日本語では引用へ自然につながる形に統合した。
- source_word: Προφήτευσον
  choice: 預言せよ
  rationale: 命令形を直接的に訳し、語り手が説明を加えなくても文脈から伝わる嘲りの響きを保った。
- source_word: τίς ἐστιν ὁ παίσας σε
  choice: あなたを殴ったのは誰だ
  rationale: 冠詞付き分詞の実体詞的用法を自然な焦点構文で表し、παίωの打撃の意味を「殴った」で伝えた。
theological_decisions:
- issue: イエスが目隠しされたことを本文で明示するか
  choice: 本文では広い意味の「覆いをかけ」とする
  alternative: 「目隠しをして」とする
  rationale: 文脈は視界を遮ったことを強く示唆するが、ギリシア語の動詞自体はより広く「覆う、覆い隠す」を意味するため、具体化しすぎず、一般的な解釈は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。命令は簡潔な「預言せよ」とし、嘲弄性を過度な乱暴語で補わない。反復動作は「繰り返し」で明示した。
