source:
  edition: SBLGNT
  text: λέγοντες· Εἰ σὺ εἶ ὁ χριστός, εἰπὸν ἡμῖν. εἶπεν δὲ αὐτοῖς· Ἐὰν ὑμῖν εἴπω οὐ μὴ πιστεύσητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/067.yaml
  text: saying[a], “If you are the Messiah, tell us.” But he said to them, “If I tell you, you will certainly not believe;”
translation:
  language: ja
  text: 彼らは言った。「もしあなたがメシア[a]なら、私たちに言え。」しかし、イエスは彼らに言った。「もし私があなたがたに言っても、あなたがたは決して信じない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。
    reason: 同じ称号Χριστόςの伝統的な訳語を示すため。
lexical_decisions:
- source_word: λέγοντες
  choice: こう言った
  rationale: 前節から続く分詞で、議員たちの発言内容を導入する。日本語では主動詞的に訳すことで、文脈とのつながりを保ちつつ自然にした。
- source_word: Εἰ σὺ εἶ
  choice: もしあなたが…なら
  rationale: ギリシア語の明示的な条件文を疑問文に言い換えず、その挑戦的な言い方を保った。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ユダヤ人の待望に結びつく称号として用いられているため、その歴史的・文脈的意味が伝わる「メシア」とした。
- source_word: εἰπὸν ἡμῖν
  choice: 私たちに言いなさい
  rationale: 命令形の力と与格の対象を明示しつつ、現代日本語として簡潔に訳した。
- source_word: εἶπεν δὲ αὐτοῖς
  choice: しかし、イエスは彼らに言った
  rationale: δέの穏やかな対照を「しかし」で示した。ギリシア語では省略されている主語を、引用話者が明確になるよう文脈から「イエス」と補った。
- source_word: Ἐὰν ὑμῖν εἴπω
  choice: 私が言っても
  rationale: 直訳的な「もし言うなら」より自然な譲歩条件として表し、語用上の意味を保った。
- source_word: οὐ μὴ πιστεύσητε
  choice: あなたがたは決して信じない
  rationale: οὐ μήと接続法による強い否定を「決して…ない」で明確に表した。
theological_decisions:
- issue: Χριστόςという称号の訳
  choice: メシア
  alternative: キリスト
  rationale: この尋問ではユダヤ的な王・救済者への期待を背景とする称号であり、「メシア」がその文脈を直接伝える。伝統的な「キリスト」も脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、議会側の挑戦的な命令と、イエスの応答にある強い否定を保った。前節から続く断片的な構文は、日本語で読める形に整えた。
