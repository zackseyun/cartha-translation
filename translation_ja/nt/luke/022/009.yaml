  text: 彼らはイエスに言った。「どこに用意してほしいのですか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「どこで私たちに用意してほしいのですか」。何を用意するかは原文で明示されていないが、前節の文脈では過越の食事を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: 彼らは
  rationale: 定冠詞が名詞的に用いられ、文脈上は弟子たちを指す。δέは弱い接続であり、日本語では明示しないほうが自然である。
- source_word: εἶπαν αὐτῷ
  choice: イエスに言った
  rationale: εἶπανは基本義に沿って「言った」とし、αὐτῷの指示対象であるイエスを文脈に即して明示した。発話内容は疑問文だが、「尋ねた」として語義を狭めなかった。
- source_word: Ποῦ
  choice: どこに
  rationale: 用意する場所を尋ねる疑問副詞。日本語では、過越の食事を整える場所を求める表現として「どこに」が自然である。
- source_word: θέλεις ἑτοιμάσωμεν
  choice: 用意すればよいでしょうか
  rationale: θέλειςと一人称複数接続法の組み合わせを、相手の意向を丁寧に尋ねる自然な現代日本語で表した。「私たち」は動詞表現から明らかなため省略し、目的語も原文どおり明示せず、文脈に委ねた。
