source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Λέγω σοι, Πέτρε, οὐ ⸀φωνήσει σήμερον ἀλέκτωρ ⸀ἕως τρίς ⸂με ἀπαρνήσῃ εἰδέναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/034.yaml
  text: But he said[a], “I tell you, Peter, a rooster will not crow today until you deny three times that you know me.”
translation:
  language: ja
  text: しかし、イエスは言った。「ペトロ、あなたに言っておく。今日、あなたが私を知っていることを三度否定するまでは、雄鶏は鳴かない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ εἶπεν
  choice: しかし、イエスは言った
  rationale: δέの穏やかな対照を「しかし」で示した。日本語では話者を明確にするため、文脈上の主語を「イエス」と補った。
- source_word: Λέγω σοι
  choice: あなたに言っておく
  rationale: 現在形の直接的で確言的な発話を、自然な現代日本語の定型表現で表した。
- source_word: Πέτρε
  choice: ペトロ
  rationale: 人名Πέτροςを一般的な聖書表記に従って音写した。
- source_word: οὐ φωνήσει σήμερον ἀλέκτωρ
  choice: 今日、鶏は鳴かない
  rationale: ἀλέκτωρを自然な総称的日本語「鶏」で、φωνήσειを文脈に即して「鳴く」と訳した。σήμερονは「今日」とした。
- source_word: ἕως
  choice: までは
  rationale: 否定された主節の成立する時間的限界を示す構文を保った。
- source_word: τρίς
  choice: 三度
  rationale: 簡潔で品位があり、現代日本語でも明瞭な回数表現とした。
- source_word: με ἀπαρνήσῃ εἰδέναι
  choice: 私を知らないと言う
  rationale: εἰδέναιを省かず、否認の内容がイエスを知っていることの否定であると明確にした。「否む」などの硬い表現より、実際の発言内容を自然に伝える。
theological_decisions:
- issue: ペトロの否認の内容
  choice: 「私を知らないと言う」と訳し、イエスとの面識を否定する予告として示す。
  alternative: 「私を三度否む」「私を知っていることを三度否定する」
  rationale: ギリシア語にはεἰδέναι（知っている）が明記されているため、省略せずに反映した。一方、忠誠の全面的放棄など、本文を越えた意味は加えない。
- issue: ἕωςを伴う否定文の時間関係
  choice: 「……までは、鶏は鳴かない」として原文の構文を保つ。
  alternative: 「鶏が鳴く前に、あなたは……」
  rationale: 両者は文脈上ほぼ同じ時系列を示すが、本文の否定主節とἕως節の形を保つ訳を本文に採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら厳粛さを保った。「三度」「言っておく」により簡潔で dignified な調子とした。
