  text: Καὶ οἱ ἄνδρες οἱ συνέχοντες ⸀αὐτὸν ἐνέπαιζον αὐτῷ δέροντες,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/063.yaml
  text: And the men who were holding him mocked him while beating him,[a]
translation:
  language: ja
  text: イエスを拘束していた男たちは、殴りながらイエスをあざけった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスを監視下に置いていた男たちは」。
    reason: συνέχωは、この文脈で身柄を押さえることや監視下に置くことを表し得るため。
lexical_decisions:
- source_word: συνέχοντες
  choice: 拘束していた
  rationale: ここでは、イエスを物理的に押さえ、その身柄を確保していたことを表す。「拘束していた」は、正式な投獄まで含意せず、文脈に即して自然である。
- source_word: ἐνέπαιζον
  choice: あざけった
  rationale: 敵意と侮辱を伴う嘲弄を簡潔に表し、受難の文脈にも適合する。
- source_word: αὐτῷ
  choice: イエスを
  rationale: 日本語では対象を明示するのが自然であり、直前の代名詞が指す人物を明確にするため固有名を補った。
- source_word: δέροντες
  choice: 殴りながら
  rationale: 継続的または反復的な打撃が、あざけりに伴って行われたことを分詞の関係に即して表す。「むち打つ」と限定する根拠はない。
- source_word: ἄνδρες
  choice: 男たち
  rationale: 原文は役職を示す「番兵」や「兵士」ではなく、一般的な「男たち」と述べているため、その範囲を狭めない。
- source_word: Καὶ
  choice: （独立した接続語を置かず）
  rationale: 日本語の物語文では、節冒頭の単純な接続辞を明示しなくても前後の連続性が自然に伝わる。
theological_decisions:
- issue: イエスを虐待した者たちの特定
  choice: イエスを拘束していた男たち
  alternative: イエスを見張っていた番兵たち
  rationale: 周辺文脈から拘禁担当者と推測できるが、原文は一般語ἄνδρεςを用いるため、役職を付加せず曖昧さを保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、受難記事にふさわしい簡潔で厳粛な調子を保った。「男たち」を維持し、原文にない役職名は補っていない。
