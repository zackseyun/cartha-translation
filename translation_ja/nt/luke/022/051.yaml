  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ἐᾶτε ἕως τούτου· καὶ ἁψάμενος τοῦ ⸀ὠτίου ἰάσατο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/051.yaml
  text: But Jesus answered, “Enough of this!” And he touched his ear and healed him.
translation:
  language: ja
  text: しかし、イエスは答えられた。「もう、それでよい。」[a] そして、その人の耳に触れ、彼を癒やされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は直訳すると「ここまで、そのままにしておきなさい」のような省略的な表現。この場での行為をやめさせる制止（「もう十分だ」）と理解されることが多いが、イエスが何かをさせるために、そのままにするよう求めた言葉と理解することもできる。
    reason: Ἐᾶτε ἕως τούτου は目的語や具体的な指示対象を明示しないため、本文を簡潔に保ちつつ、構文と解釈上の曖昧さを示す。
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 答えられた
  rationale: 直訳的には「答えて言った」だが、現代日本語では重複感があるため、応答を表す自然な表現とした。
- source_word: Ἐᾶτε ἕως τούτου
  choice: もうよい。そこまでにしなさい
  rationale: 複数への命令として弟子たちの行為を制止する意味を自然に表した。ただし、ギリシア語は省略的で複数の解釈が可能なため、脚注でその曖昧さを示した。
- source_word: ἁψάμενος τοῦ ὠτίου
  choice: その人の耳に触れ
  rationale: ὠτίονは「耳」を意味する指小形。文脈上、大祭司のしもべの耳を指すので、日本語では「その人の耳」と明示した。
- source_word: ἰάσατο αὐτόν
  choice: 彼を癒やされた
  rationale: 目的語αὐτόνは男性単数で、耳ではなく負傷した人を指す。「治した」よりも、イエスによる癒やしというルカの語調に合う「癒やす」を採用した。
theological_decisions:
- issue: Ἐᾶτε ἕως τούτου の省略的表現が指す内容
  choice: 弟子たちの暴力を「もうよい。そこまでにしなさい」と制止する発言として本文に訳した
  alternative: 「このことを許しなさい」「今しばらく、そのままにしておきなさい」と、イエスが耳を癒やすための猶予を求めた発言と取る
  rationale: 直前の剣による攻撃への応答として制止の解釈が自然であり、英語POBとも整合する。一方、原文だけでは目的語や具体的な指示対象が明示されないため、別解を排除せず脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、イエスへの敬意を表す自然な尊敬表現とした。「しなさい」は複数の弟子たちに向けられた命令を日本語として簡潔に伝える。
