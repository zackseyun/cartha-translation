  text: ὁ δὲ ⸀ἠρνήσατο λέγων· ⸂Οὐκ οἶδα αὐτόν, γύναι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/057.yaml
  text: But he denied it[a], saying, “I do not know him[b], woman.”
translation:
  language: ja
  text: しかし、ペトロは否定して言った。「あなた[a]、私はあの人を知りません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は女性への呼びかけで、直訳すれば「女よ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρνήσατο
  choice: 否定して
  rationale: 目的語は原文に明示されていないため、「そのことを」や「彼を」を補わず、直前の女性の発言を否定したという文脈を保つ。
- source_word: λέγων
  choice: 言った
  rationale: 分詞が否定の内容を導く働きを、自然な現代日本語の連用表現「否定して言った」で表した。
- source_word: Οὐκ οἶδα
  choice: 私は…知りません
  rationale: 否定された知識を率直に表し、場面にふさわしい丁寧体とした。
- source_word: αὐτόν
  choice: あの人を
  rationale: 指示対象であるイエスを明示しすぎず、男性単数代名詞を自然な日本語にした。「彼を」より会話として自然である。
- source_word: γύναι
  choice: 女の方
  rationale: 女性への直接の呼びかけであることを保ちつつ、「女よ」の不自然さや現代日本語での過度な粗さを避けた。
theological_decisions:
- issue: ペトロが何を否定したのか
  choice: 目的語を補わず「否定して」とした
  alternative: 「そのことを否定して」または「イエスを否定して」
  rationale: ギリシア語のἠρνήσατοには明示的な目的語がない。「イエスを」とすると、直前の主張を否定したという構文以上の意味を確定させるため避けた。日本語では目的語なしでも自然に成立する。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。会話部分は丁寧体とし、γύναιは直接呼称であることを「女の方」で示した。
