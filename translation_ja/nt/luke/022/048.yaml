  text: ⸂Ἰησοῦς δὲ⸃ εἶπεν αὐτῷ· Ἰούδα, φιλήματι τὸν υἱὸν τοῦ ἀνθρώπου παραδίδως;
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/048.yaml
  text: But Jesus said to him[a], “Judas, are you betraying the Son of Man with a kiss?”
translation:
  language: ja
  text: しかし、イエスは彼に言った。「ユダ、口づけで人の子を裏切るのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「口づけで人の子を引き渡すのか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 弱い接続辞だが、ユダの行為に対するイエスの応答という文脈上の対照を自然に示す。
- source_word: εἶπεν αὐτῷ
  choice: 彼に言われた
  rationale: 与格代名詞αὐτῷを明示しつつ、イエスの発言を現代日本語として自然で品位ある敬語にした。
- source_word: Ἰούδα
  choice: ユダ
  rationale: 呼格の固有名を、日本語聖書で定着した表記に従って音写した。
- source_word: φιλήματι
  choice: 口づけで
  rationale: 手段を表す与格を「で」で示し、具体的な行為を簡潔に保持した。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの定着した自己呼称として、ギリシア語の構造とダニエル書を背景とする含意を保つ。
- source_word: παραδίδως
  choice: 裏切るのか
  rationale: 現在形二人称単数の修辞的疑問を自然な日本語にし、この文脈での敵対的な引き渡しの意味を表した。字義的には「引き渡す」も可能なので脚注に示した。
theological_decisions:
- issue: τὸν υἱὸν τοῦ ἀνθρώπουの訳
  choice: 人の子
  alternative: 人間である者
  rationale: イエスのキリスト論的な自己呼称と、その伝統的・聖書間テキスト的な響きを保ち、一般的な人間という意味に限定しないため。
- issue: παραδίδωςの文脈的意味
  choice: 裏切る
  alternative: 引き渡す
  rationale: 逮捕の手引きをする場面では「裏切る」が自然だが、語そのものの中心的意味である「引き渡す」も保持すべきため、脚注で併記した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、発話には簡潔で厳粛な調子を保った。「口づけ」は「キス」よりも本文の品位と聖書的文体に適し、なお一般読者にも理解できる。
