id: LUK.22.66
reference: Luke 22:66
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐγένετο ἡμέρα, συνήχθη τὸ πρεσβυτέριον τοῦ λαοῦ, ἀρχιερεῖς ⸀τε καὶ γραμματεῖς, καὶ ⸀ἀπήγαγον αὐτὸν εἰς τὸ συνέδριον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/066.yaml
  text: And when day came[a], the council of the elders of the people gathered together, both chief priests and scribes, and they led him away into their Sanhedrin[b],
translation:
  language: ja
  text: 夜が明けると[a]、民の長老会、すなわち祭司長たちと律法学者たちが集まり、イエスを彼らの議会に連れて行った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「日となった時」。または「夜明けに」。
    reason: lexical_alternative
  - marker: b
    text: 「彼らの最高法院へ」、または「彼らの議会の前へ」とも訳せる。ギリシア語の συνέδριον は、議会という機関、その正式な会合、または会議の場を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἐγένετο ἡμέρα
  choice: 夜が明けると
  rationale: 「日となった時」という時間表現を、夜明けを示す自然な現代日本語で表した。動作の開始時点を明確にしつつ、特定の時刻までは限定しない。
- source_word: συνήχθη
  choice: 集まり
  rationale: 受動形の集合の意味を、日本語として自然な自動詞表現で示した。「招集された」とすると、招集者や公式な招集行為を本文以上に強調するため避けた。
- source_word: τὸ πρεσβυτέριον τοῦ λαοῦ
  choice: 民の長老会
  rationale: 個々の長老ではなく、長老から成る団体を指す語であるため、「長老会」とした。「民の」により τοῦ λαοῦ も保持した。
- source_word: ἀρχιερεῖς τε καὶ γραμματεῖς
  choice: すなわち祭司長たちと律法学者たち
  rationale: 祭司長と律法学者が長老会を具体化する同格的な関係を、自然な日本語で明示した。τε καί による両群の併記は「と」で保持した。
- source_word: ἀπήγαγον αὐτόν
  choice: イエスを…連れて行った
  rationale: ἀπάγω の方向性を「連れて行った」で表した。日本語では代名詞のままより指示対象を「イエス」と明示する方が明瞭であり、暴力性を不必要に加えていない。
- source_word: εἰς τὸ συνέδριον αὐτῶν
  choice: 彼らの議会へ
  rationale: συνέδριον が統治機関、その正式な会議、または会議の場を指し得る曖昧さを残すため、固有の制度名「最高法院」に限定せず「議会」とした。εἰς の方向性は「へ」で保持した。
theological_decisions:
- issue: ユダヤ人指導機関を表す二つの語 πρεσβυτέριον と συνέδριον の訳し分け
  choice: 前者を「長老会」、後者を「議会」とする
  alternative: 両方を「議会」とする、または συνέδριον を「最高法院（サンヘドリン）」とする
  rationale: 原文の語彙上の違いを保ち、後者が機関そのものか正式な会合・その場かという解釈を本文で一つに固定しないため。特定の制度理解や固有名称を必要以上に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「祭司長」「律法学者」は一般読者にも比較的定着した聖書用語として用い、文の構造は簡潔にした。
