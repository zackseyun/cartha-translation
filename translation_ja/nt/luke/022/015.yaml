  text: καὶ εἶπεν πρὸς αὐτούς· Ἐπιθυμίᾳ ἐπεθύμησα τοῦτο τὸ πάσχα φαγεῖν μεθ’ ὑμῶν πρὸ τοῦ με παθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/015.yaml
  text: And he said to them[b][a], “I have earnestly desired to eat this Passover with you before I suffer.”
translation:
  language: ja
  text: そして、イエスは彼らに言われた。「わたしは、苦しみを受ける前に、あなたがたと一緒にこの過越の食事を食べることを、切に願っていました。[a][b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「願いをもって願った」。ギリシア語は同語根の語を重ねて、イエスの願いの強さを表しています。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は直訳すると「この過越」です。「過越」は祭りまたはその食事を指し得ますが、ここでは「食べる」とあるため、本文では「過越の食事」としました。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν πρὸς αὐτούς
  choice: そして、イエスは彼らに言われた
  rationale: καίによる物語のつながりを「そして」で示し、λέγω＋πρός＋対格を自然な「彼らに言われた」とした。日本語では主語を明示したほうが単独節として分かりやすいため、文脈上の話者であるイエスを補った。
- source_word: Ἐπιθυμίᾳ ἐπεθύμησα
  choice: 切に願っていました
  rationale: 同語根の名詞と動詞を重ねる強意表現である。逐語的な反復は日本語では不自然なため、「切に」によって願いの強さを保った。未完了的な願望の継続を自然に伝えるため「願っていました」とした。
- source_word: τοῦτο τὸ πάσχα
  choice: この過越
  rationale: πάσχαは過越の祭りにも過越の食事にもなり得る。ここではφαγεῖνにより食事が念頭にあるが、本文では「食事」を補わず、原文の表現と語義の幅を保った。
- source_word: φαγεῖν
  choice: 食べたい
  rationale: ἐπιθυμέωに伴う不定詞として、「食べることを願う」を現代日本語で自然な「食べたいと願う」と表した。
- source_word: μεθ’ ὑμῶν
  choice: あなたがたと一緒に
  rationale: 同伴を表すμετάを、明瞭で自然な現代日本語にした。
- source_word: πρὸ τοῦ με παθεῖν
  choice: わたしは、苦しみを受ける前に
  rationale: πρό＋冠詞付き不定詞が示す先行時を「前に」で表した。πάσχωはここで迫る受難を指すが、出来事を過度に特定せず「苦しみを受ける」とした。
theological_decisions:
- issue: τοῦτο τὸ πάσχαが指すもの
  choice: 本文では「この過越」とし、食事であることは動詞「食べる」と文脈に委ねる。
  alternative: 「この過越の食事」
  rationale: 食事を指す可能性は非常に高いが、πάσχα自体が祭りと食事の両方を表し得るため、本文で解釈を一つに固定しない。
- issue: Ἐπιθυμίᾳ ἐπεθύμησαの強意
  choice: 「切に願っていました」
  alternative: 「願いに願っていました」または「心から願っていました」
  rationale: イエスの強い願いを保ちつつ、同語反復をそのまま移して不自然な日本語にすることを避けた。強意以上の神学的意味は付加していない。
- issue: πάσχωの受難との関係
  choice: 「苦しみを受ける」
  alternative: 「受難する」または「死ぬ」
  rationale: 文脈上はイエスの受難を指すが、原語はより広く「苦しむ」を意味する。「死ぬ」と限定せず、原文の厳粛さと範囲を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの発言にふさわしい厳粛さを保った。「過越」は聖書用語として簡潔に保持し、必要な説明を脚注に置いた。
