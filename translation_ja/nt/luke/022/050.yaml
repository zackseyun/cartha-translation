  yaml_path: translation/nt/luke/022/050.yaml
  text: And one of them struck the high priest’s servant and cut off his right ear[a].
translation:
  language: ja
  text: 彼らのうちの一人が大祭司の奴隷[a]を打ち、その人の右耳を切り落とした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大祭司の使用人」とも訳せる。ギリシア語のドゥーロスは、文脈によって「奴隷」または「使用人」を指す。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπάταξεν
  choice: 打ち
  rationale: πατάσσωの力を伴う一撃を、簡潔で自然な現代日本語で表す。
- source_word: εἷς τις ἐξ αὐτῶν
  choice: 彼らのうちの一人
  rationale: 不定性と匿名性を保ちながら、日本語として自然にした。
- source_word: τοῦ ἀρχιερέως τὸν δοῦλον
  choice: 大祭司の奴隷
  rationale: δοῦλοςがここでは文字どおりの社会的身分を指すため、婉曲化せず「奴隷」とした。文脈によって可能な「僕」は脚注に示す。
- source_word: ἀφεῖλεν
  choice: 切り落とした
  rationale: 基本義は「取り去る」だが、耳への刃物による負傷という文脈で生じた結果を自然かつ明確に表す。
- source_word: τὸ οὖς αὐτοῦ τὸ δεξιόν
  choice: その右の耳
  rationale: 所有者と左右の指定を保持しつつ、原文の語順に比較的近い自然な日本語とした。
theological_decisions:
- issue: δοῦλοςの訳語
  choice: 奴隷
  alternative: 僕
  rationale: この箇所では宗教的比喩ではなく、実在する社会的従属身分を指すため「奴隷」を本文に採用した。ただし、家に仕える者として「僕」と訳す伝統的・文脈的可能性も脚注で保持した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。叙事の緊迫感を保つため動作を直接的に表現し、社会的身分を示す語は婉曲化しなかった。
