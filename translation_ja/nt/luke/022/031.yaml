  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Σίμων Σίμων, ἰδοὺ ὁ Σατανᾶς ἐξῃτήσατο ὑμᾶς τοῦ σινιάσαι ὡς τὸν σῖτον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/031.yaml
  text: 'Simon, Simon, look: Satan has demanded to have all of you, to sift you like wheat.'
translation:
  language: ja
  text: 「シモン、シモン、見なさい。サタンは、あなたがたを麦のようにふるいにかけるために、あなたがたを手に入れようと強く求めた。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: よく聞きなさい
  rationale: ここでは視覚的な「見よ」よりも、続く重大な警告へ注意を促す談話標識として自然に表した。
- source_word: ἐξῃτήσατο
  choice: 渡すよう要求した
  rationale: 強く求める意味と、サタンが弟子たちを試す許可を求めた含みを保つ。「自分のものとして要求した」と断定しすぎない。
- source_word: ὑμᾶς
  choice: あなたがた（2回）
  rationale: ギリシア語は複数形であり、呼びかけはシモン個人でも、要求の対象は弟子たち全体であることを明示した。
- source_word: τοῦ σινιάσαι ὡς τὸν σῖτον
  choice: 麦のようにふるいにかけるため
  rationale: 目的を示す不定詞と農作業の比喩を、日本語で簡潔かつ具体的に保った。
theological_decisions:
- issue: サタンの要求に対する神の許可が明示されているか
  choice: 「渡すよう要求した」とし、要求の相手や許可の成否は補わない
  alternative: 「あなたがたを自分のものにすることを要求した」／「あなたがたを試す許可を得た」
  rationale: 本文は要求したことを述べるが、その相手や、要求が認められたかを明示しないため、解釈を本文に持ち込まない。
- issue: 呼びかけの単数と目的語の複数
  choice: 「シモン、シモン」と呼びかけつつ「あなたがた」を用いる
  alternative: 全体を単数の「あなた」にそろえる
  rationale: 原文の数の対照は、ペトロへの個人的警告と弟子集団への試みを示す重要な緊張なので保持する。
translation_notes:
  register: 現代の一般読者に自然でありながら、イエスの厳粛な警告にふさわしい格調を保った。「よく聞きなさい」で注意喚起を明確にし、複数形の「あなたがた」を省略しなかった。
