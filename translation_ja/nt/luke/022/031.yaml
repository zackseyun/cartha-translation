  rationale: 注意喚起を「見なさい」として原文の談話標識を保ち、「渡すよう要求した」を、サタンが弟子たちを自らの目的のために強く求めたという自然な表現に改めた。要求の相手、要求が認められたかどうか、また試みの神学的意味は本文に補っていない。
