review_pass:
  verdict: revise
  source_fidelity: ἰδού is a demonstrative attention signal; 「よく聞きなさい」 narrows it to hearing. More importantly, ἐξῃτήσατο ὑμᾶς means that Satan has urgently demanded/asked for the disciples, not that he demanded that an unstated party hand them over. 「あなたがたを渡すよう要求した」 introduces a handing-over event and leaves the construction syntactically incomplete. The revision conveys his forceful claim/request without specifying the person addressed or whether the request was granted.
  naturalness: The revised Japanese is natural modern standard Japanese and retains the solemn warning. It also closes the opening quotation mark.
  terminology: 「サタン」 and 「麦のようにふるいにかける」 are appropriate. 「手に入れようと強く求めた」 naturally expresses the sense of demanding the disciples for his purpose, while avoiding an explicit doctrinal assertion about divine permission.
  issues:
  - severity: medium
    issue: 「よく聞きなさい」はἰδούを聴覚的な命令に限定している。
    rationale: ἰδού is literally a call to notice/attend (“look/behold”), not specifically an instruction to listen.
  - severity: high
    issue: 「あなたがたを渡すよう要求した」はἐξῃτήσατο ὑμᾶςの構文と意味を十分に表していない。
    rationale: 原文はサタンが弟子たちを要求したことをいう。改稿は不明示の相手に弟子たちを「渡す」よう求めたという出来事を導入し、日本語としても誰が渡すのかが欠ける。
  - severity: low
    issue: 引用符が閉じられていない。
    rationale: 本文の構造上、末尾の閉じ引用符が必要。
  revised_text: 「シモン、シモン、見なさい。サタンは、あなたがたを麦のようにふるいにかけるために、あなたがたを手に入れようと強く求めた。」
  revised_footnotes: []
