id: LUK.22.36
reference: Luke 22:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν ⸀δὲ αὐτοῖς· Ἀλλὰ νῦν ὁ ἔχων βαλλάντιον ἀράτω, ὁμοίως καὶ πήραν, καὶ ὁ μὴ ἔχων ⸀πωλησάτω τὸ ἱμάτιον αὐτοῦ καὶ ⸀ἀγορασάτω μάχαιραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/036.yaml
  text: But now[a], let the one who has a money bag take it, and likewise a travel bag[b]; and let the one who does not have one sell his cloak and buy a sword.
translation:
  language: ja
  text: そこで、イエスは彼らに言われた。「しかし今は、財布を持っている者は、それを持って行きなさい。旅袋も同じように持って行きなさい。持っていない者は、自分の上着を売って、剣を買いなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ νῦν
  choice: しかし今は
  rationale: 直前の派遣時の状況との強い対比を、自然な現代日本語で示す。
- source_word: βαλλάντιον
  choice: 財布
  rationale: 金銭を入れて携帯する袋を指す。現代日本語で簡潔かつ明瞭な語を選んだ。
- source_word: ἀράτω
  choice: それを持って行きなさい
  rationale: 旅の備えとして携行する意味を文脈に即して表し、命令の力を保った。
- source_word: πήραν
  choice: 旅袋
  rationale: 旅人が携える袋を指すため、用途が分かる簡潔な訳語とした。
- source_word: ὁ μὴ ἔχων
  choice: 持っていない者
  rationale: 原文では目的語が明示されていないため、日本語でも補わず、その簡潔さと曖昧さを保った。
- source_word: τὸ ἱμάτιον αὐτοῦ
  choice: 自分の上着
  rationale: ἱμάτιονは通常、外側に着る衣を指す。「上着」は現代の一般読者に理解しやすい。
- source_word: πωλησάτω ... καὶ ἀγορασάτω
  choice: 売り、…買いなさい
  rationale: 二つのアオリスト命令を簡潔に表し、原文の直接的な命令を弱めない。
- source_word: μάχαιραν
  choice: 剣
  rationale: 短剣や大型の刃物を含み得る語だが、「剣」は特定しすぎず、文脈上の武器を自然に表す標準的な訳語である。
theological_decisions:
- issue: 剣を買う命令を文字どおりの表現で訳すか、比喩的・緩和的に意訳するか
  choice: 「剣を買いなさい」と直接的に訳す
  alternative: 「危険に備えなさい」などと解釈を織り込む
  rationale: 原文はμάχαιραを明記し、直接の命令形を用いている。暴力、護身、比喩などをめぐる解釈上の緊張は翻訳で解消せず、本文の表現を保つ。
- issue: ὁ μὴ ἔχωνの省略された目的語を特定するか
  choice: 「持っていない者」とし、本文では目的語を補わない
  alternative: 「剣を持っていない者」と明示する
  rationale: 後続の「剣を買いなさい」から剣を指すと理解するのが自然だが、ギリシア語本文自体は目的語を明示しないため、その曖昧さを残す。
translation_notes:
  register: 明瞭で現代的ながら品位のある命令表現とした。原文にない主語「イエスは彼らに言われた」は、この節だけの提示では補わず、発言内容をそのまま訳した。「売ってでも」のような強調表現は加えず、原文の二つの命令を並列的に示した。
