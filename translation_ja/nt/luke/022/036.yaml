    reason: lexical_alternative
  - marker: b
    text: 原文は単に「持っていない者」とあり、何を持っていないのかを明示していない。後に続く命令から、一般には剣を指すと理解される。
    reason: source_ambiguity
  - marker: c
    text: 「剣」と訳したギリシア語（μάχαιρα）は、短剣や大型の刃物を指すこともある。
    reason: lexical_alternative
