  text: Καὶ ὅτε ἐγένετο ἡ ὥρα, ἀνέπεσεν καὶ ⸀οἱ ἀπόστολοι σὺν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/014.yaml
  text: And when the hour came[a], he reclined at the table, and the apostles with him.
translation:
  language: ja
  text: 時が来ると、イエスは食卓の席に身を横たえ[a]、使徒たちもイエスと共に身を横たえた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当時の食事では、食卓の周りに置かれた寝台にもたれかかるようにして食事をする習慣があった。
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε ἐγένετο ἡ ὥρα
  choice: 時が来ると
  rationale: 定冠詞を伴う「時」が到来したという物語上の定められた時点を、簡潔で自然な日本語で表した。「その時刻になると」も可能だが、ここでは単なる時計上の時刻に限定しない原文の含みを保った。
- source_word: ἀνέπεσεν
  choice: 食事の席に身を横たえ
  rationale: 古代の食事で横になって食卓につく姿勢を表す動詞の具体性を保持した。「席に着いた」だけでは歴史的な食事姿勢が失われるため、本文で明示し文化注を付した。
- source_word: οἱ ἀπόστολοι
  choice: 使徒たち
  rationale: 定冠詞付きの既知の一団を指す。「イエスの」は原文に明示されていないため加えなかった。
- source_word: σὺν αὐτῷ
  choice: イエスと共に
  rationale: 日本語では代名詞の「彼」より指示対象を明示する方が自然で誤解がない。σύνが示す同行・同席を「共に」で表した。
- source_word: Καὶ
  choice: （独立した接続語としては訳出せず）
  rationale: 日本語では節頭の「そして」を置かなくても「〜すると」で前後の物語的連続が自然に表されるため、機能的に訳した。
theological_decisions:
- issue: 過越の食事における姿勢
  choice: イエスは食事の席に身を横たえ
  alternative: イエスは席に着き
  rationale: ἀναπίπτωが示す当時の具体的な食事姿勢を保ち、現代的な着席動作へ平板化しなかった。これは文化的・語彙的判断であり、教派的解釈を加えるものではない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、食事姿勢の歴史的具体性を保持した。「身を横たえ」と「席に着いた」を使い分け、原文では主動詞がイエスにのみ明示され、使徒たちについては省略されている構文を自然な日本語に補った。
