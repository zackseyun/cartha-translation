id: LUK.22.70
reference: Luke 22:70
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπαν δὲ πάντες· Σὺ οὖν εἶ ὁ υἱὸς τοῦ θεοῦ; ὁ δὲ πρὸς αὐτοὺς ἔφη· Ὑμεῖς λέγετε ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/070.yaml
  text: Then they all said[a], “So you are the Son of God?” And he said to them, “You say that I am.”
translation:
  language: ja
  text: そこで、一同は言った。「では、あなたは神の子なのか。」イエスは彼らに言われた。「あなたがたは、わたしがそうだと言っている。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より慣用的には、「あなたがたの言うとおりです」または「そのとおりです」。この言葉は文脈上、肯定の返答として機能しますが、ギリシア語をより直訳すると、「あなたがたは、わたしがそうだと言っている」となります。
    reason: 原文に近い本文表現と、文脈上の慣用的な意味の両方を示すため。
lexical_decisions:
- source_word: πάντες
  choice: 一同
  rationale: 形容詞の名詞的用法で、その場の全員を指す。「一同」は集団全体への強調を自然な日本語で表す。
- source_word: οὖν
  choice: では
  rationale: 直前の発言から結論を引き出す問いの推論的な働きを、自然な現代日本語で示す。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: 定冠詞を伴うキリスト論的称号であり、日本語で定着した簡潔で重みのある表現を用いる。
- source_word: ἔφη
  choice: 言われた
  rationale: 文脈上は単純な発話を表す。イエスへの敬意を保つ聖書本文の自然な叙述として尊敬形を用いる。
- source_word: Ὑμεῖς
  choice: あなたがたが
  rationale: 明示された複数代名詞を訳出し、発言の主体を相手側に戻す修辞的な力を保つ。「あなたがた自身が」とまではせず、不必要な強調を加えない。
- source_word: λέγετε
  choice: 言っています
  rationale: 現在形を保ち、相手たちが今まさに述べている内容として自然に表す。
- source_word: ὅτι
  choice: と
  rationale: 後続する内容を発言内容として導く接続詞であり、日本語の引用助詞「と」が対応する。
- source_word: ἐγώ εἰμι
  choice: わたしがそうである
  rationale: 省略された述語内容を文脈に即して「そう」で受けつつ、「わたしが……である」という簡潔な自己言及を保つ。明示的な「そのとおりだ」には言い換えない。
theological_decisions:
- issue: イエスの返答を明白な肯定として訳すか、原文の間接的な言い回しを保つか
  choice: 「わたしがそうであると、あなたがたが言っています」と原文の構文を保つ
  alternative: 「あなたがたの言うとおりです」または「そのとおりです」
  rationale: 文脈上は肯定の返答として機能するが、ギリシア語は相手たち自身の発言に言及する形を取る。本文ではその緊張と含みを残し、慣用的な理解は脚注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「なのか」で審問者たちの直接的な問いを表し、返答はあえて少し硬質な構文を残して、原文の含みを解消しないようにした。
