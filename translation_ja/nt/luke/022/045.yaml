source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἀπὸ τῆς προσευχῆς ἐλθὼν πρὸς τοὺς μαθητὰς εὗρεν ⸂κοιμωμένους αὐτοὺς⸃ ἀπὸ τῆς λύπης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/045.yaml
  text: And after rising from prayer[a], he came to the disciples and found them sleeping from sorrow.
translation:
  language: ja
  text: 祈りを終えて立ち上がり、弟子たちのところへ行くと、彼らが悲しみのために眠っているのを見いだした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς ἀπὸ τῆς προσευχῆς
  choice: 祈りを終えて立ち上がり
  rationale: ἀναστὰςは主動詞に先立つ動作を表す。「祈りから立ち上がる」というギリシア語の像を、自然な現代日本語で順序が明確になるよう表現した。
- source_word: ἐλθὼν πρὸς τοὺς μαθητὰς
  choice: 弟子たちのところへ行くと
  rationale: πρόςが示す弟子たちへの移動と、到着後に発見したという動作の流れを自然に表す。
- source_word: μαθητὰς
  choice: 弟子たち
  rationale: 福音書におけるμαθητήςの標準的で文脈に適した訳語。
- source_word: εὗρεν
  choice: 見いだした
  rationale: εὑρίσκωの直接的な意味を保ち、単に「見た」よりも、着いてその状態を認めたことを表す。
- source_word: κοιμωμένους αὐτούς
  choice: 彼らが…眠っているのを
  rationale: 現在分詞が表す、その時点で継続していた状態・動作を保持する。
- source_word: ἀπὸ τῆς λύπης
  choice: 悲しみのあまり
  rationale: ここでのἀπόは原因を表すのが自然であり、「悲しみのあまり」は因果関係を簡潔かつ自然な日本語で示す。λύπηはこの文脈では「悲しみ」が適切。
theological_decisions:
- issue: 弟子たちが眠っていたことと悲しみとの関係
  choice: 悲しみが眠りの原因であったと訳す
  alternative: 悲しみを抱えながら眠っていたとし、因果性を弱く取る
  rationale: ἀπὸ τῆς λύπηςは原因を表す用法として最も自然である。ただし、本文にない心理的・生理的説明は加えない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、受難物語にふさわしい落ち着いた格調を保った。「見いだした」はやや文語的だが、εὗρενの意味を正確に示し、聖書本文として自然な範囲にある。
