  text: κἀγὼ διατίθεμαι ὑμῖν, καθὼς διέθετό μοι ὁ πατήρ μου βασιλείαν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/029.yaml
  text: And I appoint to you, just as my Father appointed to me, a kingdom.
translation:
  language: ja
  text: そしてわたしは、わたしの父がわたしに授けてくださったのと同じように、あなたがたに王国を授けます。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そしてわたしは、わたしの父がわたしに王国を与えることを契約として定められたように、あなたがたに王国を与えることを契約として定めます」。ギリシア語の動詞には、「授ける」のほか、「取り決める」や「契約を結ぶ」という意味合いもあり得る。
    reason: alternative_reading
  - marker: b
    text: 原文では「王国」が文末に置かれ、二つの動詞に関わっている。語順に近く訳せば、「そしてわたしはあなたがたに、わたしの父がわたしに定められたのと同じように、王国を定めます」となる。
    reason: previous_rendering
lexical_decisions:
- source_word: κἀγὼ
  choice: そしてわたしは
  rationale: καίとἐγώの融合形。前の文とのつながりと、イエスご自身への強調を自然な日本語で示す。文脈上「わたしも」とすることも可能だが、付加の意味を強めすぎないよう「そしてわたしは」とした。
- source_word: διατίθεμαι / διέθετό
  choice: 授けます／授けてくださった
  rationale: この動詞には、取り決める、契約によって定める、付与するという意味領域がある。ここでは王国が目的語であり、父からイエスへ、イエスから弟子たちへという並行関係があるため、現代日本語として自然な「授ける」を選び、同じ動詞を反復して原文の対応を保った。父の行為には敬意を表す補助動詞「くださる」を用いた。
- source_word: ὑμῖν / μοι
  choice: あなたがたに／わたしに
  rationale: いずれも授与を受ける者を示す与格として、直接的に訳した。
- source_word: καθὼς
  choice: のと同じように
  rationale: イエスの行為と父の先行する行為との対応を明確に示す。
- source_word: ὁ πατήρ μου
  choice: わたしの父
  rationale: 所有関係と父子関係を簡潔かつ自然に表す。
- source_word: βασιλείαν
  choice: 王国
  rationale: この語は王としての支配や統治をも表し得るが、続く節の食卓と王座の描写を考慮すると、ここでは授けられる王的領域・支配を含む「王国」が適切である。
theological_decisions:
- issue: διατίθεμαιに契約の意味を明示するか
  choice: 本文では「授ける」とする
  alternative: 「契約によって定める」「王国を与える契約を結ぶ」
  rationale: 契約的な含みは語義上可能だが、この構文だけで明示的な契約句と断定することはできない。本文ではより広い付与の意味を採り、契約的解釈の可能性は脚注に残した。
- issue: 文末のβασιλείανを二つの動詞にどう関係づけるか
  choice: 父がイエスに王国を授け、イエスが弟子たちに王国を授けるという並行関係を明示する
  alternative: 原文の語順に近く、文末の「王国」を二つの動詞に共有させる
  rationale: ギリシア語では「王国」が文末に置かれ、両方の動詞に関わる構造になっている。日本語でその語順をそのまま再現すると不自然で意味が取りにくいため、父の節では目的語を文脈上補って「授けてくださったの」とし、同じ対象であることを保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの発言としての品位を保った。「授ける」によって不自然な「任命する」を避け、父と子の行為に用いられた同一のギリシア語動詞の並行性を日本語でも維持した。
