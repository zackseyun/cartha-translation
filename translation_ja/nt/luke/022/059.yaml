  naturalness: 「一時間ほどたったころ」も通じますが、「それから一時間ほどたって」のほうが、時間が経過した後という属格独立構文を自然かつ直接的に表せます。「別の人」「こう強く言い張った」は明瞭な現代標準日本語です。
