  text: καὶ διαστάσης ὡσεὶ ὥρας μιᾶς ἄλλος τις διϊσχυρίζετο λέγων· Ἐπ’ ἀληθείας καὶ οὗτος μετ’ αὐτοῦ ἦν, καὶ γὰρ Γαλιλαῖός ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/059.yaml
  text: And after about one hour had passed[a], another man insisted, saying, “Truly, this man also was with him, for he too is a Galilean.”
translation:
  language: ja
  text: それから一時間ほどたって、別の人がこう強く言い張った。「確かに、この人もあの人と一緒にいた。彼もガリラヤ人だからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαστάσης ὡσεὶ ὥρας μιᾶς
  choice: 一時間ほどたったころ
  rationale: 時間の経過を表す属格独立構文を、概数の意味を保ちながら自然な現代日本語にした。
- source_word: ἄλλος τις
  choice: 別の者
  rationale: ギリシア語は性別を明示しない不定表現であるため、文脈上男性の可能性はあるものの、原文の曖昧さを保持した。
- source_word: διϊσχυρίζετο
  choice: 強く言い張った
  rationale: 強い断言を表す語義と未完了過去の持続的・執拗な響きを簡潔に表した。
- source_word: Ἐπ’ ἀληθείας
  choice: 確かに
  rationale: 発言の真実性を強く主張する慣用句を、自然で力のある日本語にした。
- source_word: οὗτος
  choice: この人
  rationale: ペトロを指し示す指示語の力を保ち、単なる代名詞より告発的な調子を伝えた。
- source_word: μετ’ αὐτοῦ ἦν
  choice: あの方と一緒にいた
  rationale: 同行・同席していたという主張を過度に解釈せず表した。αὐτόςは直前の発話状況でイエスを指すため、日本語の自然さと敬意を考慮して「あの方」とした。
- source_word: καὶ γὰρ
  choice: なのだから
  rationale: γάρの理由提示とκαίの付加的意味を、後続する「ガリラヤ人」によって先の断言を裏づける自然な日本語で表した。
- source_word: Γαλιλαῖός ἐστιν
  choice: ガリラヤ人なのだから
  rationale: 地域的出身・帰属を示す述語名詞を直接的に訳し、それが告発の根拠であることも示した。
