base_translation:
  language: en
  yaml_path: translation/nt/luke/022/058.yaml
  text: And after a little while[a], another man, seeing him, said, “You also are one of them.” But Peter said, “Man, I am not.”
translation:
  language: ja
  text: しばらくして、別の男がペトロを見て言った。「あなたも彼らの仲間だ。」しかしペトロは言った。「男よ、私は彼らの仲間ではない。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は直訳すると「男よ、私はそうではない」。前の発言を受けて、「私は彼らの仲間ではない」という意味であり、「彼らの仲間」は補われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ βραχὺ
  choice: しばらくして
  rationale: 短い時間が経過した後を表す慣用的な時間表現として、簡潔で自然な現代日本語にした。
- source_word: ἕτερος
  choice: 別の男
  rationale: 「別の者」を意味する。男性単数の指示対象であり、後の呼びかけ「Ἄνθρωπε」と文脈を踏まえて「男」を補った。
- source_word: ἰδὼν αὐτὸν
  choice: ペトロを見て
  rationale: アオリスト分詞の付帯状況を自然に表した。日本語では代名詞「彼」より固有名を用いる方が指示対象が明瞭である。
- source_word: Καὶ σὺ ἐξ αὐτῶν εἶ
  choice: あなたも彼らの仲間だ
  rationale: ἐξ αὐτῶν はここでは出身ではなく、イエスに連なる集団への所属を示す。「仲間」は自然な日本語でその告発を表す。
- source_word: Ἄνθρωπε
  choice: いや
  rationale: 直訳は男性への呼びかけ「男よ」だが、現代日本語の会話では不自然である。ここでは相手を強く退ける呼びかけの語用的機能を、否定の応答「いや」に反映した。
- source_word: οὐκ εἰμί
  choice: 違う
  rationale: 直訳的には「私はそうではない」で、直前の所属告発を省略して否定する。日本語の「違う」は同じ省略と切迫した簡潔さを自然に保つ。
