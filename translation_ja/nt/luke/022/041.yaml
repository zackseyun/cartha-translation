id: LUK.22.41
reference: Luke 22:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς ἀπεσπάσθη ἀπ’ αὐτῶν ὡσεὶ λίθου βολήν, καὶ θεὶς τὰ γόνατα προσηύχετο
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/041.yaml
  text: And he withdrew from them about a stone’s throw[a], and kneeling down[b], he was praying.
translation:
  language: ja
  text: そしてイエスは、弟子たちから石を投げて届くほどの距離まで離れ、ひざまずいて祈っておられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεσπάσθη
  choice: 離れ
  rationale: 受動形だが、文脈ではイエスが弟子たちから身を離したことを表す。日本語では不自然な受け身を避け、意図的な移動を自然に示した。
- source_word: ὡσεὶ λίθου βολήν
  choice: 石を投げて届くほどの距離まで
  rationale: 直訳的な「石を投げる距離」を、概算を示す ὡσεὶ の意味を保ちながら、現代日本語で分かりやすい距離表現にした。
- source_word: θεὶς τὰ γόνατα
  choice: ひざまずいて
  rationale: 字義的には「ひざを置いて」だが、ひざまずく動作を表す慣用表現なので、自然な日本語にした。
- source_word: προσηύχετο
  choice: 祈っておられた
  rationale: 未完了過去の継続的な側面を「祈っておられた」で示した。敬語は日本語の聖書文体としてイエスへの自然な敬意を表すもので、動作の内容を加えてはいない。
- source_word: αὐτὸς
  choice: イエスは
  rationale: 強意を伴う代名詞だが、日本語で「ご自身は」とすると対比を強めすぎる可能性がある。文脈上の指示対象を明確にするため固有名で示した。
- source_word: καὶ
  choice: そして
  rationale: 物語の連続を、余分な因果関係を加えず自然に示した。
theological_decisions:
- issue: 祈りの姿勢とキリスト論的描写
  choice: イエスが弟子たちから離れ、ひざまずいて祈り続けた場面として簡潔に訳す。
  alternative: 祈りの姿勢に服従や苦悩などの神学的説明を訳文中で補う。
  rationale: 本文は行動、距離、姿勢、祈りを叙述しており、それ以上の教理的・信仰的解釈を明示してはいないため、描写をそのまま保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「石を投げて届くほどの距離」は古代の概算表現を普通の読者に分かりやすく伝える。本文に脚注標識はなく、脚注も設けていない。
