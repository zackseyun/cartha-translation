  text: A dispute also arose among them as to which of them was considered to be greater[a].
translation:
  language: ja
  text: また、弟子たちの間で、彼らのうちだれがより偉いと見なされているのかをめぐって、言い争いが起こった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らのうちだれがより偉いと思われるのか」。ギリシア語の動詞は、「そう見える」とも「そう見なされる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: 起こった
  rationale: ここでは、ある状況が生じたことを物語る用法。「起こった」は自然な現代日本語であり、言い争いの発生を明確に表す。
- source_word: δὲ καὶ
  choice: また
  rationale: δέの物語上の展開とκαίの付加的な働きを、日本語では簡潔な「また」で表した。強い逆接は原文に要求されない。
- source_word: φιλονεικία
  choice: 言い争い
  rationale: 地位を競う対立や論争を指す語。この文脈では、一般読者に分かりやすく、実際の対立を自然に伝える「言い争い」が適切。
- source_word: ἐν αὐτοῖς
  choice: 弟子たちの間で
  rationale: 集団内部で起きたことを示す。日本語で指示対象を明瞭にするため、文脈上の「弟子たち」を補った。
- source_word: τὸ τίς αὐτῶν
  choice: 自分たちのうちだれが…のかをめぐって
  rationale: 冠詞付き間接疑問が言い争いの内容を示す構造を、自然な日本語で表した。
- source_word: δοκεῖ
  choice: 見なされている
  rationale: δοκέωには「そう思われる」と「そう見なされる」の両義がある。ここでは集団内の地位評価という文脈に合う受動的評価を本文に採用し、別の可能性を脚注に残した。
- source_word: μείζων
  choice: より偉い
  rationale: 比較級を保ち、明示的な最上級「いちばん偉い」へ強めない。「偉い」は人の地位や重要性をめぐる日常的で自然な表現。
theological_decisions:
- issue: 弟子たちの間の地位を表す比較級
  choice: より偉い
  alternative: いちばん偉い／より重要である
  rationale: 原文は比較級μείζωνであり、明示的な最上級ではない。比較の形を保ち、地位争いの意味を訳者が過度に限定しない。
- issue: δοκεῖが示す評価の主体と様態
  choice: 偉いと見なされている
  alternative: 偉いと思われる／偉いように見える
  rationale: 社会的評価として読むのが文脈に適うが、原語には「そう見える・思われる」という含みもあるため、脚注で曖昧さを保存した。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「弟子たち」は文脈上の指示対象を日本語で明確にする補足である。比較級とδοκεῖの意味の幅を保ち、脚注記号[a]を本文に明示した。
