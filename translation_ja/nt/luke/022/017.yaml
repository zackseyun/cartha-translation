source:
  edition: SBLGNT
  text: καὶ δεξάμενος ποτήριον εὐχαριστήσας εἶπεν· Λάβετε τοῦτο καὶ διαμερίσατε ⸂εἰς ἑαυτούς⸃·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/017.yaml
  text: And after receiving a cup and giving thanks[a], he said[b], “Take this and divide it among yourselves.”
translation:
  language: ja
  text: そして、杯を受け取り、感謝をささげてから言われた。「これを取り、互いに分け合いなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεξάμενος
  choice: 受け取り
  rationale: アオリスト中動態分詞で、主動詞「言われた」に先立つ動作を表す。日本語では後続の「感謝をささげてから」と合わせ、自然な順序として示した。
- source_word: ποτήριον
  choice: 杯
  rationale: 食卓の飲み物を入れる器を指す。ギリシア語では無冠詞だが、日本語には冠詞がないため、不定・特定を訳文で不自然に限定せず「杯」とした。
- source_word: εὐχαριστήσας
  choice: 感謝をささげてから
  rationale: 発言に先立って神に感謝したことを表す。後代の典礼用語を持ち込まず、物語上の行為を明瞭にした。
- source_word: εἶπεν
  choice: 言われた
  rationale: 原文には間接目的語が明記されていないため、「彼らに」は補わない。イエスへの敬意を保つ自然な現代日本語として敬語を用いた。
- source_word: Λάβετε
  choice: 取り
  rationale: 食卓で杯を手に取るよう促す命令として、「受けなさい」より直接的で自然である。後続の命令とつなげた。
- source_word: τοῦτο
  choice: これを
  rationale: 直前の杯を指す指示代名詞であり、原文同様に名詞を繰り返さず簡潔に訳した。
- source_word: διαμερίσατε
  choice: 分けなさい
  rationale: 「分割する」「分配する」の双方を含み得る。文脈上は一同の間で分けることを表し、自然で意味範囲の広い表現とした。
- source_word: εἰς ἑαυτούς
  choice: あなたがたの間で
  rationale: 集団内で相互に分ける意味を自然に表す。「自分たちのために」では所有の意味に誤解され得る。
theological_decisions:
- issue: εὐχαριστήσαςとποτήριονを聖餐の典礼用語で訳すか
  choice: 通常の物語表現で「杯」「感謝をささげてから」と訳す
  alternative: 後代の典礼・聖餐を強く連想させる定型表現を用いる
  rationale: 本文は食卓でのイエスの行為を記しているが、この語句自体に後代の教会的術語を明示してはいないため、原文以上の教理的含意を加えない。
- issue: 無冠詞のποτήριονの特定性
  choice: 日本語本文では単に「杯」とする
  alternative: 「一つの杯」または「その杯」として不定・特定を明示する
  rationale: 日本語には冠詞がなく、文脈上の杯を「杯」と自然に示せる。ギリシア語の無冠詞性を数詞で強調したり、逆に特定性を過度に明示したりしない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。発話者であるイエスには「言われた」を用いるが、命令文は簡潔にした。原文に解釈上重要な代替を本文外で示す必要は低いため、脚注は付していない。
