  - severity: medium
    issue: τελεσθῆναιの訳し方
    rationale: 「実現しなければなりません」でも意味は通りますが、受動不定詞の「成し遂げられる」を明示すると、書かれた事柄が成就されるという原文の表現によりよく対応します。
