  terminology: ἀνόμωνの「不法な者たち」は可能ですが、日本語では「無法な者たち」のほうが一般的で明瞭です。引用元との伝統的な対応は脚注で「罪を犯す者たちの一人に数えられた」として示すのが適切です。
