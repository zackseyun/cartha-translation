id: LUK.22.37
reference: Luke 22:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ⸀ὅτι τοῦτο τὸ γεγραμμένον δεῖ τελεσθῆναι ἐν ἐμοί, τό· Καὶ μετὰ ἀνόμων ἐλογίσθη· καὶ γὰρ ⸀τὸ περὶ ἐμοῦ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/037.yaml
  text: 'For I tell you that this which is written must be fulfilled in me: ‘And he was counted with the lawless.’ For what concerns me has its fulfillment[a][b].'
translation:
  language: ja
  text: というのは、あなたがたに言っておきます。『彼は無法な者たちと共に数えられた』と書かれているこのことは、わたしの身に必ず成し遂げられなければなりません[a]。実際、わたしに関することは終わりを迎えるのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は罪を犯す者たちの一人に数えられた」（イザヤ書53章12節）。
    reason: alternative_reading
  - marker: b
    text: 別訳「わたしに関することは成就に至る」または「完成に至る」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: というのは、あなたがたに言います
  rationale: γάρによる前文との説明的なつながりを「というのは」で示し、λέγω ὑμῖνを現代日本語として自然な「あなたがたに言います」とした。
- source_word: τοῦτο τὸ γεγραμμένον
  choice: 書かれているこのこと
  rationale: 「聖書」と明示せず、指示語と完了受動分詞の構造を保ちながら自然な日本語にした。
- source_word: δεῖ τελεσθῆναι
  choice: 必ず実現しなければなりません
  rationale: δεῖの必然性を「必ず…なければならない」で表し、預言として書かれた事柄が出来事となる文脈に即してτελεσθῆναιを「実現する」とした。
- source_word: ἐν ἐμοί
  choice: わたしにおいて
  rationale: イエス自身において、またイエスの身に関して実現するという幅を残すため、ἐνを比較的形式的に訳した。
- source_word: Καὶ μετὰ ἀνόμων ἐλογίσθη
  choice: 彼は不法な者たちと共に数えられた
  rationale: ἀνόμωνを直接的に「不法な者たち」、μετάを「と共に」、ἐλογίσθηを「数えられた」とし、イザヤ書引用の語形を保った。文頭のΚαίは引用文単独の日本語では不自然なため明示しなかった。
- source_word: τὸ περὶ ἐμοῦ
  choice: わたしに関すること
  rationale: 冠詞付きの句を過度に具体化せず、自然かつ簡潔に訳した。
- source_word: τέλος ἔχει
  choice: 終局に至る
  rationale: τέλοςが持つ「終わり」と「完成・成就」の両方向を、「終局に至る」という表現によって可能な限り保持した。
theological_decisions:
- issue: イザヤ書53章12節の引用を伝統的な訳語に合わせるか
  choice: 彼は不法な者たちと共に数えられた
  alternative: 彼は背く者たちの一人に数えられた
  rationale: ἀνόμωνの直接的な意味とμετάの構文を本文で優先した。一方、イザヤ書との結びつきが分かりやすい伝統的な表現は脚注に残した。
- issue: τέλος ἔχειが終結と成就のどちらを意味するか
  choice: 終局に至る
  alternative: 成就する／終わりを迎える
  rationale: 受難に関する神の定めの完成を示す可能性が高いが、原文には終結の含みもあるため、どちらか一方に限定しない訳語を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言としての荘重さを保った。敬体で統一し、聖書引用はかぎ括弧で示した。「わたしにおいて」と「終局に至る」は、原文の神学的・語義的な幅を保つため、やや形式性のある表現を意図的に採用した。
