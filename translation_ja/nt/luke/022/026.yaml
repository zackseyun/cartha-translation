  source_fidelity: 本文は、強調された対比（ὑμεῖς δὲ οὐχ οὕτως）を「しかし、あなたがたは、そうであってはなりません」と適切に表し、前節の支配的なあり方を否定する含意を過不足なく補っている。「むしろ」によってἀλλάの強い対照も保たれている。μείζωνを最上級化せず共同体内の相対的な高い地位として訳し、γινέσθωの命令および「なる」という変化・態度の含意も維持している。ἡγούμενοςとδιακονῶνの対比も、「指導する者」「仕える者」で忠実に再現されている。
  naturalness: 明快な現代標準日本語であり、直接話法として自然である。「上の立場にある者」「年下の者」「指導する者」「仕える者」の反復は、原文の並行構造と対比を分かりやすく保っている。命令形が文末に置かれる協調構文も日本語として許容される。
  terminology: 「上の立場にある者」は文脈上の社会的優位を自然に示し、後代の職制を持ち込まない。「指導する者」はἡγούμενοςに対して中立的で適切であり、「仕える者」はδιακονῶνの行為的意味を保つ。「年下の者」の年齢面と社会的下位の含意は注で補われており、比較級を「最年少」としない処理も適切である。
