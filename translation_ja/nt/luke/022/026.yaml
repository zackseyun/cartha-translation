id: LUK.22.26
reference: Luke 22:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ οὐχ οὕτως, ἀλλ’ ὁ μείζων ἐν ὑμῖν ⸀γινέσθω ὡς ὁ νεώτερος, καὶ ὁ ἡγούμενος ὡς ὁ διακονῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/022/026.yaml
  text: But you are not to be like that[a]. Instead, let the greater among you become like the younger[b], and the one who leads like the one who serves.
translation:
  language: ja
  text: しかし、あなたがたは、そうであってはなりません。[a] むしろ、あなたがたの中で上の立場にある者は、年下の者[b]のようになり、指導する者は、仕える者のようになりなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、あなたがたの間では、そうであってはならない」。ギリシア語は省略を含む簡潔な表現で、直前に述べられた、地位を求める支配者たちのあり方と弟子たちとを鋭く対比している。
    reason: alternative_reading
  - marker: b
    text: 「年下の者」は、単に年齢が若い人というだけでなく、当時の社会で立場の低い者を指している。
    reason: cultural_note
lexical_decisions:
- source_word: ὑμεῖς δὲ οὐχ οὕτως
  choice: しかし、あなたがたは、そうであってはなりません
  rationale: 強調された「あなたがた」と鋭い対比を保ちつつ、省略的なギリシア語を前節のあり方への禁止として自然な現代日本語にした。
- source_word: ἀλλ’
  choice: むしろ
  rationale: 否定に続く積極的な対照命令を、簡潔で自然に示す。
- source_word: ὁ μείζων ἐν ὑμῖν
  choice: あなたがたの中で上の立場にある者
  rationale: 比較級 μείζων を最上級にせず、共同体内で相対的に高い地位にある者という文脈上の意味を表した。
- source_word: γινέσθω
  choice: ～のようになりなさい
  rationale: γίνομαι の変化・役割を引き受ける含みと、命令の力を保った。
- source_word: ὡς ὁ νεώτερος
  choice: 年下の者のように
  rationale: 比較級の「より若い者」を保ち、「最年少」とはしなかった。当時の社会的に下位の者という含みは注で説明する。
- source_word: ὁ ἡγούμενος
  choice: 指導する者
  rationale: 共同体で先頭に立つ働きを表し、後代の制度的役職や政治的な支配の意味を持ち込まない。
- source_word: ὡς ὁ διακονῶν
  choice: 仕える者のように
  rationale: διακονέω の能動的に人に仕える意味を、制度的な称号にせず動作として表した。
theological_decisions:
- issue: 弟子の共同体における地位と指導のあり方
  choice: 社会的に上位の者と指導する者に、低い立場と奉仕の姿勢を取るよう命じる倫理的逆転として訳す。
  alternative: 教会の職制や統治についての命令として、より制度的な用語で訳す。
  rationale: 本文は「上の立場にある者」「指導する者」を「年下の者」「仕える者」と対比するが、特定の後代的職制を明示してはいない。その緊張を保ち、謙遜な奉仕への命令を前面に出した。
translation_notes:
  register: 明快な現代標準日本語による、自然で品位のある直接話法。敬体の命令表現を用い、一般読者に分かりやすくしつつ、比較級と社会的地位の対比を保持した。
