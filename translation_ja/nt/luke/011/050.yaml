  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: ja
  text: それは、世界の基が据えられた時から流されてきた、すべての預言者の血[a]について、この世代に責任が問われるためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべての預言者の、世界の基が据えられた時から流されてきた血について、この世代に責任が求められるためである」。この動詞は、流血について責任を追及することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: それは〜ためである
  rationale: 前文との目的・結果のつながりを保ちつつ、現代日本語として明瞭にした。
- source_word: ἐκζητηθῇ
  choice: 責任が〜に問われる
  rationale: 血について究明し、責任を追及する受動形の司法的な含みを自然な日本語で表した。単に「捜し求められる」とはしなかった。
- source_word: τὸ αἷμα πάντων τῶν προφητῶν
  choice: すべての預言者の血
  rationale: 「血」という原文の比喩的表現と、「すべて」の包括的範囲をそのまま保持した。
- source_word: τὸ ἐκκεχυμένον
  choice: 流されてきた
  rationale: 血が暴力によって流されたことを自然に表し、完了分詞が示す過去から現在に及ぶ結果も「〜てきた」で反映した。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 世界の基が据えられて以来
  rationale: καταβολήの「基を据えること」という像を保ちながら、時点を表す句として理解しやすくした。
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: この世代に
  rationale: 責任追及の相手を示すἀπόを、日本語の「責任が人に問われる」という自然な構文で表した。
theological_decisions:
- issue: 預言者の血がこの世代に求められることの意味
  choice: 流血に対する責任がこの世代に問われるという神の司法的な責任追及
  alternative: 単に、神の使者を拒む歴史的連続性を修辞的に述べること
  rationale: 血に関するἐκζητέωの受動形には責任を追及する意味がある。ただし、この一節だけでは集団的責任の仕組みを詳説していないため、それ以上の教理的説明は訳文に加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、聖書本文にふさわしい端正さを保った。「世界の基が据えられて以来」は原文の比喩を残し、「血の責任が問われる」で司法的含意を自然に示した。
