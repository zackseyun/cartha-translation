id: LUK.11.47
reference: Luke 11:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: ja
  text: あなたがたに災いがある。あなたがたは預言者たちの墓[a]を建てているが、あなたがたの先祖[b]は彼らを殺したからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「墓を示す記念碑」。ギリシア語は墓、または墓を示す記念碑を指しうる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「父たち」。ここでは先祖・前代の人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: あなたがたは災いだ
  rationale: 預言者的な裁きの宣告としての強さを保ちつつ、現代日本語で直接的かつ自然な表現とした。「ああ」は嘆きの響きが強く、この文脈では弱い。
- source_word: ὅτι
  choice: からだ
  rationale: 災いが宣告される理由を導く因果関係を明確に表す。
- source_word: οἰκοδομεῖτε
  choice: 建てている
  rationale: 現在行われている営みを自然な日本語で表す。継続相を過度に限定せず、現状の行為を示せる。
- source_word: τὰ μνημεῖα
  choice: 墓
  rationale: 語の葬送上の意味を明瞭に伝える。「記念碑」も可能だが、墓との関連が不明瞭になりうる。
- source_word: τῶν προφητῶν
  choice: 預言者たちの
  rationale: 墓が預言者たちに属する、または彼らを記念するものであることを簡潔に表す。
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: しかし、あなたがたの父祖が
  rationale: δὲによる二つの行為の対照を「が」で自然に示し、πατέρεςはこの文脈で先行世代を指すため「父祖」とした。
- source_word: ἀπέκτειναν αὐτούς
  choice: 彼らを殺した
  rationale: 動詞の基本的意味を直接に表し、「虐殺した」などの追加的な法的・感情的含意を持ち込まない。
theological_decisions:
- issue: 墓を建てる者たちと預言者を殺した父祖との関係をどこまで明示するか
  choice: 二つの行為を対照させるにとどめ、その偽善や連帯責任を明文化しない
  alternative: 「父祖が殺した預言者たちの墓を建てている」と一つの修飾関係にまとめる
  rationale: 原文は墓を建てる行為と父祖が殺した事実を並置し、その含意の展開は後続節に委ねている。訳文でもその修辞的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁きの宣告にふさわしい厳粛さを保った。「あなたがた」を明示し、原文の直接的な呼びかけと対照構造を伝えた。
