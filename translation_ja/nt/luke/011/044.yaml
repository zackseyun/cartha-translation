  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐαὶ ⸀ὑμῖν, ὅτι ἐστὲ ὡς τὰ μνημεῖα τὰ ἄδηλα, καὶ οἱ ἄνθρωποι ⸀οἱ περιπατοῦντες ἐπάνω οὐκ οἴδασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: ja
  text: あなたがたに災いがある。あなたがたは、目印のない墓のようなものだからだ。人々はその上を歩いても、そこに墓があることを知らない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: あなたがたは災いだ
  rationale: 警告と断罪を表す定型句。現代日本語として明瞭でありつつ、原文の厳しい響きを保った。
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: 目印のない墓
  rationale: ἄδηλα は「見えない、識別できない」の意。文脈上、墓だと見分ける印がないことを自然に表す。
- source_word: οἱ ἄνθρωποι
  choice: 人々
  rationale: 一般的な人間を指すため、性別を限定しない自然な総称とした。
- source_word: περιπατοῦντες ἐπάνω
  choice: その上を歩いても
  rationale: 墓の上を知らずに歩くという空間的な像を簡潔に保持した。
- source_word: οὐκ οἴδασιν
  choice: そこに墓があることを知らない
  rationale: 原文の目的語は明示されないが、日本語では何を知らないのかを補わないと不自然なため、直前の比喩から最小限に補った。
theological_decisions:
- issue: 目印のない墓が示す汚れの含意
  choice: 本文では比喩をそのまま提示する
  alternative: 知らないうちに人を汚す墓、と説明的に訳す
  rationale: 墓に触れることによる祭儀上の汚れは背景として想定されるが、原文はそれを明言していないため、訳文に説明を織り込まなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。短い断定文により、イエスの厳しい糾弾の調子を維持した。
