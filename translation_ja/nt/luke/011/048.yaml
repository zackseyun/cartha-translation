id: LUK.11.48
reference: Luke 11:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: ja
  text: こうして、あなたがたは先祖の行いを証しする者であり、それを是認しています。先祖たちは預言者たちを殺し、あなたがたは彼らの墓[a]を建てているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らの墓」は、直前の節にある「預言者たちの墓」を指します。
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: こうして
  rationale: 直前の非難から導かれる結論を示す推論の力を、自然な現代日本語で表す。
- source_word: μάρτυρές ἐστε
  choice: 証しし
  rationale: 直訳的な「証人である」は日本語では何の証人かが曖昧になりやすいため、彼らの行動が先祖の行いを証明しているという文脈上の働きを動詞で表した。
- source_word: καὶ συνευδοκεῖτε
  choice: それに賛同しています
  rationale: 単なる同意ではなく、先祖の行為を是認して同調する道徳的含意を保つ。
- source_word: τοῖς ἔργοις τῶν πατέρων ὑμῶν
  choice: 自分たちの先祖の行い
  rationale: πατέρων はここでは以前の世代を指すため、現代日本語で自然な「先祖」とし、ἔργοις は具体的かつ道徳的な行為を示す「行い」とした。
- source_word: ὅτι
  choice: からです
  rationale: 後半が前半の告発の根拠・説明であることを明確にする。
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ
  choice: 先祖たちは預言者たちを殺し、あなたがたは
  rationale: μέν…δέ の対照を、日本語では主語を明示して並置することで保つ。二つ目の αὐτούς が指す預言者たちも文脈に即して明示した。
- source_word: οἰκοδομεῖτε
  choice: その墓を建てている
  rationale: 動詞自体は「建てる」だが、目的語は直前の11:47にある預言者の墓から明白に補われる。日本語で裸の「建てている」は不自然なため、文脈上の目的語を本文に補った。
theological_decisions:
- issue: 「建てる」の省略された目的語を本文で補うか
  choice: 直前の節から「その墓を」を補う。
  alternative: 目的語を省き、「あなたがたは建てている」とする。
  rationale: ギリシア語では目的語が直前の節から了解されるが、日本語で省略すると意味が不自然かつ不明瞭になる。補足は新しい解釈を加えるものではなく、明示された直近の文脈を自然に再現するもの。
- issue: μάρτυρές ἐστε が何を証しするか
  choice: 先祖の行いを「証しし」と表す。
  alternative: 「証人です」と形式的に訳す。
  rationale: 与格「先祖の行いに」と συνευδοκεῖτε が続く構文では、彼らが自らの行動によって先祖の行為を証明し、同時に是認しているという告発である。日本語の「証人です」だけではこの関係が伝わりにくい。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あなたがた」「先祖」「預言者たち」により対照関係を明示した。脚注記号は節末に置き、補われた目的語の根拠を示した。
