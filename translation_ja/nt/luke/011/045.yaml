base_translation:
  language: en
  yaml_path: translation/nt/luke/011/045.yaml
  text: Then one of the lawyers answered and said to him[a], “Teacher[b], in saying these things you insult us also.”
translation:
  language: ja
  text: すると、律法の専門家[a]の一人がイエスに答えた。「先生、そのようなことを言って、私たちをも侮辱しておられます[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法学者」とも訳せる。ここでいう「律法の専門家」はユダヤの律法に通じた者であり、現代の職業としての弁護士という意味ではない。
    reason: lexical_alternative
  - marker: b
    text: 「私たちをも軽蔑しておられます」とも訳せる。この動詞には、単に気分を害するだけでなく、侮り、辱めるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: すると、…答えた
  rationale: δέによる穏やかな場面の展開を「すると」で示し、Ἀποκριθείςが直前の発言への応答であることを「答えた」で自然に表した。
- source_word: τις τῶν νομικῶν
  choice: 律法の専門家の一人
  rationale: νομικόςは現代の一般的な弁護士ではなく、モーセの律法に通じた専門家を指すため、その歴史的意味が明確になる訳語を選んだ。
- source_word: λέγει αὐτῷ
  choice: イエスに…答えた
  rationale: λέγειは歴史的現在だが、現代日本語の物語として自然な過去形にした。代名詞の指示対象は文脈上イエスなので固有名で明示した。Ἀποκριθείςと重複する「言った」は省き、発話内容を直接続けた。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとして自然であり、教える者というδιδάσκαλοςの意味を現代日本語で明瞭に伝える。
- source_word: ταῦτα λέγων
  choice: そんなことを言われると
  rationale: 直前のイエスの発言を指すταῦταと、発言することが主動詞の内容につながる分詞構文を、自然な日本語の条件的表現で表した。敬語は「先生」という呼びかけに対応する発話上の丁寧さを示す。
- source_word: καὶ ἡμᾶς
  choice: 私たちまで
  rationale: καίの付加的な力、すなわち先に非難された人々だけでなく律法の専門家たちも含まれるという含みを「まで」で表した。
- source_word: ὑβρίζεις
  choice: 侮辱している
  rationale: ὑβρίζωが表す、単に気分を害する以上の、侮り辱めるという強い意味を保持した。
