  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: ja
  text: また、卵を求めれば、さそりを与えるだろうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: また
  rationale: 直前の並行する例にもう一つの問いを加える接続表現として、καίを過度に訳し込まず、自然な日本語で連続性を示す。
- source_word: αἰτήσει
  choice: 求める
  rationale: 未来直説法が条件的な修辞疑問の中で用いられている。日本語では「求める」とすることで、父に何かを願い求める意味を簡潔に表せる。
- source_word: ᾠόν
  choice: 卵
  rationale: 語の通常の意味を直接訳した。
- source_word: ἐπιδώσει
  choice: 与えるだろうか
  rationale: 求めに応じて渡すという文脈上の意味を自然に表し、未来形を修辞疑問の「だろうか」で反映した。
- source_word: αὐτῷ
  choice: （文脈上省略）
  rationale: 受け手は卵を求める者であることが明らかであり、日本語では代名詞を明示しないほうが自然である。
- source_word: σκορπίον
  choice: さそり
  rationale: 標準的な語義。卵との鮮烈で不合理な対比を保つため、説明を加えず直接訳した。
theological_decisions:
- issue: 父と子の類比が持つ修辞的な力
  choice: 解説や「代わりに」を加えず、そのまま修辞疑問として訳す。
  alternative: 「その代わりに、さそりを与えるだろうか」と対比を明示する。
  rationale: ギリシア語は不合理な対比を暗黙のまま提示している。日本語でも含意は十分伝わるため、父の善良さについての論旨を説明的に補わない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「さそり」は一般読者に読みやすいよう平仮名表記とした。直前の文脈に続く独立した修辞疑問として自然な語順を採用した。
