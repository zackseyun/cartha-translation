  text: πλὴν τὰ ἐνόντα δότε ἐλεημοσύνην, καὶ ἰδοὺ πάντα καθαρὰ ὑμῖν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: ja
  text: しかし、内にあるものを[a]施しとして与えなさい。そして見よ、すべてのものはあなたがたにとって清いのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「持っているものを施しとして与えなさい」。このギリシア語句は、「内にあるもの」を指すとも、手元にある所有物を指すとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: しかし
  rationale: 直前の外面的な清めに対し、内面にかかわる行為を示す是正的な対比を自然な現代日本語で表す。
- source_word: τὰ ἐνόντα
  choice: 内にあるもの
  rationale: 字義的な「内にあるもの」を保ち、直前の器の外側と内側の対比に結びつける。同時に、「手元にあるもの／持っているもの」という可能な理解は脚注に残す。
- source_word: δότε
  choice: 与えなさい
  rationale: アオリスト命令形の明確な命令を、過度な相の解釈を加えずに表す。
- source_word: ἐλεημοσύνην
  choice: 施しとして
  rationale: 貧しい人への慈善的な施与を指す語であり、ギリシア語の構文に沿って「施しとして与える」とした。明示されていない受け手は本文に補わない。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 結果に注意を向けさせる修辞的な強調を、簡潔で格調ある表現として保持する。
- source_word: πάντα
  choice: すべて
  rationale: 中性複数の包括的な意味を自然に表す。
- source_word: καθαρὰ
  choice: 清く
  rationale: 直前の洗い清めと清浄をめぐる文脈とのつながりを保つ。「きれい」よりも儀礼的・道徳的含意を担える。
- source_word: ὑμῖν
  choice: あなたがたにとって
  rationale: 関係・利害の与格を明確で自然な日本語にする。
theological_decisions:
- issue: τὰ ἐνόνταと施し、清さとの関係
  choice: 「内にあるもの」とし、内面をめぐる文脈を前面に保つ
  alternative: 「持っているもの／手元にあるもの」を施しとして与える
  rationale: 11章39節の器の外側と内側の対比を受ける読みが文脈上有力だが、所有物を指す理解もギリシア語句の可能な解釈であるため、本文で一方に完全固定せず脚注に保存する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの命令と「見よ」の修辞的な力を保つため、簡潔で dignified な文体とした。本文中の脚注記号[a]は、曖昧な句の直後に置いた。
