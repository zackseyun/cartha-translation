  text: Καὶ ἦν ἐκβάλλων ⸀δαιμόνιον κωφόν· ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος ἐλάλησεν ὁ κωφός. καὶ ἐθαύμασαν οἱ ὄχλοι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: ja
  text: さて、イエスは口をきけなくする[a]悪霊を追い出していた。悪霊が出て行くと、口をきけなかった人が話し、群衆は驚嘆した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「口をきけなくする」に当たるギリシア語は、「耳が聞こえない」という意味にもなり得る。ここでは、悪霊が出て行った後にその人が話したとあるため、「口をきけなくする」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: 追い出しておられた
  rationale: ἦν＋現在分詞の迂言的未完了形が表す過去の進行中の動作を保ちつつ、イエスへの自然で品位ある敬語表現とした。
- source_word: δαιμόνιον
  choice: 悪霊
  rationale: 超自然的な存在を明示する語であり、現代日本語の聖書文体で自然な「悪霊」とした。「汚れた霊」はこの節にない語を持ち込むため避けた。
- source_word: κωφόν
  choice: 口をきけなくする
  rationale: κωφόςには「耳が聞こえない」と「口がきけない」の両義があるが、直後にその人が話したとあるため、ここでは発話不能に焦点がある。形容語が悪霊を修飾している構文も明確にした。
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: 悪霊が出て行くと
  rationale: 属格絶対による先行動作と、それに続く出来事を簡潔で自然な日本語にした。ἐγένετοは物語の展開を示すため、独立した「起こった」を機械的に訳出しなかった。
- source_word: ἐλάλησεν
  choice: 話し出し
  rationale: 基本義は「話した」だが、発話不能だった人が発話したという文脈では「話し出した」が自然で、状態の変化を明瞭に伝える。
- source_word: ὁ κωφός
  choice: 口をきけなかった人
  rationale: 実体詞的形容詞を自然な日本語で表し、性別を明示しないギリシア語本文に不要な「男」を補わなかった。
- source_word: ἐθαύμασαν
  choice: 驚嘆した
  rationale: 単なる驚きにとどまらない、驚異の念を伴う θαυμάζω の語感を、現代的で品位ある日本語で表した。
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語では集合的な「群衆」が自然であり、意味上の複数性を損なわない。
theological_decisions:
- issue: 苦しみの原因と悪霊追放の描写
  choice: 悪霊が実際に追い出され、その結果として人が話せるようになったという本文の描写をそのまま訳す。
  alternative: 超自然的表現を弱め、単なる病状の現象的記述として訳す。
  rationale: 本文は δαιμόνιον とその退出を明記し、それに続いて発話が回復したと叙述しているため、その主張を弱めも膨らませもしない。
- issue: κωφόςの曖昧性
  choice: 本文では文脈に即して「口をきけない」と訳し、別の語義を注記する。
  alternative: 「耳が聞こえない」と本文で訳す。
  rationale: κωφός自体には聴覚障害と発話障害の両義があるが、悪霊の退出後に「話した」とあるので、発話不能がこの場面の焦点である。ただし語彙上の曖昧性は注で保存する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語としての簡潔さと聖書本文にふさわしい品位を両立させた。「さて」で場面の進行を示し、イエスの動作には「おられた」を用いた。注記マーカーは該当節末に置いた。
