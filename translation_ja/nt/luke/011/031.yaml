id: LUK.11.31
reference: Luke 11:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: ja
  text: 南の女王は、裁きの時に、この世代の男たちと共に立ち上がり、彼らを罪に定める[a]。彼女はソロモンの知恵を聞くために、地の果てからやって来たからである。そして見よ、ここにソロモンよりまさるものがある[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この女王は、一般にシェバの女王と同一視されている（列王記第一10章1～13節、歴代誌第二9章1～12節参照）。
    reason: cross_reference
  - marker: b
    text: 別訳「ソロモンよりまさる方」。ギリシャ語は中性形で、直訳すると「ソロモンよりまさるもの」となる。そのため、単なる人物同士の直接比較を超えた意味を含む可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: 南の女王
  rationale: 属格を字義どおりに生かし、旧約のシェバの女王への言及を暗示しつつ、本文中でその同定を確定しない。
- source_word: ἐγερθήσεται
  choice: 立ち上がり
  rationale: 裁きの場に現れて証言する司法的な情景と、終末における復活の響きの双方を保ち、どちらか一方に限定しない。
- source_word: ἐν τῇ κρίσει
  choice: 裁きの時に
  rationale: 定冠詞のある終末的な裁きを、日本語として自然かつ明確に示す。
- source_word: μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης
  choice: この世代の男たちと共に
  rationale: ἀνδρῶν の男性を表す語義と、γενεά が指すイエスと同時代の世代を保持する。
- source_word: κατακρινεῖ αὐτούς
  choice: 彼らを罪に定める
  rationale: 単に判断するのではなく、有罪とする κατακρίνω の強い意味を表す。
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: 地の果てから
  rationale: 非常に遠い場所を表す慣用的・誇張的表現を簡潔に保つ。
- source_word: ἀκοῦσαι τὴν σοφίαν Σολομῶνος
  choice: ソロモンの知恵を聞くために
  rationale: 不定詞の目的用法と、求められた対象がソロモンの知恵であることを忠実に表す。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 結論に注意を向ける荘重な談話標識として訳す。
- source_word: πλεῖον Σολομῶνος
  choice: ソロモンより偉大なもの
  rationale: 中性形 πλεῖον を「者」と人格化せず、人物だけでなく、ここに臨在するより大きな現実を含み得る原文の幅を保つ。
- source_word: ὧδε
  choice: ここには…ある
  rationale: 現在その場に存在することを自然な日本語で示す。
theological_decisions:
- issue: 南の女王をシェバの女王と本文で明示するか
  choice: 本文では「南の女王」とした
  alternative: シェバの女王
  rationale: 旧約への言及は明白だが、ギリシャ語本文の表現を優先し、同定は脚注に置く。
- issue: πλεῖον Σολομῶνος を人格化するか
  choice: 「ソロモンより偉大なもの」とした
  alternative: ソロモンより偉大な方
  rationale: 原文の中性形を保ち、イエスの人格のみを直接比較する読みと、イエスにおいて到来した王国・働き・知恵を含む読みとの緊張を解消しない。
- issue: ἐγερθήσεται を復活として明示するか
  choice: 「立ち上がり」とした
  alternative: よみがえらされ
  rationale: 終末的復活の響きを排除せず、同時に裁きの場で立って証言するという司法的意味にも限定をかけない。
translation_notes:
  register: 明瞭で現代的ながら荘重さを保つ文体。「見よ」は原文の修辞的な力を維持するために採用した。「罪に定める」は日常語よりやや改まった司法的表現だが、κατακρίνω の意味を正確に伝える。
