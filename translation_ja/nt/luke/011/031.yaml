  to: 南の女王は、裁きの時に、この世代の男たちと共に立ち上がり、彼らを罪に定める[a]。彼女はソロモンの知恵を聞くために、地の果てからやって来たからである。そして見よ、ここにソロモンよりまさるものがある[b]。
