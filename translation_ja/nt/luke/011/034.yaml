  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: ja
  text: あなたの体のともしびは目です。あなたの目が健全なら[a]、全身も光に満ちています。しかし、目が悪ければ[b]、あなたの体も暗いのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「健全」は、「澄んでいる」「純一である」「一つに定まっている」とも訳せる。ギリシア語は、分裂していないことや健全であることを表し得る。ここでは「悪い」目と対比されている。
    reason: lexical_alternative
  - marker: b
    text: 「邪悪なら」とも訳せる。ギリシア語は「悪い」と「邪悪な」の両方を意味し得るため、目の不具合と道徳的に歪んだ見方の双方が示唆されている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: ともしび
  rationale: 具体的な灯火を指す語であり、目を体を照らす光源にたとえる比喩を自然で格調ある日本語で保つ。
- source_word: σῶμα
  choice: 体／全身
  rationale: 基本義である身体を保ち、ὅλονを伴う箇所では自然な日本語として「全身」とした。
- source_word: ὀφθαλμός
  choice: 目
  rationale: 身体器官としての目をそのまま訳し、知覚や内面の状態へ広がる比喩を保持する。
- source_word: ἁπλοῦς
  choice: 健全
  rationale: 目が正しく機能する状態を表し、対語の「悪い」との身体的な対照を明確にする。一方で、原語にある単一性、純一さ、誠実さの含みは脚注に残す。
- source_word: φωτεινός
  choice: 光に満ちている
  rationale: 単に「明るい」だけでなく、光を帯びているという形容詞の像を自然な日本語で表す。
- source_word: πονηρός
  choice: 悪い
  rationale: 機能的な不良と道徳的な悪の双方を含み得る原語の幅を、過度に限定せず保つ。
- source_word: σκοτεινός
  choice: 暗い
  rationale: 「光に満ちている」との明暗の対照を簡潔に保つ。
- source_word: ὅταν ... ᾖ / ἐπὰν ... ᾖ
  choice: …なら／…ければ
  rationale: 一般的な条件・時を表す接続法構文を、並行関係が伝わる自然な現代日本語にした。
theological_decisions:
- issue: 「あなたの目がἁπλοῦςである」の意味
  choice: 本文では「健全」とする
  alternative: 澄んでいる／純一である／一つに定まっている／気前がよい
  rationale: 直接の文脈は、目という身体器官と全身の明暗との関係を描くため、正しく機能する目を示す「健全」が最も明瞭である。ただし、原語が持ち得る純一さや分裂のなさという倫理的含意を否定せず、脚注で示す。「気前がよい」という語義の広がりもあり得るが、この節の目と光の比喩では本文に採用しない。
- issue: πονηρόςの身体的・道徳的含意
  choice: 本文では「悪い」とする
  alternative: 邪悪な／病んだ／不健全な
  rationale: 「邪悪な」では道徳的意味に限定され、「病んだ」では身体的意味に限定される。「悪い」は、欠陥のある目と歪んだ内的知覚の双方を示し得る緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「ともしび」「光に満ちる」によって原文の具体的な光の比喩と格調を保った。「健全」「悪い」は日常的に理解でき、原語の意味を一方向に決めすぎない表現である。
