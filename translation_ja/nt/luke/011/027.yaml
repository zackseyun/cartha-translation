reference: Luke 11:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ λέγειν αὐτὸν ταῦτα ἐπάρασά τις ⸂φωνὴν γυνὴ⸃ ἐκ τοῦ ὄχλου εἶπεν αὐτῷ· Μακαρία ἡ κοιλία ἡ βαστάσασά σε καὶ μαστοὶ οὓς ἐθήλασας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: ja
  text: さて、イエスがこれらのことを話しておられたとき、群衆の中からある女が声を張り上げて[a]、イエスに言った。「あなたを宿した胎[b]と、あなたが乳を飲んだ乳房は幸いです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「声を上げて」。大声で呼びかけることを表すギリシア語の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたを身ごもった胎」。ギリシア語の動詞には、妊娠中に担い、運ぶという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: さて
  rationale: ルカの物語を進める移行表現として自然な現代日本語を用いた。「すると」だけでは後続する同時進行の構文と重なりやすいため、「さて」とした。
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: イエスがこれらのことを話しておられると
  rationale: ἐν＋冠詞付き不定詞が表す同時進行を「話しておられると」で示し、ταῦταも「これらのこと」として保持した。
- source_word: ἐπάρασά τις φωνὴν γυνὴ
  choice: 一人の女が声を張り上げて
  rationale: τιςは不定の一人を示す自然な表現とし、ἐπαίρω φωνήνの慣用的意味を、力強く声を出すことが明確な「声を張り上げる」で表した。
- source_word: ἐκ τοῦ ὄχλου
  choice: 群衆の中から
  rationale: 発言者が群衆の中にいたことと、そこから声が上がったことを自然に表す。
- source_word: Μακαρία
  choice: 幸いです
  rationale: 単なる一時的感情としての幸福ではなく、恵まれた状態への祝福的な称賛を表す、日本語聖書で定着した語を選んだ。
- source_word: ἡ κοιλία ἡ βαστάσασά σε
  choice: あなたを宿した母胎
  rationale: 母性の文脈におけるκοιλίαを「母胎」とし、βαστάζωが示す妊娠中に担い運ぶ意味を、自然な日本語の「宿した」で表した。出産そのものに意味を限定しない。
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: あなたが乳を飲んだ乳房
  rationale: 原文ではイエスが乳房から乳を吸ったという能動表現であるため、「乳房が授乳した」と主体を入れ替えず、現代日本語で自然かつ具体的に訳した。
theological_decisions:
- issue: イエスの母をたたえる発言におけるμακαρίαの訳し方
  choice: あなたを宿した母胎と、あなたが乳を飲んだ乳房は幸いです
  alternative: あなたを産んだ母と、あなたを育てた母は祝福されています
  rationale: 原文は母親を抽象的に述べず、母胎と乳房という換喩的で具体的な表現によって称賛する。その具体性と祝福的な力を保ちつつ、後代のマリア論的意味を加えたり、この称賛を弱めたりしない。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、発言部分の身体的な比喩を婉曲化せず、聖書本文にふさわしい品位を保った。「女」はγυνήの直接的な訳として用い、侮蔑的な含みはない。
