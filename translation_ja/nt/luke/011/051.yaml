id: LUK.11.51
reference: Luke 11:51
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: ja
  text: アベルの血から、祭壇と神殿[b]の間で死んだゼカリヤ[a]の血に至るまでである。そうです、あなたがたに言います。その血の責任が、この世代から追及されます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで言うゼカリヤが誰かについては議論があり、エホヤダの子ゼカリヤ（歴代誌第二24章20～22節）や、ベレクヤの子ゼカリヤなどの説がある。
    reason: cross_reference
  - marker: b
    text: 直訳「祭壇と家の間」。ここで「家」は神殿を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: アベルの血から……ゼカリヤの血に至るまで
  rationale: ἀπόとἕωςが作る範囲を明確に保ち、「血」が流血とその責任を含意する聖書的表現であることも残した。
- source_word: τοῦ ἀπολομένου
  choice: 死んだ
  rationale: ἀπόλλυμιの中動態分詞が表す死を自然な現代日本語で示し、受動の「殺された」として加害者の行為を明示しすぎないようにした。
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: 祭壇と神殿の間
  rationale: οἶκοςの字義は「家」だが、ここでは神殿建物を指すため、本文では文脈上明瞭な「神殿」とし、字義を脚注に残した。
- source_word: ναί, λέγω ὑμῖν
  choice: そうだ、あなたがたに言う
  rationale: ναίの強い肯定と、λέγω ὑμῖνの荘重な宣言を、明瞭で自然な日本語にした。
- source_word: ἐκζητηθήσεται
  choice: その血の責任が問われる
  rationale: 前文脈の「血」を受ける受動形を、流血についての神の追及・責任要求という司法的含意が伝わる表現にした。行為主体は原文どおり明示しない。
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: この世代に
  rationale: γενεάを同時代の世代として保ち、ἀπόが表す責任追及の対象を、日本語の「責任が問われる」と自然に結び付けた。
theological_decisions:
- issue: ゼカリヤの同定
  choice: 本文では単に「ゼカリヤ」とし、人物を特定しない
  alternative: エホヤダの子ゼカリヤ、またはベレクヤの子ゼカリヤと特定する
  rationale: 本文は父名などを示しておらず、どのゼカリヤかについて議論があるため、その曖昧さを保持した。
- issue: 「この世代」が負う責任の範囲
  choice: 原文どおり「この世代」とし、その範囲を教理的に拡張も限定もしない
  alternative: 特定の民族・全人類・後代までを明示的に含む表現にする
  rationale: イエスが語りかけた世代への裁きの宣言をそのまま保ち、本文にない体系的解釈を加えない。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、イエスの厳粛な宣告にふさわしい格調を保った。「この世代」「血」という原文の緊張を保ち、ゼカリヤの身元や責任の神学的範囲は本文で決着させていない。
