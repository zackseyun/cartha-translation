  to: アベルの血から、祭壇と神殿[b]の間で死んだゼカリヤ[a]の血に至るまでである。そうです、あなたがたに言います。その血の責任が、この世代から追及されます。
  rationale: 主な修正は、ἀπὸ τῆς γενεᾶς ταύτηςの方向性を「この世代から」に反映したことである。「その血の責任が追及されます」は、流された血に関する責任が要求されるというἐκζητηθήσεταιの司法的受動表現を自然な日本語で保つ。あわせて、直接話法を明瞭な現代標準語に整えた。ゼカリヤの同定、οἶκοςの字義、および本文の神学的曖昧さは変更していない。
