lexical_decisions:
- source_word: ἕτεροι
  choice: ほかの者たち
  rationale: 直前の人々とは別の一団を指す対照を、自然な現代日本語で表す。
- source_word: δὲ
  choice: しかし
  rationale: 前の反応とは異なる動きを示す穏やかな対照として訳す。
- source_word: πειράζοντες
  choice: イエスを試そうとして
  rationale: 敵対的な意図を伴う試みを表し、単なる誘惑とは限定しない。目的語のイエスは文脈から補う。
- source_word: σημεῖον
  choice: しるし
  rationale: 奇跡的性格を文脈に委ね、語そのものの幅を保つ。
- source_word: ἐξ οὐρανοῦ
  choice: 天からの
  rationale: しるしの天的な起源または認証を示す表現として素直に訳す。
- source_word: ἐζήτουν
  choice: 求めていた
  rationale: 未完了過去の継続的な動作を自然に表す。
- source_word: παρ’ αὐτοῦ
  choice: イエスに
  rationale: 求める相手・入手源がイエスであることを日本語として明瞭に示す。
theological_decisions:
- issue: 求められたしるしの性質
  choice: 天からのしるし
  alternative: 天的なしるし
  rationale: 天に由来する、または天によって認証されたしるしという原文の幅を保ち、具体的な神学的意味を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イエス」を二度明示することで、分詞の対象と求める相手を誤解なく伝える。
