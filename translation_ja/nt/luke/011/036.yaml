id: LUK.11.36
reference: Luke 11:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: ja
  text: だから、あなたの体全体が明るく、暗い部分が少しもないなら、ちょうど灯火がその輝きであなたを照らすときのように、全体が明るいものとなる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「灯火がその閃光であなたを照らすときのように」。ギリシア語は「稲妻」「閃光」「輝き」を意味し得るが、灯火が主語であるここでは、文字どおりの稲妻ではなく、灯火の放つ輝きを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: 体
  rationale: 語の基本義を保ち、直前の「目」と「灯火」に結びつく身体的な比喩を解釈的に言い換えない。
- source_word: ὅλον
  choice: 全体
  rationale: 二度の用例で、余すところのない全体性を自然な現代日本語で示す。
- source_word: φωτεινόν
  choice: 明るい
  rationale: 「暗い」との対照を明確にしつつ、形容詞としての表現を簡潔に保つ。
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: 暗い部分が少しもない
  rationale: 否定のもとにある不定表現 μέρος τι の意味を「少しもない」で自然に示し、具体的な「部分」の像を保つ。
- source_word: ἔσται
  choice: 明るくなる
  rationale: 未来形を日本語の自然な変化表現で示す。前半と後半が同義反復的に見える原文の緊張は残す。
- source_word: ὡς ὅταν
  choice: 時のようである
  rationale: 比較と時間の両要素を保つ自然な表現。
- source_word: λύχνος
  choice: 灯火
  rationale: 携帯できる油皿などの具体的な明かりを指し、「光」や「燭台」と区別する。聖書本文にふさわしい品位も保つ。
- source_word: τῇ ἀστραπῇ
  choice: その輝きで
  rationale: ἀστραπή は稲妻、閃光、輝きを表し得るが、ここでは灯火が主語なので、その放つ輝きと理解するのが文脈上自然である。別訳を脚注に示す。
- source_word: φωτίζῃ σε
  choice: あなたを照らす
  rationale: 人称目的語 σε を明示し、光を与えるという動作を自然な日本語で表す。
theological_decisions:
- issue: 「体」と「光」の比喩的意味
  choice: 身体と光の像をそのまま保持する
  alternative: 「内面」「霊的状態」「人格全体」などと解釈的に言い換える
  rationale: 直前の「目は体の灯火」という文脈に基づく比喩であり、魂や道徳的状態についての特定の教理へ翻訳段階で限定しない。
- issue: 条件節と帰結節の反復
  choice: 「体全体が明るいなら、全体が明るくなる」という原文の反復を保持する
  alternative: 帰結を「完全に照らされる」などと説明的に区別する
  rationale: 原文自体にある表現上・意味上の緊張を、調和的な意訳で解消しない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。身体・暗闇・灯火という具体的な比喩を保ちつつ、不自然な逐語調を避けた。脚注記号は本文末に配置し、比較表現全体の語彙的別訳を示す。
