source:
  edition: SBLGNT
  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: ja
  text: すると、その人は中からこう答える。『面倒をかけないでくれ。[a] 戸はもう閉まっている。[b] 子どもたちも私と一緒に寝床に入っている。[c] 起き上がって、あなたに渡すことはできない。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「迷惑をかけないでくれ」「これ以上わずらわせないでくれ」。ギリシア語は直訳すると「私に苦労をもたらすな」という慣用的な表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「戸はもう閉めてある」。ギリシア語の完了形は、閉める動作がすでに完了したことにも、その結果として閉まっている状態にも重点を置き得る。
    reason: lexical_alternative
  - marker: c
    text: 「寝床」は、当時の家庭で家族が共に休む就寝場所を指し、夫婦の性的な親密さを意味しない。
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: すると、その人は家の中から答える
  rationale: 物語の流れと屋外にいる訪問者との位置的対比を自然な現代日本語で示した。「答えて言う」という重複表現は、日本語では意味を損なわない範囲で「答える」にまとめた。
- source_word: Μή μοι κόπους πάρεχε
  choice: 面倒をかけないでくれ
  rationale: 直訳的には「私に苦労をもたらすな」という慣用句であり、迷惑や厄介をかけるなという意味を、口頭の拒絶として自然に表した。
- source_word: ἡ θύρα κέκλεισται
  choice: 戸はもう閉めてある
  rationale: 完了形が示す、閉める動作の完了と現在も続く結果状態の双方を「閉めてある」で表した。「鍵が掛かっている」とまでは原文にないため避けた。
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: 子どもたちも私と一緒に寝床に入っている
  rationale: εἰς τὴν κοίτην の方向性を含む表現を「寝床に入っている」とし、家族が同じ就寝場所にいる情景を自然に示した。
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: 起きて、あなたに何かを与えることはできない
  rationale: ἀναστὰς を、与えるために必要な先行動作として「起きて」と表した。目的語は直前のパンを指す文脈上省略されているため、日本語として必要な「何かを」を補った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら品位のある口語調。家の中の人物による直接話法では、「〜してくれ」を用いて、夜中に起こされた際の率直な拒絶を表した。「ベッド」は避け、共同の就寝場所を想起させる「寝床」とした。
