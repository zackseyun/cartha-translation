  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: ja
  text: あなたがたのうち、父親である人のだれが、息子が魚を求めたとき、魚の代わりに蛇を与えるでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: あなたがたのうち、父親である者のだれが
  rationale: 聞き手の中にそのような父親がいるだろうかと問う修辞疑問の力を保ちつつ、現代日本語として自然な形にした。
- source_word: αἰτήσει ὁ υἱὸς ἰχθύν
  choice: 息子に魚を求められたとき
  rationale: ギリシア語では「息子が魚を求める」という関係である。日本語では父親を主語とする文の流れに合わせ、受け身の条件表現にすることで意味を明確かつ自然に伝えた。未来形は一般的な仮定を含む修辞疑問として表した。
- source_word: ἰχθύν / ἰχθύος
  choice: 魚／魚
  rationale: 具体的な同一物を指す単数形の反復を保った。日本語では冠詞による単複の表示を要しないため、自然に「魚」とした。
- source_word: ἀντὶ
  choice: 代わりに
  rationale: 一方を求められながら別のものを渡すという置換の意味を明確に表す。
- source_word: ὄφιν
  choice: 蛇
  rationale: ὄφιςの通常の意味を、象徴的含意を不必要に加えず、現代日本語で簡潔に表した。
- source_word: αὐτῷ ἐπιδώσει
  choice: 与えるでしょうか
  rationale: 受け手である息子は直前の文脈から明白なので、日本語では代名詞を重ねずに表現した。未来形を修辞疑問にふさわしい「でしょうか」で反映した。
theological_decisions: []
