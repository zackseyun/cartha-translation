  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: ja
  text: ところが、そのファリサイ派の人は、イエスが食事の前にまず清めの洗いをなさらなかった[a]のを見て、驚いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「食事の前にまず儀礼的な洗いをなさらなかった」。原語の動詞は、他の文脈では「洗礼を受ける」と訳されることが多いが、ここではファリサイ派の清浄慣行に基づく洗いを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: ところが
  rationale: 前節から物語を進めつつ、イエスの行動に対するファリサイ派の人の反応との緩やかな対比を自然に示す。
- source_word: ὁ Φαρισαῖος
  choice: ファリサイ派の人
  rationale: 人物が属する宗教的集団を、現代日本語で分かりやすく表す。定冠詞は文脈上特定される人物として自然に反映した。
- source_word: ἰδὼν
  choice: …のを見て
  rationale: 主動詞に先立つ認識を表すアオリスト分詞を、自然な時間・契機の関係として訳した。
- source_word: ἐθαύμασεν
  choice: 驚いた
  rationale: 予想に反する行動を目にした反応を簡潔かつ自然に表す。文脈上の非難や不快感までは本文に明示されないため加えない。
- source_word: οὐ πρῶτον ἐβαπτίσθη
  choice: まず身を清める洗いをなさらなかった
  rationale: ここでは食前の清浄慣行を指し、キリスト教の洗礼を意味しない。受動形は自分の身に洗いを施す中動的意味合いを持つため、敬語を用いつつ儀礼的な洗いであることを明確にした。
- source_word: πρὸ τοῦ ἀρίστου
  choice: 食事の前に
  rationale: ἄριστονは朝または昼の食事を指し得るが、時刻を特定せず文脈に必要な意味を保つ。
theological_decisions:
- issue: ファリサイ派の食事の文脈におけるἐβαπτίσθηの意味
  choice: 身を清める洗いをする
  alternative: 洗礼を受ける／身を浸す
  rationale: 食前の清浄慣行が直接の文脈であり、キリスト教の洗礼を場面に持ち込まない。一方で、原語が通常「洗礼を授ける／受ける」にも用いられる語であることは脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスを主語とする従属節には自然な敬語を用いた。「身を清める洗い」により日常的な手洗いだけに狭めず、儀礼的背景を本文でも示した。
