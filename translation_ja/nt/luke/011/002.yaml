id: LUK.11.2
reference: Luke 11:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: ja
  text: 'イエスは彼らに言われた。「祈るときには、こう言いなさい。


    『父よ[a]、


    あなたの御名が聖とされますように。


    あなたの国[b]が来ますように。』」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本の中には、マタイ6:9との影響により「私たちの父よ」とするものがある。ここで採用したギリシア語本文は、単に「父よ」とする。
    reason: alternative_reading
  - marker: b
    text: 「国」は「王としての支配」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: 祈るときには
  rationale: ὅτανと接続法による一般的・反復的な時の条件を、自然な現代日本語で表した。「祈るたびに」も可能だが、反復を必要以上に強調しない。
- source_word: λέγετε
  choice: こう言いなさい
  rationale: 現在命令形の継続的・習慣的な含みを保ちつつ、祈りの文言を導く日本語として自然にした。
- source_word: Πάτερ
  choice: 父よ
  rationale: 呼格を簡潔に訳し、本文にない「私たちの」や「天におられる」を補わなかった。
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: あなたの御名が聖とされますように
  rationale: アオリスト受動命令形の祈願的な力と受動態を保った。「御名」は神の名への敬意を自然に示し、「聖とされる」はその名が聖なるものとして認められ、扱われることを表す。
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: あなたの国が来ますように
  rationale: アオリスト命令形を祈願として訳した。βασιλείαの「国」と「王としての支配」の意味の広がりを狭めすぎないよう、本文では定着した「国」を採用した。
theological_decisions:
- issue: 神への呼びかけに「私たちの」を補うか
  choice: 父よ
  alternative: 私たちの父よ／天におられる私たちの父よ
  rationale: 提示されたSBLGNT本文はΠάτερのみであり、マタイ6:9との調和や後代の典礼形を本文に持ち込まない。
- issue: 神の御名が「聖とされる」という祈願
  choice: あなたの御名が聖とされますように
  alternative: あなたの御名があがめられますように
  rationale: 神の御名そのものの聖性が欠けているという意味に限定せず、人々の間で聖なるものとして認められ扱われることを願う受動表現を保持した。「あがめられる」は自然だが、ἁγιάζωの「聖」の語義を弱める。
- issue: βασιλείαの意味
  choice: 国
  alternative: 支配／王としての支配
  rationale: 神の統治という動的意味と、到来する国という終末的含意の両方を残すため、本文では「国」とし、別訳を注記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りにふさわしい簡潔で品位ある調子と行分けを採用した。「御名」以外は過度に典礼的な語彙を避け、原文の簡潔さと並行構造を保った。
