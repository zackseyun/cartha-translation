id: LUK.11.22
reference: Luke 11:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: ja
  text: しかし、その者より強い者が攻めて来て、その者を打ち負かすと[a]、その者が頼みにしていた武具一式[b]を奪い取り、その戦利品[c]を分配する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「打ち勝つ」、または「征服する」。
    reason: lexical_alternative
  - marker: b
    text: 「武具一式」は、完全に一そろいの武具を指す語の訳。
    reason: lexical_alternative
  - marker: c
    text: 別訳「分捕り物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: しかし、…すると
  rationale: δέの前節との対照を「しかし」で示し、ἐπάνの条件的・時間的な意味を自然な現代日本語の「すると」で表した。
- source_word: ἰσχυρότερος αὐτοῦ
  choice: その者より強い者
  rationale: 比較級が名詞的に用いられているため、原文に明示されていない「男」を補わずに訳した。
- source_word: ἐπελθὼν
  choice: 攻めて来て
  rationale: 相手に向かって来る意味を、争いと武装解除という文脈に即して自然に表した。「襲いかかって」ほど激しい動作を限定しない。
- source_word: νικήσῃ αὐτόν
  choice: その者を打ち負かす
  rationale: 勝利して相手を制圧する意味を明瞭に示す。「征服する」より場面に即し、過度に抽象的でもない。
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: その者が…武具一式
  rationale: πανοπλίαが完全な一そろいの武具を指すことを「武具一式」で簡潔に表した。所有者が敗者であることも日本語で明確にした。
- source_word: αἴρει
  choice: 奪い取り
  rationale: 勝者が敗者の武具を取り去る場面なので、単なる移動ではなく没収の含みを持つ自然な表現とした。
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: 頼みにしていた
  rationale: 武具に継続的な信頼を置いていたことを、現代日本語で自然に表した。
- source_word: τὰ σκῦλα αὐτοῦ
  choice: その戦利品
  rationale: σκῦλαの、敗者から得た分捕り物という軍事的な意味を「戦利品」で保持した。
- source_word: διαδίδωσιν
  choice: 分配する
  rationale: 複数の相手に分け与える、または割り当てるという動詞の意味を直接表した。
theological_decisions:
- issue: より強い者を明示的に「強い男」とするか
  choice: 「その者より強い者」とし、「男」を補わない。
  alternative: 「その者より強い男」
  rationale: 原文では比較級形容詞が名詞的に使われ、名詞「男」は明示されていない。前節とのつながりは保ちつつ、本文以上に人物像を限定しない。
- issue: νικάωの勝利の強さをどう表すか
  choice: 「打ち負かす」
  alternative: 「打ち勝つ」「征服する」「制圧する」
  rationale: 武具を奪う結果に至る具体的な敗北を示しながら、比喩の登場人物をサタンやイエスと本文中で明示するような神学的説明は加えない。
- issue: 所有を表すαὐτοῦをどの人物に結び付けるか
  choice: 武具については敗者を指す「その者が頼みにしていた」とし、戦利品は「その戦利品」とする。
  alternative: 代名詞をすべて「彼の」として曖昧さを形式的に残す。
  rationale: ギリシア語の統語と場面では武具を頼みとしていたのは敗者であり、日本語の「彼」は主語の取り違えを招く。指示対象を自然に示しつつ、戦利品の内容や神学的指示対象までは特定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。比喩の軍事的イメージを維持しつつ、古風な「甲冑」や説明的すぎる神学用語を避けた。反復される代名詞の指示対象は、日本語で誤読されない範囲で「その者」と明示した。
