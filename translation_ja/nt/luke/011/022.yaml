  source_fidelity: 原文の条件的・時間的な対比（ἐπὰν δέ）、比較級を名詞的に用いる表現、相手に向かって来て打ち負かすという展開、頼みとしていた完全な武具を取り去ること、そして戦利品を分配することが、いずれも適切に訳出されている。「攻めて来て」はこの対決・武装の文脈におけるἐπελθώνの自然で許容される具体化であり、過度な神学的解釈ではない。
  naturalness: 明瞭な現代標準日本語であり、反復される「その者」はギリシア語の代名詞関係を日本語で誤読なく追えるようにしている。「武具一式」「頼みにしていた」「分配する」も文脈に合う。
