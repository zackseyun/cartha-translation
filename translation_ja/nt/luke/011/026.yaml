id: LUK.11.26
reference: Luke 11:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: ja
  text: それから、その霊は行って、自分よりも悪いほかの七つの霊を連れて来る[a]。そして、それらは中に入って、そこに住み着く[b]。こうして、その人の後の状態は、初めよりも悪くなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節のギリシア語は単に「霊」と言っており、「悪霊」や「汚れた霊」とは明記していない。ただし、文脈と「自分よりも悪い」という表現から、敵対的な霊であることは明らかである。
    reason: lexical_alternative
  - marker: b
    text: 「中に入って」に当たるギリシア語は複数形だが、「住み着く」に当たる動詞は単数形である。本文は、直前の複数の霊に沿って複数として訳している。
    reason: textual_grammar
lexical_decisions:
- source_word: τότε
  choice: そこで
  rationale: 出来事の時間的な進行と、その結果として次の行動に移る流れの両方を自然な日本語で示す。
- source_word: πορεύεται
  choice: 出て行き
  rationale: 文脈上、霊がその場所を離れてほかの霊を連れて来る動きを表すため、「行き」だけより明確で自然。
- source_word: παραλαμβάνει
  choice: 連れて来る
  rationale: 自分と一緒に伴うという意味を表し、後続の「中に入って」と自然につなげる。
- source_word: ἕτερα πνεύματα
  choice: ほかの霊
  rationale: ἕτερα はここでは同類の別の存在を指し、πνεύματα 自体には「悪霊」や「汚れた」という語が明記されていないため、「霊」とした。
- source_word: πονηρότερα ἑαυτοῦ
  choice: 自分よりも悪い
  rationale: 比較の相手が戻って来る霊自身であることを保ち、πονηρός の道徳的・敵対的な性質を平明に表す。
- source_word: εἰσελθόντα
  choice: それらは中に入って
  rationale: 中性複数の分詞が複数の霊を受けることを明示し、自然な日本語の継起表現にした。
- source_word: κατοικεῖ ἐκεῖ
  choice: そこに住み着く
  rationale: 一時的にいるのではなく、居所として定着する含みを「住み着く」で表した。ギリシア語の動詞が単数形である点は脚注に示す。
- source_word: τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου
  choice: その人の後の状態
  rationale: 直訳的な「最後のもの」ではなく、前後の状態を対比する慣用的意味を明瞭に表す。
- source_word: χείρονα τῶν πρώτων
  choice: 初めよりも悪くなる
  rationale: 後の状態と以前の状態との比較を簡潔に保持する。
theological_decisions:
- issue: πνεύματα を「悪霊」と明示するか
  choice: 霊
  alternative: 悪霊／汚れた霊
  rationale: 文脈上は敵対的な霊だが、この節の名詞そのものは単に「霊」である。本文に原文にない限定語を加えず、「自分よりも悪い」によって性質を示した。
- issue: ἀνθρώπου の訳語
  choice: その人
  alternative: その男
  rationale: ἄνθρωπος はここで一人の人間を指し、生物学的な男性を強調する必要はない。現代日本語では「その人」が正確で自然。
- issue: 複数の分詞 εἰσελθόντα と単数動詞 κατοικεῖ の不一致
  choice: 意味上の複数を本文に反映して「それらは…住み着く」
  alternative: 「それは…住み着く」と単数形を表面上維持する
  rationale: 直前の七つの霊を受ける複数分詞に従うと、複数主体として訳すのが文脈上自然である。ただし、伝承本文の単数動詞という緊張は脚注で明示した。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスの教えにふさわしい落ち着いた語調を保った。「住み着く」は κατοικεῖ の定住性を自然に伝え、「後の状態」は τὰ ἔσχατα と τὰ πρῶτα の対比を普通の読者に分かりやすく示す。
