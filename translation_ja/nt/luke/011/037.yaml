  to: イエスが話しておられると、一人のファリサイ人が、イエスに一緒に食事をしてほしいと頼んだ。そこでイエスは中に入り、食卓に着いた[a]。
  rationale: 原文の歴史的現在は自然な日本語の物語過去で表した。「ファリサイ人」を標準的な集団名として用い、παρ’ αὐτῷは「一緒に食事をしてほしい」として、居所への限定を加えずに招待者との食事という意味を表した。ἀνέπεσενの文化的に特有な姿勢は、読みやすい本文と対応の明確な注で伝える。
