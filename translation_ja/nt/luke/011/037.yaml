  text: Ἐν δὲ τῷ λαλῆσαι ⸀ἐρωτᾷ αὐτὸν ⸀Φαρισαῖος ὅπως ἀριστήσῃ παρ’ αὐτῷ· εἰσελθὼν δὲ ἀνέπεσεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: ja
  text: イエスが話しておられると、一人のファリサイ人が、イエスに一緒に食事をしてほしいと頼んだ。そこでイエスは中に入り、食卓に着いた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「横になった」。当時、正式な食事では寝台に横になって食べる習慣があった。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: イエスが話しておられると
  rationale: ἐν＋冠詞付き不定詞が示す同時進行の時間関係を自然な日本語で表した。文脈上の主語イエスを明示し、敬意を含む現代標準語とした。
- source_word: ἐρωτᾷ
  choice: 頼んだ
  rationale: 語義は「尋ねる」だけでなく「求める、頼む」を含み、ὅπως節の内容を受けて食事への招きを表す。ギリシア語の歴史的現在は、日本語の自然な物語時制として過去形にした。
- source_word: Φαρισαῖος
  choice: あるファリサイ派の人
  rationale: 不定の単数であることを「ある」で示し、現代日本語で集団への所属が分かる表現とした。
- source_word: ὅπως ἀριστήσῃ
  choice: 食事をしてほしいと
  rationale: ἀριστάωは朝または昼の食事を取る意味になり得るが、ここでは時刻を特定せず、食事への招待という広い意味を保った。
- source_word: παρ’ αὐτῷ
  choice: 自分のところで
  rationale: 直訳的には「彼のもとで／彼とともに」。家とは明記されていないため場所を過度に限定せず、招待者のところで食事をする意味を自然に表した。
- source_word: εἰσελθὼν δὲ
  choice: そこでイエスは中に入り
  rationale: 主動詞に先行するアオリスト分詞を順次的な動作として訳し、日本語で主語を補った。
- source_word: ἀνέπεσεν
  choice: 食卓に着いた
  rationale: 当時の正式な食事では横になって食べる姿勢を指すが、日本語本文では食事の席に着いたことを自然に表し、具体的な姿勢は注で示した。
