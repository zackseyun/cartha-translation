  naturalness: 「水のない所を巡り歩いて」は自然である。一方、引用内は主語を補った「私が出て来た自分の家へ戻ろう」とすることで、現代標準語として明確かつ滑らかになる。
  terminology: 「汚れた霊」は福音書の定型的表現として適切。「水のない所」および脚注の「乾いた所」という代案も、ἀνύδρων の字義と慣用訳を適切に示す。
  issues:
