id: LUK.11.24
reference: Luke 11:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: ja
  text: 汚れた霊が人から出て行くと、水のない所[a]を巡り歩き、休息を求めるが、見つけられないので、こう言う。『私が出て来た自分の家へ戻ろう。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「乾いた所」とも訳せる。ギリシア語は直訳すると「水のない所」。
    reason: ἀνύδρων の伝統的な訳語と字義的な意味の両方を示すため。脚注は該当する「水のない所」に付す。
lexical_decisions:
- source_word: Ὅταν
  choice: …と
  rationale: アオリスト接続法を伴う一般的な時・条件を、個別の一回に限定せず自然な日本語で表す。
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: 汚れた霊
  rationale: 福音書で悪しき霊を指す定型表現であり、道徳的・祭儀的な汚れの含意を保つ。
- source_word: ἀπὸ τοῦ ἀνθρώπου
  choice: 人から
  rationale: ここでは代表的な人間を指す。日本語の「人」は性別を不必要に限定せず、ἄνθρωπος の通常の意味を正確に伝える。
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: 水のない所を巡り歩いて
  rationale: ἀνύδρων の「水のない」という具体的な像を保ち、διέρχεται の各所を通って移動する様子を自然に表す。
- source_word: ζητοῦν ἀνάπαυσιν
  choice: 休み場を探す
  rationale: 霊が落ち着ける場所を求める文脈なので、抽象的な「休息」よりも日本語として明瞭な「休み場」とした。
- source_word: καὶ μὴ εὑρίσκον
  choice: 見つからないので
  rationale: 目的語の「休み場」は直前から明らかであるため省略し、後続の発言に至る関係を自然に示す。
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: 自分の家に戻ろう
  rationale: 未来形による意志・決意を「戻ろう」で表し、「家」という比喩的な像を保つ。
- source_word: ὅθεν ἐξῆλθον
  choice: 出て来た
  rationale: 先の「出て行く」と呼応する退出の像を保ちつつ、話者である霊の視点に自然な表現とした。
theological_decisions:
- issue: 「汚れた霊」の性格
  choice: 語り、出て行き、戻る人格的な行為主体として訳す。
  alternative: 道徳的後退の比喩、または非人格的な力として訳す。
  rationale: 本文自身が霊を発話と意志を持つ主体として描いているため、その提示を弱めたり比喩だけに限定したりしない。
- issue: 「家」の指示対象
  choice: 解釈を加えず「自分の家」とする。
  alternative: 「以前取りついていた人」などと説明的に訳す。
  rationale: οἶκος の比喩と、その指示対象をめぐる本文の緊張を保ち、翻訳内で意味を限定しない。
translation_notes:
  register: 現代の標準的な日本語で、簡潔さと語りの格調を両立させた。「こう言う」により直接話法への移行を明確にし、原文の現在時制による生き生きした一般的叙述を維持した。
