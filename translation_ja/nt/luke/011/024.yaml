revisions:
- from: 汚れた霊が人から出て行くと、水のない所[a]を巡り歩いて休み場を探すが、見つからないので、こう言う。『出て来た自分の家に戻ろう。』
  to: 汚れた霊が人から出て行くと、水のない所[a]を巡り歩き、休息を求めるが、見つけられないので、こう言う。『私が出て来た自分の家へ戻ろう。』
  rationale: 引用内に「私が」を補い、霊が家から出たという原文の関係節を日本語で明確にした。「休み場」は場所を明示する語なので、ἀνάπαυσιν の基本義により近い「休息」に改めた。その他の表現、直接話法、脚注アンカーは原文に忠実で自然である。
