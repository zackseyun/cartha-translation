  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: ja
  text: だからこそ、神の知恵もこう言った[a]。『わたしは彼らに預言者たちと使徒たちを遣わす。彼らはそのうちのある者を殺し、また迫害する。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の知恵」は、神の知恵を人格化した表現、神の賢明な定め、またはイエスによる暗示的な自己言及と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: だからこそ
  rationale: 直前の糾弾を受けた理由・帰結を自然な現代日本語で示し、強い推論の力を保つ。
- source_word: καὶ
  choice: も
  rationale: 「神の知恵」に添えて付加的な意味を表し、単なる接続以上の働きを簡潔に反映する。
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: 神の知恵
  rationale: 属格表現を自然に保ち、神的知恵の擬人化、神の賢明な定め、イエスによる暗示的な自己言及のいずれかに限定しない。
- source_word: εἶπεν
  choice: こう言いました
  rationale: 直接話法を自然に導入しつつ、原文の単純過去の発言動詞を過度に解釈しない。
- source_word: Ἀποστελῶ
  choice: わたしは…遣わす
  rationale: 未来の意志・予告は引用内の文脈で日本語の非過去形により自然に表現できる。「遣わす」は使命を帯びた派遣に適する。
- source_word: εἰς αὐτούς
  choice: 彼らに
  rationale: 派遣先を示す εἰς を、日本語で最も自然な方向・対象表現として訳す。
- source_word: προφήτας
  choice: 預言者たち
  rationale: 標準的な訳語を用い、複数を明示する。
- source_word: ἀποστόλους
  choice: 使徒たち
  rationale: ルカ文書における称号・役割としての可能性を保つ標準的な訳語であり、一般的な「使者」へ弱めない。
- source_word: ἐξ αὐτῶν
  choice: そのうちのある者
  rationale: 送られる全員ではなく、その中の一部を指す部分属格の意味を明確に保つ。
- source_word: ἀποκτενοῦσιν
  choice: 殺し
  rationale: 直接的で自然な表現により、未来の敵対行為を明瞭に伝える。後続の動詞とともに「する」に支配させる。
- source_word: διώξουσιν
  choice: 迫害する
  rationale: 「殺す」と並ぶ敵対的文脈に即して、追跡一般ではなく迫害の意味を採る。
theological_decisions:
- issue: 「神の知恵」の意味
  choice: 「神の知恵」と訳し、その指示対象を本文では特定しない。
  alternative: 神的知恵の擬人化、神の賢明な定め、またはイエスによる暗示的な自己言及と解する。
  rationale: 原文は複数の理解を許すため、本文では透明性を保ち、いずれかの神学的解釈に限定しない。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準語。「預言者」「使徒」「神の知恵」は定着した聖書語彙を保ち、文全体は一般読者にも理解しやすい語順とした。
