id: LUK.11.20
reference: Luke 11:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: ja
  text: しかし、わたしが神の指によって[a]悪霊を追い出しているのなら、それなら、神の国はあなたがたのもとに来たのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の指をもって」。この表現は神が直接力を働かせることを示し、出エジプト記8章19節を思い起こさせる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「神の国はあなたがたにまで及んだのです」または「あなたがたに追いついたのです」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: 神の指によって
  rationale: 手段・働きを表す表現として訳し、神が直接力を働かせるという鮮明な比喩と、出エジプト記8章19節への響きを保った。
- source_word: ἐκβάλλω
  choice: 追い出している
  rationale: 福音書の悪霊追放の文脈に自然であり、継続して行われているイエスの働きとして理解しやすい表現を選んだ。
- source_word: τὰ δαιμόνια
  choice: 悪霊ども
  rationale: δαιμόνιαの直接的な意味を保ち、複数であることも明示した。「汚れた霊」は別のギリシア語表現に対応するため採用しなかった。
- source_word: ἄρα
  choice: （条件文に続く帰結として表現）
  rationale: 日本語では「のなら」に続けて帰結を述べることで推論の関係が明瞭になるため、独立した「それなら」を重ねず自然に表した。
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: あなたがたのもとに来た
  rationale: 神の国が聞き手のもとへ決定的に到来したことを自然な日本語で示した。「及んだ」「追いついた」という可能な語感は脚注に残した。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 神の支配という動的側面と「国」という具体的な像の双方を保持する、定着した明瞭な訳語である。
theological_decisions:
- issue: 「神の指」の意味
  choice: 神の直接的な力・働きを示す比喩として、本文では像をそのまま保つ。
  alternative: マタイ12章28節との比較から、聖霊を直接指す表現として訳出する。
  rationale: ルカ固有の語句と旧約聖書への響きを尊重し、解釈によって「聖霊」と置き換えなかった。
- issue: 「神の国はあなたがたのもとに来た」の時間的・終末論的含意
  choice: イエスの悪霊追放の働きにおいて、神の国が現に到来したことを示す。
  alternative: 神の国は全面的に未来のことだけを指す、またはこの句は専ら敵対者への断罪を意味する。
  rationale: アオリスト形と文脈が示す決定的な到来を保ちつつ、包括的な終末論体系を本文に持ち込まない表現とした。
translation_notes:
  register: 明瞭で現代的ながら荘重さを保つ文体とした。「神の指」という聖書的な比喩は平易な説明に置き換えず本文に残し、必要な説明を脚注に示した。
