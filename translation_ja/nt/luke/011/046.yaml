  naturalness: 全体として明瞭な現代標準日本語である。「あなたがた律法の専門家たち」は呼びかけとして読点を入れると自然になる。脚注bの「自分の指の一本」は、複数の聞き手に対する「あなたがたの指の一つ」を単数の「自分」に寄せているため、「自分たちの指一本」とするほうが自然かつ正確である。
