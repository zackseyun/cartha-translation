  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: ja
  text: しかし、イエスは言われた。「あなたがた、律法の専門家たち[a]にも災いだ。人々には背負うのも困難な重荷を負わせながら、自分たちはその重荷に指一本触れもしない[b]からだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法の専門家たち」は、ユダヤの律法に通じ、その解釈を専門とした人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「自分たちは、その重荷に自分たちの指一本でさえ触れない」。自ら課した重荷を負う人々に、少しも手を貸さないことを強調する表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: 律法の専門家たち
  rationale: ここで指すのは一般の法律家ではなく、ユダヤの律法に通じた専門家であるため、現代日本語で誤解の少ない表現とした。
- source_word: οὐαί
  choice: 災いだ
  rationale: 単なる嘆きではなく、預言者的な警告と断罪の力を保つ表現である。
- source_word: φορτίζετε … φορτία
  choice: 重荷を負わせ
  rationale: 人に荷を載せるという原文の具体的な比喩を、自然な日本語で保持した。
- source_word: δυσβάστακτα
  choice: 背負うのも困難な
  rationale: 『担うのが難しい』という意味を表し、『到底背負えない』と絶対化しすぎないようにした。
- source_word: ἀνθρώπους
  choice: 人々
  rationale: 特定の性別ではなく、人一般を指す語として訳した。
- source_word: αὐτοὶ
  choice: 自分たちは
  rationale: 重荷を負わされる人々との対照を示す強調を反映した。
- source_word: ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε
  choice: 指一本触れもしない
  rationale: 最小限の関与さえしないという原文の鮮明な比喩を保ち、日本語としても理解できる形にした。
- source_word: Καὶ ὑμῖν
  choice: あなたがた…も
  rationale: 直前に語られた者たちに加え、この一団にも災いが及ぶというκαίの付加的な意味を表した。
theological_decisions:
- issue: νομικοῖςが指す人々
  choice: ユダヤの律法の専門家として訳す
  alternative: 律法学者／法律家
  rationale: 現代の世俗的な法律実務家との誤解を避けつつ、νομικόςを別の呼称である『律法学者』と同一視しすぎないため。
- issue: 末尾の比喩の意味
  choice: 『指一本触れもしない』という具体的な像を本文に残す
  alternative: 重荷を負う人々を少しも助けない
  rationale: 助けようとしない態度は文脈上含意されるが、本文では原文の比喩とその解釈上の余地を保持した。
- issue: δυσβάστακταの程度
  choice: 背負うのも困難な
  alternative: 背負いきれない／耐えられない
  rationale: 重荷の過酷さを伝えながら、原語を絶対的な不可能性として強めすぎないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。『災いだ』『重荷』『指一本触れもしない』により、原文の預言者的な厳しさと荷の比喩を保った。
