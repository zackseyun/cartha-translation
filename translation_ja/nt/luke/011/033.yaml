  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: ja
  text: だれも、ともしびをともしてから、それを隠れた場所[a]や量り升[b]の下に置くことはない。入って来る人たちにその光が見えるように、ともしび台の上に置く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地下室」または「人目につかない所」とも訳せる。ギリシア語クリュプテーは、地下の貯蔵場所を含む、隠れた場所を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語モディオスは、穀物などを量るローマの計量容器であり、その容量単位を指すこともある。伝統的には「一斗升」や「升」と訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: だれも〜ない
  rationale: 全称的な否定を、自然な現代日本語の呼応表現で示す。
- source_word: λύχνον
  choice: ともしび
  rationale: 携帯できる油ランプを指す。ろうそくに限定される語を避け、文脈上の灯火を自然に表す。
- source_word: ἅψας
  choice: ともしてから
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、動作の順序を明確にする。
- source_word: εἰς κρύπτην
  choice: 人目につかない所
  rationale: 地下貯蔵所などに限定せず、光を隠す場所という文脈上の要点を自然に伝える。
- source_word: τίθησιν
  choice: 置く
  rationale: 単純な配置動作を明瞭に表す。
- source_word: ὑπὸ τὸν μόδιον
  choice: 升の下
  rationale: μόδιοςは穀物などを量る容器を指す。「升」は簡潔にその機能を示し、詳しい意味は脚注で補う。
- source_word: ἐπὶ τὴν λυχνίαν
  choice: 燭台の上
  rationale: ランプを載せる台を指すλֻυχνίαの定着した日本語表現。文脈上、光を高く掲げる対照を明確にする。
- source_word: ἵνα
  choice: 〜ように
  rationale: 目的を表す接続の力を自然な日本語で保持する。
- source_word: οἱ εἰσπορευόμενοι
  choice: 入って来る人たち
  rationale: 実際に中へ入る人々を表す現在分詞の継続的・一般的な像を保つ。
- source_word: τὸ φέγγος
  choice: その光
  rationale: 灯火が放つ光・明るさを指す。日本語では「その光」が具体的で自然。
- source_word: βλέπωσιν
  choice: 見える
  rationale: 目的節の内容を日本語として自然に表し、入って来る人に光が認識可能になる趣旨を伝える。
theological_decisions:
- issue: κρύπτηが指す場所
  choice: 特定の構造物に限定しない「人目につかない所」
  alternative: 地下室、貯蔵室、隠れた所
  rationale: この比喩の焦点は光を隠す不合理さにあり、語が許容する特定の建築的意味に本文を狭めないため。
- issue: μόδιοςの訳し方
  choice: 本文では「升」
  alternative: 量り升、穀物を量る容器、かご
  rationale: 原語が容量単位そのものと、その容量を量る容器の双方に関係することを踏まえ、簡潔な機能的対応語を用い、脚注で具体的に説明する。
- issue: 後半のτίθησινの省略
  choice: 日本語では「置く」を補う
  alternative: 「燭台の上に」で止める
  rationale: ギリシア語では前出の動詞が省略されているが、日本語では補ったほうが対比と文意が明瞭になり、新たな意味は加わらない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「だれも〜ない」と「〜ように」を用いて原文の否定と目的を自然に再現した。前半と後半の対比を読みやすくするため二文に分け、原文で省略された後半の「置く」を補った。
