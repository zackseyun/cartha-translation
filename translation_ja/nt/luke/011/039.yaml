id: LUK.11.39
reference: Luke 11:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: ja
  text: しかし、主は彼に言われた。「さて、あなたがたファリサイ人は、杯や皿の外側をきれいにするが、あなたがたの内側は強欲[a]と悪に満ちている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「略奪」「強奪」または「搾取」とも訳せる。
    reason: ἁρπαγή が、強欲な性向だけでなく、実際に奪い取る行為や不当な取り立ても表し得るため。
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: ここではイエスを指す新約聖書上の称号として、簡潔で定着した「主」とした。
- source_word: Νῦν
  choice: さて
  rationale: 時間を限定するというより、鋭い指摘を切り出す談話標識として自然な現代日本語にした。
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: あなたがたファリサイ派の人々
  rationale: 代名詞の強調を「あなたがた」で保ちつつ、現代の一般読者に分かりやすい呼称とした。
- source_word: τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος
  choice: 杯や皿の外側
  rationale: 容器の外面という具体的な像を簡潔に保った。καί は日本語の自然な並列として「や」とした。
- source_word: καθαρίζετε
  choice: きれいにする
  rationale: 現在形が表す常習的行為を、平明な現在表現で示した。
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: あなたがたの内側
  rationale: 「心」などと解釈的に限定せず、外側との対照と身体的比喩をそのまま保った。
- source_word: ἁρπαγῆς
  choice: 強欲
  rationale: 奪取、略奪、搾取にも及ぶ語だが、ここでは内面を満たす貪欲な性向として読めるため「強欲」とし、具体的な語義は脚注に残した。
- source_word: πονηρίας
  choice: 悪
  rationale: 道徳的な悪性を広く指す語として、過度に意味を限定しない簡潔な表現を選んだ。
theological_decisions:
- issue: 「内側」が指すもの
  choice: 「あなたがたの内側」として比喩を保持する。
  alternative: 「あなたがたの心」「あなたがたの内面」
  rationale: ギリシア語は器の外側と人の内側を意図的に対照させているため、心理的機能や教義的概念に限定しなかった。
- issue: ἁρπαγή の道徳的意味
  choice: 本文では「強欲」とする。
  alternative: 「略奪」「強奪」「搾取」
  rationale: 内的な悪徳への非難として自然に読める一方、他者から奪い取る具体的含意も失われないよう脚注で示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。外面的な清さと内面的な腐敗との対照を直截に保ち、宗派的な解釈語は加えていない。
