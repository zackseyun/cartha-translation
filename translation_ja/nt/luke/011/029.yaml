  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: ja
  text: 群衆が集まって来る中で、イエスは語り始めた。「この世代は悪い世代だ。しるしを求めているが、ヨナのしるし[b]以外には、しるしは与えられない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「ヨナのしるし」は、ヨナ自身が預言者としての働きを通してしるしとなったことを指しうる。また、福音書の並行箇所に照らすと、イエスの死と復活との類型的なつながりをも想起させうる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: 集まって来る
  rationale: 属格独立構文の現在分詞が示す、群衆が引き続き集まりつつある同時進行の動作を自然な現代日本語で表した。
- source_word: ἤρξατο λέγειν
  choice: 語り始めた
  rationale: 開始を表す構文の意味を簡潔に保ち、発言の始まりを示した。
- source_word: γενεά
  choice: 世代／今の時代の人々
  rationale: 最初は指示対象が自然に伝わる「今の時代の人々」とし、反復箇所では原語の集団的・時代的含意を保つ「世代」とした。
- source_word: πονηρά
  choice: 悪い
  rationale: 道徳的な非難を明確に伝えつつ、現代の一般読者に自然な語を選んだ。「邪悪な」より平明だが、文脈上の厳しい評価は保たれる。
- source_word: σημεῖον
  choice: しるし
  rationale: 超自然的な証拠に限定して説明を加えず、出来事が持つ証示的意味を保つ標準的な訳語とした。
- source_word: ζητεῖ
  choice: 求めている
  rationale: 原語の基本義に忠実であり、要求的な態度という含みは文脈に委ねた。
- source_word: δοθήσεται
  choice: 与えられない
  rationale: 未来受動を日本語として自然に表し、否定文の構造を維持した。
- source_word: εἰ μὴ
  choice: のほかには
  rationale: 先行する否定を受ける排他的な例外を、明瞭な日本語で表した。
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: ヨナのしるし
  rationale: 属格の関係を解釈で限定せず、ヨナ自身、その預言的使命、あるいは類型的含意に開かれた表現を保った。
theological_decisions:
- issue: 「この世代」に対する非難の範囲
  choice: 「今の時代の人々」「悪い世代」として、同時代の人々への集団的・道徳的評価を保った。
  alternative: その場にいた特定の反対者だけを指すと限定する。
  rationale: 反復された γενεά は広い集団的非難を示すため、訳文で対象を特定の一派に狭めなかった。
- issue: 「ヨナのしるし」の意味
  choice: 本文では「ヨナのしるし」とし、属格表現の曖昧さを保持した。
  alternative: ヨナの宣教だけを指す、またはイエスの死と復活だけを指すと明示する。
  rationale: ルカの直後の文脈と他の福音書の並行箇所が異なる関連を喚起しうるため、本文では一つに決めず、注で解釈可能性を示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。主語は文脈上の話者を明確にするため「イエス」と補った。英語資料の脚注aは本文の語句との対応が崩れており、内容も πονηρά の語彙的別訳に相当するため採用しなかった。したがって実際に本文へ付す注は[b]のみとし、マーカーを本文中にも明示した。
