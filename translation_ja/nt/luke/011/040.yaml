  text: ἄφρονες, οὐχ ὁ ποιήσας τὸ ἔξωθεν καὶ τὸ ἔσωθεν ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: ja
  text: 愚かな者たち。外側を造った方が、内側も造ったのではないか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「外面……内面」とも訳せる。この表現は、直前の文脈では器の外側と内側を指すと同時に、さらに人の外面的なあり方と内面的なあり方を指すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: 愚かな者たち
  rationale: 複数呼格の実質的用法。直接的で厳しい叱責を保ちつつ、現代日本語として自然にした。
- source_word: οὐχ ... ἐποίησεν;
  choice: 造られたのではないか
  rationale: 肯定の答えを予期する否定疑問文として訳し、修辞疑問の力を保持した。
- source_word: ὁ ποιήσας
  choice: 造った方
  rationale: 冠詞付きアオリスト分詞の実質的用法。神を暗示する敬意を日本語の「方」で示すが、原文にない「神」は補わない。
- source_word: τὸ ἔξωθεν
  choice: 外側
  rationale: 直前の器の外側と、人の外面的なあり方への広がりの双方を保持できる語を選んだ。
- source_word: τὸ ἔσωθεν
  choice: 内側
  rationale: 「外側」と対応し、器の内側にも人の内面的なあり方にも適用できる表現とした。
- source_word: καὶ
  choice: も
  rationale: 外側を造った方が内側も造ったという、修辞疑問に含まれる並行と論理を自然に表す。
theological_decisions:
- issue: 「造った方」の指示対象
  choice: 創造者である神への暗示を保ちつつ、「神」と明示しない。
  alternative: 器を作った者だけを直接指す表現とする。
  rationale: この言葉は直前の杯や皿の比喩に立ちながら、外面と内面の双方を造った神という広い含意を持つ。訳文では両方の読みが働く余地を残した。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの鋭い叱責を弱めず、同時に不必要な古語調を避けた。「造られた」には指示対象への敬意が響くが、「神」を補わず原文の含みを保った。
