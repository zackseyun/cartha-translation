id: LUK.11.13
reference: Luke 11:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: ja
  text: ですから、あなたがたは悪い者でありながら、自分の子どもたちに良い贈り物を与えるすべを知っています。まして、天の父[a]は、ご自分に求める者たちに聖霊[b]を与えてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「天からの父」。ギリシア語本文には「あなたがたの」に当たる語がない。マタイ7章11節の並行箇所に合わせて「あなたがたの天の父」とする訳もある。
    reason: alternative_reading
  - marker: b
    text: マタイ7章11節では、これに対応する箇所が「良いもの」となっている。ここではルカ固有の「聖霊」という表現を保った。
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: 悪い者でありながら
  rationale: 分詞句の譲歩的な含みを自然な日本語で表し、人間の道徳的状態についての本文の厳しい評価も保った。
- source_word: οἴδατε … διδόναι
  choice: 与えるすべを知っています
  rationale: 不定詞を伴う οἴδατε は実際にどう行うかを知っていることを表す。「与えることを知っている」より自然で、「与えることができる」ほど能力だけに限定しない。
- source_word: δόματα ἀγαθὰ
  choice: 良い贈り物
  rationale: δόματα の具体的な「贈り物」という意味を保ち、より広い「良いもの」とは訳さなかった。
- source_word: τέκνοις ὑμῶν
  choice: 自分の子どもたちに
  rationale: 家族関係を明瞭かつ自然に表す。複数形も「子どもたち」で示した。
- source_word: πόσῳ μᾶλλον
  choice: まして
  rationale: 小さいものから大きいものへ論じる比較の力を、簡潔で自然な日本語の定型表現で示した。
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: 天からの父
  rationale: 本文には「あなたがたの」に当たる語がなく、ἐξ は「天から」を表すため、マタイの並行箇所に合わせて「天の父」や「あなたがたの天の父」と調和させなかった。
- source_word: πνεῦμα ἅγιον
  choice: 聖霊
  rationale: このルカ文脈では神の霊を指すため、日本語で定着した固有的呼称「聖霊」とした。ギリシア語に冠詞がないことだけを理由に一般的な「聖なる霊」とはしなかった。
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: ご自分に求める者たちに
  rationale: 現在分詞を継続的・一般的に求める人々として訳し、明示された代名詞 αὐτόν の指示対象も「ご自分に」で保持した。
theological_decisions:
- issue: πνεῦμα ἅγιον の指示対象
  choice: 人格的な神の霊を指す「聖霊」
  alternative: 一般的な「聖なる霊」
  rationale: 無冠詞ではあるが、父が求める者に与える賜物というルカの文脈では神の聖霊を指す。本文以上の説明を加えず、通常の日本語表記を用いた。
- issue: マタイ7章11節の並行箇所との関係
  choice: ルカ固有の「天からの父」と「聖霊」を保持
  alternative: 「あなたがたの天の父」または「良いもの」への調和
  rationale: ルカ本文の語句を優先し、マタイの並行表現による同化を避けた。
translation_notes:
  register: 明瞭な現代標準語を用いながら、教えとしての威厳を保った。「天からの父」は一般的な「天の父」より不慣れに響くが、ルカの ἐξ οὐρανοῦ を意図的に保持した表現である。結びの「与えてくださることでしょう」は、πόσῳ μᾶλλον の強い確信を自然な日本語で示しつつ、本文にない否定疑問文へ作り替えることを避けた。
