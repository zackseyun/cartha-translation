id: LUK.11.1
reference: Luke 11:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: ja
  text: イエスがある場所で祈っておられた。祈りを終えると、弟子の一人がイエスに言った。「主よ、ヨハネも自分の弟子たちに教えたように、私たちにも祈ることを教えてください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: 〜ときのことである
  rationale: ルカに特徴的な場面導入の語句を、古風な「さて、起こった」などを避け、出来事を導入する機能が自然に伝わる現代日本語とした。
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: イエスが…祈っておられたとき
  rationale: ἐν＋冠詞付き不定詞と現在分詞が表す同時進行の状況を保った。主語は文脈上イエスであり、日本語では明示するほうが自然である。
- source_word: ἐν τόπῳ τινὶ
  choice: ある所で
  rationale: 場所を特定しない τις の意味を簡潔かつ自然に保持した。
- source_word: ὡς ἐπαύσατο
  choice: 祈り終えると
  rationale: παύομαι の「やめる、終わる」を文脈に即して表した。「祈るのをやめると」より自然でありながら、祈りの終了を明確にする。
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: 弟子の一人
  rationale: 部分を表す属格を自然な現代日本語で表現した。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの敬称・称号としての意味範囲を保持し、単に教師としての「先生」に限定しなかった。
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: 私たちにも祈ることを教えてください
  rationale: 不定詞補語を「祈ること」として保ち、「祈り方」と解釈的に限定しなかった。「にも」は後続のヨハネとその弟子たちとの比較を日本語で明瞭にする。
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: ヨハネも自分の弟子たちに教えたように
  rationale: καθώς の比較と καί の「も」を自然な語順で反映した。「自分の」はヨハネの弟子であることを明確にする。
theological_decisions:
- issue: イエスへの呼びかけ κύριος の訳語
  choice: 主
  alternative: 先生
  rationale: κύριος が持つ敬称と称号の幅を保つ。「先生」では教育者としての側面に狭める可能性がある一方、この節だけで称号の神学的含意を過度に確定もしない。
translation_notes:
  register: 明快で現代的ながら、聖書本文にふさわしい品位を保った。「おられた」はイエスへの自然な敬意を示すが、全体は過度な敬語調にしていない。引用部分は弟子の丁寧な願いとして「教えてください」とした。
