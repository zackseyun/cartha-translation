revisions:
- from: しかし、サタンも仲間割れしているのなら、どうしてその国が立ち続けられるでしょうか。あなたがたは、私がベルゼブルによって悪霊どもを追い出していると言っているからです。[a]
  to: しかし、サタンが自らに敵対して分裂しているなら、どうしてその国が立ち続けられるでしょうか。というのは、あなたがたは、私がベルゼブル[a]によって悪霊を追い出していると言っているからです。
  rationale: 原文の「自分自身に敵対して」という表現を明示しつつ、現代標準日本語として自然な文に整えた。「国が立ち続ける」は原文の王国の比喩と将来的な存続の問いを保つ。告発の手段を示す「ベルゼブルによって」も維持し、本文にない説明は加えていない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:33:47Z'
review_pass:
