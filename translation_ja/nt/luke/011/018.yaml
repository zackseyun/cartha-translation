id: LUK.11.18
reference: Luke 11:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: ja
  text: しかし、サタンが自らに敵対して分裂しているなら、どうしてその国が立ち続けられるでしょうか。というのは、あなたがたは、私がベルゼブル[a]によって悪霊を追い出していると言っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「ベルゼブル」。英語訳の伝統には「ベルゼブブ」とするものもある。
    reason: ギリシア語本文の名称形と、一部の英語訳で用いられる別形を示すため。
lexical_decisions:
- source_word: Σατανᾶς
  choice: サタン
  rationale: ギリシア語の固有名・称号を、日本語で定着している形に音写した。
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: 仲間割れしている
  rationale: 直訳的には「自分自身に敵対して分裂した」。ここではサタンの支配内部の対立を指すため、自然な現代日本語で表した。
- source_word: πῶς σταθήσεται
  choice: どうして…立ち続けられるでしょうか
  rationale: 将来形の修辞疑問と、存続・維持を表す「立つ」の比喩を保った。
- source_word: ἡ βασιλεία αὐτοῦ
  choice: その国
  rationale: βασιλείαを「国」とし、サタンの支配領域を指す比喩を簡潔に保った。
- source_word: ὅτι
  choice: …からです
  rationale: 直前の修辞疑問の根拠として、相手の告発を示す説明的な接続を自然な日本語にした。
- source_word: ἐν Βεελζεβοὺλ
  choice: ベルゼブルによって
  rationale: ἐνがここで表す手段・媒介の意味を、過度な説明を加えずに示した。
- source_word: ἐκβάλλειν … τὰ δαιμόνια
  choice: 悪霊どもを追い出している
  rationale: ἐκβάλλωの排除の力を「追い出す」で示し、δαιμόνιαは日本語聖書語として明瞭な「悪霊」とした。複数性は「ども」で表した。
theological_decisions:
- issue: イエスに対する告発の性質
  choice: イエスがベルゼブルを媒介として悪霊を追い出している、という相手の主張として訳す。
  alternative: 「ベルゼブルの力によって」と明示する。
  rationale: ἐνには手段・媒介の含意があるが、本文にない「力」を補わず、告発の神学的内容を必要以上に展開しない。
- issue: サタンの分裂の表現
  choice: 「仲間割れしている」として、サタンの支配内部の自己対立を表す。
  alternative: 「自分自身に敵対して分裂している」
  rationale: ギリシア語の論理を保ちながら、日本語でサタン一個人が物理的に分割されるとの誤解を避ける。
translation_notes:
  register: 明瞭で現代的かつ格調を保った口調。修辞疑問には丁寧体を用い、議論の厳粛さを表した。脚注記号はベルゼブルの直後ではなく節末に置き、名称形に関する注であることを本文語から明確にした。
