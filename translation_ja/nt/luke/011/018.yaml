  - severity: low
    issue: 「悪霊ども」
    rationale: 複数性を表せる一方、日本語では軽蔑的・粗野な語感を加えうる。原文の複数形は通常「悪霊を」で自然に表現できる。
  - severity: low
    issue: 脚注記号が節末にある
    rationale: 脚注は「ベルゼブル」という名称形に関するものなので、対象語の直後に置くほうがアンカーとして明確である。
