  source_fidelity: 「仲間割れ」は複数の仲間どうしの争いを強く連想させ、ἐφ’ ἑαυτὸν（自分自身に敵対して）という再帰的表現を十分には示さない。「自らに敵対して分裂している」とするのが原文の論理により忠実である。また、δαιμόνια の複数は日本語では「悪霊を」で自然に表せるため、原文にない軽蔑的な響きを帯びうる「ども」は不要である。
  naturalness: 丁寧体の修辞疑問は明瞭で自然である。因果関係は「というのは」を補うことで日本語として読みやすくなる。脚注記号は注釈対象の名称の直後に置く。
  terminology: 「サタン」「ベルゼブル」「悪霊」「追い出す」は定着した適切な用語である。「国」は βασιλεία の比喩を保つため維持する。脚注は異読ではなく英語圏で用いられる名称形の差を述べるものなので、その範囲を明示する。
