revisions:
- from: 律法の専門家たち[a]、あなたがたは災いだ。あなたがたは知識の鍵[b]を取り上げ、自分たち自身は入らず、入って行く人々を妨げたからだ。
  to: 律法の専門家たち[a]よ、あなたがたに災いがある。あなたがたは知識の鍵[b]を取り去り、自分たちでは入らず、入って行く人々を妨げたからだ。
  rationale: 災いの宣告（οὐαὶ ὑμῖν）を現代日本語として自然かつ強く表すため、「あなたがたは災いだ」を「あなたがたに災いがある」に改めた。また、ἤρατεの剥奪・除去の含意を明確にするため「取り上げ」を「取り去り」とした。入る対象は原文で明示されないため補わず、αὐτοὶの対照は「自分たちでは」によって保持した。脚注の位置と内容は本文の該当語句に適切に対応している。
