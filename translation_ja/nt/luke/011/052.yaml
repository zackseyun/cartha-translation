id: LUK.11.52
reference: Luke 11:52
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: ja
  text: 律法の専門家たち[a]よ、あなたがたに災いがある。あなたがたは知識の鍵[b]を取り去り、自分たちでは入らず、入って行く人々を妨げたからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「律法の専門家」は、ユダヤの律法に通じた専門家を指し、現代の弁護士のことではない。
    reason: lexical_clarification
  - marker: b
    text: 「知識へ至る鍵」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: あなたがたは災いだ
  rationale: 預言者的な糾弾の強さを保ちつつ、現代日本語として明確に表現した。
- source_word: νομικοῖς
  choice: 律法の専門家たち
  rationale: 現代の民事・刑事の弁護士ではなく、ユダヤの律法に通じた専門家を指すことが明確になる。
- source_word: ἤρατε
  choice: 取り上げ
  rationale: 単に持ち上げるのではなく、他者から入口となるものを奪い去るという文脈上の意味を表す。
- source_word: κλεῖδα τῆς γνώσεως
  choice: 知識の鍵
  rationale: 属格を簡潔に保ち、知識と प्रवेशを結ぶ比喩を維持した。
- source_word: αὐτοὶ οὐκ εἰσήλθατε
  choice: 自分たち自身は入らず
  rationale: αὐτοὶの強調と、後続する人々との対照を「自身」「は」で示し、何に入るのかは補わなかった。
- source_word: τοὺς εἰσερχομένους
  choice: 入って行く人々
  rationale: 現在分詞の進行的な描写を保ち、「入ろうとしている」のような未遂の意味を加えない。
- source_word: ἐκωλύσατε
  choice: 妨げた
  rationale: 完全に阻止したと断定せず、進入を阻害したという動詞の広い意味を保つ。
theological_decisions:
- issue: 「知識の鍵」と「入る」が指す対象
  choice: 何に入るのかを明示せず、鍵と प्रवेशの比喩をそのまま保った。
  alternative: 神の国に入ること、または神についての真の知識に入ることと明示する。
  rationale: ギリシア語本文は入る対象を明言していない。特定の神学的解釈を本文へ持ち込まず、ルカの文脈から読者が理解できる余地を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、糾弾の厳粛さと鍵・ प्रवेशの比喩を保持した。「律法の専門家」により歴史的意味を明確にし、文脈にない目的語は補わなかった。
