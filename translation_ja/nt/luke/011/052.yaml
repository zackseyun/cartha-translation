  naturalness: 「あなたがたは災いだ」は現代標準日本語として不自然で、「あなたがたに災いがある」が預言者的な糾弾の調子と意味を明瞭に伝える。ほかの表現は明快で自然である。
  terminology: 「律法の専門家」はνομικοίの歴史的・宗教的文脈を過度に現代化せず適切に示す。「知識の鍵」も比喩を保つ。「取り去った」はἤρατεの、他者のアクセスを奪う意味合いを自然に表す。
