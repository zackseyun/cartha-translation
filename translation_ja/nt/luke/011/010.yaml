id: LUK.11.10
reference: Luke 11:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ αἰτῶν λαμβάνει, καὶ ὁ ζητῶν εὑρίσκει, καὶ τῷ κρούοντι ἀνοιγήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: ja
  text: なぜなら、求める人はだれでも受け、探す人は見つけ、たたく人には開かれるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: 皆
  rationale: 定冠詞付き分詞と結び付いて、一人一人に及ぶ普遍的な範囲を自然な日本語で表す。
- source_word: γὰρ
  choice: からです
  rationale: 直前の勧めを根拠づける説明の働きを、文末表現で自然に示す。
- source_word: ὁ αἰτῶν
  choice: 求める者
  rationale: 現在分詞の一般的・継続的な性格を保ちつつ、祈りの文脈に適した簡潔で格調ある表現とする。
- source_word: λαμβάνει
  choice: 受け
  rationale: 求める行為に対する応答を表す標準的な訳語。三つの節の並行性を保つため連用形にする。
- source_word: ὁ ζητῶν
  choice: 捜す者
  rationale: 何かを得ようとして探し求める行為を示し、αἰτέωとの語の違いも保つ。
- source_word: εὑρίσκει
  choice: 見つけ
  rationale: 捜すこととの対応を直接かつ自然に表す。
- source_word: τῷ κρούοντι
  choice: たたく者には
  rationale: 与格が受動動詞の対象を示すことを「には」で表し、一般的な人物を指す構文を保つ。
- source_word: ἀνοιγήσεται
  choice: 開かれる
  rationale: 未来受動の意味を表しながら、ギリシャ語と同様に何が開かれるかを本文では明示しない。日本語では現在形が一般的確約と将来的帰結の双方を自然に担う。
theological_decisions:
- issue: 約束の普遍的な範囲と強さ
  choice: 条件を加えず、「求める者は皆」と一般的・普遍的な確約として訳す。
  alternative: 「正しく求める者」などの解釈上の条件を補う、または誇張的な励ましとして弱めて訳す。
  rationale: ギリシャ語本文は限定を置かない普遍的な格言として述べているため、その神学的緊張を訳文にも残す。
- issue: 開かれるものの同定
  choice: 本文では目的語を補わず「開かれる」とする。
  alternative: 文脈から「戸が開かれる」と明示する。
  rationale: 戸は自然に含意されるが、原文は目的語を明示していないため、本文で特定せず脚注で説明する。
translation_notes:
  register: 明快な現代標準日本語を用い、三つの節の簡潔な並行構造を保った。「者」は格言的で品位ある文体に適し、日常語としても理解可能。「叩く」ではなく、聖書本文として視認しやすく柔らかな「たたく」と表記した。
