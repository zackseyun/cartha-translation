  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: ja
  text: 私の友人が旅から[a]私のところに来たのですが、その人に出す物が何もないからです。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「道から」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: からです
  rationale: 直前のパンを求める言葉の理由を示す因果表現。日本語では文末の「からです」が自然に理由を表す。
- source_word: φίλος μου
  choice: 友人が
  rationale: 無冠詞の φίλος と属格代名詞 μου を、文脈上「私の友人」と理解できる自然な日本語にした。「ある友人」も可能だが、この短い発話では不自然さを避けた。
- source_word: παρεγένετο
  choice: 来た
  rationale: παραγίνομαι のアオリストは到着を表す。到着後もその場にいるという結果は文脈から明らかなため、日本語では簡潔な過去形が自然。
- source_word: ἐξ ὁδοῦ
  choice: 旅の途中の
  rationale: 字義的には「道から」だが、旅をして来たことを表す慣用的な句。日本語では「旅の途中の」が、旅先で立ち寄った状況を自然に伝える。
- source_word: πρός με
  choice: 私のところに
  rationale: 話者のもとへの移動を表す。「家に」は文脈上想定されるが原文に明記されないため加えない。
- source_word: οὐκ ἔχω
  choice: 何もない
  rationale: 否定された所有を簡潔で自然な日本語にした。
- source_word: ὃ παραθήσω αὐτῷ
  choice: その人に出す物が
  rationale: παρατίθημι は食事を人の前に置くことを指す。「食べさせる物」よりも接待の場面を保ちつつ、現代日本語として自然な「出す物」とした。
theological_decisions: []
translation_notes:
  register: 現代の標準的な日本語。たとえ話の会話として自然でありながら、くだけすぎない語調とした。原文の接待場面を「出す物」で示し、「食べ物」と明示する解釈的補足は避けた。
