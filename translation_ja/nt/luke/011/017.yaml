source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: ja
  text: しかし、イエスは彼らの考えを知って、こう言われた。「どんな国でも、内部で分裂すれば荒廃し、家が家に倒れかかる。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家の者が家の者に倒れかかる」とも訳せる。ギリシア語の「家」は、建物だけでなく、家族や家の者を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: 知って
  rationale: 文脈では彼らの内心を認識していることを表す。分詞の関係を保ちつつ、自然な現代日本語とした。
- source_word: διανοήματα
  choice: 考え
  rationale: 心の中の思考や思案を指す。敵意や意図まで過度に限定しない表現である。
- source_word: Πᾶσα βασιλεία
  choice: どんな国でも
  rationale: すべての国に当てはまる一般的な格言として、πᾶσαの包括的な力を自然な日本語で表した。
- source_word: ἐφ’ ἑαυτὴν διαμερισθεῖσα
  choice: 内輪で争えば
  rationale: 単なる分割ではなく、内部が互いに対立する状態を表す慣用的な句である。日本語では格言として明瞭な条件表現にした。
- source_word: ἐρημοῦται
  choice: 荒れ果て
  rationale: 破滅して荒廃するという強い結果を示す。受動形を直訳した不自然さを避けながら、荒廃の意味を保持した。
- source_word: οἶκος ἐπὶ οἶκον
  choice: 家は家の上に
  rationale: 圧縮されたギリシア語の具体的な像を保持した。οἶκοςには建物としての家と家族・家の者という両義性があるため、本文では字義的な『家』を採用した。
- source_word: πίπτει
  choice: 倒れる
  rationale: 現在形の格言的表現と、倒壊・没落の比喩を簡潔に保った。
theological_decisions:
- issue: 格言後半のοἶκοςの意味
  choice: 本文では「家」と訳し、建物の像を残す。
  alternative: 「家族」または「家の者」と解して、『家族が家族に敵対して倒れる』と訳す。
  rationale: οἶκοςだけでは物理的な家と家族・家の者のどちらかに限定できない。本文で具体的な像を保ち、社会的な意味の可能性は脚注に示して、曖昧さを保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。主語αὐτόςは文脈上イエスを指すため固有名で明示した。前半は日本語の格言として自然な条件表現とし、後半は原文の簡潔で難解な像と語義上の曖昧さを残した。
