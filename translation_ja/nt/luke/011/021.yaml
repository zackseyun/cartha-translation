id: LUK.11.21
reference: Luke 11:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: ja
  text: 十分に武装した強い者が自分の中庭[a]を守っているとき、その所有物は安全である[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「屋敷」または「邸宅」とも訳せる。ギリシア語は、中庭そのものや、それを含む住居・屋敷の区画を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳「平安のうちにある」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: とき
  rationale: 一般的な条件を伴う時を示す。日本語では「とき」が簡潔で自然であり、例えの反復可能な状況も表せる。
- source_word: ὁ ἰσχυρός
  choice: 強い者
  rationale: 定冠詞を伴う形容詞の名詞的用法。男性単数の人物を指すが、日本語では「強い者」が自然で、文脈上の比喩を解釈によって特定しない。
- source_word: καθωπλισμένος
  choice: 武装を整えた
  rationale: 完了分詞が示す、武装を済ませてその状態にあることを、明瞭で自然な日本語で表す。
- source_word: φυλάσσῃ
  choice: 守っている
  rationale: 継続的に見張り、守る動作を表す現在接続法のニュアンスを反映する。
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: 自分の屋敷
  rationale: αὐλήは中庭だけでなく、それを含む住居や屋敷の区画も指し得る。所有物を守る場面では「屋敷」が自然であり、ἑαυτοῦの強調を「自分の」で示す。語義の幅は脚注に残す。
- source_word: ἐν εἰρήνῃ
  choice: 安全である
  rationale: 直訳は「平安のうちにある」だが、ここでは財産が乱されず保たれている状態を意味するため、「安全である」と自然に表現し、直訳は脚注に示す。
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: その財産
  rationale: その人に属する物や所有財産を広く指す。「その財産」は現代日本語として明瞭である。
theological_decisions:
- issue: 文脈における「強い者」の比喩的指示対象
  choice: 比喩の人物を「強い者」としてそのまま訳し、本文中でサタンとは明示しない。
  alternative: 「サタン」と解釈して本文に明示する。
  rationale: この節自体は比喩の情景を提示しており、その指示対象は周囲の文脈から読み取るべきである。訳文で解釈を先取りせず、比喩と神学的緊張を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、例えとしての簡潔さと格調を保った。「武装を整えた」で完了した備えの状態を示し、「安全である」で文脈上の意味を自然に伝えた。
