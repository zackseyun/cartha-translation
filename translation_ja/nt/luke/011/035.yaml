id: LUK.11.35
reference: Luke 11:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: ja
  text: だから、あなたの内にある光が闇でないように、よく注意しなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの内にある光が闇でないか、よく確かめなさい。」
    reason: σκόπειとμήを、警戒の命令ではなく確認を促す表現として訳すこともできるため。
lexical_decisions:
- source_word: σκόπει
  choice: よく注意しなさい
  rationale: 現在命令形の継続的な警戒と、警告としての力を、自然な現代日本語で表す。
- source_word: οὖν
  choice: だから
  rationale: 直前の目と光についての教えから導かれる結論・勧告であることを明確にする。
- source_word: μὴ ... ἐστίν
  choice: …でないように
  rationale: 命令形に伴うμήが、望ましくない事態への警戒を表すため。日本語では「…でないように」が自然にその警告を伝える。
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: あなたの内にある光
  rationale: 光の比喩を保ちつつ、ἐν σοὶを自然に表す。心理・良心・霊的状態のいずれかに意味を限定しない。
- source_word: σκότος
  choice: 闇
  rationale: 文脈の光との対照を簡潔に保ち、比喩的・倫理的含意を狭めない。
theological_decisions:
- issue: 「光」と「闇」の比喩的意味
  choice: 本文では「光」「闇」という比喩をそのまま保つ。
  alternative: 「理解」「内なる光」「良心」などと意味を特定する。
  rationale: ギリシア語本文は比喩の指示対象を一義的に限定していない。直前の知覚と内的状態をめぐる文脈とのつながりと、神学的な幅を保持する。
- issue: 警告の内容が示す可能性と認識
  choice: 「光が闇でないように」と訳し、光と思われるものが実は闇である可能性を残す。
  alternative: 「自分の内面を明るく保ちなさい」などと解釈的に言い換える。
  rationale: 原文の逆説的な緊張を保ち、倫理的勧告へ単純化しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、「内」「光」「闇」によって簡潔で格調ある比喩を保持した。「だから」は論理的つながりを平易に示し、「よく注意しなさい」は単数二人称への継続的な警告を自然に表す。
