    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: イエスがそこを出て行かれると
  rationale: 接続詞・場所の副詞と属格独立構文を一体として自然な日本語にし、主動作に先立つ退出と場面の連続性を示した。日本語では代名詞だけでは指示対象が曖昧になりやすいため、文脈上の主語を「イエス」と明示した。
- source_word: ἤρξαντο
  choice: し始めた
  rationale: 二つの補足的不定詞を受ける起動相を、現代日本語で明確に表した。
- source_word: οἱ γραμματεῖς
  choice: 律法学者たち
  rationale: 福音書の文脈における、律法の解釈と教授に携わる集団を、一般読者に伝わりやすい定着した日本語で表した。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団名を音写しつつ、「派の人々」によって人間集団であることを自然に示した。
- source_word: δεινῶς ἐνέχειν
  choice: 激しく迫り
  rationale: δεινῶς の強い敵対的な程度と、ἐνέχειν の圧力をかけて詰め寄る意味を、簡潔で自然な表現にまとめた。
- source_word: ἀποστοματίζειν αὐτὸν
  choice: 答えを引き出そうとし
  rationale: 稀な動詞が示す、相手に即答させたり矢継ぎ早に問いかけたりして発言を引き出す敵対的行為を訳した。ただし語義の幅は脚注に残した。
- source_word: περὶ πλειόνων
  choice: 多くのことについて
  rationale: 比較の「さらに多く」ではなく、多岐にわたる話題を指す文脈上の意味を自然に表した。
