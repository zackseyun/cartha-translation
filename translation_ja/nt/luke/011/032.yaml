  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: ja
  text: ニネベの男たちは、裁きの時にこの世代と共に立ち上がり、この世代を罪に定めます。彼らはヨナの宣教に応じて悔い改めたからです。見なさい、ヨナよりも偉大なものがここにあります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ここにヨナよりも偉大な方がおられます」または「ここにはヨナ以上のものがあります」。ギリシア語は中性形（「より偉大なもの／より多くのもの」）を用いており、イエスご自身との比較だけでなく、イエスとその働きにおいて現れている、より偉大な現実を広く指す可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: ニネベの男たち
  rationale: ἄνδρεςの明示的な男性複数を保ちつつ、現代日本語で自然にニネベ出身者を表す。
- source_word: ἀναστήσονται
  choice: 立ち上がり
  rationale: 終末の裁きにおいて起こされる含意を残しながら、文脈が明示する以上に「復活する」と限定しない。
- source_word: ἐν τῇ κρίσει
  choice: 裁きの時に
  rationale: ἐνの字義に拘泥せず、最終的な裁きの場面を明瞭で自然な日本語にする。
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: この世代の者たちと共に
  rationale: μετάの共同・同伴の意味を保ち、「世代」を単なる時代ではなく、その世代に属する人々として理解できる形にする。
- source_word: κατακρινοῦσιν αὐτήν
  choice: この世代を罪に定めます
  rationale: κατακρίνωの「単に裁く」より強い、有罪とする意味を表す。代名詞の指示対象も明示する。
- source_word: μετενόησαν
  choice: 悔い改めた
  rationale: 預言者の宣教への道徳的・霊的応答を示すμετανοέωの力を、日本語聖書で一般的かつ理解可能な表現で保つ。
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: ヨナの宣教を聞いて
  rationale: εἰςが示す、ヨナの宣教を契機とした応答を自然な日本語で表す。「宣教」はκήρυγμαの公的な告知という性格を保つ。
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 注意を強く促す談話標識の働きを、現代日本語で荘重さを失わず表す。
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: ここにヨナよりも偉大なものがあります
  rationale: 中性単数πλεῖονを「人」と決めず「もの」とし、イエスの人格だけでなく、その働きと到来した現実を含み得る原文の幅を保つ。
theological_decisions:
- issue: πλεῖον Ἰωνᾶの指示対象と意味の幅
  choice: ここにヨナよりも偉大なものがあります
  alternative: ここにヨナよりも偉大な方がおられます／ここにはヨナ以上のものがあります
  rationale: 中性形πλεῖονを男性的な「方」に変えず、イエスが中心にある一方、その人格と働きにおいて現存する、より偉大な現実をも含み得る曖昧さを保持する。
translation_notes:
  register: 明瞭な現代標準語を用い、説教的な荘重さは「見なさい」で保った。「罪に定める」は司法的意味を明確にし、「偉大なもの」はやや異例でも原文の中性形と神学的な幅を意識的に保持する。脚注記号は該当表現の直後に置いた。
