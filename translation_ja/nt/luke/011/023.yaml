id: LUK.11.23
reference: Luke 11:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: ja
  text: わたしとともにいない者は、わたしに敵対する。また、わたしとともに集めない者は、散らす。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: いない者
  rationale: 冠詞を伴う現在分詞の実質名詞的用法を、一般的な人物を指す自然な現代日本語で表した。「者」により単数かつ格言的な響きを保つ。
- source_word: μετ’ ἐμοῦ
  choice: わたしと共に
  rationale: 属格を取る μετά が示す連帯・同行を表し、イエスとの関係上の立場を明確にする。
- source_word: κατ’ ἐμοῦ
  choice: わたしに敵対し
  rationale: 属格を取る κατά の対立の意味を明瞭に表す。「反対する」よりも、前半が示す鋭い対立を保つ。
- source_word: συνάγων
  choice: 集めない者
  rationale: 集めて一つにする動作を表し、目的語を補わず、原文の比喩的な余白を残す。
- source_word: σκορπίζει
  choice: 散らしている
  rationale: συνάγω との対照を直接保つ。現在形の継続的・特徴的な動作を自然に示す。
- source_word: καὶ
  choice: そして（訳文では読点による並列）
  rationale: 二つの平行した節を結ぶ単純な接続であり、日本語では読点で滑らかに並列させた。
theological_decisions:
- issue: イエスに対して中立である可能性
  choice: イエスと共にいない者はイエスに敵対する、という二分的な言明をそのまま保つ。
  alternative: 単にイエスを支持していない、という弱い表現にする。
  rationale: 原文は絶対的な形で述べているため、その緊張を和らげず、同時に後代の教理的説明も加えない。
- issue: 「集める」の対象
  choice: 目的語を補わず「集める」とする。
  alternative: 人々、群れ、収穫などを明示する。
  rationale: 原文には目的語がなく、文脈から複数の比喩的連想が可能であるため、曖昧さを保持する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、格言的で厳粛な調子と二つの節の平行性を保った。「わたし」はイエスの発話として一般読者に自然な表記とした。
