  source_fidelity: 原文の二つの実質名詞的現在分詞（「〜でない者」「〜しない者」）と、「わたしと共に／わたしに敵対して」という対照は、おおむね正確に訳されている。目的語を補わず「集める／散らす」とすることも、原文の比喩的な開放性を保っている。ただし、原文の現在形はこの格言的・一般的な文脈では習慣的・性格描写的な現在として自然に受け取られ、「散らしている」は継続中の動作をやや強く示すため、「散らす」がより適切である。
  naturalness: 「わたしと共に」は明快で自然だが、表記を「ともに」としても読みやすい。原案の「敵対し、…散らしている」は文法上可能であるものの、二つの平行した断定文として区切ると、原文の格言的な力と日本語の明瞭さが増す。
  terminology: 「敵対する」はκατά ἐμοῦの対立を明確に表し、「集める／散らす」はσυνάγω／σκορπίζωの対照をよく保つ。「わたし」はイエスの発話として現代標準日本語に適切である。
