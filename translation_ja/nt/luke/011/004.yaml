id: LUK.11.4
reference: Luke 11:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: ja
  text: 私たちの罪をお赦しください。私たちに負い目のあるすべての人を、私たち自身も赦していますから。そして、私たちを誘惑に導き入れないでください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」は、「試み」または「試練」とも訳せる。
    reason: πειρασμόςは「誘惑」だけでなく、「試み」または「試練」を意味し得る。
lexical_decisions:
- source_word: ἄφες
  choice: お赦しください
  rationale: 祈りの中のアオリスト命令形であり、神への直接の願いとして自然で、ἀφίομενとの語のつながりも保てる。
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: 私たちの罪
  rationale: ἁμαρτίαの明示的な意味をそのまま表し、後半の負債表現と同一化しない。
- source_word: καὶ γὰρ αὐτοὶ
  choice: 私たち自身も……から
  rationale: γάρの理由提示を「から」で示し、強意代名詞αὐτοίとκαίを「私たち自身も」で保った。
- source_word: ἀφίομεν
  choice: 赦しています
  rationale: 前半のἄφεςと同じ「赦す」を用いて原文の反復を保持する。現在形の継続的・習慣的な響きも伝える。
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: 私たちに負い目のある人を皆
  rationale: ὀφείλωの負債語彙を「負い目」で残しつつ、対人関係上の赦しとして自然な日本語にした。「皆」によりπαντίを明示する。
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: 私たちを誘惑に陥らせないでください
  rationale: εἰσφέρωの「中へ運び入れる」という方向性を、日本語で不自然にならない「陥らせる」によって表した。πειρασμόςは本文で「誘惑」とし、語義の幅を脚注に残す。
theological_decisions:
- issue: πειρασμόςをめぐる最後の願いの意味
  choice: 「私たちを誘惑に陥らせないでください」とし、神と誘惑の関係について説明を加えない。
  alternative: 「私たちを試みに遭わせないでください」または「私たちを試練に導き入れないでください」
  rationale: 原文の神学的緊張を訳文の中で弱めたり解消したりせず、πειρασμόςの別の語義は脚注で提示する。
- issue: 「罪」と負債表現の関係
  choice: 前半を「罪」、後半を「負い目」と訳し分ける。
  alternative: 両方を一律に「罪」または「負債」とする。
  rationale: 原文は前半でἁμαρτίας、後半でὀφείλοντιを用いるため、その意図的な語彙上の差を保つ。
translation_notes:
  register: 現代の一般読者に明瞭な、敬意ある祈りの文体。「お赦しください」「陥らせないでください」で神への直接の願いを表した。伝統的な祈祷文の固定表現に過度に依存せず、原文の「罪」と負債語彙の対比を保持した。
