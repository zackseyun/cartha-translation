    issue: 「神への愛」が属格の意味を限定している。
    rationale: τὴν ἀγάπην τοῦ θεοῦ は文法上、「神への愛」と「神の愛」のいずれにも理解可能である。並行箇所や文脈から一方を有力と見る解釈はあり得るが、本文訳でその曖昧さを解消するのは避けるべきである。
  - severity: low
    issue: 「おろそかにしてはならなかった」は、文脈上の規範的な『すべきであった』より、単純な過去の禁止として響き得る。
    rationale: ἔδει ποιῆσαι…μὴ παρεῖναι は、すべき事柄と怠るべきでなかった事柄を対照する。日本語でも規範性を明示すると対応がよい。
