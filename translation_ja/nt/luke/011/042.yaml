revisions:
- from: だが、あなたがたファリサイ派の人々は災いだ。薄荷やヘンルーダ、あらゆる野菜の十分の一を納めながら、公正と神への愛を素通りしているからだ。これらを行い、あれらもおろそかにしてはならなかった。
  to: だが、あなたがたファリサイ派の人々は災いだ。薄荷やヘンルーダ、あらゆる野菜の十分の一を納めながら、公正と神の愛[a]を素通りしているからだ。これらを行うべきであり、あれらもおろそかにすべきではなかった。
  rationale: 原文の disputed な属格を本文で一義化しないよう「神の愛」に改め、脚注で二つの可能な理解を提示した。あわせて結語を、原文が表す規範的な対照（これらを実行し、あれらを怠らない）により明確に対応させた。他の語句は原文および英語監査訳の「pass by」と整合している。
