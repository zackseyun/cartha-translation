  source_fidelity: 「神への愛」は τοῦ θεοῦ の属格を目的格（神に向ける愛）に限定する。ここは「神の愛」（神からの愛）とも取り得るため、本文では両義性を保ち、注で示すのが適切である。結語も ἔδει に対応して、過去の叙述というより「すべきであった」という規範的非難を明確にする。
  naturalness: 全体として明瞭で自然である。「素通りしている」は抽象的な対象にも用いられ、παρέρχεσθε の「通り過ぎる」という比喩をよく保つ。結語は「おろそかにすべきではなかった」とすると、現代標準語としてより滑らかで意味も明確になる。
  terminology: 「ファリサイ派」「十分の一」「ヘンルーダ」「公正」は適切である。「神の愛」は属格の方向を確定しない表現として本文に用い、脚注で「神への愛」の可能性を併記する。
  issues:
