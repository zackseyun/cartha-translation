id: LUK.11.42
reference: Luke 11:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: ja
  text: だが、あなたがたファリサイ派の人々は災いだ。薄荷やヘンルーダ、あらゆる野菜の十分の一を納めながら、公正と神の愛[a]を素通りしているからだ。これらを行うべきであり、あれらもおろそかにすべきではなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の愛」は、「神が示す愛」とも「神への愛」とも理解できる。
    reason: τοῦ θεοῦ の属格がもつ文法的・解釈上の両義性を保持するため。
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: あなたがた…は災いだ
  rationale: 警告と断罪を含む預言者的な嘆きの強さを保ちつつ、現代日本語として明瞭にした。
- source_word: ἀποδεκατοῦτε
  choice: 十分の一を納めながら
  rationale: 宗教的な十分の一献納を表す動詞であり、日本語では目的語との関係が明確になるよう表現した。
- source_word: τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον
  choice: 薄荷やヘンルーダ、あらゆる野菜
  rationale: 植物名を具体的に保った。λάχανονは食用・園芸植物を広く指し得るが、文脈に自然な「野菜」とした。
- source_word: παρέρχεσθε
  choice: 素通りしている
  rationale: 単なる不履行以上に「傍らを通り過ぎる」という原語の像を保ち、英語監査層の pass by とも整合させた。
- source_word: τὴν κρίσιν
  choice: 公正
  rationale: ここでは裁判行為そのものより、神が求める正しい判断と公平な扱いを指すため。
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: 神への愛
  rationale: 属格は「神の愛」と「神への愛」の両義性を持ち得るが、並行するマタイ23:23の忠実・誠実に近い倫理的要求、およびルカ文脈を踏まえ、神を愛する義務として自然に訳した。
- source_word: ταῦτα…κἀκεῖνα
  choice: これら…あれら
  rationale: 近称・遠称の対照を保持した。「これら」は直前の公正と神への愛、「あれら」は十分の一の献納を指す。
- source_word: μὴ παρεῖναι
  choice: おろそかにしてはならなかった
  rationale: παρίημιの「放置する、怠る」の意味を自然な日本語で表した。
theological_decisions:
- issue: 「神の愛」の属格の方向
  choice: 神への愛
  alternative: 神の愛
  rationale: τοῦ θεοῦは文法上、神が与える愛とも神に向ける愛とも取り得る。本文では宗教指導者が実践すべき事柄が列挙されているため、目的格的属格として訳したが、原文の余地は認識している。
- issue: 細かな十分の一献納の位置づけ
  choice: 公正と神への愛を行う一方で、十分の一もおろそかにしてはならない
  alternative: 十分の一献納そのものを否定する
  rationale: ἔδει…μὴ παρεῖναιは双方を行うべきだったと明言しており、イエスの批判点は細目の遵守そのものではなく、より根本的な義務を素通りすることにある。
translation_notes:
  register: 明瞭な現代標準語を用いながら、預言者的な厳粛さを維持した。「災いだ」「素通りしている」によって原文の強さと比喩を残し、植物名ヘンルーダも一般化せず保持した。
