id: LUK.11.30
reference: Luke 11:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: ja
  text: ヨナがニネベの人々にとってしるしとなったように、人の子もこの時代の人々にとってしるしとなる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では、後半は「人の子もこの世代にとってそのようになる」となり、「しるし」は繰り返されていない。しかし、ヨナとの対比から、「しるしとなる」という意味が補われる。
    reason: 原文で後半に明示されていない述語を本文で補ったことを示し、比較構文における字義的な表現も伝えるため。
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: ～ように
  rationale: καθώςの比較を自然な日本語で表した。γάρは前文との説明的なつながりを担うが、この一節だけで不自然な「というのも」を置くより、文脈上の関係を比較構文に含ませた。
- source_word: ἐγένετο
  choice: しるしとなった
  rationale: 単なる存在ではなく、ヨナがしるしとしての役割を果たすに至ったというγίνομαιの結果的な含みを表す。
- source_word: Ἰωνᾶς
  choice: ヨナ
  rationale: 日本語聖書で定着している人名表記。
- source_word: τοῖς Νινευίταις
  choice: ニネベの人々にとって
  rationale: 与格が示す関係・対象を明確にし、ヨナが彼らに対するしるしであったことを自然な日本語で表す。
- source_word: σημεῖον
  choice: しるし
  rationale: ルカ文書における啓示的な徴という意味を保つ、定着した訳語。
- source_word: οὕτως ... καὶ
  choice: 同じように…も
  rationale: καθώςとの対応関係とκαίの付加的な意味を日本語の比較構文で表す。本文では前半の「～ように」と後半の「も」によって自然に示した。
- source_word: ἔσται
  choice: しるしとなる
  rationale: 直訳は「～であるだろう」だが、日本語では前半から補われる述語「しるし」を明示し、未来の意味を「なる」で自然に表した。ἐγένετοとの語彙上の違いは注で明示する。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書で定着した称号を保持し、そのメシア的・黙示的な響きを解釈的に限定しない。
- source_word: τῇ γενεᾷ ταύτῃ
  choice: この時代にとって
  rationale: γενεάを単に同年齢層に限定せず、同時代の人々を指す預言的な語感が伝わるようにした。与格は「にとって」で表した。
theological_decisions:
- issue: 後半節で省略されている述語
  choice: 「人の子もこの時代にとってしるしとなる」と、前半から理解される「しるし」を補った。
  alternative: 「人の子もこの時代に対してそうなる」のように省略を保つ。
  rationale: ギリシア語では後半にσημεῖονが反復されないが、καθώς…οὕτωςの平行構造によって明確に補われる。日本語で明示することは新たな神学的主張を加えるのではなく、比較の意味を自然に伝えるためである。
- issue: 「人の子」の意味
  choice: 伝統的な称号「人の子」をそのまま保持した。
  alternative: 「一人の人間」「人間である者」などと説明的に訳す。
  rationale: この表現には字義的意味と称号としての響きが重なっているため、特定の解釈に狭めず、福音書内外の関連性と神学的緊張を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「徴」ではなく一般の読者にも読みやすい「しるし」を用いた。節頭のγάρは単独引用で重くならないよう独立した接続語にせず、比較構文の流れの中で表した。
