  text: τὸν ἄρτον ἡμῶν τὸν ἐπιούσιον δίδου ἡμῖν τὸ καθ’ ἡμέραν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/003.yaml
  text: Give us each day our daily bread[a].
translation:
  language: ja
  text: 日ごとに、私たちに必要なパンをお与えください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「日ごとのパン」「来たる日のためのパン」とも訳せる。まれな語で意味について議論があり、「存在に必要なパン」、また、この箇所では可能性が低いが「超実体的なパン」とする解釈もある。
    reason: ἐπιούσιον の語義が不確かであり、有力な別訳と歴史的解釈を示すため。
lexical_decisions:
- source_word: ἄρτον
  choice: パン
  rationale: 語の具体的な意味を保ちつつ、祈りの文脈では日々の基本的な糧を代表し得る。主本文で「食べ物」と一般化せず、伝統的な表現も保持した。
- source_word: ἡμῶν
  choice: 私たちに必要な
  rationale: 属格「私たちの」は日本語では「私たちの必要なパン」より「私たちに必要なパン」が自然であり、ἐπιούσιον の有力な理解とも重なる。ただし原語の構造上は「私たちのパン」である。
- source_word: ἐπιούσιον
  choice: 必要な
  rationale: 非常にまれで意味の定まらない形容詞。「日ごとの」とすると τὸ καθ’ ἡμέραν と不自然に重複するため、日々必要とする糧という有力な語義を本文に採用し、他の解釈は脚注に示した。
- source_word: δίδου
  choice: お与えください
  rationale: 現在命令形の継続的・反復的な含みは「日ごとに」によって自然に表される。祈りにふさわしい丁寧で現代的な表現とした。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 命令動詞の間接目的語をそのまま明示した。
- source_word: τὸ καθ’ ἡμέραν
  choice: 日ごとに
  rationale: 一日一日繰り返される備えを明確にし、ルカ特有の継続的な依存の強調を保った。
theological_decisions:
- issue: 主の祈りにおける ἐπιούσιον の意味
  choice: 必要な
  alternative: 日ごとの／来たる日のための／存在に必要な／超実体的な
  rationale: この形容詞の意味は古くから論争がある。ルカの τὸ καθ’ ἡμέραν は日々の備えという通常の理解を支持するが、形容詞自体を「日ごとの」と断定すると同じ意味が重なる。そこで本文では「必要な」とし、時間的・神学的な別解を脚注に残して曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準語。祈りとしての品位を保つため敬語の「お与えください」を用いた。「日ごとに」を文頭に置き、継続的な願いを自然に強調した。
