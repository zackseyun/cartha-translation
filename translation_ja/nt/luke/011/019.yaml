id: LUK.11.19
reference: Luke 11:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: ja
  text: しかし、もしわたしがベルゼブルによって悪霊を追い出しているのなら、あなたがたの子らは、誰によって[a]悪霊を追い出しているのですか。ですから、彼ら自身があなたがたの裁き手となります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何によって」または「どんな力によって」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、もし
  rationale: δέの穏やかな対比と、εἰが導く条件を、議論の流れに即して自然な現代日本語で示す。
- source_word: ἐγὼ
  choice: わたしが
  rationale: 明示された一人称代名詞を訳出し、イエスと「あなたがたの子ら」との対比を保つ。
- source_word: ἐν Βεελζεβοὺλ
  choice: ベルゼブルによって
  rationale: ἐνをここでは作用主体・手段を表すものと理解する。「力によって」と補わず、原文の簡潔さを保つ。
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: 悪霊どもを追い出している
  rationale: ἐκβάλλωの排除の動作を明瞭な「追い出す」で表し、δαιμόνιαを人格的な悪しき霊を指す「悪霊ども」とする。
- source_word: οἱ υἱοὶ ὑμῶν
  choice: あなたがたの子ら
  rationale: 解釈によって「弟子たち」「仲間」などに置き換えず、υἱοίの直接的な表現と解釈上の緊張を保持する。
- source_word: ἐν τίνι
  choice: 誰によって
  rationale: ベルゼブルとの対比から、作用主体を問う表現として訳す。ただし中性の可能性を反映する別訳を脚注に示す。
- source_word: ἐκβάλλουσιν
  choice: 悪霊どもを追い出している
  rationale: 先行する目的語を日本語で補って問いの対象を明確にし、同じ動詞を同じ訳語で反復する。
- source_word: διὰ τοῦτο
  choice: ですから
  rationale: 前の修辞的な問いから導かれる結論を、簡潔で自然な推論表現として示す。
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: 彼ら自身があなたがたの裁き手となります
  rationale: αὐτοίの強調を「自身」で保持し、κριταίを文脈に適した「裁き手」とする。
theological_decisions:
- issue: 「あなたがたの子ら」の指示対象
  choice: 字義どおり「あなたがたの子ら」とする。
  alternative: 「あなたがたの弟子たち」「あなたがたの仲間」「あなたがたと同じ民の者たち」
  rationale: この表現が誰を指すかは解釈上議論があるため、本文で特定の集団に限定せず、ギリシア語の親族表現を保持する。
- issue: ἐν τίνιが問うもの
  choice: 人格的な作用主体を意識して「誰によって」とする。
  alternative: 「何によって」「どんな力によって」
  rationale: 直前のベルゼブルとの対応は「誰によって」を支持するが、代名詞の形は手段・力を問う理解も許すため、脚注で残す。
- issue: αὐτοίの強調
  choice: 「彼ら自身が」と明示する。
  alternative: 強調を弱めて「彼らが」とする。
  rationale: 彼らの行為が相手の主張を退け、彼らが相手を裁く立場になるという修辞的な反転を原文どおり保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、イエスの反論にふさわしい端正さを保った。「悪霊ども」は複数を明示し、「子ら」「裁き手」は原文の表現と修辞的緊張を保つために採用した。
