  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: ja
  text: しかし、イエスは言われた。「いや、むしろ[a]、神のことばを聞いて、それを守る人たちこそ幸いです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「確かに、……こそ幸いです」または「そうです。しかし、それ以上に、……こそ幸いです」とも訳せる。ギリシア語の語は、前の発言を認めながら重点を別のところへ向けることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ εἶπεν
  choice: しかし、イエスは言われた
  rationale: δὲが前節の発言との対照を示すため「しかし」とし、αὐτόςは文脈上イエスを指すので、現代日本語で主語を明確にした。「言われた」は尊敬を込めた自然で品位ある表現。
- source_word: Μενοῦν
  choice: いや、むしろ
  rationale: 直前の祝福を単純に否定せず、その重点を聞いて守る者の幸いへと向け直す、肯定を含み得る修正・強調の力を表す。
- source_word: μακάριοι
  choice: 幸いです
  rationale: 単なる心理的幸福や偶然の幸運ではなく、神の前にある祝福された状態を表す、聖書日本語として自然な語。
- source_word: οἱ ἀκούοντες
  choice: 聞いて
  rationale: 現在分詞が示す継続的・特徴的な行為を、後続の「守る」と並ぶ自然な日本語の連用表現で示した。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: λόγοςの「語られたことば・知らせ・啓示」という幅を保ちつつ、明瞭で聖書的な響きのある表現とした。
- source_word: φυλάσσοντες
  choice: それを守る
  rationale: φυλάσσωが含む保持、心に留めること、従って実践することの幅を、「守る」によって過度に限定せず表した。目的語「それ」は日本語の明瞭さのため補った。
theological_decisions:
- issue: 女性が述べた祝福に対するイエスの応答の強さ
  choice: 「いや、むしろ」により、直前の発言をただ全面否定するのではなく、真の幸いの重点を神のことばを聞いて守ることへ向け直す応答として訳す。
  alternative: 「実に」として肯定を前面に出す、または「いや」として明確な否定を前面に出す。
  rationale: Μενοῦνには肯定しつつ重点を修正・強化する余地がある。本文ではその緊張を保ち、脚注で可能な別のニュアンスを示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言にふさわしい品位を保った。「人たちこそ」によって祝福の真の対象への焦点を自然に示し、Μενοῦνの曖昧さは本文と脚注の組み合わせで保持した。
