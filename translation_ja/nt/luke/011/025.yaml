id: LUK.11.25
reference: Luke 11:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: ja
  text: そして、戻って来ると、その家が掃かれ、整えられているのを見つける。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「掃き清められ、飾られている」。
    reason: σεσαρωμένονとκεκοσμημένονには、それぞれ清掃の完了と装飾を前面に出す訳も可能であるため。
lexical_decisions:
- source_word: ἐλθὸν
  choice: 戻って来ると
  rationale: アオリスト分詞を時を表す表現として訳した。前節で汚れた霊が「自分の家に戻ろう」と述べているため、「戻って」は文脈上明らかな帰還を自然に示す。
- source_word: εὑρίσκει
  choice: 見つける
  rationale: 歴史的現在の生き生きとした語り口を、日本語でも現在形で保った。主語である汚れた霊は文脈から明らかなため、自然な日本語として明示しない。
- source_word: σεσαρωμένον
  choice: 掃かれ
  rationale: 完了受動分詞が示す、掃いた結果の状態を、後続する「いる」によって表した。「きれいに」は原文に明示されないため本文には加えない。
- source_word: κεκοσμημένον
  choice: 整えられている
  rationale: κοσμέωは飾ることも意味するが、家については整然と整える意味が適切である。完了受動分詞の結果状態を自然な現代日本語で表した。
theological_decisions:
- issue: 明示されていない目的語の指示対象
  choice: その家
  alternative: そこ／目的語を省略する
  rationale: ギリシア語では目的語が省略されているが、前節の「家」が明白な指示対象である。日本語で意味を明瞭にしつつ、新たな解釈を加えないため「その家」と補った。
- issue: 汚れた霊を指す主語の表現
  choice: 主語を明示しない
  alternative: その霊は
  rationale: ギリシア語では「霊」に一致する中性形だが、日本語では文脈から主語が明らかであり、省略する方が自然である。人格性について本文以上の判断を加えない。
translation_notes:
  register: 明快で格調を保った現代標準語。二つの完了受動分詞を並列させ、家がその状態にあることを「いる」で示した。
