  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: ja
  text: しかし、その中のある者たちは言った。「ベルゼブル[a]、すなわち悪霊たちの支配者によって、この人は悪霊たちを追い出しているのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ベルゼブル」は、伝統的に「ベルゼブブ」とも表記される。ここではギリシア語本文の語形に従った。
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: しかし、その中のある者たちは
  rationale: τινέςの不特定の複数とἐξ αὐτῶνの部分を表す意味を保ち、δὲは直前の肯定的な反応との対照を示す「しかし」とした。
- source_word: Ἐν Βεελζεβοὺλ
  choice: ベルゼブルの力で
  rationale: ἐνはここで人格的存在を介した手段・力を示す。「によって」よりも、ベルゼブル自身が悪霊を追い出すとの誤読を避けつつ、告発の意味を自然な日本語で表す。
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: 悪霊どもの支配者
  rationale: ἄρχωνの権威・統治者という意味を「支配者」で明確に表し、τῶν δαιμονίωνはその支配下にある集団として訳した。
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: 悪霊どもを追い出している
  rationale: ἐκβάλλωの悪霊追放の文脈における意味を、現代日本語として自然な「追い出す」で表した。現在形は継続的・特徴的行為として「追い出している」とした。
- source_word: Βεελζεβοὺλ
  choice: ベルゼブル
  rationale: ギリシア語本文のΒεελζεβούλを音写した。伝統的な別形「ベルゼブブ」は脚注に示す。
theological_decisions:
- issue: Βεελζεβούλという悪霊的存在の名の表記
  choice: ベルゼブル
  alternative: ベルゼブブ
  rationale: 原語本文の語形を優先して音写し、広く知られた伝統的表記は異形として脚注に残した。
- issue: ἄρχωνの訳語
  choice: 悪霊どもの支配者
  alternative: 悪霊どものかしら
  rationale: 本文が述べる権威関係を明瞭に表しつつ、後代の悪霊論的な体系を持ち込まないため「支配者」とした。
translation_notes:
  register: 明瞭で現代的だが品位ある叙述。「この人」を補うことで日本語の引用文として主語を自然に示した。脚注記号は該当文末に置いた。
