id: LUK.11.43
reference: Luke 11:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: ja
  text: ファリサイ派の人々、あなたがたには災いがある。あなたがたは、会堂での上席[a]や、市場で人々からあいさつを受けること[b]を好むからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「最上位の席」または「名誉ある席」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 公の場で社会的な敬意や承認を表すあいさつ。
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: ああ、あなたがたは災いだ
  rationale: 預言者的な嘆きと断罪の力を保ちつつ、現代日本語で明瞭な表現とした。単なる不幸の予告ではなく、厳粛な宣告であることを示す。
- source_word: τοῖς Φαρισαίοις
  choice: ファリサイ派の人々
  rationale: 歴史的な宗教集団を指す名称として、一般読者にも理解しやすい標準的な表記を用いた。
- source_word: ὅτι
  choice: からだ
  rationale: 災いの宣告の理由を導く接続詞として、因果関係を明確に示した。
- source_word: ἀγαπᾶτε
  choice: 好む
  rationale: ここでは他者への愛ではなく、名誉ある待遇を強く求め、好む意味なので、文脈に即した自然な日本語とした。
- source_word: τὴν πρωτοκαθεδρίαν
  choice: 上席
  rationale: 会堂内で高い身分や名誉を示す特別な席を簡潔に表す。位置としての『前の席』に限定せず、地位の含意を保った。
- source_word: ἐν ταῖς συναγωγαῖς
  choice: 会堂での
  rationale: ユダヤ人の集会・礼拝の場所を指す定着した訳語『会堂』を採用した。
- source_word: τοὺς ἀσπασμοὺς
  choice: 人々から敬意を込めて挨拶されること
  rationale: 単なる挨拶一般ではなく、公の場で社会的な敬意や承認を受けることを好むという文脈上の含意を自然な日本語で示した。
- source_word: ἐν ταῖς ἀγοραῖς
  choice: 広場で
  rationale: ἀγοράは市場を含む公共の広場を指す。ここでは公衆の面前という社会的文脈が中心なので『広場』とした。
theological_decisions:
- issue: イエスの災いの宣告の性質
  choice: 公的な名誉を好むファリサイ派への預言者的な災いの宣告
  alternative: 単なる礼儀や社会的態度への批判
  rationale: οὐαίとそれに続く理由は、礼儀上の注意にとどまらない道徳的・霊的な断罪を形作る。訳文では解釈を過度に補わず、その厳粛さを保った。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳粛な非難にふさわしい格調を保った。『ああ……災いだ』でοὐαίの嘆きと断罪を表し、『上席』『敬意を込めて挨拶されること』により名誉追求という一貫した焦点を明確にした。
