  to: そして、わたしはあなたがたに言います。求めなさい。そうすれば、与えられます。捜しなさい。そうすれば、見つけます。戸をたたきなさい。そうすれば、戸は開かれます。[a]
  rationale: 接続詞を過度に推論的にせず、εὑρήσετεの能動態を「見つけます」で示した。最後の約束は、戸を補うことは文脈上明瞭なため維持しつつ、「開かれます」として未来受動・行為者未明示という原文の形を保った。現在命令形の反復・継続の可能性は本文に固定せず、脚注で示す。
