reference: Luke 11:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: ja
  text: そして、わたしはあなたがたに言います。求めなさい。そうすれば、与えられます。捜しなさい。そうすれば、見つけます。戸をたたきなさい。そうすれば、戸は開かれます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の現在命令形の継続的な含みを明示するなら、「求め続けなさい……捜し続けなさい……たたき続けなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: そこで、わたしはあなたがたに言います
  rationale: καίは直前の教えを受けてイエスの結論へつなぐため「そこで」とし、強意を伴うἐγώを「わたしは」で表した。λέγωは現代日本語で自然な「言います」とした。
- source_word: αἰτεῖτε
  choice: 求めなさい
  rationale: 願い求める意味を持つ命令であり、祈りの文脈にも適する自然で格調ある表現とした。現在命令形の継続的な含みは脚注に示した。
- source_word: δοθήσεται ὑμῖν
  choice: そうすれば、与えられます
  rationale: 未来受動形をそのまま受動表現で訳し、与える主体を原文同様に明示しなかった。ὑμῖνは日本語では文脈上明白なため重ねて明示しない。
- source_word: ζητεῖτε
  choice: 捜しなさい
  rationale: 何かを見いだそうとするζητέωの幅を保ち、後続の「見つかります」と自然に対応させた。
- source_word: εὑρήσετε
  choice: 見つかります
  rationale: 未来の約束を自然な現代日本語で表し、主語を明示しなくても聞き手自身が見つけるという意味が伝わる形にした。
- source_word: κρούετε
  choice: 戸をたたきなさい
  rationale: ギリシア語では目的語が省略されているが、日本語で「たたきなさい」だけでは対象が不明瞭なため、後続の「開ける」から含意される戸を補った。
- source_word: ἀνοιγήσεται ὑμῖν
  choice: そうすれば、開けてもらえます
  rationale: 未来受動を、戸をたたく者のために誰かが開けるという関係が自然に伝わる受益表現で訳した。行為者は原文同様に明示しない。
theological_decisions:
- issue: 現在命令形 αἰτεῖτε、ζητεῖτε、κρούετε のアスペクト
  choice: 本文では「求めなさい」「捜しなさい」「戸をたたきなさい」と単純な命令形で訳す
  alternative: 「求め続けなさい」「捜し続けなさい」「たたき続けなさい」
  rationale: 現在命令形には反復・継続の含みがあり得るが、それを本文で明示するとアスペクトを過度に限定する可能性があるため、本文では曖昧さを保ち、脚注で継続的な訳の可能性を示した。
- issue: 神的受動表現 δοθήσεται、ἀνοιγήσεται の行為者
  choice: 与える者、開ける者を明示しない
  alternative: 「神が与えてくださいます」「神が開けてくださいます」
  rationale: 文脈上は神が行為者と理解され得るが、この節のギリシア語自体は行為者を明示していないため、神学的解釈を本文へ補わず受動表現を保った。
translation_notes:
  register: 明快な現代標準日本語を用い、三つの命令と約束の並行構造を短文で際立たせた。丁寧体によってイエスの教えとしての品位と一般読者への読みやすさを両立させた。脚注記号[a]は三つの現在命令形全体に関わるため節末に置いた。
