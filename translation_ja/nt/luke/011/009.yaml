  naturalness: 短い命令と応答の反復は自然です。「そして、わたしはあなたがたに言います」は明快な現代標準日本語として許容され、「戸は開かれます」は原文の受動性を自然に保ちます。
  terminology: 「求めなさい」「捜しなさい」「戸をたたきなさい」は祈りの文脈にも合い、ζητεῖτεの広がりとκρούετεが含意する戸を適切に表します。神を本文に補わず、受動表現を保つのが適切です。
