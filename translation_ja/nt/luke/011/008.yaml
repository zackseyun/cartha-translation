id: LUK.11.8
reference: Luke 11:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: ja
  text: あなたがたに言います。たとえ家の中の人が、相手が自分の友人だからといって起き上がり、何かを与えようとしなくても、相手の恥知らずなほどの粘り強さ[a]のために、起き上がって、その人が必要とするものは何でも与えるでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「厚かましさ」「大胆さ」、またはより直訳的に「恥知らずであること」とも訳せる。ギリシア語の「彼の」は形式上、家の中の人を指すとも解されうるが、文脈上は求めに来た人を指すと理解されることが多い。
    reason: ἀναίδειαの語義の幅、および所有代名詞αὐτοῦの指示対象に関する解釈上の曖昧さを示すため。
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: イエスの直接的な導入句を、明瞭で自然な現代日本語にした。
- source_word: εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς
  choice: たとえ…起きて…渡してくれなくても
  rationale: εἰ καίの譲歩的・条件的な力を保ち、寝床から起きる場面を自然に表した。
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: 友達だからというだけでは
  rationale: 原因を示す構文と個人的な友人関係を保ち、後半との対比が日本語で明確になるようにした。
- source_word: διά γε τὴν ἀναίδειαν αὐτοῦ
  choice: その人の恥知らずなほどのしつこさのためなら
  rationale: ἀναίδειαの『恥を意に介さない』という否定的な語感を残しつつ、この文脈での執拗な求めを伝えた。αὐτοῦは文脈上、求める側の人を指すものとして訳した。
- source_word: ἐγερθεὶς δώσει αὐτῷ
  choice: 起き上がって…渡してくれるでしょう
  rationale: 前のἀναστὰςとの語彙上の違いを過度に強調せず、寝床から起きて与える動作を自然に表した。
- source_word: ὅσων χρῄζει
  choice: 必要なものをすべて
  rationale: 必要とする物の十分な量・範囲を表す属格複数関係詞の意味を簡潔に示した。
theological_decisions:
- issue: ἀναίδειαの意味
  choice: 恥知らずなほどのしつこさ
  alternative: 大胆さ／厚かましさ／恥知らずであること
  rationale: 単なる徳としての忍耐に弱めず、社会的な恥を意に介さないという語の鋭さと、求め続けるという文脈上の含意を併せて保った。神が無礼そのものを評価するという解釈には踏み込まない。
- issue: αὐτοῦが指す人物
  choice: 求めに来た人
  alternative: 家の中にいる人
  rationale: 物語の流れでは、渡す動機となるἀναίδειαは求める側の厚かましいほどの執拗さを指すと理解するのが自然だが、ギリシア語の代名詞自体には形式上の曖昧さがあるため注で補った。
translation_notes:
  register: 現代標準日本語による、平明で品位のある語り口。友人間の夜中の依頼という日常的場面に合わせて「友達」「渡す」を用いながら、ἀναίδειαの強い語感は失わないようにした。
