  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: ja
  text: また、イエスは彼らに言われた。「あなたがたのうち、友人がいて、真夜中にその人のところへ行き、その人に、『友よ、パンを三つ貸してくれ』と言う者が、だれかいるでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ εἶπεν πρὸς αὐτούς
  choice: また、イエスは弟子たちに言われた
  rationale: καίは談話の継続を示す「また」とし、主語は直前の文脈からイエス、αὐτούςは聞き手である弟子たちとして明示した。敬意を表す自然な叙述として「言われた」とした。
- source_word: Τίς ἐξ ὑμῶν
  choice: あなたがたのうち…人がいるとします
  rationale: 直訳的な「あなたがたのうち誰が」は、後続する長い条件的場面と日本語では結びつきにくい。修辞疑問による想定場面の導入を、自然な現代日本語で表した。
- source_word: ἕξει φίλον
  choice: 友人がいて
  rationale: 未来形ἕξειは、この修辞的な想定では必ずしも未来時を指さないため、場面設定として自然な現在的表現にした。
- source_word: πορεύσεται πρὸς αὐτὸν
  choice: その人のところへ行き
  rationale: 移動と相手への方向を、簡潔で自然な日本語にした。
- source_word: μεσονυκτίου
  choice: 真夜中に
  rationale: 時間を表す属格を、直接的で慣用的な表現にした。
- source_word: Φίλε
  choice: 友よ
  rationale: 呼格を保ち、同じ語根の φίλον との反復も「友人／友」で示した。
- source_word: χρῆσόν μοι
  choice: 貸してほしい
  rationale: χράωの命令形は必要な物を貸すことを求める表現。日本語では直接的な命令「貸してくれ」より、友人への依頼として自然な「貸してほしい」とした。
- source_word: τρεῖς ἄρτους
  choice: パンを三つ
  rationale: ἄρτοςは文脈上、数えられるパンの塊を指す。「三斤」は現代日本語で大きさについて余計な印象を与えうるため、一般読者に明快な助数表現とした。
