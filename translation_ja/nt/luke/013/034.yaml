id: LUK.13.34
reference: Luke 13:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: ja
  text: エルサレム、エルサレム、預言者たちを殺し、自分のもとに遣わされた人々を石で打ち殺す者よ。めんどりが自分のひなを翼の下に集めるように、わたしは幾度も、あなたの子らを集めたいと願ったことか。それなのに、あなたがたは望まなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、呼びかけられている「エルサレム」は単数形ですが、ここでの「あなたがたは望まなかった」は複数形です。また、「願った」と「望まなかった」は同じく意志・願望を表す語で対照されています。
    reason: 原文の単数から複数への移行と、意志を表す語の反復を明示するため。
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: エルサレム、エルサレム
  rationale: 地名の反復を保ち、嘆きと強い呼びかけを再現した。
- source_word: ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα
  choice: 預言者たちを殺し、…石で打ち殺す者よ
  rationale: 冠詞を伴う現在分詞の呼びかけとして訳し、神からの使者に対するエルサレムの特徴的・反復的な振る舞いを表した。λιθοβολέω は単に石を投げることではなく、石打ちによって殺す処刑を指しうるため、「石で打ち殺す」とした。
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: 自分に遣わされた人々
  rationale: 完了受動分詞の受動性を保ちつつ、擬人化されたエルサレムを受ける再帰的な「自分に」で自然な日本語にした。
- source_word: ποσάκις ἠθέλησα ἐπισυνάξαι
  choice: わたしは幾度、…集めようとしたことか
  rationale: 嘆きの修辞を「幾度…ことか」で表し、θέλω の意志・願望と不成立の結果を自然な日本語で伝えた。
- source_word: τὰ τέκνα σου
  choice: あなたの子ら
  rationale: 母なる都市として呼びかけられるエルサレムの擬人化を保ち、住民などに解釈を限定しなかった。
- source_word: ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας
  choice: めんどりがそのひなを翼の下に集めるように
  rationale: ὄρνις は一般に鳥も意味しうるが、ひなを翼の下に集める母鳥の比喩では「めんどり」が自然で鮮明である。νοσσιά の集合的な幼鳥を、日本語では自然な「ひな」とした。
- source_word: καὶ οὐκ ἠθελήσατε
  choice: それなのに、あなたがたは応じようとしなかった
  rationale: 複数形の主語を明示し、直前の「あなたの子ら」と関係する人々の拒絶を表した。「応じようとしなかった」は意志的拒否を自然に示すが、直訳的な代案を注記した。
theological_decisions:
- issue: 「あなたの子ら」の指示対象
  choice: 「あなたの子ら」とし、エルサレムの住民、同市に属する民、あるいはイスラエルを代表する表現のいずれかに限定しない。
  alternative: 「エルサレムの住民」「その都の民」
  rationale: 原文は都市を母として擬人化する比喩を用いており、訳文でもその幅を保つべきである。
- issue: θέλω / ἠθελήσατε の意志の対照
  choice: 「集めようとした」対「応じようとしなかった」と訳し、イエスの意志と人々の意志的拒否を示す。
  alternative: 「集めたいと願った」対「あなたがたは望まなかった」
  rationale: 節が明示する意志の対照を保ちつつ、神の意志と人間の意志をめぐる体系的な教理上の結論は付加しない。
- issue: 単数形のエルサレムと複数形の拒否者
  choice: 呼びかけでは「エルサレム」「者よ」と単数的な擬人化を保ち、最後は原文の複数形に従って「あなたがた」とする。
  alternative: 全体を単数の「あなた」で統一する。
  rationale: 原文にある単数から複数への移行は、都市とその民との関係に解釈上の緊張を残すため、均して消さない。
translation_notes:
  register: 現代の一般読者に理解しやすい、明瞭で格調のある口調。「者よ」「幾度…ことか」によって預言者的な嘆きの調子を保ちつつ、過度に古風な語法は避けた。
