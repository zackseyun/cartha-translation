  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: ja
  text: ところが、会堂長は、イエスが安息日に癒やしたことに憤り、群衆に言った。「働くべき日は六日ある。だから、その六日の間に来て癒やしてもらいなさい。安息日には来て癒やしてもらってはいけない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: ところが……言った
  rationale: δέの対照的な展開を「ところが」で示す。ἀποκριθείςは直前の出来事への応答を表すが、日本語で「答えて……言った」と重ねるより、文脈上の応答性を保ちながら「言った」とする方が自然である。
- source_word: ὁ ἀρχισυνάγωγος
  choice: 会堂司
  rationale: 会堂の運営や礼拝を取り仕切る役職を指す。簡潔で、政治的支配者との誤解を避けられる標準的な訳語を用いた。
- source_word: ἀγανακτῶν
  choice: 憤り
  rationale: 単なる怒りよりも、正しくないことが行われたと感じる強い不満を表す語であり、「憤る」がその含みを保つ。
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: イエスが安息日に癒やしたことに
  rationale: ὅτιを理由を示す表現として訳し、癒やしが会堂司の憤りの原因だったことを明確にした。
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: 群衆に言った
  rationale: 未完了過去の継続的側面を日本語で機械的に「言っていた」とすると、反復や長時間の発言を必要以上に示唆しうるため、この発言場面に自然な「言った」とした。
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: 働くべき日は六日ある
  rationale: δεῖの義務・規範の力を「べき」で保ちつつ、現代日本語として自然な語順にした。これは語り手の承認ではなく、会堂司自身の主張として提示される。
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: その日に来て癒やしてもらいなさい
  rationale: οὖνの推論は前文から自然に伝わるため、冗長な接続語を加えず命令の流れに反映した。θεραπεύεσθεは形態上、受動命令として「癒やしてもらいなさい」と訳した。
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: 安息日にはいけない
  rationale: 前の命令に対する否定的対照を、会堂司の制止の強さが伝わる自然な日本語で表した。原文の「安息日の日」という言い回しは日本語では単に「安息日」とした。
theological_decisions:
- issue: 会堂司が労働と癒やしの日を規定する発言の扱い
  choice: 会堂司自身の規範的な反対意見として、その義務感と制止の口調を保って訳す。
  alternative: 語り手による一般的・神的な規定であるかのように訳す。または、偽善への評価をこの節に補う。
  rationale: 本文は会堂司の発言を報告しており、その主張を承認も論評もしていない。後続節の評価を先取りせず、発言者の視点と物語上の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会堂司の公的で強い口調を保った。「癒やす」は聖書文体として定着しつつ一般読者にも理解できる表現である。脚注を必要とするほど重大な本文上・訳語上の曖昧さはないと判断した。
