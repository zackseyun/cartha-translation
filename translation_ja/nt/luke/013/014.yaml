  to: ところが、会堂長は、イエスが安息日に癒やしたことに憤り、群衆に言った。「働くべき日は六日ある。だから、その六日の間に来て癒やしてもらいなさい。安息日には来て癒やしてもらってはいけない。」
  rationale: 会堂司の発言としての規範的で強い調子を保ったまま、安息日に禁じている行為が「来て癒やしてもらうこと」であると明示した。「だから」はοὖνの推論を自然に反映する。「会堂長」は役職名としてより標準的で明瞭な訳語である。
