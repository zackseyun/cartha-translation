id: LUK.13.35
reference: Luke 13:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: ja
  text: 見よ、あなたがたの家は、あなたがたに残されている。[a][b] わたしはあなたがたに言う。あなたがたが、「主の名によって来られる方に、祝福があるように」[c]と言う時が来るまで、あなたがたは決してわたしを見ることはない。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「残されている」は、「見捨てられている」または「放棄されている」とも訳せる。この受動形には、裁きの結果として引き渡されるという含みがあり得る。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたの家」は、エルサレム、とりわけその神殿を指す可能性が高いが、ギリシア語は単に「あなたがたの家」と述べている。
    reason: alternative_reading
  - marker: c
    text: 「主の名によって来られる方に、祝福があるように」は、詩篇118篇26節を踏まえた言葉。
    reason: cross_reference
  - marker: d
    text: この言葉をイエスのエルサレム入城と結びつける解釈も、将来イエスが認められる時を指すとする解釈もある。ギリシア語自体は、時期を一つに限定していない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 厳粛な宣言へ注意を促す語勢を保ちつつ、聖書的な格調をもつ簡潔な現代日本語とした。
- source_word: ἀφίεται
  choice: 残される
  rationale: 現在受動形を保ち、文脈上あり得る「見捨てられる」「放棄される」という司法的含意を本文で確定しない。
- source_word: ὁ οἶκος ὑμῶν
  choice: あなたがたの家
  rationale: 原文どおり広い表現を保ち、エルサレム、神殿、イスラエルの家のいずれかに本文で限定しない。
- source_word: λέγω δὲ ὑμῖν
  choice: わたしはあなたがたに言う
  rationale: δέはここでは軽い移行・継続を示すため、日本語では不自然な逆接を加えず簡潔に表した。
- source_word: οὐ μὴ ἴδητέ με
  choice: あなたがたは決してわたしを見ることがない
  rationale: οὐ μήと接続法による強い未来否定を「決して……ない」で明確に表した。
- source_word: ἕως ἥξει ὅτε εἴπητε
  choice: あなたがたが……と言う時が来るまで
  rationale: 原文の時間表現を自然な日本語の語順に組み替え、将来の時点を明示した。
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: 来られる方に、祝福があるように
  rationale: 詩篇の祝福宣言として自然な日本語にし、ὁ ἐρχόμενοςを過度に称号化せず敬意を示した。
- source_word: ἐν ὀνόματι κυρίου
  choice: 主の名によって
  rationale: 聖書で認識しやすい定型を保ち、来ることの権威・委任という含みを伝える。
theological_decisions:
- issue: 「あなたがたの家」の指示対象
  choice: 本文では「あなたがたの家」とした
  alternative: エルサレム／神殿／イスラエルの家
  rationale: 文脈上はエルサレム、とりわけ神殿が強く示唆されるが、ギリシア語自体は単に「家」と述べるため、その幅を保った。
- issue: 最後の言葉が指す時期
  choice: 特定の出来事に限定しない未来の時として訳した
  alternative: エルサレム入城／将来の悔い改め／終末における承認
  rationale: 原文は一つの時期だけを必然的に指定しないため、解釈上の緊張を本文に残した。
- issue: ἀφίεταιの含意
  choice: 「残される」として受動と曖昧さを保持した
  alternative: 見捨てられる／放棄される
  rationale: 神による裁きとして引き渡される含意はあり得るが、行為者も語義の強さも原文では明示されていない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」「主の名によって」に聖書本文としての格調を残した。複数の「あなたがた」は複数形を明示するため保持した。引用句は詩篇との響きを保ちながら、現代の読者にも理解しやすい形にした。
