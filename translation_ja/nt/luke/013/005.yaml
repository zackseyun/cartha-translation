  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ ⸀μετανοῆτε πάντες ⸀ὡσαύτως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: ja
  text: いいえ、あなたがたに言います。しかし、悔い改めなければ、あなたがたは皆、同じように[a]滅びます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「同じ仕方で滅びます」。ギリシア語の「同じように」は、直前の事例に照らして、同種の裁きを指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: いいえ
  rationale: 直前の暗黙の問いを強く否定する語。現代日本語で自然かつ明確な応答とした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: ルカに見られる定型的な言い回しを、簡潔で自然な現代日本語にした。
- source_word: ἀλλ’ ἐὰν μὴ
  choice: （しかし）…なければ
  rationale: οὐχίによる否定から警告へ転じる逆接と条件を表す。日本語では文脈上「しかし」を明示せずとも転換が明瞭であり、簡潔さを優先した。
- source_word: μετανοῆτε
  choice: 悔い改めなければ
  rationale: 神に対する方向転換を求める文脈であり、単なる後悔や知的な意見変更に狭めない定着した聖書語を用いた。
- source_word: πάντες
  choice: 皆
  rationale: 警告が聞き手全員に及ぶことを明示する。
- source_word: ὡσαύτως
  choice: 同じように
  rationale: 先行する事例との類似を示しつつ、比較点が死に方、確実性、突然性のいずれかに限定されないようにした。
- source_word: ἀπολεῖσθε
  choice: 滅びます
  rationale: 単なる身体的な死に限定せず、破滅と裁きの重大さを保つ表現とした。
theological_decisions:
- issue: μετανοῆτεが示す悔い改めの範囲
  choice: 「悔い改める」と訳し、単なる後悔にも、後代の体系的な回心論にも限定しない。
  alternative: 「考えを変える」「立ち返る」
  rationale: この警告は神に対する悔い改めを求めているが、語の意味を内面的感情や特定の教理体系に狭めるべきではない。
- issue: ὡσαύτως ἀπολεῖσθεの比較の力点
  choice: 「同じように滅びます」とし、比較の具体的な側面を本文では特定しない。
  alternative: 「同じ仕方で滅びます」「同様に死にます」
  rationale: 前の二つの出来事との比較は明白だが、比較点が滅び方、裁きの確実性、突然性のどれであるかは明示されていないため、原文の幅を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「悔い改める」「滅びる」は聖書語として定着しており、この厳粛な警告に適する。脚注記号は対象となる文全体の後に置いた。
