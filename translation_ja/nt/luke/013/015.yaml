id: LUK.13.15
reference: Luke 13:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: ja
  text: しかし、主は彼に答えて言われた。「偽善者たちよ。あなたがたは一人一人、安息日に、自分の牛またはろばを飼い葉桶[a]からほどき、連れて行って水を飲ませるではないか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家畜の餌場」とも訳せる。ギリシア語は、飼い葉を置く場所や桶を指す。
    reason: φάτνη は具体的な飼い葉桶のほか、家畜の餌を置く場所を指すこともあるため。
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: ルカの叙述においてイエスに用いられる称号としての意味とキリスト論的な重みを保つ、標準的な訳語。
- source_word: Ὑποκριταί
  choice: 偽善者たちよ
  rationale: 複数呼格による鋭い叱責を、現代日本語で明確に表す。
- source_word: ἕκαστος ὑμῶν
  choice: あなたがたはだれでも
  rationale: 聞き手一人一人に当てはまるという分配的な意味を自然な日本語で保つ。
- source_word: τῷ σαββάτῳ
  choice: 安息日に
  rationale: 時を表す与格を簡潔かつ慣用的に訳す。
- source_word: λύει
  choice: 解き
  rationale: 飼い葉おけの所につながれた家畜の綱を解くという文脈に即した表現。
- source_word: βοῦν
  choice: 牛
  rationale: 牛類の家畜を指す語として、特定の性別や用途を過度に限定しない自然な訳語。
- source_word: ὄνον
  choice: ろば
  rationale: 現代日本語で明瞭な標準的訳語。
- source_word: φάτνης
  choice: 飼い葉おけ
  rationale: 家畜が餌を食べる設備または場所を指す語を、文脈に即して具体的に訳す。語義の幅は脚注で示す。
- source_word: ἀπαγαγὼν
  choice: 連れて行って
  rationale: 主動詞に先立つ分詞が示す動作の順序を、自然な連用表現で示す。原語の「その場から」の含意は、前の「から」と動作の流れによって伝わる。
- source_word: ποτίζει
  choice: 水を飲ませる
  rationale: 家畜に飲み物を与えるという使役的意味を、自然で明確な日本語にする。
theological_decisions:
- issue: イエスに用いられる叙述上の称号 κύριος
  choice: 主
  alternative: 主人
  rationale: ここではルカがイエスを指して用いる称号であり、「主」とすることで原文のキリスト論的な響きを保つ。「主人」では身分上の主人という限定的な意味に傾く。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「偽善者たちよ」で叱責の強さを保ち、末尾の「ではないか」で、聞き手自身の慣行を根拠とする修辞疑問を表した。
