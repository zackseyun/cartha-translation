id: LUK.13.8
reference: Luke 13:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: ja
  text: すると彼は答えた。「ご主人、この木を今年もこのままにしておいてください[a]。私が木の周りを掘り、肥やしを施す[b]まで。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「今年もこの木を切らずにおいてください」または「今年も見逃してください」。
    reason: ἀφίημιは「そのままにしておく」の意で、文脈上は伐採を猶予することを指す。
  - marker: b
    text: 「肥やし」は直訳では「糞」または「厩肥」。より一般的には「肥料を施す」。
    reason: κόπριαの具体的で素朴な語感を示すため。
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: すると彼は答えた
  rationale: 分詞と現在形動詞から成る語りの定型表現を、現代日本語として自然な叙述にした。「彼に」は文脈上明らかなため明示しない。
- source_word: Κύριε
  choice: ご主人
  rationale: たとえ話の中で、園丁がぶどう園の所有者に用いる敬称。神学的称号と断定せず、社会的関係と丁重さを自然に示す。
- source_word: ἄφες αὐτὴν
  choice: この木を……このままにしておいてください
  rationale: ἀφίημιの「そのままにしておく」という意味を保ち、直前のいちじくの木を日本語で自然に受けた。伐採を猶予する含みは文脈に委ねた。
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: 今年も
  rationale: καίの追加の意味と「この年」を簡潔かつ自然に表す。「もう一年」は明快だが、原文より解釈的になるため避けた。
- source_word: ἕως ὅτου
  choice: まで
  rationale: 後続する作業がなされるまでの猶予を示す表現として自然な日本語にした。
- source_word: σκάψω περὶ αὐτὴν
  choice: 私が周りを掘って
  rationale: σκάπτωの具体的な「掘る」という像を保ち、対象は前文から明らかなため省略した。
- source_word: βάλω κόπρια
  choice: 肥やしをやる
  rationale: κόπριαは厩肥・糞肥を指す。農作業として自然な表現を本文に置き、具体的な語義は注で示した。
theological_decisions:
- issue: たとえ話における κύριος の訳語
  choice: ご主人
  alternative: 主よ／旦那様
  rationale: ここでは園丁が所有者に呼びかけており、尊敬を示す呼称として機能する。「主よ」は神への直接的呼びかけと受け取られやすいため、物語上の関係を明確にしつつ神学的含意を過度に確定しない訳を選んだ。
translation_notes:
  register: 明瞭で現代的かつ品位ある会話調。園丁から所有者への敬意を「ご主人」「ください」で示した。具体的な農作業の像を保ちつつ、本文では普通の読者に自然な「肥やし」を用いた。
