reference: Luke 13:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: ja
  text: そして、見なさい[a]。後の者の中には先になる者がいる。また、先の者の中には後になる者がいる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見よ」とも訳せる。
    reason: ἰδοὺの伝統的で、より字義的な訳語を示すため。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 注意を促す談話機能を、現代日本語で理解しやすい呼びかけとして表した。「見よ」より現代的でありながら、続く逆転の宣言へ注意を向ける力を保つ。
- source_word: ἔσχατοι
  choice: 後の者たち
  rationale: 順位や位置において後にいる者を指し、道徳的な「劣った者」とは限定しない。πρῶτοιとの簡潔な対照も保つ。
- source_word: πρῶτοι
  choice: 先の者たち
  rationale: ἔσχατοιとの対照を自然な日本語の「先／後」で表し、特定の社会的・民族的カテゴリーに限定しない。
- source_word: οἳ ἔσονται
  choice: 先になる者／後になる者
  rationale: 関係節と未来形を自然な日本語で表し、現在の位置が将来逆転することを明確にした。
- source_word: εἰσὶν
  choice: 中に…者がおり／います
  rationale: 存在構文の意味を保ちつつ、日本語で不自然な逐語訳を避けた。この表現により、各集団の全員が必ず逆転するという意味を不用意に加えない。
- source_word: καὶ
  choice: そして
  rationale: 冒頭の接続を保持し、前の文脈を受けてこの宣言が続くことを示した。二つの並行節の間は読点と「先の者たち」で均衡を保った。
theological_decisions:
- issue: 逆転の言葉が指す範囲
  choice: 地位や順序の逆転を述べる一般的な表現として訳す
  alternative: 異邦人とユダヤ人、謙遜な者と高ぶる者、または終末の裁きにおける順位のいずれかに限定する
  rationale: 文脈は神の国への入場と終末的逆転を示唆するが、ギリシア語本文は対象を明示せず、簡潔で幅のある原則として述べている。その幅と緊張を訳文でも保った。
- issue: 逆転が全員に及ぶか
  choice: 「中に…者がいる」という存在表現にする
  alternative: 「後の者は先になり、先の者は後になる」と一般化する
  rationale: εἰσὶν ἔσχατοι οἳ… は存在を述べる構文であり、二つの集団の全員について断定する形ではない。日本語でもその限定されない存在的意味を保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、イエスの発話として穏やかな丁寧体に整えた。「見なさい」は現代的な注意喚起、「後の者たち／先の者たち」は格調を失わずに対句を保つ表現である。
