source:
  edition: SBLGNT
  text: ἰδὼν δὲ αὐτὴν ὁ Ἰησοῦς προσεφώνησεν καὶ εἶπεν αὐτῇ· Γύναι, ἀπολέλυσαι τῆς ἀσθενείας σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: ja
  text: すると、イエスは彼女を見ると、呼びかけてこう言われた。「婦人よ、あなたはあなたの弱さから解放されています。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたはその病から解放されました」とも訳せる。
    reason: ἀσθένειαは「弱さ」のほか「病」を意味し得て、ἀπολέλυσαιは完了した解放を「解放されました」と表すこともできるため。
lexical_decisions:
- source_word: ἰδὼν
  choice: 見ると
  rationale: アオリスト分詞を時間的に捉え、イエスが彼女を見たことに続いて呼びかけたという流れを、自然な現代日本語で表した。
- source_word: δὲ
  choice: ところが
  rationale: 物語を進めつつ、直前の状況からイエスの行動への穏やかな転換を示す。強すぎる逆接にはしていない。
- source_word: προσεφώνησεν
  choice: 呼びかけて
  rationale: 相手に向けて声をかける、または呼ぶという語義を保つ。「呼び寄せて」では、実際に近くへ来させたことまで明示するおそれがある。
- source_word: Γύναι
  choice: 婦人よ
  rationale: γύναι はこの文脈では敬意を欠く呼称ではない。「婦人よ」は、呼びかけであることと丁重さを簡潔に伝える。
- source_word: ἀπολέλυσαι
  choice: 解放されています
  rationale: 完了受動形が示す、すでに成し遂げられた解放と、その結果が現在も続いている状態の双方を表す。
- source_word: τῆς ἀσθενείας σου
  choice: その弱さから
  rationale: ἀσθένεια の広い意味範囲を保ち、病気や障害などの特定の診断名に限定しない。文脈上は身体的な衰弱・病状を指す。
theological_decisions:
- issue: 女性の状態を表す ἀσθένεια の性質
  choice: 「弱さ」と広く訳す
  alternative: 「病」「病弱な状態」「障害」
  rationale: 文脈では身体的な苦しみだが、原語自体は弱さ、衰弱、病を含む広い語である。現代的な医学上の分類を持ち込まず、原文の幅を残した。
- issue: ἀπολέλυσαι の完了受動の含意
  choice: 「解放されています」
  alternative: 「解放されました」
  rationale: 解放という出来事が完了し、その結果として現在も解放された状態にあるという緊張を保持した。解放の行為者は原文と同様に明示しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「婦人よ」は敬意ある呼びかけとして用い、「解放されています」によって完了受動の現在に続く結果を自然に示した。
