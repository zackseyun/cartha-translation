    text: 「不義」は「不正」または「悪」とも訳せる。直訳的には「不義の働き人たち」。
    reason: lexical_alternative
  revision_rationale: 発話導入を原文の中立的な接続に合わせて「そして」に改めた。πόθεν ἐστέは出自・由来を自然に示す「どこから来た者なのか」とした。πάντεςがἐργάται全体にかかることを明確にするため、「すべての」を呼びかけの名詞句に置いた。不義という主要訳語と、関係否認を含みうる「知らない」は維持した。
