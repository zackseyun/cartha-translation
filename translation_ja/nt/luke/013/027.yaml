revisions:
- from: すると彼は、あなたがたにこう言うだろう。「あなたがたがどこの者か、私は知らない。不義を行う者たちよ[a]、皆、私から離れ去れ。」
  to: そして彼はあなたがたに言うだろう。「あなたがたがどこから来た者なのか、私は知らない。すべての不義[a]を行う者たちよ、私から離れ去れ。」
  rationale: 発話導入を原文の中立的な接続に合わせて「そして」に改めた。πόθεν ἐστέは出自・由来を自然に示す「どこから来た者なのか」とした。πάντεςがἐργάται全体にかかることを明確にするため、「すべての」を呼びかけの名詞句に置いた。不義という主要訳語と、関係否認を含みうる「知らない」は維持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:35Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な意味はよく反映されている。οἶδαを「知らない」、πόθενを出自を問う表現、ἀπόστητεを強い離別命令、ἀδικίαςを「不義」とした点はいずれも原文に忠実である。ただし、καὶを「すると」とするのは、原文にない結果・展開の含みをやや加える。また「不義を行う者たちよ、皆」は日本語の語順として不自然で、πάντεςの包括性をより明瞭に前置できる。
  naturalness: 「あなたがたがどこの者か」は意味は通るが、現代日本語ではやや硬く、身分・所属を問うようにも響きうる。「どこから来た者なのか」は出自・来歴を問うπόθενの意味を自然に保つ。「すべての不義を行う者たちよ」とすれば、呼びかけと「すべて」の修飾関係が明快になる。
  terminology: 「不義」はἀδικίαの広い道徳的・法的な不正を保ち、νόμοςを含意する「無法」を避ける適切な訳語である。「行う者たち」はこの文脈のἐργάταιを自然に表す。
  issues:
  - severity: low
    issue: 「すると」がκαὶに結果的な含みを加える
    rationale: καὶは基本的な接続詞であり、この一節単独では「そして」のような中立的接続がより安全である。
  - severity: medium
    issue: 「不義を行う者たちよ、皆」の語順が不自然で、πάντεςの係り先が一読で明瞭でない
    rationale: πάντεςは呼びかけられているἐργάται全体を包括する。「すべての不義を行う者たちよ」とすることで、原文の包括性と呼格の力を自然に表せる。
  - severity: low
    issue: 「どこの者か」がやや硬く、所属・身分を問う含みを帯びうる
    rationale: πόθενは主として出身・由来を示すため、「どこから来た者なのか」のほうが自然で意味範囲を保つ。
  revised_text: そして彼はあなたがたに言うだろう。「あなたがたがどこから来た者なのか、私は知らない。すべての不義[a]を行う者たちよ、私から離れ去れ。」
  revised_footnotes:
