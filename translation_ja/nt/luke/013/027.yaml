source:
  edition: SBLGNT
  text: καὶ ἐρεῖ ⸀λέγων ὑμῖν· Οὐκ ⸀οἶδα πόθεν ἐστέ· ἀπόστητε ἀπ’ ἐμοῦ, πάντες ⸀ἐργάται ἀδικίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/027.yaml
  text: And he will say to you[a], ‘I do not know where you are from. Depart from me[c][b], all you workers of unrighteousness.’
translation:
  language: ja
  text: そして彼はあなたがたに言うだろう。「あなたがたがどこから来た者なのか、私は知らない。すべての不義[a]を行う者たちよ、私から離れ去れ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不義」は「不正」または「悪」とも訳せる。直訳的には「不義の働き人たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: あなたがたにこう言うだろう
  rationale: 「言う」に同語源の分詞「言いながら」が重なるギリシア語の冗長な発話導入を、意味を損なわず自然な現代日本語にまとめた。「こう」によって後続の直接話法を明示した。
- source_word: οἶδα
  choice: 私は知らない
  rationale: 関係の否認や承認の拒絶という文脈上の含みを残しつつ、語の基本的意味を直接表した。
- source_word: πόθεν ἐστέ
  choice: あなたがたがどこの者か
  rationale: 出身・由来を問う πόθεν の意味を保ち、「どこから来たか」だけに狭めない自然な表現とした。
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: 私から離れ去れ
  rationale: 決然とした分離を命じるアオリスト命令形の力を、「離れ去れ」で簡潔かつ重みをもって表した。
- source_word: πάντες ἐργάται
  choice: 行う者たちよ、皆
  rationale: πάντες の包括性と、呼びかけとしての力を明示した。日本語では「働き人」より「行う者」がこの道徳的文脈に自然である。
- source_word: ἀδικίας
  choice: 不義
  rationale: 正しさに反することを広く指す語義と、δικαιοσύνη 語群との対照を保つ。「無法」として νόμος の概念を過度に持ち込むことを避けた。
theological_decisions:
- issue: 裁きの言葉における ἀδικίας の訳し方
  choice: 不義
  alternative: 悪／不正
  rationale: ἀδικία の道徳的・神学的な広がりを保ち、特定の法概念に限定しないため。「悪」や「不正」も文脈上可能であることは注で示した。
- issue: οἶδα に含まれ得る関係否認
  choice: 知らない
  alternative: 認めない／見覚えがない
  rationale: 文脈上は関係や所属の否認を含み得るが、訳文で解釈を確定せず、原語の基本的表現を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、裁きの宣告にふさわしい重みを保った。発話導入のギリシア語的な重複は日本語では自然に統合し、命令文と呼びかけは簡潔で厳粛な調子にした。
