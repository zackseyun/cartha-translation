source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: ja
  text: イエスがこれらのことを話しておられると、イエスに反対していた者たちは皆、恥じ入っていた[a]。一方、群衆は皆、イエスによって行われていた、輝かしいすべてのこと[b]を喜んでいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恥をかかされていた」または「面目を失っていた」とも訳せる。原語には、イエスの言葉によって恥じ入る結果になったという受動的な含みがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「栄光あるすべてのこと」。「すばらしいこと」「見事なこと」とも訳せる。文脈には癒やしが含まれるが、原語は奇跡だけに限定しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: イエスがこれらのことを話しておられると
  rationale: 属格独立構文と現在分詞が表す同時進行を、自然な現代日本語で示した。文脈上の指示対象を明確にするため、代名詞を「イエス」とした。
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: イエスに反対していた者たち
  rationale: ἀντίκειμαι の能動的かつ継続的な反対の意味を保ち、単なる固定的な呼称「反対者」より動詞的な力を残した。
- source_word: κατῃσχύνοντο
  choice: 恥じ入っていた
  rationale: 未完了過去が示す継続的な状態を表した。ギリシア語の受動・中動の含みは日本語本文だけでは完全に再現しにくいため、別訳を脚注に示した。
- source_word: πᾶς ὁ ὄχλος
  choice: 群衆は皆
  rationale: 集合体としての群衆全体が応答したことを、自然な日本語で表した。
- source_word: ἔχαιρεν
  choice: 喜んでいた
  rationale: 未完了過去の継続相を保ち、一時点だけの反応ではなく、喜びが続いていたことを示した。
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: 輝かしいすべてのことを
  rationale: ἐπί＋与格が示す喜びの対象・理由を日本語の「を」で自然に表した。「輝かしい」は、奇跡だけに限定せず、栄光に満ちた、見事な事柄という広がりを保つ。
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: イエスがなさっていた
  rationale: ὑπό＋属格によるイエスの主体的な行為を明確にし、現在分詞の進行性を「なさっていた」で表した。
theological_decisions:
- issue: 「輝かしいこと」の範囲
  choice: 奇跡に限定せず、「輝かしいすべてのこと」と広く訳す。
  alternative: 「すべての奇跡」「すべてのすばらしいみわざ」
  rationale: 文脈には癒やしが含まれるが、ἐνδόξοις 自体は「奇跡」を意味する専門語ではない。イエスの力ある行為と公の正当性の双方を含み得る広さを保った。
- issue: ὑπ’ αὐτοῦ における行為主体
  choice: 「イエスがなさっていた」とし、イエスを直接の行為主体として表す。
  alternative: 「イエスを通して行われていた」
  rationale: ὑπό＋属格はここで自然に行為主体を示すため、間接的な手段を示す訳に弱めなかった。
- issue: κατῃσχύνοντο の態
  choice: 本文では自然な「恥じ入っていた」とし、受動的な含みを脚注で補う。
  alternative: 「恥をかかされていた」「面目を失っていた」
  rationale: 形態上は受動・中動の解釈幅があり、イエスの言葉によって公に恥じ入る結果となった含みがある。日本語で不自然な受動表現に固定せず、曖昧さを脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「話しておられる」「なさっていた」により聖書本文としての節度ある敬意と品位を保った。二つの集団の対照は「一方」で自然に示し、両方の未完了過去は「〜ていた」で継続的な反応として表した。
