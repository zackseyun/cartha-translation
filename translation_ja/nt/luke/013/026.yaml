  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: ja
  text: その時、あなたがたは言い始める。『私たちはあなたの前で食べ、飲みました。また、あなたは私たちの町の大通り[a]で教えました。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「広場」とも訳せる。ギリシア語は、町の幅広い通り、または開けた公共の場所を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: その時
  rationale: 話の展開における次の時点を示す。簡潔で自然な現代日本語とした。
- source_word: ἄρξεσθε λέγειν
  choice: こう言い始める
  rationale: ἄρχομαιと不定詞の組み合わせが持つ開始の意味を明示し、後続の直接話法へ自然につないだ。
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: 食べたり飲んだりしました
  rationale: 二つのアオリストが述べる過去の行為を自然な日本語で一組にし、共に飲食したという主張を保った。
- source_word: ἐνώπιόν σου
  choice: あなたの前で
  rationale: 相手の面前・居合わせるところでの行為を表し、親密な交わりとして過度に解釈しない表現とした。
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: 私たちの町の大通り
  rationale: πλατεῖαは町中の幅広い通りや開けた公共空間を指し得る。日本語として自然に地域的・公的な場を示すため「町」を補った。別の可能性は脚注に示した。
- source_word: ἐδίδαξας
  choice: 教えてくださいました
  rationale: 過去の歴史的事実を表すアオリストを丁寧な過去形で訳し、話者が相手に訴えかける直接話法として自然にした。
theological_decisions:
- issue: 話者たちがイエスとの関係を根拠に訴える性質
  choice: イエスの面前で飲食し、自分たちの町で教えを受けたという外面的な接点の主張として訳した。
  alternative: 認められた親しい交わりや救いの関係があったかのように訳す。
  rationale: 本文は話者側の近接性の主張を記すが、相手がその関係を認めたとは述べない。「あなたの前で」によって、この神学的緊張を解消せず保持した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、直接話法では丁寧語によって訴えかけの自然さを出した。全体の格調は保ちつつ、古風な「御前」などは避けた。
