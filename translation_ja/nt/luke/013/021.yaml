id: LUK.13.21
reference: Luke 13:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν ζύμῃ, ἣν λαβοῦσα γυνὴ ⸀ἔκρυψεν εἰς ἀλεύρου σάτα τρία ἕως οὗ ἐζυμώθη ὅλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: ja
  text: それはパン種[a]に似ています。ある女がそれを取って、三サタ[b]の小麦粉の中に隠し入れ、全体が発酵するまでのようなものです[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「発酵種」とも訳せる。古代に、練り粉を発酵させるために用いられた種を指す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「三サタ」。サタはセアに相当する古代の容量単位であり、三サタは大量の小麦粉を指す。
    reason: cultural_note
  - marker: c
    text: 「混ぜ入れる」とも訳せる。「隠し入れ」は、ギリシア語の動詞が字義的に「隠す」「覆い隠す」を意味することを反映している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία
  choice: 似ています
  rationale: たとえを導く述語形容詞。現代日本語として自然であり、比較の意味を明確に表す。
- source_word: ζύμῃ
  choice: パン種
  rationale: 古代の練り粉を発酵させる種を指す語であり、現代の市販イーストに限定せず、聖書の比喩的イメージも保てる。
- source_word: λαβοῦσα γυνὴ
  choice: ある女がそれを取って
  rationale: 不定の人物としてのγυνήと、主動詞に先行するアオリスト分詞λαβοῦσαを、自然な動作の連続として表した。
- source_word: ἔκρυψεν εἰς
  choice: 中に隠し入れると
  rationale: κρύπτωの字義である「隠す」を保持しつつ、材料の中へ入れるという文脈を自然な日本語で示した。単なる「混ぜる」として比喩を解消しない。
- source_word: ἀλεύρου σάτα τρία
  choice: 三サトンの小麦粉
  rationale: 古代の容量単位σάτονを音写して原文の文化的具体性を保ち、その量が非常に多いことは脚注で補った。ἄλευρονはこの調理文脈で「小麦粉」とした。
- source_word: ἕως οὗ ἐζυμώθη ὅλον
  choice: ついには全体が発酵しました
  rationale: ἕως οὗの終点と、受動形ἐζυμώθηおよびὅλονの全体性を、流れのよい日本語で表現した。
theological_decisions:
- issue: たとえにおけるパン種の象徴的意味
  choice: 象徴の評価を訳文に加えず、「パン種」という比喩をそのまま示す。
  alternative: パン種を悪の象徴、または神の国の肯定的な成長の象徴と明示する。
  rationale: この節はパン種の働きを比喩として提示するが、その象徴性を訳文内で教理的に断定してはいない。肯定・否定の評価を訳語に持ち込まず、解釈上の緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「三サトン」は本文で古代的な具体性を残し、理解に必要な情報を脚注で補った。「隠し入れる」は原文の意外性を保持しながら、日本語の調理場面でも理解できる表現とした。
