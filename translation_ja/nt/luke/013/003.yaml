reference: Luke 13:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχί, λέγω ὑμῖν, ἀλλ’ ἐὰν μὴ μετανοῆτε πάντες ⸀ὁμοίως ἀπολεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/003.yaml
  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: ja
  text: いいえ、そうではありません。あなたがたに言います。しかし、悔い改めなければ、あなたがたは皆、同じように滅びます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同じように」は、必ずしも全く同じ死に方を指すとは限らず、同様の突然の裁きを受けることを指す可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: いや、そうではありません
  rationale: 直前の暗黙の推論を強く否定する語。現代日本語として自然に応答の力を表す。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 聞き手への直接的で強調を伴う発言定型を、明瞭かつ簡潔に保つ。
- source_word: ἀλλ’ ἐὰν μὴ
  choice: 悔い改めなければ
  rationale: 対比を日本語の文脈に織り込み、否定条件を自然に表す。「そうではなく」の意味は先行する否定と後続の警告によって明らかである。
- source_word: μετανοῆτε
  choice: 悔い改める
  rationale: 単なる考え直しに限定せず、神の前で思いと生き方を改めるという文脈上の倫理的・霊的な力を保つ、現代日本語で定着した表現。
- source_word: πάντες
  choice: 皆
  rationale: 聞き手全員に及ぶ警告の包括性を簡潔に示す。
- source_word: ὁμοίως
  choice: 同じように
  rationale: 先行する出来事との比較を保ちつつ、死に方が完全に同一だと断定しない表現。
- source_word: ἀπολεῖσθε
  choice: 滅びます
  rationale: 肉体的な死だけにも、明示的な永遠の刑罰だけにも限定せず、裁きによる破滅という幅と重みを保つ。
theological_decisions:
- issue: μετανοέωの意味範囲
  choice: 悔い改める
  alternative: 考えを変える／立ち返る
  rationale: 「考えを変える」だけでは知的な再考に狭まりやすい。文脈にある神への応答の倫理的・霊的な力を示しながら、具体的な改宗過程を付加しない。
- issue: ἀπολεῖσθεが示す滅びの範囲
  choice: 滅びます
  alternative: 死にます／永遠に断罪されます／破壊されます
  rationale: 裁きの警告を保つ一方、ギリシア語がこの節だけでは確定していない滅びの様態や範囲を訳文で限定しない。
- issue: ὁμοίωςの比較内容
  choice: 同じように
  alternative: 同じ死に方で
  rationale: 先行例との類似を表すが、同一の死因や様態まで断定せず、原文の比較上の曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的かつ威厳ある敬体。「悔い改める」「滅びる」は聖書語として定着しているが、一般読者にも理解可能。原文の警告の直接性と神学的な幅を保った。
