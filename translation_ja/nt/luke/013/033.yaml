id: LUK.13.33
reference: Luke 13:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: ja
  text: しかし、私は今日も明日も、その次の日も、進んで行かなければならない[a]。預言者がエルサレムの外で命を落とすことはあり得ないからだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今日も明日も、その次の日も」は、文字どおりの三日間ではなく、短く定められた行程を慣用的に表している可能性もある。
    reason: cultural_note
  - marker: b
    text: 「あり得ない」は、「考えられない」または「ふさわしくない」とも訳し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: しかし
  rationale: 先行する発言を受けつつ、強い対照・限定を示す接続語として、現代日本語で自然かつ簡潔に表した。
- source_word: δεῖ με
  choice: 私は…なければならない
  rationale: δεῖ が表す必然性を保持した。神的必然性と状況上の必然性のどちらかに説明を限定しない。
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: 今日も明日も、その次の日も
  rationale: 三段階の時間表現を明示しつつ、日本語として自然な反復にした。短い定められた行程を表す慣用的可能性は脚注に残した。
- source_word: πορεύεσθαι
  choice: 自分の道を進む
  rationale: 単なる移動ではなく、行程を継続する含みを自然に表す。使命という解釈までは訳文に加えない。
- source_word: ὅτι
  choice: …からだ
  rationale: 直前の必然性に対する理由を明確に示す。
- source_word: οὐκ ἐνδέχεται
  choice: あり得ない
  rationale: 不可能・不相応・考えにくさを含み得る表現を、簡潔で格調のある日本語にした。厳密な形而上学的不可能と断定せず、反語的響きも排除しない。
- source_word: προφήτην
  choice: 預言者が
  rationale: 無冠詞単数の総称的・格言的性格を、日本語では裸の名詞で自然に表した。
- source_word: ἀπολέσθαι
  choice: 滅びる
  rationale: 死ぬ、殺される、失われるという語義幅と荘重さを保ち、受動的な殺害だけに意味を限定しない。
- source_word: ἔξω Ἰερουσαλήμ
  choice: エルサレムの外で
  rationale: 空間表現を直接かつ自然に訳した。
theological_decisions:
- issue: イエスが預言者の死について述べる言葉の力点
  choice: 「あり得ない」と訳し、不可能または不相応を表す原文の緊張と、エルサレムへの皮肉な告発の響きを残す。
  alternative: 「考えられない」「許されない」、または反語を明示して「預言者はエルサレム以外では死ねないものだから」とする。
  rationale: οὐκ ἐνδέχεται は、字義的な不可能だけでなく、慣行上考えにくいことや不相応さも表し得る。本文では断定の形を保ち、厳密な普遍命題か皮肉かを訳者が一方に決めない。
- issue: 「今日、明日、その次の日」の時間的意味
  choice: 三つの時間表現を本文にそのまま残し、短く定められた行程を指す可能性を脚注で示す。
  alternative: 厳密な三暦日としてのみ読む、または「しばらくの間」と意訳する。
  rationale: 原文の具体的な反復は保持すべきだが、文脈上、文字どおりの三日間に限定されない可能性もあるため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの言葉の荘重さと格言的・皮肉的な響きを保った。「自分の道を進む」は自然な移動表現であり、使命遂行という神学的解釈を本文に過剰に織り込まない。
