  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: ja
  text: そこで主人はぶどう園の世話をする人に言った。『見なさい。私はもう三年、このいちじくの木に実を探しに来ているが、何も見つからない。切り倒しなさい。なぜ土地まで役に立たなくしているのか。』[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「なぜ土地まで無駄にするのか」。ギリシア語の動詞には、単に場所を取ることだけでなく、土地を役に立たない、不生産的なものにするという意味合いがある。
    reason: καταργεῖの語義の幅、特に土地を無益・不生産的にする含みを示すため。
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: ぶどう園の世話をする人
  rationale: ぶどう園を耕作し管理する人を指す。文脈を保ちつつ、現代日本語で分かりやすい表現とした。
- source_word: Ἰδοὺ
  choice: 見なさい
  rationale: 相手の注意を強く促す語。古風すぎない、明瞭で品位ある命令表現とした。
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: もう三年
  rationale: 過去から現在まで続く三年間を、自然な日本語で表した。
- source_word: ἔρχομαι ζητῶν
  choice: 実を探しに来ている
  rationale: 三年にわたる反復的・継続的な行為を日本語の「来ている」で表した。
- source_word: καρπὸν
  choice: 実
  rationale: たとえの農業的描写を解釈的に言い換えず、そのまま保持した。
- source_word: συκῇ
  choice: いちじくの木
  rationale: 標準的な語義を明示的で自然な日本語にした。
- source_word: οὐχ εὑρίσκω
  choice: 何も見つからない
  rationale: ギリシア語の現在形を保ち、繰り返し探しても現時点で見いだせない状況を自然に表した。
- source_word: ἔκκοψον
  choice: 切り倒しなさい
  rationale: 木を除くよう命じる直接的なアオリスト命令を明確に表した。
- source_word: ἱνατί καὶ τὴν γῆν καταργεῖ
  choice: なぜこの木にまで土地を無駄にさせておくのか
  rationale: καίの付加・強意を「まで」で示し、καταργεῖが土地を占有するだけでなく役立たなくする含みも持つことを「無駄にさせる」で表した。使役的な日本語により、木が土地を無益な状態にしているという構造を保持した。
theological_decisions:
- issue: たとえの農業的描写と神学的解釈
  choice: 農業的な言葉をそのまま訳し、霊的な実りなどの解釈を本文に加えない
  alternative: 実を霊的成果などと解釈して訳文に明示する
  rationale: 本文はたとえの物語であり、その神学的適用は文脈から読み取らせるべきである。原文が持つ比喩と解釈上の余地を保持した。
- issue: καταργεῖの意味の幅
  choice: 土地を無駄にさせる
  alternative: 土地を占領する／土を役に立たなくする
  rationale: この動詞には場所を取ることと土地を無益・不生産的にすることの双方に通じる含みがあるため、本文では自然な包括表現を用い、別訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえ話にふさわしい簡潔さと品位を保った。「ぶどう園の世話をする人」は専門的な「ぶどう栽培者」より一般読者に理解しやすい。「いちじく」は現代の一般的な表記として平仮名にした。
