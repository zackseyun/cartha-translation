id: LUK.13.29
reference: Luke 13:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἥξουσιν ἀπὸ ἀνατολῶν καὶ δυσμῶν καὶ ⸀ἀπὸ βορρᾶ καὶ νότου καὶ ἀνακλιθήσονται ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: ja
  text: そして人々は、東からも西からも、北からも南からもやって来て、神の国で食卓に着く。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「（食事のために）横になる」。当時は宴席で身を横たえて食事をした。
    reason: 宴席を表す動詞の文化的背景と字義を示すため。
lexical_decisions:
- source_word: ἥξουσιν
  choice: やって来る
  rationale: ἥκωの未来形で、四方から一つの場所へ集まる動きを、現代日本語で自然に表す。
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: 東からも西からも
  rationale: 複数形の「日の出」「日の入り」は方角を表す慣用表現であり、日本語では「東」「西」が明瞭で自然。助詞「も」により列挙と包括性を示す。
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: 北からも南からも
  rationale: 先行する東西とともに四方全体を示す地理的表現として、そのまま自然に訳す。
- source_word: ἀνακλιθήσονται
  choice: 食卓に着く
  rationale: 宴席で身を横たえる食事習慣を指す動詞。日本語で字義的に「横になる」とすると食事の情景が伝わりにくいため、宴への参加を具体的かつ自然に示す「食卓に着く」とした。文化的な姿勢の詳細は脚注で補う。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 神の国で
  rationale: 定着した透明な訳語「神の国」を保ち、ἐνは宴席の行為がなされる領域として自然な「で」で表す。
theological_decisions:
- issue: 終末的な神の国の宴席のイメージ
  choice: 「食卓に着く」として食事・宴席の情景を保つ。
  alternative: 「神の国に入る」または単に「座る」
  rationale: ἀνακλιθήσονταιは宴席で横になって食事をすることを表すため、単なる入国や着席へ平板化せず、神の国での宴への参加という具体的な比喩を維持する。
- issue: 四方から集まる人々の範囲
  choice: 東西南北をそのまま訳し、人々の広範な集合を示す。
  alternative: 「あらゆる国の異邦人」と明示する。
  rationale: 文脈上広い世界的範囲を示唆するが、この節自体は民族を明記していないため、訳文で異邦人と限定せず原文の表現を保つ。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「人々」はギリシア語の三人称複数主語を自然に明示した。「やって来て」は移動の方向性を生き生きと表し、「食卓に着く」によって現代の読者にも宴席の像が直ちに伝わるようにした。
