source:
  edition: SBLGNT
  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: ja
  text: また、シロアムの塔が倒れてその下敷きになり、死んだあの十八人は、エルサレムに住むほかのすべての人よりも負い目の大きい者だった、とあなたがたは思うのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「負い目の大きい者」は、「罪人」「より悪い罪を犯した者」とも訳せる。ギリシア語は字義的には「債務者」を意味し、ここでは道徳的な負い目を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: また
  rationale: 直前の例に続く別の事例を提示する接続語として、現代日本語で自然な「また」とした。
- source_word: ἐκεῖνοι οἱ δεκαοκτὼ
  choice: あの十八人
  rationale: 指示詞・冠詞・数詞の組み合わせを簡潔に表し、原文に明示されない性別は補わない。
- source_word: ἐφ’ οὓς ἔπεσεν ὁ πύργος
  choice: 塔が倒れかかって
  rationale: ἐπίを伴う関係節の「その人々の上に塔が落ちた」という意味を、日本語で過度に説明的にならず自然に表した。
- source_word: ἐν τῷ Σιλωὰμ
  choice: シロアムの
  rationale: 塔の所在地を示す表現として、日本語では「シロアムにある塔」より簡潔で自然な連体修飾とした。
- source_word: ἀπέκτεινεν αὐτούς
  choice: 死んだ
  rationale: 文法上は塔が彼らを「殺した」だが、日本語では事故について「塔が倒れかかって死んだ」が自然で、因果関係も保たれる。
- source_word: δοκεῖτε ὅτι
  choice: とあなたがたは思うのですか
  rationale: 聞き手への直接的な問いかけを明示し、修辞的な挑戦の調子を保った。
- source_word: ὀφειλέται
  choice: 負い目のある者
  rationale: 字義的な「債務者」と文脈上の道徳的責任の双方を響かせ、「罪人」と同一化しすぎない表現を選んだ。
- source_word: ἐγένοντο
  choice: なった
  rationale: γίνομαιの動的な意味を保ち、「であった」と平板化しない。
- source_word: παρὰ πάντας τοὺς ἀνθρώπους
  choice: ほかのすべての人よりも
  rationale: παράの比較の意味を自然な日本語で表し、ἀνθρώπουςはここではエルサレムの住民一般を指すため「人」とした。
- source_word: τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: エルサレムに住む
  rationale: 現在分詞の継続的な居住の意味を、簡潔な現代日本語で表した。
theological_decisions:
- issue: ὀφειλέταιの道徳的意味
  choice: 負い目のある者
  alternative: 罪人／より悪い罪を犯した者／債務者
  rationale: 前節の「罪人」と異なるルカの語彙を保ちつつ、金銭的債務だけを意味するとの誤解を避ける。神の前での道徳的な負債・責任という比喩を訳文に残した。
- issue: 災難と罪責の比較
  choice: ほかのすべての人よりも負い目のある者になった
  alternative: ほかのすべての人より罪深かった
  rationale: イエスの問いが災難の犠牲者を特別に重い罪責と結びつける考えを問いただしていることを示しながら、問いそのものへの答えをこの節で先取りしない。
- issue: ἀνθρώπουςの包括範囲
  choice: 人
  alternative: 男たち
  rationale: 文脈上、エルサレムに住む人々一般を指しており、男性に限定する根拠がないため、包括的で自然な「人」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、修辞疑問の厳粛さを保った。「倒れかかって死んだ」は事故の描写として自然にしつつ、「負い目のある者」で原文の債務比喩と神学的緊張を残した。
