id: LUK.13.18
reference: Luke 13:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔλεγεν ⸀οὖν· Τίνι ὁμοία ἐστὶν ἡ βασιλεία τοῦ θεοῦ, καὶ τίνι ὁμοιώσω αὐτήν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/018.yaml
  text: So he was saying[a], “What is the kingdom of God like, and to what shall I compare it?”
translation:
  language: ja
  text: そこで、イエスは言われた。「神の国[a]は何に似ているだろうか。何にたとえようか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の支配」とも訳せる。場所や領域よりも、神が王として治めることを強調する表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: イエスは言われた
  rationale: 未完了過去は継続・反復を表し得るが、ここでは次のたとえを導入する発話として、現代日本語の物語文に自然な「言われた」とした。主語は文脈上イエスであり、日本語での明瞭さのため補った。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けて話を進める接続の働きを、自然な現代日本語で示す。強い論理的結論を示す「それゆえ」ほど限定しない。
- source_word: Τίνι ὁμοία ἐστὶν
  choice: 何に似ているだろうか
  rationale: 比較を求める問いを自然に表しつつ、後続の自己問答的な修辞とのつながりを保つ。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 確立した聖書語であり、領域としての国と神の支配という動的意味の双方を排除しない。
- source_word: καὶ
  choice: （句点で並列）
  rationale: 二つの並行する問いを日本語では独立した二文として並べることで、接続関係を自然に表した。意味上の並列は保持されている。
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: 何にたとえようか
  rationale: 未来形の自問的・修辞的な力を「ようか」で表し、「それ」を繰り返さなくても指示対象が明瞭な自然な日本語とした。
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ の訳し方
  choice: 神の国
  alternative: 神の支配
  rationale: 原語は領域だけでなく王としての統治も指し得る。「神の国」は伝統的で広い比喩領域を保つため本文に採用し、動的な「支配」の意味も脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「だろうか／ようか」により、二つの並行した修辞疑問を自然に表した。
