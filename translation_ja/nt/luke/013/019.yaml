  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: ja
  text: それは、からし種の一粒に似ている。ある人がそれを取って自分の庭に投げ入れると、成長して木[a]になり、空の鳥[b]がその枝に巣を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「木になった」と述べており、たとえにおける大きな成長のイメージをそのまま表しています。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「天の鳥」。ここでは、鳥のいる空を指す表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: それは……に似ている
  rationale: たとえを導く比較表現を、明瞭で自然な現代日本語にした。
- source_word: κόκκῳ σινάπεως
  choice: からし種の一粒
  rationale: κόκκοςの「粒、種」という意味を保ちつつ、日本語で小さな一粒を自然に表す。
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: ある人がそれを取って
  rationale: たとえに登場する一人の人物を「ある人」と表し、分詞の動作も明示した。日本語ではこの表現だけで性別を不必要に断定しないが、人物を一般的な複数者にもしていない。
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: 自分の庭に投げ入れると
  rationale: βάλλωの生き生きとした「投げ入れる」という動作と、κῆποςの具体的な「庭」を保った。「蒔く」は本文にない意味を補うため避けた。
- source_word: ηὔξησεν
  choice: 成長して
  rationale: 植物が育つ文脈で自然な訳語を用い、後続の「木になり」へ滑らかにつないだ。
- source_word: ἐγένετο εἰς δένδρον
  choice: 木になり
  rationale: δένδρονを植物学的な調整で「低木」などに変えず、たとえの大きな成長のイメージをそのまま保った。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 空の鳥
  rationale: οὐρανόςのここでの空間的意味を、自然で簡潔な日本語にした。
- source_word: κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ
  choice: その枝に巣を作った
  rationale: 鳥が枝に落ち着いて住むという文脈上の像を明瞭に表した。中性複数主語に単数動詞が伴うギリシア語の統語は、日本語では数を示さず自然に訳せる。
theological_decisions:
- issue: ἄνθρωποςが指す人物の表現
  choice: ある人
  alternative: ある男
  rationale: 原文は単数の人物を置いているが、ἄνθρωπος自体はこの形で必ずしも男性を語彙的に特定しない。「ある人」は単数性を保ち、原文以上の性別指定を加えない。
- issue: からし種がδένδρονになるというイメージ
  choice: 木
  alternative: 大きな草／低木
  rationale: 原文は明確にδένδρον（木）と述べる。植物学的に穏当な表現へ修正せず、たとえが示す驚くべき成長の像を保った。
- issue: 「空の鳥」という表現
  choice: 空の鳥
  alternative: 天の鳥／空を飛ぶ鳥
  rationale: τοῦ οὐρανοῦには「天の」という直訳も可能だが、ここでは鳥のいる領域を指す慣用表現であり、神学的な意味を加えない「空の」が自然である。
translation_notes:
  register: 明瞭で現代的ながら品位のある物語調とした。「投げ入れる」で原文の動作の鮮明さを保ち、「木」「空の鳥」「枝」というたとえの具体的な像を簡潔に再現した。
