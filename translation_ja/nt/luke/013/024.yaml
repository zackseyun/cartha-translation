  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: ja
  text: 「狭い戸口[a]から入るために、力を尽くしなさい。あなたがたに言います。多くの人が入ろうとするでしょうが、入ることができないからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「狭い扉から」。ギリシア語では「戸・扉」を意味する語が用いられている。マタイの並行箇所では、「門」を意味する別の語が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: 力を尽くしなさい
  rationale: 現在命令形が表す、真剣に力を注いで励むことを、明瞭で自然な現代日本語で示す。「努力しなさい」より切迫した力を保ちつつ、「闘いなさい」のように争いの意味へ限定しない。
- source_word: εἰσελθεῖν
  choice: 入る
  rationale: εἰσέρχομαιの基本的意味を自然に表し、節中の二つの用例で一貫させた。
- source_word: διὰ τῆς στενῆς θύρας
  choice: 狭い戸口から
  rationale: θύραは通常「戸」「戸口」を意味する。ここでは通過点として自然な「戸口」とし、στενῆςの空間的・比喩的な意味を「狭い」で保った。
- source_word: ὅτι
  choice: からです
  rationale: 命令の理由を導く因果関係を、現代日本語で明確に示した。
- source_word: πολλοί
  choice: 多くの人
  rationale: 実質的に名詞として用いられた形容詞を、明瞭な日本語にした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言いますが
  rationale: 語りかけの定型句を自然かつ丁寧に訳し、理由節の中への挿入も示した。
- source_word: ζητήσουσιν
  choice: 入ろうと求めても
  rationale: ζητέωの「求める」という語義を残し、Ἀγωνίζεσθεの真剣な奮闘との語彙的な違いを保った。「入ろうとしても」だけでは両者の違いが薄れる。
- source_word: οὐκ ἰσχύσουσιν
  choice: 入ることができない
  rationale: ここでのἰσχύωは、目的を成し遂げる力・能力があることを表す。「成功しない」より直接的で、「力が足りない」ほど逐語的に過ぎない。
theological_decisions:
- issue: 人間の努力と救いをめぐる表現
  choice: 「力を尽くしなさい」という命令の強さを保ち、功績や行いに関する教理的説明は加えない。
  alternative: 「入るよう努めなさい」または「入ろうとしなさい」
  rationale: 本文は真剣な努力を命じる一方、多くの人が求めても入れないと警告する。この緊張を、神の主権、人間の責任、功績について特定の立場で解消せず、そのまま保つ。
translation_notes:
  register: 明瞭な現代標準語による、自然で品位ある語りかけとした。「力を尽くしなさい」で命令の真剣さを表し、「戸口」は通り抜けて入るという文脈に適した日常的な語として採用した。
