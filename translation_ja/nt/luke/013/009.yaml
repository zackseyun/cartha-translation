  text: κἂν μὲν ποιήσῃ καρπὸν ⸂εἰς τὸ μέλλον— εἰ δὲ μήγε,⸃ ἐκκόψεις αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: ja
  text: そして、これから先、実を結べば――それでよいのです。しかし、実を結ばなければ、あなたはそれを切り倒すでしょう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἂν μὲν
  choice: そして、…ば
  rationale: καί＋ἐάνの接続・条件の力を「そして」と条件形で表し、μέν…δέの対照は後半の「もし…なければ」で自然に示した。
- source_word: ποιήσῃ καρπὸν
  choice: 実を結べば
  rationale: ποιέω＋καρπόςは果樹が実を生じることを表す慣用句なので、現代日本語で自然な「実を結ぶ」とした。
- source_word: εἰς τὸ μέλλον
  choice: これから先
  rationale: 直訳的には「将来に向けて／来たる時に」を意味する。文脈から「来年」と限定せず、原文の時間的な幅を保つ自然な表現を選んだ。
- source_word: εἰ δὲ μήγε
  choice: もし結ばなければ
  rationale: 先行条件を受ける否定を明示し、δέの対照を日本語の条件構文で簡潔に表した。
- source_word: ἐκκόψεις αὐτήν
  choice: あなたが切り倒してください
  rationale: ἐκκόπτωはこの園芸的文脈では木を「切り倒す」の意。未来形二人称は文脈上、園主が園丁に認める処置を表すため、硬い予告より自然な依頼・許可の調子で訳した。
theological_decisions:
- issue: 猶予後の時期の特定性
  choice: 「これから先」とし、時期を限定しない
  alternative: 前節の「今年」を受けて「来年」と訳す
  rationale: 本節のεἰς τὸ μέλλον自体は「来年」と明記せず、より広く将来・来たる時を指しうるため、裁きの猶予と条件性を保ちながら具体的な期間を補わなかった。
- issue: ἐκκόψειςの発話上の力
  choice: 「あなたが切り倒してください」
  alternative: 「あなたはそれを切り倒すでしょう」または「切り倒してもかまいません」
  rationale: 形態上は未来形だが、対話の中では園丁が園主に、実を結ばなかった場合の処置を委ねる言葉である。未来の断定に寄せすぎず、園主への丁寧な申し出として表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、たとえの農業的イメージと丁寧な対話の調子を保った。「よいのですが」は原文で省略された帰結を日本語として補うが、結果の内容を神学的に具体化してはいない。
