  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: ja
  text: イエスはまた言われた。「神の国を何にたとえようか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: 単純な接続を保ちつつ、直前のたとえに続く発言として自然な現代日本語にした。
- source_word: πάλιν
  choice: 再び
  rationale: 発言の反復を簡潔かつ品位ある表現で示す。
- source_word: εἶπεν
  choice: イエスは言われた
  rationale: ギリシア語では主語が動詞に含まれるが、文脈上の話者を日本語で明示し、敬意を伴う聖書文体として「言われた」とした。
- source_word: Τίνι ὁμοιώσω
  choice: 何にたとえようか
  rationale: 与格の疑問代名詞と比較を表す動詞を、日本語の熟慮的な修辞疑問として自然に再現する。「何に」は人ではなく比較対象を問う。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 神の王としての支配とその領域の双方を含み得る定着した聖書用語であり、原語の意味幅を保つ。
theological_decisions:
- issue: βασιλείαを神の支配についての言葉としてどう訳すか
  choice: 神の国
  alternative: 神の支配
  rationale: 「神の支配」も語義の一面を明確にするが、動的な統治だけに限定しかねない。「神の国」は日本語聖書で定着し、支配と領域の双方を含み得るため、原語の幅をよりよく保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある直接話法とした。「イエス」は原文で明記されていないが、文脈上の主語を日本語で自然に補った。
