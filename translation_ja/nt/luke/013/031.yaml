  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: ja
  text: ちょうどその時、何人かのファリサイ派の人々が近寄って来て、イエスに言った。「ここを出て、立ち去りなさい。ヘロデがあなたを殺したいと思っているからです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: ちょうどその時
  rationale: αὐτῇが示す特定性と即時性を、明瞭で自然な現代日本語で表した。
- source_word: προσῆλθάν
  choice: 近寄って来て
  rationale: イエスのもとへ近づく動きを自然に表す。
- source_word: τινες Φαρισαῖοι
  choice: 何人かのファリサイ派の人々
  rationale: τινεςの不特定性を保ち、どの人物たちかを特定しない。
- source_word: λέγοντες αὐτῷ
  choice: イエスに言った
  rationale: 分詞を日本語では主動詞と並ぶ自然な叙述にし、代名詞の指示対象を明確にした。
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: ここを出て、ここから立ち去りなさい
  rationale: 二つの命令動詞をともに訳し、現在地から離れるよう促す直接的な警告を保った。
- source_word: ὅτι
  choice: からです
  rationale: 先行する命令の理由を示す接続関係を明確にした。
- source_word: Ἡρῴδης
  choice: ヘロデ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: θέλει σε ἀποκτεῖναι
  choice: あなたを殺したいと思っている
  rationale: θέλειの願望・意志を、実行着手や確定した計画まで含意しない形で表した。
theological_decisions:
- issue: ファリサイ派の警告の動機
  choice: 発言をそのまま警告として訳し、動機を明示しない
  alternative: 善意の警告、またはイエスを立ち去らせるための威嚇と解釈して訳す
  rationale: ギリシャ語本文は彼らの真意を明言していないため、物語上の曖昧さを保持した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。命令は原文の直接性を保ちつつ、過度に乱暴な口調を避けた。
