source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: ja
  text: それなら、アブラハムの娘であるこの女性が、実に十八年もの間サタンに縛られていたのに、安息日にこの束縛から解かれるべきではありませんでしたか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: アブラハムの娘
  rationale: 直訳的な表現を保ち、単なる血統以上に、契約の民に属する者としての尊厳を示す含みを訳文の中で限定しない。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 聞き手の注意を十八年という長さへ向ける談話標識として明示し、原文の強調を保持する。
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: 縛られていた／解かれる／束縛
  rationale: 「縛る・解く・束縛」という原文の連続した比喩を日本語でも保つ。
- source_word: οὐκ ἔδει
  choice: 当然ではありませんか
  rationale: 否定疑問による強い当然性・必要性を、自然な日本語の修辞疑問で表す。
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: 安息日に
  rationale: ユダヤ教の安息日を指す定着した聖書用語を用いる。
theological_decisions:
- issue: サタンと女性の苦しみとの関係
  choice: 「サタンに縛られていた」と明示する
  alternative: 病状だけを述べ、サタンへの言及を弱める
  rationale: 原文はὁ Σατανᾶςを明確な行為主体としているため、その主張をそのまま保持する。苦しみの仕組みについて原文以上の説明は加えない。
- issue: 「アブラハムの娘」の意味
  choice: 比喩を直訳して解釈を開いたままにする
  alternative: 「アブラハムの子孫」「神の民の一員」と説明的に訳す
  rationale: 血統、共同体への帰属、契約上の尊厳という含意を一つに限定しないため。
- issue: 安息日に解くことの必要性
  choice: 「当然ではありませんか」とする
  alternative: 「解かなければならなかったのではありませんか」
  rationale: ἔδειの必要性を保ちつつ、この場面での修辞的・道徳的な当然性が現代日本語で明確に伝わるようにする。
translation_notes:
  register: 明瞭で現代的かつ dignified な標準日本語。原文の修辞疑問、十八年への注意喚起、縛る／解くの語彙的対照を保持した。「この女」は文脈上の指示性を明確にし、過度に婉曲な表現へ置き換えなかった。
