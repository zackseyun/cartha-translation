review_pass:
  verdict: revise
  source_fidelity: 原文は「泣きわめく」という動詞ではなく、「泣き叫び（嘆き）」と「歯ぎしり」が生じるという名詞的定型表現である。また、ἐκβαλλομένους ἔξω は「外に追い出されている」とするのが、排除と「外に」の双方を明確に保つ。
  naturalness: 現行訳は全体として理解できるが、「泣きわめき、歯ぎしりすることになる」はやや説明的で、定型句としても不自然さがある。「泣き叫びと歯ぎしりが起こる」のほうが明瞭で自然である。
  terminology: 「神の国」「アブラハム、イサク、ヤコブ」「預言者」は適切である。「外へ投げ出されている」は可能な訳だが、日本語では「外に追い出されている」がより自然で、ἐκβάλλωの排除の含意も保てる。
  issues:
  - severity: medium
    issue: κλαυθμός καὶ βρυγμὸς τῶν ὀδόντωνの表現
    rationale: 「泣きわめき、歯ぎしりすることになる」は二つの名詞を動詞句に再構成しており、特に「泣きわめき」がやや強く口語的である。定型的な苦悶の描写を「泣き叫びと歯ぎしりが起こる」とするほうが原文の構文と現代標準語の双方に適する。
  - severity: low
    issue: ἐκβαλλομένους ἔξωの訳語
    rationale: 「外へ投げ出されている」も不可能ではないが、「外に追い出されている」のほうが日本語として自然であり、ἐκβάλλωの強制的排除とἔξωの外部性を過不足なく表せる。
  revised_text: そこで、泣き叫びと歯ぎしりが起こる。アブラハム、イサク、ヤコブ、そしてすべての預言者が神の国にいるのを見、あなたがた自身は外に追い出されているときに。
  revised_footnotes:
  - marker: a
    text: 「外に投げ出されている」とも訳せる。ギリシア語の語は、力を伴って外へ排除されることを表す。
    reason: lexical_alternative
  revision_rationale: 神の国の内側にいる族長・預言者と、外へ排除される聞き手との対照を保持した。「そこで」はἐκεῖを自然に示し、「あなたがた自身」は明示された二人称代名詞とδέによる対比を表す。裁きの性質について本文を超える教理的説明は加えていない。
