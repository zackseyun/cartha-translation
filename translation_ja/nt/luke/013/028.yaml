id: LUK.13.28
reference: Luke 13:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: ja
  text: そこで、泣き叫びと歯ぎしりが起こる。アブラハム、イサク、ヤコブ、そしてすべての預言者が神の国にいるのを見、あなたがた自身は外に追い出されているときに。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖ
  choice: その場所で
  rationale: 排除された側の場所を指す場所の副詞。日本語では指示内容を明確にするため「その場所で」とした。
- source_word: ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων
  choice: 泣きわめき、歯ぎしりする
  rationale: 定冠詞を伴う二つの名詞表現を、現代日本語で自然な動作表現にした。「泣きわめく」は激しい嘆きを、「歯ぎしりする」は苦悶や憤りを表す具体的な比喩を保つ。
- source_word: ὅταν ὄψησθε
  choice: 見るとき
  rationale: 未来の特定の場面を導く接続表現として訳し、ギリシア語の時を示す関係を保持した。
- source_word: πάντας τοὺς προφήτας
  choice: すべての預言者
  rationale: πάντας の包括的な強調をそのまま残した。
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 神の国にいる
  rationale: 「神の国」という主要な聖書用語を保持し、見る対象の状態として自然な日本語になるよう「いる」を補った。
- source_word: ὑμᾶς δὲ
  choice: 自分たちは……のに
  rationale: 明示された二人称代名詞の対照的な強調を「自分たちは」で表し、δέ の対比を「のに」で自然に示した。
- source_word: ἐκβαλλομένους ἔξω
  choice: 外へ投げ出されている
  rationale: 受動分詞と方向を示す ἔξω を保ち、単なる退出ではなく、力を伴う排除という ἐκβάλλω の語感を示した。
theological_decisions:
- issue: 裁きの情景の性質
  choice: 排除と苦悶を表す具体的な言葉を保ち、それ以上の教理的説明を加えない。
  alternative: 「永遠の滅び」「最終的な断罪」などと解釈的に明示する。
  rationale: 本文は神の国にいる族長・預言者と、外へ排除される聞き手を対照させるが、この一節だけで裁きの全容を定義してはいないため。
- issue: 「神の国にいる」と「外へ投げ出される」の対照
  choice: 空間的な対照をそのまま表現する。
  alternative: 救われる者と救われない者という抽象的な説明に置き換える。
  rationale: 原文の具体的な内外のイメージと、その神学的緊張を解釈で平板化しないため。
translation_notes:
  register: 明瞭で現代的ながら品位ある文体とした。原文の語順を機械的に再現せず、ἐκεῖ を冒頭に置き、ὅταν 以下を後続させて情景の因果関係を読み取りやすくした。「泣きわめき、歯ぎしりする」は定型句の具体性を保ちつつ、一般読者に自然な動詞表現としている。
