  text: καὶ ἐπέθηκεν αὐτῇ τὰς χεῖρας· καὶ παραχρῆμα ἀνωρθώθη, καὶ ἐδόξαζεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/013.yaml
  text: And he laid his hands on her, and immediately she was made straight again, and she glorified God.
translation:
  language: ja
  text: そしてイエスが彼女の上に両手を置くと、彼女はたちまちまっすぐになり、神をあがめた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: 彼女の上に両手を置くと
  rationale: 按手を表すギリシア語の具体的な動作を保ちつつ、結果へ自然につながる現代日本語とした。主語がイエスであることは文脈上明らかだが、単独節としても分かりやすいよう明示した。
- source_word: παραχρῆμα
  choice: たちまち
  rationale: 癒やしが即時に起こったことを、簡潔で品位ある日本語で表す。
- source_word: ἀνωρθώθη
  choice: まっすぐになり
  rationale: 受動形が示す状態変化を自然な日本語で表し、曲がっていた身体がまっすぐにされたという文脈を保つ。「再び」に相当する語は原文に明示されないため加えない。
- source_word: ἐδόξαζεν
  choice: あがめた
  rationale: δοξάζωの神に栄光を帰する意味を自然な日本語で表す。未完了過去の継続性は文脈に委ね、過度に説明的な表現を避けた。
- source_word: τὸν θεόν
  choice: 神
  rationale: 直接目的語を標準的に訳した。
theological_decisions:
- issue: ἀνωρθώθηが表す癒やしの結果
  choice: 身体が「まっすぐになった」と訳す
  alternative: 「身をまっすぐに伸ばした」「まっすぐにされた」「再びまっすぐになった」
  rationale: 直前の文脈にある身体的な屈曲からの回復を示しつつ、能動的に自力で姿勢を伸ばしたとの含みを避ける。また、回復の意味は文脈にあるものの、「再び」は語彙上明示されていないため本文には補わない。
translation_notes:
  register: 明快な現代標準日本語。物語の簡潔さと厳かな調子を保ち、「あがめた」によって神への応答の宗教的重みを表した。
