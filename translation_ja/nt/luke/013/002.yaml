  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: ja
  text: そこでイエスは彼らに答えて言われた。「これらのガリラヤ人は、このような苦しみを受けたので、ほかのすべてのガリラヤ人にも増して罪人となった、とあなたがたは思うのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えて言われた
  rationale: セム語的な重複表現を保ちつつ、日本語として理解できる形にした。文脈上の主語であるイエスを明示した。
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο
  choice: ほかのすべてのガリラヤ人より罪深い者になった
  rationale: 比較を明確にし、ἐγένοντο の「なった」を保持した。ただし、この表現が被災によって罪人になったという意味か、罪深い者であることが明らかになったという意味かには解釈上の幅があるため、注で示した。
- source_word: ταῦτα πεπόνθασιν
  choice: このような目に遭った
  rationale: 完了形が示す、すでに受けた災難の結果を含む表現を、自然な現代日本語で表した。
theological_decisions:
- issue: 災難と罪深さの因果関係
  choice: 「このような目に遭ったから……罪深い者になった」と、原文の語順と論理関係を保った修辞疑問として訳した。
  alternative: 「このような目に遭ったのは、ほかの……より罪深かったからだと思うのか」
  rationale: 後者は一般的な理解を明瞭にするが、ἐγένοντο の「なった」を「罪深かった」と読み替える。本文では原文の緊張を残し、イエスがその推論を問いただしていることを疑問文で示した。
translation_notes:
  register: 明瞭で現代的だが、イエスの厳粛な問いにふさわしい丁寧で品位ある文体。「このような目に遭った」は日常的に理解しやすく、軽すぎない表現である。
