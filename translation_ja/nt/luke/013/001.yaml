  revision_rationale: 進行中の報告場面を「報告していた」で表し、時の限定を原文相応の「その時」に整えた。「ささげ物」により θυσίαι の祭儀的な意味を保ちつつ、ピラトの行為の具体的事情は補足していない。脚注は本文の語を「ささげ物」に合わせ、語彙上の代替訳のみを簡潔に示した。
