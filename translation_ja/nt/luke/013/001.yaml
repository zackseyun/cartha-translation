  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: ja
  text: その時、そこにいた何人かの人が、ピラトがガリラヤ人たちの血を彼らのささげ物と混ぜたことをイエスに報告していた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Παρῆσαν δέ τινες
  choice: そこにいた何人かの人が
  rationale: παρῆσαν の未完了過去を到着ではなくその場にいた状態として表し、δέ は日本語では過度な接続語を加えず、文脈の移行として自然に処理した。
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: ちょうどその時
  rationale: αὐτῷ の強調と、直前の文脈に結び付く特定の時を簡潔に表した。
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: イエスに…報告した
  rationale: ἀπαγγέλλω の知らせを伝える意味を「報告した」で表した。日本語では分詞構文を主節として整え、代名詞の指示対象を「イエス」と明示した。
- source_word: περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα
  choice: ガリラヤ人たちの血を
  rationale: 報告の内容を日本語の引用内容に組み込み、関係節を自然な所有表現に組み替えた。
- source_word: Πιλᾶτος ἔμιξεν
  choice: ピラトが…混ぜた
  rationale: μίγνυμι の基本的で生々しい表現を保ち、出来事の具体的な経緯を補わなかった。
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: 彼らのいけにえと
  rationale: μετά の「〜と」と αὐτῶν の所有表現を保った。「献げている最中」など、原文に明示されない状況は加えていない。
theological_decisions:
- issue: ピラトの行為の歴史的・道徳的含意
  choice: ガリラヤ人たちの血を彼らのいけにえと混ぜた
  alternative: いけにえを献げていたガリラヤ人たちを殺した
  rationale: 原文は衝撃的な出来事を簡潔に伝えるだけで、その方法や神学的意味を説明していないため、解釈的な補足を避けて緊張感のある表現をそのまま残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、出来事の厳粛さと原文の簡潔で生々しい語り口を保った。「犠牲」より祭儀的な供え物を指すことが伝わりやすい「いけにえ」を採用した。
