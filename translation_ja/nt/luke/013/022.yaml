id: LUK.13.22
reference: Luke 13:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: ja
  text: イエスは町々や村々を巡って教えながら、エルサレムへ向かって[a]旅を続けておられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エルサレムへ」。
    reason: εἰςは、進行方向を強調する「へ向かって」とも、目的地を直接示す「へ」とも訳せるため。
lexical_decisions:
- source_word: διεπορεύετο
  choice: 巡って
  rationale: 未完了過去が表す継続的な移動を文全体の「旅を続けておられた」と合わせて示し、各地を通って進む意味を自然な日本語で表した。
- source_word: κατὰ πόλεις καὶ κώμας
  choice: 町々や村々を
  rationale: κατάの分配的な含みを「町々」「村々」で表し、規模の異なる居住地を巡る様子を保持した。
- source_word: διδάσκων
  choice: 教えながら
  rationale: 現在分詞が旅と同時に続く付随行為を表すため、「ながら」で簡潔に訳した。
- source_word: πορείαν ποιούμενος
  choice: 旅を続けておられた
  rationale: 旅をして進んでいたという慣用表現の意味と、文全体の継続的な動作を自然に表した。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムへ向かって
  rationale: 目的地への方向を示しつつ、まだ到着していない旅の途上であるという物語上の進行を保った。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 日本語聖書で定着した地名表記を用いた。
theological_decisions:
- issue: イエスのエルサレムへの旅が示す方向性
  choice: エルサレムへ向かって
  alternative: エルサレムへ
  rationale: εἰςは目的地を「へ」と示すことも、進行方向を「へ向かって」と示すこともできる。本文では継続中の旅を明確にしつつ、脚注でより直接的な訳を示して曖昧さを保持した。
translation_notes:
  register: 明快な現代標準語を用い、進行中の巡回、教える行為、エルサレムを目的地とする旅を一つの自然な文にまとめた。文脈上の主語イエスを補い、敬意を示す「おられた」を用いた。
