  text: He was teaching in one of the synagogues on the Sabbath[a].
translation:
  language: ja
  text: イエスは安息日に[a]、会堂の一つで教えておられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「安息日ごとに」。ギリシア語は複数形だが、単数の「安息日」を指す慣用表現としても用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ διδάσκων
  choice: 教えておられた
  rationale: εἰμίの未完了過去と現在分詞による迂言的未完了過去で、過去に継続していた動作を表す。主語は文脈上イエスであり、日本語では自然な敬語表現として明示した。δέは弱い接続・場面転換であるため、独立した接続語を置かず文脈に委ねた。
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: ある会堂で
  rationale: 直訳的には「会堂の一つで」。日本語の「ある会堂で」は、不特定の一会堂という部分表現を自然かつ簡潔に伝える。「会堂」は当時のユダヤ教の集会施設を指す定着した聖書用語である。
- source_word: ἐν τοῖς σάββασιν
  choice: 安息日に
  rationale: 形態上は複数形だが、コイネー・ギリシア語では単数の安息日を指す慣用表現として用いられることがある。本文は自然な単数形とし、複数形の可能性を注に残した。
