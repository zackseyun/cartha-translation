id: LUK.13.11
reference: Luke 13:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ⸀γυνὴ πνεῦμα ἔχουσα ἀσθενείας ἔτη ⸀δεκαοκτώ, καὶ ἦν συγκύπτουσα καὶ μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: ja
  text: すると、そこに、十八年間、弱さの霊を抱えていた女がいた[a]。彼女は身をかがめており、完全に身を起こすことができなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「弱さの霊を持っていた」。これは、衰弱に関わる霊、または衰弱をもたらす霊とも理解できる。原文は「霊」を明記しているが、その性質や作用のあり方をそれ以上特定していない。
    reason: 「霊」という明示を保ちながら、霊が病を直接引き起こしたと断定しない原文の幅を示すため。
lexical_decisions:
- source_word: ἰδοὺ
  choice: すると、そこに
  rationale: 場面に注意を向ける語の働きを、古風な「見よ」を避けつつ、現代日本語の自然な物語表現で示した。
- source_word: γυνὴ
  choice: 女がいた
  rationale: この場面で初めて登場する一人の女性を、不定の人物として自然に導入した。
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: 弱さの霊に苦しめられている
  rationale: πνεῦμα（霊）を明示し、霊的な働きの可能性を残した。同時に、特定の悪霊による憑依だと本文以上に断定しないよう、「取りつかれている」は避けた。
- source_word: ἔτη δεκαοκτώ
  choice: 十八年もの間
  rationale: 継続期間を明確にし、「もの」によってその長さを自然に印象づけた。
- source_word: συγκύπτουσα
  choice: 腰が曲がり
  rationale: 前かがみに曲がった身体状態を、一般の読者に分かりやすい現代日本語で表した。
- source_word: μὴ δυναμένη ἀνακύψαι εἰς τὸ παντελές
  choice: どうしても体をまっすぐに伸ばすことができなかった
  rationale: 起き上がって直立することができない状態を表し、εἰς τὸ παντελές の強意を「どうしても」によって自然に反映した。
theological_decisions:
- issue: πνεῦμα ἀσθενείας が霊的作用を指すのか、単なる身体的疾患を指すのか
  choice: 本文に「霊」を残し、「弱さの霊に苦しめられている」とした
  alternative: 病気を患っている／病の霊に取りつかれている
  rationale: 原文は πνεῦμα を明記しているため、純粋に医学的な病状へ還元しなかった。一方、「取りつかれている」とすると悪霊憑依を必要以上に特定しかねないため、原因や作用の厳密なあり方は開いたままにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「見よ」のような古風な呼びかけや、「病弱」「不具」のような現在では硬い表現を避けつつ、物語の品位と原文の神学的緊張を保った。
