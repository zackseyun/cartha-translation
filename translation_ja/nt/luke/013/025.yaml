id: LUK.13.25
reference: Luke 13:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: ja
  text: 家の主人が立ち上がって戸を閉めると、あなたがたは外に立ち、戸をたたき始めて、『主よ、開けてください』と言うだろう。すると主人はあなたがたに答える。『わたしはあなたがたを知らない。あなたがたがどこから来たのかも知らない。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: ～すると
  rationale: 不定の時を示す時間節を、後続する出来事への移行が自然に伝わる現代日本語で表した。
- source_word: ἐγερθῇ
  choice: 立ち上がって
  rationale: ここでは復活ではなく、座った姿勢などから立つことを指す。
- source_word: ὁ οἰκοδεσπότης
  choice: 家の主人
  rationale: 家を治め、戸を閉じる権限を持つ者という意味を、簡潔で自然な日本語で表した。
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: 戸を閉めてしまう
  rationale: 単なる動作に加えて、外にいる者を締め出す決定的な結果を「～てしまう」で示した。
- source_word: ἔξω ἑστάναι καὶ κρούειν τὴν θύραν
  choice: 外に立って戸をたたく
  rationale: 外に置かれた状態と、戸を繰り返したたいて訴える行為を自然に表した。
- source_word: Κύριε
  choice: 主よ
  rationale: 呼びかけとしての κύριε を伝統的かつ簡潔に訳し、たとえの中の「ご主人」という含みとルカ文書における神学的響きの双方を残した。
- source_word: ἄνοιξον ἡμῖν
  choice: 開けてください
  rationale: 日本語では対象となる戸が文脈上明白であり、丁寧な懇願として自然に表現した。
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: わたしは、あなたがたがどこの者か知らない
  rationale: ὑμᾶς と πόθεν ἐστέ の双方を、日本語として不自然な重複を避けつつ、身元・所属を認めない拒絶の力を保って訳した。
theological_decisions:
- issue: たとえの呼びかけ κύριε の訳語
  choice: 主よ
  alternative: ご主人さま／だんなさま
  rationale: 日常的な敬称としても理解可能だが、「主よ」とすることで原語の称号性とルカ文書全体での響きを保ち、指示対象を過度に限定しない。
- issue: οὐκ οἶδα ὑμᾶς πόθεν ἐστέ の関係
  choice: あなたがたがどこの者か知らない
  alternative: あなたがたを知らない。どこの者かも知らない
  rationale: 原文には「あなたがた」と「どこからの者か」がともに明示される。本文では両者を一つの自然な日本語文にまとめ、拒絶が単なる地理情報の欠如ではなく、身元や所属を認めない発言である余地を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえにふさわしい簡潔さと厳粛さを保った。「戸」は家屋の出入口として自然であり、「主よ」は格調を保ちつつ一般読者にも理解できる表現とした。
