  source_fidelity: 「彼に尋ねた」は質問内容から推測できるものの、原文の εἶπεν は基本的に「言った」であり、問いかける行為を明示する訳はわずかに具体化しています。また、δέ を「すると」とするのは前後関係・結果をやや強く示します。σῳζόμενοι の現在受動の含みは本文では弱く、脚注には保たれています。
  naturalness: 全体として明瞭ですが、「彼は人々に言われた」は、話者を「彼」とした叙述と敬語「言われた」が混在してやや不自然です。「彼は彼らに言った」とすると、原文の複数代名詞も保ちつつ自然です。
  terminology: 「主よ」は κύριε の敬意ある呼びかけと、より重い含意の両方を保持する適切な訳語です。ただし脚注の「先生に近い」は可能な読みをやや狭く提示するため、「敬意を表す呼びかけ」として幅を持たせます。
  issues:
