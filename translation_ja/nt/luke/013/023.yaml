revisions:
- from: すると、ある人が彼に尋ねた。「主よ[a]、救われる人はわずかなのですか。[b]」彼は人々に言われた。
  to: さて、ある人が彼に言った。「主よ[a]、救われている人は少ないのですか」[b] 彼は彼らに言った。
  rationale: 原文の穏やかな接続、発話動詞、そして聞き手を指す複数代名詞をより直接に反映した。「主よ」は維持し、脚注では「先生」という単一の代替表現に寄せず、κύριε の敬意ある呼びかけとしての意味の幅を保った。「救われている人」は、自然な現代日本語の範囲で現在受動分詞の含みを本文にも示し、より逐語的な進行表現は脚注に残した。
