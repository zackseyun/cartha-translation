base_translation:
  language: en
  yaml_path: translation/nt/luke/013/023.yaml
  text: And someone said to him[a], “Lord, are only a few being saved?” And he said to them[b],
translation:
  language: ja
  text: さて、ある人が彼に言った。「主よ[a]、救われている人は少ないのですか」[b] 彼は彼らに言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主」は、ここでは敬意を表す呼びかけとしても理解できます。ギリシア語は、この称号が持つ意味の重さを一つに限定していません。
    reason: alternative_reading
  - marker: b
    text: より直訳すると、「救われつつある人々は少ないのですか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέ
  choice: すると
  rationale: 物語を先へ進める穏やかな接続。強い対立を示さず、現代日本語で自然な流れを作る。
- source_word: τις
  choice: ある人
  rationale: 人物を特定しない不定代名詞。簡潔で自然な日本語として訳した。
- source_word: αὐτῷ
  choice: 彼に
  rationale: ギリシア語の代名詞を保ち、この節にはない「イエス」という固有名を補わない。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけと、より重いキリスト論的含意の双方に開かれた訳語。呼格は「よ」で示した。
- source_word: εἰ ὀλίγοι οἱ σῳζόμενοι
  choice: 救われる人はわずかなのですか
  rationale: 問いとして自然な日本語にしつつ、人数が少ないことへの焦点と、救いを受ける受動的意味を保った。現在分詞の相は脚注で補う。
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: 彼は人々に言われた
  rationale: 単数の話者と複数の聞き手という原文の移行を明示した。「彼ら」より文脈上自然な「人々」を用いた。
theological_decisions:
- issue: κύριε の呼びかけとしての強さ
  choice: 主よ
  alternative: 先生／あなた
  rationale: 単なる丁寧な呼びかけとも、より深い称号とも理解しうる余地を残し、ルカにおける語の神学的緊張を狭めない。
- issue: σῳζόμενοι の現在受動分詞の相
  choice: 救われる人
  alternative: 救われつつある人々／救われている人々
  rationale: 本文では自然な日本語を優先しながら受動の意味を保った。進行・継続の含みを特定の救済論へ固定しないよう、より逐語的な形を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用い、会話は自然に、語りは簡潔で品位ある調子にした。原文の代名詞を維持し、節内に明記されていない固有名は補わなかった。
