id: LUK.13.32
reference: Luke 13:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: ja
  text: イエスは彼らに言われた。「行って、あの狐にこう言いなさい。『見よ、わたしは今日も明日も悪霊を追い出し、癒やしを行い、三日目に全うされる[a]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「目的に達する」「完全にされる」「歩みを終える」。ギリシア語は、完成へ至らされることを表し、ここではイエスに定められた使命が全うされることを指すと考えられる。
    reason: 語義上の別訳と、受動形が持つ解釈の幅を示すため。
lexical_decisions:
- source_word: ἀλώπεκι ταύτῃ
  choice: あの狐
  rationale: 動物名をそのまま訳し、比喩が含む侮蔑や狡猾さを説明的に限定せず、指示語の力も保った。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 後に続く発言へ注意を促す標識として、簡潔で格調ある日本語を用いた。
- source_word: ἐκβάλλω δαιμόνια
  choice: 悪霊を追い出し
  rationale: 福音書における悪霊追放の標準的な表現であり、ἐκβάλλωの力を自然に伝える。
- source_word: ἰάσεις ἀποτελῶ
  choice: 癒やしを行い
  rationale: 直訳的な「癒やしを成し遂げる」は現代日本語では不自然なため、治癒をもたらす行為を明確かつ自然に表した。ἀποτελῶの遂行・成就の含みは文脈全体に残る。
- source_word: σήμερον καὶ αὔριον
  choice: 今日も明日も
  rationale: 字義どおりの時間表現と、定められた短い期間という含みの双方を保つ自然な日本語。
- source_word: τῇ τρίτῃ
  choice: 三日目に
  rationale: 日を補って明示する、日本語として自然な時間表現。
- source_word: τελειοῦμαι
  choice: 全うされる
  rationale: 受動形を保ちつつ、任務や歩みが完成へ導かれる意味を表す。道徳的に完全になるとの意味へ限定しない。
theological_decisions:
- issue: τελειοῦμαιがイエスの使命の完遂、死、復活のどれを指すか
  choice: 全うされる
  alternative: 目的に達する／完全にされる／歩みを終える
  rationale: ギリシア語の受動態と「完成・完遂」の幅を保ち、死や復活を明示して解釈を一つに限定しないため。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、イエスの宣言には「見よ」「全うされる」を用いて簡潔で dignified な調子を保った。「全うされる」は日常語としてやや高い文体だが、原文の受動態と神学的な開放性を保つために採用した。
