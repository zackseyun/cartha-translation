  to: そして、イエスはこのたとえを話された。「ある人が自分のぶどう園に、植えられたいちじくの木を持っていた。彼はその木に実を探しに来たが、一つも見つけなかった。」
  rationale: 所有（εἶχεν）と、植えられた状態（πεφυτευμένην）を区別して、「植えられたいちじくの木を持っていた」とした。これにより、植樹者を原文以上に特定せず、脚注も不要となる。「一つも見つけなかった」は、求めていた「実」が全くなかったことを明確にする。
