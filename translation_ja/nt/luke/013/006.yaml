id: LUK.13.6
reference: Luke 13:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: ja
  text: そして、イエスはこのたとえを話された。「ある人が自分のぶどう園に、植えられたいちじくの木を持っていた。彼はその木に実を探しに来たが、一つも見つけなかった。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 話された
  rationale: 未完了形は、たとえを語り始める導入的な動作を表す。日本語では進行形を直訳せず、自然な物語表現とした。
- source_word: δὲ
  choice: そして
  rationale: 弱い接続を保ち、直前の文脈からの流れを自然に示す。
- source_word: παραβολήν
  choice: たとえ
  rationale: イエスの比喩的な教えの物語を指す、日本語聖書で定着した明瞭な語。
- source_word: Συκῆν
  choice: 一本のいちじくの木
  rationale: 木そのものを指すことを明確にし、日本語として自然に数詞を補った。
- source_word: εἶχέν τις
  choice: ある人が…植えていた
  rationale: τις の不定性を「ある人」で保った。εἶχεν と完了受動分詞の組み合わせは、所有者が植樹を手配した可能性も含むため、日本語では自然な所有・設置の表現とした。
- source_word: πεφυτευμένην
  choice: 植えていた
  rationale: 完了受動分詞が示す、植えられてその状態にある木を、自然な日本語で表現した。
- source_word: ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: 自分のぶどう園に
  rationale: ἀμπελώνを「ぶどう園」とし、αὐτοῦが主語を指すことを「自分の」で明確にした。
- source_word: ἦλθεν ζητῶν
  choice: 実を探しに来た
  rationale: 来訪と探索の目的・随伴動作を、簡潔で自然な日本語にした。
- source_word: καρπὸν
  choice: 実
  rationale: いちじくの木について自然であり、たとえにおける比喩的含意も保持する。
- source_word: ἐν αὐτῇ
  choice: その木に
  rationale: ギリシア語の前置詞句を、日本語で木に実を探す際の自然な表現にした。
- source_word: οὐχ εὗρεν
  choice: 何も見つからなかった
  rationale: 探していた実が一つもなかったことを自然かつ明瞭に表す。
theological_decisions:
- issue: たとえの人物を表す不定代名詞 τις
  choice: ある人
  alternative: だれか／ある男
  rationale: 性別を不必要に強調せず、原文の不特定の人物という性格と日本語の物語調を保つ。
- issue: πεφυτευμένην の受動性と植樹の主体
  choice: 植えていた
  alternative: 植えられたいちじくの木を持っていた
  rationale: 原文は木が植えられた状態を明示するが、実際に所有者自身が植えたかどうかは特定しない。本文は自然さを優先しつつ、脚注で受動的な字義を示して曖昧さを保つ。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある物語調。「いちじく」「ぶどう」は一般的な仮名表記とし、過度に文語的な「言われた」「実を求めた」は避けた。
