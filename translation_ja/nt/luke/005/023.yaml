id: LUK.5.23
reference: Luke 5:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: ja
  text: 「『あなたの罪は赦されている』[a]と言うのと、『起きて歩け』と言うのとでは、どちらが易しいか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの罪は赦された」。
    reason: ギリシア語の完了・受動形は、完了した行為とその結果としての現在の状態の両面を含み得るため。
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: どちらが易しいか
  rationale: 二つの発言を比較する中性比較級の問いを、自然な現代日本語で表した。
- source_word: εἰπεῖν
  choice: と言う
  rationale: 二つの発言内容を導く不定詞であり、日本語では引用を伴う「と言う」が自然である。
- source_word: Ἀφέωνταί
  choice: 赦されている
  rationale: 罪の赦しを表す完了・受動形である。完了した行為の結果として現在も成り立つ状態を示しつつ、受動の含みを保った。
- source_word: σοι
  choice: あなたの（罪は）
  rationale: 日本語では「あなたに罪が赦されている」よりも「あなたの罪は赦されている」が自然であり、続く所有表現と合わせて個人的な宣告を明確にする。
- source_word: αἱ ἁμαρτίαι σου
  choice: あなたの罪
  rationale: 所有関係を簡潔かつ直接的に表した。「罪」は日本語ではこの文脈で集合的に単数形を用いるのが自然である。
- source_word: ἢ
  choice: のと
  rationale: 「Aと言うのと、Bと言うのとでは」という比較構文により、二つの選択肢の対照を自然に示した。
- source_word: Ἔγειρε
  choice: 起きて
  rationale: 横たわっている人に立ち上がるよう命じる語であり、現代日本語として明瞭である。後続の命令と一続きにするため連用形とした。
- source_word: καὶ περιπάτει
  choice: 歩け
  rationale: ここでは比喩的な生活態度ではなく実際に歩くことを命じている。簡潔な命令形で原文の力を保った。
theological_decisions:
- issue: 完了・受動形による罪の赦しの宣告を、余分な教理的含意を加えずに表すこと
  choice: あなたの罪は赦されている
  alternative: あなたの罪は赦された
  rationale: 主文では、すでに行われた赦しの結果が現在成り立っているという完了形の側面を表した。行為者は補わず、原文の受動表現が残す含みを保持した。別訳は完了した出来事としての面をより前面に出す。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「易しい」は二つの発言の比較を簡潔に示し、「起きて歩け」は直接的な命令の力を保つ。
