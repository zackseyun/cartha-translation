  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: ja
  text: というのも、彼らが得た漁獲に、シモンも、彼と一緒にいた者たちも皆、驚きにとらえられたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: 驚き
  rationale: 突然の圧倒的な驚嘆を表す名詞。現代日本語として明瞭で、奇跡的な漁獲への強い反応を自然に伝える。
- source_word: γὰρ
  choice: というのも…からである
  rationale: 前節のシモンの反応に理由を与える説明的な接続を、日本語で明確かつ自然に示す。
- source_word: περιέσχεν
  choice: 包まれた
  rationale: 字義的な「取り囲む、包囲する」という像を保ちつつ、感情が人を圧倒したことを自然な日本語で表す。
- source_word: αὐτὸν
  choice: シモンも
  rationale: 代名詞の指示対象を直前の文脈に基づいて明示し、日本語での理解を容易にする。助詞「も」により、続く同行者全員との並列を表す。
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: 一緒にいた者たちも皆
  rationale: 同行してその場にいた人々全員という範囲を、自然で明瞭に表す。
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: 捕った魚のおびただしさに
  rationale: ἐπίは反応の原因・根拠を示す。ἄγραは漁獲を指し、直前の網が破れそうな量という文脈を踏まえて、驚きの直接の契機が大量の魚であったことを自然に表す。
- source_word: ὧν συνέλαβον
  choice: 捕った魚
  rationale: 関係節を日本語の連体修飾に組み替え、複数主語による共同の捕獲を文脈上含ませながら簡潔に訳す。
