id: LUK.5.36
reference: Luke 5:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: ja
  text: また、イエスは彼らにたとえを語られた。「新しい服から継ぎ当てを裂き取って、古い服に当てる人はいない。[a] そんなことをすれば、新しい服を裂いてしまううえ、新しい服から取った継ぎ当ては古い服になじまない。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「新しい服から継ぎ当てを裂き取ったうえで、それを古い服に当てる人はいない」。ギリシア語では「裂き取る」がアオリスト分詞で、主動詞「当てる」に先立つ行為として表現されている。
    reason: lexical_alternative
  - marker: b
    text: 「なじまない」は、「合わない」「調和しない」とも訳せる。ギリシア語の動詞は、継ぎ当てと古い服との対応や適合が欠けていることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: また、イエスは……語られた
  rationale: 未完了過去は文脈上の継続的な発話を示し得るが、日本語では自然な物語叙述として「語られた」とした。主語は直前の文脈からイエスであるため明示し、δὲ καὶ は「また」で表した。
- source_word: παραβολὴν
  choice: たとえ
  rationale: ルカにおける標準的な文学用語として、現代日本語で明瞭な「たとえ」を採用した。
- source_word: ἐπίβλημα
  choice: 継ぎ当て
  rationale: 衣服を補修するために当てる布片という具体的な意味を自然に表す。
- source_word: ἀπὸ ἱματίου καινοῦ
  choice: 新しい服から
  rationale: ἱμάτιονを過度に特定せず、一般的で分かりやすい「服」とした。ἀπόは継ぎ当ての出所を示す。
- source_word: σχίσας ἐπιβάλλει
  choice: 裂き取って……当てる
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、その順序を「裂き取って」で自然に保持した。ἐπιβάλλειは縫い付ける方法まで明記せず「当てる」とした。
- source_word: εἰ δὲ μήγε
  choice: そんなことをすれば
  rationale: 直前に否定された行為を実行した場合の帰結を導く表現として、文脈に即した自然な条件表現を用いた。
- source_word: καὶ τὸ καινὸν σχίσει
  choice: 新しい服を裂いてしまううえ
  rationale: 動詞は能動態で、暗黙の行為者が新しい服を損なうことを表す。「しまう」で望ましくない結果を自然に示し、καίを「うえ」で次の帰結につないだ。
- source_word: τῷ παλαιῷ οὐ συμφωνήσει
  choice: 古い服になじまない
  rationale: συμφωνέωがここで示す適合・調和の欠如を、衣服の文脈に自然な「なじまない」で表した。大きさが合わないことだけに意味を限定しない。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。衣服の比喩を日常的に理解できる語彙で表しつつ、「縫い付ける」など原文に明示されない方法は補わなかった。敬体ではなく聖書本文に適した簡潔な常体を基本とし、イエスへの叙述には自然な尊敬表現を用いた。
