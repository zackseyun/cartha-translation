  source_fidelity: 原文の論理と語順上の関係を適切に反映している。σχίσαςを「裂き取って」として主動詞に先行する行為を自然に表し、ἐπιβάλλειを方法を限定しない「当てる」とした点も適切である。後半の能動態 σχίσει は、行為者が新しい服を損なう結果として「新しい服を裂いてしまう」と正しく訳出されている。συμφωνήσειは衣服の文脈に即して「なじまない」とし、適合・対応の欠如を過度に限定していない。
  naturalness: 全体として明瞭で自然な現代標準日本語である。「また、イエスは彼らにたとえを語られた」から引用部への導入も読みやすい。「そんなことをすれば」「～うえ」は、仮定された行為の不適切な二重の結果を滑らかに示している。
  terminology: 「たとえ」「継ぎ当て」「新しい服／古い服」は平明で、原語の意味領域を不必要に狭めない。「継ぎ当て」はἐπίβλημαにふさわしく、縫製方法を本文に持ち込んでいない。イエスへの「語られた」も本文の品位に合う。
