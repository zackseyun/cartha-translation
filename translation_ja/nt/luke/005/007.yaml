source:
  edition: SBLGNT
  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: ja
  text: そこで彼らは、もう一方の舟にいる仕事仲間たちに、来て手を貸してくれるよう合図を送った。[a] 仲間たちも来て、彼らは二そうの舟をどちらもいっぱいにした。そのため、舟は沈み始めた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身ぶりで知らせた」または「手招きした」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「沈みつつあった」とも訳せる。
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: κατένευσαν
  choice: 合図を送った
  rationale: 離れた相手に身ぶりなどで知らせる動作を表す。水上で別の舟に知らせる場面に合い、現代日本語として自然である。
- source_word: μετόχοις
  choice: 仕事仲間たち
  rationale: 単なる同行者ではなく、漁に携わる協力者・共同者を指す文脈なので、「仕事仲間」が実際的な関係を明確に伝える。
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: もう一方の舟にいる
  rationale: 二そうのうち別の舟を指すため、日本語で自然な「もう一方の舟」とした。
- source_word: τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς
  choice: 来て手を貸してくれるよう
  rationale: この構文は合図の目的を表し、συλλαμβάνομαι はここでは一緒に力を出して助けることを意味する。「手を貸す」は網を扱う具体的な場面にもよく合う。
- source_word: ἔπλησαν ἀμφότερα τὰ πλοῖα
  choice: 両方の舟をいっぱいにした
  rationale: 「満たした」という原文の像を保ちつつ、「両方」によって ἀμφότερα の意味を明示した。何で満たしたかは直前の文脈に委ねた。
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: そのため、どちらの舟も沈みかけた
  rationale: ὥστε による結果と、現在不定詞が示す進行中の事態を自然な日本語で表す。完全に沈没したとは限定しない。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語として自然な流れを保った。「仕事仲間」「手を貸す」により漁の共同作業という状況を伝えつつ、原文が明示しない詳細は加えていない。
