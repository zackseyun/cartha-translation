  to: そこで彼らは、もう一方の舟にいる仕事仲間たちに、来て手を貸してくれるよう合図を送った。[a] 仲間たちも来て、彼らは二そうの舟をどちらもいっぱいにした。そのため、舟は沈み始めた。[b]
