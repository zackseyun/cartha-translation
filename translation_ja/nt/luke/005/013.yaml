id: LUK.5.13
reference: Luke 5:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: ja
  text: イエスは手を伸ばして彼に触れ、「わたしはそう望む。清くなりなさい」と言われた。すると、たちまちその皮膚病[a]は彼から去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の「レプラ」は、現代医学でいうハンセン病だけでなく、さまざまな皮膚疾患を指す場合がある。
    reason: 古代の疾病名称を現代の医学用語と安易に同一視しないため。
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: 手を伸ばして
  rationale: 先行する身体動作を表すアオリスト分詞を、自然な日本語の連用表現で訳した。
- source_word: ἥψατο αὐτοῦ
  choice: 彼に触れ
  rationale: 属格を目的語に取るἅπτομαιの通常の意味を、日本語として自然に表した。
- source_word: Θέλω
  choice: そうしよう
  rationale: 直前の願いに対するイエスの意志と積極的な応諾を簡潔に示す。単なる未来表現や感情的な願望にはしなかった。
- source_word: καθαρίσθητι
  choice: きよくなれ
  rationale: 受動命令の意味と、身体的治癒だけでなく祭儀的・社会的な清めも含む語感を保つため、「治れ」ではなく「きよくなれ」とした。
- source_word: εὐθέως
  choice: たちまち
  rationale: 即時性を明確かつ自然で品位ある現代日本語で表した。
- source_word: ἡ λέπρα
  choice: その皮膚病
  rationale: 古代のλέπραが現代医学のハンセン病だけに限定されないことを本文でも過度に狭めずに示し、詳しい範囲は脚注で補った。
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: 彼から消え去った
  rationale: 病がその人を離れたという原文の擬人的な描写と、完全な除去を自然な日本語で保った。
theological_decisions:
- issue: καθαρίσθητιを治癒場面でどう訳すか
  choice: きよくなれ
  alternative: 治れ／清められよ
  rationale: 原文は医療的な治癒に限定せず、汚れからの清めと共同体への回復をも響かせる。「清められよ」は現代語として硬いため、受動的意味を含み得る自然な命令表現「きよくなれ」を採用した。
- issue: Θέλωが示す意志の表現
  choice: そうしよう
  alternative: わたしは望む／よろしい
  rationale: 願いに対する明確な意志と応諾を保ちつつ、「よろしい」のような許可のニュアンスや、「望む」の不自然さを避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの動作と宣言には簡潔で dignified な調子を保った。「きよい」は漢字の「清い」よりも、身体的・祭儀的意味の両方を固定しすぎず伝えるため、ひらがな表記とした。
