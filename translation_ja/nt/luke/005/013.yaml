revisions:
- from: イエスは手を伸ばして彼に触れ、「そうしよう。きよくなれ」と言われた。すると、たちまちその皮膚病[a]は彼から消え去った。
  to: イエスは手を伸ばして彼に触れ、「わたしはそう望む。清くなりなさい」と言われた。すると、たちまちその皮膚病[a]は彼から去った。
  rationale: 原文の意志表明（Θέλω）、清めの命令（καθαρίσθητι）、および病が去る表現（ἀπῆλθεν）を、意味を補強しすぎず明瞭な現代標準日本語で反映しました。脚注はλέπραの歴史的・語義的な幅を示しつつ、原語が示さない重症度は付加しない形に整えました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T04:27:22Z'
review_pass:
  verdict: revise
  source_fidelity: 「そうしよう」はこの文脈で自然ですが、θέλω（意志・願い）の明示が弱まり、将来の行為を約束するようにも読めます。「わたしはそう望む」に改めて、話者の意志を明確にします。「清くなりなさい」は受動命令の結果（清い状態となること）を自然な現代日本語で表せます。「消え去った」はἀπῆλθεν（去った）をやや強めるため、「去った」とします。
  naturalness: 全体は明瞭で自然です。ただし、「きよくなれ」は格調はあるものの、明瞭な現代標準日本語としては「清くなりなさい」のほうが読みやすいです。「清い」はこの箇所の清め・儀礼的清浄の含意を保つため漢字表記が適切です。
  terminology: λέπραを本文で「皮膚病」とするのは、現代のハンセン病に限定しないために妥当です。脚注の「重い」はギリシア語そのものが重症度を指定するわけではないため削除し、古代の用法が複数の皮膚疾患を含みうることを簡潔に記します。
  issues:
  - severity: medium
    issue: 「そうしよう」はθέλωの意志表明を十分に明示しない。
    rationale: 原語は「私は望む／そのつもりである」という現在形の意志表明であり、単なる将来の決定・約束に読める訳は避けるのが安全です。
  - severity: low
    issue: 「消え去った」はἀπῆλθενをやや強めている。
    rationale: 病が本人から「去った」という原文の表現を、そのまま自然に訳せます。
  - severity: low
    issue: 脚注の「重い皮膚疾患」は原語の語義として必要以上に限定的である。
    rationale: λέπραは古代の広い皮膚疾患分類に関わる語であり、重症度を本文注で断定しないほうが正確です。
  revised_text: イエスは手を伸ばして彼に触れ、「わたしはそう望む。清くなりなさい」と言われた。すると、たちまちその皮膚病[a]は彼から去った。
