id: LUK.5.17
reference: Luke 5:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: ja
  text: さて、ある日のこと、イエスが教えておられると、ファリサイ人と律法の教師たちが座っていた。彼らはガリラヤとユダヤのあらゆる村、およびエルサレムから来ていた。そして、主の力は、イエスが癒やすためにそこにあった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本には、「イエスが癒やすために」の代わりに「彼らを癒やすために」と読むものがある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: さて、ある日のこと
  rationale: ルカに特徴的な場面導入の定型句を、古風にならない自然な現代日本語で表した。
- source_word: αὐτὸς ἦν διδάσκων
  choice: イエスが教えておられると
  rationale: 継続中の動作を表す迂言的未完了形を反映した。主語は文脈上イエスであり、日本語では固有名を補う方が明瞭である。敬語は聖書本文として自然な敬意を示す。
- source_word: Φαρισαῖοι καὶ νομοδιδάσκαλοι
  choice: ファリサイ派の人々と律法の教師たち
  rationale: 前者は現代日本語で集団名だと分かる形にし、後者はモーセの律法を教える者という語の構成を直接表した。
- source_word: ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: ガリラヤとユダヤのあらゆる村、またエルサレムから
  rationale: κώμηを「村」、πάσηςの配分的な意味を「あらゆる」で表し、地域と都市が並ぶ地理的構造を自然な日本語にした。
- source_word: δύναμις κυρίου
  choice: 主の力
  rationale: 属格構文と神的な力という神学的重みを保ち、κύριοςは文脈を狭めすぎず「主」とした。
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: イエスが癒やしを行うために働いていた
  rationale: 採用本文のαὐτόνを、癒やす行為の主体であるイエスを指すものとして表し、目的を示すεἰς τὸ＋不定詞を「ために」で訳した。「働いていた」は力が現に作用していたことを日本語として明確にする。
theological_decisions:
- issue: δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν の指示対象と意味
  choice: 主の力が、イエスが癒やしを行うために働いていた
  alternative: 主の力が彼らを癒やすためにそこにあった／主の力が癒やしのためにイエスと共にあった
  rationale: 提示されたSBLGNT本文は単数対格αὐτόνを読むため、複数の「彼らを」を本文に補わない。αὐτόνを癒やす主体の明示と理解しつつ、異読は脚注で示して本文証拠の緊張を保持した。
- issue: κυρίου の指示対象
  choice: 主
  alternative: 神／主人
  rationale: ここでは神を指す可能性が高いが、原文のκύριοςが持つ表現を保ち、訳文で指示対象を必要以上に限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。長いギリシア語文は読みやすさのため三文に分けた。「癒やす」は医療一般よりも物語中の治癒行為を示す聖書的な語感を保つ。脚注記号[a]は異読が関係する末尾の節に付した。
