revisions:
- from: そこで彼らはイエスに言った。「ヨハネの弟子たちはたびたび断食し、祈りをささげています。ファリサイ派の弟子たちも同じです。それなのに、あなたの弟子たちは食べたり飲んだりしています。」
  to: そこで彼らはイエスに言った。「ヨハネの弟子たちはたびたび断食をし、祈りをささげています。ファリサイ人の弟子たちも同じです。しかし、あなたの弟子たちは食べ、飲んでいます。」
  rationale: 省略された「弟子たち」は、日本語では両箇所で補って明瞭にした。その一方、軽い接続詞δέを過度に強い「それなのに」とせず「しかし」とした。「ファリサイ人の弟子たち」により原文の関係を自然に表し、動詞句を習慣的行為として滑らかに整えた。
