    issue: δέを「それなのに」と訳している
    rationale: δέはここで穏やかな接続・対照を示す。「それなのに」は期待違反や非難の含みを付加しうるため、「しかし」が原文の強さにより近い。
  - severity: low
    issue: 「ファリサイ派の弟子たち」という表現
    rationale: οἱ τῶν Φαρισαίωνは、前出の「弟子たち」を補って「ファリサイ人の弟子たち」とするのが、原文の人々との関係を最も自然に示す。
  - severity: low
    issue: 習慣を表す動詞句の日本語表現
    rationale: 「断食をし、祈りをささげています」「食べ、飲んでいます」とすると、原文の反復的・習慣的な並列を保ちながら文体が整う。
  revised_text: そこで彼らはイエスに言った。「ヨハネの弟子たちはたびたび断食をし、祈りをささげています。ファリサイ人の弟子たちも同じです。しかし、あなたの弟子たちは食べ、飲んでいます。」
