  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: ja
  text: そこで彼らはイエスに言った。「ヨハネの弟子たちはたびたび断食をし、祈りをささげています。ファリサイ人の弟子たちも同じです。しかし、あなたの弟子たちは食べ、飲んでいます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: そこで彼らはイエスに言った
  rationale: δέは軽い接続を示すため「そこで」とし、日本語で自然な物語の流れを保った。αὐτόνの指示対象は文脈上イエスなので、明瞭さのため固有名を補った。
- source_word: μαθηταὶ Ἰωάννου
  choice: ヨハネの弟子たち
  rationale: 属格による所属・関係を、自然で明瞭な日本語にした。
- source_word: νηστεύουσιν πυκνά
  choice: たびたび断食し
  rationale: 副詞的なπυκνάが表す反復・頻度を、現代日本語の「たびたび」で表した。
- source_word: δεήσεις ποιοῦνται
  choice: 祈りをささげています
  rationale: δεήσειςの名詞性と、信仰行為として祈りを行うという句の意味を保ちつつ、自然で品位ある日本語とした。
- source_word: ὁμοίως καὶ οἱ τῶν Φαρισαίων
  choice: ファリサイ派の弟子たちも同じです
  rationale: 「弟子たち」は直前のμαθηταίから補われる省略語である。日本語で「ファリサイ派の者たち」とすると指示範囲が曖昧になるため、文脈上の語を明示した。
- source_word: οἱ δὲ σοὶ
  choice: それなのに、あなたの弟子たちは
  rationale: σοίは「あなたの者たち」、文脈上は弟子たちを指す。対照を自然に表すため「それなのに」を用い、省略された名詞を明示した。
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: 食べたり飲んだりしています
  rationale: 継続的・特徴的な振る舞いを述べる現在形を自然に表し、断食との対照を明確にした。
theological_decisions:
- issue: 後半二箇所で「弟子たち」を補うか
  choice: 両方で「弟子たち」を明示する
  alternative: 「ファリサイ派の者たち」「あなたの者たち」としてギリシア語の省略を形式的に残す
  rationale: 原文では直前のμαθηταίから名詞が容易に補われる。日本語で同じ省略をすると不自然または曖昧になるため、意味を限定せず文脈上明白な語を補った。
translation_notes:
  register: 明瞭な現代標準日本語。対話として自然でありながら、聖書本文にふさわしい落ち着いた品位を保った。
