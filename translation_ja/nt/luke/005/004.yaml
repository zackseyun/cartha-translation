  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: ja
  text: 話し終えると、イエスはシモンに言った。「深い所へ舟を出し、魚を捕るために網を下ろしなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: 話し終えると
  rationale: ὡς δέによる穏やかな場面進行と、παύομαι＋分詞が表す継続中の発話の終了を、自然な日本語の時間表現で示す。
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: イエスはシモンに言った
  rationale: 主語は直前の文脈でイエスであり、日本語では明示した方が分かりやすい。「言った」はλέγωの基本的な意味を保つ。
- source_word: Ἐπανάγαγε εἰς τὸ βάθος
  choice: 深い所へ漕ぎ出し
  rationale: 漁船を岸から深い水域へ進めるという文脈上の意味を自然に表す。単数命令形なので、まずシモン一人に向けた命令であることも保つ。
- source_word: χαλάσατε τὰ δίκτυα ὑμῶν
  choice: 網を下ろして
  rationale: χαλάσατεは複数命令形で、シモンと仲間たちに向けられている。「網」は日本語では文脈上、複数でも通常この形が自然であり、「下ろす」は船から網を水中へ降ろす動作を明確にする。
- source_word: εἰς ἄγραν
  choice: 魚を捕りなさい
  rationale: ἄγραはここでは漁による獲物・漁獲を指す。目的を自然な命令文に組み込み、漁の文脈を明確にした。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準日本語を用い、物語文としての簡潔さとイエスの命令の重みを保った。ギリシア語における単数命令形から複数命令形への移行は、日本語では形態的に表示できないが、内容を過度に補足せず本文の自然さを優先した。英語資料の脚注は本文中の位置と内容が一致していないため採用せず、原文のεἰς τὸ βάθοςは「深い所へ」と訳して意味を明示した。
