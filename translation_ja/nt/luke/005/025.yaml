  text: καὶ παραχρῆμα ἀναστὰς ἐνώπιον αὐτῶν, ἄρας ἐφ’ ὃ κατέκειτο, ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ δοξάζων τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/025.yaml
  text: And immediately he stood up before them[a], picked up what he had been lying on, and went away to his house, glorifying God.
translation:
  language: ja
  text: すると、その人はすぐに皆の前で立ち上がり、自分が横たわっていた物[a]を持ち上げ、自分の家へ帰り、神をあがめながら行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分が寝ていた敷物を」とも訳せる。直訳は「彼がその上に横たわっていたものを」。
    reason: lexical_alternative
lexical_decisions:
- source_word: παραχρῆμα
  choice: すぐに
  rationale: 時間を置かずに起きたことを示す副詞。癒やしが即座に現れたというルカの強調を、自然な現代日本語で表す。
- source_word: ἀναστὰς
  choice: 立ち上がり
  rationale: アオリスト分詞を日本語の連用形で表し、その後の動作へ続く出来事の順序を自然に保つ。
- source_word: ἐνώπιον αὐτῶν
  choice: 皆の前で
  rationale: その場にいた人々の面前で、公然と起きたことを簡潔に表す。αὐτῶνは文脈上複数の人々を指すため、「皆」とした。
- source_word: ἄρας
  choice: 持ち上げて
  rationale: αἴρωの具体的な動作を示し、横たわっていた物を上げて運んだことを自然に表す。
- source_word: ἐφ’ ὃ κατέκειτο
  choice: 寝ていた物
  rationale: 原文は寝床や敷物を表す名詞を明記せず、「その上に横たわっていたもの」と関係表現を用いるため、物の種類を本文で限定しない。
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: 自分の家へ帰って行き
  rationale: ἀπέρχομαιの去って行く方向性と、οἶκοςがここで本人の帰る家を指す文脈を、自然な日本語で合わせて表す。
- source_word: δοξάζων τὸν θεόν
  choice: 神をあがめた
  rationale: δοξάζωが示す、神に栄光と誉れを帰す行為を、現代日本語の聖書文体として自然かつ尊厳ある表現で示す。
theological_decisions:
- issue: 運んだ物を本文で「床」または「敷物」と特定するか
  choice: 本文では「寝ていた物」とし、原文の非特定性を保つ。
  alternative: 「寝ていた敷物」または「寝床」
  rationale: この節のギリシア語は具体的な名詞を用いず、関係代名詞によって「その上に横たわっていたもの」と表す。本文で種類を断定せず、文脈上の具体的な可能性は脚注に示す。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語の即時性と一連の動作を保った。「あがめた」は神に栄光を帰す意味を簡潔に伝える。脚注記号は該当する表現の直後では文の流れを妨げるため文末に置いた。
