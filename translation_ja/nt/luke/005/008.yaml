id: LUK.5.8
reference: Luke 5:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: ja
  text: しかし、シモン・ペトロはこれを見ると、イエスの膝もとにひれ伏して言った。「主よ、私から離れてください。[a] 私は罪深い男なのです。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私から出て行ってください」。
    reason: lexical_alternative
  - marker: b
    text: 原文では、ペトロ自身を指して、男性を表す語で「罪深い男」と言っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: これを見ると
  rationale: アオリスト分詞を時間的に訳した。目的語は原文では明示されていないが、文脈上は大漁の出来事を指すため、日本語として自然な「これ」を補った。
- source_word: δὲ
  choice: しかし
  rationale: 物語を進めつつ、奇跡的な大漁からペトロの畏れに満ちた反応への転換を示す。
- source_word: Σίμων Πέτρος
  choice: シモン・ペトロ
  rationale: 原文にある二つの名をともに保持した。
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: イエスの膝もとにひれ伏して
  rationale: イエスの膝のところへ倒れ伏す姿勢を、明瞭で自然な日本語で表した。
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: 私から離れてください
  rationale: 直訳的には「私から出て行ってください」だが、ここで求められている隔たりを現代日本語で自然に表した。命令形の切迫感は保ちつつ、対面の発話として「ください」を用いた。
- source_word: ἀνὴρ ἁμαρτωλός
  choice: 罪深い男
  rationale: ἀνήρが成人男性を指し、ペトロ自身について述べていることを保持した。「罪人」への言い換えを避け、形容詞ἁμαρτωλόςの構造も反映した。
- source_word: κύριε
  choice: 主よ
  rationale: 敬意とイエスの権威への認識の双方を含み得る呼びかけとして訳し、単なる「先生」や「だんな様」には狭めなかった。
theological_decisions:
- issue: シモン・ペトロがイエスをκύριεと呼ぶ意味
  choice: 主よ
  alternative: 先生／だんな様
  rationale: 奇跡を目の当たりにした畏れと罪の告白という文脈における深い敬意を保つ。一方、この一語だけでペトロのキリスト理解が完全に発展していたと断定するものではない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ペトロの畏れと謙卑が伝わる品位ある語調にした。「膝もとにひれ伏して」で身体的な姿勢を具体的に示し、発話では「主よ」を前置して日本語として自然な呼びかけにした。
