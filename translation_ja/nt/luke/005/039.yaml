source:
  edition: SBLGNT
  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: ja
  text: また、古いぶどう酒を飲んだ人はだれも、新しいぶどう酒を欲しない。『古いものがよい』と言うからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「古いもののほうがよい」とある。
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: だれも～ない
  rationale: 人を一般的かつ例外なく指す否定表現。現代日本語として自然で、原文の普遍的な言い方を保つ。
- source_word: πιὼν
  choice: 飲んだ
  rationale: 主動詞に先立つ行為を表すアオリスト分詞。日本語では連体修飾にして「古いぶどう酒を飲んだ人」と表すのが自然である。
- source_word: παλαιὸν
  choice: 古いぶどう酒
  rationale: ギリシア語では名詞が省略されているが、直前の文脈から「ぶどう酒」を補い、日本語で対象を明確にした。
- source_word: θέλει
  choice: 欲しがらない
  rationale: ここでは意志よりも好みや欲求を表す。主語が一般化された第三者なので、「欲しくない」より「欲しがらない」が文脈に合う。
- source_word: νέον
  choice: 新しいもの
  rationale: 原文と同じく「ぶどう酒」を明示せず、文脈から補える形にした。「もの」を添えて、日本語として不自然な省略を避けた。
- source_word: λέγει γάρ
  choice: その人は～と言うからである
  rationale: γάρの理由説明を「からである」で明示し、λέγειの一般的な主語を「その人」として自然に受けた。
- source_word: Ὁ παλαιὸς
  choice: 古いもの
  rationale: 原文の名詞省略を保ちつつ、日本語として成立させるため「もの」を補った。指すものは文脈上、古いぶどう酒である。
- source_word: χρηστός
  choice: よい
  rationale: この語の基本的な肯定評価を、比較級にせず簡潔に表した。「おいしい」「口当たりがよい」などに意味を限定しない。
theological_decisions:
- issue: 古いぶどう酒への評価を表す χρηστός の訳
  choice: よい
  alternative: よりよい
  rationale: 底本の χρηστός は比較級ではなく「よい」「好ましい」の意であるため、本文では比較を加えない。異読・伝統的訳として知られる比較表現は脚注に示し、古いものと新しいものの神学的関係を訳文で断定しない。
translation_notes:
  register: 明瞭で現代的だが、聖書本文にふさわしい落ち着いた文体。「ぶどう酒」を最初だけ明示し、その後は原文の省略を反映して「もの」とした。脚注記号は節末に置き、本文全体に関わる異読であることを示した。
