id: LUK.5.5
reference: Luke 5:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: ja
  text: シモンは答えた。「先生、私たちは夜通し骨を折りましたが、何も捕れませんでした。ですが、お言葉ですから[a]、網を下ろします。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたのお言葉に基づいて」。また「あなたのお言葉のゆえに」とも訳せる。
    reason: ἐπὶ τῷ ῥήματί σου が、行動の根拠または理由を表すため。
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: 答えた
  rationale: ギリシア語で発言を導く定型的な表現。日本語では「答えて言った」と重ねず、自然に「答えた」とした。
- source_word: Ἐπιστάτα
  choice: 先生
  rationale: ルカがイエスへの呼びかけに用いる語で、権威ある指導者への敬意を表す。κύριοςの「主」と区別しつつ、現代日本語で自然な「先生」とした。
- source_word: δι’ ὅλης νυκτὸς
  choice: 夜通し
  rationale: 一晩の全期間にわたることを、簡潔で自然な日本語で表した。
- source_word: κοπιάσαντες
  choice: 骨を折りました
  rationale: 単に働いたことだけでなく、力を尽くして苦労したという語の含意を表した。
- source_word: οὐδὲν ἐλάβομεν
  choice: 何も捕れませんでした
  rationale: 漁の文脈に即して、λαμβάνωの意味を自然な「捕れる」で表した。
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: ですが、お言葉ですから
  rationale: 不首尾に終わった漁との対照を示しつつ、イエスの言葉を根拠として行動する意味を自然に表した。構文が「言葉に基づいて」「言葉のゆえに」とも表せるため注を付した。
- source_word: χαλάσω
  choice: 下ろします
  rationale: 網を水中へ低くする動作と、一人称単数未来の意志を自然に表した。
- source_word: τὰ δίκτυα
  choice: 網
  rationale: 日本語の「網」はこの文脈で複数の漁網も自然に指せるため、不自然な「複数の網」を避けた。
theological_decisions:
- issue: イエスへの呼称 Ἐπιστάτα
  choice: 先生
  alternative: 主よ
  rationale: 原文はκύριοςではなくἐπιστάτηςを用いるため、後者にない完全なキリスト論的含意を持ち込みすぎず、同時にイエスの権威への敬意を保った。
- issue: シモンが網を下ろす根拠
  choice: お言葉ですから
  alternative: お言葉に従って
  rationale: 従順という解釈を過度に明示せず、ἐπί＋与格が示す言葉を根拠・理由とする関係を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら品位を保った。「骨を折る」で徒労に終わった激しい労苦を示し、「先生」は日常的すぎない敬意ある呼びかけとして用いた。
