id: LUK.5.12
reference: Luke 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: ja
  text: さて、イエスがある町におられたときのことである。すると、そこに全身が重い皮膚病に冒された男がいた[a]。男はイエスを見ると、顔を地に伏せて懇願した。「主よ、お望みになれば、私を清めることがおできになります[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「レプラに満ちた」。古代の「レプラ」はさまざまな重い皮膚疾患を指し得る語で、現代のハンセン病だけを意味するとは限らない。「満ちた」は症状の深刻さを強調している。
    reason: lexical_alternative
  - marker: b
    text: 「清める」は、病気を治すことに加え、祭儀上また社会生活上の清さを回復する意味も含み得る。別訳「きれいにする」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ εἶναι αὐτὸν
  choice: イエスが……おられたときのことである
  rationale: ルカの場面導入の定型表現を、現代日本語の自然な時間節と叙述で表した。
- source_word: ἐν μιᾷ τῶν πόλεων
  choice: ある町に
  rationale: 直訳は「町々の一つに」だが、場所を特定しない自然な日本語として「ある町に」とした。πόλιςを必ずしも大都市と限定しない。
- source_word: ἰδοὺ
  choice: すると、そこに
  rationale: 場面に突然人物が現れるという談話上の鮮明さを保ちつつ、現代日本語で不自然になりやすい「見よ」を避けた。
- source_word: πλήρης λέπρας
  choice: 全身が重い皮膚病に冒された
  rationale: 「レプラに満ちた」という強意を「全身が……冒された」で伝え、古代のλέπραを現代のハンセン病だけに限定しない表現を選んだ。
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: 顔を地に伏せて
  rationale: 単なる礼ではなく、顔を下にした切迫した謙遜の姿勢を明示した。
- source_word: ἐδεήθη αὐτοῦ
  choice: 懇願した
  rationale: 通常の依頼よりも切実で強い願いを、簡潔で品位ある現代日本語で表した。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけと、文脈に含まれ得るキリスト論的な響きの双方を保ち、どちらか一方に限定しない。
- source_word: ἐὰν θέλῃς
  choice: お望みになれば
  rationale: 相手の能力ではなく意志を条件としていることを明確にし、敬意を含む自然な日本語とした。
- source_word: δύνασαί με καθαρίσαι
  choice: 私を清めることがおできになります
  rationale: 能力を率直に表すとともに、καθαρίζωの身体的治癒だけでなく祭儀的・社会的な清めの含意も保持した。
theological_decisions:
- issue: λέπραとκαθαρίζωを治癒の場面でどう訳すか
  choice: 「重い皮膚病」と「清める」
  alternative: 「らい病」と「治す」、または「ハンセン病」と「治す」
  rationale: 古代のλέπραは現代医学上のハンセン病より広い皮膚疾患を指し得るため病名を限定せず、καθαρίζωについては身体的回復に加えて祭儀的・社会的回復を示す「清める」を用いた。
- issue: イエスへの呼びかけκύριος
  choice: 主
  alternative: 先生、だんな様
  rationale: 敬称としての機能を保ちながら、語が持ち得るキリスト論的な響きを消さず、同時にこの一語だけで最大限の神学的告白と断定しない訳とした。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書本文としての落ち着きと品位を保った。「すると、そこに」でἰδούの鮮明さを自然に表し、「顔を地に伏せて」「懇願した」により男の切迫感を伝えた。病名は現代医学上の特定疾患と同一視せず、脚注で原語の範囲と強意を説明した。
