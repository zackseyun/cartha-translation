reference: Luke 5:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: ja
  text: しかし、イエスは彼らの考えを知り[a]、彼らに答えて言われた。「なぜ心の中で思い巡らしているのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの考えを見抜き」。
    reason: ἐπιγνοὺς は「知る」のほか、「認識する」「気づく」「見抜く」とも訳し得るため。
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: 見抜き
  rationale: イエスが彼らの内面の思考をはっきり認識したことを自然な日本語で表す。どのように知ったかは明示せず、原文の含みを保った。
- source_word: δὲ
  choice: しかし
  rationale: 直前の内心の反発に対してイエスが応答する場面の、穏やかな対照と展開を示す。
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: 彼らの考え
  rationale: 文脈上、彼らの内面的な思案や異議を指す。「考え」は現代日本語として明瞭で、意味を狭く限定しすぎない。
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: 彼らに答えて言われた
  rationale: 原文の「答えて、言った」という二つの動詞を保ちつつ、敬意を込めた自然な聖書叙述とした。
- source_word: Τί
  choice: なぜ
  rationale: διαλογίζεσθε とともに用いられ、彼らがそう考える理由を問う語法なので、日本語では「なぜ」が自然である。
- source_word: διαλογίζεσθε
  choice: そのように考えている
  rationale: 現在形が表す継続中の内面的な思考を示す。「そのように」は直前の文脈にある彼らの異議を受ける。
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: あなたがたは心の中で
  rationale: καρδία が思考や意志を含む内なる人を表す聖書的表現を、「心の中」という明瞭で定着した日本語で保持する。
theological_decisions:
- issue: イエスが他者の内面を知った性質と方法
  choice: イエスが彼らの考えを見抜いたという事実だけを述べる。
  alternative: 超自然的に知ったと明示する、または単に推測したとする。
  rationale: 原文はイエスが彼らの内面的な思考を認識したことを示すが、その認識の方法は説明していない。超自然性を付加することも、推測に弱めることも避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「心の中」「答えて言われた」という聖書的で格調ある表現を保持した。
