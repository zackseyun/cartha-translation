id: LUK.5.34
reference: Luke 5:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: ja
  text: イエスは彼らに言われた。「花婿が婚礼の客たち[a]と一緒にいる間に、あなたがたは彼らを断食させることができるでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「婚礼の部屋の子ら」。花婿の仲間や婚礼の客を指す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: できるでしょうか
  rationale: μήを伴う直説法の疑問は否定の答えを予期する。日本語では文脈上、「できるでしょうか」という反語的な問いで、その期待を自然に表せる。
- source_word: τοὺς υἱοὺς τοῦ νυμφῶνος
  choice: 婚礼の客たち
  rationale: 字義的には「婚礼の部屋の子ら」だが、花婿の仲間を中心とする婚礼参加者を指す慣用句である。現代日本語で意味が明瞭な表現を採った。
- source_word: ὁ νυμφίος
  choice: 花婿
  rationale: 婚礼の比喩を保つ、明瞭で標準的な訳語である。
- source_word: μετ’ αὐτῶν ἐστιν
  choice: 一緒にいる
  rationale: 婚礼の客たちと花婿が共にいることを、自然かつ直接的に表す。
- source_word: ποιῆσαι νηστεῦσαι
  choice: 断食させる
  rationale: ποιέω＋不定詞の使役の意味を保持する。「断食できる」ではなく、彼らに断食を行わせることができるかという問いである。
- source_word: νηστεῦσαι
  choice: 断食する
  rationale: 宗教的実践として食を断つことを示す標準的な訳語である。
theological_decisions:
- issue: イエスと花婿の比喩的関係
  choice: 本文では「花婿」という比喩をそのまま保ち、神学的意味を明示的に説明しない。
  alternative: イエスが自らを花婿になぞらえていることを訳文中で明示する。
  rationale: 原文は花婿の比喩によってイエスの特別な役割を暗示するが、その意義を説明的に補うと原文以上の解釈を加えることになるため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「婚礼」は比喩の荘重さを保ちつつ一般読者にも理解できる語。「できるでしょうか」は、否定の答えを予期する修辞疑問として読める。
