  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: ja
  text: わたしが来たのは、正しい人たちを招くためではなく、罪人たちを悔い改めへと招くためである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悔い改めのために」。ギリシア語の「εἰς μετάνοιαν」は、目的または到達点を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: わたしが来たのは
  rationale: 完了形が示す、来た結果として今ここにいることと使命の表明を、日本語で自然な「来たのは」という構文で表した。
- source_word: καλέσαι
  choice: 招くため
  rationale: 目的を表す不定詞。文脈上、単なる呼称ではなく人を応答へと招く意味であり、「招く」は招待と召しの含みを保つ。
- source_word: δικαίους
  choice: 正しい人たち
  rationale: 形容詞の名詞的用法を明瞭な現代日本語で表した。真に正しい人か、自認・社会的評価によるものかは限定しない。
- source_word: ἁμαρτωλούς
  choice: 罪人たち
  rationale: 道徳的・宗教的カテゴリーを表す標準的な訳語で、福音書における社会的な響きも保持する。
- source_word: εἰς μετάνοιαν
  choice: 悔い改めへと
  rationale: εἰς が示す目的・到達点を「へと」で保持した。μετάνοια は単なる知的な考え直しより広い方向転換を含むため、定着した自然な訳語「悔い改め」を採用した。
theological_decisions:
- issue: 「正しい人たち」が真に正しい者か、自分を正しいと考える者か
  choice: 無限定に「正しい人たち」とする
  alternative: 「自分を正しいと思っている人たち」「正しいと見なされている人たち」
  rationale: 本文自体には明示的な限定や皮肉の標識がないため、対照が持つ神学的緊張を解釈で解消しない。
- issue: μετάνοια の意味範囲
  choice: 「悔い改め」
  alternative: 「考えを変えること」「回心」
  rationale: 語源的な「心・考えの変化」に狭めず、ルカ文書での神に向かう転換を含み得る語義を、特定教派に限定されない一般的な聖書語で表す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」を用い、対句構造を維持した。脚注標識は節末に置き、目的・到達点という前置詞句の幅を示した。
