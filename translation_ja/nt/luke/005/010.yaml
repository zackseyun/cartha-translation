revisions:
- from: ゼベダイの息子ヤコブとヨハネも同様だった。二人はシモンの仕事仲間であった。イエスはシモンに言った。「恐れることはない。今からあなたは、人々を生け捕るようになる。」[a][b]
  to: 同じように、ゼベダイの子であるヤコブとヨハネもそうだった。二人はシモンと仕事を共にしていた。イエスはシモンに言った。「恐れることはない。これからは、人々を生きたまま捕らえる者になる。」[a][b]
  rationale: 原文の比較・付加（ὁμοίως δὲ καὶ）、ゼベダイとの親子関係、シモンとのκοινωνοίとしての関係を、明瞭な現代日本語で保った。ζωγρέωは「捕らえる」だけでなく「生きたまま」の意味を含むため本文に明示した一方、救命的・捕獲的な比喩の評価を本文や注で一方的に解釈していない。脚注a・bはいずれもζωγρέωを含む発話全体に適切にアンカーされる。
