source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ἰάκωβον καὶ Ἰωάννην υἱοὺς Ζεβεδαίου, οἳ ἦσαν κοινωνοὶ τῷ Σίμωνι. καὶ εἶπεν πρὸς τὸν Σίμωνα ⸀ὁ Ἰησοῦς· Μὴ φοβοῦ· ἀπὸ τοῦ νῦν ἀνθρώπους ἔσῃ ζωγρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/010.yaml
  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: ja
  text: 同じように、ゼベダイの子であるヤコブとヨハネもそうだった。二人はシモンと仕事を共にしていた。イエスはシモンに言った。「恐れることはない。これからは、人々を生きたまま捕らえる者になる。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生きたまま捕らえる」は、原文で「生け捕りにする」「生かして捕らえる」を意味する動詞を訳したもの。単に魚を捕ることを表す語とは異なる。
    reason: lexical_alternative
  - marker: b
    text: マタイ4章19節、マルコ1章17節参照。そこでは「人間をとる漁師」と表現されているが、ルカはここで別の動詞を用いている。
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: も同様だった
  rationale: 直前に述べられた驚きがヤコブとヨハネにも及んだことを、文脈に即して自然な日本語で示す。
- source_word: υἱοὺς Ζεβεδαίου
  choice: ゼベダイの息子
  rationale: 家族関係を明確かつ自然に表す。二人にかかるため、日本語では単数形の「息子」でも集合的に理解できる。
- source_word: κοινωνοὶ
  choice: 仕事仲間
  rationale: この漁業の文脈では、単なる友人ではなく仕事上の協力関係を指す。「共同経営者」と断定するより広い原語の含みを保つ。
- source_word: Μὴ φοβοῦ
  choice: 恐れることはない
  rationale: 命令形の慰めと安心させる響きを、現代の自然で品位ある日本語にする。
- source_word: ἀπὸ τοῦ νῦν
  choice: 今から
  rationale: シモンの召命における決定的な転換点を簡潔に示す。
- source_word: ἀνθρώπους
  choice: 人々
  rationale: 男性だけでなく人間一般を指すため、包括的で自然な「人々」とする。
- source_word: ζωγρῶν
  choice: 生け捕るようになる
  rationale: 「生きたまま捕らえる」という ζωγρέω の固有の意味を保ち、ルカの漁の比喩も残す。やや意外な表現だが、原文の緊張を平板化しない。
theological_decisions:
- issue: ζωγρέω による召命の比喩
  choice: 人々を生け捕るようになる
  alternative: 人々を捕るようになる／人間をとる漁師になる
  rationale: マタイ4:19、マルコ1:17の「人間をとる漁師」と調和させず、ルカ独自の「生きたまま捕らえる」という動詞を反映する。比喩が救命的か捕獲的かという含みを説明で一方に限定しない。
- issue: ἀνθρώπους の性別表現
  choice: 人々
  alternative: 男たち／人間
  rationale: 文法上の性ではなく実際の指示対象に従い、人間一般を表す。
translation_notes:
  register: 明瞭な現代標準語を用い、会話には簡潔で品位ある調子を保った。「生け捕る」は日常的には強い語だが、原語 ζωγρέω の際立った意味とルカ独自の表現を保存するため採用した。脚注記号は該当文末に配置した。
