id: LUK.5.24
reference: Luke 5:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ⸂ὁ υἱὸς τοῦ ἀνθρώπου ἐξουσίαν ἔχει⸃ ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας— εἶπεν τῷ παραλελυμένῳ· Σοὶ λέγω, ⸀ἔγειρε καὶ ἄρας τὸ κλινίδιόν σου πορεύου εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: ja
  text: しかし、人の子が地上で罪を赦す権威を持っていることを、あなたがたが知るために――イエスは麻痺していた人に言われた。「あなたに言う。起き上がり、自分の床を担いで、家に帰りなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: しかし、…ことを、あなたがたが知るために
  rationale: δέの穏やかな対比と、ἵναが示す目的を自然な現代日本語で保った。文が後続の発言へ中断される構造も維持した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した訳語であり、ダニエル書7章を含む聖書的響きと称号の含意を保持する。
- source_word: ἐξουσίαν ἔχει
  choice: 権威を持っている
  rationale: 単なる能力や力ではなく、罪を赦す正当な権限を表すἐξουσίαの意味を明確にする。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: 場所を表す句を簡潔に訳し、天上との対照などを本文以上に説明しない。
- source_word: ἀφιέναι ἁμαρτίας
  choice: 罪を赦す
  rationale: この文脈でのἀφίημιは罪の免除・赦しを意味するため、日本語聖書で自然かつ明瞭な表現を用いた。
- source_word: τῷ παραλελυμένῳ
  choice: 体の麻痺した人
  rationale: 実体詞的な完了分詞を、病状を示しつつ人を中心に置く自然な現代日本語にした。
- source_word: Σοὶ λέγω
  choice: あなたに言う
  rationale: 前置されたΣοίの強調と、直接的で厳かな言い方を保つ。
- source_word: ἔγειρε
  choice: 起き上がり
  rationale: 横たわっていた人物への命令として自然であり、直後の動作と日本語で滑らかにつなげた。
- source_word: ἄρας τὸ κλινίδιόν σου
  choice: 自分の寝床を担いで
  rationale: κλινίδιονは小さな寝台や敷物を指し得る。特定の形状に限定しすぎない「寝床」を選び、ἄραςには持ち運ぶ動作を示す「担いで」を用いた。
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: 家に帰りなさい
  rationale: 直訳的な「自分の家へ行きなさい」より自然で、本人の家へ向かう意味を過不足なく表す。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουの称号性と曖昧さ
  choice: 人の子
  alternative: 人間／人なる者
  rationale: 伝統的な称号を保持することで、イエスの自己呼称、一般的人間を思わせる語感、ダニエル書7章との響きを一つに決めつけず残した。
- issue: 罪を赦すἐξουσίαの性質
  choice: 罪を赦す権威
  alternative: 罪を赦す力
  rationale: 論点は奇跡を行う能力だけでなく、罪を赦す正当な権限にあるため、「権威」とした。
- issue: ἐπὶ τῆς γῆςの範囲
  choice: 地上で
  alternative: 地上において／地上の領域で
  rationale: 原文の簡潔な場所表現を維持し、その神学的範囲を訳文で解釈的に限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの宣言には簡潔で dignified な調子を保った。原文のダッシュが示す中断を日本語の閉じかぎ括弧とダッシュで再現した。脚注記号は関連語ではなく発言導入後に置かれているため、本文上の参照範囲がやや広いが、脚注自体は「寝床」の語義を説明する。
