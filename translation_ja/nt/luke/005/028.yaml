id: LUK.5.28
reference: Luke 5:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: ja
  text: そして彼は、すべてを後に残して立ち上がり、イエスに従った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスに従い始めた」。
    reason: ἠκολούθει は未完了過去形で、文脈上、従う行為の開始を含むとも理解できる。
lexical_decisions:
- source_word: καταλιπὼν
  choice: 後に残して
  rationale: アオリスト分詞で、主動詞に先立つ決然とした行為を表す。「捨てて」ほど所有物の永久的放棄を強く断定せず、自然な現代日本語で表した。
- source_word: πάντα
  choice: すべてを
  rationale: 中性複数対格の包括的な意味を保ち、レビが残したものの範囲を本文以上に限定しない。
- source_word: ἀναστὰς
  choice: 立ち上がり
  rationale: 物語文脈で、行動を起こすために立ち上がることを表すアオリスト分詞として訳した。
- source_word: ἠκολούθει
  choice: 従った
  rationale: 未完了過去形は継続または開始の含みを持ち得るが、ここでは日本語として自然な「従った」を本文に置き、開始の含みは脚注に示した。
- source_word: αὐτῷ
  choice: イエスに
  rationale: ギリシア語は代名詞だが、その指示対象は直前の文脈のイエスである。日本語の「彼に」はレビを指すようにも読めるため、明瞭さを保つ最小限の明示を行った。
- source_word: καὶ
  choice: そして
  rationale: 前節の召命とレビの応答を素直につなぐ接続詞として、自然な物語調の「そして」を用いた。
theological_decisions:
- issue: レビが「すべて」を残したことの範囲
  choice: 本文どおり、彼がすべてを後に残してイエスに従ったと訳す。
  alternative: 全財産を永久に放棄した、または仕事だけを一時的に離れた、と限定する。
  rationale: πάντα の包括性を保ちながら、財産や職業に関する恒久的な教理を本文以上に読み込まない。
- issue: ἠκολούθει の未完了過去形が示す相
  choice: 本文では「従った」とし、継続的な弟子としての歩みを排除しない。
  alternative: 開始を前面に出して「従い始めた」と訳す。
  rationale: この文脈では開始の含みも可能だが、未完了過去形自体が必ず開始を明示するわけではないため、別訳として脚注に残した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。物語のテンポと召命への決然とした応答を保ちつつ、「捨てた」のような過度に強い語や、本文を越えた財産放棄の含意を避けた。
