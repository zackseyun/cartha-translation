    rationale: 原文はシモンに舟を岸から少し出すよう依頼したことをいう。「舟を出す」とすれば自然で、意味も明確になる。
  revised_text: そこでイエスは、何そうかあった舟のうち、シモンの舟に乗り込み、岸から少し離れた所へ舟を出すよう、シモンに頼んだ。そして腰を下ろし、舟から群衆を教えていた。
