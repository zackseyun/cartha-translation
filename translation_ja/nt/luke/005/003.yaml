  naturalness: 原案の「舟の一そう、シモンの舟」は同格関係がやや不自然です。「何そうかあった舟のうち、シモンの舟に」とすると、複数の舟の一つであり、それがシモンの舟だったという情報を自然に伝えられます。
  terminology: 「舟」「シモン」「群衆」は文脈と現代標準語に適しています。「腰を下ろし」も自然です。教える場所は「舟から」として原文の表現を保ちます。
