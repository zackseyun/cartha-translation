source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: ja
  text: そこでイエスは、何そうかあった舟のうち、シモンの舟に乗り込み、岸から少し離れた所へ舟を出すよう、シモンに頼んだ。そして腰を下ろし、舟から群衆を教えていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβὰς
  choice: 乗り込み
  rationale: 舟に入る具体的な動作と、主動詞に先立つ分詞の順序を、自然な日本語の連用形で表した。
- source_word: ἓν τῶν πλοίων / τοῦ πλοίου
  choice: 舟の一そう／舟
  rationale: 湖上の漁船という文脈に合う「舟」を用い、最初の複数中の一つという意味も保った。「そう」は小型船を数える自然な助数詞として平仮名表記にした。
- source_word: ὃ ἦν Σίμωνος
  choice: シモンの舟
  rationale: 属格による所有を簡潔で自然な日本語にした。直前の「舟」と多少重なるが、どの舟かが明瞭になる。
- source_word: ἠρώτησεν αὐτὸν
  choice: シモンに頼んだ
  rationale: ここでは問いかけではなく行為を求める依頼なので、「尋ねた」ではなく「頼んだ」とした。代名詞の指示対象も日本語では固有名で明示した。
- source_word: ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον
  choice: 岸から少しこぎ出す
  rationale: γῆは字義的には「陸、地」だが、舟を水上へ移す場面では「岸」が自然である。ἐπανάγωは岸から舟を出す動作を表し、シモンが漁師である文脈に即して「こぎ出す」とした。ὀλίγονの小さな距離も「少し」で保持した。
- source_word: καθίσας
  choice: 腰を下ろし
  rationale: 座るという先行動作を自然かつ品位ある現代日本語で示した。
- source_word: ἐκ τοῦ πλοίου
  choice: 舟の中で
  rationale: ἐκは起点を示し、字義的には「舟から」だが、日本語では教えた場所を自然に表す「舟の中で」とした。岸にいる群衆へ舟を足場として語った意味を保つ。
- source_word: ἐδίδασκεν
  choice: 教えていた
  rationale: 未完了過去の継続的な側面を「ていた」で表した。
- source_word: τοὺς ὄχλους
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語の集合名詞「群衆」は数を不自然に強調せず、人々の集まりを明瞭に表す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、語順は日本語の物語文として自然に整えた。「イエス」はギリシア語本文では省略された主語だが、前節から続く主体を日本語で明確にするため補った。本文に脚注は設けていない。英語案の脚注は本文上の配置と内容に不整合があり、日本語では ἀπὸ τῆς γῆς を文脈に即して「岸から」と直接訳せるため不要と判断した。
