  yaml_path: translation/nt/luke/005/016.yaml
  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: ja
  text: しかし、イエスは人里離れた場所に退いては祈っておられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、イエスご自身は人里離れた場所で退き、祈っておられた」。ギリシア語は未完了形の動詞と二つの現在分詞を用いており、継続的または習慣的な行為を表している。
    reason: 原文の軽い主語強調、複数形、および未完了形の迂言的構文を示すため。
lexical_decisions:
- source_word: αὐτὸς
  choice: イエスは
  rationale: 明示された代名詞には軽い強調があるが、日本語で「彼自身」とすると強すぎて不自然になりやすい。文脈上の指示対象を「イエス」と明示し、後続の「しかし」と合わせて対照を自然に表した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の、評判が広まり群衆が集まって来たという叙述との穏やかな対照を示す。
- source_word: ἦν ὑποχωρῶν
  choice: 退いては
  rationale: 未完了過去のεἰμίと現在分詞の迂言的構文が示す継続的・習慣的な行為を、日本語の反復を表す「〜ては」で自然に表した。
- source_word: ἐν ταῖς ἐρήμοις
  choice: 人里離れた所に
  rationale: 複数形のἔρημοςは、特定の砂漠ではなく、人の住まない寂しい場所々を指す。「人里離れた所」はその意味を現代日本語で明瞭に伝える。移動を伴う「退く」との組み合わせでは助詞「に」が自然である。
- source_word: καὶ
  choice: 、
  rationale: 二つの連動する行為を日本語では読点で自然につなぎ、退いて祈るという一続きの習慣を表した。
- source_word: προσευχόμενος
  choice: 祈っておられた
  rationale: ὑποχωρῶνと並ぶ現在分詞で、過去における継続的・習慣的な祈りを表す。イエスを主語とする現代の聖書文体として自然で、品位ある表現を選んだ。
theological_decisions:
- issue: イエスの行為の相
  choice: 一度だけの出来事ではなく、人里離れた所に退いて祈ることを繰り返していた習慣として訳す。
  alternative: ある特定の一度、退いて祈っていた出来事として訳す。
  rationale: ἦνに二つの現在分詞が伴う未完了過去の構文は、文脈上、継続的または習慣的な行為を最も自然に示す。ただし頻度を特定する「いつも」「しばしば」などは本文に加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「荒れ野」が特定の地形だけを連想させる可能性を避けて「人里離れた所」とした。「退いては」により反復性を簡潔に示し、「祈っておられた」で品位ある聖書文体を保った。
