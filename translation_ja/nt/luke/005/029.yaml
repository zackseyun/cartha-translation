reference: Luke 5:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: ja
  text: レビは自分の家で、イエスのために盛大な宴会を開いた。徴税人やほかの人々が大勢、彼ら[b]と一緒に食卓に身を横たえていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 当時の正式な会食では、寝台などに身を横たえて食事をする習慣があった。
    reason: cultural_note
  - marker: b
    text: 「彼らと」はギリシア語で複数形。誰を指すかには文脈上、解釈の幅がある。
    reason: alternative_reading
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: 盛大な宴会
  rationale: δοχήは人を迎えて催す食事・宴を表す。「盛大な宴会」はμεγάληνの規模感を保ちつつ、現代日本語として自然である。
- source_word: αὐτῷ
  choice: イエスのために
  rationale: 代名詞の指示対象は直前の文脈からイエスである。日本語では「彼のために」より固有名を補うほうが明瞭で自然である。
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: 自分の家で
  rationale: αὐτοῦはレビを指す。主語との関係を自然な日本語で示すため「自分の家」とした。
- source_word: ὄχλος πολὺς τελωνῶν καὶ ἄλλων
  choice: 徴税人やほかの人々も大勢
  rationale: ὄχλος πολὺςの数量を「大勢」で自然に表し、ἄλλωνが特定しない人々を指すことも保持した。
- source_word: μετ’ αὐτῶν
  choice: 彼らと一緒に
  rationale: 複数代名詞をそのまま保ち、本文だけでは指示対象を過度に限定しない訳とした。
- source_word: κατακείμενοι
  choice: 食卓に横になっていた
  rationale: 当時の正式な会食で身を横たえて食事をした姿勢を表す語であり、単に「座っていた」とせず歴史的情景を保持した。
theological_decisions:
- issue: μετ’ αὐτῶνの複数代名詞の指示対象
  choice: 「彼ら」と訳して複数形と指示の余地を保持する
  alternative: 「イエスたちと」または「イエスと」
  rationale: ギリシア語は複数形であり、文脈上はイエスを中心とする一行を指すと考えられるが、本文で固有名を補って解釈を固定しない。単数の「イエスと」は場面の中心を明瞭にする一方、原文の数を反映しない。
translation_notes:
  register: 明瞭な現代標準語を用い、「盛大な宴会」で祝いの席の規模を表した。「食卓に横になっていた」は日常的な日本の食事姿勢と誤解され得るため文化注を付した。節頭のκαίは物語の連続を示すが、単独節として自然に読めるよう明示的な接続詞は置かなかった。
