id: LUK.5.18
reference: Luke 5:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἄνδρες φέροντες ἐπὶ κλίνης ἄνθρωπον ὃς ἦν παραλελυμένος, καὶ ἐζήτουν αὐτὸν εἰσενεγκεῖν καὶ ⸀θεῖναι ἐνώπιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: ja
  text: 見よ、男たちが、麻痺した一人の人を寝台[a]に載せて運んで来ていた。彼らはその人を中へ運び入れ、彼の前に置こうとしていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寝床」または「長椅子」とも訳せる。ギリシア語のκλίνηは、寝台のような寝具や台を指す。
    reason: lexical_alternative
  - marker: b
    text: 「彼」は、文脈上イエスを指す。
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面への注意を促す談話標識としての力と、物語の生き生きとした調子を保つ。現代語としてやや格調があるが、聖書本文では明瞭である。
- source_word: ἄνδρες
  choice: 男たち
  rationale: 成人男性を指す語であり、一般的な「人々」には広げない。
- source_word: φέροντες
  choice: 運んで来た
  rationale: 現在分詞が描く進行中の動作を、場面に登場する一連の動きとして自然な日本語で表す。
- source_word: ἐπὶ κλίνης
  choice: 寝床に載せて
  rationale: κλίνηは寝台、床、長椅子などを指し得る。「寝床」は具体的な構造を過度に限定せず、運搬可能な寝具を自然に示す。
- source_word: ἄνθρωπον
  choice: 人
  rationale: ここでは一人の男性を指すが、直前の「男たち」と区別しつつ自然に表現できる。
- source_word: παραλελυμένος
  choice: 体の麻痺した
  rationale: 完了受動分詞が示す、麻痺した状態にあることを簡潔に表す。寝たきりなどの情報は加えない。
- source_word: ἐζήτουν
  choice: 置こうとしていた
  rationale: 未完了過去の継続的な試みを「～ようとしていた」で表す。この表現は二つの不定詞「運び入れ」「置く」の双方にかかる。
- source_word: εἰσενεγκεῖν
  choice: 中へ運び入れ
  rationale: 方向を表す接頭辞を反映し、寝床ごと運ぶ文脈も自然に伝える。
- source_word: θεῖναι
  choice: 置く
  rationale: 姿勢を必要以上に限定せず、τίθημιの一般的な配置の意味を保つ。
- source_word: ἐνώπιον αὐτοῦ
  choice: 彼の前に
  rationale: 原文が固有名ではなく代名詞を用いることを保つ。文脈上の指示対象はイエスであるため、注で明示する。
theological_decisions:
- issue: 節末のαὐτοῦが指す人物
  choice: 彼の前に
  alternative: イエスの前に
  rationale: 文脈上はイエスを指すが、原文は名を明記せず代名詞を用いる。本文ではその形式を保ち、理解に必要な情報を脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」によって原文の注意喚起と物語上の格調を保持した。「彼」は日常会話ではやや硬いが、原文の代名詞を保ち、指示対象を勝手に本文へ補わないために採用した。
