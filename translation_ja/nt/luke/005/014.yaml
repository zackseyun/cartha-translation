id: LUK.5.14
reference: Luke 5:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: ja
  text: イエスはその人に、だれにも話さないように命じられた。「だが、行って祭司に自分を見せ、あなたの清めについて、モーセが命じたとおりにささげ物をささげ、それを彼らへの証しとしなさい。[a]」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: モーセが清めについて命じたささげ物は、レビ記14章を参照。
    reason: cross_reference
  - marker: b
    text: 「彼ら」が祭司たちを指すのか、ほかの人々を指すのかは明示されていない。また、「彼らへの証し」は「彼らに対する証拠」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: παρήγγειλεν
  choice: 命じ
  rationale: 権威ある直接的な指示を表しつつ、原文に明示されない『厳しく』などの強意を加えない。
- source_word: μηδενὶ εἰπεῖν
  choice: だれにも話さないよう
  rationale: 禁止の内容を自然な現代日本語で表す。
- source_word: ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: 行って祭司に自分の体を見せ
  rationale: 分詞と命令の流れを自然な連続動作として訳した。『体』は日本語で何を見せるのかを明確にする最小限の補足である。
- source_word: προσένεγκε
  choice: ささげ物をしなさい
  rationale: 祭儀的文脈での供え物の奉献を、一般読者に分かりやすく表す。目的語は次の句とレビ記14章の背景から補った。
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: あなたが清められたことのために
  rationale: 清めに関して定められた供え物という関係を示し、治癒そのものと祭儀上の清めを不用意に同一視しない表現とした。
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: モーセが命じたとおり
  rationale: モーセ律法の規定への言及を簡潔かつ直接的に保持する。
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: それが彼らへの証しとなる
  rationale: 『彼ら』の指示対象と、証しが肯定的か不利な証拠かを特定せず、原文の曖昧さを保つ。
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς の αὐτοῖς の指示対象と証しの性格
  choice: 『彼らへの証し』として曖昧さを保持
  alternative: 『祭司たちへの証し』『人々への証し』『彼らに対する証拠』
  rationale: 原文は代名詞の指示対象も、証しが肯定的・中立的・対抗的なものかも明示していないため、本文で限定しない。
- issue: 清めと癒やしの関係
  choice: 『あなたが清められたことのために』
  alternative: 『あなたの清めのために』
  rationale: レビ記14章の祭儀的確認と供え物の背景を踏まえ、供え物が癒やしを生じさせるとの含意を避けつつ、περί の関係を表す。
translation_notes:
  register: 明瞭で現代的だが、聖書本文としての品位を保つ文体。イエスを主語として明示し、直接話法にすることで、日本語として自然に命令内容を示した。
