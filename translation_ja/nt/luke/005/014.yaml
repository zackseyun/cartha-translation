revisions:
- from: イエスはその人に、だれにも話さないよう命じ、こう言われた。「ただ、行って祭司に自分の体を見せ、あなたが清められたことのために、モーセが命じたとおりのささげ物をしなさい。[a] それが彼らへの証しとなる。」[b]
  to: イエスはその人に、だれにも話さないように命じられた。「だが、行って祭司に自分を見せ、あなたの清めについて、モーセが命じたとおりにささげ物をささげ、それを彼らへの証しとしなさい。[a]」[b]
  rationale: 原文の命令の連なりと、供え物にかかる「彼らへの証しとして」という目的・性格の句を保つよう改めた。「自分を見せ」として原文の再帰代名詞を不必要に身体へ限定せず、「あなたの清めについて」として名詞句の曖昧さを維持した。脚注は本文中の該当箇所に適切にアンカーされ、内容も原文の曖昧さを保持している。
