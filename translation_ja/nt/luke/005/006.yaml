  text: καὶ τοῦτο ποιήσαντες συνέκλεισαν πλῆθος ἰχθύων πολύ, ⸀διερρήσσετο δὲ ⸂τὰ δίκτυα⸃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/006.yaml
  text: And when they had done this[a], they enclosed a great multitude of fish[b], and their nets were tearing.
translation:
  language: ja
  text: そして、彼らがそのようにすると、おびただしい数の魚を囲い込んだ。[a] すると、彼らの網は裂け始めていた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大量の魚を捕らえた」。ギリシア語の動詞は、より字義的には「囲い込んだ」「閉じ込めた」という意味で、魚が網に囲まれる様子を描いている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らの網は裂けつつあった」。ギリシア語の未完了過去は、裂ける事態が進行中であったことを表し、完全に裂け切ったことまでは必ずしも意味しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσαντες
  choice: そのとおりにすると
  rationale: アオリスト分詞を、直前の指示を実行した後に結果が生じたことを示す自然な時間表現として訳した。指示内容を受ける τοῦτο は「そのとおりに」で表した。
- source_word: συνέκλεισαν
  choice: 囲い込んだ
  rationale: 単に「捕った」とせず、魚を網の中に囲み入れるという動詞の具体的な像を保った。
- source_word: πλῆθος ἰχθύων πολύ
  choice: おびただしい数の魚
  rationale: πλῆθος と πολύ が重ねて示す圧倒的な多さを、現代日本語で明瞭かつ格調を損なわずに表した。
- source_word: διερρήσσετο
  choice: 裂け始めていた
  rationale: 未完了過去が示す進行中の事態を表し、網がすでに完全に破断したとは断定しない訳にした。中・受動形は日本語では自然な自動詞表現とした。
- source_word: τὰ δίκτυα αὐτῶν
  choice: 網
  rationale: ギリシア語は複数形だが、日本語では漁具としての複数の網も通常「網」と言えば自然に表せる。所有は文脈上明白なので明示しなかった。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、「おびただしい」で原文の数量的強調を保った。「囲い込んだ」は原語の像を伝えるためやや直訳寄りだが、文脈上自然に理解できる。本文中に全脚注記号を配置した。
