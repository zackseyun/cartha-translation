  source_fidelity: 「知らせはますます広まり」「集まって来ていた」は、διήρχετο と συνήρχοντο の未完了過去の継続的な意味を自然に表している。「イエスについての知らせ」も ὁ λόγος περὶ αὐτοῦ に適切である。ただし「癒やしてもらおうとして」は、治癒を求めようとする意志・試みを明示し、目的の受動不定詞 θεραπεύεσθαι（「癒やされるために」）より一歩踏み込む。
  naturalness: 全体として明瞭な現代標準日本語である。「大勢の群衆」も許容されるが、「多くの群衆」のほうが原文の複数形と πολλοὶ をより素直に保つ。二つの目的は「〜ために」で並列すると読み取りやすい。
  terminology: 「知らせ」「病気」「癒やす」は物語文脈にふさわしく、身体的治癒を過度に神学化していない。脚注の語義代案も本文の選択を適切に補足している。
