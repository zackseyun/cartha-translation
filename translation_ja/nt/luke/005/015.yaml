source:
  edition: SBLGNT
  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: ja
  text: しかし、イエスについての知らせはますます広まり[a]、多くの群衆が、話を聞き、また自分たちの病気を癒やしてもらうために集まって来ていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスについての話」または「イエスについての評判」。
    reason: λόγος の文脈上の語義には「知らせ」「話」「評判」などの表現が可能なため。
lexical_decisions:
- source_word: διήρχετο
  choice: 広まり
  rationale: 未完了過去の継続的な広がりを、自然な現代日本語で表す。
- source_word: μᾶλλον
  choice: ますます
  rationale: 以前にも増して広がったという比較・強意を簡潔に保つ。
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: イエスについての知らせ
  rationale: ここでの λόγος は神学的な術語としての「ことば」よりも、イエスに関して流布した知らせを指す。代名詞の指示対象を日本語で明確にした。
- source_word: συνήρχοντο
  choice: 集まって来ていた
  rationale: 未完了過去が示す継続・反復的な集合を表す。
- source_word: ὄχλοι πολλοὶ
  choice: 大勢の群衆
  rationale: 複数の多数の群衆という意味を、不自然な直訳を避けて表す。
- source_word: ἀκούειν
  choice: 話を聞き
  rationale: 目的を表す不定詞として訳す。ギリシア語で省略された聞く対象は文脈上イエスなので、日本語として自然になるよう「話」を補った。
- source_word: θεραπεύεσθαι
  choice: 癒やしてもらおうとして
  rationale: 受動不定詞と目的の意味を、日本語で自然に表現する。身体的な治癒という文脈を保つ。
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: 病気を
  rationale: 治癒の文脈における身体的な疾患を指す。「病気から癒やされる」という構造を、日本語では自然な「病気を癒やしてもらう」とした。
theological_decisions:
- issue: 癒やしの性質
  choice: 身体の病気が癒やされることとして訳す
  alternative: 霊的回復も含み得る「全き者とされる」などの広い表現
  rationale: 直近の文脈では身体の病気の治癒が語られており、本文が明示しない霊的意味を付加しない。
- issue: λόγος の意味
  choice: 知らせ
  alternative: ことば
  rationale: この物語的文脈では、イエスについて広まった評判・知らせを意味する。ただし語義上の別訳は脚注に残す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。継続的な動作を「広まり」「集まって来ていた」で示し、二つの目的「聞くこと」と「癒やされること」を並列した。
