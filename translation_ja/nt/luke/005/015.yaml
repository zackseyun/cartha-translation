  to: しかし、イエスについての知らせはますます広まり[a]、多くの群衆が、話を聞き、また自分たちの病気を癒やしてもらうために集まって来ていた。
  rationale: 治癒を求める意図を過度に明示する「〜しようとして」を、原文の受動不定詞と目的用法に対応する「〜してもらうために」へ改めた。これにより、「聞くこと」と「癒やされること」という二つの目的を並列して保つ。「多くの群衆」は ὄχλοι πολλοὶ の複数性と多数性を明示する。
