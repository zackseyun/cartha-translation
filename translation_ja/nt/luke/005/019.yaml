id: LUK.5.19
reference: Luke 5:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μὴ εὑρόντες ποίας εἰσενέγκωσιν αὐτὸν διὰ τὸν ὄχλον ἀναβάντες ἐπὶ τὸ δῶμα διὰ τῶν κεράμων καθῆκαν αὐτὸν σὺν τῷ κλινιδίῳ εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: ja
  text: しかし、群衆のために、彼をどのようにして中へ運び入れればよいか分からなかったので[a]、屋根に上り、屋根瓦の間を通して[b]、彼を寝床ごと[c]、中央に、イエスの前へつり降ろした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「群衆のために、彼をどこから中へ運び入れればよいか分からなかったので」。ギリシア語の表現は、運び入れる方法だけでなく、入る経路をも含みうる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「瓦を通して」。ルカは屋根瓦に関わる構造を示している。どのように開口部を設けたかは本文では明示されていない。
    reason: cultural_note
  - marker: c
    text: 「寝床」は、小さな寝台や敷物を指す。文脈上、人を載せて運ぶための寝床である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν αὐτόν
  choice: どこから彼を運び入れればよいか
  rationale: ποίας は省略を含む表現で、入れる経路または方法を問う。「どこから」は群衆により通常の入口が使えない文脈を自然に示しつつ、「どうやって」という意味の余地も脚注に残す。εἰσενέγκωσιν は、運ばれている人を建物内へ入れることなので「運び入れる」とした。
- source_word: διὰ τὸν ὄχλον
  choice: 群衆に阻まれて
  rationale: διά＋対格の原因を表し、群衆が進入の妨げだったことを自然な日本語で示す。
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: 屋根に上り
  rationale: δῶμα は屋上・家の屋根を指す。簡潔で現代的な「屋根に上り」とした。
- source_word: διὰ τῶν κεράμων
  choice: 屋根瓦を外して
  rationale: 直訳は「瓦を通して」。実際に人と寝床を下ろすため瓦の部分を開けた動作を、日本語として理解しやすく表した。
- source_word: καθῆκαν
  choice: つり降ろした
  rationale: 上方から下へ降ろす動作を表す。「つり降ろす」は寝床に載せた人を屋根から慎重に降ろす場面に自然である。
- source_word: σὺν τῷ κλινιδίῳ
  choice: 寝床ごと
  rationale: κλινίδιον は小型の寝台・寝床を指す。「床」だけでは建物の床面と誤解され得るため「寝床」とし、σύν は日本語らしく「ごと」で表した。
- source_word: εἰς τὸ μέσον ἔμπροσθεν τοῦ Ἰησοῦ
  choice: 真ん中にいるイエスの前へ
  rationale: εἰς τὸ μέσον は集まりの中央部への移動、ἔμπροσθεν τοῦ Ἰησοῦ はイエスの正面の位置を示す。日本語では二つの位置関係が自然につながるよう表現した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、叙述の品位を保った。「しかし」で直前の試みとの対照を示す。屋根の構造を過度に説明せず、必要な文化的情報は脚注に置いた。
