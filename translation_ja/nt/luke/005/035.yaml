id: LUK.5.35
reference: Luke 5:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: ja
  text: しかし、やがて日々が来る。そして、花婿が彼らから取り去られる時には、その日々に彼らは断食する。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: やがてその日々が来る
  rationale: 「日々が来る」という原文の時を表す慣用表現を保ちつつ、日本語で将来性が明確になるよう「やがて」を補った。後半の「その日々」との照応も保つ。
- source_word: δὲ
  choice: しかし
  rationale: 直前の、弟子たちが断食していない現状と、将来断食する時との穏やかな対比を示す。
- source_word: ὅταν
  choice: 時
  rationale: アオリスト接続法を伴い、将来起こる時点を指すため、自然な日本語の「時」とした。
- source_word: ἀπαρθῇ
  choice: 取り去られる
  rationale: 受動態と、単なる自発的な立ち去りではなく外から除かれる含みを保持した。
- source_word: ἀπ’ αὐτῶν
  choice: 彼らから
  rationale: 花婿と弟子たちとの分離を簡潔に表す。
- source_word: ὁ νυμφίος
  choice: 花婿
  rationale: 婚礼の比喩を保つ、現代日本語で一般的かつ聖書文脈にも適した語。
- source_word: τότε
  choice: その時
  rationale: 花婿が取り去られる時に続く時間的帰結を明示する。日本語では重複を避けるため独立した「その時」を置かず、「時、その日々には」という構造に意味を担わせた。
- source_word: νηστεύσουσιν
  choice: 彼らは断食する
  rationale: 宗教的実践として食を断つ意味を正確に伝える定着した表現。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: その日々には
  rationale: 冒頭の「日々」を受ける原文の反復と強調を残した。
theological_decisions:
- issue: 花婿の不在を自発的な出発として弱めるか
  choice: 「花婿が彼らから取り去られる」と受動的で不穏な表現を保持する
  alternative: 「花婿が彼らのもとを去る」
  rationale: ἀπαρθῇ の受動態は、花婿が単に自ら去る以上の、何者かによって除かれる含みを持つ。イエスの死への予示を説明として本文に加えず、その緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、格調と原文の反復を保った。「その日々」は日常会話ではやや重いが、ἐλεύσονται ... ἡμέραι と ἐν ἐκείναις ταῖς ἡμέραις の照応を示すため意図的に残した。注記を要する本文上の異読・訳語代案はないため脚注は付していない。
