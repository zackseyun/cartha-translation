  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: ja
  text: すると、律法学者たちとファリサイ派の人々はあれこれ考え始めた。「冒瀆の言葉を語るこの者は何者だ。神おひとりのほかに、だれが罪を赦すことができるのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: 論じ始めた
  rationale: ἄρχομαι＋不定詞の開始の意味を保ちつつ、διαλογίζομαιが内心の思案にも相互の議論にもなり得る余地を残す。日本語の「論じる」は文脈上の批判的な検討を自然に表す。
- source_word: γραμματεῖς
  choice: 律法学者たち
  rationale: 福音書の文脈で、律法に通じた専門家という役割を現代日本語で明瞭に伝える定着した訳語。
- source_word: Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団名を音写し、「派の人々」を添えて現代の一般読者にも人物集団であることを明確にする。
- source_word: λαλεῖ βλασφημίας
  choice: 神を冒瀆することを語る
  rationale: 複数形βλασφημίαςを日本語で不自然な「冒瀆の言葉ども」とせず、発言内容を非難する表現として自然に示す。「神を」は文脈上の宗教的冒瀆を明瞭にする。
- source_word: ἁμαρτίας ἀφεῖναι
  choice: 罪を赦す
  rationale: 罪との結びつきにおけるἀφίημιの標準的かつ自然な訳。ギリシア語の複数形は日本語では無標の「罪」で十分に表される。
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: 神おひとりのほかに
  rationale: 例外を表すεἰ μήと、μόνοςの排他的な強調を、自然で厳かな日本語によって保持する。
- source_word: Τίς ἐστιν οὗτος
  choice: この者は何者だ
  rationale: 原文にない「男」を加えず、οὗτοςに感じられる距離と非難の響きを「この者」で保つ。
theological_decisions:
- issue: イエスが罪を赦す権威を持つことへの含意
  choice: 話者たちの主張をそのまま訳し、罪を赦せるのは神おひとりだけだという排他的な認識を明確に保つ。
  alternative: キリスト論的結論を本文に補う、または排他性を弱めて意訳する。
  rationale: この節は律法学者とファリサイ派の人々の異議を提示しており、ルカの物語における神学的緊張を生む。翻訳はその含意を保持しつつ、本文が明言していない結論を挿入しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文にふさわしい品位を保った。疑問文は批判的で切迫した調子を示す。「論じ始めた」は、内心の推論か相互の議論かを過度に限定しない。
