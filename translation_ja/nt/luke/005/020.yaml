  text: καὶ ἰδὼν τὴν πίστιν αὐτῶν ⸀εἶπεν· Ἄνθρωπε, ἀφέωνταί σοι αἱ ἁμαρτίαι σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: ja
  text: イエスは彼らの信仰[a]を見て、その人に、「人よ、あなたの罪は赦されている[b]」と言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「信頼」。ギリシア語は「信仰」。
    reason: lexical_alternative
  - marker: b
    text: または「赦された」。ギリシア語の完了受動態は、完了した行為の結果として現在も続く状態を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: 見て
  rationale: アオリスト分詞の付帯・時間的関係を簡潔に保ち、「見ると」ほど直後性を強く限定しない自然な日本語とした。
- source_word: πίστιν
  choice: 信仰
  rationale: ここでは行動に表れた信頼を指すが、語の標準的かつ神学的含意を保つため「信仰」とした。「信頼」も可能なので脚注に示した。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: 複数形をそのまま保ち、病人だけか、運んだ者たちを含む一同かを限定しない。
- source_word: Ἄνθρωπε
  choice: その人に
  rationale: 男性単数への呼びかけであることを保ちつつ、日本語で「人よ」と直訳すると不自然で尊大にも響くため、発話の受け手を示す地の文に移した。
- source_word: ἀφέωνταί
  choice: 赦されている
  rationale: 完了受動態が表す、完了した行為の結果として現在成立している状態を自然な日本語で表した。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: 複数形は個々の罪過を含むが、日本語では集合的に「罪」とするのが自然で、意味も損なわない。
- source_word: σοι ... σου
  choice: あなたの
  rationale: 所有を「あなたの」で明示し、与格の受益者は日本語の赦しの表現に含意させて冗長さを避けた。
theological_decisions:
- issue: 「彼らの信仰」の範囲
  choice: 複数の「彼ら」を保ち、誰が含まれるかを限定しない。
  alternative: 病人を運んだ者たちだけ、または病人と同行者たち全員を指すと明示する。
  rationale: ギリシア語の複数代名詞は範囲を明示しないため、その物語的・神学的余地を保持した。
- issue: 赦しの宣言の時制的な力
  choice: 「赦されている」とし、現在成立している赦しの状態を表す。
  alternative: 「赦された」としてその場での行為を前面に出す。
  rationale: 完了受動態は完了した行為とその現在的結果を示すが、赦しが厳密にいつ与えられたかまでは決定しない。
- issue: 受動態の行為者
  choice: 行為者を補わず、受動表現を保つ。
  alternative: 「神が赦してくださった」と行為者を明示する。
  rationale: 神的受動と理解し得るが、原文は行為者を明示していないため補わない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「人よ」という不自然な逐語訳を避けながら、男性への直接の呼びかけを「その人に」で保持した。
