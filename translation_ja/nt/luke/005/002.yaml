id: LUK.5.2
reference: Luke 5:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: ja
  text: そして、湖のほとりに二そうの舟があるのをご覧になった。漁師たちは舟を降りて[a]、網を洗っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「舟から上がって」。
    reason: ἀποβάντεςは乗り物から降りることを表し、岸へ上がるという文脈的な表現も可能であるため。
lexical_decisions:
- source_word: εἶδεν
  choice: ご覧になった
  rationale: 物語中の単純過去として「見た」に相当する。文脈上の主語であるイエスに対し、現代日本語の聖書本文として自然で品位ある敬語表現を用いた。
- source_word: δύο πλοῖα
  choice: 二そうの舟
  rationale: 湖での漁という文脈では「船」より小型の舟を示す「舟」が自然であり、助数詞には「そう」を用いた。
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: 湖のほとりに…ある
  rationale: ἑστῶταは舟がその場所にとどまっている状態を表す。「係留されている」などの具体的な方法は本文にないため加えず、自然な日本語の「ある」とした。παράは位置を示すため「湖のほとりに」と訳した。
- source_word: οἱ δὲ ἁλιεῖς
  choice: 漁師たちは
  rationale: δέは舟の描写から漁師たちの様子へ視点を移す軽い転換であり、日本語では文を分けることで十分に示されるため、強い逆接語は置かなかった。
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: 舟を降りて
  rationale: 舟から出たという先行動作を、簡潔で自然な日本語で表した。指示代名詞の内容は日本語では「舟」と明示した。
- source_word: ἔπλυνον τὰ δίκτυα
  choice: 網を洗っていた
  rationale: 未完了過去の進行中の動作を「洗っていた」で表した。定冠詞に所有の意味を加えず、「彼らの網」とはしなかった。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある物語調とした。ギリシア語の分詞構造は、日本語として自然な接続形「降りて」で表現した。
