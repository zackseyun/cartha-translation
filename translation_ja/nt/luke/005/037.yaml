  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: ja
  text: また、だれも新しいぶどう酒を古い革袋[a]に入れはしない。そんなことをすれば、新しいぶどう酒が革袋を破裂させ、ぶどう酒そのものは流れ出し[b]、革袋は使えなくなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「古い皮」。動物の皮で作られた、ぶどう酒などを入れる容器を指す。
    reason: lexical_alternative
  - marker: b
    text: 「注ぎ出される」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάλλει
  choice: 入れる
  rationale: 液体を容器に収めることを自然に表しつつ、原語の一般的な「置く、入れる」という意味を保つ。「注ぐ」ほど動作を限定しない。
- source_word: οἶνον νέον
  choice: 新しいぶどう酒
  rationale: 発酵途上の新しいぶどう酒という比喩の内容を、現代日本語で明瞭に表す標準的な訳。
- source_word: ἀσκοὺς παλαιούς
  choice: 古い革袋
  rationale: 動物の皮で作った液体用容器を指すため、「皮」だけでなく容器であることが分かる「革袋」とした。
- source_word: εἰ δὲ μήγε
  choice: そんなことをすれば
  rationale: 直前に否定された行為を実行した場合の帰結を導く条件表現として、文脈に即した自然な日本語。
- source_word: ῥήξει
  choice: 破り
  rationale: 新しいぶどう酒が革袋を裂いて損壊させる使役的な意味を簡潔に表す。
- source_word: ἐκχυθήσεται
  choice: 流れ出て
  rationale: 破れた革袋からぶどう酒が外へこぼれ出る結果を自然に示す。受動形を日本語として不自然にならない自動詞表現にした。
- source_word: ἀπολοῦνται
  choice: だめになる
  rationale: 革袋が損なわれて使用不能になる意味を、過度に強い「滅びる」を避けて明瞭に表す。
- source_word: καὶ αὐτός
  choice: ぶどう酒は
  rationale: 代名詞の指示対象を日本語で明示し、革袋との対照を読みやすくした。強意は文脈上の並列で伝わる。
- source_word: οὐδεὶς
  choice: だれも…しない
  rationale: 全称否定を自然な現代日本語で表し、ことわざ的な調子を保つ。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、比喩の具体性と簡潔な格調を保った。「革袋」は日本語の聖書表現として理解可能であり、脚注で実物を補足した。
