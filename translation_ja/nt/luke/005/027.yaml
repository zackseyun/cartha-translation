id: LUK.5.27
reference: Luke 5:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα ἐξῆλθεν καὶ ἐθεάσατο τελώνην ὀνόματι Λευὶν καθήμενον ἐπὶ τὸ τελώνιον, καὶ εἶπεν αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/027.yaml
  text: And after these things he went out and saw a tax collector named Levi sitting at the tax booth[a], and he said to him[b], “Follow me.”
translation:
  language: ja
  text: この後、イエスは外へ出て、収税所[b]に座っているレビという徴税人に目を留め[a]、彼に言った。「わたしについて来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「見た」「じっと見た」。このギリシア語は、ちらりと見る以上の意味を含むことがある。
    reason: lexical_alternative
  - marker: b
    text: または「料金所」「税関所」。税や通行税などを徴収する場所を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: この後
  rationale: 複数形を逐語的に「これらのことの後」とすると現代日本語では硬いため、物語の順序を明確に保つ自然な接続表現とした。
- source_word: ἐξῆλθεν
  choice: 外へ出て
  rationale: ἐξέρχομαιが表す具体的な移動をそのまま伝える。文脈上の主語を明確にするため「イエスは」を補った。
- source_word: ἐθεάσατο
  choice: 目を留め
  rationale: 単に視界に入っただけでなく、ある程度意識して見ることも表し得る動詞のニュアンスを自然な日本語で示した。ただし「見た」も可能なので脚注に残した。
- source_word: τελώνην
  choice: 徴税人
  rationale: 福音書の社会的・職業的役割を、現代日本語で簡潔かつ一般的に伝える語である。
- source_word: ὀνόματι Λευὶν
  choice: レビという
  rationale: 「レビという名の」より簡潔で自然に、人名を提示する構文を再現する。
- source_word: καθήμενον
  choice: 座っている
  rationale: 現在分詞が描く、レビがその場所に座している場面を自然に表す。
- source_word: ἐπὶ τὸ τελώνιον
  choice: 収税所に
  rationale: 税や通行税などを徴収する場所を指す語として明瞭である。具体的には料金所・税関所のような施設である可能性も脚注に残した。
- source_word: Ἀκολούθει μοι
  choice: わたしについて来なさい
  rationale: 命令の直接性と、後に従うという字義を保ちつつ、現代日本語として自然にした。弟子になることを明示的に付け加えてはいない。
theological_decisions:
- issue: イエスの命令が弟子として従うよう求める召しであること
  choice: 「わたしについて来なさい」と直接的な命令として訳す。
  alternative: 「わたしの弟子になりなさい」
  rationale: 文脈上は弟子への召しだが、原文は「弟子」という語を明示していないため、解釈的な説明を本文に加えず、命令そのものの表現を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。物語の流れを自然にしつつ、原文の具体的な動作と直接話法を保った。英語相談層では脚注記号と内容の対応が本文上入れ替わっているため、日本語稿ではἐθεάσατοに[a]、τελώνιονに[b]を正しく付した。
