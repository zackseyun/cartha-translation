  source_fidelity: 原文の出来事の順序、イエスが出て行く動作、レビを見留めること、徴税人・収税所・着座の描写、そして直接的な命令を正確に伝えている。「この後」はμετὰ ταῦταの複数形を日本語として自然に処理しており、意味を損なわない。「目を留め」はἐθεάσατοの単なる視認以上の含意を不当に強めずに表している。
  naturalness: 明瞭な現代標準日本語であり、「収税所に座っているレビという徴税人」という叙述も自然に理解できる。会話の「わたしについて来なさい。」は直接性を保ち、文脈上の弟子への召しを本文に説明的に加えていない。
