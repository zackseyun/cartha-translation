id: LUK.5.38
reference: Luke 5:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ οἶνον νέον εἰς ἀσκοὺς καινοὺς ⸀βλητέον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/038.yaml
  text: But new wine must be put into fresh wineskins[a].
translation:
  language: ja
  text: しかし、新しいぶどう酒は、真新しい革袋に入れなければならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「新しい革袋」とも訳せる。原文では、ぶどう酒にはνέος（特に時間的に「新しい」）、革袋にはκαινός（特に性質や状態が「新しい、真新しい」）という異なる形容詞が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前節で述べられた不適切な扱いと、ここで示される適切な扱いとの対照を、自然な現代日本語で表す。
- source_word: οἶνον νέον
  choice: 新しいぶどう酒
  rationale: νέοςはここで、造られてから時を経ていないぶどう酒を指す。日本語として定着し、意味も明瞭な表現を用いた。
- source_word: εἰς
  choice: に
  rationale: 容器の内部へ入れる方向性は、動詞「入れる」と組み合わせた格助詞「に」によって自然かつ明確に表される。
- source_word: ἀσκοὺς
  choice: 革袋
  rationale: 液体、とりわけぶどう酒を入れるための動物の皮製の容器を指す。「革袋」は簡潔で文化的実物を明示できる。
- source_word: καινοὺς
  choice: 真新しい
  rationale: νέοςとの語の違いをある程度保ち、使用されて傷んだ袋ではなく、状態の新しい革袋であることを自然な日本語で示す。
- source_word: βλητέον
  choice: 入れなければならない
  rationale: この動詞的形容詞が表す非人称的な必要・適切性を、明瞭な現代日本語で表す。
theological_decisions:
- issue: 同じ文にあるνέοςとκαινόςの区別
  choice: νέοςを「新しい」、καινόςを「真新しい」と訳し分ける
  alternative: 両方を「新しい」と訳す
  rationale: 原文は異なる二つの形容詞を用いている。意味領域は重なるが、νέοςは特に時間的な新しさ、καινόςは特に性質・状態の新しさを表し得るため、その差を過度に強調せず日本語にも反映した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「真新しい」によって原文の形容詞の違いを示しつつ、注で意味の重なりと別訳を明記した。
