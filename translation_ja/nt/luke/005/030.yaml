  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: ja
  text: ファリサイ派の人々とその律法学者たちは、イエスの弟子たちに不平を漏らして、こう言った[a]。 「なぜあなたがたは、徴税人や罪人たちと一緒に食べたり飲んだりするのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ぶつぶつ不満を言っていた」とも訳せる。ギリシア語は、継続的に小声で不満を漏らすことを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: 不平を言った
  rationale: 未完了過去形が示す継続的な不満の表出を、自然な現代日本語で表す。語には小声でぶつぶつ不満を漏らす含みもあるため、脚注で補う。
- source_word: γραμματεῖς
  choice: 律法学者
  rationale: ユダヤ教の律法に通じた歴史的集団を、現代日本語の聖書読者に明瞭な慣用訳で示す。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: ギリシア語の属格を保ち、律法学者たちとファリサイ派の人々との関係を明示する。
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: イエスの弟子たちに
  rationale: πρός＋対格を発言の向かう相手として訳す。日本語では指示対象を明確にするため、αὐτοῦを「イエスの」とした。
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う表現として簡潔で自然な対応語。
- source_word: τελωνῶν
  choice: 徴税人
  rationale: 税や通行税を請け負って徴収した人々を指す福音書の歴史的呼称として、簡潔で一般的な訳語を用いる。
- source_word: ἁμαρτωλῶν
  choice: 罪人たち
  rationale: 話者たちが社会的・宗教的に分類している集団名として、評価的な響きを弱めず直接訳す。
- source_word: ἐσθίετε καὶ πίνετε
  choice: 食べたり飲んだりする
  rationale: 二つの具体的行為を保ちつつ、反復・習慣を問う現在形に合う自然な日本語とする。
- source_word: καὶ
  choice: すると
  rationale: 物語の接続を自然な現代日本語で示し、単純な継起以上の意味は加えない。
theological_decisions:
- issue: 「徴税人や罪人たち」との食卓の交わりが持つ社会的・宗教的意味
  choice: 非難の具体的内容をそのまま示し、儀礼的・道徳的理由を本文に補わない
  alternative: 汚れや道徳的非難を説明的に補足する
  rationale: 本文は集団名と共食行為によって緊張を提示しており、その理由を一義的に説明してはいない。そこで神学的緊張を保ち、解釈を本文へ持ち込まない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「律法学者」「徴税人」「罪人」は歴史的・宗教的呼称として簡潔に保ち、会食の意味を説明的に展開しない。
