id: LUK.5.1
reference: Luke 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: ja
  text: あるとき、群衆がイエスに押し迫り、神のことばを聞いている間、イエスはゲネサレ湖[b]のほとりに立っておられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ゲネサレ湖は、ガリラヤ湖としても知られる。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: さて、…とき
  rationale: ルカに特徴的な場面導入の表現。日本語では独立した「起こった」を置くより、時間節と「さて」で自然に物語を進める。δέの軽い接続機能も「さて」で表した。
- source_word: ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ καὶ ἀκούειν
  choice: 群衆がイエスに押し迫り、…聞いていたとき
  rationale: ἐν τῷと不定詞の時間的用法を「…とき」とし、群衆が押し迫ることと聞くことの二つを並列のまま保持した。文脈上の指示対象を日本語で明確にするため、αὐτῷを「イエスに」とした。
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: イエスに押し迫り
  rationale: 身体的に迫るほど群衆が詰め寄る様子を、現代日本語で簡潔かつ生き生きと表す。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: 神からの宣べ伝えられたメッセージを指しうる一方、原文の幅と聖書内の響きを保つ定着した表現を採用した。
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: イエスは…立っておられた
  rationale: 継続して立っていた姿勢を表す迂言的構文を自然な日本語にした。主語を明示し、敬意を含みつつ過度に古風でない表現とした。
- source_word: παρὰ τὴν λίμνην Γεννησαρέτ
  choice: ゲネサレ湖のほとりに
  rationale: 固有名を原文どおり音写し、λίμνηと湖畔の位置関係を自然な日本語で表した。
theological_decisions:
- issue: τὸν λόγον τοῦ θεοῦの訳し方
  choice: 神のことば
  alternative: 神のメッセージ
  rationale: この句は宣べ伝えられた神の知らせを意味しうるが、「ことば」とすることで意味を限定せず、神学的・聖書内的な広がりを保持する。
- issue: Γεννησαρέτの扱い
  choice: ゲネサレ湖
  alternative: ガリラヤ湖
  rationale: 原文が用いる固有名をそのまま伝える。「ガリラヤ湖」は理解を助ける同定として脚注に置き、本文を調和的名称に置き換えない。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。物語導入は日本語として自然な「さて、…とき」とし、群衆の二つの動作を保った。「御言葉」のような教会内限定の表記を避け、一般読者にも読みやすい「神のことば」とした。
