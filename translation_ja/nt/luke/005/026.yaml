id: LUK.5.26
reference: Luke 5:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔκστασις ἔλαβεν ἅπαντας καὶ ἐδόξαζον τὸν θεόν, καὶ ἐπλήσθησαν φόβου λέγοντες ὅτι Εἴδομεν παράδοξα σήμερον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: ja
  text: そして、一同は驚きにとらえられ、神をあがめ続けた。また、恐れに満たされ、「今日、私たちは驚くべきこと[a]を見た」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「並外れたこと」「思いもよらないこと」。ギリシア語は、普通の予想を超えた事柄を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: 驚き
  rationale: ここでは神秘的な「恍惚」ではなく、出来事に圧倒された強い驚きを表す。現代日本語として自然であり、文脈にも合う。
- source_word: ἔλαβεν ἅπαντας
  choice: 一同を捕らえ
  rationale: 直訳的な像を生かし、驚きがその場の全員を圧倒したことを鮮明に表した。
- source_word: ἐδόξαζον τὸν θεόν
  choice: 神をあがめ続けた
  rationale: δοξάζωを「あがめる」とし、未完了過去が示す継続的な動作を「続けた」で表した。
- source_word: ἐπλήσθησαν φόβου
  choice: 恐れに満たされ
  rationale: φόβοςを「畏敬」などに狭めず「恐れ」と訳し、神の働きに接した際の畏れと不安の両面を残した。
- source_word: Εἴδομεν
  choice: 私たちは……見た
  rationale: 直前に起きた出来事への反応として、日本語では単純過去が自然であり、アオリストにも対応する。
- source_word: παράδοξα
  choice: 驚くべきこと
  rationale: 通常の予想を超える出来事を指す語義を、奇異さを強調しすぎない自然な日本語で表した。
- source_word: σήμερον
  choice: 今日
  rationale: 出来事を目撃した当日の即時性をそのまま表した。
theological_decisions:
- issue: 神の働きに対する φόβος の含意
  choice: 「恐れ」と直接訳す
  alternative: 「畏敬」または「畏れ」
  rationale: この反応には礼拝的な畏敬だけでなく、圧倒される不安や恐怖も含み得る。「恐れ」とすることで、本文が持つ緊張を解消せずに保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「驚きが一同を捕らえ」「恐れに満たされ」という原文の力強い表現を保持した。引用は群衆の即時的な反応として自然に整えた。
