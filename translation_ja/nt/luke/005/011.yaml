  source_fidelity: 原文の二つのアオリスト分詞（「舟を陸に上げて」「すべてを残して」）に続く主動詞（「従った」）という行為の順序を、自然な日本語で適切に表している。「陸に引き上げる」はκαταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆνの場面に合い、「すべてを後にして」はἀφέντες πάνταの包括性を、恒久的な処分等を付加せずに保つ。「イエスに従った」はαὐτῷの指示対象を文脈に即して明瞭にし、ἀκολουθέωの叙述的・弟子としての含意を不必要に説明せず伝える。
  naturalness: 明瞭で自然な現代標準日本語である。「そして」により前節からの連続を示し、「舟を陸に引き上げると、すべてを後にして、イエスに従った」という流れも読みやすい。日本語では「舟」が複数の舟を総称的に指し得るため、複数形を明示しないことは問題ない。
  terminology: 「舟」はガリラヤ湖の漁の文脈に適合し、「陸」「すべて」「イエスに従った」も明確で標準的である。「後にして」は「捨てて」より解釈を強めず、本文の表現範囲にとどまっている。
