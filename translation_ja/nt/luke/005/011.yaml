reference: Luke 5:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: ja
  text: そして、舟を陸に引き上げると、すべてを後にして、イエスに従った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: 引き上げると
  rationale: アオリスト能動分詞で、主動詞に先立つ行為を表す。舟を水上から陸へ移す場面に自然な現代日本語とし、「～すると」によって動作の順序を保った。
- source_word: τὰ πλοῖα
  choice: 舟
  rationale: ガリラヤ湖の漁に用いられた船を指すため、「船」よりも文脈に合う「舟」とした。日本語では複数を明示しなくても総称的に理解できる。
- source_word: ἐπὶ τὴν γῆν
  choice: 陸に
  rationale: 直訳的には「陸の上へ」。方向を示す対格を自然かつ簡潔に表し、「岸」と狭く限定しなかった。
- source_word: ἀφέντες
  choice: 後にして
  rationale: ここでは、置いて去る、捨て置くという意味。日本語では主動詞「従った」に従属させ、弟子として従うために離れたという動作を、過度に強い「捨てた」で解釈せず表した。
- source_word: πάντα
  choice: すべて
  rationale: 中性複数の包括的表現。何をどの程度、恒久的に手放したかを補足せず、原文の全体性と余白を保つ。
- source_word: ἠκολούθησαν αὐτῷ
  choice: イエスに従った
  rationale: ἀκολουθέωの、実際について行く意味と弟子として従う含意の双方を保つ。「彼」では指示対象が日本語で曖昧になりやすいため、文脈上の指示対象であるイエスを明示した。
theological_decisions:
- issue: πάνταが示す放棄の範囲
  choice: すべてを後にして
  alternative: すべてを捨てて／一切を残して
  rationale: 包括的な放棄を保ちつつ、財産の恒久的処分など本文が明示しない内容を付け加えない。「後にして」は、弟子として従う決断の強さを示しながら、その具体的範囲に関する緊張を残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そして」で前節との連続を示し、三つの動作の順序を自然に表した。注を要するほど重要な別訳はないため、脚注は付していない。
