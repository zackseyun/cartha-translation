  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: ja
  text: イエスは彼らに答えられた。「医者を必要とするのは、健康な人ではなく、病気の人です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: 彼らに答えられた
  rationale: 分詞と定動詞を重ねるギリシア語の慣用的な発話導入を、応答の意味と相手を保ちながら自然な日本語にまとめた。
- source_word: Οὐ χρείαν ἔχουσιν
  choice: 必要とするのは……ではなく
  rationale: χρείαν ἔχωの「必要がある」という意味を、日本語の対比構文に合わせて明瞭に表した。
- source_word: οἱ ὑγιαίνοντες
  choice: 健康な人
  rationale: 現在分詞が指す、健康な状態にある人々を平明な現代日本語で表した。
- source_word: ἰατροῦ
  choice: 医者
  rationale: 一般の読者に自然で分かりやすく、ことわざ的な発言にも適した語を選んだ。
- source_word: οἱ κακῶς ἔχοντες
  choice: 病気の人
  rationale: 字義的には「具合が悪い人」である慣用句を、文脈上の確立した意味に即して自然に訳した。
