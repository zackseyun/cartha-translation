  text: Ἔστιν δὲ αὕτη ἡ παραβολή· Ὁ σπόρος ἐστὶν ὁ λόγος τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/011.yaml
  text: 'This is the parable: the seed is the word of God[a].'
translation:
  language: ja
  text: このたとえは、こうです。種は神のことばです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このたとえの意味はこうです」。ギリシア語では、より直訳的には「これがたとえです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔστιν δὲ αὕτη ἡ παραβολή
  choice: このたとえは、こうです
  rationale: 直訳的な構造「これがたとえです」を不自然にせず、説明を導入する文脈にも合う現代日本語とした。「意味」という語を本文に補わず、原文の簡潔さと含みを保った。δὲは穏やかな移行を示すが、日本語では文脈上明らかなため独立した接続語を置かなかった。
- source_word: ὁ σπόρος
  choice: 種
  rationale: 単数形を、日本語でも集合的に理解できる「種」とし、たとえの比喩をそのまま保った。
- source_word: ὁ λόγος
  choice: ことば
  rationale: ここでは神が伝える内容を指す。「メッセージ」より原語との対応と聖書的な響きを保ちつつ、現代日本語として読みやすい表記にした。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格を直接的に訳し、「神からの」と出所に限定して解釈することを避けた。
theological_decisions:
- issue: παραβολήをそのまま「たとえ」とするか、文脈に即して「たとえの意味」と補うか
  choice: たとえ
  alternative: たとえの意味／たとえの説明
  rationale: 文脈ではイエスがたとえを解き明かしているが、原文には「意味」「説明」に当たる名詞がない。そのため本文では「たとえ」を保ち、日本語として必要な説明的含意は「こうです」という表現にとどめた。より明示的な訳は脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ端正な標準語。「御言葉」のような教会的表記を避け、一般読者にも分かりやすい「ことば」を用いた。
