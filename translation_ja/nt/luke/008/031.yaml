  text: καὶ ⸀παρεκάλουν αὐτὸν ἵνα μὴ ἐπιτάξῃ αὐτοῖς εἰς τὴν ἄβυσσον ἀπελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/031.yaml
  text: And they were begging him not to command them to go into the abyss[a].
translation:
  language: ja
  text: また彼らは、自分たちに底知れぬ淵[a]へ行けと命じないでほしいと、イエスにしきりに懇願していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「深淵」。ギリシア語は測り知れない深みを表すことがあり、ここでは悪霊を閉じ込める場所を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεκάλουν
  choice: しきりに懇願していた
  rationale: 未完了過去の継続的・反復的な様相と、悪霊たちが切迫して願う文脈を表す。「頼んでいた」より強く、「懇願し続けていた」より自然な現代日本語とした。
- source_word: ἐπιτάξῃ
  choice: 命じないでほしい
  rationale: 権威をもって指図する動詞の力を「命じる」で保ち、ἵνα μή以下を日本語として自然な依頼内容にした。
- source_word: ἄβυσσον
  choice: 底知れぬ淵
  rationale: 測り知れない深みを表す語義と、悪霊が恐れる超自然的な場所という文脈を保つ。「底なしの穴」は黙示文学的な像を強く限定しすぎるため避けた。
- source_word: ἀπελθεῖν
  choice: 行け
  rationale: 移動先が明示されているので、簡潔な「行く」を命令の引用形で表した。「立ち去る」のような不要な意味を加えていない。
- source_word: ἵνα μὴ
  choice: ないでほしいと
  rationale: 懇願の内容を導く構文として、現代日本語で自然な否定依頼にした。
- source_word: αὐτοῖς
  choice: 自分たちに
  rationale: 命令を受ける者が彼ら自身であるという与格の関係を明示し、「自分たちに…行けと命じる」と自然に表した。
theological_decisions:
- issue: 悪霊の文脈におけるἄβυσσοςの意味
  choice: 悪霊が送られることを恐れる超自然的な「底知れぬ淵」
  alternative: 一般的な空間的意味での「深み」または「深淵」
  rationale: 文脈は悪霊たちがイエスの権威ある命令を恐れている場面であるため、宇宙論的・霊的含意を残した。ただし、ルカがここで明示していない刑罰や場所の詳細までは本文に加えなかった。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、悪霊たちの切迫した懇願、イエスの命令権、ἄβυσσοςの含意を保持した。「また」でκαίを自然につなぎ、代名詞の指示対象は文脈上の明瞭さのため「イエス」とした。
