  source_fidelity: καὶは「また」で自然につながれ、παρεκάλουνの未完了過去は「しきりに懇願していた」によって継続・反復的な懇願として適切に表されている。ἵνα μὴ ἐπιτάξῃ αὐτοῖς…ἀπελθεῖνは、「自分たちに…行けと命じないでほしいと」で、命令の権威、否定された願いの内容、命令を受ける者を過不足なく伝えている。ἄβυσσονを「底知れぬ淵」とすることも、本文以上にその性質を限定せず、文脈上の異界的含意を保つ妥当な訳である。
