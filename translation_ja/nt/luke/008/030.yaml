id: LUK.8.30
reference: Luke 8:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπηρώτησεν δὲ αὐτὸν ὁ ⸀Ἰησοῦς· Τί σοι ⸂ὄνομά ἐστιν⸃; ὁ δὲ εἶπεν· Λεγιών, ὅτι ⸂εἰσῆλθεν δαιμόνια πολλὰ⸃ εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/030.yaml
  text: Then Jesus asked him[a], “What is your name?” And he said[b], “Legion,” because many demons had entered into him.
translation:
  language: ja
  text: そこで、イエスは彼に、「あなたの名は何ですか」とお尋ねになった。彼は、「レギオン[a]」と言った。多くの悪霊が彼の中に入り込んでいたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レギオン」はラテン語由来の語で、ローマ軍の大部隊を指す。ここでは、その男の中に多くの悪霊がいたことを示している。
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: お尋ねになると
  rationale: 直接の問いを導く動詞として自然な現代日本語にし、アオリストと続く応答の流れを「〜すると」で表した。イエスに対する敬意を保ちつつ、過度に古風な表現は避けた。
- source_word: δὲ
  choice: そこで
  rationale: 物語を先へ進める軽い接続を示す。強い対立を表す語ではないため、「しかし」ではなく「そこで」とした。
- source_word: Τί σοι ὄνομά ἐστιν
  choice: あなたの名は何か
  rationale: ギリシア語の慣用的な問いを、簡潔で明瞭な日本語の質問として訳した。
- source_word: Λεγιών
  choice: レギオン
  rationale: ラテン語由来の呼称を音写し、ローマ軍の大部隊を指す背景と、この箇所で多数を含意する点は脚注で補った。
- source_word: ὅτι
  choice: 〜からである
  rationale: 「レギオン」という名の理由を説明する因果関係を明確に表した。
- source_word: εἰσῆλθεν
  choice: 入り込んでいた
  rationale: εἰςとともに内へ入る方向性を保ち、その出来事が名を答える時点より前に起きていたことを日本語の継続・結果状態で自然に示した。
- source_word: δαιμόνια πολλὰ
  choice: 多くの悪霊
  rationale: 複数の邪悪な霊的存在を指す語として、現代日本語の聖書文脈で明瞭な「悪霊」を用い、πολλάの多数性も保持した。
- source_word: εἰς αὐτόν
  choice: 彼の中に
  rationale: 単に彼と共にいたという意味ではなく、彼の内へ入ったという方向性を文脈に即して表した。
theological_decisions:
- issue: δαιμόνιαを悪霊憑依の文脈でどう訳すか
  choice: 悪霊
  alternative: 邪悪な霊
  rationale: 本文が複数の人格的な悪しき霊的存在について述べていることを弱めず、日本語で最も直接的かつ一般的な表現を選んだ。
- issue: εἰσῆλθενと名乗りの理由説明との時間関係
  choice: 入り込んでいた
  alternative: 入った
  rationale: 悪霊が入った出来事が「レギオン」と答える以前であることを自然に示す一方、原文以上に時間関係を細かく規定しない表現とした。
- issue: 「彼」が人と悪霊のどちらを指すか
  choice: 原文どおり「彼」を保つ
  alternative: 男／悪霊と明示する
  rationale: この場面では話者をめぐる叙述上の緊張があり、原文の男性単数代名詞を特定の解釈で置き換えず、その曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着いた格調を保った。「お尋ねになる」はイエスへの自然な敬意を示し、応答側は原文に即して簡潔に「言った」とした。
