id: LUK.8.27
reference: Luke 8:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν ⸀ὑπήντησεν ἀνήρ τις ἐκ τῆς πόλεως ⸀ἔχων δαιμόνια· ⸂καὶ χρόνῳ ἱκανῷ οὐκ ἐνεδύσατο ἱμάτιον⸃, καὶ ἐν οἰκίᾳ οὐκ ἔμενεν ἀλλ’ ἐν τοῖς μνήμασιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/027.yaml
  text: And when he came out onto the land[a], a certain man from the city met him, who had demons. And for a considerable time he had not put on clothing[b], and he did not stay in a house but among the tombs.
translation:
  language: ja
  text: イエスが陸に上がると[a]、町から来た一人の男がイエスに出会った。その男は悪霊どもに取りつかれていた[b]。彼はかなり長い間、衣服を身に着けず、家には住まないで、墓場にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「陸へ出ると」。文脈上、「岸に上がると」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「悪霊どもを持っていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντι δὲ αὐτῷ ἐπὶ τὴν γῆν
  choice: イエスが陸に上がると
  rationale: 分詞構文を時を表す節として訳した。「地の上へ出る」が字義だが、舟から陸へ移った文脈を自然な日本語で表した。主語は文脈上のイエスである。
- source_word: ὑπήντησεν
  choice: 彼に出会った
  rationale: 「会う、出会う」という直接的な意味を保ち、意図的に迎えに来たとまでは限定しない表現とした。
- source_word: ἀνήρ τις ἐκ τῆς πόλεως
  choice: 町の一人の男
  rationale: ἀνήρを「男」、τιςを「一人の」で表した。ἐκ τῆς πόλεωςは、その男と町との出身・所属上の関係を簡潔に示す「町の」とした。
- source_word: ἔχων δαιμόνια
  choice: その男には悪霊どもがついていた
  rationale: 直訳的には「悪霊どもを持っていた」。日本語として理解できる形にしつつ、「取りつかれていた」と断定的に言い換えず、原文の表現の幅を残した。複数形も「ども」で示した。
- source_word: χρόνῳ ἱκανῷ
  choice: かなり長い間
  rationale: 相当な期間の継続を、現代日本語で自然かつ明瞭に表した。
- source_word: οὐκ ἐνεδύσατο ἱμάτιον
  choice: 衣服を身に着けず
  rationale: ἐνδύωの「着る、身に着ける」という動作を保った。日本語では継続的な状態を自然に示すため連用形で後続節につないだ。
- source_word: ἐν οἰκίᾳ οὐκ ἔμενεν
  choice: 家には住まないで
  rationale: 未完了過去の習慣的・継続的な様子を表し、単に一時滞在しなかったというより生活場所の対比が伝わるようにした。
- source_word: ἀλλ’ ἐν τοῖς μνήμασιν
  choice: 墓場にいた
  rationale: 複数の墓のある場所で過ごしていたことを、日本語で自然な「墓場」によって表した。
theological_decisions:
- issue: δαιμόνιαの訳語
  choice: 悪霊ども
  alternative: 汚れた霊ども
  rationale: ここで原文が用いる語はδαιμόνιαであり、πνεύματα ἀκάθαρταではない。「汚れた霊」と混同せず、通常の直接的な対応語を選んだ。
- issue: ἔχων δαιμόνιαを「悪霊に取りつかれた」と訳すか
  choice: 悪霊どもがついていた
  alternative: 悪霊どもに取りつかれていた
  rationale: 原文は字義的には「悪霊どもを持つ」と述べる。「取りつかれる」は一般的で分かりやすいが、支配の度合いをより強く明示しうるため、本文では原文に近く、なお自然な表現を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語として読みやすい短文に整えた。「悪霊どもがついていた」は口語に傾きすぎない範囲で原文の字義と自然さを両立させ、「墓場」は複数の墓の区域を簡潔に表す。
