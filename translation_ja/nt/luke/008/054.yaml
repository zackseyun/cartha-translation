id: LUK.8.54
reference: Luke 8:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐτὸς ⸀δὲ κρατήσας τῆς χειρὸς αὐτῆς ἐφώνησεν λέγων· Ἡ παῖς, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/054.yaml
  text: But he took her by the hand and called out[a], saying, “Child, arise.”
translation:
  language: ja
  text: しかし、イエスはその子の手を取って、声を上げて言われた。「子よ[a]、起きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「娘よ」。ギリシア語のπαῖςは「子ども」を意味し、この文脈では「少女、娘」を指すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ
  choice: しかし、イエスは
  rationale: δέによる直前の反応からの物語上の転換を「しかし」で示した。日本語では主語を明確にするため、文脈上の指示対象を「イエス」とした。αὐτόςの強意を不自然な「ご自身で」によって過度に表さない。
- source_word: κρατήσας τῆς χειρὸς αὐτῆς
  choice: その子の手を取って
  rationale: κρατέωの具体的な接触動作を、自然な現代日本語で表した。「つかんで」は力強さや乱暴さを余分に感じさせうるため避けた。
- source_word: ἐφώνησεν λέγων
  choice: 声を上げて言われた
  rationale: φωνέωが示す聞こえる声での呼びかけを「声を上げて」で表し、λέγωνを自然な引用導入にまとめた。敬語は聖書叙述におけるイエスへの標準的な敬意を示す。
- source_word: Ἡ παῖς
  choice: 子よ
  rationale: παῖςは子ども一般にも、文脈上の少女にもなりうる。「子よ」は呼格として自然で、性別を明示しすぎず、原語の語義の幅と親しみある呼びかけを保つ。
- source_word: ἔγειρε
  choice: 起きなさい
  rationale: ἐγείρωの現在命令形を、直接的で自然な現代日本語の命令として訳した。起床と起き上がることの両方に通じる表現であり、文脈にある死からの回復の含みを説明的に限定しない。
theological_decisions:
- issue: 少女への呼びかけの訳
  choice: 子よ
  alternative: 娘よ／少女よ
  rationale: παῖςはこの文脈では少女を指すが、語そのものはより広く「子ども」を意味しうる。「子よ」は原語の幅を保ち、並行記事の表現を持ち込まない。
- issue: ἔγειρεの命令の訳
  choice: 起きなさい
  alternative: 立ち上がりなさい／よみがえりなさい
  rationale: 命令を簡潔に保ち、身体を起こすことと死から生へ戻る奇跡的文脈との緊張を残した。「よみがえりなさい」は解釈を明示しすぎる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、叙述には穏やかな格調を保った。「声を上げて」は「叫んで」ほど切迫感を加えず、原文の呼びかけを伝える。
