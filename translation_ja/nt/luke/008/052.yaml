  naturalness: 「人々は皆、彼女のために泣き、嘆いていた」は明瞭で自然である。「泣くのをやめなさい」も、この場面で進行中の泣く行為をやめるよう求める表現として自然である。理由を「なぜなら」で明示しても、現代標準日本語として滑らかである。
