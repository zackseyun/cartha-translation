  text: ἔκλαιον δὲ πάντες καὶ ἐκόπτοντο αὐτήν. ὁ δὲ εἶπεν· Μὴ κλαίετε, ⸂οὐ γὰρ⸃ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/052.yaml
  text: And they were all weeping and mourning for her. But he said[a], “Do not weep, for she has not died, but is sleeping.”
translation:
  language: ja
  text: 人々は皆、彼女のために泣き、嘆いていた。しかし、イエスは言われた。「泣くのをやめなさい。なぜなら、彼女は死んだのではなく、眠っている[a]のです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「眠っている」。ここで「眠っている」は、死を眠りとして表す言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκλαιον
  choice: 泣き
  rationale: 未完了時制の継続的な動作を、後続の「嘆いていた」と合わせて自然な日本語で表した。
- source_word: πάντες
  choice: 人々は皆
  rationale: 嘆いていた者たち全員を指す πάντες の包括性を明示した。
- source_word: ἐκόπτοντο αὐτήν
  choice: 彼女のために…嘆いていた
  rationale: 葬送の文脈での κόπτομαι は、胸を打つ動作を伴いうる哀悼を表すが、本文が動作を明示していないため「嘆く」とした。αὐτήν は哀悼の対象として「彼女のために」と表した。
- source_word: Μὴ κλαίετε
  choice: 泣くのをやめなさい
  rationale: μή を伴う現在命令形は、すでに続いている行為の中止を求める意味に自然に理解でき、直前の未完了時制の描写にも合う。
- source_word: οὐ γὰρ
  choice: …のではなく
  rationale: γάρ の理由提示は、日本語では命令の直後に説明を続けることで自然に示した。οὐ…ἀλλά の対比は「…のではなく、…」で保持した。
- source_word: ἀπέθανεν
  choice: 死んだ
  rationale: アオリストを自然な日本語の過去形で表し、否定と後続の対比を保持した。
- source_word: καθεύδει
  choice: 眠っている
  rationale: 現在形の継続的な状態を表し、死と眠りをめぐるイエスの比喩的表現を解釈で置き換えずに残した。
theological_decisions:
- issue: 少女についての「死んだのではなく、眠っている」というイエスの言葉
  choice: イエスの発言を「死んだのではなく、眠っている」とそのまま訳し、死と眠りの緊張を保持する。
  alternative: 「永久に死んだのではない」または「実は眠っているだけだ」と説明的に訳す。
  rationale: 物語は少女の死をめぐるイエス独自の捉え方と、間近な回復を示す「眠り」の表現を提示している。本文でその意味を一つに限定せず、字義と比喩の緊張を読者に残す。
translation_notes:
  register: 明瞭な現代標準日本語。叙述には自然な継続表現を用い、イエスの言葉は簡潔で品位ある敬体とした。脚注標識は該当する発言の末尾に置いた。
