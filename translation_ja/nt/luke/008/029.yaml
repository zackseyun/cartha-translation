source:
  edition: SBLGNT
  text: ⸀παρήγγελλεν γὰρ τῷ πνεύματι τῷ ἀκαθάρτῳ ἐξελθεῖν ἀπὸ τοῦ ἀνθρώπου. πολλοῖς γὰρ χρόνοις συνηρπάκει αὐτόν, καὶ ⸀ἐδεσμεύετο ἁλύσεσιν καὶ πέδαις φυλασσόμενος, καὶ διαρρήσσων τὰ δεσμὰ ἠλαύνετο ⸀ὑπὸ τοῦ ⸀δαιμονίου εἰς τὰς ἐρήμους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/029.yaml
  text: For he had commanded the unclean spirit to come out of the man[a]. For many times it had seized him, and he was kept bound with chains and shackles, being guarded, and breaking the bonds[c][b], he was driven by the demon into the desolate places.
translation:
  language: ja
  text: イエスが汚れた霊に、その人から出て行くよう命じておられたからである。その霊は何度も[a]彼を捕らえていた。彼は鎖と足かせでつながれ、監視されていたが、その拘束を引きちぎり、悪霊に人けのない所へ追いやられていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何度も」は「長い間」とも訳せる。ギリシア語は長い期間を表すこともできるが、拘束と脱出が繰り返された文脈から、ここでは反復の意味に訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγελλεν
  choice: 命じておられた
  rationale: 未完了過去の背景的・継続的な働きを保ち、γάρによる直前の出来事の説明として自然な日本語にした。
- source_word: πνεύματι τῷ ἀκαθάρτῳ
  choice: 汚れた霊
  rationale: 新約聖書の定型的な表現を保ち、宗教的・儀礼的な『汚れ』との語彙的つながりも示す。
- source_word: πολλοῖς γὰρ χρόνοις
  choice: 何度も
  rationale: 複数形と、拘束と脱出が繰り返された文脈を踏まえて反復の意味に訳した。ただし長期間の意味も可能なため脚注で示した。
- source_word: συνηρπάκει
  choice: 捕らえていた
  rationale: 霊が本人を強く支配するニュアンスを、過度に説明せず自然に表した。
- source_word: ἁλύσεσιν καὶ πέδαις
  choice: 鎖と足かせ
  rationale: 二種類の拘束具を区別し、πέδαιςが特に足の拘束具を指すことを明確にした。
- source_word: φυλασσόμενος
  choice: 見張っていた
  rationale: 受動分詞を日本語では行為者を補った能動表現にし、拘束された彼が監視下に置かれていた状況を自然に示した。
- source_word: διαρρήσσων τὰ δεσμὰ
  choice: その拘束を引きちぎり
  rationale: δεσμάを先の鎖だけに限定せず拘束具全体として訳し、διαρρήσσωの強い破壊動作を表した。
- source_word: ἠλαύνετο ὑπὸ τοῦ δαιμονίου
  choice: 悪霊によって…追いやられていた
  rationale: 受動の強制性と未完了過去の反復・継続性を保ち、本人の自発的移動ではないことを示した。
- source_word: εἰς τὰς ἐρήμους
  choice: 人けのない所へ
  rationale: 複数形で表された無人・荒涼の場所という意味を、日本語で地形を限定せず自然に表現した。
theological_decisions:
- issue: πνεῦμα ἀκάθαρτονとδαιμόνιονの表現
  choice: それぞれ『汚れた霊』『悪霊』と、人格的に行為する霊的存在として直接訳す
  alternative: 心理状態や病気を表す比喩として訳す
  rationale: 本文は霊が人を捕らえ、追いやる主体として描いているため、その物語上の主体性を弱めたり心理化したりしない。
- issue: イエスの命令の時間的関係
  choice: 『命じておられたからである』
  alternative: 『命じられたからである』または『命じ続けておられたからである』
  rationale: 未完了過去は背景的・継続的に読めるが、反復命令と断定せず、直前の叫びを説明する時間関係を自然に保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。長いギリシア語文は日本語で読みやすいように分け、接続関係と反復的な背景描写は維持した。
