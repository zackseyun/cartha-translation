  text: καὶ ἐξέστησαν οἱ γονεῖς αὐτῆς· ὁ δὲ παρήγγειλεν αὐτοῖς μηδενὶ εἰπεῖν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/056.yaml
  text: And her parents were astonished[c][b][a], but he instructed them to tell no one what had happened.
translation:
  language: ja
  text: 両親はたいへん驚いた[a]。しかし、イエスは二人に、起こったことをだれにも話さないよう命じた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「驚愕した」。
    reason: lexical_alternative
  - marker: b
    text: 「命じた」は「指示した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξέστησαν
  choice: 非常に驚いた
  rationale: 強い驚きに圧倒されたことを表す。現代日本語として自然であり、「我を忘れた」とまで断定せず、語の強さも保つ。
- source_word: γονεῖς
  choice: 両親
  rationale: 父母を一組として指す標準的で簡潔な訳。
- source_word: παρήγγειλεν
  choice: 命じた
  rationale: 単なる助言ではなく、権威を伴う指示を表す語であるため。「言いつけた」よりも品位ある文体に合う。
- source_word: μηδενὶ εἰπεῖν
  choice: だれにも話さないよう
  rationale: 与格の相手と不定詞による禁止内容を、自然な日本語で表す。
- source_word: τὸ γεγονός
  choice: 起こったこと
  rationale: 完了分詞の名詞的用法を明瞭に訳し、すでに生じた出来事を指すことを示す。
- source_word: δὲ
  choice: しかし
  rationale: 両親の反応と、それに続くイエスの指示との穏やかな対照を明示する。
- source_word: αὐτοῖς
  choice: 二人に
  rationale: 直前の「両親」を受ける複数代名詞であることを、日本語で曖昧にならないよう示す。
theological_decisions:
- issue: イエスの沈黙命令の範囲と意図
  choice: 起こったことをだれにも話さないよう命じた、とのみ訳す。
  alternative: メシアの秘密という主題、命令の期限、または公衆だけを対象とする限定を訳文に加える。
  rationale: 本文は命令の動機や期間を説明していないため、それらを補わず、命令の全面的に見える表現と物語上の緊張をそのまま保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての品位を保った。「非常に驚いた」は過度に口語的にならず、原語の強い反応を伝える。「二人に」を明示して代名詞の指示対象を明確にした。
