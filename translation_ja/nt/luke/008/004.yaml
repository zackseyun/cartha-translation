  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Συνιόντος δὲ ὄχλου πολλοῦ καὶ τῶν κατὰ πόλιν ἐπιπορευομένων πρὸς αὐτὸν εἶπεν διὰ παραβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/004.yaml
  text: 'And when a large crowd was gathering[a], and people from town after town were coming to him, he spoke by a parable:'
translation:
  language: ja
  text: さて、大勢の群衆が集まり、町々から人々がイエスのもとにやって来ていたとき、イエスはたとえを用いて[a]語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「たとえで語った」。ギリシア語の表現は、語る手段とも語り方とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Συνιόντος
  choice: 集まり
  rationale: ὄχλου πολλοῦを主語とする属格独立構文。継続中の集合を、後続する状況描写と自然につながる現代日本語で表した。
- source_word: δὲ
  choice: さて
  rationale: 強い対立ではなく物語の進行を示す接続辞なので、場面を自然に導入する「さて」とした。
- source_word: ὄχλου πολλοῦ
  choice: 大勢の群衆
  rationale: ὄχλοςの「群衆」とπολύςの数量的な強調を、分かりやすい現代日本語で表した。
- source_word: τῶν κατὰ πόλιν ἐπιπορευομένων
  choice: 町々から人々が…やって来る
  rationale: κατὰ πόλινの分配的意味を「町々から」で示し、冠詞付き分詞の指す人々を日本語で明示した。πόλιςはこの文脈では一般読者に自然な「町」とした。
- source_word: πρὸς αὐτόν
  choice: イエスのもとに
  rationale: πρός＋対格が表す接近の方向を「もとに」で表現した。日本語では「彼のもとに」より指示対象を「イエス」と明示する方が明瞭である。
- source_word: εἶπεν
  choice: 語った
  rationale: 後続するたとえという発話形式に自然に結びつき、単なる一言ではなくまとまりのある発話を表せる。
- source_word: διὰ παραβολῆς
  choice: たとえを用いて
  rationale: διά＋属格の手段または様態を自然な日本語で表した。「たとえによって」という硬さを避けつつ、たとえが語る手段であることを示す。
theological_decisions:
- issue: διὰ παραβολῆςが示す手段と様態の幅
  choice: たとえを用いて
  alternative: たとえで
  rationale: 本文では手段の含意を明瞭にしたが、ギリシア語は語り方・様態として理解する余地もあるため、脚注で別訳を保持した。神学的解釈によって一方に限定していない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。敬語的な「語られた」は受け身にも読めるため避け、「語った」とした。物語の流れを保ちつつ、原文で暗黙の主語・指示対象は日本語の明瞭さのため「イエス」と明示した。
