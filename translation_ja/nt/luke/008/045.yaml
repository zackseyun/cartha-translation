source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Τίς ὁ ἁψάμενός μου; ἀρνουμένων δὲ πάντων εἶπεν ὁ ⸀Πέτρος· Ἐπιστάτα, οἱ ὄχλοι συνέχουσίν σε καὶ ⸀ἀποθλίβουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/045.yaml
  text: And Jesus said[a], “Who is the one who touched me?” And while everyone was denying it, Peter said, “Master, the crowds are hemming you in and pressing against you.”
translation:
  language: ja
  text: イエスは言われた。「わたしに触れたのはだれですか。」皆がそれを否定している中で、ペトロが言った。「先生、群衆があなたを取り囲み、押し迫っています[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたの周りに群がり、あなたを強く押しています」。
    reason: 二つの動詞συνέχωとἀποθλίβωが表す、包囲と圧迫の語感についての別訳。
lexical_decisions:
- source_word: ἁψάμενός
  choice: 触れた
  rationale: 中動態のἅπτωは、この文脈では身体的な接触を表す。「触れた」は、女性がイエスに触れたという物語の流れに合う自然な訳である。
- source_word: ἀρνουμένων δὲ πάντων
  choice: 皆が否定していると
  rationale: 現在分詞が表す継続中の動作を「否定している」で示した。否定の内容は直前の問いから明らかなため、本文では補足しなかった。
- source_word: Ἐπιστάτα
  choice: 先生
  rationale: ルカが弟子たちのイエスへの呼びかけに用いる語で、権威を認める敬称である。現代日本語で自然な「先生」とし、κύριοςに相当する「主」を持ち込まなかった。
- source_word: ὄχλοι
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語では集合を表す「群衆」が自然であり、大勢の人々がイエスを囲む状況も明確に伝わる。
- source_word: συνέχουσίν
  choice: 取り囲み
  rationale: 周囲から囲んで身動きを制限する語感を、自然な日本語で表した。
- source_word: ἀποθλίβουσιν
  choice: 押し迫っています
  rationale: 群衆が強く押しつける様子を表し、前の「取り囲み」と意味を区別した。「押しつぶす」ほど過度に強い表現にはしなかった。
theological_decisions:
- issue: イエスへの呼びかけἘπιστάταの訳
  choice: 先生
  alternative: 師よ／主よ
  rationale: この語はイエスの権威を認める敬称だが、本文はκύριοςを用いていない。「主よ」として明示以上のキリスト論的称号を持ち込むことを避けつつ、現代の読者に分かる自然な呼びかけとした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの発言とペトロの敬意ある呼びかけには落ち着いた品位を保った。ギリシア語の構文を機械的に写さず、日本語として自然な語順にした。
