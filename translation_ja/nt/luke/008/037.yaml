id: LUK.8.37
reference: Luke 8:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἠρώτησεν αὐτὸν ἅπαν τὸ πλῆθος τῆς περιχώρου τῶν ⸀Γερασηνῶν ἀπελθεῖν ἀπ’ αὐτῶν, ὅτι φόβῳ μεγάλῳ συνείχοντο· αὐτὸς δὲ ἐμβὰς ⸀εἰς πλοῖον ὑπέστρεψεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/037.yaml
  text: And the whole crowd from the surrounding region of the Gerasenes asked him to depart from them[a], because they were gripped by great fear. So he got into a boat and returned.
translation:
  language: ja
  text: そこで、ゲラサ人の周辺地域の群衆全体が、イエスに自分たちのもとを立ち去るよう求めた。彼らが大きな恐れにとらわれていた[a]からである。そこで、イエスは舟に乗って戻られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「大きな恐れに襲われていた」。
    reason: συνείχοντοは、恐れに強く支配される、あるいは襲われるという含みを持つ。
lexical_decisions:
- source_word: ἠρώτησεν
  choice: 願った
  rationale: ここでは不定詞を伴い、群衆がイエスに立ち去るよう求める意味。「尋ねた」ではなく「願った」とすることで、依頼の用法を自然な日本語で表した。
- source_word: ἅπαν τὸ πλῆθος
  choice: 群衆は皆
  rationale: ἅπαν の全体性を明示しつつ、現代日本語として自然な語順にした。
- source_word: τῆς περιχώρου τῶν Γερασηνῶν
  choice: ゲラサ人の周辺地域から集まった
  rationale: 属格関係を、群衆の出所を示す自然な日本語に展開した。地名・住民名は底本の Γερασηνῶν に従った。
- source_word: ἀπελθεῖν ἀπ’ αὐτῶν
  choice: 自分たちのところから立ち去ってほしい
  rationale: 群衆の依頼内容として自然に表し、ἀπό の離隔の意味も「ところから」で保持した。
- source_word: φόβῳ μεγάλῳ συνείχοντο
  choice: 非常な恐れに捕らわれていた
  rationale: συνέχω の拘束・圧倒の比喩を「捕らわれる」で表し、μέγας の強さを「非常な」で示した。
- source_word: ἐμβὰς εἰς πλοῖον
  choice: 舟に乗り
  rationale: 乗船を表す簡潔で自然な日本語。文脈上の舟を指すため、日本語では不定・定の区別を過度に明示しない。
- source_word: ὑπέστρεψεν
  choice: 戻って行かれた
  rationale: 帰還の動きを表す。主語がイエスであることを補い、物語文として自然な敬意表現を用いた。
theological_decisions:
- issue: ゲラサ地方の人々が抱いた恐れの性質
  choice: 恐れが彼らを捕らえ、それがイエスに退去を願う動機となったことだけを述べる
  alternative: 神的な力への畏敬、経済的損失への反発、または社会的混乱への不安と特定する
  rationale: 本文は φόβος の内容や道徳的評価を説明していないため、畏敬か敵意かを決めず、その曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書物語にふさわしい落ち着いた格調を保った。「イエス」はギリシア語では代名詞だが、日本語で主語の切り替わりを明確にするため補った。注記を要する本文上の異読や不可欠な語義代案はないため、脚注は付していない。
