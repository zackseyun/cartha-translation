  source_fidelity: 「ゲラサ人の周辺地域から集まった」は、περίχωροςが示す地域的な所属をおおむね表す一方、「集まった」は原文にない出来事を付加する。ἅπαν τὸ πλῆθοςは「群衆全体」とし、地域との関係は「ゲラサ人の周辺地域の」とするのがより忠実である。συνείχοντοは「とらわれていた」で適切に表せる。
  naturalness: 「非常な恐れ」は現代標準日本語としてやや不自然であるため、「大きな恐れ」が明瞭で自然である。「自分たちのもとを立ち去るよう求めた」は、依頼内容を自然に表しつつἀπ’ αὐτῶνの離隔を保持する。
  terminology: Γερασηνῶνに従う「ゲラサ人」を維持する。イエスへの敬意表現は本文全体の慣行として許容されるが、「戻られた」は「戻って行かれた」よりもὑπέστρεψενの単純な帰還を過不足なく表す。英語監査訳にあるσυνείχοντοの語義代案は、日本語でも脚注で示す。
