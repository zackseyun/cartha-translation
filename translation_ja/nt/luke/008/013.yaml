  source_fidelity: 全体として原文の構文と意味をよく伝えている。「岩の上に落ちたもの」は、前節から継続する種まきの比喩を日本語で明示する補いとして許容できる。しかし、λόγοςを「みことば」とするのは、原文の通常の「ことば／知らせ」より宗教的に特定された日本語表現であり、敬称的な表記も含めて原文以上の解釈を帯びうるため、中立的な「ことば」に改めるのが適切である。ἀφίστανταιは単なる物理的な「離れる」より、信じていた状態からの離脱を指すため、「離れていきます」として文脈上の方向性をより明瞭にした。
  naturalness: 敬体は明瞭で自然であり、比喩の説明も読みやすい。「この人たち」は先行する「人たち」を自然に受ける。改訂後の「ことばを聞くと、喜んで受け入れる人たち」も現代標準日本語として滑らかである。
  terminology: 「みことば」は日本語キリスト教用語として広く用いられるが、一般語のλόγοςに対しては語彙的・敬称的な限定を加える。この箇所では「ことば」が原文により忠実で、現代の一般読者にも明快である。「試練」はπειρασμόςの文脈上有力な訳であり、脚注で「誘惑」と「試み」の可能性を残す方針は適切である。
