  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ἐπὶ τῆς πέτρας οἳ ὅταν ἀκούσωσιν μετὰ χαρᾶς δέχονται τὸν λόγον, καὶ οὗτοι ῥίζαν οὐκ ἔχουσιν, οἳ πρὸς καιρὸν πιστεύουσιν καὶ ἐν καιρῷ πειρασμοῦ ἀφίστανται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/013.yaml
  text: And the ones on the rock are those who[a], when they hear, receive the word with joy. But these have no root; they believe for a time, and in a time of testing they fall away.
translation:
  language: ja
  text: 岩の上に落ちたものとは、ことばを聞くと、喜んで受け入れる人たちのことです。しかし、この人たちには根がありません。しばらくは信じますが、試練[a]の時になると離れていきます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」または「試み」とも訳せる。ギリシア語は文脈により、試練、試み、誘惑を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τῆς πέτρας
  choice: 岩の上に落ちたもの
  rationale: ギリシア語は直訳すれば「岩の上のもの」だが、日本語では種まきの比喩を自然に示すため、文脈から「落ちた」を補った。「岩」は単数の具体的な比喩を保つ。
- source_word: ἀκούσωσιν
  choice: 聞くと
  rationale: ὅτανを伴う一般的な条件・時を、自然な現代日本語で表した。
- source_word: μετὰ χαρᾶς
  choice: 喜んで
  rationale: 喜びを伴う受容を簡潔で自然な副詞表現にした。
- source_word: δέχονται τὸν λόγον
  choice: みことばを…受け入れる
  rationale: δέχομαιの受容の意味を「受け入れる」で表し、λόγοςは聖書的な用語として理解しやすい「みことば」とした。
- source_word: ῥίζαν οὐκ ἔχουσιν
  choice: 根がありません
  rationale: 単数の「根」を保ち、比喩を簡潔かつ自然に表した。
- source_word: πρὸς καιρὸν
  choice: しばらくは
  rationale: 限定された期間を、現代日本語で自然に示す。
- source_word: πιστεύουσιν
  choice: 信じます
  rationale: 信仰の性質を神学的に限定せず、πιστεύωを直接的かつ中立に訳した。
- source_word: ἐν καιρῷ πειρασμοῦ
  choice: 試練の時になると
  rationale: πειρασμόςの幅を比較的広く保つ「試練」を採用し、時間表現を自然な日本語にした。別の意味合いは脚注に示す。
- source_word: ἀφίστανται
  choice: 離れてしまいます
  rationale: 以前の信仰から離脱する深刻さを示しつつ、「背教する」のような専門的・教義的語彙を避けた。
theological_decisions:
- issue: πιστεύουσινが救いに至る真正な信仰か、表面的な信仰か
  choice: 「信じます」と中立に訳す
  alternative: 「信じたように見えます」「表面的に信じます」
  rationale: 本文は「しばらく信じる」と述べるが、その信仰の教義的性質を明示していないため、真正性や救済論上の結論を訳文に加えない。
- issue: πειρασμόςの意味
  choice: 「試練」
  alternative: 「誘惑」「試み」
  rationale: 外からの苦難や信仰を揺さぶる状況を含み得る広い表現を採用し、「誘惑」の可能性は脚注で保持した。
- issue: ἀφίστανταιが指す離脱の性質
  choice: 「離れてしまいます」
  alternative: 「背教します」「信仰を捨てます」
  rationale: 深刻な離脱を表しながらも、何からどのような救済論的意味で離れるかを本文以上に限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。「みことば」は一般読者にも通じる聖書的表現として用い、比喩と神学的緊張を保った。
