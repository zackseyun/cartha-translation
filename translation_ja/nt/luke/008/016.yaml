id: LUK.8.16
reference: Luke 8:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐδεὶς δὲ λύχνον ἅψας καλύπτει αὐτὸν σκεύει ἢ ὑποκάτω κλίνης τίθησιν, ἀλλ’ ἐπὶ λυχνίας ⸀τίθησιν, ἵνα οἱ εἰσπορευόμενοι βλέπωσιν τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/016.yaml
  text: No one, after lighting a lamp, covers it with a container or puts it under a bed, but puts it on a lampstand, so that those who come in may see the light.
translation:
  language: ja
  text: だれも、明かりをともしてから、それを器で覆ったり、寝台の下に置いたりはしません。燭台の上に置き、入って来る人たちにその光が見えるようにします。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύχνον
  choice: 明かり
  rationale: ここでは、ともして燭台に置く小型の油ランプを指す。現代日本語で自然かつ理解しやすい「明かり」とした。
- source_word: σκεύει
  choice: 器
  rationale: 語義は広く「器、容器、用具」。原文が容器の種類を限定していないため、曖昧さを保つ「器」とした。
- source_word: κλίνης
  choice: 寝台
  rationale: 横になるための台を指す。現代の「ベッド」に限定せず、古代の生活背景にも合う「寝台」とした。
- source_word: λυχνίας
  choice: 燭台
  rationale: 明かりを載せる台を指す。「燭台」は伝統的だが現代日本語でも通じ、単なる台より用途が明確である。
- source_word: οἱ εἰσπορευόμενοι
  choice: 入って来る人たち
  rationale: 現在分詞の継続的・一般的な意味を自然な日本語で表した。
theological_decisions: []
translation_notes:
  register: 明快で格調を保った現代標準日本語。δὲは軽い展開・対比の接続辞であり、この一節単独では不自然な「さて」「しかし」を加えず、無標で訳した。前半の二つの行為を「たり…たり」でまとめ、ἀλλά以下の対照を文を分けて明瞭にした。
