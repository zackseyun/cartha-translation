  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· πορεύου εἰς εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/048.yaml
  text: But he said to her[a], “Daughter, your faith has saved you; go in peace.”
translation:
  language: ja
  text: そこで、イエスは彼女に言った。「娘よ、あなたの信仰があなたを救った。[a] 安心して行きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたを治した」または「あなたを癒やした」とも訳せる。ギリシア語の動詞は、救うことだけでなく、病気を治すことも表す。
    reason: alternative_reading
lexical_decisions:
- source_word: Θυγάτηρ
  choice: 娘よ
  rationale: 呼格をそのまま生かし、イエスの親愛といたわりを自然で簡潔な日本語で表す。
- source_word: πίστις
  choice: 信仰
  rationale: この文脈ではイエスへの信頼を指すが、神学的な広がりを保つため「信仰」とする。
- source_word: σέσωκέν
  choice: 救った
  rationale: σῴζωの完了形であり、直前の身体的癒やしを含みつつ、それより広い救いの含意も保持する。日本語では完了した結果が今も続くことを文脈で表せる。
- source_word: πορεύου
  choice: 行きなさい
  rationale: 命令形を、現代日本語として自然かつ威厳のある表現にする。
- source_word: εἰς εἰρήνην
  choice: 安心して
  rationale: 直訳的な「平安へ」よりも、この別れの言葉が示す平安と安堵を自然な日本語で伝える。
- source_word: δὲ
  choice: しかし
  rationale: 前節の女性の恐れに対するイエスの安心を与える応答との穏やかな対照を示す。
theological_decisions:
- issue: 癒やしの文脈におけるσῴζωの意味範囲
  choice: 本文では「救った」とする
  alternative: 「治した」「癒やした」
  rationale: 物語上は身体の癒やしが明白だが、σῴζωには救出・癒やし・救いの意味領域がある。「救った」によって広がりを保ち、身体的意味は脚注で明示する。
- issue: εἰς εἰρήνηνの表現
  choice: 「安心して行きなさい」
  alternative: 「平安のうちに行きなさい」
  rationale: 後者は形式的対応が強いが、現代日本語ではやや翻訳調になる。「安心して」は恐れから解放され、平安のうちに去るという文脈上の働きを明瞭にする。
translation_notes:
  register: 明瞭な現代標準日本語。呼びかけの親愛と宣言の荘重さを保ちつつ、過度に古風な「汝」「平安のうちに」などは避けた。
