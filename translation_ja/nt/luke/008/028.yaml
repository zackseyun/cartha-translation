id: LUK.8.28
reference: Luke 8:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδὼν δὲ τὸν ⸀Ἰησοῦν ἀνακράξας προσέπεσεν αὐτῷ καὶ φωνῇ μεγάλῃ εἶπεν· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; δέομαί σου, μή με βασανίσῃς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/028.yaml
  text: But when he saw Jesus[a], he cried out, fell down before him, and said with a loud voice, “What do you have to do with me, Jesus, Son of the Most High God? I beg you, do not torment me.”
translation:
  language: ja
  text: ところが、イエスを見ると、彼は叫び声を上げてその前に倒れ伏し、大声で言った。「イエス、いと高き神の子よ。私とあなたに何の関わりがあるのですか。[a] お願いです。私を苦しめないでください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「私とあなたとの間に何があるのですか」。拒絶や抗議を表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ τὸν Ἰησοῦν
  choice: ところが、イエスを見ると
  rationale: アオリスト分詞の先行・状況的な働きを、自然な日本語の時間表現「見ると」で示した。δέは直前の文脈からの展開を「ところが」で表した。
- source_word: ἀνακράξας
  choice: 叫び声を上げて
  rationale: 大きな声で突然叫ぶ動作を表す。後続の「大声で」と重なる表現だが、原文に二つの表現があるため統合せず保持した。
- source_word: προσέπεσεν αὐτῷ
  choice: その前に倒れ伏し
  rationale: 相手の前に身を投げ出す動作を表し、単なる転倒とも礼拝行為とも断定しない訳語を選んだ。
- source_word: φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 様態を表す与格を、簡潔で自然な現代日本語にした。
- source_word: Τί ἐμοὶ καὶ σοί
  choice: 私とあなたに何の関わりがあるのですか
  rationale: 拒絶や抗議を表すセム語的慣用句の意味を伝えつつ、原文の「私」と「あなた」の対置も保った。直訳に近い形は脚注に示した。
- source_word: Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: いと高き神の子イエス
  rationale: 呼格を自然な日本語の呼びかけとして再現し、「いと高き神」という称号を保持した。
- source_word: δέομαί σου
  choice: お願いします
  rationale: 切迫した懇願を、現代の読者に明瞭でありながら品位を損なわない表現にした。
- source_word: μή με βασανίσῃς
  choice: 私を苦しめないでください
  rationale: βασανίζωの激しい苦痛を与える意味を保ちつつ、肉体的な拷問だけに限定しない「苦しめる」を選んだ。
theological_decisions:
- issue: 悪霊によるイエスの身分の告白
  choice: いと高き神の子イエス
  alternative: いと高き方である神の子イエス
  rationale: τοῦ ὑψίστουを神にかかる称号として素直に訳し、発言者が認めるイエスの身分を弱めたり、後代の教理用語で拡張したりしなかった。
- issue: イエスの前に倒れる行為の性格
  choice: その前に倒れ伏し
  alternative: その前にひれ伏し
  rationale: προσπίπτωは服従や懇願を伴いうるが、この動作を礼拝と断定しないよう、「ひれ伏す」より身体動作に近い表現を採用した。
translation_notes:
  register: 明瞭な現代標準語を用い、物語の緊迫感と呼びかけの厳粛さを保った。「叫び声を上げて」と「大声で」の反復は原文の表現を尊重して残した。
