source:
  edition: SBLGNT
  text: καὶ γυναῖκές τινες αἳ ἦσαν τεθεραπευμέναι ἀπὸ πνευμάτων πονηρῶν καὶ ἀσθενειῶν, Μαρία ἡ καλουμένη Μαγδαληνή, ἀφ’ ἧς δαιμόνια ἑπτὰ ἐξεληλύθει,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/002.yaml
  text: 'and some women who had been healed from evil spirits and sicknesses: Mary[a], called Magdalene, from whom seven demons had gone out[b],'
translation:
  language: ja
  text: また、邪悪な霊や病気から癒やされていた何人かの女たち、すなわち、マグダラと呼ばれるマリア――彼女からは七つの悪霊が出て行っていた――、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυναῖκές τινες
  choice: 何人かの女たち
  rationale: τινεςが示す不特定の一部を、現代日本語で自然かつ明確に表す。
- source_word: τεθεραπευμέναι
  choice: 癒やされていた
  rationale: ἦσανとの迂言的な過去完了の意味を踏まえ、以前に癒やされ、その結果が続いていたことを表す。霊的苦しみと身体の病気の双方に用いることができる。
- source_word: ἀπὸ πνευμάτων πονηρῶν
  choice: 悪い霊
  rationale: πονηρόςを直接的に「悪い」と訳し、本文にない「汚れた」を持ち込まない。
- source_word: καὶ ἀσθενειῶν
  choice: や病気
  rationale: ここでのἀσθένειαは身体的な弱さや疾病を指し、「病気」が明瞭で自然である。
- source_word: ἡ καλουμένη Μαγδαληνή
  choice: マグダラと呼ばれる
  rationale: 受動分詞καλουμένηによる呼称を簡潔に保つ。「マグダラの」は解釈として自然だが、本文の「呼ばれる」を明示した。
- source_word: ἀφ’ ἧς
  choice: 彼女からは
  rationale: ἀπόの分離・起点の意味を日本語で自然に示す。
- source_word: δαιμόνια ἑπτὰ
  choice: 七つの悪霊
  rationale: δαιμόνιονを文脈上の人格的な霊的存在として訳す。日本語では「七人の悪霊」も可能だが、原文の中性複数に即して数量表現を「七つ」とした。
- source_word: ἐξεληλύθει
  choice: 出て行っていた
  rationale: ἐξέρχομαιの過去完了で、物語時点より前にすでに出ていたことを表す。
theological_decisions:
- issue: 悪霊による苦しみの表現
  choice: 「悪い霊」「悪霊」という人格的な霊的存在を示す表現を保持する。
  alternative: 心理的・身体的状態の比喩として言い換える。
  rationale: ギリシア語本文はπνεύματα πονηράおよびδαιμόνιαをἀσθένειαι（病気）と区別しているため、その区別を解消せずに訳す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、節が前後の文と連続する構文であるため末尾を読点とした。「また」「すなわち」で列挙と同格関係を示し、挿入句はダッシュで読みやすくした。
