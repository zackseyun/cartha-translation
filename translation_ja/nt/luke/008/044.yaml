source:
  edition: SBLGNT
  text: προσελθοῦσα ὄπισθεν ἥψατο τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ, καὶ παραχρῆμα ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/044.yaml
  text: Coming up behind him[a], she touched the fringe of his garment, and immediately her flow of blood stopped.
translation:
  language: ja
  text: 後ろから近づき、イエスの衣の房[a]に触れた。すると、たちまち出血が止まった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衣の縁」または「裾」とも訳せる。ここでいう「房」は、衣の端に付けた房飾りを指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθοῦσα ὄπισθεν
  choice: 後ろから近づき
  rationale: 分詞による主動作に先立つ動きを、自然な現代日本語で表した。ὄπισθενは文脈上イエスの後ろを指すが、直後に「イエス」と補っているため、ここでは「後ろから」とした。
- source_word: ἥψατο
  choice: 触れた
  rationale: この構文での通常の意味を採り、本文以上に強く「つかんだ」とはしなかった。
- source_word: τοῦ κρασπέδου
  choice: 房
  rationale: 衣の縁、裾、房飾りを意味し得る語であり、当時のユダヤ人の衣に付いた房を示す可能性を保つため「房」とした。ただし語義の幅は脚注で示した。
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: イエスの衣
  rationale: αὐτοῦの指示対象を日本語で明確にするため「イエス」と補い、ἱμάτιονは種類を過度に限定しない「衣」とした。
- source_word: παραχρῆμα
  choice: たちまち
  rationale: 即時性を明確に伝えつつ、物語文にふさわしい自然で品位ある表現とした。
- source_word: ἔστη ἡ ῥύσις τοῦ αἵματος αὐτῆς
  choice: 出血が止まった
  rationale: ギリシア語の「彼女の血の流れが止まった」を、意味を損なわず自然な現代日本語にした。
theological_decisions:
- issue: κράσπεδονに含まれ得るユダヤ人の衣服・律法上の房飾りの含意
  choice: 本文では「房」と訳す
  alternative: 「衣の縁」「裾」
  rationale: 特定の律法的象徴を明示的に説明しすぎることは避けつつ、単なる裾とも房飾りとも解し得る原語の緊張を脚注によって保った。
translation_notes:
  register: 明瞭な現代標準日本語。主語の反復を避けながら、指示対象が曖昧にならないよう「イエス」を補った。「すると」で即時の結果を自然につないだ。
