  verdict: approve
  source_fidelity: SBLGNT本文の複数形 αὐτοῖς を「彼らに」と訳し、単数形を読む写本は適切に脚注で示している。γυνή は「クーザの妻」、ἐπίτροπος は文脈に即して「ヘロデの管理人」、ἕτεραι πολλαί は女性を明示した「そのほか多くの女たち」とされている。διηκόνουν の継続的で広い奉仕と、ἐκ τῶν ὑπαρχόντων αὐταῖς の自己所有の資産を用いる含意も保持されている。
  naturalness: 「また、…女たちがいて、…仕えていた」は、前節から続く女性たちの列挙を自然な現代日本語の一文として表している。「自分たちの財産を用いて彼らに仕えていた」も明瞭で、過度に解釈を加えていない。
  terminology: 「管理人」はἐπίτροποςの実務・財産管理上の役割を平明に表し、教会職を想起させうる語を避けている。「仕えていた」はδιακονέωを特定の職制や金銭援助だけに狭めず、続く「財産を用いて」によって支援の具体性も示す。人名表記と脚注の用語も一貫している。
