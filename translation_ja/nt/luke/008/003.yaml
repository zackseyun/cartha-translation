id: LUK.8.3
reference: Luke 8:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ Ἰωάννα γυνὴ Χουζᾶ ἐπιτρόπου Ἡρῴδου καὶ Σουσάννα καὶ ἕτεραι πολλαί, αἵτινες διηκόνουν αὐτοῖς ⸀ἐκ τῶν ὑπαρχόντων αὐταῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/003.yaml
  text: and Joanna[a], the wife of Chuza, Herod’s steward, and Susanna, and many others[b], who were serving them out of their possessions.
translation:
  language: ja
  text: また、ヘロデの管理人クーザの妻ヨハンナ、スサンナ、そのほか多くの女たちがいて、自分たちの財産[b]を用いて彼ら[a]に仕えていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「彼に」とする。
    reason: textual_variant
  - marker: b
    text: 別訳「自分たちの持ち物から」、または「自分たちの資力によって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνὴ Χουζᾶ
  choice: クーザの妻
  rationale: 人名の属格を伴う γυνή は、ここではクーザとの婚姻関係を示す「妻」と解するのが最も自然である。
- source_word: ἐπιτρόπου Ἡρῴδου
  choice: ヘロデの管理人
  rationale: ἐπίτροπος は財産や諸事務を任された者を指す。「管理人」は宮廷または領地の実務を担う役割を明瞭に表し、「執事」が現代日本語で帯びうる教会職・家事使用人の連想を避ける。
- source_word: ἕτεραι πολλαί
  choice: そのほか多くの女たち
  rationale: 女性複数形であり、直前に名を挙げられた女性たちと同類の多数の女性を明示する。
- source_word: διηκόνουν
  choice: 仕えていた
  rationale: διακονέω の広い意味である奉仕・世話を保ち、後代の教会職制を示す専門語には限定しない。未完了時制の継続的な働きは「〜ていた」で表す。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: SBLGNT本文の複数形に従い、イエスと同行者たちを指す表現として訳す。
- source_word: ἐκ τῶν ὑπαρχόντων αὐταῖς
  choice: 自分たちの財産を用いて
  rationale: 彼女たちに属する資産・持ち物から奉仕のための必要を賄ったことを、自然な現代日本語で表す。所有主体が女性たち自身である点も保持する。
theological_decisions:
- issue: αὐτοῖς の数と指示対象
  choice: 複数の「彼らに」—イエスと同行者たちに仕えた
  alternative: 単数の「彼に」—イエスに仕えた
  rationale: 提示されたSBLGNT本文は複数形 αὐτοῖς を読むため、本文ではその数を保持した。単数形を読む写本の存在は脚注に示し、本文で調和させない。
- issue: 女性たちの奉仕の性格
  choice: 広義の「仕えていた」とし、財産を用いたことを明示する
  alternative: 教会職的な「奉仕者であった」、または金銭援助だけを意味する「扶養していた」
  rationale: διακονέω 自体は広い奉仕を表し、続く句が自己の資産による支援を示す。奉仕を特定の教会職にも金銭援助だけにも限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準語。前節から続く列挙であることを「また」で示し、日本語として文を成立させるため「女たちがいて」とした。脚注記号は、それぞれ対応する本文語句の直後に配置した。
