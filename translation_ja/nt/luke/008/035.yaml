id: LUK.8.35
reference: Luke 8:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξῆλθον δὲ ἰδεῖν τὸ γεγονὸς καὶ ἦλθον πρὸς τὸν Ἰησοῦν, καὶ εὗρον καθήμενον τὸν ἄνθρωπον ἀφ’ οὗ τὰ δαιμόνια ⸀ἐξῆλθεν ἱματισμένον καὶ σωφρονοῦντα παρὰ τοὺς πόδας τοῦ Ἰησοῦ, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/035.yaml
  text: Then they went out to see what had happened[a], and they came to Jesus and found the man from whom the demons had gone out sitting, clothed, and in his right mind at Jesus's feet[b], and they were afraid.
translation:
  language: ja
  text: そこで人々は、起こったことを見ようと出て行き、イエスのところに来た。そして、悪霊たちが出て行った[b]その人が、服を着て正気で[a]イエスの足もとに座っているのを見つけ、恐れを抱いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「健全な心で」または「分別を保って」。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、動詞が複数形（「悪霊たちが出て行った」）になっている。この底本では、複数の主語に対して動詞は単数形だが、意味は変わらない。
    reason: textual_variant
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 人々は…出て行き
  rationale: 主語は文脈から補い、町や周辺から出来事を確かめに向かう移動を、自然な日本語で表した。
- source_word: ἰδεῖν τὸ γεγονός
  choice: 起こったことを見ようと
  rationale: 目的を表す不定詞と、完了分詞の名詞的用法を簡潔に反映した。
- source_word: εὗρον
  choice: …のを見つけ
  rationale: 物語上、その人の変化した姿を目の当たりにしたことを表す。
- source_word: ἀφ’ οὗ τὰ δαιμόνια ἐξῆλθεν
  choice: 悪霊どもが出て行ったその人
  rationale: 関係節が、以前悪霊に取りつかれていた人を特定していることを保った。日本語では複数の悪霊を「悪霊ども」とした。
- source_word: ἱματισμένον
  choice: 服を着て
  rationale: 直前まで裸でいた状態との対照が明瞭になる、平明で自然な表現。
- source_word: σωφρονοῦντα
  choice: 正気に返り
  rationale: 健全な思考、自制、正常な精神状態への回復を、現代日本語で自然に伝える。
- source_word: παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: イエスの足もとに
  rationale: イエスのそば、その足もとに位置していたことを過度な解釈なしに表す。
- source_word: ἐφοβήθησαν
  choice: 恐ろしくなった
  rationale: 人々が恐れを抱いたという受動的な心の動きを自然な日本語で表した。
theological_decisions:
- issue: δαιμόνια の表現
  choice: 悪霊ども
  alternative: 悪い霊ども／悪鬼ども
  rationale: 人格的・超自然的な存在が追い出されたという物語の意味を保ち、単なる病気や比喩へ還元しないため。
- issue: σωφρονοῦντα が示す回復
  choice: 正気に返り
  alternative: 健全な心で／分別を取り戻して
  rationale: 悪霊から解放された後の精神的な健全さと自制の回復を示しつつ、現代の臨床用語を持ち込まないため。
- issue: イエスの足もとに座る姿勢
  choice: イエスの足もとに座っている
  alternative: イエスの足のそばに座っている
  rationale: 原文の位置関係を保つ。「弟子としての姿勢」という含意はあり得るが、本文では明示的に説明せず、読者に開いたままとする。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「服を着て」「正気に返り」など一般読者に理解しやすい語を用い、原文の連続した情景描写を自然な日本語の二文に整えた。脚注記号は、それぞれ該当する語句の直後に置いた。
