  naturalness: 全体として明瞭な現代日本語である。ただし「恐ろしくなった」は恐怖の感情を表すにはやや口語的で原因に反応して驚いたようにも響くため、「恐れを抱いた」が叙述として自然で原文のἐφοβήθησανに近い。
  terminology: 「悪霊」はδαιμόνιαの適切な訳語である。「悪霊ども」は不必要に軽蔑的・やや古風な響きがあるので、標準的な「悪霊たち」を用いる。「足もと」はπαρὰ τοὺς πόδαςの位置関係を自然に表している。
