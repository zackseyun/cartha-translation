revisions:
- from: そこで人々は、起こったことを見ようと出て行き、イエスのところに来た。そして、悪霊どもが出て行った[b]その人が、服を着て正気に返り[a]、イエスの足もとに座っているのを見つけ、恐ろしくなった。
  to: そこで人々は、起こったことを見ようと出て行き、イエスのところに来た。そして、悪霊たちが出て行った[b]その人が、服を着て正気で[a]イエスの足もとに座っているのを見つけ、恐れを抱いた。
  rationale: 原文の描写的な現在分詞σωφρονοῦνταを「正気で」として状態描写を保ち、恐れを表す動詞をより明確にした。「悪霊たち」は現代標準語として自然であり、δαιμόνιαの複数性も保つ。脚注記号は、それぞれ正気の状態と動詞形の異読に対応する語句の直後に維持した。
