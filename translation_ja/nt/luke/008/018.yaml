id: LUK.8.18
reference: Luke 8:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βλέπετε οὖν πῶς ἀκούετε· ὃς ⸂ἂν γὰρ⸃ ἔχῃ, δοθήσεται αὐτῷ, καὶ ὃς ⸀ἂν μὴ ἔχῃ, καὶ ὃ δοκεῖ ἔχειν ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/018.yaml
  text: Therefore[a], pay attention to how you listen. For whoever has, more will be given to him, and whoever does not have, even what he thinks he has will be taken away from him.
translation:
  language: ja
  text: だから、どのように聞くかに注意しなさい。持っている人には与えられ、持っていない人からは、自分が持っていると思っているもの[a]まで取り上げられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「持っているように見えるものまで取り上げられる」。
    reason: δοκεῖは、本人が「思っている」とも、外から「そのように見える」とも訳し得るため。
lexical_decisions:
- source_word: βλέπετε
  choice: 注意しなさい
  rationale: 視覚的な「見る」ではなく、聞き方を慎重に顧みるよう促す命令なので、現代日本語で警告の力を自然に表した。
- source_word: οὖν
  choice: だから
  rationale: 直前の、聞くことと受け止め方についての教えから導かれる結論であることを、明瞭で自然な接続語で示した。
- source_word: πῶς ἀκούετε
  choice: どのように聞くか
  rationale: πῶςが聞く行為の有無ではなく、そのあり方を問うことを保った。「聞く」は文脈上、耳に入れるだけでなく応答的に受け止める含みを持つ。
- source_word: ὃς ἂν ... ἔχῃ
  choice: 持っている人
  rationale: ἄνを伴う接続法の不定的・一般的な条件を、性別を限定しない自然な日本語で表した。
- source_word: δοθήσεται αὐτῷ
  choice: その人には与えられ
  rationale: ギリシア語には与えられる物を示す明示的な目的語がないため、日本語でも「さらに」や「もっと」を補わず、省略と文脈上の含みを保った。
- source_word: ὃς ἂν μὴ ἔχῃ
  choice: 持っていない人
  rationale: 前半との対照と、一般的な格言の形を自然に保った。
- source_word: ὃ δοκεῖ ἔχειν
  choice: 自分では持っていると思っているもの
  rationale: δοκέωを本人の認識を表す「思う」と理解し、実際の所有とのずれを明瞭にした。一方、「持っているように見えるもの」という語義上可能な表現は脚注に残した。
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: 取り上げられます
  rationale: 受動形による除去・剝奪を、自然で簡潔な日本語で表した。
theological_decisions:
- issue: 「持っている／持っていない」という格言的表現の解釈範囲
  choice: 具体的に何を持つのかを訳文で補わず、聞く姿勢についての直前の文脈との結び付きを保った。
  alternative: 霊的理解、信仰、賜物、管理責任など、特定の対象を明示する。
  rationale: 本文自体は目的語を示しておらず、受容性に関する逆説的な緊張を残している。予定、功績、物質的繁栄などの特定教理へ訳文で限定しない。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの教えとしての品位を保ちながら、過度に文語的な「者」「汝ら」は避けた。前半の命令には直接的な「注意しなさい」を用い、後半は一般原則として丁寧体でまとめた。
