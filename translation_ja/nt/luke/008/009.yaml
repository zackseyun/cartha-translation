lexical_decisions:
- source_word: Ἐπηρώτων
  choice: 尋ねた
  rationale: 未完了過去形は継続的・反復的な問いかけを示し得るが、この文脈では自然な現代日本語として単純過去で表した。
- source_word: δὲ
  choice: すると
  rationale: 弱い接続を示し、直前のたとえを受けた物語の進行を、強い対比を持ち込まず自然に表す。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちはイエスに
  rationale: 「彼の弟子たち」を自然に表しつつ、目的語の「彼」を固有名で明確化した。
- source_word: τίς αὕτη εἴη ἡ παραβολή
  choice: このたとえはどのような意味なのか
  rationale: 直訳的には「このたとえは何であるのか」であり、過去時制に続く間接疑問の希求法 εἴη を含む。文脈上、たとえの意味を問う発言なので、その趣旨を明瞭な日本語で表した。
- source_word: παραβολή
  choice: たとえ
  rationale: 福音書における標準的で広く理解される訳語であり、比較を用いた教えという文脈上の意味を保つ。
