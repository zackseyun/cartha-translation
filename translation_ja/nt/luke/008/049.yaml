  timestamp: '2026-07-17T05:32:28Z'
review_pass:
  verdict: revise
  source_fidelity: 概ね原文に忠実です。属格独立構文の同時性、「まだ」、不定の「ある人」、会堂の責任者から来たこと、死亡の完了形、ならびに「もはや…するな」という命令は適切に捉えられています。ただし、「もう先生を煩わせることはありません」は日本語として『煩わせる必要はない』という叙述にも読め、原文の直接的な禁止・制止が弱まります。
  naturalness: 「会堂司」は聖書用語として通じますが、明瞭な現代標準語という対象にはやや専門的・古風です。「会堂の責任者」が平明です。「お嬢さん」は日本語で相手の娘への敬称としてあり得るものの、原文の単純な「あなたの娘」を必要以上に丁重にします。「娘さん」が自然で忠実です。
  terminology: ἀρχισυνάγωγοςは制度上の役職として「会堂の責任者」とし、διδάσκαλοςは文脈上自然な「先生」とします。τέθνηκενは「亡くなりました」で死去とその結果を自然に表せます。
  issues:
  - severity: medium
    issue: 禁止命令の力が弱い
    rationale: μηκέτι σκύλλεは「もはや先生を煩わせるな」という直接の制止です。「煩わせることはありません」は必要性の否定にもなり得るため、「煩わせないでください」として制止を明示するのが安全です。
  - severity: low
    issue: 「お嬢さん」が原文より敬称的
    rationale: ἡ θυγάτηρ σουは単に「あなたの娘」です。話し相手への自然な配慮は「娘さん」で十分であり、「お嬢さん」は追加的な社会的敬称を帯びます。
  - severity: low
    issue: 役職名がやや専門的・古風
    rationale: 「会堂司」は伝統的な聖書語ですが、明瞭な現代標準語の方針には「会堂の責任者」の方が適します。
  revised_text: イエスがまだ話しておられると、会堂の責任者のもとから一人が来て言った。「娘さんは亡くなりました。もう先生を煩わせないでください。」
  revised_footnotes: []
