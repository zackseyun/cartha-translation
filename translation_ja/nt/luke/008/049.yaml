  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχεταί τις παρὰ τοῦ ἀρχισυναγώγου ⸀λέγων ὅτι Τέθνηκεν ἡ θυγάτηρ σου, ⸀μηκέτι σκύλλε τὸν διδάσκαλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/049.yaml
  text: While he was still speaking[a], someone came from the synagogue leader, saying, “Your daughter has died[b]; do not trouble the teacher any longer.”
translation:
  language: ja
  text: イエスがまだ話しておられると、会堂の責任者のもとから一人が来て言った。「娘さんは亡くなりました。もう先生を煩わせないでください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: イエスがまだ話しておられると
  rationale: 属格独立構文の同時性とἔτιの「まだ」を自然な現代日本語で表した。文脈上の指示対象を「イエス」と明示した。
- source_word: ἔρχεταί τις
  choice: 人が来て
  rationale: 歴史的現在を日本語の物語に自然な過去の出来事として訳し、τιςの不定性は特定しない「人」で表した。
- source_word: παρὰ τοῦ ἀρχισυναγώγου
  choice: 会堂司のもとから
  rationale: παρά＋属格の起点・出所を「もとから」で表し、ἀρχισυνάγωγοςは当時の会堂の責任者を表す簡潔な役職名「会堂司」とした。
- source_word: Τέθνηκεν ἡ θυγάτηρ σου
  choice: お嬢さんは亡くなりました
  rationale: 完了形が示す死亡という出来事とその結果状態を、知らせとして自然な敬意を伴う日本語で表した。
- source_word: μηκέτι σκύλλε
  choice: もう…煩わせることはありません
  rationale: μηκέτιの「もはや～するな」とσκύλλωの「悩ませる、煩わせる」を表現した。否定命令を、日本語で相手への配慮を帯びた自然な制止として訳した。
- source_word: τὸν διδάσκαλον
  choice: 先生
  rationale: διδάσκαλοςの通常の意味を、呼称として自然な現代日本語「先生」で表し、過度に高めた称号を避けた。
theological_decisions:
- issue: ἀρχισυνάγωγοςの役職名
  choice: 会堂司
  alternative: 会堂の責任者
  rationale: 神学的称号ではなく制度上の役職であるため、聖書日本語として簡潔で、指導的役割を示す「会堂司」を採用した。
- issue: διδάσκαλοςの訳語
  choice: 先生
  alternative: 教師
  rationale: この箇所では通常の「教える者」という称号であり、会話中の指示として自然な「先生」とした。本文に明示されないキリスト論的含意を付加しない。
- issue: 死の知らせに対する完了形の扱い
  choice: 亡くなりました
  alternative: 死んでしまいました
  rationale: τέθνηκενの結果状態を含む完了の力を保ちつつ、「しまいました」が加え得る話者の感情的評価を本文以上に強めないようにした。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。語り手の文では敬体を避け、知らせの直接話法ではヤイロへの配慮が感じられる自然な敬語を用いた。
