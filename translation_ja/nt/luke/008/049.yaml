revisions:
- from: イエスがまだ話しておられると、会堂司のもとから人が来て言った。「お嬢さんは亡くなりました。もう先生を煩わせることはありません。」
  to: イエスがまだ話しておられると、会堂の責任者のもとから一人が来て言った。「娘さんは亡くなりました。もう先生を煩わせないでください。」
  rationale: 原文の意味を変えず、現代日本語としての明瞭さを高めた。「娘さん」により原文の単純な所有表現を保ち、「煩わせないでください」によりμηκέτι σκύλλεの制止を明確にした。「会堂の責任者」はἀρχισυνάγωγοςの制度的役割を平明に示す。本文に脚注を必要とする曖昧さや本文異読上の問題はない。
