id: LUK.8.12
reference: Luke 8:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ παρὰ τὴν ὁδόν εἰσιν οἱ ⸀ἀκούσαντες, εἶτα ἔρχεται ὁ διάβολος καὶ αἴρει τὸν λόγον ἀπὸ τῆς καρδίας αὐτῶν, ἵνα μὴ πιστεύσαντες σωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/012.yaml
  text: And those beside the road are the ones who have heard[a]; then the devil comes and takes away the word from their hearts[b], so that they may not believe and be saved.
translation:
  language: ja
  text: 道端にいる人たちとは、聞いた人たちのことである。それから悪魔が来て、彼らの心からことばを取り去る。彼らが信じて救われないようにするためである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ τὴν ὁδόν
  choice: 道端に落ちたもの
  rationale: 直訳的な空間表現「道のそばのもの」では日本語として指示対象が曖昧になるため、たとえの種を補って自然に表現した。παρά＋対格が示す道路沿いの位置関係は「道端」で保った。
- source_word: ἀκούσαντες
  choice: 聞いた人たち
  rationale: アオリスト分詞を、先にみことばを聞いた人々を指す自然な日本語として訳した。
- source_word: εἶτα
  choice: ところが、その後
  rationale: 後続する出来事の順序を「その後」で示しつつ、聞くことと悪魔の介入との対照的な展開を「ところが」で自然に表した。
- source_word: ὁ διάβολος
  choice: 悪魔
  rationale: この文脈では人格的な悪の存在を指すため、現代日本語で定着した「悪魔」とした。
- source_word: αἴρει
  choice: 取り去ってしまう
  rationale: 心からことばを除き去る意味を表し、継続的な現在形は日本語の説明文に適した形で訳した。「しまう」は行為の完遂と重大な結果を自然に示すが、暴力的な仕方までは付加しない。
- source_word: τὸν λόγον
  choice: みことば
  rationale: たとえの文脈では神から告げられたことばを指す。「みことば」は日本語の聖書文体でこの意味を簡潔に伝え、単なる一般的な単語や発言との混同を避ける。
- source_word: ἀπὸ τῆς καρδίας αὐτῶν
  choice: 彼らの心から
  rationale: καρδίαを思考・意志・応答の中心としての「心」で保った。ギリシア語では「彼ら」の複数に対して「心」は単数形だが、日本語でも分配的に自然な単数表現となる。
- source_word: ἵνα μὴ πιστεύσαντες σωθῶσιν
  choice: 彼らが信じて救われることのないようにするため
  rationale: ἵνα μήが悪魔の行為の目的を表すことを明示し、πιστεύσαντεςとσωθῶσινの関係は「信じて救われる」として、原文の流れを保ちながら教派的な因果説明を加えなかった。
- source_word: πιστεύσαντες
  choice: 信じて
  rationale: πιστεύωの基本的な意味を直接表し、「信用する」や「知的に同意する」などに狭めなかった。
- source_word: σωθῶσιν
  choice: 救われる
  rationale: ルカの文脈における救済の意味を、定着した神学的かつ平明な日本語で表した。受動態も保っている。
theological_decisions:
- issue: 信じることと救いとの関係
  choice: 「信じて救われる」と訳し、両者の結び付きをそのまま示した。
  alternative: 信仰の性質、救いの因果順序、召命や堅忍について説明的な表現を加える。
  rationale: 原文は、悪魔がみことばを取り去る目的を、人々が信じて救われるのを妨げることとして述べる。翻訳ではこの関係を保持し、それ以上の教派的体系化を行わない。
- issue: ἵνα μήの目的・結果の幅
  choice: 「ことのないようにするため」とし、悪魔の意図・目的を前面に出した。
  alternative: 「その結果、信じず、救われない」と結果だけを強調する。
  rationale: 人格的主語である悪魔の行為に続くἵνα μήは目的を自然に表し得る。ただし、この訳は目的節が結果を伴う含みを排除するものではない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、口語的すぎず説教調にも偏らない、平明で品位ある説明文とした。「みことば」は日本語聖書で定着した語だが、表記は読者に親しみやすい平仮名を採用した。節内の論理を読み取りやすくするため三文に分けた。
