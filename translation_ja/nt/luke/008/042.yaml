  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι θυγάτηρ μονογενὴς ἦν αὐτῷ ὡς ἐτῶν δώδεκα καὶ αὐτὴ ἀπέθνῃσκεν. Ἐν δὲ τῷ ὑπάγειν αὐτὸν οἱ ὄχλοι συνέπνιγον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/042.yaml
  text: because he had an only daughter[a], about twelve years old, and she was dying. And as he went[c][b], the crowds were pressing in on him.
translation:
  language: ja
  text: というのも、彼には十二歳ほど[b]になる一人娘[a]がいて、その娘が死にかけていたからである。イエスが向かって行く途中、群衆が彼に押し迫り、彼は押しつぶされそうになっていた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ただ一人の娘」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「十二年ほど」。年齢を表す言い方。
    reason: lexical_alternative
  - marker: c
    text: このギリシア語動詞には、群衆が窒息させるほど激しく押し迫る語感がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μονογενὴς
  choice: 一人娘
  rationale: θυγάτηρを修飾し、唯一の娘、すなわちほかに娘がいないことを表す。誕生の仕方に焦点を当てる語ではなく、日本語では「一人娘」が自然である。
- source_word: ὡς ἐτῶν δώδεκα
  choice: 十二歳ほどになる
  rationale: ὡςが数のおおよそを示すため、「ほど」で年齢が概数であることを保った。
- source_word: ἀπέθνῃσκεν
  choice: 死にかけていた
  rationale: 未完了過去が表す進行中の危篤状態を、完了した死と区別して自然に示す。
- source_word: Ἐν δὲ τῷ ὑπάγειν αὐτὸν
  choice: イエスが向かって行く途中
  rationale: ἐν＋冠詞付き不定詞が示す同時進行を「途中」で表現した。文脈上の指示対象を明確にするため、αὐτόνは「イエス」とした。目的地は本文中に補わず、文脈に委ねた。
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語の「群衆」は数を明示せず集合的に表せるため、自然さを優先した。
- source_word: συνέπνιγον
  choice: 押しつぶさんばかりに取り囲んでいた
  rationale: 周囲から激しく押し迫り、窒息・圧迫させるほどの語感と、未完了過去の継続性を保った。
- source_word: ὅτι
  choice: というのも……からである
  rationale: 前節の願いが切迫していた理由を説明する因果関係を、日本語で明確に示した。
- source_word: αὐτῷ
  choice: 彼には……がいて
  rationale: 存在動詞と与格による所有表現を、自然な日本語の所有・関係表現にした。
