base_translation:
  language: en
  yaml_path: translation/nt/luke/008/006.yaml
  text: And another fell on the rock[a], and after it sprang up, it withered because it had no moisture.
translation:
  language: ja
  text: また、別の種は岩の上に落ち[a]、芽を出した後、水分がなかったため枯れてしまった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その岩の上に」。ギリシア語は単数形の「岩」であり、広い意味の「岩地」ではなく、種が岩の表面に落ちる具体的な情景を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτερον
  choice: 別の種
  rationale: 中性単数が名詞的に用いられており、文脈上「別の種」を指す。日本語では対象を補うことで自然かつ明確になる。
- source_word: κατέπεσεν
  choice: 落ち
  rationale: 種が落下したことを簡潔に表す。接続形にして後続の出来事へ自然につなげた。
- source_word: ἐπὶ τὴν πέτραν
  choice: 岩の上に
  rationale: πέτρα の単数形と具体的な岩のイメージを保ち、「岩地」のような広い表現にはしない。
- source_word: φυὲν
  choice: 芽を出したものの
  rationale: 種が発芽した後に枯れたという時間的推移を示しつつ、後続の逆接的な結果を自然な日本語で表した。
- source_word: ἐξηράνθη
  choice: 枯れてしまった
  rationale: 植物について自然な日本語であり、乾燥によって枯れた結果を表す。
- source_word: διὰ τὸ μὴ ἔχειν
  choice: なかったため
  rationale: διά と冠詞付き不定詞が示す原因を明確に表す。
- source_word: ἰκμάδα
  choice: 水分
  rationale: 生育に必要な moisture を、現代日本語で明快かつ文脈に即して表す。
