  text: ἐλθὼν δὲ εἰς τὴν οἰκίαν οὐκ ἀφῆκεν εἰσελθεῖν ⸂τινα σὺν αὐτῷ⸃ εἰ μὴ Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον καὶ τὸν πατέρα τῆς παιδὸς καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/051.yaml
  text: When he came into the house[a], he did not allow anyone to enter with him except Peter and John and James, and the girl's father and mother.
translation:
  language: ja
  text: イエスはその家に入ると、ペトロ、ヨハネ、ヤコブ、少女の父と母以外には、だれもご自分と一緒に入ることをお許しにならなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν δὲ εἰς τὴν οἰκίαν
  choice: イエスがその家に着くと
  rationale: アオリスト分詞の時間的な流れを自然な現代日本語の「着くと」で表した。日本語では主語を補うことで場面転換を明確にし、οἰκίαは文脈上特定された「その家」とした。
- source_word: οὐκ ἀφῆκεν εἰσελθεῖν
  choice: 中へ入ることをお許しにならなかった
  rationale: ἀφίημιの許可の意味を保持した。イエスを主語とする物語として自然で品位ある敬語を用い、εἰσελθεῖνは日本語で自然な「中へ入る」とした。
- source_word: τινα σὺν αὐτῷ
  choice: だれも一緒に
  rationale: 否定文中の不定代名詞τιναの一般的な意味を「だれも」で表し、σὺν αὐτῷはイエスと共に入ることを示す「一緒に」とした。
- source_word: εἰ μὴ
  choice: ほかは
  rationale: 否定に続く除外表現として、自然な日本語の「〜のほかは」を採用した。
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: ペトロ、ヨハネ、ヤコブ
  rationale: 固有名詞は日本語聖書で広く通用する形を用い、反復されるκαίは日本語として読みやすい読点列挙にした。
- source_word: τῆς παιδὸς
  choice: 少女の
  rationale: παῖς自体は広く「子ども」を意味し得るが、直前の文脈で十二歳ほどの娘と明示されているため、「少女」が自然で具体的である。
- source_word: τὸν πατέρα ... καὶ τὴν μητέρα
  choice: 父と母
  rationale: 二人を個別に挙げる原文を保ち、「両親」と一語にまとめなかった。
theological_decisions:
- issue: παῖςの性別と年齢の具体化
  choice: 少女の父と母
  alternative: 子どもの父と母
  rationale: 語そのものの意味範囲は広いが、文脈はヤイロの娘であり、年齢も約十二歳と示す。「少女」は性別と文脈を自然に反映しつつ、神学的含意を付加しない。
translation_notes:
  register: 明瞭な現代標準日本語。物語文として簡潔にしつつ、イエスの行為には穏当な尊敬表現を用いた。原文の除外構文と同行の意味関係を保持した。
