  text: καὶ κατεγέλων αὐτοῦ, εἰδότες ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/053.yaml
  text: And they were laughing at him, because they knew that she had died.
translation:
  language: ja
  text: 人々は、彼女が死んだことを知っていたので、イエスをあざ笑っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεγέλων
  choice: あざ笑った
  rationale: καταγελάωの嘲笑的な意味を自然な現代日本語で表す。ギリシア語の未完了過去は継続的な様相を持つが、日本語では文脈上、単純過去でもその場での反応として自然に理解できる。
- source_word: αὐτοῦ
  choice: イエスを
  rationale: 代名詞の指示対象は文脈上イエスであり、日本語では固有名を補うことで対象を明瞭にした。
- source_word: εἰδότες
  choice: 知っていたので
  rationale: 完了分詞は既得の認識を表し、ここでは嘲笑した理由として機能するため、「知っていたので」と訳した。
- source_word: ὅτι
  choice: ことを
  rationale: 知っていた内容を導く接続詞なので、日本語では名詞化する「ことを」で自然に表した。
- source_word: ἀπέθανεν
  choice: 死んだ
  rationale: アオリストが述べる死という完了した出来事を簡潔に表した。「死んでいた」では状態に重点が移るため避けた。
theological_decisions:
- issue: 三人称単数の主語を日本語で明示するか
  choice: 彼女が死んだ
  alternative: その子が死んだ／死んでいる
  rationale: ギリシア語では主語となる名詞は明示されないが、周囲の文脈から少女を指すことは明白である。「彼女」は原文の簡潔さを保ちつつ、日本語で理解しやすい。
- issue: 嘲笑の対象であるαὐτοῦの指示対象を明示するか
  choice: イエスを
  alternative: 彼を
  rationale: 日本語の単独節では「彼」よりも「イエス」のほうが指示対象を明確にでき、意味の追加ではなく文脈上明白な代名詞の展開に当たる。
translation_notes:
  register: 明快で自然な現代標準日本語。簡潔さと品位を保ち、嘲笑の強さと理由を明確に伝える。
