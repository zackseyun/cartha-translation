  text: καὶ ἕτερον ἔπεσεν ἐν μέσῳ τῶν ἀκανθῶν, καὶ συμφυεῖσαι αἱ ἄκανθαι ἀπέπνιξαν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/007.yaml
  text: And other seed fell among the thorns[b][a], and the thorns grew up with it and choked it.
translation:
  language: ja
  text: また、別の種は茨のただ中に落ちた。茨も一緒に生え育って、その種を押しふさいだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: 別の種
  rationale: 中性単数の形容詞が名詞的に用いられ、前後の文脈から「種」を指すため、日本語では指示対象を明示した。
- source_word: ἔπεσεν
  choice: 落ちた
  rationale: 単純な物語上の動作を自然な日本語で表した。
- source_word: ἐν μέσῳ τῶν ἀκανθῶν
  choice: 茨のただ中に
  rationale: 空間的な意味を明確に保ち、「茨の間に」より原文の μέσῳ を直接反映した。
- source_word: ἀκανθῶν / αἱ ἄκανθαι
  choice: 茨
  rationale: とげのある植物を指す語として、たとえの伝統的な農耕イメージを保つ簡潔な表現を選んだ。
- source_word: συμφυεῖσαι
  choice: 一緒に伸びて
  rationale: 種から生じた植物と茨が並行して成長したことを、自然で明瞭な日本語で表した。
- source_word: ἀπέπνιξαν
  choice: ふさいでしまった
  rationale: 植物が周囲から圧迫して成長を妨げる農耕上の比喩を表す。日本語の「窒息させた」より自然で、結果を示すアオリストの力も「しまった」で伝えた。
- source_word: αὐτό
  choice: その種
  rationale: 文法上は代名詞だが、日本語で「それ」とすると指示対象がやや曖昧になるため、文脈上の対象を明示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に通じる、簡潔で格調を損なわない物語文とした。「ただ中」は原文の空間表現を保ち、「ふさいでしまった」は農耕の情景として自然な表現を優先した。
