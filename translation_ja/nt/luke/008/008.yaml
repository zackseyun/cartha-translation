id: LUK.8.8
reference: Luke 8:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἕτερον ἔπεσεν εἰς τὴν γῆν τὴν ἀγαθήν, καὶ φυὲν ἐποίησεν καρπὸν ἑκατονταπλασίονα. ταῦτα λέγων ἐφώνει· Ὁ ἔχων ὦτα ἀκούειν ἀκουέτω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/008.yaml
  text: And another fell into the good soil[a], and when it grew, it produced fruit a hundredfold. As he said these things, he called out, “He who has ears to hear[c][b], let him hear.”
translation:
  language: ja
  text: また、別の種は良い土に落ち、育って、百倍の実を結んだ。イエスはこう語りながら、声を張り上げて言われた。「聞く耳のある者は、聞きなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερον
  choice: 別の種
  rationale: 中性単数は、たとえの文脈で先に述べられた種とは別の一粒を指す。日本語では指示対象を補って「別の種」とするのが明瞭である。
- source_word: γῆν τὴν ἀγαθήν
  choice: 良い土
  rationale: 農耕の文脈におけるγῆを、現代日本語で自然かつ具体的な「土」と訳した。
- source_word: φυὲν
  choice: 育つと
  rationale: φύωのアオリスト分詞が示す、成長してから結実する流れを、簡潔で自然な日本語で表した。
- source_word: ἐποίησεν καρπὸν ἑκατονταπλασίονα
  choice: 百倍の実を結んだ
  rationale: 直訳的な「実を作った」を避け、農作物の結実と豊かな収穫量を自然に伝える。「百倍」は元の倍率表現を保持する。
- source_word: ταῦτα λέγων
  choice: こう語りながら
  rationale: 現在分詞が主動詞ἐφώνειと同時進行であることを保った。
- source_word: ἐφώνει
  choice: 声を張り上げて言われた
  rationale: 公に強く呼びかけるφωνέωの語感を示しつつ、「叫んだ」ほど荒々しい響きにはしない。
- source_word: Ὁ ἔχων ὦτα ἀκούειν
  choice: 聞く耳のある者
  rationale: 聴覚器官の有無ではなく、注意深く受け止める能力と姿勢を求める慣用的な呼びかけを、性別を限定せず簡潔に表す。
- source_word: ἀκουέτω
  choice: 聞きなさい
  rationale: 三人称現在命令の厳粛な勧告を、日本語の自然な命令表現で示した。
theological_decisions:
- issue: イエスの結びの呼びかけにおける代表的・包括的表現
  choice: 「聞く耳のある者は、聞きなさい」
  alternative: 「聞く耳のある人は聞け」
  rationale: ギリシア語の単数・冠詞付き分詞は特定の男性ではなく、該当するすべての者を代表的に指す。「者」によって一般性と格調を保ち、「聞きなさい」で命令の力を明確にした。
- issue: 「聞く」の反復が持つ意味
  choice: 原文どおり「聞く耳」と「聞きなさい」を保持
  alternative: 「耳のある者は、よく心に留めなさい」
  rationale: 原文のἀκούειν／ἀκουέτωの反復と、身体的に聞くことと受け入れて従うことの緊張を、説明的に解消せず残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえ話としての簡潔さと、結びの呼びかけの厳粛さを両立させた。「聞く耳のある者」は聖書的な格調を保ちながら現代の一般読者にも理解可能である。
