id: LUK.8.10
reference: Luke 8:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὑμῖν δέδοται γνῶναι τὰ μυστήρια τῆς βασιλείας τοῦ θεοῦ, τοῖς δὲ λοιποῖς ἐν παραβολαῖς, ἵνα βλέποντες μὴ βλέπωσιν καὶ ἀκούοντες μὴ συνιῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/010.yaml
  text: And he said[a], “To you it has been given to know the mysteries of the kingdom of God, but to the rest in parables, so that seeing they may not see[c][b], and hearing they may not understand.”
translation:
  language: ja
  text: イエスは言われた。「あなたがたには、神の国の奥義[a]を知ることが与えられている。しかし、ほかの人たちには、たとえで語る。それは、見ていても見えず、聞いていても理解できないためである[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「秘密」。ここでいう「奥義」は、神の国について、ある人々には隠され、ほかの人々には明らかにされる真理を指す。
    reason: lexical_alternative
  - marker: b
    text: 「見ていても見えず、聞いていても理解できない」という句はイザヤ6:9–10を踏まえており、神の目的、裁きとしての結果、またはその両方を表すものと理解できる。
    reason: cross_reference
lexical_decisions:
- source_word: δέδοται
  choice: 与えられている
  rationale: 完了受動形が示す、以前に与えられ、その状態が続いていることを自然な日本語で表した。与え手は原文どおり明示しない。
- source_word: γνῶναι
  choice: 知る
  rationale: 後半の συνιῶσιν（理解する）との語義上の区別を保ち、最も直接的に訳した。
- source_word: μυστήρια
  choice: 奥義
  rationale: 神によって隠され、明らかにされる真理という聖書的含意を保つ語を採用した。「秘密」も可能なため脚注に示した。
- source_word: βασιλείας τοῦ θεοῦ
  choice: 神の国
  rationale: 神の支配とその領域の双方を含みうる、明瞭で定着した表現。
- source_word: τοῖς δὲ λοιποῖς
  choice: しかし、ほかの人たちには
  rationale: λοιπός の「残りの者たち」を自然な現代日本語で表した。マルコ並行箇所の「外の人々」は持ち込まない。
- source_word: ἐν παραβολαῖς
  choice: たとえで語られる
  rationale: 原文の省略を日本語で補い、教えがたとえという形式で与えられることを明瞭にした。
- source_word: ἵνα
  choice: それは……ためである
  rationale: 目的と結果の双方を含みうる原文の緊張を弱めず、因果関係を断定的に別方向へ解釈しない表現。
- source_word: βλέποντες μὴ βλέπωσιν
  choice: 見ていても見えず
  rationale: 同じ動詞の反復を保ちつつ、分詞の譲歩的な響きを自然な日本語で表した。
- source_word: ἀκούοντες μὴ συνιῶσιν
  choice: 聞いていても理解できない
  rationale: 聞くことと理解することの対照を明確に保った。
theological_decisions:
- issue: イザヤ6章を反映する ἵνα 節の目的・結果の力
  choice: 「それは……ようになるためである」と訳し、神の裁きとしての目的と結果の両方の可能性を残す
  alternative: 「その結果……」として結果だけを強調する、または「なぜなら」などで目的性を弱める
  rationale: ἵνα の目的・結果の力と、たとえによる啓示および裁きをめぐる本文の神学的緊張を、訳文で一方に決着させないため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「イエス」は直前の文脈から主語を補った。「奥義」はやや聖書的な語だが、脚注を添えて一般読者にも意味が伝わるようにした。
