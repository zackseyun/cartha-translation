id: LUK.8.15
reference: Luke 8:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ δὲ ἐν τῇ καλῇ γῇ, οὗτοί εἰσιν οἵτινες ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ ἀκούσαντες τὸν λόγον κατέχουσιν καὶ καρποφοροῦσιν ἐν ὑπομονῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/015.yaml
  text: But the seed in the good soil—these are the ones who[a], having heard the word with a good and noble heart, hold fast to it and bear fruit with perseverance.
translation:
  language: ja
  text: 一方、良い土に落ちた種とは、立派で善良な心[a]でことばを聞き、それをしっかり保ち、忍耐をもって実を結ぶ人たちである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「誠実で善い心」。
    reason: καλῇ καὶ ἀγαθῇ は意味の近い二つの形容詞であり、καλός には文脈により「立派な」「誠実な」などの訳が可能であるため。
lexical_decisions:
- source_word: τὸ δὲ ἐν τῇ καλῇ γῇ
  choice: しかし、良い土に落ちた種とは
  rationale: 中性冠詞と前置詞句から成る省略表現を、たとえの文脈に基づいて「種」と明示した。「落ちた」は種まきの場面を自然な日本語で表すために補った。δὲ は前の類型との対照を示す「しかし」とした。
- source_word: οὗτοί εἰσιν οἵτινες
  choice: 人たちである
  rationale: 良い土が指し示す人々を同定する構文を、説明として自然で明瞭な日本語にした。
- source_word: ἐν καρδίᾳ καλῇ καὶ ἀγαθῇ
  choice: 立派で善良な心で
  rationale: καλῇ と ἀγαθῇ の二重の肯定的評価を区別して残した。「心」は内面的な人格・態度を表す。心がどのように形成されたかについて、本文にない教理的説明は加えない。
- source_word: ἀκούσαντες τὸν λόγον
  choice: ことばを聞き
  rationale: アオリスト分詞が主要動詞に先立つ行為を示すことを、自然な連用形で表した。λόγος はこのたとえで既出の「ことば」とした。
- source_word: κατέχουσιν
  choice: それをしっかり保ち
  rationale: 単に所有するのでなく、聞いたことばを固く保持する継続的な意味を「しっかり保つ」で表した。目的語「それ」は日本語の明瞭さのために補った。
- source_word: καρποφοροῦσιν
  choice: 実を結ぶ
  rationale: 農耕の比喩を保ちながら、現代日本語で自然な定型表現を用いた。
- source_word: ἐν ὑπομονῇ
  choice: 忍耐をもって
  rationale: ὑπομονή が表す、困難の中でも持続する堅忍・忍耐を、実を結ぶ際のあり方として自然に表した。
theological_decisions:
- issue: ことばを受け入れる心の道徳的描写
  choice: 立派で善良な心で
  alternative: 誠実で善い心で
  rationale: 二つの形容詞による肯定的な描写を保ちつつ、その心が生来のものか、再生によるものか、功績となるものかという本文外の説明を加えなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、たとえの農耕イメージと格調を保った。「御言葉」のような教会内での慣用に限定されやすい表記を避け、一般読者にも理解しやすい「ことば」とした。
