  text: Ἐξῆλθεν ὁ σπείρων τοῦ σπεῖραι τὸν σπόρον αὐτοῦ. καὶ ἐν τῷ σπείρειν αὐτὸν ὃ μὲν ἔπεσεν παρὰ τὴν ὁδόν, καὶ κατεπατήθη καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατέφαγεν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/005.yaml
  text: The sower went out to sow his seed. And as he was sowing[a], some fell beside the path and was trampled, and the birds of the sky devoured it.
translation:
  language: ja
  text: 種をまく人が、自分の種をまくために出て行った。彼が種をまいている間に、種の一部は道端に落ち、踏みつけられ、空の鳥がそれを食べ尽くした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξῆλθεν ὁ σπείρων
  choice: 種をまく人が…出て行った
  rationale: アオリストの移動動詞と実質名詞的な分詞を、現代日本語で自然かつ明確に表した。
- source_word: τοῦ σπεῖραι τὸν σπόρον αὐτοῦ
  choice: 自分の種をまくために
  rationale: 属格不定詞の目的を「ために」で明示し、αὐτοῦは主語に対応する「自分の」とした。
- source_word: ἐν τῷ σπείρειν αὐτόν
  choice: 種をまいていると
  rationale: 同時進行を示すἐν＋冠詞付き不定詞を、物語として自然な時間表現にした。
- source_word: ὃ μὲν
  choice: ある種は
  rationale: 後続する複数の落下先のうち一部分を示す分配的表現として訳した。「種」は文脈から補った。
- source_word: παρὰ τὴν ὁδόν
  choice: 道端に
  rationale: 道のそばを意味する位置関係を、簡潔で一般的な日本語にした。
- source_word: κατεπατήθη
  choice: 踏みつけられ
  rationale: 受動態を保ち、誰が踏んだかを原文同様に特定しない。
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: 空の鳥
  rationale: 聖書的な属格表現を、意味を損なわない自然な現代日本語で表した。
- source_word: κατέφαγεν αὐτό
  choice: 食べ尽くされた
  rationale: κατεσθίωの強意を「食べ尽くす」で表現した。日本語では直前の「種」を主題として受動形を連ねることで自然な流れにした。
