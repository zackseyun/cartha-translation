  yaml_path: translation/nt/luke/008/026.yaml
  text: And they sailed down to the region of the Gerasenes, which is opposite Galilee.
translation:
  language: ja
  text: 彼らは舟で、ガリラヤの対岸にあるゲラサ人の地方[a]に着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「ガダラ人」または「ゲルゲサ人」。並行する福音書箇所にも、これらの地名が見られる。
    reason: textual_variant
lexical_decisions:
- source_word: κατέπλευσαν
  choice: 舟で…へ渡った
  rationale: 水路を通って目的地へ到着したことを自然な日本語で表す。κατάの方向的要素を不自然に「下って」と明示せず、文脈上の対岸への航行を保った。
- source_word: χώραν
  choice: 地方
  rationale: 近代的な国家ではなく、一定の地域・領域を指すため。
- source_word: Γερασηνῶν
  choice: ゲラサ人
  rationale: 属格の民族・住民名を日本語の慣用に従って音写した。
- source_word: ἥτις
  choice: …にある
  rationale: 先行する「地方」を説明する関係節を、意味を損なわず自然な連体修飾にした。
- source_word: ἀντιπέρα
  choice: 向こう岸
  rationale: ガリラヤ湖を隔てて反対側に位置することを、地理的文脈に即した自然な表現で示す。
- source_word: Γαλιλαίας
  choice: ガリラヤ
  rationale: 標準的な日本語の地名表記を採用した。
theological_decisions:
- issue: 共観福音書および写本伝承における地名の異読
  choice: ゲラサ人
  alternative: ガダラ人、ゲルゲサ人
  rationale: 本文はSBLGNTのΓερασηνῶνに従う。異なる地名を伝える写本と並行箇所は、本文を調和させず脚注で明示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「こうして一行は」で複数主語を自然に受け、「舟で…へ渡った」により航行と対岸への到着を簡潔に表した。
