id: LUK.8.24
reference: Luke 8:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσελθόντες δὲ διήγειραν αὐτὸν λέγοντες· Ἐπιστάτα ἐπιστάτα, ἀπολλύμεθα· ὁ δὲ ⸀διεγερθεὶς ἐπετίμησεν τῷ ἀνέμῳ καὶ τῷ κλύδωνι τοῦ ὕδατος, καὶ ἐπαύσαντο, καὶ ἐγένετο γαλήνη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/024.yaml
  text: Then they came and woke him[a], saying, “Master, Master, we are perishing!” And he, having awakened, rebuked the wind and the surging of the water, and they ceased, and there was a calm.
translation:
  language: ja
  text: そこで弟子たちは近寄ってイエスを起こし、言った。「先生、先生、私たちは死にそうです！」イエスは目を覚ますと、風と水のうねりを叱りつけた。すると、風も水のうねりも静まり、凪になった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: 近寄って
  rationale: イエスのもとへ近づく動きを自然な日本語で示し、後続の「起こし」と連続する付帯動作として訳した。
- source_word: διήγειραν
  choice: 起こし
  rationale: 眠っている人を目覚めさせる他動詞として、現代日本語で自然かつ明瞭である。
- source_word: Ἐπιστάτα
  choice: 先生
  rationale: ルカに特徴的な、権威を認めて呼びかける語。日本語の福音書文体で自然な敬称とし、「教師」だけに意味を限定しない呼びかけとして用いた。
- source_word: ἀπολλύμεθα
  choice: 私たちは死んでしまいます
  rationale: 目前に迫る死の危険と切迫した叫びを、普通の現代日本語で表した。
- source_word: διεγερθεὶς
  choice: 目を覚ますと
  rationale: 受動形の含みを過度に固定せず、目覚めた後に行動したという分詞の時間的連続を自然に示す。
- source_word: ἐπετίμησεν
  choice: 叱りつけられた
  rationale: 風と水に対する強い権威ある制止を保持する。尊敬表現は物語の中心人物であるイエスへの自然な日本語上の配慮であり、発言内容を付加しない。
- source_word: κλύδωνι τοῦ ὕδατος
  choice: 水の荒波
  rationale: κλύδωνの「大きくうねる波、荒波」と、τοῦ ὕδατοςによる水との関係を簡潔に表す。「波」だけより激しさを保持する。
- source_word: ἐπαύσαντο
  choice: どちらもやみ
  rationale: 複数形を、直前の風と水の荒波の双方を指す「どちらも」で明示した。
- source_word: ἐγένετο γαλήνη
  choice: 凪になった
  rationale: 風と波が静まった結果としての平穏を、簡潔で自然な日本語にした。
theological_decisions:
- issue: イエスへの呼称 Ἐπιστάτα
  choice: 先生
  alternative: 主人／師よ／指揮官
  rationale: 弟子たちがイエスの権威を認めて呼びかける意味を保ちつつ、後代の教会用語や特定の教理的含意を加えない。
- issue: 被造世界に対するイエスの権威を示す ἐπετίμησεν
  choice: 叱りつけられた
  alternative: 命じられた／戒められた
  rationale: 風と水を人格的な相手のように強く制止する原文の表現を保ち、出来事への神学的説明は付加しない。
translation_notes:
  register: 明瞭な現代標準日本語。物語の切迫感を保ちつつ、朗読にも適する簡潔で dignified な聖書文体とした。原文の複数動詞は「どちらも」で保持した。
