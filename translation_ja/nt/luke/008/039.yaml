id: LUK.8.39
reference: Luke 8:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὑπόστρεφε εἰς τὸν οἶκόν σου, καὶ διηγοῦ ὅσα ⸂σοι ἐποίησεν⸃ ὁ θεός. καὶ ἀπῆλθεν καθ’ ὅλην τὴν πόλιν κηρύσσων ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/039.yaml
  text: Return to your house, and tell what great things God has done for you. And he went away, proclaiming throughout the whole city what Jesus had done for him.
translation:
  language: ja
  text: 「自分の家に帰り、神があなたにしてくださったことをすべて語りなさい。」そこで彼は立ち去り、イエスが自分にしてくださったことをすべて町じゅうで告げ知らせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑπόστρεφε
  choice: 帰りなさい
  rationale: 以前いた場所へ戻るよう命じる現在命令形。現代日本語では「帰りなさい」が簡潔で自然。
- source_word: εἰς τὸν οἶκόν σου
  choice: 自分の家に
  rationale: εἰςを伴うため、ここではοἶκοςの場所的意味を明確に表す。「家へ」も可能だが、所有関係を自然に示した。
- source_word: διηγοῦ
  choice: 語りなさい
  rationale: 出来事を詳しく物語る意味を持つ中動態命令形。「話しなさい」よりも、経験を順序立てて伝える含みを保つ。
- source_word: ὅσα σοι ἐποίησεν ὁ θεός
  choice: 神があなたにしてくださったことをすべて
  rationale: ὅσαを明示的な形容詞のない「すべてのこと」と捉え、文脈から「偉大なこと」を補わない。恩恵を受けた文脈は敬語補助動詞「くださった」で自然に表現する。
- source_word: ἀπῆλθεν
  choice: 立ち去り
  rationale: その場を離れたというἀπέρχομαιの含みを保ち、後続する行動へ自然につなぐ。
- source_word: καθ’ ὅλην τὴν πόλιν
  choice: 町中に
  rationale: κατάの分布的意味とὅληνの全域性を、簡潔で自然な現代日本語で表す。
- source_word: κηρύσσων
  choice: 言い広めた
  rationale: 公に告げ知らせるκηρύσσωの強さを表しつつ、制度的な説教を連想させやすい「宣教した」は避ける。分詞は日本語の主動詞として処理した。
- source_word: ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς
  choice: イエスが自分にしてくださったこと
  rationale: 先行する「神があなたにしてくださったこと」との意図的な並行を保つ。「すべて」は日本語では反復が重くなるため省いたが、包括的な関係表現「こと」により内容を狭めてはいない。
theological_decisions:
- issue: イエスの命令にある「神」と、男の宣言にある「イエス」との並行
  choice: 「神があなたにしてくださったこと／イエスが自分にしてくださったこと」と原文どおり異なる主語を保持する
  alternative: 両方を「神」または「イエス」に統一する、あるいは「すなわちイエス」と説明を加える
  rationale: ルカは二つの表現を説明なしに並べている。その神学的含意や緊張を翻訳側で解消せず、読者にそのまま示す。
translation_notes:
  register: 明瞭な現代標準語。命令は威厳を保つ「〜なさい」とし、叙述は簡潔にした。神およびイエスの行為には、日本語として自然な受益表現「してくださった」を用いた。
