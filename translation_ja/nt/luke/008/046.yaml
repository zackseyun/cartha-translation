source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἥψατό μού τις, ἐγὼ γὰρ ἔγνων δύναμιν ⸀ἐξεληλυθυῖαν ἀπ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/046.yaml
  text: But Jesus said, “Someone touched me, for I knew that power had gone out from me.”
translation:
  language: ja
  text: しかし、イエスは言われた。「だれかがわたしに触れた。わたしから力が出て行ったことが分かったからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἥψατό μού τις
  choice: だれかがわたしに触れた
  rationale: 不定代名詞τιςを「だれか」、属格μούを伴うἅπτομαιを自然な現代日本語で「わたしに触れた」とした。
- source_word: ἔγνων
  choice: 分かった
  rationale: γινώσκωのアオリストを、知覚して認識したことを表す自然な日本語とした。「知っていた」ではなく、その時に察知した文脈を保つ。
- source_word: δύναμιν ἐξεληλυθυῖαν ἀπ’ ἐμοῦ
  choice: わたしから力が出て行ったこと
  rationale: δύναμιςを文脈に即して「力」、完了分詞ἐξεληλυθυῖανを結果状態も含みうる「出て行った」と訳し、力の性質を説明的に限定しなかった。
theological_decisions:
- issue: イエスが力の流出を認識した仕方
  choice: 分かった
  alternative: 感じた／知っていた
  rationale: 本文のἔγνωνは認識を述べるが、その手段やイエスの知識の範囲までは特定しないため、知覚だけに限定する「感じた」も、継続状態を強く示す「知っていた」も避けた。
- issue: δύναμιςの意味
  choice: 力
  alternative: 癒やす力／奇跡の力
  rationale: 原文は単にδύναμιςと述べており、文脈上の癒やしとの関係を訳文内で明示的に付加しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある会話文。「しかし」で前節との対照を示し、イエスの発言は自然な直接話法とした。
