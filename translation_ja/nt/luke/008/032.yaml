  text: Ἦν δὲ ἐκεῖ ἀγέλη χοίρων ἱκανῶν ⸀βοσκομένη ἐν τῷ ὄρει· καὶ ⸀παρεκάλεσαν αὐτὸν ἵνα ἐπιτρέψῃ αὐτοῖς εἰς ἐκείνους εἰσελθεῖν· καὶ ἐπέτρεψεν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/032.yaml
  text: There was a large herd of pigs feeding there on the mountain[a], and they begged him to permit them to enter those pigs[c][b], and he permitted them.
translation:
  language: ja
  text: そこには、かなり大きな豚の群れ[a]が山で[b]餌を食べていた。彼ら[c]は、その豚たちの中に入ることを許してほしいとイエスに懇願した。イエスは彼らが入ることを許した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「かなり多くの豚から成る群れ」。または「多数の豚の群れ」。
    reason: lexical_alternative
  - marker: b
    text: または「山腹で」。
    reason: lexical_alternative
  - marker: c
    text: 「彼ら」は、前後の文脈に出てくる悪霊、すなわち汚れた霊を指す。訳によっては本文で「悪霊たちは」と明示する。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγέλη χοίρων ἱκανῶν
  choice: かなり大きな豚の群れ
  rationale: ἀγέληは豚の集団を表す「群れ」、χοίρωνは現代日本語で明瞭な「豚」とした。ἱκανῶνは文法上「豚」の多さを示すが、日本語では群れの規模として表すほうが自然なため、「かなり大きな豚の群れ」とした。
- source_word: βοσκομένη
  choice: 餌を食べていた
  rationale: 群れが食物をあさり、食べている活動を表す。豚について「草を食べていた」と限定せず、自然で広い表現を用いた。
- source_word: ἐν τῷ ὄρει
  choice: 山で
  rationale: ὄροςの基本的な意味を保ち、場所を自然な日本語で示した。「山腹で」も文脈上可能なので脚注に掲げた。
- source_word: παρεκάλεσαν
  choice: 懇願した
  rationale: 単なる依頼ではなく、切実に願う語の強さを保った。
- source_word: ἐπιτρέψῃ / ἐπέτρεψεν
  choice: 許してほしい／許された
  rationale: 願いと応答で反復される同じ語根の対応を、日本語でも「許す」で保った。依頼節では自然な日本語にして「許してほしい」とした。
- source_word: εἰς ἐκείνους εἰσελθεῖν
  choice: その豚たちの中に入る
  rationale: ἐκείνουςが指す豚を明示し、εἰςとεἰσελθεῖνの「中へ入る」という方向性を保った。
- source_word: δὲ
  choice: （独立した接続語なし）
  rationale: ここでは物語を進める軽い接続辞であり、日本語で「さて」「ところで」などを加えると強調しすぎるため、文脈の流れに委ねた。
theological_decisions:
- issue: 「懇願した」の複数主語が誰を指すか
  choice: 本文では「彼ら」とし、ギリシア語どおり指示対象を明示しない
  alternative: 「悪霊たちは」と明示する
  rationale: 周囲の文脈では悪霊／汚れた霊を指すが、この節自体は複数形の動詞だけで主語を明示していない。本文ではその含みを保ち、脚注で文脈上の指示対象を説明した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語文としての落ち着きと尊厳を保った。「豚たち」は指示語「その」と組み合わせ、直前の群れに属する豚を自然に受ける表現とした。
