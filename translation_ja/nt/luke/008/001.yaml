id: LUK.8.1
reference: Luke 8:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ καθεξῆς καὶ αὐτὸς διώδευεν κατὰ πόλιν καὶ κώμην κηρύσσων καὶ εὐαγγελιζόμενος τὴν βασιλείαν τοῦ θεοῦ, καὶ οἱ δώδεκα σὺν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/001.yaml
  text: And it happened soon afterward that he was traveling through city after city and village after village[a], proclaiming and bringing the good news of the kingdom of God[c][b], and the Twelve were with him.
translation:
  language: ja
  text: その後、イエスは町から町へ、村から村へと巡り歩き[a]、神の国[b]を宣べ伝え、その良い知らせを告げていた。十二人もイエスと共にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「町ごと、村ごとに」。
    reason: lexical_alternative
  - marker: b
    text: または「神の支配」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ καθεξῆς
  choice: その後間もなく
  rationale: ルカに特徴的な物語の移行を示す時間表現。日本語では「その後間もなく」とすることで、出来事が次に続いたことを自然に表す。ἐγένετοを逐語的に「起こった」と加えると、この文脈では不自然になるため、時間的導入に含めた。
- source_word: αὐτὸς
  choice: イエスは
  rationale: 明示された代名詞の指示対象を日本語で明確にした。ここでは強意の「ご自身」は必要ない。
- source_word: διώδευεν
  choice: 巡り歩き
  rationale: 未完了過去が示す継続的・反復的な移動と、各地を通って行く動作を簡潔に表す。
- source_word: κατὰ πόλιν καὶ κώμην
  choice: 町から町、村から村へと
  rationale: κατάと単数名詞による分配的な意味を保ち、各地を次々に巡ったことを自然な日本語で示す。
- source_word: κηρύσσων
  choice: 宣べ伝え
  rationale: 公に告知するというκηρύσσωの意味を、聖書文体として定着しつつ理解しやすい表現で伝える。
- source_word: εὐαγγελιζόμενος
  choice: その良い知らせを告げていた
  rationale: κηρύσσωνとの語義上の区別を保ちつつ、神の国についての良い知らせを伝える意味を示す。「その」は直前の「神の国」を受ける。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 領域と支配の双方を含み得るβασιλείαの幅を保つ、日本語聖書で広く理解される訳語。
- source_word: οἱ δώδεκα
  choice: 十二人
  rationale: 本文にない「弟子」や「使徒」を補わず、特定の集団を指す呼称として訳した。
- source_word: σὺν αὐτῷ
  choice: イエスと共にいた
  rationale: 同行を自然な日本語で表し、代名詞の指示対象も明確にした。
theological_decisions:
- issue: βασιλεία τοῦ θεοῦの訳し方
  choice: 神の国
  alternative: 神の支配
  rationale: βασιλείαは王国という領域と王としての支配の双方を含み得る。「神の国」はその神学的な広がりを狭めずに保ち、「神の支配」という可能なニュアンスは脚注で示す。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。「巡り歩き」「宣べ伝え」により継続的な巡回と公的告知を表し、二つの分詞は「宣べ伝え、その良い知らせを告げていた」と訳し分けた。
