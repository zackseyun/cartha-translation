  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· ⸀Ποῦ ἡ πίστις ὑμῶν; φοβηθέντες δὲ ἐθαύμασαν, λέγοντες πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ τοῖς ἀνέμοις ἐπιτάσσει καὶ τῷ ὕδατι, καὶ ὑπακούουσιν αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/025.yaml
  text: Then he said to them[a], “Where is your faith?” And being afraid, they marveled, saying to one another, “Who then is this, that he commands even the winds and the water, and they obey him?”
translation:
  language: ja
  text: イエスは彼らに言われた。「あなたがたの信仰[a]はどこにあるのか。」彼らは恐れ、驚き、互いに言った。「いったい、この方はどなたなのだろう。風にも水にも命じ、それらがこの方に従うのだから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「信頼」。イエスの問いは、「あなたがたの信頼はどこにあるのか」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποῦ
  choice: どこにあるのか
  rationale: 信仰の所在または有無を問う直接的な表現を保ち、「なぜ信仰がないのか」という解釈的な言い換えを避けた。
- source_word: πίστις
  choice: 信仰
  rationale: 文脈上は危機の中での信頼を指すが、語の広がりと聖書用語としての自然さを保つため「信仰」とし、「信頼」の含意は脚注に示した。
- source_word: φοβηθέντες δὲ ἐθαύμασαν
  choice: 弟子たちは恐れ、驚いて
  rationale: 恐れと驚きという二つの反応を自然な現代日本語で表しつつ、恐れが驚きに伴う分詞構造も簡潔に反映した。
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: いったい、この方はどなたなのだろう
  rationale: ἄραの推論的・驚嘆的な響きを「いったい」で表し、人物への敬意を伴う自然な疑問表現とした。
- source_word: ἐπιτάσσει
  choice: 命じる
  rationale: 叱責ではなく、権威をもって命令するというこの節の語義を直接に表した。
- source_word: τοῖς ἀνέμοις ... καὶ τῷ ὕδατι
  choice: 風にも水にも
  rationale: ルカ本文の複数形「風々」と単数形「水」に即しつつ、日本語として自然な形にした。「波」や「海」は並行記事から補わなかった。
- source_word: ὑπακούουσιν αὐτῷ
  choice: それらが従う
  rationale: 風と水がイエスの命令に服するという擬人的な表現を明確に保った。
theological_decisions:
- issue: πίστιςがこの文脈で「信頼」を含意すること
  choice: 信仰
  alternative: 信頼
  rationale: 危険の中でイエスに寄せる信頼が中心的含意だが、「信仰」は意味範囲を狭めず、問いの神学的な広がりも保つ。別訳は脚注で明示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「この方」は口語的すぎる「この人」を避けつつ、弟子たちの驚きと問いを自然に表す。原文の「風」と「水」を保持し、並行記事由来の表現を持ち込まない。
