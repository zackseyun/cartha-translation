  to: イエスは彼らに言われた。「あなたがたの信仰[a]はどこにあるのか。」彼らは恐れ、驚き、互いに言った。「いったい、この方はどなたなのだろう。風にも水にも命じ、それらがこの方に従うのだから。」
  rationale: 原文のαὐτοῖςに沿って「弟子たち」を「彼ら」とし、恐れと驚きの連続を自然な日本語で表した。さらに、ὅτι以下を弟子たちの問いの根拠として明瞭に訳し、風と水が「この方に」従うという原文の対象を明示した。脚注は原文のπίστιςが文脈上「信頼」とも理解できることを適切に保持しているため、変更しない。
