  source_fidelity: ギリシア語の三つの出来事の連鎖を忠実に訳している。「少女の霊が戻り」はτὸ πνεῦμα αὐτῆς ἐπέστρεψενを保ち、「すぐに起き上がった」はἀνέστη παραχρῆμαを自然に表す。「少女に何か食べ物を与えるよう命じた」も、αὐτῇ δοθῆναι φαγεῖνの『彼女に食べる物が与えられるように命じた』という内容を十分に表現している。最後の主語を文脈に従って「イエス」と明示することも適切である。
  naturalness: 明快な現代標準日本語として自然であり、叙述の簡潔さと聖書本文にふさわしい品位が保たれている。「すると」は直前の出来事に続く場面転換として不自然ではない。
  terminology: πνεῦμαを本文で「霊」とし、「息」を脚注で代案として示す処理は、復活の文脈を過度に解釈せず、原語の語義幅を保っている。διέταξενの「命じた」も適切である。脚注アンカーは本文中の「霊」に正しく対応している。
