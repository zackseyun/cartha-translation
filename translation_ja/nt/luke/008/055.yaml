id: LUK.8.55
reference: Luke 8:55
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπέστρεψεν τὸ πνεῦμα αὐτῆς, καὶ ἀνέστη παραχρῆμα, καὶ διέταξεν αὐτῇ δοθῆναι φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/055.yaml
  text: And her spirit returned[a], and she rose immediately[b], and he directed that food be given to her.
translation:
  language: ja
  text: すると、少女の霊[a]が戻り、少女はすぐに起き上がった。イエスは、少女に何か食べ物を与えるよう命じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「少女の息」。
    reason: πνεῦμαは「霊」とも「息」とも訳し得るため。
lexical_decisions:
- source_word: ἐπέστρεψεν
  choice: 戻り
  rationale: 生命の回復を描く文脈で、「戻る」は原語の具体的な動きを保ちつつ、現代日本語として自然である。
- source_word: τὸ πνεῦμα αὐτῆς
  choice: 少女の霊
  rationale: πνεῦμαには「霊」「息」などの語義があるが、死から生き返る文脈では「霊」が最も広い意味と神学的含意を保つ。「息」の可能性は脚注に示す。
- source_word: ἀνέστη
  choice: 起き上がった
  rationale: 身体的に起きる動作を明確かつ自然に表し、ἀνίστημιの基本的意味に対応する。
- source_word: παραχρῆμα
  choice: すぐに
  rationale: 奇跡の直後性を、明快で自然な現代日本語で表す。
- source_word: διέταξεν
  choice: 命じた
  rationale: διατάσσωが示す権威ある指示を忠実に表す。文脈上の主語であるイエスを日本語では明示した。
- source_word: αὐτῇ δοθῆναι φαγεῖν
  choice: 少女に何か食べ物を与えるよう
  rationale: δοθῆναιとφαγεῖνの双方を反映し、食べるための物を与えるという意味を自然な日本語で明示する。
theological_decisions:
- issue: 復活の文脈におけるπνεῦμαの意味
  choice: 少女の霊が戻り
  alternative: 少女の息が戻り
  rationale: 「霊」はπνεῦμαの語義の幅と、死からの回復という物語上の重みを保つ。一方、「息」も語彙的には可能なので脚注に残し、曖昧さを消さない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書本文としての品位を保った。「少女」を繰り返して指示対象を明確にし、原文で省略されている最後の動詞の主語は直前の文脈に基づき「イエス」と明示した。英語相談層の脚注記号と脚注本文には対応のずれが見られるため、ギリシア語本文に基づいて正しい位置と内容に整理した。
