  text: ⸂Ἐν δὲ⸃ τῷ ⸀ὑποστρέφειν τὸν Ἰησοῦν ἀπεδέξατο αὐτὸν ὁ ὄχλος, ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/040.yaml
  text: When Jesus returned[a], the crowd welcomed him[b], for they were all waiting for him.
translation:
  language: ja
  text: イエスが戻ると、群衆はイエスを迎え入れた[a]。皆がイエスを待っていた[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「受け入れた」。ギリシア語は受け入れることも歓迎することも表し得るが、ここでは好意的に迎える意味合いである。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエスが来るのを予期していた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν δὲ τῷ ὑποστρέφειν τὸν Ἰησοῦν
  choice: イエスが戻ると
  rationale: ἐν＋冠詞付き不定詞を時を表す節として自然な日本語にした。ὑποστρέφωの基本義「戻る」を保ち、δέは日本語で不自然な接続語を加えず、文脈上の展開に委ねた。
- source_word: ἀπεδέξατο
  choice: 迎え入れた
  rationale: 単に受け取るのではなく、好意的に迎える文脈上の意味を明確に表す。「喜んで」は原文に明示されていないため加えない。
- source_word: ὁ ὄχλος
  choice: 群衆
  rationale: 集まった人々を集合的に指すὄχλοςの通常の意味を、現代日本語で簡潔に表した。
- source_word: ἦσαν γὰρ πάντες προσδοκῶντες αὐτόν
  choice: 皆がイエスを待っていたからである
  rationale: γάρの理由説明を「からである」で示し、πάντεςの強調を「皆」で明示した。進行的な期待を表す分詞は、文脈に即して「待っていた」とした。代名詞の連続による曖昧さを避けるため、αὐτόνは「イエス」とした。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準日本語を用いた。「迎え入れた」と「待っていた」により、簡潔さと原文の意味合いを両立させた。敬語を過度に用いず、落ち着いた聖書本文の文体とした。
