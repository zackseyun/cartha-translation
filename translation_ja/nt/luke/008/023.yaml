source:
  edition: SBLGNT
  text: πλεόντων δὲ αὐτῶν ἀφύπνωσεν. καὶ κατέβη λαῖλαψ ἀνέμου εἰς τὴν λίμνην, καὶ συνεπληροῦντο καὶ ἐκινδύνευον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/023.yaml
  text: And as they were sailing[a], he fell asleep. And a windstorm came down on the lake, and they were being swamped and were in danger.
translation:
  language: ja
  text: 一行が舟で進んでいるとき、イエスは眠りに落ちた。すると、激しい暴風が湖の上に吹き下ろしてきて、舟に水が入り込み[a]、一行は危険にさらされていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼らは満たされつつあった」。舟に水が入り、乗っていた人々が浸水の危険に直面していたことを表す表現と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεόντων δὲ αὐτῶν
  choice: 一行が舟で進んでいる間に
  rationale: 属格独立構文と現在分詞が示す、同時進行中の背景動作を自然な日本語で表した。文脈上、舟で湖を進んでいることを明示した。
- source_word: ἀφύπνωσεν
  choice: イエスは眠りに落ちた
  rationale: アオリストの起動的な意味を「眠りに落ちた」で表した。主語は直前の文脈からイエスである。
- source_word: κατέβη
  choice: 吹き下ろし
  rationale: 風が湖へ「下って来た」という方向性を保ちつつ、日本語の気象表現として自然にした。
- source_word: λαῖλαψ ἀνέμου
  choice: 激しい風
  rationale: λαῖλαψ が表す猛烈な突風・暴風と、ἀνέμου による風の強調を、平明な現代日本語で表した。
- source_word: εἰς τὴν λίμνην
  choice: 湖に
  rationale: εἰς の方向性を「湖に」で保ち、κατέβηとの組み合わせを「湖に吹き下ろし」と自然に表現した。
- source_word: συνεπληροῦντο
  choice: 舟は水でいっぱいになりかけ
  rationale: 複数形受動の指示対象には曖昧さがあるが、文脈上は舟への浸水を表すと理解されるため、意味を明瞭にした。「なりかけ」は進行中の未完了相と差し迫った危険を示す。別の取り方は脚注に残した。
- source_word: ἐκινδύνευον
  choice: 一行は危険にさらされた
  rationale: 継続していた危険な状態を明瞭で自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある叙述調。「彼ら」の連続を避けて「一行」を用い、文脈上の主語であるイエスと舟を必要な範囲で明示した。
