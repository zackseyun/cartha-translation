  text: ἀπήγγειλαν δὲ ⸀αὐτοῖς οἱ ἰδόντες πῶς ἐσώθη ὁ δαιμονισθείς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/036.yaml
  text: And those who had seen it reported to them how the demon-possessed man had been saved[a].
translation:
  language: ja
  text: その出来事を見た人たちは、悪霊に取りつかれていた人がどのように救われたか[a]を、彼らに報告した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「癒やされた」または「解放された」。ギリシア語の動詞は、文脈により「救う」「癒やす」「解放する」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήγγειλαν
  choice: 知らせた
  rationale: 出来事を目撃した者がその内容を人々に伝える場面なので、「報告した」より自然でありつつ、単なる会話以上の伝達を表す「知らせた」とした。
- source_word: δὲ
  choice: （独立した語としては訳出せず）
  rationale: ここでは物語を緩やかに進める接続辞であり、日本語では語順と文脈によって流れが自然に示されるため、機械的に「そして」を置かなかった。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 報告を受けた人々を指す与格代名詞を明示した。
- source_word: οἱ ἰδόντες
  choice: それを見ていた人たち
  rationale: 冠詞付き分詞を自然な日本語にし、直前の出来事を目撃していた人々であることを「それ」で示した。
- source_word: πῶς
  choice: どのように
  rationale: 出来事の経緯または実現の仕方を導く語として、原文の表現を保った。
- source_word: ἐσώθη
  choice: 救われた
  rationale: σῴζωの「救う、癒やす、解放する」という意味領域の広さと語彙上の響きを保つため、本文では「救われた」とし、この文脈で可能な訳を脚注に示した。
- source_word: ὁ δαιμονισθείς
  choice: 悪霊に取りつかれていた人
  rationale: 悪霊の支配・影響下にあった人物を表す受動分詞を、現代日本語で明瞭かつ人格を損なわない形にした。完了した過去の状態は「取りつかれていた」で表した。
theological_decisions:
- issue: 悪霊からの解放の文脈におけるἐσώθη（σῴζω）の訳
  choice: 救われた
  alternative: 癒やされた／解放された
  rationale: σῴζωは救済、救出、治癒、解放を表し得る。この場面では悪霊からの解放と回復が中心だが、「救われた」とすることで原語の広い含意を残し、文脈上妥当な別訳を脚注で示した。身体的治癒だけ、あるいは霊的救済だけに意味を限定しないためである。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、聖書本文としての落ち着いた格調を保った。「悪霊に取りつかれていた人」として、古風または侮蔑的に響き得る名詞化を避けた。
