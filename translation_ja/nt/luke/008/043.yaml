  text: καὶ γυνὴ οὖσα ἐν ῥύσει αἵματος ἀπὸ ἐτῶν δώδεκα, ἥτις ⸂ἰατροῖς προσαναλώσασα ὅλον τὸν βίον⸃ οὐκ ἴσχυσεν ⸀ἀπ’ οὐδενὸς θεραπευθῆναι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/043.yaml
  text: And a woman who had been in a flow of blood for twelve years[a], and who had spent her whole livelihood on physicians, was not able to be healed by anyone[c][b],
translation:
  language: ja
  text: また、十二年の間、出血が続いていた女がいた[a]。彼女は医者たちに生活の資力をすべて使い果たしていたが[b][c]、だれにも治してもらうことができなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「血の流出の状態にあった」。出血が続いていたことを指します。
    reason: lexical_alternative
  - marker: b
    text: 「生活の資力をすべて」は、生活を支える手もとの資力をすべてという意味です。「一生」や生物学的な「命」を意味するのではありません。
    reason: lexical_alternative
  - marker: c
    text: 一部の写本には、「医者たちに生活の資力をすべて使い果たしていた」に当たる句がありません。本文はSBLGNTの読み方に従っています。
    reason: textual_variant
lexical_decisions:
- source_word: γυνὴ οὖσα
  choice: 女がいた
  rationale: 分詞構文が導入する背景情報を、現代日本語の自然な叙述として表した。
- source_word: ἐν ῥύσει αἵματος
  choice: 出血を患っている
  rationale: 継続する病的な出血を明確かつ自然に表しつつ、病名や出血部位を本文以上に限定しない。
- source_word: ἀπὸ ἐτῶν δώδεκα
  choice: 十二年もの間
  rationale: 期間を表す句として訳し、「もの」により長期にわたる苦しみという文脈上の重みを自然に示した。
- source_word: ἰατροῖς προσαναλώσασα
  choice: 医者たちに…使い果たしていた
  rationale: 与格を支出の相手として取り、προσαναλίσκω の資産を費消し尽くす意味を自然な日本語で表した。
- source_word: ὅλον τὸν βίον
  choice: 全財産
  rationale: βίος はここで生物学的な命ではなく、生活の資や所有する資力を指すため、簡潔に「全財産」とした。
- source_word: οὐκ ἴσχυσεν ἀπ’ οὐδενὸς θεραπευθῆναι
  choice: だれにも治してもらえなかった
  rationale: 能力・可能性の否定と受動の意味を、日本語で自然な授受表現により保った。治療者への非難は付加していない。
