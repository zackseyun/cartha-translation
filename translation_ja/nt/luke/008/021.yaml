base_translation:
  language: en
  yaml_path: translation/nt/luke/008/021.yaml
  text: But he answered and said to them[b][a], “My mother and my brothers are those who hear the word of God and do it.”
translation:
  language: ja
  text: しかし、イエスは彼らに答えて言った。「わたしの母、わたしの兄弟たちは、神のことばを聞いて、それを行う人たちです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」と訳すこともある。ギリシア語は男性複数形で「兄弟たち」とあるが、ここで述べられる家族の範囲は女性をも含むと理解することができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: 彼らに答えて言った
  rationale: 「答えて言った」という原文の叙述上の組み合わせを保ちつつ、πρὸς αὐτούςの相手も明示した。現代日本語ではやや定型的だが、聖書叙述として自然な範囲にある。
- source_word: Μήτηρ μου καὶ ἀδελφοί μου
  choice: わたしの母、わたしの兄弟たち
  rationale: 単数の「母」と男性複数形の「兄弟たち」を直接反映し、直前の肉親への言及とのつながりを保った。適用範囲が男性だけに限られない可能性は脚注で示す。
- source_word: οὗτοί εἰσιν οἱ ...
  choice: とは、…人たちのことです
  rationale: 指示詞による強い同定を、日本語で自然な提示・同定構文にした。「この人たちです」とする場合に必要となる場面上の指示対象を過度に補わない。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: λόγοςを「ことば」とし、神からの宣言・教えという意味と神学的な響きを保った。
- source_word: ἀκούοντες καὶ ποιοῦντες
  choice: 聞いて、それを行う
  rationale: 二つの現在分詞が示す特徴的・継続的な態度を簡潔に表した。「従う」と意訳せず、「聞く」と「行う」の並行を維持した。
theological_decisions:
- issue: イエスが再定義する家族の範囲
  choice: 神のことばを聞いて行う人々を、イエス自身の母・兄弟として同定する表現を保つ。
  alternative: 肉親を全面的に否定していると明示する、または男性の弟子だけに限定する。
  rationale: 本文は神のことばへの応答を軸に家族的関係を広げているが、肉親を明白に拒絶したとも、対象を男性だけに限定したとも述べていないため、その緊張と余地を残した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの発言には簡潔で品位ある敬体を採用した。「答えて言った」は原文の叙述的な重なりを意識して保持した。
