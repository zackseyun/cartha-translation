id: LUK.8.14
reference: Luke 8:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ δὲ εἰς τὰς ἀκάνθας πεσόν, οὗτοί εἰσιν οἱ ἀκούσαντες, καὶ ὑπὸ μεριμνῶν καὶ πλούτου καὶ ἡδονῶν τοῦ βίου πορευόμενοι συμπνίγονται καὶ οὐ τελεσφοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/014.yaml
  text: And the one that fell among the thorns—these are those who have heard[a], but as they go on their way they are choked by the cares and riches and pleasures of life[b], and they do not bear fruit to maturity.
translation:
  language: ja
  text: 「茨の中に落ちたもの」とは、聞いた人たちのことである。ところが、歩んでいくうちに、思い煩い[a]や富や人生の快楽によって押しふさがれ、実を結んで成熟に至ることがない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「心配」または「不安」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「成熟した実を結ばない」または「実を完成に至らせない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... εἰς τὰς ἀκάνθας πεσόν
  choice: 「茨の中に落ちたもの」
  rationale: 名詞を補わず、中性単数の表現を保ちながら、たとえの種を指すことが自然に分かる形とした。
- source_word: οὗτοί εἰσιν οἱ ἀκούσαντες
  choice: 聞いた人たちのことである
  rationale: ἀκούσαντεςの完了した行為を簡潔に表現した。「みことば」はこの節には明示されていないため補わなかった。
- source_word: ὑπὸ μεριμνῶν
  choice: 思い煩い
  rationale: μέριμναが表す心配、懸念、不安を、現代日本語として自然で聖書本文にもふさわしい語で表した。
- source_word: πλούτου
  choice: 富
  rationale: 物質的な豊かさを簡潔に表し、道徳的評価を訳語自体に付け加えない。
- source_word: ἡδονῶν τοῦ βίου
  choice: 人生の快楽
  rationale: βίοςを地上で営まれる生活・人生の意味に取り、ἡδοναίとの属格関係を明示した。
- source_word: πορευόμενοι
  choice: 歩んでいくうちに
  rationale: 継続的に進んでいく過程を表しつつ、「一生」などの説明を加えすぎない表現とした。
- source_word: συμπνίγονται
  choice: ふさがれ
  rationale: 受動態と、茨が植物の成長を妨げる比喩を保持した。
- source_word: οὐ τελεσφοροῦσιν
  choice: 実を熟すまでには至らない
  rationale: 結実の比喩と、完成・成熟に達しないというτελεσφορέωの含意をともに表した。
theological_decisions:
- issue: 茨の中の土地に当たる聞き手の最終的な状態
  choice: ふさがれて実が成熟しないという農耕の比喩だけを保つ
  alternative: 未再生の者、真の信者だが実を結ばない者、あるいは信仰から離れた者のいずれかと明示する
  rationale: 本文は聞いた人々が世の事柄によって実の成熟を妨げられることを述べるが、再生、背教、報いなどに関する後代の教理的分類を明示していないため、その緊張を解消しない。
translation_notes:
  register: 明快な現代標準日本語を用い、説明調になりすぎない品位ある文体とした。原文の農耕比喩を一貫して保持し、節中にない目的語や教理的結論は補っていない。
