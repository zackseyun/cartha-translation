revisions:
- from: 「茨の中に落ちたもの」とは、聞いた人たちのことである。ところが、歩んでいくうちに、思い煩い[a]や富や人生の快楽にふさがれ、実を熟すまでには至らない[b]。
  to: 「茨の中に落ちたもの」とは、聞いた人たちのことである。ところが、歩んでいくうちに、思い煩い[a]や富や人生の快楽によって押しふさがれ、実を結んで成熟に至ることがない[b]。
  rationale: 受動態συμπνίγονταιの強い農耕比喩を「押しふさがれ」により明示し、τελεσφοροῦσινを、実を結ぶ働きが成熟・完成に到達しないという意味で自然に訳し直した。本文にない「みことば」や、聞き手の救い・背教についての教理的判断は加えていない。脚注アンカーは原文の語句に対応した位置に維持した。
  reviewer_model: gpt-5.6-terra
