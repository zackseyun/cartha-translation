  text: Ἰδόντες δὲ οἱ βόσκοντες τὸ ⸀γεγονὸς ἔφυγον καὶ ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/034.yaml
  text: When the herdsmen saw what had happened[b][a], they fled and reported it in the city and in the countryside.
translation:
  language: ja
  text: 豚の世話をしていた者たちは、起こったこと[a]を見ると、逃げ出し、町と周辺の田園地域[b]にそのことを知らせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「起きた出来事」。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「畑（複数）」。ここでは町の周囲にある田園地域を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδόντες
  choice: 見ると
  rationale: アオリスト分詞を主動詞に対する時の関係として自然な日本語にし、「それを見た時」という意味を簡潔に表した。
- source_word: οἱ βόσκοντες
  choice: 家畜の番をしていた者たち
  rationale: 実体詞的な現在分詞で、文脈上は豚の群れを飼育していた者たちを指す。原文が目的語を明示していない点を保ちつつ、日本語で役割が明確になる表現とした。
- source_word: τὸ γεγονός
  choice: 起こったこと
  rationale: γίνομαιの完了分詞の実体詞的用法で、すでに生じた出来事を指す。完了した出来事という含みを自然に表した。
- source_word: ἔφυγον
  choice: 逃げ出し
  rationale: φεύγωの基本的な意味を保ち、危険や恐れを感じてその場から離れたという叙述に合う表現とした。
- source_word: ἀπήγγειλαν
  choice: そのことを知らせた
  rationale: 出来事を人々に伝えるというἀπαγγέλλωの報告・告知の意味を、文脈上の目的語を補って自然な日本語で表した。
- source_word: εἰς τὴν πόλιν
  choice: 町に
  rationale: εἰςの方向性を「に」で表し、知らせが町へ伝えられたことを示した。
- source_word: καὶ εἰς τοὺς ἀγρούς
  choice: や周辺の農村に
  rationale: ἀγροίは字義的には「畑」だが、「町」と対置され、周囲の田園地域を指す。現代日本語で地理的対照が明確になるよう「周辺の農村」とした。
theological_decisions: []
