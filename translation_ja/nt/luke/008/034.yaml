  naturalness: 全体として明瞭な現代標準日本語である。ただし「農村」は集落を指しやすく、ἀγρούς の町に対する周辺の農耕・田園地域という広がりを表すには「田園地域」のほうが自然で正確である。
  terminology: 「逃げ出し」「そのことを知らせた」は叙述文として適切である。「豚の世話をしていた者たち」は、羊飼いを連想させず、当該文脈の飼育者を自然に示す。脚注の「畑々」は現代日本語として不自然なので、字義を「畑（複数）」と明示する。
