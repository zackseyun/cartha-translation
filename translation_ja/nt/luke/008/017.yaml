  text: οὐ γάρ ἐστιν κρυπτὸν ὃ οὐ φανερὸν γενήσεται, οὐδὲ ἀπόκρυφον ὃ οὐ ⸂μὴ γνωσθῇ⸃ καὶ εἰς φανερὸν ἔλθῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/017.yaml
  text: For nothing is hidden that will not become evident[c][b][a], nor is anything secret that will not be known and come to light.
translation:
  language: ja
  text: 隠されていて明らかにならないものはなく、秘密にされていて知られず、明るみに出ないものもないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρυπτὸν
  choice: 隠されているもの
  rationale: 隠された、覆われた状態を自然な現代日本語で表し、後半の「秘密にされているもの」と緩やかに区別した。
- source_word: φανερὸν γενήσεται
  choice: 明らかにならない
  rationale: γίνομαιの状態変化を「明らかになる」で示し、κρυπτόνとの対照を保った。日本語の否定関係節「〜ないものはなく」によって原文の意味を自然に伝えた。
- source_word: ἀπόκρυφον
  choice: 秘密にされているもの
  rationale: κρυπτόνとの平行性を保ちつつ、語彙上のわずかな違いを「秘密にされている」で表した。
- source_word: οὐ μὴ γνωσθῇ
  choice: 知られて…ないものはない
  rationale: 強い否定を、日本語では否定関係節と「ものはない」の組み合わせで表現し、秘密が知られないまま残ることはないという趣旨を保った。
- source_word: εἰς φανερὸν ἔλθῃ
  choice: 明るみに出る
  rationale: 公然と現れることを表す自然で格調ある日本語の慣用表現を採用した。
- source_word: γάρ
  choice: からです
  rationale: 直前の教えに根拠・説明を与える接続機能を、文末形式で明確に示した。
theological_decisions:
- issue: 開示の言葉が指す範囲
  choice: 隠されたものや秘密がやがて開示されるという一般的原則として訳す。
  alternative: 終末の裁きにおける開示、またはイエスの教えが明らかにされることに限定して訳す。
  rationale: 節自体は時期や具体的対象を限定していないため、広い表現を維持し、特定の神学的適用に狭めなかった。
translation_notes:
  register: 明快な現代標準日本語。二つの平行節を保ちつつ、「隠されている／秘密にされている」「明らかになる／明るみに出る」で原文の語彙的な変化を反映した。説明を表すγάρは自然な「からです」とした。
