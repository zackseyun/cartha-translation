id: LUK.8.50
reference: Luke 8:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἀκούσας ἀπεκρίθη ⸀αὐτῷ· Μὴ φοβοῦ, μόνον ⸀πίστευσον, καὶ σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/050.yaml
  text: But Jesus[a], hearing this, answered him, “Do not fear; only believe[b], and she will be saved.”
translation:
  language: ja
  text: しかし、イエスはそれを聞いて、彼に答えた。「恐れるな。ただ信じなさい[a]。そうすれば、娘は救われる[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ただ信頼しなさい」または「ただ信仰を持ちなさい」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「娘は癒やされる」または「娘は助かる」。ギリシア語の動詞は「救う」「助ける」「癒やす」を意味し得る。この文脈では、死からの回復を含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: それを聞いて
  rationale: アオリスト分詞の先行する動作を自然な日本語で表し、文脈上聞いた知らせを「それ」で補った。
- source_word: ἀπεκρίθη αὐτῷ
  choice: 彼に答えた
  rationale: 与格の間接目的語を明示し、標準的かつ簡潔な日本語とした。
- source_word: Μὴ φοβοῦ
  choice: 恐れるな
  rationale: μήを伴う現在命令形の禁止を、簡潔で威厳のある直接命令として訳した。
- source_word: μόνον πίστευσον
  choice: ただ信じなさい
  rationale: μόνονの限定を「ただ」で保ち、πιστεύωを基本的な対応語「信じる」で訳した。単なる知的同意に限定されない含みは脚注で示す。
- source_word: σωθήσεται
  choice: 娘は救われる
  rationale: σῴζωの「救う」という広い語義と神学的響きを保持した。日本語では主語を補わないと曖昧になりやすいため、文脈上の娘を明示した。
theological_decisions:
- issue: πιστεύωによる命令の訳し方
  choice: 信じなさい
  alternative: 信頼しなさい／信仰を持ちなさい
  rationale: 原語に最も直接的な日本語を本文に置きつつ、関係的な信頼の含みを狭めないよう異訳を脚注に残した。
- issue: 死の知らせを受けた場面での σωθήσεται の訳し方
  choice: 救われる
  alternative: 癒やされる／助かる
  rationale: この場面では身体的回復、さらには死からの回復が前景にあるが、σῴζωのより広い「救う」の響きを本文で保持し、文脈に即した訳を脚注に示した。
- issue: καίの談話上の機能
  choice: そうすれば
  alternative: そして
  rationale: 命令に続く結果・帰結として自然に理解できるため「そうすれば」としたが、信仰を機械的な功績や原因として断定する意図はない。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの命令は簡潔で威厳ある調子にした。「恐れるな」はやや格調があるが、現代の一般読者にも十分理解できる。「娘」は直前の文脈から補足した。
