  source_fidelity: 原文の分詞句（ἀκούσας）を「それを聞いて」と自然に表し、ἀπεκρίθη αὐτῷを「彼に答えた」としている。命令「恐れるな。ただ信じなさい」はΜὴ φοβοῦ、μόνον πίστευσονを適切に反映する。「そうすれば、娘は救われる」はκαίに伴う帰結を自然に示し、σωθήσεταιの受動未来と広い語義を保っている。『娘』は原文では文脈から含意されるが、直前の物語上の指示対象を明確にする安全な補足である。
  naturalness: 明瞭な現代標準語であり、直接命令としての簡潔さと重みも保たれている。「恐れるな」は現代読者にも通じる自然なやや格調ある表現である。「そうすれば」はこの文脈で無理なく結果を示す。
  terminology: πιστεύωを本文で「信じなさい」とし、脚注で「信頼しなさい」「信仰を持ちなさい」を示す扱いは適切である。σωθήσεταιを「救われる」として語彙的・神学的な広がりを狭めず、脚注で「癒やされる」「助かる」という文脈上有力な可能性を示している。固有名「イエス」も標準的である。
