source:
  edition: SBLGNT
  text: ⸂ἀπηγγέλη δὲ⸃ ⸀αὐτῷ· Ἡ μήτηρ σου καὶ οἱ ἀδελφοί σου ἑστήκασιν ἔξω ἰδεῖν ⸂σε θέλοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/020.yaml
  text: And it was reported to him[a], “Your mother and your brothers are standing outside, wanting to see you.”
translation:
  language: ja
  text: すると、イエスにこう知らせがあった。「あなたのお母様とご兄弟たち[a]が、あなたにお会いしたくて、外に立っておられます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈によっては「親族たち」と広く理解することもできるが、ギリシア語は通常「兄弟たち」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπηγγέλη
  choice: 知らせがあった
  rationale: アオリスト受動形が表す「知らせがもたらされた」という意味を、受動の趣旨を保ちながら自然な現代日本語で表した。
- source_word: δὲ
  choice: すると
  rationale: 物語を穏やかに先へ進める接続辞であり、ここでは場面の推移を自然に示す。強い逆接にはしない。
- source_word: αὐτῷ
  choice: イエスに
  rationale: ギリシア語では代名詞だが、日本語では主語の参照先を明示したほうが自然で分かりやすいため、文脈上の指示対象を示した。
- source_word: μήτηρ
  choice: お母様
  rationale: イエス本人への報告という直接話法に合う、自然で敬意ある呼称とした。
- source_word: ἀδελφοί
  choice: ご兄弟たち
  rationale: 男性複数形の通常の意味である「兄弟」を保ち、親族などと解釈的に広げなかった。直接話法に合わせて接頭辞「ご」を添えた。
- source_word: ἑστήκασιν
  choice: 立っておられます
  rationale: 完了形の現在状態を「立っている」として表し、報告対象への敬意に即した自然な敬語にした。
- source_word: ἔξω
  choice: 外に
  rationale: 場所を特定せず、原文の簡潔な空間表現をそのまま保った。
- source_word: ἰδεῖν
  choice: 会いたい
  rationale: 基本義は「見る」だが、人を訪ねて見るという文脈では、日本語の「会う」が意図を最も自然かつ過不足なく伝える。話すことなどは付加していない。
- source_word: θέλοντες
  choice: 会いたいと
  rationale: 母と兄弟たちの現在の願望を、現代日本語の自然な表現で示した。
theological_decisions:
- issue: イエスとの関係における「兄弟」の指示範囲
  choice: ἀδελφοίを「ご兄弟たち」と訳し、本文では解釈的に拡張しない。
  alternative: 親族たち
  rationale: この語は通常「兄弟」を意味する。この箇所だけでは家族関係をめぐる神学的議論を決着できないため、通常の語義を本文に置き、より広い理解の可能性は注に示した。
translation_notes:
  register: 明瞭な現代標準語を用い、直接話法ではイエスへの報告として自然な敬語を採用した。全体は簡潔で品位ある物語調とし、原文にない場所や用件は補っていない。
