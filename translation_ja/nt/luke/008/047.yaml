  to: 女は、自分のしたことが隠し通せなかったと分かると[a]、震えながら進み出て、イエスの前にひれ伏した[b]。そして、なぜイエスに触れたのか、また、どのようにしてたちどころに癒やされたのかを、民全体の前で語った。
  rationale: 本文は、οὐκ ἔλαθενが示す「すでに気づかれずには済まなかった」という認識を明確にし、δὲに強い逆接を読み込まないよう接続を整えた。それ以外は原文への忠実さと自然な現代日本語を保っている。脚注aも本文の相に合わせ、脚注bは「足もと」を原文にない明示事項として扱わず、姿勢の代案を示した。
