review_pass:
  verdict: revise
  source_fidelity: 全体として、女が露見したと悟り、震えながらイエスの前にひれ伏し、触れた理由と即時の癒やしを人々の前で告げた、というギリシア語の叙述をよく保っている。ただし「隠し通せない」は未来的・可能的にも読め、οὐκ ἔλαθεν（すでに気づかれずには済まなかった／隠れたままではなかった）の完了した認識をやや弱める。
  naturalness: 明瞭な現代標準日本語であり、「震えながら」「イエスの前にひれ伏した」「たちどころに癒やされた」は自然で、物語文としても適切である。「ところが」はδὲの弱い接続に比べて多少強い逆接を示し得るため、「女は」に改めると不要な対比を避けられる。
  terminology: 「イエス」「癒やされた」「ひれ伏した」は適切である。「民全体」は聖書的な響きを持つが意味は明瞭で、παντὸς τοῦ λαοῦの全体性を保つ。礼拝・悔い改めなどの神学的解釈は付加していない。
  issues:
  - severity: medium
    issue: οὐκ ἔλαθενの時制・相の表現
    rationale: 「自分のしたことが隠し通せないと分かると」は、これから隠し通せないと判断した意味にもなり得る。原文は、すでに自分が気づかれずには済まなかったことを認識した場面であるため、「隠し通せなかったと分かると」とするのがより正確である。
  - severity: low
    issue: 接続詞「ところが」
    rationale: δὲはここでは強い逆接を必ずしも要求しない。「ところが」は前節との対比を強め得るため、省いて自然な叙述にするほうが中立的である。
  - severity: low
    issue: 脚注aの代案が原文の完了した状況を十分に示さない
    rationale: 「気づかれずにはいられない」「隠れてはいられない」は可能・将来の含みを持つ。「気づかれずには済まなかった」「隠れていたのではない」のように、既に露見している認識を示すほうがよい。
