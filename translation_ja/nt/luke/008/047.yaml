id: LUK.8.47
reference: Luke 8:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοῦσα δὲ ἡ γυνὴ ὅτι οὐκ ἔλαθεν τρέμουσα ἦλθεν καὶ προσπεσοῦσα αὐτῷ δι’ ἣν αἰτίαν ἥψατο αὐτοῦ ⸀ἀπήγγειλεν ἐνώπιον παντὸς τοῦ λαοῦ καὶ ὡς ἰάθη παραχρῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/047.yaml
  text: And when the woman saw that she had not escaped notice[a], she came trembling, and falling down before him[b], declared before all the people why she had touched him and how she had been healed immediately.
translation:
  language: ja
  text: 女は、自分のしたことが隠し通せなかったと分かると[a]、震えながら進み出て、イエスの前にひれ伏した[b]。そして、なぜイエスに触れたのか、また、どのようにしてたちどころに癒やされたのかを、民全体の前で語った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分が気づかれずには済まなかったと分かると」または「自分が隠れていたのではないと分かると」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエスの前に身を投げ出した」。ギリシア語は文字どおりには「彼の前に倒れた」で、「足」は明記していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοῦσα
  choice: 分かると
  rationale: 直訳的な「見ると」よりも、ここでは自分の行為が知られたと悟ったという認識の意味を自然な日本語で表す。アオリスト分詞の時間的関係も「〜と」で保持した。
- source_word: οὐκ ἔλαθεν
  choice: 自分のしたことが隠し通せない
  rationale: λανθάνωの「気づかれずにいる、隠れたままでいる」という意味を文脈に即して表現した。誰の目を逃れられなかったかを本文以上に限定しない。
- source_word: τρέμουσα
  choice: 震えながら
  rationale: 身体的・感情的状態を描く現在分詞の vividness を保ち、「恐れて」と心理だけに限定しない。
- source_word: προσπεσοῦσα αὐτῷ
  choice: イエスの前にひれ伏した
  rationale: προσπίπτωが示す、相手の前に身を投げ出す姿勢を自然かつ荘重に表した。「足もと」は含意され得るが、原文に明記されていないため本文には加えない。
- source_word: δι’ ἣν αἰτίαν
  choice: なぜ
  rationale: 「どのような理由で」を簡潔で自然な現代日本語にした。
- source_word: ἥψατο αὐτοῦ
  choice: イエスに触れた
  rationale: ἅπτομαι＋属格の基本義「触れる」を採用した。日本語では前後関係が明瞭なため、過去完了に相当する補足を加えない。
- source_word: ἀπήγγειλεν
  choice: 語った
  rationale: 公の場で事情を告げ知らせる意味を、過度に硬くない現代日本語で表した。
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: 民全体の前で
  rationale: ἐνώπιονの「面前で」とπαντὸς τοῦ λαοῦの全体性を簡潔に保持した。
- source_word: ὡς ἰάθη
  choice: どのようにして…癒やされたのか
  rationale: ὡςが癒やしのありさまを導く可能性を保ち、単なる「癒やされたこと」と断定的に平板化しない。
- source_word: παραχρῆμα
  choice: たちどころに
  rationale: 即時性を明確に示しつつ、聖書叙述にふさわしい自然で品位ある日本語とした。
theological_decisions:
- issue: 女がひれ伏した行為の性質
  choice: 姿勢を叙述するにとどめ、「礼拝した」「悔い改めた」とは訳さない
  alternative: 礼拝した／悔い改めて告白した
  rationale: 原文は震え、イエスの前にひれ伏し、公に事情を語ったことを述べるが、その行為を礼拝や悔い改めと明示してはいないため、神学的意味を補わない。
- issue: οὐκ ἔλαθενの含意
  choice: 行為を隠し通せないと悟ったこととして訳す
  alternative: イエスの目を逃れられなかった／自分自身が隠れていられなかった
  rationale: 文脈上はいずれも関連するが、原文の省略を一つの解釈に限定せず、行為が露見したという中心的含意を表す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語の緊張感と公の場での証言という荘重さを保った。人物の指示対象を明確にするため、代名詞は「イエス」とした。「癒やす」は常用的な表記として送り仮名を伴う「癒やす」を採用した。
