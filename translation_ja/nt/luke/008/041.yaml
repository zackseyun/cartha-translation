  text: καὶ ἰδοὺ ἦλθεν ἀνὴρ ᾧ ὄνομα Ἰάϊρος, καὶ ⸀οὗτος ἄρχων τῆς συναγωγῆς ὑπῆρχεν, καὶ πεσὼν παρὰ τοὺς πόδας ⸀τοῦ Ἰησοῦ παρεκάλει αὐτὸν εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/041.yaml
  text: And behold, a man named Jairus came, and he was a ruler of the synagogue; and falling at Jesus's feet, he begged him to come into his house,
translation:
  language: ja
  text: 見よ、ヤイロという名の人がやって来た。この人は会堂の責任者であった。彼はイエスの足もとにひれ伏し、自分の家に来てくださるよう懇願した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面への注意を促す叙述上の合図を保持しつつ、現代日本語でも聖書本文として自然で荘重な表現とした。
- source_word: ἄρχων τῆς συναγωγῆς
  choice: 会堂の責任者
  rationale: ἄρχωνはここでは会堂の運営を担う指導的役職を指す。「会堂司」より一般読者に明瞭で、「指導者」より職務上の立場を自然に示す。
- source_word: πεσὼν παρὰ τοὺς πόδας τοῦ Ἰησοῦ
  choice: イエスの足もとにひれ伏し
  rationale: 直訳的な「足もとに倒れ」より、敬意と切迫した願いを伴う姿勢を自然な日本語で表す。
- source_word: παρεκάλει
  choice: 懇願した
  rationale: 継続的・切実に願い求める語感を簡潔に伝える。
- source_word: εἰσελθεῖν εἰς τὸν οἶκον αὐτοῦ
  choice: 自分の家に来てくださるよう
  rationale: 字義は「彼の家に入る」だが、日本語では訪問を願う文脈に即して自然に表現し、敬語はヤイロがイエスに向けた願いとして用いた。
theological_decisions: []
