source:
  edition: SBLGNT
  text: ⸀Παρεγένετο δὲ πρὸς αὐτὸν ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ, καὶ οὐκ ἠδύναντο συντυχεῖν αὐτῷ διὰ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/019.yaml
  text: Then his mother and his brothers came to him[b][a], but they were not able to reach him because of the crowd.
translation:
  language: ja
  text: さて、イエスの母と兄弟たち[b]がイエスのもとへやって来たが、群衆のためにイエスに会うことができなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスのところまで行くことができなかった」または「イエスに近づくことができなかった」。
    reason: lexical_alternative
  - marker: b
    text: 原文は「兄弟たち」。これをより広く「親族」や「近親者」と解する見方もあるが、原文そのものは「兄弟たち」と述べている。
    reason: alternative_reading
lexical_decisions:
- source_word: Παρεγένετο δὲ πρὸς αὐτὸν
  choice: さて、…イエスのところに来た
  rationale: δέによる場面の進展を「さて」で自然に示し、παραγίνομαιとπρὸς αὐτόνの到来・方向の意味を明確にした。代名詞は日本語で指示対象が曖昧にならないよう「イエス」とした。
- source_word: ἡ μήτηρ καὶ οἱ ἀδελφοὶ αὐτοῦ
  choice: イエスの母と兄弟たち
  rationale: μήτηρとἀδελφοίを通常の親族名称で訳した。ἀδελφοίは男性複数形なので、より広い親族関係に限定せず「兄弟たち」とした。
- source_word: οὐκ ἠδύναντο συντυχεῖν αὐτῷ
  choice: そばまで行くことができなかった
  rationale: συντυγχάνωは人に会う、接触する、行き着く意を持つ。群衆が妨げとなる文脈では、本人のそばまで行けなかったという具体的状況を自然な日本語で表す。別訳の可能性は脚注に残した。
- source_word: διὰ τὸν ὄχλον
  choice: 群衆に阻まれて
  rationale: διά＋対格の原因を示しつつ、群衆のため接近できなかった因果関係を簡潔で自然に表した。
theological_decisions:
- issue: οἱ ἀδελφοὶ αὐτοῦが示す親族関係
  choice: 「兄弟たち」と本文どおりに訳す
  alternative: 「親族たち」「身内の者たち」
  rationale: ἀδελφοίの通常の意味を保持し、生物学上の兄弟、異父・異母兄弟、その他の近親者のいずれかという教理上・歴史上の議論を本文で決着させない。
translation_notes:
  register: 明快な現代標準日本語を用い、叙事の品位を保った。「そばまで行く」は日常的で理解しやすい一方、口語に傾きすぎない表現。すべての脚注記号を本文に付した。
