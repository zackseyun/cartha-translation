  to: 悪霊たちが出て行ったその人は、イエスと一緒にいたいと、しきりに願った。だが、イエスはその人を送り出して、こう言った。
  rationale: 「送り出して」によりἀπέλυσενの「去らせる／送り去る」という叙述を保ち、次節で初めて示される帰宅の指示を先取りしないようにした。「悪霊たち」はδαιμόνιαの複数を自然で中立的な現代日本語として表す。他の要素は、ἐδεῖτοの継続的な切実さ、ἐξεληλύθειの先行完了、そして次節の発話導入を適切に表している。
