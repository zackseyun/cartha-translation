review_pass:
  verdict: revise
  source_fidelity: 主文の意味と時制関係は概ね適切です。ただし、ἀπέλυσεν は「帰らせる」より一般に「送り出す／去らせる」を表し、この節単独では帰宅先を明示していません（帰宅は次節で明示されます）。そのため「帰らせ」はわずかに先取りとなります。
  naturalness: 全体として明快な現代標準日本語です。「悪霊ども」は意味を通しますが、「ども」には集合的複数以上に軽蔑的・粗い響きがあり、叙述文の標準的な訳語としては「悪霊たち」または文脈上の無標の「悪霊」のほうが自然です。
  terminology: δαιμόνιαは「悪霊」として保持し、超自然的存在という本文の描写を曖昧化していません。複数は「悪霊たち」で自然に示せます。イエスの名を補うことは、二つの指示語の対象を明確にするために許容されます。
