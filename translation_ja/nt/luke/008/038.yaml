  text: ἐδεῖτο δὲ αὐτοῦ ὁ ἀνὴρ ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια εἶναι σὺν αὐτῷ· ἀπέλυσεν δὲ ⸀αὐτὸν λέγων·
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/038.yaml
  text: The man from whom the demons had gone out was begging him to be with him, but he sent him away, saying,
translation:
  language: ja
  text: 悪霊たちが出て行ったその人は、イエスと一緒にいたいと、しきりに願った。だが、イエスはその人を送り出して、こう言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεῖτο
  choice: しきりに願った
  rationale: 未完了過去形が示す継続的・反復的な懇願を、現代日本語として自然に表す。「願った」だけより切実さと継続性を保つ。
- source_word: ὁ ἀνὴρ
  choice: その人
  rationale: 直前まで語られていた男性を指す。日本語では文脈上性別が明らかであり、「その男」より自然で尊厳のある表現となる。
- source_word: ἀφ’ οὗ ἐξεληλύθει τὰ δαιμόνια
  choice: 悪霊どもが出て行ったその人
  rationale: 完了過去形による、主動詞より前に完了した出来事を文脈上明確に示す。「出て行った」はἐξέρχομαιの移動表現を保つ。
- source_word: τὰ δαιμόνια
  choice: 悪霊ども
  rationale: 新約聖書の文脈で人格的な超自然的存在を指す語として明瞭である。複数形は「ども」で示すが、蔑称を付加するというより集合的複数を自然に表している。
- source_word: εἶναι σὺν αὐτῷ
  choice: イエスと一緒にいたい
  rationale: 「彼と共にいること」を自然な願望表現にした。二つのαὐτόςが続くため、指示対象を明確にする目的で「イエス」と明示した。同行や弟子入りなど、本文に明記されない意味は加えない。
- source_word: ἀπέλυσεν
  choice: 帰らせ
  rationale: 願いを退けて別の場所へ行かせる文脈を自然に表す。「解放した」ではこの場面での方向づけが弱く、「追い払った」では過度に強い。
- source_word: λέγων
  choice: こう言った
  rationale: 次節の直接話法を導く現在分詞を、現代日本語の自然な物語表現にした。
theological_decisions:
- issue: 悪霊追放の文脈におけるδαιμόνιαの訳語
  choice: 悪霊ども
  alternative: 悪い霊たち／悪鬼ども
  rationale: 本文が人格的な超自然的存在として描くものを曖昧化せず、現代日本語の聖書語彙として理解しやすい「悪霊」を用いた。病気や心理状態への還元は行わない。
translation_notes:
  register: 明快で現代的な標準日本語を用いつつ、物語としての格調を保った。δὲは二つ目のみ対比を示す「しかし」とし、冒頭には原文にない時間副詞や不必要な談話標識を加えていない。節末は次節の発言を導く構造が分かるよう「こう言った」とした。
