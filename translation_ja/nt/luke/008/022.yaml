source:
  edition: SBLGNT
  text: ⸂Ἐγένετο δὲ⸃ ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ, καὶ εἶπεν πρὸς αὐτούς· Διέλθωμεν εἰς τὸ πέραν τῆς λίμνης, καὶ ἀνήχθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/022.yaml
  text: It happened on one of those days that he got into a boat[a], and his disciples with him, and he said to them[b], “Let us go across to the other side of the lake.” And they set out.
translation:
  language: ja
  text: ある日のこと、イエスは弟子たちとともに舟に乗り、彼らに言った。「湖の向こう岸へ渡ろう。[a]」そこで、一行は舟を出した。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「湖の反対側へ渡ろう。」
    reason: lexical_alternative
  - marker: b
    text: 原語の動詞は、舟を岸から出すこと、または出航することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ある日のこと
  rationale: ルカに多い物語の導入表現。直訳調の「そして、起こった」を避け、続く時の句と合わせて自然な現代日本語の場面転換とした。δέの弱い接続機能は文脈に委ねた。
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: ある日のこと
  rationale: 特定の期間内の不定の一日を示す慣用表現。「ある日」よりも物語の導入として自然で、部分を表す意味も保つ。
- source_word: καὶ αὐτὸς ἐνέβη εἰς πλοῖον καὶ οἱ μαθηταὶ αὐτοῦ
  choice: イエスは弟子たちとともに舟に乗り
  rationale: 日本語で代名詞だけにすると指示対象が不明瞭になりやすいため、文脈上の指示対象を「イエス」と明示した。καίによる同行の関係は「弟子たちとともに」で自然に表した。
- source_word: εἶπεν πρὸς αὐτούς
  choice: 彼らに言われた
  rationale: πρόςの相手を「彼らに」で明示し、現代日本語として自然でありながら、イエスへの敬意を保つ表現とした。
- source_word: Διέλθωμεν
  choice: 渡ろう
  rationale: 一人称複数の勧奨的接続法を、簡潔で自然な提案の形「渡ろう」で表した。
- source_word: εἰς τὸ πέραν τῆς λίμνης
  choice: 湖の向こう岸へ
  rationale: πέρανの対岸・反対側という意味と、λίμνηが湖を指すことを明確に保った。
- source_word: ἀνήχθησαν
  choice: 一行は舟を出した
  rationale: 航海用法のἀνάγωを、湖上へ出発したことが明確に伝わる日本語で表した。「彼らは」ではイエスの発言相手だけを指すようにも読めるため、乗船者全体を示す「一行は」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語文としての品位を保った。主語の反復を抑えつつ、指示対象が曖昧にならないよう「イエス」と「一行」を補った。脚注記号は、それぞれ実際に説明する語句の直後に配置した。
