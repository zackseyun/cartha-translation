  text: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν λίμνην καὶ ἀπεπνίγη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/008/033.yaml
  text: Then the demons came out of the man and entered the pigs[a], and the herd rushed down the steep bank into the lake and drowned.
translation:
  language: ja
  text: そこで、悪霊どもはその人から出て豚の中に入った。すると、豚の群れは急な斜面[a]を駆け下りて湖に入り、おぼれ死んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「崖を下って」または「絶壁を越えて」とも訳せる。ギリシア語は急な下り斜面を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντα δὲ τὰ δαιμόνια ἀπὸ τοῦ ἀνθρώπου
  choice: そこで、悪霊どもはその人から出て
  rationale: アオリスト分詞による先行動作を、現代日本語で自然な出来事の順序として表した。「悪霊ども」は複数形 δαιμόνια を保ち、関連語の「汚れた霊」に置き換えていない。
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: 豚の中に入った
  rationale: εἰσέρχομαι と εἰς が示す内部への移動を明確にし、χοῖρος は現代語の「豚」とした。
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: 豚の群れは…駆け下りて
  rationale: ὁρμάω の突然で勢いのある動きを「駆け下りる」で自然に表し、単数主語 ἡ ἀγέλη は集合体として「豚の群れ」とした。
- source_word: κατὰ τοῦ κρημνοῦ
  choice: 急な斜面を
  rationale: κατά が示す下方への移動と κρημνός の急な地形を表しつつ、垂直の絶壁とまでは断定しない訳語を選んだ。
- source_word: εἰς τὴν λίμνην
  choice: 湖に入り
  rationale: λίμνη の通常の意味である「湖」を保ち、海を意味する語に置き換えなかった。
- source_word: ἀπεπνίγη
  choice: おぼれ死んだ
  rationale: 水中で窒息して死んだという文脈上の意味を、受け身にこだわらず自然で明確な日本語にした。
theological_decisions:
- issue: δαιμόνια の訳し分け
  choice: 悪霊ども
  alternative: 汚れた霊ども
  rationale: この節の語は δαιμόνια であり、関連はするが別の表現である「汚れた霊」に置換せず、本文の語彙上の区別を保った。
- issue: κρημνός が表す地形の具体性
  choice: 急な斜面
  alternative: 崖／絶壁
  rationale: 急な下りを示す地形として訳したが、本文が必ずしも垂直の絶壁を要求しないため、情景を過度に強めなかった。
translation_notes:
  register: 明快な現代標準日本語を用い、物語の勢いを保ちながらも地形や悪霊に関する表現を原文以上に具体化しないようにした。
