id: LUK.9.10
reference: Luke 9:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὑποστρέψαντες οἱ ἀπόστολοι διηγήσαντο αὐτῷ ὅσα ἐποίησαν. καὶ παραλαβὼν αὐτοὺς ὑπεχώρησεν κατ’ ἰδίαν εἰς ⸂πόλιν καλουμένην Βηθσαϊδά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/010.yaml
  text: And when the apostles returned[a], they reported to him what they had done. And taking them with him, he withdrew privately to a town called Bethsaida.
translation:
  language: ja
  text: さて、使徒たちは帰って来て、自分たちがしたことをすべてイエスに報告した。イエスは彼らを連れ、人々から離れて[a]、ベツサイダという町へ退かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ひそかに」または「別に」とも訳せる。群衆などほかの人々から離れたことを表し、イエスが完全に一人だったという意味ではない。
    reason: κατ’ ἰδίανの語義の幅と、使徒たちが同行していたという文脈を示すため。
lexical_decisions:
- source_word: ὑποστρέψαντες
  choice: 帰って来ると
  rationale: アオリスト分詞が主動詞に先立つ出来事を示すため、自然な時間表現で順序を伝えた。
- source_word: οἱ ἀπόστολοι
  choice: 使徒たち
  rationale: ルカ福音書の宣教の文脈で十二人を指す定着した呼称として訳した。
- source_word: διηγήσαντο αὐτῷ
  choice: イエスに報告した
  rationale: διηγέομαιの「詳しく語る、事の次第を話す」という意味を、派遣から戻った文脈に合う「報告した」で表した。代名詞の指示対象であるイエスを明示した。
- source_word: ὅσα ἐποίησαν
  choice: 自分たちが行ったことをすべて
  rationale: ὅσαが指す行為の総体を自然な日本語で表した。
- source_word: παραλαβὼν αὐτούς
  choice: 彼らを連れ
  rationale: παραλαμβάνωがここでは同行者として連れて行くことを意味するため。
- source_word: ὑπεχώρησεν
  choice: 退かれた
  rationale: 公の場や群衆から身を引く含意を保ちつつ、イエスを主語とする文脈にふさわしい自然で品位ある表現とした。
- source_word: κατ’ ἰδίαν
  choice: 人々から離れて
  rationale: 使徒たちも同行しているため、完全な単独行動とはせず、ほかの人々、とりわけ群衆から離れたという対比を表した。
- source_word: εἰς πόλιν καλουμένην Βηθσαϊδά
  choice: ベツサイダという町へ
  rationale: πόλιςを規模を誇張しない「町」とし、地名は標準的な日本語音写を用いた。
theological_decisions:
- issue: κατ’ ἰδίανが、使徒たちを伴うこととどう両立するか
  choice: 人々から離れて
  alternative: ひそかに／人目を避けて／別に
  rationale: 本文はイエスが使徒たちを連れたと明記するため、「一人で」とは訳さない。一方で、群衆や公の活動から離れて退いたという意味は保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、物語文として自然に読めるようにした。「さて」は場面の移行を示し、「退かれた」は過度に古風にならない範囲で品位を保つ敬語表現とした。脚注記号は、その説明対象であるκατ’ ἰδίανの訳語の直後に置いた。
