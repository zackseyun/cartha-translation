id: LUK.9.61
reference: Luke 9:61
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ καὶ ἕτερος· Ἀκολουθήσω σοι, κύριε· πρῶτον δὲ ἐπίτρεψόν μοι ἀποτάξασθαι τοῖς εἰς τὸν οἶκόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/061.yaml
  text: And another also said[a], “I will follow you, Lord[c][b], but first permit me to say farewell to those in my house.”
translation:
  language: ja
  text: また、別の人も言った。「主よ、私はあなたに従います。ですが、まず家にいる者たちに別れを告げることをお許しください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ καὶ ἕτερος
  choice: また、別の人も
  rationale: 前の対話にさらに一人を加える接続・添加の力を、自然な現代日本語で表した。
- source_word: Ἀκολουθήσω σοι
  choice: 私はあなたに従います
  rationale: 未来形による話者の意志表明を、明確で自然な丁寧体として訳した。
- source_word: κύριε
  choice: 主よ
  rationale: イエスへの敬意ある呼びかけと神学的含意の可能性を保ち、「先生」などに限定しなかった。
- source_word: πρῶτον
  choice: まず
  rationale: 行為の優先順位を示す副詞として簡潔かつ自然に訳した。
- source_word: ἐπίτρεψόν μοι
  choice: お許しください
  rationale: 許可を求めるアオリスト命令形を、呼びかけにふさわしい丁寧な願いとして表した。
- source_word: ἀποτάξασθαι
  choice: 別れを告げる
  rationale: この文脈での中動態不定詞は、離別の挨拶をする、いとまを告げる意である。
- source_word: τοῖς εἰς τὸν οἶκόν μου
  choice: 家にいる者たちに
  rationale: 字義的には特異な前置詞句だが、家にいる、または家に属する人々を指す。固定的な社会単位としての「家族」に狭めず、自然に表現した。
theological_decisions:
- issue: イエスへの呼びかけ κύριε の訳
  choice: 主よ
  alternative: 先生／だんな様
  rationale: 単なる敬称からより深い認識までを含み得るルカの用法上の幅を保持し、神学的緊張を一方向に解消しない。
translation_notes:
  register: 明瞭で現代的な標準日本語の丁寧体を用い、直接話法には簡潔さと品位を持たせた。「ですが」は、従うとの表明に続く留保を自然に示す。
