  text: καὶ οὐκ ἐδέξαντο αὐτόν, ὅτι τὸ πρόσωπον αὐτοῦ ἦν πορευόμενον εἰς Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/053.yaml
  text: And they did not receive him[b][a], because his face was going toward Jerusalem.
translation:
  language: ja
  text: 彼らはイエスを迎え入れなかった[a]。イエスが顔をエルサレムへ向けて進んでいたからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「受け入れなかった」。ここでは、客として歓迎し、もてなすことを拒んだという意味と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「その顔がエルサレムへ進んでいた」。エルサレムへ向かう定まった方向性を表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδέξαντο
  choice: 迎え入れなかった
  rationale: δέχομαιには「受け入れる」「歓迎する」の意味がある。この旅の文脈では、村人たちがイエスを客として迎えず、もてなしを拒んだことを自然に表す。
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: イエスが顔を
  rationale: πρόσωπονの具体的な語感を残しつつ、日本語として理解できる「顔を…向けて」という表現に組み替えた。単に「イエスは」とせず、原文の印象的な言い回しを保つ。
- source_word: ἦν πορευόμενον
  choice: 向けて進んでいた
  rationale: 迂言的な未完了形は、エルサレムへ向かう途上にあった継続的な動きを示す。「決意していた」と解釈を固定せず、πορεύομαιの移動の意味を明示した。
- source_word: εἰς Ἰερουσαλήμ
  choice: エルサレムへ
  rationale: 目的地への方向を示すεἰςを、簡潔で自然な日本語の「へ」で表した。
- source_word: ὅτι
  choice: からである
  rationale: 彼らが迎え入れなかった理由を導く因果関係を、明瞭な現代日本語で示す。
- source_word: καί
  choice: しかし
  rationale: 直前の使者による準備の働きに対し、村人たちが迎え入れなかったという逆接的な展開を、日本語で自然に示した。
theological_decisions:
- issue: 「その顔がエルサレムへ進んでいた」という表現の含意
  choice: 「イエスが顔をエルサレムへ向けて進んでいた」とし、方向性と実際の旅の動きをともに残す。
  alternative: 「イエスはエルサレムへ行く決意を固めていた」または、逐語的に「その顔がエルサレムへ進んでいた」とする。
  rationale: この表現には確固とした方向性が響く可能性があるが、ここでのπορευόμενον自体は「進む、旅をする」を表す。決意という解釈だけに限定せず、原文の「顔」と移動の両要素を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、簡潔で格調を保った。「顔を…向けて進んでいた」により、原文のセム語的な響きを完全には平板化せず、日本語としての自然さも確保した。
