  text: καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς· Αἱ ἀλώπεκες φωλεοὺς ἔχουσιν καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνώσεις, ὁ δὲ υἱὸς τοῦ ἀνθρώπου οὐκ ἔχει ποῦ τὴν κεφαλὴν κλίνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/058.yaml
  text: And Jesus said to him[a], “Foxes have dens, and the birds of the sky have nests[c][b], but the Son of Man has nowhere to lay his head.”
translation:
  language: ja
  text: イエスはその人に言われた。「狐には穴があり、空の鳥には巣がある。しかし、人の子には頭を横たえる場所がない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人の子」はイエスがご自身を指して用いた呼び名で、ダニエル書7章13～14節を思わせる可能性がある。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλώπεκες
  choice: 狐
  rationale: 動物名をそのまま明瞭に訳した。
- source_word: φωλεοὺς
  choice: 穴
  rationale: 狐のねぐらを指す語。日本語では「狐には穴がある」が自然で、具体的な像も保てる。
- source_word: πετεινὰ τοῦ οὐρανοῦ
  choice: 空の鳥
  rationale: οὐρανόςを文脈に即して「空」とし、属格表現を簡潔に保った。
- source_word: κατασκηνώσεις
  choice: 巣
  rationale: 本来は宿る場所・住み場所を表すが、鳥については「巣」が最も自然である。
- source_word: υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した表現を保持し、ダニエル書との響きを解釈で狭めない。
- source_word: οὐκ ἔχει ποῦ
  choice: 場所もない
  rationale: 直訳的には「どこに…すべきかを持たない」だが、日本語の否定表現として自然に訳した。「も」により、動物との対比と欠如を示す。
- source_word: τὴν κεφαλὴν κλίνῃ
  choice: 頭を横たえる
  rationale: 具体的な身体像を保ちつつ、休息や寝場所を含意する自然で格調ある日本語とした。
- source_word: δὲ
  choice: しかし
  rationale: 動物には住み場所がある一方、人の子にはないという明確な対比を表す。
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: イエスはその人に言われた
  rationale: 語順は自然な日本語に整え、敬体ではなく聖書本文に適した尊敬表現「言われた」を用いた。
theological_decisions:
- issue: イエスの自己呼称 υἱὸς τοῦ ἀνθρώπου の訳
  choice: 人の子
  alternative: 人間の子／人なる者
  rationale: 伝統的かつ広く認知された「人の子」を用い、単なる人間一般とも、特定のメシア称号だけとも断定せず、自己呼称の含意とダニエル7章への可能な響きを保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの発言には簡潔で dignified な調子を保った。「頭を横たえる」は日常的すぎず古風すぎない表現。脚注標識[a]は対応箇所である文末に置いた。
