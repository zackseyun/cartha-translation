source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ συμπληροῦσθαι τὰς ἡμέρας τῆς ἀναλήμψεως αὐτοῦ καὶ αὐτὸς τὸ ⸀πρόσωπον ⸀ἐστήρισεν τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/051.yaml
  text: It happened[a], when the days of his being taken up were being fulfilled[b], that he set his face to go to Jerusalem.
translation:
  language: ja
  text: そして、イエスが上げられる時期が満ちようとしていたころ、イエスはエルサレムへ行くことを固く決意した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上げられる」は「昇天する」とも訳せる。ギリシア語は文字どおりには「彼が上げられること」と言っている。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: そして、…ころ
  rationale: 物語をつなぐ定型表現。独立した「出来事が起こった」とはせず、δέの接続性と時間節を自然な現代日本語の文構造で表した。
- source_word: ἐν τῷ συμπληροῦσθαι
  choice: …時が満ちようとしていたころ
  rationale: 時間を示す構文と、完了へ向かう現在不定詞の進行的な意味を保つ。「近づいた」だけに弱めず、満ちるというルカ的な表現も残した。
- source_word: τὰς ἡμέρας
  choice: 時
  rationale: 原文は複数形で直訳すれば「日々」だが、日本語で「上げられる日々」は不自然で、出来事までの期間とも誤解されやすい。定められた期間を自然に示す「時」とした。
- source_word: τῆς ἀναλήμψεως αὐτοῦ
  choice: イエスが上げられる
  rationale: 名詞ἀνάλημψιςの受動的な「上げられること」を保ち、「昇天」だけに限定しない。指示対象を明確にするため、文脈上の「彼」を「イエス」とした。
- source_word: καὶ αὐτὸς
  choice: イエスは自ら
  rationale: αὐτόςの強調を「自ら」で表し、イエスの主体的で決然とした行動を示した。
- source_word: τὸ πρόσωπον ἐστήρισεν
  choice: 顔を固く向けた
  rationale: 決意を表すセム語的な比喩を残しつつ、ἐστήρισενの確固とした意味を「固く」で伝えた。意味は脚注で説明する。
- source_word: τοῦ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: エルサレムへ行こうと
  rationale: 目的を表す不定詞構文を、日本語で自然な意志・目的表現にした。目的地への方向も明確に保った。
theological_decisions:
- issue: ἀνάλημψιςが指す範囲
  choice: 「上げられる」と広く訳す
  alternative: 「昇天する」または「天に上げられる」
  rationale: 語は文字どおりには「上げられること」を意味する。昇天を指す解釈は有力だが、エルサレムでの受難、復活、昇天へ至る一連の出来事を視野に入れる可能性を本文で狭めない。
- issue: 「顔を固く向けた」という比喩
  choice: 比喩を本文に残す
  alternative: 「固く決意した」
  rationale: イエスの揺るがない決意を伝えると同時に、預言書的な表現の響きを保つ。日本語での意味は脚注により明確にする。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、原文の「満ちる」「顔を固く向ける」という文学的表現を保持した。敬語的な補いは避け、簡潔で品位ある叙述とした。
