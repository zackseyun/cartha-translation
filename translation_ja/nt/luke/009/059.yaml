id: LUK.9.59
reference: Luke 9:59
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς ἕτερον· Ἀκολούθει μοι. ὁ δὲ εἶπεν· ⸀Κύριε, ἐπίτρεψόν μοι ⸂ἀπελθόντι πρῶτον⸃ θάψαι τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/059.yaml
  text: Then he said to another[a], “Follow me.” But he said, “Lord, permit me first to go and bury my father.”
translation:
  language: ja
  text: すると、イエスは別の人に言われた。「わたしに従いなさい。」しかし、その人は言った。「主よ、まず出かけて、父を葬ることをお許しください。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「まず行って、父を葬ることをお許しください」。
    reason: ἀπελθόντιは「出かける／去る」とも「行く」とも訳し得る。いずれも、埋葬に先立ってその場を去ることを表す。
lexical_decisions:
- source_word: ἕτερον
  choice: 別の人
  rationale: ἕτεροςの「ほかの、別の」という意味を、人物を指す文脈に即して自然な日本語で表した。
- source_word: Ἀκολούθει μοι
  choice: わたしに従いなさい
  rationale: ἀκολουθέωの現在命令形と与格代名詞を、弟子として従うよう求める簡潔な命令として訳した。日本語では継続相を明示すると意味を限定しすぎるため、あえて補わない。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけと、ルカ文書における称号としての神学的な響きの両方を保つ。「先生」や「旦那様」などに狭めない。
- source_word: ἐπίτρεψόν μοι
  choice: お許しください
  rationale: 許可を求める命令形を、主への敬意を示す自然な依頼表現にした。
- source_word: ἀπελθόντι πρῶτον
  choice: まず行って
  rationale: 与格分詞がμοιに呼応し、埋葬に先立ってその場を去ることを表す構文を簡潔に再現した。πρῶτονの係り方には多少の幅があるため別訳を脚注に示した。
- source_word: θάψαι τὸν πατέρα μου
  choice: 父を葬ること
  rationale: 不定詞と目的語を直接的に訳した。「父」がすでに死亡しているのか、将来の扶養義務を婉曲に述べているのかは本文だけでは決めず、説明を加えない。
theological_decisions:
- issue: イエスへの呼びかけκύριοςの訳語
  choice: 主
  alternative: 先生／閣下
  rationale: 単なる社会的敬称とも、完全に明示された信仰告白とも断定せず、敬称とキリスト論的称号の両方の響きを保つ。
- issue: 父を葬るという願いの時間的背景
  choice: 本文どおり「父を葬る」とし、父がすでに死亡していたとは明示しない
  alternative: 父の葬儀を済ませる／父が亡くなるまで家にいる
  rationale: θάψαι τὸν πατέρα μου自体は埋葬を意味するが、発言時の父の生死や慣用的含意までは確定しないため、解釈を本文に持ち込まない。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスの命令と相手の敬意ある願いにふさわしい端正さを保った。「イエス」はギリシア語本文では省略されている主語だが、直前から続く話者を日本語で明確にするため補った。
