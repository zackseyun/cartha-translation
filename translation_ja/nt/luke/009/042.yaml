id: LUK.9.42
reference: Luke 9:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔτι δὲ προσερχομένου αὐτοῦ ἔρρηξεν αὐτὸν τὸ δαιμόνιον καὶ συνεσπάραξεν· ἐπετίμησεν δὲ ὁ Ἰησοῦς τῷ πνεύματι τῷ ἀκαθάρτῳ, καὶ ἰάσατο τὸν παῖδα καὶ ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/042.yaml
  text: But while he was still coming near[a], the demon threw him down and convulsed him. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father.
translation:
  language: ja
  text: 少年がまだ近づいて来ている間に、悪霊は彼を激しく倒し、けいれんさせた。しかしイエスは汚れた霊を叱責し、少年を癒やして、父親に返した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父親のもとに戻した」とも訳せる。
    reason: ἀπέδωκενは「返す」のほか、文脈上「元のもとへ戻す」と表現することもできるため。
lexical_decisions:
- source_word: ἔτι δὲ προσερχομένου αὐτοῦ
  choice: 彼がなお近づいて来る途中
  rationale: 属格独立構文と現在分詞が示す同時進行の動作を自然な日本語で表し、ἔτιの「なお」も保持した。δὲは後続文の「しかし」との重複を避け、ここでは明示的に訳出しなかった。
- source_word: ἔρρηξεν αὐτὸν
  choice: 彼を地面にたたきつけ
  rationale: 文脈上の激しい投倒を明確にするため、「地面に」を補って自然に表現した。
- source_word: τὸ δαιμόνιον
  choice: 悪霊
  rationale: 人格的な霊的存在を指す語として、現代日本語の聖書文体でも一般読者に明瞭な「悪霊」を用いた。
- source_word: συνεσπάραξεν
  choice: 激しくけいれんさせた
  rationale: 激しい発作・けいれんを引き起こす動作を明瞭に表した。
- source_word: ἐπετίμησεν
  choice: 叱りつけ
  rationale: 単なる非難ではなく、権威をもって厳しく制する行為を自然な日本語で表した。
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: 汚れた霊
  rationale: 原文の宗教的・道徳的な汚れの含意を保ち、「悪霊」と表現を変えることで原文の二つの呼称を保持した。
- source_word: ἰάσατο τὸν παῖδα
  choice: 少年を癒やして
  rationale: παῖςの文脈上の年少男性という意味を「少年」で表し、ἰάομαιは奇跡的な回復を含む標準的な「癒やす」とした。
- source_word: ἀπέδωκεν αὐτὸν τῷ πατρὶ αὐτοῦ
  choice: 父親に返した
  rationale: ἀποδίδωμιの返還・回復の意味を簡潔に表し、救い出された少年が父親に再び委ねられたことを示した。
theological_decisions:
- issue: 悪霊による苦しみの表現
  choice: δαιμόνιονとπνεῦμα ἀκάθαρτονを、それぞれ「悪霊」と「汚れた霊」として人格的な霊的存在を示す語で訳す。
  alternative: 「悪い力」や精神的・身体的疾患だけを指す表現に置き換える。
  rationale: 本文は悪霊を行為主体として描き、イエスがその霊を叱りつけたと述べる。同時に少年を「癒やした」とも記すため、悪霊追放と癒やしの両面をどちらも弱めずに保持した。
translation_notes:
  register: 明瞭で現代的ながら、福音書の叙述にふさわしい落ち着いた文体とした。「けいれん」は読みやすさを優先して平仮名表記とし、「癒やす」は現代的な送り仮名を用いた。
