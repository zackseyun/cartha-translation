  yaml_path: translation/nt/luke/009/037.yaml
  text: On the next day[a], when they had come down from the mountain, a large crowd met him.
translation:
  language: ja
  text: 翌日[a]、彼らが山から下りて来たとき、大勢の群衆がイエスに出会った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「次の日」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （独立した語句としては訳出せず）
  rationale: 物語を進める定型的な移行表現であり、日本語では「翌日」で自然に場面転換が示されるため、冗長な「さて、起こった」を加えない。
- source_word: τῇ ἑξῆς ἡμέρᾳ
  choice: 翌日
  rationale: 時を表す与格で、「次の日」「その翌日」の意味。簡潔で自然な現代日本語とした。
- source_word: κατελθόντων αὐτῶν
  choice: 一行が山から下りて来ると
  rationale: 属格独立構文が示す背景状況と、主節に先立つ下降を自然に表す。「一行」は複数の αὐτῶν を明確にしつつ、構成員を特定しすぎない。
- source_word: ἀπὸ τοῦ ὄρους
  choice: 山から
  rationale: ὄρος の通常の意味を文脈に即して簡潔に表した。
- source_word: συνήντησεν αὐτῷ
  choice: イエスを迎えた
  rationale: συναντάω は「会う／出迎える」の意。群衆が下山したイエスに会う場面では「迎えた」が自然である。代名詞の指示対象は日本語で曖昧にならないよう「イエス」と明示した。
- source_word: ὄχλος πολύς
  choice: 大勢の群衆
  rationale: 群衆の規模が大きいことを、明快で現代的な日本語で表した。
