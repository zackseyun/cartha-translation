id: LUK.9.45
reference: Luke 9:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ἠγνόουν τὸ ῥῆμα τοῦτο, καὶ ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν ἵνα μὴ αἴσθωνται αὐτό, καὶ ἐφοβοῦντο ἐρωτῆσαι αὐτὸν περὶ τοῦ ῥήματος τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/045.yaml
  text: But they did not understand this saying[a], and it was concealed from them so that they might not perceive it[b], and they were afraid to ask him about this saying.
translation:
  language: ja
  text: しかし、弟子たちはこのことば[a]を理解していなかった。それは、彼らがそれを悟らないように、彼らから隠されていた[b]。彼らはまた、このことばについてイエスに尋ねるのを恐れていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ことば」は、「発言」「事柄」とも訳せる（ῥῆμα）。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語本文は「彼らから隠されていた」と受動形で述べ、誰が隠したかを明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἠγνόουν
  choice: 理解できなかった
  rationale: 単なる情報不足ではなく、直前のイエスの発言の意味をつかめなかったことを、自然な現代日本語で表す。
- source_word: ῥῆμα
  choice: ことば
  rationale: ここではイエスが語った特定の発言を指す。「ことば」は発話への焦点を保ち、二度の出現も対応させられる。
- source_word: ἦν παρακεκαλυμμένον ἀπ’ αὐτῶν
  choice: 彼らに分からないよう隠されていて
  rationale: 迂言的な完了受動形が示す、隠された状態を表す。行為者を補わず、受動表現を維持する。
- source_word: ἵνα μὴ αἴσθωνται αὐτό
  choice: 彼らはそれを悟ることができなかった
  rationale: αἰσθάνομαιを「悟る」とし、先のἠγνόουν「理解できなかった」との語感の違いを保つ。ἵνα μήが表す結果・目的の含みは、前節の「分からないよう」によって示す。
- source_word: ἐφοβοῦντο
  choice: 恐れていた
  rationale: 未完了時制が表す継続的な心理状態を、簡潔で品位ある日本語にする。
- source_word: ἐρωτῆσαι
  choice: 尋ねる
  rationale: 説明を求めてイエスに質問する文脈に自然に合う。
theological_decisions:
- issue: 隠した主体
  choice: 「隠されていて」と受動形にし、主体を明示しない。
  alternative: 神によって隠されていた／ただ彼らには不明瞭だった
  rationale: ギリシア語本文は受動形で、隠した主体を名指ししていない。神的受動の可能性を排除せず、同時に明文化もしないことで、本文の神学的緊張を保つ。
- issue: ἵνα μήの目的・結果の含み
  choice: 「分からないよう隠されていて、彼らはそれを悟ることができなかった」と訳す。
  alternative: 「彼らが悟らないためであった」
  rationale: 目的を強く断定する日本語を避けつつ、隠された状態と悟れなかったことの関係を明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての落ち着きと品位を保った。「イエス」はギリシア語では代名詞だが、日本語で指示対象を明確にするため補った。すべての脚注記号を本文中に配置した。
