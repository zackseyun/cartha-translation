source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν· Ὦ γενεὰ ἄπιστος καὶ διεστραμμένη, ἕως πότε ἔσομαι πρὸς ὑμᾶς καὶ ἀνέξομαι ὑμῶν; προσάγαγε ⸂ὧδε τὸν υἱόν σου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/041.yaml
  text: But Jesus answered, “O unbelieving and twisted generation, how long will I be with you and bear with you? Bring your son here.”
translation:
  language: ja
  text: しかし、イエスは答えた。「ああ、不信仰でゆがんだ世代よ。いつまで、わたしはあなたがたと共にいて、あなたがたを耐え忍ばなければならないのか。あなたの息子をここへ連れてきなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γενεὰ
  choice: 時代
  rationale: ここでは同時代の人々を一括して呼びかける語であり、現代日本語で誤解されやすい「世代」よりも、時代の人々を含意する「時代」が自然。
- source_word: ἄπιστος
  choice: 信仰のない
  rationale: 単なる信用不能ではなく、神への信頼・信仰の欠如を表す文脈に即した。
- source_word: διεστραμμένη
  choice: ねじ曲がった
  rationale: 完了受動分詞の、正しい状態から曲げられた・歪んだという像を保ち、「邪悪」などの解釈的な一般化を避けた。
- source_word: ἀνέξομαι ὑμῶν
  choice: あなたがたに耐えなければならないのか
  rationale: 相手を忍耐して受け止め続ける意味を明示し、修辞疑問の痛切さを保った。
- source_word: προσάγαγε ὧδε
  choice: ここに連れて来なさい
  rationale: 命令形と方向を示す「ここに」を簡潔に再現した。
theological_decisions:
- issue: イエスの叱責の対象範囲
  choice: 複数形の「あなたがた」と包括的な「時代」を保持する
  alternative: 父親または弟子たちだけに限定して訳す
  rationale: 本文は複数形とγενεάを用いており、誰だけを指すかを訳文で限定しない。
- issue: ἄπιστοςの意味
  choice: 「信仰のない」と訳す
  alternative: 「不信仰な」「信じない」
  rationale: 神学的含意を保ちつつ、現代の一般読者に明瞭な表現とした。
translation_notes:
  register: 厳粛な叱責の調子を保ちながら、現代標準日本語として理解しやすくした。「ああ」と修辞疑問により原文の嘆きと強い非難を表した。
