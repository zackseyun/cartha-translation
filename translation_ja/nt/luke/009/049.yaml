id: LUK.9.49
reference: Luke 9:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀποκριθεὶς ⸀δὲ Ἰωάννης εἶπεν· Ἐπιστάτα, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, καὶ ⸀ἐκωλύομεν αὐτὸν ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/049.yaml
  text: Then John answered[a], “Master, we saw someone casting out demons in your name, and we tried to stop him because he does not follow with us.”
translation:
  language: ja
  text: すると、ヨハネが答えた。「先生、あなたの名によって悪霊を追い出している人を見ましたので、やめさせようとしました。その人が私たちと一緒に従って来ないからです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その人が私たちに従って来ないからです」。ギリシア語には直訳的に「私たちと共に」とあり、その人が弟子たちの一行と行動を共にしていなかったことを指す可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀποκριθεὶς δὲ
  choice: すると、…が答えた
  rationale: 分詞とδέによる応答的な物語の展開を、自然な現代日本語で表した。明示的な問いへの返答に限られない「応じて言う」という含みも保っている。
- source_word: Ἐπιστάτα
  choice: 先生
  rationale: ルカが弟子たちのイエスへの呼びかけに用いる語で、権威ある指導者への敬意を示す。現代の一般読者に自然であり、「教師」という役割だけに狭めずに訳せる。
- source_word: εἴδομέν τινα
  choice: …人を見かけた
  rationale: τιναの不定性を保ち、「ある男」のように不要な強調を加えない。「見かけた」は、この場面で人の行為を目撃したことを自然に表す。
- source_word: ἐν τῷ ὀνόματί σου
  choice: あなたの名によって
  rationale: イエスの名を根拠または権威として行うという含意を保つ。「名を使って」よりも神学的重みを損なわず、現代日本語としても明瞭である。
- source_word: ἐκβάλλοντα δαιμόνια
  choice: 悪霊を追い出している
  rationale: 悪霊払いの文脈におけるἐκβάλλωの継続中の行為を、明快で定着した日本語表現にした。
- source_word: ἐκωλύομεν
  choice: やめさせようとしました
  rationale: 未完了過去が示し得る継続・企図のニュアンスを表し、実際に完全に阻止できたと断定しない。
- source_word: ὅτι οὐκ ἀκολουθεῖ μεθ’ ἡμῶν
  choice: その人が私たちと一緒に従っていないからです
  rationale: ἀκολουθεῖを「従う」、μεθ’ ἡμῶνを「私たちと一緒に」と明示し、その人がイエスを拒んでいたと決めつけず、弟子たちの一団に加わっていなかったという訴えの焦点を保った。
theological_decisions:
- issue: その人の弟子としての帰属をめぐる訴えの曖昧さ
  choice: 「私たちと一緒に従っていない」と訳す
  alternative: 「私たちについて来ない」
  rationale: ギリシア語はμεθ’ ἡμῶν（私たちと共に）を明記している。したがって、その人がイエスに従っていないと断定せず、十二弟子たちの一団と行動を共にしていないことが問題にされているという物語上・神学上の緊張を残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、会話には敬意と聖書本文にふさわしい落ち着きを持たせた。語順は日本語として自然に整えつつ、「あなたの名によって」と「私たちと一緒に」を明示して原文の重要な関係を保持した。
