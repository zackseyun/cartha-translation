source:
  edition: SBLGNT
  text: καὶ ὅσοι ⸀ἂν μὴ ⸀δέχωνται ὑμᾶς, ἐξερχόμενοι ἀπὸ τῆς πόλεως ⸀ἐκείνης τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν ⸀ἀποτινάσσετε εἰς μαρτύριον ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/005.yaml
  text: And as for all who do not receive you[a], as you leave that town[b], shake off the dust from your feet as a testimony against them.
translation:
  language: ja
  text: また、あなたがたを受け入れない人々については、その町を出るとき、彼らに対する証しとして、足のちりを払い落としなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「足からちりを振り落としなさい」とも訳せる。原文は、足に付いたちりを振って取り除く動作を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι ἂν μὴ δέχωνται ὑμᾶς
  choice: あなたがたを受け入れない人々がいるなら
  rationale: ὅσοι ἄνの不特定・一般化の意味を自然な日本語で表し、δέχομαιが含む使者を迎え入れ、受け入れる意味の広がりを保った。
- source_word: ἐξερχόμενοι ἀπὸ τῆς πόλεως ἐκείνης
  choice: その町を出るとき
  rationale: 分詞の主動詞との同時性を「とき」で表した。πόλιςは文脈により都市にも町にもなり得るため、規模を限定しすぎない自然な「町」とした。
- source_word: τὸν κονιορτὸν ἀπὸ τῶν ποδῶν ὑμῶν
  choice: 足についたちり
  rationale: κονιορτόςの地面の細かなちりという具体像と、それが足に付着している関係を明瞭にした。
- source_word: ἀποτινάσσετε
  choice: 払い落としなさい
  rationale: 命令形を保ち、付着したちりを振り落とす象徴的な動作を現代日本語として自然に表した。
- source_word: εἰς μαρτύριον ἐπ’ αὐτούς
  choice: 彼らに対する証しとして
  rationale: μαρτύριονの証言・証拠としての意味と、ἐπίがこの文脈で帯びる対抗的・警告的な方向性を保った。
theological_decisions:
- issue: ちりを払い落とす行為の意味
  choice: 拒む人々に対する証しとなる警告的・司法的な象徴行為
  alternative: 彼らへの中立的なしるし、または最終的断罪の明示
  rationale: εἰς μαρτύριον ἐπ’ αὐτούςは単なる中立的な合図より強いが、本文は最終的な断罪まで明言していないため、「彼らに対する証し」として緊張を保った。
translation_notes:
  register: 明瞭で現代的ながら、命令と象徴行為の厳粛さを保つ文体。「受け入れる」は、歓迎することと使者として受容することの両方を含み得る。脚注記号は該当文末に配置した。
