id: LUK.9.7
reference: Luke 9:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἤκουσεν δὲ Ἡρῴδης ὁ τετραάρχης τὰ ⸀γινόμενα πάντα, καὶ διηπόρει διὰ τὸ λέγεσθαι ὑπό τινων ὅτι Ἰωάννης ⸀ἠγέρθη ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/007.yaml
  text: Herod the tetrarch heard about all that was happening[a], and he was perplexed because it was being said by some that John had been raised from the dead,
translation:
  language: ja
  text: 四分領主ヘロデは、起こっていることをすべて耳にし、当惑していた。ヨハネが死者の中からよみがえらされた[a]と、ある人々が言っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死者の中からよみがえった」。ギリシア語の動詞は受動態で、直訳すると「よみがえらされた」。
    reason: 本文が保つ受動態に対応する、より自然な日本語の別訳を示すため。
lexical_decisions:
- source_word: Ἤκουσεν
  choice: 耳にし
  rationale: 出来事についての報告を聞き知ったという文脈を、自然な現代日本語で表す。
- source_word: δὲ
  choice: 訳文では明示しない
  rationale: ここでは物語を緩やかに進める接続辞であり、日本語では段落の流れによって十分に表される。対比を過度に示す「しかし」は避けた。
- source_word: ὁ τετραάρχης
  choice: 四分領主
  rationale: ヘロデの歴史的・政治的称号を保ち、「王」や一般的な「領主」へ単純化しない。
- source_word: τὰ γινόμενα πάντα
  choice: 起こっていることをすべて
  rationale: 周囲で進行している一連の出来事を指す分詞の継続的な様相を保つ。
- source_word: διηπόρει
  choice: 当惑していた
  rationale: どう理解すべきか分からず困惑している継続的な状態を、簡潔で自然な日本語にする。
- source_word: διὰ τὸ λέγεσθαι ὑπό τινων
  choice: というのも、ある人々が……と言っていたからである
  rationale: 原因を示す構文と不特定の複数者を保つ。ギリシア語の受動表現は、日本語では自然な能動文に組み替えた。
- source_word: ἠγέρθη
  choice: よみがえらされた
  rationale: アオリスト受動形を反映し、単に自ら「よみがえった」とはせず、行為者を明示しない受動の形を保つ。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 複数形 νεκρῶν の集合的な意味を保ちつつ、日本語の復活表現として理解できる形にする。
theological_decisions:
- issue: ヨハネについての復活の報告における受動表現
  choice: 死者の中からよみがえらされた
  alternative: 死者の中からよみがえった
  rationale: ἠγέρθη は受動形なので、その形を本文に残した。行為者が神であると本文中に補わず、同時に能動・自動詞的な表現へ解消しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体とした。「四分領主」は歴史的称号として保持し、必要以上の説明を本文に加えていない。
