  text: ἐξερχόμενοι δὲ διήρχοντο κατὰ τὰς κώμας εὐαγγελιζόμενοι καὶ θεραπεύοντες πανταχοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/006.yaml
  text: So they went out and traveled through the villages[b][a], proclaiming the good news and healing everywhere.
translation:
  language: ja
  text: そこで、弟子たちは出て行き、村々を巡りながら、至る所で福音を告げ知らせ、癒やしを行っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξερχόμενοι
  choice: 出て行き
  rationale: アオリスト分詞が、イエスの派遣を受けて弟子たちが出発したことを示す。現代日本語で自然な順次動作として訳した。
- source_word: δὲ
  choice: そこで
  rationale: 物語の継続と、直前の派遣命令を受けた展開の両方を自然に示す。
- source_word: διήρχοντο
  choice: 巡り歩き
  rationale: 未完了過去が表す継続的な移動と、複数の村を次々に訪ねる様子を簡潔に表す。
- source_word: κατὰ τὰς κώμας
  choice: 村々を
  rationale: κατά＋対格の分配的・空間的意味を、「村々を巡り歩き」という自然な日本語で表した。
- source_word: εὐαγγελιζόμενοι
  choice: 福音を告げ知らせ
  rationale: 良い知らせを公に伝える意味を保ちつつ、聖書本文として定着した「福音」と、その行為を明確にする「告げ知らせる」を用いた。
- source_word: θεραπεύοντες
  choice: 病気を癒やした
  rationale: 文脈上、弟子たちによる身体的な癒やしを指す。日本語では目的語を補うことで意味を明瞭にした。
- source_word: πανταχοῦ
  choice: 至る所で
  rationale: 宣教と癒やしが広く行われたことを、自然で格調を保った現代日本語で表す。
theological_decisions:
- issue: εὐαγγελιζόμενοι が示す宣教内容
  choice: 福音を告げ知らせ
  alternative: 良い知らせを告げ知らせ
  rationale: 「福音」は原語の意味とルカ文書における宣教的用法を簡潔に伝える一方、この節だけで後代の教理体系を過度に読み込まないよう、動詞は説明的な「告げ知らせる」とした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。分詞の並列は日本語では順次的な述語に整え、継続的に村々を訪ねながら宣教と癒やしを行った流れを表した。
