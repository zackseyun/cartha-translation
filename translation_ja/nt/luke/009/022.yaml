id: LUK.9.22
reference: Luke 9:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰπὼν ὅτι Δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων καὶ ἀποκτανθῆναι καὶ τῇ τρίτῃ ἡμέρᾳ ⸀ἐγερθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/022.yaml
  text: saying[a], “It is necessary for the Son of Man to suffer many things and to be rejected by the elders, chief priests, and scribes, and to be killed[b], and on the third day to be raised.”
translation:
  language: ja
  text: こう言われた。[a]「人の子は多くの苦しみを受け、長老たち、祭司長たち、律法学者たちから退けられ、殺され、そして三日目に起こされなければならない。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「言って」。原文では分詞で、直前の文に続いている。
    reason: grammatical_form
  - marker: b
    text: 「よみがえらなければならない」とも訳せる。ギリシア語は受動形で、直訳的には「起こされなければならない」。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰπὼν
  choice: こう言われた
  rationale: アオリスト分詞で、直前の物語に続けてイエスの発言内容を導入する。単独の節としても自然に読めるよう定動詞で表したが、前文とのつながりは「こう」によって保った。
- source_word: Δεῖ
  choice: なければならない
  rationale: 単なる都合ではなく、苦難、拒絶、死、復活に及ぶ必然性を示す。日本語では文末に置き、並列された不定詞全体を支配する構造を自然に表した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書における確立した称号であり、ダニエル書を含む聖書的響きを保つ。一般的な「人間」などには言い換えない。
- source_word: πολλὰ παθεῖν
  choice: 多くの苦しみを受け
  rationale: πολλάの幅を保ちつつ、現代日本語として明瞭な表現にした。
- source_word: ἀποδοκιμασθῆναι
  choice: 退けられ
  rationale: 吟味の末に不適格として拒絶する含みを持つ受動形。指導者たちによる公的な拒絶にふさわしく、簡潔で明瞭な語を選んだ。
- source_word: ἀπὸ τῶν πρεσβυτέρων καὶ ἀρχιερέων καὶ γραμματέων
  choice: 長老たち、祭司長たち、律法学者たちから
  rationale: 受動動詞に伴うἀπόを行為の出所として「から」で表した。三つの指導者集団を原文どおり並列した。
- source_word: πρεσβυτέρων
  choice: 長老たち
  rationale: 当時のユダヤ社会における公認の指導者集団を示す制度的名称を保持した。
- source_word: ἀρχιερέων
  choice: 祭司長たち
  rationale: 複数形は通常、唯一の大祭司だけでなく祭司階級の有力者たちを指すため、「大祭司たち」ではなく定着した訳語を用いた。
- source_word: γραμματέων
  choice: 律法学者たち
  rationale: 単なる筆記者との誤解を避け、ユダヤ教の律法に通じた専門家集団を現代の読者に明瞭に示す。
- source_word: ἀποκτανθῆναι
  choice: 殺され
  rationale: 受動不定詞の直接的な意味を保ち、「死刑にされる」のような司法的含意は加えなかった。
- source_word: τῇ τρίτῃ ἡμέρᾳ
  choice: 三日目に
  rationale: 時間を示す与格を、自然で定着した日本語の復活表現として訳した。
- source_word: ἐγερθῆναι
  choice: よみがえらされ
  rationale: 復活の文脈におけるἐγείρωの意味を明示しつつ、受動形を保持した。行為者は原文同様に明示しない。
theological_decisions:
- issue: 復活を表す動詞の受動態
  choice: よみがえらされ
  alternative: よみがえり
  rationale: ἐγερθῆναιは受動不定詞である。やや特徴的な日本語ではあるが受動性を保ち、神の働きを暗示しながらも、原文にない行為者を明示しないようにした。
- issue: Δεῖが示す必然性とその範囲
  choice: 一連の出来事の末尾に「なければならない」を置く
  alternative: 「人の子は必ず」とする
  rationale: 原文ではΔεῖが苦難、拒絶、死、復活という一連の不定詞を支配する。日本語でも全体にかかるよう文末に置き、神の計画における必然性を保ちながら、その仕組みを説明しすぎないようにした。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「祭司長」「律法学者」「人の子」は福音書で認識しやすい用語として保持した。「よみがえらされ」は日常語としてはやや特徴的だが、原文の受動態と神学的含みを保存するため意図的に採用した。
