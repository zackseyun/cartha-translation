id: LUK.9.48
reference: Luke 9:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὃς ⸀ἂν δέξηται τοῦτο τὸ παιδίον ἐπὶ τῷ ὀνόματί μου ἐμὲ δέχεται, καὶ ὃς ⸁ἂν ἐμὲ δέξηται δέχεται τὸν ἀποστείλαντά με· ὁ γὰρ μικρότερος ἐν πᾶσιν ὑμῖν ὑπάρχων οὗτός ⸀ἐστιν μέγας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/048.yaml
  text: And he said to them[a], “Whoever receives this child in my name receives me, and whoever receives me receives the one who sent me[b]. For the one who is least among all of you—this one is great.”
translation:
  language: ja
  text: そして、彼らに言われた。「わたしの名によって[b]この子どもを受け入れる人[a]は、わたしを受け入れます。わたしを受け入れる人は、わたしを遣わした方を受け入れます。なぜなら、あなたがた皆の中で最も小さい者、その人こそ偉大です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「受け入れる」は「迎え入れる」とも訳せる。ギリシア語には、人を受容する意味と、客として歓迎する意味の両方があり得る。この節の同じ語についても同様。
    reason: lexical_alternative
  - marker: b
    text: 「わたしの名によって」は、「わたしの名を根拠として」または「わたしの名のゆえに」という意味にも取れる。イエスの権威やイエスへの帰属との関係で受け入れることを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέξηται / δέχεται
  choice: 受け入れる
  rationale: 歓迎して迎えることと、人物やその立場を認めて受容することの両方を含み得る語であり、同じ訳語を反復して原文の連鎖を保った。
- source_word: παιδίον
  choice: 子ども
  rationale: 年少の子を指す普通の表現。日本語では「幼子」と限定せず、明瞭で自然な「子ども」とした。
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: イエスの名、権威、またイエスとの関係を根拠として受け入れる含意を保つ。
- source_word: τὸν ἀποστείλαντά με
  choice: わたしを遣わされた方
  rationale: 定冠詞付き分詞を人格的な実体表現として訳し、原文が明記しない「父」や「神」を本文に補わなかった。
- source_word: μικρότερος
  choice: 最も小さい者
  rationale: 形は比較級だが、この文脈では集団内の低い立場を表す最上級的用法。年齢や体格に限定せず、逆説的な身分評価を保つ。
- source_word: ἐν πᾶσιν ὑμῖν
  choice: あなたがた皆の中で
  rationale: 弟子たちの集団内における位置を示す自然な日本語とした。
- source_word: ὑπάρχων
  choice: （最も小さい）者
  rationale: 分詞の存在・状態の意味を、日本語では名詞句に組み込んで自然に表した。
- source_word: οὗτός ἐστιν μέγας
  choice: その人こそ偉いのである
  rationale: 指示代名詞の強調を「こそ」で示し、単なる「その人は」より原文の焦点を明確にした。
- source_word: Ὃς ἂν ... καὶ ὃς ἂν
  choice: …人は…のであり、…人は
  rationale: 不特定の一般条件を日本語の一般的な関係節で自然に表し、二つの条件の並行を保った。
- source_word: καὶ εἶπεν αὐτοῖς
  choice: そして、彼らに言われた
  rationale: καίの接続を「そして」で示し、イエスに対する敬意を自然な敬語で表した。
theological_decisions:
- issue: 「わたしを遣わされた方」の指示対象
  choice: 父または神への暗示を保ちつつ、本文では明示しない。
  alternative: 「わたしを遣わされた父」または「わたしを遣わされた神」
  rationale: ギリシア語は固有の呼称を用いず「わたしを遣わした方」とだけ述べているため、その関係的主張を保ち、説明的な語を加えなかった。
- issue: 子どもを「わたしの名によって」受け入れる意味
  choice: イエスの名・権威・イエスとの関係を根拠とする受容という幅を保つ。
  alternative: 「その子がわたしに属するから」または「わたしのために」
  rationale: 句の代表性と権威の含意を狭く限定せず、一般的な親切だけにも還元しないため。
- issue: 偉大さの逆説
  choice: 共同体の中で最も小さい者こそ偉い、という逆転をそのまま表す。
  alternative: 「最も年少の者が偉い」
  rationale: μικρότεροςはこの文脈で主に年齢ではなく低い地位やへりくだった立場を指すと考えられ、倫理的・神学的緊張を弱めないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの発話には落ち着いた威厳を持たせた。「受け入れる」の三重の反復と、末尾の「その人こそ」という強調を保った。脚注記号は該当する句の直後に配置した。
