id: LUK.9.13
reference: Luke 9:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Δότε αὐτοῖς ⸂ὑμεῖς φαγεῖν⸃. οἱ δὲ εἶπαν· Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ ⸂ἄρτοι πέντε⸃ καὶ ἰχθύες δύο, εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν εἰς πάντα τὸν λαὸν τοῦτον βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/013.yaml
  text: But he said to them[a], “You give them something to eat.” But they said[b], “We have no more than five loaves and two fish—unless we go and buy food for all this people.”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「あなたがたが[a]、この人たちに食べ物を与えなさい。」すると弟子たちは言った。「私たちには、パン五つと魚二匹しかありません。私たちが出かけて行って、この人々全員[b]のために食べ物を買うというのなら別ですが。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、強調をより明示して「あなたがた自身が」。
    reason: lexical_alternative
  - marker: b
    text: または「この群衆全体」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Δότε αὐτοῖς ὑμεῖς φαγεῖν
  choice: あなたがたが、この人たちに食べ物を与えなさい
  rationale: δίδωμι＋φαγεῖνの構文を、現代日本語で自然な「食べ物を与える」とした。明示された主語ὑμεῖςの強調は、主格の「あなたがたが」で表した。
- source_word: Οὐκ εἰσὶν ἡμῖν πλεῖον ἢ
  choice: 私たちには……しかありません
  rationale: 否定と比較表現が示す数量の限定を、日本語の自然な「しか……ない」で明確に表した。
- source_word: ἄρτοι πέντε καὶ ἰχθύες δύο
  choice: パン五つと魚二匹
  rationale: ἄρτοιは数えられる個々のパンを指すが、日本語では「パン五つ」が簡潔で自然である。魚には通常の助数詞「匹」を用いた。
- source_word: εἰ μήτι πορευθέντες ἡμεῖς ἀγοράσωμεν
  choice: 私たちが出かけて行って……食べ物を買うというのなら別ですが
  rationale: εἰ μήτιが導く例外と、控えめな疑念・反論の響きを、断定的な提案や露骨な反語にせず「というのなら別ですが」で保持した。πορευθέντεςは主動詞に伴う動作として自然に訳した。
- source_word: πάντα τὸν λαὸν τοῦτον
  choice: この人々全員
  rationale: λαόςの集合的な意味とπάντα、τοῦτονの範囲・指示をそれぞれ反映した。文脈上「群衆」も可能だが、それに限定しなかった。
- source_word: βρώματα
  choice: 食べ物
  rationale: 複数形は種々の食料を指すが、日本語では集合的な「食べ物」が自然である。
theological_decisions:
- issue: イエスの命令と弟子たちの返答の調子
  choice: 命令は率直に訳し、弟子たちの返答は実際上の難しさを述べる形にした
  alternative: 命令を「あなたがた自身で」とさらに強め、返答を明白な反語として訳す
  rationale: ὑμεῖςには強調がある一方、本文は叱責や苛立ちを明示していない。そのため強調は保ちつつ、特定の感情や神学的含意を加えなかった。
- issue: 省略された主語の明示
  choice: 文脈上の話者を「イエス」と明示した
  alternative: 「彼は」または主語を省略する
  rationale: ギリシア語では動詞に主語が含まれ、直前の文脈からイエスを指す。単独でも理解しやすい日本語とするため固有名を補ったが、新たな解釈は加えていない。
translation_notes:
  register: 明瞭な現代標準語を用い、会話として自然でありながら聖書本文にふさわしい落ち着いた調子とした。イエスについては日本語の一般的な敬意表現として「言われた」を用い、弟子たちには中立的な「言った」を用いた。
