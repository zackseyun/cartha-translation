  source_fidelity: ギリシア語の命令Δότε…ὑμεῖς φαγεῖνを「あなたがたが…食べ物を与えなさい」とし、明示主語ὑμεῖςの強調、δίδωμι＋φαγεῖνの慣用表現を適切に反映している。後半も「しかありません」でοὐκ…πλεῖον ἢの限定を明確にし、五つのパンと二匹の魚、全員のための食べ物を買うという例外条件を漏れなく訳している。「というのなら別ですが」はεἰ μήτιの留保を自然な日本語で表す。
