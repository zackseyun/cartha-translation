id: LUK.9.23
reference: Luke 9:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ πρὸς πάντας· Εἴ τις θέλει ὀπίσω μου ⸂ἔρχεσθαι, ἀρνησάσθω⸃ ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ ⸂καθ’ ἡμέραν⸃, καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/023.yaml
  text: And he was saying to all[a], “If anyone wants to come after me, let him deny himself and take up his cross daily, and follow me.”
translation:
  language: ja
  text: イエスは皆に言っていた。「だれでもわたしの後について来たいなら、自分を否み、日々自分の十字架を負って、わたしに従いなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 言っていた
  rationale: 未完了時制の継続的・反復的な側面を保ちつつ、現代日本語として自然にした。
- source_word: πρὸς πάντας
  choice: 皆に
  rationale: 聞き手の全体を指す簡潔で自然な表現。文脈上、主語を「イエス」と明示した。
- source_word: Εἴ τις θέλει
  choice: だれでも…たいなら
  rationale: 不定代名詞τιςの一般的な範囲と、θέλειの意志・願望を自然な条件表現で示した。
- source_word: ὀπίσω μου ἔρχεσθαι
  choice: わたしの後について来たい
  rationale: 弟子として従う含意を持つ比喩を保ち、後半のἀκολουθείτωと完全には同一化しない表現とした。
- source_word: ἀρνησάσθω ἑαυτὸν
  choice: 自分を否み
  rationale: 自己を拒む・否認するという原語の強さを保ち、「捨てる」などの解釈的な言い換えを避けた。
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: 自分の十字架を負って
  rationale: 日本語の聖書表現として自然で、十字架を自ら引き受けて担う意味を表す。具体語「十字架」はそのまま保持した。
- source_word: καθ’ ἡμέραν
  choice: 日々
  rationale: ルカ特有の継続的な強調を、簡潔で格調ある現代日本語で示した。
- source_word: ἀκολουθείτω μοι
  choice: わたしに従いなさい
  rationale: 三人称単数命令の一般的効力を、日本語で自然な直接命令として表した。
theological_decisions:
- issue: 弟子道における「十字架」の意味
  choice: 「十字架」を具体語のまま保持する
  alternative: 苦難、重荷、犠牲などと意訳する
  rationale: σταυρόςの歴史的・象徴的な緊張を保ち、その意味を一つの抽象概念へ限定しないため。
- issue: 一般的単数と性別表現
  choice: 「だれでも」「自分」を用いて一般的単数を自然に表す
  alternative: 男性を明示する表現、または複数化する表現
  rationale: ギリシア語は一般的な単数だが、日本語では性を示さず単数的・包括的に表現できるため、範囲を損なわず自然に訳せる。
- issue: 命令の力
  choice: 条件節に続けて「否み、…負って、…従いなさい」とする
  alternative: 「従わなければならない」と義務文にする
  rationale: 原文の命令法を保ちつつ、日本語で一連の命令として明瞭に響かせるため。
translation_notes:
  register: 明瞭で現代的だが礼拝朗読にも耐える格調を目指した。「日々」「十字架」「否む」は意味の精度と聖書的な響きを両立する。原文に本文上の異読注を必要とするほどの意味差はないため、脚注は付していない。
