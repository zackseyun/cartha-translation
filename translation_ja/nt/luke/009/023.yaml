review_pass:
  verdict: approve
  source_fidelity: 原文の未完了形Ἔλεγενは「言っていた」で継続的・反復的な語りとして適切に表されている。πρὸς πάνταςを「皆に」、条件節Εἴ τις θέλει ὀπίσω μου ἔρχεσθαιを「だれでもわたしの後について来たいなら」とする訳は、対象の包括性と弟子として来るという比喩を保つ。三つの命令（自分を否む／十字架を取る／従う）および「日々」の修飾も忠実である。
  naturalness: 全体として明瞭な現代標準日本語であり、朗読にも適する。「だれでも…なら、…なさい」という一般条件に続く命令も自然である。「皆に」はやや口語寄りだが、不自然ではなく、本文の明瞭さを損なわない。
  terminology: 「十字架」を具体語のまま保ち、「自分を否む」「日々」「わたしに従う」はいずれも原文の語義と日本語聖書の用語感に適合する。「負って」はἀράτωの「取る／担い上げる」と、この文脈での継続的に担う含意の双方を自然に表せている。性別を示さない「だれでも」「自分」は、一般的単数の範囲を適切に表す。
