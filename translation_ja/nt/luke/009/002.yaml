  text: καὶ ἀπέστειλεν αὐτοὺς κηρύσσειν τὴν βασιλείαν τοῦ θεοῦ καὶ ἰᾶσθαι ⸂τοὺς ἀσθενεῖς⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/002.yaml
  text: And he sent them out to proclaim the kingdom of God and to heal the sick,[a]
translation:
  language: ja
  text: そして、神の国[a]を宣べ伝え、病人を癒やすために、彼らを遣わした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の支配」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 遣わした
  rationale: ἀποστέλλωの派遣・委任の含みを、文脈に即した自然で簡潔な日本語で表す。
- source_word: κηρύσσειν
  choice: 宣べ伝え
  rationale: 公に告げ知らせるというκηρύσσωの意味を保ちつつ、聖書本文にふさわしい明瞭で品位ある表現とした。
- source_word: βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 神の支配とその領域の双方を含み得る定着した表現であり、原語の意味の広がりを狭めない。
- source_word: ἰᾶσθαι
  choice: 癒やす
  rationale: 身体的な回復を与えるという文脈上の意味を自然に表す。
- source_word: τοὺς ἀσθενεῖς
  choice: 病人
  rationale: ἀσθενήςは広く「弱い」を意味し得るが、ἰᾶσθαιとの組み合わせでは病気の人々を指すため、「病人」が文脈に最も適する。
theological_decisions:
- issue: βασιλεία τοῦ θεοῦの性質
  choice: 神の国
  alternative: 神の支配
  rationale: この句は神が統治する領域と神による統治そのものの両方を示し得る。「神の国」はその神学的な幅を保持し、「神の支配」は注で可能な意味として示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての簡潔さと品位を保った。「宣べ伝える」は一般語の「告げ知らせる」よりもκηρύσσωの公的宣言の響きを保つ。
