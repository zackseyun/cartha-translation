id: LUK.9.16
reference: Luke 9:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λαβὼν δὲ τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν αὐτοὺς καὶ κατέκλασεν καὶ ἐδίδου τοῖς μαθηταῖς ⸀παραθεῖναι τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/016.yaml
  text: Then[a], taking the five loaves and the two fish, and looking up to heaven, he blessed them and broke them and kept giving them to the disciples to set before the crowd.
translation:
  language: ja
  text: そこでイエスは、五つのパンと二匹の魚を取り、天を仰いで、それらを祝福し[a]、裂いて、群衆の前に置くよう弟子たちに渡し続けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それらのために感謝をささげ」とも理解できる。ギリシア語の動詞は直訳すると「祝福した」であり、並行箇所の一部では「感謝した」に当たる別の動詞が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν δὲ
  choice: そこで…取り
  rationale: δὲの穏やかな物語上の展開を「そこで」で示し、アオリスト分詞λαβώνを後続動作に先立つ「取り」と自然に訳した。
- source_word: τοὺς πέντε ἄρτους
  choice: 五つのパン
  rationale: ἄρτοςはここでは数えられるパンを指す。日本語では「五つのパン」が自然であり、「五個のパン」よりも物語文に適する。
- source_word: τοὺς δύο ἰχθύας
  choice: 二匹の魚
  rationale: 魚を数える日本語の一般的な助数詞を用い、具体的な食物として明瞭にした。
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: 天を仰いで
  rationale: 上方を見る動作と祈りの文脈を、簡潔で品位ある現代日本語で表す。「空」よりもοὐρανόςの宗教的含意に適う。
- source_word: εὐλόγησεν αὐτοὺς
  choice: それらを祝福し
  rationale: εὐλογέωを「感謝する」と同化せず「祝福する」と訳し、男性複数代名詞αὐτούςがパンと魚を合わせて指すことも保持した。
- source_word: κατέκλασεν
  choice: 裂いて
  rationale: 食物、とりわけパンを分配できるように割く動作を自然に表す。目的語は直前の「それら」から理解できるため反復しない。
- source_word: ἐδίδου
  choice: 渡し続けた
  rationale: 未完了過去の継続・反復的な分配を「続けた」で明示した。
- source_word: τοῖς μαθηταῖς
  choice: 弟子たちに
  rationale: 定冠詞を不自然に直訳せず、複数の弟子を現代日本語として明瞭に表した。
- source_word: παραθεῖναι τῷ ὄχλῳ
  choice: 群衆の前に置くよう
  rationale: 不定詞の目的を「よう」で示し、παρατίθημιの具体的な「前に置く」という意味を保った。「配る」より解釈を加えない。
theological_decisions:
- issue: οὐρανόςの祈りの文脈での意味
  choice: 天
  alternative: 空
  rationale: 祝福に伴う上向きのまなざしであるため、単なる物理的な空ではなく、神に向かう含意を保持する「天」が適切である。
- issue: εὐλόγησενの訳し分け
  choice: 祝福し
  alternative: 感謝をささげ
  rationale: 本文の動詞はεὐλογέωであり、並行箇所の「感謝する」に調和させず、ルカ本文の語彙上の特徴を保持した。ただし食事の祈りとして「感謝をささげる」と理解されうるため脚注で示す。
- issue: αὐτούςの指示対象
  choice: それら（パンと魚）
  alternative: それ（食物全体）
  rationale: 男性複数形を尊重し、直前の五つのパンと二匹の魚を合わせて受ける複数表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書物語にふさわしい落ち着いた品位を保った。「天を仰ぐ」「祝福する」「群衆の前に置く」は原文の具体性を維持し、未完了過去は「渡し続けた」で表した。
