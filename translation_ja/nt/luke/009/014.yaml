  text: ἦσαν γὰρ ὡσεὶ ἄνδρες πεντακισχίλιοι. εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Κατακλίνατε αὐτοὺς κλισίας ⸀ὡσεὶ ἀνὰ πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/014.yaml
  text: For there were about five thousand men[a]. And he said to his disciples[b], “Have them recline in groups of about fifty each.”
translation:
  language: ja
  text: 男性は約五千人いたからである。そこでイエスは弟子たちに言った。「人々を五十人ほどずつの組に分け、食事のために横にならせなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 当時、食事の際には横たわる姿勢を取ることがあった。「座らせなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ
  choice: 約／ほど
  rationale: 厳密な数ではなく概数であることを示す。同じ語の二度の出現を、それぞれ自然な日本語の「約」「ほど」で表した。
- source_word: ἄνδρες
  choice: 男
  rationale: 一般的な「人々」ではなく、成人男性を指す語の性別上の限定を保持した。
- source_word: πεντακισχίλιοι
  choice: 五千人
  rationale: ἄνδρεςを数える基数を明確で自然な日本語にした。
- source_word: Κατακλίνατε
  choice: 食事の席に着かせなさい
  rationale: 食事のために横たわらせる、すなわち当時の姿勢で食卓に着かせる意味を、現代日本語で誤解なく伝える表現とした。
- source_word: κλισίας
  choice: 組にして
  rationale: 人々を区分してまとまりごとに配置する意味を、簡潔で自然に表した。
- source_word: ἀνὰ πεντήκοντα
  choice: 五十人ほどずつ
  rationale: ἀνάの配分的な意味と、ὡσεὶの概数の意味をともに明示した。
- source_word: γὰρ ... δὲ
  choice: からである。そこで
  rationale: γάρの前文を説明する働きを「からである」で保ち、δέによる物語の展開を「そこで」で自然につないだ。
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: 弟子たちに
  rationale: 文脈上、イエスの弟子たちであることは明白であり、日本語では所有表現を重ねず自然にした。主語のイエスはギリシャ語では省略されているが、文脈から明確なので補った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙事文として簡潔で格調を保った。「食事の席に着かせなさい」により、古代の食事姿勢を逐語的に再現して不自然になることを避けつつ、食事の場面という含意を保持した。
