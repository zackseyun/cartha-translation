id: LUK.9.35
reference: Luke 9:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φωνὴ ἐγένετο ἐκ τῆς νεφέλης λέγουσα· Οὗτός ἐστιν ὁ υἱός μου ὁ ⸀ἐκλελεγμένος, αὐτοῦ ἀκούετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/035.yaml
  text: And a voice came from the cloud[a], saying, “This is my Son, the Chosen One; listen to him.”
translation:
  language: ja
  text: そして、雲から声がして、こう言った。「この方は、わたしの子、選ばれた者[a]である。この方に耳を傾けなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「わたしの子、選ばれた者」の代わりに「わたしの愛する子」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: 声がした
  rationale: 声が生じた出来事を、現代日本語の自然な物語表現で示す。
- source_word: ἐκ τῆς νεφέλης
  choice: 雲の中から
  rationale: ἐκの起点・出所を明確にし、声が雲から発したことを自然に表す。
- source_word: λέγουσα
  choice: こう言った
  rationale: 分詞が導く声の内容を、日本語の直接話法に自然につなぐ。
- source_word: Οὗτός ἐστιν
  choice: これは…である
  rationale: 指示と同定の力を保ちながら、厳かな宣言として訳す。
- source_word: ὁ υἱός μου
  choice: わたしの子
  rationale: 所有関係と父子関係を直接に表す。日本語では文脈上、敬称的な表記を加えずともキリスト論的用法が伝わる。
- source_word: ὁ ἐκλελεγμένος
  choice: 選ばれた者
  rationale: ἐκλέγομαιの完了受動分詞の意味を保つ。ギリシャ語に二つ目の所有代名詞はないため、「わたしが選んだ者」と補わず、同格的な称号として訳す。
- source_word: αὐτοῦ ἀκούετε
  choice: この者に聞きなさい
  rationale: 属格代名詞を伴うἀκούωが持つ「耳を傾け、従う」の命令的含意を保つ。「彼に」より指示対象が明瞭で、厳かな宣言にも適する。
theological_decisions:
- issue: 天からの声におけるキリスト論的呼称の異読
  choice: ἐκλελεγμένοςを「選ばれた者」とする
  alternative: ἀγαπητόςを「愛する子」とする
  rationale: 指定されたSBLGNT本文に従い、共観福音書のより周知された表現へ調和させない。「子」と「選ばれた者」という二つの表現を同格的に保持する。
- issue: ἐκλελεγμένοςにおける所有関係
  choice: 「選ばれた者」
  alternative: 「わたしの選んだ者」
  rationale: 文脈上、神に選ばれた者であることは明らかだが、原文には二つ目のμουがない。意味を過度に補わず、定冠詞付き分詞の称号的表現を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、天からの宣言にふさわしい簡潔で厳かな調子を保った。「この者に聞きなさい」は日常会話よりやや格調があるが、指示と命令を明確に伝える。
