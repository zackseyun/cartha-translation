lexical_decisions:
- source_word: καὶ
  choice: 弟子たちは
  rationale: 単純な接続は日本語の自然な物語文では明示せず、直前の文脈から動作主である弟子たちを補った。
- source_word: ἐποίησαν οὕτως
  choice: そのとおりにし
  rationale: 直前のイエスの指示を、その指示どおり実行したことを簡潔に表す。
- source_word: καὶ
  choice: 、
  rationale: 二つの動作の単純な連続を、日本語では連用形と読点によって自然に示した。
- source_word: κατέκλιναν
  choice: 食事の席に着かせた
  rationale: 食事のため人々を横にならせる、または席に着かせる使役的な意味を保ちつつ、現代日本語で自然に表現した。
- source_word: ἅπαντας
  choice: 皆を
  rationale: その場の人々全員という総体性を明確に保つ。
