lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な物語上のつながりを示し、原文にない強い時間的意味を加えない自然な接続表現。
- source_word: ἐπορεύθησαν
  choice: 一行は…向かった
  rationale: πορεύομαιは「行く、進む、旅をする」の意。日本語では文脈上の複数主体を「一行」として示し、「向かった」で目的地への移動を自然に表す。
- source_word: εἰς
  choice: へ
  rationale: 移動の目的地を示すεἰςを、自然な日本語の方向助詞で表した。
- source_word: ἑτέραν
  choice: 別の
  rationale: ἕτεροςが持つ「もう一つの」と「異なる」の両面を保ち、この文脈で自然な表現とした。
- source_word: κώμην
  choice: 村
  rationale: κώμηは都市より小さい集落を指すため、「村」が簡潔で正確。
