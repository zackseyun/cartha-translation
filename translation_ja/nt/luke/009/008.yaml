  text: ὑπό τινων δὲ ὅτι Ἠλίας ἐφάνη, ἄλλων δὲ ὅτι προφήτης ⸀τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/008.yaml
  text: and by some[a], that Elijah had appeared, and by others, that a prophet of the ancients had risen.
translation:
  language: ja
  text: また、エリヤが現れたと言う人もいれば、昔の預言者のだれかがよみがえったと言う人もいた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπό τινων ... ἄλλων
  choice: と言う人もいれば……と言う人もいた
  rationale: 前節から続く省略的な受動表現を、日本語で自然な報告の並列表現にした。二つの異なる意見が人々によって語られていたことを明確にする。
- source_word: δὲ ... δὲ
  choice: また……もいれば……もいた
  rationale: 意見を追加して並べる穏やかな接続・対照を、自然な現代日本語で表した。
- source_word: Ἠλίας ἐφάνη
  choice: エリヤが現れた
  rationale: ἐφάνηはここでは「姿を現した、現れた」の意味。後半のἀνέστηとの語義上の違いも保つ。
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: 昔の預言者のだれか
  rationale: 後置された不定代名詞τιςと属格τῶν ἀρχαίωνを、日本語として自然に「昔の預言者のだれか」とした。特定の預言者を指すとは限定しない。
- source_word: ἀνέστη
  choice: よみがえった
  rationale: 死者についてのうわさという文脈で、ἀνίστημιの「起き上がる、復活する」という意味を明確かつ自然に表す。能動形の表現を保ち、「よみがえらされた」とはしない。
theological_decisions:
- issue: 昔の預言者についての人々の主張の性質
  choice: よみがえった
  alternative: 戻って来た／よみがえらされた
  rationale: 死からの復活を示唆する原文の緊張を保ちつつ、その主張を訳者が事実として認定するのではなく、人々の意見として提示した。また、原文に明示されない受動の主体は補わない。
translation_notes:
  register: 明瞭で現代的な標準日本語。前節から続く意見の列挙として読めるよう「また」で始め、口語的すぎない「現れた」「よみがえった」を用いた。
