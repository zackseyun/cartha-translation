  text: Εἰσῆλθεν δὲ διαλογισμὸς ἐν αὐτοῖς, τὸ τίς ἂν εἴη μείζων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/046.yaml
  text: Then a dispute arose among them as to which of them might be the greatest[a].
translation:
  language: ja
  text: さて、弟子たちの間で、弟子たちのうちだれがいちばん偉いのかという議論が起こった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「議論」に当たる語は、「考え」または「論争」とも訳せる。直訳すると、「彼らの中に、……という考えが入った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰσῆλθεν δὲ
  choice: さて、…起こった
  rationale: δὲを穏やかな場面進行として「さて」とし、直訳すれば「入った」であるΕἰσῆλθενは、διαλογισμόςとの組み合わせに合う自然な日本語「起こった」で表した。
- source_word: διαλογισμὸς
  choice: 議論
  rationale: この語は内心の思いや推論にも、複数人の論議にもなり得る。ἐν αὐτοῖςと偉さをめぐる内容から対人的な「議論」が自然だが、原語の幅は脚注に残した。
- source_word: ἐν αὐτοῖς
  choice: 弟子たちの間で
  rationale: 直訳的な「彼らの中に」より、集団内で議論が生じたことを明確にする。「弟子たち」は直前の文脈上の指示対象を自然な日本語で補った。
- source_word: τὸ τίς ἂν εἴη
  choice: だれが…なのかという
  rationale: 冠詞付き間接疑問が議論の内容を示す構文として訳した。ἄν＋希求法の潜在性は、日本語では断定を避ける間接疑問「なのか」に自然に含ませた。
- source_word: μείζων αὐτῶν
  choice: 自分たちのうち…いちばん偉い
  rationale: μείζωνは形の上では比較級「より偉い」だが、限定された集団内の最高位を問う表現なので、自然な日本語の最上級相当表現とした。αὐτῶνは「自分たちのうち」とした。
theological_decisions:
- issue: 弟子たちの間に起きたことの性質
  choice: 議論
  alternative: 思い／論争
  rationale: 競争的な内容から単なる中立的思考以上のやり取りが示唆される一方、「論争」では対立の激しさを過度に確定しかねないため、「議論」を本文に採用し、語義上の曖昧さを脚注で保持した。
translation_notes:
  register: 明快で現代的かつ品位ある標準語。「いちばん偉い」は日常的に理解しやすく、集団内の順位を自然に表す。「自分たち」は弟子たち自身を指す再帰的な意味を明瞭にする。
