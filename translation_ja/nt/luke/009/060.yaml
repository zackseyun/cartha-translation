  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸀αὐτῷ· Ἄφες τοὺς νεκροὺς θάψαι τοὺς ἑαυτῶν νεκρούς, σὺ δὲ ἀπελθὼν διάγγελλε τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/060.yaml
  text: But he said to him[a], “Leave the dead to bury their own dead, but you, go and proclaim the kingdom of God.”
translation:
  language: ja
  text: しかし、イエスは彼に言われた。「死者たち[a]に、自分たちの死者を葬らせなさい。だが、あなたは行って、神の国を告げ知らせなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 最初の「死者」は比喩的に、霊的に応答しない人々を指し、二番目は実際に死んだ人々を指す、と理解されることが多いです。ただし、ギリシア語では両方に同じ語が使われており、本文ではその印象的な反復を保っています。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄφες
  choice: 葬らせなさい
  rationale: ここでは不定詞 θάψαι とともに、求められた務めから離れ、それをほかの者にさせるよう命じる表現。「任せなさい」と意訳しすぎず、使役形によって命令の鋭さと構文を自然な日本語で表した。
- source_word: τοὺς νεκροὺς ... τοὺς ἑαυτῶν νεκρούς
  choice: 死人たち……自分たちの死人
  rationale: 同じ νεκρούς の反復を保ち、最初を比喩、二番目を文字どおりと本文中で明示せず、原文の逆説と意味の緊張を残した。ἑαυτῶν の再帰的な強調は「自分たちの」で表した。
- source_word: θάψαι
  choice: 葬る
  rationale: 死者を埋葬することを表す標準的で自然な語を用いた。
- source_word: ἀπελθὼν
  choice: 行って
  rationale: 先行するアオリスト分詞を、日本語として自然に主命令へつながる連用形で表し、行動の順序も保持した。
- source_word: διάγγελλε
  choice: 告げ知らせなさい
  rationale: 継続的かつ公に宣言する現在命令の意味を、現代の一般読者にも分かる表現で示した。
- source_word: βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 神の支配を含意する、聖書で定着しつつ現代日本語でも理解可能な表現を採用した。
theological_decisions:
- issue: 二度出る「死人」の意味
  choice: 両方を「死人」と訳し、本文では意味の違いを説明しない。
  alternative: 「霊的に死んでいる者たちに、自分たちの死人を葬らせなさい」
  rationale: 最初は霊的に応答しない者、二番目は肉体的な死者を指す可能性が高いが、ギリシア語は両方に同じ語を用いる。本文で「霊的に」を補うと原文の意図的な逆説を一つの解釈に限定するため、説明は脚注に置いた。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。「宣べ伝える」のような教会語に偏りすぎず、「告げ知らせる」を採用した。対照を示す δέ と強調された σύ は「だが、あなたは」で表した。
