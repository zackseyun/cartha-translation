  yaml_path: translation/nt/luke/009/030.yaml
  text: And behold, two men were talking with him, who were Moses and Elijah,
translation:
  language: ja
  text: すると、見よ、二人の人がイエスと語り合っていた。その二人はモーセとエリヤであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 場面の突然の展開に注意を向けるルカの談話標識を保持するため。「すると」と組み合わせ、現代日本語でも流れが分かるようにした。
- source_word: ἄνδρες δύο
  choice: 二人の男
  rationale: ἀνήρがここでモーセとエリヤという男性二人を指すことを、簡潔かつ自然に表す。
- source_word: συνελάλουν
  choice: 語り合っていた
  rationale: 接頭辞 συν-の相互的な会話の意味と、未完了過去の継続中の動作をともに表す。
- source_word: αὐτῷ
  choice: イエスと
  rationale: συλλαλέωに伴う与格は会話の相手を示す。日本語では代名詞の「彼」より、文脈上の指示対象である「イエス」を明示する方が自然で明瞭。
- source_word: οἵτινες
  choice: それは……であった
  rationale: 二人の身元を特定する関係節を、日本語として自然な独立文で表した。強調的な解釈は加えていない。
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語聖書で定着した人名表記。
- source_word: Ἠλίας
  choice: エリヤ
  rationale: 日本語聖書で定着した人名表記。
theological_decisions:
- issue: 変貌の場面に現れた二人の身元
  choice: 二人をモーセとエリヤであると直接特定する。
  alternative: 律法や預言者などの象徴的意味を訳文に補う。
  rationale: 原文は二人の身元を明示するだけであり、その象徴的・終末論的意味は説明していないため、訳文にも解釈を加えない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「見よ」はやや文語的だが、ἰδοὺの注意喚起と場面の鮮明さを保つため採用した。
