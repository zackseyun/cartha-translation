id: LUK.9.3
reference: Luke 9:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Μηδὲν αἴρετε εἰς τὴν ὁδόν, μήτε ⸀ῥάβδον μήτε πήραν μήτε ἄρτον μήτε ἀργύριον, μήτε ⸀ἀνὰ δύο χιτῶνας ἔχειν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/003.yaml
  text: And he said to them[a], “Take nothing for the journey—neither a staff, nor a bag, nor bread, nor money[c][b]; and do not have two tunics each.”
translation:
  language: ja
  text: そして弟子たちに言われた。「旅には何も持って行ってはならない。杖も、袋[a]も、パンも、金銭[b]も。また、チュニックを一人につき二着持っていてはならない[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 旅の食料などを入れる袋。
    reason: lexical_alternative
  - marker: b
    text: 直訳「銀」。ここでは金銭を指す。
    reason: lexical_alternative
  - marker: c
    text: 「一人につき二着」は、各人が二着という意味。チュニックは、古代に肌に近く着た衣服。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδὲν αἴρετε εἰς τὴν ὁδόν
  choice: 旅には何も持って行ってはならない
  rationale: 旅支度についての禁止として、目的を表す句と命令の力を明瞭で自然な現代日本語にした。
- source_word: ῥάβδον
  choice: 杖
  rationale: 旅人が歩行時に用いる杖を指す文脈であり、簡潔で歴史的情景にも合う。
- source_word: πήραν
  choice: 袋
  rationale: 食料などを携える旅用の袋を指す。本文では簡潔な「袋」とし、具体的な意味合いを脚注に示した。
- source_word: ἄρτον
  choice: パン
  rationale: 一般的な食料へ広げず、原語が明示する品目をそのまま訳した。
- source_word: ἀργύριον
  choice: 金
  rationale: 字義は「銀」だが、この文脈では支払いに用いる金銭を意味するため、自然な「金」とした。
- source_word: ἀνὰ δύο χιτῶνας ἔχειν
  choice: 下着を二枚ずつ持っていてはならない
  rationale: ἀνάの分配的意味を「ずつ」で明示し、ἔχεινの「持っている」を保った。χιτώνは肌に近く着る衣服なので「下着」としたが、現代の下着との違いを脚注で補った。
theological_decisions:
- issue: 旅の備えに関する命令の範囲
  choice: 本文どおり弟子たちへの具体的な命令として訳す
  alternative: すべての時代の宣教者への普遍的規則であることを訳文に織り込む
  rationale: この節自体は派遣される弟子たちへの直接命令を述べるだけで、その適用範囲を訳文で決定すべきではない。
translation_notes:
  register: 明瞭で品位のある現代標準語。禁止命令は「持って行ってはならない」で明確にし、最後のἔχεινは単に「持って行く」とせず「持っていて」と訳し分けた。
