id: LUK.9.26
reference: Luke 9:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς γὰρ ἂν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους, τοῦτον ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται, ὅταν ἔλθῃ ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/026.yaml
  text: For whoever is ashamed of me and of my words[b][a], the Son of Man will be ashamed of him when he comes in his glory and the glory of the Father and of the holy angels.
translation:
  language: ja
  text: なぜなら、わたしとわたしのことばを恥じる者を、人の子もまた、自分の栄光と、父および聖なる御使いたちの栄光のうちに来るとき、恥じるからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς γὰρ ἂν
  choice: …者を
  rationale: 不定関係構文の一般化する意味を、日本語で自然な「…者」として表した。γάρは前節からの理由・説明を示すが、単独節として不自然な「なぜなら」を置かず、文脈上のつながりに委ねた。
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: 恥じる／恥じる
  rationale: 同じ動詞の反復を同じ訳語で保ち、人がイエスを恥じることと、人の子がその者を恥じることとの意図的な対応を明確にした。
- source_word: με καὶ τοὺς ἐμοὺς λόγους
  choice: わたしとわたしのことば
  rationale: λόγουςを解釈的に言い換えず「ことば」とし、イエス自身とその発言の双方が対象であることを保った。
- source_word: τοῦτον
  choice: その者を
  rationale: 先行する一般的な「…者」を受ける指示代名詞の力を、日本語で性を限定しない自然な表現にした。本文では語順上「…者を」を人の子の前に置くことで対応関係を示した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 定着した称号をそのまま用い、ダニエル書を含む聖書間の響きを保持した。
- source_word: ὅταν ἔλθῃ
  choice: 来るとき
  rationale: ὅταν＋接続法アオリストの未来時を表す自然な日本語とした。
- source_word: ἐν τῇ δόξῃ αὐτοῦ καὶ τοῦ πατρὸς καὶ τῶν ἁγίων ἀγγέλων
  choice: 自分の栄光と、父および聖なる御使いたちの栄光のうちに
  rationale: 一度だけ現れるδόξῃに後続の属格句が連なる構造を、「栄光」を補って明瞭にしつつ、栄光が人の子自身、父、聖なる御使いたちに関連づけられる原文の緊張を保った。
- source_word: τῶν ἁγίων ἀγγέλων
  choice: 聖なる御使いたち
  rationale: ἁγίωνの形容的意味を明示し、ἄγγελοιには現代の聖書語として理解される「御使い」を用いた。
theological_decisions:
- issue: 人がイエスを恥じることと、人の子がその者を恥じることの相互対応
  choice: 両方を「恥じる」と訳す
  alternative: 後半を「退ける」「認めない」と訳す
  rationale: 後半を結果の説明へ強めず、同一動詞の反復と、それが生む厳粛な神学的緊張を保持した。
- issue: 人の子、父、聖なる御使いたちに関わる終末的な栄光
  choice: 「自分の栄光と、父および聖なる御使いたちの栄光のうちに」
  alternative: 「自分の栄光のうちに、また父と聖なる御使いたちの栄光のうちに」
  rationale: 原文ではἐνが一度だけで、δόξῃに複数の属格が結びつく。三つの完全に別個な前置詞句と断定せず、同時にそれぞれとの関連を明瞭にした。
- issue: 一般的警告における文法上の男性単数
  choice: 性を限定しない「者」
  alternative: 「彼」
  rationale: ギリシア語の男性単数はここで一般化する働きを持つため、日本語では適用範囲を男性に限定しない「者」が原意を自然に伝える。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。中心語の反復（「わたし」「恥じる」「栄光」）を保ち、終末的宣言の荘重さを維持した。節単独でも読みやすいようγάρを機械的に訳出していない。
