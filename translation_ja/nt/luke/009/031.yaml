  text: οἳ ὀφθέντες ἐν δόξῃ ἔλεγον τὴν ἔξοδον αὐτοῦ ἣν ἤμελλεν πληροῦν ἐν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/031.yaml
  text: who, appearing in glory, were speaking about his departure, which he was about to fulfill in Jerusalem.
translation:
  language: ja
  text: 二人は栄光のうちに現れ、イエスがエルサレムで成し遂げようとしていた旅立ちについて話していた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「旅立ち」に当たるギリシア語は「エクソドス」で、「出発」や「出て行くこと」を意味する。文脈上、イエスがエルサレムで遂げる死を指すと理解されることが多いが、その後に続く出来事をも含む表現と理解することもできる。「成し遂げる」は「成就する」とも訳せる。
    reason: ἔξοδοςの基本語義を示しつつ、指示内容の範囲についての解釈上の余地を保つ。πληρόωの訳語上の選択肢も補足する。
lexical_decisions:
- source_word: οἳ ὀφθέντες ἐν δόξῃ
  choice: 二人は栄光のうちに現れ
  rationale: 関係代名詞は前節のモーセとエリヤを受けるため、日本語では「二人は」と明示した。「ἐν δόξῃ」は自然かつ荘重な「栄光のうちに」とした。
- source_word: ἔλεγον
  choice: 話していた
  rationale: 未完了時制が示す継続中の会話を表した。
- source_word: τὴν ἔξοδον αὐτοῦ
  choice: その旅立ち
  rationale: ἔξοδοςには「出発・旅立ち」の意味があり、ここではイエスの死だけでなく、その後の出来事を含み得る表現として曖昧さを保った。直前に固有名を補っているため「その」で受けた。
- source_word: ἣν ἤμελλεν πληροῦν
  choice: 成し遂げようとしておられる
  rationale: μέλλωの切迫した将来性と、πληρόωの「完遂する、成就する」という意味を自然な日本語で表した。敬語はイエスへの現代日本語聖書としての自然な敬意を保つ。
- source_word: ἐν Ἰερουσαλήμ
  choice: エルサレムで
  rationale: 出来事が遂行される場所を簡潔に示した。
theological_decisions:
- issue: ἔξοδοςが指す出来事の範囲
  choice: 「旅立ち」として比喩的広がりを保つ
  alternative: 「死」または「最期」
  rationale: 原語は明示的に「死」とは言わず、死・復活・昇天や救済史的な出エジプトとの響きを含み得るため、解釈を限定しなかった。
- issue: πληρόωの訳語
  choice: 「成し遂げる」
  alternative: 「果たす」「成就する」
  rationale: 目的ある出来事の完遂を示しつつ、「旅立ちを成就する」という不自然さを避けた。聖書的成就の含意は脚注で補う。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「栄光のうちに」で荘重さを保った。前節への依存を自然に処理するため主語を「二人」とし、対象は「イエス」と補った。
