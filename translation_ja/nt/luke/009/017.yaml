lexical_decisions:
- source_word: ἔφαγον
  choice: 食べて
  rationale: アオリストの出来事叙述を、後続の「満腹した」と自然につながる現代日本語で表した。
- source_word: ἐχορτάσθησαν
  choice: 満腹した
  rationale: 全員が十分に食べたことを、簡潔で自然な日本語で表す。受動形を逐語的に再現する「満たされた」より食事の文脈が明瞭である。
- source_word: πάντες
  choice: 皆
  rationale: その場の全員が食べたという強調を保持した。
- source_word: ἤρθη
  choice: 集めると
  rationale: αἴρω の受動形は字義的には「取り上げられた」だが、残り物を回収する文脈を自然に伝える。受動から能動への転換は日本語の自然さのためで、行為者は特定しない。
- source_word: τὸ περισσεῦσαν
  choice: 残った
  rationale: 冠詞付き分詞が示す「余ったもの」を、後続の κλασμάτων に自然に係る形で表した。
- source_word: αὐτοῖς
  choice: 明示しない
  rationale: この与格の関係は曖昧で、日本語で「彼らのために」とすると目的を過度に特定し、「彼らによって」とすると行為者を確定してしまう。食後に彼らのところに残ったものという関係は文脈上含意されるため、本文では無理に補わない。
- source_word: κλασμάτων
  choice: パン切れ
  rationale: κλάσμα は割かれた食物の断片を指し、直前のパンを受ける文脈では「パン切れ」が明瞭で自然である。ただし原語自体は「パン」を明示しないため脚注を付した。
- source_word: κόφινοι δώδεκα
  choice: 十二の籠
  rationale: 数量結果を日本語として自然な「十二の籠になった」で表現した。κόφινος の材質などは本文で特定しない。
