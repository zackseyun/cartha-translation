  text: 'And they all ate and were satisfied[b][a], and what was left over of the broken pieces was picked up for them: twelve baskets.'
translation:
  language: ja
  text: 人々は皆、食べて満腹した。余ったかけら[a]は集められ、十二の籠になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「砕かれた物のかけら」。文脈上、パンの残りを指すと理解できる。
