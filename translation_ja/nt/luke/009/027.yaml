id: LUK.9.27
reference: Luke 9:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω δὲ ὑμῖν ἀληθῶς, εἰσίν τινες τῶν ⸀αὐτοῦ ⸀ἑστηκότων οἳ οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/027.yaml
  text: But I tell you truly[b][a], there are some standing here who will certainly not taste death until they see the kingdom of God.
translation:
  language: ja
  text: しかし、あなたがたに本当のことを言います。ここに立っている人たちの中には、神の国を見るまでは、決して死を味わわない[a]人がいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死を味わう」は、「死を経験する」、すなわち「死ぬ」という意味の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω δὲ ὑμῖν ἀληθῶς
  choice: しかし、あなたがたに本当のことを言います
  rationale: δέを文脈上の対比を示す「しかし」とし、ἀληθῶςの真実性を、現代日本語として自然な「本当のことを」で表した。λέγωとὑμῖνも明示した。
- source_word: εἰσίν τινες τῶν αὐτοῦ ἑστηκότων
  choice: ここに立っている人たちの中には、…人がいます
  rationale: τινεςと属格による部分関係を「人たちの中には、…人がいます」で保ち、αὐτοῦの場所を指す意味を「ここに」で明示した。ἑστηκότωνは現在そこに立っている状態を表す。
- source_word: οἳ οὐ μὴ γεύσωνται θανάτου
  choice: 決して死を味わわない
  rationale: οὐ μήの強い否定を「決して…ない」で表し、γεύομαιの比喩を「味わう」として本文に残した。これは「死ぬ、死を経験する」という慣用表現であるため注を付した。
- source_word: ἕως ἂν ἴδωσιν
  choice: 見るまでは
  rationale: 将来の時点を限界として示すἕως ἄνとアオリスト接続法を、日本語の自然な「見るまでは」で表した。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: βασιλείαが持つ支配と領域の両面を狭めず、定着した明瞭な訳語「神の国」を採用した。
theological_decisions:
- issue: 「神の国を見る」が指す出来事
  choice: 解釈を加えず「神の国を見る」とした
  alternative: 変貌、復活・昇天、エルサレム陥落、または教会の拡大を指すと明示する
  rationale: この句の具体的な指示対象には複数の有力な解釈がある。本文はそのいずれかに限定していないため、終末論的な立場を訳文に持ち込まず、原文の緊張と余地を保った。
- issue: 死を味わわない期間表現の含意
  choice: 「見るまでは」とのみ訳した
  alternative: 神の国を見た後に必ず直ちに死ぬ、という含意を補う
  rationale: 「…まで」は否定される状態の時間的限界を示すが、その後の出来事を必然的に断定するものではない。原文以上の含意を加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「死を味わう」という原文の比喩と「神の国」の解釈上の幅を保った。「ここに立っている人たちの中には」により、属格の部分関係を不自然にならない形で明示した。
