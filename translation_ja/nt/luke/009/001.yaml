    issue: 「また病気を癒やす力」が、癒やしには「力」だけが与えられ、「権威」は悪霊を制することだけに限定されるように読める。
    rationale: 原文はδύναμιν καὶ ἐξουσίανを一組として与え、その後に悪霊に対する働きと病気を癒やす働きを続ける。厳密な作用域を不必要に狭めず、両語を両方の働きに関係づける表現が望ましい。
  - severity: low
    issue: 「お与えになった」は原文にない敬語的高揚を加える。
    rationale: 日本語の宗教文体として不自然ではないが、原文の平叙的なἔδωκενに対応する明瞭な現代語としては「与えた」がより中立的である。
  revised_text: さて、イエスは十二人を呼び集めて[a]、あらゆる悪霊に対し、また病気を癒やすための力と権威を彼らに与えた。
