id: LUK.9.1
reference: Luke 9:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Συγκαλεσάμενος δὲ τοὺς δώδεκα ἔδωκεν αὐτοῖς δύναμιν καὶ ἐξουσίαν ἐπὶ πάντα τὰ δαιμόνια καὶ νόσους θεραπεύειν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/001.yaml
  text: And calling the twelve together[a], he gave them power and authority over all the demons and to heal diseases[b],
translation:
  language: ja
  text: さて、イエスは十二人を呼び集めて[a]、あらゆる悪霊に対し、また病気を癒やすための力と権威を彼らに与えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「十二人を呼び集めた後」。
    reason: ギリシア語のアオリスト分詞は、主動詞に先行する動作を明示して訳すこともできる。本文では自然なつながりを保つため「呼び集めて」とした。
lexical_decisions:
- source_word: Συγκαλεσάμενος
  choice: 呼び集めて
  rationale: アオリスト中動態分詞の先行動作を、日本語で自然な連用表現として示した。「呼ぶ」だけでなく、συν- の「一緒に集める」という意味も保っている。
- source_word: δὲ
  choice: さて
  rationale: 強い逆接ではなく、物語を次の場面へ進める穏やかな接続として訳した。
- source_word: τοὺς δώδεκα
  choice: 十二人
  rationale: 原文にない「弟子たち」や「使徒たち」を補わず、文脈上特定されている十二人を簡潔に表した。
- source_word: ἔδωκεν
  choice: お与えになった
  rationale: δίδωμι の直接的な意味を保ちつつ、主語であるイエスにふさわしい自然で丁寧な叙述とした。
- source_word: δύναμιν
  choice: 力
  rationale: 働きを実行する能力・力を表す語として訳し、ἐξουσίαとの区別を保った。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 委ねられた権限や支配権を示す語として訳し、δύναμιςと同一視しないようにした。
- source_word: ἐπὶ πάντα τὰ δαιμόνια
  choice: あらゆる悪霊を制する
  rationale: ἐπίと対格が表す支配・権威の対象を、日本語として明確に示した。πάντα τὰ δαιμόνιαは集合的にも個別的にも理解できるため、「あらゆる」でその広がりを表した。
- source_word: δαιμόνια
  choice: 悪霊
  rationale: 現代日本語の聖書文体で理解しやすい直接的な対応語。「汚れた霊」は別のギリシア語表現を連想させるため採用しなかった。
- source_word: νόσους
  choice: 病気
  rationale: νόσοςの一般的意味を、普通の読者に明瞭な現代日本語で表した。
- source_word: θεραπεύειν
  choice: 癒やす
  rationale: 病気を治す働きを表す不定詞。文脈上、与えられた力の内容が明確になるよう「癒やす力」とした。
theological_decisions:
- issue: δύναμιςとἐξουσίαの区別
  choice: 「力と権威」と二語を区別して訳す
  alternative: 「権能」など一語にまとめる
  rationale: 実行する力と、それを行使する権威という原文の並列表現を保ち、イエスが十二人に与えたものを平板化しないため。
- issue: 「十二人」の呼称
  choice: 「十二人」とする
  alternative: 「十二弟子」または「十二使徒」とする
  rationale: この節の原文は単に「十二人」と述べており、「弟子」や「使徒」を補うと本文にない呼称を持ち込むことになるため。
- issue: 悪霊と病気に関する構文
  choice: 悪霊を制する「力と権威」と、病気を癒やす「力」を自然な日本語で示す
  alternative: 力と権威の両方を悪霊の制圧と病気の癒やしの双方に明示的にかける
  rationale: ギリシア語は「力と権威を、すべての悪霊の上に、また病気を癒やすために与えた」と読めるが、各名詞句の厳密な作用域には一定の統語的余地がある。日本語では不自然な曖昧さを避けつつ、病気を癒やす能力が与えられたという中心的意味を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「お与えになった」は過度に古風にならない敬意表現。読点により、悪霊を制する働きと病気を癒やす働きの並びを読み取りやすくした。
