  source_fidelity: 「病気を癒やす力」とした現行文は、δύναμιν καὶ ἐξουσίαν（力と権威）のうち「力」だけが癒やしに関係するかのように読める。ギリシア語の構文は、両者の作用域をそのように限定していないため、二語を癒やしにも自然に関係づける表現へ改めるのが安全である。
  naturalness: 「あらゆる悪霊に対し、また病気を癒やすための力と権威」とすると、現代標準日本語として滑らかであり、二つの委託内容の並びも明瞭になる。叙述は原文の通常の物語文に合わせ、「お与えになった」ではなく「与えた」とする。
  terminology: 「十二人」「力と権威」「悪霊」「病気を癒やす」は適切である。「悪霊」はδαιμόνιαの直接的な訳語であり、「力」と「権威」はδύναμιςとἐξουσίαの区別を保つ。
  issues:
