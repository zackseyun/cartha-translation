id: LUK.9.57
reference: Luke 9:57
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Καὶ πορευομένων αὐτῶν ἐν τῇ ὁδῷ εἶπέν τις πρὸς αὐτόν· Ἀκολουθήσω σοι ὅπου ⸀ἐὰν ⸀ἀπέρχῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/057.yaml
  text: And as they were going along the road[a], someone said to him, “I will follow you wherever you go.”
translation:
  language: ja
  text: 彼らが道を進んでいると、ある人がイエスに言った。「あなたがどこへ行かれても[a]、私は従います。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたがどこへ立ち去られても」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευομένων αὐτῶν
  choice: 彼らが……進んでいると
  rationale: 属格独立構文と現在分詞が示す、主節と同時進行する継続的な移動を、自然な現代日本語で表した。
- source_word: ἐν τῇ ὁδῷ
  choice: 道を
  rationale: 具体的な旅の場面を簡潔に示す。「道において」のような不自然な直訳を避けつつ、ルカにおける旅路の響きを保った。
- source_word: εἶπέν τις
  choice: ある人が……言った
  rationale: τιςは不特定の人物を指し、性別は明示しないため、「ある男」ではなく「ある人」とした。
- source_word: πρὸς αὐτόν
  choice: イエスに
  rationale: 発話の相手を文脈上の指示対象で明示し、単独でも理解しやすい日本語とした。
- source_word: Ἀκολουθήσω σοι
  choice: 私は従います
  rationale: 未来形による意志・決意を表す。ἀκολουθέωの文字どおりの追随と弟子として従う含意の双方を保てる表現とした。
- source_word: ὅπου ἐὰν ἀπέρχῃ
  choice: あなたがどこへ行かれても
  rationale: ὅπου、ἐάν、接続法による不定の意味を「どこへ……ても」で表した。ἀπέρχομαιの「立ち去る」という語感は注に残し、本文では自然な「行く」とした。
theological_decisions:
- issue: ἀκολουθέωに含まれる弟子として従う意味
  choice: 「従います」と訳し、説明を加えない
  alternative: 「あなたの弟子になります」
  rationale: この動詞はルカの文脈で弟子として従う意味を帯びるが、本文自体は追随を表す語を用いている。「従う」はその神学的含意を保ちつつ、解釈を説明として付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「行かれても」は相手への自然な敬意を示し、「従います」は過度に宗教的な言い回しを避けながら弟子としての含意を保つ。
