id: LUK.9.25
reference: Luke 9:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τί γὰρ ὠφελεῖται ἄνθρωπος κερδήσας τὸν κόσμον ὅλον ἑαυτὸν δὲ ἀπολέσας ἢ ζημιωθείς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/025.yaml
  text: For what does a man profit if he gains the whole world[a], but loses or forfeits himself?
translation:
  language: ja
  text: 人が全世界を手に入れても、自分自身を失い、あるいは損なうなら、何の益があるでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί γὰρ ὠφελεῖται
  choice: 何の益があるでしょうか
  rationale: γὰρの説明的なつながりは、日本語では文脈と修辞疑問の流れに含ませ、直訳的な「というのも」を置かず自然に表した。ὠφελεῖταιは利益・益を受けることを指すため、「何の益がある」で表現した。
- source_word: ἄνθρωπος
  choice: 人が
  rationale: ここでは特定の男性ではなく、人間一般を代表する単数なので、現代日本語で自然な「人」とした。
- source_word: κερδήσας τὸν κόσμον ὅλον
  choice: 全世界を手に入れても
  rationale: アオリスト分詞の仮定的・譲歩的な働きを「ても」で表した。κερδαίνωはここで獲得を意味し、「手に入れる」が自然である。
- source_word: ἑαυτὸν
  choice: 自分自身を
  rationale: 原文は「魂」や「命」を表す名詞ではなく再帰代名詞であるため、限定せず「自分自身」とした。
- source_word: ἀπολέσας
  choice: 失い
  rationale: 自分自身を失うという広い意味を保ち、滅ぼす・破滅させるなどに狭めなかった。
- source_word: ἢ ζημιωθείς
  choice: あるいは損なわれる
  rationale: ἢの選言を「あるいは」で明示し、受動分詞の「損失を被る／害を受ける」という意味と受動態を「損なわれる」で保持した。
theological_decisions:
- issue: ἑαυτόνが人間の運命について何を指すか
  choice: 自分自身
  alternative: 自分の魂／自分の命
  rationale: 本文はψυχήではなく再帰代名詞を用いる。人の非物質的な魂だけ、あるいは地上の命だけに意味を限定せず、人そのものを指す広がりを保った。
- issue: ἀπολέσαςとζημιωθείςの関係
  choice: 失い、あるいは損なわれる
  alternative: 失って破滅する
  rationale: 原文のἢが示す選言と、能動分詞・受動分詞の違いを残し、二つを一つの神学的概念に統合しなかった。
translation_notes:
  register: 明快で現代的ながら、修辞疑問の厳粛さを保つ文体。「何の益があるでしょうか」により、直前の教えを受ける問いとして自然にした。原文に脚注を必要とする異読や語義上の不可欠な補足はないため、脚注は付していない。
