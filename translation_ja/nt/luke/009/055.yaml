  text: στραφεὶς δὲ ἐπετίμησεν ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/055.yaml
  text: But he turned and rebuked them[a].
translation:
  language: ja
  text: しかし、イエスは振り向いて、彼らを叱った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後代の写本の中には、次の文を加えるものがある。「そして言った。『あなたがたは、自分たちがどのような霊の者か分かっていない。人の子が来たのは、人々のいのちを滅ぼすためではなく、救うためである。』」
    reason: textual_variant
lexical_decisions:
- source_word: στραφεὶς
  choice: 振り向いて
  rationale: στρέφωのアオリスト分詞で、弟子たちのほうへ体を向けた動作を表す。現代日本語として自然で、主動詞に先立つ動作も明確に伝える。
- source_word: δὲ
  choice: しかし
  rationale: 直前の弟子たちの申し出との対照を示す軽い逆接として訳した。
- source_word: ἐπετίμησεν
  choice: 叱った
  rationale: 強い言葉でとがめ、正すことを表す。文脈に即した明快な現代日本語であり、「戒めた」よりも弟子たちへの叱責を自然に伝える。
- source_word: αὐτοῖς
  choice: 彼らを
  rationale: 文脈上、直前に発言した弟子たちを指す。ギリシア語では与格だが、日本語では「叱る」の目的語として「彼らを」とするのが自然である。
theological_decisions:
- issue: 後代の写本に見られる長い加筆
  choice: SBLGNTの短い本文だけを本文に訳す。
  alternative: 「そして言った。『あなたがたは、自分たちがどのような霊に属しているのか分かっていない。人の子が来たのは、人々のいのちを滅ぼすためではなく、救うためである。』」を付加する。
  rationale: 提示されたギリシア語本文には長い文言がなく、本文へ取り込むべきではない。ただし、翻訳史上よく知られた重要な異読なので脚注に残す。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、聖書本文としての品位を保った。「イエス」はギリシア語本文では明示されないが、直前の文脈における主語を日本語で明確にするため補った。
