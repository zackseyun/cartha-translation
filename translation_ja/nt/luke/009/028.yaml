source:
  edition: SBLGNT
  text: Ἐγένετο δὲ μετὰ τοὺς λόγους τούτους ὡσεὶ ἡμέραι ὀκτὼ ⸀καὶ παραλαβὼν Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον ἀνέβη εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/028.yaml
  text: About eight days after these sayings[b][a], he took Peter and John and James and went up on the mountain to pray.
translation:
  language: ja
  text: これらの言葉[a]の後、およそ八日たって[b]、イエスはペトロとヨハネとヤコブを連れて、祈るために山へ登られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらの話」とも訳せる。ギリシア語の λόγους は、ここでは直前に語られた言葉や発言内容を指す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「およそ八日たって」。ὡσεὶ によって、おおよその期間であることが示されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: （独立した語句としては訳出しない）
  rationale: ここでは物語を進める定型的な移行表現であり、日本語では「たったころ」という節の運びによって自然にその機能を表せる。明示的な「さて」や「すると」を加える必要はない。
- source_word: μετὰ τοὺς λόγους τούτους
  choice: これらの言葉から
  rationale: λόγους は直前に語られた内容を指す。「言葉」は「話」や「教え」と限定しすぎず、原文の語義の幅を保つ。
- source_word: ὡσεὶ ἡμέραι ὀκτὼ
  choice: 八日ほどたったころ
  rationale: ὡσεὶ の概数性を「ほど」で明示する。「たったころ」により、物語の時間経過を自然な日本語で表す。
- source_word: παραλαβὼν
  choice: 連れて
  rationale: 同行させる意味を簡潔に表し、主動詞「登られた」に従属する分詞の関係も自然に保つ。
- source_word: Πέτρον καὶ Ἰωάννην καὶ Ἰάκωβον
  choice: ペトロとヨハネとヤコブ
  rationale: 三人の名と反復される καί を、明瞭で自然な日本語の列挙として表す。
- source_word: ἀνέβη εἰς τὸ ὄρος
  choice: 山へ登られた
  rationale: 上方への移動を「登る」で明確にし、εἰς の方向性を「へ」で表す。山を特定する情報は文脈にないため、日本語では不自然な定冠詞相当表現を加えない。
- source_word: προσεύξασθαι
  choice: 祈るために
  rationale: 目的を示す不定詞を、そのまま明瞭な目的表現で訳す。
theological_decisions:
- issue: 並行記事との日数表現の関係
  choice: 八日ほど
  alternative: 八日／六日後と調和させる表現
  rationale: ルカ本文の ὡσεὶ が示す概数を保ち、他の福音書の記事に合わせて正確な日数へ平準化しない。
- issue: 主語イエスの明示
  choice: イエスは
  alternative: 彼は／主語を省略
  rationale: ギリシア語では文脈上の主語が省略されているが、日本語で節を独立して読む際の明瞭さのためにイエスを補う。これは新たな解釈を加えるものではない。
translation_notes:
  register: 明瞭な現代標準語を用い、聖書本文としての品位を保った。「登られた」はイエスへの通常の敬意を自然に示すが、過度に古風な敬語は避けた。脚注記号は該当表現の直後に置いた。
