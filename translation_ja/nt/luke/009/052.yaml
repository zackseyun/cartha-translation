source:
  edition: SBLGNT
  text: καὶ ἀπέστειλεν ἀγγέλους πρὸ προσώπου αὐτοῦ. καὶ πορευθέντες εἰσῆλθον εἰς κώμην Σαμαριτῶν, ⸀ὡς ἑτοιμάσαι αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/052.yaml
  text: And he sent messengers ahead of him[b][a]. And they went and entered a village of the Samaritans to prepare for him.
translation:
  language: ja
  text: そしてイエスは、イエスに先立って使者たちを遣わした。彼らは行って、イエスのための準備をするために、サマリア人の村に入った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 遣わした
  rationale: 使者を任務のために送り出すことを表す、自然で格調ある訳語。アオリストの出来事も簡潔に示す。
- source_word: ἀγγέλους
  choice: 使者たち
  rationale: この文脈では天使ではなく、先に派遣された人間の使いを指す。「使者」は役割を明確に表す。
- source_word: πρὸ προσώπου αὐτοῦ
  choice: 自分に先立って
  rationale: 直訳的には「彼の顔の前に」だが、先行して目的地へ向かうという慣用的意味を、現代日本語で自然に表した。主語と同一人物を指すため「自分」とした。
- source_word: πορευθέντες
  choice: 出かけて行き
  rationale: 主動詞「入った」に先行する移動を、分詞構文の流れを保ちながら自然な連用表現で示した。
- source_word: εἰσῆλθον
  choice: 入った
  rationale: 村の中へ入るという移動を簡潔かつ直接的に表す。
- source_word: κώμην Σαμαριτῶν
  choice: サマリア人の村
  rationale: 属格複数を保ち、その村がサマリア人の村であることを自然に示す。「町」よりも κώμη の規模に即した「村」を選んだ。
- source_word: ὡς ἑτοιμάσαι αὐτῷ
  choice: イエスのために準備をしようと
  rationale: ὡς と不定詞による目的を表す。何を準備するかは原文同様に明示せず、αὐτῷ の指示対象は日本語で明瞭になるよう「イエス」とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語の簡潔な進行を保った。「イエス」は直前の文脈で明らかな主語・指示対象を、この一節だけでも理解しやすくするために明示した。
