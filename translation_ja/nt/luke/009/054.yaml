  terminology: 「主よ」はキリストへの呼びかけとして適切です。「焼き尽くす」は火の文脈におけるἀναλίσκωの強い意味を自然に表します。「弟子のヤコブとヨハネ」も同格構文の簡潔で適切な処理です。
