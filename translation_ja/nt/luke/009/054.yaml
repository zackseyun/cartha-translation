source:
  edition: SBLGNT
  text: ἰδόντες δὲ οἱ ⸀μαθηταὶ Ἰάκωβος καὶ Ἰωάννης εἶπαν· Κύριε, θέλεις εἴπωμεν πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ καὶ ἀναλῶσαι ⸀αὐτούς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/054.yaml
  text: When the disciples James and John saw this[a], they said, “Lord, do you want us to command fire to come down from heaven and consume them?”
translation:
  language: ja
  text: 弟子のヤコブとヨハネは、このことを見て言った。「主よ、私たちが、天から火が降って彼らを焼き尽くすように命じましょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδόντες
  choice: このことを見て
  rationale: 目的語は明示されていないが、直前のサマリア人の拒絶を受けることを自然な日本語で示すため「このこと」を補った。
- source_word: οἱ μαθηταὶ Ἰάκωβος καὶ Ἰωάννης
  choice: 弟子のヤコブとヨハネ
  rationale: 同格的な構文を、二人が弟子であることを保ちながら自然な日本語にした。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの直接の呼びかけとして、κύριος の標準的で荘重な訳語を用いた。
- source_word: θέλεις εἴπωμεν
  choice: 私たちが命じて…しましょうか
  rationale: 直訳は「私たちが言うことを、あなたは望みますか」だが、火に降るよう告げる発話の遂行的な力と、イエスの許可を求める問いを自然な日本語で表した。
- source_word: πῦρ καταβῆναι ἀπὸ τοῦ οὐρανοῦ
  choice: 天から火を降らせ
  rationale: 天から火が下るという預言者的な裁きのイメージを簡潔に保持した。
- source_word: ἀναλῶσαι αὐτούς
  choice: 彼らを焼き尽くす
  rationale: ἀναλίσκω の「滅ぼす／消尽する」という意味を、火の文脈に即して具体的に表した。
theological_decisions:
- issue: 「見て」の暗黙の目的語
  choice: 「このこと」を補う
  alternative: 「見たとき」「それを見て」
  rationale: ギリシア語には目的語がないが、前節の拒絶を指す談話上のつながりを明確にし、新たな内容は加えていない。
- issue: 弟子たちの提案の強さ
  choice: 「命じて、天から火を降らせ」
  alternative: 「天から火が降るように言って」「天から火を呼び下して」
  rationale: εἴπωμεν は字義的には「私たちが言う」だが、不定詞を伴い、火が降ることを実現させる命令的発話を表す。「命じて」は自然な日本語でその機能を示す一方、火を下す力が弟子自身に内在するとの解釈は加えない。
- issue: ἀναλῶσαι の裁きの表現
  choice: 「焼き尽くす」
  alternative: 「滅ぼす」「食い尽くす」
  rationale: 一般的な「滅ぼす」よりも火との結び付きを保持する。「焼き尽くす」は激しい裁きの意図を曖昧にしない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、直接話法には物語本文にふさわしい品位を保った。「主よ」は聖書的な呼称として維持し、それ以外は過度に文語的な表現を避けた。
