source:
  edition: SBLGNT
  text: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν· προσελθόντες δὲ οἱ δώδεκα εἶπαν αὐτῷ· Ἀπόλυσον τὸν ὄχλον, ἵνα ⸀πορευθέντες εἰς τὰς κύκλῳ κώμας ⸀καὶ ἀγροὺς καταλύσωσιν καὶ εὕρωσιν ἐπισιτισμόν, ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/012.yaml
  text: The day began to decline[a], and the twelve came and said to him, “Send the crowd away, so that they may go into the surrounding villages and countryside, find lodging, and get provisions[b], because we are here in a desolate place.”
translation:
  language: ja
  text: 日が傾き始めた。そこで十二人はイエスのもとに来て言った。「群衆を解散させてください。そうすれば、周りの村や農村地帯へ行って、宿を見つけ、食料を手に入れることができます。ここは人里離れた所[a]なのですから。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「荒れ野」とも訳せる。ギリシア語のἐρήμοςは、無人の、または人家のまばらな場所を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「食べ物を見つける」とも訳せる。ギリシア語のἐπισιτισμόςは、食料または食料の備えを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἡ δὲ ἡμέρα ἤρξατο κλίνειν
  choice: 日が傾き始めた
  rationale: κλίνωの「傾く」という比喩を保ちつつ、日が夕方へ向かうことを自然な現代日本語で表した。δέは文脈上「そこで」として次文に反映した。
- source_word: προσελθόντες δὲ οἱ δώδεκα
  choice: そこで十二人はイエスのもとに来て
  rationale: προσέρχομαιの接近の意味を「もとに来て」で自然に表し、οἱ δώδεκαは称号的表現を保って「十二人」とした。
- source_word: Ἀπόλυσον τὸν ὄχλον
  choice: 群衆を解散させ
  rationale: ἀπολύωはこの場面では拘束からの解放ではなく、集まった群衆を帰らせる意味なので「解散させる」とした。
- source_word: ἵνα πορευθέντες
  choice: 行って、…させてください
  rationale: 目的を表すἵναと先行動作を表す分詞を、日本語では一連の依頼として自然に表した。
- source_word: εἰς τὰς κύκλῳ κώμας καὶ ἀγρούς
  choice: 周りの村や農村地帯へ
  rationale: κώμηは「村」、ἀγρόςはここでは個々の畑だけでなく田園・農村の地域も指し得るため「農村地帯」とした。καίは日本語の自然な並列として「や」で表した。
- source_word: καταλύσωσιν
  choice: 泊まる所を見つけ
  rationale: καταλύωはこの文脈で宿泊することを指す。「宿を取る」より、村や農村地帯で滞在場所を確保する広い意味を保つ表現とした。
- source_word: εὕρωσιν ἐπισιτισμόν
  choice: 食べ物を手に入れ
  rationale: ἐπισιτισμόςは食糧・食料の備えを指す。日常的で明瞭な「食べ物」を用い、εὑρίσκωは文脈に即して「手に入れる」とした。
- source_word: ὅτι ὧδε ἐν ἐρήμῳ τόπῳ ἐσμέν
  choice: 私たちはこのような人里離れた所にいるのですから
  rationale: ἔρημοςは無人または人口の少ない場所を表し得るため「人里離れた所」とした。ὧδεは「このような…所に」に反映し、ὅτιは依頼の理由を示す「…のですから」とした。
