  text: ὃς γὰρ ⸀ἂν θέλῃ τὴν ψυχὴν αὐτοῦ σῶσαι, ἀπολέσει αὐτήν· ὃς δ’ ἂν ἀπολέσῃ τὴν ψυχὴν αὐτοῦ ἕνεκεν ἐμοῦ, οὗτος σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/024.yaml
  text: For whoever wants to save his life will lose it[a], but whoever loses his life for my sake will save it.
translation:
  language: ja
  text: なぜなら、自分のいのち[a]を救おうとする者はだれでも、それを失います。しかし、わたしのために自分のいのちを失う者はだれでも、その人こそ、それを救います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いのち」と訳したギリシア語は、文脈により「魂」または「自分自身」を意味することもあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς γὰρ ἂν θέλῃ
  choice: 救おうとする者はだれでも……からです
  rationale: ὃς…ἂνと接続法による一般的・不定の条件を「者はだれでも」で表し、θέλωの意志を「しようとする」で自然に示した。γάρは前節への説明的なつながりを保つため、文末の「からです」で訳した。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自分のいのち
  rationale: ψυχήは「いのち」「魂」「自分自身」の意味を取り得るが、ここでは救うことと失うことの対象となる人のいのち・存在を指す。「自分の」は各節の主語への再帰的関係を自然な日本語で表す。
- source_word: σῶσαι / σώσει
  choice: 救おうとする／救います
  rationale: 同じ動詞σῴζωの反復を「救う」で統一し、逆説の対応を保った。「保つ」よりも、現世の生存と究極的な救いが響き合う原文の幅を残せる。
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: 失う／失う
  rationale: ἀπόλλυμιを両節で同じく「失う」とし、修辞的な対称性を保った。「滅ぼす」は自分への能動的な破壊という響きが強すぎる。
- source_word: ἕνεκεν ἐμοῦ
  choice: わたしのために
  rationale: 原因または動機を示すἕνεκεν＋属格を、イエスへの献身という個人的焦点を保つ自然な表現にした。
- source_word: οὗτος σώσει αὐτήν
  choice: それを救います
  rationale: οὗτοςの指示的強調は日本語の「その者こそ」も可能だが、直前の「者はだれでも」が主題を明確にするため、過度に硬くせず述語を続けた。αὐτήνはψυχήを受ける「それ」として反復構造を保った。
theological_decisions:
- issue: ψυχήの意味
  choice: いのち
  alternative: 魂／自分自身
  rationale: 弟子として自分を捨てることを語る文脈では「いのち」が直接的な意味に最も適する。一方、単なる生物学的生命だけに限定せず、人の存在全体や魂を含み得る語義の幅を脚注で示した。
- issue: 「救う」と「失う」の逆説
  choice: 同じ日本語動詞を両節で反復する
  alternative: 保つ／失う、失う／得る
  rationale: 原文が同じσῴζωとἀπόλλυμιを対応させる構造を保存し、地上の自己保存と究極的な救いとの神学的緊張を説明的に解消しない。
- issue: οὗτοςの強調
  choice: 独立した「その者こそ」を置かず、自然な主題構文で表す
  alternative: その者こそ、それを救います
  rationale: 指示代名詞の焦点は「者はだれでも」という構文で十分に伝わる。日本語として不自然な重複を避けつつ、該当する者を明確に限定した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、イエスの厳粛な教えにふさわしい丁寧体を採用した。「生命」より親しみやすく聖書文体にもなじむ「いのち」を用い、原文の反復と逆説を優先した。脚注標識は対応語の直後ではなく節末に置き、本文の流れを妨げず節全体の「いのち」二例に関わる注であることを示した。
