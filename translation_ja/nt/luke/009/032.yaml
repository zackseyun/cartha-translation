source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος καὶ οἱ σὺν αὐτῷ ἦσαν βεβαρημένοι ὕπνῳ· διαγρηγορήσαντες δὲ εἶδον τὴν δόξαν αὐτοῦ καὶ τοὺς δύο ἄνδρας τοὺς συνεστῶτας αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/032.yaml
  text: Peter and those with him were weighed down with sleep; but when they became fully awake[a], they saw his glory and the two men standing with him.
translation:
  language: ja
  text: ペトロと一緒にいた者たちは眠気に圧倒されていた。だが、すっかり目が覚めると[a]、彼の栄光と、彼と一緒に立っていた二人の人を見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「目を覚ました後」「十分に目が覚めたとき」。このギリシア語動詞は用例が少なく、「ずっと目を覚ましていた」と解することもできるが、ここでは十分に覚醒したことを強調している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: βεβαρημένοι ὕπνῳ
  choice: 眠気に押しつぶされそうになっていた
  rationale: 眠りによって重く圧迫された状態を表す比喩を保ち、単なる「眠かった」より強い意味を自然な日本語で示す。
- source_word: διαγρηγορήσαντες
  choice: すっかり目が覚めると
  rationale: 文脈上、眠気の中でも起き続けたというより、十分に覚醒した状態になったことを表す可能性が高い。希少な動詞のため別解は脚注に残す。
- source_word: δόξαν
  choice: 栄光
  rationale: 変貌の場面における目に見える輝きと、聖書全体の神学的な響きの双方を保つ標準的な訳語。
- source_word: τοὺς δύο ἄνδρας
  choice: 二人の人
  rationale: 成人男性を指すが、日本語では文脈上「二人の人」が自然であり、モーセとエリヤを指す。
- source_word: τοὺς συνεστῶτας αὐτῷ
  choice: 彼と共に立っている
  rationale: その場に共に立つ視覚的な情景と、完了分詞が示す状態を保つ。
- source_word: δὲ ... δὲ
  choice: （第一のδέは無訳）／しかし
  rationale: 第一のδέはペトロたちへ話題を移す軽い接続で、日本語では明示しなくても自然。第二のδέは眠気と覚醒後の目撃との対照を「しかし」で示す。
theological_decisions:
- issue: 変貌の場面における δόξα の訳
  choice: 彼の栄光
  alternative: 彼の輝き／彼の威光
  rationale: 目に見える輝きを含みつつ、δόξαが持つ聖書的・神学的な連続性を過度な説明なしに保持する。
- issue: διαγρηγορήσαντες の解釈
  choice: すっかり目が覚めると
  alternative: 眠らずにいたので／目を覚ました後
  rationale: 直前の強い眠気との対照から、十分な覚醒に至ったとの理解を本文に採る。ただし「ずっと目を覚ましていた」と解し得る語彙上の曖昧さは脚注で保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「眠気に押しつぶされそう」は原文の重圧の比喩を読者に分かりやすく伝え、「栄光」は聖書用語としての連続性を保った。
