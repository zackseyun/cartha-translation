  text: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν τοὺς λόγους τούτους, ὁ γὰρ υἱὸς τοῦ ἀνθρώπου μέλλει παραδίδοσθαι εἰς χεῖρας ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/044.yaml
  text: Put these words into your ears[b][a], for the Son of Man is about to be handed over into the hands of men.
translation:
  language: ja
  text: 「あなたがたは、これらの言葉をよく耳に留めておきなさい。人の子は人々の手に引き渡されようとしているのです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裏切られようとしている」とも訳せる。ギリシア語の動詞は「引き渡す」「渡す」のほか、文脈によっては「裏切る」という意味にもなる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέσθε ὑμεῖς εἰς τὰ ὦτα ὑμῶν
  choice: あなたがたは……しっかり耳に入れておきなさい
  rationale: 直訳的な「耳の中に置く」という比喩を、日本語の自然な慣用表現「耳に入れる」で保ち、明示されたὑμεῖςの強調と、意識して聞き留める命令の力を「あなたがたは」「しっかり」「ておきなさい」で表した。
- source_word: τοὺς λόγους τούτους
  choice: 今から言うこと
  rationale: τούτουςは直示的だが、後続のγάρ以下が聞くべき発言内容を提示しているため、日本語では前方照応を明確にする「今から言うこと」が自然である。
- source_word: ὁ γὰρ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子は
  rationale: γάρの説明関係は、引用内で次文を直接続けることにより自然に示した。「人の子」は定着した称号であり、ダニエル書との響きと称号の含意を解釈で狭めずに保つ。
- source_word: μέλλει
  choice: ようとしている
  rationale: 目前に迫る事態を示すμέλλωの前向きな力を表しつつ、「定められている」のような運命論的含意を加えない。
- source_word: παραδίδοσθαι
  choice: 引き渡される
  rationale: 裏切りだけに限定せず、他者の支配下へ渡されるという受動形の広い意味を保つ。
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: 人々の手に
  rationale: 「手に」は他者の権力・支配下に置かれるという原文の慣用的比喩を保持する。ἀνθρώπωνはここでは人間一般を指し得るため、現代日本語で自然な「人々」とした。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουという称号
  choice: 人の子
  alternative: 人間である者
  rationale: 伝統的かつ原文に近い称号を用い、その曖昧さ、ダニエル書との間テクスト的関連、キリスト論的響きを保持した。
- issue: παραδίδοσθαιの意味範囲
  choice: 引き渡される
  alternative: 裏切られる
  rationale: ユダの裏切りだけに狭めず、イエスが人間の権力下へ渡されるという物語上の広い展開を保った。別義は脚注に示した。
- issue: ἀνθρώπωνの範囲
  choice: 人々
  alternative: 男たち
  rationale: 文法上は男性複数形だが、ἄνθρωποςは人間一般を表し得る。日本語の「男たち」は対象を男性に限定するため避け、「人の子」と「人々」の対照を保った。
translation_notes:
  register: イエスの厳粛な命令と受難予告にふさわしい品位を保ちながら、現代の一般読者に自然な標準語とした。原文の耳と手の身体的比喩は、日本語で通じる範囲で保持した。
