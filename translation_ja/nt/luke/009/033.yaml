source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ εἶπεν ⸀ὁ Πέτρος πρὸς τὸν Ἰησοῦν· Ἐπιστάτα, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν σκηνὰς τρεῖς, μίαν σοὶ καὶ μίαν Μωϋσεῖ καὶ μίαν Ἠλίᾳ, μὴ εἰδὼς ὃ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/033.yaml
  text: 'And as they were departing from him[a], Peter said to Jesus, “Master, it is good for us to be here. Let us make three shelters: one for you, one for Moses, and one for Elijah” — not knowing what he was saying.'
translation:
  language: ja
  text: 二人がイエスから離れて行くとき、ペトロはイエスに言った。「先生、私たちがここにいるのはよいことです。仮小屋[a]を三つ造りましょう。一つはあなたのため、一つはモーセのため、もう一つはエリヤのために。」ペトロは、自分が何を言っているのか分かっていなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天幕」、または伝統的には「幕屋」とも訳せる。ギリシア語は一時的な小屋や天幕を指し、仮庵の祭りなど、聖書に見られる祭りのイメージを響かせている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ διαχωρίζεσθαι αὐτοὺς ἀπ’ αὐτοῦ
  choice: 二人がイエスから離れようとしていたとき
  rationale: 物語上の慣用的な導入句を自然な時の表現とし、αὐτούςが直前のモーセとエリヤを指すことを「二人」で明確にした。未完了的な同時性と、イエスから離れる動きを保っている。
- source_word: Ἐπιστάτα
  choice: 先生
  rationale: ルカ特有の、権威ある人物への敬意を込めた呼びかけ。現代日本語で自然に理解でき、単なる職業名としての「教師」より呼称として適切である。
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: 私たちがここにいるのはすばらしいことです
  rationale: καλόνの肯定的評価を自然な日本語で表し、ペトロの感動を含み得る文脈にも合う一方、「ふさわしい」などの解釈に限定しない。
- source_word: ποιήσωμεν
  choice: 造りましょう
  rationale: 一人称複数の勧誘的接続法を提案として直接表現し、ποιέωにない建築上の細部を加えない。
- source_word: σκηνὰς
  choice: 仮小屋
  rationale: 一時的な小屋・幕屋を指す語として現代日本語で比較的明瞭であり、恒久的建造物との誤解を避ける。祭りや幕屋との関連は本文で断定せず脚注に残す。
- source_word: μὴ εἰδὼς ὃ λέγει
  choice: ペトロは、自分が何を言っているのか分かっていなかった
  rationale: 現在形λέγειの同時的な意味を保ち、分詞句の主語を日本語で明示して自然な結びとした。
theological_decisions:
- issue: 変貌の場面におけるσκηνάςの祭り・幕屋との関連
  choice: 仮小屋
  alternative: 天幕、幕屋
  rationale: 本文自体は仮庵の祭りや幕屋伝承との関連を明言していないため、本文では一時的な構造物という基本義を示す。聖書的な連想の可能性は脚注で保持し、特定の解釈を確定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会話には敬意と物語の荘重さを保った。「先生」は日常語として分かりやすく、ここでは権威ある相手への呼びかけとして用いている。
