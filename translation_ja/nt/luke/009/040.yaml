  terminology: 「弟子たち」「追い出す」は福音書の文脈で自然かつ一貫した用語である。「それ」は霊を最有力の指示対象としつつ本文の代名詞性を保つ。脚注の「その子を」は少年を指す場合の自然な日本語である。
