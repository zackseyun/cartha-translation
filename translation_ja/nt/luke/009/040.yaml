  yaml_path: translation/nt/luke/009/040.yaml
  text: And I begged your disciples to cast it out[a], but they were not able.
translation:
  language: ja
  text: 私はあなたの弟子たちに、それを追い出してくれるようお願いしましたが[a]、彼らにはできませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その子を」とも訳せる。代名詞が霊ではなく少年を指すと見る場合。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδεήθην
  choice: 願いました
  rationale: δέομαιが表す切実な依頼を、現代日本語として自然で品位のある形にした。「頼みました」より改まっており、「懇願しました」ほど語調を強めすぎない。
- source_word: τῶν μαθητῶν σου
  choice: あなたの弟子たち
  rationale: 福音書におけるμαθητήςの師弟関係を明確に保ち、定着した聖書用語を用いた。
- source_word: ἵνα ἐκβάλωσιν
  choice: 追い出してくださるよう
  rationale: ἵνα＋接続法が示す依頼の内容・目的を自然な日本語で表し、ἐκβάλλωの悪霊追放の文脈も保持した。依頼相手への敬意を補助動詞「くださる」で自然に示した。
- source_word: αὐτό
  choice: それを
  rationale: 中性代名詞は文脈上、霊を指す可能性が最も高い。「それ」は指示対象を明示しすぎず、原文の代名詞表現を保てる。
- source_word: οὐκ ἠδυνήθησαν
  choice: 彼らにはできませんでした
  rationale: δύναμαιの能力・可能性の意味を明確に表しつつ、自然な現代日本語とした。
theological_decisions:
- issue: 悪霊追放の文脈におけるαὐτόの指示対象
  choice: 霊を指すものとして「それ」と訳す。
  alternative: 苦しんでいる少年を指すものとして「その子を」と訳す。
  rationale: 周辺文脈の中性名詞πνεῦμαと一致し、ἐκβάλλωは通常、追い出される霊を目的語に取る。ただし代名詞だけでは少年を指す可能性を完全には排除できないため、脚注に別解を示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、父親の切実さと弟子たちの無力を落ち着いた叙述で表した。脚注記号[a]は、曖昧な代名詞「それを」に直結させるため、その句の直後に置いた。
