  text: εἶπεν δὲ αὐτοῖς· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸂Πέτρος δὲ ἀποκριθεὶς⸃ εἶπεν· Τὸν χριστὸν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/020.yaml
  text: And he said to them[a], “But who do you say that I am?” Peter answered, “The Messiah of God.”
translation:
  language: ja
  text: イエスは彼らに言った。「では、あなたがたは、わたしをだれだと言うのか。」ペテロが答えた。「神のメシア[a]です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神のキリスト」。
    reason: χριστός の伝統的な音写による訳語を示すため。
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: では、あなたがたは
  rationale: 明示された二人称複数代名詞の強調と、直前の人々の見方との対比を、自然な日本語の主題提示で表した。
- source_word: τίνα με λέγετε εἶναι
  choice: わたしをだれだと言うのか
  rationale: λέγετε＋対格＋不定詞による間接話法を、意味と語調を保つ自然な現代日本語にした。
- source_word: ἀποκριθεὶς εἶπεν
  choice: 答えた
  rationale: 先行するアオリスト分詞と定動詞を、日本語では簡潔な一つの発話動詞で表した。
- source_word: χριστόν
  choice: メシア
  rationale: ここでは固有名ではなく、イスラエルの待望を背景とする称号として用いられているため、称号の意味が伝わる「メシア」とした。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格の関係を過度に解釈せず、そのまま簡潔に保持した。
- source_word: δέ
  choice: そこで／では
  rationale: 最初のδέは談話を進める接続、二つ目は対比を示すため、それぞれの機能に応じて自然に訳し分けた。
theological_decisions:
- issue: ペテロの告白における χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: χριστός はこの箇所でイエスを神の油注がれた者として特定する称号である。伝統的な音写「キリスト」も可能なので脚注に残しつつ、本文では称号としての意味が明確な「メシア」を用いた。
translation_notes:
  register: 明瞭で現代的かつ品位ある会話文とした。Ὑμεῖς の対比的強調は「では、あなたがたは」で示し、ペテロの返答は日本語として自然な丁寧体にした。
