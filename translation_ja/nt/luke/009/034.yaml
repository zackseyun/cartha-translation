id: LUK.9.34
reference: Luke 9:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα δὲ αὐτοῦ λέγοντος ἐγένετο νεφέλη καὶ ⸀ἐπεσκίαζεν αὐτούς· ἐφοβήθησαν δὲ ἐν τῷ ⸂εἰσελθεῖν αὐτοὺς⸃ εἰς τὴν νεφέλην.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/034.yaml
  text: While he was saying these things, a cloud appeared and began to overshadow them; and they were afraid as they entered into the cloud.
translation:
  language: ja
  text: 彼がこれらのことを話しているうちに、雲が現れ[b]、彼らを覆い始めた[a]。彼らが雲の中に入って行くとき、彼らは恐れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らを覆った」とも訳せる。未完了過去の動詞は、動作の開始を明示せずに訳すこともできる。
    reason: lexical_alternative
  - marker: b
    text: この雲は、旧約聖書で神がご自身の臨在を現された場面を思い起こさせると考えられる。ただし、この節自体はそのことを明言していない。
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 複数形の指示代名詞を保ち、直前のペトロの発言内容を指すことを明確にした。
- source_word: αὐτοῦ λέγοντος
  choice: 彼が……話しているうちに
  rationale: 属格独立構文と現在分詞が示す同時進行の動作を、自然な現代日本語で表した。
- source_word: ἐγένετο νεφέλη
  choice: 雲が現れ
  rationale: 雲の出現・到来を表すἐγένετοを自然に訳し、その発生源について本文以上の説明を加えない。
- source_word: ἐπεσκίαζεν
  choice: 覆い始めた
  rationale: 未完了過去が表し得る開始・進行のニュアンスを反映した。「影で覆う」より自然であり、雲が彼らを包む情景も伝わる。
- source_word: ἐφοβήθησαν
  choice: 彼らは恐れた
  rationale: 恐れが生じたことを簡潔かつ直接的に表した。
- source_word: ἐν τῷ εἰσελθεῖν αὐτοὺς
  choice: 彼らが……入って行くと
  rationale: 前置詞付き冠詞的不定詞が示す同時的な時を表し、αὐτούςを不定詞の意味上の主語として訳した。
- source_word: εἰς τὴν νεφέλην
  choice: 雲の中に
  rationale: εἰςが示す内部への移動を保ち、単に雲の下にいたという表現にはしなかった。
theological_decisions:
- issue: 雲の性質とその働き
  choice: 本文では「雲が現れ、彼らを覆い始めた」と描写するにとどめる。
  alternative: 神の臨在を示す栄光の雲であると本文中で明示する。
  rationale: 旧約聖書の神顕現を想起させる可能性は高いが、この節自体は雲を明示的に神の臨在と同定していないため、象徴性を説明によって確定しない。
- issue: 雲の中に入った者の指示範囲
  choice: ギリシア語と同様に「彼ら」とし、固有名で特定しない。
  alternative: 弟子たち、またはイエスとモーセとエリヤ、と明示する。
  rationale: 代名詞αὐτούςの指示対象を訳文で狭く限定せず、原文の代名詞表現を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「覆い始めた」に注を付け、アスペクト上の別訳を示した。代名詞の指示対象と雲の神学的意味は本文で断定せず、原文の曖昧さと含意を保った。
