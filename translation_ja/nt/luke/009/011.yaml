source:
  edition: SBLGNT
  text: οἱ δὲ ὄχλοι γνόντες ἠκολούθησαν αὐτῷ. καὶ ⸀ἀποδεξάμενος αὐτοὺς ἐλάλει αὐτοῖς περὶ τῆς βασιλείας τοῦ θεοῦ, καὶ τοὺς χρείαν ἔχοντας θεραπείας ἰᾶτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/011.yaml
  text: But the crowds[a], learning of it, followed him. And welcoming them, he was speaking to them about the kingdom of God and healing those who had need of healing.
translation:
  language: ja
  text: しかし、群衆はそのことを知ると、イエスについて行った。イエスは彼らを迎え入れ、神の国について語り、治療を必要とする人々[a]を癒やしておられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「治療を必要とする人々」は、「癒やしを必要とする人々」とも訳せる。ギリシア語のθεραπείαには「治療、手当て」と「癒やし」の意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ὄχλοι
  choice: しかし、群衆は
  rationale: δέを、直前の退こうとする動きに対する穏やかな対照として「しかし」とした。ὄχλοιは形態上複数だが、日本語では集合的な「群衆」が自然で、人数の多さを損なわない。
- source_word: γνόντες
  choice: そのことを知ると
  rationale: アオリスト分詞の時間的用法を自然な従属節で表した。「そのこと」は、直前の文脈にあるイエスの移動・居場所を指すが、原文同様に明示しすぎない。
- source_word: ἠκολούθησαν αὐτῷ
  choice: イエスについて行った
  rationale: 物理的に後を追ったことを明瞭にしつつ、ἀκολουθέωが帯びうる「従う」という物語上の響きも残す。日本語では代名詞の連続を避けるため固有名を補った。
- source_word: ἀποδεξάμενος αὐτούς
  choice: 彼らを迎え入れ
  rationale: ἀποδέχομαιの好意的に受け入れる意味を、温かさのある自然な日本語で表した。
- source_word: ἐλάλει αὐτοῖς
  choice: 神の国について語り
  rationale: 未完了過去の継続性は、後続の「癒やしておられた」と文全体の進行的描写によって表す。「話していた」よりも、教えの内容にふさわしい「語る」を選んだ。
- source_word: περὶ τῆς βασιλείας τοῦ θεοῦ
  choice: 神の国について
  rationale: 福音書の主要語として定着し、βασιλείαの支配と領域の両面を保持できる「神の国」を採用した。
- source_word: τοὺς χρείαν ἔχοντας θεραπείας
  choice: 治療を必要としていた人々
  rationale: θεραπείαには「癒やし」だけでなく「治療・手当て」の意味もあるため、続くἰᾶτοとの不要な同語反復を避けながら名詞構文を保った。
- source_word: ἰᾶτο
  choice: 癒やしておられた
  rationale: 未完了過去が表す継続的な癒やしの働きを表現した。イエスへの敬意を自然に示す敬語とした。
theological_decisions:
- issue: βασιλεία τοῦ θεοῦの訳語
  choice: 神の国
  alternative: 神の支配
  rationale: 「神の支配」は動的統治を前面に出すが、「神の国」は日本語聖書で理解されやすい主要表現であり、原語の意味範囲を一方に限定せず、福音書内での用語の一貫性も保てる。
- issue: ἀκολουθέωの物語的含意
  choice: ついて行った
  alternative: 従った
  rationale: この場面ではまず群衆が物理的に後を追ったことを訳し、弟子として従ったと断定しない。ただし「ついて行く」によって原語の響きを残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。叙述は簡潔にし、未完了過去の継続性を「癒やしておられた」で示した。脚注記号は関連句の直後ではなく節末に置き、本文の流れを妨げないようにした。
