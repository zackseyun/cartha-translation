  text: καὶ εἰς ἣν ἂν οἰκίαν εἰσέλθητε, ἐκεῖ μένετε καὶ ἐκεῖθεν ἐξέρχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/004.yaml
  text: And whatever house you enter, stay there, and leave from there.
translation:
  language: ja
  text: どの家に入っても、そこに滞在し、そこから出発しなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν οἰκίαν
  choice: どの家に入っても
  rationale: 不定関係節の意味を、現代日本語で自然な条件表現として示した。οἰκίαは文脈上、滞在先となる「家」を指す。
- source_word: ἐκεῖ μένετε
  choice: そこに滞在し
  rationale: μένωの継続的にとどまる意味を「滞在する」で明確に表した。
- source_word: ἐκεῖθεν ἐξέρχεσθε
  choice: そこから出発しなさい
  rationale: ἐκεῖθενの起点を保持し、ἐξέρχομαιを、滞在先を離れて次へ向かう文脈に合う「出発する」とした。
theological_decisions:
- issue: 同じ家にとどまるという含意
  choice: 本文では「そこに滞在し、そこから出発」と原文どおり簡潔に表現する
  alternative: 「町を去るまで、その家に滞在しなさい」と含意を補う
  rationale: 原文には町を去る時までという説明が明示されていないため、並行箇所から補足せず、簡潔さと含みを保った。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。宣教旅行に関する命令として自然でありつつ、原文の反復（ἐκεῖ／ἐκεῖθεν）を「そこに／そこから」で保持した。
