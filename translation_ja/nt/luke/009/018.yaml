reference: Luke 9:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν προσευχόμενον κατὰ μόνας συνῆσαν αὐτῷ οἱ μαθηταί, καὶ ἐπηρώτησεν αὐτοὺς λέγων· Τίνα με ⸂οἱ ὄχλοι λέγουσιν⸃ εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/018.yaml
  text: And it happened that while he was praying alone[a], the disciples were with him, and he asked them, saying, “Who do the crowds say that I am?”
translation:
  language: ja
  text: さて、イエスが一人で祈っておられたとき[a]、弟子たちはイエスと共にいた。イエスは彼らに尋ねられた。「群衆は、わたしを何者だと言っているのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人目を避けて」「ひそかに」とも訳せる。原語の表現は、絶対的に他者がいないことだけでなく、人から離れた私的な状況を指す場合がある。
    reason: κατὰ μόναςは「一人で」のほか、「人目を避けて／私的に」という隔離・非公開の状況を表しうるため。
lexical_decisions:
- source_word: ἐγένετο
  choice: さて、…とき
  rationale: ルカに特徴的な場面展開の定型表現。直訳的な「起こった」は避け、物語の移行機能を自然な現代日本語で示した。
- source_word: ἐν τῷ εἶναι αὐτὸν προσευχόμενον
  choice: イエスが…祈っておられたとき
  rationale: ἐν＋冠詞付き不定詞が表す同時的な状況を「…とき」で表現した。主語は文脈上明確になるよう「イエス」とした。
- source_word: κατὰ μόνας
  choice: 一人で
  rationale: 単独または人から離れた状態を表す慣用句。簡潔な本文訳とし、「人目を離れて」の可能性は脚注に残した。
- source_word: συνῆσαν αὐτῷ οἱ μαθηταί
  choice: 弟子たちはそばにいた
  rationale: 単純な共在を表しつつ、「一人で祈る」との文脈に自然な日本語。「近くにいた」と断定して緊張を解消しないようにした。
- source_word: ἐπηρώτησεν αὐτοὺς
  choice: 彼らに尋ねられた
  rationale: 質問するという通常の意味を、イエスへの自然で品位ある敬語表現で訳した。
- source_word: λέγων
  choice: （直接話法への移行）
  rationale: 日本語では「言って」を重ねず、句点と引用で発話導入を自然に表した。意味上の情報は失われない。
- source_word: Τίνα με οἱ ὄχλοι λέγουσιν εἶναι
  choice: 群衆は、わたしを何者だと言っているのか
  rationale: 間接疑問の構造を自然な日本語で保持し、τίναを単なる固有名の問いに狭めない「何者」とした。
- source_word: οἱ ὄχλοι
  choice: 群衆
  rationale: 集まった多数の人々を指す語であり、一般化した「人々」より原語の社会的・場面的な輪郭を保つ。
theological_decisions:
- issue: イエスが「一人で」祈ることと、弟子たちが共にいることの見かけ上の緊張
  choice: 両方の内容を保持し、「一人で祈っておられた」と「弟子たちはそばにいた」を並置した。
  alternative: κατὰ μόναςを本文で「人目を離れて」と訳す、または弟子たちは「近くにいた」と補って整合させる。
  rationale: 原文は孤独な祈りと弟子たちの共在をそのまま述べる。弟子たちの位置や祈りへの参加状況を訳文で補わず、緊張と含みを保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、聖書本文としての品位を保った。イエスの動作には自然な尊敬表現を用いたが、発言内容は簡潔にした。脚注記号[a]を該当箇所に明示した。
