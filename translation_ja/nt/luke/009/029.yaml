id: LUK.9.29
reference: Luke 9:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν τὸ εἶδος τοῦ προσώπου αὐτοῦ ἕτερον καὶ ὁ ἱματισμὸς αὐτοῦ λευκὸς ἐξαστράπτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/029.yaml
  text: And as he was praying[a], the appearance of his face became different, and his clothing became white[b], flashing like lightning.
translation:
  language: ja
  text: 祈っておられる間に、その顔つきが変わり、衣は白く、稲妻のように輝いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο ἐν τῷ προσεύχεσθαι αὐτὸν
  choice: 祈っておられる間に
  rationale: ルカに特徴的な「ἐγένετο＋ἐν τῷ＋不定詞」の構文を、進行中の祈りと同時に出来事が起きたことを示す自然な日本語にした。文脈上の主語であるイエスへの敬意を自然に表すため「おられる」を用いた。
- source_word: τὸ εἶδος τοῦ προσώπου αὐτοῦ
  choice: その顔つき
  rationale: εἶδος はここでは目に見える外観を指す。「顔の様子」より簡潔で自然な「顔つき」とし、存在論的な「形」とは訳さなかった。
- source_word: ἕτερον
  choice: 変わり
  rationale: 字義は「異なるもの」であり、顔の外観が以前とは違った状態になったことを日本語で自然に表した。「輝いた」とはせず、マタイの表現との調和を避けた。
- source_word: ὁ ἱματισμὸς αὐτοῦ
  choice: 衣
  rationale: 衣服全体を指す語。物語の荘重さを保ちながら、現代日本語でも理解しやすい「衣」を選んだ。
- source_word: λευκὸς
  choice: 白く
  rationale: 基本義である白さをそのまま示し、続く分詞が表す輝きをこの語に重ねて付加しなかった。
- source_word: ἐξαστράπτων
  choice: 稲妻のように輝いた
  rationale: ἀστραπή（稲妻）を語幹に持つ分詞の鮮烈な光の像を保った。日本語では衣そのものを主語として自然に叙述するため、定動詞的に訳した。
theological_decisions:
- issue: イエスの変貌の描写
  choice: 顔の外観が「変わった」と訳し、衣の輝きとは区別して表現する。
  alternative: 「顔が輝いた」または「顔が変容した」
  rationale: ルカ本文は顔について ἕτερον（異なる）と抑制的に述べており、マタイの「太陽のように輝いた」を持ち込まない。「変容した」は神学用語として意味を強く規定しうるため避けた。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、場面の荘重さに合う「衣」を用いた。原文の二つの変化、すなわち顔つきの変化と衣の白く稲妻のような輝きを、過度に説明せず明瞭に示した。
