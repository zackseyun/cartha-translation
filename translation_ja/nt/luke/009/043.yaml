  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξεπλήσσοντο δὲ πάντες ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ. Πάντων δὲ θαυμαζόντων ἐπὶ πᾶσιν οἷς ⸀ἐποίει εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/043.yaml
  text: 'And they were all astonished at the majesty of God. But while everyone was marveling at all that he was doing[a], he said to his disciples:'
translation:
  language: ja
  text: 人々は皆、神の威光[a]に驚嘆していた。人々が皆、イエスのなさっているすべてのことに驚いているとき、イエスは弟子たちに言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の偉大さ」。ギリシア語は、偉大さ、壮大さ、威光を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: 驚嘆していた
  rationale: 未完了過去の継続的な様相と、強い驚きを表す動詞の力を保ちつつ、現代日本語として自然にした。
- source_word: πάντες
  choice: 皆は
  rationale: 反応した者が例外なく全員であったことを明示した。
- source_word: ἐπὶ τῇ μεγαλειότητι τοῦ θεοῦ
  choice: 神の威光に
  rationale: ἐπί＋与格が驚嘆の対象・理由を示すことを「に」で表し、μεγαλειότηςの偉大さ、荘厳さ、威光という意味領域に合う簡潔で品位ある表現を選んだ。
- source_word: Πάντων δὲ θαυμαζόντων
  choice: しかし、人々が皆……驚いていると
  rationale: 属格独立構文を時間的な従属節として訳した。δὲは、群衆の驚きとこれに続くイエスの発言との転換を「しかし」で示した。θαυμάζωは前文のより強いἐκπλήσσομαιと区別して「驚いている」とした。
- source_word: ἐπὶ πᾶσιν οἷς ἐποίει
  choice: イエスのなさっているすべてのことに
  rationale: ἐπί＋与格を驚きの対象として表し、未完了過去ἐποίειの進行・継続的な意味を「なさっている」で保った。日本語で主語が曖昧になりすぎないよう、文脈上の行為者イエスを明示した。
- source_word: εἶπεν πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: イエスは弟子たちに言われた
  rationale: 標準的な発言導入として自然に訳し、敬語は現代日本語の聖書文体として過度にならない範囲で用いた。
theological_decisions:
- issue: οἷς ἐποίειおよびεἶπενの省略された主語
  choice: 文脈上の主語を「イエス」と明示する
  alternative: 「彼がなさっている」「彼は言った」と訳す、または主語を省略する
  rationale: 直前の物語ではイエスが行為者かつ発言者である。神の威光がイエスの行為を通して現れているという本文の緊張関係は保ち、神とイエスを同一の文法的行為者として混同しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語の荘重さを保った。「驚嘆」と「驚く」を使い分け、原文にある二つの動詞の強さの違いを反映した。
