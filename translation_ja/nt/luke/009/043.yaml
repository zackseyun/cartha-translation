  to: 人々は皆、神の威光[a]に驚嘆していた。人々が皆、イエスのなさっているすべてのことに驚いているとき、イエスは弟子たちに言われた。
  rationale: 原文のδέに含まれる緩やかな叙述上の接続を、根拠の薄い逆接「しかし」によって強めないようにした。「人々は皆」として自然さを改善しつつ、両方の「全員」という表現、二種の驚き、イエスが行っていた事柄、ならびにイエスが弟子たちに語ったことを保持した。
