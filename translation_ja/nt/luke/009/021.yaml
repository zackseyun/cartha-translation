  yaml_path: translation/nt/luke/009/021.yaml
  text: But he rebuked them and commanded them to tell this to no one,[a]
translation:
  language: ja
  text: しかしイエスは弟子たちを厳しく戒め、このことを誰にも話してはならないと命じた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιτιμήσας
  choice: 厳しく戒め
  rationale: ἐπιτιμάωの鋭く制止・警告する語感を保ちつつ、この文脈で自然な現代日本語とした。「叱る」では弟子たちの過失を必要以上に示唆しうるため避けた。
- source_word: παρήγγειλεν
  choice: 命じた
  rationale: 権威ある指示を表すπαραγγέλλωの強さを明確に伝える。
- source_word: μηδενὶ
  choice: 誰にも…ない
  rationale: 話す相手を一人も認めない全面的な禁止を、自然な日本語の否定構文で表した。
- source_word: λέγειν
  choice: 話して
  rationale: 人に内容を伝えるという構文上の意味を、日本語で自然に表す。
- source_word: τοῦτο
  choice: このこと
  rationale: 直前のペトロの告白を指す指示性を保ち、本文で内容を説明しすぎないようにした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の告白と、それに続くイエスの意外な制止との穏やかな対比を示す。
- source_word: αὐτοῖς
  choice: 弟子たちを
  rationale: 文脈上の指示対象を明確にするため代名詞を名詞で表した。日本語では「彼らを」より自然である。
theological_decisions:
- issue: ペトロの告白後にイエスが課した禁止の強さ
  choice: この時点では公に伝えることを厳しく禁じる命令
  alternative: 単に口外しないよう穏やかに注意すること
  rationale: ἐπιτιμήσαςとπαρήγγειλενの組み合わせは、軽い依頼ではなく強い制止を示す。ただし、その理由やいわゆるメシアの秘密についての理論は本文に付加しない。
- issue: ἐπιτιμήσαςの対象とニュアンス
  choice: 弟子たちを厳しく戒めた
  alternative: 弟子たちを叱責した／厳重に警告した
  rationale: 原文の強さは保つ一方、彼らに道徳的過失があったと断定する「叱責」には寄せず、禁止に伴う厳しい制止として訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イエス」は原文では省略されている主語を文脈から補い、「弟子たち」はαὐτοῖςの指示対象を明示した。句の二つの動作を自然につなぎつつ、禁止命令の強さを保持した。
