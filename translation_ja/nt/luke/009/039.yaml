revisions:
- from: すると、霊[a]がこの子を捕らえ、突然、叫び声を上げます。霊はこの子を泡を吹かせて激しくけいれんさせ、ひどく痛めつけて、なかなか離れません。
  to: ご覧ください、霊[a]がこの子を捕らえると、突然、この子は叫び声を上げます。霊はこの子に泡を吹かせて、激しくけいれんさせます。そして、ようやくこの子から離れていくときにも、この子をひどく痛めつけます。
  rationale: ἰδούを注意喚起の「ご覧ください」として訳し、原文にない時間的・因果的な接続を避けた。μόγιςを「ようやく」で表し、ἀποχωρεῖと現在分詞συντρίβονの関係を「離れていくときにも…痛めつけます」と明瞭にした。πνεῦμαの非限定性は本文の「霊」と脚注の両方で保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:03Z'
review_pass:
  verdict: revise
  source_fidelity: 要改訂です。冒頭のἰδούは「すると」ではなく、注意を促す談話標識として表すのが適切です。また、μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόνは、霊が容易には去らず／ようやく去ることと、去り際にも子を傷つけることを述べます。現行訳の「ひどく痛めつけて、なかなか離れません」は、痛めつける行為を離れないことの前に置き、去る際の継続的な加害という係り方を十分に示していません。
  naturalness: 現行訳は全体として明瞭ですが、「霊はこの子を泡を吹かせて激しくけいれんさせ」は少し重く、「泡を吹かせて、激しくけいれんさせ」と区切るほうが自然です。「ご覧ください」は、この切迫した訴えにおいて古風すぎず、ἰδούの注意喚起を自然に伝えます。
  terminology: πνεῦμαは本文どおり「霊」とし、「悪霊」と限定しません。脚注の代案は有用で、本文の語彙上の非限定性も適切に説明しています。「けいれん」は症状の記述として自然であり、診断名を導入しません。
  issues:
  - severity: medium
    issue: ἰδούが「すると」と訳されている。
    rationale: ἰδούは因果・時間順序を示す「すると」ではなく、聞き手の注意を促す「見よ／ご覧ください」に当たる。
  - severity: high
    issue: συντρίβον αὐτόνの係り方が十分に表されていない。
    rationale: 現在分詞は「ようやく離れていく」際にも子を傷つけ続ける霊の動作を表す。改訂では「痛めつけながら」を用いてこれを明示する。
  - severity: low
    issue: 「泡を吹かせて激しくけいれんさせ」の連結がやや読みにくい。
    rationale: 「泡を吹かせて、激しくけいれんさせ」と区切ることで、泡を伴うこととけいれんさせることの関係が明瞭になる。
  revised_text: ご覧ください、霊[a]がこの子を捕らえると、突然、この子は叫び声を上げます。霊はこの子に泡を吹かせて、激しくけいれんさせます。そして、ようやくこの子から離れていくときにも、この子をひどく痛めつけます。
