id: LUK.9.39
reference: Luke 9:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ πνεῦμα λαμβάνει αὐτόν, καὶ ἐξαίφνης κράζει, καὶ σπαράσσει αὐτὸν μετὰ ἀφροῦ καὶ ⸀μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ συντρῖβον αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/039.yaml
  text: and look[a], a spirit seizes him, and suddenly he cries out, and it convulses him with foaming, and it scarcely departs from him, crushing him.
translation:
  language: ja
  text: ご覧ください、霊[a]がこの子を捕らえると、突然、この子は叫び声を上げます。霊はこの子に泡を吹かせて、激しくけいれんさせます。そして、ようやくこの子から離れていくときにも、この子をひどく痛めつけます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悪い霊」または「悪霊」とも訳せる。ギリシア語本文はここでは単に「霊」としている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: すると
  rationale: 父親の説明における場面の急な展開を、現代日本語で自然に示す談話標識とした。「見よ」はこの直接話法では古風で不自然になりやすい。
- source_word: πνεῦμα
  choice: 霊
  rationale: 本文は修飾語を伴わず、単に「霊」としているため、その語彙上の幅を保った。文脈上は敵対的な霊を指すが、本文では「悪霊」と明示しない。
- source_word: λαμβάνει
  choice: 捕らえ
  rationale: 霊が子を突然支配して襲う文脈に合い、単なる「取る」より力強さを伝える。
- source_word: ἐξαίφνης
  choice: 突然
  rationale: 出来事の突発性を明瞭かつ標準的な現代語で表す。
- source_word: κράζει
  choice: 叫び声を上げます
  rationale: 叫ぶ動作を自然に表しつつ、日本語では主語を明示せず、ギリシア語の連続した動詞構文にある主語解釈の余地を不必要に狭めない。文脈上は通常、この子が叫ぶと理解される。
- source_word: σπαράσσει αὐτὸν μετὰ ἀφροῦ
  choice: この子を泡を吹かせて激しくけいれんさせ
  rationale: 身体を激しく引きつらせる発作的な作用と、泡を伴う様子を、現代の読者に明瞭な表現で伝える。
- source_word: μόγις ἀποχωρεῖ ἀπ’ αὐτοῦ
  choice: なかなか離れません
  rationale: 霊が容易には去らない、またはようやく去るという μόγις の含意を、継続的な発作の描写に合う自然な日本語で表す。
- source_word: συντρῖβον αὐτόν
  choice: ひどく痛めつけて
  rationale: 文字どおりの「砕く」ではなく、この文脈で子に深刻な害を与える暴力性を、過度に具体化せずに表す。
theological_decisions:
- issue: πνεῦμαを本文で明示的に悪霊と特定するか
  choice: 霊
  alternative: 悪い霊／悪霊
  rationale: 物語の広い文脈では敵対的な超自然的存在だが、この節のギリシア語は限定なしに πνεῦμα とだけ記す。原文の特定度を保ち、文脈からの解釈を本文に織り込まない。
- issue: κράζειの動作主を明示するか
  choice: 日本語では主語を省略した「叫び声を上げます」
  alternative: この子が叫び声を上げます／霊が叫びます
  rationale: 文脈上は子が叫ぶとの理解が自然だが、ギリシア語では明示的な主語がなく、直前の文法的主語は「霊」である。日本語の自然な主語省略により、意味を明瞭にしながら構文上の緊張を過度に解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、父親が息子の激しい症状を切迫して説明する調子を保った。「見よ」のような古風な直訳や、医学的診断を想起させすぎる専門語は避けた。
