  text: ⸂εἶπεν δὲ⸃ ⸀ὁ Ἡρῴδης· Ἰωάννην ἐγὼ ἀπεκεφάλισα· τίς δέ ἐστιν οὗτος περὶ ⸀οὗ ἀκούω τοιαῦτα; καὶ ἐζήτει ἰδεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/009.yaml
  text: But Herod said[a], “John I beheaded; but who is this about whom I hear such things?” And he kept seeking to see him.
translation:
  language: ja
  text: しかし、ヘロデは言った。「ヨハネは、この私が首をはねた。では、この者について、このようなことを耳にしているのだが、いったいだれなのか。」そして、彼を見ようとし続けていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼を見ようとしていた」。ギリシア語の未完了過去は、継続する、または繰り返される行為を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: しかし／では
  rationale: 最初のδὲは直前の報告を受けつつヘロデの反応へ転じる軽い対比として「しかし」とし、問いの中のδὲは話の転換を示す「では」とした。
- source_word: Ἡρῴδης
  choice: ヘロデ
  rationale: 現代日本語の聖書表記として定着した人名表記を用いた。
- source_word: Ἰωάννην ἐγὼ ἀπεκεφάλισα
  choice: ヨハネなら、この私が首をはねた
  rationale: 動詞の具体的意味である斬首を明示し、明示されたἐγώの強調を「この私が」で保持した。「なら」はヨハネを話題として前に出す語順を自然な日本語にする。
- source_word: τίς ... ἐστιν οὗτος
  choice: この者はいったい何者なのか
  rationale: 指示語οὗτοςと身元を問う疑問を保ち、「いったい」でヘロデの困惑した問いの力を自然に示した。
- source_word: περὶ οὗ ἀκούω τοιαῦτα
  choice: 私がこんなことを耳にしている
  rationale: περὶ οὗの関係節を日本語として前置修飾にし、τοιαῦταの内容を「うわさ」などに限定せず「こんなこと」とした。現在形ἀκούωは継続中の聴聞として表した。
- source_word: ἐζήτει ἰδεῖν αὐτόν
  choice: 彼を見ようとし続けていた
  rationale: ἰδεῖνの基本義「見る」を保ち、未完了過去ἐζήτειの継続的な試みを「し続けていた」で表した。
theological_decisions:
- issue: ヘロデの問いとイエスの正体との関係
  choice: ヘロデがヨハネを斬首した事実と、耳にする人物の正体を問う言葉だけを訳文に示した。
  alternative: ヘロデがヨハネの復活を恐れていることを明示する意訳。
  rationale: 前後の文脈には復活をめぐる憶測があるが、本節そのものはその推論を明言していないため、物語上の緊張と本文の抑制を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヘロデの強い自己言及と困惑を保った。「この者」はやや距離を置いた指示の響きを残し、「彼を見ようとし続けていた」は原文の未完了相を明示する。
