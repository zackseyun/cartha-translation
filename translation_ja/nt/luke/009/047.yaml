id: LUK.9.47
reference: Luke 9:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀εἰδὼς τὸν διαλογισμὸν τῆς καρδίας αὐτῶν ἐπιλαβόμενος ⸀παιδίον ἔστησεν αὐτὸ παρ’ ἑαυτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/047.yaml
  text: But Jesus[a], knowing the reasoning of their hearts, took a child and set him beside himself[b],
translation:
  language: ja
  text: しかしイエスは、彼らの心のうちにある考えを知り、一人の子どもの手を取って、ご自分のそばに立たせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: 知り
  rationale: この文脈では、目で見ることではなく内面を認識していることを表す。認識の仕方までは本文が述べていないため、「知り」とした。
- source_word: διαλογισμὸν
  choice: 考え
  rationale: 内面的な思考・論議・思惑を指し得る語。直前の弟子たちの議論との関係を保ちつつ、現代日本語として明瞭な「考え」を採った。
- source_word: τῆς καρδίας αὐτῶν
  choice: 彼らの心のうちにある
  rationale: καρδίας は単数形、αὐτῶν は複数所有である。日本語では数の不一致を無理に再現せず、各人または集団の内面を自然に表した。
- source_word: ἐπιλαβόμενος
  choice: 手を取って
  rationale: 単なる「連れて来て」よりも、つかむ・手を取るという具体的な接触を伝え、子どもを扱う場面に自然な日本語とした。ギリシア語に「手」は明記されないため、これは文脈に即した慣用的補足である。
- source_word: παιδίον
  choice: 一人の子ども
  rationale: 年少の子どもを意味するが、「幼子」と年齢を狭く限定せず、現代の一般読者に自然な表現とした。不定の一人であることを示すため「一人の」を添えた。
- source_word: ἔστησεν
  choice: 立たせた
  rationale: 使役的な「立たせる」という動作を保ち、「置いた」より原語の姿勢の含みを明確にした。
- source_word: παρ’ ἑαυτῷ
  choice: ご自分のそばに
  rationale: 再帰代名詞の指示対象がイエスであることを明瞭にし、敬意を備えた自然な日本語で近接位置を表した。
theological_decisions:
- issue: イエスが弟子たちの内心を知ったこと
  choice: 「彼らの心のうちにある考えを知り」とし、知っていた事実だけを述べる。
  alternative: 超自然的な全知によって見抜いた、または人間的洞察によって察した、と明示する。
  rationale: ルカ本文はイエスが内面の考えを知ったと述べるが、その仕組みを説明していない。翻訳でも機序を補わず、神学的な緊張を保持した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体。「しかし」で前節との転換を示し、分詞二つを日本語の連用形で自然につないだ。注記を必要とするほど重要な異読・訳語上の曖昧さはないため、脚注は設けていない。
