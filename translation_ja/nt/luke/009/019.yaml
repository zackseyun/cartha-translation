  text: οἱ δὲ ἀποκριθέντες εἶπαν· Ἰωάννην τὸν βαπτιστήν, ἄλλοι δὲ Ἠλίαν, ἄλλοι δὲ ὅτι προφήτης τις τῶν ἀρχαίων ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/019.yaml
  text: And they answered[a], “John the Baptist; but others, Elijah; and others, that some prophet of the ancients has risen.”
translation:
  language: ja
  text: 弟子たちは答えた。「バプテスマのヨハネですと言う人もいれば、エリヤですと言う人もいます。また、昔の預言者の一人がよみがえったのですと言う人もいます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθέντες εἶπαν
  choice: 弟子たちは答えた
  rationale: 分詞と定動詞を重ねるセム語的な言い回しを、現代日本語で自然な「答えた」とした。主語は直前の文脈に基づき「弟子たち」と明示した。
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: バプテスマのヨハネ
  rationale: βαπτιστήςの働きを示しつつ、日本語の聖書用語として広く通用する呼称を採用した。
- source_word: ἄλλοι δὲ ... ἄλλοι δὲ
  choice: …と言う人もいれば、…と言う人もいます。また、…と言う人もいます
  rationale: 三つの異なる回答を対照的に並べる反復構造を、明瞭で自然な日本語として表した。
- source_word: Ἠλίαν
  choice: エリヤ
  rationale: 旧約の預言者名として定着した日本語表記。
- source_word: προφήτης τις τῶν ἀρχαίων
  choice: 昔の預言者の一人
  rationale: τιςの不定性と、τῶν ἀρχαίωνが指す過去の預言者たちの中の一人という意味を、簡潔で自然に表した。
- source_word: ἀνέστη
  choice: よみがえった
  rationale: 過去の預言者が再び現れたという文脈で、復活を含み得るἀνίστημιの意味を明確に伝える。ただし誰がよみがえらせたかなど、本文にない説明は加えない。
theological_decisions:
- issue: ἀνέστηが復活を明示する語として訳されるべきか
  choice: よみがえった
  alternative: 現れた／立ち上がった
  rationale: この箇所では昔の預言者が再び生きて現れたという群衆の推測を指すため、「よみがえった」が文脈に最も適する。復活についての群衆の見解を述べるにとどめ、その真偽を訳文で判断しない。
translation_notes:
  register: 明瞭な現代標準日本語。直接話法の中では、弟子たちがイエスに答える場面に合う丁寧体を用いた。列挙を日本語らしい「人もいれば」の構文で整理し、荘重さを損なわず一般読者にも理解しやすくした。
