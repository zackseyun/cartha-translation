  text: ⸂εἶπεν δὲ⸃ πρὸς αὐτὸν ⸀ὁ Ἰησοῦς· Μὴ κωλύετε, ὃς γὰρ οὐκ ἔστιν καθ’ ⸂ὑμῶν ὑπὲρ ὑμῶν⸃ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/050.yaml
  text: But Jesus said to him[a], “Do not stop him, for whoever is not against you is for you.”
translation:
  language: ja
  text: しかし、イエスは彼に言われた。「その人を妨げてはならない。[a] あなたがたに反対しない者は、あなたがたの味方だからである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その人をやめさせてはならない」「その人に禁じてはならない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: しかし、…言われた
  rationale: δέはここでは、直前のヨハネの報告に対する応答と軽い対照を示す。「しかし」は文脈上の転換を自然に表す。
- source_word: πρὸς αὐτόν
  choice: 彼に
  rationale: 原文の代名詞を保ち、直前に発言したヨハネを固有名で補わない。
- source_word: Μὴ κωλύετε
  choice: その人をやめさせてはならない
  rationale: κωλύωは「妨げる、禁じる、やめさせる」の意。文脈では弟子たちがその人の行為を制止しようとしたことを指すため、現代日本語として明瞭な「やめさせる」を採用した。命令形は複数の弟子たちに向けられている。
- source_word: ὃς γὰρ
  choice: …者は…だからである
  rationale: ὃςを一般原則を表す「者」とし、γάρによる理由づけを「だからである」で示した。
- source_word: οὐκ ἔστιν καθ’ ὑμῶν
  choice: あなたがたに反対しない
  rationale: κατά＋属格が示す対立を「反対する」で表し、二人称複数のὑμῶνを「あなたがた」と明示した。
- source_word: ὑπὲρ ὑμῶν
  choice: あなたがたの味方
  rationale: ὑπέρがここで示す支持・同調を自然な日本語の「味方」で表し、「反対」との対照を保った。
theological_decisions:
- issue: イエスの言葉が及ぶ範囲
  choice: 「…者」として一般原則として訳す
  alternative: 「その人は」とし、名のない悪霊追放者だけを直接指す訳
  rationale: 関係代名詞ὃςは目の前の事例を指しつつ、より広い原則も表し得る。日本語の「者」はその広がりを保ち、特定の教理的解釈に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には簡潔で dignified な「言われた」「ならない」「だからである」を採用した。「あなたがた」により、原文の複数形を明示している。
