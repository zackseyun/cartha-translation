  text: καὶ ἐν τῷ γενέσθαι τὴν φωνὴν ⸀εὑρέθη Ἰησοῦς μόνος. καὶ αὐτοὶ ἐσίγησαν καὶ οὐδενὶ ἀπήγγειλαν ἐν ἐκείναις ταῖς ἡμέραις οὐδὲν ὧν ἑώρακαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/036.yaml
  text: And when the voice had come[a], Jesus was found alone. And they kept silent and told no one in those days anything of what they had seen.
translation:
  language: ja
  text: その声がしたとき、そこにはイエスだけがおられた。[a] 弟子たちは沈黙を守り、そのころ、自分たちが見たことを何一つだれにも話さなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イエスだけが見いだされた」。「イエスだけが残っていた」または「イエスだけが見えた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ γενέσθαι τὴν φωνήν
  choice: その声がしたとき
  rationale: ἐν＋冠詞付き不定詞の時間的用法を「～したとき」とし、φωνήは文脈上、天から語る「声」を指す。「声がした」は現代日本語として自然で、声が生じた時点を簡潔に表す。
- source_word: εὑρέθη Ἰησοῦς μόνος
  choice: そこにはイエスだけがおられた
  rationale: 直訳的な「イエスがひとりであるのが見いだされた」は日本語では不自然なため、場面の結果を自然に表した。εὑρέθηの受動形が持つ表現上の余韻と、μόνοςが示すイエスの単独の臨在については脚注で補う。
- source_word: ἐσίγησαν
  choice: 沈黙を守り
  rationale: 単に一時的に黙ったというより、見たことを語らずにいたという後続文とのつながりを自然に示す。
- source_word: οὐδενὶ ἀπήγγειλαν
  choice: だれにも話さなかった
  rationale: ἀπαγγέλλωの「伝える、報告する」を、物語文に適した明瞭な現代日本語で表した。
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: そのころ
  rationale: 直訳は「その日々には」だが、一定期間を指す自然な日本語として「そのころ」とした。
- source_word: οὐδὲν ὧν ἑώρακαν
  choice: 自分たちが見たことを何一つ
  rationale: οὐδένの全面否定と、ὧν ἑώρακανが指す目撃内容を、自然な語順で明確に保持した。
theological_decisions:
- issue: 天からの声の後にイエスだけがおられたことの物語的含意
  choice: 「そこにはイエスだけがおられた」と描写にとどめる
  alternative: 「イエスだけが残された」または「弟子たちにはイエスだけが見えた」と解釈を明示する
  rationale: 本文は場面の結果を報告するが、その視覚的過程や神学的意味を明説していない。特定の解釈を本文に加えず、原文の抑制を保った。
translation_notes:
  register: 明瞭な現代標準語による、簡潔で品位ある物語文。「おられた」はイエスへの自然な敬意を示す一方、過度に儀礼的な敬語は避けた。
