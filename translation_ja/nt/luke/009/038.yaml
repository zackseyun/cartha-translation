  to: すると、群衆の中から一人の男が叫んだ。「先生、どうか私の息子に目を留めてください。この子は私の一人っ子なのです。[a]」
  rationale: 本文は、不自然な「すると見よ」を自然な現代日本語の「すると」に改めた。これにより、καὶ ἰδούの叙述上の転換・注意喚起を保ちながら、明瞭で読みやすい文体にした。μονογενήςの本文訳と脚注の訳語選択は維持し、脚注の原語説明だけをより正確で自然なものに整えた。
