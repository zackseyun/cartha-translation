id: LUK.9.38
reference: Luke 9:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἀνὴρ ἀπὸ τοῦ ὄχλου ⸀ἐβόησεν λέγων· Διδάσκαλε, δέομαί σου ἐπιβλέψαι ἐπὶ τὸν υἱόν μου, ὅτι μονογενής ⸂μοί ἐστιν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/038.yaml
  text: And behold[a], a man from the crowd cried out, saying, “Teacher, I beg you to look upon my son, because he is my only child.”
translation:
  language: ja
  text: すると、群衆の中から一人の男が叫んだ。「先生、どうか私の息子に目を留めてください。この子は私の一人っ子なのです。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この子は私の一人息子なのです」。ギリシア語は、この子が父にとって唯一の子であることを表す。すでに「息子」と示されているため、どちらの訳も可能。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: すると見よ
  rationale: 場面への注意を促す談話標識としての力を保ちつつ、καίとの連結を現代日本語で示す。
- source_word: ἀνὴρ ἀπὸ τοῦ ὄχλου
  choice: 群衆の中から一人の男が
  rationale: ἀνήρが男性を指すことを保ち、群衆の一員から声が上がった情景を自然に表す。
- source_word: ἐβόησεν λέγων
  choice: 叫んだ
  rationale: 大声で切迫して訴えたことを表し、日本語では「言って叫んだ」という冗長さを避け、後続の直接話法につなげる。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとして自然で、διδάσκαλοςの基本義である教える者を過度な権威称号にせず伝える。
- source_word: δέομαί σου
  choice: どうか…ください
  rationale: 切実な懇願を、現代日本語の丁寧で強い依頼表現によって伝える。
- source_word: ἐπιβλέψαι ἐπὶ
  choice: 目を留めて
  rationale: 単に視線を向けるだけでなく、顧みて配慮する含みを保つ。文脈上の救助や癒やしを明示して意味を狭めることはしない。
- source_word: τὸν υἱόν μου
  choice: 私の息子
  rationale: 語義と性別をそのまま明確に表す。
- source_word: μονογενής μοί ἐστιν
  choice: この子は私の一人っ子なのです
  rationale: μονογενήςの「ただ一人」の意味と与格による所有関係を自然に表す。「一人息子」も可能なため注記する。
theological_decisions:
- issue: ἐπιβλέψαι ἐπίが求める行為の範囲
  choice: 目を留めてください
  alternative: 癒やしてください／助けてください
  rationale: 父の意図は文脈上救助を求めるものだが、原文は直接「癒やす」「助ける」とは言わないため、配慮を求める表現の幅を保持した。
- issue: μονογενήςの指示内容
  choice: 一人っ子
  alternative: 一人息子
  rationale: すでに「息子」と明示されており、μονογενήςは彼が父にとってただ一人の子であることを表し得る。ただし文脈に即した「一人息子」も可能なので脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、父親の切迫した懇願とルカの注意喚起表現を残した。「見よ」は本文の語り口をやや格調高くするが、ἰδούを省略せず伝えるため採用した。
