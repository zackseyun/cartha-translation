id: LUK.9.62
reference: Luke 9:62
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ Ἰησοῦς⸃· Οὐδεὶς ἐπιβαλὼν τὴν ⸀χεῖρα ἐπ’ ἄροτρον καὶ βλέπων εἰς τὰ ὀπίσω εὔθετός ἐστιν ⸂τῇ βασιλείᾳ⸃ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/009/062.yaml
  text: But Jesus said[b][a], “No one who has put his hand to the plow and looks back is fit for the kingdom of God.”
translation:
  language: ja
  text: しかし、イエスは言われた。「鋤（すき）に手をかけてから[a]後ろを振り返る者はだれも、神の国にふさわしくない[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「鋤に手をかけた者」。耕作に取りかかった後で、注意を後方へ向ける姿を描いている。
    reason: lexical_alternative
  - marker: b
    text: または「神の国によく適していない」「神の国のために役立たない」。
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐδεὶς
  choice: だれも……ない
  rationale: 性別を限定せず、原文の普遍的な否定を自然な現代日本語で表す。
- source_word: ἐπιβαλὼν τὴν χεῖρα ἐπ’ ἄροτρον
  choice: 鋤に手をかけてから
  rationale: 耕作を始めるために鋤を取ったという先行動作を表し、農耕の比喩を保つ。「から」により、続く継続的な動作との関係も明確になる。
- source_word: ἄροτρον
  choice: 鋤
  rationale: 原文の農具を簡潔かつ標準的に表す語であり、比喩の具体性を保つ。
- source_word: βλέπων εἰς τὰ ὀπίσω
  choice: 後ろを振り返る
  rationale: 継続的・習慣的に後方へ注意を向ける姿を自然に表し、文字どおりの情景と、心の定まらない弟子の姿の双方を保持する。
- source_word: εὔθετός
  choice: ふさわしい
  rationale: 目的に適している、よく適合しているという意味を表し、道徳的価値や最終的救済について原文以上に限定しない。否定文では「ふさわしくない」とする。
- source_word: τῇ βασιλείᾳ τοῦ θεοῦ
  choice: 神の国に
  rationale: εὔθετοςに伴う与格を日本語では「神の国にふさわしい」と自然に表現する。「神の国」はβασιλεία τοῦ θεοῦの定着した明瞭な訳語である。
- source_word: δὲ
  choice: しかし
  rationale: 直前の発言に対するイエスの応答が持つ穏やかな対照・転換を示す。
theological_decisions:
- issue: εὔθετός ἐστιν τῇ βασιλείᾳ τοῦ θεοῦが示す意味
  choice: 「神の国にふさわしくない」とし、神の国との関係における適合性を表す。
  alternative: 「神の国に入る資格がない」または「神の国のために役に立たない」
  rationale: 原文は弟子としての一途な姿勢を厳しく求める一方、最終的救済からの排除なのか、神の国への奉仕における有用性なのかを明示していない。その緊張と幅を保つ。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「鋤」「神の国」という定着した聖書語彙を用いつつ、文構造は一般読者にも理解しやすくした。脚注標識は該当表現の直後に配置した。
