base_translation:
  language: en
  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: ja
  text: どの町に入っても、そこで人々があなたがたを受け入れるなら、あなたがたの前に出されるものを食べなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: どの町に…ても
  rationale: 関係代名詞とἄνによる不定・一般的な意味を、自然な現代日本語の「どの町に…ても」で表した。εἰςの方向性は助詞「に」に含まれる。
- source_word: εἰσέρχησθε
  choice: 入って
  rationale: 一般的条件を構成する現在接続法。町の中へ入る動きを簡潔に表す。
- source_word: δέχωνται ὑμᾶς
  choice: 人々があなたがたを迎え入れてくれたなら
  rationale: δέχομαιの「受け入れる／歓迎する」という意味を文脈に即して「迎え入れる」とした。主語はギリシア語では省略されているが、日本語で自然にするため「人々」を補った。「なら」は先行する不定一般構文に伴う条件関係を明確にする。
- source_word: ἐσθίετε
  choice: 食べなさい
  rationale: 現在命令形による指示を、明瞭で品位ある日本語の命令表現で訳した。継続相を過度に強調しない。
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: 出されたもの
  rationale: 食事の文脈で、彼らの前に置かれる食物を指す受動分詞。日本語では「出されたもの」が簡潔かつ自然で、提供された食物という含意も保つ。
