id: LUK.10.29
reference: Luke 10:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: ja
  text: しかし彼は、自分が正しいことを示そうとして、イエスに言った。「では、私の隣人とはだれですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλων
  choice: 〜しようとして
  rationale: 現在分詞が表す意図・動機を、文脈に即した自然な現代日本語で表す。
- source_word: δικαιῶσαι ἑαυτόν
  choice: 自分が正しいことを示そうとして
  rationale: ここでは専門的な義認用語に限定せず、律法上・倫理上の問答において自分の正当性を示そうとする意味を表す。「自分を正当化しようとして」より平明でありつつ、物語上の含みを保つ。
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: イエスに言った
  rationale: 簡潔な物語上の発話表現として自然で、原文に忠実である。
- source_word: Καὶ
  choice: では
  rationale: 直前の問答を受けた追加質問であることを、会話として自然な接続語で示す。単純な「そして」より日本語の談話の流れに合う。
- source_word: τίς ἐστίν μου πλησίον
  choice: 私の隣人とはだれですか
  rationale: πλησίονの実体詞的用法を、周辺文脈の律法引用とのつながりを保つ標準的な「隣人」で訳す。問いの範囲を解釈的に限定せず、原文の直接性を保つ。
theological_decisions:
- issue: δικαιῶσαι ἑαυτόνの意味
  choice: 自分が正しいことを示そうとする
  alternative: 自分を正当化しようとする／群衆の前で自己弁護する
  rationale: 直近の文脈は律法をめぐる倫理的問答であり、この句は自分に非がないと示そうとする意図を表す。パウロ書簡における法廷的な義認概念へ狭めず、誰の前で正しさを示すのかも原文以上に特定しない。
- issue: 「隣人」の問いの含意
  choice: 私の隣人とはだれか
  alternative: だれが私の隣人に当たるのか
  rationale: 後者は問いが隣人の範囲を定めようとするものだと明示するが、本文では直接的な問いを保持し、その含意の展開を続くたとえに委ねる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着いた格調を保った。「では」は会話の自然さを優先した談話的等価表現。注記を要するほど重要な本文異読や、本文内で保持できない語義上の曖昧さはない。
