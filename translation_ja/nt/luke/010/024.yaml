id: LUK.10.24
reference: Luke 10:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: ja
  text: というのも、あなたがたに言います。多くの預言者や王たちは、あなたがたが見ているものを見たいと願ったが、見なかった。また、あなたがたが聞いていることを聞きたいと願ったが、聞かなかったのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: あなたがたに言います
  rationale: λέγωと与格を現代日本語として自然に訳した。γάρは前節との理由・説明関係を示すが、日本語で「というのも」を明示すると文脈によって重くなるため、語順と連続性に担わせた。
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: 多くの預言者や王たち
  rationale: 歴史的な二つの集団をそのまま保ち、βασιλεῖςを解釈的に「支配者」へ広げなかった。日本語の並列には自然な「や」を用いた。
- source_word: ἠθέλησαν
  choice: 見たいと願いながら／聞きたいと願いながら
  rationale: θέλωの願望を「願う」で表し、単なる意志より強い希求を示しつつ、「切望する」ほど感情の強さを限定しない訳とした。ギリシア語では一度だけ現れるが、二つの不定詞にかかる関係を日本語で明確にするため反復した。
- source_word: ἃ ὑμεῖς βλέπετε
  choice: あなたがたが見ているもの
  rationale: 現在形の継続的・現前的な知覚を「見ている」で表し、明示されたὑμεῖςも「あなたがた」として保持した。
- source_word: καὶ οὐκ εἶδαν
  choice: それを見ることができず
  rationale: 直訳は「見なかった」だが、願ったにもかかわらず実現しなかったという文脈上の含意を、自然な日本語の可能表現で示した。
- source_word: ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: あなたがたが聞いていることを…それを聞くことができなかった
  rationale: 見ることとの平行構造を保ち、現在の弟子たちの経験と過去の人々の未達成を対照させた。
theological_decisions:
- issue: 「預言者や王たち」の同定
  choice: 本文の歴史的カテゴリーを解説なしに保持する
  alternative: 「昔の預言者や王たち」または特定人物への言及として補足する
  rationale: ギリシア語は人物や時代を明示していないため、イスラエル史上の人物という含意を本文への付加によって限定せず、弟子たちとの対照をそのまま残した。
- issue: 見聞きの対象
  choice: 「もの」「こと」として不特定のまま保持する
  alternative: イエスの働き、神の国、救いの実現などと明示する
  rationale: 文脈上の含意はあるが、この節自体の関係代名詞ἃは対象を具体的に名指ししていないため、解釈的補足を避けた。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの発言として敬意と重みを保ちつつ、古風な「見んと欲した」などは避けた。原文の二重の平行構造を、日本語では願望表現を反復して可読性高く再現した。
