revisions:
- from: あなたがたに言います。多くの預言者や王たちは、あなたがたが見ているものを見たいと願いながら、それを見ることができず、あなたがたが聞いていることを聞きたいと願いながら、それを聞くことができなかったのです。
  to: というのも、あなたがたに言います。多くの預言者や王たちは、あなたがたが見ているものを見たいと願ったが、見なかった。また、あなたがたが聞いていることを聞きたいと願ったが、聞かなかったのです。
  rationale: γάρを「というのも」で表し、前節への説明的なつながりを保ちました。「できなかった」を単純な否定過去の「見なかった／聞かなかった」に改め、原文が述べる未達成の事実を、能力不能という追加的含意なしに訳しました。「預言者や王たち」と見聞きの対象を不特定に保つ訳語は維持しています。
