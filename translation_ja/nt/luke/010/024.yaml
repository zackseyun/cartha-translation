  naturalness: 現行文は概ね明瞭で自然です。ただし、願望表現の反復は許容されるものの、原文の簡潔で対称的な構造を保ちながら、否定過去をそのまま自然な日本語にできます。
  terminology: 「預言者」「王たち」は原文に忠実であり、現代標準日本語として適切です。「あなたがた」も、聞き手を明示する原文の強調を無理なく反映しています。
  issues:
