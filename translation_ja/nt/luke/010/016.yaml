id: LUK.10.16
reference: Luke 10:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ ἀκούων ὑμῶν ἐμοῦ ἀκούει, καὶ ὁ ἀθετῶν ὑμᾶς ἐμὲ ἀθετεῖ· ὁ δὲ ἐμὲ ἀθετῶν ἀθετεῖ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: ja
  text: あなたがたに耳を傾ける者は、わたしに耳を傾ける。あなたがたを退ける[a]者は、わたしを退ける。しかし、わたしを退ける者は、わたしを遣わした方を退ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「顧みない」または「無視する」とも訳せる（ギリシア語アテテオー）。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων ... ἀκούει
  choice: 耳を傾ける者は……耳を傾ける
  rationale: 単に音声を知覚するだけでなく、人の語ることを受け止めて聞くという文脈上の意味を、自然な日本語で表した。分詞と定動詞の語根の反復も保っている。
- source_word: ὑμῶν / ἐμοῦ
  choice: あなたがたに／わたしに
  rationale: 人を目的語とする関係を保ち、「教え」や「言葉」など原文にない抽象名詞を補わなかった。
- source_word: ὁ ἀθετῶν ... ἀθετεῖ
  choice: 退ける者は……退ける
  rationale: ἀθετέωの反復を統一して再現し、遣わされた者、そのイエス、遣わした方という人格的な連鎖における拒絶を明確にした。
- source_word: δὲ
  choice: しかし
  rationale: 最後の節へ進む際の対照と強調を、明瞭な現代日本語で示した。
- source_word: τὸν ἀποστείλαντά με
  choice: わたしを遣わした方
  rationale: 実体詞的なアオリスト分詞を自然に訳し、敬意を示す「方」を用いたが、原文にない「父」や「神」は補わなかった。
theological_decisions:
- issue: イエスと遣わされた弟子たちとの代表的な一体性
  choice: 弟子たちに耳を傾けることをイエスに耳を傾けることとし、弟子たちを退けることをイエスを退けることとして、原文の人格的な連鎖を保持した。
  alternative: 弟子たちの「教え」または「メッセージ」を聞く、あるいは拒むと意訳する。
  rationale: ギリシア語は抽象的な「教え」ではなく、「あなたがた」「わたし」という人称代名詞を用いているため。
- issue: 「わたしを遣わした方」の指示対象
  choice: 指示対象を明示せず、「わたしを遣わした方」とした。
  alternative: 「わたしを遣わした父」または「神」と明示する。
  rationale: 文脈上は父なる神を指すが、この節のギリシア語本文はその名を明記していないため。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語とした。「耳を傾ける」と「退ける」の反復によって原文の対句と段階的な論理を保ち、文末の「のである」で結論の重みを示した。
