revisions:
- from: しかし、マルタは、あれこれと世話をすることに気を取られていた。彼女は近寄って言った。「主よ、私の姉妹が、私一人に世話をさせたままなのを、何ともお思いにならないのですか。それなら、私を手伝うよう、あの人に言ってください。」
  to: しかし、マルタは、あれこれと世話をすることに気を取られていた。彼女は近寄って言った。「主よ、私の姉妹が私一人に世話をさせたままなのを、お気にならないのですか。ですから、私を手伝うよう、その姉妹に言ってください。」
  rationale: 原文の意味と既存の訳語方針を保持したまま、οὖνの論理的なつながりを「ですから」として明確にし、μέλειの意味をより自然に表した。さらに、αὐτῇを「その姉妹」として、原文が特定しない年齢関係を補わず、かつ「あの人」に伴いうる余分な距離感を避けた。
