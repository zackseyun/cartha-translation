source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: ja
  text: しかし、マルタは、あれこれと世話をすることに気を取られていた。彼女は近寄って言った。「主よ、私の姉妹が私一人に世話をさせたままなのを、お気にならないのですか。ですから、私を手伝うよう、その姉妹に言ってください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: 気を取られていた
  rationale: 継続中の状態を表す未完了過去と、「引き離される、注意をそらされる」という語感を自然な現代日本語で表す。単に忙しかったというより、注意が奪われていたことを示す。
- source_word: περὶ πολλὴν διακονίαν
  choice: あれこれと世話をすることに
  rationale: この場面のδιακονίαは制度的な奉仕職ではなく、客を迎えるための実際的な世話を指す。「あれこれと」によりπολλήνの量の多さを自然に表しつつ、「準備」だけに意味を狭めない。
- source_word: ἐπιστᾶσα
  choice: 近寄って
  rationale: 話しかけるためにそばへ来る動作を簡潔に表す。「立ち止まって」より、この文脈での接近の意味に適する。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの敬意ある呼びかけとして、ルカ文書におけるκύριοςの広い用法とも整合する標準的な訳語。
- source_word: οὐ μέλει σοι
  choice: 何ともお思いにならないのですか
  rationale: 相手にとって関心事ではないのかと訴える否定疑問を、非難の響きを保ちながら自然な敬語で表す。「気にかけてくださらないのですか」も可能だが、感情面をやや強く限定する。
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: 私一人に世話をさせたまま
  rationale: μόνηνがμεにかかること、κατέλειπενの「残したままにする」という含意、διακονεῖνの実際的な世話を一続きに表現する。
- source_word: εἰπὲ οὖν αὐτῇ
  choice: それなら、…あの人に言ってください
  rationale: οὖνの推論的なつながりと、直接的な命令を現代日本語で自然に表す。直前の「私の姉妹」の反復を避けるためαὐτῇは「あの人」とした。
- source_word: συναντιλάβηται
  choice: 私を手伝うよう
  rationale: 共に取りかかって助けるという意味を、明快で自然な日本語にする。文脈上、共同で世話をする意味も十分伝わる。
theological_decisions:
- issue: マルタがイエスをκύριοςと呼ぶ箇所の訳
  choice: 主よ
  alternative: 先生
  rationale: κύριοςが持つ敬称としての機能と、ルカ福音書全体でイエスに用いられる称号としての広がりを保つ。「先生」に限定すると、その広がりが失われる。
- issue: διακονία／διακονεῖνの訳語
  choice: 世話をする
  alternative: 奉仕する／仕える
  rationale: ここでは家庭で客を迎える実際的な働きが前景にあるため、「世話をする」が自然である。一方、宗教的・制度的な奉仕という意味を本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用い、会話には敬意とマルタの切迫した訴えの両方を残した。「姉」「妹」のどちらかを原文は特定しないため、年齢関係を補わず「私の姉妹」とした。やや改まった表現だが、原文の情報を保つことを優先した。
