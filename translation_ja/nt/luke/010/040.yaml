    rationale: οὖνは条件文の結論ではなく、マルタの苦情に基づく要求をつなぐ語である。「ですから」のほうが推論・帰結を正確に表す。
  - severity: low
    issue: 「あの人に」
    rationale: αὐτῇは直前の「私の姉妹」を受ける通常の代名詞であり、「あの人」は日本語で余分な心理的距離や非難調を帯びる場合がある。名詞を反復して指示対象を明確にするほうが安全である。
  - severity: low
    issue: 「何ともお思いにならないのですか」
    rationale: οὐ μέλει σοιは「あなたは気にかけないのですか／関心がないのですか」という問いである。「お気にならないのですか」は現代語として自然で、意味もより直接的である。
