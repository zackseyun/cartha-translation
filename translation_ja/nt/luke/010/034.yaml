id: LUK.10.34
reference: Luke 10:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: ja
  text: そしてその人に近寄り、傷にオリーブ油とぶどう酒を注いで包帯を巻いた。それから、その人を自分の動物[a]に乗せ、宿屋へ連れて行って介抱した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「動物」と訳したギリシア語は、荷物の運搬や人の乗用に使う動物を指す。
    reason: cultural_note
lexical_decisions:
- source_word: προσελθὼν
  choice: その人に近寄り
  rationale: 負傷者のもとへ近づく動作を明確にし、アオリスト分詞を主動詞に先立つ自然な連続動作として表した。
- source_word: κατέδησεν τὰ τραύματα
  choice: 傷に……包帯を巻いた
  rationale: 動詞は傷を縛って処置することを表す。日本語では「傷を縛った」よりも「包帯を巻いた」が自然で、行為の具体性も保てる。
- source_word: ἐπιχέων ἔλαιον καὶ οἶνον
  choice: オリーブ油とぶどう酒を注いで
  rationale: 分詞が傷の処置に伴う行為を表すため、「注いで」とした。ἔλαιονは当時通常オリーブ油を指すので具体化し、οἶνοςは現代日本語で飲料と分かるよう「ぶどう酒」とした。薬効については本文に加えない。
- source_word: ἐπιβιβάσας αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος
  choice: その人を自分の家畜に乗せ
  rationale: ἴδιονの所有の強調を「自分の」で保った。κτῆνοςは乗用または荷役用の動物を広く指すため、特定の動物種を補わず「家畜」とした。
- source_word: πανδοχεῖον
  choice: 宿屋
  rationale: 旅人を受け入れる宿泊施設を指す標準的で自然な訳語。
- source_word: ἐπεμελήθη αὐτοῦ
  choice: 介抱した
  rationale: 負傷者に自ら世話と手当てを施した文脈を、簡潔で自然な現代日本語で表す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語の連続した動作が自然に伝わるようにした。簡潔さと品位を保ちつつ、原文が特定していない動物種や治療上の意味は本文に持ち込んでいない。
