id: LUK.10.42
reference: Luke 10:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: ja
  text: しかし、必要なのはわずかなもの、あるいは一つです[a]。マリアは良い分け前を選びました[b]。それは彼女から取り上げられることはありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「必要なのはただ一つです」。食事の場面に即して、「必要な料理は数品、あるいは一品だけです」という意味にも理解できます。
    reason: alternative_reading
  - marker: b
    text: または「良い取り分」。この語は、食事の取り分と、本当に価値あるものとして受ける分け前との両方を響かせている可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: しかし、必要なのはわずかなもの、いや、一つです
  rationale: 「少数のもの」と「一つ」の簡潔な対照を保ち、食事の品数を指すのか、本当に必要な一事を指すのかを本文で限定しない。「いや」はἢがここで示し得る絞り込みを自然な日本語で表す。
- source_word: Μαριὰμ
  choice: マリア
  rationale: 日本語聖書で定着している人名表記。
- source_word: τὴν ἀγαθὴν μερίδα
  choice: 良い分け前
  rationale: ἀγαθήを比較級の「より良い」とせず「良い」と訳し、μερίςの「分け前・取り分」という意味を保つことで、食卓の取り分と真に価値あるものへの参与という含みを残す。
- source_word: ἐξελέξατο
  choice: 選びました
  rationale: アオリスト中動態が示すマリア自身の意志的な選択を、明快で自然な敬体の日本語で表す。
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: それは彼女から取り上げられることがありません
  rationale: 関係代名詞の先行詞を「それ」で明示し、未来受動態を、永続する結果を表す自然な日本語にする。
theological_decisions:
- issue: 「わずかなもの、いや、一つ」とマルタの奉仕およびマリアの選択との関係
  choice: 必要とされるものが少数、さらに一つへと絞られる表現を保ち、それが料理の品数か、唯一必要な事柄かを本文では特定しない。
  alternative: 「必要なのはただ一つです」と霊的な一事に限定する、または「必要な料理は数品、いや一品です」と食事に限定する。
  rationale: ギリシア語は食事の場面に即した実際的な意味と、より広い霊的な意味の双方を許すため、その緊張と多義性を保持する。
- issue: ἀγαθὴνを比較級として解釈するか
  choice: 「良い」と訳す。
  alternative: 「より良い」と訳し、マルタの選択との明示的比較にする。
  rationale: 原文は比較級ではなく肯定級であり、本文にない比較を加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語の敬体。イエスがマルタに直接語る文脈に合わせて柔らかな品位を保ちつつ、原文の簡潔さと曖昧さを残した。「分け前」はやや比喩的だが一般読者にも理解でき、食卓と霊的価値の二重の含みを保つ。
