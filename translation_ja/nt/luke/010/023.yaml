  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: ja
  text: それから、イエスは弟子たちのほうを向き、ほかの人々とは別に弟子たちに言われた。「あなたがたが見ているものを見ている目は幸いです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στραφεὶς
  choice: 弟子たちのほうを向き
  rationale: アオリスト分詞による発言前の動作を、自然な日本語の連用形で表した。「振り向き」と限定せず、単に弟子たちのほうへ向いたという原文の幅を保つ。
- source_word: κατ’ ἰδίαν
  choice: 彼らだけに
  rationale: ほかの人々とは別に弟子たちへ語ったことを、現代日本語で明瞭に表す。「ひそかに」は秘密性を強く示唆し得るため避けた。
- source_word: μαθητάς
  choice: 弟子たち
  rationale: 学び手であり従う者でもある関係を表す、新約聖書に定着した自然な訳語。
- source_word: Μακάριοι
  choice: 幸いです
  rationale: 単なる感情的な幸福ではなく、恵まれた状態を宣言する語調を保つ。日本語の祝福宣言として自然で格調もある。
- source_word: ὀφθαλμοὶ
  choice: 目
  rationale: 原文の換喩的な身体イメージをそのまま保ち、「人々」や「あなたがたの目」と説明的に言い換えない。日本語では数を明示しなくても自然である。
- source_word: οἱ βλέποντες ἃ βλέπετε
  choice: あなたがたが見ているものを見る
  rationale: 現在形の継続的・現前的な知覚を自然に表しつつ、同じ動詞 βλέπω の反復も「見ている／見る」によって保持する。
theological_decisions:
- issue: 幸いの宣言の力
  choice: 弟子たちが目の当たりにしているものを見る目への幸いの宣言として訳す
  alternative: 単に『うれしい』『幸福だ』という感情の描写とする
  rationale: μακάριοι はこの文脈で、弟子たちに与えられた特権的な知覚を幸いと宣言する語であり、主観的な気分だけを意味しない。「幸いです」はその神学的な重みを保ちながら、本文以上の説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、発言には丁寧な「言われた」を採用した。主語「イエス」はギリシア語では省略されているが、前後の文脈における話者を日本語で明確にするため補った。祝福定型の格調と、一般読者に分かる自然さを両立させた。
