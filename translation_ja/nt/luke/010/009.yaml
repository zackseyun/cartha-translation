id: LUK.10.9
reference: Luke 10:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: ja
  text: その町にいる病人を癒やし、彼らに、『神の国があなたがたのところに近づいた』と言いなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεραπεύετε
  choice: 癒やし
  rationale: 現在命令形が示す継続的な務めを保ちつつ、病人という目的語との組み合わせに最も自然な現代日本語とした。「治療し」よりも、この宣教文脈における行為の広がりを保てる。
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: その町にいる病人を
  rationale: ἀσθενεῖς は「弱い人々」とも訳せるが、θεραπεύετε と結び付くため、ここでは身体的に病んでいる人々を指すと判断した。αὐτῇ の先行詞である町を日本語で明示した。
- source_word: λέγετε αὐτοῖς
  choice: 彼らに……と言いなさい
  rationale: 発話を命じる簡潔な表現として、原文の直接性を保った。二つの現在命令形は、日本語では連用形と命令表現を組み合わせて自然に接続した。
- source_word: Ἤγγικεν
  choice: 近づいた
  rationale: 完了形が示す、近づく出来事の成立と現在への関わりを簡潔に表す。「近い」だけでは接近の動きが弱まり、「近づいている」では完了形の成立性が薄れる。
- source_word: ἐφ’ ὑμᾶς
  choice: あなたがたのところに
  rationale: ἐπί＋対格が表す聞き手への接近を、硬い「あなたがたの上に」を避けて自然に表現した。「あなたがたに」も可能だが、「近づく」との結び付きでは「ところに」が明瞭。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: βασιλεία が持つ王国と支配の意味幅を狭めず、日本語聖書で広く理解される定着表現を採用した。「神の支配」は動的側面を明示する一方、語義を限定しうる。
theological_decisions:
- issue: 神の国の到来の時制と様態
  choice: 「近づいた」とし、神の国が接近して現在的な意味を持つことを示す
  alternative: 「すでに完全に到来した」または「将来にだけ到来する」と解釈して明示する
  rationale: ἤγγικεν は接近が成立し、その結果が現在に及ぶことを示すが、神の国が完全に実現済みなのか、なお将来的完成を待つのかをこの節だけで決着させない。訳文でもその緊張を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、命令の力を保ちながら過度に古風な表現を避けた。「その町」と補って前節との照応を自然にし、引用された宣言は簡潔で荘重な調子に整えた。
