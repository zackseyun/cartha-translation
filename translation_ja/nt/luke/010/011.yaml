reference: Luke 10:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: ja
  text: 『あなたがたの町から私たちの足に付いたちりさえ、私たちはあなたがたに対してぬぐい落とす。[a] しかし、このことを知っておきなさい。神の国は近づいたのだ。』[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の語順は直訳するとやや不自然になるが、あなたがたの町のちりが使者たちの足に付いたことを述べている。「ぬぐい落とす」は、類似箇所で用いられる「振り落とす」とは異なる動詞の意味を反映している。
    reason: lexical_alternative
  - marker: b
    text: 「神の国は近くに来ている」とも訳せる。ギリシア語の完了形は、神の国がすでに近づき、その意味が現在も続いていることを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: ちり
  rationale: 一般的な「土」ではなく細かなほこりを指し、この象徴的行為にも自然に合う。
- source_word: κολληθέντα
  choice: 付いた
  rationale: 密着・付着したことを表す分詞を、明快で自然な現代日本語にした。
- source_word: ἐκ τῆς πόλεως ὑμῶν
  choice: あなたがたの町から
  rationale: ちりの出所を示すἐκの意味を素直に表す。
- source_word: εἰς τοὺς πόδας
  choice: 私たちの足に
  rationale: 直訳調の「足へ」ではなく、ちりが足に付着しているという慣用的な意味を表した。
- source_word: ἀπομασσόμεθα
  choice: ぬぐい落とす
  rationale: 類似箇所で伝統的な「振り落とす」ではなく、この動詞固有の、ぬぐって取り去る意味を保つ。
- source_word: ὑμῖν
  choice: あなたがたに対するしるしとして
  rationale: 与格の敵対的・証言的な方向性を、単なる「あなたがたに」より明確かつ自然に示す。ただし本文にない裁きの内容までは補わない。
- source_word: πλήν
  choice: しかし
  rationale: 拒絶への象徴的行為があっても、なお知るべき事実があるという強い転換を簡潔に表す。
- source_word: γινώσκετε
  choice: 知っておきなさい
  rationale: 現在命令形による認識・承認の要求を、現代日本語の直接的な命令として表す。
- source_word: ἤγγικεν
  choice: 近づいたのだ
  rationale: 完了形が表す、すでに近づき、その状態が現在にも及ぶ含意を保つ。「のだ」により告知としての断定を自然に示す。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 日本語聖書で定着し、神の支配という含意も文脈の中で担いうる簡潔な表現。
theological_decisions:
- issue: ちりをぬぐい落とす行為の意味
  choice: 拒絶した町に対する証言・警告となる象徴的行為
  alternative: 衛生上または旅の習慣にすぎない行為
  rationale: ὑμῖνと宣教派遣の文脈は、この行為が相手に向けられた証言的なものであることを示す。「対するしるしとして」としてその力を伝えつつ、「裁き」と明示して本文以上に限定しない。
- issue: 神の国が近づいたことの意味
  choice: 神の国はイエスの使者たちの宣教においてすでに近づき、その意義が今も続いている
  alternative: 神の国は単に時間的に間近である／すでに完全に成就した
  rationale: ἤγγικενの完了形は到来した近さと継続する意味を示すが、最終的完成まで断定しない。終末論的な緊張を保つ。
translation_notes:
  register: 引用された宣告として、明快で現代的ながら威厳のある口調にした。「ちり」「ぬぐい落とす」で具体性を保ち、「神の国」は定着した聖書語を採用した。原文のやや不規則な構文とἤγγικενの含意は脚注で補い、本文では読みやすさを優先した。
