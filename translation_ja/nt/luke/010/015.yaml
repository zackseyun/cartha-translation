id: LUK.10.15
reference: Luke 10:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: ja
  text: そして、カペナウムよ、おまえも、天にまで高められるとでもいうのか。陰府にまで引き降ろされる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「陰府」は死者の世界を指す。ギリシア語は「ハデス」であり、「ゲヘナ」（地獄）とは別の語。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: カペナウム
  rationale: 日本語聖書で広く定着している地名表記を用いた。
- source_word: μὴ ... ὑψωθήσῃ
  choice: 高く上げられるとでもいうのか
  rationale: 否定の答えを予期する修辞疑問として訳し、受動態と高揚の比喩を保った。
- source_word: ἕως οὐρανοῦ
  choice: 天にまで
  rationale: ἕως＋属格が示す到達範囲と、陰府への下降との上下の対照を自然な日本語で表した。
- source_word: ἕως τοῦ ᾅδου
  choice: 陰府にまで
  rationale: ᾅδηςを死者の領域として表し、ゲヘナとの語彙上の区別を保った。
- source_word: καταβιβασθήσῃ
  choice: 引き降ろされる
  rationale: 使役的な下降を表す未来受動態を保ち、屈辱と裁きの含意を過度に強めずに示した。
theological_decisions:
- issue: ᾅδηςの訳語
  choice: 陰府
  alternative: 死者の世界／地獄
  rationale: ここで用いられているのはゲヘナではなくᾅδηςであるため、最終的刑罰の場という理解を本文に持ち込まず、死者の領域を指す伝統的かつ区別可能な語を採用した。
- issue: μὴを伴う疑問文の解釈
  choice: 否定の答えを予期する修辞疑問
  alternative: 『天にまで上げられることはない』という平叙文
  rationale: ギリシア語の疑問の形と修辞的な力を保ちつつ、話者が否定を予期していることを日本語の『とでもいうのか』で示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、預言的な呼びかけと裁きの厳粛さを保つ文体とした。καὶ σύは前後との連続を示す「また」と呼格で表現し、町への直接的な呼びかけには「おまえ」を用いた。
