  text: ⸀τίς τούτων τῶν τριῶν πλησίον δοκεῖ σοι γεγονέναι τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: ja
  text: 「この三人のうち、強盗たちに襲われた人の隣人になったのは、だれだとあなたは思いますか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この三人のうち、強盗たちに襲われた人の隣人であったのは、だれだとあなたは思いますか」。ギリシア語はより直訳的には「隣人になった」と言い、隣人として行動するようになったことを際立たせている。
    reason: 語彙上の別訳と、γίνομαι の動的な意味を示すため。
lexical_decisions:
- source_word: τίς
  choice: だれ
  rationale: 限定された三人から一人を問う疑問代名詞。日本語では「この三人のうち」と組み合わせた「だれ」が自然で正確。
- source_word: τούτων τῶν τριῶν
  choice: この三人のうち
  rationale: 部分属格を明確で自然な日本語にした。「人」は原文に明示されないが、日本語の「三人」によって人数と人物であることを簡潔に示す。
- source_word: πλησίον
  choice: 隣人
  rationale: ここでは γεγονέναι の補語として実質的に名詞用法であり、「隣人」を意味する。
- source_word: δοκεῖ σοι
  choice: あなたが思う
  rationale: 直訳的な「あなたには〜と思われる」は現代日本語では不自然になりやすいため、問いかけとして自然な「あなたが思う」とした。σοι が示す聞き手への問いも明示している。
- source_word: γεγονέναι
  choice: なった
  rationale: γίνομαι の完了不定詞が表す、単に隣人で「ある」のではなく隣人に「なる」という動きを保持した。日本語では主節の時制に合わせた「なった」が自然。
- source_word: τοῦ ἐμπεσόντος εἰς τοὺς λῃστάς
  choice: 強盗たちに襲われた人
  rationale: 字義的には「強盗たちの中へ落ちた人」だが、強盗に出会ってその手に落ちたことを表す慣用的な言い回し。文脈に即して、現代日本語で明瞭な「襲われた」とした。複数形は「たち」で保持した。
theological_decisions:
- issue: 善いサマリア人のたとえにおける問いの倫理的焦点
  choice: 「隣人になった」と訳す
  alternative: 「隣人であった」または「隣人だった」と訳す
  rationale: γεγονέναι は静的な存在ではなく、隣人になるという行為と到達した状態を示す。これにより、隣人を分類する問いから、自らが隣人になることへのイエスの問い直しを、解釈を付加せずに保つ。
translation_notes:
  register: 明瞭な現代標準日本語による、丁寧で威厳のある問いかけ。「強盗ども」は強すぎるため避け、「強盗たち」として複数を保持した。語順は「隣人になった」を焦点化しつつ、聞き手を示す「あなた」を明示する形に整えた。
