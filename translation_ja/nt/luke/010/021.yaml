id: LUK.10.21
reference: Luke 10:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: ja
  text: まさにその時、イエスは聖霊にあって大いに喜び、こう言われた。「父よ、天地の主よ、あなたをほめたたえます。[a] あなたはこれらのことを、知恵ある者や賢い者には隠し、幼子たち[b]に現してくださいました。はい、父よ。このようになることが、あなたのみこころにかなうことだったからです。[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたに感謝します」。このギリシア語動詞は、祈りの中で賛美と感謝の両方を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 字義的には「乳幼児」。ここでは、へりくだった者や世間で重んじられていない者を比喩的に指す場合がある。
    reason: lexical_alternative
  - marker: c
    text: または「このようになることが、あなたの喜ばしいみ旨だったからです」あるいは「これがあなたのよしとされたことだったからです」。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: その同じ時
  rationale: 直訳的な「その同じ時刻に」より自然な日本語で、直前の出来事との時間的な結びつきと指示語の強調を保つ。
- source_word: ἠγαλλιάσατο
  choice: 喜びにあふれ
  rationale: 強い喜び、歓喜を表す動詞の強度を、現代日本語で自然に伝える。
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: 聖霊によって
  rationale: 冠詞を伴う語句を聖霊への言及と取り、与格の手段・領域の含みを自然な日本語で表す。
- source_word: Ἐξομολογοῦμαί σοι
  choice: あなたをほめたたえます
  rationale: 父への祈りでは賛美または感謝を表す。本文では文脈に合う賛美を採用し、感謝の訳は脚注に示す。
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: 天地の主である父よ
  rationale: 二つの呼びかけの同格関係と神の主権を、簡潔で格調ある日本語にする。
- source_word: σοφῶν καὶ συνετῶν
  choice: 知恵ある者や賢い者
  rationale: 二語の並列を保ち、学歴や社会階層に意味を限定しない。
- source_word: ἀπεκάλυψας
  choice: 現してくださいました
  rationale: 「隠す」と対照をなし、隠されていたものを明らかにする意味を自然に表す。
- source_word: νηπίοις
  choice: 幼子たち
  rationale: 字義的な幼児のイメージを保ちつつ、文脈上の比喩的用法を脚注で説明する。
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: このことは、あなたのみこころにかなうことでした
  rationale: 神の前で良しとされたこと、すなわち神の喜ばしい意志・好意を表す曖昧さを、過度に教理化せず自然な日本語で示す。
theological_decisions:
- issue: τῷ πνεύματι τῷ ἁγίῳ の指示対象
  choice: 聖霊によって
  alternative: 霊において／ご自分の霊で
  rationale: 冠詞を伴う名詞・形容詞の構造は聖霊を指すと取るのが最も自然である。「によって」は与格の手段的含意を表すが、働き方をそれ以上限定しない。
- issue: 神が隠し、現すという対照
  choice: 主語を明示したまま「あなたは…隠し、…現してくださいました」
  alternative: 受動表現にして神の直接的行為を弱める
  rationale: 原文は両動詞とも神を明示的な主語とするため、その神学的緊張を避けずに保持する。
- issue: εὐδοκία の意味
  choice: みこころにかなうこと
  alternative: 恵み深いみ旨／喜ばしいこと
  rationale: 神の意志と喜び・好意の双方を含み得る表現を選び、一義的に決めすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祈りの場面にふさわしい品位を保った。「イエス」は原文では代名詞相当の主語が省略されているが、日本語で指示対象を明確にするため補った。敬語は父への呼びかけと神の行為に限定して用いた。
