revisions:
- from: すべてのものは、私の父から私に渡されています[a]。子がだれであるかを知る者は、父のほかにはだれもおらず、父がだれであるかを知る者は、子と、子が父を明らかにしようと望む者[b]のほかにはだれもいません。
  to: すべてのものは、私の父によって私に渡されました[a]。子がだれであるかを知る者は、父のほかにはだれもいません。また、父がだれであるかを知る者は、子、および子が父を示そうと望む者[b]のほかにはだれもいません。
  rationale: 受動態の行為者を「父によって」として原文に即して示し、後半を二文に分けて、父を知る者に対する二重の例外（子、および子が父を示そうと望む者）を明瞭にしました。βούληταιの意志性と、ἀποκαλύψαιの目的語である父を保持しています。
