  source_fidelity: 第一節のὑπό＋属格は受動態における行為者を表すため、「父から」より「父によって」が正確です。また、後半の例外句は「父を知る者」が子だけでなく、子が父を啓示しようと望む者にも及ぶことを明瞭に示す必要があります。
  naturalness: 現行の「子と、子が父を明らかにしようと望む者のほかには」は並列関係と例外句の係り方がやや取りにくく、「父を明らかにする」も日本語として不自然です。「子、および子が父を示そうと望む者のほかには」とすると、現代標準語として自然で構文も明快です。
  terminology: 「父」「子」は文脈上の称号として簡潔に維持します。「示す」はἀποκαλύψαιの啓示・開示の働きを平明に表し、教派的な用語を持ち込みません。
