  - severity: medium
    issue: 後半の例外句の構文が不明瞭
    rationale: 現行文では「子と、…者のほかには」の並列と、「父を知る者」への係り方が読み取りにくい。例外として子と、子が父を示そうと望む者を明示的に並列する必要がある。
  - severity: low
