id: LUK.10.22
reference: Luke 10:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: ja
  text: すべてのものは、私の父によって私に渡されました[a]。子がだれであるかを知る者は、父のほかにはだれもいません。また、父がだれであるかを知る者は、子、および子が父を示そうと望む者[b]のほかにはだれもいません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「すべては、私の父によって私に渡されました。」
    reason: πάνταは「すべてのもの」とも「すべて」とも訳せるため。
  - marker: b
    text: または「子が父を示そうと意志する者」。
    reason: βούληταιは意志・意向を表す。「望む」は自然な現代日本語であり、「意志する」はより形式的な表現となるため。
lexical_decisions:
- source_word: πάντα
  choice: すべてのもの
  rationale: 中性複数の包括的な範囲を保つ。「すべて」も可能だが、「もの」を補うことで、日本語として指示内容を明確にしつつ過度に限定しない。
- source_word: παρεδόθη
  choice: 渡されています
  rationale: παραδίδωμι の受動態の基本的な移譲の意味を保つ。「委ねられた」は管理責任の含意を加えうるため避けた。日本語の「ています」により、なされた移譲が現在も有効である文脈上の含みを自然に表した。
- source_word: ὑπὸ τοῦ πατρός μου
  choice: 私の父から
  rationale: 受動構文の行為者を示す。「私の父によって」より自然な日本語であり、移譲の源である父を明確にする。
- source_word: γινώσκει
  choice: 知る
  rationale: 動詞の明示的な意味にとどめ、「完全に知る」などの解釈的な強調を加えない。
- source_word: τίς ἐστιν ὁ υἱὸς / τίς ἐστιν ὁ πατήρ
  choice: 子がだれであるか／父がだれであるか
  rationale: 人格的・関係的な問いの形を保ち、「本当はだれか」などの説明的な強調を加えない。
- source_word: ὁ υἱός / ὁ πατήρ
  choice: 子／父
  rationale: 文脈上、固有の関係的称号として用いられている。日本語では英語の大文字表記に相当する区別を設けず、定冠詞の意味は文脈と構文で示す。
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: 子が父を明らかにしようと望む者
  rationale: 不定の受け手と子の意志の双方を保つ。ἀποκαλύψαι の省略された目的語が直前の「父」であることを、日本語では補って明示した。
- source_word: ἀποκαλύψαι
  choice: 明らかにする
  rationale: 啓示・開示の意味を平易な現代日本語で表しつつ、単なる情報伝達に弱めない。
theological_decisions:
- issue: 父と子の相互に排他的な知識
  choice: 父と子だけが互いを知るという構文を、そのまま保持した。
  alternative: 「完全に知る」「真に知る」などを補う。
  rationale: この節のキリスト論的な重みは排他的構文そのものにあり、γινώσκει に明示されていない程度表現を加える必要はない。
- issue: 父を明らかにする子の意志と主体性
  choice: 「子が…望む者」とし、明らかにする相手に関する子の意志を保持した。
  alternative: 「子によって父を知らされた者」など、子の意志を明示しない受動的な言い換え。
  rationale: βούληται は子の意志を明示しているため、それを弱めず、同時に意志の範囲を体系的教理によって説明し足さない。
- issue: ἀποκαλύψαι の省略された目的語
  choice: 直前の「父」を目的語として「父を明らかにする」とした。
  alternative: 目的語を省略して「明らかにする」とする。
  rationale: ギリシア語では直前の父が自然な目的語であり、日本語では明示したほうが指示関係が明確になる。
translation_notes:
  register: 明瞭な現代標準語を用いながら、父と子の荘重な相互関係を保った。文を二つに分け、長い対句を読み取りやすくした。「御父」「御子」のような教派的・伝統的表記は採用せず、原文の関係称号を簡潔に「父」「子」とした。
