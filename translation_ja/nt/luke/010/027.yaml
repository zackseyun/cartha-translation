id: LUK.10.27
reference: Luke 10:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: ja
  text: すると彼は答えた。「あなたは、心を尽くし、魂を尽くし、力を尽くし、思いを尽くして、あなたの神である主を愛しなさい。また、隣人を自分自身のように愛しなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: 彼は答えた
  rationale: 分詞と定動詞を組み合わせた物語上の定型表現を、自然な現代日本語にまとめた。
- source_word: Ἀγαπήσεις
  choice: 愛しなさい
  rationale: 形は未来直説法だが、引用された聖書の命令として機能しているため、日本語では明確な命令形が自然である。後半の省略された動詞も補った。
- source_word: κύριον τὸν θεόν σου
  choice: あなたの神である主
  rationale: κύριοςを神的称号「主」とし、同格関係を自然な日本語で示した。
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: 心を尽くし
  rationale: ἐξの起点的な含みと、全心をもって愛するという句全体の意味を、日本語の聖書的で自然な定型表現にした。後続のἐνとの前置詞の違いは日本語では同じ構文にするほうが明瞭である。
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: いのちを尽くし
  rationale: ψυχήはここで単なる非物質的な『魂』に限定されず、生命・自己全体を指しうるため、「いのち」とした。
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: 力を尽くし
  rationale: ἰσχύςの力・能力という意味を簡潔に表す。
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: 思いを尽くし
  rationale: διάνοιαが表す思考・理解・知的働きを、自然で格調ある日本語として表した。
- source_word: τὸν πλησίον σου ὡς σεαυτόν
  choice: 隣人を自分自身のように
  rationale: 倫理的・関係的意味を持つπλησίονと、ὡςの比較を直接かつ自然に訳した。
theological_decisions:
- issue: κύριοςをイスラエルの神への称号としてどう訳すか
  choice: 主
  alternative: 主人
  rationale: 聖書引用の中で神を指す称号であり、「主」が神学的重みと正典上の響きを保つ。
- issue: καρδία、ψυχή、ἰσχύς、διάνοιαの重なり合う人間理解
  choice: 心、いのち、力、思いの四項を保持する
  alternative: 「全存在をもって」など一語にまとめる
  rationale: 全人的献身を表す列挙を保ちつつ、各語を厳密に分割した人間論として固定しない。
- issue: ψυχήの訳語
  choice: いのち
  alternative: 魂
  rationale: この文脈のψυχήは生命や自己全体を含みうる。「魂」だけにすると、身体と分離した実体という限定的理解を誘発する可能性がある。
translation_notes:
  register: 明瞭な現代標準日本語。聖書引用としての品位を保ちながら、古風な未来命令表現は避けた。「心を尽くし」以下を並列させ、全人的な愛をリズムよく表現した。
