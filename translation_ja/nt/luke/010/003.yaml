  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: ja
  text: 行きなさい。見なさい、わたしはあなたがたを、狼のただ中にいる子羊のように遣わします。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγετε
  choice: 行きなさい
  rationale: 二人称複数の命令として、簡潔で自然な派遣の言葉にした。複数性は後続の「あなたがた」で明示される。
- source_word: ἰδοὺ
  choice: さあ
  rationale: 後続の重大な宣言へ注意を促す談話標識。古風な「見よ」より現代日本語として自然でありながら、呼びかけの力を保つ。
- source_word: ἀποστέλλω ὑμᾶς
  choice: わたしはあなたがたを…遣わします
  rationale: 現在形の一人称動詞と複数目的語を明示し、使命を帯びて送り出す文脈に合う「遣わす」を用いた。
- source_word: ὡς
  choice: …のように
  rationale: 同一視ではなく比喩・比較であることを明確に示す。
- source_word: ἄρνας
  choice: 子羊
  rationale: 一般的な「羊」ではなく、ἀρήνが指す子羊を訳出し、無防備さのイメージを保つ。日本語では単複を形態的に区別しなくても「あなたがた」との対応で集合的意味が自然に伝わる。
- source_word: ἐν μέσῳ λύκων
  choice: 狼のただ中にいる
  rationale: 「狼の間に」より包囲された危険な状況を鮮明に表し、ἐν μέσῳの空間的意味を自然な日本語で保持する。
theological_decisions:
- issue: 派遣される弟子たちを表す動物比喩
  choice: 「狼のただ中にいる子羊のように」と比喩をそのまま保つ
  alternative: 「狼の中にいる羊のように」
  rationale: 原文は一般的な「羊」ではなくἄρνας（子羊）を用いるため、類似箇所や慣用的表現に調和させず、弟子たちの無防備さが強調される原文の緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの命令と警告にふさわしい簡潔で dignified な調子とした。「さあ」はἰδοὺの注意喚起を自然に表し、「見よ」のような過度に古風な文体は避けた。
