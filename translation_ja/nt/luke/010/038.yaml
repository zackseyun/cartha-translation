  text: ⸂Ἐν δὲ⸃ τῷ πορεύεσθαι ⸀αὐτοὺς αὐτὸς εἰσῆλθεν εἰς κώμην τινά· γυνὴ δέ τις ὀνόματι Μάρθα ὑπεδέξατο ⸀αὐτὸν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/038.yaml
  text: As they were traveling along[a], he entered a certain village, and a woman named Martha welcomed him.
translation:
  language: ja
  text: 一行が旅を続けていたとき、イエスはある村に入った。すると、マルタという名の女がイエスを迎え入れた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「迎え入れた」は、客として歓迎し、受け入れたという意味。
    reason: ὑποδέχομαιのもつ歓待のニュアンスを明示するため。
lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: 一行が旅を続けていたとき
  rationale: ἐν＋冠詞付き不定詞を同時進行の「～していたとき」とし、複数のαὐτούςはイエスを含む旅の一行を指すため「一行」とした。δέは日本語の自然な場面転換の中に織り込んだ。
- source_word: αὐτὸς
  choice: イエスは
  rationale: 直訳は「彼は」だが、複数の旅人たちと、その中から村に入る当人とを区別する強意的な代名詞である。日本語では指示対象を明確にし、強調を自然に伝えるため固有名を補った。
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: ある村に入った
  rationale: κώμηを「村」、不定代名詞τινάの軽い特定性を「ある」で表した。εἰσῆλθενは簡潔に「入った」とした。
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: すると、マルタという名の女が
  rationale: δέは新しい人物を導入して物語を進めるため「すると」とした。τιςの不定性は、日本語では名を伴う「～という名の女」で十分に表れる。γυνήは年齢や婚姻状況を特定しない「女」とした。
- source_word: ὑπεδέξατο αὐτόν
  choice: イエスを迎え入れた
  rationale: ὑποδέχομαιが含む、客として温かく受け入れる意味を「迎え入れた」で表した。「家に」は文脈上想定されうるが、ギリシア語本文に明示されていないため補わなかった。目的語は日本語で曖昧にならないよう「イエス」とした。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用い、物語として自然でありながら簡潔で品位ある文体とした。「女」は原文のγυνήに対応し、婚姻状況を読み込まない。
