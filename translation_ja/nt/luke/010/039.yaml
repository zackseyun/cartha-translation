source:
  edition: SBLGNT
  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: ja
  text: 彼女には、マリアという姉妹がいた。マリアはまた、イエス[a]の足元に座って、その言葉を聞いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「主」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: 彼女には
  rationale: 前節のマルタを指す女性単数の指示語。日本語では文脈上自然な代名詞で表した。
- source_word: ἀδελφὴ καλουμένη Μαριάμ
  choice: マリアという姉妹
  rationale: 姉か妹かを原文は特定しないため、「姉妹」として曖昧さを保った。「という」は人名を導く自然な現代日本語。
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: 足元に座り
  rationale: 足のそばに座る姿勢を簡潔に表し、弟子として教えを受ける含意を説明的に加えなかった。
- source_word: τοῦ Ἰησοῦ
  choice: イエス
  rationale: 提示されたSBLGNT本文のἸησοῦをそのまま固有名で訳した。異読「主」は脚注に残した。
- source_word: ἤκουεν
  choice: 聞き入っていた
  rationale: 未完了過去の継続的な聴取を自然な日本語で表した。単なる聴覚ではなく、語られる言葉に注意を向けていた文脈にも適合する。
- source_word: τὸν λόγον αὐτοῦ
  choice: その言葉
  rationale: λόγοςの幅を狭めて「教え」や「説教」と断定せず、イエスが語る言葉を指す表現とした。
theological_decisions:
- issue: 「足元」の人物名・称号に関する本文異読
  choice: イエス
  alternative: 主
  rationale: 指定されたSBLGNT本文はἸησοῦと読むため、本文では「イエス」とした。「主」という意味のある異読は、称号と固有名の違いを失わないよう脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「姉妹」によって年長・年少を特定しない原文の曖昧さを保持し、「聞き入っていた」で未完了過去の継続性を自然に表した。
