id: LUK.10.5
reference: Luke 10:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: ja
  text: どの家に入っても、まず、『この家に平安があるように』[a]と言いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「この家に平安を」。原文は、挨拶を兼ねた簡潔な祝福の言葉である。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: どの家に入っても
  rationale: εἰςの方向性と、ἄνを伴う不定関係節の一般的・将来的な意味を、自然な現代日本語の条件表現で示した。
- source_word: εἰσέλθητε
  choice: 入っても
  rationale: アオリスト接続法はἄνを伴う不定関係節の中にあり、弟子たちが今後どの家に入る場合にも当てはまる指示を表す。
- source_word: πρῶτον λέγετε
  choice: まず、…と言いなさい
  rationale: πρῶτονが示す行為の順序と、λέγετεの継続的な命令を、明瞭で自然な指示として訳した。
- source_word: Εἰρήνη τῷ οἴκῳ τούτῳ
  choice: この家に平安があるように
  rationale: 名詞だけの簡潔な祝福句を、日本語で発話として通じる祈願的表現にした。οἶκοςはここでは住居だけでなく、そこに属する人々をも含み得るため、「家」を保った。
theological_decisions:
- issue: 平安の言葉の性質
  choice: 「この家に平安があるように」という挨拶を兼ねた祝福として訳す。
  alternative: 「この家に平安を」または「この家の上に平安があるように」と、ギリシア語の省略的な形をより直接的に映す。
  rationale: 原文は単なる日常の挨拶とも、明示的な祈祷文とも限定せず、家に対して平安を告げる簡潔で遂行的な祝福句である。日本語では「あるように」を補ってその働きを自然に示しつつ、祝福の効力について原文以上の教理的説明を加えない。
translation_notes:
  register: 現代の一般読者に明瞭な口語的文体を用いながら、引用された祝福には簡潔で品位ある表現を採用した。「平和」よりも、挨拶・祝福としての宗教的含意と心身の安寧を含み得る「平安」を選んだ。
