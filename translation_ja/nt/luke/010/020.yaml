id: LUK.10.20
reference: Luke 10:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: ja
  text: しかし、霊たちがあなたがたに従うことを喜ぶのではなく、あなたがたの名が天に書き記されていることを喜びなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天」と訳したギリシア語は複数形で、直訳すれば「もろもろの天」です。また、文脈上「霊たち」は敵対的な霊的存在を指しますが、原文は単に「霊たち」と述べています。
    reason: 原文の複数形と、文脈から推定される霊の性質を示しつつ、本文で意味を限定しすぎないため。
lexical_decisions:
- source_word: πλὴν
  choice: しかし
  rationale: 直前の喜びを全面否定せず、より重要な喜びへと強く方向づける対比を、自然な現代日本語で示す。
- source_word: ἐν τούτῳ μὴ χαίρετε ... χαίρετε δὲ
  choice: …ことを喜ぶのではなく、…ことを喜びなさい
  rationale: χαίρω の反復と、二つの喜びの対象を対照させる修辞を保つ。
- source_word: τὰ πνεύματα
  choice: 霊たち
  rationale: 文脈上は敵対的な霊的存在だが、原文は単に πνεύματα とするため、「悪霊」と限定しない。複数も明示する。
- source_word: ὑμῖν ὑποτάσσεται
  choice: あなたがたに従う
  rationale: 弟子たちの権威の下に服する意味を、明瞭で自然な日本語にする。
- source_word: τὰ ὀνόματα ὑμῶν
  choice: あなたがたの名
  rationale: 複数の人物それぞれの名を集合的に表す自然な日本語。「名」には登録された身分・本人を指す含みも残る。
- source_word: ἐγγέγραπται
  choice: 書き記されている
  rationale: 完了受動の、書き記された結果が現在も存続している含意を表す。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天に
  rationale: ギリシア語は複数形だが、日本語の「天」は数を明示せず、自然に神の領域を表せる。複数形については注記する。
theological_decisions:
- issue: 霊の性質
  choice: 霊たち
  alternative: 悪霊たち／悪い霊たち
  rationale: 直前の文脈では敵対的な霊を指すが、この節の語そのものが持つ幅を保ち、本文で過度に限定しない。
- issue: 名が記される場所
  choice: 天に
  alternative: もろもろの天に
  rationale: 原文の複数形を神学的な天界構造として解釈せず、日本語として自然な集合的表現を採用し、形態上の複数は脚注で知らせる。
- issue: 完了受動の含意
  choice: 書き記されている
  alternative: 書かれた／記されている
  rationale: 過去に記されたことと、その効力・状態が続いていることの双方を示しつつ、誰が記したかは原文同様に明示しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「喜ぶ」を反復して原文の対照を再現した。脚注記号は節末に置き、本文の流れを妨げずに二つの翻訳上の情報を提示する。
