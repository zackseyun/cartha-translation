    issue: 「踏みつけ」
    rationale: πατεῖν はここでは「踏む」と訳せ、踏みつぶすニュアンスを伴いやすい「踏みつけ」よりも中立的な語が原文の像を過度に強めない。
  - severity: low
    issue: 注aの「文字どおりの像」
    rationale: 生き物そのものを指す語について「文字どおりの像」とするのは日本語として不明瞭である。本文が蛇とさそりを具体的に述べることと、文脈上の象徴的含意の可能性を区別して表現する。
