revisions:
- from: 見なさい。わたしはあなたがたに、蛇やさそりを踏みつけ[a]、敵のあらゆる力を制する権威を授けてある。何ものも決してあなたがたを害することはない。[b]
  to: 見なさい。わたしはあなたがたに、蛇やさそりを踏み[a]、敵のあらゆる力を制する権威を授けた。何ものも決してあなたがたを害することはない。[b]
  rationale: 本文は原文の一つの「権威」が、蛇やさそりを踏むことと敵のあらゆる力に対する優越の双方に関わる構造を保っている。「踏む」により原文の具体的な像を保ちつつ過度な強調を避けた。「授けた」は完了の授与を自然な日本語で表す。注aは霊的解釈を断定せず、可能性として提示する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:33:19Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として原文の構文と強調をよく反映している。δέδωκα の完了の含意、「権威」（ἐξουσία）と「力」（δύναμις）の区別、「敵」を特定しない点、οὐδέν...οὐ μὴ の強い否定はいずれも適切である。ただし「踏みつけ」は πατεῖν（踏む／足で踏み行く）より「踏みつぶす・強く踏む」の含みを帯びやすく、本文はより中立的な「踏む」とするのが安全である。
  naturalness: 「見なさい」「わたしはあなたがたに」「何ものも決して…ない」は明瞭で、発言として自然である。「授けてある」も完了の結果を表しうるが、主語が「わたし」の場合は「授けた」のほうが現代標準日本語として簡潔かつ自然であり、文脈上、授与の現在的効力も失われない。
  terminology: 「権威」と「力」は ἐξουσία と δύναμις の対照を適切に保つ。「敵」は本文以上にサタン等へ特定していない。「害する」は ἀδικήσῃ のこの文脈で妥当である。注aの「文字どおりの像」はやや不自然で意味も曖昧なので、「文字どおりの生き物を指す」と改める。
  issues:
