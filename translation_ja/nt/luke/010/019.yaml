id: LUK.10.19
reference: Luke 10:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: ja
  text: 見なさい。わたしはあなたがたに、蛇やさそりを踏み[a]、敵のあらゆる力を制する権威を授けた。何ものも決してあなたがたを害することはない。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 蛇とさそりは文字どおりの生き物を指すが、この文脈では敵対する霊的な力をも表している可能性がある。
    reason: interpretive_ambiguity
  - marker: b
    text: 「決して……ない」に当たるギリシア語は、非常に強い否定表現である。「決して傷つけることはない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: 見なさい
  rationale: 聞き手の注意を強く促す談話標識として、現代日本語で明瞭かつ格調を保つ表現を選んだ。
- source_word: δέδωκα
  choice: 授けてある
  rationale: 完了形が示す、すでに行われた授与とその現在まで続く効力を表した。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 委ねられた権限を表し、後に出る δύναμις（力）との語義上の区別を保つ。
- source_word: τοῦ πατεῖν
  choice: 踏みつけ
  rationale: 与えられた権威の内容を示す不定詞を、比喩性を解消せず簡潔に訳した。
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: 蛇やさそりを
  rationale: 具体的な生き物の像をそのまま保ち、現代日本語で自然な名称を用いた。
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: 敵のあらゆる力を制する
  rationale: 敵の力に対する優越・支配を自然な日本語で表しつつ、πᾶσαν の包括性を「あらゆる」で保った。
- source_word: δύναμιν
  choice: 力
  rationale: 敵が有する実力・勢力を表し、弟子たちに授けられた「権威」と区別した。
- source_word: τοῦ ἐχθροῦ
  choice: 敵
  rationale: 単数形の人格的な表現を保ち、本文が明記していない「サタン」や「悪魔」という特定を訳文に加えなかった。
- source_word: οὐδὲν ὑμᾶς οὐ μὴ ἀδικήσῃ
  choice: 何ものも決してあなたがたを害することはない
  rationale: οὐδέν と οὐ μή による強い否定を「何ものも決して……ない」で示し、ἀδικέω は文脈に即して「害する」とした。
theological_decisions:
- issue: 「敵」の指示対象
  choice: 本文では「敵」と訳し、対象を特定しない
  alternative: 「サタン」または「悪魔」と明示する
  rationale: 直前の文脈はサタン的・悪霊的な敵対を強く示唆するが、ギリシア語本文自体は「敵」とだけ述べるため、その余地を残した。
- issue: 蛇とさそりの意味
  choice: 具体的な像を本文に残す
  alternative: 悪霊的な勢力の比喩として説明的に訳す
  rationale: 語彙上は実在する蛇とさそりを指す一方、文脈上は敵対する霊的勢力を象徴する可能性もあるため、本文では像を保ち、注で解釈の幅を示した。
- issue: 害を受けないという約束の範囲
  choice: 限定を加えず、強い否定をそのまま訳す
  alternative: 「最終的には害されない」などと神学的限定を補う
  rationale: 本文の約束は強く包括的に表現されている。経験や他の聖句との調和を目的とした限定を訳文へ持ち込まず、原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「見なさい」「権威」「授けてある」によって発言の厳粛さを保った。「さそり」は一般読者に読みやすいよう平仮名表記とした。
