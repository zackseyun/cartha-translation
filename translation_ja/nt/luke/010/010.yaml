  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: ja
  text: しかし、どの町に入って、そこで人々があなたがたを受け入れないなら、その町の通り[a]に出て、こう言いなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「広い通り」または「公共の広場」。ギリシア語は、幅の広い公道や開けた公共の場所を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: しかし、どの町に入っても
  rationale: ἄνを伴う不定関係節の一般的・条件的な意味を、自然な日本語の「どの町に入っても」で表した。δέの対照は「しかし」で示した。
- source_word: εἰσέλθητε
  choice: 入って
  rationale: 町の中へ移動するという基本的意味を簡潔に表し、条件表現「どの町に入っても」に組み込んだ。
- source_word: μὴ δέχωνται ὑμᾶς
  choice: 人々があなたがたを受け入れないなら
  rationale: δέχομαιの「迎え入れる・受け入れる」という幅を保つため「受け入れる」とした。ギリシア語では主語が省略されているが、日本語で明瞭にするため、町の住民を指す「人々」を補った。
- source_word: ἐξελθόντες
  choice: 出て
  rationale: 分詞は後続の命令「言いなさい」に先立つ動作を示すため、自然な連用形で順序を保った。
- source_word: τὰς πλατείας αὐτῆς
  choice: その町の大通り[a]
  rationale: πλατεῖαは幅の広い公道や開けた公共空間を指し得る。「大通り」は公の場という含みと街路の像を自然に伝え、指示対象を明確にするためαὐτῆςを「その町の」と訳した。語義の幅は脚注に残した。
- source_word: εἴπατε
  choice: こう言いなさい
  rationale: 命令法を「言いなさい」で直接表し、次節に続く発言を導くため、日本語として自然な「こう」を補った。
