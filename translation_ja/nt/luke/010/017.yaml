id: LUK.10.17
reference: Luke 10:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: ja
  text: さて、七十二人[a]は喜びながら帰って来て、こう言った。「主よ、あなたの名によって、悪霊さえ私たちに従います。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「七十二人」ではなく「七十人」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: 帰って来て
  rationale: 宣教の働きから戻ったことを表すアオリスト。現代日本語の物語文として自然に訳した。
- source_word: δὲ
  choice: さて
  rationale: 物語の展開を示す接続辞。強い逆接とはせず、新しい場面への移行を自然に示す。
- source_word: οἱ ἑβδομήκοντα δύο
  choice: 七十二人
  rationale: SBLGNTの本文に従う。異読の「七十人」は脚注に示す。
- source_word: μετὰ χαρᾶς
  choice: 喜びながら
  rationale: 彼らが喜びを抱いて帰還したという付帯状況を、自然な日本語で表す。
- source_word: λέγοντες
  choice: こう言った
  rationale: 分詞による直接話法の導入を、日本語の物語文として自然な定動詞で表した。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの呼びかけであるκύριεを、標準的かつ荘重な「主よ」と訳す。
- source_word: καὶ
  choice: さえ
  rationale: 驚きを伴う累加・強意の意味を表し、「悪霊どもまで」という含意を保持する。
- source_word: τὰ δαιμόνια
  choice: 悪霊ども
  rationale: 敵対的な霊的存在を指す標準的な新約用語として「悪霊」を用い、複数性を明確にする。
- source_word: ὑποτάσσεται
  choice: 従います
  rationale: 服従・服属を表す現在形。報告中の現実として自然な日本語の現在形で訳した。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: ὑποτάσσωに伴う与格を「～に従う」と自然に表す。
- source_word: ἐν τῷ ὀνόματί σου
  choice: あなたの名によって
  rationale: イエスの名に結びつく権威・媒介を示すἐνを、日本語で誤解の少ない「名によって」とした。
theological_decisions:
- issue: 弟子たちの人数に関する本文異読
  choice: 七十二人
  alternative: 七十人
  rationale: 指定されたSBLGNT本文のδύοを採用しつつ、重要でよく知られた異読を脚注に保存する。
- issue: 「あなたの名」による服従の意味
  choice: あなたの名によって
  alternative: あなたの名において
  rationale: 名そのものを呪術的手段と断定せず、イエスの名に伴う権威・媒介という原文の幅を自然な日本語で保つ。
translation_notes:
  register: 明瞭な現代標準日本語。直接話法には敬意と驚きが自然に伝わる丁寧体を用い、地の文は簡潔で品位ある物語調とした。
