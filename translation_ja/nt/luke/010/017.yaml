  to: さて、七十二人[a]は喜びながら帰って来て、こう言った。「主よ、あなたの名によって、悪霊さえ私たちに従います。」
  rationale: 本文の構文、時制的な報告の性格、異読の扱いは維持したまま、「悪霊ども」を中立的で明瞭な現代標準日本語の「悪霊」に改めた。これにより、原文に明示されない侮蔑的含意を避けつつ、悪霊の複数的・敵対的性格を保つ。
