  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑπολαβὼν ⸀δὲ ὁ Ἰησοῦς εἶπεν· Ἄνθρωπός τις κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχὼ καὶ λῃσταῖς περιέπεσεν, οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες ἀπῆλθον ἀφέντες ⸀ἡμιθανῆ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: ja
  text: イエスは答えた。「ある人がエルサレムからエリコへ下って行く途中、強盗たちに襲われた。強盗たちはその人の服をはぎ取り、殴りつけ、半死半生のまま残して立ち去った。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ ὁ Ἰησοῦς εἶπεν
  choice: イエスは答えた
  rationale: ὑπολαμβάνω はここでは直前の問いを受けて発言することを表すため、自然な日本語で「答えた」とした。δέ は談話の推移を示すが、独立して訳出しなくても機能が伝わる。
- source_word: Ἄνθρωπός τις
  choice: ある人
  rationale: τις の不特定性を保ち、性別を必要以上に強調しない自然な表現とした。
- source_word: κατέβαινεν ἀπὸ Ἰερουσαλὴμ εἰς Ἰεριχώ
  choice: エルサレムからエリコへ下って行く途中
  rationale: エルサレムから低地のエリコへ向かう地理的な下降を「下って」で保持し、未完了過去の進行中の状況を「途中」で示した。
- source_word: λῃσταῖς περιέπεσεν
  choice: 強盗たちに襲われた
  rationale: περιπίπτω の字義は「出くわす／陥る」だが、この文脈では暴力的被害を伴うため、日本語として明瞭な「襲われた」とした。λῃσταί は複数なので「強盗たち」とした。
- source_word: οἳ καὶ ἐκδύσαντες αὐτὸν καὶ πληγὰς ἐπιθέντες
  choice: 強盗たちはその人の服をはぎ取り、殴りつけ
  rationale: 連続する分詞の動作を自然な順序で表した。καί の累加は動作の列挙によって十分に伝わるため、「さらに」などを加えなかった。πληγὰς ἐπιτιθέναι は打撃を加えることなので「殴りつけ」とした。
- source_word: ἀφέντες ἡμιθανῆ
  choice: 半死半生のまま残して
  rationale: ἡμιθανής の「半ば死んだ」状態を、現代日本語で定着した「半死半生」で簡潔かつ鮮明に表した。ἀφέντες の放置の意味は「残して」に反映した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭で、物語として自然に読める格調を保った。原文の地理的な「下る」、加害者の複数性、被害者が生死の境に置かれた状態を保持した。
