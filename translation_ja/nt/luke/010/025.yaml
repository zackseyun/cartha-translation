revisions:
- from: すると、見よ、ある律法の専門家[a]が立ち上がり、イエスを試そうとして言った。「先生、何をすれば、永遠のいのちを受け継ぐことができるでしょうか。」
  to: すると、そこに一人の律法の専門家[a]が立ち上がり、イエスを[b]試すために言った。『先生、何をすれば、永遠のいのちを受け継ぐのでしょうか。』
  rationale: 本文は、原文の意味を変えずに現代日本語としての流れを整えた。「そこに一人の」は Καὶ ἰδού の場面提示を自然に反映し、「試すために」は ἐκπειράζων の敵対的・探る意図を過度に「誘惑」と解釈せず表す。質問は、行為を前提に永遠のいのちを「受け継ぐ」と尋ねる原文の緊張を説明で解消せず保持した。SBLGNTの角括弧で示された αὐτόν の異読は脚注で明記した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:33:24Z'
