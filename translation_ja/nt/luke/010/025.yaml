  terminology: 「律法の専門家」は、この文脈の νομικός を現代の弁護士と混同させず、γραμματεύς（律法学者／書記）とも機械的に同一視しない適切な表現である。「永遠のいのち」「受け継ぐ」も、ζωὴ αἰώνιος と κληρονομήσω の定着した意味および相続の比喩を保つ。
