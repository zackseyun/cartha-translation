id: LUK.10.25
reference: Luke 10:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ νομικός τις ἀνέστη ἐκπειράζων ⸀αὐτὸν λέγων· Διδάσκαλε, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: ja
  text: すると、そこに一人の律法の専門家[a]が立ち上がり、イエスを[b]試すために言った。『先生、何をすれば、永遠のいのちを受け継ぐのでしょうか。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法の専門家」は、モーセの律法とその解釈に通じた人を指す。
    reason: 歴史的文脈において、現代の一般的な弁護士を意味しないことを明確にするため。
  - marker: b
    text: 一部の写本には「イエスを」に当たる語がない。
    reason: ギリシア語本文で αὐτόν（「彼を」）が角括弧に置かれており、写本間の異読を示すため。
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: すると、見よ
  rationale: 物語の展開を示すκαίと、注意を促して場面を生き生きと提示するἰδούの働きを保った。「見よ」はやや格調があるが、聖書本文として明瞭である。
- source_word: νομικός τις
  choice: ある律法の専門家
  rationale: ここでのνομικόςは現代の一般的な弁護士ではなく、モーセの律法の解釈に通じた人物を指すため、その歴史的意味を直接かつ自然に表した。
- source_word: ἀνέστη
  choice: 立ち上がり
  rationale: 動作をそのまま明瞭に表し、続く分詞構文へ自然につないだ。
- source_word: ἐκπειράζων αὐτὸν
  choice: イエスを試そうとして
  rationale: ἐκπειράζωの、相手を試みにかける意図を表す。「誘惑する」では罪へ誘う意味が強すぎるため避けた。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: λέγων
  choice: 言った
  rationale: ギリシア語の分詞を、日本語の自然な叙述に合わせて定動詞として表した。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとして現代日本語で自然であり、教師としての役割を明瞭に示す。
- source_word: τί ποιήσας
  choice: 何をすれば
  rationale: アオリスト分詞が表す手段・前提を自然な条件表現にし、問い手の行為をめぐる枠組みを保った。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: 定着した明瞭な訳語を用いた。「いのち」は単なる生存以上の含意を保つ。
- source_word: κληρονομήσω
  choice: 受け継ぐことができるでしょうか
  rationale: κληρονομέωの相続の比喩を「受け継ぐ」で保持した。未来形を日本語の丁寧な質問として自然に表した。
theological_decisions:
- issue: 第二神殿期ユダヤ教の文脈におけるνομικός
  choice: 「律法の専門家」と訳し、モーセの律法に通じた人物であることを明示する。
  alternative: 「律法学者」または「法律家」
  rationale: 「法律家」は現代の世俗法の実務家と誤解されやすい。「律法学者」も可能だが、γραμματεύςとの語彙上の区別を保つため「律法の専門家」とした。
- issue: τί ποιήσας ... κληρονομήσω の神学的緊張
  choice: 「何をすれば、永遠のいのちを受け継ぐことができるでしょうか」と訳す。
  alternative: 「永遠のいのちを受け継ぐために、私は何をすべきでしょうか」
  rationale: 問い手が行為を前提として尋ねている構図と、「受け継ぐ」という相続の比喩との緊張を、説明を加えて解消せず、そのまま残した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「見よ」と「永遠のいのち」で聖書本文にふさわしい格調を保った。会話は丁寧だが過度に古風にならない形とした。
