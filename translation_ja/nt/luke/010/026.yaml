  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: ja
  text: イエスは彼に言った。「律法には何と書いてあるか。あなたはどう読んでいるか[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたはどう解釈しているか」。ギリシア語は直訳すると「あなたはどう読んでいるか」だが、理解や解釈の意味を含むことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: すると、イエスは
  rationale: δέは弱い接続を表すため、文脈の流れを自然に示す「すると」とした。ギリシア語では冠詞が代名詞的に用いられて主語を示しており、直前の文脈から主語がイエスであることを明示した。
- source_word: εἶπεν πρὸς αὐτόν
  choice: 彼に言った
  rationale: πρός＋対格が発言の相手を示すことを、自然で簡潔な日本語で表した。
- source_word: Ἐν τῷ νόμῳ
  choice: 律法には
  rationale: νόμοςはここでは一般的な法ではなく、イスラエルに与えられた聖書上の律法を指す。「トーラー」と限定的に音写せず、日本語で定着した「律法」を用いた。
- source_word: τί γέγραπται
  choice: 何と書いてあるか
  rationale: 完了受動形γέγραπταιが表す、書かれていて今もその内容が存続している状態を、自然な日本語の「書いてある」で表した。
- source_word: πῶς ἀναγινώσκεις
  choice: あなたはどう読んでいるか
  rationale: ἀναγινώσκωの基本義「読む」を本文に残した。「どう」は読み方だけでなく理解や解釈を問う含みも保てる。文脈上補う目的語は日本語では省略するのが自然である。
theological_decisions:
- issue: νόμοςが指す範囲
  choice: イスラエルに与えられた、聖書として認められている律法を指す「律法」
  alternative: 「トーラー」、または一般的な意味での「法」
  rationale: 律法の専門家との対話という文脈から、一般法ではなく聖書上の律法への言及である。ただし本文が明示する以上に範囲を狭めないため、「トーラー」の音写は採用しなかった。
- issue: πῶς ἀναγινώσκειςの解釈的含意
  choice: 「あなたはどう読んでいるか」と基本義を本文に残す
  alternative: 「あなたはどう解釈しているか」
  rationale: 問いは理解や解釈を含み得るが、動詞そのものの基本義は「読む」である。本文ではその開かれた表現を保ち、解釈の可能性は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、対話の直接性を保つため常体の疑問文とした。「何と書いてあるか」は口語として自然でありながら、聖書への厳粛な問いかけにも適する。
