id: LUK.10.35
reference: Luke 10:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: ja
  text: 翌日、彼はデナリオン銀貨二枚[a]を取り出して宿屋の主人に渡し、言った。「この人の世話をしてください。さらに費用がかかるなら、その分は、私が戻って来たときにお返しします。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一デナリオンはローマの標準的な銀貨で、労働者のおよそ一日分の賃金に相当した。
    reason: 当時の貨幣単位とおおよその価値を現代の読者に説明するため。
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: 翌日
  rationale: 翌日を表す慣用的な時の表現として、簡潔で自然な現代日本語にした。
- source_word: ἐκβαλών
  choice: 取り出して
  rationale: ここでは所持していた金銭を出すことを意味するため、字義的すぎる表現を避け、文脈に合う訳とした。
- source_word: δύο δηνάρια
  choice: デナリオン銀貨二枚
  rationale: 当時の貨幣名を保持しつつ、日本語読者に硬貨であることが明確に伝わるよう「銀貨」を補った。価値については本文で換算せず、注に示した。
- source_word: τῷ πανδοχεῖ
  choice: 宿屋の主人に
  rationale: 宿泊施設そのものではなく、それを営み管理する人物を指すため、自然で明確な表現とした。
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: この人の世話をしてください
  rationale: 注意を払って世話をするよう求める命令の力を、丁寧だが明確な依頼表現で示した。
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: これ以上かかった費用は
  rationale: 追加で支出する額が定まっていないことと、すでに渡した金額を超える費用であることを自然な日本語で表した。
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: 私が戻って来たときに
  rationale: この不定詞構文の時間的意味を、現代日本語で自然な従属節として訳した。
- source_word: ἀποδώσω σοι
  choice: お返しします
  rationale: 宿屋の主人が立て替えた追加費用を後で支払うという金融上の文脈を、自然な敬語表現で示した。
