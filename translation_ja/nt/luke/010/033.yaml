  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: ja
  text: しかし、旅をしていた一人のサマリア人が、その人のいる所まで来て、その人を見ると、深いあわれみを抱いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαμαρίτης
  choice: サマリア人
  rationale: 民族的・宗教的帰属を示す定着した訳語であり、物語における社会的対照を保つ。
- source_word: δέ
  choice: しかし
  rationale: 直前の祭司とレビ人の行動との対照を、自然な現代日本語で明確に示す。
- source_word: τις
  choice: 一人の
  rationale: 不定の人物を導入する語。日本語では「ある」も可能だが、「一人の」が自然で人物への焦点を保つ。
- source_word: ὁδεύων
  choice: 旅をしていた
  rationale: 進行中の背景動作を表す現在分詞を、自然な日本語の連体修飾で表した。
- source_word: ἦλθεν
  choice: 来た
  rationale: ἔρχομαιの基本的意味をそのまま簡潔に表す。
- source_word: κατ’ αὐτόν
  choice: その人のいる所に
  rationale: 傷ついた人のいる場所まで来たという文脈上の意味を、曖昧さの少ない自然な日本語で示す。
- source_word: ἰδών
  choice: 彼を見ると
  rationale: 主動詞に先立つ知覚と、その結果としての反応を自然な時間的つながりで表す。
- source_word: ἐσπλαγχνίσθη
  choice: 深くあわれんだ
  rationale: 内臓が揺さぶられるような強い同情・憐れみを示す語の情感を、過度に説明的にならず伝える。
theological_decisions:
- issue: サマリア人の反応を後代の道徳的・教理的解釈を加えずに訳すこと
  choice: 深くあわれんだ
  alternative: あわれに思った／同情した
  rationale: ギリシア語が表す強く内面的な憐れみを保ちつつ、恵みや隣人愛など本文に明記されていない概念を付加しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「深くあわれんだ」は日常的に理解でき、同時に原語の強い感情的含意を保つ。
