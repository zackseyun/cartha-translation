id: LUK.10.13
reference: Luke 10:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: ja
  text: 「ああ、コラジン、あなたには災いがある！ ああ、ベツサイダ、あなたには災いがある！ あなたがたの間で行われた力あるわざ[a]が、もしティルスとシドンで行われていたなら、彼らはとうの昔に粗布をまとい、灰の上に座って悔い改めていたであろう[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「奇跡」。ギリシア語は「力あるわざ」「力の働き」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「粗布と灰の中に座って、とうの昔に悔い改めていたであろう」。粗布と灰は、深い悲しみと悔い改めを表した。
    reason: cultural_and_syntactic_clarification
lexical_decisions:
- source_word: Οὐαί σοι
  choice: ああ、あなたには災いがある
  rationale: 預言者的な嘆きと裁きの宣告という両面を保つ。「災いだ」だけよりも、感嘆詞「ああ」によって呼びかけの情感を示した。
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: コラジン／ベツサイダ／ティルス／シドン
  rationale: 現代日本語の聖書で理解されやすい標準的な音写を用いた。
- source_word: δυνάμεις
  choice: 力あるわざ
  rationale: 単に「奇跡」と限定せず、力と行為の双方を表す語感を保つ。文脈上はイエスによる超自然的な働きを指す。
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: 行われた……行われていた
  rationale: 日本語では出来事としての発生と働きとしての行為を自然に表せる。「起こった」も可能だが、「わざ」との連語では「行われた」が明瞭である。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間で
  rationale: 複数の相手、またその町の人々のただ中を活動の領域として表す。
- source_word: πάλαι
  choice: とうの昔に
  rationale: 反実仮想の中で、かなり以前にすでにそうしていたはずだという時間的強調を自然に示す。
- source_word: ἐν σάκκῳ καὶ σποδῷ καθήμενοι
  choice: 粗布をまとい、灰の中に座って
  rationale: 悔い改めと悲嘆を示す具体的な姿を保持する。σάκκοςは粗い布またはそれで作った衣を指し、文脈上「まとい」を補うと日本語で明瞭になる。
- source_word: μετενόησαν
  choice: 悔い改めていたであろう
  rationale: μετανοέωの道徳的・霊的な方向転換を表す定着した訳語を用い、ἄνを伴う反実仮想を「であろう」で示す。
theological_decisions:
- issue: δυνάμειςが指すイエスの働きの性質
  choice: 力あるわざ
  alternative: 奇跡
  rationale: その働きが超自然的であることを否定せず、ギリシア語が前面に出す「力の現れとしての行為」という幅を残した。
- issue: 悔い改めの外的表現
  choice: 粗布をまとい、灰の中に座って、という具体像を本文に保持
  alternative: 粗布と灰によって悔い改めを示していた
  rationale: 分詞 καθήμενοι の姿勢と、古代の悲嘆・悔い改めの象徴を抽象化せずに伝える。
- issue: 反実仮想と人間の応答
  choice: 「もし……行われていたなら、……悔い改めていたであろう」と訳す
  alternative: 「……悔い改めたに違いない」と強く断定する
  rationale: εἰ＋過去時制とἄνを伴うアオリストが示す反実仮想を保ち、そこから予定論や自由意志について本文以上の結論を加えない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「ああ」と反復によって原文の厳粛な嘆きと宣告を保ちつつ、「とうの昔に」で自然な口調を確保した。地名への直接呼びかけは町の住民を含む修辞としてそのまま残した。
