id: LUK.10.1
reference: Luke 10:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: ja
  text: これらのことの後、主はほかに七十二人[a]を任命し、二人ずつ、ご自分に先立って、ご自分が行こうとしておられたすべての町や場所へ遣わされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「七十人」とある。
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: これらのことの後
  rationale: 複数形の指示語を保ちつつ、時間的な移行を明確に表す。
- source_word: ἀνέδειξεν
  choice: 任命し
  rationale: ある務めのために人々を選び、立てる意味を自然な現代日本語で表す。
- source_word: ὁ κύριος
  choice: 主
  rationale: ここでイエスを指す称号として、簡潔で定着した訳語を用いる。
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: さらに七十二人[a]を
  rationale: ἑτέρουςとκαίが示す追加の意味を「さらに」で表し、SBLGNT本文の「七十二」を採用する。重要な異読は脚注に残す。
- source_word: ἀπέστειλεν
  choice: 遣わされた
  rationale: 派遣の行為を表す聖書文体として自然であり、語にない職制上の含意を加えない。
- source_word: ἀνὰ δύο δύο
  choice: 二人ずつ
  rationale: 二人一組で分配的に遣わしたことを、自然で明瞭な日本語にする。
- source_word: πρὸ προσώπου αὐτοῦ
  choice: ご自分に先立って
  rationale: イエスの到着に先行するという準備的な意味を明確に表す。
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: すべての町や場所へ
  rationale: πόλιςを規模の大きな都市に限定しない「町」とし、二つの名詞を保持する。「や」は包括的な並列として自然である。
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: ご自分が行こうとしておられた
  rationale: μέλλωが示す予定・近い将来を保ち、強意のαὐτόςを「ご自分」で反映する。日本語の移動表現として「行く」を用いる。
theological_decisions:
- issue: 任命された人数についての本文異読
  choice: 七十二人
  alternative: 七十人
  rationale: 底本SBLGNTはἑβδομήκοντα δύο（七十二）を採用しているため本文に置く。一方、「七十」は重要な写本異読なので脚注に明記し、解釈によって解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「主」「遣わされた」によって節の尊厳ある語調を保った。敬意表現はイエスを指す「ご自分」と述語に限定し、過度に古風な文体は避けた。
