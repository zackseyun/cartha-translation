  text: ὁμοίως δὲ καὶ ⸀Λευίτης κατὰ τὸν τόπον ἐλθὼν καὶ ἰδὼν ἀντιπαρῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: ja
  text: 同じように、レビ人もその場所に来て、彼を見ると、反対側を通って行った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その場所のそばまで来て」とも訳せる。また、「反対側を通って行った」は、原文の複合動詞が示唆する、相手を避けるようにその反対側を通る動きを表している。単に「通り過ぎた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: 同じように
  rationale: 直前の祭司の行動との類似を示す副詞の比較的な力を、自然な現代日本語で明確に表す。
- source_word: δὲ καὶ
  choice: も
  rationale: δέは弱い接続であり、日本語では文の流れに委ね、καίの追加の意味を「も」で表して祭司に続くもう一人の例であることを示す。
- source_word: Λευίτης
  choice: レビ人
  rationale: ユダヤの歴史的・宗教的集団名を一般化せず、日本語で定着した名称として保持する。
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: その場所に来て
  rationale: 問題の場所へ到着したことを示す句と分詞を、出来事の順序が自然に伝わる形にする。κατάの厳密な空間関係には多少の幅があるが、文脈上は到着地点として訳すのが適切である。
- source_word: ἰδὼν
  choice: 彼を見ると
  rationale: 先行する分詞を主動作の契機として表し、目的語は直前の文脈にある襲われた人を指すため「彼」を補う。
- source_word: ἀντιπαρῆλθεν
  choice: 道の反対側を通り過ぎて行った
  rationale: 単に通過しただけでなく、相手を避けるように反対側を通ったという複合動詞の含意を自然な日本語で保つ。
theological_decisions:
- issue: Λευίτηςの社会的・宗教的身分
  choice: レビ人
  alternative: 神殿奉仕者／レビ族の人
  rationale: 祭司と並ぶ歴史的に特定された人物像を保ち、本文中で役割を説明しすぎたり特定の教派的理解を持ち込んだりしない。
- issue: ἀντιπαρῆλθενに含まれる回避の意図
  choice: 道の反対側を通り過ぎて行った
  alternative: 通り過ぎた
  rationale: 複合動詞が示唆する反対側を通る動きを表す一方、人物の内面的動機を本文以上に断定しない。
translation_notes:
  register: 明瞭で現代的ながら品位のある物語文。「レビ人」は定着した聖書用語として保持し、「道の反対側」で回避を示唆する空間的な動きを過度に心理化せず表現した。
