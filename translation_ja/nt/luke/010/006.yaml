source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: ja
  text: また、もしそこに平和を受け入れる人[a]がいるなら、あなたがたの平和はその人の上にとどまる。だが、そのような人がいなければ、その平和はあなたがたのもとに戻ってくる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「平和の子」。ここでは、平和のあいさつまたは祝福を受け入れる人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: 平和を受け入れる人
  rationale: 直訳は「平和の子」だが、セム語的表現であり、ここでは弟子たちが告げる平和にふさわしく応答し、それを受け入れる人を指す。現代日本語で意味が自然に伝わるよう機能的に訳し、原語の表現は脚注に残した。
- source_word: ἐπαναπαήσεται
  choice: とどまる
  rationale: 平和がその人の上に落ち着いて宿るという比喩を、自然で簡潔な日本語で表した。
- source_word: ἡ εἰρήνη ὑμῶν
  choice: あなたがたの平和
  rationale: 弟子たちが告げる平和の挨拶・祝福を指すが、「平和」という語そのものを保ち、単なる挨拶に限定しなかった。
- source_word: μήγε
  choice: もしそうでなければ
  rationale: 強められた否定条件を、文脈上明瞭な現代日本語で表した。
- source_word: ἀνακάμψει
  choice: 戻って来る
  rationale: 平和が受け入れられなければ告げた者たちへ帰る、という動きを自然な日本語で保持した。
- source_word: ἐφ’ ὑμᾶς
  choice: あなたがたのもとに
  rationale: 原義の「あなたがたの上に」を、日本語の「戻る」と自然に結び付く表現にした。
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: もしそこに……がいるなら
  rationale: 条件と場所の強調を保持した。節頭の καί は日本語では前節との流れにより明示せずとも接続関係が自然に伝わる。
theological_decisions:
- issue: υἱὸς εἰρήνης の男性形とセム語的慣用句を日本語でどう表すか
  choice: 本文では「平和を受け入れる人」とし、脚注で直訳「平和の子」を示す
  alternative: 本文で「平和の子」または「平和の人」とする
  rationale: 日本語の「平和の子」は意味が直ちに伝わりにくく、性別を示す表現でもない。文脈上、この句は平和を帯びた言葉に応答する者を指すため、その機能を明瞭に訳した。ただし「穏やかな性格の人」だけを意味すると断定せず、原語の比喩を脚注に保存した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「あなたがたの平和」「その人の上にとどまる」という原文の比喩を保った。文末は聖書本文にふさわしい簡潔で落ち着いた常体とした。
