source:
  edition: SBLGNT
  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: ja
  text: その家にとどまり、その人たちが提供するものを食べ、飲みなさい。働く者はその報酬を受けるに値するからです。家から家へと移ってはいけません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ
  choice: その同じ家に
  rationale: αὐτῇの照応性と強調を生かし、先に彼らを迎え入れた家に引き続き滞在することを明確にした。
- source_word: μένετε
  choice: とどまり
  rationale: 現在命令形の継続的な意味を、自然で格調のある現代日本語で表した。後続の分詞と合わせ、文末の命令「なさい」に統合した。
- source_word: ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν
  choice: その人たちが出してくれるものを食べ、飲みなさい
  rationale: 分詞が主要動詞と同時に行われる行為を表すことを保ちつつ、τὰ παρ’ αὐτῶνを客として提供される飲食物という文脈に即して自然に訳した。
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: 働く者が報酬を受けるのは当然だからです
  rationale: ἄξιοςの資格・相応しさを日本語では「当然」と表し、μισθόςはこの派遣奉仕への支えを含み得るため「賃金」より広い「報酬」とした。αὐτοῦの意味は「受ける」によって自然に含意した。
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: 家から家へと移ってはいけません
  rationale: 宿を次々に替えることを禁じる表現として、原文の反復構造を保ちながら明瞭に訳した。
theological_decisions:
- issue: τοῦ μισθοῦ αὐτοῦにおける男性単数代名詞と報酬の帰属
  choice: 働く者が報酬を受けるのは当然
  alternative: 働く者は自分の報酬を受けるに値する
  rationale: 原文の男性単数は「働く者」に対応する一般的な用法である。日本語では所有代名詞を明示しなくても帰属が明確であり、「受ける」によって働く者に支払われる報酬であることを保持した。ἄξιοςの神学的・倫理的含意を過度に拡張しないよう、文脈上の労働と扶養の原則として表現した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの命令としての簡潔さと品位を保った。「出してくれる」は宿主による提供を自然に示し、「報酬」は金銭的賃金に限定せず、この文脈での飲食・宿泊による支えも含み得る表現とした。脚注標識[a]は対応する文の直後に置いた。
