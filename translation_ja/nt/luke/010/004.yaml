source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: ja
  text: 財布も、旅行用の袋[a]も、履物も持って行ってはならない。道中では、だれにも挨拶してはならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「旅行用の袋」は、旅の食糧や必需品を入れて携帯する袋。「袋」または「背負い袋」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: これは通常の礼儀そのものを禁じるというより、当時しばしば時間を要した道中の挨拶に足を止めず、任務を急ぐよう求めたものと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: 持って行ってはならない
  rationale: 旅に携行することを禁じる文脈なので、「運ぶ」よりも自然な「持って行く」とした。
- source_word: βαλλάντιον
  choice: 財布
  rationale: 金銭を入れて携帯する袋を指す。現代日本語で簡潔かつ明瞭な語を選んだ。
- source_word: πήραν
  choice: 旅袋
  rationale: 旅の食糧や必需品を入れる袋を指すため、その用途を伝えつつ古代の文脈にもなじむ「旅袋」とした。
- source_word: ὑποδήματα
  choice: 履物
  rationale: 語義は足に着ける物一般であり、当時は通常サンダルであった。「履物」は原語の範囲を保ち、携行品としての表現にも自然である。
- source_word: κατὰ τὴν ὁδόν
  choice: 道中では
  rationale: 移動の途中を表す句を、自然で簡潔な現代日本語にした。
- source_word: ἀσπάσησθε
  choice: 挨拶してはならない
  rationale: 原文の直接的な禁止の力を弱めず、「挨拶する」という通常の意味をそのまま表した。
theological_decisions:
- issue: 道中で人に挨拶することへの禁止の強さ
  choice: 本文では「だれにも挨拶してはならない」と直接的な禁止として訳す。
  alternative: 「長い挨拶で足止めされてはならない」と意訳する。
  rationale: 原文は明確な禁止命令であり、本文ではその緊張を保持した。使命の緊急性と当時の挨拶習慣については注で説明し、本文に解釈を織り込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「財布」「旅袋」「履物」と並べて携行品の禁止を簡潔に示し、後半の命令は原文どおり強い表現を維持した。
