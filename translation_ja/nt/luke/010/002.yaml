  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: ja
  text: また、彼らにこう言われた。「収穫は多いが、働き手は少ない。だから、収穫の主に願い求めなさい。ご自分の収穫に働き手を送り出してくださるように[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「力強く押し出してくださるように」とも訳せる。ギリシア語の動詞には、単に「送る」より強い意味が込められることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: こう言われた
  rationale: 未完了過去だが、ここでは発言を導入する物語上の用法なので、現代日本語として自然な過去形とした。「こう」により後続する直接話法とのつながりを明確にした。
- source_word: δὲ
  choice: また
  rationale: 強い逆接ではなく、叙述を進める穏やかな接続を表すため。
- source_word: θερισμός
  choice: 収穫
  rationale: 刈り入れとその実りを含み得る農耕の比喩を、解釈で限定せずに保つ標準的な訳語。
- source_word: πολύς
  choice: 多い
  rationale: 収穫の豊かさ・規模を簡潔に表し、「働き手は少ない」との対照を自然に保つ。
- source_word: ἐργάται
  choice: 働き手
  rationale: 収穫の働きに携わる者を指す、明瞭で現代的な表現。「労働者」よりもこの比喩的文脈になじむ。
- source_word: ὀλίγοι
  choice: 少ない
  rationale: πολύςとの明確な対照をそのまま表す。
- source_word: δεήθητε
  choice: 願い求めなさい
  rationale: 単に尋ねるのではなく、切実に願う意味を持つ命令形。宗教的文脈で自然でありつつ、懇願の強さも伝える。
- source_word: οὖν
  choice: だから
  rationale: 前文を根拠とする推論を、明瞭で自然な現代日本語で示す。
- source_word: κύριος
  choice: 主
  rationale: 所有権と権威の双方を含む称号として定着した訳語であり、神学的含意を狭めない。
- source_word: ὅπως
  choice: 〜ように
  rationale: 願いの内容ないし目的を導く日本語として自然。
- source_word: ἐκβάλῃ
  choice: 送り出してくださる
  rationale: 文脈上は働き手を収穫へ派遣する意味。ἐκβάλλωが持ち得る、単なる派遣より強い「押し出す」ほどの語感は注で示し、本文では不自然な強制の含意を避けた。
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: ご自分の収穫に
  rationale: 方向を示すεἰςと所有を示すαὐτοῦを保ちつつ、原文に明示されない「畑」などを補わず、比喩を維持した。
theological_decisions:
- issue: 「収穫の主」の指示対象と含意
  choice: 「収穫の主」という比喩的称号を説明せずに保持する。
  alternative: 神を宣教の所有者・指揮者と明示する、またはイエスの神的権威への含意を明示する。
  rationale: 本文は収穫を所有し、働き手を送り出す権威ある方を示すが、この節自体はそのキリスト論的含意を明説していない。解釈を付加せず、原文の神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、直接話法には簡潔で格調を失わない表現を採用した。「収穫」「働き手」「収穫の主」という比喩の連鎖を保ち、原文にない説明は本文へ加えていない。
