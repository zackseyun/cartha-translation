  text: λέγω ὑμῖν ὅτι Σοδόμοις ἐν τῇ ἡμέρᾳ ἐκείνῃ ἀνεκτότερον ἔσται ἢ τῇ πόλει ἐκείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/012.yaml
  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: ja
  text: あなたがたに言います。その日には[b]、ソドムのほうが、あの町よりも耐えやすいでしょう[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「より耐えられる」「より容認しやすい」。ギリシア語の比較級は、そのほうがより耐えられる、またはより容認しやすいことを表します。
    reason: lexical_alternative
  - marker: b
    text: 「その日」は神の裁きの日を指します。並行する箇所では、そのことが明記されています。
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 現在形による直接的で重みのある断言を、明瞭な現代日本語で表した。
- source_word: Σοδόμοις
  choice: ソドムのほうが
  rationale: 地名を住民の集合的な呼称として用いる原文の換喩を保ち、比較構文として自然な日本語にした。
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: その日には
  rationale: 原文どおり『裁き』を本文に補わず、文脈に含まれる終末的・司法的含意を保持した。
- source_word: ἀνεκτότερον
  choice: 耐えやすい
  rationale: 比較級の『より耐えられる、より容認しやすい』という意味を、現代日本語で理解しやすく表した。
- source_word: ἔσται
  choice: のです
  rationale: 未来の判断を日本語では文脈上明らかな時点表現『その日には』に担わせ、断言の力を『のです』で自然に示した。
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: あの町よりも
  rationale: 指示語と比較関係を保ち、πόλιςを文脈に適した一般的な『町』と訳した。
theological_decisions:
- issue: 『その日』の性質
  choice: 本文では『その日』のまま保持する
  alternative: 『裁きの日』と明示する
  rationale: 文脈上は神の裁きの日を指すが、この節自体には『裁き』という語がないため、本文では補わず脚注で含意を示す。
- issue: 比較される裁きの耐えやすさ
  choice: ソドムのほうが『耐えやすい』と述べる
  alternative: ソドムの罪や裁きが軽いと説明的に言い換える
  rationale: 原文は比較の理由や裁きの具体的な程度を説明していないため、その緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の簡潔な断言と比較構造を維持しつつ、日本語として自然な語順にした。脚注記号は該当句の理解を妨げないよう節末に配置した。
