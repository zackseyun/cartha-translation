  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: ja
  text: 彼は言った。「その人にあわれみを示した人です。」するとイエスは彼に言われた。「行って、あなたも同じようにしなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: その人にあわれみを示した人
  rationale: 直訳的には「彼とともにあわれみを行った者」。日本語では「あわれみを示した」が自然であり、行為としての慈悲を明確に伝える。
- source_word: Πορεύου
  choice: 行って
  rationale: 移動を命じる現在命令形の力を保ちつつ、自然な日本語の命令として表した。
- source_word: καὶ σὺ
  choice: あなたも
  rationale: σὺが明示されているため、「あなたも」として対照的な強調を保持した。
- source_word: ποίει ὁμοίως
  choice: 同じようにしなさい
  rationale: 継続的・実践的な命令を、明瞭で自然な現代日本語として表現した。
theological_decisions:
- issue: 「あわれみ」の行為性
  choice: あわれみを示した
  alternative: あわれみ深く接した／慈悲を行った
  rationale: 特定の教派的含意を加えず、隣人となることが具体的行為に現れるという原文の表現を保った。
- issue: καὶ σὺの強調
  choice: あなたも
  alternative: （省略して）同じようにしなさい
  rationale: イエスが律法の専門家本人に実践を求める明示的な強調を落とさないため。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「憐れみ」ではなく読みやすい「あわれみ」を採用し、イエスへの敬意は「言われた」で自然に示した。
