  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: ja
  text: しかし、主は彼女に答えた。「マルタ、マルタ、あなたは多くのことを心配して、心を乱している。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: しかし、主は彼女に答えた
  rationale: 分詞と定動詞から成る応答の慣用表現を、自然な日本語の一つの動詞「答えた」で表した。δὲは直前のマルタの訴えに対する穏やかな対照として「しかし」とした。
- source_word: ὁ κύριος
  choice: 主
  rationale: ルカの物語におけるイエスへの称号として、敬意とキリスト論的な響きの双方を保つ。
- source_word: Μάρθα Μάρθα
  choice: マルタ、マルタ
  rationale: 呼びかけの反復をそのまま保ち、親愛と強調を伝えた。
- source_word: μεριμνᾷς
  choice: 心配し
  rationale: 思い煩いや不安を表す語であり、現代の一般的な日本語として明瞭な「心配する」を選んだ。
- source_word: θορυβάζῃ
  choice: 気を乱している
  rationale: 騒ぎ立つことではなく、内面的に動揺し取り乱している状態を指す文脈なので、「気を乱す」とした。μεριμνᾷςとの意味の違いも保つ。
- source_word: περὶ πολλά
  choice: 多くのことを
  rationale: 関心や動揺の対象が多岐にわたることを、簡潔で自然な日本語で表した。
theological_decisions:
- issue: イエスに対するκύριοςの称号
  choice: 主
  alternative: 主人
  rationale: 単なる家や共同体の主人という意味に狭めず、ルカ文書における敬称およびキリスト論的含意を保持した。
translation_notes:
  register: 明瞭で現代的ながら、直接話法の重みを保つ品位ある標準語。二つの心理状態を「心配し」と「気を乱している」で区別した。
