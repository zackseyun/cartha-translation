  text: πλὴν Τύρῳ καὶ Σιδῶνι ἀνεκτότερον ἔσται ἐν τῇ κρίσει ἢ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: ja
  text: しかし、裁きのときには、あなたがたよりもツロとシドンのほうが耐えやすいでしょう[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「より耐えられるでしょう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: しかし
  rationale: 直前の糾弾を受けた強い対比を、自然な現代日本語で示す。
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: ティルスとシドンのほうが
  rationale: 比較構文に伴う与格を、日本語では「のほうが」によって自然に表した。地名は原語に即した現代的な音写とした。
- source_word: ἀνεκτότερον
  choice: 耐えやすい
  rationale: ἀνεκτόςの比較級であることを明示し、裁きが相対的に耐えやすいという原文の意味を簡潔に保つ。
- source_word: ἔσται
  choice: でしょう
  rationale: 未来の事態を述べる機能を自然な日本語で表す。ここでの「でしょう」は推量というより、文脈上の厳粛な未来言明として機能する。
- source_word: ἐν τῇ κρίσει
  choice: 裁きの日には
  rationale: 定冠詞を伴う特定の終末的な裁きを日本語で自然に示す。「日」は文脈上の時点を明確にする補足であり、裁きの内容を過度に説明しない。
- source_word: ἢ ὑμῖν
  choice: あなたがたよりも
  rationale: 比較対象を表す与格を、日本語の標準的な比較表現で明確にした。
theological_decisions:
- issue: κρίσιςの性質
  choice: 「裁きの日」とし、終末的な神の裁きを指す文脈を示す
  alternative: 一般的な意味で「裁きの際」とする
  rationale: 悔い改めなかった町々とティルス、シドンの運命を比較する文脈は最終的な裁きを強く示唆する。ただし、裁きの具体的性質は訳文で詳説しない。
- issue: 裁きの相対的な耐えやすさ
  choice: 「よりも……ほうが耐えやすい」と比較をそのまま保つ
  alternative: 有罪の程度や刑罰の軽重として説明的に訳す
  rationale: 原文は比較を述べるが、その仕組みを説明していないため、刑罰の段階など特定の教理へ展開せず緊張を保つ。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳粛な宣告にふさわしい品位を保った。「裁きの日」は一般読者に理解しやすく、終末的文脈を自然に伝える。
