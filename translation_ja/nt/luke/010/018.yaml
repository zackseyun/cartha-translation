  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: ja
  text: イエスは彼らに言われた。「わたしは、サタンが、稲妻のように天から落ちるのを見ていた。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「サタンが、稲妻のように天から落ちるのを見た」とも訳せる。ギリシア語の動詞は未完了過去であり、「見ていた」はその継続的な側面をより明確に表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτοῖς
  choice: すると、イエスは彼らに言われた
  rationale: δέは強い対立を示さない穏やかな接続語なので、文脈の流れを自然に示す「すると」とした。主語は文脈上イエスであり、日本語で指示対象を明確にするため固有名を用いた。
- source_word: Ἐθεώρουν
  choice: 見ていた
  rationale: θεωρέωの未完了過去が持つ継続的・進行的な側面を、自然な現代日本語で保持する。単純過去の「見た」も可能であるため脚注に示した。
- source_word: τὸν Σατανᾶν
  choice: サタンが
  rationale: Σατανᾶςを固有の呼称として慣用的に音写した。知覚構文を自然な日本語の「～が…するのを見る」に組み替えた。
- source_word: ὡς ἀστραπὴν
  choice: 稲妻のように
  rationale: ὡςによる直喩を明確かつ自然に保った。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: οὐρανόςには「空」と「天」の両義があるが、ここではサタンの落下という宇宙論的・神学的文脈を損なわない「天」を選んだ。
- source_word: πεσόντα
  choice: 落ちるのを
  rationale: Σατανᾶνを修飾するアオリスト分詞を、知覚内容を表す自然な日本語にした。完了済みと断定せず、落下の出来事を描写する。
theological_decisions:
- issue: サタンの落下についての発言が指す時点と、未完了過去の相
  choice: 「見ていた」として継続的な知覚・幻視の含みを保ち、落下がいつ起きたかは特定しない。
  alternative: 「見た」、または「落ちたのを見ていた」
  rationale: 本文だけでは、原初の堕落、弟子たちの宣教に伴う現在的敗北、将来の敗北を先取りする幻視のいずれかに限定できない。時系列を教義的に確定せず、ギリシア語の相と比喩表現を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスの発言には一般的な聖書文体として「わたし」を用い、過度に古風な語法は避けた。
