id: LUK.10.31
reference: Luke 10:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: ja
  text: たまたま、ある祭司がその道を下っていた。祭司はその人を見ると、道の反対側を通り過ぎて行った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その人を避け、反対側を通って行った」とも訳せる。ギリシャ語の動詞は、相手から離れた側を通り過ぎることを表し、意図的に避けたことを示唆する。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: たまたま
  rationale: 偶然の成り行きで起こったことを示す慣用句。自然な現代日本語で、偶然性について必要以上の哲学的含意を加えない。
- source_word: δὲ
  choice: 文の区切りで表現
  rationale: 物語を進める弱い接続辞であり、日本語では独立した接続語を置かず文脈と文の区切りによって自然に表せる。
- source_word: ἱερεύς τις
  choice: ある祭司
  rationale: τιςが示す、名を挙げられていない一人の人物という不定性を保つ。
- source_word: κατέβαινεν
  choice: 下っていた
  rationale: 未完了過去の継続的・背景的な動きを表し、単純な完了動作にしない。
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: その道を
  rationale: 道に沿った移動を表す自然な日本語。指示語ἐκείνῃも「その」で保持する。
- source_word: ἰδὼν αὐτὸν
  choice: その人を見ると
  rationale: アオリスト分詞の時間的関係を自然に示し、見たことに続いて次の行動が起きた流れを表す。
- source_word: ἀντιπαρῆλθεν
  choice: 道の反対側を通り過ぎて行った
  rationale: 単なる「通り過ぎた」ではなく、相手と反対の側を通ったという複合動詞の含意を明示する。意図的回避という解釈を本文で必要以上に断定しない。
theological_decisions:
- issue: 祭司が反対側を通った動機
  choice: 動作のみを本文に記し、動機は断定しない
  alternative: 「その人を避けて」と明示する
  rationale: ἀντιπαρῆλθενは反対側を通る動作と回避を示唆するが、祭司の内面的理由までは本文に明記されていないため。
translation_notes:
  register: 明瞭で落ち着いた現代標準日本語。「下っていた」で物語の背景動作を保ち、「祭司は」と主語を補って代名詞の混同を避けた。
