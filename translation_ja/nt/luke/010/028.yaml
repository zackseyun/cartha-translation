  text: εἶπεν δὲ αὐτῷ· Ὀρθῶς ἀπεκρίθης· τοῦτο ποίει καὶ ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: ja
  text: すると、イエスは彼に言われた。「あなたの答えは正しい。そのとおり行いなさい。そうすれば、あなたは生きる。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈では「永遠の命」が問題となっている（25節参照）が、ギリシア語はここでは単に「あなたは生きる」と述べている。
    reason: cross_reference
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: すると、イエスは彼に言われた
  rationale: δέは弱い接続辞なので、物語の流れに合う「すると」とした。日本語では主語を補わないと話者が分かりにくいため、文脈上明白な「イエス」を明示し、敬意を表す自然な聖書文体として「言われた」とした。
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: あなたの答えは正しい
  rationale: ὀρθῶςは「正しく」、ἀπεκρίθηςは「あなたは答えた」の意。直訳的な「あなたは正しく答えた」も可能だが、「あなたの答えは正しい」は現代日本語の直接話法として自然で、評価の意味を忠実に伝える。
- source_word: τοῦτο ποίει
  choice: そのとおり行いなさい
  rationale: τοῦτοは直前に引用された戒めを指す。「これを行いなさい」よりも、相手が述べた内容を受ける日本語として「そのとおり」が明瞭である。ποίειは現在命令形で継続的実践を含み得るが、過度に説明せず「行いなさい」とした。
- source_word: καὶ ζήσῃ
  choice: そうすれば、あなたは生きる
  rationale: καίはここで命令に続く結果を表すため、日本語では「そうすれば」とするのが自然。ζήσῃは単純に「生きる」と訳し、「永遠の命を受ける」など原文にない語を本文へ加えなかった。
theological_decisions:
- issue: 「生きる」が指す範囲と永遠の命との関係
  choice: 本文では「あなたは生きる」とする
  alternative: 「あなたは永遠の命を受ける」または「永遠に生きる」
  rationale: 10章25節の問いは永遠の命に関するため、その含意は文脈上強い。しかし、この節のギリシア語は単に ζήσῃ（あなたは生きる）と述べる。本文では語義の幅と神学的緊張を保ち、文脈上の含意を脚注で示す。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。「律法の専門家」へのイエスの応答として簡潔さを保った。本文中の脚注記号[a]は注釈対象である「生きる」を含む文の直後に置いた。
