  text: Two[a] men will be in the field; one will be taken, and the other will be left.
translation:
  language: ja
  text: 二人が畑にいるだろう。そのうち一人は連れて行かれ、もう一人は残される。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、シナイ写本とバチカン写本（ともに4世紀）を含む初期のギリシア語写本や初期のコプト語訳にはないが、ベザ写本（5世紀）などの西方系本文、ビザンティン多数本文、ラテン語ウルガタにはある。マタイによる福音書24章40節に調和させるため、後代の写字生が加えた可能性が高い。
    reason: textual_critical
lexical_decisions:
- source_word: Δύο
  choice: 二人
  rationale: ギリシア語は「二つ／二人」とだけ述べ、性別を明示しない。文脈上は人を指すため、自然な日本語で「二人」とした。
- source_word: ἐν τῷ ἀγρῷ
  choice: 畑に
  rationale: ἀγρός はここでは人が作業する耕地を指す。「野」も可能だが、場面が明確で現代日本語として自然な「畑」を採った。
- source_word: παραληφθήσεται
  choice: 連れて行かれ
  rationale: παραλαμβάνω の受動形で、ある者が取り上げられ、連れて行かれることを表す。救済か裁きかという文脈上の解釈を訳語だけで断定しないよう、「連れて行かれる」とした。
- source_word: ἀφεθήσεται
  choice: 残される
  rationale: ἀφίημι の受動形で、この対比ではその場に残されることを表す。「見捨てられる」では否定的含意を強めすぎるため避けた。
- source_word: ὁ ἕτερος
  choice: もう一人
  rationale: 先に示された二人のうち、他方の一人を指すため、自然な日本語の「もう一人」とした。
theological_decisions:
- issue: 「連れて行かれる者」と「残される者」のどちらが救われるのか
  choice: 訳文ではどちらが救済または裁きを受けるかを明示しない
  alternative: 「迎え入れられる」「見捨てられる」など、片方を明確に救済側または裁き側とする
  rationale: 動詞の対比自体は明白だが、この一節だけでは各人の最終的な運命を訳語で確定すべきではない。原文の終末論的緊張と解釈上の余地を保った。
translation_notes:
  register: 明瞭で現代的かつ品位のある叙述とした。性別を原文以上に限定せず、「連れて行かれ／残される」という簡潔な対句を保った。
