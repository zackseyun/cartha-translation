reference: Luke 17:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: ja
  text: イエスは彼らを見ると、「祭司たちのところへ行き、自分を見せなさい」[b]と言われた。そして、彼らが行く途中で、清められた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「清くされた」。ギリシア語の動詞は、身体的な回復と祭儀上の清めの両方を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 祭司に自分を見せるよう命じたのは、皮膚病が治った人が律法に従って祭司の確認を受けるためである。レビ記14章参照。
    reason: cross_reference
lexical_decisions:
- source_word: ἰδὼν
  choice: 彼らを見ると
  rationale: アオリスト分詞を、主動詞との時間的な関係が自然に伝わる節として訳した。「彼ら」は直後の αὐτοῖς と文脈から補った。
- source_word: Πορευθέντες
  choice: 行って
  rationale: 後続の命令形 ἐπιδείξατε と一体になった命令として理解し、日本語で自然な連続動作を表した。
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: 自分の体を見せなさい
  rationale: 直訳的な「自分自身を見せなさい」よりも、祭司による皮膚の状態の確認という文脈が明瞭になる自然な表現を選んだ。
- source_word: τοῖς ἱερεῦσιν
  choice: 祭司たちに
  rationale: 複数形を保ち、律法に基づいて清めを確認する祭司たちを指す表現とした。
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: 彼らは、行く途中で
  rationale: この構文が示す同時進行を簡潔に表し、清めが彼らの従って行く途上で起きたことを保った。
- source_word: ἐκαθαρίσθησαν
  choice: 清くされた
  rationale: καθαρίζω の受動形が持つ身体的な回復と祭儀上の清さの両面を保った。「癒やされた」だけでは後者が失われるため避けた。
theological_decisions:
- issue: 皮膚病に関する文脈での「清め」の表現
  choice: 清くされた
  alternative: 癒やされた／病が治った
  rationale: 本文は単なる治癒を表す語ではなく καθαρίζω を用いており、身体の回復と祭儀上の清さへの回復を重ねている。その緊張を解消せずに残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、命令と出来事の簡潔で荘重な流れを保った。話者は文脈上のイエスであるため主語を明示した。脚注記号は説明対象の語句の直後に置いた。
