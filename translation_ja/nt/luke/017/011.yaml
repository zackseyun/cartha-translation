source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: ja
  text: さて、イエスはエルサレムへ向かう途中、サマリアとガリラヤの間を通っておられた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「サマリアとガリラヤの中を通っておられた」。ギリシア語の表現は、二つの地域の間、すなわち境界地帯を進んだとも、両地域の中を通ったとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: さて
  rationale: ルカに特徴的な物語進行の定型句。直訳的な「そして、…ということが起こった」は現代日本語では不自然なため、場面を進める「さて」で機能を表した。
- source_word: ἐν τῷ πορεύεσθαι εἰς Ἰερουσαλήμ
  choice: エルサレムへ向かう途中
  rationale: ἐν＋冠詞付き不定詞の同時進行と、目的地へ進む旅程を、自然な現代日本語で表した。
- source_word: αὐτός
  choice: イエスは
  rationale: ギリシア語では代名詞だが、単独節として明確に読めるよう文脈上の指示対象を固有名で示した。強意的な「ご自身」はここでは過度である。
- source_word: διήρχετο
  choice: 通っておられた
  rationale: 未完了過去の継続的な移動を「ていた」に相当する形で表し、イエスへの自然で控えめな敬意として尊敬表現を用いた。
- source_word: διὰ μέσον Σαμαρείας καὶ Γαλιλαίας
  choice: サマリアとガリラヤの間を
  rationale: 二地域の中間・境界地帯を進む理解を本文に採用した。ただし「両地域の中を通る」とも取り得るため、脚注で曖昧さを保持した。
