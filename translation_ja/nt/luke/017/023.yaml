  text: καὶ ἐροῦσιν ὑμῖν· Ἰδοὺ ⸂ἐκεῖ· Ἰδοὺ ὧδε⸃· μὴ ἀπέλθητε μηδὲ διώξητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/023.yaml
  text: And they will say to you[a], ‘Look, there!’ or ‘Look, here!’ Do not go away or run after them.
translation:
  language: ja
  text: 人々があなたがたに、「ほら、あそこだ！」「ほら、ここだ！」と言うでしょう。出かけてはならない。また、後を追ってもならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「後を追う」の目的語は、ギリシア語では明示されていません。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ἐροῦσιν ὑμῖν
  choice: 人々はあなたがたに……と言うでしょう
  rationale: 未来形を自然な日本語の予告として訳した。主語は文脈上不特定なので「人々」とした。
- source_word: Ἰδοὺ ἐκεῖ· Ἰδοὺ ὧδε
  choice: 「見よ、あそこだ」「見よ、ここだ」
  rationale: ἰδούの注意喚起の力と、ἐκεῖ／ὧδεの簡潔な場所的対照を保った。
- source_word: μὴ ἀπέλθητε
  choice: 出て行ってはならず
  rationale: ἀπέρχομαιの移動の意味を保ち、指し示された場所へ向かうなという文脈にも自然に合う。
- source_word: μηδὲ διώξητε
  choice: 後を追ってもなりません
  rationale: διώκωの「追う、追い求める」という意味を自然な日本語で表し、原文どおり目的語を明示しなかった。
theological_decisions:
- issue: διώξητεの目的語を補うか
  choice: 目的語を明示せず「後を追ってもなりません」とする
  alternative: 「彼らの後を追ってもなりません」
  rationale: ギリシア語では目的語が示されておらず、偽りの知らせ、示された場所、またはそれを告げる者を指す可能性を限定しないため。日本語でも目的語なしで自然に表現できる。
- issue: 二つの指示表現の接続
  choice: 「見よ、あそこだ」「見よ、ここだ」と並置する
  alternative: 「『見よ、あそこだ』とか、『見よ、ここだ』とか」
  rationale: 原文の反復と切迫した響きを簡潔に保ち、特定の終末論的解釈を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの警告にふさわしい簡潔で格調ある調子と、原文の反復を保った。
