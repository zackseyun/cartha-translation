  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: ja
  text: そして、イエスの足もとに、顔を伏せてひれ伏し、イエスに感謝した。彼はサマリア人であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον
  choice: ひれ伏し
  rationale: 直訳的には「顔を地につけて倒れ」であり、深い敬意を示して身を伏せる姿勢を表す。現代日本語では「ひれ伏す」が動作と姿勢を簡潔かつ自然に伝える。
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: イエスの足もとに
  rationale: παρά＋対格はここでは、ひれ伏した位置を示す「足もとに」が自然。代名詞の指示対象を日本語で明確にするため「イエス」とした。
- source_word: εὐχαριστῶν αὐτῷ
  choice: 感謝した
  rationale: 現在分詞は主動詞に伴う行為を表す。日本語では主動作と並べて「感謝した」とするのが自然であり、感謝の相手は直前の「イエス」から明らかである。
- source_word: Σαμαρίτης
  choice: サマリア人
  rationale: 民族的・宗教的背景を持つ呼称の標準的な日本語訳であり、物語上の社会的な意外性を保持する。
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: 彼はサマリア人であった
  rationale: αὐτόςによる人物への焦点を「彼は」で示し、解釈的な強調を加えず簡潔な開示として訳す。文頭のκαίは日本語では独立文にすることで展開を十分表せるため、機械的に「そして」を重ねない。
theological_decisions:
- issue: 癒やされた者の身元に置かれた物語上の強調
  choice: 「彼はサマリア人であった」と簡潔に述べる
  alternative: 「ところが、彼はサマリア人であった」
  rationale: 感謝した者が社会的に部外者と見なされがちなサマリア人だったという緊張と意外性は文脈そのものに委ね、「ところが」などの解釈的な接続語を加えない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「ひれ伏す」により礼拝的・敬意的な身体姿勢を自然に表現しつつ、その行為の神学的意味を訳文で断定しない。「であった」は物語文として落ち着いた文体を保つ。
