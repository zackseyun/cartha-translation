id: LUK.17.13
reference: Luke 17:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἦραν φωνὴν λέγοντες· Ἰησοῦ ἐπιστάτα, ἐλέησον ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: ja
  text: そして彼らは声を張り上げて言った。「イエス、先生[a]、私たちをあわれんでください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「先生」は、権威ある人への呼びかけを表すギリシア語エピスタタの訳。「主」に通常用いられる語（キュリオス）とは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 単純な接続として物語の流れを自然につなぎ、原文にない強い時間的意味を加えない。
- source_word: αὐτοὶ
  choice: 彼らは
  rationale: 明示された代名詞を主語として訳す。日本語では「彼ら自身」とすると不自然に強調されるため避けた。
- source_word: ἦραν φωνὴν
  choice: 声を張り上げて
  rationale: 直訳的な「声を上げる」の比喩を保ちつつ、遠くから大声で呼びかける文脈を明瞭に表す自然な現代日本語。
- source_word: λέγοντες
  choice: 言った
  rationale: ギリシア語の分詞を、日本語では前句に続く定動詞として自然に処理した。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 呼格の固有名を標準的な日本語表記で音写した。
- source_word: ἐπιστάτα
  choice: 先生
  rationale: 権威ある指導者への呼びかけを表す。通常「主」と訳される κύριος とは区別しつつ、現代日本語で自然な敬称とした。
- source_word: ἐλέησον
  choice: あわれんでください
  rationale: 助けを求める切実な命令・嘆願として、慈悲深い介入を願う意味を保つ。
- source_word: ἡμᾶς
  choice: 私たちを
  rationale: 動詞の目的語を明示し、自然な日本語の格関係で表した。
theological_decisions:
- issue: イエスへの呼称 ἐπιστάτα の訳し分け
  choice: 先生
  alternative: 主／師よ
  rationale: 原語は κύριος（主）ではなく、権威や指導的立場にある者への呼称 ἐπιστάτης である。「主」としてキリスト論的含意を過度に強めず、敬意と権威を示す呼びかけとして訳した。「師よ」も可能だが、現代の一般読者にはやや古風である。
translation_notes:
  register: 明瞭で現代的ながら品位ある語調。病人たちの切実な大声の呼びかけを「声を張り上げて」で表し、依頼は敬語の「ください」とした。
