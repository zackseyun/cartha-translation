  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: ja
  text: 彼らは答えて、イエスに言った。「主よ、どこですか。」イエスは彼らに言われた。「からだ[a]のある所には、ハゲワシ[b]も集まる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「からだ」は「死体」とも訳せる。そう訳すと、腐肉をあさる鳥のイメージがより明確になる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「鷲」。ギリシア語は「鷲」を指すこともあるが、からだの周りに集まる鳥という文脈では、「ハゲワシ」が意味をより明確に伝える。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες λέγουσιν
  choice: 彼らは答えて言った
  rationale: 分詞と歴史的現在から成る応答導入句。日本語では自然な物語叙述として過去形にしつつ、「答えて言う」という原文の構造を保った。
- source_word: Ποῦ
  choice: どこなのですか
  rationale: 場所を問う簡潔な疑問を、主への問いとして自然な現代日本語にした。何がそこで起こるかは補わず、文脈上の含みを保った。
- source_word: κύριε
  choice: 主よ
  rationale: イエスへの呼びかけとして、κύριος の通常の訳語「主」を用いた。
- source_word: σῶμα
  choice: からだ
  rationale: 原語の基本義を保ち、死体・遺骸であることを本文で明示しすぎないようにした。周囲の腐肉食鳥の比喩から死体の意味合いは伝わる。
- source_word: ἀετοὶ
  choice: はげわし
  rationale: 語は鷲類を広く指し得るが、からだの周りに集まる鳥という文脈では腐肉食のはげわしが最も明瞭である。別訳「鷲」は脚注に残した。
- source_word: ἐπισυναχθήσονται
  choice: 集められる
  rationale: 未来受動形を反映し、行為者を特定しない原文の表現を保った。日本語でも格言的で不吉な響きを維持する。
theological_decisions:
- issue: からだとはげわしの格言的比喩が何を指すか
  choice: 比喩をそのまま訳し、具体的な指示対象を特定しない
  alternative: 終末の裁き、ローマ軍などの侵略勢力、または避けられない露見と裁きの一般原則への言及と明示する
  rationale: ギリシア語本文は比喩の指示対象を特定していないため、解釈上の緊張を保ち、説明を本文へ持ち込まない。
translation_notes:
  register: 明快な現代標準語を用い、格言の簡潔さと厳粛で不吉な調子を保った。「どこなのですか」は過度な文脈補充を避けた自然な問い。「からだ」は平仮名表記として、生物一般の体と死体との含みを残した。
