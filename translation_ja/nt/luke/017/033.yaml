id: LUK.17.33
reference: Luke 17:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: ja
  text: 自分の命[a]を保とうとする者は、それを失う。しかし、自分の命を失う者は、それを生かしておく[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「命」と訳した語は「魂」とも訳せるが、ここでは人の命または自己全体を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「生きた状態に保つ」。「救う」と訳すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: ～ようとする
  rationale: 単なる願望ではなく、意図して求めることを表す。日本語では「保とうとする」と結びつけることで、その目的意識を自然に示せる。
- source_word: ψυχή
  choice: 命
  rationale: ここでは非物質的な「魂」に限定せず、危機の中で保とうとしたり失ったりする人の命・自己を指す。「命」が文脈上最も自然である。
- source_word: περιποιήσασθαι
  choice: 保つ
  rationale: 自分のために確保し、失わないようにする意味を、簡潔で自然な日本語にした。
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: 失う
  rationale: 二つの節に反復される逆説を保ち、意味を「捨てる」などに限定しない。
- source_word: ζῳογονήσει
  choice: 生かしておく
  rationale: 通常の「救う」とは異なり、生きた状態に保つという動詞の具体的な意味を反映する。
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: ～する者は……しかし、～する者は
  rationale: 一般的条件を表し、δέによる対照を「しかし」で明示する。
theological_decisions:
- issue: ψυχήが指すもの
  choice: 「命」と訳す
  alternative: 「魂」と訳す
  rationale: 終末的な危機の中で自分を保とうとすることと失うことの逆説が主眼であり、身体と魂の二分法を本文に持ち込まないため。
- issue: ζῳογονήσειの訳し方
  choice: 「生かしておく」と訳す
  alternative: 「救う」または「命を保つ」と訳す
  rationale: この語が持つ「生きた状態に保つ」という意味を透明に示し、一般的な救済用語へ置き換えず、前半との緊張も残すため。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「命を保つ／失う／生かしておく」という反復と対照を維持し、説明を本文へ加えず逆説をそのまま残した。
