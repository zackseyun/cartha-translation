id: LUK.17.24
reference: Luke 17:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: ja
  text: ちょうど、稲妻が天の下の一方から天の下の他方へひらめいて輝くように[a]、人の子も、人の子の日には[b]そのようになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より慣用的には、「空の一方の端から他方の端までひらめいて輝くように」。原文は両方で「天の下」を繰り返しています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼の日に」。人の子と結び付く時を指しますが、ここではその内容をさらに限定していません。
    reason: alternative_rendering
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: ちょうど……ように
  rationale: γάρは直前の説明を導く働きを文脈に溶け込ませ、ὥσπερの比較構文を自然な現代日本語で表した。単独節の訳として不自然な「なぜなら」を加えない。
- source_word: ἀστραπὴ ἀστράπτουσα
  choice: 稲妻が……ひらめいて
  rationale: 同語根の名詞と分詞による鮮明な描写を、自然な日本語の「稲妻」と「ひらめく」で表した。
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανόν
  choice: 天の下の一方から天の下の他方へ
  rationale: 原文が「天の下」を両側で反復する点を保ちつつ、移動の両端を補って日本語として理解できる形にした。より慣用的な表現は脚注に示した。
- source_word: λάμπει
  choice: 辺りを照らす
  rationale: 先のἀστράπτουσα「ひらめいて」と区別し、稲妻の光が目に見える範囲を照らす情景を日本語で明瞭にした。「辺り」は目的語を自然に補うもので、範囲を限定する意図はない。
- source_word: οὕτως ἔσται
  choice: そのようになります
  rationale: 比喩との対応と未来時制を保ち、現れの様態を過度に具体化しない表現とした。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着し、原文の称号を説明的に言い換えない訳語を用いた。
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: 人の子の日には
  rationale: αὐτοῦの指示対象を日本語で明確にするため称号を反復し、その時が人の子に属し、また人の子と結び付くことを保った。「来臨の日」「裁きの日」とは限定しない。
theological_decisions:
- issue: 終末論的文脈における「人の子の日」の意味
  choice: 「人の子の日には」とし、その日が何を指すかは限定しない
  alternative: 「人の子が来る日には」または「裁きの日には」
  rationale: 文脈は終末論的だが、原文は「彼の日に」とだけ述べる。来臨や裁きと明示することは、本文にない解釈上の限定を加えるため避けた。
- issue: 稲妻の比喩が示す内容
  choice: 比喩をそのまま提示し、「そのように」と結ぶ
  alternative: 「誰の目にも明らかに現れます」または「突然来ます」
  rationale: 比喩は可視性、広がり、突然性などを想起させうるが、そのいずれか一つに意味を固定せず、原文の含みを保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語を用いた。「天の下」の反復はやや荘重だが、原文の特徴として本文に残した。「人の子の日」は日常語としては特異でも、所有関係と意図的な幅を保つため採用した。
