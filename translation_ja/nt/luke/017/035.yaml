  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: ja
  text: 二人の女性が一緒に[a]臼をひいている。一人は連れて行かれ[b]、もう一人は残される。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一緒に」は、「同じ場所で」とも訳せる。ギリシア語の表現は、共に行うことも同じ場所にいることも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「連れて行かれる」という語だけでは、それが救いのためか裁きのためかは特定されない。ギリシア語本文は、その判断をより広い文脈に委ねている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται δύο ἀλήθουσαι
  choice: 二人の女が…臼をひいている
  rationale: 女性複数形の分詞によって二人が女性であることを明示する。ἀλήθωは穀物などをひく作業を指すため、現代日本語で情景が自然に伝わる「臼をひく」とした。
- source_word: ἐπὶ τὸ αὐτό
  choice: 一緒に
  rationale: 同じ場所にいること、または共に行うことを表す慣用句。ここでは「一緒に」が自然であり、場所の共有も含意できる。
- source_word: ἡ μία παραλημφθήσεται
  choice: 一人は連れて行かれ
  rationale: παραλαμβάνωの未来受動態を透明に訳した。「連れて行かれる」は単なる「取られる」より人を目的語とする日本語として自然であり、それが救いか裁きかは特定しない。
- source_word: ἡ δὲ ἑτέρα ἀφεθήσεται
  choice: もう一人は残される
  rationale: δέの対比と、ἀφίημιの未来受動態が示す「残される」を簡潔に表した。「置き去りにされる」は否定的な含意を強めるため避けた。
theological_decisions:
- issue: 「連れて行かれる者」と「残される者」のどちらが救いまたは裁きを受けるのか
  choice: 一人は連れて行かれ、もう一人は残される
  alternative: 一人は救いへ連れて行かれ、もう一人は裁きのために残される／一人は裁きに連れ去られ、もう一人は守られる
  rationale: 本文そのものは二人が分けられることだけを述べ、各状態の神学的意味を明示しない。したがって、その緊張と曖昧さを訳文でも保持する。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「臼をひく」で古代の日常作業を簡潔に示し、終末論的な意味について本文にない解釈を加えない。
