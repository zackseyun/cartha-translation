id: LUK.17.3
reference: Luke 17:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: ja
  text: 自分自身に気をつけなさい。あなたの兄弟[b]が罪を犯したなら[a]、その人を戒めなさい。そして、悔い改めたなら、その人を赦しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「あなたの兄弟があなたに対して罪を犯したなら、その人を戒めなさい」とあります。
    reason: textual_variant
  - marker: b
    text: 「兄弟」はギリシア語では男性単数ですが、ここでは仲間の弟子を広く指している可能性があります。
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: 自分自身に気をつけなさい
  rationale: 現在命令形の継続的な警戒と再帰代名詞の意味を保ちつつ、個々人の自己警戒と共同体内での相互の注意の余地を残す自然な日本語。
- source_word: ἁμάρτῃ
  choice: 罪を犯したなら
  rationale: 本文には「あなたに対して」に当たる語句がないため、対象を限定せずに訳した。
- source_word: ὁ ἀδελφός σου
  choice: あなたの兄弟
  rationale: ギリシア語の男性単数を明示的に反映する。文脈上、仲間の弟子をより広く指し得ることは脚注で説明する。
- source_word: ἐπιτίμησον αὐτῷ
  choice: その人を戒めなさい
  rationale: 直接的な言葉による是正を命じる強さを保ち、「叱責する」よりも現代日本語の聖書文体として自然で品位のある表現を選んだ。
- source_word: μετανοήσῃ
  choice: 悔い改めたなら
  rationale: 倫理的・関係的な方向転換を表す標準的な神学用語であり、赦しとのつながりも明確。
- source_word: ἄφες αὐτῷ
  choice: 赦しなさい
  rationale: 対人関係の文脈におけるἀφίημιの意味を、簡潔で自然な日本語で表した。
theological_decisions:
- issue: 「罪を犯す」の後に「あなたに対して」を含めるか
  choice: 本文では含めない
  alternative: あなたの兄弟があなたに対して罪を犯したなら
  rationale: 提示されたSBLGNT本文にはεἰς σέなどの目的語がなく、罪の対象を限定しない。長い異読は脚注に残す。
- issue: ἀδελφόςの性と指示範囲
  choice: あなたの兄弟
  alternative: 仲間の弟子／兄弟姉妹
  rationale: 原文の男性単数を本文に反映しつつ、共同体の仲間を広く指し得る可能性を脚注で示して、意味範囲を不必要に狭めない。
- issue: 悔い改めと赦しの関係
  choice: 条件文をそのまま保持する
  alternative: 悔い改めの有無にかかわらず赦しなさい、と説明的に訳す
  rationale: ἐὰν μετανοήσῃ ἄφες αὐτῷという原文の条件構造と神学的緊張を、解釈で解消せずそのまま伝える。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。命令の強さを保ちながら、過度に古風な語順や硬すぎる表現を避けた。脚注記号は関連箇所に置き、[a]は異読の対象となる文の直後、[b]は節末に配置した。
