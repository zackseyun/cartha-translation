source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: ja
  text: ノアの時代に起こったのとちょうど同じように、人の子の時代にもそうなる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: ちょうど同じように
  rationale: 前後の事態を対応させる比較の強さを、現代日本語として自然に表す。
- source_word: ἐγένετο
  choice: 起こった
  rationale: ノアの時代に生じた出来事を指す動的な意味を保ち、古風な表現を避ける。
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: ノアの時代に
  rationale: ギリシア語の時間表現を、明瞭で自然な日本語の慣用表現にする。
- source_word: οὕτως
  choice: そう
  rationale: 先行する比較内容を簡潔に受け、比較の後半を明確に示す。
- source_word: ἔσται
  choice: なる
  rationale: 未来形の存在・状態の意味を保ちつつ、日本語では「そうなる」とするのが自然である。
- source_word: καὶ
  choice: にも
  rationale: 後半のκαίが示す対応・付加を、「人の子の時代にも」によって自然に保持する。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書で確立した称号であり、字義的な形とダニエル書7章を背景とする可能性のある終末論的響きを保つ。
theological_decisions:
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπουという称号の訳
  choice: 人の子
  alternative: 人間である者
  rationale: 「人の子」は日本語聖書で定着した称号で、字義的構造とメシア的・黙示的連想を保持する。「人間である者」は一般的人間性に意味を限定しやすいため本文には採らない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、比較構文を自然に整えた。簡潔さと荘重さを保ち、称号「人の子」は伝統的かつ原文に近い形で残した。
