id: LUK.17.25
reference: Luke 17:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: ja
  text: しかし、まず人の子は多くの苦しみを受け、この世代の人々から退けられなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: まず
  rationale: 時間的な先行を示す副詞的用法。直前に語られた人の子の日に先立つ出来事であることを、簡潔で自然な日本語で示す。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの顕現についての言及から、先に起こる苦難へと転じる軽い対照を表す。
- source_word: δεῖ
  choice: なければならない
  rationale: 必要性を明確に保つ。ルカにおける神のご計画との関連を含み得るが、本文にない説明は加えない。
- source_word: αὐτὸν
  choice: 人の子は
  rationale: ギリシア語では代名詞だが、文脈上の指示対象を日本語で明瞭にし、この節を単独で読んでも理解できるようにした。
- source_word: πολλὰ παθεῖν
  choice: 多くの苦しみを受け
  rationale: πολλάの幅を保ちながら、日本語として自然な聖書表現にした。「大いに苦しみ」よりも、さまざまな苦難を受ける含みを伝える。
- source_word: ἀποδοκιμασθῆναι
  choice: 退けられ
  rationale: 吟味の末に不適格として拒む語感を含む動詞。文脈にふさわしい、明瞭で重みのある表現を選んだ。
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: この時代の人々から
  rationale: 受動文に伴うἀπόを行為の源・主体として訳す。γενεάを単に「世代」とせず、イエスと同時代の人々を指すことが自然に伝わるようにした。
theological_decisions:
- issue: 人の子の苦難に関するδεῖの必然性
  choice: 「なければならない」と訳し、必要性を保持する
  alternative: 「神のご計画によって苦しまなければならない」と明示する
  rationale: ルカ文書でδεῖは神の目的に沿う必然性をしばしば帯びるが、この節自体はその主体を明示しない。訳文でも神学的含意を残しつつ、説明的な補足によって意味を限定しない。
- issue: γενεάの指示範囲
  choice: 「この時代の人々」
  alternative: 「この世代」または道徳的・神学的集団として限定する訳
  rationale: 同時代の人々という基本的な時間的・集団的指示を伝え、特定の民族、宗派、あるいは後代まで含む集団へ不必要に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、受難予告にふさわしい簡潔さと荘重さを保った。「人の子」は文脈上の指示対象を明示するために採用した。脚注は不要。
