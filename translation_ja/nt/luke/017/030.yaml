  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατὰ ⸂τὰ αὐτὰ⸃ ἔσται ᾗ ἡμέρᾳ ὁ υἱὸς τοῦ ἀνθρώπου ἀποκαλύπτεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: ja
  text: 人の子が現される日にも、同じことが起こります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その日にも同じようになります」。ギリシア語の表現は、直前に挙げられた例を振り返っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: 同じことが起こります
  rationale: 直前のノアとロトの例に見られる型が、人の子が現される日にも繰り返されることを示す慣用句。ἔσταιの未来の意味も自然な日本語で表した。
- source_word: ἔσται
  choice: 起こります
  rationale: εἰμίの未来形。κατὰ τὰ αὐτάと合わせ、終末の日に同じ有様になるという意味を自然に表す。
- source_word: ᾗ ἡμέρᾳ
  choice: 日にも
  rationale: 関係代名詞を伴う時間の与格で、「その日には」の意味。前例との対応を示すため、係助詞「も」を用いた。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの定着した呼称であり、ダニエル書7章との黙示的・メシア的な響きを保つ。
- source_word: ἀποκαλύπτεται
  choice: 現される
  rationale: 現在受動形の「覆いが除かれて明らかにされる」という意味と受動の形を保つ。「来る」として別の語義を持ち込まず、公に顕現する含意を表す。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουという終末論的称号
  choice: 人の子
  alternative: 人間である者
  rationale: 伝統的かつ定着した訳語で、ダニエル書7章との間テクスト的な結びつきと福音書における称号性を保つ。
- issue: 文脈におけるἀποκαλύπτεταιの意味
  choice: 現される
  alternative: 来る／現れる
  rationale: この動詞は単なる到来ではなく、隠れていたものが明らかにされることを表す。受動態を保ち、行為者を本文以上に特定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「人の子」「現される」によって原文の称号性と受動態を保持した。
