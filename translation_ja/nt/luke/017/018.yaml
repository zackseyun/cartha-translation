  text: Were none found to return and give glory to God except this foreigner?[a]
translation:
  language: ja
  text: 神に栄光を帰するために戻って来た者は、この外国人[a]のほかには、だれもいなかったのか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この異国の人」または「このよそ者」。ギリシア語は、イスラエルの民に属さない外国人、外部の者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρέθησαν
  choice: 者は……だれもいなかったのか
  rationale: 受動形を日本語で不自然に直訳せず、修辞疑問の存在表現として自然に訳しつつ、「見いだされなかった」という意味を保った。
- source_word: ὑποστρέψαντες
  choice: 戻って来た
  rationale: 話者のいる所へ引き返した動作を、文脈に即した自然な現代日本語で表した。
- source_word: δοῦναι δόξαν
  choice: 栄光を帰する
  rationale: 「栄光を与える」という原語の聖書的慣用を、日本語で定着した表現により保持した。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: 与格の対象を簡潔かつ自然に示した。
- source_word: εἰ μὴ
  choice: ……のほかには
  rationale: 唯一の例外を示す排他的構文を自然な日本語で表した。
- source_word: ἀλλογενής
  choice: 外国人
  rationale: イスラエルの民に属さない異民族の者という意味を、明瞭な現代語で示した。
- source_word: οὗτος
  choice: この
  rationale: 目の前の人物を強調する指示語の力を保持した。
theological_decisions:
- issue: 癒やされた人の民族的・宗教的な部外者性
  choice: この外国人
  alternative: この異邦人／このよそ者
  rationale: 文脈上のサマリア人がイスラエルに対する外部者であるという逆説を保ちつつ、「異邦人」に伴い得る専門的・神学的含意を過度に持ち込まない表現とした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の修辞疑問と「この外国人」という強調を保持し、聖書的慣用句「神に栄光を帰する」を用いた。
