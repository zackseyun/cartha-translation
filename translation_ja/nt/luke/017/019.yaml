  yaml_path: translation/nt/luke/017/019.yaml
  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: ja
  text: そして、その人に言った。「立って、行きなさい。あなたの信仰[a]が、あなたを救った[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼」とも訳せる。ギリシア語は「信仰」のほか、信頼や忠実さを表すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「癒やした」または「健康にした」とも訳せる。ギリシア語の動詞は、救出、癒やし、救いを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: その人に言った
  rationale: 三人称代名詞の指示対象を日本語で自然に示しつつ、「言った」で物語文の簡潔さを保つ。
- source_word: Ἀναστὰς
  choice: 立って
  rationale: 命令的な力を伴い、後続する命令と一続きになるアオリスト分詞。日本語では「立って」が簡潔で自然。
- source_word: πορεύου
  choice: 行きなさい
  rationale: 現在命令形の直接的な命令を、明瞭で品位ある現代日本語にする。
- source_word: πίστις
  choice: 信仰
  rationale: この文脈ではイエスに向けられた信頼を表すが、宗教的・神学的な広がりを保つため本文では「信仰」とする。「信頼」の可能性は脚注に残す。
- source_word: σέσωκέν
  choice: 救った
  rationale: σῴζωは救済と癒やしの双方を表し得る。十人がすでに清められたという文脈で、身体的回復だけに限定せず、ギリシア語の広がりを保つ。「救った」は完了形が示す成立した結果も自然に伝える。
- source_word: σε
  choice: あなたを
  rationale: 直接目的語を日本語で明示し、発言の個人的な向け先を保つ。
theological_decisions:
- issue: 癒やしの物語における σέσωκέν σε の意味
  choice: あなたを救った
  alternative: あなたを治した／あなたを元どおりにした
  rationale: σῴζωは身体的な癒やしにも救済にも用いられる。十人全員が清められた一方、神をあがめるために戻った一人にこの言葉が語られるため、本文ではより広い「救った」を採用し、癒やしの意味も脚注で明示して緊張関係を保つ。
- issue: πίστις の意味範囲
  choice: 信仰
  alternative: 信頼／真実さ
  rationale: ここではその人の信頼する応答が中心と考えられるが、πίστιςの宗教的含意を狭めないため「信仰」を本文に置く。「信頼」は有力な言い換えとして脚注に示し、「真実さ」は語義上可能でもこの文脈では可能性が低い。
translation_notes:
  register: 明瞭で簡潔な現代標準語。イエスの命令は「立って、行きなさい」として、口語に寄りすぎず、古風にもならない品位を保った。語順は日本語として自然にしながら、原文の三つの発話単位を維持した。
