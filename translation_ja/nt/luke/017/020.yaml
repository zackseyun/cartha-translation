id: LUK.17.20
reference: Luke 17:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: ja
  text: 神の国はいつ来るのかとファリサイ派の人々に尋ねられたイエスは、彼らに答えて言われた。「神の国は、人の目で観察できるような仕方で来るのではない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「観察を伴って」「目で観察できるような仕方で」「注意深く見張ることを伴って」。
    reason: παρατήρησιςには「観察」「注視」「注意深く見張ること」などの語義上の幅があるため。
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ
  choice: さて、…尋ねられた
  rationale: アオリスト受動分詞を状況節として自然に表し、δέの穏やかな場面転換を「さて」で示した。
- source_word: ὑπὸ τῶν Φαρισαίων
  choice: ファリサイ派の人々に
  rationale: 受動構文の行為者を明示し、現代日本語で分かりやすい名称とした。
- source_word: πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国はいつ来るのか
  rationale: πότεの時間的問いとἔρχεταιの到来の意味を簡潔に保った。
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: 彼らに答えて言われた
  rationale: 原文の二重動詞を、日本語として過度に不自然にならない形で保持した。
- source_word: Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国は…来るのではない
  rationale: 到来そのものではなく、後続句が示す到来の様態を否定する構文として表した。
- source_word: μετὰ παρατηρήσεως
  choice: 目に見えるしるしを伴って
  rationale: παρατήρησιςの「観察・注視できること」という幅を、文脈上の外面的に追跡可能なしるしとして明瞭に表した。語義の幅は脚注に残した。
theological_decisions:
- issue: 神の国の到来についての否定の範囲
  choice: 神の国は、目に見えるしるしを伴う仕方で来るのではない
  alternative: 神の国はいかなる意味でも観察できず、終末的なしるしも一切ない
  rationale: μετὰ παρατηρήσεωςは到来の様態を述べるため、あらゆる知覚や終末的なしるし全般を否定するところまで本文に読み込まず、節が持つ神学的緊張を保った。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「ファリサイ派の人々」は一般読者への分かりやすさを優先した。発言者の「イエス」はギリシア語本文では代名詞的に省略されているが、文脈上の主語を日本語で明確にするため補った。
