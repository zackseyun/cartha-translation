  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: ja
  text: イエスは答えて言われた。「十人は清められた[a]のではなかったか。では、九人はどこにいるのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「清くされた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: そこでイエスは言われた
  rationale: 「答えて言った」という逐語的な重複を避けつつ、分詞と定動詞から成る定型的な発話導入を自然な現代日本語で表した。δέの穏やかな叙事進行は「そこで」に込めた。
- source_word: Οὐχὶ οἱ δέκα
  choice: 十人は…のではなかったか
  rationale: οὐχίが肯定の答えを予期する修辞疑問であることを、「のではなかったか」で保持した。οἱ δέκαは文脈上すでに知られている十人を指す。
- source_word: ἐκαθαρίσθησαν
  choice: 清められた
  rationale: καθαρίζωの受動形を直接反映し、病からの回復だけでなく、重い皮膚病に伴う清浄の含意も残した。「癒やされた」だけに狭めなかった。
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: では、ほかの九人はどこにいるのか
  rationale: δέによる、戻って来た一人と残る九人との対比を「では」で示した。「ほかの」は日本語で指示対象を明確にするための文脈上の補足である。
theological_decisions:
- issue: 重い皮膚病の人々についてのκαθαρίζωの意味
  choice: 「清められた」
  alternative: 「癒やされた」「清くされた」
  rationale: 原語は単なる身体的治癒を表す語ではなく、清浄の回復も含み得るため、「清められた」としてその幅を保った。特定の教理的解釈は付加していない。
translation_notes:
  register: 明快で自然な現代標準日本語を用いながら、イエスの修辞疑問の厳粛さを保った。「言われた」により敬意を示しつつ、過度に古風な文体は避けた。
