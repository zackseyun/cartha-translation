id: LUK.17.4
reference: Luke 17:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: ja
  text: 一日のうちに七度あなたに罪を犯し、七度あなたのところに戻って来て、「悔い改めます」と言うなら、その人を赦しなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「戻って来て」は、「あなたのほうに向き直って」とも訳せる。原語には「戻る」と「向き直る」の両方の意味があり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑπτάκις τῆς ἡμέρας
  choice: 一日のうちに七度
  rationale: 一定の日の範囲内で七回という反復を、自然な現代日本語で明確に表す。
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: あなたに罪を犯し
  rationale: εἰς σέ はここでは、聞き手に対する罪・過ちを表す。「あなたに対して罪を犯し」より簡潔で自然。
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: あなたのところに戻って来て
  rationale: ἐπιστρέφω の「戻る」と「向き直る」の幅のうち、反復される違反後の再接近という文脈を自然に表す。
- source_word: Μετανοῶ
  choice: 悔い改めます
  rationale: 単なる後悔や謝罪ではなく、μετανοέω の倫理的・霊的な重みを保持する。直接話法に合う丁寧体とした。
- source_word: ἀφήσεις αὐτῷ
  choice: その人を赦しなさい
  rationale: 未来直説法がこの教示的文脈で持つ命令的な力を、日本語の明確な指示として表す。αὐτῷ は自然な日本語では目的語として訳す。
theological_decisions:
- issue: ἀφήσεις の未来形が持つ力
  choice: 命令として「赦しなさい」
  alternative: 予告として「赦すことになる」または義務を強調して「赦さなければならない」
  rationale: 文脈上は弟子への指示である。日本語では未来形を保ちながら命令性を自然に示すことが難しいため、命令形で機能を明示し、余分な義務表現は加えない。
- issue: Μετανοῶ の意味
  choice: 「悔い改めます」
  alternative: 「悪かったと思います」「考えを変えます」
  rationale: 単なる感情的な後悔や意見変更に弱めず、原語の倫理的な方向転換を保つ。
- issue: 赦しと悔い改めの発言との関係
  choice: 条件文をそのまま保持
  alternative: 発言の真実性や悔い改めの証拠について条件を補足する
  rationale: 本文は「悔い改めます」と言って戻る場合を述べるが、その真実性を判定する追加条件は明記しないため、解釈的要件を加えない。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。「赦す」は罪や過ちの赦免を示すため漢字表記とし、直接話法は自然な丁寧体にした。
