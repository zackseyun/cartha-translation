reference: Luke 17:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: ja
  text: 主は言われた。「もし、からし種のような信仰があなたがたにあるなら、この桑の木[a]に、『根こそぎにされて、海に植えられよ』と言うだろう。そして、それはあなたがたに従うだろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「桑の木」――ギリシア語συκάμινοςは、クワの一種を指す語。伝統的には「シカミノスの木」などと音写されることもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主
  rationale: ルカの物語におけるイエスの称号として、現代日本語の聖書文体で自然かつ尊厳のある「主」を用いた。
- source_word: πίστιν
  choice: 信仰
  rationale: ここでは神に向けられた信頼を表すが、語の神学的な広がりを保つため、定訳として「信仰」を用いた。
- source_word: ὡς κόκκον σινάπεως
  choice: からし種のような
  rationale: ὡςによる比較をそのまま示し、比較点を大きさだけに限定する「からし種ほどの」は避けた。
- source_word: συκαμίνῳ
  choice: 桑の木
  rationale: 語が指すと考えられるクワ類を、一般読者に明瞭な名称で訳した。厳密な樹種同定には幅があるため注記した。
- source_word: ἐλέγετε ἂν
  choice: 言うだろう
  rationale: 未完了過去とἄνが示す仮定的・潜在的な帰結を、日本語で自然な「だろう」によって表した。
- source_word: Ἐκριζώθητι
  choice: 根こそぎにされて
  rationale: 受動命令の形を保ちながら、根から抜かれるという像を明瞭にした。後続の命令と一続きになる日本語表現とした。
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: 海に植えられよ
  rationale: 原文の受動命令と、海に植えるという逆説的なイメージを解釈で弱めず保持した。
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: それはあなたがたに従うだろう
  rationale: 命令に応じる文脈なのでὑπακούωを「従う」とし、ἄνの仮定的帰結も「だろう」で表した。
theological_decisions:
- issue: 奇跡についての言葉におけるπίστιςの意味
  choice: 信仰
  alternative: 信頼／忠実さ
  rationale: 文脈上は不可能に見えることについて神を信頼することが前景化しているが、「信頼」と限定せず、πίστιςの神学的な広がりを保つ「信仰」とした。
- issue: 条件文の力
  choice: もし……あるなら……言うだろう
  alternative: もし……あったなら……言っただろう
  rationale: 前件のεἰ ἔχετεは現在形であり、弟子たちに信仰がないと断定する過去反実仮想に固定せず、後件のἄνが持つ仮定的・潜在的な響きを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「主は言われた」「植えられよ」によって聖書本文としての簡潔さと尊厳を保った。比喩の比較点と条件文の論理を過度に説明せず、原文の緊張と余白を残した。
