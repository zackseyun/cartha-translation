id: LUK.17.15
reference: Luke 17:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἷς δὲ ἐξ αὐτῶν, ἰδὼν ὅτι ἰάθη, ὑπέστρεψεν μετὰ φωνῆς μεγάλης δοξάζων τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: ja
  text: ところが、そのうちの一人は、自分が癒やされたのを見て、大声で神をあがめながら戻って来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: ところが、そのうちの一人は
  rationale: εἷς ἐξ αὐτῶνの部分を示す意味を「そのうちの一人」で表し、δέは、ほかの九人との対照が文脈上感じられるため、自然な逆接の「ところが」とした。
- source_word: ἰδὼν ὅτι ἰάθη
  choice: 自分が癒やされたのを見て
  rationale: ἰδὼνの分詞的な流れと、ἰάθηの受動態による治癒を簡潔に保った。「見て」は、本人が治ったことを認めたという原文の表現を保持する。
- source_word: ὑπέστρεψεν
  choice: 戻って来た
  rationale: 物語の中でイエスのもとへ引き返す動きを、現代日本語で自然に表す。
- source_word: μετὰ φωνῆς μεγάλης
  choice: 大声で
  rationale: 直訳的な「大きな声をもって」ではなく、声を上げる様子を自然で明確な日本語にした。
- source_word: δοξάζων τὸν θεόν
  choice: 神をあがめながら
  rationale: δοξάζωが表す、神に栄光を帰し、たたえる行為を、普通の現代日本語として明瞭な「あがめる」で表した。
theological_decisions:
- issue: δοξάζων τὸν θεόνの表現
  choice: 神をあがめながら
  alternative: 神を賛美しながら／神に栄光を帰しながら
  rationale: 「あがめる」は、賛美だけに狭めず、神に栄光を帰する意味も含み得る。原文以上の神学的説明は加えない。
- issue: τὸν θεόνの訳
  choice: 神
  alternative: なし
  rationale: 定冠詞を伴うθεόςを文脈に即して標準的に「神」と訳し、説明的な付加を避けた。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、物語文としての落ち着きと尊厳を保った。「癒やされた」は身体的治癒を明確に示し、「あがめながら」はδοξάζωνの付帯的・継続的な動作を反映する。
