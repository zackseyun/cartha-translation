id: LUK.17.31
reference: Luke 17:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: ja
  text: その日、屋上[a]にいる人は、家の中に自分の持ち物があっても、それを取り出すために下りてはならない。同じように、畑にいる人も引き返してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでいう「屋上」は、当時よく見られた、出入りして利用できる平らな屋根を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: その日
  rationale: 指示語の強調を保ちつつ、現代日本語の自然な時の表現とした。
- source_word: ἐπὶ τοῦ δώματος
  choice: 屋上
  rationale: δώμαは当時、出入りして利用できた家の平らな屋根を指す。「屋上」は本文として簡潔で自然であり、文化的背景は脚注で補う。
- source_word: τὰ σκεύη αὐτοῦ
  choice: 自分の持ち物
  rationale: σκεύηがここで表す家財や携行可能な所有物を、限定しすぎず自然に伝える。主語との対応を明確にするため「自分の」とした。
- source_word: μὴ καταβάτω ἆραι αὐτά
  choice: それを取り出すために下りてはならない
  rationale: 三人称命令の強い禁止を「てはならない」で表し、αἴρωの文脈上の意味を、家から持ち物を取り出すこととして自然に訳した。
- source_word: ὁ ἐν ἀγρῷ ὁμοίως
  choice: 同じように、畑にいる人も
  rationale: 前半との並行関係を明示し、代表的な人物を指す名詞化表現を自然な日本語にした。
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: 後ろのもののために引き返してはならない
  rationale: ἐπιστρέφωの「引き返す」を保ち、名詞的なτὰ ὀπίσωが背後に残したものを含意する点を訳文に残した。日本語として補足的な「のために」により、目的を自然に示した。
theological_decisions:
- issue: 終末的な切迫感を示す具体的な情景
  choice: 屋上から下りず、畑から引き返さないという具体的な禁止命令をそのまま保つ
  alternative: 所有物への執着を捨てるよう求める一般的な教訓として意訳する
  rationale: 本文は「その日」における切迫した行動を具体的に描いている。一般的な道徳訓へ置き換えず、情景と緊張感を保持する。
- issue: εἰς τὰ ὀπίσωの対象性
  choice: 「後ろのもののために」とし、背後に残された物を含む表現を保つ
  alternative: 単に「引き返してはならない」とする
  rationale: 単純な副詞表現へ平板化せず、複数中性冠詞を伴う表現の名詞的な力を反映する。ただし「後ろのもの」が具体的に何を指すかは限定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「その日」「てはならない」によって厳粛さと切迫感を保った。二つの禁止命令の並行性を自然な語順で示した。
