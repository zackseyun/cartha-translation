id: LUK.17.27
reference: Luke 17:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: ja
  text: 人々は、ノアが箱舟に入ったその日まで、食べたり飲んだり、妻を迎えたり嫁いだりしていた[a]。すると洪水が来て、彼らを皆滅ぼした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は結婚について二つの異なる動詞を用い、一方は能動形（「妻を迎える」）、もう一方は受動形（直訳「結婚に与えられる」）で表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: 食べたり飲んだりしていた
  rationale: 二つの未完了過去形が表す、日常的な営みの継続を「～していた」で示した。列挙を自然な現代日本語にするため「～たり」を用いた。
- source_word: ἐγάμουν
  choice: 妻を迎えたり
  rationale: 能動形の結婚動詞を、後続する受動形との違いが分かるように訳した。文脈上の代表的な表現を保ちつつ、単に二語を「結婚する」にまとめることを避けた。
- source_word: ἐγαμίζοντο
  choice: 嫁いだり
  rationale: 受動形が表す「結婚に与えられる」という方向性を、日本語で不必要に強制の含みを持たせず自然に表した。
- source_word: ἄχρι ἧς ἡμέρας
  choice: その日まで
  rationale: 継続していた日常の営みに時間的な終点を設ける表現として、明快で自然な日本語を選んだ。
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: ノアが箱舟に入った
  rationale: アオリストの完結した出来事を簡潔に示し、ノア物語における κιβωτός の定着した訳語「箱舟」を用いた。
- source_word: ὁ κατακλυσμός
  choice: 洪水
  rationale: 創世記への言及が明瞭に伝わる、現代日本語の標準的な訳語を採用した。
- source_word: ἀπώλεσεν πάντας
  choice: 彼らを皆滅ぼした
  rationale: πάντας が指す人々を「彼ら」で明示し、全体性を「皆」で保った。ἀπόλλυμι の裁きの文脈に即して「滅ぼした」とした。
theological_decisions:
- issue: 二つの結婚動詞を区別して訳すこと
  choice: 妻を迎えたり嫁いだりしていた
  alternative: 結婚していた
  rationale: 原文は能動的な ἐγάμουν と受動的な ἐγαμίζοντο を並べている。その違いを保つことで、裁きに至るまで通常の社会生活が続いていたという描写を、特定の教派的解釈を加えずに伝える。
- issue: 冒頭の動詞列のアスペクト
  choice: ～たりしていた
  alternative: 食べ、飲み、妻を迎え、嫁いだ
  rationale: 未完了過去形の反復によって描かれる継続的・習慣的な営みを示し、突然の洪水との対照を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「妻を迎える／嫁ぐ」は原文の能動・受動の対を見える形で保ちながら、「結婚させられる」が現代語で帯びやすい強制の含意を避けるために選んだ。語順は時間的な限界を先に置き、日本語として自然にした。
