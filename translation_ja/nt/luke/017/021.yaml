source:
  edition: SBLGNT
  text: οὐδὲ ἐροῦσιν· Ἰδοὺ ὧδε ἤ· ⸀Ἐκεῖ· ἰδοὺ γὰρ ἡ βασιλεία τοῦ θεοῦ ἐντὸς ὑμῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/021.yaml
  text: Nor will they say[a], ‘Look, here!’ or ‘There!’ For behold, the kingdom of God is in your midst.”
translation:
  language: ja
  text: また、『見よ、ここだ』、あるいは『あそこだ』と言うこともないでしょう。というのも、見よ、神の国はあなたがたのただ中にあるのです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の国はあなたがたの内にある」。ギリシア語の表現は、個々人の内面を指すとも、「あなたがたの間に／ただ中に」という共同体的な意味を表すとも解釈できます。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: また、…と言うこともありません
  rationale: 前節から続く否定を自然な現代日本語で示し、未来形の内容も文脈に即して表した。
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: 『見よ、ここだ』とか、『あそこだ』
  rationale: 場所を指し示す二つの表現の対照を簡潔に保った。最初のἸδοὺは注意を促す語として「見よ」とした。
- source_word: ἰδοὺ γὰρ
  choice: 見よ、
  rationale: γὰρの説明的関係は日本語では文の連続から明らかなため、硬い「なぜなら」を加えず、ἰδοὺの強調を「見よ」で保持した。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: 王的支配と終末的領域の両面を過度に限定しない、定着した透明な訳語を採用した。
- source_word: ἐντὸς ὑμῶν
  choice: あなたがたのただ中に
  rationale: 複数の聞き手を指すὑμῶνと、場所をめぐる直前の文脈を踏まえ、共同体的な「ただ中に」を本文に採用した。語句が持ち得る内面的な意味は脚注に残した。
- source_word: ἐστιν
  choice: あるのです
  rationale: 現在の存在を表す単純な繋辞を自然な日本語で表し、説明の調子も保った。
theological_decisions:
- issue: ἐντὸς ὑμῶνの意味
  choice: 神の国はあなたがたのただ中にある
  alternative: 神の国はあなたがたの内にある
  rationale: 複数の相手への発言であり、目に見える場所を指し示すことができないという直前の文脈から、「ただ中に」を本文で優先した。ただし、ἐντόςには内側を表す用法もあり、内面的な読みを語彙上排除できないため脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、二度のἰδοὺは簡潔で dignified な「見よ」で統一した。「なぜなら」は日本語では説明過剰になるため省き、文脈上の因果関係を自然な連続で示した。
