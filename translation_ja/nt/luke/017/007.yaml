  naturalness: 原案の「あなたがたのうち、…奴隷を持っている人で、…と言う人がいるでしょうか」は、主語となる「人」が重なり、ややもたつく。「奴隷を持つ者で…と言う者がいるでしょうか」とすることで、明快な現代標準日本語になる。
  terminology: 「奴隷」はこのたとえにおける主人への隷属関係を適切に示す。ποιμαίνονταには、動物種を原文以上に限定せず、「群れの世話をしている」を用いる。脚注aの「家内労働者」は屋外の耕作・牧畜も含む本節では狭すぎるため、「隷属身分の者」とする。
