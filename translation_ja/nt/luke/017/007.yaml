id: LUK.17.7
reference: Luke 17:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: ja
  text: ところで、あなたがたのうち、畑を耕しているか、群れの世話をしている奴隷[a]を持つ者で、その奴隷が畑から戻って来たときに、「すぐに来て、食卓に着きなさい[b]」と言う者がいるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「ドゥーロス」。文脈によっては「しもべ」「召使い」とも訳せるが、ここでは主人に属する隷属身分の者を指す。
    reason: alternative_reading
  - marker: b
    text: 直訳は「横になりなさい」。当時は食事の際、寝椅子などに身を横たえる習慣があった。
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: 奴隷
  rationale: 雇い人ではなく、主人の権威の下に置かれた隷属身分の家内労働者を指す。たとえの社会的な非対称性を保つため、「しもべ」より明確な「奴隷」とした。
- source_word: ἀροτριῶντα
  choice: 畑を耕す
  rationale: 鋤で耕す農作業を自然な現代日本語で表した。
- source_word: ποιμαίνοντα
  choice: 家畜の群れを飼う
  rationale: 羊に限定せず、群れを牧し世話する意味を保った。
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: 畑から帰って来たとき
  rationale: 分詞を時間的に取り、主人が語る前に野外の仕事から戻ったことを自然に示した。直前の農作業とのつながりから ἀγρός は「畑」とした。
- source_word: ἐρεῖ αὐτῷ
  choice: その奴隷が…と言う
  rationale: 日本語では代名詞の指示関係が曖昧になりやすいため、αὐτῷ の指示対象を「その奴隷」と明示し、未来形を修辞疑問に合う「言う人がいるでしょうか」で表した。
- source_word: Εὐθέως
  choice: すぐに
  rationale: 命令の即時性を簡潔で自然な表現によって保った。
- source_word: παρελθὼν
  choice: こちらへ来て
  rationale: ἀνάπεσε に伴う移動を表す付帯的な分詞として訳し、主人のいる食事の場へ来る意味を示した。
- source_word: ἀνάπεσε
  choice: 食卓に着きなさい
  rationale: 当時の食事姿勢を字義どおり「横になりなさい」とすると現代日本語では休息の意味に誤解されるため、食事の席に就く機能的意味を本文に置き、歴史的背景は脚注で示した。
theological_decisions:
- issue: たとえの家内労働者を表す δοῦλος の訳語
  choice: 奴隷
  alternative: しもべ／召使い
  rationale: 主人と労働者の非対称な法的・社会的関係がこのたとえの論旨に関わるため、「奴隷」とした。ただし、この語の意味範囲と日本語での受け止め方を踏まえ、代案を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用い、修辞疑問の形を保った。会食姿勢は本文で機能的に訳し、古代の習慣を脚注で補った。「奴隷」は歴史的関係を曖昧にしない語として採用した。
