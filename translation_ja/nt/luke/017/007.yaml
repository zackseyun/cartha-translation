  to: ところで、あなたがたのうち、畑を耕しているか、群れの世話をしている奴隷[a]を持つ者で、その奴隷が畑から戻って来たときに、「すぐに来て、食卓に着きなさい[b]」と言う者がいるでしょうか。
  rationale: 原文の「耕す、または牧する」という選択関係を「畑を耕しているか、群れの世話をしている」と明瞭にした。修辞疑問の構文を自然に整えたほか、脚注の説明が屋内労働に限定されないように修正した。食事時の古代的な横臥については、本文の自然さを保つため「食卓に着きなさい」とし、脚注で補った。
