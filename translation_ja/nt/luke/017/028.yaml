  text: ὁμοίως ⸀καθὼς ἐγένετο ἐν ταῖς ἡμέραις Λώτ· ἤσθιον, ἔπινον, ἠγόραζον, ἐπώλουν, ἐφύτευον, ᾠκοδόμουν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: ja
  text: ロトの時代にも同じようなことがありました。人々は食べたり飲んだり、買ったり売ったり、植えたり建てたりしていました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως καθὼς ἐγένετο
  choice: 同じようなことがありました
  rationale: ὁμοίωςとκαθὼςが担う先行例との比較を自然な現代日本語で表し、ἐγένετοの出来事を示す意味も含めた。日本語では「同様に、ちょうど…」と重ねるより明瞭である。
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: ロトの時代にも
  rationale: 「ロトの日々」ではなく、人物に結び付く期間を表す自然な日本語とした。「にも」により直前のノアの例との対応を示した。
- source_word: ἤσθιον, ἔπινον
  choice: 食べたり飲んだり
  rationale: 未完了過去が描く継続的・習慣的な日常行為を、「たり」と文末の「していました」で自然に表した。
- source_word: ἠγόραζον, ἐπώλουν
  choice: 買ったり売ったり
  rationale: 対をなす通常の商取引を簡潔に表し、列挙のリズムを保った。
- source_word: ἐφύτευον, ᾠκοδόμουν
  choice: 植えたり建てたりしていました
  rationale: 両語を比喩化せず、農耕と建設という通常の営みとして訳した。文末の継続形により列挙された全動詞の未完了相を表現した。
theological_decisions: []
translation_notes:
  register: 明快で格調を損なわない現代標準日本語。直訳的な比較表現の重複を避けつつ、直前のノアの時代との対応と、日常生活が続いていたという未完了過去の背景描写を保持した。
