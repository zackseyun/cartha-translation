  source_fidelity: 「ロトの時代にも同じようなことがありました」は、ὁμοίως・καθὼςによる前節との比較と、ἐγένετοの歴史的な状況提示を自然に表している。「人々は…していました」は、六つの未完了過去が示す継続的・習慣的な日常活動を適切に反映する。買う／売る、植える／建てるの列挙にも漏れや比喩化はない。
  naturalness: 明快な現代標準日本語であり、列挙も「たり…していました」によって滑らかに読める。「ロトの時代にも」は前節のノアとの対照・並行を文脈に即して自然に示している。
  terminology: 固有名詞「ロト」は日本語聖書で定着した形である。「時代」「食べる」「飲む」「買う」「売る」「植える」「建てる」はいずれもこの文脈に適した平明な語であり、神学的用語上の問題はない。
