id: LUK.17.10
reference: Luke 17:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: ja
  text: 同じように、あなたがたも、命じられたことをすべて行ったときには、こう言いなさい。『私たちは役に立たない奴隷です。[a] 私たちは、する義務のあることをしたのです。』[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「無益な奴隷」とも訳せる。ギリシア語は「役に立たない」「利益をもたらさない」の意を持ち、この文脈では、義務を果たしても報いを要求できる功績はない、という含意がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「私たちは、しなければならなかったことをしたのです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: 同じように、あなたがたも
  rationale: 直前の主人と奴隷のたとえを弟子たちに当てはめるつながりを、自然な日本語で明示する。
- source_word: ὅταν ποιήσητε
  choice: 行ったときには
  rationale: ὅτανとアオリスト接続法が表す、行為の完了を前提とした一般的・将来的な時を簡潔に表す。
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: 命じられたことをすべて
  rationale: διατάσσωの権威ある命令という意味を保ち、受動構文も明瞭に再現する。
- source_word: λέγετε
  choice: こう言いなさい
  rationale: 命令法を明示し、「こう」を補って後続する直接話法へ自然につなぐ。
- source_word: Δοῦλοι
  choice: 奴隷
  rationale: 直前から続く主人と奴隷の社会的関係が論旨に重要であるため、より弱い「しもべ」ではなく拘束された身分を明確にする。
- source_word: ἀχρεῖοί
  choice: 何の益ももたらさない
  rationale: 語の基本的な「有用でない、利益を生まない」という含みを保ちつつ、人格的に無価値だと断定する日本語を避ける。文脈上、義務を果たしても主人に余分な利益や功績上の請求をもたらさない、という緊張を残す。
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: すべきこと
  rationale: ὀφείλωが示す義務・負い目を、現代日本語で簡潔かつ自然に表す。
- source_word: πεποιήκαμεν
  choice: したにすぎません
  rationale: 完了した行為を表すとともに、義務以上の功績を主張しない発言の限定的な力を自然な日本語で伝える。
theological_decisions:
- issue: 弟子へのたとえにおけるδοῦλοιの訳語
  choice: 奴隷
  alternative: しもべ／僕
  rationale: この箇所では主人に命じられ、義務を果たす者という身分関係がたとえの力を担う。「奴隷」は現代の読者にもその非対称性を明確に伝える。
- issue: ἀχρεῖοιが示す自己評価
  choice: 何の益ももたらさない
  alternative: 取るに足りない／役に立たない／値打ちのない
  rationale: この語が持つ「無益・無用」と「報酬を請求できる余分な功績がない」という文脈的含意の両方を保つ。弟子の人格的価値そのものを否定する解釈には限定しない。
- issue: 義務の履行と功績の関係
  choice: すべきことをしたにすぎません
  alternative: する義務のあることをしました
  rationale: ὀφείλωの義務性を保ちつつ、従順が主人を負債者にする余剰の功績ではないというたとえの要点を表す。ただし救済論上の体系へ拡張して本文以上を言わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「奴隷」は歴史的・社会的な厳しさを薄めず、「何の益ももたらさない」には脚注を付して語義の幅と解釈上の緊張を示した。発話内は丁寧体とし、弟子たちが口にする告白として自然に整えた。
