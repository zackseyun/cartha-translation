  to: 同じように、あなたがたも、命じられたことをすべて行ったときには、こう言いなさい。『私たちは役に立たない奴隷です。[a] 私たちは、する義務のあることをしたのです。』[b]
  rationale: 結びの文を「私たちは、する義務のあることをしたのです」として、ὃ ὠφείλομεν ποιῆσαι πεποιήκαμενの義務性と完了した行為を直接反映させた。「にすぎない」という解釈的な限定は本文から外した。ἀχρεῖοιは自然な「役に立たない」とし、無益・無報酬請求の含意は脚注で示した。
