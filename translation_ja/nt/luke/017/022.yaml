id: LUK.17.22
reference: Luke 17:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: ja
  text: それから、イエスは弟子たちに言われた。「あなたがたが、人の子の日々のうち一日を見たいと切に願う日々が来ます。しかし、あなたがたはその一日を見ることができません。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人の子の日々」は、イエスが地上で活動された時を指すとも、より具体的には、人の子が将来現れる時を指すとも考えられます。ギリシア語の表現は、その範囲を一つに限定していません。
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: それから、イエスは……言われた
  rationale: δέは弱い接続として話の展開を示す。「それから」で自然につなぎ、日本語では主語を補って話者を明確にした。
- source_word: πρὸς τοὺς μαθητάς
  choice: 弟子たちに
  rationale: 原文に所有代名詞はないため、「自分の弟子たち」とは限定せず、冠詞付き複数形を自然な日本語で表した。
- source_word: Ἐλεύσονται ἡμέραι
  choice: 日が来ます
  rationale: 将来のある時期の到来を告げる預言的な定型表現。日本語では単数形の「日が来る」が複数日に及ぶ時期をも自然に表せる。
- source_word: ἐπιθυμήσετε
  choice: 切に願いながら
  rationale: 強い願望を表す語なので「切に願う」とした。後続の否定との緊張を自然に示すため接続形を用いた。
- source_word: μίαν τῶν ἡμερῶν
  choice: 日々の一日
  rationale: 部分属格を保ち、複数の「日々」のうち一日という原文の表現を明示した。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの称号として定着した訳語を用い、ダニエル書を背景とする神学的含意を保持した。
- source_word: ἰδεῖν καὶ οὐκ ὄψεσθε
  choice: 見たいと……それを見ることができない
  rationale: 同根の視覚表現を「見る」でそろえた。οὐκ ὄψεσθεは直訳すれば「見ない」だが、文脈上は願っても見られないことを示すため、自然な日本語で「見ることができない」とした。
theological_decisions:
- issue: 「人の子の日々」の範囲
  choice: 「人の子の日々」と字義的に訳し、指示範囲を限定しない
  alternative: イエスが地上で弟子たちと共にいた日々、または将来の顕現・裁きの日々のいずれかに限定する
  rationale: 周辺文脈には終末的な響きがある一方、この句自体は地上での臨在への回顧も将来の顕現への待望も排除しない。訳文ではその緊張と開放性を保存した。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、イエスの発言にふさわしい端正な敬体とした。「人の子」は聖書的称号として保持し、「日々の一日」というやや特徴的な表現も原文の部分関係を伝えるため残した。
