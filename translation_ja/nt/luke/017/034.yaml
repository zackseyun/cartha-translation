source:
  edition: SBLGNT
  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: ja
  text: あなたがたに言います。その夜、一つの寝床に二人がいて、一人は連れて行かれ[a]、もう一人は残される[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「連れ去られる」。παραλημφθήσεταιという動詞だけでは、ここで連れて行かれることが救いのためか、裁きのためかは特定されていない。
    reason: lexical_alternative
  - marker: b
    text: 別訳「後に残される」。本文では、ギリシア語に明示されていない後世の終末論的連想を持ち込まないよう、簡潔に「残される」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: あなたがたに言っておく
  rationale: 直接的で強調を伴う定型表現。現代日本語として自然でありながら、聞き手への明確な呼びかけを保つ。
- source_word: ταύτῃ τῇ νυκτί
  choice: その夜
  rationale: 特定の、すでに視野に入っている夜を指す時間表現として自然に訳した。
- source_word: ἔσονται δύο ἐπὶ κλίνης μιᾶς
  choice: 一つの寝床に二人がいて
  rationale: κλίνηは寝床または長椅子を表し得るが、夜という文脈では「寝床」が自然。「二人がいて」は未来の場面描写を日本語らしく表す。
- source_word: παραλημφθήσεται
  choice: 連れて行かれ
  rationale: παραλαμβάνωの「自分と共に連れて行く」という意味を簡潔に表す。この動詞だけでは、救いのためか裁きのためかは特定されない。
- source_word: ἀφεθήσεται
  choice: 残される
  rationale: ここではπαραλημφθήσεταιとの対比から「赦される」ではなく「その場に残される」の意。「取り残される」より中立的で、後世の終末論的連想を本文に持ち込まない。
theological_decisions:
- issue: 連れて行かれる者と残される者のどちらが救いまたは裁きを受けるのか
  choice: 本文では「一人は連れて行かれ、もう一人は残される」とし、どちらの行為が救いまたは裁きを意味するかを特定しない。
  alternative: 連れて行かれる者を救われる者、または裁かれる者と明示する。
  rationale: この節のギリシア語の二つの動詞だけでは、いずれの終末論的解釈も確定しないため、原文の緊張と曖昧さを保った。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔ながら品位のある語調とした。「寝床」は夜の場面に適した日常的な語であり、「連れて行かれ／残される」は対句を保ちつつ解釈を限定しない。
