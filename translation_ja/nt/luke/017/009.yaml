  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: ja
  text: 命じられたことをしたので、主人は奴隷に感謝するだろうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」は「しもべ」とも訳せる（ギリシア語ドゥーロス）。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: 感謝するでしょうか
  rationale: μήを伴う直説法の疑問は否定の答えを予期する。日本語では文脈上「いや、しない」が明らかな修辞疑問として自然に表した。
- source_word: ἔχει χάριν
  choice: 感謝する
  rationale: ἔχειν χάριν τινίは、この文脈では相手に感謝することを意味する慣用表現である。
- source_word: τῷ δούλῳ
  choice: その奴隷に
  rationale: 主人の命令下にあり、務めを果たすことを義務づけられた身分が論旨に関わるため、社会的な非対称性を保つ「奴隷」とした。定冠詞は文脈上既知の人物を示す「その」で表した。
- source_word: ὅτι
  choice: からといって
  rationale: 感謝する理由として想定された事柄を導く。修辞疑問に自然につながり、「それだけを理由に」という含みも文脈に即して表せる。
- source_word: ἐποίησεν
  choice: した
  rationale: 命令された事柄を実行したことを表す、簡潔で自然な訳語である。
- source_word: τὰ διαταχθέντα
  choice: 命じられたこと
  rationale: 冠詞付き完了受動分詞の実体詞的用法を、受動の意味を保ちながら自然な日本語で表した。
theological_decisions:
- issue: たとえの主人―奴隷関係における δοῦλος の訳
  choice: 奴隷
  alternative: しもべ／僕
  rationale: この節の論理は、命令に従うことが義務である従属的身分を前提とする。「奴隷」は当時の社会関係とたとえの厳しい非対称性を弱めずに伝える。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、修辞疑問の端正さを保った。「からといって」によって理由節を自然に接続し、否定の答えが予期される語調を表した。
