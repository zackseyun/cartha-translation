source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: ja
  text: その人は、これらの小さい者の一人をつまずかせる[b]よりも、ひき臼[a]を首に掛けられて海に投げ込まれるほうがましである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大きなひき臼」とも訳せる。このギリシア語表現は、製粉に用いる重いひき臼を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「罪に陥らせる」とも訳せる。「つまずかせる」に当たるギリシア語には、人を罪や霊的な破滅へ陥らせるという意味が含まれる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ αὐτῷ
  choice: その人は……ほうがましである
  rationale: 直訳的な「その人にとって益である」よりも、二つの結果を比較して前者を選ぶべきだという強い比較を、自然な現代日本語で表す。
- source_word: λίθος μυλικὸς
  choice: ひき臼の石
  rationale: 臼を回して穀物をひくための石を明確に示す表現。「臼石」より一般読者に意味が伝わりやすく、石の大きさについては本文で限定せず脚注に置く。
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: 首にかけられて
  rationale: 首の周囲に置かれた状態を表す受動表現として自然であり、後続の「投げ込まれる」とも滑らかに対応する。
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: 海に投げ込まれる
  rationale: 完了受動形が示す、投げ入れられた結果を保ちつつ、比較構文に合う自然な日本語にする。
- source_word: σκανδαλίσῃ
  choice: つまずかせる
  rationale: 罪や霊的破滅に陥らせるという含みを持つ比喩を保持する。より説明的な意味は脚注で補う。
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: これらの小さい者の一人
  rationale: 年齢や弟子・信者という身分に限定せず、原文の指示表現と曖昧さを保つ。
- source_word: ἢ ἵνα
  choice: ……よりも、……ほうが
  rationale: 二つの結果を比較する構造を、自然で明瞭な日本語の比較構文として表す。
theological_decisions:
- issue: 「これらの小さい者」が指す対象
  choice: 「これらの小さい者」とし、対象を限定しない
  alternative: 「これらの子どもたち」または「これらの弱い信者たち」
  rationale: 原文は年齢や信仰共同体であることを明示していないため、特定の解釈に狭めず、解釈上の幅を残す。
- issue: σκανδαλίζωの霊的・倫理的含意
  choice: 本文では比喩的な「つまずかせる」を用い、脚注で罪に陥らせる意味を示す
  alternative: 本文で「罪に陥らせる」と説明的に訳す
  rationale: 原文の比喩を保持しながら、現代の読者が単なる不快感や失敗と誤解しないよう脚注で意味領域を補う。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ほうがましである」によって警告の強さを表し、「小さい者」は解釈上の幅を保つためあえて一般的にした。すべての脚注記号を本文中に配置した。
