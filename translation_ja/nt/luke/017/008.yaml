id: LUK.17.8
reference: Luke 17:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: ja
  text: むしろ、彼にこう言うのではないでしょうか。『私が食べるものを用意し、身支度をして[a]、私が食べて飲み終わるまで[b]給仕しなさい。その後で、あなたは食べたり飲んだりするのです。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「帯を締めて」。長い衣を帯でまとめ、仕事に取りかかれるようにすることを指します。
    reason: cultural_note
  - marker: b
    text: 別訳「私が食べ、飲むまで」。ここでは、主人が飲食を終えるまでという意味を表しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: むしろ、……のではないでしょうか
  rationale: 直前の想定と対照をなし、肯定の答えを予期する修辞疑問であることを自然な現代日本語で示す。
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: 私の夕食を用意し
  rationale: τί δειπνήσωは直訳的には「私が夕食として食べるもの」。文脈上は「私の夕食」が簡潔で自然であり、食事の種類を不必要に具体化しない。
- source_word: περιζωσάμενος
  choice: 身支度をして
  rationale: 衣を帯で締めて仕事に備える動作を指す。本文では意味が伝わる表現を用い、具体的な古代の所作は脚注で示す。
- source_word: διακόνει μοι
  choice: 私に……給仕しなさい
  rationale: ここでは食卓で仕えることを表すため、「仕えなさい」より場面に即した「給仕しなさい」とした。
- source_word: ἕως φάγω καὶ πίω
  choice: 私が食べて飲み終わるまで
  rationale: ἕωςに続くアオリスト接続法が示す終点、すなわち主人の飲食が済むまでという意味を明確にする。
- source_word: μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ
  choice: その後で、あなたが食べたり飲んだりしなさい
  rationale: 未来形はこの直接話法の中で、主人の食事後に僕の番が来ることを示す。明示されたσύの対照的強調を「あなたが」で保持する。日本語では命令の連続として自然になるよう「しなさい」とした。
theological_decisions:
- issue: この節における社会的身分を表す名詞
  choice: 本文に「僕」「奴隷」などの名詞を補わず、代名詞と命令の関係をそのまま訳す
  alternative: 前後の文脈に基づき「その僕に」と補う
  rationale: この節自体にはδοῦλοςがなく、αὐτῷのみで受けている。文脈上の主従関係は命令内容から十分伝わるため、原文にない名詞を挿入しない。
- issue: 未来形 φάγεσαι καὶ πίεσαι の発話上の力
  choice: 「食べたり飲んだりしなさい」
  alternative: 「食べたり飲んだりすることになる」または「食べたり飲んだりできる」
  rationale: 形態上は未来形だが、命令の続く主人の発話では、後に許される行為を指示する語用論的な力がある。許可の意味を強く限定せず、自然な日本語の直接話法とした。
translation_notes:
  register: 明瞭で品位ある現代標準語。修辞疑問は丁寧な「のではないでしょうか」で表し、引用内では主人から従者への命令として「しなさい」を用いた。「給仕」は食卓の場面を明確にしつつ、宗教用語的な響きを避ける。
