lexical_decisions:
- source_word: μνημονεύετε
  choice: 思い出しなさい
  rationale: 現在能動命令法二人称複数。文脈上、過去の出来事を単に想起するだけでなく、警告として心に留めるよう促す直接的な命令である。「思い出しなさい」は簡潔で自然な現代日本語としてその力を保つ。
- source_word: τῆς γυναικὸς
  choice: 妻
  rationale: γυνή は「女」または「妻」を意味し得るが、固有名Λώτに属格で結び付くここでは配偶関係を表す。「ロトの妻」が自然で明確である。
- source_word: Λώτ
  choice: ロト
  rationale: 日本語聖書で定着している標準的な音写を用いた。
theological_decisions:
- issue: 警告としての簡潔な創世記への言及
  choice: ロトの妻のことを思い出しなさい。
  alternative: ロトの妻を覚えていなさい。
  rationale: 原文の短い命令形と、創世記19章26節を踏まえた警告の鋭さを保った。「のことを」を補うことで、人物そのものではなく、その身に起きたことを教訓として想起するという日本語の自然な意味を表す一方、具体的な解釈を本文に付け加えてはいない。
translation_notes:
  register: 簡潔で直接的な命令として訳し、現代の一般読者に自然でありながら、イエスの警告としての厳粛さを保った。二人称複数は日本語では明示せず、文脈に委ねた。
