  text: Remember Lot's wife[a][b].
translation:
  language: ja
  text: ロトの妻を思い出しなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 創世記19章26節参照。ソドムが滅ぼされた時、ロトの妻は後ろを振り返った。
