  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: ja
  text: 使徒たちは主に言った。「私たちの信仰[b]を増してください[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私たちに信仰を加えてください」。ギリシア語の動詞は字義的には「加える」だが、ここでは「増す」という意味で用いられている。
    reason: lexical_alternative
  - marker: b
    text: 「信仰」は「信頼」とも理解できる。この名詞は文脈によって「忠実さ」を意味することもあるが、ここではその可能性は低い。
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: （文脈上、日本語では独立した接続語を置かない）
  rationale: 単純な物語上の連結を表すが、日本語では「そして」を明示しなくても自然に前後がつながる。時間的な意味は付け加えない。
- source_word: εἶπαν
  choice: 言った
  rationale: アオリスト直説法を、物語の単純過去として簡潔に表した。
- source_word: οἱ ἀπόστολοι
  choice: 使徒たち
  rationale: ルカ文書でイエスから遣わされた者たちを指す定着した訳語であり、複数も明示する。
- source_word: τῷ κυρίῳ
  choice: 主に
  rationale: κύριοςの敬称としての意味と、ルカにおけるキリスト論的な響きの双方を保つ。
- source_word: Πρόσθες
  choice: 増してください
  rationale: 動詞の字義は「加える」だが、信仰の量についての願いとしては「増す」が明瞭で自然である。字義的な表現は脚注に残す。
- source_word: ἡμῖν
  choice: 私たちの
  rationale: 字義的には「私たちに」だが、日本語では「私たちの信仰を増す」とすることで同じ関係を自然に表せる。
- source_word: πίστιν
  choice: 信仰
  rationale: この文脈では神への信頼を含む「信仰」が最も適切である。語の意味範囲は脚注で示す。
theological_decisions:
- issue: イエスを指すκύριοςの訳
  choice: 主
  alternative: 主人
  rationale: 単なる社会的な主人という以上の敬称およびキリスト論的含意を保ちつつ、原文がどちらか一面だけに限定していない点も維持する。
- issue: πίστιςの意味
  choice: 信仰
  alternative: 信頼、忠実さ
  rationale: 使徒たちが増加を願っている対象としては「信仰」、すなわち信頼が最も自然である。「忠実さ」も語義上は可能だが、この箇所では可能性が低いため脚注に留める。
translation_notes:
  register: 明瞭で自然な現代標準語を用いた。「増し加えてください」のような教会語的表現を避け、「増してください」と簡潔にした。発話は丁寧な願いとして訳し、主への敬意を表した。
