  text: καὶ εἰσερχομένου αὐτοῦ εἴς τινα κώμην ⸀ἀπήντησαν δέκα λεπροὶ ἄνδρες, οἳ ⸀ἔστησαν πόρρωθεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: ja
  text: イエスがある村に入って行かれるとき、皮膚病を患う十人の男たち[a]がイエスに出会い、遠く離れた所に立っていた、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は、現代医学の特定の病名に限定されない、古代の広い皮膚疾患の区分を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: イエスが…入ろうとしておられたとき
  rationale: 属格独立構文の現在分詞が示す同時進行の動作を自然な日本語で表した。文脈上の指示対象を明確にするため、代名詞は「イエス」とした。
- source_word: εἴς τινα κώμην
  choice: ある村に
  rationale: 不定代名詞 τινα の不特定ながら具体的な含みを、自然な現代日本語の「ある」で表した。
- source_word: ἀπήντησαν
  choice: 迎え
  rationale: ἀπαντάω は「会う」のほか「迎えに出る」を意味し得る。ここでは彼らが離れた場所に立って呼びかける続く場面に自然につながる表現とした。
- source_word: δέκα λεπροὶ ἄνδρες
  choice: 重い皮膚病のある十人の男
  rationale: λεπρός は古代の広い皮膚疾患カテゴリーであり、現代医学上のハンセン病に限定しない。人を病名そのものとして呼ばない、明瞭で自然な表現を選んだ。
- source_word: οἳ ἔστησαν πόρρωθεν
  choice: 遠く離れた所に立って
  rationale: 関係節を日本語では連用形でつなぎ、ἔστησαν の「立った／立っていた」と πόρρωθεν の距離的隔たりを簡潔に保持した。
theological_decisions:
- issue: λεπροί が指す病気の範囲
  choice: 重い皮膚病のある
  alternative: らい病の／ハンセン病の
  rationale: 聖書時代の λεπρός は現代医学の特定疾患と一対一に対応しないため、医学的に過度な限定を避けた。
- issue: ἀπήντησαν の動作
  choice: 迎え
  alternative: 出会い
  rationale: 語は単なる遭遇にも、会うために出て行くことにも解せる。文脈に合う自然な日本語として「迎え」を採ったが、彼らがどの程度移動したかまでは明示していない。
translation_notes:
  register: 明瞭な現代標準日本語。敬体ではなく聖書本文に適した簡潔で dignified な常体とし、イエスへの敬意は補助動詞「おられた」で示した。節末は原文および提示された英語本文が次節へ続く構造であるため読点とした。
