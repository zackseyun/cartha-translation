reference: Luke 17:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: ja
  text: さて、イエスは弟子たちに言われた。「人をつまずかせるもの[a]が生じないことはありえない。だが、それをもたらす者には災いがある。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「つまずきとなるもの」。ギリシア語σκάνδαλαは、人を道徳的・霊的につまずかせ、罪や破滅へ導く罠、誘惑、障害などを指しうる。
    reason: 原語の比喩と意味範囲を示し、「人をつまずかせるもの」という本文訳が一つの意味だけに限定されないことを明確にするため。
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: さて、イエスは……言われた
  rationale: δέは軽い接続を表すため、強い対比を加えず、自然な話題の進行を示す「さて」とした。日本語では主語を補い、「イエス」を明示した。
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: 弟子たちに
  rationale: μαθηταίを標準的な「弟子たち」と訳した。文脈上イエスの弟子であることは明白であり、日本語では所有表現を重ねずともαὐτοῦの関係が伝わる。
- source_word: Ἀνένδεκτόν ἐστιν
  choice: ありえない
  rationale: 不可能であることを表す語の強さを、明瞭で現代的な日本語で保持した。
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: 人をつまずかせるものが現れないということ
  rationale: 否定辞を伴う冠詞付き不定詞が「起こらないこと」の不可能性を述べる構造を保った。「現れる」は、日本語で出来事や要因が生じることを自然に表す。
- source_word: σκάνδαλα
  choice: 人をつまずかせるもの
  rationale: 罠やつまずきの原因という比喩を残しつつ、道徳的・霊的に人を倒れさせる意味が現代の読者に伝わるようにした。意味を単なる不快感や特定の誘惑だけに狭めていない。
- source_word: πλὴν οὐαὶ
  choice: だが、……には災いがある
  rationale: 避けがたい現実の表明から、その媒介者への厳しい警告へ転じる逆接を表した。「災いがある」はοὐαίの宣告的な響きを保つ。
- source_word: δι’ οὗ ἔρχεται
  choice: それをもたらす者
  rationale: διάの媒介・関与の意味と、男性単数の代表的な人物指示を自然な日本語で表した。直接的な意図や責任の程度を本文以上に限定していない。
theological_decisions:
- issue: σκάνδαλαの倫理的・霊的意味
  choice: 本文では「人をつまずかせるもの」とした。
  alternative: 「罪への誘惑」「罪を犯させるもの」「妨げ」「つまずき」
  rationale: 原語は、人を罪や破滅へ導く罠、誘惑、障害などを幅広く含みうる。比喩と意味の広がりを保ち、単なる感情的な気分の害や、一種類の誘惑に限定しない。
- issue: 避けがたさと責任の緊張
  choice: つまずかせるものが現れないことは「ありえない」が、それをもたらす者には「災いがある」とした。
  alternative: 避けがたい出来事であることを理由に、媒介者の責任を弱める訳
  rationale: 原文は、つまずきの不可避性と、それをもたらす者への災いの宣告を並置している。この神学的・倫理的緊張を解消せず、そのまま保った。
- issue: δι’ οὗの人物表現
  choice: 「者」として代表的単数を保った。
  alternative: 「その人」「彼」
  rationale: 特定の性別を不必要に前面へ出さず、人を指す単数形として原文の警告の個別性を伝える。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの警告にふさわしい簡潔で厳粛な調子を保った。「災いがある」は聖書的な宣告の重みを残しつつ、一般の読者にも理解できる表現である。
