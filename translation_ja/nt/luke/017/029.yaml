id: LUK.17.29
reference: Luke 17:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: ja
  text: しかし、ロトがソドムを出たその日、天から火と硫黄が降り、すべての人を滅ぼした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: しかし、…その日
  rationale: 時間を表す関係節を自然な日本語にし、δέによる前節との穏やかな対比も保った。
- source_word: ἐξῆλθεν
  choice: 出た
  rationale: 具体的な移動を表す基本義を簡潔に伝える。
- source_word: Λὼτ
  choice: ロト
  rationale: 日本語聖書で定着している人名表記。
- source_word: ἀπὸ Σοδόμων
  choice: ソドムを
  rationale: 「出る」と組み合わせた自然な日本語で、起点を示すἀπόの意味を表す。地名は日本語で定着した単数形とした。
- source_word: ἔβρεξεν
  choice: 降り
  rationale: 火と硫黄が天から降ったという非人称的な表現を、主語を補わず自然に再現した。
- source_word: πῦρ καὶ θεῖον
  choice: 火と硫黄
  rationale: θεῖονの通常の意味を現代日本語で明瞭に表し、古風な言い回しを避けた。
- source_word: ἀπ’ οὐρανοῦ
  choice: 天から
  rationale: 創世記への言及を保つ聖書的かつ自然な表現であり、「空」よりも文脈に適する。
- source_word: ἀπώλεσεν πάντας
  choice: すべての人を滅ぼした
  rationale: πάνταςの暗黙の人的対象を日本語で明示し、ἀπόλλυμιの強い意味を「滅ぼした」で伝えた。
theological_decisions:
- issue: 裁きの文脈におけるθεῖονの訳
  choice: 硫黄
  alternative: 硫黄の火／燃える硫黄
  rationale: 原語は物質としての硫黄を指すため、解釈的な語を加えず直接的に訳した。火は別にπῦρとして明記されている。
- issue: οὐρανόςの訳
  choice: 天
  alternative: 空
  rationale: 創世記19章の背景と聖書的表現を保ちつつ、裁きの主体について原文以上の説明を加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、裁きの厳粛さにふさわしい簡潔で格調ある文体とした。「その日」によって出来事の即時性を自然に示した。
