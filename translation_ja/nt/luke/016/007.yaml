source:
  edition: SBLGNT
  text: ἔπειτα ἑτέρῳ εἶπεν· Σὺ δὲ πόσον ὀφείλεις; ὁ δὲ εἶπεν· Ἑκατὸν κόρους σίτου· ⸀λέγει αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ γράψον ὀγδοήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/007.yaml
  text: Then he said to another[a], ‘And you, how much do you owe?’ He said, ‘A hundred cors of wheat.’ He says to him[b], ‘Take your bill and write eighty.’
translation:
  language: ja
  text: それから、別の者に言った。「あなたはどれだけ借りがあるのか。」その人は、「小麦百コル[a]です」と答えた。管理人は彼に言う。「あなたの借りの証文[b]を取って、八十と書きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: コルは、穀物を量るために用いられた大きな容量の単位。
    reason: cultural_note
  - marker: b
    text: 直訳「書かれたもの（複数）」。ここでは、債務額を記した証文または勘定書を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπειτα
  choice: それから
  rationale: 次の債務者へと話が移る順序を、自然な現代日本語で示す。
- source_word: ἑτέρῳ
  choice: 別の者に
  rationale: 先の債務者とは異なるもう一人を指すが、原文にない性別は補わない。
- source_word: Σὺ δὲ πόσον ὀφείλεις
  choice: あなたは、どれだけ借りているのか
  rationale: 強調された「あなた」と、債務額を問う意味を自然に表す。δὲは場面内の軽い転換として、日本語では明示しなくても文脈で伝わる。
- source_word: Ἑκατὸν κόρους σίτου
  choice: 小麦百コル
  rationale: κόροςは穀物に用いられた特定の大容量単位なので、一般化せず「コル」と音写する。日本語の数量表現として「小麦百コル」とした。
- source_word: λέγει αὐτῷ
  choice: 管理人は彼に言う
  rationale: 主語を文脈から「管理人」と明示し、歴史的現在のλέγειを現在形「言う」で保つ。
- source_word: Δέξαι σου τὰ γράμματα
  choice: あなたの証書を受け取って
  rationale: γράμματαは字義的には複数の「書かれたもの」だが、ここでは債務を記した文書を指すため「証書」とする。δέξαιはその文書を手に取るよう命じる表現として「受け取って」と訳す。
- source_word: γράψον ὀγδοήκοντα
  choice: 八十と書きなさい
  rationale: 記載額を八十に書き改める命令を、原文に近く簡潔に表す。
