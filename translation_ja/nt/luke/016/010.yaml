id: LUK.16.10
reference: Luke 16:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ πιστὸς ἐν ἐλαχίστῳ καὶ ἐν πολλῷ πιστός ἐστιν, καὶ ὁ ἐν ἐλαχίστῳ ἄδικος καὶ ἐν πολλῷ ἄδικός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/010.yaml
  text: The one who is faithful in very little is also faithful in much[b][a], and the one who is unrighteous in very little is also unrighteous in much.
translation:
  language: ja
  text: ごく小さなことに[a]忠実な人は、多くのことにも忠実です。そして、ごく小さなことにおいて不正な人は、多くのことにおいても不正です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「最も小さなことに」。ギリシア語の表現は、非常に小さいもの、または取るに足りないものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστός
  choice: 忠実な
  rationale: ここでは単に信じることではなく、任された事柄において信頼に足ることを表す。「忠実な」はその意味を自然に伝え、後半の「不正な」との対照も保つ。
- source_word: ἐν ἐλαχίστῳ
  choice: ごく小さなことに
  rationale: ἐνを伴う中性単数形は、非常に小さい、または取るに足りない事柄における態度を示す。「ごく小さなことに」は日本語として自然で、「大きなこと」との対照も明瞭である。
- source_word: ἐν πολλῷ
  choice: 大きなことにも
  rationale: 中性単数のπολλῷは量や重要性の大きさを表し、ἐλαχίστῳと対照を成す。直訳的な「多くに」よりも「大きなことに」のほうが、この格言の対比を明快な現代日本語で示せる。
- source_word: ἄδικος
  choice: 不正な
  rationale: この語は不誠実、欺き、不公正を含む幅広い道徳的な誤りを指し得る。「不正な」は金銭上の不正に限定せず、文脈にも合う。
- source_word: ὁ ... πιστός / ὁ ... ἄδικος
  choice: 忠実な人／不正な人
  rationale: 冠詞付き形容詞の実詞的用法を、性別を限定しない代表的な単数として自然に表した。
- source_word: καί
  choice: も／そして
  rationale: 各半文内のκαίは対応する領域への付加を「も」で表し、二つの対照的命題を結ぶκαίは「そして」とした。
theological_decisions:
- issue: 管理をめぐる文脈でのἄδικοςの道徳的範囲
  choice: 不正な
  alternative: 不誠実な／不義な
  rationale: この節は財産管理だけに限られない一般的な道徳原則を述べる。「不正な」は周辺の金銭的文脈に適合しつつ、単なる金銭上の「不誠実」より広い意味を保つ。「不義な」は語義を強く保持するが、現代の一般読者にはやや宗教用語的である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前後半の反復と「小さなこと／大きなこと」「忠実／不正」の対照を保ち、一般読者にも理解しやすい格言調にした。
