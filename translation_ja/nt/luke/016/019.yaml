  text: Ἄνθρωπος δέ τις ἦν πλούσιος, καὶ ἐνεδιδύσκετο πορφύραν καὶ βύσσον εὐφραινόμενος καθ’ ἡμέραν λαμπρῶς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/019.yaml
  text: There was a certain rich man[a], and he used to dress in purple and fine linen, feasting splendidly every day.
translation:
  language: ja
  text: ある金持ちがいた。彼はいつも紫の衣と上質な亜麻布の衣を身にまとい、毎日、豪華に楽しんでいた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「毎日、盛大に宴を楽しんでいた」とも訳せる。「楽しんでいた」に当たる語は祝宴を楽しむことを含み得、「豪華に」に当たる語は豪奢さや盛大さを強調し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄνθρωπος δέ τις
  choice: ある…人がいた
  rationale: τιςを不特定の人物を導入する自然な日本語で表した。δέはここでは軽い物語上の移行を示すため、独立した接続語を補わず、文脈に委ねた。
- source_word: πλούσιος
  choice: 金持ち
  rationale: 物質的に富む人を指す直接的で自然な現代日本語。
- source_word: ἐνεδιδύσκετο
  choice: いつも…身にまとい
  rationale: 未完了過去が表す習慣的な着用を「いつも」で示し、中動態を日本語として自然な「身にまとい」で表した。
- source_word: πορφύραν
  choice: 紫の衣
  rationale: 紫染めの高価な衣服を指す換喩を明示し、富と豪華さを示す文化的含意を保った。
- source_word: βύσσον
  choice: 上質の亜麻布
  rationale: 高級な亜麻布を指す語であり、素材と品質の両方を簡潔に示した。衣服として身に着けることは述語から明らかである。
- source_word: εὐφραινόμενος
  choice: 楽しみ暮らしていた
  rationale: 喜び楽しむ、祝宴を楽しむという意味幅を保ち、宴会だけに限定しない自然な表現とした。
- source_word: καθ’ ἡμέραν
  choice: 毎日
  rationale: 日ごとの反復を表す標準的で明快な訳。
- source_word: λαμπρῶς
  choice: 華やかに
  rationale: 輝かしさ、盛大さ、豪奢さを含む副詞の意味を、文脈に合う自然な日本語で表した。
