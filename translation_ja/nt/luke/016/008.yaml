id: LUK.16.8
reference: Luke 16:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπῄνεσεν ὁ κύριος τὸν οἰκονόμον τῆς ἀδικίας ὅτι φρονίμως ἐποίησεν· ὅτι οἱ υἱοὶ τοῦ αἰῶνος τούτου φρονιμώτεροι ὑπὲρ τοὺς υἱοὺς τοῦ φωτὸς εἰς τὴν γενεὰν τὴν ἑαυτῶν εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/008.yaml
  text: And the master praised the unrighteous manager because he had acted shrewdly[c][b][a]. For the sons of this age are more shrewd in dealing with their own generation than the sons of light are.
translation:
  language: ja
  text: 主人は、不正な管理人が抜け目なく行動したので、彼をほめた。[a] この時代の子らは、自分たちの世代に対しては、光の子らよりも抜け目がないからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主は、不正な管理人をほめた」とも訳せる。ここでは、κύριοςがたとえの中の主人を指すと理解した。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「自分たちの世代に対して、光の子らよりも抜け目がない」。この句の構文と意味には難しさがあり、「自分たちの仲間に関して」と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ κύριος
  choice: 主人
  rationale: たとえの直近の文脈では、管理人を雇っている富んだ人物を指すのが最も自然である。「主」も文法上は可能だが、ここでは物語内の社会的関係を明確にした。
- source_word: τὸν οἰκονόμον τῆς ἀδικίας
  choice: 不正な管理人
  rationale: οἰκονόμοςを現代日本語で明瞭な「管理人」とし、属格τῆς ἀδικίαςの道徳的な否定性を「不正な」で保持した。「不正を働いた」と行為を限定せず、人物への特徴づけとして訳した。
- source_word: φρονίμως / φρονιμώτεροι
  choice: 抜け目なく／抜け目がない
  rationale: 結果を見越した実際的な機敏さを表しつつ、道徳的に正しい「賢さ」として称賛する響きを避ける。同じ語根の対応も保った。
- source_word: οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: この時代の子ら
  rationale: セム語的な「子ら」の比喩と、対句をなす「光の子ら」との形式的対応を保持した。「世の人々」と意訳するとαἰώνの時代的含意が弱まるため避けた。
- source_word: οἱ υἱοὶ τοῦ φωτός
  choice: 光の子ら
  rationale: 神の光に属する者を示す聖書的比喩を保ち、「この時代の子ら」との対照を明確にした。
- source_word: εἰς τὴν γενεὰν τὴν ἑαυτῶν
  choice: 自分たちの同世代との関わりにおいては
  rationale: 直訳的には「自分たちの世代に対して」で、統語と意味に難しさがある。自分たちと同じ世代・仲間の領域での対人的な機敏さという有力な理解を、過度に限定しない表現で示した。
theological_decisions:
- issue: 最初のὁ κύριοςが指す人物
  choice: たとえの中の主人
  alternative: 主、すなわちイエスまたは神
  rationale: 直前の物語では富んだ主人と管理人が登場しており、主人が自分の管理人を評価する流れが自然である。ただしκύριος自体は「主」とも訳せるため、脚注に別訳を示した。
- issue: 管理人の行動に対する道徳的評価
  choice: 不正そのものではなく、抜け目のない行動をほめた
  alternative: 管理人の不正を是認した、または道徳的な知恵を称賛した
  rationale: 本文は管理人をἀδικίαで否定的に特徴づけながら、φρονίμωςを評価している。「不正な」と「抜け目なく」を併置し、その神学的・道徳的緊張を解消せずに保持した。
- issue: 「この時代の子ら」と「光の子ら」の対照
  choice: 現在の時代に属する者と神の光に属する者との対照を比喩のまま保持
  alternative: 世俗的な人々と信者たち、と説明的に訳す
  rationale: 説明的な語を本文に持ち込むと所属や救済状態を必要以上に定義するため、原文の比喩的対句を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「この時代の子ら」「光の子ら」という原文の比喩的対句を保持した。「抜け目ない」は実際的な機敏さを表すが、道徳的な是認までは含まない。
