  rationale: 原文の「ハデス」とゲヘナの語彙上の区別、苦しみの状態、距離、そしてアブラハムの懐という像を保持した。「目を上げると、…見えた」を「目を上げて、…見た」に改め、原文の能動的な連続動作をより直接に反映した。文脈上明白なαὐτοῦの指示先は「その懐」で十分に保持されており、意味の追加を避けた。
