source:
  edition: SBLGNT
  text: καὶ ἐν τῷ ᾅδῃ ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ, ὑπάρχων ἐν βασάνοις, ⸀ὁρᾷ Ἀβραὰμ ἀπὸ μακρόθεν καὶ Λάζαρον ἐν τοῖς κόλποις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/023.yaml
  text: And in Hades[a], lifting up his eyes, being in torment[b], he sees Abraham far away and Lazarus in his bosom.
translation:
  language: ja
  text: そして彼は、死者の世界[a]で苦しみの中にあり、目を上げて、はるか遠くにアブラハムと、その懐にいるラザロを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ハデス」。死者の領域を指す語で、最終的な裁きの場所を表す「ゲヘナ」とは異なる。訳によっては「よみ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾅδῃ
  choice: 死者の世界[a]
  rationale: ギリシア語ᾅδηςが指す死者の領域を明確にし、最終的な裁きの場所を指すゲヘナとの区別を保つため。「地獄」とすると後代の教理的含意を過度に持ち込みうる。
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: 目を上げると
  rationale: 直訳的な身体表現を保ちながら、分詞の状況的・時間的関係を自然な現代日本語で表した。
- source_word: ὑπάρχων ἐν βασάνοις
  choice: 苦しみの中にいた
  rationale: 複数形βασάνοιςが表す激しい苦痛の状態を、文脈に即して自然に表現した。
- source_word: ὁρᾷ
  choice: 見えた
  rationale: ギリシア語は物語を生き生きと描く歴史的現在だが、日本語では周囲の過去時制に合わせることで自然な物語文とした。知覚の対象が現れたことを「見えた」で表す。
- source_word: ἀπὸ μακρόθεν
  choice: はるかかなたに
  rationale: 両者の大きな空間的隔たりを、明瞭で格調のある現代日本語で示した。
- source_word: ἐν τοῖς κόλποις αὐτοῦ
  choice: その懐にいる
  rationale: κόλποςの胸元・懐という像と、親密さや保護を表す慣用的意味を保持した。「その」は直近のアブラハムを指す。
theological_decisions:
- issue: ᾅδηςと最終的刑罰の場所との関係
  choice: 死者の世界
  alternative: ハデス／地獄
  rationale: 本文が用いる語をゲヘナと同一視せず、死後の状態をめぐる議論を訳文だけで決着させない。「死者の世界」は意味を読者に直接伝えつつ、脚注で原語名を示す。
- issue: 「アブラハムの懐」の表象
  choice: その懐にいる
  alternative: その腕に抱かれている／アブラハムのそばにいる
  rationale: 伝統的かつ原文に近い身体的イメージを保ち、親密さを説明的に限定しすぎない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「懐」「はるかかなた」によって物語の荘重さと原文の像を保った。主節の歴史的現在は、日本語として自然な過去時制で表した。
