source:
  edition: SBLGNT
  text: λέγει ⸀δὲ Ἀβραάμ· Ἔχουσι Μωϋσέα καὶ τοὺς προφήτας· ἀκουσάτωσαν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/029.yaml
  text: But Abraham said[a], ‘They have Moses and the Prophets[b]; let them listen to them.’
translation:
  language: ja
  text: しかし、アブラハムは言った。「彼らには、モーセと預言者たちがある[a]。彼らの言うことを聞くがよい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「モーセと預言者たち」は、モーセに結び付く律法と預言書による聖書の証言を指す表現。
    reason: cross_reference
  - marker: b
    text: ギリシア語をより直訳すれば、「彼らに聞くがよい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει δὲ
  choice: しかし、…は言った
  rationale: 歴史的現在の λέγει は、日本語の物語として自然な過去形「言った」で表した。δέ は直前の求めに対する応答の対照を示すため、「しかし」とした。
- source_word: Ἔχουσι
  choice: あの者たちには…がある
  rationale: 文脈上、富豪の兄弟たちがすでにモーセと預言者たちの証言を与えられていることを示す。「持っている」よりも、利用できる証言が存在するという日本語として自然な表現を選んだ。
- source_word: Μωϋσέα καὶ τοὺς προφήτας
  choice: モーセと預言者たち
  rationale: モーセに結び付く律法と預言書から成る聖書的証言を指す慣用句だが、ギリシア語の簡潔な換喩を説明的に展開せず、そのまま保持した。
- source_word: ἀκουσάτωσαν
  choice: 聞くがよい
  rationale: 三人称複数のアオリスト命令法。単に音を耳にするだけでなく、語られた証言に耳を傾け従うよう促す命令の力を、自然で dignified な日本語で表した。
- source_word: αὐτῶν
  choice: 彼らの言うことを
  rationale: ἀκούω が属格を取る用法を自然な日本語にした。代名詞は「モーセと預言者たち」を受け、その証言・語る内容を指すが、本文では人格的表現を保った。
theological_decisions:
- issue: 「モーセと預言者たち」の指示対象
  choice: 本文では字義どおり「モーセと預言者たち」とし、聖書的証言を指す換喩であることを脚注で示す。
  alternative: 「モーセの律法と預言書」と本文で明示する。
  rationale: ルカ文書およびユダヤ的用法では聖書を指す定型的な表現だが、本文を説明的に言い換えると原文の人格的な表現と簡潔さが失われるため。
- issue: ἀκουσάτωσαν の応答要求
  choice: 「聞くがよい」とし、証言を真剣に受け止める命令として訳す。
  alternative: より字義的に「彼らに聞かせなさい」または「彼らの声を聞けばよい」とする。
  rationale: ここでの「聞く」は聴覚作用だけでなく、すでに与えられた啓示に耳を傾ける応答を含む。ただし「従え」とまで訳して解釈を固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、アブラハムの応答にふさわしい簡潔で格調ある語調とした。「あの者たち」は直前の兄弟たちを指し、「彼ら」はモーセと預言者たちを受けることで、二つの複数指示を区別した。
