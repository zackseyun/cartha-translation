id: LUK.16.11
reference: Luke 16:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ οὖν ἐν τῷ ἀδίκῳ μαμωνᾷ πιστοὶ οὐκ ἐγένεσθε, τὸ ἀληθινὸν τίς ὑμῖν πιστεύσει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/011.yaml
  text: If[a], then, you have not been faithful with unrighteous wealth[b], who will entrust the true riches to you?
translation:
  language: ja
  text: ですから、不正な富[a]を扱う上で忠実でなかったのなら、だれがあなたがたに真のもの[b]を任せるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「不正なマモン」。「不正による富」とも訳せるが、ここでの表現は富の取得方法だけを指すとは限らない。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「真のもの」。不正な富との対比から、「真の富」を意味すると理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ ἀδίκῳ μαμωνᾷ
  choice: 不正な富を扱うことに
  rationale: ἐν は忠実さが示される領域を表すため、日本語では「富を扱うことに」と自然に表現した。ἄδικος の道徳的な響きを「不正な」で保ち、μαμωνᾶς は現金だけに限定されない「富」とした。
- source_word: πιστοὶ οὐκ ἐγένεσθε
  choice: 忠実でなかった
  rationale: 述語的な πιστός と γίνομαι の組み合わせを、管理を任された者としての信頼性を示す自然な日本語にした。
- source_word: τὸ ἀληθινὸν
  choice: 真のもの
  rationale: ギリシア語は中性単数の形容詞を名詞的に用い、具体的な名詞を明示していない。「真の富」と限定せず、原文の含みを保った。
- source_word: πιστεύσει
  choice: 任せるでしょうか
  rationale: ここでは人を表す与格と物を表す対格を伴い、「信じる」ではなく「何かを人に委ねる」という意味である。
- source_word: τίς ὑμῖν
  choice: だれがあなたがたに
  rationale: 修辞疑問の形と複数の受け手を明確に保った。
theological_decisions:
- issue: 「真のもの」と不正な富との対比
  choice: 本文では「真のもの」とし、名詞を補わない
  alternative: 「真の富」または「まことの富」
  rationale: 直前の μαμωνᾶς との対比から「真の富」という理解は有力だが、τὸ ἀληθινόν 自体は名詞を明示しない。本文では原文の余白を残し、その文脈上の理解を脚注で示した。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で格調を保った文体。「ですから」で οὖν の論理的つながりを示し、修辞疑問は自然な「でしょうか」で表した。
