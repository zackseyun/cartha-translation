    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουον
  choice: 聞いて
  rationale: 未完了時制が示す、その場で続いていた動作を、後続の「いた」と合わせて自然な日本語で表した。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは弱い叙述上の移行を示すため、文脈上不自然な接続語を補わず、日本語の文の流れに委ねた。
- source_word: ταῦτα πάντα
  choice: これらのことをすべて
  rationale: 直前までのイエスの教え全体を指す表現として、指示語と「すべて」の双方を保持した。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 当時のユダヤ教内の集団を、現代日本語で分かりやすく示した。
- source_word: φιλάργυροι ὑπάρχοντες
  choice: 金銭を愛する者であった
  rationale: 広い意味の「貪欲」と解釈的に一般化せず、金銭への愛を明示する原語の意味を保った。
- source_word: ἐξεμυκτήριζον
  choice: あざ笑っていた
  rationale: 公然と嘲り、軽蔑する意味と未完了時制の継続的な様相を、自然な現代日本語で表した。
- source_word: αὐτόν
  choice: イエスを
  rationale: 代名詞の指示対象を文脈から明示し、日本語での理解を容易にした。
theological_decisions:
- issue: φιλάργυροιによるファリサイ派の人々の性格描写
  choice: 金銭を愛する者
  alternative: 貪欲な者
  rationale: 原語は金銭への愛を明示しているため、より広い道徳的評価である「貪欲」に置き換えず、直前の富に関する教えとの結びつきを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「金銭を愛する者」は原文の具体性を保持し、「あざ笑っていた」は継続的な嘲りを自然に表す。脚注記号は、その対象である嘲笑表現の直後に置いた。
