id: LUK.16.24
reference: Luke 16:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς φωνήσας εἶπεν· Πάτερ Ἀβραάμ, ἐλέησόν με καὶ πέμψον Λάζαρον ἵνα βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος καὶ καταψύξῃ τὴν γλῶσσάν μου, ὅτι ὀδυνῶμαι ἐν τῇ φλογὶ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/024.yaml
  text: And he cried out and said[a], ‘Father Abraham, have mercy on me, and send Lazarus so that he may dip the tip of his finger in water and cool my tongue, because I am in agony in this flame.’
translation:
  language: ja
  text: 彼は声を上げて言った。「父アブラハムよ、私を憐れんでください。ラザロを遣わし、ラザロの指先を水に浸して、私の舌を冷やすようにしてください。この炎の中で、私は激しく苦しんでいるのです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この炎の中で、私はもだえ苦しんでいるのです」。このギリシア語動詞は、激しい苦痛や苦悩を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνήσας
  choice: 声を上げて
  rationale: 大声で切迫して呼びかけるニュアンスを、自然な現代日本語で表す。
- source_word: ἐλέησόν με
  choice: 私をあわれんでください
  rationale: 憐れみと慈悲を求める直接の願いを保ちつつ、文脈に合う丁寧な嘆願とした。
- source_word: πέμψον Λάζαρον
  choice: ラザロを遣わし
  rationale: 命じて行かせる意味を保つため、「送る」より文脈に適した「遣わす」を用いた。
- source_word: βάψῃ τὸ ἄκρον τοῦ δακτύλου αὐτοῦ ὕδατος
  choice: その指先を水に浸して
  rationale: βάπτωの短く浸す動作と、ἄκρονの「先端」を簡潔で具体的に表した。
- source_word: καταψύξῃ τὴν γλῶσσάν μου
  choice: 私の舌を冷やす
  rationale: 冷却によって苦痛を和らげる具体的な身体像をそのまま保った。
- source_word: ὀδυνῶμαι
  choice: 私は激しく苦しんでいる
  rationale: 強い苦痛を示す動詞の意味を伝えつつ、苦痛を誰かが意図的に加えているとの含意を不用意に導入しない。
- source_word: ἐν τῇ φλογὶ ταύτῃ
  choice: この炎の中で
  rationale: φλόξの具体的な「炎」という単数の像を保持した。
theological_decisions:
- issue: 死後の苦しみを表すὀδυνῶμαιの訳
  choice: 私は激しく苦しんでいる
  alternative: 私はこの炎の中でもだえ苦しんでいる／私はこの炎の中で苦しめられている
  rationale: 苦痛の強さは明示するが、ギリシア語の中動態・受動態形が許す表現上の幅を、拷問者の存在などの教理的含意へ狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。呼びかけは「父アブラハムよ」として原文の祖先への訴えを保持し、嘆願部分は丁寧語で自然にした。
