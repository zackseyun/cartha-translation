id: LUK.16.5
reference: Luke 16:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος ἕνα ἕκαστον τῶν χρεοφειλετῶν τοῦ κυρίου ἑαυτοῦ ἔλεγεν τῷ πρώτῳ· Πόσον ὀφείλεις τῷ κυρίῳ μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/005.yaml
  text: And after summoning each one of his master's debtors[a], he was saying to the first, 'How much do you owe my master?'
translation:
  language: ja
  text: そして、主人の債務者たちを一人一人呼び寄せてから、最初の人に言った。「私の主人に、いくら借りていますか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せ
  rationale: アオリスト中動態分詞の「自分のもとへ呼ぶ」という意味と、主動詞に先立つ動作を自然な日本語で表した。
- source_word: ἕνα ἕκαστον
  choice: 一人ずつ
  rationale: 一人一人を個別に呼んだという強い配分的意味を、明確で自然な日本語にした。
- source_word: χρεοφειλετῶν
  choice: 借りのある者たち
  rationale: 金銭に限らず、主人に対して債務を負う人々を指す語なので、文脈に合う平易な表現を選んだ。
- source_word: τοῦ κυρίου ἑαυτοῦ
  choice: 主人に
  rationale: κύριοςはここでは管理人の人間の主人を指す。ἑαυτοῦの再帰的関係は文脈上明らかなため、日本語では簡潔に「主人」とした。
- source_word: ἔλεγεν
  choice: 言った
  rationale: 未完了過去は、一人ずつに問いかける場面の進行または反復を背景に持つが、日本語では先行する「一人ずつ」と組み合わせて自然に表現した。
- source_word: τῷ πρώτῳ
  choice: 最初の人に
  rationale: 序列上の最初の一人を明瞭に示す自然な表現。
- source_word: Πόσον ὀφείλεις
  choice: いくら借りがありますか
  rationale: 債務額を尋ねる直接的な問いを、現代日本語で分かりやすく、使用人から債務者への発話として適度に丁寧に表した。
- source_word: τῷ κυρίῳ μου
  choice: 私の主人に
  rationale: μουを明示し、κύριοςを神的称号ではなく、このたとえに登場する人間の主人として訳した。
theological_decisions:
- issue: 家政・経済的なたとえにおけるκύριοςの訳語
  choice: 主人
  alternative: 主
  rationale: この節のκύριοςは管理人の人間の上位者を指し、神またはキリストの称号ではない。「主人」は社会的関係を正確に示し、不必要な神学的含意を避ける。
translation_notes:
  register: 明瞭な現代標準日本語。物語文は簡潔にし、問いは不自然に尊大にならない丁寧体とした。「一人ずつ」によって原文の配分的強調と、未完了過去が示しうる反復的な場面展開を伝えた。
