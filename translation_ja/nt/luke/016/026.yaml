    issue: 「大きな淵が据えられている」
    rationale: ἐστήρικταιは「確立されている／定められている」という、すでに成立して持続する状態を表す。「据える」は淵に通常用いにくく、日本語として不自然であるため、「定められている」に改めるのが安全である。
