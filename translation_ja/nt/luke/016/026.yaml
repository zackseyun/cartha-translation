id: LUK.16.26
reference: Luke 16:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐν πᾶσι τούτοις μεταξὺ ἡμῶν καὶ ὑμῶν χάσμα μέγα ἐστήρικται, ὅπως οἱ θέλοντες διαβῆναι ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται, ⸀μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/026.yaml
  text: And besides all these things[a], between us and you a great chasm has been fixed, so that those wanting to cross over from here to you cannot, nor can they cross over from there to us.
translation:
  language: ja
  text: そればかりか、私たちとあなたがたとの間には大きな淵が定められている。そのため、ここからあなたがたのところへ渡ろうとする者も渡ることができず、そちらから私たちのところへ渡ることもできない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πᾶσι τούτοις
  choice: そればかりか
  rationale: 直訳的な「これらすべてのことにおいて」は日本語では文脈上不自然であるため、追加の事情を導入する慣用的な働きを明確に表した。単数的な「このことに加えて」とも取り得る幅を過度に説明せず、自然な接続表現とした。
- source_word: μεταξὺ ἡμῶν καὶ ὑμῶν
  choice: 私たちとあなたがたとの間には
  rationale: 一人称複数と二人称複数を明示し、空間的・関係的な隔たりを自然な日本語で示した。
- source_word: χάσμα μέγα
  choice: 大きな淵
  rationale: χάσμαが表す深く隔てる裂け目を、現代日本語で理解しやすく、かつ荘重さを保つ「淵」で訳した。
- source_word: ἐστήρικται
  choice: 据えられている
  rationale: 完了受動形が示す、すでに定められ現在も動かない状態を表す。「固定されている」より自然で、隔たりの永続的な性質も伝わる。
- source_word: ὅπως
  choice: そのため
  rationale: ここでは淵が据えられていることから生じる結果を自然に導く。目的と結果の含みを決めすぎず、文脈上の関係を明瞭にした。
- source_word: οἱ θέλοντες διαβῆναι
  choice: 渡ろうとする者
  rationale: 意志を表す現在分詞と、不定詞の「渡る」を簡潔な日本語で再現した。
- source_word: ἔνθεν πρὸς ὑμᾶς μὴ δύνωνται
  choice: ここからあなたがたのところへ渡ろうとする者も渡ることができず
  rationale: 話者側を示す「ここから」と、禁止ではなく能力上の不可能を示す「できず」を保持した。
- source_word: μηδὲ ἐκεῖθεν πρὸς ἡμᾶς διαπερῶσιν
  choice: そちらから私たちのところへ渡ることもできない
  rationale: 前半との対称性を保ちつつ、ἐκεῖθενを聞き手側に即した「そちらから」とした。接続法は文脈上の不可能を表す形で自然に訳した。
theological_decisions:
- issue: 二つの領域を隔てる淵の性質
  choice: 動かすことができず、双方から渡れない隔たりとして訳す
  alternative: 死後世界の文字どおりの地形であると明示する、または単なる比喩であると限定する
  rationale: 本文は隔たりが据えられ、横断不能であることを強調するが、その存在様式を体系的に説明してはいないため、固定性と横断不能性だけを保った。
- issue: ὅπωςの目的・結果の含み
  choice: 「そのため」として結果を前面に出しつつ関係を限定しすぎない
  alternative: 「渡れないように」と訳して意図・目的をより強く示す
  rationale: ὅπωςは目的または結果を導き得る。ここでは自然な日本語を優先し、淵の存在と横断不能との関係を示しながら、誰が何の目的で据えたかは補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、たとえ話の厳粛さに合う落ち着いた文体とした。「あなたがた」で複数を明示し、「淵」「据えられている」によって格調を保ちながら、古語的な表現は避けた。
