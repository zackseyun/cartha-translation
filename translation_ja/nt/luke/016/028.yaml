  terminology: 「兄弟」はここで男性の同胞を適切に表します。「苦しみの場所」は βάσανος の激しい苦痛を過度に教理化せずに伝える安全な訳です。διαμαρτύρηται は文脈上「厳粛に警告する」とし、証言という語義の可能性は脚注で保持するのが適切です。
