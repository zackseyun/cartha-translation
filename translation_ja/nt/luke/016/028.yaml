source:
  edition: SBLGNT
  text: ἔχω γὰρ πέντε ἀδελφούς, ὅπως διαμαρτύρηται αὐτοῖς, ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν εἰς τὸν τόπον τοῦτον τῆς βασάνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/028.yaml
  text: for I have five brothers[a], so that he may solemnly warn them, lest they too come to this place of torment.
translation:
  language: ja
  text: 私には兄弟が五人いるからです。彼に彼らへ厳粛に警告させ[a]、彼らまでこの苦しみの場所に来ることがないようにしてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らに厳粛に証言させ」とも、「彼らに強く警告させ」とも訳せる。ギリシア語の動詞には、厳粛に証言すること、また強く警告することの意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω γὰρ
  choice: 私には……いるからです
  rationale: γάρの説明理由を自然な現代日本語の「からです」で示し、ἔχωは家族についての通常の表現「いる」とした。
- source_word: πέντε ἀδελφούς
  choice: 兄弟が五人
  rationale: ἀδελφούςは男性複数であり、この文脈では男のきょうだいを指すため「兄弟」とした。
- source_word: ὅπως
  choice: ……し
  rationale: 前節から続く願いの目的を日本語として自然につなぎ、後続の「ようにしてください」が目的構文全体を受ける形にした。
- source_word: διαμαρτύρηται
  choice: 厳かに警告し
  rationale: この動詞が持つ厳粛な証言・強い警告の幅のうち、彼らがこの場所に来ないためという文脈に即して警告の意味を本文に採った。語義の幅は脚注に残した。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 与格の対象を明示する自然な日本語。
- source_word: ἵνα μὴ καὶ αὐτοὶ ἔλθωσιν
  choice: 彼らまで……来ることがないように
  rationale: 否定目的を「ないように」で表し、καὶ αὐτοὶは、語り手自身と同じ結末になることへの懸念を示す「彼らまで」とした。
- source_word: εἰς τὸν τόπον τοῦτον
  choice: この……場所に
  rationale: εἰςの到達先を自然な助詞「に」で表した。
- source_word: τῆς βασάνου
  choice: 苦しみの
  rationale: βάσανοςの激しい苦痛という意味を明瞭に表しつつ、この一節を越えた体系的な教理用語を持ち込まない表現とした。
theological_decisions:
- issue: 死後の場所を表す τὸν τόπον τοῦτον τῆς βασάνου の訳
  choice: この苦しみの場所
  alternative: この責め苦の場所
  rationale: その場所をそこで経験される苦痛によって描写する原文を保った。「責め苦」も可能だが、現代の一般読者に明瞭な「苦しみ」を選び、この節が明言しない刑罰論の詳細は加えなかった。
- issue: διαμαρτύρηται の証言と警告の語義的緊張
  choice: 本文では「厳かに警告し」、脚注で「厳粛に証言し」を提示
  alternative: 彼らに厳粛に証言し
  rationale: 直後の否定目的節から警告の機能が強いが、動詞には厳粛に証言する意味もあるため、本文で文脈上の意味を示しながら脚注で genuine ambiguity を保存した。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。話者の切迫した願いを保ちつつ、古風すぎる「責め苦」は避けた。脚注記号[a]は、その対象語句の直後ではなく文末に置き、文全体の流れを妨げずに διαμαρτύρηται の訳語へ注を付す構成とした。
