  source_fidelity: γάρの説明的用法、男性の兄弟五人、二つの目的節、καὶ αὐτοίの「彼らも」、および βάσανος の苦痛を表す描写は概ね保持されています。ただし、現行の「彼が…警告し、…ようにしてください」は、誰がその警告を行わせるのかという依頼の構文が日本語として不安定です。前節から継続するアブラハムへの願いに即して、「彼に…警告させ」とするのが、原文の従属した目的表現を自然に反映します。
