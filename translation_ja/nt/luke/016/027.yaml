  yaml_path: translation/nt/luke/016/027.yaml
  text: Then he said[a], ‘I ask you then, father, that you send him to my father’s house,’
translation:
  language: ja
  text: そこで彼は言った。「父よ、それではお願いします[a]。ラザロを私の父の家に遣わしてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「お願いします」は「お頼みします」とも訳せる。ここで用いられたギリシア語は、相手に行為を求める依頼を表し、文脈によっては切実な願いを表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δέ
  choice: そこで彼は言った
  rationale: δέはここで物語を次へ進める穏やかな接続語。「そこで」は、直前の返答を受けた展開を自然な日本語で示す。
- source_word: Ἐρωτῶ σε οὖν
  choice: それではお願いします
  rationale: ἐρωτάωの「頼む、願う」という依頼の意味を自然な敬語で表し、οὖνが示す直前の拒絶を受けた継続・帰結を「それでは」で保持する。
- source_word: πάτερ
  choice: 父よ
  rationale: たとえの中でアブラハムを祖先として呼びかける語であり、神への呼称と決めつけず、呼格を明示する。
- source_word: ἵνα πέμψῃς αὐτὸν
  choice: ラザロを……遣わしてください
  rationale: ἵνα＋接続法が示す依頼内容を日本語の依頼表現で表す。αὐτόνの指示対象は直前の文脈にあるラザロなので、曖昧になりやすい日本語の代名詞を避けて名を補う。
- source_word: εἰς τὸν οἶκον τοῦ πατρός μου
  choice: 私の父の家に
  rationale: εἰςの目的地とοἶκοςの家・家族の場という基本義を、簡潔で自然な日本語にする。
theological_decisions:
- issue: 呼びかけのπάτερ
  choice: 父よ
  alternative: 父なる神よ
  rationale: 話者が呼びかけている相手はたとえの中のアブラハムであり、神への直接の呼びかけを本文に持ち込まない。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で格調を保った口語体。依頼の切実さを過度に強めず、直前の拒絶を受けた展開を自然に示した。
