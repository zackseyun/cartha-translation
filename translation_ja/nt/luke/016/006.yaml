  text: ὁ δὲ εἶπεν· Ἑκατὸν βάτους ἐλαίου· ⸂ὁ δὲ⸃ εἶπεν αὐτῷ· Δέξαι σου ⸂τὰ γράμματα⸃ καὶ καθίσας ταχέως γράψον πεντήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/006.yaml
  text: He said[a], ‘A hundred baths of olive oil.’ Then he said to him, ‘Take your bill, sit down quickly[b], and write fifty.’
translation:
  language: ja
  text: 彼は答えた。「オリーブ油百バトです。」そこで管理人は言った。「あなたの証書[a]を取って、すぐに座り、五十と書きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたの書類」（複数形）。文脈上、負債を記した証書を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάτους
  choice: バト
  rationale: 特定の古代液量単位を一般的な「升」などに置き換えず、音訳して具体性を保った。数量の現代換算には幅があるため本文では換算しない。
- source_word: ἐλαίου
  choice: オリーブ油
  rationale: この文脈のἔλαιονが指す品物を現代の読者に明確に示す。
- source_word: Δέξαι
  choice: 受け取り
  rationale: 証書を手に取るよう命じる場面に合う自然な表現。後続の命令とつなげた。
- source_word: τὰ γράμματα
  choice: あなたの証書
  rationale: 字義的には複数形の「書類・書かれたもの」だが、ここでは債務を記した文書を指す。「証書」は商取引の文脈を簡潔に伝えつつ、債務者側の文書であることも表せる。
- source_word: καθίσας
  choice: 座って
  rationale: 分詞を後続の命令に伴う動作として自然な日本語の連用形で表した。
- source_word: ταχέως
  choice: すぐに
  rationale: 速やかに行う命令を自然な現代日本語で表す。
- source_word: γράψον
  choice: 書きなさい
  rationale: 改訂後の数字を証書に記入する命令を、原文どおり簡潔に表した。
- source_word: πεντήκοντα
  choice: 五十
  rationale: 原文の数詞をそのまま保持した。
