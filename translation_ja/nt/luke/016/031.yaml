id: LUK.16.31
reference: Luke 16:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ· Εἰ Μωϋσέως καὶ τῶν προφητῶν οὐκ ἀκούουσιν, οὐδ’ ἐάν τις ἐκ νεκρῶν ἀναστῇ πεισθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/031.yaml
  text: But he said to him[a], ‘If they do not listen to Moses and the Prophets[c][b], neither will they be persuaded if someone rises from the dead.’
translation:
  language: ja
  text: しかし、アブラハムは彼に言った。「モーセと預言者たちに耳を傾けない[a]のなら、たとえ誰かが死者の中からよみがえっても、彼らは説得されない。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「耳を傾けない」は、「聞かない」または「聞き従わない」とも訳せる。ギリシア語の動詞は、耳で聞くことと、それに応じて注意を向けることの両方を含み得る。
    reason: lexical_alternative
  - marker: b
    text: 「説得されない」は、「納得しない」とも訳せる。ここでのギリシア語は、必ずしも狭い神学的意味で「信じない」ということではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: しかし、アブラハムは彼に言った
  rationale: δέの穏やかな対照を「しかし」で示す。日本語では話者を明示したほうが自然であり、文脈上の話者であるアブラハムを補った。
- source_word: Μωϋσέως καὶ τῶν προφητῶν
  choice: モーセと預言者たち
  rationale: イスラエルに与えられた権威ある聖書の証言を指す慣用表現を、説明的に「聖書」と置き換えず保持した。
- source_word: οὐκ ἀκούουσιν
  choice: 耳を傾けない
  rationale: ἀκούωが含み得る、聞くことと応答的に受け止めることの両面を自然な日本語で表す。
- source_word: οὐδ’ ἐάν
  choice: たとえ…ても、…ない
  rationale: 第一節の否定を強めて第二の条件節へつなぐ構文の修辞的な力を明確に表した。
- source_word: ἐκ νεκρῶν ἀναστῇ
  choice: 死者の中から生き返っても
  rationale: 復活を表す定型的な内容を自然な現代日本語で示しつつ、ἐκの「中から」という像を保持した。
- source_word: πεισθήσονται
  choice: 説得されない
  rationale: πείθωの受動形が表す説得・確信の意味を保ち、「信じない」「悔い改めない」のように神学的意味を狭めない。
theological_decisions:
- issue: 「モーセと預言者たち」の指示対象
  choice: イスラエルにすでに与えられた権威ある聖書の証言を指す表現として保持する
  alternative: 単に二種類の人物を指す表現とみなす、または「聖書」と意訳する
  rationale: 文脈では聖書の証言を換喩的に指すが、原文の慣用表現そのものを残すことで解釈を過度に説明しない。
- issue: πεισθήσονταιの意味
  choice: 一般的に「説得される」
  alternative: 「信じる」または「悔い改める」
  rationale: 原語は説得される、確信することを表し、救いの信仰や悔い改めに限定してはいない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。会話の対照と条件文の強調を自然に表し、原文の神学的な含みを狭めない。すべての脚注記号を本文に配置した。
