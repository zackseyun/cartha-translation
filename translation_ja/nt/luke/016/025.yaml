source:
  edition: SBLGNT
  text: εἶπεν δὲ Ἀβραάμ· Τέκνον, μνήσθητι ὅτι ⸀ἀπέλαβες τὰ ἀγαθά σου ἐν τῇ ζωῇ σου, καὶ Λάζαρος ὁμοίως τὰ κακά· νῦν δὲ ὧδε παρακαλεῖται σὺ δὲ ὀδυνᾶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/025.yaml
  text: But Abraham said[a], ‘Child, remember that you received your good things during your life, and Lazarus likewise bad things; but now he is comforted here[b], and you are in anguish.’
translation:
  language: ja
  text: しかし、アブラハムは言った。「子よ、思い出しなさい。あなたは生きている間に、自分にとって良いものを受け取り[a]、ラザロも同じように悪いものを受け取った。だが今、彼はここで慰められ、あなたは苦しんでいる[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分にとって良いものを十分に受け取った」。ギリシア語の動詞には、割り当てられたものを受け取る、または十分に受け取るという含みがあり得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「激しい苦痛の中にいる」。ギリシア語は、強い痛みや苦悩を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: 子よ
  rationale: 呼びかけとしての親愛と立場の違いを簡潔に保ち、実の親子関係に限定しない自然な日本語とした。
- source_word: μνήσθητι
  choice: 思い出しなさい
  rationale: 過去の生涯を想起するよう促すアオリスト命令形を、明瞭で自然な命令表現にした。
- source_word: ἀπέλαβες
  choice: 受け取り
  rationale: 割り当てられたものを受ける、または十分に受け取る含みを持つが、本文では意味を狭めず「受け取る」とした。
- source_word: τὰ ἀγαθά σου
  choice: 自分の良いもの
  rationale: 所有を表す σου と、実体詞的な複数形の広い意味を保ち、「祝福」のような神学的語を加えなかった。
- source_word: ἐν τῇ ζωῇ σου
  choice: 生きている間に
  rationale: 地上での生涯という時間的範囲を、普通の現代日本語で明確にした。
- source_word: ὁμοίως τὰ κακά
  choice: 同じように悪いものを受けた
  rationale: 原文で省略された動詞を日本語では補い、並行関係を明瞭にした。「悪いもの」は道徳的悪ではなく、身に受けた不幸や苦難を広く指す。
- source_word: παρακαλεῖται
  choice: 慰められ
  rationale: 死後の逆転という文脈で、慰めを受けている受動の意味を自然に表した。
- source_word: ὧδε
  choice: ここで
  rationale: 物語中の現在地を指す直示表現を簡潔に訳した。
- source_word: ὀδυνᾶσαι
  choice: 苦しんでいる
  rationale: 強い痛みや苦悩を表す語だが、肉体的苦痛か精神的苦悩かを限定せず、日本語で自然な広い表現とした。
theological_decisions:
- issue: 死後の苦しみを表す語の訳し方
  choice: おまえは苦しんでいる
  alternative: おまえは激しい苦痛の中にいる／おまえは責め苦を受けている
  rationale: 意識的な苦しみは明示しつつ、ὀδυνᾶσαι 自体を越えて苦しみの原因や様態を教理的に限定しないため。
- issue: ἀπέλαβες に含まれ得る完了・応報の含み
  choice: 受け取り
  alternative: 十分に受け取った／受けるべきものを受け取った
  rationale: 動詞には「受け取り尽くす」「割り当てられたものを受ける」という含みがあり得るが、本文で応報の仕組みを過度に確定せず、脚注で代案を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「おまえ」はアブラハムから富んだ男への上下関係を示すが、「子よ」と組み合わせることで侮蔑的になりすぎないようにした。原文の対照構造を保ちつつ、日本語として必要な動詞をラザロの節に補った。
