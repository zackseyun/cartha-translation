  to: しかし、アブラハムは言った。「子よ、思い出しなさい。あなたは生きている間に、自分にとって良いものを受け取り[a]、ラザロも同じように悪いものを受け取った。だが今、彼はここで慰められ、あなたは苦しんでいる[b]。」
