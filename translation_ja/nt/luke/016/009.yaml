id: LUK.16.9
reference: Luke 16:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγὼ ὑμῖν λέγω, ⸂ἑαυτοῖς ποιήσατε⸃ φίλους ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας, ἵνα ὅταν ⸀ἐκλίπῃ δέξωνται ὑμᾶς εἰς τὰς αἰωνίους σκηνάς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/009.yaml
  text: And I tell you[a], make friends for yourselves by means of unrighteous wealth, so that when it fails[c][b], they may welcome you into the eternal dwellings.
translation:
  language: ja
  text: わたしはあなたがたに言います。不正の富[a]を用いて、自分のために友を作りなさい。そうすれば、その富が尽きるとき[b]、彼らがあなたがたを永遠の住まい[c]に迎え入れてくれるでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「不正のマモンから」。「マモン」は、富や金銭を意味するギリシア語の伝統的な音写。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたが力尽きるとき」または「それがなくなるとき」。ギリシア語の動詞には主語が明示されていない。多くは富が尽きることと理解するが、人の死を指すとする理解もある。
    reason: alternative_reading
  - marker: c
    text: 直訳「永遠の天幕」。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἐγὼ ὑμῖν λέγω
  choice: わたしもあなたがたに言います
  rationale: καὶ ἐγώ の強調を「わたしも」で表しつつ、現代日本語として自然な語順にした。
- source_word: ἑαυτοῖς ποιήσατε φίλους
  choice: 自分のために友を作りなさい
  rationale: 再帰代名詞の与格とアオリスト命令形を明確かつ自然に表した。
- source_word: ἐκ τοῦ μαμωνᾶ τῆς ἀδικίας
  choice: 不正の富を用いて
  rationale: ἐκ の文脈上の手段的な意味を「用いて」で表した。「不正の」は、富を不正取得された金銭だけに限定せず、ἀδικία の広い倫理的緊張を保つ。
- source_word: μαμωνᾶ
  choice: 富
  rationale: 「マモン」より一般読者に明瞭であり、金銭を含む財を表せる。伝統的な音写は脚注に残した。
- source_word: ἵνα ὅταν ἐκλίπῃ
  choice: そうすれば、その富が尽きるとき
  rationale: ἵνα の目的・結果の流れを自然な日本語で示し、無主語の ἐκλίπῃ は直近の μαμωνᾶ を受ける可能性が最も高いと判断した。ただし別解は脚注に保持した。
- source_word: δέξωνται ὑμᾶς
  choice: 彼らがあなたがたを…迎え入れてくれる
  rationale: δέχομαι の歓迎を伴う受け入れを表現した。三人称複数の主体が誰かは特定しない。
- source_word: εἰς τὰς αἰωνίους σκηνάς
  choice: 永遠の住まいに
  rationale: σκηνή の字義は「天幕」だが、ここでは居所を表すため、比喩を過度に具体化しない読みやすい表現とした。字義的な訳は脚注に示した。
theological_decisions:
- issue: 「不正の富」の範囲
  choice: 不正に特徴づけられた現世の富を広く指し、不正に得た金銭だけには限定しない
  alternative: 不正な手段で得た富、または人格化されたマモン
  rationale: τῆς ἀδικίας の倫理的含意を保ちながら、本文が明示しない取得経路や人格化を訳文で断定しないため。
- issue: ἐκλίπῃ の主語
  choice: その富が尽きる
  alternative: あなたがたが力尽きる、すなわち死ぬ／世の資源がなくなる
  rationale: 直近の名詞 μαμωνᾶ が最も自然な指示対象だが、ギリシア語では主語が明示されていないため、別解を脚注に残した。
- issue: 迎え入れる「彼ら」の正体
  choice: 特定せず「彼ら」とする
  alternative: 富によって得た友、貧しい人々・神の民、または天上の存在
  rationale: δέξωνται の主語はギリシア語本文でも暗黙であり、特定すると解釈を本文へ持ち込むことになるため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、命令の厳粛さを保つため丁寧体で統一した。「マモン」や「天幕」のように一般読者には不透明になり得る字義的表現は脚注に置き、本文では「富」「住まい」とした。
