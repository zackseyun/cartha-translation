  text: ἐγένετο δὲ ἀποθανεῖν τὸν πτωχὸν καὶ ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων εἰς τὸν κόλπον Ἀβραάμ· ἀπέθανεν δὲ καὶ ὁ πλούσιος καὶ ἐτάφη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/022.yaml
  text: It happened that the poor man died and was carried by the angels to Abraham’s bosom[a]. And the rich man also died and was buried.
translation:
  language: ja
  text: さて、貧しい人は死に、天使たちによってアブラハムの懐へ運ばれた[a]。金持ちもまた死んで、葬られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アブラハムのそばへ」。ギリシア語では直訳すると「アブラハムの懐へ」であり、親密さ、名誉、交わりを表すイメージである。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο δὲ ἀποθανεῖν
  choice: さて、…死に
  rationale: ルカに特徴的な出来事の推移を示す構文。日本語では直訳的な「…ということが起こった」を避け、「さて」で穏やかな場面の進展を示し、後続の連用形へ自然につないだ。
- source_word: τὸν πτωχὸν
  choice: 貧しい人
  rationale: πτωχόςの意味を直接表し、この節自体には明示されない「物乞い」という限定を持ち込まない。
- source_word: ἀπενεχθῆναι αὐτὸν ὑπὸ τῶν ἀγγέλων
  choice: 御使いたちによって…運ばれた
  rationale: 受動態と行為者を保持した。「御使い」は聖書文体として定着しつつ理解可能な語であり、複数と定冠詞の特定性を「たち」で表した。
- source_word: εἰς τὸν κόλπον Ἀβραάμ
  choice: アブラハムの懐へ
  rationale: κόλποςの身体的・関係的な比喩を保ち、親密さ、誉れ、食卓で傍らにいるイメージを一つの解釈へ限定しない。
- source_word: ἀπέθανεν δὲ καὶ ὁ πλούσιος
  choice: 金持ちもまた死んで
  rationale: καίの並行性を「もまた」で示し、前半との対照と共通の死を保持した。
- source_word: ἐτάφη
  choice: 葬られた
  rationale: θάπτωの受動態を簡潔に再現した。
theological_decisions:
- issue: εἰς τὸν κόλπον Ἀβραάμ の表現
  choice: アブラハムの懐へ
  alternative: アブラハムのそばへ
  rationale: 「懐」という比喩を本文に残すことで、親密な交わり、誉れ、食卓での近さを一般化された死後世界の用語へ置き換えず、神学的含意を開いたままにする。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、たとえ話の荘重さに合う「御使い」「懐」「葬られた」を用いた。文頭の δέ は明示的な時間語ではないため「その時」とせず、軽い叙述転換として「さて」とした。
