  text: 一方、ラザロという名の貧しい人が、その門前に寝かされていて[a]、体中がただれていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その門前に投げ出されていた」。ギリシア語の動詞には「投げる、放り出す」という強い意味もあり、ラザロの無力さや、顧みられていない状態を強調している可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「潰瘍に冒されていた」「潰瘍だらけだった」。ギリシア語の分詞は、潰瘍性の傷に苦しめられていた状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχὸς
  choice: 貧しい人
  rationale: 社会的役割としての「物乞い」まで限定せず、貧困状態を表す原語の基本的な意味を自然な現代日本語で示した。
- source_word: τις
  choice: （不定の人物として導入）
  rationale: 日本語では「ある」を加えなくても新しい人物として自然に導入できるため、「ラザロという名の貧しい人」とした。
- source_word: ὀνόματι Λάζαρος
  choice: ラザロという名の
  rationale: 「名をラザロという」より簡潔で自然に、人物名を示す与格構文を表した。
- source_word: ἐβέβλητο
  choice: 寝かされていた
  rationale: 受動態を保ち、ラザロが自力でそこにいたのではなく、誰かによって置かれたことと、その結果としてそこにいた状態を表した。βάλλωが持ちうる強い語感は脚注に残した。
- source_word: πρὸς τὸν πυλῶνα αὐτοῦ
  choice: その門前に
  rationale: 大きな家の門または門口を指すπυλώνと、そこに接して置かれた場面を簡潔で自然な日本語にした。「その」は直前の金持ちを受ける。
- source_word: εἱλκωμένος
  choice: できものだらけであった
  rationale: 潰瘍性の傷に冒された痛ましい状態を、専門語に偏らない明瞭な現代日本語で表した。
