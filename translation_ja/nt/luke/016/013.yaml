id: LUK.16.13
reference: Luke 16:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδεὶς οἰκέτης δύναται δυσὶ κυρίοις δουλεύειν· ἢ γὰρ τὸν ἕνα μισήσει καὶ τὸν ἕτερον ἀγαπήσει, ἢ ἑνὸς ἀνθέξεται καὶ τοῦ ἑτέρου καταφρονήσει. οὐ δύνασθε θεῷ δουλεύειν καὶ μαμωνᾷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/013.yaml
  text: No household servant can serve two masters; for either he will hate the one and love the other[a], or he will be devoted to one and despise the other. You cannot serve God and Mammon.
translation:
  language: ja
  text: どんな家のしもべも、二人の主人に仕えることはできない。一方を憎んで他方を愛するか、一方に固くついて他方を軽んじるからである。あなたがたは、神とマモン[a]の両方に仕えることはできない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「マモン」は「富」または「金銭」を意味する語。ここでは、富が神と張り合う主人であるかのように語られている。
    reason: 現代の読者には音写語の意味が分かりにくいため、原語の語義と擬人化された用法を説明する。
lexical_decisions:
- source_word: οἰκέτης
  choice: 家のしもべ
  rationale: 家庭内で主人に仕える身分の者を指す語であり、一般的な「しもべ」より家に属する奉仕者という文脈を示す。「奴隷」と断定的に訳すよりも語の固有の範囲を保ちつつ、主人との関係を明確にする。
- source_word: κυρίοις
  choice: 主人
  rationale: ここでは家庭内の奉仕者に対する人間の主人を指すため、「主」ではなく「主人」とした。
- source_word: δουλεύειν
  choice: 仕える
  rationale: 奴隷・しもべとして奉仕することを表す。日本語では「仕える」が主人への従属と奉仕を自然に伝え、神とマモンとの対比にもそのまま用いることができる。
- source_word: μισήσει / ἀγαπήσει
  choice: 憎む／愛する
  rationale: 原文の強い対句を弱めず、そのまま明瞭に表した。
- source_word: ἀνθέξεται
  choice: 固くつく
  rationale: 一方にしっかりと結びつき、離れずに支持する意味を保つ。「忠実である」よりも、原語の『つかまる、固くつく』という像を残す。
- source_word: καταφρονήσει
  choice: 軽んじる
  rationale: 相手を見下して重んじない意味を、現代日本語で自然かつ簡潔に示す。
- source_word: μαμωνᾷ
  choice: マモン
  rationale: 富を意味するセム語由来の語を音写し、神に対抗する主人のように扱われる擬人化の力を保つ。意味は脚注で補った。
theological_decisions:
- issue: θεῷとμαμωνᾷの対比
  choice: 神とマモン
  alternative: 神と富／神と金銭
  rationale: 原文は富をあたかも人に仕えることを要求する別の主人であるかのように置いている。「マモン」を残すことで、この擬人化と神との鋭い対立を保持する。ただし、マモンを文字どおりの神格と断定するものではない。
- issue: 二人の主人への奉仕が不可能であるという表現
  choice: 神とマモンの両方に仕えることはできない
  alternative: 神にも富にも仕えることはできない
  rationale: οὐ δύνασθεの不可能性と、二者が忠誠を要求する競合関係を明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、格調とことわざ的な強さを保った。「しもべ」「仕える」は文脈上理解しやすく、主人への従属関係と神への奉仕の両方を一貫して表せる。原文の一般論を日本語では性別を明示せず自然に表現した。
