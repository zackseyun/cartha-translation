id: LUK.16.4
reference: Luke 16:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔγνων τί ποιήσω, ἵνα ὅταν μετασταθῶ ⸀ἐκ τῆς οἰκονομίας δέξωνταί με εἰς τοὺς οἴκους ⸀ἑαυτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/004.yaml
  text: I know what I will do[a], so that when I am removed from the management, they may receive me into their homes.
translation:
  language: ja
  text: 分かった、こうしよう。管理人の職を解かれたとき、人々が私を自分たちの家に迎え入れてくれるように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: 分かった
  rationale: アオリストの結果的・起動的な力を、突然思案がまとまったことを示す自然な日本語で表した。
- source_word: τί ποιήσω
  choice: こうしよう
  rationale: 熟慮を表す接続法だが、ここではすでに策を思いついた発言なので、決意を示す自然な表現とした。
- source_word: ἵνα ὅταν
  choice: …とき、…ように
  rationale: 将来の事態を示すὅτανと、目的を示すἵναの双方を保った。
- source_word: μετασταθῶ ἐκ τῆς οἰκονομίας
  choice: 管理人の職を解かれた
  rationale: μεθίστημιの受動態は地位から外されること、οἰκονομίαはここでは管理人としての職務・地位を指す。文脈上の解雇を明確かつ自然に表した。
- source_word: δέξωνταί με
  choice: 私を…迎え入れてくれる
  rationale: δέχομαιがこの文脈で表す、住まいに受け入れるという歓待の意味を自然な日本語にした。
- source_word: εἰς τοὺς οἴκους ἑαυτῶν
  choice: 自分たちの家に
  rationale: 再帰代名詞ἑαυτῶνを「自分たちの」で明示し、οἴκουςは居住と歓待の場なので「家」と訳した。
theological_decisions: []
translation_notes:
  register: 管理人の独り言として自然で簡潔な現代日本語にしつつ、口語的になりすぎない調子を保った。「管理人の職」は直前の文脈にも合い、抽象的・神学的に響きうる「管理の務め」より具体的である。
