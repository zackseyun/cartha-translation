source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ πρὸς τοὺς ⸀μαθητάς· Ἄνθρωπός τις ἦν πλούσιος ὃς εἶχεν οἰκονόμον, καὶ οὗτος διεβλήθη αὐτῷ ὡς διασκορπίζων τὰ ὑπάρχοντα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/001.yaml
  text: He was also saying to the disciples[a], “There was a certain rich man who had a manager[b], and this man was accused to him of squandering his possessions.”
translation:
  language: ja
  text: イエスは弟子たちにもこう話していた。「ある金持ちに、財産を管理する者[a]がいた。この者が主人の財産を浪費しているとの訴えが、主人のもとにあった[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「家令」。家や財産の管理を任された者。
    reason: lexical_alternative
  - marker: b
    text: 「不利な報告が寄せられた」または「告発された」とも訳せる。この語自体は、訴えの内容が事実だと確定していることを必ずしも意味しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ καὶ πρὸς τοὺς μαθητάς
  choice: イエスは弟子たちにもこう話していた
  rationale: 主語は直前の文脈からイエスと補い、未完了過去を「話していた」で表した。δέによる場面の推移は日本語では明示せず、καίの追加の意味を「にも」で保持した。
- source_word: Ἄνθρωπός τις ἦν πλούσιος
  choice: ある金持ちに
  rationale: たとえ話の登場人物を導入する不定表現を、自然な現代日本語の「ある金持ち」で表した。後続の所有構文と合わせて「ある金持ちに……がいた」とした。
- source_word: οἰκονόμον
  choice: 財産を管理する者
  rationale: 家や領地の運営を委ねられた者を指す。現代の読者に役割が明瞭になる表現を選び、伝統的な「家令」は脚注に示した。
- source_word: οὗτος
  choice: この者
  rationale: 管理者を指し戻す指示語の強調を保った。
- source_word: διεβλήθη αὐτῷ
  choice: 主人に訴えがあった
  rationale: 管理者について金持ちへ不利な報告または告発がなされたことを自然な日本語で表した。 आरोपいの真偽が確定しているとは訳文で断定しない。
- source_word: ὡς διασκορπίζων
  choice: 浪費していると
  rationale: ὡςと現在分詞が示す訴えの内容を表し、財産の文脈に合う「浪費する」を用いた。
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: 主人の財産
  rationale: αὐτοῦが金持ちを指すことを日本語で明確にし、所有物全般を表す「財産」とした。
theological_decisions:
- issue: 告発内容の真偽
  choice: 「訴えがあった」とし、浪費が立証済みとは断定しない
  alternative: 「浪費していることが知らされた」
  rationale: διαβάλλωは告発・中傷・不利な報告を表し得るため、原文が残す आरोपいと事実認定の間の緊張を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、たとえ話にふさわしい落ち着いた語調と原文の未確定な告発の含みを保った。
