  to: イエスは弟子たちにもこう話していた。「ある金持ちに、財産を管理する者[a]がいた。この者が主人の財産を浪費しているとの訴えが、主人のもとにあった[b]。」
  rationale: 訴えの内容を「～との訴え」として自然な内容節に改め、その訴えが主人に届けられたことを「主人のもとにあった」と表した。これにより、管理者の浪費が事実として確定したとは述べず、原文の受動表現と告発の含みを保持する。あわせて閉じ引用符を補った。
