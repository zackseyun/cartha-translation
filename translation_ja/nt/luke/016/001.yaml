  source_fidelity: 原文の基本的な内容はよく反映されている。οἰκονόμοςを「財産を管理する者」とし、αὐτοῦを主人の財産と明示したことも適切である。ただし、διεβλήθη αὐτῷは管理者について主人へ不利な訴え・報告がなされたことを述べるため、「主人に訴えがあった」よりも、訴えの内容と到達先を明瞭にする必要がある。
  naturalness: 「この者が主人の財産を浪費していると、主人に訴えがあった」は引用・内容節のつながりが不自然である。『～との訴えが、主人のもとにあった』とすれば、現代標準日本語として自然であり、告発が事実と確定したわけではないという含みも保てる。また、引用符の閉じが必要である。
  terminology: 「財産を管理する者」は明瞭で、家令という伝統的な訳語を脚注で補う方針もよい。「訴え」はδιαβάλλωの告発・不利な報告の語感を表せるが、脚注により真偽未確定であることを適切に補足している。
