id: LUK.16.3
reference: Luke 16:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ἐν ἑαυτῷ ὁ οἰκονόμος· Τί ποιήσω ὅτι ὁ κύριός μου ἀφαιρεῖται τὴν οἰκονομίαν ἀπ’ ἐμοῦ; σκάπτειν οὐκ ἰσχύω, ἐπαιτεῖν αἰσχύνομαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/003.yaml
  text: Then the manager said to himself[a], ‘What will I do, since my master is taking the management away from me? I am not strong enough to dig, and I am ashamed to beg.’
translation:
  language: ja
  text: そこで、管理人[a]は心の中でこう言った。「どうしよう。主人が私から管理の職を取り上げている。土を掘る力もないし、物乞いをするのは恥ずかしい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「管理人」と「管理の職」に当たるギリシア語は、同じ語根からできている。別訳「家令」「家令の職」。
    reason: 原文にある人物と職務の語源的な対応、および伝統的な訳語の可能性を示すため。
lexical_decisions:
- source_word: οἰκονόμος / οἰκονομία
  choice: 管理人 / 管理の仕事
  rationale: 人とその職務を表す同語根の語の対応を、現代日本語で明瞭かつ自然に示す。「家令／家令職」などより一般読者に分かりやすい。
- source_word: ἐν ἑαυτῷ
  choice: 心の中でこう言った
  rationale: 内面的な独白を表す慣用句として自然であり、原文の「言った」も保つ。
- source_word: Τί ποιήσω
  choice: どうしよう
  rationale: 今後の行動について自問する審議的接続法のニュアンスを、自然な日本語の独白で表す。
- source_word: κύριός μου
  choice: 主人
  rationale: たとえ話の中の人間の上位者を指すため、神学的称号を連想させる「主」ではなく、権限関係を明確にする「主人」とした。
- source_word: ἀφαιρεῖται ... ἀπ’ ἐμοῦ
  choice: 私から…取り上げようとしている
  rationale: 職務を本人から奪う意味と、差し迫った進行的状況を表す。
- source_word: σκάπτειν οὐκ ἰσχύω
  choice: 土を掘るだけの力はない
  rationale: σκάπτεινの文字どおりの掘削労働と、ἰσχύωがここで示す身体的な力不足を明示する。
- source_word: ἐπαιτεῖν αἰσχύνομαι
  choice: 物乞いをするのは恥ずかしい
  rationale: 施しを求めて物乞いする意味と、それに対する本人の羞恥を率直に表す。
theological_decisions:
- issue: 非神的文脈における κύριος の訳語
  choice: 主人
  alternative: 主／所有者
  rationale: ここではたとえ話に登場する管理人の人間の上位者を指す。「主」は不要な神学的含意を招き、「所有者」は権限関係をやや狭く限定するため、「主人」が文脈に最も適する。
translation_notes:
  register: 明瞭な現代標準日本語による、自然で品位ある独白。「どうしよう」で切迫した自問を表し、後続の二つの不安を簡潔に並べた。
