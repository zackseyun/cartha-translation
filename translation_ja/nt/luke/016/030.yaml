  text: ὁ δὲ εἶπεν· Οὐχί, πάτερ Ἀβραάμ, ἀλλ’ ἐάν τις ἀπὸ νεκρῶν πορευθῇ πρὸς αὐτοὺς μετανοήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/030.yaml
  text: But he said[a], ‘No, father Abraham, but if someone goes to them from among the dead, they will change their thinking.’
translation:
  language: ja
  text: しかし彼は言った。「いいえ、父アブラハム。ですが、もし死者の中からだれかが彼らのところへ行けば、彼らは悔い改めるでしょう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐχί
  choice: いいえ
  rationale: 直前のアブラハムの言葉を強く否定する応答。現代日本語の直接話法として自然で、反論の力も保つ。
- source_word: πάτερ Ἀβραάμ
  choice: 父アブラハム
  rationale: 祖先であるアブラハムへの呼びかけ。「父」は称号化せず、血統上のつながりに訴える響きを保つ。
- source_word: ἀλλ’ ἐάν
  choice: もし…なら
  rationale: 先の否定を受けて、対案となる条件を示す。日本語では「いいえ」に続けて条件節を置くことで、対照を自然に表せる。
- source_word: τις
  choice: だれか
  rationale: 不定代名詞の単数を、人物について自然な日本語で表す。
- source_word: ἀπὸ νεκρῶν
  choice: 死者の中から
  rationale: 複数形 νεκρῶν と起点を示す ἀπό を反映し、死者の一人がその中から赴くという含みを保つ。
- source_word: πορευθῇ πρὸς αὐτοὺς
  choice: 彼らのところへ行けば
  rationale: 移動を表す πορεύομαι と方向を示す πρὸς を自然に表し、ἐάν を伴う未来的条件を「行けば」とする。
- source_word: μετανοήσουσιν
  choice: 彼らは悔い改めるでしょう
  rationale: ルカ文書での道徳的・霊的な方向転換という意味を保つ。「考えを変える」では単なる意見変更に狭まりうるため、定着した「悔い改める」を用いる。
theological_decisions:
- issue: μετανοέω の意味範囲
  choice: 悔い改める
  alternative: 考えを変える／立ち返る
  rationale: 文脈は神の警告への応答としての倫理的・霊的転換を扱う。「悔い改める」はその力を保ちつつ、特定教派の教義を付加しない。
- issue: ἀπὸ νεκρῶν の表現
  choice: 死者の中から
  alternative: 死者のもとから／死人の中から
  rationale: 復活の仕組みを本文以上に規定せず、複数の死者の中から来るという原文の表現を透明に示す。
translation_notes:
  register: 明瞭で現代的な標準日本語。会話として自然でありながら、聖書本文にふさわしい品位を保った。「しかし」と「もし」の重複を避け、否定の応答から条件提示への流れを日本語として整えた。
