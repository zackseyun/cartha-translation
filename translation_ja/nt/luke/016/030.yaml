  source_fidelity: 「死者の中から」「だれかが彼らのところへ行けば」「悔い改める」は、それぞれ ἀπὸ νεκρῶν、τις…πορευθῇ πρὸς αὐτούς、μετανοήσουσιν を適切に反映している。しかし、ἀλλ’ ἐάν の訂正・対照を現行文は明示しておらず、条件節だけにしているため、前節の「モーセと預言者に聞き従うなら足りる」という主張への反論のつながりが弱まる。
