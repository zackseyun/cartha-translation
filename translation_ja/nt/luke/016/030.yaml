  terminology: 「父アブラハム」は祖先への呼びかけとして適切であり、称号的な過度の解釈を加えない。「悔い改める」はこの文脈の μετανοέω の倫理的・霊的な転換を保つ定着した語である。「死者の中から」は複数形と起点の含意を自然に示す。
