  text: and longing to be fed from what fell from the rich man's table[a]. But even the dogs came and licked his sores.
translation:
  language: ja
  text: そして、金持ちの食卓から落ちるもので[a]腹を満たしたいと切望していた。そればかりか、犬までやって来て、彼のできものをなめていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「金持ちの食卓から落ちる食べ物のくずで」。ギリシア語は直訳すると「落ちるもので」であり、「食べ物のくず」は食事の場面から補った表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιθυμῶν
  choice: 切望していた
  rationale: 現在分詞が表す持続的で強い願いを、自然な現代日本語で示す。
- source_word: χορτασθῆναι
  choice: 腹を満たしたい
  rationale: 食物によって十分に満たされるという受動的な意味を、文脈に即して分かりやすく表す。
- source_word: ἀπὸ τῶν πιπτόντων
  choice: 落ちるもので
  rationale: 冠詞付き分詞の実詞的用法を反映し、原文に明示されていない「食べ物のくず」を本文へ補わない。
- source_word: τῆς τραπέζης τοῦ πλουσίου
  choice: 金持ちの食卓から
  rationale: 食事の場としてのτράπεζαと、名詞的に用いられた「金持ち」を簡潔で自然に表す。
- source_word: ἀλλὰ καὶ
  choice: そればかりか、…まで
  rationale: 逆接を伴う追加と、その意外性・強調を日本語で明確にする。
- source_word: οἱ κύνες
  choice: 犬
  rationale: 原文どおり複数の犬を集合的に表し、不必要な限定や婉曲化を加えない。
- source_word: ἐρχόμενοι ἐπέλειχον
  choice: やって来て、…なめていた
  rationale: 付帯状況の分詞を自然に主動詞へつなぎ、未完了過去が示す継続・反復的な動作を「なめていた」で表す。
- source_word: τὰ ἕλκη αὐτοῦ
  choice: 彼のできもの
  rationale: 潰瘍性の患部を指す語を、過度に医学的にならない一般的な日本語で表す。
