id: LUK.16.12
reference: Luke 16:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰ ἐν τῷ ἀλλοτρίῳ πιστοὶ οὐκ ἐγένεσθε, τὸ ⸀ὑμέτερον τίς ⸂δώσει ὑμῖν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/012.yaml
  text: And if you have not been faithful with what belongs to another[c][b][a], who will give you what is your own?
translation:
  language: ja
  text: また、他人のもの[a]に忠実でなかったなら、だれがあなたがた自身のもの[b]を与えてくれるでしょうか。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「他人の財産」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたに属するもの」。
    reason: lexical_alternative
  - marker: c
    text: この対比は、今この世の富を忠実に扱うことと、後に真の富または永続する富を受けることを指す可能性がある。ただし、この節自体は両者の指示対象を明言していない。
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλοτρίῳ
  choice: 他人のもの
  rationale: 定冠詞を伴う中性単数の形容詞が名詞的に用いられ、「他人に属するもの」を意味する。簡潔で自然な日本語とし、所有の対比を保った。
- source_word: πιστοὶ
  choice: 忠実
  rationale: ここでは信仰を持つことではなく、任されたものを扱う際の信頼性を表すため、「忠実」とした。
- source_word: οὐκ ἐγένεσθε
  choice: 忠実でなかった
  rationale: γίνομαι のアオリストは、ここでは「そのような者となる／そのようであることを示す」という含みを持つが、条件文として自然な日本語にした。
- source_word: τὸ ὑμέτερον
  choice: あなたがた自身のもの
  rationale: 定冠詞を伴う中性単数の所有形容詞が名詞的に用いられ、「あなたがたに属するもの」を表す。「自身」を加えて、ἀλλοτρίῳ との対比を明確にした。
- source_word: δώσει ὑμῖν
  choice: あなたがた自身のものを与えてくれる
  rationale: δίδωμι の基本義「与える」を保った。「任せる」と訳すことも文脈上可能だが、解釈を狭めないよう避けた。日本語の受益表現として「くれる」を用いた。
- source_word: καὶ εἰ
  choice: また、…なら
  rationale: καί による前節との連続を「また」で示し、εἰ の条件を「なら」で表した。
- source_word: τίς
  choice: だれが
  rationale: 与え手を問う修辞疑問として、直接的で自然な訳語を選んだ。
theological_decisions:
- issue: 「他人のもの」と「あなたがた自身のもの」の指示対象
  choice: 本文では両者の指示対象を特定せず、対比をそのまま示す。
  alternative: 前者をこの世の富、後者を将来与えられる真の富または永続する富と明示する。
  rationale: 前節とのつながりからその解釈は有力だが、この節自体は指示対象を明言していない。終末的相続や新たな管理の委託を指す可能性も含め、原文の含みを残した。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準語を用いた。修辞疑問の力を保ち、所有をめぐる意図的な逆説を説明的に言い換えなかった。
