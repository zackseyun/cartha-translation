source:
  edition: SBLGNT
  text: Εὐκοπώτερον δέ ἐστιν τὸν οὐρανὸν καὶ τὴν γῆν παρελθεῖν ἢ τοῦ νόμου μίαν κεραίαν πεσεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/017.yaml
  text: But it is easier for heaven and earth to pass away than for one stroke of a letter of the Law to fall[a].
translation:
  language: ja
  text: しかし、律法の文字の一画[a]が失われるよりは、天地が過ぎ去るほうが容易である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、文字のごく小さな線または突起を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εὐκοπώτερον
  choice: 容易である
  rationale: 比較の構文「～よりは…ほうが容易である」によって、「より容易である／より起こりやすい」という意味を自然な現代日本語で表した。
- source_word: δέ
  choice: しかし
  rationale: 前後を結びつけつつ軽い対照を示す接続詞として訳した。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν
  choice: 天地
  rationale: 被造世界全体を指す聖書的な対句を、簡潔で定着した日本語表現で保持した。
- source_word: παρελθεῖν
  choice: 過ぎ去る
  rationale: 単に通過することではなく、天地が消滅することを含意する文脈上の意味を、原文の比喩を保って表した。
- source_word: τοῦ νόμου
  choice: 律法
  rationale: 一般的な法ではなく、ユダヤ教聖書の律法を指す文脈に合う定着した訳語を用いた。
- source_word: μίαν κεραίαν
  choice: 文字の一画
  rationale: κεραίαは文字を形作り、あるいは文字同士を区別するごく小さな線を指す。「一画」だけでは何の一画か曖昧になりうるため、「文字の」を補って明確にした。
- source_word: πεσεῖν
  choice: 失われる
  rationale: 字義は「落ちる」だが、ここでは律法の最小部分が脱落し、効力を失うことを表す。「失われる」は日本語として自然であり、文脈上の含意を過度に限定しない。
theological_decisions:
- issue: νόμοςの指示対象
  choice: 聖書に啓示された「律法」
  alternative: 一般的な法則・法律
  rationale: 直前の文脈と、律法の文字上の最小部分に言及する表現から、一般的な法律ではなく聖書の律法を指すと判断した。ただし、その範囲や適用について本文以上の教理的説明は加えていない。
- issue: 律法の永続性を表すπεσεῖν
  choice: 「失われる」とし、最小部分の脱落・無効化を含みうる表現にする
  alternative: 字義どおり「落ちる」
  rationale: 「落ちる」という原文の像は日本語では意味が伝わりにくい。「失われる」によって、律法の細部さえ消滅・脱落しないという比較の力を保ちつつ、具体的な神学体系へ限定しないようにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「天地」「律法」「過ぎ去る」という聖書的で格調ある語彙を保持した。比較構文を日本語として自然な順序に整え、原文の強い対比を明確にした。
