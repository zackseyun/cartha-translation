id: LUK.16.18
reference: Luke 16:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πᾶς ὁ ἀπολύων τὴν γυναῖκα αὐτοῦ καὶ γαμῶν ἑτέραν μοιχεύει, ⸀καὶ ὁ ἀπολελυμένην ἀπὸ ἀνδρὸς γαμῶν μοιχεύει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/018.yaml
  text: Everyone who divorces his wife and marries another commits adultery[b][a], and he who marries a woman divorced from her husband commits adultery.
translation:
  language: ja
  text: 自分の妻を離縁して別の女性と結婚する者は皆、姦淫を犯す。また、夫から離縁された女性と結婚する者も、姦淫を犯す。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πᾶς ὁ
  choice: 者は皆
  rationale: 冠詞付き分詞句を一般化する πᾶς の普遍的な範囲を、自然な現代日本語で表した。
- source_word: ἀπολύων
  choice: 離縁して
  rationale: 婚姻の文脈では「解放する」「去らせる」ではなく、婚姻関係を解消する意味である。「離婚して」も可能だが、行為の法的・関係的な響きを保つため「離縁して」とした。
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: 自分の妻
  rationale: γυνή はこの婚姻文脈では「女」ではなく「妻」を意味する。再帰的に自然な日本語となるよう αὐτοῦ を「自分の」とした。
- source_word: γαμῶν ἑτέραν
  choice: 別の女と結婚する
  rationale: ἑτέραν は女性形で、先の妻とは別の女性を指す。日本語では目的語を明示したほうが自然であるため「別の女」とした。
- source_word: μοιχεύει
  choice: 姦淫を犯す
  rationale: 動詞の道徳的・婚姻的意味を明確にする、標準的で厳粛な表現である。
- source_word: ἀπολελυμένην ἀπὸ ἀνδρός
  choice: 夫から離縁された女
  rationale: 完了受動分詞は、離縁されてその状態にある女性を表す。ἀνήρ はここでは婚姻文脈により「夫」、ἀπό は原文の表現に沿って「から」とした。
theological_decisions:
- issue: 離縁と再婚に関するイエスの言葉の範囲と強さ
  choice: ルカ本文どおり、例外規定を加えない一般的な断言として訳す。
  alternative: マタイの並行箇所などを調和させ、性的な不品行に関する例外を暗黙に補う。
  rationale: この節のギリシア語本文には例外句がない。別の箇所から限定を持ち込まず、ルカの簡潔で緊張を伴う言い方をそのまま保った。
- issue: ἀπὸ ἀνδρός の関係
  choice: 「夫から離縁された」と訳し、原文の前置詞表現を保つ。
  alternative: 「夫に離縁された」として行為者を明示する。
  rationale: 受動分詞との組み合わせから夫が離縁の行為者である可能性は高いが、ἀπό 自体は「から」を表すため、訳文で必要以上に文法関係を限定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの格言的で厳粛な調子を保った。「離縁」は「離婚」よりやや格調があるが、一般読者にも理解可能で、古代の婚姻解消を現代の制度用語だけに狭めにくい。原文にない例外や解釈上の限定は補っていない。
