reference: Luke 16:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φωνήσας αὐτὸν εἶπεν αὐτῷ· Τί τοῦτο ἀκούω περὶ σοῦ; ἀπόδος τὸν λόγον τῆς οἰκονομίας σου, οὐ γὰρ ⸀δύνῃ ἔτι οἰκονομεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/002.yaml
  text: And after calling him[a], he said to him, “What is this that I hear about you? Give an account of your stewardship[b], for you are no longer able to manage.”
translation:
  language: ja
  text: そして主人は彼を呼んで、こう言った。「これは、あなたについて私が聞いている何なのか。あなたの管理について会計報告を出しなさい。[a] もう管理人として務めることはできないからだ。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの管理についての決算をしなさい」または「あなたの管理職務について報告しなさい」。
    reason: λόγοςとοἰκονομίαには、会計上の決算と管理職務全般の報告の双方を含み得るため。
  - marker: b
    text: 別訳「もう管理を続けることはできないからだ」。
    reason: οἰκονομεῖνは「管理する」とも「管理人として務める」とも訳せるため。
lexical_decisions:
- source_word: φωνήσας αὐτόν
  choice: 彼を呼んで
  rationale: アオリスト分詞が主動詞に先立つ行為を表しているため、自然な日本語で行為の順序を示した。文脈上、主人が管理人を呼び出すことだが、「呼びつけて」ほど強い語調は原文に明示されていない。
- source_word: Τί τοῦτο ἀκούω περὶ σοῦ;
  choice: あなたについて聞いているこの話は何なのか
  rationale: τί τοῦτο の問いかけの力を保ちつつ、περὶ σοῦを「あなたについて」と明示した。「この話」により、聞いた内容・報告を指す自然な日本語とした。
- source_word: ἀπόδος τὸν λόγον
  choice: 会計報告を出しなさい
  rationale: 行政・財産管理の文脈でλόγοςは計算や収支についての報告を指す。ἀπόδοςは要求に応じて提出する意味なので、「出しなさい」とした。
- source_word: τῆς οἰκονομίας σου
  choice: あなたの管理について
  rationale: οἰκονομίαは他人の家財・資産を管理する職務と責任を指す。「管理」は現代日本語で明瞭であり、直後の「管理人」との語義上のつながりも保つ。
- source_word: οὐ γὰρ δύνῃ ἔτι οἰκονομεῖν
  choice: もう管理人として務めることはできないからだ
  rationale: δύνῃと不定詞が表す「もはやできない」を保持し、οἰκονομεῖνを単なる一般的管理ではなく、管理人の職務を果たすこととして明示した。主人側の行為に言い換えず、二人称の表現を保った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、主人が管理人を問いただす厳粛な場面にふさわしい語調とした。「何なのか」「出しなさい」により直接話法の強さを保ち、過度に古風な「会計を差し出せ」「家令職」などは避けた。
