id: LUK.16.16
reference: Luke 16:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ νόμος καὶ οἱ προφῆται ⸀μέχρι Ἰωάννου· ἀπὸ τότε ἡ βασιλεία τοῦ θεοῦ εὐαγγελίζεται καὶ πᾶς εἰς αὐτὴν βιάζεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/016.yaml
  text: The Law and the Prophets were until John; from then on the kingdom of God is being proclaimed as good news, and everyone is forcing his way into it.
translation:
  language: ja
  text: 「律法と預言者」はヨハネまでである。それ以来、神の国が良い知らせとして宣べ伝えられ、だれもがそこへ力ずくで入ろうとしている。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「だれもがそこへ押し入っている」とも訳せる。ギリシア語の動詞は、力を込めた激しい動きを表し得る。
    reason: lexical_alternative
  - marker: b
    text: マタイ11章12節の類似した言葉に照らして、最後の部分をより否定的に理解する見方もある。ただし、ここで動詞の主語は「神の国」ではなく「だれもが」である。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ νόμος καὶ οἱ προφῆται
  choice: 「律法と預言者」
  rationale: モーセの律法と預言書から成る聖書的区分を示す定型的な組み合わせとして、かぎ括弧で一まとまりの呼称であることを明確にした。
- source_word: μέχρι Ἰωάννου
  choice: ヨハネまでである
  rationale: 救いの歴史における時間的な境を簡潔に保つ。文脈上、バプテスマのヨハネを指すため説明語は本文に補わない。
- source_word: ἀπὸ τότε
  choice: それ以来
  rationale: ヨハネを境とする時点から現在まで続く推移を、自然な現代日本語で表す。
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: 神の国
  rationale: βασιλείαが持つ領域と支配の両面を狭めずに保つ、日本語聖書で定着した自然な表現。
- source_word: εὐαγγελίζεται
  choice: 良い知らせとして宣べ伝えられ
  rationale: 現在受動形の継続的な宣教を示しつつ、εὐαγγελίζωに含まれる「良い知らせ」の意味を明示する。
- source_word: πᾶς
  choice: だれもが
  rationale: 単数形の分配的な意味を自然な日本語で表し、対象を不必要に限定しない。
- source_word: εἰς αὐτὴν
  choice: そこへ
  rationale: 女性名詞である「神の国」を受け、方向・進入を示すεἰςを自然に表す。
- source_word: βιάζεται
  choice: 力ずくで入ろうとしている
  rationale: 中動・受動形として解釈の難しい語だが、πᾶςを主語、εἰς αὐτήνを進入方向と見る統語に従い、強い力を伴う進入のニュアンスを保持した。
theological_decisions:
- issue: βιάζεταιと神の国との関係
  choice: 人々が神の国へ力強く、力ずくで入ろうとしているという意味に訳す。
  alternative: 人々が神の国へ押し入っている。あるいは、神の国が暴力を受けているという否定的な理解。
  rationale: ルカ本文ではπᾶς（「だれもが」）がβιάζεταιの主語であり、εἰς αὐτήνは神の国への方向を示すのが自然である。ただし動詞には強制・暴力の語感があり、意味の難しさを脚注で保った。自力による救いという教理的含意は付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「宣べ伝えられ」は聖書的な響きを残しつつ一般にも理解可能。「力ずく」は原語の強い語感を保つが、解釈の幅は脚注で明示した。
