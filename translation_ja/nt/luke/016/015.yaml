  to: イエスは彼らに言われた。「あなたがたは、人々の前で自分を正しいとする者です。しかし、神はあなたがたの心を知っておられます。なぜなら、人々の間で高く評価されているもの[a]は、神の前では忌まわしいものだからです。」
