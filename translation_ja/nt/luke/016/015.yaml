  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς· Ὑμεῖς ἐστε οἱ δικαιοῦντες ἑαυτοὺς ἐνώπιον τῶν ἀνθρώπων, ὁ δὲ θεὸς γινώσκει τὰς καρδίας ὑμῶν· ὅτι τὸ ἐν ἀνθρώποις ὑψηλὸν βδέλυγμα ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/016/015.yaml
  text: And he said to them[a], “You are the ones who justify yourselves before men, but God knows your hearts[c][b]. For what is exalted among men is detestable before God.”
translation:
  language: ja
  text: イエスは彼らに言われた。「あなたがたは、人々の前で自分を正しいとする者です。しかし、神はあなたがたの心を知っておられます。なぜなら、人々の間で高く評価されているもの[a]は、神の前では忌まわしいものだからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人々の間で高いもの」とも訳せる。
    reason: ὑψηλόν がもつ高さの比喩を保つ別訳を示すため。
lexical_decisions:
- source_word: δικαιοῦντες ἑαυτοὺς
  choice: 自分を正しいとする
  rationale: 再帰目的語を伴う現在分詞であり、ここでは人前で自分を正しい者として示すことを指す。「正当化する」より自然でありつつ、法廷的・道徳的な含みを保つ。
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: 人々の前で
  rationale: ἐνώπιον の「前で／目の前で」と、ἀνθρώπων の一般的な「人々」を自然な現代日本語で表す。
- source_word: γινώσκει τὰς καρδίας ὑμῶν
  choice: あなたがたの心を知っておられます
  rationale: καρδίας を、動機や思いを含む内面の比喩として「心」と訳し、原文の簡潔さを保つ。
- source_word: τὸ ἐν ἀνθρώποις ὑψηλὸν
  choice: 人々の間で高く評価されているもの
  rationale: ὑψηλόν の高さの比喩はやや弱まるが、この文脈での社会的な尊重・評価という意味を明瞭で自然な日本語にする。「高くされているもの」では不自然になりやすい。
- source_word: βδέλυγμα
  choice: 忌まわしいもの
  rationale: 神の前で嫌悪される対象という強い意味を、現代日本語で品位を保って表す。「忌むべきもの」も可能。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の前では
  rationale: 前半の「人々の前で」と対応させ、人間の評価と神の評価の対照を保つ。
- source_word: Ὑμεῖς ἐστε οἱ δικαιοῦντες
  choice: あなたがたは…者たちです
  rationale: 明示された主語代名詞と冠詞付き分詞が持つ強調を、「あなたがたは」と「者たちです」によって表す。
theological_decisions:
- issue: δικαιοῦντες ἑαυτοὺς の意味
  choice: 人々の前で自分を正しいとする
  alternative: 人々の前で自分を正当化する
  rationale: 神が義と認めることではなく、自らを人前で義なる者として提示する行為を表す。語義上の法廷的響きを残しつつ、日本語で誤解されにくい表現を選ぶ。
- issue: τὸ ἐν ἀνθρώποις ὑψηλὸν の意味
  choice: 人々の間で高く評価されているもの
  alternative: 人々の間で高くされているもの
  rationale: 社会的に高く見られ、重んじられるものを指しうる。高さの比喩を直訳する案もあるが、意味が不透明になるため、主文では評価の意味を明示し、脚注で直訳寄りの可能性を示す。
- issue: βδέλυγμα の強さ
  choice: 忌まわしいもの
  alternative: 忌むべきもの
  rationale: 単なる「好ましくないもの」ではなく、神の前で嫌悪されるものという強い否定を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの厳しい対比と格調を保った。「そこで」は καί の談話上の接続を自然に表す。敬語は「言われた」「知っておられます」に限定し、過度に古風な文体を避けた。
