  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν δέ τις ⸂ἐκ τοῦ ὄχλου αὐτῷ⸃· Διδάσκαλε, εἰπὲ τῷ ἀδελφῷ μου μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/013.yaml
  text: Then someone from the crowd said to him[a], “Teacher, tell my brother to divide the inheritance with me.”
translation:
  language: ja
  text: すると、群衆の中の一人がイエスに言った。「先生、私の兄弟に、遺産を私と分けるよう言ってください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: すると、…言った
  rationale: δέは弱い接続を表す。文脈の進行を自然に示し、強い対比を持ち込まない「すると」とした。
- source_word: τις ἐκ τοῦ ὄχλου
  choice: 群衆の中の一人
  rationale: 不特定の人物が群衆の中にいたことを、簡潔で自然な現代日本語で表した。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 代名詞の指示対象を日本語で明確にするため、文脈上の人物名を補った。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 教える者への呼びかけとして、現代日本語で平明かつ敬意のある表現。
- source_word: εἰπὲ τῷ ἀδελφῷ μου
  choice: 私の兄弟に…言ってください
  rationale: 命令形はここではイエスへの依頼として機能するため、丁寧な依頼表現にした。「兄弟」は年長・年少を特定しない原文の曖昧さを保つ。
- source_word: μερίσασθαι μετ’ ἐμοῦ τὴν κληρονομίαν
  choice: 遺産を私と分けるよう
  rationale: μερίζομαιの分割・分配の意味と、μετάの共同・参与の表現を直接的に保ち、法的状況を過度に限定しない。
theological_decisions: []
