  text: καὶ ⸀ὑμεῖς γίνεσθε ἕτοιμοι, ὅτι ᾗ ὥρᾳ οὐ δοκεῖτε ὁ υἱὸς τοῦ ἀνθρώπου ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/040.yaml
  text: You also must be ready[c][b][a], because the Son of Man is coming at an hour you do not expect.
translation:
  language: ja
  text: あなたがたも備えていなさい。[a] 思いがけない時に、[b]人の子[c]が来るからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたも用意をしていなさい」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたが予期しない時に」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語では「人の子」。イエスがご自分を指して用いる称号で、ダニエル書7章13–14節を踏まえている可能性が高い。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: καίと明示されたὑμεῖςの組み合わせが示す包含と強調を自然に表し、直前のたとえに登場する僕たちと同じく、聞き手にも備えが求められていることを示す。
- source_word: γίνεσθε ἕτοιμοι
  choice: 用意していなさい
  rationale: 現在命令形が求める継続的な備えの状態を、現代日本語として自然な命令表現で示す。「用意しなさい」より、備えた状態を保つ含みが明瞭である。
- source_word: ὅτι
  choice: からです
  rationale: 命令の理由を導く接続語として、文末に置く日本語の自然な因果表現を用いた。
- source_word: ᾗ ὥρᾳ οὐ δοκεῖτε
  choice: 思いがけない時に
  rationale: 直訳的には「あなたがたがそうとは思わない時に」だが、ここでは到来を予期していない時を指すため、簡潔で自然な「思いがけない時に」とした。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した字義的表現を保ち、ダニエル書7章を想起させる終末論的・メシア的響きを失わないようにした。
- source_word: ἔρχεται
  choice: 来る
  rationale: 未来的に用いられたギリシア語現在形を、日本語の非過去形「来る」で自然に表し、到来の切迫感を保った。
theological_decisions:
- issue: キリスト論的称号 ὁ υἱὸς τοῦ ἀνθρώπου の訳
  choice: 人の子
  alternative: 人間である者
  rationale: 称号の字義的な形と聖書内の響き、特にダニエル書7章13–14節との関連を保持するため。本文が明言する以上の教理的説明は訳文に加えない。
- issue: 終末的発言における ἔρχεται の時制
  choice: 来る
  alternative: 来ようとしている／来ることになる
  rationale: ギリシア語現在形の生き生きとした警告の調子を日本語の非過去形で保ちつつ、特定の終末論体系に踏み込まない。
translation_notes:
  register: 明快な現代標準日本語を用い、命令の切迫感と継続性を保った。「人の子」は伝統的かつ透明性の高い聖書用語として維持し、説明は脚注に置いた。
