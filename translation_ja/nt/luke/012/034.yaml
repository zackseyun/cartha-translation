  text: ὅπου γάρ ἐστιν ὁ θησαυρὸς ὑμῶν, ἐκεῖ καὶ ἡ καρδία ὑμῶν ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/034.yaml
  text: For where your treasure is[a], there your heart will be also.
translation:
  language: ja
  text: あなたがたの宝のあるところに、あなたがたの心もあることになるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου
  choice: ところに
  rationale: 場所を示す関係表現として自然であり、ἐκεῖとの「あるところに……も」という対応を日本語で明瞭に表す。
- source_word: γάρ
  choice: （訳出せず）
  rationale: 前節の勧めを理由づける接続辞だが、単独節として自然な現代日本語にするため明示しない。その説明的関係は文脈から十分に伝わる。
- source_word: θησαυρός
  choice: 宝
  rationale: 財宝という文脈上の具体性と、人が価値を置くものという比喩的含意の両方を保つ。
- source_word: καρδία
  choice: 心
  rationale: 感情だけでなく、願い、価値判断、意志を含む人の内的中心を表す聖書的表現として保持する。
- source_word: ἐκεῖ
  choice: そこに（構文上「ところに」に統合）
  rationale: 逐語的な「そこに」を重ねるより、「宝のあるところに、心もある」という日本語の相関構文で場所の対応を自然に示す。
- source_word: καὶ
  choice: も
  rationale: 宝の所在に心も伴うという付加・対応の意味を簡潔に表す。
- source_word: ἔσται
  choice: あるのです
  rationale: ギリシア語は未来形だが、ここでは格言的な確実性を表す。日本語では現在形が自然であり、英語POBの脚注が示す可能な表現にも対応する。未来性を明示する別訳を脚注に残す。
- source_word: ὑμῶν
  choice: あなたがたの
  rationale: 二人称複数を明示し、聞き手全体への呼びかけを保つ。
theological_decisions:
- issue: 「心」の人間論的意味
  choice: 「心」を保持する
  alternative: 「願い」「思い」「関心」と解釈的に訳す
  rationale: この語は人の愛着、価値判断、意志、内的方向性を広く含みうるため、一つの心理的側面に限定しない。
- issue: 未来形 ἔσται の扱い
  choice: 格言的な確実性として自然な現在形「あるのです」とする
  alternative: 「あることになります」「あるでしょう」と未来形を明示する
  rationale: 原文の未来形は、宝を置く場所に心が向かう結果または確実な対応を表しうる。本文では自然な日本語の格言表現を優先し、形態上の未来性は脚注で示す。
translation_notes:
  register: 明快で現代的な標準語を用いつつ、格言としての簡潔さと荘重さを保った。「あなたがた」を二度用いて原文の反復と複数形を示した。
