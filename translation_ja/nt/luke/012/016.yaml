  yaml_path: translation/nt/luke/012/016.yaml
  text: Then he told them a parable[a], saying, “The land of a certain rich man produced abundantly.”
translation:
  language: ja
  text: そこで、イエスは彼らにたとえを語られた。「ある金持ちの土地が豊かな収穫をもたらした[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「多くの収穫をもたらした」「非常に実りが多かった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν δὲ
  choice: そこでイエスは…語られた
  rationale: δέを文脈の進行を示す穏やかな接続として「そこで」とし、主語は直前の文脈から明らかなイエスを補った。日本語として自然であり、強い対立は持ち込まない。
- source_word: παραβολὴν
  choice: たとえ
  rationale: 福音書における標準的な物語形式を示し、現代日本語で広く理解される「たとえ」とした。
- source_word: πρὸς αὐτοὺς
  choice: 彼らに
  rationale: 語りかけの相手を明示し、ギリシア語の前置詞句を自然に保持した。
- source_word: λέγων
  choice: 「…」
  rationale: 分詞が導入する発話内容を、日本語では直接話法の引用符によって自然に表した。
- source_word: Ἀνθρώπου τινὸς πλουσίου
  choice: ある金持ちの
  rationale: τινόςの不特定性を「ある」で保ち、πλουσίουとἈνθρώπουの意味を簡潔な現代日本語で表した。
- source_word: εὐφόρησεν
  choice: 豊かに実った
  rationale: 土地がよく産出したという農業的意味を、自然で簡潔な日本語にした。土地を主語とする比喩的表現も保持している。
- source_word: ἡ χώρα
  choice: 土地
  rationale: ここでは国や地方ではなく、金持ちが所有する耕作地・地所を指すため「土地」とした。
