source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν, πᾶς ὃς ἂν ⸀ὁμολογήσῃ ἐν ἐμοὶ ἔμπροσθεν τῶν ἀνθρώπων, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ὁμολογήσει ἐν αὐτῷ ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/008.yaml
  text: And I tell you[a], everyone who confesses me before men, the Son of Man also will confess before the angels of God.
translation:
  language: ja
  text: また、あなたがたに言います。人々の前でわたしを認める者はだれでも[a]、人の子も神の天使たちの前でその人を認めます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人々の前でわたしを公に認める者はだれでも」とも訳せる。原文の「認める」には、公に認めて言い表す意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δὲ ὑμῖν
  choice: そこで、あなたがたに言います
  rationale: δέは前後をつなぐ軽い接続であり、文脈上の流れを自然に示す「そこで」とした。λέγωの厳粛な宣言の響きは「言います」で保った。
- source_word: πᾶς ὃς ἂν
  choice: …者はみな
  rationale: 不定の一般条件とその普遍的範囲を、自然な現代日本語で表した。
- source_word: ὁμολογήσῃ / ὁμολογήσει
  choice: 認める／認めます
  rationale: ここでは公に認知・表明する意味。「告白する」より日常語として明瞭で、同じ動詞を両節で同じ語にして相互対応を保った。
- source_word: ἐν ἐμοὶ / ἐν αὐτῷ
  choice: わたしを／その人を
  rationale: ὁμολογέωに伴うἐνは直訳的な「わたしにあって」では日本語として不明瞭になるため、対象を示す自然な目的語として訳した。
- source_word: ἔμπροσθεν τῶν ἀνθρώπων
  choice: 人々の前で
  rationale: ἄνθρωποιはここで人間一般を指す代表的用法であり、現代日本語の「人々」が性別を不必要に限定せず原意を明瞭に伝える。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した表現を保ち、ダニエル書を背景とする称号上の含意を残した。
- source_word: ἔμπροσθεν τῶν ἀγγέλων τοῦ θεοῦ
  choice: 神の御使いたちの前で
  rationale: 天上の公的な承認という場面を保ちつつ、ἄγγελοιを聖書日本語として自然で荘重な「御使いたち」とした。
theological_decisions:
- issue: ὁμολογέω＋ἐν＋与格の相互的表現
  choice: 「わたしを認める……その人を認めます」と慣用的に訳す
  alternative: 「わたしにあって告白する……その人にあって告白する」
  rationale: 前置詞を逐語的に再現すると日本語では意味が曖昧になりやすい。公の承認という意味と、地上での行為に対する人の子の相応する行為を保った。
- issue: ἀνθρώπωνの性の表現
  choice: 「人々」
  alternative: 「男たち」「人間たち」
  rationale: 文法上は男性複数形だが、ここでは男女を含む人間一般を指す。「人々」はその代表的範囲を現代日本語で正確に表し、原文にない男性限定を生じさせない。
- issue: 人の子による将来の承認
  choice: 単純未来として「認めます」
  alternative: 終末の裁判で弁護すると明示する
  rationale: 天上の法廷を思わせる含意はあるが、本文は時や法廷的機能を明示しないため、解釈を本文に付加せず緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの宣言としての荘重さを保った。「御使い」「人の子」は一般読者にも理解可能な聖書用語として維持した。
