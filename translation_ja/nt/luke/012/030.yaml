id: LUK.12.30
reference: Luke 12:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα γὰρ πάντα τὰ ἔθνη τοῦ κόσμου ⸀ἐπιζητοῦσιν, ὑμῶν δὲ ὁ πατὴρ οἶδεν ὅτι χρῄζετε τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/030.yaml
  text: For all these things the nations of the world seek[a], but your Father knows that you need these things.
translation:
  language: ja
  text: というのも、世の国々の人々は、これらすべてを追い求めているからです。しかし、あなたがたの父は、あなたがたにこれらが必要であることを知っておられます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα γὰρ πάντα
  choice: これらのものはみな……のです
  rationale: ταῦτα πάνταが直前の文脈にある食べ物や飲み物などを指すことを明示し、γάρは前文を受ける説明の語調「のです」によって自然に表した。
- source_word: τὰ ἔθνη τοῦ κόσμου
  choice: 世の諸国民
  rationale: ἔθνηの「諸国民」と「異邦人」の両義性のうち、本文では広い表現を採り、契約共同体の外にいる人々という含みを脚注に残した。
- source_word: ἐπιζητοῦσιν
  choice: 追い求めている
  rationale: 単に探すことではなく、必要物を熱心に求め続ける能動的な追求を、現代日本語として自然に表した。
- source_word: ὑμῶν ... ὁ πατὴρ
  choice: あなたがたの父
  rationale: 原文どおり父との関係を示し、本文にない「天の」を補わなかった。
- source_word: οἶδεν
  choice: 知っておられます
  rationale: 形は完了形に由来するが現在の意味で機能するため、継続的な認識を表す自然な敬語にした。
- source_word: χρῄζετε τούτων
  choice: あなたがたにこれらのものが必要だ
  rationale: 必要としているという意味を明瞭に表し、τούτωνを代名詞だけで済ませず、原文の指示表現の反復を保った。
theological_decisions:
- issue: 世の人々の追求と、父を信頼する弟子たちとの対照
  choice: 「世の諸国民」と「あなたがたの父」を解釈的に膨らませず保持する
  alternative: 「世の異邦人」として契約上の対照を前面に出す、または「天の父」と補う
  rationale: ルカの文言は、世に特徴的な追求と、神を父とする弟子たちの立場を対照させる。「異邦人」に限定したり、並行箇所から「天の」を補ったりせず、その神学的緊張と表現範囲を保った。
translation_notes:
  register: 明快な現代標準語を用いながら、「父」には尊敬表現を添えて品位を保った。冒頭のγάρは不自然な接続詞の直訳を避け、説明を表す「のです」で文脈とのつながりを示した。
