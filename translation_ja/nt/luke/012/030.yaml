revisions:
- from: これらのものはみな、世の諸国民[a]が追い求めているのです。しかし、あなたがたの父は、あなたがたにこれらのものが必要だと知っておられます。
  to: というのも、世の国々の人々は、これらすべてを追い求めているからです。しかし、あなたがたの父は、あなたがたにこれらが必要であることを知っておられます。
  rationale: 本文を明快な現代標準語として整えた。「世の国々の人々」はτὰ ἔθνη τοῦ κόσμουの集合的な人間指示を自然に表しつつ、「異邦人」とする狭い解釈を本文へ持ち込まない。「これらすべてを」と「というのも…からです」により、ταῦτα πάνταとγάρの構文上の関係を明示した。脚注の語彙的代案は維持する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:35:00Z'
review_pass:
  verdict: revise
  source_fidelity: 本文の意味はおおむね原文に忠実である。ταῦτα πάντα、ἐπιζητοῦσιν、ὑμῶν…ὁ πατήρ、χρῄζετε τούτωνはいずれも適切に反映され、本文にない「天の」も加えていない。ただし「世の諸国民が追い求めている」は、国民・国家集団そのものを行為主体とするように響き、明快な現代標準語としてはやや不自然である。τὰ ἔθνηの集合的用法を保ちつつ、人々を指すことを日本語で明示するのが安全である。
  naturalness: 「これらのものはみな、世の諸国民が追い求めているのです」は理解可能だが、冒頭の目的語を「これらすべてを」とし、γάρを「というのも…からです」で表す方が、原文の説明関係と日本語の文構造の双方に自然である。
  terminology: 「父」は原文どおりであり、神への呼称としての敬語「知っておられます」も適切である。「世の国々の人々」は本文で「異邦人」と限定せず、ἔθνηの広い意味を保つ。脚注で「異邦人」という可能性を示す処理も維持できる。
  issues:
  - severity: low
    issue: 「世の諸国民」が追求の行為主体となっている
    rationale: 原文のἔθνηは集合的に人々を指し得るが、現代日本語の「諸国民」は国家・民族集団として読まれやすく、「追い求める」という個人的行為との結び付きがやや硬い。「世の国々の人々」とすることで意味を変えず自然さを高められる。
  - severity: low
    issue: γάρの説明関係が「のです」だけではやや見えにくい
    rationale: 誤訳ではないが、「というのも…からです」とすることで、前節を理由づけるγάρを明瞭かつ自然に表せる。
  revised_text: というのも、世の国々の人々は、これらすべてを追い求めているからです。しかし、あなたがたの父は、あなたがたにこれらが必要であることを知っておられます。
  revised_footnotes:
  - marker: a
    text: 別訳「世の異邦人」。ギリシア語は「諸国民」とも「異邦人」とも訳せる。
    reason: lexical_alternative
  revision_rationale: 本文を明快な現代標準語として整えた。「世の国々の人々」はτὰ ἔθνη τοῦ κόσμουの集合的な人間指示を自然に表しつつ、「異邦人」とする狭い解釈を本文へ持ち込まない。「これらすべてを」と「というのも…からです」により、ταῦτα πάνταとγάρの構文上の関係を明示した。脚注の語彙的代案は維持する。
