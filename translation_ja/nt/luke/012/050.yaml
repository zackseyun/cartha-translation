id: LUK.12.50
reference: Luke 12:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: ja
  text: しかし、私には受けなければならないバプテスマがある[a][b]。それが成し遂げられるまで、私はどれほど胸を締めつけられていることか[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「私には、バプテスマを受けるべきことがある」。原文では「バプテスマ」と「バプテスマを受ける」という同根語が重ねられている。
    reason: lexical_alternative
  - marker: b
    text: ここでの「バプテスマ」は比喩であり、イエスがこれから受ける圧倒的な苦難を指す。
    reason: alternative_reading
  - marker: c
    text: または「どれほど圧迫されていることか」「どれほど制約されていることか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: バプテスマ
  rationale: 苦難という解釈に置き換えず、水に沈められることを背景とする原文の比喩を保つため。「洗礼」よりも原語のイメージを直接残しやすい。
- source_word: ἔχω βαπτισθῆναι
  choice: 受けなければならないバプテスマがある
  rationale: ἔχω＋不定詞が表す、目前にある必要・務めを自然な現代日本語で示しつつ、βαπτισθῆναιの受動的な意味を「受ける」で表した。
- source_word: πῶς
  choice: どれほど…ことか
  rationale: 感嘆を表すπῶςを、日本語の自然な感嘆構文で再現した。
- source_word: συνέχομαι
  choice: 胸を締めつけられている
  rationale: 圧迫される、制約される、苦悩するという語の幅を残しながら、差し迫る出来事を前にした強い内的圧迫を自然に表す。
- source_word: ἕως ὅτου
  choice: …まで
  rationale: 状態が続く時間的終点を簡潔に示す。
- source_word: τελεσθῇ
  choice: 成し遂げられる
  rationale: 単に終わるだけでなく、定められた事柄が完遂される含みを保ちつつ、ヨハネ19章30節の定型表現を持ち込まない。
theological_decisions:
- issue: 「バプテスマ」の比喩的指示対象
  choice: 目前に迫る苦難と死を指す比喩と理解しつつ、本文では「バプテスマ」という像を保持する。
  alternative: 「圧倒する試練」などと一般化する、または水のバプテスマだけを指すと解する。
  rationale: 文脈上はイエスの受難を先取りしているが、原文はその意味を説明語に置き換えず、バプテスマの比喩そのものによって表しているため。
- issue: συνέχομαιが表すイエスの状態
  choice: 強い内的圧迫を表す「胸を締めつけられている」とする。
  alternative: 「制約されている」「せき立てられている」「苦しんでいる」とする。
  rationale: この動詞には圧迫、拘束、苦悩の意味領域があり、一つの心理状態に限定しすぎない表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「バプテスマ」という意図的な比喩は本文に残し、解釈は脚注で補った。感嘆構文「どれほど…ことか」により、原文の強い情動を過度に口語化せず表現した。
