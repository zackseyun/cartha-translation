id: LUK.12.37
reference: Luke 12:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μακάριοι οἱ δοῦλοι ἐκεῖνοι, οὓς ἐλθὼν ὁ κύριος εὑρήσει γρηγοροῦντας· ἀμὴν λέγω ὑμῖν ὅτι περιζώσεται καὶ ἀνακλινεῖ αὐτοὺς καὶ παρελθὼν διακονήσει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/037.yaml
  text: Blessed are those servants whom the Lord[a], when he comes, will find staying awake. Truly I say to you, he will dress himself for service and have them recline at the table[c][b], and he will come and serve them.
translation:
  language: ja
  text: 主人[a]が来たとき、目を覚ましているのを見いだされる奴隷たち[b]は幸いです。まことに、あなたがたに言います。主人は帯を締めて[c]彼らを食卓に着かせ、彼らのところへ進み出て仕えるでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主人」は「主」とも訳せる。ギリシア語キュリオスは、このたとえでは家の主人を指す一方、「主」という称号としても読める。
    reason: lexical_and_theological_ambiguity
  - marker: b
    text: 「奴隷たち」は「しもべたち」とも訳せる。ギリシア語ドゥーロス。
    reason: lexical_alternative
  - marker: c
    text: 直訳「自分の腰に帯を締めて」。長い衣を帯でまとめ、働く準備をすることを表す。
    reason: cultural_note
lexical_decisions:
- source_word: μακάριοι
  choice: 幸いです
  rationale: 祝福を告げる厳かな表現を保ちつつ、現代日本語で自然な定型表現とした。単なる主観的な「幸福」には限定しない。
- source_word: δοῦλοι
  choice: 奴隷たち
  rationale: 主人との身分関係がたとえの中心にあるため、拘束された身分を明示する「奴隷」とした。「しもべ」では社会的関係が弱まり得るため、脚注で別訳として示した。
- source_word: κύριος
  choice: 主人
  rationale: この節の直接の場面は家の主人と奴隷の関係であるため「主人」が最も自然である。一方、「主」という響きもあり得るので脚注に残した。
- source_word: γρηγοροῦντας
  choice: 目を覚ましている
  rationale: 文脈上の身体的な覚醒と、備えて待つ含意の双方を保つ。説明的な「油断せずにいる」にはしなかった。
- source_word: ἀμὴν λέγω ὑμῖν
  choice: まことに、あなたがたに言います
  rationale: イエスの強調された宣言定式を、明瞭で格調ある現代日本語にした。
- source_word: περιζώσεται
  choice: 帯を締めて
  rationale: 衣をたくし上げて働く備えをする古代の所作を具体的に保ち、その機能は脚注で説明した。
- source_word: ἀνακλινεῖ αὐτούς
  choice: 彼らを食卓に着かせ
  rationale: 食事のために横にならせるという当時の習慣を、現代の読者に自然に伝わる食卓表現で示した。
- source_word: παρελθὼν διακονήσει αὐτοῖς
  choice: そばに来て彼らに仕える
  rationale: 主人が客のもとへ進み出て給仕する動きを保ち、「仕える」によって役割の驚くべき逆転を明確にした。
theological_decisions:
- issue: κύριοςがたとえの「主人」と称号としての「主」の双方に響き得ること
  choice: 主人
  alternative: 主
  rationale: 直接の家内場面を明瞭にしながら、キリスト論的な響きを排除しないよう別訳を脚注に残した。
- issue: δοῦλοςの身分をどの程度明示するか
  choice: 奴隷
  alternative: しもべ
  rationale: この場面では主人との法的・社会的な従属関係が顕著であり、その厳しい現実を婉曲化しない。ただし日本語聖書で伝統的な「しもべ」も脚注に示した。
- issue: 主人自身が奴隷たちに仕えるという役割の逆転
  choice: 語順と動作をそのまま保つ
  alternative: 比喩の意味を説明的に補う
  rationale: 本文が明言する驚くべき行為をそのまま訳し、それが終末の宴、報い、またはキリストの奉仕をどう指すかは訳文で限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「幸いです」「まことに」など聖書本文にふさわしい端正さを保った。主人が奴隷に仕えるという逆転を弱めず、説明を本文へ過剰に持ち込まない文体とした。
