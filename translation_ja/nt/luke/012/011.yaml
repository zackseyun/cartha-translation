revisions:
- from: しかし、人々があなたがたを会堂や統治者たちや権力者たち[a]の前に連れて行くときには、どのように、また何をもって弁明すべきか[b]、あるいは何を言うべきかと、心配してはならない。
  to: しかし、あなたがたが会堂や支配者たち、権力者たち[a]の前に連れて行かれるときには、どのように、また何を弁明として語るべきか[b]、あるいは何を言うべきかについて、心配してはならない。
  rationale: 原文のτίを「何をもって」（手段）に限定せず、弁明の内容としても読める「何を弁明として語る」とした。主語は原文どおり不特定の複数行為者を日本語の受身で自然に表した。本文と注のアンカーは維持し、注bも改訂した本文の表現に一致させた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:34:33Z'
review_pass:
  verdict: revise
  source_fidelity: 原文の不定の将来条件、尋問・法的弁明の文脈、「どのように／何を」と「何を言う」の反復は、全体としてよく捉えられています。ただし、「何をもって弁明すべきか」はτίを主に手段（何を用いて）として受け取らせやすく、ここでの弁明の内容という問いを十分に表しません。
  naturalness: 明瞭な現代標準日本語です。「統治者たちや権力者たち」は意味が通りますが、文脈に即して「支配者たちや権力者たち」とし、終結部を「〜について、心配してはならない」と整えると、より自然で読みやすくなります。
  terminology: 「会堂」と「弁明」は適切です。「弁明として語る」とすることで、ἀπολογήσησθεの法的な応答・弁護の意味を保ちつつ、後続の「何を言うべきか」との意図的な重なりも維持できます。
  issues:
  - severity: medium
    issue: 「何をもって弁明すべきか」がτίの意味を狭めている。
    rationale: 「何をもって」は通常、手段・根拠（何を用いて）を強く示します。しかしπῶς ἢ τί ἀπολογήσησθεのτίは、弁明において何を語るかという内容をも含むため、「何を弁明として語るべきか」とするほうが忠実です。
  - severity: low
    issue: 「統治者たち」は現代日本語ではやや硬く、行政・司法的な当局者の文脈がやや見えにくい。
    rationale: ἀρχαίとἐξουσίαιの区別を断定的に制度化せず保つ必要はありますが、「支配者たちや権力者たち」は原文の並列を保ち、より自然です。
  revised_text: しかし、あなたがたが会堂や支配者たち、権力者たち[a]の前に連れて行かれるときには、どのように、また何を弁明として語るべきか[b]、あるいは何を言うべきかについて、心配してはならない。
