id: LUK.12.11
reference: Luke 12:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν δὲ ⸀εἰσφέρωσιν ὑμᾶς ἐπὶ τὰς συναγωγὰς καὶ τὰς ἀρχὰς καὶ τὰς ἐξουσίας, μὴ ⸀μεριμνήσητε πῶς ⸂ἢ τί⸃ ἀπολογήσησθε ἢ τί εἴπητε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/011.yaml
  text: But whenever they bring you before the synagogues and the rulers and the authorities[a], do not worry about how or what you should say in your defense, or what you should say[b];
translation:
  language: ja
  text: しかし、あなたがたが会堂や支配者たち、権力者たち[a]の前に連れて行かれるときには、どのように、また何を弁明として語るべきか[b]、あるいは何を言うべきかについて、心配してはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「会堂、支配者、権力者」は、弟子たちが取り調べを受けることになり得た宗教上および行政上の機関やその権限者を指す。
    reason: cultural_note
  - marker: b
    text: 「弁明として語る」は、告発や取り調べに対して自分の立場を説明し、答弁すること。
    reason: lexical_note
lexical_decisions:
- source_word: ὅταν δὲ
  choice: しかし、……ときには
  rationale: ὅτανの不定の将来条件を「……ときには」で表し、δέは直前の文脈との緩やかな対照・継続として「しかし」とした。
- source_word: εἰσφέρωσιν ὑμᾶς ἐπὶ
  choice: あなたがたを……の前に連れて行く
  rationale: 司法的・審問的な場へ引き出す意味を、現代日本語で自然に伝える表現とした。
- source_word: τὰς συναγωγὰς
  choice: 会堂
  rationale: 語の基本的意味を保った。文脈上は建物だけでなく、そこで審問を行う宗教共同体・法廷的機関を指し得るため、注で補った。
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: 統治者たちや権力者たち
  rationale: ἀρχαίを統治に携わる者、ἐξουσίαιを権限を帯びた者として訳し、原文の並列と語義上の違いを保った。
- source_word: μὴ μεριμνήσητε
  choice: 心配してはならない
  rationale: 単なる配慮ではなく、思い煩うことへの禁止を、明瞭で自然な日本語にした。
- source_word: πῶς ἢ τί ἀπολογήσησθε
  choice: どのように、また何をもって弁明すべきか
  rationale: πῶςとτίの双方を訳出し、ἀπολογέομαιの法廷的な「弁明する」という意味を保持した。「何をもって」は内容または手段を指し得る原文の幅を残す。
- source_word: ἢ τί εἴπητε
  choice: あるいは何を言うべきか
  rationale: 先行する弁明の句とは別に置かれた発言内容への言及を、原文どおり反復して訳した。
theological_decisions:
- issue: 弟子への約束と人間の準備との関係
  choice: 本文は「心配してはならない」と訳し、準備一般の禁止とは言い換えない
  alternative: 「前もって準備してはならない」
  rationale: μεριμνάωは不安に心を奪われることを指し、準備そのものを明示的に禁じる語ではない。後続節との神学的緊張を説明的に解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法廷的な場面にふさわしい「弁明」「統治者」を採用した。原文の「どのように／何を」「弁明する／言う」という重なりを簡略化せず保持した。
