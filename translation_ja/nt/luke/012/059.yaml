base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: ja
  text: あなたに言う。最後の一レプトン[a]に至るまで返済し終えるまでは、決してそこから出られない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: レプトンは、非常に小さい額の古代の硬貨。
    reason: 現代の読者になじみの薄い古代貨幣名の意味を説明するため。
lexical_decisions:
- source_word: λέγω σοι
  choice: あなたに言う
  rationale: 二人称単数への直接的な告知を、簡潔で自然な現代日本語として保持した。
- source_word: οὐ μὴ ἐξέλθῃς
  choice: 決してそこから出られない
  rationale: οὐ μήとアオリスト接続法による将来についての強い否定を、「決して」で明確に表した。文脈上、拘束状態から出ることを意味するため、日本語では可能表現が自然である。
- source_word: ἐκεῖθεν
  choice: そこから
  rationale: 場所からの離脱を示す語義をそのまま保った。
- source_word: ἕως
  choice: までは
  rationale: 支払いが完了する時点まで否定された状態が続く、という時間的限界を示した。
- source_word: καὶ τὸ ἔσχατον
  choice: 最後の一…まで
  rationale: καίの強調とἔσχατονの最終性を、「最後の一」と取り立て助詞「まで」によって自然に表した。
- source_word: λεπτόν
  choice: レプトン
  rationale: 当時の特定の小額貨幣名を音写して歴史的具体性を保持し、意味は脚注で補った。
- source_word: ἀποδῷς
  choice: 支払い終える
  rationale: 法的・債務的文脈に合う「支払う」を用い、アオリストが示す支払いの完了性を「終える」で表した。
theological_decisions:
- issue: この言葉の比喩が何を指すか
  choice: 債務による拘束と全額支払いのイメージをそのまま残し、指示対象を特定しない
  alternative: 地上の法的結果、神の裁き、または後代の煉獄理解のいずれかに限定する
  rationale: 本文自体は、全額を支払うまで出られないという像を述べるだけで、その指示対象を明示していないため、特定の教理的解釈を訳文に持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、断定の強さと法的・債務的な比喩を保持した。「決して」と「支払い終える」によって、原文の強い否定と完了の条件を過不足なく表している。
