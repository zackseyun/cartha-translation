  text: Πῦρ ἦλθον βαλεῖν ⸀ἐπὶ τὴν γῆν, καὶ τί θέλω εἰ ἤδη ἀνήφθη;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/049.yaml
  text: I came to cast fire on the earth[a], and how I wish it were already kindled!
translation:
  language: ja
  text: わたしは地上に火を投じるために来た。その火がすでについていたらよいのに。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「もしすでに火がついているなら、わたしは何を望むのか」とも訳せる。ギリシア語のこの句は解釈が難しく、本文は強い願望を表す慣用的な意味に取っている。
    reason: alternative_reading
lexical_decisions:
- source_word: Πῦρ
  choice: 火
  rationale: 比喩の内容を「裁き」「清め」などと限定せず、原文の鮮明なイメージをそのまま保つ。
- source_word: ἦλθον βαλεῖν
  choice: 投じるために来た
  rationale: 目的を表す不定詞を明示しつつ、βάλλωの力強い「投じる」という像を保った。
- source_word: ἐπὶ τὴν γῆν
  choice: 地上に
  rationale: γῆは「地、土地、大地」を意味し得るが、ここでは局地的な「土地」に限定せず、広い範囲を自然に示す「地上」とした。
- source_word: ἤδη ἀνήφθη
  choice: すでに燃え上がっていたなら
  rationale: ἀνάπτωの受動的な着火の意味を、日本語の火の比喩として自然な「燃え上がる」で表した。完了した状態への強い願望が伝わる形にした。
- source_word: καὶ τί θέλω εἰ ἤδη ἀνήφθη;
  choice: その火がすでに燃え上がっていたならと、どれほど願っていることか
  rationale: 難解なギリシア語句を、文脈上有力な強い願望の感嘆として自然な現代日本語にした。ただし直訳的な問いの可能性は脚注に残した。
theological_decisions:
- issue: 「火」の意味
  choice: 「火」という比喩をそのまま保持する
  alternative: 裁き、清め、聖霊、またはイエスの使命がもたらす分裂と明示する
  rationale: この節自体は火が何を指すか明示していないため、複数の響きを一つに限定せず、神学的緊張を保った。
- issue: τί θέλω εἰ ἤδη ἀνήφθη の解釈
  choice: すでに燃え上がっていることへの強い願望を表す感嘆
  alternative: 「すでに火がついているなら、わたしは何を望もうか」という直訳的な問い
  rationale: 原文は難解であるが、文脈と慣用的理解に照らして感嘆的な願望が有力であり、日本語としても明瞭になる。別の構文理解は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言にふさわしい力強さと品位を保った。「投じる」はやや改まった語だが、原文の鮮烈な動作性に適する。脚注標識[a]は対応する文末に置いた。
