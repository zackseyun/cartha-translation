  text: And why do you not judge for yourselves what is right?[a]
translation:
  language: ja
  text: また、なぜあなたがたは、自分で何が正しいかを判断しないのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何が公正か」または「正しいこと」。
