lexical_decisions:
- source_word: Τί δὲ καὶ
  choice: それなのに、なぜ
  rationale: 前の議論を受けて聞き手にさらに迫る修辞疑問として、接続の力を自然な現代日本語で表した。
- source_word: ἀφ’ ἑαυτῶν
  choice: 自分で
  rationale: 自らの判断や主体性に基づくことを簡潔で自然に示す。「自分たちから」は逐語的すぎて不自然である。
- source_word: οὐ κρίνετε
  choice: 判断しないのですか
  rationale: κρίνωの評価して結論を下す意味を保ちつつ、文脈に合う自然な修辞疑問とした。
- source_word: τὸ δίκαιον
  choice: 何が正しいか
  rationale: 名詞的に用いられた中性単数形を、道徳的・実際的な正しさの双方を含み得る表現で訳した。
theological_decisions:
- issue: τὸ δίκαιον の意味の幅
  choice: 何が正しいか
  alternative: 何が公正か／正しいこと
  rationale: 法的な公正さだけに限定せず、文脈上の道徳的・実際的判断という広がりを保つため。
translation_notes:
  register: 明瞭で現代的ながら品位ある敬体。修辞的な問いの鋭さを保ち、「あなたがた」で複数の聞き手を明示した。
