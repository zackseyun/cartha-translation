id: LUK.12.28
reference: Luke 12:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ⸂ἐν ἀγρῷ τὸν χόρτον ὄντα σήμερον⸃ καὶ αὔριον εἰς κλίβανον βαλλόμενον ὁ θεὸς οὕτως ⸀ἀμφιέζει, πόσῳ μᾶλλον ὑμᾶς, ὀλιγόπιστοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/028.yaml
  text: But if God so clothes the grass in the field[a], which is here today and tomorrow is thrown into an oven, how much more will he clothe you[b], you of little faith!
translation:
  language: ja
  text: しかし、今日、野に生えていて、明日にはかまどに投げ込まれる草を、神がこのように装ってくださるなら、ましてあなたがたには、どれほど衣を着せてくださることでしょう。信仰の薄い人たちよ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χόρτον
  choice: 草
  rationale: 野に生え、乾燥後には燃料にもされた草本類を指す。文脈に自然で、一般読者にも明瞭な「草」とした。
- source_word: ἐν ἀγρῷ
  choice: 野に
  rationale: 特定の耕作地に限定せず、屋外に生える草という一般的な情景を自然な日本語で表す。
- source_word: ὄντα σήμερον καὶ αὔριον ... βαλλόμενον
  choice: 今日野に生えていて、明日には……投げ込まれる
  rationale: 圧縮された分詞構文を日本語として明瞭に展開し、今日と明日の鋭い時間的対比を保った。
- source_word: κλίβανον
  choice: かまど
  rationale: パンを焼く炉を指し得る語であり、現代日本語では「炉」より生活上の用途が伝わりやすい。「オーブン」は古代の情景にそぐわないため避けた。
- source_word: ἀμφιέζει
  choice: 装ってくださる
  rationale: 直訳的には「衣を着せる」。直前の花や衣服の比喩を保ちつつ、草を美しく装うという日本語として自然にした。神を主語とするため敬語を用いた。
- source_word: πόσῳ μᾶλλον ὑμᾶς
  choice: ましてあなたがたには、どれほどよくしてくださることでしょう
  rationale: 原文では後半の動詞が省略され、直前の「装う」が補われる。「あなたがたを装う」は日本語では不自然なので、衣を備えるという含意を過度に限定せず、より大きな配慮を表す自然な比較表現とした。
- source_word: ὀλιγόπιστοι
  choice: 信仰の薄い者たちよ
  rationale: 弟子たちへの直接的な呼びかけと穏やかな叱責を保つ。救いの有無を断定する語にはせず、信頼の乏しさを表した。
- source_word: εἰ δὲ
  choice: しかし、……なら
  rationale: 前文からの継続と軽い対比を「しかし」で示し、条件節を自然な「なら」で結んだ。
- source_word: οὕτως
  choice: このように
  rationale: 草を美しく装う神の仕方を指す語として、指示性を明確に保った。
theological_decisions:
- issue: ὀλιγόπιστοι が示す叱責の強さ
  choice: 「信仰の薄い者たちよ」—直接的だが、見捨てる宣告ではない叱責
  alternative: 「信仰のない者たちよ」または単なる中立的描写
  rationale: この語は神への信頼の不足を責めるが、不信仰や背教を専門的に断定するものではない。原文の牧会的な緊張を強めすぎず、弱めすぎずに残した。
- issue: πόσῳ μᾶλλον ὑμᾶς に省略された述語
  choice: 神が人間にも一層よくしてくださるという比較を自然な日本語で表現
  alternative: 「ましてあなたがたを装ってくださらないだろうか」
  rationale: 統語上は ἀμφιέζει の補充が自然だが、日本語の「人を装う」は外見を飾る意味に傾きやすい。衣服への配慮という文脈を保ちながら、神の配慮全般へ不必要に教義化しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「まして」「者たちよ」によって聖書本文としての品位と直接的な呼びかけを保った。「神」には敬語を用い、過度に古風な語法は避けた。
