id: LUK.12.32
reference: Luke 12:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ φοβοῦ, τὸ μικρὸν ποίμνιον, ὅτι εὐδόκησεν ὁ πατὴρ ὑμῶν δοῦναι ὑμῖν τὴν βασιλείαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/032.yaml
  text: Do not fear[a], little flock[c][b], because your Father was pleased to give you the kingdom.
translation:
  language: ja
  text: 「恐れるな、小さな群れよ。あなたがたの父は、あなたがたに御国[a]を与えることを喜ばれたのだから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御国」は、「王としての支配」とも理解できる。神が治める領域だけでなく、神の王としての統治をも表す語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: 恐れるな
  rationale: μήを伴う現在命令形の直接的な禁止を、簡潔で自然な日本語として表した。単数形は「群れ」を一つのまとまりとして呼びかける文脈に合う。
- source_word: τὸ μικρὸν ποίμνιον
  choice: 小さな群れよ
  rationale: 羊の群れという牧者的比喩を保ち、呼格的な呼びかけを「よ」で明示した。「小さな」は人数の少なさと親愛の響きの双方を妨げない。
- source_word: ὅτι
  choice: のだから
  rationale: 恐れないようにとの勧めの根拠を示す因果関係を、現代日本語で自然に表した。
- source_word: εὐδόκησεν
  choice: 喜びとされた
  rationale: 父の好意と善い御心を表しつつ、「決定された」などの教理的に限定された意味を持ち込まない表現とした。
- source_word: ὁ πατὴρ ὑμῶν
  choice: あなたがたの父
  rationale: 原文どおり「天の」などを補わず、弟子たちと父との関係を明確にした。
- source_word: δοῦναι ὑμῖν
  choice: あなたがたに…与えること
  rationale: 不定詞と与格代名詞の意味を素直に保った。
- source_word: τὴν βασιλείαν
  choice: 御国
  rationale: 神の王的支配と、その民に与えられる国という広がりを持つ定着した聖書語を用いた。原文に明示されない「神の」は本文に補わなかった。
theological_decisions:
- issue: βασιλείαの意味の幅
  choice: 御国
  alternative: 王としての支配
  rationale: βασιλείαは領域としての国と王的統治の双方を指し得る。「御国」は日本語の聖書表現としてその幅を比較的よく保ち、脚注で統治の含意を明示した。
- issue: εὐδόκησενと神の意志
  choice: 喜びとされた
  alternative: 与えることをよしとされた
  rationale: 父の恵み深い喜びと主導性を示しながら、技術的な予定・決定の表現へ狭めないため。
translation_notes:
  register: イエスの励ましを、簡潔で威厳のある現代標準語で表現した。「恐れるな」は直接的だが、「小さな群れよ」と父の喜びを続けることで、原文の親愛と慰めの調子を保っている。
