  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: ja
  text: そして、自分の魂[a]にこう言おう。『魂よ、お前には何年分もの多くの良いものが蓄えてある。休んで、食べて、飲んで、楽しめ。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「魂」に当たるギリシア語は、文脈により「自分自身」または「命」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: 言おう
  rationale: λέγωの未来形。独り言としての将来の意図を、自然な日本語の意志形で表した。
- source_word: ψυχῇ / Ψυχή
  choice: 魂
  rationale: 自分の内なる存在への呼びかけを表す。単に「自分」とせず、同語を反復する原文の修辞を保った。
- source_word: πολλὰ ἀγαθὰ
  choice: たくさんの良い物
  rationale: 文脈では蓄えた物質的財産を指すが、語そのものの広がりを保つため「財産」に限定しなかった。
- source_word: κείμενα
  choice: 蓄えてある
  rationale: ここでは、良い物が将来のために保管されている状態を表す。日本語として自然な結果状態で訳した。
- source_word: εἰς ἔτη πολλά
  choice: 何年も先まで
  rationale: 長年にわたって足りるという将来への時間的広がりを、明瞭で自然な日本語にした。
- source_word: ἀναπαύου
  choice: 休んで
  rationale: 休息し、気楽に過ごすよう促す命令。後続する命令との自然な連なりを保った。
- source_word: φάγε
  choice: 食べて
  rationale: 単純な命令を直接訳した。
- source_word: πίε
  choice: 飲んで
  rationale: 単純な命令を直接訳した。
- source_word: εὐφραίνου
  choice: 楽しめ
  rationale: 喜び楽しむ、陽気に過ごすという意味を、現代日本語で自然に表した。「祝いなさい」では特定の祝い事があるように響くため避けた。
theological_decisions:
- issue: たとえの中の自己への呼びかけにおけるψυχή
  choice: 魂
  alternative: 自分自身／命
  rationale: ここで厳密な人間論を断定するのではなく、人物が自分の内なる存在に語りかける描写を保つ。語義上の別の可能性は脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、原文の「魂」への直接呼びかけと命令の連続を保った。引用内の「おまえ」は自己への呼びかけとして自然であり、過度に口語的にならない語調を選んだ。
