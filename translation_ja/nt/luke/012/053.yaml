id: LUK.12.53
reference: Luke 12:53
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: ja
  text: 彼らは分裂することになる。[a] 父は息子に対し、息子は父に対し、母は娘に対し、娘は母に対し、しゅうとめは自分の嫁[b]に対し、嫁はしゅうとめに対して、対立する。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らは互いに引き離される」。原語は、同じ集団や家庭の中に分裂が生じることを強調する。
    reason: lexical_alternative
  - marker: b
    text: 「嫁」と訳した原語は、文脈によっては「花嫁」を意味する。ここでは「しゅうとめ」と対になっているため、「嫁」の意味に取った。
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: 彼らは分裂することになる
  rationale: 未来受動形が表す、集団や家庭の内部に分裂が生じる状態を保ちつつ、自然な現代日本語とした。原因を訳文に付け加えてはいない。
- source_word: ἐπί
  choice: 〜に逆らう
  rationale: ここでは人を相手とする反復構文で、対立・敵対の関係を表す。日本語では列挙の末尾に述語を置き、各組が互いに対立する構造を明確にした。
- source_word: πατήρ / υἱός
  choice: 父／息子
  rationale: 原文の性別を伴う親子関係と、相互に向き合う対句をそのまま保った。
- source_word: μήτηρ / θυγάτηρ
  choice: 母／娘
  rationale: 原文の性別を伴う親子関係と、相互に向き合う対句をそのまま保った。
- source_word: πενθερά
  choice: しゅうとめ
  rationale: 婚姻による母親を指す語として、現代日本語で関係が明確になる表現を採用した。
- source_word: νύμφη
  choice: 嫁
  rationale: この語には「花嫁」の意味もあるが、ここでは「しゅうとめ」と対になっているため、婚姻上の家族関係を表す「嫁」が文脈に最も合う。
- source_word: αὐτῆς
  choice: 自分の
  rationale: 最初の「しゅうとめ」に付く女性単数属格代名詞を反映し、そのしゅうとめ自身の嫁であることを自然な日本語で示した。
theological_decisions:
- issue: ここで述べられる分裂の性質
  choice: イエスの働きに伴って生じる家族内の対立を、是認とも単なる一般論ともせず、その厳しい表現のまま描く。
  alternative: 家族間の敵意を命じる言葉、または一般的な家庭不和についての格言として訳す。
  rationale: 直前の文脈で語られた分裂が、相互に対立する家族関係として具体化されている。訳文はその緊張を弱めず、同時に対立への道徳的承認を付加しない。
translation_notes:
  register: 明瞭な現代標準語。家族関係の反復と相互性を保ちながら、日本語として冗長にならないよう、対立を表す述語「逆らう」を文末で全列挙にかけた。「姑」の漢字は読みやすさを考慮して平仮名表記とした。
