id: LUK.12.27
reference: Luke 12:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: ja
  text: 百合[a]がどのように育つか、よく考えなさい。働きもせず、糸を紡ぎもしない。だが、あなたがたに言う。ソロモンでさえ、そのすべての栄華の中にあった時でさえ、これらの一つほどには着飾っていなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「野の花」または単に「花」とも訳せる。ギリシア語は具体的には「百合」としている。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: よく考えなさい
  rationale: 単に見ることではなく、注意深く観察して思い巡らすよう求めるアオリスト命令形の力を自然な現代日本語で表した。
- source_word: τὰ κρίνα
  choice: 百合の花
  rationale: κρίναの具体的な語義を保持した。「野の花」などへの一般化は本文では避け、指しうる花の範囲は脚注で示した。
- source_word: πῶς αὐξάνει
  choice: どのように育つか
  rationale: πῶςの様態を問う意味を保ちつつ、日本語として自然に表現した。ギリシア語では中性複数主語に単数動詞が用いられているが、日本語では数の不一致は問題にならない。
- source_word: οὐ κοπιᾷ οὐδὲ νήθει
  choice: 働きもせず、糸を紡ぎもしません
  rationale: κοπιάωの労働とνήθωの糸紡ぎを明示し、衣服を作る人間の営みとの対比を分かりやすくした。
- source_word: λέγω δὲ ὑμῖν
  choice: それでも、あなたがたに言います
  rationale: δέがここで示す穏やかな対比と、続く結論への移行を「それでも」で表した。
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: 栄華を極めた
  rationale: 王としてのδόξαが表す華麗さ・壮麗さとπάσῃの徹底性を、文脈に即した自然な日本語で表した。直訳的な形は脚注に残した。
- source_word: περιεβάλετο
  choice: 身を装ってはいませんでした
  rationale: 衣服をまとう意味を保ち、中動・受動形の作用主体を過度に限定しない自然な表現とした。
- source_word: ὡς ἓν τούτων
  choice: この花の一つほどにも
  rationale: 直前の百合を指す比較を明確にし、οὐδέと呼応する否定比較を自然な日本語にした。
theological_decisions:
- issue: 花の比喩が指す対象
  choice: 本文では具体的に「百合の花」とした。
  alternative: 「野の花」または単に「花」
  rationale: 原文はκρίναと具体的に述べているため、その語を保持した。ただし古代の語が指す植物種を現代の園芸分類にまで厳密に限定せず、脚注で訳語の幅を示した。
- issue: ソロモンのδόξαの表現
  choice: 「栄華を極めた」とした。
  alternative: 「そのすべての栄光のうちにあった」または「どれほど華やかであった時にも」
  rationale: ここでは抽象的な名誉より王の壮麗さが中心であるため「栄華」を選んだが、原文の「栄光」という広い語義とπάσῃの表現は脚注で示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。命令は硬すぎない「よく考えなさい」とし、花とソロモンの衣装の対比が普通の読者にも直ちに伝わるようにした。脚注記号[b]は内容に対応する「栄華を極めた」の位置に置いた。
