id: LUK.12.51
reference: Luke 12:51
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: δοκεῖτε ὅτι εἰρήνην παρεγενόμην δοῦναι ἐν τῇ γῇ; οὐχί, λέγω ὑμῖν, ἀλλ’ ἢ διαμερισμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/051.yaml
  text: Do you think that I came to give peace on the earth? No[a], I tell you[b], but rather division.
translation:
  language: ja
  text: あなたがたは、わたしが地上[b]に平和を与える[a]ために来たと思うのですか。いいえ、あなたがたに言います。平和ではなく、むしろ分裂です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「平和をもたらす」とも訳せる。ギリシア語の動詞は直訳すれば「与える」だが、「もたらす」は自然な慣用表現である。
    reason: lexical_alternative
  - marker: b
    text: 「地上に」は「その地に」とも訳し得るが、ここではより広い意味である可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖτε
  choice: 思うのですか
  rationale: 二人称複数への修辞的な問いを、現代日本語で自然な直接質問として表した。
- source_word: εἰρήνην
  choice: 平和
  rationale: 社会的な平穏や調和を含む広い意味を保ち、内面的平安だけに限定しない。
- source_word: παρεγενόμην
  choice: 来た
  rationale: イエスの到来を表すアオリストを簡潔に訳し、続く不定詞による目的と自然につないだ。
- source_word: δοῦναι
  choice: 与える
  rationale: 原語の基本的な語義を保持した。「もたらす」も自然な日本語だが、本文ではより直接的な対応を選んだ。
- source_word: ἐν τῇ γῇ
  choice: 地上に
  rationale: γῆの広い範囲を保ち、特定地域を指す「その地に」へ狭めなかった。
- source_word: οὐχί
  choice: いいえ
  rationale: 修辞的質問への強い否定を、明快で自然な応答として示した。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 聞き手への直接的で強調された語りかけを保った。
- source_word: ἀλλ’ ἢ
  choice: ではなく、むしろ
  rationale: 否定の後に置かれた鋭い対照を明示した。前文の「平和」を補って、日本語として対比を明瞭にした。
- source_word: διαμερισμόν
  choice: 分裂
  rationale: 直後の文脈にある家族間の分断を含みつつ、「争い」などに意味を限定しない語を選んだ。
theological_decisions:
- issue: イエスの到来と平和に関する他の箇所との緊張を弱めるか
  choice: 「平和ではなく、むしろ分裂」という鋭い対照をそのまま残す。
  alternative: 「結果として争いが生じることもある」など、付随的効果として説明的に訳す。
  rationale: 原文は意図的に強い対照を示している。ここではイエスの使命が人々、特に家庭内にもたらす分断という文脈上の効果が語られており、翻訳で他の平和の主題と調和させて緊張を解消すべきではない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの問いと否定の厳粛さを保った。「平和ではなく」を後半に補い、原文の省略された対照関係を日本語で自然かつ明瞭に示した。
