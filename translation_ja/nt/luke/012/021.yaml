id: LUK.12.21
reference: Luke 12:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως ὁ θησαυρίζων ⸀ἑαυτῷ καὶ μὴ εἰς θεὸν πλουτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/021.yaml
  text: So is the one who stores up treasure for himself and is not rich toward God[a].
translation:
  language: ja
  text: 自分のために宝を蓄え、神に対して豊かでない者は、このようである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分のために宝を蓄え、神の前で豊かでない者は、このようである。」
    reason: εἰς θεὸνは「神に対して」のほか、文脈上「神の前で」と理解する余地があるため。
lexical_decisions:
- source_word: οὕτως
  choice: このようになる
  rationale: 直前のたとえに示された結末を一般化して適用する語。日本語では文末に置くことで、自然な格言的表現とした。
- source_word: ὁ θησαυρίζων
  choice: 宝を蓄えて…者
  rationale: 定冠詞を伴う現在分詞を、継続的・特徴的な行為をする一般的な人を表す「者」で訳した。「宝を蓄える」によりθησαυρόςとの語彙的なつながりを保つ。
- source_word: ἑαυτῷ
  choice: 自分のために
  rationale: 与格の再帰代名詞が示す自己利益の方向を、直接的で自然な日本語で表した。
- source_word: καὶ μὴ
  choice: ても、…でない
  rationale: ギリシア語では二つの分詞句がκαίで結ばれるが、日本語では第一の行為と第二の欠如の緊張を自然に示すため譲歩的に構成した。意味上の対照を過度に強めない。
- source_word: εἰς θεὸν
  choice: 神に対して
  rationale: εἰςの方向性・関係性を保持し、「神のために」や「神の前で」と一義的に限定しない表現を選んだ。
- source_word: πλουτῶν
  choice: 豊かである
  rationale: 「富んでいる」も可能だが、現代日本語で人の神に対する関係的な豊かさを自然に表しつつ、比喩を保つ。
theological_decisions:
- issue: 一般的な人物を表す男性単数分詞
  choice: 者
  alternative: 男／人
  rationale: 文法上は男性単数だが、ここでは男性だけに限定せず一般的な道徳的類型を示す。「者」は適用範囲を不当に限定せず、原文の単数的な人物像も保つ。
- issue: 「神に対して豊か」の意味
  choice: 解釈的説明を加えず「神に対して豊か」とする
  alternative: 神の目に豊か／神のために豊か／神が重んじるものに富む
  rationale: 原文のεἰς θεὸνは関係的・方向的で、その具体的内容をこの節だけでは限定していない。神学的な含意と緊張を保つため説明的に狭めない。
- issue: οὕτωςに含まれる省略された帰結
  choice: 「このようになる」として直前の結末を指す
  alternative: このような者である／これと同じである
  rationale: οὕτωςは直前の愚かな金持ちの結末を受ける。日本語として必要な述語を補うが、具体的な裁きの内容は追加しない。
translation_notes:
  register: 明瞭な現代標準日本語。簡潔で格言的な調子を保ち、「宝」「豊か」という富の比喩的対照を残した。
