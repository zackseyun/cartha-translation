revisions:
- from: しかし、神は彼に言った。「愚か者よ。今夜、おまえの命[a]はおまえから取り上げられる。そうなれば、おまえが用意した物は、いったい誰のものになるのか。」
  to: しかし、神は彼に言った。「愚か者よ。まさに今夜、おまえの命[a]が、おまえから取り立てられる。おまえが用意した物は、誰のものになるのか。」
  rationale: 本文はψυχήを「命」とし、脚注で「魂」という可能性を保持する。ἀπαιτοῦσινの不定複数主語は受動表現のままとしつつ、「取り立てられる」により要求・徴収の語義を反映した。行為者は補っていない。時間表現の強調を「まさに今夜」に反映し、原文に明示されない条件的接続を削除した。
