source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: ja
  text: しかし、神は彼に言った。「愚か者よ。まさに今夜、おまえの命[a]が、おまえから取り立てられる。おまえが用意した物は、誰のものになるのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「魂」。ギリシア語は、文脈により「命」とも「魂」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: 愚か者よ
  rationale: 呼格による直接的で強い叱責を、現代日本語で自然かつ簡潔に表した。
- source_word: ταύτῃ τῇ νυκτί
  choice: 今夜
  rationale: 指示語を伴う時の表現が示す切迫性を、自然な日本語の「今夜」で伝えた。文脈上、まさにこの夜という強調も十分に明確である。
- source_word: ψυχήν
  choice: 命
  rationale: この文脈では、その夜に失われる人の生命を指す。「魂」と限定せず、語の別の可能性は脚注に残した。
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: おまえから取り上げられる
  rationale: 主語の明示されない三人称複数を受動表現にし、行為者を補わずに、命が本人の手から厳しく徴収される意味を自然な日本語で表した。
- source_word: ἃ δὲ ἡτοίμασας
  choice: そうなれば、おまえが用意した物は
  rationale: δὲが導く帰結的な対照を「そうなれば」で明確にし、蓄えた財産を指す中性複数を「物」とした。
- source_word: τίνι ἔσται
  choice: いったい誰のものになるのか
  rationale: 与格が表す帰属を自然な所有表現で訳し、「いったい」によって修辞疑問の鋭さを保った。
theological_decisions:
- issue: 死の文脈におけるψυχήの訳し方
  choice: 命
  alternative: 魂
  rationale: 目前の死と地上の生命の喪失が焦点であるため「命」とした。ただし、ギリシア語が「魂」をも意味し得ることを脚注に示し、人間論について本文以上の限定を加えないようにした。
- issue: ἀπαιτοῦσινの不定複数主語
  choice: 行為者を示さない受動表現
  alternative: 彼らがおまえに要求する
  rationale: 原文は要求する者を特定していないため、天使などの行為者を推定せず、日本語で自然な受動表現にした。
translation_notes:
  register: 明瞭で現代的ながら、神の宣告にふさわしい厳粛さを保った。「おまえ」は強い叱責を伴う直接呼びかけとして用い、過度に古風な語法は避けた。
