  source_fidelity: 「取り上げられる」は死の結果を表す点では文脈に合うものの、ἀπαιτοῦσιν が持つ「要求する・取り立てる」という語義が弱まっています。また、ταύτῃ τῇ νυκτί の強調は「今夜」だけよりも「まさに今夜」とするほうが明確です。δὲ を「そうなれば」と条件化する必要はありません。
  naturalness: 「まさに今夜」「おまえの命が、おまえから取り立てられる」は現代標準語として理解可能で、神の厳粛な宣告にも適します。「誰のものになるのか」は自然です。
  terminology: ψυχή は文脈上「命」とするのが適切であり、「魂」は脚注に保持します。「愚か者よ」はἌφρωνの強い直接の非難を自然に表します。
  issues:
