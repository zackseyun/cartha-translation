    rationale: ἀπαιτέωは単なる除去ではなく、要求する、取り立てる、返還を求めるという含意を持つ。「取り立てられる」は行為者を特定せずにこの意味を保てる。
  - severity: low
    issue: ταύτῃ τῇ νυκτίの指示的強調が十分に現れていない。
    rationale: 「まさに今夜」として「このまさに夜」の切迫性を明示する。
  - severity: low
    issue: 「そうなれば」は原文にない条件関係を明示している。
    rationale: 後半はδὲで続く問いであり、日本語では接続語を加えずに並べることで原文の関係を過度に限定しない。
