  yaml_path: translation/nt/luke/012/035.yaml
  text: Let your waists be girded and your lamps burning,[a]
translation:
  language: ja
  text: 腰に帯を締め、灯火をともしていなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すぐ行動できるよう身支度を整えることを表している。長い衣の裾をたくし上げ、帯で留めて、すぐ動けるようにする姿である。
    reason: cultural_note
lexical_decisions:
- source_word: Ἔστωσαν
  choice: …していなさい
  rationale: 三人称現在命令の継続的な勧告を、後続する二つの状態に自然にかかる現代日本語で表した。
- source_word: ὑμῶν
  choice: （文脈上の主語に含意）
  rationale: 所有関係は「腰に帯を締め」という日本語表現で明らかなため、「あなたがたの」を明示せず自然に訳した。
- source_word: ὀσφύες
  choice: 腰
  rationale: 腰部を指す具体的な身体像を、古風すぎない語で保持した。
- source_word: περιεζωσμέναι
  choice: 帯を締め
  rationale: 長い衣を帯でまとめて行動に備えるという具体的な比喩を保持した。完了分詞の結果状態は「締め…ていなさい」で表した。
- source_word: λύχνοι
  choice: 明かり
  rationale: ここでは燃えている油ランプを指す。「ともしび」より現代的で、「明かりをともす」という自然な表現になる。
- source_word: καιόμενοι
  choice: ともしていなさい
  rationale: 現在分詞が示す継続状態を、「ともしていなさい」によって表した。
theological_decisions:
- issue: 備えを表す慣用的な比喩
  choice: 「腰に帯を締め」と具体的な身体・衣服の像を本文に残す
  alternative: 「すぐ行動できる身支度をして」
  rationale: 原文は備えを直接説明せず、衣を帯でまとめる文化的な像によって示している。その比喩と解釈上の余地を本文で保持し、意味は脚注で補った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の継続性と備えの具体的な比喩を保持した。「腰に帯を締め」は dignified で理解可能な表現とし、文化的背景を脚注で説明した。
