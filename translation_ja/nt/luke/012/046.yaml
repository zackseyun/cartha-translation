id: LUK.12.46
reference: Luke 12:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: ja
  text: そのしもべの主人は、彼が予期していない日に、また彼が知らない時刻に来て、彼を二つに切り裂き[a]、不忠実な者たち[b]と同じ定めを彼に割り当てる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼を二つに切る」。この表現を「彼を厳しく罰する」という意味の慣用表現と解する見方もある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「信じない者たち」。
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: 主人
  rationale: たとえの中の「そのしもべの主人」という所有・支配関係を自然に表し、ここで語りの文言を直接キリスト論的称号「主」とすることを避ける。
- source_word: δοῦλος
  choice: しもべ
  rationale: 古代の隷属関係を指すが、日本語の聖書的・比喩的文脈で明瞭かつ品位ある「しもべ」を用いる。「主人」との組み合わせにより上下・所有関係も伝わる。
- source_word: ἥξει
  choice: 帰って来る
  rationale: 不在の主人が到着するという文脈を日本語として自然に示す。
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: 彼が予期していない日に
  rationale: προσδοκάωの「予期する」を保ち、暗黙の対象である主人の到来は文脈に委ねる。
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: 知らない時刻に
  rationale: γινώσκωを「知る」と訳し、前句の「予期する」との語義上の違いを保つ。
- source_word: διχοτομήσει
  choice: 二つに切り裂く
  rationale: 語の基本的な「二つに切る」という苛烈な像を本文に保持する。厳罰を表す慣用表現とみる可能性は脚注に示す。
- source_word: τὸ μέρος αὐτοῦ
  choice: 同じ定め
  rationale: 直訳は「彼の分・割り当て」だが、μετὰ以下と結びつく司法的な割り当てを自然な日本語で表す。
- source_word: ἀπίστων
  choice: 不忠実な者たち
  rationale: しもべの忠実さが問われる直近の文脈に合う。一方、「信じない者たち」の意味も可能なので脚注に残す。
- source_word: θήσει
  choice: 置く
  rationale: τίθημιの「置く、定める」を、「同じ定めに置く」という日本語表現で司法的な帰結として示す。
theological_decisions:
- issue: διχοτομήσειの刑罰像を字義的に保つか、重い処罰の慣用表現として訳すか
  choice: 本文では「二つに切り裂き」として強烈な像を保つ
  alternative: 「厳しく罰し」
  rationale: ギリシア語の具体的な像を弱めず、同時に慣用的理解の可能性を脚注で明示して、解釈を一つに固定しない。
- issue: ἀπίστωνを不忠実さとして訳すか、不信仰として訳すか
  choice: 本文では「不忠実な者たち」
  alternative: 「信じない者たち」
  rationale: 忠実な管理をめぐるたとえの流れには前者が適合するが、語は「不信者」をも意味し得るため、終末的審判の含意を含む後者を脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、たとえの厳粛な警告にふさわしい品位を保った。「しもべ」は平仮名表記とし、古風さを抑えつつ聖書的なたとえの語感を残した。
