id: LUK.12.26
reference: Luke 12:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: ja
  text: それなら、最も小さなことさえできないのなら、なぜ残りのこと[a]を思い悩むのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ほかのこと」。
    reason: λοιπῶνは、先に言及された「最も小さなこと」以外の事柄、すなわち「残りのこと」を指すが、「ほかのこと」とも訳せる。
lexical_decisions:
- source_word: εἰ οὖν
  choice: それなら、…できないのに
  rationale: οὖνの推論的なつながりと、εἰによる条件を自然な現代日本語で示す。「のに」は、前節までの論証を受けた修辞疑問との結びつきを明確にする。
- source_word: οὐδὲ ἐλάχιστον
  choice: 最も小さなことさえ
  rationale: 実体詞的に用いられた中性単数ἐλάχιστονを「こと」で補い、「最小の事柄さえ」という意味を保つ。
- source_word: δύνασθε
  choice: できない
  rationale: 能力・可能性を表すδύναμαιを、簡潔で自然な日本語にする。否定はοὐδὲと合わせて表現した。
- source_word: τί
  choice: なぜ
  rationale: この修辞疑問では、字義的な「何」ではなく理由を問う用法であるため、「なぜ」が適切。
- source_word: περὶ τῶν λοιπῶν
  choice: ほかのことについて
  rationale: 「最も小さなこと」と対比される、それ以外の事柄を指す。本文では日本語として自然になるよう、後続動詞と合わせて助詞「を」を用いた。
- source_word: μεριμνᾶτε
  choice: 思い悩む
  rationale: 単なる配慮ではなく、文脈上戒められている不安や心配を表す。現在形の継続的な含みも自然に伝わる。
theological_decisions:
- issue: 神への信頼についての教えにおけるμεριμνάωの訳語
  choice: 思い悩む
  alternative: 心配する／気にかける
  rationale: 思慮深い配慮そのものを禁じるようにはせず、神への信頼を損なう不安を問題にする文脈を保つ。「不安になる」よりも臨床的な響きが弱く、格調と明瞭さを両立する。
translation_notes:
  register: 明瞭で現代的な標準語を用い、イエスの修辞疑問としての簡潔さと品位を保った。「それなら」で前節からの推論を示し、「のですか」で問いかけの自然さを整えた。
