id: LUK.12.39
reference: Luke 12:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: ja
  text: しかし、このことは知っておきなさい。家の主人は、泥棒が何時に来るか分かっていたなら、自分の家が破られるのを許さなかったでしょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「自分の家が掘り抜かれるのを」。当時、家の壁を破って侵入することを指します。
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: しかし、このことは知っておきなさい
  rationale: γινώσκετεは現在能動命令法二人称複数で、聞き手に認識を促す。日本語では「知っておきなさい」が継続的な心構えを自然に表し、δέは文脈上の転換を「しかし」で示した。
- source_word: ὅτι
  choice: （「知っておきなさい」の後の内容提示）
  rationale: ὅτιは知るべき内容を導入する。日本語では接続詞を逐語的に置かず、句点の後にその内容を直接述べることで自然に機能を再現した。
- source_word: ὁ οἰκοδεσπότης
  choice: 家の主人
  rationale: 家または世帯を取り仕切る者を指す。「家の主人」は所有者だけに限定せず、原語の社会的役割を明確に伝える。
- source_word: ποίᾳ ὥρᾳ
  choice: 何時に
  rationale: ὥραの時刻としての具体性を保ちつつ、現代日本語として自然である。
- source_word: ὁ κλέπτης ἔρχεται
  choice: 泥棒が何時に来るか
  rationale: ἔρχεταιは形態上現在形だが、非現実の過去条件の中で予想される到来を表す。日本語では時制を過度に限定せず「来るか」とするのが自然で、原文の形にも近い。
- source_word: εἰ ᾔδει
  choice: 分かっていたなら
  rationale: 過去の非現実条件を日本語の「ていたなら」で明示する。「知っていた」も可能だが、同節内で「知る」の反復を避け、時刻を把握していた意味を自然に表した。
- source_word: οὐκ ἂν ἀφῆκεν
  choice: 押し入らせはしなかったでしょう
  rationale: ἄνを伴うアオリストは反実仮想の帰結を表す。「しなかったでしょう」により、その非現実性を明確にした。ἀφίημιの許容の意味は使役許容形「させる」に含めた。
- source_word: διορυχθῆναι
  choice: 押し入らせ
  rationale: 字義は家の壁などを「掘り抜かせる」ことだが、文脈上は侵入を許す意味。「押し入る」は現代日本語で明瞭であり、具体的な壁の破壊方法は脚注に残した。
- source_word: τὸν οἶκον αὐτοῦ
  choice: 自分の家
  rationale: 主語である家の主人自身の家を指すため、「自分の家」が照応関係を自然かつ明確にする。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら dignified な標準語を用いた。冒頭の命令は直接性を保ち、反実仮想は日本語で自然に理解できる形にした。脚注記号[a]は、説明対象である侵入表現を含む文の直後に置いた。
