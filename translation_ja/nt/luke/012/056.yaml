    rationale: τὸν καιρὸν τοῦτον は「この時」で十分に対応する。「今の」を加えると、原文に明示されない現在性を余分に前景化する。
  - severity: low
    issue: 「見分けることを知っている」がやや不自然である。
    rationale: οἶδα＋不定詞の「方法・能力を知る」は、日本語では「見分けるすべを知っている」とするほうが自然であり、前後の反復も保てる。
  revised_text: 偽善者たちよ。あなたがたは地と空の様子を見分けるすべを知っているのに、どうしてこの時を見分けるすべを知らないのか。
