- from: 偽善者たちよ。あなたがたは、大地と空の様子を見分けることを知っている。それなのに、どうして今のこの時[a]を見分けることを知らないのか。
  to: 偽善者たちよ。あなたがたは地と空の様子を見分けるすべを知っているのに、どうしてこの時を見分けるすべを知らないのか。
  rationale: 本文から「今の」を除き、τοῦτον καιρόν の指示性と καιρός の含意を過度に限定せずに保持した。「見分けるすべを知っている／知らない」として、οἶδα＋不定詞の能力・方法の意味と原文の反復を自然な日本語で再現した。脚注は本文が含意を説明しすぎないようにしつつ、καιρός の可能な語義を示すため維持した。
