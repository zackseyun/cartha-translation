id: LUK.12.56
reference: Luke 12:56
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑποκριταί, τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ οἴδατε δοκιμάζειν, τὸν ⸂δὲ καιρὸν⸃ τοῦτον πῶς ⸂οὐκ οἴδατε δοκιμάζειν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/056.yaml
  text: Hypocrites! You know how to interpret the appearance of the earth and the sky[a], but how is it that you do not know how to interpret this time?
translation:
  language: ja
  text: 偽善者たちよ。あなたがたは地と空の様子を見分けるすべを知っているのに、どうしてこの時を見分けるすべを知らないのか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποκριταί
  choice: 偽善者たちよ
  rationale: 呼格による直接的な叱責。ここでは舞台俳優という字義ではなく、言動や認識の不一致を責める定着した意味を表す。
- source_word: τὸ πρόσωπον τῆς γῆς καὶ τοῦ οὐρανοῦ
  choice: 大地と空の様子
  rationale: πρόσωπον はこの表現で目に見える様相を指す。γῆ と οὐρανός は天候の兆候という文脈から「大地」と「空」とした。
- source_word: οἴδατε δοκιμάζειν
  choice: 見分けることを知っている
  rationale: οἶδα＋不定詞の「仕方・能力を知っている」という意味を保ち、δοκιμάζω は観察した兆候を吟味して判別する意として「見分ける」とした。
- source_word: τὸν δὲ καιρὸν τοῦτον
  choice: 今のこの時
  rationale: τοῦτον の指示性を「この」で、καιρός の具体的で意義ある時という含みを「時」で表した。「今の」を添えて目前の時を自然な日本語で示すが、その神学的内容までは特定しない。
- source_word: πῶς οὐκ οἴδατε δοκιμάζειν
  choice: どうして…見分けることを知らないのか
  rationale: 憤りを帯びた修辞疑問を保ち、前半と同じ「見分ける」「知っている／知らない」の反復を再現した。
theological_decisions:
- issue: καιρός が指す時の性格
  choice: 今のこの時
  alternative: この季節／この決定的な時
  rationale: イエスの働きの時を見分けられないことが背景にあるが、訳文では「決定的」などを補わず、καιρός の意義ある時という含みと指示性を保持した。
translation_notes:
  register: 現代の一般読者に明快でありながら、叱責の強さと修辞的な反復を保つ格調ある標準語。「様子を見分ける」は天候の兆候を読み取る文脈に自然である。
