id: LUK.12.54
reference: Luke 12:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ καὶ τοῖς ὄχλοις· Ὅταν ⸀ἴδητε νεφέλην ἀνατέλλουσαν ⸀ἐπὶ δυσμῶν, εὐθέως λέγετε ⸀ὅτι Ὄμβρος ἔρχεται, καὶ γίνεται οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/054.yaml
  text: He was also saying to the crowds[a], “When you see a cloud rising in the west, you immediately say, ‘A rainstorm is coming,’ and so it happens.”
translation:
  language: ja
  text: また、群衆にもこう言っておられた。「西の空に雲がわき上がるのを見ると、あなたがたはすぐに、『ひと雨[a]来る』と言う。そして、そのとおりになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「雨が来る」とも訳せる。ギリシア語の「オンブロス」は、雨一般を指すことも、強い雨や大雨を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 言われた
  rationale: 未完了時制の背景的・継続的な発話を文脈に自然な日本語で表した。日本語では「言っておられた」より簡潔で、尊敬表現によって主語がイエスであることにも適合する。
- source_word: δὲ καὶ
  choice: また…にも
  rationale: δέの談話上の継続とκαίの付加的意味を、自然な日本語の「また」と助詞「にも」で表した。
- source_word: τοῖς ὄχλοις
  choice: 群衆
  rationale: ギリシア語は複数形だが、日本語では集合を指す「群衆」が自然であり、単数・複数を不必要に明示しない。
- source_word: Ὅταν ἴδητε
  choice: 見ると
  rationale: 一般的・反復的な条件を表すὅταν＋接続法を、日本語の習慣的条件表現「見ると」で表した。
- source_word: νεφέλην
  choice: 雲
  rationale: 語そのものは雨雲に限定されないため、文脈から天候上の意味が分かる基本語「雲」とした。
- source_word: ἀνατέλλουσαν ἐπὶ δυσμῶν
  choice: 西の空に…わき上がる
  rationale: 雲が西方に現れて上がってくる光景を、現代日本語で自然かつ具体的に表した。起点を強調する「西から」も可能だが、観察される位置を示す表現を採った。
- source_word: εὐθέως
  choice: すぐに
  rationale: 即時性を保ちつつ、普通の現代日本語として自然な語を選んだ。
- source_word: λέγετε
  choice: 言う
  rationale: 現在形の習慣的・一般的な意味を日本語の非過去形で表した。
- source_word: Ὄμβρος
  choice: ひと雨
  rationale: 雨一般にも強い雨にもなり得る語の幅を、天候の予測として自然な「ひと雨」で表した。強さを「豪雨」などに限定しない。
- source_word: ἔρχεται
  choice: 来る
  rationale: 差し迫った到来を表す現在形を、日本語の自然な天候表現「雨が来る」に対応させた。
- source_word: καὶ γίνεται οὕτως
  choice: すると、そのとおりになる
  rationale: 予測どおりの事態が生じることを、原文の結果的なつながりを保って自然に表した。
