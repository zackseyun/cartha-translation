id: LUK.12.58
reference: Luke 12:58
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: ja
  text: というのも、あなたがあなたを訴える者と一緒に役人のところへ行くときには、道の途中で、その人から解放されるよう力を尽くしなさい。[a] そうでなければ、その人はあなたを裁判官のもとへ引き立て、裁判官はあなたを執行官に引き渡し、執行官はあなたを牢に投げ込むだろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「道の途中で相手と決着をつけるよう力を尽くしなさい」。ギリシア語は直訳すると「その人から解放されるように」だが、文脈では裁判官のもとに着く前に争いを解決することを指すと考えられる。
    reason: 語句の別訳と文脈上の含意を示すため。
lexical_decisions:
- source_word: ἀντιδίκου
  choice: 訴える者
  rationale: 訴訟上の相手方を指す語であり、ここでは告発・請求を携えて同行する人物として描かれる。「敵対者」より法律的な場面が明確で、「原告」ほど近代的な訴訟制度に限定されない。
- source_word: ἄρχοντα
  choice: 役人
  rationale: 一般には支配者・権威者を表すが、ここでは争いが持ち込まれる公的権限者を指す。「行政官」は精密だが硬いため、現代日本語として明瞭な「役人」とした。後続の「裁判官」との語の違いも保った。
- source_word: δὸς ἐργασίαν
  choice: 力を尽くしなさい
  rationale: 直訳的には「努力を払いなさい」という慣用表現で、事態を避けるため積極的に努めるよう促している。「力を尽くす」は命令の強さを自然で品位ある日本語で伝える。
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: その人から解放される
  rationale: 相手の請求や拘束から離れるという原文の表現を保ち、和解・示談という具体的手段に本文で限定しない。文脈上の意味は脚注で示した。
- source_word: κατασύρῃ
  choice: 引き立てる
  rationale: 強制的に連れて行く力強い動詞である。法的場面に自然な「引き立てる」により、単なる同行ではない強制性を伝える。
- source_word: κριτήν / κριτής
  choice: 裁判官
  rationale: 司法的判断を下す者を指す標準的な意味を明瞭に表す。
- source_word: παραδώσει
  choice: 引き渡す
  rationale: 裁判官から命令執行者への司法的な身柄の移管を、自然な現代日本語で表す。
- source_word: πράκτορι / πράκτωρ
  choice: 執行官
  rationale: 判決や債務取立てを執行する役人を指す。日本の現行制度上の職名と完全に同一視する意図はないが、「役人」だけでは役割が曖昧なため、機能を端的に示す語を選んだ。
- source_word: βαλεῖ εἰς φυλακήν
  choice: 牢に投げ込む
  rationale: βάλλωの強い動きを保つ。「刑務所に入れる」より古代の拘禁場面に合い、原文の切迫感も伝える。
- source_word: ὡς γὰρ
  choice: というのも、…ときには
  rationale: γάρの説明的なつながりを「というのも」で示し、ὡςが導く状況を日本語として自然な条件・時の構文で表した。
- source_word: ἐν τῇ ὁδῷ
  choice: 道の途中で
  rationale: 裁判の場に到着する前という文字どおりの移動と時間的切迫感の双方を保つ。
theological_decisions:
- issue: 法的なたとえの霊的意味を本文で明示するか
  choice: 法的場面をそのまま訳し、人物や拘禁の霊的対応関係を特定しない。
  alternative: 神との和解や最後の審判への勧告として解釈を本文に織り込む。
  rationale: 直近の文言は訴訟の情景を描いており、訴える者、裁判官、牢が誰または何を指すかは明示していない。より広い文脈に終末的な切迫感があり得ても、本文では原文の比喩と神学的緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法的警告の厳粛さと切迫感を保った。「牢」「引き立てる」はやや格調があるが、一般読者にも理解でき、原文の強い描写に適している。
