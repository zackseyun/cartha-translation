id: LUK.12.4
reference: Luke 12:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Λέγω δὲ ὑμῖν τοῖς φίλοις μου, μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/004.yaml
  text: But I say to you[a], my friends, do not fear those who kill the body and after that have nothing more they can do.
translation:
  language: ja
  text: しかし、わたしの友であるあなたがたに言います。体を殺し、その後にはそれ以上何もできない者たちを恐れてはいけません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω δὲ
  choice: しかし、…言います
  rationale: δέはここで談話の移行と緩やかな対照を示す。「しかし」は文脈上の転換を自然に表し、「言います」は現在形の発話を明瞭に伝える。
- source_word: ὑμῖν τοῖς φίλοις μου
  choice: わたしの友であるあなたがたに
  rationale: ὑμῖνと同格的なτοῖς φίλοις μουの両方を保ち、聞き手を「わたしの友」と呼ぶ親しい呼びかけを明示する。
- source_word: μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων
  choice: …殺す者たちを恐れてはいけません
  rationale: μήを伴うアオリスト接続法の禁止を、現代日本語で自然かつ明確な「恐れてはいけません」とする。ἀπόはφοβέομαιの恐れの対象を示すため、目的語として訳す。
- source_word: τὸ σῶμα
  choice: 体
  rationale: ここでは肉体を指す。日本語では一般的・総称的な「体」が自然であり、原文にない「魂」との対比は補わない。
- source_word: καὶ μετὰ ταῦτα
  choice: その後は
  rationale: 身体を殺すことに続く時間的順序を、簡潔で自然な現代日本語で表す。助詞「は」により、その後に及ばない人間の力の限界も自然に際立つ。
- source_word: μὴ ἐχόντων περισσότερόν τι ποιῆσαι
  choice: それ以上何もできない
  rationale: 直訳的な「それ以上何かをするものを持たない」ではなく、能力・余地がないという意味を自然に表す。「それ以上」は比較的な限界を保持し、何ができないかを解釈的に補わない。
theological_decisions:
- issue: 肉体の死後に及ぶ人間の力の範囲
  choice: 人間は体を殺した後、それ以上何もできないとだけ述べる。
  alternative: 「魂を殺すことはできない」と明示的に補う。
  rationale: 原節は魂に言及していない。次節の神の権威との対照を先取りせず、この節自体が示す人間の力の限界だけを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの親しい呼びかけと厳粛な禁止命令を保った。「者たち」は対象が複数であることを示しつつ、過度に古風にならない表現とした。原文上、有力な別訳を必要とするほどの曖昧さはないため脚注は付していない。
