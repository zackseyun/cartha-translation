  text: ἀληθῶς λέγω ὑμῖν ὅτι ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ καταστήσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/044.yaml
  text: Truly I tell you that he will appoint him over all that he has[a].
translation:
  language: ja
  text: まことに、あなたがたに言います。主人は彼を、自分の持ち物すべてを管理する者に任命します。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の全財産の上に置きます」「自分の所有物すべてを管理させます」。
    reason: πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦは主人に属するすべての所有物を指し、ἐπί＋与格とκαταστήσειは、その全体に対する管理権を彼に委ねることを表す。
lexical_decisions:
- source_word: ἀληθῶς
  choice: まことに
  rationale: 発言の真実性と厳粛さを強調する副詞。イエスの断言として自然で品位のある日本語にした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の呼びかけと権威ある断言を保つ、明瞭な現代日本語の定型表現。
- source_word: ἐπὶ πᾶσιν τοῖς ὑπάρχουσιν αὐτοῦ
  choice: 自分のすべての財産を任せる者に
  rationale: ἐπί＋与格が示す管理権を日本語で明示し、ὑπάρχονταを所有物全般を指す「財産」とした。構文全体として「すべての財産の上に置く」の不自然さを避けた。
- source_word: καταστήσει
  choice: 任命します
  rationale: この文脈では、ある者を管理上の地位に就けることを表す未来形。日本語では確実な将来を現在形でも自然に表せる。
- source_word: αὐτόν
  choice: その人を
  rationale: 直前のたとえに登場する男性単数の僕を指す。日本語では目的語を明示しつつ、過度に性別を強調しない自然な指示表現とした。
theological_decisions:
- issue: たとえの中の男性単数の指示
  choice: 「その人」を用いる
  alternative: 「彼」を用いる
  rationale: ギリシア語の男性単数の指示対象を保持しながら、現代日本語として自然に直前の忠実な管理人を指す。「その人」は性別を変更する表現ではなく、文脈上の個人を指す。
- issue: 主人の任命が及ぶ範囲
  choice: 「自分のすべての財産」
  alternative: 「自分の持ち物すべて」
  rationale: 所有物の包括性を保ち、物質的財産に限定しすぎないよう脚注で別訳を示した。終末論的・教会論的な具体的意味を本文に付加しない。
translation_notes:
  register: 明瞭で現代的ながら、イエスの厳粛な断言にふさわしい品位を保った。「まことに」はやや格調があるが、一般読者にも理解可能。
