- from: 主は言われた。「それでは、主人が自分の召し使いたちの上に立て、決まった時に食糧の割り当て[a]を与えさせる、忠実で思慮深い[b]管理人とは、いったい誰でしょうか。」
  to: 主は言われた。「それでは、主人が自分の召し使いたちを任せ、ふさわしい時に食べ物の配給[a]を与える役目に就かせる、忠実で思慮深い[b]管理人とは、いったい誰でしょうか。」
