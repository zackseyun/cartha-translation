reference: Luke 12:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ εἶπεν⸃ ὁ κύριος· Τίς ἄρα ἐστὶν ὁ πιστὸς οἰκονόμος, ⸀ὁ φρόνιμος, ὃν καταστήσει ὁ κύριος ἐπὶ τῆς θεραπείας αὐτοῦ τοῦ διδόναι ἐν καιρῷ ⸀τὸ σιτομέτριον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/042.yaml
  text: And the Lord said[a], “Who then is the faithful and prudent steward[b], whom the master will appoint over his household staff to give them their food allowance at the proper time?”
translation:
  language: ja
  text: 主は言われた。「それでは、主人が自分の召し使いたちを任せ、ふさわしい時に食べ物の配給[a]を与える役目に就かせる、忠実で思慮深い[b]管理人とは、いったい誰でしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「穀物の配給量」。各々に量って与えられる食物の分け前を指す。
    reason: lexical_alternative
  - marker: b
    text: 「賢い」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: 主／主人
  rationale: 語り手がイエスを指す最初の用例は称号として「主」、たとえの中で家を治める者を指す二番目の用例は文脈に即して「主人」とした。同じギリシア語の意味範囲を保ちつつ、二つの叙述水準を自然な日本語で区別する。
- source_word: πιστός
  choice: 忠実な
  rationale: 任された務めを確かに果たす、信頼に値する性質を表すため、管理責任の文脈に定着した「忠実な」とした。
- source_word: οἰκονόμος
  choice: 管理人
  rationale: 家や財産の運営を委ねられた者を指す。現代の一般読者に明瞭であり、委託された管理という意味も伝わる。
- source_word: φρόνιμος
  choice: 思慮深い
  rationale: 実際的な知恵と適切な判断力を表す。「思慮深い」は人格的・実務的な慎重さを自然に伝え、「賢い」という可能な訳は脚注に示した。
- source_word: καταστήσει
  choice: 上に立て
  rationale: 責任ある地位に据えることを表す。θεραπείαに対する監督関係を明示しつつ、たとえの語り口に合う表現とした。
- source_word: θεραπείας
  choice: 召し使いたち
  rationale: ここでは抽象的な「奉仕」ではなく、主人に仕える者たちの集団を指す。現代日本語で理解しやすい複数表現とした。
- source_word: ἐν καιρῷ
  choice: 決まった時に
  rationale: 食事を配るのにふさわしい、定められた時を表す。単なる時間経過ではなく、適切な時機という含みを保持する。
- source_word: σιτομέτριον
  choice: 食糧の割り当て
  rationale: 各人に量って配る食物の分け前を指す。本文では機能が明瞭な表現とし、穀物を量った配給分という字義的ニュアンスを脚注に残した。
theological_decisions:
- issue: 二度現れる κύριος の訳し分け
  choice: イエスを指す語り手の表現は「主」、たとえ内部の家の所有者は「主人」
  alternative: 両方を「主」とする
  rationale: 原文では同一語だが、最初はイエスへの称号、二番目は管理人を任命する家の主人を指す。指示対象の違いを日本語で明確にしながら、κύριος の語義範囲を保つ。
- issue: 問いの開放性
  choice: 「いったい誰でしょうか」と疑問の形を保持
  alternative: 特定の人物や職務集団を答えとして補う
  rationale: 原文は修辞的な問いを提示するだけで、この節自体では対象を限定していないため、教派的な同定を加えない。
translation_notes:
  register: 明瞭で現代的ながら、イエスの発言として品位ある問いの調子を保った。「召し使いたち」は集団名詞 θεραπεία を具体化し、「与えさせる」によって管理人が配給を担う目的を示した。脚注記号は該当語句の直後に配置した。
