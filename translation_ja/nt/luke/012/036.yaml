review_pass:
  verdict: revise
  source_fidelity: 原文は、主人が婚宴から戻るのを待ち受け、主人が来て戸をたたく時には直ちに戸を開ける僕・召使いたちの態度に、聞き手をなぞらえる。草案は全体の比喩と「婚宴」「主人」を適切に保っているが、結びの「すぐに開けられるように」は可能表現にも受け取れ、原文の能動の「彼らが直ちに彼に開ける」をやや弱める。
  naturalness: 「あなたがたも」「主人」「婚宴」は明快な現代標準日本語である。目的・結果を示す後半を前半の比喩的人々の描写に統合すると、末尾の「ように」の係り先が明瞭になり、自然である。
  terminology: κύριον ἑαυτῶν はこのたとえの直接の場面では「自分たちの主人」が適切であり、称号としての「主」を強制しない。「婚宴」はγάμοιの婚礼の祝宴という意味に合う。
  issues:
