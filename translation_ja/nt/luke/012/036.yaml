id: LUK.12.36
reference: Luke 12:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς ὅμοιοι ἀνθρώποις προσδεχομένοις τὸν κύριον ἑαυτῶν πότε ἀναλύσῃ ἐκ τῶν γάμων, ἵνα ἐλθόντος καὶ κρούσαντος εὐθέως ἀνοίξωσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/036.yaml
  text: And you, be like men waiting for their lord when he returns from the wedding feast, so that when he comes and knocks, they may open to him at once.
translation:
  language: ja
  text: あなたがたも、自分たちの主人が婚宴から帰って来るのを待ち、主人が来て戸をたたいたら、すぐに戸を開ける人々のようでありなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριον ἑαυτῶν
  choice: 自分たちの主人
  rationale: このたとえにおける家の主人と仕える者たちの関係を自然な現代日本語で示す。「主」も可能だが、ここでは一般名詞としての社会的関係が前景化している。
- source_word: ἀναλύσῃ ἐκ τῶν γάμων
  choice: 婚宴から帰って来る
  rationale: ἀναλύω はここでは出先から戻る意。γάμοι の複数形は婚礼の祝宴を指す慣用的用法なので「婚宴」とした。
- source_word: προσδεχομένοις
  choice: 待つ
  rationale: 期待しつつ待ち受ける意味を、文脈上過度に補足せず簡潔に表した。
- source_word: εὐθέως ἀνοίξωσιν αὐτῷ
  choice: すぐに開けられる
  rationale: 即応できる備えを表す目的節として自然に訳した。戸は直前の「戸をたたく」から明らかなため反復を避けた。
theological_decisions:
- issue: κύριος の訳語
  choice: 主人
  alternative: 主
  rationale: イエスを暗示するたとえとしての含意を否定せず、直接の物語場面では僕たちが待つ家の主人を指すため「主人」とした。特定の称号解釈を訳文だけで固定しない。
- issue: 命令の補充
  choice: 「ようでありなさい」
  alternative: 「ような者でいなさい」
  rationale: ギリシア語は「あなたがたも、待つ人々のように」と述語を省略するが、直前の文脈から勧告・命令の力を補って自然な日本語にした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。たとえの家内関係を「主人」で表し、文を二つに分けて即時に応答する備えを読み取りやすくした。
