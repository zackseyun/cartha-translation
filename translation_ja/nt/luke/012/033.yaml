id: LUK.12.33
reference: Luke 12:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: ja
  text: 自分の持ち物を売り、貧しい人々に施しを与えなさい[a]。自分のために、古びることのない財布、すなわち天にある尽きることのない宝を作りなさい[b]。そこでは、盗人が近寄ることも、蛾が食い荒らすこともありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「施し」とは、困っている人に与えることによって表される憐れみの行為です。
    reason: lexical_clarification
  - marker: b
    text: 原文では「天」は複数形で、「もろもろの天に」となっています。
    reason: source_form
lexical_decisions:
- source_word: πωλήσατε
  choice: 売りなさい
  rationale: アオリスト命令法の明確な命令を自然な現代日本語で表す。文脈に明記されていない全財産の処分までは訳語に加えない。
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: 自分の持ち物
  rationale: 所有する財物を指す表現として、一般読者に分かりやすく、過度に法律的でない訳とした。
- source_word: δότε ἐλεημοσύνην
  choice: 貧しい人々に施しをしなさい
  rationale: ἐλεημοσύνηが、困窮者への具体的な憐れみの行為としての施しを指すことを明示する。
- source_word: ποιήσατε ἑαυτοῖς
  choice: 自分のために…作りなさい
  rationale: 再帰代名詞の与格が示す、自分自身のために行うという意味を保持する。
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: 古びることのない財布
  rationale: βαλλάντιονの金銭を入れる袋という具体的比喩と、παλαιόωの古びる意味を自然に伝える。
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: 尽きることのない宝
  rationale: ἀνέκλειπτοςの『尽きない、なくならない』という意味を簡潔に表し、宝の比喩を保つ。
- source_word: ἐν τοῖς οὐρανοῖς
  choice: 天にある
  rationale: ギリシア語は複数形だが、これはユダヤ・新約聖書の慣用であり、日本語では『天に』が自然で意味も損なわない。原語の複数形は脚注で示す。
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: そこには盗人も近寄らず
  rationale: ἐγγίζωの空間的な『近寄る』という像を保持しつつ、自然な日本語にした。
- source_word: οὐδὲ σὴς διαφθείρει
  choice: 虫も食い荒らしません
  rationale: σήςは衣類などを食害する蛾・その幼虫を指し、διαφθείρωはここでは損ない滅ぼすこと。日本語で比喩が伝わりやすい慣用的な表現を採った。
theological_decisions:
- issue: ἐλεημοσύνηνが指す施しの対象と行為
  choice: 貧しい人々に施しをしなさい
  alternative: 施しをしなさい
  rationale: 単なる一般的慈善ではなく、困窮者への具体的な憐れみの行為であることを伝える一方、本文以上の経済制度や全面的放棄を読み込まない。
- issue: 『古びない財布』と『尽きない宝』の統語的関係
  choice: 『すなわち』を用いて同格的説明として訳す
  alternative: 並列的に『財布と宝を作りなさい』と読む
  rationale: 単数の『宝』が複数の『財布』を説明する同格的な関係と理解するのが自然だが、原文の比喩的な緊張を保つため双方の像を本文に残す。
- issue: ἐν τοῖς οὐρανοῖςの複数形
  choice: 本文は『天に』、脚注で原文の複数形を示す
  alternative: もろもろの天に
  rationale: 日本語の聖書的・宗教的用法では単数形の『天』が自然であり、複数形を直訳すると宇宙論的な含意を不必要に生じさせうるため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の力と『財布』『宝』『盗人』『虫』という具体的な比喩を保持した。文体は威厳を保ちつつ、古語的な『汝ら』『施せ』などは避けた。
