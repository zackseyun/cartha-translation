  text: ὁ δὲ εἶπεν αὐτῷ· Ἄνθρωπε, τίς με κατέστησεν ⸀κριτὴν ἢ μεριστὴν ἐφ’ ὑμᾶς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: ja
  text: しかし、イエスはその人に言われた。「あなた、だれがわたしを、あなたがたを裁く裁判官または財産を分ける分配人として任命したのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: その人に（呼びかけ自体は訳文上「あなたがた」に続く自然な発話として処理）
  rationale: 直訳的な「人よ」は現代日本語では不自然で、場合によっては尊大な響きを生む。発話の相手は直前の「その人」で明確なため、呼びかけの機能を自然な文脈に織り込んだ。
- source_word: κριτήν
  choice: 裁判官
  rationale: 争いを裁定する公的・法的役割を表す語であり、相続問題という文脈にも適する。
- source_word: μεριστήν
  choice: 分配人
  rationale: 財産を実際に分ける役割を表す語義を保ち、「仲裁人」としてκριτήςとの区別を曖昧にしない。
- source_word: κατέστησεν
  choice: 任命した
  rationale: ある役職・立場に据えるという語義を明確に表す。
- source_word: ἐφ’ ὑμᾶς
  choice: あなたがたの上に
  rationale: 複数形を保持し、話しかけられた者とその兄弟の双方に対する権限という含意を残す。
theological_decisions:
- issue: イエスが裁き一般を否定しているか
  choice: 相続争いにおける裁判官・分配人への任命を問う表現として訳す
  alternative: イエスが一切の裁判権を否定しているように一般化する
  rationale: 本文は具体的な依頼への修辞的な問いであり、キリスト論的な権威全般について結論を加えてはいない。
translation_notes:
  register: 明瞭で現代的な敬体。原文の修辞疑問と、裁定する者（κριτής）・実際に分ける者（μεριστής）の区別を保持した。
