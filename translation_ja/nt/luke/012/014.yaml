  naturalness: 「あなた、だれが…」は現代標準日本語として自然であり、「人よ」のような不自然または過度に尊大な響きを避けつつ、原文の呼びかけを明示できる。「あなたがたの上に」はやや直訳調なので、「あなたがたを裁く／…分ける者として」として自然に表現する。
  terminology: κριτήςは「裁判官」、μεριστήςは「分配人」とし、裁定者と実際の分配を行う者という区別を維持する。文脈上「財産を分ける者」と補うことは、相続分配の依頼を明確にする自然な表現であり、意味を限定しすぎない。
