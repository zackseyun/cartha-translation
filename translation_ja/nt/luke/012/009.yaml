  text: ὁ δὲ ἀρνησάμενός με ἐνώπιον τῶν ἀνθρώπων ἀπαρνηθήσεται ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/009.yaml
  text: But the one who denies me before men will be denied before the angels of God[a][b].
translation:
  language: ja
  text: しかし、人々の前でわたしを否認する者は、神の天使たちの前で否認される[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後半の原文動詞は前半の「否認する」と同系で、接頭辞により強意を帯びる可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ἀρνησάμενός
  choice: しかし、…否む者は
  rationale: δέによる前節との対照を「しかし」で示し、冠詞付きアオリスト分詞は一般的原則を表す名詞的用法として、自然な現在形「否む者」とした。
- source_word: με
  choice: わたしを
  rationale: イエスを指す直接目的語を明示的に保った。
- source_word: ἐνώπιον
  choice: …の前で
  rationale: 人前での公的な態度と天上での場面との対応を、簡潔で自然な日本語で示す。
- source_word: τῶν ἀνθρώπων
  choice: 人々
  rationale: ここでは性別を限定せず人間一般を指し、「神の御使いたち」と対照されているため、「人々」が明瞭で自然である。
- source_word: ἀπαρνηθήσεται
  choice: 否まれる
  rationale: 未来受動を保持し、行為者を補わない。「否む…否まれる」という語の対応も保つ。接頭辞による強意の可能性は脚注で示す。
- source_word: τῶν ἀγγέλων τοῦ θεοῦ
  choice: 神の御使いたち
  rationale: 属格関係を自然に表しつつ、ἄγγελοιを聖書本文にふさわしい現代日本語「御使い」で訳した。
theological_decisions:
- issue: 「否まれる」の暗黙の行為者
  choice: 受動表現のままにし、行為者を明示しない。
  alternative: 「人の子に否まれる」または「神に否まれる」と補う。
  rationale: ギリシア語本文は受動態で行為者を名指ししていない。直前の8節から推測は可能だが、本節自体の曖昧さと神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、厳粛な対句の調子を保った。「人々」は人間一般を指し、「御使いたち」との対照を自然に表す。
