  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: ja
  text: それから、彼らに言われた。「よく注意し、あらゆる貪欲[a]から身を守りなさい。たとえ持ち物が豊かであっても、人の命はそれによって成り立つものではないからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「貪欲」は、「むさぼり」または「より多くを得ようとする欲望」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε καὶ φυλάσσεσθε
  choice: よく注意し、…から身を守りなさい
  rationale: 二つの複数命令の警告と自己防衛のニュアンスを保ちつつ、現代日本語として自然にした。
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: あらゆる貪欲から
  rationale: πάσηςの包括性を「あらゆる」で表し、πλεονεξίαが示す、より多く得ようとする欲望を「貪欲」とした。
- source_word: ὅτι
  choice: …からです
  rationale: 先行する警告の理由を示す因果関係を自然な日本語で表した。
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: どれほど多くの物を持っていても、人の命は…によって成り立つものではない
  rationale: 直訳調を避けながら、豊富に所有することが命の基盤・本質ではないという構文の趣旨を保持した。
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: その所有物によって
  rationale: ὑπάρχονταを本人に属する財物として簡潔に表し、ἐκの源泉・根拠の含意を「によって」で示した。
theological_decisions:
- issue: πλεονεξίαの警告の範囲
  choice: あらゆる貪欲
  alternative: あらゆるむさぼり／すべての強欲
  rationale: 他人の物を欲しがることだけに狭めず、際限なく多くを得ようとする欲望全般への警告として訳した。
- issue: 命と所有物の関係
  choice: 人の命はその所有物によって成り立つものではない
  alternative: 人の命は財産の豊かさの中にはない
  rationale: 命の価値だけでなく、その成立・存立が所有の豊かさに由来しないという原文の緊張を保った。一般的な「人」とし、男性に限定しなかった。
translation_notes:
  register: 明瞭で現代的だが、イエスの警告にふさわしい端正さを保った。「よく注意し」と「身を守りなさい」を併置して原文の二重命令を反映した。
