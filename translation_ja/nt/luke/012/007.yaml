id: LUK.12.7
reference: Luke 12:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ καὶ αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι ἠρίθμηνται· ⸀μὴ φοβεῖσθε· πολλῶν στρουθίων διαφέρετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/007.yaml
  text: But even the hairs of your head have all been counted[a]. Do not fear[b]; you are worth more than many sparrows.
translation:
  language: ja
  text: しかし、あなたがたの髪の毛さえ、一本残らず数えられています。恐れてはいけません。あなたがたは、多くの雀よりも価値があるのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: しかし、…さえ
  rationale: 前の文との対比を「しかし」で示し、καίの強意を自然な日本語の「さえ」で表した。
- source_word: αἱ τρίχες τῆς κεφαλῆς ὑμῶν πᾶσαι
  choice: あなたがたの髪の毛さえ、一本残らず
  rationale: 具体的な身体像を保ちつつ、πᾶσαιの一つ一つに及ぶ意味を「一本残らず」で明確にした。
- source_word: ἠρίθμηνται
  choice: 数えられています
  rationale: 完了受動形の、すでに数えられており現在もその状態にあるという含みを、現代日本語で自然に表した。行為者である神は原文どおり明示しない。
- source_word: μὴ φοβεῖσθε
  choice: 恐れてはいけません
  rationale: 禁止命令を直接的かつ品位ある現代日本語で表した。
- source_word: πολλῶν στρουθίων
  choice: 多くの雀
  rationale: 直前の文脈と具体的な鳥のイメージを保った。
- source_word: διαφέρετε
  choice: 価値がある
  rationale: この文脈では単に「異なる」ではなく比較上の価値を表すため、「多くの雀よりも価値がある」とした。
theological_decisions:
- issue: 人間と雀の比較価値
  choice: あなたがたは、多くの雀よりも価値がある
  alternative: あなたがたは、多くの雀よりも優れている
  rationale: 神の配慮を小さいものから大きいものへ論じる文脈に沿い、比較価値を明瞭に示す一方、人間の価値について本文を越えた体系的主張は加えない。
- issue: 髪を数えた主体
  choice: 受動表現のまま主体を明示しない
  alternative: 神があなたがたの髪の毛をすべて数えておられます
  rationale: 文脈上、神の知と配慮が含意されるが、原文は行為者を明示しないため、その含みを保った。
translation_notes:
  register: 明快な現代標準日本語。普通の読者に理解しやすく、会話的になりすぎない品位を保った。「一本残らず」によって原文の強調を自然に再現した。
