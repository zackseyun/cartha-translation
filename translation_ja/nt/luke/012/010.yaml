id: LUK.12.10
reference: Luke 12:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: ja
  text: また、人の子に逆らう言葉を口にする者は皆、その罪を赦される[a]。しかし、聖霊を冒涜する者は、赦されない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「それはその人に赦される」。何が赦されるかは、原文では明示されていません。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: …者は皆
  rationale: 分配的かつ一般的な範囲を自然な現代日本語で表し、例外なく各人を指す構文の力を保つ。
- source_word: ἐρεῖ λόγον
  choice: …ことを言う
  rationale: λόγον の要素を反映しつつ、「一言を語る」のような不自然さを避けた。未来形はここでは一般的な場合を述べる働きがあるため、日本語の非過去形で表した。
- source_word: εἰς
  choice: …に逆らう
  rationale: 発言と冒瀆が対比される敵対的文脈に即して、方向ではなく反対・敵対の意味を表す。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスが用いる称号として定着した表現であり、セム語的背景とキリスト論的含意を保持する。
- source_word: ἀφεθήσεται αὐτῷ
  choice: その罪を赦される
  rationale: ギリシア語では赦される対象が明示されていない。日本語で意味を明瞭にするため「その罪」を補いつつ、注で原文の形を示した。
- source_word: τῷ ... βλασφημήσαντι
  choice: 冒瀆する者
  rationale: アオリスト分詞を、一般的警告の文脈に合う日本語の非過去形で表し、完了済みの一回的行為という限定を不必要に持ち込まない。
- source_word: τὸ ἅγιον πνεῦμα
  choice: 聖霊
  rationale: 神の霊を指す標準的で簡潔な現代日本語訳。
- source_word: οὐκ ἀφεθήσεται
  choice: 赦されない
  rationale: 未来受動の厳しい否定を、日本語で自然かつ断定的に表す。
theological_decisions:
- issue: 人の子に逆らう発言と聖霊への冒瀆との対比
  choice: 赦されるものと赦されないものとの本文上の区別をそのまま保ち、その理由や仕組みを訳文で説明しない。
  alternative: 前者を無知による罪、後者を最終的な悔い改めの拒絶などと解釈して訳文に織り込む。
  rationale: この節自体は両者を対比するが、赦されない罪の成立条件や神学的仕組みまでは定義していないため、解釈によって緊張を解消しない。
- issue: ἀφεθήσεται αὐτῷ の省略された対象
  choice: 本文では文脈上の対象を「その罪」と明示し、脚注で原文には名詞がないことを示す。
  alternative: 「その人は赦される」として、人そのものを受動文の主語にする。
  rationale: ギリシア語の αὐτῷ は与格であり、赦される対象は暗黙である。「その罪」は文脈に即した補足だが、補足であることを注記して原文との差を透明にする。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「冒瀆」は聖書的・宗教的文脈で一般に理解される語として採用した。「人の子」は称号として定着した表記を用いた。
