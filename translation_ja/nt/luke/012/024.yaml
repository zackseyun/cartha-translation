source:
  edition: SBLGNT
  text: κατανοήσατε τοὺς κόρακας ὅτι οὐ σπείρουσιν οὐδὲ θερίζουσιν, οἷς οὐκ ἔστιν ταμεῖον οὐδὲ ἀποθήκη, καὶ ὁ θεὸς τρέφει αὐτούς· πόσῳ μᾶλλον ὑμεῖς διαφέρετε τῶν πετεινῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/024.yaml
  text: 'Consider the ravens: they neither sow nor reap[a]; they have neither storeroom nor barn, and God feeds them[c][b]. How much more valuable are you than the birds!'
translation:
  language: ja
  text: カラスをよく考えなさい。[a] 種を蒔くことも刈り取ることもせず、貯蔵室も倉もありません。[b] 神がカラスを養っておられます。まして、あなたがたは鳥よりどれほど価値があることでしょう。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「カラスをよく見なさい」「カラスについて注意深く考えなさい」。
    reason: lexical_alternative
  - marker: b
    text: 「貯蔵室」はταμεῖον、「倉」はἀποθήκηの訳。ギリシア語では二つの異なる貯蔵場所を表す語が使われている。
    reason: lexical_alternative
  - marker: c
    text: 別訳「まして、あなたがたは鳥よりどれほど勝っていることでしょう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: よく考えなさい
  rationale: 単なる一瞥ではなく、注意深く観察して思い巡らすよう求めるアオリスト命令形の力を、自然な現代日本語で表した。
- source_word: κόρακας
  choice: 烏
  rationale: κόραξが指す具体的な鳥を表す。日本語ではワタリガラス類とカラス類を通常「烏」と呼ぶため、一般読者に自然な語を選んだ。
- source_word: σπείρουσιν οὐδὲ θερίζουσιν
  choice: 種を蒔くことも刈り取ることもせず
  rationale: 二つの農作業動詞の対句を保ちつつ、後続文へ自然につながる形にした。
- source_word: ταμεῖον
  choice: 貯蔵室
  rationale: 物を蓄える内部の部屋を指す語として訳し、ἀποθήκηとの語の違いを保った。
- source_word: ἀποθήκη
  choice: 倉
  rationale: 収穫物などを蓄える建物を自然かつ簡潔に表し、「貯蔵室」と区別した。
- source_word: τρέφει
  choice: 養っておられます
  rationale: 神が継続して食物を与え、生かしていることを、文脈に合う敬意ある日本語で表した。
- source_word: πόσῳ μᾶλλον
  choice: まして……どれほど
  rationale: 小さいものから大きいものへ進む比較論法を、自然な日本語の呼応表現で示した。
- source_word: διαφέρετε
  choice: 価値ある者でしょう
  rationale: ここでは単に「異なる」ではなく、鳥に比べて価値・重要性において勝るという文脈上の意味を表した。
- source_word: τῶν πετεινῶν
  choice: 鳥よりも
  rationale: 直前の烏から鳥一般へ広げる比較を簡潔に保った。
theological_decisions:
- issue: 神の摂理と人の価値を結ぶ比較
  choice: それでも、神は烏を養っておられます。まして、あなたがたは鳥よりも、どれほど価値ある者でしょう。
  alternative: 神は烏を養ってくださいます。あなたがたは鳥より、どれほど勝っていることでしょう。
  rationale: 神の能動的な養いを明示し、それを根拠とする小から大への議論を保った。「くださる」は受益性を強く補うため避け、διαφέρετεは文脈上の価値の比較として訳したが、比較の修辞的な余韻は残した。
translation_notes:
  register: 明快で現代的だが、イエスの教えにふさわしい落ち着いた品位を保った。「烏」は常用漢字表外だが聖書文体では理解しやすく、具体的な像も保てる。終止は修辞的感嘆を日本語の「でしょう」で表し、過度に強い感嘆符は用いなかった。
