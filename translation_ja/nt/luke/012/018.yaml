  text: καὶ εἶπεν· Τοῦτο ποιήσω· καθελῶ μου τὰς ἀποθήκας καὶ μείζονας οἰκοδομήσω, καὶ συνάξω ἐκεῖ πάντα ⸂τὸν σῖτον⸃ καὶ τὰ ἀγαθά μου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/018.yaml
  text: 'And he said[a], ‘This is what I will do: I will tear down my barns and build larger ones[c][b], and there I will gather all my grain and my goods.’'
translation:
  language: ja
  text: そこで彼は言った。「こうしよう。倉[a]を取り壊し、もっと大きな倉を建て、そこにすべての穀物[b]と自分の財産[c]を集めよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「貯蔵庫」。
    reason: lexical_alternative
  - marker: b
    text: 「穀物」は、文脈によっては特に「小麦」を指すこともある。
    reason: lexical_alternative
  - marker: c
    text: 別訳「持ち物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτο ποιήσω
  choice: こうしよう
  rationale: 話者が今後の方針を自ら決める、強調を伴った自然な日本語とした。
- source_word: καθελῶ
  choice: 取り壊して
  rationale: 既存の建物を壊して撤去する具体的な行為を明確に表す。
- source_word: τὰς ἀποθήκας
  choice: 今ある倉
  rationale: 穀物などを蓄える建物を指す文脈に合う。「今ある」は、後続のより大きな倉との対比を日本語で自然に示す補足。
- source_word: μείζονας οἰκοδομήσω
  choice: もっと大きなものを建て
  rationale: 省略された「倉」を「もの」で受け、比較級と建設の意味を簡潔に保った。
- source_word: συνάξω ἐκεῖ
  choice: そこに……しまっておこう
  rationale: 集めて貯蔵するという文脈上の意味を自然な日本語で示す。意志的な未来の計画も保つ。
- source_word: πάντα τὸν σῖτον
  choice: 穀物も……全部
  rationale: σῖτοςは小麦を指すこともあるが、ここでは種類を限定しない「穀物」が適切。πάνταの全量性を「全部」で表した。
- source_word: τὰ ἀγαθά μου
  choice: 財産
  rationale: 所有する有用な物や富を広く指す表現として、現代日本語で明瞭かつ簡潔。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に自然でありながら、たとえ話の独白として落ち着いた格調を保った。「倉」は農作物用の貯蔵施設を自然に表し、「しまっておこう」は単に集めるだけでなく、この文脈での保管を明確にする。
