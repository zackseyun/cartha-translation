  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: ja
  text: いのちは食べ物よりも大切であり[a]、体は衣服よりも大切だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いのち」に当たるギリシア語は、「魂」または「自分自身」を意味することもあります。ここでは文脈上、「いのち」の意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: だからです
  rationale: 直前の「心配するな」という命令の根拠を示す接続語。日本語では文末に置くことで、説明・理由の関係を自然に表した。
- source_word: ψυχή
  choice: いのち
  rationale: 食べることや必要な物への心配という文脈では、人の地上の生命・生活を指す。「魂」に限定せず、文脈上の意味を表す。
- source_word: πλεῖόν
  choice: 以上のもの
  rationale: 食べ物や衣服を超える価値を持つという比較を表す。「より大切」と説明しすぎず、原文の比較表現を保った。
- source_word: τροφή
  choice: 食べ物
  rationale: 日常的で明瞭な語であり、この文脈の具体的な必要を自然に表す。
- source_word: σῶμα
  choice: 体
  rationale: 衣服と対にされた身体を指すため、現代日本語で自然な「体」とした。
- source_word: ἔνδυμα
  choice: 衣服
  rationale: 身体を覆う物の総称として明瞭で、格調と現代性の釣り合いがよい。
theological_decisions:
- issue: 心配と備えについての教えにおける ψυχή の意味
  choice: 「いのち」と訳す
  alternative: 「魂」
  rationale: ψυχή と食べ物、σῶμα と衣服が並行して対比されているため、ここでは不滅の魂について直接述べるというより、人の生命を指す。ただし語が別の文脈で「魂」を意味し得ることは脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語。「いのち」は読みやすさと聖書文体としての品位を考慮して平仮名表記とし、二つの比較を明示して原文の並行構造を保った。
