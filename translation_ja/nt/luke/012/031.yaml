id: LUK.12.31
reference: Luke 12:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: ja
  text: しかし、あなたがたは神の国[a][b]を求めなさい。そうすれば、これらのものもあなたがたに加えて与えられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その方の国」。文脈上、「その方」は神を指します。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語本文は「その方の国」と読みます。一部の写本は「神の国」と読みます。
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: ただ
  rationale: 直前の、生活の必要を思い煩って追い求めることとの対照を、簡潔で自然な日本語で示す。
- source_word: ζητεῖτε
  choice: 求めなさい
  rationale: 現在命令形が示す継続的な志向は、文脈上、日本語の命令表現にも自然に含まれる。
- source_word: τὴν βασιλείαν
  choice: 国
  rationale: 神の支配とその領域の双方を含み得る語であり、ルカ福音書で定着した分かりやすい表現「神の国」を構成する。
- source_word: αὐτοῦ
  choice: 神の
  rationale: ギリシャ語は代名詞「その方の」だが、直前の文脈では指示対象が神であることが明白である。日本語で不自然な「その方の国」を避け、指示対象を明示した。原文の形と異読は脚注で示す。
- source_word: ταῦτα
  choice: これらのもの
  rationale: 周辺文脈で語られた食物や衣服などの必要を指す。「すべて」は本文にないため補わない。
- source_word: προστεθήσεται
  choice: 加えて与えられます
  rationale: 未来受動形と「加える」という比喩を保ちつつ、日本語として意味が通る形にした。行為者である神は明示されていないため、訳文でも受動形を保つ。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数二人称の与格を明示し、共同体全体への語りかけを保つ。
theological_decisions:
- issue: αὐτοῦの指示対象
  choice: 文脈上の指示対象を明示して「神の国」と訳す。
  alternative: 原文の代名詞の形を保ち、「その方の国」と訳す。
  rationale: 直前の文脈では「あなたがたの父」と神の養いが語られており、指示対象は神と理解できる。一方、ギリシャ語本文自体は「神」ではなく代名詞なので、その点を脚注で明示し、本文異読との区別も保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、命令は丁寧すぎない荘重な「求めなさい」とした。「加えて与えられます」により原文の加算の比喩と神を暗示する受動表現を保った。
