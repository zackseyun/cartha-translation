id: LUK.12.55
reference: Luke 12:55
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅταν νότον πνέοντα, λέγετε ὅτι Καύσων ἔσται, καὶ γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/055.yaml
  text: And when the south wind is blowing[a], you say[b], ‘There will be scorching heat,’ and it happens.
translation:
  language: ja
  text: また、南風が吹くと[a]、あなたがたは「猛暑になる[b]」と言う。すると、そのとおりになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「南が吹くと」。ここで「南」は南風を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「焼けつくような暑さになる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: νότον
  choice: 南風
  rationale: この語は「南」または「南風」を意味する。ここでは「吹く」の目的語となっているため、気象を表す自然な日本語として「南風」とした。
- source_word: πνέοντα
  choice: 吹くと
  rationale: 現在分詞が、南風が吹いているという観察可能な状況を表す。反復的な一般則を自然に示すため、条件表現「吹くと」とした。
- source_word: λέγετε
  choice: あなたがたは…と言う
  rationale: 一般的・習慣的な行為を述べる現在形を、簡潔な現在表現で保持した。
- source_word: Καύσων
  choice: 猛暑
  rationale: 単なる暑さではなく、焼けつくような激しい暑さを指す名詞である。現代日本語で明瞭かつ簡潔な「猛暑」を選んだ。
- source_word: ἔσται
  choice: になる
  rationale: 予想される気象状態の到来を、日本語として自然な「猛暑になる」で表した。
- source_word: γίνεται
  choice: そのとおりになる
  rationale: 予告した事柄が実際に起こることを示す。直訳的な「生じる」より自然で、予測の実現という文脈を明確にする。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、気象についての日常的な観察と予測の調子を保った。「猛暑」は強い暑さを簡潔に伝え、「そのとおりになる」は予測が実現する流れを自然に表す。
