  text: μακάριος ὁ δοῦλος ἐκεῖνος, ὃν ἐλθὼν ὁ κύριος αὐτοῦ εὑρήσει ποιοῦντα οὕτως·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: ja
  text: 主人が来たときに、そのようにしているのを主人が見いだすそのしもべは、幸いです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριος
  choice: 幸いです
  rationale: 単なる主観的な喜びではなく、神の祝福を含み得る宣言としての響きを保つ。現代日本語としても自然である。
- source_word: δοῦλος
  choice: しもべ
  rationale: 奴隷身分を指し得る語だが、ここでは主人のもとで務めを果たす者というたとえの役割が前面に出る。「しもべ」は従属関係を示しつつ、文脈にふさわしい品位を保つ。
- source_word: κύριος
  choice: 主人
  rationale: たとえの表層では家のしもべに対する主人を指すため。「主」というキリスト論的な響きもあり得るので脚注に残す。
- source_word: ἐλθὼν
  choice: 来たとき
  rationale: アオリスト分詞の時間的関係を、自然な日本語の時の節で表す。「帰って来た」とすると原文に明示されない『帰る』を補うため、単に「来た」とした。
- source_word: εὑρήσει
  choice: 見いだされる
  rationale: 原文では主人がそのしもべを見いだす構文だが、日本語では関係節を受け身にすると、しもべに焦点を置いた文が自然になる。未来性は「来たとき」と祝福の宣言の文脈で保持される。
- source_word: ποιοῦντα οὕτως
  choice: そのようにしている
  rationale: 直前に述べられた行動を指し戻す表現として、簡潔で自然に訳した。継続中の行為も「している」で表す。
- source_word: ἐκεῖνος
  choice: その
  rationale: 特定のしもべを指して強調する指示語の働きを保つ。
theological_decisions:
- issue: 主人の帰来を語るたとえにおける κύριος のキリスト論的含意
  choice: 本文では「主人」
  alternative: 「主」
  rationale: 家の主人としもべというたとえの直接的な場面には「主人」が最も明瞭である。一方、より広い文脈では主の来臨を響かせる可能性があるため、「主」を脚注に残して緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、格調を保ちながらも過度に文語的にしなかった。「見いだされる」によって原文の焦点と関係節のまとまりを自然に再現した。
