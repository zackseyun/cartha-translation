  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: ja
  text: というのも、今後、一つの家にいる五人が分かれ、三人が二人に、二人が三人に対立するようになるからである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家」は、建物そのもののほか、そこに属する家族・世帯を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: いることになる
  rationale: εἰμίの未来形。五人の存在を自然な現代日本語で導入しつつ、未来の事態を「ことになる」で表した。
- source_word: γὰρ
  choice: （明示しない）
  rationale: 前節を説明する接続辞だが、日本語では文脈上その関係が明らかであり、「なぜなら」を置くと不自然に重くなるため、説明の流れを語順と文脈に担わせた。
- source_word: ἀπὸ τοῦ νῦν
  choice: 今から
  rationale: 起点から先への継続を簡潔で自然な現代日本語で示す。
- source_word: πέντε
  choice: 五人
  rationale: ここでは家の中の五人を指すため、日本語の助数詞を補った。
- source_word: ἐν ἑνὶ οἴκῳ
  choice: 一つの家には
  rationale: οἶκοςの具体的な「家」を本文に保ちつつ、次節に示される家族・世帯の含意は脚注で提示した。
- source_word: διαμεμερισμένοι
  choice: 互いに分かれることになる
  rationale: 完了受動分詞が示す、分裂した状態に置かれることを自然に表現した。「互いに」は後続する三対二の対立関係を明確にする。
- source_word: τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν
  choice: 三人が二人に、二人が三人に対立する
  rationale: ἐπί＋与格の敵対・対抗の意味と、原文の対称的な構造を明瞭な日本語で保持した。
theological_decisions:
- issue: οἶκοςを建物としての「家」とするか、家族単位としての「家族／世帯」とするか
  choice: 家
  alternative: 家族、世帯
  rationale: 次節から家族単位を指すことは明らかだが、語そのものが持つ具体的意味を本文に残し、社会的単位としての含意を脚注に示して曖昧さを保存した。
- issue: διαμεμερισμένοιの完了受動が示す状態をどう表すか
  choice: 互いに分かれることになる
  alternative: 分裂していることになる
  rationale: 直訳的な状態表現より自然な日本語を選びつつ、イエスの働きによる分裂という前節との緊張を、原因を明示せずに保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体。「対立する」により三対二の敵対関係を明確にし、οἶκοςの意味の幅は本文と脚注に分けて保持した。
