id: LUK.12.48
reference: Luke 12:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γνοὺς ποιήσας δὲ ἄξια πληγῶν δαρήσεται ὀλίγας. παντὶ δὲ ᾧ ἐδόθη πολύ, πολὺ ζητηθήσεται παρ’ αὐτοῦ, καὶ ᾧ παρέθεντο πολύ, περισσότερον αἰτήσουσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/048.yaml
  text: But the one who did not know[a], yet did what deserved blows, will receive few. From everyone to whom much was given, much will be required, and from the one to whom they entrusted much[b], they will ask even more.
translation:
  language: ja
  text: しかし、知らずに、打たれて当然のことをした者は、少ししか打たれない。[a] 多く与えられた者は皆、多くを求められ、多くを託された者は、さらに多くを要求される。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「少ない打撃で打たれる」。ギリシア語の動詞は、打たれることを明示している。
    reason: lexical_alternative
  - marker: b
    text: 「さらに多くを求められる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... μὴ γνοὺς
  choice: 知らずに…した者
  rationale: 否定辞μήを伴うγινώσκωのアオリスト分詞を、責任の有無を訳文で決めつけず、自然な現代日本語で表した。
- source_word: ποιήσας ... ἄξια πληγῶν
  choice: 打たれて当然のことをした
  rationale: ἄξιαと属格πληγῶνが示す『打撃に値する行為』という因果関係と、具体的な懲罰の比喩を保った。
- source_word: δαρήσεται ὀλίγας
  choice: 少ししか打たれない
  rationale: δέρωの受動形が明示する『打たれる』を訳出し、補われる女性複数目的語『打撃』の少なさを、日本語として自然な程度表現で示した。
- source_word: παντὶ ... ᾧ ἐδόθη πολύ
  choice: 多く与えられた者は皆
  rationale: 与えられた量に応じた責任についての一般原則であることを、包括的な『皆』で表した。
- source_word: πολὺ ζητηθήσεται παρ’ αὐτοῦ
  choice: 多くを求められ
  rationale: ζητέωの受動形とπαρά＋属格が表す、本人から多くを求めるという責任の意味を簡潔な受動表現にした。
- source_word: ᾧ παρέθεντο πολύ
  choice: 多くを託された者
  rationale: παρατίθημιの委託・管理責任の意味を保ち、明示されていない三人称複数の主体を日本語でも特定しなかった。
- source_word: περισσότερον αἰτήσουσιν αὐτόν
  choice: さらに多くを要求される
  rationale: αἰτέωを文脈上の要求として訳し、περισσότερονの比較的な強調を『さらに多く』で表した。受動表現により不定の行為主体を補わなかった。
theological_decisions:
- issue: 懲罰の比喩の性質
  choice: 『打たれる』という具体的な懲罰の比喩を保持する
  alternative: 抽象的に『罰を受ける』とする、または特定の刑具を想定して『むち打たれる』とする
  rationale: 本文は知識と責任に応じた段階的懲罰を具体的な打撃で描くが、刑罰の制度や終末論的な仕組みまでは特定していないため。
- issue: 最後の節の行為主体
  choice: 受動表現を用い、誰が託し要求するのかを明示しない
  alternative: 神、または人々を明示的な主体として補う
  rationale: ギリシア語の三人称複数動詞には明示された主語がないため、一般的な責任原則としての曖昧さを保った。
- issue: ζητέωとαἰτέωの語感の区別
  choice: 前者を『求められる』、後者を『要求される』とする
  alternative: 両方を同じく『求められる』または『要求される』とする
  rationale: 二つの動詞の違いを日本語にも残しつつ、後半では託された責任に伴う強い要求という文脈を表した。
translation_notes:
  register: 明快な現代標準日本語を用い、たとえの厳粛さにふさわしい簡潔で格調ある文体とした。前半の具体的な『打つ』という像を弱めず、後半では自然な受動表現によって原文の不定の主体を保持した。
