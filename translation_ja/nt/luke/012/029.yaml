id: LUK.12.29
reference: Luke 12:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑμεῖς μὴ ζητεῖτε τί φάγητε ⸀καὶ τί πίητε, καὶ μὴ μετεωρίζεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/029.yaml
  text: And you[a], do not seek what you may eat and what you may drink, and do not be unsettled.
translation:
  language: ja
  text: あなたがたは、何を食べようか、何を飲もうかと追い求めてはなりません。また、思い悩んではなりません[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「心配してはなりません」「心を落ち着かなくしてはなりません」。この語には、文字どおりには「宙づりにされる」ような状態を表すイメージがあります。
    reason: μετεωρίζεσθε の稀な語義と比喩的背景を示し、訳語だけでは失われる幅を保つため。
lexical_decisions:
- source_word: καὶ ὑμεῖς
  choice: あなたがたは
  rationale: 明示された代名詞の強調を文頭に置いて表した。καίはここでは前文との接続を担うため、日本語では不自然な「そして」を加えず、話題提示によって対照を保った。
- source_word: ζητεῖτε
  choice: 追い求めてはなりません
  rationale: 単に必要な物を探すことではなく、食べ物や飲み物を求め続ける態度を指す文脈上の力を表しつつ、通常の生活上の備えまで禁じる訳を避けた。
- source_word: τί φάγητε καὶ τί πίητε
  choice: 何を食べようか、何を飲もうかと
  rationale: 接続法を伴う間接疑問の思案的・未確定なニュアンスを、自然な現代日本語の「〜ようか」で表した。καίによる並列も保持した。
- source_word: μετεωρίζεσθε
  choice: 思い悩んではなりません
  rationale: 心が宙づりになったように落ち着かず、不安に揺れるという稀な語の文脈的意味を自然に表した。原語の比喩的な幅は脚注に残した。
theological_decisions:
- issue: 食べ物と飲み物を求めることへの禁止の範囲
  choice: 必要物について思い煩いながら追い求めることへの禁止として訳す
  alternative: 食料を計画し備える行為一般への禁止、または身体的必要への無関心の命令として訳す
  rationale: 周囲の文脈は日々の必要に対する不安を扱っている。本文では原文どおり強い命令を保ちながら、禁欲主義や通常の備えの全面否定を訳文に持ち込まないようにした。
- issue: μετεωρίζεσθε の心理状態
  choice: 思い悩む
  alternative: 心を落ち着かなくする、心配する、宙づりの状態に置かれる
  rationale: 特定の心理学的概念に限定せず、不安と動揺を含む語義を日本語で簡潔に示した。より字義的な含みは脚注で提示した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、イエスの命令としての重みを保つため丁寧体の「〜てはなりません」とした。「何を食べようか、何を飲もうか」は日常的で理解しやすい一方、「追い求める」によって原文の ζητεῖτε の強さを残した。
