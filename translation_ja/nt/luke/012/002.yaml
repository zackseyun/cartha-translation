  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: ja
  text: しかし、覆い隠されていて、やがて明らかにされないものはなく、隠されていて、やがて知られないものはありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この言葉は、今の世で明るみに出ることにも、最後の裁きで明らかにされることにも当てはまり得ます。ギリシア語は、その時期を特定していません。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ものはなく
  rationale: 絶対的な否定の範囲を保ちつつ、日本語の「…もので、…ないものはない」という自然な構文で表した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の文脈を受ける軽い対照・展開を示すため、「しかし」とした。
- source_word: συγκεκαλυμμένον
  choice: 覆い隠されている
  rationale: 完了受動分詞が示す、覆われて隠された状態を保ち、後続の「明らかにされる」との対照も伝える。
- source_word: ἀποκαλυφθήσεται
  choice: 明らかにされない
  rationale: 未来受動の意味を保つ。関係節内の否定と合わせ、「明らかにされないものはない」として将来の開示を表した。
- source_word: κρυπτὸν
  choice: 隠されているもの
  rationale: 秘密そのものに限定せず、隠れた状態という広い意味を保持した。
- source_word: γνωσθήσεται
  choice: 知られない
  rationale: 未来受動を簡潔に表し、何が隠されていてもやがて知られるという並行構造を保った。
- source_word: ὃ οὐκ / ὃ οὐ
  choice: …されないもの
  rationale: 二つの関係節を日本語の連体修飾構文に移し、原文の並行性と二重否定による全面的な断定を保持した。
theological_decisions:
- issue: この言葉が示す開示の時期と範囲
  choice: 今は隠されているものが、やがて明らかにされ、知られるという一般的原則として訳す。
  alternative: 終わりの裁きでの開示だけを指す、または現世で偽善が暴かれることだけを指す。
  rationale: ギリシア語の未来受動形は将来の開示を示すが、その時期を特定しないため、現世での露見と終末の裁きの双方を排除しない表現にした。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「覆い隠されている」と「明らかにされる」、「隠されている」と「知られる」の二組の対照を保持した。丁寧体で本文を統一した。
