base_translation:
  language: en
  yaml_path: translation/nt/luke/012/012.yaml
  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: ja
  text: 聖霊が、まさにその時に[a]、あなたがたに何を言うべきかを教えるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その時に」とも訳せる。ギリシア語は、必要となるまさにその時を強調する。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: からです
  rationale: 直前の約束を根拠づける説明の働きを、日本語として自然な文末表現で示す。
- source_word: τὸ ἅγιον πνεῦμα
  choice: 聖霊
  rationale: 神の霊を指す定冠詞付きの句に対する、現代日本語で標準的かつ明瞭な訳語。
- source_word: διδάξει
  choice: 教える
  rationale: διδάσκω の未来形が表す、必要な内容をその時に知らせるという約束を直接的に訳す。日本語では文脈により未来の意味が自然に伝わる。
- source_word: ὑμᾶς
  choice: あなたがたに
  rationale: 二人称複数であることを明示する。
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: まさにその時に
  rationale: αὐτῇ による強調を「まさに」で表し、助けが必要となるその時点であることを保つ。
- source_word: ἃ
  choice: 何を
  rationale: 中性複数関係代名詞が導く発言内容を、自然な日本語の疑問詞節で表す。
- source_word: δεῖ
  choice: 言うべきか
  rationale: 必要・義務を表す非人称動詞の意味を「べき」で保持しつつ、間接疑問の形に整える。
- source_word: εἰπεῖν
  choice: 言う
  rationale: この場面で口にすべき内容を表すため、簡潔で自然な「言う」とする。
theological_decisions:
- issue: 「聖霊」の主体性
  choice: 聖霊を、弟子たちに何を言うべきか教える能動的主体として訳す
  alternative: 非人格的な神的影響または霊感として表現する
  rationale: 原文では「聖霊」が未来能動態動詞「教える」の主語であるため、その文法上の主体性を保つ。ただし、この一節を越えた教理的説明は加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語とし、説明を表す γὰρ は自然な文末の「からです」で表現した。聖霊への敬語的補助動詞は原文に明示されないため加えず、簡潔で格調ある調子を保った。
