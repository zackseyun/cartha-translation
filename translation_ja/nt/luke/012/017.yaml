  text: καὶ διελογίζετο ἐν ⸀ἑαυτῷ λέγων· Τί ποιήσω, ὅτι οὐκ ἔχω ποῦ συνάξω τοὺς καρπούς μου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/017.yaml
  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: ja
  text: そして彼は心の中で考え続けた。「どうしよう。収穫物をしまっておく場所がない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: 考え続けた
  rationale: 未完了過去が示す内面的な思案の継続を、自然な現代日本語で表した。
- source_word: ἐν ἑαυτῷ
  choice: 心の中で
  rationale: 声に出した発言ではなく、内面での思案であることを明確に伝える。
- source_word: λέγων
  choice: 「…」
  rationale: 日本語では直接話法を続けることで自然に内容を導入できるため、独立した「言った」は置かなかった。
- source_word: Τί ποιήσω
  choice: どうしよう
  rationale: 審議的接続法による自問を、簡潔で自然な現代日本語として表した。
- source_word: ὅτι
  choice: （別文による理由提示）
  rationale: 因果関係は明白であり、日本語では「作物を…場所がない」と別文にすることで自然に理由が伝わる。
- source_word: οὐκ ἔχω ποῦ
  choice: 場所がない
  rationale: 直訳的な「どこに…すればよいかを持たない」を避け、日本語の自然な所有・存在表現とした。
- source_word: συνάξω
  choice: しまっておく
  rationale: 収穫物を集め入れて保管する文脈上の意味を明瞭にした。単なる収穫行為との誤解も避けられる。
- source_word: τοὺς καρπούς μου
  choice: 作物
  rationale: ここでは農産物・収穫物を指すため、「実」より文脈に適した一般的な語を選んだ。
theological_decisions: []
