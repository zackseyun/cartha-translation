- from: そこで彼は心の中で考え続けた。「どうしよう。作物をしまっておく場所がない。」
  to: そして彼は心の中で考え続けた。「どうしよう。収穫物をしまっておく場所がない。」
  rationale: 原文の内面的で継続する思案と、自問の簡潔さを保ったまま、「作物」を文脈上より正確な「収穫物」に改めた。また、καὶ を過度に因果的に読まないよう「そこで」を「そして」に改めた。理由を示す ὅτι は、後続文で事情を述べる日本語の自然な二文構成により保持されている。
