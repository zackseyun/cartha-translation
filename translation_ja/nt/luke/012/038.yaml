  naturalness: 「見いだす」は文語的で、明瞭な現代標準日本語としては「見つける」が自然である。「そのようにしている」は前節の用意して待つ状態を指すため、原文の指示性を保っている。
  terminology: 「幸いである」はμακάριοιにふさわしく、「見張り時」はφυλακή（夜の見張りの時間区分）を簡潔に示す。「しもべたち」は直前の文脈のδοῦλοιを受ける補足として妥当である。
