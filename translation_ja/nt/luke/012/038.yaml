  to: 主人が夜の第二の見張り時に来ようと、第三の見張り時に来ようと、彼らがそのようにしているのを見つけるなら、そのしもべたちは幸いである。[a]
  rationale: 主文を「来ようと…来ようと」に改め、κἂνの反復が示す『第二の見張り時であれ第三の見張り時であれ』という条件を日本語で明確にした。「見つける」は現代語として自然でありながらεὕρῃの意味を保つ。脚注は原文の指示代名詞の直訳と、簡潔に訳した「見張り時」の説明を一つの有用な注に整理した。
