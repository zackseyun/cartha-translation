  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: ja
  text: 主人が夜の第二の見張り時に来ようと、第三の見張り時に来ようと、彼らがそのようにしているのを見つけるなら、そのしもべたちは幸いである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「その者たちは幸いである」。指しているのは直前の文脈に登場するしもべたちである。第二・第三の「見張り時」は、夜を見張りの時間帯に分ける数え方を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: …に来ても、…に来ても
  rationale: 譲歩・不定条件を表すκἄνの反復を、日本語で自然な反復表現として保った。
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: 夜の第二の見張り時…第三の見張り時
  rationale: φυλακήはここでは夜間を区切る見張りの時間帯を指す。「夜の」は最初の句に明示し、第二・第三という原文の順序を保った。
- source_word: ἔλθῃ
  choice: 主人が…来ても
  rationale: アオリスト接続法の不定の将来条件を自然な日本語の条件表現で示した。主語は直前の文脈にある主人である。
- source_word: εὕρῃ οὕτως
  choice: 彼らがそのようにしているのを見いだす
  rationale: οὕτωςは前節に描かれた、しもべたちが用意して待っている状態を指す。目的語を文脈から補って日本語として明確にした。
- source_word: μακάριοί
  choice: 幸いである
  rationale: 神の前で恵まれた望ましい状態を表す聖書的な重みを保ち、単なる感情としての「幸福」と区別した。
- source_word: ἐκεῖνοι
  choice: そのしもべたち
  rationale: 語義は「その者たち」だが、直前の文脈で指示対象は主人のしもべたちと明白であるため、理解しやすいよう最小限に補った。
theological_decisions:
- issue: ἐκεῖνοιの指示対象を明示するか
  choice: そのしもべたち
  alternative: その者たち
  rationale: 原文は指示代名詞だけを用いるが、直前の文脈では主人を待つしもべたちを指す。明示しても新たな神学的内容は加わらない。ただし、この節自体にはδοῦλοςがないことを脚注で示した。
translation_notes:
  register: 明瞭で現代的ながら、教会での朗読にも適する格調を保った。「見張り時」は日常語ではないため「夜の」を添え、脚注で意味を補った。
