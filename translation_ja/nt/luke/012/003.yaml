    issue: 本文の「屋上から」と脚注の「直訳『屋上で』」の方向・機能の不整合
    rationale: ἐπὶ τῶν δωμάτωνはこの文脈では宣言がなされる場所を示す。『屋上から』も日本語としては可能だが、脚注が本文の代案ではなく本文の表現を訂正するように見える。本文を『屋上で』とし、脚注では古代家屋の平らな屋根という背景を説明する。
  - severity: low
    issue: 「言い広められます」の公的布告のニュアンス
    rationale: κηρυχθήσεταιは公に触れ告げる意味を持つ。『言い広められます』でも大意は保つが、『公に告げ知らせられます』のほうが原語の公的宣言の性格をより明瞭に反映する。
  revised_text: ですから、あなたがたが暗闇の中で言ったことはすべて、光の中で聞かれ、奥まった部屋で耳元に語ったことは、屋上で[a]公に告げ知らせられます。
