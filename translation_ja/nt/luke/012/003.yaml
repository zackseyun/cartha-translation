id: LUK.12.3
reference: Luke 12:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: ja
  text: ですから、あなたがたが暗闇の中で言ったことはすべて、光の中で聞かれ、奥まった部屋で耳元に語ったことは、屋上で[a]公に告げ知らせられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「家々の屋根の上で」。当時の家には平らな屋根があり、そこから公に知らせることができた。
    reason: ἐπὶ τῶν δωμάτωνが示す場所表現と、古代家屋の屋根を用いる公的告知の情景を補足するため。
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: ですから
  rationale: 前節の「隠されているもので、明らかにされないものはない」という宣言を受け、その帰結を導く表現として、現代日本語で明瞭な接続語を用いた。
- source_word: ὅσα
  choice: 言ったことはすべて
  rationale: 不定関係的な包括性を自然な日本語で表し、ひそかに語られた事柄を余さず指す意味を保った。
- source_word: ἐν τῇ σκοτίᾳ / ἐν τῷ φωτί
  choice: 暗闇の中で／光の中で
  rationale: 秘密と公然性を示す比喩であると同時に、原文の鮮明な対照を保つ表現とした。
- source_word: ἀκουσθήσεται
  choice: 聞かれ
  rationale: 未来受動の形を保ちつつ、前半を後半の未来表現「言い広められます」と自然に結んだ。
- source_word: πρὸς τὸ οὖς ἐλαλήσατε
  choice: 耳打ちした
  rationale: 直訳的な「耳に語った」が示す、相手の耳元でひそかに話す動作を、明瞭で自然な現代日本語にした。
- source_word: ἐν τοῖς ταμείοις
  choice: 奥の部屋で
  rationale: ταμεῖονには物置、内室、私室などの幅がある。ここでは秘密性が中心なので、用途を物置に限定せず、家の内側にある人目につかない部屋を表した。
- source_word: κηρυχθήσεται
  choice: 言い広められます
  rationale: 宗教的な「宣教」に狭めず、公に告げ知らせる意味を自然な日本語で表した。
- source_word: ἐπὶ τῶν δωμάτων
  choice: 屋上から
  rationale: 古代の平らな屋根の上から公衆に知らせる情景を明瞭に伝える。原文の前置詞句を場所として直訳する余地は脚注に示した。
theological_decisions:
- issue: 隠された発言が明るみに出される時期と仕方
  choice: 秘密にされたことが公になるという警告として訳し、その時期や働き手は特定しない
  alternative: 最後の審判での暴露、または歴史の中での偽善の露見に限定する
  rationale: 直前の文脈は隠れたものの露見を語るが、この節自体は、それが神の審判、歴史上の出来事、終末的な啓示のいずれであるかを限定していない。受動表現を保ち、神学的な幅を残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、暗闇と光、奥の部屋と屋上という対照的な情景を保持した。文末は丁寧体で統一し、口語的すぎる表現や教派的な用語を避けた。
