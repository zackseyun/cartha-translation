revisions:
- from: ですから、あなたがたが暗闇の中で言ったことはすべて、光の中で聞かれ、奥の部屋で耳打ちしたことは、屋上から[a]言い広められます。
  to: ですから、あなたがたが暗闇の中で言ったことはすべて、光の中で聞かれ、奥まった部屋で耳元に語ったことは、屋上で[a]公に告げ知らせられます。
  rationale: 原文の場所表現ἐπὶ τῶν δωμάτωνに合わせて「屋上で」とし、脚注との不整合を解消しました。また、κηρυχθήσεταιの公的な布告の響きを「公に告げ知らせられます」で表しました。暗闇／光、秘密の部屋／屋上という対照、ならびに開示の時期・主体を特定しない未来受動の曖昧さは維持しています。
