id: LUK.12.45
reference: Luke 12:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: ja
  text: しかし、もしその奴隷が心の中で、「私の主人は来るのが遅れている」と言い、男の召使いたちや女の召使いたちを打ち始め、食べたり飲んだりして酔い始めるなら、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隷
  rationale: このたとえでは、家の主人の権威の下に置かれた身分と、その主人に対する責任が前面に出ているため、「しもべ」よりも社会的拘束関係を明確に示す「奴隷」とした。
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: 心の中で
  rationale: 内心の思いであることを自然な現代日本語で表しつつ、原文の「心」という比喩を保持した。
- source_word: Χρονίζει … ἔρχεσθαι
  choice: なかなか帰って来ない
  rationale: 到着が遅れているという継続的な状況と、奴隷の不満を自然な日本語で表した。文脈上、主人は不在先から家へ来るので「帰って来る」が適切である。
- source_word: κύριός μου
  choice: 主人
  rationale: 物語内の家の上位者を指しており、神的称号としての「主」と混同させず、権威関係を明確に伝える。日本語では所有関係は文脈から明らかなため「私の」は省いた。
- source_word: τύπτειν
  choice: 打ちたたき
  rationale: 単発の軽い打撃ではなく、配下の者への継続的・虐待的な暴力を表す語を選んだ。
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: 男の召使いたちや女の召使いたち
  rationale: 原文が明示する男性と女性の区別を保ちつつ、両語がこの家に仕える者を指すことを自然な現代日本語で示した。
- source_word: μεθύσκεσθαι
  choice: 酔い始める
  rationale: ἄρξηταιが後続する一連の不品行の開始を導く構文を日本語でも保ち、酒に酔う意味を簡潔に表した。
theological_decisions:
- issue: たとえの中で人間の家長を指す κύριος の訳語
  choice: 主人
  alternative: 主
  rationale: ここでは直接に神またはメシアへの称号として用いられているのではなく、物語世界の家長を指す。「主人」は、その物語上の意味を明瞭にしつつ、たとえが持つ神学的含意を否定しない。
- issue: この文脈における δοῦλος の社会的身分
  choice: 奴隷
  alternative: しもべ／召使い
  rationale: 主人への従属と厳しい責任関係が重要な文脈なので、拘束された身分を曖昧にしない「奴隷」を採用した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。条件節が次節へ続く原文の構造を保つため、文末を「なら、」とした。引用部は直訳調を避けながら、主人の到着の遅れをめぐる内心の判断を保持した。
