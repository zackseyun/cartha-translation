  verdict: revise
  source_fidelity: 「帰って来ない」は、単に『来る／到着するのが遅い』という原文の意味に、『帰る』という方向性を加えています。また、「酔い始める」だけでは、ἄρξηται（始める）が打つこと・飲食することを含む後続の行為全体にかかる構文が十分に表れません。
  naturalness: 現行訳はおおむね自然ですが、「打ち始め、食べたり飲んだりして酔い始める」とすることで、現代標準日本語として不自然にならず、行為の開始という文脈もより明瞭になります。
  terminology: 「奴隷」「主人」は、このたとえの家内関係における δοῦλος と κύριος を適切に伝えています。「男の召使いたち／女の召使いたち」も、παῖδες と παιδίσκαιの性別の対を保持しています。
  issues:
  - severity: medium
    issue: 「帰って来ない」
    rationale: ἔρχεσθαι は『来る』であり、『帰って来る』とは限りません。原文にない帰還方向を加えない訳が必要です。
  - severity: medium
    issue: ἄρξηται の係り方が不十分
    rationale: 「酔い始める」だけでは、原文で『始める』が打つこと、飲食、酩酊という連続する不正行為に導入的にかかることが見えにくくなります。
