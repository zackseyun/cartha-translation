id: LUK.12.47
reference: Luke 12:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ὁ δοῦλος ὁ γνοὺς τὸ θέλημα τοῦ κυρίου ⸀αὐτοῦ καὶ μὴ ἑτοιμάσας ⸀ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ δαρήσεται πολλάς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/047.yaml
  text: But that servant[a], who knew his master's will and did not prepare or act according to his will, will be beaten with many blows.
translation:
  language: ja
  text: しかし、主人の意向を知りながら、備えもせず、その意向に従って行動もしなかったその奴隷は、何度も打たれる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「多くの打撃を受ける」。ギリシア語では「打撃」に当たる名詞が省略されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隷
  rationale: 雇われた使用人ではなく、主人の権威の下にある隷属身分を表す語であり、処罰を伴うこのたとえの文脈でもその関係が重要であるため。
- source_word: γνοὺς
  choice: 知りながら
  rationale: 主人の意向をすでに知っていたことと、それにもかかわらず従わなかったという対照を、自然な日本語で表すため。
- source_word: τὸ θέλημα τοῦ κυρίου αὐτοῦ
  choice: 主人の意向
  rationale: κύριοςはここではたとえの中の奴隷の主人を指す。θέλημαは単なる願望よりも、主人が何を求めているかという意味を持つため「意向」とした。
- source_word: μὴ ἑτοιμάσας
  choice: 備えもせず
  rationale: 目的語を明示しない原文に従い、何を備えるかを補わずに訳した。
- source_word: ἢ ποιήσας πρὸς τὸ θέλημα αὐτοῦ
  choice: その意向に従って行動もしなかった
  rationale: ποιέωとπρόςの結びつきを、主人の意向に沿う行動をしなかったという自然で明瞭な日本語にした。
- source_word: δαρήσεται πολλάς
  choice: 何度も打たれる
  rationale: δαρήσεταιの受動態と、名詞を省略したπολλάςによる反復的な打撃を簡潔に表した。具体的な「打撃」を補う直訳は脚注に示した。
theological_decisions:
- issue: たとえの家庭内関係におけるκύριοςの訳語
  choice: 主人
  alternative: 主
  rationale: 文中では奴隷に対する所有者・主人を指しているため、たとえそのものの社会的関係を明確にした。より広い文脈での神学的指示対象を否定する訳ではない。
- issue: 省略を含むπολλάςの表現
  choice: 何度も打たれる
  alternative: 多くの打撃を受ける
  rationale: 原文では女性複数形の形容詞だけが置かれ、「打撃」に当たる名詞は省略されている。「何度も」はこの省略と反復の意味を自然に伝え、具体的な直訳可能性は脚注で保持する。
translation_notes:
  register: 現代標準日本語による、明瞭で厳粛な叙述。「奴隷」は原語の身分関係を保つために用い、「しもべ」のような文語的・婉曲的表現は避けた。
