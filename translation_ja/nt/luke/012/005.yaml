id: LUK.12.5
reference: Luke 12:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ⸂ἔχοντα ἐξουσίαν⸃ ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/005.yaml
  text: 'But I will show you whom to fear: fear the one who[a], after killing, has authority to throw into Gehenna. Yes, I tell you, fear this one.'
translation:
  language: ja
  text: しかし、だれを恐れるべきか、あなたがたに示そう。殺した後、ゲヘナ[a]に投げ込む権威を持つ者を恐れなさい。そうだ、あなたがたに言う。この者を恐れなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「地獄」。ギリシア語は「ゲヘナ」で、ヒンノムの谷に由来し、そのイメージを背景とする裁きの語。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποδείξω
  choice: 示そう
  rationale: 未来形による導入を、文脈上の意志を自然に表す「示そう」と訳した。「教えよう」よりも、指し示すという原語の意味を保つ。
- source_word: τίνα φοβηθῆτε
  choice: だれを恐れるべきか
  rationale: 間接疑問の内容と勧告的な力を、明瞭な現代日本語で表した。
- source_word: φοβήθητε
  choice: 恐れなさい
  rationale: 命令形の厳粛な警告を保ち、同じ動詞の反復も訳文で再現した。
- source_word: τὸν / τοῦτον
  choice: 者／この者
  rationale: 指示対象を本文で明示せず、実体詞的冠詞と強意的な指示代名詞を再現する。「方」は敬意を先取りし得るため、より中立的な「者」とした。
- source_word: μετὰ τὸ ἀποκτεῖναι
  choice: 殺した後
  rationale: 時間的順序を簡潔に表し、殺す主体が後続する「権威を持つ者」と同一であるというギリシア語の構造を保った。
- source_word: ἔχοντα ἐξουσίαν
  choice: 権威を持つ
  rationale: ἐξουσίαを単なる能力や力ではなく、行使する権限を含む語として訳した。
- source_word: ἐμβαλεῖν εἰς
  choice: に投げ込む
  rationale: 動作の強さと方向性を自然な現代日本語で表した。
- source_word: γέενναν
  choice: ゲヘナ
  rationale: 後代の神学的含意を一語で固定せず、ヒンノムの谷に由来する裁きの語として音写した。一般的な機能的訳語は脚注に示す。
- source_word: ναί
  choice: そうだ
  rationale: 話者による強い肯定と念押しを、自然で力のある日本語にした。
theological_decisions:
- issue: 裁きの文脈におけるγέενναの訳し方
  choice: ゲヘナ
  alternative: 地獄
  rationale: 原語が持つユダヤ的・地理的背景を残し、後代の「地獄」概念だけに意味を限定しないため、本文では音写した。理解を助ける一般的な訳語は脚注に置いた。
- issue: 恐れる対象の明示
  choice: 本文では「者」とし、神または他の主体と明記しない
  alternative: 神／その方
  rationale: この節自体のギリシア語は対象を固有名で明示していないため、文脈からの同定を訳文に書き込まず、原文の表現を保った。
translation_notes:
  register: 明瞭で厳粛な現代標準日本語。命令の反復と最後の指示語による強調を保った。「者」は指示対象への敬称や神学的同定を訳文で先取りしないための中立的表現。
