id: LUK.12.41
reference: Luke 12:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: ja
  text: そこでペテロが言った。「主よ、このたとえを私たちに話しておられるのですか。それとも、すべての人[a]にも話しておられるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すべての人」と訳したギリシア語は文法上は男性複数形だが、ここでは広く聞き手全体を指す。別訳「全員」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν
  choice: 言った
  rationale: λέγωのアオリストを通常の発話動詞として訳した。発言内容が疑問文であることは引用文そのものによって明らかなため、「尋ねた」と意味を限定しない。
- source_word: δὲ
  choice: そこで
  rationale: 談話を継続しつつ、直前の教えを受けたペテロの発言へ自然に移る接続を表す。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの直接の呼びかけとして、敬意とκύριοςが持ちうるキリスト論的含意の双方を過不足なく保つ。
- source_word: πρὸς ἡμᾶς
  choice: 私たちに向けて
  rationale: λέγειςに伴うπρός＋対格が示す発話の方向を、自然で明確な日本語にした。
- source_word: τὴν παραβολὴν ταύτην
  choice: このたとえ
  rationale: 共観福音書におけるπαραβολήの定着した意味を、一般読者にも分かる現代日本語で表した。
- source_word: λέγεις
  choice: 話しておられる
  rationale: 現在形の継続的・目前的な発話を示し、ペテロからイエスへの敬意も自然な敬語で表した。
- source_word: ἢ καὶ
  choice: それとも…にも
  rationale: ἤの選択とκαίの付加的な力をともに保ち、第二の可能性が「すべての人にも」であることを示した。
- source_word: πρὸς πάντας
  choice: すべての人に向けて
  rationale: πάνταςは男性複数形だが、この文脈では男性だけでなく、より広い聞き手全体を指すため、「すべての人」とした。
theological_decisions:
- issue: ペテロがイエスをκύριοςと呼ぶ箇所の訳語
  choice: 主
  alternative: 先生
  rationale: 「主」は語の基本的な敬称としての意味と、文脈上ありうるキリスト論的響きを保つ。「先生」では後者を弱めるおそれがある一方、この訳はこの一節だけで称号の意味を過度に確定しない。
- issue: πάνταςの包括的な指示範囲
  choice: すべての人
  alternative: 全員
  rationale: 文法上の男性複数形を男性限定とはせず、「私たち」と対比される広い聞き手全体を指す表現として訳した。誰が具体的に含まれるかは本文以上に限定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、ペテロの呼びかけには簡潔で品位のある表現を採用した。「話しておられる」により、過度に古風にならずにイエスへの敬意を示した。
