id: LUK.12.6
reference: Luke 12:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχὶ πέντε στρουθία ⸀πωλοῦνται ἀσσαρίων δύο; καὶ ἓν ἐξ αὐτῶν οὐκ ἔστιν ἐπιλελησμένον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/006.yaml
  text: Are not five sparrows sold for two assaria? Yet not one of them is forgotten before God[a][b].
translation:
  language: ja
  text: 五羽の雀が二アサリオン[a]で売られているのではありませんか。それでも、そのうちの一羽さえ、神の御前で忘れられてはいません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「銅貨二枚で」。アサリオンは、古代ローマの小額の銅貨です。
    reason: cultural_note
  - marker: b
    text: または「神の前で見過ごされてはいません」。
    reason: lexical_alternative
lexical_decisions:
- source_word: στρουθία
  choice: 雀
  rationale: この文脈では小鳥一般よりも雀を指すと理解するのが自然であり、日本語でも具体的で分かりやすい。
- source_word: πωλοῦνται
  choice: 売られている
  rationale: 現在形の受動態を自然な日本語で表し、安価な商品として扱われる状況も保った。
- source_word: ἀσσαρίων δύο
  choice: 二アサリオン
  rationale: 現代の貨幣価値へ不正確に置き換えず、古代ローマの具体的な貨幣名を保持した。説明は脚注に置いた。
- source_word: ἐπιλελησμένον
  choice: 忘れられてはいません
  rationale: 完了分詞が表す『忘れられた状態にある』という意味を明確かつ自然に伝える。『見過ごされる』より原語の語義に近い。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の御前で
  rationale: 神の前、神の視野の中にあるという表現を簡潔に保ち、神学的意味を過度に説明しない。
- source_word: οὐχὶ ... ;
  choice: ではありませんか
  rationale: 肯定の答えを予期する修辞疑問の力を、自然な現代日本語で表した。
- source_word: καὶ ἓν ἐξ αὐτῶν
  choice: それでも、そのうちの一羽さえ
  rationale: 安価に売られる五羽と、ただ一羽も忘れられていないこととの対照、および一羽への強調を自然に示した。
theological_decisions:
- issue: 神が覚えておられることと摂理の表現
  choice: そのうちの一羽さえ、神の御前で忘れられてはいません
  alternative: そのうちの一羽さえ、神に見過ごされてはいません
  rationale: 神が取るに足りないように見える生き物にも注意を向けていることを示しつつ、本文が明言する以上の摂理論を訳文へ持ち込まない。
translation_notes:
  register: イエスが聞き手へ語りかける修辞疑問を、明瞭で丁寧な現代標準語にした。「御前」は日常語より格調があるが、宗教的文脈で理解しやすく、ἐνώπιον の空間的・関係的含意も簡潔に保つ。
