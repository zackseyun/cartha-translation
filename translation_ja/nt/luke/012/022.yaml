  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς αὐτοῦ· Διὰ τοῦτο ⸂λέγω ὑμῖν⸃, μὴ μεριμνᾶτε τῇ ⸀ψυχῇ τί φάγητε, μηδὲ τῷ ⸀σώματι τί ἐνδύσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/022.yaml
  text: Then he said to his disciples[a], “For this reason I tell you, do not worry about your life, what you will eat, nor about your body[b], what you will wear.”
translation:
  language: ja
  text: そこで、イエスはご自分の弟子たちに言われた。「だから、あなたがたに言います。何を食べようかと、いのち[a]について思い悩んではならず[b]、何を着ようかと、からだについても思い悩んではなりません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いのち」と訳したギリシア語は「魂」を意味することもある。しかしこの箇所では、食べ物によって支えられる地上の生命・生活を指す。
    reason: lexical_alternative
  - marker: b
    text: 「思い悩む」は「心配する」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: それから、イエスは……言われた
  rationale: δέは弱い接続を表す。直前の文脈からの自然な展開を「それから」で示した。日本語では主語を補わないと不明瞭になりやすいため、文脈上明白な「イエス」を補った。
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: 弟子たちに
  rationale: μαθηταίを通常どおり「弟子たち」とした。αὐτοῦは文脈上「イエスは弟子たちに」で所属関係が明らかなため、不自然な「自分の弟子たち」は避けた。
- source_word: Διὰ τοῦτο
  choice: だから
  rationale: 直前の教えを受けた因果的・推論的なつながりを、明快な現代日本語で示す。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の語りかけを保ち、尊厳を損なわない自然な現代語とした。
- source_word: μὴ μεριμνᾶτε
  choice: 思い悩んではなりません
  rationale: μεριμνάωがここで表す心配や不安に満ちた気遣いを示す。「心配してはならない」も可能だが、「思い悩む」は継続的な不安の含みをよく伝える。
- source_word: τῇ ψυχῇ
  choice: 自分のいのちのことで
  rationale: ψυχήはここでは食物によって支えられる地上の生命・生活を指し、非物質的な「魂」に限定されない。「いのち」は身体との対句を保ちながら、その意味を伝える。
- source_word: τί φάγητε
  choice: 何を食べようか
  rationale: 間接疑問的な接続法を、将来の必要を案じる自然な日本語で表した。
- source_word: μηδὲ τῷ σώματι
  choice: 自分の体のことで……もなりません
  rationale: μηδέによる第二の禁止を日本語の並列形で明示し、いのち／食物と体／衣服の対応を保った。
- source_word: τί ἐνδύσησθε
  choice: 何を着ようか
  rationale: 衣服を身に着ける意味を、日常的で簡潔な日本語にした。
theological_decisions:
- issue: ψυχήの文脈上の意味
  choice: いのち
  alternative: 魂
  rationale: 食べ物がψυχήに、衣服がσῶμαに対応する文脈なので、ここでは日常の地上の生命・生活を指す。「魂」とすると、本文が要求しない心身二元論的な意味に狭めるおそれがある。
- issue: 命令の射程
  choice: 食物や衣服をめぐって思い悩むことの禁止
  alternative: 生活上の備えや配慮そのものの全面的禁止
  rationale: μεριμνάωの語義と後続文脈に従い、不安に支配された思い煩いを禁じる表現とした。本文以上に、通常の配慮や備えまで禁じる意味は加えない。
translation_notes:
  register: 明快な現代標準日本語を用い、イエスの発話には丁寧体を採用した。禁止表現は格調を保つ「思い悩んではなりません」とし、反復によって原文の並行構造を見える形で残した。
