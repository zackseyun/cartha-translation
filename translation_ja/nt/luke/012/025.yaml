  text: τίς δὲ ἐξ ὑμῶν μεριμνῶν δύναται ⸂ἐπὶ τὴν ἡλικίαν αὐτοῦ προσθεῖναι⸃ ⸀πῆχυν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/025.yaml
  text: And which of you, by worrying, is able to add a cubit to his lifespan?
translation:
  language: ja
  text: あなたがたのうち、心配したからといって、自分の寿命を一キュビトでも延ばすことができる人がいるでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キュビト」は肘から指先までを基準にした長さで、約四十五センチ。ここで「寿命」と訳した語は「背丈」とも訳せる。
    reason: 古代の単位を説明し、ἡλικίαの真正な語義上の曖昧さを読者に示すため。
lexical_decisions:
- source_word: μεριμνῶν
  choice: 心配したからといって
  rationale: 分詞の手段・状況を自然な日本語で表し、思い煩うことによって何かを変えられるのか、という反語の趣旨を保った。
- source_word: ἡλικίαν
  choice: 寿命
  rationale: この語は「年齢・寿命」と「背丈」の双方を意味し得るが、文脈では命の長さへの心配が中心であり、「寿命」が自然である。語義上の別解は脚注に残した。
- source_word: πῆχυν
  choice: 一キュビト
  rationale: 長さの単位を用いる原文の比喩を保持した。現代の読者にはなじみが薄いため、脚注で概算を示す。
- source_word: προσθεῖναι
  choice: 延ばす
  rationale: 寿命との結び付きでは、字義的な「加える」より「延ばす」が自然で、増加させる意味を正確に伝える。
- source_word: δύναται
  choice: できる
  rationale: 能力・可能性を問う反語を、明瞭で現代的な日本語にした。
theological_decisions:
- issue: ἡλικίαが指すもの
  choice: 寿命
  alternative: 背丈
  rationale: 直後の「一キュビト」は背丈にも結び付き得るが、約四十五センチを背丈に加えることは「ごく小さなこと」とは言いにくい。一方、時間を長さで表す比喩として寿命と取れば、命について思い煩う文脈に適合する。ただし原語の曖昧さは脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を用い、反語として自然に読める語順にした。「一キュビト」という原文の具体的な比喩は残し、必要な情報のみ脚注で補った。
