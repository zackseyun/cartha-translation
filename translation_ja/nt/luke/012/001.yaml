id: LUK.12.1
reference: Luke 12:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: ja
  text: その間に、何万人もの群衆が集まり、互いに踏み合うほどになった。イエスは、まず弟子たちに語り始められた。「ファリサイ人のパン種に気をつけなさい。それは偽善です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν οἷς
  choice: その間に
  rationale: 直前の出来事と結びつける時間的・状況的な移行表現として、自然な現代日本語にした。
- source_word: ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου
  choice: 群衆が幾千幾万と集まり
  rationale: μυριάδεςは厳密な「一万」の複数に限定せず、非常に多数の人々を表し得る。「幾千幾万」は大群衆という意味を自然に伝える。
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: 互いに踏み合うほどになった
  rationale: ὥστε＋不定詞の結果の意味を保ち、密集によって現実に踏み合う状態となったことを表した。
- source_word: ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: まず弟子たちに語り始められた
  rationale: πρῶτονを、イエスが最初に弟子たちを相手として語ったという聴衆の優先性に結びつけた。
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: 気をつけなさい
  rationale: 自分自身を守るため注意するという再帰的な警告を、簡潔で自然な日本語にした。対象は後続する「パン種」で明瞭である。
- source_word: ζύμη
  choice: パン種
  rationale: 発酵を引き起こすものという比喩と聖書的な連関を保持するため、「酵母」などに置き換えず「パン種」とした。
- source_word: ἥτις ἐστὶν ὑπόκρισις
  choice: すなわち偽善
  rationale: 関係代名詞節の説明的・同定的な働きを、「すなわち」で明確かつ簡潔に表した。
- source_word: τῶν Φαρισαίων
  choice: ファリサイ派の人々の
  rationale: 人物集団を指すことが一般読者にも明瞭になるようにしつつ、属格の関係を保った。
theological_decisions:
- issue: 「パン種」の比喩的効力
  choice: 比喩を「パン種」として残し、本文自身の説明どおり「偽善」と同定する。
  alternative: 「影響」「教え」などと解釈的に言い換える。
  rationale: 本文が比喩の指示対象を偽善と明示しているため、像そのものを保持し、意味を特定の教理的解釈へ狭めない。
- issue: πρῶτονの係り先
  choice: 「まず弟子たちに」とし、聴衆の優先性を表す。
  alternative: 「何よりもまず」として発言内容の第一項目を示す談話標識と解する。
  rationale: 語順と物語の流れに適合する有力な理解を採用しつつ、後続する別の発言順序までは明示しない。
translation_notes:
  register: 明瞭な現代標準日本語。叙述は簡潔で品位を保ち、イエスへの敬意を表すため「語り始められた」とした。直接話法は普通の読者に理解しやすい命令表現とし、伝統的な聖書比喩「パン種」は保持した。
