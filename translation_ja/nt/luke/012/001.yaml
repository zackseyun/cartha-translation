revisions:
- from: その間に、群衆が幾千幾万と集まり、互いに踏み合うほどになった。イエスは、まず弟子たちに語り始められた。「ファリサイ派の人々のパン種、すなわち偽善に気をつけなさい。」
  to: その間に、何万人もの群衆が集まり、互いに踏み合うほどになった。イエスは、まず弟子たちに語り始められた。「ファリサイ人のパン種に気をつけなさい。それは偽善です。」
  rationale: 数量表現を原文の「多くの万」により近い「何万人もの」とし、パン種と偽善との説明的関係を二文で明確にした。「ファリサイ人」は定着した歴史的・聖書的名称であり、特定の教理的解釈を加えない。
