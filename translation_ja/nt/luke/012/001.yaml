review_pass:
  verdict: revise
  source_fidelity: 「その間に」はἘν οἷςの時間的・状況的なつながりをよく表している。「互いに踏み合うほどになった」もὥστε＋不定詞の結果を自然に伝える。「群衆が幾千幾万と集まり」は大人数の意味を表すが、τῶν μυριάδων（複数の「万」）に対してやや慣用的で、規模の明示性が弱い。「何万人もの群衆が集まり」とするほうが原文の数量表現を明瞭に保つ。
  naturalness: 全体は明瞭だが、「ファリサイ派の人々のパン種、すなわち偽善に気をつけなさい」は、修飾関係と「すなわち」の説明範囲が一読でやや取りにくい。「ファリサイ派の人々のパン種に気をつけなさい。それは偽善です」と二文にすると、現代標準日本語として自然で、比喩とその説明も明確になる。
  terminology: 「パン種」と「偽善」は適切であり、比喩を解釈的に置換していない点もよい。「ファリサイ派の人々」は理解可能だが、原文の集団名としては「ファリサイ人」が日本語の聖書・歴史用語として定着しており、簡潔で自然である。敬語叙述の「語り始められた」と、引用内の普通体命令「気をつけなさい」は、本文の標準的な尊敬表現として問題ない。
  issues:
  - severity: medium
    issue: μυριάδωνの数量的強調が「幾千幾万と」ではやや曖昧である。
    rationale: μυριάςは字義的には一万であり、複数形は少なくとも非常に大きな群衆を強調する。「何万人もの」とすれば、厳密な算定を主張せずに原文の規模をより直接的に反映できる。
  - severity: low
    issue: 「すなわち偽善」の係り受けがやや圧縮されている。
    rationale: ἥτις ἐστὶν ὑπόκρισιςはパン種の比喩を説明・同定する節である。日本語では「それは偽善です」と明示すると説明関係が明瞭になる。
  - severity: low
    issue: 「ファリサイ派の人々」は冗長で、固有の歴史的集団名としての慣用性がやや弱い。
    rationale: 「ファリサイ人」は一般的な日本語の聖書用語であり、τῶν Φαρισαίωνを過不足なく表す。
  revised_text: その間に、何万人もの群衆が集まり、互いに踏み合うほどになった。イエスは、まず弟子たちに語り始められた。「ファリサイ人のパン種に気をつけなさい。それは偽善です。」
