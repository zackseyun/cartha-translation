  terminology: 「娼婦」はπόρνηに対応する明確で現代的な語です。「屠る」はやや硬いものの、祝宴のために動物を殺すθύωを正確に表し、祭儀的な「犠牲としてささげる」を避けています。「肥えた子牛」もσιτευτὸν μόσχονの定着した自然な訳です。
