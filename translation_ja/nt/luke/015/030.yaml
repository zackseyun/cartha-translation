  to: ところが、娼婦たちと一緒にあなたの財産を食いつぶした[a]、あなたのこの息子が来たときには、彼のために肥えた子牛を屠りました。
  rationale: 安全な修正として、原文のアオリストἦλθενに合わせて「来ると」を「来たときには」へ改めた。これにより、父がすでに子牛を屠ったという兄の回顧的な抗議が明確になり、後続の「屠りました」との時制も整う。脚注は意味を変えず、「暮らしの資」をより自然で明瞭な「生活の資」に整えた。
