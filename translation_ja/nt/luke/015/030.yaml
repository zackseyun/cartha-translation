id: LUK.15.30
reference: Luke 15:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε δὲ ὁ υἱός σου οὗτος ὁ καταφαγών σου τὸν βίον ⸀μετὰ πορνῶν ἦλθεν, ἔθυσας αὐτῷ τὸν ⸂σιτευτὸν μόσχον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/030.yaml
  text: But when this son of yours came[a], the one who devoured your livelihood with prostitutes, you slaughtered the fattened calf for him.
translation:
  language: ja
  text: ところが、娼婦たちと一緒にあなたの財産を食いつぶした[a]、あなたのこの息子が来たときには、彼のために肥えた子牛を屠りました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたの生活の資をむさぼり食った」。ここで「食いつぶす」と訳したギリシア語は「食べ尽くす」という強い表現で、「財産」と訳した語は、生活の糧、資産、財産を意味し得る。
    reason: κατεσθίωの鮮烈な比喩とβίοςの意味の幅を示すため。
lexical_decisions:
- source_word: ὅτε δὲ
  choice: ところが、……来ると
  rationale: 時間を示すὅτεを「来ると」、対比を示すδέを「ところが」で表し、兄の不満に満ちた対照を自然な日本語で保った。
- source_word: ὁ υἱός σου οὗτος
  choice: あなたのこの息子
  rationale: 「私の弟」と呼ばず、父との関係だけを強調するοὗτοςの突き放した響きを保持した。
- source_word: ὁ καταφαγών σου τὸν βίον
  choice: あなたの財産を食いつぶした
  rationale: κατεσθίωの「食べ尽くす」という強い比喩を「食いつぶす」で再現した。βίοςはここでは生命そのものではなく、生活の資や所有財産を指す。
- source_word: μετὰ πορνῶν
  choice: 娼婦たちと一緒に
  rationale: 兄の直接的な非難を弱めず、πόρνηの意味を明確で現代的な語で表した。
- source_word: ἦλθεν
  choice: 来ると
  rationale: 文脈上は帰還だが、原文は単に「来た」と述べるため、「帰って来る」と解釈を補わなかった。
- source_word: ἔθυσας
  choice: 屠りました
  rationale: 祝宴の食事のために動物を屠る意味を表し、「犠牲としてささげた」という祭儀的含意を避けた。
- source_word: τὸν σιτευτὸν μόσχον
  choice: 肥えた子牛
  rationale: 祝宴用に特別に肥育された子牛を、簡潔で自然な定型表現で示した。
- source_word: αὐτῷ
  choice: 彼のためには
  rationale: 与格を受益者として訳し、弟には盛大な待遇をしたという兄の対比的な不満を「は」によって表した。
theological_decisions:
- issue: 娼婦たちと財産を食いつぶしたという兄の発言を、確定した事実として扱うか
  choice: 兄の非難を、その発言のまま無限定に訳す
  alternative: 「娼婦たちと一緒に財産を食いつぶしたという」など、伝聞・疑念を明示する
  rationale: 原文は兄自身の非難を直接話法で提示しており、語り手がその詳細を事実認定しているとは明示しない。「という」「らしい」を加えず、話者の発言としてそのまま訳すことで物語上の緊張を保った。
translation_notes:
  register: 現代の一般読者に分かる、明瞭で品位ある会話文とした。「あなたのこの息子」で兄の感情的な距離を示しつつ、過度に口語的・侮蔑的な言い回しは避けた。脚注記号[a]は注釈対象である「財産を食いつぶした」の直後に置いた。
