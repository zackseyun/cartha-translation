  text: εἰς ἑαυτὸν δὲ ἐλθὼν ⸀ἔφη· Πόσοι μίσθιοι τοῦ πατρός μου ⸀περισσεύονται ἄρτων, ἐγὼ δὲ ⸂λιμῷ ὧδε⸃ ἀπόλλυμαι·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/017.yaml
  text: But when he came to himself[a], he said, ‘How many of my father’s hired workers have more than enough bread[c][b], but here I am perishing from hunger!’
translation:
  language: ja
  text: しかし、彼は我に返ると[a]、こう言った。『父の雇い人には、あり余るほどパンがある者がどれほど多くいることか[b]。それなのに、私はここで飢えのために滅びていく[c]！』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正気に返ると」。ギリシア語では字義的に「自分自身に帰ると」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「余るほどパンがある」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「飢えて死にかけている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἑαυτὸν ... ἐλθὼν
  choice: 我に返ると
  rationale: 字義どおりの「自分自身に帰る」という比喩を生かしつつ、正気と明瞭な自己認識を取り戻したことを表す自然な日本語。
- source_word: ἔφη
  choice: こう言った
  rationale: アオリストの物語叙述を自然な過去形で表し、後続の直接話法を導く。
- source_word: μίσθιοι
  choice: 雇い人
  rationale: 賃金を受け取る労働者を指し、奴隷を意味する語とは区別されるため。
- source_word: περισσεύονται ἄρτων
  choice: あり余るほどパンを持っている
  rationale: περισσεύονται の余剰・豊富さと、ἄρτων の具体的な「パン」をともに保つ。
- source_word: ἄρτων
  choice: パン
  rationale: 食物一般に広げず、原文の具体語を保持する。
- source_word: λιμῷ
  choice: 飢えて
  rationale: ここでは広い意味の飢饉より、本人が経験している飢えを表す与格として自然に訳す。
- source_word: ὧδε
  choice: ここで
  rationale: 父の家の雇い人の境遇と、彼が今置かれている場所・状態との対照を示す。
- source_word: ἀπόλλυμαι
  choice: 死にかけている
  rationale: 現在形が示す進行中の滅びと切迫性を明瞭に表す。ただし「滅びつつある」という広い訳も可能。
