  to: しかし、彼は我に返ると[a]、こう言った。『父の雇い人には、あり余るほどパンがある者がどれほど多くいることか[b]。それなのに、私はここで飢えのために滅びていく[c]！』
  rationale: Πόσοι の感嘆的な問いを「どれほど多くいることか」で明示した。「あり余るほどパンがある者」は、雇い人がパンを豊かに得ているという περισσεύονται ἄρτων の意味を自然な日本語で表す。ἀπόλλυμαι は死に限定せず、「滅びていく」として進行中の破滅・消滅の意味幅を保った。
