id: LUK.15.12
reference: Luke 15:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ νεώτερος αὐτῶν τῷ πατρί· Πάτερ, δός μοι τὸ ἐπιβάλλον μέρος τῆς οὐσίας· ⸂ὁ δὲ⸃ διεῖλεν αὐτοῖς τὸν βίον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/012.yaml
  text: And the younger of them said to his father[a], ‘Father[b], give me the share of the estate that falls to me.’ So he divided his livelihood between them.
translation:
  language: ja
  text: 二人のうち年下の者が父に言った。「お父さん、財産のうち、私に割り当てられる分[a]をください。」そこで父は、生活の資[b]を二人に分けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私のものになる取り分」または「私に属する分」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「生活、生計、生活の資」を意味し、ここでは父の暮らしを支える財産を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νεώτερος αὐτῶν
  choice: 二人のうち年下の息子
  rationale: 直訳は「彼らのうち年下の者」。直前の文脈で二人が息子であることが明示されているため、現代日本語として自然になるよう「息子」を補った。
- source_word: δός μοι
  choice: 私に……ください
  rationale: δίδωμιのアオリスト命令形と与格代名詞を、父への直接の依頼として自然な丁寧表現で訳した。
- source_word: τὸ ἐπιβάλλον μέρος
  choice: 私が受け取ることになる分
  rationale: ἐπιβάλλονが表す、自分に割り当てられる、または自分の取り分となるという意味を、権利関係を過度に強めずに表した。
- source_word: οὐσία
  choice: 財産
  rationale: この相続的な文脈では、所有する資産・財物を指す。「財産」が明瞭で自然である。
- source_word: διεῖλεν
  choice: 分けた
  rationale: διαιρέωの基本義である分割・配分を簡潔に表した。
- source_word: αὐτοῖς
  choice: 二人に
  rationale: 形式上は複数与格「彼らに」。文脈上の二人の息子を明示し、父が双方に配分したことを保った。
- source_word: τὸν βίον
  choice: 生活のもととなる財産
  rationale: βίοςには「生活」「生計」「生活手段・財産」の幅がある。ここでは分配可能な所有物を指しつつ、それが父の暮らしを支える資であったという語感も残した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、父への呼びかけは自然で敬意のある「お父さん」とした。叙述は簡潔で dignified な調子を保ち、原文の οὐσία と βίος の語の違いは本文と脚注で示した。
