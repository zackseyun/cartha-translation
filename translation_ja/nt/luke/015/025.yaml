  text: Ἦν δὲ ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος ἐν ἀγρῷ· καὶ ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ, ἤκουσεν συμφωνίας καὶ χορῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/025.yaml
  text: His older son was in the field; and as he came and drew near to the house[a], he heard music and dancing,
translation:
  language: ja
  text: ところで、父親の上の息子は畑にいた。彼が家に近づいてくると、音楽と踊り[a]の音が聞こえた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「楽器の演奏と踊る人々」とも訳せる。ギリシア語の二語は、より具体的に楽器による音楽と踊りの一団を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: ところで、…は…いた
  rationale: δέはここで強い対比ではなく、父と弟から兄の息子へ場面を移す物語上の転換を示す。「ところで」で自然に表した。
- source_word: ὁ υἱὸς αὐτοῦ ὁ πρεσβύτερος
  choice: 兄の息子
  rationale: πρεσβύτεροςは比較級で、先に登場した弟の息子との対比を示す。「長男」ではなく「兄の息子」として、最年長という原文以上の意味を加えない。
- source_word: ἐν ἀγρῷ
  choice: 畑に
  rationale: ἀγρόςの農地・畑という具体的意味を簡潔な現代日本語で表す。
- source_word: ὡς ἐρχόμενος ἤγγισεν τῇ οἰκίᾳ
  choice: 帰って来て家に近づくと
  rationale: 移動の進行と家への接近を自然な日本語で表す。「帰って」は文脈上の帰着を明確にするが、過度な説明は加えない。
- source_word: ἤκουσεν
  choice: 聞こえてきた
  rationale: 家へ近づく中で音を耳にした場面を自然に表現する。知覚主体を明示しなくても日本語では兄の息子であることが明確。
- source_word: συμφωνίας
  choice: 音楽
  rationale: 楽器の演奏を指し得るが、広く「音楽」と訳すことで原語の幅を保つ。
- source_word: χορῶν
  choice: 踊り
  rationale: 踊りそのものにも踊る人々・舞踊集団にもなり得るため、本文では自然な「踊り」とし、語義上の別案を注記する。
