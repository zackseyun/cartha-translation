  text: 'So he told them this parable[a], saying:'
translation:
  language: ja
  text: そこでイエスは彼らにこのたとえを話された。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると、「しかし／そこで、彼は彼らにこのたとえを語り、こう言われた」のような重ねた発話表現で、後に続くたとえの内容を導入している。
    reason: 原文のλέγωνが後続する発話内容を導入する機能を示しつつ、不自然な逐語訳を避けるため。
lexical_decisions:
- source_word: εἶπεν
  choice: 話された
  rationale: λέγωのアオリスト。目的語が「このたとえ」であるため、現代日本語では「言われた」より「話された」が自然であり、発話行為も保たれる。
- source_word: δὲ
  choice: そこで
  rationale: 弱い接続を表し、直前の不平に対するイエスの応答として自然な展開を示す。強い逆接にはしない。
- source_word: πρὸς αὐτοὺς
  choice: 彼らに
  rationale: πρός＋対格が示す発話の相手を、自然な日本語の対象表現で示す。
- source_word: τὴν παραβολὴν ταύτην
  choice: このたとえ
  rationale: 共観福音書におけるπαραβολήの定着した意味を「たとえ」で表し、ταύτηνを「この」として保持する。
- source_word: λέγων
  choice: 本文では独立に訳出しない
  rationale: 後続する発言内容を導入する分詞。日本語で「言って、話された」とすると冗長なため、「話された」で機能を含ませ、句点の後に続くたとえへ自然につなぐ。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。敬意を保つため主語を「イエス」と補い、尊敬表現「話された」を用いた。原文の重複的な発話構文は本文では自然な日本語に整え、脚注で形式的対応を示した。
