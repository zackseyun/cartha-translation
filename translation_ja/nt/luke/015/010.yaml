id: LUK.15.10
reference: Luke 15:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως, λέγω ὑμῖν, ⸂γίνεται χαρὰ⸃ ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/010.yaml
  text: In the same way[a], I tell you[b], there is joy before the angels of God over one sinner who repents.
translation:
  language: ja
  text: 同じように、あなたがたに言います。悔い改める一人の罪人について、神の天使たちの前で[a]喜びがあるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の天使たちの前で」とあり、原文は天使たち自身が喜んでいるとは明言していません。
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: 同じように
  rationale: 直前のたとえからその適用へ移る比較の働きを自然な現代日本語で表す。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 複数の聞き手への直接の語りかけを保ちつつ、明瞭で自然な表現とした。
- source_word: γίνεται χαρά
  choice: 喜びがあるのです
  rationale: 喜びが生じる、または存在することを表す構文を、文脈上の強調も含めて自然に訳した。
- source_word: ἐνώπιον τῶν ἀγγέλων τοῦ θεοῦ
  choice: 神の御使いたちの前に
  rationale: 喜ぶ主体を御使いたちと断定せず、原文の『前で／面前で』という空間的・法廷的含意を保った。
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ
  choice: 一人の罪人のことで
  rationale: 喜びを引き起こす契機・対象を示すἐπί＋与格を、日本語として自然に表した。
- source_word: μετανοοῦντι
  choice: 悔い改める
  rationale: 現在分詞が『一人の罪人』を修飾する構造を保ち、意味を教理的に展開せず定着した聖書語で訳した。
theological_decisions:
- issue: 悔い改めの意味範囲
  choice: 悔い改める
  alternative: 心を変える／立ち返る
  rationale: この節自体は悔い改めを詳しく定義していないため、概念の広がりを狭める説明的訳を避けた。
- issue: 喜びの場所と主体
  choice: 神の御使いたちの前に喜びがある
  alternative: 神の御使いたちが喜ぶ／神の御使いたちの間に喜びがある
  rationale: 原文は喜びが御使いたちの『前に』あると述べ、御使いたち自身が喜ぶとは明示しない。その神学的余地を保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、語りかけの厳かさを保った。「御使い」は一般読者にも理解可能な聖書的用語として採用した。脚注記号は、曖昧さに直接関わる句の後に置いた。
