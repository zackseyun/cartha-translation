id: LUK.15.28
reference: Luke 15:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὠργίσθη δὲ καὶ οὐκ ἤθελεν εἰσελθεῖν. ὁ ⸀δὲ πατὴρ αὐτοῦ ἐξελθὼν παρεκάλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/028.yaml
  text: But he became angry and was unwilling to go in[b][a]. So his father came out and pleaded with him.
translation:
  language: ja
  text: ところが、兄は腹を立て、家に入ろうとしなかった。[a] そこで父親は出て来て、兄にしきりに頼んだ。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「家に入りたがらなかった」または「家に入るのを拒んだ」。
    reason: lexical_alternative
  - marker: b
    text: 「しきりに頼んだ」は、「懇願した」または「強く勧めた」とも訳せる。原文の未完了形は、訴えかけが繰り返し、または継続していたことを示唆する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὠργίσθη
  choice: 腹を立て
  rationale: アオリスト形がここでは怒りが生じたことを表すため、現代日本語で自然な「腹を立て」とした。「激怒した」ほど強くはしない。
- source_word: δὲ
  choice: ところが
  rationale: 直前の祝宴との対照を自然に示す。
- source_word: οὐκ ἤθελεν εἰσελθεῖν
  choice: 家に入ろうとしなかった
  rationale: θέλωと不定詞が示す本人の意志を保ちつつ、明示的な拒絶とまでは断定しない。「家に」は場面から補った語である。
- source_word: ὁ δὲ πατὴρ αὐτοῦ
  choice: そこで父親は
  rationale: 二つ目のδέを、兄の態度を受けた父親の行動へ進む自然な物語接続として表した。所有関係は日本語では文脈上明白なので「彼の」を省いた。
- source_word: ἐξελθὼν
  choice: 出て来て
  rationale: 家の外へ出る動作を場面に即して自然に表す。
- source_word: παρεκάλει
  choice: なだめ続けた
  rationale: παρακαλέωの懇願・勧めの含みと、未完了過去が示しうる継続的な働きかけを、日本語の文脈に自然な形で表した。ただし語義には「懇願した」「説得しようとした」もありうるため注記した。
- source_word: αὐτόν
  choice: 彼を
  rationale: 代名詞の指示対象である兄をそのまま受ける。
theological_decisions:
- issue: たとえにおける父親の訴えかけの調子
  choice: 「なだめ続けた」として、父親が自ら出て継続的に働きかける姿を保った。
  alternative: 「懇願した」「説得しようとした」
  rationale: 父親の真剣で関係回復を求める働きかけを伝えつつ、特定の教理的解釈を加えない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。物語としての品位を保ち、「兄」は直前の文脈で明らかな年長の息子を指す。「家に」は場面を明確にするための文脈的補足。脚注記号は対応箇所の直後に置いた。
