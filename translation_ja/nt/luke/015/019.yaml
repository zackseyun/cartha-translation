  text: ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός σου· ποίησόν με ὡς ἕνα τῶν μισθίων σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/019.yaml
  text: I am no longer worthy to be called your son[a]. Make me like one of your hired workers.
translation:
  language: ja
  text: 私はもう、あなたの息子と呼ばれる資格はありません。どうか、私を雇い人[a]の一人のようにしてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「雇われている者の一人」とも訳せる。ギリシア語は、家の奴隷ではなく、賃金を受け取って働く人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: もう…ありません
  rationale: 以前とは状況が変わったことを示す時間的否定を、自然な現代日本語で表す。
- source_word: ἄξιος
  choice: 資格がある
  rationale: 息子という身分にふさわしく、それに値するという道徳的・社会的意味を、「資格」という自然な日本語で保持する。
- source_word: κληθῆναι
  choice: 呼ばれる
  rationale: 受動不定詞の字義を保ちつつ、ある身分として認められるという含みも伝える。
- source_word: υἱός
  choice: 息子
  rationale: 男性単数であり、たとえ話における父子関係を具体的に示すため、中性化せず「息子」とする。
- source_word: ποίησόν
  choice: …にしてください
  rationale: 新たな立場に置いてほしいという命令形の願いを、父への嘆願にふさわしい自然な敬語で表す。
- source_word: ὡς
  choice: …のように
  rationale: 同一視ではなく比較を表す語なので、「として」ではなく「のように」とする。
- source_word: ἕνα τῶν μισθίων σου
  choice: あなたの雇い人の一人
  rationale: μίσθιοςは家内奴隷ではなく賃金で雇われる労働者を指す。「雇い人」は簡潔で文脈にも自然である。
theological_decisions:
- issue: 息子の告白における身分と価値の表現
  choice: 「資格」と「息子」を保つ
  alternative: 「あなたの子と呼ばれるに値しません」
  rationale: 本人が感じる、息子として認められるに値しないという関係的・社会的意味を保ち、一般的な羞恥心や特定の教理へ解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。息子から父への願いとして「どうか」と敬語を用い、原文の比較表現と雇用関係の区別を保持した。
