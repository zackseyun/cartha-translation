reference: Luke 15:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ⸂ὁ υἱὸς αὐτῷ⸃· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου, ⸀οὐκέτι εἰμὶ ἄξιος κληθῆναι υἱός ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/021.yaml
  text: But the son said to him[a], ‘Father, I have sinned against heaven and before you[b]. I am no longer worthy to be called your son.’
translation:
  language: ja
  text: しかし、息子は父に言った。「お父さん、私は天に対して[a]、またあなたの前で罪を犯しました。もはや、あなたの息子と呼ばれるに値しません[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天に対して」の「天」は、神を敬って間接的に指す表現です。「神に対して」と意味を明らかにして訳すこともできます。
    reason: lexical_alternative
  - marker: b
    text: 写本の中には、15章19節と同様に、この後へ「雇い人の一人にしてください」に相当する言葉を加えるものもあります。SBLGNT本文では、息子の発言は「あなたの息子と呼ばれるに値しません」で終わります。
    reason: textual_variant
lexical_decisions:
- source_word: εἶπεν δὲ ὁ υἱὸς αὐτῷ
  choice: しかし、息子は父に言った
  rationale: δέは穏やかな接続辞だが、父の直前の行動に対して息子が告白を始める物語上の転換を「しかし」で示した。αὐτῷは文脈上の指示対象を明確にし、自然な日本語となるよう「父に」とした。
- source_word: Πάτερ
  choice: お父さん
  rationale: 呼格のπατήρを、息子が父に直接語りかける場面にふさわしい自然な現代日本語で表した。「私の」は原文にないため加えていない。
- source_word: ἥμαρτον
  choice: 罪を犯しました
  rationale: 完了した行為を認める告白として、アオリストを自然かつ重みのある日本語で表した。
- source_word: εἰς τὸν οὐρανὸν
  choice: 天に対して
  rationale: 原文の「天」を保持しつつ、εἰςがここで示す罪の向けられた相手という意味を「に対して」で表した。神を明示する解釈的訳は本文に入れず、脚注で説明した。
- source_word: καὶ ἐνώπιόν σου
  choice: またあなたの前で
  rationale: ἐνώπιονの「前で、面前で」という語義を保ち、「あなたに対して」と解釈的に言い換えることを避けた。
- source_word: οὐκέτι εἰμὶ ἄξιος
  choice: もう…資格はありません
  rationale: 直訳的な「ふさわしくありません」も可能だが、息子という身分を名乗るに値しないという文脈を、明瞭で自然な日本語として表した。
- source_word: κληθῆναι υἱός σου
  choice: あなたの息子と呼ばれる
  rationale: 受動不定詞κληθῆναιを「呼ばれる」とし、υἱός σουの家族関係をそのまま保持した。
theological_decisions:
- issue: 告白における「天」の意味
  choice: 本文では「天に対して」と原文の表現を保持する。
  alternative: 「神に対して」と解釈して訳す。
  rationale: 「天」は神を敬って間接的に指す表現と理解できるが、原文の語を本文に残すことで、その婉曲性と表現上の含みを保った。
- issue: この節における息子の発言の範囲
  choice: SBLGNTに従い、「あなたの息子と呼ばれる資格はありません」で発言を終える。
  alternative: 「雇い人の一人にしてください」に相当する句を続ける。
  rationale: 採用された原文は「あなたの息子」で文を終えているため、その本文を訳した。異読は脚注で知らせる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、父への直接の呼びかけは自然な「お父さん」とした。告白の厳粛さを保ちながら、古風すぎる語法は避けた。「天」と「あなたの前で」は原文の異なる前置詞表現を残し、神学的含意を本文で一つに決めすぎないようにした。
