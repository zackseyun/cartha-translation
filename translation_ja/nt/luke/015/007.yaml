id: LUK.15.7
reference: Luke 15:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγω ὑμῖν ὅτι οὕτως χαρὰ ⸂ἐν τῷ οὐρανῷ ἔσται⸃ ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι ἢ ἐπὶ ἐνενήκοντα ἐννέα δικαίοις οἵτινες οὐ χρείαν ἔχουσιν μετανοίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/007.yaml
  text: I tell you[b][a], in the same way there will be joy in heaven over one sinner who has a change of mind than over ninety-nine righteous people who have no need of one.
translation:
  language: ja
  text: あなたがたに言います。同じように[a]、悔い改める一人の罪人のことで、悔い改める必要のない九十九人の正しい人たち[b]のこと以上に、天には喜びがあるでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同じように」は、「このように」「そのように」とも訳せます。直前のたとえの喜びと、天の喜びを結び付ける表現です。
    reason: lexical_alternative
  - marker: b
    text: 原文は「正しい人たち」と述べています。文字どおりにも、文脈上の皮肉を含む表現とも読めますが、本文ではどちらかに限定していません。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の呼びかけと断言を保ちつつ、現代日本語として自然な導入句とした。
- source_word: οὕτως
  choice: 同じように
  rationale: 直前のたとえにおける喜びと天の喜びとの対応を明確に示す。
- source_word: χαρὰ ἐν τῷ οὐρανῷ ἔσται
  choice: 天に喜びがあるのです
  rationale: 未来形は文脈上の一般的・確実な事態として自然な日本語で表し、喜ぶ主体を補わず、場所を示すギリシア語を保った。
- source_word: ἐπὶ ἑνὶ ἁμαρτωλῷ μετανοοῦντι
  choice: 悔い改める一人の罪人のことで
  rationale: ἐπίを喜びの契機として訳し、現在分詞の能動的な意味を簡潔に表した。μετανοέωは聖書文脈で定着し、単なる意見変更以上の転回を表す「悔い改める」とした。
- source_word: ἢ
  choice: 以上に
  rationale: 喜びの程度を比べる比較構文として、日本語で明瞭にした。
- source_word: ἐνενήκοντα ἐννέα δικαίοις
  choice: 九十九人の正しい人たち
  rationale: 形容詞の名詞的用法を自然に表し、語そのものが持つ解釈上の緊張を保持した。
- source_word: οὐ χρείαν ἔχουσιν μετανοίας
  choice: 悔い改める必要のない
  rationale: 名詞表現を自然な日本語の動詞句にし、何が必要ないのかを明示した。
theological_decisions:
- issue: 「正しい人たち」が実際に正しい人々を指すのか、皮肉または自認を含むのか
  choice: 本文では「正しい人たち」とし、皮肉を明示しない
  alternative: 「自分を正しいと思っている人たち」または引用符付きの「正しい」人たち
  rationale: ギリシア語は単にδικαίοιςと述べ、皮肉を文法的に明示していないため、解釈上の緊張を訳文に残した。
- issue: 天における喜びの主体
  choice: 主体を補わず「天に喜びがある」とする
  alternative: 「神が喜ばれる」または「天使たちが喜ぶ」
  rationale: この節は喜びの場所を述べるが、喜ぶ主体を明示していない。10節の異なる表現を先取りしない。
- issue: 九十九人との比較の性質
  choice: 「以上に」と比較を明示する
  alternative: 「ではなく」などの排他的対比
  rationale: ἢはここで喜びの比較を導くと理解できるが、九十九人について喜びが全くないとまでは訳文で断定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの断言にふさわしい落ち着いた格調を保った。「悔い改め」は一般語よりやや聖書的だが、μετάνοιαが示す内面的・生き方の転回を過不足なく表す定着語として採用した。
