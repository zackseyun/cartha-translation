  yaml_path: translation/nt/luke/015/027.yaml
  text: He said to him[a], “Your brother has come, and your father slaughtered the fattened calf, because he received him back safe and sound.”
translation:
  language: ja
  text: 彼は言った。「弟さんが帰って来ました。お父様は、弟さんを無事に[a]迎え入れることができたので、肥えた子牛を屠ったのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「健康な状態で」。ギリシア語の分詞ὑγιαίνονταは「健康である」という意味にも、文脈上より広く「無事である」という意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥκει
  choice: お帰りになりました
  rationale: 到着して今ここにいるという現在的な結果を伴う意味を、帰還の文脈と召使いから兄への発話に合う自然な敬語で表した。
- source_word: ἔθυσεν
  choice: ほふった
  rationale: 祝宴の食事のために家畜を屠る意味を保ちつつ、正式な祭儀上の犠牲であるとの含みを避けた。
- source_word: μόσχον τὸν σιτευτόν
  choice: 肥えた子牛
  rationale: 祝宴に備えて特別に肥育された子牛を指す定着した自然な表現である。
- source_word: ὑγιαίνοντα
  choice: 無事な姿で
  rationale: 身体的に健康であるという意味を含みつつ、帰還した者が無事であるという文脈上の広がりも伝える。語義の幅は脚注に残した。
- source_word: ἀπέλαβεν
  choice: 迎え戻すことができた
  rationale: 単に迎えたのではなく、失われていた家族を再び受け入れたという回復の含みを表した。
- source_word: ὁ δὲ εἶπεν αὐτῷ ὅτι
  choice: すると彼は言った。
  rationale: δέを軽い場面展開として訳し、ὅτιは日本語で自然な直接話法として処理した。
- source_word: Ὁ ἀδελφός σου
  choice: 弟さん
  rationale: ἀδελφός自体は兄弟の年長・年少を明示しないが、物語上、話しかけられているのが兄であるため、日本語で自然な「弟」を用い、丁寧な呼称とした。
