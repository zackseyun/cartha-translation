  text: δαπανήσαντος δὲ αὐτοῦ πάντα ἐγένετο λιμὸς ⸀ἰσχυρὰ κατὰ τὴν χώραν ἐκείνην, καὶ αὐτὸς ἤρξατο ὑστερεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/014.yaml
  text: But after he had spent everything[a], a severe famine came upon that country[b], and he began to be in need.
translation:
  language: ja
  text: ところが、彼が何もかも使い果たした後、その地方一帯にひどい飢饉が起こり、彼は困窮し始めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は必要なものに事欠き始めた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δαπανήσαντος ... αὐτοῦ πάντα
  choice: 彼が何もかも使い果たした後
  rationale: 属格絶対のアオリスト分詞を、先行する出来事を表す自然な時の節として訳した。δαπανάω自体には必ずしも浪費の評価が含まれないため、「浪費した」ではなく「使い果たした」とした。
- source_word: δέ
  choice: ところが
  rationale: 財産のある状態から飢饉と困窮へ転じる物語上の対照を、自然な日本語で示す。
- source_word: ἐγένετο
  choice: 起こり
  rationale: 飢饉の発生を表すγίνομαιの文脈上の意味を、現代日本語で自然に表した。
- source_word: λιμὸς ἰσχυρά
  choice: ひどい飢饉
  rationale: ἰσχυρόςが飢饉の深刻さを強めているため、明快で自然な「ひどい」とした。
- source_word: κατὰ τὴν χώραν ἐκείνην
  choice: その地方一帯に
  rationale: κατά＋対格が地域にわたる広がりを示し、χώραはここでは国という政治的単位より「地方・地域」が自然であるため。
- source_word: ἤρξατο ὑστερεῖσθαι
  choice: 困窮し始めた
  rationale: 開始を表すἤρξατοと、欠乏状態に陥るὑστερεῖσθαιを簡潔かつ自然に表した。「足りなくなり始めた」という語義上近い別訳も可能。
- source_word: αὐτὸς
  choice: 彼は
  rationale: 明示された代名詞による主語への焦点を、日本語の主題提示「彼は」で保った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。「使い果たした」は原語にない道徳的評価を加えず、全財産を消費したことを示す。「困窮」は欠乏状態を自然にまとめるが、原語により近い別訳を脚注に示した。
