id: LUK.15.22
reference: Luke 15:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ πατὴρ πρὸς τοὺς δούλους αὐτοῦ· ⸀Ταχὺ ⸀ἐξενέγκατε στολὴν τὴν πρώτην καὶ ἐνδύσατε αὐτόν, καὶ δότε δακτύλιον εἰς τὴν χεῖρα αὐτοῦ καὶ ὑποδήματα εἰς τοὺς πόδας,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/022.yaml
  text: But the father said to his servants[a], ‘Quickly, bring out the best robe and put it on him[c][b], and put a ring on his hand and sandals on his feet.’
translation:
  language: ja
  text: しかし父親は自分の奴隷たち[a]に言った。「急いで、いちばん上等な衣[b]を出して来て、彼に着せなさい。彼の手に指輪[c]をはめ、彼の足に履物を履かせなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷たち」と訳したギリシア語は、家に属する隷属身分の者を指す。「僕たち」「召使いたち」とも訳される。
    reason: 社会的・語彙的な幅を示すため。
  - marker: b
    text: 直訳は「第一の衣」。ここでは「最上の衣」「いちばん良い衣」の意味と考えられる。
    reason: πρώτηνの字義と文脈上の意味の幅を保存するため。
  - marker: c
    text: ギリシア語は単に「指輪」と言う。身分の回復を示す印章指輪と理解されることもある。
    reason: 本文にない種類や象徴的解釈を本文外で区別して示すため。
lexical_decisions:
- source_word: δούλους
  choice: 奴隷たち
  rationale: この語は家に属する隷属身分の者たちを指すため、古代社会の実態を曖昧にしない訳語とした。
- source_word: Ταχὺ
  choice: 急いで
  rationale: 即時の行動を促す副詞として、自然な現代日本語で父親の切迫した命令を表す。
- source_word: ἐξενέγκατε
  choice: 持って来て
  rationale: 家や保管場所の中から外へ運び出す動作を、文脈に即した自然な日本語で表した。
- source_word: στολὴν τὴν πρώτην
  choice: いちばん上等な長い衣
  rationale: στολήは丈の長い衣を、πρώτηνはここでは順序上の「最初」よりも最上位・最良を表す可能性が高い。語義上の幅は脚注に示した。
- source_word: ἐνδύσατε αὐτόν
  choice: この子に着せなさい
  rationale: 直前の父親と息子の関係が日本語で明瞭になるようαὐτόνを「この子」とし、衣を身につけさせる使役的な動作を表した。
- source_word: δακτύλιον
  choice: 指輪
  rationale: 原文は指輪の種類を特定していないため、「印章指輪」などの解釈を本文に加えない。
- source_word: εἰς τὴν χεῖρα αὐτοῦ
  choice: 手には…はめ
  rationale: 装身具を身につけさせる日本語の自然な表現を用いた。原文はどの指かを特定しない。
- source_word: ὑποδήματα
  choice: 履物
  rationale: 足に装着する物を指すが形状を厳密には限定しないため、歴史的イメージを過度に固定する「サンダル」より広い「履物」とした。
- source_word: δὲ
  choice: しかし
  rationale: 息子の言葉から父親の応答と行動へ転じる軽い対照を示す。
theological_decisions:
- issue: δούλουςを「奴隷」と「僕・召使い」のどちらで訳すか
  choice: 奴隷たち
  alternative: 僕たち／召使いたち
  rationale: この屋敷の文脈でも隷属身分という社会的現実は残る。「僕」では現代の読者にその点が伝わりにくいため、本文では明示した。
- issue: στολὴν τὴν πρώτηνのπρώτηνを字義どおり「最初の」とするか、最上級的に理解するか
  choice: いちばん上等な長い衣
  alternative: 最初の長い衣／第一の長い衣
  rationale: ここでは衣服の順番より、最上位または最良の衣を指す理解が文脈に適する。ただし原語の字義的な幅は脚注に残した。
- issue: δακτύλιονを「印章指輪」と特定するか
  choice: 指輪
  alternative: 印章指輪
  rationale: 身分や権限の回復を象徴する印章指輪と解することは可能だが、名詞自体はその種類を指定していないため、本文では限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令は「なさい」で統一し、父親の権威と迅速な歓迎を自然に表した。「ローブ」のような外来語を避け、στολήの形状を示す「長い衣」とした。すべての脚注記号を該当箇所に置いた。
