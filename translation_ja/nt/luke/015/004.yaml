id: LUK.15.4
reference: Luke 15:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τίς ἄνθρωπος ἐξ ὑμῶν ἔχων ἑκατὸν πρόβατα καὶ ⸀ἀπολέσας ⸂ἐξ αὐτῶν ἓν⸃ οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα ἐν τῇ ἐρήμῳ καὶ πορεύεται ἐπὶ τὸ ἀπολωλὸς ἕως εὕρῃ αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/004.yaml
  text: What man among you, having a hundred sheep and losing one of them, does not leave the ninety-nine in the open country and go after the lost one until he finds it?
translation:
  language: ja
  text: 「あなたがたのうち、羊を百匹持っている人が、そのうちの一匹を見失ったなら、九十九匹を野原[a]に残して、見つけるまで、その見失った一匹を捜しに行かないでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「荒野」。ギリシア語は、開けた土地、牧草地、または人気のない場所を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς ἄνθρωπος ἐξ ὑμῶν
  choice: あなたがたのうち、……人が……行かないでしょうか
  rationale: 日本語では「あなたがたのうち、どの人が」と直訳するより、文末の修辞疑問と組み合わせる方が自然であり、聞き手の中の代表的な一人を挙げる力を保てる。
- source_word: ἔχων ἑκατὸν πρόβατα
  choice: 羊を百匹持っている
  rationale: 所有を表す現在分詞を自然な連体節とし、羊の助数詞には現代日本語で一般的な「匹」を用いた。
- source_word: ἀπολέσας ἐξ αὐτῶν ἓν
  choice: そのうちの一匹を見失ったなら
  rationale: 文脈上は羊を滅ぼしたのではなく、所在が分からなくなったことを表す。「見失う」は飼い主側の出来事を明確にし、アオリスト分詞の先行的・条件的関係を「なら」で自然に示す。
- source_word: οὐ καταλείπει τὰ ἐνενήκοντα ἐννέα
  choice: 九十九匹を……残して
  rationale: 否定は文末の修辞疑問にまとめ、当然そうするという肯定的応答を期待するギリシア語の構文を自然な日本語で再現した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 野原
  rationale: ἔρημοςは荒野、人気のない所、開けた未耕地を指し得る。羊飼いの場面に合い、乾燥した砂漠に限定しない「野原」を本文に採用した。
- source_word: πορεύεται ἐπὶ τὸ ἀπολωλὸς
  choice: その見失った一匹を捜しに行く
  rationale: 方向を示すἐπίと、失われた状態にあるものを表す完了分詞を、文脈上含意される捜索を明示した自然な日本語にした。
- source_word: ἕως εὕρῃ αὐτό
  choice: 見つけるまで
  rationale: 捜索が発見まで続くという時間的限界を簡潔に保った。目的語は直前の「一匹」から明白なため省略した。
theological_decisions:
- issue: たとえの修辞疑問における代表的人物の表現
  choice: 「あなたがたのうち、……人が」とする
  alternative: 「あなたがたのうち、どの男が」
  rationale: ἄνθρωποςは文法上男性単数だが、この問いでは性別を対比または限定することが焦点ではなく、聞き手の中の人を代表例として示す。「人」は原文の一般的な指示範囲を自然な日本語で保ち、羊飼いが男性だったという不必要な限定を本文に加えない。
- issue: 九十九匹を残す場所の描写
  choice: 「野原」とし、語義の幅を脚注で保持する
  alternative: 「荒野」
  rationale: ἐρήμῳの語義は一つに限定できないため、牧草地を含み得る開けた場所という文脈上自然な訳を本文に置き、「荒野」も脚注で示して曖昧さを保存した。
translation_notes:
  register: 明快な現代標準日本語。修辞疑問は「行かないでしょうか」とし、当然そうするという期待を丁寧で格調ある形で表した。「見失った」を反復して原文のἀπόλλυμι系語の結びつきを保ちつつ、指示対象を明確にした。
