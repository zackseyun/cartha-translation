  text: All the tax collectors and sinners were drawing near to him to hear him[a].
translation:
  language: ja
  text: さて、徴税人と罪人たちは皆、イエスの話を聞くために、イエスに近づいていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスのもとへ来ていた」とも訳せる。ギリシア語は、近づくことが継続的に、または繰り返し行われていたことを示す表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ … ἐγγίζοντες
  choice: さて、…しきりにそばに近寄って来ていた
  rationale: δέの場面転換を自然な「さて」で示し、ἦσανと現在分詞の迂言的構文が表す継続的・反復的な接近を「しきりに」「来ていた」で表した。
- source_word: πάντες οἱ τελῶναι καὶ οἱ ἁμαρτωλοὶ
  choice: 徴税人や罪人たちが皆
  rationale: πάντεςの包括性を「皆」で保ち、二つの集団を解釈的に言い換えず、そのまま提示した。τελώνηςは現代日本語で明確な「徴税人」とした。
- source_word: αὐτῷ
  choice: イエスの…そばに
  rationale: 単独節として指示対象が明確になるよう代名詞を固有名で示しつつ、与格がἐγγίζωの接近対象であることを「そばに」で表した。
- source_word: ἀκούειν αὐτοῦ
  choice: イエスの話を聞こうとして
  rationale: 目的を表す不定詞を「聞こうとして」で示した。属格を伴うἀκούωは、単に音声を聞く以上に耳を傾ける含みがあるため、自然な日本語として「話を聞く」とした。
theological_decisions:
- issue: 「徴税人と罪人」の社会的・宗教的意味
  choice: 二つの呼称を説明的に拡張せず「徴税人や罪人たち」とした。
  alternative: 徴税人や、世間から罪人と見なされていた人々
  rationale: 原文は二つの集団をそのまま名指ししており、「社会的に排斥された人々」などの説明を本文に加えると解釈を先取りするため。
- issue: 接近の継続性
  choice: 「しきりにそばに近寄って来ていた」とした。
  alternative: そばに近寄って来た
  rationale: 迂言的な未完了表現が示す継続・反復の含みを保ち、一度だけの出来事に限定しないため。
translation_notes:
  register: 明瞭な現代標準語を用い、物語として自然でありながら端正な調子を保った。「しきりに」は原文の継続・反復相を読者に伝えるための表現である。
