id: LUK.15.18
reference: Luke 15:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀναστὰς πορεύσομαι πρὸς τὸν πατέρα μου καὶ ἐρῶ αὐτῷ· Πάτερ, ἥμαρτον εἰς τὸν οὐρανὸν καὶ ἐνώπιόν σου,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/018.yaml
  text: I will get up and go to my father[a], and I will say to him, ‘Father[b], I have sinned against heaven and before you,’
translation:
  language: ja
  text: 立ち上がって父のところへ行き、こう言おう。『お父さん、私は天[a]に対して、またあなたの前で[b]罪を犯しました。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天」は、ここでは神を指す敬虔な婉曲表現と考えられる。別訳「神に対して」。
    reason: 原文の「天」を本文に保ちながら、その慣用的含意を示すため。
  - marker: b
    text: 別訳「あなたの目の前で」。
    reason: ἐνώπιόν σουの「前で／目の前で／見ているところで」という意味域を補足するため。
lexical_decisions:
- source_word: ἀναστὰς πορεύσομαι
  choice: 立って……行き
  rationale: 先行するアオリスト分詞と未来形の主動詞を、日本語で自然な動作の連続として表した。「立ち上がって」も可能だが、ここでは決意した行動への移行を簡潔に示す「立って」とした。
- source_word: πρὸς τὸν πατέρα μου
  choice: 父のところへ
  rationale: πρός＋対格が示す、人のもとへの移動を自然な現代日本語で表した。「父へ」よりも、会いに帰る文脈が明確になる。
- source_word: ἐρῶ αὐτῷ
  choice: こう言おう
  rationale: 未来形を意志として表し、後続する直接話法を「こう」で自然に導いた。
- source_word: Πάτερ
  choice: お父さん
  rationale: 父への直接の呼びかけ。日本語の肉親への自然な呼称を用い、「父よ」の古風で荘重すぎる響きを避けた。
- source_word: ἥμαρτον
  choice: 罪を犯しました
  rationale: アオリストが示す罪の事実を、父に対する告白にふさわしい丁寧な過去形で表した。
- source_word: εἰς τὸν οὐρανὸν
  choice: 天に対して
  rationale: 原文の「天」を保持しつつ、εἰςがここで示す罪の向かう対象を「に対して」で表した。神を指す婉曲表現と考えられるが、本文では「神」に置き換えず原文の表現を残した。
- source_word: ἐνώπιόν σου
  choice: あなたの前で
  rationale: 「あなたの面前で／あなたの目の前で」という原文の空間的・関係的表現を保持した。「あなたに対して」とすると直前の句に同化させ、異なる語法を失うため避けた。
theological_decisions:
- issue: 「天」を本文で明示的に「神」と解釈するか
  choice: 「天に対して」を本文に保持する
  alternative: 「神に対して」
  rationale: οὐρανόςは神を指す敬虔な婉曲表現である可能性が高いが、原文が持つ言い回しと含意を保ち、解釈を本文に置き換えないため。
- issue: ἐνώπιόν σουを「あなたに対して」とするか
  choice: 「あなたの前で」
  alternative: 「あなたに対して」
  rationale: 父への罪という意味合いは文脈上あり得るものの、原文は直前のεἰςとは異なる表現を用いる。「前で」として、その関係的・法廷的にも響き得る緊張を保持した。
translation_notes:
  register: 明瞭な現代標準語。放蕩息子が自分の父に語る場面なので、呼びかけは自然な「お父さん」、告白は敬意と悔いを示す丁寧体とした。古風な「立ち上がり、父のもとへ行こう」「父よ」は避けつつ、発言の重みは保った。
