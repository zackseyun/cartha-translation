id: LUK.15.32
reference: Luke 15:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὐφρανθῆναι δὲ καὶ χαρῆναι ἔδει, ὅτι ὁ ἀδελφός σου οὗτος νεκρὸς ἦν καὶ ⸀ἔζησεν, καὶ ⸀ἀπολωλὼς καὶ εὑρέθη.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/032.yaml
  text: But it was necessary to celebrate and rejoice[a], because this brother of yours was dead and has come to life again[c][b]; he was lost and has been found.
translation:
  language: ja
  text: しかし、祝って喜ぶ必要があったのだ[a]。お前のこの弟は、死んでいたのに生き返り[b]、失われていたのに見つかったのだから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祝って喜ぶのは当然だった」または「祝って喜ぶべきだった」。
    reason: ἔδειは、必要性とも状況にかなった当然さとも表し得る。
  - marker: b
    text: 直訳に近くは「生きた」。ここでは、死んでいた者が再び生きるようになったことを表す。たとえの文脈では回復を指す比喩と考えられる。
    reason: ἔζησενの字義と、文脈上の比喩的な意味合いを示すため。
lexical_decisions:
- source_word: εὐφρανθῆναι
  choice: 祝って
  rationale: 宴を伴う喜びの文脈を踏まえ、単なる「喜ぶ」と重ならないよう、祝宴・祝賀の含みを自然な現代日本語で表した。
- source_word: χαρῆναι
  choice: 喜ぶ
  rationale: εὐφρανθῆναιと並ぶ喜びの表現を省略せず、日本語でも二つの動詞として保った。
- source_word: ἔδει
  choice: べきだった
  rationale: 状況上また道義上そうする必要があったという非人称表現の力を保ちつつ、「必要があった」より自然な日本語とした。「当然だった」も可能であるため注記した。
- source_word: ὁ ἀδελφός σου οὗτος
  choice: おまえのこの弟
  rationale: 年長の息子に対して語られているためἀδελφόςを自然な親族呼称「弟」とし、σουとοὗτοςの双方を残して、父が兄弟関係を念押しする響きを保った。
- source_word: νεκρὸς ἦν
  choice: 死んでいた
  rationale: たとえの中で回復を指す比喩と考えられるが、原文の死と生の対照を解釈的に言い換えず、そのまま保った。
- source_word: ἔζησεν
  choice: 生き返り
  rationale: 字義的には「生きた」だが、直前の「死んでいた」との対照から、回復を自然に表す「生き返る」とした。身体的復活に限定しないよう注記した。
- source_word: ἀπολωλὼς
  choice: 失われていた
  rationale: 完了分詞が示す、失われた状態にあったことを表した。章全体の「失われたもの」という主題との語彙的連続性も保つ。
- source_word: εὑρέθη
  choice: 見つかった
  rationale: 受動形を保ち、失われていた状態との簡潔な対照を示した。
theological_decisions:
- issue: ἔζησενが示す死から生への移行を、身体的復活として明示するか、関係の回復を表す比喩として読むか
  choice: 本文では「生き返り」として死と生の対照を保持し、具体的な意味を限定しない。
  alternative: 「再び生きるようになり」または「立ち直り」とする。
  rationale: たとえの文脈では息子の帰還と回復を指すが、「立ち直る」と意訳すると原文の強い死／生の比喩が失われる。一方、「生き返る」は文脈上、比喩としても自然に理解できる。
- issue: ἔδειを義務・必要として表すか、ふさわしさ・当然さとして表すか
  choice: 「べきだった」として必要性と適切さの両方を含み得る表現にした。
  alternative: 「当然だった」または「必要があった」。
  rationale: 原文は非人称的な必要性を示すが、この文脈では祝うことのふさわしさも含む。どちらか一方に狭めず、注で別訳を示した。
translation_notes:
  register: 父が年長の息子に語る場面として、「おまえ」を用いた率直で親しい口調にした。文体は現代的で明瞭にしつつ、死／生、喪失／発見という対句の荘重さを保った。
