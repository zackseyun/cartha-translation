id: LUK.15.24
reference: Luke 15:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι οὗτος ὁ υἱός μου νεκρὸς ἦν καὶ ἀνέζησεν, ⸂ἦν ἀπολωλὼς⸃ καὶ εὑρέθη. καὶ ἤρξαντο εὐφραίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/024.yaml
  text: because this son of mine was dead and has come to life again[a]; he was lost and has been found[b]. And they began to celebrate.
translation:
  language: ja
  text: 私のこの息子は、死んでいたのに生き返り、失われていたのに見つかったのだから。』そして、彼らは祝い始めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: 〜のだから
  rationale: 父が祝宴を行う理由を述べる因果表現として、文末の「〜のだから」が現代日本語の直接話法に自然である。
- source_word: οὗτος ὁ υἱός μου
  choice: 私のこの息子
  rationale: 「私の息子」という関係と、οὗτος の指示・強調の双方を、過度に不自然にならない語順で保った。
- source_word: νεκρὸς ἦν
  choice: 死んでいた
  rationale: 比喩を説明的に言い換えず、原文の強い死の表現と継続していた過去の状態を保った。
- source_word: ἀνέζησεν
  choice: 生き返り
  rationale: 「再び生きる、生き返る」という語義を簡潔に表し、「死んでいた」との対照を明確にした。
- source_word: ἦν ἀπολωλὼς
  choice: いなくなっていた
  rationale: 人について自然な現代日本語としつつ、この章の喪失と発見の主題を「見つかった」との対句で示した。直訳的な「失われていた」は日本語では人を物のように響かせやすいため避けた。
- source_word: εὑρέθη
  choice: 見つかった
  rationale: 受動の意味を自然な自動詞表現で保ち、見つけた主体を原文同様に明示しなかった。
- source_word: ἤρξαντο εὐφραίνεσθαι
  choice: 彼らは祝い始めた
  rationale: ἤρξαντο の開始の相を保持し、祝宴の文脈に合う明瞭な現代語として εὐφραίνεσθαι を「祝う」とした。
theological_decisions:
- issue: 「死」と「生き返る」の比喩的な力
  choice: 死と生命の語をそのまま保持する
  alternative: 「父との関係を失っていたが回復した」などと説明的に訳す
  rationale: 物語内では疎遠と回復を表す比喩だが、原文は意図的に強い死と生命の語を用いているため、その神学的含意を訳文で限定しない。
- issue: 「見つかった」の行為者
  choice: 行為者を明示しない
  alternative: 「父が見つけた」または「神に見いだされた」とする
  rationale: εὑρέθη は受動形だが行為者は明記されない。父または神を訳文で補わず、原文の開かれた表現を保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。前節から続く父の直接話法として末尾の閉じかぎ括弧を置いた。「こうして」は祝う行為への自然な移行を示すが、開始の意味は「祝い始めた」で明示した。
