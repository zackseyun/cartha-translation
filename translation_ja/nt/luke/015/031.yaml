  source_fidelity: 原文の語順と意味を適切に保っている。「父は彼に言った」は文脈上の話者を明示した自然な補いであり、τέκνονを「子よ」、πάντοτεを「いつも」、μετ’ ἐμοῦを「私と一緒に」、πάντα τὰ ἐμὰ σά ἐστινを「私のものはすべて、おまえのものだ」とする訳は、いずれも原文に忠実である。所有・相続に関する表現を不必要に限定していない。
  naturalness: 明瞭な現代標準語として自然である。「子よ」にはやや聖書的な格調があるが、呼びかけとして不自然ではなく、父の親愛を簡潔に伝える。「おまえ」は親子間では用い得る表現であり、この文脈では侮蔑的には読まれず、穏やかな全体の語調によって支えられている。
  terminology: τέκνονを「子よ」とし、脚注で「息子よ」を可能な別訳として示す処理は適切である。これは男性である聞き手という物語文脈を認めつつ、原語がυἱόςではない点を本文で過度に固定しない。脚注アンカーaも本文と対応している。
