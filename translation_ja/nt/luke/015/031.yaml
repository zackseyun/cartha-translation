id: LUK.15.31
reference: Luke 15:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτῷ· Τέκνον, σὺ πάντοτε μετ’ ἐμοῦ εἶ, καὶ πάντα τὰ ἐμὰ σά ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/031.yaml
  text: And he said to him[a], ‘Child, you are always with me, and all that is mine is yours.’
translation:
  language: ja
  text: 父は彼に言った。「子よ[a]、おまえはいつも私と一緒にいる。私のものはすべて、おまえのものだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「息子よ」。ギリシア語は、愛情のこもった家族的な呼びかけである「子よ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνον
  choice: 子よ
  rationale: 呼格の親愛を込めた家族的な呼びかけを簡潔に表し、原文にない所有表現を加えない。文脈上は息子への呼びかけだが、υἱόςではなくτέκνονであるため、「息子よ」ではなく「子よ」とした。
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的な関係を表す「常に」の意味を、自然な現代日本語で表す。
- source_word: μετ’ ἐμοῦ
  choice: 私と一緒に
  rationale: μετά＋属格が示す共在・交わりを明瞭かつ自然に訳す。
- source_word: πάντα τὰ ἐμὰ
  choice: 私のものはすべて
  rationale: 父の所有するもの全体を指す包括性を保ちつつ、自然な日本語にした。
- source_word: σά ἐστιν
  choice: おまえのものだ
  rationale: 所有や帰属の厳密な法的性質を限定せず、原文の広い表現を保つ。
- source_word: ὁ δὲ εἶπεν αὐτῷ
  choice: 父は彼に言った
  rationale: 日本語では話者を「父」と明示して自然な叙述とした。δέの弱い継続・対照は、ここでは不自然な接続語を置かず文脈に委ねた。
theological_decisions:
- issue: 父が兄息子に用いる家族的な呼称
  choice: τέκνονを「子よ」と訳す
  alternative: 「息子よ」「わが子よ」
  rationale: 父の愛情深い呼びかけを保ちながら、υἱόςにはないτέκνονの語感を反映し、原文にない所有代名詞も本文には加えない。
translation_notes:
  register: 明瞭で自然な現代標準語を用い、父の穏やかで親愛に満ちた語調を保った。「あなた」より家族内の呼びかけとして自然な「おまえ」を採用したが、侮蔑的にならないよう全体を柔らかな文体に整えた。
