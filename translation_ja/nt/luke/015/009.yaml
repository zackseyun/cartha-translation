  text: καὶ εὑροῦσα ⸀συγκαλεῖ τὰς φίλας ⸀καὶ γείτονας λέγουσα· Συγχάρητέ μοι ὅτι εὗρον τὴν δραχμὴν ἣν ἀπώλεσα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/009.yaml
  text: And when she has found it[a], she calls together her women friends and neighbors, saying, ‘Rejoice with me, because I found the drachma that I had lost.’
translation:
  language: ja
  text: そして、それを見つけると、女性の友人たちと近所の女性たちを呼び集めて、こう言う。「一緒に喜んでください。なくしたドラクマ銀貨[a]を見つけましたから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ドラクマはギリシアの銀貨で、多くの状況で労働者一日分ほどの賃金に相当した。
    reason: cultural_note
lexical_decisions:
- source_word: εὑροῦσα
  choice: 見つけると
  rationale: 女性単数のアオリスト分詞を、主動詞に先立つ出来事として自然な現代日本語で表した。目的語は文脈上、失われた銀貨である。
- source_word: συγκαλεῖ
  choice: 呼び集めて
  rationale: 人々を自分のもとへ一緒に呼ぶという複合動詞の意味を保ちつつ、現在形の生き生きとした語りを自然に伝える。
- source_word: τὰς φίλας καὶ γείτονας
  choice: 女友達や近所の女たち
  rationale: φίλαςは明確に女性複数であり、女性形の冠詞τὰςが並列されたγείτοναςにもかかるため、いずれも女性であることを明示した。日本語として不自然に堅くならない表現を選んだ。
- source_word: Συγχάρητέ μοι
  choice: 一緒に喜んでください
  rationale: 複数の相手に、自分と共に喜ぶよう求める命令の意味を直接かつ自然に表した。
- source_word: ὅτι
  choice: から
  rationale: 喜ぶよう求める理由を導く接続語として、直接話法の中で自然な理由表現を用いた。
- source_word: εὗρον
  choice: 見つけました
  rationale: アオリスト直説法一人称単数を、丁寧な呼びかけに調和する完了した出来事として表した。
- source_word: τὴν δραχμὴν
  choice: ドラクマ銀貨
  rationale: 特定の貨幣名を保持しながら、それが銀貨であることを本文でも明確にした。
- source_word: ἣν ἀπώλεσα
  choice: なくした
  rationale: 銀貨を限定する関係節を日本語の連体修飾にし、発見より前の喪失を文脈上自然に伝えた。
