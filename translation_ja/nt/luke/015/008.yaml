source:
  edition: SBLGNT
  text: Ἢ τίς γυνὴ δραχμὰς ἔχουσα δέκα, ἐὰν ἀπολέσῃ δραχμὴν μίαν, οὐχὶ ἅπτει λύχνον καὶ σαροῖ τὴν οἰκίαν καὶ ζητεῖ ἐπιμελῶς ἕως ⸀οὗ εὕρῃ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/008.yaml
  text: Or what woman[a], having ten drachmas, if she loses one drachma[b], does not light a lamp and sweep the house and search carefully until she finds it?
translation:
  language: ja
  text: また、十枚のドラクマ銀貨[a]を持っている女性が、そのうちの一枚をなくしたなら、明かりをともして家を掃き、見つけるまで念入りに捜さないでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ドラクマはギリシアの銀貨でした。
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: また
  rationale: 直前のたとえに続く並行的な問いを導く接続語として、現代日本語で自然な「また」を採用した。
- source_word: τίς γυνὴ
  choice: 女が
  rationale: 一般的な人物を用いた修辞疑問であり、原文にない「あなたがたのうち」を補わず、日本語の問い全体でその働きを表した。
- source_word: δραχμὰς ἔχουσα δέκα
  choice: ドラクマ銀貨を十枚持っている
  rationale: 貨幣名の歴史的具体性を保ちつつ、「銀貨」を添えて読者に意味を明確にした。
- source_word: ἐὰν ἀπολέσῃ δραχμὴν μίαν
  choice: その一枚をなくしたなら
  rationale: 一般的な条件を自然な日本語で表し、「一枚」という数量上の焦点を保持した。
- source_word: οὐχὶ
  choice: 捜さないでしょうか
  rationale: 肯定の答えを期待する修辞疑問として、文末の否定疑問で表現した。
- source_word: ἅπτει λύχνον
  choice: 明かりをともし
  rationale: 当時の灯火を過度に特定せず、点火して照らす行為が明瞭に伝わる自然な表現とした。
- source_word: σαροῖ τὴν οἰκίαν
  choice: 家を掃いて
  rationale: οἰκίαの具体的な住居と、σαρόωの掃く動作を簡潔に保った。
- source_word: ζητεῖ ἐπιμελῶς
  choice: 念入りに捜さないでしょうか
  rationale: ἐπιμελῶςの注意深く徹底して行う含意を「念入りに」で表し、ζητεῖは失った物を探す文脈に合う「捜す」とした。
- source_word: ἕως οὗ εὕρῃ
  choice: 見つけるまで
  rationale: 探索の終点を明確に示し、目的語は日本語で自然に省略した。
