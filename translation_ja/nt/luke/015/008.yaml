    rationale: γυνήはここで一般的な女性を指す。修辞疑問の性格を保ったまま「女性が」とするほうが明瞭で中立的である。
  - severity: low
    issue: 脚注bは本文の理解を助けない同義反復である。
    rationale: 「念入りに」と「丹念に」はこの箇所では実質的に同じであり、原語の有意な別解を示すものではない。
