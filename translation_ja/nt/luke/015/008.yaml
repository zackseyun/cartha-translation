  to: また、十枚のドラクマ銀貨[a]を持っている女性が、そのうちの一枚をなくしたなら、明かりをともして家を掃き、見つけるまで念入りに捜さないでしょうか。
  rationale: 原文の問いかけの形と動作の順序を保ちながら、人物表現を明瞭で中立的な現代標準日本語に整えました。「そのうちの一枚」により十枚のうち一枚を失うという対比を明確にし、情報価値のない同義的な脚注を除きました。
