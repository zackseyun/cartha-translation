  text: Εἶπεν δέ· Ἄνθρωπός τις εἶχεν δύο υἱούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/011.yaml
  text: Then he said[a], “A certain man had two sons.”
translation:
  language: ja
  text: またイエスは言われた。「ある人に二人の息子がいた。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν δέ
  choice: またイエスは言われた
  rationale: δέは前の話からの緩やかな継続・移行を示すため、「また」とした。日本語では主語を補わないと話者が分かりにくいため、文脈上の話者である「イエス」を明示した。敬意を表す自然な聖書文体として「言われた」とした。
- source_word: Ἄνθρωπός τις
  choice: ある人
  rationale: τιςの不特定性と、人物を一人取り上げるニュアンスを、現代日本語で自然な「ある人」によって表した。
- source_word: εἶχεν
  choice: いた
  rationale: 所有を逐語的に「持っていた」とせず、家族関係を自然な日本語で述べる「いた」とした。未完了過去はたとえの背景設定を表す。
- source_word: δύο υἱούς
  choice: 二人の息子
  rationale: δύοを「二人」、男性の子を明示するυἱούςを「息子」と訳し、物語上重要な家族関係を保持した。
theological_decisions:
- issue: Ἄνθρωπός τιςの不特定性をどう表すか
  choice: ある人
  alternative: 一人の人
  rationale: 「ある人」は人物を特定せずに導入するτιςの働きを自然に保ち、寓意的な意味を付加しない。
- issue: 発話者を本文で明示するか
  choice: イエスを補う
  alternative: また言われた
  rationale: ギリシャ語では主語が動詞に含意され、文脈からイエスと分かる。独立した節としても明瞭な日本語にするため明示したが、新たな解釈は加えていない。
translation_notes:
  register: 明瞭で現代的かつ品位ある語調。「ある人に二人の息子がいた」は、たとえ話の導入として簡潔で自然な日本語である。
