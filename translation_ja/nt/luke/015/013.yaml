source:
  edition: SBLGNT
  text: καὶ μετ’ οὐ πολλὰς ἡμέρας συναγαγὼν ⸀πάντα ὁ νεώτερος υἱὸς ἀπεδήμησεν εἰς χώραν μακράν, καὶ ἐκεῖ διεσκόρπισεν τὴν οὐσίαν αὐτοῦ ζῶν ἀσώτως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/013.yaml
  text: And after not many days[a], the younger son gathered everything together and went away to a distant country, and there he squandered his property[c][b], living recklessly.
translation:
  language: ja
  text: それから数日もしないうちに[a]、弟息子はすべてをまとめて遠い国へ旅立った。そしてそこで、無軌道な生活をし[c]、自分の財産[b]を浪費した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「多くの日がたたないうちに」。または「数日後」。
    reason: lexical_alternative
  - marker: b
    text: または「資産」「持ち物」。
    reason: lexical_alternative
  - marker: c
    text: 「放埒な暮らしをして」「浪費的な生活をして」とも訳せる。ここでは特定の罪は明示されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετ’ οὐ πολλὰς ἡμέρας
  choice: 幾日もたたないうちに
  rationale: 「多くない日々の後」という否定表現の意味を保ちつつ、現代日本語として自然にした。
- source_word: συναγαγὼν πάντα
  choice: すべてをまとめて
  rationale: 出発に先立つ行為を表す分詞と、συνάγωの「一つにまとめる」含意を反映する。文脈上、受け取った財産を携行できる形に整えた可能性はあるが、本文以上に限定しない。
- source_word: ὁ νεώτερος υἱός
  choice: 弟息子
  rationale: 二人の息子のうち年下の者を指すことを、物語に自然な簡潔な日本語で示す。
- source_word: ἀπεδήμησεν
  choice: 旅立った
  rationale: 自分の土地を離れて遠方へ行く意味を、続く「遠い国へ」と自然につながる形で表した。
- source_word: εἰς χώραν μακράν
  choice: 遠い国へ
  rationale: χώραの地域・土地・国という幅を保ち、この物語で定着した自然な表現を採用した。
- source_word: διεσκόρπισεν
  choice: 使い果たした
  rationale: 財産を目的語とする場合の「浪費する、散財する」という文脈的意味を明瞭に表す。
- source_word: τὴν οὐσίαν αὐτοῦ
  choice: 自分の財産
  rationale: οὐσίαがここで表す所有資産を広く自然に訳し、「遺産」などへの過度な限定を避けた。
- source_word: ζῶν ἀσώτως
  choice: 放埒な暮らしをして
  rationale: 節度を失った浪費的な生き方を表すが、本文が明示しない特定の罪、とりわけ性的放蕩に限定しない訳語とした。
theological_decisions:
- issue: ἀσώτωςが示す生活の内容
  choice: 放埒な暮らし
  alternative: 遊興にふける／放蕩する
  rationale: 無軌道で浪費的な生活という評価は示しつつ、本文にない具体的な罪の種類を補わない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、たとえ話にふさわしい簡潔で品位ある語り口とした。「放埒」はやや格調のある語だが、特定の罪に限定せずἀσώτωςの道徳的・浪費的含意を簡潔に伝える。すべての脚注記号を本文中に配置した。
