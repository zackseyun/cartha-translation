  to: しかし、兄は父に答えた。「ご覧ください。私はこんなにも長い年月、あなたに仕えてきました。あなたの命令に一度も背いたことがありません。それなのに、友人たちと祝うために、子やぎ一匹さえ私にくださいませんでした。」
  rationale: 本文から原文にない「～のように」という比較表現を除き、δουλεύωの通常の訳語「仕える」を用いた。脚注に語の強い含意を示して、兄の不満に満ちた自己描写を失わせないようにした。さらに、ἵνα目的節を「与える」行為に明確に結び付け、丁寧体を統一した。
