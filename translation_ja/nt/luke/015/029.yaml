source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ ⸀αὐτοῦ· Ἰδοὺ τοσαῦτα ἔτη δουλεύω σοι καὶ οὐδέποτε ἐντολήν σου παρῆλθον, καὶ ἐμοὶ οὐδέποτε ἔδωκας ἔριφον ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/029.yaml
  text: But he answered his father[a], ‘Look, for so many years I have been serving you, and I never disobeyed your command; yet you never gave me even a young goat so that I might celebrate with my friends.’
translation:
  language: ja
  text: しかし、兄は父に答えた。「ご覧ください。私はこんなにも長い年月、あなたに仕えてきました。あなたの命令に一度も背いたことがありません。それなのに、友人たちと祝うために、子やぎ一匹さえ私にくださいませんでした。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ ἀποκριθεὶς εἶπεν τῷ πατρὶ αὐτοῦ
  choice: しかし、兄は父に答えた
  rationale: ἀποκριθεὶς εἶπενは「答えて言った」という慣用的な重複表現なので、自然な日本語では「答えた」とした。文脈上の主語が兄であることを明示し、δὲの対照を「しかし」で表した。
- source_word: Ἰδοὺ
  choice: 見てください
  rationale: 相手の注意を強く引き、自分の訴えを際立たせる語。現代日本語で父への発話として自然な丁寧形を用いた。
- source_word: τοσαῦτα ἔτη
  choice: こんなにも長い年月
  rationale: 期間の長さを強調する不満の調子を保った。
- source_word: δουλεύω σοι
  choice: あなたに奴隷のように仕え
  rationale: δουλεύωの隷属的な含みと兄の苦々しい自己認識を、「仕える」だけに弱めず、かつ実際の法的身分が奴隷だったと断定しない比喩表現で示した。現在形の継続性は、後続する長期間の表現と日本語の文脈によって伝わる。
- source_word: οὐδέποτε ἐντολήν σου παρῆλθον
  choice: あなたの命令に一度も背いたことがありません
  rationale: παρέρχομαιが命令を破る、無視する意で用いられているため、明瞭な現代語の「背く」を選んだ。οὐδέποτεは「一度も…ない」で再現した。
- source_word: ἐμοὶ οὐδέποτε ἔδωκας ἔριφον
  choice: 子やぎ一匹さえ、私にはくださったことがありません
  rationale: ἔριφοςを誤解のない「子やぎ」とし、一匹すら与えられなかったという対照的な不満を「さえ」で表した。ἐμοὶの焦点は「私には」で保持した。
- source_word: ἵνα μετὰ τῶν φίλων μου εὐφρανθῶ
  choice: 友人たちと祝うための
  rationale: ἵναの目的と、宴を楽しむ文脈でのεὐφραίνωの意味を、自然で簡潔な日本語にした。
theological_decisions:
- issue: δουλεύωが表す兄の父に対する関係
  choice: 奴隷のように仕え
  alternative: 仕えてきました／奴隷として働いてきました
  rationale: この発言は兄の苦々しい自己理解を示すが、彼が文字どおり父の奴隷だったと本文が確定しているわけではない。「奴隷のように」により、δουλεύωの強い隷属的響きと比喩的可能性の双方を保った。
translation_notes:
  register: 明瞭で現代的ながら品位のある口語。兄が父に向かって話すため丁寧体を用いつつ、「こんなにも」「それなのに」「さえ」によって抑えきれない不満と対照を表した。
