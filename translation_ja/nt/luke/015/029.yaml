  source_fidelity: 全体として内容はよく伝えているが、「奴隷のように」はギリシア語のδουλεύωにある比較表現を補い、比喩と限定している。「仕えてきました」とし、必要なら語彙注で強い隷属的含みを示すほうが、本文の意味を余計に限定しない。また、目的節を「子やぎ」の修飾にするより、「子やぎ一匹さえくださいませんでした。友人たちと祝うために。」という関係が明瞭な形に整える必要がある。
