source:
  edition: SBLGNT
  text: καὶ ἀναστὰς ἦλθεν πρὸς τὸν πατέρα ⸀ἑαυτοῦ. ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος εἶδεν αὐτὸν ὁ πατὴρ αὐτοῦ καὶ ἐσπλαγχνίσθη καὶ δραμὼν ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ καὶ κατεφίλησεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/020.yaml
  text: And he arose and came to his father[a]. But while he was still far away, his father saw him and was moved with compassion[b], and ran and fell on his neck and kissed him fervently.
translation:
  language: ja
  text: そこで彼は立ち上がり、父のもとへ向かった。まだ彼が遠く離れていたとき、父親は彼を見て、深いあわれみを覚えた。そして走り寄り、彼の首に抱きつき、彼に熱く口づけした[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「何度も口づけした」とも訳せる。ギリシア語の動詞は、愛情の強さ、あるいは繰り返し口づけすることを示し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: 立ち上がり
  rationale: アオリスト分詞が、父のもとへ向かう前に息子が実際に行動を起こしたことを示すため、自然な日本語で動作の順序を保った。
- source_word: ἦλθεν πρὸς τὸν πατέρα ἑαυτοῦ
  choice: 父のもとへ向かった
  rationale: ἔρχομαι は視点により「来る／行く」のどちらにもなり得る。日本語では息子の行動として「向かった」が自然であり、πρός の方向性も表せる。
- source_word: ἔτι δὲ αὐτοῦ μακρὰν ἀπέχοντος
  choice: 彼がまだ遠く離れているうちに
  rationale: 同時的状況を示す属格独立構文を明確に表し、父が息子の到着前に見つけたという物語の流れを保った。
- source_word: ἐσπλαγχνίσθη
  choice: 深くあわれんだ
  rationale: 内臓にまで響くような強い同情・慈しみを表す動詞なので、「あわれんだ」に「深く」を添えて感情の強さを保った。
- source_word: δραμὼν
  choice: 走り寄り
  rationale: 「走った」という動作に、父が息子へ近づいた文脈上の方向を日本語として自然に示した。
- source_word: ἐπέπεσεν ἐπὶ τὸν τράχηλον αὐτοῦ
  choice: その首を抱き
  rationale: 直訳的には「彼の首の上に倒れかかった」だが、抱擁を表す慣用表現である。過度な身体動作の補足を避けつつ、現代日本語で自然に情景を伝えた。
- source_word: κατεφίλησεν
  choice: 熱く口づけした
  rationale: καταφιλέω の愛情のこもった強い動作を表した。反復を示す可能性はあるが必須ではないため、本文では強さを表し、別の可能性を脚注に残した。
theological_decisions:
- issue: たとえにおける父親のあわれみの描写
  choice: 父親の感情と、自ら走り寄る行動を鮮明に訳すが、父親が神を象徴するとの説明は本文に加えない。
  alternative: 感情表現を弱める、または神の愛についての寓意的解釈を本文で明示する。
  rationale: 原文自体が強い感情と一連の行動を描いているため、その力は保つべきである。一方、象徴的・教理的意味を明示するのは翻訳の範囲を越える。
- issue: κατεφίλησεν が示す口づけの強さと反復性
  choice: 本文では「熱く」として愛情の強さを示し、反復の可能性は脚注に置く。
  alternative: 「何度も口づけした」として反復を本文で確定する。
  rationale: この複合動詞は強意または反復を含み得るが、反復を必ず意味するとは限らないため、原文の幅を保った。
translation_notes:
  register: 明快な現代標準語を用いながら、父親の一連の行動が持つ速度と感情の強さを保った。「口づけ」は「キス」よりも文体上の品位を保ち、このたとえの語り口に適している。
