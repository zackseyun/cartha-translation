lexical_decisions:
- source_word: εὑρὼν
  choice: 見つけると
  rationale: アオリスト能動分詞を、主動作に先立つ出来事を表す自然な現代日本語の時間節として訳した。目的語は直前の文脈から明らかなため本文では省略し、脚注で示した。
- source_word: ἐπιτίθησιν
  choice: 載せる
  rationale: 現在能動直説法の生き生きとした語り口を保ち、羊を肩の上へ置く動作を自然な日本語で表した。
- source_word: ἐπὶ τοὺς ὤμους αὐτοῦ
  choice: 自分の肩に
  rationale: ἐπί＋対格が示す、肩の上への移動・配置を「肩に」で表した。αὐτοῦは羊飼いを指すため、主語との同一性が明確な「自分の」とした。ὤμουςは複数形だが、日本語では通常「両肩」より「肩」が自然であり、意味を損なわない。
- source_word: χαίρων
  choice: 喜びながら
  rationale: 現在能動分詞が主動作に伴う感情・様態を示すことを保ち、「喜んで」よりも継続的な付帯状況が明確な表現とした。
theological_decisions:
- issue: εὑρὼνの暗黙の目的語
  choice: 本文では目的語を明示せず、「見つけると」と訳し、脚注で失われた羊を指すことを示した。
  alternative: 「それを見つけると」または「羊を見つけると」
  rationale: ギリシア語本文には目的語が明記されず、直前の文脈によって補われる。日本語でも目的語の省略が自然なので、本文では原文の省略を保ちつつ、参照先を脚注で明確にした。
translation_notes:
  register: 明快で自然な現代標準日本語を用い、たとえ話の簡潔で生き生きとした語り口を保った。「載せる」は羊を肩に担ぎ上げる場面に適した日常的かつ品位ある表現である。
