  source_fidelity: 「見つけると」はεὑρὼν（見つけて／見つけたとき）の時間的・先行する行為を自然に表す。目的語が本文で省略されている点も、直前から羊を指すことが明白であるギリシア語の省略と、日本語の自然な省略の双方に適う。「自分の肩に載せる」はἐπιτίθησιν ἐπὶ τοὺς ὤμους αὐτοῦを忠実に表し、「喜びながら」はχαίρωνの付帯状況を保持している。
