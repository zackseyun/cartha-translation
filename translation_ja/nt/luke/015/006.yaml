id: LUK.15.6
reference: Luke 15:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐλθὼν εἰς τὸν οἶκον συγκαλεῖ τοὺς φίλους καὶ τοὺς γείτονας, λέγων αὐτοῖς· Συγχάρητέ μοι ὅτι εὗρον τὸ πρόβατόν μου τὸ ἀπολωλός.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/006.yaml
  text: And when he comes into the house[a], he calls together his friends and neighbors, saying to them, ‘Rejoice with me[c][b], because I have found my sheep that was lost.’
translation:
  language: ja
  text: そして家に帰ると[a]、友人や近所の人々を呼び集めて、こう言う。「一緒に喜んでください[b]。いなくなっていた私の羊を見つけたからです[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その家に入ると」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私と喜びを共にしてください」または「一緒に祝ってください」。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「私の羊、いなくなっていたその羊を見つけたからです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν εἰς τὸν οἶκον
  choice: 家に帰ると
  rationale: 直訳は「その家に入ると」だが、この文脈では捜索から自宅へ戻ることを自然な現代日本語で表す。「家に入ると」という字義的な訳も脚注に示す。
- source_word: συγκαλεῖ
  choice: 呼び集めて
  rationale: 人々に声をかけて一緒に集めるという動作を、祝いの文脈に適した自然な表現で示す。
- source_word: τοὺς φίλους καὶ τοὺς γείτονας
  choice: 友人や近所の人々
  rationale: 両者を一つの集まりとして列挙する自然な日本語。「近所の人々」は γείτονας の社会的関係を明瞭に伝える。
- source_word: λέγων αὐτοῖς
  choice: こう言う
  rationale: 分詞を日本語の連用構造で主動詞につなぎ、後続の直接話法を自然に導入する。
- source_word: Συγχάρητέ μοι
  choice: 一緒に喜んでください
  rationale: συγχαίρω の「人と喜びを共にする」という意味を明示する。命令形は日本語で不必要に強くならないよう丁寧な依頼形とした。
- source_word: ὅτι
  choice: からです
  rationale: 喜びを共にするよう求める理由を示す用法を、明瞭な理由節として訳す。
- source_word: εὗρον
  choice: 見つけた
  rationale: アオリストの完了した発見を自然に表す。日本語では現在の結果も文脈から十分伝わる。
- source_word: τὸ πρόβατόν μου τὸ ἀπολωλός
  choice: いなくなっていた私の羊
  rationale: 冠詞付き完了分詞が示す、それまで失われた状態にあった羊という意味を保つ。「迷子の羊」とすると迷走の様態を限定しやすいため避けた。
theological_decisions:
- issue: 回復を描くたとえの具体的表象
  choice: いなくなっていた私の羊
  alternative: 私の迷子の羊／失われていた私の羊
  rationale: この節自体では羊の発見という具体的なたとえを保ち、罪人や救いという解釈を本文へ先取りして入れない。「いなくなっていた」は日常的で、かつ完了分詞が表す以前からの状態を伝える。
- issue: 共同の喜びを求める命令
  choice: 一緒に喜んでください
  alternative: 私と喜びを共にしてください／一緒に祝ってください
  rationale: 喜びを共にするという語義を直接保つ。「祝う」は祝宴などの行為まで含意し得るため、本文ではより語義に近い「喜ぶ」を採用する。
translation_notes:
  register: 明瞭で現代的ながら品位のある語り口とした。発話は丁寧形にして、喜びへの招きを自然に表現した。脚注記号は該当語句の直後に置き、本文にはすべての記号を明示した。
