id: LUK.15.16
reference: Luke 15:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπεθύμει ⸂γεμίσαι τὴν κοιλίαν αὐτοῦ ἀπὸ⸃ τῶν κερατίων ὧν ἤσθιον οἱ χοῖροι, καὶ οὐδεὶς ἐδίδου αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/016.yaml
  text: And he longed to fill his stomach with the carob pods that the pigs were eating[a], and no one was giving him anything.
translation:
  language: ja
  text: 彼は、豚が食べていたいなご豆のさやで腹を満たしたいと切に願っていた[a]。しかし、だれも彼に何も与えてくれなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いなご豆のさや」はカロブの木の実のさやで、家畜の飼料にも用いられた。単に「さや」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεθύμει
  choice: 切に願っていた
  rationale: 未完了過去による継続的で強い欲求を表す。文脈上の飢えを自然な現代日本語で伝えつつ、単なる「望んだ」より切迫感を保つ。
- source_word: γεμίσαι τὴν κοιλίαν αὐτοῦ
  choice: 腹を満たしたい
  rationale: γεμίσαι の具体的な「満たす」と、κοιλία の身体的な「腹」を保った。日本語では願望の内容として「満たしたい」とするのが自然。
- source_word: ἀπὸ τῶν κερατίων
  choice: いなご豆のさやで
  rationale: ἀπό はここでは満たす材料・源を示すため、日本語では「で」が自然。κεράτια が指すカロブの実のさやを明確にした。
- source_word: κερατίων
  choice: いなご豆のさや
  rationale: カロブを指す日本語名として比較的分かりやすい「いなご豆」を用い、豆そのものではなく、家畜の飼料にもされたさやであることを明示した。
- source_word: οἱ χοῖροι
  choice: 豚
  rationale: 現代日本語で最も普通かつ明瞭な語。
- source_word: ἤσθιον
  choice: 食べていた
  rationale: 未完了過去の進行的な場面描写を保つ。
- source_word: οὐδεὶς ἐδίδου αὐτῷ
  choice: だれも彼に何も与えてくれなかった
  rationale: 未完了過去が示す継続的な欠乏を表し、目的語が明示されないギリシャ語を日本語では自然に「何も」と補った。「くれなかった」は、彼の必要が満たされなかったという視点を自然に示す。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、飢えの身体性と継続する窮乏を保った。「腹」は「胃」より物語文として自然であり、「おなか」よりも品位のある文体に合う。
