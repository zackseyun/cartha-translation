id: LUK.15.15
reference: Luke 15:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πορευθεὶς ἐκολλήθη ἑνὶ τῶν πολιτῶν τῆς χώρας ἐκείνης, καὶ ἔπεμψεν αὐτὸν εἰς τοὺς ἀγροὺς αὐτοῦ βόσκειν χοίρους·
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/015.yaml
  text: So he went and joined himself to one of the citizens of that country[a], and he sent him into his fields to feed pigs.
translation:
  language: ja
  text: そこで彼は出かけて行き、その地方の住民の一人にすがりついた。[a] すると、その人は彼を自分の畑に送り、豚の世話をさせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身を寄せた」「頼りすがった」とも訳せる。ギリシア語の動詞には、ある人に密着するように結びつき、頼るという含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: πορευθεὶς
  choice: 出かけて行き
  rationale: 移動を表すアオリスト分詞を、後続する主動詞への自然な連続動作として訳した。
- source_word: ἐκολλήθη
  choice: すがりついた
  rationale: 「結びつく、密着する」という語義と、この文脈で他人を頼らざるを得ない依存の含みを自然な日本語で表す。物理的に抱きついたとの意味に限定されないことは脚注で補う。
- source_word: ἑνὶ τῶν πολιτῶν
  choice: 住民の一人に
  rationale: πολίτηςは共同体の成員・市民を表すが、物語の外国という設定では、日本語の「市民」より「住民」が自然で、国籍制度について不要な含意を生じにくい。
- source_word: τῆς χώρας ἐκείνης
  choice: その地方の
  rationale: χώραの「国、地方、地域」という幅を踏まえ、この箇所では土地・地域を指す自然な表現を採用した。
- source_word: ἔπεμψεν αὐτόν
  choice: その人は彼を…送り
  rationale: 直前の住民が主語、息子が目的語であることを日本語で明確にした。
- source_word: εἰς τοὺς ἀγροὺς αὐτοῦ
  choice: 自分の畑に
  rationale: 複数形ἀγρούςは複数の畑または農地一帯を指し得る。日本語では総称的な「畑」が自然であり、所有者を再帰表現で明示した。
- source_word: βόσκειν χοίρους
  choice: 豚の世話をさせた
  rationale: βόσκωは家畜に餌を与える、放牧するという意味を持つ。「豚を飼わせた」より作業内容に焦点を当て、「餌をやらせた」より継続的な飼養の幅を保つ。
theological_decisions:
- issue: 豚を扱う仕事が持つ物語上の含意
  choice: 本文では説明を加えず「豚の世話」と訳す
  alternative: 「汚れた豚の世話」などと補足する
  rationale: ユダヤ的背景では豚に強い含意があるが、「汚れた」は原文に明記されていないため本文へ付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「そこで」「すると」によって出来事の進行を自然に示しつつ、原文の二つのκαίを過度に逐語化していない。「すがりついた」は切迫した依存を表すが、誤って身体動作だけに限定されないよう脚注を付した。
