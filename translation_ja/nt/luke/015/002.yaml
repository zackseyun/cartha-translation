revisions:
- from: すると、ファリサイ派の人々も律法学者たちも不平を漏らし続け、こう言った。「この男は罪人たちを迎え入れ、一緒に食事までしている。」
  to: ファリサイ派の人々も律法学者たちも、不平を漏らし続けて、こう言った。「この人は罪人たちを受け入れ、彼らと食事を共にしている。」
  rationale: 接続詞καίに結果的な意味を与える「すると」を除き、二つの現在形述語を日本語でも並行させました。「まで」を除くことで、食事を共にすることの重要性を損なわずに、原文にない明示的強調を避けています。「この人」はοὗτοςの距離を保ちながら、明瞭な現代標準日本語として過度に粗野にならない表現です。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T05:36:05Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な語義と構文は概ね適切です。διεγόγγυζονの反復・継続する不平、τε … καίの両者、罪人を好意的に受け入れることと彼らと食事することは、いずれも保持されています。ただし、文頭の「すると」はκαίが示す単純な接続以上の結果・展開を示唆します。また「まで」はκαίに明示されない強調を加えます。
  naturalness: 「不平を漏らし続け」は自然で、未完了過去の含みもよく表します。一方、引用内は「迎え入れ」と「している」の時制・相のそろいがやや弱いため、両方を現在の継続的・特徴的行為として整えると明瞭です。「この人」は現代標準日本語として自然であり、文脈上の距離を保てます。
  terminology: 「ファリサイ派の人々」「律法学者」「罪人」は適切な標準的用語です。「この男」は原文の軽蔑的響きを表そうとする意図は理解できますが、日本語では不必要に粗野に響きうるため、「この人」とします。非難の調子は発言全体の文脈で十分に保たれます。
  issues:
  - severity: medium
    issue: 「すると」
    rationale: 原文のκαίはここでは基本的な接続であり、「すると」が含意しうる結果・即時の展開は本文から確定できません。
  - severity: low
    issue: 「食事までしている」
    rationale: καίは二つの非難内容を接続していますが、「まで」は日本語で追加の強調・驚きを明示します。共食の社会的含意は重要でも、訳文に強調語を補う必要はありません。
  - severity: low
    issue: 引用内の述語の相の不統一
    rationale: προσδέχεταιとσυνεσθίειはいずれも現在形です。「受け入れ、食事を共にしている」として並行させると、原文の現在的な告発をより明瞭に再現できます。
  revised_text: ファリサイ派の人々も律法学者たちも、不平を漏らし続けて、こう言った。「この人は罪人たちを受け入れ、彼らと食事を共にしている。」
  revised_footnotes: []
  revision_rationale: 接続詞καίに結果的な意味を与える「すると」を除き、二つの現在形述語を日本語でも並行させました。「まで」を除くことで、食事を共にすることの重要性を損なわずに、原文にない明示的強調を避けています。「この人」はοὗτοςの距離を保ちながら、明瞭な現代標準日本語として過度に粗野にならない表現です。
