source:
  edition: SBLGNT
  text: καὶ διεγόγγυζον οἵ ⸀τε Φαρισαῖοι καὶ οἱ γραμματεῖς λέγοντες ὅτι Οὗτος ἁμαρτωλοὺς προσδέχεται καὶ συνεσθίει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/002.yaml
  text: And both the Pharisees and the scribes were grumbling[a], saying, “This man welcomes sinners and eats with them.”
translation:
  language: ja
  text: ファリサイ派の人々も律法学者たちも、不平を漏らし続けて、こう言った。「この人は罪人たちを受け入れ、彼らと食事を共にしている。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεγόγγυζον
  choice: 不平を漏らし続け
  rationale: 未完了過去の継続的・反復的な側面と、陰でぶつぶつ不満を言う否定的な含みを、現代日本語で自然に表した。
- source_word: οἵ τε Φαρισαῖοι καὶ οἱ γραμματεῖς
  choice: ファリサイ派の人々も律法学者たちも
  rationale: τε … καί の「双方とも」という対応関係を「も……も」で明示した。γραμματεῖς は福音書の文脈に即して「律法学者」とした。
- source_word: λέγοντες
  choice: こう言った
  rationale: 主動詞と同時進行の分詞を、日本語として自然な発言導入にした。継続性は主動詞側で表した。
- source_word: Οὗτος
  choice: この男
  rationale: 指示代名詞が帯びうる距離感や軽蔑的な調子を保ち、「この人」よりも非難口調が伝わる表現とした。
- source_word: ἁμαρτωλοὺς
  choice: 罪人たち
  rationale: 名詞的に用いられた形容詞を、当時の社会的・宗教的な分類を保つ標準的な語で訳した。
- source_word: προσδέχεται
  choice: 迎え入れ
  rationale: 好意的に受け入れる意味を、単なる容認と誤解されにくい自然な日本語で表した。
- source_word: συνεσθίει αὐτοῖς
  choice: 一緒に食事までしている
  rationale: 共食・食卓の交わりを明瞭にし、καί がここで加算的・強意的に響く非難の調子を「まで」で自然に表した。
theological_decisions:
- issue: イエスが罪人を受け入れ、食卓を共にすることの社会的・神学的な意味
  choice: 非難する側の言葉として、罪人を迎え入れ、食事まで共にするという二重の告発を率直に訳す。
  alternative: 「この男は罪人たちを受け入れ、一緒に食べている。」
  rationale: 共食が引き起こした反感を弱めずに示す一方、赦し、承認、会員資格など本文に明記されていない教理的説明は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、語りは品位を保ちつつ、発言部分では原文の軽蔑と非難の響きを自然に再現した。「ファリサイ派」「律法学者」は一般読者に通じやすい聖書用語として採用した。
