reference: Luke 15:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀φέρετε τὸν μόσχον τὸν σιτευτόν, θύσατε, καὶ φαγόντες εὐφρανθῶμεν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/015/023.yaml
  text: And bring the fattened calf[a], slaughter it, and let us eat and celebrate,
translation:
  language: ja
  text: そして、肥えた子牛を連れて来て、屠りなさい[a]。さあ、食べて祝おう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いけにえとして屠りなさい」とも訳せる。ギリシア語の動詞は動物を屠ることを表し、文脈によっては供犠の含みを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρετε
  choice: 連れて来て
  rationale: 複数への命令。生きた家畜を話者のもとへ移動させる文脈なので、現代日本語では「連れて来て」が自然であり、原文にない「外へ」などは補わない。
- source_word: μόσχον τὸν σιτευτόν
  choice: 肥えた子牛
  rationale: μόσχοςは若い牛、σιτευτόςは食物を与えて肥育したものを指す。「肥えた子牛」は、祝宴用に特別に育てられた家畜という含意を簡潔に伝える。
- source_word: θύσατε
  choice: 屠りなさい
  rationale: θύωは動物を屠ることを表し、文脈によっては供犠の含みを持つ。ここでは祝宴の準備が前景にあるため「屠る」とし、明示されていない祭儀的意味に限定しない。
- source_word: φαγόντες
  choice: 食べて
  rationale: アオリスト分詞で字義的には「食べたうえで」だが、後続する勧奨法と結びつき、祝宴への呼びかけをなす。日本語では「食べて祝おう」が自然で、動作の連なりも保てる。
- source_word: εὐφρανθῶμεν
  choice: 祝おう
  rationale: 一人称複数の勧奨法で、喜び楽しむことを呼びかける。祝宴の場面に即し、明瞭で自然な「祝おう」とした。
- source_word: καὶ ... καὶ
  choice: そして……さあ
  rationale: 最初のκαίは命令の連続を「そして」で示す。最後のκαίはφαγόντεςと勧奨法をつなぐが、日本語では新たな共同の呼びかけとして「さあ」を置くと、累加的な流れを保ちながら自然になる。
theological_decisions:
- issue: θύσατεにあり得る供犠的含意
  choice: 祝宴のために動物を「屠る」という命令として訳す。
  alternative: 「いけにえとして献げなさい」または「犠牲にしなさい」として祭儀的含意を前面に出す。
  rationale: θύωには供犠に伴う屠殺を表す用法があるが、この物語の直接の焦点は家の祝宴の準備である。「屠る」は動物を食用に殺す意味を伝えつつ、語が持ち得る供犠的背景を完全には排除しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。家畜には「連れて来る」、食用の動物を殺す行為には「屠る」を用いた。「さあ、食べて祝おう」により、父の命令から共同の祝宴への呼びかけへの移行を自然に表した。
