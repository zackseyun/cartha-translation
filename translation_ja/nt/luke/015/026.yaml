  text: そして、召使いの一人を呼び寄せ、これはいったい何事なのだろうかと尋ねた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: 呼び寄せ
  rationale: アオリスト中動態分詞で、自分のもとに呼んでから尋ねたという動作の順序を自然な日本語で表す。
- source_word: παίδων
  choice: 召使い
  rationale: παῖςには「子ども」と「召使い」の両義があるが、祝宴について家の者に尋ねる場面では「召使い」が文脈に最も適する。
- source_word: ἐπυνθάνετο
  choice: 尋ねた
  rationale: 未完了過去形だが、ここでは継続性を強調せず、問い合わせたことを現代日本語で自然に表す。
- source_word: τί ἂν εἴη ταῦτα
  choice: これはいったい何事なのか
  rationale: 直訳的には「これらは何であり得るのか」。ταῦταが指す一連の出来事を単数的な「これ」で受け、ἄνを伴う婉曲的・推量的な問いを「いったい何事なのか」で自然に保つ。
