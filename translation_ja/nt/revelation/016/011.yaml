id: REV.16.11
reference: Revelation 16:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: ja
  text: 彼らは、自分たちの苦痛と腫れ物[b]のために、天の神を冒瀆した[a]。そして、自分たちの行いを悔い改めなかった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天の神をののしった」、または「天の神を悪く言った」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「潰瘍」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「自分たちの行いから悔い改めなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: 冒瀆した
  rationale: 神に向けて侮辱的・不敬な言葉を語ることを表すため、宗教的な含意を保つ「冒瀆した」とした。
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: 天の神
  rationale: 属格を伴う聖書的な称号を簡潔に保ち、黙示文学の荘重さにも合う。
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: 自分たちの苦痛のために
  rationale: ここでのἐκは原因を表すと理解し、πόνοςの激しい痛みという意味を「苦痛」で表した。
- source_word: ἑλκῶν
  choice: できもの
  rationale: ἕλκοςは皮膚のただれ、腫れ物、潰瘍を指し得る。本文では過度に医学的に限定せず、現代日本語で分かりやすい「できもの」とした。
- source_word: μετενόησαν
  choice: 悔い改めなかった
  rationale: 黙示録では単なる考え直しではなく、道徳的・宗教的な方向転換を表すため、「悔い改める」を用いた。
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: 自分たちの行いを
  rationale: μετανοέωと共に用いられたἐκは、それまでの行いから離れることを示す。日本語として自然な目的語表現にした。
theological_decisions:
- issue: 三つのἐκ句の意味
  choice: 最初の二つは苦痛とできものを冒瀆の原因として表し、最後は自分たちの行いから離れる悔い改めを表すと理解した。
  alternative: 最初の二つも「苦痛とできものから」と、起点の響きをより字義的に残す。
  rationale: 文脈上、苦しみに対する人々の反応が神への冒瀆であったことが中心である。一方、μετανοέωに続くἐκは、従来の行いから離れる方向転換を示す。この違いを自然な日本語で表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「天の神」「冒瀆した」「悔い改める」によって本文の荘重さと宗教的な力を保った。二つの節を文として分け、反復されるκαίは「そして」で素直につないだ。
