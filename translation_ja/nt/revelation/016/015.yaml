id: REV.16.15
reference: Revelation 16:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: ja
  text: 「見よ、わたしは盗人のように来る。目を覚ましていて、自分の衣を守る者は幸いである。その人が裸で歩き回り、その恥を人々が見ることのないように。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を促す間投詞の力と、黙示文学にふさわしい厳粛な調子を保つ。
- source_word: ἔρχομαι
  choice: わたしは…来る
  rationale: 現在形が持つ生き生きとした切迫感と未来的な意味を、自然な日本語で保つ。
- source_word: ὡς κλέπτης
  choice: 盗人のように
  rationale: 到来が予期できないことを示す比喩として訳し、道徳的同一視を加えない。
- source_word: μακάριος
  choice: 幸いである
  rationale: 祝福宣言の定型として、単なる心理的幸福以上の重みを保つ。
- source_word: ὁ γρηγορῶν
  choice: 目を覚ましていて
  rationale: 文字どおりの覚醒と比喩的な警戒の両方を自然に含む。
- source_word: τηρῶν τὰ ἱμάτια αὐτοῦ
  choice: 自分の衣を守る
  rationale: τηρέωの保持・防護の幅を「守る」で表し、ἱμάτιαの具体像と象徴的余韻を「衣」で保つ。
- source_word: ἵνα μὴ γυμνὸς περιπατῇ
  choice: その人が裸で歩き回り…ことがないため
  rationale: 否定を伴う目的節と、περιπατέωの具体的な歩行の像を保持する。
- source_word: βλέπωσιν
  choice: 人々に見られる
  rationale: ギリシア語の不特定の三人称複数を、日本語で不自然な主語を立てずに表す。
- source_word: τὴν ἀσχημοσύνην αὐτοῦ
  choice: その恥
  rationale: 恥ずべき露出と不名誉の両面を含み得る語義を、簡潔で自然な表現にする。
theological_decisions:
- issue: 黙示文学における衣、裸、恥の比喩的意味
  choice: 本文では「衣」「裸」「恥」という具体的な像をそのまま保つ。
  alternative: 衣を道徳的備えや正しい行い、裸を終末的な辱めと明示的に解釈して訳す。
  rationale: 象徴的含意は強いが、原文自体はその意味を一つに限定して説明していないため、翻訳で解釈を固定しない。
- issue: 男性単数形の代表的用法
  choice: 日本語では「者」「その人」「自分」を用いる。
  alternative: 複数形に組み替える、または男性代名詞を明示する。
  rationale: ギリシア語の男性単数の構造を単数のまま保ちつつ、日本語では文法的性を不必要に補わない。
translation_notes:
  register: 現代の一般読者に通じる、簡潔で威厳のある警告調。「盗人」「衣」は日常語よりやや高いが、黙示録の文体と聖書的な連想に適する。原文末尾のダッシュは文脈上の挿入句的性格を示すが、単節として自然に読めるよう句点で閉じた。
