source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: ja
  text: 第三の天使が、自分の鉢の中身を川と水源に注ぎ出した。すると、その水[a]は血になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「そして、それは血になった」。ギリシア語では単数形の動詞が用いられており、川と水源の水を集合的にまとめて述べていると理解できる。
    reason: 原文の単数表現と、省略された主語の曖昧さを示すため。
lexical_decisions:
- source_word: ὁ τρίτος
  choice: 第三の者
  rationale: 冠詞付き序数だけが記され、名詞は直前の文脈から補われる。本文に「御使い」を加えず、日本語で自然に省略を保つため「第三の者」とした。
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: 自分の鉢の中身を…注ぎ出した
  rationale: ἐκχέωは「注ぎ出す」、φιάληは浅い鉢を指す。日本語では鉢そのものではなく中身を注ぐことが明らかなため、「鉢の中身」を明示して自然にした。
- source_word: εἰς τοὺς ποταμοὺς καὶ τὰς πηγὰς τῶν ὑδάτων
  choice: 川と水の泉に
  rationale: εἰςの方向性を助詞「に」で表し、πηγαὶ τῶν ὑδάτωνは簡潔で意味の明瞭な「水の泉」とした。
- source_word: καὶ ἐγένετο αἷμα
  choice: すると、その水は血になった
  rationale: 単数動詞による集合的・結果的な表現を踏まえ、直前の川と泉にある水を集合的に「その水」と受けた。γίνομαιの変化の意味は「血になった」で保った。
theological_decisions:
- issue: ἐγένετοの省略された主語
  choice: 川と泉の水を集合的に「その水」として示す
  alternative: 川と泉を複数で受けて「それらは血になった」とする／形式的に「それは血になった」とする
  rationale: ギリシア語の単数動詞を尊重しつつ、日本語で指示対象を明瞭にする。「その水」は直前の「水の泉」と川の水を集合的に受け、変化の範囲を不必要に狭めたり、曖昧な「それ」を置いたりしない。
translation_notes:
  register: 明瞭な現代標準日本語。黙示録の荘重さを保ちながら古語調を避けた。「第三の者」で原文の名詞省略を維持し、「すると」で出来事の連続と結果を自然に示した。
