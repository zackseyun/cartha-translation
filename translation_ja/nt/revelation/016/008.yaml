  naturalness: 「太陽の上に注いだ」は、太陽の表面上の場所に液体を注ぐように響くため、現代標準日本語として不自然である。「太陽に注いだ」が簡潔かつ自然である。また、この文脈で「第四の者」は日本語としてやや不透明なので、前後の反復文脈で指示される「第四の天使」を明示するほうが読みやすい。
  terminology: 「鉢」「太陽」「人々」「焼き焦がす」は適切である。「天使」は明瞭な現代標準日本語の用語であり、定冠詞付き序数詞が直前の文脈で指す存在を明確にするだけで、神学的解釈を加えない。受動形「許された」は授与者を明示しない点で適切である。
