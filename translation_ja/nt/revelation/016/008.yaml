id: REV.16.8
reference: Revelation 16:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: ja
  text: 第四の天使が、自分の鉢を太陽に注いだ。すると太陽には、火で人々を焼き焦がすことが許された[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「そして、それに、人々を火の中で焼き焦がすことが与えられた」。代名詞は太陽を指すと考えるのが自然だが、第四の天使を指す可能性も文法上は残る。
    reason: αὐτῷの指示対象に関する文法的曖昧さと、ἐν πυρίのより直訳的な表現を示すため。
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: 第四の者
  rationale: 定冠詞付き序数詞の名詞的用法をそのまま簡潔に表した。文脈上は第四の御使いだが、本文にない「御使い」は補わない。
- source_word: ἐξέχεεν
  choice: 注いだ
  rationale: 鉢の中身を対象の上に注ぐという、黙示録16章で反復される表現に自然に合う。
- source_word: φιάλην
  choice: 鉢
  rationale: 浅い器を指す語であり、祭儀と裁きの場面にも適した、現代日本語で理解しやすい訳語。
- source_word: ἐπὶ τὸν ἥλιον
  choice: 太陽の上に
  rationale: ἐπί＋対格が示す注ぐ対象を明確にし、原文の空間的な像も保つ。
- source_word: ἐδόθη αὐτῷ
  choice: 太陽には……ことが許された
  rationale: 受動態を保って授与者を明示せず、最も自然な先行詞と見られる太陽を本文で示した。ただし代名詞の指示対象には文法上の余地があるため注記した。
- source_word: καυματίσαι
  choice: 焼き焦がす
  rationale: 強烈な熱によって焼くという語義を、鮮明かつ自然な日本語で表す。
- source_word: τοὺς ἀνθρώπους
  choice: 人々
  rationale: 男性に限定されない、人間一般を集合的に指す表現として訳した。
- source_word: ἐν πυρί
  choice: 火で
  rationale: 手段または様態を表す句として、原文の火のイメージを保ちながら自然な日本語にした。
theological_decisions:
- issue: ἐδόθηにおける暗黙の授与者
  choice: 「許された」という受動表現を保ち、神を明示しない。
  alternative: 「神が力を与えた」
  rationale: 神の主権的な許可が暗示され得るが、原文は授与者を明記していないため、解釈を本文に補わない。
- issue: αὐτῷの指示対象
  choice: 本文では太陽を指すものとして訳し、別の可能性を脚注で示す。
  alternative: 第四の者を指す
  rationale: 直前の「太陽」が自然な指示対象であり、太陽が人々を焼くという文意にもよく合う。ただし「太陽」と「第四の者」はともにギリシア語で男性形に対応し得るため、文法だけでは完全には確定しない。
- issue: τοὺς ἀνθρώπουςの範囲
  choice: 性別を限定しない「人々」とする。
  alternative: 男たち
  rationale: ここでἄνθρωποςは人間一般を指しており、男性だけに限定する根拠はない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「第四の者」によって原文の簡潔さを保ち、「御使い」を本文に補わなかった。裁きの強烈さは「焼き焦がす」で表した。
