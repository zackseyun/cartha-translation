id: REV.16.1
reference: Revelation 16:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: ja
  text: また私は、聖所[a]から七人の御使いたちに語りかける大きな声を聞いた。「行って、神の憤りの七つの鉢を地上に注ぎ出しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」とも訳せる。ギリシア語の「ナオス」は、神殿域全体よりも、その中心にある聖所を指すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: 大きな声
  rationale: φωνήとともに用いられたμέγαςは、声の性質としての偉大さではなく音量の大きさを表すため、現代日本語で自然な「大きな声」とした。
- source_word: ναοῦ
  choice: 聖所
  rationale: ναόςは神殿域全体よりも、その中心にある聖なる場所を指すことが多い。黙示録の天上の情景でも、この限定的な意味を保つ「聖所」が適切である。
- source_word: λεγούσης
  choice: こう言うのを
  rationale: 分詞λεγούσηςはφωνῆςに係り、その声が語っている内容を導入する。日本語では「声が……こう言うのを聞いた」として関係を明瞭かつ自然に表した。
- source_word: Ὑπάγετε
  choice: 行って
  rationale: 七人の御使いに、その場から赴いて命令を実行するよう求める複数命令形であり、「行って」が簡潔で自然である。
- source_word: ἐκχέετε
  choice: 注ぎ出しなさい
  rationale: 器の中身を外へ注ぎ尽くす動作を表す語であり、「注ぎ出す」は裁きの比喩と鉢の具体的な像をともに保つ。
- source_word: φιάλας
  choice: 鉢
  rationale: φιάληは浅く広い器を指す。「鉢」は現代日本語でその形状を自然に示し、小瓶という誤解を避ける。
- source_word: θυμοῦ
  choice: 憤り
  rationale: ここでは神の激しく厳粛な怒り、特に裁きにおける怒りを表す。「憤り」は日常的な苛立ちより重い響きを保ちながら、過度な解釈を加えない。
- source_word: εἰς τὴν γῆν
  choice: 地上に
  rationale: ἐκχέωとの組み合わせで、注ぐ対象・到達先としての地を示す。文脈は局地的な土地より世界規模の裁きを描くため、「地上に」とした。
theological_decisions:
- issue: 黙示録の天上の情景におけるναόςの訳
  choice: 聖所
  alternative: 神殿
  rationale: 神殿域全体を指す語と区別し、神の臨在に結び付く中心的な聖なる場所という語義を保った。ただし文脈上「神殿」と理解する余地も脚注に示した。
- issue: θυμός τοῦ θεοῦの訳
  choice: 神の憤り
  alternative: 神の怒り
  rationale: 悪に対する神の裁きという厳粛さと激しさを保ちつつ、本文を越える教理的説明を加えない表現とした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。「御使い」は聖書的文脈で広く理解される表記とし、命令は「行って……注ぎ出しなさい」と自然な連続動作で表した。
