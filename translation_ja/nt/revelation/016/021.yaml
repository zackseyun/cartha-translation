id: REV.16.21
reference: Revelation 16:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: ja
  text: また、一タラントほどの重さの巨大な雹[a]が、天から人々の上に降ってくる。人々は、この雹の災いのために神を冒瀆した。その雹の災いが非常に激しいからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「一タラントほどの」。一タラントは古代の重量単位であり、ギリシア語は厳密な測定値ではなく、おおよその比較を表している。
    reason: 重量表現の概算性と古代単位を説明するため。
  - marker: b
    text: または、「その災いが非常に大きいからである」。
    reason: μεγάλη をより字義的に「大きい」と訳す選択肢を示すため。
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: 巨大な雹
  rationale: 集合的単数である「雹」を保ちつつ、μεγάλη が示す異常な大きさを自然な現代日本語で表した。個々の雹粒を明示する「雹の塊」とはしなかった。
- source_word: ὡς ταλαντιαία
  choice: 一タラントほどの重さの
  rationale: ὡς の比較・概算性と、ταλαντιαία が重量を表すことを明示した。個々の雹がその程度の重さであることは文脈上理解できるため、本文に「一つ一つ」を補わなかった。
- source_word: καταβαίνει
  choice: 降って来る
  rationale: 黙示的叙述の生き生きとした現在形を日本語でも現在形で保ち、雹について自然な動詞を用いた。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 大気としての「空」と神学的な「天」の双方があり得るが、黙示録の裁きの場面にふさわしい「天」を選び、原文の含意を保った。
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: 人々の上に
  rationale: ἄνθρωποι を性別を限定しない「人々」とし、ἐπί の方向・到達点を「上に」で表した。
- source_word: ἐβλασφήμησαν
  choice: 冒瀆した
  rationale: 神に対する βλασφημέω の宗教的・倫理的な重みを簡潔に保つ標準的な訳語を用いた。
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: この雹の災いのために
  rationale: ἐκ を原因として訳し、黙示録で神の裁きを表す πληγή を「災い」とした。「疫病」に限定されない語義を保つ。
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: その災いが非常に激しかったからである
  rationale: μεγάλη と σφόδρα の強意を、災害の深刻さについて自然な日本語となる「非常に激しい」で表した。αὐτῆς は雹を受ける。
theological_decisions:
- issue: οὐρανός の黙示的裁きの文脈での意味
  choice: 天から
  alternative: 空から
  rationale: 現象としては空から降る雹だが、黙示録では裁きが天から下るという神学的・文学的含意もある。「天」は両面を損なわず、過度な解釈も加えない。
- issue: ἄνθρωποι の総称的用法
  choice: 人々
  alternative: 人間たち
  rationale: ここでは男性に限定されない人間一般を指すため、自然で性別を限定しない「人々」とした。
- issue: 人々の冒瀆と災いの因果関係
  choice: 災いのために冒瀆し、後続節を理由の説明として保つ
  alternative: 災いが非常に大きかったので神を冒瀆した、と一文に統合する
  rationale: ἐκ の原因表現と ὅτι 節の説明的な反復を残し、苦痛への反応としての冒瀆という本文の緊張を弱めない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。終止形を用いて黙示的叙述の力強さを保った。「冒瀆」は一般読者にも通用する宗教語として漢字表記し、「災い」は黙示録内の裁きの語彙との一貫性を重視した。
