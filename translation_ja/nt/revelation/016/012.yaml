id: REV.16.12
reference: Revelation 16:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: ja
  text: 第六の者は、自分の鉢を大河ユーフラテス川に注ぎ出した。すると、日の昇る方からの王たち[a]の道が整えられるように、その水は干上がった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より簡潔には「東からの王たち」。直訳は「日の昇る所からの王たち」。
    reason: 原文の東を表す慣用句について、字義的表現と簡潔な意味を示すため。
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: 第六の者
  rationale: 定冠詞付き序数だけが記されているため、文脈上の「御使い」を本文に補わず、省略を保った。
- source_word: ἐξέχεεν
  choice: 注ぎ出した
  rationale: ἐκχέωの動作と、黙示録における鉢の裁きのイメージを自然な日本語で保持する。
- source_word: φιάλην
  choice: 鉢
  rationale: 広く浅い器を指す語であり、黙示録の文脈でも「鉢」が正確かつ定着した表現である。
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: 大河ユーフラテス川の上に
  rationale: ἐπίの方向性と「大河」「ユーフラテス」の同格的な構造を、明瞭な現代日本語で表した。
- source_word: ἐξηράνθη τὸ ὕδωρ αὐτοῦ
  choice: その水は干上がった
  rationale: 受動形が表す出来事と結果を、日本語として自然な自動詞表現で伝える。「その」はユーフラテス川を受ける。
- source_word: ἵνα ἑτοιμασθῇ
  choice: 整えられるためであった
  rationale: ἵναと接続法が示す目的を明示し、受動の形も保持した。
- source_word: ἡ ὁδὸς τῶν βασιλέων
  choice: 王たちの道
  rationale: 属格の結び付きを保ち、「道」が持ち得る文字どおりの意味と象徴的な響きの双方を限定しない。
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: 日の昇る方から来る王たち
  rationale: 「太陽の昇る所から」という原文の鮮明な東方表現を保ちつつ、王たちとの関係が自然に伝わるよう「来る」を補った。
theological_decisions:
- issue: 「第六の者」を御使いと明示するか
  choice: 「第六の者」とし、「御使い」を補わない。
  alternative: 「第六の御使い」
  rationale: 文脈では御使いを指すことが分かるが、この節のギリシア語本文には名詞がないため、省略をそのまま保った。
- issue: ユーフラテスの枯渇と王たちの到来を象徴的に説明するか
  choice: 幻の描写をそのまま訳し、象徴の意味を本文中で説明しない。
  alternative: 侵攻や終末的集結を明示する意訳
  rationale: この節自体はイメージの完全な意味を説明していないため、解釈を訳文に織り込まず、黙示文学的な緊張と多義性を保持した。
translation_notes:
  register: 明瞭で格調のある現代標準語を用いた。「第六の者」で原文の省略を保ち、「日の昇る方」で黙示文学的なイメージを残した。長い一文は、現代日本語で因果と目的を追いやすいよう三文に分けた。
