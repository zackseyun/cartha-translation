  text: καὶ πᾶσα νῆσος ἔφυγεν, καὶ ὄρη οὐχ εὑρέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/020.yaml
  text: And every island fled[a], and mountains were not found.
translation:
  language: ja
  text: そして、すべての島は逃げ去り[a]、山々は見つからなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「消え去り」。ギリシア語は字義どおりには「逃げた」で、島を擬人化した鮮烈な表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα νῆσος
  choice: すべての島
  rationale: 単数名詞に付く πᾶσα の分配的な意味を自然な日本語で表し、一つ一つの島が対象であることを示す。
- source_word: ἔφυγεν
  choice: 逃げ去り
  rationale: φεύγω の基本義である「逃げる」を保ち、黙示文学の鮮烈な擬人表現を伝える。「去り」を添えて、視界から消える文脈上の含みも自然に示す。
- source_word: ὄρη
  choice: 山々
  rationale: 複数形を日本語として自然に表し、個々の山ではなく山という山を指す広がりを保つ。
- source_word: οὐχ εὑρέθησαν
  choice: 見つからなくなった
  rationale: 受動形「見いだされなかった」の意味を自然な現代日本語にし、宇宙的変動の結果として、もはや見つけられない状態になったことを表す。
- source_word: καὶ ... καὶ
  choice: そして、…、…
  rationale: 冒頭の接続を「そして」で保ち、後半は日本語の自然な並列によって、原文の累加的な流れを再現する。
theological_decisions:
- issue: 黙示的な宇宙変動を文字どおりの消滅と解するか、象徴的な崩壊と解するか
  choice: 具体的な像と擬人表現を訳文に残し、解釈を確定しない
  alternative: 「すべての島が消滅し、山々も消えた」と説明的に訳す
  rationale: 原文は島が「逃げた」と描き、山々が「見つからなかった」と述べる。文字どおりか象徴かを訳文で決めず、原文の神学的・黙示的緊張を保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「逃げ去り」により原文の擬人表現を保ち、「見つからなくなった」により直訳調の硬さを避けつつ結果的な消失を過度に説明しない。
