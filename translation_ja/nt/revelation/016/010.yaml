  to: 第五の者が、自分の鉢を獣の王座に注ぎ出した。すると、獣の王国は暗くされ[a]、人々は苦痛のために自分の舌をかみ続けた。
  rationale: 原文の構文と意味を保ちながら、暗闇の描写にある受動的結果を本文に反映した。「王国」によりβασιλείαを明確にし、未完了過去ἐμασῶντοの継続性は「かみ続けた」で維持した。注のアンカーは、代替表現が関わる「暗くされ」に置いた。
