id: REV.16.10
reference: Revelation 16:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: ja
  text: 第五の者が、自分の鉢を獣の王座に注ぎ出した。すると、獣の王国は暗くされ[a]、人々は苦痛のために自分の舌をかみ続けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「闇に包まれた」。
    reason: ἐσκοτωμένηは、暗くされた結果の状態を表す完了受動分詞である。
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: 第五の者
  rationale: 原文は定冠詞付きの序数だけで、「御使い」は文脈上補えるものの明記されていないため、本文では補わない。
- source_word: ἐξέχεεν
  choice: 注ぎ出した
  rationale: 鉢の災いで繰り返される表現に合い、ἐκχέωの動作を自然かつ明確に表す。
- source_word: φιάλην
  choice: 鉢
  rationale: 液体を注ぐ浅い器を指す語であり、黙示録の文脈で定着した、現代日本語として分かりやすい訳語。
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: 獣の王座の上に
  rationale: ἐπί＋対格の方向性を「上に」で示し、θηρίονの黙示文学的イメージを「獣」として保つ。
- source_word: ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη
  choice: 獣の国は暗くなり
  rationale: γίνομαιと完了受動分詞の組み合わせが示す、暗くされた状態への移行を簡潔に表す。αὐτοῦは日本語の「その」では指示対象が曖昧になり得るため、「獣の」と明示した。
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: 自分の舌をかみ続けた
  rationale: 未完了過去形が示す継続的な動作を「続けた」で表す。「舌をかむ」は極度の苦痛による行為として自然な日本語である。
- source_word: ἐκ τοῦ πόνου
  choice: 苦痛のために
  rationale: ἐκが表す原因を、現代日本語で明瞭に示す。
theological_decisions:
- issue: αὐτοῦが指すものと獣の擬人化
  choice: 獣の国
  alternative: その国／彼の国
  rationale: 先行詞θηρίονはギリシア語で中性だが、日本語では所有表現に文法上の性を示す必要がない。「彼の」は擬人化を強め、「その国」は指示が曖昧になり得るため、「獣の国」として関係を明示しつつ解釈を加えない。
- issue: 闇の裁きの表現の強さ
  choice: 暗くなり
  alternative: 暗闇に覆われ
  rationale: 原文は暗くされた状態になったことを述べる。本文では比喩的な強調を加えず簡潔に訳し、より情景的な訳は注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文にない「御使い」は補わず、継続相は「かみ続けた」で示した。句読点を整えて裁きの進行と結果を読み取りやすくした。
