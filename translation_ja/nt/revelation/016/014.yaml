id: REV.16.14
reference: Revelation 16:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: ja
  text: これらは、しるしを行う悪霊的な霊[a]である。それらは全世界[b]の王たちのもとへ出て行き、全能者である神の大いなる日の戦いに彼らを集める――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「悪霊どもの霊」。別訳「悪霊に属する霊」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「人の住む全世界」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: 悪霊どもの霊
  rationale: 属格を過度に解釈せず、「悪霊に由来する霊」「悪霊的な霊」などに限定しない表現とした。日本語ではやや特異な言い回しだが、黙示文学の異様さと原文の構造を保てる。
- source_word: ποιοῦντα σημεῖα
  choice: しるしを行う
  rationale: 超自然的なしるしを指し得るが、その仕組みや真偽を訳文で断定しない。「奇跡を行う」より原語の幅を保つ。
- source_word: ἃ ἐκπορεύεται
  choice: それらは…出て行き
  rationale: 動詞は単数形だが、関係代名詞と先行する複数の「霊」を受ける意味に従い、日本語では複数を指す「それら」とした。
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: 王たちのもとへ
  rationale: 移動を表す文脈で、王たちに向かって行くことを自然に表現した。「王たちに敵対して」とは限定しない。
- source_word: τῆς οἰκουμένης ὅλης
  choice: 全世界
  rationale: 人の住む世界全体、特に人間の支配領域を指す自然な現代日本語。「全地」とすると γῆ との区別が曖昧になり得るため避けた。
- source_word: συναγαγεῖν
  choice: 集める
  rationale: 霊たちが出て行く目的を表す不定詞として、直接的に訳した。
- source_word: εἰς τὸν πόλεμον
  choice: 戦いに
  rationale: 王たちをその決戦へ集めるという方向・目的を簡潔に表した。「戦争」より、ここで想定される特定の戦いに適する。
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: 大いなる日の
  rationale: 「戦い」を限定する属格連鎖を保ちつつ、黙示文学的な荘重さのある自然な日本語とした。
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: 全能者である神の
  rationale: παντοκράτωρを神の称号として訳し、神が全能者であることを明瞭に示した。
theological_decisions:
- issue: 悪霊どもの霊が行う「しるし」の性質
  choice: 実際に行われる欺瞞的なしるしとして述べつつ、その仕組みを特定しない。
  alternative: 単なる手品や見せかけとする、または神の奇跡と同じ意味での超自然的奇跡と明示する。
  rationale: σημεῖαはそのまま「しるし」と訳せる。本文はそれを悪霊どもの霊に帰するが、見せかけなのか超自然的な働きなのかを明示していないため、その緊張を保った。
- issue: πνεύματα δαιμονίων の属格関係
  choice: 「悪霊どもの霊」として属格の曖昧さを残す。
  alternative: 「悪霊的な霊」または「悪霊から出た霊」と解釈して訳す。
  rationale: 原文は性質・所属・由来のいずれか一つを明示的に確定していないため、訳文でも特定の存在論的説明に限定しない。
translation_notes:
  register: 現代の一般読者に理解できる明瞭さを保ちながら、黙示文学にふさわしい荘重さを残した。「しるし」「大いなる日」「全能者」など、聖書的な響きを持ちつつ現代日本語として通じる語を採用した。原文末尾のダッシュも保持し、文が次節へ続く感覚を示した。
