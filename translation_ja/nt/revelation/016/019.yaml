source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: ja
  text: 大いなる都は三つに裂け、諸国の町は倒れた。また、大バビロンは、神がご自分の怒りの激しい憤りのぶどう酒の杯を彼女に与えるために、神の御前に覚えられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「神の御前で思い起こされた」。これは、バビロンが裁きのために神に顧みられることを表す聖書的な言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη
  choice: 大いなる都は三つに裂け
  rationale: 直訳は「大いなる都は三つの部分になった」だが、結果として三分されたことを明瞭で自然な日本語で表した。
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: 諸国の町々
  rationale: ἔθνηはここでは世界的な裁きの文脈にあり、「異邦人」よりも中立的な「諸国」が適切。「町々」により複数形を自然に示した。
- source_word: ἔπεσαν
  choice: 倒れた
  rationale: 「崩壊した」と限定せず、黙示文学の簡潔で力強い比喩を保った。
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: 大バビロン
  rationale: 黙示録で反復される象徴的名称として、簡潔で定着した形を採用した。
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: 神の御前で覚えられた
  rationale: 神の裁きの対象として顧みられたことを示す聖書的慣用表現を、説明的に言い換えず保持した。
- source_word: δοῦναι αὐτῇ
  choice: 神が……彼女に与えるため
  rationale: 不定詞の目的の意味を明示し、文脈上の行為者である神を日本語として自然に補った。女性代名詞は都市バビロンの擬人化を保持する。
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: ぶどう酒の杯
  rationale: 神から割り当てられる裁きを表す聖書的な「杯」の比喩を保った。
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: ご自分の憤りに燃える御怒り
  rationale: θυμόςとὀργήを一語に畳み込まず、「憤り」と「御怒り」で両語を表しつつ、属格の連鎖を理解可能な現代日本語に整えた。
theological_decisions:
- issue: ἐμνήσθη ἐνώπιον τοῦ θεοῦという裁きの慣用表現
  choice: 神の御前で覚えられた
  alternative: 神が裁くために思い起こされた
  rationale: 文脈は裁きを示すが、本文ではその意味を説明に置き換えず、神の「記憶」と裁きとの聖書的な緊張を保持した。
- issue: θυμόςとὀργήの重なり
  choice: 憤りに燃える御怒り
  alternative: 激しい御怒り
  rationale: 二つの関連語による修辞的強調を保つため、自然さを損なわない範囲で別々の日本語を用いた。
- issue: 大いなる都と大バビロンの関係
  choice: 両者を本文で明示的に同一視しない
  alternative: 大いなる都、すなわち大バビロン
  rationale: 本文は両表現を同じ節で用いるが、明示的な同格表現にはしていないため、その解釈上の余地を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学の荘重さと裁きの比喩を保持した。「御前」「御怒り」は神についての尊敬を自然に示す表記。
