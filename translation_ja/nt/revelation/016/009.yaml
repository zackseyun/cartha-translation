id: REV.16.9
reference: Revelation 16:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: ja
  text: 人々は猛烈な熱で焼かれ[a]、これらの災害に対する権威を持つ神の名を冒涜した。そして、悔い改めて神に栄光を帰そうとはしなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「大きな熱で」。
    reason: 「猛烈な熱」はκαῦμα μέγαが表す熱の激しさを自然な日本語にしたものだが、原文により近い表現も示すため。
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: 焼かれ
  rationale: 受動形の意味を保ちつつ、熱によってひどく焼かれるという災害の描写を、自然で簡潔な日本語にした。
- source_word: οἱ ἄνθρωποι
  choice: 人々
  rationale: ここでは男性だけでなく、裁きを受ける人間一般を指すため、包括的な「人々」とした。
- source_word: καῦμα μέγα
  choice: 猛烈な熱で
  rationale: μέγαは熱の大きさより強烈さを表すため、手段を示す対格の働きも含めて「猛烈な熱で」とした。
- source_word: ἐβλασφήμησαν
  choice: 冒瀆した
  rationale: 神の名に対する不敬な言動という宗教的な重みを保つ表現である。
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: 神の名
  rationale: 神の啓示された人格と誉れを表す聖書的な「名」の語法を保持した。
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: これらの災害を支配する権威を持つ
  rationale: 現在分詞ἔχοντοςとἐξουσίαの権威・権能の意味を明示し、神がこれらの災害に権威を持つという本文の主張を保った。
- source_word: πληγὰς
  choice: 災害
  rationale: 黙示録における神の裁きとしての災厄を、現代日本語で理解しやすい「災害」とした。
- source_word: οὐ μετενόησαν
  choice: 悔い改めて…とはしなかった
  rationale: 単なる考え直しではなく、神に向き直る道徳的・霊的な悔い改めを表す。否定を意志的な拒否として自然に表現した。
- source_word: δοῦναι αὐτῷ δόξαν
  choice: 神に栄光を帰そう
  rationale: 悔い改めに伴う目的・内容を示し、聖書で一般的な「栄光を帰す」という礼拝表現を保持した。代名詞は日本語での指示を明確にするため「神」とした。
theological_decisions:
- issue: 男性複数形οἱ ἄνθρωποιの範囲
  choice: 人間一般を指す「人々」
  alternative: 男たち
  rationale: 文脈は男性だけに限定されず、裁きの下にある人間たちを広く指している。
- issue: 災害に対する神の権威
  choice: 神はこれらの災害を支配する権威を持つ
  alternative: 神はこれらの災害に単に関係している
  rationale: 本文はἐξουσίαを明示しており、神の権威を弱めず、同時に本文を越えて説明を加えない。
- issue: 悔い改めと栄光を帰すことの関係
  choice: 「悔い改めて神に栄光を帰す」を一続きの応答として表す
  alternative: 悔い改めなかったことと栄光を帰さなかったことを独立した二行為として表す
  rationale: δοῦναιの不定詞は、悔い改めに伴う目的または内容を示す。両者の厳密な論理関係を過度に限定せず、自然な日本語でつないだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示録の厳粛な調子を保った。「冒瀆」「悔い改め」「栄光を帰す」は本文の宗教的・神学的重みを伝えるため保持した。
