id: REV.16.3
reference: Revelation 16:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: ja
  text: 第二の者が、自分の鉢の中身を海に注ぎ出した。すると海は、死んだ人の血のようになり[a]、海にいるすべての生き物が死んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「死者のような血」。または「死者の血のような血」「死体から出た血のような血」。
    reason: ὡς νεκροῦ は「死者（死んだ人）」との比較を示す簡潔な表現であり、本文では自然な日本語にしつつ、血との比較であることと代替的な表現可能性を注記する。
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: 第二の者
  rationale: 定冠詞付き序数詞を名詞的に訳し、文脈上は第二の御使いを指す一方、原文にない「御使い」を本文へ補わない。
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: その鉢の中身を…注ぎ出した
  rationale: 日本語で鉢そのものを注ぐという不自然さを避け、容器で内容物を表す原文の換喩を明確にした。「鉢」は浅い器を指す φιάλη に適する。
- source_word: εἰς τὴν θάλασσαν
  choice: 海に
  rationale: εἰς の方向性を簡潔で自然な日本語で表す。
- source_word: ἐγένετο αἷμα
  choice: 海は…血となり
  rationale: 直前の「海」を主語として補い、γίνομαι と述語名詞が示す実質的な変化を保つ。
- source_word: αἷμα ὡς νεκροῦ
  choice: 死人の血のような血
  rationale: 省略された「血」を比較句に補い、単数属格 νεκροῦ の「死者に属する血のような」という意味を保つ。
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: すべての生き物
  rationale: 海洋生物を指すセム語的な「命ある魂」を、現代日本語で誤解のない自然な表現にした。
- source_word: ἀπέθανεν τὰ ἐν τῇ θαλάσσῃ
  choice: 海にいる…が死んだ
  rationale: 後置された場所限定を「生き物」に結び付け、原文の意味を自然な日本語の語順で示す。
theological_decisions:
- issue: 災厄の幻が示す変化の性質
  choice: 海が血となったと断定的に訳す。
  alternative: 「血のように見えた」と現象的に訳す。
  rationale: 原文は「血となった」と述べ、その血の性質を「死人の血のような」と比較している。幻として描かれる裁きの厳しさを弱めない。
- issue: 「第二の者」の指示対象
  choice: 原文の省略を保って「第二の者」とする。
  alternative: 文脈を明示して「第二の御使い」とする。
  rationale: 直前の文脈では御使いを指すが、この節自体には名詞がないため、本文では解釈的補足を避ける。
translation_notes:
  register: 明瞭で荘重な現代標準日本語。「第二の者」で原文の省略を保ち、「鉢の中身」で日本語として自然に換喩を展開した。「死人」は黙示文学の厳しい描写に適合しつつ一般読者にも理解しやすい。
