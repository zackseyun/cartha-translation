id: REV.16.7
reference: Revelation 16:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: ja
  text: また私は、祭壇がこう言うのを聞いた[a]。「はい、主よ、神よ、全能者よ。あなたの裁きは真実で、正しい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は祭壇から、こう言うのを聞いた」。ギリシア語は、ヨハネが聞いたものの発生源を示すとも取れるが、「言っている」という分詞を伴うため、祭壇そのものが語るという擬人化として読むのが最も自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: 私は……聞いた
  rationale: アオリスト能動直説法を単純な過去の出来事として表し、意図的に耳を傾けたという含みは加えない。
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: 祭壇がこう言うのを
  rationale: 属格は聞いたものの発生源を示し得るが、λέγοντοςを伴うため、祭壇そのものを話者として描く黙示文学的な擬人化を本文に保持する。
- source_word: Ναί
  choice: しかり
  rationale: 強い肯定と応答の響きを保ちつつ、神への荘重な呼びかけに合う、現代日本語でも理解可能な表現とした。
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: 主よ、全能者である神よ
  rationale: 三つの呼称を省略せず保持する。「全能者」を「神」に同格的に結び付け、自然な日本語の直接呼格にした。
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: 真実で、正しい
  rationale: 神の裁きが真実にかなっており、正義にかなうことを、平明で重みのある日本語で表す。
- source_word: αἱ κρίσεις σου
  choice: あなたの裁き
  rationale: 文脈上の神の司法的な判定と執行を含み得る語義を、限定し過ぎない「裁き」で保持する。
theological_decisions:
- issue: 祭壇の擬人化
  choice: 祭壇そのものが語ると訳す
  alternative: 「祭壇から……言うのを聞いた」と発生源として訳す
  rationale: ギリシア語は祭壇を属格で聞こえたものの源として示し得る一方、分詞「言っている」が祭壇と一致する。本文では鮮明な擬人化を保持し、別解を脚注に示す。
- issue: 神への三重の呼称
  choice: 「主よ、全能者である神よ」
  alternative: 「主なる全能の神よ」
  rationale: κύριε、ὁ θεός、ὁ παντοκράτωρの各要素を明示し、同格関係を保つ。定型表現にまとめて要素間の関係を単純化し過ぎない。
- issue: 神の裁きの性質
  choice: 「真実で、正しい」
  alternative: 「真実で義にかなっている」
  rationale: ἀληθιναίとδίκαιαιをそれぞれ区別して表しつつ、特定の教派的語彙に寄らない自然な現代日本語を用いる。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録の礼拝的・司法的な荘重さを保った。「しかり」は日常語より格調があるが、この短い神への応答では自然で、強い肯定を表す。
