id: REV.16.2
reference: Revelation 16:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: ja
  text: 第一の者が行って、自分の鉢を地に注ぎ出した。すると、獣の刻印を持ち、その像を礼拝する人々に、有害でひどい腫れ物[a]が生じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪く、悲惨な腫れ物」。ギリシア語では二つの強い形容詞（κακόνとπονηρόν）が重ねられ、災いの深刻さが強調されている。
    reason: κακόνとπονηρόνは意味範囲が重なりつつ、腫れ物の有害さ・悲惨さを強調する。日本語では「有害でひどい」のほか、「悪く、悲惨な」などの訳し方も可能である。
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 行って
  rationale: 物語の進行を示すアオリストとして、移動を過度に強調せず自然に表した。
- source_word: ὁ πρῶτος
  choice: 第一の者
  rationale: 定冠詞付き形容詞の名詞的用法を保ち、文脈上補える「御使い」を本文に加えなかった。
- source_word: ἐξέχεεν
  choice: 注ぎ出すと
  rationale: ἐκχέωの「注ぎ出す」という意味を保ち、後続する災いがその結果として生じる自然な日本語の接続にした。
- source_word: φιάλην
  choice: 鉢
  rationale: 液体を入れて注ぐ浅い器を指す語であり、黙示録の文脈でも分かりやすい訳語である。
- source_word: εἰς τὴν γῆν
  choice: 地に
  rationale: εἰςが示す注ぐ方向・対象を簡潔に表した。γῆはこの黙示的文脈で限定的な「土地」とせず「地」とした。
- source_word: ἕλκος
  choice: 腫れ物
  rationale: 潰瘍性のただれやできものを表す語である。「潰瘍」ほど臨床的に限定せず、一般読者に理解しやすい表現を選んだ。
- source_word: κακὸν καὶ πονηρὸν
  choice: 悪性でひどい
  rationale: 二つの強い否定的形容詞による強調を保ちつつ、腫れ物そのものに道徳的な「悪」を帰すような不自然さを避けた。
- source_word: τὸ χάραγμα τοῦ θηρίου
  choice: 獣の刻印
  rationale: χάραγμαが示す刻まれた印を明確に表し、黙示録での重要な反復語句を一貫して理解できる形にした。
- source_word: προσκυνοῦντας
  choice: 礼拝する
  rationale: 像に対する宗教的服従・崇敬を表す文脈なので、単なる敬礼ではなく「礼拝する」とした。
theological_decisions:
- issue: ἕλκοςを修飾するκακὸν καὶ πονηρὸνの二重表現
  choice: 「悪性でひどい腫れ物」と訳し、二語による災いの強調を保持した。
  alternative: 「害を及ぼす重い腫れ物」「悪く苦しい腫れ物」
  rationale: 二つの形容詞は意味範囲が重なり、厳密に別種の性質を指すか、重ねて激しさを強調するかに幅がある。本文では自然な日本語で深刻さを示し、道徳的な悪という解釈には固定しなかった。
- issue: 災いを受ける者の範囲
  choice: 獣の刻印を持ち、その像を礼拝する人々に限定した。
  alternative: 人類全般に及ぶ災いとして一般化する。
  rationale: 二つの分詞句はいずれもτοὺς ἀνθρώπουςを限定しているため、本文が明示する対象を広げなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい簡潔で重みのある調子を保った。「第一の者」は原文の省略を尊重し、「御使い」を補わない。「刻印」「礼拝」は反復される神学的語彙として明確さを優先した。
