id: REV.16.18
reference: Revelation 16:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: ja
  text: すると、稲妻が走り、音[a]と雷鳴が起こった。また、大地震が起こった。人が地上に現れて以来、これほどの地震は起こったことがなかった。それほど大きな地震であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「音」は「声」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: 稲妻が走り
  rationale: 複数形が示す反復的な稲妻を、現代日本語で自然かつ鮮明に表した。
- source_word: φωναὶ
  choice: さまざまな音
  rationale: φωνήには「声」と「音」の両義がある。稲妻と雷鳴に並ぶ文脈では「音」が自然だが、複数形を「さまざまな」で表し、内容を過度に限定しないようにした。
- source_word: βρονταί
  choice: 雷鳴
  rationale: 複数の雷の響きを自然な日本語で表す。日本語では集合的に用いる「雷鳴」が簡潔で荘重である。
- source_word: σεισμὸς
  choice: 地震
  rationale: この文脈における標準的で明瞭な訳語。
- source_word: μέγας
  choice: 大きな／大
  rationale: 最初の「大地震」と末尾の「大きな地震」で、原文の規模の強調を保った。
- source_word: οἷος οὐκ ἐγένετο
  choice: これほどの地震は起こったことがなかった
  rationale: かつてない規模を表す比較構文を、明瞭で自然な日本語にした。
- source_word: ἀφ’ οὗ
  choice: 以来
  rationale: 起点から現在までの時間的範囲を簡潔に表す。
- source_word: ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: 人が地上に現れて
  rationale: ἄνθρωποιは男性だけでなく人類一般を指す。「現れて」はἐγένοντοの「存在するようになる」という含意を自然に伝える。
- source_word: τηλικοῦτος ... οὕτω μέγας
  choice: それほど大きな
  rationale: 原文末尾の重ねた強調を、日本語でも独立文として力強く再現した。
theological_decisions:
- issue: 黙示的な歴史比較における一般的なἄνθρωποι
  choice: 人
  alternative: 人間／人類
  rationale: ここでは男性に限定されず、人類一般を指す。日本語の「人」は包括的で自然であり、原文にない性別限定を持ち込まない。
- issue: φωνήの「声」と「音」の曖昧さ
  choice: 音
  alternative: 声
  rationale: 嵐を思わせる稲妻・雷鳴の列挙では「音」が文脈に適する。ただし、天的な「声」の可能性を教理的に断定して排除するのではなく、語義上の代案として記録した。
translation_notes:
  register: 現代の一般読者に明瞭な標準日本語を用いながら、黙示文学の荘重さと、原文に反復される「起こった」「大きい」という強調を保持した。長いギリシア語文は、迫力と理解しやすさを両立させるため三文に分けた。
