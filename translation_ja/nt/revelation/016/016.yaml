id: REV.16.16
reference: Revelation 16:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ συνήγαγεν αὐτοὺς εἰς τὸν τόπον τὸν καλούμενον Ἑβραϊστὶ Ἁρμαγεδών.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: ja
  text: そして、彼らをヘブライ語でハルマゲドンと呼ばれる場所に集めた[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の動詞は単数形で、「彼が／それが彼らを集めた」と読むことができます。直前の13～14節では、王たちを集めるために汚れた霊どもが出て行くため、意味上「彼らが集めた」と理解することもできます。
    reason: alternative_reading
  - marker: b
    text: または「ヘブライ語またはアラム語で」。黙示録の「ヘブライ語で」は、ヘブライ語とアラム語を厳密に区別するというより、セム語の名の形を指す場合があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγεν
  choice: 彼は……集めた
  rationale: ギリシア語の動詞は三人称単数なので、その文法的形を本文で保持した。主語は明示されておらず、誰を指すかは文脈上なお曖昧である。
- source_word: αὐτοὺς
  choice: 彼らを
  rationale: 対格複数代名詞を自然に訳し、文脈上、集められる王たちを指す。
- source_word: εἰς τὸν τόπον
  choice: 場所に
  rationale: 移動の到達点を表す εἰς と τόπος を、自然な現代日本語で表した。
- source_word: τὸν καλούμενον
  choice: と呼ばれる
  rationale: 受動の分詞を連体修飾として訳し、原文の構造と意味を簡潔に保持した。
- source_word: Ἑβραϊστὶ
  choice: ヘブライ語で
  rationale: 黙示録における通常の訳語を採用した。ただし、より広くヘブライ語・アラム語系のセム語名形を指し得る点は脚注に示した。
- source_word: Ἁρμαγεδών
  choice: ハルマゲドン
  rationale: 日本語聖書で定着した固有名の音写を用いた。語頭の「ハル」は推定されるセム語形とも調和するが、語源自体は本文で断定しない。
theological_decisions:
- issue: 集める主体
  choice: 彼は彼らを……集めた
  alternative: 彼らは彼らを……集めた／それは彼らを……集めた
  rationale: συνήγαγεν は単数形であるため、本文はその形に従った。一方、直前の13–14節では汚れた霊どもが王たちを集めるために出て行くので、複数の霊を意味上の主体と理解する余地がある。主体を特定の存在と断定せず、緊張を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼は」は原文の単数動詞を反映するが、指示対象を補って特定しない。「ハルマゲドン」は日本語で広く定着した表記を採用した。
