    issue: 「第七の者」
    rationale: 日本語の「者」は一般に人を指し、ここでは第七の御使いという文脈上の指示対象を不必要に曖昧かつ不自然にする。ギリシア語では男性形の序数が、直前から明白なἄγγελοςを省略しているため、日本語では「第七の御使い」と補うのが自然で忠実である。
  - severity: low
    issue: 「大きな声がして」
    rationale: ἐξῆλθενは声が聖所・御座から「出た」ことを述べる。「声がして」でも発話自体は伝わるが、出所から出るという動きを弱めるため、「大きな声が出て」とする。
