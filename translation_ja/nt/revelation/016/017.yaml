id: REV.16.17
reference: Revelation 16:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: ja
  text: 第七の御使いが、その鉢を空中に注ぎ出した。すると、聖所[a]から、御座から、大きな声が出て、こう言った。「事は成った。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神殿」。ギリシア語のναόςは、神殿域全体というより、特に聖所を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「完了した」または「事は起こった」。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: 第七の者
  rationale: 原文は定冠詞付きの序数だけで「御使い」を明記していない。日本語として成立させつつ、省略を保つため「者」のみを補った。文脈上は第七の御使いを指す。
- source_word: ἐξέχεεν
  choice: 注ぎ出した
  rationale: ἐκχέωの動作を自然に表し、16章で繰り返される鉢を注ぐ表現にも適する。
- source_word: φιάλην
  choice: 鉢
  rationale: 浅い容器を指す語であり、黙示録の災いの器として現代日本語で明瞭な「鉢」を用いた。
- source_word: ἐπὶ τὸν ἀέρα
  choice: 空中に
  rationale: 方向を伴うἐπί＋対格を、注ぐ動作に合う自然な日本語で表した。
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: 大きな声がした
  rationale: 声がその場所から出たことは後続の起点表現で示されるため、日本語では「声がした」として自然さを保った。μεγάληは音量を表す「大きな」とした。
- source_word: ἐκ τοῦ ναοῦ
  choice: 聖所から
  rationale: ναόςは神殿域全体ではなく、特に聖なる建物・内なる聖所を指すため、「神殿」より限定的な「聖所」を選んだ。
- source_word: ἀπὸ τοῦ θρόνου
  choice: 御座から
  rationale: 原文の二重の起点表現を統合せず、「聖所から、御座から」と並べて保持した。神の座を表す文脈にふさわしく「御座」とした。
- source_word: λέγουσα
  choice: こう言った
  rationale: 女性形分詞はφωνήに一致している。日本語では声を主語とする自然な直接話法にした。
- source_word: Γέγονεν
  choice: 事は成った
  rationale: γίνομαιの完了形が表す、出来事が成立して結果に至ったことを簡潔かつ荘重に示す。「完了した」と断定しすぎず、「起こった」より終局的な響きを保つ。
theological_decisions:
- issue: 天上の神殿描写におけるναός
  choice: 聖所
  alternative: 神殿
  rationale: ναόςとἱερόνの語義上の違いを保ち、原文より広い建築領域を読み込まないため。教理的限定ではなく、語の指示範囲に基づく。
- issue: Γέγονενの完了・結果相と終局性
  choice: 事は成った
  alternative: 完了した／事は起こった
  rationale: 何が成立したかを補わず、出来事の成就とも完了とも取れる簡潔な宣言を保った。「完了した」は終結を明確にし、「起こった」は出来事の発生を前面に出すため、いずれも脚注の代案とした。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、終末的宣言にふさわしい簡潔で荘重な調子を保った。「第七の者」によって原文の省略を維持し、「聖所から、御座から」という重ねた起点も残した。
