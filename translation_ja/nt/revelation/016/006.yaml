  source_fidelity: 原文の因果関係（ὅτι「ので」）、血の反復、被害者としての「聖なる者たちと預言者たち」、および加害者に血を飲ませる応報の宣言を正確に保っている。「血を流した」はἐξέχεαν（字義的には「注ぎ出した」）の自然な日本語訳であり、殺害を指す文脈に適切である。「与えて飲ませました」はδίδωμι＋不定詞の「飲むことを与えた」を日本語として明瞭に表現している。
  naturalness: 全体として明瞭で荘重な現代標準日本語である。「聖なる者たち」「預言者たち」「血を流した」は自然で、短い司法的な調子も維持されている。「彼らはそれに値します」は、直前の裁きを受けているため不自然な道徳的称賛には読まれにくく、注で意味も明示されている。
  terminology: ἅγιοιを「聖なる者たち」とすることで、神に属する民という広い意味を保持し、「聖人」のような後代の制度的含意を避けている。「預言者たち」および「血」は標準的かつ原文に忠実である。
