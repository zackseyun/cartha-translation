id: REV.16.6
reference: Revelation 16:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: ja
  text: 聖なる者たちと預言者たちの血を彼らが流したので、あなたは彼らに血を与えて飲ませました。彼らはそれに値します。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らはそれに値します」とは、この裁きを受けるに値する、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: ので
  rationale: 前節の宣言の理由を示す因果関係を、現代日本語として自然に表す。
- source_word: αἷμα
  choice: 血
  rationale: 二度とも字義どおりに訳し、血を流した者に血を飲ませるという応報の対応を保つ。
- source_word: ἁγίων
  choice: 聖なる者たち
  rationale: 神に属する聖別された民を指す語として訳し、後代の列聖制度に限定される印象を避ける。
- source_word: προφητῶν
  choice: 預言者たち
  rationale: 語の通常の意味をそのまま表し、「聖なる者たち」と並ぶ被害者を示す。
- source_word: ἐξέχεαν
  choice: 流した
  rationale: 日本語では「血を流す」が自然であり、殺害を明確に表す。原語の「注ぎ出す」という像は文脈上認識できるが、「血を注ぎ出す」は現代日本語では不自然になりやすい。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 血を流した加害者たちを指す与格を自然に表す。
- source_word: δέδωκας
  choice: 与えて飲ませました
  rationale: 完了した神の行為を日本語で自然に表す。日本語では完了形を機械的に区別せず、連語として「与えて飲ませる」とする。
- source_word: πιεῖν
  choice: 飲ませました
  rationale: 「飲むために与えた」という使役的な意味関係を簡潔で自然な日本語にする。
- source_word: ἄξιοί εἰσιν
  choice: 彼らはそれに値します
  rationale: ἄξιος の評価的意味を保ちつつ、日本語で必要な補語を「それ」として補う。「ふさわしい」よりも、この裁きに相応するとの厳粛な宣告が明確になる。
theological_decisions:
- issue: 応報的な裁きの表現
  choice: 「あなたは彼らに血を与えて飲ませました。彼らはそれに値します」と直接的に訳す。
  alternative: 「あなたは彼らに報いを与えました。彼らは罰を受けて当然です」
  rationale: 原文の血の反復と比例的な裁きの厳しさを弱めず、一般化した罰の表現へ置き換えない。
- issue: ἁγίων の指示対象
  choice: 「聖なる者たち」
  alternative: 「聖徒たち」
  rationale: 黙示録における神の民という広い聖書的意味を保ち、特定の教会制度や列聖された人物だけを連想させない。
- issue: 「彼らはそれに値します」の評価内容
  choice: 受けている裁きに値するという意味に取る。
  alternative: 彼ら自身が尊敬に値するという意味に取る。
  rationale: 直前の「血を与えて飲ませた」を受ける文脈により、道徳的称賛ではなく裁きに値するとの宣告である。
translation_notes:
  register: 明瞭で荘重な現代標準日本語。神への二人称は文脈に沿って「あなた」とし、殉教者を「聖なる者たち」と表した。原文の短く厳しい司法的調子を保った。
