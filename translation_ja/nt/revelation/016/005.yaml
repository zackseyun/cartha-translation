  terminology: 「御使い」「聖なる方」「裁かれた」は本文の宗教的文脈に適した一貫した用語である。「正しい方」はδίκαιοςの道徳的・司法的な広がりを保ち、「公正です」を代案として示す脚注も妥当である。
