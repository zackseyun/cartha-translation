  source_fidelity: SBLGNT本文を適切に反映している。「水の御使い」はτοῦ ἀγγέλου τῶν ὑδάτωνの属格表現を保持し、「今おられ、かつておられた方、聖なる方」はὁ ὢν καὶ ὁ ἦν, ὁ ὅσιοςを、未来要素を補わずに訳している。Δίκαιος、ὅτι、ταῦτα、ἔκριναςも、それぞれ「正しい方」「からです」「これらのこと」「裁かれた」として意味を損なっていない。
