id: REV.16.5
reference: Revelation 16:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: ja
  text: 'また私は、水の御使い[c]がこう言うのを聞いた。

    「今おられ、かつておられた方、聖なる方[a]、あなたは正しい方です[b]。あなたがこれらのことを裁かれたからです。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は、「今おられ、かつておられ、やがて来られる方」のような、より長い称号を記している。黙示録の他の箇所にある類似表現に合わせられた可能性がある。ここでは、「今おられ、かつておられた方、聖なる方」と読む本文に従った。
    reason: textual_variant
  - marker: b
    text: または「あなたは公正です」。
    reason: lexical_alternative
  - marker: c
    text: または「水をつかさどる御使い」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: 水の御使い
  rationale: 属格をまず字義どおりに保ち、御使いが水と結びついた存在であることを示した。文脈上は水を管轄する意味とも取れるため、その解釈は脚注に示した。
- source_word: Δίκαιος
  choice: 正しい方
  rationale: 神の裁きに表れる道徳的・司法的な正しさを広く表せる自然な日本語とした。「公正」も可能だが、意味を司法面だけに狭めない表現を本文に採った。
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: 今おられ、かつておられた方
  rationale: 黙示録に特徴的な神の称号を明確な現代日本語で再現した。冠詞を伴う実詞的表現を「方」で示し、現在と過去の対照を保った。
- source_word: ὁ ὅσιος
  choice: 聖なる方
  rationale: ὅσιοςが表す道徳的・契約的な聖さを、頌栄的文脈にふさわしい称号として訳した。
- source_word: ὅτι
  choice: からです
  rationale: 神が正しいと宣言される理由を導く因果関係を、自然で明瞭な現代日本語にした。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前の災いと裁きを指すが、ギリシア語は「裁き」と明示せず指示代名詞だけを用いるため、その簡潔さと指示範囲を保った。
- source_word: ἔκρινας
  choice: 裁かれた
  rationale: 完了した裁きの行為を日本語の過去形で表し、神に対する敬意を補助動詞「れる」で示した。
theological_decisions:
- issue: 神の称号に通常期待される未来の要素がないこと
  choice: 今おられ、かつておられた方、聖なる方
  alternative: 今おられ、かつておられ、やがて来られる方
  rationale: SBLGNTの本文は「今おられ、かつておられた方、聖なる方」に当たる語句を読み、黙示録の他の箇所にある「やがて来られる方」を含まない。よく知られた定型句に調和させず、印刷本文の緊張を保った。
- issue: ὁ ὅσιοςの統語上の位置づけ
  choice: 「聖なる方」を神への呼びかけ・称号として「今おられ、かつておられた方」と並べる
  alternative: 「今おられ、かつておられる聖なる方」と一続きの修飾表現にする
  rationale: ギリシア語の反復される冠詞と同格的な構造を尊重し、二つの称号の並置が見える訳にした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、天上の宣言にふさわしい荘重さを保った。「御使い」「聖なる方」「裁かれた」は聖書本文として自然な敬意を示すが、古語的な語尾や過度に教会的な専門語は避けた。
