id: REV.16.13
reference: Revelation 16:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: ja
  text: また私は、竜の口から、獣の口から、偽預言者の口から、蛙のような三つの汚れた霊が出て来るのを見た。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「また私は、竜の口から、獣の口から、偽預言者の口から出る、蛙のような三つの汚れた霊を見た」。ギリシア語では、三度繰り返される「…の口から」が「三つの汚れた霊」より先に置かれている。
    reason: 原文の語順と修飾関係に関する別訳を示すため。
lexical_decisions:
- source_word: εἶδον
  choice: 私は…見た
  rationale: 幻の叙述におけるアオリストを、自然な過去の表現で訳した。
- source_word: ἐκ ... τοῦ στόματος
  choice: …の口から…出て来る
  rationale: ἐκが示す起点を「口から」で保ち、日本語として動きが明確になるよう、文脈上含意される「出て来る」を補った。反復された三つの起点も保持した。
- source_word: δράκοντος
  choice: 竜
  rationale: 黙示録における象徴的な形象を、そのまま明瞭に表す標準的な訳語。
- source_word: θηρίου
  choice: 獣
  rationale: 黙示録の象徴表現を弱めずに保つ、確立した訳語。
- source_word: ψευδοπροφήτου
  choice: 偽預言者
  rationale: 複合語の意味を簡潔に伝え、文脈上の呼称としての性格も保つ。
- source_word: πνεύματα
  choice: 霊
  rationale: ここでは風や心的傾向ではなく霊的存在を指すため、「霊」とした。
- source_word: τρία ἀκάθαρτα
  choice: 三つの汚れた
  rationale: 数と形容を自然な日本語の語順にしつつ、ἀκάθαρταの宗教的・霊的な「汚れ」の含みを保った。
- source_word: ὡς βάτραχοι
  choice: 蛙のような
  rationale: ὡςが示す同一性ではなく類似・比較を明確に表した。
theological_decisions:
- issue: 黙示的比喩における πνεύματα ἀκάθαρτα の性質
  choice: 「蛙のような三つの汚れた霊」と訳し、比喩を説明的に展開しない。
  alternative: 「蛙に似た三つの悪霊」
  rationale: 次節ではその性質がさらに明らかになるが、本節自体の語句は「汚れた霊」である。そこで「悪霊」と先取りせず、本文の緊張と文脈による解釈を保った。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「また私は」で幻の連続性を表し、「竜」「獣」「偽預言者」という黙示録の象徴的呼称を簡潔に保持した。
