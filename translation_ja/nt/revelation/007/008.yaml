  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: ja
  text: ゼブルン族から一万二千人、ヨセフ族から一万二千人、ベニヤミン族から一万二千人――印を押された者たちである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「印を押された者たち」は、直訳すれば「印を押されている者たち」とも表せる。ギリシア語では完了受動分詞が列挙の末尾に置かれ、ここに挙げられた各群をまとめて説明している。
    reason: 完了受動分詞の結果状態と、列挙全体を総括する統語上の働きを正確に示すため。
lexical_decisions:
- source_word: ἐκ φυλῆς
  choice: ～族から
  rationale: 出所を示すἐκと、イスラエルの部族を指すφυλήを、反復される列挙の形を保ちながら自然な現代日本語で表した。
- source_word: Ζαβουλών
  choice: ゼブルン
  rationale: 日本語の聖書名として定着した表記を用いた。
- source_word: δώδεκα χιλιάδες
  choice: 一万二千人
  rationale: 数をそのまま保ち、文脈上数えられている人々であることを「人」で明示した。
- source_word: Ἰωσήφ
  choice: ヨセフ
  rationale: 本文はエフライムやマナセではなくヨセフと明記しているため、その名称を保った。
- source_word: Βενιαμίν
  choice: ベニヤミン
  rationale: 日本語の聖書名として定着した表記を用いた。
- source_word: ἐσφραγισμένοι
  choice: 印を押された者たち
  rationale: 完了受動分詞の受動性と、印を受けた結果的状態を表しつつ、黙示録7章の額に印を押す文脈に自然に合う表現とした。
theological_decisions:
- issue: 節末の分詞ἐσφραγισμένοιの係り方
  choice: 列挙の末尾に置き、三つの部族から数えられた人々をまとめて「印を押された者たち」と述べる。
  alternative: 各項目に「印を押された」を補う、または冒頭へ移して「印を押された者は」とする。
  rationale: ギリシア語の語順と列挙後の総括的効果を保ち、印の性質や時点について本文以上の解釈を加えないため。
