id: REV.7.9
reference: Revelation 7:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: ja
  text: この後、私は見た。すると、見よ、だれにも数えることのできない大群衆がいた。彼らは、あらゆる国、諸部族、諸民族、諸言語から来た者たちで、御座の前、そして小羊の前に立っており、白い長衣をまとい、手になつめやしの枝を持っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: この後
  rationale: 複数形の指示語を含む表現だが、日本語では「これらのことの後」よりも「この後」が自然で、黙示録の幻の展開順序も明確に示せる。
- source_word: εἶδον, καὶ ἰδοὺ
  choice: 私は見た。すると、見よ
  rationale: εἶδονを直接的に「見た」とし、ἰδούは読者の注意を促す標識として「見よ」と明示した。文を分けることで日本語としての視認性を保った。
- source_word: ὄχλος πολύς
  choice: 大群衆
  rationale: 非常に多くの人々から成る集団を簡潔に表し、黙示文学の荘重さにも合う。
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: だれにも数えることのできない
  rationale: 数える能力を持つ者が一人もいないという原文の強調を、自然な日本語の連体修飾で表した。
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: あらゆる国、また諸部族、諸民族、諸言語の中から来た者たちで[a]
  rationale: ἐκの出所を「中から来た者たち」と明示し、単数形ἔθνουςと、それに続く複数形の三語の違いを「あらゆる国」と「諸―」で可能な限り反映した。日本語での自然さを保つため、接続詞の連続は整理した。
- source_word: ἑστῶτες
  choice: 立ち
  rationale: 群衆が御座と小羊の前に立っている情景を簡潔に表した。
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: 御座の前、そして小羊の前
  rationale: ἐνώπιονの反復を「前」の反復で保ち、二つの対象を明瞭に示した。θρόνοςは黙示録の神的王権の文脈に合う慣用的な「御座」とした。
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: 白い長衣をまとい
  rationale: στολήが通常の衣服より長い衣を指すことを「長衣」で示し、περιβάλλωの完了分詞が描く着衣状態を「まとい」と自然に表した。
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: 手になつめやしの枝を持っていた
  rationale: φοῖνιξがここでは木そのものではなく、その枝を指すことを明示し、手にあるという情景を自然な日本語で表した。
theological_decisions:
- issue: キリスト論的称号としてのἀρνίον
  choice: 小羊
  alternative: 子羊
  rationale: 黙示録でキリストを指す一貫した称号として認識できる伝統的表記を採用した。語形上の指小的要素を過度に強調せず、称号としての重みを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、幻の場面にふさわしい荘重さを「見よ」「御座」「小羊」などで保った。原文の長い一文は、日本語で理解しやすいよう二文に分けたが、描写の順序と反復はできる限り維持した。
