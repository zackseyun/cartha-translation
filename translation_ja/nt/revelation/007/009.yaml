  to: この後、私は見た。すると、見よ、だれにも数えることのできない大群衆がいた。彼らは、あらゆる国、諸部族、諸民族、諸言語から来た者たちで、御座の前、そして小羊の前に立っており、白い長衣をまとい、手になつめやしの枝を持っていた。
  rationale: 出自を示す「から」を四つの並列項の後に置き、原文のἐκが列挙全体を支配する関係を明瞭にした。群衆の姿を表す分詞的な描写も、日本語として一貫した同時的状態の叙述に整えた。原語の数の違いを日本語本文が厳密に反映するとの脚注は、実際の日本語の表現と一致しないため削除した。意味、場面の順序、キリスト論的称号を変更していない。
