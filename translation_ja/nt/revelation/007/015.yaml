id: REV.7.15
reference: Revelation 7:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: ja
  text: だからこそ、彼らは神の御座の前にいて、その神殿で昼も夜も神に仕えている。そして、御座に着いておられる方が、彼らの上に幕屋を張られる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの上に住まわれる」または「彼らを覆い守られる」。ギリシア語の動詞には、「天幕」または「幕屋」に由来するイメージがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: だからこそ
  rationale: 直前の説明を受ける因果・推論関係を明示しつつ、現代日本語として自然に表す。
- source_word: ἐνώπιον τοῦ θρόνου τοῦ θεοῦ
  choice: 神の御座の前に
  rationale: 空間的な位置と神の臨在のもとにあることの両方を、簡潔に保つ。
- source_word: λατρεύουσιν αὐτῷ
  choice: 神に仕えている
  rationale: 神にささげる礼拝的・祭儀的奉仕を表す語であり、「礼拝する」だけに狭めず、神殿という文脈にその宗教的含意を担わせる。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼も夜も
  rationale: 絶え間ない奉仕を示す原文の対句的表現を、自然な日本語で保持する。
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: 神の神殿で
  rationale: ναόςの聖所・神殿の意味を一般読者に明瞭な語で表し、所有者を代名詞ではなく「神」として明確にする。
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: 御座に着いておられる方
  rationale: 継続的な着座と称号的な響きを保ちつつ、敬意ある自然な現代日本語にする。
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: 彼らの上に幕屋を張られる
  rationale: σκηνόωの天幕・幕屋の比喩とἐπίの「上に」を保持し、神の守りと臨在を暗示しつつ解釈だけに置き換えない。
theological_decisions:
- issue: σκηνώσειが示す神の臨在と保護のイメージ
  choice: 彼らの上に幕屋を張られる
  alternative: 彼らの上に住まわれる／彼らを覆い守られる
  rationale: 幕屋に結びつく契約的な神の臨在という比喩を残しながら、単なる居住または抽象的な保護へ意味を平板化しない。原文の比喩が持つ曖昧さも脚注で示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御座」「幕屋」は黙示録の聖書的イメージを保つため採用し、敬語は神を指す表現に限定した。
