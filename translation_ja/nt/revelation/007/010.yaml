id: REV.7.10
reference: Revelation 7:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: ja
  text: そして彼らは大声で叫んでいる。「救いは、御座に着いておられる私たちの神と子羊のものです！」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「救いは、御座に着いておられる私たちの神と子羊に。」
    reason: ギリシア語は動詞のない歓呼であり、与格句による帰属・賛美の表現をより字義的に示すため。
lexical_decisions:
- source_word: κράζουσι
  choice: 叫んだ
  rationale: 歴史的現在形が描く生き生きとした場面を、現代日本語の物語として自然な過去形で表した。「叫ぶ」により強い発声を保っている。
- source_word: φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 方法・様態を示す与格句を、明瞭で自然な現代日本語の副詞句にした。
- source_word: λέγοντες
  choice: （直接話法で表現）
  rationale: 叫びの内容を導く分詞は、日本語では引用符を用いた直接話法によって自然に表せるため、「言って」を重ねなかった。
- source_word: Ἡ σωτηρία
  choice: 救いは……のものです
  rationale: 動詞のない歓呼と帰属・帰因の与格を、自然な日本語で表現した。「勝利」と限定せず、σωτηρίαの広い意味を保った。
- source_word: τῷ θεῷ ἡμῶν
  choice: 私たちの神……のものです
  rationale: 救いが帰属する方を示す与格として訳し、後続の子羊と並列であることを保った。
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: 御座に着いておられる
  rationale: 神を指す冠詞付き分詞句を敬意ある現代日本語で表し、玉座の統治的イメージを保った。
- source_word: τῷ ἀρνίῳ
  choice: 子羊
  rationale: 黙示録でイエスを指す確立した称号として、犠牲とメシアのイメージを保持した。
theological_decisions:
- issue: 「救い」と神および子羊との関係
  choice: 「救いは、……私たちの神と、子羊のものです」と、両者に共同で帰属させる歓呼として訳した。
  alternative: 「救いが、……私たちの神と、子羊にあるように」と祈願的に訳す。
  rationale: ギリシア語の動詞のない句は形の上では曖昧さを含むが、ここでは与格を帰属・帰因として理解するのが文脈に適する。神と子羊の関係について本文以上の教理的説明は加えていない。
translation_notes:
  register: 明瞭で格調ある現代標準語。群衆の力強い歓呼を「大声で叫んだ」で示し、神については「おられる」を用いて敬意を表した。脚注記号[a]は本文中に配置した。
