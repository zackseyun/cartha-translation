  source_fidelity: 原文の否定の連鎖（οὐ…οὐδέ…οὐδὲ μή）を、「もはや…ない」「決して…ない」により適切に表している。πεινάσουσιν／διψήσουσινの並行、ἥλιοςとπᾶν καῦμαの具体的な像、ならびにοὐδὲ μήによる強い将来否定が保たれている。「降りかかる」はπέσῃ ἐπ’ αὐτούςの像を自然な日本語で反映する。
  naturalness: 明快で格調を保つ現代標準日本語である。「彼らはもはや飢えることもなく、渇くこともない。太陽も、どんな灼熱も、決して彼らに降りかからない」は自然で、後半の並列と強調も理解しやすい。
  terminology: 「飢える」「渇く」「太陽」「灼熱」はいずれも文脈に適切である。終末的慰めの具体像を保ち、特定の教義的・比喩的解釈を訳文に持ち込んでいない。脚注は「降りかかる」と、文脈上可能な「照りつける／襲う」の訳し分け、および強い否定を説明しており、アンカー位置も後半句全体に適切に対応する。
