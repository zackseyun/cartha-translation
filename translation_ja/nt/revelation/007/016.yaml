id: REV.7.16
reference: Revelation 7:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ πεινάσουσιν ἔτι ⸀οὐδὲ διψήσουσιν ἔτι, οὐδὲ μὴ πέσῃ ἐπ’ αὐτοὺς ὁ ἥλιος οὐδὲ πᾶν καῦμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/016.yaml
  text: They will hunger no more[a], nor thirst anymore; the sun will not strike them, nor any scorching heat.
translation:
  language: ja
  text: 彼らはもはや飢えることもなく、渇くこともない。太陽も、どんな灼熱も、決して彼らに降りかからない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「太陽も決して彼らを照りつけず、どんな灼熱も彼らを襲わない」とも訳せる。ギリシア語は強い否定を用いている。
    reason: πέσῃ ἐπ’ αὐτούςの直訳的な「降りかかる」と、文脈に即した「照りつける／襲う」という訳の可能性、および否定の強さを示すため。
lexical_decisions:
- source_word: πεινάσουσιν
  choice: 飢える
  rationale: 未来形の動詞をそのまま動詞として訳し、続く「渇く」との並行を保った。
- source_word: ἔτι
  choice: もはや〜ない
  rationale: 否定文の中で、以後その状態がなくなることを自然な現代日本語で表す。二つの動詞にかかる語として簡潔に訳した。
- source_word: διψήσουσιν
  choice: 渇く
  rationale: 動詞として訳し、「飢える」との簡潔な並行関係を保った。
- source_word: οὐδὲ μὴ πέσῃ ἐπ’ αὐτούς
  choice: 決して彼らに降りかからない
  rationale: οὐδὲ μήによる強い未来否定を「決して〜ない」で示し、πέσῃの「落ちる、降りかかる」という像も保持した。
- source_word: ὁ ἥλιος
  choice: 太陽
  rationale: 基本的な語義を直接訳した。
- source_word: πᾶν καῦμα
  choice: どんな灼熱も
  rationale: πᾶνの包括性を「どんな〜も」で、καῦμαの焼けつくような熱を「灼熱」で表した。
theological_decisions:
- issue: イザヤ49章10節を想起させる終末的回復の表現
  choice: 飢え、渇き、太陽、灼熱という具体的な像を保持する
  alternative: 飢えと渇きを主として霊的な切望の比喩として訳出する
  rationale: 本文は具体的な苦難の像によって慰めを告げている。比喩か字義かを訳文で限定せず、イザヤ書との響きと神学的な広がりを残した。
- issue: οὐδὲ μὴ πέσῃ の否定の強さ
  choice: 「決して〜ない」と訳す
  alternative: 単に「〜ない」と訳す
  rationale: μήを伴う構文の強い未来否定を日本語でも明示する一方、どの種類の災厄を指すかは本文以上に限定しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「もはや」と「決して」によって終末的な約束の確実さを示しつつ、原文の四つの具体的な苦難の像を残した。脚注記号[a]は本文末に置き、太陽と灼熱を含む後半句全体の訳語上の選択肢を示した。
