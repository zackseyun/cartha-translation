id: REV.7.11
reference: Revelation 7:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: ja
  text: すべての御使いたちは、御座と長老たちと四つの生き物[a]の周りに立っていた。そして御座の前にひれ伏し、顔を伏せて神を礼拝した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「四つの生けるもの」。
    reason: ζῷαには「生命ある存在」という意味があり、日本語では「生けるもの」とも訳せるため。
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: すべての御使いたち
  rationale: πάντεςを明示し、ἄγγελοιには聖書文脈で広く理解される「御使い」を用いた。
- source_word: εἱστήκεισαν
  choice: 立っていた
  rationale: 完了過去形の状態的な意味を、継続する姿勢として自然な日本語で表した。
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων
  choice: 御座と長老たちと四つの生き物の周りに
  rationale: κύκλῳと属格の空間関係を保ち、三者全体を取り囲む配置として原文の統語をそのまま反映した。
- source_word: τῶν πρεσβυτέρων
  choice: 長老たち
  rationale: 黙示録に登場する特定の天上の集団を指す慣用的で明瞭な訳語。
- source_word: τῶν τεσσάρων ζῴων
  choice: 四つの生き物
  rationale: ζῷαの生命ある存在という意味を保ちつつ、「獣」や「動物」が招く不適切な連想を避けた。
- source_word: ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: 御座の前にひれ伏し、顔を地につけて
  rationale: 直訳的な「顔の上に倒れた」では不自然なため、全身を伏せる動作を明瞭な現代日本語で表した。「地」は姿勢を自然に示す補足である。
- source_word: προσεκύνησαν τῷ θεῷ
  choice: 神を礼拝した
  rationale: 対象が神であり、身体的な平伏は直前にすでに述べられているため、προσκυνέωの礼拝としての意味を採った。
theological_decisions:
- issue: ζῷαで表される御座の周囲の存在
  choice: 生き物
  alternative: 生きているもの／生きた存在
  rationale: これらを単なる動物とも、特定の種類の天上存在とも断定せず、原語の描写的な幅を保った。
- issue: 神を対象とするπροσκυνέωの意味
  choice: 神を礼拝した
  alternative: 神の前にひれ伏した
  rationale: 前節ですでに身体的平伏が明示されており、ここでは神への崇敬・礼拝の意味が中心となるため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御座」「御使い」は黙示録の天上場面に適した聖書語として保持し、文を二つに分けて動作の推移を読みやすくした。
