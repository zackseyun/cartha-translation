  text: ἐκ φυλῆς Ἰούδα δώδεκα χιλιάδες ⸀ἐσφραγισμένοι, ἐκ φυλῆς Ῥουβὴν δώδεκα χιλιάδες, ἐκ φυλῆς Γὰδ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: ja
  text: ユダ族から一万二千人が封印された。ルベン族から一万二千人、ガド族から一万二千人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ φυλῆς
  choice: …族から
  rationale: ἐκは出所・所属母体を示し、φυλήはイスラエルの系図的区分では「部族」を意味する。日本語では固有名と結んだ「ユダ族から」が自然で、反復される列挙形式も保てる。
- source_word: Ἰούδα
  choice: ユダ
  rationale: 日本語聖書で定着した名称を用いた。
- source_word: δώδεκα χιλιάδες
  choice: 一万二千人
  rationale: 数を直接訳し、数えられている対象が人であることを自然な日本語として「人」で明示した。
- source_word: ἐσφραγισμένοι
  choice: 封印された
  rationale: 受動完了分詞の状態・結果を、日本語で自然な受動表現として示した。第一の部族の人数に付されているが、並行する後続の列挙にも文脈上及ぶ。
- source_word: Ῥουβὴν
  choice: ルベン
  rationale: 日本語聖書で定着した名称を用いた。
- source_word: Γὰδ
  choice: ガド
  rationale: 日本語聖書で定着した名称を用いた。
theological_decisions:
- issue: 部族列挙におけるἐσφραγισμένοιの統語的な力と範囲
  choice: 第一節だけを「一万二千人が封印された」と明示し、後続の部族では動詞を省略する。
  alternative: 「ユダ族から、封印された一万二千人」と分詞的に訳す、または各部族の後で「封印された」を繰り返す。
  rationale: ギリシア語では受動分詞が最初の人数の後に置かれ、列挙される人々を説明している。日本語では最初の句を述語のある文にすると明瞭であり、後続句の省略を保つことで、原文の並行的な列挙を過度に補わずに表せる。
translation_notes:
  register: 明晰で現代的かつ荘重な標準日本語。部族名の反復と簡潔な列挙のリズムを保ち、原文にない解釈的説明は加えていない。
