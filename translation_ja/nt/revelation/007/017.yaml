id: REV.7.17
reference: Revelation 7:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: ja
  text: なぜなら、御座のただ中にいる小羊[a]が、羊飼いとして彼らを養い、命の水の泉[c]へ彼らを導く[b]からである。そして神は、彼らの目から涙をことごとくぬぐい去る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「御座の中央にいる小羊」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らを連れて行く」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「生ける水の泉へ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: 小羊
  rationale: 黙示録でキリストを指す一貫した称号として「小羊」を用い、犠牲とメシア的な響きを保った。
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: 御座のただ中におられる
  rationale: 御座との中心的な位置関係を表すギリシア語の空間的イメージを保ちつつ、日本語として自然な形にした。
- source_word: ποιμανεῖ
  choice: 彼らの羊飼いとなり
  rationale: 「羊飼いとして世話をする」という動詞の意味を自然な現代日本語で表し、小羊が羊飼いとなる意図的な逆説も保持した。
- source_word: ὁδηγήσει
  choice: 導かれる
  rationale: 目的地へ連れて行き案内する意味を表し、羊飼いの比喩とも調和する。敬意を示す主語敬語は、文脈上キリストを指すことによる。
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: 命の水の泉へ
  rationale: ζωῆςを水に係る属格と理解し、「命の水」が湧く泉という構造を簡潔に保った。ἐπίは移動の到達点として「へ」とした。
- source_word: ἐξαλείψει
  choice: ぬぐい去ってくださる
  rationale: 慰めの文脈に即して、涙を完全に取り除く動作を自然に表した。神の恵み深い行為を日本語の授受表現で示した。
- source_word: πᾶν δάκρυον
  choice: 涙をことごとく
  rationale: 単数形を不自然に直訳せず、一つ残らず取り去るというπᾶνの全体性を保持した。
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: 彼らの目から
  rationale: 起点を表すἐκと身体的なイメージを自然な日本語で再現した。
theological_decisions:
- issue: 小羊が羊飼いとなるキリスト論的逆説
  choice: 「小羊が、彼らの羊飼いとなり」として明示した
  alternative: 「小羊が彼らを治める」または「養う」
  rationale: ποιμαίνωの牧者的意味と、小羊自身が羊飼いになるという黙示録特有の逆説を保つため。後続する水への導きも牧者的理解を支持する。
- issue: 最後の節における神と小羊の関係
  choice: 「そして神は」と明示し、最後の動作の主語を神とした
  alternative: 小羊を暗黙の主語として文を続ける
  rationale: ギリシア語はὁ θεόςをἐξαλείψειの明示的な主語としているため、幻の中での両者の区別を崩さない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「御座」「小羊」など黙示文学の定着した荘重な語彙を保持した。「牧する」のような硬い教会語は避け、「羊飼いとなり」として一般読者にも像が伝わるようにした。
