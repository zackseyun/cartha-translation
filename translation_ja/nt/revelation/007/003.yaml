id: REV.7.3
reference: Revelation 7:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων· Μὴ ἀδικήσητε τὴν γῆν μήτε τὴν θάλασσαν μήτε τὰ δένδρα, ⸀ἄχρι σφραγίσωμεν τοὺς δούλους τοῦ θεοῦ ἡμῶν ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: ja
  text: こう言った。「私たちの神の奴隷たち[a]の額に、私たちが印を押すまでは、地にも海にも木々にも害を加えてはならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「しもべたち」「仕える者たち」。ギリシア語は、主人に属する者を指す語。ここではその強い意味を保つため「奴隷たち」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: こう言った
  rationale: 分詞を日本語で自然な叙述につなぐため、発話を導く表現とした。
- source_word: ἀδικήσητε
  choice: 害を加えてはならない
  rationale: 対象が地、海、木々であるため、道徳的不正ではなく物理的な損害を表す文脈上の意味を採った。
- source_word: τὴν γῆν
  choice: 地
  rationale: 海や木々と並ぶ被造世界の領域を指す。日本語では黙示的な列挙に合う簡潔な「地」とした。
- source_word: τὴν θάλασσαν
  choice: 海
  rationale: 原語の通常の意味を自然に表す。
- source_word: τὰ δένδρα
  choice: 木々
  rationale: 複数であることを自然な現代日本語で示した。
- source_word: ἄχρι
  choice: までは
  rationale: 害を加えることへの禁止が、印を押す出来事まで続くという時間的限界を示す。
- source_word: σφραγίσωμεν
  choice: 私たちが印を押す
  rationale: 封印によって所属・保護を示す行為を表す。「封印する」よりも、額にしるしを付ける具体的動作が普通の読者に伝わりやすい。完了が後続の「までは」によって示される。
- source_word: τοὺς δούλους
  choice: 奴隷たち
  rationale: 主人に属する者という δοῦλος の強い意味を保持する。現代日本語でより穏当な「しもべ」も可能なため脚注に示した。
- source_word: τοῦ θεοῦ ἡμῶν
  choice: 私たちの神の
  rationale: 話者を含む「私たち」を保持し、神への所属を表す属格につないだ。
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: 彼らの額に
  rationale: 印が付けられる場所を自然で明確な日本語にした。ただし本文では先行名詞との重複を避け「奴隷たちの額に」と統合した。
theological_decisions:
- issue: 黙示的な所属の文脈における δοῦλος の訳語
  choice: 奴隷たち
  alternative: しもべたち／仕える者たち
  rationale: 神の所有と忠誠が印によって示される場面なので、原語が持つ主人への隷属・所属の強さを本文に残した。一方、「奴隷」は現代日本語で歴史的・社会的含意が強いため、伝統的で文脈上可能な訳を脚注に併記した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、黙示文学にふさわしい簡潔で厳粛な調子を保った。「地、海、木々」の列挙と、命令の時間的制限が明瞭に伝わる語順とした。
