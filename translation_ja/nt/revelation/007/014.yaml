id: REV.7.14
reference: Revelation 7:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: ja
  text: 私は彼に言った。「主よ、あなたがご存じです。」すると彼は私に言った。「この人たちは、大きな苦難[a]から出て来る人たちです。彼らは自分たちの長い衣を洗い、子羊の血で白くした[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大きな患難」または「大きな苦しみ」とも訳せる。ギリシア語は、圧迫、苦悩、苦難を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「子羊の血の中で白くした」。ここで「で」と訳したギリシア語は、手段（「血によって」）を表すとも理解できるが、原文には血の中で衣が白くされるという逆説的な清めのイメージがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: 私は彼に言った
  rationale: 完了形だが、ヨハネ文書の物語的な対話導入として、現代日本語で自然な過去の発話として訳した。
- source_word: Κύριέ μου
  choice: わが主よ
  rationale: 話しかけられているのは天上の長老であり、神またはキリストと明示されてはいない。「わが主よ」は敬意ある呼びかけを保ちつつ、文脈上の相手を勝手に神格化しない。
- source_word: σὺ οἶδας
  choice: あなたがご存じです
  rationale: 明示された代名詞σὺの緩やかな強調と、長老の知識を認める丁重な応答を「あなたが」と敬語で表した。
- source_word: οἱ ἐρχόμενοι
  choice: 出て来る者たち
  rationale: 現在分詞の継続的・特徴的な含みを保ち、完了した過去だけに限定しなかった。
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: 大きな苦難から
  rationale: 定冠詞付きの表現を簡潔に訳し、特定の終末論体系に意味を限定しなかった。θλῖψιςの語義上の幅は脚注で示した。
- source_word: στολάς
  choice: 長い衣
  rationale: στολήが指す長くゆったりした衣を、現代日本語で理解しやすく表した。単なる一般的な「衣服」より、黙示録の荘重な情景に合う。
- source_word: ἐλεύκαναν
  choice: 白くした
  rationale: 使役的な意味を明確に保ち、不自然になりやすい「漂白した」は避けた。
- source_word: ἐν τῷ αἵματι τοῦ ἀρνίου
  choice: 子羊の血で
  rationale: 日本語として自然な「で」を用いながら、血によって衣が白くなるという黙示録特有の逆説的な清めのイメージを保持した。ἐνの位置的な読みは脚注に残した。
theological_decisions:
- issue: 長老へのκύριοςという呼びかけ
  choice: わが主よ
  alternative: 先生／主よ
  rationale: 神またはキリストへの呼びかけと断定せず、それでも天上の長老に対する荘重な敬意を保った。
- issue: 「大きな苦難」の指示範囲
  choice: 大きな苦難
  alternative: 大きな患難／大きな苦しみ
  rationale: 特定の終末時代だけを指すのか、信仰者の苦難全般を指すのか、あるいはその双方なのかを本文で決めず、原文の神学的緊張を保った。
- issue: 子羊の血と白い衣の逆説
  choice: 子羊の血で白くした
  alternative: 子羊の血の中で白くした／子羊の血によって白くした
  rationale: 血が衣を白くするという意図的な逆説を弱めず、同時にἐνの道具的用法と位置的イメージの両方があり得ることを脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を基調としつつ、天上の場面にふさわしい荘重さを「わが主よ」「長い衣」で保った。説明的な終末論用語を本文へ持ち込まず、現在分詞と逆説的な血のイメージをできる限り維持した。
