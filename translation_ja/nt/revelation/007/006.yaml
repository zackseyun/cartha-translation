    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: 〜族から
  rationale: 出所・所属を示す前置詞。各部族に属する者たちの中から数えられたことを、自然な日本語の列挙として表す。
- source_word: φυλῆς
  choice: 族
  rationale: イスラエルの部族区分を指す。固有名と結んだ「アシェル族」の形が、現代日本語では明瞭で簡潔。
- source_word: Ἀσὴρ
  choice: アシェル
  rationale: 旧約聖書の部族名として一般的な日本語表記を採用した。
- source_word: δώδεκα χιλιάδες
  choice: 一万二千人
  rationale: 人数を数える文脈なので、数詞を正確に訳し、日本語として必要な助数表現「人」を添えた。原文にない動詞は補わない。
- source_word: Νεφθαλὶμ
  choice: ナフタリ
  rationale: 旧約聖書の部族名として一般的な日本語表記を採用した。
- source_word: Μανασσῆ
  choice: マナセ
  rationale: 旧約聖書の部族名として一般的な日本語表記を採用した。
theological_decisions:
- issue: 前後の文脈から「証印を押された」を補うか
  choice: 本文では動詞を補わず、原文どおり簡潔な列挙とする。
  alternative: 「アシェル族から証印を押された者一万二千人」のように、前節から動詞的内容を補う。
  rationale: この節のギリシア語には動詞がなく、「〜族から」と人数が反復される。証印という統括的な意味は文脈上明らかだが、本文では原文の省略と簡潔さを保ち、脚注で明示的な読みを示す。
translation_notes:
  register: 現代標準日本語による、簡潔で格調を保った名簿形式。反復構造を維持しつつ、「人」を加えて人数であることを自然に示した。脚注記号は、節全体に関わる説明として文末に置いた。
