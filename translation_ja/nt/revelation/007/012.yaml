id: REV.7.12
reference: Revelation 7:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: ja
  text: こう言っていた。「アーメン。祝福と栄光と知恵と感謝と誉れと力と強さが、世々限りなく、私たちの神にありますように。アーメン。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: こう言った
  rationale: 現在能動分詞で、前節の複数の礼拝者が発した賛美の内容を導入する。日本語では文脈上自然な独立表現とした。
- source_word: Ἀμήν / ἀμήν
  choice: アーメン
  rationale: 礼拝的・頌栄的文脈で定着した音写を用い、賛美を囲む反復も保持した。
- source_word: ἡ εὐλογία
  choice: 祝福
  rationale: 神に帰される七重の賛美の第一項として、語の基本的意味を保った。「賛美」と解する可能性もあるが、原語の語彙上の幅を狭めない。
- source_word: ἡ δόξα
  choice: 栄光
  rationale: 頌栄における標準的で自然な訳語。
- source_word: ἡ σοφία
  choice: 知恵
  rationale: 神に帰される属性・賛美の一項として、原語を簡潔に反映する。
- source_word: ἡ εὐχαριστία
  choice: 感謝
  rationale: 名詞による列挙を保ち、現代日本語の礼拝表現として自然にした。
- source_word: ἡ τιμὴ
  choice: 誉れ
  rationale: 神に帰される敬意と尊崇を表す。列挙の格調を保ちつつ、経済的な「価値」という意味を避けた。
- source_word: ἡ δύναμις
  choice: 力
  rationale: 能力・力を表す一般的な語として自然な訳語を採用した。
- source_word: ἡ ἰσχὺς
  choice: 威力
  rationale: δύναμιςとの近義語の重なりを保ちつつ別語で訳し、七項から成る修辞的な充実を保持した。
- source_word: τῷ θεῷ ἡμῶν
  choice: 私たちの神にありますように
  rationale: 与格による帰属・帰献を、動詞のない頌栄として理解し、日本語で祈願的な賛美として自然に補った。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 終わりのない持続を表す定型句を、現代日本語でも理解可能な荘重な表現で訳した。
theological_decisions:
- issue: 動詞のない頌栄にどの述語を補うか
  choice: 私たちの神にありますように
  alternative: 私たちの神のものである／私たちの神にあれ
  rationale: 原文は七つの名詞と与格を並べ、明示的な動詞を欠く。「ありますように」は帰属を断定しすぎず、神に賛美を帰する祈願・歓呼の力を自然な日本語で示す。
- issue: δύναμις と ἰσχύς の区別
  choice: 力と威力
  alternative: 力と強さ
  rationale: 意図的に重ねられた近義語を一語に統合せず、七重の賛美と修辞的な厚みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、頌栄にふさわしい格調と七項の並列リズムを保った。原文にない注記を要しないため、脚注は設けていない。
