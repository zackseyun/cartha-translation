- from: こう言った。「アーメン。祝福と栄光と知恵と感謝と誉れと力と威力が、世々限りなく、私たちの神にありますように。アーメン。」
  to: こう言っていた。「アーメン。祝福と栄光と知恵と感謝と誉れと力と強さが、世々限りなく、私たちの神にありますように。アーメン。」
  rationale: 原文の現在分詞の相的ニュアンスを日本語の導入表現に反映し、δύναμιςとἰσχύςを「力と強さ」として自然かつ区別して訳した。動詞を明示しない頌栄に対する「ありますように」は、与格τῷ θεῷ ἡμῶνへの賛美の帰属を、日本語の祈願的な頌栄として過度に限定せず表している。脚注を必要とする本文上の曖昧さ・異読はない。
