  naturalness: 「こう言っていた」は前節の礼拝行為に続く発話の導入として自然です。「力と強さ」は現代標準日本語として明瞭で、近義語を重ねる原文の修辞も保ちます。
  terminology: 「祝福、栄光、知恵、感謝、誉れ」は頌栄の語彙として適切です。ἰσχύς の「威力」は不自然ではありませんが、神の固有の力・強さを列挙する文脈では「強さ」のほうが基本義に近く、δύναμις の「力」との区別も明瞭です。
