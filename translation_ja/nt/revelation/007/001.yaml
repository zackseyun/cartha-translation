id: REV.7.1
reference: Revelation 7:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: ja
  text: この後、私は四人の御使いが地の四隅[a]に立ち、地の四方の風を押さえているのを見た。それは、地にも海にも、どの木にも、風が吹かないようにするためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地の四隅」は、地の果て、または東西南北の四方向を表す慣用的な言い方。
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: この後
  rationale: 幻の展開を示す自然な時間的・談話的標識として訳した。「これらのことの後」も可能だが、単数形 τοῦτο に沿いつつ現代日本語として簡潔である。
- source_word: εἶδον
  choice: 私は……見た
  rationale: ὁράω のアオリストで、幻の中での知覚を端的に表す。原文には「目を上げて」などの付加的動作はない。
- source_word: τέσσαρας ἀγγέλους
  choice: 四人の御使い
  rationale: 数詞と名詞を直接反映した。「御使い」は聖書本文として品位を保ちつつ一般にも理解される表記である。
- source_word: ἑστῶτας
  choice: 立ち
  rationale: ἵστημι の完了分詞が表す、立っている状態を素直に訳した。「配置され」は任務や配置の含意を強めすぎる。
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: 地の四隅に
  rationale: 黙示的な比喩表現を保った。ἐπί はこの位置関係では日本語の「に」が自然であり、γῆ は海との対比を含む宇宙的場面なので「地」とした。
- source_word: κρατοῦντας
  choice: 押さえている
  rationale: κρατέω は保持・拘束を表し、後続の目的節から風を吹かせないよう抑制していることが明らかである。「押さえる」はその働きを自然に伝える。
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: 地の四方の風
  rationale: 直訳的な「地の四つの風」より、日本語で四方向からの風という慣用的意味が明瞭になる。数の対応は「四方」で保持した。
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: 風が吹きつけないようにするため
  rationale: ἵνα＋接続法の目的を明示した。対象を示す ἐπί が三度続くため、「吹く」より「吹きつける」が自然に目的語領域との関係を表す。
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: 地にも海にも、どの木にも
  rationale: μήτε の反復による三領域の並列を「にも」で再現した。πᾶν δένδρον は否定文中で分配的に「どの木にも」とした。
theological_decisions:
- issue: 黙示的幻における γῆ の範囲
  choice: 「地」と訳し、局地的な「土地」には限定しない
  alternative: 土地、国土
  rationale: 四隅、四方の風、地、海、すべての木という広域的・宇宙的な構図であり、「土地」では範囲を不当に狭める。日本語の「地」は原文の意味範囲と幻の荘重さを保つ。
- issue: 「地の四隅」という宇宙論的表現の性質
  choice: 比喩的・慣用的な映像表現を本文に保持する
  alternative: 地の果て、世界の四方
  rationale: 原文の γωνία（隅、角）が作る視覚的イメージを説明的に平板化しない。この慣用表現自体が特定の科学的宇宙像を断定するものとは限らないため、注で用法を説明する。
- issue: ἵνα 節の機能
  choice: 天使たちが風を押さえる目的として訳す
  alternative: その結果、風が吹かなかった
  rationale: ἵνα＋接続法はここで目的を自然に示す。実際にどれほどの期間吹かなかったかという結果まで本文以上に確定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学の荘重な映像性を保持した。「御使い」「地」は聖書本文にふさわしい品位を保つが、文構造は一般読者にも追いやすくした。脚注記号は該当表現の直後、または節末に配置した。
