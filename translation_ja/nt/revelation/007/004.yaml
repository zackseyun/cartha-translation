id: REV.7.4
reference: Revelation 7:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: ja
  text: また私は、印を押された者たちの数を聞いた。その数は十四万四千人で、イスラエルの子ら[a]のあらゆる部族から印を押された者たちであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「イスラエルの息子たち」。原文は男性形の系譜的な表現を用いている。
    reason: 原語の男性形と系譜的な語感を明示するため。
lexical_decisions:
- source_word: ἤκουσα
  choice: 私は……聞いた
  rationale: 物語・報告の文脈におけるアオリスト直説法を、自然な過去形で表した。
- source_word: τὸν ἀριθμὸν
  choice: 数
  rationale: 数えられた集団の総数を指すため、現代日本語で最も自然な「数」とした。
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: 印を押された者たち／印を押された者たち
  rationale: 完了受動分詞が示す、すでに印を押されてその状態にあることを表す。「印を押す」は封印・所有や保護のしるしという含みを決めつけずに保ち、原文の反復も訳文に残した。
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: 十四万四千人
  rationale: 人数として自然な現代日本語の数詞表現を用いた。
- source_word: ἐκ
  choice: から
  rationale: 出所・所属集団からの選出を表す前置詞を、自然な「から」で訳した。
- source_word: πάσης φυλῆς
  choice: あらゆる部族
  rationale: 単数形の πᾶς が持つ配分的な意味、すなわち各部族からという意味を表した。
- source_word: υἱῶν Ἰσραήλ
  choice: イスラエルの子ら
  rationale: 日本語の聖書的・系譜的な表現として自然さを保ちつつ、原文の「息子たち」という男性形は脚注で明示した。「イスラエルの民」として意味を一般化することは避けた。
theological_decisions:
- issue: 部族表に導入する υἱῶν Ἰσραήλ の訳し方
  choice: イスラエルの子ら
  alternative: イスラエルの息子たち／イスラエルの民
  rationale: 「子ら」は系譜的な響きを保つ自然な日本語である一方、原語の男性形が見えにくくなるため脚注を付した。特定の終末論的解釈に基づいて、この集団を民族的または象徴的なイスラエルのどちらかに限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「その数は」を補って長い同格構文を読みやすくしつつ、印を押された者への二度の言及と、各部族からという配分的な意味を保持した。
