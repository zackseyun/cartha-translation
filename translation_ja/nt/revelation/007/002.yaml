id: REV.7.2
reference: Revelation 7:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: ja
  text: また私は、もう一人の御使いが日の出る方[a]から上って来るのを見た。その御使いは生ける神の印を持っており、地と海を損なうことを許された四人の御使いに、大声で叫んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「東から」とも訳せる。直訳すると、「太陽の昇る所から」。
    reason: ἀπὸ ἀνατολῆς ἡλίουの通常の方向的意味と、字義的な映像表現の両方を示すため。
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: もう一人の御使い
  rationale: ἄλλονは、先に言及された御使いたちとは別の、さらに一人の御使いを示す。「もう一人の御使い」は自然な現代日本語でその区別を保つ。
- source_word: ἀναβαίνοντα
  choice: 上って来る
  rationale: 上方への移動を表す分詞であり、幻を見ているヨハネの視点にも自然に合う。
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: 日の昇る方から
  rationale: 直訳的な「太陽の昇る所から」のイメージと、方角としての「東から」の意味をともに伝えられる表現を本文に採用した。
- source_word: ἔχοντα σφραγῖδα
  choice: 印を持っており
  rationale: ἔχωの基本的な意味を保ちつつ、σφραγίςの具体的な印章・しるしのイメージを「印」で簡潔に示す。
- source_word: θεοῦ ζῶντος
  choice: 生ける神の
  rationale: 聖書的な重みを持つ定着した表現であり、神が生きておられることを表す原文の修飾関係を保つ。
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: 大声で叫んだ
  rationale: 強い叫びを表すκράζωとφωνῇ μεγάλῃを、自然で力強い現代日本語にした。
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: 四人の御使いに
  rationale: 与格の相手を明確に示す素直な訳。
- source_word: οἷς ἐδόθη αὐτοῖς
  choice: 許された
  rationale: 受動形ἐδόθηが示す、外から与えられた許可・権限を簡潔に表す。「力」を補わず、与えた主体も原文同様に明示しない。
- source_word: ἀδικῆσαι
  choice: 損なう
  rationale: ここでは抽象的な不正よりも、被造世界に害や損傷を加える意味で用いられている。「損なう」は地と海の双方に自然にかかる。
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: 地と海
  rationale: 黙示録の宇宙的な場面に合い、γῆとθάλασσαの対を簡潔に保つ。
theological_decisions:
- issue: ἐδόθηが表す委任された権限の範囲
  choice: 「損なうことを許された」
  alternative: 「損なう力を与えられた」
  rationale: 原文は何が「与えられた」かを名詞で明示していないため、「力」を補わず、神的受動と考え得る余地も残して、許可された行為として表した。
- issue: ἀπὸ ἀνατολῆς ἡλίουの方向表現と映像性
  choice: 「日の昇る方から」
  alternative: 「東から」
  rationale: 方角としての意味を明瞭にしながら、原文の太陽が昇るという視覚的表現を本文に残した。脚注で通常の方角表現を示す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示文学にふさわしい端正さを保った。「御使い」「生ける神」は聖書文体として理解しやすく、過度に古風にならない語を選んだ。
