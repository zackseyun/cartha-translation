  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: ja
  text: シメオン族から一万二千人、レビ族から一万二千人、イッサカル族から一万二千人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ
  choice: から
  rationale: 出所・所属を示す標準的な訳語。各句で反復し、原文の列挙の形を保つ。
- source_word: φυλῆς
  choice: 族
  rationale: イスラエルの部族区分を指す文脈に合い、「シメオン族」のような自然な日本語になる。
- source_word: Συμεὼν
  choice: シメオン
  rationale: 日本語聖書で一般的な固有名表記。
- source_word: δώδεκα χιλιάδες
  choice: 一万二千人
  rationale: 人数を列挙する文脈なので、日本語に必要な助数詞「人」を補い、数は読みやすく漢数字で示す。
- source_word: Λευὶ
  choice: レビ
  rationale: 日本語で定着した固有名表記。原文どおり部族の一つとしてそのまま訳す。
- source_word: Ἰσσαχὰρ
  choice: イッサカル
  rationale: 日本語聖書で一般的な固有名表記。
theological_decisions:
- issue: 部族一覧の反復構文
  choice: 各部族について「〜族から一万二千人」を反復する。
  alternative: 「シメオン族、レビ族、イッサカル族から、それぞれ一万二千人」とまとめる。
  rationale: 原文の反復には黙示的な列挙のリズムがあり、それを保つことで形式と強調を忠実に伝えられる。
- issue: 部族一覧にレビが含まれること
  choice: 本文では説明を加えず「レビ族」と訳す。
  alternative: レビが含まれる事情について説明を本文に補う。
  rationale: 原文はレビを列挙するだけであり、本文への説明追加は原文を越えた解釈になる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。短い列挙句の反復を維持し、通常の読者が自然に読める表現とした。英語版の「from / out of」に相当する違いは日本語の「から」に自然に包含されるため、実質的な訳語差を生まない脚注は設けない。
