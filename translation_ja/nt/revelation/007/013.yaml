id: REV.7.13
reference: Revelation 7:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: ja
  text: すると、長老の一人が私にこう言った。「白い衣をまとっているこの人たちは、だれで、どこから来たのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: すると
  rationale: 幻の展開を先へ進める接続表現として、文脈に自然な「すると」とした。単なる並列の「そして」も可能だが、ここでは場面の進行を明確にする。
- source_word: ἀπεκρίθη … λέγων μοι
  choice: 私にこう言った
  rationale: 直訳的な「私に答えて言った」は、直前に問いがない日本語では不自然になりやすい。ギリシア語の応答・発言導入の慣用的用法を踏まえ、発言者と聞き手を保ちながら自然に訳した。
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: 長老の一人
  rationale: 部分を表す構文を、簡潔で自然な日本語で表した。
- source_word: οἱ περιβεβλημένοι
  choice: まとっている人々
  rationale: 完了分詞が示す、着せられた結果として現在その衣を身に着けている状態を表す。「着た人々」よりも継続中の状態が明瞭である。
- source_word: τὰς στολὰς τὰς λευκάς
  choice: この白い衣
  rationale: στολήは長い上着や礼服を指し得るが、黙示録の象徴的な衣のイメージを保ち、現代日本語で簡潔かつ格調のある「白い衣」とした。定冠詞と直示的な文脈は「この」に反映した。
- source_word: τίνες εἰσὶν
  choice: いったい何者で
  rationale: 人物の身元を問う表現として「何者」を用い、疑問の焦点を自然に示すため「いったい」を添えた。
- source_word: πόθεν ἦλθον
  choice: どこから来たのか
  rationale: πόθενの起点・出所を「どこから」で明示し、アオリストを自然な日本語の過去形「来た」で表した。
theological_decisions:
- issue: ἦλθονの時制・アスペクト
  choice: 「どこから来たのか」
  alternative: 「どこからやって来たのか」「どこから来ているのか」
  rationale: ギリシア語のアオリストは到来を全体として提示する。日本語の「来た」は過去の到来と現在の場面とのつながりを無理なく表せるため、特定の解釈を付加せず簡潔に訳した。
- issue: ἀπεκρίθηが示す応答性
  choice: 「私にこう言った」
  alternative: 「私に答えて言った」
  rationale: 直前に語り手の質問は記されていないため、「答えて」を明示すると日本語読者に存在しない質問を想定させるおそれがある。ギリシア語に見られる発言導入の用法として自然に処理し、神学的含意は加えない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、幻の場面にふさわしい落ち着きと格調を保った。引用内の語順は、まず目の前の集団を指し示し、その身元と出所を尋ねる原文の焦点を維持している。
