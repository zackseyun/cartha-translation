id: REV.19.21
reference: Revelation 19:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ λοιποὶ ἀπεκτάνθησαν ἐν τῇ ῥομφαίᾳ τοῦ καθημένου ἐπὶ τοῦ ἵππου τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ, καὶ πάντα τὰ ὄρνεα ἐχορτάσθησαν ἐκ τῶν σαρκῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/021.yaml
  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: ja
  text: 残りの者たちは、馬に乗っている方の口から出た剣によって殺された[a][b]。そして、すべての鳥が彼らの肉で満腹になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「殺された」は「打ち殺された」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 口から出る「剣」は黙示文学的な象徴表現。19章15節参照。
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: 残りの者たち
  rationale: 直前で獣と偽預言者が処罰された後になお残っている者たちを指す集合表現として、簡潔で自然な訳とした。
- source_word: ἀπεκτάνθησαν
  choice: 殺された
  rationale: アオリスト受動態を保ち、現代日本語で明瞭に表現した。「打ち殺された」も可能だが、本文では過度に文語的・劇的にならない語を選んだ。
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: 剣によって
  rationale: ἐν＋与格の道具的用法を明確にし、黙示録で繰り返される具体的な剣のイメージを保持した。
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: 馬に乗っている方
  rationale: 冠詞付き分詞句を自然な日本語にしつつ、人物の尊厳を損なわない「方」を用いた。
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: すなわちその口から出た剣
  rationale: 後置された限定分詞が「剣」を修飾することを明示し、同格的な反復を「すなわち」で読みやすく示した。口から出るという鮮烈な黙示文学的イメージは解釈せず保持した。
- source_word: πάντα τὰ ὄρνεα
  choice: すべての鳥
  rationale: 文脈上は死肉を食べる鳥だが、原文は猛禽や腐肉食の鳥と限定していないため、上位語のまま訳した。
- source_word: ἐχορτάσθησαν
  choice: 満腹になった
  rationale: χορτάζωの「十分に食べて満たされる」という具体的意味を、自然な現代日本語で表した。
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: 彼らの肉で
  rationale: ここでのσάρξは身体の肉を指す。ἐκが示す満腹の源を、日本語で不自然にならない「肉で」によって表した。
theological_decisions:
- issue: 馬に乗る方の口から出る剣の性質
  choice: 口から出た「剣」という黙示文学的イメージを本文にそのまま残す
  alternative: 剣を「その方の言葉」または「裁き」と解釈して訳文に織り込む
  rationale: 原文は象徴の意味をこの節で明示していないため、翻訳で特定の解釈に限定せず、黙示録に固有の緊張とイメージを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「馬に乗っている方」として過度な古語や敬語を避け、象徴表現は説明的に言い換えず保持した。後半は原文の受動的な充足の意味を「満腹になった」で自然に表現した。
