revisions:
- from: その方の口からは鋭い剣が出ている。それは、その剣で諸国の民を打つためである。また、その方は鉄の杖で彼らを牧する[a]。そしてその方は、全能者である神の激しい怒りのぶどう酒を搾る酒ぶねを踏む。
  to: その方の口からは鋭い剣が出ている。それは、その剣で諸国の民を打つためである。また、その方は鉄の杖で彼らを牧する[a]。そしてその方は、全能者である神の怒りの憤りのぶどう酒の酒ぶねを踏む[b]。
  rationale: 酒ぶねを踏むという原文の比喩を保つため、「ぶどう酒を搾る酒ぶね」を「ぶどう酒の酒ぶね」に改めた。また、神の裁きに関する二重の語彙を「怒りの憤り」とし、現代日本語ではやや緊張を伴う表現であることを脚注で説明した。その他の訳語と、ποιμανεῖの比喩を保持する脚注は維持した。
