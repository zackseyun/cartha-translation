  - severity: medium
    issue: 「ぶどう酒を搾る酒ぶね」は酒ぶねの対象を不正確に示し得る。
    rationale: ληνόςは酒ぶね／ぶどう搾り場であり、原文はその酒ぶねを「踏む」と述べる。「ぶどう酒を搾る」とすると、すでに酒であるものを搾るように読める。
