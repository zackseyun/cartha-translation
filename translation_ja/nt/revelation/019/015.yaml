id: REV.19.15
reference: Revelation 19:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: ja
  text: その方の口からは鋭い剣が出ている。それは、その剣で諸国の民を打つためである。また、その方は鉄の杖で彼らを牧する[a]。そしてその方は、全能者である神の怒りの憤りのぶどう酒の酒ぶねを踏む[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「鉄の杖で彼らを治める」。原語は文字どおりには「牧する」だが、ここでは王として治める意味を含む。
    reason: alternative_reading
  - marker: b
    text: 原文は「怒りの憤りのぶどう酒」と、怒りを表す二つの近い語を重ねて強調している。
    reason: translation_note
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: 出ている
  rationale: 現在形の生き生きとした描写を保ちつつ、口から剣が現れ出る情景を自然な現代日本語で表した。
- source_word: ῥομφαία ὀξεῖα
  choice: 鋭い剣
  rationale: ῥομφαίαは大型の剣を指し得るが、武器の種類を必要以上に限定せず、ὀξεῖαを「鋭い」と直接反映した。
- source_word: ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη
  choice: その剣で諸国の民を打つため
  rationale: ἵναの目的を明示し、ἐν αὐτῇを道具の意味に取った。πατάξῃは「打ち倒す」と結果まで補わず「打つ」とし、τὰ ἔθνηは集合的な諸国民を表す。
- source_word: ποιμανεῖ
  choice: 牧する
  rationale: 王として「治める」含意を持つが、原語の羊飼いの比喩と詩篇2篇を背景とする牧者的・裁き的緊張を保持した。
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: 鉄の杖で
  rationale: ἐνを道具用法として訳し、日本語で定着した簡潔な表現を用いた。
- source_word: πατεῖ τὴν ληνόν
  choice: 酒ぶねを踏む
  rationale: 現在形の鮮烈さと、足でぶどうを踏み搾る預言的な裁きの比喩を保った。
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: 激しい怒りのぶどう酒
  rationale: 日本語では属格を逐語的に重ねると不自然になるため、θυμόςがὀργήを強める構造として「激しい怒り」としたうえで、οἶνοςの像を明示した。二語による強い裁きの意味は保持している。
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: 全能者である神の
  rationale: παντοκράτωρを神の称号「全能者」として明確に表し、ギリシア語の同格的な構造を自然な日本語にした。
theological_decisions:
- issue: 裁きの文脈と詩篇2篇の反響における ποιμανεῖ
  choice: 鉄の杖で彼らを牧する
  alternative: 鉄の杖で彼らを治める
  rationale: 原語は文字どおりには「羊飼いとして世話をする、牧する」であり、この箇所では王として治める意味を帯びる。本文では比喩を保持し、一般的な意訳を脚注に示した。
- issue: θυμοῦ τῆς ὀργῆς の重なった怒りの表現
  choice: 激しい怒り
  alternative: 憤りの怒り
  rationale: 近似する二語の強意を一語に平板化せず「激しい」で反映した。「憤りの怒り」は形式をより強く残すが、現代日本語として不自然で意味も伝わりにくい。
translation_notes:
  register: 黙示文学の荘重さと鮮烈な現在描写を保ちながら、現代の一般読者に理解できる標準的な日本語とした。「その方」を反復して原文の強調された αὐτός を反映し、文を適度に区切って可読性を確保した。
