id: REV.19.14
reference: Revelation 19:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: ja
  text: また、天にいる軍勢は、白い馬に乗って彼に従っていた。彼らは、白く清い上質の亜麻布を身にまとっていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατεύματα
  choice: 軍勢
  rationale: 組織された複数の軍事集団を表す語だが、日本語では「軍勢」が黙示文学の荘重さと集合的意味を自然に伝える。
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: 天にいる
  rationale: 前置詞句の場所的意味を保ち、軍勢の正体を天使や聖徒と断定しない。「天の」よりも原文の字義に近い。
- source_word: ἠκολούθει αὐτῷ
  choice: この方に従っていた
  rationale: 未完了過去の継続的な情景を「従っていた」で表した。文脈上の中心人物への敬意を自然な日本語の「この方」で示す。
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: 白い馬に乗って
  rationale: 騎乗して随行する意味を、現代日本語で最も自然に表す。
- source_word: ἐνδεδυμένοι
  choice: 身にまとっていた
  rationale: 衣服を着た状態を示す完了分詞の結果状態を、荘重かつ自然な表現で伝える。
- source_word: βύσσινον
  choice: 上質の亜麻布
  rationale: 高価で細やかな亜麻布を指すため、材質と品質の双方を明示した。
- source_word: λευκὸν καθαρόν
  choice: 白く清い
  rationale: 二つの形容詞をそれぞれ保ち、視覚的な白さと汚れのない性質を伝える。「清い」は黙示録の文体に適しつつ、「純粋」と解釈しすぎない。
theological_decisions:
- issue: 天にいる軍勢の正体
  choice: 「天にいる軍勢」と記述し、正体を特定しない
  alternative: 天使たち、栄光を受けた聖徒たち、またはその双方と明示する
  rationale: この節はその居場所と装いを示すだけで、天使か聖徒かを明言していないため、原文の曖昧さを保った。
- issue: 軍勢と先導者との関係
  choice: 「この方に従っていた」
  alternative: 「彼の後についていた」
  rationale: ἀκολουθέω は物理的な追随を表し得る一方、従属・随行の含みもある。「従っていた」は両面を自然に保持する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示録の荘重な幻の描写にふさわしい格調を保った。軍勢の正体について本文以上の説明を加えず、原文の場所表現と継続相を明確にした。
