id: REV.19.11
reference: Revelation 19:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: ja
  text: また、私は天が開かれているのを見た。すると、見よ、白い馬がいた。それに乗っている方は「忠実で真実な方」と呼ばれている。その方は義をもって[a]裁き、戦う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義をもって」。
    reason: δικαιοσύνηは、ここでは義にかなったあり方と公正な裁きの両面を表し得るため。
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: 開かれている
  rationale: 完了受動分詞が表す、天がすでに開かれ、その状態にあるという結果的な意味を自然な日本語で示した。
- source_word: ἰδοὺ
  choice: すると見よ
  rationale: 場面転換を示しつつ、黙示文学特有の鮮烈な注意喚起の力を保った。
- source_word: ἵππος λευκός
  choice: 白い馬
  rationale: 簡潔な名詞句としてそのまま訳した。日本語では不定冠詞に相当する表現を加える必要がない。
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: それに乗っている方
  rationale: 字義的には『その上に座っている者』だが、馬について自然な日本語となるよう『乗っている』とした。『方』により人物への品位ある言及を保った。
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: 「忠実で真実な方」と呼ばれている
  rationale: πιστόςとἀληθινόςを騎手の称号的な呼び名として示し、日本語として自然な一続きの表現にした。現在の状態を表す分詞を『呼ばれている』と訳した。
- source_word: πιστός
  choice: 忠実
  rationale: 信頼に値すること、変わらず誠実であることを含む語義を保ち、称号の一部として簡潔に表した。
- source_word: ἀληθινός
  choice: 真実
  rationale: 『本物の』『まことの』という含意を持つが、πιστόςとの称号的な組み合わせに適した明瞭な訳語を採った。
- source_word: ἐν δικαιοσύνῃ
  choice: 義をもって
  rationale: 裁きと戦いが義にかなう仕方で行われることを示す。『正義をもって』も文脈上可能なので脚注に残した。
- source_word: κρίνει
  choice: 裁き
  rationale: 現在形の動作を簡潔に表し、ἐν δικαιοσύνῃの意味を重ねて補わないようにした。
- source_word: πολεμεῖ
  choice: 戦う
  rationale: 戦争・戦闘を行う意味を、現代日本語で簡潔かつ力強く表した。
theological_decisions:
- issue: 白い馬に乗る方の称号の示し方
  choice: πιστόςとἀληθινόςを「忠実で真実な方」という称号的な呼び名として訳す。
  alternative: 単なる性質の叙述として「忠実であり、真実である」と訳す。
  rationale: καλούμενοςが呼び名を導いており、黙示録の文脈でもこの二語は騎手を特定する称号として機能する。ただし本文が明示しない固有名や人物名は加えなかった。
- issue: δικαιοσύνηの訳し方
  choice: 本文では「義」とする。
  alternative: 「正義」または「公正」とする。
  rationale: この語は道徳的な正しさと公正な裁きの双方を含み得る。本文では広い意味を保つ「義」を採用し、裁きと戦いの文脈で自然な「正義」を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「すると見よ」で黙示文学の荘厳さと視覚的な迫力を保った。文末は簡潔な常体とし、過度な敬語や教派固有の表現を避けた。脚注記号[a]は対応する「義をもって」の直後に置いた。
