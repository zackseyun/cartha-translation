id: REV.19.10
reference: Revelation 19:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: ja
  text: 私は彼を礼拝しようとして、その足もとにひれ伏した。すると彼は私に言った。「してはいけない。私は、あなたと、イエスの証し[a]を保っているあなたの兄弟たちの仲間のしもべ[c]である。神を礼拝しなさい。イエスの証し[a]こそ、預言の霊なのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスについての証し」とも、「イエスご自身がなさる証し」とも取れる。同じ曖昧さが、この節の最後の「イエスの証し」にもある。
    reason: alternative_reading
  - marker: c
    text: 直訳に近くは「仲間の奴隷」。神に属し、共に従って仕える者という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: その足もとにひれ伏した
  rationale: 身体の姿勢を自然な日本語で明確に示しつつ、ἔμπροσθεν τῶν ποδῶν の「足の前、足もと」という位置関係を保つ。
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: 彼を礼拝しようとして／神を礼拝しなさい
  rationale: 天使が拒み、その対象を神へ向け直している文脈では、単なるお辞儀ではなく宗教的な礼拝を表す。
- source_word: Ὅρα μή
  choice: してはいけない
  rationale: 短く切迫した禁止を、明快で自然な現代日本語として表す。
- source_word: σύνδουλος
  choice: 同じく、しもべ
  rationale: ヨハネや他の信徒と同じく神に従属して仕える者だという要点を示す。日本語本文では「奴隷」よりも文脈に自然で尊厳ある「しもべ」を用い、原語の強い従属的含意は脚注に残す。
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: イエスの証しを保っている
  rationale: ἔχω の「持つ、保持する」を「保っている」と表し、忠実に保持する含みを自然に伝える一方、属格Ἰησοῦの曖昧さは解消しない。
- source_word: μαρτυρία Ἰησοῦ
  choice: イエスの証し
  rationale: 「イエスについての証し」と「イエスがなさる証し」の双方が可能な属格の曖昧さを本文で保持する。
- source_word: πνεῦμα τῆς προφητείας
  choice: 預言の霊
  rationale: πνεῦμαの神学的な幅を「本質」などに限定せず、原文の簡潔で含意のある表現を保つ。
theological_decisions:
- issue: 「イエスの証し」における属格Ἰησοῦの意味
  choice: 本文では「イエスの証し」として曖昧さを保持する
  alternative: 「イエスについての証し」または「イエスご自身の証し」
  rationale: 原文だけでは目的属格か主語属格かを一義的に決められないため、どちらかに限定せず、両方の可能性を脚注で示す。
- issue: σύνδουλοςが示す天使の立場
  choice: 神の前でヨハネたちと同じ従属的立場にある「しもべ」と訳す
  alternative: 「仲間の奴隷」
  rationale: 天使が礼拝の対象ではなく、ヨハネや信徒たちと共に神に属して仕える者であるという対比を保つ。日本語本文では自然さを優先し、原語の強い語感は脚注で補う。
translation_notes:
  register: 明快な現代標準日本語を用い、黙示録にふさわしい簡潔さと威厳を保った。天使の禁止は切迫した短文とし、「証し」と「預言の霊」は原文の神学的な幅と緊張を残した。
