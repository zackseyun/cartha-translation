id: REV.19.12
reference: Revelation 19:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: ja
  text: 彼の目は燃える炎であり、頭には多くの王冠[a]があった。また、彼は、彼自身のほかにはだれも知らない、記された名を持っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は、特に王権を示す冠を指す。
    reason: 「王冠」が一般的な冠ではなく、統治権を象徴するδιάδημαであることを明確にするため。
lexical_decisions:
- source_word: οἱ δὲ ὀφθαλμοὶ αὐτοῦ
  choice: その目は
  rationale: 所有者は直前の文脈から明らかなため、日本語として自然な「その目」で表した。δὲは描写を続ける軽い接続なので、独立した訳語を置かなかった。
- source_word: φλὸξ πυρός
  choice: 燃える炎
  rationale: 明示的な比較辞のない名詞述語として、比喩を弱めずに表した。「火の炎」という不自然な重複を避けつつ、炎の激しさを明確にした。
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: 頭には
  rationale: 冠が頭の上にあるという位置関係を、明瞭で自然な現代日本語にした。
- source_word: διαδήματα πολλά
  choice: 多くの王冠
  rationale: διάδημαは王権を表す冠を指すため、「冠」だけでなく「王冠」とした。専門的な音写語「ディアデム」より一般読者に明瞭である。
- source_word: ἔχων ὄνομα γεγραμμένον
  choice: 彼には……名が記されていた
  rationale: 現在分詞による描写の継続を、日本語では独立した叙述として自然に表した。名が記された場所は原文が明示しないため、補わなかった。γεγραμμένονの結果が存続する含みを「記されていた」で表した。
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός
  choice: 彼自身のほかにはだれも知らない
  rationale: οἶδενの現在的意味と、εἰ μὴ αὐτόςが示す排他的な自己認識をそのまま保った。
theological_decisions:
- issue: 記された名を知る者の限定
  choice: 彼自身のほかにはだれも知らない
  alternative: その名はだれにも理解できない
  rationale: 原文は名の不可解さを一般化するのではなく、「彼自身を除いてだれも知らない」と明言する。訳文では、その排他性を保ちながら、名の神学的意味を説明によって限定しなかった。
- issue: 目と炎の関係
  choice: その目は燃える炎であり
  alternative: その目は燃える炎のようであり
  rationale: この節のギリシア語には「ような」に当たる比較辞がないため、明示された比喩を直喩へ弱めなかった。一方、これは黙示的描写であり、物理的同一性についての説明は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学の荘厳で鮮烈な描写を保った。「彼」は原文の男性単数指示を簡潔に受ける。比較辞や名の記された場所など、原文にない情報は補っていない。
