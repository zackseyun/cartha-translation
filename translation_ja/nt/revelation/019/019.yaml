reference: Revelation 19:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: ja
  text: 'また私は、獣と地上の王たち、そして彼らの軍勢が、馬に乗っている者とその軍勢に対して戦いをするために[b]集められていて[a]、そこにいるのを見た。


    [a] 「集結していて」とも訳せる。


    [b] 直訳は「……と戦いをするために」。ここでは敵対して戦うという意味。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「集結していて」とも訳せる。
    reason: συνηγμέναの、集められた結果として集結している状態を表す訳語上の選択肢を示すため。
  - marker: b
    text: 直訳は「……と戦いをするために」。ここでは敵対して戦うという意味。
    reason: ποιεῖν πόλεμον μετάの字義的構造と、文脈上の敵対的意味の両方を示すため。
lexical_decisions:
- source_word: θηρίον
  choice: 獣
  rationale: 黙示録で象徴的かつ威圧的な意味を帯びる語として、簡潔で定着した「獣」が適切。
- source_word: βασιλεῖς τῆς γῆς
  choice: 地上の王たち
  rationale: γῆには「土地」と「地・世界」の両義があるが、黙示録の世界的・終末論的文脈では「地上」が自然である。
- source_word: στρατεύματα αὐτῶν
  choice: 彼らの軍勢
  rationale: 複数形を文脈上明確に受け、「軍隊」よりも荘重な軍事的集合を表す「軍勢」とした。
- source_word: συνηγμένα
  choice: 集結している
  rationale: 集められた結果として一か所にそろっている状態を、自然な現代日本語で表す。受動の形を明示する訳は脚注に残した。
- source_word: ποιῆσαι τὸν πόλεμον
  choice: 戦いを挑むために
  rationale: 慣用句として戦争・戦闘を行う意。敵対する意図を自然に伝えつつ、目的を表す不定詞の構造を保持した。
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: 馬に乗っている者と
  rationale: μετάの表面上の意味「と」を保ちながら、後続の「戦いを挑む」によって敵対関係を明確にした。分詞表現を固有の称号に置き換えず、描写として訳した。
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: その軍勢に
  rationale: 二つ目のμετά句は日本語で同じ助詞を重ねる不自然さを避け、「戦いを挑む」の相手を示す「に」とした。στράτευμαの単数集合名詞は「軍勢」で表した。
theological_decisions:
- issue: 「馬に乗っている者」の指示対象
  choice: キリスト論的称号に置き換えず、原文どおり描写的表現を用いた。
  alternative: 「メシア」「キリスト」と明示する。
  rationale: 直前の文脈から指示対象は理解できるが、この節自体には称号がないため、明示的な同定を本文へ持ち込まない。
- issue: μετάの敵対的意味
  choice: 「と」という字義的な関係表現を残しつつ、「戦いを挑む」によって敵対の意味を示した。
  alternative: 両方を明示的に「……に対して」と訳す。
  rationale: μετά＋属格の形を完全には消さず、同時に戦争の文脈が要求する敵対性を自然な日本語で明確にするため。
translation_notes:
  register: 明快な現代標準日本語を用いながら、黙示文学にふさわしい荘重さを保った。「馬に乗っている者」は中立的な描写表現とし、本文にない称号や敬称を加えていない。
