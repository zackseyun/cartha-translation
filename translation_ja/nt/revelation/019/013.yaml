id: REV.19.13
reference: Revelation 19:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: ja
  text: また、この方は血に浸された衣をまとっており[a]、その名は「神のことば」と呼ばれている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「血に染まった」。ギリシア語の動詞は、より直訳的には「浸された」または「染められた」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: まとっており
  rationale: 完了分詞が示す、衣を身に着けた現在の状態を、自然な現代日本語で表した。
- source_word: ἱμάτιον
  choice: 衣
  rationale: 一般的な外衣を指す語。幻の荘重な文体を保ちつつ、「長衣」など形状を過度に限定しない訳語とした。
- source_word: βεβαμμένον αἵματι
  choice: 血に浸された
  rationale: βάπτωの中心的な意味である「浸す」を保ち、血によって染まったという鮮烈な像を伝える。「血に染まった」も文脈上可能なので脚注に示した。
- source_word: κέκληται
  choice: 呼ばれている
  rationale: καλέωの完了受動形が表す、名づけられ、その名で呼ばれている現在の状態を反映した。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: その名
  rationale: 直前の人物を指す所有表現を、明瞭で格調のある日本語にした。
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: 「神のことば」
  rationale: ここでは騎手に与えられた人格的称号であるため、「知らせ」などと意訳せず、ヨハネ文書との響きも保つ定着した表現を用いた。
theological_decisions:
- issue: λόγοςというキリスト論的称号
  choice: 「神のことば」
  alternative: 「神の言葉」／「神のメッセージ」
  rationale: 定冠詞を伴い、騎手の固有の称号として提示されている。「神のことば」は人格的称号としての重みを保ち、「メッセージ」として非人格化することを避ける。かぎ括弧によって称号であることを明示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学の荘重さを保った。「この方」は直前の騎手への敬意を自然に示し、「衣」は具体的な衣服の形を限定しない。称号は「神のことば」とし、本文中の脚注記号[a]を対応させた。
