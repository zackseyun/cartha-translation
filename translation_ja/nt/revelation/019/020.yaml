  terminology: 「獣」「偽預言者」「しるし」「刻印」「像」「拝む」「火の池」は適切です。「硫黄」は標準的な訳語であり、提示された[b]注のいう日本語訳上の代替表現は実質的な語義・本文異同の情報を提供していないため削除します。
