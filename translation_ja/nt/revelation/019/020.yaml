id: REV.19.20
reference: Revelation 19:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: ja
  text: そして、獣は捕らえられ、獣とともに[a]、その前でしるしを行った偽預言者も捕らえられた。彼はそれらのしるしによって、獣の刻印を受けた者たちと、その像を拝む者たちを惑わした。この二者は生きたまま、硫黄で燃える火の池に投げ込まれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「獣とともに」に当たる原文の語句には、写本上の不確かさがある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιάσθη
  choice: 捕らえられた
  rationale: πιάζωのアオリスト受動態。逮捕・捕縛されたことを自然な現代日本語の受動表現で示す。偽預言者にも同じ述語が及ぶことを補って明示した。
- source_word: θηρίον
  choice: 獣
  rationale: 黙示録における定着した終末論的イメージと語義を保つ。
- source_word: μετ’ αὐτοῦ
  choice: それとともに
  rationale: 代名詞の先行詞は文法上中性のθηρίον。日本語では「それ」として原文の非人格的な指示を保ち、過度な人格化を避ける。
- source_word: ψευδοπροφήτης
  choice: 偽預言者
  rationale: 複合語の意味を直接かつ簡潔に表す、聖書語としても理解しやすい訳。
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: しるしを行った
  rationale: 分詞を関係節として自然に訳し、σημεῖονの「意味を指し示す行為」という含みを「奇跡」よりよく保つ。
- source_word: ἐνώπιον αὐτοῦ
  choice: 獣の前で
  rationale: ἐνώπιονの「前で／面前で」を簡潔に表し、日本語で代名詞の参照が曖昧にならないよう先行詞を明示した。
- source_word: ἐν οἷς ἐπλάνησεν
  choice: それらのしるしによって……惑わした
  rationale: ἐν οἷςの手段的用法を「によって」で示す。πλανάωは単なる誤情報よりも道を踏み外させる含みがあるため「惑わした」とした。
- source_word: χάραγμα
  choice: 刻印
  rationale: 刻みつけられた印・標識という語感を保ち、黙示録の文脈にも適合する。
- source_word: προσκυνοῦντας
  choice: 拝む者たち
  rationale: この文脈では身体的な平伏だけでなく礼拝的服従を表すため、「拝む」とした。
- source_word: ζῶντες ἐβλήθησαν οἱ δύο
  choice: この二者は、生きたまま……投げ込まれた
  rationale: ζῶντεςが獣と偽預言者の双方にかかること、および受動態の強い裁きの描写を保つ。
- source_word: τὴν λίμνην τοῦ πυρὸς τῆς καιομένης ἐν θείῳ
  choice: 硫黄で燃える火の池
  rationale: 黙示的な裁きの具体的イメージを、後代の教理用語へ言い換えずに直接訳す。ἐν θείῳは燃焼に伴う硫黄を表す。
theological_decisions:
- issue: 獣を指す代名詞と人格性
  choice: 「それ」を用いる
  alternative: 「彼」を用いて獣を人格化する
  rationale: θηρίονは文法上中性であり、本文だけから必要以上に人格的な解釈へ限定しない。ただし獣に行為主体としての性格があることは文脈に委ねる。
- issue: 終末の裁きの描写
  choice: 「硫黄で燃える火の池」と具体的イメージを保持する
  alternative: 「地獄」や「永遠の責め苦」などの教理的説明に置き換える
  rationale: この節が実際に提示する黙示的比喩をそのまま伝え、本文に明記されない体系的教理を訳文へ持ち込まない。
- issue: 「生きたまま」の適用範囲
  choice: 獣と偽預言者の双方に適用する
  alternative: 直前の偽預言者だけに適用する
  rationale: 複数形ζῶντεςと明示された主語οἱ δύοにより、二者とも生きたまま投げ込まれたことが文法上明確である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「しるし」「刻印」「火の池」など黙示録の反復語彙を維持した。長いギリシア語一文は、日本語で参照関係と出来事の順序が明確になるよう三文に分けた。「偽預言者も捕らえられた」は原文で最初の受動動詞が並列主語に及ぶ構造を自然な日本語にするための補充である。
