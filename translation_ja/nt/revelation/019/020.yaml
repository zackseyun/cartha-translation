- from: そして、獣は捕らえられ、それ[a]とともに、獣の前でしるしを行った偽預言者も捕らえられた。彼はそれらのしるしによって、獣の刻印を受けた者たちと、獣の像を拝む者たちを惑わしたのである。この二者は、生きたまま、硫黄[b]で燃える火の池に投げ込まれた。
  to: そして、獣は捕らえられ、獣とともに[a]、その前でしるしを行った偽預言者も捕らえられた。彼はそれらのしるしによって、獣の刻印を受けた者たちと、その像を拝む者たちを惑わした。この二者は生きたまま、硫黄で燃える火の池に投げ込まれた。
  rationale: 「獣とともに」として日本語の参照関係を自然に明確化した。「その像」により、直前の獣を先行詞として無理なく受けつつ、原文の代名詞の反復を日本語に即して表した。SBLGNTで角括弧に置かれた語句には本文批判上の注を付した。根拠の薄い硫黄の注は削除した。裁きの比喩を教理語へ言い換えることなく、「生きたまま」「硫黄で燃える火の池」を維持した。
