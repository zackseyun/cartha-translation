id: REV.19.4
reference: Revelation 19:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔπεσαν οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες καὶ τὰ τέσσαρα ζῷα, καὶ προσεκύνησαν τῷ θεῷ τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ λέγοντες· Ἀμήν, Ἁλληλουϊά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: ja
  text: そして、二十四人の長老と四つの生き物はひれ伏し、王座[b]に座っておられる神を礼拝し、こう言った。「アーメン。ハレルヤ[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主をほめたたえよ」。ヘブライ語に由来する礼拝の歓呼で、直訳的には「ヤハをほめたたえよ」。
    reason: lexical_alternative
  - marker: b
    text: 一部の写本は「王座に」を欠く。
    reason: textual_variant
lexical_decisions:
- source_word: ἔπεσαν
  choice: ひれ伏し
  rationale: 礼拝の文脈におけるπίπτωは、単に倒れるのではなく、崇敬を表して身を伏せる動作を指す。「ひれ伏す」はその意味を自然な日本語で明確に表す。
- source_word: οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: 二十四人の長老
  rationale: 黙示録でπρεσβύτεροιを表す定着した、分かりやすい訳語であり、人数を示す表現も自然に保つ。
- source_word: τὰ τέσσαρα ζῷα
  choice: 四つの生き物
  rationale: ζῷαは王座を囲む生きた存在を指す。「生き物」は普通の動物に限定せず、原語の広さを保つ。助数表現も、人間とは特定されない存在に適した「四つ」とした。
- source_word: προσεκύνησαν
  choice: 礼拝して
  rationale: 目的語が神であるため、ここでは単なる敬礼ではなく礼拝を意味する。
- source_word: τῷ θεῷ τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: 王座に座っておられる神を
  rationale: 冠詞付き分詞句が神を限定している構造を保ちつつ、敬意を含む自然で格調ある現代日本語とした。θρόνοςは黙示録の統治の場を示すため「王座」とした。
- source_word: λέγοντες
  choice: 言った
  rationale: ギリシア語では分詞だが、日本語では主動詞と並べて「言った」とする方が自然で、礼拝に伴う発言であることも明瞭になる。
- source_word: Ἀμήν
  choice: アーメン
  rationale: 礼拝上の定型的な応答として、日本語でも定着した音写を用いる。
- source_word: Ἁλληλουϊά
  choice: ハレルヤ
  rationale: ギリシア語本文に取り込まれたヘブライ語の礼拝的歓呼であり、日本語でも定着した「ハレルヤ」を用いる。意味は脚注で示す。
theological_decisions:
- issue: ギリシア語本文中のヘブライ語的歓呼Ἁλληλουϊάの訳し方
  choice: ハレルヤ
  alternative: 「主をほめたたえよ」または「ヤハをほめたたえよ」
  rationale: 通常の叙述文ではなく、定型的な礼拝の歓呼として機能しているため、その典礼的な響きを保つ音写を本文に置く。語義は脚注で示し、神名要素の具体的な再現について一つに断定しない。
translation_notes:
  register: 明瞭で現代的ながら礼拝場面にふさわしい格調を保った。「ひれ伏し」「礼拝して」で二つの動作を簡潔に示し、「座っておられる」は王座上の神への敬意を自然に表す。脚注記号[a]は本文の「ハレルヤ」に付した。
