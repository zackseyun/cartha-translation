id: REV.19.17
reference: Revelation 19:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: ja
  text: また私は、太陽の中に立っている一人の天使を見た。その天使は大声で叫び、中天[a]を飛ぶすべての鳥にこう言った。「来て、神の大いなる晩餐に集まれ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「中天」は、空の中央、特に天頂付近の高い空を指す黙示録特有の表現。別訳「空の真ん中」「空高く」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: 一人の御使い
  rationale: 数詞ἕναを明示し、幻の中の特定の一人を示す原文を保った。「一人」は日本語として自然でありつつ、単なる不定冠詞相当へ弱めない。
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: 太陽の中に立っている
  rationale: ἐνの素直な空間表現と黙示文学的な鮮烈な像を保ち、「太陽の前に」などの解釈的な平滑化を避けた。
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: 大声で叫び
  rationale: κράζωの強さとφωνῇ μεγάλῃの様態を、明快で自然な現代日本語で表した。
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: すべての鳥に
  rationale: ὄρνεον自体は一般に「鳥」を意味するため、次節の文脈から生じる猛禽・腐肉食鳥という限定を本文に持ち込まなかった。
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: 空の中天を飛ぶ
  rationale: μεσουράνημαが示す空の中央・天頂付近という黙示録特有の高所の像を「中天」で保持し、「空中」だけに平板化しなかった。
- source_word: Δεῦτε
  choice: さあ
  rationale: 呼び寄せる命令の勢いを、後続の「集まれ」と自然につながる日本語で表した。
- source_word: συνάχθητε
  choice: 集まれ
  rationale: 受動形を字面どおり「集められよ」とせず、自発・集合を命じる日本語として簡潔かつ力強く訳した。
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: 神の大いなる晩餐に
  rationale: δεῖπνονを「晩餐」とし、文脈にある婚宴の晩餐との語彙的連関を保った。属格τοῦ θεοῦは「神の」と明示した。
theological_decisions:
- issue: 黙示文学的な空間像
  choice: 太陽の中に立っている
  alternative: 太陽の前に立っている
  rationale: 意図的に異様で鮮烈な原文の像を保ち、現実的な位置関係へ解釈して弱めないため。
- issue: 「神の大いなる晩餐」の属格関係
  choice: 神の大いなる晩餐
  alternative: 神が設ける大いなる晩餐
  rationale: τοῦ θεοῦが所有、主催、由来などのどの関係を表すかを本文で限定せず、原文の簡潔な属格表現を維持した。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、黙示録の荘重で鮮烈な調子を保つため、「御使い」「中天」「大いなる晩餐」を採用した。直接話法は召集の強さが伝わる簡潔な命令形とした。
