  terminology: 「天使」「中天」「神の大いなる晩餐」は、原語の語義と黙示録の格調を無理なく両立させる。「神の」は属格関係を限定せず、適切である。脚注はμεσουράνημαに対応するため、「中天」の直後に置く必要がある。
