  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: ja
  text: また、彼らは二度目にこう言った。「ハレルヤ！」彼女の煙は永遠に立ち上る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では字義的に「世々の世に至るまで」。終わりのない期間を表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: 二度目に
  rationale: 副詞的対格として発言の反復と順序を明示する。「再び」よりも、これが二度目であるという原文の意味を明確に保つ。
- source_word: εἴρηκαν
  choice: 言った
  rationale: λέγωの完了形。日本語の物語文では「言った」が自然であり、原文に明示されない叫び声などの強さを加えない。
- source_word: Ἁλληλουϊά
  choice: ハレルヤ
  rationale: 礼拝で用いられる定型的な歓呼として、現代日本語でも広く認識される音写を採用した。
- source_word: ὁ καπνὸς αὐτῆς
  choice: 彼女の煙
  rationale: αὐτῆςは文脈上、女として擬人化されたバビロンを指す。女性形の擬人化を保つため「その煙」ではなく「彼女の煙」とした。
- source_word: ἀναβαίνει
  choice: 立ち上る
  rationale: 煙が上方へ昇る情景を自然で簡潔な日本語で表し、現在形の生き生きとした継続的な描写を保つ。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 永遠に
  rationale: 字義的には「世々の世に至るまで」に相当する慣用句であり、この文脈では終わりのない持続を表す。「永遠に」は明瞭で自然な現代日本語である。字義的な形は脚注に示す。
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων が表す期間
  choice: 永遠に
  alternative: 世々の世に至るまで
  rationale: 最終的な裁きの文脈で、このギリシア語慣用句が表す終わりのない持続を弱めずに訳した。同時に、原文の表現形式を脚注で開示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、黙示録の礼拝的・荘重な調子を保った。「ハレルヤ」は定着した典礼的表現として維持し、「立ち上る」によって煙の視覚的なイメージを簡潔に表した。
