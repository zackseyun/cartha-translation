  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: ja
  text: 私は、大群衆の声のようなもの、多くの水のとどろきのようなもの、力強い雷鳴のようなものが、こう言うのを聞いた。「ハレルヤ。主なる神、全能者が、王として治められた[a]からだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「王として治められた」は、「王として治め始められた」「王となられた」「王として治めておられる」とも訳せる。このギリシア語は、神の王としての支配が決定的に現れたことを祝う表現と理解できる。また、一部の写本は「主、私たちの神、全能者」とする。
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: ἤκουσα
  choice: 私は……聞いた
  rationale: 物語の流れを示すアオリストとして、簡潔に「聞いた」と訳した。
- source_word: ὡς φωνὴν
  choice: 声のようなもの／とどろきのようなもの／雷鳴のようなもの
  rationale: 反復されるὡςの比較表現を保ちつつ、φωνήは文脈に応じて、人々には「声」、水と雷には自然な音響表現を用いた。
- source_word: ὄχλου πολλοῦ
  choice: 大群衆
  rationale: 非常に多くの人々が集まった様子を、黙示文学にふさわしい簡潔で格調ある日本語にした。
- source_word: ὑδάτων πολλῶν
  choice: 大水のとどろき
  rationale: 字義的な「多くの水」よりも、圧倒的な音という比喩が現代日本語で自然に伝わる表現を選んだ。
- source_word: βροντῶν ἰσχυρῶν
  choice: 力強い雷鳴
  rationale: ἰσχυρόςの力と迫力を保ち、「雷鳴」で自然な日本語にした。
- source_word: λεγόντων
  choice: こう言う
  rationale: 分詞が告白の内容を導く機能を、解釈を加えず直接表現した。
- source_word: Ἁλληλουϊά
  choice: ハレルヤ
  rationale: 新約聖書および日本語の礼拝用語として定着した音写を用いた。
- source_word: ὅτι
  choice: ……からだ
  rationale: ハレルヤの理由を示す接続語として理解した。
- source_word: ἐβασίλευσεν
  choice: 王として治めておられる
  rationale: 神の王権が決定的に現れたことを祝うアオリストだが、「治め始めた」と限定せず、継続する統治も自然に表せる訳にした。時制・相の別解は脚注に示した。
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: 全能者である主、神
  rationale: SBLGNT本文にἡμῶν（私たちの）がないことを尊重し、三つの神的呼称の関係を自然な日本語で示した。
theological_decisions:
- issue: ἐβασίλευσενが表す神の統治
  choice: 王として治めておられる
  alternative: 王として治め始められた／王となられた／王として治められた
  rationale: 神の主権そのものの開始と断定せず、終末的勝利における王権の決定的な現れを祝う文脈を保った。アオリストの幅は脚注で明示した。
- issue: κύριος, ὁ θεός, ὁ παντοκράτωρと「私たちの」の有無
  choice: 全能者である主、神
  alternative: 全能者である私たちの神、主
  rationale: 提示されたSBLGNT本文にはἡμῶνがないため、本文には所有表現を補わなかった。写本上の異読は本文に混入させず脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、黙示録の荘厳な聴覚的イメージと礼拝的な宣言を保った。「大水のとどろき」「力強い雷鳴」により、逐語性と自然な日本語の釣り合いを取った。
