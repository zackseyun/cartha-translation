  - severity: medium
    issue: ἐβασίλευσενの主文が現在進行の意味に限定される
    rationale: 「治めておられる」は現在の継続状態を前面に出す。ギリシア語アオリストには文脈上、治世開始・即位・王としての支配の宣言などの理解の幅があるため、本文は過度に限定しない表現とし、脚注で選択肢を示すのがよい。
  - severity: low
