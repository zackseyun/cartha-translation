id: REV.19.7
reference: Revelation 19:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: ja
  text: 喜ぼう。大いに喜ぼう。神に栄光を帰そう[a]。小羊の婚礼が来て、その花嫁[b]は身支度を整えたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちは神に栄光を帰す」。ギリシア語の動詞は未来形だが、ここでは前の二つの「喜ぼう」と並ぶ勧めとして用いられている可能性が高い。
    reason: alternative_reading
  - marker: b
    text: 別訳「その妻」。ギリシア語の γυνή は「女」「妻」「花嫁」を意味し得る。ここでは婚礼の文脈により「花嫁」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν
  choice: 喜び
  rationale: 一人称複数の勧奨的な接続法を、後続する動詞と合わせて「～よう」という呼びかけとして自然に表した。
- source_word: ἀγαλλιῶμεν
  choice: 歓喜し
  rationale: χαίρωμενよりも強い、あふれる喜びを示す語であるため、二つの動詞の意味の差を保った。
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: この方に栄光を帰そう
  rationale: δώσομενは形態上は未来直説法だが、ここでは先行する二つの勧奨的接続法と並ぶ礼拝への呼びかけと理解した。「この方」は代名詞の指示を保ち、本文だけで指示対象を過度に明示しない。
- source_word: ἦλθεν ὁ γάμος
  choice: 婚礼の時が来て
  rationale: γάμοςは婚姻、婚礼、婚宴を表し得るが、次節で婚宴が明示されるため、ここでは結婚の成就を指す「婚礼」とした。「時」を補って自然な日本語とし、到来の意味を明確にした。
- source_word: τοῦ ἀρνίου
  choice: 小羊の
  rationale: 黙示録におけるキリスト論的称号として、定着した「小羊」を用いた。
- source_word: ἡ γυνὴ αὐτοῦ
  choice: その花嫁
  rationale: γυνήは「女」「妻」「花嫁」を意味し得るが、婚礼の文脈では「花嫁」が最も自然である。語彙上可能な「妻」は脚注に残した。
- source_word: ἡτοίμασεν ἑαυτήν
  choice: 身支度を整えた
  rationale: 再帰的な「自分自身を整えた」という意味を保ちつつ、婚礼を控えた花嫁の準備として自然な現代日本語にした。
theological_decisions:
- issue: 婚礼の比喩における γυνὴ αὐτοῦ の訳
  choice: その花嫁
  alternative: その妻
  rationale: 神の民と小羊との終末的な婚礼という場面では「花嫁」が文脈に最も適する。ただし、γυνήには「妻」の意味もあるため、その可能性を脚注で保持した。
- issue: 勧奨の連続における δώσομεν の力
  choice: この方に栄光を帰そう
  alternative: 私たちはこの方に栄光を帰す
  rationale: 形態は未来直説法だが、χαίρωμεν、ἀγαλλιῶμενに続く一連の賛美への勧めとして読むのが自然である。未来としての形式的な読みも脚注に残した。
- issue: γάμος の範囲
  choice: 婚礼
  alternative: 結婚、婚宴
  rationale: この語は婚姻行為や婚宴を含み得るが、19章9節で「婚宴」が明示されるため、本節ではより広く婚礼の到来を表す訳を選んだ。
translation_notes:
  register: 明瞭で格調ある現代標準語。喜びを表す二つの動詞の強度差を保ち、礼拝的な呼びかけには「～そう」を用いた。原語上の曖昧さは、本文で一つに固定しすぎず、未来形と γυνή の別訳を脚注で示した。
