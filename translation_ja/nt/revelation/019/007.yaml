  rationale: 三つの賛美への呼びかけを、現代日本語で一貫した複数共同の勧奨として整えた。「大いに喜ぼう」は、単なる反復にせず第二の動詞ἀγαλλιῶμενの高められた喜びを表す。「神に」は文脈上の指示対象を自然に示すものであり、神学的解釈を追加するものではない。脚注の位置と内容は、未来形の別読およびγυνήの語彙的幅を維持している。
