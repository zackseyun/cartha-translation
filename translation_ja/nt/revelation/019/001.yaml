id: REV.19.1
reference: Revelation 19:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: ja
  text: これらのことの後、私は天で大群衆が語る、大きな声のようなものを聞いた。「ハレルヤ[a]！ 救いと栄光と力は、私たちの神のものだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヤハをほめたたえよ」「主をほめたたえよ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: これらのことの後
  rationale: 複数形の指示語を保ちつつ、黙示の展開における時間的な順序を明確に示す。
- source_word: ἤκουσα
  choice: 私は…聞いた
  rationale: ἀκούωのアオリストを、物語の進行に合う自然な過去表現で訳した。
- source_word: ὡς
  choice: …のようなもの
  rationale: 厳密な同一視ではなく、聞こえた音の類似・知覚上の近似を示す曖昧さを保った。
- source_word: φωνὴν μεγάλην
  choice: 大きな声
  rationale: μεγάληはここでは声量と壮大さの双方を含み得るため、自然で幅のある「大きな声」とした。
- source_word: ὄχλου πολλοῦ
  choice: 大群衆
  rationale: 多数の者から成る集団を簡潔に表し、天上の礼拝の壮大さを伝える。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天で
  rationale: οὐρανόςはここでは空ではなく天上の領域を指す。
- source_word: λεγόντων
  choice: が語る
  rationale: 属格の分詞を群衆に結びつけ、発言内容を導く自然な日本語にした。
- source_word: Ἁλληλουϊά
  choice: ハレルヤ
  rationale: ヘブライ語由来の礼拝的な叫びを、定着した音写で保った。意味は脚注で示した。
- source_word: ἡ σωτηρία
  choice: 救い
  rationale: 神による救済・解放を表す、礼拝文脈で自然な語を選んだ。
- source_word: ἡ δόξα
  choice: 栄光
  rationale: 神への頌栄で用いられるδόξαの標準的な訳語。
- source_word: ἡ δύναμις
  choice: 力
  rationale: 神の力・威力を広く表し、三項の並列にも自然に収まる。
- source_word: τοῦ θεοῦ ἡμῶν
  choice: 私たちの神のもの
  rationale: 属格が示す所有・帰属を明示し、「救いと栄光と力」が神に属するという頌栄の意味を保った。
theological_decisions:
- issue: 天上の歓呼Ἁλληλουϊάの訳し方
  choice: ハレルヤ
  alternative: ヤハをほめたたえよ／主をほめたたえよ
  rationale: ギリシア語本文に取り込まれたヘブライ語由来の典礼的表現として音写し、聖書間のつながりと礼拝上の響きを保つ。語義は脚注で提示する。
- issue: σωτηρία、δόξα、δύναμιςと神との関係
  choice: 救いと栄光と力は、私たちの神のもの
  alternative: 救いと栄光と力は、私たちの神に属する
  rationale: 属格の所有・帰属を自然な日本語で明示しつつ、神がこれらの源であり保持者であるという頌栄の表現を、必要以上に解釈して限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、天上の頌栄にふさわしい簡潔で荘重な調子を保った。「大きな声のようなもの」により、ὡςが示す知覚上の類似を残している。
