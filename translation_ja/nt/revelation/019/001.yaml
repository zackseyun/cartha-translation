- from: これらのことの後、私は、天で大群衆が語る大きな声のようなものを聞いた。「ハレルヤ[a]。救いと栄光と力は、私たちの神のもの。」
  to: これらのことの後、私は天で大群衆が語る、大きな声のようなものを聞いた。「ハレルヤ[a]！ 救いと栄光と力は、私たちの神のものだ。」
  rationale: 原文の語順と知覚上の近似（ὡς）を保ったまま、読点によって「大群衆が語る」と「大きな声」の構文関係を明確にしました。引用文の文末を補い、現代日本語としての自然さを改善しました。
