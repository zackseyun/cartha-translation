  source_fidelity: 前半のἐδόθηは、与え手を明示しない受動として概ね保たれているが、「許された」は本来の「与えられた／授けられた」よりも単なる許可の意味に寄る。本文の受動的な授与と、ἵνα περιβάληταιの「身にまとう」行為をともに保つため、より直接的な表現に改めるのが安全である。
  naturalness: 全体として自然で明瞭な現代標準語である。ただし「亜麻布を身にまとう」は素材を直接まとうようにも響くため、「亜麻布の衣」とすると日本語として滑らかで、原文が指す衣服のイメージも明確になる。
  terminology: βύσσινονは両箇所で「上質の亜麻布」と統一し、ἅγιοιは制度的な「聖人」を避ける「聖なる者たち」とする処理は適切である。καθαρόνは衣の物理的・視覚的描写を保つ「汚れのない」とするのが、「清らかな」より解釈を加えない。δικαιώματαをこの文脈で「正しい行い」とするのは妥当である。
