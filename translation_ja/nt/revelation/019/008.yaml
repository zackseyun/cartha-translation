revisions:
- from: 花嫁は、輝く清らかな上質の亜麻布を身にまとうことを許された。この上質の亜麻布は、聖なる者たちの正しい行い[a]である。
  to: 花嫁には、輝く、汚れのない上質の亜麻布の衣を身にまとうことが与えられた。この上質の亜麻布は、聖なる者たちの正しい行い[a]である。
  rationale: 「許された」を「与えられた」に改め、ἐδόθηの受動的な授与を保った。衣服として自然な日本語にするため最初のβύσσινονを「上質の亜麻布の衣」とし、説明節では原文の反復に対応して「この上質の亜麻布」とした。「汚れのない」はκαθαρόνの衣の描写を過度に道徳化せずに表す。
