    rationale: ἐδόθηはδίδωμιの受動であり、単に許可されたというより「それが彼女に与えられた」である。動作主を補わずに、この受動的な授与を反映する必要がある。
  - severity: low
    issue: 「清らかな」はκαθαρόνを道徳的・宗教的に響かせうる。
    rationale: ここではまず衣の明るさと清浄さの描写であるため、「汚れのない」は視覚的・物理的な意味を明確にし、続く象徴説明を先取りしない。
