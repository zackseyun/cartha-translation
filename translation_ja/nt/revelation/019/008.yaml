id: REV.19.8
reference: Revelation 19:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: ja
  text: 花嫁には、輝く、汚れのない上質の亜麻布の衣を身にまとうことが与えられた。この上質の亜麻布は、聖なる者たちの正しい行い[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正しい行為」。このギリシア語は別の文脈では「正しい要求」を意味することもあるが、ここでは聖なる者たちの正しい行いを指すのが最も自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: 花嫁は……ことを許された
  rationale: 受動表現を保ち、与え手を明示しない。文脈上の指示対象を自然な日本語で「花嫁」とした。「与えられた」より、衣をまとうことが認められたという意味を明瞭に表す。
- source_word: ἵνα περιβάληται
  choice: 身にまとうことを
  rationale: 中動態の再帰的なニュアンスを自然な日本語で表し、花嫁自身が衣をまとうことを示す。
- source_word: βύσσινον
  choice: 上質の亜麻布
  rationale: 高級な細布を指す語義を保ちつつ、一般読者に素材が分かる表現とした。二度とも同じ訳語を用いて象徴の説明を明確にする。
- source_word: λαμπρὸν καθαρόν
  choice: 輝く清らかな
  rationale: 衣の視覚的な輝きと汚れのなさを表す。καθαρόνを「清らかな」とし、黙示録の荘重な調子に合わせながらも道徳的意味に限定しすぎない。
- source_word: δικαιώματα
  choice: 正しい行い
  rationale: この複数形は文脈上、聖なる者たちの具体的な正しい行為を指すのが最も自然。「正しい行為」も可能であるため脚注に示す。
- source_word: τῶν ἁγίων
  choice: 聖なる者たち
  rationale: 神に属する民を指す新約聖書の呼称を、特定の教会制度上の「聖人」と誤解されにくい形で訳した。
theological_decisions:
- issue: 花嫁の衣と聖なる者たちのδικαιώματαとの関係
  choice: 衣は聖なる者たちの正しい行いを象徴する。
  alternative: 衣は聖なる者たちに関わる正しい要求、または彼らの義認・正しさを象徴する。
  rationale: 直後の説明節では、上質の亜麻布が複数形のδικαιώματαと同定されており、この文脈では具体的な行いが最も自然である。一方、前半では衣をまとうことが「許された」とされるため、神からの賜物と人々の正しい行いとの緊張関係を解消せず、そのまま残した。
- issue: ἐδόθηの動作主
  choice: 受動表現のまま、与え手を明示しない。
  alternative: 神が花嫁に許した。
  rationale: 神が動作主である可能性は高いが、ギリシア語本文は明示していないため、訳文でも補わない。
translation_notes:
  register: 現代の一般読者に分かりやすく、かつ黙示録の婚宴場面にふさわしい格調を保った。「聖徒」ではなく「聖なる者たち」、「細布」ではなく「上質の亜麻布」を用いて意味の透明性を優先した。
