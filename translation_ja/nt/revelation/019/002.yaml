id: REV.19.2
reference: Revelation 19:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: ja
  text: 神の裁きは真実で正しいからである。神は、その淫行によって地を堕落させた大淫婦を裁き、彼女の手から、ご自分の奴隷たち[a]の血の報復を求められたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ご自分のしもべたち」とも訳せる。ギリシア語の「ドゥーロス」は「奴隷」または「しもべ」を意味し、ここでは主人である神への全面的な帰属を表す強い語感を本文に残した。
    reason: 原語δοῦλοςの強い帰属の意味と、日本語で伝統的な代替訳の両方を示すため。
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: 真実で正しい
  rationale: 神の裁きが現実と真理にかなうことと、道徳的・司法的に正当であることを、自然で格調ある日本語で表す。
- source_word: αἱ κρίσεις αὐτοῦ
  choice: 神の裁き
  rationale: 複数形を機械的に「裁きの数々」とせず、日本語で集合的に自然な単数表現とした。文脈上の指示対象を明確にするため、代名詞は「神」とした。
- source_word: ἔκρινεν
  choice: 裁き
  rationale: κρίνωの幅を保ち、「有罪と定めた」と限定しすぎない。アオリストは日本語の完了した行為として自然に表した。
- source_word: τὴν πόρνην τὴν μεγάλην
  choice: 大淫婦
  rationale: 黙示録の象徴的呼称として定着し、かつ強い比喩を保つ。「大いなる娼婦」より聖書文体に適し、過度に口語的でもない。
- source_word: ἔφθειρεν
  choice: 堕落させた
  rationale: φθείρωの「滅ぼす／腐敗させる」という幅のうち、ἐν τῇ πορνείᾳとの結びつきが示す道徳的・霊的腐敗を表す。
- source_word: τὴν γῆν
  choice: 地
  rationale: 黙示録の宇宙的な射程を保ち、「土地」と局地化しない。
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: その淫らな行いによって
  rationale: 性的な不品行という語義を保ちつつ、偶像礼拝的不忠実という象徴的含意も排除しない表現とした。
- source_word: ἐξεδίκησεν τὸ αἷμα
  choice: 血の報復をされた
  rationale: 不当に流された血について正義を執行する意味を保つ。「復讐」よりも、神の司法的行為としての文脈に合う「報復」を用いた。
- source_word: τῶν δούλων αὐτοῦ
  choice: ご自分の奴隷たち
  rationale: δοῦλοςが示す主人への全面的な帰属という強い意味を保つ。日本語で一般的な「しもべ」は脚注に代案として示す。
- source_word: ἐκ χειρὸς αὐτῆς
  choice: 彼女の手に
  rationale: 加害者としての責任と、彼女に対して報復がなされることを示す原文の身体比喩を残した。
theological_decisions:
- issue: 神に属する者に対するδοῦλοςの訳語
  choice: 奴隷
  alternative: しもべ／仕える者
  rationale: 原語が表す所有・全面的帰属の強さを本文で保持する。ただし現代日本語の「奴隷」が喚起する歴史的・社会的含意に配慮し、より伝統的で柔らかな訳を脚注に示す。
- issue: πορνείαの文字的・象徴的意味
  choice: 淫らな行い
  alternative: 淫行／偶像礼拝的不忠実
  rationale: 性的な語義を消さず、同時に黙示録における宗教的・政治的背信の比喩を一義的に断定しない。
- issue: ἐκ χειρὸς αὐτῆςの理解
  choice: 彼女の手に報復する
  alternative: 彼女の手から血の報復を求める
  rationale: 原文の慣用句が示す加害責任と処罰の方向を保ちつつ、日本語として理解できる形にした。
translation_notes:
  register: 明快な現代標準語を基調としつつ、黙示録の賛美と司法的宣言にふさわしい格調を保った。二つのὅτιをそれぞれ「からである」で表し、原文の反復的な論理構造を保持した。「大淫婦」「血の報復」は強い象徴表現を弱めないために採用した。
