id: REV.19.5
reference: Revelation 19:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: ja
  text: また、御座から一つの声が出て、こう言った。「私たちの神を賛美せよ。神のすべての奴隷たち[a]よ、神を畏れる者たちよ、身分の低い者も高い者も[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷たち」は、「僕たち」または「仕える者たち」とも訳せる。ギリシア語のδοῦλοιは、主人に属する奴隷または僕を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「小さい者たちも大きい者たちも」。ここでは身分や地位を問わず、すべての者を指す。
    reason: idiom_clarification
lexical_decisions:
- source_word: φωνὴ
  choice: 声
  rationale: λέγουσα（「言った」）によって内容を語るものとして示されているため、自然に「声」とした。
- source_word: ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: 御座から声が出て
  rationale: ἀπόが示す起点と、ἐξέρχομαιの「出る」という動きを保ちつつ、日本語として明瞭にした。
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: 私たちの神を賛美せよ
  rationale: 複数の者への命令を、日本語で直接的かつ荘重な命令表現として訳した。
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: 神の奴隷たちよ……皆こぞって
  rationale: δοῦλοιが表す神への全面的な帰属を「奴隷」で保持し、πάντεςは列挙全体への呼びかけとして末尾の「皆こぞって」で明示した。
- source_word: οἱ φοβούμενοι αὐτόν
  choice: 神を畏れる者たちよ
  rationale: 神への恐れと敬虔な畏敬を含む聖書的表現を、「恐れる」より宗教的・敬虔な含意を伝えやすい「畏れる」で表した。
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: 身分の低い者も高い者も
  rationale: 大小という身体的意味ではなく、社会的地位の広がりを指す対句として自然に明示した。
theological_decisions:
- issue: 礼拝の文脈における δοῦλοι の訳語
  choice: 奴隷たち
  alternative: 僕たち／仕える者たち
  rationale: 神に全面的に属するという強い帰属関係を保持した。「僕」は伝統的で自然だが、現代の一般読者には語義が伝わりにくい場合があるため脚注に示した。
- issue: 神を φοβέομαι することの意味
  choice: 神を畏れる
  alternative: 神を恐れる／神を敬う
  rationale: 恐れと敬虔な畏敬の緊張を保つため「畏れる」とした。「敬う」だけでは恐れの要素を弱めうる。
- issue: 小さい者と大きい者の範囲
  choice: 身分の低い者も高い者も
  alternative: 小さい者も大きい者も
  rationale: 文脈上は地位の低い者と高い者を包括する定型的対句と解した。ただし原文の比喩的な形は脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を基調とし、天上の宣言にふさわしい簡潔で荘重な調子を採用した。話者の性別は原文から特定できないため、「言った」として性別を補わなかった。
