revisions:
- from: また、御座から声が出て、こう言った。「私たちの神を賛美せよ。神の奴隷たちよ、神を畏れる者たちよ、身分の低い者も高い者も、皆こぞって。」[a][b]
  to: また、御座から一つの声が出て、こう言った。「私たちの神を賛美せよ。神のすべての奴隷たち[a]よ、神を畏れる者たちよ、身分の低い者も高い者も[b]。」
  rationale: 「すべての」を「奴隷たち」に直接係らせ、命令の対象となる複数の呼びかけを自然な日本語で保った。「身分の低い者も高い者も」は原文の社会的な広がりを明瞭に示し、原文に近い比喩的表現は脚注に残した。脚注アンカーもそれぞれの対象語へ移した。
