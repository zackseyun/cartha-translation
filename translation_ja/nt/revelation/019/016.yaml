id: REV.19.16
reference: Revelation 19:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: ja
  text: 'また、その方の衣にも腿にも、名が書かれている[a]。

    「王の王、主の主。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「刻まれている」とも訳せる。ギリシャ語は字義的には「書かれている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχει
  choice: その方の……には、……が書かれている
  rationale: 現在形と、名が書かれた状態にあることを自然な日本語で表した。「身に着けている」などの解釈的な表現は避けた。
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: その方の衣にも
  rationale: ἱμάτιονを広く衣服を指す「衣」とし、文脈上の所有関係を「その方の」で明示した。
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: 腿にも
  rationale: μηρόςの直接的な意味を保ち、二つの場所を示す並列も「にも……にも」によって保持した。
- source_word: ὄνομα γεγραμμένον
  choice: 名が書かれている
  rationale: 完了受動分詞が示す、書かれた結果として現在そこにある状態を表す。「刻まれている」は可能だが、原文より具体的になり得るため本文では採らなかった。
- source_word: Βασιλεὺς βασιλέων
  choice: 王の王
  rationale: 属格を重ねた称号を直訳的に保ち、至高の王権を表す響きを維持した。
- source_word: κύριος κυρίων
  choice: 主の主
  rationale: κύριοςを「主」とし、前半と対応する属格構文と神学的な響きを保持した。
theological_decisions:
- issue: 称号を説明的な最上級表現に言い換えるか
  choice: 「王の王、主の主」という原文の称号をそのまま保つ。
  alternative: 「すべての王にまさる王、すべての主にまさる主」
  rationale: 原文の明示的な王的称号とそのキリスト論的な力を、説明的な言い換えで弱めたり限定したりしないため。
- issue: 名が衣と腿のどのような位置関係で書かれているか
  choice: 「衣にも腿にも」と二つの場所を直接訳し、位置関係を説明しない。
  alternative: 「腿を覆う衣の部分に」
  rationale: 原文は二つのἐπί句を並べているが、その具体的な配置は説明していないため、解釈上の曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、黙示文学の荘重さを保った。「その方」は指示対象への敬意を自然に示し、称号は簡潔で格調ある伝統的な形にした。
