id: REV.19.18
reference: Revelation 19:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: ja
  text: 王たちの肉、千人隊長たちの肉、力ある者たちの肉、馬の肉と、その馬に乗っている者たちの肉、また、自由人も奴隷も、小さい者も大きい者も、すべての人の肉を食べるためである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: 食べるためである
  rationale: ἵναに導かれる目的節と、二人称複数のアオリスト接続法を、前節から続く日本語として自然な目的表現にした。
- source_word: σάρκας
  choice: 肉
  rationale: 戦いと裁きの場面における身体の肉を指すため、比喩化せず「肉」とし、原文の反復も保った。
- source_word: βασιλέων
  choice: 王たち
  rationale: 王を明示する語であり、一般的な「支配者たち」に広げなかった。
- source_word: χιλιάρχων
  choice: 千人隊長たち
  rationale: 古代の軍隊における指揮官の称号を具体的に表し、軍事的意味を保った。
- source_word: ἰσχυρῶν
  choice: 力ある者たち
  rationale: 形容詞の名詞的用法を保ち、身体的な強者にも権勢ある者にも取り得る幅を残した。
- source_word: ἵππων καὶ τῶν καθημένων ἐπ’ αὐτῶν
  choice: 馬の肉とそれに乗っている者たちの肉
  rationale: 馬と、その上に座している人々を指す原文を、明瞭で自然な日本語にした。単に「騎手」と圧縮せず、分詞句の描写を保った。
- source_word: πάντων
  choice: すべての人
  rationale: 後続する社会的両極を総括しており、日本語で対象が人であることを明確にした。
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: 自由人も奴隷も
  rationale: 自由身分と隷属身分の対照を明確に保った。τε καὶは並列を表す「も……も」で自然に示した。
- source_word: μικρῶν καὶ μεγάλων
  choice: 小さい者も大きい者も
  rationale: 社会的地位などの低い者と高い者を含み得る定型的な両極表現だが、原文の比喩的余地と黙示録的な語調を保つため直訳的にした。
theological_decisions:
- issue: δοῦλοςを自由人との社会的対句でどう訳すか
  choice: 奴隷
  alternative: 僕／仕える者
  rationale: ここでは宗教的奉仕ではなく、ἐλεύθερος（自由人）と対照される法的・社会的な隷属身分が前面に出ているため、「奴隷」が最も正確である。
- issue: μικρῶν καὶ μεγάλωνの範囲
  choice: 小さい者も大きい者も
  alternative: 身分の低い者も高い者も
  rationale: 社会的地位を指す可能性は高いが、原文は範囲を限定していない。解釈を訳文に固定せず、全階層を包む両極表現を保持した。
translation_notes:
  register: 現代の読者に明瞭でありながら、裁きの場面にふさわしい荘重さと、原文における「肉」の反復による強い修辞効果を保った。節単独では目的節に当たるため、前節との連続を示す「食べるためである」で結んだ。
