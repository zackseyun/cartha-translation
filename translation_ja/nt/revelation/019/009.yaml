id: REV.19.9
reference: Revelation 19:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: ja
  text: また、御使いは私に言った。「書き記しなさい。子羊の婚礼の宴に招かれている人たちは幸いである[a]。」さらに私に言った。「これらは神の真実のことばである[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子羊の婚礼の宴に召されている人たち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「真実の」は「信頼できる」とも訳せる。この表現は、これらのことばが神のものであり、確かで信頼に値することを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γράψον
  choice: 書き記しなさい
  rationale: アオリスト命令法単数の直接的な命令を、黙示録の啓示を書き留める文脈に即した自然で厳かな日本語にした。
- source_word: Μακάριοι
  choice: 幸いである
  rationale: 聖書の祝福宣言として定着した表現で、単なる主観的な幸福以上の、神に祝福された状態を表す。
- source_word: οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι
  choice: 子羊の婚宴に招かれている人たち
  rationale: 完了受動分詞が示す、招きを受けてその状態にあることを表現した。食事の文脈では「招かれている」が自然だが、「召されている」という語義も脚注に残した。
- source_word: δεῖπνον τοῦ γάμου
  choice: 婚宴
  rationale: 結婚に伴う祝宴の食事を、日本語で簡潔かつ自然に表す。「婚姻の晩餐」より現代の一般読者に明瞭である。
- source_word: τοῦ ἀρνίου
  choice: 子羊の
  rationale: 黙示録におけるキリスト論的称号を保持し、象徴的・犠牲的響きを残した。
- source_word: Οὗτοι οἱ λόγοι
  choice: これらは…ことばである
  rationale: 指示代名詞と名詞を、日本語の自然な同定文として訳した。λόγοι の複数性は「これら」で示される。
- source_word: ἀληθινοὶ
  choice: 真実な
  rationale: 内容の真実性と信頼性の双方を含み得る語として、解釈を狭めすぎない訳語を採用した。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格をそのまま保ち、神に属することばとも神から出たことばとも理解できる原文の幅を保持した。
theological_decisions:
- issue: 終末的な祝宴の文脈における κεκλημένοι の訳
  choice: 招かれている
  alternative: 召されている
  rationale: 食事への招待という直接の文脈では「招かれている」が最も自然であり、特定の召命論を本文に持ち込まない。一方、καλέω のより字義的な響きは脚注で保持した。
- issue: δεῖπνον τοῦ γάμου の表現
  choice: 婚宴
  alternative: 子羊の婚姻の晩餐／子羊の結婚の祝宴
  rationale: 「婚宴」は結婚祝いの食事を明瞭かつ簡潔に伝える。より逐語的な表現は日本語では硬く不自然になりやすい。
- issue: ἀληθινοὶ の意味範囲
  choice: 真実な
  alternative: 信頼できる
  rationale: 原語は真実性と信頼性を含み得るため、本文では直接的な「真実な」を採用し、「信頼できる」を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、祝福宣言と啓示の命令にふさわしい厳かさを保った。話者は直前の文脈では御使いだが、原節自体は主語を明示しないため、「御使い」は文脈補足として採用した。
