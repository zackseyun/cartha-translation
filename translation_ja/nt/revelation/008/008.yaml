id: REV.8.8
reference: Revelation 8:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ δεύτερος ἄγγελος ἐσάλπισεν· καὶ ὡς ὄρος μέγα ⸀πυρὶ καιόμενον ἐβλήθη εἰς τὴν θάλασσαν· καὶ ἐγένετο τὸ τρίτον τῆς θαλάσσης αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: ja
  text: 第二の御使いがラッパを吹いた。すると、火に燃えている大きな山のようなもの[a]が海に投げ込まれ、海の三分の一が血となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「火に燃えている大きな山のようなもの」。ギリシア語は、これが山そのものであると断定せず、類似を示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: ラッパを吹いた
  rationale: 目的語は動詞に含意され、文脈上明らかである。現代日本語として自然かつ明瞭に表した。
- source_word: ὡς
  choice: …のようなもの
  rationale: 同一性を断定せず、見た目または幻の中での類似を示す語の働きを保った。
- source_word: ὄρος μέγα
  choice: 大きな山
  rationale: μέγαの規模と黙示文学的な重みを、過度に誇張せず率直に表した。
- source_word: πυρὶ καιόμενον
  choice: 火に燃える
  rationale: 火によって燃えているという鮮明な像を保ち、火山や隕石などの特定の解釈を加えなかった。
- source_word: ἐβλήθη
  choice: 投げ込まれ
  rationale: 受動態と海の中への方向を自然な日本語で示し、投げた主体を補わなかった。
- source_word: εἰς τὴν θάλασσαν
  choice: 海に
  rationale: θάλασσαを通常どおり「海」とし、εἰςの内部への方向性は「投げ込まれ」に反映した。
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: 海の三分の一
  rationale: 部分を示す属格表現と、黙示録に反復される三分の一という数量を明確に保った。
- source_word: αἷμα
  choice: 血
  rationale: 比喩などと限定せず、原文の簡潔で直接的な表現をそのまま保った。
theological_decisions:
- issue: 山のように見えるものの性質
  choice: 「大きな山のようなもの」と訳し、類似を示しつつ正体を特定しない。
  alternative: 文字どおりの山、隕石状の物体、または裁きの象徴と明示する。
  rationale: ὡςは類似を示すため、幻の像が文字どおりか象徴的か、あるいはその両方かという緊張を訳文で解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示文学の荘重さを保った。「御使い」は聖書文体として理解しやすい語を採用し、全体は簡潔で力強い叙述とした。
