id: REV.8.3
reference: Revelation 8:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: ja
  text: また、別の御使いが来て、祭壇のそばに立った。その手には金の香炉[a]があった。すると、多くの香がその御使いに与えられた。それは、御座の前にある金の祭壇の上で、すべての聖なる者たちの祈りとともに、その香をささげるためであった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「香をたく金の器」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「すべての聖なる者たちの祈りに、それを与えるため」。この文脈では、香を彼らの祈りとともに、または祈りに添えてささげることを意味すると考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: 別の御使い
  rationale: 場面にもう一人の御使いが加わることを自然な現代日本語で表した。「別種の存在」という意味には限定しない。
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: 祭壇のそばに立った
  rationale: ἐπί＋属格を、祭壇の上に乗ったとの誤解を避けつつ、祭壇に近接して立つ情景として訳した。
- source_word: λιβανωτὸν χρυσοῦν
  choice: 金の香炉
  rationale: 香をたくための器を指す語として、簡潔で定着した日本語を用いた。χρυσοῦνは「金の」と明示した。
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: 多くの香がその御使いに与えられた
  rationale: 原文の受動態を保ち、θυμιάματαをこの祭儀的文脈に即して「香」とした。代名詞の指示先は日本語で明瞭になるよう「その御使い」とした。
- source_word: ἵνα δώσει
  choice: その香をささげるため
  rationale: ἵνα節の目的を示し、祭壇と香の文脈における δίδωμι を「ささげる」と訳した。目的語は直前の「香」から補った。
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: すべての聖なる者たちの祈りとともに
  rationale: 与格の関係は圧縮されていて曖昧だが、香が祈りに伴ってささげられるという文脈上の意味を自然に表した。直訳上の可能性は脚注に残した。
- source_word: ἅγιοι
  choice: 聖なる者たち
  rationale: 神に属する者たちという語義を、特定教派の用語に狭めず、一般の読者にも分かる形で表した。
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: 金の祭壇の上で
  rationale: ἐπί＋対格と奉献行為の組み合わせを踏まえ、香が祭壇上でささげられることを示した。
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: 御座の前にある
  rationale: 祭壇と御座との空間的な関係を自然な日本語で明示した。
theological_decisions:
- issue: 香と聖なる者たちの祈りとの関係
  choice: 香は、すべての聖なる者たちの祈りとともにささげられる。
  alternative: 香は、すべての聖なる者たちの祈りに与えられる。
  rationale: 原文の与格は解釈の余地を残すが、黙示的な神殿の情景と直近の文脈から、香が祈りに伴うとの理解を本文に採った。ただし、天使の仲介について本文以上の体系的教理を持ち込まず、直訳的な関係は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御使い」「御座」は黙示文学の荘厳な場面に適する表記としつつ、文を分けて読みやすくした。「聖徒」ではなく「聖なる者たち」として、現代の一般読者に意味が伝わるようにした。
