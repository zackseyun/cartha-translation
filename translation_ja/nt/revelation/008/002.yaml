source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς ἑπτὰ ἀγγέλους οἳ ἐνώπιον τοῦ θεοῦ ἑστήκασιν, καὶ ἐδόθησαν αὐτοῖς ἑπτὰ σάλπιγγες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/002.yaml
  text: And I saw the seven angels who stand before God[a], and seven trumpets were given to them.
translation:
  language: ja
  text: また、私は神の前に立っている七人の天使を見た[a]。彼らには七つのラッパが与えられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の前に立つ」または「神の前に立ち続けている」。ギリシア語の完了形は、立った結果としてその状態が続いていることを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: 私は……見た
  rationale: 幻の叙述におけるὁράωのアオリストとして、自然で明瞭な「見た」とした。
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: 七人の御使いたち
  rationale: 定冠詞を伴う特定の七者を指す。日本語では人数を示す「七人」と複数性を明確にする「たち」により、そのまとまりを自然に表した。
- source_word: ἀγγέλους
  choice: 御使い
  rationale: 天上の御座をめぐる文脈なので、人間の使者ではなく天的存在を指す。現代の聖書文体として理解しやすく、品位のある語を選んだ。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の御前に
  rationale: 空間的・関係的な意味を簡潔に保ち、自然で荘重な日本語とした。
- source_word: ἑστήκασιν
  choice: 立っている
  rationale: ἵστημιの完了形が示す、立った結果として現在も続く状態を自然な日本語で表した。
- source_word: ἐδόθησαν αὐτοῖς
  choice: 彼らには……が与えられた
  rationale: 与え手を明示しない神的受動の形を保ち、「受け取った」のような能動表現への転換を避けた。
- source_word: σάλπιγγες
  choice: ラッパ
  rationale: 黙示文学における合図と裁きの器具を指す語として、一般読者に明瞭な標準的表現を用いた。
theological_decisions:
- issue: 七人の御使いの身分
  choice: 「神の御前に立っている七人の御使いたち」とし、本文以上の階級を特定しない
  alternative: 「七人の大天使」または後代の伝承上の特定の天使たちとする
  rationale: 原文は特定の七人の御使いを示すが、ἀρχάγγελοιとは呼ばず、その階級も定義していないため、後代の伝承を持ち込まない。
- issue: ἑστήκασινの時制的含意
  choice: 継続中の状態を示す「立っている」
  alternative: 「立つ」または「立ってきた」
  rationale: ギリシア語完了形の結果状態を日本語で自然に示しつつ、いつから立っているかなど本文にない解釈は加えない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「神の御前」「御使い」によって黙示録の天上場面にふさわしい品位を保った。二つのκαίは、冒頭を「また」、後半を独立した文として表し、視認と授与の二段階を読みやすくした。
