  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: ja
  text: また、七つのラッパを持つ七人の御使いたちは、ラッパを吹く[a]ための準備を整えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ラッパを鳴らそうと」。ギリシア語の動詞は、ラッパを吹いて音を出すことを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελοι
  choice: 御使いたち
  rationale: 黙示録の天上の場面では天的存在を指すため、現代日本語の聖書文体で明確な「御使い」とした。
- source_word: ἔχοντες
  choice: 持つ
  rationale: 現在分詞による限定を、自然で簡潔な連体修飾として表した。
- source_word: σάλπιγγας
  choice: ラッパ
  rationale: 終末的・祭儀的な響きを保ちつつ、一般読者に明瞭な標準的訳語を採った。
- source_word: ἡτοίμασαν αὑτοὺς
  choice: 身支度を整えた
  rationale: 再帰代名詞を伴う自己準備の意味を明示し、日本語として自然かつ荘重さのある表現にした。
- source_word: ἵνα
  choice: ために
  rationale: 目的を示す節を、現代日本語で自然な目的表現にした。
- source_word: σαλπίσωσιν
  choice: ラッパを吹く
  rationale: この動詞はラッパを鳴らすことを意味する。日本語では「ラッパを吹く」が自然で、直前の複数のラッパも文脈上明らかである。
theological_decisions:
- issue: 黙示的文脈における ἄγγελοι の指示対象
  choice: 天的存在である御使い
  alternative: 人間の使者
  rationale: 七つのラッパを委ねられた天上の場面は天的存在を強く示すため。ただし、それ以上の性質について教派的説明は加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示録の荘重さを保った。「用意した」より再帰的な自己準備を示す「身支度を整えた」を選び、過度に古風な語順は避けた。
