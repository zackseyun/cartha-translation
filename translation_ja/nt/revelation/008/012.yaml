id: REV.8.12
reference: Revelation 8:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: ja
  text: 第四の天使がラッパを吹いた。すると、太陽の三分の一、月の三分の一、星々の三分の一が打たれ、それらの三分の一が暗くされた。そのため、昼はその三分の一の間、光を放たず[a]、夜も同様だった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「昼がその三分の一の間、光を放たないために」。ギリシア語の構文は、単なる結果だけでなく、目的の含みをもって訳すこともできる。
    reason: ἵναを伴う構文の結果的・目的的ニュアンスを保持するため。
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: ラッパを吹いた
  rationale: σαλπίζωはラッパを鳴らすことを表す。現代日本語では「ラッパを吹く」が自然で明瞭であり、原文の動作を過不足なく伝える。
- source_word: ἐπλήγη
  choice: 打たれ
  rationale: πλήσσωの受動態が持つ「打撃を受ける」という裁きのイメージを保ちつつ、簡潔で格調ある現代語とした。
- source_word: τὸ τρίτον
  choice: 三分の一
  rationale: 原文で繰り返される数量的限定を、その反復も含めて明確に表した。
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: 太陽／月／星々
  rationale: 天体を指す基本的な語義をそのまま採用した。複数形ἀστέρωνは「星々」とした。
- source_word: ἵνα
  choice: そのため
  rationale: ここでは先行する打撃がもたらす結果として自然に読めるため、「そのため」とした。ただし目的的な含みもあり得るので脚注に残した。
- source_word: σκοτισθῇ
  choice: 暗くなった
  rationale: 受動形は日本語では自動詞的に表すほうが自然である。外から作用を受けたという文脈は「打たれ」によって保たれている。
- source_word: αὐτῶν
  choice: それら
  rationale: 太陽、月、星々を集合的に受ける複数代名詞として明示した。
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: 昼は……光を放たず
  rationale: φαίνωは「現れる」と「輝く」の両義を持つが、天体が暗くなる文脈では発光・照明の欠如を表す「光を放たず」が明瞭である。ἡμέραはνύξとの対比から「昼」とした。
- source_word: τὸ τρίτον αὐτῆς
  choice: その三分の一の間
  rationale: 昼のうち影響を受ける時間的範囲を示す表現として自然であり、三分の一という限定を保持する。
- source_word: ἡ νὺξ ὁμοίως
  choice: 夜も同様だった
  rationale: 原文の簡潔さと、夜にも同じ限定が及ぶという含みを保った。何がどのように同様かを訳文で過度に補わず、原文の省略を尊重した。
theological_decisions:
- issue: 宇宙的裁きの描写の性質
  choice: 天体の三分の一が打たれて暗くなるという黙示的描写を、そのまま具体的に訳す。
  alternative: 文字どおりの天文現象、または政治的・宇宙的象徴のいずれかに限定して訳す。
  rationale: 本文自体は、この描写が文字どおりか象徴的か、あるいは両方かを明示しない。翻訳ではその緊張と解釈の余地を保持する。
- issue: ἵναが示す目的と結果
  choice: 本文では結果として「そのため」と訳し、目的的な読みも脚注で示す。
  alternative: 「そうなるために」と目的だけを前面に出す。
  rationale: ἵναは目的または結果を表し得る。文脈上は裁きに続く結果として自然だが、神的裁きの意図を表す目的的含意も排除できないためである。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学の厳粛さを保った。「御使い」は聖書文体として広く理解される語を採用し、文全体は過度に古風にならないよう整えた。原文の反復される「三分の一」と、末尾の簡潔な「夜も同様」を保持した。
