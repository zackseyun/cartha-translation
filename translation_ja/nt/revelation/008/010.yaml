reference: Revelation 8:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: ja
  text: 第三の御使いがラッパを吹いた。すると、たいまつのように燃える大きな星[c][b]が天から[a]落ちて来て、川々の三分の一の上と、水の泉々の上に落ちた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「空から」とも訳せる。ギリシア語は「天」と「空」のどちらも意味し得るが、ここでは黙示的な幻の文脈に合わせて「天」とした。
    reason: lexical_alternative
  - marker: b
    text: 「ともしびのように燃える」とも訳せる。ギリシア語は、たいまつまたはともしびを指し得るが、燃えながら落ちる星の像には「たいまつ」がよく合う。
    reason: lexical_alternative
  - marker: c
    text: 「星」は幻の像のまま訳した。それが天使的存在、隕石のような物体、または象徴的な勢力のどれを表すかについては、解釈が分かれる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: ラッパを吹いた
  rationale: σαλπίζωの意味を、現代日本語で自然かつ明確に表す。文脈上、ラッパを鳴らす動作を指す。
- source_word: ἀστὴρ μέγας
  choice: 大きな星
  rationale: μέγαςの規模と印象の強さを保ちつつ、普通の日本語として明瞭に訳す。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: οὐρανόςには「天」と「空」の両義がある。黙示的幻の格調を保つため本文では「天」とした。
- source_word: καιόμενος ὡς λαμπάς
  choice: たいまつのように燃える
  rationale: καιόμενοςの継続的な燃焼と、λαμπάςによる直喩をそのまま保つ。λαμπάςはこの激しく燃える像では「ともしび」より「たいまつ」が適切である。
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: 落ちて来て……落ちた
  rationale: 原文にあるἔπεσενの反復を保ち、最初を天からの下降、二度目を川と水源への落下として自然に示す。
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: 川々の三分の一の上に
  rationale: τὸ τρίτονの数量的意味を「三分の一」と明示する。本文では後続句とまとめて「川々の三分の一と、水の源の上に」とした。
- source_word: πηγὰς τῶν ὑδάτων
  choice: 水の源
  rationale: πηγήが指す泉・湧き出る源を、簡潔で理解しやすく表す。複数形の意味は集合的な「源」で自然に伝わる。
theological_decisions:
- issue: 落下する星が何を指すか
  choice: 解釈を加えず「大きな星」と訳す
  alternative: 天使的存在、隕石のような物体、または象徴的な支配者・勢力と明示する
  rationale: 本文はここでその象徴的指示対象を明言していないため、星という幻の像と解釈上の緊張を保持する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学にふさわしい簡潔で荘重な調子を保った。「御使い」は聖書文体として広く理解される表現を採用し、星の象徴的意味は本文で解釈しない。脚注記号は対応する語句の直後に置いた。
