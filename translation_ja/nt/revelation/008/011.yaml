source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: ja
  text: その星の名は「ニガヨモギ」[a]という。水の三分の一がニガヨモギとなり、多くの人がその水のために死んだ[b]。水が苦くされたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ニガヨモギ」は強い苦味を持つ植物。ギリシャ語では、星の名と水について同じ語が繰り返されている。
    reason: lexical_alternative
  - marker: b
    text: 原文では最後の「苦くされた」の主語は明示されていない。文脈上は水を指すと考えられるが、形の上では人々を指す可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ὄνομα τοῦ ἀστέρος
  choice: その星の名
  rationale: 属格関係を自然な現代日本語で表し、黙示的な星のイメージをそのまま保つ。
- source_word: λέγεται
  choice: という
  rationale: 受動形の機能を、日本語で名称を示す自然な言い方にした。「と呼ばれる」より簡潔で、意味を損なわない。
- source_word: Ἄψινθος / ἄψινθον
  choice: ニガヨモギ／ニガヨモギのように
  rationale: ἄψινθοςは強い苦味を持つ植物を指す。星の固有名と水の変化に同じ語を用いて、原文の反復と両者の結び付きを保った。水そのものが文字どおり植物になったとの不自然な理解を避けるため、後者には「のように」を補った。
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: 水の三分の一
  rationale: 部分を表す構文と数量を、明快で自然な日本語にした。
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: 多くの人
  rationale: 性別を限定しないἄνθρωποιの意味を保ち、現代日本語として自然に表現した。
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: その水のために死んだ
  rationale: ἐκが示す原因を明示しつつ、原文にない「飲んで」を加えなかった。
- source_word: ὅτι ἐπικράνθησαν
  choice: 水が苦くされたからである
  rationale: 受動態を保ち、文脈上の主語である水を日本語では明示した。
theological_decisions:
- issue: ἐπικράνθησανの主語
  choice: 水が苦くされた
  alternative: 人々が苦しめられた、または苦くされた
  rationale: 動詞は複数形で主語が明示されないため形の上では複数の先行詞があり得るが、直前の「水」と、水が原因で死んだという文脈から、水を指す理解が最も自然である。脚注で原文の省略と別解の余地を示した。
- issue: εἰς ἄψινθονの比喩性
  choice: ニガヨモギのようになり
  alternative: ニガヨモギになり
  rationale: 原文の具体的な植物イメージと語の反復を保ちながら、日本語で水が植物そのものに変化したと限定的に読まれるのを避け、苦く有害になったという文脈上の結果を伝える。
translation_notes:
  register: 明快な現代標準語を用いながら、黙示文学にふさわしい簡潔で重みのある調子と、原文の反復を保った。星名には一般に理解しやすい植物名「ニガヨモギ」を採用した。
