  to: 第一の天使がラッパを吹いた。すると、血の混じった雹と火が生じ、それは大地[a]の上に投げられた。大地の三分の一が焼き尽くされ、木々の三分の一が焼き尽くされ、緑の草はすべて焼き尽くされた。
