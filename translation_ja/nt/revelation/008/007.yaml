id: REV.8.7
reference: Revelation 8:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: ja
  text: 第一の天使がラッパを吹いた。すると、血の混じった雹と火が生じ、それは大地[a]の上に投げられた。大地の三分の一が焼き尽くされ、木々の三分の一が焼き尽くされ、緑の草はすべて焼き尽くされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「陸地」または「土地」とも訳せる。ギリシア語のγῆは「大地」と「陸地・土地」のいずれも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: 第一の者
  rationale: 直前の文脈では七人の天使の第一を指すが、ギリシア語本文には「天使」が明記されていないため、省略を保ちながら日本語として理解できる形にした。
- source_word: ἐσάλπισεν
  choice: ラッパを吹いた
  rationale: σαλπίζωはラッパを鳴らすことを表す。直前の文脈で各天使がラッパを持っているため、自然な現代日本語で表現した。
- source_word: ἐγένετο
  choice: 生じ
  rationale: 単に存在したというより、雹と火が現れる出来事を導入する語なので、出来事としての動きを示した。
- source_word: χάλαζα καὶ πῦρ
  choice: 雹と火
  rationale: 黙示的な描写を解釈で言い換えず、二つの破壊的な要素をそのまま訳した。
- source_word: μεμιγμένα ἐν αἵματι
  choice: 血の混じった
  rationale: 雹と火が血と混じり合った状態を、鮮烈なイメージを保つ自然な日本語で表した。
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: 大地に投げ落とされた
  rationale: 受動態と下方への動きを保った。ギリシア語の動詞は単数形だが、日本語では主語を繰り返さず、雹と火から成る現象全体が投げ落とされたという表現にした。
- source_word: τὸ τρίτον τῆς γῆς
  choice: 大地の三分の一
  rationale: 部分を示す表現を現代日本語の自然な分数表現にした。γῆの範囲には語義上の幅があるため、脚注で別訳を示した。
- source_word: κατεκάη
  choice: 焼き尽くされた
  rationale: κατακαίωの、激しく焼いて滅ぼすという強い意味を反映し、三度の反復も保った。
- source_word: τὸ τρίτον τῶν δένδρων
  choice: 木々の三分の一
  rationale: 部分を示す属格表現を自然な日本語にし、個々の木から成る集合であることを「木々」で表した。
- source_word: πᾶς χόρτος χλωρός
  choice: 緑の草はすべて
  rationale: χόρτοςを具体的な「草」、χλωρόςを「緑の」とし、全体性を明確に表した。
theological_decisions:
- issue: 黙示的な裁きにおけるγῆの範囲
  choice: 大地
  alternative: 陸地、地
  rationale: γῆは文脈により地球的な「大地」と限定された「陸地・土地」のどちらも表し得る。ここでは黙示録の宇宙的規模の裁きという文脈から「大地」を本文に採用したが、地理的範囲を断定しすぎないよう別訳を脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、黙示文学の荘重で鮮烈な調子を保った。「第一の者」によって原文の省略を残し、「焼き尽くされた」の反復によって原文のリズムと裁きの厳しさを表した。
