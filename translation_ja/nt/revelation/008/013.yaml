id: REV.8.13
reference: Revelation 8:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: ja
  text: また私は見た。そして聞いた。中天[b]を飛んでいる一羽の鷲[a]が、大声でこう言った。「地上に住む者たちに、災いだ、災いだ、災いだ。これからラッパを吹こうとしている三人の天使たちが鳴らす、残りのラッパの音のゆえに。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本では「一羽の鷲」ではなく「一人の天使」となっている。
    reason: textual_variant
  - marker: b
    text: 空の最も高い所、または頭上に広がる空を指す。別訳「大空の中ほど」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: 鷲
  rationale: 通常の意味である「鷲」を採用した。腐肉を食べる鳥を特定する文脈ではないため、「禿鷲」とはしない。単数は「一羽」で明示した。
- source_word: μεσουρανήματι
  choice: 中天
  rationale: 空の最も高い所、または頭上に広がる空を指す黙示文学的な語感を保つため、「中天」とした。意味は脚注で補った。
- source_word: φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 公に響き渡る宣告の強さを、自然な現代日本語で表した。
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: 災いだ、災いだ、災いだ
  rationale: 預言的な切迫感と修辞的強調を保つため、三度の反復をそのまま残した。
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: 地上に住む者たち
  rationale: 黙示録で繰り返される表現とのつながりを保ちつつ、自然で明瞭な日本語とした。
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: その残りのラッパの音のゆえに
  rationale: ἐκを文脈上の原因として「ゆえに」と訳し、φωνῶνはラッパについて用いられているため「音」とした。
- source_word: τῶν τριῶν ἀγγέλων
  choice: 三人の天使たち
  rationale: 黙示的な天上の存在を指す文脈なので、現代の一般読者に明瞭な「天使」とした。
- source_word: τῶν μελλόντων σαλπίζειν
  choice: 今にもラッパを吹こうとしている
  rationale: μέλλωと不定詞が表す差し迫った動作を「今にも……しようとしている」で表し、σάλπιγξの動作を日本語として自然な「ラッパを吹く」とした。
theological_decisions:
- issue: 空を飛ぶ告知者についての本文異読
  choice: 一羽の鷲
  alternative: 一人の天使
  rationale: 指定されたSBLGNT本文のἀετοῦに従った。一部写本の「天使」は本文に採用せず、重要な異読として脚注に残した。
- issue: 三重の「災い」の対象と原因
  choice: 地上に住む者たちへの災いを、残る三つのラッパの音に結びつけた
  alternative: 三重の「災い」を三人の天使または三つのラッパに一対一で明示的に対応させる
  rationale: 原文は三重の反復と残る三人の天使を並べるが、一対一の対応を明言してはいないため、その関係を解釈で固定しなかった。
translation_notes:
  register: 明瞭な現代標準語を基調としながら、黙示録の荘厳で切迫した宣告調を保った。「中天」はやや格調のある語だが、脚注で意味を説明した。三重の反復は省略せず、声に出した際の強さも維持した。
