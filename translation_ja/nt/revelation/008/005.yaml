id: REV.8.5
reference: Revelation 8:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: ja
  text: すると、御使いは香炉を取り、祭壇の火で香炉を満たし、それを地に投げつけた。すると、雷鳴と音[a]と稲妻と地震が起こった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「声」。ギリシア語は、人の声のような明瞭な声を指すことも、神の顕現を描く場面での音や響きを指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: 取った
  rationale: 完了形だが、続くアオリスト形とともに幻の出来事を順に語っているため、現代日本語では自然な過去の動作として訳した。
- source_word: λιβανωτόν
  choice: 香炉
  rationale: この祭儀的文脈では、香をたき、祭壇の火を入れる器を指す。簡潔で定着した訳語である。
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: 祭壇の火をそれに満たして
  rationale: 火の出所である祭壇を明示しつつ、器を火で満たしたという関係を自然な日本語で表した。
- source_word: θυσιαστηρίου
  choice: 祭壇
  rationale: 神殿・祭儀のイメージにおける標準的な訳語である。
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: 地に投げつけた
  rationale: βάλλωの力強い動作を「投げつけた」で表し、γῆは黙示録の宇宙的な裁きの場面に合う「地」とした。
- source_word: ἐγένοντο
  choice: 起こった
  rationale: 列挙された現象が生じたことを、簡潔で自然な日本語として表した。
- source_word: βρονταὶ
  choice: 雷鳴
  rationale: 複数形が示す雷の響きを、日本語で集合的かつ自然に表現できる。
- source_word: φωναὶ
  choice: 物音
  rationale: φωνήには「声」と「音」の双方の意味がある。話者が示されない神顕現的な列挙なので、発話と断定しない「物音」を本文に採用し、別訳を脚注に残した。
- source_word: ἀστραπαὶ
  choice: 稲妻
  rationale: 複数の閃光を、日本語で自然に総称する表現である。
- source_word: σεισμός
  choice: 地震
  rationale: 単数名詞の意味をそのまま明確に表す標準的な訳語である。
theological_decisions:
- issue: 黙示的な裁きの文脈におけるγῆの意味
  choice: 地
  alternative: 地面／土地
  rationale: 宇宙的規模の裁きのイメージに合い、「地面」ほど狭くも「土地」ほど地域的でもない表現を採用した。
- issue: 神顕現的な定型表現におけるφωναίの意味
  choice: 物音
  alternative: 声
  rationale: 話者が特定されていないため明確な発話とは断定せず、聴覚的現象として訳した。一方、人格的な「声」の可能性は脚注で保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。接続詞の反復は原文の連続性を適度に保ち、「投げつけた」で場面の劇的な力を表した。脚注記号[a]は該当語の直後に置いた。
