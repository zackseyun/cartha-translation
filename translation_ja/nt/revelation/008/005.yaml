  to: すると、御使いは香炉を取り、祭壇の火で香炉を満たし、それを地に投げつけた。すると、雷鳴と音[a]と稲妻と地震が起こった。
  rationale: 祭壇から取った火で香炉を満たすという原文の関係を、自然で明確な日本語の構文に改めた。また、φωναίには「声」と「音」の両義があるため、本文を中立的な「音」とし、もう一方の可能性を脚注で保持した。脚注記号は該当語「音」の直後に置き、原文および英語監査記録の曖昧さの扱いに対応させた。
