id: REV.8.9
reference: Revelation 8:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀπέθανε τὸ τρίτον ⸀τῶν κτισμάτων τῶν ἐν τῇ θαλάσσῃ, τὰ ἔχοντα ψυχάς, καὶ τὸ τρίτον τῶν πλοίων ⸀διεφθάρησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: ja
  text: 海にいる命を持つ被造物の三分の一が死に[a]、船の三分の一が破壊された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「魂（または命）を持つもの」。または「生き物」。
    reason: ψυχήは文脈により「魂」「命」「生きている存在」を意味し得るため。
lexical_decisions:
- source_word: ἀπέθανε
  choice: 死に
  rationale: ἀποθνῄσκωのアオリストとして、生命ある海の被造物が死んだことを直接かつ自然に表す。
- source_word: τὸ τρίτον
  choice: 三分の一
  rationale: 数量を表す部分表現を、現代日本語で明確に訳した。
- source_word: κτισμάτων
  choice: 被造物
  rationale: κτίσμαの「造られたもの」という語義を保ちつつ、後続の「命あるもの」によって、ここでは海中の生きた被造物を指すことを示した。
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: 海にいる
  rationale: 場所を示す句を自然な連体表現とした。生命あるものが対象なので、「ある」より「いる」が文脈に適する。
- source_word: τὰ ἔχοντα ψυχάς
  choice: すなわち命あるもの
  rationale: 同格的な限定を明示し、ψυχήをこの文脈で生命を持つ存在という意味に訳した。原語の「魂／命」の幅は脚注に残した。
- source_word: πλοίων
  choice: 船
  rationale: πλοῖονの通常の意味を、簡潔で一般的な現代日本語で表した。
- source_word: διεφθάρησαν
  choice: 滅ぼされた
  rationale: この受動形は海難の中で船が破壊されたことを表すため、「損なわれた」や道徳的な「堕落した」ではなく、破壊を示す語を選んだ。
theological_decisions:
- issue: 海の被造物について用いられたψυχάςの訳し方
  choice: 本文では「命あるもの」とし、脚注で直訳上の「魂／命」を示す。
  alternative: 「魂を持つもの」または「生き物」
  rationale: ここで動物の魂に関する体系的な主張を読み込まず、生命ある存在と無生物の船との対照を自然に示す。同時に、ψυχήという語の幅を脚注で可視化し、原文の含みを消さない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の荘重さを保った。「被造物」はやや聖書的な語だが、κτίσμαの語感を保持し、後続の説明によって意味を明確にしている。
