source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: ja
  text: 香の煙は、聖なる者たちの祈りとともに、御使いの手から神の御前に立ちのぼった[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立ちのぼった」は、「上った」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 原文は「聖なる者たちの祈りとともに」。香の煙と祈りを結びつけているが、この節では両者を明示的に同一のものとはしていない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: 立ち上った
  rationale: 煙が上方へ動く具体的な情景を、現代日本語として自然に表す。アオリストの出来事としての描写も保っている。
- source_word: καπνὸς
  choice: 煙
  rationale: 通常の具体的意味をそのまま採り、黙示的な象徴を訳文で解釈しすぎない。
- source_word: θυμιαμάτων
  choice: 香
  rationale: 祭儀でたかれる香を指す語であり、日本語では集合的に「香」とするのが自然である。
- source_word: ταῖς προσευχαῖς
  choice: 祈りとともに
  rationale: 与格が示す結びつきを保ちつつ、香と祈りが同一である、祈りを運ぶ、祈りのためである、などとは限定しない。
- source_word: τῶν ἁγίων
  choice: 聖なる者たち
  rationale: 神に属する人々を指す表現として、後代の列聖者に限定される印象を避けながら、ἅγιοι の「聖なる」という語義を明示する。
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: 御使いの手から
  rationale: 幻の中の具体的な「手」の像を保持する。「御使い」は聖書本文にふさわしい、一般に理解可能な呼称である。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の御前へと
  rationale: 神の臨在の前へ煙が上る方向と到達点を自然な日本語で示し、祭儀的な情景を保つ。
theological_decisions:
- issue: 香と祈りとの関係
  choice: 「祈りとともに」と訳し、両者の結びつきは示すが同一視しない。
  alternative: 「祈りである香の煙」「祈りのための香の煙」
  rationale: ギリシア語は香の煙と祈りを関連づけるが、この節自体は両者を明示的に同一視せず、関係の性質も一つに限定していないため。
- issue: 「聖なる者たち」の指示対象
  choice: 神に属する人々を広く指す「聖なる者たち」とした。
  alternative: 「聖徒たち」「神の聖なる民」
  rationale: 後代の特定制度における聖人だけを意味するとの誤解を避けつつ、原語の聖別の意味を保つため。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「御使い」「御前」により聖書的な荘重さを保ちつつ、文全体は日常の読者にも理解しやすくした。
