id: REV.8.1
reference: Revelation 8:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: ja
  text: 彼が第七の封印を開いたとき、天には半時間ほどの静寂が訪れた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: とき
  rationale: 本来は不定的・反復的な意味を帯びうるが、ここでは第七の封印を開く一回の出来事を指す物語文脈なので、自然な時間表現「とき」とした。
- source_word: ἤνοιξεν
  choice: 開いた
  rationale: ἀνοίγωの基本的な意味をそのまま表す。「解いた」「破って開いた」とすると、原文に明示されない開封方法を加えるため避けた。
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: 第七の封印
  rationale: σφραγίςを黙示録の巻物を閉じている「封印」とし、序数を自然な日本語の連体表現で示した。
- source_word: ἐγένετο
  choice: 訪れた
  rationale: ある状態が生じたことを表す。単に「静寂があった」よりも出来事の発生を示しつつ、「生じた」より自然で荘厳な日本語となる。
- source_word: σιγὴ
  choice: 静寂
  rationale: 単なる音量の低下ではなく、場面の厳粛で劇的な沈黙を表すため「静けさ」ではなく「静寂」とした。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天には
  rationale: ここでοὐρανόςは空ではなく天上の領域を指す。「には」によって、その領域に静寂が生じたことを自然に示した。
- source_word: ὡς ἡμιώριον
  choice: 半時間ほど
  rationale: ὡςの近似とἡμιώριονの時間幅を簡潔に表す。「約三十分」より原文の時間表現に近く、黙示文学の文体にも合う。
theological_decisions:
- issue: ἤνοιξενの省略された主語の指示対象
  choice: 「彼が」とし、固有の指示対象を節内で明示しない
  alternative: 「小羊が」と補う
  rationale: ギリシャ語は三人称単数の主語を省略しており、先行文脈では小羊を指す。しかし、この節自体にない名詞を補わず、文脈上のつながりと原文の含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の厳粛な場面に合う品位を保った。「半時間」は日常語の「三十分」より原文の表現を映し、「静寂が訪れた」はἐγένετοの出来事性を自然に伝える。注記を必要とするほど重要な異読・語義上の曖昧さはないため、脚注は付さない。
