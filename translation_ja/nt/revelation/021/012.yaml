    rationale: 「イスラエルの民」は υἱῶν Ἰσραήλ の語彙的な代案ではなく、共同体への解釈的な言い換えである。「子孫」も「子ら」とは異なる関係を前景化する。英語監査記録の traditional alternative は、日本語本文の「子ら」にすでに実質的に包摂されており、この脚注を維持する必要はない。
  - severity: low
    issue: 「御使い」がやや教会語的である。
    rationale: 意味は正確だが、対象方針である明瞭な現代標準語に合わせ、「天使」とするほうが自然である。
