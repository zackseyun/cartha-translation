id: REV.21.12
reference: Revelation 21:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔχουσα τεῖχος μέγα καὶ ὑψηλόν, ἔχουσα πυλῶνας δώδεκα, καὶ ἐπὶ ⸂τοῖς πυλῶσιν⸃ ἀγγέλους δώδεκα, καὶ ὀνόματα ἐπιγεγραμμένα ἅ ⸀ἐστιν τῶν δώδεκα ⸀φυλῶν υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/012.yaml
  text: having a great and high wall, having twelve gates, and at the gates twelve angels, and names inscribed, which are those of the twelve tribes of the sons of Israel.
translation:
  language: ja
  text: その都には、大きく高い城壁があり、十二の門があった。門には十二人の天使がおり、また名が刻まれていた。それは、イスラエルの子らの十二部族の名であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχουσα
  choice: その都には……があり／あった
  rationale: 女性単数の分詞として前節の都を修飾している。日本語では主題を補い、存在構文にすることで、描写の流れを自然かつ明確にした。
- source_word: τεῖχος μέγα καὶ ὑψηλόν
  choice: 大きく高い城壁
  rationale: μέγα と ὑψηλόν の二つの形容をともに保持し、城壁の規模と高さを区別して伝える。
- source_word: πυλῶνας δώδεκα
  choice: 十二の門
  rationale: 城郭都市の入口を表す文脈に即した、標準的で自然な訳語。
- source_word: ἐπὶ τοῖς πυλῶσιν
  choice: 門には
  rationale: ἐπί＋与格の場所的用法を表す。「門の上に」として御使いの位置を不必要に限定せず、門のところにいるという意味を自然に示す。
- source_word: ἀγγέλους δώδεκα
  choice: 十二人の御使い
  rationale: ἀγγέλους を黙示録の文脈で通常の「御使い」とし、人格的存在を数える日本語として「人」を用いた。
- source_word: ὀνόματα ἐπιγεγραμμένα
  choice: 名が刻まれていた
  rationale: ἐπιγεγραμμένα の「上に書き記す、銘記する」という意味を、建造物の情景に適した「刻む」で表した。原文が刻まれた場所をこの句で明示しない点も保持した。
- source_word: ἅ ἐστιν
  choice: それは……の名であった
  rationale: 関係節が、刻まれた名が何であるかを同定していることを、日本語で明瞭に表した。
- source_word: φυλῶν
  choice: 部族
  rationale: イスラエルの十二の区分を指す標準的な聖書用語。
- source_word: υἱῶν Ἰσραήλ
  choice: イスラエルの子ら
  rationale: υἱῶν の家族的・男性形の表現を残しつつ、固定的な共同体呼称として読めるようにした。より説明的な「子孫」や一般化した「民」を本文には採らなかった。
theological_decisions:
- issue: υἱῶν Ἰσραήλという共同体呼称の訳し方
  choice: イスラエルの子ら
  alternative: イスラエルの子孫／イスラエルの民
  rationale: ギリシア語の υἱῶν は明示的に「息子たち、子ら」を意味するため、その家族的表現を本文に保持した。一方、ここではヤコブの実子だけでなく、彼らに由来する十二部族を共同体として指すため、代案を脚注に示した。
- issue: 刻まれた名の場所
  choice: 刻まれた場所を明示しない
  alternative: 門に名が刻まれていた
  rationale: 文脈上は門との結び付きが強いが、ὀνόματα ἐπιγεγραμμένα 自体には刻まれた面を示す語句がない。本文では原文の省略を保ち、解釈を過度に限定しなかった。
translation_notes:
  register: 明瞭で格調ある現代標準語。前節から続く分詞構文は、日本語として自然な存在構文に整えた。「御使い」は聖書文体として広く理解される語を採用し、全体として過度に古風な語順や文末を避けた。
