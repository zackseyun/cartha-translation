  source_fidelity: 本文は、都を修飾する二つの分詞、十二の門、門にいる十二人の天使、刻まれた名、そしてその名がイスラエルの子らの十二部族に属することを、全体として正確に伝えている。「イスラエルの子ら」は υἱῶν Ἰσραήλ の家族的表現を保つ適切な訳である。ただし脚注の「民」は原文の字義的代案ではなく、また「子孫」はここでの固定的な表現を別の関係に言い換えるため、削除するのがよい。
  naturalness: 「御使い」は聖書的慣用としては理解されるが、明瞭な現代標準語という目標には「天使」のほうが自然で広く通じる。本文の文の流れは自然であり、「あり／あった」「おり／刻まれていた」という描写的な連結も日本語として許容される。
  terminology: 「城壁」「門」「部族」は適切である。「天使」は ἀγγέλους の標準的かつ現代的な訳語である。「イスラエルの子ら」は、神学的に中立でありつつ、原文の υἱῶν を不必要に中和しない。
  issues:
