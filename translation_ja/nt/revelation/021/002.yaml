id: REV.21.2
reference: Revelation 21:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: ja
  text: また私は、聖なる都、新しいエルサレムが、夫のために飾られた花嫁のように整えられ、神のもとから、天から下って来るのを見た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: 聖なる都
  rationale: 「都」は黙示録の壮大な都市像にふさわしく、「聖なる」はἁγίανの聖別と神への帰属の意味を保つ。
- source_word: Ἰερουσαλὴμ καινὴν
  choice: 新しいエルサレム
  rationale: 固有名は音写し、καινήνは自然な現代日本語で「新しい」と訳した。日本語には英語の大文字・小文字による称号の区別がないため、本文上で不要な解釈を加えない。
- source_word: εἶδον
  choice: 私は…見た
  rationale: アオリストの単純な知覚をそのまま表し、「見よ」など原文にない語を加えない。
- source_word: καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: 神のもとから天を下って来る
  rationale: 二つの起点表現を区別し、ἀπὸ τοῦ θεοῦを「神のもとから」、ἐκ τοῦ οὐρανοῦを日本語として自然な「天を下って」とした。「来る」により幻を見る者の側への下降を明瞭にする。
- source_word: ἡτοιμασμένην
  choice: 整えられ
  rationale: 完了受動分詞が示す、すでに準備の整った状態を簡潔に表す。
- source_word: ὡς νύμφην
  choice: 花嫁のように
  rationale: ὡςの比較を明示し、都市と花嫁の象徴的関係を同一視へと解釈しすぎない。
- source_word: κεκοσμημένην
  choice: 美しく装った
  rationale: 婚礼に向けて身を飾るκοσμέωの意味を、現代日本語で自然かつ品位ある表現にした。
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: 夫のために
  rationale: 婚礼の文脈ではἀνήρは「夫」が自然であり、「花婿」という原文より限定的な語への置換を避ける。
theological_decisions:
- issue: 「新しいエルサレム」を固定した終末論的称号として扱うか
  choice: 「新しいエルサレム」とし、記号や括弧による特別な称号化はしない
  alternative: 「新エルサレム」という固定称号風の表現
  rationale: ギリシア語は固有名Ἰερουσαλήμを形容詞καινήνが修飾する。「新しい」はその記述的な力を保ち、日本語としても意味が明瞭である。
- issue: 都と花嫁の関係を教会論的同一視として明示するか
  choice: 「花嫁のように」という比喩のまま保つ
  alternative: 「教会である花嫁として」などと説明的に訳す
  rationale: この節はὡςによって比較を示しているため、象徴の指示対象を本文中で確定せず、黙示録が持つ神学的含意と緊張を保つ。
- issue: 下降の起源をどう表すか
  choice: 「神のもとから天を下って来る」
  alternative: 「天におられる神のもとから下って来る」
  rationale: 後者は神の所在について原文以上の統語的結び付きを加える。「神のもとから」と「天を下って」を保ち、二つの前置詞句を過度に説明しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、幻の荘厳さを保った。「聖なる都、新しいエルサレム」という同格表現を維持し、象徴を説明的に言い換えなかった。
