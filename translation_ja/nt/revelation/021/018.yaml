  text: ⸀καὶ ἡ ἐνδώμησις τοῦ τείχους αὐτῆς ἴασπις, καὶ ἡ πόλις χρυσίον καθαρὸν ὅμοιον ὑάλῳ καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/018.yaml
  text: And the material of its wall was jasper[a], and the city was pure gold[b], like pure glass.
translation:
  language: ja
  text: 城壁の建材は碧玉であり[a]、都は澄み切ったガラスのような純金であった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「城壁の造りは碧玉であり」とも訳せる。ギリシア語は、城壁の建造・構造、またはその材料を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「純粋なガラスのような純金」とも訳せる。ここでの比較は、都の輝かしい透明感を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδώμησις
  choice: 造り
  rationale: 建造物の造作・構造、またはその材料を指し得る語。「造り」は日本語として自然で、構造と材質の両面を完全には切り分けず、続く「碧玉」と結び付けられる。
- source_word: τεῖχος
  choice: 城壁
  rationale: 都市を囲む壁を指す文脈なので、単なる「壁」より「城壁」が明確で自然。
- source_word: ἴασπις
  choice: 碧玉
  rationale: 聖書翻訳で定着した宝石名。古代の石が現代の鉱物分類上の碧玉と厳密に一致するとは限らないが、原語の宝石名を慣用的に表す。
- source_word: χρυσίον καθαρόν
  choice: 純金
  rationale: 金という材質と、その純粋さを簡潔かつ自然に表す。
- source_word: ὅμοιον
  choice: のような
  rationale: 類似・比較を示す原語を自然な日本語で保持する。
- source_word: ὕαλῳ καθαρῷ
  choice: 澄み切ったガラス
  rationale: καθαρόςは字義的には「純粋な」だが、ガラスとの組み合わせでは透明で澄んだ視覚的性質を表すと考えられる。「澄み切った」はその輝く透明感を自然に伝える。
theological_decisions: []
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「城壁」「都」は黙示録の壮大な都市描写に適した語調とした。「造り」によって原語の構造・材料の幅を保ち、「でできていた」を後半に補って日本語として材質描写を明確にした。
