id: REV.21.21
reference: Revelation 21:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: ja
  text: 十二の門は十二の真珠であり、門はそれぞれ一個の真珠からできていた。また、都の大通り[a]は純金で、透き通ったガラスのようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「都の広い通り」または「都の広場」とも訳せる。
    reason: πλατεῖαは幅の広い通りを指すことも、開けた公共空間を指すこともあるため。
lexical_decisions:
- source_word: πυλῶνες
  choice: 門
  rationale: 新しいエルサレムの建造物を指す文脈で、門または門構えを意味する。日本語では簡潔で定着した「門」が自然である。
- source_word: μαργαρῖται / μαργαρίτου
  choice: 真珠／真珠
  rationale: 語の通常の意味をそのまま訳し、十二の門と十二の真珠の対応、および各門が一個の真珠から成るという単数表現を保った。
- source_word: ἀνὰ εἷς ἕκαστος
  choice: それぞれ一個
  rationale: ἀνάとεἷςの配分的意味をἕκαστοςが強めているため、各門につき一個ずつという強調を自然な日本語で示した。
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: 一個の真珠からできていた
  rationale: ἐξはここで材料・由来を表す。日本語では「からできていた」が明瞭であり、ἑνόςを「一個」として明示した。
- source_word: πλατεῖα
  choice: 大通り
  rationale: 幅の広い道や公共の開けた場所を表し得る語である。都市の描写として自然な「大通り」を本文に採用し、「広い通り」「広場」の可能性を脚注に残した。
- source_word: χρυσίον καθαρὸν
  choice: 純金
  rationale: 金の純粋さを表す日本語として簡潔で定着している。
- source_word: ὡς ὕαλος διαυγής
  choice: 透き通ったガラスのよう
  rationale: διαυγήςの透明で澄んだ性質を「透き通った」で表し、金がガラスのように透明であるという黙示的な比喩の驚きを保った。
theological_decisions:
- issue: πλατεῖαが描く都の空間の性質
  choice: 単数の「大通り」と訳し、壮麗な公共道路の像を示す。
  alternative: 「広い通り」または「広場」
  rationale: これは主に語彙上の曖昧さであり、特定の都市構造や教理を確定するべきではない。本文では自然な都市描写を採り、他の可能性を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい格調を保った。「門はそれぞれ」として重複を抑えつつ、原文の配分的強調を維持した。
