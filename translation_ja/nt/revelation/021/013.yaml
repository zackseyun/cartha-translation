source:
  edition: SBLGNT
  text: ἀπὸ ⸀ἀνατολῆς πυλῶνες τρεῖς, καὶ ἀπὸ βορρᾶ πυλῶνες τρεῖς, καὶ ἀπὸ νότου πυλῶνες τρεῖς, καὶ ἀπὸ δυσμῶν πυλῶνες τρεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: ja
  text: 東側に門が三つ、北側に門が三つ、南側に門が三つ、西側に門が三つあった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「東から……北から……南から……西から」。ここでは、門が設けられている側を示す自然な日本語として「東側に」などと訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς / ἀπὸ βορρᾶ / ἀπὸ νότου / ἀπὸ δυσμῶν
  choice: 東側に／北側に／南側に／西側に
  rationale: ἀπόを字義どおり「～から」とすると、日本語では起点や移動を示すように響く。この文脈では都の各方角の側面に門が配置されていることを表すため、「～側に」とした。
- source_word: πυλῶνες
  choice: 門
  rationale: 城壁に設けられた入口または門構えを指す。ここでは簡潔で自然な「門」が最適であり、「門楼」などは原文以上に構造を限定する。
- source_word: τρεῖς
  choice: 三つ
  rationale: 各辺の門の数を示す基数。日本語では門を自然に数える「三つ」とし、四方にわたる反復を保った。
- source_word: καὶ ... καὶ ... καὶ ...
  choice: 読点で並列し、同一構文を反復
  rationale: ギリシア語のκαίの反復が生む整然とした列挙は、各句を同形で繰り返すことで保持した。日本語で「また」を毎回置くより自然でありながら、対称性を明瞭に伝える。
theological_decisions:
- issue: 新しいエルサレムの門の空間的描写
  choice: 四方それぞれに三つの門があるという建築的な列挙として訳す
  alternative: イスラエルの部族配置やエゼキエル書の都との象徴的関連を訳文に明示する
  rationale: 本節そのものは方角ごとの門を列挙している。正典的な象徴性はあり得るが、それを本文に付加せず、解釈の余地を残す。
- issue: 動詞を明示するか
  choice: 文末に「あった」を補う
  alternative: 「東側に門が三つ、……」という名詞句の列挙だけにする
  rationale: 原文は動詞を省略した測量的な列挙だが、直前の文脈で描写される都の構造を現代日本語で明瞭に伝えるため、文末だけに存在表現を補った。反復の簡潔さは保たれる。
translation_notes:
  register: 明快で格調ある現代標準日本語。四方を同じ語順で列挙し、原文の均整と測量的な響きを保った。脚注記号は節末に置き、四つの方角表現すべてに関わる注であることを示した。
