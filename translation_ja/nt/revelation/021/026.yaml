id: REV.21.26
reference: Revelation 21:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: ja
  text: また、彼らは諸国の栄光と誉れを、そこ[a]へ携えて来る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そこ」は新しいエルサレムを指す。ギリシア語では女性形で、都を花嫁として描く周辺の表現とも響き合う。
    reason: 原文の指示対象と女性擬人化の含みを、日本語本文の自然さを損なわずに示すため。
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前節から続く描写を自然につなぐ接続語として訳した。文中の二つの名詞の並列は日本語の「と」で示した。
- source_word: οἴσουσιν
  choice: 彼らは……携えて来る
  rationale: φέρωの未来・能動形。外から都の中へ運ぶ動きを表しつつ、単なる輸送よりも荘重な文脈に合う「携えて来る」とした。三人称複数は「彼らは」で明示した。
- source_word: τὴν δόξαν
  choice: 栄光
  rationale: 黙示録における光輝と尊厳の響きを保つ、聖書語としても一般に理解される訳語である。
- source_word: τὴν τιμὴν
  choice: 誉れ
  rationale: δόξαと対を成す尊敬・栄誉の意味を表す。「富」などに限定せず、原語の広がりを保った。
- source_word: τῶν ἐθνῶν
  choice: 諸国の
  rationale: 更新された世界の諸民族・諸国を広く指す表現として訳した。「異邦人」としてユダヤ人との対比に狭めることを避けた。
- source_word: εἰς αὐτήν
  choice: そこへ
  rationale: 指示対象である新しいエルサレムを受ける自然な日本語。原文にない「都」を本文へ補わず、文脈的な指示を保った。
theological_decisions:
- issue: αὐτήνの指示対象と都の女性擬人化
  choice: 本文では新しいエルサレムを指す「そこへ」とした。
  alternative: 「彼女の中へ」または「都の中へ」
  rationale: ギリシア語の女性形は、先行する「都」が文法上女性名詞であることに対応し、周辺文脈の花嫁としての擬人化とも響き合う。日本語では「彼女」とすると不自然で解釈を強く押し出すため、中立的な指示語を用い、女性形の含意は脚注に残した。
- issue: 「諸国の栄光と誉れ」の意味
  choice: 「諸国の栄光と誉れ」と広い意味のまま訳した。
  alternative: 諸国の富、文化的な輝き、諸国がささげる栄誉
  rationale: 原文は、それが物質的な貢ぎ物、文化的な優れたもの、諸国からの賛美のいずれであるかを限定していない。特定の終末論的理解を持ち込まず、比喩の幅を保った。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、幻の荘重さに合う「栄光」「誉れ」「携えて来る」を用いた。「誉れ」は「名誉」より詩的だが、一般読者にも理解できる範囲である。
