id: REV.21.14
reference: Revelation 21:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ τεῖχος τῆς πόλεως ⸀ἔχων θεμελίους δώδεκα, καὶ ἐπ’ αὐτῶν δώδεκα ὀνόματα τῶν δώδεκα ἀποστόλων τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: ja
  text: 都の城壁には十二の土台[a]があり、その上には小羊の十二使徒の十二の名があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「十二の礎石」。ギリシア語は、建築物の土台または土台となる石を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: τεῖχος
  choice: 城壁
  rationale: 都市を囲む壁を指すため、単なる「壁」よりも文脈に即した自然な訳語。
- source_word: πόλεως
  choice: 都の
  rationale: 黙示録21章の聖なる都を指す属格を、簡潔で格調ある日本語にした。
- source_word: ἔχων
  choice: には…があり
  rationale: ギリシア語では分詞だが、幻の描写として自然な日本語の定形表現にした。
- source_word: θεμελίους δώδεκα
  choice: 十二の土台
  rationale: θεμέλιοςは「土台」または「礎石」を意味し得る。本文では広い意味を保つ「土台」を採用し、建築上の具体的な別訳を脚注に示した。
- source_word: ἐπ’ αὐτῶν
  choice: その上には
  rationale: 前にある十二の土台を受け、位置関係を明確かつ自然に表す。
- source_word: δώδεκα ὀνόματα
  choice: 十二の名
  rationale: 原文は名が刻まれているとは明記しないため、「銘」などを補わず直訳的に保った。
- source_word: τῶν δώδεκα ἀποστόλων
  choice: 十二使徒の
  rationale: ἀπόστολοςの新約聖書における定着した職務的意味を「使徒」で表した。日本語として冗長にならないよう「十二の使徒」ではなく「十二使徒」とした。
- source_word: τοῦ ἀρνίου
  choice: 小羊の
  rationale: 黙示録でキリストを指す重要な称号を、聖書日本語で定着した「小羊」により保持した。
theological_decisions:
- issue: ἀρνίονのキリスト論的称号
  choice: 小羊
  alternative: 子羊
  rationale: 黙示録でイエスを指す称号としての働きを保つ。「小羊」は日本語聖書で広く認識される表記であり、単なる動物描写へ平板化しにくい。
- issue: 「小羊の十二使徒」における属格の関係
  choice: 小羊の十二使徒
  alternative: 小羊に属する十二使徒
  rationale: 原文の属格が示す関係を説明的に限定せず、簡潔な属格表現のまま保持した。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、黙示文学の荘重さを保った。「都」「城壁」「小羊」「使徒」は聖書文脈にふさわしく、一般読者にも理解可能な語である。脚注記号[a]は本文の該当箇所に付した。
