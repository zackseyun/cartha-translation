source:
  edition: SBLGNT
  text: ὁ πέμπτος σαρδόνυξ, ὁ ἕκτος σάρδιον, ὁ ἕβδομος χρυσόλιθος, ὁ ὄγδοος βήρυλλος, ὁ ἔνατος τοπάζιον, ὁ δέκατος χρυσόπρασος, ὁ ἑνδέκατος ὑάκινθος, ὁ δωδέκατος ἀμέθυστος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: ja
  text: 第五はサードオニキス、第六はサルディオン[a]、第七はクリソライト、第八はベリル、第九はトパーズ、第十はクリソプレーズ、第十一はヒュアキントス[b]、第十二はアメシストであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「カーネリアン」とも訳せる。古代の宝石名が指す鉱物を厳密に特定することは難しい。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では花の「ヒュアキントス」と同じ語だが、ここでは宝石を指す。古代の宝石を現代のどの鉱物に当てるかは確定しにくい。
    reason: lexical_alternative
lexical_decisions:
- source_word: σαρδόνυξ
  choice: サードオニキス
  rationale: 古代の宝石名を、現代日本語で用いられる鉱物名に近い音写で表した。σάρδιονとの区別も保たれる。
- source_word: σάρδιον
  choice: サルディオン
  rationale: 古代の指示対象を現代鉱物のカーネリアンと断定せず、原語に近い宝石名として音写した。
- source_word: χρυσόλιθος
  choice: クリソライト
  rationale: 語源的には「金の石」だが、古代の宝石の同定には幅があるため、伝統的な宝石名の音写を採用した。
- source_word: βήρυλλος
  choice: ベリル
  rationale: 日本語で通用する標準的な鉱物名を用いた。
- source_word: τοπάζιον
  choice: トパーズ
  rationale: 日本語で広く知られる標準的な宝石名を用いた。ただし古代の名称が現代鉱物分類と完全に一致するとは限らない。
- source_word: χρυσόπρασος
  choice: クリソプレーズ
  rationale: 日本語の鉱物名として通用する名称を用い、語源を直訳した不自然な表現を避けた。
- source_word: ὑάκινθος
  choice: ヒュアキントス
  rationale: ここでは花ではなく宝石を指す。古代の宝石の色や鉱物学的同定を限定しないよう原語に近く音写した。
- source_word: ἀμέθυστος
  choice: アメシスト
  rationale: 現代日本語で一般的な宝石名を用いた。
- source_word: πέμπτος…δωδέκατος
  choice: 第五…第十二
  rationale: 原文の定冠詞付き序数による列挙を、簡潔で格調ある日本語の反復構文として保持した。
theological_decisions: []
translation_notes:
  register: 列挙のリズムを保つため「第五は…第六は…」を反復した。宝石名は現代日本語の一般的名称を優先しつつ、古代鉱物の同定が不確かな語は音写し、脚注で曖昧さを明示した。「であった」は前後の叙述との接続を自然にする補足である。
