source:
  edition: SBLGNT
  text: Καὶ ὁ λαλῶν μετ’ ἐμοῦ εἶχεν μέτρον κάλαμον χρυσοῦν, ἵνα μετρήσῃ τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: ja
  text: また、私と話していた者は、都とその門と城壁を測るために、金の測りざお[a]を持っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「金の測量用の葦」。ギリシア語の κάλαμος は本来「葦」を意味し、ここでは測量に使う棒を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: 私と語っていた者
  rationale: 冠詞付き現在分詞を自然な日本語で表し、継続中の動作を示す。文脈上の人物を「御使い」と明示せず、本文の表現を保った。
- source_word: εἶχεν
  choice: 持っていた
  rationale: ἔχω の未完了過去を、測定具を所持していたことを示す自然な日本語で訳した。手に握っていたとまでは限定しない。
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: 金の測りざお
  rationale: κάλαμος の「葦」に由来する棒状の道具という像と、μέτρον が示す測定用途を、現代の読者に明瞭な語で表した。字義的な「測りの葦」は脚注に残す。
- source_word: ἵνα μετρήσῃ
  choice: 測るために
  rationale: ἵνα と接続法が示す目的を、簡潔で自然な日本語の目的表現で明示した。
- source_word: τὴν πόλιν καὶ τοὺς πυλῶνας αὐτῆς καὶ τὸ τεῖχος αὐτῆς
  choice: 都とその門と城壁
  rationale: 三つの測定対象を並列して表した。πόλις は黙示録の荘厳な都市描写に合う「都」、πυλών は「門」、τεῖχος は都市を囲む「城壁」とした。二度目の αὐτῆς は日本語では重複を避けつつ、三者が同じ都に属することが明瞭な形にした。
theological_decisions:
- issue: 語り手を明示的に御使いと特定するか
  choice: 「私と語っていた者」とし、御使いとは補わない。
  alternative: 「私と語っていた御使い」
  rationale: 周辺文脈では御使いと分かるが、この節自体は名詞「御使い」を用いず、分詞によって人物を描写しているため、その区別を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示文学の荘厳さに合うよう πόλις を「町」ではなく「都」とした。「測りざお」は機能が直ちに伝わる表現で、原語の葦の像は脚注で保持した。
