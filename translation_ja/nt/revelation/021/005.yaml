  to: そして、王座に座っておられる方が言われた。「見よ、わたしはすべてを新しくしている。」また、その方は言われた。「書き記しなさい。これらの言葉は信頼でき、真実であるからだ。」
  rationale: 接続詞を原文の単純な連結に合わせて改め、ποιῶの現在形を日本語で自然に表すため「新しくしている」とした。それ以外の語順、話者の同定、神学的含意は変更していない。脚注を要する本文上の異文・曖昧さはない。
