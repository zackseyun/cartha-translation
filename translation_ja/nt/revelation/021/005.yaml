  - severity: medium
    issue: 「新しくする」ではποιῶの現在進行的な表現が弱まる
    rationale: 日本語の非過去形「する」は宣言的・未来的にも読める。原文および英語監査記録が保つ進行中の側面を、「新しくしている」でより安全に反映できる。
