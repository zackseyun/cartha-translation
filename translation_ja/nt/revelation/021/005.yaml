id: REV.21.5
reference: Revelation 21:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: ja
  text: そして、王座に座っておられる方が言われた。「見よ、わたしはすべてを新しくしている。」また、その方は言われた。「書き記しなさい。これらの言葉は信頼でき、真実であるからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: 王座に座っている方
  rationale: 現在分詞の描写的な力と王としての権威を示す座のイメージを保ちつつ、現代日本語として自然で荘重な表現にした。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を促す厳粛な談話標識として、黙示文学の調子に合う簡潔で格調ある表現を選んだ。
- source_word: καινὰ ποιῶ πάντα
  choice: わたしはすべてを新しくする
  rationale: ποιῶを「する」と訳して原語の基本的意味を保ち、πάνταの包括性を「すべて」で示した。現在形は宣言的な日本語として自然に表し、刷新か置換かを限定していない。
- source_word: Γράψον
  choice: 書き記しなさい
  rationale: 命令の直接性を保ちながら、啓示を記録する文脈が明確に伝わる自然な表現とした。
- source_word: ὅτι
  choice: だからである
  rationale: ここでは書くよう命じる理由を導く用法と判断し、その論理関係を明示した。
- source_word: οὗτοι οἱ λόγοι
  choice: これらの言葉
  rationale: 直前までの啓示の言葉を指す表現として、λόγοιの広さを保つ簡明な訳とした。
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: 信頼でき、真実
  rationale: 言葉についてのπιστοίは「信頼できる」が自然であり、ἀληθινοίは直接的に「真実」とした。二語の重なりを消さず、確かさと真実性の双方を保った。
theological_decisions:
- issue: καινὰ ποιῶ πάνταが示す終末的刷新の範囲と性質
  choice: わたしはすべてを新しくする
  alternative: わたしは万物を新しくしている
  rationale: πάνταの包括性を保ちながら、それが全面的な置換なのか変容・刷新なのかを訳文で決めない。「する」は現在形の荘重な宣言として自然で、継続中の動作に限定しない。
- issue: 王座上の話者の提示
  choice: 王座に座っている方
  alternative: 王座に着いておられる方
  rationale: 本文が示す王座のイメージだけを保ち、話者について本文以上の教理的同定を付け加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「見よ」と命令形によって黙示文学にふさわしい荘重さを保った。「王座」は統治権を明確に伝え、「方」によって話者への敬意を自然に示した。
