id: REV.21.16
reference: Revelation 21:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: ja
  text: 都は正方形で、その長さは幅と等しい。彼は測りざおで都を測った。一万二千スタディオン[a]であった。その長さと幅と高さは等しい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: スタディオンは古代の距離の単位。一万二千スタディオンは、採用するスタディオンの長さによって異なるが、およそ二千二百二十キロメートルである。
    reason: 古代の距離単位を説明し、本文の単位を現代の読者が概算できるようにするため。
lexical_decisions:
- source_word: τετράγωνος κεῖται
  choice: 四角形に造られており
  rationale: τετράγωνοςは平面上の正方形を表し、κεῖταιは都の配置・形状を述べる。日本語では「四角形に造られている」とすることで、単なる位置ではなく都市の区画形状を自然に示す。
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: その長さは幅と同じであった
  rationale: ὅσονが示す寸法の等しさを、明瞭な現代日本語で表した。
- source_word: ἐμέτρησεν
  choice: 彼が測り…測ると
  rationale: 直前の文脈で示される測定者を「彼」とし、アオリストの出来事を日本語の自然な物語展開として訳した。
- source_word: τῷ καλάμῳ
  choice: 測りざおで
  rationale: κάλαμοςは本来「葦」をも意味するが、ここでは測定器具として使われるため、機能が明確な「測りざお」とした。
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: 一万二千スタディオンあった
  rationale: ἐπίを測定結果として自然に吸収し、古代の単位と象徴性を保つため数値を換算せず音写した。
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: その長さと幅と高さは等しい
  rationale: 三つの寸法が等しいという原文の直接的な陳述を保ち、「立方体」という解釈的要約には置き換えなかった。
theological_decisions:
- issue: 古代の距離単位を本文で現代単位に換算するか
  choice: 本文では「一万二千スタディオン」を保持する
  alternative: 約二千二百二十キロメートル
  rationale: スタディオンの厳密な長さには幅があり、原文の単位と一万二千という数をそのまま示すことが、本文優先かつ象徴的含意を過度に処理しない訳となる。
- issue: 三つの寸法の等しさを「立方体」と要約するか
  choice: 「長さと幅と高さは等しい」と訳す
  alternative: 「都は完全な立方体である」
  rationale: 立方体であることは自然な幾何学的含意だが、原文自体は形状名ではなく三寸法の等しさを述べているため、その表現を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「測りざお」は器具の用途がすぐ分かる表記とし、「スタディオン」は原文の古代単位を保持した。本文の脚注記号[a]は該当語の直後に置いた。
