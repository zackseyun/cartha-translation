    rationale: τετράγωνος は長さと幅が等しいという直後の説明と結びつき、ここでは「正方形」を指す。「四角形」は意味が広すぎ、「造られて」は κεῖται（置かれている／位置している・形作られている）の直接的な訳ではない。
  - severity: low
    issue: 「彼が…測ると」
    rationale: ἐμέτρησεν は単純な過去の叙述である。「彼は…測った」とすれば、条件節のような含みを避けられる。
  - severity: low
    issue: 本文の過去時制と現在時制の混在
    rationale: 「同じであった」と「等しい」が混在する。黙示的幻視の描写として現在形に統一すると自然であり、ギリシア語の κεῖται と ἐστίν にもよく対応する。
  revised_text: 都は正方形で、その長さは幅と等しい。彼は測りざおで都を測った。一万二千スタディオン[a]であった。その長さと幅と高さは等しい。
