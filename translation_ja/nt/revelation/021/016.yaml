revisions:
- from: 都は四角形に造られており、その長さは幅と同じであった。彼が測りざおで都を測ると、一万二千スタディオン[a]あった。その長さと幅と高さは等しい。
  to: 都は正方形で、その長さは幅と等しい。彼は測りざおで都を測った。一万二千スタディオン[a]であった。その長さと幅と高さは等しい。
  rationale: 「正方形」により τετράγωνος のこの文脈での意味を明確にし、「造られて」を除いて κεῖται にない制作行為を加えないようにした。測定の文は原文どおりの独立した叙述とし、寸法の等しさは原文の直接表現を保った。
