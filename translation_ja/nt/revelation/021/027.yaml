id: REV.21.27
reference: Revelation 21:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: ja
  text: どんな汚れたものも、また忌まわしいことと偽りを行う者も、決してこの都に入ることはない[a][b]。入ることができるのは、小羊のいのちの書に記されている者たちだけである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚れたもの」は、「俗なもの」または「汚されたもの」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると、「忌まわしいことと偽りを行う者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: 決して入ることはない／入れない
  rationale: οὐ μή＋アオリスト接続法による強い否定を、現代日本語で自然かつ明確に表した。
- source_word: αὐτὴν
  choice: 都に
  rationale: 代名詞の指示対象は新しいエルサレムである。日本語では「そこに」よりも指示対象を補って「都に」とする方が明瞭である。
- source_word: πᾶν κοινὸν
  choice: 汚れたものは何一つ
  rationale: 中性単数の πᾶν を包括的な「何一つ」とし、共同体・祭儀的文脈で「俗な、汚れた」を表し得る κοινός は本文で「汚れた」と訳した。
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: 忌まわしいことや偽りを行う者
  rationale: 単数分詞を人を指す表現として訳し、βδέλυγμα の強い嫌悪・宗教倫理的含意を「忌まわしいこと」で示した。καί は二種の行為を列挙するため、日本語では自然な「や」を用いた。
- source_word: εἰ μὴ
  choice: だけである
  rationale: 排除に対する唯一の例外を示す限定として自然な日本語にした。
- source_word: οἱ γεγραμμένοι
  choice: 記されている者たち
  rationale: 完了受動分詞が示す、すでに記されて現在もその状態にあることを表す。「名」は原文に明記されていないため補わない。
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου
  choice: 小羊のいのちの書に
  rationale: 属格を所有関係として読み、黙示録におけるキリスト称号 ἀρνίον を「小羊」とした。「いのちの書」は定着した聖書語であり、平仮名表記により現代の読者にも読みやすくした。
theological_decisions:
- issue: 新しいエルサレムから排除されるものの範囲
  choice: 汚れたものを包括的に排除し、さらに忌まわしいことや偽りを行う者を明示する。
  alternative: 第一の表現を非人格的な物だけに限定し、後半のみを人に関する排除と読む。
  rationale: 原文は中性の πᾶν κοινόν と、人を指す実詞的分詞 ποιῶν を並べているため、両方を区別しつつ保持した。
- issue: 「記されている」の内容
  choice: 原文どおり「記されている者たち」とし、「名」を補わない。
  alternative: 「その名が記されている者たち」と明示する。
  rationale: 書の比喩から名簿が含意されるものの、この節のギリシア語本文には「名」がないため、並行箇所の表現を持ち込まない。
- issue: βδέλυγμα と ψεῦδος の関係
  choice: 「忌まわしいことや偽り」として別個の行為類型を列挙する。
  alternative: 「忌まわしく偽ったこと」のように一つの複合的性質として訳す。
  rationale: 一つの分詞 ποιῶν が二つの目的語を支配している構造を保ちつつ、日本語では列挙として自然に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「入ることはない」を反復して強い排除を明確にし、最後は「だけである」で唯一の例外を際立たせた。
