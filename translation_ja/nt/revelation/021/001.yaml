id: REV.21.1
reference: Revelation 21:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: ja
  text: そして私は、新しい天と新しい地を見た。最初の天と最初の地[a]は過ぎ去り、海ももはやない[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「以前の天と以前の地」とも訳せる。ギリシア語は直訳すると「最初の天と最初の地」で、新しいものに対する先の秩序を指している可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「海」は文字どおりに読むことができるが、黙示録では混沌、危険、あるいは隔たりを連想させる場合もある。
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: 見た
  rationale: ὁράωのアオリスト直説法を、幻の叙述として簡潔で自然な過去形にした。
- source_word: οὐρανὸν καινὸν καὶ γῆν καινήν
  choice: 新しい天と新しい地
  rationale: 宇宙的な文脈に即してοὐρανόςとγῆを定着した対句「天と地」とし、καινόςは置換か刷新かを決めず「新しい」と訳した。
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: 最初の天と最初の地
  rationale: πρῶτοςの直接的な意味を保ち、新しい秩序に先立つものという対比を本文で明示しすぎないようにした。
- source_word: ἀπῆλθαν
  choice: 過ぎ去り
  rationale: 以前の天と地が去ったことを表す文脈上の意味を、現代日本語で自然かつ荘重な「過ぎ去る」で示した。
- source_word: ἡ θάλασσα
  choice: 海
  rationale: 具体的な語をそのまま保ち、黙示録における象徴的連想を本文へ織り込まなかった。
- source_word: οὐκ ἔστιν ἔτι
  choice: もはやない
  rationale: 現在形ἔστινとἔτιを反映し、単に消失の出来事ではなく、今や存在しない状態を簡潔に表した。
- source_word: γὰρ
  choice: というのも……からである
  rationale: 前文の幻を説明する理由・根拠の接続を、日本語で明確に表した。
theological_decisions:
- issue: 「新しい天と新しい地」の性質
  choice: 「新しい」と訳し、旧創造の置換か刷新かを特定しない
  alternative: 完全な置換、または既存の創造の更新・変容と明示する
  rationale: καινόςは新しさを示すが、この節だけでは置換と変容のいずれかに決定できないため、その緊張を保った。
- issue: 「海ももはやない」の意味
  choice: 本文では「海」を具体語のまま訳す
  alternative: 混沌・危険・悪・隔たりの除去を象徴する表現として解釈的に訳す
  rationale: 象徴的な含意はあり得るが、字義的な海の不在も排除せず、解釈は脚注にとどめた。
translation_notes:
  register: 明快な現代標準語を用いつつ、終末的幻の荘重さを保った。「というのも……からである」でγάρを明示し、「もはやない」ではギリシア語の現在時制を保持した。
