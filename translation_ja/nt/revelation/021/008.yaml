id: REV.21.8
reference: Revelation 21:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: ja
  text: しかし、臆病な者、信じない者[a]、忌まわしい者、殺人者、性的に不道徳な者、魔術を行う者、偶像を礼拝する者、そして偽りを語るすべての者が受ける分は、火と硫黄で燃える湖の中にある。これが第二の死である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「不忠実な者」とも訳せる。
    reason: ἀπίστοιςには「信じない」と「不忠実である」の両方の意味があり得るため。
lexical_decisions:
- source_word: δειλοῖς
  choice: 臆病な者
  rationale: 単なる恐れではなく、裁きの対象となる恥ずべき臆病さを表すため。
- source_word: ἀπίστοις
  choice: 不信仰な者
  rationale: この裁きの列挙では、信じない者という意味が最も自然。ただし「不忠実な者」の意味もあり得るため脚注に残した。
- source_word: ἐβδελυγμένοις
  choice: 忌まわしい者
  rationale: 忌避されるものによって特徴づけられた者を表す強い語感を、現代日本語で簡潔に示すため。
- source_word: φονεῦσι
  choice: 人を殺す者
  rationale: 不法な殺人を行う者を指す。日本語で明瞭かつ自然な表現とした。
- source_word: πόρνοις
  choice: 性的に不道徳な者
  rationale: 特定の一行為に狭めず、性的な不道徳を行う者という広い意味を保つため。
- source_word: φαρμάκοις
  choice: 魔術を行う者
  rationale: 黙示録の文脈では薬剤師ではなく、呪術・魔術の実践者を指すため。
- source_word: εἰδωλολάτραις
  choice: 偶像を礼拝する者
  rationale: 偶像崇拝者という意味を、一般読者に直接分かる形で表した。
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: すべて偽りを語る者
  rationale: 実体詞的な形容詞を、人物の類型として自然な日本語にした。
- source_word: τὸ μέρος αὐτῶν
  choice: 彼らが受ける分
  rationale: μέροςの割り当てられた分、行き着く運命という含意を保つため。
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: 火と硫黄で燃える湖の中
  rationale: 修飾関係を保ち、θείονを物質名として正確な「硫黄」と訳した。
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: これが第二の死である
  rationale: 関係代名詞が直前の湖の描写を受け、それを第二の死と同定する説明の働きを自然な日本語で示した。
theological_decisions:
- issue: ἀπίστοιςの意味
  choice: 不信仰な者
  alternative: 不忠実な者／信頼できない者
  rationale: 新しい創造から除外される者の列挙では「信じない者」が自然だが、この語には不忠実という意味もあるため、一義的に限定せず脚注で示した。
- issue: θείῳの訳語
  choice: 硫黄
  alternative: いおう、燃える石
  rationale: 原語が指す物質を現代日本語で直接表し、伝統的表現を優先して意味を曖昧にしないため。
- issue: 第二の死が指すもの
  choice: 直前の火と硫黄で燃える湖を受けて「これ」とした
  alternative: 彼らの受ける分全体を受ける可能性
  rationale: 中性関係代名詞ὅは文法上、直前の中性名詞λίμνηそのものとは性が一致しないが、湖で表された事態・内容をまとめて受けると理解できる。日本語では指示範囲を過度に限定しない「これ」を用いた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ギリシア語の反復的なκαίによる厳粛な列挙は読点と「そして」で表し、過度に古風な宗教語は避けた。
