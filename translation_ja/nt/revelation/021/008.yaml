revisions:
- from: しかし、臆病な者、不信仰な者[a]、忌まわしい者、人を殺す者、性的に不道徳な者、魔術を行う者、偶像を礼拝する者、そしてすべて偽りを語る者が受ける分は、火と硫黄で燃える湖の中にある。これが第二の死である。
  to: しかし、臆病な者、信じない者[a]、忌まわしい者、殺人者、性的に不道徳な者、魔術を行う者、偶像を礼拝する者、そして偽りを語るすべての者が受ける分は、火と硫黄で燃える湖の中にある。これが第二の死である。
  rationale: 本文の意味を変えず、ἀπίστοιςを文脈上より直接的な「信じない者」に改めた。また、πᾶσι τοῖς ψευδέσινの範囲を自然に明示するため、「偽りを語るすべての者」とした。φονεῦσιは不法な殺害を指すため、「人を殺す者」より限定的で自然な「殺人者」とした。脚注は文脈上有力な代替「不忠実な者」のみを保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:37:47Z'
