  source_fidelity: 原文の「都の中に神殿を見なかった」と、γάρによる理由説明を正確に反映している。「主なる神、全能者が都の神殿であり、子羊もまたそう」とした表現は、単数のἐστινの後にκαὶ τὸ ἀρνίονが置かれる原文の形を不必要に教理化せず、日本語として両者が都の神殿であることを適切に伝える。
