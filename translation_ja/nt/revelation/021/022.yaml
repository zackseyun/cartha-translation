id: REV.21.22
reference: Revelation 21:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: ja
  text: 私は都の中に神殿[a]を見なかった。主なる神、全能者が都の神殿であり、子羊もまたそうだからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所」とも訳せる。ギリシア語のναόςは、神殿の中でも特に内部の聖所を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: 神殿
  rationale: ναόςは、とりわけ神殿内部の聖所を指し得るが、ここでは物理的な神殿がなく、神と子羊ご自身が都の神殿であるという対照を、現代日本語で明瞭かつ自然に表せる。
- source_word: οὐκ εἶδον
  choice: 見なかった
  rationale: 一人称単数のアオリストと否定を簡潔に反映する。「見当たらなかった」ではなく、幻を見る者ヨハネの視覚経験を直接表した。
- source_word: ἐν αὐτῇ
  choice: 都の中に
  rationale: 女性単数代名詞の指示対象である都を明示し、日本語で不自然な性の区別を持ち込まない。
- source_word: ὁ κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: 主なる神、全能者
  rationale: 冠詞を伴う同格的な称号の連なりを保ちつつ、日本語として格調と明瞭さを備えた表現とした。
- source_word: αὐτῆς
  choice: 都の
  rationale: 指示対象を明示して、「その」が神殿を指すか都を指すかという日本語上の不要な曖昧さを避けた。
- source_word: καὶ τὸ ἀρνίον
  choice: 子羊もまたそう
  rationale: 後置された並列要素を自然な日本語で表し、主なる神だけでなく子羊も都の神殿であることを示す。原文にない教理的説明は加えていない。
theological_decisions:
- issue: 「ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον」における神と子羊の関係
  choice: 主なる神、全能者が都の神殿であり、子羊もまたそうである
  alternative: 主なる神、全能者だけを文法上の中心とし、「そして子羊」を付加的な同格強調として訳す
  rationale: 単数形ἐστινの後にκαὶ τὸ ἀρνίονが加えられる原文の形を尊重しつつ、日本語では「もまたそう」によって両者が都の神殿として語られていることを明瞭にした。後代の教理用語で関係を説明せず、本文の高いキリスト論的緊張をそのまま保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示文学にふさわしい簡潔で品位ある調子を保った。「都」を補って代名詞の指示対象を自然に明示し、原文の神学的含意を説明で過度に限定しないようにした。
