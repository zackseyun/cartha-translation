id: REV.21.19
reference: Revelation 21:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: ja
  text: 都の城壁の土台は、あらゆる種類の宝石で飾られていた。[a] 第一の土台は碧玉、第二はサファイア、第三は玉髄[b]、第四はエメラルドであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あらゆる宝石で」とも訳せる。ギリシャ語は分配的に理解できるため、本文では「あらゆる種類の宝石で」とした。
    reason: lexical_alternative
  - marker: b
    text: 「玉髄」はギリシャ語の宝石名に対する伝統的な訳語。古代の宝石名には、現代のどの鉱物に当たるか厳密には不明なものがある。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ θεμέλιοι
  choice: 土台
  rationale: 城壁を支える複数の基礎部分または礎石を指す。日本語では文脈上「土台」が自然であり、複数性は後半の列挙によって明らかになる。
- source_word: τοῦ τείχους τῆς πόλεως
  choice: 都の城壁
  rationale: τεῖχοςは都市を囲む壁を表すため「城壁」とし、πόλιςは黙示録の終末的な都を指すので、品位ある「都」とした。
- source_word: παντὶ λίθῳ τιμίῳ
  choice: あらゆる種類の宝石で
  rationale: 与格は装飾の手段を示す。「あらゆる種類」とすることで、παντίの分配的な含みを自然な日本語で表した。ただし「あらゆる宝石で」と取る余地は脚注に残した。
- source_word: κεκοσμημένοι
  choice: 飾られていた
  rationale: 完了受動分詞が表す、すでに飾られた状態を自然な日本語で示す。
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: 第一の土台
  rationale: 列挙される個々の基礎を指す。「第一の礎石」も可能だが、原文が明示しない「石」を補わず、前文とのつながりを保った。
- source_word: ἴασπις
  choice: 碧玉
  rationale: ἴασπιςの慣用的な聖書用語であり、宝石名として簡潔に表せる。
- source_word: σάπφιρος
  choice: サファイア
  rationale: 現代日本語で一般的な宝石名を採用した。
- source_word: χαλκηδών
  choice: 玉髄
  rationale: 伝統的にカルセドニー（玉髄）と同定されるため、普通の読者に理解しやすい名称を用いた。ただし古代の石の厳密な同定には不確かさがあるため脚注を付した。
- source_word: σμάραγδος
  choice: エメラルド
  rationale: 現代日本語で確立した標準的な対応語である。
theological_decisions:
- issue: 黙示的描写における宝石の列挙
  choice: 各宝石名をそのまま訳し、本文では象徴的意味を説明しない。
  alternative: 各宝石をイスラエルの部族、使徒、または祭司の胸当てと結び付けて象徴的に訳す、あるいは注釈する。
  rationale: この節自体は土台の装飾を列挙するだけで、個々の石の象徴的意味を説明していない。したがって、特定の神学的解釈を本文に持ち込まず、原文のイメージと解釈上の余地を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。宝石名は一般に通じる現代的な名称を用い、文の反復的な列挙構造は原文に沿って保持した。
