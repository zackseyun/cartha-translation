id: REV.21.9
reference: Revelation 21:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: ja
  text: すると、最後の七つの災害で満ちた七つの鉢を持つ七人の御使いのうちの一人が来て、私に話しかけた[a]。「さあ、花嫁、すなわち子羊の妻を、あなたに見せよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私と語った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: すると
  rationale: 単なる並列ではなく物語の進行を示す接続として、現代日本語で自然に表した。
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: 七人の御使いのうちの一人
  rationale: ἐκを伴う部分表現を自然な日本語にした。
- source_word: τὰς ἑπτὰ φιάλας
  choice: 七つの鉢
  rationale: φιάληは浅く広い容器を指し、現代語の「小瓶」より「鉢」が形状と黙示録の用法に合う。
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: 最後の七つの災害で満ちた
  rationale: γεμόντωνの「満ちている」と、ἐσχάτωνの終末的・順序的な「最後の」を明示した。πληγήはこの文脈で神の裁きとして臨む災厄を表すため「災害」とした。
- source_word: ἐλάλησεν μετ’ ἐμοῦ
  choice: 私に話しかけた
  rationale: μετάの字義的な「私と」の含みを踏まえつつ、一方向の発言を導入する文脈に自然な日本語を選び、字義的表現は脚注に残した。
- source_word: Δεῦρο
  choice: さあ
  rationale: 相手を招く命令の力を、硬すぎない簡潔な呼びかけで表した。
- source_word: δείξω σοι
  choice: あなたに見せよう
  rationale: 未来形の意志・約束の響きを自然な日本語で表した。
- source_word: τὴν νύμφην τὴν γυναῖκα τοῦ ἀρνίου
  choice: 子羊の妻である花嫁
  rationale: νύμφηとγυνήの双方を明示し、同格関係を「である」で自然に表した。
- source_word: τοῦ ἀρνίου
  choice: 子羊の
  rationale: 黙示録におけるキリストの称号を、本文の比喩を保って訳した。
theological_decisions:
- issue: νύμφηとγυνήの関係
  choice: 「子羊の妻である花嫁」として両語を訳出する
  alternative: 「子羊の花嫁」または「花嫁、子羊の妻」
  rationale: 二つの名詞の同格関係を保ち、婚姻の比喩を一語に縮約しないため。日本語としての明瞭さを優先して「である」で関係を示した。
- issue: ἀρνίονのキリスト論的称号
  choice: 「子羊」
  alternative: 固有名的に「小羊」とする
  rationale: 黙示録の象徴的称号を説明で置き換えず、そのまま意味に即して訳した。
translation_notes:
  register: 現代標準日本語の明瞭で品位ある叙述とした。「御使い」は聖書的な語感を保ちながら一般読者にも理解可能な表記。「さあ」と「見せよう」により、招きと約束の直接話法を自然に表した。
