id: REV.21.6
reference: Revelation 21:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: ja
  text: また、その方は私に言われた。「これらのことは実現した。[a] わたしはアルファであり、オメガである。初めであり、終わりである。渇いている者には、いのちの水の泉から無償で与えよう。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「それらは実現した」。ギリシア語の動詞は複数形である。「完了した」または「事は成った」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 「代価なしに」または「贈り物として」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: これらのことは実現した
  rationale: γίνομαι の完了・能動・直説法三人称複数形であるため、単数的な「完了した」だけに平板化せず、複数の事柄が現実となった意味を日本語で明示した。完了形が示す、実現して現在に至る含みも保つ。
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: アルファであり、オメガである
  rationale: 黙示録で象徴的称号として用いられるギリシア文字名を保持する。その意味は直後の「初めであり、終わりである」によって示される。
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: 初めであり、終わりである
  rationale: 時間的な始点と終点だけでなく、起源と目的という含みも排除しない、簡潔で定着した表現とした。
- source_word: τῷ διψῶντι
  choice: 渇いている者には
  rationale: 現在分詞の実質名詞的用法と単数の個人的な呼びかけを自然な現代日本語で表した。比喩的意味に限定せず、原文の渇きの像を保った。
- source_word: ἐκ τῆς πηγῆς
  choice: 泉から
  rationale: πηγή の湧き出る水源という像を、簡潔で自然な「泉」によって保持した。
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: いのちの水
  rationale: 属格構造と聖書的な比喩を保ちつつ、現代日本語として通用する表現を採用した。
- source_word: δωρεάν
  choice: 無償で
  rationale: 代価を要求せず贈り物として与えるという副詞的意味を、過度に口語的にならない明瞭な日本語で表した。
theological_decisions:
- issue: 神の宣言 Γέγοναν の複数形をどう表すか
  choice: これらのことは実現した
  alternative: 完了した／事は成った
  rationale: 新しい創造について告げられた複数の事柄が現実となったという原文の複数形を保持する。伝統的な単数表現だけにすると、この文法的特徴が見えなくなるため、補われた主語を脚注で明示した。
- issue: アルファとオメガの象徴的称号
  choice: アルファであり、オメガである
  alternative: 最初の文字であり、最後の文字である
  rationale: ギリシア文字名そのものを保持することで、黙示録内の反復と象徴性を保つ。概念的内容は続く「初めであり、終わりである」が説明しているため、称号を意訳しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の自己宣言には簡潔で荘重な調子を保った。「わたし」は話者である神の発言として平仮名表記とし、「ただで」よりも品位のある「無償で」を採用した。脚注記号は、それぞれ説明対象である Γέγοναν と δωρεάν の訳語の直後に置いた。
