source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: ja
  text: また、彼はその都の城壁を測った。それは百四十四キュビトルで、人間の尺度、すなわち天使の尺度であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人間の尺度、すなわち天使の尺度で、百四十四キュビトルであった」。ギリシャ語は、天使が人間の測定単位を用いたことを強調しているとも、人間と天使の尺度がここでは一致することを示しているとも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: 測った
  rationale: μετρέωのアオリスト能動直説法で、実際に測量した行為を簡潔かつ自然に表す。
- source_word: τὸ τεῖχος αὐτῆς
  choice: その都の城壁
  rationale: τεῖχοςは都市を囲む防御壁を指すため「城壁」とし、αὐτῆςの指示対象が都であることを日本語で明確にした。
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 百四十四キュビトル
  rationale: 古代の単位を換算せず保持し、数値は日本語本文になじむ漢数字で表した。
- source_word: μέτρον ἀνθρώπου
  choice: 人間の尺度で
  rationale: ἄνθρωποςはここでは性別を限定しない一般的な人間を表す。μέτρονは測定の基準という意味を自然な「尺度」で示した。
- source_word: ὅ ἐστιν ἀγγέλου
  choice: それは御使いの尺度でもある
  rationale: 省略された「尺度」を補い、直前の人間の尺度と御使いの尺度との対応を示す。ただし圧縮されたギリシャ語の解釈上の幅は脚注に残した。
theological_decisions:
- issue: μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου の解釈
  choice: 人間の尺度が、ここでは御使いの尺度でもあると読む
  alternative: 人間の尺度で、すなわち測っている御使い自身の尺度であると読む
  rationale: ὅ ἐστινは説明的な同定を示すが、御使いが人間の測定単位を用いたことに重点があるのか、両者の尺度の一致に重点があるのかは断定しにくい。本文では対応関係を示し、解釈上の幅を脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御使い」は黙示録の文脈に適した一般的な聖書語として用いた。「キュビトル」は原文の古代単位を保持し、現代単位への推定換算は避けた。
