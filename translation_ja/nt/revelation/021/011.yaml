  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: ja
  text: 神の栄光を帯びており、その輝き[a]は、この上なく尊い宝石のようで、水晶のように透き通った[b]碧玉のようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その光」または「その光明」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「水晶のようにきらめく」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσαν τὴν δόξαν τοῦ θεοῦ
  choice: 神の栄光を帯びていた
  rationale: 分詞が前節の都を修飾するつながりを保ちつつ、独立した節として自然な日本語にした。「栄光」はδόξαの神学的な重みを保ち、「帯びる」は都に神の栄光が現れている情景を自然に表す。
- source_word: ὁ φωστὴρ αὐτῆς
  choice: その輝き
  rationale: φωστήρは発光体、光、輝きのいずれをも指し得る。ここでは都の目に見える光彩を述べているため、「その輝き」としたが、語義の幅は注に残した。
- source_word: λίθῳ τιμιωτάτῳ
  choice: この上なく尊い宝石
  rationale: τιμιωτάτῳの最上級の力を「この上なく」で示し、λίθοςはこの宝石の文脈に即して「宝石」とした。
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: 碧玉のよう
  rationale: ἴασπιςの伝統的かつ広く理解される訳語「碧玉」を採用した。直前にも石の語があるため、日本語では不自然な重複を避けた。
- source_word: κρυσταλλίζοντι
  choice: 水晶のように透き通った
  rationale: 水晶に似た透明さ、またはきらめきを表す分詞として、文脈上自然な「透き通った」を本文に採用し、別の可能性を注記した。
theological_decisions:
- issue: δόξαν τοῦ θεοῦの黙示文学的表現
  choice: 神の栄光
  alternative: 神の輝かしさ／神の光輝
  rationale: 単なる視覚的な美しさに狭めず、神の臨在と威光が現れるという聖書的・神学的な含みを保つため。
- issue: φωστήρを神の栄光そのものと同一視するか
  choice: その輝き
  alternative: その光／その光明
  rationale: 本文は都のφωστήρを描写しているが、それと「神の栄光」との関係を訳文で断定的に説明せず、原文の表現上の余地を保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。前節から続く分詞構文のため主語「都」は補わず、文脈上の連続性を保った。「この上なく」で最上級を自然に表し、終末的な宝石描写は過度に説明せず保持した。
