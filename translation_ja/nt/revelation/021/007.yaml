source:
  edition: SBLGNT
  text: ὁ νικῶν κληρονομήσει ταῦτα, καὶ ἔσομαι αὐτῷ θεὸς καὶ αὐτὸς ἔσται μοι υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: ja
  text: 打ち勝つ者は、これらのものを受け継ぐ[a]。わたしはその者の神となり、その者はわたしの息子となる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「勝利を得る者」。ギリシア語の動詞ニカオーは、黙示録で繰り返し用いられる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「その人はわたしの息子となる」。男性単数の「息子」は、ここでは打ち勝つ者を代表的に指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: 勝利を得る者
  rationale: 冠詞付き現在分詞を実体詞的に訳し、黙示録で繰り返される、信仰を貫いて勝利する者という継続的・特徴的な意味を自然な現代日本語で表した。「打ち勝つ者」も可能。
- source_word: κληρονομήσει
  choice: 受け継ぐ
  rationale: 相続として受けるという意味と、後続する神と子の家族的・契約的関係を保つ。「相続する」より一般読者に自然である。
- source_word: ταῦτα
  choice: これら
  rationale: 複数指示代名詞を保ち、直前までに示された新しい創造の祝福を指す表現として簡潔に訳した。「これらのもの」も可能だが、日本語ではやや重い。
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: わたしはその者の神となり
  rationale: 与格の関係性を自然な日本語で示し、聖書に見られる契約の定型表現を保った。
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: その者はわたしの子となる
  rationale: 父子関係と相続の比喩を保持した。日本語の「子」は文法的性を明示しないが、υἱόςの親子・相続上の意味を自然に伝える。
theological_decisions:
- issue: 勝利者への約束における男性単数の子の表現
  choice: 本文では「その者はわたしの子となる」とする
  alternative: その者はわたしの息子となる／その者はわたしの子どもとなる
  rationale: υἱόςの子としての関係と相続の主題を保ちつつ、現代日本語の聖書的・荘重な表現として「子」が最も自然である。男性単数形は代表的に用いられている可能性があるため、その点を脚注で示す。
- issue: 契約の定型句への呼応
  choice: 「わたしはその者の神となり、その者はわたしの子となる」
  alternative: 「わたしはその者にとって神となり、その者はわたしにとって子となる」
  rationale: 原文の相互的な関係を保ちながら、日本語として自然で、契約および養子・父子関係の響きを余計な解釈なしに伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の直接発話にふさわしい簡潔で荘重な調子と、相続・契約・父子関係の連続性を保った。
