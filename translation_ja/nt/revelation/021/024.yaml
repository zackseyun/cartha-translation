id: REV.21.24
reference: Revelation 21:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: ja
  text: 諸国の民は都の光によって[a]歩み、地上の王たちは自分たちの栄光[b]を都の中へ携えて来る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「都の光の中を」。
    reason: διάと属格の表現は、光を歩むための手段と見るほか、その光が満たす領域を歩むという情景としても表せる。
  - marker: b
    text: 「栄光」は、「輝き」または「誉れ」とも訳せる。
    reason: δόξαは文脈上、王たちの威光、壮麗さ、誉れなどを含み得る。
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: 歩み
  rationale: 具体的な歩行・行進のイメージを保ちつつ、荘重で自然な日本語とした。単に「生活する」と意訳せず、幻の情景を残した。
- source_word: τὰ ἔθνη
  choice: 諸国の民
  rationale: 政治的・民族的な諸国という意味と、実際に歩む人々という像の双方を自然に表す。「異邦人」では、ここで意図されている範囲を不必要に限定する可能性がある。
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: 都の光によって
  rationale: 属格を伴うδιάの手段の意味を明確にし、諸国の民が都の光を頼りとして歩むことを表した。日本語では代名詞を避け、指示対象である都を明示するほうが自然である。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上の王たち
  rationale: 黙示録に繰り返される表現として、γῆを「地上」とし、地上を治める王たちを指す自然な日本語にした。
- source_word: φέρουσιν
  choice: 携えて来る
  rationale: 目的地への移動を含む「持って来る」を、王たちが栄光を都へ運び入れる行列的な情景に合う、やや格調ある表現とした。現在形は、先行する未来形と一続きの終末的光景として日本語の非過去形で自然に表した。
- source_word: τὴν δόξαν αὐτῶν
  choice: 自分たちの栄光
  rationale: δόξαの聖書的な響きを保ち、王たちに属する誉れ・輝き・富を包括できる「栄光」とした。「自分たちの」によりαὐτῶνの再帰的な関係を明瞭にした。
- source_word: εἰς αὐτήν
  choice: 都の中へ
  rationale: εἰςの方向性と内部への移動を明示した。ギリシア語の女性代名詞は女性名詞である「都」を受けるが、日本語では性を示す必要がないため、指示対象を自然に明示した。
theological_decisions:
- issue: 新しいエルサレムを受ける女性代名詞の扱い
  choice: 「都の光」「都の中へ」とし、都市を指すことを明示する。
  alternative: 「彼女の光」「彼女の中へ」として花嫁としての擬人化を前面に出す。
  rationale: 章全体には花嫁としての擬人化があるが、この節では光と都市内部への移動という空間的な描写が中心である。ギリシア語の代名詞の性はπόλιςが女性名詞であることによるため、日本語で「彼女」として擬人化を強めない。
- issue: 王たちが携えるδόξαの意味
  choice: 包括的で聖書的な響きを持つ「栄光」とする。
  alternative: 具体的な華やかさに重点を置く「輝き」、または評価に重点を置く「誉れ」とする。
  rationale: この語は王たちの誉れ、威光、富、壮麗さを含み得る。意味を一つに狭めず、預言書との響きも保つため「栄光」とした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、黙示文学の荘重さと行列的な映像を保つ文体。「諸国の民」で集団としての諸国とそこに属する人々を自然に結び、「携えて来る」で都へ向かう動きを示した。
