id: REV.21.4
reference: Revelation 21:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: ja
  text: そして、彼らの目から涙をことごとく[a]ぬぐい去る。もはや死はなく、嘆きも、叫び声[b]も、苦痛も、もはやない。以前のもの[c]は過ぎ去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「一つ一つの涙を」。ギリシア語の単数形は、すべての涙を一つ残らずという意味を表す。
    reason: lexical_alternative
  - marker: b
    text: または「叫び」。この語は、大きな叫びや泣き叫ぶ声を表すことがある。
    reason: lexical_alternative
  - marker: c
    text: または「初めのもの」。ここでは、今や過ぎ去った従前のものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: ぬぐい去る
  rationale: 涙を取り除くという文脈で、動作の親密さと完全な除去の双方を自然な日本語で表す。「消し去る」では涙との結び付きが不自然になるため避けた。
- source_word: πᾶν δάκρυον
  choice: 涙をことごとく
  rationale: 単数形に付く πᾶν の配分的な意味を反映し、一つ一つの涙が残らず取り除かれることを表した。
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: 彼らの目から
  rationale: 除去の起点を示す ἐκ を、簡潔で自然な日本語にした。
- source_word: ὁ θάνατος οὐκ ἔσται ἔτι
  choice: もはや死はなく
  rationale: 死が完全に廃されるという絶対的な表現を保ち、単なる減少や一時的な停止とはしなかった。
- source_word: πένθος
  choice: 嘆き
  rationale: 死や喪失に伴う悲嘆・哀悼を指す語として、後続の「叫び声」「苦痛」と区別できる自然な語を選んだ。
- source_word: κραυγή
  choice: 叫び声
  rationale: 大きな叫びや泣き叫ぶ声を表し得る語の聴覚的な性格を保持した。
- source_word: πόνος
  choice: 苦痛
  rationale: 身体的な痛みだけに限定せず、つらさや苦しみも含み得る語として文脈に適合する。
- source_word: τὰ πρῶτα
  choice: 以前のもの
  rationale: 新しい創造に対する従前の秩序を指す実体化された中性複数形を、解釈を過度に加えず表した。
- source_word: ἀπῆλθαν
  choice: 過ぎ去った
  rationale: 従前のものがすでに去ったという完結的な宣言を、荘重で自然な日本語にした。
theological_decisions:
- issue: 「ぬぐい去る」の主語はこの節で明示されず、直前の文脈から補われる。
  choice: 日本語本文でも主語を明示せず、「神」を補わない。
  alternative: 「神は……ぬぐい去る」または「その方は……ぬぐい去る」
  rationale: ギリシア語では三人称単数の主語が動詞に含まれるものの、名詞としては反復されていない。日本語では主語省略が自然であり、直前の文脈との結び付きを保てる。
- issue: 新しい創造において死・嘆き・叫び声・苦痛がなくなる範囲。
  choice: 「もはや死はなく……もはやない」と絶対的に表現する。
  alternative: 「死はなくなる」など、変化の過程とも読める表現
  rationale: οὐκ ἔσται ἔτι は、それらの現実が完全に存在しなくなることを断定しているため、限定や弱化を加えない。
- issue: τὰ πρῶτα が指すもの。
  choice: 「以前のもの」とし、本文では特定の項目や体系に限定しない。
  alternative: 「古い世界」または「以前の秩序」
  rationale: 文脈上は従前の創造秩序を広く指すと考えられるが、原文の包括的で簡潔な表現が持つ余地を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、終末的宣言にふさわしい簡潔で厳かな調子を保った。原文の接続詞 καί は冒頭の「そして」で示し、列挙の反復と「もはや」の強調を保持した。
