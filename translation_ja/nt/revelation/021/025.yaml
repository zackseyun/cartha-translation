id: REV.21.25
reference: Revelation 21:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: ja
  text: また、その都の門は昼の間、決して閉ざされない。[a] そこには夜がないからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には「その都の門は昼の間、決して閉ざされることがない」。ギリシア語では強い否定表現が用いられている。
    reason: lexical_alternative
  - marker: b
    text: 門が閉ざされない理由として、「そこには夜がない」ことが挙げられている。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前節から都の描写を続ける接続語として、現代日本語で自然な「また」とした。
- source_word: οἱ πυλῶνες αὐτῆς
  choice: その都の門
  rationale: πυλῶνες は城壁都市の門または門構えを指す。日本語では複数性を明示しなくても集合的に理解できるため「門」とし、αὐτῆς の指示対象を明確にするため「その都の」とした。
- source_word: οὐ μὴ κλεισθῶσιν
  choice: 決して閉ざされない
  rationale: οὐ μή とアオリスト接続法による強い将来否定を「決して……ない」で表した。「閉ざされる」は門について自然で、受動態も保っている。
- source_word: ἡμέρας
  choice: 昼の間
  rationale: 時間を表す属格であり、後半の「夜」との対照を保ちながら自然な日本語にした。
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: そこには夜がないからである
  rationale: γάρ の理由説明を「からである」で明示し、ἔσται の存在表現を日本語として自然な「ない」で表した。
theological_decisions:
- issue: 新しいエルサレムの擬人化の程度
  choice: 「その都の門」とする
  alternative: 「彼女の門」
  rationale: αὐτῆς は文法上女性形だが、これは女性名詞である都との一致でもある。この節では花嫁としての擬人化を前面に出す必要がないため、現代日本語で自然に指示対象を示した。
- issue: 門が閉ざされないことと夜がないことの論理関係
  choice: 「そこには夜がないからである」と理由を明示する
  alternative: 並列的に「そして、そこには夜がない」とする
  rationale: 原文の γάρ は後半を前半の理由として提示しているため、その説明関係を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「閉ざされない」と「からである」により、黙示文学の荘重さと原文の強い否定・理由関係を簡潔に表した。
