id: REV.21.3
reference: Revelation 21:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: ja
  text: 'また私は、御座から大きな声がして、こう語るのを聞いた。


    「見よ、神の住まい[a]が人間とともにある[c]。神は彼らとともに住まわれる[b]。彼らは神に属する諸々の民となり[d]、神ご自身が彼らとともにおられる。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「住まい」に当たるギリシア語は、直訳すれば「天幕」または「幕屋」。神が民の間に住まわれた幕屋のイメージを響かせている。
    reason: lexical_alternative
  - marker: b
    text: 「住まわれる」という動詞は「住まい」と同じ語根を持つ。より直訳的には「天幕を張って住まわれる」。
    reason: lexical_alternative
  - marker: c
    text: 「人間」は、男性に限らず、人間一般を意味する。
    reason: lexical_clarification
  - marker: d
    text: ギリシア語本文は単数の「民」ではなく、複数の「諸々の民」となっている。
    reason: textual_form
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: 大きな声
  rationale: 声の大きさと宣言の力を自然な現代日本語で表す。
- source_word: ἐκ τοῦ θρόνου
  choice: 御座から出る
  rationale: ἐκが示す声の発生源を明確にし、黙示録に一貫する王座のイメージを「御座」で保つ。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を強く促す黙示的な宣言の荘重さを簡潔に保つ。
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: 神の住まい
  rationale: 文脈上の意味を現代の読者に明瞭に伝えつつ、天幕・幕屋という具体的イメージは脚注に残す。
- source_word: μετὰ τῶν ἀνθρώπων
  choice: 人間とともに
  rationale: ἄνθρωποιが男女を含む人類一般を指すことを、包括的かつ簡潔に表す。
- source_word: σκηνώσει
  choice: 住まわれる
  rationale: 神が人々の間に住むという意味を自然に示し、σκηνήとの語根上の響きは脚注で補う。
- source_word: λαοὶ αὐτοῦ
  choice: 神に属する諸々の民
  rationale: λαοίの複数形を不自然な「民々」を避けながら明示し、多くの民が神に属するという原文の緊張を保つ。
- source_word: αὐτὸς ὁ θεός
  choice: 神ご自身
  rationale: αὐτόςの強調を日本語で明確に表し、神の直接的な臨在を示す。
- source_word: μετ’ αὐτῶν ἔσται
  choice: 彼らとともにおられる
  rationale: 神の将来的かつ確かな臨在を、自然で荘重な日本語にする。
theological_decisions:
- issue: λαοίの複数形と伝統的な単数形「民」
  choice: 神に属する諸々の民
  alternative: 神の民
  rationale: SBLGNT本文のλαοίは複数形であるため、その特徴を平板化せず保持する。これが示唆し得る諸民族の包含を断定的に解釈せず、原文の余地を残す。
- issue: σκηνήとσκηνόωの天幕・幕屋イメージ
  choice: 神の住まい……住まわれる
  alternative: 神の幕屋……幕屋を張られる／天幕を張って住まわれる
  rationale: 本文は一般読者に明瞭な表現を用いながら、旧約の幕屋を想起させる同語根のイメージを脚注で保存する。
- issue: τῶν ἀνθρώπωνの範囲
  choice: 人間
  alternative: 人々／男たち
  rationale: ここでは男性だけでなく人類一般を指すため、性別を限定しない「人間」とする。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録の宣言にふさわしい荘重さを「見よ」「御座」「神ご自身」などで保った。敬語は過度に重ねず、「住まわれる」「おられる」によって自然な敬意を示した。
