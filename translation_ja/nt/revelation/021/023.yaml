id: REV.21.23
reference: Revelation 21:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: ja
  text: この都には、太陽も月も、それを照らすためには必要ない[a]。神の栄光がそれを照らし、そのともしびは小羊だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それに向かって輝く」。ギリシア語は直訳すると「それに向けて／その上に輝く」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: 都
  rationale: 文脈は新しいエルサレムであり、「都」は都市としての意味と荘重な文体を自然に保つ。
- source_word: οὐ χρείαν ἔχει
  choice: 必要ない
  rationale: 「必要を持たない」というギリシア語の慣用句を、明瞭で自然な現代日本語にした。
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: 太陽も月も
  rationale: οὐδέによる二つの天体の並列を簡潔に再現し、「必要ない」と自然につなげた。
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: それを照らす
  rationale: 天体を主語とするφαίνωの「輝く」という意味と、与格αὐτῇが示す都への光の作用を、日本語で自然に表した。直後のἐφώτισενとの語義上の近さは原文にもあるため、過度に避けなかった。
- source_word: δόξα
  choice: 栄光
  rationale: 聖書、とりわけ黙示文学における神学的な重みを保つ標準的な訳語。
- source_word: ἐφώτισεν
  choice: 照らし
  rationale: 具体的な照明のイメージを明瞭に伝える。日本語では後続節と一つの理由文を構成するため連用形とした。
- source_word: λύχνος
  choice: ともしび
  rationale: 一般的な「光」や「燭台」ではなく、光を発する灯火を指す語である。現代の読者にも理解でき、比喩として自然な「ともしび」を選んだ。
- source_word: ἀρνίον
  choice: 小羊
  rationale: 黙示録でキリストを指す称号として定着した訳語であり、原語の羊のイメージを保つ。
theological_decisions:
- issue: 「そのともしびは小羊」の比喩的関係
  choice: 「そのともしびは小羊」と比喩を直接保つ。
  alternative: 「小羊が都の光である」
  rationale: 原文は一般的な「光」ではなくλύχνος（ともしび）を用いる。神の栄光が照らすことと、小羊が都のともしびであることの区別を保った。
- issue: 神による照明のイメージ
  choice: 神の栄光が都を照らすという本文の主張のみを訳す。
  alternative: 神がすべての被造の光に取って代わるという説明を訳文に加える。
  rationale: 終末論的な仕組みを推測して補足せず、本文に明記された因果関係をそのまま示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、黙示録の荘重さを保つため「都市」ではなく「都」、「ランプ」ではなく「ともしび」とした。「その」は都を受け、原文の「そのともしび」という所有関係を保持する。
