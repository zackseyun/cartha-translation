  source_fidelity: 主文の内容は概ね原文に忠実であり、λύχνοςを「ともしび」、ἀρνίονを「小羊」とした点も適切です。ただし、ἵνα φαίνωσιν αὐτῇは「太陽と月が都を照らすために（輝くために）」という目的を示します。現訳の「それを照らす太陽も月も」は、都を照らす種類の太陽・月が不要であるかのように修飾関係を取り得るため、目的関係を明示するのが安全です。
  naturalness: 「この都」「神の栄光」「ともしび」「小羊」は、明瞭な現代標準日本語として自然であり、黙示録にふさわしい一定の格調も保っています。「太陽も月も、それを照らすためには必要ない」とすれば、原文の構文を自然に明確化できます。
  terminology: 「都」「栄光」「小羊」は適切です。「ともしび」はλύχνοςの具体的な灯火の比喩を保つ、自然で有効な訳語です。脚注の「そのために輝く」は、日本語では目的の「そのために」と解されやすく、与格αὐτῇの方向・対象を十分に表さないため、「それに向かって輝く」または「それを照らす」とするのがよいです。
