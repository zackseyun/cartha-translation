id: REV.21.10
reference: Revelation 21:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: ja
  text: そして彼は、霊のうちに[a]私を大きく高い山の上に運び、天から、神のもとから下って来る聖なる都エルサレムを私に見せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「霊によって」。このギリシア語の表現は、聖霊の働きによることを指すとも、幻を見る霊的な状態を指すとも考えられる。黙示録では、預言的な幻を導入する際に繰り返し用いられる。
    reason: ἐν πνεύματιの語義と指示対象に曖昧さがあるため。
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: 運び
  rationale: 幻の中で、別の場所・視点へ移される動きを表す。単なる「連れて行き」よりも原語の運搬・移動の力を保ちつつ、現代日本語として自然にした。
- source_word: ἐν πνεύματι
  choice: 霊によって[a]
  rationale: 黙示録で預言的幻を導入する定型句であり、御霊の働きを示す可能性が高い。ただし、幻を見る霊的状態を指す可能性もあるため、本文を簡潔に保ちながら脚注で曖昧さを明示した。
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: 大きく高い山へ
  rationale: ἐπί＋対格の移動先を「へ」で表し、μέγαとὑψηλόνの二つの形容を「大きく高い」としてともに保持した。
- source_word: ἔδειξέν μοι
  choice: 見せた
  rationale: 余分な啓示的意味を加えず、δείκνυμιの基本義を自然な日本語で表した。
- source_word: τὴν πόλιν τὴν ἁγίαν Ἰερουσαλήμ
  choice: 聖なる都エルサレム
  rationale: 「都」と固有名を同格として読みやすく表し、ἁγίανの聖別された性格を「聖なる」で保持した。
- source_word: καταβαίνουσαν
  choice: 下って来る
  rationale: 現在分詞が描く下降中の動きを、自然な日本語の継続的な動作として表した。
- source_word: ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: 神のもとから天より
  rationale: ἀπόが示す究極的な源を「神のもとから」、ἐκが示す天から外へ出る起点を「天より」とし、二つの前置詞句を省かずに保持した。
theological_decisions:
- issue: ἐν πνεύματιにおける「霊」の指示対象
  choice: 本文では「霊によって」とし、御霊の働きを示す読みを前面に置く
  alternative: 「霊のうちに」として、ヨハネの霊的・幻的状態を示す
  rationale: 黙示録1:10、4:2、17:3にも現れる預言的幻の定型句で、聖霊の働きによる幻という理解が有力である。一方、ギリシア語だけでは幻的状態という含みを排除できないため、脚注で代案と幅を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「大きく高い」と二つの修飾を保ち、「神のもとから天より」で原文の二重の起点表現を簡潔に再現した。
