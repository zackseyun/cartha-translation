id: REV.15.7
reference: Revelation 15:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: ja
  text: すると、四つの生き物の一つが、七人の御使いたちに、永遠に生きておられる神の激しい怒りで満ちた七つの金の鉢[a]を渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「鉢」は、浅い鉢状の器を指す。別訳「浅鉢」「盆」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: 四つの生き物の一つ
  rationale: 黙示録の御座を囲む存在を指すため、「獣」ではなく、θηρίονとの区別も保てる「生き物」とした。
- source_word: ἔδωκεν
  choice: 渡した
  rationale: 七人の御使いに器を与える具体的な場面なので、自然な現代日本語として「渡した」とした。
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: 七人の御使いたちに
  rationale: 黙示文学の天上の使者を表す。伝統的でありながら一般にも理解可能な「御使い」を用いた。
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: 七つの金の鉢
  rationale: φιάληは浅い鉢状の器を指す。「金の鉢」は材質と器形を明瞭に伝える。
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: 神の激しい怒りで満ちた
  rationale: θυμόςの強さと終末的な裁きの厳粛さを示しつつ、「憤怒」より平明な表現とした。属格を内容として自然に表した。
- source_word: τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 永遠に生きておられる
  rationale: 分詞は神を修飾し、続く慣用句はその生が尽きないことを表す。日本語では一続きの修飾節として自然に訳した。
theological_decisions:
- issue: 神のθυμόςの訳語
  choice: 神の激しい怒り
  alternative: 神の憤り／神の憤怒
  rationale: 単なる感情へ弱めず、また過度に古風にならないよう、裁きにおける強い怒りを明示した。
- issue: 神の生と永遠性の関係
  choice: 永遠に生きておられる神
  alternative: 世々限りなく生きておられる神／生ける神、世々限りなく
  rationale: τοῦ ζῶντοςを神に結び付け、εἰς τοὺς αἰῶνας τῶν αἰώνωνをその生の永続性として読めるギリシア語の統語関係を、明瞭な現代日本語で保った。
translation_notes:
  register: 明瞭で荘重な現代標準日本語。黙示録におけるζῷονとθηρίονの区別を保ち、終末的裁きの強さを薄めない表現とした。
