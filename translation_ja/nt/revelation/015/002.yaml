reference: Revelation 15:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: ja
  text: また、私は火の混じったガラスの海のようなものを見た。獣とその像と、その名を表す数字に打ち勝った者たちが[a]、そのガラスの海の上に立ち、神の竪琴を手にしていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 字義的には「獣から、その像から、またその名を表す数字から勝っている者たち」となる。このギリシア語の表現は、獣などに対する勝利を示すとも、それらの支配から抜け出したことを含むとも理解され得る。
    reason: alternative_reading
  - marker: b
    text: 「神の竪琴」は、神の所有する竪琴、神から与えられた竪琴、または神にささげられた竪琴を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς θάλασσαν ὑαλίνην
  choice: ガラスの海のようなもの
  rationale: ὡςが示す幻の中の類似・外観を保ちつつ、ὑάλινοςのガラスまたは水晶を思わせる比喩を自然な日本語で表した。
- source_word: μεμιγμένην πυρί
  choice: 火の混じった
  rationale: 完了受動分詞が描く複合的な外観を解釈で具体化せず、その異様な像を簡潔に保った。
- source_word: τοὺς νικῶντας
  choice: 打ち勝った者たち
  rationale: 黙示録で反復されるνικάωの克服・勝利の意味を、軍事的征服に限定しない自然な表現で示した。
- source_word: ἐκ τοῦ θηρίου ... καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ
  choice: 獣とその像と、その名を表す数字に打ち勝った
  rationale: νικάωに続くἐκの特異な構文を、日本語では勝利の対象として自然に表現した。ただし、獣の支配から抜け出したという含みも脚注で保持した。ἀριθμὸς τοῦ ὀνόματοςは単なる『名前の数字』より明瞭な『その名を表す数字』とした。
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: そのガラスの海の上に立っていた
  rationale: ἐπί＋対格の示す『上に』という印象的な幻の描写を弱めずに訳した。
- source_word: κιθάρας τοῦ θεοῦ
  choice: 神の竪琴
  rationale: κιθάραを現代日本語で理解しやすい『竪琴』とし、属格は所有・由来・神への奉献のいずれもあり得るため『神の』として曖昧さを保った。
theological_decisions:
- issue: νικῶνταςに続く反復されたἐκが示す、勝利者と獣との関係
  choice: 獣、その像、その名を表す数字に打ち勝った者たち
  alternative: 獣とその像とその名を表す数字の支配から抜け出した者たち
  rationale: 黙示録におけるνικάωの勝利・克服の主題と自然に合う一方、ἐκ本来の『～から』が示し得る脱出・解放の含みは脚注に残し、神学的緊張を解消し切らないようにした。
- issue: κιθάρας τοῦ θεοῦの属格の関係
  choice: 神の竪琴
  alternative: 神から与えられた竪琴／神にささげる竪琴
  rationale: 本文では属格の関係を限定せず、所有、由来、奉献という可能性を脚注で明示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、黙示文学の荘厳で印象的な光景を保持した。「竪琴」は一般読者に通じやすく、「ガラスの海」は反復される原文の像を一貫して示す。
