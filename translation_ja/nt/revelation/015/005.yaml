id: REV.15.5
reference: Revelation 15:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ μετὰ ταῦτα εἶδον, καὶ ἠνοίγη ὁ ναὸς τῆς σκηνῆς τοῦ μαρτυρίου ἐν τῷ οὐρανῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/005.yaml
  text: And after these things I saw[a], and the temple of the tabernacle of the testimony in heaven was opened[b],
translation:
  language: ja
  text: その後、私は見た。すると、天にある証しの幕屋[b]の聖所[a]が開かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所」と訳した語は「神殿」とも訳せる。ただし、神殿域全体というより、内部の聖なる場所を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「証しの幕屋」は、神の契約の証しと結びついた荒野の幕屋を思い起こさせる、旧約聖書の聖所用語である。
    reason: cross_reference
lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: その後
  rationale: 幻の展開における時間的順序を自然な現代日本語で示す。ταῦταの複数性は日本語の「その後」に無理なく含まれ、文頭のκαίも次の「すると」によってヨハネの連続的な語り口として反映した。
- source_word: εἶδον
  choice: 私は見た
  rationale: 幻の中での知覚を直接表すアオリストであり、「見た」が最も素直である。
- source_word: ἠνοίγη
  choice: 開かれた
  rationale: アオリスト受動態をそのまま受動表現で訳し、聖所が開く出来事が起こったことを示す。
- source_word: ναὸς
  choice: 聖所
  rationale: ναόςは神殿域全体よりも神の臨在に属する内部の聖なる場所を指し得るため、ここでは幕屋との結びつきを明確にする「聖所」を採用した。「神殿」も可能なので脚注に示した。
- source_word: τῆς σκηνῆς
  choice: 幕屋の
  rationale: 祭儀的文脈のσκηνήは、荒野における会見の幕屋を想起させる。「天幕」よりも旧約聖書とのつながりが伝わる「幕屋」とした。
- source_word: τοῦ μαρτυρίου
  choice: 証しの
  rationale: μαρτύριονはここで神の契約の証言と結びつく旧約の祭儀用語を響かせるため、「証し」とした。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天にある
  rationale: 聖所ないし幕屋を地上ではなく天上の領域に位置づける修飾句として、自然な日本語にした。
theological_decisions:
- issue: 天上の聖所を表す祭儀的イメージ
  choice: 「天にある証しの幕屋の聖所」とし、ναός・σκηνή・μαρτύριονの重なった表現を保持する。
  alternative: 「天の聖所」または「天にある神殿、すなわち証しの幕屋」
  rationale: ギリシア語の属格の連鎖は、荒野の幕屋と黙示録の天上の神殿という双方のイメージを響かせる。単純化した言い換えや同格と断定する訳を避け、原文の構造と神学的緊張を保った。
translation_notes:
  register: 明快で格調を保った現代標準語。「私は見た。すると」と文を区切り、ギリシア語の並列的な展開を日本語として読みやすくした。「証しの幕屋」は一般会話にはない聖書固有の祭儀用語だが、旧約との結びつきを保つため維持した。
