revisions:
- from: また私は、天にもう一つのしるしを見た。それは大いなる驚くべきものであった。七人の天使が、最後の七つの災いを携えていた。これらの災いによって、神の憤りが成し遂げられたのである。[a]
  to: また私は、天にもう一つの大きな、驚くべきしるしを見た。すなわち、最後の七つの災いを携えた七人の天使である。というのは、これらの災いにおいて神の憤りが完了したからである。
  rationale: 本文を原文の構造により近づけつつ、明瞭な現代標準日本語に整えた。天使たちが「もう一つのしるし」の内容であることを明示し、ἐν αὐταῖςの意味を手段に限定しなかった。既存脚注は、改訂本文が場所・領域的用法を直接表しているため不要であり、削除した。
