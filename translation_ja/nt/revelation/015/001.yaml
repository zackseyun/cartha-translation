id: REV.15.1
reference: Revelation 15:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: ja
  text: また私は、天にもう一つの大きな、驚くべきしるしを見た。すなわち、最後の七つの災いを携えた七人の天使である。というのは、これらの災いにおいて神の憤りが完了したからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖον
  choice: しるし
  rationale: 黙示録における、意味を帯びた目に見える象徴的現象を表す標準的で明瞭な訳語。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天に
  rationale: 単なる空ではなく、黙示文学的文脈における天の領域を指す。
- source_word: μέγα καὶ θαυμαστόν
  choice: 大いなる驚くべきもの
  rationale: μέγαの壮大さとθαυμαστόνの畏敬を呼び起こす性質を、現代日本語で荘重かつ自然に表す。
- source_word: ἀγγέλους ἑπτὰ
  choice: 七人の天使
  rationale: ヨハネが見たものを直接的に示す。人格を持つ存在なので助数詞は「人」とした。
- source_word: ἔχοντας
  choice: 携えていた
  rationale: 災いを自らのもとに持ち、その執行に備えている情景を自然に表す。「持っていた」より荘重である。
- source_word: πληγὰς ἑπτὰ τὰς ἐσχάτας
  choice: 最後の七つの災い
  rationale: πληγήを神の裁きとしての「災い」とし、ἐσχάταςの順序上・終局的な意味を「最後の」で保持する。
- source_word: ὅτι
  choice: のである
  rationale: 七つの災いが「最後」と呼ばれる理由を示す因果関係を、前文を受ける自然な日本語で表す。
- source_word: ἐν αὐταῖς
  choice: これらの災いによって
  rationale: ギリシア語のἐνが示す、これらの災いにおいて、またそれらを通して成就するという手段的含意を日本語で明瞭にする。場所的な「その中で」も可能なため注記した。
- source_word: ἐτελέσθη
  choice: 成し遂げられた
  rationale: 単に停止したというより、意図された終点・完成に達したというτελέωの完遂的意味を保持する。
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: 神の憤り
  rationale: θυμόςの強い怒りと裁きの重みを保ちつつ、現代日本語として自然で荘重に表す。
theological_decisions:
- issue: 黙示文学における神の裁きの表現
  choice: 神の憤り
  alternative: 神の怒り／神の激しい怒り
  rationale: 神の裁きに伴う強い怒りを弱めず、「激怒」のように過度に感情的な響きを加えない。
- issue: ἐτελέσθηが示す神の憤りの完遂
  choice: 成し遂げられた
  alternative: 終わった／完了した
  rationale: これらの災いにおいて神の憤りが定められた到達点に至ることを表し、この一節を越えてあらゆる裁きの終結まで断定しない。
- issue: ἐν αὐταῖςと災いの関係
  choice: これらの災いによって
  alternative: これらの災いの中で
  rationale: 手段または領域を表し得るἐνの幅を踏まえ、本文では自然な手段的表現を採り、場所・領域的な可能性を脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録の荘重さを保った。「大いなる」は文語的だが現代の聖書文体でも理解しやすく、μέγαの格調を伝える。長いギリシア語文は日本語の可読性のため三文に分けた。
