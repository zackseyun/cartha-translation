id: REV.15.6
reference: Revelation 15:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: ja
  text: そして、七つの災いを持つ七人の天使たちが聖所[a]から出て来た。彼らは清く輝く亜麻布[b]をまとい、胸の周りに金の帯を締めていた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」とも訳せる。ここで用いられているギリシア語は、神殿域全体よりも、その内奥の聖所を指すことが多い。
    reason: lexical_alternative
  - marker: b
    text: 「清らかで光り輝く亜麻布」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: または「胸に金の帯を巻いていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出て来た
  rationale: 聖所の中から外へ移動する方向性を、現代日本語で自然に表した。
- source_word: ἄγγελοι
  choice: 御使いたち
  rationale: 黙示録の天上の幻という文脈では、人間の使者ではなく天的存在を指す。
- source_word: πληγάς
  choice: 災い
  rationale: 神の裁きとして下される打撃を指す黙示録の文脈に適し、日本語としても定着した表現である。
- source_word: ναοῦ
  choice: 聖所
  rationale: 神殿域全体よりも、神の臨在と結びつく内奥の聖域を指す語の狭い意味を保った。
- source_word: ἐνδεδυμένοι
  choice: まとい
  rationale: 衣を身に着けた状態を、荘重さを損なわない自然な日本語で表した。
- source_word: λίνον
  choice: 亜麻布
  rationale: 原文は素材としての亜麻布を示し、『上質な』に相当する別語はないため、その意味を加えなかった。
- source_word: καθαρὸν λαμπρὸν
  choice: 清く輝く
  rationale: καθαρόςの清浄さとλαμπρόςの明るさ・輝きを簡潔に併記した。
- source_word: περιεζωσμένοι περὶ τὰ στήθη
  choice: 胸の周りに…帯を締めていた
  rationale: 胸部を取り巻くように帯を着けた姿を、分かりやすい現代日本語で表した。
- source_word: ζώνας χρυσᾶς
  choice: 金の帯
  rationale: ζώνηの帯・腰帯という意味を保ちつつ、ここでは腰でなく胸に着けるため、限定的な『ベルト』を避けた。
theological_decisions:
- issue: 天上の神殿の文脈におけるναόςの訳語
  choice: 聖所
  alternative: 神殿
  rationale: 天使たちが出て来る神の天上の住まいについて、神殿域全体ではなく聖なる内奥部を表す原語の具体性を保つ。
translation_notes:
  register: 明瞭で格調のある現代標準日本語を用いた。「御使い」は聖書文体として理解されやすい語を保ちつつ、「出で来た」「帯びていた」などの文語的表現は避けた。
source_grounding:
  english_pob_role: consult_only
