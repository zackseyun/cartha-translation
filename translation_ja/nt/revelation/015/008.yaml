id: REV.15.8
reference: Revelation 15:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: ja
  text: そして聖所[a]は神の栄光とその力から出る煙で満たされた。七人の天使の七つの災いが終わるまで、誰も聖所に入ることができなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所」は「神殿」とも訳せる。ギリシア語のナオスは、神殿域全体ではなく、より限定的に神が住まわれる内奥の聖なる場所を指すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: 聖所
  rationale: ναόςは神殿域全体よりも、神が臨在する内奥の聖なる場所を指すことが多い。「聖所」はこの限定された意味を保ちつつ、現代日本語としても明瞭である。二度の出現を同じ語で訳した。
- source_word: ἐγεμίσθη
  choice: 満たされた
  rationale: アオリスト受動直説法の受動の意味を、自然かつ荘重な日本語で表す。
- source_word: καπνοῦ
  choice: 煙で
  rationale: γεμίζωに続く属格を、日本語では内容を示す助詞「で」によって自然に表した。神顕現の文脈でも「煙」が適切である。
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ
  choice: 神の栄光とその力から出る
  rationale: 二度のἐκが示す源・起源を「から」で保った。「出る」は、煙が神の栄光と力を源としているという関係を日本語で明確にする最小限の補足である。
- source_word: οὐδεὶς ἐδύνατο εἰσελθεῖν
  choice: 誰も……入ることができなかった
  rationale: 未完了過去ἐδύνατοが表す、その期間中の継続した不可能性を明瞭に表す。
- source_word: ἄχρι τελεσθῶσιν
  choice: 終わるまで
  rationale: 時間的な限界と、災いが完了する結果を簡潔で自然な日本語にした。受動形を機械的に再現せず、意味を保持した。
- source_word: αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων
  choice: 七人の御使いたちの七つの災い
  rationale: πληγήは黙示録の文脈で神の裁きとして下る「災い」を指す。属格は七人の御使いたちに属する、または彼らと結び付いた災いという原文の関係を限定せずに保つ。
theological_decisions:
- issue: 黙示的な天上礼拝の文脈におけるναόςの訳語
  choice: 聖所
  alternative: 神殿
  rationale: 旧約の神顕現を思わせる場面で、神の臨在する内奥の聖なる場所を示す語義を優先した。ただし「神殿」も可能であるため、脚注に残した。
- issue: 煙と神の栄光・力との関係
  choice: 神の栄光とその力から出る煙
  alternative: 神の栄光とその力による煙
  rationale: ἐκは源を示すため、「から」によって、煙が栄光と力を源として出るという像を保った。「による」として原因・手段に限定することを避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録にふさわしい荘重さを保った。「御使い」は聖書的な文体を保ちつつ一般読者にも理解可能な語として採用した。原文の二つの節を日本語でも二文に分け、出来事の進行と時間的制限を読み取りやすくした。
