id: REV.15.3
reference: Revelation 15:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: ja
  text: '彼らは、神のしもべモーセの歌と小羊の歌を歌いながら、こう言う。


    「全能者である主なる神よ、


    あなたのみわざは偉大で、驚くべきものです。


    世々の王よ[a]、


    あなたの道は正しく、真実です。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「世々の王」の代わりに「諸国民の王」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: 歌う
  rationale: 現在形による幻の生き生きとした叙述を、自然な日本語の現在形で表した。
- source_word: τὴν ᾠδὴν Μωϋσέως
  choice: モーセの歌
  rationale: ᾠδήの一般的な意味を「歌」とし、典礼的な含みを不必要に加えなかった。
- source_word: τοῦ δούλου τοῦ θεοῦ
  choice: 神のしもべ
  rationale: δοῦλοςが示す神への帰属と従属を保ちつつ、モーセの称号として自然で荘重な日本語とした。「奴隷」は語義の一面を強く表すが、この称号では現代日本語に不要な社会制度上の連想を生じさせやすい。
- source_word: τοῦ ἀρνίου
  choice: 小羊
  rationale: 黙示録におけるキリスト論的称号として、犠牲とメシア的なイメージを保つため「小羊」とした。
- source_word: Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου
  choice: あなたのみわざは偉大で、驚くべきものです
  rationale: 述語形容詞の構造を保ち、θαυμαστάが表す驚嘆を明確な現代日本語で表した。ἔργαは神の行為を指す文脈にふさわしく「みわざ」とした。
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: 全能者である主なる神よ
  rationale: 「主」「神」「全能者」の三要素をすべて保ち、呼びかけとして自然な日本語に整えた。
- source_word: δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου
  choice: あなたの道は正しく、真実です
  rationale: ὁδοίの比喩を「道」として保持し、δίκαιαιとἀληθιναίを解釈で狭めず「正しく、真実」とした。
- source_word: ὁ βασιλεὺς τῶν αἰώνων
  choice: あらゆる時代の王
  rationale: αἰώνωνの複数形を明示し、「永遠の王」と意訳して時間的な表現を単一概念にまとめることを避けた。
theological_decisions:
- issue: モーセに付されたδοῦλοςの訳語
  choice: 神のしもべ
  alternative: 神の奴隷
  rationale: 神への帰属と委任を示す称号の力を保ちながら、現代日本語で「奴隷」が喚起する所有制度上の意味に過度に限定しないため。柔らかな「奉仕者」にはせず、従属の含みを残した。
- issue: 節末の王の称号に関する本文異読
  choice: あらゆる時代の王
  alternative: 諸国民の王
  rationale: 提示されたSBLGNT本文のαἰώνωνに従った。一方、ἐθνῶνは意味上重要な異読なので脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、賛歌と神への呼びかけにふさわしい荘重さを保った。詩的な並行関係が見えるよう改行し、古風すぎる「世々の王」は避けた。
