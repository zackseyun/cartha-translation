id: REV.15.4
reference: Revelation 15:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: ja
  text: '主よ、だれがあなたを畏れず、

    御名をあがめないでしょうか。


    あなただけが聖なる方だからです。


    すべての国々は来て、

    あなたの御前で礼拝するでしょう。


    あなたの正しいみわざ[a]が明らかにされたからです。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正しい裁き」。ギリシア語は、正しい行為のほか、司法上の判決や定めを指すこともある。ここでは、神の正義が行為として明らかにされたことを指すと考えられる。
    reason: δικαιώματαの語義には「正しい行為」「裁き」「定め」があり、文脈上の選択を示しつつ語義上の曖昧さを保持するため。
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: だれがあなたを畏れず……ないでしょうか
  rationale: οὐ μήを伴う修辞疑問の強い否定を、答えが「だれもいない」となる自然な日本語の疑問表現で示した。「畏れる」は、単なる恐怖ではなく、神への畏敬を含む文脈に適する。
- source_word: κύριε
  choice: 主よ
  rationale: κύριοςの呼格を、神への直接の呼びかけとして簡潔かつ荘重に訳した。
- source_word: δοξάσει τὸ ὄνομά σου
  choice: 御名をあがめないでしょうか
  rationale: δοξάζωの「栄光を帰す、あがめる」という意味と、神の名を尊ぶ聖書的表現を自然な現代日本語で保った。前節の否定を共有する形で修辞疑問を構成した。
- source_word: μόνος ὅσιος
  choice: あなただけが聖なる方
  rationale: μόνοςの排他的意味を「あなただけ」で明示し、ὅσιοςはこの賛歌の文脈に即して「聖なる方」とした。
- source_word: πάντα τὰ ἔθνη
  choice: すべての国々
  rationale: 終末における諸民族の普遍的な礼拝を表すため、ἔθνηの集合的意味を保った。
- source_word: ἥξουσιν
  choice: 来て
  rationale: 未来の到来を、後続の礼拝行為と自然につながる日本語で表した。文全体の述語「礼拝します」が未来の預言的内容を担う。
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: あなたの御前で礼拝します
  rationale: προσκυνέωの宗教的礼拝の意味を採り、ἐνώπιόν σουを「あなたの御前で」と明示した。
- source_word: τὰ δικαιώματά σου
  choice: あなたの正しいみわざ
  rationale: δικαίωμαが持つ正しい行為、裁き、定めという幅を不必要に狭めず、この文脈で現された神の正義の実行を指す表現とした。別の可能性は脚注に示した。
- source_word: ἐφανερώθησαν
  choice: 明らかにされた
  rationale: アオリスト受動形の、隠されていたものが現されたという意味を保った。
theological_decisions:
- issue: 神について用いられるὅσιοςの訳
  choice: 聖なる方
  alternative: 真実な方／敬虔な方
  rationale: ここでは神の唯一性をたたえる礼拝賛歌であり、道徳的・宗教的な聖さを表す「聖なる方」が最も自然である。ただし、語が持ち得る忠実さの含意を教派的に限定して読み込まない。
- issue: 黙示的な裁きの文脈におけるδικαιώματα
  choice: 正しいみわざ
  alternative: 正しい裁き／定め
  rationale: 諸国民の前に現された神の正義の実行を広く表し、司法的判決または法規だけに意味を限定しない訳を本文に採った。語義上の重要な別訳は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神への呼びかけには「主よ」「御名」「御前」を用いて礼拝賛歌としての品位を保った。修辞疑問は日本語として自然な「だれが……ないでしょうか」とし、詩的な並行性が見えるよう改行した。
