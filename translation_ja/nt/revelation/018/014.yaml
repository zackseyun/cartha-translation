id: REV.18.14
reference: Revelation 18:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: ja
  text: あなたの魂が切望していた果実は、あなたから去った。ぜいたくで華やかなものはすべて、あなたから失われた。それらは、もう二度と見つからない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「見つける」の三人称複数で、主語は明示されていない。「人々はそれらをもう二度と見つけない」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: 熟れた果実
  rationale: 晩夏から秋に実る熟した果実を指す語であり、単なる比喩的な「実」へ一般化せず、商品とぜいたく品を嘆く文脈にも合う具体性を保った。
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: あなたの魂が切望した
  rationale: 属格の連鎖を自然な日本語に組み替えつつ、ψυχήを「魂」として明示し、内奥からの強い欲求を表すἐπιθυμίαを「切望した」と訳した。
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: あなたから去り
  rationale: 離れて行き、もはや手元にないという結果を簡潔に示す。哀歌調の格調も保つ。
- source_word: πάντα τὰ λιπαρὰ
  choice: ぜいたくなものはすべて
  rationale: ここでのλιπαράは脂肪分の多い食物だけでなく、豊かで豪奢な品々を広く指すため、「ぜいたくなもの」とした。
- source_word: τὰ λαμπρὰ
  choice: 華やかなもの
  rationale: 輝きや見栄えのよい豪華さを表す語であり、商業的な繁栄と奢侈の文脈に自然な「華やかな」を選んだ。
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: あなたから失われた
  rationale: 中動・自動詞的な「滅びる、失われる」の意味を表し、所有していた品々が取り戻せない形で消えたことを示す。
- source_word: οὐκέτι οὐ μὴ
  choice: もう二度と…ない
  rationale: 重ねられた強い否定を、現代日本語で最終性を明確に表す定型表現にした。
- source_word: αὐτὰ εὑρήσουσιν
  choice: それらは…見つからない
  rationale: 明示されていない三人称複数の主語を特定せず、受動的な日本語で失われた品々が回復不能であることを表した。
theological_decisions:
- issue: εὑρήσουσινの暗黙の主語
  choice: 「それらは…見つからない」という受動的表現
  alternative: 「人々はそれらを…見つけない」または「彼らはそれらを…見つけない」
  rationale: ギリシア語には明示された主語がなく、不特定の人々を表す三人称複数と理解できる。本文では特定の行為者を補わず、失ったものが二度と発見されないという意味を自然に伝え、別解は脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、バビロンへの哀歌にふさわしい簡潔で格調ある調子にした。「魂」は原文の内面的な切望を保持するため残し、「ぜいたくで華やかなもの」は奢侈品全般を自然に表す。
