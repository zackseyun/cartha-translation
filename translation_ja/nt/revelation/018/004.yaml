id: REV.18.4
reference: Revelation 18:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: ja
  text: また私は、天から別の声がこう言うのを聞いた。「私の民よ、彼女[a]のもとから出なさい。彼女の罪に加わらず、また彼女に下る災いを受けないように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼女」は、バビロンを女として擬人化した表現である。
    reason: 女性形代名詞αὐτῆςが保つ、バビロンの女性的擬人化を明示するため。
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: 別の声
  rationale: 先の話者とは異なる、もう一つの声を自然な現代日本語で表す。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: ここでのοὐρανόςは空ではなく天上の領域を指す。
- source_word: Ἐξέλθατε
  choice: 出なさい
  rationale: ἐξέρχομαιのアオリスト命令法複数であり、その場を離れるよう求める直接的な命令を表す。日本語では話者の位置を補わず「出なさい」とするのが自然である。
- source_word: ὁ λαός μου
  choice: 私の民よ
  rationale: 形の上では主格だが呼びかけの働きを持つため、「よ」でその力を明示する。
- source_word: ἐξ αὐτῆς
  choice: 彼女から
  rationale: 女性形代名詞が、女として擬人化されたバビロンを指すことを保持する。
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: 彼女の罪に加わらず
  rationale: συγκοινωνέωが表す共有・参与を、罪への共犯的参加が伝わる簡潔な日本語にする。
- source_word: ἐκ τῶν πληγῶν αὐτῆς
  choice: 彼女が受ける災いを
  rationale: ἐκは災いの一部を受けることを示す。「彼女の災い」では、彼女が与える災いとも読めるため、文脈上バビロンに下る災いであることを自然に表す。
- source_word: πληγῶν
  choice: 災い
  rationale: 黙示録における神の裁きとしての打撃・災厄を表す。現代日本語では「疫病」より広く、文脈に適する。
- source_word: ἵνα μὴ λάβητε
  choice: 受けないため
  rationale: ἵναと接続法による目的・回避の意味を表す。
theological_decisions:
- issue: αὐτῆςが指すバビロンの擬人化
  choice: 「彼女」として女性の擬人化を保持する
  alternative: 都市・体制として「そこ」「それ」と訳す
  rationale: 黙示録はバビロンを女として描いており、その文学的・黙示的イメージを中性化しない。
- issue: 二つのἵνα節の関係
  choice: 二つをまとめて、退出命令の目的を示す一続きの表現とする
  alternative: 「罪に加わらないため、また災いを受けないため」と「ため」を反復する
  rationale: 原文ではἵναが反復され、二つの回避目的が並列される。日本語では末尾の「ためである」が両方にかかる構文にして自然さを保ちつつ、並列関係を維持する。
- issue: 「彼女の災い」の意味
  choice: 彼女に下り、彼女が受ける災い
  alternative: 彼女が引き起こす、または所有する災い
  rationale: 文脈上、バビロンへの神の裁きに巻き込まれないよう警告している。ただし災いの具体的内容は補足しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「私の民よ」で契約的な呼びかけを保ち、「彼女」によってバビロンの女性擬人化を維持した。
