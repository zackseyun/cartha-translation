  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: ja
  text: 金、銀、宝石、真珠、上質の亜麻布、紫色の布、絹、緋色の布、あらゆる香木[a]、あらゆる象牙製品、最も高価な木材、青銅、鉄、大理石で作られたあらゆる器物、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「トゥイア材」。芳香があり高価だった木材を指すが、樹種の同定には不確かさがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: γόμον
  choice: （前節から続く積み荷の列挙）
  rationale: γόμοςは船荷・積み荷を指すが、本節は属格による品目一覧として前節の「積み荷」を受けるため、日本語では語を重ねず列挙を直接続けた。
- source_word: λίθου τιμίου
  choice: 宝石
  rationale: 単数形だが物質・種類を集合的に表す。現代日本語の交易品一覧では「宝石」が自然である。
- source_word: μαργαριτῶν
  choice: 真珠
  rationale: 標準的な語義。日本語では単複を形態上区別せず、集合的な商品名として自然である。
- source_word: βυσσίνου
  choice: 上質の亜麻布
  rationale: 高級な亜麻布を意味するため、素材とぜいたく品としての性格を明確にした。
- source_word: πορφύρας
  choice: 紫布
  rationale: 染料、布、衣服の可能性があるが、商品一覧の文脈では布地として自然に表現した。
- source_word: σιρικοῦ
  choice: 絹
  rationale: 絹または絹製品を指す語として、簡潔で一般的な日本語を用いた。
- source_word: κοκκίνου
  choice: 緋色の布
  rationale: 緋色の素材を指すため、紫布と並ぶ織物商品であることを明示した。
- source_word: πᾶν ξύλον θύϊνον
  choice: あらゆる香木
  rationale: θύϊνοςは高価で芳香のある木材を指すが、樹種の厳密な同定には不確実性があるため、意味の中心を明瞭に訳し、伝統的名称は脚注に示した。
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: あらゆる象牙製品
  rationale: σκεῦοςは器、道具、品物などを広く指す。象牙から作られた各種商品という意味を自然な日本語で表した。
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου
  choice: 非常に高価な木材、青銅、鉄、大理石で作られたあらゆる器物
  rationale: 反復されるσκεῦοςとἐκに後続する素材を一つのまとまりとして訳した。τιμιωτάτουの最上級的な強意は「非常に高価な」で自然に表した。
- source_word: χαλκοῦ
  choice: 青銅
  rationale: 銅または青銅を意味し得るが、古代の器物の素材を列挙する文脈では「青銅」が適切である。
- source_word: σιδήρου
  choice: 鉄
  rationale: 標準的な語義を採用した。
- source_word: μαρμάρου
  choice: 大理石
  rationale: 標準的な語義を採用した。
theological_decisions: []
