id: REV.18.23
reference: Revelation 18:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: ja
  text: ともしびの光は、二度とおまえの中で輝かず、花婿と花嫁の声も、二度とおまえの中で聞かれない。というのも、おまえの商人たちは地上の有力者[a]であり、おまえの魔術[b]によって、あらゆる国の民が惑わされたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地上の大人物たち」。原語は、高い地位や大きな権力・影響力を持つ人々を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「呪術」。原語は、呪文や薬などを用いる魔術的な行為を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: ともしびの光
  rationale: λύχνοςは当時の油を用いる明かりを指すことが多い。「ともしび」は現代日本語でも理解でき、単なる現代的な電灯を連想させにくい。属格の関係も自然に保った。
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: 二度と…輝かず
  rationale: οὐ μήと接続法による強い否定、およびἔτιが示す永久的な停止を、自然な日本語の「二度と…ない」で表した。
- source_word: ἐν σοὶ
  choice: おまえの中で
  rationale: 擬人化されたバビロンへの二人称の呼びかけを保持した。「おまえ」は裁きの宣告にふさわしい厳粛で強い調子を伝える。
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: 花婿と花嫁の声
  rationale: φωνήの基本的な「声」を保ち、νυμφίοςとνύμφηを明瞭で定着した表現にした。
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: 二度と…聞かれない
  rationale: 強い否定と受動態をともに保持し、最終的な喪失を明確にした。
- source_word: οἱ ἔμποροί σου
  choice: おまえの商人たち
  rationale: 18章を貫く交易の文脈に即し、ἔμποροςを一般的で明瞭な「商人」とした。
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: 地上の有力者
  rationale: μεγιστᾶνεςが表す高い地位や影響力を示しつつ、政治的貴族や富豪だけに意味を限定しない表現を選んだ。
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: おまえの魔術によって
  rationale: φαρμακείαはこの黙示的な裁きの文脈では、薬物一般ではなく呪術・魔術的実践を指す。「魔術」は古風すぎず、語の宗教的・欺瞞的含意を保つ。
- source_word: ἐπλανήθησαν
  choice: 惑わされた
  rationale: 受動形を保ち、欺かれて正しい道から逸らされたというπλανάωの意味の幅を自然に表した。
- source_word: πάντα τὰ ἔθνη
  choice: あらゆる国の民
  rationale: すべての諸民族・諸国民という集合的な広がりを、現代日本語として自然に表した。
theological_decisions:
- issue: φαρμακείαの黙示的裁きの文脈での意味
  choice: 魔術
  alternative: 呪術／魔法／薬物
  rationale: 魔術的実践と欺瞞を含む語義を保ちながら、現代の医薬品や薬物だけを指すかのような限定を避けた。具体的手段の細部は本文が明示しないため、脚注で近接する訳語を示した。
- issue: 反復されるοὐ μήの強さ
  choice: 二度と…ない
  alternative: もはや…ない／決して…ない
  rationale: バビロンへの裁きが取り返しのつかない最終的なものであることを、過度に逐語的にならない自然な日本語で示した。
- issue: ἐπλανήθησανの受動性と主体
  choice: 惑わされた
  alternative: 迷い出た／欺かれた
  rationale: 諸国民が自ら迷ったというより、バビロンの魔術によって惑わされたという文法上の受動関係を保った。一方、欺きの具体的な内容は本文以上に規定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録の裁きの宣告にふさわしい厳粛さを保った。擬人化された都への直接の呼びかけは「おまえ」で一貫させ、二つの強い否定は反復によって響きを保った。
