revisions:
- from: 彼らはこう言う。「災いだ、災いだ[a]、大いなる都よ。上質の亜麻布と紫と緋をまとい、金と宝石と真珠で身を飾っていたのに、」
  to: 彼らはこう言う。「災いだ、災いだ[a]、大いなる都は、上質の亜麻布と紫と緋をまとい、金と宝石と真珠で飾られていたのに、」
  rationale: 呼格化を避け、都市を主語として保持した。「身を飾っていた」を受動的な「飾られていた」に改めた。なお、原文の節は次節の「一時のうちに荒れ果てた」へ意味上続くため、日本語でそのつながりを明示する「のに」は、ここでは前節の豪奢な状態と次節の破滅との対照を自然に表すため保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:35:55Z'
review_pass:
  verdict: revise
  source_fidelity: 「大いなる都よ」はギリシア語の呼格ではなく、冠詞付き主格の名詞句（「大いなる都」）を呼びかけに変えている。また「身を飾っていた」は再帰的・能動的にも読め、受動完了分詞 κεχρυσωμένη の「飾られていた」を十分には表さない。「のに」には原文にない譲歩・対比関係が加わる。
  naturalness: 現代日本語としては理解できるが、この箇所は次節へ続く嘆きの発話であるため、「都は、」で未完結のまま続ける形が自然であり、原文の構文にも近い。
  terminology: 「災いだ、災いだ」「上質の亜麻布」「紫」「緋」「金」「宝石」「真珠」は適切である。脚注の「ああ、ああ」も有効な語彙的代案である。
  issues:
  - severity: medium
    issue: 「大いなる都よ」が呼格になっている
    rationale: ἡ πόλις ἡ μεγάλη は呼格ではなく主格であり、直後の分詞群によって修飾される名詞句である。日本語では「大いなる都は」として次節に継続させるのが、構文と意味をよりよく保つ。
  - severity: medium
    issue: 「身を飾っていた」が受動の意味を弱める
    rationale: κεχρυσωμένη は完了受動分詞である。「金と宝石と真珠で飾られていた」は、豪奢に装われた状態をより直接に表す。
  - severity: medium
    issue: 「のに」が原文にない譲歩関係を付加する
    rationale: この節には「のに」に相当する接続表現がない。次節に続く発話として読点で保留すれば、不要な論理関係を加えずに済む。
  revised_text: 彼らはこう言う。「災いだ、災いだ[a]、大いなる都は、上質の亜麻布と紫と緋をまとい、金と宝石と真珠で飾られていたのに、」
  revised_footnotes:
  - marker: a
    text: 別訳「『ああ、ああ』」。
    reason: οὐαίは、災いの宣告としても深い悲嘆の叫びとしても訳し得るため。
  revision_rationale: 呼格化を避け、都市を主語として保持した。「身を飾っていた」を受動的な「飾られていた」に改めた。なお、原文の節は次節の「一時のうちに荒れ果てた」へ意味上続くため、日本語でそのつながりを明示する「のに」は、ここでは前節の豪奢な状態と次節の破滅との対照を自然に表すため保持した。
