source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: ja
  text: 彼らはこう言う。「災いだ、災いだ[a]、大いなる都は、上質の亜麻布と紫と緋をまとい、金と宝石と真珠で飾られていたのに、」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「『ああ、ああ』」。
    reason: οὐαίは、災いの宣告としても深い悲嘆の叫びとしても訳し得るため。
lexical_decisions:
- source_word: λέγοντες
  choice: 彼らはこう言う
  rationale: 現在能動分詞・主格複数形。前節の商人たちを受けるが、この節だけでも自然に読めるよう主語を補い、発言を導く現在形で訳した。
- source_word: Οὐαὶ οὐαί
  choice: 災いだ、災いだ
  rationale: 悲嘆だけでなく、バビロンへの裁きを告げる預言的な響きを保つ。「ああ、ああ」も文脈上可能なので脚注に示した。
- source_word: ἡ πόλις ἡ μεγάλη
  choice: 大いなる都よ
  rationale: 冠詞を重ねた強調を、呼びかけとして自然で荘重な日本語にした。
- source_word: περιβεβλημένη
  choice: まとい
  rationale: 完了形分詞が表す、衣を着けた状態を簡潔に表す。
- source_word: βύσσινον
  choice: 上質の亜麻布
  rationale: 高価で細かな亜麻布を指すため、単なる「亜麻布」よりも豪奢なイメージを明示した。
- source_word: πορφυροῦν καὶ κόκκινον
  choice: 紫と緋
  rationale: 富や権勢を象徴する鮮明な色彩語として、簡潔で格調ある表現を用いた。文脈上はこれらの色の衣や布を指す。
- source_word: κεχρυσωμένη
  choice: 身を飾っていた
  rationale: 金で覆う意味もあり得るが、後続する金・宝石・真珠全体による豪華な装飾を自然に表した。完了形の状態性を「ていた」で示した。
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίτῃ
  choice: 金と宝石と真珠で
  rationale: ギリシア語は各語が単数形だが、素材や種類を集合的に指す用法として、自然な日本語の総称表現にした。
theological_decisions:
- issue: バビロンの滅亡に対する嘆きと裁きの調子
  choice: 「災いだ」として、嘆きと裁きの告知の両面を保つ
  alternative: 「ああ」として悲嘆を前面に出す
  rationale: 黙示録の裁きの託宣という文脈では、οὐαίには悲しみだけでなく災厄と裁きの響きがあるため。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、黙示文学の荘重さを保つため「大いなる都よ」「緋」を用いた。末尾は次節の理由説明へ続く発言であることを示すため、読点を残した。
