  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: ja
  text: 彼らは自分たちの頭にちりをかぶり、泣き悲しみながら叫んで言った。「災いだ、災いだ、大いなる都よ。その都で、海に船を持つ者は皆、その都のぜいたく[a]によって富を得た。なぜなら、わずか一時のうちに、その都は荒れ果てたからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その都の富によって」「その都の華やかさによって」。ギリシア語は、高価さ、豪奢、富、華やかさを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: 自分たちの頭にちりをかぶり
  rationale: 古代の哀悼の身ぶりを保ちつつ、日本語で自然な聖書表現とした。動作の強さより、その慣用的意味を明瞭に伝える。
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: 泣き悲しみながら叫んで
  rationale: κλαίοντες と πενθοῦντες の重なりを「泣き悲しみ」として自然にまとめ、ἔκραξαν の大声で訴える力は「叫んで」に残した。
- source_word: Οὐαὶ οὐαί
  choice: 災いだ、災いだ
  rationale: 嘆きと裁きの宣告の双方を帯びる反復を保つ。「ああ」とすると裁きの響きが弱まりうる。
- source_word: ἡ πόλις ἡ μεγάλη
  choice: あの大いなる都よ
  rationale: 呼びかけであることを「よ」で示し、既知の都を指す定冠詞の文脈的な働きを「あの」で自然に表した。
- source_word: ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: 海に船を持つ者は皆、その都のぜいたくによって富を得た
  rationale: ἐν ᾗ の字義的な場所表現だけに固定せず、都を介した商業的繁栄という文脈を明確にした。「持つ」は所有者に限定しすぎない。
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: その都のぜいたくによって
  rationale: τιμιότης は高価さ、豪華さ、繁栄を表しうる。商業と奢侈を扱う章の文脈に即して「ぜいたく」とし、船を持つ者が富んだ源を示した。
- source_word: ὅτι μιᾷ ὥρᾳ ἠρημώθη
  choice: それなのに、わずか一時のうちに荒れ果ててしまった
  rationale: μιᾷ ὥρᾳ が強調する突然性を「わずか」で表し、ἠρημώθη の受動的な荒廃と完了した結果を自然な日本語で示した。ὅτι はここでは嘆きの理由・衝撃を導くため、文脈に即して「それなのに」とした。
theological_decisions:
- issue: 黙示的裁きの嘆声 Οὐαὶ οὐαί の訳
  choice: 災いだ、災いだ
  alternative: ああ、ああ
  rationale: この叫びには悲嘆だけでなく裁きの宣告の響きもあるため、両面を保つ「災いだ」を採用した。
- issue: τιμιότης が示す富と奢侈の関係
  choice: その都のぜいたくによって
  alternative: その都の富によって／その都の華やかさによって
  rationale: 語の幅を一義的な金銭的富に狭めず、高価さと豪奢が海上交易者の富の源となったという本文の緊張を保った。
translation_notes:
  register: 現代の一般読者に通じる明快さを優先しつつ、「大いなる都」「災いだ」の荘重な黙示文学的調子を保った。原文の反復と突然の荒廃という対照を明瞭にした。
