id: REV.18.8
reference: Revelation 18:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: ja
  text: それゆえ、一日のうちに、死と悲しみと飢饉という災いが彼女を襲い、彼女は火で焼き尽くされる。彼女を裁いた主なる神は力強い方だからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: それゆえ
  rationale: 直前に述べられた理由から結果が生じることを、簡潔で格調ある現代日本語で示す。
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: 一日のうちに
  rationale: 出来事の急激さと集中を示す原文の時間表現を保持する。
- source_word: αἱ πληγαὶ αὐτῆς ... θάνατος καὶ πένθος καὶ λιμός
  choice: 死と悲しみと飢饉という災いが彼女を襲い
  rationale: 三つの名詞が「災い」の内容を示す同格関係を明確にし、ἥξουσιν（来る）は日本語として自然な「襲う」で表した。
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: 火で焼き尽くされる
  rationale: κατακαίωの徹底して焼くという強意と、受動態を保つ。
- source_word: ἰσχυρός
  choice: 力強い方
  rationale: 原語の基本的な意味である強さ・力を保ち、神を指す日本語として自然にした。
- source_word: κύριος ὁ θεός
  choice: 主なる神
  rationale: 「主」と「神」の両称号を一体として保持する定着した表現。
theological_decisions:
- issue: ὁ κρίνας αὐτήν の時制的表現
  choice: 彼女を裁いた
  alternative: 彼女を裁く
  rationale: アオリスト分詞の形を反映し、裁きが確定したものとして語られる黙示的な緊張を、現在形へ平準化せずに残した。
- issue: 災いと神の裁きとの因果関係
  choice: 主なる神は力強い方だからである
  alternative: 主なる神は全能だからである
  rationale: ὅτιの理由関係を明示しつつ、ἰσχυρόςを「全能」と神学的に拡張せず、「力強い」と訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい簡潔さと荘重さを保った。「彼女」は文脈上人格化されたバビロンを指し、原文の女性代名詞を維持している。
