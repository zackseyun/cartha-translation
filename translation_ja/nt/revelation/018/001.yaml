id: REV.18.1
reference: Revelation 18:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: ja
  text: これらのことの後、私は別の天使が天から降って来るのを見た[a]。その天使は大きな権威を持っており、地はその栄光によって照らされた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「天から降るのを見た」。
    reason: καταβαίνονταは「降って来る」とも、より簡潔に「降る」とも訳せる。
  - marker: b
    text: 直訳「その栄光から照らされた」。
    reason: ἐκは光の源を直接には「……から」と表すが、日本語本文では自然な手段・原因の表現にした。
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: これらのことの後
  rationale: 複数形の指示語ταῦταと、幻の場面が順に展開する時間的なつながりを保つ。
- source_word: εἶδον
  choice: 私は……見た
  rationale: ὁράωの単純過去として、明示されていない「目を上げる」などの動作を加えずに訳した。
- source_word: ἄλλον ἄγγελον
  choice: 別の天使
  rationale: 幻の中ですでに登場した天使たちとは別の一人であることを、自然な現代日本語で示す。
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: 天から降って来る
  rationale: 現在分詞が「見た」と同時進行の動作を表すことを保ち、ἐκの起点も「天から」で明示した。
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: 大きな権威を持っており
  rationale: ἐξουσίαを単なる力ではなく、権限や委ねられた権威を示す語として訳した。
- source_word: ἡ γῆ
  choice: 大地
  rationale: 局地的な「土地」ではなく、宇宙的な広がりを持つ地上世界を指す文脈を自然に表した。
- source_word: ἐφωτίσθη
  choice: 照らされた
  rationale: φωτίζωの受動態を保ち、栄光によって光を受けたという情景を明確にした。
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: その栄光によって
  rationale: ἐκが表す源・原因を自然な日本語で示しつつ、直訳的な表現は脚注に残した。
theological_decisions:
- issue: 天使の権威と栄光の性質
  choice: 本文どおり、天使が大きな権威と栄光を持つと述べるが、その天使を神的存在とは特定しない。
  alternative: 大地を照らすほどの栄光を、天使の神性を示す表現と読む。
  rationale: ギリシア語本文は天使に「大きな権威」と「その栄光」を帰しているが、その存在を神と同一視してはいない。栄光の強い表現を弱めず、同時に本文を越えた教理的限定も加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語とした。「御使い」より一般読者に理解しやすい「天使」を用い、幻の荘厳さは「大きな権威」「大地」「栄光」で保った。
