id: REV.18.13
reference: Revelation 18:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: ja
  text: また、シナモン、香料[a]、香、香油、乳香、ぶどう酒、オリーブ油、上等な小麦粉、小麦、牛、羊、馬、四輪馬車、奴隷[b]、すなわち人のいのち。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「アモモン」。高価な芳香性の香料。
    reason: lexical_alternative
  - marker: b
    text: 「奴隷」は、直訳では「身体」。人間が奴隷として売買されることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: シナモン
  rationale: 輸入された高価な香料としてのシナモンを指す、現代日本語で明瞭な訳語。
- source_word: ἄμωμον
  choice: 香料
  rationale: 高価な芳香植物を指すが、具体的な同定には不確かさがあるため、本文では自然な総称を用い、別案を脚注に示す。
- source_word: θυμιάματα
  choice: 香
  rationale: 商商品の列挙なので、焚く行為ではなく香料そのものを指す。
- source_word: μύρον
  choice: 香油
  rationale: 高価な芳香性の軟膏または油を指し、当時の商品として日本語で具体的に伝わる。
- source_word: λίβανον
  choice: 乳香
  rationale: 先の一般的な『香』とは異なり、特定の香料樹脂である乳香を指す。
- source_word: ἔλαιον
  choice: オリーブ油
  rationale: 文脈上の油はオリーブ油であり、現代の読者に曖昧さを残さない。
- source_word: σεμίδαλιν
  choice: 上等な小麦粉
  rationale: 精製された高品質の小麦粉を表すため、品質を明示する。
- source_word: σῖτον
  choice: 小麦
  rationale: 穀物一般の意味もあり得るが、この商品一覧では小麦が自然な具体訳。
- source_word: κτήνη
  choice: 牛
  rationale: 家畜一般を表し得る語だが、直後の羊との区別を保つため、大型家畜として牛と訳す。
- source_word: πρόβατα
  choice: 羊
  rationale: 通常、羊を指す明瞭な語。
- source_word: ῥεδῶν
  choice: 四輪馬車
  rationale: 戦車よりも四輪の乗用車・荷車を指す語であり、贅沢品を含むローマ時代の交易一覧に適する。
- source_word: σωμάτων
  choice: 奴隷
  rationale: 字義は『身体』だが、商品として売買される人間を表す当時の用法を、現代日本語で誤解なく示す。字義は脚注に残す。
- source_word: ψυχὰς ἀνθρώπων
  choice: 人のいのち
  rationale: 単なる別の商品ではなく、売買される者が生きた人間であることを強調する結び。『魂』に限定せず、人格を含む生命全体を表す。
theological_decisions:
- issue: σωμάτων καὶ ψυχὰς ἀνθρώπων の関係
  choice: 奴隷、すなわち人のいのち
  alternative: 身体、そして人の魂
  rationale: 商品一覧の文脈では σωμάτων は奴隷を指すが、続く句は人間そのものの売買という衝撃を強める。『すなわち』で説明的・頂点的な関係を示しつつ、『人のいのち』によって身体と魂を二つの商品に分ける誤読を避ける。字義的な表現は脚注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある商品列挙とした。原文の反復的な接続は日本語の読点による列挙に整え、終盤の人身売買への衝撃が際立つようにした。
