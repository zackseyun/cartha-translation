source:
  edition: SBLGNT
  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: ja
  text: そして、その都の焼ける煙を見て、彼らは叫んだ。「どの都が、あの大きな都に匹敵するだろうか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「何が、あの大きな都に等しいか」。ギリシア語では、比較対象となる「都」と、「である」に当たる語が省略されている。
    reason: 原文の省略表現を示し、本文で補った「どの都が」と比較の意味を明確にするため。
lexical_decisions:
- source_word: ἔκραξαν
  choice: 彼らは叫んだ
  rationale: κράζωのアオリストが表す大声での叫びを、簡潔で自然な現代日本語にした。
- source_word: βλέποντες
  choice: 見ると
  rationale: 主動詞と同時に起きる分詞の時間的関係を、自然な接続表現で示した。
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: その都が焼かれて立ち上る煙
  rationale: πύρωσιςを単なる「火」ではなく焼かれる過程として訳し、煙との関係を日本語として明瞭にした。αὐτῆςの指示対象は文脈上の都であるため、「その都」とした。
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: どの都が、あの大きな都に並べようか
  rationale: 省略されている比較対象を文脈に即して「都」と補い、修辞疑問の力を保った。「並べようか」は明示されていないコピュラの時制を不必要に限定しない。
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: あの大きな都
  rationale: 定冠詞を伴う既知の都を指す表現として、「あの」を用い、現代の読者に明瞭で自然な表現とした。
theological_decisions:
- issue: バビロンである都の擬人化
  choice: 指示対象を「その都」と明示しつつ、焼かれる主体として描く
  alternative: 「彼女が焼かれて」と女性代名詞を用いる
  rationale: ギリシア語の女性形はπόλις（都）の文法上の性とも一致する。日本語で「彼女」とすると女性人物を過度に前景化するため、文脈上の都を明示し、原文の焼却のイメージは保持した。
- issue: 比較疑問における省略と時制
  choice: 「並べようか」として時制を固定しない
  alternative: 「並ぶ都があっただろうか」または「並ぶ都があるだろうか」
  rationale: 原文はコピュラを明示しない省略表現であり、過去と現在のいずれかに限定せず、都の比類なさを嘆く修辞的な力を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示録の嘆きにふさわしい荘重さを保った。「大いなる」ではなく一般読者に自然な「大きな」を採用し、修辞疑問は「並べようか」で力強く表現した。
