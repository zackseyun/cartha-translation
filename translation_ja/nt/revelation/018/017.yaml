    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: からである
  rationale: 直前の嘆きの理由・内容を示す接続語として、文脈に自然につながるよう訳した。
- source_word: μιᾷ ὥρᾳ
  choice: わずか一時間で
  rationale: 時間を示す与格を「一時間で」とし、急激さを自然な日本語で表すため「わずか」を補った。厳密な所要時間以上の意味は加えていない。
- source_word: ἠρημώθη
  choice: 荒れ果ててしまった
  rationale: 壊滅し、荒廃した状態になるという受動の意味と、嘆きの調子を表した。
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: これほどの富
  rationale: τοσοῦτος が示す富の甚大さと、目前の喪失を嘆く指示的な響きを保った。
- source_word: πᾶς κυβερνήτης
  choice: 船長たち
  rationale: 船を操り、また指揮する者を指す海事用語として、現代日本語で明瞭な語を選んだ。πᾶς の包括性は複数形で表した。
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: 船で各地へ向かう者たち
  rationale: 直訳的な「場所へ航行する者」を自然な日本語にしつつ、乗客など特定の身分に限定しない表現とした。語句の解釈幅は脚注に示した。
- source_word: ναῦται
  choice: 船乗りたち
  rationale: 一般の航海従事者を指す、明瞭で現代的な表現。
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: 海を生業とするすべての者
  rationale: 船乗りに限らず、海に関わる仕事で生活する広い範囲の人々を表す慣用的な日本語とした。
- source_word: ἀπὸ μακρόθεν
  choice: 遠くに
  rationale: 空間的な隔たりを簡潔に表し、続く ἔστησαν と自然に結びつけた。
- source_word: ἔστησαν
  choice: 立ち
  rationale: アオリストの出来事叙述を簡潔に訳した。この節が次節へ続くため、連用形として終えた。
theological_decisions:
- issue: バビロンの滅亡を嘆く海事関係者の範囲
  choice: 船長、船で目的地へ向かう者、船乗り、海を生業とする者を、それぞれ別の集団として訳す
  alternative: 全体を「すべての海の民」など一つの集団にまとめる、または第二の集団を商人・乗客に限定する
  rationale: ギリシア語は複数の集団を並列し、経済的打撃の広がりを修辞的に示している。本文にない身分を補わず、その区別と包括性を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の嘆きにふさわしい格調を保った。引用の閉じ括弧は前節から続く嘆きの終わりを示す。原文では文が次節へ続くため、末尾を「立ち、」とした。
