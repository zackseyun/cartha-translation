  naturalness: 文全体の列挙、引用符、次節に続く「立ち、」は自然である。「船で目的地へ向かう者たち」とすることで、特定の職分に限定せず、現代標準日本語としても明瞭になる。
  terminology: 「船長」「船乗り」「海を生業とするすべての者」は、それぞれの集団を混同せず適切である。「海を生業とする」は、τὴν θάλασσαν ἐργάζονται の広い生計・労働の含意をよく伝える。
