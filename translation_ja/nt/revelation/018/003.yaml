reference: Revelation 18:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: ja
  text: すべての国々が、彼女の淫行に関わる怒りのぶどう酒によって倒れたからである。[a][b] 地上の王たちは彼女と淫行をし、[c] 地上の商人たちは、その放逸なぜいたくの力によって富を得た。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異読では「すべての国々が……ぶどう酒を飲んだ」。ここでは提示されたギリシア語本文πέπτωκανに従い、「倒れた」と訳した。
    reason: textual_variant
  - marker: b
    text: 「彼女の淫行に関わる怒りのぶどう酒」は、別に「彼女の淫行に関わる激しい情念のぶどう酒」とも理解できる。ギリシア語の属格の連なりには複数の解釈があり、θυμόςは「怒り」のほか「激しい情念」を意味し得る。
    reason: lexical_alternative
  - marker: c
    text: ここで「淫行」は、偶像礼拝や、腐敗し搾取を伴う政治的・経済的同盟を比喩的に指すと考えられるが、本文ではギリシア語の性的なイメージを残した。
    reason: alternative_reading
  - marker: d
    text: 「放逸なぜいたく」に当たるギリシア語は、単なる物質的な快適さではなく、節度を失った尊大な奢侈を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: 〜からである
  rationale: 直前のバビロン倒壊の宣告に理由を添える接続詞として、因果関係を明確にした。
- source_word: ἐκ τοῦ οἴνου
  choice: ぶどう酒のために
  rationale: 本文の πέπτωκαν（「倒れた」）と結びつけ、ἐκが示す原因・起因を自然な日本語で表した。ぶどう酒の比喩は保持した。
- source_word: θυμοῦ
  choice: 怒り
  rationale: θυμόςの主要な意味であり、黙示録の裁きの文脈にも適合する。ただし「激しい情念」という可能性と属格連鎖の曖昧さは脚注に残した。
- source_word: πορνείας / ἐπόρνευσαν
  choice: 淫らな行い／淫らな行いをし
  rationale: 性的な像を保ちつつ、現代日本語で理解できる表現とした。偶像礼拝や腐敗した同盟だけに意味を限定しない。
- source_word: πέπτωκαν
  choice: 倒れた
  rationale: 提示されたSBLGNT本文の語形は πίπτω の完了形であり、「倒れた」を意味する。異読に基づく「飲んだ」は脚注で示した。
- source_word: πάντα τὰ ἔθνη
  choice: すべての国々
  rationale: 諸民族・諸国民を集合的に指す表現として自然であり、「異邦人」と狭く限定しない。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上の王たち
  rationale: 黙示録で繰り返される表現を簡潔かつ字義に沿って訳した。
- source_word: ἔμποροι
  choice: 商人たち
  rationale: 18章の交易と富の文脈に最もよく合う一般的な現代語である。
- source_word: ἐκ τῆς δυνάμεως
  choice: 力によって
  rationale: δύναμιςの「力、威力」を保持し、単に「富」と解釈して置き換えることを避けた。
- source_word: στρήνους
  choice: 放逸なぜいたく
  rationale: 単なる快適さではなく、尊大で節度を失った奢侈という語感を簡潔に表した。
- source_word: ἐπλούτησαν
  choice: 富を得た
  rationale: 商人たちがその結果として富裕になったことを、明瞭で自然な日本語にした。
theological_decisions:
- issue: πορνεία／πορνεύωを字義的な性的表現で訳すか、偶像礼拝などの解釈語に置き換えるか
  choice: 「淫らな行い」という性的比喩を本文に保持する
  alternative: 「偶像礼拝」「霊的姦淫」「腐敗した同盟」と訳す
  rationale: 黙示録の表現は政治的・経済的・宗教的な不忠実を含み得るが、一つの解釈に限定せず、原文の意図的な性的イメージと神学的緊張を保つため。
- issue: 「怒りのぶどう酒」と「情念のぶどう酒」のどちらを本文に採るか
  choice: 「怒りのぶどう酒」
  alternative: 「激しい情念のぶどう酒」
  rationale: θυμόςはどちらの意味も取り得るが、黙示録の裁きの文脈を踏まえて「怒り」を本文に採り、別解と属格関係の曖昧さを脚注に示した。
- issue: πέπτωκανを提示本文どおり訳すか、文脈上よく知られた異読に従うか
  choice: 提示された本文どおり「倒れた」
  alternative: 「飲んだ」
  rationale: 原語資料を第一とし、提示された語形の意味を本文に反映した。ぶどう酒との比喩的な結びつきがより自然になる異読は脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録にふさわしい荘重さを保った。「淫らな行い」は古風すぎる「姦淫」や意味を狭める「売春」を避け、原文の性的比喩を普通の読者にも理解可能な形で保持する。「放逸なぜいたく」は στρῆνος の退廃的・過剰な含意を本文で示すための表現である。
