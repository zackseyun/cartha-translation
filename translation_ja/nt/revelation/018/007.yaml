id: REV.18.7
reference: Revelation 18:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: ja
  text: 彼女が自らをあがめ、ぜいたくにふけった[a]分だけ、苦しみと悲しみを彼女に与えよ。彼女は心の中でこう言っているからだ。「私は女王の座に着いている。やもめではない。悲しみを見ることなど決してない[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「放縦に暮らした」「享楽にふけった」。このギリシア語動詞は、豪奢で節度のない自己満足の生活を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「決してない」に当たるギリシア語は強い否定表現で、悲しみが訪れることは絶対にないという確信を示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: …した分だけ、その分だけに相当する…を
  rationale: 自己賛美と放縦の度合いに応じて報いが与えられるという、ギリシア語の対応構文を自然な日本語で保った。
- source_word: ἐδόξασεν αὑτὴν
  choice: 自らをあがめ
  rationale: 再帰的な自己賛美・自己高揚を明示し、単なる自慢に狭めず、δόξαに関わる意味を保つ。
- source_word: ἐστρηνίασεν
  choice: ぜいたくにふけった
  rationale: 豪奢で放縦な自己満足の生活を表す。文脈に合う明瞭な表現とし、性的意味に限定しなかった。
- source_word: δότε αὐτῇ
  choice: 彼女に与えよ
  rationale: 命令形と裁きの調子を直接に表した。
- source_word: βασανισμὸν
  choice: 苦しみ
  rationale: 裁きによる激しい苦痛を表しつつ、身体的な拷問だけに意味を狭めない。
- source_word: πένθος
  choice: 悲しみ
  rationale: 喪失や裁きに伴う深い悲哀を自然な現代日本語で表し、節内の主題を保った。
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: 心の中でこう言っている
  rationale: 内面的な確信と高慢を示す聖書的比喩を、理解しやすい日本語で保持した。
- source_word: Κάθημαι βασίλισσα
  choice: 私は女王の座に着いている
  rationale: 単に女王であると言うだけでなく、王座に安住する姿勢と支配者としての自信を表した。
- source_word: χήρα οὐκ εἰμί
  choice: やもめではない
  rationale: 女性として擬人化されたバビロンの言葉を直接保ち、喪失や見捨てられることはないという自負を示した。
- source_word: οὐ μὴ ἴδω
  choice: 見ることなど決してない
  rationale: οὐ μήによる強い否定を反映し、悲しみは絶対に来ないという尊大な確信を表した。
theological_decisions:
- issue: バビロンを女王・やもめとして描く女性擬人化
  choice: 女性擬人化を一貫して保持する
  alternative: 都市または経済体制として非人格的に言い換える
  rationale: 原文の女性単数表現と女王・やもめの対照は、黙示録の預言的修辞と裁きの描写に不可欠である。
- issue: βασανισμόςの裁きの強度
  choice: 苦しみ
  alternative: 責め苦／拷問／苦痛
  rationale: 厳しい裁きを示しながら、その具体的な手段を原文以上に限定しない表現を選んだ。
- issue: 報いの比例性
  choice: 自己賛美と放縦の分だけ苦しみと悲しみを与える
  alternative: 一般的に罰すると意訳する
  rationale: ὅσα…τοσοῦτονの対応を保ち、行為に比例する裁きという本文の緊張を明示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録の厳粛な裁きの調子を保った。「自らをあがめ」「女王の座」「やもめ」は文学的・聖書的な格調を残しながら、一般読者にも理解可能な表現とした。
