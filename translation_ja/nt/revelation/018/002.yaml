  rationale: 原文の意味、反復構造、およびκατοικητήριον（住みか）とφυλακή（巣窟）の訳し分けを維持したまま、日本語の宣告文としての自然さを改善した。最後の列挙を「巣窟」という名詞句で終え、その後の「となった」を三項全体にかけることで、異読脚注の対象が原文の省略箇所と正確に一致するようにした。
