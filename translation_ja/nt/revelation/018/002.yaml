id: REV.18.2
reference: Revelation 18:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: ja
  text: 'そして彼は、力強い声で叫んで言った。


    「大バビロンは倒れた、倒れた。


    そこは悪霊どもの住みかとなり、


    あらゆる汚れた霊の巣窟、


    あらゆる汚れた鳥の巣窟、


    また、あらゆる汚れた、忌み嫌われる獣の巣窟となった[a][b]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「巣窟」と訳したギリシア語は、「牢獄」または、何かが閉じ込められたり保たれたりする場所を意味することもある。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「また、あらゆる汚れた、忌み嫌われる獣の巣窟」に当たる部分がない。
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν
  choice: 叫んで
  rationale: 大声を上げることを表す動詞の力を、自然な現代日本語で示す。
- source_word: ἐν ἰσχυρᾷ φωνῇ
  choice: 力強い声で
  rationale: ἰσχυρόςの「強い、力ある」という意味を保ち、黙示録の荘重な調子にも合う表現とした。
- source_word: Ἔπεσεν, ἔπεσεν
  choice: 倒れた、倒れた
  rationale: 裁きの成就を告げるアオリストの反復と、イザヤ書を思わせる宣告のリズムを保持した。
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: 大バビロン
  rationale: 日本語で明瞭かつ簡潔に、繰り返し現れる称号的表現を示した。
- source_word: ἐγένετο
  choice: となった
  rationale: 変化の結果として現在その状態にあるという文脈を自然に表す。
- source_word: κατοικητήριον δαιμονίων
  choice: 悪霊どもの住みか
  rationale: κατοικητήριονの居住場所という意味と、δαιμόνιονの具体的な指示を明確にした。
- source_word: φυλακή
  choice: 巣窟
  rationale: この文脈では、汚れた存在が閉じ込められ、また住み着く場所を指し得る。鳥や獣にも自然に通じる「巣窟」を本文に採り、拘禁場所という語義は脚注に残した。
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: あらゆる汚れた霊
  rationale: πᾶςの包括性と、聖書的な「汚れ」の語感を保った。
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: あらゆる汚れた鳥
  rationale: ὄρνεονを文脈から特定の種類に狭めず、原文どおり一般的な「鳥」とした。
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: あらゆる汚れた忌み嫌われる獣
  rationale: θηρίονを一般名詞として訳し、μεμισημένουの受動的な意味を「忌み嫌われる」で表した。
theological_decisions:
- issue: θηρίονが黙示録の象徴的な「獣」を指すか、一般的な動物を指すか
  choice: 一般名詞の「獣」
  alternative: 象徴的敵対者としての「獣」
  rationale: παντόςに支配され、「霊」「鳥」と並ぶ列挙の一部であるため、ここでは一般的な動物を指すと読むのが構文上自然である。特定の象徴的存在との同一視は本文に持ち込まない。
- issue: φυλακήを拘禁場所として訳すか、住み着く場所として訳すか
  choice: 本文では「巣窟」
  alternative: 牢獄、閉じ込めておく場所
  rationale: 語には見張り、拘禁、保持される場所という幅があるが、鳥や獣を含む並行表現では「巣窟」が自然である。拘禁の含意も可能なので脚注で明示し、曖昧さを保った。
- issue: バビロンの陥落を過去の出来事としてだけ示すか、成就を宣告する表現として示すか
  choice: 反復を保った「倒れた、倒れた」
  alternative: 「滅びてしまった」「陥落した」など説明的に展開する
  rationale: 預言的宣告の時制と反復をそのまま生かし、陥落の具体的様態や時間関係を過度に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、反復と改行によって裁きの宣告の荘重な響きを保った。「すみか」と「巣窟」を使い分け、原文のκατοικητήριονとφυλακήの違いを見える形にした。
