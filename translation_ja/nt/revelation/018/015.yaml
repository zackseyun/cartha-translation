id: REV.18.15
reference: Revelation 18:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: ja
  text: これらの品々[注a]を扱う商人たち、すなわち、彼女から富を得た者たちは、彼女の責め苦を恐れて遠く離れて立ち、泣き悲しむ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: 注a
    text: 直訳「これらのものの」。周辺で列挙されるぜいたく品、商品を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἔμποροι τούτων
  choice: これらの品々を扱う商人たち
  rationale: τούτωνは直前に列挙されたぜいたく品を指す。日本語では「これらの商人」だと指示関係が曖昧になるため、属格関係を自然に「これらの品々を扱う」と表した。
- source_word: οἱ πλουτήσαντες ἀπ’ αὐτῆς
  choice: 彼女によって富を得た者たち
  rationale: ἀπόは富の源を示す。「彼女から」よりも自然な日本語で、商人たちが彼女との取引を通して富んだことを表す。受動態を強く示唆しすぎないよう「富を得た」とした。
- source_word: ἀπὸ μακρόθεν στήσονται
  choice: 遠く離れて立ち
  rationale: 意図的に距離を置いて立つ情景を、簡潔で自然な日本語として表した。未来形は日本語では文脈と文末の非過去形によって示される。
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: 彼女の苦しみを恐れて
  rationale: διά＋対格の理由を自然に表した。τοῦ βασανισμοῦは「苦しみ」を意味し、αὐτῆςはその苦しみを受ける者を示す属格として保持した。
- source_word: κλαίοντες καὶ πενθοῦντες
  choice: 泣き悲しむ
  rationale: 二つの分詞は、涙を流す行為と喪失を嘆く行為を重ねて強調する。日本語の定型的な複合表現「泣き悲しむ」により両要素を簡潔に伝えた。
theological_decisions:
- issue: 黙示的裁きにおける βασανισμός の性質
  choice: 「苦しみ」とし、裁きによる厳しい苦痛を保持した。
  alternative: 「苦痛」「責め苦」「刑罰」
  rationale: 文脈上、バビロンが受ける裁きの苦痛を指すが、この節自体はその具体的な形態を詳述しない。「苦しみ」は厳しさを弱めず、拷問という人為的な含意や特定の終末論的教説を付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の厳粛な裁きの場面にふさわしい品位を保った。「彼女」は擬人化されたバビロンへの原文の女性代名詞を保持する。
