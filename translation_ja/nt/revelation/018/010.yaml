id: REV.18.10
reference: Revelation 18:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: ja
  text: 彼女の苦しみを恐れて遠く離れて立ち、こう言う。「災いだ、災いだ。[a] 大いなる都、バビロン、力強い都よ[b]。あなたへの裁きは、たった一時間で下った。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ああ、ああ」。ギリシア語の感嘆詞は、災いの宣告と悲嘆の両方を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「強大な都」。ギリシア語の形容詞は、強さ、力、勢力を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: 遠く離れて立ち
  rationale: 空間的な隔たりと、立ったままでいる者たちの姿勢を、自然な現代日本語で一続きに表した。
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: 彼女の苦しみを恐れて
  rationale: διά＋対格が示す理由を明確にし、βασανισμόςの激しい苦痛という意味を、文脈に合う「苦しみ」で表した。「彼女」は都バビロンを指す原文の女性代名詞に対応する。
- source_word: Οὐαὶ οὐαί
  choice: 災いだ、災いだ
  rationale: 悲嘆だけでなく破局と審判を告げる黙示文学的な響きを保った。「ああ、ああ」も可能なので注記した。
- source_word: ἡ πόλις ἡ μεγάλη
  choice: 大いなる都
  rationale: 都の卓越した規模や威容を示す表現として、聖書的な格調を保ちつつ理解しやすい形にした。
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: 力強い都
  rationale: ἰσχυρόςが表す強さ・勢力を直接的に訳した。「強大な都」も文脈上可能なので注記した。
- source_word: μιᾷ ὥρᾳ
  choice: ただ一時間のうちに
  rationale: 時間の与格を「一時間のうちに」とし、「ただ」を補って滅びの急激さを自然に伝えた。
- source_word: ἦλθεν ἡ κρίσις σου
  choice: おまえに対する裁きは……下った
  rationale: 直訳的な「おまえの裁き」では、バビロンが行う裁きとも読めるため、受け手を表す属格の意味を明確にした。「下った」は裁きが到来し、執行されたことを自然な日本語で示す。
theological_decisions:
- issue: 黙示文学的な感嘆詞 οὐαί の訳し方
  choice: 災いだ、災いだ
  alternative: ああ、ああ
  rationale: οὐαίには悲嘆と破局の宣告の両面がある。「災いだ」は預言的・黙示文学的な重みを保つが、悲嘆を前面に出す訳も可能なため脚注に残した。
- issue: ἡ κρίσις σου における属格の理解
  choice: おまえに対する裁き
  alternative: おまえの裁き
  rationale: 文脈ではバビロンに下る裁きを指す。「おまえに対する」として日本語上の不要な曖昧さを避けたが、原文の簡潔な所有格表現自体は認識している。
- issue: ἦλθεν の時制・相の表現
  choice: 下った
  alternative: 来た
  rationale: アオリストが示す裁きの決定的な到来を、裁判・審判の日本語として自然な「裁きが下る」で表した。これは出来事の完了を伝える翻訳上の選択であり、追加の教理的含意を持たせるものではない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「大いなる都」「災いだ」という表現で黙示文学にふさわしい格調と反復の力を保った。バビロンへの呼びかけには「よ」を用い、直接話法の切迫感を示した。
