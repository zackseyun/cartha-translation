source:
  edition: SBLGNT
  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: ja
  text: 彼女と淫行をし[a]、彼女とともにぜいたくにふけった地上の王たちは、彼女が焼かれることによる煙を見ると、彼女のことで泣き、嘆き悲しむ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「淫行」は、黙示録で繰り返される比喩であり、偶像礼拝や腐敗した結びつきを含意すると考えられる。ただし、原文の性的なイメージも保たれている。
    reason: lexical_alternative
  - marker: b
    text: 「嘆き悲しむ」と訳したギリシア語は、身を打つなど、目に見える仕方で激しく哀悼することを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: 泣き
  rationale: 声を上げて泣き悲しむことを表す未来形。簡潔で自然な現代日本語とした。
- source_word: κόψονται
  choice: 嘆き悲しむ
  rationale: この文脈では、身を打つなどの動作を伴う公然たる哀悼を表す慣用的用法。字義的な身体動作に限定せず、哀悼の意味を本文に示した。
- source_word: ἐπ’ αὐτὴν
  choice: 彼女のために
  rationale: 哀悼の対象を示すἐπί＋対格を、日本語として自然に表した。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上の王たち
  rationale: 黙示録における世界の支配者たちを指す定型的な表現として訳した。
- source_word: μετ’ αὐτῆς
  choice: 彼女と／ともに
  rationale: 後続する二つの分詞に共有される連帯関係が日本語でも伝わるよう、それぞれに自然な形で表した。
- source_word: πορνεύσαντες
  choice: 淫行をし
  rationale: 性的な比喩表現を保持し、偶像礼拝や腐敗した結びつきという文脈上の含意だけに意味を限定しなかった。
- source_word: στρηνιάσαντες
  choice: ぜいたくにふけった
  rationale: 放縦で自己 indulgent な豪奢な暮らしを示す語感を、明瞭な現代日本語で表した。
- source_word: ὅταν βλέπωσιν
  choice: 見ると
  rationale: 預言の中の将来的な時を示す条件的表現を、自然な日本語の時の節とした。
- source_word: τὸν καπνὸν
  choice: 煙
  rationale: 直接的な対応語を用いた。
- source_word: τῆς πυρώσεως αὐτῆς
  choice: 彼女が焼かれる
  rationale: 火によって焼かれる出来事を表しつつ、近接節の表現を不必要に補わなかった。
theological_decisions:
- issue: バビロンとの「淫行」の性質
  choice: 本文に性的な比喩である「淫行」を残す。
  alternative: 「不正な関係を結ぶ」「不貞を働く」など、比喩的意味を前面に出す。
  rationale: 黙示録では偶像礼拝や腐敗した同盟を表す含意がある一方、原文の性的イメージそのものも重要であるため、解釈を一つに固定しない。
- issue: κόψονταιの哀悼表現
  choice: 「嘆き悲しむ」と訳す。
  alternative: 「身を打って嘆く」「胸を打って悲しむ」とする。
  rationale: 語は公然たる哀悼の動作を想起させるが、特定の身体部位や自傷行為を本文に付加せず、中心的な意味を明瞭に伝える。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「淫行」は黙示文学の強い比喩を保持するために採用し、「ぜいたくにふける」は経済的・道徳的な放縦を平易に表した。
