id: REV.18.22
reference: Revelation 18:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: ja
  text: 竪琴を奏でる者、音楽家、笛[a]を吹く者、ラッパを吹く者の音は、もはやおまえの中で決して聞かれない。あらゆる技の職人も、もはやおまえの中に決して見いだされない。挽き臼の音も、もはやおまえの中で決して聞かれない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「笛」は古代の管楽器アウロスを指し、現代のフルートと同じものではありません。
    reason: lexical_alternative
  - marker: b
    text: 別訳「臼の音」。ここでは穀物を挽く器具、またはその働く音を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: 音
  rationale: ここでは話し声ではなく、演奏や臼から生じる聞こえる音を指す。「音」によって原文の反復も保てる。
- source_word: κιθαρῳδῶν
  choice: 竪琴を弾く者
  rationale: キタラに関わる演奏者を指す。古代楽器を現代日本語で厳密に一語対応させることは難しいため、聖書文脈で分かりやすい「竪琴」を用いた。
- source_word: μουσικῶν
  choice: 楽を奏でる者
  rationale: 音楽に携わる者を広く表す語。直前直後の具体的な奏者との並びを保ちつつ、自然な日本語とした。
- source_word: αὐλητῶν
  choice: 笛を吹く者
  rationale: 古代の管楽器アウロスの奏者を指す。現代のフルートと同一ではないため、より広い「笛」とした。
- source_word: σαλπιστῶν
  choice: ラッパを吹く者
  rationale: σάλπιγξを吹く者を、普通の読者に分かりやすい表現で訳した。
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: もはや…決して聞かれない
  rationale: οὐ μήと接続法による強い否定、およびἔτιが示す今後の完全な停止を明確に表す。
- source_word: ἐν σοὶ
  choice: おまえのうちに
  rationale: 人格化された都バビロンへの二人称の直接呼びかけを保持する。裁きの宣告に合う「おまえ」を選んだ。
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: どのような技を持つ職人も
  rationale: あらゆる種類の職人を包括する表現。原文の同語反復を不自然に直訳せず、その広がりを明瞭にした。
- source_word: οὐ μὴ εὑρεθῇ
  choice: 決して見いだされず
  rationale: 強い否定によって職人が完全にいなくなることを表しつつ、εὑρίσκωの受動形に対応する。
- source_word: μύλου
  choice: ひき臼
  rationale: 穀物を挽く器具とその営みを想起させる語として自然であり、「臼」だけよりも意味を限定して伝えられる。
theological_decisions:
- issue: バビロンへの裁きが示す完全な荒廃
  choice: 音楽、職人の営み、日々の製粉の音が完全に絶えるという三重の宣告として訳す
  alternative: 列挙された事物を象徴的意味のない装飾的細部として扱う
  rationale: 原文で繰り返されるοὐ μή…ἔτιは、都の生活が徹底的かつ最終的に失われることを強調する。ただし個々の要素を特定の教理へ寓意化せず、具体的な像のまま保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。人格化されたバビロンへの直接的な裁きの宣告なので二人称は「おまえ」とした。「もはや…決して」を三度対応させ、原文の強い否定と反復のリズムを保持した。
