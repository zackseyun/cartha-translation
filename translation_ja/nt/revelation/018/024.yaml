id: REV.18.24
reference: Revelation 18:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐν αὐτῇ ⸀αἷμα προφητῶν καὶ ἁγίων εὑρέθη καὶ πάντων τῶν ἐσφαγμένων ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: ja
  text: また、この女[c]の中に、預言者たちと聖なる者たち[a]の血、さらに地上で虐殺されたすべての人々[b]の血が見いだされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖徒たち」または「神の聖なる民」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「地上で殺されたすべての人々」とも訳せる。原語の動詞は単に「殺す」より強く、「虐殺する」「屠る」という意味を持ちうる。
    reason: lexical_alternative
  - marker: c
    text: 「この女」は、周囲の幻の中で女として描かれているバビロンを指す。
    reason: cross_reference
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: この女の中に
  rationale: 女性形の代名詞は、周囲の幻で女として描かれるバビロンを指す。日本語で擬人化された女性像を保ちつつ、指示対象が分かる表現とした。
- source_word: αἷμα
  choice: 血
  rationale: 原語の直接的な意味を保ち、文脈にある流血とその責任の含意も伝える。
- source_word: προφητῶν
  choice: 預言者たち
  rationale: προφήτηςの標準的で明確な訳語。複数形も明示した。
- source_word: ἁγίων
  choice: 聖なる者たち
  rationale: 神に属する者として聖別された人々を指す。現代の一般読者にも意味が取りやすく、特定の教派的用語に限定されない表現を選んだ。
- source_word: εὑρέθη
  choice: 見いだされた
  rationale: アオリスト受動態を素直に反映し、隠されていた罪責が明らかになる司法的・開示的な響きを保った。
- source_word: πάντων τῶν ἐσφαγμένων
  choice: 虐殺されたすべての人々
  rationale: σφάζωが一般的な「殺す」より強い暴力的な語であることを表す。「すべて」を保持し、完了分詞が示す殺害済みの人々を自然な日本語で表現した。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: 黙示録における広い終末論的範囲に合うよう、局地的な「その土地」ではなく「地上」とした。
theological_decisions:
- issue: バビロンの流血責任の範囲
  choice: 預言者、聖なる者たち、そして地上で虐殺されたすべての人々の血がバビロンの中に見いだされた、という包括的な告発をそのまま保つ。
  alternative: 最後の句を、バビロンが象徴する勢力に帰される正しい者たちの流血全体についての誇張的・代表的表現と理解することも、幻の象徴世界の中で普遍的な責任を述べるものと理解することもできる。
  rationale: ギリシア語本文は告発の範囲を限定せず、その象徴が歴史上の出来事にどう対応するかも説明していないため、翻訳ではその幅と神学的緊張を狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見いだされた」で黙示文学の荘重さと受動表現を保持した。「聖なる者たち」は意味の透明性を優先し、「虐殺された」は原語の強さを一般読者に伝えるために選んだ。
