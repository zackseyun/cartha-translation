  source_fidelity: ギリシア語の構文と語義を適切に反映している。ἐν αὐτῇは、女性として描かれるバビロンを受ける「この女の中に」とし、αἷμαが「預言者たちと聖なる者たち」および「地上で虐殺されたすべての人々」の双方に係る点も、「血」の反復によって日本語で明瞭に示している。εὑρέθηの受動的・告発的表現も「見いだされた」に保たれている。
  naturalness: 明瞭な現代標準日本語として自然であり、黙示文学にふさわしい一定の荘重さもある。「この女の中に」は逐語的ではあるが、血がそこに見いだされるという幻視的・法廷的表現を保つために許容される。
  terminology: 「預言者たち」「聖なる者たち」「血」「地上」「見いだされた」はいずれも適切である。「聖なる者たち」はἁγίωνを特定教派の含意なく明瞭に表す。「虐殺された」はσφάζωの強い暴力性をよく伝えており、注記も代替訳と語の強さを適切に説明している。
