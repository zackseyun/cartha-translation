  terminology: 「天」「聖なる者たち」「使徒たち」「預言者たち」は適切である。「彼女」はバビロンを指す文脈上の女性代名詞として維持できる。「あなたがたのために裁きを行われた」は、κρίμαの司法性を保ちつつ、日本語で「あなたがたの裁き」が彼らへの判決と誤読されることを避ける。
