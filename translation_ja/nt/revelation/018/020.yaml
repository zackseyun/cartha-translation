id: REV.18.20
reference: Revelation 18:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: ja
  text: 天よ、また聖なる者たち、使徒たち、預言者たちよ、彼女のことで喜べ。神が彼女に対して、あなたがたのために裁きを行われたからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「神が彼女から、あなたがたの裁きを裁かれた」。ギリシア語は「裁く」と「裁き」の同根語を重ねた圧縮された表現である。文脈上、「神があなたがたのために彼女を裁かれた」または「神が彼女に対してあなたがたの訴えに判決を下された」と理解できる。
    reason: 原文の同根語表現とἐξ（「…から」）を示しつつ、本文の自然な司法的表現が一つの解釈に意味を固定しすぎないようにするため。
lexical_decisions:
- source_word: Εὐφραίνου
  choice: 喜べ
  rationale: 二人称単数の命令の力を簡潔に保ち、天への呼びかけと、それに続く聖なる者たちへの勧めを自然な日本語で一つにまとめた。
- source_word: ἐπ’ αὐτῇ
  choice: 彼女のことで
  rationale: 喜びの対象または契機を表すἐπί＋与格を自然に表現し、単に場所的な「彼女の上で」とはしなかった。
- source_word: οὐρανέ
  choice: 天よ
  rationale: 単数呼格による擬人化された天への荘重な呼びかけを保った。
- source_word: οἱ ἅγιοι
  choice: 聖なる者たち
  rationale: 神に属する民を指す語義を明確にしつつ、特定の教派的な「聖人」という含意を避けた。
- source_word: οἱ ἀπόστολοι
  choice: 使徒たち
  rationale: 預言者たちと並ぶ文脈では、一般的な使者ではなく、確立した称号としての「使徒」が適切である。
- source_word: οἱ προφῆται
  choice: 預言者たち
  rationale: προφῆταιの標準的で文脈に適した訳語である。
- source_word: ὅτι
  choice: からである
  rationale: 喜ぶよう命じる理由を導く因果関係を明確にした。
- source_word: ἔκρινεν
  choice: 裁きを…行われた
  rationale: κρίνωの司法的意味を保ち、神による完了した裁きの行為として表した。
- source_word: τὸ κρίμα ὑμῶν
  choice: あなたがたに関わる裁き
  rationale: 直訳的な「あなたがたの裁き」が日本語では彼ら自身への有罪判決とも誤解されやすいため、彼らの訴え・彼らのための裁きという幅を残す表現にした。
- source_word: ἐξ αὐτῆς
  choice: 彼女に対して
  rationale: 圧縮されたギリシア語が、バビロンから裁きを取り立てること、または彼女を相手として裁くことを示すと見て、本文では自然な司法表現とし、直訳形は脚注に残した。
theological_decisions:
- issue: バビロンに対する神の司法的行為を、聖なる者たちの復讐または擁護としてどこまで明示するか
  choice: 「あなたがたに関わる裁きを彼女に対して行われた」とし、司法的語彙を保ちながら関係の幅を残す。
  alternative: 「神があなたがたのために彼女を裁かれた」または「神が彼女にあなたがたの復讐をされた」
  rationale: 原文はκρίνωとκρίμαの同根語を用い、復讐を直接表す動詞は用いていない。「に関わる」によって、彼らの訴えを認める裁き、彼らのための裁き、彼らに関して下される裁きという圧縮された関係を、可能な範囲で保持した。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で荘重な標準語。「天よ」という呼格と命令形「喜べ」で黙示文学的な宣言の力を保った。「聖なる者たち」は、意味を明瞭にしつつ教派固有の語感を避けるために用いた。
