  source_fidelity: 本文の「あなたがたに関わる裁きを彼女に対して行われた」は、τὸ κρίμα ὑμῶνおよびἐξ αὐτῆςの圧縮された関係を一定程度保とうとしている。しかし、「神が…行われた」は、神を主語とする場合には不適切な尊敬語的受け身である。また脚注の「彼女に対してあなたがたの正しさを認められた」は、原文のκρίνω／κρίμαが表す司法的行為を、義認・正当性の承認へと不必要に狭める。
