id: REV.18.5
reference: Revelation 18:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐκολλήθησαν αὐτῆς αἱ ἁμαρτίαι ἄχρι τοῦ οὐρανοῦ, καὶ ἐμνημόνευσεν ὁ θεὸς τὰ ἀδικήματα αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/005.yaml
  text: for her sins have piled up as high as heaven, and God has remembered her wrongdoings.
translation:
  language: ja
  text: その女の罪は天にまで積み重なり[a]、神はその女の不正な行いを覚えられた[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「天にまでくっつき合った」または「結びついた」。ギリシア語の動詞は本来「くっつく、結びつく」を意味し、ここでは罪が巨大に積み重なった様子を表す。
    reason: lexical_alternative
  - marker: b
    text: ここで神が「覚える」とは、不正な行いを見過ごさず、裁きのために取り上げることを含意する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: からである
  rationale: 直前の命令の理由を示す接続詞として、因果関係が明確になる自然な日本語にした。
- source_word: ἐκολλήθησαν
  choice: 積み重なり
  rationale: 原義は「くっつく、結び合わされる」だが、罪が天にまで及ぶという文脈では、巨大に累積した姿を表す比喩と理解できる。現代日本語でその像を明瞭に伝える。
- source_word: ἁμαρτίαι
  choice: 罪
  rationale: ἁμαρτίαの標準的で簡潔な訳語。
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: 天にまで
  rationale: 到達する範囲と垂直方向の比喩を簡潔に保ち、旧約的な裁きの響きにも適する。
- source_word: ἐμνημόνευσεν
  choice: 覚えておられる
  rationale: 神が過去の悪を想起し、今やそれに対応されるという文脈上の効力を自然な日本語で示しつつ、「裁いた」などの説明を本文に加えない。
- source_word: ὁ θεός
  choice: 神
  rationale: 直接的で標準的な訳語。
- source_word: ἀδικήματα
  choice: 不正な行い
  rationale: 個々の不義・不正の行為を表す語として明瞭であり、前半のἁμαρτίαι「罪」との語彙上の区別も保つ。
theological_decisions:
- issue: ἁμαρτίαιとἀδικήματαの区別
  choice: それぞれ「罪」と「不正な行い」と訳し分ける
  alternative: 両方を「罪」または「不義」と訳す
  rationale: 原文が関連しながらも異なる二語を用いているため、その修辞的な豊かさを保つ。ただし、両者の間に原文以上の厳密な神学的区別は設けない。
- issue: 神が「覚える」ことの意味
  choice: 「覚えておられる」と訳し、裁きの含意は注で示す
  alternative: 「責任を問われる」「裁きにかけられる」と明示する
  rationale: 文脈上、神の想起には裁きに移す意味合いがあるが、原文の動詞自体は「覚える」である。その表現と神学的緊張を本文に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その女」を反復して指示対象を明確にし、文末の「からである」で前節との因果関係を示した。
