id: REV.18.11
reference: Revelation 18:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: ja
  text: 地上[a]の商人たちは、彼女のことで泣き、悲しむ。もう誰も彼らの積み荷[b]を買わないからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「土地の」とも訳せる。ギリシア語は「地」または「土地」を意味し得るが、黙示録では世界的な広がりを持つことが多い。
    reason: lexical_alternative
  - marker: b
    text: 「商品」とも訳せる。ギリシア語は船の積み荷、または交易品を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: 商人たち
  rationale: 交易に携わる者を指す標準的で自然な訳。黙示録18章の商業的文脈にも適している。
- source_word: τῆς γῆς
  choice: 地上の
  rationale: γῆには「地」や「土地」の意味があるが、黙示録における広い終末的視野を保つため「地上の」とした。
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: 泣き、悲しむ
  rationale: 二つの動詞を訳し分け、涙を流すことと深く嘆くことの重なりによる強調を保った。
- source_word: ἐπ’ αὐτήν
  choice: 彼女のことで
  rationale: 哀悼の対象・原因を自然な現代日本語で示しつつ、バビロンを女性として擬人化する表現を「彼女」で保持した。
- source_word: γόμον
  choice: 積み荷
  rationale: 船荷または交易品を意味する語であり、続く商品の列挙と海上交易の文脈に合う。
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: もう誰も……買わない
  rationale: 現在の状態とοὐκέτιが示す取引の停止を、明快で自然な日本語で表した。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: 商人たちを受ける所有表現として明示した。
theological_decisions:
- issue: バビロンの指示対象と擬人化
  choice: 女性代名詞に相当する「彼女」を保持する
  alternative: 都市または体制として「それ」と訳す
  rationale: 本文はバビロンを女性または都市として擬人化しているため、その文学的・神学的イメージを解釈で平板化せず保持した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、黙示文学にふさわしい簡潔で重みのある調子を保った。「泣き、悲しむ」と二語を並べて原文の修辞的強調を残した。
