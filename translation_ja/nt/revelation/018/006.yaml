id: REV.18.6
reference: Revelation 18:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν, καὶ ⸀διπλώσατε ⸀τὰ διπλᾶ κατὰ τὰ ἔργα αὐτῆς· ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν κεράσατε αὐτῇ διπλοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: ja
  text: 彼女が報いたとおりに、彼女に報い、彼女の行いに応じて二倍にして返せ。[a] 彼女が混ぜた杯に、彼女のために二倍の量を混ぜよ。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼女のために二倍のものを二倍にせよ」。ギリシア語は力強く圧縮された表現で、報いが強められることを強調しているとも考えられる。
    reason: lexical_alternative
  - marker: b
    text: すなわち、彼女が混ぜて用意した杯。裁きの飲み物として用意された杯を思わせる表現である。
    reason: cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: 彼女が報いたとおりに、彼女に報い
  rationale: ἀποδίδωμιの反復と、強調されたαὐτήを保ち、報復的な返報を自然で格調ある日本語にした。
- source_word: διπλώσατε τὰ διπλᾶ
  choice: 二倍にして返せ
  rationale: 原文の圧縮された強意表現を、意味を過度に限定せず理解できる日本語にした。「二倍のものを二倍にせよ」という逐語訳の不自然さは脚注で補う。
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: 彼女の行いに応じて
  rationale: ἔργαの意味と、行為に対応する裁きという基準を明瞭に表す。
- source_word: ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν
  choice: 彼女が混ぜた杯に
  rationale: κεράννυμιの「混ぜる」を保持し、黙示録と預言書に通じる杯の象徴をそのまま残した。
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: 彼女のために二倍の量を混ぜよ
  rationale: 動詞の反復を保ちながら、διπλοῦνを日本語として自然な「二倍の量」とした。
theological_decisions:
- issue: 二倍の報いの性質
  choice: 象徴的・司法的な報復として訳し、その厳しさと二倍の比喩を保つ
  alternative: 厳密に数量化された刑罰と解する、または一般的な正義へと弱めて意訳する
  rationale: 黙示文学的な裁きの表現として、数量的な厳密さか修辞的な強調かを決めつけず、原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令形には荘重さを保つ「報い」「返せ」「混ぜよ」を採用した。女性代名詞は象徴的人物バビロンを受けるため「彼女」で統一した。
