id: REV.18.21
reference: Revelation 18:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: ja
  text: 'また、一人の力強い天使が、大きなひき臼のような石を持ち上げ、海に投げ込んで、こう言った。

    「大いなる都バビロンも、このように激しい勢いで[a]投げ落とされ、もはや決して見いだされることはない。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「激しい力で」「一気に」とも訳せる。ギリシア語は、突然で力強い動きを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: 持ち上げ
  rationale: 石を取って象徴的な行為に移る、意図的な動作を自然な現代日本語で表した。
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: 一人の力強い天使
  rationale: εἷςの単数性を明示し、ἰσχυρόςの力強さを黙示文学にふさわしく、過度に古風でない表現で伝えた。
- source_word: λίθον ὡς μύλινον μέγαν
  choice: 大きなひき臼のような石
  rationale: ὡςによる比較を保ち、石をひき臼そのものと断定せず、その大きさと重さを想起させる表現とした。
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: 海に投げ込んで
  rationale: 海の中へ投げるという方向と、βάλλωの力のこもった動作を自然に表した。
- source_word: Οὕτως
  choice: このように
  rationale: 天使の行為が直後の宣告を目に見える形で示しているという指示的な働きを保った。
- source_word: ὁρμήματι
  choice: 激しい勢いで
  rationale: 突然の激しい動き、強い力を表す語の幅を保ち、破滅の速さと強烈さの双方が伝わる表現を選んだ。
- source_word: βληθήσεται
  choice: 投げ落とされ
  rationale: 先のἔβαλενとの語の反復を「投げ」で保ち、石が海へ沈む象徴的動作に対応する破滅的な下降を日本語で明瞭にした。
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: 大いなる都バビロン
  rationale: バビロンと「大いなる都」の同格的な結びつきを、黙示文学の荘重さを保つ自然な日本語にした。
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: もはや決して見いだされることはない
  rationale: οὐ μήの強い否定とἔτιの「もはや」の意味をともに明示し、滅びの最終性を表した。
theological_decisions:
- issue: バビロンの滅亡の比喩が指すもの
  choice: 象徴的行為によって、バビロンが激しく最終的に滅ぼされることを表すにとどめた。
  alternative: バビロンを文字どおりの都市、神に敵対する世界体制、または両者を含む複合的象徴と特定する。
  rationale: 本文はバビロンの正体をこの節だけで限定していないため、特定の終末論的解釈を訳文に持ち込まず、象徴と宣告の力をそのまま保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示文学の荘重さを保つため「大いなる都」「見いだされる」を用いた。「ひき臼」は一般読者にも理解しやすい表記とした。
