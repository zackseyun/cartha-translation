id: REV.5.10
reference: Revelation 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: ja
  text: あなたは彼らを、私たちの神のために、王国と祭司とされました[a]。そして彼らは地上で王として治めています[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「王国と祭司」の代わりに「王たちと祭司」とあります。
    reason: textual_variant
  - marker: b
    text: 写本によっては、「地上で王として治める」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: されました
  rationale: アオリスト能動直説法を、賛歌における完了した行為として自然な現代日本語の過去形で表した。目的語「彼らを」があるため、「（あなたが）彼らを…とした」という使役的な意味が明確になる。
- source_word: αὐτούς
  choice: 彼らを
  rationale: 前節で贖われた人々を指す男性複数対格代名詞であり、ἐποίησαςの目的語として直接訳した。
- source_word: τῷ θεῷ ἡμῶν
  choice: 私たちの神のための
  rationale: 与格が示す帰属・奉仕の関係を自然な日本語で表した。「神に」とも訳せるが、「王国、また祭司」との結びつきを明瞭にするため「神のための」とした。
- source_word: βασιλείαν
  choice: 王国
  rationale: 採用本文の単数名詞を集合的に理解し、贖われた人々が一つの王国とされたことを保った。異読の「王たち」と混同しない。
- source_word: ἱερεῖς
  choice: 祭司
  rationale: 語の標準的な訳であり、出エジプト記19章6節および黙示録1章6節との響きも保つ。
- source_word: βασιλεύουσιν
  choice: 王として治めています
  rationale: 提示されたSBLGNT本文の形は現在能動直説法であるため、現在形で訳した。「王として」はβασιλεύωに含まれる王的統治の意味を自然な日本語で表す。未来形の異読は脚注に残した。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: ἐπί＋属格の場所的意味を過度に支配領域へ限定せず、「地上で」と訳した。「地上を」では統治対象を強く示しすぎる可能性がある。
theological_decisions:
- issue: 贖われた人々がβασιλείανとされること
  choice: 王国
  alternative: 王たち
  rationale: 採用されたギリシア語本文は単数のβασιλείαν（王国）であるため、本文ではこれを訳した。伝統的解釈に影響した「王たち」という異読は脚注で示した。
- issue: 聖徒が治める時期
  choice: 王として治めています
  alternative: 王として治めることになります
  rationale: 提示された本文のβασιλεύουσινは現在形であり、終末論上の時期を翻訳で先取りせず、その時制を保った。未来形の異読は脚注に示した。
- issue: ἐπὶ τῆς γῆςが示す統治との関係
  choice: 地上で
  alternative: 地上を
  rationale: 前置詞句は場所とも支配領域とも理解し得るため、本文ではより形式に近く解釈を限定しにくい場所表現を採用した。
translation_notes:
  register: 明瞭で現代的ながら、賛歌にふさわしい品位を保った。神への直接の呼びかけは「あなた」、完了した行為は丁寧な過去形で表した。本文の現在形と主要な異読の未来形を混同せず、神学的な時間枠を訳文で決めつけないようにした。
