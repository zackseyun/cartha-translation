id: REV.5.6
reference: Revelation 5:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: ja
  text: 私はまた、御座と四つの生き物との間、また長老たちの間に、屠られたかのような小羊が立っているのを見た。その小羊には七つの角と七つの目があった。その七つの目は、全地へ遣わされた神の七つの霊である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の七つの霊」は原文に従った表現である。これを聖霊の七重の充満を象徴する表現と理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: 御座と四つの生き物の中央に、そして長老たちの中央に
  rationale: ギリシア語で反復される空間表現を保ち、幻の中で小羊が占める位置を解釈的に単純化しない。
- source_word: ζῴων
  choice: 生き物
  rationale: 黙示録の御座を囲む存在を指すため、「動物」ではなく、現代日本語で通用する「生き物」とした。
- source_word: πρεσβυτέρων
  choice: 長老たち
  rationale: この幻に登場する天上の集団の呼称として自然であり、単なる高齢者という意味に限定しない。
- source_word: ἀρνίον
  choice: 小羊
  rationale: 犠牲およびメシア的な象徴性を保つ、聖書日本語として定着した表現を採用した。
- source_word: ἑστηκὸς
  choice: 立っている
  rationale: 完了分詞が示す、立った状態にある小羊の生き生きとした姿を自然な日本語で表した。
- source_word: ὡς ἐσφαγμένον
  choice: 屠られたかのような
  rationale: ὡςの比較・外見の含みと、すでに屠られた結果が残る完了受動分詞の意味を保つ。「屠る」は犠牲的かつ暴力的な死の響きを伝える。
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: 七つの角と七つの目があった
  rationale: 象徴を説明に置き換えず文字どおり保持しつつ、日本語として自然な叙述にした。
- source_word: οἵ εἰσιν
  choice: その七つの目は……である
  rationale: 直前の「七つの目」を関係節の指示対象として明示し、日本語で曖昧な係り受けになるのを避けた。
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: 神の七つの霊
  rationale: 原文どおり複数形を保ち、「七重の聖霊」などの教理的な言い換えを避けた。
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: 全地へ遣わされた
  rationale: 受動の完了分詞を保ち、遣わされた状態と行為の方向を簡潔に表した。
theological_decisions:
- issue: 「神の七つの霊」と同定されるもの
  choice: 直前の「七つの目」と結び付ける。
  alternative: 七つの角と七つの目の双方を緩やかに受ける。
  rationale: 最も近い先行詞は「七つの目」であり、ゼカリヤ書の目のイメージとも整合する。ただし本文以上の象徴解釈は加えない。
- issue: 「神の七つの霊」の理解
  choice: 「神の七つの霊」と原文の表現を保つ。
  alternative: 「七重の神の霊」または「七重に満ちた聖霊」と解釈して訳す。
  rationale: この表現の神学的理解には議論があるため、聖霊の七重の充満という可能性を排除せず、同時に訳文でそれに確定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示文学の荘厳さと象徴表現を保った。「屠られた」「御座」「小羊」「遣わされた」は文脈にふさわしい格調を持たせる語として用いた。
