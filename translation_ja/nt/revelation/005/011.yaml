source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ⸀ἤκουσα φωνὴν ἀγγέλων πολλῶν κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων, καὶ ἦν ὁ ἀριθμὸς αὐτῶν μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/011.yaml
  text: And I looked[a], and I heard the voice of many angels around the throne and the living creatures and the elders, and their number was myriads of myriads and thousands of thousands[b],
translation:
  language: ja
  text: また私は見た[a]。そして、御座と生き物たちと長老たちの周りにいる、多くの御使いたちの声を聞いた。御使いたちの数は、万の万倍、千の千倍であった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「目を向けた」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「万の万、千の千」。途方もなく多い群れを表す反復的な数詞表現。より字義的には「一万の一万、千の千」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: 私は見た
  rationale: ὁράωのアオリストとして基本的な意味を保ちつつ、幻の中でヨハネが注意を向け、続いて聞いたという叙述の流れを自然に表した。「目を向けた」も文脈上可能なので脚注に示した。
- source_word: ἤκουσα
  choice: 聞いた
  rationale: ἀκούωのアオリストの標準的な訳であり、目で見たことから耳で聞いたことへ移る原文の流れを保つ。
- source_word: φωνὴν ἀγγέλων πολλῶν
  choice: 多くの御使いたちの声
  rationale: φωνήの単数形を「声」とし、多数の御使いが一つになって発する声という原文の集合的表現を保持した。
- source_word: κύκλῳ τοῦ θρόνου καὶ τῶν ζῴων καὶ τῶν πρεσβυτέρων
  choice: 御座と生き物たちと長老たちの周りにいる
  rationale: κύκλῳの空間的意味を明確にし、この句が多くの御使いたちの位置を示すよう、日本語として自然な形に整えた。
- source_word: ζῴων
  choice: 生き物たち
  rationale: 黙示録に登場する特有の存在を指す語として「生き物」を用い、単なる動物という印象を避けながら、語の基本的意味を保った。
- source_word: πρεσβυτέρων
  choice: 長老たち
  rationale: 黙示録の御座を巡る場面でのπρεσβύτεροιに対する、明確で定着した訳語を用いた。
- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: その数は……であった
  rationale: 人数の膨大さを明示する原文の構文を簡潔な現代日本語で再現した。
- source_word: μυριάδες μυριάδων καὶ χιλιάδες χιλιάδων
  choice: 万の幾万倍、千の幾千倍
  rationale: 厳密な算定ではなく途方もない大群を表す黙示的な数の反復を保持しつつ、複数形のニュアンスが日本語にも伝わる形とした。
theological_decisions:
- issue: 黙示録の御座の周囲にいるζῷαの呼称
  choice: 生き物たち
  alternative: 生けるものたち
  rationale: 原語が示す生命ある存在という意味と、黙示録における特有の存在としての性格を保つ。存在の正体を特定する教理的解釈は加えない。
- issue: 御使いたちの数を表す数詞表現
  choice: 万の幾万倍、千の幾千倍
  alternative: 数えきれないほどの大群
  rationale: 大群という意味だけに言い換えず、原文の反復的で荘厳な表現を残した。これを厳密な人数とも完全に不可算な数とも断定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。「御座」「御使い」「長老」は黙示録の荘厳な場面に適した語として保持した。原文の接続の反復は、「また」「そして」によって叙述の進行が分かる形で再現した。
