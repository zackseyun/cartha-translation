id: REV.5.5
reference: Revelation 5:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: ja
  text: 'すると、長老の一人が私に言った。「泣いてはいけない。見なさい。ユダ族から出た獅子[a]、ダビデの根が勝利を収めた[b]。そのため、巻物とその七つの封印を開くことができる[c]。」


    [a] 別訳「ユダ族の獅子」。

    [b] 別訳「打ち勝った」。この語は『黙示録』で、勝利や克服を表す重要な語として繰り返し用いられる。

    [c] 直訳「巻物とその七つの封印を開くために」。この不定詞は、勝利の結果またはそれによって得られた資格・可能性を表すとも理解できる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダ族の獅子」。
    reason: ἐκを出自として明示する訳と、伝統的で簡潔な所属表現の双方が可能であるため。
  - marker: b
    text: 別訳「打ち勝った」。この語は『黙示録』で、勝利や克服を表す重要な語として繰り返し用いられる。
    reason: νικάωの勝利・克服・征服という意味領域と、『黙示録』内での主題的重要性を示すため。
  - marker: c
    text: 直訳「巻物とその七つの封印を開くために」。この不定詞は、勝利の結果またはそれによって得られた資格・可能性を表すとも理解できる。
    reason: ἀνοῖξαιが目的・結果・資格のいずれに重心を置くかについて、原文に解釈上の幅があるため。
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: 長老
  rationale: 単なる高齢者ではなく、『黙示録』に登場する天上の一団の呼称であるため、定着した「長老」とした。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は臨場感を与える物語的現在だが、日本語の自然な物語文では過去形が明瞭である。
- source_word: Μὴ κλαῖε
  choice: 泣いてはいけない
  rationale: κλαίωの「泣く、泣き悲しむ」という意味と厳粛な慰めの調子を、明快な現代日本語で表した。
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 注意を強く促す談話標識の働きを保ちつつ、古風すぎない荘重な表現とした。
- source_word: ἐνίκησεν
  choice: 勝利を収めた
  rationale: νικάωが示す勝利・征服の主題を明確にし、『黙示録』における反復語としての力を保った。
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: ユダ族から出た獅子
  rationale: ἐκの出自を表す意味を明示し、メシア的称号としての比喩をそのまま保持した。
- source_word: ἡ ῥίζα Δαυίδ
  choice: ダビデの根
  rationale: イザヤ書を背景とするメシア的称号の比喩を説明的に言い換えず、そのまま残した。
- source_word: ἀνοῖξαι
  choice: そのため、…開くことができる
  rationale: 勝利と巻物を開くこととの結果・資格上のつながりを自然な日本語で示した。ただし、目的とも読める不定詞の曖昧さは脚注に残した。
- source_word: τὸ βιβλίον
  choice: 巻物
  rationale: この場面の書物は封印された巻物であり、歴史的・文脈的形態を明確に表す。
- source_word: σφραγῖδας
  choice: 封印
  rationale: 巻物を閉じているσφραγίςを表す標準的で自然な訳語である。
- source_word: αὐτοῦ
  choice: その
  rationale: 中性名詞βιβλίονを受け、七つの封印が巻物に属することを自然な日本語で示した。
theological_decisions:
- issue: イエスに適用される王的・メシア的称号
  choice: 「ユダ族から出た獅子」と「ダビデの根」の二つを明示的な称号として保持する。
  alternative: 一方または両方を説明的な意訳に置き換える。
  rationale: 本文はイスラエルの聖書に由来する王的・メシア的表現を重ねている。比喩を直接残すことで、本文のキリスト論的な力を保ちつつ、本文にない教理説明を加えない。
- issue: ἐνίκησενに続くἀνοῖξαιの機能
  choice: 「勝利を収めた。そのため、…開くことができる」と結果・資格の関係を本文で示し、直訳と目的的理解を脚注に示す。
  alternative: 「開くために勝利を収めた」と目的だけに限定する。
  rationale: ギリシア語不定詞は、勝利が巻物を開くことを可能にする結果・資格を示し得る一方、目的的にも読める。本文は自然さを確保し、脚注で原文の簡潔さと曖昧さを保存した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、幻の場面にふさわしい厳粛さを保った。「獅子」「ダビデの根」「巻物」「封印」は聖書間の響きと黙示文学的イメージを守るため保持した。物語的現在は、日本語で不自然な時制の揺れを避けるため「言った」とした。
