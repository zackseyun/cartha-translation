source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα ⸀ἔλεγον· Ἀμήν. καὶ οἱ πρεσβύτεροι ἔπεσαν καὶ προσεκύνησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: ja
  text: 四つの生き物は「アーメン」と言っていた。そして長老たちはひれ伏し、礼拝した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「礼拝した」の後に「世々限りなく生きておられる方を」または「その方を」など、礼拝の対象を明示する語句を加えています。本文は、対象を文脈に委ねるSBLGNTの短い読み方に従っています。
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: 生き物
  rationale: 黙示録の文脈では、御座の周りにいる天上の存在を指す。日本語では「生き物」が自然であり、エゼキエル書の御座の幻とのつながりも保てる。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的または反復的な側面を、自然な現代日本語で表す。単純な「言った」より原文のアスペクトをよく保つ。
- source_word: Ἀμήν
  choice: アーメン
  rationale: 礼拝における応答の言葉であり、意味を言い換えず、広く定着した音写を用いる。
- source_word: πρεσβύτεροι
  choice: 長老たち
  rationale: ここでは単なる高齢者ではなく、黙示録に登場する特定の天上の集団を指す呼称である。
- source_word: ἔπεσαν
  choice: ひれ伏し
  rationale: 礼拝の場面における身体的な動作を、日本語で自然かつ明確に示す。後続の「礼拝した」との不自然な重複も避ける。
- source_word: προσεκύνησαν
  choice: 礼拝した
  rationale: 御座をめぐる天上の場面では、単なる敬礼ではなく宗教的な崇敬を表すため、「礼拝した」が適切である。
theological_decisions:
- issue: 礼拝の対象が明示されていないこと
  choice: 目的語を補わず、「礼拝した」とする。
  alternative: 「その方を礼拝した」「神を礼拝した」「永遠に生きておられる方を礼拝した」
  rationale: SBLGNT本文の προσεκύνησαν には目的語が明示されていない。日本語でも目的語を省略して自然に表現できるため、異読や文脈から特定の対象を本文に補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「言っていた」で未完了過去の含みを残し、「ひれ伏し、礼拝した」で身体動作と礼拝の意味を簡潔に表した。脚注記号は、異読が関係する「礼拝した」の直後に置いた。
