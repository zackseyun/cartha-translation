revisions:
- from: '小羊が巻物を受け取ると、四つの生き物と二十四人の長老は小羊の前にひれ伏した。彼らはそれぞれ、竪琴[a]を一つと、香で満ちた金の鉢を持っていた。この香は、聖なる者たちの祈りである。


