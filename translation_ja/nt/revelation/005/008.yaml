  naturalness: 「小羊」「巻物」「ひれ伏した」「長老」は明瞭で、礼拝場面に適した自然な現代標準語である。複数の鉢は「いくつもの金の鉢」として明示すると、原文により忠実で読みやすい。
  terminology: 「生き物」「長老」「小羊」「聖なる者たち」は文脈に適切で、教派的限定を持ち込まない。「竪琴」は本文に適する。脚注の代案は、日本の伝統楽器を連想しうる単なる「琴」より、「リラ」の方がκιθάραの古代地中海世界の弦楽器としての性格をより適切に示す。
  issues:
