id: REV.5.8
reference: Revelation 5:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: ja
  text: '小羊が巻物を受け取ると、四つの生き物と二十四人の長老は小羊の前にひれ伏した。彼らはそれぞれ、竪琴[a]を一つと、香で満ちたいくつもの金の鉢を持っていた。それらは、聖なる者たちの祈りである。


    [a] 「リラ」とも訳せる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「リラ」とも訳せる。
    reason: κιθάραは古代の弦楽器であり、「竪琴」のほか「リラ」とも訳せるため。
lexical_decisions:
- source_word: βιβλίον
  choice: 巻物
  rationale: 黙示録の場面に現れる古代の書写物の形態と、その描写を自然に伝える。
- source_word: ζῷα
  choice: 生き物
  rationale: 御座の周囲にいる天上の存在を指すため、否定的な響きのある「獣」を避けつつ、語の基本的意味を保つ。
- source_word: πρεσβύτεροι
  choice: 長老
  rationale: 威厳ある二十四人の天上の長老を指す語として定着しており、後代の特定の教会職制に限定しない。
- source_word: ἐνώπιον τοῦ ἀρνίου
  choice: 小羊の前に
  rationale: 空間的な位置と礼拝における近さを簡潔に表す。
- source_word: ἔχοντες ἕκαστος
  choice: 彼らはそれぞれ、…持っていた
  rationale: 分配を表すἕκαστοςを明示し、文法上は四つの生き物と長老たちをまとめて受け得る表現にした。
- source_word: κιθάραν
  choice: 竪琴
  rationale: 古代の弦楽器を指す。日本語の聖書文体で理解されやすい「竪琴」を本文に置き、より一般的な「琴」を脚注に示した。
- source_word: φιάλας χρυσᾶς
  choice: 金の鉢
  rationale: φιάληは浅い鉢状の器を指し、「瓶」よりも器の形状と場面に合う。ギリシア語の複数形は集合的な日本語表現で自然に伝えた。
- source_word: γεμούσας θυμιαμάτων
  choice: 香で満ちた
  rationale: θυμίαμαを礼拝でたく香として簡潔に表し、複数形は日本語では物質名として自然に処理した。
- source_word: αἱ προσευχαὶ τῶν ἁγίων
  choice: 聖なる者たちの祈り
  rationale: ἅγιοιの字義と、神に属する民を広く指す意味を保ち、後代の列聖者だけを連想させ得る「聖人たち」を避けた。
theological_decisions:
- issue: 香と祈りの象徴的同定
  choice: 「この香は、聖なる者たちの祈りである」と直接に訳す
  alternative: 「この香は、聖なる者たちの祈りを表している」
  rationale: 原文はαἵ εἰσινという直接的な等置表現を用いるため、象徴を説明的に弱めず、そのまま保持した。
- issue: τῶν ἁγίωνが指す人々
  choice: 聖なる者たち
  alternative: 聖徒たち／神の民
  rationale: 神に聖別された人々という意味を保ちつつ、特定の教派的用語や後代の列聖制度への限定を避けた。
- issue: ἕκαστοςの適用範囲
  choice: 「彼らはそれぞれ」として、生き物と長老を含む直前の複合主語を受ける形を保つ
  alternative: 長老たちはそれぞれ持っていた
  rationale: 文法上の男性複数形は混合された複合主語全体を受け得るため、持ち物を長老だけに限定する解釈を本文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、礼拝場面にふさわしい簡潔で荘重な調子を保った。「ひれ伏した」「小羊」「長老」など、理解しやすく聖書的文脈にもなじむ語を採用した。
