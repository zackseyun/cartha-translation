  to: '小羊が巻物を受け取ると、四つの生き物と二十四人の長老は小羊の前にひれ伏した。彼らはそれぞれ、竪琴[a]を一つと、香で満ちたいくつもの金の鉢を持っていた。それらは、聖なる者たちの祈りである。


    [a] 「リラ」とも訳せる。'
  rationale: 関係代名詞αἵの女性複数を反映して、象徴的に同定される対象を「香」と断定せず、「それら」とした。これにより、原文の文法的な指示関係を保ちつつ、日本語での不自然さを抑えた。また、金の鉢の複数形を明示し、脚注の代案をより語彙的に精確なものへ改めた。
  reviewer_model: gpt-5.6-terra
