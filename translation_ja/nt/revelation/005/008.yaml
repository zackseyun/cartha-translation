  - severity: low
    issue: 「金の鉢」が単数にも読める。
    rationale: φιάλαςは複数であり、各自が竪琴と複数の金の鉢を持つ構文である。「いくつもの金の鉢」として複数を明示する。
  - severity: low
    issue: 脚注の「琴」は指示範囲が広く、日本の琴を連想させうる。
    rationale: κιθάραの語彙的代案としては「リラ」の方が具体的であり、本文の「竪琴」との関係も明確である。
