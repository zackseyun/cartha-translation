source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: ja
  text: また、天にも、地上にも、地の下にも、巻物を開くことも、それを見ることもできる者は一人もいなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「書物」とも訳せる。ギリシア語は一般に文書を指しうるが、この場面では古代の巻物が想定されていると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς
  choice: 一人もいなかった
  rationale: 否定を伴う日本語として自然であり、被造世界のどこにも該当者がいないことを明確に表す。
- source_word: ἐδύνατο
  choice: できる者は…いなかった
  rationale: 未完了過去の文脈に即して能力の欠如を表し、日本語では連体修飾と主節の否定によって自然に訳した。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天にも
  rationale: 黙示文学の空間表現を簡潔に保ち、後続の二領域と並列させた。
- source_word: ἐπὶ τῆς γῆς
  choice: 地の上にも
  rationale: ἐπί＋属格の位置的意味を保ち、天・地上・地下という三層の宇宙的範囲を明示した。
- source_word: ὑποκάτω τῆς γῆς
  choice: 地の下にも
  rationale: 空間的意味をそのまま伝え、三領域の並列を維持した。
- source_word: ἀνοῖξαι
  choice: 開くこと
  rationale: δύναμαιに従属する不定詞の内容を、可能表現に自然につながる名詞節として訳した。
- source_word: τὸ βιβλίον
  choice: 巻物
  rationale: この幻の古代的な書記媒体としては巻物が最も自然であり、現代的な冊子本のイメージを避けられる。
- source_word: οὔτε βλέπειν αὐτό
  choice: それを見ることも
  rationale: οὔτεによる第二の否定的並列を「…ことも」で表した。βλέπεινの基本的な視覚表現を保ち、原文にない「さえ」は加えなかった。
theological_decisions:
- issue: 巻物を開けない者の宇宙的範囲
  choice: 「天にも地の上にも地の下にも」という三層の空間表現を保持する。
  alternative: 「被造世界のどこにも」などと一般化する。
  rationale: 原文は慣用的な宇宙の三領域を列挙して普遍的な無能力を強調しているため、その黙示文学的な像を抽象化せずに残した。
- issue: οὔτε βλέπειν αὐτόの強調の度合い
  choice: 「それを見ることも」と訳す。
  alternative: 「それを見ることさえ」と明示的に強調する。
  rationale: 文脈上の段階的な強調は感じられるが、「さえ」に相当する語は明示されていないため、並列構造を保って解釈を固定しすぎないようにした。
translation_notes:
  register: 明瞭で荘重な現代標準語。「にも」を反復して三つの領域を際立たせ、原文の宇宙的な広がりを保った。
