id: REV.5.9
reference: Revelation 5:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: ja
  text: '彼らは新しい歌を歌って、こう言う。


    「あなたこそ、巻物を受け取り、

    その封印を開くのにふさわしい方です。

    あなたは屠られ、

    あなたの血によって[b]、

    あらゆる部族、言語、民族、国民の中から人々を[c]、

    神のために[a]買い取られたからです。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神へ」とも訳せる。ギリシア語の与格は、ここでは「神のために」または「神へ」と理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「あなたの血をもって」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「あらゆる部族、言語、民族、国民の中から」。四つを重ねた表現は、買い取られた人々が世界全体に及ぶことを強調している。
    reason: cultural_note
lexical_decisions:
- source_word: ᾄδουσιν
  choice: 歌う
  rationale: 現在形の生き生きとした叙述を、自然な日本語の現在形で表した。「賛美する」など、動詞自体にない内容は加えない。
- source_word: ᾠδὴν καινὴν
  choice: 新しい歌
  rationale: 聖書全体に見られる「新しい歌」という主題を保ち、明快で定着した表現とした。
- source_word: Ἄξιος εἶ
  choice: あなたこそ…ふさわしい方です
  rationale: 直接の称賛を自然で荘重な現代日本語にした。「こそ」によって語頭の強調を表す。
- source_word: τὸ βιβλίον
  choice: 巻物
  rationale: 封印された古代の文書という黙示録の場面に合い、現代的な冊子本との混同を避ける。
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: その封印を開く
  rationale: ギリシア語の表現を保った。「封印を解く」も自然だが、原文のἀνοῖξαιにより直接対応する「開く」を採った。
- source_word: ἐσφάγης
  choice: 屠られ
  rationale: 単なる「殺され」よりも、暴力的な死と犠牲の含意を保つ。現代日本語でも聖書的文脈で理解できる表現である。
- source_word: ἠγόρασας
  choice: 買い取られた
  rationale: 動詞の基本的な商取引の比喩を保持する。「贖われた」は神学的意味を先取りし得るため避けた。敬意の対象への直接呼びかけなので尊敬表現とした。
- source_word: τῷ θεῷ
  choice: 神のために
  rationale: 与格を、買い取られた人々が神に属するためであることを自然に示す日本語で表した。「神へ」より明瞭である。
- source_word: ἐν τῷ αἵματί σου
  choice: ご自分の血によって
  rationale: ἐνの手段的用法を自然に表し、血という具体的な犠牲の表現を保持した。
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: あらゆる部族、言語、民族、国民の中から
  rationale: ἐκの選び出す範囲を「中から」で明示し、四重の列挙による世界的広がりを保った。φυλή、γλῶσσα、λαός、ἔθνοςの重なりを日本語で可能な限り区別した。
theological_decisions:
- issue: 「買い取った」の直接目的語がギリシア語本文に明示されていない
  choice: 文脈上含意される「人々」を補って「人々を…買い取られた」とした
  alternative: 目的語を補わず「…の中から神のために買い取られた」とする
  rationale: 日本語では目的語なしでも文法上成立し得るが、何を買い取ったかが不自然に曖昧になる。直後の四つの人間集団と文脈から人々が対象であることは明らかなので、意味を限定しすぎない一般語「人々」を補った。
- issue: ἐν τῷ αἵματί σουの贖罪的表現
  choice: 「ご自分の血によって」とし、原文の具体的な血の表現を保持した
  alternative: 「ご自分の死によって」と意訳する
  rationale: 原文は小羊の血を明示しており、その犠牲的緊張を一般化せず残す。一方、特定の贖罪論を説明として付加しない。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、天上の礼拝歌にふさわしい荘重さを保った。改行によって賛歌の詩的構造を示した。「屠られた」「血」「買い取る」という原文の強い比喩を弱めず、説明的な教理用語への置換は避けた。脚注記号は対応箇所である文末に置いた。
