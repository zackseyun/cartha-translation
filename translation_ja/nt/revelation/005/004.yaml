id: REV.5.4
reference: Revelation 5:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: ja
  text: そして私は、巻物[a]を開くにも、それを見る[b]にもふさわしい者がだれも見つからなかったので、激しく泣いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「書物」。ギリシア語はどちらも意味し得るが、この場面の形態と「開く」という描写には「巻物」がよく合う。
    reason: lexical_alternative
  - marker: b
    text: 「それを見る」は、文脈上「その中を見る」、すなわち巻物の内容を見ることを指す可能性もある。
    reason: lexical_ambiguity
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: そして私は
  rationale: καίによる物語のつながりと、明示されたἐγώによる話者への焦点を、過度に強調せず自然に表した。
- source_word: ἔκλαιον
  choice: 泣いていた
  rationale: 未完了過去の継続的な動作を、日本語の「～ていた」で表した。
- source_word: πολύ
  choice: 激しく
  rationale: 泣く動作を強める副詞的用法。声の大きさや「悲嘆に暮れて」など、原文に明示されない感情の様態は加えない。
- source_word: οὐδεὶς ἄξιος εὑρέθη
  choice: ふさわしい者がだれも見つからなかった
  rationale: 受動表現を保ちつつ、ἄξιοςが示す資格だけでなく価値・適格性の重みを「ふさわしい」で保持した。
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: 巻物を開く
  rationale: 黙示録5章の古代的な物体と開封の場面には「巻物」が適する。「書物」も語義上可能なので脚注に示した。
- source_word: οὔτε βλέπειν αὐτό
  choice: それを見るにも
  rationale: βλέπειν αὐτόの直接的な意味を優先し、「中を見る」と内容の閲覧に限定しなかった。文脈上その可能性はあるため脚注で示した。
- source_word: ὅτι
  choice: ので
  rationale: ヨハネが泣いた理由を示す因果関係を、自然な現代日本語で表した。
theological_decisions:
- issue: 天の御座の場面におけるἄξιοςの性質
  choice: 「ふさわしい」と訳し、神の前での価値と適格性の重みを保つ
  alternative: 「資格のある」「適任の」
  rationale: この文脈は単なる実務能力ではなく、神の目的を遂行するに足る者であることを扱う。「ふさわしい」はその重みを保ちながら、本文以上の教理説明を加えない。
- issue: βλέπειν αὐτόが巻物の外観を見ることか内容を見ることか
  choice: 本文では「それを見る」とし、対象を見るという原文の幅を保つ
  alternative: 「その中を見る」「その内容を見る」
  rationale: 文脈上は巻物の内容を見る意味を含み得るが、βλέπειν自体は単に見ることも表せる。曖昧さを本文で狭めず、文脈的な読みを脚注に示した。
- issue: βιβλίονが指す物体
  choice: 「巻物」
  alternative: 「書物」
  rationale: 封印され、開かれるという黙示録5章の描写と古代の書写形態には巻物が最もよく合う。ただし語そのものは広く書物を指し得るため、別訳を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「開くにも、それを見るにも」によってοὔτεの並列を簡潔に表し、「激しく泣いていた」で強意と継続性を保持した。脚注記号[a]は該当語の直後、[b]は文末に置き、いずれも本文に明示した。
