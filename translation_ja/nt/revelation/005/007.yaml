  text: καὶ ἦλθεν καὶ εἴληφεν ἐκ τῆς δεξιᾶς τοῦ καθημένου ἐπὶ τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: ja
  text: そして、子羊は進み出て、王座に座っておられる方の右手から巻物を取った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: 進み出て
  rationale: 子羊が御座の方へ移動する場面を、現代日本語の幻の叙述として自然に表す。「来て」では視点が曖昧になりやすく、「近づいて」ほど接近の様態を明示しない。
- source_word: εἴληφεν
  choice: 受け取った
  rationale: 文脈上の目的語である巻物を補い、完了形を幻の連続した出来事として自然な過去形で表す。権威ある方の手から巻物を取得する場面なので、「取った」よりも日本語では自然であるが、自発的な授与そのものを過度に強調しない。
- source_word: ἐκ
  choice: から
  rationale: 取得元を示す標準的で自然な日本語。
- source_word: τῆς δεξιᾶς
  choice: 右の手
  rationale: 具体的な幻の像を保つ。「右手」は『みぎて』とも読める一方、「右の手」は明瞭である。
- source_word: τοῦ καθημένου
  choice: 着いておられる方
  rationale: 定冠詞付き現在分詞の実体詞的用法を、継続的な着座と敬意を保つ自然な日本語で表す。
- source_word: ἐπὶ τοῦ θρόνου
  choice: 御座に
  rationale: 王的・神的な玉座を指す黙示録の文脈に適した、現代の聖書文体として理解しやすい語。「に」で着座位置を自然に表す。
theological_decisions:
- issue: εἴληφεν の省略された直接目的語
  choice: 直前の文脈を受けて「巻物」を明示した。
  alternative: 目的語を省き、「右の手から受け取った」とする。
  rationale: ギリシア語では文脈から明らかな目的語が省略されているが、日本語では「巻物」を補うことで何を受け取ったかが明瞭になる。新たな内容は加えていない。
- issue: 御座に着く方と子羊との区別
  choice: 主語を「子羊」と明示し、相手を「御座に着いておられる方」とした。
  alternative: 主語を代名詞的に省略し、「彼は来て」とする。
  rationale: ギリシア語の主語は直前の文脈にある子羊であり、日本語では明示した方が二者の区別が明瞭になる。両者の関係について本文以上の教理的説明は加えない。
- issue: λαμβάνω の行為性
  choice: 「受け取った」とした。
  alternative: 「取った」とする。
  rationale: 日本語の「右の手から取った」は強奪や無断取得にも響き得るため、「受け取った」が場面に自然である。ただし、ギリシア語自体は授与の様態を詳述しないため、解釈を過度に展開しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の荘厳な幻の場面にふさわしい品位を保った。「御座」「おられる」は敬意を示すが、古語的な語尾や過度に典礼的な表現は避けた。
