  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: ja
  text: また私は、力強い天使が大声で宣言しているのを見た。「その巻物[a]を開き、その封印を解くにふさわしい者はだれか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「書物」。ギリシア語ビブリオンは一般に書かれた文書を指しうるが、複数の封印があるこの場面では「巻物」が最もよく合う。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: 力ある御使い
  rationale: ἰσχυρόςの強さ・力を自然な日本語で表し、天的存在としての荘重さも保つ。「強い御使い」より、この場面では「力ある」が自然である。
- source_word: κηρύσσοντα
  choice: 告げ知らせている
  rationale: κηρύσσωは、公に使者として宣言することを表す。「宣べ伝える」では説教の含みが強くなりうるため、荘厳な公的告知を明確にした。
- source_word: ἐν φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 字義的には「大きな声で」であり、聞こえる力強い発声を示す自然な現代日本語として「大声で」とした。
- source_word: Τίς ἄξιος
  choice: ふさわしい者はだれか
  rationale: ἄξιοςが表す資格・価値の双方を保つ。「値する」よりも、この厳粛な務めを担う適格性を自然に表す。
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: この巻物を開き
  rationale: βιβλίονは文書や書物を指しうるが、複数の封印を伴う本節の具体的な情景には「巻物」が最もよく合う。
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: その封印を解く
  rationale: λύωの基本的な意味である「解く」を保ち、封印を解除して巻物を開けるようにする動作を表した。「破る」も可能だが、原語自体は必ずしも物理的破壊だけに限定しない。
theological_decisions:
- issue: 御座の幻における βιβλίον の訳し方
  choice: 巻物
  alternative: 書物
  rationale: 複数の封印が施された文書という一世紀の黙示的情景には巻物が自然である。これは教理上の限定ではなく、語彙的・歴史的文脈に基づく選択である。
- issue: 封印に対する λύω の具体性
  choice: 封印を解く
  alternative: 封印を破る
  rationale: 「解く」はλύωの語義を直接保ち、封印の解除を表せる。「破る」は情景として自然だが、物理的な破壊をやや強く明示するため本文では採らなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、黙示文学の荘重さを保った。「御使い」は聖書文体として広く理解される表記。「こう」は公的宣言への導入を日本語として自然にする補いで、内容の追加ではない。
