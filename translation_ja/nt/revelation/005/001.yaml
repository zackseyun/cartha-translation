  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: ja
  text: また私は、御座に着いておられる方の右手に、一巻の巻物があるのを見た。それは内側にも裏側にも書かれており[a]、七つの封印で封じられていた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「内側と裏側に書かれており」。ここでは巻物の両面を指すと考えられる。「内側にも外側にも」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「巻物」と訳したギリシア語は「書物」とも訳せるが、この文脈では冊子状の本より巻物を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: 見た
  rationale: アオリストの物語叙述を、簡潔で自然な過去形として訳した。
- source_word: ἐπὶ τὴν δεξιὰν
  choice: 右手に
  rationale: ἐπίの表面的な位置関係も保ち得る「右手に」を用い、「中に」と限定しすぎず、所持されている情景を自然に表した。
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: 御座に着いておられる方
  rationale: 実体詞的分詞による描写を保ち、明示されていない神名を補わず、現代日本語として敬意ある表現にした。
- source_word: βιβλίον
  choice: 一巻の巻物
  rationale: 当時の文脈と両面に書かれ封印された形状から巻物が最も自然であり、単数も「一巻」で明瞭にした。
- source_word: γεγραμμένον
  choice: 文字が記されており
  rationale: 完了受動分詞が表す、書かれた状態にあることを自然な日本語で示した。
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: 内側にも裏側にも
  rationale: ἔσωθενを巻物の内側、ὄπισθενをその裏側として訳し、両面に記された物理的な像を保った。
- source_word: κατεσφραγισμένον
  choice: 封じられていた
  rationale: 完了受動分詞が示す、すでに封印されてその状態にあることを表した。
- source_word: σφραγῖσιν ἑπτά
  choice: 七つの封印で
  rationale: 手段を示す与格を自然な助詞「で」によって表現した。
theological_decisions:
- issue: 御座に着く方の指示対象
  choice: 御座に着いておられる方
  alternative: 御座に着いておられる神
  rationale: 原文は神名を明記せず描写によって人物を示すため、その文学的提示を保ち、訳文で指示対象を確定しなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御座」「封印」は黙示文学の文脈で広く理解される語として保持し、文を適度に分けて読みやすくした。すべての脚注記号を本文中に配置した。
