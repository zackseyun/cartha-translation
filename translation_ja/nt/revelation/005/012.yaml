id: REV.5.12
reference: Revelation 5:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: ja
  text: '彼らは大声で言った。


    「屠られた[a]子羊は、


    力と富[b]と知恵と強さ[c]、


    誉れと栄光と祝福を


    受けるにふさわしい。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「殺された」。原語には「屠る」という生々しい響きがある。
    reason: lexical_alternative
  - marker: b
    text: 「豊かさ」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「力強さ」とも訳せる。ここでは前の「力」と訳し分けた。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες φωνῇ μεγάλῃ
  choice: 彼らは大声でこう言った
  rationale: 前節の大群衆を受ける複数の現在分詞を、単独の節として自然に読める形にした。「大声で」により φωνῇ μεγάλῃ の具体性を保つ。
- source_word: Ἄξιόν ἐστιν τὸ ἀρνίον
  choice: 小羊は…受けるにふさわしい
  rationale: 前置された ἄξιον の強調は、引用全体を簡潔な賛歌調に整えることで表した。ἀρνίον は黙示録でキリストを指す称号として用いられるが、日本語では文脈上明らかなため通常の表記とした。
- source_word: τὸ ἐσφαγμένον
  choice: 屠られた
  rationale: σφάζω の殺害・犠牲の含意を保ち、「殺された」よりも小羊の犠牲的イメージを明確に伝える。完了受動分詞の結果的状態は連体修飾で自然に表した。
- source_word: λαβεῖν
  choice: 受ける
  rationale: ここでは七つのものが小羊にささげられる賛歌なので、「取る」より「受ける」が文脈に合う。
- source_word: δύναμιν
  choice: 力
  rationale: δύναμις の基本的意味を簡潔に示し、七項目の第一語として自然な表現にした。
- source_word: πλοῦτον
  choice: 富
  rationale: 物質的な財だけに限定せず、豊かさや資源を含み得る πλοῦτος に対応する簡潔な現代語。
- source_word: σοφίαν
  choice: 知恵
  rationale: σοφία の標準的で明瞭な訳語。
- source_word: ἰσχὺν
  choice: 勢い
  rationale: δύναμις の「力」と区別しつつ、ἰσχύς の強さ・強力さを表す。
- source_word: τιμὴν καὶ δόξαν καὶ εὐλογίαν
  choice: 誉れと栄光と賛美
  rationale: τιμή と δόξα を定着した礼拝語彙で訳した。εὐλογία はこの頌栄的文脈では、小羊に向けられる「賛美」と解するのが自然である。
theological_decisions:
- issue: 小羊の称号性
  choice: 小羊
  alternative: 子羊／小羊（特別な表記による称号化）
  rationale: ἀρνίον は文脈上、殺されながら立っているキリストを指す。訳語自体に説明を加えず、黙示録の象徴と緊張関係をそのまま保った。
- issue: 犠牲的死の表現
  choice: 屠られた
  alternative: 殺された
  rationale: 死の事実だけでなく、σφάζω と小羊の組み合わせが生む屠殺・犠牲の像を保持する。ただし贖罪の仕組みについて本文以上の説明は加えない。
- issue: εὐλογία の方向性
  choice: 賛美
  alternative: 祝福
  rationale: 語そのものは「祝福」も意味し得るが、ここでは被造物が小羊の価値を宣言し、小羊が受ける七項目を列挙するため、「賛美」が自然である。語義上の可能性は翻訳判断として認識しつつ、本文の礼拝文脈を優先した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、天上の礼拝にふさわしい簡潔で格調ある賛歌調とした。七項目の並列は原文どおり保ち、改行によって朗読時のリズムを整えた。
