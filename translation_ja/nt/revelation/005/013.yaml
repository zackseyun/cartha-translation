id: REV.5.13
reference: Revelation 5:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: ja
  text: 'また私は、天に、地に、地の下に、海にいるすべての被造物[a]と、それらの中にあるすべてのものが、こう言うのを聞いた。


    「王座に座っておられる方と小羊に、


    祝福と誉れと栄光と支配とが、


    世々限りなくありますように[b]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「造られたすべてのもの」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「世々の世々に至るまで」。終わりのない永遠を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: すべての被造物
  rationale: κτίσμαは造られた存在または物を指す。ここでは声を上げて賛美する宇宙的な場面なので、「被造物」が人格的な被造者を含みつつ、被造世界全体への広がりも保つ。
- source_word: ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς θαλάσσης, καὶ τὰ ἐν αὐτοῖς πάντα
  choice: 天に、地の上に、地の下に、海の上にいる……と、それらの中にあるすべてのもの
  rationale: 列挙された全領域によって被造世界全体を表す表現を保った。「それら」は各領域をまとめて受け、包括性を明示する。
- source_word: ἤκουσα λέγοντας
  choice: ……が、こう言うのを聞いた
  rationale: λέγονταςは文法上男性複数で、集合的な被造物を意味上受ける。日本語では引用を導く「こう言うのを聞いた」が自然である。
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: 御座に着いておられる方に
  rationale: 冠詞付き分詞を敬意ある現代日本語の名詞句で表した。「着いておられる」は御座に座している継続的な姿を示す。
- source_word: τῷ ἀρνίῳ
  choice: 小羊に
  rationale: 黙示録で一貫して用いられるキリスト論的称号として、犠牲と勝利の象徴性を保つ。
- source_word: ἡ εὐλογία
  choice: 賛美
  rationale: 字義的には「祝福」だが、ここでは神と小羊に向けた頌栄的な称賛を表すため、現代日本語で意味が明瞭な「賛美」とした。
- source_word: ἡ τιμὴ
  choice: 誉れ
  rationale: ささげられる尊敬と栄誉を表し、頌栄の格調にも合う。
- source_word: ἡ δόξα
  choice: 栄光
  rationale: 礼拝・頌栄の文脈におけるδόξαの確立した自然な訳語である。
- source_word: τὸ κράτος
  choice: 力
  rationale: κράτοςは顕現する強さ、支配力を表す。「力」は過度に解釈を限定せず、現代日本語として明瞭である。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 終わりのない継続を表す慣用句を、荘重さと分かりやすさを兼ねる日本語で訳した。字義的構造は脚注に示す。
theological_decisions:
- issue: 神と小羊に共同で向けられる頌栄
  choice: 一つの頌栄を「御座に着いておられる方と小羊に」と両者へ共同で向ける。
  alternative: 各々に対して述語を補い、二つの頌栄として明示する。
  rationale: ギリシア語は説明を加えず、両者に一つの賛美を並列的に帰している。その統一された構文と神学的緊張をそのまま保つ。
- issue: κτίσμαが指す範囲
  choice: 「すべての被造物」とする。
  alternative: 「全被造世界」または「造られたすべてのもの」とする。
  rationale: 宇宙的な包括性を保ちながら、声を上げる存在として描かれている点も自然に伝える。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、宇宙的な礼拝場面にふさわしい格調を保った。「御座」「小羊」「世々限りなく」は黙示録の象徴性と頌栄の調子を維持するために用いた。
