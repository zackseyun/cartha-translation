id: REV.13.13
reference: Revelation 13:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: ja
  text: また、それは大きなしるし[a]を行い、人々の目の前で、火さえも天から地へ降らせる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大きな奇跡」または「大きな不思議」とも訳せる。ギリシア語は「しるし」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ
  choice: 行い
  rationale: σημεῖαとの結び付きでは「しるしを行う」が自然で、奇異な行為を実行する意味を保つ。
- source_word: σημεῖα μεγάλα
  choice: 大きなしるし
  rationale: 「しるし」は、単なる奇跡ではなく、何かを示しつつ人を惑わす黙示文学的含意を保つ。「大きな」はμεγάλαを素直に表す。
- source_word: ἵνα καὶ πῦρ ποιῇ
  choice: 火さえ…降らせる
  rationale: καίの強意を「さえ」で示し、ποιῇと不定詞καταβαίνεινの使役的構文を自然な日本語の「降らせる」で表す。ἵναの目的・結果の含みは文脈上断定せず、連続する働きとして訳す。
- source_word: πῦρ
  choice: 火
  rationale: 文脈および天からの火という預言的イメージに即して字義どおり訳す。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 黙示文学的・神学的響きを保つため、「空」ではなく「天」とする。
- source_word: καταβαίνειν εἰς τὴν γῆν
  choice: 地上に降らせる
  rationale: 移動方向を明確にしつつ、現代日本語として自然に表現する。γῆはここでは到達地点なので「地上」とした。
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: 人々の目の前で
  rationale: 公然と目撃されるというἐνώπιονの意味を明確にし、ἀνθρώπωνを性別を限定しない「人々」とする。
theological_decisions:
- issue: しるしの性質
  choice: 公に観察される大きなしるしとして描写し、その力の由来や仕組みは断定しない。
  alternative: 「大きな奇跡」として超自然性を前面に出す、または幻術・偽装であることを訳文に織り込む。
  rationale: 本文は大きなしるしを行い、火を天から降らせると述べるが、その現象の形而上学的な仕組みをここでは説明していないため、曖昧さを保つ。
- issue: ἵνα節の目的・結果
  choice: 日本語では一連の行為として「火さえ…降らせる」と表し、目的か結果かを限定しない。
  alternative: 「火を…降らせるために」と目的に限定する、または「その結果」と結果に限定する。
  rationale: ἵναはこの構文で目的・結果の双方の含みを持ち得るため、自然な日本語の中でその緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい簡潔で荘重な調子を保った。「それ」は直前の獣を受ける中性代名詞的表現で、本文だけで性別を補わない。
