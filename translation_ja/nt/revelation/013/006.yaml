id: REV.13.6
reference: Revelation 13:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: ja
  text: そして獣は、神に対する冒瀆を語るために口を開いた。神の御名とその住まい[b]――天に住む者たち[a]――を冒瀆するためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳：「神の御名とその住まいと、天に住む者たちを冒瀆するためであった。」最後の句を「その住まい」の説明ではなく、冒瀆の第三の対象と取ることもできる。
    reason: alternative_reading
  - marker: b
    text: 「住まい」は「幕屋」または「天幕」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: 獣は…口を開いた
  rationale: 直訳的な「その口を開いた」より自然な日本語としつつ、口を開くという原文の生き生きとした表現を保持した。主語は文脈上の獣である。
- source_word: εἰς βλασφημίας πρὸς τὸν θεόν
  choice: 神に対して冒瀆の言葉を吐くために
  rationale: 複数形 βλασφημίας を具体的な発言として表し、敵対的な πρός を「神に対して」とした。「吐く」は口を開くという比喩に自然につながる。
- source_word: βλασφημῆσαι
  choice: 冒瀆するためであった
  rationale: 不定詞の目的的な働きを明示し、原文にある「冒瀆」の反復も保持した。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: 神の御名
  rationale: 神の名が持つ尊厳を現代日本語の「御名」で表し、説明的な意味を付加しなかった。
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: その住まい
  rationale: σκηνή の基本像を分かりやすく表した。「幕屋」「天幕」も可能だが、この箇所で祭儀的意味を過度に限定しない表現を選んだ。
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: 天に住む者たち
  rationale: 現在分詞を自然な日本語で表した。本文では「その住まい」を説明する同格句としてダッシュで示した。
theological_decisions:
- issue: 「その住まい」と「天に住む者たち」の関係
  choice: 後者を前者の同格的・説明的表現としてダッシュ内に置く
  alternative: 「神の御名とその住まいと、天に住む者たち」のように、冒瀆の第三の対象として並列する
  rationale: 対格句の連続と σκηνή／σκηνοῦντας の語彙的結びつきは同格的理解を支持するが、並列解釈も文法上可能であるため脚注に残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の「冒瀆」の反復を保持し、曖昧な統語関係は本文と脚注で示した。
