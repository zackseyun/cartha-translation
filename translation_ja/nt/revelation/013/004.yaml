  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: ja
  text: 竜が獣に権威を与えたので、人々は竜を拝んだ。また、獣を拝んで言った。「だれが獣のようであろうか。[a][c] だれが獣と戦うことができようか。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれが獣に比べられようか」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「だれがこれに戦いを挑むことができようか」。
    reason: lexical_alternative
  - marker: c
    text: この歓呼は、神の比類なさをたたえる旧約聖書の表現（例えば、出エジプト記15章11節、詩編35編10節）を反映していると考えられるが、ここではそれが冒涜的に獣へ当てはめられている。
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: 拝んだ
  rationale: 黙示録における宗教的な崇拝、特にここでの偶像礼拝的な意味を、現代日本語で簡潔に表す。
- source_word: τῷ δράκοντι
  choice: 竜
  rationale: 黙示文学の象徴を解釈語に置き換えず、δράκωνを直接訳す標準的な表現。
- source_word: ὅτι ἔδωκεν
  choice: 与えたので
  rationale: ὅτιの因果関係を明示し、竜が獣に権威を与えたことが竜を拝む理由であるという構文を保つ。日本語では完了の先行性を文脈と語順で自然に示す。
- source_word: τὴν ἐξουσίαν
  choice: 権威
  rationale: 単なる能力としての力よりも、授けられた支配権・権限という含みを保つ。
- source_word: τῷ θηρίῳ
  choice: 獣
  rationale: θηρίονの黙示文学的な像を直接表し、日本語聖書で理解されやすい語を用いる。
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: だれが獣のようであろうか
  rationale: 修辞疑問と、神の比類なさを語る旧約的表現への反響を、説明を加えずに保持する。
- source_word: τίς δύναται πολεμῆσαι μετ’ αὐτοῦ
  choice: だれがこれと戦うことができようか
  rationale: πολεμέωの武力的対決の意味と、能力を問うδύναταιを保つ。μετά＋属格の敵対的文脈は「これと戦う」で自然に表す。
theological_decisions:
- issue: 獣を受ける代名詞の訳し方
  choice: 「これ」とし、性別を付与しない
  alternative: 人格的な支配者として「彼」または「彼と」とする
  rationale: 先行詞θηρίονは中性名詞であり、本文は獣を人格的に描く一方、文法上の性から人間男性と断定する必要はない。「これ」は日本語として指示対象を明確にしつつ、余分な解釈を避ける。
- issue: 神の比類なさを語る表現への反響
  choice: 「だれが獣のようであろうか」を本文にそのまま置く
  alternative: 冒瀆的なまねであることを本文中に説明する
  rationale: 原文は暗示にとどめているため、神に向けられるべき称賛が獣に転用される神学的緊張を翻訳内で解消せず、注で背景を示す。
translation_notes:
  register: 明快な現代標準日本語を用いながら、黙示録の荘重さに合う修辞疑問「であろうか」「できようか」を採用した。二度の「拝んだ」を残して原文の反復を保持し、「竜」「獣」という象徴語を解釈的に言い換えていない。
