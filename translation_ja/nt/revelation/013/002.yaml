id: REV.13.2
reference: Revelation 13:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: ja
  text: 私が見たその獣は、ひょう[a]に似ており、その足は熊の足のようで、その口は獅子の口のようであった。竜はこの獣に、自分の力と王座と大きな権威を与えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ひょう、熊、獅子という描写は、ダニエル書7章に登場する獣の幻を響かせている。
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: 獣
  rationale: 黙示録における怪物的・象徴的な存在を表す定着した語感を保ち、「動物」よりも終末論的な含意に適する。
- source_word: ὅμοιον παρδάλει
  choice: ひょうに似ており
  rationale: ὅμοιος＋与格による類似を自然な現代日本語で表す。παρδάλιςは「ひょう」とした。
- source_word: οἱ πόδες αὐτοῦ ὡς ἄρκου
  choice: その足は熊の足のようで
  rationale: 原文の「足」を保ちつつ、省略された比較対象の部位を日本語で補って明瞭にした。「爪」などは原文にないため加えない。
- source_word: τὸ στόμα αὐτοῦ ὡς στόμα λέοντος
  choice: その口は獅子の口のようで
  rationale: 原文で反復される στόμα を訳文でも「口」と二度示し、描写の均衡と鮮明さを保った。
- source_word: ὁ δράκων
  choice: 竜
  rationale: 黙示録の象徴的存在を表す標準的で直接的な訳語。
- source_word: ἔδωκεν
  choice: 与えた
  rationale: δίδωμι の基本義を簡潔に反映する。
- source_word: τὴν δύναμιν αὐτοῦ
  choice: 自分の力
  rationale: δύναμιςを実効的な力として訳し、後続のἐξουσία「権威」と区別した。再帰的な「自分の」により、所有者が竜であることを明瞭にする。
- source_word: τὸν θρόνον αὐτοῦ
  choice: 王座
  rationale: 支配と王権を示すθρόνοςを、現代日本語で自然かつ荘重な「王座」とした。
- source_word: ἐξουσίαν μεγάλην
  choice: 大きな権威
  rationale: ἐξουσίαの支配する権限という意味を「権威」で表し、δύναμις「力」との語義上の区別を保った。
theological_decisions:
- issue: 竜と獣の関係を代名詞・指示表現でどう示すか
  choice: 「竜はこの獣に、自分の力…を与えた」として、授与者と受領者を明示する。
  alternative: 原文の代名詞を逐語的に「彼に」「彼の」と訳す。
  rationale: ギリシア語の指示関係を変えず、日本語で生じうる代名詞の曖昧さだけを解消する。竜や獣の本質について本文以上の解釈は加えない。
- issue: 複合的な動物像とダニエル書7章との関係
  choice: 本文では動物の比較をそのまま訳し、ダニエル書への反響は脚注に置く。
  alternative: 本文中でダニエル書の幻との関連を説明する。
  rationale: 原文は類似する動物像を提示するだけで、その意味をこの節内では説明していないため、解釈的展開を本文に持ち込まない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「豹」は読みやすさを優先して「ひょう」と表記し、「lion」は黙示文学の荘重な調子に合わせて「獅子」とした。文の反復構造を保ちながら、日本語として自然になるよう比較対象の「足」を補った。
