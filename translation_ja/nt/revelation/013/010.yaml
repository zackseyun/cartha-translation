id: REV.13.10
reference: Revelation 13:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: ja
  text: 捕らわれることになっている者は、捕らわれて行く[a]。剣で殺されることになっている者は、剣で殺されなければならない[b]。ここに、聖なる者たちの忍耐と信仰がある[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「捕らわれる者は、捕らわれて行く」。この句は命令ではなく、定められた行く末を述べるものとも理解できる。
    reason: alternative_reading
  - marker: b
    text: 写本にはこの句について異読があり、「剣で殺す者は、剣で殺されなければならない」と読むものもある。
    reason: textual_variant
  - marker: c
    text: 「聖なる者たちの忠実」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: …者は
  rationale: 不定条件を、一般的原則を表す自然な日本語として訳した。
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: 捕らわれの身となるよう定められている者は、捕らわれの身となる
  rationale: 省略的で格言的な構文と同句の反復を保ちつつ、定められた行く末を述べる読みを明確な現代日本語で表した。
- source_word: αἰχμαλωσία
  choice: 捕らわれの身
  rationale: 捕虜・囚われとなる意味を自然に示し、「投獄」や「流刑」に限定しなかった。
- source_word: ἐν μαχαίρῃ
  choice: 剣で
  rationale: 道具を表す表現として簡潔で自然であり、聖書的な裁きの響きも保つ。
- source_word: ἀποκτανθῆναι
  choice: 殺される
  rationale: 受動不定詞を、明瞭な現代日本語の受動表現で訳した。
- source_word: αὐτὸν
  choice: その者は…殺されなければならない
  rationale: ギリシア語の不自然な省略構文を日本語で補い、受動性と不可避性を保った。
- source_word: ὧδέ ἐστιν
  choice: ここに…がある
  rationale: 後続内容へ注意を向ける指示的な力を保った。
- source_word: ὑπομονή
  choice: 忍耐
  rationale: 苦難の中で持ちこたえる堅忍を簡潔に表し、黙示録の文脈に適する。
- source_word: πίστις
  choice: 信仰
  rationale: 基本義を本文に採用し、文脈上可能な「忠実」は脚注に残した。
- source_word: τῶν ἁγίων
  choice: 聖なる者たち
  rationale: 神に属する聖なる民を指す語を、宗派的連想を抑えた分かりやすい日本語で表した。
theological_decisions:
- issue: 前半二句が予定された行く末を述べるのか、命令または応報原則を述べるのか
  choice: 捕囚と剣による死という定められた行く末を述べる格言として訳す
  alternative: 「捕囚へ行く者は捕囚へ行く」というより直訳的な叙述、または「剣で殺す者は剣で殺される」という異読に基づく応報原則
  rationale: 採用本文の省略的構文は予定・不可避性を表すものとして自然だが、命令や非抵抗の倫理まで本文に持ち込まず、異読は脚注で明示した。
- issue: πίστις の意味
  choice: 信仰
  alternative: 忠実
  rationale: 神への信頼という基本的意味を本文に置きつつ、迫害下での忠実さという文脈的含意を脚注に保存した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。前半の格言的な反復を保ち、過度に古風な「虜」「聖徒」は避けた。
