id: REV.13.11
reference: Revelation 13:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: ja
  text: また私は、別の獣が地[a]から上って来るのを見た。それは子羊のような二本の角を持ち、竜のように話していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「陸地」。ギリシア語 γῆ は「地（大地）」または「陸地」を意味しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: 別の獣
  rationale: 黙示録における敵対的な象徴としての「獣」という表現を保ち、ἄλλοを自然に「別の」と訳した。
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: 地から上って来る
  rationale: 現在分詞が描く出現の動きを「上って来る」で表した。γῆは「地」または「陸地」を意味し得るため、本文では広がりと曖昧さを比較的保てる「地」とし、別訳を脚注に示した。
- source_word: εἶχεν κέρατα δύο
  choice: それには…二本の角があり
  rationale: 未完了過去の描写的な働きを、日本語として自然な存在・所有表現で示した。
- source_word: ὅμοια ἀρνίῳ
  choice: 子羊の角のような
  rationale: ὅμοιαは文法上「角」に対応するため、角そのものが子羊の角に似ていることを明確にした。ἀρνίονは黙示録で定着した「子羊」とし、象徴的な響きを保った。
- source_word: ἐλάλει ὡς δράκων
  choice: 竜のように語っていた
  rationale: 未完了過去の継続的・特徴的な描写を「語っていた」で表し、ὡςの比較を「ように」として、獣と竜を同一視しすぎないようにした。
theological_decisions:
- issue: ἀρνίονが黙示録の「子羊」を想起させる可能性
  choice: 子羊
  alternative: 小羊／小さな子羊
  rationale: 真の「子羊」との見かけ上の類似を想起させる緊張を保ちつつ、獣を子羊そのものと同一視しない。「小さな子羊」は不要な幼さの含意を加えるため避けた。
- issue: γῆの訳語
  choice: 地
  alternative: 陸地
  rationale: γῆには「地・大地」と「陸地」の両義がある。海から上る獣との対比から「陸地」も可能だが、本文では意味を狭めすぎない「地」を採用し、脚注で別訳を明示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「また私は」で幻の連続を示し、「それには」で獣の外見描写を自然につないだ。比喩の対応関係を明確にするため「子羊の角のような二本の角」とした。
