id: REV.13.16
reference: Revelation 13:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: ja
  text: また、それは、すべての人、すなわち、身分の低い者にも高い者にも、富む者にも貧しい者にも、自由人にも奴隷にも、各自の右手または額に印を付けられるようにする。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「彼らがその人々に印を与えるようにする」。ギリシア語では「彼ら」に当たる複数の動作主が明示されていない。本文は文脈上の意味を自然な受動表現で訳した。
    reason: 原文の能動構文と、明示されていない複数の動作主を示すため。
lexical_decisions:
- source_word: ποιεῖ
  choice: ～ようにする
  rationale: ἵνα＋接続法を伴う使役の働きを、強制の度合いを不必要に強めず、自然な現代日本語で表す。
- source_word: πάντας
  choice: すべての人
  rationale: 後続する三組の対句が示す包括的な範囲を明確に表す。
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: 小さな者にも大きな者にも
  rationale: 社会的な低位と高位を含む定型的な対句について、黙示録の修辞的な響きと原文の比喩的表現を保つ。
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: 富む者にも貧しい者にも
  rationale: 経済的境遇の対照を簡潔かつ自然に表す。
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: 自由人にも奴隷にも
  rationale: 「自由人」との対比により、δοῦλοςは一般的な奉仕者ではなく、法的・社会的に隷属した者を指すことが明瞭である。
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: すべての人が……印を付けられるようにする
  rationale: ギリシア語は能動形で字義的には「彼らがその人々に印を与えるように」となるが、動作主が明示されず、日本語では不自然である。文脈上の出来事を受動表現で自然に伝え、字義的な構文は脚注に残す。
- source_word: χάραγμα
  choice: 印
  rationale: 識別のために刻まれ、押されるしるしを表す語であり、黙示録の用法にも適した簡潔な訳語である。
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: その右手か額に
  rationale: 身体上の位置と二者択一を簡潔に表し、各人への分配的な意味も自然な日本語で伝える。
theological_decisions:
- issue: δοῦλοςを社会的身分の対句の中でどう訳すか
  choice: 奴隷
  alternative: しもべ／召使い
  rationale: ἐλεύθερος（自由人）との明示的な対照が、隷属身分を前景化しているため。「しもべ」では法的・社会的な対比が弱まる。
- issue: ἵνα δῶσιν αὐτοῖς χάραγμαの難しい構文をどう表すか
  choice: 印を付けられるようにする
  alternative: 彼らがその人々に印を与えるようにする
  rationale: 本文では出来事を明瞭に伝えつつ、印を付ける具体的な動作主を補わない。原文の能動形と不明瞭さは脚注で示し、解釈によって過度に解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「小さな者にも大きな者にも」という対句は説明的に言い換えすぎず、黙示録特有の反復とリズムを保持した。主語はギリシア語本文で省略されているため、「それは」と受け、本文中に「獣」を補ってはいない。
