id: REV.13.14
reference: Revelation 13:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: ja
  text: また、この獣は、自分が第一の獣の前で行うことを許されたしるしによって、地に住む人々を惑わし[a]、地に住む人々に、剣による傷を負い、それでも生きた獣のために像を造るように言う[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地に住む人々を欺き」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「獣の像を造る」。ギリシア語は直訳すると「獣のために像を造る」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「剣で傷を負い、生き返った獣」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: 惑わし
  rationale: 欺くことと道を誤らせることの両面を含み得る語であり、黙示録の文脈にも合う自然な現代日本語。別訳「欺き」を脚注に示す。
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: 地に住む人々
  rationale: 黙示録で繰り返される表現の動詞的な形を保ち、「地の住民」より平明にした。
- source_word: διὰ τὰ σημεῖα
  choice: しるしによって
  rationale: διά＋対格が持つ手段・根拠のうち、この文では惑わす手段としての働きが前景化している。
- source_word: σημεῖα
  choice: しるし
  rationale: 奇跡的性格を文脈以上に明示せず、語の広い意味を保つ。
- source_word: ἃ ἐδόθη αὐτῷ ποιῆσαι
  choice: 行うことを許された
  rationale: 受動形を保ちながら自然な日本語とし、許可を与えた主体を明示しない。
- source_word: ἐνώπιον τοῦ θηρίου
  choice: 第一の獣の前で
  rationale: 直訳的な位置・面前の意味を簡潔に表す。日本語では二頭の獣の指示関係を明確にするため、文脈上の『第一の』を補った。
- source_word: λέγων
  choice: 言う
  rationale: 命令の強さを過度に加えず、発言内容を導入する分詞を自然に表す。
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: 獣のために像を造る
  rationale: 与格の献呈・関係の意味を保つ。「獣の像」も文脈上可能なので脚注に示す。
- source_word: εἰκόνα
  choice: 像
  rationale: 礼拝用の造像を含み得る一方、「彫像」ほど形態を限定しない。
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: 剣で傷を負い
  rationale: 現在形ἔχειの状態性を日本語の自然な連用表現で示しつつ、傷が過去に負わされたことも表す。
- source_word: μάχαιρα
  choice: 剣
  rationale: 黙示録での標準的で十分に明確な訳語。
- source_word: καὶ ἔζησεν
  choice: ながらも生きた
  rationale: 明示的な復活用語を加えず、致命的に見える傷との逆接的関係を自然な日本語で表す。別訳「生き返った」を脚注に示す。
theological_decisions:
- issue: ἐδόθηの神的受動の含意
  choice: 「許された」と受動で訳し、許可を与えた主体を明示しない。
  alternative: 「神から力を与えられた」
  rationale: 神の主権的許可が含意され得るが、原文は与え手を明記していないため、その緊張を保つ。
- issue: ἔζησενが獣の傷との関係で表す意味
  choice: 「ながらも生きた」
  alternative: 「生き返った」
  rationale: 傷の後の生存または回復を表すが、この節だけで明確な復活表現に限定しない。
- issue: τῷ θηρίῳと像の関係
  choice: 「獣のために像を造る」
  alternative: 「獣の像を造る」
  rationale: 与格を献呈・関係として保ち、像が獣をかたどるという文脈的含意を本文で断定しすぎない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「しるし」「像」「獣」は黙示文学の反復語として簡潔に統一した。主語は直前の第二の獣を受けて「この獣」とし、τοῦ θηρίουは混同を避けるため「第一の獣」と文脈的に明示した。脚注記号は対応箇所に配置した。
