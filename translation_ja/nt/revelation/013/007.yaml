id: REV.13.7
reference: Revelation 13:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: ja
  text: その獣には、聖なる者たちと戦い、彼らに勝つことが与えられた。また、あらゆる部族、民族、言語、国民を支配する権威が、その獣に与えられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: その獣には…ことが与えられた／その獣に与えられた
  rationale: 二度の受動表現を保ち、与えた者を明示しない原文の抑制と神学的緊張を維持した。日本語では指示対象を明確にするため「彼」ではなく文脈上の「その獣」とした。
- source_word: ποιῆσαι πόλεμον μετὰ τῶν ἁγίων
  choice: 聖なる者たちと戦い
  rationale: 「戦争をする」より自然な現代日本語とし、「～と戦う」が敵対関係を明確に表すため、μετάの字面的な「共に」による誤解を避けた。ἅγιοιは特定の教会用語に狭めず「聖なる者たち」とした。
- source_word: νικῆσαι αὐτούς
  choice: 彼らに勝つ
  rationale: 黙示録に反復されるνικάωを、日本語で広く対応できる「勝つ」とし、殺害や最終的滅亡まで意味を限定しないようにした。
- source_word: ἐξουσία
  choice: 支配する権威
  rationale: 単なる能力や武力ではなく、与えられた統治権・管轄を表す。「権威」だけでは日本語で後続するἐπίの支配領域が不自然になりうるため「支配する」を補った。
- source_word: ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος
  choice: あらゆる部族、民族、言語、国民を
  rationale: 四重の列挙を保持した。φυλήは「部族」、γλῶσσαは身体器官ではなく「言語」とした。λαόςとἔθνοςの区別を完全には再現できないため、それぞれ「民族」「国民」と訳し、重複を抑えつつ集合体の広がりを示した。
theological_decisions:
- issue: 二度繰り返されるἐδόθηの行為者が明示されていないこと
  choice: 「与えられた」という受動表現を保ち、与えた者を明示しない。
  alternative: 「許された」として神の許容を明示する。
  rationale: 原文は授与者を直接名指ししない。神の主権と悪に許された活動との緊張を訳文で一方的に解消しないため、受動表現を維持した。
- issue: 獣が聖なる者たちにνικᾶνする意味
  choice: 「勝つ」と訳し、地上的・一時的な勝利を含みうる表現にとどめる。
  alternative: 「征服する」「打ち負かす」と訳して全面的な制圧を強調する。
  rationale: この節は獣の勝利を述べる一方、黙示録全体では「勝利」が多層的に用いられる。「勝つ」はその緊張を保持し、聖なる者たちの究極的敗北と断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その獣」を反復して指示対象を明確にしつつ、原文の二つの受動構文と四重の列挙を保持した。注を必要とするほど本文から外れる異読・語義上の重大な曖昧さはないため、脚注は付していない。
