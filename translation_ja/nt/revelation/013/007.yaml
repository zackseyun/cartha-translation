  verdict: approve
  source_fidelity: ギリシア語の二つの受動形ἐδόθηを「与えられた」として両方保持し、授与者を特定していない。ποιῆσαι πόλεμον μετὰ τῶν ἁγίωνは文脈上の敵対的意味を「聖なる者たちと戦い」と自然に表し、νικῆσαιも過度に限定しない「彼らに勝つ」としている。ἐξουσία ἐπί以下も、全四項目とその支配領域を保持している。
  naturalness: 明瞭な現代標準日本語であり、「その獣」の反復もこの短い節では指示対象を明確にするために有効である。「支配する権威」はやや説明的ではあるが、不自然ではなく、ἐξουσίαが単なる力ではなく統治上の権限であることを適切に示す。
  terminology: 「聖なる者たち」はἅγιοιを特定の教派用語へ狭めずに保つ。「部族、民族、言語、国民」は四重の定型的列挙を維持しており、λαόςとἔθνοςの日本語上の完全な語彙的分離が難しい点にもかかわらず、範囲を損なっていない。
