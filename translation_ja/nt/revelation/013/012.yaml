id: REV.13.12
reference: Revelation 13:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: ja
  text: また、この獣は、最初の獣のすべての権威を、その前で[a]行使する。そして、地とそこに住む人々に、致命的な傷[b]が癒やされた最初の獣を拝ませる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その面前で」とも訳せる。この表現は、第二の獣が最初の獣の面前で、またはそのすぐ近くで行動することを示す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「その死の傷」。すなわち、死をもたらすほどの傷。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 単なる力ではなく、行使される権限・支配権を表すため、「権威」とした。
- source_word: πᾶσαν
  choice: すべて
  rationale: 最初の獣の権威が余すところなく行使されることを自然な日本語で示す。
- source_word: ποιεῖ（第一の用例）
  choice: 行使する
  rationale: ποιεῖ τὴν ἐξουσίαν は権威を実際に用いることを意味するため、日本語の慣用に即して「権威を行使する」とした。
- source_word: ἐνώπιον αὐτοῦ
  choice: 最初の獣の前で
  rationale: 空間的な『前で』と、その監視下・面前で行動する含みの双方を保つ。指示対象を明確にするため「最初の獣」と補った。
- source_word: ποιεῖ（第二の用例）
  choice: 拝ませる
  rationale: 目的節を伴う使役の意味を、日本語では直接的な使役形で自然に表した。強制の具体的な程度までは明示しない。
- source_word: τὴν γῆν
  choice: 地
  rationale: 黙示録における天や海との対照を保ち、聖書的でありながら現代日本語でも理解可能な「地」とした。
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: そこに住む人々
  rationale: κατοικέω の動詞的表現を保ちつつ、自然で明瞭な日本語とした。
- source_word: προσκυνήσουσιν
  choice: 拝む
  rationale: ひれ伏して礼拝・崇敬する行為を簡潔に表す。使役構文の中で「拝ませる」とした。
- source_word: θηρίον
  choice: 獣
  rationale: 黙示文学における定着した直接的な訳語である。
- source_word: ἐθεραπεύθη
  choice: 癒やされた
  rationale: 受動態の治癒表現を保ち、傷が回復したという奇異な出来事を明確に示す。
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: 致命的な傷
  rationale: 直訳的な「死の傷」が表す、死をもたらす傷という意味を自然な日本語で伝える。字義的構造は脚注に残した。
theological_decisions:
- issue: 第二の獣が地に住む人々へ及ぼす作用の強さ
  choice: 拝ませる
  alternative: 強いて拝ませる／拝むようにさせる
  rationale: ποιεῖ と目的節は使役を示すが、この句自体は強制の具体的な程度を規定しない。「拝ませる」は結果を生じさせる力を保ちつつ、「強いて」を加えて解釈を限定することを避ける。
- issue: ἐνώπιον αὐτοῦ が示す関係
  choice: 最初の獣の前で
  alternative: 最初の獣の面前で／最初の獣の監視のもとで
  rationale: 原文は直接には『前で、面前で』を意味し、監視下や承認下という含みはあり得るが確定しないため、空間的・関係的な曖昧さを保つ表現を本文に置いた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この獣」は直前の第二の獣を指す。「地」は黙示録の反復語彙とのつながりを優先し、「世界」や「大地」にはしなかった。二つの脚注記号は、対応する語句の直後に本文中で明示した。
