  to: そして、地上に住む者はみな、世界の基が据えられた時から[a]ほふられた小羊の命の書にその名が記されていない者であり、彼を拝む。
  rationale: 本文ではギリシャ語の語順に従い、「世界の基が据えられた時から」を直前の「ほふられた小羊」に係るものとして訳しました。ただし、この係り先には実際の統語的曖昧さがあり、黙示録17章8節との並行も別の接続を支持しうるため、代替の読みを脚注に完全な文として示します。本文の語順と表現を整えつつ、この論点を教義的に解決しないようにしました。
