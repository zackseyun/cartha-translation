review_pass:
  verdict: revise
  source_fidelity: 本文は主要な語義を概ね保っていますが、「ほふられている」は完了受動分詞 τοῦ ἐσφαγμένου の自然な日本語として不適切です。「ほふられた」とするのが、完了による結果を含みつつ日本語としても正確です。また、脚注記号は係り先が問題となる句に直接置くべきです。
  naturalness: 「地上に住むすべての者、すなわち、…者は」は意味は通りますが、現代標準日本語としては重く、主題と同格関係が追いにくくなっています。「地上に住む者はみな、…者であり」とすると、原文の範囲限定を明瞭に保てます。
  terminology: 「拝む」「地上に住む者」「命の書」「小羊」は黙示録の文脈に適切です。「ほふられた」は犠牲的な含意を保つ定着した聖書語であり、この箇所では許容されます。「世界の基が据えられた時から」は καταβολῆς κόσμου を明瞭に表します。
  issues:
  - severity: medium
    issue: 「ほふられている」という分詞訳
    rationale: τοῦ ἐσφαγμένου は完了受動分詞であり、日本語では「ほふられた」が自然です。「ほふられている」は継続中の受難のように響き、原文が示す既に起きた行為とその結果状態を不自然に表します。
  - severity: low
    issue: 主文と関係節の日本語上のつながり
    rationale: 「すべての者、すなわち、…者は」という構文は冗長で読みにくいため、限定される対象を「地上に住む者はみな、…者であり」と明示します。意味上、礼拝する者は名が命の書に記されていない地上の住民であることを保ちます。
  - severity: low
    issue: 脚注アンカーの位置
    rationale: 統語的曖昧さは「世界の基が据えられた時から」の係り先に関するため、脚注記号を当該句の直後に置きます。
