id: REV.13.8
reference: Revelation 13:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: ja
  text: そして、地上に住む者はみな、世界の基が据えられた時から[a]ほふられた小羊の命の書にその名が記されていない者であり、彼を拝む。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして、地上に住む者はみな、世界の基が据えられた時から、その名が、ほふられた小羊の命の書に記されていない者であり、彼を拝む。」ギリシャ語の「世界の基が据えられた時から」は、「ほふられた」にも「記されていない」にも係る可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: 拝む
  rationale: 黙示録では神や小羊への礼拝と獣への礼拝を対照させる語であり、宗教的な崇敬を明確に表すため。
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: 地上に住む者
  rationale: 黙示録で反復される表現を保ちつつ、現代日本語として自然にした。
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: その名が…記されていない者
  rationale: 各人の名が記載されていないという単数形と、完了形が示す現在の結果状態を表す。
- source_word: βιβλίῳ τῆς ζωῆς
  choice: 命の書
  rationale: 黙示文学的な比喩を明瞭に伝える、定着した日本語表現である。
- source_word: τοῦ ἀρνίου
  choice: 小羊の
  rationale: 黙示録におけるキリスト論的称号と、犠牲のイメージを保つ。
- source_word: τοῦ ἐσφαγμένου
  choice: ほふられている
  rationale: σφάζωの犠牲的かつ暴力的な含意と、完了分詞の結果状態を保つ。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 世界の基が据えられた時から
  rationale: 創造の開始を示す聖書的表現を、意味が伝わる現代日本語で表した。
theological_decisions:
- issue: 「世界の基が据えられた時から」の統語的な係り先
  choice: 本文では「ほふられている小羊」に係る
  alternative: 「記されていない」に係り、『その名が、世界の基が据えられた時から、ほふられた小羊の命の書に記されていない者』と読む
  rationale: ギリシャ語の語順では直前の「ほふられている」に結び付けるのが自然だが、黙示録17:8との並行は「記されていない」への接続を強く支持する。真正な統語的曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「ほふる」は日常語ではないが、小羊の犠牲という語義を保つため用いた。「すなわち」で後半が『すべての者』の範囲を説明することを明確にした。
