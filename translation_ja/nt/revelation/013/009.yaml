  text: Εἴ τις ἔχει οὖς ἀκουσάτω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: ja
  text: 耳のある者は、聞きなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: …者は
  rationale: 直訳的には「もしだれかが」だが、日本語の定型的な勧告として「…者は」とすることで、不特定のすべての人に開かれた条件的な呼びかけを自然に表す。
- source_word: ἔχει
  choice: ある
  rationale: 「耳」との自然な日本語の結びつきを優先し、「持っている」ではなく「ある」と訳す。
- source_word: οὖς
  choice: 耳
  rationale: 原文の単数形を保つ。ここでは身体器官だけでなく、告げられたことを受け止める力を含意するが、解釈的に言い換えない。
- source_word: ἀκουσάτω
  choice: 聞きなさい
  rationale: 三人称単数命令の厳粛な勧告を、現代日本語で明瞭かつ品位ある命令表現にする。「理解しなさい」などと意味を限定せず、「聞く」という聖書的反復を保つ。
theological_decisions:
- issue: 聞くことを求める定型句の意味
  choice: 「聞きなさい」を保持する
  alternative: 「悟りなさい」「よく聞きなさい」
  rationale: この句は単なる聴覚作用を超えて注意深く受け止めるよう促すが、原文はその応答のあり方を明示していないため、解釈的な補足を避ける。
- issue: 不特定代名詞と文法上の性
  choice: 性を示さない日本語の「者」で包括的に表す
  alternative: 「その人は」
  rationale: τις は不特定で一般的な指示を持つ。日本語では文法上の男性形を再現する必要がなく、「者」が原文の一般性と単数的な呼びかけを自然に保つ。
translation_notes:
  register: 簡潔で格調のある現代標準日本語。黙示録2―3章などに見られる同型の呼びかけとの文学的な響きを保ちつつ、古風な「聞くがよい」は避けた。
