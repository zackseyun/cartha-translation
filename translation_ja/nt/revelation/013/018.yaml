id: REV.13.18
reference: Revelation 13:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: ja
  text: ここに知恵がある。理解力のある者は、獣の数字を計算せよ。それは人の数字[a]だからである。その数字は六百六十六[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ある人の数字」、または「人間的な数字」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 写本によっては「六百十六」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: ここに知恵がある
  rationale: ὧδεの指示的な力と、知恵を提示する簡潔で荘重な表現を保った。
- source_word: ὁ ἔχων νοῦν
  choice: 理解力のある者
  rationale: νοῦςを単なる精神器官としての「心」ではなく、見分けて理解する能力として表した。単数の一般的な呼びかけも「者」で保持した。
- source_word: ψηφισάτω
  choice: 計算せよ
  rationale: 数を数え上げ、算出するよう求めるアオリスト命令形。現代語として明確であり、命令の強さも保つ。
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: 獣の数字
  rationale: ここでは算出され、六百六十六と特定される数値を指すため「数字」とした。「獣」は黙示録の終末論的文脈に定着した自然な訳語。
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: それは人の数字だからである
  rationale: 無冠詞単数属格ἀνθρώπουが持つ、特定の人に属する数、人に関わる数、人間的な数という曖昧さを、「人の数字」によって可能な限り保持した。
- source_word: καὶ ὁ ἀριθμὸς αὐτοῦ
  choice: その数字は
  rationale: αὐτοῦが指す獣の数字を、日本語で不自然な代名詞を用いずに受けた。
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: 六百六十六
  rationale: 本文の数詞をそのまま現代日本語の漢数字で表した。
theological_decisions:
- issue: ἀριθμὸς γὰρ ἀνθρώπου ἐστίνにおけるἀνθρώπουの意味
  choice: 本文では「人の数字」とする
  alternative: 「ある人の数字」または「人間的な数字」
  rationale: ギリシア語は、特定の一人の人を指すのか、人間一般または人間的性質を指すのかを明示していない。本文で解釈を一つに限定せず、脚注で主要な可能性を示した。
- issue: 獣の数字の本文形
  choice: 六百六十六
  alternative: 六百十六
  rationale: SBLGNT本文の読みを採用し、有力な写本異読を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学の簡潔で荘重な調子を保った。命令形は「計算せよ」とし、一般読者にも理解できる範囲で格調を持たせた。
