id: REV.13.1
reference: Revelation 13:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: ja
  text: 私はまた、海から一頭の獣が上って来るのを見た。その獣には十本の角と七つの頭があり、角には十の王冠[a]が、頭には冒瀆的な数々の名[b]があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ディアデム」。王権を示す冠。
    reason: διάδημαは一般的な冠より具体的に、王権に結びつく冠・diademを指すため。
  - marker: b
    text: 直訳「冒瀆の名々」。または「冒瀆の名」。
    reason: βλασφημίαςはὀνόματαを修飾する属格であり、「冒瀆的な名」とも「冒瀆の名」とも表現できるため。
lexical_decisions:
- source_word: εἶδον
  choice: 私は……見た
  rationale: アオリスト直説法を簡潔な過去の叙述として訳し、「幻の中で」など原文にない説明は加えない。
- source_word: ἐκ τῆς θαλάσσης
  choice: 海から
  rationale: ἐκが示す、海の中から外へ現れる動きを、後続の「上って来る」と合わせて自然な日本語で表した。
- source_word: θηρίον
  choice: 獣
  rationale: 黙示文学の象徴的イメージを解釈せず、そのまま保つ。「怪物」など意味を強める語は避けた。
- source_word: ἀναβαῖνον
  choice: 上って来る
  rationale: 現在分詞が描く、獣が海から姿を現す進行中の動きを自然に表す。
- source_word: ἔχον
  choice: その獣には……があり
  rationale: 分詞による外見の描写を、明瞭で自然な現代日本語の構文にした。
- source_word: κέρατα δέκα
  choice: 十本の角
  rationale: 象徴を説明に置き換えず、数と像をそのまま訳した。
- source_word: κεφαλὰς ἑπτά
  choice: 七つの頭
  rationale: 原文の黙示的な像を逐語的に保った。
- source_word: διαδήματα
  choice: 王冠
  rationale: διάδημαは王権を示す冠を指すため、一般的な「冠」より具体的な「王冠」とした。より厳密な形状上の語義は脚注に示す。
- source_word: ὀνόματα βλασφημίας
  choice: 冒瀆的な数々の名
  rationale: 複数形ὀνόματαを「数々の名」で示し、属格βλασφημίαςを自然な連体修飾として訳した。何を冒瀆するかは本文で補わず、原文の含みを保った。
theological_decisions:
- issue: 黙示文学の象徴的イメージ
  choice: 「獣」「角」「頭」「王冠」「名」という像をそのまま残す。
  alternative: 獣を帝国、王、支配者、または悪魔的勢力などと本文中で特定する。
  rationale: この節は象徴を提示しているが、その指示対象を明示してはいない。翻訳で特定の終末論的解釈を織り込まない。
- issue: βλασφημίαςの属格表現
  choice: 「冒瀆的な」と訳し、冒瀆の対象を明示しない。
  alternative: 「神を冒瀆する」と補って訳す。
  rationale: 文脈上は神への冒瀆が強く示唆されるものの、この句自体には目的語がないため、本文では補足せず曖昧さを保った。
- issue: διάδημαの王権的含意
  choice: 「王冠」とする。
  alternative: 一般的な「冠」または音写的な「ディアデム」とする。
  rationale: 王権を示す冠という語義を、普通の読者に分かる現代日本語で表しつつ、象徴の解釈までは加えない。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、黙示文学にふさわしい簡潔で荘重な調子を保った。「冒瀆」は聖書的文脈で定着し、かつ現在も理解可能な語として採用した。
