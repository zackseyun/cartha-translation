id: REV.13.15
reference: Revelation 13:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: ja
  text: また、その者には、獣の像に息[a]を与えることが許された。それは、獣の像が話し、また、獣の像を拝まない者がすべて殺されるようにするためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊を与える」または「命を与える」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: その者には……ことが許された
  rationale: 受動表現によって、許可や力を与えた者を明示しない原文の形を保つ。「その者」は文脈上の第二の獣を指すが、本文中で解釈的な呼称を加えない。
- source_word: δοῦναι πνεῦμα
  choice: 息を与える
  rationale: πνεῦμαには「息」「霊」「命」の意味領域がある。像が話すようになる場面では「息」が具体的であり、像が生かされたかのような描写を保ちつつ、人格的な霊が宿ったと断定しない。
- source_word: εἰκών
  choice: 像
  rationale: 偶像や似姿を広く表せる標準的な訳語であり、「彫像」など特定の形態に限定しない。
- source_word: θηρίον
  choice: 獣
  rationale: 黙示文学における定着した訳語で、原語の表象を過度に解釈しない。
- source_word: ἵνα καὶ λαλήσῃ
  choice: それは……ものまで言い……ためであった
  rationale: ἵναの目的・結果の含みを自然な日本語で示し、καίは像が話すという驚くべき事態を表す「まで」とした。
- source_word: ποιήσῃ ἵνα
  choice: 殺させる
  rationale: ποιέωにἵνα節が続く使役的な構文を簡潔な現代日本語で表し、像が処刑を引き起こすという関係を保つ。
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: 拝まない者を皆
  rationale: 不定関係表現の包括性を「者を皆」で示し、条件に該当する者すべてを指すことを明確にする。
- source_word: προσκυνήσωσιν
  choice: 拝まない
  rationale: 黙示録で獣やその像に向けられる宗教的崇拝を、自然で簡潔な「拝む」で表す。
- source_word: ἀποκτανθῶσιν
  choice: 殺させる
  rationale: 原文の受動態「殺される」を、日本語の使役構文の中で自然に表現する。実際に殺す主体は原文同様、特定しない。
theological_decisions:
- issue: 像に与えられるπνεῦμαの意味
  choice: 息
  alternative: 霊、命
  rationale: 像が話せるようになる描写に即して「息」を採用し、真の生命や人格的な霊が与えられたという形而上学的判断を本文に持ち込まない。別の語義は脚注に残す。
- issue: ἐδόθηの行為者
  choice: 与えた者を明示せず、「許された」とする
  alternative: 神または竜・サタンを行為者として補う
  rationale: 原文は行為者を明示していないため、黙示文学に見られる許可・権限付与の含みを示しながら、その主体に関する神学的推定は加えない。
- issue: 像と処刑との因果関係
  choice: 像が人々を「殺させる」
  alternative: 像を拝まない者が皆「殺されるようにする」
  rationale: ποιήσῃ ἵναの使役的な力を保ちつつ自然な日本語にした。処刑の直接の実行者は特定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録にふさわしい荘重さを保った。「ものまで言い」で像が発話する異様さを簡潔に示し、「殺させる」によって実際の処刑者を補わず原文の余白を残した。
