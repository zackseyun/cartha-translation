  to: また、獣の頭の一つが、死ぬほどにほふられたかのようだった[a]。そして、その致命傷は癒やされた。全地は驚嘆し、獣の後について行った[b]。
  rationale: 原文の接続詞καὶが示す叙述の連続を保つため、「しかし」を「そして」に改めた。また、εἰς θάνατονの「死に至るほど／致死的な」強調を、現代日本語として誤解の少ない「死ぬほどに」で表した。出来事が実際の死と回復、象徴的回復、あるいは見せかけのいずれかであるかは、本文・脚注ともに決定していない。
