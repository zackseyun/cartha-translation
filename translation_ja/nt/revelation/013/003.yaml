  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μίαν ἐκ τῶν κεφαλῶν αὐτοῦ ⸀ὡς ἐσφαγμένην εἰς θάνατον, καὶ ἡ πληγὴ τοῦ θανάτου αὐτοῦ ἐθεραπεύθη. καὶ ⸀ἐθαυμάσθη ⸂ὅλη ἡ γῆ⸃ ὀπίσω τοῦ θηρίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/003.yaml
  text: And one of its heads was as if slaughtered to death[a], and its deadly wound was healed. And the whole earth marveled and followed after the beast[b],
translation:
  language: ja
  text: また、獣の頭の一つが、死ぬほどにほふられたかのようだった[a]。そして、その致命傷は癒やされた。全地は驚嘆し、獣の後について行った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死ぬほどにほふられたように見えた」。原文の「かのよう」は、実際にそうだったとの断定ではなく、外観や類似を示す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「全地」は「全土」とも訳せる。ただし、この黙示的な文脈では、地上全体を指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: μίαν ἐκ τῶν κεφαλῶν αὐτοῦ
  choice: 獣の頭の一つ
  rationale: μίαν ἐκ＋属格複数の部分を表す構文を、自然な日本語で表した。文脈上の指示対象である「獣」を明示し、関係を分かりやすくした。
- source_word: ὡς ἐσφαγμένην
  choice: ほふられたかのようであった
  rationale: σφάζωの犠牲獣をほふるような強い語感を保ちつつ、ὡςが示す外観・類似を「かのよう」で明示した。
- source_word: εἰς θάνατον
  choice: 死に至るまで
  rationale: 死をもたらすほどの状態を示す句の強さを保ち、直後の致命傷とのつながりも伝わる表現とした。
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: その致命傷
  rationale: 字義的な「その死の傷」では不自然なため、死にかかわる傷という属格表現を、簡潔で明瞭な「致命傷」とした。
- source_word: ἐθεραπεύθη
  choice: 癒やされた
  rationale: 治療・回復を表す受動形を、傷について自然な日本語で訳した。
- source_word: ἐθαυμάσθη
  choice: 驚嘆し
  rationale: 驚きに満たされることを示し、その反応が肯定的か否定的かは訳文で決めないようにした。
- source_word: ὅλη ἡ γῆ
  choice: 全地
  rationale: γῆの「地／地上」の意味と黙示文学的な広がりを簡潔に表した。「全世界」ほど解釈を固定せず、「全土」より広域性を保つ。
- source_word: ὀπίσω τοῦ θηρίου
  choice: 獣の後について行った
  rationale: 方向的に後を行く像と、獣に追随する含意の双方を保った。
- source_word: θηρίου
  choice: 獣
  rationale: 黙示録におけるθηρίονの標準的で明瞭な訳語とした。固有名詞化は避けた。
theological_decisions:
- issue: 獣の頭の死と回復の性質
  choice: 致死的にほふられたかのような姿と、その傷の癒やしを描きつつ、それが文字どおりの復活か、象徴的な回復か、欺瞞的な外観かを特定しない。
  alternative: 文字どおりの死と復活、帝国または支配者の象徴的回復、演出された見せかけの死のいずれかに限定する。
  rationale: 原文はὡςによって「かのよう」と述べ、同時に傷が癒やされたとも述べるが、その出来事の性質を説明していないため、訳文でも黙示的な緊張と曖昧さを保った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、黙示録の荘重な調子を保った。「ほふる」は日常語より格調があるが、σφάζωの強い犠牲的・暴力的な像を伝えるため採用した。
