id: REV.13.5
reference: Revelation 13:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: ja
  text: また、この獣には、大言[b]と冒瀆の言葉を語る口が与えられ、四十二か月の間、活動する権威が与えられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本およびそれに基づく一部の訳では、「四十二か月の間、存続する権威が与えられた」とある。
    reason: textual_variant
  - marker: b
    text: 「大言」は、この文脈では傲慢で誇示的な発言を意味すると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη
  choice: 与えられた
  rationale: 受動態を保ち、獣の口と権威が固有のものではなく、与えられたものであることを示す。同じ動詞が二度用いられる反復も日本語本文で保持した。
- source_word: στόμα
  choice: 口
  rationale: 黙示文学の鮮明なイメージを保つため、「語る力」などと抽象化せず、原語どおり身体部位を表す語を用いた。
- source_word: λαλοῦν
  choice: 語る
  rationale: 「口」を修飾する現在分詞の継続的な発話の意味を、自然な連体修飾「語る」で表した。
- source_word: μεγάλα
  choice: 大言
  rationale: 字義上の「大きなこと」を、日本語で尊大・傲慢な発言を含意しうる「大言」とした。文脈上の誇示的意味を伝えつつ、「自慢」などへ過度に限定しない。
- source_word: βλασφημίας
  choice: 冒瀆の言葉
  rationale: 複数の発言内容を自然な日本語で示し、神に敵対する宗教的な侮辱という語義を保持した。
- source_word: ἐξουσία
  choice: 権威
  rationale: 単なる力ではなく、与えられた権限・許可という含みを保ち、直前の受動表現とも調和させた。
- source_word: ποιῆσαι
  choice: 活動する
  rationale: 広い意味の「行う」を表す不定詞に期間表現が続くため、日本語として自然でありながら、何を行うかを限定しすぎない「活動する」とした。
- source_word: μῆνας τεσσεράκοντα δύο
  choice: 四十二か月の間
  rationale: 期間を表す対格を自然な日本語で明示し、黙示録における数値をそのまま保持した。
theological_decisions:
- issue: μεγάλα が表す発言の性質
  choice: 「大言」とし、傲慢で誇示的な含意を残した。
  alternative: 「大きなこと」「大言壮語」「傲慢な言葉」
  rationale: 文脈では神に敵対する尊大な発言だが、原語自体は「大きなこと」と幅がある。「大言」はその含意を伝えつつ、「自慢」や特定内容へ狭めすぎない。
- issue: 期間表現を伴う ποιῆσαι の意味
  choice: SBLGNT本文に従い「四十二か月の間、活動する」とした。
  alternative: 「四十二か月の間、存続する」
  rationale: 原語本文の ποιῆσαι は広く「行う」を意味するため、本文では活動の継続として訳した。「存続する」は異読およびそれに基づく翻訳伝統として脚注に残した。
- issue: 獣に与えられた権威の性質
  choice: 受動形を二度保持し、「与えられた権威」とした。
  alternative: 能動的に主語を補って「神が許した」とする。
  rationale: 与え手は本文で明示されていない。神の許容を暗示する神的受動と理解しうるが、翻訳では主語を補わず、原文の含みと神学的緊張を保った。
translation_notes:
  register: 現代標準日本語の明瞭さを優先しつつ、黙示文学の荘重さと「口が与えられた」という鮮明な比喩を保持した。「この獣」は直前の指示対象を日本語で明確にするために用いた。
