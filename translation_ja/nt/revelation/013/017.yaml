id: REV.13.17
reference: Revelation 13:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἵνα μή τις ⸀δύνηται ἀγοράσαι ἢ πωλῆσαι εἰ μὴ ὁ ἔχων τὸ χάραγμα, τὸ ὄνομα τοῦ θηρίου ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: ja
  text: また、その刻印、獣の名、あるいはその名の数字を持つ者でなければ、だれも買うことも売ることもできないようにした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ἵνα μή τις δύνηται
  choice: また、……だれも……できないようにした
  rationale: ἵναは前節の動作に続く目的・結果を表す。日本語では前節から主語と述語を補い、「ようにした」として自然なつながりを保った。μή τιςは例外以外の「だれも」を表す。
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: 売り買いする
  rationale: 通常の商取引を表す対句であり、現代日本語の自然な定型表現とした。日本語では語順を「売り買い」とするのが慣用的で、意味は保持される。
- source_word: εἰ μὴ ὁ ἔχων
  choice: 持つ者でなければ
  rationale: 唯一の例外を示すεἰ μήと、名詞的に用いられた分詞ὁ ἔχωνを簡潔に表す。「者」は日本語では性別を限定しないため、ギリシア語の一般的用法にも合う。
- source_word: τὸ χάραγμα
  choice: その刻印
  rationale: χάραγμαは刻み付けられた印や刻印を指す。黙示録の文脈と前節からの既知性を「その」で示した。
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: 獣の名
  rationale: 属格構文を直接的に訳し、θηρίονの黙示文学的な象徴称号を「獣」とした。
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: あるいはその名に対応する数字
  rationale: 「その」は直前の獣を受ける。ἀριθμὸς τοῦ ὀνόματοςは直訳的な「名の数字」より、「その名に対応する数字」とすることで、名と数字の関係を過度に特定せず自然な日本語にした。
theological_decisions:
- issue: 「刻印」と「獣の名／名に対応する数字」の構文上の関係
  choice: 読点で並べ、同格関係を本文で断定しない
  alternative: 「刻印、すなわち獣の名か、その名に対応する数字」
  rationale: ギリシア語ではτὸ χάραγμαの後にτὸ ὄνομα ... ἢ τὸν ἀριθμόν ... が続き、後二者を刻印の説明と取ることも、列挙として読むことも可能である。本文はこの曖昧さを保ち、注で説明する。
- issue: ὁ ἔχωνの文法上の男性単数
  choice: 持つ者
  alternative: それを持っている人
  rationale: この男性単数は一般的な人を指す。日本語の「者」は文法上の性を持たず、対象を不当に男性に限定しない。
- issue: αὐτοῦの指示対象と表現
  choice: その名
  alternative: 彼の名
  rationale: 直近の先行詞θηρίονは中性名詞だが、獣は文脈上人格的に行動する。日本語の「その」は性を決めずに先行詞との関係を保てるため、不要な人格化または非人格化を避けられる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節から続く構文を日本語の完結した文にしつつ、識別標識どうしの関係にある原文の曖昧さは読点と注で保持した。
