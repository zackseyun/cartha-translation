id: REV.3.20
reference: Revelation 3:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: ja
  text: 見よ[a]、わたしは戸口に立って、たたいている。だれでも、わたしの声を聞いて戸を開けるなら、わたしはその人のところに入って、その人と食事を共にし[b][c]、その人もわたしと食事を共にする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「さあ、見なさい」。ギリシア語の「立っている」は完了形で、そこに立ち続けている現在の状態を表し、「たたいている」は現在形で継続する動作を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「その人のもとへ入る」。単にある場所の中へ入ることではなく、その人に向かう人格的・関係的な意味合いがある。
    reason: lexical_alternative
  - marker: c
    text: 共に食事をする情景は、親密で相互的な交わりを表す。これが特に主の晩餐、回心、または交わりの回復を指すかについては解釈が分かれ、本文自体は明示していない。
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を強く促す語。現代日本語でも聖書本文にふさわしい簡潔さと荘重さを保ち、場面の切迫感を伝える。
- source_word: ἕστηκα
  choice: 立って
  rationale: 完了形だが現在の状態を表すため、「立った」ではなく、今そこに立っている継続的な姿勢として訳した。
- source_word: ἐπὶ τὴν θύραν
  choice: 戸口に
  rationale: 戸そのものの上ではなく、入口のところにいる位置関係を自然な日本語で表した。
- source_word: κρούω
  choice: たたいている
  rationale: 現在形が表す継続的な動作を明示し、戸をたたき続けている情景を自然に伝える。
- source_word: ἐάν τις
  choice: だれでも…なら
  rationale: 不定代名詞の開かれた条件を、性別を限定せずに表した。
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: わたしの声を聞いて
  rationale: φωνήを「声」とし、聞くことと戸を開けることが条件節内で続く構造を自然に示した。
- source_word: ἀνοίξῃ τὴν θύραν
  choice: 戸を開ける
  rationale: 条件節のアオリスト接続法を、簡潔で自然な日本語の条件表現にした。
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: わたしはその人のところに入って
  rationale: πρὸς αὐτόνの人格的・関係的な方向性を「その人のところに」で保ち、単に建物内へ入るとの限定を避けた。
- source_word: δειπνήσω
  choice: 食事を共にし
  rationale: 主たる食事を取る意味を、特定の時刻や文化的な食事名に狭めず、交わりの含意も自然に伝える。
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: その人と食事を共にし、その人もわたしと共にする
  rationale: 後半の省略を日本語でも保ちながら、相互的な交わりを明確に示した。
theological_decisions:
- issue: 食事の比喩が指す交わり
  choice: 親しい相互的な食卓の交わりとして、そのまま訳す
  alternative: 主の晩餐への言及、回心・救いへの招き、または信者・教会との交わりの回復に限定する
  rationale: 本文は親密で相互的な交わりを明示するが、それが聖餐、回心、交わりの回復のいずれかであるとは明言しないため、解釈を一つに限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「見よ」で宣言の荘重さを保った。「戸口に立って、たたいている」で継続する情景を示し、「その人」を反復して性別を限定せず、相互性を明確にした。
