id: REV.3.9
reference: Revelation 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: ja
  text: '見よ。わたしは、「サタンの会堂」に属する者たちの中から何人かを、あなたに与える[a]。彼らは自分たちをユダヤ人だと言っているが、そうではなく、偽っている。見よ。わたしは彼らがあなたの足もとに来てひれ伏り[b]、わたしがあなたを愛したことを知るようにする。


    [a] 直訳では「サタンの会堂から与える」。この表現は、その集団の中の何人かが来るようにされる、という意味だと考えられる。


    [b] 「あなたの足もとに来て礼拝する」とも訳せる。ここで用いられているギリシア語の動詞は、「ひれ伏す」と「礼拝する」のどちらの意味にもなり得る。ここでは、信徒が神への礼拝を受けるという印象を避け、敬意や服従を表す動作として「ひれ伏す」とした。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「サタンの会堂から与える」。この表現は、その集団の中の何人かが来るようにされる、という意味だと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「あなたの足もとに来て礼拝する」とも訳せる。ここで用いられているギリシア語の動詞は、「ひれ伏す」と「礼拝する」のどちらの意味にもなり得る。ここでは、信徒が神への礼拝を受けるという印象を避け、敬意や服従を表す動作として「ひれ伏す」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を促す間投詞として、簡潔で格調を保ちながら現代日本語でも理解しやすい「見よ」を採用した。二度の反復も保持した。
- source_word: διδῶ
  choice: 与える
  rationale: 現在形を未来表現に平板化せず、日本語の非過去形「与える」で表した。受け手は原文に明示されていないため補わなかった。
- source_word: ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: 「サタンの会堂」に属する者たちの中から何人か
  rationale: ἐκの起点・部分の意味を「中から」で示し、日本語として目的語を明確にするため「何人か」を補った。「会堂」はここでユダヤ人共同体を指す定着した訳語である。
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: 自分たちをユダヤ人だと言っている
  rationale: 再帰表現と現在分詞の継続的な主張を自然な日本語で保持した。
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: そうではなく、偽っている
  rationale: 原文の鋭い対比と現在的な行為を保ち、民族的意味などを説明的に加えなかった。
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν καὶ προσκυνήσουσιν
  choice: 彼らを……来てひれ伏すようにし
  rationale: ποιέωの使役的な力を「ようにし」で示した。προσκυνέωは礼拝にも服従・敬意を示す平伏にもなり得るため、文脈上「ひれ伏す」を本文に置いた。
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: あなたの足もとに
  rationale: 日本語として自然な慣用表現を用いながら、相手の前で足もとに平伏する具体的な位置関係を伝えた。
- source_word: γνῶσιν
  choice: 悟らせる
  rationale: ἵνα節の意図・結果と、先行する使役構文とのつながりを自然に示す。「知る」よりも、事実を認識するに至る含みを表した。
- source_word: ἐγὼ ἠγάπησά σε
  choice: わたしがあなたを愛したこと
  rationale: 明示された主語ἐγώを「わたしが」で保持し、アオリストを「愛した」として過去の行為の形で表した。
theological_decisions:
- issue: 「自分たちをユダヤ人だと言っているが、そうではない」の意味
  choice: 原文どおり、彼らの主張に対する鋭い否定として訳し、その否定が民族的身分を指すのか契約上の真実性を指すのかは本文で決めない。
  alternative: 霊的な意味でのユダヤ人だけを真のユダヤ人とする説明、または彼らの民族的ユダヤ性そのものを明示的に否定する訳。
  rationale: 本文には神学的・論争的な緊張があるが、その対象や範囲を翻訳で拡張すると、原文以上の反ユダヤ的主張や特定の教理を持ち込むおそれがある。
- issue: 信徒の足もとでの προσκυνέω の力
  choice: 本文では「ひれ伏す」とし、敬意・服従を示す動作として表す。
  alternative: 「礼拝する」。
  rationale: この動詞には礼拝と平伏の両義がある。行為の場所が「あなたの足もと」であるため、「礼拝する」だけでは信徒が神的礼拝を受けるとの誤解を招き得る。一方、語の曖昧さは脚注に残した。
- issue: 「わたしがあなたを愛した」の時制的含み
  choice: アオリストを「愛した」と訳す。
  alternative: 「愛している」。
  rationale: 継続的な愛を否定する意図はないが、翻訳では原文の過去形的な形を尊重し、現在形へ解釈的に置き換えなかった。
translation_notes:
  register: 明快な現代標準日本語を基本としつつ、黙示録の宣言的な調子を保つため、ἰδοὺは「見よ」とした。「サタンの会堂」という強い比喩は弱めず、その一方で原文にない反ユダヤ的説明は加えていない。
