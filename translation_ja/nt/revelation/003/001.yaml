id: REV.3.1
reference: Revelation 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: ja
  text: 「サルディスにある教会の天使[a]にこう書きなさい。『神の七つの霊[b]と七つの星を持つ方が、こう言われる。わたしはあなたの行いを知っている。あなたは生きているという評判がある[c]が、死んでいる。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天使」は「使者」とも訳せる。ギリシア語ἄγγελοςには両方の意味があるが、黙示録の文脈では「天使」が自然である。
    reason: alternative_reading
  - marker: b
    text: 「神の七つの霊」は原文の複数形を保った。聖霊の完全な満ち満ちた働きを象徴すると見る解釈も、七つの天的な霊を指すと見る解釈もある。
    reason: alternative_reading
  - marker: c
    text: 直訳すると「あなたは、生きているという名を持っている」。ここで「名を持つ」は、そういう評判があることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 天使
  rationale: 黙示録の終末論的・象徴的文脈と七教会への反復的な呼びかけに合う語義を本文に採用した。「使者」も語彙上可能なので脚注に残した。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: サルディスのキリスト者共同体を指す文脈で、現代日本語として定着した自然な訳語。
- source_word: Τάδε λέγει
  choice: こう言われる
  rationale: 預言者的な告知定型を、威厳を保ちつつ現代日本語で自然に表した。
- source_word: ὁ ἔχων
  choice: 持つ方
  rationale: 定冠詞付き現在分詞の実体詞的用法を簡潔に表し、継続的な所有の意味を保った。
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: 神の七つの霊
  rationale: 複数形をそのまま保ち、聖霊の完全性または七つの天的霊という解釈のいずれにも本文で決着をつけない。
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: 七つの星
  rationale: 象徴の解釈をここへ補わず、原文を直接的に訳した。
- source_word: Οἶδά
  choice: 知っている
  rationale: 七教会への評価で繰り返される表現として、簡潔で自然な訳語を用いた。
- source_word: τὰ ἔργα
  choice: あなたの行い
  rationale: 「業」より一般読者に明瞭でありながら、行為・働きという意味を保つ。
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: あなたは生きているとの評判がある
  rationale: 直訳的な「生きているという名を持つ」が表す公的評価を、明瞭な現代日本語で伝えた。字義的表現は脚注に示した。
- source_word: νεκρὸς εἶ
  choice: 実は死んでいる
  rationale: 生きているとの評判との鋭い対比を保ち、「実は」で逆接の含意を自然に明示した。
theological_decisions:
- issue: 「神の七つの霊」の意味
  choice: 本文では「神の七つの霊」と複数形のまま訳す。
  alternative: 神の霊の完全な満ち満ちた働きを象徴する表現、または神の前にいる七つの天的な霊と解する。
  rationale: ギリシア語の複数形と黙示文学的な曖昧さを保ち、本文で聖霊論上の解釈を一つに限定しないため。
- issue: 教会の「天使」の指示対象
  choice: 本文では「天使」と訳す。
  alternative: 使者、または教会を代表する人間と解する。
  rationale: ἄγγελοςの通常の語義と黙示録の文脈に適するが、指示対象には議論があるため、別訳を脚注に残した。
- issue: 「死んでいる」という評価
  choice: 霊的・共同体的評価を説明で限定せず、「死んでいる」と直接訳す。
  alternative: 活力がない、霊的に死んでいる、と解釈的に言い換える。
  rationale: 原文の強い比喩的断定を弱めず、その具体的な神学的射程を翻訳で狭めないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神の発言にふさわしい簡潔で荘重な調子を保った。書簡命令は「書き送れ」、宣告定型は「こう言われる」とし、過度に古風な文語は避けた。
