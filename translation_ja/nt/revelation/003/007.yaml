language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: ja
  text: 'フィラデルフィアにある教会の天使[a]に書きなさい。


    「聖なる方、真実な方、ダビデの鍵[b]を持つ方、開けばだれも閉じることはなく、閉じればだれも開くことはない方が、こう言われる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天使」は「使者」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 「ダビデの鍵」は、王的な権威による開閉を描くイザヤ書22章22節を踏まえた表現と思われる。
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 御使い
  rationale: 天的存在を指す伝統的で自然な訳を本文に採った。ただし語自体には人間の「使者」の意味もあるため、解釈を固定しすぎないよう脚注に別訳を示した。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: ここではフィラデルフィアのキリスト者共同体を指すため、現代日本語で最も明瞭な「教会」とした。
- source_word: Τάδε λέγει
  choice: こう言われる
  rationale: 預言者的な告知の荘重さを保ちつつ、日本語として自然な定型表現にした。
- source_word: ὁ ἅγιος
  choice: 聖なる方
  rationale: 冠詞を伴う形容詞の名詞的用法を、話者の称号として表した。
- source_word: ὁ ἀληθινός
  choice: 真実な方
  rationale: 「偽りのない」と「真に実在する・真正な」の両方に開かれた語義を、過度に限定せず表せる訳とした。
- source_word: τὴν κλεῖν Δαυίδ
  choice: ダビデの鍵
  rationale: イザヤ書22章22節を想起させる王権的な比喩を、説明的に言い換えず保持した。
- source_word: ὁ ἀνοίγων καὶ οὐδεὶς κλείσει
  choice: 開けばだれも閉じることはなく
  rationale: 分詞と未来形の組み合わせが示す確実な結果を、日本語の条件表現で自然に示した。能力を表す語を明示的に補わず、原文の簡潔さを保った。
- source_word: καὶ κλείων καὶ οὐδεὶς ἀνοίγει
  choice: 閉じればだれも開くことはない
  rationale: 前半と対になる構造を明瞭に保ち、現在形の一般的・確定的な響きを日本語で表した。
theological_decisions:
- issue: ὁ ἅγιος、ὁ ἀληθινόςというキリスト論的称号
  choice: 復活したキリストを指す称号として「聖なる方、真実な方」と訳した。
  alternative: 「聖く、真実な者」のように一般的な形容表現とする。
  rationale: 冠詞付き形容詞の名詞的用法と、七つの教会への告知における話者の荘重な自己提示を反映する。本文を越えて称号の教理的内容を展開しない。
- issue: 「ダビデの鍵」の含意
  choice: 王的権威を示すと思われる比喩を、そのまま「ダビデの鍵」と保持した。
  alternative: 「ダビデの王国を治める権威」などと説明的に言い換える。
  rationale: イザヤ書22章22節への暗示は強いが、本文の比喩を解釈に置き換えず、参照関係は脚注で示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、語り手の称号と告知句には黙示文学にふさわしい荘重さを保った。「書き送れ」は単なる筆記以上に宛先への伝達を自然に含む。「方」を反復して原文の称号の連鎖を明確にした。
