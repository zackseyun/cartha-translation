id: REV.3.4
reference: Revelation 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: ja
  text: しかし、サルディスには、自分の衣を汚さなかった者が、わずかながらいる[a]。彼らは白い衣を着て[b]、わたしと共に歩む。彼らはふさわしい者だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「わずかな名がある」。ここで「名」は人を指す。
    reason: lexical_alternative
  - marker: b
    text: 原文は簡潔に「白いものの中で」と述べる。直前の文脈から、白い衣を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前節までのサルディスへの叱責と、この節に残された忠実な者たちとを明確に対比する、自然で簡潔な逆接表現。
- source_word: ἔχεις ὀλίγα ὀνόματα ἐν Σάρδεσιν
  choice: サルディスには……者が、わずかながらいる
  rationale: ὀνόματα は直訳すれば「名」だが、ここでは明らかに人々を指す換喩。日本語で「わずかな名がある」とすると不自然で意味も取りにくいため、人を指すことを本文で明示し、原文の「名」は脚注に残す。二人称単数の ἔχεις は教会への直接的な語りかけだが、日本語では所在構文が最も自然。
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: 自分の衣を汚さなかった
  rationale: μολύνω の汚れ・汚染の比喩と衣服の象徴性を保つ。「衣」は黙示録の格調に合い、「服」より象徴的文脈を自然に支える。
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: わたしと共に歩む
  rationale: 未来の約束を表すと同時に、同行と交わりの像を保つ。日本語の非過去形「歩む」はこの約束の文脈で未来を自然に表せる。
- source_word: ἐν λευκοῖς
  choice: 白い衣を着て
  rationale: λευκοῖς は形容詞のみの簡潔な表現で、直前の衣の言及から白い衣服が省略されていると理解される。日本語では「白いものの中で」や「白く」では不明瞭なため、省略語を補った。
- source_word: ὅτι ἄξιοί εἰσιν
  choice: 彼らはそれにふさわしい者だからである
  rationale: ὅτι の理由関係を明示し、ἄξιος の価値・適格性を「ふさわしい」で表す。「それに」は直前の、白い衣を着てキリストと共に歩む約束を受ける。
theological_decisions:
- issue: ὀλίγα ὀνόματα を文字どおり「わずかな名」とするか、人々を指す換喩として訳すか
  choice: 本文では「者が、わずかながらいる」と自然に訳し、原文の「名」を脚注で示す
  alternative: 「わずかな名がある」
  rationale: 原文の換喩は注記に値するが、日本語で直訳すると人物を指す意味が著しく不透明になる。個々人が認識されているという含みを脚注によって保持する。
- issue: ἐν λευκοῖς の省略を本文で補うか
  choice: 「白い衣を着て」と補う
  alternative: 「白いものを着て」または「白く」
  rationale: 直前の τὰ ἱμάτια により衣服の省略が強く示される。補足は新たな神学的解釈ではなく、日本語で同じ衣の像を明瞭に再現するためのもの。
- issue: ἄξιοί εἰσιν が功績による救いを意味するかどうかを訳文で説明するか
  choice: 「ふさわしい者」と率直に訳し、教理的説明を加えない
  alternative: 「資格がある」または恩恵を強調する説明を補う
  rationale: 本文は彼らの忠実さと約束との関係でふさわしさを述べる。より広い救済論を訳文に持ち込まず、原文の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、黙示録の象徴的で荘重な調子を保った。「衣」「共に歩む」「ふさわしい者」は格調を損なわず、一般読者にも理解できる表現。
