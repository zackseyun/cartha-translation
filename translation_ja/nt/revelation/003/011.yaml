  text: ἔρχομαι ταχύ· κράτει ὃ ἔχεις, ἵνα μηδεὶς λάβῃ τὸν στέφανόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: ja
  text: わたしはすぐに来る[a]。あなたが持っているものをしっかりと保ちなさい。だれにもあなたの冠[b]を奪われないように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「速やかに」。ギリシア語の副詞は、時間的な近さにも、行動の速さにも重点を置くことができる。
    reason: alternative_reading
  - marker: b
    text: ここで「冠」と訳したギリシア語は、勝利や栄誉のしるしとして授けられる冠を指し、特に王の王冠を意味する語ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: わたしは来る
  rationale: 現在形だが、文脈上は差し迫った将来の到来を表す。日本語では「来る」が約束と警告の直接性を自然に保つ。
- source_word: ταχύ
  choice: すぐに
  rationale: 時間的な近さを表す「すぐに」を本文に採った。ただし、行動の速さを表す「速やかに」の可能性もあるため脚注に示した。
- source_word: κράτει
  choice: しっかり守りなさい
  rationale: κρατέω の命令形が表す、固く保持し続けるようにとの勧告を、現代日本語で明確に伝える。
- source_word: ὃ ἔχεις
  choice: あなたが持っているもの
  rationale: 何を指すかを原文同様に特定せず、文脈に委ねた。
- source_word: ἵνα μηδεὶς λάβῃ
  choice: だれにも…奪われないためである
  rationale: 望ましくない結果を防ぐ目的を自然な日本語で表した。「奪われる」は、他者が冠を取るという警告の力を保つ。
- source_word: τὸν στέφανόν σου
  choice: あなたの冠
  rationale: στέφανος は勝利や栄誉のしるしとして授けられる冠を指し得る。本文では簡潔で定着した「冠」とし、王の王冠に限定されない語義を脚注で説明した。
theological_decisions:
- issue: キリストの到来に関する ταχύ のニュアンス
  choice: すぐに
  alternative: 速やかに／素早く
  rationale: この副詞は到来の時間的近さにも、到来するときの迅速さにも重点を置き得る。本文では文脈に即して「すぐに」とし、別の可能性を脚注に残して曖昧さを保った。
- issue: 「冠」を取られることの意味
  choice: 比喩の内容を特定せず「あなたの冠」と訳す
  alternative: 報い、救い、勝利などと明示する
  rationale: 原文は στέφανος の比喩が具体的に何を意味するかをこの節で説明していないため、特定の教理的解釈を本文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」は話者であるキリストの直接的な発言として平仮名表記。「しっかり守りなさい」で命令の強さと継続的保持の含意を自然に表した。すべての脚注記号を本文に配置した。
