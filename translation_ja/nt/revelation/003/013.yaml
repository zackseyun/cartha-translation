  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: ja
  text: 耳のある者は、聖霊が諸教会に語ることを聞きなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 耳のある者
  rationale: 冠詞付き現在分詞と単数形の「耳」を、日本語で自然かつ格調ある定型表現として訳した。聞く能力だけでなく、注意して受け止めるよう促す格言的な力を保つ。
- source_word: ἀκουσάτω
  choice: 聞きなさい
  rationale: 三人称単数アオリスト命令形。日本語では直接的な命令表現にすることで、単なる聴覚ではなく、耳を傾けて応答するよう求める力を表した。
- source_word: τί
  choice: こと
  rationale: 御霊が語る内容を受ける関係表現として、「御霊が…語ること」と自然な現代日本語にした。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 黙示録の反復される勧告句では聖霊を指すと考えられる。「御霊」は人格的な神の霊を指す、簡潔で敬意ある聖書語として用いた。
- source_word: λέγει
  choice: 語る
  rationale: 現在形の発話を簡潔に表す。「言っている」と進行性を強調せず、諸教会への宣言という文脈に合う「語る」を選んだ。
- source_word: ταῖς ἐκκλησίαις
  choice: 諸教会に
  rationale: 与格の受け手を「に」で示した。複数形は「諸教会」とし、黙示録2～3章の各教会だけでなく複数の教会への呼びかけであることを保った。
theological_decisions:
- issue: 「御霊」の指示対象
  choice: 諸教会に語る聖霊
  alternative: 人間の霊、または非人格的な預言の霊
  rationale: 黙示録の七つの教会への手紙で繰り返される定型句において、定冠詞付きの「御霊」は、預言の言葉を通して諸教会に語る聖霊を指すのが最も自然である。特定教派の教理を付加せず、文脈上の指示対象を訳語に反映した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録で反復される厳粛な勧告としての格調を保った。「耳のある者」は広く理解できる慣用的な聖書表現。「御霊」はやや聖書的な語だが、指示対象を明確にし、文体上の尊厳を保つため採用した。脚注記号[a]は本文中に明示した。
