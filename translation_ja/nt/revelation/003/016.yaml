  text: οὕτως, ὅτι χλιαρὸς εἶ καὶ ⸀οὔτε ζεστὸς οὔτε ψυχρός, μέλλω σε ἐμέσαι ἐκ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: ja
  text: だから、熱くも冷たくもなく、生ぬるいあなたを、わたしは口から吐き出そうとしている。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「吐き出す」と訳したギリシア語は、より直接的には「嘔吐する」の意であり、「つばを吐く」よりも強い表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: そういうわけで
  rationale: 前節を受けて結論・帰結を導く働きを、現代日本語で自然に示す。
- source_word: ὅτι
  choice: ので
  rationale: 続く状態が、告げられる裁きの理由であることを明確に表す。
- source_word: χλιαρός
  choice: 生ぬるい
  rationale: 温度の比喩を保ちつつ、現代日本語で自然かつ否定的な響きも伝える。
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: 熱くも冷たくもない
  rationale: 対になった温度の対比を解釈で狭めず、そのまま明瞭に表す。
- source_word: μέλλω
  choice: しようとしている
  rationale: 単なる未来ではなく、行為が差し迫っているという含みを保持する。
- source_word: ἐμέσαι
  choice: 吐き出す
  rationale: 嘔吐を表す強い語の身体的で衝撃的な比喩を、婉曲化せず自然な日本語で伝える。
- source_word: ἐκ τοῦ στόματός μου
  choice: わたしの口から
  rationale: 口から外へ排出するという鮮烈な像を保つ。本文では目的語との自然な語順により「あなたを口から」とした。
theological_decisions:
- issue: ἐμέσαι が表す裁きの比喩の強さ
  choice: 「吐き出す」とし、嘔吐の強いイメージを保持する。
  alternative: 「つばとともに吐き出す」「退ける」など、弱めた表現にする。
  rationale: 原文は神による拒絶を意図的に衝撃の強い身体的比喩で語っているため、その修辞的・神学的緊張を和らげない。
- issue: μέλλω の時間的ニュアンス
  choice: 「吐き出そうとしている」として、差し迫った行為を表す。
  alternative: 「吐き出す」「吐き出すだろう」と一般的な未来として訳す。
  rationale: 原文にある切迫性を保ち、警告の緊張感を平板化しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の厳粛な警告と生々しい比喩を保持した。「そういうわけで」と「ので」が近接するが、それぞれ οὕτως の帰結提示と ὅτι の理由提示を担い、原文の論理関係を残している。
