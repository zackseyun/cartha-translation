  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: ja
  text: 耳のある者は、聖霊[a]が諸教会に語ることを聞きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その霊」。ここでは聖霊を指すと理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 耳のある者
  rationale: 冠詞付き現在分詞と単数形の「耳」を、日本語で自然かつ格調ある定型表現として訳した。個々の聞き手への代表的な呼びかけを保っている。
- source_word: ἀκουσάτω
  choice: 聞きなさい
  rationale: 三人称単数アオリスト命令形の勧告・命令の力を、現代日本語で明瞭な命令表現にした。単なる可能や助言には弱めていない。
- source_word: τί
  choice: こと
  rationale: 御霊が語る内容を受ける間接疑問の構造を、「語ること」と自然に表した。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 黙示録2–3章の反復句では聖霊を指すと理解されるため、神の霊を表す日本語として「御霊」を用いた。ただし原文自体は定冠詞付きの「霊」であるため脚注で明示した。
- source_word: λέγει
  choice: 語る
  rationale: 現在形の直接的な発話を、定型句にふさわしい自然な日本語で表した。
- source_word: ταῖς ἐκκλησίαις
  choice: 諸教会に
  rationale: 複数形と与格の受け手を簡潔に保持した。「諸教会」は黙示録2–3章で宛てられた複数の共同体を明確に示す。
theological_decisions:
- issue: 単数の代表的呼びかけ
  choice: 耳のある者は……聞きなさい
  alternative: 耳のある人はだれでも……聞きなさい
  rationale: 原文の単数形の構造を保ちながら、日本語では性別を不必要に補わず、すべての聞き手に及ぶ代表的表現とした。
- issue: τὸ πνεῦμα の指示対象
  choice: 御霊
  alternative: 霊
  rationale: 七つの教会への反復される勧告の文脈では聖霊が指示対象と理解される。一方、原語の語形そのものは「聖」を明記しないため、その点を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示録の反復的で荘重な勧告としての響きを保った。「耳のある者」は原文の単数形と慣用的な呼びかけを両立させる。脚注記号は該当する文の末尾に配置した。
