id: REV.3.8
reference: Revelation 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: ja
  text: わたしは、あなたの行いを知っている。見よ、わたしはあなたの前に、開かれたままの扉[a]を置いた。だれもそれを閉じることはできない。あなたにはわずかな力しかなく、わたしのことばを守り、わたしの名を否認しなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「開かれている扉」。ギリシア語は、その扉が開かれ、今もその状態にあることを示す。
    reason: 原文の完了受動分詞が表す、開かれた結果状態を説明するため。
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: わたしは、あなたの行いを知っている
  rationale: οἶδαは形態上は完了形だが現在の意味を持つため、「知っている」とした。ἔργαは具体的な複数名詞だが、日本語では「行い」が集合的に自然であり、黙示録に繰り返される定型表現も保てる。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を促す談話標識の力を保ちつつ、聖書本文にふさわしい簡潔で格調ある現代語とした。
- source_word: δέδωκα ἐνώπιόν σου
  choice: あなたの前に…置いた
  rationale: δέδωκαの字義は「与えた」だが、扉を目的語とするこの構文では「前に置いた」が自然である。ギリシア語完了形の現在に及ぶ結果は、続く「開かれたまま」で文脈上明らかになる。
- source_word: θύραν ἠνεῳγμένην
  choice: 開かれたままの扉
  rationale: 完了受動分詞が示す「開かれ、その状態にある」という結果状態を、日本語として自然に表した。単なる「開いた扉」よりも、開かれた状態の継続を明示する。
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: だれもそれを閉じることはできない
  rationale: δύναταιの能力・可能の意味を明確に保ち、θύραとの自然な組み合わせとしてκλεῖσαιを「閉じる」と訳した。
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: あなたにはわずかな力しかないが、それでも
  rationale: ὅτιは節全体の理由を導く。「わずかな力しかない」は限定された力を表し、後続する忠実さとの譲歩的な関係を、日本語の文脈上自然な「が、それでも」で示した。
- source_word: ἐτήρησάς μου τὸν λόγον
  choice: わたしのことばを守り
  rationale: τηρέωが含む保持・遵守・忠実さの幅を「守る」で保ち、λόγοςも解釈的に狭めず「ことば」とした。
- source_word: οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: わたしの名を否まなかった
  rationale: ἀρνέομαιの「否認する、拒む」を「否む」で表し、「名」が担う人格・権威・帰属の含意を説明的に言い換えず保持した。
theological_decisions:
- issue: 「開かれた扉」の比喩の意味
  choice: 「開かれたままの扉」と比喩をそのまま訳し、その指示内容を特定しない
  alternative: 宣教の機会、救いまたは御国への入口、一般的な摂理的機会と明示する
  rationale: この節自体は比喩を明示的に解説していないため、宣教、救い、保護などの一つに限定せず、原文の神学的な広がりを保った。
- issue: μικρὰν ἔχεις δύναμινと忠実さの関係
  choice: 「わずかな力しかないが、それでも…守り…否まなかった」とする
  alternative: 「わずかな力があり、また…守った」と並列的に訳す
  rationale: μικράνが限定的な「わずかな」を表すことと、後続する忠実な行動との対照を自然な日本語で示す。ただし、弱さを非難と断定する解釈は加えていない。
- issue: ギリシア語の完了形が示す現在的結果
  choice: 扉について「開かれたまま」として結果状態を明示し、教会の行為は自然な日本語の過去形で表す
  alternative: すべてを日本語の「〜してきた」「〜してある」で一律に表す
  rationale: 日本語には英語の現在完了に直接対応する統一形式がない。各動詞の文脈に応じて、現在への関連を自然に伝えた。
translation_notes:
  register: 明瞭な現代標準語を基調とし、「見よ」「否む」により黙示録の荘重さを適度に保った。「力」や「扉」の意味を教派的・解釈的に限定せず、原文の比喩と緊張を維持した。
