id: REV.3.14
reference: Revelation 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: ja
  text: 'また、ラオディキアにある教会の御使い[a]に書け。


    『アーメンである方、忠実で真実な証人、神の創造の初め[b]である方が、こう言われる。』'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「使者」。原語は天上の御使いにも、人間の使者にも用いられる。
    reason: lexical_alternative
  - marker: b
    text: または「神の創造の源（起源）」、あるいは「神の創造を治める方」。原語は「初め」「起源・源」「支配者」を意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 御使い
  rationale: 語義には天的な「御使い」と人間の「使者」の両方があり得るが、黙示録における七つの教会への定型的な呼びかけでは「御使い」が最も自然である。別の可能性は脚注に残した。
- source_word: Τάδε λέγει
  choice: こう言われる
  rationale: 預言的な告知の定型表現を、現代日本語として自然かつ荘重に表した。
- source_word: ὁ Ἀμήν
  choice: アーメンである方
  rationale: 「アーメン」をキリストの固有の称号として保ち、確かさと真実を示すヘブライ語由来の響きを失わないようにした。
- source_word: ὁ μάρτυς
  choice: 証人
  rationale: 証言する者という法廷的・啓示的な意味の双方を自然に保つ標準的な訳語である。
- source_word: πιστὸς καὶ ἀληθινός
  choice: 忠実で真実な
  rationale: πιστόςの信頼性・忠実さと、ἀληθινόςの真実性・真正さを区別しつつ、原文の並列を保った。
- source_word: ἡ ἀρχὴ
  choice: 初め
  rationale: ἀρχήの最も直接的な訳であり、「初め」「起源・源」「支配者」という意味上・神学上の緊張を本文で一方に限定しない。
- source_word: τῆς κτίσεως τοῦ θεοῦ
  choice: 神の創造の
  rationale: κτίσιςを「創造」とし、属格構文を簡潔に保った。「被造物」と断定せず、創造の行為または創造された秩序を含み得る表現とした。
theological_decisions:
- issue: キリストの称号「ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ」の解釈
  choice: 神の創造の初め
  alternative: 神の創造の源／起源、または神の創造を治める方
  rationale: ἀρχήは「初め」のほか「起源・源」や「支配者」を表し得る。論争のあるキリスト論的含意を本文で解消せず、最も直接的な訳を採用し、他の有力な理解を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、教会への命令とキリストの自己紹介にふさわしい荘重さを保った。「御使い」「アーメン」は聖書的な定着語として用い、解釈上の曖昧さは脚注で明示した。
