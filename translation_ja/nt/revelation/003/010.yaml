id: REV.3.10
reference: Revelation 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: ja
  text: あなたが、わたしの忍耐のことば[a]を守ったので、わたしも、人の住む全世界に臨もうとしている試練の時から、あなたを守る[b]。それは、地上に住む者たちを試すためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの忍耐についてのことば」または「忍耐を求めるわたしのことば」。ギリシア語の表現は、互いに近いこれらの意味に理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「試練の時を通して、あなたを守る」または「試練の時を免れさせる」と理解することもできる。ギリシア語は「～から守る」といい、その保護がどのようになされるかについて、それ自体で後代の神学的論争を決着させるものではない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: 守った
  rationale: τηρέωの「守る、保つ、従う」という意味域を表し、後半のτηρήσω（守る）との語のつながりも保つ。
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: わたしの忍耐のことば
  rationale: 属格が示し得る「わたしの忍耐についてのことば」「忍耐を求めるわたしのことば」などの近接した意味を本文で一つに限定しない、簡潔で格調ある表現とした。
- source_word: κἀγώ
  choice: わたしも
  rationale: 相手が守ったことに応じて、キリストも守るという強調された対応関係を自然に表す。
- source_word: τηρήσω ἐκ
  choice: ……から、あなたを守る
  rationale: τηρέωとἐκの組み合わせを直接的に訳し、試練以前の除去、試練の中での保護、試練の作用からの免除のいずれかに意味を限定しない。
- source_word: ὥρας
  choice: 時
  rationale: 直訳の「時間」より自然でありつつ、限定された期間を指す黙示文学的用法を表す。
- source_word: πειρασμοῦ / πειράσαι
  choice: 試練／試す
  rationale: 試み、試練、誘惑を含み得る語だが、ここでは世界的な出来事とその目的を広く表せる「試練」「試す」が適切で、原文の語の連関も保てる。
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: 臨もうとしている
  rationale: μέλλω＋不定詞の将来性ないし切迫性を、現代日本語として自然に表す。
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: 人の住む全世界に
  rationale: οἰκουμένηが宇宙全体ではなく「人の住む世界」を指す語感を明示し、自然な日本語にした。
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: 地上に住む者たち
  rationale: 黙示録に繰り返される表現の動詞的な形と、その文学的響きを保つ。
theological_decisions:
- issue: 終末論的文脈におけるτηρήσω ἐκの意味
  choice: 試練の時から、あなたを守る
  alternative: 試練の時を通して守る／試練の時の外に保つ
  rationale: ギリシア語の構文を直接的に反映しつつ、約束が試練前の除去、試練を通しての保護、または試練の作用からの免除のどれを指すかという後代の論争を本文だけで決着させない。
- issue: τὸν λόγον τῆς ὑπομονῆς μουの属格の意味
  choice: わたしの忍耐のことば
  alternative: わたしの忍耐についてのことば／忍耐を求めるわたしのことば
  rationale: 原文の属格は複数の密接に関連する解釈を許すため、本文では曖昧さを保ち、脚注で主な可能性を示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、黙示録にふさわしい簡潔さと格調を保った。「人の住む全世界」「地上に住む者たち」により、οἰκουμένηとγῆの表現上の違いも示した。
