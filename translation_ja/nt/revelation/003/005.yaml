  to: 勝利を得る者は、このように白い衣を身にまとう[a]。わたしは、その名をいのちの書から決して消さない[b][c]。そして、わたしの父の前で、またその御使いたちの前で、その名を公に認める[d]。
  rationale: 中動態περιβαλεῖταιの意味をより直接に反映して「白い衣を身にまとう」とした。また、原文で反復されるἐνώπιονを「わたしの父の前で、またその御使いたちの前で」と訳し、父とその御使いたちへの言及の関係を明確にした。その他の訳語と脚注は原文および英語監査記録に照らして維持できる。
