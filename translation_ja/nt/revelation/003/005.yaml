id: REV.3.5
reference: Revelation 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: ja
  text: 勝利を得る者は、このように白い衣を身にまとう[a]。わたしは、その名をいのちの書から決して消さない[b][c]。そして、わたしの父の前で、またその御使いたちの前で、その名を公に認める[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「打ち勝つ者」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その名をいのちの書から絶対にぬぐい去らない」。ギリシア語は強い否定を用いている。
    reason: lexical_alternative
  - marker: c
    text: 「いのちの書」とは、神に属し、いのちを受け継ぐ者たちの名が記された天上の登録簿を指す。
    reason: cultural_note
  - marker: d
    text: 別訳「その名を言い表す」。マタイ10章32節参照。
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: 勝利を得る者
  rationale: 黙示録に繰り返される勝利の主題を保ちつつ、名詞的な現在分詞の継続的・特徴的な意味を自然な現代日本語で表す。
- source_word: οὕτως
  choice: このように
  rationale: 直前の約束・描写との対応を示す語を省略せず、自然に接続する。
- source_word: περιβαλεῖται ἐν ἱματίοις λευκοῖς
  choice: 白い衣を着せられる
  rationale: 未来の中動・受動形を結果的な受動表現として訳し、ἱμάτιαを過度に特定的な「長い衣」とせず「衣」とした。
- source_word: οὐ μὴ ἐξαλείψω
  choice: 決して消さない
  rationale: οὐ μήと未来形による強い否定を「決して」で明示し、書の記録という比喩に合う平明な「消す」を用いた。
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: いのちの書から
  rationale: 聖書で定着した表現を用い、天上の登録簿という比喩を保持する。
- source_word: ὁμολογήσω τὸ ὄνομα αὐτοῦ
  choice: その名を公に認める
  rationale: ὁμολογέωの公然と認め、言い表す意味を示す。「告白する」では日本語で罪の告白と誤解されやすいため、文脈に即して訳した。
- source_word: ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ
  choice: わたしの父と父の御使いたちの前で
  rationale: 二度のἐνώπιονを日本語では一つにまとめて自然に表し、αὐτοῦの最も近い先行詞が「わたしの父」であることを明確にした。
theological_decisions:
- issue: いのちの書から名を消さないという約束と、聖徒の堅忍・背教をめぐる含意
  choice: 勝利を得る者への強い保証としてそのまま訳し、より広い教理上の結論は本文に加えない。
  alternative: 真の信者は必ず最後まで堅忍するという保証、または救いを失いうることを示す警告として明示する。
  rationale: この節は約束を強く述べるが、それだけで論争全体を一義的に決着させる表現ではないため、神学的緊張を保持する。
- issue: 男性単数形の代表的用法
  choice: 日本語では性を明示しない「その名」を用いる。
  alternative: 「彼の名」としてギリシア語の男性単数形を形式的に示す。
  rationale: 日本語の「その名」は単数の指示を保ち、性別を限定せず代表的・一般的用法を自然に伝えられる。原文の指示対象や数を変えてはいない。
translation_notes:
  register: 明瞭な現代標準語を基調にしながら、黙示文学の荘重さを保つため「白い衣」「御使い」を採用した。三つの未来の約束を短い文に分け、朗読時にも理解しやすくした。
