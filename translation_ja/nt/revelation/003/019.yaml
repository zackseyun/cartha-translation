id: REV.3.19
reference: Revelation 3:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ ὅσους ἐὰν φιλῶ ἐλέγχω καὶ παιδεύω· ⸀ζήλευε οὖν καὶ μετανόησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: ja
  text: わたしは、愛する者をみな、叱り、鍛える[a]。だから、熱心になり[b]、悔い改めなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「鍛える」は、単に罰することではなく、正すために訓練することを含む。
    reason: cultural_note
  - marker: b
    text: 別訳「真剣になりなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: わたしは
  rationale: 明示された代名詞の強調を保ちつつ、現代日本語として不自然に重くならない形にした。
- source_word: ὅσους ἐὰν
  choice: …者をみな
  rationale: 不定関係表現が持つ「わたしが愛する者はだれであれ／すべて」という包括性を簡潔に表す。
- source_word: φιλῶ
  choice: 愛する
  rationale: 親愛を表す語だが、ここでは弱めず、自然で十分な重みのある「愛する」とした。
- source_word: ἐλέγχω
  choice: 叱る
  rationale: 過ちを指摘して改めさせる文脈上の意味を、一般読者に明瞭な現代語で表した。
- source_word: παιδεύω
  choice: 鍛える
  rationale: 単なる処罰ではなく、矯正し育てる働きを含むため、「懲らしめる」より形成的な含みを保つ「鍛える」とした。
- source_word: ζήλευε
  choice: 熱心になって
  rationale: 継続を示し得る現在命令の熱意・真剣さを、自然な日本語で表した。
- source_word: οὖν
  choice: だから
  rationale: 愛に基づく叱責と訓練を受けて応答すべきだという推論関係を、明瞭な現代語で示す。
- source_word: μετανόησον
  choice: 悔い改めなさい
  rationale: 道徳的・霊的な方向転換を指す定着した明瞭な訳語であり、アオリスト命令の決断を促す力も伝える。
theological_decisions:
- issue: φιλῶが表す愛と矯正との関係
  choice: 「愛する」と訳し、叱責と訓練の根拠が真正な愛であることを保った。
  alternative: 「好意を持つ」「かわいがる」
  rationale: 愛の語を弱めず、またφιλέωとἀγαπάωの間に本文が要求しない神学的区別を持ち込まないため。
- issue: παιδεύωの性質
  choice: 「鍛える」とし、矯正と育成の両面を表した。
  alternative: 「懲らしめる」「罰する」「教える」
  rationale: 処罰だけにも、単なる教育だけにも限定せず、是正を伴う形成という語の幅を保つため。
translation_notes:
  register: 明瞭で現代的かつ尊厳ある命令調を用いた。「叱り、鍛える」は二つの動作を区別しつつ、愛に基づく矯正という文脈を保つ。主語のἐγώは「わたしは」で示したが、過度に説明的な強調表現は避けた。
