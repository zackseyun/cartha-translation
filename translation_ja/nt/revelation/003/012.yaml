id: REV.3.12
reference: Revelation 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: ja
  text: 勝利を得る者[a]を、わたしはわたしの神の神殿の柱とする。その者は、もはや決してそこから出ることはない[b]。また、わたしはその者の上に、わたしの神の名と、わたしの神の都、すなわち新しいエルサレム、天からわたしの神のもとより下って来る都の名と、わたし自身の新しい名[c]を書き記す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「打ち勝つ者」とも訳せる。ギリシア語の動詞は、黙示録で忠実に勝利することを表す語として繰り返し用いられる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は強い否定で、「もはや決して出ることはない」という確実さを強調している。
    reason: lexical_alternative
  - marker: c
    text: 直訳的には「わたしの新しい名」。ギリシア語の語順と冠詞の反復には強調がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: 勝利を得る者
  rationale: 現在分詞の名詞的用法と、黙示録に繰り返される勝利の主題を保つ。「勝者」よりも、忠実に勝利を得るという動的な含みが伝わる。
- source_word: ποιήσω αὐτὸν στῦλον
  choice: その者を……柱とする
  rationale: ποιέωと述語的対格στῦλονの構文を自然な日本語で表し、永続性と誉れを示す建築的比喩をそのまま残す。
- source_word: ἐν τῷ ναῷ τοῦ θεοῦ μου
  choice: わたしの神の神殿の
  rationale: ναόςが指す神殿・聖所の意味を「神殿」で明確にし、「わたしの神」という明示的な表現も保つ。日本語では「神殿の柱」とすることで位置関係を自然に示す。
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: もはや決してそこから出ることはない
  rationale: οὐ μήによる強い否定とἔτιの「もはや」をともに表す。「そこから」は直前の神殿を受ける補足である。
- source_word: γράψω ἐπ’ αὐτὸν
  choice: その者の上に……を書き記す
  rationale: ἐπίの表面的な位置関係と、γράφωの刻印を含み得る語感を、明瞭で格調ある表現にした。
- source_word: τῆς καινῆς Ἰερουσαλήμ
  choice: 新しいエルサレム
  rationale: 冠詞を伴う形容詞と固有名詞の組み合わせを、日本語で自然に保つ。
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: 天から、わたしの神のもとより下って来る
  rationale: 現在分詞の継続的・描写的な働きを「下って来る」で表し、ἐκとἀπόが示す天からの起点と神からの源をどちらも省かない。
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: わたし自身の新しい名
  rationale: 冠詞を繰り返した強調を「自身」で表しつつ、その名の内容について推測を加えない。
theological_decisions:
- issue: 男性単数形による約束の対象
  choice: 「者」「その者」と訳す
  alternative: 「彼」または複数形で訳す
  rationale: ギリシア語の単数の代表的用法を保ちながら、日本語では性別を不必要に限定せず、個々の勝利する者への約束として自然に表せる。
- issue: 高く上げられたイエスの発言における「わたしの神」の反復
  choice: 原文どおり四回すべて保つ
  alternative: 文体上の重複を避けて一部を省略する
  rationale: τοῦ θεοῦ μουの反復は明示的で神学的にも重要であるため、滑らかさのために弱めず、本文の緊張をそのまま残す。
- issue: 最後の名に関する表現
  choice: 「わたし自身の新しい名」
  alternative: 「わたしの新しい名」
  rationale: τὸ ὄνομά μου τὸ καινόνの強調を反映しつつ、新しい名の内容や意味を解釈によって限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、約束の宣言にふさわしい簡潔で荘重な調子を保った。「神殿の柱」「名を書き記す」などの象徴表現は説明的に言い換えず、そのまま提示した。
