id: REV.3.2
reference: Revelation 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: ja
  text: 目を覚ましていなさい。そして、今にも死にそうな残りのものを力づけなさい。私は、あなたの行いが私の神の前で全うされているとは認めていない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: 目を覚ましていなさい
  rationale: γίνου と現在分詞の組み合わせは、警戒して目覚めた状態になること、またそれを保つことを促す。文脈上の比喩を自然な現代日本語で表した。
- source_word: στήρισον
  choice: 力づけなさい
  rationale: 残っているものを堅固にし、衰えないよう支えるという意味を表す。
- source_word: τὰ λοιπὰ
  choice: 残りのもの
  rationale: 文法上は中性複数であり、人々、行い、霊的な実質などを明示的に限定しない原文の曖昧さを保った。
- source_word: ἃ ἔμελλον ἀποθανεῖν
  choice: 今にも死にそうな
  rationale: μέλλω と不定詞が示す差し迫った死の状態を簡潔に表した。複数の先行詞を日本語では集合的に受ける。
- source_word: πεπληρωμένα
  choice: 全うされた
  rationale: 完了受動分詞が示す、行いが十分に満たされ完成した状態を表す。単なる数量的な『完了』より、神の前で要求を満たす含意に適する。
- source_word: εὕρηκά
  choice: 認めなかった
  rationale: 『見いだす』という審査・評価の用法を自然な日本語にした。完了形による現在に至る判断も文脈上保たれる。
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: 私の神の前で
  rationale: 原文の関係表現と、神の御前での評価という法廷的・礼拝的響きをそのまま保った。
theological_decisions:
- issue: 『残りのもの』の指示対象
  choice: 対象を特定せず『残りのもの』とした
  alternative: 『残っている人々』または『残っている信仰』
  rationale: τὰ λοιπὰ は中性複数で、本文だけでは具体的指示対象を一つに確定できないため、解釈を訳文に持ち込まない。
- issue: 『行い』の未完成性
  choice: 『全うされたとは認めなかった』
  alternative: 『完全であるとは認めなかった』
  rationale: πεπληρωμένα は満たされ完成していることを表すが、絶対的な道徳的無欠性を意味すると断定せず、行いが神の要求を満たしていないという緊張を保つ。
translation_notes:
  register: 命令の切迫感を保ちながら、明瞭で格調ある現代標準日本語とした。『目を覚ましていなさい』は瞬間的覚醒だけでなく継続的警戒も含む。原文で不明確な『残りのもの』の内容は補足せず、その曖昧さを保持した。
