revisions:
- from: あなたは、『私は富んでいる。豊かになった。何一つ必要なものはない』と言っている。だが、自分こそ惨めで、哀れで、貧しく、目が見えず、裸であることを知らない。
  to: なぜなら、あなたは『私は富んでおり、豊かになった。何一つ必要なものはない』と言っているが、あなた自身が惨めで、哀れで、貧しく、目が見えず、裸であることを知らない。
  rationale: 節頭のὅτιの因果的機能を「なぜなら」で訳出した。後半との対照は原文の並列接続καίを日本語として自然な「が」でつなぎ、σὺの強調は「あなた自身が」で保持した。比喩的な諸形容は説明的に限定せず、そのまま維持した。
