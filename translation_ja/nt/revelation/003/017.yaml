id: REV.3.17
reference: Revelation 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: ja
  text: なぜなら、あなたは『私は富んでおり、豊かになった。何一つ必要なものはない』と言っているが、あなた自身が惨めで、哀れで、貧しく、目が見えず、裸であることを知らない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: あなたは、…と言っている
  rationale: 冒頭のὅτιは直前の叱責の理由を示すが、単独節として自然な日本語にするため明示的な「なぜなら」は置かず、内容を導く第二のὅτιは直接引用で表した。
- source_word: Πλούσιός εἰμι
  choice: 私は富んでいる
  rationale: 物質的な富についての自己評価を、簡潔で自然な表現にした。
- source_word: πεπλούτηκα
  choice: 豊かになった
  rationale: 完了形が含む、富を得た結果として今も豊かであるという含意を保った。
- source_word: οὐδὲν χρείαν ἔχω
  choice: 何一つ必要なものはない
  rationale: οὐδένの全面的な否定とχρείαν ἔχωの意味を、明瞭な現代日本語で表した。
- source_word: οὐκ οἶδας
  choice: 知らない
  rationale: 認識していないことを指す動詞を、解釈的に「気づかない」とせず直接訳した。
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: 自分こそ惨めである
  rationale: 明示されたσὺと冠詞付きの形容詞による強い指摘を「自分こそ」で表し、不自然な「その惨めな者」とはしなかった。
- source_word: ἐλεεινός
  choice: 哀れで
  rationale: 他者の憐れみを要する状態を表し、ταλαίπωροςの「惨め」と区別した。
- source_word: πτωχός καὶ τυφλὸς καὶ γυμνός
  choice: 貧しく、目が見えず、裸である
  rationale: 富との反語的な対照を保ち、比喩を説明語で限定せず原文どおり並列した。
theological_decisions:
- issue: 富、貧しさ、盲目、裸を霊的状態と明示するか
  choice: 本文には「霊的に」などの説明を加えず、原文の具体的な語をそのまま保った。
  alternative: 「霊的には貧しく、盲目で、裸である」と解釈を明示する。
  rationale: 文脈上の比喩的・神学的含意は明らかでも、原文自体は限定語を置いていないため、その修辞的緊張を読者に残す。
- issue: ὁ ταλαίπωροςの冠詞とσὺの強調
  choice: 「自分こそ惨めで」と訳した。
  alternative: 「あなたは惨めで」または「あなたこそ、その惨めな者で」と訳す。
  rationale: 指摘の鋭さを保ちながら、現代日本語として不自然な名詞化を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。直接的な叱責と、富の自己評価に対する反語的な対照を維持した。節頭のὅτιは前節に従属するため、本節単独では日本語の流れを優先して接続語を補わなかった。
