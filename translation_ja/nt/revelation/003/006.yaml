id: REV.3.6
reference: Revelation 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/006.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: ja
  text: 耳のある者[a]は、聖霊が諸教会に言っていることを聞きなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「耳を持つ者は、聞きなさい」。単数形で表されているが、性別を問わず、聞く者すべてへの呼びかけである。
    reason: 原文の単数形による慣用的・一般的な勧告を説明するため。
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 耳のある者
  rationale: 単数形の「耳」を保ち、聞いて受け止める力のあるすべての人に向けた格言的な呼びかけとして訳した。現代日本語でも理解でき、原文にない「聞く耳」を補わない。
- source_word: ἀκουσάτω
  choice: 聞きなさい
  rationale: 三人称単数のアオリスト命令形が持つ勧告・命令の力を、自然な日本語の命令表現で示した。
- source_word: τί
  choice: こと
  rationale: 聖霊が語る内容を導く語として、日本語では「言っていること」とするのが自然である。
- source_word: τὸ πνεῦμα
  choice: 聖霊
  rationale: 黙示録2―3章で諸教会に語りかける「霊」は、文脈上、聖霊を指す可能性がきわめて高い。日本語には英語の大文字表記に相当する区別がないため、「聖霊」と明示した。
- source_word: λέγει
  choice: 言っている
  rationale: 現在形の継続的・特徴的な語りを自然に表し、単なる一回の発言に限定しない。
- source_word: ταῖς ἐκκλησίαις
  choice: 諸教会に
  rationale: 複数形を簡潔に示し、黙示録の七つの教会を含む教会共同体への呼びかけとして訳した。
theological_decisions:
- issue: 「霊」の指示対象
  choice: 聖霊
  alternative: 霊
  rationale: 定冠詞を伴う「霊」が諸教会に語るという黙示録2―3章の反復句では、聖霊を指すと読むのが最も自然である。ただし、原語そのものは「聖なる」という形容詞を明記していない。
- issue: 勧告の単数形が指す範囲
  choice: 耳のある者は……聞きなさい
  alternative: 耳のある人はだれでも……聞きなさい
  rationale: 原文の単数形を保ちながら、性別を限定せず、聞く者すべてに向けた一般的な勧告として表した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「耳のある者」という原文に近い格言的表現を残しつつ、命令形は自然な「聞きなさい」とした。
