id: REV.3.3
reference: Revelation 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: ja
  text: だから、あなたがどのように受け取り、聞いたかを思い起こし、それを守り、悔い改めなさい。[a] もし目を覚ましていなければ、私は盗人のように来る。[b][c] 私が何時にあなたに来るか、あなたには決して分からない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「どのように受け取り、聞いたか」は、「何を受け取り、聞いたか」という意味に理解することもできる。ギリシア語は「どのように」と記しており、受け入れた時のあり方を強調している可能性がある。
    reason: alternative_reading
  - marker: b
    text: 「目を覚ましている」は、「目を覚まして警戒する」または「見張っている」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「盗人のように来る」は、突然で予期できない訪れを語る他の箇所の表現と響き合う。この節だけでは、最終的な裁きを指すのか、より直接的な懲らしめを指すのかは特定されていない。
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: 思い起こし
  rationale: 現在命令形が示す継続的な想起を、現代日本語として自然な勧告にした。
- source_word: οὖν
  choice: だから
  rationale: 直前の叱責を受けた論理的帰結を、明瞭で自然な接続語で示す。
- source_word: πῶς
  choice: どのように
  rationale: 内容を表す「何を」に置き換えず、受け聞いたあり方を指し得る原文の副詞と曖昧さを保つ。
- source_word: εἴληφας καὶ ἤκουσας
  choice: 受け、聞いた
  rationale: 受領と聴聞という二つの動作を簡潔に保つ。日本語では完了形を機械的に補わず、文脈上の継続的意義は「思い起こす」「守る」によって伝える。
- source_word: τήρει
  choice: それを守り
  rationale: τηρέωが含み得る保持・遵守・見守りの幅を「守る」で保ち、「それ」は受け聞いたものを指す補語として補った。
- source_word: μετανόησον
  choice: 悔い改めなさい
  rationale: 罪から向きを変える新約聖書の勧告として、一般に理解される標準的な聖書語を用いた。
- source_word: γρηγορήσῃς
  choice: 目を覚ましていなければ
  rationale: 警戒を意味する比喩と、続く盗人の像とのつながりを保つ。「目を覚ましている」は平易でありながら字義的イメージも伝える。
- source_word: ἥξω ὡς κλέπτης
  choice: 私は盗人のように来る
  rationale: 突然で予期できない到来を示す直喩をそのまま保った。
- source_word: οὐ μὴ γνῷς
  choice: あなたには決して分からない
  rationale: οὐ μήによる強い否定を「決して…ない」で明確に表す。
- source_word: ποίαν ὥραν
  choice: 何時に
  rationale: 時刻の限定性を保ちつつ、現代日本語で自然な表現とした。
- source_word: ἐπὶ σέ
  choice: あなたのもとに
  rationale: 到来の向かう先を自然に示しつつ、裁きか訪れかを訳語だけで決めつけない。
theological_decisions:
- issue: πῶς εἴληφας καὶ ἤκουσας が想起させるもの
  choice: 「どのように受け、聞いたか」とし、受容の仕方を表す可能性を本文に残した。
  alternative: 「何を受け、聞いたか」として、受けた知らせの内容を指すと解する。
  rationale: 原文は πῶς（どのように）を用いるため、その形式を優先する。ただし文脈上、受け聞いた知らせそのものを機能的に指す理解も可能なので脚注に示した。
- issue: 「盗人のように来る」という警告の範囲
  choice: 予期されない到来という警告にとどめ、その出来事を特定しない。
  alternative: 終末における再臨、または歴史上の局地的な裁き・懲らしめに限定する。
  rationale: この節自体は到来の範囲を明示しないため、終末的裁きとより直接的な懲らしめのどちらかに固定せず、神学的緊張を保った。
translation_notes:
  register: 平易な現代標準語を基調としつつ、黙示録の厳粛な警告にふさわしい格調を保った。「盗人」「悔い改める」は聖書的文脈で広く理解される語として採用し、過度に古風な語順や文末は避けた。
