id: REV.3.21
reference: Revelation 3:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ νικῶν δώσω αὐτῷ καθίσαι μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου, ὡς κἀγὼ ἐνίκησα καὶ ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: ja
  text: 勝利を得る者[a][b]には、わたしと共にわたしの王座に座らせよう。わたしも勝利を得て、わたしの父と共に父の王座に座ったのと同じように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「勝利を得る」は「打ち勝つ」とも訳せる。同じギリシア語動詞がこの節で二度用いられている。
    reason: lexical_alternative
  - marker: b
    text: 「者」は、勝利を得る一人一人を代表して言う表現であり、約束は男性だけに限られない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν / ἐνίκησα
  choice: 勝利を得る者／勝利を得て
  rationale: 同じ動詞 νικάω が二度使われているため、「勝利を得る」を繰り返し、黙示録に一貫する勝利の主題と語の対応を保った。現在分詞 ὁ νικῶν は代表的な単数として「勝利を得る者」とした。
- source_word: δώσω αὐτῷ καθίσαι
  choice: その者には……着くことを許そう
  rationale: δίδωμι と不定詞の組み合わせは、ここでは座に着く特権を与える意味であるため、日本語では自然な「許そう」とした。αὐτῷ の指示対象は「その者には」に含まれる。
- source_word: καθίσαι / ἐκάθισα
  choice: 王座に着く／王座に着いた
  rationale: いずれも καθίζω の形であり、王座への着座という文脈を明確にするため「王座に着く」と訳した。前者は許される行為、後者は完了した出来事を表す。
- source_word: μετ’ ἐμοῦ / μετὰ τοῦ πατρός μου
  choice: わたしと共に／わたしの父と共に
  rationale: μετά の連帯・共在の意味を素直に表し、二つの表現の並行関係を保った。
- source_word: ἐν τῷ θρόνῳ μου / ἐν τῷ θρόνῳ αὐτοῦ
  choice: わたしの王座に／その王座に
  rationale: ἐν は直訳すれば「中に」だが、王座への着座を表す自然な日本語として助詞「に」を用いた。
- source_word: ὡς κἀγὼ
  choice: わたしも……のと同じである
  rationale: ὡς の比較と、κἀγώ に含まれる付加の καί（「も」）を明示し、勝利する者への約束とイエス自身の勝利・着座との対応を保った。
theological_decisions:
- issue: 勝利する者を表す男性単数形の代表性
  choice: 日本語本文では性を指定せず「者」とし、単数の代表的表現を保つ
  alternative: 「彼」として文法上の男性形を明示する
  rationale: ギリシア語の男性単数分詞と代名詞は、勝利する一人一人を代表している。日本語の「者」は性別を限定せずに単数的・代表的な力を自然に保てるため、本文で男性に限定する含みを加えなかった。
- issue: 信じる者がキリストの王座に共に着くことと、キリストが父の王座に共に着くことの関係
  choice: 原文の強い並行関係を説明で弱めず、そのまま訳す
  alternative: 前者を単なる象徴だと本文中で限定する、または父と子の関係について教理的説明を加える
  rationale: 本文は、勝利する者に与えられる参与と、イエスの勝利および父との着座を明確に比較している。翻訳ではこの緊張と力を保ち、本文にない存在論的説明を加えない。
translation_notes:
  register: 明瞭で格調ある現代標準語を用いた。「王座に着く」により即位・統治への参与という比喩を自然に表しつつ、本文に解釈上の限定を加えていない。神を指す代名詞も日本語聖書として読みやすい平仮名表記にした。
