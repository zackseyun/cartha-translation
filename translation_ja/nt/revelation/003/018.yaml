revisions:
- from: わたしはあなたに勧める。豊かになるために、火で精錬された[a]金をわたしから買いなさい。また、身にまとい、あなたが裸であることの恥があらわにならないように、白い衣[b]を買いなさい。そして、見えるようになるために、目に塗る薬[c]を買って、あなたの目に塗りなさい。
  to: わたしはあなたに勧める。豊かになるために火で精錬された金を、身にまとってあなたの裸の恥があらわにならないように白い衣を、また、見えるようになるためにあなたの目に塗る薬を、わたしから買いなさい。
  rationale: 修正は、三つの目的語すべてが「わたしから買いなさい」に係る原文の構造を明示するためのものである。「身にまとって」「目に塗る」は、それぞれ白い衣と眼用薬の使用目的として保持した。原文が比喩として提示する金・衣・薬の意味は解説せず、また「買う」の語も言い換えていない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:33:34Z'
review_pass:
  verdict: revise
  source_fidelity: 原文は「わたしから買う」の目的語として金・白い衣・目に塗る薬の三つを並列し、それぞれに目的節を添える。草案は意味内容をほぼ正確に伝えているが、「わたしから」が金だけに係るようにも読め、また最後の「薬を買って、…塗りなさい」は原文の一つの「買う」への並列構造を日本語で不必要に分断している。修正版では三品すべてを「わたしから買いなさい」に明確に係らせる。
  naturalness: 草案は概して明瞭である。ただし「あなたが裸であることの恥」より「あなたの裸の恥」のほうが、属格構文を保ちながら現代日本語として簡潔である。三つの品を先に列挙して最後に「わたしから買いなさい」と結ぶ形は、原文の並列と係り受けを自然に表せる。
  terminology: 「火で精錬された金」「白い衣」「目に塗る薬」は適切である。「衣」はἱμάτιαを長衣に限定せずに表し、「目に塗る薬」はκολλούριονの医薬的性格を過度に専門化せず伝える。象徴を本文で解説せず、「買う」を保持する方針も妥当である。
  issues:
  - severity: medium
    issue: 「わたしから」の係り先が限定的に読める
    rationale: παρ’ ἐμοῦは、金だけでなく後続する白い衣と目の薬を含む「買う」に係る。草案の反復された「買いなさい／買って」は、日本語では「わたしから」が最初の金だけを修飾する印象を与えうる。
  - severity: low
    issue: 最後の購入と塗布の構文が原文の並列をやや曖昧にする
    rationale: 原文は三品を買うよう勧め、そのうち目の薬には「目に塗って見えるようになる」という目的を添える。三品を一つの「買いなさい」に統括すると、構造がより明確になる。
  revised_text: わたしはあなたに勧める。豊かになるために火で精錬された金を、身にまとってあなたの裸の恥があらわにならないように白い衣を、また、見えるようになるためにあなたの目に塗る薬を、わたしから買いなさい。
  revised_footnotes:
