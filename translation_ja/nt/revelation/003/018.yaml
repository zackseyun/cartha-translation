id: REV.3.18
reference: Revelation 3:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: ja
  text: わたしはあなたに勧める。豊かになるために火で精錬された金を、身にまとってあなたの裸の恥があらわにならないように白い衣を、また、見えるようになるためにあなたの目に塗る薬を、わたしから買いなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλεύω σοι
  choice: わたしはあなたに勧める
  rationale: 現在形一人称単数と与格を率直に表し、権威を伴う助言でありながら命令そのものとは言い切らない語調を保った。
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: わたしから買いなさい
  rationale: παράの属格が示す入手元を明示し、霊的な品々を「買う」という比喩を説明に置き換えず保持した。
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: 火で精錬された金
  rationale: 完了受動分詞が表す、火を経て精錬された状態を自然な日本語で表し、冶金の比喩を保った。
- source_word: ἵνα πλουτήσῃς
  choice: 豊かになるために
  rationale: アオリスト接続法が示し得る、豊かな状態に入るという含みを「豊かになる」で表した。
- source_word: ἱμάτια λευκά
  choice: 白い衣
  rationale: ἱμάτιαは衣服を広く指すため、黙示録の荘重な文脈に合いながら特定の形の長衣に限定しない「衣」とした。
- source_word: ἵνα περιβάλῃ
  choice: 身にまとい
  rationale: 中動態の、自ら身に着けるという意味を簡潔に表した。
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: あなたが裸であることの恥があらわにならないように
  rationale: 受動態と「裸の恥」という属格表現を保ちつつ、現代日本語として理解しやすい形にした。
- source_word: κολλούριον
  choice: 目に塗る薬
  rationale: 目に用いる薬剤を指す語であり、液体の点眼薬に限定されかねない「目薬」よりも、後続する「塗る」と整合する表現を選んだ。
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: あなたの目に塗りなさい
  rationale: 薬をこすり付けて用いる動作を自然に表す。「油を注ぐ」という宗教的意味を不必要に持ち込まない。
- source_word: ἵνα βλέπῃς
  choice: 見えるようになるために
  rationale: 単なる継続的視覚よりも、見えない状態から見える状態への変化を文脈に即して表した。
theological_decisions:
- issue: 金、白い衣、目に塗る薬が表す象徴的意味
  choice: 三つの品を比喩のまま訳し、その霊的意味を本文中で特定しない。
  alternative: 金を真の霊的富、白い衣を義または清さ、目の薬を霊的洞察と明示して訳す。
  rationale: 本文は鮮明な象徴を用いるが、この節自体では各象徴の対応関係を明示していないため、解釈によって曖昧さを解消しない。
- issue: ἐγχρῖσαιに宗教的な「油注ぎ」の含意を持たせるか
  choice: 医薬品を目に「塗る」という具体的動作として訳す。
  alternative: 「目に油を注ぐ」または宗教的な意味を帯びる「塗油する」と訳す。
  rationale: 文脈ではκολλούριονという眼用の薬剤を塗る行為であり、秘跡的・教派的な含意を加える根拠はない。
- issue: 「買う」という表現の比喩的緊張
  choice: 代価や恩恵の仕組みを説明せず、「買う」をそのまま保つ。
  alternative: 「受ける」「求める」などに言い換えて無償性との緊張を解消する。
  rationale: 原文が意図的に商取引の語彙を用いているため、その比喩と神学的緊張を訳文でも保持する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、キリストの厳粛な勧告にふさわしい品位を保った。列挙された三つの品について「買いなさい」を補って反復し、日本語で係り受けが曖昧にならないようにした。象徴は説明的に言い換えず、原文の比喩性を保持した。
