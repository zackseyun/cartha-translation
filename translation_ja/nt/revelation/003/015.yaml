  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: ja
  text: わたしはあなたの行いを知っている。あなたは冷たくもなく、熱くもない。冷たいか熱いか、どちらかであってほしい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδά
  choice: 知っている
  rationale: οἶδαの現在的な状態の意味を自然な現代日本語で表し、直接的な評価の調子を保つ。
- source_word: σου τὰ ἔργα
  choice: あなたの行い
  rationale: 黙示録に繰り返される評価の定型句として、具体的な行為と道徳的重みの双方を保つ。「わざ」より現代の一般読者に明瞭である。
- source_word: ψυχρὸς
  choice: 冷たい
  rationale: ζεστόςとの温度の対比を文字どおり保持し、比喩の意味を訳文で限定しない。
- source_word: ζεστός
  choice: 熱い
  rationale: 温度を表す基本的な語として訳し、「熱心な」などの解釈を本文に持ち込まない。
- source_word: ὄφελον
  choice: であってほしいものだ
  rationale: 現状とは異なることを願う強い気持ちを、古風になりすぎない自然で格調ある日本語で表す。
- source_word: ἢ
  choice: か
  rationale: 「冷たいか、熱いか」という簡潔な選択の並列によって原文の選言を保つ。
theological_decisions:
- issue: 「冷たい」と「熱い」という温度の比喩の意味
  choice: 本文では温度の比喩をそのまま残し、その霊的意味を特定しない。
  alternative: 「冷たい」を霊的な無関心・不信、「熱い」を霊的な熱心さと解する、または両者をそれぞれ爽快さと治療効果という有益な温度と解する。
  rationale: この節自体は比喩を明示的に説明していないため、特定の解釈を訳文に織り込まず、原文の神学的緊張と解釈上の余地を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、キリストの厳粛で直接的な評価にふさわしい格調を保った。「わたし」は話者の荘重さを損なわず、一般読者にも自然な表記とした。
