id: REV.22.17
reference: Revelation 22:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: ja
  text: 霊と花嫁が言う。「来てください。」聞く者も、「来てください」と言いなさい。[a] 渇いている者は来なさい。望む者は、いのちの水を無償で受けなさい。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 初めの二度の「来てください」は、一般に主の来臨を願う呼びかけと理解されます。その後は、渇いている者、望む者への招きに移ると読むことができます。
    reason: alternative_reading
  - marker: b
    text: 「ただで」または「贈り物として」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: 霊
  rationale: この文脈では聖霊を指すと考えられるが、ギリシア語自体には大文字・小文字による区別がないため、日本語本文では簡潔に「霊」とした。
- source_word: ἡ νύμφη
  choice: 花嫁
  rationale: 黙示録の象徴表現を保ち、「教会」「神の民」「新しいエルサレム」などと解釈的に言い換えない。
- source_word: Ἔρχου
  choice: 来てください
  rationale: 二人称命令形による直接の呼びかけを、現代日本語で自然かつ敬意を含む表現にした。呼びかけの相手は本文中で明示しない。
- source_word: ὁ ἀκούων
  choice: 聞く者
  rationale: 冠詞付き現在分詞の一般的・代表的な意味を簡潔に表す。原文にない目的語は補わない。
- source_word: ὁ διψῶν
  choice: 渇いている者
  rationale: 身体的な渇きの比喩を保持し、必要や切望という含意を解釈で限定しない。
- source_word: ἐρχέσθω
  choice: 来なさい
  rationale: 三人称命令形の招きと命令の力を、自然な現代日本語で表した。
- source_word: ὁ θέλων
  choice: 望む者
  rationale: θέλωの願い・意志の両面を簡潔に表し、原文に明示されない目的語を加えない。
- source_word: λαβέτω
  choice: 受けなさい
  rationale: 水を得るという文脈と、無償の贈り物という含意に自然に合う。命令形の力も保持する。
- source_word: ὕδωρ ζωῆς
  choice: いのちの水
  rationale: 属格表現を保ち、「生ける水」として別の構文・ニュアンスに移さない。
- source_word: δωρεάν
  choice: 無償で
  rationale: 代価を払わず、贈り物として受ける意味を明瞭な現代語で表す。
theological_decisions:
- issue: 二度の「来てください」の呼びかけの相手
  choice: 相手を本文で明示せず、呼びかけをそのまま残す。
  alternative: 二度とも主イエスへの来臨の願いと明示する、またはすべてを渇く者への招きとして読む。
  rationale: 最初の二つは同じ二人称命令形であり、その後に渇く者と望む者への三人称命令形が続く。主の来臨を願う呼びかけから人への招きへ移る可能性を保ち、原文の文学的・神学的な重なりを解消しない。
- issue: 「花嫁」が象徴するもの
  choice: 象徴語「花嫁」をそのまま保持する。
  alternative: 「教会」「神の民」または「新しいエルサレム」と訳す。
  rationale: 黙示録ではこれらの連想が重なっており、一つの解釈に限定する言い換えを避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録にふさわしい簡潔で格調ある呼びかけを保った。二人称のἜρχουは「来てください」、三人称命令形は「来なさい」「受けなさい」と訳し、原文の文法上の移行を日本語でも示した。
