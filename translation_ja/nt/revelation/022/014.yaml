id: REV.22.14
reference: Revelation 22:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: ja
  text: 自分の衣を洗う人々は幸いである。[a][b] 彼らは、いのちの木にあずかる権利を持ち、門を通って都に入ることができる。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「自分の衣を洗う人々」の代わりに、「その方の戒めを行う人々」または「その方の戒めを守る人々」とあります。
    reason: textual_variant
  - marker: b
    text: 衣を洗うという表現は、衣を小羊の血で洗って白くした人々について述べる黙示録7章14節を思い起こさせます。
    reason: cross_reference
  - marker: c
    text: 直訳に近くは、「門によって」。門を経路または手段として示す表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: 幸いである
  rationale: 主観的な幸福感だけでなく、神から祝福された終末的な状態を表す、現代日本語の聖書文体として自然な表現。
- source_word: πλύνοντες τὰς στολὰς αὐτῶν
  choice: 自分の衣を洗う人々
  rationale: 分詞が示す、その行為によって特徴づけられる人々という意味を保ちつつ、具体的な洗濯の比喩を解釈的に言い換えない。「衣」は黙示録の象徴的な衣服にもふさわしい。
- source_word: ἵνα
  choice: 彼らは…得て、…できる
  rationale: 目的・結果を表す節のつながりを、日本語では独立した後続文として自然に表現した。
- source_word: ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: いのちの木にあずかる権利を得て
  rationale: ἐξουσίαはここでは支配力ではなく正当な資格・権利を指す。ἐπίとの結びつきは、木を支配する意味ではなく、その実にあずかる資格と理解できるため、「あずかる」を補って自然な日本語にした。
- source_word: τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν
  choice: 門を通って都に入ることができる
  rationale: 与格を経路・手段として取り、「門を通って」と明示した。εἰσέλθωσινはἵνα節内の接続法で、許された入城という文脈を「入ることができる」で表した。
theological_decisions:
- issue: 冒頭句の本文異読
  choice: SBLGNTの「自分の衣を洗う人々」を本文に採用する。
  alternative: 「神の戒めを行う人々」または「神の戒めを守る人々」。
  rationale: 指定された原語本文を優先する。異読は伝承上も神学上も重要なので脚注に残すが、本文へ混入させない。
- issue: 衣を洗うことと、いのちへの接近との関係
  choice: 衣を洗う者に権利と入城が与えられるという本文の関係を、そのまま保つ。
  alternative: 人間の功績による報酬と明示する、または本文中で「小羊の血によって」と補う。
  rationale: この節自体が述べない救済の仕組みを加えず、黙示録7章14節との象徴的なつながりは脚注で示す。
translation_notes:
  register: 明瞭で現代的ながら、黙示録の荘重さを保つ文体。「幸いである」「いのちの木」「都」は聖書的な響きを保ち、「権利を得る」「門を通って」で普通の読者にも関係が明確になるようにした。
