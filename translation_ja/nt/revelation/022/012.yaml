id: REV.22.12
reference: Revelation 22:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: ja
  text: 「見よ、わたしはすぐに来る[a]。わたしの報いはわたしとともにあり、一人ひとりに、その人の行いがどのようなものであるかに応じて報いる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「速やかに来る」とも訳せる。ギリシア語のταχύは、時が近いこと（「すぐに」）にも、動きの速さや突然性（「速やかに」）にも重点を置きうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 預言的・黙示的な注意喚起の力と荘重さを保ちつつ、現代日本語でも理解できる表現とした。
- source_word: ἔρχομαι
  choice: 来る
  rationale: 現在形だが、文脈上は差し迫った到来を表す。日本語の「来る」はこの現在的な切迫感と未来的意味を自然に両立できる。
- source_word: ταχύ
  choice: すぐに
  rationale: 終末論的文脈で到来の近さを自然に示す。ただし、速さや突然性を表す可能性もあるため脚注に残した。
- source_word: ὁ μισθός μου
  choice: わたしの報い
  rationale: μισθόςの報酬・賃金・償いという意味領域のうち、神の裁きと応報の文脈に適し、商業的に響きすぎない「報い」を選んだ。
- source_word: μετ’ ἐμοῦ
  choice: わたしとともにあり
  rationale: 原文で省略されている連結動詞を日本語で補い、「報い」が到来する方とともにあるという構文を保った。
- source_word: ἀποδοῦναι
  choice: 報いる
  rationale: 各人にその行いに即して返すという応報の意味を簡潔に表す。「与える」よりも原語の返報的含意が明確である。
- source_word: ἑκάστῳ
  choice: 一人ひとりに
  rationale: 単数による配分的意味と、各人の個別的責任を自然な日本語で表した。
- source_word: ὡς τὸ ἔργον ἐστὶν αὐτοῦ
  choice: その人の行いがどのようなものであるかに応じて
  rationale: 名詞ἔργονと動詞ἐστίνを反映しつつ、「行ったことに応じて」と動詞化しすぎず、判断の基準を自然な日本語で示した。
theological_decisions:
- issue: ἑκάστῳ ... αὐτοῦにおける文法上の男性単数
  choice: 一人ひとりに、その人の行い
  alternative: 一人ひとりに、彼の行い
  rationale: ギリシア語の男性単数はここでは代表的・包括的に各人を指す。日本語の「その人」は性別を付加せず、個別性と単数性を保つため、原文の指示範囲を正確に伝える。
- issue: 行いに応じた応報の性質
  choice: その人の行いがどのようなものであるかに応じて報いる
  alternative: その人が行ったことに応じて報いる
  rationale: 各人の行いに応じた応報という本文の主張を保持する一方、それが最終的救いの根拠をどのように説明するかについて、本文を越えた教理的結論を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「見よ」によって黙示文学にふさわしい荘重な調子を保った。応報表現は自然に整えながらも、原文の名詞「行い」と神学的緊張を維持した。
