id: REV.22.16
reference: Revelation 22:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: ja
  text: 「わたし、イエスは、諸教会のために[a]、これらのことをあなたがたに証しするために、わたしの御使いを遣わした。わたしはダビデの根であり、ダビデの子孫[b]であり、輝く明けの明星である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸教会で」または「諸教会について」。ギリシア語のἐπὶ ταῖς ἐκκλησίαιςには複数のニュアンスがあり得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ダビデの末裔」。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: わたしイエスは
  rationale: 明示された代名詞の強調と、イエスによる厳かな自己提示を保つ。日本語では「わたしイエスは」が簡潔で自然であり、原文にない繋辞を補わない。
- source_word: ἔπεμψα
  choice: 遣わした
  rationale: 完了した派遣を表すアオリストを自然な日本語の過去形で表し、その使命が現在の啓示に関わることは文脈に委ねる。
- source_word: τὸν ἄγγελόν μου
  choice: わたしの御使い
  rationale: 黙示録の文脈では人間の使者より天的存在を指す可能性が高い。「御使い」は聖書の荘重さを保ちつつ理解しやすい。
- source_word: μαρτυρῆσαι
  choice: 証しするよう
  rationale: 派遣の目的を表す不定詞として訳し、μαρτυρέωの証言・証人としての含意を保つ。
- source_word: ὑμῖν ταῦτα
  choice: これらのことをあなたがたに
  rationale: 複数の指示語と与格を明示し、啓示の内容全体を指す表現を保つ。
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: 諸教会のために
  rationale: ἐπί＋与格の柔軟さを踏まえ、証言が諸教会に向けられ、その益となるという関係を自然な日本語で表す。場所または関連を示す解釈も可能なので脚注に残す。
- source_word: ἡ ῥίζα
  choice: ダビデの根
  rationale: ῥίζαの比喩を直訳し、起源・源を想起させるメシア的表現を説明に置き換えない。
- source_word: τὸ γένος Δαυίδ
  choice: その子孫
  rationale: γένοςがここで表すダビデとの血統上の関係を、現代日本語で明瞭に表す。「その」は直前のダビデを受ける。
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: 輝く明けの明星
  rationale: 重ねられた形容的表現を自然な一つの称号としてまとめ、輝きと朝の星という両方の像を保つ。
theological_decisions:
- issue: ダビデに関するメシア的自己提示
  choice: 「ダビデの根、またその子孫」
  alternative: 「ダビデの源、またその末裔」
  rationale: イエスがダビデに先立つ「根」であると同時にダビデから出た「子孫」であるという本文の緊張を、説明したり解消したりせず保つ。
- issue: 「明けの明星」というキリスト論的称号
  choice: 「輝く明けの明星」
  alternative: 「明るい朝の星」
  rationale: 原文におけるイエス自身の直接的な称号を保持し、後代の教理的説明を付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、イエスの自己宣言にふさわしい簡潔で荘重な調子を保った。「御使い」「証し」「明けの明星」は一般読者にも理解可能な聖書語彙として採用した。
