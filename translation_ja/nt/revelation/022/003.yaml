id: REV.22.3
reference: Revelation 22:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: ja
  text: もはや、どんな呪いもなくなる[a]。神と子羊の御座はそこにあり、その方の奴隷たちは、その方に礼拝をささげる[b][c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「呪われたものは何一つない」。
    reason: lexical_alternative
  - marker: b
    text: 原文では、「御座」は単数で、「神と子羊の御座」とされ、続く「その方の」「その方に」も単数である。神と子羊の区別と、両者が共に治めることが併せて示されている。
    reason: alternative_reading
  - marker: c
    text: 「奴隷」は「しもべ」「僕」とも訳せる。
    reason: lexical_alternative
  - marker: d
    text: 別訳「仕える」「聖なる奉仕をする」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: どんな呪いも
  rationale: πᾶν の包括的な意味と、κατάθεμα が表す呪いを自然な現代日本語で伝える。具体的に「呪われたもの」を指す可能性は脚注に残した。
- source_word: οὐκ ἔσται ἔτι
  choice: もはや……ない
  rationale: 未来の存在否定と ἔτι の「もはや／これ以上」の意味を、簡潔で自然な日本語にした。
- source_word: ὁ θρόνος
  choice: 御座
  rationale: 黙示録の王権と神的威厳を表す定着した訳語を用い、原文の単数も保った。
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: 神と子羊の
  rationale: 二つの属格を明示し、神と子羊の区別を保つ。「子羊」は黙示録における犠牲的・メシア的な比喩を伝える定着訳である。
- source_word: ἐν αὐτῇ
  choice: そこに
  rationale: 女性単数代名詞が直前の都を指すことを踏まえ、指示関係を過度に説明せず自然な日本語にした。
- source_word: οἱ δοῦλοι αὐτοῦ
  choice: その方の奴隷たち
  rationale: δοῦλοι が示す所有と全面的な従属を「奴隷」で保持した。「その方」は原文の単数代名詞を保ちつつ、敬意ある現代日本語とした。
- source_word: λατρεύσουσιν αὐτῷ
  choice: その方に礼拝をささげる
  rationale: λατρεύω の神に向けられた祭儀的・宗教的奉仕の意味を、この御座の文脈に合う明瞭な日本語で表した。単数の αὐτῷ も「その方に」で保持した。
theological_decisions:
- issue: 「神と子羊」という区別、単数の御座、単数代名詞の併存
  choice: 「神と子羊の御座」を単数とし、続く代名詞も「その方の／その方に」と単数で訳す
  alternative: 「彼らの奴隷たちは、彼らを礼拝する」のように複数化する
  rationale: 原文は神と子羊を区別しながら、一つの御座と単数代名詞を用いる。この神学的緊張を説明的に解消せず、そのまま保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「御座」「礼拝をささげる」で黙示録の荘重さを保った。「奴隷」は強い語だが、δοῦλος の所有・従属の意味を薄めないため採用した。単数代名詞の反復は日本語としてやや際立つものの、原文の神学的緊張を保持するため意図的に残した。
