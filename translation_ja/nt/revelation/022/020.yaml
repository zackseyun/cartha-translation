    text: 別訳「わたしは速やかに来る」。ギリシア語の副詞は、時間的な近さと、到来や行動の速さのどちらをも強調し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: 言われる
  rationale: 現在形の発話導入を自然な日本語で表し、主語であるイエスへの敬意を示す。
- source_word: ὁ μαρτυρῶν
  choice: 証言する方
  rationale: 実体詞的な現在分詞の継続的な性格と、μαρτυρέωの証人・証言の語感を保つ。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前までに示された啓示の内容を指す複数指示詞を明示する。
- source_word: Ναί
  choice: はい
  rationale: 解釈的な荘重さを加えず、直接的な肯定として訳す。
- source_word: ἔρχομαι
  choice: わたしは来る
  rationale: 未来を指向する現在形を、日本語として自然な約束の表現にする。
- source_word: ταχύ
  choice: すぐに
  rationale: 文脈上、時の近さを自然に表す一方、到来の迅速さという可能性は脚注に残す。
- source_word: Ἀμήν
  choice: アーメン
  rationale: 同意と祈願を表す典礼的な応答を、定着した音写で保つ。
- source_word: ἔρχου
  choice: 来てください
  rationale: 単数への直接的な命令・願いを、現代日本語で自然かつ敬意ある祈願として表す。
- source_word: κύριε
  choice: 主…よ
  rationale: イエスへの直接呼びかけとして、称号κύριοςの定着した訳語と呼格の力を保つ。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 固有名を標準的な日本語表記で音写する。
theological_decisions:
- issue: キリストの到来についてのταχύの意味
  choice: すぐに（時間的な近さ）
  alternative: 速やかに／素早く（到来または行動の迅速さ）
  rationale: ταχύは時間的な近さと動作の迅速さの双方を表し得る。本文では終結部の約束とそれに応じる祈りに自然な「すぐに」を採り、終末論上重要な別の含みを脚注で保持する。
translation_notes:
  register: 明瞭で現代的ながら、黙示録末尾の証言・約束・祈願の荘重さを保った。「言われる」「来てください」により、過度に古風にならない敬意ある文体とした。
