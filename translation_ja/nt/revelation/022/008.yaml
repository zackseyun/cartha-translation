- from: これらのことを聞き、また見ているのは、私ヨハネである。そして、聞き、また見たとき、私は、これらのことを私に示していた御使いの足もとにひれ伏し、礼拝しようとした。[a]
  to: これらのことを聞き、また見ている者は、私ヨハネである。そして、私がこれらのことを聞き、また見たとき、これらのことを私に示している御使いの足もとにひれ伏して、礼拝[a]しようとした。
  rationale: 本文の意味を変えず、現在分詞δείκνυμιの描写性を「示している」で保った。自己同定の語順を自然にし、脚注記号を「礼拝」に直接結び付けた。脚注の代替訳も、προσκυνέωが具体的なひれ伏しと敬意表明を指し得ることを、曖昧さを狭めずに示すよう明確化した。
