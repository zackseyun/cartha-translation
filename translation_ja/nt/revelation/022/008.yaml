    rationale: 現在分詞を「示していた」と過去の継続として訳すことは文脈上可能だが、「示している」のほうが原文の現在分詞の描写性をより素直に保つ。
  - severity: low
    issue: 自己同定句の自然さ
    rationale: 「私ヨハネである」は直訳調であるため、「私ヨハネは、…者である」として現代日本語としての流れを整える。
