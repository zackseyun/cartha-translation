id: REV.22.8
reference: Revelation 22:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: ja
  text: これらのことを聞き、また見ている者は、私ヨハネである。そして、私がこれらのことを聞き、また見たとき、これらのことを私に示している御使いの足もとにひれ伏して、礼拝[a]しようとした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御使いの足もとにひれ伏そうとした」または「敬意を表そうとした」とも訳せる。ギリシア語の動詞は、ひれ伏す動作や崇敬を表すことがある。ここでは、黙示録における通常の用法と、続く御使いの叱責を踏まえて「礼拝」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ Ἰωάννης
  choice: 私ヨハネである
  rationale: καίによる文脈上のつながりは日本語の流れの中で表し、明示された一人称主語とヨハネの自己同定を自然に保つ。
- source_word: ὁ ἀκούων καὶ βλέπων ταῦτα
  choice: これらのことを聞き、また見ているのは
  rationale: 現在分詞の継続的・同時的な響きと、冠詞付き分詞による『その者』という自己同定を、日本語の『～のは』構文で表した。
- source_word: ὅτε ἤκουσα καὶ ἔβλεψα
  choice: 聞き、また見たとき
  rationale: ὅτεを時間関係の『とき』とし、アオリストを自然な完了的過去として訳す。『後で』とはせず、原文以上に時間順序を限定しない。
- source_word: ἔπεσα προσκυνῆσαι
  choice: ひれ伏し、礼拝しようとした
  rationale: ἔπεσαは身体動作を伴う『ひれ伏す』、目的の不定詞 προσκυνῆσαι は『礼拝しようとした』とし、行為の目的を明確にした。
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: 足もとに
  rationale: 直訳的な『足の前に』より自然な日本語で、御使いの足前に伏す位置関係を保つ。
- source_word: τοῦ ἀγγέλου
  choice: 御使い
  rationale: 黙示録における天的存在を指す定着した聖書語として『御使い』を用いる。
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: これらのことを私に示していた
  rationale: 現在分詞の未完了的な性質を『示していた』で表し、その御使いが幻を示す役割を継続していたことを伝える。
theological_decisions:
- issue: 御使いに向けられた προσκυνέω の性質
  choice: 本文では『礼拝しようとした』と訳す
  alternative: 『ひれ伏そうとした』『敬意を表そうとした』
  rationale: προσκυνέω はひれ伏して敬意を示す行為も表し得るが、黙示録での通常の用法と次節の叱責を踏まえ、『礼拝』という強い意味を本文に残す。これにより、ヨハネの行為の重大さと、御使いが礼拝を受けるべきではないという物語上の緊張を弱めない。
translation_notes:
  register: 明快な現代標準語を基調としつつ、黙示文学にふさわしい品位を保った。『御使い』『礼拝』は一般読者にも理解可能な定着語として採用し、分詞の時制・相の違いは『見ている』『示していた』で可能な範囲で反映した。
