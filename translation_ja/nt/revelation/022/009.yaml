id: REV.22.9
reference: Revelation 22:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: ja
  text: 彼は私に言った。「いけない。私は、あなたと、預言者であるあなたの兄弟たちと、この書の言葉を守る人々と共に仕える者です。神を礼拝しなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅρα μή
  choice: いけない
  rationale: 直訳的には「見よ、～するな」という省略的で鋭い制止。直前のヨハネの行為を受け、現代日本語で自然な短い禁止表現とした。
- source_word: σύνδουλός
  choice: 同じく、仕える者
  rationale: 神という同じ主人のもとに置かれた共同の隷属・奉仕の立場を表す。「奴隷仲間」は語義を強く示す一方、日本語では不自然になりやすいため、本文では自然さを保ち、脚注で原語の含意を明示した。
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: あなたの兄弟である預言者たち
  rationale: 「あなたの兄弟」と「預言者たち」を同格と解し、その関係が明瞭になるように訳した。男性複数形の表現を保った。
- source_word: τηρούντων
  choice: 守る
  rationale: 単なる保管ではなく、言葉を大切に保持し、従うことを含み得る語。原語の幅を狭めない「守る」とした。
- source_word: λόγους τοῦ βιβλίου τούτου
  choice: この書の言葉
  rationale: λόγουςを集合的な「メッセージ」とせず複数の「言葉」として直接的に訳し、黙示録内の反復表現とのつながりを保った。
- source_word: τῷ θεῷ προσκύνησον
  choice: 神を礼拝しなさい
  rationale: ここでは天使へのひれ伏しと、神にのみ向けるべき礼拝が対比されているため、「礼拝する」が文脈に最も適する。
theological_decisions:
- issue: σύνδουλοςに含まれる共同の隷属身分
  choice: 本文を「同じく、仕える者」とし、脚注で「同じ主人に属する奴隷仲間」の含意を示す。
  alternative: 「奴隷仲間」「同労の僕」
  rationale: 天使もヨハネたちと同様に神の支配下にあり、礼拝の対象ではないという論点を保ちつつ、現代日本語として不必要にぎこちない表現を避けた。
- issue: Ὅρα μήの省略された禁止内容
  choice: 「いけない」と訳す。
  alternative: 「そんなことをしてはいけない」「するな」
  rationale: 禁止対象は直前の礼拝行為から明らかだが、原文自体はその目的語を明示しない。簡潔な制止にすることで、文脈上の意味を伝えながら原文の省略性もある程度保った。
- issue: 預言者たちと「兄弟」の関係
  choice: 「あなたの兄弟である預言者たち」と同格に訳す。
  alternative: 「あなたの兄弟たちや預言者たち」
  rationale: 定冠詞を伴う同格的な属格連鎖として読むのが自然であり、預言者を兄弟とは別の集団として増やさない。
translation_notes:
  register: 簡潔で厳かな現代標準日本語。天使の制止は鋭く短くし、後半の命令「神を礼拝しなさい」を明確に際立たせた。
