id: REV.22.15
reference: Revelation 22:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: ja
  text: 外にいるのは、犬[a]、魔術を行う者たち、性的に不品行な者たち、人殺したち、偶像を礼拝する者たち、また、偽り[b]を愛し、それを行う者はみなである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「犬」はここでは比喩と考えられ、都から除外される者、道徳的に汚れた者を表すとみられる。さらに特定の者たちを指すと解する見方もある。
    reason: cultural_note
  - marker: b
    text: または「うそ」。すなわち「うそを愛し、それを行う者はみな」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξω
  choice: 外には……いる
  rationale: 都からの排除を示す場所の副詞。文頭の強調を保ちつつ、日本語として自然になるよう述語「いる」を補った。
- source_word: κύνες
  choice: 犬ども
  rationale: 具体的な比喩表現をそのまま保持する。「ども」はここでの強い否定的含意を伝えるが、指す対象を本文で限定しない。
- source_word: φάρμακοι
  choice: 魔術を行う者たち
  rationale: 黙示録の文脈では、薬剤師などではなく魔術・呪術の実践者を指す。現代の一般読者に明瞭な表現とした。
- source_word: πόρνοι
  choice: 性的不品行を行う者たち
  rationale: 不道徳一般ではなく、広い意味での性的な不品行に携わる者を表す。特定の行為だけに狭めない。
- source_word: φονεῖς
  choice: 人殺し
  rationale: 殺人を犯す者を指す簡潔で自然な訳語。
- source_word: εἰδωλολάτραι
  choice: 偶像を礼拝する者たち
  rationale: 「偶像礼拝者」より平明であり、原語の宗教的・倫理的意味を明確に伝える。
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: 偽りを愛して行う者がみな
  rationale: 二つの現在分詞が示す特徴的・継続的な志向と行為を保った。「偽り」は虚偽の言葉にも、より広く偽なるものへの加担にも読める。
theological_decisions:
- issue: 「犬」が特定の集団を指す比喩かどうか
  choice: 本文では「犬ども」と直訳し、比喩の対象を特定しない。
  alternative: 汚れた者たち、恥知らずな者たち、特定の性的逸脱者
  rationale: 原文の鮮烈な黙示的比喩を保存し、議論のある特定解釈を本文に持ち込まないため。
- issue: ψεῦδοςを個別の「うそ」とするか、広い「偽り」とするか
  choice: 偽り
  alternative: 一つのうそ／うそ
  rationale: 単数形は個別の「うそ」とも訳せるが、「愛して行う」という継続的姿勢の表現には、虚偽全般を含み得る「偽り」が適する。別訳は注記した。
translation_notes:
  register: 明瞭な現代標準語を用い、黙示録の厳粛で強い調子を保った。列挙の反復は日本語の可読性のため一部を簡潔にしたが、「犬」という象徴と「愛して行う」という倫理的緊張は保持した。すべての脚注標識を本文に配置した。
