    rationale: κύνεςはこの文脈で否定的・排除的な比喩ですが、どの集団を指すかは議論があります。「ども」は軽蔑の度合いを訳文で増幅し得るため、比喩を文字どおり「犬」として残すほうが安全です。
  - severity: medium
