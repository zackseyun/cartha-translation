  source_fidelity: 主要な語彙対応は概ね適切です。しかし、κύνες の訳語「犬ども」は原語の具体的な比喩に加えて日本語特有の侮蔑的な語感を明示的に加えるため、「犬」とするほうが原文の曖昧さを保てます。また、πᾶς φιλῶν καὶ ποιῶν ψεῦδος は「偽りを愛し、それを行う者はみな」とすると、両分詞とπᾶςの範囲が自然かつ明確に表せます。
  naturalness: 「外には……いる」でも理解できますが、「外にいるのは……である」は現代標準語として列挙の構文が明瞭です。「偽りを愛して行う者がみないる」は語順がやや不自然で、「愛し、それを行う者はみな」が自然です。「性的に不品行な者たち」は「性的不品行を行う者たち」より滑らかです。
  terminology: 「魔術を行う者たち」「偶像を礼拝する者たち」「偽り」は、黙示録の文脈と原語の意味領域を適切に伝えています。「犬」は本文で比喩の対象を限定せずに保持し、注記で説明するのが適切です。
