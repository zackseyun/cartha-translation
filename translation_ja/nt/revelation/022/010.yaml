id: REV.22.10
reference: Revelation 22:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: ja
  text: すると、彼は私にこう言った。「この書の預言の言葉を封じてはならない[a][c]。時が近いからだ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「閉ざしてはならない」「秘密にしてはならない」。この表現は、啓示を封じて閉ざすか、開かれたままにするかを語る預言の言葉遣いを反映している。
    reason: lexical_alternative
  - marker: b
    text: 別訳「定められた時が近い」。ギリシア語καιρόςは、決定的な時、定められた時を意味することがある。
    reason: lexical_alternative
  - marker: c
    text: ダニエル書12章4節参照。そこでは預言を封じるよう命じられるが、ここでは反対の命令が与えられている。
    reason: cross_reference
lexical_decisions:
- source_word: λέγει μοι
  choice: 彼は私に言う
  rationale: ギリシア語の現在形を保ち、黙示録の語りに見られる生き生きとした歴史的現在として表した。日本語でも文脈上自然に理解できる。
- source_word: Μὴ σφραγίσῃς
  choice: 封じてはならない
  rationale: σφραγίζωの基本的な比喩を保ちつつ、預言を閉ざして公にしないという文脈上の意味も伝わる表現とした。
- source_word: τοὺς λόγους
  choice: 言葉
  rationale: 複数形λόγουςを集合的に受ける自然な日本語として「言葉」とし、「教え」や「メッセージ」へ意訳しすぎないようにした。
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: この書の預言の言葉
  rationale: 連続する属格の関係を簡潔に保った。「この書に記された預言」と明示することも可能だが、原文以上に関係を限定しない表現を採った。
- source_word: ὁ καιρός
  choice: 時
  rationale: καιρόςが持ちうる決定的・定められた時という含みを排除せず、本文では簡潔な「時」とした。
- source_word: ἐγγύς ἐστιν
  choice: 近い
  rationale: 時間的な切迫を率直に表し、終末の時期について本文以上の説明を加えなかった。
theological_decisions:
- issue: 黙示文学における時の切迫性
  choice: 時が近い
  alternative: 定められた時が近い／時が迫っている
  rationale: 本文が語る近さを弱めたり、特定の終末論的時間表へ解釈したりせず、その緊張をそのまま残した。
- issue: 預言を封じない命令とダニエル書との対照
  choice: 封じてはならない
  alternative: 秘密にしてはならない
  rationale: ダニエル書の預言的表現とのつながりが見える語を保ち、単なる秘密保持の禁止へ意味を狭めなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令と終末的切迫感にふさわしい簡潔で dignified な調子を保った。「言った」ではなく「言う」として原文の歴史的現在を反映した。
