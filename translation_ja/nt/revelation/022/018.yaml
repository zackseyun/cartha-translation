  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: ja
  text: 私は、この書[a]の預言の言葉を聞くすべての人に証言する。だれかがそれらに何かを付け加えるなら、神はその者に、この書に記されている災いを加える。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「書」は「巻物」とも訳せる。原語は古代の書物の形態である巻物を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: 証言する
  rationale: 「警告する」と意訳せず、μαρτυρέω の証言・証しという厳粛な語感を保った。警告の力は後続の条件文から明らかになる。
- source_word: παντὶ τῷ ἀκούοντι
  choice: 聞くすべての人に
  rationale: 現在分詞を自然な現代日本語で表し、預言の言葉を耳にする一人一人が対象であることを示した。
- source_word: τοὺς λόγους τῆς προφητείας
  choice: 預言の言葉
  rationale: λόγοι を「言葉」、προφητείαを「預言」と訳し、書かれた預言の具体的な文言を指す表現を保った。
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: この書 / この書に
  rationale: βιβλίον は当時の物理的形態としては巻物を指し得るが、ここでは作品そのものへの言及として、格調と自然さを兼ねる「書」を一貫して用いた。
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: もし、これらに何かを付け加える者がいるなら
  rationale: ἐπιτίθημι の「加える」という意味を明示し、日本語として目的語が自然に理解できるよう「何かを」を補った。αὐτά は直前の「預言の言葉」を受けるため「これら」とした。
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: 神はその者に……災いを加えられる
  rationale: 前半と同じ動詞の反復を「付け加える／加えられる」で保ち、人が言葉に加える行為と神が災いを加える応報的な対照を示した。
- source_word: τὰς πληγὰς τὰς γεγραμμένας
  choice: 記されている災い
  rationale: πληγή は黙示録で神の裁きとしての災厄を指すため「災い」とし、完了受動分詞は、書かれて現在も記載された状態にあることを「記されている」で表した。
theological_decisions:
- issue: 冒頭を警告として意訳するか、証言の語を保つか
  choice: 「証言する」と訳し、警告の性格は後続内容によって示した。
  alternative: 「警告する」
  rationale: 原文の動詞は証言・証しの語であり、単なる一般的警告へ狭めないほうが、法廷的・厳粛な響きと文脈上の警告性をともに保てる。
- issue: 「災い」の性質を訳文で神学的に限定するか
  choice: 「災い」とし、裁き・罰などの説明語を本文に加えなかった。
  alternative: 「罰」「裁きの災い」
  rationale: 黙示録内では神の裁きとして機能するが、πληγάς 自体の語義と本文の簡潔さを保ち、解釈的限定を避けた。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、終末の厳粛な証言にふさわしい格調を保った。「私は」「証言する」「この書」により荘重さを出し、過度に古風な文語表現は避けた。
