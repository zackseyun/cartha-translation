  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: ja
  text: 都の大通りの中央を流れ、[a]その川のこちら側にも向こう側にも命の木があり、十二の実をつけ、月ごとに実を結んでいる。[b][c] その木の葉は、諸国の民の癒やしのためのものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「都の大通りの中央を」は前節から続き、命の水の川の流れを述べると取ることができる。これを命の木の位置を示す句と取る訳もある。
    reason: syntactical_alternative
  - marker: b
    text: 「十二の実」は、十二種類の実を指すとも、一年を通じた完全で豊かな実りを表すとも考えられる。
    reason: lexical_alternative
  - marker: c
    text: この情景は、創世記2章9節の命の木と、エゼキエル書47章12節の毎月実を結ぶ木々を思い起こさせる。
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: 都の大通りの中央を
  rationale: πλατείαは広い通りまたは広場を指し得るが、都の情景では「大通り」が自然である。この句は前節の川の流れを修飾するものとして訳した。
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: こちら側にも向こう側にも
  rationale: 直訳的な空間表現を保ち、川の両側を指すことが自然に伝わるようにした。
- source_word: ξύλον ζωῆς
  choice: 命の木
  rationale: ξύλονには「木材」の意味もあるが、創世記の園への明白な連想により「木」が適切である。単数形も保った。
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: 十二の実を結び
  rationale: ποιοῦν καρπούςを自然な農耕表現「実を結ぶ」とした。「十二種」とは断定せず、原文の「十二の実」という表現の余地を残した。
- source_word: κατὰ μῆνα ἕκαστον
  choice: 月ごとに
  rationale: 各月に繰り返される規則的な実りを簡潔に表す。
- source_word: ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: その実を実らせていた
  rationale: ἀποδίδωμιの産出・供給の意味を、木について自然な日本語で表した。
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: 諸国の民を癒やすため
  rationale: εἰςの目的・用途とθεραπείαの「癒やし」を保つ。ἔθνηは特定の民族集団に限定せず、広く諸国の民を指すとした。
theological_decisions:
- issue: 大通り、川、命の木の位置関係をめぐる圧縮された統語
  choice: 「大通りの中央」は前節の川に結び付け、命の木は川のこちら側にも向こう側にもあると訳す。木は原文どおり単数のままにする。
  alternative: 「大通りの中央にも、川の両側にも命の木がある」として、すべてを木の位置の説明と取る。
  rationale: ギリシア語の句読法と前節から続く構文では、ἐν μέσῳ τῆς πλατείας αὐτῆςは川の流れを修飾するのが自然である。一方、川の両側という複数的な情景に対してξύλονは単数なので、その黙示的な緊張は「命の木」という単数を維持して残した。
- issue: 「十二の実」の意味
  choice: 本文では「十二の実」とし、種類または完全な実りの周期という解釈を注に示す。
  alternative: 本文で「十二種類の実」と明示する。
  rationale: 原文には「種類」に相当する語がないため、本文で意味を限定しない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。黙示文学の圧縮された情景を過度に説明せず、文脈上必要な補いは最小限にした。「癒やす」は現代的な仮名遣いとし、「諸国の民」で普遍的な範囲を自然に表した。
