source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: ja
  text: 不正を行う者は、なお不正を行え。汚れた者は、なお汚されよ[a]。正しい者は、なお正しいことを行え[b]。聖なる者は、なお聖別されよ[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「汚れた者は、なお汚れたままでいよ」。ギリシア語の動詞は受動形で、直訳的には「汚されよ」の意。
    reason: lexical_alternative
  - marker: b
    text: 「正しいこと」は「義」または「公正」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「聖なる者は、なお聖なるものとされよ」。ギリシア語の動詞は受動形で、「聖別されよ」または「聖なるものとされよ」の意。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν / ἀδικησάτω
  choice: 不正を行う者には、なお不正を行わせよ
  rationale: 現在分詞の継続的な行為と、三人称アオリスト命令法の命令的な力を保つ。「悪人」のような固定的呼称より、原文の動詞性を明確に表した。
- source_word: ἔτι
  choice: なお
  rationale: 四つの句すべてで、行為または状態がさらに続くことを、簡潔で格調ある現代日本語で示す。
- source_word: ὁ ῥυπαρός / ῥυπαρευθήτω
  choice: 汚れた者には、なお汚れさせよ
  rationale: ῥυπαρόςの道徳的・宗教的な汚れの含意を「汚れた者」で表し、受動命令形を「汚れさせよ」として、やや衝撃的な原文の形と主体の曖昧さを保持した。
- source_word: ὁ δίκαιος / δικαιοσύνην ποιησάτω
  choice: 正しい者には、なお正しいことを行わせよ
  rationale: δίκαιοςとδικαιοσύνηの語の対応を日本語でも見える形にし、ποιέωの行為性を「行う」で表した。「義」は可能だが、一般読者への明瞭さを優先した。
- source_word: ὁ ἅγιος / ἁγιασθήτω
  choice: 聖なる者には、なお聖なる者とならせよ
  rationale: ἅγιοςを「聖なる者」とし、受動形ἁγιασθήτωを「聖なる者とならせよ」として、単なる状態の継続に平板化せず、聖別される含みと主体の非明示性を残した。
theological_decisions:
- issue: 終末における状態の固定を語る文脈での命令法
  choice: 四つの動詞を「行わせよ／汚れさせよ／ならせよ」という命令として訳す。
  alternative: 「不正を行い続けるだろう」などの予告として訳す。
  rationale: 原文は三人称命令法である。悪を是認する意味に説明的に変えず、厳粛で裁定的な響きと解釈上の緊張を保った。
- issue: ῥυπαρευθήτωとἁγιασθήτωの受動態
  choice: 使役受動的な日本語表現によって、行為主体を明示しない。
  alternative: 「汚れたままでいよ」「聖なるままでいよ」と状態の継続として訳す。
  rationale: 両語の受動形を保持し、誰がその状態をもたらすのかを訳文で確定しないことで、原文の神学的な曖昧さを残した。
- issue: δικαιοσύνηの意味範囲
  choice: 「正しいこと」
  alternative: 「義」または「公正」
  rationale: ここでは倫理的行為の対照が中心であり、現代の一般読者に明瞭な表現を選んだ。ただし「公正」という意味の可能性は脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、四句の厳粛な並行構造を句点で際立たせた。三人称命令法は、日本語では「者は……せよ」だと本人への直接命令に誤読されやすいため、「者には……させよ」として文法的な力を表した。受動態の主体は補わず、原文の緊張を保持した。
