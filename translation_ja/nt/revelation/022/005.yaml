id: REV.22.5
reference: Revelation 22:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: ja
  text: もはや夜はない。彼らには、ともしびの光も太陽の光も必要ない。主なる神が彼らを照らすからである。そして彼らは永遠に治める。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語を直訳すると「時代の時代に至るまで」。終わりのない永続を表す定型表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ οὐκ ἔσται ἔτι
  choice: もはや夜はない
  rationale: 存在・継続の終わりを表す句を、黙示文学の荘重さを保ちつつ自然な現代日本語で表した。
- source_word: οὐκ ἔχουσιν χρείαν
  choice: 必要ない
  rationale: ギリシア語は現在形であり、未来の情景の中で状態を生き生きと描いている。日本語では時制を過度に補わず、その状態を端的に表した。
- source_word: φωτὸς λύχνου καὶ φῶς ἡλίου
  choice: ともしびの光も太陽の光も
  rationale: 二つの光源の対比と反復を保った。「ともしび」は λύχνος の携帯用の灯火という意味に適し、文体にも調和する。
- source_word: κύριος ὁ θεός
  choice: 主なる神
  rationale: κύριος と θεός の結び付きを、日本語聖書として自然で荘重な表現にした。
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: 彼らを照らす
  rationale: 光が人々の上に及ぶ方向的なイメージを簡潔に表す。「光を与える」も可能だが、直前の光とのつながりを保つため「照らす」とした。
- source_word: βασιλεύσουσιν
  choice: 治める
  rationale: 王として統治することを表す動詞である。「支配する」よりも、この終末的な統治を自然かつ中立的に表す。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 永遠に
  rationale: 終わりのない持続を表す定型句を、一般の読者に明瞭な日本語で訳した。原文の字義的な形は脚注に示した。
theological_decisions:
- issue: 未来の幻の中で οὐκ ἔχουσιν が現在形であること
  choice: 「必要ない」とし、日本語で未来時制を明示しない
  alternative: 「必要としなくなる」または「必要ないだろう」
  rationale: 周囲の動詞は未来形だが、この現在形は到来する世界の状態を鮮明に描くものと理解できる。日本語の「必要ない」は文脈上未来の状態として自然に読め、原文の形も過度に均さない。
- issue: βασιλεύσουσιν の王権的含意
  choice: 「治める」
  alternative: 「王として治める」
  rationale: 動詞には王として統治する意味が含まれるが、主語を明示的に「王」と呼ぶところまでは本文に加えず、含意を保った自然な訳とした。
translation_notes:
  register: 明瞭な現代標準語を基調としながら、黙示録の終末的な荘重さを保った。「ともしび」「主なる神」は格調を損なわず一般読者にも理解できる語として採用した。
