  source_fidelity: 主な意味内容と、SBLGNT本文の「いのちの木」は正しく反映されている。だが、帰結節のἀφελεῖは神を主語とする能動態未来形であり、現行の「神は…取り除かれる」は受動形となっていて原文の文法的関係を反転させるおそれがある。
  naturalness: 「神は…取り除く」とすることで、明瞭で自然な現代標準日本語になり、警告の対称性も保たれる。「この書に記されている」は「いのちの木と聖なる都」の双方に係る位置に置く。
  terminology: 「預言の書」「言葉」「受ける分」「いのちの木」「聖なる都」はいずれも適切である。異読「いのちの書」の脚注もSBLGNT本文を優先しつつ有意な異読を示しており適切である。
  issues:
