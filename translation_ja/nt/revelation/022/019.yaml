id: REV.22.19
reference: Revelation 22:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: ja
  text: また、この預言の書の言葉から何かを取り除く者がいれば、神は、その人の受ける分を、この書に記されているいのちの木と聖なる都から取り除く。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: 取り除く／取り除かれる
  rationale: 条件節と帰結節にある同語根の対応を日本語でも保ち、行為とその報いの対称性を明確にした。後者は神を主語とする能動文の意味を保ちながら、自然な日本語の語順にした。
- source_word: λόγων
  choice: 言葉
  rationale: 預言の言語的内容を指し、本文を改変することへの警告にふさわしい直接的な訳語である。
- source_word: βιβλίου
  choice: 書
  rationale: 古代には巻物を指し得るが、黙示録全体を指す文脈では、現代日本語の聖書文体として自然で簡潔な「書」とした。
- source_word: προφητείας
  choice: 預言
  rationale: 文学的・神学的な種別をそのまま示し、不要な解釈的補足を避けた。
- source_word: μέρος
  choice: 受ける分
  rationale: 単なる物理的な「部分」ではなく、いのちの木と聖なる都にあずかる割り当て・参与を表すため、現代日本語で明瞭な表現とした。
- source_word: ξύλου τῆς ζωῆς
  choice: いのちの木
  rationale: 黙示録22章2、14節の直近の文脈と創世記以来の定着した表現に合致する。
- source_word: πόλεως τῆς ἁγίας
  choice: 聖なる都
  rationale: 定冠詞を伴う終末論的な都の呼称を、自然で荘重な日本語で表した。
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: すなわちこの書に記されているもの
  rationale: 属格複数の分詞句が直前の「いのちの木」と「聖なる都」をともに受けることを明瞭にし、完了受動の結果状態を「記されている」で表した。
theological_decisions:
- issue: 「いのちの木」と「いのちの書」の本文異読
  choice: いのちの木
  alternative: いのちの書
  rationale: 指定されたSBLGNTの ξύλου τῆς ζωῆς を本文に採用した。これは直近の22章2、14節ともよく調和する。伝統的に知られる異読は重要なので脚注に残した。
- issue: τῶν γεγραμμένων の係り先
  choice: 「いのちの木」と「聖なる都」の両方を受ける
  alternative: この書に記された事柄全般を指す、または直近の「聖なる都」のみを受ける
  rationale: 男性・中性の二項をまとめる複数属格として理解でき、英語POBの判断とも一致する。ただし原文の圧縮された統語を過度に説明せず、「もの」で包括的に示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、終末的警告の荘重さを保った。「者がいれば」は包括的で自然な条件表現。「すなわち」は原文に明示されないが、後置修飾の係り先を日本語で明確にするための最小限の補足である。
