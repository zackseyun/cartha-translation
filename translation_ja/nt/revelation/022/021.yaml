  text: Ἡ χάρις τοῦ κυρίου ⸀Ἰησοῦ μετὰ ⸀πάντων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/021.yaml
  text: The grace of the Lord Jesus be with all[a].
translation:
  language: ja
  text: 主イエスの恵みが、すべての人とともにありますように。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「主イエスの恵みが、すべての聖徒たちとともにありますように」、また別の写本では、「あなたがたすべてとともにありますように」とある。
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: 恵み
  rationale: 新約聖書の祝福の言葉として定着しており、神の好意と救いの賜物という響きを簡潔に保つ。
- source_word: κυρίου
  choice: 主
  rationale: イエスに対するキリスト論的称号として、自然で定着した訳語。
- source_word: Ἰησοῦ
  choice: イエス
  rationale: 固有名を現代日本語で定着した形に音写する。
- source_word: μετὰ
  choice: ともにありますように
  rationale: 原文は動詞を欠くが、結びの祝福として日本語で自然にするため願望表現を補った。
- source_word: πάντων
  choice: すべての人
  rationale: 本文の無限定な『すべて』を保ちつつ、日本語で対象を明瞭にする最小限の補足。『あなたがた』や『聖徒たち』には限定しない。
theological_decisions:
- issue: 祝福を受ける対象をどこまで明示するか
  choice: 「すべての人」とし、範囲を限定しない
  alternative: 「あなたがたすべて」または「すべての聖徒たち」
  rationale: SBLGNT本文の πάντων は無限定である。日本語として名詞化は必要だが、異読にある『聖徒たち』や『あなたがた』を本文へ持ち込まず、その広がりを保った。
translation_notes:
  register: 黙示録の結びにふさわしい、簡潔で格調ある現代標準日本語。祈願として自然な「ありますように」を用いた。
