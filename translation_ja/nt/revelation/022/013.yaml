  text: ἐγὼ τὸ Ἄλφα καὶ τὸ Ὦ, ὁ πρῶτος καὶ ὁ ἔσχατος, ⸀ἡ ἀρχὴ καὶ ⸀τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: ja
  text: わたしは、アルファであり、オメガである。最初であり、最後であり、初めであり、終わりである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「源であり、目標（到達点）である」とも訳せる。
    reason: ἀρχήは「源」、τέλοςは「目標・到達点」を意味することもあるため。
lexical_decisions:
- source_word: ἐγὼ
  choice: わたし
  rationale: 明示された一人称代名詞を訳出し、荘重な自己宣言の強調を保った。
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: アルファであり、オメガである
  rationale: ギリシア文字の最初と最後の名称を用いた、黙示録における象徴的称号をそのまま保持した。
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: 最初の者であり、最後の者
  rationale: 形容詞が名詞的に用いられているため「者」を補い、称号として自然な日本語にした。対句の均衡も保っている。
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: 初めであり、終わりである
  rationale: 前後の称号対と響き合う簡潔な対句として訳した。ἀρχήとτέλοςには「源」と「目標」という含意もあり得るため、脚注に示した。
theological_decisions:
- issue: 三組の自己称号が表す包括性と、その形而上学的含意を訳文でどこまで明示するか
  choice: アルファであり、オメガである。最初の者であり、最後の者、初めであり、終わりである。
  alternative: アルファであり、オメガである。最初の者であり、最後の者、源であり、目標である。
  rationale: 原文は三つの称号対を重ねており、説明を加えず、その対称性と荘重さを保つ。ἀρχήとτέλοςの意味の幅は一つに限定せず、代案を脚注で知らせる。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。三つの並行する称号対を際立たせるため、第一の対の後で文を区切りつつ、自己宣言の連続性を保った。
