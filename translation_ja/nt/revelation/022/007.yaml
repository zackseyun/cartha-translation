id: REV.22.7
reference: Revelation 22:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἰδοὺ ἔρχομαι ταχύ· μακάριος ὁ τηρῶν τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: ja
  text: 「見よ、わたしはまもなく[a]来る。この書物[b]の預言の言葉を守る人は幸いである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「速やかに」。ギリシア語は、時が近いこと（「まもなく」）にも、来る時の速さや突然性にも重点を置き得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「この巻物」。古代には書物が巻物の形で作られることがあった。
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 聞き手・読者の注意を促す標識語としての力と、黙示的宣言の厳粛さを簡潔に保つ。
- source_word: ἔρχομαι
  choice: わたしは来る
  rationale: 文脈上、未来に向かう現在形の宣言を自然な日本語で表し、原文にない話者名は補わない。
- source_word: ταχύ
  choice: まもなく
  rationale: この文脈では第一に時間的な近さを表すと判断した。ただし、速やかさ・突然性を表し得るため、別訳を脚注に示す。
- source_word: μακάριος
  choice: 幸いである
  rationale: 単なる感情としての幸福ではなく、祝福された状態を告げる定型的な宣言として表す。
- source_word: ὁ τηρῶν
  choice: 守る人
  rationale: 一般的な単数表現を自然に訳し、内容を保ち、心に留め、従うことを含み得る原語の幅を、「従う」と狭く限定せずに残す。
- source_word: τοὺς λόγους
  choice: 言葉
  rationale: 複数形の具体性を保ち、「内容」や「メッセージ」と要約しすぎない。日本語では文脈上、集合的な「言葉」が自然である。
- source_word: τῆς προφητείας
  choice: 預言の
  rationale: 原文の属格関係を保ち、この書物が自らを預言として示す表現を維持する。
- source_word: τοῦ βιβλίου τούτου
  choice: この書物
  rationale: 黙示録そのものを指す自己言及として自然で、現代の冊子体だけに限定されにくい「書物」を採用する。古代の物理的形態を意識した別訳は脚注に示す。
theological_decisions:
- issue: 「わたしは来る」の話者の同定
  choice: 原文どおり一人称だけを訳し、固有名を補わない。
  alternative: 本文で「イエスは」と明示する。
  rationale: ギリシア語本文には一人称の動詞だけがあり、話者の同定は文学的文脈に委ねられている。訳文で名を挿入して解釈を固定しない。
- issue: 「守る」の意味範囲
  choice: 「預言の言葉を守る」と訳す。
  alternative: 「預言の言葉に従う」と訳す。
  rationale: τηρέω は従順を含み得るが、保つ、心に留める、遵守するという幅もあるため、「従う」だけに狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「見よ」「幸いである」によって黙示的宣言と祝福の言葉にふさわしい格調を保った。原文の簡潔さと語順をおおむね維持し、話者名や「従う」などの解釈的な補足を本文に加えていない。
