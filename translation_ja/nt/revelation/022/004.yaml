id: REV.22.4
reference: Revelation 22:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὄψονται τὸ πρόσωπον αὐτοῦ, καὶ τὸ ὄνομα αὐτοῦ ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/004.yaml
  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: ja
  text: 彼らはその方の顔を見[a]、その方の名が彼らの額にある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その方の顔を仰ぎ見る」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: 見る
  rationale: ὁράωの未来形で、ここでは素直な未来の意味。「見る」が明快で自然な現代日本語であり、直接に顔を見るという意味を保つ。
- source_word: τὸ πρόσωπον αὐτοῦ
  choice: その方の顔
  rationale: πρόσωπονの基本義「顔」を採用する。「御顔」も可能だが、指示対象を神に限定する響きを強めかねないため、中立性と敬意を両立する「その方の顔」とした。
- source_word: τὸ ὄνομα αὐτοῦ
  choice: その方の名
  rationale: ὄνομαを通常どおり「名」と訳し、所属・人格・権威などの含意を本文へ説明的に加えない。αὐτοῦの指示対象も明示しない。
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: 彼らの額に
  rationale: ἐπί＋属格が表す位置を自然な日本語の「額に」で表す。複数の所有者は「彼らの」によって明示される。
- source_word: καὶ ... καὶ
  choice: …し、…
  rationale: 二つの節の加算的な連結を、日本語として自然な連用形と読点で保つ。
- source_word: αὐτοῦ
  choice: その方の
  rationale: ギリシア語の単数代名詞を固有名に置き換えず、直前の文脈における神と小羊との関係をめぐる指示上の緊張を保つ。日本語では単なる「彼の」より敬意を備えた「その方の」が文脈に適する。
theological_decisions:
- issue: 「その方」が指す対象
  choice: 単数表現「その方」を保ち、神とも小羊とも明示しない。
  alternative: 「神の」、または神と小羊の共有された統治を踏まえて両者に関わる表現と解する。
  rationale: 直前の22:3では神と小羊が密接に並び、本節は単数のαὐτοῦを二度用いる。訳文で指示対象を限定せず、原文の曖昧さと神学的緊張を維持する。
translation_notes:
  register: 明快で格調ある現代標準日本語。「その方」により敬意を示しつつ、代名詞の指示対象を神または小羊の一方へ限定しない。「仰ぎ見る」は可能だが、ὄψονται自体に上方を見る意味を加えうるため本文では簡潔な「見る」を採用した。
