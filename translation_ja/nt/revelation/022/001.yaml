id: REV.22.1
reference: Revelation 22:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: ja
  text: 御使いは私に、水晶のように輝く、いのちの水の川を見せた。それは、神と小羊の御座から流れ出ていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: 私に見せた
  rationale: 幻の中で案内者がヨハネに示す場面を、現代日本語で自然かつ直接的に表す。主語は直前の文脈上の案内者であり、日本語訳では理解のため「御使いは」と補った。
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: いのちの水の川
  rationale: 属格の連鎖と聖書的イメージを保ち、「命を与える川」などの解釈的言い換えを避ける。「いのち」は宗教的文脈でも一般読者に読みやすい表記とした。
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: 水晶のように輝く
  rationale: λαμπρόςの中心的な意味である明るさ・輝きを保ち、ὡςの比較を自然な日本語の「ように」で表す。透明さだけに限定しない。
- source_word: ἐκπορευόμενον
  choice: 流れ出ていた
  rationale: 川にふさわしい継続的な動きを自然に表し、現在分詞が描く進行中の光景を日本語では「ていた」で示す。
- source_word: ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: 神と小羊との御座から
  rationale: 単数の「御座」を保ち、神と小羊に結びつく一つの御座というギリシア語の構造を崩さない。「御座」は黙示文学の荘重な場面に適した定着語。
- source_word: τοῦ ἀρνίου
  choice: 小羊
  rationale: 黙示録におけるキリスト論的称号と犠牲のイメージを保つため、定着した「小羊」を用いる。
theological_decisions:
- issue: 神と小羊に結びつく単数の御座
  choice: 「神と小羊との御座」とし、御座を単数のまま訳す。
  alternative: 「神と小羊のそれぞれの御座」または複数の御座として訳す。
  rationale: 原文は単数の θρόνος に二つの属格が並ぶ。両者の関係を説明的に規定せず、幻が提示する共有された御座のイメージと神学的緊張をそのまま保つ。
- issue: 「いのちの水」の意味
  choice: 比喩を解釈せず「いのちの水」と訳す。
  alternative: 「命を与える水」または「生ける水」と意訳する。
  rationale: ὕδατος ζωῆς の属格が表す関係には豊かな聖書的含意があるため、一つの機能的説明へ狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「小羊」「御座」により黙示録の荘重さと定着した聖書的イメージを保った。長い修飾を読みやすくするため二文に分けた。脚注は不要と判断した。
