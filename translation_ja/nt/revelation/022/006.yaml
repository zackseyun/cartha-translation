id: REV.22.6
reference: Revelation 22:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: ja
  text: また、彼は私に言った。「これらのことばは信頼でき、真実である。預言者たちの霊の神である主は、間もなく[a]起こらなければならないことを、ご自分の奴隷たち[b]に示すために、ご自分の御使いを遣わされた。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「速やかに」。ギリシア語の表現は、時間的な近さ（「間もなく」）と、出来事が急速に進むこと（「速やかに」）のどちらをも表し得る。
    reason: alternative_reading
  - marker: b
    text: 「しもべたち」とも訳せる。原語は、主人に属する「奴隷」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: 信頼でき、真実である
  rationale: ことばの確かさと真実性という二つの要素を、自然な現代日本語で区別して保つ。
- source_word: ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: 預言者たちの霊の神である主
  rationale: 属格の関係を解釈的に「霊感を与える神」などとせず、原文の曖昧さを保った。κύριος は神的称号として「主」とした。
- source_word: ἄγγελον
  choice: 御使い
  rationale: 黙示録の幻的文脈では天的存在を指すため、日本語聖書で通用する尊厳ある語を用いた。
- source_word: δούλοις
  choice: 奴隷たち
  rationale: 神への所属と従属を示す語の強さを保持し、「しもべ」だけでは弱まり得る意味を明示した。
- source_word: ἃ δεῖ γενέσθαι
  choice: 起こらなければならないこと
  rationale: δεῖ の必然性と γενέσθαι の出来事として生じる意味を保った。
- source_word: ἐν τάχει
  choice: 間もなく
  rationale: 文脈上の時間的切迫を自然に表す一方、「速やかに」という出来事の進行速度を表す可能性は脚注に残した。
theological_decisions:
- issue: 終末論的文脈における ἐν τάχει の意味
  choice: 間もなく
  alternative: 速やかに
  rationale: 時間的な近さを主文に採るが、事態が始まってから急速に進む意味も語句上可能なので脚注で保持した。
- issue: 神の民を表す δοῦλοι の語感
  choice: 奴隷たち
  alternative: しもべたち／僕たち
  rationale: 神に属し、その権威の下にあるという強い関係を保つため「奴隷」を採用した。伝統的で穏当な訳語も脚注に示した。
- issue: 「預言者たちの霊」と神との関係
  choice: 預言者たちの霊の神
  alternative: 預言者たちに霊感を与える神／預言の霊の神
  rationale: 属格が所有、支配、起源などのどの関係を示すかを本文で断定せず、原文の神学的含みを保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「ことば」「御使い」は聖書文体として広く理解される表記を採用した。長い原文の構造は保ちつつ、日本語で主語と目的が追いやすい語順に整えた。
source_grounding:
  english_pob_role: consult_only
