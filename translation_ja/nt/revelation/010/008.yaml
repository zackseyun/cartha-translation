id: REV.10.8
reference: Revelation 10:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: ja
  text: そして、私が天から聞こえた声が、再び私に語りかけて、こう言った。「行って、海の上と陸[b]の上に立っている天使の手にある、開かれた巻物[a]を取りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「小さな巻物」。前後の節では「小さな巻物」を意味する指小形が使われているが、この節は βιβλίον（「巻物」）と記す。
    reason: alternative_reading
  - marker: b
    text: 「陸」は「地」または「大地」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: 声
  rationale: 天から語りかけるものを指しており、単なる物音ではなく伝達する「声」が自然である。
- source_word: πάλιν
  choice: 再び
  rationale: 天からの声がヨハネにもう一度語るという反復を、簡潔で品位ある現代日本語で表す。
- source_word: λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: 私に語りかけて言った
  rationale: μετάを伴う表現の関与性を「語りかけて」で示しつつ、二つの分詞を日本語として自然な叙述に整えた。
- source_word: Ὕπαγε
  choice: 行って
  rationale: 後続の命令「受け取りなさい」と自然につながる、率直な移動の命令として訳した。
- source_word: λάβε
  choice: 受け取りなさい
  rationale: 御使いの手にある巻物を取る場面であり、日本語では「受け取る」が自然である。強奪する含意は加えない。
- source_word: βιβλίον
  choice: 巻物
  rationale: 当時の書物形態と黙示録の場面に適合する。本文は指小辞ではないため、本文に「小さな」を加えない。
- source_word: ἠνεῳγμένον
  choice: 開かれた
  rationale: 完了受動分詞が示す、すでに開かれて現在もその状態にあることを自然に表す。
- source_word: ἐν τῇ χειρὶ
  choice: 手の中にある
  rationale: ἐνの位置的意味を保ち、巻物が御使いの手にあることを明示する。
- source_word: ἄγγελος
  choice: 御使い
  rationale: 黙示的幻に現れる天的存在を指すため。現代日本語の聖書文体として品位を保つ。
- source_word: ἑστῶτος
  choice: 立っている
  rationale: 完了形の分詞が表す継続中の立位を自然に示す。
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: 海と陸の上に
  rationale: 海とその対となる陸地という空間的な対比を表す。前置詞の反復は、日本語では一つの「上に」にまとめても意味が明瞭である。
theological_decisions:
- issue: 黙示的描写における γῆ の訳
  choice: 陸
  alternative: 地／大地
  rationale: ここでは御使いが海と陸にまたがって立つ視覚的場面であり、「陸」が直接的である。宇宙論的な意味に限定せず、別訳を脚注に残す。
- issue: 周辺文脈との関係における βιβλίον の訳
  choice: 巻物
  alternative: 小さな巻物／書物
  rationale: この節の語形は指小辞ではないため、周辺節の表現に調和させて「小さな」を本文へ補わない。歴史的・文学的場面から「巻物」とする。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「私」を用いて語り手を明示し、命令は「行って……受け取りなさい」と自然につないだ。脚注記号は該当語の直後に[a]、節末に[b]を置いた。
