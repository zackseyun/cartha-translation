  to: そして、私が天から聞こえた声が、再び私に語りかけて、こう言った。「行って、海の上と陸[b]の上に立っている天使の手にある、開かれた巻物[a]を取りなさい。」
  rationale: 本文は、原文の命令λάβeを「取りなさい」と明確に訳し、ἄγγελοςを中立的で現代的な「天使」とした。「天から聞こえた声」は原文の修飾関係を自然な日本語で示す。脚注aは本文が指小形ではないことを正しく説明しており維持した。脚注bは「陸」に移してアンカーを明確化した。
