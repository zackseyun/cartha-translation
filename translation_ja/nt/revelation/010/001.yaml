id: REV.10.1
reference: Revelation 10:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον ἰσχυρὸν καταβαίνοντα ἐκ τοῦ οὐρανοῦ, περιβεβλημένον νεφέλην, καὶ ἡ ἶρις ἐπὶ ⸂τὴν κεφαλὴν⸃ αὐτοῦ, καὶ τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος, καὶ οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: ja
  text: また私は、もう一人の力強い天使[a]が天から降って来るのを見た。その天使は雲をまとい、頭上には虹[b]があり、顔は太陽のようで、両足は火の柱のようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「もう一人の力ある天使」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は輝く「光輪」を指す場合もあるが、通常は「虹」を意味し、黙示録のイメージにも合う。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: もう一人の天使
  rationale: ἄγγελοςには「使者」の意味もあるが、天から降る黙示的な存在という文脈では「天使」が自然である。ἄλλονは同種の別の存在を示すため「もう一人の」とした。
- source_word: ἰσχυρὸν
  choice: 力強い
  rationale: 並外れた力を表しつつ、現代日本語で自然な形容とした。「力ある」「強大な」も可能である。
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: 天から降って来る
  rationale: 天を起点とする下向きの動きを、幻の場面の生き生きした動作として表した。
- source_word: περιβεβλημένον νεφέλην
  choice: 雲をまとい
  rationale: περιβάλλωの衣を着る、または包まれるという比喩を簡潔に保ち、雲に包まれた神顕現的なイメージも損なわない。
- source_word: ἡ ἶρις
  choice: 虹
  rationale: ἶριςの通常の意味であり、黙示録4章3節の虹のイメージとも対応する。光輪のような輝きを指す可能性は注で示した。
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: 頭上には
  rationale: ἐπίと対格が示す、頭の上方または頭に接する位置関係を、日本語として自然な「頭上」で表した。
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: 顔は太陽のようで
  rationale: 省略された連結表現を日本語で補い、顔の輝かしい外観を明瞭に伝えた。
- source_word: οἱ πόδες αὐτοῦ
  choice: 両足
  rationale: πούςの基本義を採用し、複数形を自然な日本語で「両足」とした。
- source_word: στῦλοι πυρός
  choice: 火の柱
  rationale: 属格による鮮明な比喩を保ち、聖書的なイメージとして定着した自然な表現を用いた。
theological_decisions:
- issue: 力強い天使の正体
  choice: 本文どおり「もう一人の力強い天使」と訳し、その正体を特定しない。
  alternative: 被造物である天使と明示する、またはキリストの顕現と解釈して訳す。
  rationale: ギリシア語本文はこの存在をἄλλον ἄγγελον ἰσχυρόνとだけ呼んでいる。被造物の天使かキリストを表す存在かについて本文だけでは決着しないため、解釈上の緊張を保持した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、幻の荘厳さと反復的な描写を保った。「御使い」より一般読者に分かりやすい「天使」を採用し、各比喩は説明的に言い換えず原文の視覚的な力を残した。
