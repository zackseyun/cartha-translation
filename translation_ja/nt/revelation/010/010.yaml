id: REV.10.10
reference: Revelation 10:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: ja
  text: 私は天使の手から小さな巻物[a]を受け取って食べた。それは口の中で蜂蜜のように甘かったが、食べると、私の腹は苦くなった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「小さな書物」。ギリシア語は小さな書き物を表す指小辞。
    reason: lexical_alternative
  - marker: b
    text: 「腹」は「胃」とも訳せる。ギリシア語は受動形だが、ここでは「苦くなった」と訳すのが自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: 小さな巻物
  rationale: 指小辞のニュアンスと、古代の書写物として想定される巻物の形態を自然な現代日本語で表す。「小さな書物」も可能だが、「巻物」のほうが歴史的な像に合う。
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: 御使いの手から
  rationale: 受け取る場面の具体的なイメージを保ちつつ、日本語として自然に表現した。
- source_word: κατέφαγον
  choice: 食べた
  rationale: 複合動詞に強意があり得るものの、ここで「食べ尽くした」とすると強調しすぎるおそれがあるため、象徴行為を端的に表す。
- source_word: ὡς μέλι γλυκύ
  choice: 蜜のように甘かった
  rationale: ὡςによる比較を自然に保ち、「蜜」は聖書本文にふさわしい簡潔で格調ある語とした。
- source_word: ὅτε ἔφαγον αὐτό
  choice: 食べ終えると
  rationale: 食べた後に腹が苦くなったという出来事の順序を明確にする。完食の強調ではなく、動作の完了後を示す自然な日本語表現である。
- source_word: ἐπικράνθη
  choice: 苦くなった
  rationale: 形態上は受動形だが、この文脈では状態変化を表す自然な日本語を優先した。「苦くされた」は作用者を過度に意識させ、不自然になりやすい。
- source_word: κοιλία
  choice: 腹
  rationale: 消化器を含む身体内部を指す語として、原語の幅を保つ。「胃」より限定的でなく、現代日本語でも明瞭である。
theological_decisions:
- issue: 巻物を食べる象徴行為
  choice: 甘さと苦さのイメージを説明せず、そのまま訳す。
  alternative: 甘さを喜び、苦さを裁きなどと本文中で解釈する。
  rationale: この節自体は象徴の意味を完全には説明していないため、翻訳ではその神学的緊張と余韻を保持する。
- issue: ἐπικράνθηの受動形
  choice: 日本語では状態変化として「苦くなった」とする。
  alternative: 受動形を表面上保って「苦くされた」とする。
  rationale: 原語の受動形が必ずしも外的作用者の明示を要求するとは限らない。日本語で不自然な神的受動の含意を加えず、文脈上明確な結果を表す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示文学の荘重さを保った。「御使い」は宗教的文脈で定着した語として採用し、文の連続するκαίは日本語の流れに合わせて区切り、「すると」「が」で関係を明示した。
