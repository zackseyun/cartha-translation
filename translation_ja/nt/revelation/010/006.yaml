id: REV.10.6
reference: Revelation 10:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: ja
  text: そして、永遠に生きておられる方、すなわち天とそこにあるもの、地とそこにあるもの、海とそこにあるものを造られた方にかけて、「もはや猶予はない[a]」と誓った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「もはや時はない」。ここでの「時」は、神が最終的に行動されるまでの待機期間、すなわち「猶予」を指すと考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: 誓った
  rationale: ὀμνύωのアオリストで、厳粛に誓いを立てることを表す。簡潔で自然な現代日本語として「誓った」とした。
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 永遠に生きておられる方にかけて
  rationale: 誓いの相手を示す与格を、日本語の誓約表現「～にかけて」で明示した。εἰς τοὺς αἰῶνας τῶν αἰώνωνは終わりのない持続を表す慣用句なので「永遠に」とした。
- source_word: ἔκτισεν
  choice: 造られた
  rationale: 宇宙的な創造を表すκτίζωに対応する。「創造された」より平明でありながら、創造主を指す文脈を保つ。
- source_word: τὸν οὐρανὸν
  choice: 天
  rationale: 天地と海から成る創造の定型的な列挙の一部であり、宇宙的領域を指すため「天」とした。
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: そこにあるもの
  rationale: 前置詞句が名詞化された反復構造を自然な日本語で保ち、天・地・海とそれぞれに属するものを並行して示す。
- source_word: γῆν
  choice: 地
  rationale: 天・地・海という宇宙的三分法の中にあるため、局地的な「土地」ではなく「地」とした。
- source_word: θάλασσαν
  choice: 海
  rationale: 単数形と創造の列挙をそのまま反映する標準的な訳語。
- source_word: ὅτι
  choice: 「……」と
  rationale: 誓いの内容を導くὅτιを、日本語では直接話法と引用助詞「と」によって自然に表した。
- source_word: χρόνος οὐκέτι ἔσται
  choice: もはや猶予はない
  rationale: 直訳では「もはや時はない」だが、続く10章7節は神の計画が成就することを告げるため、ここでは最終的な行動までの延期・待機期間がなくなる趣旨と理解した。脚注で直訳可能性も示した。
theological_decisions:
- issue: 誓いにおけるχρόνοςの意味
  choice: 神の最終的な行動までの「猶予」または「延期」
  alternative: 「もはや時はない」または「時はもはや存在しない」
  rationale: 直後の10章7節が神の奥義の成就を語るため、時間そのものの消滅よりも、待機期間の終了を告げる表現と読むのが文脈に合う。ただし原語の字義的な幅を隠さないよう脚注に別訳を掲げた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長い修飾節は「すなわち」で創造主の説明だと分かるようにし、「天・地・海」の三段構造と反復を保持した。
