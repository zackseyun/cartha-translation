id: REV.10.9
reference: Revelation 10:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: ja
  text: そこで私はその御使いのところへ行き、その小さな巻物[a]を私に下さるように言った。すると御使いは私に言う[b]。「これを取って食べなさい。そうすれば、あなたの腹[c]を苦くするが、あなたの口では蜜のように甘い。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「小冊子」。ギリシア語「ビブラリディオン」は指小語で、小さな巻物または冊子を指し得る。
    reason: lexical_alternative
  - marker: b
    text: または「御使いは私に言った」。ギリシア語は、物語を生き生きと描く歴史的現在形を用いている。
    reason: lexical_alternative
  - marker: c
    text: または「胃」。ここでのギリシア語は、腹部や内臓を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: その御使いのところへ行き
  rationale: ἀπέρχομαιのアオリストを、πρόςが示す移動先とともに自然な現代日本語で表した。「立ち去った」では文脈に合わない。
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: 私に下さるように言った
  rationale: 分詞λέγωνと不定詞δοῦναίによる発話内容を保ちつつ、日本語として自然にした。「お願いした」とすると原文にない丁寧さを補うため避けた。
- source_word: βιβλαρίδιον
  choice: 小さな巻物
  rationale: 指小形のニュアンスと、古代の物理的形態として可能性の高い巻物を表す。「小冊子」も語義上可能なので脚注に示した。
- source_word: λέγει μοι
  choice: 御使いは私に言う
  rationale: 物語を生き生きと描く歴史的現在を、日本語でも現在形によって保持した。
- source_word: Λάβε καὶ κατάφαγε αὐτό
  choice: これを取って食べなさい
  rationale: 二つの命令を明確に表した。κατάφαγεには強意があり得るが、日本語の「食べ尽くしなさい」はこの小さな巻物について過度に強く響くため、文脈上自然な「食べなさい」とした。
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: あなたの腹には苦いものとなる
  rationale: πικραίνωの苦味を生じさせる意味を保持し、摂食後の身体内部を指すκοιλίαを「腹」とした。原文の身体的イメージを解釈的に言い換えていない。
- source_word: γλυκὺ ὡς μέλι
  choice: 蜜のように甘い
  rationale: 直喩をそのまま保ち、自然で格調ある日本語とした。
theological_decisions:
- issue: 巻物を食べる象徴的行為
  choice: 「これを取って食べなさい」と具体的な命令のまま訳す
  alternative: 神の言葉を受け入れる、または内面化する行為として説明的に訳す
  rationale: 本文は象徴の意味をこの節で明示的に説明していないため、解釈を訳文へ織り込まず、預言的な象徴行為と甘さ・苦さの緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい簡潔で dignified な語調を保った。「御使い」は聖書文体として広く理解される表記を採用し、歴史的現在は不自然にならない範囲で保持した。
