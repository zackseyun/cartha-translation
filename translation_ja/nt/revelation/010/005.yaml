id: REV.10.5
reference: Revelation 10:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: ja
  text: そして、私が海の上と陸の上[a]に立っているのを見た天使は、右手を天へ[b]上げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地の上」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: または「天に向かって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος
  choice: 天使
  rationale: 文脈上、指示対象は天上の存在であるため、一般的な「使者」ではなく、現代日本語で明瞭な「天使」とした。
- source_word: ἑστῶτα
  choice: 立っている
  rationale: 完了形分詞が表す、立った結果としての現在の姿勢を自然な日本語で示した。
- source_word: ἐπὶ τῆς θαλάσσης
  choice: 海の上
  rationale: ἐπί＋属格の空間的な像を保ち、前後の幻の描写とも一致させた。
- source_word: ἐπὶ τῆς γῆς
  choice: 陸の上
  rationale: 直前の「海」と対をなす空間的な対照を明確にした。γῆのより広い意味は脚注に残した。
- source_word: ἦρεν
  choice: 上げた
  rationale: 手を上方へ挙げる動作を簡潔で自然に表した。
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: 右手
  rationale: 所有は日本語では文脈上明白なので重ねず、原文が明示する右手をそのまま示した。
- source_word: εἰς τὸν οὐρανόν
  choice: 天へ
  rationale: 方向を表すεἰςを簡潔に訳し、次節の誓いにつながる「天」の宗教的・荘厳な響きを保った。方向性を明示する訳は脚注に示した。
theological_decisions:
- issue: θάλασσαと対照されるγῆの訳
  choice: 陸
  alternative: 地、地上
  rationale: 幻の中で天使が海と陸という二つの領域にまたがって立つ視覚的対照を優先した。宇宙論的な「地」の含意を排除しないよう、別訳を脚注に示した。
- issue: οὐρανόςの訳
  choice: 天
  alternative: 空
  rationale: 次節で永遠に生きる創造者を指して誓う身ぶりへ続くため、単なる物理的な空に限定せず、原文の神学的な響きを保つ「天」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学の荘厳で視覚的な描写を保った。「すると」で叙述の進行を示し、修飾関係が分かりやすい語順に整えた。
