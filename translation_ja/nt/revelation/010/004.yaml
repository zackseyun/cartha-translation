reference: Revelation 10:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: ja
  text: 七つの雷が語ったとき、私は書き記そうとしていた。すると、天からの声を聞いた。その声はこう言った。「七つの雷が語ったことを封印し、それを書き記してはならない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では「それらを書き記してはならない」と複数形で、七つの雷が語った事柄を指す。
    reason: 原文の複数代名詞αὐτάの形を示すため。
lexical_decisions:
- source_word: αἱ ἑπτὰ βρονταί
  choice: 七つの雷
  rationale: 「雷鳴」よりも、七つの雷が語るという擬人化された黙示的表現を明瞭に保つ。
- source_word: ἐλάλησαν
  choice: 語った
  rationale: λαλέωの基本的な意味を保ちつつ、雷が意味内容を発したという文脈に自然に合う。
- source_word: ἤμελλον γράφειν
  choice: 書き記そうとした
  rationale: μέλλω＋不定詞が示す、実行の直前にあったことを自然な現代日本語で表す。
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν
  choice: 天から語りかける声
  rationale: 声の出所を「天」とし、話者の正体を本文以上に特定しない。λέγουσανの発話性も明示する。
- source_word: Σφράγισον
  choice: 封印し
  rationale: 啓示された内容を公にせず閉ざしておく命令を表し、黙示文学上の「封印」という語感を保つ。
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: 七つの雷が語ったこと
  rationale: 中性複数関係代名詞ἃが指す発言内容を、日本語で簡潔かつ自然に表す。
- source_word: μὴ αὐτὰ γράψῃς
  choice: それを書き記してはならない
  rationale: αὐτάは文法上複数だが、日本語では直前の「語ったこと」を内容全体として単数的に受ける「それ」が自然である。原文の複数形は注で示す。
theological_decisions:
- issue: 天からの声の話者を明示するか
  choice: 天から語りかける声
  alternative: 天からの神の声
  rationale: 原文は声の出所だけを示し、その正体を明言していないため、話者を神と特定せず曖昧さを保つ。
- issue: 七つの雷の発言内容をどのように受けるか
  choice: 「語ったこと」を内容全体として「それ」で受ける
  alternative: 複数性を表面化して「それら」とする
  rationale: 日本語としての自然さを優先しつつ、原文の複数形は脚注で開示して、複数の発言内容である可能性を消さない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「書く」ではなく「書き記す」を用いて、啓示を書面に記録する文脈を自然に示した。引用内は簡潔な命令形とし、厳粛さを保った。
