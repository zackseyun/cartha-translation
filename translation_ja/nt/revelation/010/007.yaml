id: REV.10.7
reference: Revelation 10:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: ja
  text: しかし、第七の天使の声が響く日々、その天使がラッパを吹こうとするとき、神の奥義は成就する。神が、ご自分の奴隷[a]である預言者たちに良い知らせを告げたとおりである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」とも訳せる。ギリシア語は「奴隷」と「しもべ」の両方の意味で用いられ、ここでは神に属する者であることが強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の内容との対比を示す逆接として、簡潔で自然な訳語を選んだ。
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: 第七の天使の声が響く日々に
  rationale: 「声」という原語を保ちつつ、日本語として意味が通るよう「響く」を補った。「ラッパを吹く」と同一視しすぎない表現である。
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: その天使がラッパを吹こうとするとき
  rationale: μέλλῃの切迫した未来性を「〜しようとする」で表し、σαλπίζεινに文脈上含まれるラッパを明示した。
- source_word: καὶ ἐτελέσθη
  choice: 神の奥義は成就する
  rationale: 形はアオリスト受動態だが、未来を指す時間節の中で、神の計画が実現に至ることを表すため、日本語では現在未来形の「成就する」とした。
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: 神の奥義
  rationale: 神によって隠され、示された計画という聖書的含意を保つ、定着した簡潔な表現を用いた。
- source_word: ὡς εὐηγγέλισεν
  choice: 良い知らせを告げたとおり
  rationale: εὐαγγελίζωの「良い知らせを告げる」という動詞的意味を明示し、名詞「福音」に限定しなかった。
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: ご自分の奴隷
  rationale: ἑαυτοῦが強調する神への帰属と、δοῦλοςが示す従属関係を保った。「しもべ」という自然な聖書語は脚注に示した。
- source_word: τοὺς προφήτας
  choice: 預言者たち
  rationale: 前の「奴隷」が誰であるかを同格で明示する原文を保った。
theological_decisions:
- issue: 神の預言者たちを指す δοῦλος の訳
  choice: 奴隷
  alternative: しもべ
  rationale: 現代日本語では強い語だが、神への全面的な帰属を示す原語の緊張を弱めずに残した。同時に、奉仕者としての側面を表す伝統的な代案を脚注に掲げた。
- issue: 未来的文脈における ἐτελέσθη の時制と意味
  choice: 成就する
  alternative: 成就した／完了する
  rationale: アオリストの形を機械的に過去形にせず、第七の天使がラッパを吹こうとする未来の時点で神の計画が実現する、という文脈上の時間関係を表した。特定の終末論的体系は付加していない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、黙示文学の荘重さを保つため「奥義」「成就する」を用いた。「声が響く日々」は原文の「声」を残しながら、日本語として理解できる形に整えた。
