id: REV.10.2
reference: Revelation 10:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ χειρὶ αὐτοῦ ⸀βιβλαρίδιον ἠνεῳγμένον. καὶ ἔθηκεν τὸν πόδα αὐτοῦ τὸν δεξιὸν ἐπὶ τῆς θαλάσσης, τὸν δὲ εὐώνυμον ἐπὶ τῆς γῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/002.yaml
  text: and having in his hand a little scroll that had been opened[a]. And he placed his right foot on the sea, and his left on the land[b],
translation:
  language: ja
  text: 彼は手に、開かれた小さな巻物[a]を持ち、右足を海の上に、左足を陸地の上に置いた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「小さな書物」。ギリシア語の βιβλαρίδιον は、小さな巻物または小冊子を指す指小形。
    reason: lexical_alternative
  - marker: b
    text: 「陸地」と訳したギリシア語の γῆ は、「地」または「大地」とも訳せる。ここでは「海」との対照に合わせた。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχων ἐν τῇ χειρὶ αὐτοῦ
  choice: その手には…持っていた
  rationale: 現在分詞は1節の御使いを修飾する。日本語では自然な叙述にしつつ、単数の「手」を保持した。
- source_word: βιβλαρίδιον
  choice: 小さな巻物
  rationale: 指小形が示す小ささと、黙示録の文脈における巻物のイメージをともに表す。「小冊子」より古代の書写形態を伝えやすい。
- source_word: ἠνεῳγμένον
  choice: 開かれた
  rationale: 完了受動分詞が表す、すでに開かれて現在も開いた状態を簡潔に示す。
- source_word: ἔθηκεν
  choice: 置いた
  rationale: 意図的に足を据える動作を、明快で自然な現代日本語で表した。
- source_word: τὸν πόδα αὐτοῦ τὸν δεξιόν
  choice: 右足
  rationale: 所有者は文脈上明白なため、日本語では冗長な「彼の」を省き、意味を正確に保った。
- source_word: ἐπὶ τῆς θαλάσσης
  choice: 海の上に
  rationale: ἐπί＋属格の位置関係と、幻に描かれる鮮明な像をそのまま表した。
- source_word: τὸν δὲ εὐώνυμον
  choice: 左足
  rationale: 並行表現で省略された「足」を日本語では補い、εὐώνυμοςの文脈上の意味「左」を明確にした。
- source_word: ἐπὶ τῆς γῆς
  choice: 陸地の上に
  rationale: γῆには「地」「大地」「陸地」の幅があるが、ここでは海との直接的な対照を明瞭にする「陸地」を選んだ。
theological_decisions:
- issue: θάλασσαと対照されるγῆの訳
  choice: 陸地
  alternative: 地／大地
  rationale: 一方の足を海に、もう一方を乾いた陸に置く空間的対照が中心であり、不要な宇宙論的含意を加えない。ただし語義上「地／大地」も可能なので脚注に示した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。ギリシア語の分詞構文は日本語として読みやすい独立節にし、完了受動の結果状態は「開かれた」で保持した。脚注記号は該当語句の直後に置いた。
