id: REV.10.11
reference: Revelation 10:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: ja
  text: そして、彼らは私に言った。「あなたは、諸民族、諸国民、諸言語、そして多くの王たちについて[a]、再び預言しなければならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「について」は、「に対して」または「を相手に」とも訳せる。
    reason: ἐπί＋与格が、預言の内容・対象だけでなく、語りかける相手を示す可能性もあるため。
lexical_decisions:
- source_word: λέγουσίν
  choice: 彼らは……言った
  rationale: 三人称複数形をそのまま保ち、文脈上の話者を単数に限定しない。歴史的現在は、自然な日本語の物語文として過去形で表した。
- source_word: Δεῖ σε
  choice: あなたは……しなければならない
  rationale: 神的・必然的な務めを示す非人称表現の強さを、明確で自然な義務表現で伝える。
- source_word: πάλιν προφητεῦσαι
  choice: 再び預言しなければならない
  rationale: πάλινの反復性と、προφητεύωの預言者的な宣言行為を直接保つ。
- source_word: λαοῖς καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς
  choice: 多くの民族、国々、言語、王たち
  rationale: 列挙された四つの集団・領域を省略せず保持する。λαοίとἔθνηの重なりを完全には解消せず、「民族」と「国々」で区別した。
- source_word: ἐπὶ
  choice: について
  rationale: 与格を伴うἐπίはここで預言の対象・内容を示すと理解でき、文脈に合う自然な訳とした。ただし方向・対面の含みもあり得るため脚注で示した。
theological_decisions:
- issue: 預言の対象を示すἐπίの解釈
  choice: 多くの民族等「について」預言する
  alternative: 多くの民族等「に対して／を相手に」預言する
  rationale: ἐπί＋与格には対象・関連の意味があり、英語POBの“about”とも一致する。一方、ヨハネが諸集団に直接語るという方向性も文法上排除しきれないため、本文で断定的に解消せず脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「彼ら」という複数主語を原文どおり残し、話者を特定しなかった。「王たち」は複数性を明示しつつ、一般読者に理解しやすい表現とした。
