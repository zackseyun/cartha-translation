revisions:
- from: すると、彼らは私に言った。「あなたは、多くの民族、国々、言語、王たちについて[a]、再び預言しなければならない。」
  to: そして、彼らは私に言った。「あなたは、諸民族、諸国民、諸言語、そして多くの王たちについて[a]、再び預言しなければならない。」
  rationale: 本文の主要な修正は、πολλοῖςの係り先を「多くの王たち」に限定して明示することです。これは英語POBの語順が示す広い修飾範囲ではなく、ギリシア語本文の形態統語を優先するものです。ἐπί＋与格の曖昧さを示す脚注は必要かつ適切なので保持しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:34:26Z'
review_pass:
  verdict: revise
  source_fidelity: 改訂が必要です。πολλοῖς（「多くの」）は男性・与格・複数で、直前のβασιλεῦσιν（「王たち」）を修飾します。現行の「多くの民族、国々、言語、王たち」は日本語では列挙全体を「多くの」が修飾するように読まれ、原文の係り先を広げています。ἐπί＋与格についての本文訳と注記は、原文の許容する「について」と対人的な方向性の両方を適切に扱っています。
  naturalness: 「そして、彼らは私に言った」は、原文のκαίを無理なく反映し、現行の「すると」よりも単純な接続です。「諸民族、諸国民、諸言語、そして多くの王たち」は明瞭で、四項目の列挙と「多くの」の係り先を自然に示します。
  terminology: προφητεῦσαιは「預言しなければならない」、Δεῖ σεは必然・委託を表す義務表現として適切です。λαοῖςとἔθνεσινの近接した二語は「諸民族／諸国民」として区別し、γλώσσαιςは集団的・言語的な意味を保って「諸言語」とします。話者を特定しない「彼ら」は原文に忠実です。
  issues:
  - severity: medium
    issue: 「多くの」の修飾範囲
    rationale: 原文のπολλοῖςはβασιλεῦσινと性・数・格が一致しており、「多くの王たち」を指す。日本語の現行語順では「民族、国々、言語、王たち」全体が多いとの意味になり得るため、係り先を明示する。
  - severity: low
    issue: καίの接続表現
    rationale: 「すると」は強い順接・結果の響きを持ち得る。原文は単純なκαίであるため、「そして」がより直接的である。
  revised_text: そして、彼らは私に言った。「あなたは、諸民族、諸国民、諸言語、そして多くの王たちについて[a]、再び預言しなければならない。」
  revised_footnotes:
  - marker: a
    text: 「について」は、「に対して」または「を相手に」とも訳せる。
    reason: ἐπί＋与格が、預言の内容・対象だけでなく、語りかける相手を示す可能性もあるため。
  revision_rationale: 本文の主要な修正は、πολλοῖςの係り先を「多くの王たち」に限定して明示することです。これは英語POBの語順が示す広い修飾範囲ではなく、ギリシア語本文の形態統語を優先するものです。ἐπί＋与格の曖昧さを示す脚注は必要かつ適切なので保持しました。
