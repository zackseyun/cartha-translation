id: REV.10.3
reference: Revelation 10:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: ja
  text: そして、獅子がほえるように、大声で叫んだ。彼が叫ぶと、七つの雷が、自分たちの声で語った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「七つの雷が、自分たちの声を発した」。ギリシア語は雷を語るものとして擬人化した、印象的な表現である。
    reason: 原文の「語った」と「自分たちの声」という結びつきには、日本語で「声を発した」と表せる側面もあるため。
lexical_decisions:
- source_word: ἔκραξεν
  choice: 叫んだ
  rationale: 強く声を上げる動作を表す。文脈にない苦悩の含みを加えず、力強さを自然な日本語で示す。
- source_word: φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 声の大きさを表す与格句。日本語では「大きな声で」も可能だが、「大声で」が簡潔で自然である。
- source_word: ὥσπερ λέων μυκᾶται
  choice: 獅子がほえるように
  rationale: 比較表現を保ち、獅子の発する力強い声を現代日本語で明瞭に表す。
- source_word: ὅτε
  choice: すると
  rationale: 先行する叫びに続いて起きたことを自然に示す。因果関係までは明示しない。
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: 七つの雷
  rationale: 定冠詞を伴う黙示的な既知の存在としての表現を保ち、雷を語る主体として擬人化する。
- source_word: ἐλάλησαν ... τὰς ἑαυτῶν φωνάς
  choice: それぞれ自分の声で語った
  rationale: λαλέωの「語る」を保って雷の擬人化を明示し、ἑαυτῶνの強意的な再帰性と複数性を「それぞれ自分の」で表す。日本語として理解可能な範囲で、原文の印象的な言い回しも残す。
theological_decisions:
- issue: 七つの雷の擬人化
  choice: 「七つの雷が、それぞれ自分の声で語った」とし、雷を発話主体として描く
  alternative: 「七つの雷が鳴り響いた」
  rationale: 原文はἐλάλησαν（語った）を用いて雷に発話させている。単なる雷鳴へと解消せず、黙示文学の擬人的な幻の描写を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ライオン」ではなく黙示録の文体に適する「獅子」を採用した。原文の反復（叫んだ／叫ぶと）と、七つの雷の擬人化を保持した。
