id: REV.14.7
reference: Revelation 14:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: ja
  text: 大声でこう言った。「神を恐れ[a]、神に栄光を帰しなさい。神の裁きの時が来たからである。そして、天と地と海と水の泉[b]を造られた方を礼拝しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神を畏れ敬え」とも訳せる。ここでのギリシア語には、裁きを前にした恐れと、神への深い畏敬の両方が含まれ得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「水の泉々」。ギリシア語の「泉」と「水」はともに複数形。
    reason: source_form
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: 大声でこう言った
  rationale: 前節の御使いを受ける分詞のつながりを自然な日本語の叙述にしつつ、φωνῇ μεγάλῃの強調を「大声で」に保った。
- source_word: Φοβήθητε τὸν θεόν
  choice: 神を恐れ
  rationale: φοβέομαιが持つ、裁きを前にした恐れと神への畏敬の両面を「恐れる」に保った。「畏れ敬う」だけに限定しない。
- source_word: δότε αὐτῷ δόξαν
  choice: 神に栄光を帰しなさい
  rationale: 「栄光を与える」という原文の具体的な表現を、日本語の聖書文体として明瞭な言い回しで表した。代名詞は指示対象を明確にするため「神」とした。
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: 神の裁きの時が来たからである
  rationale: ὅτιを理由として訳し、ὥραの切迫感を「時」に保った。「神の裁き」は、裁きを行う主体と神に属する裁きの含みを簡潔に伝える。
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: 造られた方を礼拝しなさい
  rationale: 実体詞的分詞の動作性を保ち、宗教的文脈におけるπροσκυνέωを「礼拝する」とした。
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν καὶ πηγὰς ὑδάτων
  choice: 天と地と海と水の源
  rationale: 創造を語る列挙の調子を保った。πηγάςは複数だが、日本語では「水の源」が複数の源をも自然に包括する。
theological_decisions:
- issue: Φοβήθητεが命じる「恐れ」の性質
  choice: 神を恐れ
  alternative: 神を畏れ敬え
  rationale: 裁きの到来、栄光、礼拝が結び付くため、単なる恐怖にも単なる尊敬にも限定せず、恐れと畏敬の緊張を残した。
- issue: τῆς κρίσεως αὐτοῦにおける属格の理解
  choice: 神の裁き
  alternative: 神が裁きを行う時
  rationale: 文脈上、神が裁くことを指すが、原文の簡潔な属格表現を保ち、説明を本文に加えすぎないようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を基調としながら、黙示文学の荘重さを保った。「栄光を帰す」「礼拝する」は一般読者にも理解可能な聖書語彙として用いた。
