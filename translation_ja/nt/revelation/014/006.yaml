id: REV.14.6
reference: Revelation 14:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: ja
  text: また私は、もう一人の天使が天の中ほど[a]を飛んでいるのを見た。その天使は、地上に住む人々[b]に、また、あらゆる国民、部族、言語、民族に告げ知らせるために、永遠の福音を携えていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「空の真ん中」「中天」。原語は、黙示文学に特徴的な、空の中央ないし高い所を表す語。
    reason: lexical_alternative
  - marker: b
    text: 原文では「地上に住む人々に、また、あらゆる国民、部族、言語、民族に」と二つの句が並列されている。なお「住む」と訳した語は字義的には「座っている」。黙示録では地上の住民を指す慣用的な表現として用いられる。
    reason: syntactic_and_lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: もう一人の御使い
  rationale: ἄλλονによる同種の別の存在という連続性を「もう一人」で自然に表し、黙示録の天的存在を指すἄγγελονには、聖書日本語として明確な「御使い」を用いた。
- source_word: πετόμενον ἐν μεσουρανήματι
  choice: 天の中ほどを飛んでいる
  rationale: 現在分詞の継続的な動きを保ち、μεσουράνημαの黙示文学的な空の中央・高所という像を、現代日本語で理解可能な表現にした。
- source_word: εὐαγγέλιον αἰώνιον
  choice: 永遠の福音
  rationale: 冠詞のない句だが、日本語では冠詞の区別を明示せずに原文の非限定性を保てる。「福音」は語の正報・喜ばしい知らせという意味と正典的響きを保持し、「永遠の」はαἰώνιονを直接反映する。
- source_word: ἔχοντα
  choice: 携えていた
  rationale: 単なる所有を表す「持っていた」より自然で、御使いが宣べ伝えるべき福音を伴っているという場面を示す。ただし巻物など特定の物体を持つとは限定しない。
- source_word: εὐαγγελίσαι
  choice: 告げ知らせるために
  rationale: アオリスト不定詞の目的を明示し、「福音を福音として伝える」という不自然な反復を避けつつ、喜ばしい知らせを公に宣べる意味を表した。
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: 地上に住む人々
  rationale: καθημένουςは字義的には「座っている」だが、ここでは地上の住民を指す黙示録的表現であり、姿勢の描写と誤解されない自然な日本語にした。
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: あらゆる国民、部族、言語、民族
  rationale: 四項から成る普遍的範囲と累積的なリズムを保持した。γλῶσσαはここでは身体器官でなく言語集団を特徴づける「言語」とした。
theological_decisions:
- issue: εὐαγγέλιον αἰώνιονを伝統的な教会用語で訳すか、一般語で訳すか
  choice: 永遠の福音
  alternative: 永遠の良い知らせ
  rationale: 「福音」は原語の意味と黙示録を含む正典的な連関を保つ一方、本文にない教派的内容を付加しない。日本語では定冠詞・不定冠詞を補わず、原文の冠詞なしという形を過度に解釈しない。
- issue: τοὺς καθημένους ἐπὶ τῆς γῆςを字義どおりの姿勢として訳すか、住民を表す慣用句として訳すか
  choice: 地上に住む人々
  alternative: 地上に座っている人々
  rationale: 黙示録で反復される地上の住民という範疇を伝え、姿勢だけを指すとの誤解を避ける。神学的評価を余分に加えず、表現の黙示文学的緊張を保つ。
- issue: 後半の四項を「地上に住む人々」と同格にするか、別の受け手として並列するか
  choice: 「すなわち」で同格的に示す
  alternative: 「また、あらゆる国民…に」と並列する
  rationale: ギリシア語は二つのἐπί句をκαίで結ぶため形式上の並列性もあるが、四項は地上の住民の普遍的範囲を詳述すると自然に理解できる。日本語で対象が二群あるとの誤解を避けるため同格を明示したが、統語上の並列可能性は注記に残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「御使い」「福音」は一般読者にも通じる聖書語として保持した。文末の読点に相当する未完結性は、この節が次節へ続くことにより示されるため、日本語では通常の句点とした。脚注標識は該当箇所の直後に置いた。
