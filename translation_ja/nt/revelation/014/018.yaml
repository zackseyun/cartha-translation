id: REV.14.18
reference: Revelation 14:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: ja
  text: また、別の御使いが祭壇から出て来た。この御使いは火を支配する権威を持っていた。そして、鋭い鎌を持つ者に大声で呼びかけた。「あなたの鋭い鎌を入れ[a]、地のぶどうの木[b]の房を収穫しなさい。そのぶどうはすでに熟しているからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あなたの鋭い鎌を遣わしなさい」。収穫の文脈では「鎌を入れ」と訳すことができる。
    reason: lexical_alternative
  - marker: b
    text: 「地のぶどうの木」は黙示的な比喩である。この節はそれが何を指すかを明言していないが、前後の文脈は裁きを描いている。
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: 別の御使い
  rationale: 黙示録の幻の場面では天的存在を指すため「御使い」とし、ἄλλοςの物語上の連続性を「別の」で表した。
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: 祭壇から出て来た
  rationale: θυσιαστήριονを「祭壇」とし、ἐκが示す起点と出現の動きを自然な日本語で表した。
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: この御使いは火を支配する権威を持っていた
  rationale: 冠詞付き分詞句が直前の御使いを説明していることを明確にし、ἐξουσίαを「権威」、ἐπὶ τοῦ πυρόςを「火を支配する」と訳した。
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: 大声で呼びかけた
  rationale: 同族語を用いたギリシア語の強調を、明瞭で自然な現代日本語にした。
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: 鋭い鎌を持つ者に
  rationale: 呼びかけの相手を示す与格と分詞句を保ち、δρέπανονとὀξύをそれぞれ「鎌」「鋭い」とした。
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: あなたの鋭い鎌を入れ
  rationale: πέμπωの基本義は「遣わす」だが、収穫の場面で「鎌を遣わす」は日本語として不自然なため、動作を自然に示す「鎌を入れ」とした。直訳的な意味は脚注に示した。
- source_word: τρύγησον τοὺς βότρυας
  choice: 房を刈り集めなさい
  rationale: τρυγάωは特にぶどうを収穫することを指し、βότρυςはぶどうの房を指す。鎌のイメージと収穫行為の双方が伝わる表現とした。
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: 地のぶどうの木
  rationale: 二重属格による黙示的な比喩を解釈で置き換えず、「地のぶどうの木」として保持した。
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: そのぶどうが熟した
  rationale: ἀκμάζωが表す成熟を「熟した」とし、σταφυλαίを集合的に自然な「ぶどう」で表した。
theological_decisions:
- issue: 「地のぶどうの木」が指すもの
  choice: 比喩を「地のぶどうの木」として本文に残した。
  alternative: 地上の悪人、または裁かれる人類と解釈して訳文に明示する。
  rationale: 周囲の文脈は裁きを強く示唆するが、この節自体は対象を明示せず黙示的な比喩で語っているため、その曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学にふさわしい荘重さを保った。「御使い」「祭壇」「権威」など定着した聖書語彙を採用し、比喩の指示対象は本文で説明しすぎないようにした。
