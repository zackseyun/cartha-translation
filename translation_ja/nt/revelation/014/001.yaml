id: REV.14.1
reference: Revelation 14:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: ja
  text: 私は見た。すると、見よ、子羊がシオンの山に立っていた。そして子羊とともに十四万四千人がいて、彼らの額には子羊の名とその父の名が記されていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「その父の名が彼らの額に記されていた」とだけあります。
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: それから私が見ると
  rationale: 幻の展開を示すκαίと知覚動詞を、現代日本語で自然な物語上の移行として表した。「私は見た」よりも、次に現れた光景へ注意を導く働きが明確になる。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 黙示文学に特徴的な注意喚起と高められた調子を保つため、簡潔で格調ある「見よ」とした。
- source_word: τὸ ἀρνίον
  choice: 子羊
  rationale: 黙示録におけるキリスト論的称号として定着した訳語。指小形を過度に字義化せず、称号としての重みを保つ。
- source_word: ἑστὸς
  choice: 立っていた
  rationale: ἵστημιの完了分詞が示す、立った状態にあることを日本語の継続的な状態表現で示した。
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: シオンの山に
  rationale: 地名Σιώνを「シオン」と音写し、日本語として自然な場所表現にした。
- source_word: μετ’ αὐτοῦ
  choice: 子羊とともに…がいて
  rationale: 代名詞の指示対象を明示して日本語での理解を助けつつ、子羊と十四万四千人との同伴関係を保った。
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: 十四万四千人
  rationale: 原文の正確な数を、通常の現代日本語の数表現で示した。人々を指すため「人」を補った。
- source_word: ἔχουσαι
  choice: その額には…記されていた
  rationale: 直訳的な「持っていた」を避け、後続する完了受動分詞と位置表現を自然な日本語の所在構文にまとめた。
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: 子羊の名とその父の名
  rationale: 二つの名がκαίで並列されていることを保持した。最初の代名詞は曖昧さを避けて「子羊」と明示し、父との区別と密接な関係の双方を保った。
- source_word: γεγραμμένον
  choice: 記されていた
  rationale: すでに書かれてその状態が続いているという完了受動の意味を自然に表した。「刻まれていた」ほど方法を限定しない。
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: その額には
  rationale: 複数の人々それぞれの額という意味を、日本語で自然な単数総称により表した。黙示録内の印との対照に重要な位置情報を保持した。
theological_decisions:
- issue: τὸ ἀρνίονの同定
  choice: 説明を加えず、称号として「子羊」と訳す。
  alternative: 「いけにえの子羊」「キリストである子羊」
  rationale: 文脈上は高く上げられたキリストを指すが、この節に明記されていない神学的説明を本文へ加えず、称号自体の聖書的響きを保つ。
- issue: 二つの名の関係
  choice: 「子羊の名とその父の名」とし、二つを並列する。
  alternative: 「子羊の名、すなわち父の名」
  rationale: ギリシア語は二つの目的語を並列しており、同格とは明示していない。子羊と父の区別を保ちつつ、両者への帰属の密接な結びつきを過度に解釈しない。
- issue: 額に記された名についての本文異読
  choice: SBLGNTに従い、「子羊の名とその父の名」を本文に置く。
  alternative: 「その父の名」のみ
  rationale: 底本は両方の名を含む。子羊の名を欠く写本異読は内容に実質的な影響があるため、脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、黙示文学の荘重な注意喚起として「見よ」を保持した。「子羊」「シオン」など読者に広く知られた聖書用語を用い、過度な説明的言い換えは避けた。脚注記号[a]は該当文の末尾に置いた。
