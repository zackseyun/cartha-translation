id: REV.14.16
reference: Revelation 14:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: ja
  text: そして、雲の上に座っている者[c]は、その鎌を地に入れた[a]。そして、地は刈り取られた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「その鎌を地に投じた」。ここでは、刈り入れのために鎌を地に向けて振るうことを表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「地は収穫された」。
    reason: lexical_alternative
  - marker: c
    text: 雲の上に座っている者は前節の文脈から「人の子」と同定されることが多いが、この節自体は単に「雲の上に座っている者」と述べる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔβαλεν
  choice: 投げかけた
  rationale: 基本義である「投げる、投じる」を保ちつつ、鎌を地に向けて振るう収穫の動作として日本語で理解できる表現。単なる「振った」より原文の具体的な動詞を反映する。
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: 雲の上に座っている方
  rationale: 冠詞付きの実名詞的分詞を描写のまま訳し、この節だけでは人物を「人の子」や御使いと明示していないことを保つ。「方」は威厳ある自然な日本語。
- source_word: τῆς νεφέλης
  choice: 雲
  rationale: 定冠詞は日本語では通常明示せず、直前の文脈に登場した雲を自然に指す。
- source_word: τὸ δρέπανον αὐτοῦ
  choice: その鎌
  rationale: δρέπανονの標準的な農具名を用い、所有代名詞も保持する。
- source_word: ἐπὶ τὴν γῆν
  choice: 地に
  rationale: 対格を伴うἐπίが示す方向性を簡潔に表す。「地の上で」ではなく、鎌が向けられる先を示す。
- source_word: ἐθερίσθη
  choice: 刈り取られた
  rationale: θερίζωのアオリスト受動態を受動表現のまま保ち、収穫と裁きの比喩を自然に伝える。
- source_word: ἡ γῆ
  choice: 地
  rationale: 黙示録の宇宙的文脈に合う訳語。前半と後半で同じ語を反復し、原文の強調を保つ。
theological_decisions:
- issue: 雲の上に座る者の正体
  choice: 本文では「雲の上に座っている方」と描写のみを訳す。
  alternative: 前節の文脈に基づいて「人の子」またはメシアと明示する／御使いと解する。
  rationale: この節のギリシャ語自体は人物名や身分を明示しないため、文脈上の同定を本文へ持ち込まず、解釈上の余地を残す。
- issue: 地が刈り取られることの神学的意味
  choice: 収穫の像をそのまま保持し、救済か裁きかを本文で限定しない。
  alternative: 「地への裁きが行われた」などと意味を明示する。
  rationale: θερίζωは収穫を表すが、この一節だけでその象徴的意味を説明的に確定すると原文の緊張を失う。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい簡潔さと威厳を保った。「方」は人物への敬意を自然に示すが、その正体を本文以上に断定しない。
