  source_fidelity: 原文は、雲の上に座る者が鎌を地へ向けて用い、その結果として地が刈り取られたことを述べる。日本語では「鎌を地に入れた」が刈り入れの具体的な動作を自然に表し、ἔβαλενの「投じる／放つ」という字義は注で保持するのが適切である。人物の正体は本文で特定しない。
  naturalness: 「鎌を地に投げかけた」は現代日本語としてやや不自然で、鎌を実際に投げる行為にも読める。「鎌を地に入れた」は収穫の文脈で明瞭かつ自然である。また、原文にない敬称的含意を避け、「方」ではなく「者」とする。
  terminology: δρέπανονを「鎌」、θερίζωの受動態を「刈り取られた」とするのは適切である。「地」を前後で反復してγῆの反復を保つ。雲上の人物の同定に関する英語監査証跡の注を日本語にも付し、本文の解釈的中立性を明確にする。
