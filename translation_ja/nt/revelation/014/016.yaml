- from: すると、雲の上に座っている方が、その鎌を地に投げかけた[a]。そして、地は刈り取られた[b]。
  to: そして、雲の上に座っている者[c]は、その鎌を地に入れた[a]。そして、地は刈り取られた[b]。
  rationale: 本文を「鎌を地に入れた」として、収穫の場面における日本語の自然な言い方を用いた。ἔβαλενのより字義的な「投じた」は注に残した。人物への敬称を避け、原文がこの節で正体を明示しない点を本文・注の双方で保持した。
