id: REV.14.15
reference: Revelation 14:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: ja
  text: また、別の御使いが聖所から出て来て、雲の上に座っている方に大声で叫んだ。「あなたの鎌を入れて刈り取ってください。刈り取る時が来たからです。地の収穫は熟しました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: 聖所
  rationale: 黙示録で神の臨在する天上の神殿の中心部を指す語として、「神殿」全体より限定的な意味を保つ。
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: あなたの鎌を入れて
  rationale: 直訳的には「あなたの鎌を送れ」だが、刈り入れの文脈で鎌を振るい始めることを自然な日本語で表す。
- source_word: θέρισον
  choice: 刈り取ってください
  rationale: 命令形を保持しつつ、目上または権威ある相手への発話として不自然にならない丁寧な命令表現とした。
- source_word: ἡ ὥρα θερίσαι
  choice: 刈り取る時
  rationale: ὥρα の定められた時という含みを簡潔に保つ。
- source_word: ἐξηράνθη
  choice: 熟しました
  rationale: 語義は本来「乾いた／枯れた」だが、穀物が刈り入れ可能な状態になったことを示す文脈的意味を採用し、過熟との限定は避ける。
theological_decisions:
- issue: 雲の上に座る者の明示的な同定
  choice: 「方」とし、本文中では同定しない
  alternative: 「者」または「人の子」と明示する
  rationale: 本文は τῷ καθημένῳ とだけ述べ、直前節の描写を受ける。敬意を示しつつ、この節自体が明示しない同定を追加しない。
- issue: 刈り入れが救いか裁きか
  choice: 中立的な「刈り取る／刈り入れ」とする
  alternative: 裁きまたは救済を明示する
  rationale: 比喩の神学的意味を訳文で一方に限定せず、周辺文脈に委ねる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の進行は「また」でつなぎ、天使の切迫した呼びかけは「大声で叫んだ」で表現した。引用内は敬語を用いるが、過度に古風な語法は避けた。
