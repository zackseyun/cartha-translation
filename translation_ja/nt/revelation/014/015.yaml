  to: また、別の御使いが聖所から出て来て、雲の上に座っている方に大声で叫んだ。「あなたの鎌を入れて刈り取ってください。刈り取る時が来たからです。地の収穫は熟しました。」
  rationale: 最終文のみを修正しました。原文のθερισμόςが指す収穫物を「収穫」と明示し、ἐξηράνθηの農耕的・文脈的な含意は、英語POBに沿って「熟しました」と保持しています。「過熟した」や「枯れた」と限定する訳にはせず、比喩の神学的解釈も加えていません。
