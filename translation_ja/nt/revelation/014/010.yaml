revisions:
- from: その者自身も、神の激しい怒りのぶどう酒を飲むことになる。それは、神の憤りの杯の中に、薄めずに混ぜられたものである。[a] また、その者は、聖なる御使いたちと小羊との前で、火と硫黄によって苦しめられる。
  to: その者自身もまた、神の激しい怒りのぶどう酒、すなわち神の憤りの杯の中で薄めずに調合されたものを飲むことになる。[a] また、その者は、聖なる御使いたちの前で、また小羊の前で、火と硫黄の中で苦しめられる。
  rationale: 原文のぶどう酒を修飾する分詞句を本文内で明確に結び付けた。「薄めずに調合された」は、κεκερασμένου（調えられた／混ぜられた）とἀκράτου（薄められていない）の双方を保ち、注で慣用的背景を説明する。さらに、「火と硫黄の中で」によりἐνの表象を限定せず、二度の「前で」によりἐνώπιονの反復を反映した。
