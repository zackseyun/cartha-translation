id: REV.14.10
reference: Revelation 14:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: ja
  text: その者自身もまた、神の激しい怒りのぶどう酒、すなわち神の憤りの杯の中で薄めずに調合されたものを飲むことになる。[a] また、その者は、聖なる御使いたちの前で、また小羊の前で、火と硫黄の中で苦しめられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「薄めずに調合された」は、直訳に近い表現。古代にはぶどう酒を水などと混ぜて調えることが一般的だったが、ここでは、杯の中で調えられながらも薄められていない、すなわち裁きが少しも和らげられていないことを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: その者自身も
  rationale: 強意の代名詞αὐτόςと付加を表すκαίを反映し、前節で述べられた個人を明確に指す。
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: ぶどう酒を飲むことになる
  rationale: 未来形を自然な現代日本語で表し、ἐκは日本語では目的語として処理するのが自然である。
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: 神の激しい怒り
  rationale: θυμόςが裁きの文脈で示す強烈な怒りを「激しい怒り」とし、後続のὀργήとの近接した語義差も保つ。
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: 薄めずに混ぜられた
  rationale: κεράννυμιの「混ぜる」とἄκρατοςの「薄めていない」の一見緊張する表現を、古代のぶどう酒の調合という背景を踏まえつつ、原文どおり保持する。
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: 神の憤りの杯の中に
  rationale: ἐνを「中に」とし、ὀργήを「憤り」と訳してθυμόςの「激しい怒り」と区別する。所有者は文脈上の神であるため明示した。
- source_word: βασανισθήσεται
  choice: 苦しめられる
  rationale: 未来受動形と刑罰的な苦痛を、過度に限定的な「拷問」ではなく、自然で重みのある表現で示す。
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: 火と硫黄によって
  rationale: θείονを現代語の「硫黄」とし、ἐνの手段的用法を「によって」で表す。
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: 聖なる御使いたちと小羊との前で
  rationale: ἐνώπιονを「前で」と訳し、二度の反復は日本語として簡潔にまとめながら、双方の面前という意味を保つ。
theological_decisions:
- issue: θυμόςとὀργήの訳し分け
  choice: θυμόςを「激しい怒り」、ὀργήを「憤り」とする
  alternative: 両方を「怒り」とする、またはθυμόςを「憤怒」、ὀργήを「怒り」とする
  rationale: 原文が近接して用いる二つの関連語を同一語に平板化せず、神の裁きの強さと杯の比喩を保つ。
- issue: τοῦ κεκερασμένου ἀκράτουの緊張を伴う表現
  choice: 「薄めずに混ぜられた」と形式的な緊張を保持する
  alternative: 「原液のまま注がれた」「一切薄められていない」と意味を解きほぐす
  rationale: 「混ぜられた」と「薄めていない」の双方が明示されており、黙って一方を消さず、注で古代の調合慣習を補う。
- issue: 小羊と御使いたちの前での苦しみ
  choice: 場所・面前を示す表現としてそのまま訳す
  alternative: 彼らが刑罰を執行する、または単に目撃するとの解釈を本文に加える
  rationale: ἐνώπιονは面前・臨在を示すが、その参与の仕方までは特定しないため、神学的含意を追加しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御使い」は聖書語として一般読者にも理解可能であり、「小羊」は黙示録の称号として保持した。原文の長い一文は、判断関係を明確にするため二文に分けた。
