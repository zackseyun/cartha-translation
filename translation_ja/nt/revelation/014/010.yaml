  source_fidelity: 「それは」として別文にすると、κεκερασμένου ἀκράτουが「ぶどう酒」を修飾する原文の構造がやや不明瞭になる。また、ἐν πυρὶ καὶ θείῳは手段の「によって」よりも、火と硫黄の中という場・状況を保つ訳が適切である。ἐνώπιονの反復も本文で保つことができる。
  naturalness: 「その者自身も、…飲むことになる」は理解できるが、「その者自身もまた、…飲むことになる」のほうが強意と付加を自然に示す。「薄めずに調合された」は、古代の酒を調える語法と「薄めない」の緊張を、現代日本語として無理なく表す。
  terminology: 「神の激しい怒り」と「神の憤り」によってθυμόςとὀργήの区別を保つ。「聖なる御使いたち」「小羊」は黙示録の文脈にふさわしく、維持できる。「硫黄」は現代標準語として適切である。
