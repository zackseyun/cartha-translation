  - severity: medium
    issue: ἐν πυρὶ καὶ θείῳを「火と硫黄によって」としている
    rationale: ἐνはここでは火と硫黄の中での苦痛という黙示文学的表象を示すと読むのが自然であり、単に刑罰の手段と限定しない「火と硫黄の中で」がより対応する。
