source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: ja
  text: ここに、神の戒めとイエスの信仰[a]を守る聖なる者たちの忍耐がある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスへの信仰」とも訳せる。あるいは「イエスの忠実さ」。ギリシア語の表現には曖昧さがある。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: ここに
  rationale: 直前に描かれた状況を指し示す語として、修辞的な力を保つ自然な日本語。
- source_word: ὑπομονὴ
  choice: 忍耐
  rationale: 試練のもとで堅く持ちこたえることを表す、簡潔で聖書文脈にもなじむ語。
- source_word: ἁγίων
  choice: 聖なる者たち
  rationale: 神に属する民という意味を明瞭に表し、「聖人」が帯びうる後代的・限定的な含意を避ける。
- source_word: τηροῦντες
  choice: 守る
  rationale: 神の戒めに従い、それを忠実に保つ意味を自然に表す。
- source_word: ἐντολὰς
  choice: 戒め
  rationale: 神から与えられた命令としての重みと聖書的な響きを保つ。
- source_word: πίστιν
  choice: 信仰
  rationale: 基本的な意味を保ち、属格との関係から生じる別の解釈は脚注に示す。
- source_word: Ἰησοῦ
  choice: イエスの
  rationale: ギリシア語の属格を形式上そのまま反映し、目的格的か主格的かを本文で決めつけない。
theological_decisions:
- issue: τὴν πίστιν Ἰησοῦ の意味
  choice: イエスの信仰
  alternative: イエスへの信仰／イエスの忠実さ
  rationale: 属格は、イエスを対象とする信仰とも、イエス自身の信仰または忠実さとも理解できる。本文では曖昧さを保ち、解釈上の選択肢を脚注に示す。
translation_notes:
  register: 明瞭で格調ある現代標準語。「聖なる者たち」は一般読者に意味が伝わりやすく、宗派的な含意も抑える。後半の同格関係は「すなわち」と名詞の補充で明示しつつ、原文の意味関係を変えない。
