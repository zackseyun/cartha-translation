id: REV.14.4
reference: Revelation 14:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοί εἰσιν οἳ μετὰ γυναικῶν οὐκ ἐμολύνθησαν, παρθένοι γάρ εἰσιν· ⸀οὗτοι οἱ ἀκολουθοῦντες τῷ ἀρνίῳ ὅπου ἂν ⸀ὑπάγῃ· ⸁οὗτοι ἠγοράσθησαν ἀπὸ τῶν ἀνθρώπων ἀπαρχὴ τῷ θεῷ καὶ τῷ ἀρνίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/004.yaml
  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: ja
  text: この人たちは、女性と交わって身を汚さなかった者たちである。彼らは童貞であるからである。[a] この人たちは、小羊がどこへ行こうとも、その後に従う者たちである。この人たちは、神と小羊にささげられる初穂として、人々の中から買い取られた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この表現は、字義どおりの性的禁欲だけでなく、霊的な純潔、または偶像礼拝による汚れから離れていることを象徴している可能性もある。
    reason: alternative_reading
  - marker: b
    text: 「人々の中から」は、男性だけでなく人間一般を指す表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμολύνθησαν
  choice: 身を汚さなかった
  rationale: 受動形だが、日本語では「身を汚す」が自然であり、道徳的・祭儀的な汚れの含意を保つ。
- source_word: μετὰ γυναικῶν
  choice: 女によって
  rationale: μετά＋属格の基本義は「～と」だが、否定された性的接触を日本語で自然に表しつつ、直後の「童貞」とのつながりを明瞭にするため「女によって」とした。γυναικῶνはここでは「妻たち」より「女」が適切。
- source_word: παρθένοι
  choice: 童貞
  rationale: 男性について用いられたπαρθένοιの具体的な意味を保持し、比喩的な「純潔な者」へ本文で解釈し直さない。
- source_word: ἀκολουθοῦντες
  choice: 後に従う
  rationale: 現在分詞が示す継続的・特徴的な行動を、自然な日本語で表す。
- source_word: ἀρνίῳ
  choice: 小羊
  rationale: 黙示録におけるキリスト論的称号・犠牲のイメージを保持する。
- source_word: ὅπου ἂν ὑπάγῃ
  choice: どこへ行こうとも
  rationale: ὅπου ἄν＋接続法の不定性「どこへでも／どこへ行こうとも」を格調ある自然な日本語で表す。
- source_word: ἠγοράσθησαν
  choice: 買い取られ
  rationale: ἀγοράζωの購買・贖いの比喩を保ち、「贖われ」と解釈的に限定しすぎない。
- source_word: ἀπὸ τῶν ἀνθρώπων
  choice: 人々の中から
  rationale: ἀνθρώπωνは男性だけでなく人間一般を指すため、性別を限定しない表現とする。
- source_word: ἀπαρχὴ
  choice: 初穂
  rationale: 神にささげられる最初の収穫という祭儀的・収穫的イメージを保持する。
theological_decisions:
- issue: 女によって汚されなかったことと童貞であることを、字義どおりに訳すか象徴として解釈して訳すか
  choice: 具体的表現を本文に保持し、「女によって身を汚さなかった」「童貞」と訳す。
  alternative: 偶像礼拝による霊的な汚れから守られた者、または霊的に純潔な者と本文で意訳する。
  rationale: 原文は具体的な性的・純潔の語彙を用いている。黙示録の象徴性は認めつつも、本文では解釈を決着させず、象徴的理解の可能性を脚注で示す。
- issue: ἀπαρχήの献納先をどう表すか
  choice: 「神と小羊にささげる初穂」とし、両者を一つの与格句として保持する。
  alternative: 「神のため、また小羊のための初穂」
  rationale: τῷ θεῷ καὶ τῷ ἀρνίῳは神と小羊の双方に関係する初穂を示す。「ささげる」は初穂の祭儀的含意を自然に明示するが、両者の関係をそれ以上規定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学にふさわしい荘重さを保った。「童貞」は現代日本語でやや直接的だが、原文の具体性と解釈上の緊張を保持するため採用した。脚注記号[a][b]は本文中に明示した。
