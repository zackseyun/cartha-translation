id: REV.14.19
reference: Revelation 14:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: ja
  text: 御使いは鎌を地に振るい、地のぶどうの木を刈り取り、それを神の怒りの大きなぶどう搾り場に投げ入れた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: 鎌を地に振るい
  rationale: 直訳的な「地に投げた」は鎌そのものを放り投げたように響くため、刈り入れの動作を表す文脈上の意味を自然な日本語で示した。「地に」は、鎌の働きが地上に向けられることを保持する。
- source_word: ἐτρύγησεν
  choice: 実を刈り取って
  rationale: ぶどうを収穫する語。後続の女性単数代名詞が「ぶどうの木」を受けるため、日本語では収穫される実を補って意味を明瞭にした。
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: 地のぶどうの木から実を
  rationale: ἄμπελος は「ぶどうの木／ぶどう園」を指しうるが、単数形と代名詞の照応を尊重して「ぶどうの木」とした。属格 τῆς γῆς は簡潔に「地の」とした。
- source_word: ληνὸν
  choice: ぶどう搾り場
  rationale: 収穫したぶどうを踏み搾る設備を指す。現代の一般読者に具体的に伝わる表現を選んだ。
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: 神の怒りという
  rationale: 属格は搾り場の性格・象徴内容を示すと理解し、日本語で関係が明瞭になるよう「という」とした。θυμός の激しい怒りの含意は「怒り」で自然に表現できる。
- source_word: τὸν μέγαν
  choice: 大きな
  rationale: ギリシア語では語順上、形容詞が節末に置かれて搾り場を修飾する。日本語では修飾対象の前に置いた。
theological_decisions:
- issue: 「神の怒り」と「ぶどう搾り場」の関係
  choice: 神の怒りという大きなぶどう搾り場
  alternative: 神の激しい怒りの大きなぶどう搾り場
  rationale: 比喩を保ちつつ、属格関係を自然な日本語で示した。「という」は怒りと搾り場を単純に同一視する教義的説明ではなく、黙示的象徴の対応を表す。
- issue: 刈り取られる対象
  choice: ぶどうの木から実を刈り取る
  alternative: 地のぶどうの木を刈り取る
  rationale: 原文は文法上「ぶどうの木」を目的語とするが、投げ入れられるものが収穫物であるという文脈を日本語で理解可能にした。象徴が誰を指すかは訳文で特定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。黙示文学の力強い連続動作を「振るい、…刈り取って、…投げ入れた」で保持した。
