source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: ja
  text: また私は、天からの音を聞いた[a]。それは大水の響きのようであり[b]、大きな雷鳴のようであった。また、私が聞いたその音は、竪琴奏者たちが自分たちの竪琴を奏でる音のようであった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「音」は「声」とも訳せる。ここでは、水や雷鳴、楽器の演奏にたとえられる響きを表すため、「音」と訳した。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「多くの水の響き」。大量の水が立てる圧倒的な響きを表す聖書的なイメージ。エゼキエル書43章2節参照。
    reason: lexical_alternative_and_cross_reference
  - marker: c
    text: 「竪琴」と訳したギリシア語のキタラは古代の弦楽器で、現代のハープよりリラに近い。
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: 音
  rationale: 水、雷、楽器の演奏にたとえられる聴覚的現象なので、発話者を暗示する「声」より「音」が文脈に合う。三つの用例を一貫して訳した。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から響いてくる
  rationale: οὐρανόςを単なる空ではなく天上の領域として「天」とし、日本語では音の到来を自然に表すため「響いてくる」を用いた。
- source_word: ὡς
  choice: 〜のよう
  rationale: 各句が比喩的な比較であることを明瞭に示す。
- source_word: ὑδάτων πολλῶν
  choice: 大水のとどろき
  rationale: 直訳的な「多くの水」では日本語で音のイメージが伝わりにくいため、膨大な水量が生む圧倒的な響きを「大水のとどろき」と表した。聖書的イメージは脚注で補った。
- source_word: βροντῆς μεγάλης
  choice: 激しい雷鳴
  rationale: μεγάληςが示す雷の規模と強烈さを、自然な現代日本語で表した。
- source_word: κιθαρῳδῶν
  choice: 竪琴を奏でる人たち
  rationale: 文脈では続く分詞が楽器の演奏を明示するため、歌い手という含みを加えず、演奏者として自然に訳した。
- source_word: κιθαριζόντων
  choice: 奏でている
  rationale: 楽器を演奏する動作を、格調を保ちつつ自然な日本語で示す。
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: 自分たちの竪琴を
  rationale: 所有を明示し、κιθάραは古代の弦楽器であることを踏まえて「竪琴」とした。
theological_decisions:
- issue: 天から聞こえたものの性質
  choice: φωνήを一貫して「音」と訳す
  alternative: 「声」と訳す、または箇所ごとに「声」と「音」を使い分ける
  rationale: 本文は水、雷、弦楽器という非言語的な響きとの類似を強調している。「音」は話者の存在を先取りせず、現象の正体に関する曖昧さを保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学の荘重さと音響的な反復を保った。「響いてくる」「とどろき」「雷鳴」「奏でる」によって自然な日本語のリズムを整えた。
