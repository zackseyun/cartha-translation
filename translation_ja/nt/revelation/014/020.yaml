id: REV.14.20
reference: Revelation 14:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: ja
  text: ぶどう搾り場は都の外で踏まれ、血はぶどう搾り場から出て[b]、馬のくつわに届くほどになり、千六百スタディオン[a]にわたった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: スタディオンは古代の距離の単位。千六百スタディオンは約296キロメートル。
    reason: cultural_note
  - marker: b
    text: 「血が流れ出て」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: 踏まれ
  rationale: 受動態の「踏む、踏みつける」という具体的な動作を保ち、ぶどう搾りと裁きのイメージを直接伝える。
- source_word: ληνός / ληνοῦ
  choice: ぶどう搾り場
  rationale: ぶどうを踏んで搾る設備を指す。現代の一般読者に意味が伝わりやすく、黙示的な収穫のイメージも保てる。
- source_word: ἔξωθεν τῆς πόλεως
  choice: 都の外で
  rationale: 空間的意味を簡潔に表す。「都」は黙示録における特定の都市を指す定冠詞付きの表現として自然である。
- source_word: ἐξῆλθεν αἷμα
  choice: そこから血が出て
  rationale: ἐξέρχομαιの基本義「出る」を保つ。「そこから」は直前のぶどう搾り場を自然に受ける。流動の含意はあり得るが、本文では明示的に補わない。
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: 馬のくつわに届くほどになり
  rationale: 血の達する高さを表す鮮烈な像を自然な日本語で保持する。
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: 千六百スタディオンにわたった
  rationale: 距離的な広がりを表す句として訳し、古代の単位は本文に保持する。換算値は注に置くことで、原文の具体性を損なわない。
theological_decisions:
- issue: 黙示的な誇張と象徴を説明的に和らげるか
  choice: 血、馬のくつわ、千六百スタディオンという具体的な像をそのまま保つ。
  alternative: 圧倒的な裁きを象徴する説明文に言い換える。
  rationale: 原文は意図的に鮮烈な黙示的裁きの情景を描いているため、翻訳で象徴の意味を一つに限定したり、表現を和らげたりしない。
- issue: 血がくつわまで達することを深さと明示するか
  choice: 「届くほど」とし、方向や測り方を限定しすぎない。
  alternative: 「くつわの高さまでの深さになった」とする。
  rationale: ἄχριは到達範囲を示すが、「深さ」は文脈上自然でも原文に明示されていないため、本文では補わない。
translation_notes:
  register: 明瞭で荘重な現代標準日本語を用いた。「酒ぶね」より一般読者に具体像が伝わりやすい「ぶどう搾り場」を採用しつつ、原文の受動表現と黙示的な緊張を保持した。
