id: REV.14.9
reference: Revelation 14:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: ja
  text: また、別の天使、すなわち第三の天使が彼らの後に続き、大声で言った。「もし誰かが獣とその像を礼拝し[a]、自分の額か手に刻印を受けるなら[b]、」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「獣とその像の前にひれ伏し」とも訳せる。原語はひれ伏す動作を表すことがあるが、ここでは礼拝を伴う忠誠を意味する。
    reason: lexical_alternative
  - marker: b
    text: 原文では「その人の額か、その人の手に」。単数形は「誰か」を受けている。
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: 別の天使、すなわち第三の天使
  rationale: ἄλλος（別の）と τρίτος（第三の）の両方を明示し、幻の中での順序を自然な日本語で保つ。
- source_word: ἠκολούθησεν αὐτοῖς
  choice: 彼らの後に続き
  rationale: 先行する者たちに続くという物語上の順序を、自然かつ明瞭に表す。
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: 大声で言った
  rationale: 宣告が公然と力強く発せられたことを簡潔な現代日本語で表す。
- source_word: Εἴ τις
  choice: もし誰かが
  rationale: 不定条件の普遍的な対象範囲を保持する。
- source_word: προσκυνεῖ
  choice: 礼拝し
  rationale: ここでは単なる身体動作ではなく、獣への宗教的忠誠を伴う行為を指すため。
- source_word: τὸ θηρίον
  choice: 獣
  rationale: 黙示録におけるこの黙示的存在の定着した訳語である。
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: その像
  rationale: αὐτοῦが獣を受ける関係を、日本語で性を不必要に付与せず明確に示す。
- source_word: λαμβάνει χάραγμα
  choice: 刻印を受ける
  rationale: λαμβάνειの受容・受け入れの意味と、χάραγμαの識別用の印という意味を保持する。
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: 自分の額か手に
  rationale: τιςを受ける単数代名詞の照応を、日本語として自然な再帰表現で示す。
theological_decisions:
- issue: 獣に対する προσκυνέω の宗教的意味
  choice: 礼拝する
  alternative: ひれ伏す
  rationale: 文脈は獣への偶像礼拝的な忠誠を問題としているため、「礼拝する」が中心的意味を最も明確に伝える。ただし原語には身体を伏せる動作も含み得るため脚注で示す。
- issue: τιςを受ける男性単数代名詞 αὐτοῦ
  choice: 自分の額か手に
  alternative: その人の額か手に
  rationale: ギリシア語の単数照応を保ちつつ、日本語では性別を加えず、条件節の主語との関係を自然に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「天使」は一般読者に直ちに理解できる語として採用した。原文が次節へ続く条件文の前半で終わるため、閉じない構文と読点を保持した。
