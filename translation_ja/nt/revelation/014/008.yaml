id: REV.14.8
reference: Revelation 14:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: ja
  text: また、もう一人、第二の天使が後に続いて、こう言った。「大バビロンは倒れた、倒れた。彼女は、自分の淫行[b]の激情[a]のぶどう酒を、すべての国々に飲ませた[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「激情」は「怒り」「憤激」、または激しい「情欲」とも訳せる。ギリシア語 θυμός は、激しい感情の両面を表し得る。
    reason: lexical_alternative
  - marker: b
    text: ここでの「淫行」は、諸国を堕落させる偶像礼拝や不忠実な影響を比喩的に表していると考えられるが、本文はその意味を一つに限定していない。
    reason: cultural_note
  - marker: c
    text: 「酔わせた」とも理解できる。ギリシア語は字義的には「飲ませた」と述べている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: 別の御使い、すなわち第二の御使い
  rationale: ἄλλος（別の）と δεύτερος（第二の）の双方を保ちつつ、「すなわち」によって現代日本語で同格関係を明確にした。
- source_word: ἠκολούθησεν
  choice: 後に続いて
  rationale: 幻の中で先の御使いに続いて現れる順序を自然に表す。
- source_word: Ἔπεσεν, ἔπεσεν
  choice: 倒れた、倒れた
  rationale: アオリストの反復と、預言的な宣告の切迫感をそのまま保つ。都市・帝国の没落にも自然な表現である。
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: 大いなるバビロン
  rationale: 固有名を音写し、称号的な ἡ μεγάλη を簡潔で荘重な日本語にした。
- source_word: ἣ
  choice: 彼女は
  rationale: 女性単数の関係代名詞が示す、バビロンを女性として描く擬人化を日本語でも明示した。
- source_word: τοῦ θυμοῦ
  choice: 激情
  rationale: θυμός が持つ激しい情熱・憤激・怒りの幅を一語で比較的よく保ち、文脈上の意味を一方に限定しない。
- source_word: τῆς πορνείας αὐτῆς
  choice: その淫らな行い
  rationale: 性的な像を明示しながら、偶像礼拝や不忠実などの比喩的含意を本文で一つに限定しない。
- source_word: πεπότικεν
  choice: 飲ませた
  rationale: ποτίζω の使役的意味を直接表す。完了形の結果的含意は文脈で保持される。
- source_word: πάντα τὰ ἔθνη
  choice: すべての国々
  rationale: ユダヤ人以外だけに限定せず、諸国民全体を指す黙示録の用法に合う。
theological_decisions:
- issue: バビロンの πορνεία の比喩性
  choice: 本文では「淫らな行い」とし、性的な像を保持する。
  alternative: 偶像礼拝／霊的不忠実／売春
  rationale: この節自体は比喩を一つの意味に限定していないため、解釈を本文へ織り込まず、複数の含意を残す。
- issue: 「その淫らな行いの θυμός」の意味
  choice: 「激情」と訳し、情欲と怒りの両方向を残す。
  alternative: 情欲／怒り／憤り
  rationale: θυμός は激しい感情を表し、この属格連鎖では熱情とも破壊的な怒りとも取り得る。「激情」はその緊張を比較的よく保持する。
- issue: バビロンの擬人化
  choice: 女性を示す「彼女」を用いる。
  alternative: それ／この都
  rationale: 原文の女性単数関係代名詞を反映し、黙示録における女性としての都市の描写を消さない。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、預言的宣告の反復と荘重さを保った。「倒れた、倒れた」は簡潔な反復として響かせ、比喩を説明的に言い換えすぎないようにした。
