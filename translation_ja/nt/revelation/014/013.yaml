  to: また私は、天からこう言う声を聞いた。「書き記せ。今から後、主にあって死ぬ者たちは幸いである。」御霊は言う。「はい。彼らがその労苦から解放されて休むことになるためである[a]。彼らの行いは彼らに伴うからである[b]。」
  rationale: 重複的・古風・不自然な表現を、黙示録にふさわしい節度を保った現代標準語に改めた。「主にあって」は保持し、ἵνα節の目的／結果の議論は注で保留した。ἀκολουθεῖ μετ’ αὐτῶν は「彼らに伴う」として、日本語として自然に随伴の意味を表した。
