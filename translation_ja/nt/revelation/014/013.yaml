id: REV.14.13
reference: Revelation 14:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: ja
  text: また私は、天からこう言う声を聞いた。「書き記せ。今から後、主にあって死ぬ者たちは幸いである。」御霊は言う。「はい。彼らがその労苦から解放されて休むことになるためである[a]。彼らの行いは彼らに伴うからである[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らがその労苦から休めるように」とも訳せる。ギリシア語の節は、目的または結果の含みを持ち得る。
    reason: alternative_reading
  - marker: b
    text: 「彼らの行いが彼らについて行く」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: 天からこう言う声
  rationale: φωνήを「声」、ἐκ τοῦ οὐρανοῦを自然な「天から」とし、分詞λεγούσηςは引用を導く「こう言う」で表した。
- source_word: Γράψον
  choice: 書き記せ
  rationale: 単数アオリスト命令形の直接性を保ちつつ、黙示の記録を命じる文脈にふさわしい自然で厳かな表現とした。
- source_word: Μακάριοι
  choice: 幸いである
  rationale: 聖書の祝福宣言として定着した表現であり、単なる感情上の「幸福」に狭めない。
- source_word: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: 主にあって死ぬ死者たち
  rationale: 二重の冠詞構文と「死者」という明示を保ち、ἐν κυρίῳの神学的な幅を解釈的に限定しないよう「主にあって」とした。
- source_word: ἀπ’ ἄρτι
  choice: 今から後
  rationale: 起点とそれ以後の継続を示す時間表現として、明瞭で自然な日本語を用いた。
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: 御霊も言う。「しかり」
  rationale: ναίの強い肯定を荘重な「しかり」で表し、τὸ πνεῦμαは文脈上の神の霊を示す「御霊」とした。「も」は先の天の声に続く確認であることを自然に示す。
- source_word: ἵνα ἀναπαήσονται
  choice: 彼らが…休むためである
  rationale: ἵναが示す目的・結果の含みを保持した。未来直説法の確実性は文脈に響くが、日本語では「ためである」が最も自然であり、曖昧さは注で示した。
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: その労苦を離れて
  rationale: κόποςの骨折り、疲労を伴う働きという意味を「労苦」で保ち、ἐκの離脱を「離れて」で明示した。
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: 彼らの行いが…からである
  rationale: ἔργαを文脈に即して自然な「行い」とし、γάρの理由提示を文末の「からである」で表した。
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: 彼らと共について行く
  rationale: μετάを省略せず「共に」で表し、ἀκολουθέωの随行の像を「ついて行く」で保った。
theological_decisions:
- issue: 「主にあって」死ぬことの意味
  choice: 「主にあって」をそのまま保つ
  alternative: 「主に忠実なまま」「主に属して」
  rationale: 主との結びつき、所属、忠実さなどを含み得る表現を一つの解釈に限定しないため。
- issue: ἵνα ἀναπαήσονταιの目的・結果と未来性
  choice: 「休むためである」と訳し、目的・結果の含みを注記する
  alternative: 「休むことになる」「休むことができるように」
  rationale: ἵναと未来直説法という形を踏まえつつ、日本語本文では目的と結果の双方に開かれた表現を選んだ。
- issue: 行いと幸いな死者との関係
  choice: 行いが彼らと共について行く、とだけ述べる
  alternative: 行いが救いを獲得する／死後に記憶されるにすぎない
  rationale: 本文は行いが伴うことを述べるが、その仕組みや功績性を明示しないため、教理的説明を加えない。
- issue: τὸ πνεῦμαの指示対象
  choice: 「御霊」
  alternative: 「霊」
  rationale: 定冠詞と黙示録の発言主体としての文脈から神の霊を指すと理解できるが、本文に「聖」という語は補わず「御霊」とした。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、黙示録の宣言にふさわしい荘重さを保った。「書き記せ」「幸いである」「しかり」「御霊」は聖書文体として理解可能な範囲で用い、全体は過度に古風にならないよう整えた。
