  verdict: revise
  source_fidelity: 本文はおおむね原文に忠実で、「主にあって」および行いと死者との関係を解釈的に狭めていない。ただし、ἵνα ἀναπαήσονται は日本語の「休むためである」では理由・目的の係り先が不自然に曖昧となる。結果・目的の含みを保ちながら、将来の休息を自然に表す必要がある。
  naturalness: 「主にあって死ぬ死者たち」は日本語として重複的で不自然である。「御霊も」の「も」は原文にない付加であり、「しかり」も明瞭な現代標準語としては古風である。「彼らと共について行く」も不自然な重複表現となっている。
  terminology: 「書き記せ」「幸いである」「主にあって」「御霊」は黙示録にふさわしく、主要な神学用語として維持できる。「御霊も」は「御霊は」に改める。「行い」は ἔργα の広さを適切に保つ。
  issues:
  - severity: medium
    issue: 「主にあって死ぬ死者たち」の重複
    rationale: οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες は「死者」と「死ぬ者」の双方を含む修辞だが、日本語で直結すると不自然である。「主にあって死ぬ者たち」という自然な関係節にして意味を保てる。
  - severity: medium
    issue: ἵνα節の日本語の係り受けが不自然
    rationale: 「彼らがその労苦を離れて休むためである」は、何の目的・理由なのかが日本語として不明瞭である。「彼らが労苦から解放されて休むことになる」とし、注で目的・結果の可能性を示す。
  - severity: low
    issue: 原文にない「も」と古風な「しかり」
    rationale: τὸ πνεῦμα に対する「も」は付加である。「はい」は ναί の肯定を明瞭な現代語で表せる。
  - severity: medium
    issue: 「彼らと共について行く」が不自然
    rationale: ἀκολουθεῖ μετ’ αὐτῶν の随伴を、日本語では「彼らに伴う」と表すのが自然であり、行いが死者と共にあるという意味も保てる。
