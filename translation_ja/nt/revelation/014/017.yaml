id: REV.14.17
reference: Revelation 14:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: ja
  text: また、別の天使が、天にある神殿[a]から出て来た。この天使も鋭い鎌を持っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「天にある聖所」。ギリシア語の「ナオス」は、神殿の中でも特に聖所を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: 別の天使
  rationale: ἄλλοςはここでは同種の者がさらに現れることを示す。「別の天使」は幻の中で続いて登場する天使を自然な現代日本語で表す。
- source_word: ἐξῆλθεν
  choice: 出て来た
  rationale: ἐξέρχομαιのアオリストで、内部から外へ現れる動きを表す。視点を幻の場面に置き、「出て来た」とした。
- source_word: ναοῦ
  choice: 神殿
  rationale: ναόςは神殿、より限定的にはその聖所を指し得る。本文では理解しやすい「神殿」を用い、限定的な意味の可能性は脚注に残した。
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: 天にある
  rationale: 神殿の所在を示す限定句として、簡潔かつ自然に訳した。
- source_word: ἔχων καὶ αὐτὸς
  choice: この天使も……持っていた
  rationale: καὶ αὐτόςが、この天使も先の登場者と同じく鎌を持つことを強調するため、「も」を明示した。ギリシア語の分詞は、日本語では独立した文にして自然に表現した。
- source_word: δρέπανον ὀξύ
  choice: 鋭い鎌
  rationale: 収穫に用いる刃物という具体的な像と、その鋭さを簡潔に保った。
theological_decisions:
- issue: 天にあるναόςのイメージ
  choice: 本文では「天にある神殿」と直訳的に表現する。
  alternative: 「天にある聖所」として神殿内部の聖域を強調する、または象徴的な神の住まいと意訳する。
  rationale: 黙示文学的な神殿像を、建築的・象徴的・典礼的なもののいずれかに限定せず、原文のまま保つため。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「天使」「神殿」「鋭い鎌」によって荘重さと分かりやすさを両立させ、長い分詞構文は二文に分けて自然な語順にした。
