  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: ja
  text: そして彼らは、御座の前、また四つの生き物と長老たちの前で、新しい歌のようなもの[a]を歌っている。その歌を学ぶことができたのは、地上から買い取られた[b]十四万四千人のほかには、だれもいなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「新しい歌として」。ギリシア語は「～のように／～として」を表す語を用いており、黙示録の幻の描写では見聞きした事柄の様態を示すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「贖われた」とも訳せる。ギリシア語の動詞は、字義的には「買う」「買い取る」という意味。
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: 歌っている
  rationale: 現在形による幻の生き生きとした描写を、自然な現代日本語の進行表現で示した。
- source_word: ὡς ᾠδὴν καινὴν
  choice: 新しい歌と思われるもの
  rationale: ὡς が示す幻視上の知覚・様態を保ち、それが実際には新しい歌ではないと断定することも避けた。
- source_word: ἐνώπιον
  choice: 前で
  rationale: 御座と天上の存在たちの面前という空間的・臨在的意味を簡潔に表した。
- source_word: τῶν τεσσάρων ζῴων
  choice: 四つの生き物
  rationale: 黙示録で御座を囲む天上の存在を指すため、「獣」や「動物」ではなく、文脈に即して訳した。
- source_word: τῶν πρεσβυτέρων
  choice: 長老たち
  rationale: 天上の会議を構成する一群の呼称として、定着した自然な訳語を用いた。
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: 学ぶことができたのは……だれもいなかった
  rationale: 能力を表す未完了過去と不定詞の意味を保ちつつ、日本語として自然な構文にした。
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: 十四万四千人
  rationale: 数を現代日本語で明瞭に示し、定冠詞によって特定される集団であることは文脈と構文で表した。
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: 地上から買い取られた
  rationale: ἀγοράζω の売買の比喩を本文に残し、完了受動分詞の結果状態も「買い取られた」で表した。γῆ はこの文脈で人間の住む地上を指すものとして訳した。
theological_decisions:
- issue: 幻視描写における ὡς の効力
  choice: 「新しい歌と思われるもの」
  alternative: 「新しい歌のようなもの」または「新しい歌として」
  rationale: 幻の中でそう知覚されたという含みを示しつつ、その歌の本質について断定しないようにした。
- issue: ἠγορασμένοι の訳し方
  choice: 「買い取られた」
  alternative: 「贖われた」
  rationale: 原文の市場・売買の比喩を直接保った。「贖われた」は文脈上可能な神学的表現だが、語の基本的な比喩を解釈によって置き換えないため脚注に回した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御座」は黙示録の天上の王座を指す聖書語として保持した。語順は原文の二つの文を保ちながら、日本語で主語・焦点関係が明確になるよう整えた。
