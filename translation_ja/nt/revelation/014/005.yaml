base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/005.yaml
  text: And in their mouth no lie was found[a]; they are blameless.
translation:
  language: ja
  text: 彼らの口には偽りが見いだされなかった。彼らは傷のない者[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「非難されるところのない者」または「責められるところのない者」とも訳せる。ギリシア語は、道徳的に非難されるところがないことに加え、いけにえに傷や欠陥がないというイメージも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ στόματι αὐτῶν
  choice: 彼らの口には
  rationale: 単数形「口」の集合的な用法を保ちつつ、日本語で自然な表現とした。発言の内容を指すギリシア語の言い回しも反映している。
- source_word: οὐχ εὑρέθη
  choice: 見いだされなかった
  rationale: アオリスト受動形を受動表現で訳し、彼らが積極的に何かをしたというより、偽りが存在しなかったことへの原文の焦点を保った。
- source_word: ψεῦδος
  choice: 偽り
  rationale: 発言における虚偽を簡潔かつ格調を損なわずに表す。「うそ」より文体に適し、「欺き」ほど意図性を強調しない。
- source_word: ἄμωμοί
  choice: 傷のない者
  rationale: 道徳的に責められるところがないという意味と、いけにえの無傷・無欠陥という祭儀的イメージの両方を比較的よく保持する。現代日本語で意味を明確にするため脚注を付した。
- source_word: καὶ
  choice: （前文との連続を文脈上保持）
  rationale: 日本語では文頭の「そして」を置くとやや不自然になり得るため明示しなかったが、前節から続く描写として訳文の流れに保持した。
theological_decisions:
- issue: ἄμωμοίが表す倫理的な非難のなさと、祭儀的な無傷性との両義性
  choice: 傷のない者
  alternative: 非の打ちどころがない者／責められるところのない者
  rationale: 「傷のない」は犠牲の清さを想起させる比喩を残しながら、文脈上は倫理的な潔白も表し得る。絶対的な無罪性という一義的理解に固定せず、意味の幅を脚注で示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「見いだされなかった」により原文の受動形を保ち、「傷のない者」により倫理的意味と祭儀的イメージの緊張を残した。脚注記号は該当語句の直後に配置した。
