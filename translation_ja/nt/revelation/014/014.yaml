id: REV.14.14
reference: Revelation 14:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: ja
  text: また、私は見た。すると、見よ、白い雲があった。その雲の上には、人の子のような者[a]が座っていた。その頭には金の冠[b]があり、その手には鋭い鎌があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人の子のような方」とも訳せる。この表現はダニエル書7章13節を響かせ、一般にメシアを指す称号と理解されている。ただし、ここのギリシア語には冠詞がなく、字義的には「人の子のような者」である。
    reason: alternative_reading
  - marker: b
    text: ここで「冠」と訳したギリシア語ステファノスは、王権を表す王冠というより、しばしば勝利者に与えられる冠を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: ヨハネの幻の叙述にある、突然注意を促す生き生きとした力を保つ。黙示文学の文脈にふさわしい格調もある。
- source_word: νεφέλη λευκή
  choice: 白い雲
  rationale: λευκήの基本的な意味をそのまま伝え、「輝く」などの解釈的な意味を加えない。
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: その雲の上に……座っていた
  rationale: 座した状態を表す分詞を、明瞭で自然な現代日本語にした。
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: 人の子のような者
  rationale: ὅμοιονを「ような」、冠詞のないυἱὸν ἀνθρώπουを「人の子」とし、ダニエル書への響きを保ちながら、本文で固定的な称号と断定しない。
- source_word: στέφανον χρυσοῦν
  choice: 金の冠
  rationale: 明瞭で自然な訳語。στέφανοςが王の王冠よりも勝利者の冠を指すことが多いという語義上の含みは脚注に残した。
- source_word: δρέπανον ὀξύ
  choice: 鋭い鎌
  rationale: 刈り入れの場面に適合する、標準的で分かりやすい訳語。
theological_decisions:
- issue: υἱὸν ἀνθρώπουを明示的なキリスト論的称号として訳すか
  choice: 本文では「人の子のような者」とした
  alternative: 「『人の子』のような方」
  rationale: ギリシア語ではυἱὸνに冠詞がなく、本文だけで固定的な称号と断定することを避けた。一方、ダニエル7章13節への明白な響きとメシア的理解の可能性は脚注に示し、神学的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」により黙示文学にふさわしい格調と臨場感を保った。「また私が見ると」でΚαὶ εἶδονを自然に表し、短い視覚的描写として読みやすく整えた。
