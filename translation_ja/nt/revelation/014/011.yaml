id: REV.14.11
reference: Revelation 14:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: ja
  text: 彼らの苦しみの煙は、永遠に立ち上る[a]。獣とその像を礼拝する者たち、また、だれかが獣の名の刻印を受けるなら、その者には、昼も夜も休みがない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すれば「世々の世々に至るまで」。継続を最も強く表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は、「獣とその像を礼拝する者たち」の後に、単数の不定条件「そして、もしだれかがその名の刻印を受けるなら」と唐突に続く。日本語では意味を明確にするため、「昼も夜も休みがない」をこの条件にも適用して訳している。
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: 煙
  rationale: 黙示的な裁きの具体的な光景を、そのまま自然な日本語で表す。
- source_word: βασανισμοῦ
  choice: 苦しめる
  rationale: 属格を「彼らを苦しめる煙」と関係節的に表し、苦痛を伴う裁きという意味を保ちつつ、方法を「拷問」と限定しない。
- source_word: εἰς αἰῶνας αἰώνων
  choice: 永遠に
  rationale: 黙示録で継続期間を強く表す定型句の力を、自然で簡潔な日本語にした。字義的な形は脚注に示す。
- source_word: ἀναβαίνει
  choice: 立ち上る
  rationale: 煙について自然な動詞であり、現在形が描く継続的で鮮明な光景を保つ。
- source_word: ἀνάπαυσιν
  choice: 安息
  rationale: 単なる一時的な軽減より広い「休み」の意味を保ち、文体上の尊厳にもかなう。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼も夜も
  rationale: 絶え間ない継続を表す自然な日本語。
- source_word: προσκυνοῦντες
  choice: 礼拝する
  rationale: 黙示録の文脈で、獣への宗教的忠誠を伴う崇敬を適切に表す。
- source_word: θηρίον
  choice: 獣
  rationale: 黙示録の象徴的存在に対する定着した訳語。
- source_word: εἰκόνα
  choice: 像
  rationale: 像、似姿、偶像を含み得る広さを保ち、文脈にも自然に合う。
- source_word: εἴ τις λαμβάνει
  choice: 受ける者がいるならば
  rationale: 複数の分詞表現から単数の不定条件文へ移るギリシア語の急な構文転換を、理解可能な範囲で保持する。
- source_word: χάραγμα
  choice: 刻印
  rationale: 彫り付けられた印・標識という語感を表し、黙示録における識別のしるしを示す。
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: その名の刻印
  rationale: 属格の関係を解釈しすぎず保持する。「その名を記した刻印」などの説明的な限定を避ける。
theological_decisions:
- issue: εἰς αἰῶνας αἰώνων が表す裁きの期間
  choice: 「永遠に」と訳す
  alternative: 「代々限りなく」「幾世代にもわたって」
  rationale: 黙示録でこの重ねた慣用句は、継続期間を最も強く表す。特定の教理体系を付加せず、その本文上の力を保つ。
- issue: 末尾の εἴ τις λαμβάνει の統語関係
  choice: 「そして、その名の刻印を受ける者がいるならば」と、独立性のある条件表現を保つ
  alternative: 「また、その名の刻印を受ける者たちには」と前文へ滑らかに統合する
  rationale: 原文は複数分詞から単数の不定条件へ急に移行する。日本語として意味が通る範囲でこの唐突さを残し、末尾句の統語関係を断定的に整えない。
translation_notes:
  register: 明瞭で現代的ながら、黙示録の荘重な裁きの場面にふさわしい文体。「安息」「礼拝」「刻印」は文脈上明確で、一般読者にも理解可能。原文末尾の統語的な唐突さは脚注を伴って保持した。
