source:
  edition: SBLGNT
  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: ja
  text: 'ヨハネから、アジアにある七つの教会へ。


    恵みと平安が、今おられ、かつておられ、来られる方[a]から、また、その方の御座の前にいる七つの霊[b]から、'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「今おられ、かつておられ、来るべき方」。
    reason: lexical_alternative
  - marker: b
    text: 「七つの霊」は、聖霊の完全さを象徴するとも、七つの天的な霊を指すとも考えられる。ギリシャ語本文は「七つの霊」と記している。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: ヨハネ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: 七つの教会へ
  rationale: ἐκκλησίαは集会を意味し得るが、ここではキリスト者の共同体への書簡という文脈に即して、自然で定着した「教会」とした。与格の宛先は「へ」で表した。
- source_word: ἐν τῇ Ἀσίᾳ
  choice: アジアにある
  rationale: 原文の地名をそのまま保った。ここでのアジアは現代の大陸全体ではなく、ローマ属州アジアを指す。
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: 恵みと平安が
  rationale: 書簡の祝福として定着した語を用い、文脈上「あなたがたにありますように」へ続く構文とした。本節は次節まで続くため、ここでは祝福文を完結させていない。
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: 今おられ、かつておられ、来られる方から
  rationale: 神を指す荘重な称号として敬語を用いた。ὁ ἐρχόμενοςの現在分詞的な動きを保つため「来られる方」とし、「来るべき方」と限定しなかった。前置詞の後に主格形を置く原文の意図的な文法的不規則さは、日本語本文では再現不能だが、称号としてのまとまりを保った。
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: 七つの霊
  rationale: 原文の複数形をそのまま訳し、「七重の御霊」などの解釈的な訳語は本文に採用しなかった。
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: その方の御座の前にいる
  rationale: 霊的存在を指す可能性に適した「いる」を用いた。「その方」により、直前の神的称号を受けるαὐτοῦの指示関係を自然に示した。θρόνοςは荘重な文体に合わせて「御座」とした。
theological_decisions:
- issue: 「今おられ、かつておられ、来られる方」の表現
  choice: 神を指す称号として「今おられ、かつておられ、来られる方」と訳した。
  alternative: 「今おられ、かつておられ、来るべき方」
  rationale: ὁ ἐρχόμενοςは文字どおりには「来ている／来られる方」であり、伝統的な「来るべき方」も可能である。本文では現在分詞の動的な響きを保ち、別訳を脚注に示した。
- issue: 「七つの霊」の正体
  choice: 本文では複数形の「七つの霊」を保持した。
  alternative: 聖霊の完全な満ち満ちた働きを象徴する表現、または神の御座の前にいる七つの天的な霊
  rationale: 解釈は分かれるが、ギリシャ語本文は明確に複数形で「七つの霊」と記すため、本文でいずれかに決めず、脚注で主要な理解を併記した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、神への言及には「おられる」「御座」を用いて荘重さを保った。本節の文は1:5へ続き、恵みと平安の第三の源であるイエス・キリストが次節に現れるため、末尾を読点として構文を意図的に継続させた。すべての脚注記号を本文中に配置した。
