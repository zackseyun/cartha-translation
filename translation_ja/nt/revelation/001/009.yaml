reference: Revelation 1:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: ja
  text: 私ヨハネは、あなたがたの兄弟であり、イエスにある苦難と王国と忍耐に共にあずかる者で、神のことばとイエスの証し[a]のゆえに、パトモスと呼ばれる島にいました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスについての証し」とも訳せる。ギリシア語は、イエスがなさった証しを指すとも、イエスについての証しを指すとも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: 共にあずかる者
  rationale: 単なる同伴者ではなく、続く苦難・王国・忍耐を読者と共有していることを表す。現代日本語として自然で、商業的な含みも避けられる。
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: 苦難と王国と忍耐に
  rationale: 三つの名詞を並列のまま保った。「苦難」は黙示文学的な重みを保ちつつ現代の読者にも明瞭であり、「忍耐」はὑπομονήを簡潔に表す。「王国」は神の支配という意味を含み得るが、語の具体的な王国像を狭めない。
- source_word: ἐν Ἰησοῦ
  choice: イエスにある
  rationale: 直前の三つの現実すべてをイエスとの関係の中に位置づける表現と理解し、簡潔な神学的言い回しを保った。原文にない「キリスト」や「結ばれて」を補わない。
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: 島にいました
  rationale: この文脈のγίνομαιを場所にいることを表す慣用として訳し、島への到着方法や経緯を原文以上に特定しない。
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: パトモスと呼ばれる
  rationale: 島を説明する分詞を、明瞭で自然な現代日本語にした。
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: 神のことば…のゆえに
  rationale: 対格を伴うδιάの原因・理由を表す。宣教、忠誠、またはそれに伴う迫害のどれが直接の事情だったかを限定しない。
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: イエスの証し
  rationale: 属格Ἰησοῦが、イエスによる証しともイエスについての証しとも読める曖昧さを、日本語の「の」によって本文に残した。
- source_word: ἀδελφὸς ὑμῶν
  choice: あなたがたの兄弟
  rationale: ヨハネが読者との家族的な連帯を示す直接的な表現として訳した。ヨハネ自身を指す単数形なので、不必要な複数化や説明的な言い換えを避けた。
theological_decisions:
- issue: μαρτυρίαν Ἰησοῦにおける属格の曖昧さ
  choice: 本文を「イエスの証し」として曖昧さを保持する
  alternative: 「イエスについての証し」または「イエスがなさった証し」
  rationale: 原文は主格的属格と目的格的属格の両方が可能であり、黙示録解釈上の緊張を本文で一方に決めない。「の」は日本語でも両方の関係を許すため、別の可能性を脚注で明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録にふさわしい簡潔で重みのある調子を保った。「私ヨハネは」で自己紹介の強調を残し、三項の並列と「イエスにある」という凝縮された表現を説明しすぎないようにした。
