id: REV.1.11
reference: Revelation 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: ja
  text: こう言った。「あなたが見ていることを書物[a]に書き記し、エフェソ、スミルナ、ペルガモン[b]、ティアティラ、サルディス、フィラデルフィア、ラオディキアにある七つの教会へ送りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「巻物」。ギリシア語の βιβλίον は、巻物、書物、文書を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: ペルガモンは、伝統的に「ペルガモ」とも表記される。
    reason: alternative_rendering
lexical_decisions:
- source_word: λεγούσης
  choice: こう言った
  rationale: 前節で描かれた「声」の発言を導入する女性・属格・単数の現在分詞。日本語では文脈を受けて簡潔に「こう言った」とし、発言主体をこの節だけで過度に特定しない。
- source_word: Ὃ βλέπεις
  choice: あなたが見ていること
  rationale: 現在形の継続的な響きを自然な日本語で表し、ヨハネが目にしている幻の内容を広く指す表現とした。
- source_word: γράψον
  choice: 書き
  rationale: γράϕω のアオリスト命令形を直接的に訳した。後続の命令とつなぐため、日本語では連用形とした。
- source_word: εἰς βιβλίον
  choice: 書物に
  rationale: βιβλίον は書物、巻物、文書を指し得る。「書物」は媒体の形状を断定しない自然な訳語であり、「巻物」の可能性は脚注に示した。
- source_word: πέμψον
  choice: 送りなさい
  rationale: πέμπω のアオリスト命令形。送る対象は文脈上、書き記したものなので、日本語では目的語を不自然に重ねずに表した。
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: 七つの教会
  rationale: ここでは小アジアの具体的なキリスト者共同体を指すため、現代日本語の聖書用語として自然な「教会」を用いた。
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: エフェソ、スミルナ、ペルガモン、ティアティラ、サルディス、フィラデルフィア、ラオディキアの各教会に
  rationale: 各都市の個別の宛先を示す εἰς の反復を、日本語では「各教会に」によって自然かつ明確に表した。
theological_decisions:
- issue: ἐκκλησίαις が指す共同体の性質
  choice: 教会
  alternative: 集会／会衆
  rationale: 復活したイエスからヨハネを通して語りかけられる、各都市の具体的なキリスト者共同体を指す。「教会」はこの指示対象を自然に伝え、特定教派の制度理解を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令は「送りなさい」として威厳と自然さを両立させた。地名列挙は「各教会に」で受け、ギリシア語の分配的な宛先指定を日本語らしく示した。脚注記号は該当語の直後に配置した。
