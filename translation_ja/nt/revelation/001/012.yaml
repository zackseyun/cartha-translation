source:
  edition: SBLGNT
  text: ⸀Καὶ ἐπέστρεψα βλέπειν τὴν φωνὴν ἥτις ἐλάλει μετ’ ἐμοῦ· καὶ ἐπιστρέψας εἶδον ἑπτὰ λυχνίας χρυσᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/012.yaml
  text: And I turned to see the voice that was speaking with me[a], and when I turned, I saw seven golden lampstands,
translation:
  language: ja
  text: そこで私は、私に語りかけていた声を見ようと振り向いた。[a] 振り向くと、私は七つの金の燭台を見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私と語っていた声」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπέστρεψα
  choice: 振り向いた
  rationale: 身体の向きを変える動作を表すアオリストとして、文脈に合う自然な現代日本語。「向き直った」より簡潔である。
- source_word: βλέπειν
  choice: 見ようと
  rationale: 振り向いた目的を示す不定詞として訳した。「声を見る」という原文の印象的な表現を言い換えずに保つ。
- source_word: φωνὴν
  choice: 声
  rationale: 後続の「語っていた」と対応し、発話する声を指すため、「音」ではなく「声」とした。
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: 私と語っていた
  rationale: 未完了過去の継続性を「語っていた」で表し、μετά＋属格の「私と」を本文に残した。日本語として可能な「私に語りかけていた」は脚注に示した。
- source_word: ἐπιστρέψας
  choice: 振り向くと
  rationale: 主動詞に先立つアオリスト分詞を自然な時間表現とし、原文にある「振り向く」の反復も保った。
- source_word: εἶδον
  choice: 見えた
  rationale: 日本語では、振り向いた結果として視界に入ったものを「見えた」とするのが自然であり、知覚の意味を損なわない。
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: 七つの金の燭台
  rationale: λυχνίαを灯火そのものではなく、それを置く台として「燭台」と訳し、χρυσᾶςは材質を明確にする「金の」とした。黙示録1章20節との用語上のつながりも保たれる。
theological_decisions:
- issue: 黙示的象徴である λυχνίας の具体的な指示物
  choice: 燭台
  alternative: 灯／ともしび
  rationale: 1章20節で象徴的意味が明示されるまで、原語が指す具体物を正確に保つ。「灯」とすると、灯火とそれを支える台との区別が失われる。
- issue: 「声を見る」という表現
  choice: 声を見ようと
  alternative: 声の主を見ようと
  rationale: 「声の主」と補うと理解しやすいが、原文にない解釈を加えることになるため、意図的に異例な表現を保持した。
translation_notes:
  register: 明快な現代標準語を基本としつつ、象徴語には簡潔で格調のある「燭台」を用いた。「声を見る」という原文の独特な表現と、「振り向く」の反復は意図的に保持した。
