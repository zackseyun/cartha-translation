id: REV.1.17
reference: Revelation 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: ja
  text: 私がその方を見ると、その方の足もとに、死んだ者のように[a]倒れた。すると、その方は右手を私の上に置いて言った。「恐れるな。わたしは初めであり、終わりである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死んだようになって」。
    reason: ὡς νεκρόςは、死者に似た外見・状態を表す比喩としても、死んだかのような状態になったこととしても自然に表現できるため。
lexical_decisions:
- source_word: Καὶ ὅτε εἶδον αὐτόν
  choice: 私がその方を見ると
  rationale: καίによる物語の継続は、日本語では「すると」と重ねず、時間を表す「見ると」によって自然に示した。αὐτόνは、栄光ある人物への敬意と文脈上の指示を保つため「その方」とした。
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: 私はその足もとに……倒れた
  rationale: πρόςを伴うこの表現は、その人物の足もとへ崩れ落ちる姿を表す。「足もとに倒れた」は明瞭で自然な日本語であり、本文にない礼拝という解釈までは加えない。
- source_word: ὡς νεκρός
  choice: 死んだ者のように
  rationale: ὡςの明示的な比喩を保ち、ヨハネが実際に死んだとは訳さない。「死人のように」よりも現代日本語として直接的で理解しやすい。
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: その方は右手を私の上に置いて
  rationale: τίθημιとἐπίの具体的な動作を保った。「右手」は原文に明記され、象徴的な重みもあり得るため省略しない。
- source_word: Μὴ φοβοῦ
  choice: 恐れるな
  rationale: 禁止命令の簡潔さと荘重さを保つ。現代日本語でも明瞭であり、「怖がるな」より文脈の調子に合う。
- source_word: ἐγώ εἰμι
  choice: わたしは……である
  rationale: 明示された一人称の強調を保ち、後続する称号を述語として自然に結んだ。
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: 初めであり、終わりである
  rationale: 定冠詞を伴う形容詞の称号的用法を、自然で格調ある日本語にした。「最初の者、最後の者」も可能だが、イザヤを想起させる簡潔な対句を優先した。
theological_decisions:
- issue: ὁ πρῶτος καὶ ὁ ἔσχατοςの称号性
  choice: 初めであり、終わりである
  alternative: 最初の者であり、最後の者である
  rationale: 文脈では高く上げられたイエスの自己称号であり、イザヤの神的称号を響かせる。ただし日本語では大文字による称号表示ができないため、語句そのものを簡潔に保ち、解釈的な語を加えなかった。
- issue: ἐγώ εἰμιの力点
  choice: わたしは……である
  alternative: このわたしが……である
  rationale: 原文の明示的な代名詞による自己提示は「わたしは」で十分に表せる。「このわたしが」は強調を過度に固定する可能性があるため採らなかった。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学の荘重さを保った。話者の一人称は「わたし」、命令は簡潔な「恐れるな」とし、過度に古風な語法や教派固有の表現を避けた。
