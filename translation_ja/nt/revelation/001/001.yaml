revisions:
- from: イエス・キリストの黙示[a]。神は、間もなく起こらなければならないこと[b]を、ご自分の僕たちに示すため、これをキリストに与えた。そしてキリストは、御使いを遣わして、僕ヨハネにこれを知らせた[c]。
  to: イエス・キリストの啓示[a]。これは、神が、間もなく必ず起こること[b]をキリストのしもべたちに示すために、キリストに与えたものである。キリストは、自分の御使いを通してこれを送り、そのしもべヨハネに知らせた[c]。
  rationale: キリストに属するしもべたち、キリストの御使い、ヨハネという原文の伝達連鎖を日本語で明確にした。「しもべ」はδοῦλοςの従属・所属を保ちつつ、「僕」の現代語における一人称的な曖昧さを避ける。「啓示」は明瞭な本文語とし、属格の曖昧さ、ἐν τάχειの二つの可能性、σημαίνωの標識的含意は脚注で維持した。
