id: REV.1.1
reference: Revelation 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: ja
  text: イエス・キリストの啓示[a]。これは、神が、間もなく必ず起こること[b]をキリストのしもべたちに示すために、キリストに与えたものである。キリストは、自分の御使いを通してこれを送り、そのしもべヨハネに知らせた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエス・キリストからの啓示」または「イエス・キリストについての啓示」とも訳せる。ギリシャ語の属格は複数の意味に理解できる。「啓示」は「黙示」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 「速やかに起こるべきこと」とも訳せる。この表現は、出来事が間もなく起こること、または始まれば速やかに進むことを意味し得る。
    reason: lexical_alternative
  - marker: c
    text: 「しるしによって示した」とも訳せる。この動詞には、知らせるという意味に加え、しるしを用いて示すという含みがあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: 黙示
  rationale: 隠されていた事柄の開示を表す語であり、本書の伝統的な名称とも調和する。現代日本語で意味を補うため脚注に「啓示」も示した。
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・キリストの
  rationale: Χριστόςは日本語で定着した称号「キリスト」とした。「の」は、源・内容・所属のいずれとも取り得る属格の曖昧さを保つ。
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: 神は、これをキリストに与えた
  rationale: 日本語では代名詞だけでは指示対象が不明瞭になりやすいため、αὐτῷの指示対象を「キリスト」と明示し、神とキリストの区別を保った。
- source_word: δεῖξαι
  choice: 示すため
  rationale: 目的を表す不定詞を簡潔かつ自然に訳し、幻による提示にも適合させた。
- source_word: τοῖς δούλοις αὐτοῦ
  choice: ご自分の僕たち
  rationale: δοῦλοςが表す主人への従属と帰属を保ちつつ、現代日本語の聖書的・荘重な文体に適する「僕」を用いた。「奴隷」は社会制度上の含意が前面に出すぎる。
- source_word: ἃ δεῖ γενέσθαι
  choice: 起こらなければならないこと
  rationale: δεῖの必然性を明示しつつ、現代日本語として自然にした。
- source_word: ἐν τάχει
  choice: 間もなく
  rationale: 時間的切迫を第一義として自然に表した。出来事が始まれば「速やかに」進むという解釈も可能なので脚注に残した。
- source_word: ἐσήμανεν
  choice: 知らせた
  rationale: 基本義である「知らせる、示す」を明瞭な現代日本語で表した。しるしによる伝達という含みは文脈上可能なため脚注に示した。
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: 御使いを遣わして
  rationale: 分詞の手段的な働きと、διάが示す媒介を、日本語で重複なく自然に表現した。
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: 僕ヨハネに
  rationale: 受け手であるヨハネと、その主への従属・帰属を簡潔に示した。
theological_decisions:
- issue: Ἀποκάλυψις Ἰησοῦ Χριστοῦ の属格
  choice: 「イエス・キリストの黙示」とし、属格の関係を限定しない
  alternative: 「イエス・キリストからの黙示」または「イエス・キリストについての黙示」
  rationale: ギリシャ語は、キリストが伝える黙示、キリストについての黙示、あるいは広い所属関係を表し得る。本文では曖昧さを保ち、脚注で可能性を明示した。
- issue: δοῦλος の訳語
  choice: 僕
  alternative: 奴隷／しもべ／仕える者
  rationale: 主人への従属と帰属を保ちながら、普通の現代日本語にも比較的理解しやすい、荘重な語を選んだ。制度的奴隷制だけを想起させないようにした。
- issue: αὐτοῦ が指す者
  choice: 文脈に応じて「ご自分」「キリスト」と明示
  alternative: すべて「彼の」と訳す
  rationale: 原文では指示対象に解釈上の余地があり得るが、日本語で「彼の」を連ねると著しく不明瞭になる。神がキリストに与え、キリストが御使いを介してヨハネに知らせるという統語上自然な連鎖を本文に反映した。
translation_notes:
  register: 明瞭で現代的な標準日本語を基本としつつ、黙示文学の冒頭にふさわしい簡潔で荘重な調子を採用した。「御使い」「僕」はやや聖書的な語感を持つが、文意を妨げず、原文の関係性を簡潔に伝える。
