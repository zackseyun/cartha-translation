  source_fidelity: 要改訂。現行の「ご自分の僕たち」は、直前の主語である神に属する者とも読めるが、αὐτοῦは文脈上キリストを指すため、キリストとの関係を明示するほうが忠実である。また「御使いを遣わして」は御使い自体を遣わした意味に傾き、ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ（御使いを通して［これを］送る）の媒介関係を十分に表さない。
  naturalness: 「僕」は現代標準語では主に男性の一人称として理解されるため、「僕たち」「僕ヨハネ」は明瞭さを欠く。「しもべ」は聖書文脈で理解可能で、従属・所属の関係も保つ。「これは……与えたものである」と補うことで、日本語として自然な文になる。
  terminology: 「イエス・キリスト」は日本語の固有の称号表現として定着しており、適切である。「啓示」はἀποκάλυψιςの明瞭な現代日本語訳として本文に用い、伝統的な「黙示」は脚注に残す。
