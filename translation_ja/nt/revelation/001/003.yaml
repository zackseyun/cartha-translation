id: REV.1.3
reference: Revelation 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: ja
  text: この預言のことばを朗読する人[a]、また、それを聞き、その中に書かれていることを守る人たちは、幸いである。時[b]が近いからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「読む人」。ギリシア語は、集会で一人が声に出して読み、複数の人が聞く状況を指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 別訳「定めの時」。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: 幸いである
  rationale: 単なる感情的な幸福ではなく、神の恵みのもとにある祝福された状態を表す、聖書で定着した自然な表現。ギリシア語では単数形だが、朗読者と聞く人々を合わせて祝福しているため、日本語では「人たちは幸いである」とした。
- source_word: ὁ ἀναγινώσκων
  choice: 朗読する人
  rationale: 単数の朗読者と複数の聞き手の対比から、集会で声に出して読む場面が強く示唆される。「朗読する」によってその口頭性を簡潔に表した。
- source_word: οἱ ἀκούοντες
  choice: それを聞き
  rationale: 公の朗読を耳で聞くことを自然に表し、続く「守る」とともに、受け止めて従う文脈も妨げない。目的語は日本語での明瞭さのため「それを」とした。
- source_word: τοὺς λόγους τῆς προφητείας
  choice: この預言のことば
  rationale: λόγουςを一般化して「メッセージ」とせず「ことば」とし、当該の預言を指す文脈上の指示性を「この」で表した。
- source_word: τηροῦντες
  choice: 守る
  rationale: 書かれた内容を忠実に保ち、実行するという広がりを持つため、「従う」だけに狭めず「守る」とした。
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: そこに書かれていること
  rationale: 完了受動分詞の結果状態を自然な現代日本語で表した。「そこ」は直前の「この預言」を受ける。
- source_word: ὁ καιρός
  choice: 定めの時
  rationale: καιρόςは単なる時刻や時間ではなく、決定的・適切な時を指し得る。定冠詞付きの終末論的文脈を踏まえ「定めの時」としたが、「時」も可能であることを注記した。
- source_word: ἐγγύς
  choice: 近い
  rationale: 時間的切迫を明瞭かつ現代的に示し、成就時期について特定の解釈を加えない。
theological_decisions:
- issue: 単数の朗読者と複数の聞き手が示唆する公的朗読
  choice: 「朗読する人」として、声に出して読む集会の状況を表した。
  alternative: 「読む人」とし、口頭性を明示しない。
  rationale: 文法上、一人の読み手と複数の聞き手が対置されており、公的朗読が強く示唆される。ただし語自体は一般に「読む」も意味し得るため、別訳を脚注に残した。
- issue: καιρός ἐγγύςの終末論的意味
  choice: 「定めの時が近い」とし、時の決定的性格と切迫性を保った。
  alternative: 「時が近い」。
  rationale: 本文は時が近いと宣言するが、その成就の年代や様式は説明していない。そのため特定の終末論体系に結びつけず、表現の緊張をそのまま保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ことば」は聖書的な重みを保ちつつ平易に表記した。祝福の対象が朗読者と聞いて守る人々の双方であることが自然に伝わるよう、主語をまとめて「人たちは幸いである」とした。脚注記号は対応箇所の本文中にすべて明示した。
