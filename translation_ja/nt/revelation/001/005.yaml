id: REV.1.5
reference: Revelation 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: ja
  text: また、イエス・メシア[a]、すなわち忠実な証人、死者の中の長子、地上の王たちの支配者から。私たちを愛し、ご自分の血によって私たちを罪から解放してくださった[b]方に――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イエス・キリスト」。ギリシア語の「クリストス」は「メシア」という称号です。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては、「私たちを罪から解放してくださった」の代わりに、「ご自分の血によって私たちを罪から洗い清めてくださった」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: イエス・メシア
  rationale: Χριστόςを姓のように音写するのでなく、「油を注がれた者」という称号として「メシア」と訳した。日本語では「イエス・メシア」が簡潔で自然な称号表現となる。
- source_word: ὁ μάρτυς ὁ πιστός
  choice: 忠実な証人
  rationale: μάρτυςはここでは殉教者に限定されず、証言する者を指す。πιστόςはその証言の確かさと揺るがない忠実さを保つ。
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: 死者の中の長子
  rationale: πρωτότοκοςの聖書的な「長子」の比喩を保ちつつ、死者の中で先立つ方であることを日本語として明瞭にした。単に復活の時間的順序だけに限定しない表現である。
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: 地上の王たちの支配者
  rationale: ἄρχωνの権威を「支配者」で明確に表し、黙示録の広い視野に合うようγῆを「地上」とした。
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: 私たちを愛し……くださった方に
  rationale: 現在分詞ἀγαπῶντιの継続的な愛を「愛し」で表した。与格は後続する頌栄へ続くため「方に」とし、文の未完結性を長いダッシュで示した。
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: 私たちを罪から解放してくださった
  rationale: λύωの「解く、自由にする」という解放の像と、ἐκが示す罪からの分離を自然な現代日本語で表した。
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: ご自分の血によって
  rationale: ἐνを手段の用法と捉え、「血によって」とした。「ご自分の」は指示対象を明瞭にしつつ、現代日本語の敬意ある文体に合う。
theological_decisions:
- issue: 「愛してくださる」に続く分詞の本文異読
  choice: λύσαντι（解放してくださった）
  alternative: λούσαντι（洗い清めてくださった）
  rationale: 提示されたSBLGNT本文のλύσαντιに従う。よく知られ、意味上も重要なλούσαντιの異読は脚注に残し、本文で両者を調和させない。
- issue: Χριστόςの称号性
  choice: メシア
  alternative: キリスト
  rationale: この箇所では固有名の一部というより称号として機能するため、「メシア」とした。伝統的な音写「キリスト」も脚注で示す。
- issue: πρωτότοκοςの含意
  choice: 長子
  alternative: 最初に復活した方
  rationale: 「長子」は先行性だけでなく卓越性や地位も含み得るため、復活の時間的順序だけに意味を狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の荘重な称号の連なりと頌栄へ続く構文を保った。「証し人」より一般読者に直接伝わる「証人」を採用し、原文が次節へ続くことは末尾の長いダッシュで示した。
