  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: ja
  text: ヨハネは、神のことばと、メシアであるイエスの証し[a]、そして自分が見たすべてのことについて証言した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「メシアであるイエスからの証し」または「メシアであるイエスについての証し」。ギリシア語はいずれの意味にも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃς
  choice: このヨハネは
  rationale: 関係代名詞の先行詞は前節のヨハネ。日本語では独立した節として自然につながるよう、指示語を添えて主語を明示した。
- source_word: ἐμαρτύρησεν
  choice: 証言した
  rationale: μαρτυρέωの証人・証言という意味を保ち、同根語μαρτυρίαとのつながりも「証言／証し」によって示した。
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: 神のことば
  rationale: λόγοςを神から伝えられた啓示のことばとして訳した。「神のことば」は自然で定着した聖書的表現でもある。
- source_word: τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: メシアであるイエスの証し
  rationale: μαρτυρίαを「証し」とし、Ἰησοῦ Χριστοῦの属格が証しの発信者と対象のどちらを表すかという曖昧さを本文で保持した。Χριστόςは称号として「メシア」と訳した。
- source_word: ὅσα εἶδεν
  choice: すなわち自分が見たすべてのこと
  rationale: ὅσαの包括性を「すべてのこと」で表し、直前の二つの目的語をまとめて説明する同格的な関係を「すなわち」で明確にした。「自分が」により、見た者がヨハネであることを自然に示した。
theological_decisions:
- issue: μαρτυρία Ἰησοῦ Χριστοῦにおける属格の曖昧さ
  choice: 「メシアであるイエスの証し」とし、証しがイエスからのものか、イエスについてのものかを本文では限定しない。
  alternative: 「メシアであるイエスからの証し」または「メシアであるイエスについての証し」
  rationale: ギリシア語の属格は主格的にも目的格的にも理解でき、文脈だけでは一方に確定できないため、原文の神学的緊張を保持した。
- issue: Χριστοῦの称号性
  choice: 「メシアであるイエス」
  alternative: 「イエス・キリスト」
  rationale: ここではΧριστόςの称号としての意味がなお明瞭であるため、日本語で称号性が伝わる形を採用した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、黙示文学にふさわしい端正さを保った。「このヨハネは」で前節との連続性を示し、「証し／証言した」によって原語の同根関係をできる限り自然に反映した。
