id: REV.1.13
reference: Revelation 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: ja
  text: また、その燭台の間には、人の子のような者[a]がいて、足まで届く衣をまとい、胸に金の帯を締めていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「『人の子』のような方」とも訳せる。このギリシア語表現はダニエル書7章13節を思い起こさせ、ここでは高く上げられたイエスに当てられている。
    reason: 冠詞のないギリシア語の表現が持つ曖昧さと、伝統的な称号としての解釈の双方を示すため。
lexical_decisions:
- source_word: ἐν μέσῳ τῶν λυχνιῶν
  choice: その燭台の間には
  rationale: ἐν μέσῳ の空間的な意味を自然な現代日本語で表し、λυχνία は灯火そのものではなく、それを載せる燭台として訳した。
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: 人の子のような者
  rationale: 冠詞のないギリシア語の表現とダニエル書7章13節への響きを保ちつつ、本文で直ちに固定的な称号と断定しない訳とした。
- source_word: ἐνδεδυμένον ποδήρη
  choice: 足まで届く衣をまとい
  rationale: ποδήρης の「足にまで届く」という語義を明瞭に表し、完了形分詞が描く着衣の状態を「まとい」で自然に示した。
- source_word: περιεζωσμένον πρὸς τοῖς μαστοῖς
  choice: 胸に……帯を締めていた
  rationale: 帯が胴ではなく上半身の高い位置にあることを、過度に解剖学的にならない自然な日本語で表した。
- source_word: ζώνην χρυσᾶν
  choice: 金の帯
  rationale: ζώνη は帯または腰帯を指すが、胸の位置に締める描写に合う広い語「帯」を選び、χρυσᾶν は簡潔に「金の」とした。
theological_decisions:
- issue: ὅμοιον υἱὸν ἀνθρώπου のキリスト論的な意味
  choice: 本文では「人の子のような者」とし、冠詞のない表現の曖昧さを保つ。
  alternative: 「『人の子』のような方」
  rationale: この句はダニエル書7章13節を想起させ、黙示録の文脈では高く上げられたイエスに当てられている。しかし、本文で称号として明示しすぎず、伝統的なキリスト論的理解は脚注に残した。
translation_notes:
  register: 幻の荘厳さを保ちながら、一般の読者に明瞭な現代標準日本語とした。節頭の καί は「また」とし、ギリシア語では前節に続く構文を、日本語では独立して読める自然な文に整えた。
