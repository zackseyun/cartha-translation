id: REV.1.7
reference: Revelation 1:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: ja
  text: 見よ、彼は雲とともに来られる。すべての目が彼を見る。彼を突き刺した者たちも見る。そして、地上[a]のすべての部族は、彼をめぐって嘆く。そのとおり、アーメン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地のすべての部族」。この表現はゼカリヤ書12章10―12節を踏まえている可能性があり、そこでは文脈上「地」と訳すこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 注意を強く促す語の力と預言的な荘重さを保ちつつ、現代日本語でも理解できる表現とした。
- source_word: ἔρχεται
  choice: 来られる
  rationale: 未来を生き生きと示すギリシア語現在形を、日本語では文脈上未来を表し得る現在形で訳した。敬意を示す「られる」は、この箇所の荘重な語調にも適する。
- source_word: μετὰ τῶν νεφελῶν
  choice: 雲とともに
  rationale: ダニエル書7章13節を想起させる雲のイメージと、μετάの随伴の意味を直接保った。
- source_word: πᾶς ὀφθαλμὸς
  choice: すべての目
  rationale: 「すべての人」と一般化せず、原文の具体的で配分的な比喩表現を保持した。
- source_word: οἵτινες αὐτὸν ἐξεκέντησαν
  choice: その方を突き刺した者たち
  rationale: ゼカリヤ書12章10節およびヨハネ福音書19章37節との語彙的連関を保つため、「突き刺した」とした。
- source_word: κόψονται ἐπ’ αὐτὸν
  choice: その方のことで嘆く
  rationale: κόπτωが表す悲嘆を自然な日本語で示しつつ、ἐπίが示し得る「その方をめぐって／その方ゆえに」という幅を過度に限定しない表現とした。
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: 地上のすべての部族
  rationale: φυλαίの具体性を「部族」で保ち、全世界的な文脈によりγῆは本文で「地上」とした。ただし「地」の可能性は注記した。
- source_word: ναί, ἀμήν
  choice: しかり、アーメン
  rationale: 二重の強い肯定と礼拝的な響きを保持した。「しかり」は荘重だが現代の聖書文体で理解可能である。
theological_decisions:
- issue: πᾶσαι αἱ φυλαὶ τῆς γῆς における τῆς γῆς の範囲
  choice: 本文では「地上のすべての部族」
  alternative: 「地のすべての部族」
  rationale: 「すべての目」という普遍的視野は「地上」を支持する一方、ゼカリヤ書12章10－12節への反響を考えると、特定の「地」を指す可能性も残るため、注で保持した。
- issue: ἐπ’ αὐτὸν に伴う嘆きの意味
  choice: 「その方のことで嘆く」
  alternative: 「その方のゆえに嘆く」または「その方を思って嘆く」
  rationale: 悲嘆が悔い改め、恐れ、裁きへの反応のいずれであるかを訳文だけで決めず、原文の神学的緊張を残した。
translation_notes:
  register: 明快な現代標準日本語を基本としつつ、黙示文学にふさわしい荘重さを「見よ」「しかり、アーメン」で保った。指示対象には「彼」ではなく「その方」を用い、自然な敬意と照応の明瞭さを確保した。
