  text: γράψον οὖν ἃ εἶδες καὶ ἃ εἰσὶν καὶ ἃ μέλλει ⸀γίνεσθαι μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/019.yaml
  text: Therefore write what you have seen[a], and what is, and what is about to happen after these things.
translation:
  language: ja
  text: だから、あなたが見たこと、今あること、そしてこれらのことの後に起ころうとしていること[a]を書き記しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらのことの後に起こること」。μέλλωは、これから起こることを示す単純な未来に近い意味で用いられる場合もあるが、間もなく起ころうとしているという含みを持つことが多い。
    reason: alternative_reading
lexical_decisions:
- source_word: γράψον
  choice: 書き記しなさい
  rationale: アオリスト能動命令法二人称単数の明確な命令。日本語では「書け」より品位があり、「書きなさい」より記録の意味が自然に伝わる。
- source_word: οὖν
  choice: だから
  rationale: 直前の委任を受けた帰結・継続を示す。現代の一般読者に明快でありつつ、接続の論理を保つ。
- source_word: ἃ εἶδες
  choice: あなたが見たこと
  rationale: すでに見た幻の内容を指す関係節。アオリストの過去性を自然な日本語で表す。
- source_word: ἃ εἰσὶν
  choice: 今あること
  rationale: 直訳的な「あること」だけでは時間的対比が不明瞭になりやすいため、現在時制の力を「今」で明示する。
- source_word: μέλλει γίνεσθαι
  choice: 起ころうとしていること
  rationale: μέλλω＋不定詞が持つ、将来性と切迫・進行への含みを保つ。「起こること」と単純未来に平板化しない。
- source_word: μετὰ ταῦτα
  choice: この後に
  rationale: 時間的順序を自然な現代日本語で示す。複数指示詞の字面的な「これらの後」より、この文脈では明瞭である。
theological_decisions:
- issue: 黙示文学の文脈における μέλλει の時間的ニュアンス
  choice: 「起ころうとしている」として、切迫性の含みを残す
  alternative: 「起こる」「起こることになる」と単純な未来として訳す
  rationale: 原文は将来の出来事を述べながら、差し迫った事柄という含みを持ち得る。終末の時期について特定の立場に決着させず、原文の時間的緊張を保持する。
- issue: 三つの ἃ 節の関係
  choice: 「見たこと、今あること、そして……こと」と並列に訳す
  alternative: 第二・第三の節を第一の節の説明と解して、「見たこと、すなわち……」と訳す
  rationale: καί の反復が示す並列を本文で保ち、構造上の解釈を一つに限定しない。
translation_notes:
  register: 明快な現代標準日本語を用い、命令の厳粛さを「書き記しなさい」で保った。三つの内容を読み取りやすく並列し、黙示文学における時間表現の曖昧さは脚注と訳語の双方で保持した。
