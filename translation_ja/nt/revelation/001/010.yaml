id: REV.1.10
reference: Revelation 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: ja
  text: 私は主の日[a]に霊にあって[b]、後ろからラッパのような大きな声を聞いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主の日に」。ギリシア語は「主に属する日」を意味する語で、終末の「主の日」に通常用いられる表現とは異なる。
    reason: alternative_reading
  - marker: b
    text: または「霊のうちにいて」。聖霊による預言的な状態を指す可能性があるが、原文は「恍惚状態」とは明記していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην ἐν πνεύματι
  choice: 御霊に満たされ
  rationale: γίνομαιの状態への移行と、黙示録の預言的幻に関する定型句としてのἐν πνεύματιを、現代日本語で自然に表す。「我を忘れた状態」など、本文に明記されない忘我・恍惚の意味は加えない。
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: 主の日
  rationale: κυριακόςの「主に属する」という形容詞的意味を簡潔に表す。終末論的な「主の日」と日本語では同形になるため、ギリシア語表現の違いを脚注で示す。
- source_word: ἤκουσα
  choice: 聞いた
  rationale: ここでは意識的に耳を傾ける行為ではなく、音声を知覚したことを表す自然な訳。
- source_word: ὀπίσω μου
  choice: 後ろから
  rationale: 文脈に合う空間的な位置を明確に示す。
- source_word: φωνὴν μεγάλην
  choice: 大きな声
  rationale: φωνήに伴うμέγαςは声量・力強さを表す。「大きな声」は明瞭で自然な現代日本語。
- source_word: ὡς σάλπιγγος
  choice: ラッパのような
  rationale: 声の響きをラッパにたとえる直喩を保ち、「吹き鳴らす音」など原文にない要素は加えない。
theological_decisions:
- issue: ἐν πνεύματιが聖霊による預言的状態を指すのか、単に霊においてという意味か
  choice: 御霊に満たされ
  alternative: 霊にあって／霊のうちにいて
  rationale: 黙示録における幻の定型句から聖霊の働きを指す可能性が高い。「満たされ」は日本語として状態への移行を伝えるが、原文は「恍惚状態」と明言していないため、その解釈は脚注で限定する。
- issue: κυριακῇ ἡμέρᾳが週ごとの礼拝日か、終末論的な「主の日」か
  choice: 主の日
  alternative: 主の来臨の日
  rationale: κυριακόςは「主に属する」の意であり、通常の終末論的表現とはギリシア語の構文が異なる。本文では語形に忠実な「主の日」とし、それが具体的に何の日かを訳文だけで断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御霊」は聖霊を示す聖書的な語として用いた。修飾関係を自然にするため「後ろから」を声の発生方向として訳した。脚注記号は英語相談層の配置と内容順が食い違っていたため、主本文では[a]を「主の日」、[b]を「御霊に満たされ」に付し、それぞれ対応する注を整えた。
