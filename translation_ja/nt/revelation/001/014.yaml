id: REV.1.14
reference: Revelation 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: ja
  text: その方の頭と髪は、白い羊毛のように、雪のように白く[a]、その目は燃える炎のようであった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その方の頭と髪は白く、白い羊毛のように、雪のようであった」。
    reason: ギリシア語で「白い」が頭と髪に述語として置かれ、続く二つの比喩がその白さを描写する構成を明示するため。
  - marker: b
    text: この描写はダニエル書7章9節を想起させ、幻としての性格を際立たせている。
    reason: 旧約聖書との文学的な響きを示すため。
lexical_decisions:
- source_word: δὲ
  choice: 訳出せず
  rationale: 軽い接続を示す語であり、日本語では文脈上明らかなため、不要な「さて」「そして」を加えず自然な流れを保った。
- source_word: ἡ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες
  choice: その方の頭と髪
  rationale: 身体部位を明確に保ちつつ、αὐτοῦは幻の中で描写される人物への敬意を損なわない自然な日本語として「その方の」とした。
- source_word: λευκαὶ
  choice: 白く
  rationale: 基本的な色彩語として訳し、比喩が示す象徴的意味を本文で説明しない。
- source_word: ὡς ἔριον λευκόν
  choice: 白い羊毛のように
  rationale: 形容詞が羊毛を修飾する構造と、明示された比喩をそのまま保った。
- source_word: ὡς χιών
  choice: 雪のように
  rationale: 白さを重ねて描く第二の比喩を保持した。
- source_word: οἱ ὀφθαλμοὶ αὐτοῦ
  choice: その目
  rationale: 日本語では複数の目も通常「目」と表すため、自然な集合的単数を用いた。
- source_word: ὡς φλὸξ πυρός
  choice: 燃える炎のよう
  rationale: 字義的には「火の炎のよう」だが、日本語での不自然な重複を避けながら、火と炎の鮮烈な像を「燃える炎」で表した。
theological_decisions:
- issue: 高く上げられた人の子の象徴的描写
  choice: 白さと炎の比喩を解釈せず、そのまま幻の描写として訳す
  alternative: 清さ、永遠性、裁きなどの象徴的意味を本文に補う
  rationale: 本文は視覚的な比喩を提示するだけで、その意味をこの節で明示していないため、神学的解釈を訳文に織り込まない。
- issue: 「頭と髪」と「白い」の統語関係
  choice: 頭と髪の双方が白いと読める形にする
  alternative: 頭については髪の白さを通して描写していると捉える
  rationale: ギリシア語では単数の「頭」と複数の「髪」に対し、述語形容詞が複数形で置かれており、表現にわずかな統語上の圧縮がある。本文では双方に白さが及ぶ自然な読みを採り、別の構成可能性を脚注に示す。
translation_notes:
  register: 明瞭で現代的かつ荘重な文体。「彼」ではなく「その方」を用いて指示対象を自然に示した。比喩の反復を保ち、象徴の意味は本文中で解説していない。
