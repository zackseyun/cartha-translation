id: REV.1.20
reference: Revelation 1:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: ja
  text: あなたがわたしの右手に見た七つの星と、七つの金の燭台の奥義は、こうである。七つの星は七つの教会の御使い[a]であり、七つの燭台は七つの教会である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「使者」。ギリシア語は、御使いを指すことも、人間の使者を指すこともある。
    reason: alternative_reading
lexical_decisions:
- source_word: μυστήριον
  choice: 奥義
  rationale: 黙示文学的・神学的な響きを保ちつつ、ここでは幻の中に隠され、今や明かされる意味を表す。単に「象徴的な意味」として平板化しない。
- source_word: ἀστέρων / ἀστέρες
  choice: 星
  rationale: 幻の象徴を字義どおりに訳し、後半でその指示対象が説明される構造を保つ。
- source_word: οὓς εἶδες
  choice: あなたが…見た
  rationale: 星を修飾する関係節を、自然な現代日本語の連体修飾として表した。
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: わたしの右手に
  rationale: 直前の幻の描写と日本語の自然さを踏まえ、星が右手にある像を明確にする。
- source_word: λυχνίας
  choice: 燭台
  rationale: 語は灯火そのものではなく、それを載せる台を指す。黙示録の象徴表現として定着した、簡潔で格調ある語を用いる。
- source_word: χρυσᾶς
  choice: 金の
  rationale: 材質または性状を自然かつ簡潔に表す。
- source_word: ἄγγελοι
  choice: 御使い
  rationale: 黙示録で一般的な天的存在の意味を本文に採りつつ、「使者」の可能性を脚注に残して語の曖昧さを保つ。
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: 教会
  rationale: 黙示録が宛てる各地の信徒共同体を表す、現代日本語で標準的な聖書用語。
- source_word: τὸ μυστήριον ... καὶ ...
  choice: …の奥義は、こうである。
  rationale: ギリシア語の主題提示に続いて説明が与えられる構造を、明瞭で自然な日本語として示す。
theological_decisions:
- issue: ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν の指示対象
  choice: 七つの教会の御使い
  alternative: 七つの教会の使者
  rationale: ἄγγελος は天使にも人間の使者にも用いられる。黙示録では天的存在を指す用例が多いため本文では「御使い」としたが、本文だけでは人間の使者を排除できないので脚注で代案を示す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としながら、黙示文学の格調を保つため「奥義」「燭台」「御使い」を用いた。脚注記号[a]は曖昧な語「御使い」に直接付した。
