language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: ja
  text: また、私たちを王国とし、ご自分の神であり父である方に仕える祭司としてくださった方に、栄光と支配とが世々限りなくあるように。アーメン。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησεν
  choice: してくださった
  rationale: アオリストの出来事性を保ちつつ、直前から続くキリストの恵み深い行為として自然な現代日本語にした。
- source_word: βασιλείαν
  choice: 王国
  rationale: 単数名詞をそのまま反映し、「王たち」という後代の異読を本文へ持ち込まない。共同体全体が一つの王国とされたという表現を保つ。
- source_word: ἱερεῖς
  choice: 祭司
  rationale: 祭儀的・契約的な身分を表す語なので、定着した聖書語である「祭司」を用いる。
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: ご自分の神であり父である方に仕える
  rationale: αὐτοῦが神と父の双方にかかる関係を明示した。「仕える」は与格が示す献身・奉仕の方向性を日本語で自然に補うが、神と父を別々の存在にはしない。
- source_word: αὐτῷ
  choice: この方に
  rationale: 直前の文脈における頌栄の対象を日本語で明瞭に示しつつ、ギリシア語の与格による帰属・賛美の表現を保つ。
- source_word: δόξα
  choice: 栄光
  rationale: 頌栄で標準的かつ自然な対応語。
- source_word: κράτος
  choice: 支配
  rationale: 単なる能力よりも、主権的な力と統治を表す頌栄上の意味を簡潔に伝える。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 無限の継続を表す慣用句として、原文の「代々」の重なりをある程度保ちながら自然で荘重な日本語にした。
- source_word: ἀμήν
  choice: アーメン
  rationale: 礼拝的な同意・確証の語として、日本語の聖書・教会用語に定着した音写を用いる。
theological_decisions:
- issue: 「ご自分の神であり父」の指示関係
  choice: 「ご自分」は文脈上イエス・キリストを指し、その神であり父である方との関係を明示する。
  alternative: 「父なる神のために」と平板化する。
  rationale: 原文のαὐτοῦを省かず、キリストと神なる父との関係を教理的に言い換えたり曖昧にしたりせず保持する。
- issue: 共同体の身分
  choice: 「王国」と「祭司」を並置し、私たち全体が王国とされ、祭司とされたことを表す。
  alternative: 後代の異読に基づき「王たちまた祭司たち」とする。
  rationale: 提示されたSBLGNT本文のβασιλείαν, ἱερεῖςに従い、「王たち」を本文に導入しない。
- issue: 頌栄の対象
  choice: 「この方」を直前までの中心人物であるイエス・キリストとして読む。
  alternative: 直前の「神であり父である方」を頌栄の直接の対象と読む。
  rationale: 1:5からの統語と談話の流れでは、愛し、解放し、王国と祭司にした方であるキリストへの頌栄と読むのが自然。ただし日本語の「この方」は文脈上の近接性も残し、原文以上の説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録の頌栄にふさわしい品位を保った。「王国とし」は原文に忠実だがやや凝縮された表現であり、続く「祭司としてくださった」と並べて意味を明瞭にした。提示された英語脚注は標識と内容が入れ替わっているように見えるため、原文根拠のない脚注は付さなかった。
