source:
  edition: SBLGNT
  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: ja
  text: また、わたしは生きている者である。死者となった[a]。だが、見よ、世々限りなく[b]生きている。そして、死とハデス[c]の鍵を持っている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「死者となった」。ギリシア語は、単に死んでいた状態だけでなく、死へと移ったことを表す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「世々の世に至るまで」。終わりのない持続を表す慣用句。
    reason: lexical_alternative
  - marker: c
    text: 「ハデス」は死者の領域を指し、最終的な刑罰の場所だけを意味する語ではない。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: 生きている者
  rationale: 冠詞付き現在分詞を実体詞的な称号として訳した。「生きる者」よりも現在の持続的な状態が明瞭で、神的自己描写としての響きも保つ。
- source_word: ἐγενόμην νεκρός
  choice: 死者となった
  rationale: γίνομαι と述語形容詞の組み合わせが示す、死への移行を保った。「死んでいた」より原文の動的なニュアンスを明確に伝える。
- source_word: ἰδού
  choice: 見よ
  rationale: 注意を強く促す間投詞の力を保ち、黙示録にふさわしい格調と現代日本語での理解しやすさを両立させた。
- source_word: ζῶν εἰμι
  choice: 生きている
  rationale: 現在分詞と εἰμί が表す現に生きている状態を自然な日本語で示し、「死者となった」との対照を保つ。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 終わりのない持続を表す強調句を、聖書的な格調を保ちつつ理解可能な慣用表現で訳した。
- source_word: κλεῖς
  choice: 鍵
  rationale: 基本的な語義を直接訳した。文脈上、支配権や権威を象徴するが、その解釈を本文に織り込まなかった。
- source_word: τοῦ θανάτου
  choice: 死の
  rationale: 「鍵」にかかる属格を直接表した。人格化を確定しないため、通常の「死」とした。
- source_word: τοῦ ᾅδου
  choice: ハデスの
  rationale: 最終的刑罰を意味する「地獄」や、物理的な墓に限定されやすい「墓」を避け、死者の領域を指す原語の概念的な幅を保った。
theological_decisions:
- issue: 終末論的文脈における ᾅδης の訳語
  choice: ハデス
  alternative: 死者の国／墓／地獄
  rationale: 本文は「死」と「ハデス」を並べ、関連しながらも同一ではない現実として描く。「ハデス」は最終的刑罰という後代的含意を持ち込みにくく、単なる埋葬場所にも限定しないため、原文の神学的な幅を保てる。
- issue: ἐγενόμην νεκρός が示す死の表現
  choice: 死者となった
  alternative: 死んでいた
  rationale: 単なる過去の状態ではなく、実際に死へ移ったことを表す原文の動きを残し、その後の「生きている」との死・復活の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」「世々限りなく」により黙示録の荘重さを保った。原文の反復する接続詞 καί は、日本語として不自然にならない範囲で「また」「そして」として残し、死から命への強い転換には「しかし」を用いた。
