id: REV.1.16
reference: Revelation 1:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: ja
  text: また、その右手に七つの星を持ち、その口からは鋭い両刃の剣が出ており、その姿は、その力を存分に発揮して輝く太陽のようであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「太陽がその力のうちに輝くよう」。または「太陽がその力を十分に発揮して輝くよう」。
    reason: ἐν τῇ δυνάμει αὐτοῦの直訳的な言い回しと、太陽の光の強度を明示する自然な別訳を示すため。
lexical_decisions:
- source_word: ἔχων
  choice: 持ち
  rationale: 分詞の継続的な描写を、前後の幻の描写に自然につながる連用形で表した。
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: その右手に
  rationale: ギリシア語で明示された「手」を省かず、自然な現代日本語にした。
- source_word: ἀστέρας ἑπτά
  choice: 七つの星
  rationale: 数と名詞を日本語として自然な語順でそのまま表した。
- source_word: ῥομφαία
  choice: 剣
  rationale: 大型の剣を指し得る語だが、黙示的な象徴を不必要に具体化せず、明瞭で標準的な「剣」とした。
- source_word: δίστομος ὀξεῖα
  choice: 鋭い両刃の
  rationale: δίστομοςの字義は「二つの口を持つ」だが、剣については「両刃」を意味する。ὀξεῖαの「鋭い」も省かずに訳した。
- source_word: ἐκπορευομένη
  choice: 出ていた
  rationale: 口から剣が外へ出ているという幻の継続的な情景を、自然な描写として表した。
- source_word: ἡ ὄψις αὐτοῦ
  choice: その姿
  rationale: ὄψιςは顔だけでなく、目に見える外観や様子も表し得るため、「顔」に限定せず「姿」とした。
- source_word: ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ
  choice: 力強く輝く太陽のよう
  rationale: 太陽がその力を発揮して輝くという比喩を、意味を狭めず自然な日本語で表した。より直訳的な形は脚注に示した。
theological_decisions:
- issue: 口から出る剣の象徴的意味
  choice: 幻の比喩をそのまま残し、本文中では解釈を加えない。
  alternative: キリストの裁きの言葉、または神の言葉であると明示する。
  rationale: この節自体は象徴的な光景を提示しており、その意味を本文で特定すると原文以上の解釈を持ち込むことになるため。
- issue: ὄψιςが指す範囲
  choice: 「その姿」として、外観全体を含み得る表現にする。
  alternative: 「その顔」として顔貌に限定する。
  rationale: 文脈上「顔」も可能だが、語そのものにはより広い「外観」の意味があり、曖昧さを保つため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学の荘厳な視覚的描写を保った。「出ていた」により静止画的かつ継続的な幻の様子を表し、象徴の意味は説明的に補わなかった。
