id: REV.1.15
reference: Revelation 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ, ὡς ἐν καμίνῳ ⸀πεπυρωμένης, καὶ ἡ φωνὴ αὐτοῦ ὡς φωνὴ ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/015.yaml
  text: and his feet were like burnished bronze[a], as if refined in a furnace, and his voice was like the sound of many waters[b],
translation:
  language: ja
  text: その足は、炉で熱せられたかのように輝く青銅[a]のようであり、その声は、大水の響き[b]のようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「輝く青銅」と訳した語は非常にまれで、正確な意味は不明。「上質の真鍮」「磨かれた青銅」などとも考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「多くの水の声」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πόδες
  choice: 足
  rationale: 通常の意味である「足」を用い、幻の描写を直接的に伝える。「脚」と広く取る必要はない。
- source_word: ὅμοιοι
  choice: のようであり
  rationale: 類似を表す形容詞の比較表現を、前後を自然につなぐ現代日本語にした。
- source_word: χαλκολιβάνῳ
  choice: 輝く青銅
  rationale: 非常にまれで指示対象が確定できない金属名である。特定の合金を断定せず、文脈上の火による金属的な輝きを明瞭に表した。
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: 炉で精錬されて
  rationale: κάμινοςは炉、火に関係する分詞は焼かれること、熱せられること、精錬されることを含み得る。金属の文脈に即して「精錬」としたが、比較を含む原文の描写を「輝く」と一体にして自然に訳した。
- source_word: φωνή
  choice: 声
  rationale: 最初のφωνήは人物に属するため、人格的な「声」を保った。
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: 大水の響きのよう
  rationale: 二度目のφωνήは水が発する音を指すので「響き」とし、ὕδατα πολλάの荘厳な聖書的イメージを「大水」で簡潔に表した。「とどろき」として特定の音質を加えることは避けた。
theological_decisions:
- issue: 最後の比喩におけるφωνήの反復
  choice: その声は、大水の響きのよう
  alternative: その声は、多くの水の声のよう
  rationale: 高く上げられた人の子の威厳を示す比喩を保ちつつ、日本語では水について「声」を反復すると不自然になりやすいため、二度目を「響き」とした。より字義的な表現は脚注に残した。
- issue: χαλκολίβανονが指す金属
  choice: 輝く青銅
  alternative: 上質の真鍮／磨かれた青銅／金銀合金
  rationale: この語はまれで正確な金属組成が不明なため、特定の合金に限定しない。火と輝きの幻視的描写を伝えつつ、不確実性を脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい荘厳さを保った。「大水」は日常語よりやや格調があるが、原文の複数形の水が表す圧倒的な量と響きを簡潔に伝える。
