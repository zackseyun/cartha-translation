id: REV.1.8
reference: Revelation 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: ja
  text: 「わたしはアルファであり、オメガである」と、今おられ、かつておられ、来られる方[a]、全能者である主である神が言われる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「そして来たるべき方」。
    reason: ἐρχόμενοςは現在分詞であり、本文の「来られる方」は到来の進行性・確実性を保つ。未来志向を明示する伝統的な訳も可能である。
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: わたしは……である
  rationale: 強調された代名詞を明示し、荘重な自己宣言にふさわしい自然な現代日本語とした。
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: アルファであり、オメガである
  rationale: 英字などに置き換えず、ギリシア文字の名称と黙示文学的な象徴性を保った。
- source_word: λέγει
  choice: 言われる
  rationale: 現在形の発言定型を表しつつ、神を主語とする文脈に合う敬意ある日本語とした。
- source_word: κύριος, ὁ θεός
  choice: 主なる神
  rationale: κύριοςを神の称号「主」とし、同格のὁ θεόςと合わせて、日本語聖書として自然で格調ある表現にした。
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: 今おられ、かつておられ、そして来られる方
  rationale: 三つの並行する神的自己規定を保った。「来られる」は現在分詞の動的な到来と未来的な含意の双方を排除しない。
- source_word: ὁ παντοκράτωρ
  choice: 全能者
  rationale: 神の包括的な支配と力を表す、日本語として定着した簡潔な訳語を採用した。
theological_decisions:
- issue: 神の永遠の存在と将来の到来に関する自己規定
  choice: 今おられ、かつておられ、そして来られる方
  alternative: 今おられ、かつておられ、そしてやがて来られる方
  rationale: ὁ ἐρχόμενοςは現在分詞であり、進行中・確実な到来という動的な含みを持つ一方、終末的な未来の到来とも理解できる。本文では「来られる」として両面を保ち、未来性を明示する訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の自己宣言にふさわしい荘重さを保った。同格表現は原文の順序と神学的な緊張をできるだけ維持している。
