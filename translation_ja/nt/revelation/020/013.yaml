id: REV.20.13
reference: Revelation 20:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: ja
  text: 海は、その中にいた死者たちを引き渡した。死とハデス[a]も、そこにいた死者たちを引き渡した。そして死者たちは一人ひとり、自分の行いに応じて裁かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死者の世界」とも訳せる。ギリシア語は「ハデス」（ᾅδης）であり、しばしば「地獄」と訳されるゲヘナなどの別の語とは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: 引き渡した
  rationale: 基本義は「与える」だが、ここでは海、死、ハデスが死者を裁きのために差し出す文脈なので、「引き渡した」が自然で意味も明確である。
- source_word: ἡ θάλασσα
  choice: 海
  rationale: 定冠詞を含む特定の「海」を指す。日本語では文脈上、冠詞に相当する語を補わず「海」とするのが自然である。
- source_word: τοὺς νεκρούς
  choice: 死者たち
  rationale: 形容詞の名詞的用法を、人々を指すことが明瞭な現代日本語で表した。複数性も「たち」で示した。
- source_word: τοὺς ἐν αὐτῇ / τοὺς ἐν αὐτοῖς
  choice: その中にいた死者たち
  rationale: 前者は海、後者は死とハデスを受ける。日本語では同じ表現を用いて、そこに属していた死者を限定する構造を明確にした。
- source_word: ὁ θάνατος
  choice: 死
  rationale: 黙示文学的に擬人化された力として描かれているが、日本語には大文字による標示がないため、簡潔に「死」とした。
- source_word: ὁ ᾅδης
  choice: ハデス
  rationale: ゲヘナなど最終的な刑罰を表す別の語との区別を保ち、「地獄」という後代の連想を持ち込まないため音写した。意味上の別訳は脚注に示した。
- source_word: ἐκρίθησαν ἕκαστος
  choice: 彼らは、一人ひとり、…裁かれた
  rationale: 複数形の動詞と、各人を個別化する単数のἕκαστοςの双方を自然な日本語で保持した。
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: その行いに応じて
  rationale: ἔργαはここでは各人の行為・所業を指す。「行い」は聖書的な反復表現を保ちながら、現代日本語としても自然である。「応じて」はκατάが表す判断の基準を示す。
theological_decisions:
- issue: 終末の裁きの文脈におけるᾅδηςの訳
  choice: ハデス
  alternative: 死者の世界／地獄
  rationale: 直後の「火の池」など最終的刑罰の表現と区別し、原語の語彙的な独自性を保った。「地獄」はギリシア語が必ずしも含まない神学的連想を加えるため採用しなかった。
- issue: θάνατοςの擬人化
  choice: 死
  alternative: 死の力
  rationale: 原文は「死」と「ハデス」を、死者を引き渡す主体として並べている。「死の力」と説明的に展開せず、原文の擬人化と黙示的緊張をそのまま保った。
- issue: 裁きの個別性
  choice: 彼らは、一人ひとり、その行いに応じて裁かれた
  alternative: 各人は自分の行いに応じて裁かれた
  rationale: 原文の複数動詞と単数の分配語ἕκαστοςの組み合わせを可視化し、死者全体が裁かれつつ裁きが各人に及ぶという表現を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「また」「そして」で三つの節の進行を示し、黙示文学の反復を残した。「死者たち」は具体的な人々と複数性を明示し、「一人ひとり」で個別的な裁きを自然に表現した。
