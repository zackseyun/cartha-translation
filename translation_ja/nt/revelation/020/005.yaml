id: REV.20.5
reference: Revelation 20:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: ja
  text: 残りの死者たちは、千年が終わるまでは生き返らなかった[a]。これが第一の復活である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「千年が終わるまでは生きなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: 残りの死者たち
  rationale: 前節で生き返った者たちと対比される、死者のうち残された者たちを自然かつ明確に表す。
- source_word: οὐκ ἔζησαν
  choice: 生き返らなかった
  rationale: ζάωのアオリストを、直後の「復活」という文脈に即して起動的に訳した。「生きなかった」という可能な直訳は脚注に残す。
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: 千年が終わるまでは
  rationale: ἄχριが示す時の終点と、τελεσθῇの完了・終結の意味を、現代日本語として自然に表す。定冠詞は、すでに文脈に登場した特定の千年として「千年」で十分に伝わる。
- source_word: αὕτη ἡ ἀνάστασις ἡ πρώτη
  choice: これが第一の復活である
  rationale: 指示語の範囲を限定せず、ἀνάστασιςとπρώτηを定着した聖書語彙で直接的に訳す。
theological_decisions:
- issue: 「これが第一の復活である」の指示対象
  choice: 「これ」のまま広く保持し、直前の文脈が述べる復活の現実を指す表現とした。
  alternative: 4節の殉教者だけを指す、義人の死者全体を指す、または霊的な復活を指すと明示する。
  rationale: ギリシア語本文は指示対象をそれ以上限定していないため、特定の千年王国解釈を訳文に持ち込まない。
- issue: ἔζησανの意味合い
  choice: 復活の文脈に即して「生き返らなかった」とした。
  alternative: 「生きなかった」と訳し、身体的または霊的な意味をさらに開いたままにする。
  rationale: 直後のἀνάστασιςとの結び付きから、生への復帰を表す訳が文脈上最も明瞭である。ただし語義上可能な別訳は脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の荘重さに合う「である」体と「第一の復活」という定着した表現を採用した。終末論上の争点は説明的な補足で解消せず、原文の簡潔さと曖昧さを保持した。
