id: REV.20.8
reference: Revelation 20:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: ja
  text: そしてサタンは出て行って、地の四隅にいる諸国の民、すなわちゴグとマゴグ[b]を惑わし[a]、戦い[c]のために彼らを集める。その数は海の砂のようである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「欺き」。この語には「迷わせる」という意味もある。
    reason: lexical_alternative
  - marker: b
    text: 「ゴグとマゴグ」はエゼキエル書38～39章を想起させ、ここでは最後の反逆のために集められる諸国の民を指す類型的な呼び名である可能性がある。
    reason: cross_reference
  - marker: c
    text: 別訳「戦争」。ギリシア語は「戦争」と「戦闘」のどちらも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: 出て行き
  rationale: 未来形の動きを自然な日本語で表した。主語は直前の20:7から続くサタンである。
- source_word: πλανῆσαι
  choice: 惑わし
  rationale: 欺くことと正しい道から迷わせることの双方を含み得る語として、黙示録の文脈に適した簡潔な表現を選んだ。
- source_word: τὰ ἔθνη
  choice: 諸国の民
  rationale: ユダヤ人と対比される『異邦人』に限定せず、諸民族・諸国民を集合的に指す意味を表す。
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: 地の四隅にいる
  rationale: 世界の果てまでを示す聖書的な比喩を保ちつつ、場所を表す自然な日本語にした。
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: すなわちゴグとマゴグ
  rationale: 固有名を音写し、諸国の民を同格的に指し示す構文として訳した。象徴的か地理的かは本文で確定しない。
- source_word: συναγαγεῖν
  choice: 集める
  rationale: 目的を示す不定詞として、サタンが彼らを戦いに向けて集合させる意味を明確にした。
- source_word: εἰς τὸν πόλεμον
  choice: 戦いのために
  rationale: 戦争または特定の戦闘を意味し得る語の幅を保ち、本文では自然な『戦い』を採用した。
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: その数は
  rationale: 集められる諸国の民を受ける関係節を、簡潔で自然な日本語にした。
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: 海の砂のようである
  rationale: 数え切れない多さを示す聖書的な比喩をそのまま保持した。
theological_decisions:
- issue: 省略された動詞の主語
  choice: 直前の節から続くサタンを明示する
  alternative: 主語を省略する、または『彼は』とする
  rationale: ギリシア語本文では主語が明記されないが、20:7で解放されたサタンが文法的・物語的にそのまま主語である。日本語で節を明瞭にするため名を補った。
- issue: 「ゴグとマゴグ」の指示対象
  choice: 諸国の民を同格的に示す名称として訳す
  alternative: 神の終末的な敵の純粋な象徴と断定する、またはエゼキエル書の民族・地域と厳密に同定する
  rationale: エゼキエル38–39章への反響を保ちながら、象徴的・類型的・地理的な解釈のいずれかに限定しない。
- issue: πόλεμοςの範囲
  choice: 本文では『戦い』とし、脚注で『戦争』を示す
  alternative: 本文を『戦争』とする
  rationale: 語は継続的な戦争と個別の戦闘の双方を表し得るため、その曖昧さを脚注で保存した。
translation_notes:
  register: 明瞭で現代的かつ荘重な文体とした。『地の四隅』『海の砂』という黙示的・聖書的な像は保持し、固有名は一般的な日本語表記で音写した。
