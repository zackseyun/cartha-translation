id: REV.20.6
reference: Revelation 20:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: ja
  text: 第一の復活にあずかる者は、幸いであり、聖なる者である。この人々に対しては、第二の死は何の権限も持たない。彼らは神とメシア[a]の祭司となり、千年の間、メシアとともに王として治める。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。ギリシア語の称号Χριστόςの意味を示すため、ここでは「メシア」と訳した。
    reason: Χριστόςの訳語選択を示し、英語POB監査記録の代替訳注に対応させるため。
lexical_decisions:
- source_word: μακάριος
  choice: 幸いである
  rationale: 聖書の祝福宣言として自然であり、主観的な幸福感だけでなく、神の前での祝福された状態を表す。
- source_word: ἅγιος
  choice: 聖なる者
  rationale: 神のために分かたれた身分と聖性の双方を保つ、簡潔で定着した訳語。
- source_word: ὁ ἔχων μέρος
  choice: あずかる者
  rationale: 直訳的な「分け前を持つ」より自然な日本語で、第一の復活への参与を明確に表す。単数の代表的表現も保つ。
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: 第一の復活に
  rationale: 語順を日本語として整えつつ、黙示文学上の用語を解釈せずそのまま保持する。
- source_word: ἐπὶ τούτων
  choice: この人々に対して
  rationale: 直前の「第一の復活にあずかる者」を受け、ἐπίの支配・権限の及ぶ対象という関係を明瞭にする。
- source_word: ὁ δεύτερος θάνατος
  choice: 第二の死
  rationale: 本文の終末論的表現を説明的に言い換えず、形式と神学的緊張を保つ。
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: 何の権限も持たない
  rationale: ἐξουσίαの権威・管轄権の含意を「力」より正確に表し、否定の強さを自然な日本語で示す。
- source_word: ἱερεῖς
  choice: 祭司
  rationale: 礼拝的・祭司的イメージを保つ直接的な訳語。
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: 神とメシアの
  rationale: 属格の並列を簡潔に保ち、Χριστόςの称号としての意味を「メシア」で示す。
- source_word: βασιλεύσουσιν
  choice: 王として治める
  rationale: 単なる一般的統治ではなく、βασιλεύωの王的支配の意味を明瞭にする。
- source_word: μετ’ αὐτοῦ
  choice: メシアとともに
  rationale: 日本語では代名詞「彼」とすると指示対象が曖昧になりやすいため、直前のメシアを明示する。
- source_word: χίλια ἔτη
  choice: 千年の間
  rationale: 明示された期間をそのまま訳し、特定の千年王国解釈を加えない。
theological_decisions:
- issue: Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは神と並置された称号として機能しており、油注がれた者という称号性を見える形で保つ。
- issue: 第一の復活の解釈
  choice: 「第一の復活」と直訳し、性質を説明しない
  alternative: 霊的復活または身体的復活と明示する
  rationale: 本文自体がこの句の性質をここで説明していないため、終末論上の論争を訳文で決着させない。
- issue: 千年の期間
  choice: 「千年の間」と訳す
  alternative: 象徴的な長期間、または文字どおりの千年間と説明する
  rationale: χίλια ἔτηの明示的な期間表現を保ち、その象徴性・字義性について特定の体系を持ち込まない。
- issue: μετ’ αὐτοῦの指示対象
  choice: メシアとともに
  alternative: 彼とともに
  rationale: 文法上の直近の単数男性名詞χριστοῦを指すことを、自然な日本語で明確にする。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある聖書文体。「幸いであり、聖なる者」「第二の死」「祭司」などの主要な聖書語彙を保持しつつ、「あずかる」「この人々に対して」で自然な理解を助けた。代名詞の曖昧さを避けるため、後半のαὐτοῦは「メシア」と明示した。
