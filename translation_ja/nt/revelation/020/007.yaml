id: REV.20.7
reference: Revelation 20:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: ja
  text: そして、千年が終わると、サタンは自分の牢から解き放たれる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: ～すると
  rationale: 接続法を伴って将来の確実な時点を示す時間節であり、終末の出来事の順序を自然な現代日本語で表す。
- source_word: τελεσθῇ
  choice: 終わる
  rationale: 定められた期間が完了することを表す受動形。日本語では自動詞「終わる」が結果的意味を簡潔かつ自然に伝える。
- source_word: τὰ χίλια ἔτη
  choice: 千年
  rationale: 文脈上、先に言及された特定の千年を指す。日本語では冠詞を明示せずとも、その特定性は文脈によって保たれる。
- source_word: λυθήσεται
  choice: 解き放たれる
  rationale: 未来受動を保ち、拘束が解かれるという λύω の像を自然かつ格調ある現代日本語で伝える。肯定的な自由獲得の含意は加えない。
- source_word: ὁ Σατανᾶς
  choice: サタン
  rationale: 日本語聖書で広く定着している名称の音訳を用いる。
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: その牢から
  rationale: φυλακή はこの文脈では監禁場所を指す。「その」はサタンが入れられていた牢を示し、所有物という不要な含意を避ける。
theological_decisions:
- issue: 千年の性質
  choice: 「千年」とそのまま訳し、期間の性質を解釈しない。
  alternative: 文字どおりの千年間、または象徴的な長期間と明示する。
  rationale: 本文自体は千年を文字どおりか象徴的か決定していないため、終末論上の特定の体系を訳文に持ち込まない。
- issue: サタンの解放の評価
  choice: 「解き放たれる」と受動で述べ、行為者や目的を補わない。
  alternative: 神がサタンを解放する、またはサタンが自由になると訳す。
  rationale: ギリシア語は行為者を明示しない未来受動であり、神的受動の可能性を残しつつ、本文以上の説明を加えない。
translation_notes:
  register: 明瞭で現代的ながら黙示文学にふさわしい品位を保った。「そして」により Καί と前後の叙述的連続を反映した。句読点は日本語として完結させた。
