id: REV.20.10
reference: Revelation 20:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: ja
  text: 彼らを惑わしていた悪魔は、火と硫黄の池に投げ込まれた。そこには獣と偽預言者もいる[a]。そして彼らは昼も夜も、永遠にわたって[b]苦しめられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、この節に「いる」に当たる動詞は明記されていない。
    reason: 原文の無動詞節と、訳文で補った動詞を明示するため。
  - marker: b
    text: 直訳すると「諸時代の諸時代に至るまで」。終わりのない継続を強く表す慣用句。
    reason: 原文の強意的な時間表現と、その字義的な形を正確に示すため。
lexical_decisions:
- source_word: διάβολος
  choice: 悪魔
  rationale: 黙示録ではサタンを指す定着した呼称として用いられているため、現代日本語で明確な「悪魔」とした。
- source_word: ὁ πλανῶν αὐτοὺς
  choice: 彼らを惑わしていた
  rationale: 冠詞付き現在分詞が、悪魔を継続的な行為によって特徴づけている。物語の時点との関係を自然に表すため「惑わしていた」とした。
- source_word: ἐβλήθη
  choice: 投げ込まれた
  rationale: 受動態と、池の中へ強制的に入れられる裁きの場面を明確に表す。
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: 火と硫黄の池
  rationale: 属格を伴う二つの名詞を素直に表し、θεῖονを現代語の「硫黄」と訳した。
- source_word: θηρίον
  choice: 獣
  rationale: 黙示録に登場する終末的な存在についての定着した訳語であり、文脈上の呼称を保持する。
- source_word: ψευδοπροφήτης
  choice: 偽預言者
  rationale: 語の構成と黙示録における呼称を直接かつ自然に表す。
- source_word: βασανισθήσονται
  choice: 苦しめられる
  rationale: 受動態の未来と、裁きにおける激しい苦痛を表す。「拷問される」では手段を限定しすぎるため避けた。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼も夜も
  rationale: 絶え間ない継続を示す慣用表現として自然な日本語にした。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 永遠にわたって
  rationale: 字義的には「時代の時代に至るまで」という強意的表現であり、その終わりのない継続を明瞭な現代日本語で表した。
theological_decisions:
- issue: 獣と偽預言者の所在を述べる節に動詞がないこと
  choice: そこには獣と偽預言者もいる
  alternative: そこには獣と偽預言者もいた
  rationale: ギリシア語は無動詞節である。19章20節から続く所在を自然に表す現在形を本文に採用し、過去形を本文へ確定的に持ち込まない一方、原文上の省略は注で明示した。
- issue: 最終的な苦しみの継続期間
  choice: 永遠にわたって
  alternative: 時代の時代に至るまで
  rationale: εἰς τοὺς αἰῶνας τῶν αἰώνων の強意的な継続を弱めず、かつ日本語として理解しやすく表した。より逐語的な形は注に示し、この節を越える教理的議論は訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「悪魔」「獣」「偽預言者」は黙示録の呼称として一貫性を優先した。「世々限りなく」は伝統的だが日常の読者には意味が取りにくいため、本文では「永遠にわたって」とし、原文に近い形を脚注に残した。
