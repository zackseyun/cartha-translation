    issue: 「そのための場所」がαὐτοῖςの指示対象を曖昧にしている。
    rationale: 日本語の「そのため」は通常、目的・理由を表しうるため、「地と天のために」という与格の意味が明瞭に伝わらない。「それらのための場所」として、地と天を受けることを明示する。
  - severity: low
    issue: 「そこに座っておられる方」はἐπ’ αὐτοῦ（その上に）をやや一般化している。
    rationale: 文脈上は御座を指すことが明らかだが、「その上に」とすれば原文の前置詞句と御座との結び付きがより直接に表れる。
