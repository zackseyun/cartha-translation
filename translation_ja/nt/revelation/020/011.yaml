id: REV.20.11
reference: Revelation 20:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: ja
  text: また私は、大きな白い御座と、その上に座っておられる方を見た。その方の御前から[a]地と天は逃げ去り、それらのための場所は見つからなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その方の顔から」。ここでは「その方の御前から」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: 大きな白い御座
  rationale: 形容詞の順序を自然な日本語にしつつ、μέγανの大きさと威容、λευκόνの白さを保った。「御座」は黙示文学の荘重な王座のイメージに適する。
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: そこに座っておられる方
  rationale: 着座者の正体を本文以上に特定せず、分詞表現と王座に座す姿を自然で敬意ある日本語で表した。
- source_word: ἀπὸ τοῦ προσώπου
  choice: その方の御前から
  rationale: πρόσωπονの字義は「顔」だが、ἀπόとの構文では「面前・臨在から」の意味になる。「御前」は人物的な像を保ちながら日本語として自然である。字義的な選択肢は脚注に示した。
- source_word: ἔφυγεν
  choice: 逃げ去り
  rationale: 「消えた」と解釈的にせず、φεύγωの逃走という鮮明な擬人的描写を保った。
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: 地と天
  rationale: 黙示文学的な宇宙全体を指す対句として簡潔で荘重な日本語にした。「空」ではなく「天」として神学的・終末論的文脈を保つ。
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: そのための場所は見つからなかった
  rationale: 受動形「見つからなかった」を保持した。αὐτοῖςは直前の「地と天」の双方を受けるため、単数的な「それ」ではなく「そのため」とした。
theological_decisions:
- issue: 御座に座っている方の同定
  choice: 「そこに座っておられる方」とし、固有の同定を加えない
  alternative: 神、父なる神、あるいはメシアであると明示する
  rationale: この節自体は着座者を名指ししていないため、ギリシア語の描写的表現を保ち、本文にない神学的特定を避けた。
- issue: 地と天が逃げる描写の性質
  choice: 「逃げ去り」として擬人的・黙示的描写を保持する
  alternative: 「消え去り」「滅ぼされ」と解釈的に表す
  rationale: φεύγωの像をそのまま保ち、宇宙の消滅または変容についてこの節だけで結論を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録の荘重さに合わせて「御座」「御前」「座っておられる方」を用いた。人物の正体や地と天の最終状態を本文以上に説明しない。
