source:
  edition: SBLGNT
  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: ja
  text: そして彼は、太古の蛇[a]、すなわち悪魔でありサタンである竜を捕らえ、それを千年の間縛った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「古くからの蛇」または「あの昔の蛇」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκράτησεν
  choice: 捕らえ
  rationale: ここでのκρατέωは、力をもって確保する決定的な動作を表す。「捕らえ」は簡潔で自然であり、「つかんだ」よりも文脈に合う。
- source_word: δράκοντα
  choice: 竜
  rationale: 黙示文学的な形象を保ち、ヨハネの黙示録内の用語の一貫性にも適する標準的な訳語。
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: あの古くからの蛇
  rationale: 竜を同格で説明する句。「古くからの」はἀρχαῖοςの時間的な意味を自然な現代日本語で表し、「あの」は既知の蛇を指し示す含みを伝える。
- source_word: Διάβολος
  choice: 悪魔
  rationale: 人格的な称号として定着した標準的な訳語であり、サタンとの並列を保つ。
- source_word: Σατανᾶς
  choice: サタン
  rationale: 固有の名・称号として定着した音写を用いる。
- source_word: ἔδησεν
  choice: 縛った
  rationale: δέωの具体的な拘束の比喩を保ち、拘束の性質を解釈によって限定しない。
- source_word: χίλια ἔτη
  choice: 千年の間
  rationale: 期間を表す対格を自然な日本語で示し、千年が文字どおりか象徴的かは訳文で決定しない。
theological_decisions:
- issue: 千年の性質
  choice: χίλια ἔτηを「千年の間」とそのまま訳す。
  alternative: 文字どおりの千年間、または象徴的・比喩的な期間と明示する。
  rationale: 本文は期間の解釈を説明していないため、終末論上の論争を訳文で解消せず、緊張と曖昧さを保つ。
- issue: 竜の同定
  choice: 竜を「古くからの蛇」「悪魔」「サタン」とする同定をすべて保持する。
  alternative: これらを一つの呼称にまとめる。
  rationale: 原文自身が複数の呼称を重ねて明示的に同定しており、その連鎖は神学的・文学的に重要である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すなわち」を用いて同格関係を明示しつつ、原文の一連の同定と具体的な動作を保持した。
