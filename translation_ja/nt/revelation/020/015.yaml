source:
  edition: SBLGNT
  text: καὶ εἴ τις οὐχ εὑρέθη ἐν ⸂τῇ βίβλῳ⸃ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/015.yaml
  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: ja
  text: また、だれでも、いのちの書[a]に記されている者として見いだされなければ、火の池に投げ込まれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「いのちの巻物」とも訳せる。ギリシア語は書物または巻物を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἴ τις
  choice: また、…者はだれでも
  rationale: καίの接続を「また」で示し、εἴ τιςの不定条件を、現代日本語で自然な「…者はだれでも」によって一般的な条件として表した。
- source_word: οὐχ εὑρέθη ... γεγραμμένος
  choice: 名が記されていると認められなかった
  rationale: 直訳的な「書かれているのが見いだされなかった」は日本語では不自然なため、裁きの場面での確認・判定というεὑρέθηの含みを「認められなかった」で表した。「名」は原文に明示されないが、人が書に記載されるという日本語表現を明瞭にするための最小限の補足である。
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: いのちの書
  rationale: βίβλοςには書物と巻物の両義がある。「いのちの書」は明瞭で定着した表現であり、具体的な形状を不必要に限定しない。巻物の可能性は脚注に残した。
- source_word: ἐβλήθη
  choice: 投げ込まれた
  rationale: βάλλωの受動形が示す、外から強制的に中へ入れられる動きを、古風でない現代日本語で表した。
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: 火の池に
  rationale: 黙示録の比喩的イメージを解釈で言い換えず、そのまま簡潔に保持した。
theological_decisions:
- issue: 最後の裁きのイメージ
  choice: 火の池
  alternative: 燃える火の池
  rationale: 原文の属格表現を定着した簡潔な形で訳し、最終的刑罰の性質について特定の教派的説明を加えなかった。
- issue: 不定単数の人物表現
  choice: 者はだれでも
  alternative: その人は
  rationale: ギリシア語は不定代名詞と単数形を用いるが、日本語では文法上の性を表示する必要がない。「者はだれでも」は個々人を対象とする一般条件を保ちつつ、原文にない男性限定を持ち込まない。
translation_notes:
  register: 明瞭で荘重さを保った現代標準日本語。「いのち」は日本語聖書で親しまれた表記を採用した。原文の条件文は自然な日本語の一般条件に組み替え、黙示的イメージは説明的に解消していない。
