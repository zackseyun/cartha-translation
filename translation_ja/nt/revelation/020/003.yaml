id: REV.20.3
reference: Revelation 20:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: ja
  text: そして、その竜を底なしの淵[a]に投げ込み、そこを閉ざし、その上を封印した。千年が終わるまで、彼がもはや諸国の民を惑わすことのないようにするためである[b]。その後、彼はしばらくの間、解き放たれなければならない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「深淵」。
    reason: lexical_alternative
  - marker: b
    text: 「惑わす」は「欺く」「道を誤らせる」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「彼は短い間、解放されなければならない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν αὐτὸν
  choice: その竜を……投げ込み
  rationale: βάλλωの強い動作性を「投げ込み」で表した。αὐτόνの指示対象は直前の文脈にある竜であり、日本語で明確にするため「その竜」とした。
- source_word: τὴν ἄβυσσον
  choice: 底知れぬ所
  rationale: 黙示録における終末論的な場所を指す語として、現代の一般読者にも意味が伝わりやすい表現を採用した。「底なしの淵」も可能なので脚注に示した。
- source_word: ἔκλεισεν
  choice: そこを閉ざして
  rationale: κλείωの「閉じる」という基本義を保ちつつ、厳重に閉鎖する場面に合う自然で格調ある表現とした。目的語は文脈からἄβυσσοςを補って「そこ」とした。
- source_word: ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: 彼の上に封印をした
  rationale: σφραγίζωの「封印する」と、ἐπάνω αὐτοῦの空間的関係をできるだけ直接に保持した。何を封じたかを過度に具体化せず、原文の簡潔さを残した。
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: 彼がもはや諸国の民を惑わすことのないようにするため
  rationale: πλανάωを黙示録で自然な「惑わす」とし、ἔτιを「もはや」で表した。τὰ ἔθνηは民族集団を指し得るため、「諸国」だけでなく「諸国の民」とした。
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: 千年が終わるまで
  rationale: τελεσθῇが表す期間の完了を簡潔な現代日本語で示した。「千年」が文字どおりか象徴的かは訳文で決定しない。
- source_word: μετὰ ταῦτα
  choice: その後
  rationale: 時間的推移を自然な現代日本語で表し、意味を過不足なく伝えた。
- source_word: δεῖ λυθῆναι αὐτὸν
  choice: 彼は……解き放たれなければならない
  rationale: δεῖの必要性を「なければならない」で保持し、λύωの受動態を拘束からの解放を表す「解き放たれる」とした。
- source_word: μικρὸν χρόνον
  choice: しばらくの間
  rationale: 限定された短い期間を示す自然な日本語。より明示的な「短い間」も可能なので脚注に示した。
theological_decisions:
- issue: 「千年」の性質
  choice: 「千年」と解釈を加えずに訳す。
  alternative: 文字どおりの千年間、または象徴的な長期間と明示する。
  rationale: 原文自体はここで期間の解釈を説明していないため、千年王国をめぐる立場を訳文に持ち込まない。
- issue: δεῖが示す必要性
  choice: 「解き放たれなければならない」と訳し、必要性だけを示す。
  alternative: 神の定めによって解放される、または物語上そうなると説明する。
  rationale: δεῖは必要性を示すが、この節だけではその仕組みを明示していない。神学的な説明を補わず、原文の緊張を保つ。
- issue: ἐπάνω αὐτοῦの関係
  choice: 「彼の上に封印をした」と空間表現を保持する。
  alternative: 入口を封印した、または彼を封印したと具体化する。
  rationale: 原文は封印の位置を「彼の上に」と述べるが、対象物を明記しない。場面を過度に補足せず、その曖昧さを残す。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、黙示文学の厳粛さを保つため「閉ざす」「封印」「解き放つ」を用いた。接続詞καίの連続は、日本語として冗長にならないよう文を分けた。すべての脚注記号を対応箇所に置いた。
