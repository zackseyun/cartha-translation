  to: そして、その竜を底なしの淵[a]に投げ込み、そこを閉ざし、その上を封印した。千年が終わるまで、彼がもはや諸国の民を惑わすことのないようにするためである[b]。その後、彼はしばらくの間、解き放たれなければならない[c]。
