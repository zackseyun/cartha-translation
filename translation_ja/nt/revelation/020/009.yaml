id: REV.20.9
reference: Revelation 20:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: ja
  text: 彼らは地の広がりの上に上って来て、聖なる者たちの陣営と、愛されている都[c]を取り囲んだ[b]。そして、天から[a]火が降って来て、彼らを焼き尽くした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異読では「神のもとから」が加わり、「神のもとから天より火が降って来て」となります。
    reason: textual_variant
  - marker: b
    text: 別訳「包囲した」。
    reason: lexical_alternative
  - marker: c
    text: 本文は「愛されている都」がどの都かを明示していません。一般にエルサレム、またはより広く神の都と理解されます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: 進み
  rationale: 基本義は「上る」だが、ここでは広大な地表を進軍する動きを表す文脈であり、日本語では「進み」が自然。地理的な上昇を断定しない。
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: 地の広がりを
  rationale: πλάτοςの「幅、広がり」を保ち、「平原」という原文にない地形情報を加えない。γῆは黙示録の広い文脈に合わせて「地」とした。
- source_word: ἐκύκλευσαν
  choice: 取り囲んだ
  rationale: 「周囲を巡って囲む」という意味を、明瞭で自然な現代日本語で表す。
- source_word: παρεμβολὴν
  choice: 陣営
  rationale: 軍事的な宿営を含意し得る語であり、黙示的な対峙の場面に合う簡潔な訳語。
- source_word: τῶν ἁγίων
  choice: 聖なる者たち
  rationale: ἅγιοιの字義を保ちつつ、現代の一般読者にも意味が伝わる表現。「聖徒」より平明。
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: 愛されている都
  rationale: 完了受動分詞の継続的・結果的な含みを表し、愛する主体を本文で補わない。
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: 天から火が降って来て
  rationale: 原文の方向とイメージを自然な日本語で再現する。
- source_word: κατέφαγεν αὐτούς
  choice: 彼らを焼き尽くした
  rationale: 火を主語とする場合の「食い尽くす、滅ぼし尽くす」を、日本語で自然な火の表現として訳す。
theological_decisions:
- issue: 「愛されている都」の指示対象
  choice: 本文では固有名を補わず「愛されている都」とする
  alternative: エルサレム、または終末的な神の民／神の都と明示する
  rationale: ギリシア語本文はこの都を明示的に特定していないため、解釈上の可能性と緊張を保持する。
- issue: ἠγαπημένηνの行為主体
  choice: 受動表現を保ち、誰に愛されているかを明示しない
  alternative: 「神に愛されている都」とする
  rationale: 文脈上は神が含意され得るが、原文に行為主体は明記されていない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「聖なる者たち」で専門的な教会語を避け、「都」で聖書的・黙示的な調子を保った。節末の異読注[a]は該当箇所が「天から火が降る」句であることを踏まえ、その文の後に配置した。
