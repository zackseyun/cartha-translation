id: REV.20.14
reference: Revelation 20:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: ja
  text: そして、死とハデスは火の池に投げ込まれた。この火の池が第二の死である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ハデス」は、死者の領域を指すギリシア語の音写。ここでは「火の池」と区別されているため、「地獄」と訳すと両者を混同させるおそれがある。「陰府」または「死者の世界」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: 死
  rationale: 第一節ではハデスと並んで投げ込まれる擬人化された存在として読めるが、日本語では大文字による区別ができないため「死」とし、文脈に擬人化を委ねた。「第二の死」でも同じ語を自然に用いた。
- source_word: ᾅδης
  choice: ハデス
  rationale: 火の池とは別のものとして描かれているため、「地獄」と同一視せず、ギリシア語固有の概念を音写して区別を保った。
- source_word: ἐβλήθησαν
  choice: 投げ込まれた
  rationale: アオリスト受動態の強制的に中へ入れられる動きを、明瞭で現代的な日本語で表した。
- source_word: λίμνη τοῦ πυρός
  choice: 火の池
  rationale: 黙示文学的な像を説明的に言い換えず、属格構文を簡潔かつ定着した表現で訳した。
- source_word: οὗτος
  choice: この火の池が
  rationale: ギリシア語の指示代名詞の指示対象を日本語で明確にし、直前の「火の池」と「第二の死」の同定を自然に表した。
- source_word: θάνατος ὁ δεύτερος
  choice: 第二の死
  rationale: 冠詞付き名詞と序数形容詞から成る黙示録の特徴的な呼称を、簡潔に保った。
theological_decisions:
- issue: 終末的裁きの文脈におけるᾅδηςの訳
  choice: ハデス
  alternative: 陰府／死者の世界／地獄
  rationale: 本文はハデスを火の池へ投げ込まれるものとして区別している。「地獄」では両者を混同しかねず、「死者の世界」では解釈を一つに限定しやすいため、音写により概念上の区別と曖昧さを保った。
- issue: 後半の同格・同定関係
  choice: 「この火の池が第二の死である」
  alternative: 「これが第二の死、火の池である」
  rationale: ギリシア語は「第二の死」と「火の池」を同格的に結び付ける。日本語では指示対象を明示する語順のほうが自然であり、同定関係を保ちつつ余分な因果説明を加えない。
- issue: θάνατοςの擬人化
  choice: 表記は「死」とし、擬人化は統語と文脈で示す
  alternative: 「死神」または括弧・特殊表記で固有名詞化する
  rationale: 原文は「死」を擬人化しているが、「死神」は原文にない存在像を加える。日本語には大文字小文字の対立がないため、語を追加せず文脈に文学的効果を担わせた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示文学の荘重さを保った。「ハデス」は一般読者には説明が必要なため脚注を付した。後半はギリシア語の同格的反復を、日本語として自然な同定文に整えた。
