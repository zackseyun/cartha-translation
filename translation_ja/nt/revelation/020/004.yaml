id: REV.20.4
reference: Revelation 20:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: ja
  text: また私は、いくつもの王座を見た。そこに座る者たちがいて、彼らには裁きが与えられた。そして私は、イエスの証し[a]のため、また神の言葉のために首をはねられた人々の魂と、獣もその像も拝まず、額にも手にも刻印を受けなかった人々を見た。彼らは生き返り、メシア[b]とともに千年の間、王として治めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスについての証し」とも訳せる。「イエスの証し」というギリシア語表現は、イエスがなさった証しとも、イエスについての証しとも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「キリストとともに」とも訳せる。ギリシア語の Χριστός は、ここでは称号として「メシア」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: 幾つもの王座
  rationale: 複数形を自然な日本語で明示し、黙示文学の具体的な情景を保った。
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: 人々がその上に座り
  rationale: ギリシア語の能動複数を保ちつつ、日本語では主語を補わないと不自然なため「人々」とした。誰であるかは特定せず、原文の曖昧さを保持した。
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: 裁きが彼らに与えられた
  rationale: 裁く権威、裁判行為、判決のいずれにも取り得る κρίμα の幅を狭めないよう、解釈的な「裁く権威」を本文に加えなかった。
- source_word: ψυχὰς
  choice: 魂
  rationale: 幻の中で死者の魂が見えるという黙示文学的な像をそのまま保った。
- source_word: πεπελεκισμένων
  choice: 首をはねられた
  rationale: 斧による処刑を語源的に過度に前面化せず、指示される処刑方法を明瞭で自然な日本語にした。
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: イエスの証しのため
  rationale: Ἰησοῦ の属格が「イエスによる証し」と「イエスについての証し」の双方を許すため、本文では曖昧さを保った。
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: 神の言葉のため
  rationale: διά＋対格の原因を「ため」で示し、λόγος τοῦ θεοῦ を定着した明瞭な表現で訳した。
- source_word: προσεκύνησαν
  choice: 拝まず
  rationale: 単なる身体動作でなく宗教的な崇拝を表す文脈に即し、簡潔な「拝む」を用いた。
- source_word: χάραγμα
  choice: 刻印
  rationale: 押され、刻まれた識別標識という語感を示しつつ、黙示録の文脈で自然な語を選んだ。
- source_word: ἔζησαν
  choice: 生き返り
  rationale: 文脈上の出来事としての生への移行を表しながら、その復活の性質について本文以上の教理的限定を加えなかった。
- source_word: χριστοῦ
  choice: メシア
  rationale: ここでは固有名のような用法より称号としての機能が明瞭なため、「メシア」とした。
- source_word: ἐβασίλευσαν
  choice: 王として治めた
  rationale: 単に支配したではなく、王として統治する語義を明瞭に表した。
theological_decisions:
- issue: ἐκάθισαν の主語と κρίμα の受領者
  choice: 「人々」「彼ら」とし、具体的な身元を特定しない
  alternative: 殉教者、すべての聖徒、使徒、天上の法廷の者たちと特定する
  rationale: 原文では主語が明示されていないため、特定の集団を本文に持ち込まない。
- issue: διὰ τὴν μαρτυρίαν Ἰησοῦ の属格
  choice: 本文を「イエスの証し」として曖昧さを保持する
  alternative: 「イエスについての彼らの証し」または「イエスがなさった証し」
  rationale: 主格的属格と目的格的属格の双方が文法上可能であり、一方に限定しない。
- issue: Χριστός の訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では称号として機能していることを明確にする。
- issue: ἔζησαν の解釈
  choice: 生き返ったという出来事を表すが、その性質を限定しない
  alternative: 単に「生きた」、または「再び生きた」とする
  rationale: 直前に死者の魂が語られる文脈を反映しつつ、千年王国や復活に関する特定の体系を訳文に持ち込まない。
- issue: 二つの集団か一つの集団か
  choice: 「首をはねられた人々の魂」と「拝まなかった人々」を並列的に訳し、同一集団か別集団かを断定しない
  alternative: 後者を前者の説明と見て一集団に限定する
  rationale: καί と οἵτινες の関係には解釈の余地があるため、自然な日本語の範囲で構造上の緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、幻の荘重さを保った。無名の着座者、κρίμα の意味範囲、「イエスの証し」の属格、殉教者と獣を拝まなかった者との関係を解釈で固定しないよう配慮した。脚注記号は対応箇所を明確にするため、[a]を「イエスの証し」、[b]を「メシア」の直後に置くのが最適である。
