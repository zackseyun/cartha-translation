id: REV.20.12
reference: Revelation 20:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: ja
  text: また私は、死者たちが、身分の高い者も低い者も、御座の前に立っているのを見た。すると、いくつかの書物[a]が開かれた。また、もう一つの書物が開かれた。それは命の書である。死者たちは、それらの書物に記されていることに基づき、それぞれの行いに応じて裁かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「書物」は、古代の媒体を踏まえて「巻物」とも訳せる。
    reason: cultural_note
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: 死者たち
  rationale: 実体詞的な形容詞で、死んだ人々を集合的に指す。「死者たち」は明瞭で厳粛な調子も保つ。
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: 身分の高い者も低い者も
  rationale: 直訳的な「大きい者と小さい者」では日本語で意味が不明瞭になりやすいため、社会的地位を問わず全員を含む対句として自然に表した。
- source_word: ἑστῶτας
  choice: 立っている
  rationale: 完了形分詞の結果状態を表し、御座の前に立った状態を自然に伝える。
- source_word: ἐνώπιον τοῦ θρόνου
  choice: 御座の前に
  rationale: ἐνώπιονを「前に」、θρόνοςを黙示録の荘重な文脈に合う「御座」とした。「裁きの座」は本文以上の解釈を加えるため避けた。
- source_word: βιβλία
  choice: 数々の書
  rationale: 複数形を明示しつつ、古代の巻物にも適用できる広い日本語「書」を用いた。媒体については脚注で補足する。
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: 開かれた
  rationale: 受動形をそのまま保ち、「封印が解かれた」のような本文にない限定を加えない。
- source_word: ἄλλο βιβλίον
  choice: もう一つの書
  rationale: 先の複数の書とは別に追加された一つの書であることを自然に示す。
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: それは命の書である
  rationale: τῆς ζωῆςに省略されているβιβλίονを日本語で補い、簡潔で定着した「命の書」とした。
- source_word: ἐκρίθησαν
  choice: 裁かれた
  rationale: 司法的な判断を表し、結果が有罪であると先取りする「断罪された」は避けた。
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: それらの書に記されていることに基づき
  rationale: ἐκが示す裁きの根拠を「に基づき」で明確にし、完了分詞の記録済みの状態を「記されている」で表した。
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: それぞれの行いに応じて
  rationale: κατάの規準・対応関係を「に応じて」で表し、ἔργαを現代日本語で自然かつ広い意味を持つ「行い」とした。
theological_decisions:
- issue: 行いに応じた裁き
  choice: それぞれの行いに応じて裁かれた
  alternative: 彼らのわざに従って裁かれた
  rationale: 本文が明言する、行いを規準とする裁きを弱めずに訳した。他の教理との体系的な調整や説明は本文に持ち込まず、神学的緊張を保持した。
- issue: 裁きの結果
  choice: 裁かれた
  alternative: 有罪とされた
  rationale: κρίνωはここで司法的な裁きを意味するが、語そのものは全員の評決内容を特定しないため、断罪と限定しなかった。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、黙示録の荘重さを保つため「御座」「命の書」「裁かれた」を用いた。「身分の高い者も低い者も」は原文の対句が全階層を含むことを自然に伝える。脚注記号[a]は本文中の対応箇所に配置した。
