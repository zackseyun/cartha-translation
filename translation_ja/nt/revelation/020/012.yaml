  to: また私は、死者たちが、身分の高い者も低い者も、御座の前に立っているのを見た。すると、いくつかの書物[a]が開かれた。また、もう一つの書物が開かれた。それは命の書である。死者たちは、それらの書物に記されていることに基づき、それぞれの行いに応じて裁かれた。
