  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: ja
  text: また、私は、天から下って来るひとりの天使を見た。その天使は、深淵[a]の鍵と大きな鎖を手にしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「深淵」は、ギリシア語ではアビュッソス。「底なしの淵」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: また
  rationale: 幻の連続を示す並列的な接続を保ちつつ、現代日本語の物語として自然にした。
- source_word: εἶδον
  choice: 私は…見た
  rationale: 幻の叙述におけるアオリストの直接的な表現を、そのまま簡潔に訳した。
- source_word: ἄγγελον
  choice: 一人の御使い
  rationale: 文脈上は天上の存在を指すため、「使者」ではなく、聖書日本語として定着しつつ敬意ある「御使い」とした。
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: 天から下って来る
  rationale: 分詞が表す進行中の動きと、天を起点とする方向を自然な日本語で示した。
- source_word: ἔχοντα
  choice: その手には…があった
  rationale: 鍵と鎖を携えている光景を、日本語として明瞭に描写した。
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: 底知れぬ所の鍵
  rationale: κλείςと属格の関係を保った。「底知れぬ所」はἄβυσσοςの深さと領域性を表し、日本語で意味を理解しやすい。
- source_word: ἅλυσιν μεγάλην
  choice: 大きな鎖
  rationale: μέγαςを過度に強めず、鎖の大きさを率直に表した。
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: その手には
  rationale: 字義的な「手の上に」より、物を携える情景として自然であり、原文の位置表現も損なわない。
theological_decisions:
- issue: 黙示文学におけるἄβυσσοςの訳語
  choice: 底知れぬ所
  alternative: 深淵／底なしの淵
  rationale: 特定の宇宙論的説明を付け加えず、到達不能な深みを示す原語の像を分かりやすく表した。「底なしの淵」と限定しすぎる可能性は脚注で補った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の荘重な幻の語調を保った。「御使い」は一般読者にも通じる伝統的な聖書語として採用した。脚注記号は節末に置き、ἄβυσσοςの訳語の幅を示した。
