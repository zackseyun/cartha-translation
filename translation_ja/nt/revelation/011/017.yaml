id: REV.11.17
reference: Revelation 11:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: ja
  text: こう言った。「今おられ、かつておられた方、全能の神である主よ、私たちはあなたに感謝します。あなたがご自分の大いなる力を手に取られ、王として治め始められた[a]からです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「王として治められた」または「王となられた」とも訳せる。ギリシア語の動詞は、王としての支配の開始、またはその行使を表し得る。ここでは、神の支配が決定的に現されたことに重点があると考えられる。なお、本文の「今おられ、かつておられた方」には、黙示録のほかの箇所に見られる「やがて来られる方」という句は含まれていない。
    reason: lexical_alternative_and_textual_note
lexical_decisions:
- source_word: λέγοντες
  choice: こう言った
  rationale: 前節の二十四人の長老たちの動作を受け、その発言内容を導入する現在分詞。日本語では独立した引用導入として「こう言った」が自然。
- source_word: Εὐχαριστοῦμέν σοι
  choice: 私たちはあなたに感謝します
  rationale: εὐχαριστέω の感謝を表す意味と、天上の礼拝にふさわしい丁寧で荘重な調子を保つ。
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: 全能の神である主よ
  rationale: 呼格 κύριε と同格的な神名・称号を、明瞭で自然な日本語の呼びかけにまとめた。παντοκράτωρ は黙示録で用いられる神の称号として「全能」とした。
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: 今おられ、かつておられた方
  rationale: 定冠詞を伴う分詞的な神の呼称として訳し、現在と過去の対照を保持した。本文にない「やがて来られる方」は補わない。
- source_word: ὅτι
  choice: からです
  rationale: 感謝の理由を示す因果的用法を明確に表す。
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: あなたがご自分の大いなる力を取り
  rationale: 完了形 εἴληφας の、すでに成し遂げられ現在にも効力を持つ行為を文脈上自然に表現する。「大いなる」は礼拝文の荘重さを保つ。
- source_word: ἐβασίλευσας
  choice: 王として治め始められた
  rationale: アオリストが文脈上示し得る王的支配の開始・決定的発現を表す。同時に、神がそれ以前には主権者でなかったと断定する表現を避ける。
theological_decisions:
- issue: 神の称号に「やがて来られる方」を加えるか
  choice: 「今おられ、かつておられた方」とし、加えない
  alternative: 「今おられ、かつておられ、やがて来られる方」
  rationale: SBLGNT本文は ὁ ὢν καὶ ὁ ἦν のみであり、黙示録の別の箇所の定型句へ調和させず、短い形をそのまま保つ。
- issue: ἐβασίλευσας が表す王的支配の様相
  choice: 王として治め始められた
  alternative: 王として治められた／王となられた
  rationale: 終末的文脈における神の支配の決定的な開始・公然たる発現を示し得る語感を保つ。「王となられた」は、それ以前の神の主権を否定するかのような不必要な含意を生みやすい。
translation_notes:
  register: 現代標準日本語を用いながら、天上の礼拝にふさわしい明瞭で荘重な調子と、神への敬語を保った。長い呼称は「今おられ、かつておられた方、全能の神である主よ」と配置し、原文の称号の連なりを自然な日本語で再現した。
