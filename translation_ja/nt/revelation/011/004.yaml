  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: ja
  text: この二人は、地の主の御前に立つ二本のオリーブの木と二つの燭台である[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ゼカリヤ4章を踏まえた表現。そこでも、二本のオリーブの木と燭台の像が用いられている。
    reason: cross_reference
  - marker: b
    text: 「立つ」は原文では男性複数形で、「この二人」を受ける。
    reason: grammatical_note
lexical_decisions:
- source_word: Οὗτοί
  choice: この二人
  rationale: 男性複数の指示代名詞で、文脈上、前節の二人の証人を指す。「二人」を補うことで日本語として指示対象を明確にしつつ、「証人」という語を本文に持ち込まない。
- source_word: ἐλαῖαι
  choice: オリーブの木
  rationale: ゼカリヤ4章を踏まえた象徴的な樹木の像を保つ。現代日本語で分かりやすい名称とした。
- source_word: λυχνίαι
  choice: 燭台
  rationale: 語義は灯火そのものではなく、それを載せる台を指す。黙示録における一貫した象徴表現を保つ。
- source_word: ἐνώπιον
  choice: 御前に
  rationale: 単なる空間的位置だけでなく、主の臨在の前にあることを、簡潔で品位ある日本語で表す。
- source_word: κυρίου
  choice: 主
  rationale: κύριοςの尊称として自然であり、ここでの神学的な重みを保つ。
- source_word: γῆς
  choice: 地
  rationale: γῆは「地」または「土地」を意味し得るが、黙示録の宇宙的文脈と称号表現を踏まえ、「地の主」とした。
- source_word: ἑστῶτες
  choice: 立っている
  rationale: 完了能動分詞が示す、立った状態にあることを自然な現代日本語で表す。文法上、男性複数のΟὗτοίを受ける理解を本文に採った。
theological_decisions:
- issue: ゼカリヤ4章の比喩と二人の証人との関係
  choice: 「二本のオリーブの木、また二つの燭台である」と同定の比喩をそのまま残す。
  alternative: 「二本のオリーブの木と二つの燭台のような者である」と直喩化する。
  rationale: ギリシア語は説明的な「ような」を置かず、黙示的な像によって直接同定している。象徴の意味を本文で決めつけず、相互参照の緊張を保つ。
- issue: ἑστῶτεςが修飾する対象
  choice: 「この二人」が地の主の御前に立っていると読む。
  alternative: 「二本のオリーブの木と二つの燭台」が地の主の御前に立っていると表現する。
  rationale: 分詞は男性複数形であり、直近の女性複数名詞ἐλαῖαιとλυχνίαιではなく、男性複数のΟὗτοίに文法的に対応する。ただし語順上、像全体にかかるようにも受け取れるため、別訳を注記する。
translation_notes:
  register: 明瞭な現代標準語を基調とし、「御前」「燭台」で聖書本文にふさわしい品位を保った。「この二人」は自然な日本語のための最小限の明示であり、「証人」という解釈語は繰り返していない。
