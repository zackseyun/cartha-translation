id: REV.11.7
reference: Revelation 11:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: ja
  text: そして、彼らがその証しを終えると、底知れぬ深みから上って来る獣が彼らに戦いを挑み、彼らに勝って、彼らを殺す。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελέσωσιν
  choice: 終える
  rationale: ὅτανに続くアオリスト接続法で、将来において証しが完了する時を示す。「終える」は自然な現代日本語で、与えられた務めの完遂という意味を保つ。
- source_word: μαρτυρίαν
  choice: 証し
  rationale: 「証言」も可能だが、「証し」は黙示録における証言行為と信仰的証言の両面を自然に表し、「証しを終える」という結び付きも明瞭である。
- source_word: θηρίον
  choice: 獣
  rationale: 黙示文学の文脈に定着した簡潔で正確な訳語。「野獣」よりも、この象徴的存在を指す用語として自然である。
- source_word: ἀναβαῖνον
  choice: 上って来る
  rationale: 現在分詞の生き生きとした動きを関係節として表す。「上る」だけでなく「来る」を添え、語り手の視点から出現する動きを自然に示す。
- source_word: ἀβύσσου
  choice: 底知れぬ所
  rationale: 「深淵」も可能だが、一般読者に分かりやすく、測り知れない深みという語義を保つ。「底なしの穴」のように形状を限定しすぎない。
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: 彼らに戦いを挑み
  rationale: 直訳的な「彼らと戦いを行う」より自然で、文脈上明白な敵対関係を表す。μετά＋属格を含む戦争の慣用表現の意味を、現代日本語の慣用句で伝える。
- source_word: νικήσει
  choice: 彼らに勝って
  rationale: 戦いの文脈に即した明瞭な表現。「征服する」は対象が人物の場合やや不自然で、「打ち勝つ」より簡潔である。
- source_word: ἀποκτενεῖ
  choice: 彼らを殺す
  rationale: 直接的で自然な現代語。「殺害する」や「死に至らせる」よりも原文の簡潔さを保つ。
theological_decisions:
- issue: ποιήσει μετ’ αὐτῶν πόλεμον における敵対関係の表現
  choice: 彼らに戦いを挑み
  alternative: 彼らと戦いをし
  rationale: ギリシア語は字義上「彼らと戦争を行う」だが、後続する「勝つ」「殺す」により敵対性は明白である。日本語では「戦いを挑む」がこの慣用的意味を自然かつ明確に伝え、特定の神学的解釈を付加しない。
translation_notes:
  register: 明快で格調を失わない現代標準語。原文の三つの未来動詞の連鎖を「挑み、勝って、殺す」と滑らかに再現し、終末論的象徴の正体について解釈を加えない。
