id: REV.11.15
reference: Revelation 11:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: ja
  text: '第七の天使がラッパを吹いた[a]。すると、天で大きな声がいくつも上がり、こう言った。


    「世の王国は、私たちの主とそのメシア[b]のものとなった。そして、その方は永遠に王として治める[c]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「世の諸王国は……となった」または「この世の王国は……となった」とある。SBLGNT本文は単数で、「世の王国は……となった」とある。
    reason: textual_variant
  - marker: b
    text: 別訳「そのキリスト」。ギリシャ語Χριστός（クリストス）は称号で、「メシア」を意味する。
    reason: lexical_alternative
  - marker: c
    text: ギリシャ語では直訳すると「世々の世に至るまで」。終わりなく続くことを表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: ラッパを吹いた
  rationale: σαλπίζωが含意する楽器を日本語では明示し、自然な表現とした。
- source_word: φωναὶ μεγάλαι
  choice: 大きな声がいくつも上がり
  rationale: 複数形を「いくつも」で保ち、後続の発言内容に合う「声」として訳した。μεγάλαιはこの文脈では音量の大きさを表す。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天で
  rationale: 黙示録の場面では物理的な空より天上界を指すため、「天」とした。
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: 世の王国は…王国となった
  rationale: SBLGNTの単数形βασιλείαを保ち、ἐγένετοの成立・移行を「となった」で表した。「この世」とせず、本文のτοῦ κόσμουに指示語を加えていない。
- source_word: τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ
  choice: 私たちの主と、その方のメシアの王国
  rationale: 二つの属格が、世の王国が今や誰に属するかを示す構造を自然な日本語で表した。Χριστόςはここでは称号として用いられている。
- source_word: καὶ βασιλεύσει
  choice: そして、永遠に王として治められる
  rationale: 単数の動詞を複数主語に変えず、同時にギリシャ語が明示しない単数主語の指示対象を日本語でも補わないことで、原文の圧縮と曖昧さを保った。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 永遠に
  rationale: 直訳では「世々限りなく」に当たる、終わりのない継続を表す慣用句を、明瞭な現代日本語にした。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは「その方の」という所有表現を伴う称号なので、油を注がれた者という称号性が明確な「メシア」を採用した。
- issue: βασιλεύσειの主語
  choice: 主語を補わず「王として治められる」
  alternative: 「主が治められる」または「主とメシアが治められる」
  rationale: 動詞は単数だが、その直前には「私たちの主」と「その方のメシア」がある。指示対象を訳文で断定せず、原文の神学的緊張と簡潔さを保った。
- issue: βασιλείαの意味領域
  choice: 王国
  alternative: 王権／支配
  rationale: 具体的な領域と王的支配の双方を含みうる語であるため、文脈上の宣言形式と単数形を保ちやすい「王国」を本文に採用した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御使い」のような教会内に偏りやすい語を避けて「天使」とし、宣言部分は簡潔で荘重な調子にした。引用内の最終節では主語を不自然に明示せず、原文の単数動詞と指示対象の曖昧さを維持した。
