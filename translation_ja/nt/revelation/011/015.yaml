  to: '第七の天使がラッパを吹いた[a]。すると、天で大きな声がいくつも上がり、こう言った。


    「世の王国は、私たちの主とそのメシア[b]のものとなった。そして、その方は永遠に王として治める[c]。」'
  rationale: 最終節を能動態の「その方は…治める」に改め、βασιλεύσει の能動・単数を反映した。「その方」は、単数の動詞が示す主語を日本語で文法的に示すために必要な最小限の補いであり、主が指すのかメシアが指すのかという解釈上の問題を説明的に解決しない。「そのメシア」として、自然な現代日本語と原文の所有表現の簡潔さを両立させた。
  reviewer_model: gpt-5.6-terra
