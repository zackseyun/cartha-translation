id: REV.11.13
reference: Revelation 11:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: ja
  text: その時、大きな地震が起こり、その都市の十分の一が倒れた。地震で七千人[a]が殺され、残りの者たちは恐れに満たされ、天の神に栄光を帰した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「人々の名、七千」。死者として数えられた七千人を意味する表現。
    reason: 原文の特徴的な「名」という言い回しを示すため。
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: その時
  rationale: 直訳的な「その時刻に」ではなく、出来事の即時性を保ちつつ自然な現代日本語とした。
- source_word: ἐγένετο σεισμὸς μέγας
  choice: 大きな地震が起こり
  rationale: ἐγένετοの出来事の発生を自然に表し、μέγαςを過度に解釈せず「大きな」と訳した。
- source_word: τὸ δέκατον τῆς πόλεως ἔπεσεν
  choice: 都の十分の一が崩れ落ちた
  rationale: 数量を明確に保ち、「倒れた」より都市の一部について自然な「崩れ落ちた」を用いた。
- source_word: ἀπεκτάνθησαν
  choice: 殺され
  rationale: 受動態と死に至らせられた意味を、明瞭な現代語で保持した。
- source_word: ὀνόματα ἀνθρώπων χιλιάδες ἑπτά
  choice: 七千人[a]
  rationale: 字義は「人々の名が七千」だが、数えられた人を指す表現として本文では自然な日本語にし、特徴的な原文表現を脚注に残した。
- source_word: οἱ λοιποὶ
  choice: 残った人々
  rationale: 「生存者」と断定的に言い換えず、原文の「残りの者たち」に近い表現とした。
- source_word: ἔμφοβοι ἐγένοντο
  choice: 恐れおののき
  rationale: 強い恐怖と、その状態になったことを簡潔で自然に表した。
- source_word: ἔδωκαν δόξαν
  choice: 栄光を帰した
  rationale: 聖書的な定型表現を保ち、単に「ほめた」と弱めなかった。
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: 天の神に
  rationale: 属格を神の称号として簡潔に保持した。
theological_decisions:
- issue: 残った人々の反応が真の悔い改めや救いの信仰を意味するか
  choice: 「恐れおののき、天の神に栄光を帰した」とのみ訳し、その内面的性質を規定しない。
  alternative: 「悔い改めた」と明示する、または恐怖から神の力を認めただけだと明示する。
  rationale: ギリシア語本文は恐れと神に栄光を帰す行為を述べるが、それが真正な回心であったかどうかは明示していないため、神学的緊張を保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「都」は黙示録の都市的文脈に適し、「恐れおののき」「栄光を帰した」によって原文の強さと聖書的響きを保った。
