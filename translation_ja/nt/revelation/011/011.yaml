id: REV.11.11
reference: Revelation 11:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: ja
  text: その三日半の後、神からの命の息[a]が彼らの中に入り、彼らは自分の足で立った。すると、彼らを見ていた人々は大きな恐れに襲われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「神からの命の霊」。ギリシア語の「プネウマ」は、「息」「霊」、また文脈によっては神の「霊」を意味し得る。
    reason: πνεῦμαの語義上の曖昧さと、聖霊を明示的に指すかどうかという神学的緊張を保持するため。
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: その三日半の後
  rationale: μετά＋対格の時間的用法を「後」とし、定冠詞の指示性を「その」で表した。黙示文学における特定の期間としての響きを保つ。
- source_word: πνεῦμα ζωῆς
  choice: 命の息
  rationale: πνεῦμαには「息」「霊」の意味がある。この死者が生き返る場面では、エゼキエル書37章を思わせる「息」が自然である一方、「霊」の可能性も脚注に残した。
- source_word: ἐκ τοῦ θεοῦ
  choice: 神からの
  rationale: 命をもたらす息の起源が神であることを、簡潔で自然な日本語で示した。
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: 彼らの中に入り
  rationale: 内側への進入を自然な日本語で表し、彼ら自身に命が戻ったことを明確にした。
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: 彼らは自分の足で立った
  rationale: 復活・回復の結果として実際に立ったという表現を保ちつつ、現代日本語として自然にした。
- source_word: φόβος μέγας ἐπέπεσεν ἐπὶ
  choice: 大きな恐れに襲われた
  rationale: 直訳的な「恐れが上に落ちた」を避けながら、恐れが突然人々を圧倒したという比喩の力を保った。
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: 彼らを見ていた人々
  rationale: θεωρέωの継続的・注視的な意味を、明瞭な現代日本語で表した。
theological_decisions:
- issue: πνεῦμα ζωῆςを生命を与える息と訳すか、霊または聖霊と明示するか
  choice: 本文では「神からの命の息」とする
  alternative: 「神からの命の霊」、または文脈によっては神の「霊」を指すと理解する
  rationale: 神に由来することは明示されているが、ギリシア語だけでは聖霊との同一性は明示されない。本文は復活の情景と旧約の響きに適する「息」を採り、語義上および神学上の幅は脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学にふさわしい簡潔で荘重な調子を保った。「その三日半」で既出の特定期間を示し、「すると」で復活を目撃した人々への急激な反応を自然につないだ。
