id: REV.11.3
reference: Revelation 11:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: ja
  text: そして、わたしはわたしの二人の証人に、粗布を身にまとって[b]千二百六十日の間、預言することを許す[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「わたしの二人の証人に与える」。ギリシア語では、何を与えるのかが明示されていない。文脈上、預言するための許可、権威、力、または務めを指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 粗布は、悲嘆、悔い改め、また預言者の嘆きと結び付けられていた。
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: 授ける
  rationale: 基本義「与える」を保ちつつ、神から証人に与えられるものを表す文脈にふさわしい語とした。ギリシア語では何を授けるのかが明示されていないため、本文にも「権威」「力」「任務」などを補わず、その省略と含みを保った。
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: 自分の二人の証人に
  rationale: 話者に属する二人の証人であることを自然な現代日本語で示した。「証人」はμάρτυςの証言者としての意味を保持する。
- source_word: προφητεύσουσιν
  choice: 預言する
  rationale: προφητεύωの直接的で定着した訳語であり、将来形の意味は文脈と日本語の非過去形によって表した。
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: 千二百六十日の間
  rationale: 時間の継続を示す対格を、日本語で明瞭な「～日の間」として表した。
- source_word: περιβεβλημένοι
  choice: まとい
  rationale: 衣を身につけた状態を表す完了分詞の描写を、簡潔で格調のある日本語にした。
- source_word: σάκκους
  choice: 粗布
  rationale: 当時、悲嘆や悔い改めのしるしとして身につけた粗い布を指す。日本語の「袋」では衣服としての像が伝わりにくいため「粗布」とした。
theological_decisions:
- issue: δώσωで省略されている目的語
  choice: 本文では「授ける」とし、何を授けるかを補わない
  alternative: 「権威を授ける」「預言する務めを授ける」
  rationale: 文脈上は預言の権威、力、または任務が含意されうるが、原文は目的語を明示していない。特定の解釈に限定せず、原文の曖昧さと緊張を保持した。
- issue: 粗布の象徴的意味
  choice: 象徴を本文で説明せず「粗布をまとい」とする
  alternative: 「悲しみの衣をまとい」
  rationale: 粗布は悲嘆、悔い改め、預言者的な嘆きを連想させるが、本文自体は意味を一つに限定していないため、具体的な像をそのまま残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の目的語省略は、日本語でもあえて補わず保持したため、「授ける」は通常より未完結に響くが、その含みを脚注で説明した。粗布の象徴性は本文で解釈せず、脚注にとどめた。
