id: REV.11.8
reference: Revelation 11:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: ja
  text: そして、彼らの遺体[a]は、大いなる都の大通り[b]に横たわっている。その都は、霊的に[c]「ソドム」と「エジプト」と呼ばれ、彼らの主もそこで十字架につけられた[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の「遺体」は単数形で、二人の証人を一つのまとまりとして表している可能性がある。日本語の「遺体」は単数・複数のどちらにも理解できる。
    reason: alternative_reading
  - marker: b
    text: または「広場」。原語は幅の広い通りや公共の広場を指すことがある。
    reason: lexical_alternative
  - marker: c
    text: または「比喩的に」「象徴的に」。
    reason: lexical_alternative
  - marker: d
    text: この句はエルサレムを指し示しているが、本文は「大いなる都」という象徴的な呼び名を保っている。
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: 彼らの遺体
  rationale: πτῶμαは倒れた死体を指す。日本語の「遺体」は現代的で自然であり、原文の単数形を数の明示を避ける形で保ち、二人の証人を一つのまとまりとして扱う可能性も残す。
- source_word: ἐπὶ τῆς πλατείας
  choice: 大通りに
  rationale: πλατεῖαは幅の広い通り、または公共の広場を意味し得る。都市の情景に自然な「大通り」を本文に採り、別訳を脚注に残す。
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: 大いなる都
  rationale: 黙示録で重みを持つ呼称を保つため、「大きな町」ではなく、荘重さのある「大いなる都」とした。
- source_word: πνευματικῶς
  choice: 霊的に
  rationale: 原語の直接的な意味を保持する。「比喩的に」「象徴的に」と解することもできるが、本文で解釈を限定せず脚注に示す。
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: 「ソドム」また「エジプト」
  rationale: 固有名を標準的な日本語表記で示し、堕落や圧迫という象徴的含意を本文で説明し過ぎない。
- source_word: ὁ κύριος αὐτῶν
  choice: 彼らの主
  rationale: 二人の証人との関係を示す複数属格を保ち、神学的な称号κύριοςを「主」と訳す。
- source_word: ἐσταυρώθη
  choice: 十字架につけられた
  rationale: σταυρόωのアオリスト受動態を、標準的で明瞭な日本語の歴史的受動表現で訳す。
- source_word: καὶ ... ἐπὶ
  choice: そして…さらされている
  rationale: この節は名詞句を中心とする描写で、文脈上、遺体が大通りに置かれたまま公衆の目に触れる状態を表す。「さらされている」は日本語として自然にその状態を伝える。
theological_decisions:
- issue: 二人の証人を指すのにπτῶμαが単数形であること
  choice: 「彼らの遺体」とし、日本語本文では単複を明示しない
  alternative: 「彼らの二つの遺体」「彼らの死体」
  rationale: 原文は複数の所有者に対して単数名詞を用い、二人を一体として描く可能性がある。日本語の「遺体」は形態上単複を区別しないため、原文の緊張を自然に保持できる。
- issue: πνευματικῶςの意味
  choice: 「霊的に」
  alternative: 「比喩的に」「象徴的に」
  rationale: 原語に最も近い表現を本文に置き、単なる文学的比喩へ意味を狭めない。理解を助ける別訳は脚注に示す。
- issue: 「大いなる都」の同定
  choice: 本文ではエルサレムと明示しない
  alternative: 「エルサレム」などの説明的補足を本文に加える
  rationale: 「彼らの主もそこで十字架につけられた」という句はエルサレムを強く指し示すが、本文自体は黙示的呼称を保っているため、その象徴的緊張を維持する。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録の荘重な呼称として「大いなる都」を採用した。「ソドム」「エジプト」には引用符を付け、実名ではなく霊的な呼称として用いられていることを読み取りやすくした。
