id: REV.11.5
reference: Revelation 11:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: ja
  text: もしこの二人に害を加えようとする者があれば、火が彼らの口[a]から出て、その敵たちを焼き尽くす。もしこの二人に害を加えようとする者があれば、その者はこのようにして殺されなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「口」は単数形である。
    reason: 原語の単数の名詞と複数の所有者という文法上の特徴を示すため。
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: 害を加える
  rationale: この黙示的文脈では、単なる不正ではなく二人の証人に対する敵対的な危害を表す。二つの用例を同じ自然な日本語で訳した。
- source_word: πῦρ
  choice: 火
  rationale: 原文の鮮明な像を解釈的に弱めず、そのまま保った。
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: 彼らの口から出て
  rationale: στόματος の単数形と複数の所有者を反映した。「彼らの口」は日本語でも集合的な表現として理解できる。
- source_word: κατεσθίει
  choice: 焼き尽くす
  rationale: 火が敵を完全に滅ぼすという文脈で、動詞の強い破壊的意味を自然な日本語で表す。
- source_word: ἐχθροὺς
  choice: 敵たち
  rationale: 二人に敵対する者たちを指す標準的で明確な訳語。
- source_word: θέλει / θελήσῃ
  choice: 加えようとする
  rationale: 第一の現在直説法と第二のアオリスト接続法には相の違いがあるが、日本語では同一条件文の反復を自然に保ち、いずれも意図を表す形にした。
- source_word: οὕτως
  choice: このようにして
  rationale: 直前に述べられた火による滅びの仕方を指し示す語として明確に訳した。
- source_word: δεῖ
  choice: なければならない
  rationale: 必要性・不可避性の強さを保ち、その根拠を本文で補わない。
- source_word: ἀποκτανθῆναι
  choice: 殺される
  rationale: 受動態を保った、直接的で現代的な表現。
theological_decisions:
- issue: 口から出る火を文字どおりの描写として訳すか、裁きの言葉などと解釈して訳すか
  choice: 「火が彼らの口から出て」と像をそのまま保つ
  alternative: 「彼らから滅ぼす裁きが下る」など、象徴の意味を本文に織り込む
  rationale: 黙示録の像が文字どおりか象徴的かを翻訳で決めず、原文が提示する神学的・文学的緊張を残す。
- issue: δεῖ の必要性の主体または根拠
  choice: 「殺されなければならない」とだけ訳す
  alternative: 「神の定めによって殺される」などと補う
  rationale: 文脈上、神的・預言的な必然性が示唆され得るが、原文は主体や根拠を明示していないため補足しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「二人」は直前の二人の証人を自然に指す。「口」は原文どおり単数として保持した。セミコロンに相当する区切りは、日本語では句点を用いて読みやすくした。
