base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: ja
  text: 第二の災いは過ぎ去った。見よ、第三の災いが速やかに来る[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すぐに（間もなく）」とも訳せる。ギリシア語は、時間的な近さ、または到来の速さを強調し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: 災い
  rationale: 黙示録において番号を付して語られる、嘆きと迫る破局の両方を表す語として、現代日本語で自然かつ荘重な「災い」を用いた。
- source_word: δευτέρα
  choice: 第二の
  rationale: 序数をそのまま明確に訳し、「災い」を修飾させた。
- source_word: ἀπῆλθεν
  choice: 過ぎ去った
  rationale: 字義的には「去った」だが、災いの段階が終わったという文脈に即し、完了した出来事を自然に表す。
- source_word: ἰδού
  choice: 見よ
  rationale: 読者の注意を強く促す預言的な談話標識として、荘重さを保ちつつ理解しやすい表現を採用した。
- source_word: τρίτη
  choice: 第三の
  rationale: 序数をそのまま明確に訳し、「災い」を修飾させた。
- source_word: ἔρχεται
  choice: 来る
  rationale: ギリシア語現在形の生き生きとした到来の表現を、自然な日本語で示した。「来ようとしている」は切迫性を過度に限定するため避けた。
- source_word: ταχύ
  choice: すぐに
  rationale: 時間的近さを自然に表せる一方、文脈によっては到来の速やかさも含み得る。意味の幅は脚注で明示した。
theological_decisions:
- issue: 終末論的文脈における ταχύ の訳し方
  choice: すぐに
  alternative: 速やかに／突然に
  rationale: ταχύ は「間もなく」という時間的近さと、「速やかに」という急速さの双方を表し得る。「すぐに」を本文に置きつつ、到来の時期と態様を一義的に固定しないよう脚注に別の可能性を示した。
translation_notes:
  register: 明快な現代標準日本語を基調とし、「見よ」によって黙示文学の荘重で切迫した調子を保った。本文中の脚注記号[a]は、意味の幅が問題となる「すぐに来る」の直後に配置した。
