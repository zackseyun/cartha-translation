id: REV.11.1
reference: Revelation 11:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: ja
  text: そして、杖のような葦が私に与えられ、こう言われた。「立って、神の神殿[a]と祭壇、また神殿の中で礼拝している人々を測りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の聖所」または「神の内陣」とも訳せる。ギリシア語の「ナオス」は、神殿域全体ではなく、より限定して神殿の中心的な聖所を指すことがある。
    reason: ναόςの語義範囲と、神殿域全体との区別を示すため。
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: 私に与えられ
  rationale: 受動態と与格を保ち、与えた者を本文で特定しない。
- source_word: κάλαμος ὅμοιος ῥάβδῳ
  choice: 杖のような葦
  rationale: κάλαμοςの基本義「葦」と、ῥάβδοςとの比較を区別して表し、「測り竿」と先取りして解釈しない。
- source_word: λέγων
  choice: こう告げられた
  rationale: ギリシア語では話者が明示されず、分詞の構文もやや唐突である。自然な日本語にしつつ、告げた者の正体は補わない。
- source_word: Ἔγειρε
  choice: 立って
  rationale: 命令の簡潔さを保ち、現代日本語として自然にした。
- source_word: μέτρησον
  choice: 測りなさい
  rationale: 測定を命じる動詞の直接的な意味を表す。
- source_word: ναὸν τοῦ θεοῦ
  choice: 神の神殿
  rationale: 自然で広く理解される訳語を本文に置き、ναόςが内陣を指し得る点は脚注で示す。
- source_word: τὸ θυσιαστήριον
  choice: 祭壇
  rationale: 祭壇の種類を本文が特定していないため、一般的な訳語にとどめる。
- source_word: τοὺς προσκυνοῦντας ἐν αὐτῷ
  choice: 神殿の中で礼拝している人々
  rationale: 分詞の動作性とἐν αὐτῷの場所的意味を自然な日本語で明確に表す。代名詞の指示対象は文脈上ναόςと捉えた。
theological_decisions:
- issue: 黙示的文脈におけるναόςの指示対象
  choice: 神の神殿
  alternative: 神の聖所／神の内陣
  rationale: この一節だけでは、地上の文字どおりの神殿、天上の聖所、神の民の象徴のいずれかを確定できないため、本文では解釈を限定しない。
- issue: λέγωνによって示唆される話者の正体
  choice: 話者を特定せず「こう告げられた」
  alternative: 御使いが言った／声が言った
  rationale: 原文は話者を明示していないため、「御使い」や「声」を補わず曖昧さを保つ。
translation_notes:
  register: 明快な現代標準語を用い、黙示文学にふさわしい簡潔で格調ある命令表現とした。原文の話者不明性を保ちつつ、日本語として不自然な懸垂分詞は避けた。
