reference: Revelation 11:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: ja
  text: この者たちには、空を閉ざして、彼らが預言する日々の間、雨が降らないようにする権威がある[a]。また、水を血に変え、望むたびにすべての災害をもって地を打つ権威がある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天を閉ざし」とも訳せる。ギリシア語のοὐρανόςは「天」と「空」のどちらも意味しうるが、ここでは雨について述べられているため、本文では「空」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: この者たち
  rationale: 直前の二人の証人を指す複数の指示代名詞。原文にここで「二人」は明記されていないため補わない。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 単なる能力よりも、与えられた権限・支配権を表す語として文脈に適する。
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: 空を閉ざし
  rationale: οὐρανόςには「天」と「空」の両義があるが、直後に降雨の停止が述べられるため、本文では自然な「空」を選ぶ。
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: 雨が降らないようにする
  rationale: 目的・結果を表すἵνα節を、意味を保った自然な現代日本語にした。
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: その預言の日々の間
  rationale: 彼らが預言する期間全体を指す属格表現を、時間的意味が明瞭になるよう訳した。
- source_word: ἐπὶ τῶν ὑδάτων
  choice: 水を
  rationale: ἐξουσίαν ἔχουσινとの組み合わせでは水に対する権威を示す。日本語では後続の不定詞と合わせ「水を血に変え…権威」とするのが自然。
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: 水を血に変え
  rationale: 変化を表すστρέφωとεἰςを簡潔かつ直接的に訳した。
- source_word: πατάξαι τὴν γῆν
  choice: 地を打つ
  rationale: 黙示録の広い宇宙的視野を保つ「地」とし、πατάσσωの災厄を加える意味を「打つ」で保持した。
- source_word: ἐν πάσῃ πληγῇ
  choice: あらゆる災いで
  rationale: ἐνの手段的用法とπάσῃの包括性を保ち、原文にない「種類」を加えない。
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: 望むたびに
  rationale: 意志に応じて何度でも行えるという反復的・条件的な意味を自然に表す。
theological_decisions:
- issue: 二人の証人に与えられた権威と、モーセおよびエリヤを想起させる奇跡的行為
  choice: 奇跡的行為を直接的な表現のまま訳し、その性質を解釈しない。
  alternative: 象徴的行為であると本文中で説明する。
  rationale: 原文はこれらを証人たちに与えられた権威として描くが、字義的か象徴的か、またはその両方かをここで確定していないため、その神学的緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、黙示文学にふさわしい荘重さを保った。「この者たち」「閉ざす」「権威」「地を打つ」により、過度に口語化せず一般読者にも理解できる文体とした。
