id: REV.11.9
reference: Revelation 11:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: ja
  text: さまざまな民族、部族、言語、国民の中のある人々が、三日半の間、彼らの死体[a]を見ている。そして、彼らの遺体を墓に納めることを許さない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、ここはまず「彼らの死体」と単数形で述べられ、その後に「彼らの遺体」と複数形で述べられている。初めの単数形は、二人の証人を一つのまとまりとして描いている可能性がある。
    reason: 原文にある単数形から複数形への移行は、日本語の名詞だけでは表せないため。
lexical_decisions:
- source_word: βλέπουσιν
  choice: 見ている
  rationale: 現在形の継続的で生き生きとした描写を保ちつつ、単なる一瞥ではなく、死体を目にし続ける行為を自然な現代日本語で表した。
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: さまざまな民族、部族、言語、国民の中のある人々
  rationale: ἐκ の部分を表す用法を「中のある人々」で明示し、列挙された集団の全員ではなく、その中からの人々を指すことを保った。
- source_word: λαῶν
  choice: 民族
  rationale: 複数の集合的な民を指す語として、黙示録の列挙に適した明瞭な現代語を選んだ。
- source_word: φυλῶν
  choice: 部族
  rationale: 血縁的・社会的な集団を表す標準的な訳語であり、黙示録の定型的列挙にも適する。
- source_word: γλωσσῶν
  choice: 言語
  rationale: ここでは身体器官の「舌」ではなく、言語共同体を指すため、現代日本語で意味が明確な「言語」とした。
- source_word: ἐθνῶν
  choice: 国民
  rationale: 黙示録に繰り返される広範な人間集団の列挙を保ち、「異邦人」と限定しすぎない訳語を選んだ。
- source_word: τὸ πτῶμα αὐτῶν
  choice: 彼らの死体
  rationale: πτῶμα の死体という意味を明示した。日本語では名詞自体に単数・複数の形態差がないため、ギリシア語の単数形は脚注で示した。
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: 三日半の間
  rationale: 期間を表す対格を、自然かつ簡潔な日本語で表現した。
- source_word: τὰ πτώματα αὐτῶν
  choice: 二人の遺体
  rationale: 第二の言及が複数形であることを「二人の」で明示した。「遺体」は文脈上の死を保ちながら、日本語で過度な反復を避ける。
- source_word: οὐκ ἀφίουσιν
  choice: 許さない
  rationale: この文脈の ἀφίημι は「放置する」ではなく、行為を認めないという許可の意味である。
- source_word: τεθῆναι εἰς μνῆμα
  choice: 墓に納めること
  rationale: 単に埋葬するという一般概念にせず、遺体を墓所に置くという受動不定詞の具体性を自然な日本語で保った。
theological_decisions:
- issue: 第一節の単数形 πτῶμα と第二節の複数形 πτώματα の相違
  choice: 本文では第一の言及を数の明示されない「彼らの死体」とし、第二の言及を「二人の遺体」として複数性を明示し、形態上の相違を脚注で説明する
  alternative: 両方を「二人の遺体」として滑らかに統一する
  rationale: ギリシア語本文の単数・複数の移行を解消しないようにした。ただし、日本語の「死体」には単複の形態差がないため、「一つの死体」などと訳して二人が物理的に一体であるかのような含意を加えることは避け、脚注によって原文の緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「さまざまな」は列挙全体の多様性を自然に示し、「ある人々」で部分性を明示した。第一文の現在進行的な「見ている」によって黙示的幻の生き生きした描写を保っている。
