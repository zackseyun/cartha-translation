id: REV.11.12
reference: Revelation 11:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: ja
  text: すると二人は、天から大きな声が自分たちにこう言うのを聞いた。「ここに上って来なさい。」二人は雲の中で天へ上り、彼らの敵たちは二人を見つめていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσαν
  choice: 聞いた
  rationale: アオリスト直説法が示す、天からの声を聞いた出来事を簡潔に表す。
- source_word: φωνῆς μεγάλης
  choice: 大きな声
  rationale: μεγάλης はここでは声の強さを表し、現代日本語として自然でありつつ「偉大な」という含みを不必要に限定しない。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 黙示録の幻と神的発言の文脈では、οὐρανός は単なる空ではなく「天」を指す。
- source_word: λεγούσης αὐτοῖς
  choice: 自分たちにこう言うのを
  rationale: 分詞が「声」を修飾し、その声が二人に語りかけたことを明示する。
- source_word: Ἀνάβατε ὧδε
  choice: ここに上って来なさい
  rationale: 二人への複数命令と、話者のいる場所を指す ὧδε を自然な日本語で保つ。
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: 天へ上り
  rationale: 上方への移動と到達先を明確にしつつ、特定の教義用語に寄せない自然な表現。
- source_word: ἐν τῇ νεφέλῃ
  choice: 雲に包まれて
  rationale: ἐν の位置・領域の意味を自然な日本語で表し、定冠詞をもつ雲が神の臨在を想起させる可能性は脚注で保持する。
- source_word: ἐθεώρησαν
  choice: その様子を見つめていた
  rationale: 単に目に入ったというより、彼らが上って行く出来事を注視した θεωρέω のニュアンスを表す。
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: 彼らの敵たち
  rationale: 二人に敵対する者たちという所有関係を明確に保つ。
theological_decisions:
- issue: 「雲」の定冠詞と神的臨在への暗示
  choice: 本文では「雲に包まれて」とし、脚注で「その雲の中で」という直訳と暗示の可能性を示す
  alternative: 一つの雲に乗って／雲の中で
  rationale: ギリシア語の定冠詞は特定の雲、あるいは聖書における神の臨在と擁護の雲を想起させ得るが、その解釈を本文で断定しない。
translation_notes:
  register: 明瞭で現代的ながら、幻の場面にふさわしい品位を保った。「二人」は直前の二人の証人を受ける日本語上の補足であり、複数代名詞を明確にする。
