  naturalness: 「二人は」「天から大きな声が自分たちにこう言うのを聞いた」は明瞭で自然である。「雲の中で天へ上り」も現代標準日本語として無理がなく、幻の叙述にふさわしい。終結部は目的語を明示して「二人を見つめていた」とすると指示関係がいっそう明確になる。
  terminology: 「天」「大きな声」「雲」は黙示録の文脈に適した、過度に教義化しない語である。ギリシア語の定冠詞が示し得る聖書的な「雲」の連想は、本文で断定せず脚注で示すのが適切である。
