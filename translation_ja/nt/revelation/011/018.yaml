id: REV.11.18
reference: Revelation 11:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: ja
  text: 諸国民は怒り、あなたの怒りが臨みました。死者が裁かれ、あなたに仕える者たち[a]、すなわち預言者たち、聖なる者たち、御名を畏れる者たちに、小さい者にも大きい者にも報いを与え、地[b]を滅ぼす者たちを滅ぼす時が来ました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたに仕える者たち」は「あなたの奴隷たち」とも訳せる。ギリシア語ドゥーロスは、文脈により仕える者または奴隷を指す。
    reason: alternative_reading
  - marker: b
    text: 「地」は「土地」とも訳せる。また「地を滅ぼす」は、文脈により「地を損なう」「地を腐敗させる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: 諸国の民
  rationale: 黙示録の文脈では、ユダヤ人に対する「異邦人」に限定せず、世界の諸国民を集合的に指すため。
- source_word: ὠργίσθησαν / ἡ ὀργή σου
  choice: 怒りました／あなたの怒り
  rationale: 同根語の対応を日本語でも保ち、諸国民の怒りと神の終末的な怒りとの対照を示した。神の怒りについては文脈が裁きの厳粛さを明らかにするため、不自然に硬い語を加えなかった。
- source_word: ὁ καιρός
  choice: 時
  rationale: 定められた決定的な時を指すが、その意味は終末的文脈から十分に伝わるため、簡潔に訳した。
- source_word: τῶν νεκρῶν κριθῆναι
  choice: 死者が裁かれ
  rationale: 受動不定詞の司法的意味と、死者が裁きの対象であることを保った。
- source_word: τὸν μισθόν
  choice: 報い
  rationale: 神がご自分の民に与えるものを指し、取引的な賃金という印象を避けつつ、肯定的な報償の意味を表す。
- source_word: τοῖς δούλοις σου
  choice: あなたの僕たち
  rationale: ここでは神に属し仕える者たちへの尊称として用いられ、続く預言者たち等を包括するため、日本語で品位のある「僕」を採用した。所有・従属の強い含意は脚注で示した。
- source_word: τοῖς ἁγίοις
  choice: 聖なる者たち
  rationale: 神のために聖別された人々という意味が一般読者にも明瞭に伝わり、特定の教会的称号との混同も避けられる。
- source_word: τοῖς φοβουμένοις τὸ ὄνομά σου
  choice: 御名を畏れる者たち
  rationale: 単なる恐怖ではなく神への敬虔な恐れを表す聖書的表現を、「畏れる」によって自然に保った。
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: 小さい者にも大きい者にも
  rationale: 地位や重要性の違いを越えた包括性を示す対句を、原文に近い形で保持した。
- source_word: διαφθεῖραι τοὺς διαφθείροντας
  choice: 滅ぼす者たちが滅ぼされる
  rationale: 同じ語根の意図的な反復を日本語でも「滅ぼす」で再現し、行為に対応する裁きという響きを保った。
- source_word: τὴν γῆν
  choice: 地
  rationale: 宇宙的・終末的な裁きの文脈に合い、「地上世界」を簡潔に表せる。語義上可能な「土地」は脚注に示した。
theological_decisions:
- issue: δοῦλοςを神の民への呼称としてどう訳すか
  choice: 僕
  alternative: 奴隷
  rationale: この箇所の焦点は拘束された身分そのものより、神に属して仕える者たちが報いを受けることにある。「僕」はその関係を品位をもって表し、「奴隷」という語義も脚注に残した。
- issue: γῆの範囲
  choice: 地
  alternative: 土地
  rationale: 黙示録の宇宙的な裁きの場面では世界全体を指す理解が自然だが、局地的な「土地」という語義の可能性を排除せず脚注に示した。
- issue: 「小さい者と大きい者」が及ぶ範囲
  choice: 報いを受ける者たちを身分の違いなく包括する表現として訳す
  alternative: 直前の「御名を畏れる者たち」だけに限定して結び付ける
  rationale: 原文には格の移行があり統語的な緊張が残るため、特定の一群だけに狭く限定せず、列挙された受領者全体を包括し得る日本語配置とした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神への直接の呼びかけにふさわしい厳粛さを保った。「御名」「畏れる」は聖書的な響きを残しつつ現代日本語でも理解可能である。原文で一つの「時」が三つの不定詞（裁かれる、報いを与える、滅ぼす）を支配する構造は、日本語では受動表現を並べ、末尾の「時が来ました」でまとめた。
