revisions:
- from: 諸国の民は怒りました。そして、あなたの怒りが臨み、死者が裁かれ、あなたの僕たち[a]、すなわち預言者たち、聖なる者たち、また御名を畏れる者たちに、小さい者にも大きい者にも報いが与えられ、さらに、地[b]を滅ぼす者たちが滅ぼされる時が来ました。
  to: 諸国民は怒り、あなたの怒りが臨みました。死者が裁かれ、あなたに仕える者たち[a]、すなわち預言者たち、聖なる者たち、御名を畏れる者たちに、小さい者にも大きい者にも報いを与え、地[b]を滅ぼす者たちを滅ぼす時が来ました。
  rationale: 「時が来ました」が後続する三つの行為を統括する原文の構造を、自然な日本語の範囲で明示した。「報いを与え」と能動形にして、原文のδοῦναι（与えること）を保った。ただし行為者を明示的に「あなた」と繰り返さず、原文の簡潔さを保っている。「小さい者にも大きい者にも」は、列挙された受領者全体にも直前の群にも関連し得る原文の統語的な緊張を解消しすぎない位置に置いた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:35:23Z'
