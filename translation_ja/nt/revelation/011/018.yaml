  naturalness: 「諸国の民」は現代標準語ではやや重複的であるため、「諸国民」とする。また「僕たち」は男性一人称の「僕」とも受け取られ得るので、明瞭な現代語としては「あなたに仕える者たち」が自然である。
  terminology: 「怒り」「死者」「報い」「聖なる者たち」「御名を畏れる者たち」「地」は適切である。「小さい者にも大きい者にも」は、原文の統語上の係り先を不必要に限定せず保持する。γῆおよびδιαφθείρωの語義幅、δοῦλοςの代替訳は脚注で維持する。
