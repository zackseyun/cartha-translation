id: REV.11.16
reference: Revelation 11:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: ja
  text: また、神の前で自分たちの王座に座っていた二十四人の長老たちは、顔を地に伏せ、神を礼拝した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: 二十四人の長老たち
  rationale: 黙示録に登場する天上の会議を構成する者たちを指す定着した表現として「長老」を用い、人数を自然な現代日本語で示した。
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: 神の前で
  rationale: 神の面前という空間的・関係的な位置を簡潔に保つ。
- source_word: καθήμενοι ἐπὶ τοὺς θρόνους αὐτῶν
  choice: 自分たちの座に着いていた
  rationale: 継続的に座っていた状態を表す分詞の働きを保ちつつ、「座に着く」によってθρόνοςの権威ある席という含みを自然に表した。
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: ひれ伏して
  rationale: 顔を地につける姿勢を含む礼拝動作を、日本語の定着した簡潔な表現で伝える。後続の礼拝行為とは区別される。
- source_word: προσεκύνησαν τῷ θεῷ
  choice: 神を礼拝した
  rationale: 対象が神である天上の礼拝場面なので、単なる敬礼ではなく宗教的な礼拝を明確に表す。
theological_decisions:
- issue: 天上の場面におけるπροσκυνέωの意味
  choice: 「神を礼拝した」と訳す。
  alternative: 「神に敬意を表した」「神を拝した」
  rationale: 行為の対象が明示的に神であり、御座をめぐる典礼的場面なので、宗教的礼拝の意味が中心である。一方、礼拝の方法や教理的意味を付加しない。
- issue: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶνとπροσεκύνησανの関係
  choice: 「ひれ伏して神を礼拝した」とし、身体動作と礼拝を一続きの二要素として示す。
  alternative: 「顔を地につけて倒れ、神を礼拝した」
  rationale: 原文の二つの動詞の意味を保ちながら、慣用句を不自然に逐語化せず、両者を同一視しすぎない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御座」ではなく一般読者に自然な「座」を採用したが、単なる椅子ではなく権威ある席を示すため「座に着いていた」とした。原文末尾の読点に相当する継続性は単独節として句点で整えた。
