id: REV.11.2
reference: Revelation 11:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: ja
  text: しかし、神殿[a]の外庭は除外し、測ってはならない。これは諸国の民[b]に与えられたからである。彼らは四十二か月の間、聖なる都を踏みにじる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「聖所」。ギリシア語の「ナオス」は、神殿域全体ではなく、より限定して本殿・聖所を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: または「異邦人」。ギリシア語は「諸国の民」とも「異邦人」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: αὐλή
  choice: 庭
  rationale: 神殿に属する囲われた中庭を指す。現代日本語で自然かつ簡潔な「庭」とし、文脈によって神殿の庭であることを明確にした。
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: 神殿の外にある
  rationale: αὐλήを修飾し、ναόςの外側に位置することを示す。「外庭」と畳み込まず、原文の関係を明示した。
- source_word: ναός
  choice: 神殿
  rationale: 一般読者に分かりやすい語を本文に採用した。ただし、ここでは神殿域全体より狭い「聖所」を指し得るため、その選択肢を脚注に残した。
- source_word: ἔκβαλε ἔξωθεν
  choice: 除外し
  rationale: 直訳的な「外へ投げ出せ」ではなく、続く「測ってはならない」との関係から、測量の対象外にする命令として表現した。
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: 測ってはならない
  rationale: 二人称単数への禁止命令を、荘重さを保った自然な現代日本語で示した。
- source_word: ἐδόθη
  choice: 与えられた
  rationale: アオリスト受動態をそのまま受動表現とし、原文が明示しない行為者を補わなかった。
- source_word: τοῖς ἔθνεσιν
  choice: 諸国の民に
  rationale: ἔθνηの諸国民という集合的意味を自然な日本語で表しつつ、「異邦人」の可能性を脚注に残した。
- source_word: πόλιν τὴν ἁγίαν
  choice: 聖なる都
  rationale: 黙示文学および預言書的な響きを保つ定着した表現であり、本文ではエルサレムと明示して解釈を限定しない。
- source_word: πατήσουσιν
  choice: 踏みにじる
  rationale: 単に歩くのでなく、敵対的な支配や冒瀆を含み得る動詞の強さを保った。
- source_word: μῆνας τεσσεράκοντα δύο
  choice: 四十二か月の間
  rationale: 時間の継続を表す対格を、日本語で明瞭な期間表現にした。
theological_decisions:
- issue: 黙示的な神殿描写におけるναόςの範囲
  choice: 本文では「神殿」とし、「聖所」を脚注に示す。
  alternative: 聖所
  rationale: 「神殿」は一般読者に自然だが、ναόςは神殿域全体ではなく本殿・聖所を指す場合がある。外側の庭との対比に関わるため、狭い意味も保存した。
- issue: ἔθνεσινの意味
  choice: 本文では「諸国の民」とし、「異邦人」を脚注に示す。
  alternative: 異邦人
  rationale: この語は諸国民一般を指すことも、ユダヤ人と対比された異邦人を指すこともできる。本文では広い意味を保ち、民族的・宗教的な含意を脚注に残した。
- issue: 受動態ἐδόθηの行為者
  choice: 「与えられた」と受動態を保ち、行為者を明示しない。
  alternative: 神が与えた
  rationale: 神的受動態である可能性はあるが、原文は行為者を明記しないため、本文で神を補って解釈を確定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい簡潔で荘重な調子を保った。「しかし」は前節との対照を示す。命令から理由、将来の行為へと進む原文の構造を維持した。
