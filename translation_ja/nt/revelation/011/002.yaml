  terminology: 「外庭」 better distinguishes the court from an ordinary garden while preserving the contrast with ναός. The footnote continues to preserve 「聖所」 as the more specific possible sense of ναός, and 「異邦人」 remains a valid alternative for ἔθνεσιν.
