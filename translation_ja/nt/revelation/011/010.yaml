id: REV.11.10
reference: Revelation 11:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: ja
  text: 地上に住む人々[a]は、この二人のことで喜び、祝って楽しむ[b]。そして互いに贈り物を送り合うだろう。この二人の預言者が、地上に住む人々を苦しめたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「地上に住む者たち」。黙示録ではこの表現が、神に反逆する世の人々を指して用いられることが多い。
    reason: recurring_expression
  - marker: b
    text: 別訳「浮かれ楽しむ」。ギリシア語の動詞には、祝い楽しむ響きがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς / τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: 地上に住む人々
  rationale: 分詞構文の動的な響きを保ち、節の初めと終わりで同じ表現を反復した。黙示録で繰り返される定型句としての含みも、本文で説明しすぎずに残している。
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: この二人のことで喜び
  rationale: ἐπί＋与格が示す、二人をめぐって、または二人の身に起きたことを理由として喜ぶ関係を自然な日本語で表した。「死を喜ぶ」など、文脈上明らかでも原文に明記されない内容は補わなかった。
- source_word: εὐφραίνονται
  choice: 祝って楽しむ
  rationale: χαίρωとの意味の重なりを保ちつつ、こちらにある祝宴的・浮かれ楽しむニュアンスを表した。
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: 互いに贈り物を送り合うだろう
  rationale: δῶραを標準的に「贈り物」とし、πέμψουσινの未来形を「だろう」で示した。ἀλλήλοιςは自然な相互表現「送り合う」で表した。
- source_word: οὗτοι οἱ δύο προφῆται
  choice: この二人の預言者
  rationale: 指示詞と名詞句を、意味を足さず自然な日本語にした。
- source_word: ἐβασάνισαν
  choice: 苦しめた
  rationale: 強い苦痛や苦悩を与える語の力を保った。「悩ませた」では弱すぎる一方、「拷問した」では手段を限定しすぎるため避けた。
theological_decisions:
- issue: 黙示録に反復される「地上に住む者たち」の表現
  choice: 地上に住む人々
  alternative: 地の住民たち
  rationale: この句が神に反逆する世を指すことの多い黙示録的な含意を保ちながら、本文では単に「不信者たち」などと解釈的に置き換えなかった。
- issue: 二人の預言者が人々に与えた作用の強さ
  choice: 苦しめた
  alternative: 悩ませた
  rationale: βασανίζωの強さを弱めず、同時に苦しみの具体的な方法を本文以上に限定しない訳とした。
- issue: ἐπ’ αὐτοῖςが示す喜びの対象・理由
  choice: この二人のことで喜び
  alternative: この二人を見て喜び
  rationale: 前置詞句は二人をめぐる喜びを示すが、「見て」と知覚行為に限定しない。二人の死を喜ぶという文脈は保ちつつ、原文の表現以上に明示しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい端正さを保った。現在形の「喜び、祝って楽しむ」と未来形の「送り合うだろう」の違いを訳文に反映した。二度現れる定型句は同一の訳語で統一した。
