  source_fidelity: ギリシア語の構文と語義を適切に反映している。χαίρουσιν と εὐφραίνονται は「喜び、祝って楽しむ」と二つの動詞として保持され、ἐπ’ αὐτοῖς も「この二人のことで」として、二人をめぐる喜びという範囲にとどめている。πέμψουσιν の未来形は「送り合うだろう」に反映され、ἐβασάνισαν の強さも「苦しめた」で不当に弱められていない。
  naturalness: 明瞭な現代標準日本語として自然であり、黙示録の叙述にふさわしい端正さもある。「地上に住む人々」の反復は日本語として許容され、原文で反復される句を一貫して訳す利点がある。
  terminology: 「地上に住む人々」は両出現箇所で統一され、「預言者」「贈り物」「苦しめた」も文脈と語義に適合する。脚注aは定型表現の含意を本文へ過度に持ち込まずに示しており、脚注bもεὐφραίνονταιの祝祭的なニュアンスを適切に補足している。
