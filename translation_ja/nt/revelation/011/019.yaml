id: REV.11.19
reference: Revelation 11:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: ja
  text: そして、天にある神の神殿[a]が開かれ、その神殿の中に神の契約の箱[b]が見えた。すると、稲妻、声[c]、雷鳴、地震、そして大きな雹が起こった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖所」とも訳せる。ギリシア語のναόςは、神殿域全体というより、神が住まわれる内側の聖なる場所を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 慣用的には「契約の箱」とも訳せる。原文は直訳すると「彼の契約の箱」で、ここでの「彼」は神を指す。
    reason: lexical_alternative
  - marker: c
    text: 「音」または「とどろき」とも訳せる。原語は通常「声」を意味するが、黙示録では神の威光と裁きを示す場面の語列に用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: 神殿
  rationale: ναόςは神の聖なる住まい、特に聖所を指し得るが、本文では明瞭で自然な「神殿」とした。同じ語が節内で繰り返されるため、訳語も統一した。
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: 天にある
  rationale: ναόςを修飾する位置表現として自然に訳し、神殿が天にあることを明示した。
- source_word: ἠνοίγη
  choice: 開かれ
  rationale: アオリスト受動態を受動表現で保ち、開いた主体を本文にない形で補わないようにした。
- source_word: ὤφθη
  choice: 見えた
  rationale: 受動的な知覚を自然な日本語で表し、「現れた」として箱自体の能動的な出現を強調することを避けた。
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: 神の契約の箱
  rationale: αὐτοῦの指示対象を文脈上の神として明示し、「契約」を神に属するものとして保持した。「契約の箱」は日本語聖書で理解されやすい表現である。
- source_word: ἐγένοντο
  choice: 起こった
  rationale: 続く諸現象の発生を表す自然な日本語とした。
- source_word: ἀστραπαὶ
  choice: 稲妻
  rationale: 複数形の現象を日本語で自然に総称した。
- source_word: φωναὶ
  choice: 声
  rationale: 基本義を保ち、黙示録に反復される神顕現的な語列を平板な気象音へ限定しなかった。
- source_word: βρονταὶ
  choice: 雷鳴
  rationale: 複数の雷の響きを簡潔で格調ある現代日本語で表した。
- source_word: σεισμὸς
  choice: 地震
  rationale: σεισμόςの標準的かつ文脈に適した訳語である。
- source_word: χάλαζα μεγάλη
  choice: 激しい雹
  rationale: μεγάληが示す規模・激しさを、現象として自然な日本語で表した。
theological_decisions:
- issue: 天上のναόςの性質
  choice: 本文では「神殿」と訳す
  alternative: 「聖所」
  rationale: 「神殿」は天にある神の住まいを自然に示しつつ、その建築的・神学的性質を必要以上に限定しない。「聖所」という、内奥の聖なる場所を強調する訳も脚注に残した。
- issue: 神顕現の語列におけるφωναίの意味
  choice: 本文では「声」と訳す
  alternative: 「音」または「とどろき」
  rationale: 語の基本義と黙示録に繰り返される特徴的な表現を保持した。一方、発話ではなく気象的・神顕現的な音を指す可能性も脚注で示した。
- issue: 契約の箱の属格表現
  choice: 「神の契約の箱」と訳す
  alternative: 慣用的な「契約の箱」
  rationale: 原文のαὐτοῦ（彼の）を省略せず、その契約が神のものであることを日本語で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、天上の礼拝と神顕現の場面にふさわしい荘重さを保った。受動表現と列挙のリズムを維持し、原文が明示しない行為主体や現象の性質を補いすぎないようにした。
