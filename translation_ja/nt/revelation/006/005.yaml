id: REV.6.5
reference: Revelation 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: ja
  text: 小羊が第三の封印を開いたとき、第三の生き物が「来なさい」[a]と言うのを、私は聞いた。そして見ると、そこに黒い馬がいた。その馬に乗っている者は、手に、はかり[b]を持っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ここへ来なさい」とも訳せる。この命令は、ヨハネに向けられたとも、馬とその乗り手を呼び出すものとも理解できる。
    reason: alternative_reading
  - marker: b
    text: または「天秤」。ギリシア語は重さを量る道具を指すことができ、この文脈では食糧を量るためのはかりと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: 開いた
  rationale: 封印を開くという文脈で、ἀνοίγωを自然かつ直接的に表す。
- source_word: τὴν σφραγῖδα τὴν τρίτην
  choice: 第三の封印
  rationale: 原文の順序と黙示録における一連の封印を明確に保つ。
- source_word: τοῦ τρίτου ζῴου
  choice: 第三の生き物
  rationale: 黙示録の御座を囲む存在を指す定着した表現であり、普通の動物とは区別できる。
- source_word: Ἔρχου
  choice: 来なさい
  rationale: 呼びかけの相手を補わず、簡潔な命令形として原文の曖昧さを保つ。
- source_word: εἶδον, καὶ ἰδοὺ
  choice: そして見ると、そこに
  rationale: 幻の展開とἰδούの注意喚起を、現代日本語で自然かつ生き生きと示す。
- source_word: ἵππος μέλας
  choice: 黒い馬
  rationale: 幻における色彩の象徴性を解釈せず、字義どおりに保つ。
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: その馬に乗っている者
  rationale: 『その上に座っている者』という分詞句の意味を、日本語として自然に表す。
- source_word: ζυγὸν
  choice: はかり
  rationale: 次節の食糧計量の文脈では、くびきではなく重量を量る器具を指すと考えられる。
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: 手に
  rationale: 所有者との関係が明瞭で、日本語として簡潔な表現である。
theological_decisions:
- issue: 命令Ἔρχουの相手
  choice: 相手を明示せず「来なさい」と訳す。
  alternative: ヨハネへの『ここへ来なさい』、または馬と乗り手を呼び出す命令と明示する。
  rationale: ギリシア語では命令の相手が省略されているため、解釈によって一方に限定せず曖昧さを保つ。
- issue: ζυγόςが指す物
  choice: 食糧などを量る「はかり」とする。
  alternative: 「くびき」または比喩的な重荷とする。
  rationale: 語自体には『くびき』と『天秤・はかり』の意味があるが、直後の穀物価格と配給を思わせる文脈は計量器を強く支持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい簡潔で荘重な調子を保った。主語は文脈上の小羊であることを日本語で明確にし、命令の相手については原文の曖昧さを脚注とともに維持した。
