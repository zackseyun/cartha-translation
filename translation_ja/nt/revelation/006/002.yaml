  rationale: 原文の叙述順序、受動態（「冠を与えられた」）、および乗り手の正体を明かさない曖昧さを保ったまま、「一つの」という不要な数量化を除きました。最後の句はνικάωの征服・打破の含意と反復を保つため、「征服しつつ、征服するために」としました。注記アンカーは、冠の語義注を「冠」に、正体に関する注を「乗っている者」に付し、それぞれの内容に対応させています。
