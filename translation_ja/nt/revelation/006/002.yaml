id: REV.6.2
reference: Revelation 6:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: ja
  text: また、私は見た。すると、見よ、白い馬がいた。その馬に乗っている者[b]は弓を持ち、冠[a]を与えられた。そして彼は、征服しつつ、征服するために出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「勝者の冠」とも訳せる。ギリシア語のστέφανοςは、王の冠というより、勝利者に与えられる花冠や冠を指すことが多い。
    reason: lexical_alternative
  - marker: b
    text: この乗り手が誰であるかは、本文には明記されていない。さまざまな解釈がある。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: 私は見た
  rationale: ὁράωのアオリストとして視覚経験を端的に表し、幻の展開を示す。後続のἰδούとは役割が異なるため、省略しない。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 新たな光景へ注意を促す黙示文学的な談話機能と鮮烈さを保つ。現代日本語ではやや格調があるが、理解可能で文脈に適する。
- source_word: ἵππος λευκός
  choice: 白い馬
  rationale: 冠詞のない名詞句として、幻の中に初めて現れる馬を自然に導入する。
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: それに乗っている者
  rationale: 分詞構文を保ちつつ、日本語として自然な表現にする。「それ」は白い馬を指す。
- source_word: ἔχων τόξον
  choice: 弓を持っており
  rationale: τόξονを通常どおり「弓」と訳し、ἔχωνの付帯状況を自然に表す。
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: 一つの冠を与えられた
  rationale: 受動態を維持する。「一つの」は冠詞のない単数名詞の導入を自然に示す。στέφανοςは王の王冠より勝者の冠・花冠を指すことが多いが、本文では広い「冠」として訳し、語義上の含みを注記する。
- source_word: ἐξῆλθεν
  choice: 出て行った
  rationale: 移動を表すἐξέρχομαιの基本的意味を、幻の叙述に沿って簡潔に示す。
- source_word: νικῶν
  choice: 勝利を収めながら
  rationale: 現在分詞の継続的・付帯的な動作を「ながら」で表す。νικάωは「打ち勝つ」「征服する」も可能だが、目的語が明示されないため、軍事的含意を残しつつ過度に限定しない「勝利を収める」とした。
- source_word: ἵνα νικήσῃ
  choice: さらに勝利するために
  rationale: ἵνα＋接続法の目的の力を明示する。「さらに」により、直前のνικῶνとの反復を日本語として自然に保つ。
theological_decisions:
- issue: 白い馬に乗る者の正体
  choice: 本文では正体を特定せず、「それに乗っている者」とする。
  alternative: キリストまたはキリストに似た者、征服者や帝国、反キリストまたは欺く征服者と解する見方がある。
  rationale: ギリシア語本文は、その者の姿、持ち物、授与された冠、行動を描くが、正体を明言しない。訳文で特定の解釈を読み込まず、解釈上の緊張を残す。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」によって黙示文学の荘重さと注意喚起の力を保持した。接続詞の連続は日本語として整理したが、見ること、馬の出現、乗り手の装備、冠の授与、出発と勝利という原文の叙述順序を保った。
