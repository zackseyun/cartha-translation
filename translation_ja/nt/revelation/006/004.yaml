id: REV.6.4
reference: Revelation 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: ja
  text: すると、別の馬が出て来た。火のように赤い馬であった[a]。それに乗っている者には、地[b]から平和を奪い去り、人々が互いに殺し合う[c]ようにすることが許された。また、その者には大きな剣が与えられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「赤い馬」とも訳せる。ギリシア語は、より厳密には火を思わせる赤色を表す。
    reason: lexical_alternative
  - marker: b
    text: 「地」は「土地」とも訳せるが、ここでは全世界に及ぶ黙示的な文脈により、広い意味に理解できる。
    reason: lexical_alternative
  - marker: c
    text: ここで「殺し合う」と訳した語は、単に「殺す」というより強く、流血を伴う激しい殺害を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἵππος
  choice: 別の馬
  rationale: 先に現れた馬とは異なる、次の一頭であることを自然な日本語で示す。
- source_word: πυρρός
  choice: 火のように赤い
  rationale: 単なる赤色ではなく、火を思わせる鮮烈な赤という語感を明確に伝える。
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: それに乗っている者
  rationale: 分詞表現を保ち、「騎手」と解釈的に言い換えることを避けた。日本語では馬について「座っている者」より「乗っている者」が自然である。
- source_word: ἐδόθη αὐτῷ λαβεῖν
  choice: ことが許された
  rationale: 与える者を明示しない受動表現を保ちつつ、行為を行うことが付与されたという意味を自然な日本語にした。「力」や「権威」は本文にないため補わない。
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: 地から平和を奪い去り
  rationale: 平和が取り除かれる強い動きを表す。「地」はγῆの広い範囲を指し得る意味を保ち、「地上」より原文に近い簡潔な表現とした。
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: 人々が互いに殺し合うようにする
  rationale: ἵναの目的・結果の含みを保つ。σφάζωの流血を伴う激しい殺害の意味は、日本語本文では自然な「殺し合う」とし、脚注で強さを補足する。
- source_word: μάχαιρα μεγάλη
  choice: 大きな剣
  rationale: μάχαιραは剣または大型の短剣を指し得るが、黙示的な幻の描写として「剣」が明瞭で自然である。μεγάληは解釈を加えず「大きな」とした。
theological_decisions:
- issue: 二度のἐδόθηにおける神的受動表現
  choice: 与えた方を明示せず、「許された」「与えられた」という受動表現にする
  alternative: 「神が彼に許した」または「神が彼に与えた」
  rationale: 原文は行為の背後にある主権を暗示しつつ、与える主体を明記しない。主体を神と補わず、黙示録の文学的・神学的な緊張を保つ。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、黙示文学にふさわしい簡潔で重みのある文体とした。「すると」で幻の展開を示し、二度の受動表現による反復も可能な限り保持した。
