- from: そして彼らは山々と岩々に言う。「私たちの上に落ちて、王座に着いておられる方の御顔[a]から、また子羊の怒りから、私たちを隠してくれ。」
  to: そして彼らは山々や岩に言う。「私たちの上に落ちて、王座に座っておられる方の御顔[a]から、また子羊の怒りから、私たちを隠してくれ。」
  rationale: 複数性を日本語として自然な総称表現「山々や岩」に改め、καθήμενοςの「座っている」という意味を「王座に座っておられる方」と明示した。それ以外は、切迫した命令、二重の「〜から」、および子羊の怒りという原文の印象的な緊張を維持した。
