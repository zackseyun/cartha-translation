id: REV.6.16
reference: Revelation 6:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: ja
  text: そして彼らは山々や岩に言う。「私たちの上に落ちて、王座に座っておられる方の御顔[a]から、また子羊の怒りから、私たちを隠してくれ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御前から」とも訳せる。
    reason: πρόσωπονは字義的には「顔」だが、この句では「面前、臨在」を表すこともあるため。
lexical_decisions:
- source_word: λέγουσιν
  choice: 言う
  rationale: 黙示的な物語の臨場感を保つため、現在形をそのまま生き生きとした現在として訳した。
- source_word: ὄρεσιν καὶ ταῖς πέτραις
  choice: 山々と岩々
  rationale: ὄροςの「山」とπέτραの「岩、岩塊」という像を保ち、呼びかけの対象が複数であることも自然な日本語で示した。
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: 私たちの上に落ちて
  rationale: アオリスト命令形の切迫した直接命令を簡潔に表した。
- source_word: κρύψατε ἡμᾶς
  choice: 私たちを隠してくれ
  rationale: 命令の必死さが伝わる自然な現代日本語とし、過度に文語的な表現を避けた。
- source_word: ἀπὸ προσώπου
  choice: 御顔から
  rationale: πρόσωπονの具体的な「顔」という像を保持した。「御前から／臨在から」という意味も可能なため脚注に示した。
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: 王座に着いておられる方
  rationale: 冠詞付き分詞が示す、王座に座している方という継続的な状態と尊厳を自然に表した。
- source_word: ὀργῆς
  choice: 怒り
  rationale: 終末の裁きに伴う強い怒りを表しつつ、現代日本語で明瞭な語を選んだ。
- source_word: τοῦ ἀρνίου
  choice: 子羊
  rationale: 黙示録でキリストを指す確立した称号を保ち、犠牲の子羊と裁きの権威との逆説もそのまま残した。
theological_decisions:
- issue: 終末の裁きにおける、王座に着いておられる方と子羊の関係
  choice: 「王座に着いておられる方」と「子羊」を区別しつつ、恐れの対象として並列に保った。
  alternative: 両者を神への一般的な言及にまとめる、または「子羊の怒り」を弱める。
  rationale: ギリシャ語はἀπόに続いて、王座に着いている方と子羊を指す二つの属格表現を明示的に並べている。犠牲を想起させる子羊が終末的な怒りの主体でもあるという神学的緊張を解消せずに保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神的称号には「御顔」「おられる」を用いて荘重さを保った。直接話法は、恐怖と切迫感が伝わる自然な口調にした。
