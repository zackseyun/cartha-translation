id: REV.6.8
reference: Revelation 6:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: ja
  text: また私は見た。すると、見よ、青白い馬がいた。[a] それに乗っている者の名は「死」で、ハデスが彼に付き従っていた。そして彼らには、地の四分の一に対して、剣と飢饉と疫病[b]と地上の野獣によって殺す権威が与えられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「緑がかった馬」。ギリシア語は植物の緑色にも、病的な青ざめた色にも用いられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「死」。ここではエゼキエル書に見られる裁きの列挙を踏まえ、「疫病」の意味に解した。
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: 青白い
  rationale: 本来は緑系統の色を表すが、この文脈では病的・死体的な青ざめた色合いを示す。「青白い」は現代日本語として自然で、不吉な緑がかった蒼白さを伝える。字義的な色彩は脚注で明示する。
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: それに乗っている者
  rationale: 分詞表現を明確に保ちつつ、馬についての自然な日本語とした。
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: それに乗っている者の名は「死」
  rationale: 名を明示するギリシア語の構文と、「死」の擬人化を保つ。
- source_word: ᾅδης
  choice: ハデス
  rationale: 死者の領域を指す固有の語として音写し、「地獄」と訳して最終的刑罰の概念を持ち込むことを避ける。
- source_word: μετ’ αὐτοῦ
  choice: 彼に伴って
  rationale: μετά＋属格の基本義「〜と共に」を保ち、ἠκολούθει（従っていた）との組み合わせを自然に表す。
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: 彼らには…権威が与えられた
  rationale: ἐξουσίαを委ねられた権限として「権威」とし、神的受動態を保つ。複数代名詞は「死」と「ハデス」を受ける。
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: 地上の四分の一を支配し
  rationale: ἐπί＋対格とἐξουσίαの関係を、権威の及ぶ範囲として自然に示す。γῆは黙示録の広域的な裁きの文脈から「地上」とした。
- source_word: ἐν ῥομφαίᾳ
  choice: 剣によって
  rationale: 殺害の手段を表す具格的なἐνを、並列に合う「〜によって」で訳す。
- source_word: ἐν λιμῷ
  choice: 飢饉によって
  rationale: λιμόςは個人の空腹ではなく飢饉を意味する。
- source_word: ἐν θανάτῳ
  choice: 疫病によって
  rationale: 字義は「死」だが、エゼキエル書の裁きの列挙を背景とする慣用的意味では疫病を指すと考えられる。字義訳は脚注に残す。
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: 地上の野獣によって
  rationale: ὑπόによる作用者・手段を明確にし、θηρίαを野生の獣として訳す。
theological_decisions:
- issue: ᾅδηςの訳語
  choice: ハデス
  alternative: 死者の世界／陰府／地獄
  rationale: 本文は擬人化された「死」と、それに従う死者の領域を区別している。「地獄」は最終的な刑罰との混同を招き得るため避け、原語の区別を保った。
- issue: ἐν θανάτῳの解釈
  choice: 疫病によって
  alternative: 死によって
  rationale: エゼキエル14章などの旧約聖書に見られる裁きの定型的な列挙では「死」が疫病を表し得る。列挙の意味を明瞭にしつつ、直訳は脚注に示して解釈上の透明性を保つ。
- issue: αὐτοῖςの指示対象
  choice: 「死」と「ハデス」を受ける複数の「彼ら」
  alternative: 単数として乗り手のみを指す読み
  rationale: SBLGNT本文の複数形αὐτοῖςをそのまま反映し、権威を与えられた対象を二者として表した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「見よ」は黙示的な場面転換と注意喚起を保つため維持した。「ハデス」は神学的な過剰解釈を避けるため音写した。
