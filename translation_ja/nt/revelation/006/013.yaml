  text: καὶ οἱ ἀστέρες τοῦ οὐρανοῦ ἔπεσαν εἰς τὴν γῆν, ὡς συκῆ ⸀βάλλει τοὺς ὀλύνθους αὐτῆς ὑπὸ ἀνέμου μεγάλου σειομένη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: ja
  text: また、天の星々が地に落ちた。強い風に揺さぶられたいちじくの木が、その未熟な実[a]を落とすように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「冬いちじく」「青いいちじく」「遅なりのいちじく」。ギリシア語は、熟す前に振り落とされる未熟ないちじくの実を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἀστέρες τοῦ οὐρανοῦ
  choice: 天の星々
  rationale: 「星」という通常の語義と黙示文学的な宇宙規模の表現を保ち、象徴の指示対象を訳文で限定しない。「空の星々」も可能だが、「天の」は原文の荘重さにより適する。
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: 地上に落ちた
  rationale: εἰς が示す地へ向かう動きを自然な現代日本語で表した。「地」は陸地とも解し得るが、ここでは宇宙的対比を明瞭にするため「地上」とした。
- source_word: ὡς
  choice: 〜ようであった
  rationale: 後続するいちじくの木の情景を直前の出来事に結び付ける直喩として自然に表現した。
- source_word: συκῆ
  choice: いちじくの木
  rationale: 植物名だけでなく木そのものを指すことが明瞭な標準的表現。
- source_word: βάλλει
  choice: 落とす
  rationale: 基本義は「投げる」だが、木が実を振り落とす文脈では「落とす」が自然であり、結果も正確に伝える。
- source_word: τοὺς ὀλύνθους αὐτῆς
  choice: 熟していない実
  rationale: 成熟前に落ちるいちじくの実を平明に示す。本文では直前の「いちじくの木」から実の種類が明らかなため、重複を避けて「実」とした。語の細かな異訳可能性は脚注に保持する。
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: 強い風に
  rationale: μέγας の力の大きさを、現代日本語で風について自然な「強い」で表した。
- source_word: σειομένη
  choice: 揺さぶられて
  rationale: 木が風によって激しく動かされる受動の意味を保つ。「揺れて」より外力と激しさが明瞭である。
theological_decisions:
- issue: 天の星々が地上に落ちるという黙示文学的イメージ
  choice: 「天の星々が地上に落ちた」という語彙的イメージをそのまま保つ。
  alternative: 星々を天使、支配者、その他の象徴的存在と解釈して訳す。
  rationale: このイメージには象徴的意味があり得るが、原文はここでその指示対象を明示していない。訳文で解釈を確定せず、黙示文学固有の緊張と多義性を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、黙示文学にふさわしい荘重さを保った。「また」で前節からの連続を示し、直喩は日本語として読みやすい二文構成にした。脚注記号[a]は該当語の直後に置いた。
