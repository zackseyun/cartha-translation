id: REV.6.1
reference: Revelation 6:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: ja
  text: また私は、子羊が七つの封印の一つを開いたのを見た。すると、四つの生き物の一つが、雷のような声で「来なさい」[a]と言うのを聞いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この命令がヨハネではなく騎手に向けられたものと理解する場合は、「進み出なさい」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: 子羊
  rationale: 黙示録においてイエスを指す称号として用いられている。日本語で定着した「子羊」は、原語の語形を自然に伝えつつ、不要な幼さの強調を避ける。
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: 七つの封印の一つ
  rationale: 集合の中の一つを示す部分表現を、明瞭で自然な日本語にした。
- source_word: ζῴων
  choice: 生き物
  rationale: ここでは通常の動物ではなく、御座の周りにいる存在を指す。「生き物」は黙示録の文脈に適し、原語以上にその性質を規定しない。
- source_word: ὡς φωνῇ βροντῆς
  choice: 雷のような声で
  rationale: 声を雷にたとえる比喩を、簡潔で自然な日本語として保持した。
- source_word: Ἔρχου
  choice: 来なさい
  rationale: ἔρχομαι の命令形を最も直接的に訳した。命令の相手は本文中で明示せず、原文の曖昧さを保った。
- source_word: ὅτε
  choice: 私が見ていると
  rationale: 子羊が封印を開く場面をヨハネが目撃したという時間的関係を、自然な日本語の物語表現で示した。
- source_word: εἶδον
  choice: 私が見ていると
  rationale: 物語の視覚的導入を表す。後続する出来事とのつながりを自然にするため、「見ていると」とした。
- source_word: ἤκουσα
  choice: 聞こえた
  rationale: 話者が声を耳にしたことを、日本語の自然な知覚表現で示した。
- source_word: λέγοντος
  choice: と言うのが
  rationale: 分詞の内容を、主文の「聞こえた」に自然につながる日本語で表した。
theological_decisions:
- issue: 命令 Ἔρχου の相手と方向性
  choice: 本文では「来なさい」とし、相手を特定しない。
  alternative: 騎手に向けた命令と理解して「出て来なさい」または「進み出なさい」とする。
  rationale: ギリシア語は直接には「来なさい」を意味し、命令の相手を明示していない。本文ではその開かれた意味を保ち、騎手への命令と見る解釈を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、黙示文学にふさわしい荘重さを保った。「また」「すると」により物語の展開を自然に示し、命令の相手に関する原文の曖昧さは解消しないようにした。
