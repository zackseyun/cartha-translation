id: REV.6.14
reference: Revelation 6:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: ja
  text: また、空は巻物が巻かれるように退き[a]、すべての山と島は、それぞれの場所から動かされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「離れ去り」「分かれ」とも訳せる。ギリシア語は、分離すること、または退くことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: 空
  rationale: この黙示的な宇宙異変の場面では、神の住まいというより地上から見える天空を指すため、現代日本語で明瞭な「空」とした。
- source_word: ἀπεχωρίσθη
  choice: 退き
  rationale: 分離する、離れる、退くという語義を踏まえ、巻物が巻かれる比喩と自然につながる「退き」を採用した。消滅と断定せず、原文の幅は脚注に残した。
- source_word: βιβλίον
  choice: 巻物
  rationale: 巻かれるという動作と古代の書物形態を正確に表し、現代の冊子本との混同を避ける。
- source_word: ἑλισσόμενον
  choice: 巻かれる
  rationale: 受動の現在分詞が表す進行中の巻き上げを、簡潔で自然な日本語にした。
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: すべての山と島
  rationale: 単数名詞に伴う πᾶν の分配的な意味を、日本語で自然に表した。
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: それぞれの場所から
  rationale: 原文の複数形を保ちつつ、一つ一つの山と島が各自の場所から移されたという分配的意味を明示した。
- source_word: ἐκινήθησαν
  choice: 動かされた
  rationale: 単なる震動ではなく、元の場所から移動させられたことを表す受動形として訳した。
theological_decisions:
- issue: 黙示的描写における οὐρανός の指示対象
  choice: 「空」と訳す
  alternative: 「天」
  rationale: 神の住まいが変容したとの教理的含意を加えず、幻の中で目に見える宇宙的異変として描かれていることを明瞭にする。
- issue: 空に起こる動作の性質
  choice: 「退き」と訳し、語義の幅を脚注で示す
  alternative: 「二つに分かれた」「消え去った」
  rationale: ἀπεχωρίσθη は分離、離脱、後退のいずれにも解し得るため、空の消滅や具体的な割れ方を本文で断定しない。巻物が巻かれる比喩とのつながりも保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学の荘重さを保った。「それぞれの場所から」により原文の複数・分配的表現を自然に再現した。
