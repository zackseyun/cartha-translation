id: REV.6.12
reference: Revelation 6:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: ja
  text: 彼が第六の封印を開いたとき、私は見た。すると、大きな地震が起こり、太陽は毛で作った粗布[a]のように黒くなり、月全体は血のようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「毛の粗布」。動物の毛で作ったごわごわした布で、伝統的に喪を表す際に用いられた。
    reason: 「σάκκος τρίχινος」の材質と文化的背景を補足するため。
lexical_decisions:
- source_word: εἶδον
  choice: 私は見た
  rationale: 黙示の中での目撃を導入する表現として、簡潔で自然な訳とした。
- source_word: ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην
  choice: 彼が第六の封印を開いたとき
  rationale: 時間関係と三人称単数の主語を保ち、文脈上の行為者を訳文で解釈的に特定しなかった。
- source_word: σεισμὸς μέγας ἐγένετο
  choice: 大きな地震が起こり
  rationale: σεισμόςをこの文脈で自然な「地震」とし、μέγαςの強調を「大きな」で明示した。
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: 太陽は…黒くなり
  rationale: μέλαςの具体的な色彩である「黒」を保ち、γίνομαιを自然な変化表現で訳した。
- source_word: ὡς σάκκος τρίχινος
  choice: 毛で織った粗布のように
  rationale: σάκκοςの粗い布と、τρίχινοςが示す毛製であることの双方を、現代日本語で理解しやすく表した。
- source_word: ἡ σελήνη ὅλη
  choice: 月は全体が
  rationale: ὅληの強調を明示し、月全体に及ぶ描写として訳した。
- source_word: ἐγένετο ὡς αἷμα
  choice: 血のようになった
  rationale: ὡςを比喩として明確にし、月が文字どおり血になったとは断定しない形を保った。
theological_decisions:
- issue: 宇宙的なしるしの性質
  choice: 幻の中の描写をそのまま訳し、文字どおりの天文現象か象徴的なしるしかを決めない
  alternative: 終末の物理的異変と明示する、または神の裁きや政治的変動の象徴と明示する
  rationale: 本文は「粗布のように」「血のように」という比喩を用いる一方、その広い解釈を確定していないため、曖昧さと緊張を保持した。
- issue: 第六の封印を開く者の同定
  choice: 「彼」とし、この節だけでは名を補わない
  alternative: 文脈に基づいて「子羊」と明示する
  rationale: ギリシア語本文では主語が三人称単数の動詞に含まれるだけなので、直前の文脈に依存する指示関係を残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、黙示文学の荘重で鮮烈な調子を保った。節末の読点ではなく、日本語として完結する句点を用いた。
