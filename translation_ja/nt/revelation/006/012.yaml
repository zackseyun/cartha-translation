revisions:
- from: 彼が第六の封印を開いたとき、私は見た。すると、大きな地震が起こり、太陽は毛で織った粗布[a]のように黒くなり、月は全体が血のようになった。
  to: 彼が第六の封印を開いたとき、私は見た。すると、大きな地震が起こり、太陽は毛で作った粗布[a]のように黒くなり、月全体は血のようになった。
  rationale: 意味を変更せず、日本語の自然さと語義上の精度を整えた。「月全体」によりὅληの修飾関係を明確にし、「毛で作った粗布」により毛製であることを保ちつつ、原語にない製法の含みを避けた。脚注アンカーと脚注は適切に対応している。
