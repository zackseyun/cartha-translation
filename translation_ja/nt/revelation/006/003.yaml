id: REV.6.3
reference: Revelation 6:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: ja
  text: そして、小羊が第二の封印を開いたとき、私は、第二の生き物が「来なさい[a]」と言うのを聞いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「行け」。この命令を、来るようにとの呼びかけではなく、騎手に向けられたものと理解する人もいる。
    reason: Ἔρχουの基本義は本文の「来なさい」に保ちつつ、命令の宛先を騎手と理解する文脈的解釈に基づく「行け」という別訳を示すため。
lexical_decisions:
- source_word: Καὶ
  choice: また
  rationale: 前節から続く物語の流れを示す接続詞として、現代日本語で自然な「また」とした。
- source_word: ὅτε
  choice: とき
  rationale: 出来事が起こる時点を示す時間接続表現として訳した。
- source_word: ἤνοιξεν
  choice: 開いた
  rationale: ἀνοίγωの基本義を保ち、「封印を解いた」などの解釈的表現を避けた。主語は直前の文脈から明らかなため「小羊」と補った。
- source_word: σφραγῖδα τὴν δευτέραν
  choice: 第二の封印
  rationale: 序数の強調を保ちつつ、自然な日本語の語順にした。
- source_word: ἤκουσα
  choice: 私は聞いた
  rationale: 物語におけるἀκούωの単純な知覚を、明瞭な現代日本語で表した。
- source_word: τοῦ δευτέρου ζῴου
  choice: 第二の生き物
  rationale: 黙示録4―6章の御座の周囲にいる存在を指すため、普通の動物と誤解されにくく、既出表現との整合性も保てる「生き物」とした。
- source_word: λέγοντος
  choice: 「来なさい」と言うのを
  rationale: 属格分詞がἤκουσαに従属する構文を、日本語で自然な知覚構文として表した。
- source_word: Ἔρχου
  choice: 来なさい
  rationale: ἔρχομαιの命令形の基本的な方向性を保った。命令の相手が明示されないため、その曖昧さを本文で維持し、文脈上可能な「行きなさい」は脚注に示した。
theological_decisions:
- issue: 封印が開かれた際の命令Ἔρχουの訳し方
  choice: 来なさい
  alternative: 行きなさい
  rationale: ギリシア語の通常の意味は「来なさい」だが、命令が騎手に向けられていると理解する場合には文脈上「行きなさい」と訳す余地がある。本文では語の基本義を採り、命令の対象を補わず、別案を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「小羊」は原文の当該節では省略されているが、直前の明示的主語を日本語で自然に受けるため補った。命令の宛先は補わず、原文の解釈上の余地を維持した。
