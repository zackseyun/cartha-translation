source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: ja
  text: 地上の王たち、有力者たち[a]、軍の司令官たち、富む者たち、力ある者たち、奴隷も自由人も皆[b]、洞窟や山々の岩間に身を隠した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「有力者たち」は「高官たち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「すべての奴隷と自由人」と単数形で表すが、奴隷と自由人の双方を含む人々全体を指す。
    reason: representative_singular
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: 地上の王たち
  rationale: γῆには「地」と「土地」の両義があるが、黙示録における全地的な裁きの文脈と反復表現を踏まえ、「地上」とした。
- source_word: μεγιστᾶνες
  choice: 高官たち
  rationale: 高い地位や大きな影響力を持つ人々を指す語。「貴族」では世襲身分に狭く限定されかねないため、現代日本語で通じやすい「高官」とした。
- source_word: χιλίαρχοι
  choice: 軍の司令官たち
  rationale: 字義的には千人規模の部隊を率いる者だが、特定の古代階級名に固定せず、軍事的指揮官であることを自然に示した。
- source_word: πλούσιοι
  choice: 富む者たち
  rationale: 名詞的に用いられた形容詞を簡潔に表し、社会集団の列挙にも調和させた。
- source_word: ἰσχυροὶ
  choice: 力ある者たち
  rationale: 身体的な強さと社会的・政治的な力の双方を含み得る語なので、「権力者」と狭く解釈せず、原文の幅を保った。
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: 奴隷も自由人も皆
  rationale: δοῦλοςとἐλεύθεροςの対比は法的・社会的身分を明示するため「奴隷」と「自由人」とした。単数形の対句は代表的・包括的に用いられているので、「皆」でその働きを示した。
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: 身を隠した
  rationale: 再帰表現を自然で簡潔な現代日本語にした。
- source_word: εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων
  choice: 山々の洞窟や岩間に
  rationale: εἰςの方向性を、日本語では「身を隠す」と自然に結びつく場所表現で示した。πέτραιは山中の岩や岩場を指し得るため、隠れる場所として自然な「岩間」とした。
theological_decisions:
- issue: δοῦλοςの訳語
  choice: 奴隷
  alternative: 僕、仕える者
  rationale: 直後の「自由人」との対比により、拘束された社会的身分が明確なので、「奴隷」が原文の対照を最も正確に保つ。
- issue: πᾶς δοῦλος καὶ ἐλεύθεροςの包括性
  choice: 奴隷も自由人も皆
  alternative: 奴隷である男も自由な男もすべて
  rationale: ギリシア語は男性単数形だが、奴隷か自由人かという社会的身分の対句によって人々全体を代表的に指している。性別を男性に限定せず、同時に身分上の対比を保った。
- issue: ἰσχυροὶが表す力の性質
  choice: 力ある者たち
  alternative: 権力者たち、強い者たち
  rationale: 文脈上は社会的権力を指す可能性が高い一方、語自体は強さや能力も表し得るため、神学的・社会的意味を一方に限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の身分集団の連続的な列挙を維持しつつ、過度に古風な軍事階級名や不自然な逐語訳を避けた。
