id: REV.6.7
reference: Revelation 6:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: ja
  text: また、小羊が第四の封印を開いたとき、私は第四の生き物が「来なさい」[a]と言う声を聞いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈によっては、「進み出よ」とも理解できる。ギリシア語はより字義的には「来なさい」だが、この命令がヨハネに向けられたのか、騎手に向けられたのかについては解釈が分かれる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: 開いた
  rationale: ἀνοίγωのアオリストを自然に表し、巻物の封印を順に開くという黙示録の反復表現にも適合する。
- source_word: σφραγῖδα
  choice: 封印
  rationale: 巻物を閉じている封を指す定着した訳語であり、黙示録6章の文脈を明確に伝える。
- source_word: τετάρτην / τετάρτου
  choice: 第四の
  rationale: 二つの序数を一貫して訳し、封印と生き物の順序を明示する。
- source_word: φωνὴν
  choice: 声
  rationale: 後続する属格「第四の生き物の」によって特定されるため、「第四の生き物の声」と自然に訳した。
- source_word: ζῴου
  choice: 生き物
  rationale: 御座の周囲にいる存在を指す語であり、θηρίον（獣）との区別を保ちながら、現代日本語として簡潔に表す。
- source_word: λέγοντος
  choice: 言う
  rationale: 「声が……と言うのを聞いた」という日本語の構文で現在分詞の内容を自然に表した。
- source_word: Ἔρχου
  choice: 来なさい
  rationale: ἔρχουの最も直接的な意味を保った単数命令形。命令の相手を本文で特定せず、原文の曖昧さを残す。
theological_decisions:
- issue: 命令形Ἔρχουの相手
  choice: 相手を明示せず「来なさい」と訳す。
  alternative: ヨハネへの命令、または騎手への「出て行け」という命令として明示する。
  rationale: ギリシア語本文は命令の相手を特定していない。本文では直接的な語義を採り、ヨハネと騎手のどちらに向けられた命令かという解釈上の緊張を保持する。
- issue: ἤνοιξενの省略された主語
  choice: 文脈上の主語を「小羊」と明示する。
  alternative: 「彼が」とする、または日本語でも主語を省略する。
  rationale: ギリシア語では動詞の主語が前文脈から継続しており、黙示録6章で封印を開く者は小羊である。日本語では「彼が」より「小羊が」のほうが明瞭で自然であり、新たな解釈を加えない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「来い」よりも過度に荒々しくない「来なさい」を用いた。読点を置いて長い修飾関係を読み取りやすくし、脚注記号は解釈上の問題が生じる命令句の直後に配置した。
