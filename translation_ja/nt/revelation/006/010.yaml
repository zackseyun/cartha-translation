id: REV.6.10
reference: Revelation 6:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: ja
  text: 彼らは大声で叫んだ。「聖であり真実である主権者よ[a]、いつまで裁きを行わず、私たちの血のために地上に住む者たちに報復をなさらないのですか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主権者」に当たるギリシア語はデスポテースで、絶対的な権威を強調する。通常「主」と訳されるキュリオスとは別の語。別訳「主人」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは、「地上に住む者たちから、私たちの血のために報復をなさらないのですか」。ギリシア語の「から」は、報復を取り立てる相手を示し、文脈上は報復の対象を指す。「地上に住む者たち」は黙示録で繰り返される表現。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: 大声で叫んだ
  rationale: 叫びの強さを自然な現代日本語で表し、φωνῇ μεγάλῃの具体性も保つ。
- source_word: Ἕως πότε
  choice: いつまで
  rationale: 神の行動が遅れていることを訴える嘆願として、日本語で自然な定型表現。
- source_word: δεσπότης
  choice: 主権者
  rationale: 絶対的な権威を表し、通常κύριοςに対応する「主」との語彙上の違いを保つ。「主人」より神への呼びかけとして自然で荘重。
- source_word: ἅγιος καὶ ἀληθινός
  choice: 聖なる真実な
  rationale: 神の聖さと、真正さ・信頼性を直接的に表す。二つの形容語が呼びかけられた方を修飾する構造を保つ。
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: 裁きを行わず、…報復をなさらない
  rationale: 現在形を、遅延への訴えを含む修辞疑問として自然な敬語表現にした。ἐκδικεῖςの司法的・報復的な強さを弱めない。
- source_word: τὸ αἷμα ἡμῶν
  choice: 私たちの血
  rationale: 暴力によって奪われた命を指す聖書的な換喩を説明的に言い換えず保持する。
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: 地上に住む者たちに
  rationale: ἐκが報復の対象または報復を取り立てる相手を示す文脈上の機能を、自然な日本語の「に」で表した。黙示録で反復される「地上に住む者たち」という表現も保持する。
theological_decisions:
- issue: 神への呼称δεσπότης
  choice: 主権者
  alternative: 主人／主なる神
  rationale: κύριοςとの区別と絶対的権威の含意を保ちつつ、本文にない「神」を補わない。「主人」は所有関係をより直接に表せるが、現代日本語では人間の雇用主・家長を強く連想させる。
- issue: 殉教者たちの正義を求める訴え
  choice: 裁きを行わず、私たちの血の報復をなさらない
  alternative: 裁いて、私たちの血のために正義を行ってくださらない
  rationale: 本文の裁きと報復の司法的・応報的緊張を弱めず、個人的復讐とも断定せず、神への嘆願として示す。
- issue: ἐκと報復対象との関係
  choice: 地上に住む者たちに…報復
  alternative: 地上に住む者たちから…報復を取り立てる
  rationale: 対象を示す解釈を本文に採ったが、ἐκには相手から償いを取り立てるという起点的な含みもあり得るため、脚注で明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神への直接の呼びかけには敬語を用いた。荘重さを保ちながら古語調を避けた。「血」「報復」「地上に住む者たち」という黙示録の具体的かつ反復的な語彙を保持した。
