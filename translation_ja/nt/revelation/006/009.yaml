id: REV.6.9
reference: Revelation 6:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: ja
  text: 小羊が第五の封印を開いたとき、私は祭壇の下に、神のことばと、彼らが持っていた証し[b]のために、ほふられた[a]人々の魂を見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「殺された」。原語には激しい殺害に加え、いけにえをほふる響きもあります。
    reason: lexical_alternative
  - marker: b
    text: または「証言」。原語は、証しされた内容と証しする行為のどちらをも指し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: 開いた
  rationale: 封印を開くという黙示録の反復表現に合う、自然で標準的な訳。主語は文脈上の小羊として明示した。
- source_word: σφραγῖδα
  choice: 封印
  rationale: 黙示文学の象徴を正確に伝える定訳。
- source_word: ὑποκάτω τοῦ θυσιαστηρίου
  choice: 祭壇の下に
  rationale: 空間的関係と祭儀的イメージを、余分な説明を加えずに保持する。
- source_word: ψυχὰς
  choice: 魂
  rationale: 祭壇の下にいる殉教者たちを描く幻の具体性を保ち、「命」や「人々」への平板化を避ける。
- source_word: ἐσφαγμένων
  choice: ほふられた
  rationale: 単なる「殺された」より強い暴力性と、祭壇に呼応する犠牲の含意を保つ。「ほふる」は現代語ではやや荘重だが、この場面に適する。
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: 神のことばのために
  rationale: 対格を伴う διά の原因・理由を明確に表す。
- source_word: μαρτυρίαν
  choice: 証し
  rationale: 証言された内容と証言行為の双方を含み得る語として、宗教的・法廷的な響きを保つ。
- source_word: ἣν εἶχον
  choice: 彼らが持っていた
  rationale: ἔχω の未完了過去を解釈的に「立てた」「守り通した」とせず、原文の簡潔さと曖昧さを保つ。
theological_decisions:
- issue: ψυχὰς が示すもの
  choice: 本文では「魂」とする。
  alternative: 「命」「人々」
  rationale: ヨハネが見た幻における死者の描写を保持しつつ、人間論について本文以上の体系的結論を加えない。
- issue: ἐσφαγμένων の犠牲的な響き
  choice: 「ほふられた」とする。
  alternative: 「殺された」
  rationale: 祭壇のイメージと響き合う、暴力的かつ犠牲的な語感を残すため。
- issue: 動詞 ἤνοιξεν の省略された主語
  choice: 文脈上の主語を「小羊」と明示する。
  alternative: 「彼が」または主語を省略する。
  rationale: 日本語で主語を省くと「私」が封印を開いたとも読めるため、直前の文脈で封印を開く小羊を明示し、指示関係を自然にした。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、幻と祭儀の場面にふさわしい荘重さを保った。「ほふられた」は犠牲的含意を優先した表現であり、平易な代案を脚注に示した。脚注記号は対応語の直後に配置した。
