id: REV.6.6
reference: Revelation 6:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: ja
  text: また私は、四つの生き物のただ中で、声のようなものがこう告げるのを聞いた。「小麦一コイニクスは一デナリオン[a]、大麦三コイニクスは一デナリオン。そして、オリーブ油とぶどう酒を損なってはならない[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: コイニクスは古代の乾量単位で、約一リットル。一般に一人分の一日の穀物量ほどと考えられている。一デナリオンは、労働者のおよそ一日分の賃金に当たった。この価格は深刻な食糧不足を示している。
    reason: cultural_note
  - marker: b
    text: 「害してはならない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: 声のようなもの
  rationale: ὡςが示す知覚上の類似を保ち、話者が誰であるかを本文以上に特定しない自然な日本語とした。
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: 四つの生き物のただ中で
  rationale: ἐν μέσῳの空間的意味を保つ。ζῷαは黙示録後半の敵対的な「獣」との混同を避け、御座を囲む存在にふさわしく「生き物」とした。
- source_word: Χοῖνιξ
  choice: コイニクス
  rationale: 現代日本語には正確に対応する一般的な乾量単位がないため、推測的な換算を本文に入れず音写し、容量と日量としての意味を脚注で示した。
- source_word: σίτου
  choice: 小麦
  rationale: 大麦との対比が明確になる標準的な訳語を用いた。
- source_word: δηναρίου
  choice: 一デナリオン
  rationale: 価格を表す属格を簡潔な価格表示として訳した。古代貨幣の歴史的性格を保つため現代通貨には換算しない。
- source_word: τρεῖς χοίνικες κριθῶν
  choice: 大麦三コイニクス
  rationale: 数量と品目を明確に示し、先行する小麦の価格との対照を保った。
- source_word: τὸ ἔλαιον
  choice: オリーブ油
  rationale: 当時のἔλαιονが通常指すものを、現代日本語で誤解なく伝えるため具体化した。
- source_word: τὸν οἶνον
  choice: ぶどう酒
  rationale: οἶνοςを明確かつ一般読者に分かりやすく表した。
- source_word: μὴ ἀδικήσῃς
  choice: 損なってはならない
  rationale: ἀδικέωの「害する、損害を与える」という幅を、物品である油とぶどう酒に自然に適用できる表現で訳した。
theological_decisions:
- issue: 御座の周囲にいるζῷαの呼称
  choice: 生き物
  alternative: 獣／動物
  rationale: 黙示録に後に登場する敵対的な「獣」と区別しつつ、幻の中の存在を過度に解釈しないため。
- issue: 古代の容量と貨幣の扱い
  choice: コイニクスとデナリオンを音写し、脚注で説明する
  alternative: リットルや現代の金額に換算する
  rationale: 古代の経済的背景を保ち、換算による見せかけの精密さを避けながら、深刻な欠乏を読者が理解できるようにした。
- issue: 油とぶどう酒への命令の意味
  choice: 損なってはならない
  alternative: 害してはならない／不正を働いてはならない
  rationale: 対象が物品である文脈に合う意味を採りつつ、その保護が経済的・象徴的に何を意味するかは本文で限定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、幻の宣言にふさわしい簡潔で重みのある調子を保った。価格の句は原文と同じく動詞を補わず、切迫した市場の告知の響きを残した。
