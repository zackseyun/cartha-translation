id: REV.6.17
reference: Revelation 6:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: ja
  text: 彼らの憤りの大いなる日が来たからである[a]。だれが立っていられるだろうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼らの憤り」。前節の「御座に着いておられる方」と「子羊」の双方を指す。単数の「その方の憤り」と解釈して訳すこともある。
    reason: 複数代名詞が指す対象と、解釈的な単数訳の可能性を明示するため。
lexical_decisions:
- source_word: ὅτι
  choice: からである
  rationale: 前節で人々が恐れおののく理由を示す接続表現。前節から続く因果関係を、現代日本語で明確かつ荘重に表す。
- source_word: ἦλθεν
  choice: 来た
  rationale: アオリスト直説法。終末的な日が到来し、その結果が現に迫っていることを簡潔に表す。
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: 大いなる日
  rationale: 定冠詞を伴う形容詞の限定用法を自然な日本語にしつつ、終末論的な荘重さを保つ。
- source_word: τῆς ὀργῆς
  choice: 憤りの
  rationale: ὀργήがここで表す強い裁きの怒りを、日常的な「怒り」より荘重で聖書的文脈に適した「憤り」で表す。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: ギリシア語の複数形を保持し、前節の「御座に着いておられる方」と「子羊」の双方を受ける文法的・神学的緊張を解消しない。
- source_word: τίς
  choice: だれが
  rationale: 修辞疑問を導く疑問代名詞として明瞭で自然な訳。
- source_word: δύναται σταθῆναι
  choice: 立っていられるだろうか
  rationale: 単に直立することではなく、裁きの前で持ちこたえ存続できるかという含意を、過度に説明せず自然な日本語で示す。
theological_decisions:
- issue: 「憤り」の所有者を示す複数代名詞
  choice: 「彼らの憤り」として複数を保持する
  alternative: 神の単一の働きに同化して「その方の憤り」または「彼の憤り」とする
  rationale: SBLGNTはαὐτῶν（彼らの）と明記し、前節の御座に着く方と子羊を受ける。神と子羊の共同の裁きという表現上の緊張を、訳文で単数に調和させず保持する。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「大いなる日」「憤り」で黙示文学にふさわしい荘重さを保った。修辞疑問は「だれが立っていられるだろうか」とし、裁きの前で持ちこたえる含意を自然に表した。
