  source_fidelity: 主要な語句はよく原文に対応している。στολὴ λευκήを「白い長衣」、ἑκάστῳを「一人一人に」、σύνδουλοιを「仲間の奴隷たち」、ἀδελφοίを「兄弟たち」とする点は適切である。πληρωθῶσινについて「数」を本文に補わず「満たされる」とすることも、原文の表現の幅を保っている。ただし、μέλλοντες ἀποκτέννεσθαιの「殺されることになっている」は、日本語では予定・定めを含意しやすく、μέλλωの切迫した将来性をやや弱める。
  naturalness: 「なおしばらく休んでいるように」は現代日本語としてやや不自然である。「もうしばらく休むように」とすれば、命じられた内容を自然に示し、ἔτι χρόνον μικρόνの「なお／もう少しの間」も明瞭になる。脚注記号は該当語句の直後に置くほうが、各注の係り先が明確になる。
