  to: そして、彼ら一人一人に白い長衣が与えられた。そして、彼らと同じようにこれから殺される仲間の奴隷たちと兄弟たち[b]が満たされる[a]まで、もうしばらく休むようにと告げられた。
  rationale: 原文の語順をそのまま再現する必要はないため、関係分詞句を日本語として自然な「彼らと同じようにこれから殺される…」にした。「これから殺される」はμέλλοντεςの将来性を保ちつつ、「ことになっている」が帯びうる予定・決定の含意を避ける。「もうしばらく休むように」は、告げられた内容を明瞭な現代標準語で表す。本文はπληρωθῶσινの曖昧さを維持し、脚注は各対象語に直接アンカーした。
