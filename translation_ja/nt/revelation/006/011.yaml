id: REV.6.11
reference: Revelation 6:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: ja
  text: そして、彼ら一人一人に白い長衣が与えられた。そして、彼らと同じようにこれから殺される仲間の奴隷たちと兄弟たち[b]が満たされる[a]まで、もうしばらく休むようにと告げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「満たされる」は、「全員がそろう」または「その数が満ちる」とも訳せる。ギリシア語は単に「満たされる／完成される」と述べており、「数」という語は明記していない。
    reason: alternative_reading
  - marker: b
    text: 「兄弟たち」は、ここでは女性を含む信仰の仲間全体を指す可能性がある。ギリシア語は男性複数形である。
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: 白い長衣
  rationale: στολήは丈の長い衣を指すため、「衣」より具体的で、現代日本語でも自然な「長衣」とした。λευκήはそのまま「白い」とした。
- source_word: ἑκάστῳ
  choice: 彼ら一人一人に
  rationale: 単数与格の配分的な意味を、日本語で明確かつ自然に表した。
- source_word: ἐρρέθη αὐτοῖς
  choice: 告げられた
  rationale: 非人称的な受動表現を保ちながら、「彼らは言われた」という不自然さを避けた。
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: なおしばらく休んでいる
  rationale: ἀναπαύωの「休む」という意味と、ἔτι χρόνον μικρόνの継続的な時間表現を自然な日本語にした。
- source_word: πληρωθῶσιν
  choice: 満たされる
  rationale: 「数」が原文に明記されていないため補わず、πληρόωの受動形が持つ「満たされる／完成する」という幅をできるだけ保った。
- source_word: σύνδουλοι
  choice: 仲間の奴隷たち
  rationale: 同じ主人に属する者という σύνδουλος の関係性と、δοῦλος の隷属的な語感を保持した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 原文の男性複数形を保持した。ただし信仰共同体の女性を含み得ることを脚注で示した。
- source_word: μέλλοντες ἀποκτέννεσθαι
  choice: 殺されることになっている
  rationale: μέλλωの将来的・予期的な意味を表しつつ、「運命づけられた」といった原文以上に強い決定論的含意を避けた。
- source_word: ὡς καὶ αὐτοί
  choice: 彼らと同じように
  rationale: 祭壇の下にいた者たちと同様に殺されることを、簡潔で自然な日本語で示した。
theological_decisions:
- issue: 殉教者の仲間を主語とする πληρωθῶσιν の意味
  choice: 「満たされる」と一般的に訳す
  alternative: 「その数が満ちる」「全員がそろう」「完成される」
  rationale: 文脈上は人数が満ちることを指す可能性が高いが、ギリシア語本文に「数」はない。終末論的な図式を訳文で確定せず、原文の曖昧さを残した。
- issue: ἀδελφοί が男女を含む共同体を指し得ること
  choice: 本文は「兄弟たち」、包含的用法は脚注
  alternative: 「兄弟姉妹たち」「信仰の仲間たち」
  rationale: 原文の男性複数形を反映しながら、初期キリスト教用法では女性を含む信徒全般を指し得ることも読者に知らせる。
- issue: σύνδουλοι の隷属表現
  choice: 「仲間の奴隷たち」
  alternative: 「仲間の僕たち」「同じ主人に仕える者たち」
  rationale: 神への所属を表す主人―奴隷の比喩を弱めず、歴史的・社会的な隷属の語感を保持した。
translation_notes:
  register: 明瞭で品位ある現代標準語。黙示録の厳粛な調子を保ちつつ、過度な文語表現は避けた。「奴隷」は意図的に強い語感を残し、「満たされる」には原文の意味上の余白を保持した。
