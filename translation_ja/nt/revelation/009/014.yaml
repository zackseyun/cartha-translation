id: REV.9.14
reference: Revelation 9:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀λέγοντα τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα· Λῦσον τοὺς τέσσαρας ἀγγέλους τοὺς δεδεμένους ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/014.yaml
  text: saying to the sixth angel[a], the one who had the trumpet, “Release the four angels who are bound at the great river Euphrates.”
translation:
  language: ja
  text: ラッパを持つ第六の御使いに、こう言った。「大河ユーフラテスのほとりに拘束されている四人の御使いを解き放て。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντα
  choice: こう言った
  rationale: 前節の「声」を受ける分詞であり、日本語では主文として表すことで自然な物語の流れを保った。「こう」は後続する発言を明示する。
- source_word: τῷ ἕκτῳ ἀγγέλῳ, ὁ ἔχων τὴν σάλπιγγα
  choice: ラッパを持つ第六の御使いに
  rationale: 冠詞付き分詞句が第六の御使いを説明しているため、自然な連体修飾として訳した。ἔχων はこの場面での所持を表す「持つ」とした。
- source_word: Λῦσον
  choice: 解き放て
  rationale: 束縛を解いて自由にする命令を、明瞭で力のある現代日本語で表した。
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: 四人の御使い
  rationale: 人として数えられる存在を示す日本語の助数詞を用い、原文どおり四者であることを明示した。
- source_word: τοὺς δεδεμένους
  choice: つながれている
  rationale: 完了受動分詞が示す、以前に拘束され、その状態が続いていることを自然な日本語で保持した。
- source_word: ἐπὶ τῷ ποταμῷ τῷ μεγάλῳ Εὐφράτῃ
  choice: 大河ユーフラテスのほとりに
  rationale: ἐπί＋与格の場所的用法を「ほとりに」とし、川そのものの上ではなく川辺・流域との位置関係を自然に表した。τῷ μεγάλῳ の強調も「大河」で保持した。
theological_decisions:
- issue: 四人の御使いの正体と道徳的立場
  choice: 単に「四人の御使い」とし、善悪や堕落の有無を付加しない。
  alternative: 「四人の堕落した御使い」または「裁きのために定められた四人の御使い」
  rationale: 本文は彼らが拘束されていることだけを述べ、その性質を明示していないため、解釈上の緊張を残した。
translation_notes:
  register: 明瞭で格調を保つ現代標準日本語。「天使」ではなく黙示録の聖書的文体になじむ「御使い」を用いた。引用命令は簡潔で厳かな調子とした。
