id: REV.9.9
reference: Revelation 9:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: ja
  text: 彼らは、鉄の胸当てのような胸当てを着けていた。その翼の音は、多くの馬の引く戦車が戦いへと疾走する音のようであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「戦いへと走る多くの馬の戦車の音」。原文の「走る」は、文法上は「戦車」にも「馬」にもかかり得る。
    reason: 原文の属格連鎖および属格複数の分詞がどの名詞に係るかについての文法上の幅を示すため。
lexical_decisions:
- source_word: θώρακας
  choice: 胸当て
  rationale: 胸部から胴を守る防具を指すため、現代日本語で具体的かつ簡潔な「胸当て」とした。
- source_word: ὡς θώρακας σιδηροῦς
  choice: 鉄の胸当てのような胸当て
  rationale: ὡςによる明示的な比喩と、原文にあるθώρακαςの反復を保った。
- source_word: φωνὴ
  choice: 音
  rationale: ここでは翼と戦車が発する聴覚的な響きを指すため、「声」ではなく「音」が自然である。
- source_word: πτερύγων
  choice: 翼
  rationale: πτέρυξの通常の意味をそのまま明瞭に表した。
- source_word: ἁρμάτων
  choice: 戦車
  rationale: 古代の馬に引かれる戦闘用車両を表す定訳。「馬に引かれた」と添えることで、現代の装甲車両との混同を避けた。
- source_word: ἵππων πολλῶν
  choice: 多くの馬に引かれた
  rationale: 「多くの馬」という原文の要素を明示しつつ、戦車との関係を自然な日本語で表した。ただし属格句の構造には幅があるため脚注を付した。
- source_word: τρεχόντων
  choice: 疾走する
  rationale: τρέχωの速い移動を、戦いへ向かう戦車の鮮烈な場面にふさわしい現代日本語で表した。「突撃する」ほど強い軍事的解釈は加えていない。
- source_word: εἰς πόλεμον
  choice: 戦いへと
  rationale: 移動の方向を示すεἰςと、文脈上の具体的な戦闘を自然に表した。
theological_decisions:
- issue: ヨハネの幻における描写の性質
  choice: 「ような」を用い、明示された幻視的な比喩としてそのまま訳す。
  alternative: いなごを文字どおりの軍事機械、悪霊、または特定の象徴的軍勢として訳文中で特定する。
  rationale: 原文はὡςによる比較を重ねている。黙示的イメージの指示対象について議論の余地があるため、訳文では解釈を一つに限定しない。
- issue: τρεχόντωνが描写する対象
  choice: 本文では戦車全体の疾走として自然に表し、語法上の幅を脚注で示す。
  alternative: 「走る多くの馬」として馬だけに直接結び付ける。
  rationale: τρεχόντωνは属格複数形で、形態上はἁρμάτωνにもἵππωνにも対応し得る。光景全体の動きを自然に訳しつつ、曖昧さを消さない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「戦車」には「馬に引かれた」を添え、古代のチャリオットであることを普通の読者にも分かるようにした。比喩を説明的に解釈せず、原文の反復と音響的な迫力を保った。
