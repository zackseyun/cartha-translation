id: REV.9.18
reference: Revelation 9:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: ja
  text: これら三つの災い、すなわち、彼らの口から出る火と煙と硫黄[b]によって、人類の三分の一[a]が殺された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人々の三分の一」とも訳せる。原語は男性だけでなく、人間一般を指す。
    reason: lexical_alternative
  - marker: b
    text: 「硫黄」は、伝統的な英語訳では「brimstone」と訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: これら三つの災いによって
  rationale: ἀπόはここでは空間的な起点ではなく、死をもたらした原因・手段を示す。「これら」によって直前の火、煙、硫黄を指し示す関係も保った。
- source_word: ἀπεκτάνθησαν
  choice: 殺された
  rationale: アオリスト受動態の意味を簡潔に保ち、行為者を本文以上に特定しない。
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: 人類の三分の一
  rationale: 部分を表す表現を「三分の一」とし、ἀνθρώπωνが男性だけでなく人間一般を指すことを「人類」で明確にした。
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: 火と煙と硫黄によって
  rationale: 三つの名詞を並列のまま保ち、ἐκがここで死の原因・手段を示すことを「によって」で自然に表した。
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: 彼らの口から出る
  rationale: 現在分詞の継続的で生々しい動きを、明快な現代日本語で表した。複数のστόματαに対応し、日本語では自然な総称単数の「口」を用いた。
theological_decisions:
- issue: 終末的な裁きの文脈におけるἀνθρώπωνの範囲
  choice: 人類
  alternative: 人々／人間
  rationale: 原語は男性に限定されず、人間一般を集合的に指す。「人類」は裁きの広い範囲と荘重さを保ちつつ、性別を限定しない。
- issue: 殺害の行為者
  choice: 受動形のまま「殺された」とする
  alternative: 神が殺した／災いが殺した
  rationale: ギリシア語本文は受動態で、直接の行為者を明示しないため、神学的な行為者を補わない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、黙示文学の荘重な調子を保った。二文目を説明的な文として独立させ、三つの災いと火・煙・硫黄の同格的な関係を明瞭にした。
