  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: ja
  text: 第一の災いは過ぎ去った[a]。見よ、この後、なお二つの災いが来る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「その一つの災い」。文脈上、三つの災いのうち第一のものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: 災い
  rationale: 終末的な裁きと迫る惨禍を告げる定型的な語として、日本語で自然かつ荘重な「災い」を用いた。単なる出来事としての「災害」よりも、宣告としての響きを保つ。
- source_word: ἡ μία
  choice: 第一の
  rationale: 字義的には「一つの」だが、文脈では三つの災いのうち最初のものを指すため、序列を明確にする「第一の」とした。
- source_word: ἀπῆλθεν
  choice: 過ぎ去った
  rationale: 空間的な移動よりも、第一の災いが終わったという完了した推移を自然に表す。
- source_word: ἰδού
  choice: 見よ
  rationale: 後続の内容へ強く注意を向ける預言的な談話標識として、黙示文学の格調を保ちながら理解しやすい表現を選んだ。
- source_word: ἔρχεται
  choice: やって来る
  rationale: 二つの災いが今後到来するという生き生きとした現在形の迫真性を表す。ギリシア語では複数主語に単数動詞が用いられているが、日本語では数による一致を示す必要はない。
- source_word: ἔτι
  choice: なお
  rationale: 第一の災いが終わっても、さらに二つが残っていることを簡潔かつ自然に示す。
- source_word: μετὰ ταῦτα
  choice: これらのことの後に
  rationale: 複数指示詞を保ち、黙示録に繰り返される時間的・順序的な表現を明示した。
theological_decisions:
- issue: 三つの災いの黙示的な順序
  choice: 最初に告げられた災いの完了と、続く二つの災いの到来を明示する。
  alternative: 「災い」を一般的な「裁き」や「災害」と言い換え、反復される宣告の形式を弱める。
  rationale: 原文は三つの災いを数えられた連続として強調している。「災い」と「第一の」を保つことで、追加の解釈を持ち込まず、裁きが段階的に展開する文学的・神学的構造を保持する。
translation_notes:
  register: 現代標準日本語を用い、「見よ」「災い」で黙示文学にふさわしい荘重さを保った。「これらのことの後に」は原文の複数形と順序表現を透明に伝える。
