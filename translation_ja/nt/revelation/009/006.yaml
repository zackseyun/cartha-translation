id: REV.9.6
reference: Revelation 9:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: ja
  text: その日々には、人々は死を求めるが、決して見いだせず、死ぬことを切望する。しかし、死は彼らから逃げ去る。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: その日々には
  rationale: 指示的な時間表現を保ち、直前に描かれた災いの期間を指すことが分かるようにした。
- source_word: οἱ ἄνθρωποι
  choice: 人々
  rationale: ここでは男性だけでなく、人間一般を指す総称的用法であるため、現代日本語で自然かつ正確な「人々」とした。
- source_word: ζητήσουσιν τὸν θάνατον
  choice: 死を求める
  rationale: ζητέω の意図的に探し求める意味と、黙示文学的な厳粛さを簡潔に保った。
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: 決して見いだせず
  rationale: οὐ μή と未来形による強い否定を「決して」で表し、目的語が先行する「死」であることを自然に受けた。
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: 死ぬことを切望する
  rationale: ἐπιθυμέω の強い願望を「切望する」で表した。
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: 死は彼らから逃げ去る
  rationale: 現在形の生き生きとした描写と、死を行為主体とする擬人化を保持した。
theological_decisions:
- issue: 黙示的審判における死の擬人化
  choice: 「死は彼らから逃げ去る」と、死を主語とする比喩をそのまま残す。
  alternative: 「彼らは死ぬことができない」と説明的に訳す。
  rationale: ギリシア語は「死」を φεύγει の明示的な主語としており、単なる不能の説明ではなく擬人化された緊張感を表しているため。
- issue: οἱ ἄνθρωποι の指示範囲
  choice: 「人々」と訳し、人間一般を指すものとする。
  alternative: 「男たち」と訳す。
  rationale: ἄνθρωποι は文法上男性複数形だが、この文脈では性別を限定せず、審判下にある人間一般を指す総称的用法である。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、黙示文学にふさわしい厳粛さを保った。「決して」で強い否定を示し、「死は彼らから逃げ去る」によって原文の擬人化と劇的な現在形を維持した。
