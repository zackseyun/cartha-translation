id: REV.9.17
reference: Revelation 9:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: ja
  text: また、私は幻の中で、馬とそれに乗っている者たちをこのように見た。乗り手たちは、火のような色、ヒヤシンス色、硫黄のような色の胸当てを着けていた[a]。馬たちの頭は獅子の頭のようで、その口からは火と煙と硫黄が出てくる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「火のような、ヒヤシンス色の、硫黄のような胸当て」。三つの形容詞は色彩的な外観を表すと考えられるが、火や硫黄そのものの性質や外観も連想させる。
    reason: 原文の色彩語が持つ意味の幅と比喩的な響きを示すため。
lexical_decisions:
- source_word: οὕτως
  choice: 次のように
  rationale: 幻の中で見た姿や様子を導入する語として、指示的な意味を保ちながら自然な現代日本語にした。
- source_word: ἐν τῇ ὁράσει
  choice: 幻の中で
  rationale: 黙示文学における超自然的な幻視を指すため、単なる「見た目」ではなく「幻」と訳した。
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: それに乗っている者たち
  rationale: 分詞句の構造を残しつつ、日本語として自然に馬上の者を表した。
- source_word: θώρακας
  choice: 胸当て
  rationale: 胸部を守る具体的な防具という像を明確に保つ語を選んだ。
- source_word: πυρίνους
  choice: 火のような色
  rationale: 「火のような、火でできた、火の色をした」という幅を持つ語であり、ここでは並列された視覚的描写として訳しつつ、単に「赤」と限定しなかった。
- source_word: ὑακινθίνους
  choice: ヒヤシンス色
  rationale: 古代のヒュアキントスに結びつく色彩語である。具体的な青や青紫に限定せず、原語の比喩的な色名を保った。
- source_word: θειώδεις
  choice: 硫黄のような色
  rationale: 硫黄との類似を表す形容詞であり、黄色だけに意味を限定せず、三つの胸当ての視覚的描写として自然に表した。
- source_word: ὡς κεφαλαὶ λεόντων
  choice: 獅子の頭のよう
  rationale: 比較をそのまま保ち、荘重な幻の描写に合う「獅子」を用いた。
- source_word: ἐκπορεύεται
  choice: 出て来る
  rationale: 歴史的現在の臨場感を保つため現在形とし、口から外へ現れる動きを自然な日本語で表した。
- source_word: θεῖον
  choice: 硫黄
  rationale: 現代日本語で物質を明確に指す標準的な語を選び、古風または宗教的な別称を避けた。
theological_decisions:
- issue: 胸当てを形容する三つの語が、色だけを指すか、火・ヒュアキントス・硫黄そのものの性質や外観も含むか
  choice: 「火のような色、ヒヤシンス色、硫黄のような色」とし、視覚的な色彩描写を示しながら比喩の由来を残す
  alternative: 「火のような赤、濃い青、硫黄のような黄」として色を具体化する、または「火のようで、ヒヤシンスのようで、硫黄のような」とより形式的に訳す
  rationale: 三形容詞は幻の中の胸当ての外観を描くが、原文は赤・青・黄という色名を明記していない。そこで色彩的な文脈は伝えつつ、原文以上に色調を固定しないようにした。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、黙示文学の荘重さを保つため「獅子」を採用した。長いギリシア語文は日本語の可読性のため三文に分けたが、描写の順序と接続関係は維持した。
