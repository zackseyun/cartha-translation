id: REV.9.7
reference: Revelation 9:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ τὰ ὁμοιώματα τῶν ἀκρίδων ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν ὡς στέφανοι ⸂ὅμοιοι χρυσῷ⸃, καὶ τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/007.yaml
  text: And the appearance of the locusts was like horses prepared for battle[a], and on their heads were what seemed to be crowns like gold, and their faces were like human faces[b],
translation:
  language: ja
  text: いなごの姿は、戦いに備えた馬に似ていた。その頭には、金に似た冠[a]のようなものがあり、その顔は人間の顔[b]のようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「冠」は「勝利の冠」または「花冠」とも訳せる。ギリシア語のστέφανοςは、栄誉や勝利に結びつく冠を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では直訳すると「人々の顔」。ここでの表現は人間一般を指し、男性だけを意味するものではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ὁμοιώματα τῶν ἀκρίδων
  choice: いなごの姿
  rationale: ὁμοίωμαは形、外観、似姿を表す。ここでは幻の中で見える全体的な姿を自然な日本語で示し、実体そのものだと断定しない「姿」とした。
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: 戦いに備えた馬に似ていた
  rationale: ὅμοιαによる比較と、完了受動分詞ἡτοιμασμένοιςが示す準備の整った状態を保持した。「戦争」よりも、この軍事的な情景では「戦い」が自然である。
- source_word: ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: その頭には
  rationale: 頭上にあるという空間関係を簡潔に表した。複数のいなごを集合的に描く日本語として「その頭」とした。
- source_word: ὡς στέφανοι ὅμοιοι χρυσῷ
  choice: 金に似た冠のようなもの
  rationale: ὡςとὅμοιοιの二重の比較を保ち、実際の金製の冠だとは断定しない。「冠のようなもの」により幻視上の見え方を示した。
- source_word: στέφανοι
  choice: 冠
  rationale: στέφανοςは冠または花冠・勝利の冠を指し得る。本文では理解しやすい一般語「冠」を用い、より限定的な含意は脚注に残した。
- source_word: τὰ πρόσωπα αὐτῶν ὡς πρόσωπα ἀνθρώπων
  choice: その顔は人間の顔のようであった
  rationale: πρόσωπαを具体的な「顔」とし、ἀνθρώπωνは男性に限定されない総称なので「人間」と訳した。ὡςの比較も明示した。
theological_decisions:
- issue: 黙示的幻における比喩表現
  choice: 「似ていた」「のようなもの」「のようであった」と比較表現を繰り返して保つ
  alternative: 比較を弱め、「金の冠をかぶり、人間の顔をしていた」などと実体的に描写する
  rationale: 原文はὅμοια、ὡς、ὅμοιοι、ὡςを重ねており、見えたものの類似性を述べている。幻の像が文字どおり何であったかを翻訳で決めず、原文の曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。黙示文学の視覚的な描写を自然に読めるよう二文に分けつつ、原文に反復される比較と、実体を断定しない語調を保持した。
