  text: καὶ ὁ ἀριθμὸς τῶν στρατευμάτων τοῦ ⸀ἱππικοῦ ⸀δισμυριάδες μυριάδων· ἤκουσα τὸν ἀριθμὸν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/016.yaml
  text: And the number of the troops of the cavalry was two hundred million; I heard their number.
translation:
  language: ja
  text: 騎兵部隊の数は二億[a]であった。私はその数を聞いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では直訳すると「二万（ミリアド）の万（ミリアド）」であり、二億を意味する。
    reason: 原文の特異な数の表現を正確に示すため。
lexical_decisions:
- source_word: ἀριθμὸς
  choice: 数
  rationale: 「数、総数」を表す標準的な語義。後半でも同じ語を用い、ギリシア語の反復を保った。
- source_word: στρατευμάτων
  choice: 部隊
  rationale: 軍隊または軍事部隊を意味する複数形。ἱππικοῦとの組み合わせを現代日本語で自然に「騎兵部隊」とした。
- source_word: ἱππικοῦ
  choice: 騎兵
  rationale: 個々の騎手よりも集合的な騎兵戦力を指すため、「騎兵」が簡潔で正確である。
- source_word: δισμυριάδες μυριάδων
  choice: 二億
  rationale: 字義的には「二つの万の、万倍」で、計算上二億となる。本文では明瞭な現代的数表記を用い、原文の表現は脚注に残した。
- source_word: ἤκουσα
  choice: 聞いた
  rationale: 単純過去の物語表現として自然で直接的である。
- source_word: αὐτῶν
  choice: その
  rationale: 騎兵部隊を受ける属格代名詞。日本語では「その数」とするのが自然で、前半の「数」との反復も保てる。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「軍勢」も可能だが、στρατευμάτωνの複数性と騎兵という軍事的まとまりを自然に示すため「騎兵部隊」とした。
