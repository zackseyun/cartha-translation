id: REV.9.10
reference: Revelation 9:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: ja
  text: また、彼らにはサソリに似た尾があり、針もある。そして、その尾には、人々を五か月の間害する力がある。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς
  choice: 尾
  rationale: 幻の生物の身体的特徴を表す直接的な語として訳した。日本語では数を明示しなくても複数主体それぞれの尾を自然に表せる。
- source_word: ὁμοίας σκορπίοις
  choice: サソリに似た
  rationale: ὅμοιος＋与格の類似表現を簡潔に保ち、尾がサソリそのものに似るという原文の表現上の曖昧さを過度に限定しない。
- source_word: κέντρα
  choice: 針
  rationale: κέντρονは刺す尖端や毒針を指し得る。サソリの比喩に即し、現代日本語で自然な「針」とした。
- source_word: ἐξουσία
  choice: 力
  rationale: 権威・権限の含意もあり得るが、ここではἀδικῆσαιを伴い、実際に害を加える能力が前景化されているため「力」とした。
- source_word: ἀδικῆσαι
  choice: 害する
  rationale: 黙示的災害の文脈では、抽象的な不正よりも人に損害・苦痛を加える意味であるため。
- source_word: τοὺς ἀνθρώπους
  choice: 人々
  rationale: ἄνθρωποιはここで性別を限定せず、人間一般を指す。現代日本語で自然かつ正確な総称として訳した。
- source_word: μῆνας πέντε
  choice: 五か月の間
  rationale: 期間を示す対格を、日本語で時間的継続が明確になる形にした。
theological_decisions:
- issue: 黙示的災害の描写におけるἐξουσίαの意味
  choice: 「力」
  alternative: 「権限」
  rationale: この箇所では尾によって人々を害し得る実効的能力が中心である。「力」は、その力が許可・付与された可能性を否定せず、法的権限に限定することもない。
- issue: τοὺς ἀνθρώπουςの対象範囲
  choice: 「人々」
  alternative: 「人間たち」
  rationale: 文法上は男性複数形だが、ここでは男女を含む人間一般を指すため、現代日本語の総称表現を用いた。
- issue: ὁμοίας σκορπίοιςが修飾する類似の捉え方
  choice: 「サソリに似た尾」
  alternative: 「サソリの尾のような尾」
  rationale: 原文は「尾がサソリに似ている」と表現し、類似点を明示していない。解剖学的に尾同士の類似へ限定せず、その緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「また」でκαίの叙述的連続を示し、原文の反復構造を大きく崩さず自然な一文に整えた。
