id: REV.9.3
reference: Revelation 9:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: ja
  text: そして、その煙の中からいなごが地上へ出て来た。そして、地上のさそりが持つのと同じ権限[a]が、いなごに与えられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「力」。ギリシア語は、権限、権利、力を意味し得る。ここでは、それが受動形で与えられるとされているため、「権限」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: その煙の中から
  rationale: ἐκが表す内部から外への動きを自然な日本語で示し、煙の中から出現する鮮明な描写を保った。
- source_word: ἐξῆλθον
  choice: 出て来た
  rationale: ἐξέρχομαιの移動の意味を明示し、語り手の視点に即した自然な表現とした。
- source_word: ἀκρίδες
  choice: いなご
  rationale: 聖書および黙示文学の文脈で通常指す、群生して害を及ぼすいなごを表す。
- source_word: εἰς τὴν γῆν
  choice: 地上へ
  rationale: εἰςの方向性を「へ」で示し、γῆはこの文脈では限定的な「土地」ではなく「地上」とした。
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: 権限が、いなごたちに与えられた
  rationale: ἐξουσίαを委ねられた許可・権能として「権限」と訳し、受動形を保つことで与え手を本文以上に明示しないようにした。
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: 持つような権限
  rationale: ὡςによる比較を自然に表しつつ、原文で反復されるἐξουσίαの概念を保った。
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: 地上のさそり
  rationale: τῆς γῆςを自然な連体修飾として訳し、煙から現れたいなごとの対比を保った。
theological_decisions:
- issue: いなごに与えられた能力の性質
  choice: ἐξουσίαを「権限」とし、「与えられた」という受動表現を維持する。
  alternative: 「力」と訳す、または与え手を神と明示する。
  rationale: 原文は単なる物理的能力だけでなく、付与された許可ないし権能を表し得る。受動形を保つことで、委ねられた性格を示しながら、与え手を原文以上に特定しない。
translation_notes:
  register: 明瞭で現代的ながら荘重さを保つ文体。「さそり」は一般読者に読みやすい平仮名表記とし、長い比較節は日本語として自然な語順に整えた。
