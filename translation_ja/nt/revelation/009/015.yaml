id: REV.9.15
reference: Revelation 9:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: ja
  text: そして、その時刻、その日、その月、その年のために用意されていた四人の天使が、人類の三分の一を殺すために解き放たれた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλύθησαν
  choice: 解き放たれ
  rationale: 前節でつながれていた天使たちが拘束から放たれることを表すアオリスト受動態。文脈と受動の意味を自然な現代日本語で伝える。
- source_word: ἄγγελοι
  choice: 天使
  rationale: 黙示録の文脈では人間の使者ではなく、超自然的存在を指す。一般読者にも明瞭な「天使」とした。
- source_word: ἡτοιμασμένοι
  choice: 備えて用意されていた
  rationale: 完了受動分詞が示す、前もって用意され、その状態にあったことを表す。「備えて」は後続する時の句との関係を自然に示す。
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: その時、その日、その月、その年に備えて
  rationale: 四つの時間単位を順序どおり残し、累積的な時間の限定を保った。εἰςを目的・指定された時に向けた備えとして訳しつつ、本文では計算可能な期間とは断定しない。
- source_word: ἵνα ἀποκτείνωσιν
  choice: 殺すために送り出された
  rationale: ἵναの目的を「ために」で明示する。「送り出された」は日本語の文を完結させる補足だが、解放が殺害という目的に向けられていることを示す。
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: 人類の三分の一
  rationale: 部分を表すτὸ τρίτονを「三分の一」とし、ἀνθρώπωνが男性だけでなく人間一般を指すことを「人類」で明確にした。
theological_decisions:
- issue: 「その時、その日、その月、その年」という時間句の指示と効力
  choice: 四つの時間単位をそのまま重ね、特定の時に向けて天使たちが用意されていたことを示す。
  alternative: 一年一か月一日一時間を合計した期間、または厳密な年代計算を伴わない神の主権的な時を指すと解することもある。
  rationale: ギリシア語は一つの冠詞のもとに時間単位を累積しており、定められた時の厳密さを示唆するが、黙示的年代計算の方式までは決定しない。
- issue: ἀνθρώπωνの範囲
  choice: 人類
  alternative: 人々、人間たち
  rationale: ここでは男性に限定されず、人間一般を集合的に指すため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「天使」「人類」を用いて一般読者に理解しやすくし、黙示文学の時間表現は具体的な計算へ限定せず、原文の緊張と曖昧さを保った。
