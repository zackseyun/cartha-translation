id: REV.9.13
reference: Revelation 9:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: ja
  text: 第六の天使がラッパを吹いた。すると私は、神の前にある金の祭壇の角々から発する一つの声[a]を聞いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ただ一つの声」。ギリシャ語は、その声が一つであったことを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: ラッパを吹いた
  rationale: σαλπίζωはラッパを鳴らすことを表す。黙示録の一連の場面に即し、日本語として自然になるよう目的語「ラッパ」を明示した。
- source_word: φωνὴν μίαν
  choice: 一つの声
  rationale: μίανによる単一性の強調を保ちつつ、その声の主が誰かを特定しない訳とした。
- source_word: ἐκ τῶν κεράτων
  choice: 角々から発する
  rationale: ἐκの起点・源の意味と、祭壇に複数ある角状の突起という祭儀的イメージを保った。「発する」は声がそこを源としていることを自然に示す。
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: 金の祭壇
  rationale: 定冠詞を伴う表現を、聖所の情景にふさわしい自然な現代日本語で訳した。
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: 神の前にある
  rationale: ἐνώπιονが示す、神の御前という位置関係を簡潔かつ形式的にも近く表した。
- source_word: ἄγγελος
  choice: 天使
  rationale: 黙示録の幻の文脈では、人間の使者ではなく天的存在を指すため。
theological_decisions:
- issue: 声の主の特定
  choice: 「一つの声」と中立的に訳し、声の主を特定しない。
  alternative: 神の声、天使の声、または祭壇に結びついた声と明示する。
  rationale: ギリシャ語本文は、ヨハネが金の祭壇の角々から「一つの声」を聞いたとのみ述べる。解釈によって曖昧さを解消せず、本文の緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「御使い」ではなく一般読者に自然な「天使」を用い、祭壇の複数の突起は「角々」として祭儀的イメージを保持した。脚注記号は説明対象である「一つの声」の直後に置いた。
