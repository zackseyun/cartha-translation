  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: ja
  text: また彼らは、自分たちの殺人、魔術[a]、性的な不道徳、盗みを悔い改めることがなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「魔術」と訳したギリシア語は、魔術的な行為のほか、薬や毒薬、またそれらを用いる行為を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν ἐκ
  choice: 悔い改めて背を向けることはなかった
  rationale: μετανοέωの道徳的・宗教的な意味を「悔い改める」で表し、続くἐκが示す罪から離れる方向性を「背を向ける」で明示した。
- source_word: φόνων
  choice: 殺人
  rationale: φόνοςの犯罪的・道徳的な重みを保つ、簡潔で自然な現代日本語。
- source_word: φαρμάκων
  choice: 魔術
  rationale: 黙示録の文脈では、薬物や調合物を用いることもあった魔術的行為を指す可能性が高い。語の広い意味範囲は脚注に残した。
- source_word: πορνείας
  choice: みだらな行い
  rationale: πορνείαが指す広い範囲の性的な不道徳を、古風すぎず一般読者にも理解しやすい表現で示した。
- source_word: κλεμμάτων
  choice: 盗み
  rationale: 盗む行為を指す複数形を、日本語の罪目の列挙として自然に表した。
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: にも、…にも、…にも
  rationale: 反復される否定的な並列を保ち、列挙されたどの罪についても悔い改めなかったことを明確にした。
- source_word: αὐτῶν
  choice: 自分たちの
  rationale: 各罪に反復される所有表現を、日本語では列挙全体を修飾する一度の表現にまとめ、意味を保ちながら不自然な反復を避けた。
theological_decisions:
- issue: 黙示録の悪徳表におけるφαρμάκωνの意味範囲
  choice: 魔術
  alternative: 薬の調合、毒薬、毒殺
  rationale: 黙示録における同語族の用法と終末論的な欺きの文脈から、中心的な意味を魔術的行為と判断した。ただし、薬や毒との語源的・語彙的な関連を排除せず脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「悔い改めて背を向ける」により、単なる後悔ではなく罪から離れる意味を示した。「淫行」のような教会語・文語を避け、「みだらな行い」とした。
