id: REV.9.1
reference: Revelation 9:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: ja
  text: そして、第五の天使がラッパを吹いた。すると私は、天から地に落ちた一つの星[a][b]を見た。その星に、底知れぬ淵の縦穴[c]の鍵が与えられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天から地に落ちている一つの星」。原文の完了形は、ヨハネが見た時には落下がすでに起こっていたことを示すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: この「星」は人格を持つ存在を象徴している可能性がある。続いて、その星に鍵が与えられたと記されている。
    reason: alternative_reading
  - marker: c
    text: 伝統的には「底知れぬ穴」など。「縦穴」は、底知れぬ淵そのものではなく、そこへ通じる開口部を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: ラッパを吹いた
  rationale: σαλπίζωが表すラッパを鳴らす行為を、現代日本語で自然かつ明瞭に表す。
- source_word: ἀστέρα
  choice: 一つの星
  rationale: 黙示的象徴を解釈して天使やサタンと置き換えず、原文の「星」という像を保つ。不定の対象として導入されることを「一つの」で自然に示す。
- source_word: πεπτωκότα
  choice: 落ちていた
  rationale: 完了分詞が、ヨハネが見た時点ですでに落下が起こり、その結果の状態にあったことを示すため。
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: 天から地へ
  rationale: 黙示録の宇宙的対照を保ち、単なる空ではなく「天」とする。「へ」は落下の方向を自然に表す。
- source_word: ἐδόθη αὐτῷ
  choice: その星に…与えられた
  rationale: 行為者を明示しない受動態を保ち、神が与えたと本文で補わない。日本語では指示語を用いて先行する星とのつながりを明瞭にする。
- source_word: ἡ κλεὶς
  choice: 鍵
  rationale: 定冠詞を機械的に「その」と重ねず、日本語として自然な形で特定の鍵を表す。
- source_word: φρέατος τῆς ἀβύσσου
  choice: 底知れぬ淵の縦穴
  rationale: φρέαρを、深淵そのものではなくそこへの垂直な開口部を表す「縦穴」とし、ἄβυσσοςは黙示的な深所の像を保つ「底知れぬ淵」と訳す。
theological_decisions:
- issue: 「星」を天使またはサタンと本文で特定するか
  choice: 本文では「星」のままにする
  alternative: 天使的存在、またはサタン的存在と明示する
  rationale: 鍵を与えられる描写から人格的存在を象徴する可能性は高いが、この節自体は正体を明示しないため、象徴と緊張を保つ。
- issue: 「与えられた」の行為者を神と明示するか
  choice: 行為者を明示しない受動態を保つ
  alternative: 「神がその星に鍵を与えた」とする
  rationale: 神的許可を含意し得るが、ギリシア語は与え手を名指ししていないため、本文の抑制を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、黙示文学にふさわしい荘重さを保った。「御使い」は聖書語として広く理解される表記を採用し、「底知れぬ淵」でἄβυσσοςの宇宙論的・黙示的な像を保持した。
