  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: ja
  text: また、女たちの髪のような髪があり、その歯は獅子の歯のようであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶχον
  choice: あった
  rationale: 未完了過去形は幻の姿を描写している。日本語では「持っていた」よりも、身体的特徴を自然に表す「毛があり」が明瞭である。
- source_word: τρίχας
  choice: 毛
  rationale: ギリシア語では複数形だが、日本語では集合的に「毛」とするのが自然である。異形の存在についての描写なので、頭部に限定しやすい「髪」ではなく「毛」とした。
- source_word: ὡς τρίχας γυναικῶν
  choice: 女の髪のような毛
  rationale: ὡςによる比喩をそのまま保つ。γυναικῶνは複数属格だが、現代日本語では総称的な「女の髪」が自然であり、比較対象が人間の女性の髪であることも明瞭である。
- source_word: οἱ ὀδόντες αὐτῶν
  choice: その歯
  rationale: 定冠詞付き名詞と属格代名詞を、直前の存在を受ける自然な日本語の指示表現「その歯」で表した。
- source_word: ὡς λεόντων
  choice: 獅子の歯のよう
  rationale: 原文では比較対象の名詞「歯」が省略されているが、日本語では補って「獅子の歯のよう」とすることで、歯そのものが獅子に似ているとの誤読を避けた。「獅子」は黙示文学の荘重な文体に適する。
- source_word: ἦσαν
  choice: であった
  rationale: 未完了過去形による描写を、簡潔で品位ある過去表現として訳した。
theological_decisions:
- issue: 黙示的幻における比喩的描写の性質
  choice: 女性の髪と獅子の歯という二つの直喩を、象徴の意味を説明せずそのまま残した。
  alternative: 象徴内容を推定し、魅惑、美、残忍さなどの解釈語を訳文に加える。
  rationale: 原文はὡςによる比較だけを提示し、その象徴的意味を明示していない。翻訳で特定の解釈に限定せず、原文の映像性と解釈上の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示文学の荘重さを保つため「獅子」「であった」を用いた。比喩は説明的に解釈せず、原文の簡潔な並行構造を維持した。
