    rationale: τρίχαςは文脈上、女性の髪に類する髪を指す。日本語の「毛」は体毛一般にも用いられるため、この黙示的イメージでは「髪」として明示するほうが語義と映像をより正確に保てる。
  - severity: low
    issue: 脚注が本文の「女」と原文の複数形との関係を必要以上に問題化している。
    rationale: ギリシア語複数形はこの種の一般的比較では日本語に逐語的に注記する必要がない。本文で「女たち」とすれば脚注なしで自然かつ十分に反映できる。
