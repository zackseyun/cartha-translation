  source_fidelity: 原文は、彼らが「女性たちの髪に似た髪」を持ち、その歯が「獅子たちの［歯］に似ていた」とする、二つの並行した視覚的比較である。現行訳は比較と過去の描写を保っているが、「女の髪のような毛」は日本語では頭髪以外の体毛をも想起させ得るため、τρίχας γυναικῶνの比較対象である頭髪を明示するほうが適切である。
  naturalness: 「女たちの髪のような髪」は反復を含むが、原文自体の反復的な比較を自然な範囲で反映し、異形の存在に頭髪状のものがあるという描写を明瞭にする。「また」「獅子」「であった」は明瞭な現代標準日本語の範囲内で、黙示文学の叙述にも適する。
  terminology: 「髪」は女性の頭髪との比較を正確に示す。「獅子の歯」は、ὡς λεόντωνで省略された比較対象の名詞を日本語として無理なく補っている。「女たち」はγυναικῶνの複数を反映するが、ここで個々の女性を特定する意味を加えるものではない。
  issues:
