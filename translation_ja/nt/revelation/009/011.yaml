id: REV.9.11
reference: Revelation 9:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: ja
  text: 彼らには、彼らを治める王、すなわち深淵の天使がいる[c]。その名は、ヘブライ語ではアバドン[a]、ギリシア語ではアポリュオン[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アバドン」は、ヘブライ語で「滅び」を表す語に由来する名。
    reason: lexical_alternative
  - marker: b
    text: 「アポリュオン」は、ギリシア語で「破壊者」を意味する名。
    reason: lexical_alternative
  - marker: c
    text: 別訳「底なしの淵」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: 彼らには、自分たちを治める王として……がいる
  rationale: 「彼らは自分たちの上に王を持つ」というギリシア語の構造を、日本語として自然に理解できる形にしつつ、彼らの上に立つ王という統治関係を明示した。
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: 底知れぬ所の御使い
  rationale: ἄγγελος は黙示録の文脈に従い「御使い」とした。ἄβυσσος は深さを測れない地下の領域を指すため、伝統的な「底なしの淵」より平明な「底知れぬ所」とした。
- source_word: Ἑβραϊστὶ Ἀβαδδών
  choice: ヘブライ語ではアバドン
  rationale: 言語を示す副詞を自然な日本語にし、固有名として音写した。語が持つ「滅び」の意味は注に残した。
- source_word: ἐν τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων
  choice: ギリシア語ではアポリュオンという
  rationale: 原文にあるヘブライ語名との対比を保ち、固有名を音写した。「滅ぼす者」という語義は注に示した。
theological_decisions:
- issue: Ἀβαδδών と Ἀπολλύωνを翻訳するか音写するか
  choice: 本文では「アバドン」「アポリュオン」と音写する
  alternative: 「滅び」「滅ぼす者」と訳す
  rationale: この節では御使いに付された固有名として機能しているため本文では音写し、名称の意味も重要なので脚注で補った。
- issue: ἀβύσσου の訳語
  choice: 底知れぬ所
  alternative: 底なしの淵／深淵
  rationale: 原語が表す測り知れない深い領域のイメージを保ちながら、現代の一般読者に明瞭な表現を選んだ。伝統的な別訳は脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、黙示文学にふさわしい荘重さを保った。「王としている」は主体的に王と認定する含みが出やすいため避け、統治関係を「自分たちを治める王として……がいる」と表した。
