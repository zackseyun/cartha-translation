id: REV.9.19
reference: Revelation 9:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: ja
  text: 馬たちの力は、その口と尾にある。というのも、その尾は蛇に似ており、頭があって、それによって害を加えるからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: 力
  rationale: この黙示的な描写では、委任された権限よりも、馬たちが実際に害を及ぼす能力を指すため、「力」とした。
- source_word: στόματι
  choice: 口
  rationale: ギリシア語の単数形を保ちつつ、日本語では複数の主体に対する分配的な「その口」として自然に理解できる。
- source_word: οὐραῖς
  choice: 尾
  rationale: οὐράの標準的な訳。日本語では集合的・分配的に単数形「尾」を用いるのが自然である。
- source_word: ὅμοιαι ὄφεσιν
  choice: 蛇に似ていて
  rationale: ὄφιςの像を現代日本語で明瞭かつ格調を損なわずに表す。「蛇のようで」も可能だが、ὅμοιαιの意味を明確にした。
- source_word: ἔχουσαι κεφαλάς
  choice: 頭があり
  rationale: 尾に頭があるという異様な幻の描写を、解釈を加えずそのまま保持した。
- source_word: ἀδικοῦσιν
  choice: 害を加える
  rationale: ここでは抽象的な不正ではなく、傷害・損害をもたらす意味なので、文脈に即して「害を加える」とした。
- source_word: ἐν αὐταῖς
  choice: それによって
  rationale: ἐνを手段の意味に取り、尾、あるいは頭を備えた尾によって害を加えることを自然な日本語で示す。指示対象の範囲は過度に限定しない。
- source_word: γὰρ
  choice: のである
  rationale: 二つのγάρはいずれも説明を導く。日本語では冒頭の接続詞を省き、末尾の説明調「のである」によって前後関係を自然に表した。
theological_decisions:
- issue: 馬の尾と頭の黙示的イメージ
  choice: 象徴の意味を特定せず、幻の描写を直接訳す
  alternative: 尾を偽りの教えや悪霊的な働きなどと解釈して訳文に織り込む
  rationale: 原文は象徴の解釈をこの節で明示していないため、翻訳ではその神学的緊張と視覚的イメージを保つ。
- issue: ἐν αὐταῖςの指示対象
  choice: 「それによって」とし、直前の頭を含む尾の構造を害の手段として示す
  alternative: 「その頭によって」または「その尾によって」と対象を一方に限定する
  rationale: 女性複数形は文法上「尾」を受けうる一方、直前の「頭」とイメージ上密接に結びつく。原文以上に対象を狭めない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい簡潔で重みのある叙述調とした。原文の二重のγάρを逐語的に「なぜなら」と反復すると不自然になるため、説明関係を文末で表現した。
