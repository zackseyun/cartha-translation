id: REV.9.5
reference: Revelation 9:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: ja
  text: 彼らには、人々を殺すことは許されず、かえって五か月の間、人々を苦しめることが許された。その苦しみは、サソリが人を刺す[a]ときの苦しみのようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「打つ」。ここでは、サソリが尾の針で刺すことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: 彼らには…ことが許された
  rationale: 行為者を明示しない受動表現を保ちつつ、現代日本語として自然に、与えられた権限・許可を表す。神を明示して原文以上に限定しない。
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: 人々を殺すことはせず
  rationale: 代名詞の指示対象を日本語で分かりやすく「人々」とし、否定された行為を簡潔に示す。
- source_word: ἀλλ’ ἵνα βασανισθήσονται
  choice: 五か月の間苦しめること
  rationale: 異例のἵνα＋未来受動が示す目的・結果を日本語で自然に表し、苦しみを受ける側を文脈から理解できる形にした。
- source_word: βασανισθήσονται / βασανισμός
  choice: 苦しめる／苦しみ
  rationale: 同語根の反復を日本語でも保つ。「拷問」は司法的・意図的な含みが強すぎるため避けた。
- source_word: μῆνας πέντε
  choice: 五か月の間
  rationale: 期間を表す対格を自然な日本語で明示する。
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: その苦しみ
  rationale: 彼らがもたらす苦しみを指す文脈上の関係を表しつつ、所有・主体の関係を過度に説明しない。
- source_word: ὡς βασανισμὸς σκορπίου
  choice: サソリが…ときの苦しみのよう
  rationale: 比較と「苦しみ」の語の反復を保ちながら、日本語として自然な構文にした。
- source_word: ὅταν παίσῃ
  choice: 刺す
  rationale: παίωの基本義は「打つ」だが、サソリを主語とするこの文脈では、尾の針で刺すことを指す自然で明確な訳語を採用した。字義的な別訳は脚注に示す。
- source_word: ἄνθρωπον
  choice: 人
  rationale: ここでは性別を限定しない一般的・代表的用法であり、現代日本語の「人」が原義を自然に伝える。
theological_decisions:
- issue: 黙示的裁きにおける神的受動表現
  choice: 許可を与えた主体を明示しない
  alternative: 「神は彼らに…ことを許された」または「彼らに権威が与えられた」
  rationale: 原文は行為者を明示しない。神の主権を暗示しつつ媒介された裁きについて残る緊張と曖昧さを保つ。
- issue: αὐτούςの日本語表現
  choice: 人々
  alternative: 彼ら
  rationale: 日本語で「彼らには、彼らを」とすると二つの集団の区別が不明瞭になりやすいため、対象を「人々」とした。ただし対象の範囲は前後の文脈に委ねる。
- issue: ἄνθρωπονの一般的用法
  choice: 人
  alternative: 男／人間
  rationale: この単数形はサソリに刺される者を一般的に表しており、性別を限定する神学的意味を持たせない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の受動表現が行為者を明示しない点を尊重しつつ、日本語では「許された」として黙示文学の権限付与の意味を自然に表した。
