id: REV.9.20
reference: Revelation 9:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: ja
  text: 'これらの災害によって殺されなかった残りの人々は、それでも、自分たちの手の業から悔い改めて、悪霊と、金、銀、青銅、石、木でできた偶像、すなわち見ることも聞くことも歩くこともできないものを拝むのをやめることはなかった。[a]


    [a] 「悔い改めて……拝むのをやめる」と訳した箇所は、直訳すると「……を拝まないために、自分たちの手の業から悔い改める」となる。この節のギリシア語は、悔い改めの目的、またはその結果として偶像礼拝をしなくなることを表し得る。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悔い改めて……拝むのをやめる」と訳した箇所は、直訳すると「……を拝まないために、自分たちの手の業から悔い改める」となる。この節のギリシア語は、悔い改めの目的、またはその結果として偶像礼拝をしなくなることを表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: 残りの人々
  rationale: ἀνθρώπωνは男性に限定されない人間一般を指す。「残りの人々」は、災害で殺された者たちとの対比と集合的な意味を自然な現代日本語で保つ。
- source_word: ἀπεκτάνθησαν
  choice: 殺されなかった
  rationale: ἀποκτείνωのアオリスト受動態を、明瞭で過度に古風でない日本語にした。
- source_word: πληγαῖς
  choice: 災害
  rationale: 黙示録の文脈では神の裁きとして下る災厄を指す。「疫病」だけに限定されない語として「災害」を選んだ。
- source_word: οὐδὲ μετενόησαν
  choice: 悔い改めて……やめることはなかった
  rationale: οὐδέの継続・強調の力を、前文脈を受ける「も」と文末の否定によって表した。μετανοέωは宗教的・倫理的転回を表す標準的な「悔い改める」とした。
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: 自分たちの手の業から
  rationale: ἐκの離脱の意味と「手の業」という聖書的な具体像を保持した。文脈上は特に、自ら造って礼拝した偶像を含む。
- source_word: ἵνα μὴ προσκυνήσουσιν
  choice: ……を拝むのをやめる
  rationale: 悔い改めによって礼拝しなくなるという目的・結果の関係を自然な日本語で示した。構文の幅は脚注で明示した。
- source_word: τὰ δαιμόνια
  choice: 悪霊ども
  rationale: 新約聖書で敵対的な霊的存在を指すため「悪霊」とし、複数性を「ども」で示した。
- source_word: τὰ εἴδωλα
  choice: 偶像
  rationale: 中立的な像ではなく礼拝対象となる像を指すため、宗教的意味が明確な「偶像」とした。
- source_word: τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: 金、銀、青銅、石、木でできた
  rationale: 偶像の材質を列挙する累積的な表現を保ちつつ、日本語として自然につないだ。
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: 見ることも聞くことも歩くこともできないもの
  rationale: 偶像の無力さをあざける三つの動作を省略せず、περιπατεῖνも字義どおり「歩く」とした。
theological_decisions:
- issue: 悔い改めと偶像礼拝の停止との関係
  choice: 「悔い改めて……拝むのをやめることはなかった」とし、両者の密接な目的・結果関係を示す
  alternative: 「……を拝まないために悔い改めなかった」
  rationale: ἵνα μή節は目的または意図された結果を表し得る。本文では自然な日本語を優先しながら、悔い改めが偶像礼拝からの転回を伴うという関係を保ち、どちらか一方に限定しないよう脚注を付した。
- issue: 「手の業」の範囲
  choice: 比喩を保って「自分たちの手の業」とする
  alternative: 「自分たちが造った偶像」
  rationale: 直後の偶像が中心的な指示対象だが、「業」は行為や制作物をより広く含み得る。本文で偶像だけに限定しないことで原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「手の業」「悔い改める」など本文の神学的・修辞的連関を担う表現は保持した。偶像の材質と三重の不能表現は、原文の列挙と嘲弄的な力を生かすため省略していない。
