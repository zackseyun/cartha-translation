id: REV.9.2
reference: Revelation 9:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: ja
  text: 彼は底知れぬ深みの縦穴[a]を開いた。すると、その縦穴から、大きな炉の煙のような煙が立ち上った。その縦穴から出た煙によって、太陽も空気も暗くなった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「底知れぬ深みの穴」。伝統的には「底なしの穴」。
    reason: φρέαρ（縦穴・穴）とἄβυσσος（底知れぬ深み）の関係、および伝統的訳語を示すため。
lexical_decisions:
- source_word: ἤνοιξεν
  choice: 開くと
  rationale: アオリスト能動態の出来事を自然な日本語で示し、後続する煙の上昇との時間的なつながりを表した。「鍵を開けた」として手段を過度に限定しない。
- source_word: τὸ φρέαρ τῆς ἀβύσσου
  choice: 底知れぬ所への縦穴
  rationale: φρέαρを、ἄβυσσοςそのものではなく、そこへ通じる垂直の開口部として訳した。属格は文脈上の関係を自然に示す「への」とした。
- source_word: ἀβύσσου
  choice: 底知れぬ所
  rationale: 語の「深さが測れない所」という像を明瞭な現代日本語で表し、伝統的だが解釈を伴いうる固有表現に固定しない。
- source_word: ἀνέβη καπνὸς
  choice: 煙が立ち上った
  rationale: 上方への動きを保ちつつ、煙について自然な日本語表現とした。
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: 大きな炉の煙のような
  rationale: ὡςの直喩を保持し、κάμινοςを簡潔に「炉」と訳した。μεγάληςが炉を修飾する関係も保った。
- source_word: ἐσκοτώθη
  choice: 暗くなった
  rationale: 受動形が示す結果を自然な日本語で表した。原因は続く「煙によって」で明示されるため、受動的・原因的関係も保持される。
- source_word: ὁ ἥλιος καὶ ὁ ἀὴρ
  choice: 太陽も空気も
  rationale: 二つの主語を日本語らしく並列し、ἀήρを「空」ではなく大気を指す「空気」とした。
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: その穴から出た煙によって
  rationale: ἐκの原因・源泉の関係を明瞭にし、煙が穴から出たことと、その煙が暗くしたことの両方を自然に表した。
theological_decisions:
- issue: 黙示文学の場所を表すφρέαρとἄβυσσοςの区別
  choice: 「底知れぬ所への縦穴」とし、入口とその先の領域を区別した。
  alternative: 「底なしの穴」または「底知れぬ所の穴」
  rationale: φρέαρをἄβυσσοςそのものと同一視せず、そこへ通じる開口部としての像を保つため。「底なしの穴」は伝統的だが、二語の区別を曖昧にする可能性がある。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「縦穴」はやや具体的だが、深淵へ通じる開口部という黙示的な像と、φρέαρとἄβυσσοςの区別を保つ。反復されるφρέαρは、後半では日本語の自然さのため「その穴」とした。
