id: REV.9.4
reference: Revelation 9:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: ja
  text: そして、それらには、地の草も、どんな緑のものも、どんな木も損なってはならない。ただし、額に神の印を持たない人々だけには害を加えてよい、と告げられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: それらには…と告げられた
  rationale: 受動態と与格を保ち、語り手を明示せずに権威ある指示を自然な日本語で表した。αὐταῖςの指示対象は文脈上、いなごであるが、本文どおり女性複数代名詞に対応する「それら」とした。
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: 損なってはならず
  rationale: ἀδικέωの害する・傷つけるという意味を、この黙示的災害の文脈に即して表した。禁止の力を明確にしつつ、独立した命令文にはしなかった。
- source_word: τὸν χόρτον τῆς γῆς
  choice: 地の草
  rationale: χόρτοςを「草」、τῆς γῆςを「地の」とし、簡潔で聖書的な響きを保ちながら現代日本語として理解しやすくした。
- source_word: οὐδὲ πᾶν χλωρόν
  choice: どんな緑のものも
  rationale: 名詞化されたχλωρόνを特定の「植物」に狭めず、原文の広がりを保った。
- source_word: οὐδὲ πᾶν δένδρον
  choice: どんな木も
  rationale: δένδρονの通常の意味を、そのまま自然に訳した。
- source_word: εἰ μὴ τοὺς ἀνθρώπους
  choice: ただ…人々だけを
  rationale: εἰ μήが示す唯一の例外・許可対象を明瞭にし、ἄνθρωποιは性別を限定しない「人々」とした。
- source_word: οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ
  choice: 神の印を持たない
  rationale: σφραγίςを黙示録における所有・保護の標識として「印」と訳し、関係節を簡潔に表した。
- source_word: ἐπὶ τῶν μετώπων
  choice: 額に
  rationale: 複数形は日本語では自然に単数形の身体部位で表し、印の位置を明確にした。
theological_decisions:
- issue: 受動態の指示者
  choice: 告げた主体を明示しない
  alternative: 神が命じた、と明示する
  rationale: ἐρρέθηは受動態で、発話者を本文中に示していない。文脈上の究極的権威を推定して訳文へ加えない。
- issue: ἀνθρώπουςの範囲
  choice: 性別を限定しない「人々」
  alternative: 「男たち」
  rationale: ここでは植物と、神の印を持つか否かで区別される人間とが対照されており、男性だけに限定する根拠がない。
- issue: 害を加える対象の限定
  choice: 神の印を持たない人々だけが許された対象
  alternative: 単なる対比として弱く表す
  rationale: εἰ μήは先行する禁止に対する例外を示すため、「ただ…だけ」として限定を明確にした。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。原文の受動表現と主体の非明示を維持し、「緑のもの」によってχλωρόνの語義を不必要に狭めない。節末の「損なうように、と」はやや形式的だが、禁止対象と例外対象の統語関係を明確に保つ。
