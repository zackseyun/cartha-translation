id: REV.4.10
reference: Revelation 4:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: ja
  text: 二十四人の長老たちは、王座に座っておられる方の前にひれ伏し、永遠に生きておられる方[a]を礼拝する。そして、自分たちの冠[b]を王座の前に投げ出して、こう言う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「世々の世に至るまで生きておられる方」。
    reason: lexical_alternative
  - marker: b
    text: 「冠」と訳したギリシア語は、栄誉のしるしとして授けられる勝利の花冠を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: ひれ伏し
  rationale: 礼拝の文脈における身体的な動作と敬意を自然な日本語で表す。「倒れる」では偶発的な転倒に聞こえやすいため避けた。
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: 二十四人の長老たち
  rationale: πρεσβύτεροι の黙示録における標準的で理解しやすい訳語として「長老」を用い、人物を数える自然な助数詞「人」を補った。
- source_word: ἐνώπιον
  choice: 前に
  rationale: 二度の用例をともに簡潔に訳し、臨在と位置関係を保持した。
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: 王座に座っておられる方
  rationale: 冠詞付き分詞の描写的な呼称を保ちつつ、継続する着座の状態と敬意を自然な現代日本語で示した。θρόνος は統治権を表す文脈に即して「王座」とした。
- source_word: προσκυνήσουσιν
  choice: 礼拝する
  rationale: 神的存在に向けられた行為であるため、単なる敬礼ではなく宗教的献身を明確に表す「礼拝する」とした。直前の「ひれ伏し」が姿勢を表すため、意味の重複も避けられる。
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 永遠に生きておられる方
  rationale: 慣用句 εἰς τοὺς αἰῶνας τῶν αἰώνων の終わりのない持続を自然に表し、 substantival participle の描写的な呼称を保持した。字義的な形は脚注に示した。
- source_word: βαλοῦσιν
  choice: 投げ出して
  rationale: βάλλω の動作の鮮明さを保ちながら、ここでの厳粛な象徴行為にふさわしい表現とした。「置く」では原文の勢いが弱まる。
- source_word: τοὺς στεφάνους αὐτῶν
  choice: 自分たちの冠
  rationale: στέφανος を黙示的・王権的文脈で自然な「冠」とし、αὐτῶν が長老たち自身を指すことを明確にした。勝利や栄誉の花冠という語義的背景は脚注に残した。
- source_word: λέγοντες
  choice: こう言う
  rationale: 後続する発言を導入する分詞を、日本語で自然な引用導入にした。「こう」によって次節へ続く内容を明示する。
theological_decisions:
- issue: 王座に座る方、および永遠に生きる方の指示対象
  choice: 「王座に座っておられる方」「永遠に生きておられる方」という原文の描写的呼称を保つ。
  alternative: 訳文中で「父なる神」または「神」と明示する。
  rationale: 文脈上は神を指すことが強く示されるが、この節のギリシア語本文は固有の同定ではなく描写的な表現を用いている。訳文でもその余地を保ち、教理的な特定を付加しない。
translation_notes:
  register: 明瞭で格調のある現代標準語を用いた。「御座」より一般読者に意味が伝わりやすい「王座」を採用し、敬意は「おられる方」で表した。ギリシア語の未来形は、幻の中で反復的・継続的に展開する場面を述べる日本語として自然な非過去形「礼拝する」「言う」で表し、動作の連鎖は連用形で整えた。
