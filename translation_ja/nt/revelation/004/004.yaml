  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: ja
  text: また、御座の周りには二十四の王座があり、その王座には二十四人の長老たちが座っていた。彼らは白い衣をまとい、頭には金の冠[a]をかぶっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「勝利の冠」とも訳せる。ギリシア語は、王の冠だけでなく、勝利や栄誉のしるしとして授けられる冠を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: 周りには
  rationale: 中央の御座を取り囲む空間的配置を、自然な現代日本語で表す。
- source_word: θρόνοι
  choice: 座
  rationale: 中央の御座と同じ語であることを「座」によって保ちつつ、周囲の二十四の座を「王座」と過度に限定しない。中央のものには文脈上定着した敬称「御座」を用いる。
- source_word: εἴκοσι τέσσαρες
  choice: 二十四
  rationale: 数詞を標準的な漢数字表記で訳す。
- source_word: πρεσβυτέρους
  choice: 長老たち
  rationale: 黙示録に登場する集団の呼称として定着した訳語を用い、単に年齢の高い男性とは訳さない。
- source_word: καθημένους
  choice: 座っていた
  rationale: 分詞構文を日本語の叙述として自然な有限動詞にし、幻の中で見える姿勢・状態を示す。
- source_word: περιβεβλημένους ἐν ἱματίοις λευκοῖς
  choice: 白い衣をまとい
  rationale: 完了分詞が示す着衣状態を保ち、ἱμάτιαを特定の形状の「長い衣」などに限定しない。
- source_word: στεφάνους χρυσοῦς
  choice: 金の冠
  rationale: στέφανοςの基本的な視覚像を簡潔に表しつつ、勝利や栄誉の冠という語義の幅は脚注に残す。χρυσοῦςは自然な「金の」とする。
theological_decisions:
- issue: 周囲の二十四の θρόνοι の性質
  choice: 「二十四の座」と訳し、中央の「御座」との語彙的つながりを保つ。
  alternative: 「二十四の王座」または「二十四の席」
  rationale: 原文は中央と周囲に同じ θρόνος を用いる。「席」では王的・裁判的含意が弱まり得る一方、「王座」は周囲の者の主権を必要以上に確定しかねないため、「座」とした。
- issue: 二十四人の長老の正体
  choice: 説明を加えず「長老たち」とする。
  alternative: 教会の代表者、天使的存在、イスラエルと使徒の代表者などと解釈する。
  rationale: この節は彼らを πρεσβύτεροι と呼ぶだけで、その正体を明示していないため、解釈を本文に持ち込まない。
- issue: στέφανος の含意
  choice: 本文では「冠」とし、勝利または栄誉の冠という可能性を脚注で示す。
  alternative: 本文で「勝利の冠」または「花冠」と限定する。
  rationale: 語は王の冠だけでなく、勝利者や栄誉を受けた者に授けられる冠・冠飾りも指し得るため、曖昧さを保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。黙示録で神の御座を指す慣用に従い中央は「御座」、周囲は同じ原語とのつながりを残しつつ「座」とした。文を適度に分け、連続する分詞を自然な日本語の叙述に整えた。
