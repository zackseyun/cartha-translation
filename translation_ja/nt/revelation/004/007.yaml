id: REV.4.7
reference: Revelation 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: ja
  text: 第一の生き物は獅子のようであり、第二の生き物は子牛のようであり、第三の生き物は人のような顔[a]を持ち、第四の生き物は飛んでいる鷲のようであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人間の顔」とも訳せる。ギリシア語の直訳は「人のような顔」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: 生き物
  rationale: 神の御座を囲む存在を表すため、後に登場する敵対的な「獣」（θηρίον）と明確に区別しつつ、ζῷονの広い意味を自然に伝える。
- source_word: ὅμοιον
  choice: 〜のようである
  rationale: 同一であることではなく、外見上の類似を示す表現として訳した。
- source_word: λέοντι
  choice: 獅子
  rationale: 幻の荘厳な描写に合う、明瞭で格調ある訳語。
- source_word: μόσχῳ
  choice: 子牛
  rationale: μόσχοςは若い牛を指す語であり、性別や祭儀的意味を不必要に限定しない訳とした。
- source_word: ἔχων
  choice: 持ち
  rationale: 分詞の描写的な働きを、日本語の連用形によって自然に保った。
- source_word: τὸ πρόσωπον ὡς ἀνθρώπου
  choice: 人のような顔
  rationale: πρόσωπονを「顔」、ὡςによる比較を「〜のような」として明示した。ἀνθρώπουはここでは人間を一般的に指し、男性に限定しない。
- source_word: ἀετῷ πετομένῳ
  choice: 飛んでいる鷲
  rationale: 分詞πετομένῳが鷲を修飾し、飛翔中の姿を描くことを直接的で自然な日本語にした。
theological_decisions:
- issue: 第三の生き物の顔についてのἀνθρώπουの解釈
  choice: 人のような顔
  alternative: 人間の顔
  rationale: ἀνθρώπουは人間一般を指し得るため性別を限定せず、同時にὡςが示す比較を本文に残した。別訳は注で示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、御座の幻にふさわしい格調を保った。「獅子」「鷲」は日常語の「ライオン」「ワシ」よりも文脈に適した表記とした。並列構造を保ち、四つの生き物の描写を均衡よく示した。
