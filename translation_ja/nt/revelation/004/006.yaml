  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: ja
  text: また、御座の前には、ガラスの海のようなものがあり、水晶に似ていた[a]。御座のただ中と御座の周りに、前にも後ろにも目で満ちている四つの生き物がいた[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ガラス状の海のようなものがあった」。ギリシア語は比較を用い、「ガラスの海のようなもの」と描写し、それが「水晶に似ている」と続けている。
    reason: lexical_alternative
  - marker: b
    text: 「御座のただ中と御座の周り」という句が示す位置関係は理解しにくい。幻の視点を反映している可能性があるため、原文に近い表現を残した。
    reason: alternative_reading
  - marker: c
    text: 別訳「四つの生きた存在」。ここでのギリシア語は、黙示録の後の箇所に登場する敵対的な「獣」を意味する語ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνώπιον
  choice: 前には
  rationale: 御座との空間的な位置関係を、自然で簡潔な現代日本語で示す。
- source_word: ὡς θάλασσα ὑαλίνη
  choice: ガラスの海に似たもの
  rationale: ὡς が示す比較を明示し、海そのものとの断定を避けつつ、幻のイメージを保つ。
- source_word: ὁμοία κρυστάλλῳ
  choice: 水晶のような
  rationale: 水晶との類似を簡潔に表し、透明さや輝きを説明として付加しない。
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: 御座の中央と御座の周りには
  rationale: 理解しにくい空間表現を解消せず、原文の二重の位置描写をそのまま保つ。
- source_word: ζῷα
  choice: 生き物
  rationale: 命ある存在を表す中立的な語であり、後に登場する敵対的な「獣」との混同を避ける。
- source_word: γέμοντα ὀφθαλμῶν
  choice: 目が満ちている
  rationale: 「満ちている」という原文の表現を保ち、異様な幻の描写を平易に伝える。
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: 前にも後ろにも
  rationale: 生き物の前後を表す自然な日本語の対句とした。
theological_decisions:
- issue: 天上の御座の幻における ζῷα の訳語
  choice: 生き物
  alternative: 生きた存在／獣
  rationale: エゼキエル書を想起させる御座の周囲の存在を中立的に表し、黙示録後半の敵対的な「獣」という含意を持ち込まない。
- issue: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου の空間的緊張
  choice: 「御座の中央と御座の周り」として原文の難しさを保つ
  alternative: 「御座を中心に、その周り」など、一つの整合的な配置に解釈する
  rationale: 幻における視点または配置は明確でないため、翻訳で幾何学的に整理せず、原文の曖昧さを残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御座」は黙示録の王座・神の座を示す文脈上の用語として用いた。比較表現と理解しにくい空間描写は説明的に解消せず、本文と脚注で原文の緊張を保持した。
