id: REV.4.2
reference: Revelation 4:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀εὐθέως ἐγενόμην ἐν πνεύματι· καὶ ἰδοὺ θρόνος ἔκειτο ἐν τῷ οὐρανῷ, καὶ ἐπὶ τὸν θρόνον καθήμενος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/002.yaml
  text: Immediately I was in the Spirit[a], and behold, a throne stood in heaven, and one seated on the throne,
translation:
  language: ja
  text: 私はたちまち霊のうちにいた。[a] すると見よ、天に王座が据えられており、その王座には、座っている方がおられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「御霊のうちに」。ギリシア語には冠詞がなく、聖霊のうちにあることとも、霊的・幻視的な状態にあることとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: たちまち
  rationale: 出来事が直ちに展開したことを示す副詞。幻への急な移行を、自然で簡潔な現代日本語で表す。
- source_word: ἐγενόμην
  choice: 入った
  rationale: γίνομαι の変化・移行の含みを、ἐν πνεύματι と合わせて日本語として自然に表し、単なる静的状態ではなく幻的状態への移行を示す。
- source_word: ἐν πνεύματι
  choice: 御霊のうちに
  rationale: 黙示録における預言的・幻的経験を示す表現として、聖霊を指す可能性の高い読みを本文に採用する。ただし無冠詞であり、『霊において』という一般的な霊的状態の読みも脚注に残す。
- source_word: ἰδοὺ
  choice: すると見よ
  rationale: 視界に現れたものへ注意を向けさせる黙示文学的な力を保つ。『すると』で叙述の展開も自然につなぐ。
- source_word: θρόνος
  choice: 一つの御座
  rationale: 初出の無冠詞名詞であるため『一つの』とし、神的な王座を指す文脈にふさわしい、聖書日本語で定着した『御座』を用いる。
- source_word: ἔκειτο
  choice: 据えられ
  rationale: 座が一定の場所に設置されている状態を表す κεῖμαι の意味を、対象に即した自然な日本語で表現する。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天には
  rationale: 大気圏の空ではなく、黙示文学における天上界を指すため『天』とする。
- source_word: καθήμενος
  choice: 座っている方がいた
  rationale: 冠詞を伴う実体詞的分詞を、人物の正体を本文以上に明示せず、かつ尊厳を保つ日本語で表す。
theological_decisions:
- issue: ἐν πνεύματι が聖霊を指すのか、一般的な霊的・幻的状態を指すのか
  choice: 御霊のうちに
  alternative: 霊において／霊の状態になって
  rationale: 黙示録内の用法は聖霊による預言的幻視を示す可能性が高い。一方、ギリシア語には冠詞がなく、より一般的な霊的状態とも理解できるため、その緊張を脚注で保持する。
- issue: 御座に座る者の同定
  choice: 座っている方
  alternative: 座っている者
  rationale: 文脈上の尊厳を自然な敬称で示しつつ、この節自体が名を明示していないことを保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示文学の荘重さを『見よ』『御座』で保った。文末まで続くギリシア語の構造は、日本語で意味が明確になるよう『方がいた』で完結させた。
