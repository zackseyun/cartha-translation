id: REV.4.8
reference: Revelation 4:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: ja
  text: '四つの生き物は、それぞれ六つの翼を持ち、周りにも内側にも目が満ちている。そして昼も夜も休むことなく、こう言っている。

    「聖なる、聖なる、聖なる方、

    主なる神、全能者。

    かつておられ、今おられ、来られる方[a]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「かつておられ、今おられ、やがて来られる方」。
    reason: ὁ ἐρχόμενος は字義的には「来られる方」という現在分詞だが、伝統的には将来の来臨を明示して訳されることも多い。
lexical_decisions:
- source_word: ζῷα
  choice: 生き物
  rationale: ここでは現代語の「動物」ではなく、幻の中に現れる命ある天上の存在を指す。「生き物」は、その異様な幻の描写を保ちつつ自然な日本語である。
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: それぞれ
  rationale: 四つの生き物の一つ一つに同じ特徴があるという分配的な意味を簡潔に表す。
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: それぞれ六つの翼を持ち
  rationale: 各々が六翼を持つことを明示し、ギリシア語の分配的な構造を自然な日本語にした。
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: 周りにも内側にも
  rationale: 外周と内部という二つの空間的側面を保ち、幻の包括的で異様な描写を弱めない。
- source_word: γέμουσιν ὀφθαλμῶν
  choice: 目が満ちている
  rationale: γέμωと属格の「～で満ちている」を直接反映し、「覆われている」などの説明的解釈を加えない。
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: 休むことなく
  rationale: 直訳的な「休みを持たない」の意味を自然に表し、単に発話をやめないという意味に限定しない。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼も夜も
  rationale: 絶え間ない継続を表す慣用的で明瞭な日本語。
- source_word: λέγοντες
  choice: こう言っている
  rationale: 継続する宣言を示しつつ、「叫ぶ」など原文に明示されない強さを加えない。
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: 聖なる、聖なる、聖なる方
  rationale: 三重の反復をそのまま保ち、後続する神への称号として自然に読める形にした。
- source_word: κύριος, ὁ θεός
  choice: 主なる神
  rationale: 神への礼拝上の称号としてのκύριοςを「主」とし、日本語として定着した結合表現にした。
- source_word: ὁ παντοκράτωρ
  choice: 全能者
  rationale: 万物に及ぶ力と支配を示す神的称号を、簡潔で格調ある現代日本語で表す。
theological_decisions:
- issue: 神の時間的称号 ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος の訳し方
  choice: かつておられ、今おられ、来られる方
  alternative: かつておられ、今おられ、やがて来られる方
  rationale: 最後の語は現在分詞であり、「来ることになっている方」のような単なる未来表現にせず、来臨する方という動的な響きを保った。「やがて」は自然な伝統的理解を明確にするが、原文にない時間副詞なので脚注に置いた。
- issue: Ἅγιος ἅγιος ἅγιος と κύριος ὁ θεός の統語関係
  choice: 「聖なる」を三度反復し、「方」によって後続の神的称号へ結び付ける
  alternative: 「聖なるかな」を三度反復して独立した歓呼とする
  rationale: 主なる神が聖なる方であるという述語的関係を明瞭にしつつ、三重の反復を保持した。「かな」は礼拝的だが、原文以上に古典的な感嘆表現となるため採用しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、礼拝の宣言には簡潔で格調ある文体を用いた。幻の異様さは説明で和らげず、反復と空間表現を保持した。脚注記号は該当する時間的称号の直後に配置した。
