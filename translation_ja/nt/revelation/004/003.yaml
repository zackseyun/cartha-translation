id: REV.4.3
reference: Revelation 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: ja
  text: 御座に着いておられる方は、見たところ碧玉や赤めのう[a]のようであった。また、御座の周りには、見たところエメラルドのような虹[b]があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「サルディオン」。赤色系の宝石で、カーネリアンとも呼ばれる。
    reason: lexical_alternative
  - marker: b
    text: 「虹」は、御座を取り巻く虹のような光輪を指す可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: 御座に着いておられる方
  rationale: 文脈上、御座に座す方を指す名詞的分詞。原文自体には「御座に」の語はないが、直前の文脈を自然に受け、継続する着座の姿勢と敬意を現代日本語で表す。
- source_word: ὅμοιος ὁράσει
  choice: 見たところ……のよう
  rationale: ὁράσει は外見・見え方の点での類似を示す。実体が宝石であるとはせず、幻の中での視覚的な類似を保つ。
- source_word: λίθῳ ἰάσπιδι
  choice: 碧玉
  rationale: ἴασπις の慣用的な日本語宝石名。λίθοςは宝石名に含意されるため、重い「碧玉の石」とはしない。古代の石が現代の鉱物分類上のジャスパーと完全に一致するかは確定できないが、聖書訳として定着し明瞭である。
- source_word: σαρδίῳ
  choice: 赤めのう
  rationale: 赤色系の半貴石を指す語として、現代の読者に分かりやすい名称を採る。伝統的な音写・名称「サルディオン」は脚注に残す。
- source_word: ἶρις
  choice: 虹
  rationale: 通常の意味である「虹」を本文に採用する。ただし御座を囲む虹状の光輪を指す可能性があるため、脚注で代案を示す。
- source_word: κυκλόθεν τοῦ θρόνου
  choice: 御座の周りに
  rationale: 御座を取り囲む位置関係を自然で簡潔な日本語で表す。
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: 見たところエメラルドのよう
  rationale: 色や輝きについての視覚的な類似を保ち、虹そのものがエメラルドでできているとは表現しない。
theological_decisions:
- issue: 御座に着く方を宝石との比喩で描くこと
  choice: 「見たところ……のよう」として視覚的類似を明示する
  alternative: 御座に着く方が宝石でできている、または特定の色の光を放っていると説明する
  rationale: 原文は二度にわたり ὅμοιος ὁράσει を用いる。比喩を実体の説明へ変えず、幻の描写と神の超越性に伴う緊張を保持する。
- issue: ἶρις が示す像
  choice: 本文では「虹」とする
  alternative: 「光輪」とする
  rationale: 語の基本的な像を優先しつつ、御座の周囲を取り巻く虹状の輝きという可能性を脚注に残し、一義的に決めつけない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「おられる」で御座に着く方への敬意を自然に示しつつ、宝石との比較は反復する「見たところ……のよう」で明示した。脚注記号は該当語の直後に置いた。
