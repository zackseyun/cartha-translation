id: REV.4.1
reference: Revelation 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: ja
  text: これらのことの後[a]、私は見た。すると、見よ、天に一つの扉が開かれたままになっていた。そして、私が最初に聞いた声[b]、ラッパのように私と語っていた声[c]が言った。「ここに上がって来なさい。これらのことの後に起こらなければならないことを、あなたに示そう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらのことの後」は、より自然には「この後」とも訳せる。ギリシア語では、節の冒頭と末尾に同じ複数形の表現が繰り返されている。
    reason: lexical_alternative
  - marker: b
    text: 「私が最初に聞いた声」は、ヨハネが先に聞いた声を指すと考えられる（黙示録1章10節参照）。
    reason: cross_reference
  - marker: c
    text: 「私と語っていた」は「私に語りかけていた」とも訳せる。ギリシア語は字義的には「私と語っていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: これらのことの後
  rationale: 複数指示詞を明示し、節の冒頭と末尾にある同一表現の反復を保った。
- source_word: εἶδον
  choice: 私が見ると
  rationale: 直訳的な「見た」の意味を保ちつつ、続く「見よ」と自然につながる日本語の場面導入とした。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 幻の中で注意を強く促す談話標識として、黙示文学にふさわしい簡潔で格調ある表現を採った。
- source_word: θύρα ἠνεῳγμένη
  choice: 一つの扉が開かれたままになっていた
  rationale: 完了受動分詞が表す、開かれた結果として現在も開いている状態を示した。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天に
  rationale: 文脈は可視的な空ではなく天上界を指すため、「天」とした。
- source_word: ἡ φωνὴ ἡ πρώτη
  choice: 以前私が聞いた、…あの声
  rationale: 日本語で不自然な「第一の声」を避けつつ、ヨハネが先に聞いた声への回顧を表した。
- source_word: ὡς σάλπιγγος
  choice: ラッパのように
  rationale: 声とラッパを同一視せず、音の比較として訳した。
- source_word: λαλούσης μετ’ ἐμοῦ
  choice: 私と語る
  rationale: μετά＋属格の「私と」を保ち、単に一方向の発話と断定しない訳とした。
- source_word: Ἀνάβα ὧδε
  choice: ここに上って来なさい
  rationale: 天にいる話者の視点と、上方への移動を自然な現代日本語で示した。
- source_word: ἃ δεῖ γενέσθαι
  choice: 必ず起こること
  rationale: δεῖが表す必然性を「必ず」で明示し、γενέσθαιを出来事が生起する意味で訳した。
theological_decisions:
- issue: 反復される μετὰ ταῦτα の時間的意味
  choice: 冒頭と末尾をともに「これらのことの後」と訳した。
  alternative: 末尾を「この後」として日本語を滑らかにする。
  rationale: 同じギリシア語句の反復を残すことで、その順序が文学的、幻視的、あるいは救済史的なものかを訳文で決めつけない。
- issue: δεῖ の必然性
  choice: 「必ず起こる」とした。
  alternative: 「起こらなければならない」とする。
  rationale: 神的必然性を保ちながら、日本語として簡潔で自然にした。その必然性の仕組みを教義的に説明し加えてはいない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「見よ」で黙示文学の格調と注意喚起を保持した。「開かれたままになっていた」は原文の完了状態を明示するためやや形式的だが、普通の読者にも理解できる表現とした。脚注記号は対応箇所を示すため、本文では各関連表現の直後に配置するのが望ましい。
