- from: これらのことの後、私が見ると、見よ、天に一つの扉が開かれたままになっていた。そして、以前私が聞いた、ラッパのように私と語るあの声が言った。「ここに上って来なさい。これらのことの後に必ず起こることを、あなたに示そう。」[a][b][c]
  to: これらのことの後[a]、私は見た。すると、見よ、天に一つの扉が開かれたままになっていた。そして、私が最初に聞いた声[b]、ラッパのように私と語っていた声[c]が言った。「ここに上がって来なさい。これらのことの後に起こらなければならないことを、あなたに示そう。」
