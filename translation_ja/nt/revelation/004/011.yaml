id: REV.4.11
reference: Revelation 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: ja
  text: '「私たちの主であり神である方よ。


    あなたは、栄光と誉れと力を受けるにふさわしい方です。[a]


    あなたが万物を創造し、


    あなたの御心のゆえに、万物は存在し、創造されたからです。[b]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では「ふさわしい」が文頭に置かれ、強調されています。語順を生かせば、「ふさわしい方は、あなたです」とも訳せます。
    reason: 語順上の強調と訳語の代案を示すため。
  - marker: b
    text: 「あなたの御心によって」とも訳せます。ギリシア語の表現は主に理由（「御心のゆえに」）を示しますが、手段を表す意味にも理解できます。
    reason: διὰ τὸ θέλημά σου の原因的意味と手段的意味の可能性を保持するため。
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: あなたは……ふさわしい方です
  rationale: 述語形容詞による「ふさわしさ」を、現代日本語として自然な直接呼びかけで表した。原文では「ふさわしい」が文頭に置かれて強調されているため、その点は脚注に示した。
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: 私たちの主、また神よ
  rationale: 礼拝の文脈で定冠詞付き名詞が呼格的に機能していることを「よ」で明示し、κύριος と θεός の二つの称号、および ἡμῶν の所有関係を保持した。
- source_word: λαβεῖν
  choice: 受ける
  rationale: ἄξιος に続き、何を受けるにふさわしいかを示す不定詞。礼拝において神に帰されるものを「受ける」と自然に表した。
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: 栄光と誉れと力
  rationale: 三つの名詞を並列して原文の荘重なリズムを保った。δόξα は「栄光」、τιμή は神にささげる「誉れ」、δύναμις は包括的で明瞭な「力」とした。
- source_word: ὅτι
  choice: ……からです
  rationale: 神がそれらを受けるにふさわしい理由を導く接続詞なので、現代日本語で明瞭な理由表現とした。
- source_word: ἔκτισας τὰ πάντα
  choice: あなたが万物を創造し
  rationale: κτίζω を「創造する」、包括的な τὰ πάντα を荘重で簡潔な「万物」と訳した。
- source_word: διὰ τὸ θέλημά σου
  choice: あなたの御心のゆえに
  rationale: διά＋対格の主要な原因・理由の意味を保つため「ゆえに」とした。手段を示す「御心によって」という理解も可能なので脚注に残した。
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: 万物は存在し、創造された
  rationale: ἦσαν と ἐκτίσθησαν の二つの動詞を統合せず、それぞれ「存在し」「創造された」と訳した。日本語で主語が曖昧にならないよう「万物」を補って反復した。
theological_decisions:
- issue: 神への呼びかけとしての称号の訳し方
  choice: 私たちの主、また神よ
  alternative: 私たちの主であり神である方よ
  rationale: 原文は御座に着く方への直接の礼拝の言葉であるため、呼格的な力を明示した。二つの称号の関係について本文以上の教理的説明は加えていない。
- issue: διὰ τὸ θέλημά σου における神の御心と被造物の存在・創造との関係
  choice: あなたの御心のゆえに
  alternative: あなたの御心によって
  rationale: διά＋対格が通常示す原因・理由を本文に採用したが、文脈上あり得る手段的な読みを排除せず脚注に示した。創造と神の意志をめぐる形而上学的議論を翻訳で決着させないようにした。
- issue: ἦσαν と ἐκτίσθησαν の関係
  choice: 存在し、創造された
  alternative: 生じ、創造された
  rationale: 未完了過去とアオリスト受動の二つを区別して保持した。両者の時間的・論理的関係を説明的に補わず、原文にある緊張を残した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、天上の礼拝にふさわしい荘重さを保った。「万物」「御心」「誉れ」はやや高い文体だが、一般読者に理解可能で、黙示録の賛歌的な調子にも合う。行分けによって三重の賛美と創造を理由とする構造を見やすくした。
