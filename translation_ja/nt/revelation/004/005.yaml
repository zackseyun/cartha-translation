id: REV.4.5
reference: Revelation 4:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: ja
  text: また、御座からは稲妻、音[a]、雷鳴が出ている。御座の前には、七つの火のともしび[b]が燃えている。これらは神の七つの霊[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「声」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「七つの燃えるたいまつ」。
    reason: lexical_alternative
  - marker: c
    text: 「神の七つの霊」を、唯一の聖霊の完全さを象徴する表現と理解する見方が多い。ただし、ギリシア語本文は複数形で「七つの霊」と記している。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: 出ていた
  rationale: 御座を起点として諸現象が発していることを自然な日本語で表す。ギリシア語の現在形が描く継続的な光景を「ていた」で叙景的に示した。
- source_word: ἀστραπαὶ
  choice: 稲妻
  rationale: 複数形が示す反復的な現象を、日本語で自然な集合表現となる「稲妻」で表した。
- source_word: φωναὶ
  choice: 音
  rationale: φωνήには「声」と「音」の両義がある。稲妻と雷鳴が並ぶ神顕現の文脈では広い意味の「音」が自然だが、「声」の可能性を脚注に残した。
- source_word: βρονταί
  choice: 雷鳴
  rationale: 複数の雷の響きを、現代日本語で簡潔かつ荘重に表す。
- source_word: λαμπάδες πυρὸς
  choice: 火のともしび
  rationale: λαμπάςは「たいまつ」とも「ともしび」とも訳し得る。属格 πυρόςを保ちつつ、御座の場面に自然な「火のともしび」を本文に採用し、「たいまつ」を脚注に示した。
- source_word: καιόμεναι
  choice: 燃えていた
  rationale: 現在分詞が表す継続中の燃焼を自然な日本語で示した。
- source_word: ἐνώπιον τοῦ θρόνου
  choice: 御座の前では
  rationale: 空間的位置を明確にし、後続する光景を自然に導入する。
- source_word: ἅ εἰσιν
  choice: これらは…である
  rationale: 先行する七つのともしびを受け、その象徴的な同定を明確に表す。
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: 神の七つの霊
  rationale: ギリシア語の明示的な複数形をそのまま保ち、象徴の意味を本文で解釈的に限定しない。
theological_decisions:
- issue: τὰ ἑπτὰ πνεύματα τοῦ θεοῦの解釈
  choice: 本文では「神の七つの霊」と複数形のまま訳す。
  alternative: 唯一の聖霊の完全さを象徴する「七重の御霊」またはそれに相当する解釈。
  rationale: 原文は明確に「七つの霊」と述べる。唯一の聖霊の満ち満ちた働きと見る解釈は有力だが、それを本文に織り込むと翻訳段階で象徴を確定することになるため、脚注に留めた。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、黙示文学の荘重さを保つため「御座」「雷鳴」「ともしび」を採用した。短い文に分けて視覚的な展開を明瞭にし、原文にある語義上・神学上の曖昧さは脚注で保持した。
