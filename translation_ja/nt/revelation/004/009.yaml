id: REV.4.9
reference: Revelation 4:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: ja
  text: また、生き物たちが、玉座に座っておられ、世々限りなく生きておられる方に、栄光と誉れと感謝をささげるたびに[a]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「世々の世々に至るまで」。
    reason: εἰς τοὺς αἰῶνας τῶν αἰώνων の重ねられた時代表現を示すため。
lexical_decisions:
- source_word: ὅταν
  choice: 〜たびに
  rationale: 不定・反復的な時を表す接続表現として、単発の出来事ではなく繰り返される場面を自然な日本語で示す。
- source_word: δώσουσιν
  choice: ささげる
  rationale: 直訳的な「与える」は栄光・誉れ・感謝を目的語とする日本語として不自然なため、礼拝の文脈で同じ動作を自然に表す「ささげる」とした。
- source_word: τὰ ζῷα
  choice: 生き物たち
  rationale: 直前の文脈で登場した御座の周りの存在を指す。本文にない「四つ」は補わず、単なる動物とも限定しない。
- source_word: δόξαν
  choice: 栄光
  rationale: 頌栄の文脈における標準的で直接的な訳語であり、「賛美」のように行為そのものへ意味をずらさない。
- source_word: τιμήν
  choice: 誉れ
  rationale: 礼拝にふさわしい格調を保ちつつ、δόξαとの違いも示せる自然な訳語とした。
- source_word: εὐχαριστίαν
  choice: 感謝
  rationale: 内面的な感情だけでなく、表明される感謝を含み、三つの名詞の並列を簡潔に保つ。
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: 御座に着いておられ
  rationale: 着座した状態を表す分詞を自然な敬語表現で訳し、黙示録の神的な御座の表記として「御座」を用いた。
- source_word: τῷ ζῶντι
  choice: 生きておられる方
  rationale: 現在分詞の動的な意味を保ち、後続する永続期間の句へ自然につなげる。
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: 世々限りなく
  rationale: 終わりのない持続を明確に伝える、現代日本語の聖書文体として自然で格調ある慣用表現。逐語的な形は脚注に示す。
theological_decisions:
- issue: 御座にある神を本文以上に特定するか
  choice: 御座に着いておられ、世々限りなく生きておられる方
  alternative: 御座に着いておられる神、すなわち永遠に生きる方
  rationale: 原文は神を明示する名詞を置かず、着座と永遠の生命によって指し示しているため、「神」を補わず、二つの分詞句の同一指示対象を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、天上の礼拝場面にふさわしい品位を保った。節が次節へ続く従属節であるため、末尾を読点とした。
