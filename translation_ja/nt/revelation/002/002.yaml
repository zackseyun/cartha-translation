id: REV.2.2
reference: Revelation 2:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: ja
  text: あなたの行いと、労苦と忍耐を、わたしは知っている。また、あなたが悪い者たちを容認できないこと[a]、そして、使徒だと自称しながら実際はそうでない者たち[b]を試し、彼らが偽り者であると見抜いたことも知っている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「悪い者たちに耐えることができない」。ここでは、彼らを許容しないという意味。
    reason: lexical_alternative
  - marker: b
    text: 「使徒であると称する者たち」とも訳せる。「使徒」は、派遣された者、使者を意味する語。ここでは教会における称号として用いられていると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: わたしは知っている
  rationale: 現在の継続的な認識と評価を表す直接的で自然な訳。後続する複数の内容すべてにかかる構文も日本語で明確にした。
- source_word: τὰ ἔργα σου
  choice: あなたの行い
  rationale: 活動や実践を広く指すἔργαを、現代日本語で自然かつ広義に表す。「業」より分かりやすい。
- source_word: τὸν κόπον
  choice: 労苦
  rationale: 疲労を伴う骨折りや働きというκόποςの含意を、簡潔で格調ある語で保持する。
- source_word: τὴν ὑπομονήν σου
  choice: 忍耐
  rationale: 圧力や困難の下で持続する姿勢を表す定着した聖書語であり、現代日本語でも明瞭。
- source_word: οὐ δύνῃ βαστάσαι
  choice: 容認できない
  rationale: 字義的には「耐えることができない」だが、ここでは悪い者たちを受け入れず許容しない姿勢を表す。「容認できない」は能力不足という誤解を避けつつ文脈上の力を伝える。
- source_word: κακούς
  choice: 悪い者たち
  rationale: 男性複数形の形容詞が人を指す名詞的用法。性別を不必要に限定せず、道徳的評価をそのまま示す。
- source_word: ἐπείρασας
  choice: 試し
  rationale: 使徒であるとの主張を吟味したことを表すため、「試した」という基本義を保持した。
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: 使徒だと自称しながら
  rationale: 再帰代名詞の自己主張の意味を自然に表す。「自称」には、その主張が検証対象であるという文脈もよく合う。
- source_word: ἀποστόλους
  choice: 使徒
  rationale: 教会への語りかけという文脈では、一般的な「使者」より、権威ある派遣者としての称号が適切。
- source_word: ψευδεῖς
  choice: 偽り者
  rationale: 彼ら自身またはその自己申告が偽りであるという述語形容詞の評価を保持する。「偽使徒」と訳すと本文が明示する以上に意味を限定するため避けた。
- source_word: εὗρες
  choice: 見抜いた
  rationale: 吟味の結果として真相を発見した流れを、日本語で自然に示す。単なる偶然の発見ではなく識別の含意がある。
theological_decisions:
- issue: ἀποστόλουςが称号としての「使徒」か、一般的な「使者」か
  choice: 使徒
  alternative: 使者
  rationale: 自己主張の吟味と教会内での権威が問題となる文脈では、専門的な称号として読む可能性が高い。ただし彼らがどの制度的地位を主張したかまでは訳文に付加しない。
- issue: ψευδεῖςが人物全体を「偽り者」とするのか、使徒との主張のみを偽りとするのか
  choice: 彼らが偽り者である
  alternative: 彼らの主張が偽りである／彼らが偽使徒である
  rationale: 原文は人物を指す複数形の述語形容詞であり、まず人物を「偽り」と評価している。「偽使徒」は文脈上可能だが、評価の範囲を使徒資格だけに限定し得るため本文では採らない。
- issue: οὐ δύνῃ βαστάσαιを能力の欠如として表すか、許容の拒否として表すか
  choice: 容認できない
  alternative: 耐えることができない
  rationale: δύναμαιの能力表現は残しつつ、倫理的・共同体的文脈での「悪い者たちを許容しない」という意味を自然に伝える。彼らへの暴力や排除の具体的方法までは示唆しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録のキリストによる厳粛な評価にふさわしい格調を保った。「わたしは知っている」を文頭と文末に対応させ、ギリシア語で一つのΟἶδαが複数の目的内容を支配する関係を日本語で誤解なく示した。
