id: REV.2.16
reference: Revelation 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: ja
  text: だから、悔い改めなさい。そうしなければ、わたしはすぐに[a]あなたのところに行き、わたしの口の剣[b]で彼らと戦う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すぐに」は、時が近いこととも、行動が迅速・突然であることとも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「口の剣」は、キリストがそのことば、すなわち裁きの宣告によって裁きを行うことを表す黙示文学的なイメージ。
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: 悔い改めなさい
  rationale: アオリスト能動命令形が求める決定的な悔い改めを、現代日本語で簡潔かつ十分な倫理的・霊的重みをもって表す。
- source_word: οὖν
  choice: だから
  rationale: 直前の叱責を受けた帰結を明確に示す。現代の一般読者に自然でありながら、論理的なつながりを保つ。
- source_word: εἰ δὲ μή
  choice: そうしなければ
  rationale: 悔い改めない場合を示す警告の条件表現として、δέの対照とμήの否定を自然な日本語にまとめる。
- source_word: ἔρχομαί σοι
  choice: わたしは…あなたのところに行き
  rationale: 話者が聞き手のいる場所へ向かうことを、日本語の自然な直示法で表す。敵対の対象を教会全体と先取りせず、後続の「彼らと戦う」と区別する。
- source_word: ταχύ
  choice: すぐに
  rationale: 時の近さと行動の速やかさの両方を許す、自然で過度に限定的でない訳語。
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: 彼らと戦う
  rationale: πολεμέωの軍事的な厳しさを保つ。「彼らと戦う」の「と」は日本語では相手を明確に示し、共闘の意味にはならない。
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: 剣で
  rationale: ἐνの手段用法を簡潔に表し、裁きが執行される手段としての剣の比喩を保持する。
- source_word: ῥομφαίᾳ τοῦ στόματός μου
  choice: わたしの口の剣
  rationale: 黙示録特有の鮮烈な終末論的イメージを「ことば」などと説明的に置き換えず、原文の属格表現を保つ。
theological_decisions:
- issue: 教会への来訪と「彼ら」への敵対行為の関係
  choice: キリストは「あなた」のところに行き、「彼ら」と戦うと訳し、共同体への呼びかけと特定の者への裁きを区別しつつ併置する。
  alternative: 教会全体に対して区別なく敵対的に来る、または偽教師だけを対象として教会には来ないと明示する。
  rationale: 原文は単数のσοιで受け手に向かうことを述べる一方、戦いの相手を複数のαὐτῶνで示す。この緊張を解消せず保持する。
- issue: 裁きの手段としての「口の剣」
  choice: 黙示文学的な比喩をそのまま残す。
  alternative: 「わたしのことば」または「わたしの宣告」と説明的に言い換える。
  rationale: 原文が用いる剣のイメージには裁きのことばという含意があるが、本文で比喩を平板化せず、注でその機能を簡潔に説明する。
translation_notes:
  register: 明快な現代標準日本語を用い、「悔い改めなさい」「戦う」で警告の厳粛さを保った。「口の剣」は不自然さを避けるために説明的に崩さず、黙示録の象徴表現として保持した。
