source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: ja
  text: 「エフェソにある教会の御使い[a]に書き送れ。『右手に七つの星をしっかりと握っておられる方、七つの金の燭台の間を歩いておられる方が、こう言われる。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「使者」。
    reason: ギリシア語は天上の御使いと人間の使者のどちらも意味し得るため。
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 御使い
  rationale: 天上の存在と人間の使者のどちらも指し得るが、黙示録の文脈に自然な「御使い」を本文に置き、別の可能性を脚注に残した。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: ここではキリスト者の共同体を指す定着した自然な訳語である。
- source_word: γράψον
  choice: 書き送れ
  rationale: 単純な命令を保ちつつ、宛先への書信として自然な日本語にした。
- source_word: Τάδε λέγει
  choice: こう言われる
  rationale: 預言的な告知の荘重さを保ちながら、現代日本語として明瞭にした。
- source_word: κρατῶν
  choice: しっかりと握る
  rationale: 単に持つだけでなく、確実に保持し支配する含意を表した。
- source_word: δεξιᾷ
  choice: 右の手
  rationale: 権威と守護を帯びる具体的な原文の像をそのまま保った。
- source_word: περιπατῶν / ἐν μέσῳ
  choice: 間を歩く
  rationale: 燭台のただ中を動く鮮明な像を、自然で簡潔な日本語で表した。
- source_word: λυχνιῶν
  choice: 燭台
  rationale: 灯そのものではなく、それを載せる台を意味し、黙示録1章の描写とも整合する。
- source_word: χρυσῶν
  choice: 金の
  rationale: 材質を示す形容を自然な日本語で表した。
theological_decisions:
- issue: 「教会のἄγγελος」が指すもの
  choice: 本文では「御使い」
  alternative: 「使者」
  rationale: 語自体は天使にも人間の使者にもなり得る。黙示文学的文脈から「御使い」を本文に採用する一方、論争のある指示対象を断定せず、脚注で別訳を示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、預言的宣言にふさわしい品位を保った。「御使い」は聖書文体として通用し、「天使」より原語の「使者」との語義的つながりも残しやすい。
