id: REV.2.11
reference: Revelation 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: ja
  text: 耳のある者は、霊が諸教会に語ることを聞きなさい。勝利を得る者は、第二の死によって決して害を受けない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 耳のある者
  rationale: 単数形の代表的表現を保ちつつ、この定型句を自然で簡潔な日本語にした。
- source_word: ἀκουσάτω
  choice: 聞きなさい
  rationale: 三人称単数のアオリスト命令形が持つ勧告・命令の力を、現代日本語で明確に表した。
- source_word: τὸ πνεῦμα
  choice: 霊
  rationale: 文脈上は神の霊を指すが、原文には「聖」という語がないため、解釈を本文に補わず「霊」とした。
- source_word: ταῖς ἐκκλησίαις
  choice: 諸教会
  rationale: 黙示録2―3章で宛先となる複数の信仰共同体を、簡潔かつ文脈に即して表した。
- source_word: ὁ νικῶν
  choice: 勝利を得る者
  rationale: 継続的・特徴的に勝つ者を表す現在分詞を、黙示録の勝利の主題が伝わる自然な日本語にした。
- source_word: οὐ μὴ
  choice: 決して……ない
  rationale: 接続法とともに用いられた強い否定を明瞭に表した。
- source_word: ἀδικηθῇ
  choice: 害を受けない
  rationale: ここでは法的に不当な扱いを受けることより、第二の死から実害を被ることが焦点なので「害を受ける」とした。
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: 第二の死によって
  rationale: ἐκが示す源・作用者に近い関係を、受け身の日本語に自然な「によって」で表した。
- source_word: τοῦ θανάτου τοῦ δευτέρου
  choice: 第二の死
  rationale: 黙示録内で重要な意味を持つ表現を、解釈的に言い換えずそのまま保持した。
theological_decisions:
- issue: 「霊」の指示対象
  choice: 本文では「霊」とし、神の霊を指す文脈を保つ
  alternative: 「聖霊」または「御霊」と明示する
  rationale: 定型句の話者は神の霊と理解されるが、原文の語彙以上の限定を本文に加えないため。
- issue: 「第二の死」の意味
  choice: 解説を加えず「第二の死」とする
  alternative: 最後の裁き、または永遠の滅びと説明的に訳す
  rationale: この表現は黙示録の後続箇所で展開されるため、本節で特定の教理的説明を織り込まない。
- issue: ὁ νικῶν の含意
  choice: 「勝利を得る者」
  alternative: 「打ち勝つ者」または「勝つ者」
  rationale: 何にどう勝つかを本文以上に限定せず、信仰を貫く者の勝利という黙示録の緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の力と黙示文学らしい厳粛さを保った。「諸教会」「第二の死」は本文内の反復表現として簡潔に訳し、教派固有の語釈は加えていない。英語相談層の脚注は付されている位置と内容が一致していないため、日本語稿には継承しなかった。
source_grounding:
  english_pob_role: consult_only
