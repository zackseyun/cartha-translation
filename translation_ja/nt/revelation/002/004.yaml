  yaml_path: translation/nt/revelation/002/004.yaml
  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: ja
  text: しかし、あなたに対して、わたしには責めるべきことがある。あなたは初めの愛を捨てた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「初めの愛から離れた」。「初めの愛」は、彼らが初めに抱いていた愛を指し、その対象は主、互い、またはその両方とも考えられる。
    reason: 語彙上の別訳と指示内容の曖昧さを示すため。
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の称賛との明確な対照を示す、自然で格調のある現代日本語。
- source_word: ἔχω κατὰ σοῦ
  choice: あなたには責めるべきことがある
  rationale: κατάを伴う慣用表現の、相手に対する非難・訴えの力を保ちつつ、日本語として自然に表した。
- source_word: ὅτι
  choice: 。あなたは
  rationale: 非難の内容を導く接続を二文に分けて明瞭に示した。「なぜなら」として理由に限定することは避けた。
- source_word: τὴν ἀγάπην σου τὴν πρώτην
  choice: あなたは初めの愛を
  rationale: 「あなたの」を日本語の主題「あなたは」に含め、πρώτηνを解釈的に狭めず「初めの」とした。愛の対象や方向は特定していない。
- source_word: ἀφῆκες
  choice: 捨ててしまった
  rationale: ここでの「後に残す、放棄する」という強い意味と完了した離反を、現代日本語で自然に伝える。「離れた」より意志的・深刻な響きがある一方、別訳を脚注に示す。
theological_decisions:
- issue: 「初めの愛」の指示内容
  choice: 「初めの愛」と直訳的に保ち、対象を限定しない
  alternative: 「初めにわたしに抱いていた愛」「初めに持っていた愛」「以前の愛」
  rationale: ギリシア語は、主への愛、互いへの愛、またはその両方のいずれとも取り得る。本文にない限定を加えず、神学的な開放性を保った。
- issue: ἀφῆκεςの強さ
  choice: 「捨ててしまった」
  alternative: 「離れてしまった」「後にしてしまった」
  rationale: 厳しい叱責の文脈にある放棄のニュアンスを示す。ただし、より字義的で対象との離隔を表す「離れてしまった」も可能なので脚注に記した。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「責めるべきことがある」で叱責の力を保ち、「初めの愛」は簡潔なまま残して原文の曖昧さを維持した。
