id: REV.2.25
reference: Revelation 2:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πλὴν ὃ ἔχετε κρατήσατε ἄχρι οὗ ἂν ἥξω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/025.yaml
  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: ja
  text: ただし[a]、わたしが来るまで、あなたがたが持っているものをしっかり保ちなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ただ、わたしが来るまで、あなたがたが持っているものをしっかり保ちなさい。」
    reason: πλὴνは、逆接的な「ただし」のほか、限定を強く示す「ただ」とも理解できるため。
lexical_decisions:
- source_word: πλὴν
  choice: ただし
  rationale: 直前の内容を受けて、例外または限定を導く語。現代日本語として自然にその限定的・転換的な力を表す。文脈によっては「ただ」とも訳せるため、脚注に示した。
- source_word: ὃ ἔχετε
  choice: あなたがたが持っているもの
  rationale: 中性関係代名詞と動詞の組み合わせを一般的に訳し、彼らが現在保持しているものの内容を訳文で限定しない。
- source_word: κρατήσατε
  choice: しっかり守りなさい
  rationale: κρατέωの命令が表す、手放さず堅く保持するという強い勧告を、明瞭で自然な日本語にした。
- source_word: ἄχρι οὗ ἂν
  choice: まで
  rationale: 話者が来る時点を将来の期限として示す構文を、簡潔な日本語で表した。
- source_word: ἥξω
  choice: わたしが来る
  rationale: 到来を表す語をそのまま訳し、それが終末の再臨か、この教会への裁きとしての訪れかを特定しない。
theological_decisions:
- issue: イエスの「来る」が、終末における最終的な来臨を指すのか、この教会への裁き・訪れを指すのか
  choice: 「わたしが来るまで」とのみ訳し、来臨の様態や時期を限定しない。
  alternative: 「わたしが裁きに来るまで」／「わたしが再び来るまで」
  rationale: ギリシア語本文はここで到来の性質を明示していないため、解釈によって神学的緊張を解消せず、原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、キリストの勧告にふさわしい端正さを保った。「あなたがた」により複数形を明示し、「しっかり守りなさい」で命令の強さを自然に表した。
