id: REV.2.7
reference: Revelation 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: ja
  text: 耳のある者は、聖霊が諸教会に語ることを聞きなさい。打ち勝つ者[a]には、神の楽園にあるいのちの木から食べることを、わたしは与えよう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「打ち勝つ者」は「勝利を得る者」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 耳のある者
  rationale: 単数形を保ちつつ、黙示録で繰り返される呼びかけとして自然で格調ある日本語にした。
- source_word: ἀκουσάτω
  choice: 聞きなさい
  rationale: 三人称単数のアオリスト命令法が持つ直接的な勧告の力を、現代日本語の命令表現で示した。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 黙示録2–3章の定型句では神の霊を指すため、その指示対象を明確にする日本語の聖書的表現を用いた。
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: 諸教会に語る
  rationale: 複数形を「諸教会」で示し、現在形は日本語で自然な「語る」とした。
- source_word: τῷ νικῶντι
  choice: 勝利を得る者
  rationale: νικάωの勝利・征服のイメージを保ちながら、日本語として自然な継続的・代表的表現にした。
- source_word: δώσω αὐτῷ φαγεῖν
  choice: 食べることを、わたしは許そう
  rationale: 直訳的な「食べることを与える」は不自然なため、与えられる特権・許可を表す自然な日本語とした。ただし「与えよう」も形式的には可能である。
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: いのちの木から
  rationale: ἐκの起点・源の意味を「から」で表し、創世記との語句上の連関を保った。
- source_word: παραδείσῳ τοῦ θεοῦ
  choice: 神の楽園
  rationale: 終末論的・聖書間テクスト的含意を持つπαράδεισοςを、単なる「園」に弱めず「楽園」とした。
theological_decisions:
- issue: τὸ πνεῦμαの指示対象
  choice: 御霊
  alternative: 霊
  rationale: 諸教会への神的な語りかけを表す黙示録2–3章の反復句であり、一般的な霊ではなく神の霊を指すと判断した。
- issue: νικάωの訳し方
  choice: 勝利を得る
  alternative: 打ち勝つ
  rationale: 黙示録に通底する勝利のイメージを明瞭に保つ。「打ち勝つ」も可能なので脚注に示した。
- issue: δώσω αὐτῷ φαγεῖνの意味関係
  choice: 食べることを許そう
  alternative: 食べさせよう／食べるものを与えよう
  rationale: ギリシア語は直訳すれば「彼に食べることを与える」であり、約束された参与の権利を自然な日本語で表した。果実そのものを与えると限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示録の荘重な呼びかけと約束の調子を保った。「耳のある者」「いのちの木」「神の楽園」は聖書的連関が伝わる表現とした。
