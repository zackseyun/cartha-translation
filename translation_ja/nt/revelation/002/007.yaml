  naturalness: 「耳のある者」「諸教会」「いのちの木」「神の楽園」は、明瞭な現代標準日本語の範囲で黙示録の定型的・荘重な響きを保っている。「聖霊」は「御霊」より教派的な含みが少なく、一般的な現代日本語の聖書用語としてより適切である。脚注記号は該当語の直後に置く必要がある。
  terminology: τὸ πνεῦμαはこの反復句では聖霊を指すため「聖霊」とする。ἐκκλησίαιςは「諸教会」、ξύλον τῆς ζωῆςは既存の聖書的連関を保つ「いのちの木」、παραδείσῳ τοῦ θεοῦは「神の楽園」が適切である。
