  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: ja
  text: わたしは、あなたの行い、愛、信仰[a]、奉仕、忍耐を知っている。また、あなたのその後の行いが初めの行いよりも多いことも知っている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「忠実さ」。ここでのギリシア語は、「信仰」と「忠実さ」のどちらも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: 知っている
  rationale: 現在の状態を表す οἶδα を、黙示録の諸教会への定型句として自然な現代日本語にした。
- source_word: ἔργα
  choice: 行い
  rationale: 具体的な行動や実践を指す語であり、節内の反復も同じ訳語で保った。
- source_word: ἀγάπην
  choice: 愛
  rationale: キリスト者の徳として示される能動的な愛を、簡潔で一般的な語で表した。
- source_word: πίστιν
  choice: 信仰
  rationale: 神への信頼という意味を基本訳にしつつ、この文脈で可能な「忠実」の意味は脚注に残した。
- source_word: διακονίαν
  choice: 奉仕
  rationale: 実際に人に仕える働きを表し、制度的な職務に限定しない訳語を選んだ。
- source_word: ὑπομονήν
  choice: 忍耐
  rationale: 圧迫のもとで持ちこたえる不屈の態度を表す、黙示録で自然な訳語である。
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: あなたの後の行い
  rationale: 初めの行いとの時間的対比を保ち、「最後」として終局的な意味に限定することを避けた。
- source_word: πλείονα τῶν πρώτων
  choice: 初めの行いよりも多い
  rationale: πλείονα の比較表現を保ち、行いが量・広がりの点で増しているという原文の幅を、単に質的に「優れている」と限定せずに示した。
theological_decisions:
- issue: 徳目の一覧における πίστις の意味
  choice: 信仰
  alternative: 忠実
  rationale: この語は神への信頼を指すことも、忠実さを指すこともできる。本文では基本的な「信仰」を採用し、文脈上あり得るもう一つの意味を脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。徳目の並列と「後／初め」の対比を明示し、原文にない教派的解釈は加えていない。
