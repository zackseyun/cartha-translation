id: REV.2.21
reference: Revelation 2:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔδωκα αὐτῇ χρόνον ἵνα μετανοήσῃ, καὶ οὐ θέλει μετανοῆσαι ἐκ τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: ja
  text: 私は彼女に悔い改めるための時間を与えたが、彼女は自分の性的な不道徳から悔い改めようとしない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκα
  choice: 与えた
  rationale: アオリスト直説法を、この文脈では完了した授与を表す自然な過去形で訳した。
- source_word: χρόνον
  choice: 時間
  rationale: 悔い改めのために猶予された一定の期間を、過度な解釈を加えず表す。
- source_word: ἵνα μετανοήσῃ
  choice: 悔い改めるための
  rationale: ἵνα＋接続法の目的を、日本語として自然な形で明示した。
- source_word: οὐ θέλει μετανοῆσαι
  choice: 悔い改めようとしない
  rationale: θέλωの意志・意欲の欠如を保ちつつ、「拒んだ」と断定するより原文に近い強さにした。
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: 自分の淫らな行いから
  rationale: ἐκの『～から離れて』という方向性を保ち、πορνείαを現代日本語で理解しやすく、かつ性的含意のある表現とした。
theological_decisions:
- issue: 黙示的な叱責における πορνεία の意味
  choice: 「淫らな行い」と具体的に訳し、性的な意味を保持する
  alternative: 偶像礼拝など霊的な不忠実だけを指す比喩として訳す
  rationale: 預言・黙示文学では比喩的含意もあり得るが、訳文でそれに限定せず、語の基本的な性的意味と文脈上の象徴性の両方を残した。
- issue: μετανοέω と ἐκ の結び付き
  choice: 「～から悔い改める」として離反の方向性を明示する
  alternative: 「～を悔い改める」
  rationale: 日本語では後者も自然だが、原文のἐκが示す『そこから離れる』という動きを保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語。「淫行」は簡潔だが硬く意味範囲が狭く受け取られ得るため、「淫らな行い」を採用した。原文の反復を保つため、「悔い改める」を二度用いた。
