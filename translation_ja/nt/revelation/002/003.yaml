source:
  edition: SBLGNT
  text: καὶ ὑπομονὴν ἔχεις, καὶ ἐβάστασας διὰ τὸ ὄνομά μου, καὶ ⸂οὐ κεκοπίακες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/003.yaml
  text: And you have endurance[a], and have borne up for my name[b], and have not grown weary.
translation:
  language: ja
  text: あなたには忍耐があり、わたしの名のために耐え忍んだ[a]。そして、疲れてはいない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの名のゆえに」とも訳せる。また、「耐え忍んだ」に当たる語には「担った」という意味もある。
    reason: lexical_alternative
  - marker: b
    text: 「疲れることがなかった」とも訳せる。この語は「労苦する」という意味にもなり得るため、「労苦しても疲れなかった」と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴν
  choice: 忍耐
  rationale: 試練や圧迫のもとで踏みとどまる持続的な強さを表す。簡潔で自然な日本語であり、受動的な我慢か能動的な堅忍かを必要以上に限定しない。
- source_word: ἔχεις
  choice: あなたには…があり
  rationale: 現在形による直接的な評価を自然な日本語で表し、今も忍耐を備えているという意味を保つ。
- source_word: ἐβάστασας
  choice: 耐え抜いてきた
  rationale: βαστάζωには「担う」「耐える」の意味がある。この文脈では、イエスの名のために重圧や苦難に耐えたことを指すと考えられる。「忍耐」と完全に同じ表現にせず、過去の行為が現在まで意味を持つことも自然に示す。
- source_word: διὰ τὸ ὄνομά μου
  choice: わたしの名のために
  rationale: διά＋対格が表し得る理由と目的の幅を、日本語の「ために」によって保つ。「名」はイエスへの帰属と忠誠を示す聖書的表現として維持する。
- source_word: οὐ κεκοπίακες
  choice: 疲れ果ててはいない
  rationale: κοπιάωの「労苦する」と「疲れる」の語義のうち、否定形と忍耐をたたえる文脈から、力尽きていないことを表すと判断した。完了形が示す現在の状態を「…てはいない」で保つ。
theological_decisions:
- issue: 忍耐と苦難を表す称賛の範囲
  choice: イエスの名のために重圧に耐え、今も疲れ果てていないことへの称賛として訳すが、迫害や奉仕など苦難の具体的形態は限定しない。
  alternative: 最後の句を労苦との関連で「労苦しても疲れなかった」または動詞の別義に寄せて「労苦しなかった」と理解することも可能。
  rationale: 並行する忍耐の表現は疲労の意味を支持するが、本文が明示しない特定の迫害、宣教奉仕、報いなどを訳文に持ち込まないため。
translation_notes:
  register: 明瞭で現代的かつ品位のある標準語を用いた。「あなたには忍耐があり」で直接的な称賛を保ち、「耐え抜いてきた」と「疲れ果ててはいない」によって二つの動詞を区別した。ギリシア語の接続詞の連続は、日本語として読みやすい二文に整えつつ、後半の追加的な称賛を「そして」で明示した。
