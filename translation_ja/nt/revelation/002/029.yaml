id: REV.2.29
reference: Revelation 2:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: ja
  text: 耳のある者は、御霊が諸教会に語ることを聞きなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 耳のある者は
  rationale: 定冠詞と現在分詞による実質的な名詞表現を、単数のことわざ的な呼びかけとして自然な日本語にした。「耳を持つ者」よりも慣用的であり、聞いて応答する力という含意も保つ。
- source_word: ἀκουσάτω
  choice: 聞きなさい
  rationale: 三人称単数のアオリスト命令形。その命令と厳粛な勧告の力を、現代日本語で明確かつ自然に表す。
- source_word: τί
  choice: ことを
  rationale: 御霊が語る内容全体を受ける関係表現として、日本語では「語ることを」が自然である。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 黙示録2―3章の反復句では、諸教会に語る神の霊を指す。日本語には大文字・小文字の区別がないため、「御霊」によって神的な指示対象を示しつつ、原文にない説明語を加えることを避けた。
- source_word: λέγει
  choice: 語る
  rationale: 現在形の継続的・特徴的な発話を表す。「言う」も可能だが、諸教会への厳粛な告知という文脈には「語る」が適する。
- source_word: ταῖς ἐκκλησίαις
  choice: 諸教会に
  rationale: 複数形を明示し、黙示録2―3章で宛先となる各地の信徒共同体を簡潔に表す。「諸」はやや改まった表現だが、聖書本文の品位と複数性を保つ。
theological_decisions:
- issue: τὸ πνεῦμα の指示対象
  choice: 神の霊を示す「御霊」
  alternative: 一般的な「霊」、または明示的な「聖霊」
  rationale: 文脈上は諸教会に語る神の霊である。「霊」だけでは現代日本語で指示対象が曖昧になりやすい一方、「聖霊」は原文にない「聖」を明示的に補う。「御霊」は文脈上の神的指示を保ち、過度な説明を避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、反復される厳粛な呼びかけとしての格調を保った。「聞きなさい」は直接的だが過度に古風ではなく、「諸教会」「御霊」は黙示録の礼拝的・預言的文脈にふさわしい。
