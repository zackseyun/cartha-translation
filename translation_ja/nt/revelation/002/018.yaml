  source_fidelity: 原文の宛先句（「ティアティラにある教会の御使いに」）、命令（「書き送れ」）、発話者の称号（「神の子」）、目と足の比喩を過不足なく反映している。「また」は Καὶ を自然に受けている。χαλλκολίβανον（χαλλκολιβάνῳ）の金属名が厳密には不確定である点も、本文の「精錬された青銅」と脚注の留保の組合せで透明に扱われている。
