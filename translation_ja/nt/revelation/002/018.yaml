id: REV.2.18
reference: Revelation 2:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: ja
  text: 'また、ティアティラにある教会の御使い[a]に書き送れ。


    『神の子、燃える炎のような目を持ち、その足が精錬された青銅[b]のような方が、こう言われる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「使者」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: 原語は希少な語で、精錬されて光り輝く金属または合金を、より広く指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 御使い
  rationale: 黙示録における七つの教会への定型的な呼びかけと黙示文学的文脈を踏まえ、「御使い」とした。ただし「使者」も語義上可能なので脚注に残した。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: ここではキリスト者の共同体を指すため、現代日本語で自然かつ定着している「教会」とした。
- source_word: Τάδε λέγει
  choice: こう言われる
  rationale: 預言的な告知の定型を、威厳を保ちながら自然な現代日本語で表した。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: 明示されたキリスト論的称号を省略や言い換えなしに訳した。
- source_word: ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: 燃える炎のような目を持ち
  rationale: 所有を表す分詞と火の炎という直喩を保ちつつ、日本語として重複感の少ない表現にした。
- source_word: οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ
  choice: その足が精錬された青銅のような
  rationale: 希少語 χαλκολίβανον が示す、精製され光沢を帯びた金属のイメージを表した。材質の厳密な同定には不確かさがあるため脚注を付した。
theological_decisions:
- issue: 語り手による直接的なキリスト論的自己提示
  choice: 神の子
  alternative: 機能的な称号への意訳
  rationale: 原文が明示する「神の子」という称号をそのまま保ち、弱めたり教派的説明を加えたりしなかった。
- issue: 教会宛ての呼びかけにおける ἀγγέλῳ の指示対象
  choice: 御使い
  alternative: 使者
  rationale: 黙示録の文脈で自然な「御使い」を本文に置きつつ、人間の使者を指す可能性も排除せず脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、王の布告や預言的宣言を思わせる荘重さを保った。「書き送れ」「こう言われる」により、七つの教会への告知に共通する定型感を示した。
