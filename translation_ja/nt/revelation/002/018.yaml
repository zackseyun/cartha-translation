  terminology: 「教会」「神の子」は定着した適切な用語である。「御使い」は黙示録の文脈に合う伝統的かつ理解可能な訳語であり、「使者」という語義上の代案も脚注で保持されている。金属語の不確実性を脚注で示す処理も適切である。
