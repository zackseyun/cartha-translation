id: REV.2.14
reference: Revelation 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: ja
  text: しかし、あなたを責めることがいくつかある。あなたのところには、バラムの教えを固く守っている者たちがいる。バラムは、イスラエルの子ら[a]の前につまずきとなるものを置き、彼らに偶像に献げられた食べ物を食べさせ、不品行を行わせるよう、バラクを教えていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの子ら」は、「イスラエルの民」または「イスラエル人」とも訳せる。ギリシア語は直訳すると「イスラエルの息子たち」。
    reason: 原文の字義と、集団呼称として自然な日本語訳の選択肢を示すため。
lexical_decisions:
- source_word: ὀλίγα
  choice: 責めるべきことが少し
  rationale: 中性複数の実質名詞的用法を日本語で自然に補い、「あなたに対して持つ」の対立・非難の意味を明確にした。
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: 教えを固く守る者たち
  rationale: κρατέωがここでは教説への強い固執・堅持を表すため、「固く守る」とした。
- source_word: Βαλαάμ / Βαλὰκ
  choice: バラム／バラク
  rationale: 日本語聖書で広く定着した人名表記を採用した。
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: バラクに…よう教えていた
  rationale: 未完了過去の継続的・特徴的な側面を「教えていた」で表した。
- source_word: βαλεῖν σκάνδαλον
  choice: つまずきとなるものを置き
  rationale: σκάνδαλονの比喩を保ちつつ、現代日本語で意味が通る形にした。
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: イスラエルの子ら
  rationale: 原文の「子ら」を保ち、伝統的な集団呼称として訳した。
- source_word: φαγεῖν εἰδωλόθυτα
  choice: 偶像に献げた物を食べさせ
  rationale: εἰδωλόθυταの祭儀的意味を明示し、バラクがイスラエルを陥れるという統語関係に沿って使役形で自然に表した。
- source_word: πορνεῦσαι
  choice: 淫らな行いをさせる
  rationale: 不正な性的行為を広く指す語義を保ち、前項と並ぶ使役的な内容として訳した。
theological_decisions:
- issue: σκάνδαλονを比喩のまま訳すか、罠・罪への誘惑と解釈して訳すか
  choice: つまずきとなるもの
  alternative: 罠／罪に誘うもの
  rationale: 道徳的・霊的転倒を招くという比喩を保存し、具体的な仕掛けへ狭めないため。
- issue: τῶν υἱῶν Ἰσραήλの表現
  choice: イスラエルの子ら
  alternative: イスラエルの民／イスラエル人
  rationale: 原文の男性複数名詞を形式上保ちながら、共同体全体を指す聖書的呼称としての含みを脚注で示した。
- issue: 不定詞 φαγεῖν と πορνεῦσαιの主体・機能
  choice: イスラエルの子らに食べさせ、淫らな行いをさせるよう教えた
  alternative: イスラエルの子らが食べ、淫らな行いをするためのつまずきを置いた
  rationale: 文脈上、二つの不定詞はバラクが彼らを陥れた具体的内容を示す。日本語では使役形が関係を明瞭にするが、つまずきの結果・目的という原文の結び付きは維持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、黙示録の厳粛な叱責の調子を保った。「あなたのところには」「固く守る」で原文の対照と継続的な固執を表現した。脚注標識[a]は本文末に配置し、節全体を妨げずに「イスラエルの子ら」に対応させた。
