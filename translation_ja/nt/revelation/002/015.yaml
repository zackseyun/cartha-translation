reference: Revelation 2:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὕτως ἔχεις καὶ σὺ κρατοῦντας τὴν ⸀διδαχὴν Νικολαϊτῶν ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/015.yaml
  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: ja
  text: このように、あなたのところにも、ニコライ派の教えを同じように守っている者たちがいる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「同じように」は、前節で述べられた者たちとの比較として文全体にかかるとも、ニコライ派の教えを「守っている」ことにかかるとも取れる。
    reason: ὁμοίωςの修飾範囲に関する原文の曖昧さを示すため。
lexical_decisions:
- source_word: οὕτως
  choice: このように
  rationale: 前節の叱責を受けた比較を示しつつ、原文の指示的・比較的な働きを保つ。
- source_word: ἔχεις καὶ σὺ
  choice: あなたのところにも……者たちがいる
  rationale: 直訳的な「あなたも持っている」より自然な日本語で、共同体の中にそのような者たちがいるという文脈上の意味と、καὶ σὺ の「あなたのところにも」という強調を表す。
- source_word: κρατοῦντας
  choice: 堅く守る者たち
  rationale: ある教えを手放さず保持する意味を表す。「従う」ほど実践面に限定せず、κρατέω の保持・固守のニュアンスを保つ。
- source_word: τὴν διδαχὴν Νικολαϊτῶν
  choice: ニコライ派の教え
  rationale: διδαχήを現代の一般読者に明瞭な「教え」とし、集団名は日本語聖書で理解しやすい「ニコライ派」とした。
- source_word: ὁμοίως
  choice: 同じように
  rationale: 前節との比較を明示する一方、教えを守る仕方にかかる可能性も残す位置に置いた。
theological_decisions:
- issue: ὁμοίωςがどこにかかるか
  choice: 「ニコライ派の教えを同じように堅く守る」として、直近の分詞句に結びつき得る語順にする
  alternative: 「同じように、あなたのところにもニコライ派の教えを堅く守る者たちがいる」とし、文全体を前節と比較する
  rationale: ギリシア語では、ὁμοίωςが「守る」仕方を修飾するのか、前節との比較として文全体にかかるのかに若干の幅がある。本文ではこの曖昧さを完全には解消せず、注で別の係り方を示す。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、キリストの直接的な叱責にふさわしい簡潔で厳粛な調子を保った。
