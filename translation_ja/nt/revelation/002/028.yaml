  text: ὡς κἀγὼ εἴληφα παρὰ τοῦ πατρός μου, καὶ δώσω αὐτῷ τὸν ἀστέρα τὸν πρωϊνόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: ja
  text: わたし自身もわたしの父から受けたように、わたしはその人に明けの星[a]を与える。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「明けの明星」とも訳せる。この表現は、王であるメシアに関わるイメージを踏まえている可能性があり、また、イエスが御自身を「輝く明けの星」と呼ぶ22章16節と関連している可能性もある。
    reason: 語彙上の別訳と本文内の関連の可能性を示しつつ、象徴の意味を一つに限定しないため。
lexical_decisions:
- source_word: ὡς
  choice: 同じように
  rationale: 比較・対応を表す語として、直前の約束と、御子が父から受けたものとの対応関係を自然な日本語で示す。
- source_word: κἀγὼ
  choice: わたし自身も
  rationale: καὶ ἐγώの付加的な意味と代名詞の強調をともに保つ。
- source_word: εἴληφα
  choice: 受けた
  rationale: 父を源とする受領を表す。ギリシア語の完了形が示す現在に及ぶ結果は文脈から理解でき、日本語では自然な過去形で表した。
- source_word: παρὰ τοῦ πατρός μου
  choice: 父から
  rationale: 属格を伴うπαράが示す源・起点を簡潔に訳し、原文の父子関係を説明的に膨らませない。日本語では話者との関係が明らかなため、「わたしの」は省いても「父」の意味は保たれる。
- source_word: καὶ δώσω αὐτῷ
  choice: さらに、わたしはその人に…を与える
  rationale: καίを新たな約束を加える接続として表した。αὐτῷは直前の文脈にある「勝利を得る者」を指すが、本文では解釈的な名詞に置き換えず「その人」とした。
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: 明けの星
  rationale: 夜明けに見える星という比喩を、明瞭でありながら格調を失わない現代日本語で保持した。象徴の意味は本文中で限定しない。
theological_decisions:
- issue: 「明けの星」の正体と意味
  choice: 比喩を「明けの星」のまま残し、本文では正体を明示しない。
  alternative: 王的・メシア的勝利の象徴、キリスト御自身、または終末的な栄光や報いを指すと明示する。
  rationale: この節自体は象徴を定義していない。黙示録22章16節との関連を含む複数の響きを保つため、本文では解釈を一つに限定せず、脚注で可能性を示す。
- issue: 「父から受けた」が示すキリスト論的関係
  choice: 受領と父子関係をそのまま訳し、何を受けたかについて本文で補足しない。
  alternative: 「父から権威を受けた」と明示する。
  rationale: 直前の文脈では権威が念頭にあるが、この節のギリシア語本文には目的語が明記されていない。文脈上の理解を可能にしつつ、本文への説明的な追加を避けた。
translation_notes:
  register: 明瞭な現代標準語を基本とし、「明けの星」で黙示文学の格調を保った。節頭のὡς節は直前の文にかかるため、ダッシュと断片的な構文を用いて、そのつながりを示しながら、後半の約束へ誤って直接結び付けないようにした。
