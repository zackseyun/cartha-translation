id: REV.2.27
reference: Revelation 2:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ ὡς τὰ σκεύη τὰ κεραμικὰ ⸀συντρίβεται,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/027.yaml
  text: and he will shepherd them with an iron rod[a], as clay vessels are shattered[b],
translation:
  language: ja
  text: そして、陶器の器が打ち砕かれるように、彼は鉄の杖で彼らを牧する[a]。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「鉄の杖で彼らを治める」。原語は字義的には羊飼いのように「牧する」という意味だが、ここでは詩篇2篇を踏まえ、王として治める意味も含む。
    reason: alternative_reading
  - marker: b
    text: 詩篇2:9への暗示。そこでは、諸国の民が陶器の器のように打ち砕かれる。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節から続く約束とのつながりを示す接続語として保持した。
- source_word: ποιμανεῖ
  choice: 牧する
  rationale: ποιμαίνωの羊飼いの比喩を保ちつつ、詩篇2篇を背景とする王の統治という含意も残すため、「治める」だけに限定しなかった。
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: 鉄の杖で
  rationale: ῥάβδοςは杖、棒、王笏を指し得るが、詩篇2篇との語像上のつながりと力ある権威を簡潔に伝える表現を選んだ。
- source_word: ὡς
  choice: ように
  rationale: 後続する比較を自然な現代日本語で示した。
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: 陶器
  rationale: 陶土で作られた器を指す表現を、簡潔で自然な総称にした。器物であることと壊れやすさは文脈から明確である。
- source_word: συντρίβεται
  choice: 打ち砕かれる
  rationale: 激しく粉砕される意味と、ギリシア語の受動形を保った。中性複数主語に単数動詞が用いられるギリシア語の通常の一致は、日本語では数を明示せず自然に表した。
theological_decisions:
- issue: ποιμανεῖと鉄の杖による詩篇2:9の王的・メシア的暗示
  choice: 本文では「牧する」として羊飼いの比喩を保持し、王として治める意味を脚注で示した。
  alternative: 「鉄の杖で彼らを治める」と訳し、支配の意味を前面に出す。
  rationale: 原文は一般的な「治める」ではなくποιμαίνωを用いる。牧者としての働きと、裁きを伴う王的権威との緊張を一方に解消せず保つためである。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、羊飼いの原語像を保つため「牧する」を用いた。「鉄の杖」「打ち砕かれる」によって、簡潔で荘重な黙示文学の調子を保った。
