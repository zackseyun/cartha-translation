id: REV.2.17
reference: Revelation 2:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: ja
  text: 耳のある者は、霊が諸教会に語ることを聞きなさい。勝利を得る者[a]には、隠されたマナの一部を与えよう。また、その者に白い石[b]を与えよう。その石には新しい名が記されていて、その名を知るのは、受け取る者だけである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「打ち勝つ者」。
    reason: lexical_alternative
  - marker: b
    text: 「白い石」は、投票用の小石、無罪判決のしるし、または入場のしるしを連想させる可能性があるが、本文はどの背景を意図しているかを明示していない。
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: 耳のある者
  rationale: 単数形の「耳」を保ちつつ、黙示録で繰り返される呼びかけを自然な日本語で表した。
- source_word: ἀκουσάτω
  choice: 聞きなさい
  rationale: 三人称命令の力を、現代日本語の明瞭な勧告・命令表現で伝えた。
- source_word: τὸ πνεῦμα
  choice: 霊
  rationale: 文脈上は神の霊を指すが、原文に「聖」という語はないため、「聖霊」と補わず「霊」とした。
- source_word: ταῖς ἐκκλησίαις
  choice: 諸教会
  rationale: 黙示録の宛先である複数の信仰共同体を、定着した簡潔な語で表した。
- source_word: τῷ νικῶντι
  choice: 勝利を得る者
  rationale: νικάωの勝利・克服の意味を保ち、黙示録における継続的な勝利の主題が伝わる表現とした。
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: 隠されているマナの一部
  rationale: 属格の部分的な意味を「一部」で示し、完了分詞が表す、隠された状態にあることを「隠されている」で表した。
- source_word: ψῆφον λευκήν
  choice: 白い石
  rationale: 石、投票石、しるしなどの文化的背景を本文で特定せず、語の基本的な像を保った。
- source_word: ἐπὶ τὴν ψῆφον
  choice: その石には
  rationale: 名が石の上に記されているという位置関係を、自然な日本語で示した。
- source_word: ὄνομα καινὸν γεγραμμένον
  choice: 新しい名が記されており
  rationale: καινόςを「新しい」、完了分詞を結果状態が続く「記されており」で表した。
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: その名は、それを受け取る者のほかは誰も知らない
  rationale: 関係代名詞が「名」を受けることを「その名は」で明示し、受領者だけが知るという限定を保った。何を受け取るかは原文でも明示されないため、「それ」で曖昧さを残した。
theological_decisions:
- issue: τῷ νικῶντι の意味範囲
  choice: 勝利を得る者
  alternative: 打ち勝つ者／克服する者
  rationale: 軍事的勝利だけに狭めず、忠実に耐えて勝つという黙示録の広い含意を保った。別訳を脚注に示した。
- issue: ψῆφος λευκή の象徴的背景
  choice: 白い石
  alternative: 無罪判決のしるし／入場のしるし／投票用の小石
  rationale: 本文自体は象徴の具体的背景を説明していないため、一つの解釈に決めず、可能性を脚注に示した。
- issue: 「新しい名」と受領者との関係
  choice: その名は、それを受け取る者のほかは誰も知らない
  alternative: 受け取る者だけがその名を知っている
  rationale: 原文の限定構文を保ちつつ、「それ」が石を指すのか、名を含む賜物全体を指すのかを過度に限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「耳のある者」「隠されているマナ」「白い石」など原文の象徴表現は説明的に言い換えず、そのまま保持した。長いギリシア語文は日本語の可読性のため三文に分けたが、論理関係と反復された「与えよう」は維持した。
