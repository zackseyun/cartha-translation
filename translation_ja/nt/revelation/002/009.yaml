id: REV.2.9
reference: Revelation 2:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: ja
  text: わたしは、あなたの苦難と貧しさを知っている。しかし、あなたは豊かである。さらに、自分たちはユダヤ人だと言っているのに、そうではない者たちからの中傷[a]も知っている。彼らはサタンの会堂[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「中傷」は「冒涜」とも訳せる語。ここでは信者たちに向けられた敵対的な悪口や非難を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「サタンの会堂」。ここで「会堂」と訳した語は、「集まり」または「集会」を意味することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: 苦難
  rationale: 圧迫、苦しみ、患難を表す語。終末論的な専門用語に狭めず、迫害を含み得る苦しみを自然な現代日本語で表す。
- source_word: πτωχείαν
  choice: 貧しさ
  rationale: 物質的な貧困を明瞭に示し、続く「豊かである」との鋭い対照を保つ。
- source_word: πλούσιος
  choice: 豊かである
  rationale: 何において豊かなのかを原文は明示しないため、「霊的に」などを補わず、含意と逆説を保つ。
- source_word: βλασφημίαν
  choice: 中傷
  rationale: この文脈では信者たちに向けられた敵対的で名誉を傷つける言葉を指す。「冒瀆」だけでは現代日本語で神に対する発言と受け取られやすいため、本文では「中傷」とする。
- source_word: ἐκ τῶν λεγόντων
  choice: ……と言う者たちから受ける
  rationale: ἐκが示す発言の源を日本語で明確かつ自然に表す。「受ける」は日本語の統語上補った語であり、中傷の向け先が「あなた」であるという文脈を示す。
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: 自分はユダヤ人だと言いながら
  rationale: 再帰的な構文を自然に反映しつつ、「ユダヤ人」を別の概念に言い換えない。
- source_word: συναγωγὴ
  choice: 会堂
  rationale: ユダヤ人の集会・共同体という歴史的、語彙的な含みを保つ。「集まり」も可能であるため脚注で示す。
- source_word: τοῦ Σατανᾶ
  choice: サタンの
  rationale: 属格の簡潔で強い表現を保ち、「サタンに属する」などと解釈的に展開しない。
theological_decisions:
- issue: 「ユダヤ人だと言いながら、実はそうではない」という論争的表現
  choice: 「ユダヤ人」をそのまま訳し、原文どおりの対比を保つ。
  alternative: 「神の民だと主張する者」「真のユダヤ人だと言う者」
  rationale: Ἰουδαίουςは明示的に「ユダヤ人」を意味する。民族性の否定なのか契約上の真正性についての判断なのかを本文で決めず、原文の神学的緊張を残す。
- issue: 「豊かである」の性質
  choice: 「霊的に」などの限定を加えない。
  alternative: 「霊的には豊かである」
  rationale: 物質的な貧しさとの対照から非物質的な豊かさが示唆されるが、原文の述語には限定がないため、含意を明文化しない。
- issue: 「サタンの会堂」という表現
  choice: 強い比喩的・論争的表現を保持する。
  alternative: 「サタンに属する集団」
  rationale: 原文の属格と「会堂」の語を保ちつつ、その関係を説明的に限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「わたし」「あなた」を用いて語りかけの調子を保った。長いギリシャ語文は日本語として理解しやすいよう二文に分けたが、「知っている」が苦難、貧しさ、中傷のすべてに及ぶ構造を維持した。脚注記号は該当語句の直後と文末に配置した。
