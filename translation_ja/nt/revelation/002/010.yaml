id: REV.2.10
reference: Revelation 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: ja
  text: あなたが受けようとしている苦しみを、少しも恐れてはならない。見よ、悪魔があなたがたのうち何人かを牢に投げ込もうとしている。あなたがたが試されるためである[a]。あなたがたは十日間、苦難を受けることになる。死に至るまで忠実でありなさい[b]。そうすれば、わたしはあなたに命の冠[c]を与える。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑されるため」、または「試練に遭うため」とも訳せる。ギリシア語の動詞は、文脈により、試すこと、試練に遭わせること、誘惑することを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「死に至るまで」は、「死ぬほどの目に遭っても」という意味にも取れ、殉教を求められる場合にも忠実であることを含み得る。
    reason: alternative_reading
  - marker: c
    text: ここで「冠」と訳したギリシア語ステファノスは、王の冠ではなく、競技などの勝者に与えられる花冠や勝利の栄冠を指す。
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: 少しも恐れてはならない
  rationale: μηδένを伴う禁止命令の全面的な否定を、自然で格調ある現代日本語で表した。
- source_word: ἃ μέλλεις πάσχειν
  choice: あなたが受けようとしている苦しみ
  rationale: μέλλωの切迫した未来とπάσχωの苦しみを受ける意味をともに保った。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 後続内容への注意を強く促す談話標識として、聖書本文にふさわしく簡潔な表現を選んだ。
- source_word: μέλλει βάλλειν
  choice: 投げ込もうとしている
  rationale: μέλλωの目前性とβάλλωの力強い動作を保ちつつ、牢への収監を表す自然な日本語とした。
- source_word: ὁ διάβολος
  choice: 悪魔
  rationale: この文脈では人格的な超自然的敵対者を指す定着した呼称が適切である。
- source_word: ἐξ ὑμῶν
  choice: あなたがたのうち何人か
  rationale: 共同体全員ではなく、その中から選ばれる一部を示す部分の意味を明示した。
- source_word: εἰς φυλακήν
  choice: 牢に
  rationale: φυλακήの拘禁・投獄の意味を、文脈の重さに合う簡潔な語で表した。
- source_word: ἵνα πειρασθῆτε
  choice: あなたがたが試されるため
  rationale: 迫害と投獄によって信仰が試験にさらされる文脈を優先したが、「誘惑される」という語義の可能性は脚注に残した。
- source_word: ἕξετε θλῖψιν
  choice: あなたがたには苦難がある
  rationale: θλῖψιςの圧迫を伴う深刻な苦しみを表し、単なる「困難」より重い語を選んだ。
- source_word: ἡμερῶν δέκα
  choice: 十日間
  rationale: 期間を示す属格を自然な日本語で表した。
- source_word: γίνου πιστός
  choice: 忠実でありなさい
  rationale: 忠実な状態に入り、それを保つよう求める命令を、過度な解釈を加えず簡潔に訳した。
- source_word: ἄχρι θανάτου
  choice: 死に至るまで
  rationale: 死まで忠実であることを直接表し、殉教を含み得る強い含意を限定せず保った。
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: 命の冠
  rationale: 属格の関係を解釈で限定せず、勝利者に与えられる冠と命との結び付きを保持した。
theological_decisions:
- issue: πειρασθῆτεが、悪魔による迫害の文脈で何を意味するか
  choice: 試される
  alternative: 誘惑される／試練に遭う
  rationale: 投獄と苦難が信仰の真実を試すという文脈に最もよく合う一方、動詞が持つ誘惑の意味を脚注で保持した。
- issue: ἄχρι θανάτουの範囲
  choice: 死に至るまで
  alternative: 死ぬほどの目に遭っても／死を覚悟して
  rationale: 生涯の終わりまでの忠実さと、殉教を求められる場合の忠実さの両方を含み得るため、本文では広い表現を採用した。
- issue: τῆς ζωῆςがστέφανονに対して持つ関係
  choice: 命の冠
  alternative: 命という冠／命を与える冠
  rationale: 冠が命そのものなのか、命を授けるしるしなのかを本文で一義的に決めず、ギリシア語の簡潔さと神学的含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、命令と約束の厳粛さを保つため「見よ」「牢」「死に至るまで」など簡潔で格調ある表現を用いた。「あなた」と「あなたがた」を原文の単数・複数に従って区別し、共同体への告知と個人への約束の移行を保持した。
