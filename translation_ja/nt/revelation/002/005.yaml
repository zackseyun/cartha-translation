id: REV.2.5
reference: Revelation 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: ja
  text: だから、あなたがどこから落ちたのかを思い起こし[a]、悔い改めて、初めの行いをしなさい。そうでなければ、わたしはあなたのもとに来て、あなたが悔い改めないかぎり、あなたの燭台をその場所から取り除く[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どれほど高い所から落ちたのか」。ギリシア語は直訳すると「どこから落ちたのか」であり、高さの比喩が含意されていると解することもできる。
    reason: lexical_alternative
  - marker: b
    text: 「燭台」は、黙示録1章20節で教会を表すものとして用いられている。
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: 思い起こし
  rationale: 現在命令形の継続的な含みを保ちつつ、後続する命令と自然につながる現代日本語とした。
- source_word: οὖν
  choice: だから
  rationale: 直前の叱責を受けた帰結を、明瞭で自然な接続語によって示す。
- source_word: πόθεν πέπτωκας
  choice: どこから落ちたのか
  rationale: 「どれほど高い所から」と解釈的に補わず、原文の場所を表す語と転落の比喩を保持する。完了形が示す現在に及ぶ結果も日本語の「落ちた」で文脈上伝わる。
- source_word: μετανόησον / μετανοήσῃς
  choice: 悔い改めて／悔い改めないなら
  rationale: 道徳的・霊的な方向転換を表す、聖書日本語として定着しつつ現在も理解可能な表現を用いた。
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: 初めのころの行いをしなさい
  rationale: πρῶταの時間的意味を明示し、かつ「行い」という具体性を保った。
- source_word: εἰ δὲ μή
  choice: そうしなければ
  rationale: 先行する複数の命令に応じる警告条件を、日本語で自然かつ明確に表す。
- source_word: ἔρχομαί σοι
  choice: わたしはあなたのもとに行き
  rationale: 現在形の切迫感を保ちつつ、「敵対して」という原文に明示されない意味は加えない。
- source_word: κινήσω
  choice: 取り除く
  rationale: 語義は「動かす」だが、「その場所から」と裁きの文脈を合わせると、位置からの除去を意味するため。
- source_word: τὴν λυχνίαν σου
  choice: あなたの燭台
  rationale: λυχνίαは灯火そのものではなく、それを載せる台を指す。黙示録1章20節との象徴的連関も保持する。
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: その場所から
  rationale: 燭台が置かれた位置から移されるという具体的な像を簡潔に保持する。
theological_decisions:
- issue: 燭台を取り除くという警告の性質
  choice: 教会を表す燭台がその場所から取り除かれるという象徴を、そのまま保持する。
  alternative: 教会の証しの喪失、教会としての地位・存続への裁き、または個人の救いの喪失と明示する。
  rationale: 黙示録1章20節は燭台を諸教会と同定するが、本節は組織的神学上の帰結を限定していない。そのため、象徴と警告の緊張を解消せずに残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、命令と警告にふさわしい厳粛さを保った。「燭台」「悔い改める」は聖書的な像と意味を正確に伝えるため保持した。末尾の条件句は、日本語で指示対象を明確にするため「あなたが悔い改めないなら、そうする」とした。
