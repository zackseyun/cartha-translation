id: REV.2.20
reference: Revelation 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: ja
  text: しかし、あなたに対して責めるべきことがある。あなたは、イゼベルという女[a]を容認している。彼女は自らを女預言者と称し[b]、教えを説き、私の奴隷たちを惑わして[c]、性的な不道徳を行わせ、偶像に供えられた食べ物を食べさせている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては「イゼベルという女」ではなく、「あなたの妻イゼベル」とあります。
    reason: textual_variant
  - marker: b
    text: 別訳「自分は女預言者だと主張し」。
    reason: lexical_alternative
  - marker: c
    text: 「惑わして」は「迷わせて」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の称賛と鋭く対照させる逆接として、現代日本語で自然かつ格調を保つ。
- source_word: ἔχω κατὰ σοῦ
  choice: あなたに対して責めるべきことがある
  rationale: 相手への非難・告発を表すギリシア語の慣用表現を、明瞭な日本語にした。
- source_word: ἀφεῖς
  choice: 容認している
  rationale: 有害な活動が続くのを許しているという、責任を伴う放任の意味を示す。
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: あの女イゼベル
  rationale: 本文の「女」を明示しつつ、日本語で非難対象を指し示す自然な表現とした。異読「あなたの妻」は脚注に示す。
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: 自らを女預言者と称し
  rationale: 本人による自己申告であることと、προφῆτινの女性形を保持する。
- source_word: διδάσκει καὶ πλανᾷ
  choice: 教えて惑わし
  rationale: 継続的な教示と、真理・正しい行いから逸脱させる働きの双方を簡潔に表す。
- source_word: τοὺς ἐμοὺς δούλους
  choice: 私の奴隷たち
  rationale: 所有・帰属を示す「私の」と結びつくため、δοῦλοςの隷属と主人への所属という強い意味を保持する。
- source_word: πορνεῦσαι
  choice: 淫らな行いをさせ
  rationale: 不法な性的行為を指す語を、現代の一般読者に理解できる簡潔で品位ある表現にした。
- source_word: φαγεῖν εἰδωλόθυτα
  choice: 偶像に献げた物を食べさせている
  rationale: 異教の祭儀で偶像に供えられた食物という意味を自然な日本語で示す。二つの不定詞がπλανᾷの内容・結果を表す構造を使役形で再現した。
theological_decisions:
- issue: 「イゼベル」の同定
  choice: 本文どおり「イゼベル」とし、実名か旧約のイゼベルを想起させる象徴的呼称かを限定しない
  alternative: 実名の女性、または象徴的な異名と明示する
  rationale: この節だけではいずれとも確定できないため、解釈上の曖昧さを保持する。
- issue: δοῦλοςの訳語
  choice: 奴隷
  alternative: 僕、しもべ、奉仕者
  rationale: 「私の」とともにキリストへの所有・帰属が前面に出ており、原語の強い隷属概念を薄めないため。
- issue: πορνεῦσαιの射程
  choice: 淫らな行い
  alternative: 性的な不品行、霊的姦淫
  rationale: 語の直接的な性的意味を訳し、偶像礼拝の比喩だけに限定する解釈を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、叱責の厳粛さを保った。「女預言者」は原文の女性形を明示し、「奴隷」は所属と隷属の強さを保持する。脚注記号は該当語句の直後に配置した。
