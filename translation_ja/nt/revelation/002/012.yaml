id: REV.2.12
reference: Revelation 2:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: ja
  text: また、ペルガモにある教会の天使に、こう書き送れ。「鋭い両刃の剣を持つ方が、こう言われる。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天使」は「使者」とも訳せる。天上の存在を指すのか、教会を代表する人間を指すのかについては、解釈が分かれる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 御使い
  rationale: 「使者」と「天使」の双方を表し得る語だが、黙示録の七教会への呼びかけでは伝統的かつ自然な「御使い」を採り、指示対象が天的存在か人間の代表者かという曖昧さは脚注に残した。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: ここではキリスト者の共同体を指すため、現代日本語で明瞭な「教会」とした。
- source_word: γράψον
  choice: 書き送れ
  rationale: 命令の直接性を保ちつつ、教会宛ての文書を書いて届ける文脈に自然な日本語とした。
- source_word: Τάδε λέγει
  choice: こう言われる
  rationale: 預言的・権威的な宣言を導入する定型句として、現代日本語で自然かつ荘重な表現を選んだ。
- source_word: ὁ ἔχων
  choice: 持つ方
  rationale: 冠詞付き分詞の称号的な働きを保ち、敬意ある自然な日本語にした。
- source_word: ῥομφαίαν
  choice: 剣
  rationale: 大型の剣を指し得るが、種類を過度に限定せず、修飾語の鮮明さを生かすため「剣」とした。
- source_word: δίστομον
  choice: 両刃の
  rationale: 字義は「二つの口を持つ」だが、剣については「両刃の」が自然で正確である。
- source_word: ὀξεῖαν
  choice: 鋭い
  rationale: 剣の切れ味を示す基本的で明瞭な訳語である。
- source_word: Περγάμῳ
  choice: ペルガモ
  rationale: 日本語聖書で定着した地名表記を採用した。
theological_decisions:
- issue: 教会の「御使い」の正体
  choice: 本文では「御使い」とし、天的存在か人間の代表者かを特定しない。
  alternative: 「使者」、教会指導者、天的な代表者
  rationale: ἄγγελος は天使にも人間の使者にも用いられ、この節だけでは指示対象が確定しないため、本文で解釈を固定せず脚注で別訳と論点を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令と宣言の荘重さを保った。「こう言われる」は黙示録2―3章で繰り返される定型句として統一しやすい表現である。
