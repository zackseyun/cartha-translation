id: REV.2.13
reference: Revelation 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: ja
  text: わたしは、あなたがどこに住んでいるかを知っている。そこにはサタンの王座がある。それでもあなたは、わたしの名を堅く守り、わたしへの信仰[a]を否認しなかった。あなたがたの間で殺された、わたしの証人[b]、わたしの忠実な者アンティパスの時代にも、そうであった。そこはサタンが住んでいる場所である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「わたしの信仰」。この句は「わたしへの信仰」、または「わたしの忠実さ」とも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「殉教者」とも訳せる。ギリシア語は基本的に「証人」を意味するが、苦難や死の文脈では「殉教者」の意味も帯びうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: 知っている
  rationale: 完了形の現在的意味を、現代日本語で直接的かつ自然に表した。
- source_word: κατοικεῖς
  choice: 住んでいる
  rationale: 場所に居住する意味を平明な現代語で表した。
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: そこにはサタンの王座がある
  rationale: 黙示的な比喩を説明で弱めず、そのまま保持した。
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: わたしの名をしっかり保ち
  rationale: κρατέωの堅く保持する含意を示しつつ、「名」という原文の表現を保った。
- source_word: οὐκ ἠρνήσω
  choice: 否定しなかった
  rationale: ἀρνέομαιの意味を自然に表し、「捨てる」などの解釈的な言い換えを避けた。
- source_word: τὴν πίστιν μου
  choice: わたしへの信仰
  rationale: この文脈では目的語的属格として理解するのが自然であり、日本語でも意味が明瞭になる。ただし属格の別解釈は脚注に残した。
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: アンティパスが…殺された日々においてさえ
  rationale: 「アンティパスの日々」という不自然な直訳を避け、周囲の同格句と関係節を踏まえて時間表現を明確にした。本文異読を踏まえた「さえ」のニュアンスも保持した。
- source_word: ὁ μάρτυς μου
  choice: わたしの証人
  rationale: μάρτυςの基本義を採用し、殉教という後代の専門的響きを本文に先取りして持ち込まなかった。
- source_word: ὁ πιστός μου
  choice: わたしの忠実な者
  rationale: 前の「証人」と安易に一語へまとめず、同格的な強調を保った。
- source_word: ἀπεκτάνθη
  choice: 殺された
  rationale: 受動態を簡潔に再現し、「処刑」「虐殺」など原文以上の含意を加えなかった。
- source_word: παρ’ ὑμῖν
  choice: あなたがたのところで
  rationale: 教会自身が殺害者だったとの誤解を避けつつ、その共同体のいる場所で起きたことを表した。
theological_decisions:
- issue: τὴν πίστιν μου の属格の意味
  choice: 本文では「わたしへの信仰」
  alternative: 「わたしの信仰」または「わたしの真実」
  rationale: この発言の文脈ではキリストへの信仰を否定しなかったという理解が最も自然である。一方、ギリシア語の簡潔な属格表現には複数の理解があり得るため、脚注で曖昧さを明示した。
- issue: 死の文脈における μάρτυς
  choice: 証人
  alternative: 殉教者
  rationale: 基本義を本文に置き、殺されたという文脈から生じる「殉教者」の含みは脚注で保存した。
translation_notes:
  register: 平明で現代的ながら、黙示文学にふさわしい荘重さを保った。「わたし」「あなたがた」を用い、比喩や反復を説明的に解消しない方針とした。
