id: REV.2.23
reference: Revelation 2:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: ja
  text: また、わたしは彼女の子どもたちを死によって殺す[a]。こうして、すべての教会は、わたしが人の思いと心を探る者であることを知る[b]。そして、あなたがた一人ひとりに、その行いに応じて報いる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「疫病によって」とも訳せる。ギリシア語は字義どおりには「死によって」と述べており、裁きの厳しさを強調する表現、または旧約聖書の裁きの表現を響かせたものとも考えられる。
    reason: lexical_alternative
  - marker: b
    text: 字義的には「腎臓と心」。聖書的な慣用表現で、人の隠れた内面、すなわち動機、思い、願いなどを指す。
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: 子どもたち
  rationale: 「子ども」または「子孫」を意味する。実子とも比喩的な追随者とも取り得る原文の曖昧さを保つため、「子どもたち」とした。
- source_word: ἀποκτενῶ ἐν θανάτῳ
  choice: 死によって殺す
  rationale: 直訳的で異例な「死によって殺す」という表現を残し、裁きの強調と旧約的な響きを保った。「疫病によって殺す」という解釈は脚注に示した。
- source_word: ἐκκλησίαι
  choice: 教会
  rationale: 黙示録で呼びかけられているキリスト者の諸共同体を指す標準的な訳語。
- source_word: ὁ ἐραυνῶν
  choice: 探る者
  rationale: 隠れた内面を徹底して調べる継続的・司法的な働きを表す分詞の力を簡潔に伝える。
- source_word: νεφροὺς καὶ καρδίας
  choice: 人の思いと心
  rationale: 字義は「腎臓と心」だが、聖書的慣用句として動機、思考、感情、願いを含む内面全体を指す。現代日本語で意味が通るよう「思いと心」とし、字義を脚注で説明した。
- source_word: δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν
  choice: あなたがた一人ひとりに、その行いに応じて報いる
  rationale: δώσω は字義的には「与える」だが、ここでは行いに応じた裁き・応報を表すため、日本語として自然な「報いる」とした。ἔργα は具体的な行為を指す「行い」と訳した。
theological_decisions:
- issue: 語り手が人の内面を探る者として自己を示すこと
  choice: 「わたしが人の思いと心を探る者」とし、復活したイエスによる司法的な全知の主張を保った。
  alternative: 単に「人のことをよく知っている」と弱めて意訳する。
  rationale: 原文の強い自己同定と、隠れた内面を吟味する権威を薄めずに示す必要がある。
- issue: 「彼女の子どもたち」の意味
  choice: 実子か比喩的な追随者かを本文では限定しない。
  alternative: 「彼女の弟子たち」または「彼女の実の子どもたち」と明示する。
  rationale: 文脈上は追随者を指す可能性があるが、τέκνα 自体はどちらか一方に確定しないため、曖昧さを保持した。
- issue: 「死によって」の意味
  choice: 異例な原文表現を本文に残す。
  alternative: 「疫病によって」と解釈して本文に採用する。
  rationale: 七十人訳的な背景から「疫病」は有力な解釈だが、ギリシア語だけでは確定できず、裁きの強調表現である可能性もあるため。
translation_notes:
  register: 明瞭で厳粛な現代標準日本語。裁きの強い語調を保ちつつ、不自然な逐語訳は必要最小限にとどめた。
