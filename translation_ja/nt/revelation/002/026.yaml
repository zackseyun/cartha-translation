id: REV.2.26
reference: Revelation 2:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ νικῶν καὶ ὁ τηρῶν ἄχρι τέλους τὰ ἔργα μου, δώσω αὐτῷ ἐξουσίαν ἐπὶ τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: ja
  text: また、勝利を得、最後までわたしのわざを守る者には、諸国を治める権威を与えよう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ νικῶν
  choice: 勝利を得る者
  rationale: 冠詞付き現在分詞を、その人を特徴づける継続的な表現として訳した。「勝つ者」より自然でありつつ、黙示録に通底する戦いと勝利の比喩を保つ。
- source_word: ὁ τηρῶν
  choice: 守る者
  rationale: τηρέωが持つ「保つ・守る・忠実に行う」という幅を残し、「従う」だけに意味を限定しない。二つの冠詞付き分詞が同一人物を指すことは「すなわち」で明確にした。
- source_word: ἄχρι τέλους
  choice: 最後まで
  rationale: 終点まで忠実に持続するという時間的意味を、自然な現代日本語で表す。
- source_word: τὰ ἔργα μου
  choice: わたしのわざ
  rationale: 属格関係を限定せず、「わたしの命令」や「わたしのための行い」と解釈的に狭めない。「わざ」はイエスに属する行い、その模範や求める行いなどの含みを保てる。
- source_word: δώσω αὐτῷ
  choice: その者には…与えよう
  rationale: 与える相手を日本語で明示し、未来の約束としての力を「与えよう」で表した。文脈上の話者の権威ある約束にも適う。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 単なる能力よりも、委ねられた統治権・権限を表す語として訳した。
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: 諸国の民を治める
  rationale: ἐπί＋属格が示す支配・統治の関係を自然な日本語にした。ἔθνηはここではユダヤ人に対する「異邦人」に限定せず、世界の諸国民を指す。
theological_decisions:
- issue: 「わたしのわざ」の関係
  choice: わたしのわざ
  alternative: わたしが命じた行い／わたしのために行うわざ
  rationale: ギリシア語の属格は関係を明示していないため、イエス自身の行い、イエスにかなう行い、イエスが求める行いのいずれかに限定せず、原文の含みを保った。
- issue: 男性単数形の代表的用法
  choice: その者
  alternative: 彼
  rationale: ギリシア語は男性単数形だが、勝利する一人一人を代表的に指しており、男性だけに限定する意味ではない。日本語では性を不必要に付加せず、単数の対応関係を明確にした。
- issue: 二つの冠詞付き分詞の関係
  choice: 勝利を得る者、すなわち…守る者
  alternative: 勝利を得る者と…守る者
  rationale: καίの反復は別々の二集団ではなく、勝利する者を最後まで忠実な者として重ねて描写していると理解しやすい。日本語で二者と誤読されないようにした。
translation_notes:
  register: 明快で品位ある現代標準日本語。引用文としての荘重さを保ちつつ、古語的な語尾は避けた。「わざ」はやや聖書的だが現代語として理解可能で、原文の曖昧な属格関係を保持するため採用した。
