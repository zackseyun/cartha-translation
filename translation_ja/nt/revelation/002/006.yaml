  text: ἀλλὰ τοῦτο ἔχεις ὅτι μισεῖς τὰ ἔργα τῶν Νικολαϊτῶν, ἃ κἀγὼ μισῶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/006.yaml
  text: 'But this you have: you hate the works of the Nicolaitans[a], which I also hate.'
translation:
  language: ja
  text: しかし、あなたには、ニコライ派の行い[a]を憎んでいるという点がある。わたしもそれを憎んでいる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「行為」または「実践」とも訳せる。ギリシア語は、なされた行動や慣行を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前文との対比を示す自然で簡潔な逆接として訳した。
- source_word: τοῦτο ἔχεις
  choice: あなたにはこの点がある
  rationale: τοῦτοの前置による強調と「これを持っている」という表現を保ちつつ、現代日本語として理解できる形にした。功績を意味する表現は原文以上に解釈的なので避けた。
- source_word: ὅτι
  choice: ことである
  rationale: 「この点」の内容を導く用法として、日本語では後続節を名詞化して明示した。
- source_word: μισεῖς
  choice: 憎んでいる
  rationale: μισέωの強い意味を弱めず、後半の同じ動詞との対応も保った。
- source_word: τὰ ἔργα
  choice: 行い
  rationale: ここでは人々そのものではなく、その行為や実践を指す。「行い」は宗教的文脈にも自然で、意味範囲を適切に伝える。
- source_word: τῶν Νικολαϊτῶν
  choice: ニコライ派の人々の
  rationale: 集団名を音写しつつ、日本語で集団を自然に表すため「派の人々」とした。
- source_word: ἃ
  choice: それを
  rationale: 中性複数の関係代名詞が先行する「行い」を受けることを明確にした。日本語では単数形の代名詞でも集合的内容を自然に指せる。
- source_word: κἀγὼ
  choice: わたしも
  rationale: καὶ ἐγώの「私も」という共有された態度を簡潔に保持した。
- source_word: μισῶ
  choice: 憎んでいる
  rationale: 前半と同じμισέωなので、同一の訳語を反復して対応を明確にした。
theological_decisions:
- issue: 憎しみの対象
  choice: ニコライ派の人々の「行い」が憎まれていると明示する。
  alternative: ニコライ派の人々そのものが憎まれているかのように訳す。
  rationale: 直接目的語はτὰ ἔργαであり、人々ではなく彼らの行為・実践を指すため。
- issue: 語り手と教会の態度の一致
  choice: 「わたしもそれを憎んでいる」と訳す。
  alternative: 「わたしも嫌っている」など、μισέωを弱めて訳す。
  rationale: 復活したイエスが教会と同じくその行いを憎むという直接的な表現と、同一動詞の反復を保持するため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「憎む」という強い語を原文どおり維持し、対象が人ではなく行いであることを明確にした。
