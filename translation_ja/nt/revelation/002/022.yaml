id: REV.2.22
reference: Revelation 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: ja
  text: 見よ。わたしは彼女を寝床に投げ込む[a]。また、彼女と姦淫を行う者たちも、彼女の行いを悔い改めないなら、大きな苦しみに投げ込む[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「病床に投げ込む」とも理解できる。ギリシア語は直訳すると「寝床に」であるが、この文脈では、裁きとして苦しみや病を受ける床を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「大きな苦難に」とも訳せる。ここでは激しい苦しみや困難を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を強く促す間投詞として、簡潔で威厳のある現代日本語にした。文脈上、直後の裁きの宣告を際立たせる。
- source_word: βάλλω
  choice: 投げ込む
  rationale: 裁きの力強さと切迫感を保つため、「置く」ではなく「投げ込む」とした。二つ目の目的語にも同じ動詞を補い、日本語として関係を明確にした。
- source_word: αὐτὴν εἰς κλίνην
  choice: 彼女を寝床に投げ込む
  rationale: κλίνηはそれ自体では「病床」に限定されないため、本文では字義に近い「寝床」とした。裁きとしての病床という理解は脚注に示した。
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: 彼女と姦淫を行う者たち
  rationale: μοιχεύωの直接的な語義である姦淫を保持し、性的意味と象徴的な不忠実さの可能性を翻訳で一方に限定しないようにした。
- source_word: εἰς θλῖψιν μεγάλην
  choice: 大きな苦しみに
  rationale: θλῖψιςが表す強い圧迫、苦悩、患難を、一般の読者に明瞭な「苦しみ」で表した。「大きな苦難」という訳語も脚注に残した。
- source_word: ἐὰν μὴ μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς
  choice: 彼女の行いを悔い改めないなら
  rationale: 複数形の動詞に従い、悔い改める主体を「彼女と姦淫を行う者たち」とした。ἐκが含む離反の意味は、日本語で自然な「行いを悔い改める」によって表した。
theological_decisions:
- issue: κλίνηを裁きとしての「病床」と明示するか
  choice: 本文では「寝床」とする
  alternative: 病床
  rationale: 裁きの文脈から病や苦痛の床を指す可能性は高いが、κλίνη自体は単に寝床を意味し得る。本文では語の幅を保ち、解釈的な限定は脚注に置いた。
- issue: μοιχεύονταςを文字どおりの姦淫と霊的な不忠実さのどちらに限定するか
  choice: 「姦淫を行う」と訳し、象徴的含意は文脈に委ねる
  alternative: 彼女と不品行を行う／彼女とともに不忠実になる
  rationale: 原語の具体的な語義を保つことで、文字どおりの意味を薄めず、同時に黙示録における象徴的な響きも排除しない。
- issue: 悔い改めの対象である「彼女の行い」の関係
  choice: 姦淫を行う者たちが彼女の行いを悔い改める、と訳す
  alternative: 彼ら自身の行いを悔い改める
  rationale: SBLGNT本文のαὐτῆςは「彼女の」を意味するため、そのまま保持した。彼らが彼女の行いに加担していることが含意され得るが、「彼ら自身の行い」と置き換えなかった。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、裁きの宣告にふさわしい簡潔さと威厳を保った。「見よ」「姦淫」「悔い改める」は聖書的文脈で定着した語だが、現代の一般読者にも意味が通る表現である。
