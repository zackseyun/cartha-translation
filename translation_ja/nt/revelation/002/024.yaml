id: REV.2.24
reference: Revelation 2:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: ja
  text: しかし、ティアティラにいる残りの者たち、すなわち、この教えを受け入れず、いわゆる「サタンの深み」[a]を知らない人たちに、わたしは言う。わたしは、あなたがたにほかの重荷を負わせない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「サタンの深いもの」。偽教師たちが「深い」霊的知識を持つと唱えていたことを、ヨハネが皮肉に言い換えた表現とも考えられる。ただし、誰がこの呼び名を用いたのかは原文では明確でない。
    reason: 語句の直訳と、話者および引用範囲の曖昧さを示すため。
lexical_decisions:
- source_word: τοῖς λοιποῖς τοῖς ἐν Θυατείροις
  choice: ティアティラにいる残りの者たち
  rationale: 教会内でこの教えに従わない残りの人々を指す対比を保ち、地名は日本語の慣用的な音写とした。
- source_word: ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην
  choice: この教えを受け入れず
  rationale: ここでのἔχωは単なる所有ではなく、その教えを奉じ、受容していることを表す。「受け入れず」は意味を自然な現代日本語で伝えつつ、「従わず」ほど行動面に限定しない。
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: 知らない人たち
  rationale: ἔγνωσανは知識だけでなく経験的に知る含みも持ち得るが、日本語では完了形を不自然に補わず「知らない」として、その幅を保った。
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: 「サタンの深み」
  rationale: βαθέαの「深いもの／深み」という比喩と、霊的な深奥を誇る標語への皮肉である可能性を簡潔に保持した。
- source_word: ὡς λέγουσιν
  choice: いわゆる
  rationale: 誰がどの意図でそう呼んだのかを特定せず、報告的ないし皮肉な呼称であることを自然な日本語で示す。
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: あなたがたにほかの重荷を負わせない
  rationale: βάλλω ἐπίの「上に置く」を日本語の慣用表現「重荷を負わせる」で表し、追加の要求・義務という含みを保った。
theological_decisions:
- issue: 「サタンの深み」と「いわゆる」の関係
  choice: 誰の呼称か、また自己称号かヨハネの皮肉な反転かを本文で断定しない。
  alternative: 偽教師たちが自説を「深み」と称し、ヨハネがそれをサタンに由来すると明示している、と解釈して訳す。
  rationale: ὡς λέγουσινは主語と引用範囲が圧縮されており、複数の理解が可能であるため、原文の論争的な緊張と曖昧さを残した。
- issue: 「知らない」の意味
  choice: 知的理解と実際の参与・経験の双方を排除しない表現とする。
  alternative: 「経験したことがない」と訳し、実践への参与に限定する。
  rationale: γινώσκωは文脈上経験的含意を持ち得るが、原文だけでその意味に限定するのは避けた。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「すなわち」で呼びかけの対象を整理し、原文の長い修飾関係を読み取りやすくした。「わたし」は黙示録中の発言者の一人称として平仮名表記とした。
