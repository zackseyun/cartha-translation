  revision_rationale: γράψονを「こう書きなさい」と訳し、続くΤάδε λέγειを引用本文の告知定型として配置し直した。「死んで再び生きた」は、死に至る出来事と生への回復の対照を簡潔に表す。脚注bは、本文に付す場合には対応箇所の直後に置く必要があるため、完全な組版では「生きた方[b]」とする。
