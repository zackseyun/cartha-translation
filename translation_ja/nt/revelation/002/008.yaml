source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: ja
  text: 'また、スミルナにある教会の天使[a]に、こう書きなさい。


    「初めであり、終わりである方、死んで再び生きた方が、こう言われる。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「使者」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: 御使い
  rationale: 黙示録の黙示文学的文脈では天的存在を指す可能性が高いため、「御使い」を本文に採用した。ただし語自体には人間の「使者」の意味もあり得るので、脚注に残した。
- source_word: ἐκκλησίας
  choice: 教会
  rationale: ここではスミルナのキリスト者共同体を指すため、現代日本語で定着し、宗教的共同体としての意味を明確に伝える「教会」とした。
- source_word: Τάδε λέγει
  choice: こう言われる
  rationale: 預言的な告知の定型句を、荘重さを保ちながら自然な現代日本語で表した。現在形の発話として提示される力も保っている。
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: 初めであり、終わりである方
  rationale: 冠詞を伴う称号としての働きを保ちつつ、日本語で人物を指す表現として自然になるよう「方」を補った。
- source_word: ἐγένετο νεκρὸς
  choice: 死者となった
  rationale: 単に死んでいる状態ではなく、死に至った出来事を示す ἐγένετο の事象的なニュアンスを保った。
- source_word: ἔζησεν
  choice: 再び生きた
  rationale: 直前の死との対照から復活を指すことが明確になるよう「再び」を補い、原文の簡潔さも保った。
theological_decisions:
- issue: キリストの称号と死・復活の表現
  choice: 「初めであり、終わりである方」を称号として示し、「死者となったが、再び生きた」と訳した。
  alternative: 「最初であり、最後である方。死んでいたが、生き返った方」
  rationale: イザヤ書の神的称号を響かせる高いキリスト論と、イエスの死および復活への言及を明瞭に保った。一方で、本文にない教理的説明は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録に反復される告知定型の荘重さを保った。「御使い」「書き送れ」「こう言われる」によって聖書本文としての品位を維持し、過度に古風な語法は避けた。
