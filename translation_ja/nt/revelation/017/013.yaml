id: REV.17.13
reference: Revelation 17:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: ja
  text: 彼らは心を一つにしており[a]、自分たちの力と権威を獣に与える。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一つの目的を持っており」。ギリシア語の慣用表現は字義的には「一つの考えを持つ」で、共通の決意や目的を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: 彼ら
  rationale: 直前の十人の王を指す指示代名詞。日本語では文脈上「彼ら」が自然で、複数の人物への指示を明確にする。
- source_word: μίαν γνώμην ἔχουσιν
  choice: 心を一つにしており
  rationale: 字義的な「一つの考えを持つ」という慣用表現が示す、一致した考え、決意、目的の幅を保ちつつ、現代日本語として自然に表す。
- source_word: δύναμιν
  choice: 力
  rationale: 実効的な力や能力を表す語として、簡潔で理解しやすい「力」を用いる。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: δύναμιςとは区別される、支配する権限・権威を表すため「権威」とする。
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: 自分たちの力と権威
  rationale: 二つの概念を区別して保持し、所有者が彼ら自身であることを自然な日本語で明示する。
- source_word: τῷ θηρίῳ
  choice: 獣に
  rationale: 黙示録における定着した終末論的形象として「獣」と訳す。日本語では文脈上、定冠詞を別個に表示する必要はない。
- source_word: διδόασιν
  choice: 与える
  rationale: 現在形の直接的な意味を保ち、解釈を加えずに譲渡行為を表す。
theological_decisions:
- issue: μίαν γνώμην ἔχουσιν が政治的・黙示文学的文脈で示す一致の性質
  choice: 心を一つにしており
  alternative: 一つの目的を持っており
  rationale: この句は意見、決意、目的の一致を表し得る。「心を一つにする」はその意味の幅を残し、単に目的だけに限定しない。
- issue: δύναμις と ἐξουσίαの区別
  choice: 力と権威
  alternative: 実力と支配権
  rationale: 実効的な力と支配上の権威という関連しつつ異なる二概念を、一般読者に分かりやすい語で区別して保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「心を一つにしており」により原文の慣用性と意味の幅を保ち、「力」と「権威」を区別した。
