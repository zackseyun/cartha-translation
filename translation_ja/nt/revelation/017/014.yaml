id: REV.17.14
reference: Revelation 17:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: ja
  text: これらの者たちは小羊に戦いを挑む[a]。小羊は彼らに打ち勝つ。小羊は主の主、王の王だからである。そして、小羊とともにいる者たちは、召された者、選ばれた者、忠実な者である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すれば「小羊と戦う」。ここでは、小羊を相手に戦争をするという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: この者たち
  rationale: 直前の文脈に登場する王たちを指す指示代名詞の働きを保ち、単なる「彼ら」より原文の指示性を明確にした。
- source_word: μετὰ τοῦ ἀρνίου πολεμήσουσιν
  choice: 小羊に戦いを挑む
  rationale: μετά＋属格は通常「ともに」を表すが、πολεμέωとの戦争表現では敵対を意味する。日本語で同盟と誤解されないよう、文脈上の意味を明示した。
- source_word: ἀρνίον
  choice: 小羊
  rationale: 黙示録でキリストを指す一貫した称号として、定着した「小羊」を用いた。
- source_word: νικήσει
  choice: 勝つ
  rationale: νικάωの勝利・征服の意味を、現代日本語で自然かつ力強く表す。軍事的文脈は前文によって明らかであり、「征服する」より簡潔である。
- source_word: κύριος κυρίων
  choice: 主の主
  rationale: 属格を重ねた最高権威の称号を、聖書日本語として明瞭な定型表現で保った。
- source_word: βασιλεὺς βασιλέων
  choice: 王の王
  rationale: あらゆる王にまさる王権を示す原文の称号を、その並行構造とともに保持した。
- source_word: οἱ μετ’ αὐτοῦ
  choice: 小羊とともにいる者たち
  rationale: 代名詞の指示対象を日本語で明確にしつつ、μετάの同行・同伴の意味を自然に表した。
- source_word: κλητοὶ
  choice: 召された者
  rationale: 招きと召命の双方に開かれた語義を保ち、特定の救済論的体系に限定しない表現とした。
- source_word: ἐκλεκτοὶ
  choice: 選ばれた者
  rationale: 「選民」などの術語化を避け、ἐκλεκτόςの基本的意味を平明に示した。
- source_word: πιστοί
  choice: 忠実な者
  rationale: この三語の並びでは、信頼に足ることと揺るがない忠誠を含む「忠実な」が適切である。「信じる者」と限定せず、原語の意味の幅を残した。
theological_decisions:
- issue: 小羊の称号と勝利の表現
  choice: 「小羊」と「勝つ」を用いる
  alternative: 「子羊」と「打ち勝つ」または「征服する」
  rationale: 黙示録に反復されるキリスト論的称号とνικάωの勝利の主題を保ちながら、日本語として過度に硬くならない表現を選んだ。
- issue: κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί の関係
  choice: 「召された者、選ばれた者、忠実な者」と三つの記述を並列する
  alternative: 「召され、選ばれた、信仰ある者たち」
  rationale: 三語をそれぞれ独立した記述として示し、召命・選び・信仰の論理的順序や特定の教派的救済論を本文に持ち込まないようにした。
- issue: 節末の καί のつながり
  choice: 「そして」で小羊とともにいる者たちの記述を続ける
  alternative: 彼らも小羊とともに勝つという意味を補って訳す
  rationale: 原文には節末の一群に対応する明示的な動詞がないため、勝利への参与を訳文で補わず、英語監査層と同様に存在文として最小限に補った。
translation_notes:
  register: 現代標準日本語による、明瞭で威厳のある黙示文学的文体。「この者たち」で原文の指示性を保ち、「主の主、王の王」の並行した称号は簡潔に維持した。
