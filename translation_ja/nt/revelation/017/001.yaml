  to: また、七つの鉢を持つ七人の御使いの一人が来て、私と話し、こう言った。「さあ、来なさい。多くの水の上に座っている大娼婦が受ける裁き[a]を、あなたに見せよう。」
  rationale: 原文の比喩を解釈せずに保持しつつ、πόρνηの基本語義とμετάの関係をより正確に反映した。「裁き」はκρίμαの判決・処罰の両面を保持しており、既存の脚注がその代替的な狭義を適切に示している。
