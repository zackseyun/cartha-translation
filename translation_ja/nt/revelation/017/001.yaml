source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: ja
  text: また、七つの鉢を持つ七人の御使いの一人が来て、私と話し、こう言った。「さあ、来なさい。多くの水の上に座っている大娼婦が受ける裁き[a]を、あなたに見せよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「有罪判決」または「処罰」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: また
  rationale: 直前の幻との連続を示す接続語として、黙示録の叙述に自然な「また」とした。
- source_word: ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: 七人の御使いの一人が来て
  rationale: 部分を表す構文を自然な日本語で示し、ἦλθενの叙述的な意味を「来て」と訳した。
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: 七つの鉢を持つ
  rationale: φιάληは黙示録の祭儀的・終末的イメージを踏まえ、定着した「鉢」とした。分詞は御使いたちを限定する連体修飾とした。
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: 私にこう語りかけた
  rationale: μετάの関与性を保ちつつ、発話導入として重複を避けた自然な現代日本語にした。
- source_word: Δεῦρο
  choice: さあ、来なさい
  rationale: 相手を招き寄せる命令の力を明示し、簡潔な呼びかけとして訳した。
- source_word: δείξω σοι
  choice: あなたに見せよう
  rationale: 未来形の意志・約束の響きを、発話として自然な「見せよう」で表した。
- source_word: τὸ κρίμα
  choice: 受ける裁き
  rationale: κρίμαが判決とその処罰的帰結の双方を含み得るため、広がりのある「裁き」を採用した。日本語では属格関係を明確にするため「受ける」を補った。
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: 大淫婦
  rationale: 預言文学の強い性的・宗教的比喩を保ち、日本語聖書語彙として理解可能な「淫婦」を用いた。単なる規模ではなく際立った存在を示す定型表現として「大淫婦」とした。
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: 多くの水の上に座っている
  rationale: 象徴の解釈を先取りせず、ἐπίとκαθημένηςが作る奇異な黙示的イメージをそのまま保った。
theological_decisions:
- issue: πόρνηによるバビロンの比喩的呼称
  choice: 大淫婦
  alternative: 大娼婦
  rationale: 性的・預言的な告発の強さを保ちながら、現代日本語の本文として過度に職業的・説明的にならない表現を選んだ。バビロンの具体的同定や特定教派の解釈は加えていない。
- issue: 黙示的文脈におけるκρίμα
  choice: 裁き
  alternative: 有罪判決／処罰
  rationale: 神の司法的判断とその結果の両方を含み得る原語の幅を保ち、判決か刑罰かに限定しなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。黙示録特有の象徴表現は平易化して解釈せず、「多くの水の上に座る」という原文の像を保持した。
