  source_fidelity: 全体の構文と象徴的な情景はよく保持されている。ただし、πόρνηは「淫婦」よりも直接には「娼婦」を指すため、現代標準日本語で原語の語義をより正確に反映するには「大娼婦」が適切である。また、μετ’ ἐμοῦの「私と」の関係を本文に反映する。
  naturalness: 「私と話し、こう言った」は、黙示録の叙述として不自然にならず、後続の直接話法も明瞭である。「大娼婦」は強い黙示的・預言的比喩を保つ簡潔な表現である。
  terminology: φιάλαςを「鉢」、κρίμαを「裁き」とするのは適切である。「大娼婦」はπόρνηの職業的・比喩的語義を保ち、「淫婦」が持ちうる性的放縦一般への意味のずれを避ける。
