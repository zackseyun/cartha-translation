id: REV.17.17
reference: Revelation 17:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: ja
  text: 神は彼らの心に、ご自分の意図を実行し、一つの意図を共有し[a]、自分たちの王権を獣に与えるという思いを与えられたからである。神の言葉が成就する[b]時まで。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「心を一つにして」。ギリシア語では直訳すると「一つの意図を作って」。
    reason: ποιῆσαι μίαν γνώμην の圧縮された表現と語義上の選択肢を示すため。
  - marker: b
    text: 別訳「完了する」または「実現する」。
    reason: τελέω が完成と実現の双方のニュアンスを持ち得るため。
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: 彼らの心に……という思いをお与えになった
  rationale: 直訳的な「彼らの心の中に与えた」という比喩を保ちつつ、内面的な意図を生じさせたことが現代日本語で明確に伝わる形とした。
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: ご自分の意図を実行し
  rationale: γνώμη はここでは単なる意見ではなく、神の意図・決意を指す。「意図」は「考え」より意志的な含みを保ち、「実行する」は ποιῆσαι の遂行の意味を自然に表す。
- source_word: ποιῆσαι μίαν γνώμην
  choice: 意志を一つにして
  rationale: 直訳では「一つの意図を作る」だが、複数の王たちが共通の決意に至ることを表す自然な日本語とした。行動上の一致だけに限定せず、意志の一致を保った。
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: 自分たちの王権を……与えよう
  rationale: βασιλεία は領土としての王国だけでなく統治権・王権も意味する。複数の王が獣に差し出す文脈では「王権」が自然であり、原文の単数形も保てる。
- source_word: τῷ θηρίῳ
  choice: 獣に
  rationale: 黙示録で反復される象徴的呼称として「獣」を用い、書全体のイメージを保つ。
- source_word: ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ
  choice: 神の言葉が成就する時まで
  rationale: τελέω の未来受動態は、神の言葉がその定められた完成・実現に至ることを示す。「成就する」は預言的文脈に適し、受動的な意味も慣用的に伝える。
theological_decisions:
- issue: 神の主権と王たちの行為主体性
  choice: 神が彼らの内に意図を生じさせたことと、彼ら自身が意志を一つにして王権を与えることの双方を明示した。
  alternative: 神の働きを単なる「許可」と弱める、または原文以上に決定論的に言い換える。
  rationale: 原文は神の働きを直接述べる一方、王たち自身の意志と行動も描く。どちらか一方に解消せず、両者の緊張を保つ。
- issue: 「彼らの王国」か「彼らの王権」か
  choice: 王権
  alternative: 王国
  rationale: βασιλεία の語義的幅を踏まえ、王たちが獣に統治権を委ねる直近の文脈に合う訳を選んだ。領土の譲渡とだけ読まれることを避けるが、実体的な支配を弱めない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、黙示文学にふさわしい荘重さを保った。「御心」など解釈幅の広い宗教語には頼らず、「意図」「王権」「成就」を用いて原文の意志・統治・預言的完成を明確にした。
