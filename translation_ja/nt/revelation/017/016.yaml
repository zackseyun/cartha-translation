id: REV.17.16
reference: Revelation 17:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: ja
  text: また、あなたが見た十本の角と獣――これらは娼婦を憎み、彼女を荒れ果てさせ、裸にし[a]、彼女の肉を食べ[b]、彼女を火で焼き尽くす。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裸にする」は、辱めのために公にさらすことを含意しうる。
    reason: lexical_alternative
  - marker: b
    text: 「肉」は原文どおり。黙示録の象徴的な描写の中で、徹底した暴力的滅亡を表している。
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: 角
  rationale: 解釈語の「王」「勢力」に置き換えず、黙示文学の象徴そのものを保つ。日本語では助数を添えて「十本の角」とした。
- source_word: θηρίον
  choice: 獣
  rationale: 黙示録で定着した自然な訳語であり、象徴的で不吉な響きを保つ。
- source_word: πόρνην
  choice: 娼婦
  rationale: 現代標準語として明瞭で、古風な語や必要以上に侮蔑的な語を避ける。
- source_word: μισήσουσι
  choice: 憎み
  rationale: 未来の一連の行為を日本語の終止形「焼き尽くす」に統合しつつ、μισέωの直接的な意味を保つ。
- source_word: ἠρημωμένην ποιήσουσιν
  choice: 荒れ果てたものとし
  rationale: 結果状態を生じさせる構文の力を保ち、裁きによる荒廃を自然な日本語で表す。
- source_word: γυμνήν
  choice: 裸にする
  rationale: 形容詞「裸の」に対応する直接的な表現であり、公然の露出と辱めを含み得る原文の像を保持する。
- source_word: σάρκας
  choice: 肉
  rationale: 「体」などと弱めず、黙示的比喩の激しい身体的イメージをそのまま保つ。
- source_word: φάγονται
  choice: 食らい
  rationale: 基本義は「食べる」だが、対象が「肉」である激烈な文脈に合う、文語に偏りすぎない力強い表現を選ぶ。
- source_word: κατακαύσουσιν ἐν πυρί
  choice: 火で焼き尽くす
  rationale: κατακαίωの徹底して焼く強意と、ἐν πυρίの手段を自然に表す。
- source_word: οὗτοι
  choice: 彼らは
  rationale: 「十本の角と獣」を複数の行為主体として受ける強調的な再指示を、ダッシュと代名詞で明示する。
theological_decisions:
- issue: 「十本の角と獣」と複数形の再指示・動詞との関係
  choice: 「十本の角と獣――彼らは」とし、共同して行動する複数主体として表す。
  alternative: 再指示を省き、「十本の角と獣は」と滑らかに訳す。
  rationale: 原文のοὗτοιによる強調的な受け直しと複数動詞を見える形で保ちつつ、日本語として理解可能にする。
- issue: 娼婦の滅亡を描く黙示的イメージの扱い
  choice: 娼婦、裸、肉を食らう、火で焼き尽くすという比喩を本文にそのまま保つ。
  alternative: 娼婦を都市や体制と解釈して本文中で言い換える。
  rationale: 本文が提示する象徴を特定の解釈に置き換えず、その曖昧さと暴力的な裁きの緊張を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、黙示録にふさわしい厳粛さと激しい象徴表現を保った。「食らう」「焼き尽くす」により原文の強度を再現し、ダッシュでοὗτοιの強調的な受け直しを示した。
