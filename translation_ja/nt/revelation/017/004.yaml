  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: ja
  text: 女は紫と緋色の衣をまとい、金と宝石と真珠で身を飾っていた。また、その手には、忌まわしいものと彼女の淫行の汚れ[a]とで満ちた金の杯を持っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「淫行」は「売春」または「性的な不道徳」とも訳せる。黙示録では、このギリシア語は文字どおりの意味と比喩的な意味の両方を帯びることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένη
  choice: 衣をまとい
  rationale: 迂言的な完了形が表す、衣をまとった状態を自然な現代日本語で示す。
- source_word: πορφυροῦν καὶ κόκκινον
  choice: 紫と緋色の衣
  rationale: 衣服の含意を補いながら、高貴さとぜいたくを思わせる二つの鮮明な色を保つ。
- source_word: κεχρυσωμένη
  choice: 身を飾っていた
  rationale: 金などで豪華に装飾された状態を表し、単なる金箔張りに限定しない。
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: 金と宝石と真珠で
  rationale: 装飾の素材を列挙する原文を明瞭に再現する。単数形の λίθῳ τιμίῳ は種類を総称するものとして「宝石」とした。
- source_word: ποτήριον χρυσοῦν
  choice: 金の杯
  rationale: 素材を表す形容詞を自然で格調ある日本語にする。
- source_word: γέμον
  choice: 満ちていた
  rationale: 杯の中が忌まわしいもので満杯の状態を表す現在分詞の意味を保つ。
- source_word: βδελυγμάτων
  choice: 忌まわしいもの
  rationale: 宗教的・道徳的に嫌悪されるものという強い意味を、過度に専門的にならずに伝える。
- source_word: τὰ ἀκάθαρτα
  choice: 汚れ
  rationale: 中性複数の実質名詞が示す不浄なものを簡潔に表し、儀礼的・道徳的な含みを残す。
- source_word: πορνείας
  choice: みだらな行い
  rationale: 性的な不道徳を指しつつ、黙示録における比喩的な不貞や偶像礼拝の響きを一義的に解消しない表現とした。
theological_decisions:
- issue: 象徴的文脈における πορνεία の訳
  choice: みだらな行い
  alternative: 売春／淫行
  rationale: この語には文字どおりの性的な不道徳と、神への不貞や偶像礼拝を表す比喩的な力が重なり得る。「売春」に狭めず、その緊張を脚注とともに保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示文学の華麗さと不浄さの対照が伝わるよう、平易さの中にも品位を保った。「から生じる」は属格関係を自然に示す補足だが、因果を過度に限定しない範囲にとどめた。
