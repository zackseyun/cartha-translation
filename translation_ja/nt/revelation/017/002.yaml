id: REV.17.2
reference: Revelation 17:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: ja
  text: 地上の王たちは彼女と淫行を行い[a]、地に住む者たちは彼女の淫行のぶどう酒[b]に酔わされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでの「淫行」は、性的比喩の力を保ちながら、偶像礼拝、腐敗した結びつき、または不実を象徴していると考えられる。
    reason: cultural_note
  - marker: b
    text: 「彼女の売春のぶどう酒」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: 彼女と
  rationale: 前節の女を受ける女性関係代名詞を、日本語として自然に明示した。
- source_word: ἐπόρνευσαν
  choice: 淫行をし
  rationale: 性的な比喩の強さを保ちつつ、偶像礼拝や不実な結びつきという象徴的含意を本文で一義的に限定しない。
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: 地上の王たち
  rationale: 黙示録で繰り返される広い世界的表現として訳した。
- source_word: ἐμεθύσθησαν
  choice: 酔った
  rationale: 受動形が表す結果状態を、簡潔で自然な日本語で示した。
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: 地に住む者たち
  rationale: 黙示録の定型句として、名詞化しすぎず原文の動詞表現を保った。
- source_word: ἐκ τοῦ οἴνου
  choice: ぶどう酒に
  rationale: ἐκ が示す原因・源を、日本語では酩酊の原因を自然に表す助詞「に」で訳した。
- source_word: τῆς πορνείας αὐτῆς
  choice: 彼女の淫行の
  rationale: 同語根の動詞と名詞をともに「淫行」で対応させ、性的比喩とその象徴性を保持した。
theological_decisions:
- issue: πορνεύω／πορνείαを偶像礼拝または政治的・宗教的不忠実と明示的に解釈するか
  choice: 本文では「淫行」という性的比喩を保持する
  alternative: 「偶像礼拝による不実」「堕落した同盟」などと説明的に訳す
  rationale: 本文の比喩は性的意味を保ちながら、偶像礼拝、腐敗、不実な結びつきを象徴しうる。解釈を一つに限定せず、黙示録が意図する象徴的緊張を残した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「淫行」は日常語より硬いが、黙示文学の強い性的比喩を下品にせず保持できる。文頭の関係節は前節から続くが、日本語では独立して読める語順に整えた。
