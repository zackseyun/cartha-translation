id: REV.17.11
reference: Revelation 17:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: ja
  text: また、かつていて、今はいないあの獣は、それ自身が第八の者[a]であり、七人から出た者であり[b]、滅びへと向かう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それ自身が第八の王であり」。文脈上は「王」が補われると考えられるが、ギリシア語本文に「王」という名詞はない。
    reason: alternative_reading
  - marker: b
    text: 別訳「七人のうちの一人であり」。ギリシア語は直訳すると「七人から」であり、起源、所属、または密接な関係を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: 獣
  rationale: 黙示録における神に敵対する怪物的な政治的・霊的権力を表す定着した黙示文学的表現として、象徴性と旧約的背景を保つ。
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: かつていて、今はいない
  rationale: 原文の簡潔な対照を自然な現代日本語で表し、この章で繰り返される定型表現との響きを保つ。「もはや存在しない」などと時間的意味を限定しすぎない。
- source_word: αὐτὸς
  choice: それ自身
  rationale: 獣を強調する語であるため、「それ自身」として強意を明示する。男性の人格的指示対象であると断定しない。
- source_word: ὄγδοός
  choice: 第八のもの
  rationale: 原文には「王」に当たる名詞が明記されていない。日本語として述語を成立させるため一般的な「もの」を補うが、具体的な種類は確定せず、文脈上の「王」は脚注に示す。
- source_word: ἐκ τῶν ἑπτά
  choice: 七つのものに由来し
  rationale: ἐκの起源・出所・所属を表し得る幅を「由来し」で保つ。「七人のうちの一人」と限定する解釈を本文に持ち込まない。
- source_word: εἰς ἀπώλειαν
  choice: 滅びへと
  rationale: 終末的な破滅・滅亡という重い意味を、現代日本語で明瞭かつ聖書的に伝える。
- source_word: ὑπάγει
  choice: 向かう
  rationale: εἰς ἀπώλειανとの結びつきを自然に表し、獣が滅びへ進むという原文の現在形の生々しさを保つ。
theological_decisions:
- issue: ὄγδοόςに暗黙の名詞「王」を補うか
  choice: 本文では「第八のもの」とし、「王」は補わない。
  alternative: 「第八の王」
  rationale: 直前の文脈から「王」は十分に考えられるが、ギリシア語本文には βασιλεύς がない。象徴的な簡潔さと曖昧さを保ち、解釈的補足は脚注に置く。
- issue: ἐκ τῶν ἑπτάを「七人のうちの一人」と解するか
  choice: 「七つのものに由来し」として、起源または関係性を保つ。
  alternative: 「七人のうちの一人であり」
  rationale: ἐκは出所、由来、所属を示し得るため、厳密な関係には解釈上の余地がある。本文では特定の同定に決着をつけない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、黙示文学にふさわしい簡潔で荘重な調子を保った。「第八のもの」「七つのもの」はやや異例の表現だが、原文が明示していない「王」を本文で断定せず、真正な曖昧さを保持するために採用した。
