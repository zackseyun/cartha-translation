id: REV.17.6
reference: Revelation 17:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: ja
  text: そして私は、その女が、聖なる者たちの血と、イエスの証人たち[a]の血に酔っているのを見た。私は彼女を見て、大いに驚いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスの殉教者たち」。このギリシア語は「証人」と「殉教者」のどちらも意味し得る。ここでは彼らの血が語られているため、「殉教者」の意味合いが特に強い。
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: 血に酔っている
  rationale: 直訳的な「血から酔う」ではなく、日本語で自然な結び付きを用いつつ、流血に酔うという衝撃的な比喩を保持した。分詞は、女の継続的な状態として表した。
- source_word: τῶν ἁγίων
  choice: 聖なる者たち
  rationale: 神に属する者として聖別された人々を指す。現代日本語で「聖徒」より意味を取りやすく、語の基本的な意味も保つ。
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: イエスの証人たち
  rationale: μάρτυςの基本義である「証人」を本文に採用した。血への言及により殉教の含意は強いが、それを本文だけで一義的に確定せず、脚注に「殉教者」を残した。「イエスの」は、イエスに属する証人、またイエスについて証しする者という属格の含みを保つ。
- source_word: ἐθαύμασα ... θαῦμα μέγα
  choice: 大いに驚いた
  rationale: 同語根を重ねた強意を、不自然な直訳を避けて自然な副詞表現で示した。「驚嘆した」よりも一般読者に明瞭である。
- source_word: ἰδὼν αὐτὴν
  choice: 彼女を見て
  rationale: アオリスト分詞と主動詞との関係を簡潔に表し、原文の「見て」という動作を保持した。
theological_decisions:
- issue: 迫害と流血の文脈における μάρτυρες の意味
  choice: 本文では「証人たち」とし、殉教の意味合いを脚注で示す。
  alternative: 「殉教者たち」
  rationale: 血が語られているため殉教者という理解は文脈上きわめて自然である一方、黙示録では証言という主題も重要であり、語の「証人」と「殉教者」の重なりを一方に限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学の荘重さと「血に酔う」という強烈な像を保った。「聖なる者たち」は教派的な連想を抑えつつ原語に近い表現である。
