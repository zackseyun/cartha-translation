id: REV.17.10
reference: Revelation 17:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ πέντε ἔπεσαν, ὁ εἷς ἔστιν, ὁ ἄλλος οὔπω ἦλθεν, καὶ ὅταν ἔλθῃ ὀλίγον ⸂αὐτὸν δεῖ⸃ μεῖναι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/010.yaml
  text: Five have fallen[a], one is, the other has not yet come; and when he comes, he must remain for a little while.
translation:
  language: ja
  text: 五人は倒れ[a]、一人は今おり、もう一人はまだ来ていない。そして、彼が来る時には、しばらくの間とどまらなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈を明示すれば、「五人の王は倒れ、一人の王は今おり、もう一人の王はまだ来ていない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πέντε
  choice: 五人
  rationale: 直前の「七人の王」を受ける定冠詞付きの数詞。日本語では「その五人」より「五人」が自然であり、文脈上の指示関係も保たれる。
- source_word: ἔπεσαν
  choice: 倒れ
  rationale: πίπτω の比喩的用法を保ち、王たちの没落・退場を特定の歴史的意味に限定しない。
- source_word: ὁ εἷς ἔστιν
  choice: 一人は今おり
  rationale: 字義的には「一人はいる」。日本語で時系列上の現在を明確にしつつ、「支配している」などの解釈を加えない。
- source_word: ὁ ἄλλος
  choice: もう一人
  rationale: 先行する五人と現在いる一人に続く、別の一人を自然な日本語で示す。
- source_word: οὔπω ἦλθεν
  choice: まだ来ていない
  rationale: 未到来の状態が現在まで続くことを、現代日本語で自然に表す。
- source_word: ὅταν ἔλθῃ
  choice: 彼が来る時には
  rationale: 未来の到来を表す接続法の含みを保つ。「彼」は文脈上、男性名詞 βασιλεῖς が指す王を受ける。
- source_word: ὀλίγον
  choice: しばらくの間
  rationale: 短い期間を示す副詞的用法。原文に明示されない「ほんの」「わずか」を強く加えず、簡潔に訳す。
- source_word: αὐτὸν δεῖ μεῖναι
  choice: とどまらなければならない
  rationale: 非人称的な必然を表す δεῖ と、一定期間存続する μεῖναι を、荘重で自然な日本語にする。
theological_decisions:
- issue: 七人の王の比喩が指す対象の特定
  choice: 本文では「五人」「一人」「もう一人」という圧縮された表現を保ち、脚注で王を指すことを明示する。
  alternative: 本文を「五人の王は倒れ、一人の王は今おり、もう一人の王はまだ来ていない」と展開する。
  rationale: 直前の文脈では王であることが明らかだが、この節の省略的な語り方と、具体的な歴史上の人物をめぐる解釈上の余地を保つ。
- issue: δεῖ が示す必然性
  choice: 「なければならない」と訳し、その必然性の主体や根拠を説明しない。
  alternative: 「神の定めにより、とどまることになる」と解釈的に訳す。
  rationale: 黙示録の文脈では神的必然が含意され得るが、原文はその主体を明示していないため、翻訳本文で補わない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学にふさわしい簡潔で dignified な調子を保った。「いる」ではなく「おり」、「残る」ではなく「とどまる」を採用し、過度に口語的にも古風にもならないようにした。
