source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: ja
  text: あなたが見た女は、地上の王たちを支配する大きな都市である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地上の王たちに対する王権を持つ」。ギリシア語を直訳すると「王権（または王国）を持つ」であり、支配権、または王としての支配を持つこととも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: 女
  rationale: 幻の中に現れた象徴的な女性を指すため、文脈に即した簡潔な「女」とした。
- source_word: ἣν εἶδες
  choice: あなたが見た
  rationale: ヨハネが幻の中で見た対象を直接指す関係節として、自然な現代日本語にした。
- source_word: πόλις ἡ μεγάλη
  choice: 大いなる都
  rationale: πόλιςを「都」、強調された形容表現を「大いなる」とし、黙示文学にふさわしい威厳を保った。
- source_word: ἔχουσα βασιλείαν
  choice: 支配する
  rationale: 直訳は「王権／支配権を持つ」だが、後続するἐπὶ τῶν βασιλέωνとの関係を自然な日本語で表した。原語の名詞表現は脚注で示す。
- source_word: βασιλεία
  choice: 支配
  rationale: ここでは領土としての「王国」より、王たちに及ぶ王権・統治権を表すと判断した。
- source_word: ἐπὶ τῶν βασιλέων
  choice: 王たちを
  rationale: 属格を伴うἐπίがここでは上位の権威・支配関係を示すため、「支配する」の目的語として表現した。
- source_word: τῆς γῆς
  choice: 地上の
  rationale: 黙示録における広い世界的範囲を保ち、特定の土地に限定しない表現とした。
theological_decisions:
- issue: 女と都の同一視の性質
  choice: 「女は……都である」と直接同一視する
  alternative: 「女は……都を表している」と説明的に訳す
  rationale: 原文は単純な連結動詞ἔστιν（「である」）を用いるため、象徴の意味を説明で解消せず、原文の直接的な同一視を保った。
- issue: βασιλείαの意味
  choice: 王たちに対する「支配」として本文に表す
  alternative: 「王国」または「王権を持つ」と訳す
  rationale: 都市が地理的な王国を所有するというより、地上の王たちに及ぶ統治権を持つという文脈上の意味を本文に反映しつつ、語義の幅は脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、「大いなる都」によって黙示文学の荘重さを保った。「地の王たち」より自然な「地上の王たち」を採用した。
