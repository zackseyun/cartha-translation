id: REV.17.12
reference: Revelation 17:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: ja
  text: あなたが見た十本の角は、十人の王である。彼らはまだ王国を受けていないが、獣とともに、一時間だけ[a]王としての権威を受ける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「短い間だけ」。黙示文学の「一時間」は、短く限られた期間を表している可能性がある。
    reason: 「μίαν ὥραν」の字義的表現と、文脈上考えられる比喩的意味の双方を示すため。
lexical_decisions:
- source_word: κέρατα
  choice: 角
  rationale: 黙示文学の象徴表現を保つため字義どおり「角」とし、その意味は本文自身が続いて「王」と説明する形を維持した。
- source_word: βασιλεῖς
  choice: 王
  rationale: 基本的な語義を採用した。象徴的な支配者や政治勢力を指す可能性はあるが、本文でその解釈に限定しない。
- source_word: βασιλείαν
  choice: 王国
  rationale: 後に出るἐξουσία（権威）との語の区別を保ち、まだ与えられていない統治領域または王的支配を自然な日本語で表した。
- source_word: οὔπω
  choice: まだ……ていない
  rationale: 幻の時点では受領がまだ実現していないという時間的否定を明確に表した。
- source_word: ἔλαβον
  choice: 受けていない
  rationale: アオリストを、現時点まで未受領であることを示す自然な日本語にした。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 付与された統治上の権限を表し、「王国」と混同しない訳語を選んだ。
- source_word: ὡς βασιλεῖς
  choice: 王としての
  rationale: 権威を受ける際の身分・あり方を自然な日本語で示した。「王のような」として比較だけに限定しない。
- source_word: μίαν ὥραν
  choice: 一時間だけ
  rationale: 原文の黙示文学的な時間表現を本文に残し、「だけ」でその限定性を表した。短い期間を象徴する可能性は脚注に示した。
- source_word: λαμβάνουσιν
  choice: 受ける
  rationale: ギリシア語現在形の生き生きとした叙述を、文脈上自然な非過去形で表した。未来的含意を訳文で断定しない。
- source_word: μετὰ τοῦ θηρίου
  choice: 獣とともに
  rationale: 獣との結びつき、または共同関係を簡潔に表した。
- source_word: θηρίου
  choice: 獣
  rationale: 黙示録で反復される象徴的存在について、簡潔で定着した訳語を用いた。
theological_decisions:
- issue: 十人の王を文字どおりの君主とするか、象徴的な支配者・勢力とするか
  choice: 本文では原文どおり「十人の王」とした。
  alternative: 十の支配者、十の政治勢力、または十の王国
  rationale: 原文は明示的に「十人の王」と述べる一方、文脈は象徴的な黙示文学である。その緊張を解釈的な言い換えで解消しないため。
- issue: 「一時間」を文字どおりの時間とするか、短い期間の象徴とするか
  choice: 本文では「一時間だけ」とし、比喩的な可能性を脚注に記した。
  alternative: しばらくの間、短い期間
  rationale: 原文の表現を保持しつつ、黙示文学では短く限られた期間を示す可能性が高いことも読者に伝えるため。
translation_notes:
  register: 明快な現代標準語を用いながら、「角」「王」「獣」「一時間」という黙示文学固有の像を保った。「獣とともに、一時間だけ」の読点により、共同関係と時間的限定を読み取りやすくした。
