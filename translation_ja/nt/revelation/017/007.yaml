  to: すると、御使いは私に言った。「なぜ驚いたのか。私はあなたに、その女と、女を乗せ、七つの頭と十本の角を持つ獣についての奥義を告げよう。」
  rationale: 単数の「奥義」が女と獣の双方に関わるという原文の構造を、「その女と、…獣についての奥義」として明確にした。「女を乗せ、七つの頭と十本の角を持つ」はいずれも「獣」を修飾し、原文で明確な係り先を日本語でも保持している。
