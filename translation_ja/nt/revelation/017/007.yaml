id: REV.17.7
reference: Revelation 17:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: ja
  text: すると、御使いは私に言った。「なぜ驚いたのか。私はあなたに、その女と、女を乗せ、七つの頭と十本の角を持つ獣についての奥義を告げよう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθαύμασας
  choice: 驚いた
  rationale: θαυμάζωの驚嘆・驚愕の意味を、現代日本語で自然かつ簡潔に表す。「不思議に思った」より強い反応を示す。
- source_word: μυστήριον
  choice: 奥義
  rationale: 単なる謎ではなく、隠されていたが今や明かされる真実という黙示文学的含意を保つ。
- source_word: γυναικός
  choice: 女
  rationale: ここでは象徴的人物であり、婚姻関係は示されていないため、「妻」ではなく「女」とする。
- source_word: θηρίου
  choice: 獣
  rationale: 黙示録を通じた終末論的・敵対的な象徴表現との一貫性を保つ。
- source_word: βαστάζοντος
  choice: 乗せている
  rationale: 基本的には「運ぶ／担う」だが、直前の17:3の光景では女が獣に乗っているため、日本語では獣が女を支えて載せている構図を自然に表す。
- source_word: ἔχοντος
  choice: 持つ
  rationale: 獣が七つの頭と十本の角を有することを明瞭に示す。
- source_word: κεφαλάς
  choice: 頭
  rationale: 幻の解釈に重要な身体的イメージをそのまま保持する。
- source_word: κέρατα
  choice: 角
  rationale: 黙示文学における象徴的イメージを字義どおり保持する。
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う表現として簡潔で自然な現代日本語。
- source_word: ἐρῶ σοι
  choice: 私はあなたに…告げよう
  rationale: 御使いがこれから啓示内容を伝える未来の動作を、 dignified な語調で自然に表す。
theological_decisions:
- issue: 「七つの頭と十本の角を持つ」の係り先
  choice: 「獣」に明確に係るように訳す
  alternative: 日本語でも係り先を曖昧にする
  rationale: τοῦ βαστάζοντοςとτοῦ ἔχοντοςはいずれもθηρίουに同格的に係り、女ではなく獣が女を運び、七つの頭と十本の角を持つことがギリシア語の文法上明確である。
- issue: 「女の奥義」と「獣」の関係
  choice: 女と獣の双方に関わる奥義として表す
  alternative: 女の奥義だけを告げ、獣をその付随説明として扱う
  rationale: τὸ μυστήριονがτῆς γυναικὸς καὶ τοῦ θηρίουの双方を属格で受ける構造を、「女の奥義と…獣の奥義」によって日本語で明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、御使いの宣言にふさわしい端正な語調を保った。「奥義」は聖書的・黙示文学的意味を保つため採用し、文の長さによる係り受けの混乱を避けるため「すなわち」を補った。
