id: REV.17.8
reference: Revelation 17:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: ja
  text: あなたが見た獣は、かつてはいたが、今はいない。そして、これから底知れぬ淵から上って来て、滅びへと向かう。地上に住む者たちのうち、世界の基が据えられた時から命の書にその名が記されていない者たちは、その獣を見て驚く。それが、かつてはいたが、今はいないが、やがて現れるからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その獣が、かつてはいたが、今はいないが、やがて現れることに驚く」とも訳せる。ギリシア語は、驚く理由を示すとも、驚きの内容を示すとも取れる。また「現れる」は、直訳すれば「そこにいるようになる」。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ θηρίον
  choice: 獣
  rationale: 黙示録における象徴的で恐るべき存在という力を保ち、日本語の聖書表現としても明快である。
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: かつてはいたが、今はいない
  rationale: 存在を表す単純で鋭い時制の対比を、自然な現代日本語で保持する。
- source_word: μέλλει ἀναβαίνειν
  choice: これから……上って来て
  rationale: μέλλει の将来的・切迫的な含みと、ἀναβαίνειν の上向きの動きを自然に表す。
- source_word: ἐκ τῆς ἀβύσσου
  choice: 底知れぬ淵から
  rationale: 黙示文学的な「深淵」のイメージを保ちつつ、「底なしの穴」のように形状を限定しすぎない。
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: 滅びへと向かう
  rationale: 最終的な破滅に至る方向性を明確にし、古風な宗教用語を避ける。
- source_word: θαυμασθήσονται
  choice: 驚く
  rationale: ここでの驚嘆・驚愕を、文脈に合う平明な日本語で表す。単なる好意的な感嘆には限定しない。
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: 地上に住む者たち
  rationale: 黙示録で反復される表現を直截に保つ。
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: その名が記されていない者たち
  rationale: ギリシア語の単数「名」を保持しながら、日本語として複数の人々を自然に指す。
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: 命の書に
  rationale: 記名について日本語では「書に記す」が自然であり、ἐπί の機能を文脈に即して表す。
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: 世界の基が据えられた時から
  rationale: 創造の始まりを指す慣用句の比喩を保ち、その時間的起点を明示する。
- source_word: βλεπόντων
  choice: その獣を見て
  rationale: 分詞と主動詞の時間的関係を簡潔で自然な日本語にする。
- source_word: παρέσται
  choice: やがて現れる
  rationale: 未来の到来・現前を自然な日本語で表す。「復活」など本文に明示されない概念は加えない。
theological_decisions:
- issue: 「世界の基が据えられた時から」の修飾関係
  choice: 「命の書にその名が記されていない」に結び付ける
  alternative: 近接する別の救済史的概念に結び付けて解釈する
  rationale: この節の語順では当該句が命の書への記名に直接続くため、その統語的関係を保つ。ただし、予定論などの体系的結論は訳文に加えない。
- issue: ὅτι の機能
  choice: 理由を表す「からである」
  alternative: 驚きの内容を示す「…ことに」または「…のを」
  rationale: 獣を見て驚く理由として自然に読める一方、内容を導く解釈も文法上可能なので脚注で保持する。
- issue: παρέσται のニュアンス
  choice: 「やがて現れる」
  alternative: 「やがてそこにいるようになる」または「やって来る」
  rationale: πάρειμι の現前・到来の意味を自然に伝え、「復活」と断定することを避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい荘重さと反復的な時制対比を保持した。「底知れぬ淵」「命の書」など主要な象徴語は簡潔に訳し、教派固有の解釈は加えていない。
