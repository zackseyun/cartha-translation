source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: ja
  text: また、彼は私に言った。「あなたが見た水、あの娼婦がその上に座っている水は、諸民、群衆、諸国民、諸言語である。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ πόρνη
  choice: あの娼婦
  rationale: 文脈ですでに登場している特定の人物像を指す定冠詞を「あの」で示し、πόρνηを現代日本語で明瞭かつ直接的な「娼婦」とした。
- source_word: λαοὶ
  choice: もろもろの民族
  rationale: 複数形を保ち、多様な民の集団を表す語として「民族」を採用した。
- source_word: ὄχλοι
  choice: 群衆
  rationale: λαοὶとの区別を保ちながら、大勢の人々の集まりを表す自然な訳語とした。
- source_word: ἔθνη
  choice: 国民
  rationale: 列挙内でλαοὶと区別し、諸国に属する人々という集合的意味を表した。
- source_word: γλῶσσαι
  choice: 言語
  rationale: 諸言語、ひいてはそれを話す集団を指す黙示文学的用法を、原文どおり換喩を保って訳した。
- source_word: οὗ
  choice: 所
  rationale: 場所を示す関係副詞として自然に訳し、水が象徴する領域の上に娼婦が座るという像を保った。
theological_decisions:
- issue: 水と諸集団の象徴的同定
  choice: 「あなたが見た水、すなわち…所は、…である」
  alternative: 「あなたが見た水は…を表している」
  rationale: 原文の連結動詞εἰσίνによる直接的な同定を保ち、「表す」と解釈的に言い換えなかった。
- issue: 娼婦が水の上に座る象徴像
  choice: 「あの娼婦が座っている所」
  alternative: 「あの娼婦が支配している人々」
  rationale: 「座る」を「支配する」と解釈せず、象徴像とその解釈上の余地を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の四項列挙と象徴的な直接同定を維持しつつ、日本語として関係節の位置を分かりやすく整えた。
