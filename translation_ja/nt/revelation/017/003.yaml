id: REV.17.3
reference: Revelation 17:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: ja
  text: 私は霊にあって[a]、御使いに荒野へ運ばれた。私は、冒瀆的な名で満ち、七つの頭と十本の角を持つ緋色の獣に、一人の女が座っているのを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「御霊によって」。このギリシア語表現は、霊的な状態を指すことも、御霊に運ばれることを指すこともあり得る。黙示録ではしばしば幻の体験を導入する。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: 運んで行った
  rationale: 場所を移して運ぶことを表すアオリストであり、幻の中で別の場所へ移された動きを自然な現代日本語で示す。
- source_word: εἰς ἔρημον
  choice: 荒野へ
  rationale: ἔρημοςは砂漠に限定されず、人の住まない荒涼とした場所を指し得るため、「荒野」とした。ギリシア語は無冠詞だが、日本語では定・不定を明示せず自然に保持できる。
- source_word: ἐν πνεύματι
  choice: 霊にあって
  rationale: 黙示録で幻の体験を導入する表現として、霊的状態と聖霊の働きの双方を排除しない訳語を選んだ。日本語では表記だけで解釈を確定しないよう「霊」とした。
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον
  choice: 緋色の獣に、一人の女が座っている
  rationale: 女が獣の上に位置する情景を明瞭に保ち、κόκκινονの鮮明な赤色を象徴性のある「緋色」で表した。
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: 冒瀆的な名で満ちた
  rationale: γέμονταの「満ちている」をそのまま保ち、ὀνόματα βλασφημίαςを、冒瀆を特徴とする名々として自然な日本語にした。
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: その獣には、七つの頭と十本の角があった
  rationale: 分詞ἔχωνの描写上の主語が獣であることを日本語で明確にし、黙示文学の具体的なイメージを保持した。
theological_decisions:
- issue: ἐν πνεύματιの解釈
  choice: 本文を「霊にあって」とし、幻における霊的状態と聖霊による働きの含みを保持する。
  alternative: 「御霊によって」または「霊のうちに」
  rationale: この句は黙示録で預言的な幻の体験を導入するが、ギリシア語写本の大文字・小文字から聖霊への言及を確定することはできない。本文と脚注で解釈上の幅を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「冒瀆」は宗教的文脈で必要な意味を正確に伝え、「獣」「七つの頭」「十本の角」という黙示文学の表現は説明的に言い換えず保持した。
