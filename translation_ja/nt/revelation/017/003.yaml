- from: 御使いは、霊にあって[a]私を荒野へ運んで行った。そこで私は、冒瀆的な名で満ちた緋色の獣に、一人の女が座っているのを見た。その獣には、七つの頭と十本の角があった。
  to: 私は霊にあって[a]、御使いに荒野へ運ばれた。私は、冒瀆的な名で満ち、七つの頭と十本の角を持つ緋色の獣に、一人の女が座っているのを見た。
  rationale: 本文の語順を改めて、「霊にあって」が幻を見た本人の状態を表すことを明確にした。後半は獣を修飾する二つの分詞句を一続きにし、γέμονταおよびἔχωνがともに獣を描写する原文の構造を自然な日本語で反映した。意味内容、原文の不定性、および脚注の解釈上の幅は維持した。
