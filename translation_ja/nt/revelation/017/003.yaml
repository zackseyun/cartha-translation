  source_fidelity: 主要な語句は原文に忠実である。ἀπήνεγκένの幻における移送、εἰς ἔρημονの「荒野」、緋色の獣、冒瀆的な名、七つの頭と十本の角はいずれも適切に保持されている。ただし現行の「御使いは、霊にあって私を」は、「霊にあって」が御使いを修飾するようにも読め、黙示録におけるヨハネの幻の状態を示す句として不明瞭である。
  naturalness: 「私は霊にあって、御使いに荒野へ運ばれた」とすることで、明瞭な現代標準日本語となり、幻の状態と移送の関係も自然になる。「一人の女」は不定性を保ちつつ、本文の叙述として自然である。
  terminology: 「御使い」「霊」「荒野」「緋色の獣」「冒瀆的な名」はこの文脈に適切である。「霊」は大文字表記のないギリシア語の曖昧さを日本語で不必要に決定せず、脚注の「御霊によって」が可能な理解を示している。
