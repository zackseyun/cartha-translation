id: REV.17.5
reference: Revelation 17:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: ja
  text: また、その女の額には、名がこう書かれていた。「奥義[a]、大バビロン、地上の娼婦たちと忌まわしいものの母。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「名が書かれていた。それは奥義である。『大バビロン、地上の娼婦たちと忌まわしいものの母』」。この場合、「奥義」は銘そのものの一部ではなく、後に続く名の象徴的な意味を示す語と取る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: その女の額には
  rationale: ἐπί＋対格の位置関係を自然な現代日本語で表し、額に記された銘という像を保った。
- source_word: ὄνομα γεγραμμένον
  choice: 名がこう書かれていた
  rationale: 完了受動分詞の結果状態を「書かれていた」で表した。「こう」を補い、後続する銘へのつながりを日本語として明瞭にした。
- source_word: μυστήριον
  choice: 奥義
  rationale: 黙示文学における、神によって明かされる隠された意味という含みを保つ語を選び、本文では銘の一部として扱った。単なる不可解さを表す「謎」よりも原語の聖書的用法に適する。
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: 大バビロン
  rationale: 固有名を音写し、ἡ μεγάληを日本語で自然かつ荘重な称号「大バビロン」とした。
- source_word: ἡ μήτηρ
  choice: 母
  rationale: 後続する二つの属格を受ける称号として、簡潔な「母」とした。
- source_word: τῶν πορνῶν
  choice: 娼婦たち
  rationale: πόρνηの直接的な意味を、現代日本語で明瞭かつ過度に俗悪でない語によって表した。
- source_word: τῶν βδελυγμάτων
  choice: 忌まわしいもの
  rationale: 偶像礼拝や道徳的嫌悪を含み得るβδέλυγμαの幅を保ち、特定の対象だけに限定しない表現とした。
- source_word: τῆς γῆς
  choice: 地上の
  rationale: 黙示録の普遍的な視野ではγῆは「土地」より「地上」が適切であり、「娼婦たち」と「忌まわしいもの」の双方に自然にかかる形とした。
theological_decisions:
- issue: μυστήριονが額に書かれた名の一部か、後続する名の象徴的意味を導入する叙述語か
  choice: 本文では銘の一部として「奥義、大バビロン……」とした。
  alternative: 「名が書かれていた。それは奥義である。『大バビロン、地上の娼婦たちと忌まわしいものの母』」のように、奥義を後続の名の象徴性を示す語と取る。
  rationale: ギリシア語原文に句読法はなく両解釈が可能だが、語順上、μυστήριονを書かれた名の一部と読むことが自然である。別解も十分可能なため脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、黙示録の荘重で象徴的な調子を保った。「娼婦」「忌まわしいもの」は原文の強い比喩と嫌悪の含みを弱めず、過度に古風な語は避けた。
