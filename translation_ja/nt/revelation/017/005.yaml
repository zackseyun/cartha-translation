  terminology: 「奥義」は新約、とりわけ黙示録における μυστήριον の神学的・象徴的な含意を保つ適切な語である。「大バビロン」は固有名・称号として定着した自然な表現であり、「娼婦」「忌まわしいもの」も原文の強い比喩的・倫理的語調を不必要に緩和していない。
