  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: ja
  text: ここに、知恵のある心が必要である。七つの頭は、女がその上に座っている七つの山[a]であり、また七人の王である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「七つの丘」。ギリシア語は山にも丘にも用いられるが、「山」がより直接的な訳。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν
  choice: ここには、知恵を持つ思慮が必要である
  rationale: 黙示文学の象徴を理解するために知恵ある思考が求められるというギリシア語の慣用的な趣旨を、現代日本語として自然に表した。「思慮」により νοῦς の知的・識別的側面を保つ。
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: 七つの頭
  rationale: 象徴語を解釈で置き換えず、そのまま保持した。
- source_word: ἑπτὰ ὄρη
  choice: 七つの山
  rationale: ὄρη の直接的で通常の意味を採用した。「丘」の可能性は脚注に残す。
- source_word: ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν
  choice: 女がその上に座っている
  rationale: ὅπου と ἐπ’ αὐτῶν の位置関係を、日本語で不自然な重複を避けつつ明示した。
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: また七人の王である
  rationale: 省略された主語を「七つの頭」と理解し、山との対応に加えて王との対応も示す原文の並列を保持した。βασιλεῖς は人物を指す表現として「七人の王」とした。
theological_decisions:
- issue: 七つの頭が指す象徴的対象
  choice: 七つの山および七人の王という本文中の対応だけを示す
  alternative: 七つの丘を持つローマ、特定の皇帝、諸王国などと明示的に同定する
  rationale: 本文自体は象徴の対応を示すが、その具体的な歴史上の指示対象までは確定していないため、翻訳で解釈を固定しない。
- issue: 「山」と「丘」の選択
  choice: 本文では「山」
  alternative: 本文で「丘」
  rationale: ὄρος のより直接的な訳を本文に置き、ローマの七つの丘を想起させる可能性を含む「丘」は脚注で示して、語義上および解釈上の幅を保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。象徴表現は説明的に展開せず保持した。冒頭は逐語的な不自然さを避けつつ、解釈に知恵ある思慮を要するという趣旨を表した。
