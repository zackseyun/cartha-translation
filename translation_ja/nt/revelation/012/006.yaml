revisions:
- from: 女は荒れ野へ逃げた。そこには、神によって用意された場所があり、そこで千二百六十日の間、彼女が養われる[a]ためであった。
  to: 女は荒れ野へ逃げた。そこには、神によって用意された、そこで彼女を千二百六十日の間養うための場所がある。
  rationale: 目的節を「そこで彼女を千二百六十日の間養うための」として「場所」に係らせ、ἵναの目的を自然に表した。「彼女を養う」は主語を補わない日本語であり、誰が養うかを特定せずに原文の三人称複数能動形を反映する。脚注はこの文法上の特徴を明記する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:34:52Z'
review_pass:
  verdict: revise
  source_fidelity: 「荒れ野へ逃げた」「神によって用意された場所」「千二百六十日の間」は原文に忠実です。ただし本文の「彼女が養われる」は、主語未明示の三人称複数能動形 τρέφωσιν を受動形に替えており、脚注で補っているとはいえ本文では原文の能動・不定の行為者という特徴が後退しています。また「ためであった」はἵναの目的を表す日本語として不自然で、時制も文脈に適しません。
  naturalness: 「女は荒れ野へ逃げた」は明瞭で自然です。後半は「場所があり、…ためであった」が統語的・文体的にぎこちないため、目的節を「…養うための場所」として場所に直接係らせると、自然な現代標準日本語になります。
  terminology: 「女」「荒れ野」「神」「場所」「養う」はいずれも適切です。「荒れ野」はἔρημοςを砂漠に限定せず、黙示文学・聖書文脈にもよく合います。「養う」はτρέφωの継続的な扶養・食養の意味を過度に限定しません。
  issues:
  - severity: medium
    issue: τρέφωσινの能動形が本文で受動形になっている
    rationale: ギリシア語は行為者を明示しない三人称複数能動形である。日本語では主語を補わない「彼女を養う」とすることで、自然さを保ちつつ、特定されない行為者と能動的表現をよりよく反映できる。
  - severity: medium
    issue: 「ためであった」の構文と時制
    rationale: ἵναは目的を示すが、「場所があり、…ためであった」は目的の係り先が不明瞭で不自然である。また原文の現在形ἔχειに対して「であった」は不必要な過去化となる。目的を「…養うための場所」として表すのが適切である。
  revised_text: 女は荒れ野へ逃げた。そこには、神によって用意された、そこで彼女を千二百六十日の間養うための場所がある。
  revised_footnotes:
  - marker: a
    text: 直訳すると「そこで、彼らが彼女を千二百六十日の間養うため」。ギリシア語では、主語が明示されていない三人称複数の能動動詞が用いられている。
    reason: 原文の能動形と、明示されていない行為者を示すため。
  revision_rationale: 目的節を「そこで彼女を千二百六十日の間養うための」として「場所」に係らせ、ἵναの目的を自然に表した。「彼女を養う」は主語を補わない日本語であり、誰が養うかを特定せずに原文の三人称複数能動形を反映する。脚注はこの文法上の特徴を明記する。
