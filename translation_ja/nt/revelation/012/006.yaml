id: REV.12.6
reference: Revelation 12:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: ja
  text: 女は荒れ野へ逃げた。そこには、神によって用意された、そこで彼女を千二百六十日の間養うための場所がある。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφυγεν
  choice: 逃げた
  rationale: φеύγωのアオリストが表す切迫した逃避を、簡潔で自然な現代日本語で表した。
- source_word: ἔρημον
  choice: 荒れ野
  rationale: 砂地の砂漠に限定せず、人里離れた荒涼とした場所という聖書的な含意を保つ。
- source_word: τόπον
  choice: 場所
  rationale: τόποςの一般的な意味を過度に具体化せずに訳した。
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: 神によって用意された
  rationale: 完了受動分詞による、すでに整えられている状態と、ἀπόが示す行為者を保った。
- source_word: ἵνα
  choice: ためであった
  rationale: 文脈における目的の意味を明確に表した。
- source_word: τρέφωσιν αὐτὴν
  choice: 彼女が養われる
  rationale: 原文は主語を明示しない三人称複数能動形だが、日本語で不自然な『彼らが』を補わず、行為者を特定しない受動表現とした。原文の形は脚注で明示する。
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: 千二百六十日の間
  rationale: 時間の長さを表す対格を自然な日本語で示し、数字を本文中で漢数字表記した。
- source_word: ὅπου ἔχει ἐκεῖ
  choice: そこには……場所があり
  rationale: 原文が場所を重ねて強調する点を『そこには』で反映しつつ、日本語として不自然な重複を避けた。
theological_decisions:
- issue: τρέφωσινの明示されない主語
  choice: 本文では『彼女が養われる』とし、行為者を特定しない
  alternative: 『彼らが彼女を養う』
  rationale: 原文の動詞は主語のない三人称複数能動形であり、誰が養うのかは特定されていない。『神が』などと補わず、自然な日本語では受動形を用い、能動形の曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。『荒れ野』によって聖書的な響きを保ちつつ、養う主体については原文以上に特定しない。
