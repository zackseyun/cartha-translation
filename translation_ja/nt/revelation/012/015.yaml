id: REV.12.15
reference: Revelation 12:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: ja
  text: すると蛇は、女の後を追うように[a]、その口から川のような水を吐き出した。女が川に押し流されるようにするためであった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「女の後ろに」。ギリシア語は、位置を表すとも、女を追って攻撃する方向を表すとも取れる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「女が川に運び去られるようにするため」。川の流れによって女を運び去らせることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: 吐き出した
  rationale: 基本義は「投げる、放つ」だが、口から水を勢いよく放出する場面では、現代日本語として自然で鮮明な「吐き出した」が動作をよく伝える。
- source_word: ὁ ὄφις
  choice: 蛇
  rationale: 黙示録の象徴性と聖書的連想を保ちつつ、ὄφιςを簡潔かつ自然に表す。
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: その口から
  rationale: 起点を表す句をそのまま明瞭に訳した。
- source_word: ὀπίσω τῆς γυναικός
  choice: 女の後をめがけて
  rationale: ὀπίσωは「後ろに」という位置とも「後を追って」という方向とも取れる。文脈上の攻撃方向を自然に示しながら、脚注で空間的な別解を残す。
- source_word: ὕδωρ ὡς ποταμόν
  choice: 川のような水
  rationale: ὡςの比喩とποταμόςの「川」という像を保ち、「洪水」と解釈的に言い換えない。
- source_word: ἵνα
  choice: ためであった
  rationale: 蛇の行為の目的を明示し、現代日本語の自然な文の流れに整えた。
- source_word: ποταμοφόρητον ποιήσῃ
  choice: その川に押し流させる
  rationale: まれな形容詞ποταμοφόρητοςの「川に運び去られる」と、ποιέωの使役的な働きを自然な日本語で表す。「溺れさせる」ほど結果を限定しない。
theological_decisions:
- issue: 蛇の攻撃を表す黙示的・象徴的な水の像
  choice: 「川のような水」「その川に押し流させる」と像をそのまま訳す
  alternative: 水を軍勢、迫害、偽り、混沌などと本文中で解釈して訳す
  rationale: 原文は象徴の意味をこの節で明示していないため、特定の解釈を本文に持ち込まず、黙示的な緊張と比喩を保持する。
- issue: ὀπίσω τῆς γυναικόςの方向的・空間的曖昧さ
  choice: 本文では攻撃の方向を示す「女の後をめがけて」とし、脚注で「女の後ろに」を示す
  alternative: 本文を「女の後ろに」とする
  rationale: 追跡と攻撃の文脈には方向的理解がよく合うが、ギリシア語が許す空間的理解も排除せず脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「すると」で物語の進行を示し、二文に分けて目的節を読みやすくした。象徴を解説的にほどかず、原文の川の像と使役表現を保持した。
