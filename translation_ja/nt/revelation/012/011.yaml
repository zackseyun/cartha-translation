id: REV.12.11
reference: Revelation 12:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: ja
  text: 彼らは、小羊の血と自分たちの証しの言葉によって、彼に打ち勝った[a]。彼らは死に至るまで、自分のいのち[b]を惜しまなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼に勝利した」。
    reason: lexical_alternative
  - marker: b
    text: 「いのち」と訳したギリシア語は、「自分自身」または「魂」を意味することもある。ここでは、死を前にしても惜しまなかったいのちを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: 勝利した
  rationale: 「勝つ、打ち勝つ」を表す語。黙示録の戦いのイメージを保ちつつ、現代日本語として自然な「彼に勝利した」とした。
- source_word: διὰ τὸ αἷμα
  choice: 血によって
  rationale: διά＋対格には理由・根拠の含みがあり、文脈上は小羊の血が勝利の根拠または手段として示される。「によって」はその両面を過度に限定せず表せる。
- source_word: ἀρνίου
  choice: 小羊
  rationale: 黙示録でキリストを指す称号であり、犠牲と黙示的イメージを保つため「小羊」とした。
- source_word: λόγον τῆς μαρτυρίας αὐτῶν
  choice: 自分たちの証しの言葉
  rationale: λόγοςとμαρτυρίαの双方を訳出し、彼らが語った証言・メッセージという意味を保った。
- source_word: τὴν ψυχὴν αὐτῶν
  choice: 自分のいのち
  rationale: ψυχήは「いのち、人自身、魂」を表し得るが、ここでは死をも辞さない姿勢が主題なので「いのち」が最も文脈に合う。ギリシア語の単数形が各人に配分的に用いられていることを「自分のいのち」で表した。
- source_word: οὐκ ἠγάπησαν
  choice: 惜しまなかった
  rationale: 直訳は「愛さなかった」だが、日本語では命を手放す覚悟を表す文脈に「いのちを惜しまなかった」が自然であり、原意を明瞭に伝える。
- source_word: ἄχρι θανάτου
  choice: 死に至るまで
  rationale: 忠実さが死に及ぶ限界まで貫かれたことを、荘重かつ自然な日本語で表す。
theological_decisions:
- issue: 「小羊の血によって」の勝利における意味
  choice: 勝利の根拠または手段を示す表現として「によって」とした。
  alternative: 「小羊の血のゆえに」
  rationale: διά＋対格の理由・根拠の含みを認めつつ、本文が明示していない贖罪論の詳細を補わず、小羊の血に勝利が依存することを示した。
- issue: 殉教の文脈におけるψυχή
  choice: 「魂」ではなく「いのち」とした。
  alternative: 「自分の魂」
  rationale: 身体と魂の対立を本文に持ち込まず、死に直面して地上の命を手放すという文脈上の意味を優先した。
- issue: οὐκ ἠγάπησανの日本語表現
  choice: 「いのちを惜しまなかった」とした。
  alternative: 「いのちを愛さなかった」
  rationale: 自己の命を憎んだという意味に読ませず、死を前にしても命に執着しなかったという文脈的意味を自然に伝えた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録にふさわしい荘重さを保った。「小羊」「証し」「死に至るまで」は聖書的イメージを保持し、「惜しまなかった」で殉教の文脈を自然に表した。
