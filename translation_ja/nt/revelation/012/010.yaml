id: REV.12.10
reference: Revelation 12:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: ja
  text: また、私は天で大きな声がこう言うのを聞いた。「今や、救いと力と私たちの神の王国、またそのメシア[a]の権威が到来した。私たちの兄弟たち[b]を告発する者、すなわち昼も夜も私たちの神の前で彼らを告発する者が、投げ落とされたからである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」とも訳せる。ギリシア語Χριστός（クリストス）は、神に油を注がれた者を意味する称号である。
    reason: alternative_reading
  - marker: b
    text: 「兄弟たち」は、女性を含む信仰者の仲間全体を指し得る。
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: 大きな声
  rationale: φωνήとμέγαςの組み合わせは声量の大きさを表すため、自然な現代日本語で「大きな声」とした。
- source_word: Ἄρτι ἐγένετο
  choice: 今や…現れた
  rationale: Ἄρτιの決定的な現在性と、ἐγένετοが示す実現・到来を、日本語として自然な宣言文で表した。
- source_word: ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία
  choice: 救いと力と王国
  rationale: 冠詞を伴う修辞的列挙を簡潔に保ち、βασιλείαは終末的な王的支配を背景に持つ「王国」とした。
- source_word: ἡ ἐξουσία
  choice: 権威
  rationale: δύναμιςの「力」と区別し、正当な支配権を示す語として「権威」を選んだ。
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: 神のメシア
  rationale: αὐτοῦの指示対象を日本語で明確にし、Χριστόςを称号として、その意味を伝える「メシア」と訳した。
- source_word: ἐβλήθη
  choice: 投げ落とされた
  rationale: 受動態と、天からの強制的な追放・転落という黙示的情景を明確に保った。
- source_word: ὁ κατήγωρ…ὁ κατηγορῶν
  choice: 告発する者…告発していた者
  rationale: 名詞と分詞に共通する法廷的な告発の意味を反復して表し、原文の修辞を保った。
- source_word: ἡμέρας καὶ νυκτός
  choice: 昼も夜も
  rationale: 継続的・絶え間ない告発を示す自然な日本語表現とした。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: ここでは神に属する油注がれた統治者という称号として機能するため、称号の意味を明示する「メシア」を本文に採用し、一般的な音訳「キリスト」を脚注に示した。
- issue: ἀδελφῶνの性別と範囲
  choice: 兄弟たち
  alternative: 兄弟姉妹たち／信仰の仲間たち
  rationale: 原文の男性複数形に対応する表現を本文に置きつつ、共同体全体を指し女性も含み得ることを脚注で明示した。
- issue: βασιλείαの意味領域
  choice: 王国
  alternative: 支配／王としての統治
  rationale: 終末論的な神の統治という含意を保ちながら、黙示文学の格調と一般的な聖書語彙を両立させた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、天上の宣言にふさわしい荘重さと、原文の反復および法廷的表現を保った。「神のメシア」は逐語的には「その方のメシア」だが、日本語で指示関係が曖昧にならないよう所有者を明示した。
