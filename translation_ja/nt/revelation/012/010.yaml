revisions:
- from: また私は、天で大きな声がこう言うのを聞いた。「今や、私たちの神の救いと力と王国、また神のメシア[a]の権威が現れた。私たちの兄弟たち[b]を告発する者、すなわち昼も夜も私たちの神の前で彼らを告発していた者が、投げ落とされたからである。」
  to: また、私は天で大きな声がこう言うのを聞いた。「今や、救いと力と私たちの神の王国、またそのメシア[a]の権威が到来した。私たちの兄弟たち[b]を告発する者、すなわち昼も夜も私たちの神の前で彼らを告発する者が、投げ落とされたからである。」
  rationale: 原文の時制・相（ἐγένετο、現在分詞κατηγορῶν）と属格の直接的な修飾関係を正した。メシアという称号訳、告発という法廷語、天から投げ落とされる受動的表現、および既存の脚注アンカーは維持した。
