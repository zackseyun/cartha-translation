  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: ja
  text: また、天に大いなるしるしが現れた。太陽をまとった女で、その足の下には月があり、頭には十二の星からなる冠[a]があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「花輪状の冠」または「勝利者の冠」とも訳せる。ギリシア語はステファノスで、王の冠を指すディアデーマとは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον μέγα
  choice: 大いなるしるし
  rationale: 黙示文学における象徴的な天上の光景を表し、単なる奇跡や怪異に限定しない。「大いなる」は規模と重要性の両方を保つ。
- source_word: ὤφθη ἐν τῷ οὐρανῷ
  choice: 天に……現れた
  rationale: 受動形の字義は「見られた」だが、幻の出現を語る自然な現代日本語として「現れた」とした。οὐρανόςはこの幻視の文脈では「空」より「天」が適切。
- source_word: γυνὴ περιβεβλημένη τὸν ἥλιον
  choice: 太陽をまとった一人の女
  rationale: περιβάλλωの完了分詞が表す、太陽を衣のように身につけた状態を、鮮明かつ自然に伝える。「一人の」は新たに登場する人物であることを日本語で明確にする。
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: その足の下には月があり
  rationale: 空間的な配置を保ちつつ、日本語として滑らかな叙述にした。
- source_word: στέφανος ἀστέρων δώδεκα
  choice: 十二の星からなる冠
  rationale: 属格が示す冠の構成を自然に表した。στέφανοςは王のディアデーマとは異なる冠だが、本文では明快な「冠」を用い、語義上のニュアンスを脚注に示す。
theological_decisions:
- issue: 女の象徴的な正体
  choice: 本文では正体を特定せず、幻に現れた女として描写する。
  alternative: イスラエル、マリア、神の民、教会などと明示する。
  rationale: この節自体は女の正体を明言していないため、特定の神学的解釈を訳文に織り込まず、象徴の多義性と緊張を保つ。
translation_notes:
  register: 明瞭で格調ある現代標準語。黙示文学の荘重さを保つため「大いなるしるし」を採用しつつ、文全体は普通の読者にも理解しやすい構文に整えた。脚注記号[a]は本文中の対応箇所に付した。
