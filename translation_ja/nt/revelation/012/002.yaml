source:
  edition: SBLGNT
  text: καὶ ἐν γαστρὶ ἔχουσα· ⸂καὶ κράζει⸃ ὠδίνουσα καὶ βασανιζομένη τεκεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/002.yaml
  text: And she was pregnant[a], and she cries out[c][b], suffering birth pains and being tormented to give birth.
translation:
  language: ja
  text: 女は身ごもっていて[a]、産みの苦しみの中で[b]、子を産むために苦しめられ[c]、叫んでいる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「胎内に持っていて」。別訳「妊娠していて」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「陣痛に苦しみ」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「激しい苦痛の中にあり」「苦悶しており」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: 身ごもっており
  rationale: 直訳は「胎内に持っていて」。妊娠を表す慣用句として、現代日本語で自然かつ品位のある「身ごもっている」とした。
- source_word: κράζει
  choice: 叫んでいた
  rationale: 歴史的現在法の生々しさを保ちつつ、日本語の幻の叙述として自然につながるよう継続的な叫びを表した。
- source_word: ὠδίνουσα
  choice: 産みの苦しみにあえぎ
  rationale: 分娩時の痛みを明示する語であり、「陣痛」だけよりも苦痛の描写を保つ表現とした。
- source_word: βασανιζομένη
  choice: 苦しめられながら
  rationale: 受動形と強い苦痛を保った。日本語で外部の加害者を必要以上に想定させず、出産に伴う激しい苦しみとしても読める形で原文の緊張を残した。
- source_word: τεκεῖν
  choice: 子を産もうとして
  rationale: 出産を明確に表し、不定詞が示す出産との目的・状況的な関係を自然な日本語にした。
- source_word: καὶ ... καὶ
  choice: …、…、…ながら
  rationale: 原文の累加的な描写を保ちつつ、接続詞「そして」の過剰な反復を避けて自然な日本語に整えた。
theological_decisions:
- issue: 幻に現れる女の苦しみの強さと性質
  choice: βασανιζομένηの受動性と強さを「苦しめられながら」で保持し、女の象徴的な正体は特定しない。
  alternative: 「苦悶しながら」「苦しみながら」として受動性を弱める。
  rationale: 原文は苦しみを強烈に描く一方、この節自体は女の象徴的意味や苦痛の神学的意味を説明していないため、解釈を訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、黙示文学にふさわしい生々しさと品位を両立させた。語順は、日本語で叫びの原因と状況が自然に理解できるよう整理した。
