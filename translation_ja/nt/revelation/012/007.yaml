id: REV.12.7
reference: Revelation 12:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: ja
  text: すると、天で戦いが起こった。ミカエルとその天使たちが竜と戦い[a]、竜とその天使たちも戦った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「ミカエルとその天使たちが、竜と戦うために」。ギリシア語は冠詞付き不定詞を用いた圧縮された表現である。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは、「竜が戦った。そして、その天使たちも」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: 戦いが起こった
  rationale: γίνομαι＋名詞が表す出来事の発生を、明瞭で自然な現代日本語で表した。「戦いがあった」も可能だが、ここでは開始・発生の含みを保つ。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天で
  rationale: この文脈の οὐρανός は空ではなく天上の領域を指すため、日本語聖書で自然かつ簡潔な「天」とした。
- source_word: Μιχαὴλ
  choice: ミカエル
  rationale: 解釈的な称号を加えず、標準的な日本語表記で固有名を音写した。
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: その御使いたち
  rationale: αὐτοῦ の所属関係を「その」で保ち、ἄγγελοι は文体上の品位と一般的な聖書用語を考慮して「御使い」とした。
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: 竜と戦ったのである
  rationale: 本文の冠詞付き不定詞による圧縮された構文を、自然な日本語の叙述として明示した。μετά は相手を伴う形だが、πολεμέω の文脈により敵対する相手を示す。
- source_word: δράκοντος / δράκων
  choice: 竜
  rationale: 黙示文学的形象を直接表す標準的な訳語であり、余分な解釈を加えない。
- source_word: ἐπολέμησεν
  choice: 戦った
  rationale: 原文は単純に「戦った」と述べているため、「応戦した」のような応答性を明示せず、語義を簡潔に保った。
- source_word: καὶ οἱ ἄγγελοι αὐτοῦ
  choice: その使いたちとともに
  rationale: 原文では動詞の後に「そして彼の使いたち」と置く省略的並列である。日本語では共同主体であることが明瞭になるよう「とともに」とした。竜側には「御」を付けず、同じ ἄγγελοι でも自然な日本語上の区別を設けた。
theological_decisions:
- issue: ミカエルの身分と正体
  choice: 固有名「ミカエル」のみを記し、称号や同定を加えない。
  alternative: 「大天使ミカエル」とする、またはキリスト論的な同定を訳文に反映する。
  rationale: この節自体はミカエルの階級を述べず、キリストとも同定していないため、本文を越える教派的解釈を避けた。
- issue: 竜側の行動の応答性
  choice: 単に「戦った」とする。
  alternative: 「応戦した」「戦い返した」とする。
  rationale: 物語の流れから応答は推測できるが、ἐπολέμησεν 自体は単純な過去形であるため、原文の曖昧さを残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「さて」で場面転換を示した。原文の反復を保ちつつ、冠詞付き不定詞と後半の省略的並列は日本語として理解しやすく整え、その形式は脚注で示した。
