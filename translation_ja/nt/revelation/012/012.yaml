id: REV.12.12
reference: Revelation 12:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: ja
  text: 'それゆえ、天よ、また天に住む者たちよ、喜べ。


    地[a]と海よ、災いだ。


    悪魔が激しい怒り[b]を抱いて、あなたがたのもとへ下って来たからである。悪魔は、自分にはわずかな時しかない[c]ことを知っているのである。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地」は「陸地」とも訳せる。ギリシア語の γῆ は両方の意味を持つが、ここでは天・地・海という宇宙的な対照を踏まえて「地」とした。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「大きな怒りを抱いて」。
    reason: lexical_alternative
  - marker: c
    text: 直訳すると「わずかな時を持っている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: それゆえ
  rationale: 直前に語られた天上の勝利を受ける推論・帰結を、簡潔で格調ある現代日本語で示す。
- source_word: εὐφραίνεσθε
  choice: 喜べ
  rationale: 命令の力を明確に保ちつつ、黙示文学の高い文体にも合う自然な表現。
- source_word: οἱ οὐρανοὶ
  choice: 天よ
  rationale: 形は主格だが呼びかけとして機能しているため、日本語でも呼格的な表現にした。複数形は日本語では通常「天」と表す。
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: 天に住む者たちよ
  rationale: σκηνόω の住居・幕屋の含意を過度に前面化せず、ここでの居住の意味と呼びかけの力を自然に伝える。
- source_word: οὐαὶ
  choice: 災いがある
  rationale: 預言的な警告・嘆きの定型を、現代日本語で明瞭かつ荘重に表す。
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: 地と海
  rationale: γῆ は「地」または「陸地」を意味し得る。海との対句および宇宙的文脈に合う「地」を本文に採用し、別訳を脚注に残す。
- source_word: κατέβη
  choice: 下って来た
  rationale: 天から地上の領域への移動を自然に示し、完了した出来事の現在的な結果も文脈上伝わる。
- source_word: ὁ διάβολος
  choice: 悪魔
  rationale: この文脈ではサタンを指す確立した称号として用いられており、日本語の標準的な訳語を採用した。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのもとへ
  rationale: πρός の方向・到来を明示し、敵対性そのものは後続の怒りの表現に委ねる。
- source_word: ἔχων θυμὸν μέγαν
  choice: 激しい怒りを抱いて
  rationale: θυμός の強烈な怒りを自然な日本語で表し、分詞の付帯状況も保持する。
- source_word: εἰδὼς
  choice: 知っているのである
  rationale: 悪魔の怒りの理由を説明する分詞の働きを、前後関係が明確になる日本語で表す。
- source_word: ὀλίγον καιρὸν ἔχει
  choice: 自分にはわずかな時しかない
  rationale: καιρός を限定された期間として捉え、「しかない」により短さの強調を再現する。原文にない「残された」は本文に補わない。
theological_decisions:
- issue: 「あなたがた」（πρὸς ὑμᾶς）の指示対象
  choice: 直前に災いを告げられた「地と海」への呼びかけとして訳す。
  alternative: 天とそこに住む者たちへの呼びかけが継続していると読む。
  rationale: 直近の「地と海には災いがある」と「あなたがたのもとへ下って来た」の結び付きが最も自然であり、天の喜びと地上の危機との対照を保つ。ただし「地と海」が具体的に誰を代表するかは本文で説明しない。
- issue: 悪魔の怒りと残り時間の関係
  choice: 「知っているのである」により説明的関係を示す。
  alternative: 単に同時的な状態として「知りながら」と訳す。
  rationale: 分詞 εἰδὼς は形の上では「知っていて」だが、文脈では激しい怒りの理由を説明する含みが強い。因果を過度に固定する「なぜなら」は避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示録の宣言的で荘重な調子を保った。「天よ」「喜べ」は呼びかけと命令を簡潔に示す。「おまえたち」は不要に攻撃的に響くため避け、「あなたがた」とした。原文の行為者を明確にするため最終文では「悪魔」を補って反復したが、時間については原文にない「残された」を加えなかった。
