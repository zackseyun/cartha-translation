    rationale: ἀπὸ προσώπου τοῦ ὄφεωςは「蛇の前から／蛇の面前から離れて」の意味であり、日本語の「蛇の前を離れ」は目的語の取り方が不自然である。また原文では節末に置かれ、荒野で養われる保護状態に関わる。自然な「蛇の前から離れて」を用いることで、飛行だけに限定せず原文の係り先の幅も保てる。
