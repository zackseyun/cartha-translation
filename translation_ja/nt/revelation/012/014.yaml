id: REV.12.14
reference: Revelation 12:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: ja
  text: すると、女には大きな鷲の二つの翼が与えられた。それは、女が荒野の自分の場所へ飛んで行き、蛇の前から離れて、そこで一時と二時と半時の間、養われるためであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一時と二時と半時」は、直訳では「一つの時と複数の時と半分の時」。黙示録11章2～3節、12章6節に出る期間と対応すると考えられるが、ここでは原文の象徴的表現を保っている。
    reason: 現代日本語では期間表現が分かりにくいため、その形と関連箇所を説明しつつ、特定の解釈に固定しないため。
lexical_decisions:
- source_word: αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου
  choice: 大きな鷲の二つの翼
  rationale: 定冠詞と属格構造を素直に反映し、象徴表現を解釈で言い換えず保持した。
- source_word: ἡ ἔρημος
  choice: 荒野
  rationale: 聖書的な響きを保ちながら、現代日本語でも理解しやすい語を選んだ。
- source_word: τρέφεται
  choice: 養われる
  rationale: 受動形を保ち、養う主体を本文以上に特定しない表現とした。
- source_word: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ
  choice: 一時と二時と半時
  rationale: 象徴的期間を算定値へ置き換えず、原文の単数・複数・半分という表現を保持した。
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: 蛇の前を離れ
  rationale: πρόσωπον の空間的な慣用を自然な日本語にしつつ、蛇から隔てられる意味を表した。
theological_decisions:
- issue: 象徴的期間の解釈
  choice: 「一時と二時と半時」と直訳的に保持
  alternative: 「三年半」
  rationale: 本文自体が示す象徴的な言い回しと解釈上の余地を保ち、特定の年代計算へ限定しないため。
- issue: 女を養う主体
  choice: 受動態の「養われる」
  alternative: 「神に養われる」
  rationale: 文脈上は神の保護が示唆されるが、この節の原文は行為者を明示していないため、補わなかった。
- issue: 蛇からの隔離を示す句の係り先
  choice: 滞在・養育全体に関係するよう配置
  alternative: 飛行だけに直接結び付ける
  rationale: ἀπὸ προσώπου τοῦ ὄφεως は節末にあり、逃避後の保護状態を広く修飾し得る曖昧さを残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「すると」で物語の進行を示し、象徴表現は平明に訳しながらも説明的な言い換えを避けた。原文の「そこへ／そこで」に相当する場所の強調は、日本語で不自然な重複にならないよう「荒野にある自分の場所へ」と「そこで」に分けて保持した。
