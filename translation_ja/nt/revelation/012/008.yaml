id: REV.12.8
reference: Revelation 12:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐκ ⸀ἴσχυσεν, οὐδὲ τόπος εὑρέθη ⸀αὐτῶν ἔτι ἐν τῷ οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: ja
  text: しかし、竜は力及ばず[a]、彼らの居場所はもはや天には見いだされなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「勝つことができず」とも訳せる。ギリシャ語の動詞は、力があること、能力があること、または打ち勝つことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: しかし
  rationale: 直訳的な「そして」も可能だが、直前の戦いを受けて竜の敗北へ転じる文脈上の対照を自然に示す。
- source_word: οὐκ ἴσχυσεν
  choice: 力及ばず
  rationale: ἰσχύωが持つ「力がある」「能力がある」「打ち勝つ」という意味の幅を保ちつつ、戦いの文脈に合う簡潔で自然な表現とした。
- source_word: οὐδὲ
  choice: 〜ず、…なかった
  rationale: 先行する否定に第二の否定を連ねる働きを、日本語では連用形と否定述語によって自然に表した。
- source_word: τόπος
  choice: 居場所
  rationale: 単なる抽象的な余地ではなく、天における彼らの場所を指すため、「場所」より文脈に即した「居場所」とした。
- source_word: εὑρέθη
  choice: 見いだされなかった
  rationale: アオリスト受動態の形式と、「場所が見つからなかった」という結果を保つ。
- source_word: αὐτῶν
  choice: 彼らの
  rationale: 前節の竜とその使いたちを集合的に指す複数代名詞として訳した。
- source_word: ἔτι
  choice: もはや
  rationale: 否定文中で「もうそれ以上はない」という時間的・状態的変化を明確に示す。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天には
  rationale: ここでのοὐρανόςは空ではなく天上の領域を指す。「は」により、そこにはもはや居場所がないという対照を自然に表した。
theological_decisions:
- issue: 単数形ἴσχυσενの主語
  choice: 前節の単数主語である「竜」を補って「竜は」とした。
  alternative: 第一節も集合的に「彼らは力及ばず」とする。
  rationale: ギリシャ語の単数動詞は前節の竜を引き続き主語とし、後半の複数代名詞は竜とその使いたち全体を指す。単数と複数の移行を訳文でも保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい簡潔で荘重な調子を保った。「力及ばず」は文語に偏りすぎず、力の不足と敗北の双方を響かせる。
