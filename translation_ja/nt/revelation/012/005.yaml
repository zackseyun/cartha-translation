    issue: 「牧する」が明瞭な現代標準日本語として不自然である。
    rationale: この語は専門的・文語的であり、羊飼いの比喩も一般読者には伝わりにくい。ποιμαίνεινの比喩と文脈上の王的統治を「羊飼いとして治める」で明確にできる。
  - severity: low
    issue: 「奪い上げられ、…移された」が原文の単一動詞を二動作として表す。
    rationale: ἡρπάσθηは「奪い取られた／奪い上げられた」という一つの受動動詞である。「移された」は意味を大きく変えないが、不要な動作の追加である。
