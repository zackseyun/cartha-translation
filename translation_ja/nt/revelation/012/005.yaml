revisions:
- from: 女は息子を、男の子を産んだ。この子は、鉄の杖をもってすべての国々を牧することになる[a]。その子は奪い上げられ、神のもとへ、その御座のもとへと移された。
  to: 女は息子を、男の子を産んだ。この子は、鉄の杖をもってすべての国々を羊飼いとして治めることになる[a]。その子は神のもとへ、またその御座へと奪い上げられた。
  rationale: 「牧する」を、現代日本語として理解しやすく、原語の牧者比喩と詩篇2篇に由来する統治の含意をともに保つ「羊飼いとして治める」に改めた。結びは、ἁρπάζωの突然で力強い受動的移送を「奪い上げられた」と一動作で訳し、πρόςの反復は「神のもとへ、またその御座へと」に保持した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:34:40Z'
