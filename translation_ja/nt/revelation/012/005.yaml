id: REV.12.5
reference: Revelation 12:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔτεκεν υἱόν, ⸀ἄρσεν, ὃς μέλλει ποιμαίνειν πάντα τὰ ἔθνη ἐν ῥάβδῳ σιδηρᾷ· καὶ ἡρπάσθη τὸ τέκνον αὐτῆς πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: ja
  text: 女は息子を、男の子を産んだ。この子は、鉄の杖をもってすべての国々を羊飼いとして治めることになる[a]。その子は神のもとへ、またその御座へと奪い上げられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「鉄の杖をもってすべての国々を治めることになる」。ここで「羊飼いとして治める」と訳したギリシア語は本来「羊飼いをする」を意味するが、この箇所では詩篇2篇を踏まえ、王としての統治をも示している。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: 産んだ
  rationale: 具体的な出産の描写を、明瞭で自然な現代日本語で表す。
- source_word: υἱόν, ἄρσεν
  choice: 息子を、男の子を
  rationale: υἱόνとἄρσενの重ねによる意図的な強調を、多少の反復を残して表す。
- source_word: μέλλει ποιμαίνειν
  choice: 牧することになる
  rationale: μέλλειの未来志向と定められた成就の含みを保ちつつ、時間的切迫だけに限定しない自然な日本語とした。
- source_word: ποιμαίνειν
  choice: 牧する
  rationale: 詩篇2篇を背景とする王権的な意味を認めながらも、ποιμαίνωの羊飼いの比喩を本文に残す。
- source_word: πάντα τὰ ἔθνη
  choice: すべての国々
  rationale: 世界の諸国民を広く指す表現として、文脈に即して明瞭に訳す。
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: 鉄の杖をもって
  rationale: 道具を示すἐνを保ち、詩篇2篇への響きも伝える。
- source_word: ἡρπάσθη
  choice: 奪い上げられ
  rationale: ἁρπάζωの突然で力強い移動と、神のもとへの上方移動を表す。
- source_word: τὸ τέκνον αὐτῆς
  choice: その子
  rationale: υἱόςからより一般的なτέκνονへの語の変化を反映する。
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: 神のもとへ、その御座のもとへ
  rationale: 反復されるπρόςを日本語でも二つの到達点として明示する。
theological_decisions:
- issue: ποιμαίνειν … ἐν ῥάβδῳ σιδηρᾷにおける詩篇2篇のメシア的暗示
  choice: 本文では「牧する」という比喩を保ち、王としての統治という意味を脚注で示す。
  alternative: 鉄の杖をもってすべての国々を治める
  rationale: 文脈上は王の権威を表すが、ギリシア語自体は「牧する」を意味するため、本文で比喩を解消しない。
- issue: μέλλειの意味合い
  choice: 「牧することになる」とし、未来志向と定めの含みを保つ。
  alternative: まもなく牧しようとしている／牧するであろう
  rationale: 黙示的文脈において、単なる時間的切迫にも単純未来にも限定せず、ギリシア語の幅を自然な日本語で保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、黙示文学にふさわしい荘重さを保った。「息子を、男の子を」という反復は通常の日本語としては際立つが、原文の意図的な重ねを保持するため残した。
