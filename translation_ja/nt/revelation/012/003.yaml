id: REV.12.3
reference: Revelation 12:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὤφθη ἄλλο σημεῖον ἐν τῷ οὐρανῷ, καὶ ἰδοὺ δράκων ⸂μέγας πυρρός⸃, ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: ja
  text: また、もう一つのしるしが天に現れた。見よ、燃えるように赤い[a]巨大な竜がいた。七つの頭と十本の角を持ち、その頭には七つの王冠[b]があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「赤い」とも訳せる。ギリシャ語は、炎を思わせる赤い色を表す。
    reason: lexical_alternative
  - marker: b
    text: ギリシャ語は「ディアデーマ」。王権を示す額帯状の冠で、勝利者に授けられる冠とは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: 現れた
  rationale: 受動形を字義どおり「見られた」とせず、幻の叙述における慣用的な意味を自然な日本語で表した。
- source_word: ἄλλο σημεῖον
  choice: もう一つのしるし
  rationale: σημεῖονを、象徴的な幻を指す黙示録の用法に沿って「しるし」とした。「もう一つ」は直前のしるしとの連続性を示す。
- source_word: ἐν τῷ οὐρανῷ
  choice: 天に
  rationale: οὐρανόςには「空」の意味もあるが、黙示的幻の宇宙的な場面にふさわしい「天」を採った。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 読者の注意を突然現れた光景へ向ける談話標識の力と、黙示文学にふさわしい格調を保った。
- source_word: δράκων μέγας πυρρός
  choice: 燃えるように赤い巨大な竜
  rationale: δράκωνを「竜」、μέγαςを大きさと迫力を示す「巨大な」、πυρρόςを炎を思わせる赤色として自然かつ鮮明に表した。
- source_word: κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: 七つの頭と十本の角
  rationale: 象徴内容を解釈に置き換えず、見えた姿をそのまま訳した。角には日本語で自然な助数詞「本」を用いた。
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ ἑπτὰ διαδήματα
  choice: その頭には七つの王冠
  rationale: ἐπίの位置関係を「頭には」で示し、διάδημαは一般読者に明瞭な「王冠」としたうえで、より厳密な語義を脚注で補った。複数の頭を日本語では集合的に「その頭」と表した。
theological_decisions:
- issue: πυρρόςが表す竜の色
  choice: 燃えるように赤い
  alternative: 赤い
  rationale: 炎のような赤を表す語の鮮烈さを保つ一方、竜が実際に燃えているとは断定しない比喩表現とした。
- issue: διάδημαの訳語
  choice: 王冠
  alternative: ディアデーマ／王の額帯
  rationale: 王権を示す冠であることを一般読者に明瞭に伝え、στέφανοςとの語彙上の違いは脚注で保持した。
- issue: αὐτοῦの性を日本語でどう扱うか
  choice: その頭
  alternative: 彼の頭
  rationale: 日本語では竜を「彼」と呼ぶと不自然で、この節だけで人格性を強調するおそれがあるため、文法的性を過剰に反映しない自然な指示表現とした。
translation_notes:
  register: 現代の一般読者に理解しやすい標準的な日本語を用いつつ、「見よ」によって黙示文学の格調と切迫感を保った。長いギリシャ語の一文は日本語の可読性のため三文に分けたが、描写の順序は維持した。脚注記号[a]は内容上対応するπυρρόςの訳語直後に置き、[b]は「王冠」の直後に置いた。
