id: REV.12.9
reference: Revelation 12:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: ja
  text: そして、大きな竜、すなわち、古くからの蛇、悪魔またサタンと呼ばれる者、全世界[a]を惑わす者が投げ落とされた。彼は地に投げ落とされ、その天使たちも彼とともに投げ落とされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人の住む全世界」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: 投げ落とされた
  rationale: 受動形による強制的な排除と下方への動きを明確にし、原文で三度繰り返される動詞の強調も保つ。
- source_word: ὁ δράκων ὁ μέγας
  choice: 巨大な竜
  rationale: 黙示文学の象徴性を保ちながら、現代日本語として自然に大きさと威容を表す。
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: あの昔からの蛇
  rationale: ἀρχαῖοςの古くから存在するという意味を自然に表し、創世記3章の蛇への連想を保つ。「あの」は既知の象徴を指すギリシア語の定冠詞の働きを文脈に即して伝える。
- source_word: ὁ καλούμενος
  choice: と呼ばれ
  rationale: 竜を複数の名によって同定する分詞を、簡潔で自然な日本語にする。
- source_word: Διάβολος
  choice: 悪魔
  rationale: 語源的な「中傷する者」ではなく、ここでは定着した称号・呼称として用いられているため、標準的な訳語を採る。
- source_word: Σατανᾶς
  choice: サタン
  rationale: 固有の名・称号として標準的な音写を用い、「敵対者」と説明的に訳して意味を限定しない。
- source_word: ὁ πλανῶν
  choice: 惑わす
  rationale: 欺き、誤った道へ導くという意味幅を簡潔に保てる、聖書文脈でも一般読者に通じる表現。
- source_word: τὴν οἰκουμένην ὅλην
  choice: 全世界
  rationale: 黙示録における普遍的な範囲を自然に示す。οἰκουμένηの「人の住む世界」という語義は脚注で示す。
- source_word: εἰς τὴν γῆν
  choice: 地上へ
  rationale: 天から地へという方向的対照を明確にし、日本語として自然に表す。
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: その使いたち
  rationale: 黙示文学の文脈では超自然的な存在を指す。「御使い」は神に属する印象を生じ得るため、竜に従う存在として中立的な「使い」を用いる。
- source_word: μετ’ αὐτοῦ
  choice: 彼とともに
  rationale: 竜と同時に同じ運命を受けたという随伴関係を明瞭に表す。
theological_decisions:
- issue: ΔιάβολοςとΣατανᾶςによる竜の同定
  choice: 悪魔またサタンと呼ばれ
  alternative: 中傷する者、また敵対者と呼ばれ
  rationale: 原文では竜を既知の名・称号によって同定している。標準的な呼称を用い、語源的意味を本文へ持ち込んで解釈を狭めない。
- issue: οἰκουμένηの範囲
  choice: 全世界
  alternative: 人の住む全世界
  rationale: 終末論的・普遍的な広がりを保ちつつ、語のより限定的な字義は脚注で提示して曖昧さを残す。
- issue: ὁ ὄφις ὁ ἀρχαῖοςの聖書内的連想
  choice: あの昔からの蛇
  alternative: 太古の蛇
  rationale: 創世記3章の蛇を想起させる表現を保つ一方、本文で明示的に同一視する説明は加えない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、黙示文学にふさわしい重みを保った。原文のἐβλήθη／ἐβλήθησανの反復を三度とも「投げ落とされた」として再現し、強制的な追放を際立たせた。二つの脚注記号は、それぞれ対応する「全世界」と「昔からの蛇」の直後に置いた。
