id: REV.12.13
reference: Revelation 12:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: ja
  text: 竜は、自分が地上に投げ落とされたのを見て、男の子[b]を産んだ女を追い迫った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「迫害した」とも訳せる。ギリシア語の動詞は「追う」と「迫害する」の両方を意味し得る。ここでは、敵意をもって追うことと迫害することの両方が含まれると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「男〔雄〕を」。文脈に即して「男の子」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: 竜
  rationale: 黙示文学的な像をそのまま保ち、「蛇」と調和させない。現代日本語では「竜」が自然である。
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: 地上に投げ落とされた
  rationale: 受動態と強制的な下降を明確にし、天との対比における γῆ を「地上」とした。
- source_word: ἐδίωξεν
  choice: 追い迫った
  rationale: 具体的に追う動きと迫害的な敵意の両方を自然な日本語で含ませ、語の意味の幅を保つ。
- source_word: τὴν γυναῖκα
  choice: 女
  rationale: 象徴上の正体を訳文で特定せず、原文の表現を保つ。
- source_word: ἥτις ἔτεκεν
  choice: 産んだ
  rationale: 関係節を簡潔で自然な現代日本語にし、出産の意味を明示する。
- source_word: τὸν ἄρσενα
  choice: 男の子
  rationale: 原文は字義的には「男〔雄〕」だが、文脈上の子を日本語で自然に表しつつ、男性であることへの強調を保持する。
theological_decisions:
- issue: 女と男の子の象徴的な正体
  choice: 「女」「男の子」という象徴表現を保ち、解釈的な同定を加えない。
  alternative: 女をマリア、イスラエル、または神の民・教会などと明示する。
  rationale: 本文だけでは象徴の指示対象を一義的に訳し分けるべきでなく、複数の解釈可能性を残すため。
- issue: ἐδίωξεν の行為の性格
  choice: 「追い迫った」として、追跡と迫害の重なりを保つ。
  alternative: 「追いかけた」または「迫害した」の一方だけに限定する。
  rationale: この動詞は追跡と迫害の双方を表し得て、この場面では敵意ある追跡が迫害でもあるため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「追い迫った」により原語の語義的な緊張を本文でも可能な限り表した。すべての脚注標識を本文に付した。
