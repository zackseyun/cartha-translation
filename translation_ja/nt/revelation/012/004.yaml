id: REV.12.4
reference: Revelation 12:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: ja
  text: その尾は天の星の三分の一を引きずり、地に投げ落とした。そして竜は、子を産もうとしている女の前に立っていた。女が子を産んだ時に、竜がその子を食い尽くすためであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύρει
  choice: 引きずり
  rationale: 現在形の語感を保ちつつ、竜の尾が星々を強い力で巻き込む動きを自然な日本語で表した。
- source_word: τὸ τρίτον
  choice: 三分の一
  rationale: 部分を表す定型表現を明確に訳した。
- source_word: ἔβαλεν
  choice: 投げ落とした
  rationale: アオリストの過去性を保ち、天から地上への方向を日本語で明示した。直前の現在形との時制の緊張も均さず残した。
- source_word: ἕστηκεν
  choice: 立っていた
  rationale: 完了形が示す、立った結果その場に位置している状態を文脈に即して表した。
- source_word: μελλούσης τεκεῖν
  choice: 子を産もうとしている
  rationale: 出産が間近に迫っていることを自然かつ明瞭に表現した。
- source_word: καταφάγῃ
  choice: 食い尽くす
  rationale: 単なる『食べる』より強い、完全にむさぼり食うという複合動詞の力を反映した。
theological_decisions:
- issue: 星々および竜の象徴的同定
  choice: 本文では象徴の意味を特定せず、『星』『竜』と訳す
  alternative: 星を天使などと解釈して訳文に織り込む
  rationale: この節自体は象徴の解釈を明示していないため、黙示文学の曖昧さを保持した。
- issue: 動詞時制の不統一
  choice: 『引きずり』と現在的に表し、『投げ落とした』と過去で表す
  alternative: 両方を現在形または過去形に統一する
  rationale: 原文の σύρει（現在形）と ἔβαλεν（アオリスト）の目立つ時制差を、解消せず可能な限り反映した。
translation_notes:
  register: 明快な現代標準語を用いながら、黙示文学にふさわしい力強さと荘重さを保った。原文の時制の移行を意図的に残し、解釈上の象徴性を本文で説明しすぎないようにした。
