revisions:
- from: すると、大地は女を助けた[a]。大地はその口を開き、竜が口から吐き出した川をのみ込んだ[b]。
  to: そして、大地は女を助けた[a]。そして、大地はその口を開き、竜がその口から放った川[b]をのみ込んだ。
  rationale: 接続詞の含意を中立化し、βάλλω の動作性をより直接に反映するため「放った」を採用した。大地の擬人化、女の象徴性、川の性質については、原文以上の解釈を加えていない。脚注bは説明対象の語句に隣接させた。
