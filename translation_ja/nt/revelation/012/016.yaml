  terminology: 「大地」「女」「竜」はいずれも適切である。「大地」の擬人化に対する「その口」も自然で、象徴の解釈を本文へ持ち込まない。「放った」は βάλλω の広い語義を保ち、「吐き出した」よりも原文に近い。
