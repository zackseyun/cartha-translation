id: REV.12.16
reference: Revelation 12:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: ja
  text: そして、大地は女を助けた[a]。そして、大地はその口を開き、竜がその口から放った川[b]をのみ込んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「地」。ギリシア語の γῆ は「大地」「地」「土地」「地面」を意味しうる。
    reason: lexical_alternative
  - marker: b
    text: または「竜がその口から投げ出した川」「竜がその口から流し出した川」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: 助けた
  rationale: βοηθέωの基本義を簡潔で自然な現代日本語にし、物語の直接的な動きを保った。
- source_word: ἡ γῆ
  choice: 大地
  rationale: γῆには「地・土地・地面」の幅がある。黙示的な宇宙規模の情景と擬人化された動作に合う「大地」を本文に採用し、語義上の別案を脚注に示した。
- source_word: τῇ γυναικί
  choice: 女を
  rationale: 象徴的人物について解釈を加えず、γυνήをそのまま「女」とした。日本語では「助ける」の対象を「を」で自然に表した。
- source_word: ἤνοιξεν ... τὸ στόμα αὐτῆς
  choice: その口を開き
  rationale: 大地が口を開くという原文の擬人化を保った。「その」により、口が大地のものであることを自然に示した。
- source_word: κατέπιεν
  choice: のみ込んだ
  rationale: καταπίνωの「飲み下す、のみ込む」という具体的な像を明瞭に伝える。表記は生物的な動作を硬くしすぎないよう「のみ込む」とした。
- source_word: τὸν ποταμόν
  choice: 川
  rationale: ποταμόςの通常の意味を採り、文脈から「洪水」や「濁流」と解釈的に言い換えることを避けた。
- source_word: ὃν ἔβαλεν
  choice: 吐き出した
  rationale: βάλλωの基本的な力強い放出の意味と、口から川が出るという日本語の自然さを両立させた。「投げ出した」より場面を理解しやすいが、「流し出した」ほど液体の様態を限定しない。別の直訳的可能性を脚注に示した。
- source_word: ὁ δράκων
  choice: 竜
  rationale: 黙示録の象徴的存在である δράκων の標準的で簡潔な訳語。
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: 口から
  rationale: 所有者は直前の「竜」で明白なため、日本語で冗長な「その口から」を避けつつ、起点を正確に表した。
theological_decisions:
- issue: 黙示的描写における大地の擬人化
  choice: 大地が女を助け、口を開いて川をのみ込むという像をそのまま残す。
  alternative: 大地を人々、特定の地域、または神の摂理による救出手段と解釈して訳文に織り込む。
  rationale: 原文は象徴の意味をこの節で説明していないため、翻訳では鮮明な黙示的イメージと解釈上の余地を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。反復される「大地」を省略せず、原文の強調と擬人化を保持した。脚注記号は該当語句の直後に置き、本文中にすべて明示した。
