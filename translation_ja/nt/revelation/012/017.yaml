id: REV.12.17
reference: Revelation 12:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: ja
  text: すると、竜は女に対して激しく怒り、彼女の子孫の残りの者たち、すなわち、神の戒めを守り、イエスの証し[a]を持つ者たちと戦うために出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスについての証し」、または「イエスがなさった証し」とも訳せる。ギリシア語の属格は、複数の意味に理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: 激しく怒り
  rationale: 怒りが生じたことを表すアオリストの意味と、黙示文学的文脈における強い敵意を、自然な現代日本語で表した。
- source_word: δράκων
  choice: 竜
  rationale: 黙示録の象徴的イメージを保つ標準的な訳語であり、この章ですでに登場している特定の存在を指す。
- source_word: ἐπὶ τῇ γυναικί
  choice: 女に対して
  rationale: 怒りの向けられた対象を明確にしつつ、既出の特定の女を指す定冠詞の働きを反映した。
- source_word: ἀπῆλθεν
  choice: 出て行った
  rationale: その場を離れて次の行動へ向かう物語上の動きを、自然な日本語で表した。
- source_word: ποιῆσαι πόλεμον μετὰ
  choice: と戦うために
  rationale: 直訳的な「戦争をする」より自然で、相手に対して戦いを仕掛ける意味を明確に伝える。
- source_word: τῶν λοιπῶν τοῦ σπέρματος αὐτῆς
  choice: 彼女の子孫の残りの者たち
  rationale: σπέρμαの血縁・系譜的な比喩を「子孫」で表し、λοιπῶνの「残り」を明示した。
- source_word: τηρούντων τὰς ἐντολὰς τοῦ θεοῦ
  choice: 神の戒めを守り
  rationale: τηρέωがここで表す忠実な遵守を「守る」で簡潔に示し、ἐντολήの聖書的な重みを「戒め」で保った。
- source_word: ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: イエスの証しを持つ
  rationale: ἔχωの基本義を保ちながら、μαρτυρίαを「証し」と訳した。「イエスの」は原文の属格と同様、証しの主体または対象のいずれにも理解できる余地を残す。
theological_decisions:
- issue: τὴν μαρτυρίαν Ἰησοῦ における属格の解釈
  choice: イエスの証し
  alternative: 「イエスについての証し」または「イエスがなさった証し」
  rationale: Ἰησοῦは目的語的属格にも主語的属格にも解し得るため、本文では日本語でも両義性を保てる表現を採用し、主要な解釈を脚注に示した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語を用いた。「すなわち」によって、後半の分詞句が「彼女の子孫の残りの者たち」を説明していることを明確にした。脚注記号は、実際に解釈上の曖昧さがある「イエスの証し」の直後に置いた。
