  text: καὶ ⸀ἐστάθη ἐπὶ τὴν ἄμμον τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/018.yaml
  text: And he stood on the sand of the sea[a].
translation:
  language: ja
  text: そして、竜は海辺の砂の上に立った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本では、「そして、私は海辺の砂の上に立った」となっている。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前節から物語をつなぐ標準的な接続表現として、自然な現代日本語の「そして」とした。
- source_word: ἐστάθη
  choice: 竜は立った
  rationale: アオリスト受動形だが、ここでは自動詞的に「立った」の意味。ギリシア語本文は三人称単数であり、直前の文脈にある竜を主語として明示した。
- source_word: ἐπὶ
  choice: の上に
  rationale: 対格を伴い、立った場所を表す。日本語では「砂の上に立った」が自然である。
- source_word: τὴν ἄμμον
  choice: 砂
  rationale: ἄμμοςの具体的な像を保ち、「岸」と一般化せず「砂」と訳した。
- source_word: τῆς θαλάσσης
  choice: 海辺の
  rationale: 直訳的な「海の砂」よりも自然な日本語としつつ、海に属する砂という属格の意味と情景を「海辺の砂」で保持した。
theological_decisions:
- issue: 動詞の人称と主語の同定に関する本文異読
  choice: SBLGNTの三人称形ἐστάθηに従い、文脈上の主語を「竜」として「竜は…立った」とした。
  alternative: 一部の写本の一人称形ἐστάθηνに従い、「私は海辺の砂の上に立った」とする。
  rationale: 採用本文の文法と直前の文脈を反映する一方、よく知られた一人称の異読を脚注に残し、本文上の緊張を隠さないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「海辺の砂」は原文の具体的な砂の像を保ちながら、日本語として自然に読める表現である。
