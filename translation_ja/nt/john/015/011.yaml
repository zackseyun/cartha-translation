id: JHN.15.11
reference: John 15:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: ja
  text: わたしがこれらのことをあなたがたに話したのは、わたしの喜びがあなたがたの内にあり[a]、あなたがたの喜びが満ちあふれるためです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの間にあり」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「完全なものとなるためです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 複数指示代名詞を明示し、直前までの教えを指すヨハネの語り方を保った。
- source_word: λελάληκα
  choice: 話した
  rationale: λαλέωの発話の意味を自然な現代日本語で表した。ギリシア語の完了形が示す、語られた言葉の現在的な効力は、目的節とのつながりから文脈上伝わる。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 二人称複数を日本語でも明示した。
- source_word: ἵνα
  choice: 〜ためです
  rationale: イエスがこれらを語った目的を自然かつ明確に示す。
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: わたしの喜び
  rationale: 所有の強調を簡潔に保ち、その喜びがイエス自身の喜びなのか、イエスから分かち与えられる喜びなのかを説明的に限定しない。
- source_word: ἐν ὑμῖν
  choice: あなたがたの内に
  rationale: ἐνの基本的な内在の意味を本文に採りつつ、「あなたがたの間に」という集合的な読みも脚注に残した。
- source_word: ᾖ
  choice: あり
  rationale: ἵναに続く現在接続法を、日本語の目的構文の中で自然に表した。
- source_word: καὶ
  choice: 、
  rationale: 日本語では二つの目的内容を読点で滑らかにつなぎ、並列関係は構文によって保持した。
- source_word: ἡ χαρὰ ὑμῶν
  choice: あなたがたの喜び
  rationale: 「わたしの喜び」との対照を明瞭に保った。
- source_word: πληρωθῇ
  choice: 満ちあふれる
  rationale: 喜びとの自然な結びつきを優先しつつ、πληρόωの充満のイメージを生きた日本語で表した。受動形を機械的に再現する「満たされる」よりも、喜びそのものが満ちるという日本語表現が自然である。完成の意味は脚注に示した。
theological_decisions:
- issue: 「わたしの喜び」の性質
  choice: 「わたしの喜び」とだけ訳し、説明を加えない
  alternative: 「わたしが与える喜び」／「わたしについての喜び」
  rationale: 原文は単に所有表現を用いており、イエス自身の喜びを弟子たちが共有する意味と、イエスから来る喜びの意味のどちらかに限定していないため。
- issue: ἐν ὑμῖνの範囲
  choice: 「あなたがたの内に」
  alternative: 「あなたがたの間に」
  rationale: 個々の弟子の内にある喜びという読みが後半との並行に適するが、複数形のὑμῖνにより共同体の間にあるという読みも可能なので脚注で保持した。
translation_notes:
  register: 明瞭で現代的ながら、イエスの告別説教にふさわしい落ち着きと品位を保った。「わたし」「あなたがた」を用い、過度に口語的な表現は避けた。脚注記号は該当語句の直後に置いた。
