  to: もしあなたがたがわたしの戒めを守るなら、わたしの愛のうちにとどまります。わたしが父の戒めを守ってきて、父の愛のうちにとどまっているのと同じように。
  rationale: 比較接続詞καθὼςを「同じように」と明示して、原文の比較構文を保った。τετήρηκαは「守ってきた」として完了形の現在への関わりを表した。条件関係についての神学的説明は加えていない。
