id: JHN.15.10
reference: John 15:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: ja
  text: もしあなたがたがわたしの戒めを守るなら、わたしの愛のうちにとどまります。わたしが父の戒めを守ってきて、父の愛のうちにとどまっているのと同じように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: もし…なら
  rationale: 接続法を伴う条件を、反復の意味を加えず自然な現代日本語で表す。
- source_word: ἐντολάς
  choice: 戒め
  rationale: 権威ある命令という意味を保ち、ヨハネ文書における用語の一貫性にも適する。
- source_word: τηρήσητε / τετήρηκα
  choice: 守る／守り
  rationale: 単なる実行だけでなく、戒めを大切に保って遵守するというτηρέωの広がりを保ち、二つの用例の語彙的対応も示す。後者の完了形が持つ継続的関連性は、後続する現在形との自然な連続の中で表した。
- source_word: μενεῖτε / μένω
  choice: とどまります／とどまっている
  rationale: ヨハネの主要語であるμένωの、関係の中に継続している意味を、同じ動詞で一貫して表す。
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: わたしの愛のうちに／父の愛のうちに
  rationale: 『愛のうちに』という関係的領域の比喩を保持する。後半のαὐτοῦは、現代日本語で指示対象を明確にするため『父の』とした。
- source_word: καθὼς
  choice: …のと同じです
  rationale: 弟子たちとイエスの対応関係を明瞭に示す、自然な比較表現。
- source_word: τοῦ πατρός μου
  choice: 父の
  rationale: 話者イエスとの関係は文脈上明らかであり、日本語では『わたしの父の戒め』より簡潔で自然。神を指す称号としての意味を保つ。
theological_decisions:
- issue: 従順とイエスの愛のうちにとどまることとの関係
  choice: ギリシア語どおり実質的な条件関係として訳す。
  alternative: 従順が愛を獲得する、または従順は単なる証拠にすぎないと説明的に訳す。
  rationale: 本文は条件とイエス自身との比較を示すが、功績、救いの喪失、堅忍などの体系的問題までは明示していないため、その神学的緊張を残す。
- issue: ἀγάπηの訳語
  choice: 愛
  alternative: 慈愛
  rationale: 現代日本語で最も自然かつ広く理解され、節内の反復も保てる。
translation_notes:
  register: 明快な現代標準語を用いながら、ヨハネ特有の反復と『愛のうちにとどまる』という比喩を保持した。文体は平易だが礼拝朗読にも耐える品位を目指した。
