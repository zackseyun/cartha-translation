review_pass:
  verdict: revise
  source_fidelity: 前半の条件文と「愛のうちにとどまる」という比喩は原文に忠実です。しかし後半のκαθὼςは比較を導くため、「それは」とすると日本語では理由・説明にも読まれ得ます。また完了形τετήρηκαは単なる「守り」より「守ってきた」とするほうが、現在に関わる完了の含みを自然に反映します。
  naturalness: 「それは、…のと同じです」は現代日本語としてやや不自然で、比較のつながりも弱くなります。「…のと同じように」とすれば明快で自然です。
  terminology: 「戒め」「守る」「愛のうちにとどまる」はヨハネ文書の反復と権威的な語感を適切に保っています。「父」は文脈上、話者の父を明確に指し、問題ありません。
  issues:
  - severity: medium
    issue: καθὼςの比較が「それは」によって理由・説明のようにも響く。
    rationale: καθὼςは弟子たちが戒めを守って愛にとどまることと、イエスが父の戒めを守って父の愛にとどまることとの比較を示す。「同じように」で直接表す必要がある。
  - severity: low
    issue: τετήρηκαの完了形が「守り」では十分に表れていない。
    rationale: 「守ってきた」は、過去の行為と現在への関わりを自然な日本語で示し、前半の「守る」との語彙的対応も維持する。
  revised_text: もしあなたがたがわたしの戒めを守るなら、わたしの愛のうちにとどまります。わたしが父の戒めを守ってきて、父の愛のうちにとどまっているのと同じように。
