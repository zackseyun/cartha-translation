id: JHN.15.14
reference: John 15:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς φίλοι μού ἐστε ἐὰν ποιῆτε ⸀ἃ ἐγὼ ἐντέλλομαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/014.yaml
  text: You are my friends if you do what I command you[a].
translation:
  language: ja
  text: あなたがたは、わたしが命じることを行うなら、わたしの友です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より逐語的には、「あなたがたは、わたしがあなたがたに命じる事柄を行うなら、わたしの友です」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがた
  rationale: 二人称複数を明示する。文頭の配置による強調は、日本語では不自然に「あなたがたこそ」と強めず、語順と文脈に委ねた。
- source_word: φίλοι μού
  choice: わたしの友
  rationale: φίλοιは親しい関係を表す「友」が自然であり、μούは所属・関係を示す「わたしの」とした。
- source_word: ἐστε
  choice: です
  rationale: 現在形の連結動詞を、現代標準日本語の丁寧で格調ある文体に合わせて訳した。
- source_word: ἐὰν
  choice: なら
  rationale: 接続法を伴う条件を明確に表す。「とき」ではなく、本文が示す条件関係を保った。
- source_word: ποιῆτε
  choice: 行う
  rationale: 命令された内容を実行する意味を自然に表す。継続の意味を必要以上に加える「行い続ける」は避けた。
- source_word: ἃ
  choice: こと
  rationale: 中性複数関係代名詞が指す命令内容を、日本語で自然な包括表現「こと」とした。
- source_word: ἐγὼ
  choice: わたしが
  rationale: ギリシア語では明示された主語に強調があるが、「このわたしが」では過度に強いため、通常の主語として明示した。
- source_word: ἐντέλλομαι ὑμῖν
  choice: 命じる
  rationale: 権威ある命令を表す語義を保った。日本語では受け手がすでに「あなたがた」と示されているため、「あなたがたに」を重ねず自然に訳した。
theological_decisions:
- issue: 友情と従順を結ぶ条件節の性質
  choice: 「行うなら」と、率直な条件として訳す。
  alternative: 「行うとき」
  rationale: ἐὰνと接続法はここで通常、単なる時ではなく条件を表す。功績や救済論に関する体系を付加せず、イエスとの友情と従順との間に本文が置く緊張をそのまま保った。
translation_notes:
  register: 明瞭な現代標準日本語。イエスの発話として丁寧さと品位を保ちつつ、硬すぎる文語表現は避けた。「友人」よりも関係性の近さと聖書的な簡潔さを伝える「友」を採用した。
