id: JHN.15.25
reference: John 15:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: ja
  text: しかし、これは、彼らの律法に書かれている言葉が成就するためであった。「彼らは理由もなくわたしを憎んだ。」[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らの律法」は、ここでは詩篇を含むユダヤ人の聖書を広く指す。引用は詩篇35:19、69:4参照。
    reason: cross_reference
  - marker: b
    text: 「理由もなく」は、「何の根拠もなく」「いわれなく」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし、これは
  rationale: ἀλλάの逆接を「しかし」で示し、ギリシア語では省略されている主節を文脈に基づく「これは」で補って、現代日本語として文を明瞭にした。
- source_word: ἵνα πληρωθῇ
  choice: 成就するためであった
  rationale: ἵνα＋アオリスト受動接続法の目的・結果の含みを保ちつつ、ヨハネに特徴的な聖書成就の表現として自然に訳した。
- source_word: ὁ λόγος
  choice: 言葉
  rationale: ここでは特定の聖書の言明を指すため、「ことば」や神学的称号としての「言」と区別し、普通名詞の「言葉」とした。
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: 彼らの律法に書かれている
  rationale: 完了受動分詞の「書かれた状態にある」という意味を自然な現在形で表し、αὐτῶνも「彼らの」と明示した。
- source_word: νόμῳ
  choice: 律法
  rationale: 引用元は詩篇だが、原文のνόμοςを解釈的に「聖書」と置き換えず、ユダヤ教聖典全体を広く指し得る「律法」を保持した。
- source_word: ὅτι
  choice: 引用符
  rationale: 引用内容を導くὅτιは、日本語では引用符によって自然かつ明瞭に表した。
- source_word: Ἐμίσησάν με
  choice: 彼らは…わたしを憎んだ
  rationale: アオリスト直説法を単純過去として訳し、詩篇からの引用として簡潔にした。
- source_word: δωρεάν
  choice: 理由もなく
  rationale: ここでは「根拠なく、いわれなく」の意味。「理由もなく」は現代日本語として明快で、不当で無根拠な憎しみという含意を保つ。
theological_decisions:
- issue: 詩篇からの引用であるのに「彼らの律法」と呼ぶこと
  choice: 本文では「彼らの律法」を保持する
  alternative: 「彼らの聖書」と訳して広義であることを明示する
  rationale: 原文は明確にνόμοςと言うため、その語を保持する。一方、ここではモーセ五書だけでなく詩篇を含む聖典を広く指す用法であることを脚注で示し、原文の緊張を解消しすぎない。
- issue: ἀλλ’ ἵνα節の省略された主節
  choice: 「これは…ためであった」と補う
  alternative: 「しかし、彼らの律法に…言葉が成就するためである」と省略をそのまま残す
  rationale: ギリシア語は前文に依存した省略表現だが、日本語でそのままにすると不自然で意味が取りにくい。「これは」は直前に述べられた憎しみを受ける最小限の補足であり、新たな因果内容を加えない。
- issue: ἵναによる成就の目的・結果
  choice: 「成就するためであった」
  alternative: 「成就したのである」
  rationale: 目的と結果の両面を持ち得るἵναの形をなるべく保ち、単なる事後的結果に限定しない。ただし、憎しみの道徳的責任について本文以上の決定論的説明は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「成就」は聖書引用の定型的な文脈に適し、一般読者にも理解可能と判断した。「律法」は原語を保持し、その広義の用法を脚注で説明した。
