id: JHN.15.21
reference: John 15:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: ja
  text: しかし、彼らはわたしの名のゆえに、これらのことをすべてあなたがたに対して行う[a]。わたしを遣わした方を知らないからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたに向けて行う」。ギリシア語の表現は、弟子たちに向けられる行為を示し、この文脈では敵対的な意味を帯びることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の発言との強い対比を、現代日本語で自然かつ明確に示す。
- source_word: ταῦτα πάντα
  choice: これらのことをすべて
  rationale: 指示詞の働きと「すべて」という全体性の両方を明示する。
- source_word: ποιήσουσιν
  choice: 行う
  rationale: 未来の行為を表す動詞を広い意味のまま保ち、「迫害する」などと限定しない。日本語では文脈上、未来の予告が非過去形でも自然に表される。
- source_word: εἰς ὑμᾶς
  choice: あなたがたに対して
  rationale: 弟子たちへ向けられる行為を自然な日本語で表す。文脈上の敵対性を含み得るが、「敵対して」とまでは限定しない。
- source_word: διὰ τὸ ὄνομά μου
  choice: わたしの名のために
  rationale: διά＋対格の理由・原因を示しつつ、「名」がイエスの人格、身分、権威を代表する聖書的な含みを保持する。
- source_word: οὐκ οἴδασιν
  choice: 知らない
  rationale: 単なる情報の欠如にも関係的な認識の欠如にも読める、ヨハネ文書の簡潔で重みのある表現を保つ。
- source_word: τὸν πέμψαντά με
  choice: わたしを遣わした方
  rationale: 冠詞付き分詞を自然な敬意ある日本語の名詞句にし、原文にない「父」という称号は補わない。
theological_decisions:
- issue: 「わたしを遣わした方」の指示対象
  choice: 父を暗示しつつ、「わたしを遣わした方」と訳す
  alternative: 「わたしを遣わした父」
  rationale: ヨハネ福音書の文脈では父を指すが、ギリシア語本文は「父」という名詞を用いていないため、明示的に補わず原文の表現を保持する。
- issue: 「名」の意味
  choice: 「名」をそのまま保持する
  alternative: 「わたしとの関係のために」「わたしを信じているために」
  rationale: 「名」がイエスの人格と権威を代表する神学的な広がりを持つため、一つの説明的意味に還元しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの告別説教にふさわしい簡潔で重みのある文体とした。「方」によって指示対象への自然な敬意を示すが、原文にない称号は加えていない。
