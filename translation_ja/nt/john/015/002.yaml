source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: ja
  text: 父は、わたしのうちにある、実を結ばない枝をすべて取り除きます[a]。また、実を結ぶ枝をすべて、もっと実を結ぶように刈り込みます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「取り去ります」とも訳せる。この語をここで「持ち上げます」と理解する見方もある。
    reason: alternative_reading
  - marker: b
    text: 「刈り込む」と訳した語には「清める」という意味もあり、ぶどう栽培の比喩に合うと同時に、次の節の「清い」という表現を先取りしている。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: 枝で……ものはすべて
  rationale: 単数名詞を伴う πᾶν の個別配分的な意味を自然な日本語で表し、一つ一つの枝を指す力を保った。
- source_word: ἐν ἐμοὶ
  choice: わたしのうちにある
  rationale: ヨハネ文書に特徴的な「わたしのうちに」という関係表現を保ち、「つながっている」などの説明的解釈を本文に加えなかった。
- source_word: μὴ φέρον καρπὸν
  choice: 実を結ばない
  rationale: 継続的な状態を表す分詞句を、明瞭で自然な連体修飾として訳した。
- source_word: αἴρει
  choice: 取り除きます
  rationale: ぶどう栽培の比喩において、実を結ぶ枝への処置との対照を最も自然に示す。「持ち上げる」という語義上可能な解釈は脚注に残した。
- source_word: καρπός
  choice: 実
  rationale: ぶどうの比喩にもヨハネ福音書の象徴的用法にも適した標準的な訳語である。
- source_word: καθαίρει
  choice: 刈り込みます
  rationale: ぶどうの枝に対する栽培上の処置を明瞭に表す。語源的・文脈的に関係する「清める」の意味と次節の「清い」との響きは脚注で示した。
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: もっと実を結ぶように
  rationale: ἵνα の目的を「ように」で示し、比較級 πλείονα を自然な「もっと」で表した。
- source_word: αὐτό / αὐτὸ
  choice: もの／枝（日本語では目的語代名詞を明示しない）
  rationale: 指示対象は中性名詞 κλῆμα である。日本語では同じ対象を目的語として繰り返すより、省略するほうが自然で意味も明瞭である。
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: また、実を結ぶ枝はすべて
  rationale: 冠詞と分詞が先行する κλῆμα を受けているため、「枝」を補い、二つの処置の並行関係を明確にした。
theological_decisions:
- issue: 最初の節における αἴρει の意味
  choice: 取り除きます
  alternative: 持ち上げます／取り去ります
  rationale: 直近のぶどう園の比喩では、実を結ばない枝と実を結ぶ枝に対する異なる処置が対比されており、「取り除く」が最も自然である。ただし、「持ち上げる」も語義に基づく既知の解釈なので脚注に示し、背教や聖徒の堅忍をめぐる特定の教派的結論は本文に持ち込まなかった。
- issue: καθαίρει に含まれる剪定と清めの重なり
  choice: 本文では「刈り込みます」
  alternative: 清めます
  rationale: 栽培比喩としての動作を本文で明瞭にしつつ、次節の καθαροί（清い）との語の響きを脚注で保持した。
translation_notes:
  register: 現代の一般読者に分かりやすい丁寧体を用いた。「わたしのうちにある」は日常語よりやや荘重だが、ヨハネ福音書の重要な関係表現を説明的に狭めず保持するために採用した。文脈上の行為者である父を各文で明示し、日本語としての理解を助けた。
