  text: καὶ ὑμεῖς δὲ μαρτυρεῖτε, ὅτι ἀπ’ ἀρχῆς μετ’ ἐμοῦ ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/027.yaml
  text: And you also testify[b][a], because you have been with me from the beginning.
translation:
  language: ja
  text: そして、あなたがたも証言するのです[a]。初めからずっと、わたしと共にいるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「証言しなさい」。ギリシャ語の形は、事実・役割を述べる直説法とも、命令法とも取ることができる。
    reason: grammatical_alternative
lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: そして、あなたがたも
  rationale: καίとδέによる前節からの連続と軽い対照を自然な日本語で示し、明示されたὑμεῖςの強調と、聖霊に加えて弟子たちも証言するという意味を保った。
- source_word: μαρτυρεῖτε
  choice: 証言するのです
  rationale: 法廷的な証人の含みを持つμαρτυρέωを、現代日本語で明確な「証言する」とした。「のです」により、単なる未来予告ではなく、弟子たちの役割を述べる現在形の宣言として自然に表した。形態上可能な命令の読みは脚注に残した。
- source_word: ὅτι
  choice: からです
  rationale: 弟子たちが証言する理由を導く因果用法として訳した。「ということ」も文法上は考えられるが、直前の動詞とのつながりでは理由の理解が文脈上最も自然である。
- source_word: ἀπ’ ἀρχῆς
  choice: 初めから
  rationale: 何の「初め」かを本文で限定せず、原文の簡潔さと文脈的な幅を保った。
- source_word: μετ’ ἐμοῦ ἐστε
  choice: わたしと一緒にいる
  rationale: 現在形ἐστεと、過去から現在まで続く状態を示すἀπ’ ἀρχῆςの組み合わせを、日本語で自然に継続状態として表した。
theological_decisions:
- issue: 「初めから」の範囲
  choice: 本文では「初めから」とだけ訳し、範囲を明示しない
  alternative: 「宣教の初めから」または絶対的・神学的な意味での「初めから」
  rationale: 文脈上は弟子たちがイエスと行動を共にし始めた時点を指す可能性が高いが、原文自体は対象を明記していないため、訳文で限定しなかった。
- issue: μαρτυρεῖτεの法
  choice: 直説法として「証言するのです」
  alternative: 命令法として「証言しなさい」
  rationale: 直前の聖霊の証言と並行して弟子たちの証言を述べる直説法の理解が自然であり、英語POBの判断とも一致する。ただし、ギリシャ語の形は命令法としても取り得るため、脚注で代案を示した。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスの発言としての落ち着きと品位を保った。「証し」より一般読者に意味が明確な「証言」を採用し、原文にない「宣教」などの限定語は加えていない。
