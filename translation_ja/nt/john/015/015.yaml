id: JHN.15.15
reference: John 15:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: ja
  text: わたしはもう、あなたがたを奴隷[a]とは呼びません。奴隷は、主人が何をしているのかを知らないからです。しかし、わたしはあなたがたを友と呼びました。父から聞いたことをすべて、あなたがたに知らせたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」と訳したギリシア語は、「しもべ」とも訳せます。ここでは「友」との対比によって、主人に従属する身分が強調されています。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: もう……ません
  rationale: 以前の状態からの変化を表す時間的否定を、自然な現代日本語で示す。
- source_word: λέγω ὑμᾶς
  choice: あなたがたを……と呼びます
  rationale: ここでの λέγω は人をある身分・関係として呼ぶ、または位置づける意味であり、日本語では「と呼ぶ」が自然である。
- source_word: δούλους / δοῦλος
  choice: 奴隷／奴隷
  rationale: 「友」と対比され、主人に従属してその行動を知らされない身分が焦点なので、「しもべ」よりも社会的非対称性を明確に保つ「奴隷」とした。
- source_word: οἶδεν τί ποιεῖ
  choice: 何をしているのか知らない
  rationale: οἶδα の知識の意味と、現在形 ποιεῖ の進行的な文脈を自然に表す。
- source_word: αὐτοῦ ὁ κύριος
  choice: 主人
  rationale: 神的称号ではなく、奴隷との身分関係を述べる比喩なので「主」ではなく「主人」とした。
- source_word: εἴρηκα
  choice: 友と呼びました
  rationale: ギリシア語完了形は、すでになされた呼称とその現存する結果を含む。日本語では文脈上、その結果が続くことが明らかなため、自然な過去形で表した。
- source_word: φίλους
  choice: 友
  rationale: 奴隷との対比および知識を共有する親しい関係を、簡潔で格調ある日本語として表す。
- source_word: πάντα ἃ
  choice: ……ことをすべて
  rationale: 内容の包括性を自然な日本語語順で保持する。
- source_word: ἤκουσα παρὰ τοῦ πατρός μου
  choice: 父から聞いたこと
  rationale: ἀκούω の基本義「聞く」と、παρά＋属格が示す情報源を直接反映する。
- source_word: ἐγνώρισα ὑμῖν
  choice: あなたがたに知らせた
  rationale: γνωρίζω の「知らせる、明らかにする」を平明な現代日本語で表す。
theological_decisions:
- issue: 弟子との身分関係における δοῦλος の訳
  choice: 奴隷
  alternative: しもべ／僕
  rationale: この節では従属的身分と、友として知らされる関係との対比が中心である。「奴隷」は原文の社会的非対称性を曖昧にしない。
- issue: 家庭・身分関係の比喩における κύριος の訳
  choice: 主人
  alternative: 主
  rationale: ここでは神的・メシア的称号ではなく、奴隷に対する所有者・上位者を指すため、「主人」が文脈に適する。
- issue: εἴρηκα と ἐγνώρισα の時制・アスペクト
  choice: 呼びました／知らせた
  alternative: 呼んでいます／知らせてきました
  rationale: εἴρηκα の完了的結果は前後の文脈で保たれる。ἐγνώρισα はアオリストであり、完了した開示として過去形にした。日本語で不自然に時制を揃えず、両者の相違を保持する。
translation_notes:
  register: 明瞭で現代的ながら、イエスの告別説教にふさわしい落ち着いた敬体とした。「わたし」「あなたがた」「父」を用い、過度に古風な語を避けた。
