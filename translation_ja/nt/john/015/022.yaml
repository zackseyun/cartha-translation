  text: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ πρόφασιν οὐκ ἔχουσιν περὶ τῆς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: ja
  text: もし私が来ることも、彼らに語ることもなかったなら、彼らには罪がなかったであろう[a]。しかし今、彼らには自分たちの罪について弁解の余地がない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らは罪に問われなかったであろう」または「彼らには罪の責任がなかったであろう」とも理解できる。ギリシア語は字義的には「彼らは罪を持たなかった」。
    reason: lexical_alternative
  - marker: b
    text: 「自分たちの罪について言い訳がない」、または「自分たちの罪のための口実がない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: もし私が来て彼らに語らなかったなら
  rationale: 過去の事実に反する条件を、現代日本語で明確に表した。「来て」と「語る」の両方を保ち、αὐτοῖςは「彼らに」とした。
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: 彼らには罪がなかったであろう
  rationale: 直訳的な「罪を持つ」というヨハネ特有の表現を、日本語として自然な「罪がある」で表した。単なる絶対的無罪か、イエスを拒むことに関する責任の欠如かを本文で断定しない。
- source_word: νῦν δὲ
  choice: しかし今
  rationale: 仮定上の状況と現在の現実との鋭い対照を簡潔に示す。
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: 弁解の余地がない
  rationale: πρόφασιςは「口実、弁明、言い訳」を表し得る。ここでは現代日本語として自然で、責任を免れる根拠がないという文脈にも合う表現を選んだ。
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: 自分たちの罪について
  rationale: περί＋属格の「〜について、〜に関して」という形を保ち、「〜のための」と因果的に限定しすぎないようにした。αὐτῶνは主語と同一集団を指すため「自分たちの」とした。
theological_decisions:
- issue: 「彼らには罪がなかった」が絶対的な無罪を意味するのか、イエスの啓示を拒絶した罪について責任がなかったことを意味するのか
  choice: 本文では「彼らには罪がなかったであろう」とし、ギリシア語の表現を保つ
  alternative: 「彼らは罪に問われなかったであろう」または「彼らにはこの罪の責任がなかったであろう」
  rationale: 文脈はイエスが来て語った後の拒絶責任を扱うが、原文は限定語を加えず「罪を持たなかった」と述べる。訳文で神学的含意を一つに決めず、真正な緊張を残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの発言にふさわしい簡潔で重みのある文体とした。「であろう」は反実仮想の帰結を明示するために用いた。
