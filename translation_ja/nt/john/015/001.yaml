base_translation:
  language: en
  yaml_path: translation/nt/john/015/001.yaml
  text: I am the true vine[a], and my Father is the vinegrower.
translation:
  language: ja
  text: 「わたしはまことのぶどうの木であり、わたしの父はぶどうを育てる人[a]です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「農夫」「ぶどうを栽培する人」。ギリシャ語は土地を耕し、作物を育てる人を指します。この文脈では、ぶどうの木を育て、手入れする人を表します。
    reason: γεωργόςの一般的な意味を示すとともに、ぶどうの木の比喩における文脈上の具体的な意味を明示するため。
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: わたしは…です
  rationale: 強調された一人称代名詞を明示しつつ、日本語として自然な同定表現にした。「このわたしこそ」とすると原文以上に強調が重くなるため避けた。
- source_word: ἄμπελος
  choice: ぶどうの木
  rationale: 比喩の具体的な像を保ち、現代日本語で誤解なく通じる表現である。
- source_word: ἀληθινή
  choice: まことの
  rationale: 単なる事実性だけでなく、「真正な」「究極的な」というヨハネ文書での含みを残す。「本当の」より荘重で、「真正な」より一般読者に分かりやすい。
- source_word: ὁ πατήρ μου
  choice: わたしの父
  rationale: イエスと父との関係を原文どおり簡潔に示した。日本語では固有名詞的な大文字表記がないため、文脈によって神を指すことが分かる形とした。
- source_word: γεωργός
  choice: 農夫
  rationale: 土地を耕し作物を育てる人を指す語の基本的な意味を、簡潔で分かりやすい日本語で表した。ぶどうの比喩に即したより限定的な訳は脚注に示した。
theological_decisions:
- issue: イエスの「わたしは…である」という比喩的自己提示
  choice: 「わたしはまことのぶどうの木です」と比喩をそのまま保つ
  alternative: 「わたしこそ本物のぶどうの木です」
  rationale: 象徴の意味を訳文内で説明せず、原文の比喩と神学的な余韻を保った。「まことの」は、真正性と神に属する究極的な現実という含みの双方を許す。
- issue: 父を表す γεωργός の訳
  choice: 本文では「農夫」、脚注では「ぶどうを栽培する人」
  alternative: 栽培者／ぶどう作り
  rationale: 「農夫」は語の広い意味に忠実で理解しやすい。文脈に即した限定的な意味も可能であるため、脚注で明示し、訳文だけで意味を狭めすぎないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言として自然でありながら品位のある「です」調に統一した。「まことの」は伝統的な響きを持つが、現在も理解可能で、ヨハネ特有の語感を保つ。
