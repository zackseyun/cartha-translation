  text: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ ἵνα ἀγαπᾶτε ἀλλήλους καθὼς ἠγάπησα ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: ja
  text: わたしの命令はこれです。わたしがあなたがたを愛したように、あなたがたも互いに愛し合いなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: わたしの命令はこれです
  rationale: 指示代名詞の提示機能と、イエス自身に属する権威ある命令であることを、自然な現代日本語で表した。
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: あなたがたも互いに愛し合いなさい
  rationale: ἵναはここでは命令の内容を導く。日本語では独立した命令文とすることで、その内容と命令としての力を明瞭にした。ἀλλήλουςとἀγαπᾶτεは「互いに愛し合う」と自然に表現した。「も」は後続の比較に基づき、イエスの愛に対応する弟子たち相互の愛を示す。
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: わたしがあなたがたを愛したように
  rationale: καθὼςの比較・模範の意味を「ように」で保ち、アオリストἠγάπησαは過去形「愛した」として、文脈上のイエスの先行する愛を簡潔に表した。
theological_decisions:
- issue: イエスの愛と弟子たちの相互愛との関係
  choice: わたしがあなたがたを愛したように
  alternative: わたしがあなたがたを愛してきたのと同じように
  rationale: καθὼςが示す模範・比較をそのまま保ち、それが程度の完全な同一性だけを意味するのか、様式や根拠まで含むのかを限定しなかった。
- issue: ἐντολήの訳語
  choice: 命令
  alternative: 戒め
  rationale: 「命令」は権威ある指示という語義を明瞭に伝える。「戒め」も伝統的な聖書語として可能だが、現代の一般読者には道徳的禁止事項の響きを帯びやすいため採らなかった。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「わたし」「あなたがた」を用いてヨハネ福音書の談話として自然な調子を保ち、文を二つに分けて命令の提示と内容を読み取りやすくした。
