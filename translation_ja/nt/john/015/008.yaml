  terminology: 「父」「実を結ぶ」「弟子」はヨハネ15章の文脈および日本語聖書で広く用いられる語法と整合する。「わたし」はイエスの発話として自然であり、「わたしの父」と「わたしの弟子」の対応も明瞭である。
