  source_fidelity: 「あなたがたが多くの実を結び、わたしの弟子となることによって」は、ἐν τούτῳと後続のἵνα節の密接な関係を自然な日本語で表している。καρπὸν πολὺν φέρητεを「多くの実を結び」、γένησθε ἐμοὶ μαθηταίを「わたしの弟子となる」とすることで、比喩と「となる」という成立・変化の含みを保っている。ἐδοξάσθηの受動的な意味も「栄光をお受けになる」によって適切に表現されている。
