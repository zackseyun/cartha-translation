id: JHN.15.8
reference: John 15:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τούτῳ ἐδοξάσθη ὁ πατήρ μου ἵνα καρπὸν πολὺν φέρητε καὶ ⸀γένησθε ἐμοὶ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/008.yaml
  text: 'In this my Father is glorified: that you bear much fruit and become my disciples.'
translation:
  language: ja
  text: あなたがたが多くの実を結び、わたしの弟子となることによって、わたしの父は栄光をお受けになる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: …ことによって
  rationale: 後続のἵνα節が「父が栄光を受ける」ことの内容ないし手段を示すため、自然な現代日本語で関係を明瞭にした。
- source_word: ἐδοξάσθη
  choice: 栄光をお受けになる
  rationale: 受動形を保ちつつ、神である父への敬意を表す自然な日本語とした。アオリストは格言的・確定的な文脈で、日本語では時制を限定しすぎない表現にした。
- source_word: καρπὸν πολὺν φέρητε
  choice: 多くの実を結び
  rationale: ヨハネ15章のぶどうの木の比喩を保つ定着した自然な表現。
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: わたしの弟子となる
  rationale: γίνομαιの「なる」を保持し、単に弟子であることを示す表現へ平板化しなかった。ἐμοίは自然な所有表現で訳した。
theological_decisions:
- issue: ἵναが示す、実を結ぶこと・弟子となることと父の栄光との関係
  choice: 「…ことによって」とし、父が栄光を受ける手段・現れとして表現
  alternative: 「このことに父の栄光が現れる。すなわち、…」または「…するためである」
  rationale: ἵναは目的・結果・内容の幅を持ち得るが、ここではἐν τούτῳと結び、後続内容が父の栄光を現す事柄であることを自然に示す。目的だけに限定する訳は避けた。
- issue: γένησθεの本文形が示す弟子性
  choice: 「弟子となる」と変化・成立の含みを保持
  alternative: 「弟子であることを示す」または「弟子であり続ける」
  rationale: 原文に「示す」「あり続ける」は明記されていないため補わず、γένησθεの基本的な意味を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。比喩語「実を結ぶ」と、父・イエス・弟子の関係を簡潔に保持した。
