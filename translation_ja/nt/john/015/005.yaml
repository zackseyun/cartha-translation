  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: ja
  text: わたしはぶどうの木であり、あなたがたは枝である。わたしのうちにとどまり、わたしもその人のうちにとどまる人は、多くの実を結ぶ。なぜなら、わたしを離れては、あなたがたは何一つできないからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄμπελος
  choice: ぶどうの木
  rationale: 文脈上は実を結ぶ栽培植物としてのぶどうの木を指す。「ぶどうの木」は現代日本語で自然であり、比喩も明瞭に保つ。
- source_word: κλήματα
  choice: その枝
  rationale: ぶどう栽培の文脈で、木につながっている枝を指す。指示語「その」により、直前のぶどうの木との関係を自然に示した。
- source_word: ὁ μένων
  choice: とどまる人
  rationale: μένωの継続的な意味を保ち、ヨハネ文書に特徴的な関係の持続を過度に解釈せず表す。
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: わたしのうちに……その人のうちに
  rationale: 相互的な内在を表すἐνを「うちに」と訳し、「ともに」などへ弱めず、原文の神学的な緊張を保持した。
- source_word: κἀγώ
  choice: わたしも
  rationale: 「そしてわたし」ないし「わたしも」という相互性を、日本語の構文に自然な形で示す。
- source_word: φέρει καρπὸν πολύν
  choice: 多くの実を結ぶ
  rationale: ぶどうの木の比喩に即した自然な日本語の連語であり、πολύνの量的表現も保持する。
- source_word: χωρὶς ἐμοῦ
  choice: わたしを離れては
  rationale: 単に助力がないというより、イエスから切り離された状態を表すχωρίςの含意を、枝の比喩に合う自然な表現で示す。
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: 何一つできない
  rationale: 禁止ではなく能力の不可能性を表すδύναμαιと、強い否定οὐδένを簡潔で自然な現代日本語にした。
theological_decisions:
- issue: ヨハネ文書における相互内在の表現
  choice: 「わたしのうちにとどまり、わたしもその人のうちにとどまる」とした。
  alternative: 「わたしとともにいて、わたしもその人とともにいる」
  rationale: 原文のἐνが示す「内に」という相互的関係を保ち、単なる同伴へと意味を狭めないため。
- issue: αὐτῷの男性単数形と一般的適用
  choice: 「その人」とした。
  alternative: 「彼」
  rationale: ギリシア語は男性単数形だが、ὁ μένωνを受けて、イエスのうちにとどまる各人を代表的に指す。日本語の「その人」は単数性と一般的適用の双方を自然に保ち、原文にない複数化を避ける。
- issue: 「何一つできない」の範囲
  choice: 限定を補わず、原文どおり絶対的な表現を保った。
  alternative: 「霊的な実を何一つ結べない」
  rationale: 文脈は実を結ぶことに関係するが、原文のποιεῖν οὐδένは明示的な目的語を置かない。解釈上の限定を本文へ加えず、強い表現とその神学的緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、イエスの宣言にふさわしい簡潔で格調ある「である」調とした。「うちに」を反復して原文の相互性を見える形で保ち、「実を結ぶ」「離れては」によってぶどうの木と枝の比喩を自然につないだ。
