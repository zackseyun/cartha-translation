source:
  edition: SBLGNT
  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: ja
  text: 父がわたしを愛してくださったように、わたしもあなたがたを愛してきた。[a] わたしの愛のうちにとどまりなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「父がわたしを愛したように、わたしもあなたがたを愛した。わたしの愛のうちにとどまりなさい」。ギリシア語の二つの動詞はアオリスト形で、単純過去として訳すこともできる。本文の「愛してきた」は、その愛が今も意味を持つという文脈上の含みを表している。
    reason: 時制・アスペクト上の別訳
lexical_decisions:
- source_word: καθὼς
  choice: 〜ように
  rationale: 父の御子への愛と、イエスの弟子たちへの愛との対応・比較を、自然な日本語で明確に表す。
- source_word: ἠγάπησέν με ὁ πατήρ
  choice: 父がわたしを愛してくださった
  rationale: アオリストの過去性を保ちつつ、父に対する日本語として自然な敬意を「くださった」で表した。「父」を主語として明示し、原文の関係を保つ。
- source_word: κἀγὼ ὑμᾶς ἠγάπησα
  choice: わたしもあなたがたを愛してきた
  rationale: κἀγώの付加・対応の力を「わたしも」で表し、複数のὑμᾶςを「あなたがた」と明示した。「愛してきた」は、過去に示された愛がこの勧めの現在にも関わることを自然な日本語で伝える。
- source_word: μείνατε
  choice: とどまりなさい
  rationale: 命令の力を保ち、ヨハネ文書に特徴的なμένωの継続・留まるという意味を、現代語として明瞭かつ品位ある形で表す。
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: わたしの愛のうちに
  rationale: 所有関係を「わたしの愛」で自然に表し、ἐνの比喩的な領域・関係の中に留まることを「〜のうちに」で保持する。
theological_decisions:
- issue: ἀγάπηの訳語
  choice: 愛
  alternative: 慈愛
  rationale: 現代日本語で最も自然かつ広く理解され、文脈上の関係的・神学的重みも保つ。「慈愛」は意味を狭め、文体もやや古い。
- issue: ἠγάπησέν／ἠγάπησαのアオリストの表現
  choice: 「愛してくださった」／「愛してきた」
  alternative: 「愛した」／「愛した」
  rationale: 原文のアオリストを単なる過去の出来事に限定せず、この文脈で今も効力を持つ愛として自然に読めるようにした。ただし、単純過去で訳す可能性を脚注に残し、原文の時制・アスペクトを過度に一義化しない。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの教えにふさわしい簡潔で品位ある命令文とした。「あなたがた」によって二人称複数を明示し、「とどまりなさい」は古風すぎず、ヨハネ的主題の重みを保つ。
