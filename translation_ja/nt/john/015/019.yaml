revisions:
- from: もしあなたがたが世から出た者であったなら、世は自分に属する者を愛したでしょう。しかし、あなたがたは世から出た者ではなく、わたしが世からあなたがたを選び出したので、世はあなたがたを憎むのです。[a]
  to: もしあなたがたが世に属する者[a]であったなら、世は自分のものを愛したでしょう。しかし、あなたがたは世に属する者ではなく、わたしがあなたがたを世から選び出したので、世はあなたがたを憎むのです。
  rationale: 最初の二つのἐκ τοῦ κόσμουを「世に属する者」として、文脈上の帰属の対比を自然かつ正確に表した。第三の「世から選び出した」は、ἐκλέγομαιと結び付く分離の含みを保つ。τὸ ἴδιονは「自分のもの」として、原文の中性表現を不必要に人へ限定しないようにした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:51Z'
