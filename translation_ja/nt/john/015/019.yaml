  naturalness: 「世に属する者であったなら」「世に属する者ではなく」は明瞭な現代標準日本語であり、「世から出た者」より自然で誤解が少ない。「世は自分のものを愛したでしょう」は、τὸ ἴδιονを不必要に「者」と限定せず、自然な対照を保つ。
  terminology: κόσμοςは「世」、φιλέω／μισέωは「愛する／憎む」、ἐξελεξάμηνは「選び出した」として適切である。脚注は最初の「世に属する者」に付し、ἐκの由来・帰属の幅を簡潔に示す。
