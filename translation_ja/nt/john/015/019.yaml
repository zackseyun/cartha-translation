id: JHN.15.19
reference: John 15:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: ja
  text: もしあなたがたが世に属する者[a]であったなら、世は自分のものを愛したでしょう。しかし、あなたがたは世に属する者ではなく、わたしがあなたがたを世から選び出したので、世はあなたがたを憎むのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「世からの者」。ギリシア語の前置詞は、由来だけでなく帰属をも表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: 世から出た者
  rationale: 最初の二例では、ἐκが示す由来と帰属の両面を自然な日本語で表す。「世に属する者」だけに限定せず、原文で反復される「世から」を見える形で保った。
- source_word: κόσμος
  choice: 世
  rationale: ヨハネ文書における、神に敵対する人間社会・秩序という含みを保ちつつ、解釈を「世の体制」などに狭めない簡潔で伝統的な訳語。
- source_word: ἂν ... ἐφίλει
  choice: 愛したでしょう
  rationale: 非現実の条件文が表す仮定的な帰結を、現代日本語として自然に示す。
- source_word: τὸ ἴδιον
  choice: 自分に属する者
  rationale: 字義的には「自分のもの」だが、ここでは弟子たちとの対照から人を指すと理解されるため、日本語で自然に明示した。
- source_word: φιλέω
  choice: 愛する
  rationale: μισέωとの鮮明な対照を保ち、文脈に合う自然な訳語とした。
- source_word: ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου
  choice: わたしが世からあなたがたを選び出した
  rationale: ἐκλέγομαιの「選ぶ」とἐκの分離・取り出しの含みを「選び出す」で簡潔に表す。中間態を「自分のために」と過度に明示しない。
- source_word: διὰ τοῦτο
  choice: ので
  rationale: 直前の事実を理由として結論を導く因果関係を、明瞭で自然な日本語の構文にした。
- source_word: μισεῖ
  choice: 憎む
  rationale: 原文の強い対照を和らげず、現在の継続的な事実として表す。
theological_decisions:
- issue: ヨハネ文書における「世」の意味
  choice: 本文では解釈的に広げず「世」とする。
  alternative: 「神に敵対する人間社会」「世の体制」
  rationale: 道徳的・霊的領域としての含みを保持しながら、その範囲を訳文で狭く限定しないため。
- issue: ἐξελεξάμηνが示す選び
  choice: 「わたしが…あなたがたを選び出した」と直接的に訳す。
  alternative: 予定論など特定の教理体系に結びつく表現を加える。
  rationale: イエスが弟子たちを選んだという本文の主張をそのまま保ち、後代の教派的論争を訳文に持ち込まないため。
- issue: ἐκ τοῦ κόσμουの由来・帰属の両義性
  choice: 「世から出た者」とし、脚注で「世に属する者」という可能な理解を示す。
  alternative: 本文を一律に「世に属する者」とする。
  rationale: ἐκの基本的な起点・由来を可視化しつつ、文脈上の帰属の意味も排除しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの語りとしての品位と「愛する／憎む」の鋭い対照を保った。仮定文は「もし…なら、…でしょう」として理解しやすくし、「世から」の反復も可能な限り維持した。
