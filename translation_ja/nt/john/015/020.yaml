id: JHN.15.20
reference: John 15:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: ja
  text: わたしがあなたがたに言った言葉を覚えていなさい。『奴隷[a]は主人にまさるものではない。』もし人々がわたしを迫害したのなら、あなたがたをも迫害するだろう。もしわたしの言葉を守ったのなら[b]、あなたがたの言葉をも守るだろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「僕」とも訳せる。ギリシア語のδοῦλοςは文脈により「奴隷」または「僕」を意味する。ここでは「主人」との対比が身分上の従属を強調するため、「奴隷」とした。
    reason: lexical_alternative
  - marker: b
    text: 「従った」とも訳せる。ヨハネ文書で「言葉を守る」は、イエスの言葉を受け入れ、それに従って生きることを含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: 覚えていなさい
  rationale: 現在命令形の継続的な含みを保ちつつ、現代日本語で自然な命令として表した。
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: わたしがあなたがたに言った言葉
  rationale: ここでは直後に引用される特定の発言を指すため、「言葉」とし、関係節も明瞭に訳した。
- source_word: δοῦλος
  choice: 奴隷
  rationale: κύριοςとの身分上の非対称性が格言の要点であるため、従属関係を明確に示す「奴隷」を選んだ。
- source_word: μείζων
  choice: まさる
  rationale: 地位や重要性を含み得る比較の幅を、不必要に限定せず表せる。
- source_word: κυρίου
  choice: 主人
  rationale: ここでは神的称号ではなく、奴隷に対する権威者を指すため、「主人」が文脈に適する。
- source_word: ἐδίωξαν / διώξουσιν
  choice: 迫害した／迫害する
  rationale: イエスと弟子たちに向けられる敵意という文脈に即して、διώκωの迫害の意味を表した。
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: 守った／守る
  rationale: τηρέωが持つ、言葉を受け入れ、それに従うというヨハネ文書での含みを残した。
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: わたしの言葉……あなたがたの言葉
  rationale: イエスの言葉と弟子たちの宣べ伝える言葉との並行を保った。
theological_decisions:
- issue: δοῦλοςの訳語
  choice: 奴隷
  alternative: 僕、仕える者
  rationale: この格言はδοῦλοςとκύριοςの身分差を前提とするため、「奴隷」が原文の社会的な従属関係を最も明確に伝える。
- issue: κύριοςの訳語
  choice: 主人
  alternative: 主
  rationale: ここではキリストへの称号ではなく、奴隷との関係における権威者を意味するため、「主人」とした。
- issue: τηρέωと「言葉」の関係
  choice: 言葉を守る
  alternative: 言葉に従う
  rationale: 「従う」という意味を含みつつも、原文の表現とヨハネ文書における語の広がりを保つため、字義に近い表現を採った。
- issue: 二つの条件文の含意
  choice: もし……のなら
  alternative: ……したのだから／……したのであれば
  rationale: εἰの条件表現を保ち、迫害と受容という対照的な可能性を訳文で一方に限定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの厳粛な教えにふさわしい簡潔で dignified な調子を保った。「まさるものではない」は格言らしい響きを持たせ、「もし……のなら」の反復によって原文の並行構造を示した。
