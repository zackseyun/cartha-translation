id: JHN.15.23
reference: John 15:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: ja
  text: わたしを憎む者は、わたしの父をも憎む。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: 憎む者
  rationale: 定冠詞を伴う現在分詞の名詞的用法を、一般的な人物を指す自然な現代日本語で表した。継続的・特徴的な行為という含みも文脈上保たれる。
- source_word: ἐμὲ
  choice: わたしを
  rationale: 一人称単数の対格であり、直接目的語として明瞭に訳した。日本語では通常の目的語表現が自然である。
- source_word: μισῶν / μισεῖ
  choice: 憎む／憎んでいる
  rationale: 同じ動詞 μισέω の反復を「憎む」という同一語彙で保った。前半は連体修飾として一般的性格を示し、後半は現在形の状態的・継続的な意味を自然な日本語の「憎んでいる」で表した。
- source_word: καὶ
  choice: も
  rationale: イエスを憎むことがその父をも憎むことになるという付加・包含の関係を、簡潔で自然な助詞「も」で示した。
- source_word: τὸν πατέρα μου
  choice: わたしの父
  rationale: 所有関係を自然な日本語で表した。「父」は神を指すが、日本語では大文字による区別がないため、文脈に委ねた。
theological_decisions:
- issue: 「父」が神を指すことの表し方
  choice: わたしの父
  alternative: 父なる神／わたしの御父
  rationale: 原文は単に「わたしの父」としており、神という語や敬称を明示的には加えていない。ヨハネ文脈での神学的含意を保ちつつ、原文にない説明や特定の教派的語調を持ち込まない訳とした。
translation_notes:
  register: 簡潔で格調を保ちながら、現代の一般読者に明瞭な標準語。「わたし」は福音書におけるイエスの発話として穏当で、「者」は短い宣言文に適した dignified な表現である。
