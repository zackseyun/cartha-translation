id: JHN.15.16
reference: John 15:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: ja
  text: あなたがたがわたしを選んだのではない。わたしがあなたがたを選び[a]、任命したのである。それは、あなたがたが出て行って実を結び、その実が残る[b]ためであり、あなたがたがわたしの名によって父[c]に何を求めても、父があなたがたに与えてくださるためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「選び出した」とも訳せる。ここでは、後代の専門的な教理用語に限定せず、文脈に即して「選び」とした。
    reason: lexical_alternative
  - marker: b
    text: 「とどまる」とも訳せる。ヨハネ文書で繰り返し用いられ、関係や状態が続くこと、また存続することを表す語である。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語本文は「わたしの父」ではなく「父」としている。
    reason: textual_clarification
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: 選んだ／選び
  rationale: 「選ぶ」が現代日本語で最も自然であり、弟子たちとイエスとの対比を明確に保つ。後代の教理用語を本文へ持ち込まない。
- source_word: ἔθηκα
  choice: 任命した
  rationale: 直訳的には「置いた」だが、ここでは弟子たちを目的ある働きへ定める意味なので、「任命した」が文脈上明瞭である。ただし、特定の教会職への叙任には限定しない。
- source_word: ὑπάγητε
  choice: 出て行って
  rationale: 基本義の「行く」を保ちつつ、実を結ぶ働きへ向かう文脈を自然な日本語で表す。使命の具体的内容までは訳文に付加しない。
- source_word: καρπὸν φέρητε
  choice: 実を結び
  rationale: ヨハネ文書の比喩をそのまま保ち、日本語として定着した自然な表現を用いる。
- source_word: μένῃ
  choice: 残る
  rationale: 継続する、存続するという意味を明快に表す。「とどまる」も可能だが、この箇所では実が持続することを「残る」が自然に伝える。
- source_word: ὅ τι ἂν αἰτήσητε
  choice: 求めるものは何でも
  rationale: 不定の広がりを持つ表現を「何でも」で示し、祈りの文脈に適する「求める」を用いる。
- source_word: ἐν τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: イエスの名に基づいて求めるという関係的・神学的含意を保ちつつ、意味を一つに限定して説明しすぎない。
- source_word: δῷ
  choice: 与えてくださる
  rationale: ἵναに従う接続法を目的節として訳し、独立した単純未来の断言へ平板化しない。日本語では父を主語とする敬語が自然である。
- source_word: τὸν πατέρα
  choice: 父
  rationale: ギリシア語は「わたしの父」ではなく定冠詞付きの「父」であり、その違いを保持する。
theological_decisions:
- issue: ἐξελεξάμηνを予定・選びの専門的教理用語として訳すか
  choice: 当面の弟子選びと使命の文脈で「わたしがあなたがたを選び」と訳す。
  alternative: 「選び出した」「選定した」など、より専門的・強調的な語を用いる。
  rationale: 本文はイエスの主導権を明言するが、後代の体系的教理を翻訳語によって先取りすべきではない。
- issue: ἔθηκα ὑμᾶςが特定の聖職への叙任を意味するか
  choice: 実を結ぶ目的への任命・任務付与として訳す。
  alternative: 特定の教会職への叙任として限定的に解する。
  rationale: 文脈にある目的は、行って実を結ぶことである。「任命」は目的ある委任を示すが、職制までは特定しない。
- issue: 最後のἵνα節の効力
  choice: 任命と結実につながる目的・結果の節として「与えてくださるため」と訳す。
  alternative: 独立した無条件の約束として「必ず与えてくださる」と訳す。
  rationale: 二つ目のἵναが作る従属構造を保ち、祈りに関する句を無条件の単独命題へ強めない。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、イエスの厳粛な語りにふさわしい品位を保った。長いギリシア語文は二文に分け、二つの目的節の連関は「それは」と「また」で明示した。
