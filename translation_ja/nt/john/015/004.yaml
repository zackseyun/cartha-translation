id: JHN.15.4
reference: John 15:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: ja
  text: わたしのうちにとどまりなさい[a]。わたしもあなたがたのうちにとどまります[b]。枝がぶどうの木にとどまっていなければ、自分では実を結ぶことができないように、あなたがたも、わたしのうちにとどまっていなければ、実を結ぶことができません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「とどまる」は、継続してそこにいる、離れずにいる、という意味を持ちます。ここでは、ぶどうの木と枝のように、イエスとの結びつきのうちにあり続けることを表します。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「そして、わたしもあなたがたのうちに」。ギリシア語では動詞が省略されており、ここでは直前の「とどまる」を補っています。
    reason: source_ellipsis
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: とどまりなさい／とどまっている
  rationale: μένωの継続、持続、関係の維持という意味を、現代日本語で自然に表す。命令形には「とどまりなさい」を用い、ぶどうの木と枝の比喩を一貫して保った。
- source_word: ἐν ἐμοί / ἐν τῇ ἀμπέλῳ
  choice: わたしのうちに／ぶどうの木に
  rationale: ἐνの結合・内在を示す表現を保つ。「わたしと共に」では、単なる同行や近接と受け取られ得るため採らない。
- source_word: κἀγὼ ἐν ὑμῖν
  choice: そうすれば、わたしもあなたがたのうちにとどまります
  rationale: 原文は動詞を省略しているが、日本語ではそのままでは文として不自然なため、直前のμένωを補った。「そうすれば」は命令と後続句の応答的関係を自然に示すが、原文の省略形について脚注を付した。
- source_word: τὸ κλῆμα
  choice: 枝
  rationale: ぶどうの木から伸びる枝を指し、文脈上明確なので簡潔に「枝」とした。
- source_word: καρπὸν φέρειν
  choice: 実を結ぶ
  rationale: 農業的比喩に適合し、聖書日本語として定着しつつ現代でも理解しやすい表現。
- source_word: ἀφ’ ἑαυτοῦ
  choice: 自分では
  rationale: 枝が独力で、あるいは自らを源として実を結べないことを、自然な日本語で表す。
- source_word: οὐ δύναται / οὐδὲ ὑμεῖς
  choice: 実を結ぶことができない／できません
  rationale: 後半では前節の能力表現と不定詞を補い、比較の内容を日本語で明確かつ自然にした。
- source_word: ἡ ἄμπελος
  choice: ぶどうの木
  rationale: 枝との対比が明瞭になる標準的な訳語。
theological_decisions:
- issue: μένωが弟子とイエスの関係を表す箇所の訳
  choice: とどまる
  alternative: つながっている／住む
  rationale: 継続的な関係と内在の含みを保ちながら、ぶどうの木と枝の比喩にも自然に通じる。「つながる」は比喩を説明しすぎ、「住む」は枝について不自然になる。
- issue: κἀγὼ ἐν ὑμῖνの省略された動詞と節の関係
  choice: そうすれば、わたしもあなたがたのうちにとどまります
  alternative: そして、わたしもあなたがたのうちに／わたしもあなたがたのうちにいるようにしなさい
  rationale: 日本語として必要な動詞をμένωから補い、相互的な内在を示した。一方、ギリシア語は動詞を明示せず、命令・約束・相互性のニュアンスを簡潔な省略形に残しているため、脚注でその曖昧さを保持した。
- issue: 後半の省略表現 οὕτως οὐδὲ ὑμεῖς
  choice: あなたがたも……実を結ぶことができません
  alternative: あなたがたも同様です
  rationale: 前半のοὐ δύναται καρπὸν φέρεινを補って比較の内容を明確にするが、新たな神学的内容は加えない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「わたし」「あなたがた」を用いて複数形を示した。比喩を説明語に置き換えず、「うちにとどまる」「実を結ぶ」を反復して原文の構造と主題語を保った。
