source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: ja
  text: わたしが父のもとからあなたがたに遣わす弁護者[a]、すなわち、父のもとから出る真理の霊[c]が来るとき、その方はわたしについて証言します[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「助け主」「援助者」「慰め主」とも訳せる。ギリシア語は「パラクレートス」。
    reason: lexical_alternative
  - marker: b
    text: 「わたしについてあかしします」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ギリシア語は「父のもとから出る」と言っている。この表現は後に三位一体論で重要な意味を持つようになった。
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: 来るとき
  rationale: ὅταν＋接続法はここでは将来の出来事を指す。「来るとき」は自然な現代日本語で、その期待された到来を明確に表す。
- source_word: ὁ παράκλητος
  choice: 弁護者
  rationale: παράκλητοςには援助者、代弁者、擁護者などの幅がある。直後の「証言する」とも響き合う代表・弁護の含意を保つため「弁護者」とし、他の可能性を脚注に示す。
- source_word: ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός
  choice: わたしが父のもとからあなたがたに遣わす
  rationale: πέμψωの未来とὑμῖνの受け手を明示する。παρά＋属格には起点だけでなく「そば・もとから」の含みがあるため「父のもとから」とした。
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: 真理の霊
  rationale: ヨハネ文書の属格表現を簡潔かつ形式的に保つ。
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: 父のもとから出て来られる
  rationale: ἐκπορεύομαιの「外へ出る、出て来る」という動きを日本語で透明に表す。「発出する」ほど後代の神学用語に寄せず、単なる「来る」より語彙的な特徴を保つ。
- source_word: ἐκεῖνος
  choice: その方
  rationale: 男性形の指示代名詞が弁護者／霊を人格的に受け直していることを、自然で敬意ある日本語で示す。
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: わたしについて証言します
  rationale: μαρτυρέωの証人・証言の含意を保ち、περί＋属格を自然に「について」と訳す。
theological_decisions:
- issue: παράκλητοςの訳語
  choice: 弁護者
  alternative: 助け主、援助者、慰め主、パラクレートス
  rationale: 一語ですべての意味を尽くすことはできないが、この文脈の証言という働きに合う代表・擁護の側面を本文に置き、意味の幅は脚注で保持する。
- issue: 聖霊の人格的な表現
  choice: 来られる／その方
  alternative: 出て来るもの／それ
  rationale: πνεῦμαと関係代名詞は文法上中性だが、ἐκεῖνοςは男性形で弁護者／霊を受ける。日本語でも非人格的に響かない表現を用いる。
- issue: ἐκπορεύεταιの神学的に重要な表現
  choice: 父のもとから出て来られる
  alternative: 父から発出される、父から来られる
  rationale: 原文が述べる起点と動きを保ちつつ、後代の三位一体論上の術語や論争上の結論を本文へ過度に持ち込まない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。イエスの一人称は「わたし」、弟子たちへの複数形は「あなたがた」とした。「父のもとから」を二度保ち、原文の反復と起点の表現を維持した。
