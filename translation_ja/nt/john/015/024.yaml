source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: ja
  text: もしわたしが、ほかのだれも行わなかったわざを彼らの間で行わなかったなら、彼らには罪がなかったであろう[a]。しかし今、彼らはそれらのわざを見て、わたしをも、わたしの父をも憎んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼らは罪を持たなかったであろう」。「彼らは罪の責任を負わなかったであろう」とも訳せる。
    reason: 原文のヨハネ的表現「罪を持つ」を本文に残しつつ、その責任に関わる含意と別訳を示すため。
lexical_decisions:
- source_word: τὰ ἔργα
  choice: わざ
  rationale: ヨハネ福音書でイエスの身元と使命を示す行為を指す用語として、自然でありながら一貫性を保てる「わざ」とした。
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: 彼らの間で行わなかったなら
  rationale: ἐν αὐτοῖςは、彼らの内面に働いたという意味ではなく、彼らのただ中・面前で行ったことを表すと判断した。反実仮想の条件は日本語の自然な形で示した。
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: ほかのだれも行わなかったわざ
  rationale: イエスのわざの比類なさを、原文に即して簡潔に表した。
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: 彼らに罪はなかったであろう
  rationale: 「罪を持つ」というヨハネ独特の表現を、「罪に定められない」「責任がない」などと狭く解釈せず、日本語で理解可能な範囲で字義を保った。
- source_word: νῦν δὲ
  choice: しかし今
  rationale: 反実仮想と現実との明確な対照を保った。
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: そのわざを見たうえで、…憎んだ
  rationale: 二つの完了形が示す、見たという事実と、それにもかかわらず憎んだという現在に関わる結果を、自然な日本語で結び付けた。「そのわざを」は文脈から補った目的語である。
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: わたしをも、わたしの父をも
  rationale: 反復されるκαίの強調を「も…も」で再現し、子への憎しみが父にも向けられているという並列を保持した。
theological_decisions:
- issue: 「彼らに罪はなかった」の責任概念
  choice: 原文の「罪を持たない」に近い「彼らに罪はなかった」を保持する。
  alternative: 彼らは罪に問われなかった／罪の責任はなかった
  rationale: 文脈上、イエスの啓示的なわざを見た者の責任が問題となるが、翻訳本文では、それを法的責任だけに限定せず、原文の神学的緊張を残した。
- issue: 見ることと憎むことの関係
  choice: 「見たうえで、…憎んだ」とする。
  alternative: 「見て、しかも…憎んだ」／「見たにもかかわらず…憎んだ」
  rationale: 原文のκαίは明示的な逆接ではないため「にもかかわらず」と断定せず、二つの行為の重なりと文脈上の含意を穏やかに示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「わざ」「罪」などヨハネ福音書の主要語には簡潔で品位ある聖書的語彙を採用した。長い一文の論理関係が追いやすいよう、条件節・帰結・現実との対照を明確にした。
