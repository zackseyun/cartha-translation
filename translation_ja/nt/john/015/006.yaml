  source_fidelity: 本文は条件節の不定の対象（「だれでも」）、μένωの継続的な関係を表す「わたしのうちにとどまっている」、受動態の「外へ投げ捨てられて」、枝が枯れるという連続、および不特定の複数行為者による収集・投火を適切に反映している。αὐτάは複数の枝を指し、καίεταιは中性複数主語に単数動詞を伴いうるため、「それらは焼かれる」は意味を正確かつ自然に伝える。
  naturalness: 明瞭な現代標準日本語であり、ヨハネによる福音書の比喩として必要な格調も保たれている。「人々は」は不特定三人称複数を自然に表し、行為者を不当に特定していない。
  terminology: 「わたしのうちにとどまる」はἐν ἐμοίおよびμένωの重要なヨハネ的表現を保っている。「枝」「火の中に投げ込む」「焼かれる」も文脈と原文に忠実である。注aは「住み続ける」を別訳として示すが、本文の「とどまる」がより適切な中心訳となっている。注bは本文が決着させない弟子性に関する教理的論争を公平に留保している。
