id: JHN.15.6
reference: John 15:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: ja
  text: だれでも、わたしのうちにとどまっていないなら[a]、枝のように外へ投げ捨てられて枯れる。人々はそのような枝を集め、火の中に投げ込み[b]、それらは焼かれる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしのうちに住み続けていないなら」。ギリシア語の動詞は、そこにとどまり、関係を保ち続けることを表すヨハネ文書の鍵語。
    reason: lexical_alternative
  - marker: b
    text: この比喩は、外に捨てられて焼かれることを警告している。ただし、この節自体は、真の弟子がその立場を失うことを描くのか、見かけだけの結びつきが明らかになることを描くのかを特定していない。
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: とどまっている
  rationale: ヨハネ文書の鍵語μένωが表す、関係の中に継続している意味を自然な現代日本語で保つ。
- source_word: ἐν ἐμοί
  choice: わたしのうちに
  rationale: イエスとの関係的・神学的な結びつきを示すἐνの比喩的表現を、単なる「わたしと共に」へ言い換えず保持する。
- source_word: ἐβλήθη ἔξω
  choice: 外へ投げ捨てられて
  rationale: アオリスト受動態の鮮明な結果を保ちつつ、枝が除かれる比喩に適した自然な日本語とした。
- source_word: ὡς τὸ κλῆμα
  choice: 枝のように
  rationale: 直前から続くぶどうの木の比喩ではκλῆμαがぶどうの枝を指すため、文脈上明瞭な「枝」とした。
- source_word: ἐξηράνθη
  choice: 枯れる
  rationale: 枝が乾いて枯れる状態を簡潔かつ自然に表す。
- source_word: συνάγουσιν
  choice: 人々は…集め
  rationale: ギリシア語の不特定三人称複数を、行為者を特定しない日本語の「人々」で表した。
- source_word: αὐτὰ
  choice: そのような枝／それら
  rationale: 中性複数形が、代表として単数で語られた枝と同類の複数の枝を指すことを日本語で明確にした。
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: 火の中に投げ込み
  rationale: 動作の具体性と裁きの比喩の強さを、過度な古語を用いず直接に伝える。
- source_word: καίεται
  choice: それらは焼かれる
  rationale: 動詞自体は三人称単数だが、中性複数主語αὐτάに対して単数動詞が用いられるギリシア語の一致に照らし、複数の枝を受ける自然な日本語とした。
- source_word: τις
  choice: だれでも
  rationale: 条件文における不定代名詞の一般的・包括的な範囲を自然に示す。
theological_decisions:
- issue: この警告を、背教、聖徒の堅忍、または見かけだけの弟子についての特定の教理に結びつけるか
  choice: 枝が外に捨てられ焼かれるという比喩的警告を、解釈的な補足なしに直接訳す
  alternative: 真の信者の離反、または初めから真に結ばれていなかった者の露呈のいずれかに限定する
  rationale: 本文は排除と焼却を厳しく警告するが、その人物の従前の霊的状態を明示していないため、後代の教派的結論で曖昧さを解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたしのうちにとどまる」はヨハネ特有の比喩を保持し、「外へ投げ捨てられる」「火の中に投げ込む」で警告の具体性を弱めない。ギリシア語の不特定三人称複数は「人々」とし、行為者を特定していない。
