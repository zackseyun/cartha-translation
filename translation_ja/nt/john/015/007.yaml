id: JHN.15.7
reference: John 15:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: ja
  text: あなたがたがわたしのうちにとどまり、わたしのことばがあなたがたのうちにとどまるなら、望むことは何でも求めなさい。そうすれば、そのとおりになります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: とどまる／とどまる
  rationale: ヨハネ文書で重要な、関係のうちに継続していることを表す語。同じ訳語を二度用い、原文の反復と継続性を保った。
- source_word: ἐν ἐμοὶ
  choice: わたしのうちに
  rationale: イエスとの結びつきを表すἐνの空間的・関係的表現を保ち、「わたしと共に」などへ弱めなかった。
- source_word: τὰ ῥήματά μου
  choice: わたしのことば
  rationale: イエスが語ったことばを指すῥήματαの直接的で自然な訳。「ことば」は集合的な単数形で、日本語として自然に内容全体を表せる。
- source_word: ὃ ἐὰν θέλητε
  choice: 望むことは何でも
  rationale: 意志・願望の対象が限定されていない構文を自然な現代日本語で表し、本文にない条件は加えなかった。
- source_word: αἰτήσασθε
  choice: 求めなさい
  rationale: 祈りや願いの文脈に適した命令表現。「願いなさい」も可能だが、「求める」は対象を求めて願う意味を明確に伝える。
- source_word: γενήσεται ὑμῖν
  choice: あなたがたのために実現します
  rationale: γίνομαιの「生じる、実現する」という結果的意味と、与格ὑμῖνの受益的な含みを自然に表した。行為者を原文以上に特定する「していただけます」は避けた。
theological_decisions:
- issue: 祈りについての条件と約束の構造
  choice: 求めることへの約束を、イエスのうちにとどまり、そのことばが弟子たちのうちにとどまるという明示的条件のもとに置いた。
  alternative: 約束を無条件に聞こえるよう意訳する。
  rationale: ギリシャ語ではἐὰνによる条件節が後続の命令と約束を枠づけているため、その条件を明確に保ち、約束を本文以上に一般化しなかった。
- issue: γενήσεταιの主語と行為者
  choice: 「実現します」とし、願いが実現するとの約束を表しつつ、実現させる行為者を明示しなかった。
  alternative: 「神がかなえてくださいます」または「していただけます」。
  rationale: 原文は神学的文脈では神の働きを含意しうるが、文法上は行為者を明記していない。訳文でもその含みと省略を保持した。
translation_notes:
  register: 明瞭で現代的かつ敬意ある標準日本語。「あなたがた」と「わたしのうちに」により、複数への呼びかけとヨハネ特有の関係表現を保持した。注記を要するほど重要な訳語上の曖昧さは本文内で失われていないため、脚注は設けなかった。
