id: JHN.15.17
reference: John 15:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα ἐντέλλομαι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: ja
  text: これらのことをわたしがあなたがたに命じるのは、あなたがたが互いに愛し合うためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「わたしはあなたがたにこれらのことを命じます。すなわち、互いに愛し合いなさい」。ギリシア語のἵναで始まる節は、目的を表すとも、命令の内容に近い意味を表すとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 中性複数の指示代名詞を複数のまま表し、直前までに語られた事柄を指す形を保った。
- source_word: ἐντέλλομαι
  choice: 命じる
  rationale: 命令や指示を与えるという直接的な意味を、簡潔で自然な現代日本語で表した。ギリシア語の現在形は、日本語では特別な進行表現を加えずとも文脈上十分に伝わる。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 二人称複数の与格を明示し、命令を受ける弟子たちを複数として表した。
- source_word: ἵνα
  choice: ためです
  rationale: 節を目的として訳し、命じることと互いに愛することとの関係を自然な日本語で示した。ただし内容を説明する用法に近い可能性は脚注に残した。
- source_word: ἀγαπᾶτε
  choice: 愛し合う
  rationale: ἀγαπάωを「愛する」とし、相互代名詞と合わせて自然な日本語の相互表現「愛し合う」とした。現在語幹の継続性を「愛し続ける」とまで限定しなかった。
- source_word: ἀλλήλους
  choice: 互いに
  rationale: 集団内での相互的な行為を明確に表し、「愛し合う」と組み合わせて自然に訳した。
theological_decisions:
- issue: 命令とἵνα節の関係
  choice: イエスがこれらのことを命じる目的は、弟子たちが互いに愛し合うことだと読める形にした。
  alternative: 「わたしはあなたがたにこれらのことを命じます。すなわち、互いに愛し合いなさい」と、ἵνα節を命令内容に近いものとして理解する。
  rationale: ἵναはここで目的を表すと自然に理解できるが、ヨハネ文書では説明的・内容的な用法に近づく場合もあるため、本文では目的を採りつつ別解を脚注で保持した。
translation_notes:
  register: 明瞭で現代的ながら、イエスの言葉としての品位を保つ文体。「これらのこと」と複数形を明示し、「あなたがた」で受け手の複数性も示した。日本語として不自然な進行形は避けた。
