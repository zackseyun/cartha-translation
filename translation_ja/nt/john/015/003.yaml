  text: ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: ja
  text: あなたがたは、私があなたがたに語ったことばのゆえに、すでに清いのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私があなたがたに語ったことばによって」。
    reason: διά＋対格はここでは主として理由・原因を表すが、日本語では、ことばを清めに関わる媒介として含意しうる表現も可能であるため。
lexical_decisions:
- source_word: ἤδη
  choice: すでに
  rationale: 現在すでに成立している状態を表し、直前の刈り込み／清めの比喩との対照を自然に示す。
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 明示された複数代名詞を主題として表し、ギリシア語の強調を過度に強めずに保つ。
- source_word: καθαροί
  choice: 清い
  rationale: 道徳的・霊的な含みを持ちながら、直前の καθαίρει との語義上のつながりも保てる。「純粋だ」より比喩との連続性が明確である。
- source_word: διὰ τὸν λόγον
  choice: ことばによって
  rationale: διά＋対格は理由・原因を表しうるが、日本語の「によって」は根拠と媒介の両方の含みを保ち、原文の解釈幅を不必要に狭めない。
- source_word: λόγον
  choice: ことば
  rationale: ヨハネ文書の語法を保つ直接的な訳。「教え」「メッセージ」より解釈を加えない。
- source_word: ὃν λελάληκα
  choice: 私が…語った
  rationale: 日本語では完了の継続的効果を独立した時制形で表しにくいが、「すでに清い」という主節が現在の結果を示す。「語った」は λόγον と自然に対応する。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 複数の間接目的語を明示して忠実に訳す。
theological_decisions:
- issue: 弟子たちの「清さ」の性質
  choice: 現在の霊的・道徳的な清さを述べる比喩として訳し、特定の教理用語に限定しない。
  alternative: 秘跡による清め、または義認の法廷的宣告として限定して訳す。
  rationale: 文脈はぶどうの木と刈り込み／清めの比喩であり、イエスの語ったことばと弟子たちの清さを結びつける。後代の教理体系に狭めず、本文の神学的な開放性を保つ。
- issue: διά の因果性と媒介性
  choice: 「によって」として、原因・根拠と媒介の双方を含みうる表現にする。
  alternative: 「ことばのゆえに」として因果だけを前面に出す。
  rationale: διά＋対格はここで因果的に理解できるが、ことばが清めに関与する仕方を原文は細かく規定していないため、日本語でも解釈幅を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「ことば」は聖書的語感とヨハネ文書の用語上の連続性を保つため、ひらがな表記とした。主節を後置して自然な日本語にしつつ、「すでに」を述語の近くに置いて現在成立している状態を明確にした。
