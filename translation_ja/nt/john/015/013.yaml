  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: ja
  text: 人が自分の友のために[b]自分の命を捨てる[a]こと、これよりも大きな愛はありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「命」と訳したギリシア語プシュケーは、「魂」または「自分自身」を意味することもある。ここでは、他者のために死ぬ際に差し出す命を指す。
    reason: lexical_alternative
  - marker: b
    text: 「ために」と訳したギリシア語ヒュペルは、「〜のためを思って」または「〜の益のために」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: これよりも大きな愛
  rationale: 比較級と比較の属格を保ち、「これ」が後続の内容を指す構造を自然な日本語で表した。
- source_word: οὐδεὶς ἔχει
  choice: 持つ者はいない
  rationale: 所有を表す ἔχει と全否定 οὐδείς を簡潔に対応させた。
- source_word: ἵνα τις
  choice: すなわち、人が…ことである
  rationale: ここでの ἵνα は主に目的ではなく、直前の「これ」の内容を説明する働きと判断した。τις の不定・一般的な意味は「人が」で表した。
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: 自分の命を差し出す
  rationale: ψυχή はこの文脈では死に至る自己献身としての「命」を指す。τίθημι の基本像を踏まえつつ、日本語では「命を差し出す」が自然で明確である。
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: 自分の友のために
  rationale: ὑπέρ の受益・代理的な幅を「ために」で保ち、代償的意味だけに限定しなかった。φίλοι は「友」とした。
theological_decisions:
- issue: ψυχή の意味
  choice: 命
  alternative: 魂、自分自身
  rationale: ここでは友のために死ぬ具体的な自己献身が語られており、身体と魂の二分法を持ち込まず文脈上の意味を示す。
- issue: ὑπέρ の意味の範囲
  choice: ために
  alternative: 代わりに、ためを思って
  rationale: 受益・代理・犠牲的含意を許容しつつ、この前置詞だけで厳密な代償概念に限定しない表現を選んだ。
- issue: ἵνα 節の機能
  choice: 「これ」の内容を説明する節
  alternative: 目的節（人が命を差し出すために）
  rationale: 文脈と構文から、最大の愛が何であるかを具体化する説明的用法とした。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「者」は格言的な文体に合うため用いたが、一般的主体 τις は後半で性別を限定しない「人が」とした。「命を捨てる」も慣用的だが、θῇ の自発的な自己献身を明確にするため「命を差し出す」を採用した。
