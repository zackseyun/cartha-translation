  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: ja
  text: 世があなたがたを憎むなら、世はすでにあなたがたより先に、わたしを憎んでいることを知っておきなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたは知っている」とも訳せる。ギリシア語の「知る」は、ここでは命令形とも直説法とも取れる。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: κόσμος
  choice: 世
  rationale: ヨハネ文書で神に敵対する人間世界という含みを帯びうるが、本文では解釈を狭めず、自然で伝統的な「世」とした。
- source_word: μισεῖ
  choice: 憎む
  rationale: 現在形の一般的・継続的な意味を、自然な日本語の現在形で表した。
- source_word: γινώσκετε
  choice: 知っておきなさい
  rationale: 形態上は直説法とも命令法とも取りうるが、条件節に続く勧告として読むのが文脈上自然であり、その含意も伝わる表現とした。
- source_word: πρῶτον ὑμῶν
  choice: あなたがたより先に
  rationale: 属格を伴う πρῶτον の時間的先行を、明確で自然な比較表現にした。
- source_word: μεμίσηκεν
  choice: 憎んだのだ
  rationale: 完了形が示す先行する出来事と現在への関わりを、説明的な「のだ」によって文脈上自然に示した。
theological_decisions:
- issue: ヨハネにおける κόσμος の意味
  choice: 本文では「世」とし、神に敵対する世界体制などと説明的に言い換えない。
  alternative: 神に背く人間世界／この世の体制
  rationale: 否定的な神学的含みは文脈にあるが、訳文で対象を限定せず、原文の広さと緊張を保つため。
- issue: γινώσκετε の法の曖昧さ
  choice: 命令・勧告として「知っておきなさい」と訳す。
  alternative: 「知っています」と直説法に取る。
  rationale: 条件文に続く発話の流れでは命令として理解するのが自然だが、形態上の曖昧さは注で示した。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの言葉として簡潔さと荘重さを保った。「世」はヨハネ福音書に通底する語彙上の連続性を重視した。
