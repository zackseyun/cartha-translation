  text: ὡς οὖν ἤκουσεν ὅτι ἀσθενεῖ, τότε μὲν ἔμεινεν ἐν ᾧ ἦν τόπῳ δύο ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: ja
  text: そこでイエスは、ラザロが病気だと聞くと、自分のいた場所に二日間とどまった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: そこで、…聞いても
  rationale: οὖνの文脈上のつながりを「そこで」で示し、ὡς以下と主節の意外な関係は、日本語として自然な譲歩表現「聞いても」で表した。直前の愛についての記述と、なお滞在したという行動との緊張を保つ。
- source_word: ἤκουσεν
  choice: 聞いて
  rationale: ἀκούωの通常の意味をそのまま明瞭に表す。
- source_word: ὅτι ἀσθενεῖ
  choice: ラザロが病気だと
  rationale: ἀσθενέωはこの文脈では身体の病気を指す。日本語では間接話法でも時制を過去にずらす必要がないため、ギリシア語の現在形に沿って「病気だ」とした。主語は文脈上のラザロであり、日本語での明瞭さのため名前を補った。
- source_word: τότε μὲν
  choice: なお
  rationale: μένの軽い強調と、続く七節のἔπειταとの対応を、日本語で過度に硬くならない「なお」で示す。この語は、病気だと聞いたにもかかわらず滞在を続けたという叙述上の緊張も自然に伝える。
- source_word: ἔμεινεν
  choice: とどまった
  rationale: 場所に引き続き滞在するというμένωの意味を、自然で品位のある日本語で表す。
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: 自分のいた場所に
  rationale: 原文の場所を示す表現を保持しつつ、日本語として自然にした。
- source_word: δύο ἡμέρας
  choice: 二日間
  rationale: 期間を表す対格を明瞭に訳した。
theological_decisions:
- issue: ラザロの病気を聞いた後もイエスが滞在を続けたことの含意
  choice: 遅れの理由を説明せず、「聞いても、なお…とどまった」と叙述上の緊張を保つ。
  alternative: 憐れみに基づく計画や意図を本文に補って、遅れを説明する。
  rationale: 原文はこの節で理由を明示せず、知らせを聞いたことと二日間とどまったことを並べているため、その神学的・物語的緊張を翻訳で解消しない。
translation_notes:
  register: 明瞭な現代標準日本語。文脈上必要な主語として「イエス」と「ラザロ」を補い、硬い逐語調を避けながら原文の意外性と時間的進行を保持した。
