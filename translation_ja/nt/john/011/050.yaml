id: JHN.11.50
reference: John 11:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲ ⸀λογίζεσθε ὅτι συμφέρει ⸀ὑμῖν ἵνα εἷς ἄνθρωπος ἀποθάνῃ ὑπὲρ τοῦ λαοῦ καὶ μὴ ὅλον τὸ ἔθνος ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: ja
  text: また、あなたがたは、一人の者が民のために[a]死に、国全体が滅びないほうが、あなたがたにとって得策だということも考えていない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「民のために」は、「民を代表して」または「民に代わって」とも訳せる。
    reason: ὑπέρが文脈により表しうる利益・代表・代替の意味範囲を保ち、本文でいずれか一つの解釈に限定しないため。
lexical_decisions:
- source_word: οὐδὲ
  choice: また……ということも、考えていない
  rationale: 前節から続く否定的な叱責を表す。日本語では「また」と「も……ない」を組み合わせ、接続と否定の力を自然に示した。
- source_word: λογίζεσθε
  choice: 考えていない
  rationale: 計算する、推論する、考慮するという意味。ここでは宗教的・政治的な協議の中で利害を考慮することを指すため、「考えていない」とした。
- source_word: συμφέρει
  choice: 得策だ
  rationale: 実際上の利益や有利さを表す。カイアファの功利的な判断を、現代日本語で明確かつ簡潔に伝える。
- source_word: ὑμῖν
  choice: あなたがたにとって
  rationale: 利益を受ける側を示す与格であり、聞き手自身にとっての利得という含みを保った。
- source_word: ἵνα
  choice: ……ほうが
  rationale: 何が有利であるかという内容を導く。日本語では二つの成り行きを対比する「……ほうが」が自然であり、文の論理関係を明確にする。
- source_word: εἷς ἄνθρωπος
  choice: 一人の人
  rationale: 単独の一個人であることを明示し、国民全体との対比を保った。
- source_word: ἀποθάνῃ
  choice: 死に
  rationale: ἵνα節内のアオリスト接続法。日本語では後続の否定節と並列する連用形で、過度な様態の付加を避けた。
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: 民のために
  rationale: ὑπέρは利益・代表・代替の意味領域を持つ。本文では幅のある「ために」を用い、「民に代わって」という可能性を脚注に示した。
- source_word: λαοῦ
  choice: 民
  rationale: ここではユダヤの民を共同体として指す。「民」は契約共同体・民族共同体としての響きを保ちつつ簡潔である。
- source_word: ὅλον τὸ ἔθνος
  choice: 国民全体
  rationale: ローマの圧力のもとで滅亡を危惧される政治的・民族的共同体全体を指す。「国民全体」は「民」との語の違いもある程度保つ。
- source_word: ἀπόληται
  choice: 滅びない
  rationale: 破滅・壊滅に至ることを表す。具体的な滅亡の様態を限定せず、原文の重大さを保った。
theological_decisions:
- issue: イエスの死に関するὑπὲρの意味
  choice: 本文では広い意味を持つ「民のために」とした
  alternative: 「民に代わって」
  rationale: 発言者カイアファの直接の意図は政治的な得策にある一方、語り手は次節でその発言を本人の意図を超えた預言として扱う。本文で意味を代償・身代わりに限定せず、脚注でその含みを明示することで、この二重の意味と神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、議会での冷徹な政治的判断にふさわしい「得策だ」を採用した。「一人の人」と「国民全体」の対比を明示し、文体は簡潔で dignified な叙述調に整えた。
