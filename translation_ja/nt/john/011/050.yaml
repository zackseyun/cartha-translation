  rationale: 本文の意味は維持したまま、οὐδέの追加的否定を自然な語順で示し、ἔθνοςを「国全体」として政治的・民族的共同体の含意を明確にした。脚注はὑπέρについて、原文および英語監査記録が示す代表と代替の両可能性を簡潔に補った。
