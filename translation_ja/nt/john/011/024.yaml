  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: ja
  text: マルタはイエスに言った。「彼が終わりの日の復活のときによみがえることは知っています。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語文として自然な過去形で表した。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 直訳は「彼に」だが、文脈上の指示対象を明示し、現代日本語で自然な発話導入とした。
- source_word: ἡ Μάρθα
  choice: マルタは
  rationale: 人名は日本語で定着した音写を用い、主題を示す自然な形とした。
- source_word: Οἶδα
  choice: 知っています
  rationale: 確かな認識を表す直接的で自然な訳。マルタの確信を弱めない。
- source_word: ἀναστήσεται
  choice: 彼がよみがえる
  rationale: 未来中動態形を、復活の文脈で自動詞的な「よみがえる」と訳した。「よみがえらされる」として受動の観点を加えることは避けた。
- source_word: ἐν τῇ ἀναστάσει
  choice: 復活の時に
  rationale: ἐνがここで示す時点・状況を、現代日本語で自然に表した。定冠詞を伴うἀνάστασιςは、終末における復活という特定の出来事を指す。
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 終わりの日の
  rationale: 「最後の日」も可能だが、ヨハネ文書の終末論的表現として分かりやすく、荘重さも保つ「終わりの日」を採用した。後続する「復活」を修飾する自然な日本語に再構成した。
theological_decisions:
- issue: 終末における復活への言及
  choice: 「終わりの日の復活」とし、将来の特定の復活を指す表現を保持した。
  alternative: 死後の生についての一般的な希望として曖昧に訳す。
  rationale: ἀναστήσεταιとἀνάστασιςの反復に「終わりの日」が加わっており、単なる死後存続ではなく終末の復活を明確に指している。ただし、その様態について本文にない教理的説明は加えない。
- issue: 二つのἐν句の関係
  choice: 「終わりの日の復活の時に」と一続きに訳した。
  alternative: 「復活の時、終わりの日に」と並列的に訳す。
  rationale: 両句は同じ終末的時点を重ねて限定していると自然に読めるが、ギリシア語の反復構造には同格的・説明的に読む余地もあるため、脚注で別表現を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、終末論的な発言にふさわしい落ち着いた語調を保った。「甦る」ではなく、常用的で読みやすい「よみがえる」と表記した。
