  source_fidelity: 本文は将来の復活（ἀναστήσεται）と「復活」「終わりの日」という終末的限定を正しく保持しています。「イエスに」は文脈上明確なαὐτῷの自然な明示です。ただし「終わりの日の復活の時に」は名詞句の重なりがやや硬く、復活が「終わりの日」に属するという関係を不必要に読みにくくしています。
  naturalness: 「終わりの日の復活のときに」とすると、明瞭な現代標準日本語として自然であり、落ち着いた文体も保てます。「彼がよみがえることは知っています」はマルタの確信を適切に表しています。
  terminology: 「マルタ」「イエス」「復活」「終わりの日」「よみがえる」はいずれも適切です。「終わりの日」はヨハネ福音書のἐν τῇ ἐσχάτῃ ἡμέρᾳに対する明瞭で定着した表現です。日本語では「復活のときに」と「復活の際に」の差は英語のin/atほど意味のある訳語上の選択ではないため、この箇所の脚注は不要です。
