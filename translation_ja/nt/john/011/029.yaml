  text: ἐκείνη ⸀δὲ ὡς ἤκουσεν ⸀ἠγέρθη ταχὺ καὶ ⸀ἤρχετο πρὸς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/029.yaml
  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: ja
  text: 彼女はそれを聞くと、すぐに立ち上がって、イエスのもとへ向かった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: 彼女
  rationale: 直前の文脈でマリアを指す指示代名詞。日本語では「その女」より「彼女」が自然で、指示対象も明確である。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは物語を緩やかに進める接続辞であり、日本語では文脈上省略するほうが自然である。
- source_word: ὡς ἤκουσεν
  choice: それを聞くと
  rationale: ὡς は時間関係を示す。「すぐに聞くや」とまで強めず、後続の ταχύ による迅速さを保つ。「それ」は前節で伝えられた知らせを指す補足である。
- source_word: ἠγέρθη
  choice: 立ち上がって
  rationale: 形は受動態だが、この文脈では自動詞的に「起き上がる、立ち上がる」の意。外部の行為者を示唆する「起こされて」は避ける。
- source_word: ταχὺ
  choice: すぐに
  rationale: 動作の迅速さ・即時性を自然な現代日本語で表す。
- source_word: ἤρχετο
  choice: 向かった
  rationale: 未完了過去は移動の進行を描くが、日本語の物語文では「向かった」が自然。「行った」よりも πρός の方向性をよく表す。
- source_word: πρὸς αὐτόν
  choice: イエスのもとへ
  rationale: αὐτόν の指示対象は文脈上イエス。日本語では名を明示して曖昧さを避け、「もとへ」で人物を目的地とする移動を自然に表す。
