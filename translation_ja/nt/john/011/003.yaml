id: JHN.11.3
reference: John 11:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: ja
  text: そこで姉妹たちはイエスのもとに人を送り、「主よ、ご覧ください。あなたが愛しておられる者が病気です」と伝えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτὸν λέγουσαι
  choice: イエスのもとに人を送り、…と伝えた
  rationale: 日本語では「彼のもとに送った」だけでは目的語が不自然に欠けるため、使者を送って伝言したという文脈上の意味を自然に表した。指示対象は明確なので「彼」を「イエス」とした。
- source_word: Κύριε
  choice: 主よ
  rationale: 呼びかけとしての敬意と、ヨハネ福音書における称号の含みを保つ。
- source_word: ἴδε
  choice: ご覧ください
  rationale: 注意を促す命令形の力を保ちつつ、主への呼びかけに合う丁寧で自然な表現とした。
- source_word: ὃν φιλεῖς
  choice: あなたが愛しておられる者
  rationale: φιλέωの親愛を過度に限定せず、「愛する」と訳した。目的語の人物を本文どおり名指ししない。
- source_word: ἀσθενεῖ
  choice: 病気です
  rationale: この文脈では身体的に病んでいることを表すため、現代日本語で明瞭な表現とした。
theological_decisions:
- issue: φιλέωが表す愛の種類
  choice: 愛しておられる
  alternative: 親しくしておられる／かわいがっておられる
  rationale: 語彙上の親愛のニュアンスは認めつつ、ἀγαπάωとの厳密な神学的区別を本文に持ち込まず、自然で広がりのある訳を採用した。
- issue: κύριεの称号性
  choice: 主よ
  alternative: 先生／旦那様
  rationale: 話者の敬意と物語上のキリスト論的含意の双方を損なわない伝統的かつ現代でも理解可能な呼称とした。
translation_notes:
  register: 明瞭な現代標準日本語。伝言の切迫感を保ちながら、敬意ある呼びかけには丁寧語を用いた。
