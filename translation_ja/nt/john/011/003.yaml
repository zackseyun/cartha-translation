  source_fidelity: 原文のοὖνを「そこで」とし、ἀπέστειλαν πρὸς αὐτόν λέγουσαιを「イエスのもとに人を送り、…と伝えた」と自然な日本語で表している。「人を送り」は使者を介した伝言という文脈上明白な含意を補うもので、意味を過度に限定しない。ἴδε、ὃν φιλεῖς、ἀσθενεῖもそれぞれ適切に反映されている。
  naturalness: 明瞭で自然な現代標準日本語である。引用内の「主よ、ご覧ください」と、報告内容の「病気です」は、敬意と切迫した伝言の調子に合っている。
  terminology: 「主よ」はκύριεの呼格として適切であり、過度に解釈的ではない。「あなたが愛しておられる者」はφιλεῖςを不自然な語彙的・教理的区別なしに忠実に表す。固有名「イエス」の明示も指示対象の明確化として妥当である。
