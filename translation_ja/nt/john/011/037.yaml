source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: ja
  text: しかし、彼らのうちの何人かは言った[a]。『盲人の目を開けたこの人は、この人が死なないようにすることもできなかったのか。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この人を死なせずにおくこともできなかったのか。」
    reason: ποιῆσαι ἵνα μὴ ἀποθάνῃの自然な別訳を示すため。
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: しかし、その中のある者たちは
  rationale: τινές ἐξ αὐτῶνを「その中のある者たち」とし、δέは直前の人々の反応との対照を示す「しかし」で表した。
- source_word: εἶπαν
  choice: 言った
  rationale: 物語中のアオリストを、自然な単純過去として訳した。
- source_word: Οὐκ ἐδύνατο
  choice: できなかったのか
  rationale: 過去における能力を問う否定疑問文であり、できたはずだという批判的含意を保つ。
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: 盲人の目を開けたこの人
  rationale: 冠詞付き分詞句を自然な連体節とし、指示語οὗτοςの指し示す調子も「この人」で保持した。
- source_word: ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ
  choice: この人が死なないようにすることも
  rationale: ποιῆσαι ἵναの使役・結果の関係を「ようにする」で表し、καίは「も」、二つ目のοὗτοςは本文どおり「この人」とした。
theological_decisions:
- issue: 話者たちの疑問の調子
  choice: イエスには死を防ぐこともできたはずだという懐疑的・批判的な修辞疑問として訳す
  alternative: 中立的な情報疑問として訳す
  rationale: Οὐκで始まる能力についての否定疑問は、肯定を予想しつつ、なぜそうしなかったのかという含みを持つ。ただし、本文にない明示的な非難は加えない。
- issue: 二度のοὗτοςの指示対象
  choice: どちらも「この人」として、第一はイエス、第二はラザロを指す文脈上の対照を保つ
  alternative: 第二を固有名「ラザロ」に置き換えて明確化する
  rationale: 原文の指示表現を保ち、固有名を補って曖昧さを解消しすぎない。
translation_notes:
  register: 明快な現代標準語を用いながら、「盲人の目を開けた」というヨハネ文書の特徴的な表現を保持した。否定疑問文による話者の批判的な調子は示すが、本文以上の断定は加えていない。
