id: JHN.11.10
reference: John 11:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: ja
  text: しかし、夜に歩く人はつまずく。その人のうちに光がないからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その人のもとに光がない」。ギリシア語は直訳すると「その人のうちに」であり、外から照らす光がないという以上の意味を含む可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: しかし、…人は
  rationale: δέの対比を「しかし」で示し、ἐὰν＋接続法と不定代名詞τιςの一般的条件を、日本語で自然な総称表現「…人は」によって表した。
- source_word: περιπατῇ
  choice: 歩く
  rationale: 文字どおりの歩行の比喩を保ちつつ、ヨハネ文書に見られる生き方についての含みも限定せず残す。
- source_word: ἐν τῇ νυκτί
  choice: 夜に
  rationale: νύξを解釈的な「闇」に置き換えず、前節の昼との対照を明瞭に保つ自然な日本語とした。
- source_word: προσκόπτει
  choice: つまずく
  rationale: 物理的につまずく像と比喩的な意味の双方を保てる、明瞭で標準的な訳語。
- source_word: ὅτι
  choice: …からである
  rationale: つまずく理由を導く因果関係を、格調を保った現代日本語で明示する。
- source_word: τὸ φῶς
  choice: 光
  rationale: 文脈上特定された光を指すが、日本語では冠詞を明示せずともその特定性が自然に伝わる。
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: その人のうちに光がない
  rationale: ἐνの基本的な内在の表現を保ち、単なる外部照明の欠如に限定せず、ヨハネ的な内的・神学的含意も残す。
theological_decisions:
- issue: 「その人のうちに光がない」の指示内容と意味
  choice: 原文の内在表現に沿って「その人のうちに」と訳す。
  alternative: 「その人のもとに光がない」または「その人には明かりがない」として、外的な照明の不在に限定する。
  rationale: ギリシア語ἐν αὐτῷは自然には「その人のうちに」を意味する。直前の昼夜の比喩が持つ具体的意味と、ヨハネ文書の光が持つ内的・神学的な響きとの緊張を解消せず保持する。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ常体。「しかし」で前節との対比を示し、短い二文で原文の論理を自然に伝えた。脚注記号[a]は対応箇所である文末に置いた。
