id: JHN.11.25
reference: John 11:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή· ὁ πιστεύων εἰς ἐμὲ κἂν ἀποθάνῃ ζήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: ja
  text: イエスは彼女に言った。「わたしは復活であり、いのちである。わたしを信じる者は、たとえ死んでも生きる。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῇ ὁ Ἰησοῦς
  choice: イエスは彼女に言った
  rationale: 語順を自然な日本語に整えつつ、εἶπεν の中立的な叙述と、女性単数与格 αὐτῇ の間接目的語を明示した。文脈上「彼女」はマルタを指す。
- source_word: Ἐγώ εἰμι
  choice: わたしは…である
  rationale: 強調された一人称代名詞と連結動詞による直接的な自己同定を保った。日本語として明瞭かつ荘重な「である」を用いた。
- source_word: ἡ ἀνάστασις
  choice: 復活
  rationale: この文脈では死者の復活を指す定着した訳語であり、単なる「起き上がり」ではない。日本語では述語名詞に冠詞を逐語的に表示できないが、自己同定の限定性は構文によって保たれる。
- source_word: ἡ ζωή
  choice: いのち
  rationale: 「復活」と並ぶヨハネ的な自己同定を保つ。「いのち」は生物学的な生命だけに狭めず、本文の豊かな意味を自然に伝える。
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: わたしを信じる者
  rationale: 実質名詞的な現在分詞を「…者」で単数・一般的に表し、πιστεύω εἰς の関係的な信頼を自然な日本語の「…を信じる」で訳した。
- source_word: κἂν ἀποθάνῃ
  choice: たとえ死んでも
  rationale: 譲歩条件を表す κἄν とアオリスト接続法を、自然で明確な日本語の譲歩表現にした。
- source_word: ζήσεται
  choice: 生きる
  rationale: 未来の約束は日本語の非過去形で自然に表現できる。「生き返る」と限定せず、復活と死を越えるいのちの双方を含み得る原文の広がりを保った。
theological_decisions:
- issue: Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή におけるイエスの自己同定
  choice: わたしは復活であり、いのちである
  alternative: わたしは復活といのちを与える者である
  rationale: 原文は機能を説明するのではなく、イエス自身を「復活」「いのち」と直接同定しているため、その神学的な強さと緊張を言い換えずに保った。
- issue: ὁ πιστεύων と後続する単数形の代表的用法
  choice: わたしを信じる者は、たとえ死んでも生きる
  alternative: わたしを信じる人はだれでも、たとえ死んでも生きる
  rationale: 日本語の「者」には文法上の男性限定がないため、原文の単数・一般的用法と包括的な指示を自然に両立できる。英語で必要となる性に関する注記は、日本語では不要である。
translation_notes:
  register: 明瞭な現代標準語を用いながら、自己宣言には「である」を採用して簡潔な荘重さを持たせた。「言われた」の敬語性は原文にないため、中立的な「言った」とした。
