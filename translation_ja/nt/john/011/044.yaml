id: JHN.11.44
reference: John 11:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: ja
  text: 死んでいた人が出て来た。手足は埋葬用の布で巻かれ、顔も布で包まれていた。イエスは彼らに言われた[a]。「彼をほどいて、行かせなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は現在形で、「イエスは彼らに言う」。ギリシア語では、過去の出来事を生き生きと描く歴史的現在が用いられている。
    reason: 原文の歴史的現在を、日本語本文の自然さを損なわず、かつ能動の現在形として曖昧なく示すため。
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: 死んでいた人
  rationale: 完了分詞が示す死んだ状態を保ちつつ、現代日本語として自然に表した。
- source_word: κειρίαις
  choice: 埋葬用の布
  rationale: 遺体を巻く細長い布を指す語。単なる「包帯」ではなく、文脈上の葬送用途を明示した。
- source_word: ἡ ὄψις αὐτοῦ
  choice: 顔
  rationale: ここでは外見一般ではなく、布で覆われた顔面を指す。
- source_word: σουδαρίῳ
  choice: 布
  rationale: 顔や頭を覆う布を指すが、材質や厳密な形状を本文で限定しすぎない簡潔な訳語とした。
- source_word: Λύσατε
  choice: ほどいて
  rationale: 巻き布による拘束を解くという具体的動作を自然に表す。
- source_word: ἄφετε αὐτὸν ὑπάγειν
  choice: 彼を……行かせなさい
  rationale: ἄφετε＋不定詞の使役・許可の意味を保ち、「自由にしてやりなさい」などの解釈的な拡張を避けた。
theological_decisions:
- issue: 復活した人物の呼称
  choice: 死んでいた人
  alternative: 死者
  rationale: 出来事の直前まで死んでいた事実を明示する完了分詞を反映しつつ、出て来る時点でもなお「死者」であるとの誤解を避けた。
- issue: λέγει の時制
  choice: 言われた（脚注で現在形を明示）
  alternative: 言われる
  rationale: ギリシア語の歴史的現在がもつ臨場感を注記しながら、日本語の物語として自然な過去形を本文に採用した。
translation_notes:
  register: 明快な現代標準語を用い、奇跡の場面にふさわしい簡潔で dignified な叙述とした。「手足」は原文の「足と手」を日本語の自然な語順でまとめた。
