id: JHN.11.9
reference: John 11:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: ja
  text: イエスは答えられた。「昼は十二時間あるではないか。[a] 昼の間に歩く人は、つまずかない。この世の光を見ているからである。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一日のうちには十二時間あるではないか」。ここでの「時間」は、日の出から日没までを十二に分けた当時の時刻区分を指す。
    reason: lexical_alternative
  - marker: b
    text: 「この世の光」という表現には、ヨハネ福音書に見られる神からの照らしについての、より広い響きもあり得る。ただし本文では、原文どおりの表現にとどめた。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: イエスは答えられた
  rationale: 物語における標準的な応答表現として、敬意を保ちながら自然な現代日本語にした。
- source_word: Οὐχὶ δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: 昼は十二時間あるではないか
  rationale: 肯定の答えを予期する修辞疑問の力を保ち、τῆς ἡμέραςを日照時間として自然に表した。
- source_word: ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ
  choice: 昼の間に歩く人は
  rationale: 条件的・一般的な意味を、日本語で不自然な代名詞を補わずに表した。
- source_word: οὐ προσκόπτει
  choice: つまずかない
  rationale: 実際に足を取られる像と比喩的な含みの双方を保つ語を選んだ。
- source_word: τὸ φῶς τοῦ κόσμου τούτου βλέπει
  choice: この世の光を見ている
  rationale: 語順と意味を明確に保ち、「光」が持ち得るヨハネ的な響きを訳文で限定しなかった。
theological_decisions:
- issue: 「この世の光」が持つ象徴的意味
  choice: 本文では通常の光景として直訳し、象徴性を明示しない
  alternative: イエスまたは神の導きを指すものとして訳文に明示する
  rationale: 文脈上は昼間に歩くという比喩的な言明として成立する一方、ヨハネ福音書における「光」の神学的響きもあり得るため、どちらかに限定しなかった。
- issue: τιςに由来する一般的な単数の人物表現
  choice: 「歩く人」と表す
  alternative: 「だれでも……その人は」と明示する
  rationale: 日本語では性別を示す代名詞を必要とせず、単数の代表的・一般的意味を自然に保持できる。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。発話は過度に古風にせず、修辞疑問と光・歩行の比喩を保った。日本語では一般的な人物に性別代名詞を置かないのが自然なため、英語版の代表単数に関する注は採用しなかった。
