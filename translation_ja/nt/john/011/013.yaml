  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: ja
  text: イエスはラザロの死について話しておられた。しかし弟子たちは、それが文字どおりの眠りについてのことだと思った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰρήκει
  choice: 語られたのである
  rationale: 過去完了が示す、弟子たちの誤解より前の発言を文脈上自然に表し、「のである」で語り手の説明であることを示す。
- source_word: δὲ ... δὲ
  choice: しかし
  rationale: 最初の δέ は日本語では説明構文に吸収し、二つ目はイエスの意図と弟子たちの理解の対照を「しかし」で明示する。
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: ラザロの死について
  rationale: αὐτοῦ の指示対象を日本語で明確にするため、直前の文脈が示すラザロの名を補う。イエス自身の死との誤読を避ける。
- source_word: ἐκεῖνοι
  choice: 弟子たちは
  rationale: 文脈上の指示対象を自然な日本語で明示する。
- source_word: ἔδοξαν
  choice: 思った
  rationale: 弟子たちの誤った理解を平明に表す。
- source_word: περὶ τῆς κοιμήσεως τοῦ ὕπνου
  choice: 眠って休むことについて
  rationale: 重なりのある「眠りの眠り」を逐語的に再現せず、属格が示す文字どおりの睡眠・休息という意味を自然な現代日本語で伝える。
- source_word: λέγει
  choice: 語っておられるのだ
  rationale: 歴史的現在を、弟子たちがその時そう理解していたことを示す自然な間接話法で訳す。
theological_decisions:
- issue: 死を「眠り」と呼ぶ表現が、死者の中間状態について特定の教理を含意するか
  choice: イエスの意図を「死」、弟子たちの誤解を文字どおりの睡眠・休息として対照させる
  alternative: 死後の魂の状態を示す表現として説明的に訳す
  rationale: 本文の焦点は比喩と文字どおりの理解の食い違いであり、死者の状態に関する教理をここに付加しない。
translation_notes:
  register: 明瞭で現代的な標準日本語。叙述としての品位を保つため、イエスには尊敬表現「語られた／語っておられる」を用いた。原文の意味を本文だけで自然に伝えられるため脚注は設けない。
