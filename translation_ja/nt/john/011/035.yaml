  text: Jesus wept[a].
translation:
  language: ja
  text: イエスは涙を流した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスは泣いた」。ギリシア語の動詞は特に涙を流すことを表し、この文脈の別の箇所で用いられる、声を伴うこともある泣き方を表す語とは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδάκρυσεν
  choice: 涙を流した
  rationale: δακρύωのアオリスト能動直説法三人称単数。涙を流すことを表す語なので、声を上げて泣くことまで含み得る「泣いた」よりも、原語の具体的な意味を自然な日本語で示す「涙を流した」とした。アオリストに開始の意味を読み込まず、「泣き始めた」とはしない。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 定冠詞を伴う固有名詞で、文の主語。日本語では定冠詞を訳出せず、標準的な表記「イエス」とした。
theological_decisions:
- issue: イエスの感情表現
  choice: イエスは涙を流した
  alternative: イエスは泣いた
  rationale: イエスが実際に示した人間としての感情を、説明を加えず簡潔に伝える。同時に、原語が示す涙という具体的な描写を保ち、より激しい嘆きや号泣を本文に読み込まない。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。原文の短さと厳粛さを保ち、敬語表現を加えることで原文にない語調を持ち込むことは避けた。
