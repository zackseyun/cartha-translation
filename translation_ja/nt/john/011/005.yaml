  text: ἠγάπα δὲ ὁ Ἰησοῦς τὴν Μάρθαν καὶ τὴν ἀδελφὴν αὐτῆς καὶ τὸν Λάζαρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: ja
  text: イエスは、マルタとその姉妹とラザロを愛しておられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: 愛しておられた
  rationale: ἀγαπάωの未完了過去形。過去における継続的な愛を自然な現代日本語で表し、イエスへの敬意も保つ。
- source_word: δὲ
  choice: （明示しない）
  rationale: 弱い接続辞であり、ここでは日本語に接続語を補わなくても文脈の移行が自然に伝わる。「しかし」として強い対比を持ち込むことは避けた。
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: その姉妹
  rationale: 本文がこの節では名前を明示していないことを保ち、性別は示しつつ姉か妹かを決めない表現とした。
- source_word: Μάρθαν
  choice: マルタ
  rationale: 日本語聖書で定着した標準的な音写を用いた。
- source_word: Λάζαρον
  choice: ラザロ
  rationale: 日本語聖書で定着した標準的な音写を用いた。
- source_word: καὶ ... καὶ ... καὶ
  choice: と……と……を
  rationale: 三者を並列の目的語として自然な日本語で結び、いずれもイエスの愛の対象であることを明確にした。
theological_decisions:
- issue: 未完了過去形ἠγάπαが表すイエスの愛の様相
  choice: マルタ、その姉妹、ラザロに対する継続的な愛
  alternative: 「愛するようになった」という起動的意味、または「愛し続けていた」という強調的表現
  rationale: この文脈では、未完了過去形は過去における継続的な状態を最も自然に表す。本文以上の感情的・教理的含意は加えない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。イエスについては「おられた」を用いて品位ある敬語調としつつ、過度に古風な表現は避けた。
