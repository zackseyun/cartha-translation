  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἀναστήσεται ὁ ἀδελφός σου.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/023.yaml
  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: ja
  text: イエスは彼女に言われた。「あなたの兄弟はよみがえります。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語はヨハネの物語に特徴的な歴史的現在だが、現代日本語の自然な物語叙述に合わせて過去形とし、主語への敬意を「言われた」で表した。
- source_word: αὐτῇ
  choice: 彼女に
  rationale: 与格の間接目的語を自然かつ明示的に訳した。文脈上、マルタを指す。
- source_word: Ἀναστήσεται
  choice: よみがえります
  rationale: 未来中動態を、死者が再び生きるという文脈に即して自動詞的に訳した。「よみがえらされる」として神の働きを文法以上に前景化することは避けた。日本語の「よみがえる」自体に死から生へ戻る意味があるため、「再び」は加えない。
- source_word: ὁ ἀδελφός σου
  choice: あなたの兄弟
  rationale: 所有関係を明示しつつ、ἀδελφόςの基本的意味を簡潔に表した。ここではマルタの兄弟ラザロを指す。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 固有名を日本語聖書で定着した形で表記し、冠詞は訳出しない。
theological_decisions:
- issue: 復活を表す語と時期の曖昧さ
  choice: よみがえります
  alternative: 復活します／よみがえらされます
  rationale: 死からの復活を明確にしつつ、この節だけでは、直後のラザロの生き返りと終わりの日の復活のどちらを指すかを限定しない。「よみがえらされます」は神的受動を明示しすぎるため採らない。
translation_notes:
  register: 明瞭で現代的かつ品位ある会話文。「兄弟」は文脈上、実の兄弟ラザロを指す。「言われた」は自然な日本語の物語時制を用いながら、イエスへの敬意を保つ。
