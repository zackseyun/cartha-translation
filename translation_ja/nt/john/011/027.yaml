id: JHN.11.27
reference: John 11:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: ja
  text: 彼女はイエスに言った。「はい、主よ。私は、あなたがメシア、神の子、この世に来られる方であると信じております。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: 彼女はイエスに言った
  rationale: ギリシア語は歴史的現在形だが、現代日本語の物語として自然な過去形にした。代名詞の指示対象は文脈上イエスなので、明確さのため固有名で示した。
- source_word: Ναί, κύριε
  choice: はい、主よ
  rationale: Ναίを率直な肯定の「はい」、κύριεを敬意と信仰告白の文脈にふさわしい「主よ」とした。
- source_word: ἐγὼ πεπίστευκα
  choice: 私は……信じております
  rationale: 完了形が表す、以前に成立し現在も続く確信を、丁寧な現在表現「信じております」で自然に表した。
- source_word: ὁ χριστός
  choice: メシア
  rationale: 固有名のような「キリスト」ではなく称号として用いられているため、油注がれた者というユダヤ的背景を保つ「メシア」とした。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: 定型的なキリスト論的称号を、簡潔で重みのある日本語として保持した。
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: この世に来られる方
  rationale: 冠詞付き現在分詞を、期待されていた方を示す自然な連体表現で訳した。κόσμοςはこの文脈では人間世界を指すため「この世」とした。
theological_decisions:
- issue: Χριστόςを告白的称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: イエスの身分を述べる称号であり、王的・救済史的背景を伝えるため「メシア」とした。
- issue: κύριεの呼びかけの強さ
  choice: 主よ
  alternative: 先生／あなたさま
  rationale: 直後にメシア、神の子という告白が続くため、単なる敬称よりも信仰的な響きを持つ「主よ」が適切である。
- issue: πεπίστευκαの完了相
  choice: 信じております
  alternative: 信じています／信じるようになりました
  rationale: 過去に成立して現在も継続する信仰を示しつつ、成立過程を本文以上に強調しない表現を選んだ。
- issue: ἐρχόμενοςの時間的・称号的含意
  choice: この世に来られる方
  alternative: この世に来ようとしている方／この世に来る方
  rationale: 現在分詞には進行・期待・特徴づけの幅がある。未来だけに限定せず、期待された来臨者という称号的響きを保った。
translation_notes:
  register: 明瞭で現代的ながら、マルタの厳粛な信仰告白にふさわしい丁寧で格調ある文体とした。「信じております」は「主よ」への応答として自然な敬体であり、ギリシア語完了形の継続的効力も表す。
