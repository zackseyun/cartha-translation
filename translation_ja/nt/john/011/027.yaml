  source_fidelity: ギリシア語本文の内容を忠実に伝えている。λέγειの歴史的現在は自然な物語過去「言った」とされ、文脈上の話者・聞き手も「彼女」「イエス」として明確である。Ναί, κύριε、完了形πεπίστευκα、ならびに三つの並列的なキリスト論的呼称（メシア、神の子、この世に来られる方）が適切に保持されている。
