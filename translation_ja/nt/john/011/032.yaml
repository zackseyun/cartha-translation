id: JHN.11.32
reference: John 11:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: ja
  text: そこでマリアは、イエスのおられる所に来てイエスを見ると、その足もとにひれ伏して言った。「主よ[a]、もしここにおられたなら、私の兄弟は死ななかったでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「先生」とも訳せる。ギリシア語の κύριε は敬意を示す呼びかけにも用いられるが、ここではイエスに対する呼称として「主よ」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 前の文脈を受けた物語の進行を自然に示し、推論に限定しすぎない接続表現とした。
- source_word: ὡς ἦλθεν
  choice: 来て……見ると
  rationale: ὡς はここでは到着時の状況を示す時間的用法であり、後続の分詞と合わせて自然な日本語の動作の連続として表した。
- source_word: ὅπου ἦν Ἰησοῦς
  choice: イエスのおられる所
  rationale: 場所を表す節を簡潔に保ちつつ、イエスを指す自然で敬意ある現代日本語とした。
- source_word: ἰδοῦσα αὐτόν
  choice: イエスを見ると
  rationale: 同時的・状況的な分詞を、次の行為を導く日本語の「見ると」で自然に表した。代名詞の曖昧さを避けるため固有名を反復した。
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: その足もとにひれ伏して
  rationale: 足もとに身を伏せる動作を表す慣用的な日本語で、崇敬とも悲嘆による崩れ落ちとも取り得る文脈上の幅を過度に限定しない。
- source_word: λέγουσα αὐτῷ
  choice: 言った
  rationale: 発言を導く現在分詞を、日本語では一連の動作に続く定形動詞として自然に表した。
- source_word: Κύριε
  choice: 主よ
  rationale: κύριος の基本的な訳語とヨハネ福音書におけるイエスの描写を保つ一方、呼びかけ自体が持ち得る敬称としての幅は脚注で示した。
- source_word: εἰ ἦς ὧδε
  choice: もしここにおられたなら
  rationale: 過去の事実に反する条件を、日本語の反実仮想として自然に表した。
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: 死ななかったでしょう
  rationale: ἄν を伴う過去の非現実的な結果を表し、マリアの確信を過度に強めたり弱めたりしない表現とした。
- source_word: μου ὁ ἀδελφός
  choice: 私の兄弟
  rationale: ἀδελφός が男性のきょうだいを指すことを保ちながら、兄か弟かを原文以上に特定しないため「兄弟」とした。
theological_decisions:
- issue: マリアがイエスに呼びかける Κύριε の訳
  choice: 主よ
  alternative: 先生
  rationale: 「主」はイエスへの呼びかけが持つヨハネ福音書上の重みを保つ。ただし、この語形だけで完全に展開された信仰告白と断定せず、一般的な敬称としても用い得ることを脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。過度に文語的な語順を避けつつ、マリアの悲嘆と敬意が感じられる表現にした。「兄弟」により、ラザロが兄か弟かは特定していない。
