source:
  edition: SBLGNT
  text: ἡ οὖν Μάρθα ὡς ἤκουσεν ὅτι Ἰησοῦς ἔρχεται ὑπήντησεν αὐτῷ· ⸀Μαρία δὲ ἐν τῷ οἴκῳ ἐκαθέζετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: ja
  text: そこで、マルタはイエスが来ると聞くと[a]、迎えに出た。しかし、マリアは家の中に座っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、伝聞内容の中で現在形が用いられている。文脈に応じて「イエスが来ている」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 前の文脈を受けて物語を進める接続を、現代日本語で自然に示す。強い論理的帰結を示す「それゆえ」ほど硬くない。
- source_word: ὡς
  choice: ～と聞くと
  rationale: 時間的な関係を自然に表す。「～するとすぐに」とまではせず、原文以上の即時性を加えない。
- source_word: ἤκουσεν
  choice: 聞くと
  rationale: ἀκούω の基本義をそのまま保ち、情報を耳にしたことを明確にする。
- source_word: ἔρχεται
  choice: 来られる
  rationale: 間接話法内の現在形を日本語の時制運用に合わせつつ、イエスが近づいている最中であることを表す。敬語は現代日本語の聖書文体として自然な主体敬語にとどめる。
- source_word: ὑπήντησεν
  choice: 迎えに出た
  rationale: 相手のもとへ出向いて会うという方向性を自然な日本語で表す。「会った」だけでは移動の含意が弱い。
- source_word: δὲ
  choice: しかし
  rationale: 迎えに出たマルタと家に座っていたマリアとの穏やかな対照を明示する。
- source_word: ἐν τῷ οἴκῳ
  choice: 家の中に
  rationale: 具体的な場所を表す οἶκος を保ち、「家で」より空間的な対照を明瞭にする。
- source_word: ἐκαθέζετο
  choice: 座っていた
  rationale: 未完了過去が示す継続中の状態を、自然な日本語の「～ていた」で表す。「座ったままだった」ほど意図的な残留を強調しない。
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: マルタ／マリア／イエス
  rationale: 日本語聖書で広く定着している標準的な固有名表記を用いる。
