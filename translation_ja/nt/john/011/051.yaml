  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: ja
  text: 彼はこれを自分から語ったのではない。[a] むしろ、その年の大祭司であった彼は、イエスが民のために[b]死ぬことになる[c]と預言したのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の考えで」または「自分自身から」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「民に代わって」または「民を代表して」。
    reason: alternative_reading
  - marker: c
    text: 別訳「やがて死ぬ」または「死ぬ定めにある」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: しかし、彼はこれを
  rationale: δέの穏やかな接続・対照を「しかし」で示し、τοῦτοを直前のカイアファの発言を指す「これ」とした。
- source_word: ἀφ’ ἑαυτοῦ
  choice: 自分から
  rationale: 発言の源・起点を表し、カイアファ自身から出たものではないという意味を、簡潔で自然な日本語にした。
- source_word: οὐκ εἶπεν
  choice: 語ったのではない
  rationale: λέγωの通常の発話の意味を保ちつつ、この文脈では「言った」よりやや格調のある「語った」を用いた。
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: むしろ、その年の大祭司であった彼は
  rationale: ἀλλάの訂正的対照を「むしろ」で示した。分詞ὢνは、因果関係を日本語本文で必要以上に断定せず、背景となる身分を示す形で訳した。
- source_word: ἐπροφήτευσεν
  choice: 預言した
  rationale: 単なる予測や皮肉に弱めず、本文が明言する預言としての性格を保持した。
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: 死ぬことになる
  rationale: 過去の時点から見た将来の成り行きを自然な日本語で表し、差し迫った直前性や強い宿命性を過度に加えないようにした。
- source_word: ὑπὲρ τοῦ ἔθνους
  choice: 民のために
  rationale: ὑπέρの受益的・代表的な広がりを「ために」で保ち、ἔθνοςは文脈上のユダヤの民を指すため「民」とした。
theological_decisions:
- issue: カイアファの発言が預言であることの意味
  choice: 大祭司であった彼が「預言した」と本文どおり明記する。
  alternative: 神の霊感を自覚して預言した、または単なるヨハネの皮肉だったと解する。
  rationale: 本文は実際にἐπροφήτευσενと言うが、カイアファ本人の自覚、人格的承認、霊感の詳しい仕組みまでは説明していないため、それらを訳文に加えない。
- issue: イエスが民のために死ぬというὑπέρの意味
  choice: 「民のために」と広く訳す。
  alternative: 「民に代わって」または「民を代表して」と限定する。
  rationale: ὑπέρには受益・代表・身代わりに関わる含意があり得るが、この節だけで特定の贖罪理論に狭めず、神学的な重みと幅を保つ。
- issue: 大祭司であることと預言との関係
  choice: 「その年の大祭司であった彼は」と背景的に表現する。
  alternative: 「その年の大祭司だったので」と明示的な因果関係にする。
  rationale: 分詞ὢνは因果的にも理解できるが、形式上は背景・付帯状況としても読めるため、本文ではその余地を残した。
translation_notes:
  register: 現代の一般読者に明快でありながら、叙述の厳粛さを保つ文体とした。「預言」「大祭司」は聖書文脈で定着した語を用い、「民」は文脈上のユダヤ民族共同体を自然に指す。
