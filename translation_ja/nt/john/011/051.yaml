  terminology: 「大祭司」「預言」は適切である。「民」はこの文脈でユダヤの民を指す自然な表現であり、「国民」などに改める必要はない。脚注bの「民に代わって」は本文より限定的だが、代替的解釈として明示されており、本文の意味を変更しない。
