  text: ἀπ’ ἐκείνης οὖν τῆς ἡμέρας ⸀ἐβουλεύσαντο ἵνα ἀποκτείνωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: ja
  text: こうして、その日から彼らはイエスを殺そうと企てた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: その日から
  rationale: ἀπόと属格句が、以後続く動きの起点を示す。日本語では「その日から」で継続の含みを自然に表せる。
- source_word: οὖν
  choice: こうして
  rationale: 直前の最高法院での議論を受けた結果・物語上の帰結を示す接続語として、現代日本語で自然かつ明確である。
- source_word: ἐβουλεύσαντο
  choice: 企てた
  rationale: 文脈上、単なる検討ではなく、殺害を目指す協議と計画を表す。「企てた」は陰謀的な含みと意図の強さを簡潔に伝える。
- source_word: ἵνα ἀποκτείνωσιν
  choice: 殺そうと
  rationale: ἵνα節がβουλεύομαιの目的・内容を示すため、「企てた」に自然につながる意向表現とした。ἀποκτείνωの明白な意味を弱めず「殺す」と訳す。
- source_word: αὐτόν
  choice: イエスを
  rationale: 原文は代名詞だが、日本語では直前の複数主語「彼ら」との対照を明確にし、単独節としても指示対象が分かるよう、文脈上の指示対象であるイエスの名を補った。
theological_decisions:
- issue: 指導者たちのイエスに対する意図の性質
  choice: イエスを殺すための明確な企てとして訳す
  alternative: 殺すことを話し合った／死刑にすることを検討した
  rationale: ギリシア語は単なる話し合いや可能性の検討より踏み込んだ意図を示す。一方、「死刑にする」は司法手続きを明示しかねないため避け、本文の敵対的意図をそのまま保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「こうして」で前段との因果的つながりを示し、「企てた」によって決定的で陰謀的な動きを自然に表現した。
