id: JHN.11.43
reference: John 11:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: ja
  text: こう言ってから[a]、大声で叫んだ。「ラザロ、出て来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「これらのことを言ってから」。
    reason: ταῦτα は文法上複数形だが、直前の発言全体を受けるため、本文では自然な日本語の「こう言って」とした。
lexical_decisions:
- source_word: καὶ ταῦτα εἰπὼν
  choice: こう言ってから
  rationale: 直訳的には「そして、これらのことを言ってから」。ταῦτα の複数性は直前の発言全体を指し、日本語では「こう言って」が自然である。アオリスト分詞 εἰπών は主動詞に先立つ動作を示すため、「言ってから」とした。
- source_word: φωνῇ μεγάλῃ
  choice: 大声で
  rationale: 「大きな声で」という手段・様態を、簡潔で自然な現代日本語にした。
- source_word: ἐκραύγασεν
  choice: 叫んだ
  rationale: κραυγάζω は大きな声を上げることを表す。「大声で」と合わせても原文同様に強調が保たれ、現代日本語として自然である。
- source_word: Λάζαρε
  choice: ラザロ
  rationale: 固有名詞 Λάζαρος の呼格。日本語聖書で広く定着した音写を用いた。
- source_word: δεῦρο ἔξω
  choice: 出て来なさい
  rationale: δεῦρο は命令的に「こちらへ来なさい」、ἔξω は「外へ」を意味する。墓の中から話者のいる所へ出るよう命じる表現として、「出て来なさい」が簡潔で自然である。
theological_decisions:
- issue: 奇跡を起こす命令の表現
  choice: 出て来なさい
  alternative: こちらへ、外に出なさい
  rationale: 命令の力を保ちつつ、δεῦρο ἔξω を不自然な逐語訳や古風な言い回しにせず、明瞭な現代日本語で表した。特定の神学的解釈は付加していない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。ギリシア語では主語が代名詞や固有名詞として明示されていないため、本文でも「イエス」を補わず、日本語で自然に主語を省略した。
