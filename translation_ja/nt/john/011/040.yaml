  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: ja
  text: イエスは彼女に言われた。「信じるなら神の栄光を見ると、わたしがあなたに言ったではありませんか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語上の現在形だが、現代日本語の自然な物語叙述に合わせて過去形とした。イエスへの敬意を示す一般的な聖書文体として尊敬表現を用いた。
- source_word: αὐτῇ
  choice: 彼女に
  rationale: 文脈上マルタを指す与格の間接目的語を、そのまま自然な日本語で表した。
- source_word: Οὐκ εἶπόν σοι
  choice: わたしはあなたに言ったではありませんか
  rationale: 肯定の答えを予期する修辞疑問を保持した。「告げた」よりも平明な「言った」を選び、σοιの個人的な呼びかけも明示した。
- source_word: ἐὰν πιστεύσῃς
  choice: 信じるなら
  rationale: ヨハネ文書におけるπιστεύωとの語彙的つながりを保ち、特定の教理的説明を加えず条件表現として訳した。
- source_word: ὄψῃ
  choice: 見る
  rationale: 日本語では引用内容を受ける「と」の前で非過去形を用いることで、将来の約束を自然に表せる。
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: 神の栄光
  rationale: δόξαの神学的・聖書的な響きと、神の自己顕現への関連を保持する定着した訳語を用いた。
theological_decisions:
- issue: 信じることと神の栄光を見ることとの関係
  choice: マルタに向けられた条件付きの約束として、そのまま訳す。
  alternative: 信仰と奇跡に関する一般原則、またはラザロの復活だけに限定された約束として説明的に訳す。
  rationale: 本文はイエスがマルタに語った直接的な条件文であり、その射程や神学的含意を翻訳で決着させず、本文の緊張と開かれた意味を保つ。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語。「言われた」「ではありませんか」により、自然さと聖書本文としての格調を両立させた。
