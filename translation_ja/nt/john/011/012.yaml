  text: εἶπαν οὖν οἱ μαθηταὶ ⸀αὐτῷ· Κύριε, εἰ κεκοίμηται σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: ja
  text: そこで弟子たちはイエスに言った。「主よ、眠っているのでしたら[a]、回復するでしょう。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は「眠りについた」とも訳せる。イエスはラザロの死を「眠り」と比喩的に語っていたが、弟子たちはそれを普通の睡眠だと理解した。
    reason: lexical_alternative
  - marker: b
    text: 「回復する」と訳したギリシア語は「救われる」とも訳せるが、ここでは病気からよくなることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの発言を受けた弟子たちの推論と応答を、自然な物語の接続として示す。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: 定冠詞付きの既知の集団を指す。日本語では所有表現を補わなくても文脈上明瞭である。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 原文は代名詞だが、日本語で「彼に」とすると指示対象が不自然または曖昧になりうるため、文脈上の指示対象を明示した。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意を込めた呼びかけと、ヨハネ福音書におけるキリスト論的な響きの双方を保つ。
- source_word: εἰ κεκοίμηται
  choice: 眠っているのでしたら
  rationale: 完了形が示す結果状態を自然な日本語で表しつつ、弟子たちが通常の睡眠と理解していることを示す。原語には死を眠りとして表す含みもあるが、この発言では文字どおりの睡眠として受け取られている。
- source_word: σωθήσεται
  choice: 回復するでしょう
  rationale: σῴζωは病気の文脈では健康の回復を意味しうる。ここでは救済論的な「救われる」ではなく、病状がよくなるという弟子たちの推論を表す。
theological_decisions:
- issue: イエスへの呼びかけ κύριε の訳
  choice: 主よ
  alternative: 先生／旦那様
  rationale: 単なる敬称に限定せず、イエスへの敬意と福音書全体のキリスト論的な響きを過度に解消せずに保つ。
- issue: κεκοίμηται における睡眠と死の二重性
  choice: 本文では通常の睡眠として「眠っている」と訳す
  alternative: 眠りに就いている／死んでいる
  rationale: 弟子たちの誤解がこの節の物語上の要点であるため、発言内では通常の睡眠として自然に読める表現を採用する。一方、直前のイエスの比喩では死を指していたことを注で示す。
- issue: σωθήσεται の救済語義と治癒語義
  choice: 回復するでしょう
  alternative: 救われるでしょう／よくなるでしょう
  rationale: 病気と睡眠についての推論という直接の文脈では、身体的回復が意図されている。ただし原語が広く「救う」を意味しうることは注で保持する。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、直接話法には敬意を保った。「眠っているのでしたら」は弟子たちの文字どおりの理解を表し、「回復するでしょう」は病気の文脈に即した慣用的な表現とした。
