  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: ja
  text: すると、家でマリアと一緒にいて、彼女を慰めていたユダヤ人たち[a]は、マリアが急いで立ち上がって出て行ったのを見て、彼女の後について行った。彼女がそこで泣くために墓へ行くのだと思ったのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人々」。ヨハネ福音書で「ユダヤ人たち」と訳される語は、文脈によってユダヤ地方の人々やユダヤ人指導者層を指すことがある。ここでは、マリアと共にいて彼女を慰めていた人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: すると、ユダヤ人たち
  rationale: οὖνは物語の展開を自然につなぐ「すると」とした。Ἰουδαῖοιはここではマリアと共に喪に服していた人々を指すため、本文では直接的に「ユダヤ人たち」とし、地域的な理解の可能性は脚注に残した。
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν
  choice: 家でマリアと一緒にいて彼女を慰めていた
  rationale: 分詞句がどのユダヤ人たちかを限定している構造を保った。παραμυθέομαιは弔いの文脈に合う自然な「慰める」とした。
- source_word: ἰδόντες τὴν Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: マリアが急いで立ち上がって出て行くのを見ると
  rationale: ἰδόντεςを時を表す「見ると」とし、ταχέωςを「急いで」で表した。ἀνέστηはここでは復活ではなく、座った状態から立つ動作である。
- source_word: ἠκολούθησαν αὐτῇ
  choice: 彼女の後について行った
  rationale: この箇所のἀκολουθέωは弟子として従う意味を要求せず、物理的に後を追うことを表す。
- source_word: δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον
  choice: 彼女が墓へ…行くのだと思った
  rationale: δόξαντεςは彼らの推測を表すため「思った」とした。μνημεῖονはラザロが葬られた場所を指すので「墓」とした。
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: 泣きに
  rationale: ἵναと接続法の目的を、移動表現に自然につながる「泣きに」で簡潔に示した。「そこで」の意味は直前の「墓へ」と日本語の文脈に含まれる。
theological_decisions:
- issue: ヨハネ福音書におけるἸουδαῖοιの指示範囲
  choice: 本文では「ユダヤ人たち」とし、この場面でマリアを慰めていた一団を指すものとして訳した。
  alternative: 「ユダヤ地方の人々」
  rationale: Ἰουδαῖοιはヨハネ福音書で文脈により、ユダヤ人一般、ユダヤ地方の人々、あるいは指導者層を指し得る。この節では家でマリアと共にいた弔問者たちが明示的な指示対象であり、敵対的集団や民族全体を意味するとは限らない。語の幅は脚注で保持した。
translation_notes:
  register: 明快な現代標準語を用い、弔いの場面にふさわしい落ち着いた叙述調とした。「泣きに行く」は自然な口語性を持つが、文全体の「のである」により聖書本文としての品位を保っている。
