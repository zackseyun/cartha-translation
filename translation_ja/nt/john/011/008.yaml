  terminology: 「ラビ」と「石打ち」は適切である。οἱ Ἰουδαῖοιを本文で「ユダヤ人たち」とし、脚注で「ユダヤ地方の人々」および文脈的に「ユダヤ人の指導者たち」の可能性を示す方針は、語義とヨハネ文書内の文脈の双方を損なわない。脚注は、それがユダヤ人全体への一般化ではないことを明確にしている。
