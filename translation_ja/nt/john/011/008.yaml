id: JHN.11.8
reference: John 11:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: ja
  text: 弟子たちはイエスに言った。[a]「ラビ、今しがたユダヤ人たちがあなたを石打ちにしようとしていたのに、またそこへ行かれるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」とも訳せる。また文脈上は「ユダヤ人の指導者たち」を指す可能性もある。ヨハネ福音書の「ユダヤ人たち」は、ユダヤ人全体ではなく、ユダヤ地方にいたイエスの反対者を指すことが多い。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: 言った
  rationale: ギリシア語の歴史的現在。現代日本語の物語として自然な過去形で表した。
- source_word: Ῥαββί
  choice: ラビ
  rationale: セム語由来の呼びかけを音写したギリシア語の形を保ち、単に「先生」と一般化しない。
- source_word: νῦν
  choice: つい先ほども
  rationale: 現在時点そのものより、直近に起きた企てを指す文脈的な意味を自然な日本語で示す。「も」は、直前の危険と再訪との対照を補助する。
- source_word: ἐζήτουν
  choice: しようとしていた
  rationale: 未完了過去が示す、過去に継続していた企て・試みを日本語で自然に表す。
- source_word: λιθάσαι
  choice: 石打ちにする
  rationale: 原文の動作を直接表し、明示されていない「殺す」を本文に加えない。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 語の基本的な意味を本文に保つ。ただしヨハネ福音書では、文脈上ユダヤ地方の反対者や指導者層を指す場合があるため、脚注で範囲を明示する。
- source_word: πάλιν
  choice: また
  rationale: 反復を示す標準的で自然な訳。
- source_word: ὑπάγεις
  choice: 行かれるのですか
  rationale: ここでは直前に言及された場所へ行くことを表す。弟子からイエスへの発話として自然な敬語を用いた。
- source_word: ἐκεῖ
  choice: そこへ
  rationale: 危険のあったユダヤ地方を指す場所の副詞を自然に表す。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示範囲
  choice: 本文は「ユダヤ人たち」
  alternative: 「ユダヤ地方の人々」または、文脈上「ユダヤ人の指導者たち」
  rationale: 原語の基本義を本文に残しつつ、ユダヤ民族全体を一括して指すとは限らず、ユダヤ地方のイエスの反対者を指し得るというヨハネ特有の文脈を脚注で保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。弟子たちの驚きと懸念が伝わる疑問文とし、イエスへの呼びかけには自然な敬語を用いた。
