id: JHN.11.42
reference: John 11:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: ja
  text: しかし、あなたがいつもわたしの願いを聞いてくださることを、わたしは知っていました。周りに立っている群衆がいるので、わたしはこう言いました。あなたが[a]わたしを遣わされたのだと、彼らが信じるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたが」に当たる語は原文で明示され、強調されています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδειν
  choice: 知っていました
  rationale: οἶδαの過去として、祈りに先立つ継続的な認識を自然な現代日本語で表す。過去完了の意味を不必要に固定しない。
- source_word: πάντοτέ μου ἀκούεις
  choice: いつもわたしの願いを聞いてくださる
  rationale: 祈りの文脈におけるἀκούω＋属格の受容的な『聞く』を表す。日本語では単に『わたしを聞く』が不自然なため、『願い』を文脈上補い、敬意を示す補助動詞を用いた。
- source_word: ἀλλὰ
  choice: それでも
  rationale: 父が常に聞くという認識と、群衆のために声に出して語ったこととの対照を明確にする。
- source_word: διὰ τὸν ὄχλον
  choice: 群衆のため
  rationale: διά＋対格は理由・原因を表し得るが、後続の目的節に照らすと、群衆の益を意図する含みも自然に保てる。
- source_word: τὸν περιεστῶτα
  choice: 周りに立っている
  rationale: 完了分詞が示す、その場で周囲を取り囲むように立っている状態を簡潔に表す。
- source_word: εἶπον
  choice: こう言った
  rationale: 直前に口にした祈りを指すことが日本語で明確になる最小限の指示表現。
- source_word: ἵνα πιστεύσωσιν
  choice: 彼らが信じるため
  rationale: ἵνα＋接続法の目的を自然かつ明確に表す。
- source_word: ὅτι σύ με ἀπέστειλας
  choice: あなたがわたしを遣わされたのだと
  rationale: 明示されたσύの強調を主語『あなたが』と説明の『のだ』で伝え、ヨハネに特徴的な派遣の語彙を『遣わす』で保持する。
theological_decisions:
- issue: 父がイエスの願いを常に聞くという発言の意味
  choice: 父がいつもイエスの願いを聞いてくださることをイエスは知っており、群衆のために公に語ったと訳す。
  alternative: 一般的な祈りの応答についての教えとして前面に出す。
  rationale: 直接の文脈はラザロを生き返らせる前のイエスの祈りである。父と子の親密な関係と公に語る目的を保ちつつ、本文を越えた教理的説明は加えない。
- issue: 公に語った祈りの目的
  choice: 群衆が、父こそイエスを遣わした方だと信じるためとする。
  alternative: この奇跡だけの正当性を証明する目的に限定する。
  rationale: 目的節は明示的に『あなたがわたしを遣わされた』ことへの信仰を述べるため、その範囲を狭めも広げもしない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。祈りの相手である父への語りかけには『聞いてくださる』『遣わされた』を用いた。長い一文を三文に分け、論理関係を明確にした。
