  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Ἴδε πῶς ἐφίλει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: ja
  text: そこで、ユダヤ人たちは言っていた[a]。「見なさい、彼をどれほど愛していたことか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、この場にいた人々を地域的に限定して指す表現と取るなら、「ユダヤ地方の人々」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的・反復的な側面を自然な日本語で表す。
- source_word: οὖν
  choice: そこで
  rationale: 前節でイエスが涙を流したことを受けた、推論を伴う物語上のつながりを示す。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: ヨハネ福音書の標準的な表現に沿いつつ、複数の居合わせた人々を指すことを示す。この場面では、その場にいたユダヤ人の弔問客・目撃者が直接の指示対象である。
- source_word: Ἴδε
  choice: ご覧なさい
  rationale: 注意を促す命令を、引用文にふさわしい自然で品位ある表現にする。
- source_word: πῶς
  choice: どれほど
  rationale: ここでは涙を見て愛情の深さに感嘆しているため、程度を表す自然な日本語とした。
- source_word: ἐφίλει
  choice: 愛していた
  rationale: 個人的な親愛を表すφιλέωを直接的かつ自然に訳し、未完了過去の側面も日本語の「ていた」で保持する。
- source_word: αὐτόν
  choice: 彼を
  rationale: 男性単数の代名詞で、ラザロを指す。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の訳し方
  choice: ユダヤ人たち
  alternative: ユダヤ地方の人々
  rationale: 本文の語義を透明に保つ一方、この節で特定の民族全体を抽象的に非難しているのではなく、その場に居合わせた人々を指すことが文脈から明らかである。地域的な意味に限定する解釈は脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話には自然さと品位を持たせた。「どれほど……ことか」で、目撃者たちの感嘆を表している。
