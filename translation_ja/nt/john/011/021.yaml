  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: ja
  text: そこでマルタはイエスに言った。「主よ[a]、もしここにいてくださったなら、私の兄弟は死ななかったでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「先生」「あなた様」とも訳せる。ギリシア語の「キュリエ」は敬意を表す呼びかけとしても用いられるが、ここでは「主」が持ち得る神学的な響きも残した。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の物語を受けた展開・帰結を自然な現代日本語で示す。
- source_word: εἶπεν … πρὸς τὸν Ἰησοῦν
  choice: イエスに言った
  rationale: 発話の相手を表す πρός と標準的な発話動詞 λέγω を、簡潔で自然な日本語にした。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけと、ヨハネ福音書における神学的含意の可能性をともに保つ。
- source_word: εἰ ἦς ὧδε
  choice: もしここにいてくださったなら
  rationale: 過去の事実に反する条件を「なら」で表し、イエスへの敬意を自然な補助動詞で示した。
- source_word: οὐκ ἂν ἀπέθανεν
  choice: 死ななかったでしょう
  rationale: ἄν を伴うアオリスト直説法が示す、実現しなかった過去の結果を自然に表す。
- source_word: ὁ ἀδελφός μου
  choice: 私の兄弟
  rationale: 文脈上は実の男性きょうだいラザロを指すため、「私の兄弟」とした。
theological_decisions:
- issue: マルタがイエスを Κύριε と呼ぶ表現
  choice: 主よ
  alternative: 先生／あなた様
  rationale: 単なる敬称とも神学的称号とも取り得る幅を残すため、本文では「主よ」とし、敬称としての可能性を脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。マルタからイエスへの敬意を表しつつ、反実仮想の嘆きが自然に伝わる語順とした。
