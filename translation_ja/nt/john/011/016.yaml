source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: ja
  text: そこで、ディディモ[a]と呼ばれるトマスは、仲間の弟子たちに言った。「私たちも行って、あの方と一緒に死のう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語「ディディモ」は「双子」の意。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた物語上・論理上の展開を、自然な現代日本語で示す。
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: 「双子」という意味のディディモと呼ばれるトマス
  rationale: Θωμᾶςは慣用的に「トマス」とし、ギリシア語の呼び名Δίδυμοςは「ディディモ」と音写しつつ、その意味「双子」も本文内で明らかにする。
- source_word: τοῖς συμμαθηταῖς
  choice: 仲間の弟子たちに
  rationale: 同じ師に従う者たちを指すため、「仲間の弟子たち」が文脈に即して自然である。
- source_word: Ἄγωμεν καὶ ἡμεῖς
  choice: 私たちも行って
  rationale: 勧奨の接続法を日本語の意志・勧誘表現で表し、καὶ ἡμεῖςの包含と強調を「私たちも」に保つ。
- source_word: ἵνα ἀποθάνωμεν μετ’ αὐτοῦ
  choice: 先生と一緒に死のう
  rationale: ἵνα節の意図・帰結を、日本語では前件と結んだ勧誘表現として自然に表す。αὐτοῦの指示対象は文脈上イエスであり、「先生」は弟子たちの発話として明瞭にするための文脈的補足である。
theological_decisions:
- issue: トマスの発言の調子と意図
  choice: 勇気、諦念、皮肉のいずれとも断定せず、簡潔な勧誘として訳す。
  alternative: 「覚悟して」「どうせ」などを加え、忠誠心または悲観を明示する。
  rationale: ギリシア語本文はトマスの心理や声調を明示していないため、その曖昧さを保つ。
- issue: μετ’ αὐτοῦの指示対象
  choice: 文脈上のイエスを、弟子の発話に自然な「先生」で示す。
  alternative: 代名詞のまま「彼と一緒に」とする、または固有名で「イエスと一緒に」とする。
  rationale: 日本語の直接話法で「彼」は不自然になりやすく、「先生」は関係性を示しながら指示対象を明瞭にする。ただし原文自体は単に「彼と共に」である。
translation_notes:
  register: 明快で現代的かつ品位ある語調。発言は簡潔に保ち、トマスの勇敢さ、悲観、皮肉のいずれも訳文に付加しない。
