  to: そこで、ディディモ[a]と呼ばれるトマスは、仲間の弟子たちに言った。「私たちも行って、あの方と一緒に死のう。」
  rationale: 原文の呼称「Δίδυμος」と「呼ばれる」の構造を本文で保ち、その語義を脚注で明示しました。さらに、「先生」という原文にない呼称を、文脈上イエスを指す代名詞的表現「あの方」に改めました。トマスの発言の勇敢さ、諦念、皮肉のいずれかを示す語は加えていません。
