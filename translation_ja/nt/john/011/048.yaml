id: JHN.11.48
reference: John 11:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: ja
  text: このまま彼を放っておけば、皆が彼を信じるだろう。そうすれば、ローマ人がやって来て、私たちの場所[a]も国[b]も奪い取ってしまうだろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」とも取れる。ギリシア語は「場所」であり、神殿を指す場合のほか、彼らの立場や地位を指す可能性もある。
    reason: alternative_reading
  - marker: b
    text: 別訳「民」または「民族」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν ἀφῶμεν αὐτὸν οὕτως
  choice: このまま彼を放っておけば
  rationale: ἀφίημιの許容・放任の意味と、οὕτωςが示す現状の継続を、自然な現代日本語で表した。
- source_word: πάντες
  choice: 皆が
  rationale: 文脈上の包括的な意味を簡潔に表す。
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: 彼を信じるようになる
  rationale: ヨハネ文書で特徴的なπιστεύω εἰς＋対格を「彼を信じる」と訳し、未来形は文脈に即して変化の帰結を表す「ようになる」とした。
- source_word: ἐλεύσονται οἱ Ῥωμαῖοι
  choice: ローマ人がやって来て
  rationale: 未来形の「来る」を自然に表し、後続する結果と接続した。
- source_word: ἀροῦσιν
  choice: 奪い去る
  rationale: αἴρωの「取り去る」という語義を保ちつつ、敵対勢力による剝奪という文脈を自然な日本語で示す。「滅ぼす」ほど意味を限定しない。
- source_word: τόπον
  choice: 場所
  rationale: 神殿、領地、地位などの可能性を一つに限定せず、原文の曖昧さを保持した。
- source_word: ἔθνος
  choice: 国民
  rationale: 政治的共同体と民そのものの双方を指し得るἔθνοςを、ここでは「国民」とした。「国」より人々への指示を残し、「民族」は民族的側面に限定しやすいため避けた。
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: 私たちの場所も国民も
  rationale: ἡμῶνが二つの目的語にかかることと、反復されたκαίの相関を、日本語の「も……も」で表した。
theological_decisions:
- issue: τόποςが何を指すか
  choice: 本文では「場所」とし、特定しない
  alternative: 神殿、領地、または指導者たちの地位
  rationale: 文脈上は神殿を指す可能性が高いが、語そのものはより広く、指導層の地位を含む可能性もあるため、本文で解釈を固定しない。
- issue: ἔθνοςの指示内容
  choice: 国民
  alternative: 民、民族、国
  rationale: ローマによる政治的介入への恐れと、ユダヤの民への指示をともに伝えられる語を選び、別訳を脚注に示した。
translation_notes:
  register: 明快で自然な現代標準日本語を用いながら、議会での危機感ある発言にふさわしい引き締まった調子と、τόποςおよびἔθνοςの意味の幅を保った。
