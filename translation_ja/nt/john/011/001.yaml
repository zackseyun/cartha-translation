  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: ja
  text: マリアとその姉妹マルタの村であるベタニア出身のラザロという人が、病気であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ τις ἀσθενῶν
  choice: 病気の人がいた
  rationale: Ἦνと現在分詞ἀσθενῶνから成る迂言的な表現を、自然な現代日本語で「病気の人がいた」とした。τιςの不特定だが具体的な人物という含みは「人」で保ち、続く固有名によって特定される構造を維持した。δέは弱い物語接続であり、日本語では文脈上明示しなくても自然に展開が伝わるため、接続語を補わなかった。
- source_word: Λάζαρος
  choice: ラザロ
  rationale: 日本語聖書で一般的な音写を用いた。
- source_word: ἀπὸ Βηθανίας
  choice: ベタニアに／ベタニアは
  rationale: ἀπόはラザロの出身・所属地を示す。日本語では後続の同格句と合わせ、ラザロがベタニアにいたことと、その村の説明を二文に分けて明確にした。
- source_word: ἐκ τῆς κώμης
  choice: 村
  rationale: κώμηは都市より小さい集落を指すため、「町」ではなく「村」とした。ἐκはここではベタニアをさらに説明する同格的な句に含まれる。
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: マリアとその姉妹マルタ
  rationale: τῆς ἀδελφῆς αὐτῆςは直前のマルタをマリアの姉妹として説明する。「姉」か「妹」かは原文から決められないため、中立的な「姉妹」とした。
theological_decisions:
- issue: マルタとマリアの年長・年少関係
  choice: その姉妹マルタ
  alternative: その姉マルタ／その妹マルタ
  rationale: ἀδελφήは女性のきょうだいを表すが、年長か年少かを特定しない。原文の曖昧さを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、叙事文としての落ち着きを保った。「姉妹」はやや文語的にも見えるが、年長・年少を決めずにἀδελφήを表せる標準的な語として採用した。
