id: JHN.11.28
reference: John 11:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: ja
  text: こう言うと、マルタは立ち去り、自分の姉妹であるマリアをひそかに[a]呼んで言った。「先生がここにおられ、あなたをお呼びです[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「人に聞かれないように」。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「あなたを呼んでおられます」。ここでは、来るよう求めていることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: こう言うと
  rationale: アオリスト分詞が示す先行動作を、物語の自然な流れを保つ現代日本語で表した。
- source_word: ἀπῆλθεν
  choice: 立ち去り
  rationale: その場から離れたことを簡潔に示し、後続の行動へ自然につなげる。
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  choice: 姉妹のマリアを……呼んで
  rationale: φωνέωの「呼ぶ、呼び寄せる」という意味と、マリアが彼女の姉妹であるという同格的説明を自然に表した。
- source_word: λάθρᾳ
  choice: ひそかに
  rationale: 周囲の人々に聞かれないよう、表立たずに伝えたという幅を保つ。「こっそり」よりも口語的すぎず、欺瞞の含意も強めない。
- source_word: Ὁ διδάσκαλος
  choice: 先生
  rationale: διδάσκαλοςの通常の語義を保ち、イエスに対する敬意ある呼称として自然な日本語にした。
- source_word: πάρεστιν
  choice: ここにおられ
  rationale: 「その場にいる、来ている」という現在の臨在を表す。敬意ある直接話法として「おられる」を用いた。
- source_word: φωνεῖ σε
  choice: あなたをお呼びです
  rationale: 現在形の動作と、単に名を呼ぶのでなく来るよう求めている文脈上の意味を、簡潔で自然な敬語表現にした。
theological_decisions:
- issue: イエスへの呼称 διδάσκαλος
  choice: 先生
  alternative: 師、主（あるじ）
  rationale: 語の基本義は「教える者、先生」であり、ここで権威や主権に関する意味を加える必要はないため、神学的に過剰な訳語を避けた。
- issue: λάθρᾳが示す行為の性格
  choice: ひそかに
  alternative: 人に聞かれないように、内々に
  rationale: 周囲の会葬者を意識した私的な伝達と考えられるが、本文はその動機を明示しない。恐れや欺瞞を訳文に持ち込まず、 discreet な行為という曖昧さを残した。
- issue: φωνεῖ σεの現在形と意味
  choice: あなたをお呼びです
  alternative: あなたを呼んでおられます、あなたに来るよう求めておられます
  rationale: 現在形の継続性を保ちつつ、イエスがマリアの臨席を求めている含意を自然に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、直接話法ではイエスへの自然な敬意を示した。「ひそかに」は文語に寄りすぎない範囲で品位を保ち、本文が明示しない動機は補わなかった。
