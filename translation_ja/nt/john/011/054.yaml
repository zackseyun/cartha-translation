id: JHN.11.54
reference: John 11:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: ja
  text: そこでイエスは、もはやユダヤ人たち[a]の間を公然と歩き回らず、そこを去って、荒野に近い地方にあるエフライムと呼ばれる町へ行き、弟子たちとともにそこに滞在した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人々」。ヨハネ福音書で「ユダヤ人」と訳される語は、文脈により、特にユダヤ地方の人々やユダヤ人の指導者たちを指すことがある。
    reason: 原語Ἰουδαῖοιが持つ地域的・社会的な指示範囲の曖昧さを保持するため。
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前に述べられたイエス殺害の企てを受けた結果・展開を、自然な物語の接続として示す。
- source_word: οὐκέτι
  choice: もはや～ず
  rationale: それまでの行動が以後は続かなかったという時間的な停止を表す。
- source_word: παρρησίᾳ
  choice: 公然と
  rationale: ここでは内面的な大胆さより、人目を避けない公の行動を指す。
- source_word: περιεπάτει
  choice: 歩き回らず
  rationale: 未完了過去が表す継続的・反復的な移動を保ちつつ、現代日本語として理解できる形にした。
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: ユダヤ人たちの間を
  rationale: Ἰουδαῖοιの基本的な呼称を本文に保つ一方、ヨハネ福音書であり得る地域的な意味は脚注に示した。日本語では移動を表す「歩き回る」に合わせて「間を」とした。
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: そこを去って
  rationale: 直前の場所から離れたという物語上の移動を簡潔に表す。
- source_word: χώραν ἐγγὺς τῆς ἐρήμου
  choice: 荒野に近い地方
  rationale: χώραを現代的な国家ではなく地域として、ἔρημοςを人里離れた荒涼地として訳した。
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: エフライムと呼ばれる町へ
  rationale: πόλιςは規模の大きな都市に限定されないため「町」とし、分詞λεγομένηνを自然に「呼ばれる」とした。
- source_word: κἀκεῖ ἔμεινεν
  choice: そこに滞在した
  rationale: 旅程の文脈におけるμένωの意味を、明瞭で自然な日本語で表した。
- source_word: μετὰ τῶν μαθητῶν
  choice: 弟子たちとともに
  rationale: 原文に明示されていない所有語を補わず、定冠詞を文脈上特定された弟子たちとして表した。
theological_decisions:
- issue: ヨハネ福音書におけるἸουδαῖοιの指示対象
  choice: ユダヤ人たち
  alternative: ユダヤ地方の人々（ユダヤ人）
  rationale: この語は文脈により民族、地域住民、または宗教指導層を指し得る。本節はイエスの公の移動を述べており、全ユダヤ人への神学的断定と限定すべきではないため、本文では一般的な訳を用い、地域的な可能性を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔でありながら dignified な調子を保った。「公然と歩き回る」で原文の移動の比喩と公的な可視性を残し、エフライムの町と地方の同格関係は日本語として自然な「地方にある…町」で表した。
