base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: ja
  text: 祭司長たちとファリサイ派の人々は、イエスがどこにいるかを知っている者がいれば、そのことを届け出るよう命令を出していた。彼らがイエスを捕らえるためであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδώκεισαν
  choice: 命令を出していた
  rationale: 過去完了形が示す、物語の時点に先立って出され、なお効力を持つ命令を、自然な日本語で表した。
- source_word: δὲ
  choice: 訳文では明示しない
  rationale: ここでは強い対立ではなく物語の展開を示す軽い接続であり、日本語では無理に接続語を置かないほうが自然である。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 当時の指導的な祭司権威者たちを指す定着した訳語であり、複数の現職大祭司を意味するとの誤解を避ける。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 宗派名を現代日本語で分かりやすく示す。
- source_word: ἐντολὰς
  choice: 命令
  rationale: 宗教指導者たちが出した権威ある指示という行政的・公的な文脈を表す。
- source_word: ἵνα ἐάν τις γνῷ
  choice: 知っている者がいれば
  rationale: 命令内容に含まれる一般的な条件を、簡潔で自然な日本語にした。
- source_word: ποῦ ἐστιν
  choice: どこにいるか
  rationale: ギリシア語の現在形を保ちつつ、日本語の間接疑問としても自然に読める。文脈上、主語がイエスであることを明示した。
- source_word: μηνύσῃ
  choice: 届け出るよう
  rationale: 権威者に所在情報を通報するという公的な含みを自然に表す。
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: それは、イエスを捕らえるためであった
  rationale: 目的を明確に示し、πιάζωの『捕らえる、拘束する』という幅を保った。日本語で指示対象が曖昧にならないよう固有名を補った。
