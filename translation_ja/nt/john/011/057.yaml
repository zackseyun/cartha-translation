  source_fidelity: 全体として原文に忠実である。δεδώκεισανの過去完了は「命令を出していた」によく表され、条件節、現在形の「どこにいるか」、および捕縛という目的も保持されている。ただし、二文目の「それは、イエスを捕らえるためであった」は、πιάσωσινの行為者が原文の祭司長たちとファリサイ派の人々であることを日本語ではやや曖昧にし、また「届け出る」の内容も補うと原文のμηνύσῃをより明瞭に反映できる。
