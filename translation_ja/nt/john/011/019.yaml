  text: ⸂πολλοὶ δὲ⸃ ἐκ τῶν Ἰουδαίων ἐληλύθεισαν πρὸς ⸀τὴν Μάρθαν καὶ ⸀Μαριὰμ ἵνα παραμυθήσωνται αὐτὰς περὶ τοῦ ⸀ἀδελφοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: ja
  text: ユダヤ人[a]のうち多くの人が、マルタとマリアのところへ、二人を兄弟のことで慰めるために、来ていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人々」。ギリシア語の語は、一般にユダヤ人を指すことも、ヨハネ福音書の一部の文脈では、より限定してユダヤ地方の人々を指すこともある。
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ ἐκ τῶν Ἰουδαίων
  choice: ユダヤ人のうち大勢が
  rationale: πολλοίと部分を表すἐκを自然な日本語で示した。δέは弱い接続辞であり、この一節だけでは明示的に訳さなくても叙述の連続性が保たれる。Ἰουδαῖοιはここでは弔問に来た人々を指し、広い意味の「ユダヤ人」が文脈に適するが、「ユダヤ地方の人々」の可能性は脚注に残した。
- source_word: ἐληλύθεισαν
  choice: 来ていた
  rationale: ἔρχομαιの過去完了で、物語の基準時より前にすでに来ていたことを表す。
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: マルタとマリア……二人のもとに
  rationale: πρός＋対格の、人を訪ねてそのもとへ来る意味を自然な日本語にした。人名は日本語聖書で一般的な表記を用いた。
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: 二人を慰めるために
  rationale: ἵνα＋接続法の目的を示し、παραμυθέομαιの、悲しむ者を慰める意味を明瞭に表した。本文では「兄弟を亡くした」と組み合わせて自然な日本語にした。
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: 兄弟を亡くした
  rationale: 直訳は「その兄弟のことで」だが、死別に際して慰めるという文脈上の関係を日本語として自然に示す。単数の定冠詞付きἀδελφόςは、二人に共通する兄弟ラザロを指す。
theological_decisions:
- issue: ヨハネ文書におけるἸουδαίωνの訳語
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: この箇所は敵対者や指導者を特定する論争的文脈ではなく、マルタとマリアへの弔問客を描くため、広い民族・宗教的意味の「ユダヤ人」が最も自然である。ただし、ヨハネにおける地域的用法の可能性は脚注で保持した。
translation_notes:
  register: 明快で現代的かつ品位ある標準日本語。「兄弟を亡くした……慰める」により喪の文脈を自然に表しつつ、原文の目的関係と過去完了の時間関係を保った。脚注記号[a]は本文中に配置した。
