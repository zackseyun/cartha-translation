  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: ja
  text: そこで、イエスが到着したとき、ラザロが墓に入ってからすでに四日たっていることを知った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: イエスが到着すると
  rationale: アオリスト分詞を主動詞に先立つ時を示す表現として自然な日本語にした。「到着する」は文脈上の移動の完了を明確に表す。
- source_word: οὖν
  choice: そこで
  rationale: ここでは強い論理的帰結というより、前節までを受けて物語を進める接続語であるため、「そこで」とした。
- source_word: εὗρεν
  choice: ことが分かった
  rationale: この文脈の εὑρίσκω は、捜して発見したというより、到着して事情を知ったことを表す。「分かった」が自然で、意味を過度に具体化しない。
- source_word: αὐτὸν
  choice: ラザロは
  rationale: 代名詞の指示対象は直前の文脈からラザロと明白である。日本語で曖昧さを避けるため固有名を明示した。
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: すでに……四日たっている
  rationale: 直訳的には「すでに四日を有している」だが、埋葬後の経過期間を示す慣用的構文であるため、自然な日本語で期間を表した。ἤδη は「すでに」で保持した。
- source_word: μνημείῳ
  choice: 墓
  rationale: ここでは遺体を納める埋葬所を指す。現代日本語で簡潔かつ適切な「墓」を選んだ。
theological_decisions:
- issue: αὐτόν の指示対象の明示
  choice: 「ラザロ」と明示する
  alternative: 代名詞的に「彼」とする
  rationale: ギリシア語では文脈上ラザロを指すことが明白であり、固有名の明示は意味を追加せず、日本語での指示の曖昧さを避ける。
- issue: 四日の起算点
  choice: 「墓に入れられて四日たっている」とする
  alternative: 「墓に四日いた」とする
  rationale: 原文は墓にある状態の継続期間を述べ、厳密な死亡時刻そのものは明記しない。「墓に入れられて」とすることで埋葬後の経過期間として表し、死後四日と断定する以上の情報を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として自然でありながら格調を保った。「そこで」で前文との流れを示し、原文の簡潔さを維持した。
