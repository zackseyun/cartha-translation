  text: Ἰησοῦς οὖν πάλιν ἐμβριμώμενος ἐν ἑαυτῷ ἔρχεται εἰς τὸ μνημεῖον· ἦν δὲ σπήλαιον, καὶ λίθος ἐπέκειτο ἐπ’ αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: ja
  text: そこでイエスは、再び、心の内で深く心を動かされて[a]、墓に来た。墓は洞窟であり、その入口には石が置かれていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心の内で憤りを覚えながら」または「心の内でひどく動揺しながら」とも訳せる。ギリシア語の動詞は非常に強く、悲しみだけでなく憤りを含む可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の場面を受けた物語の進展とゆるやかな帰結を、自然な現代日本語で示す。
- source_word: πάλιν
  choice: 再び
  rationale: 直前にも描かれたイエスの強い感情の動きが繰り返されたことを明確にする。
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: 心の内で激しく揺さぶられながら
  rationale: 動詞の強い感情的ニュアンスを保ちつつ、それが悲しみか憤りかを本文で一方に限定しない。ἐν ἑαυτῷは「心の内で」とした。
- source_word: ἔρχεται
  choice: 来た
  rationale: ギリシア語では歴史的現在だが、日本語の物語として自然な過去形で表した。
- source_word: μνημεῖον
  choice: 墓
  rationale: 遺体を納める埋葬所を指し、続く洞窟と石の描写にも合う簡潔な語である。
- source_word: σπήλαιον
  choice: 洞窟
  rationale: 原語が示す洞穴式の墓の形状を直接表す。
- source_word: λίθος
  choice: 石
  rationale: 墓の開口部を塞ぐために置かれた石を指す標準的な訳語である。
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: その入り口には石が置かれていた
  rationale: 字義上は石がそれに接して置かれていたことを表す。洞窟墓という文脈から、塞がれていた場所を「入り口」と明示して自然な日本語にしたが、石の形状や置き方は限定していない。
theological_decisions:
- issue: イエスについて用いられたἐμβριμώμενοςの感情的な強さ
  choice: 強く心を動かされたことを示しながら、感情の種類は本文で限定しない
  alternative: 「心の内で憤りながら」または「心の内でひどく取り乱しながら」
  rationale: ἐμβριμάομαιは強い心の動き、時には憤りを含み得る。本文では悲しみだけとも憤りだけとも断定せず、原文の解釈上の緊張を保ち、より限定的な可能性は脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔で品位ある物語調とした。イエスへの敬語は原文にない要素を加えないため用いず、感情表現は強さと曖昧さの双方を保った。
