source:
  edition: SBLGNT
  text: ἦν δὲ ⸀Μαριὰμ ἡ ἀλείψασα τὸν κύριον μύρῳ καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ ταῖς θριξὶν αὐτῆς, ἧς ὁ ἀδελφὸς Λάζαρος ἠσθένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/002.yaml
  text: It was Mary who had anointed the Lord with perfume and wiped his feet with her hair[a], whose brother Lazarus was sick.
translation:
  language: ja
  text: このマリアは、主に香油を塗り、その足を自分の髪でぬぐった[a]人で、病気であったラザロの姉妹であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「香油」は、香りのある油または軟膏状の香料を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ Μαριὰμ ἡ ἀλείψασα
  choice: このマリアは、…香油を塗り…人であった
  rationale: 冠詞付き分詞がマリアを説明している構造を、自然な日本語の「このマリアは…人であった」で表した。δὲは文脈上の緩やかな接続であり、独立した接続語を加えなくても日本語で流れが保たれる。
- source_word: τὸν κύριον
  choice: 主に
  rationale: イエスに対する称号としてのκύριοςの物語的・神学的重みを保つ。
- source_word: μύρῳ
  choice: 香油を
  rationale: 香りのある油または軟膏状の香料を指す語であり、この場面では現代日本語として明快な「香油」が適切である。
- source_word: καὶ ἐκμάξασα τοὺς πόδας αὐτοῦ
  choice: その足を…ぬぐった
  rationale: ἐκμάσσωの、拭う・拭き取るという動作を自然に表す。「その」は直前の「主」を受ける。
- source_word: ταῖς θριξὶν αὐτῆς
  choice: 自分の髪で
  rationale: 道具を示す与格を「で」とし、主語であるマリア自身の髪であることを明確にした。
- source_word: ἧς ὁ ἀδελφὸς Λάζαρος
  choice: ラザロの姉妹
  rationale: 原文は直訳すれば「その女の兄弟ラザロ」であるが、日本語ではマリアを主題として「ラザロの姉妹」とするのが簡潔で自然。ἀδελφόςはこの箇所だけでは兄か弟かを特定しないため、「姉」「妹」と限定しない。
- source_word: ἠσθένει
  choice: 病気になっていた
  rationale: 未完了過去形が示す、その時点で続いていた病状を自然な日本語で表した。
theological_decisions:
- issue: イエスに対するκύριοςの訳語
  choice: 主
  alternative: 主人
  rationale: 単なる社会的な主人という意味に狭めず、ヨハネ福音書における敬称・称号としての含みを保持する。
- issue: マリアによる塗油の時間関係
  choice: 塗り、その足を…ぬぐった人
  alternative: 以前、塗り、その足を…ぬぐった人
  rationale: ギリシア語のアオリスト分詞はマリアを既知の行為で特定するが、「以前」を明示して時間関係を過度に固定しない。物語上、その出来事は12章で詳述されるため、原文の叙述上の緊張を保つ。
translation_notes:
  register: 明快で現代的ながら、聖書本文としての品位を保つ。「ぬぐった」は「拭いた」よりやや格調があり、動作も明確。「姉妹」は年長・年少を特定しない語として用いた。
