source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων, οἱ ἐλθόντες πρὸς τὴν ⸀Μαριὰμ καὶ θεασάμενοι ⸀ἃ ⸀ἐποίησεν, ἐπίστευσαν εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/045.yaml
  text: Therefore many of the Jews who had come to Mary and had seen what he had done believed in him[a].
translation:
  language: ja
  text: そこで、マリアのもとに来ていたユダヤ人たちの多くは、イエスがなさったことを見て、イエスを信じた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人の中から」とも訳せる。ヨハネ福音書の一部の文脈では、Ἰουδαῖοιを「ユダヤ地方の人々」と理解する見解もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν ἐκ τῶν Ἰουδαίων
  choice: そこで、ユダヤ人のうち、多くの人が
  rationale: οὖνはラザロのよみがえりを受けた結果・展開を示すため、自然な物語接続の「そこで」とした。ἐκは部分を表すので「ユダヤ人のうち」とし、Πολλοίの不特定だが相当数という意味を「多くの人」で表した。
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: マリアのもとに来ていて
  rationale: 冠詞付き分詞が、どのユダヤ人かを限定している。日本語として自然で、主動詞に先立つ来訪を示す表現とした。
- source_word: θεασάμενοι ἃ ἐποίησεν
  choice: イエスのなさったことを見た
  rationale: θεάομαιの実際に目撃する含みを「見た」で保ち、ἃ ἐποίησενは自然に「なさったこと」とした。主語は文脈上イエスであり、日本語では代名詞「彼」より固有名を補うほうが明瞭である。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: イエスを信じた
  rationale: ヨハネ文書で人に向けられる信頼・信仰を表す定型的構文である。日本語では「イエスを信じた」が明瞭かつ自然で、余分な教理的説明を加えない。
theological_decisions:
- issue: πιστεύω εἰς αὐτόνにおける信仰表現
  choice: イエスを信じた
  alternative: イエスに信頼を置いた
  rationale: この構文は単に発言を真実と認めたというより、イエスを対象とする信仰を示す。ただし「信頼を置いた」は説明的なので、簡潔で定着した「イエスを信じた」とした。
- issue: Ἰουδαῖοιの指示範囲
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: 本節ではマリアのもとに来た集団を指し、「ユダヤ人」が最も自然で広く理解される。ただしヨハネ福音書の一部の文脈では地域的な「ユダヤ地方の人々」という理解も論じられるため、脚注に代案を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語文として自然な語順にした。「なさった」によりイエスへの適度な敬意と聖書訳としての品位を保ちつつ、過度に古風な表現は避けた。
