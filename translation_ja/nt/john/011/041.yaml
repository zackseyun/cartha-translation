source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: ja
  text: そこで、人々は石を取りのけた。イエスは目を上げて[a]言われた。「父よ、わたしの願いを聞いてくださったことを、感謝します。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「目を上に向けて」。意訳すると「見上げて」。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「わたしを聞いてくださったことを」。祈りの文脈では、語り手の願いを好意的に聞くことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: 取りのけた
  rationale: 墓の入口をふさいでいた石をその場所から移すことを、現代日本語で自然かつ明確に表す。単に「持ち上げた」とすると、移動させた意味が不明瞭になりうる。
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの命令を受けて人々が行動したという、物語上の帰結を自然に示す。
- source_word: τὸν λίθον
  choice: 石
  rationale: 墓をふさいでいた物を指す、この文脈での標準的な訳語。
- source_word: ὁ δὲ Ἰησοῦς
  choice: イエスは
  rationale: δέはここで強い逆接ではなく、次の主体と場面の動きを示す軽い転換である。日本語では主題提示によって自然に表せるため、接続語を追加しない。
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: 目を上に向けて
  rationale: 視線を上方へ向ける祈りの所作を、原文の「目」のイメージを保ちながら自然な日本語で表す。
- source_word: Πάτερ
  choice: 父よ
  rationale: 祈りにおける直接の呼びかけを、簡潔で荘重な現代日本語として表す。
- source_word: εὐχαριστῶ σοι
  choice: 感謝します
  rationale: 現在の感謝を述べる直接的な表現。日本語では相手が直前の呼びかけで明らかなため、「あなたに」を補わなくても意味が完全に伝わる。
- source_word: ὅτι ἤκουσάς μου
  choice: わたしの言うことを聞いてくださったことを
  rationale: ἀκούωが人を属格に取る構文を自然な日本語にし、祈りを好意的に聞いた含意を敬語の「くださった」で示す。「聞き入れた」ほど結果を限定せず、原文の余地も保つ。
theological_decisions:
- issue: イエスによる神への呼びかけ
  choice: 父よ
  alternative: 父
  rationale: Πάτερの呼格を明示し、親密さと敬意を保つ一方、典礼的な語句や教理的説明は加えない。
- issue: 祈りの文脈におけるἤκουσάς μουの含意
  choice: わたしの言うことを聞いてくださった
  alternative: わたしの願いを聞き入れてくださった
  rationale: 父がイエスをすでに聞いたという本文の主張を保ちつつ、「願い」「聞き入れる」として具体的な内容や応答結果を本文以上に確定しない。
- issue: アオリストἤκουσάςの時制的表現
  choice: 聞いてくださった
  alternative: 聞いてくださっている
  rationale: 完了した行為を日本語の過去形で素直に示す。現在に関わる含意は文脈から伝わるため、継続相を明示して意味を狭めない。
translation_notes:
  register: 明快な現代標準日本語を用い、祈りの場面にふさわしい簡潔な品位を保った。「父よ」は直接的な呼びかけとして荘重だが古風すぎず、「わたし」は柔らかく一般読者にも理解しやすい。
