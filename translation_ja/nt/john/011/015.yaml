source:
  edition: SBLGNT
  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: ja
  text: あなたがたのために、わたしがそこにいなかったことを喜んでいる。あなたがたが信じるためである。だが、彼のところへ行こう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたが信じるようになるため」とも訳せる。ギリシア語のアオリスト接続法は信じるに至ることを示唆し得るが、本文は、すでにある信仰が深められる場合も含み得る、より広い表現を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρω
  choice: 喜んでいる
  rationale: 現在形の感情を自然かつ端正な現代日本語で表す。「うれしく思う」も可能だが、原語の基本的な喜びの意味をより直接に保つ。
- source_word: δι’ ὑμᾶς
  choice: あなたがたのためには
  rationale: διά＋対格がここでは弟子たちの益との関連を表す。裸の原因を示す「あなたがたのゆえに」より文脈に適する。係助詞「は」により、ラザロの死そのものを喜ぶとの誤解を避けつつ原文の関係を保つ。
- source_word: ἵνα πιστεύσητε
  choice: それは、あなたがたが信じるようになるためである
  rationale: ἵνα＋アオリスト接続法の目的を明示する。「信じるため」より、信仰へ至る、または信仰が新たに生じる含みを表し得る。ただし弟子たちがそれまで全く信じていなかったと断定しないよう注で幅を示す。
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: わたしがそこにいなかったことを
  rationale: ὅτιを喜びの内容を導く接続詞と捉え、「いなかったことを」と自然な日本語にした。未完了過去ἤμηνは、この場面では単純に「いなかった」で十分である。
- source_word: ἀλλὰ ἄγωμεν
  choice: さあ、…行こう
  rationale: ἀλλάの対照・転換を、日本語では行動への移行を示す「さあ」で自然に表した。ἄγωμενは勧奨的接続法なので「行こう」とする。
- source_word: πρὸς αὐτόν
  choice: 彼のところへ
  rationale: 人を目的地とするπρός＋対格を、現代日本語で自然な移動表現にした。文脈上の「彼」はラザロを指す。
theological_decisions:
- issue: ヨハネ文書の文脈における πιστεύσητε の相
  choice: 信じるようになる
  alternative: 信じる
  rationale: アオリスト接続法は信仰に至ることを示唆し得るため、その可能性を本文に反映した。ただし、すでに弟子である者たちの信仰が深められる意味も排除できず、以前の全面的な不信を断定しない。
- issue: イエスが喜ぶ対象
  choice: 弟子たちのために、自分がそこにいなかったことを喜ぶ
  alternative: 弟子たちが原因で喜ぶ
  rationale: 原文の語順とδιά＋対格を保ちながら、その喜びがラザロの死自体ではなく、しるしを通して弟子たちにもたらされる益に関わることを日本語で明瞭にした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言として dignified だが過度に古風でない調子にした。「さあ、彼のところへ行こう」は勧奨と場面転換を自然に伝える。
