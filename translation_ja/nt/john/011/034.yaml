id: JHN.11.34
reference: John 11:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν· Ποῦ τεθείκατε αὐτόν; λέγουσιν αὐτῷ· Κύριε, ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: ja
  text: イエスは言われた。「彼をどこに置きましたか。」彼らはイエスに言った。「主よ[a]、来て、ご覧ください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「先生」。ギリシア語の「キュリエ」は、敬意を表す呼びかけとしても用いられるが、本文では「主よ」と訳した。
    reason: κύριε が礼儀上の敬称か、より強い「主」という呼称かという意味の幅を示すため。
lexical_decisions:
- source_word: εἶπεν
  choice: 言われた
  rationale: 基本的な発話動詞として訳し、後続の問いを理由に「尋ねられた」と解釈的に限定しない。イエスへの敬意を自然な日本語の敬語で表した。
- source_word: Ποῦ
  choice: どこに
  rationale: 場所を問う疑問副詞を直接的に表す。
- source_word: τεθείκατε
  choice: 置きましたか
  rationale: τίθημι の完了形が示す、すでに行われた安置を自然な日本語で表す。「葬りましたか」とすると埋葬行為まで意味を限定するため、より広い「置く」を採用した。
- source_word: αὐτόν
  choice: 彼を
  rationale: 文脈上ラザロを指す男性単数代名詞を明示した。
- source_word: λέγουσιν
  choice: 彼らは…言った
  rationale: ギリシア語の歴史的現在を、日本語の物語として自然な過去形で表した。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの敬称としての意味と、「主」という神学的響きの可能性の双方を保つ。単なる礼儀上の呼びかけである可能性は脚注に示した。
- source_word: ἔρχου
  choice: 来て
  rationale: 相手に来るよう促す命令形を、後続の命令と自然につないだ。
- source_word: ἴδε
  choice: ご覧ください
  rationale: 命令形の意味を保ちつつ、イエスに対する話者の敬意を現代日本語として自然に表した。
theological_decisions:
- issue: イエスへの呼びかけ κύριε の訳
  choice: 主よ
  alternative: 先生
  rationale: κύριε は礼儀上の敬称にもなり得るが、ヨハネ福音書ではイエスについてのより深い「主」の響きも帯び得る。本文では両義性を保ちやすい「主よ」を採用し、敬称だけの可能性を脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスへの敬意と聖書本文らしい品位を保った。「置きましたか」は原語の広さを保ち、「葬りましたか」という文脈的限定を避けた。脚注記号は対象語「主よ」の直後に置いた。
