  text: τινὲς δὲ ἐξ αὐτῶν ἀπῆλθον πρὸς τοὺς Φαρισαίους καὶ εἶπαν αὐτοῖς ἃ ⸀ἐποίησεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: ja
  text: しかし、その人たちのうち何人かはファリサイ人たちのところへ行き、イエスが行ったことを彼らに伝えた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスが行ったことを彼らに報告した」。ギリシア語本文は、ファリサイ人たちのところへ行った者たちの動機を明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: しかし、その人たちのうち何人かは
  rationale: 直前に信じた人々との対照を δὲ によって示しつつ、より大きな集団の一部であることを自然な日本語で表す。
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: ファリサイ派の人々のところへ行き
  rationale: その場を離れて人々のもとへ向かったことを表す。日本語では「行き」で移動が自然に伝わり、文脈上不要な強調を加えない。
- source_word: εἶπαν αὐτοῖς
  choice: 彼らに伝えた
  rationale: 単に発言したというより、出来事を相手に知らせた叙述である。「告げ口した」など動機を含む表現は避ける。
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: イエスがなさったこと
  rationale: 複数関係代名詞 ἃ を日本語の集合的な「こと」で自然に表し、ἐποίησεν の完了した行為を過去形で示す。「なさった」はイエスへの文体上の敬意を保つ。
theological_decisions:
- issue: ファリサイ派への報告者の動機
  choice: 動機を明示しない中立的な「伝えた」
  alternative: 「告げ口した」「密告した」
  rationale: ギリシア語本文は、彼らがファリサイ派の人々のもとへ行ってイエスの行為を伝えたとだけ述べ、敵意や密告の意図を明言していないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「ファリサイ派の人々」は集団名を一般読者にも分かりやすく示す。「なさった」は過度に古風にならない範囲で、聖書叙述にふさわしい品位を保つ。
