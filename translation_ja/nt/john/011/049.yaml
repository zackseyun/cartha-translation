  yaml_path: translation/nt/john/011/049.yaml
  text: But one of them[a], Caiaphas, who was high priest that year, said to them, “You know nothing at all.”
translation:
  language: ja
  text: しかし、彼らのうちの一人、カイアファは、その年の大祭司であったが、彼らに言った。「あなたがたは何も知らない。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたがたは何一つ知らない」。ギリシア語は否定表現を重ねて、強い叱責を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: しかし、彼らのうちの一人
  rationale: εἷς…τις は集団の中の一人を示す自然な表現として訳し、δέ は直前の議論に対する軽い対照を「しかし」で表した。
- source_word: Καϊάφας
  choice: カイアファ
  rationale: 人名を日本語聖書で広く通用する形に音写した。
- source_word: ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: その年の大祭司であった
  rationale: 分詞句がカイアファを説明する構造を保ち、時間表現も自然な現代日本語にした。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに言った
  rationale: 間接目的語を明示しつつ、λέγω の基本的な意味を簡潔に訳した。
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  choice: あなたがたは何も分かっていない
  rationale: 明示された主語 Ὑμεῖς と、否定を重ねた強い叱責を自然な日本語で表した。「知っていない」より、この文脈では理解や見識の欠如を指す「分かっていない」が自然である。
theological_decisions:
- issue: カイアファの在職時期についてのヨハネの注記
  choice: その年の大祭司であった
  alternative: その年に大祭司を務めていた
  rationale: 歴史的説明として素直に訳し、大祭司職の制度や物語上の皮肉について訳文で解釈を加えなかった。
translation_notes:
