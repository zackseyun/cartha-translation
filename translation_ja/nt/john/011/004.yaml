  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσας δὲ ὁ Ἰησοῦς εἶπεν· Αὕτη ἡ ἀσθένεια οὐκ ἔστιν πρὸς θάνατον ἀλλ’ ὑπὲρ τῆς δόξης τοῦ θεοῦ ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ δι’ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/004.yaml
  text: But when Jesus heard it[a], he said, “This sickness is not unto death, but for the glory of God, so that the Son of God may be glorified through it.”
translation:
  language: ja
  text: しかし、イエスはこれを聞いて言われた。「この病は死に至るものではなく[a]、神の栄光のためのものである。神の子がこの病によって栄光を受けるためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死を最終的な結果とするものではなく」。このギリシア語表現は、死がこの病の最終的な行き着く先、または目的ではないことを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας δὲ ὁ Ἰησοῦς
  choice: しかし、イエスはこれを聞いて
  rationale: アオリスト分詞を自然な時間的従属関係として訳し、δέの穏やかな展開・対照を「しかし」で示した。「これ」は、文脈上ラザロの病についての知らせを指す。
- source_word: ἀσθένεια
  choice: 病
  rationale: ラザロの身体的な病状を指す一般的で簡潔な語であり、過度に臨床的な響きを避けられる。
- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: 死に至るものではなく
  rationale: πρόςと対格が示す到達点・結果の含みを保つ。ラザロが一時的に死ぬという後続の物語との緊張を消さず、死がこの病の最終的な帰結ではない可能性も残す。
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: 神の栄光のためのものである
  rationale: ここでのὑπέρが表す目的・益を自然な日本語で示し、δόξαの神学的重みを保つ。
- source_word: ἵνα δοξασθῇ ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子が栄光を受けるためである
  rationale: ἵναの目的を明示し、δοξασθῇの受動態を「栄光を受ける」で保持する。「神の子」は称号として標準的かつ明瞭である。
- source_word: δι’ αὐτῆς
  choice: それによって
  rationale: 属格を伴うδιάの手段・媒介の意味を表し、「それ」が直前の「病」を指す構造を簡潔に保つ。
theological_decisions:
- issue: ラザロが後に実際に死ぬことと「死に至るものではない」との関係
  choice: 死がこの病の最終的な到達点ではないという含みを残しつつ、「死に至るものではない」と訳す。
  alternative: ラザロは死なないという単純な予告、または単に「致命的な病ではない」と限定して訳す。
  rationale: 後続箇所ではラザロの死が明言されるため、矛盾を解消する説明を本文に加えず、πρὸς θάνατονが持つ到達点・結果の幅と物語上の緊張を保持する。
- issue: 「神の栄光」と「神の子が栄光を受ける」の関係
  choice: 二つの節を区別したまま、病が神の栄光のためであり、それを通して神の子が栄光を受けるという目的関係を示す。
  alternative: 両者を一つの一般的な「神的栄光」の表現にまとめる。
  rationale: 原文は神の栄光と神の子の栄光化をそれぞれ明示しているため、双方を保つことで本文のキリスト論的主張を加筆なしに伝える。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの発言には簡潔で dignified な文体を保った。「死に至る」は現代でも理解可能な聖書的表現であり、原文の含意を狭めないため採用した。
