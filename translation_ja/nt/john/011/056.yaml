id: JHN.11.56
reference: John 11:56
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: ja
  text: そこで人々は、神殿の境内[a]に立って互いに話しながら、イエスを捜していた。「どう思うか。イエスは祭りには決して来ないのではないか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」と訳されるギリシア語は、内なる聖所だけでなく、庭などを含む神殿域全体を指す。
    reason: cultural_note
  - marker: b
    text: 別訳「イエスは祭りには、決して来ないということではないか」。原文では強い否定表現が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: 捜し
  rationale: 未完了時制が示す継続的な探索を、文脈に合う自然な現代日本語で表した。
- source_word: οὖν
  choice: そこで
  rationale: 前節からの物語上の展開と帰結を自然に示す。
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: 互いに言っていた
  rationale: 未完了時制の継続・反復と、相互に語り合う意味を保持した。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿の境内
  rationale: ἱερόνは内陣そのものではなく、建物や庭を含む神殿域を指すため。
- source_word: ἑστηκότες
  choice: 立って
  rationale: 完了分詞が表す、立った状態でいたことを簡潔に表現した。
- source_word: Τί δοκεῖ ὑμῖν;
  choice: どう思う
  rationale: 意見を尋ねる口語的な問いとして明瞭かつ自然。
- source_word: οὐ μὴ ἔλθῃ
  choice: 決して来ないのだろうか
  rationale: οὐ μήによる強い否定を「決して」で示しつつ、文全体が話者たちの推量を問う発言であることを「のだろうか」で保った。
- source_word: εἰς τὴν ἑορτήν
  choice: 祭りに
  rationale: 直前の文脈で示される過越祭を指すが、この節自体の一般名詞表現を保持した。
theological_decisions:
- issue: οὐ μήを含む問いの解釈
  choice: 「あの方は祭りに決して来ないのだろうか」
  alternative: 「あの方は祭りに来ると思うか」
  rationale: 原文の強い否定を省略せず、ὅτι以下を先行する「どう思う」に続く問いとして訳した。否定疑問の期待方向には解釈の余地があるため、断定的に言い換えなかった。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。群衆の継続的な探索と会話を表し、神殿域と内陣の区別、および否定疑問に残る曖昧さを注で補った。
