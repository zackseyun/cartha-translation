id: JHN.11.11
reference: John 11:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: ja
  text: これらのことを話した後、イエスは彼らに言われた。「私たちの友人ラザロは眠りについた[a]。しかし、私は彼を起こしに行く。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでは、死が眠りにたとえられている。より明示的に訳せば「死んだ」となる。続く節で、弟子たちはこれを文字どおりの眠りだと受け取る。
    reason: κεκοίμηται の比喩的用法を説明しつつ、本文では「眠り」という表現を保ち、後続文脈で生じる弟子たちの誤解を先取りして解消しないため。
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: こう話した後
  rationale: 直訳的な「これらのことを言い、その後」より自然な日本語で、先の発言が完了した後という時間的順序を保つ。ταῦταの複数性は日本語の「こう」で文脈全体を受ける形にした。
- source_word: λέγει αὐτοῖς
  choice: イエスは彼らに言われた
  rationale: 歴史的現在は日本語の物語として自然な過去形で表した。主語「イエス」は文脈上明白な指示対象を示すために補い、αὐτοῖςは過度に限定せず「彼ら」とした。
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: 私たちの友ラザロ
  rationale: 所有関係と親しい関係を簡潔かつ自然に表す。
- source_word: κεκοίμηται
  choice: 眠りに就いた
  rationale: 完了形が示す現在に至る状態を含みつつ、死を睡眠にたとえる表現を保持する。後続箇所で生じる弟子たちの誤解を先回りして解消しない。
- source_word: ἀλλὰ πορεύομαι
  choice: しかし、私は……行く
  rationale: 逆接を明示し、イエスが目的をもって向かうという現在的・切迫した動きを自然な日本語で示す。
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: 彼を起こしに
  rationale: ἵναの目的を日本語の目的表現「～しに」で自然に示し、「眠り」と「起こす」の比喩的な対応を保つ。
theological_decisions:
- issue: κεκοίμηταιを解釈的に「死んだ」と訳すか、睡眠の比喩を保つか
  choice: 本文では「眠りに就いた」として比喩を保つ
  alternative: 死んだ／亡くなった
  rationale: イエスはここで死を眠りとして語り、続く節で弟子たちが文字どおりの睡眠と受け取る。本文で「死んだ」と明示すると、意図された物語上の緊張と比喩が失われるため。
translation_notes:
  register: 明瞭で現代的ながら品位ある文体。「言われた」によってイエスへの自然な敬意を示す一方、会話本文は平易にした。脚注記号は、それが説明する「眠りに就いた」の直後に置いた。
