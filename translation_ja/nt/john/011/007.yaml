id: JHN.11.7
reference: John 11:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔπειτα μετὰ τοῦτο λέγει τοῖς μαθηταῖς· Ἄγωμεν εἰς τὴν Ἰουδαίαν πάλιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: ja
  text: その後、イエスは弟子たちに言われた。「もう一度ユダヤ地方へ行こう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα μετὰ τοῦτο
  choice: その後
  rationale: 二つの時間表現が重なって物語の順序を示す。日本語で「それから、この後」と重ねると不自然なため、意味を保って簡潔に「その後」とした。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語はヨハネに多い歴史的現在だが、日本語の物語では過去形が自然である。主語は文脈上イエスなので明示し、敬意を表す通常の聖書的表現とした。
- source_word: τοῖς μαθηταῖς
  choice: 弟子たちに
  rationale: 定冠詞付きの複数名詞を自然に訳した。「自分の／彼の」は原文に明示されていないため加えない。
- source_word: Ἄγωμεν
  choice: 行こう
  rationale: 一人称複数の勧奨的接続法を、同行を促す自然な日本語で表した。
- source_word: εἰς τὴν Ἰουδαίαν
  choice: ユダヤ地方へ
  rationale: 移動の方向・到達先を示す εἰς を「へ」で表した。ここでの Ἰουδαία は地域名なので、現代の読者に明瞭な「ユダヤ地方」とした。
- source_word: πάλιν
  choice: もう一度
  rationale: 以前いた地域へ戻ることを示す反復の意味を、自然で明瞭な日本語で表した。
theological_decisions:
- issue: ヨハネの物語における歴史的現在
  choice: 日本語の自然な物語時制として「言われた」とする
  alternative: 形式を保って「言われる」とする
  rationale: λέγει は形態上現在形だが、過去の出来事を生き生きと語る歴史的現在である。日本語で現在形にすると不自然に時制が切り替わった印象を与えやすいため、語用論的な働きを保つ過去形を選んだ。
translation_notes:
  register: 明瞭で自然な現代標準日本語。簡潔さと品位を保ち、原文にない所有表現は加えていない。
