  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: ja
  text: イエスは言われた。「石を取りのけなさい。」亡くなった人の姉妹であるマルタがイエスに言った。「主よ、もう臭っています。死んでから四日になりますから。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「四日目の者だから」。すなわち、死んでから四日目になっているという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρατε τὸν λίθον
  choice: 石を取りのけなさい
  rationale: 複数の人に墓をふさいでいる石を移すよう命じる表現。「取りのける」は、石をその場所から動かす意味を自然な現代日本語で表す。
- source_word: τοῦ τετελευτηκότος
  choice: 死んだ人
  rationale: 完了分詞が示す、死んでその状態にある人物を、簡潔で自然な日本語にした。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの呼びかけとして、敬意とヨハネ福音書における称号の重みを保つ。「先生」「だんな様」などに狭めない。
- source_word: ἤδη ὄζει
  choice: もう臭います
  rationale: ὄζωは臭いを発することを表し、ここでは死後の腐敗による不快な臭いが文脈上明らかである。「悪臭がします」より原文の動詞構造に近く、「臭います」は過度にくだけず自然である。
- source_word: τεταρταῖος γάρ ἐστιν
  choice: 死んでから四日になりますから
  rationale: τεταρταῖοςの字義的な『四日目の者』という表現を、日本語で意味が明確になるよう補って訳した。γάρの説明関係は「から」で示した。
theological_decisions:
- issue: マルタがイエスをκύριοςと呼ぶ表現
  choice: 主よ
  alternative: 先生／あなた様
  rationale: 単なる丁寧な呼びかけとも取り得る余地はあるが、ヨハネ福音書でκύριοςが帯びる称号としての重みを保つため「主」とした。ただし、この一語だけでマルタの理解の範囲を過度に確定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話には自然さを持たせつつ、聖書本文としての品位を保った。「臭います」は腐敗臭を婉曲化しすぎず、同時に過度に口語的な「臭い」を避ける選択。
