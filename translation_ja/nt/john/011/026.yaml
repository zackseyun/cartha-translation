  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: ja
  text: また、生きていて、わたしを信じる者は皆、永遠に、決して死ぬことはありません。あなたはこのことを信じますか。｣
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμέ
  choice: 生きていてわたしを信じる者は皆
  rationale: 分詞句の並列を保ちつつ、現代日本語として自然に表現した。「εἰς ἐμέ」は単なる命題への同意ではなく、イエスに向けられた信頼を示すため「わたしを信じる」とした。
- source_word: οὐ μὴ ἀποθάνῃ
  choice: 決して死なない
  rationale: οὐ μή＋接続法の強い否定を「決して」で明示した。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: 字義的には「永遠に／いつまでも」。直前の強い否定と結びつく表現を保ち、死の性質を神学的に限定して説明する語は補わなかった。
- source_word: πιστεύεις τοῦτο;
  choice: あなたはこのことを信じますか
  rationale: 問いの直接性とτοῦτοの指示をそのまま保った。
theological_decisions:
- issue: 「決して死なない」と直前の肉体的死・復活についての文脈との緊張
  choice: 永遠に決して死なない
  alternative: いつまでも死ぬことはない／永遠の死を経験しない
  rationale: 原文は死の種類を明示せず、強い否定と「永遠に」を用いる。解釈語である「永遠の死」などを本文に入れず、ヨハネ11:25との緊張を保持した。
translation_notes:
  register: イエスの厳粛な宣言として、明快で格調を保った現代標準語。「また」でκαίを示し、前節との連続性を維持した。引用末尾として閉じかぎ括弧を付した。
