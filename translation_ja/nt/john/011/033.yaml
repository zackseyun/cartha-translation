  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: ja
  text: そこでイエスは、彼女が泣き、彼女と一緒に来たユダヤ人たち[a]も泣いているのを見ると、心の奥で強く揺さぶられ[b]、自ら心を騒がせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでの「ユダヤ人たち」は、マリアと一緒に来たユダヤ人の弔問者たちを指し、ユダヤ人全体を指すものではない。「ユダヤ地方の人々」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: この動詞は強い内的動揺を表し、「憤りを覚えた」または「深く心を動かされた」と訳すこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の場面を受けた物語の展開と帰結を示す。現代日本語では「それゆえ」より自然で、単なる時間的な「その時」より接続の力を保てる。
- source_word: ὡς εἶδεν
  choice: 見ると
  rationale: ὡςとアオリストの時間的用法を、出来事の順序が明確な自然な日本語で表した。
- source_word: κλαίουσαν / κλαίοντας
  choice: 泣き／泣いている
  rationale: κλαίωの、声を伴いうる悲嘆の表現を保ちつつ、「泣き叫ぶ」として儀礼的な哀哭まで限定しない。
- source_word: συνελθόντας αὐτῇ
  choice: 一緒に来た
  rationale: マリアとともに来た人々を指す分詞を、簡潔で自然に表した。
- source_word: Ἰουδαίους
  choice: ユダヤ人たち
  rationale: 直接的な語義を採用しつつ、この文脈ではマリアに同行した弔問者を指し、ユダヤ人全体ではないことを脚注で明示した。
- source_word: ἐνεβριμήσατο
  choice: 激しく心を動かされ
  rationale: この動詞が示す強い内的動揺を表しながら、それが憤り、怒り、悲しみのどれであるかを本文で決めつけない。
- source_word: τῷ πνεύματι
  choice: 霊のうちに
  rationale: 感情の動きが生じた領域を示す与格を比較的形式的に保ち、「霊」を単に「心」と同一視しない。
- source_word: ἐτάραξεν ἑαυτόν
  choice: 自ら心を騒がせた
  rationale: ἑαυτόνの再帰性を「自ら」で明示し、単なる受動的状態の「心を騒がせた」ではなく、原文の特徴ある表現を保った。
theological_decisions:
- issue: ἐνεβριμήσατοが表すイエスの感情
  choice: 激しく心を動かされ
  alternative: 憤られた／激しくかき立てられた
  rationale: 原語は強い動揺に加えて憤りを含みうるが、その感情の性質や対象は明記されていない。本文では強度を保ち、怒りや悲嘆の一方に限定しない。
- issue: ἐτάραξεν ἑαυτόνの再帰的表現
  choice: 自ら心を騒がせた
  alternative: 心を騒がせた／心を乱された
  rationale: イエスが外的刺激によって受動的に動揺したというだけでなく、原文が明示する再帰性を残す。ただし、その神学的意味を本文で説明しすぎない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、荘重さと原文の再帰的・感情的な緊張を保持した。「霊のうちに」「自ら心を騒がせた」はやや特徴的な表現だが、原文の意味要素を平板化しないために採用した。
