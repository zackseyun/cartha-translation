source:
  edition: SBLGNT
  text: Ἦν δὲ ἐγγὺς τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβησαν πολλοὶ εἰς Ἱεροσόλυμα ἐκ τῆς χώρας πρὸ τοῦ πάσχα ἵνα ἁγνίσωσιν ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: ja
  text: ユダヤ人の過越祭が近づいていた[a]。多くの人々が、過越祭の前に身を清めるため[b]、地方からエルサレムへ上って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤの過越祭」とも訳せる。ギリシア語はより直訳すると「ユダヤ人の過越祭」であり、ヨハネ福音書に繰り返し現れる表現。
    reason: lexical_alternative
  - marker: b
    text: 過越祭に備えて、儀礼上の清めを行うこと。
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ ἐγγὺς
  choice: 近づいていた
  rationale: δέは穏やかな接続であり、日本語では文脈上あえて接続語を補わない。ἐγγύςの時間的意味を自然な現代日本語で表す。
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: ユダヤ人の過越祭
  rationale: ヨハネに繰り返される属格表現を保ち、「ユダヤ人の」を祭りに直接結び付ける。
- source_word: ἀνέβησαν
  choice: 上って行った
  rationale: エルサレムへの地理的・巡礼慣習上の上行という含みを保持する。
- source_word: πολλοὶ
  choice: 大勢の人
  rationale: 名詞的に用いられた形容詞を、明瞭で自然な日本語にする。
- source_word: ἐκ τῆς χώρας
  choice: 地方から
  rationale: 都市エルサレムに対する周辺地域を簡潔に表す。「田舎」ほど口語的・評価的ではない。
- source_word: πρὸ τοῦ πάσχα
  choice: 過越祭の前に
  rationale: 時間的先行を明瞭かつ直接的に表す。
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: 身を清めるため
  rationale: ἵναの目的を示し、ἁγνίζωの祭儀的含意を本文では過度に説明せず保持する。
theological_decisions:
- issue: 過越祭前の清めの性質
  choice: 身を清めるため
  alternative: 儀式に従って身を清めるため／身を聖別するため
  rationale: 文脈は過越祭に備えるユダヤ教上の清めであるが、本文では道徳的清めや後代の教理的区分を持ち込まず、文化的背景を脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「過越祭」は定着した聖書用語として保持し、「上って行った」で巡礼の方向性を表した。脚注記号は該当語句の直後に配置した。
