id: JHN.11.47
reference: John 11:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: ja
  text: そこで、祭司長たちとファリサイ派の人々は評議会[a]を招集し、こう言っていた。「われわれは何をしているのか。この男が多くのしるしを行っているというのに。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここでは、ユダヤ人の統治評議会、サンヘドリンを指すと考えられる。
    reason: συνέδριον は一般に「評議会」を意味するが、この文脈での伝統的・歴史的同定を、本文で固定しすぎずに示すため。
lexical_decisions:
- source_word: συνήγαγον
  choice: 招集し
  rationale: アオリスト能動態。目的語が会議体を指すため、「集めた」よりも自然な現代日本語の「招集した」が文脈に合う。
- source_word: οὖν
  choice: そこで
  rationale: ラザロの復活をめぐる直前の出来事を受けた物語上・論理上の帰結を、過度に形式化せず示す。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数の指導的祭司権威を指す定着した訳語であり、「大祭司たち」として複数の在職大祭司を意味するような誤解を避ける。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 現代の一般読者に集団名であることが明確になる自然な表現。
- source_word: συνέδριον
  choice: 最高法院
  rationale: この文脈ではエルサレムのユダヤ統治評議会を指す可能性が高い。本文では日本語として通用する制度名を用い、別称を脚注に示す。
- source_word: ἔλεγον
  choice: こう言っていた
  rationale: 未完了過去の継続的・進行的な側面を保つ。
- source_word: Τί ποιοῦμεν
  choice: われわれは何をしているのか
  rationale: 現在直説法の形を保ち、何も有効な手を打てていないことへの焦りを伝える。「どうすべきか」と明示的な勧告表現にはしない。
- source_word: ὅτι
  choice: （独立した次文による理由提示）
  rationale: 後続文が問いの理由を示す関係は、日本語では接続詞を補わず並置するほうが自然で、因果関係も明瞭である。
- source_word: οὗτος ὁ ἄνθρωπος
  choice: あの男
  rationale: 話者がイエスを距離を置いて指す調子を自然な日本語で表す。「この男」も可能だが、現場に本人がいない文脈では「あの男」が自然。
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: 多くのしるしを行っている
  rationale: 現在時制を「行っている」で保ち、ヨハネ文書で啓示的意味を帯びる σημεῖα を「奇跡」に狭めず「しるし」と訳す。
theological_decisions:
- issue: ヨハネ文書における σημεῖα の訳
  choice: しるし
  alternative: 奇跡／奇跡的なしるし
  rationale: イエスの業がその身元を指し示すというヨハネ特有の含意を保ち、現象面だけを強調する「奇跡」へ意味を限定しない。
- issue: συνέδριον の制度的同定
  choice: 最高法院
  alternative: 議会／サンヘドリン
  rationale: 文脈上はユダヤの最高統治評議会を指す可能性が高いが、ギリシア語自体は普通名詞でもある。その制度的理解を本文で明瞭にしつつ、伝統的名称は脚注で示す。
- issue: Τί ποιοῦμεν の発話意図
  choice: われわれは何をしているのか
  alternative: われわれはどうすべきか
  rationale: 直説法の形と、行動できていない自分たちへの焦燥を保つ。文脈上は対応策を問う含みもあるが、それを明示的な義務表現に固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会議を招集する公的で緊迫した場面にふさわしい品位を保った。「われわれ」は指導者層の公式な協議という響きを持たせ、「あの男」は話者側の距離感を伝える。
