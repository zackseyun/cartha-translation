id: JHN.11.52
reference: John 11:52
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: ja
  text: また、ただその国民のためだけでなく、散らされている神の子どもたちをも一つに集めるためであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その国民」とは、この文脈ではユダヤの国民を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: 国民
  rationale: 単数の集合的な意味を保ちつつ、直前の文脈ではユダヤの民を指す。「国」よりも、人々のために死ぬという文脈になじむ。
- source_word: ἵνα
  choice: ためであった
  rationale: 前節の「死ぬこと」と結び付く目的を自然な日本語で示す。結果の含みを排除しすぎず、主たる目的の力を保つ。
- source_word: τέκνα τοῦ θεοῦ
  choice: 神の子どもたち
  rationale: τέκνα は男女を含む「子どもたち」であり、「息子たち」と狭めない。
- source_word: τὰ διεσκορπισμένα
  choice: 散らされている
  rationale: 完了受動分詞が表す、散らされた結果として現在も離散状態にあることを表す。
- source_word: συναγάγῃ
  choice: 集める
  rationale: ἵνα 節内のアオリスト接続法を、日本語では目的表現の不定形によって自然に伝える。
- source_word: εἰς ἕν
  choice: 一つに
  rationale: 原文は何において一つとなるかを明示しないため、「一つの体に」「一つの群れに」などを補わず、簡潔さと神学的な幅を保つ。
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: また、ただその国民のためだけでなく、…をも
  rationale: 前節のイエスが民のために死ぬという内容を受け、ὑπέρ を「のため」とし、οὐ…μόνον ἀλλά καί の対照を自然な日本語で保つ。
theological_decisions:
- issue: 「神の子どもたち」の範囲
  choice: ユダヤ国民を越えて散らされている神の民を指す広い表現として保持する。
  alternative: 離散ユダヤ人だけを指す、またはユダヤ人と異邦人からなる選民を明示する。
  rationale: 本文は「その国民」と、より広い「散らされている神の子どもたち」を対照させるが、その範囲を厳密には定義していないため、訳文でも限定しない。
- issue: εἰς ἕν の統一の性質
  choice: 「一つに」と訳し、統一の具体的形態を明示しない。
  alternative: 「一つの体に」「一つの群れに」「一致させる」と解釈的に補う。
  rationale: 原文の意図的に簡潔な表現と神学的な含みを保持する。
translation_notes:
  register: 明快で現代的ながら、聖書本文としての品位を保つ。「国民」は現代政治的な響きを帯び得るため、指示対象を脚注で明確にした。「一つに集める」は原文の簡潔さを保ち、教会・群れ・体など特定の比喩を補わない。
