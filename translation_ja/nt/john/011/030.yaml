  - severity: low
    issue: 「場所に、なお」の読点がやや不自然である。
    rationale: 場所を表す句と副詞「なお」は切り離さない方が、現代日本語として滑らかである。
  revised_text: イエスはまだ村に入っておらず、マルタがイエスに出会った場所になおとどまっておられた。
