  text: οὔπω δὲ ἐληλύθει ὁ Ἰησοῦς εἰς τὴν κώμην, ἀλλ’ ἦν ⸀ἔτι ἐν τῷ τόπῳ ὅπου ὑπήντησεν αὐτῷ ἡ Μάρθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: ja
  text: イエスはまだ村に入っておらず、マルタがイエスに出会った場所になおとどまっておられた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὔπω
  choice: まだ……ておらず
  rationale: ある時点まで出来事が実現していないことを、自然な現代日本語で表す。
- source_word: δὲ
  choice: （独立した語としては訳出しない）
  rationale: ここでは穏やかな物語上の移行を示す。日本語では文脈と文の運びによって十分に表されるため、不自然な「さて」などを加えない。
- source_word: ἐληλύθει
  choice: 入っておらず
  rationale: 完了過去形が示す、その時点でまだ村に到達・進入していなかった状態を表す。目的地が村なので、単なる「来る」より「入る」が自然である。
- source_word: κώμην
  choice: 村
  rationale: κώμηは通常、小規模な集落を指す。簡潔で一般的な訳語を採用した。
- source_word: ἀλλ’
  choice: （前半の「ず」と後半の継続表現で対比）
  rationale: 村にはまだ入っていないことと、以前の場所にとどまっていることとの対比を、日本語の自然な接続で示す。
- source_word: ἔτι
  choice: なお
  rationale: 同じ場所に引き続きいたことを表す。
- source_word: τόπῳ
  choice: 場所
  rationale: 一般的な場所・地点を指す語として素直に訳した。
- source_word: ὅπου
  choice: ……場所
  rationale: 場所を示す関係節を、日本語では連体修飾として自然に構成した。
- source_word: ὑπήντησεν
  choice: 出会った
  rationale: 文脈上はマルタがイエスを迎えに出たことを含み得るが、この節では出会いの場所を特定する働きが中心であるため、本文では簡潔に訳し、方向性を明示する訳は脚注に残した。
- source_word: αὐτῷ
  choice: （「出会った」の相手としてイエスを文脈上補う）
  rationale: 日本語では同一文中の主語イエスを「彼に」と重ねると不自然になりやすく、動詞の相手は文脈から明白である。
- source_word: Μάρθα
  choice: マルタ
  rationale: 日本語聖書で広く定着した人名表記。
