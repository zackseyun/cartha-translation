  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: ja
  text: しかし、今でも[a]、あなたが神に何を願っても、神はあなたに与えてくださると私は知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして今、私は知っています」。ギリシア語の接続詞は単純に「そして」とも訳せるが、ここでは直前のラザロの死についての発言を受け、対照的な転換を表しているとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: しかし、今でも
  rationale: καίの接続的な働きとνῦνの時間的意味を保ちつつ、ラザロの死を述べた直前の発言から、なお残る確信へ転じる文脈上の対照を自然な日本語で示す。
- source_word: οἶδα
  choice: 私は知っています
  rationale: 現在の意味を持つ完了形であり、確信を弱めたり説明を加えたりせず、標準的に「知っています」と訳す。
- source_word: ὅσα ἂν
  choice: ことは何でも
  rationale: ἄνを伴う関係表現の不定・包括的な範囲を、自然な現代日本語で表す。
- source_word: αἰτήσῃ τὸν θεόν
  choice: あなたが神に願う
  rationale: αἰτέωの直接目的語としてθεόνが置かれるギリシア語を、日本語で祈願を表す自然な構文「神に願う」とする。
- source_word: δώσει σοι ὁ θεός
  choice: 神はあなたに与えてくださる
  rationale: 明示された主語と与える相手を保持する。マルタがイエスに語る場面にふさわしい自然な敬意を「くださる」で表しつつ、δίδωμιの基本義「与える」を保つ。
theological_decisions:
- issue: イエスが神に願い、神がイエスに与えるというマルタの発言を、キリスト論的説明によって言い換えるか
  choice: 「あなたが神に願うことは何でも、神はあなたに与えてくださる」と本文どおりに保つ。
  alternative: 「神」を「父なる神」と補う、または従属的に見えないよう意訳する。
  rationale: この節はマルタの発言を記すものであり、ヨハネ福音書の物語が持つ神学的緊張を、補足や教義的な平準化によって解消すべきではない。
translation_notes:
  register: 明瞭な現代標準日本語。マルタからイエスへの発話として丁寧体を用い、過度に古風な宗教語を避けた。「与えてくださる」は日本語の対人関係に即した敬意表現であり、神学的内容の付加を意図しない。
