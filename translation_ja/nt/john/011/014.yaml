id: JHN.11.14
reference: John 11:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: ja
  text: そこでイエスは、彼らにはっきりと[a]言われた。「ラザロは死んだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「包み隠さず」「率直に」。
    reason: παρρησίᾳ はこの文脈では「はっきりと」、すなわち曖昧さなく語ることを表すが、「包み隠さず」「率直に」とも訳しうる。
lexical_decisions:
- source_word: τότε οὖν
  choice: そこで
  rationale: 時間的な進行を示す τότε と、推論・移行を示す οὖν を一体として自然に表し、直前の弟子たちの誤解を受けた展開も示す。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに…言われた
  rationale: 間接目的語を保ちつつ、イエスに対する現代日本語の自然で品位ある敬語表現とした。
- source_word: παρρησίᾳ
  choice: はっきりと
  rationale: 先の「眠っている」という間接的表現とは対照的に、曖昧さなく明言したことを表す。「率直に」「公然と」も語義上可能だが、文脈には「はっきりと」が最も適する。
- source_word: Λάζαρος
  choice: ラザロ
  rationale: 日本語聖書で定着した標準的な人名表記を用いた。
- source_word: ἀπέθανεν
  choice: 死んだ
  rationale: アオリストが示す死という出来事を簡潔に表す。日本語では完了の現在的関連性を特別な形式で補わずとも文脈から明らかである。
theological_decisions:
- issue: ラザロの状態についてのイエスの発言
  choice: 肉体的な死を直接述べる明確な表現
  alternative: 先の「眠り」の比喩を残す表現
  rationale: 本文は ἀπέθανεν を用い、先行する比喩的な発言を明示的に説明しているため、ここでは曖昧さを残さない。
translation_notes:
  register: 明快な現代標準日本語を用い、会話部分は簡潔に保った。「言われた」により自然な敬意と物語文としての品位を示した。
source_grounding:
  english_pob_role: consult_only
