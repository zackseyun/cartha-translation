id: JHN.16.5
reference: John 16:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νῦν δὲ ὑπάγω πρὸς τὸν πέμψαντά με καὶ οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με· Ποῦ ὑπάγεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/005.yaml
  text: But now I am going to the one who sent me, and none of you asks me, ‘Where are you going?’
translation:
  language: ja
  text: しかし今、わたしはわたしを遣わした方のもとへ行く。あなたがたのうちだれも、『どこへ行かれるのですか』とわたしに尋ねない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: しかし今
  rationale: δέの対照を保ちつつ、直前までの話から現在の発言への移行を自然な現代日本語で示す。
- source_word: ὑπάγω
  choice: 行こうとしている
  rationale: 現在形が文脈上、間近な移動を表すことを反映する。「去る」よりも方向性を保ち、単なる別離に限定しない。
- source_word: πρὸς τὸν πέμψαντά με
  choice: わたしを遣わした方のもとへ
  rationale: 冠詞付き分詞を敬意ある自然な日本語にし、πρόςの人に向かう意味を「もとへ」で表す。原文に明記されない「父」は補わない。
- source_word: πέμψαντά
  choice: 遣わした
  rationale: ヨハネ福音書における使命を帯びた派遣の含意を、日本語聖書として自然な「遣わす」で表す。
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: あなたがたのうち誰も
  rationale: 部分を示すἐξを保ち、強い否定と自然に結び付ける。
- source_word: ἐρωτᾷ με
  choice: わたしに尋ねない
  rationale: ここでは依頼ではなく質問する意味なので、「尋ねる」が明確で自然である。
- source_word: Ποῦ ὑπάγεις;
  choice: どこへ行かれるのですか
  rationale: 移動の方向を自然に表し、弟子がイエスに向ける問いとして適度な敬意を示す。
theological_decisions:
- issue: 「わたしを遣わした方」の同定
  choice: 「わたしを遣わした方」とし、「父」を明示的に補わない。
  alternative: 「わたしを遣わした父」
  rationale: ヨハネ福音書の文脈では父を指すことは明らかだが、この節のギリシア語は冠詞付き分詞だけで、父を明記していないため、原文の表現を保つ。
- issue: 弟子たちが尋ねないという発言と先行箇所との緊張
  choice: 原文どおり「誰も…尋ねない」と断定的に訳す。
  alternative: 「今は誰も…尋ねない」など、先行する質問との調和を訳文で明示する。
  rationale: ペトロとトマスは先に行き先について発言しているが、ここでのイエスの言葉が指す時点や問いの質を翻訳で限定せず、本文の修辞的・神学的緊張を残す。
translation_notes:
  register: 明瞭で現代的ながら、イエスの告別説教にふさわしい落ち着いた格調を保った。「方」「行かれるのですか」により自然な敬意を示し、過度に古風な表現は避けた。
