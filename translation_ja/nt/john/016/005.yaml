revisions:
- from: しかし今、わたしは、わたしを遣わした方のもとへ行こうとしている。それなのに、あなたがたのうち誰も、『どこへ行かれるのですか』とわたしに尋ねない。
  to: しかし今、わたしはわたしを遣わした方のもとへ行く。あなたがたのうちだれも、『どこへ行かれるのですか』とわたしに尋ねない。
  rationale: ὑπάγω の未来を帯びた現在形を「行く」とし、καὶ に原文以上の逆接を加えないよう文を分けた。それ以外の語句は、原文の明示性、呼称の敬意、ヨハネ的な「遣わす」の用語法を適切に保っている。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:52Z'
review_pass:
  verdict: revise
  source_fidelity: 「行こうとしている」は、これから行く意図・直前性を強く示し、ὑπάγω の現在形がここで表す「行く」という移動の宣言よりやや狭い。「行く」とすることで、未来を帯びた現在形の自然な日本語表現となる。また、καὶ に対して「それなのに」を置くと、原文にない逆接・譲歩の関係が加わるため避ける。
  naturalness: 「しかし今、わたしはわたしを遣わした方のもとへ行く」は明瞭で自然であり、告別説教にふさわしい落ち着いた文体である。「どこへ行かれるのですか」は、弟子からイエスへの問いとして自然な敬意を保つ。
  terminology: 「遣わした方」は πέμψαντά με を忠実に表し、「父」を補わない点も適切である。「あなたがたのうちだれも」「尋ねない」は οὐδεὶς ἐξ ὑμῶν ἐρωτᾷ με を過不足なく表す。
  issues:
  - severity: medium
    issue: 「行こうとしている」
    rationale: ὑπάγω を「行こうとする」と訳すと、移動そのものより意図・企図を前景化し、原文にない近接性も含みうる。文脈上の未来的現在は、日本語では「行く」で自然に表せる。
  - severity: medium
    issue: 「それなのに」
    rationale: καὶ は単純接続であり、「それなのに」は逆接・意外性を明示してしまう。本文は、弟子たちが尋ねないという発言の修辞的緊張を保ちつつ、関係を過度に限定しない訳がよい。
  revised_text: しかし今、わたしはわたしを遣わした方のもとへ行く。あなたがたのうちだれも、『どこへ行かれるのですか』とわたしに尋ねない。
