  text: and concerning judgment[c][b][a], because the ruler of this world has been judged.
translation:
  language: ja
  text: また、裁きについては、この世の支配者[a][b]がすでに裁かれている[c]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この世の君主」。
    reason: lexical_alternative
  - marker: b
    text: おそらくサタンを指す。ヨハネ12:31、14:30参照。
    reason: cross_reference
  - marker: c
    text: または「裁かれたままである」。ギリシア語の完了形は、裁きがすでに成立し、その結果が続いていることを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ κρίσεως
  choice: また、裁きについてとは
  rationale: περί＋属格の話題提示を「〜について」、δέの接続を「また」で表した。前節から続く「〜についてとは」という構文を保ち、自然な日本語にした。
- source_word: ὅτι
  choice: 〜からです
  rationale: ここでは、御霊が裁きについて世の誤りを明らかにする理由を示す因果用法として訳した。
- source_word: ὁ ἄρχων
  choice: 支配者
  rationale: ἄρχωνは権威を行使する者を指す。「君主」よりも現代日本語で明瞭であり、王族としての身分を不必要に含意しない。
- source_word: τοῦ κόσμου τούτου
  choice: この世の
  rationale: ヨハネ文書におけるκόσμοςの標準的な表現として「世」を用い、神に背く世界秩序という文脈的含意を訳文で過度に説明しなかった。
- source_word: κέκριται
  choice: すでに裁かれている
  rationale: κρίνωの完了受動形が示す、裁きが成立し、その結果が現在も続いていることを「すでに〜ている」で表した。「有罪とされている」と限定せず、原語の語義幅を保った。
theological_decisions:
- issue: 「この世の支配者」の指示対象
  choice: 本文では固有名を加えず、「この世の支配者」とした。
  alternative: 「この世の支配者であるサタン」と説明的に訳す。
  rationale: ヨハネ12:31、14:30との比較からサタンを指すと考えられるが、この節自体は称号のみを用いるため、本文ではその表現を保持した。
- issue: κέκριταιの意味合い
  choice: 「すでに裁かれている」とした。
  alternative: 「有罪とされている」「断罪されている」。
  rationale: 文脈上は不利な裁きが含意されるが、κρίνω自体を「断罪」に狭めず、完了形による成立済みの裁きと継続する結果を示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「裁き」「支配者」という簡潔な語を用い、原文の神学的含意を説明的に本文へ加えない。脚注記号は対応内容に近い順に[a][b][c]とした。
