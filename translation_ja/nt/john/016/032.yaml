  text: ἰδοὺ ἔρχεται ὥρα ⸀καὶ ἐλήλυθεν ἵνα σκορπισθῆτε ἕκαστος εἰς τὰ ἴδια κἀμὲ μόνον ἀφῆτε· καὶ οὐκ εἰμὶ μόνος, ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/032.yaml
  text: Behold[a], an hour is coming, and has come, when you will be scattered, each to his own, and will leave me alone. Yet I am not alone, because the Father is with me.
translation:
  language: ja
  text: 見なさい。あなたがたが散らされ、それぞれ自分のところへ[a]行き、わたしを一人残す時が来ます。しかも、その時はすでに来ています。しかし、わたしは一人ではありません。父がわたしとともにおられるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「それぞれ自分のものへ」。ギリシア語は特定の場所だけでなく、各自に属する場所、物事、生活領域などを広く指し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 注意を促す談話標識としての力と、イエスの厳粛な告知の調子を、現代日本語で自然に保つ。
- source_word: ἔρχεται ὥρα καὶ ἐλήλυθεν
  choice: 時が来ます。いや、もう来ています
  rationale: 現在形と完了形の緊張関係、すなわちその決定的な時が迫りつつ、すでに到来していることを明確に表す。「いや」は前言を取り消すのではなく、さらに踏み込んで告げる働きをする。
- source_word: ἵνα
  choice: ～する時
  rationale: ここでは目的よりも、到来する「時」の内容・結果を導く用法と捉え、自然な時間表現にした。
- source_word: σκορπισθῆτε
  choice: あなたがたが散らされ
  rationale: 受動態を保ち、弟子たちがばらばらにされる出来事を表す。
- source_word: ἕκαστος εἰς τὰ ἴδια
  choice: それぞれ自分のところへ
  rationale: 各人に属する場所・物事・生活領域を指し得る広い表現であるため、「家」と限定せず、簡潔な日本語にした。曖昧さは脚注で補う。
- source_word: κἀμὲ μόνον ἀφῆτε
  choice: わたしを一人残す
  rationale: 弟子たちがイエスを後に残す意味を自然に表し、「見捨てる」として感情的・神学的含意を過度に強めない。
- source_word: καὶ οὐκ εἰμὶ μόνος
  choice: しかし、わたしは一人ではありません
  rationale: 接続詞が文脈上示す対照を明確にしつつ、弟子たちに一人残されることと、父の臨在ゆえに一人ではないことの緊張を保つ。
- source_word: ὅτι ὁ πατὴρ μετ’ ἐμοῦ ἐστιν
  choice: 父がわたしとともにおられるからです
  rationale: 理由を明示し、ヨハネ福音書で重要な関係的称号「父」と、その臨在を直接的に表す。
theological_decisions:
- issue: 弟子たちに一人残されることと父の臨在との関係
  choice: しかし、わたしは一人ではありません。父がわたしとともにおられるからです
  alternative: そして、わたしは一人ではありません。父がわたしとともにおられるからです
  rationale: 弟子たちによって実際に一人残されながらも、父の臨在ゆえに究極的には一人ではないという本文の緊張を保ち、後代の教理的結論を持ち込まない。
- issue: ἕκαστος の個別的・分配的意味
  choice: それぞれ自分のところへ
  alternative: 一人一人、自分の家へ
  rationale: 日本語では文法上の男性形を再現する必要がないため、個々の弟子を指す分配的意味を「それぞれ」で保持し、行き先を「家」に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、告別説教にふさわしい厳粛さを保った。敬体で統一し、「見よ」のような文語的表現は避けた。
