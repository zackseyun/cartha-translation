review_pass:
  verdict: revise
  source_fidelity: 本文の主要な意味はよく保持されている。受動態の「散らされ」、分配的な「それぞれ」、父の同伴による「一人ではない」という対照も適切である。ただし、「いや、もう来ています」はギリシア語の καὶ ἐλήλυθεν（「そして／しかも、すでに来ている」）を、先行する「来ます」を訂正・取り消す日本語として響かせうるため、現在形と完了形の意図的な緊張をより忠実に表す必要がある。
  naturalness: 全体として明瞭な現代標準日本語であり、告別説教にふさわしい落ち着いた調子である。「しかも、その時はすでに来ています」とすれば、不自然な自己訂正の印象を避けつつ、迫り来る時がすでに到来しているという強調を自然に伝えられる。
  terminology: 「父」「わたし」「あなたがた」「一人ではありません」は一貫しており、神学的用語の過剰な解釈もない。「自分のところへ」は τὰ ἴδια の広さを比較的よく保っており、脚注も適切に補足している。
  issues:
