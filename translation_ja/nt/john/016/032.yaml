    issue: 「いや、もう来ています」
    rationale: 「いや」は通常、直前の発言を否定または訂正する語であり、「時が来ます」と「すでに来ています」を対立させかねない。原文の καί は訂正ではなく、到来が目前であると同時にすでに始まっていることを並置・強調する。
