id: JHN.16.6
reference: John 16:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ὅτι ταῦτα λελάληκα ὑμῖν ἡ λύπη πεπλήρωκεν ὑμῶν τὴν καρδίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/006.yaml
  text: But because I have spoken these things to you[a], sorrow has filled your heart.
translation:
  language: ja
  text: しかし、わたしがこれらのことをあなたがたに話したので、悲しみがあなたがたの心を満たしています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、「あなたがた」は複数形ですが、「心」は単数形です。弟子たちが共有する一つの内面的な悲しみを表しているとも、それぞれの心を指しているとも取れます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の内容との対照を示す逆接として、現代日本語で自然かつ十分な重みがある。
- source_word: ὅτι
  choice: ので
  rationale: ここでは弟子たちの悲しみの理由を導く因果用法であり、日本語の文脈に自然に合う。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 複数形を保ち、イエスが直前まで語った一連の事柄を指す表現とした。
- source_word: λελάληκα
  choice: 話した
  rationale: λαλέωの発話行為を自然に表す。ギリシア語の完了形が示す現在への影響は、後半の『満たしています』と文脈によって伝わる。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 二人称複数を日本語で明示した。
- source_word: ἡ λύπη
  choice: 悲しみ
  rationale: 深い心痛を表しつつ、現代の一般読者に明瞭で、文脈の荘重さにも適する。
- source_word: πεπλήρωκεν
  choice: 満たしています
  rationale: πληρόωの基本的な比喩『満たす』を保持し、完了した結果が現在も続くという完了形の含意を自然な日本語で表した。
- source_word: ὑμῶν τὴν καρδίαν
  choice: あなたがたの心
  rationale: 複数の所有者に対する単数形καρδίανを保ち、弟子たちが共有する内面的状態という集合的な響きを残した。
theological_decisions:
- issue: 単数形の『心』を集合的に取るか、複数形の『心』として配分的に訳すか
  choice: あなたがたの心
  alternative: あなたがたの心々／あなたがた一人一人の心
  rationale: 原文は複数の所有代名詞に単数形のκαρδίανを伴う。日本語でも『あなたがたの心』は自然であり、集団が共有する悲しみという含みを保てる。個々人の心を指す理解も可能なので脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら荘重さを保った。原文の語順と比喩を可能な範囲で保持しつつ、ギリシア語完了形の継続的結果を日本語の『ています』で表現した。
