id: JHN.16.20
reference: John 16:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι κλαύσετε καὶ θρηνήσετε ὑμεῖς, ὁ δὲ κόσμος χαρήσεται· ⸀ὑμεῖς λυπηθήσεσθε, ἀλλ’ ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/020.yaml
  text: Truly[a], truly, I say to you, you will weep and mourn, but the world will rejoice; you will be grieved, but your grief will become joy.
translation:
  language: ja
  text: まことに、まことに、あなたがたに言います。あなたがたは泣き、嘆きますが、世は喜びます。あなたがたは悲しみますが、その悲しみは喜びに変わります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: イエスの厳粛で強い確言を、ヨハネ文書に特徴的な反復を保ちながら、明瞭で品位ある現代日本語で表した。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接の呼びかけを保ち、ヨハネ福音書で繰り返される定型表現を素直に訳した。
- source_word: κλαύσετε καὶ θρηνήσετε
  choice: 泣き、嘆きます
  rationale: 二つの動詞を一語にまとめず、涙を流すことと悲嘆を表すことの重なりを保持した。未来の事柄は、直前から続く予告として自然な日本語の非過去形で表した。
- source_word: ὁ δὲ κόσμος
  choice: しかし、世は
  rationale: κόσμοςを解釈的に限定せず、ヨハネ福音書の広がりと含意を保つ「世」とした。δέによる弟子たちとの対照も明示した。
- source_word: χαρήσεται
  choice: 喜びます
  rationale: 後半のχαράとの語彙的なつながりを保ち、弟子たちの悲しみとの鮮明な対照を示した。
- source_word: λυπηθήσεσθε
  choice: あなたがたは悲しみます
  rationale: 受動形は文脈上、悲しい状態になることを表すため、日本語として自然な「悲しみます」とした。後続のλύπηも「悲しみ」として語根の連関を保った。
- source_word: ἡ λύπη ὑμῶν εἰς χαρὰν γενήσεται
  choice: その悲しみは喜びに変わります
  rationale: εἰςとγίνομαιが示す状態の移行を自然に表現した。「あなたがたの悲しみ」は直前の文を受ける「その悲しみ」とし、冗長さを避けた。
theological_decisions:
- issue: ヨハネ福音書におけるκόσμοςの意味範囲
  choice: 「世」とし、説明を加えない
  alternative: 「不信仰な世の人々」「神に逆らう世」
  rationale: この箇所では弟子たちと対照される存在だが、語そのものの範囲を本文が明示していないため、解釈による限定を避けた。
- issue: 悲しみと喜びの関係
  choice: 「悲しみは喜びに変わります」
  alternative: 「悲しみに代わって喜びが来ます」
  rationale: 原文は単なる置き換えよりも、悲しみ自体が喜びへ至る変化を表し得る。εἰς χαρὰν γενήσεταιの緊張を保つため「変わります」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、イエスの確言にふさわしい厳粛さを保った。「まことに、まことに」の反復、「世」というヨハネ的用語、悲しみから喜びへの移行を逐語性と自然さの均衡を図って表現した。
