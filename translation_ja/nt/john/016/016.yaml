id: JHN.16.16
reference: John 16:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μικρὸν καὶ ⸀οὐκέτι θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/016.yaml
  text: A little while[a], and you no longer see me; and again a little while, and you will see me.
translation:
  language: ja
  text: あと少しすると、あなたがたはもうわたしを見ません。しかし、さらにあと少しすると、あなたがたは再びわたしを見ます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、前半と後半の「見る」に異なる動詞（θεωρέω と ὁράω）が使われています。ニュアンスの違いがある可能性はありますが、この節では時間的な対照が中心であるため、どちらも「見る」と訳しました。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μικρὸν
  choice: しばらくすると
  rationale: 中性単数形が副詞的に用いられ、短い時間の経過を表す。「しばらくすると」は時間的な短さと後続する変化を自然な現代日本語で伝える。
- source_word: οὐκέτι
  choice: もう…なくなります
  rationale: 現時点から先に状態が終わることを表す。現在形の θεωρεῖτε と結びつくため、日本語では「もう見なくなります」として自然に表現した。
- source_word: θεωρεῖτέ
  choice: 見なくなります
  rationale: θεωρέω には「眺める」「よく見る」という含みもあり得るが、ここでは基本義の「見る」が自然で、後半との不必要な意味の差を設けない。
- source_word: πάλιν
  choice: また
  rationale: 先の状態が後に逆転し、再び見ることになる時間的推移を簡潔に示す。
- source_word: ὄψεσθέ
  choice: 見るようになります
  rationale: ὁράω の未来形で、将来再び見ることを表す。日本語では前半との対照と状態の変化を自然に示すため「見るようになります」とした。
- source_word: με
  choice: わたしを
  rationale: 語り手であるイエスを指す直接目的語として明確に訳した。
- source_word: καὶ
  choice: そして／また
  rationale: 反復される καὶ が二つの時間的な節を結ぶ構造を、自然な日本語の接続で保った。
theological_decisions:
- issue: θεωρέω と ὁράω を異なる日本語動詞で訳し、見る仕方の違いを示すか
  choice: 本文では両方を「見る」と訳す
  alternative: 前者を「目にする」、後者を「見る」と訳し分ける
  rationale: 二つのギリシア語動詞にはニュアンスの違いがあり得るが、ヨハネ文書では意味の重なりも大きい。明確な神学的区別を本文に持ち込まず、この節で前面に出ている時間的対照を保つ。
- issue: 「見る」が何を指すかを本文で特定するか
  choice: 指示対象を説明せず、原文のまま曖昧さを保つ
  alternative: 死後の不在と復活後の再会を明示する
  rationale: 文脈上の解釈候補はあるが、この一節自体は出来事を明示していないため、訳文で特定しない。
translation_notes:
  register: イエスの発言として、明瞭で現代的ながら丁寧さと品位のある「です・ます」調を採用した。原文の「しばらく」の反復と二段階の時間構造を保ち、日本語として不自然な逐語訳は避けた。
