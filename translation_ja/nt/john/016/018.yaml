  text: So they were saying[a], “What is this that he says, ‘A little while’? We do not know what he is saying.”
translation:
  language: ja
  text: そこで彼らはこう言っていた。『「しばらくの間」と言っておられるのは、これはどういうことだろう。何を話しておられるのか、私たちには分からない。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 言い合っていた
  rationale: 未完了過去の継続・反復的な側面を保ちつつ、弟子たちの間で交わされた発言であるという文脈を自然な日本語で表す。
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの言葉を受けた反応であることを、現代日本語の自然な談話接続で示す。
- source_word: Τί ἐστιν τοῦτο
  choice: どういうことだろう
  rationale: 字義は「これは何か」だが、日本語では発言の意味をいぶかる問いとして自然であり、弟子たちの困惑を伝える。
- source_word: ὃ λέγει μικρόν
  choice: 『しばらくすると』と言っておられるのは
  rationale: ὃ λέγειを発言への言及として示し、μικρόνを周辺文脈に即した短い時間の表現として保つ。イエスに対する敬意は日本語の自然な待遇表現で示す。
- source_word: μικρόν
  choice: しばらくすると
  rationale: 時間的用法を明確にし、直前の節で繰り返される表現とのつながりを保つ。
- source_word: οὐκ οἴδαμεν
  choice: 私たちには分からない
  rationale: 現在の認識状態を表すοἶδαの否定を、明快で自然な日本語にする。
- source_word: τί λαλεῖ
  choice: 何を話しておられるのか
  rationale: λαλεῖを解釈的な「何を意味しているのか」に狭めず、発話そのものへの困惑として訳す。
