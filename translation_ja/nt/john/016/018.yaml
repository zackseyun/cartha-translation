  source_fidelity: 「しばらくすると」は直前の文脈には沿うものの、本節で弟子たちが引用している語は μικρόν（「しばらくの間／少しの間」）だけであり、「すると」を補うと引用句の形をやや具体化しすぎる。また「言い合っていた」は相互の言い争いを含意し得るため、ἔλεγον の未完了過去が示す反復的な発言には「こう言っていた」のほうが中立的である。
  naturalness: 改訂文は明快な現代標準日本語として自然であり、弟子たちの困惑を会話文として保つ。「これはどういうことだろう」は Τί ἐστιν τοῦτο の指示的な問いを明示する。
  terminology: 特別な神学用語はない。イエスへの「おられる」は日本語の聖書本文として自然な敬意表現であり、意味を付加しない。
  issues:
