  text: and concerning righteousness[a], because I am going to the Father and you no longer see me.
translation:
  language: ja
  text: また、義[a]については、わたしが父のもとへ行き、あなたがたはもうわたしを見なくなるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義」。ギリシア語は、正しさと公正の両方を表し得る。ここでは、イエスが父のもとへ行くことによってその正しさが明らかにされるという文脈から、本文を「義」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δικαιοσύνης δέ
  choice: また、義についてとは
  rationale: δέは前後の項目をつなぐ添加的な語として「また」とし、反復されるπερίの構造を「〜についてとは」で明確にした。δικαιοσύνηは文脈上、イエスが父のもとへ行くことによって示される正しさ・正当性を含むため、簡潔で聖書語として定着した「義」とした。
- source_word: ὅτι
  choice: 〜からです
  rationale: ここでは理由を導く因果的用法と理解し、現代日本語として自然な説明表現にした。
- source_word: πρὸς τὸν πατέρα
  choice: 父のもとへ
  rationale: 移動を表すὑπάγωに伴うπρόςの方向性を「〜へ」で示し、定冠詞を伴う関係的称号πατήρは「父」とした。
- source_word: ὑπάγω
  choice: 行き
  rationale: 現在形が文脈上、間近な将来の移動を指すことを、日本語では自然な非過去形「行く」で表した。
- source_word: οὐκέτι θεωρεῖτέ με
  choice: あなたがたがもはやわたしを見なくなる
  rationale: οὐκέτιの継続停止を「もはや〜なくなる」で表し、θεωρέωはここでは視覚的に見る意味を中心として「見る」とした。
theological_decisions:
- issue: δικαιοσύνηの訳語
  choice: 義
  alternative: 正義／正しさ
  rationale: δικαιοσύνηには道徳的正しさ、公正、正当性という幅がある。「義」はその神学的・文脈的な広がりを保ち、父のもとへ行くイエスの正しさが明らかにされる含意にも適合する。別訳「正義」を脚注に残し、意味を一つに限定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「父のもとへ」は自然な関係表現と方向性を両立させた。「義」は一般読者にはやや専門的だが、脚注で意味の幅を補った。
