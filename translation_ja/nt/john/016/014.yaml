id: JHN.16.14
reference: John 16:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκεῖνος ἐμὲ δοξάσει, ὅτι ἐκ τοῦ ἐμοῦ λήμψεται καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/014.yaml
  text: He will glorify me[a], because he will take from what is mine and declare it to you.
translation:
  language: ja
  text: その方は私の栄光を現します。私のものから受け取り[a]、それをあなたがたに知らせるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私のものから取り」
    reason: λήμψεται は「受け取る」のほか「取る」とも訳せる。
lexical_decisions:
- source_word: ἐκεῖνος
  choice: その方
  rationale: 直前の文脈にある真理の霊を指す。指示代名詞の働きを保ちつつ、現代日本語で人格的な指示として自然にした。
- source_word: ἐμὲ δοξάσει
  choice: 私に栄光を与えます
  rationale: ヨハネ文書における δοξάζω の神学的な重みを保ち、単なる「尊敬する」「ほめる」に狭めない表現とした。
- source_word: ὅτι
  choice: からです
  rationale: ここでは、御霊がイエスに栄光を与える理由を示す因果関係として理解した。
- source_word: ἐκ τοῦ ἐμοῦ
  choice: 私のものから
  rationale: 中性の冠詞と所有形容詞から成る表現を、教え・権威・啓示などに限定せず、原文の広がりを保って訳した。
- source_word: λήμψεται
  choice: 受け取り
  rationale: λαμβάνω は「取る」と「受ける」の双方が可能だが、この文脈では「私のものから受け取る」が自然であり、御霊とイエスとの関係を不必要に能動的な取得として描かない。
- source_word: ἀναγγελεῖ ὑμῖν
  choice: それをあなたがたに告げる
  rationale: 先行句を目的語として補い、弟子たちへの伝達・告知という意味を明瞭にした。ὑμῖν の複数性は「あなたがた」で明示した。
theological_decisions:
- issue: 「ἐκ τοῦ ἐμοῦ λήμψεται」における御霊とイエスの関係
  choice: 私のものから受け取り
  alternative: 私から受け取る／私に属するものを受け取る
  rationale: 御霊が御子に属するものを伝えるという広いヨハネ的意味を保ち、後代の教理的定式を本文に持ち込まないようにした。
- issue: δοξάζω の訳語
  choice: 栄光を与える
  alternative: 栄光を現す／あがめる
  rationale: イエスの意義を明らかにする含意を保ちながら、原語の基本的な神学語彙との対応を維持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬体で統一した。「その方」は御霊への人格的な言及とギリシア語の指示性を両立させる。脚注記号は節末に置き、語彙上の別訳が文全体に関わることを示した。
