source:
  edition: SBLGNT
  text: καὶ ἐλθὼν ἐκεῖνος ἐλέγξει τὸν κόσμον περὶ ἁμαρτίας καὶ περὶ δικαιοσύνης καὶ περὶ κρίσεως·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/008.yaml
  text: And when that one comes[c][b][a], he will convict the world concerning sin and concerning righteousness and concerning judgment.
translation:
  language: ja
  text: その方が来ると、世に、罪について、義について、また裁きについて、その誤りを明らかにする。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その誤りを明らかにする」は、「誤っていることを示す」「責めを明らかにする」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: 来ると
  rationale: アオリスト分詞の時間的な働きを、自然な現代日本語の条件・時を表す形で訳した。
- source_word: ἐκεῖνος
  choice: その方
  rationale: 直前の文脈にある弁護者を指す強意的な指示代名詞。単なる「彼」より指示性を保ちつつ、人物を指す自然で丁寧な日本語とした。
- source_word: ἐλέγξει
  choice: 誤りを明らかにする
  rationale: 罪責を暴き、誤っていることを示す語義を表す。「有罪とする」では判決そのものと誤解されやすく、「悟らせる」では内面的な自覚に狭めすぎるため、この表現を選んだ。
- source_word: τὸν κόσμον
  choice: 世
  rationale: ヨハネ文書で広い神学的含意を持つ κόσμος を、解釈的に「世の人々」などへ限定せず保持した。
- source_word: περὶ
  choice: 〜について
  rationale: 三度反復される前置詞の並行構造を、日本語でも明示した。
- source_word: ἁμαρτίας
  choice: 罪
  rationale: 単数形を保ち、次節の説明に委ねた。
- source_word: δικαιοσύνης
  choice: 義
  rationale: 神との正しい関係、正しさ、正義を含み得る語として、聖書日本語で定着しつつ簡潔な「義」を採用した。
- source_word: κρίσεως
  choice: 裁き
  rationale: 法廷的・終末論的な幅を保ち、結果としての「断罪」に限定しない訳語とした。
theological_decisions:
- issue: ἐκεῖνος の指示対象と強意
  choice: 文脈上の弁護者を指す「その方」
  alternative: 「彼」または「その者」
  rationale: 指示代名詞の強調を保ちながら、人格的な指示対象を自然な日本語で表した。性質や位格について本文以上の説明は加えていない。
- issue: ἐλέγξει の作用
  choice: 世の誤りを明らかにする
  alternative: 世に罪を認めさせる／世を有罪とする
  rationale: 原語は暴露、反証、譴責、罪責の立証にまたがり得る。「認めさせる」は世の内面的反応を確定し、「有罪とする」は判決へ狭めるため、より広い表現を本文に置いた。
- issue: δικαιοσύνη の訳
  choice: 義
  alternative: 正しさ／正義
  rationale: 直後のキリスト論的説明とのつながりを保ちつつ、法的な正義だけに限定しないため。
translation_notes:
  register: 明瞭で格調ある現代標準語。「罪について、義について、また裁きについて」という三項の反復を保ち、原文の修辞的並行性を再現した。
