  terminology: 「罪」「義」「裁き」は、日本語聖書で確立した対応語であり、δικαιοσύνη と κρίσις の意味の幅を不必要に限定しない。「義」は日常語としては専門性があるが、直後の文脈と聖書用語としての安定性を考慮すれば維持できる。
