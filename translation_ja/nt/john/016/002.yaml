id: JHN.16.2
reference: John 16:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀποσυναγώγους ποιήσουσιν ὑμᾶς· ἀλλ’ ἔρχεται ὥρα ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς δόξῃ λατρείαν προσφέρειν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/002.yaml
  text: They will make you outcasts from the synagogues[a]; indeed[b], an hour is coming when everyone who kills you will think he is offering service to God.
translation:
  language: ja
  text: 人々はあなたがたを会堂から追放します[a]。しかも、あなたがたを殺す者は皆、それによって神に奉仕をささげていると思う時が来ます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「会堂から締め出します」。ここでの「会堂」は、建物だけでなく、その礼拝共同体をも指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「奉仕」は「礼拝」、または「宗教的奉仕」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποσυναγώγους ποιήσουσιν ὑμᾶς
  choice: 人々はあなたがたを会堂から追放します
  rationale: 述語形容詞とποιέωの使役構文を、現代日本語で自然な「会堂から追放する」とした。「会堂」は単なる建物ではなく、ユダヤ人の礼拝共同体からの排除も含み得る。
- source_word: ἀλλ’
  choice: しかも
  rationale: 単純な逆接ではなく、追放から殺害へと迫害が激化することを示すため、「しかし」よりも累加・強調に適した「しかも」とした。
- source_word: ἔρχεται ὥρα
  choice: 時が来ます
  rationale: ヨハネ文書の表現を保ちつつ、日本語で不自然な「一つの時」を避けた。
- source_word: ἵνα πᾶς ὁ ἀποκτείνας ὑμᾶς
  choice: あなたがたを殺す者が皆
  rationale: ἵναはここで来る時の内容を導く。πᾶςと単数分詞の普遍的・総称的な意味を「者が皆」で表した。
- source_word: δόξῃ
  choice: 思う
  rationale: 行為者の主観的な判断・思い込みを、明快な現代日本語で表した。
- source_word: λατρείαν προσφέρειν τῷ θεῷ
  choice: 神に礼拝をささげている
  rationale: λατρείαの神に向けた宗教的奉仕・礼拝の意味と、προσφέρεινの「ささげる」という方向性を一つの自然な表現にまとめた。
theological_decisions:
- issue: 迫害者の自己理解を宗教的・祭儀的な言葉でどう表すか
  choice: 神に礼拝をささげている
  alternative: 神に奉仕している／神に宗教的奉仕をささげている
  rationale: 殺害を神への正当な宗教行為だと本人が誤認する衝撃的な皮肉を保つ。「礼拝」はλατρείαの祭儀的含意を明確にするが、「奉仕」も語義上可能なので脚注に示した。
- issue: πᾶς ὁ ἀποκτείναςの総称性
  choice: あなたがたを殺す者が皆
  alternative: あなたがたを殺す者はだれでも
  rationale: 原文の単数形による総称を自然な日本語で保持した。日本語では性別を明示する代名詞が不要であり、原文にない男性限定を持ち込まない。
- issue: 殺害そのものと礼拝の関係
  choice: それによって神に礼拝をささげている
  alternative: 神に礼拝をささげている
  rationale: 殺害行為を礼拝・奉仕として理解する構文上の関係を明確にした。「それによって」は説明的補足だが、原文の意味を解消せず、誤読を防ぐ。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「あなたがた」により複数二人称を明示した。文体は丁寧体で統一し、迫害の段階的激化が伝わるよう二文構成とした。
