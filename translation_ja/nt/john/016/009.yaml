lexical_decisions:
- source_word: περὶ ἁμαρτίας μέν
  choice: 罪についてとは
  rationale: περί＋属格が示す第一の論点を明示し、μένが10–11節へ続く列挙の第一項をなす働きは、日本語の構文によって表した。ἁμαρτίαςは単数の抽象名詞なので「罪」とした。
- source_word: ὅτι
  choice: からである
  rationale: 直前の「罪について」を説明する理由・根拠として自然に読めるよう、因果を表す訳を採用した。ただし同格的に「ということ」とも理解できるため、脚注に残した。
- source_word: οὐ πιστεύουσιν
  choice: 信じない
  rationale: 現在能動直説法が示す不信の現実を、現代日本語で簡潔かつ自然に表した。
- source_word: εἰς ἐμέ
  choice: わたしを信じる
  rationale: ヨハネ文書で人に向けられる信頼を表す πιστεύω εἰς を、日本語の自然な結合である「人を信じる」とした。
theological_decisions:
- issue: この節で指摘される罪の性質
  choice: この文脈での「罪」を、イエスを信じないことによって説明する。
  alternative: 人間の罪一般を指し、イエスを信じないことをその一例と見る。
  rationale: ὅτι以下は「罪について」を直接説明している。より広い教理的定式へ展開せず、本文にある結び付きを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、短い列挙文としての格調を保った。「わたし」は本文中のイエスの一人称として平仮名表記とした。
