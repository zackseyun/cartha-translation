id: JHN.16.19
reference: John 16:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἔγνω Ἰησοῦς ὅτι ἤθελον αὐτὸν ἐρωτᾶν, καὶ εἶπεν αὐτοῖς· Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων ὅτι εἶπον· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/019.yaml
  text: Jesus knew that they wanted to ask him[a], and he said to them, “Are you discussing this with one another, that I said, ‘A little while, and you no longer see me, and again a little while[c][b], and you will see me’?”
translation:
  language: ja
  text: イエスは、彼らがイエスに尋ねようとしていることを知り、彼らに言われた。「『しばらくすると、あなたがたはわたしを見なくなる。またしばらくすると、わたしを見る』とわたしが言ったことについて[a]、互いに話し合っているのですか。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「とわたしが言ったことについて」は、「とわたしが言ったので」とも訳せる。ギリシア語の接続詞は、話し合っている内容を示すとも、その理由を示すとも理解できる。
    reason: alternative_reading
  - marker: b
    text: 原文では、最初の「見る」と後の「見る」に異なる動詞が使われている。前者には「見つめる、観察する」の含みがあり、後者は一般的な「見る」を表すが、ここでは両方を「見る」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔγνω
  choice: 知り
  rationale: アオリスト形は、弟子たちの意向をイエスが察知したことを表す。現代日本語では「知り」が簡潔で自然。
- source_word: ἤθελον αὐτὸν ἐρωτᾶν
  choice: 自分に尋ねたがっている
  rationale: 継続中の意向を表す未完了過去を「尋ねたがっている」で自然に示す。「自分」は主語であるイエスを指す。
- source_word: Περὶ τούτου ζητεῖτε μετ’ ἀλλήλων
  choice: そのことを互いに尋ね合っているのですか
  rationale: ζητέωの基本的な探求の含みと、弟子たちが互いに意味を確かめようとしている文脈をともに保つ。丁寧形は、威圧的でない問いかけとして自然。
- source_word: ὅτι εἶπον
  choice: わたしが……と言ったので
  rationale: ὅτιを理由を導く接続詞として訳した。内容を導く「……と言ったことについて」という理解も可能なので脚注に示す。
- source_word: Μικρὸν
  choice: しばらくすれば
  rationale: 時間的な短い間隔を示す慣用表現として、明瞭な日本語にした。
- source_word: οὐ θεωρεῖτέ με
  choice: わたしを見なくなる
  rationale: 直訳的な現在形「見ない」よりも、時間表現に続く予告として自然であり、目前に迫る視認の停止を表す。
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: またしばらくすれば、わたしを見る
  rationale: πάλινによる次の段階と、未来形ὄψεσθεを自然な日本語で示す。日本語では時間節に続く主節の非過去形が未来を表せる。
theological_decisions:
- issue: θεωρέωとὁράωという二つの「見る」動詞の違い
  choice: 本文では両方を「見る」と訳す
  alternative: 前者を「見つめる／目にする」、後者を「見る」と訳し分ける
  rationale: ここでの中心は、一時的に見えなくなった後で再び見るという対比にある。日本語で不自然な意味の差を作らず、原語の語彙上の違いは脚注に残す。
- issue: ὅτιの機能
  choice: 理由を示す「……と言ったので」
  alternative: 話題・内容を示す「……と言ったことについて」
  rationale: 問いの対象と原因が重なり得る構文であり、理由として読むのが自然だが、原文の曖昧さを脚注で保持する。
- issue: イエスの発話の力
  choice: 実際の問いとして「……いるのですか」
  alternative: 確認的な叙述「……尋ね合っているのですね」
  rationale: ギリシア語本文の疑問文を保ち、弟子たちの内輪の話し合いを明るみに出す問いかけとして訳す。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体を基調とした。引用内のイエスの問いは「ですか」として穏やかな問いかけを表現した。「あなたがた」「わたし」は聖書本文として通用する平明な語形を用いた。脚注記号[a][b]は、関連する問い全体の末尾に置いた。
