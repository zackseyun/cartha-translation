  to: イエスは、彼らがイエスに尋ねようとしていることを知り、彼らに言われた。「『しばらくすると、あなたがたはわたしを見なくなる。またしばらくすると、わたしを見る』とわたしが言ったことについて[a]、互いに話し合っているのですか。[b]」
