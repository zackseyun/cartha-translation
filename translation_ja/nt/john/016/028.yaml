id: JHN.16.28
reference: John 16:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξῆλθον ⸀ἐκ τοῦ πατρὸς καὶ ἐλήλυθα εἰς τὸν κόσμον· πάλιν ἀφίημι τὸν κόσμον καὶ πορεύομαι πρὸς τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/028.yaml
  text: I came from the Father and have come into the world. Again[a], I am leaving the world and going to the Father.
translation:
  language: ja
  text: わたしは父から出て[a]、世に来た。再び、世を去って父のもとへ行く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「父のもとから出て」。
    reason: ἐξῆλθον ἐκ τοῦ πατρὸςは、父を起点として出ることを表す。「父から出て」と「父のもとから出て」は、いずれもその意味を自然な日本語で表す。
lexical_decisions:
- source_word: ἐξῆλθον ἐκ τοῦ πατρὸς
  choice: 父のもとを出て
  rationale: ἐξέρχομαιとἐκが表す、父を起点とする移動を簡潔に保つ。「父から来た」よりも「出る」の要素を明示しつつ、現代日本語として自然な形にした。
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: 世に来た
  rationale: 完了形が示す、すでに成し遂げられ現在にも関わる到来を、日本語では自然な過去形で表した。εἰςによる世界への進入も「世に来た」で文脈上十分に伝わる。
- source_word: πάλιν
  choice: 今また
  rationale: 前半の父から世への移動に続き、今度は世から父へ向かう対照的な動きを示す。「再び」だけより自然で、発話時点で迫る移動も伝える。
- source_word: ἀφίημι τὸν κόσμον
  choice: 世を去って
  rationale: ここでのἀφίημιは世界を後にする意味。「捨てる」という不要な含意を避け、目前の離去を自然に表した。
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: 父のもとへ行く
  rationale: πρόςが示す父への方向を明確にし、原文にない教理的説明を加えずに訳した。
theological_decisions:
- issue: イエスが父から出て来たという発言の含意
  choice: 父を起点とするイエスの来訪と、父への帰還を原文どおり直接表す。
  alternative: 単に「神から遣わされた」と意訳する、または先在・受肉について説明的な語句を補う。
  rationale: 本文は父から世へ、世から父へという動きを述べる。高いキリスト論的含意を弱めず、同時に本文が明言しない教理的説明も付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」はヨハネ福音書におけるイエスの発言として自然で、「父」「世」という主要語を一貫して簡潔に示した。
