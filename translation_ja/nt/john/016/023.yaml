id: JHN.16.23
reference: John 16:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐμὲ οὐκ ἐρωτήσετε οὐδέν· ἀμὴν ἀμὴν λέγω ὑμῖν, ⸂ἄν τι⸃ αἰτήσητε τὸν πατέρα ⸂δώσει ὑμῖν ἐν τῷ ὀνόματί μου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/023.yaml
  text: And in that day you will ask me nothing[a]. Truly, truly, I say to you, whatever you ask the Father in my name[b], he will give to you.
translation:
  language: ja
  text: その日には、あなたがたはわたしに何も尋ねません。[a] まことに、まことに、あなたがたに言います。あなたがたがわたしの名によって父に何かを願い求めるなら、父はそれをあなたがたに与えます。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節では、二つの異なるギリシア語動詞が使われている。前半のἐρωτάωはイエスに問い尋ねることを、後半のαἰτέωは父に願い求めることを表す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「わたしの名によって」は文末に置かれているため、「父はわたしの名によってそれをあなたがたに与えます」と理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: その日には
  rationale: ヨハネ文書に特徴的な時を示す表現を保ちつつ、現代日本語として自然にした。
- source_word: ἐμὲ οὐκ ἐρωτήσετε οὐδέν
  choice: あなたがたはわたしに何も尋ねません
  rationale: ἐρωτάωはこの文脈で、イエスに問い尋ねることを指す。後半の願い求める行為との違いも日本語で自然に示せる。
- source_word: ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: 強調された反復を省かず、ヨハネ福音書におけるイエスの荘重な導入句を明瞭な日本語で保った。
- source_word: ἄν τι αἰτήσητε
  choice: 何かを願い求めるなら
  rationale: 不定の内容を伴う条件的な表現を保った。「願い求める」により、前半のἐρωτάωとの語義上の差も示した。
- source_word: τὸν πατέρα
  choice: 父に
  rationale: 原文には所有代名詞がないため、「わたしの父」とは補わず、定冠詞を伴う「父」とした。
- source_word: δώσει ὑμῖν
  choice: 父はそれをあなたがたに与えます
  rationale: 動詞の主語である父を日本語で明示し、目的語は直前の願いの内容を受ける「それ」で自然に補った。
- source_word: ἐν τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: 単なる発言上の定型句に狭めず、イエスの名に基づき、その権威と結びついて願うという含みを保持できる標準的な表現を選んだ。
theological_decisions:
- issue: イエスに尋ねること（ἐρωτάω）と父に願い求めること（αἰτέω）の区別
  choice: 前者を「尋ねる」、後者を「願い求める」と訳した。
  alternative: 両方を「求める」または「尋ねる」と訳し、違いを注でのみ説明する。
  rationale: 日本語では不自然にならずに二つの動詞の違いを表せる。前半は質問、後半は願い・請願という文脈上の対照も保たれる。
- issue: 「わたしの名によって」の係り先
  choice: 本文では、父に願い求める行為に係るものとして訳した。
  alternative: 「父はわたしの名によって、それをあなたがたに与えます」とし、与える行為に係るものとして訳す。
  rationale: 提示された本文の語順上のまとまりと広く採られる読みを本文に置いたが、写本上の語順差により別の係り方も可能なので注記した。
- issue: 祈りの約束の範囲
  choice: 本文が述べる約束をそのまま訳し、追加の条件を加えなかった。
  alternative: 「わたしの御心にかなうものなら」など、他の箇所から解釈上の限定を補う。
  rationale: この節に明記されていない神学的条件を翻訳本文へ持ち込まず、約束の強さと解釈上の緊張を保つため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「まことに、まことに」の反復で原文の荘重さを保った。イエスの発言は一貫して丁寧体とし、過度に古風な「よくよく」や、解釈を狭める言い換えは避けた。
