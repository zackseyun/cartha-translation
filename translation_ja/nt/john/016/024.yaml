  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἕως ἄρτι οὐκ ᾐτήσατε οὐδὲν ἐν τῷ ὀνόματί μου· αἰτεῖτε καὶ λήμψεσθε, ἵνα ἡ χαρὰ ὑμῶν ᾖ πεπληρωμένη.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/024.yaml
  text: Until now you have asked for nothing in my name[a]. Ask, and you will receive[c][b], so that your joy may be full.
translation:
  language: ja
  text: 今まで、あなたがたはわたしの名によって[a]何も求めたことがありません。求めなさい[b]。そうすれば、あなたがたは受け取ります。あなたがたの喜びが満たされる[c]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの名によって」は、イエスの人格、権威、使命との関係において願い求めることを表しうる。本文は意味を一つに限定せず、原文の表現を保っている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「求め続けなさい」。現在命令法は、文脈上、継続または反復される行為を含みうる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「完全なものとなる」。原文は、喜びが満たされた状態になることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕως ἄρτι
  choice: 今まで
  rationale: 現在に至るまでの時を示す自然で明確な現代日本語。
- source_word: οὐκ ᾐτήσατε οὐδὲν
  choice: 何も求めたことがありません
  rationale: 「今まで」と結びつく過去の経験を自然に表し、αἰτέωを単なる質問ではなく願い求める行為として訳した。
- source_word: ἐν τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: イエスの人格、権威、使命との関係を含みうる豊かな表現を、一つの解釈に限定せず保持する。
- source_word: αἰτεῖτε
  choice: 求めなさい
  rationale: 命令の力を明確にしつつ、現在命令法が含みうる継続・反復の意味は脚注に残した。
- source_word: καὶ λήμψεσθε
  choice: そうすれば、あなたがたは受け取ります
  rationale: 命令に続く結果・約束として自然な日本語にし、未来形の確かさを「受け取ります」で表した。
- source_word: ἵνα
  choice: ためです
  rationale: 目的または意図された結果を簡潔に示す。
- source_word: ἡ χαρὰ ὑμῶν
  choice: あなたがたの喜び
  rationale: 複数二人称の所有関係を明示した。
- source_word: ᾖ πεπληρωμένη
  choice: 満ちる
  rationale: 満たされた状態に至るという完了的な含みを、ヨハネ文書に特徴的な「満ちる」という表象を保ちながら自然に表した。
theological_decisions:
- issue: 「わたしの名によって」の意味
  choice: 比喩を保持して「わたしの名によって」と訳す
  alternative: わたしの権威によって／わたしの代理として／わたしと結ばれて
  rationale: この句はイエスの人格、権威、使命などとの関係を含みうるため、本文で一つの教理的説明に狭めない。
- issue: 求めることと受け取ることの関係
  choice: 「そうすれば」で命令に続く約束として表す
  alternative: 「求め、そして受け取りなさい」に近い並列表現
  rationale: λήμψεσθεは未来形であり、受け取ることを第二の命令とはせず、求めることに続く約束として示す。
- issue: 喜びの充満
  choice: 「喜びが満ちる」
  alternative: 「喜びが完全なものとなる」
  rationale: πληρόωの充満の比喩を保ち、「完全」を意味する別の語であるかのように限定しない。
translation_notes:
  register: 明快な現代標準日本語を用い、語りかけの厳粛さを保った。「わたし」はイエスの発言として柔らかさと品位を両立させ、「あなたがた」で複数形を明示した。
