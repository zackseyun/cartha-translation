source:
  edition: SBLGNT
  text: εἶπαν οὖν ἐκ τῶν μαθητῶν αὐτοῦ πρὸς ἀλλήλους· Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν· Μικρὸν καὶ οὐ θεωρεῖτέ με, καὶ πάλιν μικρὸν καὶ ὄψεσθέ με; καί· ⸀Ὅτι ὑπάγω πρὸς τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/016/017.yaml
  text: 'So some of his disciples said to one another[a], “What is this that he is saying to us: ‘A little while, and you will not see me, and again a little while, and you will see me’? And, ‘Because I am going to the Father’?”'
translation:
  language: ja
  text: そこで、弟子たちのうちの何人かが互いに言った。「『しばらくすれば、あなたがたは私を見なくなる。また、しばらくすれば、私を見るようになる』と、私たちに言っておられるのは、どういうことだろう。また、『私が父のもとへ行くからだ』[a]とは、どういうことだろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私が父のもとへ行くということ」。ギリシア語の接続詞は、引用内容を導くとも、理由を表す（「から」）とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの言葉を受けた推論的・物語的な展開を、自然な現代日本語で示す。
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 弟子たちのうちの何人か
  rationale: ἐκの部分属格的な意味を反映し、弟子全員ではなく、その中の一部であることを明示する。
- source_word: πρὸς ἀλλήλους
  choice: 互いに
  rationale: 弟子たちの間で交わされた相互的な会話を簡潔に表す。
- source_word: Τί ἐστιν τοῦτο ὃ λέγει ἡμῖν
  choice: 私たちに言っておられるのは、どういうことだろう
  rationale: 弟子たちの困惑を自然な疑問文で表しつつ、λέγει ἡμῖνの現在的な発言を保つ。
- source_word: Μικρὸν
  choice: しばらくすれば
  rationale: ここでは時間的用法であり、短い時の経過を自然な日本語で表す。
- source_word: θεωρεῖτέ με
  choice: 私を見なくなる
  rationale: 視覚・知覚の基本的意味を明確に表す。後続のὄψεσθέ μεとの修辞的な対応も「見る」で保つ。
- source_word: πάλιν μικρὸν καὶ ὄψεσθέ με
  choice: しかしまた、しばらくすれば私を見るようになる
  rationale: πάλινの反復と、未来形ὄψεσθέの意味を自然な日本語で表現する。καίの対照的な流れは「しかし」で明瞭にした。
- source_word: Ὅτι ὑπάγω πρὸς τὸν πατέρα
  choice: 私が父のもとへ行くからだ
  rationale: ὅτιの因果的意味を本文に採用し、直前の発言内容として引用する。ただし内容導入の「私が父のもとへ行くということ」とも解し得るため、脚注で保持する。
- source_word: τὸν πατέρα
  choice: 父
  rationale: ギリシア語は「私の父」ではなく定冠詞を伴う「父」であり、他箇所から所有表現を補わない。
theological_decisions:
- issue: イエスが去り、再び見られることの指示対象
  choice: 弟子たちの疑問をそのまま保ち、具体的な出来事を特定しない
  alternative: 死と復活、昇天と霊的臨在、復活後の顕現のいずれかに特定する
  rationale: この節自体は弟子たちの困惑を描いており、発言の指示対象を解決していないため、訳文で特定しない。
- issue: ὅτιの機能
  choice: 因果を表す「からだ」
  alternative: 引用内容を導く「ということ」
  rationale: 直前の16節とのつながりでは因果的理解が自然だが、ギリシア語は内容導入とも解釈できるため、その曖昧さを脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「言っておられる」はイエスへの敬意を自然に示しつつ、過度に古風な敬語を避ける。引用の入れ子はかぎ括弧と二重かぎ括弧で整理した。
