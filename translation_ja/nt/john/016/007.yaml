id: JHN.16.7
reference: John 16:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ἐγὼ τὴν ἀλήθειαν λέγω ὑμῖν, συμφέρει ὑμῖν ἵνα ἐγὼ ἀπέλθω. ἐὰν ⸀γὰρ μὴ ἀπέλθω, ὁ παράκλητος ⸂οὐ μὴ ἔλθῃ⸃ πρὸς ὑμᾶς· ἐὰν δὲ πορευθῶ, πέμψω αὐτὸν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/007.yaml
  text: 'But I am telling you the truth: it is better for you that I go away. For if I do not go away[a], the Advocate will certainly not come to you; but if I go, I will send him to you.'
translation:
  language: ja
  text: しかし、わたしはあなたがたに真実を言います。わたしが去ることは、あなたがたのためになるのです。なぜなら、もしわたしが去らなければ、弁護者[a]は決してあなたがたのところに来ません。しかし、わたしが行けば、わたしはその方をあなたがたのところに遣わします。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「助け主」「助言者」「慰め主」。ギリシア語は「パラクレートス」。
    reason: παράκλητοςの広い意味範囲を一つの日本語だけでは十分に表せないため。
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の弟子たちの悲しみとの対照を、自然で明確な逆接として示す。
- source_word: τὴν ἀλήθειαν λέγω ὑμῖν
  choice: わたしはあなたがたに真実を言います
  rationale: 真実であることを強く表明する原文の言い回しを、現代日本語で率直に保つ。
- source_word: συμφέρει ὑμῖν
  choice: あなたがたのためになる
  rationale: 利益・益となることを表す動詞の意味を、平明で自然な日本語にする。
- source_word: ἵνα ἐγὼ ἀπέλθω
  choice: わたしが去ること
  rationale: 何が弟子たちの益となるのかを示す内容節として訳し、続く同じ動詞との反復も保つ。
- source_word: ἐὰν γὰρ μὴ ἀπέλθω
  choice: わたしが去らなければ
  rationale: 条件構文とἀπέλθωの反復を維持する。γάρの説明的関係は、前後の自然な論理展開によって表す。
- source_word: ὁ παράκλητος
  choice: 弁護者
  rationale: ヨハネ文書における代理・擁護の含意を保ちつつ、人格的な働きを示す語として採用する。ただし意味範囲が広いため別訳を脚注に示す。
- source_word: οὐ μὴ ἔλθῃ
  choice: 決して……来ません
  rationale: οὐ μήと接続法による強い否定を、明瞭な現代日本語で表す。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのところに
  rationale: 弟子たちのもとへ向かう動きを自然な日本語で表現する。
- source_word: ἐὰν δὲ πορευθῶ
  choice: しかし、わたしが行けば
  rationale: 前の否定条件との対照を示し、πορεύομαιを文脈に即した平明な「行く」とする。
- source_word: πέμψω αὐτὸν
  choice: わたしはその方を……遣わします
  rationale: πέμπωを「遣わす」とし、αὐτόνが人格的な παράκλητος を指すことを敬意ある日本語の「その方」で示す。
theological_decisions:
- issue: ヨハネ文書におけるπαράκλητοςの訳語
  choice: 弁護者
  alternative: 助け主、助言者、慰め主、パラクレートス
  rationale: この語はイエスに代わって来る人格的な働き手を指し、擁護・援助・助言・慰めに及ぶ意味範囲を持つ。一語で尽くせないため、本文では代表・擁護の側面をよく示す「弁護者」を用い、他の可能性を脚注に残す。
- issue: παράκλητοςへの人格的言及
  choice: その方
  alternative: それ
  rationale: 原文のαὐτόνは男性形でπαράκλητοςを受け、文脈でも遣わされて来る人格的主体として描かれるため、非人格的な「それ」を避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な語り口にふさわしい品位を保った。「あなたがた」を用いて複数形を明示し、「去る」の反復と強い否定を保持した。
