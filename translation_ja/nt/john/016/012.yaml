  text: Ἔτι πολλὰ ἔχω ⸂ὑμῖν λέγειν⸃, ἀλλ’ οὐ δύνασθε βαστάζειν ἄρτι·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/012.yaml
  text: I still have many things to say to you[a], but you are not able to bear them now.
translation:
  language: ja
  text: あなたがたにまだ話すことがたくさんある。しかし、あなたがたは今、それらを受け止めることができない[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「今はそれらに耐えることができない」「今はそれらを担うことができない」。ギリシア語の動詞には、担う、耐える、持ちこたえるという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔτι πολλὰ ἔχω
  choice: まだたくさんある
  rationale: ἔτιの継続・追加の意味と、実体詞的に用いられた中性複数 πολλὰ の「多くのこと」を、自然な現代日本語で表した。ἔχω＋不定詞は、これからすべきことが残っているという含みを持つ。
- source_word: ὑμῖν λέγειν
  choice: あなたがたに話すべきこと
  rationale: 与格 ὑμῖν を「あなたがたに」、広い意味の λέγειν を「話す」とした。「べき」は義務の強調ではなく、ἔχω＋不定詞が示す、なお話すことがあるという未完了性を日本語で自然に表す。
- source_word: ἀλλ’ οὐ δύνασθε
  choice: しかし、今のあなたがたには……きれない
  rationale: ἀλλάの対照を「しかし」で示し、δύνασθε の能力・可能性の否定を「今のあなたがたには」と「きれない」の組み合わせで表した。
- source_word: βαστάζειν
  choice: 受け止めきれない
  rationale: βαστάζω の「担う、耐える」という比喩的な重みを保ちつつ、教えを理解し、受容し、耐える能力を含み得る自然な日本語とした。単に「理解できない」として意味を知的理解だけに限定しない。
- source_word: ἄρτι
  choice: 今
  rationale: 後続節で語られる将来との対照を、簡潔で自然な時間表現によって示した。
theological_decisions:
- issue: 弟子たちが現在 βαστάζειν できないとは何を意味するか
  choice: さらなる教えを今は受け止めきれない
  alternative: 今は十分に理解できない／今それを聞くことには耐えられない
  rationale: この動詞は、担う、耐える、持ちこたえるという意味を持ち、ここでは知的理解と霊的・感情的な受容力の双方を含み得る。「受け止めきれない」は、その幅と緊張を一方に限定せずに保つ。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの告別説教にふさわしい落ち着いた品位を保った。「受け止めきれない」は口語的すぎず、原文の比喩と意味の広がりを自然に伝える。
