id: JHN.16.33
reference: John 16:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἐν ἐμοὶ εἰρήνην ἔχητε· ἐν τῷ κόσμῳ θλῖψιν ἔχετε, ἀλλὰ θαρσεῖτε, ἐγὼ νενίκηκα τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/033.yaml
  text: I have spoken these things to you so that in me you may have peace[a]. In the world you have tribulation, but take courage[b]; I have overcome the world.
translation:
  language: ja
  text: これらのことをあなたがたに話したのは、あなたがたがわたしにあって平安を得るためです。世にあって、あなたがたには苦難[a]があります。しかし、勇気を出しなさい[b]。わたしは世に勝ったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「患難」「苦しみ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「心を強く持ちなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 複数の指示代名詞として、直前までのイエスの一連の言葉を指すことを明確にした。
- source_word: λελάληκα
  choice: 話した
  rationale: 完了形が示す、語り終えた行為と現在への関わりを文脈全体で自然に伝える。日本語では「話してきた」も可能だが、完了した談話を指すため「話した」とした。
- source_word: ἵνα
  choice: ためです
  rationale: 目的を表す接続詞の働きを、自然な現代日本語で明示した。
- source_word: ἐν ἐμοὶ
  choice: わたしにあって
  rationale: ヨハネ文書で重要な「わたしのうちに」という結びつきの表現を、解釈的に「わたしによって」とせず保持した。
- source_word: εἰρήνην
  choice: 平安
  rationale: 単なる争いの不在に限られない、イエスとの関係における安らぎと全き状態を表せる聖書日本語として採用した。
- source_word: ἔχητε
  choice: 得る
  rationale: 直訳的な「持つ」より自然でありつつ、平安を自分たちのものとして有するという意味を伝える。目的節の継続的含意は文脈に委ねた。
- source_word: ἐν τῷ κόσμῳ
  choice: 世にあって
  rationale: 場所・領域を示す句を保ち、「わたしにあって」との対比が日本語でも見えるようにした。
- source_word: θλῖψιν
  choice: 苦難
  rationale: 圧迫、苦しみ、患難を表す語の重みを保ちつつ、現代の一般読者にも明瞭な語を選んだ。
- source_word: ἔχετε
  choice: あります
  rationale: 現在形を未来の予告に変えず、現に存在し続ける状況として表した。
- source_word: θαρσεῖτε
  choice: 勇気を出しなさい
  rationale: 苦難の中で確信を持つよう促す命令の力を、明快で自然な日本語にした。
- source_word: νενίκηκα
  choice: 勝ったのです
  rationale: 決定的な勝利とその現在的な意義を表すギリシア語完了形を、日本語では説明的な「のです」によって文脈上の根拠・確信として伝えた。
- source_word: τὸν κόσμον
  choice: 世
  rationale: 前半と同じ訳語を用い、神に敵対する人間世界・秩序を含みうるヨハネ特有の多義性を限定しなかった。
theological_decisions:
- issue: κόσμος の意味範囲
  choice: 二か所とも「世」と訳す
  alternative: 「この世の仕組み」「堕落した世界」
  rationale: 「わたしにあって」と「世にあって」の対比、およびイエスが「世」に勝ったという宣言を保つ。説明的な訳で、物質世界、人類、神に敵対する秩序というヨハネ的な意味の幅を一つに限定しない。
- issue: 十字架以前の物語時点における νενίκηκα の完了形
  choice: 「わたしは世に勝ったのです」
  alternative: 「わたしは世に勝つ」「わたしは世に打ち勝っている」
  rationale: まだ受難前であるにもかかわらず、勝利をすでに成し遂げられた事実として語る原文の神学的緊張を保持した。未来形に変えず、勝利の継続的効力も文脈から読み取れる表現とした。
- issue: ἐν ἐμοὶ と ἐν τῷ κόσμῳ の対照
  choice: 「わたしにあって」／「世にあって」
  alternative: 「わたしを通して」／「この世界では」
  rationale: 同じ前置詞 ἐν の反復を見える形で残し、弟子たちが同時に置かれる二つの関係的・領域的現実の対照を、過度に説明せず示した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある直接話法。「あなたがた」と「わたし」を用いて対象と話者を明確にし、「平安」「世」はヨハネ福音書の反復語として一貫性を保った。原文の対句と短い三段構成が響くよう、文を簡潔に区切った。
