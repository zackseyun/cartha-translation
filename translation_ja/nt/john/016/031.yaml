- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で広く定着している固有名の表記を用いた。
- source_word: Ἄρτι
  choice: 今
  rationale: 発話時点での切迫した現在性を簡潔に表す。
- source_word: πιστεύετε
  choice: あなたがたは信じている
  rationale: πιστεύωの現在・能動・直説法、二人称複数。主語の複数を明示し、現在の状態を問う文脈に自然な「信じている」とした。
theological_decisions:
- issue: Ἄρτι πιστεύετε; の発話の力
  choice: 「今、あなたがたは信じているのですか」と修辞的な問いとして訳す。
  alternative: 「今、あなたがたは信じている」と陳述として訳す。
  rationale: ギリシャ語本文そのものは疑問文と陳述文のどちらにも取り得るが、直後に弟子たちが散らされることが告げられるため、問いと読むのが文脈に適する。ただし陳述の可能性を脚注に残し、含まれる緊張を解消しない。
