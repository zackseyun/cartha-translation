id: JHN.16.15
reference: John 16:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντα ὅσα ἔχει ὁ πατὴρ ἐμά ἐστιν· διὰ τοῦτο εἶπον ὅτι ἐκ τοῦ ἐμοῦ λαμβάνει καὶ ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/015.yaml
  text: Everything that the Father has is mine[a]. That is why I said that he takes from what is mine and will declare it to you.
translation:
  language: ja
  text: 父が持っておられるものはすべて、わたしのものです。だから、「その方はわたしのものから受け取り[a]、あなたがたに告げる」と、わたしは言ったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「取り」。
    reason: λαμβάνειには「受け取る」と「取る」の両方の語義があり、御霊と子との関係について語のニュアンスを一つに限定しないため。
lexical_decisions:
- source_word: πάντα ὅσα
  choice: ものはすべて
  rationale: 包括性と強調を保ちつつ、現代日本語として自然な表現にした。
- source_word: ἔχει ὁ πατὴρ
  choice: 父が持っておられる
  rationale: ἔχειの基本的な意味を保ち、神を指す「父」への敬意を自然な尊敬表現で示した。
- source_word: ἐμά ἐστιν
  choice: わたしのものです
  rationale: 所有を表す述語的用法を直接的に訳し、父の持つすべてが子のものであるという強い主張を保った。
- source_word: διὰ τοῦτο
  choice: だから
  rationale: 前文を根拠として後続の発言を説明する推論的なつながりを、明快な現代日本語で示した。
- source_word: εἶπον ὅτι
  choice: 「……」と、わたしは言ったのです
  rationale: 発言内容を日本語で明瞭に示し、アオリストを過去の発言として自然に表した。
- source_word: ἐκ τοῦ ἐμοῦ
  choice: わたしのものから
  rationale: ギリシア語の省略的な所有表現を補って自然な日本語とし、受け取るものの源が子に属することを保った。
- source_word: λαμβάνει
  choice: 受け取り
  rationale: 文脈上、源から与えられるものを受領する意味が自然であり、日本語の「取る」が帯び得る奪取の含意を避けた。語義上の別の可能性は脚注に残した。
- source_word: ἀναγγελεῖ
  choice: 告げる
  rationale: 啓示された事柄を知らせる意味を簡潔かつ品位ある日本語で表した。引用全体がこれから行われる働きを述べるため、日本語では文脈によって未来性が伝わる。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 弟子たちへの複数二人称の間接目的語を明示した。
theological_decisions:
- issue: 父の持つものと子の所有との関係
  choice: 父が持っておられるものはすべて、わたしのものです
  alternative: 父が持っておられるものはすべて、わたしに属します
  rationale: 父に属するすべてについて子が所有を主張する本文の強さを保ちつつ、本文にない後代の教理用語は加えなかった。
- issue: 御霊が子に属するものを受けること
  choice: その方はわたしのものから受け取り
  alternative: その方はわたしのものから取り
  rationale: λαμβάνειは「受け取る」と「取る」の双方を許す。本文では日本語として不必要な奪取の響きを避けて「受け取る」とし、語義の幅は脚注で保持した。
- issue: 省略された主語の表現
  choice: その方
  alternative: 彼
  rationale: ギリシア語では主語が動詞に含まれ、直前の文脈の御霊を指す。日本語では人格的な指示を保ちながら不自然な代名詞を避けるため「その方」とした。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、イエスの発言にふさわしい落ち着きと品位を保った。「御霊」はこの節のギリシア語本文に明示されていないため補わず、文脈を受ける「その方」とした。
