id: JHN.16.26
reference: John 16:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐν τῷ ὀνόματί μου αἰτήσεσθε, καὶ οὐ λέγω ὑμῖν ὅτι ἐγὼ ἐρωτήσω τὸν πατέρα περὶ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/016/026.yaml
  text: On that day you will ask in my name[a], and I do not say to you that I will ask the Father concerning you[c][b];
translation:
  language: ja
  text: その日には、あなたがたはわたしの名によって求めます。そして、わたしがあなたがたのために父に願う、とあなたがたに言っているのではありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたについて」とも訳せる。ギリシア語では、弟子たちが「求める」には αἰτέω、イエスが父に「願う」には別の動詞 ἐρωτάω が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: その日
  rationale: 時を示す句として、指示の強調を保ちつつ現代日本語で自然に表した。
- source_word: ἐν τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: ヨハネ文書に特徴的な表現の神学的・文脈的含意を保ち、「権威によって」などと限定的に解釈しない訳とした。
- source_word: αἰτήσεσθε
  choice: 求めます
  rationale: 未来形を文脈上の将来として表し、祈りや願いに自然な「求める」を用いた。
- source_word: οὐ λέγω ὑμῖν ὅτι
  choice: ……と言っているのではありません
  rationale: ὅτιを発言内容を導く接続詞として取り、現在形の発言行為を自然な日本語で表した。
- source_word: ἐρωτήσω τὸν πατέρα
  choice: 父に願う
  rationale: ἐρωτάωがここでは父への依頼を表すため「願う」とし、前半のαἰτέω「求める」との語の違いも日本語本文で穏やかに反映した。
- source_word: περὶ ὑμῶν
  choice: あなたがたのために
  rationale: περί＋属格は「あなたがたについて」とも訳せるが、父への願いという文脈では代理・利益を示す「あなたがたのために」が自然である。別訳を脚注に示した。
theological_decisions:
- issue: イエスが将来の執り成しそのものを否定しているのか、この場面で弟子たちの祈りをそのように説明していないだけなのか
  choice: 「……と言っているのではありません」と訳し、この発言における否定として表した。
  alternative: 「わたしはあなたがたのために父に願いません」と、将来の執り成し自体を否定するように訳す。
  rationale: 本文は「わたしが願う、と言っているのではない」と述べており、「願わない」と直接断言してはいない。直後の文脈と他の新約本文との神学的緊張を解消せず保持する。
translation_notes:
  register: 明瞭で現代的ながら品位ある常体。「父」はヨハネ福音書の神学的呼称として定冠詞を反映し、所有語を補わなかった。節末は次節へ続く構文だが、日本語では独立して読める句点とした。
