source:
  edition: SBLGNT
  text: αὐτὸς γὰρ ὁ πατὴρ φιλεῖ ὑμᾶς, ὅτι ὑμεῖς ἐμὲ πεφιλήκατε καὶ πεπιστεύκατε ὅτι ἐγὼ παρὰ τοῦ ⸀θεοῦ ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/027.yaml
  text: For the Father himself loves you[a], because you have loved me and have believed that I came from God.
translation:
  language: ja
  text: というのも、父ご自身があなたがたを愛しておられます。あなたがたがわたしを愛しており、わたしが神のもとから出て来た[a]と信じているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神から出て来た」。ギリシア語は、神に由来することに加え、神の御前から来たという含みを持つこともあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς γὰρ ὁ πατὴρ
  choice: 父ご自身が……からです
  rationale: αὐτόςの強意を「ご自身」で保ち、γάρは前節を説明する理由として、日本語の自然な文末表現「からです」で示した。
- source_word: φιλεῖ
  choice: 愛しておられる
  rationale: 親愛の情を表すφιλέωを、過度に弱めず自然な敬語表現で訳した。
- source_word: πεφιλήκατε
  choice: 愛し
  rationale: 同じφιλέωの語彙的つながりを「愛する」で保った。完了形の継続的な意味合いは、後続する「信じている」と合わせ、現在まで続く姿勢として文脈上伝わるようにした。
- source_word: πεπιστεύκατε
  choice: 信じている
  rationale: 完了形が示す、信じるに至った結果が現在も続いている状態を自然な現代日本語で表した。
- source_word: παρὰ τοῦ θεοῦ ἐξῆλθον
  choice: 神のもとから出て来た
  rationale: παράの起点とἐξέρχομαιの「出て来る」という動きを保ち、神に由来することと神の御前から来る含みの双方を残した。
theological_decisions:
- issue: 「神のもとから出て来た」のキリスト論的な意味
  choice: 由来と派遣を示す原文の表現をそのまま保つ
  alternative: 神から遣わされて来た／神から生まれ出た
  rationale: 本文はイエスと神との関係における起源と来臨を語るが、その意味を「派遣」や特定の生成概念だけに限定していない。教理的説明を補わず、原文の含みと緊張を維持した。
- issue: 父の愛と弟子たちの愛・信仰との因果関係
  choice: 二つのὅτιのうち、最初を理由、二つ目を信仰内容として明確に訳す
  alternative: 父の愛を無条件性の説明によって言い換える
  rationale: 原文は、父が弟子たちを愛しておられる理由として、彼らがイエスを愛し、その神的由来を信じていることを明示している。この言明を神学的調整によって弱めたり言い換えたりしなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「父ご自身」で強意を示し、「愛しておられる」で神への自然な敬意を表した。二つの理由節は読みやすさのため二文に分けたが、論理的なつながりは維持している。
