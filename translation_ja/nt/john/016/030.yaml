id: JHN.16.30
reference: John 16:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νῦν οἴδαμεν ὅτι οἶδας πάντα καὶ οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ· ἐν τούτῳ πιστεύομεν ὅτι ἀπὸ θεοῦ ἐξῆλθες.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/030.yaml
  text: Now we know that you know all things and have no need that anyone should question you[a]. By this we believe that you came from God.
translation:
  language: ja
  text: 今、私たちは、あなたがすべてをご存じで、あなたはだれかから尋ねられる必要もないことが分かりました[a]。このことによって、私たちは、あなたが神のもとから来られたと信じます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたは、だれかから質問される必要もない」。ギリシャ語の動詞は「尋ねる」とも「質問する」とも訳せる。ここでは、イエスが弟子たちの言おうとすることをあらかじめ知っておられたという文脈から、「尋ねる」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν
  choice: 今
  rationale: 弟子たちの現在の認識を示す時間副詞として、簡潔で自然に訳した。
- source_word: οἴδαμεν
  choice: 私たちは…分かりました
  rationale: οἶδα は現在の認識を表すが、文脈では今に至って認識したという日本語の自然な言い方が適する。
- source_word: οἶδας πάντα
  choice: あなたがすべてをご存じで
  rationale: πάντα の包括性を保ちつつ、イエスに対する発話として自然な敬語を用いた。
- source_word: οὐ χρείαν ἔχεις ἵνα τίς σε ἐρωτᾷ
  choice: だれかがあなたに尋ねる必要もない
  rationale: 必要がない主体はイエスであるというギリシャ語の構造を保った。「尋ねる」は ἐρωτάω の中立的な意味を示し、文脈上は問いかけて考えを明かすことを含み得る。
- source_word: ἐν τούτῳ
  choice: このことによって
  rationale: 直前の事実を信仰の根拠として示す用法を明確にした。
- source_word: πιστεύομεν
  choice: 私たちは…信じます
  rationale: 告白的文脈における πιστεύω の基本的意味をそのまま表した。
- source_word: ἀπὸ θεοῦ
  choice: 神のもとから
  rationale: 起点・由来を表す ἀπό を自然に示し、「父」と特定するなど本文以上の説明を加えなかった。
- source_word: ἐξῆλθες
  choice: 来られた
  rationale: ここではイエスの神からの由来・派遣を指す。「出て来た」より現代日本語として自然で、敬意ある語調とした。
theological_decisions:
- issue: 「すべてをご存じ」のキリスト論的含意
  choice: 弟子たちの告白をそのまま訳し、明示的な教理説明を加えない
  alternative: 「全知である」などと解説的に訳す
  rationale: 本文の強いキリスト論的含意を保持しつつ、ギリシャ語にない教理用語による限定や拡張を避けた。
- issue: ἀπὸ θεοῦ ἐξῆλθες の意味
  choice: 神のもとから来られた
  alternative: 父のもとから来られた／神から遣わされた
  rationale: 神的由来・使命の含意を保ちながら、「父」や「遣わされた」という本文に明記されない語を補わないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、弟子たちからイエスへの発話にふさわしく「ご存じ」「来られた」という敬語を採用した。全体は簡潔で格調を保ちつつ、日常的に理解できる表現とした。
