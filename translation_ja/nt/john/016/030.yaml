review_pass:
  verdict: revise
  source_fidelity: The rendering of Jesus' comprehensive knowledge, the disciples' belief, and his origin 'from God' is faithful. However, 「だれかがあなたに尋ねる必要もない」 leaves the one who has no need ambiguous and can naturally be read as saying that nobody needs to ask Jesus, whereas the Greek states that Jesus has no need for anyone to question him.
  naturalness: The register is clear and appropriately respectful. Recasting the disputed clause with Jesus as the explicit subject produces more natural and unambiguous modern Japanese.
  terminology: 「すべてをご存じ」, 「信じます」, and 「神のもとから来られた」 are suitable and do not introduce doctrinal expansion. 「尋ねられる」 appropriately retains the neutral inquiry sense of ἐρωτᾷ; the footnote preserves 「質問される」 as an alternative.
  issues:
  - severity: medium
    issue: The subject of 「必要もない」 is not expressed clearly.
    rationale: 'οὐ χρείαν ἔχεις has Jesus as its subject: ''you have no need.'' The draft''s wording can shift the sense to the general proposition that no one needs to ask Jesus. Making 「あなたは」 explicit preserves the Greek construction and the contextual point that Jesus needs no inquiry in order to know.'
  - severity: low
    issue: The footnote's alternative repeats the same subject ambiguity.
    rationale: Its alternative should likewise identify Jesus as the one who has no need to be questioned.
  revised_text: 今、私たちは、あなたがすべてをご存じで、あなたはだれかから尋ねられる必要もないことが分かりました[a]。このことによって、私たちは、あなたが神のもとから来られたと信じます。
  revised_footnotes:
  - marker: a
    text: または「あなたは、だれかから質問される必要もない」。ギリシャ語の動詞は「尋ねる」とも「質問する」とも訳せる。ここでは、イエスが弟子たちの言おうとすることをあらかじめ知っておられたという文脈から、「尋ねる」とした。
    reason: lexical_alternative
  revision_rationale: 「あなたは、だれかから尋ねられる必要もない」として、必要がない主体がイエスであることを明示した。これは「だれかがあなたに尋ねる必要がない」という一般的な意味ではなく、イエスが人からの問いを必要としないという原文の構文と文脈を自然な日本語で表す。その他の表現と脚注アンカーは維持した。
