  to: 今、私たちは、あなたがすべてをご存じで、あなたはだれかから尋ねられる必要もないことが分かりました[a]。このことによって、私たちは、あなたが神のもとから来られたと信じます。
  rationale: 「あなたは、だれかから尋ねられる必要もない」として、必要がない主体がイエスであることを明示した。これは「だれかがあなたに尋ねる必要がない」という一般的な意味ではなく、イエスが人からの問いを必要としないという原文の構文と文脈を自然な日本語で表す。その他の表現と脚注アンカーは維持した。
