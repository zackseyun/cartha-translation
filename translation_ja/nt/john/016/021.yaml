  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γυνὴ ὅταν τίκτῃ λύπην ἔχει, ὅτι ἦλθεν ἡ ὥρα αὐτῆς· ὅταν δὲ γεννήσῃ τὸ παιδίον, οὐκέτι μνημονεύει τῆς θλίψεως διὰ τὴν χαρὰν ὅτι ἐγεννήθη ἄνθρωπος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/021.yaml
  text: When a woman is giving birth[a], she has sorrow because her hour has come; but when she has given birth to the child, she no longer remembers the distress because of the joy that a child has been born into the world.
translation:
  language: ja
  text: 女性が子どもを産むとき、悲しみを覚えます。その時が来たからです。しかし、子どもを産むと、一人の人間[a]が世に生まれたという喜びのために、もはやその苦しみを覚えていません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「一人の男」。ギリシア語のアントローポスは「男」を意味することもあるが、ここでは特定の性別を指さず、人間一般を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: 女
  rationale: 出産についての一般的なたとえなので、「妻」ではなく「女」が文脈に合う。
- source_word: ὅταν τίκτῃ
  choice: 子を産む時
  rationale: 一般的・反復的な状況を表すὅτανと、進行中の出産を示す現在接続法を、自然な日本語で表した。
- source_word: λύπην ἔχει
  choice: 悲しみを抱く
  rationale: λύπηの情緒的な悲しみを保ち、周辺文脈の悲しみから喜びへの転換にも対応させた。肉体的な「痛み」だけには限定しない。
- source_word: ἡ ὥρα αὐτῆς
  choice: 自分の時
  rationale: 出産の定められた時を指しつつ、ヨハネ文書におけるὥραの響きを残すため、「時」を保持した。
- source_word: ὅταν δὲ γεννήσῃ τὸ παιδίον
  choice: しかし、子どもを産んでしまうと
  rationale: アオリスト接続法が示す出産の完了を「産んでしまうと」で自然に表した。ここでの「しまう」は遺憾ではなく動作の完了を示す。
- source_word: οὐκέτι μνημονεύει
  choice: もう……覚えてはいない
  rationale: μνημονεύωの基本義を明瞭に保った。
- source_word: τῆς θλίψεως
  choice: その苦しみ
  rationale: 出産に伴う圧迫・苦難を自然に表しつつ、単なる肉体的疼痛に限定しない語を選んだ。
- source_word: διὰ τὴν χαράν
  choice: 喜びのために
  rationale: 対格を伴うδιάの原因・理由を表した。
- source_word: ὅτι ἐγεννήθη
  choice: ……生まれた
  rationale: 喜びの理由・内容を示すὅτιを、日本語では引用標識を立てず自然な連体修飾として表した。
- source_word: ἄνθρωπος
  choice: 一人の人
  rationale: 文法上の男性形を男児に限定せず、人間一人が誕生したという一般的意味を保った。「子ども」と重ねず、原文がπαιδίονからἄνθρωποςへ語を変える点も反映した。
- source_word: εἰς τὸν κόσμον
  choice: 世に
  rationale: 「世に生まれる」はεἰς τὸν κόσμονを簡潔かつ自然に伝える日本語表現であり、ヨハネ的なκόσμοςの語感も保つ。
theological_decisions:
- issue: ἄνθρωποςの包括的な意味
  choice: 一人の人
  alternative: 一人の男／子ども
  rationale: この文脈のἄνθρωποςは性別を特定せず、新たな人間の誕生を指す。「男」は不要な性別限定を生じ、「子ども」は直前のπαιδίονとの語彙上の区別を失わせるため、「一人の人」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「時」「悲しみ」「喜び」というヨハネ的な対照を残した。原文にない説明は加えず、出産時の苦しみが肉体的痛みだけか情緒的苦悩も含むかは限定していない。
