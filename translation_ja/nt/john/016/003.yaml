id: JHN.16.3
reference: John 16:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ταῦτα ποιήσουσιν ὅτι οὐκ ἔγνωσαν τὸν πατέρα οὐδὲ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/003.yaml
  text: And they will do these things because they have not known the Father or me[a].
translation:
  language: ja
  text: 彼らがこのようなことをするのは、父もわたしも知らなかったからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「父もわたしも知らないからです」または「父もわたしも知るようにならなかったからです」。ギリシア語の動詞は、ここでは複数の自然な訳し方ができます。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: （日本語では明示せず）
  rationale: 前節とのつながりは文脈上明らかであり、ここで「そして」を置くと現代日本語では不自然になりやすい。接続関係は保たれている。
- source_word: ταῦτα
  choice: このようなこと
  rationale: 直前に述べられた敵対行為をまとめて指す。複数の行為への後方照応を、自然な日本語で表す。
- source_word: ποιήσουσιν
  choice: する
  rationale: ποιέω の未来形。日本語では従属節全体と文脈によって未来の行為であることが十分伝わるため、非過去形「する」が自然である。
- source_word: ὅτι
  choice: からです
  rationale: 行為の理由を導く因果関係を明確に表す。
- source_word: οὐκ ἔγνωσαν
  choice: 知らなかった
  rationale: γινώσκω のアオリストを自然な過去形で訳した。単なる情報の有無に限定せず、ヨハネ文書に見られる人格的・関係的な『知る』という含みも保つ。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 神を、御子との関係において指す呼称。日本語聖書文体として自然で、尊称的な意味は文脈から明らかである。
- source_word: οὐδὲ ἐμέ
  choice: わたしも
  rationale: 先行する否定と結びつき、『父もわたしも知らない』、すなわち両者を知らないという οὐδέ の並列否定を自然な日本語で表す。
theological_decisions:
- issue: 神とイエスを「知る」というヨハネ的表現
  choice: 父もわたしも知らなかった
  alternative: 父もわたしも知るようにならなかった／父もわたしも知らない
  rationale: 迫害の根底に、父とイエスの双方を知らないことがあるという主張をそのまま保つ。「知る」を説明的に言い換えず、人格的・関係的な意味の広がりと緊張を残した。アオリストは本文では自然な過去形とし、別の時制・相の捉え方は脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「このようなこと」で前文脈の複数の敵対行為を自然に受け、「からです」で理由を明示した。イエスの一人称は文脈にふさわしい「わたし」とした。
