id: JHN.16.25
reference: John 16:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα ἐν παροιμίαις λελάληκα ὑμῖν· ⸀ἔρχεται ὥρα ὅτε οὐκέτι ἐν παροιμίαις λαλήσω ὑμῖν ἀλλὰ παρρησίᾳ περὶ τοῦ πατρὸς ⸀ἀπαγγελῶ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/025.yaml
  text: I have spoken these things to you in figures of speech[a]. An hour is coming when I will no longer speak to you in figures of speech[c][b], but will tell you plainly about the Father.
translation:
  language: ja
  text: これらのことを、わたしはあなたがたに比喩を用いて話してきました。[a] しかし、もはや比喩を用いて話すのではなく、父についてはっきりと[b]あなたがたに告げる時が来ます。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「たとえで」「覆い隠した言葉で」とも訳せる。ギリシア語は、比喩的または間接的な語り方を指す。
    reason: lexical_alternative
  - marker: b
    text: 「率直に」「包み隠さず」とも訳せる。ここでは、比喩によらない直接的な語り方という意味。
    reason: lexical_alternative
  - marker: c
    text: 「時」に当たる語は「時間」「時刻」をも意味するが、ヨハネ福音書ではしばしば特別な意味を帯びた時機を指す。
    reason: lexical_context
lexical_decisions:
- source_word: παροιμίαις
  choice: 比喩を用いて
  rationale: ヨハネ文書での語義は、共観福音書に見られる形式的な「たとえ話」に限らず、比喩的・間接的で意味を覆った語り方を指す。自然な現代日本語でその広がりを保つ。
- source_word: λελάληκα
  choice: 話してきました
  rationale: 完了形が表す、これまで語られ、その内容が現在にも関わるという含みを自然な日本語で示す。また、後続のλαλήσωとの語彙的なつながりも「話す」で保つ。
- source_word: ἔρχεται ὥρα
  choice: 時が来ます
  rationale: 日本語の「時が来る」は自然であり、ヨハネにおけるὥραの神学的な響きも保てる。冠詞のない表現を不必要に「その時」と限定しない。
- source_word: οὐκέτι
  choice: もはや…ではなく
  rationale: 将来における語り方の変化と、前後の明確な対比を表す。
- source_word: παρρησίᾳ
  choice: はっきりと
  rationale: ここでは大胆さよりも、比喩的・間接的な語り方と対照される率直で明瞭な伝達が中心である。
- source_word: ἀπαγγελῶ
  choice: 告げる
  rationale: 父について直接明らかにするという宣言の重みを保ちつつ、現代日本語として自然である。
- source_word: περὶ τοῦ πατρὸς
  choice: 父について
  rationale: 対象を示すπερίを簡潔に訳し、ヨハネ福音書における「父」という呼称をそのまま保つ。
theological_decisions:
- issue: ヨハネ文書におけるὥραの訳し方
  choice: 時が来ます
  alternative: ある時が来ます／その時が来ます
  rationale: 「時」は日本語でも特定の重大な時機を示し得るため、ヨハネ的な響きを保てる。一方、冠詞がない本文以上に特定して「その時」とはしない。
- issue: ἐν παροιμίαιςと対照されるπαρρησίᾳの意味
  choice: はっきりと
  alternative: 公然と／率直に
  rationale: 文脈上の対照は、隠された比喩的表現と直接明瞭な伝達との間にある。「公然と」では公的な場で語る意味が前面に出すぎ、「率直に」では態度のニュアンスが強くなり得る。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。敬体を用い、イエスの弟子たちへの語りかけとして自然にした。「比喩を用いて」を反復し、原文の対比構造とλαλέωの反復を見える形で保った。
