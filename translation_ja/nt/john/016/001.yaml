id: JHN.16.1
reference: John 16:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα λελάληκα ὑμῖν ἵνα μὴ σκανδαλισθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/001.yaml
  text: I have spoken these things to you so that you may not fall away.
translation:
  language: ja
  text: これらのことをあなたがたに話したのは、あなたがたがつまずかない[a]ためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰から離れない」とも訳せる。原語には、何かにつまずかされて信仰が揺らぎ、離反に至るという意味があり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 中性複数の指示代名詞で、直前までのイエスの言葉を受ける。複数形を保ち、ヨハネの語り方にも合う。
- source_word: λελάληκα
  choice: 話した
  rationale: λαλέωの完了形。日本語では「話したのは……ためです」という構文により、すでに語られた言葉が現在の弟子たちに及ぼす目的を自然に表す。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 二人称複数の与格を明示し、語りかけられている弟子たちが複数であることを保つ。
- source_word: ἵνα μὴ
  choice: ……ないため
  rationale: 否定を伴う目的節を、明瞭で自然な現代日本語として表す。
- source_word: σκανδαλισθῆτε
  choice: つまずかない
  rationale: σκανδαλίζωの比喩的な像を保ちつつ、迫害によって信仰が揺らぎ、離反に至る可能性まで含み得る曖昧さを残す。
theological_decisions:
- issue: 迫害の文脈における σκανδαλισθῆτε の意味
  choice: つまずかない
  alternative: 信仰から離れない／つまずかされない
  rationale: 直後の迫害予告からは信仰上の離反が含意され得るが、本文で「信仰から離れる」と限定すると語の比喩と意味の幅を狭める。「つまずく」を本文に置き、深刻な信仰の動揺や離反を含み得ることを注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「これらのこと」「あなたがた」によって原文の複数形と談話の流れを保った。「つまずく」という聖書的比喩は現代日本語でも理解可能であり、注によって文脈上の深刻さを補った。
