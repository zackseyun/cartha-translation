id: JHN.16.13
reference: John 16:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅταν δὲ ἔλθῃ ἐκεῖνος, τὸ πνεῦμα τῆς ἀληθείας, ὁδηγήσει ὑμᾶς ⸂ἐν τῇ ἀληθείᾳ πάσῃ⸃, οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ, ἀλλ’ ὅσα ⸀ἀκούσει λαλήσει, καὶ τὰ ἐρχόμενα ἀναγγελεῖ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/013.yaml
  text: But when he[a], the Spirit of truth, comes, he will guide you into all the truth. For he will not speak from himself, but whatever he hears he will speak[d][c][b], and he will declare to you the things that are coming.
translation:
  language: ja
  text: しかし、その方、すなわち真理の霊が来ると、あなたがたを真理のすべてへと導いてくださいます。[a] その方は自分から語るのではなく、聞いたことをことごとく語り、これから起こることをあなたがたに告げ知らせてくださるからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「真理のすべてにおいて導いてくださいます」。ギリシア語の前置詞は通常「〜の中で」を意味しますが、「導く」と結び付いて方向を表すとも理解できます。
    reason: alternative_reading
  - marker: b
    text: 「自分から」は、「自分を源として」の意。別訳「自分の判断で語るのではなく」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: しかし、…が来ると
  rationale: ὅτανの将来を指す時の意味を自然な日本語の「来ると」で表し、δέの緩やかな対照・継続を「しかし」で示した。
- source_word: ἔλθῃ ἐκεῖνος
  choice: その方…が来ると
  rationale: ἐκεῖνοςの強調された人格的指示を、現代日本語で敬意と人格性を自然に示す「その方」で表した。
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: 真理の霊
  rationale: ヨハネ文書の呼称として、属格を解釈的に言い換えず「真理の霊」と保った。
- source_word: ὁδηγήσει ὑμᾶς ἐν τῇ ἀληθείᾳ πάσῃ
  choice: あなたがたを真理のすべてへと導いてくださいます
  rationale: ὁδηγέωの導きの比喩に即して方向性を「へと」で示し、冠詞を伴うπάσῃ ἀληθείᾳを無限定な「すべての真理」ではなく「真理のすべて」とした。敬語補助動詞は日本語として神的主体への敬意を示すもので、意味内容は加えていない。
- source_word: οὐ γὰρ λαλήσει ἀφ’ ἑαυτοῦ
  choice: その方は自分から語るのではなく
  rationale: ἀφ’ ἑαυτοῦの起点・自己由来という表現を「自分から」で保持し、「独断で」や「自分の権威によって」といった解釈を加えなかった。
- source_word: ἀλλ’ ὅσα ἀκούσει λαλήσει
  choice: 聞いたことをことごとく語り
  rationale: ὅσαの包括性を「ことごとく」で表し、聞くことと語ることの依存関係を保った。ギリシア語の未来形は、日本語では文脈上自然な連用形で主節の未来的叙述に従わせた。
- source_word: τὰ ἐρχόμενα
  choice: これから起こること
  rationale: 冠詞付き現在分詞が指す将来の事柄・出来事を、過度に予言用語化せず自然に表した。
- source_word: ἀναγγελεῖ ὑμῖν
  choice: あなたがたに告げ知らせてくださる
  rationale: ἀναγγέλλωの「報告する・告知する・知らせる」という意味を、厳粛さを保ちつつ現代日本語として明瞭な「告げ知らせる」で表した。
theological_decisions:
- issue: 聖霊への人格的指示
  choice: 「その方」を用いる
  alternative: 「それ」、または代名詞を避けて「真理の霊」を反復する
  rationale: πνεῦμαは文法上中性だが、本文は男性形ἐκεῖνοςを用いて人格的に指示している。「その方」はこの談話上の特徴を日本語で保ち、非人格化を避ける。
- issue: ἐν τῇ ἀληθείᾳ πάσῃの方向性と領域性
  choice: 「真理のすべてへと」
  alternative: 「真理のすべてにおいて」
  rationale: ἐνの基本的な領域性も可能だが、ὁδηγέωとの結び付きでは到達方向を表す理解が自然である。本文では日本語の導きの比喩に合う方向表現を採り、より形式的な領域表現を脚注に残した。
- issue: 御霊が「自分から語らない」ことの意味
  choice: 「自分から」と原文の起点表現を保持する
  alternative: 「自分勝手に」または「自分の権威で」
  rationale: 後二者は独断性または権威の所在を明示し、本文以上の神学的解釈を加え得るため避けた。
- issue: τὰ ἐρχόμεναの範囲
  choice: 「これから起こること」
  alternative: 「来るべきこと」
  rationale: 終末論的事象だけに狭めず、本文が持つ将来の事柄という幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、人格的な聖霊への言及には「その方」と敬語補助動詞を採用した。文体は礼拝・朗読にも耐える品位を保ちつつ、古語的な「来たらん時」「告げん」などは避けた。主節を理由節より先に置き、原文の論理関係は「からです」で明示した。
