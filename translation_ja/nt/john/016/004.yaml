  to: しかし、これらのことをあなたがたに話しておいたのは、彼らの時が来たとき[a]、わたしがあなたがたに話したことを思い出すためです。これらのことを初めからあなたがたに話さなかったのは、わたしがあなたがたと一緒にいたからです。
