id: JHN.16.4
reference: John 16:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα λελάληκα ὑμῖν ἵνα ὅταν ἔλθῃ ἡ ὥρα ⸀αὐτῶν μνημονεύητε ⸁αὐτῶν ὅτι ἐγὼ εἶπον ὑμῖν. Ταῦτα δὲ ὑμῖν ἐξ ἀρχῆς οὐκ εἶπον, ὅτι μεθ’ ὑμῶν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/004.yaml
  text: But I have spoken these things to you so that when their hour comes[a], you may remember that I told you. But I did not tell you these things from the beginning, because I was with you.
translation:
  language: ja
  text: しかし、これらのことをあなたがたに話しておいたのは、彼らの時が来たとき[a]、わたしがあなたがたに話したことを思い出すためです。これらのことを初めからあなたがたに話さなかったのは、わたしがあなたがたと一緒にいたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「彼らの時が来たとき、あなたがたが彼ら／それらを思い出し、わたしがあなたがたに話したことを思い出すため」。ギリシア語には「彼らの／それらの」に当たる語（αὐτῶν）が二度あり、第二の語が何を指すか、また後に続く「わたしがあなたがたに話したこと」とどう結びつくかには曖昧さがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: λελάληκα
  choice: 話しておいた
  rationale: 完了形が表す、すでに語られ、その内容が後にも意味を持つことを自然な日本語で示す。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前に語られた迫害についての複数の警告を受ける表現として明確である。
- source_word: ἵνα
  choice: ためです
  rationale: イエスがこれらのことを語った目的を明示する。
- source_word: ὅταν ἔλθῃ ἡ ὥρα αὐτῶν
  choice: 彼らの時が来たとき
  rationale: 未来の時を示す構文と、「彼らの時」という原文の曖昧さを保つ。ὥραは定められた時という含みを持ち得るが、本文では解釈を加えすぎない。
- source_word: μνημονεύητε
  choice: 思い出す
  rationale: 目的を表す接続法の意味を、現代日本語で簡潔に伝える。
- source_word: ὅτι ἐγὼ εἶπον ὑμῖν
  choice: わたしがあなたがたに話したこと
  rationale: ὅτι節を「思い出す」の内容として自然に表現する。強調されたἐγώは「わたしが」によって保持する。
- source_word: ἐξ ἀρχῆς
  choice: 初めから
  rationale: 時間的起点を示す原文を直接かつ自然に訳す。
- source_word: μεθ’ ὑμῶν ἤμην
  choice: わたしがあなたがたと一緒にいた
  rationale: 共在を示す表現を明瞭な現代日本語で再現する。
theological_decisions:
- issue: 二つのαὐτῶνの指示対象と文中での表し方
  choice: 本文では最初を「彼らの時」と明示し、二つ目は「わたしがあなたがたに話したことを思い出す」という自然な日本語の中に含めた。
  alternative: 「彼らの時が来たとき、それらを、つまり、わたしがあなたがたに話したことを思い出す」と二つ目も代名詞で明示する。
  rationale: SBLGNTにある二つのαὐτῶνを機械的に再現すると日本語では指示関係がかえって不明瞭になる。本文の流れを保ちつつ、原文上の難しさと別の直訳可能性は脚注で明示する。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの告別説教にふさわしい落ち着いた格調を保った。「話しておいた」は完了形の継続的な関わりを自然に示し、「彼らの時」は原文の解釈上の緊張を本文に残す表現とした。
