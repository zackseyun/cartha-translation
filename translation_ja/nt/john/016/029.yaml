id: JHN.16.29
reference: John 16:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Λέγουσιν οἱ μαθηταὶ αὐτοῦ· Ἴδε νῦν ⸀ἐν παρρησίᾳ λαλεῖς, καὶ παροιμίαν οὐδεμίαν λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/029.yaml
  text: His disciples said[a], “Look[b], now you are speaking openly and are not speaking in any figure of speech.”
translation:
  language: ja
  text: 弟子たちが言った。「ご覧ください。今ははっきりと話していて、少しも比喩を用いていません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγουσιν
  choice: 言った
  rationale: ギリシア語では歴史的現在だが、現代日本語の自然な物語叙述に合わせて過去形とした。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちはイエスに
  rationale: 直訳は「彼の弟子たちは」だが、発話の相手がイエスであることを日本語で自然に示した。
- source_word: Ἴδε
  choice: ああ
  rationale: 注意や気づきを示す間投詞。ここでは弟子たちが変化を認めた語調を、古風な「見よ」を避けて表した。
- source_word: νῦν
  choice: 今は
  rationale: 以前の比喩的な語り方との対照を自然に示すため、対比の助詞「は」を添えた。
- source_word: ἐν παρρησίᾳ
  choice: はっきりと
  rationale: 直後の「比喩」との対照から、勇敢さよりも明瞭で率直な話し方を表す。
- source_word: λαλεῖς
  choice: 話し
  rationale: 現在の発話について述べる動詞として、簡潔で自然な日本語にした。
- source_word: παροιμίαν
  choice: 比喩
  rationale: ヨハネの文脈では、ことわざに限定されず、比喩的・間接的で意味の覆われた言い方を指す。
- source_word: οὐδεμίαν λέγεις
  choice: 少しも……用いていません
  rationale: 強い否定を「少しも」で表し、日本語では「比喩を言う」より自然な「比喩を用いる」とした。
theological_decisions:
- issue: ἐν παρρησίᾳ と παροιμία の対照
  choice: 明瞭に直接話すことと、比喩的・間接的に話すことの対照
  alternative: 大胆に、または率直に話すこと
  rationale: 直近の対照語 παροιμία が話し方の間接性を示すため、ここでの παρρησία は主に明瞭さを指すと判断した。ただし弟子たちの理解が実際に十分だったかどうかは本文で断定しない。
translation_notes:
  register: 明快で現代的かつ礼節ある会話文。「見よ」のような古語調を避けつつ、弟子たちの気づきと、以前との対照を保った。
