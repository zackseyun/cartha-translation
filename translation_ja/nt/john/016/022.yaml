  text: καὶ ὑμεῖς οὖν ⸂νῦν μὲν λύπην⸃ ἔχετε· πάλιν δὲ ὄψομαι ὑμᾶς, καὶ χαρήσεται ὑμῶν ἡ καρδία, καὶ τὴν χαρὰν ὑμῶν οὐδεὶς ⸀αἴρει ἀφ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/016/022.yaml
  text: So you also now have sorrow; but I will see you again[a], and your heart will rejoice, and no one will take your joy from you.
translation:
  language: ja
  text: そこで、あなたがたも今は悲しんでいる。しかし、わたしは再びあなたがたを見る。あなたがたの心は喜び、だれもあなたがたからその喜びを奪うことはない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: このように
  rationale: 直前の出産のたとえを弟子たちの状況に当てはめる推論・対応関係を、自然な日本語で示す。
- source_word: νῦν μὲν λύπην ἔχετε
  choice: 今は悲しんでいる
  rationale: λύπηの悲しみを平易に表し、μένは後続の「しかし」と「今は」の対照によって示した。
- source_word: πάλιν δὲ ὄψομαι ὑμᾶς
  choice: しかし、わたしは再びあなたがたに会う
  rationale: δέの対照、πάλινの反復、そして一人称主語と二人称目的語を保持した。「会う」は日本語として自然だが相互的にも聞こえるため、主語を明示し注で原文の構文を補った。
- source_word: χαρήσεται ὑμῶν ἡ καρδία
  choice: あなたがたの心は喜び
  rationale: 「心」を感情と内面の中心として保ち、χαίρωの動詞性を「喜ぶ」で直接表した。
- source_word: τὴν χαρὰν ὑμῶν οὐδεὶς αἴρει ἀφ’ ὑμῶν
  choice: その喜びをあなたがたから奪う者はいない
  rationale: αἴρειの現在形を日本語の非過去形で表しつつ、文脈上の将来的・恒常的な意味の双方を自然に含ませた。
theological_decisions:
- issue: 将来の再会における主語と強調
  choice: わたしは再びあなたがたに会う
  alternative: あなたがたは再びわたしに会う
  rationale: ギリシア語は一人称のイエスを主語、弟子たちを目的語としている。近接文脈に合わせて主客を逆転せず、イエスの側からの再会の働きかけを示しうる表現を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体。「悲しみ」と「喜び」の対照を簡潔に保ち、「そのとき」で再会と喜びのつながりを自然に示した。
