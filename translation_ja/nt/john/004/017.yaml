  text: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν ⸀αὐτῷ· Οὐκ ἔχω ἄνδρα. λέγει αὐτῇ ὁ Ἰησοῦς· Καλῶς εἶπας ὅτι Ἄνδρα οὐκ ἔχω·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: ja
  text: 女はイエスに答えて言った。「私には夫がいません。」イエスは彼女に言われた。「あなたは『私には夫がいません』と、よく言いました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: 女は答えた
  rationale: 「答えて言った」をそのまま重ねると現代日本語では冗長になるため、応答を表す自然な物語表現にまとめた。
- source_word: Οὐκ ἔχω ἄνδρα
  choice: 私には夫がいません
  rationale: ἀνήρ は「男」と「夫」の両義を持つが、次節で婚姻歴が語られるため、ここでは「夫」が文脈上の意味である。
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: するとイエスは言われた
  rationale: 歴史的現在 λέγει を日本語の自然な物語時制で表し、場面の応答関係を「すると」で示した。イエスの発話には現代の聖書文体として自然な敬語を用いた。
- source_word: Καλῶς εἶπας
  choice: あなたは正直に言いました
  rationale: καλῶς はここで、直前の発言が事実に即していることを認める語。直訳的な「よく言いました」は称賛や出来栄えの評価にも響くため、18節へ続く含意を自然に示す「正直に」を選んだ。
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: 『私には夫がいません』と
  rationale: ὅτι を発言内容を導く引用の「と」で表し、語順を変えて繰り返された女性の言葉を明示的に引用した。
theological_decisions:
- issue: ἀνήρ の意味
  choice: 夫
  alternative: 男
  rationale: 語そのものには両義があるが、直後の4章18節が女性の夫たちについて明示するため、婚姻関係を表す「夫」がこの箇所の文脈的意味である。
- issue: Καλῶς εἶπας の評価の含み
  choice: 正直に言いました
  alternative: よく言いました／正しく言いました
  rationale: イエスは女性の答えが形式的には短くても事実であることを認めている。「正直に」はその含みを伝えるが、女性の過去への道徳的評価を本文以上に加えない。
translation_notes:
  register: 明快な現代標準日本語。会話は丁寧体で統一し、地の文は簡潔で dignified な聖書叙述とした。原文の反復はイエスの引用部分に保持しつつ、重複的な発話導入句は日本語として自然に整理した。
