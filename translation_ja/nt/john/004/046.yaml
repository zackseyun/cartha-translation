id: JHN.4.46
reference: John 4:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: ja
  text: そこでイエスは再びガリラヤのカナに来られた。そこは、以前に水をぶどう酒に変えられた所である。さて、カペナウムで息子が病気であった、ある王の役人[a]がいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「王に仕える役人」とも訳せる。ギリシア語は王または王宮に関係する人物を指すが、具体的な官職や身分は明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けて物語を進める接続語として、推論を強めすぎず自然な現代日本語になる。
- source_word: πάλιν
  choice: 再び
  rationale: 同じ地への再訪を簡潔かつ明確に表す。
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: ガリラヤのカナ
  rationale: 地域を示す属格を、日本語で定着した自然な地名表現にした。
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: 水をぶどう酒に変えられた
  rationale: 字義は「水をぶどう酒にした」だが、日本語では変化の意味を明示するこの表現が自然であり、出来事の内容も忠実に伝える。敬語は物語中のイエスへの自然な敬意を表す。
- source_word: βασιλικός
  choice: 王室の役人
  rationale: 王または王宮に属する人物という範囲を保ち、身分を「貴族」と断定せず、具体的な官職も推定しない。
- source_word: τις
  choice: ある
  rationale: 特定されているが名のない人物を導入する不定代名詞の働きを、自然な日本語で表す。
- source_word: υἱός
  choice: 息子
  rationale: 原文が男性の子を明示しているため、その情報を保持する。
- source_word: ἠσθένει
  choice: 病気であった
  rationale: 文脈上の身体的な病を、明快で品位ある現代日本語で表す。
- source_word: Καφαρναούμ
  choice: カペナウム
  rationale: 日本語聖書で広く定着した地名表記を用いる。
theological_decisions:
- issue: βασιλικόςが示す王との関係および地位
  choice: 王室の役人
  alternative: 王の役人／貴族
  rationale: 原文は王との関係を示すが、正確な官職や貴族身分までは特定しない。「王室の役人」はその曖昧さを保ちつつ、現代日本語で理解しやすい。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、地の文には落ち着いた聖書的品位を保った。「行かれた」「変えられた」はイエスについての自然な尊敬表現であり、過度に古風な言い回しは避けた。原文の二文目の所在表現は、日本語で人物と息子の状況の関係が明瞭になるよう「カペナウムには」とした。
