  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: ja
  text: 二日が過ぎると、イエスはそこを出てガリラヤへ向かった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: 二日が過ぎると
  rationale: μετά＋対格は時間的な「〜の後」を表す。定冠詞は直前に述べられた二日間の滞在を指すが、日本語では「その二日」とせずとも文脈上明確であり、「二日が過ぎると」が自然である。δέは弱い接続辞なので独立には訳さない。
- source_word: ἐξῆλθεν
  choice: 出て
  rationale: ἐξέρχομαιのアオリストで、直前の場所から立ち去る移動を表す。「出発した」も可能だが、ἐκεῖθενと組み合わせて「そこを出て」とすることで簡潔かつ自然に表した。
- source_word: ἐκεῖθεν
  choice: そこを
  rationale: 直前の滞在地からの出発を示す場所の副詞。「そこから」も可能だが、「そこを出て」が現代日本語の自然な連語となる。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ向かった
  rationale: εἰςは目的地への方向・移動を示す。「ガリラヤへ行った」も可能だが、ἐξῆλθενと合わせ、出発して目的地へ向かう叙述として自然に訳した。
- source_word: ἐξῆλθεν（主語）
  choice: イエスは
  rationale: ギリシア語では動詞の三人称単数形に含まれる省略主語を、直前までの文脈上の主語であるイエスとして明示し、日本語での理解を容易にした。
