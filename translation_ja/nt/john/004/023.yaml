  terminology: 「真の礼拝者たち」「父」「霊と真理」は適切です。「霊と真理によって」は原文の解釈上の幅を保つため維持できます。注の「御霊」は尊称表記として許容されますが、本文の曖昧さとの対照を明確にするため「聖霊」とします。
