id: JHN.4.23
reference: John 4:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: ja
  text: しかし、時が来ます。今、まさにその時です。その時、真の礼拝者たちは、霊と真理によって[a]父を礼拝します。実に父は、ご自身をこのように礼拝する人々を求めておられるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖霊によって」とも訳せる。ギリシア語は、聖霊によって力を与えられる礼拝、人間の霊における礼拝、または霊的な現実を特徴とする礼拝のいずれをも表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 礼拝の場所をめぐる直前の議論との対照を、明瞭で自然な現代日本語で示す。
- source_word: ἔρχεται ὥρα καὶ νῦν ἐστιν
  choice: 時が来ます。いや、今すでに来ています
  rationale: ヨハネ特有の「時」という語を保ちつつ、未来として到来する時がすでに現存するという緊張を自然に表す。「いや」は後半が前半を強めて限定する働きを伝える。
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: 真の礼拝者たち
  rationale: ἀληθινόςが持つ真正・究極というヨハネ的な含みを保ち、特定の集団を指す宗派的表現を避ける。
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: 父を礼拝します
  rationale: 未来形を「礼拝します」で自然に表し、τῷ πατρίは日本語の目的語として訳す。神を指す称号として「父」を用いる。
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: 霊と真理によって
  rationale: 二つの名詞を保ち、礼拝のあり方・領域・働きのいずれにも開かれた助詞「によって」を用いる。πνεῦμαが聖霊か人間の霊かを本文で断定しない。
- source_word: καὶ γὰρ
  choice: 実に
  rationale: 前文の理由を示すγάρと、強調を添えるκαίを、簡潔で品位ある日本語で表す。
- source_word: τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: このように礼拝する人々を求めておられる
  rationale: τοιούτουςを直前の礼拝のあり方に結び付け、「このように」と訳す。ζητεῖの現在的・継続的な意味を敬語を伴う「求めておられる」で表す。
theological_decisions:
- issue: ἐν πνεύματι の指示対象
  choice: 本文では「霊」とし、聖霊とも人間の霊とも限定しない。
  alternative: 「御霊によって」または「心から／霊的に」
  rationale: 無冠詞のπνεύματιは、聖霊の働き、人間の霊、あるいは霊的現実を特徴とする礼拝として理解し得る。本文ではこの神学的な幅を保ち、注で明示する。
- issue: ἀληθινοὶ προσκυνηταὶ の範囲
  choice: 「真の礼拝者たち」
  alternative: 「本当の礼拝者たち」「真正な礼拝者たち」
  rationale: 場所に拘束された礼拝との対比を示しつつ、特定の教派や集団だけを指すとの含意を持ち込まない。
- issue: 到来する時と現在の関係
  choice: 「時が来ます。いや、今すでに来ています」
  alternative: 「時が来ます。そして、それは今です」
  rationale: 未来的到来と現在的実現をともに保ち、どちらか一方へ解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「時」「真の礼拝者」「霊と真理」というヨハネ的な主要語を保持し、原文の曖昧さと終末論的緊張を解消しない訳とした。
