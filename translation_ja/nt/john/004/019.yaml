  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: ja
  text: 女はイエスに言った。「主よ[a]、あなたは預言者だと分かります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「先生」。ギリシア語のκύριεは、「主よ」のほか、敬意を込めた呼びかけとしても用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は物語現在形だが、現代日本語の自然な物語叙述に合わせて過去形とした。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 直訳は「彼に」だが、日本語では指示対象を明示するほうが自然で分かりやすい。文脈上、相手はイエスである。
- source_word: ἡ γυνή
  choice: 女は
  rationale: 文脈上はサマリアの女を指す。日本語の聖書文体として簡潔な「女」を用いた。
- source_word: Κύριε
  choice: 主よ
  rationale: κύριε の基本的な訳語として「主よ」を採用した。ただし、この場面では敬意を表す「先生」の意味でもあり得るため、脚注で曖昧さを保った。
- source_word: θεωρῶ
  choice: お見受けします
  rationale: 単なる視覚ではなく、直前のイエスの言葉から判断して認める意味を、自然で敬意ある日本語にした。
- source_word: ὅτι
  choice: と
  rationale: 認識内容を示す引用助詞として、日本語の構文に自然に組み込んだ。
- source_word: προφήτης
  choice: 預言者
  rationale: 冠詞のない述語名詞であり、特定の終末的な「かの預言者」と断定せず、ある預言者であるとの認識を表す。日本語では不定冠詞を明示しない。
- source_word: σύ
  choice: あなたは
  rationale: 明示された代名詞の強調をある程度保ちつつ、自然な日本語の主題として訳した。
theological_decisions:
- issue: イエスへの呼びかけ κύριε の訳し方
  choice: 主よ
  alternative: 先生
  rationale: 語としては「主よ」と訳せる一方、この時点の女の認識は敬意ある呼びかけにとどまる可能性がある。本文では基本訳を採り、脚注で文脈上の別義を示して、キリスト論的告白と一義的に決めつけないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話には自然な敬意を持たせた。「お見受けします」は θεωρῶ の認識・判断の含意と、κύριε に表れる丁寧な態度を伝える。
