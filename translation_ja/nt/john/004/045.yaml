  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε οὖν ἦλθεν εἰς τὴν Γαλιλαίαν, ἐδέξαντο αὐτὸν οἱ Γαλιλαῖοι, πάντα ἑωρακότες ⸀ὅσα ἐποίησεν ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ, καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: ja
  text: そこで、イエスがガリラヤに来られたとき、ガリラヤの人々はイエスを歓迎した[a]。彼らは、祭りのときにエルサレムでイエスがなさったことをすべて見ていたのである。というのも、彼ら自身もその祭り[b]に行っていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「受け入れた」。ギリシア語の動詞は「迎え入れる」「受け入れる」のいずれをも意味し得るが、ここでは好意的な応対が示唆されている。
    reason: lexical_alternative
  - marker: b
    text: ここでの「祭り」は宗教的な祭礼を指す。周囲の文脈では、エルサレムで行われた巡礼祭が念頭に置かれている。
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
  choice: そこで、…来られると
  rationale: οὖνの物語を進める接続の力を「そこで」で示し、ὅτεは自然な条件・時の表現「来られると」で訳した。
- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: ガリラヤに来られると
  rationale: εἰςが示す地域への移動を自然な日本語の「に来る」で表した。イエスに対して現代標準的な敬語を用いた。
- source_word: ἐδέξαντο αὐτὸν
  choice: イエスを歓迎した
  rationale: δέχομαιは受け入れることも意味するが、ここでは好意的な応対という文脈上の含みを「歓迎した」で明確にした。
- source_word: οἱ Γαλιλαῖοι
  choice: ガリラヤの人々
  rationale: 日本語では「ガリラヤ人」よりも地域住民を指す「ガリラヤの人々」が明瞭で自然である。
- source_word: πάντα ἑωρακότες ὅσα ἐποίησεν
  choice: なさったことをすべて見ていた
  rationale: 完了分詞ἑωρακότεςが示す、以前に目撃して現在の反応につながる状態を「見ていた」で表した。「すべて」はπάνταを保持する。
- source_word: ἐν Ἱεροσολύμοις ἐν τῇ ἑορτῇ
  choice: 祭りの際にエルサレムで
  rationale: 場所と時の関係を、日本語として明瞭な語順で表現した。ἑορτήは宗教的祭礼を指すため「祭り」とした。
- source_word: καὶ αὐτοὶ γὰρ ἦλθον εἰς τὴν ἑορτήν
  choice: 彼らも祭りに行っていたので
  rationale: γάρの説明関係とκαὶ αὐτοίの包含的強調を「彼らも…ので」で保持した。先行する祭りへの参加は「行っていた」で自然に示した。
