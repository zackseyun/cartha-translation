id: JHN.4.36
reference: John 4:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: ja
  text: 刈り入れる者は賃金[a]を受け取っており、永遠の命に至る実を集めている[b]。それは、種をまく者と刈り入れる者が共に喜ぶためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「報い」とも訳せる。ギリシア語は、労働への賃金にも、その行いに対する報いにも用いられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「永遠の命へと」。この句は、目標または結果を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: 刈り入れる者
  rationale: 定冠詞付き現在分詞の名詞的用法。動作を行う者という意味と、ὁ σπείρωνとの並行関係を保つ。
- source_word: μισθὸν
  choice: 賃金
  rationale: 労働に対する支払いという収穫の比喩を具体的に保つ。「報い」の意味もあり得るため脚注で示す。
- source_word: λαμβάνει
  choice: 受け取っており
  rationale: 現在形が示す進行中の事態を自然な日本語で表し、続く「集めている」と同時進行であることを示す。
- source_word: συνάγει καρπὸν
  choice: 実を集めている
  rationale: 「実」という比喩の広がりを保ちつつ、現在形の継続的・進行中の動作を明示する。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 永遠の命に至る
  rationale: εἰςの方向・目標を自然に表す。目的と結果のどちらにも開かれた表現とし、その幅を脚注で補う。
- source_word: ἵνα
  choice: それは…ためである
  rationale: 目的節として明確に結びつける一方、文脈上の結果的な含みを排除しない。
- source_word: ὁ σπείρων
  choice: 種をまく者
  rationale: 名詞的現在分詞を動作性のある表現とし、「刈り入れる者」との対句を保つ。
- source_word: ὁμοῦ χαίρῃ
  choice: 共に喜ぶ
  rationale: 共有される喜びを簡潔で自然な現代日本語で表す。
theological_decisions:
- issue: 節冒頭の現在時制の切迫性を「すでに」で明示するか
  choice: 原文に独立した副詞がないため「すでに」は加えず、「受け取っており」「集めている」で現在進行の意味を表した。
  alternative: 「すでに、刈り入れる者は…」とする。
  rationale: 直前の文脈には収穫が現に始まっている含みがあるが、本節そのものに「すでに」に当たる語はない。時制の力は述語で示し、明示的な追加は避けた。
- issue: εἰς ζωὴν αἰώνιονを目的と結果のどちらに限定するか
  choice: 「永遠の命に至る」として、方向・到達の含みを保った。
  alternative: 「永遠の命のための」または「永遠の命へと」とする。
  rationale: εἰςはここで目標または結果を表し得るため、一方だけに断定せず、脚注でもその幅を示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、収穫と労働の比喩、種をまく者と刈り入れる者の並行関係を保持した。「刈り取る」よりも収穫作業全体を自然に指す「刈り入れる」を採用した。
