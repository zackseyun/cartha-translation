id: JHN.4.34
reference: John 4:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: ja
  text: イエスは彼らに言われた。「わたしの食べ物とは、わたしを遣わした方[a]のみこころを行い、その方のわざを成し遂げる[b]ことです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしを遣わした方」は、文脈上、父を指す。ただし、ここでギリシア語本文は「父」という称号を明記していない。
    reason: cross_reference
  - marker: b
    text: 「成し遂げる」は「完成する」または「終える」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: イエスは彼らに言われた
  rationale: 歴史的現在の λέγει は、自然な日本語の物語文として過去形で表した。敬意を保つため「言われた」とした。
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: わたしの食べ物とは
  rationale: 直前の実際の食事をめぐる会話とのつながりを保つため、「食べ物」という具体的な比喩をそのまま残した。
- source_word: ἵνα ποιήσω
  choice: 行い……ことです
  rationale: ἵνα＋接続法がここで示す内容を、日本語として自然な名詞節「こと」で表した。
- source_word: τὸ θέλημα
  choice: みこころ
  rationale: 神の意志を指す文脈で自然かつ敬意ある日本語であり、「遣わした方」が何を望まれるかという意味を簡潔に伝える。
- source_word: τοῦ πέμψαντός με
  choice: わたしを遣わした方
  rationale: 冠詞付き分詞の人格的な指示を保ちつつ、原文に明記されていない「父」や「神」という称号を本文へ補わなかった。
- source_word: τελειώσω
  choice: 成し遂げる
  rationale: 単に終えるだけでなく、委ねられたわざを目的どおり完成させる τελειόω の含みを自然に表す。
- source_word: αὐτοῦ τὸ ἔργον
  choice: その方のわざ
  rationale: αὐτοῦ の指示対象を明示しつつ、神の働き・使命を表す文脈にふさわしい「わざ」を用いた。
theological_decisions:
- issue: 「わたしを遣わした方」の指示対象
  choice: 本文では「わたしを遣わした方」とし、脚注で文脈上は父を指すと説明する。
  alternative: 「わたしを遣わした父」または「わたしを遣わした神」と明示する。
  rationale: ヨハネ福音書の文脈では父を指すが、この節のギリシア語自体にはその称号がないため、本文では暗示のまま保った。
- issue: τελειώσω の完成性
  choice: 「成し遂げる」
  alternative: 「終える」または「完成する」
  rationale: 使命を最後まで果たして完成へ導く意味を保ち、単なる作業の終了に狭めないようにした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの発言にふさわしい品位を保った。「食べ物」という比喩と、遣わした方を明示的に「父」と呼ばない原文の表現を維持した。
