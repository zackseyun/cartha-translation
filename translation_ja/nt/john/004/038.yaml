  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: ja
  text: わたしは、あなたがたが労苦してこなかったものを刈り取るために、あなたがたを遣わした[a]。ほかの人々が労苦してきた。そして、あなたがたはその人々の労苦の中に入っている[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「収穫するために」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その人々の労苦の実りを受けている」または「その人々の働きに加わっている」。ギリシア語では、より直訳的に「その人々の労苦の中に入っている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: 遣わした
  rationale: アオリストを自然な過去形で表し、弟子たちを派遣するという使命的な含みも保つ。
- source_word: θερίζειν
  choice: 刈り取る
  rationale: 直前から続く収穫の比喩を明確に保つ。「収穫する」も可能だが、動作をより直接に表す。
- source_word: ὃ οὐχ ὑμεῖς κεκοπιάκατε
  choice: あなたがたが労苦しなかったもの
  rationale: 関係代名詞の目的語を「もの」で自然に表し、完了形が示す先行する労苦と現在への関わりを文脈の中で伝える。原文にない「そのために」は加えない。
- source_word: ἄλλοι κεκοπιάκασιν
  choice: ほかの人々が労苦し
  rationale: 「ほかの人々」の具体的な指示対象を限定せず、κοπιάωを一貫して「労苦する」と訳す。
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: その人々の労苦の中に入った
  rationale: 原文の「彼らの労苦の中へ入る」という表現を保ち、「成果を受けた」「働きに加わった」と解釈的に限定しない。完了形の結果的状態は日本語では文脈上理解できる。
- source_word: ἐγὼ ... ὑμεῖς
  choice: わたしは……あなたがたを
  rationale: 明示された代名詞を訳出し、話者と弟子たちの対照を保つ。ただし不自然な強調表現は加えない。
theological_decisions:
- issue: 収穫の比喩における「ほかの人々」の指示対象
  choice: 特定せず「ほかの人々」とする
  alternative: 預言者たち、バプテスマのヨハネ、イエス自身、またはそれらを含む先行者と明示する
  rationale: 本文自体は指示対象を限定していないため、真正な曖昧さを保ち、特定の解釈を本文へ持ち込まない。
- issue: 「その人々の労苦の中に入った」の意味
  choice: 原文の比喩的表現をそのまま保つ
  alternative: 「その労苦の実りを受けた」または「その働きに加わった」
  rationale: 成果の享受とも働きへの参加とも理解し得る表現なので、一方に決めず原文の緊張を残す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「労苦」を反復してκοπιάω／κόποςの語彙的連関を示し、収穫の比喩と原文の曖昧さを保持した。
