  to: そこで、サマリア人の女はイエスに言った。「ユダヤ人であるあなたが、サマリア人の女である私に、どうして飲み物を求めるのですか。」（ユダヤ人はサマリア人と関わりを持たないからである。[a]）
  rationale: 社会的な隔たりを表す語を、現代日本語で誤解の少ない「関わりを持たない」に改めた。あわせて、原文が水を明示しない点を保つため「飲み水」を「飲み物」に改めた。脚注のアンカーを説明句に直接置き、本文の広い訳と脚注の狭い語義の関係を明確にした。
