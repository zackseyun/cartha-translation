id: JHN.4.9
reference: John 4:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: ja
  text: そこで、サマリア人の女はイエスに言った。「ユダヤ人であるあなたが、サマリア人の女である私に、どうして飲み物を求めるのですか。」（ユダヤ人はサマリア人と関わりを持たないからである。[a]）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ人はサマリア人と物を共用しない」。特に、飲み物の器などを共用しないという意味を含む可能性もある。
    reason: συγχρῶνταιは一般的な関わりのほか、物を共用することを指し得るため。
lexical_decisions:
- source_word: λέγει οὖν
  choice: そこで……言った
  rationale: οὖνが示す物語の進行と前文を受けたつながりを、自然な現代日本語で表した。
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: サマリア人の女
  rationale: 人物の性別と共同体上の帰属を明確に保ち、日本語として簡潔にした。
- source_word: Πῶς
  choice: どうして
  rationale: 方法を尋ねるというより、社会的慣習に反する依頼への驚きと疑問を表す文脈に適する。
- source_word: Ἰουδαῖος
  choice: ユダヤ人
  rationale: ここでは地域名だけでなく、サマリア人と対比される民族的・宗教的共同体の帰属を指す。
- source_word: ὢν
  choice: である
  rationale: 分詞の背景説明を保ちつつ、理由や譲歩のどちらかに限定しない表現とした。
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: 私に……飲み水を求める
  rationale: 飲むことを求めるという意味を文脈に即して自然に表し、依頼の相手が彼女であることも明示した。
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: サマリア人の女である私に
  rationale: 属格独立構文が示す彼女自身の属性と、それが驚きの背景であることを自然な語順で表した。
- source_word: συγχρῶνται
  choice: 交際しない
  rationale: 共同利用という限定的意味の可能性を残しつつ、本文では両共同体間の一般的な関わりの欠如を簡潔に表した。
theological_decisions:
- issue: ヨハネ文書における Ἰουδαῖος の意味
  choice: ユダヤ人
  alternative: ユダヤ地方の人
  rationale: この節ではユダヤとサマリアという地域だけでなく、社会的・宗教的共同体間の慣習が対比されているため。
- issue: συγχρῶνται の意味範囲
  choice: 一般的な社会的交際を指す表現を本文に置く
  alternative: 器などを共用しないという限定的意味
  rationale: 説明句は両集団の隔たりを広く述べると読むのが自然だが、直前の飲み水の依頼から、飲用器の共用を含む限定的意味もあり得るため脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。会話文は驚きを自然に示し、説明句は語り手の挿入として括弧内に置いた。
