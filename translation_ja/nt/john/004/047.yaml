  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: ja
  text: この人は、イエスがユダヤからガリラヤに来られたと聞くと、イエスのもとへ行き、下って来て息子を癒やしてくださるよう頼んだ[a]。息子が死にかけていたからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「頼み続けた」とも訳せる。ギリシア語の未完了過去は、依頼が続いていたことや繰り返されたことを示す場合がある。
    reason: lexical_alternative
  - marker: b
    text: 「下って来て」は、ガリラヤ地方にある二つの場所の標高差を反映した表現。
    reason: cultural_note
lexical_decisions:
- source_word: οὗτος
  choice: この人
  rationale: 直前に登場した王の役人を指す指示語の働きを保ちつつ、現代日本語の物語文として自然にした。
- source_word: ἀκούσας
  choice: 聞くと
  rationale: アオリスト分詞を主動詞に先立つ時を表す節として自然に訳した。
- source_word: ἥκει
  choice: 来ておられる
  rationale: 来た結果として現在そこにいるというἥκωの含意を表す。伝聞の内容として、イエスへの敬意を保つ日本語にした。
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: ユダヤからガリラヤに
  rationale: 起点を示すἐκと到着地を示すεἰςの方向性を簡潔に保持した。
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: イエスのもとへ行き
  rationale: 移動を示す動詞とπρὸς αὐτόνを自然な日本語で表し、代名詞の指示対象も明確にした。
- source_word: ἠρώτα
  choice: 頼んだ
  rationale: ἐρωτάωの依頼の意味を表す。未完了過去は継続的・反復的な依頼を示し得るが、文脈だけでは「何度も」と断定できないため本文では中立的にした。
- source_word: ἵνα καταβῇ
  choice: 下って来てくださるよう
  rationale: 依頼内容を示すἵνα節を自然な日本語にし、καταβαίνωの高度を下る移動も保持した。
- source_word: ἰάσηται
  choice: 癒やして
  rationale: 身体的な病の治癒を示す標準的で明瞭な語を用いた。
- source_word: αὐτοῦ τὸν υἱόν
  choice: 息子を
  rationale: 日本語では文脈から所有関係が明白なので、重い「彼の息子」を避けた。
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: 息子が死にかけていたからである
  rationale: μέλλωと不定詞が示す切迫した死を自然に表し、主語を明示して曖昧さを避けた。
theological_decisions:
- issue: 「死にかけていた」者の指示対象
  choice: 息子
  alternative: 役人またはイエス
  rationale: 直前の「息子」が最も近い名詞であり、物語の文脈でも病気の息子を指すことが明白である。
- issue: 未完了過去ἠρώταの継続・反復性
  choice: 本文では「頼んだ」とし、継続・反復の可能性を脚注に示す
  alternative: 「繰り返し頼んだ」「頼み続けた」
  rationale: 未完了過去は進行・反復を示し得るが、それだけで反復を必須とするわけではない。原文の幅を狭めないよう中立的に訳した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、聖書本文にふさわしい落ち着いた調子を保った。「癒やす」「〜からである」により一定の品位を確保しつつ、古風な言い回しは避けた。
