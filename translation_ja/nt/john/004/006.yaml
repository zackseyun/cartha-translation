source:
  edition: SBLGNT
  text: ἦν δὲ ἐκεῖ πηγὴ τοῦ Ἰακώβ. ὁ οὖν Ἰησοῦς κεκοπιακὼς ἐκ τῆς ὁδοιπορίας ἐκαθέζετο οὕτως ἐπὶ τῇ πηγῇ· ὥρα ἦν ⸀ὡς ἕκτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: ja
  text: そこにはヤコブの井戸[a]があった。そこでイエスは、旅で疲れていたので、井戸のそばにそのまま座っていた[b]。時は第六時ごろであった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「泉」。ギリシア語のπηγήは、泉または井戸を指し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳「そのように」。οὕτωςは、座り方や状態を指すと考えられ、「そのまま」と理解することもできる。
    reason: lexical_alternative
  - marker: c
    text: 日の出を起点に日中の時間を数える一般的なユダヤ式では、正午ごろ。ギリシア語本文は現代時刻への換算方法を明示していない。
    reason: historical_context
lexical_decisions:
- source_word: πηγὴ τοῦ Ἰακώβ
  choice: ヤコブの井戸
  rationale: πηγήは「泉」と「井戸」の両義を持ち得るが、水をくむ場所として描かれ、後続箇所ではφρέαρも用いられるため、本文では日本語として自然で定着した「井戸」とした。語義上の別訳は脚注に残した。
- source_word: κεκοπιακὼς ἐκ τῆς ὁδοιπορίας
  choice: 旅で疲れていたので
  rationale: 完了分詞が表す、旅の労苦の結果として疲れた状態と、文脈上の理由・状況を自然な現代日本語で示した。
- source_word: ἐκαθέζετο
  choice: 座っていた
  rationale: 未完了過去の継続的・描写的な側面を保ち、「腰を下ろした」という完結的な動作にはしなかった。
- source_word: οὕτως
  choice: 本文では自然な日本語の中に含意させ、脚注で明示
  rationale: 「そのように」「そのまま」など、座り方や疲れた状態を指す可能性がある難解な副詞である。本文で一つに限定すると不自然または過剰解釈になり得るため、訳文では明示せず脚注に残した。
- source_word: ἐπὶ τῇ πηγῇ
  choice: 井戸のそばに
  rationale: ἐπί＋与格の場所的用法を、座って休む位置として自然な日本語で表した。
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: 時は第六時ごろであった
  rationale: ὡςを「ごろ」、ἕκτηを「第六時」とし、時刻の数え方を本文で決めつけず原文の表現を保った。
- source_word: δὲ / οὖν
  choice: （δὲは無標）／そこで
  rationale: δὲは日本語で不要な接続語を足さず場面説明として訳し、οὖνは前述の井戸の存在とイエスがそこに座る流れを「そこで」で示した。
theological_decisions:
- issue: 「第六時」の現代時刻への換算
  choice: 本文では「第六時ごろ」を保持
  alternative: ユダヤ式の日中時刻なら「正午ごろ」／別の時刻計算法を想定する見解
  rationale: ギリシア語本文自体は時刻計算法を指定していない。ヨハネ福音書の時刻表現をめぐる議論を翻訳で解消せず、一般的理解を脚注で説明した。
- issue: イエスへの敬語表現
  choice: 「疲れていた」「座っていた」
  alternative: 「疲れておられた」「座っておられた」
  rationale: 原文には日本語の尊敬語に相当する標識がないため、現代標準日本語の平明な物語文体を用いた。これはイエスの身分についての判断を弱めるものではなく、訳文への解釈的敬語の付加を避けるためである。
translation_notes:
  register: 明瞭で平易な現代標準日本語を用いながら、物語文として落ち着いた品位を保った。「第六時」は日常語ではないが、原文の時刻表現にある解釈上の余地を保持するため本文に残し、脚注で説明した。
