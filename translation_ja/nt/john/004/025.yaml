id: JHN.4.25
reference: John 4:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: ja
  text: 女はイエスに言った。「私は、メシア、すなわちキリストと呼ばれる方が来られることを知っています。[a] その方が来られるとき、私たちにすべてのことを知らせてくださいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」はセム語由来の称号で、「キリスト」はそれに当たるギリシア語の称号。どちらも「油を注がれた者」という意味。
    reason: 原文が Μεσσίας を χριστός で説明する二言語的構造を明示し、両称号の関係を読者に伝えるため。
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: 女はイエスに言った
  rationale: 歴史的現在の λέγει は、自然な現代日本語の物語文として過去形にした。αὐτῷ は文脈上イエスを指すため、代名詞より明瞭な固有名で表した。
- source_word: Μεσσίας
  choice: メシア
  rationale: セム語由来の称号を、日本語で定着している「メシア」と音写した。
- source_word: ὁ λεγόμενος χριστός
  choice: すなわちキリストと呼ばれる方
  rationale: Μεσσίας をギリシア語の χριστός で説明する原文の二言語的構造を保つため、両語を区別した。日本語では挿入句として自然に読める形にした。
- source_word: ἔρχεται
  choice: 来られる
  rationale: 未来を指す現在形であり、「来られること」で到来への確信と敬意を自然に表した。
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: その方が来られるとき
  rationale: 未来の時を表す構文と、ἐκεῖνος の指示・強調を「その方」で保持した。
- source_word: ἀναγγελεῖ ἡμῖν ἅπαντα
  choice: 私たちにすべてのことを知らせてくださいます
  rationale: ἀναγγέλλω の「告げ知らせる、明らかにする」という文脈上の意味を平明に表し、ἅπαντα の包括性を「すべてのこと」で保った。
theological_decisions:
- issue: Μεσσίας と χριστός の関係
  choice: 「メシア、すなわちキリストと呼ばれる方」として二つの語を保持する
  alternative: 両方を「メシア」と訳し、原文の説明的な語の区別を脚注だけで示す
  rationale: 原文はセム語由来の Μεσσίας をギリシア語 χριστός で説明している。両方を同じ日本語にするとヨハネの説明構造が失われるため、定着した音写「メシア」と「キリスト」を併記した。これは別々の称号であるとの主張ではなく、同じ称号の言語的対応を示す。
- issue: メシアが知らせる「すべてのこと」の範囲
  choice: 限定を加えず「すべてのこと」とする
  alternative: 礼拝についてのすべて、または必要なすべて、と解釈して補う
  rationale: ἅπαντα の範囲は直接には限定されていないため、文脈的解釈を本文に持ち込まず包括的な表現を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、メシアへの敬意を「来られる」「その方」「知らせてくださいます」で表した。「すなわち」は原文の説明的同格を自然かつ格調を保って示す。
