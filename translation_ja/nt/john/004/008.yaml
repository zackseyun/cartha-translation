  yaml_path: translation/nt/john/004/008.yaml
  text: For his disciples had gone away into the city to buy food[a][b].
translation:
  language: ja
  text: 弟子たちは食べ物を買うために町へ行っていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: のである
  rationale: 直前の叙述を説明する接続辞の働きを、日本語では文末の説明表現で自然に示した。
- source_word: μαθηταὶ αὐτοῦ
  choice: 弟子たち
  rationale: 文脈上、イエスの弟子たちであることが明白なため、日本語として過剰にならないよう所有表現を省いた。
- source_word: ἀπεληλύθεισαν
  choice: 行っていた
  rationale: 過去完了が示す、場面の時点より前に町へ出かけて不在だった状態を自然な日本語で表した。
- source_word: εἰς τὴν πόλιν
  choice: 町へ
  rationale: 移動の方向を「へ」で示した。πόλις は都市規模を厳密に限定せず、この文脈では「町」が自然である。
- source_word: ἵνα
  choice: 〜に
  rationale: 目的を表す ἵνα を、動詞連用形に付く目的表現「〜に」で簡潔に訳した。
- source_word: τροφὰς
  choice: 食べ物
  rationale: この文脈で必要な食料を指す一般的で明瞭な現代日本語を選んだ。
- source_word: ἀγοράσωσιν
  choice: 買い
  rationale: 目的構文の中の意図された行為を、平明な動詞「買う」で表した。
