id: JHN.4.20
reference: John 4:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: ja
  text: 私たちの父祖[a]はこの山で礼拝しました。そして、あなたがたは、礼拝すべき場所[b]はエルサレムにあると言っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちの先祖」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「礼拝しなければならない場所」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: 私たちの父祖
  rationale: πατέρες の字義と、共同体の歴史的系譜を主張する言い方を保つため「父祖」とした。現代語としてより平易な「先祖」も可能なので脚注に示した。
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: この山で
  rationale: 礼拝が行われた場所を表す ἐν を、自然な現代日本語の場所表現「で」で訳した。
- source_word: προσεκύνησαν / προσκυνεῖν
  choice: 礼拝しました／礼拝すべき
  rationale: προσκυνέω はひれ伏す動作を含み得るが、ここでは礼拝場所をめぐる宗教的文脈なので「礼拝する」が最も自然で的確である。
- source_word: ὑμεῖς
  choice: あなたがた
  rationale: 明示された複数代名詞を訳し、「私たちの父祖」との対照を保った。本文に「ユダヤ人」などの説明は加えていない。
- source_word: ἐν Ἱεροσολύμοις
  choice: エルサレムに
  rationale: 場所の所在を表す自然な日本語として「エルサレムに」とした。ギリシア語地名の複数形は日本語に反映させる必要がない。
- source_word: ὁ τόπος
  choice: 場所
  rationale: 定冠詞を伴う名詞の単純な意味を保ち、「正しい場所」などの解釈的な語を加えなかった。
- source_word: προσκυνεῖν δεῖ
  choice: 礼拝すべき
  rationale: δεῖ の一般的・規範的な必要性を、明瞭で自然な日本語「すべき」で表した。より明示的な訳は脚注に示した。
- source_word: καὶ
  choice: そして
  rationale: 文脈上の対照は代名詞によって十分伝わるため、接続詞の連結的な意味を保って「そして」とした。
theological_decisions:
- issue: サマリア人とユダヤ人の対照を本文で明示するか
  choice: 「私たちの父祖」と「あなたがた」の対照にとどめた
  alternative: 「私たちサマリア人の先祖」「あなたがたユダヤ人」などと補う
  rationale: 原文は双方の民族名をこの節で明示しておらず、代名詞と文脈によって対照を示している。説明を加えて緊張関係を先取りしないため、原文の明示性に合わせた。
- issue: προσκυνεῖν δεῖ の非人称的な必要性
  choice: 「礼拝すべき場所」
  alternative: 「礼拝しなければならない場所」
  rationale: 特定個人への命令ではなく、礼拝の場所についての一般的・規範的主張として訳した。「すべき」は必要性を保ちつつ、現代日本語として簡潔で自然である。
- issue: καὶ の文脈的な対照性
  choice: 「そして」
  alternative: 「しかし」
  rationale: 発言内容には対照があるが、原文の接続詞自体は基本的に連結的である。日本語でも明示された「私たち」と「あなたがた」によって対照が伝わるため、逆接に強めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、歴史的系譜を示す「父祖」によって原文の言い回しを保った。文体は会話として自然で、同時に聖書本文にふさわしい落ち着きを持たせた。
