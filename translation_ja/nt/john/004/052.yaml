  source_fidelity: 「第七時」として時刻を換算せずに保持している点、および「熱が引く」という表現は、ギリシア語本文の意味を忠実に伝えている。「息子」は直前の文脈（4:50–51）から明確であり、代名詞の指示対象を明示してよい。ただし、κομψότερον ἔσχενは回復・改善へ転じた時点を尋ねる文脈なので、「よくなり始めた」とすると時点性がより明瞭になる。
  naturalness: 「彼らは彼に言った」は文法上可能だが、現代日本語の応答としては不自然で反復的である。質問への返答であることを自然に示す「彼らは彼に答えた」がよい。地の文は常体、奉仕者から父親への発話は丁寧体という区別も自然に機能する。
  terminology: 「第七時」は原文の曖昧さを保つ適切な訳語である。「熱が引きました」も病熱が去ったことを自然に表す。脚注は、日の出を起点とする理解では午後一時ごろとなることと、別の時刻計算の理解があることを、断定せず適切に示している。
