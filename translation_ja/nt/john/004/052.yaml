  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: ja
  text: そこで彼は、息子の具合がよくなり始めた時刻を彼らに尋ねた。すると彼らは彼に答えた。「昨日、第七時[a]に熱が引きました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 日の出から数える時刻法なら、午後一時ごろ。ヨハネによる時刻の数え方については、別の理解もある。
    reason: 原文の「第七時」が現代の何時に当たるかは、想定する時刻計算法によって異なるため。
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: そこで彼は……尋ねた
  rationale: ἐπύθετοは問い尋ねることを表し、οὖνは前節を受けた推移・帰結を示す。「そこで」は文脈とのつながりを自然に保つ。
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: 時刻を彼らに尋ねた
  rationale: ὥραはここでは特定の時点を指すため「時刻」とし、παρ’ αὐτῶνの情報源としての意味は、日本語として自然な「彼らに尋ねた」で表した。
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: 息子の具合がよくなった
  rationale: κομψότερον ἔχεινは健康状態が改善することを表す慣用句。「息子」はギリシア語の代名詞αὐτόςが文脈上指す対象を明示し、「具合がよくなった」で自然かつ正確に表した。
- source_word: εἶπαν οὖν αὐτῷ
  choice: すると彼らは彼に言った
  rationale: 応答へと進むοὖνを「すると」で表し、αὐτῷも省略せず「彼に」と訳した。
- source_word: ὥραν ἑβδόμην
  choice: 第七時
  rationale: 原文の時刻表現を現代時刻へ換算せず、そのまま保つことで、採用されている時刻制度を本文以上に断定しない。
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: 熱が引きました
  rationale: 直訳的な「熱が彼を離れた」の意味を、現代日本語で病熱の消退を自然に表す「熱が引いた」とした。従者の主人への返答として丁寧体を用いた。
theological_decisions:
- issue: 「第七時」の時刻計算法
  choice: 本文では「第七時」を保持する
  alternative: 日の出から数えて午後一時ごろと換算する、または別の時刻制度による時刻と理解する
  rationale: ギリシア語本文自体はどの時刻計算法かを明示していないため、本文では曖昧さを保ち、代表的な理解を脚注で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、物語文としての品位を保った。従者の返答は相手との関係を踏まえて丁寧体とした。
