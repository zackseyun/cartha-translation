id: JHN.4.5
reference: John 4:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔρχεται οὖν εἰς πόλιν τῆς Σαμαρείας λεγομένην Συχὰρ πλησίον τοῦ χωρίου ὃ ἔδωκεν Ἰακὼβ ⸀τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: ja
  text: そこでイエスは、サマリアのシカルという町[a]に来られた。そこは、ヤコブが息子ヨセフに与えた土地[b]の近くであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「都市」。ギリシア語 πόλις は、文脈により都市または町を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「畑」「地所」。ギリシア語 χωρίον は、畑、地所、一区画の土地を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: 来られた
  rationale: 物語上の歴史的現在を、自然な日本語の過去形で表した。主語は直前の文脈に基づき「イエス」と明示した。
- source_word: οὖν
  choice: そこで
  rationale: 前文を受けた推移・帰結を、現代日本語の物語として自然に示す。
- source_word: πόλιν τῆς Σαμαρείας
  choice: サマリアの…町
  rationale: πόλις は都市にも町にもなり得るため、規模を過大に示さない「町」を本文に採用し、別訳を脚注に残した。
- source_word: λεγομένην Συχὰρ
  choice: シカルという
  rationale: 地名を示す分詞表現を簡潔で自然な日本語にした。
- source_word: πλησίον
  choice: 近く
  rationale: 位置関係を簡潔に表す。
- source_word: χωρίου
  choice: 土地
  rationale: 畑に限定されない土地・地所を指し得る語なので、意味範囲の広い「土地」を採用した。
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: ヤコブが…与えた
  rationale: 関係節の内容を日本語の連体修飾として自然に表した。
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: 息子ヨセフに
  rationale: 与える相手と、ヨセフがヤコブの息子であることを明瞭かつ簡潔に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。歴史的現在は自然な過去形とし、二文に分けて読みやすくした。敬体ではなく聖書本文に適した常体を用い、イエスへの言及には「来られた」と穏当な尊敬表現を用いた。
