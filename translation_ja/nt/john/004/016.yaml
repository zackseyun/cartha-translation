  text: Λέγει ⸀αὐτῇ· Ὕπαγε φώνησον ⸂τὸν ἄνδρα σου⸃ καὶ ἐλθὲ ἐνθάδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/016.yaml
  text: He said to her[a], “Go, call your husband, and come here.”
translation:
  language: ja
  text: イエスは彼女に言われた[a]。「行って、あなたの夫を呼び、ここに来なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼女に言う」。ギリシア語では、物語を生き生きと語るために現在形を用いる「歴史的現在」が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: 言われた
  rationale: 物語中の歴史的現在。現代日本語の自然な叙述に合わせて過去形とし、イエスの発言であるため敬意を表す形を用いた。現在形のニュアンスは脚注に示した。
- source_word: αὐτῇ
  choice: 彼女に
  rationale: 発言の相手を示す与格代名詞を、そのまま自然な日本語で表した。
- source_word: Ὕπαγε
  choice: 行って
  rationale: 次の行為をするためにその場を離れるよう命じる表現。後続する命令と自然につなげた。
- source_word: φώνησον
  choice: 呼び
  rationale: この文脈では、人を呼ぶ、連れて来るよう声をかける意。「呼び」が簡潔で自然である。
- source_word: τὸν ἄνδρα σου
  choice: あなたの夫
  rationale: ἀνήρには「男」と「夫」の両義があるが、所有表現と直後の対話内容から、ここでは「夫」が文脈上の意味である。
- source_word: ἐλθὲ ἐνθάδε
  choice: ここに来なさい
  rationale: 場所を表すἐνθάδεを「ここに」とし、命令形ἐλθέを明確で自然な「来なさい」とした。「戻って」は含意され得るが、原文に明示されないため加えなかった。
