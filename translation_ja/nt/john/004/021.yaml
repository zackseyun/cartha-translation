id: JHN.4.21
reference: John 4:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· ⸂Πίστευέ μοι, γύναι⸃, ὅτι ἔρχεται ὥρα ὅτε οὔτε ἐν τῷ ὄρει τούτῳ οὔτε ἐν Ἱεροσολύμοις προσκυνήσετε τῷ πατρί.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: ja
  text: イエスは彼女に言われた。「婦人よ[b]、わたしの言うことを信じなさい[a]。あなたがたが父を礼拝するのが、この山でもエルサレムでもなくなる時[c]が来ます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「わたしを信頼しなさい」。ギリシア語の動詞は、語られることを信じる意味にも、その人を信頼する意味にもなり得る。
    reason: lexical_alternative
  - marker: b
    text: 「婦人よ」は、この文脈では敬意を込めた呼びかけであり、無礼な言い方ではない。
    reason: cultural_note
  - marker: c
    text: 「その時が来ます」とも訳せる。ギリシア語ではここで「時」に定冠詞がないが、ヨハネ福音書の「時」は、神の計画における決定的な時を指す主題的な語としてしばしば用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: わたしの言うことを信じなさい
  rationale: 与格の代名詞を伴う命令形で、まずこれから語ることを真実として受け入れるよう促している。日本語の「わたしを信じなさい」も可能だが、人格への全面的信頼という意味に寄りやすいため、本文では発言を信じる意味が自然に伝わる表現を採った。
- source_word: γύναι
  choice: 婦人よ
  rationale: 字義的には女性への呼びかけだが、この文脈では敬意を欠く表現ではない。「女よ」は現代日本語では不必要に無礼に響くため、意味と語調を保つ「婦人よ」とした。
- source_word: ἔρχεται ὥρα
  choice: そういう時が来ます
  rationale: ὥραはヨハネ福音書で神の計画における決定的な時を示す反復語となり得る。日本語では冠詞の有無を直接表せないため、「時」を保ちつつ、直前の内容を受ける自然な構文とした。
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: この山で
  rationale: 場所を示すἐνは、日本語では礼拝が行われる場所として「この山で」とするのが自然である。
- source_word: ἐν Ἱεροσολύμοις
  choice: エルサレムで
  rationale: 都市における礼拝の場所を自然な日本語で表した。ギリシア語の複数形は地名の慣用形であり、日本語では通常の単数地名として訳す。
- source_word: προσκυνήσετε
  choice: あなたがたが父を礼拝する
  rationale: 二人称複数の未来形であり、女性一人だけでなく共同体を含む「あなたがた」とした。προσκυνέωはこの議論では宗教的礼拝を指すため、「礼拝する」が適切である。
- source_word: τῷ πατρί
  choice: 父
  rationale: ヨハネ福音書の文脈では神を父として指す。日本語では固有の称号性を大文字で示せないが、「父」とすることで文脈上明確である。
- source_word: οὔτε ... οὔτε
  choice: この山でもエルサレムでもない
  rationale: 二つの礼拝場所をともに否定する対応表現。「この山でもなくエルサレムでもなく」とすると別の特定場所を暗示しやすいため、礼拝する場所がそのいずれでもないという原文の焦点を保った。
theological_decisions:
- issue: γύναιという呼びかけの語調
  choice: 敬意ある「婦人よ」と訳す
  alternative: 字義的な「女よ」と訳し、注で語調を説明する
  rationale: 原文には侮蔑の含みがなく、現代日本語の「女よ」は誤った無礼さを生む。「婦人よ」は説明的な愛称を加えず、呼びかけの尊重ある語調を伝える。
- issue: ヨハネ福音書におけるὥραの主題
  choice: 一般化しすぎず「時」を残す
  alternative: 「時代」または「時期」と意訳する
  rationale: 到来する救済史的転換の決定性を保ちつつ、それが具体的に何を指すかを本文で過度に限定しない。
- issue: 礼拝場所の否定が持つ範囲
  choice: 礼拝そのものではなく、二つの場所を否定する構文にする
  alternative: 「この山でもエルサレムでも父を礼拝しない時」と訳す
  rationale: 後者は父への礼拝自体がなくなるようにも読める。原文は礼拝の廃止ではなく、対比された場所への限定が終わることに焦点を置いている。
translation_notes:
  register: 明快な現代標準語を用い、イエスの発言には落ち着いた尊厳を持たせた。「言われた」「婦人よ」「礼拝する」により聖書本文としての品位を保ちつつ、古風すぎる語法は避けた。
