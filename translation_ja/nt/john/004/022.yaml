id: JHN.4.22
reference: John 4:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: ja
  text: あなたがたは知らないものを礼拝していますが、私たちは知っているものを礼拝しています。なぜなら、救いはユダヤ人[a]から来るからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人」は「ユダヤの民」とも訳せる。ヨハネ福音書の他の箇所では「ユダヤ地方の人々」が適する場合もあるが、ここでは礼拝と救いの歴史をめぐってサマリア人と対比されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: 礼拝しています
  rationale: この文脈では、単に身をかがめることではなく、宗教的な礼拝を指す。現在の継続的・一般的な実践を自然な日本語で表した。
- source_word: ὃ
  choice: もの
  rationale: 中性関係代名詞の表現を保ち、原文以上に人格的な『方』と特定しない。日本語でも『知らないもの／知っているもの』という対比が明瞭である。
- source_word: οἴδατε / οἴδαμεν
  choice: 知らない／知っている
  rationale: 礼拝の対象についての知識を表す鋭い対比を、簡潔で自然な現代日本語にした。
- source_word: ἡ σωτηρία
  choice: 救い
  rationale: 一時的な救出に限定せず、ヨハネ福音書における神の救いの働きを表す標準的な訳語である。
- source_word: ἐκ
  choice: から来る
  rationale: 起源・源を示す前置詞を、日本語として自然で明確に表す。単なる所属ではなく、救いがユダヤ人を通して歴史の中に現れることを示す。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人
  rationale: ここではサマリア人との礼拝および救済史上の対比が問題であり、『ユダヤ地方の人々』よりも民族・共同体を指す『ユダヤ人』が適切である。
theological_decisions:
- issue: 「救いはユダヤ人から来る」の意味
  choice: 救いが歴史的にユダヤ人を通してもたらされるという、起源と救済史上の媒介を述べる表現
  alternative: メシアがユダヤ人として生まれることだけを指す、またはユダヤ人の民族的優越を述べる表現
  rationale: 原文は救いの源をユダヤ人に位置づけるが、民族的優越を明言してはいない。メシアの出自、啓示、契約共同体という含みを一つに限定せず、原文の広がりを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前半の二つの節を「が」で結び、原文の直接的な対照を自然に示した。脚注記号は該当節全体、とりわけ「ユダヤ人」に関する語義説明として文末に置いた。
