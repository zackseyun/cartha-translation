  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: ja
  text: そして、はるかに多くの人々が、イエスのことばによって信じた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「さらに多くの人々が」とも訳せる。ギリシア語では比較級が強められている。
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: さらに多くの人々
  rationale: πολλῷ は比較級 πλείους を強めており、前節よりも信じる人が増えたことを、自然な現代日本語で表す。
- source_word: ἐπίστευσαν
  choice: 信じた
  rationale: アオリスト能動態直説法を簡潔に訳し、本文に明示されていない目的語や信仰成立の様態を補わない。
- source_word: διὰ τὸν λόγον
  choice: ことばによって
  rationale: διά＋対格はここで理由・契機を表す。「によって」は、イエスが語ったことが信じる契機となったことを自然に示す。
- source_word: λόγον
  choice: ことば
  rationale: この文脈ではイエスが語った内容を指す。「ことば」はヨハネ福音書における λόγος の語彙的響きを保ちつつ、日本語として理解できる。
- source_word: αὐτοῦ
  choice: イエスの
  rationale: 日本語では単独の「彼の」より指示対象を明示する方が自然であり、直前の文脈から指示対象はイエスである。
theological_decisions:
- issue: 救いに関わる物語での πιστεύω の訳し方
  choice: 信じた
  alternative: イエスを信じるようになった
  rationale: ギリシア語本文にはこの節で信じる対象が明示されていないため、対象や信仰成立の局面を訳文に加えず、ヨハネ福音書の文脈に委ねる。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「お言葉」は敬語的含意を加えるため避け、「ことば」を採用した。
