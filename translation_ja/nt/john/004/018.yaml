  text: πέντε γὰρ ἄνδρας ἔσχες, καὶ νῦν ὃν ἔχεις οὐκ ἔστιν σου ἀνήρ· τοῦτο ἀληθὲς εἴρηκας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: ja
  text: というのも、あなたには夫が五人いました[a]。今あなたと一緒にいる人は、あなたの夫ではありません。あなたが言ったことはそのとおりです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「夫」と訳した語と、後の「人」「夫」と訳した語は、いずれも同じギリシア語（ἀνήρ）です。この語は「男」とも「夫」とも訳せます。より字義的には、「あなたには五人の男がいました。今あなたが関係している者は、あなたの男（夫）ではありません」とも訳せます。ここでは文脈により、前半を「夫」と訳しました。
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: あなたには五人の夫がいました
  rationale: γάρの説明的な働きは、日本語では前文とのつながりによって十分伝わるため、機械的な「というのは」を避けた。ἄνδραςは文脈上、過去の婚姻関係を指すので「夫」とした。アオリストἔσχεςは過去の経歴として自然な「いました」で表した。
- source_word: καὶ νῦν ὃν ἔχεις
  choice: そして、今一緒にいる男は
  rationale: ἔχειςを直訳した「持っている」は人間関係について不自然で物扱いにも響くため、現在の関係を示す「一緒にいる」とした。ὃνが指す男性は「男」と明示した。
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: あなたの夫ではありません
  rationale: 属格σουとἀνήρはここでは婚姻関係を表すため、明瞭で自然な「あなたの夫」とした。
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: あなたが言ったことは本当です
  rationale: 完了形εἴρηκαςの発言と現在的な妥当性を、現代日本語で自然に表した。τοῦτοの指示内容も明確になる。
theological_decisions:
- issue: ἀνήρの二つの用例の意味
  choice: 第一の複数形は「夫」、第二は対照を明確にするため「男」と「夫」を使い分ける。
  alternative: 両方を形式的に「男」と訳す。
  rationale: ἀνήρには「男」と「夫」の両義がある。前半は過去の婚姻歴、後半は現在一緒にいる男性が夫ではないという対比であり、この訳し分けが文脈上の意味と語の緊張を最も自然に保つ。現在の関係について本文以上の道徳的・法的事情は補わない。
translation_notes:
  register: 明瞭な現代標準語。敬体を用いてイエスの落ち着いた断定を表した。「今一緒にいる」は関係を自然に示すが、同居など本文にない具体的事情までは断定しない。脚注記号は該当節末に置いた。
