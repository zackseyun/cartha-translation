  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: ja
  text: そこで、イエスは彼に言われた[a]。「あなたがたは、しるしと不思議なことを見なければ、決して信じない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見る」と「信じる」に当たるギリシア語の動詞は複数形です。そのため、イエスの言葉はこの役人一人だけでなく、より広い人々にも向けられていると考えられます。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた物語上・論理上の展開を、自然な現代日本語で示す。
- source_word: πρὸς αὐτόν
  choice: 彼に
  rationale: 発言の直接の相手が役人であることを簡潔に示す。
- source_word: Ἐὰν μὴ
  choice: 見なければ
  rationale: 条件を表す「もし……なければ」より簡潔で自然な形で、否定条件を保持する。
- source_word: σημεῖα
  choice: しるし
  rationale: ヨハネ福音書で、出来事そのものを越えて意味を指し示す語であるため、解釈を加えた「奇跡」ではなく「しるし」とする。
- source_word: τέρατα
  choice: 不思議な業
  rationale: 驚異を引き起こす非日常的な出来事を、現代日本語で分かりやすく表す。「しるし」との区別も保つ。
- source_word: ἴδητε
  choice: あなたがたは……見なければ
  rationale: 二人称複数形を「あなたがた」で明示し、発言が目の前の一人だけに限られない可能性を保持する。
- source_word: οὐ μὴ πιστεύσητε
  choice: 決して信じない
  rationale: οὐ μήによる強い否定を「決して」で表し、未来的断定の力を自然な日本語で保持する。
- source_word: πιστεύσητε
  choice: 信じない
  rationale: ヨハネ福音書における πιστεύω の通常の用法に従い、特定の解釈を加えず「信じる」と訳す。
theological_decisions:
- issue: 語りかけられた相手の数と発言の範囲
  choice: 導入部では一人の役人を指す「彼に」とし、イエスの発言では複数形を「あなたがた」と明示する。
  alternative: 発言全体を役人一人だけに向けられたものとして単数で訳す。
  rationale: 物語上の直接の相手は一人だが、ἴδητε と πιστεύσητε はともに二人称複数形であり、周囲の人々、またはより広い傾向を含む可能性がある。この緊張を訳文に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「しるし」はヨハネ特有の含意を保つため平仮名とし、「不思議な業」は日常的な「不思議」と区別しつつ、過度に古風にならない表現とした。
