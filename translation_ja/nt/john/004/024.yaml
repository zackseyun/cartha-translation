id: JHN.4.24
reference: John 4:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πνεῦμα ὁ θεός, καὶ τοὺς προσκυνοῦντας αὐτὸν ἐν πνεύματι καὶ ἀληθείᾳ δεῖ προσκυνεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: ja
  text: 神は霊である[b]。また、神を礼拝する者は、霊と真理において[a]礼拝しなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖霊と真理において」。ギリシア語の「霊」はここでは聖霊を指すと理解することもできるが、本文はその意味に限定せず、表現の幅を保っている。
    reason: alternative_reading
  - marker: b
    text: 「神は霊である」は神の本質を述べているのであり、神が数ある霊的存在の一つだという意味ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: 霊
  rationale: 無冠詞の述語名詞が主語に先行しており、神の本質・性質を表す。「一つの霊的存在」ではなく、「神は霊である」とした。
- source_word: ὁ θεός
  choice: 神
  rationale: 定冠詞によりこの節の主語であることが示される。日本語では固有の神を指す標準的な訳語として「神」とした。
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: 神を礼拝する者たち
  rationale: 冠詞付き現在分詞を、礼拝する人々一般を表す自然な日本語にした。代名詞は日本語で指示を明確にするため「神」とした。
- source_word: ἐν πνεύματι
  choice: 霊によって
  rationale: ἐν の働きには領域・あり方・手段の幅があり、日本語として自然な「によって」を用いた。聖霊への明示的な言及とも、人間の内面的誠実さだけとも断定しない。
- source_word: ἀληθείᾳ
  choice: 真理
  rationale: ヨハネ文書における事実性と啓示的実在の広がりを保つ標準的な訳語。単なる「誠実さ」には狭めない。
- source_word: δεῖ
  choice: しなければならない
  rationale: 必要性・必然性を明確に伝える現代標準日本語とした。
- source_word: προσκυνεῖν
  choice: 礼拝する
  rationale: この文脈での標準的な意味を表す。語源的な身体動作である「ひれ伏す」に限定しない。
theological_decisions:
- issue: 「神は霊である」の意味
  choice: 神の本質・性質についての質的な叙述
  alternative: 神は一つの霊的存在である
  rationale: πνεῦμα が無冠詞の述語名詞として主語より前に置かれているため、神を他の霊的存在と同じ一分類に入れるのではなく、その本質を述べる表現として訳した。
- issue: 「霊と真理によって」の意味
  choice: 礼拝が霊と真理によるものでなければならないという幅を保つ
  alternative: 聖霊と真理によって／心から真実に
  rationale: πνεύματι と ἀληθείᾳ はともに無冠詞であり、本文だけでは「聖霊」に明示的に限定されず、また単なる内面的誠実さにも限定されないため、その緊張を保持した。
- issue: 接続詞 καί の表現
  choice: 「だから」
  alternative: 「そして」
  rationale: 前半の神の本質と後半の礼拝の必要性との論理的なつながりが、日本語で自然に伝わるようにした。文脈上の帰結を明示するが、内容を追加するものではない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい端正な文体。「礼拝」「真理」は一般的に理解可能な定着語として保持した。脚注記号は該当語句の直後に置いた。
