  text: ἐξῆλθον ἐκ τῆς πόλεως καὶ ἤρχοντο πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/030.yaml
  text: They went out of the city and were coming to him[a].
translation:
  language: ja
  text: 人々は町を出て、イエスのもとへ向かっていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人々は町を出て、イエスのところへ来つつあった。」
    reason: ἤρχοντοは、イエスを基準点として「来ていた」と訳すこともできる。未完了過去は、その移動が進行中だったことを表す。
lexical_decisions:
- source_word: ἐξῆλθον
  choice: 出て
  rationale: アオリストとして、町の内側から外へ出たことを簡潔に表す。日本語では後続の移動と自然につながる。
- source_word: ἐκ τῆς πόλεως
  choice: 町を
  rationale: ἐκは内部からの移動を示し、日本語の移動表現では「町を出る」が自然。πόλιςは文脈上サマリアの町を指し、「町」が規模を過度に限定せず明瞭である。
- source_word: ἤρχοντο
  choice: 向かっていた
  rationale: 未完了過去の継続的・進行中の動きを保つ。「来ていた」も可能だが、日本語では視点が不自然になり得るため、目的地への接近を自然に示す表現を採る。
- source_word: πρὸς αὐτόν
  choice: イエスのもとへ
  rationale: πρός＋対格の人に向かう動きを表す。αὐτόνの指示対象は文脈上イエスであり、日本語では固有名を補うことで代名詞の曖昧さを避ける。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、未完了過去の進行性を「向かっていた」で保持した。「人々」はギリシア語動詞の三人称複数主語を文脈に即して明示した。
