id: JHN.4.12
reference: John 4:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: ja
  text: あなたは、私たちの父祖ヤコブよりも偉いのですか。[a] ヤコブは私たちにこの井戸を与え、ヤコブ自身も、その息子たちも、その家畜も、この井戸から水を飲みました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この問いは、原文では「まさか、あなたは私たちの父祖ヤコブよりも偉いわけではないでしょう」というように、否定の答えを予想しています。
    reason: 修辞疑問を導くギリシア語μήの含意を明示するため。
lexical_decisions:
- source_word: μὴ σὺ
  choice: あなたは……というのですか
  rationale: μήで始まる疑問文が否定の答えを予想する修辞疑問であることを、文脈に自然な挑戦的問いとして表した。強調されたσὺは「あなたは」で保持した。
- source_word: μείζων
  choice: よりも偉い
  rationale: 物理的な大きさではなく、身分や重要性における比較を表すため、「偉い」とした。
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: 私たちの父祖ヤコブ
  rationale: 祖先への敬意と共同体の系譜意識を明確にするため、現代日本語で自然な「父祖」を用いた。
- source_word: ἔδωκεν ἡμῖν
  choice: 私たちに……与え
  rationale: アオリストの歴史的事実を、自然な過去の叙述として表した。
- source_word: τὸ φρέαρ
  choice: この井戸
  rationale: φρέαρはここでは水をくむ井戸を指す。発話現場の井戸であるため、日本語では「この」を補うのが自然である。
- source_word: καὶ αὐτὸς
  choice: 彼自身も
  rationale: αὐτόςの強調を「自身」で保持し、後続する息子たちと家畜との並列を「も」で示した。
- source_word: ἐξ αὐτοῦ
  choice: ここから
  rationale: 代名詞は目の前の井戸を指すため、日本語では場所を示す「ここから」が自然である。
- source_word: ἔπιεν
  choice: 水を飲みました
  rationale: 目的語は明示されないが、井戸から飲む内容が水であることを日本語で自然に補った。アオリストは過去形とした。
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: その息子たち
  rationale: υἱοίの男性複数を一般化せず、「息子たち」と訳した。
- source_word: τὰ θρέμματα αὐτοῦ
  choice: 家畜
  rationale: 飼育される動物全般を指す語なので、範囲を牛だけに狭めない明瞭な現代語を選んだ。
theological_decisions:
- issue: μήが導く修辞疑問の力
  choice: 否定の答えを予想しつつ、問いの形を保つ
  alternative: 「まさか、あなたは私たちの父祖ヤコブより偉くはないでしょう」と否定を明示する
  rationale: 原文では話者が「いいえ」という答えを見込んでいるが、文法上は問いである。本文では修辞疑問を保ち、その含意を脚注で明示することで、挑戦的な響きと原文の余地を両立させた。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「父」では実父と誤解されうるため「父祖」とし、祖先への敬意を表した。
