  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: ja
  text: 彼がすでに下って行く途中で、彼の僕たちが彼を迎え、「あなたのお子さんは生きています」と告げた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「お子さん」は「子ども」「少年」「息子」とも訳せる。ギリシア語パイスは、文脈によっては「僕」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: すでに
  rationale: 彼が下る行動が、僕たちと会う時点ですでに進行中だったことを簡潔に示す。
- source_word: δὲ
  choice: （無訳）
  rationale: 物語を穏やかに進める接続辞であり、日本語では明示しないほうが自然な流れになる。
- source_word: καταβαίνοντος
  choice: 下って行く途中
  rationale: 現在分詞を伴う属格独立構文の継続的・同時的な動作を自然に表し、カナからカペナウム方面への地理的な下降も保つ。
- source_word: δοῦλοι
  choice: 僕たち
  rationale: 家の主人に従属する者という当時の社会的関係を示すため「僕」とした。「奴隷」より文脈に自然でありながら、単なる現代的な雇用人への軟化を避ける。
- source_word: ὑπήντησαν
  choice: 迎えに来て
  rationale: 単に偶然会ったというより、相手のもとへ出向いて会うという動詞の含意を自然に表す。
- source_word: λέγοντες
  choice: 告げた
  rationale: 会った際の付随行為を、日本語の物語文として自然な形にした。
- source_word: παῖς
  choice: お子さん
  rationale: 文脈上は役人の子を指すが、語自体には子ども・少年・僕という幅がある。「お子さん」は家族関係を自然に示しつつ、年齢を限定しない。
- source_word: ζῇ
  choice: 生きています
  rationale: 現在形の直接的な力を保ち、死の危険を脱して今も生きているという知らせを表す。「治りました」と解釈的に限定しない。
theological_decisions:
- issue: 癒やしの記事における παῖς の指示対象
  choice: お子さん
  alternative: 息子／僕
  rationale: ヨハネ4章全体では役人の息子を指すと理解できるが、この節の παῖς 自体は意味範囲が広い。本文では自然な家族語を用い、語の幅は注で明示する。
translation_notes:
  register: 明瞭で現代的かつ品位ある物語調。「僕」は「しもべ」と読み、歴史的な従属関係を示す。知らせの言葉は日本語として自然な敬意を表すため「あなたのお子さん」とした。
