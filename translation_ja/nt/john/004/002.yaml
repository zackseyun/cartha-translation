  text: καίτοιγε Ἰησοῦς αὐτὸς οὐκ ἐβάπτιζεν ἀλλ’ οἱ μαθηταὶ αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/002.yaml
  text: although Jesus himself was not baptizing[a], but his disciples were—
translation:
  language: ja
  text: もっとも、イエスご自身が洗礼を授けていたのではなく、弟子たちが授けていた—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίτοιγε
  choice: もっとも
  rationale: 直前の記述に対する譲歩的な補足を導く接続語。現代日本語として自然で、文脈を訂正せず限定する働きを表す。
- source_word: Ἰησοῦς αὐτὸς
  choice: イエスご自身
  rationale: αὐτόςの強調を「ご自身」で保持し、実際に洗礼を執行した者がイエス本人ではなかったことを明確にする。
- source_word: οὐκ ἐβάπτιζεν
  choice: 洗礼を授けていたのではなく
  rationale: 未完了過去の継続的・習慣的な含みを「授けていた」で表す。「洗礼を授ける」は明瞭で自然な現代日本語。
- source_word: ἀλλ’
  choice: なく
  rationale: 「ではなく……が」という対照構文により、イエスと弟子たちを明確に対比する。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちが授けていた
  rationale: ギリシア語では動詞が省略されているが、日本語では前節の「洗礼を授ける」を補って意味を自然かつ明確に示す。αὐτοῦは日本語の文脈上明白なため、重い「彼の」を避けて「弟子たち」とした。
theological_decisions:
- issue: イエスの宣教活動において誰が洗礼を執行したかという補足
  choice: イエス本人ではなく、弟子たちが洗礼を授けていたと訳す。
  alternative: 「イエスは洗礼を授けず、弟子たちが授けた」と単純過去的に訳す。
  rationale: αὐτόςの強調と未完了過去の継続的・習慣的側面を保持しつつ、本文を越えた神学的説明は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前後をつなぐ挿入的な補足であることを「もっとも」と文末のダッシュで示した。脚注を要するほどの実質的異読・不可避な曖昧さはない。
