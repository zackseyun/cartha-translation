id: JHN.4.13
reference: John 4:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: ja
  text: イエスは彼女に答えて言われた。「この水を飲む者は皆、また喉が渇く。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「再び渇く」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えて
  rationale: 応答を表す標準的な物語表現。後続の「言われた」と区別しつつ、原文の二重の発話表現を保持する。
- source_word: εἶπεν
  choice: 言われた
  rationale: 一般的な発話動詞。現代日本語として通じる敬意ある叙述形を用い、ἀπεκρίθηとともに訳出した。
- source_word: αὐτῇ
  choice: 彼女に
  rationale: サマリア人の女性を指す与格の間接目的語を明示した。
- source_word: Πᾶς ὁ πίνων
  choice: 飲む者は皆
  rationale: 冠詞付き現在分詞の一般的・反復的な意味と、例外のない範囲を自然な日本語で表す。文法上の男性形は性別を限定しない総称表現である。
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: この水を
  rationale: 日本語では飲む対象を助詞「を」で示すのが自然であり、τούτουの指示性も「この」によって保持する。
- source_word: διψήσει
  choice: 喉が渇く
  rationale: 未来の帰結を表す動詞。日本語では「渇く」だけより「喉が渇く」が明確で自然であり、文脈上も身体的な渇きを指す。
- source_word: πάλιν
  choice: また
  rationale: 渇きが再び生じることを簡潔で自然な現代日本語で表す。
theological_decisions:
- issue: ἀπεκρίθη ... καὶ εἶπεν の二重の発話表現
  choice: 「答えて言われた」と両方の動詞を訳す
  alternative: 「答えられた」または「言われた」の一語にまとめる
  rationale: ヨハネ文書に見られる原文の語り口を保ち、不必要に平滑化しないため。
- issue: Πᾶς ὁ πίνων の総称的な男性形
  choice: 性別を限定しない「飲む者は皆」
  alternative: 男性に限定して読める表現
  rationale: この構文は男性だけでなく、この水を飲むすべての人を一般的に指しているため。
- issue: 現在分詞と未来動詞が示す一般的真理
  choice: 「飲む者は皆、また喉が渇く」
  alternative: 一回限りの出来事として限定する訳
  rationale: この水を飲む人には再び渇きが生じるという一般的な対比を保持するため。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの発話を含む聖書叙述にふさわしい落ち着いた文体とした。「答えて言われた」は原文の二動詞を保持するため、やや改まった表現を採用している。
