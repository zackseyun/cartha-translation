  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: ja
  text: イエスは彼に言われた。「行きなさい。あなたの息子は生きている。」その人は、イエスが彼に言われた言葉を信じ、そのまま行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορεύου
  choice: 行きなさい
  rationale: 現在命令形の簡潔な命令を、自然で明瞭な日本語にした。文脈上は帰路につくことを促しているが、動詞自体に目的地を補わない。
- source_word: ὁ υἱός σου
  choice: あなたの息子
  rationale: υἱόςの性別を含む具体的な意味を保ち、一般的な「子ども」にはしなかった。
- source_word: ζῇ
  choice: 生きている
  rationale: 現在形をそのまま表し、将来の「生きるだろう」とはしない。文脈では息子が生きており、回復していることを示す。
- source_word: ἐπίστευσεν
  choice: 信じ
  rationale: πιστεύωの基本的な意味を保つ。「信頼した」も文脈上可能だが、信仰の性質を必要以上に限定せず、ヨハネ福音書における信じることの緊張を残す。
- source_word: ὁ ἄνθρωπος
  choice: その人
  rationale: この節の一般名詞ἄνθρωποςを反映し、前の文脈から「役人」を補わない。既出人物を指す自然な日本語として「その人」とした。
- source_word: τῷ λόγῳ
  choice: 言葉
  rationale: ここではイエスが口にした発言を指す。後続の関係節に相当する表現によって内容が明確になる。
- source_word: ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: イエスが彼に言われた
  rationale: 「言葉」を修飾する構造と、発言者・受け手を明示した。イエスに対する自然な敬意を表すため「言われた」とした。
- source_word: ἐπορεύετο
  choice: 帰っていった
  rationale: 未完了過去が示す、命令を受けて道を進んでいく物語上の動きを自然に表した。文脈上、息子のもとへ戻る移動である。
theological_decisions:
- issue: イエスの言葉への応答としてのπιστεύωの訳
  choice: 信じ
  alternative: 信頼し
  rationale: この節は、イエスの約束の言葉をその人が真実として受け入れたことを述べるが、それを救いに至る信仰か単なる確信かに限定していない。「信じる」は原語の範囲と物語上の神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの発言には簡潔さと威厳を保った。「生きている」は宣言の現在性を明確にし、「その人」は原文がこの節で一般名詞を用いる点を保持している。
