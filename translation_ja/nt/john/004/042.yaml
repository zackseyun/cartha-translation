  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: ja
  text: そして彼らは、その女性にこう言っていた。「私たちはもはや、あなたが語ったことによって信じているのではありません[a]。私たち自身が聞き、この方こそ本当に世の救い主であると知っています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたの話のゆえに」。ここでの「語ったこと」は、その女性の証言を指します。
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: そして彼らは、その女にこう言っていた
  rationale: 与格を発言の相手として訳し、τεの緩やかな接続を「そして」で表した。未完了過去ἔλεγονは、彼らが語っていた場面を示す「言っていた」とした。
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: 私たちが信じるのは、もうあなたの話を聞いたからではありません
  rationale: οὐκέτιを「もう〜ではありません」、διά＋対格の理由を「〜から」とした。λαλιάは女性の語った証言を指すので、現代日本語として自然な「あなたの話を聞いた」と訳した。「信じる」こと自体の終了ではなく、その根拠の変化であることが明瞭になる語順を用いた。
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: 私たちは自分で聞き
  rationale: 強意のαὐτοίを「自分で」とし、伝聞との対比を保った。完了形ἀκηκόαμενは、実際に聞いたことに基づく現在の確信という文脈から、日本語では自然な「聞き」とした。
- source_word: καὶ οἴδαμεν
  choice: そして…分かったのです
  rationale: οἴδαμενは現在の確かな認識を表す。「知っています」も可能だが、女性の証言から直接聞くことを経て確信に至った流れを自然な日本語で示すため「分かったのです」とした。
- source_word: οὗτός
  choice: この方こそ
  rationale: 指示代名詞の強調を「この方こそ」で表した。イエスへの敬意を含む自然な日本語であり、単なる「彼」より原文の指示的・強意的な力を保つ。
- source_word: ἀληθῶς
  choice: 本当に
  rationale: 告白の真実性を強調する副詞として、明瞭で荘重さも損なわない「本当に」を選んだ。
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: 世の救い主
  rationale: 新約聖書の定着した表現を用い、κόσμοςの広い範囲を限定も拡張もせずに保った。
theological_decisions:
- issue: サマリア人の告白における「世」の範囲
  choice: 世の救い主
  alternative: すべての人の救い主／世から選ばれた者たちの救い主
  rationale: κόσμοςを原文どおり広く「世」とし、その対象範囲を特定の教理体系によって狭めたり、「すべての人」と説明的に広げたりしなかった。
- issue: 信仰の内容と根拠の区別
  choice: 信じることをやめたのではなく、女性の証言だけを根拠に信じる段階ではなくなったことが分かる構文
  alternative: 「もうあなたの話のために信じているのではない」という逐語的だが誤読されやすい表現
  rationale: οὐκέτιはπιστεύομενそのものではなく、διά句が示す信仰の根拠に関わる。彼らの信仰が継続し、直接聞いたことによって確かなものとなったという対比を保持した。
translation_notes:
  register: 現代の一般読者に明瞭な、自然で品位ある「です・ます」調の直接話法とした。「この方こそ」によってοὗτόςの強調を保ち、「世の救い主」という聖書的に定着した表現を採用した。
