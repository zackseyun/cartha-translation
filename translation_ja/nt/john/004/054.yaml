  yaml_path: translation/nt/john/004/054.yaml
  text: This again was the second sign Jesus did after coming from Judea into Galilee[a].
translation:
  language: ja
  text: イエスがユダヤからガリラヤに来てから行った、二度目のしるし[a]がこれであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奇跡」とも訳せる。ヨハネはこの語をよく用い、力ある行為そのものだけでなく、それが指し示す意味にも注意を向けている。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: これ
  rationale: 直前に語られた役人の息子の癒やしを指す指示語として、自然な日本語の「これ」とした。
- source_word: δὲ πάλιν δεύτερον
  choice: これで二度目であった
  rationale: δέの緩やかな接続、πάλινの反復、第二を表すδεύτερονを、日本語として自然なまとめ方で表した。反復と順序の両方を保持している。
- source_word: σημεῖον
  choice: しるし
  rationale: ヨハネ福音書では、力ある行為そのものだけでなく、それが指し示す意味を帯びる重要な語であるため、「奇跡」ではなく「しるし」とした。
- source_word: ἐποίησεν
  choice: 行った
  rationale: σημεῖονとの組み合わせに適した自然で明瞭な表現。「なさった」より現代的で、「実行した」ほど硬くない。
- source_word: ἐλθὼν
  choice: 来て
  rationale: アオリスト分詞の時間的関係を、簡潔で自然な連用表現によって示した。
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: ユダヤからガリラヤに
  rationale: 出発点を表すἐκと到着方向を表すεἰςを、それぞれ自然な日本語の「から」「に」で表した。
theological_decisions:
- issue: ヨハネ福音書におけるσημεῖονの用語法
  choice: しるし
  alternative: 奇跡
  rationale: 力ある出来事がイエスについて何かを指し示すという、ヨハネ福音書の文学的・神学的機能を保つ。出来事の性質を過度に説明せず、原語の含意も狭めない。
- issue: 「二度目」が数える範囲
  choice: 原文と同様、文脈に委ねる
  alternative: 「ガリラヤで行った二番目のしるし」などと明示する
  rationale: 原文は「ガリラヤで」という場所限定を明示的には加えていない。カナでの先のしるしとの文脈的なつながりは保ちつつ、数え方を本文で説明しすぎない。
translation_notes:
  register: 明瞭な現代標準語を用いた。「これで二度目であった」により、原文の反復と序数を不自然な直訳調を避けて表現した。
