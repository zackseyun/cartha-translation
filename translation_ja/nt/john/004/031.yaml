id: JHN.4.31
reference: John 4:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ἐν τῷ μεταξὺ ἠρώτων αὐτὸν οἱ μαθηταὶ λέγοντες· Ῥαββί, φάγε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: ja
  text: その間[a]、弟子たちはイエスに、「ラビ[b]、お食べください」としきりに勧めていた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そのころ」。
    reason: lexical_alternative
  - marker: b
    text: 「ラビ」はユダヤ人が教師に用いた呼びかけで、「先生」という意味。
    reason: cultural_note
  - marker: c
    text: 「しきりに勧めていた」は「頼んでいた」とも訳せる。原語の動詞はここでは、イエスに食べるよう繰り返し求める意味合いを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: その間
  rationale: 直前の出来事と次の対話との間の時を示す慣用表現。現代日本語として自然で、時間的なつながりを明確にする。
- source_word: ἠρώτων
  choice: しきりに勧めていた
  rationale: 未完了過去が表す継続・反復と、食べるよう求める文脈上の働きを併せて示す。語そのものは「頼んでいた」とも訳せるため、脚注で代案を示す。
- source_word: αὐτὸν
  choice: イエスに
  rationale: 日本語では代名詞の「彼に」より指示対象を明示するほうが自然で、文脈上の指示対象もイエスである。
- source_word: οἱ μαθηταὶ
  choice: 弟子たちは
  rationale: 定冠詞は文脈上既知の弟子たちを指す。日本語では所有表現を補わずとも指示対象が明らかである。
- source_word: λέγοντες
  choice: 「……」と
  rationale: 分詞が依頼の発話内容を導くため、日本語の自然な引用構文に組み込む。
- source_word: Ῥαββί
  choice: ラビ
  rationale: ユダヤ教的背景を持つ呼びかけの称号を保持する。意味は脚注で説明する。
- source_word: φάγε
  choice: お食べください
  rationale: 単数アオリスト命令形。弟子から師への発話として、命令の内容を保ちながら自然な敬語の依頼表現とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。語りは簡潔で品位を保ち、弟子が師であるイエスに話す場面にふさわしく「お食べください」と敬語を用いた。
