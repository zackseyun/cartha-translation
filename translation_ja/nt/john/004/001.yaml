id: JHN.4.1
reference: John 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: ja
  text: そこでイエスは、ファリサイ人が、イエスはヨハネより多くの弟子をつくり、洗礼を授けている[a]と聞いたことを知ると――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスはヨハネより多く弟子をつくり、より多く洗礼を授けている」。ギリシャ語の比較表現は、「弟子」の数だけに係るのではなく、弟子をつくることと洗礼を授けることを合わせた活動に係るとも読める。
    reason: 比較表現πλείονας…ἢの係り方に構文上の幅があるため。
lexical_decisions:
- source_word: Ὡς οὖν
  choice: そこで、…知ると
  rationale: ὡςの時を示す働きを「…知ると」で、οὖνの推移・帰結を「そこで」で表した。日本語として自然に次節へ続く形にした。
- source_word: ἔγνω
  choice: 知った／知ると
  rationale: ここでは、ファリサイ派の人々が聞いたことをイエスが認識した、あるいは知るに至ったことを表す。文が次節まで続くため「知ると」とした。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 集団名であることが現代の一般読者にも明瞭になる表現を採用した。
- source_word: ἤκουσαν
  choice: 聞いた
  rationale: 報告がファリサイ派の人々の耳に入ったことを、簡潔で自然な日本語で表した。
- source_word: πλείονας μαθητὰς
  choice: より多くの弟子
  rationale: 比較級と名詞の組み合わせを直接的に表し、人数の比較を保持した。
- source_word: ποιεῖ
  choice: 弟子を作り
  rationale: ποιεῖとμαθητάςの結び付きを保った。「弟子を得て」と意訳しすぎず、原文の表現に近い訳とした。
- source_word: βαπτίζει
  choice: 洗礼を授けている
  rationale: 新約聖書の物語文におけるβαπτίζωの標準的で明瞭な訳語を用いた。
- source_word: ἢ Ἰωάννης
  choice: ヨハネより
  rationale: 比較構文を簡潔に示し、ヨハネとの対比を保持した。
theological_decisions:
- issue: イエス自身が洗礼を授けていたように読める可能性
  choice: 4章1節の表面上の語り方をそのまま保ち、「イエスが…洗礼を授けている」とした。
  alternative: 次節を先取りして「イエスの弟子たちが洗礼を授けている」などと訳す。
  rationale: 4章2節が直ちに、実際に洗礼を授けていたのは弟子たちであると説明する。1節ではその説明を先取りせず、原文の緊張を保持する。
translation_notes:
  register: 明瞭な現代標準日本語。文は4章3節へ続くため、末尾をダッシュで示した。原文にある「イエス」の反復も保持し、入れ子になった伝聞節の主語を曖昧にしないようにした。
