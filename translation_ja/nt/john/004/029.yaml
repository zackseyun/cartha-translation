source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: ja
  text: 「来て、私がしたことをすべて私に話した人を見てください。もしかすると、この方がメシアなのでしょうか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「まさか、この方がメシアなのでしょうか。」原文の疑問辞は、ためらいを表し、否定的な答えを予想する場合がある。
    reason: μήτιが持つ、可能性を探る問いと否定予想の含みを示すため。
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: 来て、見てください
  rationale: 二つの命令を自然な呼びかけとして訳し、招く力と「見る」行為の両方を保った。
- source_word: ἄνθρωπον
  choice: 人
  rationale: ここではイエスを指す単数の人物。日本語では文脈上、性別を重ねて明示せず「人」とするのが自然である。
- source_word: ὃς εἶπέ μοι πάντα ὅσα ἐποίησα
  choice: 私がしてきたことを何もかも言った人
  rationale: πάντα ὅσαの包括性を「何もかも」で表し、アオリストは現在までの過去を振り返る自然な日本語として「してきた」とした。「言い当てた」は正確さの評価を加えるため避けた。
- source_word: μήτι
  choice: もしかすると、…なのでしょうか
  rationale: 否定的な答えを予想し得る疑問の形を保ちつつ、この文脈で聞き手に可能性を考えさせる、ためらいを帯びた問いとして自然に表した。
- source_word: ὁ χριστός
  choice: メシア
  rationale: 固有名ではなく、ユダヤ的背景を持つ称号として機能しているため、意味を伝える「メシア」とした。
theological_decisions:
- issue: χριστόςを称号としてどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: この箇所では待望される油注がれた者を示す称号であり、日本語でもその文脈が伝わる「メシア」が適切である。
- issue: μήτιの問いが示すためらい
  choice: もしかすると、この方がメシアなのでしょうか
  alternative: まさか、この方がメシアではないでしょうね
  rationale: 原文が含み得る否定予想を断定的な不信へ固定せず、女性が可能性を提示して人々を招くという文脈上の緊張を保った。
translation_notes:
  register: 明瞭で現代的な敬体。女性が町の人々へ直接呼びかける勢いを保ちつつ、μήτιの曖昧な問いを過度な確信にも不信にも寄せない表現とした。
