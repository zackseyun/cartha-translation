  - severity: medium
    issue: 脚注の「わたしはある（わたしである）」という説明。
    rationale: Ἐγώ εἰμι の逐語的説明として日本語が不自然で、原文の構文も十分に示していません。「『わたしは、あなたに話している者である』」のように全体の構造を示し、文脈から補われる「その方／そのメシア」がギリシア語本文に明示されないことを説明するのが明瞭です。
