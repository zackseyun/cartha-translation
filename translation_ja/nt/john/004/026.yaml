  text: λέγει αὐτῇ ὁ Ἰησοῦς· Ἐγώ εἰμι, ὁ λαλῶν σοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/026.yaml
  text: Jesus said to her[a], “I am, the one speaking to you.”
translation:
  language: ja
  text: イエスは彼女に言われた。「わたしです[a]。あなたに話している者です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしがその方です」。ギリシア語は直訳すると「わたしは、あなたに話している者である」。直前の節で語られたメシアとの同定は文脈から理解されるが、「その方」や「メシア」に当たる語はこの節の本文には明示されていない。
    reason: 原文に明示されない補語を補う慣用的な別訳と、ギリシア語の簡潔な自己同定を示すため。
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在形だが、日本語の物語として自然な過去形にした。イエスの発言なので、現代標準語の敬意ある表現として「言われた」を用いた。
- source_word: αὐτῇ
  choice: 彼女に
  rationale: 与格の間接目的語を自然な日本語で表した。
- source_word: Ἐγώ εἰμι
  choice: わたしです
  rationale: 直訳的な「わたしである」は日本語では単独で不自然になりやすいため、文脈上の自己同定を簡潔に表す「わたしです」とした。「それです」や「わたしがメシアです」とはせず、原文に明示されない補語を本文に加えなかった。
- source_word: ὁ λαλῶν σοι
  choice: あなたと話している、このわたしです
  rationale: 冠詞付き現在分詞の自己同定を、継続中の会話が伝わる自然な日本語で表した。σοι は字義的には「あなたに」だが、この場面では相互の会話なので「あなたと」が自然である。
theological_decisions:
- issue: メシアであるとの同定を本文で明示するか
  choice: 「わたしです」とし、メシアという補語を明示しない
  alternative: 「わたしがそのメシアです」／「それはわたしです」
  rationale: 直前の4章25節により、イエスが待望のメシアとしてご自身を示していることは明らかだが、この節のギリシア語には「メシア」や「彼」に当たる補語がない。簡潔な自己同定を保ち、表現が持ちうる神学的な響きを狭めないようにした。
translation_notes:
  register: 明瞭な現代標準日本語。会話としての自然さと荘重さを両立させた。「わたしです」を反復することで、原文の同格的な構造と強調された自己同定を日本語で伝えている。
