  source_fidelity: 本文はメシアという補語を加えず、ἐγώ εἰμι の簡潔な自己同定を「わたしです」とした点で原文に忠実です。ただし、後半の ὁ λαλῶν σοι は「あなたに話している者」であり、「あなたと話している」とするよりも、与格 σοι の方向性を保つ訳が適切です。
  naturalness: 現行の「あなたと話している、このわたしです」は、「わたしです」の反復と指示語的な「この」が現代標準日本語としてやや不自然です。二文にして「あなたに話している者です」とすれば、簡潔で自然な発話になります。
  terminology: 「イエス」「彼女」「わたし」は適切です。敬語の「言われた」も本文全体の想定される聖書文体に適合します。注の「わたしはある（わたしである）」は日本語として不正確かつ不自然なので、ギリシア語の逐語的構造を明示しつつ、文脈的な補語が原文にないことを明確にします。
  issues:
