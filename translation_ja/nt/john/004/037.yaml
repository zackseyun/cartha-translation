  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: ja
  text: というのも、この点では、「一人が種をまき、別の人が刈り取る」ということわざ[a]が真実だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「言葉」または「格言」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: この点では
  rationale: 直前から続く状況を指す指示表現を保ちつつ、現代日本語として自然にした。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 前節の内容を説明し、根拠づける接続機能を自然な日本語で明示した。
- source_word: ὁ λόγος
  choice: ことわざ
  rationale: 後に内容が示される一般的な格言を指すと考えられるため。「言葉」より文脈に即しているが、語義の幅は脚注に残した。
- source_word: ἀληθινός
  choice: 真実
  rationale: ここでは、そのことわざが当てはまること、真であることを表す。
- source_word: ὅτι
  choice: 「……」という
  rationale: ことわざの内容を導く接続詞を、日本語では引用と「という」によって自然に表した。
- source_word: ἄλλος ... καὶ ἄλλος
  choice: ……者と……者は別である
  rationale: 種をまく者と刈り取る者が同一ではないという対照を、簡潔で格言らしい日本語で保った。
- source_word: ὁ σπείρων
  choice: 種をまく者
  rationale: 実体詞的な現在分詞の動作性を保ち、「種まく人」より明瞭にした。
- source_word: ὁ θερίζων
  choice: 刈り取る者
  rationale: ὁ σπείρωνとの平行を保ち、収穫する行為を自然に表した。
theological_decisions:
- issue: 農耕のことわざが指す人物
  choice: 種をまく者と刈り取る者を本文中で特定しない
  alternative: 預言者、バプテスマのヨハネ、イエス、弟子たちなどに割り当てて訳す
  rationale: この節のギリシア語本文は両者の具体的な人物を明示していないため、適用は文脈と読者の解釈に委ねた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、格言としての簡潔さと、前節を説明するγὰρのつながりを保った。引用部分は常体、叙述部分は丁寧体として自然に整えた。
