id: JHN.4.14
reference: John 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: ja
  text: しかし、わたしが与える水を飲む者は、だれでも永遠に渇くことがない。むしろ、わたしが与える水は、その人のうちで、水が湧き出る泉となり、永遠のいのちへと湧き上がる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: 永遠に渇くことがない
  rationale: 強い否定 οὐ μή と、時の持続を表す εἰς τὸν αἰῶνα の双方を明示し、原文の強調を自然な現代日本語で保った。
- source_word: πηγὴ ὕδατος
  choice: 泉
  rationale: 「水の泉」とすると日本語では重複感が強いため、水が湧き出る源という意味を簡潔に表した。
- source_word: ἁλλομένου
  choice: 湧き上がる
  rationale: 水が勢いよく跳ね上がる、湧き出るという分詞の生動感を保つ表現とした。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: ヨハネ福音書の中心的な語句として、日本語聖書で理解されやすく、単なる長寿以上の含意を残す訳語を採用した。
theological_decisions:
- issue: εἰς ζωὴν αἰώνιον が示す泉の動きの方向・結果
  choice: 永遠のいのちへと湧き上がる
  alternative: 永遠のいのちに至るまで湧き出る
  rationale: 前置詞 εἰς の方向性・到達点を「へと」で保持しつつ、それが時間的継続だけなのか結果なのかを過度に限定しない。
- issue: 比喩的な「水」の解釈
  choice: 本文では「水」のまま訳す
  alternative: 聖霊／救いを与える水
  rationale: 文脈上の神学的含意を訳文に直接補わず、イエスの比喩が持つ広がりと、後続文脈による展開を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「わたし」「だれでも」「その人」を用いて指示関係を自然にし、原文の対比 ἀλλά は「それどころか」で強く示した。
