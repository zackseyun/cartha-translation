  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: ja
  text: イエスご自身が、「預言者は自分の故郷では尊敬されない」と証言されたからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の国では」または「自分の郷里では」とも訳せる。ギリシア語のπατρίςは、人の故国、出身地域、郷里を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: からである
  rationale: 周囲の叙述に対する説明を導く接続詞として、文末表現により自然な現代日本語で談話上の機能を保った。
- source_word: αὐτὸς ... Ἰησοῦς
  choice: イエスご自身が
  rationale: αὐτόςの強意を「ご自身」で表し、イエスへの自然な敬意を伴う標準的な日本語とした。
- source_word: ἐμαρτύρησεν
  choice: 証言しておられた
  rationale: ヨハネ福音書で重要な証言・証しの語彙を保持した。アオリストは、この移動に先立つ発言を背景として提示する文脈に合わせ、日本語では「しておられた」とした。
- source_word: ὅτι
  choice: 「…」と
  rationale: 証言の内容を日本語で自然な直接引用として導いた。命題内容自体は変更していない。
- source_word: προφήτης
  choice: 預言者は
  rationale: 無冠詞単数の格言的・一般的用法を、日本語の主題提示「は」によって表した。
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: 自分の故郷では
  rationale: ἰδίᾳを「自分の」、πατρίςを広く出生地・郷里・故郷を指し得る「故郷」と訳し、具体的な地域を確定しなかった。
- source_word: τιμὴν οὐκ ἔχει
  choice: 尊敬されない
  rationale: 直訳的な「誉れを持たない」より自然で明瞭な日本語としつつ、その土地で敬意・評価を受けないという意味を保った。
theological_decisions:
- issue: 「自分の故郷」が指す地域と範囲
  choice: 格言をそのまま訳し、ユダヤ、ガリラヤ、ナザレのいずれかに限定しない
  alternative: ユダヤ、ガリラヤ、またはナザレと明示する
  rationale: 本文自体は地理的指示対象を明記していないため、ヨハネの叙述にある解釈上の緊張を訳文で解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ご自身」「しておられた」はイエスへの自然な敬意を示すが、過度に古風な敬語は避けた。格言は簡潔な形にし、脚注記号[a]を本文に明示した。
