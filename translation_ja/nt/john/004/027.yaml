reference: John 4:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: ja
  text: ちょうどその時、イエスの弟子たちが戻って来た。そして、イエスが一人の女性と話していることに驚いた。しかし、だれも「何をお求めなのですか」[a]とも、「なぜ彼女と話しているのですか」[b]とも言わなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何を望んでおられるのですか」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼女と何を話しているのですか」。文脈上、「なぜ彼女と話しているのですか」という意味に取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: ちょうどその時
  rationale: 物語上の同時性を示す慣用的な時間表現として自然に訳した。直前の会話が続いているその時に弟子たちが来た、という流れを明確にする。
- source_word: ἦλθαν
  choice: 戻って来た
  rationale: 語そのものは「来た」だが、4:8で弟子たちが町へ出かけたという文脈から、ここでは日本語として自然な「戻って来た」とした。
- source_word: ἐθαύμαζον
  choice: 驚いた
  rationale: 弟子たちの驚きを簡潔に表す。未完了形の反応的・継続的なニュアンスは文脈で十分伝わるため、不自然に説明を加えなかった。
- source_word: μετὰ γυναικὸς
  choice: 一人の女と
  rationale: 冠詞のない γυνή を不定的に訳した。「妻」ではなく、文脈上は女性を指す。驚きの社会的理由は本文が明示しないため補わない。
- source_word: ἐλάλει
  choice: 話している
  rationale: 未完了形が示す進行中の会話を自然な現代日本語で表した。
- source_word: μέντοι
  choice: しかし
  rationale: 驚いたにもかかわらず、質問を口にしなかったという対照を明確にする。
- source_word: Τί ζητεῖς;
  choice: 何をお求めなのですか
  rationale: ζητέω の基本義「求める」を保ちつつ、イエスへの問いとして敬語を用いた。目的語が明示されていないという原文の曖昧さも残す。
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: なぜこの人と話しているのですか
  rationale: 字義的には「何をこの人と話しているのか」だが、この文脈での τί の語用論的な力を自然な日本語の「なぜ」で表した。αὐτῆς は直前の女性を指すため「この人」とした。
theological_decisions:
- issue: イエスが女性と話していたことへの弟子たちの驚き
  choice: 弟子たちが驚いた事実だけを本文に記し、その理由を説明として加えない。
  alternative: ユダヤ人とサマリア人、または男性と女性の間の社会的慣習を本文中に明記する。
  rationale: ギリシア語本文は、イエスが女性と話していたため弟子たちが驚いたと述べるだけで、その社会的・民族的理由を特定していない。本文の抑制と解釈上の余地を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語を用いた。イエスを指す代名詞は日本語では曖昧になりやすいため、必要な箇所で固有名を補った。弟子たちがイエスに向けて想定した問いには自然な敬語を用い、女性への蔑視や社会的背景の説明を本文へ持ち込まないようにした。
