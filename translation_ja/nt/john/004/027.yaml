  to: ちょうどその時、イエスの弟子たちが戻って来た。そして、イエスが一人の女性と話していることに驚いた。しかし、だれも「何をお求めなのですか」[a]とも、「なぜ彼女と話しているのですか」[b]とも言わなかった。
