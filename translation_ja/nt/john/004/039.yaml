  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: ja
  text: その町のサマリア人のうち、多くの人が、「あの方は、私のしたことをすべて、私に話しました」と証言していた女性の言葉[a]によって、イエスを信じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「女性の知らせ」。ギリシア語の λόγος は「言葉」「知らせ」「報告」などを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: その町の
  rationale: ἐκは出所を示すが、日本語では「その町のサマリア人」とすることで、同じ町に属する人々であることを自然に表せる。δέは弱い接続辞であり、単独の節として不自然な「そして」を置かず、文脈上のつながりに委ねた。
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: サマリア人のうち、多くの人が
  rationale: 属格の部分的な意味、すなわちサマリア人全体の中の多くの者を明確かつ自然に表した。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: イエスを信じた
  rationale: πιστεύω＋εἰςが表す、人物へ向けられた信頼・信仰を簡潔に表す。日本語では代名詞「彼」より、指示対象である「イエス」を明示するほうが明瞭である。
- source_word: διὰ τὸν λόγον
  choice: 言葉によって
  rationale: διά＋対格の原因・理由を「によって」で表した。λόγοςの基本的な語感を保つため本文では「言葉」とし、「知らせ」という文脈的な訳語は脚注に示した。
- source_word: τῆς γυναικὸς μαρτυρούσης
  choice: 証言していた女の
  rationale: 現在分詞が描く継続中の証言を「証言していた」で表し、既出のサマリア人女性を「女」とした。
- source_word: Εἶπέν μοι πάντα ἃ ἐποίησα
  choice: あの方は、私がしたことを何もかも私に話しました
  rationale: μοιを「私に」、πάντα ἃ ἐποίησαを「私がしたことを何もかも」と明示した。ἐποίησαのアオリストを過去形「した」とし、「言い当てた」のような解釈的な意味は加えなかった。
theological_decisions:
- issue: ヨハネ文書における πιστεύω εἰς の意味
  choice: イエスを信じた
  alternative: イエスに信頼を置いた
  rationale: イエスへ向けられた信仰を保ちつつ、本文がここで明示していない後代の教理的区分を持ち込まないため、簡潔な「信じた」とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着いた格調を保った。女性の発言には過度な敬語や解釈的な「言い当てる」を用いず、原文の直接的な証言を再現した。
