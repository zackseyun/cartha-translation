id: JHN.4.11
reference: John 4:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: ja
  text: 女はイエスに言った。「先生[a]、あなたは水をくむ道具もお持ちでなく、井戸も深いのです。では、どこからその生きた水[b]を手に入れるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主よ」。ギリシア語は、敬意を込めた「先生」という呼びかけにも、「主よ」という呼びかけにもなり得る。
    reason: alternative_reading
  - marker: b
    text: 「生きた水」は「流れる水」、すなわち淀んでいない新鮮な水を意味することもある。同時に、この表現はイエスの言葉にある、より深い意味を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: 女はイエスに言った
  rationale: ギリシア語は歴史的現在形だが、日本語の物語として自然な過去形にした。代名詞 αὐτῷ は文脈上の指示対象を明確にするため「イエスに」とした。
- source_word: Κύριε
  choice: 先生
  rationale: この会話段階では、相手への敬意を示す呼びかけとして理解するのが自然である。「主よ」という語義と含みは脚注に残した。
- source_word: ἄντλημα
  choice: 水をくむ道具
  rationale: 水をくみ上げるための器具を指す。形状をバケツに限定せず、現代日本語で明瞭に表現した。
- source_word: τὸ φρέαρ ἐστὶν βαθύ
  choice: 井戸は深い
  rationale: φρέαρ はこの場面では水をくむ井戸を指し、βαθύ はその深さを述べる。程度を不必要に強めなかった。
- source_word: πόθεν οὖν ἔχεις
  choice: いったいどこから…手に入れるのですか
  rationale: πόθεν の出所を問う意味と、οὖν が示す先行内容からの推論を自然な疑問文で表した。
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: その生きた水
  rationale: 字義的な「流れる水」と、ヨハネ福音書におけるより深い比喩的意味との重なりを保つ表現にした。
theological_decisions:
- issue: サマリアの女による Κύριε という呼びかけ
  choice: 先生
  alternative: 主よ
  rationale: κύριε は「主よ」とも訳せるが、この時点では敬意を込めた一般的呼称である可能性が高い。女がすでにイエスを神学的な意味で「主」と告白したかのように断定しないため、本文では「先生」とし、別訳を脚注に示した。
- issue: ὕδωρ τὸ ζῶν の二重の意味
  choice: 生きた水
  alternative: 流れる水／新鮮な水
  rationale: 日常語としては淀んでいない流水を指し得る一方、イエスの言葉にはさらに深い意味がある。どちらか一方に限定せず、原文の緊張と多義性を保った。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、会話としての丁寧さと聖書本文にふさわしい品位を保った。「井戸は深いのに」によって、くむ道具がないことと井戸の深さが問いの根拠であるという原文の論理を自然に示した。
