  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: ja
  text: あなたがたは、「収穫まで、まだ四か月ある」と言うではありませんか。さあ、わたしはあなたがたに言います。目を上げて畑を見なさい。畑は白くなって、すでに収穫の時を迎えています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「収穫できるほど熟しています」とも訳せます。ギリシア語は「白い」と表現し、収穫期の畑の視覚的な像によって、その用意ができていることを示しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: あなたがたは…と言っているではありませんか
  rationale: 否定疑問の確認を現代日本語で自然に表しつつ、明示された主語ὑμεῖςを「あなたがた」として保持した。
- source_word: Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται
  choice: 収穫まで、まだ四か月ある
  rationale: 直訳的には「まだ四か月あり、そして収穫が来る」だが、日本語では収穫までの残り期間としてまとめると自然で、意味も保たれる。
- source_word: ἰδοὺ λέγω ὑμῖν
  choice: さあ、わたしはあなたがたに言います
  rationale: ἰδούの注意喚起を「さあ」で表し、λέγω ὑμῖνの直接的な語りかけを保持した。
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: 目を上げて
  rationale: ギリシア語の身体的で鮮明な慣用表現を、日本語でも自然な形で保った。
- source_word: θεάσασθε τὰς χώρας
  choice: 畑を見なさい
  rationale: θεάομαιの意識して見る命令を「見なさい」とし、収穫の文脈におけるχώραを耕作地の「畑」と訳した。
- source_word: λευκαί εἰσιν πρὸς θερισμόν
  choice: 収穫に向けて白くなっています
  rationale: λευκαίの視覚的な「白い」という像を保ち、πρὸς θερισμόνは収穫に適した状態へ至っていることを過度に説明せず表した。
- source_word: ἤδη
  choice: すでに
  rationale: 四か月待つという言い回しとの対照を明確にし、収穫時がもう到来しているという終端の強調を日本語の自然な位置で示した。
theological_decisions:
- issue: 収穫を字義的な農作業として訳すか、人々を集める宣教の比喩として明示するか
  choice: 農耕の比喩をそのまま保持する
  alternative: 「人々はすでに集められる用意ができている」などと解釈的に訳す
  rationale: 文脈上は人々の霊的な受容性を指す比喩と理解できるが、本文の語彙は一貫して畑と収穫の像を用いるため、翻訳本文ではその緊張と比喩を保った。
- issue: λευκαίを「白い」とするか「熟している」と解釈するか
  choice: 白いという原文の視覚的表現を保持する
  alternative: 「収穫できるほど熟している」
  rationale: 「熟している」は含意を明確にする一方、原文の独特な色彩表現を消すため、本文では像を残し、脚注で意味を補った。
translation_notes:
  register: 明瞭で現代的ながら品位のある「です・ます」調を用いた。「さあ」で注意喚起を自然に示し、「目を上げて」「白くなっています」によって原文の鮮明な収穫の情景を保持した。
