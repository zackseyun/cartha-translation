source:
  edition: SBLGNT
  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: ja
  text: そこでサマリア人たちがイエスのもとに来ると、彼らはイエスに、自分たちのところに滞在してくださるよう頼んだ[a]。イエスはそこに二日間滞在した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は未完了過去で、「頼み続けた」または「繰り返し頼んだ」とも訳せる。
    reason: ἠρώτωνの未完了過去が持ち得る継続・反復の含意を示しつつ、本文では一方に確定しないため。
lexical_decisions:
- source_word: ὡς οὖν
  choice: そこで、…来ると
  rationale: ὡςの時間的意味とοὖνの文脈上のつながりを、自然な現代日本語で表した。
- source_word: ἦλθον πρὸς αὐτὸν
  choice: イエスのもとに来ると
  rationale: πρός＋対格が示す人物への接近を「もとに来る」と訳した。日本語で指示対象を明確にするため、代名詞を「イエス」とした。
- source_word: οἱ Σαμαρῖται
  choice: サマリア人たちは
  rationale: 民族・集団を示す一般的で明瞭な呼称とした。
- source_word: ἠρώτων
  choice: 繰り返し頼んだ
  rationale: 未完了過去が示し得る継続的・反復的な依頼を自然な日本語で表した。ただし単に背景的な進行を表す可能性もある。
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: 自分たちのところに滞在してくださるよう
  rationale: μένωを「滞在する」、παρά＋与格を「自分たちのところに」と表現した。依頼として自然な敬意を補った。
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: そこでイエスは、…そこに滞在した
  rationale: 同じμένωを再び「滞在した」として語彙上の対応を保ち、ἐκεῖも「そこに」と明示した。接続詞καίは、日本語の流れに合わせて結果的な継起を示す「そこで」とした。
- source_word: δύο ἡμέρας
  choice: 二日間
  rationale: 期間を表す対格を自然かつ直接的に訳した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語文としての品位を保った。「繰り返し頼んだ」は未完了過去の相を明示する訳だが、文脈上は単純に「頼んだ」とする余地もある。
