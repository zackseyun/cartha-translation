id: JHN.4.32
reference: John 4:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Ἐγὼ βρῶσιν ἔχω φαγεῖν ἣν ὑμεῖς οὐκ οἴδατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: ja
  text: しかし、イエスは彼らに言った。「わたしには、あなたがたの知らない食べ物がある[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしには、あなたがたの知らない、食べるものがある」。イエスが比喩的に語っていることは、後の文脈から明らかになる。
    reason: βρῶσιν ἔχω φαγεῖνは「食べ物がある」とも「食べるものがある」とも自然に表せるため。
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 弟子たちの言葉を受けつつ、イエスの応答が対照的な展開をもたらすことを自然に示す。強すぎない文脈上の対比として訳した。
- source_word: εἶπεν αὐτοῖς
  choice: イエスは彼らに言った
  rationale: 主語は直前の文脈からイエスであり、日本語では明示するほうが読みやすい。αὐτοῖςは「彼らに」と素直に訳した。
- source_word: Ἐγὼ
  choice: わたしには
  rationale: 明示された一人称代名詞による「あなたがた」との対照を、「わたしには」という自然な日本語で表した。
- source_word: βρῶσιν
  choice: 食べ物
  rationale: ここでは食べる行為ではなく、食物を指す。後続文脈で明らかになる比喩を先取りして説明せず、具体的な語を保った。
- source_word: ἔχω φαγεῖν
  choice: 食べ物がある
  rationale: 直訳的な「食べるための食べ物を持っている」は日本語では冗長で不自然であるため、「食べ物がある」とした。食べるためのものを有しているという意味は十分に伝わる。
- source_word: ἣν ὑμεῖς οὐκ οἴδατε
  choice: あなたがたの知らない
  rationale: 関係節を名詞の前に置く自然な日本語とし、明示されたὑμεῖςによる対照も「あなたがた」で保持した。「知らない」は、その食べ物の存在または性質を彼らが認識していないという原文の幅を残す。
theological_decisions:
- issue: イエスの「食べ物」の比喩的意味
  choice: 本文では「食べ物」という字義的表現を保ち、比喩の意味を説明しない
  alternative: 「わたしを養うものがある」など、父のみこころを行うことを先取りして明示する
  rationale: 次節以降で比喩の意味が明らかになるが、この節では弟子たちの誤解を生む表現が意図的に保たれている。訳文でその緊張を先に解消しない。
translation_notes:
  register: 明快な現代標準日本語を用い、会話として自然でありながら、聖書本文にふさわしい落ち着いた調子を保った。「わたし」「あなたがた」を用いて対照を明確にし、比喩は説明しすぎず原文どおり残した。
