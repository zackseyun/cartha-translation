  terminology: 「主よ」はκύριεの語義上およびヨハネ福音書内での含意を保つ適切な訳である。脚注の「先生」は文脈上あり得る敬意ある呼びかけを示しており、「主」とだけ断定して話者の理解を過度に神学化することを避けている。
