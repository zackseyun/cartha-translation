id: JHN.4.49
reference: John 4:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: ja
  text: 王の役人はイエスに言った。「主よ[a]、私の子どもが死なないうちに、下って来てください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「先生」。ギリシア語「キュリエ」は、敬意を込めた呼びかけとしても、「主」という意味でも用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: 王の役人
  rationale: 王または王宮に属する人物を指す実質化された形容詞。身分階級を示す「貴族」とせず、王との公的なつながりを明確にした。
- source_word: Κύριε
  choice: 主よ
  rationale: κύριε が持ちうる「主」という重層的な響きを保った。文脈上は敬称「先生」にもなりうるため、脚注で示した。
- source_word: κατάβηθι
  choice: 下って来てください
  rationale: カナからカペナウム方面への移動を求める命令であり、地勢を含む「下る」を保持しつつ、話者のいる目的地へ招く自然な日本語とした。切迫した願いにふさわしく丁寧な依頼形にした。
- source_word: πρὶν ἀποθανεῖν
  choice: 死なないうちに
  rationale: πρίν＋不定詞の先行時を、切迫した願いとして自然な現代日本語で表した。「死ぬ前に」と同義だが、依頼とのつながりが滑らかである。
- source_word: τὸ παιδίον μου
  choice: 私の子ども
  rationale: παιδίον の語義を保ち、この節だけから性別を特定しない表現とした。
- source_word: λέγει πρὸς αὐτόν
  choice: イエスに言った
  rationale: 歴史的現在 λέγει を日本語の物語として自然な過去形にした。代名詞の指示対象を明確にするため「イエス」とした。
theological_decisions:
- issue: イエスへの呼びかけ κύριε の訳
  choice: 主よ
  alternative: 先生
  rationale: ヨハネ福音書における呼びかけの重層性を早々に敬称だけへ限定せず、「主」の響きを保持した。ただし、話者の認識がここで完全な信仰告白だったと断定しないよう、日常的な敬称としての可能性を脚注に残した。
translation_notes:
  register: 明瞭で品位ある現代標準語。役人の切迫した嘆願を丁寧な依頼表現で伝え、原文の地勢的な「下る」と παιδίον の非限定的な「子ども」を保持した。
