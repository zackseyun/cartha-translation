  yaml_path: translation/nt/john/004/033.yaml
  text: So the disciples were saying to one another[a], “Has anyone brought him something to eat?”
translation:
  language: ja
  text: そこで弟子たちは互いに、「まさか、だれかがイエスに何か食べる物を持って来たのだろうか[a]」と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「だれかがイエスに何か食べる物を持って来たのではあるまい」。ギリシア語のμήで始まる疑問文は、否定の答えを予想している。
    reason: 疑問文が予想する否定的な答えと、可能な訳し方を示すため。
lexical_decisions:
- source_word: ἔλεγον
  choice: 言い合っていた
  rationale: 未完了過去の継続的なやり取りと、πρὸς ἀλλήλουςが示す相互の発話を自然な日本語で表す。
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの発言を受けた弟子たちの反応という、物語上のつながりを示す。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: ヨハネ福音書の文脈に即した標準的で明確な訳語。
- source_word: πρὸς ἀλλήλους
  choice: 互いに
  rationale: 弟子たちの間で交わされた相互的な発話を簡潔に示す。
- source_word: Μή τις
  choice: だれかが…のだろうか
  rationale: μήを伴う疑問が否定の答えを予想していることは、本文を不自然に断定調にせず、注で明示する。
- source_word: ἤνεγκεν
  choice: 持って来た
  rationale: 食べ物をイエスのところへ運んで来たという文脈に自然に合う。
- source_word: αὐτῷ
  choice: 先生に
  rationale: 指示対象がイエスであることを日本語で自然に明示する。弟子たちの発話として敬意を含む呼称を用いた。
- source_word: φαγεῖν
  choice: 何か食べる物
  rationale: 目的を表す不定詞を、日本語で自然な名詞句として表現する。
