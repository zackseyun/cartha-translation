  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: ja
  text: サマリアから一人の女が水をくみに来た。イエスは彼女に言った[a]。「水をください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には「来る……言う」。ギリシア語は物語の中で歴史的現在形を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔρχεται
  choice: 来た
  rationale: 物語の中で過去の出来事を生き生きと述べる歴史的現在。現代日本語の自然な物語叙述に合わせて過去形とした。
- source_word: γυνὴ
  choice: 一人の女
  rationale: ここでは妻という身分ではなく、まだ特定されていない女性を指す。日本語でその導入を自然に示すため「一人の女」とした。
- source_word: ἐκ τῆς Σαμαρείας
  choice: サマリアから
  rationale: 場所・出所を表す句を直接的に訳した。「サマリア人の女」と意訳せず、原文の地理的表現を保った。
- source_word: ἀντλῆσαι ὕδωρ
  choice: 水をくみに
  rationale: 不定詞は来た目的を表す。井戸などから水を得る行為として自然な現代日本語の「水をくむ」を用いた。
- source_word: λέγει αὐτῇ
  choice: 彼女に言った
  rationale: λέγειも物語上の歴史的現在であり、日本語として自然な過去形にした。αὐτῇの指示対象も明示した。
- source_word: Δός μοι πεῖν
  choice: 水を飲ませてください
  rationale: 直訳的には「私に飲むものを与えてください」に近いが、日本語では水を求める依頼として「水を飲ませてください」が簡潔で自然。直前の「水」により目的語も明確である。
theological_decisions:
- issue: 「サマリア」の指示と女性の描写
  choice: 「サマリアから一人の女」とし、地域・場所から来たことを表す
  alternative: 「サマリア人の女」または「サマリアの町から来た女」
  rationale: この節のギリシア語は女性を直接「サマリア人」と呼ばず、「サマリアから」と述べる。民族的・宗教的含意や特定の町という限定を訳文に付加せず、原文の表現を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語。会話は丁寧な依頼として訳し、過度に古風な「我に飲ませよ」や不自然に逐語的な表現を避けた。
