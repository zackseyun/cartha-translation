id: JHN.4.15
reference: John 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: ja
  text: 女はイエスに言った。「主よ[a]、私が渇かず、ここまで水をくみに来なくてすむように、その水を私にください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「先生」
    reason: κύριεは、ここでは敬意を表す呼びかけとして理解することもできる。
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語として自然な過去形を用い、談話上の機能を保った。
- source_word: γυνή
  choice: 女
  rationale: 文脈上、サマリアの女を指す。日本語では既出人物として簡潔に「女」とした。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬称「先生」に近い用法の可能性を残しつつ、ヨハネ福音書における重層的な響きを保つため「主よ」とし、別訳を脚注に示した。
- source_word: δός μοι
  choice: 私にください
  rationale: 命令の直接性を保ちながら、現代日本語の丁寧な依頼として自然に表現した。
- source_word: τοῦτο τὸ ὕδωρ
  choice: その水
  rationale: 話し相手が直前に述べた水を指すため、日本語の指示体系では「その」が自然である。「生ける」はこの節にないので補わない。
- source_word: ἵνα μὴ διψῶ
  choice: そうすれば、私は渇くことも……なくなります
  rationale: 目的と期待される結果の双方を含み得るἵνα節を自然な日本語で表した。接続法を断定的に過剰解釈せず、話者の期待として読める形にした。
- source_word: μηδὲ διέρχωμαι ἐνθάδε ἀντλεῖν
  choice: ここまでくみに来ることもなくなります
  rationale: 否定の追加関係を「ことも……ない」で示した。διέρχομαιとἐνθάδεは目的地への移動として「ここまで来る」、ἀντλεῖνは文脈上の水くみを自然な「くむ」で表した。
theological_decisions:
- issue: サマリアの女が用いたκύριοςの訳
  choice: 主よ
  alternative: 先生
  rationale: この呼びかけは単なる敬称とも、ヨハネ福音書の文脈でより深い意味を帯びる語とも解し得る。本文では「主よ」として重層性を保持し、即時的な敬称としての読みを脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。会話として自然な丁寧さを保ちつつ、「主よ」によって原文の神学的な含みと曖昧さを保存した。「くみに来る」は井戸へ繰り返し水をくみに来る日常的行為を簡潔に表す。
