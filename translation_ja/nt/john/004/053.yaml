id: JHN.4.53
reference: John 4:53
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: ja
  text: そこで父親は、イエスが彼に「あなたの息子は生きている[a]」と言われたのが、その時刻だったと知った。彼自身と、その家の者たち全員が信じた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生きている」は、息子が現在、生存していることを表す。
    reason: lexical_alternative
  - marker: b
    text: 「信じた」は、イエスの言葉を信じたこととも、イエスへの信仰にいっそう深く至ったこととも理解できる。ギリシア語では、その範囲は明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: 知った
  rationale: 僕たちから聞いた時刻とイエスの言葉の時刻が一致すると父親が認識したことを、自然かつ簡潔に表す。
- source_word: οὖν
  choice: そこで
  rationale: 前節の僕たちの報告を受けた推論・帰結を、現代日本語の物語として自然に示す。
- source_word: ὁ πατὴρ
  choice: 父親
  rationale: 役人としての身分ではなく、癒やされた息子との家族関係を示す原文の語を保つ。
- source_word: ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ
  choice: それが……まさにその時刻だった
  rationale: 特定の時刻の一致を明確な日本語にする。「まさに」は、指示表現ἐκείνῃと前節からの照合による一致を自然に伝える。
- source_word: εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: イエスが彼に……と言われた
  rationale: 日本語ではイエスへの敬意を自然な尊敬表現で示しつつ、発言者と相手を明確にする。
- source_word: Ὁ υἱός σου ζῇ
  choice: あなたの息子は生きている
  rationale: 現在形ζῇを、回復して今も生きている状態を表す自然な日本語で訳す。
- source_word: ἐπίστευσεν
  choice: 信じた
  rationale: 信じた対象や信仰の深まりの程度を本文で限定せず、πιστεύωの簡潔さとヨハネ文書における含みを保つ。
- source_word: αὐτὸς
  choice: 彼自身も
  rationale: 明示された代名詞の強調を保ち、続く家の者たちと並べる日本語として「も」を用いる。
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: その家の者たちも皆
  rationale: 物理的な家屋ではなく家族・家に属する人々全体を指すことを、一般読者に明瞭な表現で示す。
theological_decisions:
- issue: 父親が「信じた」ことの範囲
  choice: 単に「信じた」とし、対象や程度を明示しない
  alternative: イエスの癒やしの言葉を信じた／この時にイエスへの全面的な信仰に至った
  rationale: 文脈上はイエスとその言葉への信仰が含意されるが、ギリシア語本文は目的語を示さず、信仰の範囲や段階を明確に限定していないため。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「父親」「その家の者たち」で家族的な焦点を保ち、「信じた」の神学的な含みは限定せずに残した。
