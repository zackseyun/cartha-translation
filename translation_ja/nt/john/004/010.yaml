  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: ja
  text: イエスは彼女に答えて言われた。「もしあなたが神の賜物を知り、また、『わたしに水をください』とあなたに言っているのが誰なのかを知っていたなら、あなたならその人に求めたでしょうし、その人はあなたに生きた水[a]を与えたことでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「流れる水」または「湧き水」とも訳せる。この表現は通常、流水や湧き水を指すことがあるが、ここでは「生きた水」とすることで、イエスの言葉が持つ二重の意味を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: 答えて言われた
  rationale: 二つの発話動詞から成るギリシア語の語り口を保ちつつ、尊敬語を用いた自然で格調ある日本語とした。
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: 神の賜物
  rationale: 属格の曖昧さを「神からの」と限定せずに保ち、無償で与えられるものを表す語として文脈にふさわしい。
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: あなたに言っているのが誰なのか
  rationale: 現在分詞の継続的な響きと、話者の正体に焦点を置く構文を自然な日本語で表した。
- source_word: Δός μοι πεῖν
  choice: わたしに飲ませてください
  rationale: 命令形と不定詞の意味を、依頼として自然に聞こえる現代日本語で表した。目的語の「水」は原文に明示されないため本文には補わなかった。
- source_word: σὺ ἂν ᾔτησας
  choice: あなたのほうからその人に求め
  rationale: 強調された代名詞 σὺ を「あなたのほうから」で表し、現実とは異なる条件の帰結は後続の「でしょう」と一体にした。
- source_word: ἔδωκεν ἄν σοι
  choice: その人はあなたに…与えたでしょう
  rationale: ἄν を伴う反実仮想の帰結を、日本語の過去形と「でしょう」で自然に示した。
- source_word: ὕδωρ ζῶν
  choice: 生きた水
  rationale: 通常には流れる新鮮な水を指し得る一方、ヨハネ文書の文脈ではより深い意味を帯びる表現であるため、両義性を保つ直訳的で現代的な表現を選んだ。
theological_decisions:
- issue: ὕδωρ ζῶν の物理的意味と象徴的意味の両立
  choice: 生きた水
  alternative: 流れる水／新鮮な水
  rationale: 物理的な水として受け取れる表現を残しながら、イエスの言葉が指し示すより深い意味を先取りして限定しないため。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、イエスへの叙述には「言われた」を用いて穏やかな格調を保った。「生ける水」は現代語として古風なため避け、「生きた水」とした。
