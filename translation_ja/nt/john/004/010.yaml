revisions:
- from: イエスは彼女に答えて言われた。「もしあなたが神の賜物を知り、また、『わたしに飲ませてください』とあなたに言っているのが誰なのかを知っていたなら、あなたのほうからその人に求め、その人はあなたに生きた水[a]を与えたでしょう。」
  to: イエスは彼女に答えて言われた。「もしあなたが神の賜物を知り、また、『わたしに水をください』とあなたに言っているのが誰なのかを知っていたなら、あなたならその人に求めたでしょうし、その人はあなたに生きた水[a]を与えたことでしょう。」
  rationale: 依頼文を、日本語で許可求めと誤解され得る表現から、水を与えるよう求める意味が明確な表現へ改めた。原文で省略されている水は、井戸での直前の会話と πεῖν（飲むこと）の目的を日本語として自然に明示するため補った。反実仮想の帰結は「たでしょうし」「与えたことでしょう」で明瞭にした。「生きた水」は維持し、脚注では通常の物理的語義をより精確に説明した。
