- source_word: αὐτὸν
  choice: イエスは
  rationale: 原文では不定詞構文の対格主語だが、日本語では有限的な文として自然に表現した。指示対象を明確にするため、文脈上の人物名「イエス」を用いた。
- source_word: διέρχεσθαι
  choice: 通って行く
  rationale: ある地域の中を通過して進む意味を、自然かつ簡潔に表す。
- source_word: διὰ τῆς Σαμαρείας
  choice: サマリアを通って
  rationale: 属格を伴う διά が場所の中を通る移動を示す。「地方」を補わなくても日本語で地理的意味は十分伝わる。
