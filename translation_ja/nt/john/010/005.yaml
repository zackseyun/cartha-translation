id: JHN.10.5
reference: John 10:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλοτρίῳ δὲ οὐ μὴ ⸀ἀκολουθήσουσιν ἀλλὰ φεύξονται ἀπ’ αὐτοῦ, ὅτι οὐκ οἴδασι τῶν ἀλλοτρίων τὴν φωνήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/005.yaml
  text: But they will certainly not follow a stranger[a]; instead, they will flee from him[b], because they do not know the voice of strangers.
translation:
  language: ja
  text: しかし、羊たちはよそ者には決してついて行かず[a]、かえってその者から逃げます。よそ者たちの声を知らないからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「決してついて行かない」とも訳せる。ギリシア語は強い否定（οὐ μή）を用いている。
    reason: lexical_alternative
  - marker: b
    text: ここで「声を知らない」は、「声を聞き分けられない」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλοτρίῳ / τῶν ἀλλοτρίων
  choice: 知らない者／知らない者たち
  rationale: 羊に属さず、その声になじみのない者を指す比喩として、民族的な含意を避けつつ自然な現代日本語にした。単数と複数の違いも保った。
- source_word: οὐ μὴ ἀκολουθήσουσιν
  choice: 決してついて行かず
  rationale: οὐ μήと未来直説法による強い否定を「決して」で表し、羊が人の後に従う場面に自然な「ついて行く」を用いた。
- source_word: ἀλλὰ φεύξονται ἀπ’ αὐτοῦ
  choice: かえってその者から逃げます
  rationale: ἀλλάの強い対照を「かえって」で示し、φεύγω ἀπόの離反・逃避の意味を直接表した。
- source_word: οὐκ οἴδασι ... τὴν φωνήν
  choice: 声を知らない
  rationale: οἶδαの基本的な「知っている」を保持し、文脈上可能な「聞き分ける」という解釈に限定しなかった。
- source_word: φωνήν
  choice: 声
  rationale: 羊飼いの呼び声としての字義的意味と、関係性を示す比喩的含意の双方を保つ。
theological_decisions:
- issue: 羊と羊飼いの比喩におけるἀλλότριοςの指示対象
  choice: 「知らない者」として比喩をそのまま保つ
  alternative: 偽教師、偽の指導者などと明示する
  rationale: この節自体は比喩の指示対象を明示していないため、本文で特定の神学的解釈に限定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「羊たち」を補って日本語の主語を明確にし、前節から続く羊飼いの比喩を保持した。「見知らぬ者」も候補だが、複数形で重くなりやすいため「知らない者」を採用した。
