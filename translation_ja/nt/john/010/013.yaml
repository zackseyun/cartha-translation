  yaml_path: translation/nt/john/010/013.yaml
  text: because he is a hired hand and does not care about the sheep.
translation:
  language: ja
  text: 雇い人であり、羊のことを心にかけていないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前に述べられた雇い人の行動の理由を示す因果用法。日本語では文末の「からです」が自然で明確である。
- source_word: μισθωτός
  choice: 雇い人
  rationale: 賃金を受けて働く者を指す。羊飼いの比喩を保ちつつ、現代日本語で簡潔かつ自然な表現である。
- source_word: οὐ μέλει αὐτῷ περὶ
  choice: …のことを心にかけていない
  rationale: 与格を伴う非人称構文が表す関心や配慮の欠如を、倫理的な重みを保ちながら自然な日本語で表す。
- source_word: τῶν προβάτων
  choice: 羊
  rationale: 原語の牧羊のイメージをそのまま保ち、「群れ」のような解釈的な言い換えを避ける。
theological_decisions:
- issue: 良い羊飼いと対照される μισθωτός の描写
  choice: 雇い人が羊を心にかけていないという本文の倫理的対照を、そのまま訳す。
  alternative: 雇い人を特定の偽指導者の階級と明示する、または単なる職業上の距離感へと弱める。
  rationale: 本文は雇い人の行動理由を明言するが、その人物が具体的に誰を指すかまでは特定していないため、翻訳でもそれ以上の教理的同定を加えない。
translation_notes:
  register: 明快で現代的な標準日本語。「心にかける」により、単なる注意ではなく羊への関心と配慮を表し、全体を丁寧体で整えた。
