  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: ja
  text: そこでイエスは彼らにもう一度言われた。「まことに、まことに、あなたがたに言う。わたしは羊の門[a]である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「羊の戸口」。ギリシア語θύραは「戸」「扉」または「門」を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前で聞き手が比喩を理解しなかったことを受けた、物語上かつ論理上の展開を自然な日本語で示す。
- source_word: πάλιν
  choice: もう一度
  rationale: イエスが重ねて語られたことを明瞭に表す。
- source_word: Ἀμὴν ἀμὴν
  choice: よくよく
  rationale: ヨハネ福音書に特徴的な二重の厳粛な宣言を、反復の力と格調を保ちながら日本語で簡潔に表す。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言う
  rationale: 定型的な宣言の直接性と荘重な調子を保つ。
- source_word: ἐγώ εἰμι
  choice: わたしは…である
  rationale: 明示された主語による自己同定の強調を自然に保持する。
- source_word: θύρα
  choice: 門
  rationale: 戸や出入口を指し得る語だが、羊囲いの牧羊比喩では「門」が現代日本語として自然で、出入り口という像を明瞭に伝える。
- source_word: τῶν προβάτων
  choice: 羊の
  rationale: 属格の関係を限定しすぎず、原文に近い簡潔な連体表現として保持する。
theological_decisions:
- issue: 「わたしは〜である」という比喩的自己同定
  choice: わたしは羊の門である
  alternative: わたしは羊のための門である
  rationale: イエスと羊の出入口との比喩的同定を説明的に展開せず、そのまま保持する。「羊の」は属格が示す関連を開いたままにし、目的・利益の意味だけに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの厳粛な宣言には「よくよく」「である」を用いて格調を保った。「言われた」は敬意を示す自然な聖書文体であり、過度な古語は避けた。
