id: JHN.10.18
reference: John 10:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδεὶς ⸀αἴρει αὐτὴν ἀπ’ ἐμοῦ, ἀλλ’ ἐγὼ τίθημι αὐτὴν ἀπ’ ἐμαυτοῦ. ἐξουσίαν ἔχω θεῖναι αὐτήν, καὶ ἐξουσίαν ἔχω πάλιν λαβεῖν αὐτήν· ταύτην τὴν ἐντολὴν ἔλαβον παρὰ τοῦ πατρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/018.yaml
  text: No one takes it from me[a], but I lay it down of myself. I have authority to lay it down, and I have authority to take it up again[c][b]. This command I received from my Father.
translation:
  language: ja
  text: だれも、わたしから命を取り去ることはない。わたしが自ら命を差し出すのである。[a] わたしには、命を差し出す権限があり、また、命を再び取り戻す権限もある。[b] わたしはこの命令を、わたしの父から受けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自ら」は、イエスが自発的に命を差し出すことを表す。「自分から」「自分の意思で」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「権限」は「権威」「権利」または「力」とも訳し得る。ギリシア語は、行う能力と正当な権能の両面を含み得る。「再び取り戻す」は「再び取る」または「再び受ける」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἴρει
  choice: 奪い取る
  rationale: ἀπόを伴い、イエスの命を本人から取り去ることを表すため、「取る」よりも対比が明確な「奪い取る」とした。
- source_word: τίθημι αὐτήν / θεῖναι αὐτήν
  choice: それを差し出す
  rationale: 直訳的には「それを置く」だが、直前の文脈で指す「命」を自発的に与える意味が自然に伝わる。「命を捨てる」も可能だが、代名詞を保ちつつ自発的な献身を表すため「差し出す」とした。
- source_word: ἀπ’ ἐμαυτοῦ
  choice: 自ら
  rationale: イエス自身の自発的な行為であることを簡潔に示す。父から独立して行動するとの含みは持たせず、後半の父の命令との緊張を保つ。
- source_word: ἐξουσίαν
  choice: 権限
  rationale: 単なる能力だけでなく、正当に行使できる権利と権威を含み、父から受けた命令との関係にも適合する。
- source_word: πάλιν λαβεῖν αὐτήν
  choice: それを再び受け取る
  rationale: λαμβάνωが持つ「取る／受け取る」の幅を踏まえ、日本語として自然な「受け取る」を採用した。イエスの能動的関与は「権限がある」という構文によって保たれる。
- source_word: ἐντολήν
  choice: 命令
  rationale: ἐντολήの直接的な語義を保ち、「委託」などに弱めない。
- source_word: παρὰ τοῦ πατρός μου
  choice: わたしの父から
  rationale: 属格を伴うπαράが示す源を「から」で表し、父との個人的関係を保つ。
theological_decisions:
- issue: イエスの死の自発性と父への従順の関係
  choice: 「自ら」と訳し、同時に父から命令を受けたこともそのまま示す
  alternative: 「自分だけの判断で」または「強いられて」
  rationale: 本文は、イエスが自発的に命を差し出すことと、その行為が父の命令に従うものであることを並置する。どちらか一方に解消せず、両者を保った。
- issue: ἐξουσίαの意味
  choice: 権限
  alternative: 力／権利
  rationale: 死と再び命を受け取ることについて、能力だけでも法的権利だけでもない、正当な権威を表すため。
- issue: αὐτήνの指示対象
  choice: それ
  alternative: わたしの命
  rationale: 直前の10章17節にある「わたしの命」を受ける代名詞として原文の結束を保ち、脚注で指示対象を明示した。
- issue: πάλιν λαβεῖνにおける能動性と受容性
  choice: 再び受け取る
  alternative: 再び取り戻す
  rationale: λαμβάνωの語義的な幅を残し、復活の働き方を訳語だけで一方向に決めない。「権限がある」が主体的側面を示す。
translation_notes:
  register: 現代の標準的な日本語で、朗読にも適する簡潔で威厳ある文体とした。「である」で宣言の重みを保ち、過度に古風な語法は避けた。文脈上の目的語を「それ」として原文の代名詞を保ち、必要な説明は脚注に置いた。
