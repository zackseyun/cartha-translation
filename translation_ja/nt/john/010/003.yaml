id: JHN.10.3
reference: John 10:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τούτῳ ὁ θυρωρὸς ἀνοίγει, καὶ τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει καὶ τὰ ἴδια πρόβατα ⸀φωνεῖ κατ’ ὄνομα καὶ ἐξάγει αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/003.yaml
  text: To him the gatekeeper opens[a], and the sheep hear his voice, and he calls his own sheep by name and leads them out.
translation:
  language: ja
  text: 門番はその人に門を開け、羊たちはその人の声を聞く。その人は自分の羊を一匹一匹、名を呼んで、外へ導き出す[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「外へ連れ出す」。
    reason: ἐξάγωは、先導することに焦点を置く「導き出す」と、外へ移動させることに焦点を置く「連れ出す」の双方で訳し得るため。
lexical_decisions:
- source_word: τούτῳ
  choice: その人のために
  rationale: 直前の羊飼いを指す与格。日本語では「その人のために」として、門番がその人物に対して門を開く関係を自然に表した。
- source_word: ὁ θυρωρός
  choice: 門番
  rationale: 羊の囲いの入口を管理する者を指すため、現代日本語で簡潔かつ自然な「門番」とした。
- source_word: ἀνοίγει
  choice: 門を開け
  rationale: 目的語は文脈上、囲いの門である。日本語では目的語を補うことで意味を明瞭にした。
- source_word: τὰ πρόβατα τῆς φωνῆς αὐτοῦ ἀκούει
  choice: 羊たちはその人の声を聞く
  rationale: 中性複数主語に単数動詞が伴うギリシア語の一致を、日本語では群れを構成する羊たちの複数性が伝わる形で表した。属格を取るἀκούωはここで声を聞き分ける関係を示すが、解釈を加えすぎず「声を聞く」とした。
- source_word: τὰ ἴδια πρόβατα
  choice: 自分の羊
  rationale: ἴδιαが示す所有と特別な関係を、自然な日本語で保持した。
- source_word: φωνεῖ κατ’ ὄνομα
  choice: 一匹一匹、名を呼んで
  rationale: κατ’ ὄνομαは個々を名によって呼ぶことを表す。「一匹一匹」によって個別性を明示しつつ、羊飼いの比喩を保った。
- source_word: ἐξάγει αὐτά
  choice: 外へ導き出す
  rationale: ἐξάγωには「連れ出す」と「導き出す」の幅がある。羊飼いが先導する文脈に適する「導き出す」を本文に採用し、別訳を脚注に示した。
theological_decisions:
- issue: 羊飼いの比喩と行為者の同定
  choice: 行為者を「その人」とし、門番がその人のために開け、羊がその声を聞き、その人が自分の羊を呼んで導き出すという比喩をそのまま訳した。
  alternative: この節だけで行為者を明示的に「イエス」とする。
  rationale: 文脈上のキリスト論的含意を否定せず、同時に原文がこの節で用いる比喩的人物表現を訳文の中で先回りして解消しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、牧羊の情景と荘重さを保った。「一匹一匹」は個別に名を呼ぶ意味を自然に伝える表現であり、説明的になりすぎない範囲で原文の含意を明示している。
