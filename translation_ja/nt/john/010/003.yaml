  terminology: 「門番」「羊」「自分の羊」「声」「導き出す」は、文脈に適した自然な用語である。「その人」は先行文脈の羊飼いを指す表現として、ここで解釈的に「イエス」と明示しない点も適切である。脚注はἐξάγωの語彙的幅を適切に示す。
