  text: ταύτην τὴν παροιμίαν εἶπεν αὐτοῖς ὁ Ἰησοῦς· ἐκεῖνοι δὲ οὐκ ἔγνωσαν τίνα ⸀ἦν ἃ ἐλάλει αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/006.yaml
  text: Jesus spoke this figure of speech to them[a], but they did not understand what he was saying to them.
translation:
  language: ja
  text: イエスは彼らに、この比喩的な言葉を語られた[a]。しかし彼らは、イエスが自分たちに語っておられたことが何なのか、理解しなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「比喩的な言葉」は、「たとえ」「たとえ話」または「ことわざ」とも訳せる。ギリシア語は比喩的な発言を広く指し、ここでは羊飼いについて非字義的に語られた言葉を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: παροιμίαν
  choice: たとえ
  rationale: ヨハネ文書で、比喩的・婉曲的な語りを広く指す語。ここでは羊飼いについての非字義的な話を指すため、現代日本語で自然な「たとえ」とした。ただし「たとえ話」という特定の文学形式に狭めず、脚注で語義の幅を示す。
- source_word: εἶπεν
  choice: 語られた
  rationale: 「言った」が基本義だが、「このたとえ」を目的語とする文脈では「語った」が自然。イエスへの敬意を表す現代の聖書文体として尊敬表現を用いた。
- source_word: ἐκεῖνοι δὲ
  choice: しかし彼らは
  rationale: 指示代名詞によるイエスとの対照と、δέの逆接を、自然な日本語で明示する。
- source_word: οὐκ ἔγνωσαν
  choice: 理解しなかった
  rationale: ここでは知識の有無ではなく、比喩的な発言の意味を把握できなかったことを表す。
- source_word: τίνα ἦν ἃ ἐλάλει αὐτοῖς
  choice: イエスが自分たちに何を語っておられるのか
  rationale: ギリシア語は直訳すると「彼が彼らに語っていた事柄が何であるか」に近い。内容を理解できなかったという意味を、原文の「何」を保ちながら明瞭な日本語にした。
theological_decisions: []
translation_notes:
  register: 明快で格調を保った現代標準日本語。「語られた／語っておられる」は過度に古風にならない範囲の敬語とし、聞き手については「彼ら」「自分たち」を用いて自然な照応を確保した。
