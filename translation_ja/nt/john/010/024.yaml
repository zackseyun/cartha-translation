  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: ja
  text: そこで、ユダヤ人たち[b]がイエスを取り囲み、こう言った。「いつまで私たちを宙づりにしておくのですか。[a] もしあなたがメシアなら、はっきり私たちに言ってください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近く表せば、「いつまで私たちの魂を持ち上げるのですか」。ここでは、不確かなまま宙づりにしておく、という意味の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: ヨハネ福音書の「ユダヤ人たち」は、文脈によってはユダヤ民族全体ではなく、ユダヤ地方の当局者やイエスに敵対する人々を、より限定的に指すことがある。
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: 取り囲み
  rationale: κυκλόωの物理的な「周囲を囲む」という意味を自然な日本語で保ち、場面の切迫感も伝える。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けた物語の展開を示す接続語として、現代日本語で自然である。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文は指導者などに明示的に限定していないため、本文では広い表現を維持し、ヨハネ福音書における文脈上の限定可能性は脚注で示す。
- source_word: ἔλεγον
  choice: こう言った
  rationale: 未完了時制の進行・反復性を日本語で明示すると不自然になりやすいため、場面を導入する自然な叙述とした。
- source_word: Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις
  choice: いつまで私たちを迷わせておくのですか
  rationale: 字義的には「いつまで私たちの魂を持ち上げるのか」だが、不確かな状態に置くという慣用的意味を、問い詰める調子を保ちながら明瞭に表した。より字義的な像は脚注に残す。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名のような用法ではなく、ユダヤ的な待望を背景とする称号として問われているため。
- source_word: εἰπὲ ἡμῖν παρρησίᾳ
  choice: はっきりそう言ってください
  rationale: παρρησίᾳがこの文脈で表す、曖昧さのない率直な言明への要求を自然な日本語にした。「そう」はメシアであることを指す。
theological_decisions:
- issue: Χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所ではイエスへの称号についての問いであり、ユダヤ的な王・救済者への期待が前景化しているため、「メシア」とした。
- issue: ヨハネ福音書におけるοἱ Ἰουδαῖοιの指示対象
  choice: ユダヤ人たち
  alternative: ユダヤ人の指導者たち／ユダヤ地方の人々
  rationale: この節自体は指導者や特定地域の人々に限定していないので、本文で解釈を狭めず、文脈によってはイエスに敵対する当局者などを指し得ることを脚注で説明した。
translation_notes:
  register: 明瞭で現代的ながら、問い詰める場面にふさわしい丁寧さと緊張感を保った。「私たちを迷わせておく」は慣用句の意味を優先した最適等価訳で、原文の比喩は脚注に保存した。
