id: JHN.10.28
reference: John 10:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: ja
  text: わたしは彼らに永遠の命を与える。彼らは永遠に決して滅びることがなく、だれも彼らをわたしの手から奪い去ることはない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: 永遠の命
  rationale: ヨハネ福音書で定着した自然な表現であり、来るべき時代に属する命と終わりのない命という含意を保つ。
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: 永遠に決して滅びることがなく
  rationale: οὐ μήによる強い否定を「決して」で、εἰς τὸν αἰῶναを「永遠に」で明示し、原文の重ねられた強調を保つ。
- source_word: ἁρπάσει
  choice: 奪い去る
  rationale: 力ずくでつかみ取り、支配下から連れ去る意味を簡潔に表す。
- source_word: ἐκ τῆς χειρός μου
  choice: わたしの手から
  rationale: 守りと権能を示す原文の身体的比喩をそのまま保持する。
theological_decisions:
- issue: 羊が滅びないことについての強い断言
  choice: 「永遠に決して滅びることがなく」と、否定と時間的表現をともに訳出する
  alternative: 「決して滅びない」とだけ訳す
  rationale: 本文はοὐ μήとεἰς τὸν αἰῶναを併用しているため、救いの体系的な解釈を付加せず、原文の強調そのものを保持する。
- issue: 「わたしの手」の比喩
  choice: 比喩を保持する
  alternative: 「わたしの保護から」などと説明的に訳す
  rationale: 保護、所有、権能のいずれか一つに限定せず、ヨハネ本文の神学的な広がりを残す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「命」「滅びる」「奪い去る」により、簡潔で威厳ある聖書本文の調子を保った。主語の転換を自然に示すため二文に分けた。
