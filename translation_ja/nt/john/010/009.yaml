id: JHN.10.9
reference: John 10:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ θύρα· δι’ ἐμοῦ ἐάν τις εἰσέλθῃ σωθήσεται καὶ εἰσελεύσεται καὶ ἐξελεύσεται καὶ νομὴν εὑρήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/009.yaml
  text: I am the door. If anyone enters through me[a], he will be saved, and will go in and go out and find pasture.
translation:
  language: ja
  text: わたしは門[a]である。だれでも、わたしを通って入るなら、救われる。そして、入り、出て、牧草地を見つける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「戸」または「戸口」。ギリシア語は、戸にも門にも用いられる。ここでは羊の囲いの入口という文脈に合う「門」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: θύρα
  choice: 門
  rationale: 「戸」や「戸口」も表し得る語だが、羊飼いと羊の比喩では、日本語の「門」が入口として自然であり、比喩の具体性も保つ。別訳は脚注に残した。
- source_word: δι’ ἐμοῦ
  choice: わたしを通って
  rationale: 属格を伴う διά が示す媒介を自然な日本語で表し、イエスが入るための経路であることを明確にした。
- source_word: ἐάν τις εἰσέλθῃ
  choice: だれでも、…入るなら
  rationale: ἐάν と接続法による一般的な条件、および τις の不特定で開かれた範囲を保った。
- source_word: σωθήσεται
  choice: 救われる
  rationale: 身体的な救出だけに狭めず、ヨハネ福音書における救いの神学的な広がりと牧者の比喩における安全の両方を保持する。
- source_word: εἰσελεύσεται καὶ ἐξελεύσεται
  choice: 出入りし
  rationale: 対になった移動を簡潔で自然な日本語にした。「入る」が直前にもあるため、定着した表現「出入りする」を用いて不必要な反復を避けた。
- source_word: νομὴν
  choice: 牧草
  rationale: 羊が食物を得るという牧者の比喩を明瞭に表す。「牧草地」と限定せず、語が持つ牧草・放牧の含みを自然に伝える。
- source_word: εὑρήσει
  choice: 見つける
  rationale: 基本義をそのまま、平明で直接的な日本語にした。
theological_decisions:
- issue: 羊飼いの文脈における θύρα の比喩
  choice: 門
  alternative: 戸、戸口
  rationale: 日本語では羊の囲いへの入口を「門」とするのが自然であり、「わたしは…である」という比喩も明瞭になる。ただし原語は家屋などの「戸」も表し得るため、語義上の別訳を脚注に示した。
- issue: σωθήσεται が表す救いの範囲
  choice: 救われる
  alternative: 助け出される、守られる
  rationale: 単なる身体的安全に狭めることも、本文が明記しない体系的定義を加えることも避け、霊的救いと牧者の保護という文脈上の重なりを保った。
- issue: 「出入りする」という表現の含意
  choice: 比喩をそのまま保持する
  alternative: 自由に行き来する、安全に暮らす
  rationale: この句が自由や安全を暗示する可能性はあるが、原文はそれを説明していないため、解釈を本文へ織り込まず動作表現を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたしは門である」は宣言の重みを保つ常体とし、後半は日本語として過度に代名詞を補わず、一般的な「だれでも」を自然に受けた。
