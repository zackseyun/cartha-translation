id: JHN.10.35
reference: John 10:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ ἐκείνους εἶπεν θεοὺς πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο, καὶ οὐ δύναται λυθῆναι ἡ γραφή,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/035.yaml
  text: If he called those to whom the word of God came ‘gods’—and the Scripture cannot be broken—[a][b]
translation:
  language: ja
  text: 神のことばが臨んだ人々を「神々」[a]と呼んだのであれば――聖書は無効にされることがありません[b]――、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神的な者たち」。ギリシア語は「神々」で、詩篇82篇6節の表現を踏まえている。これを人間の裁判官たちと理解する見方もある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖書を破ることはできません」または「聖書を退けることはできません」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: のであれば
  rationale: イエスの論証を導く条件節として訳し、次節へ続く構文を保った。
- source_word: ἐκείνους
  choice: 人々
  rationale: 詩篇で呼びかけられた者たちを指す。「男たち」など、原文にない限定は加えない。
- source_word: εἶπεν
  choice: 呼んだ
  rationale: 目的語補語の θεούς とともに、彼らを「神々」と称したという意味を自然な日本語で表す。主語は文脈に委ね、原文の含みを狭めない。
- source_word: θεοὺς
  choice: 「神々」
  rationale: 詩篇82篇6節を踏まえた複数形をそのまま保持し、「裁判官」などの解釈を本文へ持ち込まない。
- source_word: πρὸς οὓς ὁ λόγος τοῦ θεοῦ ἐγένετο
  choice: 神のことばが臨んだ人々
  rationale: 神のことばがその者たちに向けて到来したことを表す定型的な預言表現として、「臨んだ」と簡潔に訳した。
- source_word: οὐ δύναται λυθῆναι
  choice: 無効にすることはできません
  rationale: λύω のここでの意味を、聖書の効力を取り消したり退けたりできないこととして明瞭に表す。
- source_word: ἡ γραφή
  choice: 聖書
  rationale: 権威ある聖書の記述を指す定着した日本語表現を用いた。
theological_decisions:
- issue: 「神々」が指す者の理解
  choice: 本文では「神々」を保持する
  alternative: 裁判官、神的な者たち
  rationale: イエスの論証は詩篇82篇6節の実際の語句に依存するため、指示対象についての特定の解釈を本文で確定しない。
- issue: 「聖書を無効にすることはできない」の意味
  choice: 聖書の文言・効力を取り消せないこととして訳す
  alternative: 聖書を破ることはできない、聖書を退けることはできない
  rationale: 原語の比喩を逐語的に「解く」とせず、この文脈での無効化・破棄の意味を自然な日本語で示す。聖書論について本文以上の体系的主張は加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。条件節が次節へ続くことを末尾の読点で示し、挿入的な説明句はダッシュで区切った。「神々」という緊張を本文に残し、解釈上の選択肢は脚注に置いた。
