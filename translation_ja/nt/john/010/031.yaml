  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: ja
  text: そこでユダヤ人たちは、イエスを石打ちにするため、再び石を手に取った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上、「ユダヤ人の指導者たち」または「ユダヤ地方の人々」を指す可能性もある。ヨハネ福音書の「ユダヤ人たち」は、ユダヤ民族全体ではなく、イエスに敵対した特定の人々を指すことが多い。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: 手に取った
  rationale: βαστάζωは「運ぶ」「持ち上げる」を意味し得るが、ここでは石打ちに用いる石を取る場面なので、「手に取った」が自然で文脈に即している。
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの発言を受けた反応・展開を示す接続語として、現代日本語の物語文に自然な「そこで」とした。
- source_word: πάλιν
  choice: 再び
  rationale: 同様の敵対的行動の反復を明確に表す。
- source_word: λίθους
  choice: 石
  rationale: λίθοςの基本義をそのまま訳し、名詞自体に殺意などの解釈を加えない。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: ギリシア語の明示的な表現を本文では保持する。ただしヨハネ文書では文脈上、イエスに敵対する特定の人々を指す場合が多いため、その範囲について脚注を付す。
- source_word: ἵνα λιθάσωσιν αὐτόν
  choice: イエスを石打ちにしようと
  rationale: ἵνα＋接続法の目的を自然な日本語で示し、λιθάζωの具体的意味「石打ちにする」を保持する。αὐτόνは日本語で指示対象を明確にするため「イエス」とした。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示対象と範囲
  choice: 本文では「ユダヤ人たち」と訳し、文脈上の限定的な可能性を脚注で示す。
  alternative: 「ユダヤ人の指導者たち」または「ユダヤ地方の人々」
  rationale: 本文の語を不必要に狭めずに保つ一方、ユダヤ民族全体を一括して指すとは限らないというヨハネ特有の文脈を注で明示し、誤解を避ける。
translation_notes:
  register: 明快で現代的ながら品位のある叙述。「石を手に取った」と「石打ちにしようと」の語の重なりは、原文の λίθους／λιθάσωσιν の意図的な反復を反映して保持した。
