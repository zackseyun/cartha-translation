id: JHN.10.17
reference: John 10:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: ja
  text: 父がわたしを愛しておられるのは、わたしが自分のいのち[a]を捨て、再びそれを得るためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「魂」とも訳せる語。ここでは、イエスが死において捨て、再び得る「いのち」を意味するのが最も自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このためです
  rationale: 後続するὅτι節を理由として示す前方照応の表現を、自然な現代日本語で保った。
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: 父がわたしを愛しておられる
  rationale: 定冠詞付きの「父」を所有表現に変えず、主語と目的語の関係を明示した。
- source_word: ὅτι
  choice: （後続文による理由の提示）
  rationale: 内容ではなく理由を導く用法と取り、文を分けながら「このため」と対応させた。
- source_word: τίθημι τὴν ψυχήν μου
  choice: 自分のいのちを捨てます
  rationale: ヨハネ10章で、死において自発的に命を差し出すことを表す慣用的意味を自然な日本語で示した。
- source_word: ἵνα
  choice: ためです
  rationale: 目的を表す力を保ち、結果や単純未来に限定しなかった。
- source_word: πάλιν λάβω αὐτήν
  choice: それを再び受ける
  rationale: λαμβάνωの基本的な「受ける／得る」という幅を保ちつつ、死後に再びいのちを得る文脈を明瞭にした。
theological_decisions:
- issue: ψυχήの意味
  choice: いのち
  alternative: 魂
  rationale: ここでは、イエスが死に際して差し出し、再び受ける生命を指す。「魂」とすると、本文が前面に出していない身体と魂の対比を持ち込みかねない。
- issue: ἵνα λάβωの目的性と復活の表現
  choice: それを再び受けるため
  alternative: それを再び取り戻すため／再び受けることになるため
  rationale: ἵναの目的性を保ち、単なる未来や結果に平板化しない。またλαμβάνωを「受ける」として、直後の節にある権威の主題との緊張を先取りして解消しない。
- issue: 父の愛とイエスの自己献身の因果関係
  choice: 「このため」と理由を明示
  alternative: 「このことによって」
  rationale: διὰ τοῦτο…ὅτιの因果構造をそのまま示しつつ、父の愛が時間的に自己献身後に始まるという含意を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「命」ではなく聖書本文としてなじみのある「いのち」を用いた。長い従属構文を避けて三文に分けたが、因果関係と目的関係は保持した。
