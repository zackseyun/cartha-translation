  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: ja
  text: ほかの人たちは言っていた。「このような言葉は、悪霊につかれた者の言葉ではない。悪霊が目の見えない人たちの目を開けることなど、できるだろうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: ほかの人たち
  rationale: 直前にイエスを非難した人々と対照をなす別の人々を、自然な現代日本語で表す。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了時制が示す継続的または反復的な発言を表す。
- source_word: Ταῦτα τὰ ῥήματα
  choice: これは……言葉
  rationale: イエスが語った一連の言葉を指す。日本語では「これらの言葉」よりも、引用全体を受ける「これは……言葉」が自然である。
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: 悪霊につかれた者の言葉ではない
  rationale: 属格の分詞が示す、言葉の話し手・出所を自然に補う。δαιμονίζομαιを過度に体系化せず、一般に理解しやすい表現とした。
- source_word: μὴ
  choice: できるだろうか
  rationale: 否定の答えを予期する修辞疑問を、文脈と「ことなど」によって自然な日本語で示す。
- source_word: δαιμόνιον
  choice: 悪霊
  rationale: 日本語の聖書文脈で明瞭かつ自然な対応語であり、単なる曖昧な「霊」へ弱めない。
- source_word: τυφλῶν ὀφθαλμοὺς ἀνοῖξαι
  choice: 盲人の目を開ける
  rationale: 原文の具体的な比喩表現を保ち、直前の盲人の癒やしとのつながりを明確にする。
theological_decisions:
- issue: δαιμονίζομαι と δαιμόνιον の訳し分け
  choice: 悪霊につかれた者／悪霊
  alternative: 悪霊に取りつかれた者／悪霊、悪霊に支配された者／悪霊
  rationale: イエスの言葉と業が悪霊の働きとは両立しないという群衆の議論をそのまま伝える。「つかれた」は自然で簡潔だが、悪霊憑依に関する特定の体系的理解までは持ち込まない。
- issue: μή が導く修辞疑問の力
  choice: 悪霊に……できるだろうか
  alternative: 悪霊に……できるはずがないではないか
  rationale: 否定の答えが期待されていることを保ちつつ、断定的な言い換えによって疑問文の形を失わせない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、群衆の対照、未完了時制の継続性、修辞疑問の否定的期待を保持した。本文に脚注は設けない。
