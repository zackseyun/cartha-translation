  source_fidelity: 本文は、οὐκ…εἰ μὴ の排他的な目的、「盗む・屠る・滅ぼす」という三つの動作、ならびにイエスの来臨の目的を正確に対比している。「命」を「永遠の命」などと限定せず、περισσόν を「豊かに」としたことも原文の意味の幅を保っている。
  naturalness: 「盗人が来るのは、盗み、屠り、滅ぼすためにほかならない」「私が来たのは、彼らが命を得、それも豊かに得るためである」は、荘重さを保ちながら現代標準語として理解可能である。「屠り」はやや文語的だが、羊の文脈に即した意図的で適切な語選びであり、脚注の補足もある。
  terminology: 「盗人」はこの比喩的文脈に適した定着した語である。「屠り」はθύσῃの、単なる殺害より具体的な屠殺の含意を保持する。「命」はζωήを不必要に教義的に限定せず、「豊かに」は物質的繁栄へ拡大しないπερισσόνの適切な表現である。脚注a・bのアンカーと内容は本文に対応している。
