id: JHN.10.10
reference: John 10:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ κλέπτης οὐκ ἔρχεται εἰ μὴ ἵνα κλέψῃ καὶ θύσῃ καὶ ἀπολέσῃ· ἐγὼ ἦλθον ἵνα ζωὴν ἔχωσιν καὶ περισσὸν ἔχωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: ja
  text: 盗人が来るのは、盗み、屠り、滅ぼすためにほかならない。[a] 私が来たのは、彼らが命を得、それも豊かに得るためである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「屠り」（θύσῃ）は「殺し」とも訳せる。このギリシア語動詞は動物を屠ることを指す場合が多く、ここでは羊の比喩に合っている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「命を豊かに得るため」、または「命を十分に得るため」。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: 盗人
  rationale: 定冠詞を伴う単数形を、羊飼いのたとえに登場する代表的な人物として表した。「泥棒」よりもやや格調があり、現代語としても理解できる。
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: 来るのは……ためにほかならない
  rationale: 「……以外のためには来ない」という排他的な目的を、自然で明確な日本語にした。
- source_word: ἵνα κλέψῃ
  choice: 盗み
  rationale: 後続する二つの動詞と並列させ、目的を簡潔に示した。
- source_word: θύσῃ
  choice: 屠り
  rationale: θύω は動物を屠ることをしばしば指し、羊の比喩にも適合する。一般的な「殺し」も可能なため脚注に示した。
- source_word: ἀπολέσῃ
  choice: 滅ぼす
  rationale: 盗み、屠ることに続く全面的な破壊を表しつつ、対象や方法を本文以上に限定しない。
- source_word: ἐγὼ ἦλθον
  choice: 私が来た
  rationale: アオリストを素直な過去形で訳し、盗人の目的とイエスの使命との対照を保った。主語代名詞の明示による対照も「私が」で表した。
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: 彼らが命を得る
  rationale: 目的節を保持した。日本語では命について「持つ」より「得る」が自然であり、ζωή は「永遠の命」と限定せず「命」とした。
- source_word: καὶ περισσὸν ἔχωσιν
  choice: それも豊かに得る
  rationale: περισσόν が命を得る程度・充溢を示すことを自然な日本語で表した。「それも」により前節との連続と強調を示した。
theological_decisions:
- issue: ヨハネ文書における ζωή の範囲
  choice: 命
  alternative: 永遠の命／真の命
  rationale: 本文には「永遠の」に当たる形容詞がないため、ヨハネ福音書における豊かな含意を保ちながら、特定の意味に狭めなかった。
- issue: περισσόν の意味合い
  choice: 豊かに
  alternative: あふれるほどに／十分に
  rationale: イエスが与える命の充実を表すが、物質的繁栄を意味するような説明は加えなかった。
translation_notes:
  register: 明快な現代標準語を基調としつつ、イエスの荘重な対比を保った。「屠る」は文脈上の具体性を優先した語で、より一般的な訳語は脚注に示した。
