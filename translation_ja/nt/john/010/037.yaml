  text: εἰ οὐ ποιῶ τὰ ἔργα τοῦ πατρός μου, μὴ πιστεύετέ μοι·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: ja
  text: もしわたしが、わたしの父のわざを行っていないなら、わたしを信じてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「わたしの言うことを信じてはならない」。
    reason: πιστεύω＋与格は、人物本人への信頼だけでなく、その人物の語る内容を信じる意味にも理解できるため。
lexical_decisions:
- source_word: εἰ οὐ ποιῶ
  choice: もし……行っていないなら
  rationale: εἰによる条件節と、οὐが現在形ποιῶを否定する構造を明確に表す。現在進行中の働きを含み得るが、日本語では「行っていない」が自然である。
- source_word: τὰ ἔργα
  choice: わざ
  rationale: ヨハネ福音書でイエスの行為やしるしを指すἔργαの広がりを保つ。「行い」よりも、父に属する特別な働きという文脈に適している。
- source_word: τοῦ πατρός μου
  choice: わたしの父の
  rationale: 属格を簡潔に保ち、イエスと父との関係を解釈的に言い換えない。
- source_word: μὴ πιστεύετέ μοι
  choice: わたしを信じてはならない
  rationale: μήを伴う現在命令形の禁止を表し、πιστεύωと与格μοιの直接的な意味を自然な日本語にする。
theological_decisions:
- issue: πιστεύω＋与格μοιの意味
  choice: 「わたしを信じてはならない」
  alternative: 「わたしの言うことを信じてはならない」
  rationale: この構文は人を信じることと、その人の言葉を真実として受け入れることの双方を含み得る。本文では人称代名詞をそのまま生かし、証言内容だけに意味を限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いた。「わざ」はヨハネ福音書の用語上のつながりを保つため、ひらがな表記とした。禁止命令は、簡潔さと荘重さを両立する「信じてはならない」とした。
