id: JHN.10.41
reference: John 10:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἦλθον πρὸς αὐτὸν καὶ ἔλεγον ὅτι Ἰωάννης μὲν σημεῖον ἐποίησεν οὐδέν, πάντα δὲ ὅσα εἶπεν Ἰωάννης περὶ τούτου ἀληθῆ ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/041.yaml
  text: And many came to him and were saying, “John did no sign, but everything that John said about this man was true.”
translation:
  language: ja
  text: 多くの人がイエスのもとに来て、こう言っていた。「ヨハネはしるしを一つも行わなかった。しかし、ヨハネがこの方について語ったことは、すべて真実だった。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: 多くの人
  rationale: 形容詞の名詞的用法を、現代日本語で自然かつ明確に表した。
- source_word: ἦλθον πρὸς αὐτόν
  choice: イエスのもとに来て
  rationale: πρός＋対格が表す人物への接近を「もとに来る」で自然に表現し、文脈上の指示対象を明示した。
- source_word: ἔλεγον
  choice: こう言っていた
  rationale: 未完了過去の継続・反復的な側面を「言っていた」で保持した。
- source_word: σημεῖον
  choice: しるし
  rationale: ヨハネ福音書で、行為そのものを超える意味を指し示す重要語であるため、「奇跡」ではなく「しるし」とした。
- source_word: ἐποίησεν οὐδέν
  choice: 一つも行わなかった
  rationale: οὐδένの全面否定を自然な日本語で明確にし、ποιέωを「行う」と訳した。
- source_word: πάντα ὅσα
  choice: 語ったことは、すべて
  rationale: 包括的な意味を保ちつつ、日本語として自然な語順にした。
- source_word: περὶ τούτου
  choice: この方について
  rationale: τούτουの指示的な力を保ち、イエスを指す発話として自然で敬意ある日本語にした。「彼について」より指示性が明確で、「この男」ほど粗野ではない。
- source_word: ἀληθῆ ἦν
  choice: 真実だった
  rationale: 複数中性主語に単数動詞が対応するギリシア語を、日本語では内容全体への述定として簡潔に表した。
theological_decisions:
- issue: ヨハネ福音書における σημεῖον の用語法
  choice: しるし
  alternative: 奇跡
  rationale: 著者の主題的な用語法を保ち、単なる超自然的出来事という意味に狭めないため。
- issue: περὶ τούτου が指すイエスの表現
  choice: この方について
  alternative: 彼について／この人について
  rationale: 指示代名詞の力と発話内の指示対象を保ちながら、現代の日本語で自然かつ品位ある表現とした。神学的称号を付加してはいない。
translation_notes:
  register: 明瞭な現代標準日本語。会衆での朗読にも適する簡潔で品位ある文体とし、「しるし」はヨハネ福音書の主要語として平仮名表記で保持した。
