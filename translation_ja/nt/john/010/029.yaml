id: JHN.10.29
reference: John 10:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: ja
  text: 彼らをわたしに与えてくださったわたしの父[a]は、すべてにまさって偉大であり、だれも父の手から彼らを奪い取ることはできない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、より字義的には、「わたしの父がわたしに与えてくださったものは、すべてにまさって偉大である」。ここのギリシア語の表現は難しく、与えられた人々ではなく、与えられたもの自体が比較の主語だと理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: わたしの父
  rationale: 自然な日本語の所有表現を用い、イエスと父との関係を説明的に広げず、そのまま示した。
- source_word: ὃ δέδωκέν μοι
  choice: 彼らをわたしに与えてくださった
  rationale: 中性単数の関係代名詞を含む難しい表現だが、直前の「羊」と奪い取られることへの言及を踏まえ、文脈上の指示対象を「彼ら」と明示した。完了形は、父が与えたという行為とその継続する結果を表す「与えてくださった」とした。
- source_word: πάντων μεῖζων
  choice: すべてにまさって偉大
  rationale: πάντωνが人々か物事かを限定しないため、「すべてにまさって」として比較の広さを保ち、μεῖζωνの偉大さを自然な日本語で表した。
- source_word: οὐδεὶς δύναται
  choice: だれも…ことはできない
  rationale: 能力または可能性の全面的な否定を、明瞭で自然な現代日本語にした。
- source_word: ἁρπάζειν
  choice: 奪い取る
  rationale: 力ずくで保護下から取り去る意味を表し、直前の節との語のつながりも保った。
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: 父の手から
  rationale: ἐκの起点・内部からの離脱を「から」で表し、保護と力を示す「手」の比喩を維持した。
theological_decisions:
- issue: ὃ δέδωκέν μοιの本文上・統語上の難しさ
  choice: 文脈上の羊を指すものとして「彼らをわたしに与えてくださったわたしの父」と訳す
  alternative: 「わたしの父がわたしに与えてくださったものは、すべてにまさって偉大である」と訳す
  rationale: 印刷本文のギリシア語は統語的に難しく、写本にも異読がある。直前では父が御子に与えた羊が話題であり、続く「奪い取る」も彼らを指すため、本文では人物を指す解釈を明瞭にした。ただし、賜物そのものを比較の主語とする理解も真正な可能性なので脚注に残した。
- issue: πάντων μεῖζωνにおける比較対象の範囲
  choice: 「すべてにまさって偉大」とし、人や物に限定しない
  alternative: 「すべての人より偉大」または「すべてのものより偉大」
  rationale: πάντωνの範囲は広く、人々か事物かを本文だけで限定すべきではないため、原文の包括的な比較を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、父の「手」という比喩と荘重さを保った。「くださった」は父から御子への授与を自然な敬意をもって表す。
