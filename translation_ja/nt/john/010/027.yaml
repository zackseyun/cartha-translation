id: JHN.10.27
reference: John 10:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: ja
  text: わたしの羊たちは、わたしの声を聞く。わたしは彼らを知っており、彼らはわたしについて来る。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: わたしの羊たち
  rationale: 定冠詞を伴う所有形容詞の所有関係を自然な現代日本語で表した。「わたし自身の羊」と強調しすぎず、羊飼いの比喩も保持する。
- source_word: τῆς φωνῆς μου ἀκούουσιν
  choice: わたしの声を聞く
  rationale: 属格を取るἀκούωを、日本語の自然な目的語構文で訳した。現在形が示す継続的・特徴的な行為は、日本語の非過去形で表す。「聞き従う」とはせず、語そのものが許す含みを保つ。
- source_word: κἀγὼ γινώσκω αὐτά
  choice: わたしは彼らを知っており
  rationale: κἀγώの接続を文脈上自然な連続で示し、γινώσκωは解釈的に説明を加えず「知る」とした。羊を指す代名詞は、人格的な比喩を踏まえて「彼ら」とする。
- source_word: ἀκολουθοῦσίν μοι
  choice: 彼らはわたしについて来る
  rationale: ἀκολουθέωの追随の動きを明瞭に表し、「従う」が持ち得る服従のみへの限定を避けた。現在形の特徴的・継続的行為を非過去形で示す。
theological_decisions:
- issue: γινώσκωの関係的な含意
  choice: 「知っており」と訳し、説明を加えない
  alternative: 「よく知っている」「親しく知っている」「見分ける」
  rationale: ヨハネ文書における人格的・関係的な深みを残しつつ、原文が明示しない程度や様態を付加しないため。
- issue: ἀκούουσινに従順の意味を明示するか
  choice: 「聞く」
  alternative: 「聞き従う」「耳を傾ける」
  rationale: 文脈上は応答と追随が伴うが、後続の「ついて来る」がそれを表すため、ἀκούω自体には解釈的な「従う」を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスの一人称は「わたし」とし、羊の比喩における人格的指示は「彼ら」で表した。三つの現在形を、羊たちの特徴的・継続的な関係を示す非過去形で統一した。
