id: JHN.10.15
reference: John 10:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς γινώσκει με ὁ πατὴρ κἀγὼ γινώσκω τὸν πατέρα, καὶ τὴν ψυχήν μου τίθημι ὑπὲρ τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/015.yaml
  text: just as the Father knows me and I know the Father[b][a], and I lay down my life for the sheep.
translation:
  language: ja
  text: 父がわたしを知っておられ、わたしも父を知っているのと同じように、わたしは羊たちのために[b]自分のいのち[a]を捨てます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の魂」。ここでは、自己を犠牲として与える文脈で「いのち」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「羊たちのために」は、「羊たちのために／羊たちに代わって」とも訳し得る。ギリシア語の前置詞は、代表的または犠牲的な意味合いを帯び得る。
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: のと同じように
  rationale: 直前の節にある羊との相互の認識と、父と子との相互の認識を比較する働きを、自然な日本語で明示する。
- source_word: γινώσκει / γινώσκω
  choice: 知っておられ／知っている
  rationale: 単なる情報ではなく関係的な深い認識を含み得るが、「知る」と訳して語義の広がりと反復を保つ。父については敬意を表す自然な日本語として「知っておられ」とした。
- source_word: ὁ πατὴρ / τὸν πατέρα
  choice: 父
  rationale: ギリシア語に所有代名詞はなく、ヨハネ福音書における称号的用法と節内の並行を保つ。
- source_word: κἀγὼ
  choice: わたしも
  rationale: καίとἐγώの結合を、父との相互性が自然に伝わる日本語で表す。
- source_word: τὴν ψυχήν μου
  choice: 自分のいのち
  rationale: この自己犠牲の文脈ではψυχήは非物質的な「魂」に限定されず、死に渡される本人の命を指す。「自分の」は主語との結び付きを自然に示す。
- source_word: τίθημι
  choice: 差し出します
  rationale: ψυχήとともに用いられた「命を置く」という表現を、意図的な自己献身が伝わる現代日本語にした。
- source_word: ὑπὲρ
  choice: のために
  rationale: 受益的、代表的、犠牲的な含意を持ち得る前置詞を、一つの教理的定式に限定せず広く保つ。
- source_word: τῶν προβάτων
  choice: 羊たち
  rationale: 羊飼いの比喩を保持し、複数の羊を自然な日本語で示す。
theological_decisions:
- issue: イエスの自己献身におけるὑπὲρの力
  choice: 「羊たちのために」と訳す。
  alternative: 「羊たちに代わって」「羊たちを代表して」
  rationale: 羊に益する犠牲的・代表的な行為という幅を保ち、置換のみを明示する教理的表現へ狭めない。
- issue: この文脈におけるψυχήの意味
  choice: 「いのち」と訳す。
  alternative: 「魂」
  rationale: 良い羊飼いが死に至るまで自らを与える文脈であり、非物質的部分だけでなく本人の命を指すため。
- issue: καθὼςが示す比較の範囲
  choice: 「のと同じように」により、直前の羊との相互認識との強い比較を保つ。
  alternative: 独立した理由節のように「父が……知っておられるので」と読む。
  rationale: καθὼςは比較を導き、父と子の相互認識を羊飼いと羊の相互認識に結び付ける。因果関係へ限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「いのち」は聖書文体として読みやすい仮名表記とし、「差し出します」で自発的な自己献身を表した。節が前文から続く構造を保つため、冒頭を比較表現から始めた。
