  text: I and the Father are one[a].
translation:
  language: ja
  text: わたしと父とは一つです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の「一つ」は中性形です。これは、イエスと父が同一人物であると述べるのではなく、両者の一体性を表しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: わたし
  rationale: 明示された一人称単数代名詞であり、主語を強調するギリシア語の形を保つ。
- source_word: καὶ
  choice: と
  rationale: 二つの主語「わたし」と「父」を自然な現代日本語で並列する。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: ヨハネ文書の文脈ではイエスの父を指す称号的な用法であり、日本語では定冠詞を訳出せず「父」とするのが自然である。
- source_word: ἕν
  choice: 一つ
  rationale: 中性単数形であることを反映し、父とイエスを同一人物とせずに、その一体性を端的に表す。「一つのもの」や「一致している」は説明的になりすぎる。
- source_word: ἐσμεν
  choice: です
  rationale: 一人称複数現在形の連結動詞。日本語では数が動詞に現れないため、「わたしと父」という並列主語によって両者の区別を示す。
theological_decisions:
- issue: 中性のἕνと複数形ἐσμενが示す、キリスト論的に重要な一体性と区別
  choice: 「わたしと父とは一つです」と訳し、イエスと父との真の一体性を述べつつ、両者を同一人物とする表現を避ける。
  alternative: 「わたしと父とは一つのものです」「わたしと父とは一致しています」
  rationale: 中性形の「一つ」は人物としての同一性を直接述べず、複数形の動詞は「わたし」と「父」の区別を保っている。単なる意見の一致へ弱めることも、後代の教理用語を本文へ持ち込むこともせず、原文の神学的緊張を保つ。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。「わたし」は本文の明示的で強調されたἐγώを自然に表し、「父とは」の「は」は対比を強めずに主題を明瞭にする。
