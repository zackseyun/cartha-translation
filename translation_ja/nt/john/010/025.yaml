revisions:
- from: イエスは彼らに答えられた。「わたしはあなたがたに言ったのに、あなたがたは信じない。わたしが父の名によって行っている業、それらがわたしについて証ししている。[a]」
  to: イエスは彼らに答えられた。「わたしはあなたがたに言ったが、あなたがたは信じない。わたしが父の名によって行っている業、その業がわたしについて証ししている。」
  rationale: 原文の接続関係を過度に譲歩的にしないよう「のに」を「が」に改めた。また、日本語の自然な照応に合わせて「それらが」を「その業が」に改めた。脚注は必須の意味情報を補うものではなく、既存の位置も対応語句から外れているため省いた。
