  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: ja
  text: イエスは彼らに答えられた。「わたしはあなたがたに言ったが、あなたがたは信じない。わたしが父の名によって行っている業、その業がわたしについて証ししている。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: イエスは彼らに答えられた
  rationale: 対話における標準的な応答表現として自然な現代日本語にし、敬意を表すため主語尊敬の「答えられた」を用いた。
- source_word: Εἶπον ὑμῖν
  choice: わたしはあなたがたに言った
  rationale: 過去になされた発言を指すアオリストの意味を保ちつつ、原文に明示される「あなたがたに」を残した。
- source_word: οὐ πιστεύετε
  choice: あなたがたは信じない
  rationale: ヨハネ福音書における πιστεύω の語彙的一貫性を保ち、継続的・現状的な不信を自然に表した。
- source_word: τὰ ἔργα
  choice: 業
  rationale: イエスの行為やしるしを指すヨハネ的な重要語として、単なる「行い」よりも簡潔で格調のある「業」を選んだ。
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: 父の名によって
  rationale: 権威、代理、代表という含意を持つ原文の慣用句を解釈で狭めず、日本語として理解可能な形で保持した。
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: それらがわたしについて証ししている
  rationale: 前置された ταῦτα の強調を「それらが」で示し、μαρτυρέω の法廷的・証言的な響きを「証しする」で保った。
theological_decisions:
- issue: イエスの業と父の名・権威との関係
  choice: 父の名によって
  alternative: 父の権威によって
  rationale: 父からの権威という含意を認めつつも、それだけに限定せず、原文が持つ代表・委任・関係性の幅と神学的緊張を保持した。
translation_notes:
  register: 明瞭で現代的ながら礼拝朗読にも耐える格調を保った。「業」「証し」はヨハネ福音書内の主要語彙として一貫性を重視した。
