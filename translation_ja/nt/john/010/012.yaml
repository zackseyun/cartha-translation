id: JHN.10.12
reference: John 10:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: ja
  text: 雇われ人は、羊飼いではなく、羊が自分のものでもない者であり、狼が来るのを見ると、羊を置いて[a]逃げる。すると狼は羊をさらい、散らす。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊を見捨てて」とも訳せる。この動詞は、危険の中に羊を置き去りにするという強い意味を帯びることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: 雇われ人
  rationale: 賃金を得て働く者を指す。「雇われ人」は現代日本語として自然で、羊飼いとの対比も保てる。
- source_word: οὐκ ὢν ποιμήν
  choice: 羊飼いではなく
  rationale: 分詞構文の叙述的な意味を、明瞭で自然な日本語にした。
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: 羊も自分のものではない
  rationale: 羊への所有と個人的な帰属がないことを表すἴδιαの意味を保った。
- source_word: θεωρεῖ
  choice: 見る
  rationale: 迫る危険を目にするという文脈上の意味を、過度に説明せず簡潔に表した。
- source_word: τὸν λύκον ἐρχόμενον
  choice: 狼が来るの
  rationale: 狼が近づいて来る動きを現在分詞に即して保った。
- source_word: ἀφίησιν
  choice: 残して
  rationale: 基本的な意味を自然な日本語で表しつつ、文脈上の『見捨てる』という強い含意は脚注に示した。
- source_word: φεύγει
  choice: 逃げる
  rationale: 危険を前に退避する動作を簡潔かつ自然に表す。
- source_word: ἁρπάζει
  choice: 奪い
  rationale: 狼が羊を力ずくで捕らえる激しい動きを表す。
- source_word: σκορπίζει
  choice: 散らしてしまう
  rationale: 羊を散り散りにする結果を自然な日本語で表し、目的語の羊を文脈から補った。
- source_word: πρόβατα
  choice: 羊
  rationale: 集合的な『群れ』に置き換えず、原文の具体的な複数名詞による牧羊の比喩を保った。
theological_decisions:
- issue: 羊飼いの比喩の解釈
  choice: 「羊飼い」「雇われ人」「羊」「狼」という牧羊の語彙をそのまま保つ
  alternative: 「指導者」「世話をする人」などの解釈的な語に置き換える
  rationale: ヨハネ10章の持続する比喩を保ち、本文が明示しない対応関係や教派的解釈を訳文に持ち込まないため。
- issue: ἀφίησινの意味の強さ
  choice: 本文では「残して」とし、見捨てる含意を脚注で示す
  alternative: 本文で「見捨てて」と断定する
  rationale: この動詞は単に残すことも、危険の中で見捨てることも表しうる。文脈は非難の意味を強く示すが、語の幅を一つに限定しないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、牧羊の比喩と原文の動作の連続性を保った。「すると」によって、雇われ人が逃げた結果として狼が襲う流れを自然に示した。
