  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν ⸂πάλιν αὐτὸν⸃ πιάσαι· καὶ ἐξῆλθεν ἐκ τῆς χειρὸς αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/039.yaml
  text: So they were seeking again to seize him[a], but he escaped from their hand.
translation:
  language: ja
  text: そこで彼らは再びイエスを捕らえようとした。しかし、イエスは彼らの手から抜け出した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼らの手から出て行った」。「手」はここでは力や支配を表す慣用表現で、「彼らの手を逃れた」「彼らの支配から脱した」とも訳せる。
    reason: 原文の字義的表現と慣用的意味の双方を示すため。
lexical_decisions:
- source_word: ἐζήτουν
  choice: 捕らえようとした
  rationale: 未完了過去が表す、続いていた企て・未遂の行為を自然な現代日本語で示す。
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた物語上の展開・帰結を、硬すぎない接続語で表す。
- source_word: πάλιν
  choice: 再び
  rationale: 以前にも捕らえようとしたことがあるため、反復の意味をそのまま示す。
- source_word: πιάσαι
  choice: 捕らえよう
  rationale: 敵対的に身柄を押さえる意味を伝えつつ、「逮捕する」のような近代的・法的含意を加えない。
- source_word: ἐξῆλθεν
  choice: 抜け出した
  rationale: 基本義「出て行った」を保ちながら、「彼らの手から」と結びついた文脈上の離脱を自然な日本語で表す。
- source_word: ἐκ τῆς χειρὸς αὐτῶν
  choice: 彼らの手から
  rationale: 原文の単数形「手」を保ち、支配・掌握を意味する慣用表現をできるだけ直接に再現する。
theological_decisions:
- issue: イエスの離脱を明示的な「逃げた」と訳すか、原文の「彼らの手から出た」という表現を保つか
  choice: 「彼らの手から抜け出した」
  alternative: 「彼らから逃れた」／「彼らの手から出て行った」
  rationale: 「抜け出した」は捕縛されなかった結果を自然に伝える一方、原文にない逃走の仕方を詳しく加えず、「手から出る」という像も残す。
translation_notes:
  register: 明瞭で自然な現代標準日本語。敵対行為の強さは保つが、不必要に法的な用語は用いない。
