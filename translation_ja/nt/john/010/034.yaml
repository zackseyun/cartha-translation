id: JHN.10.34
reference: John 10:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἔστιν γεγραμμένον ἐν τῷ νόμῳ ὑμῶν ⸀ὅτι Ἐγὼ εἶπα· Θεοί ἐστε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/034.yaml
  text: Jesus answered them[a], “Is it not written in your Law, ‘I said, you are gods’?”
translation:
  language: ja
  text: イエスは彼らに答えられた。「あなたがたの律法に、『わたしは言った。あなたがたは神々である』[a]と書かれているではないか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神的存在」。イエスは詩篇82:6を引用している。そこでこの語が誰を指すかについては解釈が分かれるため、本文では引用の直接的な表現を保った。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: 彼らに答えられた
  rationale: ヨハネの対話における標準的な応答表現として自然に訳し、主語イエスへの敬意を穏やかな敬語で示した。
- source_word: Οὐκ ἔστιν γεγραμμένον
  choice: 書かれているではないか
  rationale: 完了受動分詞の現在的な効力と、否定疑問による修辞的な問いを自然な日本語で保持した。
- source_word: ἐν τῷ νόμῳ ὑμῶν
  choice: あなたがたの律法に
  rationale: ここでの「律法」は詩篇を含む聖書を広く指す用法であるため、限定的な「モーセ五書」とはせず、原文どおり訳した。
- source_word: Ἐγὼ εἶπα
  choice: わたしは言った
  rationale: 引用元の明示的な一人称代名詞を保ち、余分な強調語は加えなかった。
- source_word: Θεοί ἐστε
  choice: あなたがたは神々である
  rationale: 複数形 θεοί と連結動詞を直接訳し、「神と呼ばれた」などの解釈的補足を避けた。
theological_decisions:
- issue: 詩篇82:6の引用における θεοί の訳し方
  choice: 神々
  alternative: 神的な者たち
  rationale: 引用の語義と修辞的な力を保ち、対象が誰であるかという解釈上の論争を本文で解消しないため、直接的な訳を本文に置いた。別の理解が可能であることは脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「書かれているではないか」で原文の修辞疑問を保ち、引用部は簡潔にした。
