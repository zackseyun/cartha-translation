  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: ja
  text: ユダヤ人たちはイエスに答えた。「良い行いのためにあなたを石打ちにするのではない。冒瀆のためだ。あなたは人間でありながら、自分を神[a]としているからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分をある神としている」。ギリシア語の「神」には冠詞がないが、冒瀆という告発のこの文脈では、「神」とする意味である可能性が最も高い。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 文脈上は神殿でイエスに敵対する一団を指すが、ギリシア語自体は指導者に限定していないため、ヨハネ福音書の表現を保つ直接的な訳とした。
- source_word: Περὶ καλοῦ ἔργου
  choice: 良い働きのために
  rationale: 単数形を保ちつつ、περί＋属格がここで表す理由を自然な日本語で示した。
- source_word: λιθάζομέν
  choice: 石打ちにする
  rationale: 現在形は目前の行為または意図を表す。日本語では「石打ちにしている」よりも、この対決場面の意図を自然に表せる。
- source_word: βλασφημίας
  choice: 神を冒瀆したため
  rationale: この文脈の βλασφημία は神への冒瀆を意味するため、対象を明示して現代の読者にも分かりやすくした。
- source_word: ἄνθρωπος ὢν
  choice: 人間でありながら
  rationale: 分詞句に含まれる譲歩的な対比、すなわち彼らの見方では人間なのに、という非難の力を自然に伝える。
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: 自分を神としている
  rationale: ποιέω＋再帰代名詞＋補語の「自分を～とする」という意味を表す。無冠詞の θεόν は文法上「一人の神」とも取り得るが、冒瀆の告発という文脈ではイスラエルの神を指す理解が最も自然である。
theological_decisions:
- issue: ποιεῖς σεαυτὸν θεόν における無冠詞 θεόν の訳
  choice: 自分を神としている
  alternative: 自分を一人の神としている
  rationale: 無冠詞であるため後者も文法上は可能だが、直前の神への冒瀆という告発とヨハネ福音書の一神教的文脈では、彼らがイエスを神に等しい地位を自称する者として非難していると読むのが最も自然である。別訳は脚注に残して曖昧さを示した。
translation_notes:
  register: 明瞭で品位ある現代標準語。「冒瀆」は聖書的・法的な告発の重みを保ち、「人でありながら」ではなく「人間でありながら」として現代語としての明瞭さを優先した。
