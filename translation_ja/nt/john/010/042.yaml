  yaml_path: translation/nt/john/010/042.yaml
  text: And many believed in him there.
translation:
  language: ja
  text: そして、そこで多くの人がイエスを信じた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: そして
  rationale: 前の叙述を受ける標準的な接続表現。因果や時間的推移を必要以上に加えない。
- source_word: πολλοὶ
  choice: 多くの人が
  rationale: 形容詞の名詞的用法を、現代日本語で自然かつ明確に表した。
- source_word: ἐπίστευσαν
  choice: 信じた
  rationale: アオリスト直説法を簡潔に訳し、「信じるようになった」という起動的ニュアンスを不用意に付加しない。
- source_word: εἰς αὐτόν
  choice: イエスを
  rationale: 日本語では人を対象とする πιστεύω εἰς を「イエスを信じる」とするのが自然で、人格的な信頼の方向性も保てる。代名詞を固有名に置き換え、指示対象を明確にした。
- source_word: ἐκεῖ
  choice: そこで
  rationale: 信じた出来事の場所を示す副詞を、文脈とのつながりが自然な日本語で表した。
theological_decisions:
- issue: πιστεύω εἰς αὐτόν の救済論的含意
  choice: イエスを信じた
  alternative: イエスに信頼を置いた
  rationale: 原文が示すイエスへ向けられた信頼を保ちつつ、「信頼を置く」と説明的に広げすぎず、ヨハネ文書で反復される「信じる」という語彙を維持した。
translation_notes:
  register: 明快な現代標準日本語。短い叙述文として自然さと簡潔さを保ち、原文の場所の強調も「そこで」で維持した。
