  yaml_path: translation/nt/john/010/002.yaml
  text: But the one who enters through the door is the shepherd of the sheep[a].
translation:
  language: ja
  text: しかし、門を通って入る者は、羊の羊飼いです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊の羊飼い」は、「羊の一人の羊飼い」とも訳せます。ギリシア語のποιμήν（羊飼い）には冠詞がありませんが、前節の不正な侵入者との対照から、ここでは特定の、正当な羊飼いを指す定的な理解が有力です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: しかし、…入る者
  rationale: 冠詞付き現在分詞を、継続的・一般的な特徴を表す名詞句として自然な現代日本語にした。δέは前節の盗人や強盗との対照を示すため「しかし」とした。
- source_word: διὰ τῆς θύρας
  choice: 門を通って
  rationale: 属格を伴うδιάが表す、ある場所を通過するという空間的意味を明確にした。θύραは羊の囲いの出入口という文脈に合わせて「門」とした。
- source_word: ποιμήν
  choice: 羊飼い
  rationale: 羊を世話し導く者という語義を、一般読者に明瞭な語で表した。日本語では冠詞がないため、定・不定の違いを本文だけで明示せず、原文に残る曖昧さを保持した。
- source_word: τῶν προβάτων
  choice: 羊たちの
  rationale: πρόβαταの具体的な比喩を保ち、「群れ」と意訳せず「羊」とした。複数形は「たち」で自然に示した。
theological_decisions:
- issue: 述語名詞ποιμήνの定性
  choice: 本文では「羊たちの羊飼い」とし、定・不定を明示しない
  alternative: 「羊たちのその羊飼い」または「羊たちの一人の羊飼い」
  rationale: ποιμήνには冠詞がないが、述語位置にある無冠詞名詞だけでは不定と断定できず、前節との対照は正当な羊飼いを指す定的理解を支持しうる。一方、日本語の無冠詞表現はこの曖昧さを自然に保てるため、後のキリスト論的文脈を先取りせず、脚注で可能な読みを示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「入って来る」ではなく一般的な行為を表す「入る」とし、比喩の簡潔さを維持した。日本語で不自然な定冠詞相当語を加えず、原文の文法的な幅を脚注で説明した。
