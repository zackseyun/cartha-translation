id: JHN.10.22
reference: John 10:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγένετο ⸀τότε τὰ ἐγκαίνια ἐν ⸀τοῖς Ἱεροσολύμοις· ⸀χειμὼν ἦν,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/022.yaml
  text: At that time the Feast of Dedication took place in Jerusalem[a]. It was winter,
translation:
  language: ja
  text: そのころ、エルサレムで宮きよめの祭り[a]が行われた。季節は冬であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ハヌカ」とも呼ばれる。エルサレム神殿が再び聖別されたことを記念するユダヤ人の祭り。
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο
  choice: 行われた
  rationale: 祭りを主語とする日本語として自然であり、ここでの出来事の生起を表す γίνομαι の意味を明確に伝える。
- source_word: τότε
  choice: そのころ
  rationale: 物語上の時間的移行を自然な現代日本語で示す。「その時」よりも、祭りの時期を導入する文脈になじむ。
- source_word: τὰ ἐγκαίνια
  choice: 宮きよめの祭り
  rationale: 神殿の再奉献を記念する祭りであることを、固有名だけに置き換えず分かりやすく示す。「宮」は文脈上エルサレム神殿を指す。
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: エルサレムで
  rationale: 祭りが行われる場所を示す標準的で自然な場所表現。
- source_word: χειμὼν ἦν
  choice: 季節は冬であった
  rationale: 単純な情景描写を保ちつつ、「冬だった」よりやや格調ある明瞭な叙述とした。
theological_decisions:
- issue: τὰ ἐγκαίνια の祭りの特定
  choice: 本文では「宮きよめの祭り」と訳す
  alternative: 「奉献の祭り」または「ハヌカ」
  rationale: ギリシア語の名称が持つ奉献・再奉献の意味を本文で伝え、今日一般的な名称「ハヌカ」は文化的補足として脚注に残す。特定の教派的解釈は含めない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、聖書本文としての品位を保った。「宮きよめ」は一般読者にも意味が推測しやすい表現とし、文化的名称は脚注で補った。
