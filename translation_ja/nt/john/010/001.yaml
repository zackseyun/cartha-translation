id: JHN.10.1
reference: John 10:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: ja
  text: 「まことに、まことに、あなたがたに言います。羊の囲い[b]には、門[a]を通って入らず、ほかの所からよじ登る者、その者は盗人であり、強盗です[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「戸口を通って」とも訳せる。ギリシア語のθύραは、文脈により「戸」「戸口」「門」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「羊の囲い」は、「羊を入れる囲われた庭」または「羊の囲い場」とも訳せる。ギリシア語のαὐλήは、囲われた中庭や家畜の囲いを指す。
    reason: lexical_alternative
  - marker: c
    text: 原文は「盗人」（κλέπτης）と「強盗」（λῃστής）を区別している。後者はしばしば、力ずくまたは暴力を伴う略奪者を指す。
    reason: lexical_distinction
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: 二度繰り返される厳粛で強調的な導入句を、現代日本語で意味の通る形にしつつ反復も保った。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 二人称複数と直接的な発言形式を、自然で丁寧な現代日本語にした。
- source_word: ὁ μὴ εἰσερχόμενος
  choice: 入らず……者
  rationale: 冠詞付き現在分詞の一般的な単数の人物を、日本語で自然な連体表現として保った。
- source_word: διὰ τῆς θύρας
  choice: 戸口を通って
  rationale: θύραの出入り口という基本像を表し、後続の比喩にも対応できる訳とした。「門」も文脈上可能なので脚注に示した。
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: 羊の囲いに
  rationale: 羊を収容する囲われた場所という牧羊上の情景を、簡潔で分かりやすい日本語で表した。
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: ほかの所からよじ登る
  rationale: 正規の入口とは別の場所から上って侵入する身体的な動きを保ち、本文に明記されていない「壁」は補わなかった。
- source_word: ἐκεῖνος
  choice: その者
  rationale: 指示代名詞の強調を保ち、直前の人物を明確に指す自然な日本語とした。
- source_word: κλέπτης
  choice: 盗人
  rationale: ひそかに盗む者を指す標準的で簡潔な訳語とした。
- source_word: λῃστής
  choice: 強盗
  rationale: κλέπτηςとの区別を保ち、暴力や力ずくの略奪を含み得る語として訳した。
theological_decisions:
- issue: θύραとαὐλήによる比喩的情景
  choice: 「戸口」と「羊の囲い」という具体的な情景のまま訳す
  alternative: 「門」と「羊小屋」と訳す、または周辺文脈に基づいて寓意を説明的に訳す
  rationale: この節では比喩の情景を提示するにとどめ、イエス、救い、指導者などとの対応関係を本文へ先取りして加えないため。
- issue: ὁ μὴ εἰσερχόμενοςとἐκεῖνοςの単数表現
  choice: 「入らず……者、その者」
  alternative: 「入らない人は、その人」または複数化した表現
  rationale: 原文の一般的でありながら単数で示される人物像と、ἐκεῖνοςの指示的な強調を保つため。
- issue: κλέπτηςとλῃστήςの並列表現
  choice: 「盗人であり、強盗です」
  alternative: 両語をまとめて「盗賊です」とする
  rationale: 原文が二つの異なる語を並べているため、その語義上の緊張と強まりを消さないようにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの厳粛な導入句の反復と、牧羊の比喩が持つ簡潔で格調ある響きを保った。「よじ登る」によって不正規な侵入の具体像を示しつつ、原文にない対象物は補っていない。
