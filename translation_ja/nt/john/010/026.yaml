  text: ἀλλὰ ὑμεῖς οὐ πιστεύετε, ⸂ὅτι οὐκ⸃ ἐστὲ ἐκ τῶν προβάτων τῶν ⸀ἐμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/026.yaml
  text: But you do not believe[a], because you are not among my sheep.
translation:
  language: ja
  text: しかし、あなたがたは信じません。[a] わたしの羊ではないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、自分たちがわたしの羊ではないということを、あなたがたは信じません。」ギリシア語の接続詞は、理由ではなく、信じない内容を導くとも読める。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前の文脈との対照を明確にし、現代日本語として自然で品位のある逆接とした。
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 明示された複数代名詞の対照的な強調を、主題提示の「は」によって自然に表した。
- source_word: οὐ πιστεύετε
  choice: 信じません
  rationale: 否定された現在直説法を自然な現在表現とし、ヨハネ文書で一貫して重要な「信じる」を用いた。
- source_word: ὅτι
  choice: からです
  rationale: 文脈上有力な原因・理由の用法として訳した。ただし内容を導く「ということ」の可能性も脚注に残した。
- source_word: οὐκ ἐστὲ ἐκ τῶν προβάτων τῶν ἐμῶν
  choice: わたしの羊ではない
  rationale: ἐκが示す集団への所属を、日本語では簡潔かつ自然に「わたしの羊ではない」と表した。
theological_decisions:
- issue: ὅτιが不信の理由を示すか、信じない内容を導くか
  choice: 原因・理由として「わたしの羊ではないからです」
  alternative: 内容節として「自分たちがわたしの羊ではないということを、あなたがたは信じません」
  rationale: 直前後の、イエスの羊はその声を聞くという対比には原因の読みがよく適合する。一方、ギリシア語のὅτιは内容節も導き得るため、選び得る別解を脚注で明示し、選びや不信をめぐる神学的緊張を訳文だけで決着させない。
translation_notes:
  register: 明瞭な現代標準日本語。「信じません」と「からです」により読みやすさを保ちつつ、丁寧で格調を損なわない文体とした。脚注記号[a]は解釈上の分岐点である「信じません」の直後に置いた。
