  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Πολλὰ ⸂ἔργα καλὰ ἔδειξα ὑμῖν⸃ ἐκ τοῦ ⸀πατρός· διὰ ποῖον αὐτῶν ἔργον ⸂ἐμὲ λιθάζετε⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/032.yaml
  text: Jesus answered them[a], “I showed you many good works from the Father[b]; for which of them are you stoning me?”
translation:
  language: ja
  text: イエスは彼らに答えた。「わたしは、父[b]からの多くの良いわざを、あなたがたに示した。そのうち、どのわざのために[a]、あなたがたはわたしを石打ちにするのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらのわざのうち、どのわざが理由で」。
    reason: lexical_alternative
  - marker: b
    text: 「わたしの父」とする訳もあるが、ここでギリシア語本文は単に「父」としている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 応答を表す標準的な物語表現であり、文脈に自然に合う。
- source_word: Πολλὰ ἔργα καλὰ
  choice: 多くの良いわざ
  rationale: ヨハネ福音書で神学的な意味を帯びることの多いἔργαを「わざ」とし、καλάの有益で称賛に値する性質を「良い」で保った。
- source_word: ἔδειξα
  choice: 示した
  rationale: 単に行ったことだけでなく、人々の前に明らかにしたという語義を表す。
- source_word: ἐκ τοῦ πατρός
  choice: 父から出た
  rationale: ἐκが示す起源を自然な日本語で明示し、原文にない「わたしの」を補わない。
- source_word: διὰ ποῖον αὐτῶν ἔργον
  choice: そのうち、どのわざのために
  rationale: 対格を伴うδιάの原因・根拠の意味と、αὐτῶνが先行する複数のわざを指すことを明確にした。
- source_word: ἐμὲ λιθάζετε
  choice: あなたがたはわたしを石打ちにするのか
  rationale: λιθάζωの直接的な意味を保ち、「殺そうとしている」など、動詞に明示されない目的や試みの概念を加えなかった。
theological_decisions:
- issue: イエスの発言における「父」の表現
  choice: 「父」とし、「わたしの父」と補わない
  alternative: 「わたしの父」
  rationale: この本文には所有代名詞μουがないため、キリスト論的含意を翻訳で強めず、原文の表現と緊張を保った。文脈から父とイエスの関係はなお明らかである。
- issue: わざと父との関係を示すἐκの解釈
  choice: 「父から出た」
  alternative: 「父に代わって行った」
  rationale: ἐκが第一に示す起源・源泉を保持し、代理行為という解釈に限定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、対決場面にふさわしい簡潔で荘重な語調とした。「わざ」はヨハネ福音書におけるイエスの行為の神学的響きを保ち、「石打ち」は当時の処刑・暴力行為を簡潔に伝える。
