source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν πάλιν πέραν τοῦ Ἰορδάνου εἰς τὸν τόπον ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων, καὶ ἔμεινεν ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/040.yaml
  text: And he went away again across the Jordan to the place where John had first been baptizing[a], and he stayed there.
translation:
  language: ja
  text: そしてイエスは再びヨルダン川の向こう側、ヨハネが最初に洗礼を授けていた場所へ行き、そこに滞在した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 行き
  rationale: 出発して別の場所へ移ることを表す。日本語では目的地を伴う「行き」が自然であり、文脈上、元の場所を離れた意味も明らかである。主語は直前の文脈からイエスと明示した。
- source_word: πάλιν
  choice: 再び
  rationale: 移動が繰り返されたことを端的かつ格調を保って表す。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ヨルダン川の向こう岸へ
  rationale: πέρανと属格はヨルダン川の反対側を指す。移動を表すἀπῆλθενおよびεἰςに合わせ、「向こう岸へ」とした。
- source_word: εἰς τὸν τόπον
  choice: 場所に
  rationale: 移動の目的地を示すεἰςを、自然な日本語の到達点「場所に」で表した。
- source_word: ὅπου ἦν Ἰωάννης τὸ πρῶτον βαπτίζων
  choice: ヨハネが初めに洗礼を授けていた
  rationale: ἦνと現在分詞βαπτίζωνの迂言的構文が示す過去の継続的活動を「授けていた」で表し、τὸ πρῶτονは時間的に「初めに」とした。
- source_word: βαπτίζων
  choice: 洗礼を授けていた
  rationale: 他者に対してバプテスマを行っていた継続的活動を、現代日本語で明瞭な「洗礼を授けていた」と訳した。
- source_word: ἔμεινεν ἐκεῖ
  choice: 滞在した
  rationale: その場所にとどまったことを自然かつ簡潔に示す。「そこに」を重ねなくても、直前の「場所に」がἐκεῖの指示内容を明確に担う。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙述文として簡潔で dignified な調子にした。「ヨルダン」だけでは川名と分かりにくい読者のため「ヨルダン川」とした。原文の主語は省略されているが、文脈上の指示対象であるイエスを日本語では明示した。英語POBの脚注は英語表現上の「across/beyond」の代案であり、日本語訳「向こう岸」が意味を十分に保持するため脚注は設けない。
