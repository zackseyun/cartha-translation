  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: ja
  text: また、わたしには、この囲いに属さないほかの羊もいる。その羊たちをも、わたしは連れて来なければならない。彼らはわたしの声に耳を傾ける。[a] こうして、一つの群れとなり、羊飼いは一人となる。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らはわたしの声を聞く」とも訳せる。ギリシア語の動詞は「聞く」と「耳を傾ける」のどちらも意味し得るが、ここでは応答を伴って聞く意味を含むと考えられる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「囲い」（αὐλή、羊を入れる場所）と「群れ」（ποίμνη、羊の集団）を区別している。最後を「一つの囲い」とする訳もあるが、原文は「一つの群れ」としている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: ほかの羊
  rationale: πρόβαταは子羊に限定されない一般的な「羊」であり、ἄλλαはすでに念頭にある羊に加わる別の羊を示す。
- source_word: ἐκ τῆς αὐλῆς ταύτης
  choice: この囲いに属さない
  rationale: ἐκはここで出所・所属を表し、αὐλήは羊を入れる囲いを指す。「羊の囲い」より簡潔な「囲い」でも、文脈上意味は明瞭である。
- source_word: κἀκεῖνα δεῖ με ἀγαγεῖν
  choice: その羊たちをも、わたしは連れて来なければならない
  rationale: κἀκεῖναの追加の意味を「も」で示し、δεῖの必要性を「なければならない」で保った。ἀγαγεῖνは羊飼いの比喩に合う「連れて来る」とした。
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: 彼らはわたしの声に耳を傾ける
  rationale: ἀκούωは単に聞こえることも、応答を伴って聞くことも表し得る。ここでは羊飼いの声に従う文脈を自然に伝える一方、脚注で「聞く」の可能性を示す。
- source_word: γενήσονται μία ποίμνη
  choice: こうして、一つの群れ……となる
  rationale: γενήσονταιの将来的な成立・結果を「となる」で表し、ποίμνηを囲いではなく羊の集団である「群れ」と訳した。
- source_word: εἷς ποιμήν
  choice: 一人の羊飼い
  rationale: ποιμήνの牧羊の比喩を明示し、μίαとεἷςの並行を「一つ」「一人」で保った。
theological_decisions:
- issue: αὐλήとποίμνηの区別
  choice: この囲い……一つの群れ
  alternative: この囲い……一つの囲い
  rationale: 原文はαὐλή（囲い）とποίμνη（羊の群れ）を明確に使い分ける。両方を「囲い」とすると、一人の羊飼いのもとにある一つの群れという原文の像を損なう。
- issue: δεῖの力
  choice: 連れて来なければならない
  alternative: 連れて来る必要がある
  rationale: ヨハネ文書でδεῖが帯び得る強い必然性を保ちつつ、その必然性について特定の神学的説明を訳文に付加しない。
- issue: ἀκούωの意味幅
  choice: 耳を傾ける
  alternative: 聞く
  rationale: 文脈上は応答を伴う聞き方が考えられるが、語自体には「聞く」の意味もあるため、本文では自然な文脈的訳を採り、脚注で意味幅を保持する。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、イエスの発言にふさわしい簡潔で格調ある文体とした。「わたし」「羊飼い」を用い、過度に古風な表現や教派固有の用語を避けた。
