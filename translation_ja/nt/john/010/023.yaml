  text: καὶ περιεπάτει ὁ Ἰησοῦς ἐν τῷ ἱερῷ ἐν τῇ στοᾷ ⸀τοῦ Σολομῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/023.yaml
  text: And Jesus was walking in the temple courts[b][a], in Solomon’s Portico.
translation:
  language: ja
  text: イエスは神殿の境内[a]にある「ソロモンの回廊」[b]を歩いておられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿」と訳されるギリシア語ἱερόνは、内殿だけでなく、庭や回廊を含む神殿の境内全体を指す。
    reason: cultural_note
  - marker: b
    text: 「回廊」は、柱が並ぶ屋根付きの通路を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιεπάτει
  choice: 歩いておられた
  rationale: 未完了過去の継続的な動作を表し、イエスに対する自然で敬意ある現代日本語とした。
- source_word: ἱερῷ
  choice: 神殿の境内
  rationale: ἱερόνは内殿そのもの（ναός）ではなく、神殿の建物群とその構内を指すため。
- source_word: στοᾷ
  choice: 回廊
  rationale: 柱を備えた屋根付きの通路を指す語であり、日本語では「回廊」が明瞭で自然である。
- source_word: τοῦ Σολομῶνος
  choice: ソロモンの
  rationale: 属格を、この場所の名称として自然な日本語にした。
- source_word: καὶ
  choice: （独立した接続語としては訳出しない）
  rationale: 文脈上の単純な連結を担う語であり、単節の日本語では省略するほうが自然で、時間的意味を不必要に加えない。
theological_decisions: []
