  source_fidelity: 原文の未完了過去形περιεπάτειは「歩いておられた」により継続中の動作として適切に表されている。ἐν τῷ ἱερῷは「神殿の境内」、ἐν τῇ στοᾷ τοῦ Σολομῶνοςは「『ソロモンの回廊』を」と自然に対応しており、場所の関係も損なわれていない。καὶの非明示的な処理も、日本語の単文として自然であり、意味の付加や欠落には当たらない。
