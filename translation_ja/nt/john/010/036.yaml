id: JHN.10.36
reference: John 10:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν ὁ πατὴρ ἡγίασεν καὶ ἀπέστειλεν εἰς τὸν κόσμον ὑμεῖς λέγετε ὅτι Βλασφημεῖς, ὅτι εἶπον· Υἱὸς τοῦ θεοῦ εἰμι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/036.yaml
  text: do you say of the one whom the Father sanctified and sent into the world[a], ‘You are blaspheming,’ because I said, ‘I am the Son of God’?”
translation:
  language: ja
  text: 父が聖別し[a]、世に遣わした者について、あなたがたは、わたしが『わたしは神の子である』と言ったからといって、『あなたは神を冒瀆している』と言うのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖別し」は、「聖なるものとして取り分け」または「奉献し」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡγίασεν
  choice: 聖別し
  rationale: 「聖なるものとする」「聖なる目的のために取り分ける」という語義を保ち、御子が道徳的に改善されたという含意を避けつつ、原文の神学的緊張を残す。現代日本語ではやや専門的な語なので脚注で補う。
- source_word: ἀπέστειλεν
  choice: 遣わした
  rationale: ヨハネ福音書で繰り返される、父が御子を使命をもって送るという表現を自然かつ簡潔に伝える。
- source_word: κόσμον
  choice: 世
  rationale: ヨハネ文書における κόσμος の定着した訳語であり、人間世界を含む神学的な広がりも保てる。
- source_word: Βλασφημεῖς
  choice: あなたは神を冒瀆している
  rationale: 現在形の継続的な非難を自然な日本語で表す。日本語では目的語を補わないと不自然になりやすいため、文脈上明らかな「神を」を明示した。
- source_word: Υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: 属格を伴う称号的表現を、日本語聖書で自然かつキリスト論的な重みを保つ形で訳した。
- source_word: ὃν ὁ πατὴρ
  choice: 父が…者について
  rationale: 前置された関係節を日本語として明瞭に組み直し、非難の対象が父によって聖別され遣わされた者であることを保った。
- source_word: ὅτι ... ὅτι
  choice: …と言ったからといって、…と言うのですか
  rationale: 最初の ὅτι が告発内容を、二つ目が告発理由を導く関係を、自然な反語疑問として明確にした。
theological_decisions:
- issue: 御子に対する ἡγίασεν の訳し方
  choice: 聖別し
  alternative: 聖なるものとして取り分け／奉献し
  rationale: 原語と聖性との結びつきを保ちながら、文脈上は使命のための選別・奉献を指す可能性も脚注で示す。御子が以前は聖くなかった、または道徳的に改善されたという解釈は訳文に持ち込まない。
- issue: 「神の子」のキリスト論的な力
  choice: 神の子
  alternative: 神の子である者
  rationale: 冒瀆の告発をめぐる直近の文脈で称号として働く表現を簡潔に保ち、後代の教理用語を本文へ付加しない。
- issue: Βλασφημεῖς の省略された対象
  choice: 神を冒瀆している
  alternative: 冒瀆している
  rationale: ギリシア語では対象が明示されないが、日本語では「冒瀆する」に目的語を補うのが自然であり、神への冒瀆であることは文脈から明白である。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの反語的な問いを「言うのですか」で表した。「聖別」は原語との対応を優先したやや格調ある語であり、脚注で平易な意味を示した。「冒瀆」は内容の重大さにふさわしい標準的な宗教語として用いた。
