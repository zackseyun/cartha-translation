id: JHN.10.8
reference: John 10:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πάντες ὅσοι ἦλθον ⸂πρὸ ἐμοῦ⸃ κλέπται εἰσὶν καὶ λῃσταί· ἀλλ’ οὐκ ἤκουσαν αὐτῶν τὰ πρόβατα.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/008.yaml
  text: All who came before me are thieves and robbers[a], but the sheep did not listen to them.
translation:
  language: ja
  text: わたしより前に[a]来た者は皆、盗人であり、強盗である。しかし、羊たちは彼らの言うことを聞かなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしに先立って」とも訳せる。この句は時間的に「わたしより前に」という意味にも、イエスとは別に権威を主張して先に来た者という含みをもつ意味にも理解できる。文脈では、神に仕えた過去のすべての人ではなく、偽りの羊飼いたちを指すと理解されることが多い。
    reason: alternative_reading
lexical_decisions:
- source_word: πάντες ὅσοι
  choice: …者は皆
  rationale: 包括的・分配的な表現を、自然な現代日本語で保つ。文脈上問題となっている一群を指すが、本文では範囲を狭めない。
- source_word: ἦλθον
  choice: 来た
  rationale: アオリスト直説法の出来事を簡潔な過去形で表し、原文に明示されない完了的含意を加えない。
- source_word: πρὸ ἐμοῦ
  choice: わたしより前に
  rationale: 時間的な「わたし以前に」を第一義として自然に表しつつ、先行して権威を主張するという可能な含みは脚注に残す。
- source_word: κλέπται
  choice: 盗人
  rationale: ひそかに盗む者を表す語として、後続の「強盗」との区別を保てる、明瞭で格調ある語を選ぶ。
- source_word: λῃσταί
  choice: 強盗
  rationale: κλέπτηςより暴力的・略奪的な犯罪者を示し得る語であり、「盗人」との対を自然に保つ。
- source_word: ἀλλ’
  choice: しかし
  rationale: 前半との明確な逆接を、 dignifiedで自然な接続語によって示す。
- source_word: οὐκ ἤκουσαν αὐτῶν
  choice: 彼らの言うことを聞かなかった
  rationale: 属格目的語を伴うἀκούωの、単なる聴覚ではなく耳を傾け従う含意を自然に示す。羊が声を認めて従うという文脈にも適合する。
- source_word: τὰ πρόβατα
  choice: 羊たち
  rationale: 複数の羊を指すことを自然な日本語で明示し、羊飼いの比喩を保つ。
theological_decisions:
- issue: 「わたしより前に来た者は皆」の範囲
  choice: 本文では原文どおり広い表現を保ち、「わたしより前に来た者は皆」とする。
  alternative: 「わたしに先立って来た者は皆」、または「イエスから離れて羊飼いとしての権威を主張した者は皆」と解する。
  rationale: ギリシア語の形は広いが、文脈上、神から遣わされた過去のすべての人物を一律に非難するとは限らない。解釈上の限定を本文へ挿入せず、緊張と曖昧さを脚注で示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの宣言の厳粛さを保った。「盗人／強盗」で原語二語の差を維持し、「聞かなかった」は日本語として補語を必要とするため「言うこと」を補った。
