  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: ja
  text: 自分の羊をみな外へ出すと[a]、彼は羊たちの先を行き、羊たちは彼について行く。彼の声を知っているからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「外へ連れ出すと」または「追い出すと」とも訳せる。ギリシア語の動詞は、囲いの中から外へ出すことを表し、文脈によっては強く追い出す響きも持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: ～すると
  rationale: 不定の時を表す接続法を伴う時間節。一般的な場面を自然な現代日本語で表す。
- source_word: τὰ ἴδια πάντα
  choice: 自分の羊をみな
  rationale: 直訳は「自分のものをすべて」だが、文脈上は羊を指す。日本語として明確かつ自然になるよう「羊」を補い、πάνταを「みな」で保持した。
- source_word: ἐκβάλῃ
  choice: 外へ出す
  rationale: 囲いの中から外へ移すという中心的な動きを表しつつ、「追い出す」が帯び得る不必要に強圧的な響きを本文では避けた。動詞自体の幅は脚注に示した。
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: 彼は羊たちの先に立って進み
  rationale: 羊飼いが群れの前を行く具体的な位置関係と動作を、自然な日本語で保った。
- source_word: αὐτῷ ἀκολουθεῖ
  choice: 彼について行く
  rationale: ἀκολουθέωと与格目的語の関係を、標準的な日本語の表現で訳した。
- source_word: οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: 彼の声を知っている
  rationale: οἶδαの基本的な意味「知っている」を保持し、声を聞き分ける含意を文脈に委ねた。
theological_decisions:
- issue: 羊飼いの比喩におけるἐκβάλῃの強さ
  choice: 本文では「外へ出す」
  alternative: 「追い出す」または「外へ連れ出す」
  rationale: 語には強く外へ出す意味もあり得るが、ここでは自分の羊を囲いから出して先導する場面である。本文は強制性を過度に読み込まず、語義の幅を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、羊飼いの情景が自然に浮かぶようにした。「彼」は直前の文脈にある羊飼いを指す。文末の理由節は原文の因果関係を保つため「からである」とした。
