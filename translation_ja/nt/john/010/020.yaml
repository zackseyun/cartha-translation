  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: ja
  text: しかし、彼らのうち多くの者はこう言っていた。「彼は悪霊に取りつかれ[a]、正気を失っている。なぜ彼の言うことを聞くのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳、「彼は悪霊を持っている」。
    reason: Δαιμόνιον ἔχειの字義的表現を示しつつ、本文では現代日本語として自然な慣用表現を用いるため。
lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了時制が示す継続的または反復的な発言を、自然な日本語で表した。
- source_word: δὲ
  choice: しかし
  rationale: 直前の反応との対照を明確に表す。
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: 彼らのうち多くの者
  rationale: 部分を示すἐξ αὐτῶνを保ちつつ、自然な日本語にした。
- source_word: Δαιμόνιον ἔχει
  choice: 悪霊に取りつかれて
  rationale: 字義的には「悪霊を持っている」だが、悪霊の支配下にあるとの敵対者の आरोप告を現代日本語で自然に伝える。
- source_word: μαίνεται
  choice: 気が狂っている
  rationale: 正気を失っているという侮蔑的な非難を明確に表し、現代の医学的診断としては提示しない。
- source_word: τί αὐτοῦ ἀκούετε;
  choice: なぜ彼の言うことを聞くのか
  rationale: τίの文脈上の意味を「なぜ」とし、属格を伴うἀκούωの「耳を傾ける」という含意を自然に表した。
theological_decisions:
- issue: イエスに対する敵対的な आरोप告の表現
  choice: 彼は悪霊に取りつかれて、気が狂っている
  alternative: 彼は悪霊を持っていて、狂っている
  rationale: 発言者による中傷であることを文脈に委ね、真偽を説明で解消しない。原文の二つの आरोप告をともに保持しつつ、現代日本語として自然にした。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「気が狂っている」は強い敵対的発言として用いられており、語り手による臨床的評価ではない。
