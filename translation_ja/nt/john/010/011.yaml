  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: ja
  text: 「わたしは良い羊飼いである[a]。良い羊飼いは、羊のために[c]自分の命を差し出す[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立派な羊飼い」とも訳せる。ギリシア語の καλός は、良い、立派な、模範的な、という意味を表し得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「自分の魂を置く」。ここでは、自分の命を自ら差し出すことを意味する慣用表現。
    reason: lexical_alternative
  - marker: c
    text: 「羊のためを思って」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: わたしは～である
  rationale: 明示された代名詞による自己提示を保ちつつ、現代日本語として自然な名詞述語文にした。神名への暗示を訳文で過度に明示しない。
- source_word: ποιμήν
  choice: 羊飼い
  rationale: 文脈の牧者像を直接表す一般的な語であり、「牧師」のような後代の教会職制上の含意を持ち込まない。
- source_word: καλός
  choice: 良い
  rationale: 善良さだけでなく、立派さ、優秀さ、模範性を含み得る語である。「良い」は意味の幅を保ち、よく知られた表現としても自然である。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自分の命
  rationale: この慣用表現で ψυχή は非物質的な「魂」よりも、その人の「命」を指す。再帰的所有関係は日本語で「自分の」とした。
- source_word: τίθησιν
  choice: 差し出す
  rationale: 字義的には「置く」だが、命について用いられるここでは、自発的に命を引き渡す意味を自然な日本語で表す。「捨てる」に伴い得る不用物を放棄する響きを避けた。
- source_word: ὑπὲρ τῶν προβάτων
  choice: 羊のために
  rationale: ὑπέρ の受益的・代理的な幅を狭めず、日本語として簡潔に表した。ギリシア語にない所有代名詞「自分の羊」は補わなかった。
theological_decisions:
- issue: Ἐγώ εἰμι によるイエスの自己提示
  choice: 「わたしは～である」と訳す
  alternative: 「このわたしこそ～である」、または神名への暗示を明示する訳
  rationale: ここでは文法上、述語を伴う自己同定である。強調は認めつつも、この一節だけでは神名との関連を訳文に織り込むほど明示的ではない。
- issue: 羊飼いを修飾する καλός の意味
  choice: 「良い羊飼い」
  alternative: 「立派な羊飼い」「理想の羊飼い」
  rationale: καλός は高潔さや模範性も含み得る。「良い」はその広がりを保持し、特定の解釈に限定しない。
- issue: ὑπὲρ τῶν προβάτων とイエスの死の関係
  choice: 「羊のために」
  alternative: 「羊に代わって」「羊のためを思って」
  rationale: ὑπέρ には代理と受益の含意があり得るが、特定の贖罪論に限定せず、原文の意味の幅を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「である」は宣言的な自己提示にふさわしい。伝統的な「良い羊飼い」を保持しつつ、「命を差し出す」によって自発的な犠牲を自然に表現した。
