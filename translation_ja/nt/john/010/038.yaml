  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: ja
  text: しかし、わたしがそのわざを行うなら、たとえわたしを信じなくても[a]、そのわざを信じなさい。父がわたしのうちにおられ、わたしが父のうちにいることを、あなたがたが知るようになり、知り続けるためです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしを信じる」は、「わたしの言うことを信じる」とも「わたしに信頼を置く」とも受け取れます。ギリシア語は「信じる」に与格の代名詞を伴わせています。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では同じ「知る」という動詞の異なる形が続き、知るに至ることと、その認識が続くことを示していると考えられます。
    reason: aspectual_nuance
lexical_decisions:
- source_word: ποιῶ
  choice: わたしがそのわざを行っている
  rationale: 目的語は原文では省略されているが、直前と後続の「わざ」を受けているため、日本語では文脈上の目的語を補った。現在形の継続的な響きも「行っている」で表した。
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: たとえわたしを信じなくても
  rationale: πιστεύωと与格代名詞の組み合わせは「わたしの言うことを信じる」と「わたしに信頼を置く」の両義を帯びうる。後続の「わざを信じなさい」との対照を保つため、簡潔に「わたしを信じる」とした。
- source_word: τοῖς ἔργοις πιστεύετε
  choice: そのわざを信じなさい
  rationale: イエスのわざが証拠として語るという簡潔な表現を保った。「わざに信仰を置く」という意味に限定せず、原文の与格構文の緊張を残している。
- source_word: ἔργοις
  choice: わざ
  rationale: ヨハネ福音書でイエスの啓示的な行為を表す反復語彙である。「しるし」と意訳せず、σημεῖαとの区別を保った。
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: あなたがたが知り、知り続けるためです
  rationale: 同じ動詞のアオリスト接続法と現在接続法の対比を、認識に至ることとその認識が続くこととして表した。日本語として多少反復的でも、原文のアスペクト上の進展を明示した。
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: 父がわたしのうちにおられ、わたしが父のうちにいる
  rationale: 相互内在を語る反復的なἐνを「うちに」としてそのまま保ち、後代の教理用語や説明的な「一つである」を加えなかった。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 原文は冠詞付きの「父」であり、「わたしの父」と所有表現を補わずに訳した。敬意を示すため、父については「おられ」を用いた。
theological_decisions:
- issue: 父と子の相互内在
  choice: 「父がわたしのうちにおられ、わたしが父のうちにいる」と直訳的な関係表現を保持する。
  alternative: 「父とわたしが一つである」または「父がわたしと結ばれ、わたしも父と結ばれている」
  rationale: 本文は父と子の深い相互内在を述べるが、その意味を後代の教理的定式や単なる一致へ置き換えず、ヨハネ特有の表現と神学的緊張を残した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの発言としての荘重さを保った。「わざ」「うちに」などヨハネ福音書の主要語彙は平易さのために言い換えず、反復を意図的に残した。
