  text: ἐγώ εἰμι ὁ ποιμὴν ὁ καλός, καὶ γινώσκω τὰ ἐμὰ καὶ ⸂γινώσκουσί με τὰ ἐμά⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/014.yaml
  text: I am the good shepherd[a], and I know my own, and my own know me,
translation:
  language: ja
  text: 「わたしは良い羊飼いであり、わたしに属する者たち[a]を知っている。わたしに属する者たちもわたしを知っている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの羊」とも訳せる。ギリシア語では、どちらの節も直訳すると「わたしのもの」となっている。
    reason: 原文の簡潔な所有表現を示すとともに、文脈上可能な「羊」という補いを本文と区別して示すため。
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: わたしは〜である
  rationale: 現在形の明確な自己提示を保ちつつ、ヨハネ福音書の「わたしは〜である」という表現との響きも損なわない。
- source_word: ποιμὴν ὁ καλός
  choice: 良い羊飼い
  rationale: ποιμήνの通常の牧羊の比喩を保ち、後代の教会職制を連想させる「牧師」は避けた。καλόςはここで善良さと模範的なすばらしさを含むが、自然で広い意味を保つ「良い」とした。
- source_word: γινώσκω / γινώσκουσί
  choice: 知っている
  rationale: 単なる識別以上の、人格的で相互的な知識を表せる。二つの節で同じ訳語を用い、原文の対応関係を保った。
- source_word: τὰ ἐμὰ / τὰ ἐμά
  choice: わたしの者たち
  rationale: 文脈上、イエスに属する人々を指すため、日本語で人を指すことが明確になるよう「者たち」とした。同時に、原文がこの節では「羊」を明示せず、二つの節で同じ所有表現を反復する点を保った。
- source_word: καί
  choice: 〜ており／〜も
  rationale: 最初のκαίによる節の連結と、二つ目のκαίが示す相互性を、自然な日本語の接続と「も」で表した。
theological_decisions:
- issue: イエスとイエスに属する者たちとの相互的な関係を、後代の教理用語を持ち込まずに表すこと
  choice: わたしの者たち
  alternative: わたしの羊／わたしに属する者たち
  rationale: 所属と人格的な結びつきを保ちながら、原文がこの節で「羊」を補っていないことを尊重した。「わたしに属する者たち」より簡潔で、二度の同一表現も再現できる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの宣言にふさわしい簡潔で格調ある文体とした。「わたし」を用い、原文の反復と相互性をできるだけ保持した。
