id: JHN.10.19
reference: John 10:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Σχίσμα πάλιν ἐγένετο ἐν τοῖς Ἰουδαίοις διὰ τοὺς λόγους τούτους.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/019.yaml
  text: Because of these words[a], a division arose again among the Jews.
translation:
  language: ja
  text: これらの言葉のために、ユダヤ人たち[a]の間に再び分裂が生じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」、また、ヨハネ福音書の文脈によっては「ユダヤ人指導者たち」とも訳せる。ここではギリシア語に沿って「ユダヤ人たち」としたが、この福音書では、ユダヤ民族全体ではなく、文脈上の特定の人々を指すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: Σχίσμα
  choice: 分裂
  rationale: 人々の反応が二つに割れたことを表す語であり、文脈に即した自然で簡潔な訳。
- source_word: πάλιν
  choice: 再び
  rationale: ヨハネ福音書の物語において、同様の分裂が以前にもあったことを示す反復の副詞。
- source_word: ἐγένετο
  choice: 生じた
  rationale: 分裂という事態が起こったことを表す。日本語では「分裂が生じた」が自然で、出来事としての意味も保つ。
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: ユダヤ人たちの間に
  rationale: ギリシア語の直接的な意味を本文に保つ。一方、ヨハネ福音書のἸουδαῖοιは文脈によりユダヤ地方の人々やユダヤ人指導者層を指し得るため、注で幅を示す。
- source_word: διὰ
  choice: のために
  rationale: 対格を伴い、原因・理由を表す。直前のイエスの言葉が分裂の契機となったことを明確に示す。
- source_word: τοὺς λόγους τούτους
  choice: これらの言葉
  rationale: 直前に語られたイエスの発言を指す。「言葉」は明瞭で自然であり、λόγοιの意味を過度に限定しない。
theological_decisions:
- issue: ヨハネ福音書におけるἸουδαῖοιの指示対象
  choice: 本文では「ユダヤ人たち」とし、注で文脈上の別の可能性を説明する。
  alternative: 「ユダヤ地方の人々」または「ユダヤ人指導者たち」
  rationale: 原文の表現を本文に保ちつつ、この語をユダヤ民族全体への一括した言及と誤解しないようにする。文脈上の幅を一つに決めず、真正な曖昧さを注に残す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、簡潔さと尊厳を保った。「これらの言葉のために」を文頭に置いて原文の因果関係を明示し、「再び分裂が生じた」で語順と出来事性を自然に再現した。
