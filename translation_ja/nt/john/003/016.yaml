id: JHN.3.16
reference: John 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: ja
  text: 神は、このように[b]世を愛された。すなわち、ご自分のひとり子[a]をお与えになった。それは、御子を信じる者がだれも滅びず、永遠の命を持つためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ひとり子」は、「唯一の子」「比類のない子」とも訳せる。伝統的には「ただひとり生まれた子」とも訳されてきた。
    reason: alternative_reading
  - marker: b
    text: 「神は世をそれほど深く愛された」とも訳されてきた。ここでのギリシア語は、御子を与えることによって示された愛のあり方を強調していると理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὕτως
  choice: このように
  rationale: 程度を表す「それほど」よりも、続く御子を与える行為によって神の愛し方が具体的に示されるという用法を自然に表す。
- source_word: γὰρ
  choice: 実に
  rationale: 前の文脈を受ける説明の働きを保ちつつ、この一節だけでも不自然にならない現代日本語とした。
- source_word: ἠγάπησεν ὁ θεὸς τὸν κόσμον
  choice: 神は…世を愛された
  rationale: アオリストを簡潔な過去として訳し、κόσμος の広がりを狭めず「世」とした。主語への敬意は日本語の尊敬表現で示した。
- source_word: ὥστε…ἔδωκεν
  choice: …を与えられたのである
  rationale: ὥστε が示す、愛が具体的に現れた結果・あり方を独立した文で明瞭に表した。
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: ご自分のひとり子
  rationale: μονογενής が示す唯一無二の子としての関係を、伝統的で理解しやすい日本語「ひとり子」で表した。語そのものに出生の仕方を過度に読み込まない。
- source_word: ἵνα
  choice: それは…ためである
  rationale: 目的を示す構文を明確に保った。
- source_word: πᾶς ὁ πιστεύων εἰς αὐτόν
  choice: 御子を信じる者が一人も
  rationale: 代名詞の指示先を日本語で明確にし、πᾶς の包括性を「一人も…なく」という自然な構文で表した。
- source_word: μὴ ἀπόληται
  choice: 滅びることなく
  rationale: ἵνα 以下の否定的目的・結果を保ち、ἀπόλλυμι の重みを限定的に説明しすぎない訳語とした。
- source_word: ἀλλὰ ἔχῃ ζωὴν αἰώνιον
  choice: 永遠の命を持つ
  rationale: ἀλλά の対照は日本語の「…なく、…」で自然に示し、ἔχω は解釈を加えず「持つ」とした。
theological_decisions:
- issue: Οὕτως の意味
  choice: 愛の仕方を示す「このように」
  alternative: 愛の程度を示す「それほど」
  rationale: ὥστε 以下の御子を与える行為が、神が世を愛された具体的なあり方を説明すると読むのが統語と文脈に適う。ただし程度の含意を完全に否定するものではないため脚注で伝統訳を示した。
- issue: μονογενής の訳
  choice: ひとり子
  alternative: 独り子／唯一の子／ただひとり生まれた子
  rationale: 御子の唯一無二性と父との子としての関係を簡潔に保持する。「生まれた」を本文に加えて語源的・教理的説明を先取りすることは避けた。
- issue: πᾶς ὁ πιστεύων の範囲
  choice: 信じる者が一人も…なく
  alternative: 信じるすべての者が／信じる者はだれでも
  rationale: 包括的で一般的な表現を保ち、選び、人間の応答、贖罪の範囲をめぐる後代の体系を本文に持ち込まない。
- issue: ἵνα 節の様態
  choice: 目的を表す「ためである」
  alternative: 結果を強める「ことになるため」
  rationale: 接続法を伴う目的構文として訳し、救いが単なる自動的結果であるかのような表現も、不確実性を不必要に強調する表現も避けた。
translation_notes:
  register: 明瞭で格調ある現代標準語。神に関する動詞には自然な尊敬表現を用いた。「御子」は直前の「ひとり子」を受ける指示表現として採用した。脚注記号は関連語の直後または節末に置き、本文にすべて表示した。
