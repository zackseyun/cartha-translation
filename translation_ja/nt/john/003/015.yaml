  text: ἵνα πᾶς ὁ πιστεύων ⸂ἐν αὐτῷ⸃ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/015.yaml
  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: ja
  text: それは、彼を信じる者はだれでも、永遠の命を持つためである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「彼を信じる」に当たる箇所でἐν αὐτῷ（直訳すれば「彼のうちで／彼にあって」）を用いており、εἰς αὐτόν（「彼の中へ」）ではない。本文では日本語として自然な表現にしている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: それは、〜ためである
  rationale: 前節の内容を受ける目的・結果の節として、ἵναの働きを明確で自然な現代日本語にした。
- source_word: πᾶς ὁ πιστεύων
  choice: 信じる者が皆
  rationale: 冠詞付き現在分詞の一般的・包括的な範囲を保ちつつ、日本語として自然に表した。「信じる者はだれでも」も可能だが、ここではπᾶςを「皆」として明示した。
- source_word: πιστεύων
  choice: 信じる
  rationale: ヨハネ文書におけるπιστεύωの標準的で透明な訳語を採用し、原文にない継続性の強調は加えなかった。
- source_word: ἐν αὐτῷ
  choice: 彼を信じる
  rationale: 日本語では「彼にあって信じる」は不自然で意味も曖昧になるため、信仰の対象を表す自然な格助詞「を」を用いた。底本がεἰςではなくἐνであることによる曖昧さは、解釈を過度に主張せず、通常の日本語の信仰表現にした。
- source_word: ἔχῃ
  choice: 持つ
  rationale: ἵναに従う接続法は日本語では目的構文そのものによって表されるため、「持つことができる」などの可能・不確実性を付加しなかった。
- source_word: ζωὴν αἰώνιον
  choice: 永遠の命
  rationale: ヨハネ福音書の神学的用語として定着し、時間的永続性と来るべき時代に属する命の質を簡潔に伝える。表記は現代的な「命」とした。
theological_decisions:
- issue: ἐν αὐτῷを伴う信仰表現
  choice: 彼を信じる
  alternative: 彼にあって信じる／彼のうちで信じる
  rationale: 原文の前置詞はἐνであり、より頻出するεἰςを原文に読み込むべきではない。ただし日本語で前置詞を逐語的に再現すると、信仰の対象ではなく場所・領域を意味するように響くため、本文では自然な「彼を信じる」とした。
- issue: πᾶς ὁ πιστεύωνの範囲
  choice: 信じる者が皆
  alternative: 信じる者はだれでも
  rationale: 性別を限定しない一般的・包括的な単数表現であることを保ち、「皆」によってπᾶςの範囲を明示した。
- issue: ἵνα節と救いの確実性
  choice: 持つためである
  alternative: 持つことができるためである
  rationale: 接続法を可能性や不確実性として神学的に過剰解釈せず、目的節として訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。単独節としても読めるよう「それは」で前文との目的関係を示した。固有の異読注や説明が不可欠ではないため脚注は付していない。
