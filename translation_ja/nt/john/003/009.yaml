  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: ja
  text: ニコデモは答えた。「これらのことが、どのようにして起こり得るのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ
  choice: ニコデモは答えて言った
  rationale: 「答えて言った」は重複感が多少あるものの、対話上の応答を示すἀπεκρίθηと、発言を導入するεἶπεν αὐτῷを簡潔に反映する。日本語では相手が文脈上明らかなため、「彼に」を明示しなくても意味は保持される。
- source_word: Πῶς δύναται
  choice: どうして…起こり得るのですか
  rationale: Πῶςの方法・可能性を問う働きと、δύναταιの可能性を自然な現代日本語で表す。丁寧体はニコデモがイエスに向けて語る場面に適する。
- source_word: ταῦτα
  choice: そのようなこと
  rationale: 直前にイエスが述べた複数の事柄を受ける指示表現。日本語では「これらのこと」より「そのようなこと」が自然で、複数内容を集合的に指せる。
- source_word: γενέσθαι
  choice: 起こる
  rationale: γίνομαιの出来事が生じる、実現するという文脈上の意味を自然に表す。「ある」と断定的に平板化せず、どのように実現するのかという問いを保つ。
theological_decisions:
- issue: 新しく生まれることをめぐるニコデモの問いの含意
  choice: どうして、そのようなことが起こり得るのですか
  alternative: どうして、そのようなことがあり得るのですか／どうして、これらのことが実現するのですか
  rationale: γίνομαιを「起こる」とし、出来事の生起・実現について問う響きを保つ。「あり得る」だけにすると存在可能性へ寄り、「実現する」とすると結果性を強めるため、本文では中立的な表現を選ぶ。
translation_notes:
  register: 明瞭な現代標準日本語。対話として自然な丁寧体を用いながら、聖書本文にふさわしい簡潔で落ち着いた調子を保った。
