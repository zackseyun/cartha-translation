  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: ja
  text: その方の証言を受け入れた者は、神が真実であることを確かなものとした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では、「『神は真実である』ということに印を押した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: 受け入れた者
  rationale: 定冠詞を伴うアオリスト分詞を実質的な名詞として取り、証言を受け入れた人を一般的に指す表現とした。
- source_word: αὐτοῦ
  choice: その方の
  rationale: 文脈上、天から来られた方、すなわち御子を指す。「その方」は指示対象を自然に示しつつ敬意ある現代日本語となる。
- source_word: μαρτυρίαν
  choice: 証言
  rationale: ヨハネ文書に見られる証言・証しの法廷的な含みを保ち、受け入れる対象としても自然である。
- source_word: ἐσφράγισεν
  choice: 確証を与えた
  rationale: 原義は「印を押した」だが、ここでは真実であると正式に認め、保証する比喩的意味を表す。本文では意味を明確にし、字義的表現は脚注に残した。
- source_word: ὅτι
  choice: ことに
  rationale: 原因ではなく、確証を与える内容を導く接続詞として訳した。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 定冠詞を伴う明確な主語であり、補足を加えず簡潔に訳した。
- source_word: ἀληθής
  choice: 真実である
  rationale: 神が真理にかなっており、語ることに偽りがなく信頼できるという意味を保つ。「真実な方」と限定せず、原文の述語形を反映した。
theological_decisions:
- issue: 「封印する」という比喩の扱い
  choice: 本文では「確証を与えた」とする
  alternative: 「神が真実であることに印を押した」
  rationale: 証言を受け入れることが神の真実性を認めて保証する行為となる、という比喩の機能を明瞭に伝える一方、原文の封印のイメージは脚注で保存した。
- issue: ἀληθήςの意味の幅
  choice: 「真実である」
  alternative: 「真実を語る方である」または「信頼できる」
  rationale: 文脈には神の真実性・信頼性が含まれるが、原文は意味を一つに狭めていないため、広い響きを持つ表現を採用した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「その方」は直前の文脈にある御子を指す。原文の封印の比喩は本文で意味を伝え、脚注で字義を示した。
