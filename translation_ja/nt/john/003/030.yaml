  text: ἐκεῖνον δεῖ αὐξάνειν, ἐμὲ δὲ ἐλαττοῦσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/030.yaml
  text: He must increase[a], but I must decrease.
translation:
  language: ja
  text: あの方は大きくならなければならない。しかし、私は小さくならなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνον
  choice: あの方は
  rationale: 文脈上イエスを指す指示代名詞であり、日本語では敬意を保ちつつ自然に「あの方」とした。ギリシア語の対格は不定詞の意味上の主語であるため、主題を示す「は」で訳した。
- source_word: δεῖ
  choice: ならなければならない
  rationale: 必要性を表す語。必要の性質を神的必然と明示して限定せず、原文の強い必要性を自然な日本語で保った。
- source_word: αὐξάνειν
  choice: ますます大きくなり
  rationale: 継続的な増大を表し、人数だけでなく立場、影響、顕現の拡大を含み得る幅を保った。「ますます」は現在不定詞の進行的な対比を自然に示す。
- source_word: ἐμὲ
  choice: 私は
  rationale: 不定詞の意味上の主語であり、ἐκεῖνονとの明瞭な対照を日本語の「私は」で示した。
- source_word: δὲ
  choice: （対照的な並列）
  rationale: 二つの節の対照は「は」と読点による簡潔な並列で自然に表した。日本語では「しかし」を加えるより、格言的な均衡が保たれる。
- source_word: ἐλαττοῦσθαι
  choice: ますます小さくならなければならない
  rationale: 「より小さくなる、少なくなる」という変化を表す。前半との簡潔な対句を保ちつつ、ヨハネの身体的縮小などに狭めず、立場や働きが退く意味を含み得る表現とした。
theological_decisions:
- issue: δεῖが表す必要性の性質
  choice: 「ならなければならない」とし、強い必要性を保つ
  alternative: 単なる成り行き、または明示された神の決定と訳す
  rationale: 救いの歴史における神的な必然性を響かせ得るが、本文はその仕組みを明示しない。そのため、必要性を弱めず、同時に説明を加えて限定しない。
- issue: 「大きくなる／小さくなる」の範囲
  choice: 比喩的意味を説明文として本文に補わない
  alternative: 「栄えなければならない／衰えなければならない」など、名声や働きに意味を限定する
  rationale: 文脈ではイエスの働きとヨハネの働きの対照を指すが、原文の広く簡潔な比喩と神学的余韻を保った。
translation_notes:
  register: 明瞭な現代標準日本語。簡潔で格言的な対句を保ち、「あの方」によって文脈上のイエスへの敬意を自然に表した。脚注標識[a]は本文に付した。
