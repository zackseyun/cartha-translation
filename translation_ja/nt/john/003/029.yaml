id: JHN.3.29
reference: John 3:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: ja
  text: 花嫁を迎える者が花婿である。花婿の友人は、立って彼の声を聞き、その声のゆえに大いに喜ぶ[a]。それで、私のこの喜びは満たされた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「喜びをもって喜ぶ」。喜びの大きさを強調する表現。
    reason: lexical_alternative
  - marker: b
    text: 「完全なものとなった」または「満ちた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: 花嫁を迎える者
  rationale: 直訳的な「花嫁を持つ者」は現代日本語では所有の響きが不自然に強いため、婚礼の関係を自然に表す「迎える」を用いた。主語の一般的・比喩的な性格は保っている。
- source_word: νυμφίος
  choice: 花婿
  rationale: νύμφη（花嫁）との対照を明確にし、婚礼の比喩を一貫して保つ標準的な訳語。
- source_word: ὁ φίλος τοῦ νυμφίου
  choice: 花婿の友人
  rationale: 原文は文化的役職名ではなく「花婿の友人」と述べるため、「介添人」などに限定せず形式的に明瞭な訳とした。
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: そばに立って花婿の声を聞き
  rationale: 完了分詞の継続的な立ち位置を「そばに立って」で自然に表した。αὐτοῦは本来「彼を聞く」だが、日本語では後続の「花婿の声」を取り込むことで重複を避け、場面を明瞭にした。
- source_word: χαρᾷ χαίρει
  choice: 大いに喜ぶ
  rationale: 同根名詞と動詞による強調を、自然な日本語の程度表現で伝えた。直訳的には「喜びをもって喜ぶ」とも訳せる。
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: その声のゆえに
  rationale: διά＋対格の原因・理由を「ゆえに」で保持した。直前に「花婿の声」と明示したため、反復は代名詞で自然に整理した。
- source_word: αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ
  choice: それで、私のこの喜び
  rationale: οὖνの推論・帰結を「それで」で自然に示し、αὕτηと所有表現の強調を「私のこの喜び」に保った。
- source_word: πεπλήρωται
  choice: 満ちた
  rationale: 完了受動形が示す、喜びが十分な状態へ至った結果を簡潔に表す。「完全なものとなった」「満たされた」も可能である。
theological_decisions:
- issue: 婚礼の比喩と洗礼者ヨハネの位置づけ
  choice: 花婿、花嫁、花婿の友人という比喩をそのまま保ち、花嫁が具体的に誰を指すかは本文で特定しない。
  alternative: 花嫁を「教会」または「神の民」と明示し、友人を特定の婚礼役職名で訳す。
  rationale: この節自体は花嫁の指示対象を説明せず、φίλοςも役職名に限定していない。後代の教会論や特定の婚礼習慣を本文へ読み込まず、解釈の余地を保つ。
- issue: πεπλήρωταιにおける完成と成就
  choice: 「満ちた」と訳し、喜びが充満・完成した結果状態を表す。
  alternative: 「成就した」と訳し、預言や計画の実現を前面に出す。
  rationale: 文脈上、主語は「私の喜び」であり、語は満たされることと完成されることの双方を含み得る。「満ちた」は不要な預言成就の含意を避けつつ比喩的な充満を伝える。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、婚礼の比喩にふさわしい品位を保った。「花嫁を持つ」は所有物のように響くため避け、「花嫁を迎える」とした。「ゆえに」は因果関係を端的かつ格調を損なわず示す表現として採用した。
