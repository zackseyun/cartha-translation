  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: ja
  text: 上から来られる方は、すべてのものの上におられる[a]。地に由来する者は、地に由来し、地から語る[b]。天から来られる方は、すべてのものの上におられる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上から」は「天から」とも訳せる。ギリシア語は上方からの起源を表し、後の「天から」という句によってその意味が明確にされる。
    reason: lexical_alternative
  - marker: b
    text: 「地のことを語る」とも訳せる。ギリシア語は直訳すると「地から」を繰り返しており、発言の源・領域・内容を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: 上から
  rationale: ここでは反復の「再び」ではなく、来る方の起源を示す。後半の「天から」と呼応しつつ、原文の異なる表現を保つ。
- source_word: ἐρχόμενος
  choice: 来られる方
  rationale: 冠詞付き現在分詞を自然な日本語の名詞句とし、この方への敬意を表す通常の聖書文体を用いた。
- source_word: ἐπάνω πάντων
  choice: すべてのものの上におられる
  rationale: 空間的な比喩と卓越・至高の意味をともに保ち、原文で二度繰り返される表現も同じ訳にした。πάντωνは文法上、中性にも男性にも解し得るため、包括的な「すべてのもの」とした。
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: 地から出た者
  rationale: 地的な起源を示すἐκを明確にしつつ、日本語として過度にぎこちない「地から存在する者」を避けた。
- source_word: γῆ
  choice: 地
  rationale: ここでは天と対照される地上の領域を指す。「大地」や「土地」より簡潔で、反復にも耐える語を選んだ。
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: 地に属し
  rationale: 直訳的な「地からである」は日本語では不自然なため、地に由来する性質・領域を示す「属する」とした。直前と直後の「地」を残し、原文の三重の反復を保持した。
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: 地から語る
  rationale: ἐκの反復を保持し、語る内容、源、領域のいずれを強調するかを本文で限定しない。
- source_word: οὐρανός
  choice: 天
  rationale: 物理的な空ではなく、地と対照される天的・神的領域を指すため。
theological_decisions:
- issue: 「上から」と「天から」の関係
  choice: ἄνωθενを「上から」、ἐκ τοῦ οὐρανοῦを「天から」と訳し分けた。
  alternative: 両方を「天から」と訳す。
  rationale: 両表現の密接な並行関係を示しながら、原文の語彙上の違いを保つ。後半が前半の意味を明確にする構造も残る。
- issue: 地に関する表現の反復
  choice: 「地」を三度明示し、「地から出た者は地に属し、地から語る」とした。
  alternative: 「地に属する者は地上的なことを語る」など、一つの説明的表現にまとめる。
  rationale: 原文のἐκ τῆς γῆςの反復は、天的起源との対照を強調するため、滑らかさのために削らない。ただし日本語の明瞭さのため中央のみ「地に属し」とした。
- issue: ἐπάνω πάντωνの範囲
  choice: 「すべてのものの上」とした。
  alternative: 「すべての人の上」または「何ものにもまさる」とする。
  rationale: πάντωνが人だけを指すか、万物を含むかを狭く限定せず、原文の包括性と至高性を保つ。
translation_notes:
  register: 明瞭で現代的ながら尊厳のある標準語。「来られる方」「おられる」により対象への敬意を示し、地から出た人間には通常形を用いた。原文の対句と反復をできる限り保ち、曖昧さは脚注で提示した。
