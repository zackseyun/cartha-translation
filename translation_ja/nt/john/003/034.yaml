id: JHN.3.34
reference: John 3:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: ja
  text: 神が遣わした方は、神のことばを語る。神は御霊を限りなく与えるからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「神が遣わした方は、神のことばを語る。その方は御霊を限りなく与えるからである。」ギリシア語では「与える」の主語が明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: ὃν
  choice: …方
  rationale: 男性単数の関係代名詞を、神に遣わされた人物を指す自然で敬意ある日本語として表した。
- source_word: ἀπέστειλεν
  choice: 遣わした
  rationale: アオリストの事実叙述を簡潔な過去形で訳し、ヨハネ文書に特徴的な「遣わす」という表現を保った。
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: 神のことば
  rationale: 複数形ῥήματαは個々の発言を含むが、日本語では集合的な「ことば」が自然であり、神に由来する発言という属格の関係も明確である。
- source_word: λαλεῖ
  choice: 語る
  rationale: 継続的・一般的に話すことを表し、現代日本語として自然でありながら聖書本文にふさわしい品位を保つ。
- source_word: οὐ … ἐκ μέτρου
  choice: 限りなく
  rationale: 直訳的な「量って…ない」が意味する、制限された分量ではないことを自然な日本語で表した。
- source_word: δίδωσιν
  choice: 与える
  rationale: 現在形の一般的な陳述を、最も直接的な日本語で表した。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: ヨハネの文脈では神の霊を指すため、人格的・神的な指示対象が伝わる標準的な聖書語を採用した。
theological_decisions:
- issue: δίδωσιν（「与える」）の省略された主語
  choice: 神を主語として「神は御霊を限りなく与える」と本文に明示した。
  alternative: 神が遣わした方（御子）が御霊を限りなく与える。
  rationale: 直前の明示的な行為者である神と、遣わされた方が神のことばを語る理由を述べる文脈は、神がその方に御霊を限りなく与えるとの理解を支持する。しかしギリシア語では主語が明示されず、遣わされた方を主語とする解釈も文法上可能なので脚注に残した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「方」で遣わされた者への敬意を示し、「御霊」は一般読者にも聖霊を指すと分かる伝統的表現として用いた。主節と理由節を二文に分け、論理関係を読み取りやすくした。
