id: JHN.3.21
reference: John 3:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: ja
  text: しかし、真理を行う者[a]は光のもとに来る。その人の行いが神にあってなされたことが明らかにされるためである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「真理を実践する」、または「真実なことを行う」とも訳せる。ギリシア語は直訳すると「真理を行う」。
    reason: lexical_alternative
  - marker: b
    text: 「その人の行いが明らかにされる。なぜなら、それらは神にあってなされたからである」とも訳せる。ここでの接続詞は、明らかにされる内容を導くとも、その理由を導くとも理解できる。また「神にあって」は、「神によって」または「神を通して」という含みを持つ可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: しかし、真理を行う者
  rationale: δέによる前節との穏やかな対比を「しかし」で示した。冠詞付き現在分詞は、その行為を特徴とする人を表すため「行う者」とした。「真理を行う」というヨハネ的で意図的な表現を保ち、単に「正しいことをする」と狭めなかった。
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: 光のもとに来る
  rationale: 移動の方向を示すπρόςを反映しつつ、現代日本語として自然な表現にした。「光の中に入る」として到達状態を強調しすぎない。
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: その人の行いが…明らかにされるため
  rationale: ἵναの目的の意味とφανερωθῇの受動態を保った。ἔργαは文脈に自然な「行い」とし、善悪の評価を語そのものに付加しなかった。
- source_word: ὅτι
  choice: …ことが
  rationale: 何が明らかにされるのかという内容を導く接続詞として解した。ただし理由を示す「…ので」と取る可能性も脚注に残した。
- source_word: ἐν θεῷ
  choice: 神にあって
  rationale: 神との関係・領域・働きを含み得るἐνの開かれた表現を保った。「神によって」と限定して手段・行為者だけに解することを避けた。
- source_word: ἐστιν εἰργασμένα
  choice: なされた
  rationale: 完了受動の結果的意味を文脈上自然な日本語で表した。「神にあってなされたことが明らかにされる」という構文により、行いの成立とその現存する結果を示す。
theological_decisions:
- issue: ποιῶν τὴν ἀλήθειαν の慣用表現
  choice: 真理を行う
  alternative: 真理を実践する／真実なことを行う
  rationale: やや特徴的な日本語ではあるが理解可能であり、真理が認識されるだけでなく行為として現れるというヨハネ的な含みを保持する。
- issue: ὅτι の機能
  choice: 明らかにされる内容を導く
  alternative: 行いが明らかにされる理由を導く
  rationale: 「その行いが神にあってなされたことが明らかにされる」と取ると、φανερωθῇに続く内容としてよく通る。ただしギリシア語は理由の解釈も許すため、脚注で明記した。
- issue: ἐν θεῷ の意味
  choice: 神にあって
  alternative: 神によって／神を通して
  rationale: 神の領域、神との関係、または神の働きという複数の含みを限定せず、原文の神学的な幅を保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「真理を行う」と「神にあって」は原文の特徴と神学的な開放性を保つために採用し、必要な説明を脚注に置いた。
