id: JHN.3.10
reference: John 3:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: ja
  text: イエスは彼に答えて言われた。「あなたはイスラエルの教師でありながら、これらのことが分からないのですか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イスラエルの一教師」とも訳せる。ギリシア語は「その教師」と定冠詞を用いており、ここでは問いかけに鋭い修辞的な響きを与えていると思われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν αὐτῷ
  choice: 彼に答えて言われた
  rationale: 二つの動詞から成るギリシア語の応答表現を保ちつつ、現代日本語として通じる形にした。イエスへの敬意を表すため「言われた」とした。
- source_word: Σὺ
  choice: あなたは
  rationale: 明示された代名詞の強調を、文頭の「あなたは」によって表した。
- source_word: ὁ διδάσκαλος τοῦ Ἰσραὴλ
  choice: イスラエルの教師
  rationale: 定冠詞の限定的・強調的な響きと、属格「イスラエルの」を簡潔に保った。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前までの教えを広く指す複数の指示語を自然に表した。
- source_word: οὐ γινώσκεις
  choice: 分からないのですか
  rationale: ここでの γινώσκω は単なる知識の有無より、教えを理解・把握することを問うため、日本語では「分からない」が自然である。疑問の詰問的な力も保つ。
theological_decisions:
- issue: ὁ διδάσκαλος τοῦ Ἰσραὴλ における定冠詞の力
  choice: 「イスラエルの教師」とし、代表的・著名な教師への指摘として読める形を保つ
  alternative: 「イスラエルの一教師」または「イスラエルの教師の一人」
  rationale: ギリシア語は定冠詞を用いており、単に教師の一人であること以上の、鋭い修辞的な響きを持つ可能性が高い。ただし、唯一の教師という教理的主張までは訳文に加えない。
- issue: καὶ を含む対比の表現
  choice: 「教師でありながら」
  alternative: 「教師であって、それでも」または「教師なのに」
  rationale: イスラエルの教師という立場と理解していないこととの意外な対照を、明瞭で品位ある現代日本語で示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、対話の厳粛さとイエスの鋭い問いかけを保った。「なのに」よりも品位のある「でありながら」を採用した。
