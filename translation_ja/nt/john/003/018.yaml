  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: ja
  text: その方を信じる者は裁かれない[a]。しかし、信じない者はすでに裁かれている。神の唯一の御子[b]の名を信じていないからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪に定められない」とも訳せる。ここで「裁く」と訳したギリシア語は、文脈により有罪の宣告や断罪を意味しうる。後半の「裁かれている」も同じ動詞である。
    reason: lexical_alternative
  - marker: b
    text: 「ただひとりの御子」とも訳せる。伝統的には「ひとり子」。ギリシア語は、その御子が比類のない、唯一の方であることを表す。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: この方を信じる者
  rationale: 冠詞付き現在分詞の一般的・継続的な意味を自然な日本語で表し、πιστεύω εἰς が示す人格的な信頼の方向も保った。文脈上の指示対象を明確にするため αὐτόν は「この方」とした。
- source_word: οὐ κρίνεται
  choice: 裁かれない
  rationale: κρίνω の基本的な司法語義を保ち、「罪に定められない」と限定しすぎない。ヨハネ3章17–19節では不利な裁きの含みがあるが、原語が持つ幅を本文に残した。
- source_word: ὁ δὲ μὴ πιστεύων
  choice: しかし、信じない者
  rationale: δέ の対照を「しかし」で示し、冠詞付き分詞を自然な名詞句として訳した。
- source_word: ἤδη κέκριται
  choice: すでに裁かれている
  rationale: 完了形が示す、すでに成立し現在も続く状態を「裁かれている」で表した。
- source_word: ὅτι μὴ πεπίστευκεν
  choice: 信じていないからである
  rationale: ὅτι の理由を明示し、完了形が表す現在に至る不信の状態を「信じていない」とした。
- source_word: εἰς τὸ ὄνομα
  choice: 名を信じて
  rationale: 「名」という具体的表現を保持した。ここでの名はその方の啓示された人格・権威を含むが、本文では説明的に展開しなかった。
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: 神のただひとりの御子
  rationale: μονογενής が示す比類のない唯一性を、現代日本語で誤解の少ない「ただひとりの」として表した。「御子」は尊厳を保ちつつ一般の聖書読者にも理解される語である。
theological_decisions:
- issue: κρίνω の訳語
  choice: 二つの用例をともに「裁く」で統一する
  alternative: 「罪に定める」
  rationale: 文脈には有罪宣告・断罪の含みがある一方、κρίνω 自体の語義の幅とヨハネ3章18–19節の「裁き」とのつながりを保つため、より直接的な「裁く」を採用した。
- issue: μονογενής の訳し方
  choice: ただひとりの
  alternative: 唯一の／ひとり子
  rationale: 御子の唯一無二性を明確にしつつ、語そのものに後代の教理用語を過度に読み込まないようにした。伝統的な訳は脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、断定的で荘重な聖書本文の調子を保った。「裁く」は原語の語義的な幅を残し、「ただひとりの御子」は自然さと神学的慎重さを両立させた。
