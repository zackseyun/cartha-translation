id: JHN.3.7
reference: John 3:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: ja
  text: 私があなたに[b]、『あなたがたは上から[a]生まれなければならない』と言ったことに、驚いてはならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上から」に当たるギリシア語は、「再び」または「新たに」という意味にも取れる。そのため、「もう一度生まれなければならない」とも訳せる。
    reason: alternative_reading
  - marker: b
    text: ギリシア語では、「あなたに」は単数だが、「あなたがたは」は複数である。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: 驚いてはならない
  rationale: μήとアオリスト接続法による禁止を、現代日本語で自然かつ明確に表す。θαυμάζωの驚嘆の意味を保ちつつ、古風な表現を避けた。
- source_word: ὅτι
  choice: ～と言ったことに
  rationale: イエスが語った内容を含む事実が驚きの対象であることを、日本語として自然に示す。理由を表す「だから」と断定しない。
- source_word: εἶπόν σοι
  choice: 私があなたに～と言った
  rationale: σοιが単数であることを「あなたに」で明示し、直接の語りかけを自然な日本語で表した。
- source_word: Δεῖ
  choice: ～なければならない
  rationale: 必要性を表すδεῖの強さを保つ、明瞭で一般的な日本語表現。
- source_word: ὑμᾶς
  choice: あなたがた
  rationale: 複数形を本文で明示し、直前の単数形σοιとの対照を保持した。
- source_word: γεννηθῆναι
  choice: 生まれなければ
  rationale: 受動不定詞γεννηθῆναιを、この文脈で自然な「生まれる」と訳した。「もうけられる」は日本語では不自然で、意味を誤解させやすい。
- source_word: ἄνωθεν
  choice: 上から
  rationale: ヨハネ文書に見られる天的起源の含意を保つ。一方で「再び／新たに」という真正な多義性は脚注に残した。
theological_decisions:
- issue: 新しい誕生についてのἄνωθενの意味
  choice: 上から
  alternative: 再び／新たに
  rationale: ヨハネ福音書の用法と神に由来する誕生という文脈から、本文では「上から」を採用した。ただし、ニコデモとの対話を成り立たせる「再び」という意味も排除せず、脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あなた」と「あなたがた」を使い分け、原文の数の対照を本文でも見える形にした。語順は日本語として読みやすく整えつつ、禁止、必要性、ἄνωθενの多義性を保持した。
