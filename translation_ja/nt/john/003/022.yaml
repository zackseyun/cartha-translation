id: JHN.3.22
reference: John 3:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: ja
  text: その後、イエスは弟子たちとユダヤ地方へ行き、そこで彼らとしばらく過ごしながら、洗礼を授けていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 4章2節では、実際に洗礼を授けていたのはイエス自身ではなく、弟子たちだったと補足されている。
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: その後
  rationale: 複数形を逐語的に「これらのことの後」とせず、ヨハネの物語の時間的推移を自然な現代日本語で示す。
- source_word: ἦλθεν
  choice: 行き
  rationale: 原語は「来た」とも訳せるが、直前の場面から目的地であるユダヤ地方への移動を日本語の物語として自然に表す。
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: ユダヤ地方へ
  rationale: γῆはここでは土地・地域を指す。「ユダヤの地へ」も可能だが、明瞭で自然な「ユダヤ地方へ」とした。
- source_word: διέτριβεν μετ’ αὐτῶν
  choice: そこで彼らとしばらく過ごしながら
  rationale: 未完了過去の継続性と、διατρίβωが表す一定期間の滞在・時を過ごす意味を自然に示す。
- source_word: ἐβάπτιζεν
  choice: 洗礼を授けていた
  rationale: 宗教的行為として定着した中立的な表現を用い、未完了過去の継続性を「ていた」で表す。洗礼の方式は特定しない。
theological_decisions:
- issue: 洗礼を授けていた主体とヨハネ4章2節との関係
  choice: 本文では文法上の主語であるイエスが洗礼を授けていたという形を保持する。
  alternative: 弟子たちが洗礼を授けていたと本文中で明示する。
  rationale: 単数動詞ἐβάπτιζενの主語は文脈上イエスである。4章2節は、実際に洗礼を施したのは弟子たちだったと後に補足するため、この節自体の文法を改変せず脚注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「その後」「ユダヤ地方」で不自然な直訳調を避けつつ、「彼らと」と洗礼の文法上の主語を残し、原文の構造と後続節との緊張を保った。
