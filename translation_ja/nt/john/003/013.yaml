  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: ja
  text: 天に上った者はだれもいない。天から下って来た者、すなわち人の子を除いては。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天から降って来た者」。
    reason: lexical_alternative
  - marker: b
    text: 「人の子」は、イエスが特徴的に用いた自己呼称であり、ダニエル書7章13～14節への響きをもつ。
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: だれも…いない
  rationale: 日本語で全否定を自然かつ明確に表し、対象を不必要に男性へ限定しない。
- source_word: ἀναβέβηκεν
  choice: 上った者はいない
  rationale: 完了形の、成立した行為が現在の主張に関わる含みを文全体で保ちつつ、自然な現代日本語にした。
- source_word: εἰς τὸν οὐρανόν
  choice: 天に
  rationale: 上昇の到達先を簡潔に示し、後続する「天から」との対照を保つ。
- source_word: εἰ μὴ
  choice: ただ…だけである
  rationale: 先行する全否定に対する唯一の例外を、自然な日本語で明示する。
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: 天から下って来た者
  rationale: 冠詞付き分詞句を名詞的に訳し、「上った」との上下の対照を保つ。「下って来た」は話者側への移動を自然に表す。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書におけるイエスの特徴的な自己呼称として定着した訳語を用い、ダニエル書との響きを保持する。
theological_decisions:
- issue: 「人の子」のキリスト論的な意味
  choice: 「人の子」という定着した呼称をそのまま用いる。
  alternative: 「人間である者」「人間の子」などと説明的に言い換える。
  rationale: この句が持つ日常語的背景と黙示的・称号的な響きの両方を残し、一方に限定して解釈しないため。
- issue: 昇天・降下表現の時間的および神学的含意
  choice: 「上った」「天から下って来た」と訳し、天上からの由来と唯一性の主張を本文どおり保つ。
  alternative: 先在や昇天の時点を説明する語句を補う。
  rationale: 原文の強いキリスト論的主張は保持するが、その時間関係や教理的体系を訳文の中で補足しないため。
- issue: 例外句と「人の子」の同定
  choice: 「すなわち」を用いて、天から下った者が人の子であることを明確にする。
  alternative: 同格を読点またはダッシュだけで示す。
  rationale: ギリシア語の同格関係を自然な日本語で明瞭にしつつ、新たな解釈内容は加えないため。
translation_notes:
  register: 明快な現代標準語を用いながら、天への上昇と天からの降下の対照、および「人の子」という荘重で聖書間のつながりを持つ表現を保持した。主節は日本語として自然な全否定と例外構文に整えた。
