id: JHN.3.19
reference: John 3:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: ja
  text: 裁きとは、こういうことです。光が世に来て、人々は光よりも闇を愛しました。人々の行いが悪かったからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: 裁き
  rationale: 有罪判決という結果だけに狭めず、評価とその帰結を含み得るヨハネ文書の広い意味を保つ。
- source_word: τὸ φῶς
  choice: 光
  rationale: 文脈上は御子を指すが、原文の比喩を説明語に置き換えず保持する。
- source_word: ἐλήλυθεν
  choice: 来た
  rationale: ギリシア語完了形は到来とその現在的結果を示す。日本語では「世に来た」が自然であり、後続の「のに」によって今なお光が現れている含意も文脈上保たれる。
- source_word: κόσμον
  choice: 世
  rationale: ヨハネ福音書に定着した自然な聖書語で、世界とそこに生きる人間社会の双方を含み得る。
- source_word: οἱ ἄνθρωποι
  choice: 人々
  rationale: 男性だけでなく人間一般を指すため、現代日本語で自然かつ正確な包括表現とした。
- source_word: ἠγάπησαν
  choice: 愛しました
  rationale: 単に「好んだ」とせず、ἀγαπάωの強い道徳的・意志的な結びつきを保持する。
- source_word: μᾶλλον ... ἢ
  choice: 光よりも闇を
  rationale: 比較的選好を自然な日本語の語順で表す。
- source_word: τὸ σκότος
  choice: 闇
  rationale: 「光」と対をなすヨハネ特有の象徴表現を保持する。
- source_word: πονηρὰ
  choice: 悪かった
  rationale: 行いの道徳的な悪を明瞭に示し、「よくなかった」より弱めない。
- source_word: τὰ ἔργα
  choice: 行い
  rationale: 人の具体的な行為を指す現代日本語として「業」より自然で、意味も明瞭である。
theological_decisions:
- issue: 「光」の指示対象
  choice: 比喩のまま「光」とした。
  alternative: 「イエス」または称号としての「光」と明示する。
  rationale: 文脈は御子を強く示唆するが、本文は比喩を用いているため、その神学的な厚みと間接性を保った。
- issue: κρίσις の意味範囲
  choice: 「裁き」とした。
  alternative: 「有罪判決」または「断罪」。
  rationale: この節は裁きの内容・根拠を述べており、結果だけを先取りして狭く限定しないため。
- issue: ὅτι 以下と逆接的含意
  choice: 「光が世に来たのに」とした。
  alternative: 形式的に「光が世に来て、人々は……」と並列する。
  rationale: 原文の καί は形式上並列だが、光の到来にもかかわらず闇を愛したという文脈上の対照を、日本語で明瞭かつ自然に表した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「裁きとは、こういうことです」で定義・説明の構文を自然に示し、後半は短い文に分けて読みやすくした。脚注は不要と判断したため、本文に脚注記号は置いていない。
