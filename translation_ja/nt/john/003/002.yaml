id: JHN.3.2
reference: John 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: ja
  text: この人は夜[a]、イエスのもとに来て、言った。「ラビ、私たちは、あなたが教師として神から来られたことを知っています。神がその人と共におられなければ[c]、だれも、あなたが行っておられるこれらのしるし[b]を行うことはできないからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「夜に」「夜のうちに」とも訳せる。ヨハネ福音書では、夜や闇が象徴的な響きを帯びる場合もある。
    reason: lexical_alternative
  - marker: b
    text: 「奇跡的なしるし」とも訳せる。ヨハネ福音書では「しるし」は、それ自体を越えた意味を指し示す行為として描かれる。
    reason: lexical_alternative
  - marker: c
    text: 原文は「神がその人と共におられなければ」と三人称で述べている。「神があなたと共におられなければ」と意味を取ることもできる。
    reason: source_texture
lexical_decisions:
- source_word: οὗτος
  choice: この人
  rationale: 直前に登場したニコデモを指す指示語の力を保ちつつ、現代日本語として自然にした。
- source_word: νυκτός
  choice: 夜
  rationale: 時を表す属格を簡潔に訳した。単なる時刻に加え、ヨハネ福音書における夜・闇の主題的響きも妨げない。
- source_word: Ῥαββί
  choice: ラビ
  rationale: ギリシア語本文が保存するユダヤ的呼称を音写し、歴史的背景と直接の呼びかけを保った。
- source_word: οἴδαμεν
  choice: 私たちは……知っています
  rationale: 一人称複数をそのまま保ち、ニコデモが自分以外を含めて語る可能性を狭めなかった。
- source_word: ἀπὸ θεοῦ ἐλήλυθας
  choice: あなたが神のもとから……来られた
  rationale: 神を起点とする到来と完了形の現在的意義を表し、本文にない「遣わされた」を加えなかった。
- source_word: διδάσκαλος
  choice: 教師として
  rationale: 述語的な役割を自然な日本語で示した。
- source_word: ταῦτα τὰ σημεῖα
  choice: これらのしるし
  rationale: 奇跡的行為であるだけでなく、イエスの身分と働きを指し示すヨハネ特有の含意を保った。
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: 神がその人と共におられなければ
  rationale: 直接呼びかけの二人称から三人称へ移る原文の表現を保った。
theological_decisions:
- issue: σημεῖα のヨハネ福音書における意味
  choice: しるし
  alternative: 奇跡／奇跡のしるし
  rationale: 超自然的性格だけに限定せず、その行為がイエスについて何かを指し示すという神学的機能を保つため。
- issue: 発言中の二人称から三人称への移行
  choice: 神がその人と共におられなければ
  alternative: 神があなたと共におられなければ
  rationale: ギリシア語の αὐτοῦ は三人称であり、修辞的な一般化または格式を帯びた言い方である可能性を翻訳で消さないため。
- issue: ἀπὸ θεοῦ ἐλήλυθας が正式な派遣を意味するか
  choice: 神のもとから……来られた
  alternative: 神から遣わされた
  rationale: この節は神を起点とする到来を述べるが、「遣わす」という動詞は用いていないため、本文以上に限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、会話には丁寧体を採用した。「ラビ」「しるし」はヨハネ福音書の歴史的・主題的語感を保つため維持し、三人称への移行も不自然さを過度に均さず残した。
