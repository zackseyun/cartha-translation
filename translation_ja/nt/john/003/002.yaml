revisions:
- from: この人は夜[a]、イエスのもとに来て、言った。「ラビ、私たちは、あなたが神のもとから教師として来られたことを知っています。あなたがなさっているこれらのしるし[b]を行うことは、神がその人と共におられなければ[c]、だれにもできないからです。」
  to: この人は夜[a]、イエスのもとに来て、言った。「ラビ、私たちは、あなたが教師として神から来られたことを知っています。神がその人と共におられなければ[c]、だれも、あなたが行っておられるこれらのしるし[b]を行うことはできないからです。」
  rationale: 「神から」として原文の起点を余計な空間的含みなしに表した。語順を整え、ギリシア語のποιεῖνとποιεῖςの反復、および結びにおける三人称への移行を保った。注aもνυκτόςの時間的意味に即して修正した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:45Z'
