  source_fidelity: ギリシア語の指示語、夜の時、ラビという呼称、一人称複数、「しるし」、および結びの三人称（αὐτοῦ）は概ね忠実に反映されている。ただし「神のもとから」は場所としての「もと」を響かせやすく、ἀπὸ θεοῦ の起点を簡明に示す「神から」のほうが適切である。
  naturalness: 全体として明瞭だが、「あなたがなさっているこれらのしるしを行うこと」は、イエスの行為と一般論としての「だれにもできない」との関係がやや重くなる。「あなたが行っておられるこれらのしるしを行うことは」とすると反復も保ちつつ自然になる。注aの「夜中に」は「深夜に」を指しうるため、単なるνυκτόςの代案としては不正確である。
  terminology: 「ラビ」と「しるし」は適切であり、ヨハネにおける用語の一貫性を保つ。「教師」はδιδάσκαλοςの文脈上自然である。結びの「その人」は原文の三人称を保つ有効な処理である。
