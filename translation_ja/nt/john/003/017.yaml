id: JHN.3.17
reference: John 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: ja
  text: 神が御子を世に遣わされたのは、世を裁く[a]ためではなく、御子によって世が救われるためだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「世を罪に定めるため」とも訳せる。ギリシア語の動詞は、この文脈ではより狭くその意味に取ることもできるが、基本的な意味は「裁く」である。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: 〜ではなく……だからです
  rationale: γάρの説明的なつながりを文末の「だからです」で自然に示し、οὐの否定は第一の目的節に明確に反映した。
- source_word: ἀπέστειλεν
  choice: 遣わされた
  rationale: ἀποστέλλωの基本義「送る」を保ちつつ、神が御子を派遣するという文脈にふさわしい、現代日本語の聖書文体として自然で格調ある語を選んだ。敬語ではなく、神の行為を表す慣用的な尊敬表現として用いている。
- source_word: ὁ θεὸς
  choice: 神
  rationale: 定冠詞付きのθεόςを、日本語で自然に「神」とした。
- source_word: τὸν υἱὸν
  choice: 御子
  rationale: 原文には明示的な所有代名詞がないため「ご自分の御子」と補わず、称号的・関係的な意味を簡潔に表した。
- source_word: εἰς τὸν κόσμον
  choice: 世に
  rationale: 世界という領域への派遣を表すεἰςを、自然な日本語の「世に」で表現した。
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: 世を裁くため
  rationale: κρίνωの基本的で広い意味「裁く」を保持し、「罪に定める」へ狭めなかった。ἵναの目的は「ため」で明示した。
- source_word: ἀλλ’ ἵνα
  choice: ではなく、〜ため
  rationale: 二つの目的を対照させる原文の並行構造を、日本語の「ではなく」で明確に保った。
- source_word: σωθῇ
  choice: 救われる
  rationale: σῴζωの受動態をそのまま受動表現とし、救出と救済の幅を持つ語として「救われる」を採用した。
- source_word: ὁ κόσμος
  choice: 世
  rationale: 二度のκόσμοςをともに「世」と訳し、語の反復を保持した。人類だけに意味を限定しない。
- source_word: δι’ αὐτοῦ
  choice: 御子によって
  rationale: διά＋属格の手段・媒介を「によって」で表し、代名詞の指示対象を日本語で明確にするため「御子」と反復した。
theological_decisions:
- issue: κρίνῃとσωθῇの対照におけるκρίνωの意味
  choice: 裁く
  alternative: 罪に定める
  rationale: 文脈上「罪に定める」と理解し得るが、κρίνω自体の基本義はより広い。御子の派遣目的を裁きではなく救いとして対照する原文の緊張を保ち、狭い解釈は脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら格調を保つ文体。「御子」はヨハネ文書の父子関係を自然に示す一般的な聖書語として採用した。原文の二つのἵνα目的節の対照と、κόσμοςの反復を維持した。脚注記号[a]は該当する「裁く」の直後ではなく文末に置いたが、節全体に対する訳語注として明確に対応する。
