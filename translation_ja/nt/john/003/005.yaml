id: JHN.3.5
reference: John 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: ja
  text: イエスは答えた。「まことに、まことに、あなたに言います。だれでも、水と霊[a][b]から生まれなければ、神の国に入ることはできません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊」は聖霊を指すと考えられますが、人間の霊などを指すと読むこともできます。ギリシア語の語形自体は、その指示対象を明示していません。
    reason: alternative_reading
  - marker: b
    text: 「水と霊から」は、清めと刷新を表す比喩、肉体的な誕生と霊的な誕生、または洗礼への言及など、さまざまに理解されてきました。本文は解釈を一つに定めず、ギリシア語の表現を保っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς
  choice: イエスは答えた
  rationale: 対話における応答を表す標準的で自然な叙述。
- source_word: Ἀμὴν ἀμὴν λέγω σοι
  choice: よくよくあなたに言う
  rationale: 二重の「アーメン」が持つ厳粛な強調を、聖書的な品位を保ちつつ理解できる日本語で表した。
- source_word: ἐὰν μή τις
  choice: だれでも……なければ
  rationale: 男性に限定されない不定・一般的な条件を自然な日本語で示す。
- source_word: γεννηθῇ
  choice: 生まれなければ
  rationale: 受動の意味を保ち、3節の ἄνωθεν（再び／上から）は本節にないため補わない。
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: 水と霊から
  rationale: ἐξ が水と霊の双方をまとめて支配する簡潔な原文を保ち、解釈を本文で限定しない。
- source_word: οὐ δύναται εἰσελθεῖν
  choice: 入ることはできない
  rationale: 能力・可能性の否定を明示する自然な日本語。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: βασιλεία の領域と統治の両面を過度に限定しない、定着した訳語。
theological_decisions:
- issue: πνεύματος の指示対象
  choice: 本文では「霊」とし、聖霊を指す可能性を注で示す
  alternative: 人間の霊、または霊的原理を指すと読む
  rationale: 文脈上は聖霊が有力だが、ギリシア語には大文字・小文字の区別がなく冠詞もないため、本文の表記だけで曖昧さを消さない。
- issue: 「水と霊」の意味
  choice: 原文どおり「水と霊」を保持する
  alternative: 清めと刷新の比喩、肉体的誕生と霊的誕生、または洗礼への言及と特定する
  rationale: 複数の主要な理解があり、原文自体はそのいずれかを明示的に確定していないため、教派固有の解釈を本文へ織り込まない。
translation_notes:
  register: 明快な現代標準語を基調としつつ、イエスの厳粛な宣言には「よくよくあなたに言う」を用いて品位と反復強調を保った。「水と霊」の神学的緊張は本文で解消せず、注で主要な可能性を示した。
