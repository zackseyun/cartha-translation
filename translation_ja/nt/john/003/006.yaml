source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: ja
  text: 肉から生まれたものは肉であり[a]、聖霊から生まれたものは霊である[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「肉から生まれたものは、人間の性質を持つ」。ギリシア語の「肉」は、文脈によっては堕落した、または罪深い人間性を指すこともあるが、ここでは主として聖霊による誕生との対比を表している。
    reason: lexical_alternative
  - marker: b
    text: 別訳「聖霊から生まれたものは霊的である」。ギリシア語は直訳すると「霊である」であり、「肉」との性質上の対比を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: 生まれたもの
  rationale: 中性単数の冠詞付き完了受動分詞を、特定の人物ではなく一般的な範疇を示す表現として訳した。「生まれたもの」は、日本語として自然でありながら、誕生によって生じた状態という完了形の含意も保つ。
- source_word: ἐκ
  choice: から
  rationale: 誕生の源・起源を示すため、現代日本語で明瞭な「から」とした。
- source_word: σάρξ / σαρκὸς
  choice: 肉
  rationale: ここでは自然な人間の誕生と御霊による誕生が対比されている。「罪深い性質」などと限定せず、ヨハネの反復と神学的な含みを保つため「肉」とした。
- source_word: πνεύματος
  choice: 御霊
  rationale: 直前の文脈で、誕生の源である神の霊を指すため「御霊」とした。日本語には大文字・小文字の区別がないので、源としての聖霊と、後半の結果・性質としての「霊」とを訳語で区別した。
- source_word: πνεῦμά
  choice: 霊
  rationale: 無冠詞の述語名詞が示す質的な対比を保ち、「霊的である」と説明的に言い換えず、原文どおり名詞「霊」を用いた。
- source_word: ἐστιν
  choice: であり／である
  rationale: 簡潔な繋辞を保ち、格言的・定義的な文の構造を明瞭にした。
theological_decisions:
- issue: 最初の節における σάρξ の意味
  choice: 自然な人間の領域を含む「肉」
  alternative: 罪深い性質
  rationale: σάρξ は文脈によって倫理的な含意を持ち得るが、ここでの第一義的な対比は人間による自然な誕生と御霊による誕生である。「罪深い性質」とすると、原文以上に意味を限定するため避けた。
- issue: 後半の述語 πνεῦμα の指示・性質
  choice: 「霊である」
  alternative: 「御霊である」または「霊的である」
  rationale: 誕生の源である御霊そのものと、生まれたものの性質・領域とを同一視せず、同時にギリシア語の名詞表現と「肉／霊」の対比を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、イエスの言葉にふさわしい簡潔で格調ある断定調とした。「肉」と「霊」の反復を残し、説明を本文へ織り込まず脚注に置いた。
