  text: οὔπω γὰρ ἦν βεβλημένος εἰς τὴν φυλακὴν ⸀ὁ Ἰωάννης.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/024.yaml
  text: For John had not yet been thrown into prison[a].
translation:
  language: ja
  text: というのも、ヨハネ[a]はまだ牢に入れられていなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、バプテスマのヨハネ。
    reason: 文脈上の人物同定を補足するため。
lexical_decisions:
- source_word: οὔπω
  choice: まだ……ていなかった
  rationale: 物語上のその時点まで投獄が起きていなかったことを、自然な現代日本語で表す。
- source_word: γὰρ
  choice: からである
  rationale: 前後の叙述に対する説明的な背景を示す接続辞の働きを保つ。
- source_word: ἦν βεβλημένος
  choice: 入れられていなかった
  rationale: 完了した受動行為が基準時点より前にはまだ生じていなかったという迂言的過去完了の意味を反映する。日本語では「牢に投げ込まれる」よりも「牢に入れられる」が自然であり、受動性も保持できる。
- source_word: εἰς τὴν φυλακήν
  choice: 牢に
  rationale: ここでのφυλακήは監禁場所ないし投獄を指す。εἰςの方向性は「牢に入れられる」という日本語表現全体に反映される。
- source_word: ὁ Ἰωάννης
  choice: ヨハネ
  rationale: 原文は単にヨハネと記しているため、本文には「バプテスマのヨハネ」などの説明を加えない。
theological_decisions:
- issue: ὁ Ἰωάννηςが指す人物の明示
  choice: 本文は「ヨハネ」とする
  alternative: 「バプテスマのヨハネ」とする
  rationale: 文脈上はバプテスマを授けていたヨハネを指すが、ギリシア語本文そのものは単に「ヨハネ」としている。人物同定は脚注に置き、本文に解釈的情報を付加しない。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「牢」は簡潔で一般読者にも理解しやすく、「からである」によって原文の説明的なつながりを格調を損なわず示した。
