base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: ja
  text: パリサイ派に属する、ニコデモという人がいた。彼はユダヤ人[a]の指導者であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々の指導者」とも訳せる。このギリシア語はユダヤ人全般を指すこともあれば、文脈によってはユダヤ地方の人々、またはユダヤ人の指導層を指すこともある。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: さて、…人がいた
  rationale: ἦνの存在を「いた」で表し、δέの穏やかな場面転換を自然な日本語の「さて」で示した。時間的な「今」は加えていない。
- source_word: ἄνθρωπος ἐκ τῶν Φαρισαίων
  choice: パリサイ派に属する…人
  rationale: ἐκが示す集団への所属を明確にし、特定の男性を指すἄνθρωποςを文脈に即して「人」とした。
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: ニコデモという人
  rationale: 直訳的な「彼に名はニコデモ」ではなく、ギリシア語の命名表現を簡潔で自然な現代日本語にした。
- source_word: ἄρχων
  choice: 指導者
  rationale: 権威ある地位に就く者を指す語であり、具体的な官職を本文以上に限定せず、現代の読者に分かりやすく表した。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人の
  rationale: ここではニコデモがユダヤ社会の指導層に属することを示す広い共同体的意味が自然である。一方、地域的な「ユダヤ地方の人々」という語義の可能性は脚注に残した。
theological_decisions:
- issue: ヨハネ文書におけるἸουδαίωνの意味範囲
  choice: ユダヤ人の
  alternative: ユダヤ地方の人々の／ユダヤ人当局の
  rationale: この語は民族・宗教共同体、ユダヤ地方の住民、また文脈によってはユダヤ人指導層を指し得る。本節ではἄρχωνと結び付くためユダヤ社会における権威を表すと理解できるが、地域的意味に断定せず、本文では広い訳語を採用して別の可能性を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「さて」はδέによる穏やかな談話転換を示す。二文に分け、人物の紹介とその地位を読み取りやすくした。
