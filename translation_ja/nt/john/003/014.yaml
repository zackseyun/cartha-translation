id: JHN.3.14
reference: John 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ καθὼς Μωϋσῆς ὕψωσεν τὸν ὄφιν ἐν τῇ ἐρήμῳ, οὕτως ὑψωθῆναι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου,
base_translation:
  language: en
  yaml_path: translation/nt/john/003/014.yaml
  text: And just as Moses lifted up the serpent in the wilderness[a], so the Son of Man must be lifted up[b],
translation:
  language: ja
  text: モーセが荒野で蛇を上げたように[a]、人の子も上げられなければならない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 民数記21章8～9節参照。
    reason: cross_reference
  - marker: b
    text: 「高く上げられなければならない」または「高められなければならない」とも訳せる。ギリシア語の動詞は、物理的に上へ上げることと、高い地位に上げることの両方を表し得る。ここでは両方の意味が重ねられていると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς ... οὕτως
  choice: ～したように、～も
  rationale: 比較と対応を明確に示す自然な日本語表現であり、モーセの行為と人の子に起こることとの類型的な並行関係を保つ。
- source_word: ὕψωσεν
  choice: 上げた
  rationale: 民数記の出来事では蛇を物理的に高く掲げることを指す。後半の同語根の動詞と訳語をそろえ、ヨハネの言葉の響きを保つ。
- source_word: τὸν ὄφιν
  choice: 蛇
  rationale: 現代日本語で明瞭であり、民数記21章の青銅の蛇への言及にも自然に対応する。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: イスラエルの荒野の旅という聖書的背景を簡潔かつ自然に表す。
- source_word: ὑψωθῆναι
  choice: 上げられ
  rationale: 受動の形を保ち、十字架上への物理的な挙上と栄光ある高揚の両義性を、本文で一方に限定せず残す。
- source_word: δεῖ
  choice: ～なければならない
  rationale: 単なる予告ではなく、神的な必然性を伴う必要を自然で力のある日本語で示す。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した聖書用語を用い、ダニエル書およびヨハネ福音書における含意を保持する。
theological_decisions:
- issue: ὑψόωが持つ、物理的に上げることと高くされることの二重の意味
  choice: 前半を「上げた」、後半を「上げられ」とし、同じ動詞で対応させる。
  alternative: 後半を「高く上げられる」または「高められる」と訳す。
  rationale: 蛇が実際に掲げられたことと、人の子が十字架上に上げられ、同時に高められることとの緊張を保ち、どちらか一方に限定しないため。
- issue: δεῖが表す必然性
  choice: 「～なければならない」と訳す。
  alternative: 「～ことになっている」「～必要がある」
  rationale: 出来事が神のご計画において必然であるという強さを保ち、単なる成り行きや一般的必要性に弱めないため。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語としつつ、「荒野」「人の子」などの定着した聖書語彙を保持した。「上げた／上げられ」を反復して原文の比較構造と語の二重性を見える形で残した。
