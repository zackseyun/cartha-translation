  text: ὁ πατὴρ ἀγαπᾷ τὸν υἱόν, καὶ πάντα δέδωκεν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: ja
  text: 父は御子を愛し、すべてのものを御子の手に委ねられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「御子の手に」。これは、権限や所有を託すことを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: 父
  rationale: ヨハネ文書の文脈で、御子との関係にある神を指す呼称として、自然で荘重な「父」とした。
- source_word: ἀγαπᾷ
  choice: 愛し
  rationale: 現在形が表す継続的な現実を、後続節と自然につなぐ日本語で表した。
- source_word: τὸν υἱόν
  choice: 御子
  rationale: ここではイエスを父との固有の関係において指すため、現代日本語の聖書語として明瞭な「御子」を用いた。
- source_word: πάντα
  choice: すべてのもの
  rationale: 中性複数の包括的な範囲を保ち、「すべて」だけよりも対象の広がりを明示した。
- source_word: δέδωκεν
  choice: 委ねておられる
  rationale: 完了形の、すでになされた行為と現在まで続く結果を表しつつ、手に与えるという慣用表現が含む委託・権限の意味を自然な日本語にした。
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: 御子の手に
  rationale: 字義的な「彼の手に」を、指示対象が明瞭になるよう「御子の手に」とし、権限や所有を託す慣用的意味を本文の動詞と合わせて表した。
theological_decisions:
- issue: 父と御子の関係
  choice: 人格的・関係的な呼称「父」「御子」を保持した。
  alternative: 一般的な親子を示す「父親」「息子」
  rationale: 文脈上は神とイエスの固有の関係を指すが、本文を超える教理的説明は加えないため。
- issue: 御子に与えられたものの範囲と継続性
  choice: 「すべてのものを…委ねておられる」
  alternative: 「すべてを…与えた」
  rationale: πάνταの包括性と、δέδωκενの完了した行為が現在にも効力を持つ点を、ともに自然な日本語で保持するため。
- issue: ἐν τῇ χειρὶ の解釈
  choice: 委託・権限を表す慣用句として本文を訳し、字義形を注記した。
  alternative: 本文を「御子の手の中に与えた」と字義的に訳す。
  rationale: 原文の比喩を見失わず、同時に現代日本語で意味が不自然または不明瞭になることを避けるため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「御子」は文脈上のキリスト論的呼称として採用し、代名詞の曖昧さを避けた。完了形は「委ねておられる」により継続する結果を表した。
