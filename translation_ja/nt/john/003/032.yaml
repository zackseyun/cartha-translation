  text: ⸀ὃ ἑώρακεν καὶ ἤκουσεν τοῦτο μαρτυρεῖ, καὶ τὴν μαρτυρίαν αὐτοῦ οὐδεὶς λαμβάνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/032.yaml
  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: ja
  text: この方は、自分が見たこと、聞いたことを証言している。そして、その証言を受け入れる者は誰もいない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誰もいない」は強い一般化である。次の節では、その証言を受け入れた人について語られる。
    reason: cross_reference
lexical_decisions:
- source_word: ὃ ἑώρακεν καὶ ἤκουσεν
  choice: 自分が見たこと、聞いたこと
  rationale: 関係代名詞ὃは、見聞きした内容を指す。ἑώρακενの完了形が示す継続的な関連性は、文脈上自然な「見たこと」で表し、ἤκουσενと並べた。
- source_word: τοῦτο μαρτυρεῖ
  choice: を証ししている
  rationale: τοῦτοは直前の内容を受け直す指示語だが、日本語では目的語を重ねず「ことを証ししている」とする方が自然である。μαρτυρεῖの現在形と証言の含意を保った。
- source_word: τὴν μαρτυρίαν αὐτοῦ
  choice: その証し
  rationale: μαρτυρίαを同語根の動詞μαρτυρεῖと呼応する「証し」とし、ヨハネ文書に見られる証言の主題を保った。
- source_word: οὐδεὶς λαμβάνει
  choice: 受け入れる者は誰もいない
  rationale: λαμβάνειは字義的には「受け取る」だが、ここでは証しを真実なものとして受容する意味があるため「受け入れる」とした。οὐδεὶςの強い全面否定を弱めずに訳した。
theological_decisions:
- issue: 「その証しを受け入れる者は誰もいない」という全面否定の範囲
  choice: 強い一般化をそのまま保つ
  alternative: 「受け入れる者はほとんどいない」と和らげる、または例外のない絶対命題と明示する
  rationale: 原文はοὐδεὶςによって明確に全面否定している一方、次節では証しを受け入れた者が語られる。訳文でこの緊張を解消せず、ヨハネ的な強い一般化として保持した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、証言を表す「証し」を用いて簡潔で品位ある文体とした。「この方」により直前の文脈上の人物を敬意をもって受ける。
