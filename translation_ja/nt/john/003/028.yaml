id: JHN.3.28
reference: John 3:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: ja
  text: あなたがた自身が、私がこう言ったことを証言しています。『私はメシア[a]ではない。あの方に先立って遣わされた者です[b]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。
    reason: 称号 Χριστός の別の一般的な訳語を示す。
  - marker: b
    text: または「私はあの方に先立って遣わされているのです」「私はあの方より先に遣わされました」。原文は、すでに遣わされたことと、その結果として現在その使命にあることの両面を含み得る。
    reason: Ἀπεσταλμένος εἰμί の完了的・状態的なニュアンスと、ἔμπροσθεν の訳の幅を示す。
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: あなたがた自身が
  rationale: 重ねられた代名詞の強調を、自然な現代日本語で保つ。
- source_word: μοι μαρτυρεῖτε
  choice: 私が……言ったことの証人です
  rationale: 与格 μοι を含む証言表現を、日本語では文脈上自然な「私が言ったことの証人」とし、ヨハネ文書に特徴的な証言のニュアンスを保つ。
- source_word: εἶπον
  choice: 私がこう言った
  rationale: アオリストを過去の発言への単純な言及として訳す。「こう」は後続する発言内容を自然に導く。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名のような用法ではなく、待望された油注がれた者を指す称号なので「メシア」とする。
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: 遣わされたのだ
  rationale: 完了受動分詞と現在形コピュラの組み合わせが示す、遣わされた結果として現在その立場にあることを、文脈に自然な日本語で表す。
- source_word: ἔμπροσθεν ἐκείνου
  choice: あの方に先立って
  rationale: ἐκείνου の指示性を「あの方」で保ち、ἔμπροσθεν は先行する準備的使命を表す「先立って」とする。
theological_decisions:
- issue: Χριστός の称号としての訳
  choice: メシア
  alternative: キリスト
  rationale: 洗礼者ヨハネは、自分が待望の油注がれた者ではないと否定しているため、称号としての意味が明確な「メシア」を本文に採用する。
- issue: Ἀπεσταλμένος εἰμὶ が表す派遣の時制的ニュアンス
  choice: 遣わされたのだ
  alternative: 遣わされているのだ／遣わされた者なのだ
  rationale: 過去の派遣と、その結果として続く現在の使命を含み得る表現である。日本語本文では不自然な時制説明を避けつつ、脚注で継続的な状態の可能性を示す。
- issue: ἔμπροσθεν ἐκείνου における先行関係
  choice: あの方に先立って
  alternative: あの方の前に
  rationale: ヨハネの従属的・準備的役割を自然に表すが、「道を備える」など本文にない内容までは補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「証人です」は法廷的・証言的な語感を保ちつつ一般読者にも理解しやすい。「あの方」は指示代名詞 ἐκείνου を尊敬を含む自然な日本語で表した。
