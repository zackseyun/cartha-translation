  naturalness: 現行文も理解しやすい日本語ですが、「私がこう言ったことの証人です」より「私が…と言ったことを証言しています」のほうが、現代標準日本語として直接的で、原文の現在の証言行為にも対応します。「遣わされた者です」は不自然な説明調にならず、文脈に適しています。
  terminology: 「メシア」は称号として適切であり、「キリスト」を別訳として示す脚注も適切です。「あの方」は ἐκείνου の指示性を保ち、過度な神学的補足をしていません。
