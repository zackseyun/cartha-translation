source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: ja
  text: ヨハネも、サリムに近いアイノンでバプテスマを授けていた。そこには水が豊富にあったからである[a]。人々は来て、バプテスマを受けていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「そこには多くの水があった」。多量の水、または多くの水場があったことを表す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「バプテスマを授ける／受ける」に当たるギリシア語は「浸す」と訳すこともできる。ただし、ここでは定着した用語を用いており、この訳語だけでバプテスマの方式を決めるものではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: ヨハネもまた……バプテスマを授けていた
  rationale: δέは文脈上の緩やかな接続として日本語では明示せず、καίを「もまた」で表した。ἦνと現在分詞βαπτίζωνによる迂言的未完了の継続性を「授けていた」で示した。
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: サリムに近いアイノンで
  rationale: 地名は日本語で一般的な音写を用い、ἐνを行為の場所を示す「で」、ἐγγύςを「に近い」と訳した。
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: そこには水が豊富にあったからである
  rationale: ὅτιの理由を明示した。複数形ὕδατα πολλὰは直訳すれば「多くの水」だが、水量または水場の豊かさを表し得るため、自然な日本語の「水が豊富にあった」とした。
- source_word: παρεγίνοντο
  choice: 次々にやって来て
  rationale: 未完了形が示す継続的・反復的な到来を、過度に強調せず自然な日本語で表した。
- source_word: ἐβαπτίζοντο
  choice: バプテスマを受けていた
  rationale: 未完了受動態の継続・反復と受動の意味を保った。
theological_decisions:
- issue: βαπτίζωの訳語
  choice: バプテスマを授ける／受ける
  alternative: 浸す／浸礼を施す
  rationale: この語には浸すことに関係する語義がある一方、新約聖書では確立した宗教的行為を指す。本文では日本語で定着した「バプテスマ」を用い、方式について特定の教派的結論を訳文だけで確定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。地名は「アイノン」「サリム」と音写し、継続的な過去の動作を「ていた」で表現した。脚注標識は、それぞれが説明する表現の直後に配置した。
