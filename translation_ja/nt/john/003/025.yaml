  text: Ἐγένετο οὖν ζήτησις ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου περὶ καθαρισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: ja
  text: そこで、ヨハネの弟子たちと、あるユダヤ人との間で、清め[a]について論争が起こった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「清浄」または「儀式上の清め」とも訳せる。ギリシア語は広く清めを指すが、ここでは儀礼的な意味合いを帯びている可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: 起こった
  rationale: 出来事の発生を表す。日本語では「論争が起こった」が自然で、事態が生じたという叙述を保てる。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けつつ物語を進める接続辞。強い論理的帰結に限定せず、文脈上のつながりを自然に示す。
- source_word: ζήτησις
  choice: 論争
  rationale: 議論から争論までを表し得る語だが、この場面では見解の対立を伴うやり取りが示唆されるため、「論争」が適切である。
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου μετὰ Ἰουδαίου
  choice: ヨハネの弟子たちと、あるユダヤ人との間で
  rationale: ἐκは字義的には「〜から／〜のうちから」だが、ζήτησιςとμετάの構文全体は双方の間の論争を表す。Ἰουδαίουは単数かつ不定なので「あるユダヤ人」とした。
- source_word: περὶ καθαρισμοῦ
  choice: 清めについて
  rationale: καθαρισμόςの一般的な清めと宗教的・儀礼的な清めの含みをともに保持できる。本文で「儀式上の」と限定しすぎない自然な訳語である。
theological_decisions:
- issue: καθαρισμόςを明示的に儀礼用語として訳すか
  choice: 清め
  alternative: きよめ／儀式上の清め／清浄
  rationale: ヨハネ福音書の近接文脈は宗教的・儀礼的な清めを示唆するが、この節自体は論争の厳密な範囲を明示していない。「清め」はその含意を保ちつつ過度に限定しない。
translation_notes:
  register: 現代標準日本語による、明快で品位ある叙述。「ヨハネの弟子たち」は複数形を保ち、「あるユダヤ人」は単数・不定の指示を明示した。
