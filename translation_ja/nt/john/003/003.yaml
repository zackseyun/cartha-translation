id: JHN.3.3
reference: John 3:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: ja
  text: イエスは答えて言われた。「まことに、まことに、あなたに言います。人は上から生まれなければ[a]、神の国を見ることはできません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もう一度」または「新たに」。ギリシア語には「上から」と「もう一度」の両方の意味があり、次の節の対話はこの二重の意味を踏まえている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: 答えて言われた
  rationale: 二つの動詞を保ちつつ、日本語の聖書的な物語文として自然にした。主語がイエスなので敬語表現を用いた。
- source_word: Ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: 反復による厳粛な強調を保ち、「アーメン」より一般の読者に意味が明瞭な表現とした。
- source_word: ἐὰν μή τις
  choice: 人は…なければ
  rationale: 不定・一般的な対象を、性別を限定せず自然な日本語で表した。
- source_word: γεννηθῇ
  choice: 生まれなければ
  rationale: 受動形の意味を自然に表し、「再び」という解釈を動詞自体に加えないようにした。
- source_word: ἄνωθεν
  choice: 上から
  rationale: ヨハネ福音書に見られる天上と地上の対照を踏まえ、主要な意味を本文に置いた。同時に「もう一度」という語義も脚注で保持した。
- source_word: οὐ δύναται ἰδεῖν
  choice: 見ることはできません
  rationale: 能力・可能性の否定と「見る」という直接的な語義を保ち、知覚や参与の意味に限定しなかった。
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: 神の国
  rationale: 領域と支配の両方を含み得る、定着した簡潔な訳語を採用した。
theological_decisions:
- issue: ἄνωθενの多義性
  choice: 上から
  alternative: もう一度／新たに
  rationale: 文脈上、天からの起源という意味が有力だが、次節のニコデモの応答は「もう一度」という理解に基づく。本文と脚注に分けて二重の意味と対話の緊張を保持した。
- issue: 神の国を「見る」の意味
  choice: 見る
  alternative: 認める／経験する／入る
  rationale: ἰδεῖνの直接的表現を保ち、霊的認識や参与のいずれか一つに意味を狭めなかった。
translation_notes:
  register: 明瞭で現代的かつ格調ある標準日本語。「あなたに言います」は現代の読者に分かりやすくしつつ、二重の「まことに」で宣言の厳粛さを保った。脚注記号[a]を該当箇所に明示した。
