id: JHN.3.12
reference: John 3:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: ja
  text: 地上のことをあなたがたに話したのに、あなたがたが信じないなら、もし天上のことを話すなら、どうして信じるでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: 地上のこと
  rationale: 実体詞的に用いられた中性複数形を自然な日本語で表し、「天上のこと」との対比を保つ。「地上的なこと」と限定的に解釈しない。
- source_word: εἶπον
  choice: 話しても
  rationale: アオリスト直説法で、イエスがすでに語ったことを指す。条件節全体を日本語として自然につなぐため、「話したのに」ではなく、後続の現在形「信じない」と整合する「話しても」とした。
- source_word: οὐ πιστεύετε
  choice: 信じない
  rationale: 現在の応答ないし一般的状態を示す現在直説法を簡潔に表す。「信頼しない」と狭くせず、ヨハネ文書で通常の「信じる」を用いる。
- source_word: πῶς ... πιστεύσετε
  choice: どうして信じるでしょうか
  rationale: 未来形を保ちつつ、信じる見込みを問う修辞疑問として自然な日本語にした。「どうして信じられるでしょうか」は可能性・能力の意味を加え得るため避けた。
- source_word: ἐὰν εἴπω
  choice: 話したとき
  rationale: ἐάν＋アオリスト接続法が表す将来の仮定を、日本語で自然な「～したとき」にした。実現を断定せず、将来の場合を示す。
- source_word: τὰ ἐπουράνια
  choice: 天上のこと
  rationale: 実体詞的な中性複数形として訳し、「地上のこと」と明確に対比させる。内容を「奥義」などと限定しない。
theological_decisions:
- issue: 「地上のこと」と「天上のこと」の対比が何を指すか
  choice: 両者をそのまま「地上のこと」「天上のこと」と訳し、具体的な指示内容を限定しない。
  alternative: 「地上のこと」を地上の比喩または地上で起こる事柄、「天上のこと」をより深い神の奥義と明示する。
  rationale: 本文は二種類の事柄を対比するが、それぞれの範囲をこの節だけでは特定していない。解釈を訳文へ持ち込まず、曖昧さと神学的緊張を保つ。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「あなたがた」で複数のὑμῖνを示し、前半と後半の対照構造を保った。注記を要するほど不自然でないため脚注は付さない。
