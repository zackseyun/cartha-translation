id: JHN.3.20
reference: John 3:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: ja
  text: というのも、悪を行う者は皆、光を憎み、自分の行いが明るみに出されないように、光のもとに来ない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「明るみに出される」は、「責められる」「誤りとして示される」とも訳せる。ギリシア語の動詞には、悪を暴き、その罪責や誤りを明らかにするという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: …者は皆
  rationale: 定冠詞付き現在分詞を伴うπᾶςの一般化表現を自然な日本語で示す。γάρは前節の理由を説明するが、日本語では文脈上、接続語を明示しなくても関係が明瞭である。
- source_word: φαῦλα πράσσων
  choice: 悪を行い続ける
  rationale: φαῦλαの道徳的な悪を「悪」で表し、現在分詞πράσσωνが示す特徴的・継続的な行為を「行い続ける」で伝える。
- source_word: μισεῖ τὸ φῶς
  choice: 光を憎み
  rationale: μισεῖの強い反感を「憎む」で直訳し、ヨハネ福音書における神の啓示を帯びた「光」の比喩を保持する。
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: 光のもとに来ない
  rationale: 光へ近づくという原文の動きと比喩を、自然な現代日本語で保持する。
- source_word: ἵνα μὴ ἐλεγχθῇ
  choice: 明るみに出されることのないように
  rationale: 否定目的を明示し、ἐλέγχωが持つ暴露・罪責の指摘・非難の意味のうち、光の文脈に最もよく合う「明るみに出す」を採用する。
- source_word: τὰ ἔργα αὐτοῦ
  choice: その行い
  rationale: ἔργαを文脈に即して「行い」とし、αὐτοῦは日本語で性を不必要に限定しない指示表現「その」によって単数の照応を保つ。
theological_decisions:
- issue: ἐλεγχθῇが光との関係で表す意味
  choice: 明るみに出される
  alternative: 責められる／罪を認めさせられる
  rationale: 動詞の意味範囲を狭い司法的意味に限定せず、光によって悪い行いが露呈し、その誤りや罪責が示されるという含みを保つ。別の意味合いは脚注で示す。
- issue: 一般化された男性単数表現
  choice: その行い
  alternative: 彼の行い
  rationale: ギリシア語の男性単数はここでは一般的に人を指す。日本語では「その行い」が単数照応を保ちながら、原文にない男性限定を生じさせない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「光」というヨハネ特有の比喩と、悪を習慣的に行う者の姿を保った。「光のもとに来ない」は平易さと比喩的な動きの両方を意図する。
