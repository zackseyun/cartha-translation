id: JHN.3.11
reference: John 3:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: ja
  text: まことに[a]、まことに、あなたに言います。私たちは、知っていることを語り、見たことを証言しています。そして、あなたがたは私たちの証言を受け入れません[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アーメン、アーメン」。
    reason: lexical_alternative
  - marker: b
    text: 「私たち」「私たちの」が具体的に誰を含むかについては、解釈が分かれます。
    reason: alternative_reading
  - marker: c
    text: 「受け入れません」は、直訳すると「受け取りません」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: 二重の厳粛な確言を保ちつつ、現代日本語で意味が明瞭になるようにした。
- source_word: λέγω σοι
  choice: あなたに言います
  rationale: 二人称単数の直接の呼びかけを保ち、自然で丁寧な現代語とした。
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: 私たちは、知っていることを語り
  rationale: 一人称複数と関係節の内容をそのまま保ち、簡潔な日本語にした。
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: 見たことを証言しています
  rationale: ἑωράκαμενの完了形が示す、見た経験の現在的な重みを文脈上保ち、μαρτυροῦμενはヨハネ文書の証言語彙として明確に訳した。
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: 私たちの証言
  rationale: 動詞「証言しています」との語彙的なつながりを保ち、一人称複数を明示した。
- source_word: οὐ λαμβάνετε
  choice: 受け入れません
  rationale: 単なる物理的な受領ではなく、証言を認めて受容する意味を自然な日本語で表した。二人称複数は「あなたがた」で明示した。
- source_word: καὶ
  choice: そして
  rationale: 最終の接続詞を逆接に限定せず、ギリシア語の並列的な形を直接反映した。
theological_decisions:
- issue: 「私たち」「私たちの」が指す範囲
  choice: 複数形をそのまま保ち、指示対象を本文で限定しない
  alternative: イエスと弟子たち、修辞的複数、または天的・神的証言者を含むものとして特定する
  rationale: 原文は一人称複数を明示するが、その範囲は議論があるため、特定の解釈に決めず曖昧さを保った。
- issue: 単数の「あなた」と複数の「あなたがた」
  choice: λέγω σοιを「あなたに」、λαμβάνετεを「あなたがたは」と訳し分ける
  alternative: 両方を文脈上ニコデモ一人への呼びかけとして単数的に訳す
  rationale: 原文の数の移行を可視化し、発言の対象範囲が広がる可能性を解釈で消さないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な言い方と証言の主題にふさわしい品位を保った。冒頭の相手は単数の「あなた」、後半は複数の「あなたがた」とし、原文の人称・数の違いを明示した。
