id: JHN.3.4
reference: John 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: ja
  text: ニコデモはイエスに言った。「年を取った人が、どうして生まれることができるでしょうか。もう一度母の胎内に入って生まれることなど、できるはずがないではありませんか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: イエスに言った
  rationale: λέγειは形の上では現在形だが、ヨハネの物語で用いられる歴史的現在として、自然な日本語の過去形にした。代名詞の指示対象は直前の文脈に従い「イエス」と明示した。
- source_word: Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν
  choice: 年を取った人が、どうして生まれることができるでしょうか
  rationale: ἄνθρωποςはここでは一般的な人を指すため「人」とし、γέρων ὤνは自然な状況表現として「年を取った」と訳した。γεννηθῆναιは解釈を足さず「生まれる」とした。
- source_word: μὴ δύναται
  choice: できるはずがないではありませんか
  rationale: μήで始まる疑問は否定の答えを予期しており、ニコデモの驚きと不信を自然な反語表現で示した。
- source_word: κοιλίαν τῆς μητρὸς αὐτοῦ
  choice: 母の胎内
  rationale: 母との関係ではκοιλίαは腹部一般ではなく子宮・胎を指す。「胎内」は明瞭で、過度に医学的でもない。
- source_word: δεύτερον
  choice: もう一度
  rationale: 「二度目に」という意味を自然な日本語で表し、ニコデモが実際の再出産として理解していることを保った。
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: 入って生まれる
  rationale: 二つの不定詞の連なりをそのまま明示し、ニコデモの問いの具体的な論理を保持した。
theological_decisions:
- issue: ἄνθρωποςの一般的用法
  choice: 人
  alternative: 男／人間
  rationale: 文法上は男性単数だが、ここでは性別を限定せず一般の人を表す。日本語の「人」は原文の包括的な指示を自然に伝える。
- issue: 前節のἄνωθενに由来する「再び／上から」の多義性を本節へ持ち込むか
  choice: γεννηθῆναιは「生まれる」、δεύτερονは「もう一度」と分けて訳す
  alternative: 「もう一度生まれる」を最初の疑問にも補う
  rationale: 本節の最初のγεννηθῆναι自体には「再び」の語義がない。一方、後半にはδεύτερονが明記され、ニコデモの文字どおりの理解が示されるため、原文の展開を保った。
- issue: μὴによる予期否定疑問
  choice: できるはずがないではありませんか
  alternative: できるでしょうか
  rationale: 単なる可能性の質問ではなく、否定の答えを見込む反語的な問いであることを明示した。
translation_notes:
  register: 明瞭で現代的ながら、会話として軽すぎない丁寧な文体。「母の胎内」「できるはずがないではありませんか」により、ニコデモの文字どおりの理解と驚きを自然に表した。
