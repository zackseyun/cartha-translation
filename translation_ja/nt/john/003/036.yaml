  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: ja
  text: 御子を信じる者は永遠のいのちを持っている。しかし、御子に従わない者[a]はいのちを見ることがなく、神の怒りがその人の上にとどまっている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「御子を信じることを拒む者」。ギリシア語の動詞は、従わないことのほか、信じることを拒むという意味も表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν
  choice: 御子を信じる者
  rationale: 冠詞付き現在分詞を一般的な人物表現として訳した。πιστεύω＋εἰςが示す、御子に向けられた信頼を、自然な現代日本語の「御子を信じる」で表した。
- source_word: τὸν υἱόν / τῷ υἱῷ
  choice: 御子
  rationale: 明示的な所有語を加えず、ヨハネ文書における称号としての「子」を、尊称として定着した「御子」で表した。
- source_word: ἔχει
  choice: 持っている
  rationale: 現在直説法が示す現在の所有を保ち、将来だけの約束とはしなかった。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: ヨハネ文書で確立した表現を用い、持続性と終末論的な質の双方を含み得る語義を保った。
- source_word: ὁ δὲ ἀπειθῶν
  choice: しかし、…従わない者
  rationale: ἀπειθέωの不従順という語義を本文に保った。同時に、直前の「信じる」との対照から「信じることを拒む」の意味もあり得るため、脚注で示した。
- source_word: οὐκ ὄψεται ζωήν
  choice: いのちを見ることがなく
  rationale: 「いのちを見る」というヨハネ的表現を保ち、「いのちを持たない」などに平板化しなかった。未来形の否定は、日本語として自然な「見ることがなく」で表した。
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: 神の怒り
  rationale: 神の裁きを明示する語を弱めず、属格構文を簡潔に訳した。
- source_word: μένει ἐπ’ αὐτόν
  choice: その人の上にとどまっている
  rationale: 現在形が示す継続状態と、ἐπίが表す「上に」を保った。「その人」はギリシア語の一般的な単数男性表現であり、男性だけを指すものではない。
theological_decisions:
- issue: πιστεύωνと対照されるἀπειθῶνの意味
  choice: 本文を「従わない者」とし、脚注に「御子を信じることを拒む者」を示す。
  alternative: 本文を「信じない者」または「信じることを拒む者」とする。
  rationale: この動詞には不従順と信仰拒否の両面があり、文脈上は「信じる」と対照される。本文で服従の含意を残し、脚注で信仰拒否の読みを保存して、両者の緊張を狭く解消しないようにした。
- issue: 永遠のいのちと神の怒りの時間的側面
  choice: 永遠のいのちは現在すでに「持っている」もの、神の怒りは現在「とどまっている」ものとして訳す。
  alternative: いずれも将来だけの状態として訳す。
  rationale: ἔχειとμένειはいずれも現在直説法である一方、「いのちを見ることがない」は未来を指す。この現在と未来の緊張をそのまま保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「生命」ではなく聖書語として広く理解される「いのち」を採用した。節内の対照を明確にしつつ、ἀπειθέωの語義上・神学上の幅を脚注で保持した。
