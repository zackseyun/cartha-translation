  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: ja
  text: そこで彼らはヨハネのところに来て、言った。「先生、ヨルダン川の向こうであなたと一緒にいた人、あなたが証しをなさったあの人です。ご覧ください、この人が洗礼を授けています。みんながその人のところへ行っています。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: ヨハネのところに来て
  rationale: ἔρχομαιの接近の意味を、場面の中心であるヨハネを基準に自然な日本語で表した。
- source_word: Ῥαββί
  choice: 先生
  rationale: ユダヤ的呼称の機能を、現代の一般読者に直ちに理解できる自然な呼びかけとして表した。
- source_word: ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου
  choice: ヨルダン川の向こうであなたと一緒にいた方
  rationale: 関係節と地理表現を保ちつつ、人物への敬意を示す日本語として「方」を用いた。
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: あなたが証しをなさったあの方
  rationale: 与格は文脈上、その人について証言した意味に理解できる。完了形が示す過去の証言の現時点での関係は、前後の文脈で十分伝わるため自然な過去形とした。
- source_word: ἴδε οὗτος
  choice: あの方が、見てください
  rationale: ἴδεの注意喚起を「見てください」で明示した。οὗτοςの指示性は、先行する「あの方」と主語標識によって保持し、不自然な「この人」を避けた。
- source_word: βαπτίζει
  choice: 洗礼を授けています
  rationale: 進行中の行為を表す現在形を「ています」で示し、他者に施す洗礼であることを日本語の慣用表現で明確にした。
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: 皆がその方のところへ行っています
  rationale: πάντεςの誇張を含み得る一般化を「皆」で保ち、話者側からその人物へ向かう動きを「行っています」で表した。
theological_decisions:
- issue: ヨハネ福音書におけるμαρτυρέωの証言語彙
  choice: 証しをなさった
  alternative: 証言した
  rationale: 法廷的な意味に限定せず、ヨハネ福音書で繰り返される「証し」の主題との語彙的一貫性を保つため。
- issue: ᾧの与格関係
  choice: その方について証しをした趣旨として訳す
  alternative: その方に証しをした
  rationale: ギリシア語の与格には形式上の幅があるが、この文脈ではヨハネがイエスについて証ししたことを指すのが自然である。日本語本文では関係節「あの方」によって対象を示し、意味を過度に説明しなかった。
- issue: πάντεςの範囲
  choice: 皆
  alternative: すべての人
  rationale: 弟子たちの懸念を表す修辞的な一般化であり、例外のない全人類という神学的主張に拡大しない。
translation_notes:
  register: 明快な現代標準語。会話として自然でありながら品位を保った。「ラビ」という音写は避け、一般読者に分かりやすい「先生」とした。本文に脚注は設けていないため、脚注記号もない。
