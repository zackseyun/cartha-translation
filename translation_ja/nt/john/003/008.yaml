source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: ja
  text: 風は望むところに吹く。[a] あなたはその音を聞くが、それがどこから来て、どこへ行くのかは知らない。[b] 霊から生まれた人は皆、そのようである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「風」と「霊」は、ギリシア語ではどちらも同じ語（プネウマ）である。イエスはこの一語の二つの意味を用いている。
    reason: lexical_alternative
  - marker: b
    text: 「音」と訳したギリシア語は、「声」とも訳せる。ここでは風が耳に聞こえることを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα（前半）
  choice: 風
  rationale: πνεῖ（「吹く」）および聞こえるφωνήとの結び付きから、ここでは気象現象としての「風」が最も自然である。後半の「霊」と同じギリシア語であることは脚注で示す。
- source_word: ὅπου θέλει
  choice: 思いのままに
  rationale: 意志を表すθέλειの擬人的な響きを保ちつつ、現代日本語として自然にした。
- source_word: πνεῖ
  choice: 吹く
  rationale: 主語πνεῦμαを「風」と取る場合の自然で直接的な訳。
- source_word: φωνήν
  choice: 音
  rationale: φωνήには「声」と「音」の両義があるが、ここでは風の聞こえる現れを指すため「音」が自然である。
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: それがどこから来て、どこへ行くのかは知らない
  rationale: πόθενとποῦの対照、およびἔρχεταιとὑπάγειの動きを、明瞭で自然な日本語で保持した。
- source_word: οὕτως ἐστίν
  choice: そのようである
  rationale: 先行する風の描写を、後半の人々に当てはめる比較の働きを簡潔に表す。
- source_word: πᾶς ὁ γεγεννημένος
  choice: 生まれた者も皆
  rationale: 完了分詞が示す、生まれた結果として今ある状態を「生まれた」で表し、πᾶςの包括性を「皆」で保持した。
- source_word: ἐκ τοῦ πνεύματος（後半）
  choice: 霊から
  rationale: 文脈上は神の霊を指し、ἐκが表す起源・源を「から」で明示した。
theological_decisions:
- issue: 同じπνεῦμαに基づく「風／霊」の語義の重なり
  choice: 前半を「風」、後半を「霊」と訳す。
  alternative: 両方を「霊」とする、両方を「風」とする、または前半を「霊」として「風」とも訳せる旨を注記する。
  rationale: 前半では「吹く」「音を聞く」が「風」を強く示し、後半では新生の文脈が「霊」を示す。日本語では一語で両義を再現できないため本文で訳し分け、原文の語遊びは脚注で保持した。
- issue: 「霊」の指示対象
  choice: 本文では「霊」とし、文脈上、神の霊を指すものとして訳す。
  alternative: 「御霊」または「聖霊」と明示する。
  rationale: ヨハネ3章の文脈では聖霊が指示対象だが、原文にはここでἅγιονがなく、本文にない限定を加えないため「霊」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、比喩の簡潔さと格調を保った。「思いのままに」は風の自由な動きとθέλειの意志的な響きを自然に伝える。「御霊」のような教派的・文体的含意を避け、原文に即して「霊」とした。
