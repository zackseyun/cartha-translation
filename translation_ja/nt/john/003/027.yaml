  text: ἀπεκρίθη Ἰωάννης καὶ εἶπεν· Οὐ δύναται ἄνθρωπος λαμβάνειν ⸂οὐδὲ ἓν⸃ ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: ja
  text: ヨハネは答えた。「人は、天から自分に与えられたものでなければ、何一つ受けることができない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: ヨハネは答えて言った
  rationale: 「答えて言った」という原文の応答導入の重なりを保ちつつ、現代日本語でも理解できる形にした。
- source_word: Οὐ δύναται ἄνθρωπος λαμβάνειν
  choice: 人は…受けることができない
  rationale: ἄνθρωπος はここでは性別を限定しない総称なので「人」とし、δύναται の能力・可能性の意味を「ことができない」で明示した。λαμβάνειν は後続の「与えられる」と対応するため「受ける」とした。
- source_word: οὐδὲ ἓν
  choice: 何一つ
  rationale: 否定を強める「一つさえも」という最小単位の強調を、自然で簡潔な日本語で表した。
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: 与えられていなければ
  rationale: 完了受動の結果状態を「与えられている」で表し、条件表現と合わせて「与えられていなければ」とした。受益者は日本語では主語「人」から明らかなため、冗長な「その人に」は省略した。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 神的な源を示唆するヨハネ的表現を解釈して「神から」とせず、原文どおり「天から」と保った。
theological_decisions:
- issue: 天から与えられるものの範囲
  choice: 「何一つ」という広い表現をそのまま保つ
  alternative: 文脈上の務め、地位、霊的権威だけに限定して訳す／あらゆる出来事を決定論的に説明する文言を補う
  rationale: 直近の文脈はヨハネの務めとイエスの隆盛に関わるが、文自体は一般的な原則として述べられている。訳文ではその広さを保ち、決定論や人間の主体性について原文以上の結論を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「答えて言った」は日常会話ではやや重なるが、原文の定型的な叙述構造を見える形で残すため採用した。脚注を要するほどの本文上の異読・訳語上の不可避な曖昧さはない。
