  source_fidelity: 「そこで」はτότε οὖνの時間的進行と帰結を自然にまとめている。「引き渡した」はπαρέδωκενの司法的・他者への移管の意味を適切に表す。「イエスが十字架につけられるよう」はἵνα＋受動態σταυρωθῇの目的と受動性を保持しており、受け手・実行者を不当に特定しない。後半の「彼らはイエスを引き取った」もπαρέλαβονの、この文脈での受領・身柄の引受けを適切に表している。
