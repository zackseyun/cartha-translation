  terminology: 「ピラト」「イエス」「十字架につけられる」は日本語聖書で広く定着した表記・表現である。本文の「彼ら」は原文の未明示の指示対象を保ち、脚注も祭司長たちや兵士たちのいずれかに本文上決めつけていない。
