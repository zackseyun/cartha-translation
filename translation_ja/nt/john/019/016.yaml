id: JHN.19.16
reference: John 19:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: ja
  text: そこでピラトは、イエスが十字架につけられるよう、彼らに引き渡した。[a] こうして彼らはイエスを引き取った。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「十字架につけるため、彼らに引き渡した」とも訳せる。
    reason: ギリシア語の目的節は、日本語ではより簡潔に表すこともできる。
  - marker: b
    text: この節では、「彼ら」が誰であるかは明記されていない。直前・直後の文脈から理解されるが、本文は祭司長たちや兵士たちなどの集団名をここで挙げていない。
    reason: 原文が残す指示対象の曖昧さを明示する。
lexical_decisions:
- source_word: τότε οὖν
  choice: そこで
  rationale: 時間的な進行と、直前の出来事を受けた帰結の両方を、現代日本語で不自然に重ねずに表す。
- source_word: παρέδωκεν
  choice: 引き渡した
  rationale: 他者の支配・処置に委ねる司法的な含みを保ちつつ、自然な日本語とした。
- source_word: αὐτόν
  choice: イエスを
  rationale: 日本語では「彼を」より指示対象を明示するほうが自然であり、直後の固有名詞とも整合する。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 複数の受け手を原文どおり特定せず、文脈に委ねる。
- source_word: ἵνα σταυρωθῇ
  choice: イエスが十字架につけられるよう
  rationale: ἵνα節の目的の力と、σταυρωθῇの受動態を保つ。
- source_word: Παρέλαβον
  choice: 引き取った
  rationale: ここではイエスを自分たちのもとに受け取り、連れて行くために確保したことを簡潔に表す。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 日本語聖書で定着した人名表記を用いる。
theological_decisions:
- issue: αὐτοῖςおよびΠαρέλαβονの主語が指す集団
  choice: 本文では「彼ら」とし、集団を特定しない。
  alternative: 祭司長たちとその手下、またはローマ兵と明示する。
  rationale: この節のギリシア語本文は受け手と後半の主語を代名詞・省略主語で示し、集団名を明記していないため、その指示の開かれた状態を保持する。
- issue: ἵνα σταυρωθῇの目的と受動性
  choice: 「十字架につけられるよう」と訳す。
  alternative: 「十字架につけるため」または「十字架につけさせるため」と訳す。
  rationale: 目的を示しつつ、誰が実際に十字架につけるのかを訳文で限定せず、受動態を保つ。
translation_notes:
  register: 明快で格調を保った現代標準日本語。接続語の重複を避け、「そこで」「こうして」により物語の進行と帰結を自然に示した。
