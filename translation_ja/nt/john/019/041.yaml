id: JHN.19.41
reference: John 19:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: ja
  text: イエスが十字架につけられた場所には園があり、その園には、まだだれも納められたことのない新しい墓があった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: （訳出せず）
  rationale: 軽い叙述の移行を示す接続辞であり、日本語では文脈と文の流れによって十分に表せるため、不要な「さて」や時間的な「今」を加えなかった。
- source_word: ἐν τῷ τόπῳ ὅπου ἐσταυρώθη
  choice: イエスが十字架につけられた場所には
  rationale: ギリシア語の受動態を保ちつつ、文脈上明らかな主語「イエス」を日本語で明示した。「場所」は τόπος の自然で過不足のない訳である。
- source_word: κῆπος
  choice: 園
  rationale: 植栽のある囲われた場所を表す語として簡潔で品位があり、「果樹園」などの不要な限定を避ける。
- source_word: μνημεῖον καινόν
  choice: 新しい墓
  rationale: μνημεῖον はこの埋葬場面では「墓」が自然であり、καινόν は後続節の説明を先取りせず、そのまま「新しい」とした。
- source_word: ἐν ᾧ οὐδέπω οὐδεὶς ἦν τεθειμένος
  choice: まだだれも納められたことのない
  rationale: οὐδέπω と οὐδείς を「まだだれも…ない」で表し、埋葬の文脈における τίθημι の完了的状態を「納められたことのない」と自然に表現した。
theological_decisions:
- issue: 墓への安置を表す τεθειμένος の訳語
  choice: 納められたことのない
  alternative: 葬られたことのない／置かれたことのない
  rationale: 「置かれた」では埋葬場面として不自然であり、「葬られた」は行為全体をやや広く表す。「納められた」は遺体を墓に置くという具体的意味を保ち、本文にない神学的解釈を加えない。
- issue: ἐσταυρώθη の態
  choice: 十字架につけられた
  alternative: 人々が十字架につけた
  rationale: 原文の受動態を保ち、この節に明示されていない行為者を補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「園」は簡潔で格調を保ち、「庭園」よりも原語に余計な景観的含意を加えない。文全体は原文の二つの存在文の対応を「園があり」「墓があった」で自然に再現した。
