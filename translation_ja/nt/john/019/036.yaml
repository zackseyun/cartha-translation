  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγένετο γὰρ ταῦτα ἵνα ἡ γραφὴ πληρωθῇ· Ὀστοῦν οὐ συντριβήσεται ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/036.yaml
  text: 'For these things happened so that the Scripture might be fulfilled: “Not one of his bones will be broken.”[a]'
translation:
  language: ja
  text: これらのことが起こったのは、「彼の骨は一本も折られない」とある聖書のことばが実現するためであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο
  choice: 起こった
  rationale: 直前に語られた出来事を指すアオリストであり、現代日本語として自然な出来事表現とした。
- source_word: γὰρ
  choice: のは…ためであった
  rationale: 前節の記述を説明する接続関係を、日本語の理由・説明構文に組み込んだ。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前の複数の出来事を受ける中性複数指示詞の範囲を保った。
- source_word: ἵνα
  choice: ため
  rationale: 聖書の実現に向かう目的・結果の含みを保ちつつ、どちらか一方に過度に限定しない自然な表現とした。
- source_word: ἡ γραφή
  choice: 聖書のことば
  rationale: 聖なる書に記された特定の箇所を指す用法を、一般読者にも明瞭な日本語で表した。
- source_word: πληρωθῇ
  choice: 実現する
  rationale: 受動形を日本語で自然に表し、預言・聖書のことばが成就する意味を明確にした。
- source_word: Ὀστοῦν
  choice: 骨は一本も
  rationale: 原文の単数形が持つ『一つの骨も』という包括的な意味を、日本語の自然な数量表現で再現した。
- source_word: οὐ συντριβήσεται
  choice: 折られない
  rationale: 骨についての文脈では『砕かれない』より『折られない』が自然で、旧約の引喩にも適合する。
- source_word: αὐτοῦ
  choice: 彼の
  rationale: 属格代名詞を自然な所有表現で訳した。
theological_decisions:
- issue: 出エジプト記12章46節、民数記9章12節、詩篇34篇20節を想起させる引用の単数形をどう表すか
  choice: 彼の骨は一本も折られない
  alternative: 彼の骨は折られない
  rationale: ギリシャ語は『骨』を単数で置くが、否定文において包括的な意味を持つ。日本語では『一本も』とすることで、旧約への引喩と全体的否定を自然に保ち、どの旧約箇所を直接の典拠とするかは確定しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書引用にふさわしい落ち着いた文体とした。引用は「彼の骨は一本も折られない」とし、原文の意味を日本語で十分に表せるため脚注は設けなかった。
