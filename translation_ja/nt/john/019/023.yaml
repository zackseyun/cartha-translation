  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: ja
  text: そこで兵士たちは、イエスを十字架につけると、その上着を取り、兵士一人に一つずつ行き渡るよう四つに分けた。また、下着も取った。この下着には縫い目がなく[a]、上の方から全体にわたって織られていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「縫い合わせたところがなく」。
    reason: ἄραφοςは、縫い目がないこと、または複数の布を縫い合わせていないことを表し得るため。
  - marker: b
    text: 「上の方から」は「上から」とも訳せる。原文は、この下着が上部から全体にわたって織られていたことを表す。
    reason: ἐκ τῶν ἄνωθενとδι’ ὅλουの空間的な表現を示し、織り方について原文が明示する範囲を保つため。
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: そこで兵士たちは
  rationale: οὖνはここでは論理的結論を強く示すより、物語を先へ進める接続語。「そこで」は自然な叙述の流れを表す。
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: イエスを十字架につけると
  rationale: ὅτεとアオリストは、続く衣服の分配に先立つ出来事を示す。日本語では「〜すると」より「〜つけると」が簡潔かつ自然に順序を表す。
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: その上着を取り
  rationale: ἱμάτιαは衣服一般も意味し得るが、同節でχιτώνが別に挙げられるため、対比を明確にする「上着」が文脈に適する。
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: 兵士一人に一つずつ行き渡るよう四つに分けた
  rationale: 直訳的な「四つの部分を作った」の意味を、各兵士に一つという説明関係が自然に伝わる現代日本語で表した。
- source_word: καὶ τὸν χιτῶνα
  choice: また、下着も取った
  rationale: χιτώνは肌に近く着る衣であり、「下着」は上着との区別を明瞭にする。「取った」はギリシア語で前から補われる動詞を明示したもの。
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: この下着には縫い目がなく
  rationale: δέは軽い場面展開・説明であり、日本語では独立した逆接語を置かず自然につないだ。ἄραφοςは「縫い目がない」とした。
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: 上から下まで一枚に織られていた
  rationale: 衣服の文脈でἄνωθενは上部・上端からを指し、δι’ ὅλουは全体にわたることを示す。「一枚に」は継ぎ合わせのない連続した織物という意味を自然に表す。
theological_decisions:
- issue: 縫い目のない下着に象徴的意味を読み込む可能性
  choice: 衣服の構造についての叙述として訳し、象徴的意味を本文に加えない
  alternative: 祭司の衣や教会の一致を象徴するものとして訳文に反映する
  rationale: 本文自体は下着の作りと兵士たちの行動を記すにとどまるため、可能な象徴解釈を翻訳本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「衣」などの文語調を避けつつ、「服」より具体的な「上着」「下着」を用いて原文内の区別を保った。
