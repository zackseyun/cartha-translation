  to: また、以前、夜にイエスのもとへ来たニコデモもやって来た。[a] 彼は、没薬とアロエ（香料）の混合物を百リトラほど持って来た。[b]
  rationale: ἀλόηを特定の「沈香」とすることを避け、「アロエ（香料）」として原語の語を保持した。文脈上、ここでのアロエが埋葬用の芳香性香料であることは括弧内で明示した。ニコデモを説明する原文の同格的分詞句は、自然な修飾句として再構成し、τὸ πρῶτονの訳の幅は注で保持した。
