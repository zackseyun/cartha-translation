id: JHN.19.39
reference: John 19:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦλθεν δὲ καὶ Νικόδημος, ὁ ἐλθὼν πρὸς ⸀αὐτὸν νυκτὸς τὸ πρῶτον, φέρων ⸀μίγμα σμύρνης καὶ ἀλόης ὡς λίτρας ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: ja
  text: また、以前、夜にイエスのもとへ来たニコデモもやって来た。[a] 彼は、没薬とアロエ（香料）の混合物を百リトラほど持って来た。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「以前」は「最初に」とも訳せる。ヨハネ3:1–2参照。
    reason: alternative_translation_and_cross_reference
  - marker: b
    text: 一リトラはローマの一ポンドで、約327グラム。百リトラは約32～33キログラムに当たる。
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: また、…もやって来た
  rationale: δέの軽い接続とκαίの添加の意味を、自然な現代日本語で表した。直前の埋葬参加者にニコデモが加わったことが明確になる。
- source_word: Νικόδημος
  choice: ニコデモ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: 以前、夜にイエスのもとへ来た人
  rationale: 冠詞付き分詞句をニコデモを特定する説明として訳した。νυκτόςは「夜に」、τὸ πρῶτονはこの文脈で「以前」とした。αὐτόνはヨハネ3章の叙述を受けてイエスを指すため、日本語で指示対象を明示した。
- source_word: φέρων
  choice: 持って来た
  rationale: ニコデモが来た際の付帯状況を、自然な日本語で示した。
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: 没薬と沈香を混ぜたもの
  rationale: μίγμαの混合物という意味を保った。σμύρνηは「没薬」、ἀλόηは埋葬用の香料としての芳香木を指すため、現代の多肉植物アロエとの混同を避けて「沈香」とした。
- source_word: ὡς
  choice: ほど
  rationale: 数量に伴う概数を簡潔で自然な日本語にした。
- source_word: λίτρας ἑκατόν
  choice: 百リトラ
  rationale: 古代ローマの重量単位を音写して歴史的単位を保持し、現代換算は脚注で示した。
theological_decisions:
- issue: 識別句のαὐτόνが指す対象
  choice: 「イエス」と明示する
  alternative: 「彼」と訳す
  rationale: ヨハネ3:1–2のニコデモの訪問を明確に回想する箇所であり、日本語の曖昧な代名詞を避けても原文の指示関係は損なわれない。
- issue: τὸ πρῶτονの時間的意味
  choice: 「以前」
  alternative: 「初めに」または「初めて」
  rationale: ヨハネ3章への回想として「以前」が自然だが、「最初に」の含みもあり得るため、脚注で別訳を示して意味の幅を保持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。原文の添加的な「も」、ニコデモを説明する挿入的な句、数量の概数を保持した。長い一文を三文に分け、一般読者が人物の説明と携行品を追いやすくした。
