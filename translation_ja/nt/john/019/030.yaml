id: JHN.19.30
reference: John 19:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: ja
  text: そこで、イエスは酸いぶどう酒[a]を受けると、「成し遂げられた」[b]と言い、頭を垂れて、霊をゆだねた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「酸い酒」「ぶどう酒の酢」。ギリシア語は、酸味を帯びたぶどう酒を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「完了した」「成就した」。
    reason: lexical_alternative
  - marker: c
    text: または「息を引き取った」。ギリシア語は、より直訳的には「霊を引き渡した」となる。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: そこで、～すると
  rationale: ὅτεの時間的関係とοὖνの物語上の展開を、自然な現代日本語で併せて表す。
- source_word: ἔλαβεν
  choice: 受けると
  rationale: 差し出されたものを受けたという文脈に合い、後続する発言との時間的なつながりも明確にする。
- source_word: τὸ ὄξος
  choice: 酸いぶどう酒
  rationale: ὄξοςが指す酸味を帯びた安価なぶどう酒を表し、現代日本語の「酢」が招きうる誤解を避ける。
- source_word: Τετέλεσται
  choice: 成し遂げられた
  rationale: 完了してその結果が存続していることを示す完了形の力を保ちつつ、何が成就したかを本文以上に限定しない。
- source_word: κλίνας τὴν κεφαλήν
  choice: 頭を垂れて
  rationale: 死に先立つ動作を自然で簡潔な日本語で表し、分詞の主動詞に対する関係を保つ。
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: 霊を引き渡した
  rationale: 単に「死んだ」と言い換えず、παραδίδωμιの「引き渡す」という能動的な語感とπνεῦμαの「霊」を保持する。
theological_decisions:
- issue: παρέδωκεν τὸ πνεῦμαを単なる死の慣用表現として訳すか、霊を渡すという原文の表現を保つか
  choice: 霊を引き渡した
  alternative: 息を引き取った
  rationale: この句が死を意味することは明らかだが、ヨハネの文言は単なる死亡報告より具体的である。原文の能動的かつ霊的な響きを残しながら、それ以上の教理的説明は加えない。
- issue: Τετέλεσταιで何が完了したのかを訳文で明示するか
  choice: 成し遂げられた
  alternative: すべては終わった
  rationale: ギリシア語は完了した対象を明示していないため、「すべて」などを補わず、成就と完了の両義的な張力を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、受難物語にふさわしい簡潔で厳粛な調子を保った。「成し遂げられた」と「霊を引き渡した」は、多少非日常的でも原文の神学的含意と曖昧さを保つ表現として採用した。
