  text: ἔλαβον οὖν τὸ σῶμα τοῦ Ἰησοῦ καὶ ἔδησαν ⸀αὐτὸ ὀθονίοις μετὰ τῶν ἀρωμάτων, καθὼς ἔθος ἐστὶν τοῖς Ἰουδαίοις ἐνταφιάζειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: ja
  text: そこで、二人はイエスの体を引き取り、香料とともに亜麻布で包んだ。ユダヤ人[a]が埋葬する際の習慣に従ったのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」とも訳せるが、ここではユダヤ人一般の埋葬の習慣を指すと考えられる。
    reason: Ἰουδαῖοιには民族的・宗教的な意味と地理的な意味の両方があり得るため。
lexical_decisions:
- source_word: ἔλαβον οὖν
  choice: そこで、二人は…受け取り
  rationale: οὖνの前文を受ける叙述上のつながりを「そこで」で示した。主語は直前のアリマタヤのヨセフとニコデモであり、日本語では「二人」と補うと明瞭。λαμβάνωは、埋葬のために遺体を引き取る文脈なので「受け取り」とした。
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: イエスの体
  rationale: σῶμαを過度に生々しい「遺体」とせず、原文どおり敬意ある「体」とした。
- source_word: ἔδησαν αὐτὸ ὀθονίοις
  choice: 亜麻布で包んだ
  rationale: δέωの基本義は縛る・結ぶだが、複数のὀθόνιαを用いる埋葬処置では、日本語の「包んだ」が動作を自然に表す。「縛った」では拘束の含意が強すぎる。
- source_word: μετὰ τῶν ἀρωμάτων
  choice: 香料とともに
  rationale: ἄρωμαは埋葬に用いる芳香性の物質を指す。「香料」は現代日本語で明瞭であり、「香辛料」の料理的な響きを避けられる。
- source_word: καθὼς ἔθος ἐστὶν … ἐνταφιάζειν
  choice: 埋葬の習慣に従ったのである
  rationale: καθώςによる慣習との一致と、ἐνταφιάζεινの葬りの意味を自然な日本語でまとめた。ここでは単なる墓への安置だけでなく、そのための処置も含む。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人の
  rationale: この文脈では地域限定の「ユダヤ地方の人々」より、ユダヤ人一般の埋葬慣習を指すと判断した。
theological_decisions:
- issue: τοῖς Ἰουδαίοιςの範囲
  choice: ユダヤ人の
  alternative: ユダヤ地方の人々の
  rationale: ヨハネ福音書のἸουδαῖοιは文脈により「ユダヤ人」「ユダヤ地方の人々」「ユダヤ人指導者」を表し得るが、ここでは民族的・宗教文化的な埋葬慣習が話題なので「ユダヤ人」が最も適切。地理的理解の可能性は注に残した。
translation_notes:
  register: 現代の一般読者に明瞭で、聖書本文としての落ち着きと品位を保つ文体。「亜麻布」「香料」は具体性を保ちつつ理解しやすい語を選んだ。
