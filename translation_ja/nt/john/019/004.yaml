id: JHN.19.4
reference: John 19:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: ja
  text: ピラトは再び外に出て、彼らに言った。「見なさい。私が彼をあなたがたの前に連れ出すのは、彼に対する訴えの根拠を何も認めない[a]ことを、あなたがたが知るためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼には何の罪も認められない」。ここで「訴えの根拠」と訳したギリシア語は、「罪状」や「責められる理由」とも訳せる。この場面では、ピラトが有効な告発・訴追の根拠を認めないという司法的な意味合いが強い。
    reason: αἰτίαの司法的な主訳と、より伝統的で広い訳語の可能性を併記するため。
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: 外に出て
  rationale: 動詞と副詞が示す外への移動を、重複感のない自然な日本語で表した。
- source_word: πάλιν
  choice: 再び
  rationale: 動作の反復を簡潔で品位ある現代日本語として示した。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語文として自然な過去形にした。
- source_word: Ἴδε
  choice: 見なさい
  rationale: 聞き手の注意を向ける命令表現として、古風すぎず直接的な語を選んだ。
- source_word: ἄγω ὑμῖν αὐτὸν ἔξω
  choice: 彼をあなたがたの前に連れ出す
  rationale: ἄγωの「連れて行く／連れて来る」と、ὑμῖνが示す群衆への提示を場面に即して表した。
- source_word: ἵνα γνῶτε
  choice: あなたがたに分からせるためだ
  rationale: ἵναの目的の意味を明示し、ピラトの意図として自然な日本語にした。
- source_word: οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ
  choice: 彼を訴える根拠を何も認めていない
  rationale: αἰτίαの司法的な意味を保ち、単なる人格上の欠点ではなく、有効な告発・訴追の根拠がないという判断を表した。
theological_decisions:
- issue: ピラトによるイエスへの司法的判断
  choice: 彼を訴える根拠を何も認めていない
  alternative: 彼には何の罪も認められない／彼には何の過ちも認められない
  rationale: この場面の法的文脈を保ちつつ、ピラトの発言を、それ自体で包括的な教理命題へ広げないようにした。イエスの無罪性は物語の文脈から伝わるが、αἰτίαの司法的な幅も残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、ピラトの公的な宣言にふさわしい簡潔さと品位を保った。「見なさい」は直接的だが古語的ではなく、「あなたがた」で複数の聞き手を明示した。
