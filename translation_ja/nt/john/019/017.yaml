  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: ja
  text: イエスは、自ら十字架を担い、「どくろの場所」と呼ばれる所へ出て行った。その場所はヘブライ語[a]でゴルゴタと呼ばれている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヘブライ語で」は、「アラム語で」を意味する可能性もある。ヨハネが用いるこの表現は、ユダヤ地方で話されていたセム語を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων
  choice: 担い
  rationale: 物を実際に運ぶ動作を表す分詞。受難の文脈にふさわしい、自然で簡潔な「担う」を用いた。
- source_word: αὑτῷ τὸν σταυρόν
  choice: 自ら十字架を
  rationale: 与格の再帰代名詞が示す強調を、所有を過度に読み込まず「自ら」で表した。イエス本人が十字架を担ったことを明確にする。
- source_word: σταυρός
  choice: 十字架
  rationale: 受難記事における定着した直接的な訳語。史的に横木を指す可能性はあっても、本文の語自体はここで「横木」に限定していない。
- source_word: ἐξῆλθεν
  choice: 出て行かれた
  rationale: 「外へ出る」の意味を自然な現代日本語で表し、主語イエスに対する本文全体の品位ある敬体的敬意として尊敬表現を用いた。
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: いわゆる「どくろの場所」
  rationale: 直訳的な「どくろの場所」という名称を保ちつつ、λεγόμενονを日本語の自然な命名表現「いわゆる」で示した。「いわゆる」に含まれ得る懐疑的響きは文脈上弱く、ここでは「そう呼ばれる」の意。
- source_word: Ἑβραϊστί
  choice: ヘブライ語で
  rationale: ギリシア語本文の明示的な表現を主文で保持する。ユダヤ地方のセム系言語、特にアラム語を指し得る点は脚注に残した。
- source_word: Γολγοθα
  choice: ゴルゴタ
  rationale: 固有地名として日本語で定着した音写を用いた。
theological_decisions:
- issue: αὑτῷによる再帰的強調
  choice: 自ら十字架を担い
  alternative: 自分の十字架を担い
  rationale: 本文は「所有する十字架」より、イエス本人が担ったことを強調すると理解できるため、所有表現を避けて再帰的な強調を保った。
- issue: Ἑβραϊστίが指す言語
  choice: ヘブライ語で
  alternative: アラム語で
  rationale: 主文では原文の明示的な語を訳し、当時の用法上アラム語を指す可能性は脚注で示して、曖昧さを解消しすぎないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「髑髏」は読みにくいため「どくろ」とし、地名として引用符で示した。主語は文脈上明白だが、単独節としての明瞭さのため「イエスは」を補った。脚注記号[a]は該当する言語名ではなく「ゴルゴタ」の直後に置き、文の流れを妨げず当該命名句全体にかかるようにした。
