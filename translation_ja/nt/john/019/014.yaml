id: JHN.19.14
reference: John 19:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: ja
  text: さて、過越の祭りの準備の日であり、第六時ごろ[a]であった。ピラトはユダヤ人たち[b]に言う。「見よ、あなたがたの王だ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 現代の時刻に換算すれば「正午ごろ」とも訳せる。ただし、時刻の数え方による。
    reason: 文化的注記。第六時という古代の時刻表現を本文に保ちながら、可能な現代的理解を示す。
  - marker: b
    text: 文脈によっては、「ユダヤ人たち」はより具体的にユダヤ地方の当局者たち、またはユダヤ人の指導者たちを指す可能性がある。
    reason: 代替的な指示対象の注記。本文の直接的訳を維持し、解釈上の限定は脚注に留める。
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: 過越の祭りの準備の日
  rationale: παρασκευήの祭日・安息日前の「準備の日」という時間的意味を明示し、τοῦ πάσχαとの関係を自然な日本語で表した。
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: 第六時ごろであった
  rationale: ὡςの概数を「ごろ」で示し、古代の時刻表現「第六時」は本文に保持する。
- source_word: λέγει
  choice: 言う
  rationale: ヨハネが用いる歴史的現在の生き生きとした叙述を保持した。主語は文脈上のピラトであり、日本語で明確にした。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たち
  rationale: 語の直接的な意味を保持し、指導者層に限定する解釈を本文へ持ち込まない。
- source_word: Ἴδε
  choice: 見よ
  rationale: 注意を強く促す公的で荘重な呼びかけを、現代日本語でも理解できる簡潔な表現で示した。
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: あなたがたの王
  rationale: 所有関係と、ピラトの発言が帯びる政治的・皮肉的な響きを保つ。
theological_decisions:
- issue: 「ユダヤ人たち」の指示対象
  choice: 本文では「ユダヤ人たち」とする
  alternative: ユダヤ地方の人々／ユダヤ人の指導者たち
  rationale: τοῖς Ἰουδαίοις自体は指導者に明示的に限定していないため、解釈上の限定を避けた。
- issue: 「第六時」の時刻換算
  choice: 古代の時刻表現を本文に保持する
  alternative: 正午ごろ
  rationale: ὡςによる近似を保ちつつ、時刻の数え方を一つに決めて年代上の緊張を解消しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「さて」はδέの軽い叙述的接続を表す。歴史的現在「言う」を保持し、「見よ」で宣言の荘重さを示した。提供された英語注の内容とマーカーには不整合があり、注aは時刻についてであるのに準備日の箇所、注bは「ユダヤ人」についてであるのに「見よ」の箇所に付いていたため、誤誘導を避けて本文には脚注を設けなかった。
