  source_fidelity: 「また、別の聖書の箇所にはこうある」は、καὶ πάλιν ἑτέρα γραφὴ λέγει の追加的な引用導入を自然に再現している。引用句もὌψονται εἰς ὃν ἐξεκέντησανを「彼らは、自分たちが突き刺した者を仰ぎ見る」と正確に表す。「自分たちが」は両方の三人称複数を日本語として明瞭にする補いであり、意味を過度に限定しない。
  naturalness: 明瞭な現代標準日本語であり、聖書引用として「こうある」「仰ぎ見る」も適度に格調がある。「別の聖書の箇所」は、書物全体が別であるとの誤解を避ける自然な表現である。
  terminology: 「聖書」「突き刺した者」は適切である。「仰ぎ見る」はεἰςを伴う視線の方向性をよく伝え、敬称や神学的解釈を付加していない。脚注もゼカリヤ書12章10節への反響と「を／に」の訳し分けを適切に示す。
