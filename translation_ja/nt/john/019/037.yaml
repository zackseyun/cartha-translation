  text: καὶ πάλιν ἑτέρα γραφὴ λέγει· Ὄψονται εἰς ὃν ἐξεκέντησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/037.yaml
  text: And again another Scripture says[a], “They will look on the one whom they pierced.”
translation:
  language: ja
  text: また、別の聖書の箇所にはこうある。「彼らは、自分たちが突き刺した者を仰ぎ見る。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らは、自分たちが突き刺した者に目を向ける。」ギリシア語は、視線をその者へ向けることを表し、ゼカリヤ書12章10節を踏まえている。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: また
  rationale: 先行する聖書引用に続いて、さらに別の引用を導入する自然な接続表現。
- source_word: ἑτέρα γραφή
  choice: 別の聖書の箇所
  rationale: γραφήはここでは聖書を指し、ἑτέραは追加の聖書的証言を示す。「別の聖書」より、現代日本語では「別の聖書の箇所」が誤解なく自然。
- source_word: λέγει
  choice: こうある
  rationale: 聖書本文の引用を導く日本語として自然であり、ギリシア語の現在形が持つ、今も語る聖書という響きも保てる。
- source_word: Ὄψονται
  choice: 仰ぎ見る
  rationale: 単なる視認ではなく、対象へ向けて見ることを表す。受難文脈にふさわしい dignity を持ちながら、過度に解釈的な「信仰をもって見る」などは加えない。
- source_word: εἰς ὃν
  choice: …者を
  rationale: ὁράω系動詞に続くεἰςは視線の向かう対象を示す。日本語では「…者を仰ぎ見る」とするのが自然で、人物を対象とする関係節を明確に保つ。
- source_word: ἐξεκέντησαν
  choice: 突き刺した
  rationale: 刺し貫く行為を表すアオリスト。直前の槍で脇腹を突いた文脈と預言の反響の双方に合い、現代日本語で明瞭。
theological_decisions:
- issue: ゼカリヤ書12章10節への言及において、ヨハネ本文のキリスト論的力を保ちつつ、参照元のヘブライ語や七十人訳から語句を補わないこと
  choice: 彼らは、自分たちが突き刺した者を仰ぎ見る
  alternative: 彼らは、自分たちが突き刺した方を仰ぎ見る／彼らは、突き刺した者に目を向ける
  rationale: ヨハネ自身のギリシア語を訳出の基準とし、「者」によって指示対象を明確にする。「方」は敬意を訳文に付加しうるため避け、「自分たちが」はἐξεκέντησανの主語と「彼ら」の同一性を日本語で明瞭にするため補った。ゼカリヤ書の神的な一人称表現はここに持ち込まず、文脈上その者がイエスであることと神学的含意は本文そのものに委ねる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、引用句には預言的で格調ある響きを残した。「仰ぎ見る」は日常語よりやや高い文体だが、聖書引用として自然であり、「見る」だけでは弱くなりうる方向性を表す。
