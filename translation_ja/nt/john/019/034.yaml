    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前でイエスの脚が折られなかったこととの対照を明確に示す、自然な逆接表現。
- source_word: εἷς τῶν στρατιωτῶν
  choice: 兵士の一人
  rationale: ギリシア語の部分属格を保ち、「一人の兵士」と平板化しない。
- source_word: λόγχῃ
  choice: 槍で
  rationale: 兵士が用いる槍を指す一般的で明瞭な現代日本語。
- source_word: αὐτοῦ τὴν πλευρὰν
  choice: イエスの脇腹
  rationale: αὐτοῦの指示対象を日本語で自然に明示し、πλευράは身体の側面を表す「脇腹」とした。
- source_word: ἔνυξεν
  choice: 突いた
  rationale: 先の尖った武器で刺し貫く動作を簡潔かつ自然に表す。「刺した」より槍の動作に適する。
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: すると、すぐに…流れ出た
  rationale: καίの出来事の継起とεὐθύςの即時性を、自然な日本語の語順で保持する。
- source_word: αἷμα καὶ ὕδωρ
  choice: 血と水
  rationale: 解釈を加えず、原文の特異な組み合わせをそのまま保つ。
theological_decisions:
- issue: 「血と水」を象徴的・秘跡的に取るか、身体的現象として取るか
  choice: 本文では「血と水」とだけ訳し、意味を特定しない。
  alternative: 秘跡への暗示、または傷による身体的現象として明示する。
  rationale: ギリシア語本文はその意義を説明していないため、特定の神学的または医学的解釈を本文に持ち込まず、解釈上の緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「槍」には日本語で十分な語義幅があるため、「長槍」などの別訳注は設けない。本文中の脚注記号は該当句の直後に置いた。
