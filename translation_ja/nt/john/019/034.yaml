  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: ja
  text: しかし、兵士の一人が槍でイエスの脇腹を刺した。そして、すぐに血と水[a]が流れ出た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
