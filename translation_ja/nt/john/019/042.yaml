id: JHN.19.42
reference: John 19:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: ja
  text: そこで彼らは、ユダヤ人の備えの日[a]のため、またその墓が近くにあったので、イエスをそこに納めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ユダヤ人の備えの日のため」。この「備えの日」は、安息日などに先立って準備をする日を指す。
    reason: παρασκευήの暦上の用法と、διὰ＋対格による理由の表現を示すため。
lexical_decisions:
- source_word: ἐκεῖ
  choice: そこに
  rationale: 埋葬場所を指す場所の副詞。文末近くに置くことで、日本語として自然にしつつ場所の指示を明確にした。
- source_word: οὖν
  choice: こうして
  rationale: 直前の叙述を受けた帰結と物語の進行を示す。「そこで」では後出の「そこに」と紛らわしいため、「こうして」とした。
- source_word: διὰ τὴν παρασκευὴν τῶν Ἰουδαίων
  choice: ユダヤ人の備えの日であり
  rationale: διά＋対格の理由を文全体の「ので」で受け、παρασκευήが安息日などに先立つ準備の日を指す暦上の用語であることを、現代の読者に分かる形で表した。
- source_word: ὅτι
  choice: ので
  rationale: その墓を選んだ理由を導く因果関係を自然な日本語で示した。前半の理由も併せて受ける構文としている。
- source_word: ἐγγὺς
  choice: 近くにあった
  rationale: 墓の位置が近かったことを、自然で明瞭な現代日本語で表した。
- source_word: μνημεῖον
  choice: 墓
  rationale: この埋葬場面では遺体を納める墓所を意味するため、簡潔で標準的な「墓」とした。
- source_word: ἔθηκαν
  choice: 納めた
  rationale: τίθημιの基本的な「置く」という意味を踏まえつつ、遺体を墓に置く場面にふさわしい、自然で尊厳ある表現とした。
- source_word: τὸν Ἰησοῦν
  choice: イエスを
  rationale: 動詞の直接目的語として、標準的な固有名表記を用いた。
theological_decisions:
- issue: 受難物語における παρασκευή の訳し方
  choice: 備えの日
  alternative: 備え／準備の日
  rationale: この語は暦上の定まった呼称として用いられ得るが、単に固有名詞化せず、「日」を補って現代の読者に意味が伝わるようにした。どの祭日の準備かについて、本文以上の特定はしていない。
- issue: τῶν Ἰουδαίων の表現
  choice: ユダヤ人の備えの日
  alternative: ユダヤの備えの日／ユダヤ人たちの備えの日
  rationale: 属格の形を見える形で保ち、ヨハネの表現を不必要に弱めたり強めたりしないようにした。ここでは暦と慣習との関係を述べるものであり、ユダヤ人への神学的評価を加えていない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、埋葬場面にふさわしい端正さを保った。「納めた」は文脈上自然だが、原語の基本義である「置いた」から離れすぎない範囲の文脈的訳である。
