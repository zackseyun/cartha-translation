id: JHN.19.31
reference: John 19:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: ja
  text: そこでユダヤ人たちは[a]、その日は備えの日であり[b]、安息日にからだを十字架の上に残しておかないように――その安息日は特に重要な日だった[c]――、十字架につけられた者たちの脚を折り、からだを取り去るよう[d]、ピラトに願い出た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヨハネ福音書では「ユダヤ人たち」が、文脈によっては、より限定的にユダヤの指導者や当局者を指すことがある。
    reason: 指示対象の幅を保持するため。
  - marker: b
    text: 「備えの日」は、安息日のために準備をする日を指す。
    reason: 当時の暦・慣習に関わる用語を説明するため。
  - marker: c
    text: 直訳に近くは「その安息日のその日は大いなる日だった」。すなわち、特別な意義を持つ安息日だった。
    reason: μεγάληの字義と文脈上の意味を示すため。
  - marker: d
    text: または「取り降ろすよう」「運び去るよう」。
    reason: αἴρωが持つ語義の幅を示すため。
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: そこでユダヤ人たちは
  rationale: οὖνの文脈上の推移・帰結を自然な「そこで」で表した。Ἰουδαῖοιは本文では明示的に指導者層だけに限定されていないため「ユダヤ人たち」とし、ヨハネ文書での語義の幅は脚注に残した。
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: その日は備えの日であり
  rationale: παρασκευήはこの文脈で安息日の前の準備日を指す。「備えの日」は簡潔で、原語の名詞表現にも近い。
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: 安息日に遺体を十字架の上に残しておかないために
  rationale: ἵναと接続法の目的を「ために」で明示した。σώματαは死を目前にした処刑者の身体を指す文脈から、現代日本語で自然な「遺体」とした。
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: その安息日は特別に重要な日だった
  rationale: μεγάληの字義は「大きい、偉大な」だが、ここではその安息日の格別な重要性を表す。日本語として不自然な直訳を避けつつ、その評価的意味を明確にした。
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: ピラトに願い出た
  rationale: ἐρωτάωはここでは権限を持つピラトへの要請を表すため、「尋ねた」ではなく「願い出た」が文脈に適する。
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: 十字架につけられた者たちの脚を折り
  rationale: κατάγνυμιの受動形を、日本語では要請内容として自然な能動表現にした。αὐτῶνの指示対象を明瞭にするため「十字架につけられた者たち」と補った。
- source_word: καὶ ἀρθῶσιν
  choice: 遺体を取り降ろすよう
  rationale: αἴρωには「取り去る、取り除く」の幅があるが、ここでは十字架上の遺体の除去なので「取り降ろす」が自然である。語義の広さは脚注に示した。
theological_decisions:
- issue: ヨハネ福音書におけるἸουδαῖοιの指示対象
  choice: 本文では「ユダヤ人たち」
  alternative: 「ユダヤの指導者たち」または「ユダヤ当局者たち」
  rationale: この語はヨハネ福音書で文脈により指導者層を指すことがあるが、この節自体は範囲を明示的に限定しない。本文では広い訳語を保ち、より限定的な可能性を脚注に示した。
- issue: 安息日を修飾するμεγάληの意味
  choice: 「特別に重要な日」
  alternative: 「大いなる日」または「特別な安息日」
  rationale: 特別な意義を持つ安息日であることは伝えつつ、その重要性の具体的理由を本文で断定しない。原文の評価的表現と神学的余白を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、受難物語にふさわしい落ち着いた文体とした。長い理由節はダッシュで挿入部を区切り、論理関係を読み取りやすくした。「遺体」「願い出た」「取り降ろす」は一般読者に自然であり、過度に古風または教会内限定の表現を避けている。
