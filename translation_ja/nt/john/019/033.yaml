id: JHN.19.33
reference: John 19:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες, ὡς εἶδον ⸂ἤδη αὐτὸν⸃ τεθνηκότα, οὐ κατέαξαν αὐτοῦ τὰ σκέλη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/033.yaml
  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: ja
  text: しかし、兵士たちはイエスのところに来ると[a]、イエスがすでに死んでいるのを見て[b]、その脚を折らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヨハネは後に、このことを「その骨は一つも折られない」という聖書の言葉と結び付けている（ヨハネ19:36。出エジプト12:46、民数9:12、詩編34:20参照）。
    reason: cross_reference
  - marker: b
    text: 別訳「イエスがすでに死んだのを見て」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: しかし、兵士たちはイエスのところに来ると
  rationale: δέによる前の場面との緩やかな対照を「しかし」で示し、分詞構文を自然な時間節として訳した。主語の兵士たちは文脈から明らかなので、日本語で読みやすくするため補った。
- source_word: ὡς εἶδον
  choice: 見て
  rationale: 後続の行動の根拠となった知覚を簡潔に表す。時間的意味と理由を示す含みの両方を保っている。
- source_word: ἤδη
  choice: すでに
  rationale: 兵士たちが到着して確認した時点より前に死が生じていたことを直接示す。
- source_word: τεθνηκότα
  choice: 死んでいる
  rationale: θνῄσκωの完了分詞が示す、死んだ結果としての状態を自然な現代日本語で表した。
- source_word: οὐ κατέαξαν
  choice: 折らなかった
  rationale: この文脈のκατάγνυμιは脚の骨を折る行為を指すため、「折る」が簡潔で正確である。
- source_word: τὰ σκέλη
  choice: その脚
  rationale: σκέληを直接「脚」と訳した。「骨」と先取りせず、19章36節で明示される聖書との結び付きを本文に持ち込まない。
theological_decisions:
- issue: イエスの脚が折られなかったことと聖書の成就との関連
  choice: 本文では兵士たちの行動をそのまま叙述し、成就の意味は脚注で示す。
  alternative: 「骨」という語を本文に用い、19章36節とのつながりを前面に出す。
  rationale: この節自体は兵士たちの行動を叙述し、19章36節がその聖書的意味を明示する。したがって、本文では「脚」を保ち、神学的つながりを先取りしない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「足」よりも身体部位として正確な「脚」を採用した。文脈上の主語「兵士たち」を補って、単独の節としても理解しやすくした。
