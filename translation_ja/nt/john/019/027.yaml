  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: ja
  text: それから、イエスはその弟子に言われた。「見なさい。あなたの母です。」その時から、その弟子は彼女を自分の家に迎え入れた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: 見なさい
  rationale: 注意を向け、新たな関係を示す命令として、現代日本語で明瞭かつ簡潔に表した。
- source_word: ὥρας
  choice: 時
  rationale: ここでは厳密な六十分ではなく、その出来事の時点を指すため、「時」とした。
- source_word: ἔλαβεν ... αὐτὴν εἰς τὰ ἴδια
  choice: 彼女を自分の家に引き取った
  rationale: 直訳的には「彼女を自分のもの／ところへ受け入れた」。文脈上、生活の場に迎えて世話を担ったことを自然な日本語で示す。
theological_decisions:
- issue: イエスが弟子と母との間に示した関係
  choice: 「あなたの母です」と簡潔に訳し、本文以上の制度的・教義的意味を加えない
  alternative: 「この方があなたの母です」または霊的母性を明示する訳
  rationale: ギリシア語は新たな関係を端的に示すが、その射程を本文自体は詳述していないため、解釈を限定しない。
- issue: εἰς τὰ ἴδια の範囲
  choice: 「自分の家に」と訳す
  alternative: 「自分のところに」「自分のものの中に」
  rationale: 慣用的には自宅・身近な生活圏を表し、この文脈では「家」が自然。ただし所有権や特定の家屋を強調する意図はない。
translation_notes:
  register: 明瞭な現代標準日本語。十字架上の厳粛な場面に合わせて簡潔で dignified な表現とし、イエスへの敬意を示す「言われた」を用いた。
