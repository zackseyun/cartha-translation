  text: καὶ ⸂ἤρχοντο πρὸς αὐτὸν καὶ⸃ ἔλεγον· Χαῖρε, ὁ βασιλεὺς τῶν Ἰουδαίων· καὶ ἐδίδοσαν αὐτῷ ῥαπίσματα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/003.yaml
  text: And they came up to him and said[a], “Hail[b], King of the Jews!” And they were slapping him.
translation:
  language: ja
  text: そして彼らはイエスのもとに近づいては、「ユダヤ人の王、万歳！」と言い[a]、平手打ちを何度も加えた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らはイエスのもとに近づき続け、『……』と言い続けた」。ギリシア語の動詞は、継続または繰り返された行為を表し得る形です。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「彼に平手打ち（打撃）を与えていた」。継続または反復する動作を表しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρχοντο πρὸς αὐτὸν
  choice: イエスの前に進み出ては
  rationale: 未完了過去の反復的な動作を「進み出ては」で自然に表し、単に近づいたというより、代わる代わる嘲弄した場面の動きを伝える。αὐτόνは文脈上明確な「イエス」とした。
- source_word: ἔλεγον
  choice: と言い
  rationale: ἤρχοντοと並ぶ未完了過去で、反復性は「進み出ては」と後続の文脈から十分伝わるため、自然な日本語の「と言い」とした。
- source_word: Χαῖρε
  choice: 万歳
  rationale: この文脈では王に対する格式ある歓呼を装った嘲りである。「ごきげんよう」より王への喝采を表し、「喜べ」という字義訳より慣用的である。
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: ユダヤ人の王
  rationale: 受難物語における政治的・メシア的称号を、説明を加えず直接訳した。
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: 平手で何度もたたいた
  rationale: ῥάπισμαは平手打ち・手で加える打撃を指し、δίδωμιとの表現は「打撃を加える」の意。未完了過去の継続・反復を「何度も」で示した。
theological_decisions:
- issue: 兵士たちがイエスに向けた呼びかけの調子
  choice: 王への歓呼を装った嘲りとして「万歳」と訳す
  alternative: 中立的な挨拶として「ごきげんよう」と訳す
  rationale: 直前の茨の冠と紫の衣を含む受難場面から、これは真摯な挨拶ではなく王への敬意を装った嘲弄である。ただし本文には「嘲って」と説明を加えず、発言形式そのものに皮肉を担わせた。
translation_notes:
  register: 明瞭な現代標準語を用い、受難記事にふさわしい簡潔で重みのある調子とした。「万歳」は現代日本語でも王への歓呼を簡潔に表し、この場面の皮肉を自然に伝える。「何度も」は二つの未完了過去が示す反復性を明示するが、脚注で形態上の幅も残した。
