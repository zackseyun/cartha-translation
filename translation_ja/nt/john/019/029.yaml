  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: ja
  text: そこには、酸いぶどう酒[a]で満たされた器が置いてあった。そこで彼らは、酸いぶどう酒をたっぷり含ませたスポンジをヒソプ[b]に取り付けて、彼の口に差し出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「酢」とも訳せる。このギリシア語は酸いぶどう酒または酢を指しうるが、ここでは兵士たちが飲んだ酸味のある安価なぶどう酒を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「ヒソプの枝に」または「ヒソプを使って」とも訳せる。ギリシア語は単に「ヒソプに／ヒソプで」とあり、具体的にどのように用いたかについては議論がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: 器
  rationale: 容器の種類を特定しない一般語であるため、簡潔で自然な「器」とした。
- source_word: ἔκειτο
  choice: 置いてあった
  rationale: その場に存在していた状態を表す未完了過去の情景描写を、自然な日本語で示した。
- source_word: ὄξος
  choice: 酸いぶどう酒
  rationale: 兵士たちが飲んだ安価な酸味のある酒を指しうる語であり、単なる調味用の酢と断定しない訳語とした。
- source_word: μεστός
  choice: 満たされた／たっぷり含ませた
  rationale: 器については満杯の状態、海綿については液体を十分に吸った状態が自然に伝わるよう、文脈に応じて訳し分けた。
- source_word: σπόγγος
  choice: 海綿
  rationale: 当時用いられた天然のスポンジを表す語として、明確で標準的な訳語を採った。
- source_word: οὖν
  choice: そこで
  rationale: 直前の状況を受けた物語上の展開・帰結を自然に示す。
- source_word: ὑσσώπῳ
  choice: ヒソプにつけ
  rationale: 与格が付着または手段を表しうる曖昧さを残しつつ、本文にない「枝」を補わない表現とした。
- source_word: περιθέντες
  choice: つけ
  rationale: 主動詞に先立って海綿をヒソプに取り付けた動作を、簡潔な連用形で示した。
- source_word: προσήνεγκαν
  choice: 差し出した
  rationale: 口の方へ運び近づける動作を日本語として自然に表し、「飲ませた」と結果まで補わないようにした。
- source_word: αὐτοῦ τῷ στόματι
  choice: その口元へ
  rationale: 原文の代名詞を保ちつつ、物を口に近づける場面に自然な「口元」を用いた。
theological_decisions:
- issue: ὑσσώπῳが持ちうる歴史的・祭儀的響き
  choice: 本文に「ヒソプ」を残し、象徴的意味は説明として加えない。
  alternative: 「ヒソプの枝」と補う、または単なる「茎」と解釈して訳す。
  rationale: 過越や清めを想起させる可能性はあるが、本文自体はその象徴性を明言していない。語をそのまま残すことで、可能な神学的響きを保持しつつ解釈を押しつけない。
translation_notes:
  register: 明瞭で現代的ながら品位のある叙述体とした。「スポンジ」より歴史的な素材が伝わる「海綿」を用い、曖昧な箇所は脚注で示した。
