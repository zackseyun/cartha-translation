id: JHN.19.24
reference: John 19:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: ja
  text: 'そこで彼らは互いに言った。「これは裂かずに、だれのものになるか、くじを引いて決めよう[a]。」これは、

    「彼らは私の衣服を自分たちの間で分け、

    　私の衣を巡ってくじを引いた」[b]

    と言う聖書のことばが実現するためであった。兵士たちは、このようにした。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これをくじにかけよう」。
    reason: lexical_alternative
  - marker: b
    text: 詩編22編18節からの引用。
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: 裂かずに
  rationale: 布を裂くことを表す動詞であり、直前の縫い目のない下着という文脈にも自然に合う。
- source_word: αὐτόν
  choice: これ
  rationale: 文法上は男性形だが、文脈では前節の下着を指すため、日本語では「これ」とした。
- source_word: λάχωμεν
  choice: くじを引いて決めよう
  rationale: くじによって所有者を決めるという意味を、自然な現代日本語で明示した。
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: だれのものになるか
  rationale: くじの対象と目的、すなわちその衣がだれの所有になるかを簡潔に表した。
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: 聖書のことばが実現するためであった
  rationale: ヨハネに特徴的な成就句を保ちつつ、「満たされる」より自然で意味の明瞭な「実現する」を用いた。
- source_word: ἡ γραφή
  choice: 聖書のことば
  rationale: 単なる文書ではなく聖書の特定の箇所を指すため、この文脈で分かりやすい表現とした。
- source_word: ἡ λέγουσα
  choice: と言う
  rationale: 引用される聖書本文を導入する分詞の機能を、簡潔で自然な日本語にした。
- source_word: Διεμερίσαντο
  choice: 分け
  rationale: 複数の衣服を兵士たちの間で分配したことを直接的に表す。
- source_word: ἱμάτιά
  choice: 衣服
  rationale: 複数の衣類を指す語として、引用にふさわしい品位と現代的な明瞭さを備える。
- source_word: ἑαυτοῖς
  choice: 自分たちの間で
  rationale: 兵士たち自身の間で分配したという再帰的・分配的な意味を保った。
- source_word: ἱματισμόν
  choice: 衣
  rationale: 前の「衣服」と異なる原語が用いられていることをある程度示しつつ、詩編の引用として簡潔で格調ある語を選んだ。
- source_word: ἔβαλον κλῆρον
  choice: くじを引いた
  rationale: 直訳的な「くじを投げた」ではなく、くじで決定する行為を表す定着した自然な日本語とした。
theological_decisions:
- issue: 兵士たちの行為と聖書の実現との関係を示す ἵνα ἡ γραφὴ πληρωθῇ
  choice: 「聖書のことばが実現するためであった」と訳し、成就の目的表現を保持する。
  alternative: 「その結果、聖書のことばが実現した」と結果に重点を置いて訳す。
  rationale: ヨハネの成就定式にある目的の含みを残しながら、神の意図と人間の行為の関係について本文以上の決定論的説明を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、聖書引用では「衣」を用いて控えめな詩的格調を保った。「くじを引く」は現代の読者にも理解しやすい慣用表現である。
