  naturalness: 明瞭な現代標準日本語として自然である。「そこで」「兵士たちは、このようにした」も文脈に合い、引用部分だけに控えめな格調を持たせた「衣」も読みやすい。「衣を巡ってくじを引いた」は、この種の表現として自然であり、くじで所有者を決める文脈を明確にする。
  terminology: 「聖書のことば」「実現する」「くじを引く」は対象読者に分かりやすく、聖書文脈にも適した用語である。引用の脚注[b]は詩編22編18節を正しく指し、脚注[a]も本文の「くじを引く」に適切に対応している。
