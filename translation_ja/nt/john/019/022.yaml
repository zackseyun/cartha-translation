  text: ピラトは答えた。「私が書いたことは、私が書いたのだ。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私が書いたことは、私が書いた」。ギリシア語では「書いた」に当たる完了形が二度繰り返されており、書いた内容が確定していることを強調している。
    reason: 原文の完了形の反復と、より簡潔な別訳を示すため。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: ἀποκρίνομαιのアオリスト形。対話を導く自然な日本語として「答えた」とした。
- source_word: ὁ Πιλᾶτος
  choice: ピラト
  rationale: 定冠詞はギリシア語の物語文に一般的な用法であり、日本語では固有名だけを示した。
- source_word: Ὃ
  choice: 私が書いたこと
  rationale: 実体的に用いられた中性単数の関係代名詞で、「書いたもの／こと」を意味する。日本語の発言として自然な「こと」を選んだ。
- source_word: γέγραφα … γέγραφα
  choice: 書いたことは、書いたことだ
  rationale: γράφωの完了能動直説法の反復。日本語では完了形を同じ形で再現できないため、語の反復を保ちつつ、すでに書いた内容を変えないという確定的な響きを「ことだ」で表した。
theological_decisions:
- issue: 完了形 γέγραφα の反復が持つ力
  choice: 「私が書いたことは、書いたことだ」とし、決定の確定性を表す
  alternative: 「私が書いたことは、私が書いた」
  rationale: 原文はピラトが掲示文の変更を拒む断固とした返答である。本文訳は説明的な命令を補わず、反復と確定的な調子を自然な日本語で保つ。直訳的な形は脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語。ピラトの短く断固とした口調を保ち、原文にない「そのままにしておけ」などの命令は補っていない。
