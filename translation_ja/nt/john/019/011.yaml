id: JHN.19.11
reference: John 19:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: ja
  text: イエスは彼に答えた。「上から[a]与えられていなかったなら、あなたがわたしに対して持つ権限は、まったくなかった。だから、わたしをあなたに引き渡した者[b]には、より大きな罪がある。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天から」とも訳せる。ギリシア語は「上から」で、ヨハネによる福音書ではしばしば神に由来することを示す。
    reason: lexical_alternative
  - marker: b
    text: ここでイエスを引き渡した者がだれかは明記されていない。ユダ、カイアファ、またはユダヤ人指導者たちを指すと理解されてきた。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 権限
  rationale: この文脈では、ピラトに委ねられた統治・司法上の権能を指す。「力」よりも職務上の権能を明確に表し、「権利」ほど狭くない。
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: わたしに対する権限は何も
  rationale: κατά＋属格を「〜に対する」とし、οὐδεμίανの強い全面否定を「何も」で表した。
- source_word: δεδομένον σοι
  choice: 与えられていなければ
  rationale: 完了受動分詞と未完了過去ἦνによる迂言的表現を、現在の権限に先立つ授与を示す反実仮想の自然な日本語で表した。受動表現により、授与者を本文以上に明示しない。
- source_word: ἄνωθεν
  choice: 上から
  rationale: ヨハネ文書で神的な源を指しうる語義を保ちつつ、「天から」と解釈を本文に固定せず、原語の表現を保持した。
- source_word: διὰ τοῦτο
  choice: だから
  rationale: 前文を受ける因果・推論上のつながりを、明瞭で現代的な日本語で示す。
- source_word: ὁ παραδούς
  choice: 引き渡した者
  rationale: 受難記事におけるπαραδίδωμιの文脈的意味を表し、ユダ、カイアファ、指導者層のいずれかに指示対象を限定しない。
- source_word: μείζονα ἁμαρτίαν
  choice: より大きな罪
  rationale: 比較級の意味をそのまま示し、比較対象が文脈上暗示される一方、本文では明示されない状態を保った。
theological_decisions:
- issue: ピラトの権限の源を示すἄνωθεν
  choice: 「上から」と訳し、神的な源を示唆しつつ、本文では授与者を明示しない。
  alternative: 「天から」または「神から」
  rationale: この文脈では神に由来することが強く示唆されるが、政治権力一般についての包括的教説を補ったり、原語の含みを一つの説明に狭めたりしないため。
- issue: ὁ παραδούς μέ σοιの指示対象
  choice: 「わたしをあなたに引き渡した者」と一般的に訳す。
  alternative: ユダ、カイアファ、またはユダヤ人指導者層と特定する。
  rationale: ギリシア語本文は人物を名指ししていないため、その曖昧さを保持する。
- issue: 「より大きな罪」の比較関係
  choice: 引き渡した者の罪が、文脈上ピラトの罪より大きいことを示しつつ、ピラトに罪がないとは訳さない。
  alternative: 引き渡した者だけに罪があると読める形にする。
  rationale: 比較級は責任の程度を比較しており、一方の無罪を意味しないという本文の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法廷場面にふさわしい端正さを保った。「権限」「引き渡した者」により司法的文脈を明確にし、ἄνωθενと引き渡した者の指示対象に関する原文の含みと曖昧さは脚注を伴って保持した。
