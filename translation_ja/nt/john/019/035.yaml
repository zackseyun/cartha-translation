id: JHN.19.35
reference: John 19:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: ja
  text: そして、それを見た者が証言しており、その証言は真実である。その者は、自分が真実を語っていることを知っている。それは、あなたがたも信じるためである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたも信じ続けるためである」。現在接続法には、信じ続けるという含みがあり得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: それを見た者
  rationale: 完了分詞の継続的な重みと、実際に見た者であるという含意を保ちつつ、日本語として自然にした。何を見たかは直前の出来事から補われるため、「それを」を加えた。
- source_word: μεμαρτύρηκεν
  choice: 証言しており
  rationale: 完了形が示す、すでになされた証言とその現在に及ぶ有効性を表す。「証言した」だけより継続的な効力が伝わる。
- source_word: ἀληθινὴ αὐτοῦ ἐστιν ἡ μαρτυρία
  choice: その証言は真実である
  rationale: ἀληθινήを証言の真実性・信頼性を表す「真実」とし、明瞭で格調ある表現にした。
- source_word: ἐκεῖνος
  choice: その者
  rationale: 単なる「彼」よりも指示代名詞の強調を保ち、語り手自身か別の目撃者かを特定しない。
- source_word: οἶδεν
  choice: 知っている
  rationale: 形態上は完了形だが現在の状態を示すため、自然な現在表現とした。
- source_word: ἀληθῆ λέγει
  choice: 真実を語っている
  rationale: 「真実なことを言う」という意味を自然かつ厳粛な日本語で表した。
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: それは、あなたがたも信じるためである
  rationale: ἵναの目的を明示し、καίの包含的な意味を「も」で保持した。πιστεύητεの継続的ニュアンスは本文で限定せず脚注に示した。
theological_decisions:
- issue: 強調された三人称表現が指す人物
  choice: 「それを見た者」「その者」と訳し、人物を特定しない
  alternative: 愛された弟子である語り手自身、または語り手とは別の目撃者と明示する
  rationale: ギリシア語本文は証人の身元を明示していないため、自己指示か別人への言及かという曖昧さを保持した。
- issue: πιστεύητεの相的ニュアンス
  choice: 「信じるため」とする
  alternative: 「信じ続けるため」とする
  rationale: 現在接続法は継続を含み得るが、ここで開始か継続かを確定できないため、本文は無標の表現とし、継続の可能性を脚注に残した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、証言の厳粛さにふさわしい文体とした。「その者」により原文の強調と指示性を保ち、証人の身元は解釈で補わない。
