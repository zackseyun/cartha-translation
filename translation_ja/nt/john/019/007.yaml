  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: ja
  text: ユダヤ人たちはピラトに答えた。「私たちには律法があり、その律法[a]によれば、彼は死ぬべきです。自分を神の子[b]としたからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法に従えば」とも訳せる。ギリシア語は「律法」を繰り返し、二度目は最初に述べた律法を指す。
    reason: lexical_alternative
  - marker: b
    text: 「神の御子」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: ピラトに答えた
  rationale: ἀποκρίνομαιを自然な物語表現で「答えた」とした。代名詞αὐτῷの指示対象は直前の文脈上ピラトであるため、日本語では固有名を補って明確にした。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 本文が集団を表す一般的な呼称を用い、この節自体では指導者だけに限定していないため、直接的に訳した。
- source_word: νόμον ἔχομεν
  choice: 私たちには律法があり
  rationale: νόμοςはここで彼らが有する法的根拠を指す。日本語の聖書文脈で自然な「律法」を用い、不定冠詞のない日本語で不必要に特定性を加えない形にした。
- source_word: κατὰ τὸν νόμον
  choice: その律法によれば
  rationale: 二度目のνόμοςは定冠詞を伴い、先に述べた律法を受けるため、「その」で照応関係を明示した。
- source_word: ὀφείλει ἀποθανεῖν
  choice: 彼は死ぬべきです
  rationale: ὀφείλωの義務・当然性を「べき」で表し、法的主張を保ちつつ、絶対的必然を意味する「死ななければならない」より原文の幅を残した。
- source_word: υἱὸν θεοῦ ἑαυτὸν ἐποίησεν
  choice: 自分を神の子とした
  rationale: ἑαυτὸν ἐποίησενの直截な言い方を保った。「神の子」は冠詞を持たない日本語でも称号的・関係的な意味を自然に表し、文脈における独自の神的子性への告発を弱めない。
theological_decisions:
- issue: 敵対者の告発におけるυἱὸν θεοῦの訳し方
  choice: 神の子
  alternative: 神の御子／神の一人の子
  rationale: 「神の子」はヨハネ文書の称号的な響きを保ちながら、告発者の発言として提示する。「神の一人の子」として不定的な部類に限定せず、また敬語的な「御子」を本文に入れて告発者の口調を過度に敬虔にもしていない。
translation_notes:
  register: 明瞭な現代標準語を用い、法廷場面にふさわしい端正さを保った。発言は丁寧体とし、原文の法的義務と告発の強さを過度に増減しないようにした。
