  to: そこで彼らはイエスを十字架につけ、イエスとともにほかの二人も十字架につけた。一人を片側に、もう一人を反対側に、イエスを中央にした[a]。
  rationale: 行為者を原文どおり文脈依存の「彼ら」とし、二人にも「十字架につけた」が及ぶことを日本語で明示した。位置関係は、原文の反復された副詞とイエスの中央配置を保ちながら、「片側／反対側／中央」という自然な現代日本語で表した。脚注は配置表現に直接付し、「その間に」という簡潔な代替表現が、本文の空間的描写を不当に狭めないことを示す。
