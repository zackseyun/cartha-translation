  naturalness: 「こちら側／向こう側」は話者の視点を帯び、古代の場面描写にはやや不自然である。「片側／反対側」が現代標準日本語として自然で、対向する配置を明確にする。
  terminology: 「十字架につける」はσταυρόωの標準的で節度ある訳語として適切である。「イエス」「ほかの二人」も原文に忠実である。
