    rationale: ギリシア語ではἐσταύρωσανが「ほかの二人」にも及ぶが、日本語では「イエスとともにほかの二人を、一人を…し」と続けると、十字架刑そのものが二人に及ぶことが読み取りにくい。
  - severity: low
    issue: 「こちら側／向こう側」が叙述者の指示中心を導入する。
    rationale: ἐντεῦθεν καὶ ἐντεῦθενは対向する両側の配置を表す。「片側／反対側」のほうが無標で自然である。
