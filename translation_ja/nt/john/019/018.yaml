  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: ja
  text: そこで彼らはイエスを十字架につけ、イエスとともにほかの二人も十字架につけた。一人を片側に、もう一人を反対側に、イエスを中央にした[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 簡潔には、「両側に一人ずつ、イエスをその間にした」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: そこで
  rationale: 直前に示された場所を受ける場所の関係副詞。日本語では「そこで」が自然で簡潔。
- source_word: αὐτὸν ἐσταύρωσαν
  choice: 人々はイエスを十字架につけた
  rationale: σταυρόωは受難文脈で十字架刑にすることを指す。「人々」はギリシア語の三人称複数に対応する一般的な主語補充であり、「イエス」は日本語で代名詞の指示を明確にする。釘を用いたかなど、動作の細部は加えない。
- source_word: μετ’ αὐτοῦ ἄλλους δύο
  choice: イエスとともにほかの二人を
  rationale: μετά属格の同行・同伴と、名詞を伴わないἄλλους δύοを保つ。「二人」により日本語として人を指すことを自然に示す。
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: 一人をこちら側に、もう一人を向こう側にし
  rationale: 反復された場所の副詞が表す左右への配分を明示し、原文の描写的な配置を保つ。
- source_word: μέσον δὲ τὸν Ἰησοῦν
  choice: イエスをその真ん中にした
  rationale: 対格による位置の叙述を自然な日本語にする。δέはここでは弱い接続・対照であり、文全体の構造で表して個別の接続語は置かない。
theological_decisions:
- issue: イエスがほかの二人の間に置かれたことをどこまで明示するか
  choice: 一人をこちら側に、もう一人を向こう側にし、イエスをその真ん中にした
  alternative: 一人ずつ両側に置き、イエスを二人の間にした
  rationale: 原文は両側を反復して描き、その後でイエスを中央に置く。選択訳は「二人の間」という推論に圧縮せず、その空間的な描写を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。受難記事にふさわしい節度ある文体を保ちつつ、原文の配置を描く反復表現を残した。
