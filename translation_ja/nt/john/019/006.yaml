source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: ja
  text: そこで、祭司長たちと役人たちはイエスを見ると、「十字架につけろ！　十字架につけろ！」と叫んだ。ピラトは彼らに言った。「あなたがた自身でこの者を引き取り、十字架につけなさい。」[a]「私はこの者に何の罪状も見いだせない。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「あなたがた」が明示されており、ピラトと彼らとの対照を強調しています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私はこの者に何の罪も認められない」。ここでのギリシア語は、法的な罪状または告発の根拠を意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: そこで、…見ると
  rationale: 時間を示すὅτεと、直前の展開を受けるοὖνの両方を、自然な日本語の物語の流れとして表した。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: エルサレムの祭司階級の指導者たちを指す定着した訳語であり、単数の大祭司と区別できる。
- source_word: ὑπηρέται
  choice: 役人たち
  rationale: ユダヤ当局に仕える下級職員を指す文脈に合い、本文にない『神殿』や具体的な警備任務を過度に補わない。
- source_word: ἐκραύγασαν λέγοντες
  choice: …と叫んだ
  rationale: λέγοντεςを日本語の引用構文に自然に組み込みつつ、ἐκραύγασανの激しい大声を明確に表す。
- source_word: Σταύρωσον σταύρωσον
  choice: 十字架につけろ！ 十字架につけろ！
  rationale: 目的語は文脈から明白なので日本語では省略し、命令の反復と荒々しい叫びを保持した。
- source_word: Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε
  choice: あなたがたが自分たちでこの者を引き取り、十字架につけるがよい
  rationale: 明示された代名詞ὑμεῖςの対照的な強調を『あなたがたが自分たちで』によって保ち、二つの命令を自然につないだ。
- source_word: αἰτίαν
  choice: 罪状
  rationale: 裁判の場面における告発内容・訴追理由という法的意味を簡潔に表す。
theological_decisions:
- issue: ピラトによるイエスへの法的評価
  choice: 私はこの者に何の罪状も見いだせない
  alternative: 私はこの者に何の罪も認められない
  rationale: αἰτίαはここでは司法的な訴追理由を指すため、『罪状』を用いた。これにより、本文の法廷的判断を保ちつつ、一般的・教理的な無罪性の宣言へ意味を広げすぎない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、法廷場面の緊張と群衆の叫びの強さを保った。ピラトの発言はやや改まった命令調とし、祭司長たちの叫びは切迫した荒い口調にした。英語相談層では脚注[a]の位置と内容が対応していなかったため、日本語稿では内容に即してピラトの命令の後に配置した。
