id: JHN.19.20
reference: John 19:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: ja
  text: そこで、多くのユダヤ人がこの掲示文を読んだ。イエスが十字架につけられた場所は都に近かったからである。その掲示文はヘブライ語[a]、ラテン語、ギリシア語で書かれていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヘブライ語」は、当地で用いられていたアラム語を指す可能性もある。
    reason: ヨハネによる福音書の Ἑβραϊστί は字義どおり「ヘブライ語」と訳す一方、当時の現地のセム語であるアラム語を指す用法である可能性があるため。
lexical_decisions:
- source_word: τίτλον
  choice: 罪状書き
  rationale: 十字架上に掲げられた、処刑理由を記す札を指す文脈に即した自然な訳。「表題」より具体的で、前節の内容ともつながる。
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: 多くのユダヤ人
  rationale: 部分を表す属格の意味を日本語として自然に表しつつ、すべてのユダヤ人を指すとの過度な一般化を避ける。
- source_word: ἀνέγνωσαν
  choice: 読んだ
  rationale: 掲示された文面を読む単純な行為を表す。音読を明示する根拠はない。
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: 場所は都に近かった
  rationale: 原文の語順関係と意味を明瞭に保ち、「門」など原文にない情報を加えない。エルサレムを指す文脈なので、πόλις は格調と自然さを兼ねた「都」とした。
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: イエスが十字架につけられた場所
  rationale: 受動態を保ち、行為者を補わない自然な日本語とした。
- source_word: ἦν γεγραμμένον
  choice: 書かれていた
  rationale: 完了分詞を伴う迂言形が示す、書かれた状態の継続を自然に表す。
- source_word: Ἑβραϊστί
  choice: ヘブライ語
  rationale: 原文の言い方を本文に保持する。ただしヨハネにおいて当地のセム語、すなわちアラム語を指す可能性は脚注に示す。
- source_word: Ῥωμαϊστί
  choice: ラテン語
  rationale: 字義的には「ローマ語で」だが、指示対象であるラテン語を現代日本語で明確に表す。
- source_word: Ἑλληνιστί
  choice: ギリシア語
  rationale: 言語名を標準的かつ直接的に訳す。
- source_word: οὖν
  choice: そこで
  rationale: 前節を受けた結果・展開を示す。日本語の物語文として自然であり、「それゆえ」ほど強い論理関係を過剰に示さない。
theological_decisions:
- issue: ヨハネ文書における Ἑβραϊστί の訳
  choice: 本文では「ヘブライ語」
  alternative: 「アラム語」
  rationale: ギリシア語本文の名称を優先して「ヘブライ語」とする一方、当時当地で用いられたセム系の言語としてアラム語を指す可能性を脚注に残し、曖昧さを解消しすぎない。
translation_notes:
  register: 明瞭で現代的ながら、受難記事にふさわしい簡潔で dignified な文体とした。因果関係は二文に分けて読みやすくし、原文の受動態と三言語の列挙を保持した。
