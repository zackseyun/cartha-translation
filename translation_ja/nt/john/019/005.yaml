  text: ἐξῆλθεν οὖν ὁ Ἰησοῦς ἔξω, φορῶν τὸν ἀκάνθινον στέφανον καὶ τὸ πορφυροῦν ἱμάτιον. καὶ λέγει αὐτοῖς· ⸀Ἰδοὺ ὁ ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: ja
  text: そこで、イエスは茨の冠をかぶり、紫の衣を身に着けて、外に出て来た。ピラトは彼らに言う。「見よ[a]、この人だ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見なさい」。ギリシア語Ἰδοὺは注意を促す表現で、「見よ」「見なさい」「さあ」などと訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: そこで……外へ出て来た
  rationale: οὖνを物語の展開を示す「そこで」とし、ἐξῆλθενと強意的なἔξωを自然な日本語の「外へ出て来た」で表した。
- source_word: φορῶν
  choice: かぶり……身に着けて
  rationale: φορέωは身に着けていることを表す。冠と上着それぞれに自然な日本語の動詞を用いた。
- source_word: τὸν ἀκάνθινον στέφανον
  choice: 茨の冠
  rationale: 茨で作られた冠を指す、明確で定着した表現。
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: 紫の上着
  rationale: ἱμάτιονは外側に着る衣服を広く指すため、王の正式な礼服と限定しすぎない「上着」とした。
- source_word: λέγει
  choice: ピラトは彼らに言う
  rationale: 歴史的現在を「言う」で保ち、直前の文脈から明白な話者ピラトを日本語で補って読みやすくした。
- source_word: Ἰδοὺ
  choice: 見よ
  rationale: 人々の注意を引き、イエスを公に示す厳粛な響きを簡潔に伝える。
- source_word: ὁ ἄνθρωπος
  choice: この人
  rationale: 目前に示された特定の男性イエスを指す。日本語では直訳的な「その人」より「この人」が場面の指示性を自然に表す。
theological_decisions:
- issue: ピラトの宣言におけるὁ ἄνθρωποςの訳
  choice: この人
  alternative: 人間／この男
  rationale: まず目前のイエス個人を指す具体的な意味を表しつつ、代表的人間性などの神学的含意を本文で確定しない。「男」は侮蔑的に響く可能性があり、「人間」は抽象化しすぎる。
translation_notes:
  register: 明瞭で現代的ながら、受難場面の厳粛さを保つ文体。「見よ」と歴史的現在の「言う」により、原文の公的で劇的な提示を再現した。
