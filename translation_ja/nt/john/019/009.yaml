  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: ja
  text: そして彼は再び総督官邸[a]に入り、イエスに言った。「あなたはどこから来たのか。」しかし、イエスは彼に何も答えなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「プラエトリウム」。ローマ総督の公的な住居または執務拠点。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: 入った
  rationale: 場所の内部への移動を表すアオリスト。現代日本語の物語文として簡潔で自然な「入った」とした。
- source_word: πραιτώριον
  choice: 総督官邸
  rationale: ローマ総督の公的な住居兼執務拠点を指す語。「総督官邸」は、その性格を一般の読者に明確に伝える。
- source_word: πάλιν
  choice: 再び
  rationale: 行為の反復を示す語を、格調を保ちつつ明瞭な「再び」で訳した。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、日本語の自然な過去の物語叙述に合わせて「言った」とした。
- source_word: Πόθεν εἶ σύ
  choice: あなたはどこから来たのか
  rationale: 出身・起源を問う表現。「どこから来たのか」は、直前の移動元だけでなく、より深い起源を問いうる原文の含みを保つ。
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: 彼に何も答えなかった
  rationale: 原文は直訳すると「彼に答えを与えなかった」。日本語では「何も答えなかった」が自然であり、ピラトの問いに対するイエスの沈黙を明確に表す。
- source_word: καὶ ... καὶ ... δὲ
  choice: そして……、……。しかし
  rationale: 冒頭の接続で物語の継続を示し、δέは質問と沈黙の対照が分かるよう「しかし」とした。
theological_decisions:
- issue: 省略された主語の指示対象
  choice: 「彼」とし、文脈上ピラトを指す形にした。
  alternative: 本文で「ピラト」と明示する。
  rationale: ギリシア語では主語が明示されていないが、直前の文脈からピラトであることは明らかである。「彼」は原文の省略に比較的近い。
- issue: 「どこから」の問いが指す起源
  choice: 「あなたはどこから来たのか」とし、地理的出身にも、より深い起源にも読める形を保った。
  alternative: 「あなたの出身はどこか」または「あなたは何者なのか」と限定する。
  rationale: Πόθεν は起源・由来を問うが、その射程を一義的に限定しない。ヨハネ福音書の文脈にある神学的含みを説明的に確定せず、原文の緊張を保存した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔でありながら品位を保った。イエスにだけ特別な敬語を加えず、原文にない待遇差を持ち込まないようにした。
