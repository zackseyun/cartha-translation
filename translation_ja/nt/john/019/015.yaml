source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: ja
  text: そこで彼らは叫んだ。「彼を連れ去れ、連れ去れ！ 彼を十字架につけろ！」ピラトは彼らに言った。「あなたがたの王を、私が十字架につけるのか。」祭司長たちは答えた。「私たちには、カエサルのほかに王はいません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: そこで彼らは叫んだ
  rationale: οὖνの物語上の帰結・進行を「そこで」で示し、κραυγάζωの大声で叫ぶ強さを「叫んだ」で自然に表した。ἐκεῖνοιの強調は、文脈上不自然にならない「彼ら」で保持した。
- source_word: Ἆρον ἆρον
  choice: 連れて行け、連れて行け
  rationale: αἴρωの命令形の反復をそのまま保ち、処刑を求める場面での「取り去れ」という叫びを、現代日本語として明瞭な表現にした。直後のαὐτόνがあるため、ここでは目的語を補わなかった。
- source_word: σταύρωσον αὐτόν
  choice: この男を十字架につけろ
  rationale: σταυρόωをローマの処刑方法に即して「十字架につける」と訳した。αὐτόνは、日本語の激しい発話として自然であり、ピラトの目前にいる人物を指す「この男」とした。
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω
  choice: あなたがたの王を、私が十字架につけるのか
  rationale: 審議的接続法の修辞的な問いを「私が……のか」で表し、前置された目的語「あなたがたの王」の強調とピラトの挑発的な響きを読点によって保った。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数形は当時の有力な祭司指導者層を指すため、日本語聖書で定着し、一般にも理解可能な「祭司長たち」とした。
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: 私たちには、カエサルのほかに王はいません
  rationale: εἰ μήの排他的意味を「ほかに……いません」で明確にし、Καῖσαρは人名に由来する皇帝号として原語に近い慣用表記「カエサル」とした。
theological_decisions:
- issue: 祭司長たちによる政治的忠誠の宣言
  choice: 私たちには、カエサルのほかに王はいません
  alternative: 私たちの王はカエサルだけです
  rationale: 原文の「王を持たない、ただしカエサルを除く」という否定と例外の構造を保ち、物語にあるイエスの王権との緊張を説明によって解消しないようにした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、裁判場面の切迫した叫びとピラトの修辞的な問いを保持した。群衆の命令は荒い口調の「つけろ」とし、語り手と祭司長たちの発話は品位ある自然な文体に整えた。
