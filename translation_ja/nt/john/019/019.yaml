id: JHN.19.19
reference: John 19:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: ja
  text: ピラトはまた、罪状書きを書いて十字架に掲げた。そこには、「ナザレ人イエス、ユダヤ人の王[a]」と書かれていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々の王」とも訳せる。ギリシア語は、文脈によってユダヤ人全般を指す場合と、ユダヤ地方の人々を指す場合がある。
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: 罪状書き
  rationale: 十字架刑に処される者の罪状を示す掲示を指す文脈であり、単なる「題」より具体的で、現代日本語でも自然である。
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: 十字架に掲げた
  rationale: ἐπίの「上に」という関係を保ちつつ、日本語では掲示物について「掲げる」が自然である。「十字架の上方に」と位置を限定する推測は加えない。
- source_word: ἦν ... γεγραμμένον
  choice: そこには……と書かれていた
  rationale: 完了分詞を伴う迂言的構文の結果状態を、自然な日本語で表す。
- source_word: Ναζωραῖος
  choice: ナザレ人
  rationale: 明示的な「ナザレ出身の」ではなく、出身・所属を示す呼称としての形を簡潔に保つ。
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: ユダヤ人の王
  rationale: 受難物語の公的な王号・罪状として一般的かつ文脈に適した訳。「ユダヤ地方の人々の王」という地域的理解の可能性は脚注に残す。
- source_word: δὲ καὶ
  choice: また
  rationale: 文脈の継続と付加の働きを、過剰に逐語化せず自然に表す。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 現代日本語で定着した固有名表記。
- source_word: Πιλᾶτος
  choice: ピラト
  rationale: 現代日本語の聖書で広く定着した固有名表記。
- source_word: σταυροῦ
  choice: 十字架
  rationale: 福音書の受難記事における標準的で文脈に適した訳語。
theological_decisions:
- issue: 掲示文中のἸουδαίωνの訳
  choice: ユダヤ人
  alternative: ユダヤ地方の人々（ユダヤ人／ユダヤ地方の住民）
  rationale: ここでは公に掲げられた王号として民族・宗教共同体を指す理解が文脈上もっとも自然である。ただし語には地域名「ユダヤ」に基づく意味の幅もあるため、脚注で透明性を確保する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「罪状書き」は刑罰の文脈を自然に示し、引用文は掲示文らしく簡潔にした。
