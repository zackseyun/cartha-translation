id: JHN.19.25
reference: John 19:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: ja
  text: イエスの十字架のそばに、イエスの母と、その母の姉妹、クロパのマリア[a][b]、そしてマグダラのマリアが立っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「クロパの妻マリア」。ギリシア語はクロパとの関係を明記していないが、「クロパの妻」と理解するのが一般的である。
    reason: lexical_alternative
  - marker: b
    text: 「その母の姉妹」を「クロパのマリア」と同一人物を指す説明と取り、この箇所が四人ではなく三人の女性を挙げていると読むこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: 立っていた
  rationale: 過去完了形が継続する状態を表しており、十字架のそばに立ち続けていた様子を自然な現代日本語で示す。
- source_word: δὲ
  choice: には（文脈上の場面転換として反映）
  rationale: ここでは強い逆接ではなく叙述の推移を示す。独立した接続詞を補わず、場所を主題化する「には」によって自然に場面を移す。
- source_word: παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ
  choice: イエスの十字架のそばには
  rationale: παρά＋与格の近接を「そば」で表し、属格による「イエスの十字架」という簡潔な関係も保つ。
- source_word: ἡ μήτηρ αὐτοῦ
  choice: イエスの母
  rationale: 代名詞を日本語で明確な「イエス」に置き換え、指示対象を自然に示す。
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: その母の姉妹
  rationale: ἀδελφήは姉か妹かを特定しないため、両方を含み得る「姉妹」として曖昧さを保つ。
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: クロパの妻マリア
  rationale: 属格による関係を一般的な理解に従って夫婦関係として本文に示す一方、原文が「妻」を明記しないことを脚注に残す。
- source_word: Μαρία ἡ Μαγδαληνή
  choice: マグダラのマリア
  rationale: マグダラ出身を示す呼称として、日本語で広く理解される自然な形を用いる。
theological_decisions:
- issue: 十字架のそばにいた女性の同定と人数
  choice: イエスの母、その母の姉妹、クロパの妻マリア、マグダラのマリアという四人を列挙する読み
  alternative: 「その母の姉妹」を「クロパのマリア」の同格説明とし、三人を列挙する読み
  rationale: 連続する名詞句は四人の女性を挙げるものとして素直に読めるが、古代写本に現代的な句読点はなく、圧縮された統語構造は三人と読む余地も残す。本文では四人の読みを採り、別の読みを脚注で明示する。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「立っていた」で継続状態を示し、女性たちの人数と「クロパ」との関係について原文に残る曖昧さは脚注で保持した。
