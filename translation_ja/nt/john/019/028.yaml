  text: Μετὰ τοῦτο ⸀εἰδὼς ὁ Ἰησοῦς ὅτι ⸂ἤδη πάντα⸃ τετέλεσται ἵνα τελειωθῇ ἡ γραφὴ λέγει· Διψῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: ja
  text: その後、イエスは、すべてのことがすでに成し遂げられたことを知り、聖書が成就するために、「喉が渇いた」と言われた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「渇く」。
    reason: Διψῶの簡潔で伝統的な表現を示すため。本文は現代日本語として自然な身体状態の表現を用いる。
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: その後
  rationale: 単数指示詞を伴う時間的な移行を、ヨハネの叙述に合う自然な現代日本語で表す。
- source_word: εἰδὼς
  choice: 知り
  rationale: イエスを修飾する同時的な状況分詞として、簡潔に表す。
- source_word: ἤδη πάντα τετέλεσται
  choice: すべてのことがすでに成し遂げられた
  rationale: πάνταを明示し、完了形が示す完了後の状態を保つ。
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: 聖書が成就するために
  rationale: γραφήを聖書と捉え、τελειόωの『完成に至らせる』含意を、聖書について自然な『成就する』で表しつつ、ἵναの目的の意味を保つ。
- source_word: λέγει
  choice: 言われた
  rationale: 物語中の歴史的現在を、日本語の自然な過去時制と敬意を示す表現で訳す。
- source_word: Διψῶ
  choice: 渇く
  rationale: 一人称主語が文脈上明らかな日本語で、短く厳粛な原文の発話を直接的に表す。自然な口語的代案は脚注に示す。
theological_decisions:
- issue: イエスの認識、すべてのことの完遂、聖書の成就の関係
  choice: イエスは、すべてのことがすでに成し遂げられたと知ったうえで、聖書が成就するために発言した、と訳す。
  alternative: 発言の結果として聖書が成就したという含みをより強く出すこともできる。
  rationale: 原文の統語関係と目的・結果の幅を保ち、神の予知や予定について特定の教理体系を持ち込まない。また、τετέλεσταιとτελειωθῇの関連性を訳語上ある程度保つ。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。本文の「渇く」は原文の簡潔さと厳粛さを優先し、日常的な言い方を脚注に置いた。脚注記号は該当する発言の直後に配置した。
