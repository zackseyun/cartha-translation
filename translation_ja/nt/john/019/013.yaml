id: JHN.19.13
reference: John 19:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ οὖν Πιλᾶτος ἀκούσας ⸂τῶν λόγων τούτων⸃ ἤγαγεν ἔξω τὸν Ἰησοῦν, καὶ ἐκάθισεν ⸀ἐπὶ βήματος εἰς τόπον λεγόμενον Λιθόστρωτον, Ἑβραϊστὶ δὲ Γαββαθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: ja
  text: そこでピラトは、これらの言葉を聞くと、イエスを外へ連れ出し、「敷石」と呼ばれる場所（ヘブライ語では「ガバタ」[b]）で、裁判の席に着いた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスを裁判の席に着かせた」。ギリシャ語の動詞は他動詞として理解することもできるが、ここではピラト自身が裁判の席に着いたという意味である可能性のほうが高い。
    reason: alternative_reading
  - marker: b
    text: ここで「ヘブライ語」は、ヨハネ福音書のほかの箇所と同様、当地のセム語、おそらくアラム語を指すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた物語上の展開と帰結を、自然な現代日本語で示す。
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: これらの言葉を聞くと
  rationale: アオリスト分詞の時間的関係を明確にし、直前に語られた発言を指す λόγων を「言葉」と訳した。
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: イエスを外へ連れ出し
  rationale: ἄγω と ἔξω が表す外への移動を、簡潔で自然な日本語にした。
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: 裁判の席に着いた
  rationale: βῆμα は司法判断を行う公式の席または壇を指す。「席に着いた」により、主語をピラトとする最も自然な読みを表した。
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: 「敷石」と呼ばれる場所
  rationale: Λιθόστρωτον の透明な語義を訳し、石を敷き詰めた場所という名称を簡潔に伝えた。
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: ヘブライ語では「ガバタ」と呼ばれる所
  rationale: 本文の Ἑβραϊστί をそのまま「ヘブライ語」とし、地名 Γαββαθα は「ガバタ」と音写した。δέ は日本語の構文内で軽い付加として処理した。
theological_decisions:
- issue: ἐκάθισεν の主語と他動詞的可能性
  choice: ピラトが裁判の席に着いた
  alternative: ピラトがイエスを裁判の席に着かせた
  rationale: 司法的文脈と通常の統語理解では、ピラト自身が判決を下す席に着いたと読むのがより自然である。ただし、動詞を他動詞的に理解する余地は実在し、解釈上重要なので脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「裁判の席」は専門的すぎる「法廷」「裁判壇」を避けつつ、βῆμα の司法的機能を示す。脚注記号は、それぞれ関係する「裁判の席に着いた」と「ヘブライ語」の内容を受けるよう節末に配置した。
