  text: Ὅτε οὖν ἤκουσεν ὁ Πιλᾶτος τοῦτον τὸν λόγον, μᾶλλον ἐφοβήθη,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/008.yaml
  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: ja
  text: そこで、ピラトはこの言葉を聞くと、ますます恐れた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: そこで、…聞くと
  rationale: ὅτεの時を示す働きを「聞くと」で表し、οὖνの文脈を受ける軽い接続を「そこで」で自然に示した。
- source_word: ἤκουσεν
  choice: 聞くと
  rationale: 直前に語られた内容を耳にしたという物語上の出来事を、現代日本語の自然な従属節で表した。
- source_word: ὁ Πιλᾶτος
  choice: ピラトは
  rationale: 固有名を日本語の標準的な表記と主題提示で訳した。
- source_word: τοῦτον τὸν λόγον
  choice: この言葉
  rationale: λόγοςはここでは直前の発言内容を指す。「この言葉」は簡潔で自然であり、単なる一語に限定せず発言全体も指し得る。
- source_word: μᾶλλον
  choice: ますます
  rationale: すでにあった恐れがさらに強まったという比較・増加の意味を明確に表す。
- source_word: ἐφοβήθη
  choice: 恐れた
  rationale: φοβέομαιの心理的反応を簡潔に訳し、μᾶλλονとの組み合わせによって恐れの増大を自然に示す。
theological_decisions:
- issue: ピラトの恐れの性質
  choice: 恐れの理由や性質を限定せず、「ますます恐れた」と訳す。
  alternative: 政治的な不安、迷信的な恐怖、または神的含意への畏怖と明示する。
  rationale: ギリシア語本文は恐れが増したことだけを述べ、その動機を特定していないため、物語上の曖昧さと緊張を保つ。
translation_notes:
  register: 明快な現代標準日本語。簡潔な物語文としての品位を保ち、「そこで」で前節とのつながりを示した。
