id: JHN.19.21
reference: John 19:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: ja
  text: そこで、ユダヤ人[a]の祭司長たちはピラトにこう言っていた。「『ユダヤ人の王』と書かず、『あの者は「私はユダヤ人の王だ」と言った』と書いてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」とも訳せる。ギリシア語の語は、文脈によりユダヤ人一般を指すことも、ユダヤ地方の人々をより限定的に指すこともある。ここでは同じ語が「ユダヤ人の王」という称号にも用いられている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: こう言っていた
  rationale: 未完了過去の継続的な側面を保ちつつ、現代日本語として自然に表した。単純な「言った」より原文の時制を反映し、「言い続けた」ほど反復を強調しない。
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語上の展開・帰結を、自然な接続表現で示した。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数の祭司指導者を指す定着した聖書用語であり、複数の大祭司が同時に在職したとの誤解を避ける。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人の
  rationale: 受難物語における公的な称号「ユダヤ人の王」とのつながりを保つ一般的で分かりやすい訳。地域的な「ユダヤ地方の人々」という可能性は脚注に示した。
- source_word: Μὴ γράφε
  choice: 書かず
  rationale: 続く訂正文と一文で自然につなぎながら、「書くな」という禁止の力を保った。
- source_word: Ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: ユダヤ人の王
  rationale: 問題となっている罪状書きの文言を、称号として簡潔かつ慣用的に訳した。
- source_word: ἀλλ’ ὅτι
  choice: …と書いてください
  rationale: 対照を「…と書かず、…と書いてください」という日本語の構文で明示した。後半の「書く」は原文では省略されているが、日本語では補うことで訂正要求が明確になる。
- source_word: ἐκεῖνος
  choice: この者
  rationale: 単なる「彼」よりも指示代名詞の距離を感じさせる響きを保つ。一方、場面内でイエスを指しているため、日本語では「この者」が自然である。
- source_word: εἶπεν
  choice: 言った
  rationale: 原文の基本的な意味をそのまま訳し、「主張した」などの評価的な含みを加えなかった。
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: 私はユダヤ人の王だ
  rationale: 述語名詞として自然な日本語にした。日本語には冠詞がないため、ギリシア語で βασιλεύς に冠詞がないことを不自然に作り分けなかった。
theological_decisions:
- issue: ヨハネ受難物語における Ἰουδαῖος／Ἰουδαίων の範囲
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: この場面では「ユダヤ人の王」という政治的・宗教的な公称が中心であり、定着した訳を保つのが最も明瞭である。ただし語が文脈により地域的な「ユダヤ人／ユダヤ地方の人々」を指し得ることは脚注で透明に示した。
- issue: 無冠詞の述語 βασιλεύς の表現
  choice: 私はユダヤ人の王だ
  alternative: 私はそのユダヤ人の王だ
  rationale: 日本語には冠詞がなく、原文の無冠詞性から不定・限定のいずれかを教義的に断定すべきではない。自然な称号表現を採用した。
translation_notes:
  register: 明瞭で現代的ながら品位のある会話文とした。祭司長たちの訂正要求は、日本語で理解しやすいよう「…と書かず、…と書いてください」と対照させた。入れ子の引用符により、彼らが求めた罪状書きの文言とイエスに帰された発言を区別した。
