id: JHN.19.10
reference: John 19:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ὁ Πιλᾶτος· Ἐμοὶ οὐ λαλεῖς; οὐκ οἶδας ὅτι ἐξουσίαν ἔχω ⸂ἀπολῦσαί σε καὶ ἐξουσίαν ἔχω σταυρῶσαί⸃ σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: ja
  text: そこでピラトはイエスに言った。「私に話そうとしないのか。私には、あなたを釈放する権限も、十字架につける権限もあることを知らないのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「権限」は「力」とも訳せる。ギリシア語エクスーシアは、権限、権利、力を表し得る。ここではピラトが司法・統治上の立場について語っているため、「権限」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: そこでピラトはイエスに言った
  rationale: οὖνはここで物語を進める接続語なので、「そこで」とした。αὐτῷは日本語で指示対象を明確にするため「イエスに」とした。
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: 私に話そうとしないのか
  rationale: 文頭のἘμοὶの強調と、相手を責める修辞疑問の響きを自然な現代日本語で表した。
- source_word: οὐκ οἶδας ὅτι
  choice: …ことを知らないのか
  rationale: οἶδαの基本義「知る」を保ち、ὅτι以下を内容節として表した。
- source_word: ἐξουσίαν ἔχω
  choice: 私には…権限がある
  rationale: 法的・統治的文脈におけるἐξουσίαを「権限」とし、単なる実力ではなく公的立場に基づく権能を示した。
- source_word: ἀπολῦσαί σε
  choice: あなたを釈放する
  rationale: 司法的文脈でのἀπολύωを、無罪判決まで含意しない「釈放する」と訳した。
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: 十字架につける権限もある
  rationale: 二度目のἐξουσίαν ἔχωが作る対照と強調を、日本語では「…権限も、…権限もある」の並行表現で保持した。σταυρόωは直接的に「十字架につける」とした。
theological_decisions:
- issue: ピラトが主張するἐξουσίαの性質
  choice: 「権限」と訳し、ピラトの主張として提示する
  alternative: 「力」または「権利」
  rationale: この節はピラトの自己認識を報告しているのであり、その権限が絶対的・自律的であると本文が承認しているわけではない。次節で示される神学的緊張を解消せずに残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。ピラトの威圧的で不快感を帯びた問いを保ちつつ、過度に古風な表現は避けた。脚注記号は対象となる節全体の末尾に置いた。
