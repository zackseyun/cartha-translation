  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: ja
  text: そこで兵士たちはやって来て、最初の人[a]の両脚を折り、また、イエスとともに十字架につけられていたもう一人の両脚も折った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「最初の者」。ここでは、イエスとともに十字架につけられた二人のうちの一人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の命令を受けた結果と物語の進行を、自然な現代日本語で示す。
- source_word: οἱ στρατιῶται
  choice: 兵士たち
  rationale: この場面のローマ軍の兵士を指す標準的で明瞭な訳語。
- source_word: τοῦ μὲν πρώτου
  choice: まず一人[a]の
  rationale: 二人のうち最初に処置された者を表す。「第一の者」という不自然さを避け、人を補って明確にした。
- source_word: κατέαξαν τὰ σκέλη
  choice: 両脚を折り
  rationale: σκέληは複数で、この処刑の文脈では両脚を指す。「打ち砕く」より「折る」が明快で自然。
- source_word: τοῦ ἄλλου
  choice: もう一人の
  rationale: イエスとともに十字架につけられた二人のうち、他方を自然に示す。
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: イエスとともに十字架につけられていた
  rationale: 分詞がその人物を特定している。αὐτῷの指示対象は文脈上イエスであり、日本語では名を明示して曖昧な代名詞を避けた。既に十字架につけられた状態にあったことを「つけられていた」で表した。
theological_decisions:
- issue: αὐτῷの指示対象
  choice: イエスとともに
  alternative: 最初の一人とともに
  rationale: 受難物語の中心人物はイエスであり、二人はイエスとの関係で十字架につけられた者として描かれているため、イエスを指すのが最も自然。
- issue: 脚を折った対象の表現
  choice: 二人それぞれの両脚を折ったことを明示
  alternative: 二人の「脚」を折ったとだけ訳し、片脚か両脚かを明示しない
  rationale: σκέληは複数形であり、文脈上それぞれの両脚を指す。日本語の「脚」は単複が不明瞭なため「両脚」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で前節からの因果的な流れを示し、「まず一人……もう一人」でギリシア語の対照構造を自然に再現した。
