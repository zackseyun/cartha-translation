id: JHN.19.38
reference: John 19:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: ja
  text: その後、アリマタヤ出身のヨセフが、イエスの弟子ではあったが、ユダヤ人たち[a]を恐れてそのことを隠していた。彼は、イエスの遺体を引き取ることを許可してほしいとピラトに願い出た。ピラトが許可したので、ヨセフは来て、イエスの遺体を引き取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この文脈では、より限定的に「ユダヤの当局者たち」または「ユダヤ人指導者たち」を指すとも考えられる。ヨハネ福音書の「ユダヤ人たち」は、ユダヤ人全体ではなく、しばしばイエスに敵対する人々を指して用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: その後
  rationale: 複数形を字義どおりに再現する「これらのことの後」よりも、ヨハネの時間的な場面転換を自然な現代日本語で明確に表す。
- source_word: ἀπὸ Ἁριμαθαίας
  choice: アリマタヤ出身の
  rationale: ἀπόが示す出身地・由来を、日本語で自然かつ明確に表現する。
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ
  choice: イエスの弟子でありながら、…そのことを隠していたが
  rationale: 隠されていたものが弟子である事実だという文脈上の補足を「そのこと」で示し、完了分詞の継続的な状態と逆接を保つ。
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: ユダヤ人たちを恐れて
  rationale: 原因を表す句を簡潔で自然な日本語にする一方、Ἰουδαῖοιを本文では狭く限定せずに訳す。
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: イエスの遺体を引き取らせてほしいと
  rationale: 埋葬のため遺体を取り下ろして運ぶという文脈で、目的節をピラトへの依頼として自然に表す。「遺体」は死後のσῶμαにふさわしい。
- source_word: ἐπέτρεψεν ὁ Πιλᾶτος
  choice: ピラトが許可した
  rationale: 許可を与えるという動詞の意味を簡潔に表す。
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: ので、ヨセフは来て、イエスの遺体を引き取った
  rationale: οὖνの結果的・継起的関係を「ので」で示す。日本語では代名詞の指示が曖昧になりやすいため、主語と所有者を固有名で明示し、同じαἴρωには「引き取る」を対応させる。
theological_decisions:
- issue: ヨハネ福音書における τῶν Ἰουδαίων の指示対象
  choice: 本文では「ユダヤ人たち」とし、文脈上の限定の可能性を脚注で説明する。
  alternative: 「ユダヤ当局者たち」または「ユダヤ人指導者たち」
  rationale: 原文の表現が持つ広さとヨハネ特有の緊張を本文で保持しつつ、この箇所がユダヤ民族全体を一括して指すとの誤解を避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「願い出た」「許可した」「引き取った」により、公的な依頼と埋葬準備の場面を自然に表現した。
