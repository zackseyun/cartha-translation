revisions:
- from: その後、アリマタヤ出身のヨセフが、イエスの弟子でありながら、ユダヤ人たち[a]を恐れてそのことを隠していたが、イエスの遺体を引き取らせてほしいとピラトに願い出た。ピラトが許可したので、ヨセフは来て、イエスの遺体を引き取った。
  to: その後、アリマタヤ出身のヨセフが、イエスの弟子ではあったが、ユダヤ人たち[a]を恐れてそのことを隠していた。彼は、イエスの遺体を引き取ることを許可してほしいとピラトに願い出た。ピラトが許可したので、ヨセフは来て、イエスの遺体を引き取った。
  rationale: 依頼の内容を「引き取ることを許可してほしい」として、ヨセフ自身による遺体の引き取りへの許可を求めた原文の意味を明確にした。また、隠された弟子であったという説明を自然な譲歩表現に整えた。本文の「ユダヤ人たち」と脚注の組み合わせは、Ἰουδαῖοιの原文上の曖昧さと文脈上の注意点を保っている。
