id: JHN.19.1
reference: John 19:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τότε οὖν ἔλαβεν ὁ Πιλᾶτος τὸν Ἰησοῦν καὶ ἐμαστίγωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/001.yaml
  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: ja
  text: そこでピラトはイエスを連れて行き、むちで打った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 配下に命じたことを明示するなら、「そこでピラトはイエスを連れて行き、むちで打たせた」とも訳せる。
    reason: 原文ではピラトが文法上の主語だが、本人が直接むちを振るったのか、部下に執行させたのかは明示されていないため。
lexical_decisions:
- source_word: Τότε οὖν
  choice: そこで
  rationale: Τότεの時間的な展開とοὖνの論理・物語上の進行を、現代日本語で自然な一語にまとめた。「それから」も可能だが、「そこで」は直前の展開を受けた次の行為であることをよく表す。
- source_word: ἔλαβεν
  choice: 連れて行き
  rationale: λαμβάνωの基本的な「取る」を文脈に即して自然な日本語にした。単に「捕らえた」とすると原語以上に強制的な含みを加えうるため避けた。
- source_word: ὁ Πιλᾶτος
  choice: ピラト
  rationale: 既出人物の名として、定冠詞を訳出せず標準的な日本語表記を用いた。
- source_word: τὸν Ἰησοῦν
  choice: イエスを
  rationale: 対格の直接目的語として自然に訳した。
- source_word: ἐμαστίγωσεν
  choice: むちで打った
  rationale: μαστιγόωが表す、むちによる打擲を明確で現代的な日本語にした。「むち打ちにした」も可能だが、動作を直接表す表現を採った。
theological_decisions:
- issue: ἔλαβεν…ἐμαστίγωσενにおけるピラトの行為主体性
  choice: 二つの動詞の文法上の主語をともにピラトとして訳し、直接執行か命令による執行かは本文で特定しない。
  alternative: 「ピラトはイエスを連れて行かせ、むちで打たせた」または「ピラトはイエスを連れて行き、むちで打たせた」
  rationale: ギリシア語ではピラトが両動詞の主語であり、使役形は明示されていない。一方、権力者の行為を配下による執行も含めて述べる可能性があるため、その曖昧さを脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「鞭」ではなく「むち」と平仮名にして一般読者への読みやすさを優先した。
