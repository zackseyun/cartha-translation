  source_fidelity: 本文はΤότε οὖνの物語上の進行を「そこで」で自然に表し、ピラトを二つの動詞の主語として保っている。「イエスを連れて行き」はλαμβάνωの文脈的な自然訳として許容範囲であり、「むちで打った」はἐμαστίγωσενの暴力性を過不足なく表す。本文は直接執行か命令による執行かを断定していない。
  naturalness: 「そこでピラトはイエスを連れて行き、むちで打った」は明瞭な現代標準日本語であり、この短い叙述の緊張感にも合う。「むち」のひらがな表記も一般読者向けとして自然である。
  terminology: 「ピラト」「イエス」は標準的な固有名表記である。「むちで打った」は古風すぎる「むち打ちにした」を避けつつ、μαστιγόωを適切に表現している。
