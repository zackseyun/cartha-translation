  text: Ἰησοῦς οὖν ἰδὼν τὴν μητέρα καὶ τὸν μαθητὴν παρεστῶτα ὃν ἠγάπα λέγει τῇ ⸀μητρί· Γύναι, ⸀ἴδε ὁ υἱός σου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: ja
  text: そこでイエスは、母と、ご自分が愛しておられた弟子がそばに立っているのを見て、母に言われた。「婦人よ[a]、ご覧なさい。あなたの息子です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「婦人よ」は、敬意を欠く呼びかけではない。「女よ」とも訳せるが、現代日本語では粗く響くことがある。原語は丁重な呼びかけであって、親子間の「お母さん」に当たる語ではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 前の場面を受けた物語の進展とつながりを、自然な現代日本語で示す。
- source_word: ἰδὼν
  choice: 見て
  rationale: アオリスト分詞の時間的な関係を簡潔に表し、イエスが見た後に語ったという流れを保つ。
- source_word: τὴν μητέρα
  choice: 母
  rationale: 文脈上イエスの母であることが明白であり、日本語では同一文中の主語との関係も自然に理解できる。
- source_word: τὸν μαθητὴν
  choice: 弟子
  rationale: 定冠詞のある、ヨハネ福音書の文脈ですでに特定される弟子を指す。日本語では「その」を補わずとも特定性が保たれる。
- source_word: παρεστῶτα
  choice: そばに立っている
  rationale: その場に寄り添うように立っていた様子と、完了形分詞の結果的な状態を自然に表す。
- source_word: ὃν ἠγάπα
  choice: 愛する
  rationale: 未完了過去形の継続的な愛を、日本語の連体修飾で簡潔に表す。愛する主体は文脈上イエスである。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語の歴史的現在を、日本語の物語として不自然にならない過去形で訳す。イエスへの敬意を示す一般的な尊敬表現を用いるが、発言内容に解釈は加えない。
- source_word: Γύναι
  choice: 女の方
  rationale: 成人女性への呼びかけであり、ここでは無礼ではない。直訳的な「女よ」が現代日本語で帯びうる粗暴さを避けつつ、母子関係を明示する「お母さん」などは補わない。
- source_word: ἴδε
  choice: ご覧なさい
  rationale: 注意を促し、目の前の者を新しい関係において示す命令の力と荘重さを保つ。
- source_word: ὁ υἱός σου
  choice: あなたの息子です
  rationale: 名詞句だけでは不自然になりやすい日本語で、弟子を母の息子として示す宣言の力を明確に表す。
theological_decisions:
- issue: イエスが母に用いた呼称 Γύναι の響き
  choice: 本文を「女の方」とし、敬意ある呼びかけであることを脚注で説明する。
  alternative: 「婦人よ」「女よ」「お母さん」
  rationale: 原語は失礼な呼称ではないが、親密な母子呼称でもない。「女よ」は現代日本語では粗く聞こえやすく、「お母さん」は原文にない親密さを加えるため、「女の方」が語義と語調の均衡を最もよく保つ。
- issue: ὁ υἱός σου が示す関係
  choice: 「あなたの息子です」と訳し、弟子が母に対して担うことになる息子の立場を示す。
  alternative: 養子縁組、教会論、またはマリアの象徴的母性を本文に明示する。
  rationale: この一節自体は関係を宣言するが、その神学的範囲を明示的には説明しないため、解釈上の含意を本文へ付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ご覧なさい」により場面の荘重さを保ち、「女の方」については現代読者が冷淡または無礼と誤解しないよう脚注を付した。
