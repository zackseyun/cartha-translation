  to: その時から、ピラトはイエスを釈放しようと努めていた。[a] しかし、ユダヤ人たち[b]は叫んだ。「この者を釈放するなら、あなたはカエサルの友ではない。自分を王とする者は皆、カエサルに逆らっている。」[c]
  rationale: 原文の意味、用語、脚注の位置と内容は維持した。末文だけを「逆らっている」に改め、πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαριの動詞述語をより直接に反映した。脚注aはἐκ τούτουの時間的・原因的曖昧さを適切に保存し、脚注bおよびcのアンカーも各該当箇所に正しく置かれている。
