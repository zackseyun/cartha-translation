id: JHN.19.12
reference: John 19:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: ja
  text: その時から、ピラトはイエスを釈放しようと努めていた。[a] しかし、ユダヤ人たち[b]は叫んだ。「この者を釈放するなら、あなたはカエサルの友ではない。自分を王とする者は皆、カエサルに逆らっている。」[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「このために、ピラトはイエスを釈放しようと努めていた」とも訳せる。ギリシア語の表現は、「その時から」という時間的な意味にも、「このために」という原因の意味にも取れる。
    reason: lexical_alternative
  - marker: b
    text: ヨハネ福音書の「ユダヤ人たち」は、文脈によってはユダヤ民族全体ではなく、ユダヤの指導者たちや、物語中でイエスに敵対する特定の人々を指す。
    reason: cultural_note
  - marker: c
    text: 「カエサルに反対を唱える」または「カエサルに敵対する」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: その時から
  rationale: 直前のやり取り以後の展開を示す時間的用法を本文に採った。ただし、原因を示す「このために」も文法的に可能なので脚注に残した。
- source_word: ἐζήτει
  choice: 努めていた
  rationale: 未完了過去の継続的・反復的な試みを自然な現代日本語で表す。単に「試みた」とすると持続性が弱くなる。
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: 釈放しようと／釈放する
  rationale: 拘束下にある者を公的・司法的に解放する場面なので、「逃がす」や「行かせる」より「釈放する」が正確である。
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: しかし、ユダヤ人たちは
  rationale: 原文の表現を解釈的に「ユダヤ人指導者たち」へ限定せず本文に保持する。文脈上の指示対象については脚注で説明する。
- source_word: ἐκραύγασαν λέγοντες
  choice: 叫んだ
  rationale: 大声での公然たる叫びを自然に表す。日本語では「叫んで言った」と重ねず、直接話法によって λέγοντες の機能を十分に示す。
- source_word: τοῦτον
  choice: この者
  rationale: 指示語の力と敵対的・距離を置く語調を保つ。現代日本語として理解でき、場面の厳粛さにも合う。
- source_word: φίλος τοῦ Καίσαρος
  choice: カエサルの友
  rationale: 属格を素直に表し、個人的友情にも政治的忠誠の呼称にも取り得る原文の含みを保つ。
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: 自分を王とする者は皆
  rationale: 「王だと主張する」と弱めたり、正当性の有無を補ったりせず、「自分を王とする」という原文の構造を保つ。
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: カエサルに逆らう
  rationale: ἀντιλέγω の言語的な反論と実際的な対抗の両面を、この政治的文脈で自然に伝える。「反対を唱える」より広い対立の意味を表す。
theological_decisions:
- issue: ヨハネ福音書における「ユダヤ人たち」の指示対象
  choice: 本文では原文どおり「ユダヤ人たち」とし、文脈上の限定可能性を脚注で示す。
  alternative: 「ユダヤ人指導者たち」または「ユダヤ地方の人々」と訳す。
  rationale: οἱ Ἰουδαῖοι 自体を保持することで原文以上の限定を避ける一方、この表現がユダヤ民族全体を一括して指すとは限らないことを注記し、誤解を防ぐ。
- issue: 「カエサルの友」の性格
  choice: 政治的称号と断定せず、字義的な表現を保持する。
  alternative: 「皇帝への忠臣」または「皇帝の味方」と明示する。
  rationale: 忠誠を問う政治的圧力は明白だが、ここで正式称号が意図されているかは確定できないため、曖昧さを残す。
- issue: ἀντιλέγει の対立の意味
  choice: 「逆らう」と訳し、発言上および政治上の対抗を含み得るようにする。
  alternative: 「反対を唱える」または「敵対する」。
  rationale: 告発の政治的な強さを伝えつつ、反逆罪など原文に明記されない法的分類を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イエス」はこの節のギリシア語では代名詞だが、日本語で指示対象を明確にするため固有名詞で表した。「カエサル」は新約聖書の歴史的呼称として保持し、現代的な「皇帝」へ置き換えなかった。脚注記号は該当表現の直後に配置した。
