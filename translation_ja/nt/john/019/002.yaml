id: JHN.19.2
reference: John 19:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: ja
  text: 兵士たちは、いばらを編んで冠を作り、それをイエスの頭に載せ、紫色の衣を着せた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρατιῶται
  choice: 兵士たち
  rationale: ローマ軍の兵士を指す、この文脈で自然かつ正確な現代日本語。
- source_word: πλέξαντες
  choice: 編んで
  rationale: いばらを組み合わせて冠を作る動作を自然に表し、主動詞に先立つ行為も文脈上明瞭に保つ。
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: いばらを編んで冠を作り
  rationale: 材料を示すἐξと、冠を形成するπλέξαντεςの具体的な動作を、分かりやすい日本語で一体的に表現する。στέφανοςは王権を嘲る場面なので「冠」が適切。
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: それをイエスの頭に載せ
  rationale: 日本語では目的語を補う必要があるため「それを」とし、代名詞の指示対象を明確にするため「イエス」とした。「載せ」は頭上に置く動作に自然。
- source_word: ἱμάτιον πορφυροῦν
  choice: 紫色の衣
  rationale: ἱμάτιονを王服と断定せず広義の衣服として訳し、πορφυροῦνの色と王権を思わせる含意をそのまま保つ。
- source_word: περιέβαλον αὐτόν
  choice: 着せた
  rationale: 衣服を人の身にまとわせる使役的な動作を、簡潔で自然な日本語にした。
theological_decisions:
- issue: 兵士たちの行為における王権嘲弄のイメージ
  choice: 「冠」「紫色の衣」と具体的な行為だけを訳し、嘲りとの説明は加えない。
  alternative: 「王に見立てて嘲り」などの解釈を本文に補う。
  rationale: 王権を嘲る意味は文脈と象徴物から伝わるが、この節自体は行為を叙述しており、解釈的説明を加える必要はない。
- issue: αὐτοῦ／αὐτόνの日本語での指示対象
  choice: 最初の代名詞を「イエス」と明示し、後半は自然な日本語の目的語省略を用いる。
  alternative: 両方を「彼」と明示する。
  rationale: 日本語の「彼」はこの物語文ではやや不自然であり、「イエス」と明示すれば指示対象が明瞭になる。後半は同じ対象への連続動作なので省略しても曖昧ではない。
translation_notes:
  register: 明瞭な現代標準日本語。叙述の簡潔さと品位を保ちつつ、「紫色の衣」としてἱμάτιονを「王服」「長衣」などに過度に限定しない。
