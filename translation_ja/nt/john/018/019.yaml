  text: Ὁ οὖν ἀρχιερεὺς ἠρώτησεν τὸν Ἰησοῦν περὶ τῶν μαθητῶν αὐτοῦ καὶ περὶ τῆς διδαχῆς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/019.yaml
  text: So the high priest questioned Jesus about his disciples and about his teaching[a].
translation:
  language: ja
  text: そこで、大祭司はイエスの弟子たちとその教えについて、イエスに質問した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「尋ねた」。ギリシア語の動詞は「尋ねた」とも「質問した」とも訳せる。ここでは公的な審問の場面を踏まえて「質問した」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語の展開を示す接続辞として、推論を強めすぎず、現代日本語で自然な「そこで」とした。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: ユダヤ教の祭司職を表す定訳。文脈上の人物名を補わず、原文の単数・定冠詞付きの職名をそのまま訳した。
- source_word: ἠρώτησεν
  choice: 質問した
  rationale: 「尋ねた」「質問した」の双方を表し得る語。ここでは公的な審問の場面を踏まえつつ、「問いただした」ほど強い含意を加えない表現を選んだ。
- source_word: περὶ τῶν μαθητῶν αὐτοῦ
  choice: 弟子たちのこと
  rationale: περίと属格が質問の話題を示す。「弟子」は福音書における μαθητής の確立した訳語で、教師との関係を保つ。
- source_word: περὶ τῆς διδαχῆς αὐτοῦ
  choice: その教えについて
  rationale: διδαχήを、後代の体系的な含意を帯びやすい「教理」ではなく、明瞭で自然な「教え」とした。二度目の αὐτοῦ はイエスを指すことを「その」で明示した。
theological_decisions:
- issue: 文脈ではアンナスが関わる一方、原文がἀρχιερεύςという職名を用いていること
  choice: 原文どおり「大祭司」と訳す
  alternative: 「大祭司アンナス」と人物名を補う、または「祭司長」とする
  rationale: 歴史的事情を本文内で調整せず、福音書記者の叙述を保持する。人物名の補足や別の職名への変更を避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、法的・公的な場面性は保ちながらも、「尋問した」「問いただした」のような原語以上に強い語感は避けた。
