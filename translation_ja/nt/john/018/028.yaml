  to: そこで彼らは、イエスをカヤパのもとから総督官邸[a]へ連れて行った。時は早朝であった。彼ら自身は、身を汚すことなく過越の食事をするため、総督官邸に入らなかった。
  rationale: 本文中の「人々」を原文により近い「彼ら」に改め、目的節を「身を汚すことなく過越の食事をするため」と再構成した。これにより、儀礼的不浄を避けることと過越を食べることの目的関係を自然に保つ。脚注b・cは本文の該当語に付す必要があるため、本文内にアンカーを配置した。
