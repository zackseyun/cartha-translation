id: JHN.18.28
reference: John 18:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄγουσιν οὖν τὸν Ἰησοῦν ἀπὸ τοῦ Καϊάφα εἰς τὸ πραιτώριον· ἦν δὲ πρωΐ· καὶ αὐτοὶ οὐκ εἰσῆλθον εἰς τὸ πραιτώριον, ἵνα μὴ μιανθῶσιν ⸀ἀλλὰ φάγωσιν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/028.yaml
  text: So they led Jesus from Caiaphas into the governor’s headquarters[a]. Now it was early morning. They themselves did not enter the headquarters, so that they would not be defiled[c][b], but could eat the Passover.
translation:
  language: ja
  text: そこで彼らは、イエスをカヤパのもとから総督官邸[a]へ連れて行った。時は早朝であった。彼ら自身は、身を汚すことなく過越の食事をするため、総督官邸に入らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「総督官邸」は「プラエトリウム」とも訳せる。ローマ総督の公邸であり、裁判と行政の拠点でもあった。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄγουσιν οὖν
  choice: そこで人々は…連れて行った
  rationale: οὖνの物語を進める接続を「そこで」で示し、歴史的現在Ἄγουσινは自然な日本語の過去形とした。主語は文脈上の人々を補った。
- source_word: πραιτώριον
  choice: 総督官邸
  rationale: ローマ総督の公的な居所であり裁判・行政の場でもあったことを、簡潔で自然な日本語で表す。
- source_word: πρωΐ
  choice: 早朝
  rationale: 一日の早い時間を示す語義を簡潔に表し、「夜明け」と限定しすぎない。
- source_word: αὐτοὶ
  choice: 彼ら自身
  rationale: 強意を保ち、イエスを官邸へ連行しながら自分たちは入らなかったという対照を示す。
- source_word: μιανθῶσιν
  choice: 汚れて
  rationale: ここでは儀礼上の汚れを指すが、本文では原語の簡潔な表現を保ち、文化的意味を脚注で明示する。
- source_word: φάγωσιν τὸ πάσχα
  choice: 過越の食事をすることができなくならない
  rationale: 目的節が示す、汚れを避けて食べられる状態を保つ意図を自然な日本語で表す。「過越」が狭義の食事か祭りの期間中の食事・祭儀を広く指すかは脚注で留保する。
- source_word: Καϊάφα
  choice: カヤパ
  rationale: 日本語聖書で定着した人名表記を用いる。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 日本語で定着した人名表記を用いる。
theological_decisions:
- issue: ヨハネ受難記事の時系列に関わる「過越を食べる」の範囲
  choice: 本文を「過越の食事をする」とし、具体的な範囲は脚注で未確定のまま示す。
  alternative: 「過越の食事を食べる」または「過越祭の供え物を食べる」と限定する。
  rationale: φάγωσιν τὸ πάσχαの指示対象が過越の食事そのものか、過越祭中の食事・祭儀をより広く含むかは議論があるため、受難週の時系列を翻訳で一義的に決めない。
translation_notes:
  register: 明瞭な現代標準語を用い、叙述は簡潔で品位ある調子とした。「総督官邸」は理解しやすさを優先し、専門語は脚注に置いた。原文の強意と、過越をめぐる解釈上の幅を保持した。
