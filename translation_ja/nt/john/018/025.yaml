source:
  edition: SBLGNT
  text: Ἦν δὲ Σίμων Πέτρος ἑστὼς καὶ θερμαινόμενος. εἶπον οὖν αὐτῷ· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν αὐτοῦ εἶ; ⸀ἠρνήσατο ἐκεῖνος καὶ εἶπεν· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/025.yaml
  text: Simon Peter was standing and warming himself. So they said to him[a], “You are not also one of his disciples, are you?” He denied it and said, “I am not.”
translation:
  language: ja
  text: シモン・ペトロは立って身を暖めていた。そこで人々は彼に[a]、「あなたも、あの人の弟子の一人ではないでしょうね」と言った。ペトロはそれを否定して、「違う」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたもあの人の弟子の一人ではないのですか」。ギリシア語のμήを用いた疑問文は、否定の答えを予想しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦν δὲ
  choice: シモン・ペトロは…いた
  rationale: δέは物語を進める軽い接続であり、日本語では文脈上、明示的な接続語を置かなくても自然に機能するため、過度な対比や時間性を加えなかった。
- source_word: ἑστὼς καὶ θερμαινόμενος
  choice: 立って、暖まっていた
  rationale: 継続中の姿勢と動作を自然な現代日本語で表した。「火に」はこの節には明示されていないため補わない。
- source_word: εἶπον οὖν αὐτῷ
  choice: そこで人々は彼に…言った
  rationale: οὖνが示す物語上のつながりを「そこで」で表した。複数動詞の主語は文脈上の人々だが、原文では明示されないため一般的な「人々」とした。
- source_word: Μὴ καὶ σὺ ... εἶ;
  choice: あなたも…ではないでしょうね
  rationale: μήによって否定の答えを予想する問いであることを、日本語の「ではないでしょうね」で保った。καὶ σὺは「あなたも」とした。
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ
  choice: あの人の弟子の一人
  rationale: ἐκ＋属格の集団への所属を「一人」で自然に表した。発話者側の距離を伴う三人称を「あの人」とした。
- source_word: ἠρνήσατο ἐκεῖνος
  choice: ペトロはそれを否定して
  rationale: 否定した内容、すなわち問いかけを「それ」で受けた。ἐκεῖνοςの軽い強調は、曖昧さを避ける固有名の再提示で自然に伝えた。
- source_word: Οὐκ εἰμί
  choice: 違う
  rationale: 直訳的な「私はそうではない」よりも、問いへの簡潔で強い否定として自然な日本語を選び、弟子であることの否定という省略内容を広げずに保った。
theological_decisions:
- issue: ペトロの否認の範囲
  choice: イエスの弟子の一人であることへの簡潔な否定として訳す
  alternative: 「私はあの人の弟子ではない」と内容を明示して訳す
  rationale: 原文のΟὐκ εἰμίは問いを受けた省略的で短い答えであり、より広い神学的否認へと展開せず、その簡潔さを保つ。
translation_notes:
  register: 明瞭で現代的ながら品位のある物語文とした。問いの圧力と否定回答への予想を保ちつつ、原文にない「火」や説明的な弟子否認の文言は補っていない。
