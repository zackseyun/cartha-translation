source:
  edition: SBLGNT
  text: Σίμων οὖν Πέτρος ἔχων μάχαιραν εἵλκυσεν αὐτὴν καὶ ἔπαισεν τὸν τοῦ ἀρχιερέως δοῦλον καὶ ἀπέκοψεν αὐτοῦ τὸ ⸀ὠτάριον τὸ δεξιόν. ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/010.yaml
  text: Then Simon Peter[a], having a sword, drew it and struck the high priest’s servant and cut off his right ear. Now the servant’s name was Malchus.
translation:
  language: ja
  text: そこで、剣を持っていたシモン・ペテロはそれを抜き、大祭司の奴隷[a]を打って、その右の耳を切り落とした。その奴隷の名はマルコであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大祭司の召使い」とも訳せる。ギリシア語のドゥーロスは、文脈により「奴隷」または「召使い」を意味する。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語の進展を自然に示し、強すぎる論理的帰結にはしない。
- source_word: ἔχων μάχαιραν
  choice: 剣を持っていた
  rationale: μάχαιραは短剣を含み得るが、種類を限定しない広い訳語「剣」が文脈に適する。分詞は自然な連体表現とした。
- source_word: εἵλκυσεν αὐτήν
  choice: それを抜き
  rationale: 武器を鞘などから引き抜く動作を、簡潔で自然な日本語で表す。
- source_word: ἔπαισεν
  choice: 斬りかかって
  rationale: 剣による攻撃であり、続く耳の切断とのつながりを自然に示す。動詞自体の基本的な意味である「打つ・襲う」を過度に細かく描写しない。
- source_word: τὸν τοῦ ἀρχιερέως δοῦλον
  choice: 大祭司の奴隷
  rationale: δοῦλοςが示す従属的な身分と、大祭司への所属関係を明確に伝える。「召使い」も文脈上可能なので脚注に残す。
- source_word: ἀπέκοψεν
  choice: 切り落とした
  rationale: 切ることによって身体の一部を分離したという結果を明確に表す。
- source_word: ὠτάριον τὸ δεξιόν
  choice: 右の耳
  rationale: 指小形ὠτάριονはここでは通常の「耳」を意味し、「耳たぶ」と限定する根拠はない。
- source_word: ἦν δὲ ὄνομα τῷ δούλῳ Μάλχος
  choice: その奴隷の名はマルコスであった
  rationale: δέによる補足的な人物紹介を、日本語では独立した文として自然に表した。Μάλχοςは慣用的に「マルコス」と音写した。
theological_decisions:
- issue: δοῦλοςの身分語としての訳し方
  choice: 奴隷
  alternative: 召使い
  rationale: 大祭司に属する者として記されているため、法的・社会的従属を覆い隠さない「奴隷」を本文に置く。一方、家内奉仕者としての役割に焦点を当てた「召使い」も文脈上可能なので脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。叙述の速度を損なわないよう簡潔にしつつ、δοῦλοςの社会的含意は本文と脚注で保持した。
