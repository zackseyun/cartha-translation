  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Εἰ μὴ ἦν οὗτος ⸂κακὸν ποιῶν⸃, οὐκ ἄν σοι παρεδώκαμεν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/030.yaml
  text: They answered and said to him[a], “If this man were not an evildoer, we would not have handed him over to you.”
translation:
  language: ja
  text: 彼らは答えて言った。「もしこの人が悪事を働く人でなかったなら、私たちはこの人をあなたに引き渡さなかったでしょう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: 彼らは答えて言った
  rationale: 二つの動詞から成る語りの定型表現を保ちつつ、現代日本語でも理解できる形にした。
- source_word: Εἰ μὴ ἦν
  choice: もし…ていなかったなら
  rationale: 過去の事実に反する条件を明確に表す。
- source_word: οὗτος
  choice: この人
  rationale: イエスを指す指示語の距離感を保ち、「こいつ」ほどの侮蔑は加えない。
- source_word: κακὸν ποιῶν
  choice: 悪事を働いて
  rationale: 字義的には「悪を行う」であり、人への固定的な呼称よりも行為を述べる分詞の力を保つ。「悪事を働く」は自然な日本語で、一般的な非難としての幅も残す。
- source_word: οὐκ ἄν σοι παρεδώκαμεν αὐτόν
  choice: あなたに引き渡しはしなかったでしょう
  rationale: 反実仮想の帰結を表し、司法的文脈におけるπαραδίδωμιを「引き渡す」と訳した。助詞「は」で強い否定の含みを自然に示す。
theological_decisions:
- issue: 告発者たちがイエスについて述べた非難の性質
  choice: 「悪事を働いて」とし、一般的な悪行の非難として訳す。
  alternative: 「悪人で」「犯罪者で」
  rationale: κακὸν ποιῶνは特定の法的罪名ではなく、文字どおりには悪を行うことを述べる。曖昧で包括的な告発を保ち、原文にない具体的な犯罪性を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、法廷場面にふさわしい端正さを保った。「答えて言った」はやや形式的だが、原文の二重表現を意図的に保持している。
