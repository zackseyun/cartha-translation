  text: Then Peter denied it again[a], and immediately a rooster crowed.
translation:
  language: ja
  text: そこで、ペテロは再び否定した[a]。すると、すぐに鶏が鳴いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ペテロは再びそれを否定した」。ギリシア語では否定した対象が明示されていないが、直前の問いから補うことができる。
