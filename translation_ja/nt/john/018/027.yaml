lexical_decisions:
- source_word: πάλιν
  choice: 再び
  rationale: ペテロの否定が繰り返されたことを、簡潔で自然な現代日本語で示す。
- source_word: οὖν
  choice: そこで
  rationale: 直前の問いを受けた応答という文脈上のつながりと、物語の進行を示す。強い因果関係を示す「それゆえ」より自然である。
- source_word: ἠρνήσατο
  choice: 否定した
  rationale: 目的語のないギリシア語の形を保ちつつ、直前の問いに対する否定として自然に理解できる訳語である。「知らないと言った」などと内容を限定しない。
- source_word: Πέτρος
  choice: ペテロ
  rationale: 日本語聖書で広く定着した人名表記を用いる。
- source_word: καὶ
  choice: すると
  rationale: 単なる接続に加え、否定の直後に次の出来事が起きたという自然な物語上の連続を表す。
- source_word: εὐθέως
  choice: すぐに
  rationale: 二つの出来事の時間的な近接を、明瞭で現代的な日本語で表す。
- source_word: ἀλέκτωρ
  choice: 鶏
  rationale: 雄鶏を指すが、日本語では鳴き声との組み合わせにより意味が明瞭で、「鶏が鳴いた」が自然である。
- source_word: ἐφώνησεν
  choice: 鳴いた
  rationale: 語自体は広く声や音を発することを表すが、主語が鶏であるため、日本語の慣用的な表現を採る。
theological_decisions:
- issue: 否定の目的語が明示されていないこと
  choice: 本文では「否定した」として目的語を補わない
  alternative: 「それを否定した」
  rationale: ギリシア語本文には目的語がなく、直前の問いから内容が補われる。日本語でも目的語なしで自然に通じるため、原文の省略と曖昧さを保つ。
translation_notes:
  register: 明快で簡潔な現代標準日本語。叙事の緊迫感を保つため短い二文とし、「そこで」「すると」「すぐに」によって出来事の連続を自然に示した。
