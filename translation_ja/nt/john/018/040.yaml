lexical_decisions:
- source_word: ἐκραύγασαν
  choice: 叫んで
  rationale: 大声で叫ぶことを表す語であり、現代日本語として自然にその強さを伝える。
- source_word: οὖν
  choice: そこで
  rationale: 直前のピラトの問いに対する群衆の応答という論理的・物語的つながりを自然に示す。
- source_word: πάλιν
  choice: 再び
  rationale: 反復を明示する原文の意味を直接保つ。
- source_word: λέγοντες
  choice: 言った
  rationale: ἐκραύγασανと組み合わせて「叫んで言った」とし、多少の重なりを残しながら原文の分詞構文を自然な日本語にする。
- source_word: Μὴ τοῦτον ἀλλὰ τὸν Βαραββᾶν
  choice: この人ではなく、バラバを
  rationale: τοῦτονの指示性を「この人」で保ち、動詞が省略された強い対比表現を日本語でも簡潔に再現する。
- source_word: Βαραββᾶν / Βαραββᾶς
  choice: バラバ
  rationale: 日本語聖書で広く定着した音写を用いる。
- source_word: ἦν δὲ
  choice: バラバは……であった
  rationale: δέが導く説明的な背景情報を、不要な接続語を加えず自然な日本語で示す。
- source_word: λῃστής
  choice: 強盗
  rationale: 基本的な語義を明瞭に表す。文脈によってあり得る「盗賊」や暴力的反乱者の含みは、本文で断定せず脚注に残す。
theological_decisions:
- issue: バラバを表すλῃστήςの意味範囲
  choice: 強盗
  alternative: 盗賊、または暴力的な反乱者
  rationale: この節だけでは政治的反乱者という意味に限定できないため、本文では基本的な語義を採用する。一方、当時の文脈で暴力的な反乱活動に関わる者を指し得る語義上の幅は脚注で保持する。
