id: JHN.18.35
reference: John 18:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ Πιλᾶτος· Μήτι ἐγὼ Ἰουδαῖός εἰμι; τὸ ἔθνος τὸ σὸν καὶ οἱ ἀρχιερεῖς παρέδωκάν σε ἐμοί· τί ἐποίησας;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/035.yaml
  text: Pilate answered[a], “I am not a Jew, am I? Your own nation and the chief priests handed you over to me. What have you done?”
translation:
  language: ja
  text: ピラトは答えた。「私がユダヤ人[a]だとでもいうのか。あなた自身の民と祭司長たちが、あなたを私に引き渡したのだ。あなたは何をしたのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ユダヤ地方の人」。ギリシア語は文脈により、民族・宗教的な「ユダヤ人」または地域的な「ユダヤ地方の人」を指しうる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 対話における応答を示す標準的な物語表現であり、自然で明確な日本語。
- source_word: Μήτι ἐγὼ Ἰουδαῖός εἰμι;
  choice: 私がユダヤ人だとでもいうのか
  rationale: 否定の答えを予期するμήτιの修辞的な響きを、現代日本語で自然な反語として表した。
- source_word: Ἰουδαῖός
  choice: ユダヤ人
  rationale: ここではピラトが自分とイエスおよび告発者たちとの民族的・国民的な違いを述べており、「ユダヤ人」が文脈に最も適する。
- source_word: τὸ ἔθνος τὸ σὸν
  choice: あなたの同胞
  rationale: ἔθνοςはここでイエスが属する民を集合的に指す。「同胞」はτὸ σὸνの帰属の強調を自然に伝え、「国民」より会話として明瞭である。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: エルサレムの祭司指導層を指す、日本語聖書で定着した正確な表現。
- source_word: παρέδωκάν σε ἐμοί
  choice: あなたを私に引き渡した
  rationale: 当局の手に渡すという司法的な意味を保ち、「裏切った」という含意を不必要に加えない。
- source_word: τί ἐποίησας
  choice: あなたは何をしたのか
  rationale: アオリストの完結した行為への問いを、日本語では自然な過去形で表した。
theological_decisions:
- issue: ヨハネ福音書におけるἸουδαῖοςの訳語
  choice: ユダヤ人
  alternative: ユダヤ地方の人
  rationale: この節ではピラトの修辞的な問いと、続く「あなたの同胞」が民族的・国民的な対比を示すため、地域名に限定するより「ユダヤ人」が適切である。
translation_notes:
  register: ピラトの距離を置く調子と詰問の鋭さを保ちつつ、現代の一般読者に明瞭な、簡潔で品位ある口調とした。原文にない敬語や説明は加えていない。
