  text: εἱστήκεισαν δὲ οἱ δοῦλοι καὶ οἱ ὑπηρέται ἀνθρακιὰν πεποιηκότες, ὅτι ψῦχος ἦν, καὶ ἐθερμαίνοντο· ἦν δὲ ⸂καὶ ὁ Πέτρος μετ’ αὐτῶν⸃ ἑστὼς καὶ θερμαινόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/018.yaml
  text: The servants and the officers were standing there[a], having made a charcoal fire because it was cold, and they were warming themselves[b]. Peter also was standing with them and warming himself.
translation:
  language: ja
  text: 奴隷たち[a]と役人たち[b]は、寒かったので炭火をおこし、そこに立って暖まっていた。ペトロも彼らと一緒に立って、暖まっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「召使いたち」とも訳せる。原語は、隷属的な身分にある者を指しうる。
    reason: lexical_alternative
  - marker: b
    text: 「警備の者たち」とも訳せる。原語は公的な任務を担う従者を指し、ここでは神殿または大祭司のもとに属する者たちであった可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: 奴隷たち
  rationale: 高位祭司の邸宅に属する奉公人を指す文脈だが、語が含む隷属的な身分を曖昧にしないため「奴隷」とした。
- source_word: ὑπηρέται
  choice: 下役たち
  rationale: 公的な権限のもとで仕え、場合によっては執行・警備の任務も担う者を指す。「役人」ほど独立した官職を連想させず、「警備の者」ほど役割を限定しない「下役」とした。
- source_word: ἀνθρακιὰν
  choice: 炭火
  rationale: 木炭を燃やした火を具体的に表し、ヨハネ福音書の物語上重要な細部も保つ。
- source_word: πεποιηκότες
  choice: おこし
  rationale: 火をすでに用意し、その結果として暖まっているという完了分詞の関係を、自然な日本語の動作の連続で表した。
- source_word: ὅτι ψῦχος ἦν
  choice: 寒かったので
  rationale: 炭火をおこして暖まる理由を示すὅτιの因果関係を明確にした。
- source_word: ἐθερμαίνοντο
  choice: 暖まっていた
  rationale: 未完了過去が示す継続中の動作と、中動態的な「自分たちが暖まる」という意味を自然に表した。
- source_word: ἦν δὲ καὶ ὁ Πέτρος μετ’ αὐτῶν ἑστὼς
  choice: ペトロも彼らと一緒に立って
  rationale: καίの付加的な強調を「も」で示し、ペトロが同じ一団の中に立っていたという位置関係を保った。
- source_word: θερμαινόμενος
  choice: 暖まっていた
  rationale: ペトロの継続中の動作を、前半との語の反復を保って訳した。
- source_word: δέ
  choice: （明示せず）
  rationale: ここでは弱い接続を示すため、日本語で不自然な「さて」「しかし」を加えず、文脈上のつながりに委ねた。
theological_decisions: []
