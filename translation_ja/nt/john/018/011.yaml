id: JHN.18.11
reference: John 18:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς τῷ Πέτρῳ· Βάλε τὴν ⸀μάχαιραν εἰς τὴν θήκην· τὸ ποτήριον ὃ δέδωκέν μοι ὁ πατὴρ οὐ μὴ πίω αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/011.yaml
  text: So Jesus said to Peter[a], “Put the sword into its sheath[b]. Shall I not drink the cup that the Father has given me?”
translation:
  language: ja
  text: そこでイエスはペトロに言われた。「剣をさやに納めなさい。父がわたしにお与えになった杯を、わたしが飲まずにいられようか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「杯」は、神から定められた苦難や行く末を表す聖書的な比喩。ゲツセマネでの祈りも参照（マタイ26:39、マルコ14:36、ルカ22:42）。
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語の展開と応答を、自然な現代日本語で示す。
- source_word: Βάλε
  choice: 納めなさい
  rationale: この文脈では、剣をさやの中へ戻す命令を表す。「入れなさい」より自然で、動作も明確である。
- source_word: μάχαιραν
  choice: 剣
  rationale: 刃物の種類を必要以上に限定せず、逮捕場面で一般に理解しやすい訳語を用いる。
- source_word: θήκην
  choice: さや
  rationale: 剣を収める物を指す自然で明瞭な現代日本語。
- source_word: τὸ ποτήριον
  choice: 杯
  rationale: 神から割り当てられた苦難や定めを表す聖書的比喩を、説明的に言い換えず保持する。
- source_word: δέδωκέν μοι
  choice: わたしにお与えになった
  rationale: 完了形の、すでに与えられて今なお効力を持つ含意を保ちつつ、父に対する日本語として自然な敬意を示す。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 原文に明示されない所有代名詞「わたしの」を加えず、ヨハネ福音書の呼称を保つ。
- source_word: οὐ μὴ πίω αὐτό;
  choice: わたしが飲まずにいられようか
  rationale: 肯定の答えを強く期待する修辞疑問として、「当然飲む」という決意を自然な日本語で伝える。
theological_decisions:
- issue: 「杯」の意味
  choice: 本文では「杯」という比喩を保持する。
  alternative: 「苦難」「定め」「神の怒りの杯」などと明示する。
  rationale: 文脈上、父から定められた苦難と使命を指すが、この節自体は意味をそれ以上限定していないため、神学的な幅と緊張を残す。
- issue: 父へのイエスの従順
  choice: 父から与えられた杯を進んで飲むという修辞疑問として訳す。
  alternative: 「飲まなければならない」と義務表現に置き換える。
  rationale: 原文は単なる外的強制ではなく、父の意志に従うイエスの確固たる意志を修辞疑問で示しているため、その形式と力を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「言われた」「お与えになった」はイエスと父に関する叙述として自然な敬語を用い、命令は威圧的になりすぎない「納めなさい」とした。脚注標識を本文末に置き、杯の比喩全体を注解する。
