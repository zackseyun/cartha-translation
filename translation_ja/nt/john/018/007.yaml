  text: πάλιν οὖν ⸂ἐπηρώτησεν αὐτούς⸃· Τίνα ζητεῖτε; οἱ δὲ εἶπαν· Ἰησοῦν τὸν Ναζωραῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/007.yaml
  text: So he asked them again[a], “Whom are you seeking?” And they said, “Jesus the Nazarene.”
translation:
  language: ja
  text: そこでイエスはもう一度彼らに尋ねた。「だれを捜しているのか。」彼らは言った。「ナザレのイエス[a]です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ナザレ人イエス」。ギリシア語は「イエス、そのナザレ人」。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: そこで…もう一度
  rationale: πάλινの反復を「もう一度」で明示し、οὖνは直前のやり取りを受ける自然な物語上の接続として「そこで」とした。
- source_word: ἐπηρώτησεν αὐτούς
  choice: 彼らに尋ねた
  rationale: 直接問いかける動作を、現代日本語で自然かつ品位のある「尋ねた」で表した。日本語では対象を「彼らに」とするのが自然である。
- source_word: Τίνα ζητεῖτε
  choice: だれを捜しているのか
  rationale: Τίναの目的格を「だれを」で保持し、ζητεῖτεの現在の継続的な探索を「捜している」で表した。人を探す文脈なので「捜す」を採用した。
- source_word: οἱ δὲ εἶπαν
  choice: 彼らは言った
  rationale: δέはここでは強い逆接よりも対話の進行を示すため、日本語で不要な接続語を加えず簡潔に訳した。
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: ナザレ人イエス
  rationale: Ναζωραῖοςを出身地に結びつく呼称として保ちつつ、日本語で簡潔な「ナザレ人」とした。「ナザレのイエス」も自然な訳なので脚注に示した。
theological_decisions:
- issue: Ναζωραῖοςをイエスの呼称としてどう訳すか
  choice: ナザレ人イエス
  alternative: ナザレのイエス
  rationale: これは主として地理的・歴史的な呼称であり、特定の教理的含意を加えない。「ナザレ人」はギリシア語の形を比較的よく保持し、「ナザレのイエス」は意味を自然に表す代案である。
translation_notes:
  register: 明瞭な現代標準日本語。会話は自然さを保ちつつ、くだけすぎない表現とした。
