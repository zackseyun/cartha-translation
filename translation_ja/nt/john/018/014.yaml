id: JHN.18.14
reference: John 18:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦν δὲ Καϊάφας ὁ συμβουλεύσας τοῖς Ἰουδαίοις ὅτι συμφέρει ἕνα ἄνθρωπον ⸀ἀποθανεῖν ὑπὲρ τοῦ λαοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/014.yaml
  text: Caiaphas was the one who had advised the Jews that it was better for one man to die for the people[a][b].
translation:
  language: ja
  text: カイアファは、民のために[b]一人の人が死ぬほうがよいとユダヤ人たち[a]に助言した人物であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈によっては「ユダヤ人の指導者たち」または「ユダヤ地方の人々」とも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「民に代わって」とも訳せる。この表現は文脈上、代表または犠牲の意味合いを帯びる可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: カイアファは……人物であった
  rationale: δέはここでは弱い接続・話題再開の働きであり、強い逆接や明示的な時間表現を加えず、日本語では自然な文の流れに委ねた。
- source_word: Καϊάφας
  choice: カイアファ
  rationale: 人名を日本語の慣用的な形で音写した。
- source_word: ὁ συμβουλεύσας
  choice: 助言した人物
  rationale: 冠詞付きアオリスト分詞が、カイアファを以前の助言によって特定していることを表す。日本語では文脈上、完了的な先行性が自然に理解される。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たち
  rationale: 原文には指導者層へ限定する語がないため、基本的な訳語を本文に置き、ヨハネ文書での文脈的な指示範囲は脚注に示した。
- source_word: ὅτι συμφέρει
  choice: ほうがよいと
  rationale: συμφέρειの利益・得策という意味を、政治的な判断の文脈に合う自然な現代日本語で表した。
- source_word: ἕνα ἄνθρωπον
  choice: 一人の人
  rationale: 数の対比を保持しつつ、ἄνθρωποςの通常の意味を過度に男性限定的にせず表した。文脈上、その一人が男性であるイエスを指すことは明らかである。
- source_word: ἀποθανεῖν
  choice: 死ぬ
  rationale: 不定詞の意味を簡潔にそのまま表した。
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: 民のために
  rationale: ὑπέρの受益的・代表的な幅を保つ簡潔な表現であり、文脈にある犠牲的・身代わり的な響きを排除しない。
- source_word: λαοῦ
  choice: 民
  rationale: この節はἔθνοςではなくλαόςを用いるため、「国民」ではなく、聖書的文脈にもなじむ明瞭な「民」とした。
theological_decisions:
- issue: ὑπὲρ τοῦ λαοῦに含まれ得る贖罪・身代わりの含意
  choice: 民のために
  alternative: 民に代わって
  rationale: ὑπέρには受益・代表の意味があり、文脈上は犠牲的または身代わり的な響きもあり得る。しかし、この節自体はカイアファの政治的助言を回顧しているため、本文で特定の教理的意味に限定せず、脚注で含意を示した。
- issue: ヨハネ文書におけるτοῖς Ἰουδαίοιςの指示対象
  choice: ユダヤ人たち
  alternative: ユダヤ人の指導者たち／ユダヤ地方の人々
  rationale: 原文は無限定のἸουδαῖοιを用いる。文脈上の指示対象には議論があるため、本文は形式的対応を保ち、可能な限定的理解を脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「民」はλαόςを「国民」と区別し、ヨハネの神学的な響きを損なわない語として採用した。脚注記号は、それぞれ対象語句の直後に配置した。
