  text: ἐξῆλθεν οὖν ὁ Πιλᾶτος ⸀ἔξω πρὸς αὐτοὺς καὶ ⸀φησίν· Τίνα κατηγορίαν φέρετε ⸀κατὰ τοῦ ἀνθρώπου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/029.yaml
  text: So Pilate went outside to them and said, “What accusation do you bring against this man?”
translation:
  language: ja
  text: そこでピラトは彼らのところへ外に出て、言った。「この人に対して、どのような訴えを申し立てているのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν … ἔξω
  choice: 外に出て
  rationale: 動詞と副詞がともに示す、内部から外部への移動を、重複感のない自然な日本語で表した。
- source_word: οὖν
  choice: そこで
  rationale: 直前の状況を受けた結果と物語の進行の両方を自然に示す。
- source_word: πρὸς αὐτούς
  choice: 彼らのところへ
  rationale: 対格を伴う πρός が示す、相手のもとへの移動を明確に表す。
- source_word: φησίν
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語文として自然な過去形にした。
- source_word: Τίνα κατηγορίαν
  choice: どのような訴えを
  rationale: κατηγορία の法的な意味を保ちつつ、日本語で尋問として自然に響く表現を選んだ。
- source_word: φέρετε
  choice: 持って来たのか
  rationale: 告発を当局の前に提出するという φέρω の具体的な比喩を保ち、到着済みの場面に合う日本語にした。
- source_word: κατὰ τοῦ ἀνθρώπου τούτου
  choice: この人に対して
  rationale: 司法的な κατά の対抗関係を「に対して」で示し、ἄνθρωπος は個人を指す自然で中立的な「人」とした。
