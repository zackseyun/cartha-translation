id: JHN.18.39
reference: John 18:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔστιν δὲ συνήθεια ὑμῖν ἵνα ἕνα ⸂ἀπολύσω ὑμῖν⸃ ἐν τῷ πάσχα· βούλεσθε οὖν ⸄ἀπολύσω ὑμῖν⸅ τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/039.yaml
  text: But you have a custom that I release one man for you at the Passover[a]. So do you want me to release to you the King of the Jews?
translation:
  language: ja
  text: しかし、あなたがたには、過越の祭りに私があなたがたのために一人を釈放するという慣例がある。そこで、私があなたがたのために「ユダヤ人の王」[a]を釈放することを望むか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人々の王」。ギリシア語は文脈によって「ユダヤ人」とも「ユダヤ地方の人々」とも訳し得るが、ここでは受難物語で用いられる定型的な称号である。
    reason: alternative_reading
lexical_decisions:
- source_word: συνήθεια
  choice: 慣例
  rationale: 祭りと裁判の場で社会的に定着した行為を表すため、「習慣」よりも公的な響きのある「慣例」とした。
- source_word: ἵνα ἕνα ἀπολύσω ὑμῖν
  choice: 私が一人を釈放する
  rationale: ἕναは文脈上、一人の囚人を指す。「一人」と明示し、ἵνα節は慣例の内容として自然な日本語にした。
- source_word: ἀπολύω
  choice: 釈放する
  rationale: 拘束されている囚人を総督が自由にする司法的文脈に最も適し、二つの用例を同じ語で訳した。
- source_word: ἐν τῷ πάσχα
  choice: 過越の祭りの時に
  rationale: 祭りの期間・機会に行われる慣例という時間的意味を、現代日本語で自然に表した。
- source_word: βούλεσθε οὖν
  choice: それでは、…釈放してほしいか
  rationale: οὖνの推論的な移行を「それでは」で示し、βούλεσθεは相手の意向を尋ねる自然な表現にした。
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: 「ユダヤ人の王」
  rationale: 受難物語でイエスに付された王号・告発文句としての定型性を引用符で示した。Ἰουδαίωνはここでは広く「ユダヤ人」と訳し、地域的な別解は脚注に残した。
theological_decisions:
- issue: τῶν Ἰουδαίωνが民族・宗教集団を指すか、ユダヤ地方の住民を指すか
  choice: ユダヤ人の王
  alternative: ユダヤ地方の人々の王
  rationale: ヨハネの受難物語では、この句はイエスに対する王号・メシア的告発の定型句として機能しているため、伝統的かつ文脈上自然な「ユダヤ人の王」を本文に置いた。ただし、ギリシア語Ἰουδαῖοιには地域的意味もあり得るため、その曖昧さを脚注で示した。
translation_notes:
  register: 明快で現代的ながら、裁判場面にふさわしい品位を保った。「慣例」「釈放」により公的・司法的な文脈を示し、「あなたがた」を用いて複数の聞き手を明確にした。
