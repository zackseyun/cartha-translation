id: JHN.18.31
reference: John 18:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸀ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς, καὶ κατὰ τὸν νόμον ὑμῶν κρίνατε αὐτόν. ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Ἡμῖν οὐκ ἔξεστιν ἀποκτεῖναι οὐδένα·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/031.yaml
  text: So Pilate said to them[a], “Take him yourselves and judge him according to your law.” The Jews said to him, “It is not lawful for us to put anyone to death.”
translation:
  language: ja
  text: そこでピラトは彼らに言った。「あなたがたでこの人を引き取り、自分たちの律法に従って裁きなさい。」ユダヤ人たち[a]は彼に言った。「私たちには、だれであれ死刑にすることは許されていません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「ユダヤ人たち」。ここではユダヤ人全体ではなく、ピラトの前でイエスを告発していたユダヤ人の当局者たちを指す。
    reason: 文脈上の指示対象を明確にし、民族全体を指すとの誤読を避けるため。
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた推論的かつ物語的なつながりを、自然な現代日本語で示す。
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: あなたがたがこの人を引き取り
  rationale: 明示された代名詞ὑμεῖςの強調を「あなたがたが」で表し、λάβετεはこの司法的な受け渡しの文脈に即して「引き取り」とした。
- source_word: κατὰ τὸν νόμον ὑμῶν
  choice: 自分たちの律法に従って
  rationale: κατάの規準・準拠の意味を保ちつつ、ὑμῶνが示すピラト側からの距離を「自分たちの」で自然に表す。
- source_word: κρίνατε
  choice: 裁きなさい
  rationale: 法的文脈を示しながら、正式な裁判手続きだけに意味を限定しない訳語。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: ギリシア語の表現を本文で保ち、その場でピラトと話している当局者・告発者を指すという文脈上の限定は脚注で明示する。
- source_word: Ἡμῖν οὐκ ἔξεστιν
  choice: 私たちには……許されていません
  rationale: ἡμῖνの与格とἔξεστινの許可・適法性を、明瞭で自然な現代日本語にした。
- source_word: ἀποκτεῖναι οὐδένα
  choice: だれであれ死刑にすること
  rationale: 司法的文脈におけるἀποκτεῖναιを「死刑にする」とし、οὐδέναの無限定な範囲を「だれであれ」で表した。
theological_decisions:
- issue: ヨハネ福音書におけるοἱ Ἰουδαῖοιの指示対象
  choice: 本文では「ユダヤ人たち」と訳し、脚注でこの場面の指示対象を限定する。
  alternative: 「ユダヤ人の指導者たち」または「ユダヤ当局者たち」
  rationale: 原文の表現を保ちながら、この語をユダヤ民族全体への一括した言及と誤解させないため。直近の物語文脈では、ピラトの前で告発している一団を指す。
- issue: ἔξεστινが示す不許可の性格
  choice: 「許されていません」
  alternative: 「律法上認められていません」または「権限がありません」
  rationale: その不許可がローマ法上の権限制約か、別の法的・宗教的事情かを本文で断定せず、原文の幅を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この人」は目前のイエスを指す自然な表現。「死刑にする」は司法的文脈を伝えるが、執行方法までは限定しない。
