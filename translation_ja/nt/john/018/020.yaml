  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Ἐγὼ παρρησίᾳ ⸀λελάληκα τῷ κόσμῳ· ἐγὼ πάντοτε ἐδίδαξα ἐν συναγωγῇ καὶ ἐν τῷ ἱερῷ, ὅπου ⸀πάντες οἱ Ἰουδαῖοι συνέρχονται, καὶ ἐν κρυπτῷ ἐλάλησα οὐδέν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/020.yaml
  text: Jesus answered him[a], “I have spoken openly to the world. I always taught in the synagogue and in the temple, where all the Jews gather[b], and I said nothing in secret.”
translation:
  language: ja
  text: イエスは彼に答えた。「わたしは世に向かって公然と語ってきた。わたしはいつも、すべてのユダヤ人[b]が集まる会堂と神殿[a]で教えた。隠れては何も語らなかった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿の境内」とも訳せる。ギリシア語のἱερόνは、内陣だけでなく、神殿の建物と境内からなる区域全体を指す。
    reason: lexical_alternative
  - marker: b
    text: 「ユダヤの人々」とも訳せる。ギリシア語のἸουδαῖοιは文脈により、ユダヤ人一般、ユダヤ地方の人々、または特定の集団を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: 公然と
  rationale: 直後の「隠れて」と対照をなし、勇敢さよりも、隠さず公の場で語ったことを表すため。
- source_word: λελάληκα
  choice: 語ってきた
  rationale: 完了形が示す、これまでの発言と現在の尋問とのつながりを自然な日本語で保つため。
- source_word: τῷ κόσμῳ
  choice: 世に向かって
  rationale: 単なる「公衆」に狭めず、ヨハネ福音書に特徴的な κόσμος の広がりを残すため。
- source_word: πάντοτε
  choice: いつも
  rationale: 習慣的かつ一貫して公に教えたという時間的意味を、明瞭な現代日本語で表すため。
- source_word: ἐδίδαξα
  choice: 教え
  rationale: アオリストの出来事叙述を簡潔に表し、後続の「語った」と自然につなぐため。
- source_word: ἐν συναγωγῇ
  choice: 会堂で
  rationale: 単数形は公的なユダヤ教の会堂という場を類型的に指すと理解でき、日本語では無冠詞で自然に表せるため。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: 簡潔な標準訳を採りつつ、ἱερόν が内陣に限定されず神殿境内を指すことを脚注で明示するため。
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: ユダヤ人が皆
  rationale: 語順を日本語として自然にしながら πάντες の包括的表現を保持するため。Ἰουδαῖοι の文脈依存性は脚注に示す。
- source_word: συνέρχονται
  choice: 集まる
  rationale: 共同で一か所に集うことを、平明で自然な現代日本語で表すため。
- source_word: ἐν κρυπτῷ
  choice: 隠れて
  rationale: παρρησίᾳ との「公然／隠れて」という対照を明瞭に保つため。
- source_word: ἐλάλησα οὐδέν
  choice: 語ったことは何もない
  rationale: 強い否定を保ちながら、日本語として自然な言い回しにするため。
- source_word: ἀπεκρίθη αὐτῷ
  choice: 彼に答えた
  rationale: 代名詞の対象を原文どおり保持した、簡潔で自然な物語表現。
theological_decisions:
- issue: ヨハネ福音書における Ἰουδαῖοι の指示範囲
  choice: 本文では「ユダヤ人」とし、この箇所では公に集まるユダヤ人共同体を指す表現として訳した。
  alternative: 「ユダヤの人々」「ユダヤ人たち」
  rationale: Ἰουδαῖοι は文脈により、ユダヤ人一般、ユダヤ地方の人々、または一部の指導者層を指し得る。この節では会堂と神殿に集まる場面なので、指導者だけに限定せず、原語の包括的で文脈依存的な表現を保った。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、尋問に対するイエスの厳粛で簡潔な応答として整えた。「世」「公然と」「隠れて」により、ヨハネ的な語感と本文の対照を保った。
