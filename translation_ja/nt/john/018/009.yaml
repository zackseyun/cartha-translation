id: JHN.18.9
reference: John 18:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα πληρωθῇ ὁ λόγος ὃν εἶπεν ὅτι Οὓς δέδωκάς μοι οὐκ ἀπώλεσα ἐξ αὐτῶν οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/009.yaml
  text: 'so that the word that he had spoken might be fulfilled: “Of those whom you have given me[a], I lost not one.”'
translation:
  language: ja
  text: これは、イエスが言われた次のことばが実現するためであった。「あなたがわたしに与えてくださった者たちのうち、わたしは一人も[a]失わなかった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らのうち、だれ一人失わなかった」または「彼らのうち、一人も失わなかった」。
    reason: ἐξ αὐτῶν οὐδέναの部分表現と強い否定は、日本語では語順を変えて表すこともできる。
lexical_decisions:
- source_word: ἵνα πληρωθῇ
  choice: 実現するためであった
  rationale: ἵναとアオリスト受動接続法の目的・結果の関係を保ちつつ、イエスが先に語ったことばが出来事の中で現実となったことを、明瞭な現代日本語で表す。
- source_word: ὁ λόγος ὃν εἶπεν
  choice: イエスが言われた次のことば
  rationale: λόγοςはここでは称号としての「ことば」ではなく、先に語られた特定の発言を指す。「次の」を補って、ὅτιが導く直接引用とのつながりを自然にした。
- source_word: Οὓς δέδωκάς μοι
  choice: あなたがわたしに与えてくださった者たちのうち
  rationale: δέδωκάςの完了形が示す、与えられた状態の継続を「与えてくださった」で自然に表し、前置された関係節と後の部分表現を「者たちのうち」で結びつけた。
- source_word: οὐκ ἀπώλεσα
  choice: 失わなかった
  rationale: この場面では、託された弟子たちを守って一人も失わないという意味であり、能動的な破滅を意味する「滅ぼした」より文脈に適する。ヨハネ17章12節との語彙的なつながりも保つ。
- source_word: ἐξ αὐτῶν οὐδένα
  choice: 一人も
  rationale: 「彼らの中から一人さえも」という強い否定を簡潔に表す。部分の意味は直前の「者たちのうち」によって明示されている。
theological_decisions:
- issue: イエスのことばの「成就」
  choice: 先に語られたイエスのことばが出来事の中で「実現する」と訳す。
  alternative: 「成就する」または「そのとおりになる」
  rationale: ヨハネは聖書だけでなくイエス自身の発言にもπληρόωを用いる。「実現する」は神の目的と物語上の達成を保ちながら、ここを明示的な旧約預言の成就公式に限定しない。
- issue: 弟子たちを「失う」の意味
  choice: 「一人も失わなかった」とし、イエスに与えられた者たちの保護を表す。
  alternative: 「一人も滅ぼさなかった」または「一人も滅びさせなかった」
  rationale: 逮捕時に弟子たちを逃がす直近の文脈と、ヨハネ17章12節の発言との響きを保つ一方、特定の教理体系によって「失う」の範囲を狭く定義しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。引用内では父への語りかけを「与えてくださった」とし、自然な敬意を表した。「ことば」は称号との混同を避けるため小書きの一般名詞として扱う。
