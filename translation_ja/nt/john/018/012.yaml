  text: Ἡ οὖν σπεῖρα καὶ ὁ χιλίαρχος καὶ οἱ ὑπηρέται τῶν Ἰουδαίων συνέλαβον τὸν Ἰησοῦν καὶ ἔδησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/john/018/012.yaml
  text: So the cohort[a], the commander, and the officers of the Jews seized Jesus and bound him.
translation:
  language: ja
  text: そこで、部隊とその指揮官、またユダヤ人たちの役人たち[a]は、イエスを捕らえて縛った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈によっては「ユダヤ当局の役人たち」または「ユダヤ地方の人々に属する役人たち」とも訳せる。ヨハネ福音書の「ユダヤ人」は、ユダヤ民族全体ではなく、より限定された人々を指すことがある。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けて物語を進める接続の働きを、自然な現代日本語で表す。強い論理的結論を示す「したがって」より文脈に適する。
- source_word: σπεῖρα
  choice: 部隊
  rationale: 軍事組織を指す語であることを保ちつつ、「コホルス」のような一般読者に不慣れな専門語や、原文に明記されない「ローマ軍」を補う表現を避ける。
- source_word: χιλίαρχος
  choice: その指揮官
  rationale: 当該部隊を率いる将校を指す。歴史的な官職名に限定せず、現代の読者に役割が明瞭に伝わる表現とした。「その」は原文の関係を文脈上自然に示す補足である。
- source_word: ὑπηρέται
  choice: 役人たち
  rationale: ここでは家僕ではなく、逮捕に携わる公的な下役・係官を指す。具体的に「神殿警備隊」とまでは原文が限定していないため、制度的役割を示す広めの語を選ぶ。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人側の
  rationale: 属格の関係を保ちながら、この句が役人たちの所属・関係先を示すことを自然な日本語で表す。ヨハネ文書における指示範囲は文脈によって限定的になり得るため、脚注でその曖昧さを示す。
- source_word: συνέλαβον
  choice: 捕らえて
  rationale: 身体を押さえて拘束下に置く行為を表す。「逮捕した」ほど近代的な法的手続きを前面に出さず、動作の強さも保つ。
- source_word: ἔδησαν
  choice: 縛った
  rationale: 拘束のために縛るという動作を、簡潔で明瞭な現代日本語で表す。
theological_decisions:
- issue: ヨハネ福音書における τῶν Ἰουδαίων の指示範囲
  choice: 本文では「ユダヤ人側の」とし、原語の表現を広く保った。
  alternative: 「ユダヤ当局の」または「ユダヤ地方の人々の」と限定して訳す。
  rationale: この語句はユダヤ民族全体を常に指すとは限らず、文脈によりユダヤの指導者層またはユダヤ地方の人々を指し得る。しかし本節だけではその範囲を一義的に確定できないため、本文で解釈を固定せず脚注に代案を残す。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。軍事・行政上の専門語を過度に用いず、原文が明示しない所属や官職を断定しない。脚注記号は該当する「ユダヤ人側の役人たち」の直後に置いた。
