source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐκ τοῦ κόσμου τούτου· εἰ ἐκ τοῦ κόσμου τούτου ἦν ἡ βασιλεία ἡ ἐμή, οἱ ὑπηρέται ⸂οἱ ἐμοὶ ἠγωνίζοντο ἄν⸃, ἵνα μὴ παραδοθῶ τοῖς Ἰουδαίοις· νῦν δὲ ἡ βασιλεία ἡ ἐμὴ οὐκ ἔστιν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/036.yaml
  text: Jesus answered[a], “My kingdom is not from this world. If my kingdom were from this world, my servants would be fighting so that I might not be handed over to the Jews. But as it is, my kingdom is not from here.”
translation:
  language: ja
  text: イエスは答えた。「わたしの国は、この世から来たものではない。もしわたしの国がこの世から来たものであったなら、わたしがユダヤ人[a]に引き渡されないように、わたしに仕える者たちが戦っていたはずだ。しかし実際、わたしの国はここから来たものではない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人々」。ここでは特にユダヤ当局者を指している可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: βασιλεία
  choice: 国
  rationale: 王の支配とその領域の両方を含み得る語として、文脈に自然で定着した「国」を採用した。反復表現も保てる。
- source_word: ἐκ τοῦ κόσμου τούτου
  choice: この世を源とするもの
  rationale: ἐκ が示す起源・源を明確にし、単に「この世に属さない」あるいは「この世に存在しない」という意味へ狭めないため。
- source_word: κόσμος
  choice: この世
  rationale: ヨハネ文書で神に対立する現在の人間世界・秩序という含みを持ち得るが、説明を加えすぎず自然な日本語で表した。
- source_word: ὑπηρέται
  choice: わたしに仕える者たち
  rationale: 権威の下で奉仕する者という意味を保ちつつ、「役人」や「警備兵」のように制度的役割を限定しない表現とした。
- source_word: ἠγωνίζοντο ἄν
  choice: 戦っていたはずだ
  rationale: 反実仮想と、未完了過去が示す継続的な行為の含みを自然な日本語で表した。
- source_word: ἵνα μὴ παραδοθῶ
  choice: 引き渡されないよう
  rationale: 目的を表す節として訳し、παραδίδωμι の司法的・裏切りに関わる含意を保ち得る「引き渡す」を用いた。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たち
  rationale: 語の基本的な指示を本文に残しつつ、この文脈でユダヤ地方の人々または当局者を指す可能性を脚注で示した。
- source_word: νῦν δὲ
  choice: しかし実際
  rationale: 直前の反実仮想と現実の状況との対比を、現代日本語で明瞭に示した。
- source_word: ἐντεῦθεν
  choice: ここを源とするもの
  rationale: 「ここから」という直示性を保ちながら、前半の起源に関する主張とのつながりが伝わるようにした。
theological_decisions:
- issue: イエスの国とこの世との関係
  choice: 「この世を源とするものではない」と訳した。
  alternative: 「この世のものではない」「この世に属していない」
  rationale: 主眼は国の起源と性質にあり、この世における存在や働きを否定していると断定しないため。原文の神学的緊張を保った。
- issue: ヨハネ福音書における Ἰουδαῖοι の指示対象
  choice: 本文では「ユダヤ人たち」とし、文脈上の限定的な可能性を脚注に示した。
  alternative: 「ユダヤ地方の人々」「ユダヤ当局者たち」
  rationale: 原語の広い語義を過度に狭めず、同時にこの場面では当局者を中心に指し得ることも読者に知らせるため。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの発言は簡潔で威厳のある常体とした。「源とするもの」により原文の起源を示す表現を自然に明示し、末尾の「ここ」という直示表現も残した。
