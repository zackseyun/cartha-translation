  to: なぜ、わたしに尋ねるのですか。わたしが彼らに何を話したかは、それを聞いた人たちに尋ねなさい。見なさい、この人たちは、わたしが言ったことを知っています。
  rationale: 原文の同一動詞ἐρωτάωを両箇所で「尋ねる」と訳し、日本語の「尋問」が加えうる専門的・強制的な含意を避けた。「それを聞いた人たち」により、聞いた内容と人々の関係を明確にした。また、「この人たち」によってοὗτοιの指示性を保った。
