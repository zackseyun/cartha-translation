source:
  edition: SBLGNT
  text: τί με ⸂ἐρωτᾷς; ἐρώτησον⸃ τοὺς ἀκηκοότας τί ἐλάλησα αὐτοῖς· ἴδε οὗτοι οἴδασιν ἃ εἶπον ἐγώ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/021.yaml
  text: Why do you question me? Question those who have heard what I said to them. Look[a], they know what I said.
translation:
  language: ja
  text: なぜ、わたしに尋ねるのですか。わたしが彼らに何を話したかは、それを聞いた人たちに尋ねなさい。見なさい、この人たちは、わたしが言ったことを知っています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τί με ἐρωτᾷς
  choice: なぜ、わたしに尋問するのですか
  rationale: ἐρωτάω自体は広く「尋ねる」を意味するが、大祭司による公式な取り調べという文脈では「尋問する」が司法的な響きを自然に伝える。τίは理由を問う直接的な問いとして訳した。
- source_word: ἐρώτησον
  choice: 尋ねなさい
  rationale: 同じἐρωτάωだが、聞いた人々から証言を得るよう求める箇所では、日本語の「尋問しなさい」は過度に強く不自然なため、中立的な「尋ねなさい」とした。語の反復より自然さと対象の違いを優先した。
- source_word: τοὺς ἀκηκοότας
  choice: 聞いた人たち
  rationale: 完了分詞は、すでにイエスの発言を聞いてその内容を知る人々を指す。日本語では「聞いた人たち」が簡潔で自然であり、目的語の「わたしを」は原文にないため補わない。
- source_word: τί ἐλάλησα αὐτοῖς
  choice: わたしが彼らに何を話したか
  rationale: λαλέωを自然な現代日本語の「話す」とし、αὐτοῖςも「彼らに」と明示した。疑問節の語順で内容を明確にした。
- source_word: ἴδε
  choice: 見なさい
  rationale: 注意を促す命令・間投詞として、古風な表現を避けつつ指示的な力を保つ「見なさい」とした。
- source_word: οὗτοι οἴδασιν
  choice: 彼らは……知っています
  rationale: οὗτοιの指示性は直前の「聞いた人たち」を受ける「彼ら」で文脈上明瞭に表した。「この人たち」はその場に当人たちがいることを強く確定しかねないため避けた。
- source_word: ἃ εἶπον ἐγώ
  choice: わたしが言ったこと
  rationale: εἶπονは自然に「言った」と訳した。明示されたἐγώの焦点は主語「わたし」を置くことで示し、「このわたしが」などの過剰な強調は避けた。
theological_decisions:
- issue: 大祭司の前での応答が持つ司法的な調子
  choice: 最初のἐρωτάωを「尋問する」と訳す
  alternative: 二つのἐρωτάωをともに「尋ねる」と訳す
  rationale: 語そのものの中立的意味を認めつつ、最初の問いには公式な取り調べという場面の圧力を反映した。一方、命令形は証人に聞く行為なので「尋ねる」とし、司法的意味を語彙だけで一律に固定しなかった。
translation_notes:
  register: 明瞭で現代的ながら、裁きの場にふさわしい品位ある敬体。イエスの応答の鋭さを保ちつつ、粗野または過度に法律専門的な言い回しは避けた。
