  naturalness: 「わたしが彼らに何を話したかは、聞いた人たちに尋ねなさい」でも意味は通るが、「それを聞いた人たち」とするほうが、日本語として誰が何を聞いたのかを明確にし、原文の関係を自然に再現できる。
  terminology: 「尋問する」は避け、「尋ねる」を用いる。ἴδεの注意喚起は、明瞭な現代標準語として「見なさい」でよい。「この人たち」はοὗτοιの強調的・指示的なニュアンスを保つ。
