id: JHN.18.38
reference: John 18:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Πιλᾶτος· Τί ἐστιν ἀλήθεια; Καὶ τοῦτο εἰπὼν πάλιν ἐξῆλθεν πρὸς τοὺς Ἰουδαίους, καὶ λέγει αὐτοῖς· Ἐγὼ οὐδεμίαν ⸂εὑρίσκω ἐν αὐτῷ αἰτίαν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/038.yaml
  text: Pilate said to him[a], “What is truth?” After saying this, he went out again to the Jews and said to them, “I find no case against him.”
translation:
  language: ja
  text: ピラトはイエスに言った。「真理とは何か。」こう言ってから、彼は再びユダヤ人たち[a]のところへ出て行き、彼らに言った。「私は、この人に対する訴えの根拠を何も見いだせない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ユダヤ人の指導者たち」。ヨハネ福音書で「ユダヤ人たち」は、文脈によっては、ユダヤ人全体ではなく、ユダヤ当局者や、その場でイエスに反対していた代表者たちを指すことがある。
    reason: 文脈上の指示範囲を示し、民族全体を一括して指すとの誤解を避けながら、原文の表現を本文に保持するため。
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Πιλᾶτος
  choice: ピラトはイエスに言った
  rationale: λέγειは歴史的現在だが、現代日本語の物語として自然な過去形「言った」で表した。αὐτῷの指示対象は直前の文脈にいるイエスなので、曖昧になりやすい日本語の「彼に」ではなく「イエスに」とした。
- source_word: Τί ἐστιν ἀλήθεια;
  choice: 真理とは何か
  rationale: 無冠詞のἀλήθειαを、特定の命題に狭めず一般的・哲学的な問いとして保つ。「真実」よりも、この文脈で概念そのものを問う表現として「真理」が適切である。
- source_word: Καὶ τοῦτο εἰπὼν
  choice: こう言ってから
  rationale: アオリスト分詞εἰπώνが示す先行動作を、簡潔で自然な時間表現によって示した。
- source_word: πάλιν ἐξῆλθεν
  choice: 再び……出て行き
  rationale: πάλινの反復とἐξῆλθενの内側から外側への移動を、そのまま明瞭に表した。
- source_word: πρὸς τοὺς Ἰουδαίους
  choice: ユダヤ人たちのところへ
  rationale: Ἰουδαίουςの基本的な語義を本文に保持した。ただしヨハネ福音書では文脈上、ユダヤ人全体ではなく、当局者やその場でイエスを訴えていた代表者たちを指すことがあるため、脚注で限定的な理解を示した。
- source_word: καὶ λέγει αὐτοῖς
  choice: 彼らに言った
  rationale: 歴史的現在λέγειを、日本語の自然な物語時制に合わせて過去形とした。複数代名詞αὐτοῖςも明示した。
- source_word: Ἐγὼ οὐδεμίαν εὑρίσκω ἐν αὐτῷ αἰτίαν
  choice: 私はこの人に何の罪状も認めない
  rationale: αἰτίαは裁判の文脈で、単なる道徳的な「欠点」ではなく、告発・有罪判断に関わる罪状や根拠を指す。「罪状」は法的含意を簡潔に保ち、εὑρίσκωは日本語の司法的な言い回しとして「認めない」とした。強調されたἘγώは「私は」で表した。
theological_decisions:
- issue: ヨハネ受難物語におけるἸουδαῖοιの指示範囲
  choice: 本文は「ユダヤ人たち」とし、脚注で「ユダヤ人の指導者たち」という文脈上の可能性を示す
  alternative: ユダヤ人の指導者たち／ユダヤ地方の人々
  rationale: 語の表面的な対応を本文に残しつつ、この場面の指示対象が民族全体ではなく、ピラトの前でイエスに反対している当局者または代表集団であり得ることを明示する。こうして原文の語義的・文脈的な幅を一方に決め切らず保った。
- issue: ピラトの問いにおけるἀλήθειαの範囲
  choice: 「真理とは何か」
  alternative: 「その真理とは何か」／「真実とは何か」
  rationale: 原文には定冠詞がなく、問いを特定の教説やイエスの直前の言葉だけに限定していない。「真理」は概念的な広がりを保ち、問いの真意が真摯なのか懐疑的なのかも訳文で決めない。
translation_notes:
  register: 現代標準日本語による、簡潔で品位のある法廷叙述とした。歴史的現在は自然な過去形で統一し、ピラトの問いの簡潔さと余韻を保った。脚注記号は、その内容が説明する「ユダヤ人たち」の直後に置いた。
