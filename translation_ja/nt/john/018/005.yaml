base_translation:
  language: en
  yaml_path: translation/nt/john/018/005.yaml
  text: They answered him, “Jesus the Nazarene.” He said to them, “I am he.” Now Judas, who was betraying him, was also standing with them.
translation:
  language: ja
  text: 彼らは答えた。「ナザレ人イエスだ。」イエスは彼らに言われた。「わたしがその者だ。」イエスを裏切っていたユダも、彼らと一緒に立っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦν τὸν Ναζωραῖον
  choice: ナザレ人イエス
  rationale: 人物を出身地・ゆかりの地によって特定する自然で簡潔な日本語。
- source_word: Ἐγώ εἰμι
  choice: わたしがその者だ
  rationale: 直訳は「わたしはある／わたしである」だが、この場面では捜している人物が自分だと答える表現。述語が省略された原文の簡潔さを保ちつつ、日本語で文脈上の意味が通るようにした。
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: イエスを裏切ろうとしていた
  rationale: 現在分詞は進行中の裏切りの行為・役割を示す。この時点では引き渡しが進行しているため、日本語では「裏切ろうとしていた」とした。
- source_word: εἱστήκει ... μετ’ αὐτῶν
  choice: 彼らと一緒に立っていた
  rationale: 完了形の結果状態を表す「立っていた」を自然に再現した。
theological_decisions:
- issue: Ἐγώ εἰμι が神的自己宣言を暗示する可能性
  choice: わたしがその者だ
  alternative: わたしはある／わたしである
  rationale: 直接の会話機能は人物確認への応答であり、日本語では補語を補うのが自然。ただし原文の表現はヨハネ福音書内で神学的含意を帯び得るため、解釈を過度に拡張しない簡潔な表現を選んだ。
translation_notes:
  register: 明快な現代標準日本語。叙述ではイエスを明示して話者の混乱を避け、会話は緊迫した場面に合う簡潔さを保った。
