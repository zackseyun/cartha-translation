source:
  edition: SBLGNT
  text: Ἰησοῦς ⸀οὖν εἰδὼς πάντα τὰ ἐρχόμενα ἐπ’ αὐτὸν ⸂ἐξῆλθεν, καὶ λέγει⸃ αὐτοῖς· Τίνα ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/004.yaml
  text: Jesus therefore[a], knowing all the things coming upon him, went out and said to them, “Whom are you seeking?”
translation:
  language: ja
  text: そこで、イエスは、ご自分に降りかかろうとしていることをすべて知っていて、進み出て彼らに言われた。「だれを捜しているのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の叙述を受けた物語上・論理上の展開を、現代日本語で自然に示す。単なる時間的な「その時」よりも接続の働きを保つ。
- source_word: εἰδὼς
  choice: 知っておられたので
  rationale: イエスがこれから起こる事柄をあらかじめ十分に認識していたことを表す分詞を、文脈に即した敬意ある自然な日本語にした。
- source_word: πάντα τὰ ἐρχόμενα ἐπ’ αὐτόν
  choice: ご自分に降りかかろうとしていることをすべて
  rationale: πάνταの包括性と、迫りつつある出来事を表す現在分詞を保つ。「降りかかる」は敵対的な出来事が本人に及ぶ含意を、具体化しすぎずに伝える。
- source_word: ἐξῆλθεν
  choice: 進み出て
  rationale: 場から外へ出る動きだけでなく、一行の前へ自ら出た場面に自然に合う。過度に劇的な表現は避けた。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語の歴史的現在を、日本語の物語として自然な過去の叙述に整え、イエスへの通常の敬意を示した。
- source_word: Τίνα ζητεῖτε
  choice: だれを捜しているのか
  rationale: Τίναの目的格を「だれを」で明示し、ζητέωの継続的な探索を「捜している」で自然に表した。
theological_decisions:
- issue: 物語におけるイエスの事前認識
  choice: イエスがご自分に降りかかろうとしていることをすべて知っていたと訳す。
  alternative: 全知などの体系神学的概念を明示して訳文に加える。
  rationale: 本文は迫る出来事についてのイエスの十分な認識を明言するが、その範囲をこの節以上に教理化してはいないため。
- issue: ἐξῆλθενが示すイエスの主体性
  choice: 「進み出て」とし、状況を知りながら自ら相手に向き合った動きを示す。
  alternative: 位置移動だけを表す「外に出て」とする。
  rationale: 文脈上の主体的な動きを自然に伝える一方、「立ち向かった」などの解釈的な強調は加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。イエスの発話と叙述には自然な敬語を用いた。「だれを捜しているのか」は厳粛さを保ちつつ、古風すぎない表現とした。
