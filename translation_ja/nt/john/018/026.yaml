source:
  edition: SBLGNT
  text: λέγει εἷς ἐκ τῶν δούλων τοῦ ἀρχιερέως, συγγενὴς ὢν οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον· Οὐκ ἐγώ σε εἶδον ἐν τῷ κήπῳ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/026.yaml
  text: One of the high priest’s servants[a], being a relative of the man whose ear Peter had cut off, said, “Didn’t I see you in the garden with him?”
translation:
  language: ja
  text: 大祭司の奴隷の一人で、ペトロに耳を切り落とされた人の親族が言った。「あなたがあの人と一緒に園にいるのを、私が見たのではないか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλων
  choice: 奴隷
  rationale: 大祭司の家に属する拘束された身分の者を指すため、社会的実態を弱めない「奴隷」とした。属格を「大祭司の奴隷」と自然に表した。
- source_word: ἀρχιερέως
  choice: 大祭司
  rationale: ヨハネ受難物語における祭司職の最高位を表す標準的な訳語。
- source_word: συγγενὴς ὢν
  choice: 親族
  rationale: 話者と耳を切り落とされた人との血縁・姻戚上のつながりを、現代日本語で自然に示す。分詞の説明関係は「一人で、…親族が」という構文で保持した。
- source_word: οὗ ἀπέκοψεν Πέτρος τὸ ὠτίον
  choice: ペトロに耳を切り落とされた人
  rationale: ギリシア語では直訳的に「ペトロがその耳を切り落とした人」。日本語では受け身にして関係を明確かつ自然に表した。
- source_word: Οὐκ ἐγώ σε εἶδον
  choice: おまえが…いるのを、私は見たではないか
  rationale: οὐκ による肯定を予期する問いと、明示された ἐγώ の強調を保持する。「見たではないか」により、詰問する修辞疑問の力を表した。
- source_word: ἐν τῷ κήπῳ
  choice: 園に
  rationale: κήπος はここではイエスが捕らえられた庭園を指す。受難物語の場を簡潔で品位ある「園」で表した。
- source_word: μετ’ αὐτοῦ
  choice: あの人と一緒に
  rationale: αὐτοῦ は文脈上イエスを指す。話者がペトロに向けて第三者を指す自然な発話として「あの人」とした。
theological_decisions:
- issue: 非比喩的な家内身分を表す δοῦλος の訳
  choice: 奴隷
  alternative: 僕／使用人
  rationale: この場面では一般的な奉仕者ではなく、大祭司の家に属する拘束身分の者を指す。歴史的・社会的含意を伝統的な婉曲語で弱めないため「奴隷」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、受難物語にふさわしい簡潔で格調ある調子とした。話者の確信と詰問の響きを「私は見たではないか」で示し、ἐγώ の明示的強調も保持した。
