id: JHN.18.32
reference: John 18:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος τοῦ Ἰησοῦ πληρωθῇ ὃν εἶπεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/032.yaml
  text: so that the word of Jesus would be fulfilled[a], which he had spoken[c][b], indicating by what kind of death he was about to die.
translation:
  language: ja
  text: これは、イエスがご自分がどのような死に方で死のうとしておられたかを示して語られたことばが成就するためであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ためであった
  rationale: 文脈上、直前の出来事がイエスのことばの成就につながったことを示す目的・結果の含みを、自然な日本語で表す。
- source_word: ὁ λόγος τοῦ Ἰησοῦ
  choice: イエスが…語られたことば
  rationale: λόγοςはここではヨハネ1:1の称号ではなく、イエスの発言を指す。「ことば」とし、後続する関係節を日本語の連体構造に組み込んだ。
- source_word: πληρωθῇ
  choice: 成就する
  rationale: ヨハネ福音書における成就の主題と、聖書的な充足の含意を保持する。
- source_word: ὃν εἶπεν σημαίνων
  choice: 示して語られた
  rationale: 分詞σημαίνωνがイエスの発言の働きを説明する関係を簡潔に表す。目的とも説明とも取り得る余地は注で示す。
- source_word: ποίῳ θανάτῳ
  choice: どのような死に方を
  rationale: 単に死の事実ではなく、その種類・様態を問うποίῳの意味を自然な日本語で表す。
- source_word: ἤμελλεν ἀποθνῄσκειν
  choice: 死に方をしようとしている
  rationale: μέλλωの将来・切迫の意味を保ちつつ、「定められていた」として決定論的な含意を加えない。日本語では「どのような死に方をしようとしている」で全体を自然にした。
theological_decisions:
- issue: イエスの先の発言と成就の関係
  choice: 「ことばが成就する」と明示する
  alternative: 「言われたことが実現する」
  rationale: πληρόωの成就語法が持つ神学的重みを保持し、単なる予言の的中へと平板化しない。
- issue: μέλλωが表すイエスの死の将来性
  choice: 「死に方をしようとしている」
  alternative: 「死ぬことに定められていた」
  rationale: 原文が示す将来・切迫性を訳し、予定に関するより強い教理的解釈を持ち込まない。
- issue: σημαίνωνの統語的関係
  choice: イエスがその発言によって死の様態を示したと訳す
  alternative: 「示すために語られた」
  rationale: 付帯状況・説明の分詞としての関係を本文で自然に表しつつ、目的的理解も可能であることを脚注で保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体。「御言葉」は避け、ここでのλόγοςが個別の発言を指すことが伝わる「ことば」を採用した。「死に方」は口語的だが広く理解され、ποίῳ θανάτῳの様態を正確に伝える。
