  text: ᾔδει δὲ καὶ Ἰούδας ὁ παραδιδοὺς αὐτὸν τὸν τόπον, ὅτι πολλάκις ⸀συνήχθη Ἰησοῦς ἐκεῖ μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/002.yaml
  text: Judas, who was betraying him, also knew the place, because Jesus had often gathered there with his disciples.
translation:
  language: ja
  text: イエスを裏切っていたユダも、その場所を知っていた。イエスが弟子たちと共に何度もそこに集まっていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾔδει
  choice: 知っていた
  rationale: その場所についての知識と馴染みがユダにあったことを、自然な現代日本語で表す。
- source_word: δὲ καὶ
  choice: も
  rationale: δέの穏やかな叙述の展開は日本語の文脈に委ね、καίの付加的な意味を「も」で明示する。
- source_word: ὁ παραδιδοὺς αὐτὸν
  choice: イエスを裏切ろうとしていた
  rationale: 受難物語におけるユダの行為として「裏切る」が自然であり、現在分詞の進行中・目前の企てという性格を「ようとしていた」で表す。代名詞は日本語で指示対象が明確になるよう「イエス」とした。
- source_word: τὸν τόπον
  choice: その場所
  rationale: 直前の庭を指す既知の場所であることを自然に示す。
- source_word: ὅτι
  choice: からである
  rationale: ユダがその場所を知っていた理由を導く因果関係を明確にする。
- source_word: πολλάκις
  choice: たびたび
  rationale: 反復を表す、明瞭で品位のある現代日本語。
- source_word: συνήχθη
  choice: 集まっていた
  rationale: 受動形が文脈上持つ自動詞的な「集まる」の意味を保つ。「会っていた」も可能なため注記する。
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: 弟子たちと共に
  rationale: μετάの同伴を明示し、福音書における教師と弟子の関係を保つ。
theological_decisions:
- issue: ユダについての παραδιδοὺς の訳
  choice: 裏切ろうとしていた
  alternative: 引き渡そうとしていた
  rationale: この受難物語では単なる移送ではなくユダの背信行為を指す。ただし原語の基本的な「引き渡す」という表現も脚注で示す。
- issue: συνήχθη の態と意味
  choice: 集まっていた
  alternative: 会っていた／集められていた
  rationale: 形態はアオリスト受動であるが、ここでは「集まる、会合する」という自動詞的用法として理解できる。受動性を強く出して不自然な日本語や不必要な神学的含意を生じさせない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、「共に」「たびたび」「からである」により聖書本文としての落ち着いた品位を保った。脚注記号[a]は本文中に置き、二つの主要な語彙上の代案を一注にまとめた。
