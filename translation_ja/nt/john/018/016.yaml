id: JHN.18.16
reference: John 18:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Πέτρος εἱστήκει πρὸς τῇ θύρᾳ ἔξω. ἐξῆλθεν οὖν ὁ μαθητὴς ὁ ἄλλος ⸀ὁ γνωστὸς ⸂τοῦ ἀρχιερέως⸃ καὶ εἶπεν τῇ θυρωρῷ καὶ εἰσήγαγεν τὸν Πέτρον.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/016.yaml
  text: But Peter was standing outside at the door[a]. So the other disciple, who was known to the high priest[b], went out and spoke to the doorkeeper and brought Peter in.
translation:
  language: ja
  text: しかし、ペトロは外で、戸口のそばに立っていた。そこで、大祭司に知られていたもう一人の弟子[a]が外へ出て、戸口を守っていた女[b]に話しかけ、ペトロを中に入れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「大祭司と面識があった」。原文からは、二人の関係がどの程度親しかったかは分からない。
    reason: lexical_alternative
  - marker: b
    text: 「門番」とも訳せる。原語は入口を守る人を指し、ここでは女性形である。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἱστήκει
  choice: 立っていた
  rationale: 過去完了形が表す継続中の状態を、自然な現代日本語で示す。
- source_word: πρὸς τῇ θύρᾳ ἔξω
  choice: 戸口の外に
  rationale: 入口の近くという位置と、外にいることの両方を簡潔に保つ。θύραの基本義に沿って「戸口」とした。
- source_word: ὁ μαθητὴς ὁ ἄλλος
  choice: もう一人の弟子
  rationale: 福音書におけるμαθητήςの関係的・宗教的な意味を保ちつつ、自然な日本語にした。
- source_word: ὁ γνωστὸς τοῦ ἀρχιερέως
  choice: 大祭司と面識のあった
  rationale: γνωστόςが示す既知・面識の関係を表し、その親密さを特定しすぎない表現とした。
- source_word: ἀρχιερεύς
  choice: 大祭司
  rationale: 当時のユダヤ教の職位を表す標準的な訳語。
- source_word: θυρωρῷ
  choice: 戸口を守る女
  rationale: 語が入口を管理する者を指し、女性形であることも日本語に反映した。「門番」と限定せず、θύραとのつながりを保った。
- source_word: εἶπεν τῇ θυρωρῷ
  choice: 戸口を守る女に話し
  rationale: 発言内容が引用されていないため、「言った」よりも自然な「話し」とした。
- source_word: εἰσήγαγεν τὸν Πέτρον
  choice: ペトロを中に入れた
  rationale: εἰσάγωの方向性を明確にし、案内の仕方を不必要に詳しく規定しない自然な表現。
theological_decisions:
- issue: 大祭司ともう一人の弟子との関係の近さ
  choice: 面識のあった
  alternative: 知り合いだった／大祭司に知られていた
  rationale: 原文は関係の存在を示すが、その親密さや性質までは明示しないため、曖昧さを保った。
translation_notes:
  register: 明快で現代的な標準語を用いながら、受難物語にふさわしい落ち着いた叙述調とした。「面識のあった」によって原文の関係性の曖昧さを保ち、「戸口を守る女」で役割と文法上の性を自然に示した。
