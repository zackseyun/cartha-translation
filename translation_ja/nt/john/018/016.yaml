  naturalness: 「戸口を守る女」より「戸口を守っていた女」のほうが、明快な現代標準語の叙述として自然である。「話しかけ」は、発話内容を特定しない εἶπεν の文脈に自然に対応する。
  terminology: 「ペトロ」「弟子」「大祭司」は適切である。θυρωρός は女性形なので、本文で女性を明示することは原文に忠実である。
