  text: Ἠκολούθει δὲ τῷ Ἰησοῦ Σίμων Πέτρος ⸀καὶ ἄλλος μαθητής. ὁ δὲ μαθητὴς ἐκεῖνος ἦν γνωστὸς τῷ ἀρχιερεῖ καὶ συνεισῆλθεν τῷ Ἰησοῦ εἰς τὴν αὐλὴν τοῦ ἀρχιερέως,
base_translation:
  language: en
  yaml_path: translation/nt/john/018/015.yaml
  text: Simon Peter was following Jesus[a], and so was another disciple. That disciple was known to the high priest, and he went in with Jesus into the courtyard of the high priest,
translation:
  language: ja
  text: シモン・ペトロはイエスについて行っていた。もう一人の弟子も同じようについて行っていた[a]。その弟子は大祭司に知られており、イエスと一緒に大祭司の中庭に入った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「シモン・ペトロはイエスについて行っていた。そして、もう一人の弟子も」である。ギリシア語では、もう一人の弟子が同じ動作をしていたことが省略されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἠκολούθει
  choice: ついて行っていた
  rationale: 未完了過去形が表す継続中の動作を、自然な現代日本語で示す。
- source_word: δὲ
  choice: （独立した訳語を置かない）
  rationale: ここでは物語を進める軽い接続辞であり、日本語では文脈と語順だけで自然に流れを示せるため。
- source_word: καὶ ἄλλος μαθητής
  choice: もう一人の弟子も同じようについて行っていた
  rationale: 原文では二人目の弟子の動作が省略されているが、ペトロと同じくイエスについて行っていたことを自然な日本語で明示する。
- source_word: μαθητής
  choice: 弟子
  rationale: ヨハネ福音書におけるイエスの学び手・従う者を表す標準的で明確な語。
- source_word: ἐκεῖνος
  choice: その
  rationale: 直前に述べた「もう一人の弟子」を指し戻す指示の働きを保つ。
- source_word: γνωστὸς τῷ ἀρχιερεῖ
  choice: 大祭司と面識があり
  rationale: その弟子が大祭司に知られていたことを自然に表しつつ、「親しい」「よく知られていた」など関係の程度を原文以上に強めない。
- source_word: ἀρχιερεῖ / ἀρχιερέως
  choice: 大祭司
  rationale: この文脈における単数形ἀρχιερεύςの標準的な訳語。
- source_word: συνεισῆλθεν
  choice: 一緒に…入った
  rationale: 接頭辞συν-が示す、イエスとともに中へ入ったという共同性を保持する。
- source_word: αὐλήν
  choice: 屋敷の中庭
  rationale: 大祭司の住居に属する囲われた中庭を現代の読者に明確に伝える。「宮殿」とまでは限定しない。
