base_translation:
  language: en
  yaml_path: translation/nt/john/018/024.yaml
  text: So Annas sent him bound to Caiaphas the high priest[a].
translation:
  language: ja
  text: そこで、アンナスはイエスを縛られたまま、大祭司カイアファのもとへ送った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上、先の経緯を説明する挿入句と捉え、「さて、アンナスはイエスを縛られたまま、大祭司カイアファのもとへ送っていた」と訳すこともできる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: 送った
  rationale: アオリスト能動直説法による物語上の出来事を、自然な現代日本語で表す。
- source_word: οὖν
  choice: そこで
  rationale: 文脈上の進行・帰結を示す接続辞。硬い「それゆえ」より物語文に適し、単なる時系列の「それから」より論理的つながりも保つ。
- source_word: αὐτόν
  choice: イエスを
  rationale: ギリシア語では代名詞だが、日本語で主語アンナスとの関係を明瞭にするため、指示対象を名詞で示す。
- source_word: ὁ Ἅννας
  choice: アンナスは
  rationale: 固有名詞の標準的な日本語音写を用い、主語を「は」で自然に提示する。
- source_word: δεδεμένον
  choice: 縛ったまま
  rationale: 完了受動分詞が示す、送られた時点で拘束された状態の継続を自然な日本語で表す。「なお」は原文にない強調となるため加えない。
- source_word: πρὸς Καϊάφαν
  choice: カイアファのもとへ
  rationale: 人物を到達先とするπρόςの意味を、日本語として自然かつ明瞭に表す。
- source_word: τὸν ἀρχιερέα
  choice: 大祭司
  rationale: ユダヤ教のἀρχιερεύςの職を表す定着した訳語。日本語では同格表現として「大祭司カイアファ」とするのが自然。
theological_decisions:
- issue: 前後の文脈に対する物語上の時系列
  choice: 通常の過去の出来事として「アンナスは…送った」と訳す。
  alternative: 「アンナスはすでに…送っていた」とし、先の経緯を説明する挿入的な回想として読む。
  rationale: ἀπέστειλενはアオリスト直説法であり、まず物語を進める出来事として訳すのが素直である。ただし、18章の前後関係から過去完了的・挿入的に理解する余地があるため、本文で調和させず脚注に残す。
translation_notes:
  register: 明快で品位のある現代標準日本語。「拘束した状態で」より簡潔で具体的な「縛ったまま」を採用し、物語の流れを保った。脚注記号[a]を本文に明示した。
