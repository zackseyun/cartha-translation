  text: ὡς οὖν εἶπεν ⸀αὐτοῖς· Ἐγώ εἰμι, ἀπῆλθον εἰς τὰ ὀπίσω καὶ ἔπεσαν χαμαί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/006.yaml
  text: So when he said to them[a], “I am he,” they went backward and fell to the ground.
translation:
  language: ja
  text: そこで、イエスが彼らに「わたしがその人だ[a]」と言ったとき、彼らは後ずさりして地面に倒れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すれば「わたしはある」。また、「わたしだ」とも訳せる。このギリシア語表現は、ヨハネ福音書に特徴的な「わたしはある」という表現と響き合っている可能性もある。
    reason: 自己同定として自然な本文訳を保ちながら、Ἐγώ εἰμιのより字義的な訳と、ヨハネ福音書内での含意の可能性を示すため。
lexical_decisions:
- source_word: ὡς οὖν
  choice: そこで、…すると
  rationale: 時間的な契機と前文からの展開を、自然な現代日本語の叙述で表す。
- source_word: εἶπεν αὐτοῖς
  choice: 彼らに…と言う
  rationale: λέγωと与格の関係を簡潔かつ直接的に保つ。文脈上の主語イエスを明示した。
- source_word: Ἐγώ εἰμι
  choice: わたしがその者だ
  rationale: 直前の問いに対する自己同定として自然に伝えつつ、ギリシア語の直訳とヨハネ福音書における響きは脚注に残す。
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: 後ずさりし
  rationale: 後方への実際の移動を、簡潔で自然な日本語で表す。
- source_word: ἔπεσαν χαμαί
  choice: 地面に倒れた
  rationale: χαμαίが示す地面への落下を明確に表す。
theological_decisions:
- issue: ヨハネ福音書におけるἘγώ εἰμιの自己同定と神学的な響き
  choice: わたしがその者だ
  alternative: わたしはある／わたしだ
  rationale: 直近の文脈では、捜している人物が自分だという自己同定が第一義的である。一方、絶対用法の「わたしはある」と響き合う可能性を消さないため、字義的表現を脚注に示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。会話は自然な自己同定とし、原文の曖昧さと神学的緊張は脚注で保持した。
