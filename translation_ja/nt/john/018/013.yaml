source:
  edition: SBLGNT
  text: καὶ ⸀ἤγαγον πρὸς Ἅνναν πρῶτον· ἦν γὰρ πενθερὸς τοῦ Καϊάφα, ὃς ἦν ἀρχιερεὺς τοῦ ἐνιαυτοῦ ἐκείνου·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/013.yaml
  text: And they led him first to Annas, for he was the father-in-law of Caiaphas, who was high priest that year.
translation:
  language: ja
  text: そして彼らは、まずイエスをアンナスのもとへ連れて行った。アンナスは、その年に大祭司であったカイアファの義父だったからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγαγον
  choice: 連れて行った
  rationale: ἄγωは「導く、連れて行く」を意味する。逮捕後、拘束下で移送する文脈を自然な日本語で表した。目的語のイエスは文脈上明らかであり、日本語で明示した。
- source_word: πρὸς Ἅνναν
  choice: アンナスのもとへ
  rationale: 対格を伴うπρόςは人を目的地とする移動を示す。「のもとへ」は単なる方向だけでなく、その人物のところへ連行されたことを自然に表す。
- source_word: πρῶτον
  choice: まず
  rationale: 副詞として順序を示し、次の移送に先立ってアンナスが最初の行き先だったことを簡潔に表す。
- source_word: πενθερὸς
  choice: しゅうと
  rationale: πενθερόςは妻の父を指す。現代日本語では「義父」も可能だが、婚姻関係を明確に示し、実父との混同を避けるため「しゅうと」とした。
- source_word: ἀρχιερεὺς
  choice: 大祭司
  rationale: ユダヤ教の最高祭司職を表す定着した日本語訳。
- source_word: τοῦ ἐνιαυτοῦ ἐκείνου
  choice: その年に
  rationale: 大祭司であった時を示す属格句を、日本語として自然な時間表現にした。ヨハネの時間的限定を保持する。
- source_word: Ἅνναν
  choice: アンナス
  rationale: 日本語聖書で広く定着した固有名表記を用いた。
- source_word: Καϊάφα
  choice: カイアファ
  rationale: 日本語聖書で広く定着した固有名表記を用いた。
theological_decisions:
- issue: 「その年に大祭司であった」人物の指示対象
  choice: 関係節がカイアファを修飾することを明示する語順
  alternative: 日本語の語順によってはアンナスを修飾するようにも読める表現
  rationale: ギリシア語の関係代名詞ὃςは直近の先行詞Καϊάφαを自然に受ける。「その年に大祭司であったカイアファ」と配置し、原文にはない曖昧さを持ち込まないようにした。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「彼ら」よりも場面上の集団を自然に指す「一行」を用い、目的語は「イエス」と明示した。「しゅうと」は正確だが表記上の難しさを避けるため平仮名とした。
