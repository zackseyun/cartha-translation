  text: ταῦτα δὲ αὐτοῦ εἰπόντος εἷς ⸂παρεστηκὼς τῶν ὑπηρετῶν⸃ ἔδωκεν ῥάπισμα τῷ Ἰησοῦ εἰπών· Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/022.yaml
  text: And when he had said these things[a], one of the officers standing by struck Jesus, saying[b], “Is this how you answer the high priest?”
translation:
  language: ja
  text: イエスがこれらのことを言われたとき、そばに立っていた役人の一人がイエスを打って[a]、「大祭司に向かって、そのような答え方をするのか」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「打って」は、手による一打ちを表すギリシア語の表現。平手打ち、またはそれに類する打撃を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα δὲ αὐτοῦ εἰπόντος
  choice: イエスがこう言われると
  rationale: 属格独立構文を自然な時間節で表した。ταῦταは直前の発言全体を受け、日本語では「こう」が自然である。δὲは物語の進行を示すため、独立した接続語を置かず「すると」に含めた。
- source_word: εἷς παρεστηκὼς τῶν ὑπηρετῶν
  choice: そばに立っていた下役の一人
  rationale: παρεστηκώςのその場に立っている状態を「そばに立っていた」で表した。ὑπηρέτηςは公的な任務を帯びた従者・係官を指し得るが、所属や職制を本文で特定しすぎないよう「下役」とした。
- source_word: ἔδωκεν ῥάπισμα τῷ Ἰησοῦ
  choice: イエスを平手で打ち
  rationale: ῥάπισμαは手による平手打ち、またはそれに類する打撃を指す。「平手で打つ」は動作を簡潔かつ自然に示す。
- source_word: εἰπών
  choice: 「…」と言った
  rationale: 付帯状況の分詞を、日本語の自然な語順に合わせて直接話法の後に置いた。
- source_word: Οὕτως ἀποκρίνῃ τῷ ἀρχιερεῖ;
  choice: 大祭司に向かって、そんな答え方をするのか
  rationale: οὕτωςの非難を込めた様態を「そんな答え方」で表し、与格の相手を「大祭司に向かって」と明示した。ἀρχιερεύςは文脈上「大祭司」が標準的である。
theological_decisions:
- issue: ὑπηρετῶνが指す者の身分
  choice: 下役
  alternative: 役人／従者／神殿警備の者
  rationale: 大祭司側の公的な要員である可能性は高いが、ギリシア語自体は職制を限定しない。「下役」は従属的な公務担当者という文脈を保ちつつ、「神殿警備」とまで特定することを避ける。
- issue: ῥάπισμαの打撃の形
  choice: 平手で打つ
  alternative: 殴る／一打ちする
  rationale: 語は手による平手打ちまたは類似の打撃を表す。「平手で打つ」が中心的意味を明瞭に伝える一方、拳で殴ったと断定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、裁きの場面にふさわしい落ち着いた叙述調とした。イエスへの敬意は「言われる」で示す一方、過度な敬語表現は避けた。
