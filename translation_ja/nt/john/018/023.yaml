id: JHN.18.23
reference: John 18:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Εἰ κακῶς ἐλάλησα, μαρτύρησον περὶ τοῦ κακοῦ· εἰ δὲ καλῶς, τί με δέρεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/023.yaml
  text: Jesus answered him[a], “If I spoke wrongly, testify about the wrong; but if rightly[b], why do you strike me?”
translation:
  language: ja
  text: イエスは彼に答えた。「わたしが悪いことを言ったのなら、その悪い点について証言しなさい[a]。だが、正しいことを言ったのなら、なぜわたしを打つのか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その悪について証言しなさい」「何が悪かったのか証言しなさい」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「なぜわたしを殴るのか」。ギリシア語の動詞は広く「打つ」を表し、文脈によっては「打ちたたく」という意味にもなる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ἰησοῦς
  choice: イエスは彼に答えた
  rationale: 応答を表す定型的な叙述として、現代日本語で自然かつ原文の間接目的語も明示する。
- source_word: κακῶς ἐλάλησα
  choice: わたしが悪く語った
  rationale: κακῶςの道徳的・事実的・手続き的な幅を狭めず、後半のκαλῶςとの対照を保つ。「間違ったことを言った」とすると発言内容だけに限定されやすいため避けた。
- source_word: μαρτύρησον
  choice: 証言しなさい
  rationale: 法的・審理的な場面での証言という語感を保持し、単なる「言いなさい」より原語に忠実にした。
- source_word: περὶ τοῦ κακοῦ
  choice: その悪い点について
  rationale: 名詞化された「悪いこと／悪」を、日本語として不自然にならない形で表しつつ、具体的に何が悪かったかを証言せよという意味を保つ。
- source_word: εἰ δὲ καλῶς
  choice: しかし、正しく語ったのなら
  rationale: 前半との明瞭な対照を示し、省略された「語った」を日本語では補って論理関係を明確にする。
- source_word: τί με δέρεις
  choice: なぜわたしを打つのか
  rationale: τίの理由を問う用法を「なぜ」とし、δέρωは一回の殴打にも広い意味の打撃にも対応できる「打つ」で訳した。
theological_decisions:
- issue: 不当な暴力に対するイエスの応答の性格
  choice: 証言を求め、殴打の理由を問う法的・倫理的な異議として訳す
  alternative: 不正への非難を強める意訳、または司法的な響きを弱める訳
  rationale: 本文が明示する条件論法と証言要求をそのまま示し、抵抗・無抵抗などに関する教理的説明を付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、審理の場にふさわしい端正さを保った。「悪く／正しく」の対照を明示し、イエスの発言の論理的緊張を解消しない訳とした。
