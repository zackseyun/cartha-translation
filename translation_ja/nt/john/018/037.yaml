reference: John 18:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτῷ ὁ Πιλᾶτος· Οὐκοῦν βασιλεὺς εἶ σύ; ἀπεκρίθη ⸀ὁ Ἰησοῦς· Σὺ λέγεις ὅτι βασιλεύς ⸀εἰμι. ἐγὼ εἰς τοῦτο γεγέννημαι καὶ εἰς τοῦτο ἐλήλυθα εἰς τὸν κόσμον ἵνα μαρτυρήσω τῇ ἀληθείᾳ· πᾶς ὁ ὢν ἐκ τῆς ἀληθείας ἀκούει μου τῆς φωνῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/037.yaml
  text: 'Then Pilate said to him[a], “So then, are you a king?” Jesus answered, “You say that I am a king. For this I have been born, and for this I have come into the world: that I should bear witness to the truth. Everyone who is of the truth listens to my voice.”'
translation:
  language: ja
  text: そこでピラトはイエスに言った。「それでは、あなたは王なのか。」イエスは答えた。「わたしが王だと、あなたは言っているのです。[a] わたしはこのために生まれ、このために世に来ました。真理について証しするためです。真理に属する者は皆、わたしの声に耳を傾けます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの言うとおり、わたしは王です」、または「あなたがそう言っているのです」。ギリシア語は簡潔で、一定の留保を伴う肯定とも受け取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐκοῦν
  choice: それでは
  rationale: 直前の対話から結論を引き出すピラトの推論を、自然な現代日本語で表す。
- source_word: βασιλεὺς
  choice: 王
  rationale: ローマ当局による尋問という政治的文脈と、ヨハネ福音書におけるメシア的含意の双方を保つ標準的な訳語。
- source_word: Σὺ λέγεις ὅτι βασιλεύς εἰμι
  choice: わたしが王だと、あなたは言っているのです
  rationale: 簡潔で含みのあるギリシア語を、明白な肯定にも否定にも限定せず、語順も生かして表した。
- source_word: γεγέννημαι
  choice: 生まれ
  rationale: 日本語では完了形を機械的に再現せず、現在に至る使命とのつながりが文脈から伝わる自然な表現とした。
- source_word: ἐλήλυθα εἰς τὸν κόσμον
  choice: 世に来ました
  rationale: ヨハネ文書に特徴的な使命と起源の響きを保ちつつ、自然で格調ある日本語とした。
- source_word: μαρτυρήσω τῇ ἀληθείᾳ
  choice: 真理について証しする
  rationale: 証言・証明に関わるヨハネの語彙を「証し」で保ち、与格の関係は自然な「について」で表した。
- source_word: πᾶς ὁ ὢν ἐκ τῆς ἀληθείας
  choice: 真理に属する者は皆
  rationale: ἐκの起源・帰属の含みを、直訳調の「真理から出ている」ではなく、理解しやすい関係表現で示した。
- source_word: ἀκούει μου τῆς φωνῆς
  choice: わたしの声に耳を傾けます
  rationale: 単に音声を知覚するだけでなく、受け入れて聴く応答的な意味を表し、「声」というヨハネ的表現も保持した。
theological_decisions:
- issue: ピラトへのイエスの返答（Σὺ λέγεις ὅτι βασιλεύς εἰμι）の含み
  choice: 「わたしが王だと、あなたは言っているのです」とし、限定を伴う肯定にも聞こえる曖昧さを残す
  alternative: 「そのとおり、わたしは王です」または「そう言っているのはあなたです」
  rationale: 原文は強い肯定とも距離を置く返答とも解し得るため、本文ではいずれかに決めず、脚注で解釈の幅を示した。
- issue: 「生まれた」と「世に来た」という使命表現
  choice: 二つの節をそれぞれ訳し分ける
  alternative: 一つの使命声明にまとめて意訳する
  rationale: 原文が区別する誕生と世への到来を保ち、受肉に関わり得る含意を説明として付加せず本文そのものに残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、尋問場面にふさわしい簡潔さと尊厳を保った。イエスはピラトに対して丁寧体で答えるが、過度に儀礼的な敬語は避けた。「証し」「真理」「声」はヨハネ福音書内の語彙的連関を保つため一貫性を重視した。
