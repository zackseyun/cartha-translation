id: JHN.18.1
reference: John 18:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα ⸀εἰπὼν Ἰησοῦς ἐξῆλθεν σὺν τοῖς μαθηταῖς αὐτοῦ πέραν τοῦ χειμάρρου ⸀τοῦ Κεδρὼν ὅπου ἦν κῆπος, εἰς ὃν εἰσῆλθεν αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/001.yaml
  text: After saying these things[a], Jesus went out with his disciples across the Kidron Valley, where there was a garden, into which he and his disciples entered.
translation:
  language: ja
  text: イエスはこれらのことを話した後、弟子たちとともに出て、キドロンの川[a]を渡った。そこには園があり、イエスと弟子たちはその中に入った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キドロンの谷」「キドロンの涸れ川」とも訳せる。ギリシャ語は、雨季などに水が流れる谷筋や水路を指す。
    reason: χείμαρροςの季節的な水流および谷筋という含意と、可能な訳語を示すため。
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: これらのことを話し終えると
  rationale: アオリスト分詞を、先行する発言と続く行動の時間的順序が自然に伝わる節として訳した。「話し終える」は文脈上の一区切りを表し、現代日本語として明快である。
- source_word: ἐξῆλθεν
  choice: 出て
  rationale: 具体的な移動を表す「出る」という基本義を保ち、文脈から場所を補わずに訳した。
- source_word: σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たちとともに
  rationale: σύνの同伴の意味を明示しつつ、簡潔で格調ある現代日本語とした。
- source_word: πέραν τοῦ χειμάρρου τοῦ Κεδρών
  choice: キドロンの谷川の向こう側へ
  rationale: πέρανの到達点としての「向こう側」を保った。χείμαρροςは季節的に水が流れる谷筋・水路を指すため、単なる恒常河川を想定させにくい「谷川」を本文に採用し、訳語の幅は脚注に示した。
- source_word: ὅπου ἦν κῆπος
  choice: そこには園があり
  rationale: 場所を示す関係表現と存在を自然な日本語に組み替えた。κῆποςは囲われた庭園・園を指し得るため、簡潔な「園」とした。
- source_word: εἰς ὃν εἰσῆλθεν
  choice: その中に入った
  rationale: εἰςが示す内部への方向を「中に」で明示し、日本語として不自然な関係節を避けた。
- source_word: αὐτὸς καὶ οἱ μαθηταὶ αὐτοῦ
  choice: イエスと弟子たちは
  rationale: αὐτόςの指示対象を固有名で再提示し、日本語で主語が明確になるようにした。「自身」は不要な強調となるため加えていない。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語文にふさわしい落ち着いた調子を保った。「庭」よりも聖書物語の場所として自然で簡潔な「園」を選び、「向こう側へ行った」によって移動を明示した。脚注記号は対象語の直後に置いた。
