id: JHN.18.17
reference: John 18:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει οὖν ⸂τῷ Πέτρῳ ἡ παιδίσκη ἡ θυρωρός⸃· Μὴ καὶ σὺ ἐκ τῶν μαθητῶν εἶ τοῦ ἀνθρώπου τούτου; λέγει ἐκεῖνος· Οὐκ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/017.yaml
  text: So the servant girl who kept the door said to Peter[a], “You are not also one of this man's disciples, are you?” He said, “I am not.”
translation:
  language: ja
  text: そこで、門番をしていた女の召使い[a]がペテロに言った。「あなたも、あの人の弟子の一人ではないでしょうね。」ペテロは言った。「違う。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「女奴隷」。
    reason: παιδίσκηは女性の召使いを指すが、女性奴隷を指すこともあるため。
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語の進行を、自然な現代日本語で示す。
- source_word: παιδίσκη
  choice: 女の召使い
  rationale: 若い女性の使用人を表す語。法的身分を断定しすぎず、性別と奉仕者としての立場を明確にする。
- source_word: θυρωρός
  choice: 門番をしていた
  rationale: 入口を見張り、出入りに応対する役割を自然な連体修飾で表す。
- source_word: Μὴ καὶ σὺ
  choice: あなたも……ではないでしょうね
  rationale: 否定の答えを予想する μή 疑問文の含みを、日本語として不自然にならない形で保つ。
- source_word: ἐκ τῶν μαθητῶν
  choice: 弟子の一人
  rationale: 集団への所属を表す ἐκ の部分的用法を、自然な日本語で示す。
- source_word: τοῦ ἀνθρώπου τούτου
  choice: あの人
  rationale: イエスをやや距離を置いて指す表現として、文脈に即した自然な日本語を用いる。称号にはしない。
- source_word: ἐκεῖνος
  choice: ペトロ
  rationale: 日本語では主語を省略すると話者が曖昧になり得るため、指示対象を明示する。
- source_word: Οὐκ εἰμί
  choice: 違う
  rationale: 『私はそうではない』という簡潔な否定を、会話として自然かつ鋭く表す。
theological_decisions:
- issue: μή で導かれる否定疑問文の力
  choice: 否定の返答を見込む『……ではないでしょうね』と訳す
  alternative: 中立的に『……ですか』、または『……ではありませんか』と訳す
  rationale: 話し手が否定答を予想しているギリシア語の語用論的含みを保持しつつ、口調を過度に強めない。
- issue: παιδίσκη の社会的身分
  choice: 本文では『女の召使い』とする
  alternative: 『女奴隷』『召使いの少女』
  rationale: この語は女性の奴隷・使用人を指し得るが、ここでは入口を守る役割が前景化されている。法的身分や年齢を本文で過度に確定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語。叙述は簡潔で品位を保ち、会話では否定を予想する問いとペトロの短い否認を自然に再現した。
