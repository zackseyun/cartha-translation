source:
  edition: SBLGNT
  text: Εἰσῆλθεν οὖν ⸂πάλιν εἰς τὸ πραιτώριον⸃ ὁ Πιλᾶτος καὶ ἐφώνησεν τὸν Ἰησοῦν καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/033.yaml
  text: So Pilate went back into the governor’s headquarters and called Jesus and said to him[b][a], “Are you the King of the Jews?”
translation:
  language: ja
  text: そこでピラトは再び総督官邸[a]に入り、イエスを呼び寄せて言った。「あなたがユダヤ人の王なのか。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「プラエトリウム」。ローマ総督の公的な居所または執務拠点。
    reason: lexical_alternative
  - marker: b
    text: 「ユダヤ人」は「ユダヤ地方の人々」とも訳し得る。ギリシア語は、ユダヤ人一般を指す場合と、文脈によってユダヤ地方の人々を指す場合がある。
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰσῆλθεν ... πάλιν
  choice: 再び……に入り
  rationale: 移動の反復・帰還を表すπάλινを「再び」で示し、自然な日本語で官邸への再入場を伝える。
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語の進行と帰結を、現代日本語で自然に示す。
- source_word: πραιτώριον
  choice: 総督官邸
  rationale: ローマ総督の公的な居所・執務拠点を簡潔かつ明瞭に表す。「プラエトリウム」は脚注で補う。
- source_word: ἐφώνησεν τὸν Ἰησοῦν
  choice: イエスを呼び寄せて
  rationale: ここでのφωνέωは単に声をかけるだけでなく、イエスを自分のもとへ呼ぶ意味なので、「呼び寄せて」とした。
- source_word: εἶπεν αὐτῷ
  choice: 言った
  rationale: 原文のλέγωの一般的な意味を保ち、後続する疑問文そのものに問いの力を担わせた。
- source_word: Σὺ εἶ ὁ βασιλεὺς
  choice: あなたが……王なのか
  rationale: 明示された代名詞σύの強調を、日本語の係助詞「が」と疑問表現によって自然に表した。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人の
  rationale: ローマ当局が扱う王権の告発として定着し、文脈にも適する。「ユダヤ地方の人々」という地理的含意の可能性は脚注に残す。
theological_decisions:
- issue: 王号におけるἸουδαίωνの訳
  choice: ユダヤ人
  alternative: ユダヤ地方の人々（ユダヤ人たち）
  rationale: 受難物語における政治的告発として「ユダヤ人の王」が最も自然で歴史的にも適切である。一方、この語には文脈によって地域的な「ユダヤ地方の人々」という意味もあり得るため、その幅を脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「総督官邸」で制度的背景を理解しやすくしつつ、専門語は脚注に保存した。ピラトの問いは簡潔で直接的な調子とした。
