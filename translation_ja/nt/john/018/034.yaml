  text: ⸀ἀπεκρίθη Ἰησοῦς· ⸂Ἀπὸ σεαυτοῦ⸃ σὺ τοῦτο λέγεις ἢ ἄλλοι ⸂εἶπόν σοι⸃ περὶ ἐμοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/018/034.yaml
  text: Jesus answered[a], “Are you saying this on your own, or did others tell you about me?”
translation:
  language: ja
  text: イエスは答えた。「それは、あなた自身で[a]そう言っているのですか。それとも、ほかの人たちがわたしについてあなたに話したのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなた自身から」。ピラトの発言が彼自身に由来するのか、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 問いに応じる福音書の標準的な叙述表現として、簡潔で自然な現代日本語を用いた。
- source_word: Ἀπὸ σεαυτοῦ
  choice: あなた自身の考えで
  rationale: 直訳は「あなた自身から」であり、ピラトの発言が本人に由来するのかを問う表現。日本語として意味が通るようにしつつ、起点を示すニュアンスを保った。直訳は脚注に示した。
- source_word: σὺ
  choice: あなた
  rationale: 明示された代名詞の強調を日本語でも保持した。
- source_word: τοῦτο
  choice: それは
  rationale: 直前のピラトの問いを指すため、会話として自然な指示語「それ」を用いた。
- source_word: λέγεις
  choice: 言っているのですか
  rationale: 現在形による当面の発言への問いかけを、自然な会話表現で示した。
- source_word: ἢ
  choice: それとも
  rationale: 二つの可能性を対置する疑問文に適した接続表現。
- source_word: ἄλλοι
  choice: ほかの人たち
  rationale: ピラト以外の不特定の複数の人物を、明瞭な現代日本語で表した。
- source_word: εἶπόν σοι
  choice: あなたに話したのですか
  rationale: ここでの λέγω は人に何かを告げる意味。「話した」は、内容を伝えたことを自然に表す。
- source_word: περὶ ἐμοῦ
  choice: わたしについて
  rationale: περί＋属格の「～について、～に関して」という意味を直接かつ自然に表した。
theological_decisions:
- issue: イエスの問いの力点
  choice: ピラトの発言が本人に由来するのか、それとも他者から伝えられたのかを問う文として訳した。
  alternative: 「自分の判断で尋ねているのですか」のように、動機や主体的判断を前面に出して訳す。
  rationale: 原文は発言の由来に焦点を置いており、ピラトの動機や神学的意味を本文で断定していない。その緊張を解消せずに残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、法廷での対話にふさわしい落ち着いた丁寧体とした。「あなた」を明示して原文の強調を保ち、過度に解釈的な語を避けた。
