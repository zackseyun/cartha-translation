  text: ἀπεκρίθη Ἰησοῦς· Εἶπον ὑμῖν ὅτι ἐγώ εἰμι· εἰ οὖν ἐμὲ ζητεῖτε, ἄφετε τούτους ὑπάγειν·
base_translation:
  language: en
  yaml_path: translation/nt/john/018/008.yaml
  text: Jesus answered[a], “I told you that I am he. So if you are seeking me, let these men go.”
translation:
  language: ja
  text: イエスは答えられた。「『わたしだ』[a]と、あなたがたに言った。だから、わたしを捜しているのなら、この人たちを行かせなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしである」。ギリシア語には「その者だ」に当たる補語がなく、ここでは身元を示す答えとして読める一方、ヨハネ福音書に見られる絶対的な表現としての響きも残る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えられた
  rationale: 対話を導く標準的な叙述表現。イエスへの敬意を自然な現代日本語の敬語で示した。
- source_word: Εἶπον ὑμῖν
  choice: あなたがたに言った
  rationale: 直前にすでに告げた内容を指す。「言った」は簡潔で、原文の λέγω の意味を過度に強めない。
- source_word: ἐγώ εἰμι
  choice: わたしだ
  rationale: 逮捕に来た者たちに自分が捜している人物だと示す、文脈上の自然な日本語。絶対的用法としての響きは脚注に残した。
- source_word: ζητεῖτε
  choice: 捜している
  rationale: その場でイエスを捜し求めている継続中の行為を、現在進行の自然な日本語で表した。
- source_word: ἄφετε τούτους ὑπάγειν
  choice: この人たちは行かせなさい
  rationale: 「彼らが去るのを許せ」という使役・許可の意味を簡潔に表す。「釈放する」ほど拘束状態を明示しない。
- source_word: τούτους
  choice: この人たち
  rationale: 指示代名詞の近称を保ちつつ、日本語として指示対象を自然に明示した。原文自体は性別を語形上明示しないため、「男たち」とはしなかった。
theological_decisions:
- issue: ヨハネ文書における ἐγώ εἰμι の訳し方
  choice: 本文では「わたしだ」、脚注で「わたしはある」
  alternative: 本文を「わたしはある」とする
  rationale: 直接の文脈では身元確認への答えなので「わたしだ」が明瞭で自然。一方、ギリシア語には明示された補語がなく、ヨハネ福音書における絶対的な ἐγώ εἰμι の神学的な響きを排除できないため、脚注でその形を保存した。
translation_notes:
  register: 明快で品位のある現代標準語。会話は簡潔にし、古風な「汝ら」「去らせよ」などを避けた。
