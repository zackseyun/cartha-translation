id: JHN.18.3
reference: John 18:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ οὖν Ἰούδας λαβὼν τὴν σπεῖραν καὶ ἐκ τῶν ἀρχιερέων καὶ ⸂ἐκ τῶν⸃ Φαρισαίων ὑπηρέτας ἔρχεται ἐκεῖ μετὰ φανῶν καὶ λαμπάδων καὶ ὅπλων.
base_translation:
  language: en
  yaml_path: translation/nt/john/018/003.yaml
  text: So Judas[a], having taken the cohort and officers from the chief priests and from the Pharisees[b], comes there with lanterns and torches and weapons.
translation:
  language: ja
  text: そこでユダは、一隊の兵士[a]と、祭司長たちおよびファリサイ派からの役人たち[b]を連れ、ともしびやたいまつ、武器を携えて、そこへやって来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一隊の兵士」と訳したギリシア語は、ローマ軍の「歩兵隊」や「分遣隊」を指すこともあるが、ここで部隊全員が来たことを必ずしも意味しない。
    reason: lexical_alternative
  - marker: b
    text: 「役人たち」は、「警備の者たち」あるいは「神殿の警備員たち」とも訳せる。ユダヤ人当局に仕える公的な随員・職員を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 前の文脈を受けた物語の展開を、自然な現代日本語で示す。
- source_word: λαβὼν
  choice: 引き連れ
  rationale: 主動詞に先立つ行為を日本語として自然に組み込み、ユダが一行を伴ったことを表す。
- source_word: σπεῖραν
  choice: 一隊の兵士
  rationale: 軍事的な集団であることを示しつつ、ローマ軍の一個歩兵隊全員が来たと断定しない表現とした。
- source_word: ὑπηρέτας
  choice: 下役たち
  rationale: 祭司長たちとファリサイ派に仕える公的な従者・警備要員を指し得る幅を保ち、『神殿警察』と限定しない。
- source_word: ἀρχιερέων
  choice: 祭司長たち
  rationale: ユダヤの指導的祭司層を指す標準的な訳語。
- source_word: Φαρισαίων
  choice: ファリサイ派の人々
  rationale: 集団名を明確で自然な現代日本語にした。
- source_word: ἔρχεται
  choice: やって来た
  rationale: ギリシア語の歴史的現在の生き生きした動きを保ちながら、日本語の物語文として自然にした。
- source_word: ἐκεῖ
  choice: そこへ
  rationale: 直前の文脈で示された場所を指す単純な場所表現。
- source_word: φανῶν
  choice: ともしび
  rationale: 携帯用の灯火を表し、λαμπάδωνとの区別を保つ。
- source_word: λαμπάδων
  choice: たいまつ
  rationale: 燃える松明を指す語として、φανῶνと区別した。
- source_word: ὅπλων
  choice: 武器
  rationale: 武装に用いる道具を広く指す明瞭な現代語。
theological_decisions:
- issue: 逮捕に来た一行の構成と規模
  choice: σπεῖραを『一隊の兵士』、ὑπηρέταςを『下役たち』とし、軍人とユダヤ当局側の要員から成る一行として訳す。
  alternative: 『一個歩兵隊と神殿警察』のように、部隊規模と職務を具体的に限定する。
  rationale: 原文は二種類の集団を示すが、σπεῖρα全員が出動したか、ὑπηρέταιが厳密にどの職名だったかまでは確定しないため、その曖昧さを保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の軍事的・公的な語感を保ちつつ、部隊規模や役職を過度に特定しない。灯火二語の区別は『たいまつ』と『ともしび』で示した。
