id: JHN.9.31
reference: John 9:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οἴδαμεν ὅτι ⸂ἁμαρτωλῶν ὁ θεὸς⸃ οὐκ ἀκούει, ἀλλ’ ἐάν τις θεοσεβὴς ᾖ καὶ τὸ θέλημα αὐτοῦ ποιῇ τούτου ἀκούει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/031.yaml
  text: We know that God does not listen to sinners; but if anyone is God-fearing and does his will[a], he listens to him.
translation:
  language: ja
  text: 私たちは、神が罪人たちに耳を傾けないことを知っています。しかし、だれかが神を畏れ[a]、その御心を行うなら、神はその人に耳を傾けます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神を礼拝する者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: 私たちは…知っています
  rationale: 完了形に由来する οἶδα はコイネー・ギリシア語で現在の意味を持つため、現代日本語として自然な現在表現にした。
- source_word: ἁμαρτωλῶν
  choice: 罪人たち
  rationale: 属格複数形が、神が耳を傾けないとされる人々の類を示す。簡潔で、原語の道徳的・宗教的な力を保つ。
- source_word: ἀκούει
  choice: 願いに耳を傾ける
  rationale: ここでは単なる聴覚ではなく、人の訴えを好意的に聞き入れる意味である。「願いに」は文脈から補い、「聞こえる」ではなく応答的な含意を自然な日本語で表した。ただし「答える」とまでは訳していない。
- source_word: θεοσεβὴς
  choice: 神を畏れる
  rationale: 神への崇敬を表す形容詞。日本語では述語として「神を畏れる」が自然で、神への敬虔な態度を保ちつつ、礼拝行為だけに意味を狭めない。
- source_word: τὸ θέλημα αὐτοῦ ποιῇ
  choice: その御心を行う
  rationale: ποιεῖν τὸ θέλημα という慣用表現に即した自然な訳。「御心」は神の意志を指す日本語として明瞭で品位がある。
- source_word: τούτου ἀκούει
  choice: 神はその人の願いに耳を傾けます
  rationale: τούτου は直前の、神を畏れて御心を行う人を強く指す。「その人」と明示し、前半と同じ表現を繰り返して対比を保った。
- source_word: ἀλλ’ ἐάν τις
  choice: しかし、だれかが…なら
  rationale: 対照を示す条件節を、現代日本語として自然な形で再現した。不定単数の意味も保っている。
theological_decisions:
- issue: 「神が罪人たちの願いには耳を傾けない」という発言の範囲
  choice: 話者が述べる主張の強さを保ち、教理的な限定や一般化を加えない。
  alternative: 「神は罪人の祈りを聞かれない」「神は罪人を是認されない」
  rationale: 原文は単に、神が罪人たちには「耳を傾けない」と述べ、それを神を畏れて御心を行う人への態度と対比する。神が罪人を認知し得るか、あらゆる祈りにどう応じるかといった体系的説明を訳文に持ち込まない。
- issue: θεοσεβής の訳
  choice: 神を畏れる
  alternative: 神を礼拝する者である
  rationale: 原語は神への崇敬を示し、「神を畏れる」は形容詞的な広がりを自然に表す。「神を礼拝する者」も可能なので脚注に残す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「御心」は神の意志を表す慣用的な敬語として用いた。「願い」は原文に明示されないが、ἀκούω が人を属格目的語に取るこの文脈で、好意的に聞き入れる意味を日本語で誤解なく示すために最小限補った。脚注記号 [a] は該当語句の直後に置いた。
