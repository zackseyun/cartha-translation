source:
  edition: SBLGNT
  text: πάλιν οὖν ἠρώτων αὐτὸν καὶ οἱ Φαρισαῖοι πῶς ἀνέβλεψεν. ὁ δὲ εἶπεν αὐτοῖς· Πηλὸν ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς, καὶ ἐνιψάμην, καὶ βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/015.yaml
  text: So the Pharisees also asked him again how he had received his sight[a]. He said to them, “He put mud on my eyes, and I washed[b], and I see.”
translation:
  language: ja
  text: そこで、ファリサイ人たちも、彼がどのようにして見えるようになったのかを、再び彼に尋ねた。彼は彼らに言った。「あの方が私の目に泥[a]をつけました。私は洗いました。今、見えます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「粘土」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν οὖν
  choice: そこで…また
  rationale: οὖνの物語上のつながりを「そこで」で示し、πάλινが表す質問の反復を「また」で明示した。
- source_word: καὶ οἱ Φαρισαῖοι
  choice: ファリサイ派の人々も
  rationale: καίが、先に尋ねた人々に加えてファリサイ派も質問したことを示すため、「も」とした。現代日本語で一般読者に分かりやすい呼称を用いた。
- source_word: πῶς ἀνέβλεψεν
  choice: どうして見えるようになったのか
  rationale: ἀναβλέπωはこの治癒の文脈では視力を得ることを表す。生まれつき目の見えなかった人物なので、「視力を取り戻した」よりも「見えるようになった」が文脈に適合する。
- source_word: Πηλὸν
  choice: 泥
  rationale: πηλόςは泥または粘土を指す。ここでは水分を含み目につけられる物質として、自然で分かりやすい「泥」を本文に採用し、「粘土」の可能性を脚注に残した。
- source_word: ἐπέθηκέν μου ἐπὶ τοὺς ὀφθαλμούς
  choice: 私の目に泥をつけました
  rationale: ἐπιτίθημιの「上に置く」という意味を、目と泥の組み合わせに自然な現代日本語で表した。「塗った」とまでは動作を限定しない。
- source_word: ἐνιψάμην
  choice: 私が洗うと
  rationale: 中動態の形を日本語として自然に表し、洗ったことに続いて見えるという結果が生じた流れを「と」で示した。洗った対象は直前の文脈から明らかなため補わなかった。
- source_word: βλέπω
  choice: 今は見えます
  rationale: 現在形が示す現在の状態と、直前の行為の結果としての鮮明さを「今は見えます」で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、証言の簡潔さを保った。原文末尾の現在形の生々しさを「今は見えます」で表現した。英語参照文では脚注記号と脚注内容の対応が入れ替わっていると判断し、原語上の位置に基づいて「泥」にのみ脚注を付した。
