id: JHN.9.39
reference: John 9:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν ὁ Ἰησοῦς· Εἰς κρίμα ἐγὼ εἰς τὸν κόσμον τοῦτον ἦλθον, ἵνα οἱ μὴ βλέποντες βλέπωσιν καὶ οἱ βλέποντες τυφλοὶ γένωνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/039.yaml
  text: And Jesus said[a], “For judgment I came into this world, so that those who do not see may see, and those who see may become blind.”
translation:
  language: ja
  text: イエスは言われた。「わたしがこの世に来たのは、裁きのためである。[a]それは、見えない者が見えるようになり、見える者が盲目になるためである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裁き」は、単に有罪として罰することだけでなく、イエスが来られたことによって人々の真の状態が明らかにされ、分けられるという司法的な結果をも含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίμα
  choice: 裁き
  rationale: 司法的な判断と、それによって生じる分離・帰結の両方を含み得る語である。「刑罰」や「断罪」と狭くせず、簡潔な原文の力を保った。
- source_word: κόσμον
  choice: 世
  rationale: ヨハネ文書で人間世界を指す標準的な表現として、自然で格調のある「この世」とした。
- source_word: οἱ μὴ βλέποντες / οἱ βλέποντες
  choice: 見えない者／見える者
  rationale: 名詞化された分詞の対照を保ち、肉体的な視覚と霊的な認識の双方を読み取れるようにした。「盲人／目の見える人」と限定しなかった。
- source_word: βλέπωσιν
  choice: 見えるようになり
  rationale: ἵναに続く接続法を自然な日本語で表し、視力の回復と霊的な認識の両義性を保った。
- source_word: τυφλοὶ γένωνται
  choice: 盲目になる
  rationale: γίνομαιの変化・帰結の含意を保ち、「盲目であることが明らかになる」と解釈的に弱めなかった。
- source_word: εἰς τὸν κόσμον τοῦτον ἦλθον
  choice: この世に来た
  rationale: ヨハネ特有の来臨・派遣の表現を、現代日本語として自然に訳した。
theological_decisions:
- issue: ヨハネ3章17節の「世を裁くためではなく」との関係
  choice: κρίμαを「裁き」と訳し、緊張関係をそのまま残す。
  alternative: 「分裂」「危機」などと訳して、裁きの意味を弱める。
  rationale: この節では、イエスの到来が人の真の状態をあらわにし、見る者と見えない者との司法的な逆転をもたらす。ほかの箇所との見かけ上の緊張を翻訳で解消しない。
- issue: ἵνα節の目的と結果の関係
  choice: 「それは……ためである」と訳し、イエスの来臨と二重の逆転との強い結び付きを示す。
  alternative: 「その結果」として、結果だけを明示する。
  rationale: ἵναは目的を基本としつつ結果的含意も持ち得るため、結果だけに限定する言い換えを避けた。
translation_notes:
  register: 明瞭で現代的ながら尊厳のある文体。「見えない／見える／盲目になる」という反転を簡潔に保ち、身体的意味と霊的意味の重なりを説明的な言い換えで解消しないようにした。
