  text: καὶ ἠρώτησαν αὐτοὺς λέγοντες· Οὗτός ἐστιν ὁ υἱὸς ὑμῶν, ὃν ὑμεῖς λέγετε ὅτι τυφλὸς ἐγεννήθη; πῶς οὖν ⸂βλέπει ἄρτι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/019.yaml
  text: And they asked them, saying, “Is this your son, whom you say was born blind? How then does he now see?”
translation:
  language: ja
  text: 彼らは両親に尋ねた。「この人は、あなたがたの息子で、あなたがたが生まれつき目が見えなかったと言っている人ですか。それでは、どうして今は見えるのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠρώτησαν αὐτοὺς λέγοντες
  choice: 彼らは両親に尋ねた
  rationale: 直訳的な「彼らに尋ねて言った」は現代日本語では不自然なため、分詞 λέγοντες を直接話法の導入に溶かし込んだ。αὐτούς の指示対象は直前の文脈にある両親であり、単独節としても明確になるよう「両親」とした。
- source_word: Οὗτός ἐστιν ὁ υἱὸς ὑμῶν
  choice: これは、…息子ですか
  rationale: 語順は平叙文形だが、文脈上は問いである。指示代名詞の近接性を「これ」で保ち、日本語として自然な疑問文にした。
- source_word: ὃν ὑμεῖς λέγετε
  choice: あなたがたが…と言っている
  rationale: λέγετε の中立的な意味を保ち、「主張している」のような疑念や非難を余分に加えない。明示された ὑμεῖς の強調も「あなたがたが」で表した。
- source_word: τυφλὸς ἐγεννήθη
  choice: 生まれつき目が見えなかった
  rationale: 先天的な盲目を明確にしつつ、現代日本語で自然かつ配慮ある表現とした。後半の現在の視覚との対比のため、過去形を用いた。
- source_word: πῶς οὖν
  choice: それでは、どうして
  rationale: οὖν が前の確認から導かれる論理的な問いを示すため、「それでは」で推論のつながりを保った。
- source_word: βλέπει ἄρτι
  choice: 今は見える
  rationale: βλέπει は現在の実際の視覚状態を表し、ἄρτι は以前との対比を示す。「今は」によってその対照を自然に表現した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語。尋問の調子を保ちながらも、原文にない敵意や懐疑を語彙で上乗せしない。引用内の二つの問いを簡潔に示した。
