base_translation:
  language: en
  yaml_path: translation/nt/john/009/013.yaml
  text: They brought the man who had formerly been blind to the Pharisees[a].
translation:
  language: ja
  text: 人々は、以前は目が見えなかった人を、ファリサイ人たちのところへ連れて行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγουσιν
  choice: 連れて行った
  rationale: 歴史的現在形だが、日本語の物語として自然な過去形で表した。目的地へ同行させる文脈なので「連れて行った」とした。
- source_word: αὐτὸν
  choice: その人を
  rationale: 直訳は「彼を」だが、後続の τόν ποτε τυφλόν と同じ人物を指すため、両者を自然に一つの名詞句としてまとめた。
- source_word: πρὸς τοὺς Φαρισαίους
  choice: ファリサイ派の人々のところへ
  rationale: πρός＋対格が表す、人を目的地とする移動を明確にした。「前へ」ではなく「ところへ」とし、審問の含意を本文に加えないようにした。
- source_word: Φαρισαίους
  choice: ファリサイ派の人々
  rationale: 現代日本語で集団名として分かりやすく、特定の構成員たちを指す複数形も自然に表せる。
- source_word: τόν ποτε τυφλόν
  choice: 以前は目が見えなかったその人
  rationale: 冠詞付き形容詞の実体詞的用法を「その人」と補い、ποτε が示す以前の状態と現在との対照を保った。
- source_word: ποτε
  choice: 以前は
  rationale: ここでは過去のある時点というより、現在とは異なる以前の状態を示すため、「以前は」が自然である。
- source_word: τυφλόν
  choice: 目が見えなかった
  rationale: 人物を表す日本語として自然で明瞭な表現を用い、失明が以前の状態だったことを過去形で示した。
