  text: ⸀ἤκουσαν ἐκ τῶν Φαρισαίων ταῦτα οἱ ⸂μετ’ αὐτοῦ ὄντες⸃, καὶ εἶπον αὐτῷ· Μὴ καὶ ἡμεῖς τυφλοί ἐσμεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/040.yaml
  text: Some of the Pharisees who were with him heard these things and said to him[a], “Surely we are not blind too, are we?”
translation:
  language: ja
  text: 彼と一緒にいたファリサイ派の人々のうち何人かが、これらのことを聞いて彼に言った。「まさか、私たちも目が見えないのですか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちも目が見えないのですか。」ギリシア語の疑問文は、否定の答えを予期する形になっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: 聞いて
  rationale: アオリスト直説法で、イエスが語ったことを耳にしたことを表す。物語の流れに自然な「聞いて」とした。
- source_word: ἐκ τῶν Φαρισαίων
  choice: ファリサイ派の人々のうち何人か
  rationale: 属格を伴う部分を示すἐκの意味を保ち、全員ではなく、その中の一部であることを明示した。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 複数形を保ちつつ、直前のイエスの発言全体を指し得る表現とした。
- source_word: οἱ μετ’ αὐτοῦ ὄντες
  choice: 彼と一緒にいた
  rationale: 冠詞付き分詞句が、その場でイエスと共にいたファリサイ派の人々を限定していることを自然な日本語で表した。
- source_word: εἶπον αὐτῷ
  choice: 彼に言った
  rationale: 疑問内容であっても、λέγωの基本的な語義を保ち、引用文の形で問いであることを示した。
- source_word: Μὴ
  choice: まさか……というのですか
  rationale: 否定の答えを予期するμή疑問文の方向性と、話者の意外感を現代日本語の反語的な問いで表した。
- source_word: καὶ
  choice: も
  rationale: 先に語られた盲目の者たちに「私たち」も含まれるのかという付加の意味を表した。
- source_word: ἡμεῖς
  choice: 私たち
  rationale: ギリシア語で明示された代名詞の強調を、自然な日本語の主題として保持した。
- source_word: τυφλοί
  choice: 目が見えない
  rationale: 比喩であることを説明的に限定せず、視覚的な語をそのまま保った。現代日本語として自然であり、ヨハネ文書の文字どおりの意味と比喩的意味の重なりも維持する。
- source_word: ἐσμεν
  choice: というのですか
  rationale: 連結動詞の現在形を、否定回答を予期する日本語の疑問構文の中で自然に表現した。
theological_decisions:
- issue: τυφλοίの比喩的意味を本文で明示するか
  choice: 「目が見えない」とし、「霊的に」を加えない
  alternative: 「霊的に盲目だ」
  rationale: 文脈では霊的な認識の欠如が問題だが、原文は形容詞を限定していない。無限定の表現により、ヨハネ福音書における身体的な盲目と霊的な盲目の間の皮肉と緊張を保つ。
- issue: μήで始まる疑問文の予期される答え
  choice: 「まさか……というのですか」として否定回答への期待を示す
  alternative: 「私たちも目が見えないのですか」
  rationale: 単純な中立疑問ではなく、「いや、そうではないはずだ」という話者の予想を保つ。ただし、断定的な否定文にはせず、問いとして残した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、物語文としての品位を保った。「ファリサイ派」は集団名として一般読者に分かりやすい形とし、μήの含意は「まさか」で簡潔に伝えた。
