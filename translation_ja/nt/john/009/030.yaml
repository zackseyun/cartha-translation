id: JHN.9.30
reference: John 9:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς· Ἐν ⸂τούτῳ γὰρ τὸ⸃ θαυμαστόν ἐστιν ὅτι ὑμεῖς οὐκ οἴδατε πόθεν ἐστίν, καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/030.yaml
  text: 'The man answered and said to them[a], “This is the remarkable thing: you do not know where he is from[b], and yet he opened my eyes.”'
translation:
  language: ja
  text: その人は彼らに答えた。「実に、これが驚くべきことです[a]。あなたがたは、彼がどこから来たのか[b]を知らない。それなのに、彼は私の目を開けたのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「不思議なことです」「驚異的なことです」。
    reason: θαυμαστόνは、驚くべきこと・不思議なこと・驚異的なことを意味し得る。
  - marker: b
    text: 別訳「彼がどこから来るのか」。
    reason: πόθεν ἐστίνは、その人物の出所・由来を表し得る。
lexical_decisions:
- source_word: ἀπεκρίθη ὁ ἄνθρωπος καὶ εἶπεν αὐτοῖς
  choice: その人は彼らに答えた
  rationale: 「答えて言った」という原文の定型的な重複を、意味を損なわず自然な現代日本語の叙述に整えた。「その人」は、文脈上、生まれつき目の見えなかった男性を指す。
- source_word: Ἐν τούτῳ γὰρ τὸ θαυμαστόν ἐστιν
  choice: まさに、そこが驚くべきところです
  rationale: ἐν τούτῳ の指示的な強調と、γάρの説明的な働きを「まさに、そこが…」で表した。θαυμαστόν はここでは、相手の無知と癒やしの事実との食い違いを皮肉に指摘する「驚くべき」とした。
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: あなたがたは知らない
  rationale: 明示された複数代名詞ὑμεῖςの対照的な強調を「あなたがたは」で保持し、οἴδατεを基本義どおり「知る」と訳した。
- source_word: πόθεν ἐστίν
  choice: その方がどこから来たのか
  rationale: 人物の出所・由来を問うπόθενを自然な日本語で表した。「その方」は直前から話題となっているイエスを指し、過度な解釈を加えない。
- source_word: καὶ ἤνοιξέν μου τοὺς ὀφθαλμούς
  choice: それなのに、その方は私の目を開けてくださったのです
  rationale: καίは形式上「そして」だが、ここでは相手がイエスの出所を知らないことと、実際に癒やしが行われたことの対照を示すため「それなのに」とした。目を開けるという原文の表現を保ち、身体的な癒やしを直接述べる形にした。
theological_decisions:
- issue: 「私の目を開けた」が持ち得る、ヨハネ福音書における霊的な視覚の含意
  choice: 身体的な癒やしを述べる原文の表現をそのまま保ち、霊的な意味を訳文で明示しない
  alternative: 「真理を悟らせた」など、霊的な啓示を前面に出す表現にする
  rationale: 直接の指示対象は男性の視力の回復である。福音書全体における「見ること」と「見えないこと」の神学的響きは文脈から立ち現れるべきであり、この節の訳文で一方に限定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、法廷的な尋問場面に合う丁寧で毅然とした口調にした。「くださった」は話者が受けた恩恵を自然に示す日本語であり、特定の教派的敬称を加えるものではない。
