source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν ⸀ἐκεῖνος· Εἰ ἁμαρτωλός ἐστιν οὐκ οἶδα· ἓν οἶδα ὅτι τυφλὸς ὢν ἄρτι βλέπω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/025.yaml
  text: 'So that man answered[a], “Whether he is a sinner, I do not know. One thing I do know: though I was blind, now I see.”'
translation:
  language: ja
  text: そこで、その人は答えた。「あの人が罪人かどうか[a]、私には分かりません。ただ一つ、分かっていることがあります。私は目が見えませんでしたが、今は見えます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もしあの人が罪人なら、私には分かりません。」
    reason: εἰは、知ることの内容を導く間接疑問としても、条件文としても訳しうる。本文は文脈に最も自然な間接疑問を採り、脚注に条件的な訳を示す。
lexical_decisions:
- source_word: ἀπεκρίθη οὖν ἐκεῖνος
  choice: そこで、その人は答えた
  rationale: οὖνによる前後のつながりを自然な「そこで」で示し、明示された指示代名詞ἐκεῖνοςも「その人」として保持した。
- source_word: Εἰ ἁμαρτωλός ἐστιν
  choice: あの方が罪人かどうか
  rationale: 知ることの内容を導くεἰを、日本語の間接疑問として自然な「かどうか」で表した。文脈上の指示対象であるイエスには、対話の調子に合う「あの方」を用いた。
- source_word: οὐκ οἶδα
  choice: 私には分かりません
  rationale: 現在の認識状態を表すοἶδαを「分かる」とし、対照を明瞭にするため「私には」とした。
- source_word: ἓν οἶδα
  choice: ただ一つ分かっているのは
  rationale: ἓνの限定と、直前の「分かりません」との強い対照を自然な日本語で示した。
- source_word: τυφλὸς ὢν
  choice: 私は盲目でしたが
  rationale: 以前の状態と現在との対照を表しつつ、分詞構文を自然な逆接表現にした。
- source_word: ἄρτι βλέπω
  choice: 今は見える
  rationale: ἄρτιの現在との対照を「今は」で示し、βλέπωは簡潔に「見える」と訳した。
theological_decisions:
- issue: 癒やされた人の発言を、イエスが罪人であるか否かについて訳文側が断定せずに表すこと
  choice: あの方が罪人かどうか、私には分かりません
  alternative: もしあの方が罪人なら、私には分かりません
  rationale: ここで語られているのは発言者の認識の限界であり、語り手による神学的判定ではない。「かどうか」はその未確定性を保ち、文脈上の間接疑問を自然に表す。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、証言の簡潔さと力強い対照を保った。「罪人」は文脈上の告発をそのまま伝える聖書的かつ一般に理解可能な語として採用した。
