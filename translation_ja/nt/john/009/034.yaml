id: JHN.9.34
reference: John 9:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ἐν ἁμαρτίαις σὺ ἐγεννήθης ὅλος, καὶ σὺ διδάσκεις ἡμᾶς; καὶ ἐξέβαλον αὐτὸν ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/034.yaml
  text: They answered and said to him[a], “You were born entirely in sins[c][b], and are you teaching us?” And they cast him out.
translation:
  language: ja
  text: 彼らは答えて言った。「おまえは全く罪の中に生まれたのに[a]、それなのに、おまえが私たちを教えるのか。」そして、彼を外へ追い出した。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「罪」は複数形であり、彼らの侮辱的な非難の強さを表している。
    reason: lexical_alternative
  - marker: b
    text: これは、その場から追い出したことを指すとも、文脈上、会堂の共同体から排除したことを含むとも考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: 彼らは答えて言った
  rationale: 二つの動詞を重ねるヨハネの語り口を保ちつつ、現代日本語でも理解できる表現とした。αὐτῷは続く直接話法から明らかなため、冗長な「彼に」を省いた。
- source_word: Ἐν ἁμαρτίαις
  choice: 罪の中に
  rationale: 複数形ἁμαρτίαιςを日本語で不自然な「罪々」とせず集合的な「罪」で表した。話者の侮辱的な断定を保ち、本人の罪、親の罪、先天的な状態との関連のいずれかに限定しない。
- source_word: ἐγεννήθης ὅλος
  choice: 全く…生まれた者
  rationale: ὅλοςの強意を「全く」で表し、その人の生来の状態全体を責める語調を保った。「者」を補うことで、後続の対比を自然な日本語にした。
- source_word: καὶ σὺ διδάσκεις ἡμᾶς;
  choice: そのおまえが私たちを教えるのか
  rationale: 明示されたσὺの強調と、憤った修辞疑問の調子を「そのおまえが」で表した。
- source_word: ἐξέβαλον αὐτὸν ἔξω
  choice: 彼を外へ追い出した
  rationale: ἐκβάλλωとἔξωが示す敵対的な排除を、明快で自然な現代日本語にした。単にその場から出したのか、会堂共同体から排除したのかは本文で限定しない。
theological_decisions:
- issue: 生まれつきの盲目と「罪の中に生まれた」という非難の関係
  choice: 話者たちが彼の生来の状態全体を罪と結びつけて侮辱していることを示すが、誰のどの罪を指すかは特定しない。
  alternative: 「親の罪を負って生まれた」「生まれながらの罪人だった」などと明示する。
  rationale: ギリシア語本文は非難そのものを記すだけで、その背後にある罪と苦難の因果関係を定義していないため、神学的緊張と曖昧さを残した。
- issue: 「外へ追い出した」が会堂からの正式な追放を意味するか
  choice: 本文では「外へ追い出した」とし、直接の場面上の排除を表す。
  alternative: 「会堂から追放した」と明示する。
  rationale: 文脈上、会堂共同体からの排除を含む可能性はあるが、この節の表現だけでは正式な処分と断定できないため、注で可能性を示した。
translation_notes:
  register: 明快な現代標準語を用いながら、対立場面にふさわしい厳しい語調を保った。「おまえ」はσὺの強調と侮蔑を表すが、過度に俗悪な表現は避けた。
