id: JHN.9.24
reference: John 9:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐφώνησαν οὖν ⸂τὸν ἄνθρωπον ἐκ δευτέρου⸃ ὃς ἦν τυφλὸς καὶ εἶπαν αὐτῷ· Δὸς δόξαν τῷ θεῷ· ἡμεῖς οἴδαμεν ὅτι ⸂οὗτος ὁ ἄνθρωπος⸃ ἁμαρτωλός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/024.yaml
  text: So they called the man who had been blind a second time and said to him[a], “Give glory to God; we know that this man is a sinner.”
translation:
  language: ja
  text: そこで彼らは、以前は目が見えなかったその人をもう一度呼んで、こう言った。「神に栄光を帰しなさい[a]。私たちは、この人が罪人であることを知っている。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、これは神の前で真実を語るよう厳粛に求める慣用表現で、「神に栄光を帰しなさい」、すなわち「神の前で真実を語りなさい」または「神の前で公に認めなさい」という意味とも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφώνησαν
  choice: 呼び出して
  rationale: 当局者たちがその人を再び自分たちの前に呼ぶ場面であり、「呼び出す」は文脈に自然である。ただし、語そのものに明示されない強制的・公的な含みは加えない。
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた物語の進展を自然な現代日本語で示す。
- source_word: ἐκ δευτέρου
  choice: もう一度
  rationale: 「二度目に」を意味し、日本語の物語文として自然かつ明瞭である。
- source_word: ὃς ἦν τυφλός
  choice: 以前は目が見えなかった
  rationale: その人がすでに癒やされている文脈を明確にしつつ、過去の状態を表す。「盲人」という名詞化を避け、状態として訳す。
- source_word: Δὸς δόξαν τῷ θεῷ
  choice: 神に栄光を帰しなさい
  rationale: 字義的な表現を本文に保ち、真実を語るよう厳粛に命じる慣用的な力は脚注で示す。
- source_word: ἡμεῖς οἴδαμεν
  choice: 私たちは……知っている
  rationale: 明示された代名詞による話者側の強い確信を保つ。
- source_word: οὗτος ὁ ἄνθρωπος
  choice: あの人
  rationale: 話者たちが、その場にいないイエスを指している文脈に合う自然な日本語であり、ギリシア語以上の侮蔑的な調子を加えない。
- source_word: ἁμαρτωλός
  choice: 罪人
  rationale: 抽象的な「罪深い」ではなく、彼らがその人物を「罪人」と断定する告発の形を保つ。
theological_decisions:
- issue: Δὸς δόξαν τῷ θεῷ の慣用的な意味
  choice: 本文では「神に栄光を帰しなさい」という字義的表現を保つ
  alternative: 「神の前で真実を語りなさい」「神の前で告白しなさい」と解釈的に訳す
  rationale: この句は真実を語ることや公に認めることを厳粛に求める表現として機能する可能性が高いが、原文には神に栄光を与えるという表現自体もある。本文ではその緊張を残し、慣用的意味を脚注で説明する。
translation_notes:
  register: 明瞭で現代的かつ品位ある語調。「以前は目が見えなかった」として現在は見えるという文脈を自然に示し、命令句の字義と慣用的意味の両方を本文と脚注で保持した。
