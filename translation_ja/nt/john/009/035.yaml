id: JHN.9.35
reference: John 9:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ἤκουσεν Ἰησοῦς ὅτι ἐξέβαλον αὐτὸν ἔξω, καὶ εὑρὼν αὐτὸν ⸀εἶπεν· Σὺ πιστεύεις εἰς τὸν υἱὸν τοῦ ⸀ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/035.yaml
  text: Jesus heard that they had thrown him out[a], and when he found him, he said, “Do you believe in the Son of Man?”
translation:
  language: ja
  text: イエスは、彼らがその人を外へ追い出したと聞き、彼を見つけると、言われた。「あなたは人の子[a]を信じるか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「人の子」の代わりに「神の子」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ἐξέβαλον ... ἔξω
  choice: 外へ追い出した
  rationale: 動詞と副詞を組み合わせた強い表現を保ち、共同体からの明確な排除を自然な現代日本語で表す。
- source_word: εὑρὼν
  choice: 彼を見つけると
  rationale: アオリスト分詞の時間的な働きと出来事の順序を、簡潔で自然な日本語にする。
- source_word: Σὺ πιστεύεις
  choice: あなたは……信じるか
  rationale: 明示された代名詞の強調を「あなたは」で保ちつつ、πιστεύωを文脈に即して「信じる」と訳す。
- source_word: πιστεύεις εἰς
  choice: ……を信じる
  rationale: 日本語では、ある人物に向けられた信頼を「人を信じる」と自然に表せるため。単なる命題への同意に限定しない。
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: ヨハネ福音書で称号として用いられ、ダニエル書7章との関連も持つ定着した訳語を採用する。
theological_decisions:
- issue: 問いに含まれるキリスト論的称号の異読
  choice: 人の子
  alternative: 神の子
  rationale: SBLGNT本文のἀνθρώπουに従って「人の子」を本文に置く。歴史的・神学的に重要な異読「神の子」は、本文に混入させず脚注で明示する。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔さと品位を保った。「外へ追い出した」で原文の強意を伝え、「あなたは」によりΣὺの焦点を自然に示した。脚注記号は異読が生じる称号の直後に置いた。
