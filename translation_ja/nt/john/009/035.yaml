  source_fidelity: 本文はSBLGNTの語順・内容に忠実である。「外へ追い出した」はἐξέβαλον ... ἔξωの強調された追放を適切に表し、「彼を見つけると」はεὑρὼνの時間的・継起的用法を自然に反映する。「あなたは」は明示されたΣὺの焦点を保持し、「人の子」は本文のἀνθρώπουに正確に対応している。
