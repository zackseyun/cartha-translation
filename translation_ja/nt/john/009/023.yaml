base_translation:
  language: en
  yaml_path: translation/nt/john/009/023.yaml
  text: For this reason his parents said[a], “He is of age; ask him.”
translation:
  language: ja
  text: そのため、両親は言った。[a]「もう大人です。本人に聞いてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もう十分な年齢です。本人に尋ねてください。」
