lexical_decisions:
- source_word: διὰ τοῦτο
  choice: そのため
  rationale: 直前の22節で示された理由を受ける因果関係を、簡潔で自然な日本語で表す。
- source_word: οἱ γονεῖς αὐτοῦ
  choice: 両親
  rationale: 本人の父母を一組として指す自然な現代日本語。文脈上、所有関係は明白なので「彼の」は省いても意味は失われない。
- source_word: εἶπαν
  choice: 言った
  rationale: 通常の発話を表す動詞であり、「答えた」などの限定的な意味を加えない。
- source_word: Ἡλικίαν ἔχει
  choice: もう大人です
  rationale: 直訳的には「年齢を有している」だが、ここでは自分で答えられる年齢に達していることを表す慣用句。自然な日本語で法的・社会的な自立年齢の含みを伝える。
- source_word: αὐτὸν
  choice: 本人に
  rationale: 問いただすべき相手がその人自身であるという強調を、日本語の「本人」で明確に表す。
- source_word: ἐπερωτήσατε
  choice: 聞いてください
  rationale: 相手に直接問いかけるよう求める命令を、文脈に合う自然で丁寧な日本語にする。
