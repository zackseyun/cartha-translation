  text: ἄλλοι ἔλεγον ὅτι Οὗτός ἐστιν· ἄλλοι ⸂ἔλεγον· Οὐχί, ἀλλὰ⸃ ὅμοιος αὐτῷ ἐστιν. ἐκεῖνος ἔλεγεν ὅτι Ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/009.yaml
  text: Some were saying[a], “This is he.” Others were saying, “No, but he is like him.” He kept saying, “I am he.”
translation:
  language: ja
  text: ある人たちは、「この人だ」と言っていた。ほかの人たちは、「いや、この人ではない。彼に似ているのだ」と言っていた。その人は、「私が本人です[a]」と言い続けていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私はある」。ここでは、自分が人々の話題にしている本人だという意味。
    reason: 語義上の別訳と、文脈上の自己同定の説明。
lexical_decisions:
- source_word: ἄλλοι ... ἄλλοι
  choice: ある人たちは……ほかの人たちは
  rationale: 群衆の中の異なる二つの意見を対比する分配的な表現を、自然な現代日本語で示す。
- source_word: ἔλεγον
  choice: 言い……言っていた
  rationale: 未完了時制が表す、議論の最中に続いていた発言を反映する。日本語の重複を避けつつ、場面の継続性を保つ。
- source_word: Οὗτός ἐστιν
  choice: この人だ
  rationale: 目の前の人物を指して同一人物だと認定する、簡潔で自然な表現。
- source_word: Οὐχί, ἀλλὰ ὅμοιος αὐτῷ ἐστιν
  choice: いや、違う。ただ似ているだけだ
  rationale: 否定と対比を明確にし、同一性ではなく類似性を主張していることを自然な日本語で表す。
- source_word: ἐκεῖνος
  choice: 本人
  rationale: 議論の対象となっている男自身が発言したことを、日本語で明瞭に示す。
- source_word: ἔλεγεν
  choice: 言い続けていた
  rationale: 未完了時制が示唆する反復的な主張、または継続的な発言を表す。
- source_word: Ἐγώ εἰμι
  choice: 私がその者です
  rationale: この文脈では、自分こそ人々が話題にしている人物だという通常の自己同定を表す。同時に、直訳が「私はある」であることを脚注で示す。
theological_decisions:
- issue: ヨハネ福音書における Ἐγώ εἰμι の訳し方
  choice: 私がその者です
  alternative: 私はある／私です
  rationale: 直近の文脈は、癒やされた男が本人かどうかをめぐる議論であり、ここでの発言者もその男である。したがって本文では通常の自己同定として訳すが、語形上の簡潔さとヨハネ文書で生じ得る響きを消し去らないよう、直訳を脚注に残す。
translation_notes:
  register: 明瞭で自然な現代標準日本語。「この人だ」「いや、違う」で会話の直接性を保ちつつ、「私がその者です」で本人の丁寧な自己同定を表した。
