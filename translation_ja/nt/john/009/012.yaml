  text: And they said to him[a], “Where is that man?” He says, “I do not know.”
translation:
  language: ja
  text: 彼らは彼に言った。「あの人はどこにいるのか。」彼は言った。「知りません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: （訳出せず）
  rationale: 前節からの単純な接続だが、日本語の物語では文脈上明らかであり、訳出しないほうが自然である。
- source_word: εἶπαν αὐτῷ
  choice: 彼らはその人に言った
  rationale: 質問内容であっても、原文の λέγω の基本的な表現を保ち、「尋ねた」と意味を限定しすぎないようにした。αὐτῷ は、癒やされた人を指すことが分かる自然な表現とした。
- source_word: Ποῦ ἐστιν ἐκεῖνος
  choice: あの方はどこにいるのか
  rationale: ἐκεῖνος の指示性を「あの方」で表した。文脈上イエスを指し、現代日本語で自然である一方、話者の敬意を過度に強く示さない表現である。
- source_word: λέγει
  choice: 彼は言った
  rationale: ヨハネ文書に多い歴史的現在だが、日本語の物語として自然な過去形にした。出来事の時間関係は変わらない。
- source_word: Οὐκ οἶδα
  choice: 知りません
  rationale: 簡潔な返答を自然な現代日本語で表した。相手に対する通常の丁寧さを備えつつ、原文にない情報は加えていない。
