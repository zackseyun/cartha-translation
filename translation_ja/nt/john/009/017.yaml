id: JHN.9.17
reference: John 9:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγουσιν ⸀οὖν τῷ τυφλῷ πάλιν· ⸂Τί σὺ⸃ λέγεις περὶ αὐτοῦ, ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς; ὁ δὲ εἶπεν ὅτι Προφήτης ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/017.yaml
  text: So they said again to the blind man[a], “What do you say about him, since he opened your eyes?” And he said[c][b], “He is a prophet.”
translation:
  language: ja
  text: そこで彼らは、目の見えなかった人にもう一度言った。「あなたは、あなたの目を開けたその人について、どう言うのか[a]。」彼は言った。「預言者です[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなた自身は、その人についてどう言うのか。あなたの目を開けたのだから」。ギリシア語では「あなた」が明示され、強調されています。また、後半は「あなたの目を開けたので」と理由を表す文にも読めます。
    reason: lexical_alternative
  - marker: b
    text: 「預言者」を、より称号に近い意味で読むことも可能です。しかし文脈上は「一人の預言者」という意味にも取れます。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の議論を受けた物語上・論理上の展開を、現代日本語で自然に示す。
- source_word: τῷ τυφλῷ
  choice: 目の見えなかった人に
  rationale: 文脈上すでに癒やされた人物であり、現時点でも見えないという誤解を避けつつ、人物の同定機能を保つ。
- source_word: πάλιν
  choice: もう一度
  rationale: 尋問の中で改めて問いかける反復を明確に表す。
- source_word: Τί σὺ λέγεις περὶ αὐτοῦ
  choice: あなたは、その人のことを、どう言うのか
  rationale: 明示されたσὺの対照的な強調を「あなたは」で保ち、περὶ αὐτοῦを自然に訳す。
- source_word: ὅτι ἠνέῳξέν σου τοὺς ὀφθαλμούς
  choice: 目を開けてくれた
  rationale: ὅτιを関係的な説明として日本語に統合し、問いの根拠となる事実を自然に示す。「くれた」は治癒が本人に及んだことを表す。
- source_word: Προφήτης ἐστίν
  choice: 預言者です
  rationale: 無冠詞の述語名詞を通常の種類・性質の表明として訳し、特定の称号と断定しない。
theological_decisions:
- issue: Προφήτηςを一般名詞として取るか、称号的に取るか
  choice: 預言者です
  alternative: あの預言者です／「預言者」です
  rationale: 文脈では、この人がイエスについて段階的に認識を深めている場面であり、特定の終末論的称号まで明示する必要はない。ただしギリシア語が称号的な響きを帯びる可能性は脚注に残す。
- issue: ὅτιの機能
  choice: 「目を開けてくれたその人」として問いの根拠を文に統合
  alternative: 「あなたの目を開けたのだから」
  rationale: ὅτιは因果的にも説明的にも理解できる。本文では自然な日本語を優先しつつ、因果的読みを脚注に示して曖昧さを保持する。
translation_notes:
  register: 明瞭で現代的ながら、尋問場面にふさわしい端正な語調とした。差別的・固定的に響き得る「盲人」は避け、癒やし後の状態も踏まえて「目の見えなかった人」とした。
