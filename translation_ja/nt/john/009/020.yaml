  text: ἀπεκρίθησαν ⸀οὖν οἱ γονεῖς αὐτοῦ καὶ εἶπαν· Οἴδαμεν ὅτι οὗτός ἐστιν ὁ υἱὸς ἡμῶν καὶ ὅτι τυφλὸς ἐγεννήθη·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/020.yaml
  text: So his parents answered and said[a], “We know that this is our son and that he was born blind.
translation:
  language: ja
  text: そこで、両親は答えて言った。「これが私たちの息子で、生まれつき目が見えなかったことは知っています。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の尋問を受けた物語上の展開と論理的なつながりを、自然な現代日本語で示す。
- source_word: οἱ γονεῖς αὐτοῦ
  choice: 両親
  rationale: 本人の父母を集合的に指すため、簡潔で自然な訳語とした。文脈上明らかな「彼の」は日本語では省略した。
- source_word: ἀπεκρίθησαν ... καὶ εἶπαν
  choice: 答えて言った
  rationale: 二つの動詞を保ち、ヨハネ文書に見られる応答表現の原文の肌合いを伝える。
- source_word: Οἴδαμεν
  choice: 知っています
  rationale: 両親が確実に認める事実を表す。引用内の丁寧体は、尋問する者たちへの返答として自然である。
- source_word: οὗτός ἐστιν ὁ υἱὸς ἡμῶν
  choice: これが私たちの息子で
  rationale: 目の前の人物を明確に指し示す οὗτος の指示性を「これが」で保った。後続の ὅτι 節と日本語として滑らかにつないだ。
- source_word: τυφλὸς ἐγεννήθη
  choice: 生まれつき目が見えなかった
  rationale: 出生時から視覚がなかったという意味を、現代日本語で明確かつ自然に表す。人格を尊重する言い方として「盲目だった」より「目が見えなかった」を採用した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、ἀπεκρίθησαν ... καὶ εἶπαν は「答えて言った」として原文の重なりを保持した。両親の発言は、尋問の場にふさわしい丁寧体とした。
