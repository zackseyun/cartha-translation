  text: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν· Καὶ τίς ἐστιν, κύριε, ἵνα πιστεύσω εἰς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/036.yaml
  text: He answered and said[a], “And who is he, Lord, that I may believe in him?”
translation:
  language: ja
  text: 彼は答えて言った。「その方はどなたですか、主よ。[a] 私がその方を信じられるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「先生」。ギリシア語のκύριεは、「主よ」のほか、敬意を表す呼びかけにも用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος καὶ εἶπεν
  choice: 彼は答えて言った
  rationale: ギリシア語の定型的な応答表現と二重動詞の構造を保ちつつ、日本語として理解できる形にした。ἐκεῖνοςは文脈上、生まれつき目の見えなかった人を指すため「彼」とした。
- source_word: Καὶ τίς ἐστιν
  choice: その方はどなたですか
  rationale: 文頭のκαίは日本語では独立した「そして」とすると不自然なため、問いが直前の発言を受ける流れを文脈に委ねた。男性単数の指示対象への問いを、敬意を含む自然な日本語で表した。
- source_word: κύριε
  choice: 主よ
  rationale: κύριεの基本的・神学的に重要な訳語として「主よ」を本文に採用した。ただし、この場面では敬称の「先生」にもなり得るため脚注で曖昧さを保存した。
- source_word: ἵνα πιστεύσω εἰς αὐτόν
  choice: 私がその方を信じるためです
  rationale: ἵνα＋接続法の目的の意味を明示し、πιστεύω εἰςを標準的に「信じる」と訳した。αὐτόνは問いの対象を受け、自然な敬意を保つ「その方」とした。
theological_decisions:
- issue: 癒やされた人が次節で信仰を告白する前のκύριεの訳し方
  choice: 主よ
  alternative: 先生
  rationale: κύριεは「主よ」とも、敬意ある呼びかけの「先生」とも解し得る。本文では語の神学的響きを保つ「主よ」を用いながら、話者の認識の度合いを断定しないよう別訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その方」を反復して指示対象を明確にした。脚注記号は曖昧なκύριεの直後に置いた。
