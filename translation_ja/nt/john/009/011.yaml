id: JHN.9.11
reference: John 9:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ἐκεῖνος· ⸂Ὁ ἄνθρωπος ὁ⸃ λεγόμενος Ἰησοῦς πηλὸν ἐποίησεν καὶ ἐπέχρισέν μου τοὺς ὀφθαλμοὺς καὶ εἶπέν μοι ⸀ὅτι Ὕπαγε εἰς ⸀τὸν Σιλωὰμ καὶ νίψαι· ἀπελθὼν ⸀οὖν καὶ νιψάμενος ἀνέβλεψα.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/011.yaml
  text: He answered[a], “The man called Jesus made mud and spread it on my eyes, and he told me, ‘Go to Siloam and wash.’ So I went away and washed[c][b], and I received my sight.”
translation:
  language: ja
  text: 彼は答えた。「イエスという人が泥[a]を作って私の目に塗り[b]、『シロアムへ行って洗いなさい』と言いました。それで、私は行って洗い、見えるようになりました[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「粘土」とも訳せる。ギリシア語πηλόςは、泥または粘土を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「私の目に塗りつけ」。この動詞は「塗る」「塗りつける」という意味で、文脈によっては「油を塗る」とも訳される。
    reason: lexical_alternative
  - marker: c
    text: 「視力を得ました」とも訳せる。ここでは、目が見えなかった人が見えるようになったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη ἐκεῖνος
  choice: 彼は答えた
  rationale: ἐκεῖνοςを文脈上の人物を指す自然な代名詞「彼」で表し、定型的な応答表現を明瞭に訳した。
- source_word: Ὁ ἄνθρωπος ὁ λεγόμενος Ἰησοῦς
  choice: イエスという人
  rationale: 話し手がこの段階でイエスを単に一人の「人」として特定していることを保ちつつ、現代日本語として自然にした。
- source_word: πηλὸν ἐποίησεν
  choice: 泥を作って
  rationale: πηλόςは泥または粘土を指し得るが、直前の文脈で土と唾液から作られたものには「泥」が自然である。
- source_word: ἐπέχρισέν μου τοὺς ὀφθαλμούς
  choice: 私の目に塗り
  rationale: ἐπιχρίωの物理的に塗りつける動作を明確に表し、儀式的含意を帯びやすい「油を注ぐ」は避けた。
- source_word: εἶπέν μοι ὅτι
  choice: と言いました
  rationale: 後続する直接話法の命令を、自然な日本語の引用構文で導入した。
- source_word: Ὕπαγε εἰς τὸν Σιλωὰμ καὶ νίψαι
  choice: シロアムへ行って洗いなさい
  rationale: 地名のみを記す原文に従い「池」を補わず、二つの命令を簡潔に表した。
- source_word: ἀπελθὼν οὖν καὶ νιψάμενος
  choice: それで、私は行って洗い
  rationale: οὖνの結果・展開を「それで」で示し、二つの分詞が表す一連の行動を自然な日本語にした。
- source_word: ἀνέβλεψα
  choice: 見えるようになりました
  rationale: 癒やしの文脈で視力を得ることを表す。生まれつき目が見えなかった人物に「再び見えるようになった」と訳す不自然さを避けた。
theological_decisions:
- issue: 話し手によるイエスの位置づけ
  choice: イエスという人
  alternative: イエスと呼ばれるその人
  rationale: 癒やされた人がこの時点ではイエスを「人」として述べている物語上の段階を保ち、後の告白を先取りする称号を加えなかった。
- issue: ἀνέβλεψαが含み得る回復の意味
  choice: 見えるようになりました
  alternative: 視力を取り戻しました
  rationale: この人物は生まれつき目が見えなかったため、「取り戻す」と断定せず、視力を得たという文脈上の意味を表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、証言としての自然な丁寧体を発話内に採用した。地の文は簡潔で格調を保った。固有名「シロアム」は前節の文脈を踏まえ、原文どおり地名だけを示した。
