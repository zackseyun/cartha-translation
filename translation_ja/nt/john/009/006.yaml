  yaml_path: translation/nt/john/009/006.yaml
  text: After saying these things[a], he spit on the ground and made mud from the saliva, and he spread the mud on his eyes,
translation:
  language: ja
  text: イエスはこう言ってから、地面につばを吐き、そのつばで泥を作り、その泥を彼の目に塗った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「塗った」に当たるギリシャ語は、「塗りつける」のほか、「塗油する（油を塗る）」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰπὼν
  choice: こう言ってから
  rationale: アオリスト分詞が主動詞に先立つ行為を示すため、時間的な順序を自然な現代日本語で表した。ταῦταは直前の発言を受ける「こう」によって簡潔に示した。
- source_word: ἔπτυσεν χαμαί
  choice: 地面につばを吐き
  rationale: χαμαίの具体的な意味「地面に」を保ち、日常的で明瞭な表現とした。
- source_word: ἐποίησεν πηλὸν ἐκ τοῦ πτύσματος
  choice: そのつばで泥を作り
  rationale: πηλόςはこの文脈では唾液と土からできた湿った物質なので「泥」が自然である。ἐκは日本語では材料を表す「で」によって簡潔に表した。
- source_word: ἐπέχρισεν
  choice: 塗った
  rationale: 泥を目に付ける具体的な動作を自然に表す。「塗油した」では儀礼的含意が前面に出すぎるため避け、語の幅は脚注で示した。
- source_word: αὐτοῦ τὸν πηλὸν ἐπὶ τοὺς ὀφθαλμούς
  choice: その泥を彼の目に
  rationale: 定冠詞による既出の泥への照応を「その泥」で示し、αὐτοῦは文脈上、生まれつき目の見えない人を指すため「彼の」とした。複数形ὀφθαλμούςは日本語で自然な総称「目」とした。
theological_decisions:
- issue: ἐπέχρισενにあり得る塗油のニュアンス
  choice: 本文では具体的動作として「塗った」とした。
  alternative: 「油を塗るように塗った」または文語的に「塗油した」
  rationale: この箇所の直接の対象は油ではなく泥であり、本文自体は儀礼的・秘跡的意味を明言しない。「塗った」は物理的動作を正確かつ自然に伝えつつ、象徴的意味を不必要に確定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、叙述の具体性と簡潔さを保った。「つば」は「唾液」より日常的で場面に自然であり、「泥」は「粘土」よりこの文脈に適する。
