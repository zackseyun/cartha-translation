id: JHN.9.10
reference: John 9:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· ⸀Πῶς ἠνεῴχθησάν σου οἱ ὀφθαλμοί;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/010.yaml
  text: So they said to him[a], “How were your eyes opened?”
translation:
  language: ja
  text: そこで、彼らは彼に言った[a]。「あなたの目が、どのようにして見えるようになったのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの目は、どのようにして開かれたのですか」。ギリシア語は受動態です。
    reason: 原文の受動態（ἠνεῴχθησαν）を示しつつ、本文では視力回復を明瞭な現代日本語で表すため。
lexical_decisions:
- source_word: ἔλεγον
  choice: 尋ねた
  rationale: 未完了過去は継続・反復の含みを持ちうるが、ここでは疑問文を導く発話動詞として、現代日本語の物語文に自然な「尋ねた」とした。複数主語は文脈に即して「人々」と明示した。
- source_word: οὖν
  choice: そこで
  rationale: 前節を受けた推論と物語の進行を自然に示す接続語として「そこで」を選んだ。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 発話の間接目的語をそのまま「彼に」とした。
- source_word: Πῶς
  choice: どうして
  rationale: 方法・経緯を問う語。ここでは目が見えるようになった経緯を尋ねる自然な日本語として「どうして」とした。
- source_word: ἠνεῴχθησάν
  choice: 見えるようになった
  rationale: 直訳は「開かれた」だが、日本語で「目が開かれた」は比喩的理解を招きやすい。盲人の視力回復という文脈上の意味を明瞭にしつつ、本人の自発的行為とはしない「見えるようになった」とした。
- source_word: σου οἱ ὀφθαλμοί
  choice: あなたの目は
  rationale: 二人称単数の所有関係と「目」を、自然な日本語の主題構文で表した。
theological_decisions:
- issue: 視力回復の行為者を明示するか
  choice: 行為者を明示せず「見えるようになった」とする
  alternative: 「だれに目を開けてもらったのですか」とする
  rationale: ギリシア語は受動形だが行為者を明示していないため、神またはイエスを訳文で補わず、原文の余白を保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語。会話は丁寧体とし、物語の尊厳を保ちながら一般読者に分かりやすくした。
