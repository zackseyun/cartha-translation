id: JHN.9.18
reference: John 9:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐκ ἐπίστευσαν οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι ⸂ἦν τυφλὸς⸃ καὶ ἀνέβλεψεν, ἕως ὅτου ἐφώνησαν τοὺς γονεῖς αὐτοῦ ⸂τοῦ ἀναβλέψαντος⸃
base_translation:
  language: en
  yaml_path: translation/nt/john/009/018.yaml
  text: So the Jews did not believe concerning him that he had been blind and had received sight[a], until they called the parents of the one who had received sight.
translation:
  language: ja
  text: そこでユダヤ人たちは[a]、彼が盲目であったのに見えるようになったことを、見えるようになった本人の両親を呼び出すまでは信じなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人たち」は、この文脈では「ユダヤ人の指導者たち」を指す可能性がある。また、ヨハネ福音書での用法によっては「ユダヤ地方の人々」とも理解できる。
    reason: 原語οἱ Ἰουδαῖοιの文脈上の指示範囲には複数の可能性があるため。
lexical_decisions:
- source_word: ἐπίστευσαν
  choice: 信じず
  rationale: ὅτι節の内容を事実として受け入れないことを表すため、「信頼しなかった」ではなく「信じなかった」に相当する自然な表現とした。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 語そのものが示す範囲を本文で「指導者たち」などに限定せず、ヨハネ福音書における文脈的な指示範囲の可能性は脚注に残した。
- source_word: περὶ αὐτοῦ ὅτι
  choice: 彼が……ということを
  rationale: 日本語では「彼について、……ということを」より、内容節の主語としてまとめるほうが自然で、意味も保たれる。
- source_word: ἦν τυφλὸς
  choice: 盲人であった
  rationale: 治癒以前の状態を表す。現代日本語で簡潔かつ原文に近い表現とした。
- source_word: ἀνέβλεψεν
  choice: 見えるようになった
  rationale: 生来盲目だった可能性を妨げる「視力を取り戻した」を避け、見る能力を得たことを自然に表した。
- source_word: ἕως ὅτου ἐφώνησαν
  choice: ……両親を呼び出した
  rationale: ἕως ὅτουは両親を呼ぶまで不信が続いたことを示すが、日本語では出来事の連続として簡潔に表現した。「呼び出した」は調査のために来させた文脈に適する。
- source_word: τοῦ ἀναβλέψαντος
  choice: 見えるようになった本人
  rationale: 冠詞付き分詞が指す治癒された当人を明確にし、直訳調の反復を自然な日本語に整えた。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示対象
  choice: 本文では「ユダヤ人たち」とする
  alternative: 「ユダヤ人の指導者たち」または「ユダヤ地方の人々」
  rationale: 原文の語を社会的・地理的に狭く断定せず保持する一方、この場面では調査を行う指導者層を指す可能性があることを脚注で示した。民族全体についての一般化と読まれないよう文脈上の留保を添えた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、叙述の品位を保った。「盲人」は人物を特定する名詞的述語として原文に即している。「呼び出した」により公的な調査場面の含意を自然に示した。
