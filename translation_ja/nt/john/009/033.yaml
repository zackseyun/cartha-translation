  text: εἰ μὴ ἦν οὗτος παρὰ θεοῦ, οὐκ ἠδύνατο ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/033.yaml
  text: If this man were not from God[a], he could do nothing.
translation:
  language: ja
  text: もしこの人が神から来た人でなかったなら、何一つすることはできなかったでしょう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ μὴ
  choice: もし……でなかったなら
  rationale: 未完了過去形と結びついた反実仮想の条件を、現代日本語で明確かつ自然に示す。圧縮した「……でないかぎり」も可能なため脚注に示した。
- source_word: ἦν
  choice: でなかったなら
  rationale: 形は未完了過去だが、この条件文では現実に反する仮定を表すため、日本語では仮定表現によってその含意を示した。
- source_word: οὗτος
  choice: この人
  rationale: 文脈上イエスを指す男性の人物指示であり、敬称を補わず、指示語の率直な語感を保った。
- source_word: παρὰ θεοῦ
  choice: 神からの者
  rationale: 属格を伴う παρά が示す源・由来を保つ。「神に遣わされた者」では使命や派遣を明示しすぎるため避けた。
- source_word: οὐκ ἠδύνατο
  choice: できなかったはずです
  rationale: 能力の否定を表しつつ、反実仮想の帰結であることを自然な日本語の「はず」で明確にした。
- source_word: ποιεῖν
  choice: 行う
  rationale: 文脈ではしるしや業を念頭に置くが、原語自体は広い意味を持つため、「奇跡を行う」と限定せず一般的な動詞を用いた。
- source_word: οὐδέν
  choice: 何一つ
  rationale: 先行する否定とともに全面的な不可能を強調する語勢を、日本語の「何一つ」で保った。
theological_decisions:
- issue: イエスが「神からの者」であることの意味
  choice: 「神からの者」という由来を示す表現にとどめる
  alternative: 「神に遣わされた者」「神の権威を受けた者」
  rationale: 本文は神を源とすることを主張するが、派遣・権威・存在論のいずれか一つに限定してはいない。その幅と神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語。話者の論証の力を保ちながら、過度に古風な表現や教派的な用語を避けた。
