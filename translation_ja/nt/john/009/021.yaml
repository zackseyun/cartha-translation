  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πῶς δὲ νῦν βλέπει οὐκ οἴδαμεν, ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμοὺς ἡμεῖς οὐκ οἴδαμεν· ⸂αὐτὸν ἐρωτήσατε, ἡλικίαν ἔχει⸃, αὐτὸς περὶ ἑαυτοῦ λαλήσει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/021.yaml
  text: But how he now sees[a], we do not know; or who opened his eyes, we do not know. Ask him; he is of age. He will speak for himself.
translation:
  language: ja
  text: しかし、今どうして見えているのか、私たちには分かりません。また、だれがあの子の目を開けたのかも、私たちには分かりません。本人に聞いてください。もう大人です。自分のことは自分で話すでしょう。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分のことは自分で話せます」とも訳せる。ギリシア語の未来形は、ここでは本人が自分で答えられること、また答える立場にあることを実際的に示している可能性がある。
    reason: 未来形λαλήσειが単純な未来を表すか、文脈上の能力・責任を含意するかという翻訳上の選択肢を示すため。
lexical_decisions:
- source_word: πῶς δὲ νῦν βλέπει
  choice: しかし、今どうして見えるようになったのか
  rationale: πῶςを「どうして」、δέを穏やかな対比の「しかし」、νῦνを「今」とした。日本語では、以前は見えなかったという文脈を踏まえて「見えるようになった」とすることで、現在見えているに至った経緯を尋ねる表現として自然になる。
- source_word: οὐκ οἴδαμεν
  choice: 私たちには分かりません
  rationale: 現在の認識を表すοἶδαを明瞭な現代日本語で訳した。原文で二度繰り返されるため、訳文でも省略せず反復した。
- source_word: ἢ τίς ἤνοιξεν αὐτοῦ τοὺς ὀφθαλμούς
  choice: また、誰があの子の目を開けたのかも
  rationale: ἤが導く別の問いを日本語の流れに合わせて「また」とし、ἀνοίγωの物語上の反復表現を「目を開けた」と保った。「あの子」は両親が自分たちの息子について語っている文脈を自然に表す。
- source_word: αὐτὸν ἐρωτήσατε
  choice: 本人に聞いてください
  rationale: アオリスト命令形複数を、質問者たちへの直接的で自然な依頼・指示として訳した。αὐτόνは文脈上「本人」とすることで、息子自身に尋ねるよう促す対比を明確にした。
- source_word: ἡλικίαν ἔχει
  choice: もう大人です
  rationale: ここでのἡλικίαは背丈ではなく、自分で答えられる年齢・成熟を指す。「成人に達しています」より日常的で明瞭な「もう大人です」とした。
- source_word: αὐτὸς περὶ ἑαυτοῦ λαλήσει
  choice: 自分のことは自分で話すでしょう
  rationale: 強意のαὐτόςと再帰表現περὶ ἑαυτοῦを「自分のことは自分で」と反映し、未来形λαλήσειは「話すでしょう」として形態上の未来性を残した。文脈上は本人が答える能力・責任を表す可能性があるため、脚注で示した。
theological_decisions:
- issue: ἡλικίαν ἔχειの文脈上の意味
  choice: 自分で答えられる年齢に達していることを「もう大人です」と表す
  alternative: 一般的に成熟している、または背丈があると解する
  rationale: 両親が尋問する者たちを息子本人へ向けている文脈では、独立して証言できる年齢を指すのが最も自然である。法的身分を細かく規定する語は原文にないため、「法的成人」とまでは限定しない。
- issue: αὐτὸς περὶ ἑαυτοῦ λαλήσειの力点
  choice: 未来形を保ちつつ、本人が自分について話すことを表す
  alternative: 「自分で答えられます」と能力・責任を明示する
  rationale: 尋問に近い場面なので実質的には本人の応答能力や責任を示し得るが、原文は未来形であり、能力を表す助動詞は明示されていない。その緊張を本文と脚注で保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある会話文とした。両親の距離を置いた反復と、本人に回答を委ねる調子を保っている。「あの子」は成人した息子を指す親の発話として自然であり、「もう大人です」との矛盾を避けられる用法である。
