  text: ὁ δὲ ἔφη· Πιστεύω, κύριε· καὶ προσεκύνησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/038.yaml
  text: And he said[a], “I believe[b], Lord,” and he worshiped him.
translation:
  language: ja
  text: 彼は言った。「主よ[a]、信じます。」そしてイエスを礼拝した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「先生」などの敬称とも訳せる。ギリシア語のκύριεは丁寧な呼びかけにもなり得るが、ここでは信仰告白と礼拝へ至る文脈から「主よ」とした。
    reason: alternative_reading
  - marker: b
    text: または「イエスの前にひれ伏した」「イエスに敬意を表した」。ギリシア語の動詞は、ひれ伏すことや敬意を表すことも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: すると彼は
  rationale: 定冠詞を代名詞的に取り、癒やされた人を「彼」とした。δέは強い対立ではなく、応答の展開を自然に示す「すると」で表した。
- source_word: ἔφη
  choice: 言った
  rationale: φημίのアオリストであり、物語中の通常の発話導入として簡潔に訳した。
- source_word: Πιστεύω
  choice: 信じます
  rationale: イエスの自己啓示への直接の応答であり、ヨハネ文書におけるπιστεύωの語彙的連関も保つ。
- source_word: κύριε
  choice: 主よ
  rationale: 敬称としての意味もあり得るが、信仰告白と礼拝へ至る文脈を踏まえ、キリスト論的な重みを保つ「主よ」を本文に採用した。
- source_word: προσεκύνησεν
  choice: 礼拝した
  rationale: この動詞はひれ伏す行為や敬意を表すことも指し得るが、イエスへの信仰告白に続く応答として、文脈上の力を最もよく伝える「礼拝した」とした。
- source_word: αὐτῷ
  choice: イエスを
  rationale: ギリシア語では代名詞だが、日本語で「彼を」とすると癒やされた人を指すようにも読めるため、指示対象を明確にして「イエスを」とした。
theological_decisions:
- issue: κύριεを一般的な敬称として訳すか、より重みのある呼称として訳すか
  choice: 主よ
  alternative: 先生／あなた様
  rationale: κύριεは丁寧な呼びかけにもなり得るため曖昧さは注で示す。一方、この箇所ではイエスの自己提示を受けた信仰告白と礼拝が頂点を成すため、本文では「主よ」が適切である。
- issue: προσεκύνησενを明示的に「礼拝した」と訳すか、身体動作または敬意の表現として訳すか
  choice: 礼拝した
  alternative: その方の前にひれ伏した／敬意を表した
  rationale: 語自体にはひれ伏すことや敬意を表す意味の幅があるが、対象がイエスであり、信仰告白の直後であることから「礼拝した」を選んだ。語義上可能な別訳は注に残した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、短い信仰告白の厳粛さを保った。発話とその後の行為を二文に分け、原文の流れを自然な日本語で再現した。
