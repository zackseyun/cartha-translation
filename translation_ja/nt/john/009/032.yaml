base_translation:
  language: en
  yaml_path: translation/nt/john/009/032.yaml
  text: From of old it has never been heard that anyone opened the eyes of one born blind[a].
translation:
  language: ja
  text: 昔から[a]、生まれつき目の見えない人の目を誰かが開けたということは、聞かれたことがありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「世が始まって以来」。
    reason: ἐκ τοῦ αἰῶνοςは、記憶される歴史の全期間にわたり前例がないことを表す慣用句である。「世が始まって以来」はその時間的範囲をより明示する伝統的な訳である。
lexical_decisions:
- source_word: ἐκ τοῦ αἰῶνος
  choice: 昔から
  rationale: 直訳的な「その時代から」ではなく、記憶される歴史の全期間を指す慣用表現として自然に表した。「永遠の昔から」という形而上学的な意味は持ち込まない。
- source_word: οὐκ ἠκούσθη
  choice: 聞かれたことがありません
  rationale: 前例として聞いたことがないという非人称的な受動表現を保ちつつ、現代日本語として自然にした。
- source_word: ὅτι
  choice: など
  rationale: 聞かれたことの内容を導くὅτιを、日本語では引用内容を受ける「など」で自然に表現した。
- source_word: ἠνέῳξέν
  choice: 開けた
  rationale: 「目を開ける」という原文の表現を保持し、「治した」などの解釈的な言い換えを避けた。
- source_word: τις
  choice: 誰かが
  rationale: 否定的な一般命題の中の不定代名詞を自然に表した。
- source_word: ὀφθαλμοὺς
  choice: 目を
  rationale: 日本語の慣用表現「人の目を開ける」に合わせた。
- source_word: τυφλοῦ γεγεννημένου
  choice: 生まれつき目の見えない人の
  rationale: 完了分詞が示す出生時から続く状態を「生まれつき」で表し、人物を不必要に男性と限定せず、現代日本語で明瞭な表現とした。
theological_decisions:
- issue: ἐκ τοῦ αἰῶνος の時間的範囲
  choice: 昔から
  alternative: 世が始まって以来
  rationale: 人間の経験上、これまで前例がなかったという発言の修辞的な力を保ち、永遠についての形而上学的主張にはしない。「世が始まって以来」も可能な慣用的理解として脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語。「目の見えない」は自然で配慮ある表現とし、全体は証言中の強い驚きを保つ dignified な口調にした。
