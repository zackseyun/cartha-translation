  text: ἡμεῖς οἴδαμεν ὅτι Μωϋσεῖ λελάληκεν ὁ θεός, τοῦτον δὲ οὐκ οἴδαμεν πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/029.yaml
  text: We know that God has spoken to Moses[a], but as for this man, we do not know where he is from.
translation:
  language: ja
  text: 私たちは、神がモーセに語ったことを知っている。しかし、この人がどこから来たのか[a]は、私たちは知らない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どこから来るのか」。ヨハネ福音書では、イエスがどこから来たのかという問いは、通常の出身地だけでなく、より深い由来をも含みうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: 私たちは
  rationale: 明示された代名詞による強調と、後半の「この者」との対比を自然な日本語で示す。
- source_word: οἴδαμεν
  choice: 知っている
  rationale: 確かな知識を主張する語であり、二度の用例を同じ表現で訳して反復を保つ。
- source_word: Μωϋσεῖ λελάληκεν ὁ θεός
  choice: 神がモーセに語られた
  rationale: 与格を話しかける相手として訳し、完了形が示す、過去の発言が確立した事実として現在も意味を持つという含みを「語られたことを知っている」で自然に表す。
- source_word: τοῦτον δὲ
  choice: だが、この者が
  rationale: δέの対比と、τοῦτονが持つ距離を置いた指示の響きを保つ。「この人」よりも話者の冷淡な調子が伝わる。
- source_word: πόθεν ἐστίν
  choice: どこから来たのか
  rationale: 出所・起源を問う表現として自然であり、地理的出身にも、より深い由来にも読める幅を残す。
theological_decisions:
- issue: πόθεν ἐστίνが指すイエスの由来
  choice: 「どこから来たのか」と訳し、意味を限定しない。
  alternative: 「どこの出身なのか」「その起源が何か」
  rationale: ヨハネ福音書ではイエスの由来への問いが日常的意味と神学的意味を重ね持ちうるため、地理的出身または神からの権威のどちらかに決めず、物語上の皮肉と緊張を保つ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、断定的な対比にふさわしい端正な文体とした。「この者」によって話者がイエスと距離を置く調子を保ち、神への敬意は「語られた」で自然に示した。脚注記号は、その説明対象である「どこから来たのか」の直後に置いた。
