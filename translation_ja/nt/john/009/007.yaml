id: JHN.9.7
reference: John 9:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτῷ· Ὕπαγε νίψαι εἰς τὴν κολυμβήθραν τοῦ Σιλωάμ (ὃ ἑρμηνεύεται Ἀπεσταλμένος). ἀπῆλθεν οὖν καὶ ἐνίψατο, καὶ ἦλθεν βλέπων.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/007.yaml
  text: And he said to him[a], “Go, wash in the pool of Siloam” (which is translated “Sent”). So he went and washed, and came back seeing.
translation:
  language: ja
  text: そして彼に言われた。「行って、シロアムの池で洗いなさい」（シロアムは「遣わされた者」と訳される）。そこで彼は行って洗い、見えるようになって帰って来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὕπαγε
  choice: 行って
  rationale: 移動を命じる素直な命令形。後続する「洗いなさい」と自然につながる現代日本語とした。
- source_word: νίψαι / ἐνίψατο
  choice: 洗いなさい／洗い
  rationale: νίπτωは通常、全身浴ではなく身体の一部を洗うことを表し得る。対象を補わず、原文と同じく簡潔にした。
- source_word: εἰς τὴν κολυμβήθραν
  choice: 池で
  rationale: κολυμβήθραは水をたたえた池・貯水池。εἰςの方向性を逐語的に「池の中へ」とせず、洗う場所を示す自然な日本語にした。
- source_word: Σιλωάμ
  choice: シロアム
  rationale: 新約聖書の地名として定着した日本語音写を用いた。
- source_word: ὃ ἑρμηνεύεται Ἀπεσταλμένος
  choice: シロアムは「遣わされた者」と訳される
  rationale: ἑρμηνεύεταιの明示的な翻訳説明を保った。Ἀπεσταλμένοςは男性単数の受動完了分詞なので、状態を帯びた人物呼称として「遣わされた者」とした。
- source_word: οὖν
  choice: そこで
  rationale: 命令を受けた結果として次の行動に移る物語上のつながりを、自然な日本語で示す。
- source_word: ἀπῆλθεν
  choice: 行って
  rationale: その場を離れて池へ向かったことを、簡潔な連用形で表した。
- source_word: ἦλθεν βλέπων
  choice: 見えるようになって帰って来た
  rationale: ἦλθεν自体は「来た」だが、直前に出かけた人物について述べるため、日本語では「帰って来た」が自然。現在分詞βλέπωνが示す、見える状態で戻ったという結果を「見えるようになって」で明確にした。
theological_decisions:
- issue: シロアムに付された説明を、ヨハネ福音書の象徴性まで踏み込まずに訳すこと
  choice: 原文の括弧的説明を本文に残し、「『遣わされた者』と訳される」とする。
  alternative: 父から遣わされたイエスとの象徴的関連を訳文中で明示する。
  rationale: 原文は地名の意味を説明しているが、その神学的含意をここで明文化してはいない。説明自体は保持しつつ、解釈を訳文に付加しない。
translation_notes:
  register: 明快な現代標準日本語を用い、命令と行動の簡潔な流れを保持した。「遣わされた者」はやや改まった表現だが、原文の受動分詞とヨハネ的な語の響きを損なわない、一般読者にも理解可能な表現である。
