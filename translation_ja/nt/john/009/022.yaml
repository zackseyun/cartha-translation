id: JHN.9.22
reference: John 9:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ ὅτι ἐφοβοῦντο τοὺς Ἰουδαίους, ἤδη γὰρ συνετέθειντο οἱ Ἰουδαῖοι ἵνα ἐάν τις αὐτὸν ὁμολογήσῃ χριστόν, ἀποσυνάγωγος γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/022.yaml
  text: His parents said these things because they were afraid of the Jews[a], for the Jews had already agreed that if anyone confessed him as the Messiah[b], he would be put out of the synagogue.
translation:
  language: ja
  text: 両親がこう言ったのは、ユダヤ人たち[a]を恐れていたからである。すでにユダヤ人たちは、だれかがイエスをメシア[b]であると認めるなら、その人は会堂から追放されることになる、と取り決めていたのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「ユダヤ人たち」。ここでは、ユダヤ人一般ではなく、会堂から追放する権限を持つユダヤ人当局者たちを指す可能性が高い。
    reason: cultural_note
  - marker: b
    text: 別訳「キリスト」または「そのキリスト」。
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα εἶπαν οἱ γονεῖς αὐτοῦ
  choice: 両親がこう言った
  rationale: ταῦταの複数性は、日本語では直前の発言全体を自然に受ける「こう」で表現した。γονεῖςは「両親」とした。
- source_word: ἐφοβοῦντο
  choice: 恐れていた
  rationale: 未完了過去が示す継続的な恐れを自然な日本語で表した。
- source_word: τοὺς Ἰουδαίους / οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文の表現を本文に残しつつ、ここでは会堂から追放する権限を持つユダヤ人当局者を指す可能性が高いことを脚注で明示した。
- source_word: συνετέθειντο
  choice: 決めていた
  rationale: すでに成立していた合意・申し合わせを表す過去完了の意味を、明快な日本語で表現した。
- source_word: αὐτὸν ὁμολογήσῃ χριστόν
  choice: イエスをメシアだと認める
  rationale: ὁμολογέωの公に認めるという意味と、χριστόςが称号として用いられている点を自然に表した。文脈上のαὐτόνの指示対象を明確にするため「イエス」とした。
- source_word: ἀποσυνάγωγος γένηται
  choice: 会堂から追放する
  rationale: 共同体の会堂から排除されることを示す語を、現代日本語で直接的に表した。
theological_decisions:
- issue: χριστόςの訳語
  choice: メシア
  alternative: キリスト／そのキリスト
  rationale: ここでは固有名のような用法ではなく、イエスを待望された油注がれた者と認める称号として機能しているため。別訳を脚注に示した。
- issue: οἱ Ἰουδαῖοιの指示対象
  choice: 本文は「ユダヤ人たち」とし、文脈上の範囲を脚注で説明
  alternative: ユダヤ人の指導者たち／ユダヤ当局者たち
  rationale: 原文の語義上の幅とヨハネ福音書における緊張を保ちながら、ユダヤ人一般を無差別に指すとの誤解を避けるため。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。二つの理由節は文を分けて読みやすくし、原文の説明関係は「からである」「のである」で保った。「会堂」は宗教共同体としてのσυναγωγήを示す聖書用語として保持した。
