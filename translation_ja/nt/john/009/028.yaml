  text: ⸀ἐλοιδόρησαν αὐτὸν καὶ εἶπον· Σὺ ⸂μαθητὴς εἶ⸃ ἐκείνου, ἡμεῖς δὲ τοῦ Μωϋσέως ἐσμὲν μαθηταί·
base_translation:
  language: en
  yaml_path: translation/nt/john/009/028.yaml
  text: They reviled him and said[a], “You are that man's disciple, but we are disciples of Moses.”
translation:
  language: ja
  text: 彼らはその人をののしって言った。「あなたはあの者[a]の弟子だが、私たちはモーセの弟子だ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あの者」は「彼」とも訳せる。ギリシア語は遠称の指示代名詞を用いており、ここでは突き放した、軽蔑的な響きを帯びている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλοιδόρησαν
  choice: ののしって
  rationale: 相手に侮辱的な言葉を浴びせる強い意味を保ち、敵意ある発言へ自然につなげる表現とした。
- source_word: αὐτὸν
  choice: その人を
  rationale: 目を癒やされた人を指す目的語。日本語で指示対象が明確になるよう「その人」とした。
- source_word: καὶ εἶπον
  choice: 言った
  rationale: 前の分詞的な表現「ののしって」と結び、ギリシア語の叙述の流れを自然な日本語で示した。
- source_word: Σὺ
  choice: おまえは
  rationale: 文頭の明示的な代名詞による強調と、相手を見下す場面の語調を表す。「あなた」より敵意が伝わるが、過度に粗暴な語は避けた。
- source_word: μαθητὴς / μαθηταί
  choice: 弟子
  rationale: 単なる学習者ではなく、師への帰属や従属を含む語であり、二つの用例を同じ語で訳して対比を保った。
- source_word: ἐκείνου
  choice: あの者
  rationale: 遠称による距離の置き方を保ち、この敵対的文脈にある軽蔑的な響きを示す一方、「あいつ」ほどの俗悪さは加えない。
- source_word: ἡμεῖς δὲ
  choice: だが、私たちは
  rationale: δέの対比と、明示された一人称複数代名詞の強調をともに表した。
- source_word: τοῦ Μωϋσέως
  choice: モーセの
  rationale: μαθηταίとの関係を自然な日本語の属格で示し、「モーセの弟子」とした。
- source_word: ἐσμὲν μαθηταί
  choice: 弟子だ
  rationale: 前半と同じ「弟子」を用い、イエスへの帰属とモーセへの帰属の修辞的対比を明確に保った。
theological_decisions:
- issue: イエスを指すἐκείνουの語調
  choice: 「あの者」として、話者が距離を置く敵対的な語調を保つ。
  alternative: 中立的に「彼」または文脈に即して「その人」と訳す。
  rationale: 指示代名詞自体は必ずしも軽蔑を意味しないが、この箇所では「ののしった」という直前の叙述と、イエスの弟子とモーセの弟子との対立が、突き放した響きを支持する。脚注で中立的な可能性も示した。
- issue: μαθητήςの訳語と対比
  choice: 両方を「弟子」と訳す。
  alternative: 「従う者」または「門弟」と訳す。
  rationale: この語は単なる生徒以上に師への帰属を含む。「弟子」で統一することにより、誰に属するのかをめぐる本文の緊張を解消せずに保てる。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、論争場面の厳しい語調を保持した。「おまえ」はΣὺの強調と話者の侮蔑を自然に表し、「あの者」は距離を置くἐκείνουの含みを残す。文末は簡潔な常体とし、両陣営の対比を際立たせた。
