base_translation:
  language: en
  yaml_path: translation/nt/john/009/008.yaml
  text: So the neighbors[a], and those who had seen him before as a beggar, were saying, “Is this not the man who used to sit and beg?”
translation:
  language: ja
  text: そこで、近所の人々や、以前、彼が物乞いだった時に彼を見かけていた人々は、「これは、座って物乞いをしていた人ではないか」と言っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 前の出来事を受けた物語の展開を、自然な現代日本語で示す。
- source_word: γείτονες
  choice: 近所の人々
  rationale: 彼の近くに住む人々を指す名詞の意味を明確に表す。
- source_word: θεωροῦντες αὐτὸν τὸ πρότερον
  choice: 彼が以前……見かけていた人々
  rationale: θεωρέωの継続的・反復的な目撃の含みと、τὸ πρότερονの過去への言及を自然に表現する。
- source_word: ὅτι προσαίτης ἦν
  choice: 物乞いであった頃に
  rationale: ὅτιをここでは彼が以前どのような者として知られていたかを示すものと捉え、因果関係を過度に強めず文脈に即して訳す。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の、周囲で続いていた発言の様子を保つ。
- source_word: Οὐχ οὗτός ἐστιν
  choice: これは……人ではないか
  rationale: 肯定の答えを予期する否定疑問の形を保つ。
- source_word: ὁ καθήμενος καὶ προσαιτῶν
  choice: 座って物乞いをしていた人
  rationale: 二つの実詞的分詞が、その人を以前の習慣的な行動によって特定していることを、簡潔で自然な日本語にする。
