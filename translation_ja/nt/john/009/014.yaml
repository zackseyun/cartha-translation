id: JHN.9.14
reference: John 9:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦν δὲ σάββατον ⸂ἐν ᾗ ἡμέρᾳ⸃ τὸν πηλὸν ἐποίησεν ὁ Ἰησοῦς καὶ ἀνέῳξεν αὐτοῦ τοὺς ὀφθαλμούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/014.yaml
  text: It was a Sabbath on the day when Jesus made the mud and opened his eyes.
translation:
  language: ja
  text: イエスが泥[a]を作り、その人の目を開けた[b]日は、安息日であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「粘土」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「その人の目を開けた」。癒やしを具体的に表す言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: σάββατον
  choice: 安息日
  rationale: ユダヤ暦上の安息日を指す定着した日本語であり、冠詞の有無を区別しない日本語として自然に表現した。
- source_word: ἐν ᾗ ἡμέρᾳ
  choice: …日は
  rationale: 直訳的な「その日において」ではなく、前置詞を含む関係表現を日本語の主題構文に組み替え、出来事の日と安息日が同一であることを明確にした。
- source_word: πηλόν
  choice: 泥
  rationale: 唾と土を混ぜたものという文脈に合う、一般読者に自然な語。「粘土」も語義上可能なため脚注に示した。
- source_word: ἐποίησεν
  choice: 作り
  rationale: ποιέωの基本的な意味を簡潔に保ち、泥をこしらえた動作を表した。
- source_word: ἀνέῳξεν
  choice: 開けた
  rationale: 「開く」という具体的な表現を保持し、解釈的な「視力を回復させた」に置き換えなかった。
- source_word: αὐτοῦ τοὺς ὀφθαλμούς
  choice: その人の目
  rationale: 日本語で指示対象を明確にしつつ、抽象的な「視力」ではなく身体的な「目」を保った。
- source_word: δὲ
  choice: （独立した接続語なし）
  rationale: 弱い叙述上の移行は日本語の文脈と主題構文で十分に表せるため、「さて」「しかし」などの不要に強い接続語を加えなかった。
theological_decisions:
- issue: 安息日とイエスの癒やしの関係
  choice: その出来事が安息日に起きたという時間的事実だけを明示する。
  alternative: 安息日規定への違反や、その後の論争を説明的に訳文へ加える。
  rationale: 本文は後続の論争を準備する事実を述べるにとどまるため、律法上・神学上の評価を先取りしない。
- issue: 「目を開けた」の具体性
  choice: 「その人の目を開けた」と訳す。
  alternative: 「その人の視力を回復させた」と解釈的に訳す。
  rationale: ヨハネ本文の具体的表現を保持し、身体的な癒やしと比喩的含意の可能性を狭めない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、文末は聖書本文にふさわしい簡潔で落ち着いた「であった」とした。ギリシア語の語順をそのまま写さず、時間関係が自然に伝わる日本語の主題構文に整えた。
