  text: Καὶ παράγων εἶδεν ἄνθρωπον τυφλὸν ἐκ γενετῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/001.yaml
  text: And as he was passing by[a], he saw a man blind from birth.
translation:
  language: ja
  text: さて、イエスは通り過ぎる途中で、生まれつき目の見えない人を見た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: さて
  rationale: 単純な物語の接続を示す。日本語では直訳的な「そして」よりも、場面の進行を自然に受ける「さて」が明瞭である。
- source_word: παράγων
  choice: 通りがかりに
  rationale: 現在分詞の同時的・背景的な動作を、主動詞「見た」に自然につなげる。
- source_word: εἶδεν
  choice: 見た
  rationale: ὁράωのアオリストを基本義のまま訳し、「気づいた」などの解釈的含意を加えない。
- source_word: ἄνθρωπον
  choice: 一人の人
  rationale: この箇所では特定の人物を指すが、当該節のἄνθρωπος自体は「人」を意味するため、文脈外の性別情報を語に持ち込まず自然に表現する。
- source_word: τυφλὸν
  choice: 目の見えない
  rationale: 現代日本語で人を中心に述べる自然で尊重ある表現とし、視覚障害の状態を明確に伝える。
- source_word: ἐκ γενετῆς
  choice: 生まれつき
  rationale: 出生時からその状態にあったことを簡潔かつ慣用的に表す。
theological_decisions:
- issue: ἄνθρωπονの性別表現
  choice: 一人の人
  alternative: 一人の男
  rationale: ἄνθρωποςはこの形だけでは男性を明示せず、本節では人物の性別より人であることに焦点がある。後続文脈で男性と分かるとしても、本節の語義を不必要に限定しない。
translation_notes:
  register: 明快な現代標準日本語。物語として自然でありながら簡略化しすぎず、現在分詞の背景動作とアオリスト主動詞の関係を「通りがかりに……見た」で保持した。
