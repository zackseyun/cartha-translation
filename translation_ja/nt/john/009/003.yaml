id: JHN.9.3
reference: John 9:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὔτε οὗτος ἥμαρτεν οὔτε οἱ γονεῖς αὐτοῦ, ἀλλ’ ἵνα φανερωθῇ τὰ ἔργα τοῦ θεοῦ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/003.yaml
  text: Jesus answered[a], “Neither this man sinned, nor his parents[c][b], but so that the works of God might be revealed in him.”
translation:
  language: ja
  text: イエスは答えた。「この人が罪を犯したのでも、その両親が罪を犯したのでもない。しかし、神のわざがこの人において現されるためである。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この人において」は、「この人を通して」とも理解できる。ギリシア語は直訳すれば「彼において」であり、神のわざが現される場・領域、またはその手段を表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えられた
  rationale: 対話における標準的な叙述として「答えた」に相当し、日本語の福音書本文にふさわしい敬意を自然に示す。
- source_word: Οὔτε ... οὔτε
  choice: …のでも、…のでもない
  rationale: 二つの可能性をともに明確に否定する相関表現を、自然な現代日本語で再現する。
- source_word: οὗτος
  choice: この人
  rationale: 文脈上、生まれつき目の見えない男性を指し、指示性を保ちながら自然に表す。
- source_word: ἥμαρτεν
  choice: 罪を犯した
  rationale: ἁμαρτάνωのアオリストを直接かつ自然に訳し、特定の問いに対する否定を示す。
- source_word: γονεῖς
  choice: 両親
  rationale: 父母を一語で指す自然で正確な訳語。
- source_word: ἀλλ’ ἵνα
  choice: …ない。…ためである
  rationale: 日本語では対照を文の切れ目で表し、ἵναの目的的な力を「ため」で保持する。原文に明示されない「このことが起こった」を本文には補わない。
- source_word: φανερωθῇ
  choice: 現される
  rationale: 受動態と、隠れていたものが目に見える形で示される意味を保つ。
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: 神のわざ
  rationale: ヨハネ文書の神学的語彙である「わざ」を保ちつつ、現代日本語でも理解できる表現とする。
- source_word: ἐν αὐτῷ
  choice: この人に
  rationale: ἐνの基本的な表現を保ち、この人を場・対象として神のわざが現れるという曖昧さを維持する。「この人を通して」と手段に限定しない。
theological_decisions:
- issue: この人の盲目と罪との関係について、イエスの否定をどこまで一般化するか
  choice: この人とその両親について、弟子たちが提示した二つの説明を否定する形に限定する。
  alternative: 苦しみは個人または親の罪とは決して関係しない、という普遍的命題に言い換える。
  rationale: 本文はこの具体的な事例への問いに答えており、あらゆる苦しみについての一般論までは明言していない。
- issue: ἵναが目的を表すか結果を表すか
  choice: 「神のわざがこの人に現されるため」と目的を表す訳にする。
  alternative: 「その結果、神のわざがこの人に現された」と結果だけを表す。
  rationale: ἵνα＋接続法の最も直接的な読みを保持する一方、原文以上に神が盲目を引き起こしたと説明する語句は加えない。
- issue: ἐν αὐτῷを場所・領域と取るか手段と取るか
  choice: 「この人に」と訳す。
  alternative: 「この人を通して」と訳す。
  rationale: 原文の前置詞が持つ幅を保ち、神のわざがこの人のうちに、彼の身に、または彼を介して示される可能性を一つに限定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書本文としての品位を保った。「わざ」はヨハネ福音書の語彙を意識して漢字の「業」より読みやすい表記とした。原文に動詞節が省略されている後半は、日本語で自然に成立する名詞述語「ためである」とし、「このことが起こった」などの説明を本文に補わなかった。
