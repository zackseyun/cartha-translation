  text: ὅταν ἐν τῷ κόσμῳ ὦ, φῶς εἰμι τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/005.yaml
  text: While I am in the world, I am the light of the world.
translation:
  language: ja
  text: わたしが世にいる間、わたしは世の光です。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν ἐν τῷ κόσμῳ ὦ
  choice: わたしが世にいる間
  rationale: ὅταν＋接続法は一般に「〜するときは／〜する間」を表し得るが、ここではイエスが世にいる期間を指す文脈なので、自然な現代日本語の「〜いる間」とした。
- source_word: φῶς εἰμι τοῦ κόσμου
  choice: わたしは世の光です
  rationale: 属格 τοῦ κόσμου を日本語の定着した自然な表現「世の光」で保ち、比喩を説明的に言い換えなかった。
theological_decisions:
- issue: イエスが「世の光」であることと、その地上での働きの期間との関係
  choice: わたしが世にいる間、わたしは世の光です
  alternative: わたしが世にいる時はいつでも、わたしは世の光です
  rationale: ὅταν の一般性を過度に強調せず、直前の「昼の間に」（9:4）との時間的なつながりを自然に示す。一方で、光であることがこの期間だけに限定されるとの解釈を訳文に付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスの自己言及には本文の調子に合う「わたし」を用い、断定は丁寧体の「です」とした。
