  text: ἀπεκρίθη αὐτοῖς· Εἶπον ὑμῖν ἤδη καὶ οὐκ ἠκούσατε· τί πάλιν θέλετε ἀκούειν; μὴ καὶ ὑμεῖς θέλετε αὐτοῦ μαθηταὶ γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/027.yaml
  text: He answered them[a], “I already told you, and you did not listen. Why do you want to hear it again? You do not also want to become his disciples[b], do you?”
translation:
  language: ja
  text: 彼は彼らに答えた。「すでにあなたがたに話しましたが、あなたがたは耳を傾けませんでした。[a] なぜまた聞きたいのですか。まさか、あなたがたもその人の弟子になりたいのですか。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「聞かなかった」。ここで「聞く」に当たるギリシア語は、単に音を聞くことだけでなく、耳を傾けて受け止めることも意味しうる。
    reason: lexical_alternative
  - marker: b
    text: 原文の疑問文は、否定の答えを予想する言い方。「あなたがたもその人の弟子になりたいわけではないでしょう」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: 彼は彼らに答えた
  rationale: 物語の応答を表す標準的な表現として、原文の構文を保ちつつ自然な日本語にした。
- source_word: Εἶπον ὑμῖν ἤδη
  choice: もうあなたがたに話したのに
  rationale: ἤδηの「すでに」の意味を「もう」で表し、εἶπονの発言行為を文脈に即して自然に訳した。
- source_word: οὐκ ἠκούσατε
  choice: 耳を貸さなかったではありませんか
  rationale: ἀκούωは「聞く」と「聞き入れる」の双方を表し得る。ここでは情報が音として届かなかったのではなく、相手が取り合わなかったことを責める文脈なので、「耳を貸さなかった」とした。
- source_word: τί πάλιν θέλετε ἀκούειν;
  choice: なぜ、もう一度聞きたいのですか
  rationale: τίはここでは、相手の執拗な再質問に対するいら立ちを込めた理由の問いとして理解できる。目的語は直前の発言内容から明らかなため、日本語では明示しなかった。
- source_word: μὴ καὶ ὑμεῖς
  choice: まさか、あなたがたも……のですか
  rationale: 否定の答えを予想するμή疑問文の修辞的な響きを、現代日本語の「まさか……のですか」で表した。καίは「も」とした。
- source_word: αὐτοῦ μαθηταὶ γενέσθαι
  choice: あの方の弟子になりたい
  rationale: γενέσθαιの状態への移行を「なる」で保った。αὐτοῦは、話者から距離のある第三者を指す文脈に自然な「あの方」とし、侮蔑を不必要に付加しない表現とした。
theological_decisions:
- issue: 最後の問いの修辞的な力
  choice: 「まさか、あなたがたもあの方の弟子になりたいのですか」
  alternative: 「あなたがたもあの方の弟子になりたいのですか」
  rationale: μήは通常、否定の答えを予想する疑問を導く。単なる中立的な質問にせず、癒やされた人の皮肉を含む応答の調子を保った。ただし、実際に否定の答えが返ると本文中で断定することは避けた。
- issue: ἀκούωの意味範囲
  choice: 主本文では「耳を貸さなかった」
  alternative: 「聞かなかった」
  rationale: 文脈上は、聴覚的に聞こえなかったというより、すでに語られたことを受け入れず取り合わなかったという非難が中心である。ただし原語の基本的な「聞く」という意味も脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、癒やされた人の率直さと皮肉を保った。「耳を貸さなかったではありませんか」は責める調子を自然に示し、「まさか」によってμή疑問文の否定予想を伝える。敬体の会話文により品位を保ちつつ、過度に古風な表現は避けた。
