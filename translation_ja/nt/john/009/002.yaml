id: JHN.9.2
reference: John 9:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν οἱ μαθηταὶ αὐτοῦ λέγοντες· Ῥαββί, τίς ἥμαρτεν, οὗτος ἢ οἱ γονεῖς αὐτοῦ, ἵνα τυφλὸς γεννηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/john/009/002.yaml
  text: And his disciples asked him[a], saying, “Rabbi, who sinned, this man or his parents, that he should be born blind?”
translation:
  language: ja
  text: 弟子たちはイエスに尋ねた。「ラビ、この人が生まれつき目が見えないのは、だれが罪を犯したからですか。この人ですか、それとも両親ですか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「この人が目の見えない者として生まれるために」。ギリシア語の節は、弟子たちが前提としている目的または結果の関係を表し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: 尋ねた
  rationale: 文脈ではイエスに率直な問いを向ける通常の表現であり、現代日本語として自然である。
- source_word: μαθηταὶ
  choice: 弟子たち
  rationale: 福音書における教師に従う者という関係を簡潔かつ慣用的に表す。
- source_word: λέγοντες
  choice: 「……」
  rationale: ギリシア語の分詞は、日本語では直接話法を導く引用として表すほうが自然であり、発話の内容を損なわない。
- source_word: Ῥαββί
  choice: ラビ
  rationale: ユダヤ的な呼びかけの歴史的な響きを保ちつつ、現代日本語でも理解される形を採った。
- source_word: τίς
  choice: だれが
  rationale: 罪を犯した主体を問う疑問詞として直接的で自然である。
- source_word: ἥμαρτεν
  choice: 罪を犯した
  rationale: ἁμαρτάνωの意味を明確な現代日本語で表す。
- source_word: οὗτος
  choice: この人
  rationale: 文脈上、目の見えない男性を指すことを自然かつ明瞭に示す。
- source_word: γονεῖς
  choice: 両親
  rationale: 父母を一語で表す標準的な日本語である。
- source_word: ἵνα
  choice: ために
  rationale: 弟子たちが想定する罪と先天的な目の見えない状態との目的・結果的な結び付きを問いの中で保つ。ただし、その因果関係を語り手が承認しているとは示さない。
- source_word: τυφλὸς
  choice: 目が見えない
  rationale: 状態を明確に表し、現代日本語で自然かつ配慮ある表現とした。
- source_word: γεννηθῇ
  choice: 生まれつき
  rationale: 『目が見えない』と結び付けることで、出生時からの状態であることを自然な日本語で表す。
theological_decisions:
- issue: 弟子たちの問いにおけるἵναの因果・目的／結果の含み
  choice: 本文では「罪を犯したために……生まれつき目が見えない」とし、弟子たちが前提とする結び付きを報告する形にした。
  alternative: 「その結果、この人が目の見えない者として生まれた」または「この人が目の見えない者として生まれるため」
  rationale: この節は弟子たちの問いを記録するもので、本人または両親の罪が先天的な失明を引き起こしたという教理を語り手が承認するものではない。ギリシア語の緊張を残し、脚注でἵνα節の目的・結果の幅を示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。問いの語順は日本語として自然になるよう再構成し、二者択一を後置して明確にした。「ラビ」は歴史的背景を保つため音写した。
