  text: ⸀εἶπεν αὐτῷ ὁ Ἰησοῦς· Καὶ ἑώρακας αὐτὸν καὶ ὁ λαλῶν μετὰ σοῦ ἐκεῖνός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/037.yaml
  text: Jesus said to him[a], “You have seen him, and the one speaking with you is he.”
translation:
  language: ja
  text: イエスは彼に言われた。「あなたはもうその方を見ています。そして、あなたと話している者が、その方です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: 彼に言われた
  rationale: 単純な物語上の発言として自然に表し、与格の相手も明示した。「言われた」は現代日本語で理解できる、聖書本文にふさわしい丁重な叙述表現である。
- source_word: Καὶ ἑώρακας αὐτόν
  choice: あなたはもうその方を見ています
  rationale: 完了形が示す、すでに成立した行為と現在への関わりを「もう」と「見ています」で表した。καίによる後続文との連結は「そして」で保った。
- source_word: ὁ λαλῶν
  choice: 話している者
  rationale: 名詞的に用いられた現在分詞を、継続中の発話を示す自然な日本語で表した。
- source_word: μετὰ σοῦ
  choice: あなたと
  rationale: μετά＋属格の基本的な意味「～と共に」を保ち、対話している場面にも自然な「あなたと話している」とした。
- source_word: ἐκεῖνός ἐστιν
  choice: その方です
  rationale: 直前の指示対象を簡潔に同定する表現とし、文脈上の称号を本文に補わなかった。「方」は人物を指す自然で丁重な語である。
theological_decisions:
- issue: 直前に問われた人物とイエスとの自己同定
  choice: 「今あなたと話している者が、その方です」
  alternative: 「あなたに話しているのが、その方です」または称号を補って「人の子です」
  rationale: ギリシア語はイエスを直前の指示対象と直接同定するが、その称号自体はこの節で繰り返していない。したがって、自己開示の力を保ちつつ称号を説明的に補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には簡潔で品位ある調子を保った。原文の完了形、二つの陳述の連結、自己同定の簡潔さを優先した。
