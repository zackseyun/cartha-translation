base_translation:
  language: en
  yaml_path: translation/nt/john/009/026.yaml
  text: So they said to him, “What did he do to you? How did he open your eyes?”
translation:
  language: ja
  text: そこで彼らはその人に言った。「あの人はあなたに何をしたのか。どうやってあなたの目を開けたのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπον
  choice: 言った
  rationale: λέγωのアオリストで、尋問する者たちの直接話法を導入する。文脈上は質問だが、原語の一般的な「言う」を保った。
- source_word: οὖν
  choice: そこで
  rationale: 前の発言を受けた談話の進展と帰結を自然な現代日本語で示す。「それで」も可能だが、やや口語的である。
- source_word: αὐτῷ
  choice: その人に
  rationale: 生まれつき目の見えなかった人を指す与格。日本語では指示対象を明確にするため「その人に」とした。
- source_word: Τί ἐποίησέν σοι
  choice: あなたに何をしたのか
  rationale: ποιέωと与格の組み合わせが持つ「あなたに何をしたか」を保ち、恩恵を強く示唆する「何をしてくれたのか」は避けた。
- source_word: πῶς
  choice: どうやって
  rationale: 方法・手段を問う語として、尋問の直接的な響きを自然に表す。
- source_word: ἤνοιξέν σου τοὺς ὀφθαλμούς
  choice: あなたの目を開けたのか
  rationale: 身体部位を表す定冠詞と属格代名詞を自然な日本語の所有表現にし、能動態の「開けた」を維持した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用いながら、尋問の反復的で直接的な調子を保った。「あの人」は直前まで問題となっているイエスを指し、話者側の距離感も自然に表す。
