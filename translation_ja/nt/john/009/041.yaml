  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ τυφλοὶ ἦτε, οὐκ ἂν εἴχετε ἁμαρτίαν· νῦν δὲ λέγετε ὅτι Βλέπομεν· ⸀ἡ ἁμαρτία ὑμῶν μένει.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/041.yaml
  text: Jesus said to them[a], “If you were blind, you would not have sin. But now you say, ‘We see,’ so your sin remains.”
translation:
  language: ja
  text: イエスは彼らに言われた。「もしあなたがたが目の見えない者であったなら、あなたがたに罪[a]はなかったでしょう。しかし今、あなたがたは『私たちは見える』と言っています。あなたがたの罪は残っています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「罪の責任」。ギリシア語は「罪」だが、ここでは罪に対する責任という意味も含みうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τυφλοὶ
  choice: 目の見えない者
  rationale: 文字どおりの「盲目」を表す語であり、この章では霊的認識の比喩としても働く。「霊的に」という説明を本文に加えず、身体的な視覚との意図的な重なりを保った。
- source_word: οὐκ ἂν εἴχετε ἁμαρτίαν
  choice: あなたがたに罪はなかったでしょう
  rationale: 反実仮想の結果を自然な現代日本語で表した。「罪を持つ」という不自然な直訳を避けつつ、ἁμαρτίαを「罪」として保持した。
- source_word: νῦν δὲ
  choice: しかし今
  rationale: 仮定された状態と現状との明確な対照を、簡潔で自然な接続表現によって示した。
- source_word: λέγετε ὅτι Βλέπομεν
  choice: あなたがたは『見える』と言っています
  rationale: 二人称複数から一人称複数の直接話法への移行を保ち、発言に含まれる皮肉を解釈的に説明せず再現した。
- source_word: ἡ ἁμαρτία ὑμῶν μένει
  choice: あなたがたの罪は残っています
  rationale: ヨハネ文書で重要なμένωの継続的な意味を「残っています」で表し、現在も続く状態を示した。
theological_decisions:
- issue: 「目の見えない者」が霊的盲目を指すこと、および「罪」が責任・有罪性を含みうることを明示するか
  choice: 本文では「目の見えない者」と「罪」という直接的な表現を保つ。
  alternative: 「霊的に目が見えない者」「罪の責任はなかった」などと明示する。
  rationale: 文脈には霊的認識と責任の含意があるが、イエスの言葉は第9章全体を貫く身体的視覚と霊的視覚の重なりを意図的に保っている。本文で意味を限定せず、ἁμαρτίαが持つ「罪」と「責任」の緊張も残した。
- issue: 最後の二節を明示的な因果関係で結ぶか
  choice: 「と言っています。あなたがたの罪は残っています」と並置する。
  alternative: 「と言っているので、あなたがたの罪は残っています」と訳す。
  rationale: 文脈上の因果的つながりは明らかだが、ギリシア語には因果接続詞がないため、本文では原文の簡潔な並置を保ち、関係を過度に明文化しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には「言われた」を用いて品位を保った。「盲目」という名詞的表現よりも一般読者に自然な「目の見えない者」を選び、比喩性は文脈に委ねた。
