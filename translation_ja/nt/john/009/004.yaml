review_pass:
  verdict: approve
  source_fidelity: SBLGNT本文のἡμᾶς δεῖを「わたしたちは…しなければならない」と適切に反映している。「わたしを遣わした方のわざを行う」はτὰ ἔργα τοῦ πέμψαντός μεを過不足なく伝え、「昼であるうちに」と「だれも働くことのできない夜が来る」は時間的対比と、夜における活動不能を保持している。ὅτε節を「夜」にかかる連体修飾節へ組み替えたことも日本語として自然で、意味を変更しない。
  naturalness: 明瞭な現代標準日本語として自然であり、聖書本文にふさわしい端正さも保たれている。「方」「遣わした」「わざ」は不必要に古風ではなく、ヨハネ福音書の語調と関連性をよく表す。句読点と脚注位置も読みやすい。
  terminology: 「わざを行う」はἐργάζεσθαι τὰ ἔργαの同根反復を不自然に直訳せず、ヨハネ的な「わざ」の語彙を維持する適切な訳語である。絶対用法の後半を「働く」とした区別も妥当である。「昼／夜」は説明的に狭めず保持され、神学的含意を一義化していない。
