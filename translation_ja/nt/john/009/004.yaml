id: JHN.9.4
reference: John 9:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἡμᾶς δεῖ ἐργάζεσθαι τὰ ἔργα τοῦ πέμψαντός με ἕως ἡμέρα ἐστίν· ἔρχεται νὺξ ὅτε οὐδεὶς δύναται ἐργάζεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/004.yaml
  text: We must do the works of the one who sent me while it is day; night is coming[a], when no one can work.
translation:
  language: ja
  text: わたしたちは、昼であるうちに、わたしを遣わした方のわざを行わなければならない。だれも働くことのできない夜が来る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「わたしは、わたしを遣わした方のわざを行わなければならない」とある。
    reason: textual_variant
lexical_decisions:
- source_word: ἡμᾶς
  choice: わたしたちは
  rationale: SBLGNTの一人称複数対格をδεῖの意味上の主語として訳し、「わたしたちは……しなければならない」とした。
- source_word: δεῖ
  choice: しなければならない
  rationale: 必要・義務を表す語の強さを、明瞭で自然な現代日本語で示す。
- source_word: ἐργάζεσθαι τὰ ἔργα
  choice: わざを行う
  rationale: 同根語の反復を日本語で不自然に再現せず、目的語を伴う行為として自然に表現した。「わざ」はヨハネ文書における神から託された働きとのつながりを保つ。
- source_word: τοῦ πέμψαντός με
  choice: わたしを遣わした方の
  rationale: 冠詞付き分詞を人格的な実体表現として訳し、主体を本文で「神」と明示しすぎずに敬意を示した。
- source_word: ἕως ἡμέρα ἐστίν
  choice: 昼であるうちに
  rationale: 来る夜との対比を保ち、行動できる期間を示す自然な時間表現とした。
- source_word: ἔρχεται νὺξ
  choice: 夜が来る
  rationale: 現在形の切迫した未来的ニュアンスを、簡潔で自然な日本語で表した。
- source_word: ὅτε οὐδεὶς δύναται ἐργάζεσθαι
  choice: だれも働くことのできない
  rationale: ὅτε節を日本語では「夜」を修飾する形に組み替え、能力の否定を明瞭に表した。
theological_decisions:
- issue: 節冒頭の本文異読（ἡμᾶς「わたしたち」／ἐμέ「わたし」）
  choice: わたしたちは、……わざを行わなければならない
  alternative: わたしは、……わざを行わなければならない
  rationale: 指定されたSBLGNT本文のἡμᾶςに従う。一方、単数形の異読は広く伝承され、意味上も重要であるため脚注に残した。
- issue: 「昼」と「夜」の比喩的意味
  choice: 昼／夜という原文の比喩をそのまま保持
  alternative: 活動できる時／活動できない時と説明的に訳す
  rationale: 文脈上の含意を一つに限定せず、原文が持つ時間的・比喩的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「方」「わざ」「遣わす」によりヨハネ福音書の文体と神学的連関を維持し、過度な解釈語は加えていない。脚注記号[a]は、異読が関係する文全体の後に置いた。
