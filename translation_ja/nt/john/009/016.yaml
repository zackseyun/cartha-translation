id: JHN.9.16
reference: John 9:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν ἐκ τῶν Φαρισαίων τινές· ⸂Οὐκ ἔστιν οὗτος παρὰ θεοῦ ὁ ἄνθρωπος⸃, ὅτι τὸ σάββατον οὐ τηρεῖ. ⸀ἄλλοι ἔλεγον· Πῶς δύναται ἄνθρωπος ἁμαρτωλὸς τοιαῦτα σημεῖα ποιεῖν; καὶ σχίσμα ἦν ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/009/016.yaml
  text: So some of the Pharisees were saying[a], “This man is not from God, because he does not keep the Sabbath.” But others were saying[b], “How can a sinful man do such signs?” And there was a division among them.
translation:
  language: ja
  text: そこで、ファリサイ派のある人たちはこう言っていた。「この人は神から来たのではない。安息日を守っていないからだ。」しかし、ほかの人たちは、「罪のある人[a]が、どうしてこのようなしるし[b]を行うことができるだろうか」と言っていた。こうして、彼らの間に分裂があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪人」とも訳せる。ギリシア語では「罪のある」という形容詞が「人」を修飾している。
    reason: lexical_alternative
  - marker: b
    text: ヨハネ福音書では、イエスの業が何かを指し示し、その意味を明らかにすることを強調して、しばしば「しるし」と呼ぶ。「奇跡的なしるし」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον ... τινές
  choice: ある人たちは……言っていた
  rationale: 未完了時制が示す場面内での継続的な発言を「言っていた」で表し、τινέςを自然な日本語で「ある人たち」とした。
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた談話の展開と帰結を、現代日本語で自然に示す。
- source_word: ἐκ τῶν Φαρισαίων
  choice: ファリサイ派の
  rationale: ファリサイ派に属する人々の中の一部であることを簡潔に表す。
- source_word: οὗτος ... ὁ ἄνθρωπος
  choice: この人
  rationale: 指示語の力を保ちつつ、「この男」ほど不必要に粗野にならない自然な表現とした。
- source_word: παρὰ θεοῦ
  choice: 神から来た
  rationale: 神を起源・出所とする意味を表す。「遣わされた」は原文に明示されていないため加えない。
- source_word: τηρεῖ τὸ σάββατον
  choice: 安息日を守っていない
  rationale: 宗教的規定を遵守する意味のτηρέωを、日本語の定着した表現「安息日を守る」で訳した。
- source_word: ἁμαρτωλὸς ἄνθρωπος
  choice: 罪のある人
  rationale: 形容詞ἁμαρτωλόςがἄνθρωποςを修飾する構造を反映しつつ、明瞭で自然な日本語とした。
- source_word: τοιαῦτα σημεῖα
  choice: このようなしるし
  rationale: ヨハネ福音書で啓示的な意味を帯びるσημεῖονを「奇跡」に平板化せず、「しるし」として保持した。
- source_word: σχίσμα ἦν ἐν αὐτοῖς
  choice: 彼らの間に分裂があった
  rationale: 意見の相違によって集団が割れた状態を、原文に近く簡潔に表した。
theological_decisions:
- issue: ヨハネ福音書におけるσημεῖαの訳語
  choice: しるし
  alternative: 奇跡／奇跡的なしるし
  rationale: 行為の超自然性だけでなく、それが指し示す啓示的意味を保持し、説明語を本文へ加えないため。
- issue: παρὰ θεοῦが示すイエスと神との関係
  choice: 神から来た
  alternative: 神から遣わされた
  rationale: 神に由来することを示しながら、「遣わされた」という使命の概念を原文以上に明示せず、議論の神学的緊張を保つため。
- issue: ἁμαρτωλόςによる人物評価
  choice: 罪のある人
  alternative: 罪人
  rationale: 話者たちが提示する評価として訳し、イエスについて語り手が断定しているかのように解消しないため。
translation_notes:
  register: 明瞭な現代標準語を用い、会話は自然さを保ちながらも軽すぎない調子とした。「ファリサイ派」「安息日」「しるし」は聖書文脈で定着した語として保持した。
