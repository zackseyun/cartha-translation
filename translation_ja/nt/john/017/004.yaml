  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: ja
  text: わたしは、あなたがわたしに行うように与えてくださった働きを成し遂げることによって、地上であなたの栄光を現しました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがわたしに行うように与えてくださった働きを成し遂げて、わたしは地上であなたの栄光を現しました。」
    reason: τελειώσας を手段ではなく、時または付帯状況を示す分詞として訳す可能性を示す。
lexical_decisions:
- source_word: ἐδόξασα
  choice: 栄光を現しました
  rationale: ヨハネ文書での神学的な重みを保ちつつ、単に「敬いました」とせず、御父の栄光を明らかにしたという意味を自然な現代日本語で表す。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: ἐπί＋属格の場所的意味を、明瞭で自然な日本語として表す。
- source_word: τελειώσας
  choice: 成し遂げることによって
  rationale: アオリスト分詞を主動詞の手段として理解し、イエスが御父の栄光を現した方法を明示する。時間的・付帯的理解も可能なため脚注に残す。
- source_word: τὸ ἔργον
  choice: 働き
  rationale: イエスに託された使命全体を指す文脈に適し、「仕事」よりも荘重で、現代日本語として自然である。
- source_word: δέδωκάς μοι
  choice: わたしに……与えてくださった
  rationale: 完了形の継続的関連性を文脈で保ち、御父への直接の語りかけにふさわしい敬語を用いる。
- source_word: ἵνα ποιήσω
  choice: 行うよう
  rationale: 与えられた働きの目的・意図を、硬すぎない現代日本語で示す。
- source_word: ἐγώ σε
  choice: わたしは……あなたの
  rationale: 明示された主語と目的語を訳出するが、強意を過度に補って「このわたしが」とはしない。
theological_decisions:
- issue: イエスが御父の栄光を現したことと分詞 τελειώσας の関係
  choice: 手段として訳し、託された働きを成し遂げることによって御父の栄光を現したとする。
  alternative: 「託された働きを成し遂げて」とし、時または付帯状況として読む。
  rationale: 分詞は主動詞に対して手段を示す理解が自然だが、ギリシア語の分詞構文には一定の幅があるため、別の構文理解を脚注で保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祈りの文脈にふさわしい品位を保った。「あなた」への直接話法では「与えてくださった」として自然な敬意を示した。
