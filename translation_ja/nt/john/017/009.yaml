id: JHN.17.9
reference: John 17:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: ja
  text: わたしは彼らのために[a]願っています[b]。世のために願っているのではなく、あなたがわたしに与えてくださった者たちのために願っています。彼らはあなたのものだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らについて」。ここで用いられたギリシア語の前置詞は、文脈上「～のために」と「～について」のどちらの意味にも取れます。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「求めています」または「願い求めています」。ここでは父に向けた祈りの中で願うことを表しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: 願っています
  rationale: 基本義は「尋ねる、求める、願う」。ここでは父に向けた祈りの文脈なので「願っています」とし、明示的な宗教用語に限定しすぎず、現在の発話としての継続性も表した。
- source_word: περὶ αὐτῶν
  choice: 彼らのために
  rationale: περί＋属格は「彼らについて」とも取れるが、父への執り成しの文脈では「彼らのために」が自然である。語義上の幅は脚注に残した。
- source_word: κόσμου
  choice: 世
  rationale: ヨハネ文書で神に対置されることもある κόσμος を、意味を「全人類」や「不信仰な体制」に限定せず、簡潔に「世」とした。
- source_word: ὧν δέδωκάς μοι
  choice: あなたがわたしに与えてくださった者たち
  rationale: 関係代名詞の指す人々を「者たち」と明示した。δέδωκας の完了が示す現在まで続く結果は、日本語では文脈上自然な「与えてくださった」で表した。
- source_word: ὅτι σοί εἰσιν
  choice: 彼らはあなたのものだからです
  rationale: ὅτι を理由を示す「だから」とし、σοί εἰσιν の所有・帰属の力を「あなたのもの」と直接的に表した。
- source_word: ἐγώ
  choice: わたしは
  rationale: 明示された主語の強調と、後続する否定・対比の構造を保った。
theological_decisions:
- issue: ἐρωτῶを明示的な祈祷用語で訳すか
  choice: 「祈っています」ではなく「願っています」
  alternative: 祈っています／求めています
  rationale: 発話全体は祈りだが、ἐρωτάω 自体の基本義は「求める、願う」である。文脈を反映しつつ、原語以上に宗教的な意味へ限定しない表現を選んだ。
- issue: περί＋属格を「について」とするか「ために」とするか
  choice: 執り成しの文脈を踏まえて「ために」
  alternative: 彼らについて
  rationale: 父に願う対象としては「ために」が自然だが、原語には「について」の意味もあるため脚注で明示し、曖昧さを隠さない。
- issue: 「世」の範囲
  choice: 解釈的に限定せず「世」とする
  alternative: 全人類／神に背く世
  rationale: ヨハネにおける κόσμος の意味には文脈ごとの幅があるため、この節だけで特定の教理的範囲に狭めない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祈りとしての品位を保つ文体。「くださった」は父への敬意と日本語としての自然さを示す。対比を明確にするため「～のために願っています」を反復し、原文で後半に省略されている動詞を日本語では補った。
