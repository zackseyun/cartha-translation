id: JHN.17.6
reference: John 17:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: ja
  text: わたしは、あなたが世からわたしに与えてくださった人々に、あなたの名[a]を明らかにしました[b]。彼らはあなたのものであり、あなたは彼らをわたしに与えてくださいました。そして彼らは、あなたのことばを守ってきました[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの名」とは、単なる呼び名ではなく、神がご自身を明らかにされたあり方やご性質を指します。
    reason: cultural_note
  - marker: b
    text: 別訳「現しました」「知らせました」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「あなたのことばに従ってきました」。原文はより直訳的には「あなたのことばを守ってきました」です。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: 明らかにしました
  rationale: φανερόωの「見えるようにする、知らせる、現す」という開示の意味を自然な現代日本語で表す。「示しました」より明確であり、「啓示しました」ほど専門的でない。
- source_word: τὸ ὄνομα
  choice: あなたの名
  rationale: ヨハネ文書で「名」は神の自己開示された存在・人格・性質を含意するが、原文の具体的表現を保持し、説明的言い換えで意味を狭めない。
- source_word: τοῖς ἀνθρώποις
  choice: 人々に
  rationale: ἄνθρωποιは文脈上イエスの弟子たちを指すが、語そのものは一般に「人々」を意味する。日本語では「人々」が自然で、不要な性別の限定を加えない。
- source_word: οὓς ἔδωκάς μοι ἐκ τοῦ κόσμου
  choice: あなたが世から選び出してわたしに与えてくださった
  rationale: ἐκの起点・分離の含意を、日本語として不自然な「世から」にとどめず「世から選び出して」で明示する。ただし「選ぶ」に関する特定の教理体系は付加しない。敬語は子が父に語る祈りの関係と日本語の自然さを反映する。
- source_word: σοὶ ἦσαν
  choice: 彼らはあなたのものでした
  rationale: 簡潔な所有表現をそのまま保持する。
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: あなたは彼らをわたしに与えてくださいました
  rationale: κἀμοίの「そして／また、わたしに」を自然な語順で表し、父から子への授与を保持する。
- source_word: τὸν λόγον σου
  choice: あなたのみことば
  rationale: λόγοςの「ことば、告知、教え」の幅を保ちつつ、神のことばを指す文脈にふさわしい、現代日本語聖書で理解しやすい表現とする。
- source_word: τετήρηκαν
  choice: 守っています
  rationale: 完了形が示す、守った行為と現在に続く結果を日本語の継続表現で表す。「従いました」より、τηρέωの「保つ、守る」という語義を直接保持する。
theological_decisions:
- issue: 「あなたの名」の意味
  choice: 本文では「あなたの名」を保持する
  alternative: 「あなたがどのような方か」「あなたのご性質」と解釈的に訳す
  rationale: この語は父の啓示された存在・人格・性質を含むが、原文の象徴性と神学的広がりを保持し、一つの説明に限定しない。
- issue: τοῖς ἀνθρώποιςの指示対象と性別
  choice: 「人々」
  alternative: 「男たち」「弟子たち」
  rationale: 直接の指示対象は弟子たちだが、ἄνθρωποι自体は性別を必ずしも限定しない。「人々」は語義に忠実で自然であり、「弟子たち」は原文にない説明を加える。
- issue: 父が人々を子に与えることの教理的含意
  choice: 授与の事実をそのまま訳し、その仕組みを説明しない
  alternative: 特定の予定論、選び、または予知に基づく体系として訳文に織り込む
  rationale: 節は父が彼らを子に与えたと述べるが、その全機序を説明してはいないため、後代の教派的体系で緊張を解消しない。
- issue: ἐκ τοῦ κόσμουの表現
  choice: 「世から選び出して」
  alternative: 「世から」「世の中から」
  rationale: ἐκが示す集団内からの取り出しを自然な日本語にする。「選び出す」は文脈上の分離を示すが、救済論上の選びの方式までは規定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。祈りとしての敬意を「くださった／くださいました」で自然に示しつつ、過度に古風な語法は避けた。「みことば」は一般読者にも通じる聖書的語彙として採用した。
