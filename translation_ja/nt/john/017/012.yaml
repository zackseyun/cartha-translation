id: JHN.17.12
reference: John 17:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: ja
  text: わたしが彼らとともにいた間、わたしはあなたがわたしに与えてくださった御名によって彼らを保っており、守りました。そして、滅びの子[a]のほかは、彼らのうちだれ一人滅びませんでした[b]。それは、聖書のことばが実現するためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滅びの子」はヘブライ語的な言い回し。「滅びに属する者」または「滅びる定めの者」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼らのうちだれ一人失われませんでした」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: わたしが彼らとともにいた間
  rationale: 未完了過去の継続的な時間関係を、自然な現代日本語で表した。
- source_word: ἐγὼ ἐτήρουν αὐτοὺς
  choice: わたしは…彼らを守り
  rationale: 明示された主語の強調を保ちつつ、未完了過去の継続性は「いた間」という構文全体で示した。τηρέωはここでは保護・保持の意味を含む「守る」とした。
- source_word: ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι
  choice: あなたがわたしに与えてくださった御名によって
  rationale: 中性単数の関係代名詞ᾧを「御名」に結びつける原文の文法に従った。ἐνはこの文脈で手段・権威を表す自然な日本語として「によって」とした。
- source_word: καὶ ἐφύλαξα
  choice: 彼らを見守りました
  rationale: 先行するτηρέωとの語の違いを示すため、φυλάσσωを「見守る」と訳した。保護するという含意も文脈上保たれる。
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: 彼らのうちだれ一人滅びませんでした
  rationale: ἀπόλλυμιの厳粛な意味を「滅びる」で保った。「失われませんでした」というヨハネ的な別訳は脚注に示した。
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: 滅びの子
  rationale: セム語的な属格表現を簡潔に保持し、その意味を教理的に限定しすぎないようにした。
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: それは、聖書のことばが実現するためでした
  rationale: ἵναの目的・結果の緊張を「ため」で保ち、γραφήは特定の聖書箇所を指しうるため「聖書のことば」とした。πληρόωは現代日本語として自然な「実現する」で表した。
theological_decisions:
- issue: ᾧ δέδωκάς μοιの先行詞
  choice: 「あなたがわたしに与えてくださった御名」とし、関係節を「御名」にかける。
  alternative: 「あなたがわたしに与えてくださった者たち」として弟子たちにかける。
  rationale: SBLGNT本文のᾧは中性単数であり、中性単数のὀνόματιと自然に一致する。より馴染み深い別のヨハネ的表現へ調和させない。
- issue: ὁ υἱὸς τῆς ἀπωλείαςの意味
  choice: 「滅びの子」という形式を保持する。
  alternative: 「滅びる定めの者」または「滅びに属する者」と意味を展開する。
  rationale: 人物が滅びによって特徴づけられる、または滅びへ向かうというセム語的表現だが、予定や責任に関する教理を本文で断定しない。
- issue: ἵναによる聖書成就の関係
  choice: 「実現するため」と訳し、目的・結果の含みを保持する。
  alternative: 「その結果、聖書のことばが実現しました」と結果だけに限定する。
  rationale: 原文のἵνα構文が持つ目的／結果の神学的緊張を解消しない。
translation_notes:
  register: イエスの祈りにふさわしい、明瞭で品位ある現代標準日本語。「御名」は聖書的な重みを保ちながら一般読者にも理解可能な表記とした。二つの保護動詞は「守る／見守る」と訳し分けた。すべての脚注記号を対応箇所に置いた。
