  - severity: low
    issue: 第一文の語順と「者たちも」の配置がやや読みにくい。
    rationale: 原文の願いの内容を「人々が……いることを」と明示すると、誰が共にいることを願われているのかが直ちに分かる。「彼らも」によって κἀκεῖνοι の付加的なニュアンスも保持できる。
