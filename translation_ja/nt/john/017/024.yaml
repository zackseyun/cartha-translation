id: JHN.17.24
reference: John 17:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: ja
  text: 父よ、あなたがわたしに与えてくださった人々[a]が、わたしのいる所に、彼らもわたしと共にいることを、わたしは願います。それは、あなたがわたしに与えてくださったわたしの栄光を、彼らが見るためです。あなたが、世界が造られる前からわたしを愛してくださったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では字義的に「あなたがわたしに与えてくださったもの」。ここでは集合的に、父が子に与えた人々を指しており、後では「彼ら」と複数形で受けられています。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: 父よ
  rationale: 神への直接の呼びかけ。原文にない所有表現を加えず、現代日本語として自然で荘重な呼格とした。
- source_word: ὃ δέδωκάς μοι
  choice: あなたがわたしに与えてくださった者たち
  rationale: ὃ は文法上は中性単数だが、後続の複数形 κἀκεῖνοι と ὦσιν が示すとおり、御父から御子に与えられた人々を集合的に指す。本文では指示対象を明瞭にし、字義的な形は脚注に残した。
- source_word: δέδωκάς
  choice: 与えてくださった
  rationale: 完了形の、完了した行為とその継続的な結果を文脈上保ちつつ、受益を表す自然な日本語とした。
- source_word: θέλω
  choice: わたしは願います
  rationale: 意志・願望の力を保ちながら、祈りの文脈にふさわしい表現とした。「望みます」や「欲します」より自然で、「意志します」のような教理的含意を加えない。
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: わたしがいる所で
  rationale: 明示された ἐγώ の焦点を「わたしが」で自然に示し、場所を表す ὅπου を簡潔に訳した。
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: 彼らも、わたしと共にいるように
  rationale: κἀκεῖνοι の付加的な「彼らも」を保持し、接続法を願いの内容として自然に表した。
- source_word: θεωρῶσιν
  choice: 見る
  rationale: θεωρέω の意識的に見る意味を、古風な「仰ぎ見る」などに狭めず、明瞭な現代語で表した。
- source_word: τὴν δόξαν τὴν ἐμὴν ἣν δέδωκάς μοι
  choice: あなたがわたしに与えてくださったわたしの栄光
  rationale: 関係節が限定する「栄光」と、その栄光が御子のものであることを明確に保持した。
- source_word: ὅτι
  choice: からです
  rationale: ここでは前述の栄光を与えたこと、またはその栄光を見ることの根拠を示す因果表現として、原文の係り方の余地を不必要に限定しない形にした。
- source_word: πρὸ καταβολῆς κόσμου
  choice: 世界の基が据えられる前から
  rationale: καταβολή の基礎を据える比喩を保持し、創造以前という時間的意味を明瞭にした。
theological_decisions:
- issue: 「世界の基が据えられる前」からの御父の愛が示す御子の先在
  choice: 創造以前を指す時間表現をそのまま保持した。
  alternative: 比喩化して、単に神の永遠の計画の中で愛されたという意味に弱める。
  rationale: 原文は御父が世界創造以前から「わたし」を愛したと直接述べるため、説明的な弱化も教理的な増補も行わない。
- issue: 祈りにおける θέλω の強さ
  choice: 「わたしは願います」
  alternative: 「わたしは意志します」「わたしは望みます」
  rationale: 御子の明確な意志を弱めすぎず、同時に命令や一方的な宣言へと解消せず、祈りとしての緊張を保つ。
- issue: ὅτι 節の論理的な係り先
  choice: 独立した理由節として続け、直前の「栄光を与えてくださった」に自然に結びつきながら、文全体との関係も排除しない訳にした。
  alternative: 「愛してくださったので、その栄光を与えてくださった」と明示して係り先を一つに固定する。
  rationale: ギリシア語では因果関係が明らかでも、その適用範囲には解釈上の余地があるため、訳文で過度に限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祈りにふさわしい荘重さを保った。「くださった」は御父から御子への授与を日本語として自然に表す敬語であり、原文にない教理的説明は加えていない。
