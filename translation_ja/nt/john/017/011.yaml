id: JHN.17.11
reference: John 17:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: ja
  text: わたしはもう世にはいません。けれども、彼らは世にいます。そして、わたしはあなたのもとへ行きます。聖なる父よ、あなたがわたしに与えてくださったその名のうちに、彼らを守ってください[a][b]。わたしたちが一つであるように、彼らも一つとなるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの名によって彼らを守ってください」、または「あなたの名のうちに彼らを保ってください」とも訳せる。ギリシア語の表現は、領域、手段、権威のいずれをも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 写本には、「あなたがわたしに与えてくださった者たちを、あなたの名によって守ってください」と理解される読みもある。本文はSBLGNTに従い、「あなたがわたしに与えてくださった」の先行詞を「名」とした。
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: もう～いません
  rationale: 話者の現在の立場から、ある状態がもはや続かないことを示す自然な現代日本語。
- source_word: κόσμος
  choice: 世
  rationale: ここでは弟子たちがとどまり、イエスが去ろうとしている地上の人間世界を指す。ヨハネ文書で定着した簡潔な訳語を用いた。
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: そして、わたしはあなたのもとへ行きます
  rationale: 進行中または間近な未来を表す現在形を文脈に即して訳した。「あなたのもとへ」により、πρόςの方向性を明示した。
- source_word: πάτερ ἅγιε
  choice: 聖なる父よ
  rationale: 呼びかけであることを示し、「父」とその聖さの双方を自然で荘重な日本語で保った。
- source_word: τήρησον
  choice: 守ってください
  rationale: τηρέωが含む保護・保持・忠実な保全という広がりを保てる一般的な表現。
- source_word: ἐν τῷ ὀνόματί σου
  choice: あなたの名において
  rationale: ἐνが表し得る領域、手段、権威を一つに限定しすぎない表現。「名」は神の啓示された人格や権威を含み得るが、本文では説明を加えなかった。
- source_word: ᾧ δέδωκάς μοι
  choice: あなたがわたしに与えてくださった
  rationale: 関係代名詞ᾧを「名」に結び付け、父がその名を子に与えたというSBLGNT本文の構造を保った。
- source_word: ἵνα ὦσιν ἓν
  choice: 彼らも一つであるためです
  rationale: ἵναの目的を明示し、中性単数ἓνが表す一致を、過度に説明せず「一つ」と訳した。
- source_word: καθὼς ἡμεῖς
  choice: わたしたちが一つであるように
  rationale: 父と子の一致と弟子たちの一致との比較を保ち、その性質を本文で限定しなかった。
theological_decisions:
- issue: 「あなたの名において守る」の意味
  choice: 本文では「あなたの名において、彼らを守ってください」とした。
  alternative: 「あなたの名によって守ってください」「あなたの名のうちに保ってください」
  rationale: ἐνは領域、手段、権威のいずれをも示し得るため、一つの解釈に狭めず、別訳を脚注に示した。
- issue: 「わたしたちが一つであるように」の比較の強さ
  choice: 父と子の一致と弟子たちの一致との実質的な類比をそのまま表した。
  alternative: 単なる協力関係と明示する訳、または存在論的同一性を読み込む訳
  rationale: 比較の神学的重みを弱めず、同時に本文が明示しない一致の性質を教理的表現で補わないため。
- issue: 関係代名詞ᾧの先行詞
  choice: 「名」を先行詞として訳した。
  alternative: 異読に基づき「あなたがわたしに与えてくださった者たち」と理解する。
  rationale: 提示されたSBLGNT本文では中性単数ᾧがὀνόματιと一致するため。ただし写本異読は訳の意味に関わるので脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、祈りの場面にふさわしい品位を保った。「聖なる父よ」は荘重だが一般読者にも理解しやすい呼びかけ。「名において」はやや改まった表現だが、原文の意味の幅を保つために採用した。
