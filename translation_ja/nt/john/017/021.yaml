id: JHN.17.21
reference: John 17:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: ja
  text: すべての者が一つとなるように[a]。父よ、あなたがわたしのうちにおられ、わたしがあなたのうちにいるように、彼らもわたしたちのうちにいるように[b]。世が、あなたがわたしを遣わされたことを信じるように[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「すべての者が一つとなるように」。ここでいう「一つ」が具体的にどのような一致を指すかは、原文では限定されていない。
    reason: lexical_alternative
  - marker: b
    text: 「わたしのうちに」「あなたのうちに」「わたしたちのうちに」と繰り返される「うちに」は、ヨハネ福音書に特徴的な相互の内住と参与を表し、単に一緒にいること以上の意味を持つ。
    reason: cross_reference
  - marker: c
    text: 「信じるようになる」とも訳せる。ギリシア語は、信じ始めることに重点があるのか、信じ続けることも含むのかを明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: 〜ためです／それは〜ためです
  rationale: 三つの目的・結果を表す節の連なりを保ちつつ、現代日本語として自然に読める形にした。最後の節は「それは」で受け、論理の流れを明確にした。
- source_word: πάντες
  choice: すべての者
  rationale: 祈りの対象全体を指す普遍的な範囲を、簡潔かつ明確に表した。
- source_word: ἓν ὦσιν
  choice: 一つとなる
  rationale: ἓνの「一つ」を明示し、何の面で一つなのかを訳文で限定しなかった。「一致する」よりも原文の広がりと神学的緊張を保てる。
- source_word: καθὼς
  choice: 〜ように
  rationale: 信じる者たちの一つであることと、父と子の相互関係との比較を、自然な日本語で示した。
- source_word: πάτερ
  choice: 父よ
  rationale: 呼びかけであることと、その関係的・神学的意味を明確に保った。
- source_word: ἐν ἐμοὶ ... ἐν σοί ... ἐν ἡμῖν
  choice: わたしのうちに……あなたのうちに……わたしたちのうちに
  rationale: 反復されるἐνを一貫して「うちに」と訳し、単なる同伴や連帯より強い、ヨハネ文書特有の内住・参与の表現を保った。
- source_word: κἀγώ
  choice: わたしが
  rationale: 日本語では前の節との並列によって「そして」の意味が十分に伝わるため、過度に接続語を補わず相互関係を自然に表した。
- source_word: καὶ αὐτοὶ
  choice: 彼らも
  rationale: καίの付加的な意味を「も」で表し、信じる者たちが父と子との関係に参与するという文のつながりを保った。
- source_word: κόσμος
  choice: 世
  rationale: ヨハネ福音書で神学的な含みを持つ定着した表現として「世」を採用し、「世の人々」と解釈的に狭めなかった。
- source_word: πιστεύῃ
  choice: 信じる
  rationale: 現在接続法が、信仰の開始と継続のどちらに重点を置くかを明示しないため、単純に「信じる」とした。
- source_word: ἀπέστειλας
  choice: 遣わされた
  rationale: 父による子の派遣というヨハネ的な語感を保つため「遣わす」を用い、アオリストを日本語の完了的な過去として自然に表した。
theological_decisions:
- issue: 父と子の関係になぞらえられる、信じる者たちの一つであることの性質
  choice: ἓνを「一つ」として保ち、その一体性の具体的な様態を限定しない。
  alternative: 「一致する」「目的において一つとなる」などと解釈的に限定する。
  rationale: 本文はその一体性を制度的、倫理的、形而上学的なもののいずれかに限定していないため、原文の広がりを保った。
- issue: ヨハネ文書における内住の表現
  choice: 「わたしのうちに」「あなたのうちに」「わたしたちのうちに」と訳す。
  alternative: 「わたしと共に」「わたしたちと結ばれて」などと意訳する。
  rationale: 原文がἐνを反復しているため、その相互内住と参与を示す強い表現を弱めたり、特定の説明に置き換えたりしないようにした。
- issue: πιστεύῃが表す信仰の局面
  choice: 「信じる」とし、開始か継続かを特定しない。
  alternative: 「信じるようになる」として、信仰の開始を明示する。
  rationale: 現在接続法そのものはここで開始的意味を必ずしも明示しないため、原文の曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りにふさわしい端正さを保った。「父よ」「遣わされた」「世」によって聖書本文としての格調を維持しつつ、古風な語尾や難解な構文は避けた。
