source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: ja
  text: わたしがお願いしているのは、彼らを世から取り去ることではなく、彼らを悪しき者[a]から守ってくださることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悪」。ギリシア語の「トゥー・ポネールー」は、「悪しき者」とも「悪」とも取ることができる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: お願いしている
  rationale: 現在形の継続的な響きを保ちつつ、父に向けた祈りの中の願いとして自然な現代日本語にした。「祈っている」よりも、語の基本義である「求める／願う」を直接表す。
- source_word: ἄρῃς
  choice: 取り去る
  rationale: αἴρω のここでの意味は、ある領域から除くこと。ἐκ τοῦ κόσμου と組み合わせて「世から取り去る」とするのが自然である。
- source_word: κόσμου
  choice: 世
  rationale: ヨハネ文書で神に背く秩序を含意し得る κόσμος の広がりを保つ、聖書日本語として明瞭で簡潔な訳語。
- source_word: τηρήσῃς
  choice: 守ってくださる
  rationale: τηρέω は「保つ、見守る、守る」の意。ここでは危害や支配からの保護を表すため「守る」が自然であり、父への願いなので敬語を用いた。
- source_word: ἐκ
  choice: から
  rationale: τηρέω ... ἐκ の構文を、何ものかから保護する意味として自然に表す。前半の「世から」との対応も保つ。
- source_word: τοῦ πονηροῦ
  choice: 悪い者
  rationale: 定冠詞付き形容詞の属格は、男性形「悪い者」と中性形「悪」双方に解し得る。ヨハネ文書での人格的な用例を考慮して本文では「悪い者」とし、非人格的解釈を脚注に残す。
theological_decisions:
- issue: τοῦ πονηροῦ を人格的な「悪い者」と取るか、非人格的な「悪」と取るか
  choice: 悪い者
  alternative: 悪
  rationale: ギリシア語の形だけでは両義的だが、ヨハネ文書の用法は人格的な敵を指す解釈を支持する。もっとも曖昧さは真正なものなので、別訳を脚注に示す。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある祈りの文体。「わたし」「彼ら」を用い、父への願いには「くださる」を添えて自然な敬意を表した。脚注記号は曖昧な語句の直後ではなく、文全体の別訳を示すため文末に置いた。
