source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: ja
  text: わたしは彼らにあなたのことばを与えました。世は彼らを憎みました。彼らは世に属しておらず[a]、わたしも世に属していないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「世からではなく」。ギリシア語の表現は、起源・由来または帰属を表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: 与えました
  rationale: 完了形が示す、すでに成し遂げられた授与を自然な現代日本語で表す。文脈上、その結果が続いていることも読み取れる。
- source_word: λόγον
  choice: みことば
  rationale: 父がイエスを通して弟子たちに伝えたことばを指す。ヨハネ文書の語法と神学的な響きを保ちつつ、神のことばであることを明確にする。
- source_word: κόσμος
  choice: 世
  rationale: 神に敵対する人間世界を含むヨハネ特有の広がりを保つため、説明的な語を加えず『世』とした。
- source_word: ἐμίσησεν
  choice: 憎みました
  rationale: アオリストを素直に過去形で表し、世の敵意が現実に現れたことを伝える。
- source_word: ὅτι
  choice: からです
  rationale: 弟子たちが世に属さないことを、世が彼らを憎んだ理由として示す因果関係を明確にする。
- source_word: ἐκ τοῦ κόσμου
  choice: 世に属する者ではない
  rationale: ἐκの表す起源・由来と帰属の幅のうち、現代日本語として自然な帰属表現を本文に採用し、原文の『から』という形と起源の含意は脚注に残す。
- source_word: καθὼς
  choice: のと同じ
  rationale: 弟子たちとイエスの世に対する関係を、原文どおり明確に比較する。
theological_decisions:
- issue: 弟子たちとイエスが『世からではない』という比較
  choice: 弟子たちもイエスも『世に属する者ではない』と同じ表現で訳す。
  alternative: 彼らは世から出た者ではなく、わたしも世から出た者ではない。
  rationale: 比較を弱めず、そのまま保つ一方、弟子とイエスの起源が全く同一であるという本文以上の形而上学的説明は加えない。ἐκが持つ起源・帰属の緊張は脚注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りの文脈にふさわしい品位を保った。神の語りかけを示す『あなた』、イエスの一人称としての『わたし』、ヨハネ文書で定着した『世』『みことば』を採用した。
