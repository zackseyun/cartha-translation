base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: ja
  text: 真理によって彼らを聖別してください。あなたのことばは真理です。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、述語の「真理」に冠詞がありません。このため、単なる同定というより、あなたのことばが本質的に真理であることを強調しているとも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: 聖別してください
  rationale: ἁγιάζωのアオリスト能動命令形。父への祈りとして自然な敬語表現を用い、「聖なるものとして取り分ける」と「聖なるものとする」の両面を保つ。
- source_word: αὐτοὺς
  choice: 彼らを
  rationale: 弟子たちを指す対格複数代名詞を、明確で自然な目的語として訳した。
- source_word: ἐν τῇ ἀληθείᾳ
  choice: 真理のうちに
  rationale: 定冠詞を伴うἐν＋与格の領域的・手段的な幅を保持する。「真理によって」と限定せず、真理を彼らが聖別される領域とも手段とも読めるようにした。
- source_word: ὁ λόγος ὁ σὸς
  choice: あなたのことば
  rationale: 強調された所有表現を自然な日本語にした。λόγοςはここで神から伝えられたことばを指すため、「ことば」とした。
- source_word: ἀλήθειά ἐστιν
  choice: 真理です
  rationale: 無冠詞の述語名詞ἀλήθειαを、形容詞的な「真実です」に弱めず、実質名詞の「真理」として訳した。日本語には冠詞がないため、限定的・質的な読みの余地は注で示す。
theological_decisions:
- issue: 第二文のἀλήθειαを質的に取るか、同定的に取るか
  choice: あなたのことばは真理です
  alternative: あなたのことばこそ、その真理です
  rationale: ギリシア語の述語名詞ἀλήθειαには冠詞がなく、神のことばが真理そのものであるという質的な力点が自然である。一方、日本語では冠詞の差を直接再現できないため、本文は簡潔に保ち、より明確な同定的解釈を注に示した。
- issue: ἐν τῇ ἀληθείᾳの意味を領域か手段かに限定するか
  choice: 真理のうちに
  alternative: 真理によって
  rationale: ἐν＋与格はここで領域と手段の双方を含み得るため、一方に決めず原文の幅を保った。
translation_notes:
  register: 明瞭で格調ある現代標準語。祈りの相手である父に対して「してください」を用いた。「御言葉」は教会語的な響きが強いため、一般読者にも理解しやすい「ことば」を採用した。
