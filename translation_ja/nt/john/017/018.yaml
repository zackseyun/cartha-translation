  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: ja
  text: あなたがわたしを世に遣わされたように、わたしも彼らを世に遣わしました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: 〜ように
  rationale: 父がイエスを遣わしたことと、イエスが弟子たちを遣わしたこととの対応を、自然な現代日本語で明確に示す。
- source_word: ἐμὲ
  choice: わたしを
  rationale: ἀπέστειλαςの直接目的語。文脈上、話者であるイエスを指すため、明瞭に「わたしを」とした。
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: 遣わされた／遣わしました
  rationale: ἀποστέλλωの派遣・使命の含意を保つ定着した日本語。「送る」よりもヨハネ福音書の使命的文脈に適し、両節で同じ動詞を用いて原文の並行を保った。前半は父への敬意を表す主語尊敬語であり、後半は通常の丁寧語とした。
- source_word: εἰς τὸν κόσμον
  choice: 世に
  rationale: 日本語として自然で簡潔に、世界へと遣わされる方向性を表す。κόσμοςは解釈を狭めず、ヨハネ文書で定着した「世」と訳した。
- source_word: κἀγὼ
  choice: わたしも
  rationale: καὶ ἐγώの付加的な意味と、父の行為に対応するイエスの行為を自然に表す。
- source_word: αὐτοὺς
  choice: 彼らを
  rationale: 文脈上の弟子たちを指す三人称複数代名詞として訳し、原文どおり明示した。
theological_decisions:
- issue: 父による御子の派遣と、御子による弟子たちの派遣との対応
  choice: 両方を「遣わす」で統一し、比較構文「〜ように……も」で並行を保つ。
  alternative: 前半を「遣わす」、後半を「使命を与える」などと訳し分ける。
  rationale: 原文は同じἀποστέλλωを反復して両者の対応を強調している。ただし「〜ように」は類比を示すので、御子と弟子たちの身分や使命があらゆる点で同一だとは述べない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。祈りの中で父に語りかける文脈に合わせ、「あなた」と丁寧体を用いた。「世界」ではなく、ヨハネ福音書のκόσμοςの神学的な広がりと緊張を保つ「世」を採用した。
