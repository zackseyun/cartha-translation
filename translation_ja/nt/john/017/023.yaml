  to: わたしは彼らのうちに、あなたはわたしのうちにおられます。それは、彼らが完全に一つとされ、あなたがわたしを遣わし、わたしを愛されたように彼らを愛されたことを、世が知るためです。
  rationale: 「一つのもの」を除き、εἰς ἕνが示す一致への結果を「一つとされる」と訳した。「完全に」はτελειόωの完成の含意を保つが、文脈上、罪のない絶対的完全さだけを主張するものではない。二つのἵνα節は「それは…、…世が知るためです」として、目的の連なりを日本語で明瞭に示した。
  reviewer_model: gpt-5.6-terra
