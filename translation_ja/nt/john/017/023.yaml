source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: ja
  text: わたしは彼らのうちに、あなたはわたしのうちにおられます。それは、彼らが完全に一つとされ、あなたがわたしを遣わし、わたしを愛されたように彼らを愛されたことを、世が知るためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί
  choice: わたしは彼らのうちに、あなたはわたしのうちにおられます
  rationale: 前置詞ἐνをともに「うちに」とし、ヨハネ福音書に特徴的な相互内住の表現を保った。原文で省略されている連結動詞は、自然な日本語にするため「おられます」と補った。
- source_word: τετελειωμένοι
  choice: 完成される
  rationale: τελειόωの完了受動分詞が示す、働きを受けて完成した状態に至る意味を表す。「完全」とすると罪のない絶対的な完全さだけを連想させるおそれがあるため、文脈上の完成・成就の含みを持つ「完成」を選んだ。
- source_word: εἰς ἕν
  choice: 一つのものへと
  rationale: εἰςと対格が示す方向および結果を「へと」で表し、単に既存の一致の中にいるというより、一つとなる完成へ向かう意味を保った。
- source_word: γινώσκῃ
  choice: 知る
  rationale: ἵναに続く現在接続法を、目的を表す「知るため」と自然に訳した。「知るようになる」も可能だが、そこまでの過程性は明示しなかった。
- source_word: ὁ κόσμος
  choice: 世
  rationale: ヨハネ文書で重要なκόσμοςの簡潔で伝統的な対応語を用い、「世の人々」などの解釈的な限定を避けた。
- source_word: ἀπέστειλας
  choice: 遣わし
  rationale: 父が子を派遣したことを表すヨハネ福音書の用語として「遣わす」を用い、使命を伴う派遣の含みを自然に保った。
- source_word: ἠγάπησας
  choice: 愛された
  rationale: 二度のἠγάπησαςを同じ語で訳し、父が弟子たちを愛したこととイエスを愛したことの語彙的対応を維持した。
- source_word: καθὼς
  choice: ように
  rationale: 父の弟子たちへの愛と子への愛との直接的な比較を、弱めたり説明的に限定したりせず表した。
theological_decisions:
- issue: 「わたしを愛されたように彼らを愛された」における比較の強さ
  choice: 「わたしを愛されたように彼らを愛された」と直接比較する
  alternative: 「わたしへの愛と同じ種類の愛で彼らを愛された」など、比較の範囲を限定する説明的表現
  rationale: καθὼςが置く重い比較をそのまま保ち、父が信じる者を愛することと子を愛することとの関係を翻訳で弱めたり、逆に体系的に説明したりしないため。
- issue: τετελειωμένοιの文脈上の意味
  choice: 一つのものへと「完成される」と表現する
  alternative: 罪のない絶対的完全さを前面に出す「完全無欠になる」、または受動性を失う「完全に一つになる」
  rationale: 完了受動分詞とεἰς ἕνを踏まえ、彼らが働きを受けて一致の完成した状態へ至る意味を保ちつつ、絶対的な道徳的無欠性に限定しないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祈りの言葉にふさわしい品位を保った。原文冒頭の動詞省略は日本語では不自然になるため「おられます」を補い、二つのἵνα節は「ため」を反復して目的構造を見える形にした。
