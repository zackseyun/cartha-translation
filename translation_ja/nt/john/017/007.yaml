  text: νῦν ἔγνωκαν ὅτι πάντα ὅσα ⸀δέδωκάς μοι παρὰ σοῦ ⸀εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: ja
  text: 今、彼らは、あなたがわたしに与えてくださったものはすべて、あなたからのものであることを知っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがわたしに与えてくださったものはすべて、あなたから来たものです。」
    reason: παρὰ σοῦ εἰσιν は、源・由来を「あなたから来た」と表すこともできるため。
lexical_decisions:
- source_word: νῦν
  choice: 今
  rationale: 弟子たちの理解が現時点で成立していることを示す時間副詞として、簡潔で自然な「今」とした。
- source_word: ἔγνωκαν
  choice: 知っています
  rationale: 完了形が表す、知るに至った結果として現在も続く認識を、現代日本語で自然な状態表現にした。到達の含みは文脈と「今」によっても伝わる。
- source_word: πάντα ὅσα
  choice: あなたがわたしに与えてくださったものはすべて
  rationale: 全体性と関係節の働きを保ちつつ、日本語として明瞭な語順にした。
- source_word: δέδωκάς μοι
  choice: あなたがわたしに与えてくださった
  rationale: δίδωμιの完了形が示す、与えられたものの継続的な意義を文脈上保つ。「くださった」は父への敬意を表す自然な日本語であり、付加的な教理解釈ではない。
- source_word: παρὰ σοῦ εἰσιν
  choice: あなたから出たものである
  rationale: παρά＋属格の源・由来を明示する。「あなたからのものである」も可能だが、「出た」は起源をより明瞭に伝える。
theological_decisions:
- issue: 父が子に与えたものと、その源との関係
  choice: 「あなたから出たものである」と、父を源とする陳述として訳した。
  alternative: 「あなたからのものである」／「あなたから来たものである」
  rationale: 本文が述べる由来を保ちつつ、父と子の関係について本文以上の教理的説明を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。祈りの文脈に合わせて父への二人称を「あなた」、イエスの一人称を「わたし」とした。
