  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: ja
  text: イエスはこれらのことを語り、目を天に上げて言われた。「父よ、時が来ました。あなたの子に栄光をお与えください。子があなたに栄光をお与えするように。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα ἐλάλησεν
  choice: これらのことを語り
  rationale: Ταῦταは直前までの教え全体を指す中性複数であり、「これらのこと」とした。ἐλάλησενは発話を表すため、自然で品位ある「語り」とした。
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανόν
  choice: 目を天に上げて
  rationale: 祈りに際する実際の身振りと、天へ向かう方向を簡潔な現代日本語で保った。
- source_word: Πάτερ
  choice: 父よ
  rationale: 呼格をそのまま呼びかけとして訳し、原文にない「わたしの」は加えなかった。
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: 時が来ました
  rationale: 完了形が示す決定的な到来を「来ました」で表した。「時」はヨハネ福音書におけるὥραの主題的な用法を保つ。
- source_word: δόξασόν σου τὸν υἱόν
  choice: あなたの子に栄光をお与えください
  rationale: δοξάζωの栄誉と啓示に関わる意味を「栄光を与える」で表現した。直訳的な「栄光を現す」よりも、ここでの他動詞構文が明瞭になる。
- source_word: ἵνα ὁ υἱὸς δοξάσῃ σέ
  choice: それによって、子もあなたに栄光をお返しするためです
  rationale: ἵναの目的・結果の含みを「それによって…ため」とし、相互的な栄光付与を自然な日本語で示した。「も」は文脈上の対応関係を明示する補足である。
theological_decisions:
- issue: 父と子の相互的な栄光
  choice: 「あなたの子に栄光をお与えください。それによって、子もあなたに栄光をお返しするためです」
  alternative: 「あなたの子に栄光をお与えください。子があなたに栄光をお与えするためです」
  rationale: 同じδοξάζωを双方について「栄光」で統一しつつ、日本語では子から父への動きを「お返しする」として相互関係を明瞭にした。ただし、その栄光の具体的な様態について教理的説明は加えていない。
- issue: υἱόςの表記
  choice: 子
  alternative: 御子
  rationale: 原文は単に「子」であり、「御子」は敬意と称号性を明示する伝統的訳語だが、現代の普通の読者にも直接理解でき、原語により近い「子」を採用した。文脈によりイエスを指す称号的用法は明らかである。
- issue: ἵναの目的・結果の幅
  choice: 「それによって…ためです」
  alternative: 「…ように」
  rationale: ἵναが目的を中心としながら結果の含みも持ち得ることを、「それによって」と「ため」の組み合わせで表した。一方だけに過度に限定する説明は本文に入れていない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祈りの呼びかけには丁寧体を採用した。「父よ」は荘重さを保ちながら現在も理解しやすい表現。文脈を受ける冒頭と身体動作は簡潔にし、祈りの中心語「時」「栄光」「子」を際立たせた。
