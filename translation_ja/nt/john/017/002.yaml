source:
  edition: SBLGNT
  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: ja
  text: あなたが御子に、すべての人に対する権威[a]をお与えになったように、御子があなたが御子に与えられたすべての人[b]に永遠の命を与えるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「すべての肉に対する権威」。「すべての肉」は、すべての人を指す聖書的な表現。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたが御子に与えられたすべてのもの」。原文では中性単数の集合表現によって、御子に与えられた人々を指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ～のは
  rationale: 前節の願いと、父が御子に権威を与えた事実との対応を、日本語の文脈に自然な形で示す。後続のἵνα節と合わせ、文全体の論理関係を明確にした。
- source_word: ἔδωκας
  choice: お与えになった
  rationale: アオリストの出来事としての授与を過去形で表し、父への祈りにふさわしい敬語を用いた。
- source_word: αὐτῷ
  choice: 御子に
  rationale: 文脈上の指示対象である子を明示し、日本語で代名詞が重なって不明瞭になるのを避けた。
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 単なる能力ではなく、授けられた権利と統治権を表す。
- source_word: πάσης σαρκός
  choice: すべての人を治める
  rationale: 直訳の「すべての肉」は現代日本語では誤解を招きやすいため、人類全体を指す聖書的慣用句の意味を本文に出した。属格が示す権威の及ぶ範囲は「治める」で自然に表現した。
- source_word: ἵνα
  choice: ～ためです
  rationale: 目的を明確に示し、現代日本語として自然な祈りの文にした。
- source_word: πᾶν ὃ
  choice: すべての人
  rationale: 形は中性単数の集合表現だが、ここでは父から子に与えられた人々を指すため、人格的指示対象を自然に示した。原文の形式は脚注に残した。
- source_word: δέδωκας
  choice: 与えられた
  rationale: 完了形が示す、すでになされた行為とその継続的な効力を、日本語では文脈上自然な過去表現で示した。
- source_word: δώσῃ
  choice: 与える
  rationale: ἵναに導かれるアオリスト接続法の目的を「ため」で表したため、動詞自体は自然な辞書形とした。
- source_word: ζωὴν αἰώνιον
  choice: 永遠の命
  rationale: ヨハネ文書の定着した表現であり、尽きない命と来るべき時代に属する命の含意を保つ。
theological_decisions:
- issue: 「すべての人」に及ぶ権威と、永遠の命を与えられる人々との関係
  choice: 御子の権威が全人類に及ぶことと、永遠の命が父から御子に与えられた人々に与えられることを区別して表現した。
  alternative: 双方を同一範囲と解釈する、または特定の教派的体系に沿って範囲を限定・拡張する。
  rationale: 原文はπάσης σαρκόςとπᾶν ὃ δέδωκας αὐτῷを別個に述べている。その緊張を保ち、本文以上の神学的結論を訳文に持ち込まない。
- issue: πᾶν ὃの中性単数集合表現
  choice: 本文では人格的な指示対象を明確にして「すべての人」と訳し、文法的な形は脚注で示した。
  alternative: 「あなたが御子に与えられたすべてのもの」と逐語的に訳す。
  rationale: 逐語訳では物を指すように受け取られやすいが、文脈と後続のαὐτοῖςは人々を指す。意味を明確にしつつ、原文の集合的表現を脚注で保存する。
translation_notes:
  register: 明瞭で現代的ながら、祈りの場面にふさわしい品位を保った。「あなた」は父への呼びかけ、「御子」は文脈上の子を明示する敬称として用いた。本文の二つの「すべての人」が別の構文要素であることを、語順と修飾によって区別した。
