  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: ja
  text: 彼らのために、わたしは自分自身を聖別します[a]。それは、彼ら自身も真理のうちに[b]聖別された者となるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分自身をささげます」または「自分自身を聖なるものとして取り分けます」とも訳せる。ここで用いられたギリシア語の動詞は、後半の「聖別された」と同じ語根である。
    reason: lexical_alternative
  - marker: b
    text: 「真理において」とも訳せる。17章17節参照。
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: 彼らのために
  rationale: ὑπέρ＋属格が表す利益・代理の意味を自然な日本語で示し、ここで代償的意味に限定しない。
- source_word: ἁγιάζω ἐμαυτόν
  choice: わたしは自分自身を聖別します
  rationale: ἁγιάζωはここでは道徳的に清くなることより、使命のために自らを聖なるものとして取り分け、ささげることを表す。「聖別」により後半の同語根との対応も保つ。
- source_word: ἵνα ὦσιν καὶ αὐτοὶ
  choice: それは、彼ら自身も…となるためです
  rationale: ἵναの目的を明示し、καὶ αὐτοὶの包含と強調を「彼ら自身も」で表した。
- source_word: ἡγιασμένοι
  choice: 聖別された者
  rationale: 完了受動分詞が示す、聖別の行為によって生じた状態を表し、前半のἁγιάζωとの語根上の反復を維持する。
- source_word: ἐν ἀληθείᾳ
  choice: 真理のうちに
  rationale: ἐνの領域的な意味を保ち、無冠詞のἀληθείᾳを過度に限定せず、17:17とのつながりも読める表現とした。
theological_decisions:
- issue: イエスが自分自身を聖別することの意味
  choice: 使命のために自分自身を取り分け、ささげること
  alternative: 自分を道徳的にさらに清くすること
  rationale: 文脈上、弟子たちのための自己奉献・聖別を語っていると理解するのが適切である。ただし本文では解釈を説明的に展開せず、同じ動詞を「聖別する」で統一した。
- issue: ἐν ἀληθείᾳの働き
  choice: 聖別が行われる領域・現実として「真理のうちに」
  alternative: 「真実に」または手段として「真理によって」
  rationale: ギリシア語は領域・様態・手段の含みを許すため、本文ではἐνに比較的近い表現を採り、様態的な可能性は脚注に残した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祈りの荘重さを保つ文体とした。「聖別」は日常語ではないが、同一語根の反復と聖なる目的への取り分けを簡潔に示すため採用し、脚注で意味を補った。
