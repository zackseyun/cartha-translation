source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: ja
  text: というのは、あなたがわたしに与えてくださったことばを、わたしは彼らに与えました。[a] 彼らはそれを受け取り、わたしがあなたのもとから来たことを本当に知り、あなたがわたしを遣わされたことを信じました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ことば」は「語られたこと」「発言」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: ことば
  rationale: 語られた個々のことば・言葉を表す複数形の具体性を保ちつつ、現代日本語として自然にした。「教え」や「メッセージ」ほど解釈を加えない。
- source_word: ἔδωκάς ... δέδωκα
  choice: 与えてくださった……与えました
  rationale: 同じ動詞の反復を保った。日本語では敬意の向きを明確にするため、父の行為には「くださった」を用いた。後半の完了形は、完了した授与とその結果が文脈上明らかなため自然な「与えました」とした。
- source_word: ἔλαβον
  choice: 受け入れ
  rationale: 与えられた啓示を受領したという文脈に合い、物理的な「取った」より自然である。受容の含みはあるが、「承認した」ほど意味を限定しない。
- source_word: ἔγνωσαν ἀληθῶς
  choice: 本当に知り
  rationale: ἀληθῶςを「本当に」で明示し、γινώσκωの到達した認識を文脈に沿って表した。「確信した」として認識の様態を狭めることは避けた。
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: あなたのもとから来た
  rationale: 起源・出所を示すπαρά＋属格とἐξέρχομαιを自然に表し、「出て来た」が持ちうる空間的な響きに限定しない。
- source_word: ἐπίστευσαν ὅτι
  choice: …ことを信じました
  rationale: ὅτι節が命題内容を導くため、関係的な「信頼した」ではなく、内容を信じたことが明確な構文にした。
- source_word: ἀπέστειλας
  choice: 遣わされた
  rationale: 父が子を使命をもって送る文脈で、「送られた」より聖書的な重みを保ちながら、現代日本語でも理解できる「遣わす」を用いた。
- source_word: ὅτι
  choice: （訳出せず前節から継続）
  rationale: 文頭のὅτιは前節の発言を理由づけるが、単節提示の日本語で「なぜなら」を置くと不自然になりやすい。前後の連続では説明関係が文脈から保たれる。
theological_decisions:
- issue: παρὰ σοῦ ἐξῆλθονにおけるイエスと父との関係
  choice: わたしがあなたのもとから来た
  alternative: わたしがあなたから出て来た
  rationale: 父を起源・出所として示す本文の重みを保ちつつ、後代の教理用語を持ち込まず、存在論的または単に空間的な意味のどちらかに限定しない。
- issue: πιστεύω＋ὅτι節の意味
  choice: あなたがわたしを遣わされたことを信じました
  alternative: あなたがわたしを遣わされたと信頼しました
  rationale: 信じる内容を示すὅτι節の統語を明確にし、命題への信を関係的信頼へ置き換えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」「あなた」を用い、祈りの直接話法を自然に表現した。神への敬意は「与えてくださった」「遣わされた」で示したが、過度な古語や教派固有の表現は避けた。
