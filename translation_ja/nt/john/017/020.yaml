  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: ja
  text: わたしは、この人たちのことだけをお願いしているのではありません。彼らの言葉[a]を通してわたしを信じる人たちのこともお願いしています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「言葉」は「メッセージ」または「語りかけ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: お願いする
  rationale: 父に向けられた発話として自然な日本語でありつつ、動詞の基本義である「求める、頼む」を保つ。「祈る」として祈祷行為そのものを明示することは避けた。
- source_word: περὶ τούτων
  choice: この人たちのこと
  rationale: περί＋属格の「～について」を表し、τούτωνが直前まで語られていた弟子たちを指すことを自然に示す。「ために」として代願の意味を強めすぎない。
- source_word: μόνον
  choice: だけ
  rationale: 願いの対象がこの人たちに限定されないという原文の範囲限定を、自然な現代日本語で表す。
- source_word: ἀλλὰ καὶ
  choice: だけではありません……こともです
  rationale: 否定と追加の対照を日本語の相関構文で明確に再現する。
- source_word: τῶν πιστευόντων
  choice: 信じる人たち
  rationale: 名詞的に用いられた現在分詞の動詞性を保つ。時制を「信じるようになる」と未来に限定せず、原文の時間的な幅を残す。
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: 彼らの言葉を通して
  rationale: διά＋属格の媒介を「通して」で表す。λόγοςはここでは宣べ伝えられる内容・証言を指し得るが、「言葉」としてヨハネ文書での語の響きと語彙上の幅を残した。
- source_word: εἰς ἐμέ
  choice: わたしを信じる
  rationale: 日本語では「わたしに信じ入る」より「わたしを信じる」が自然であり、信頼・信仰の人格的対象がイエスであることを明瞭に表す。
theological_decisions:
- issue: イエスの願いが直接の弟子たちを越えて及ぶ範囲
  choice: 弟子たちの言葉を通してイエスを信じる人々を含むが、その人々を未来の信者だけに限定しない表現とした。
  alternative: 「これから信じる人たち」と訳し、後代の信者であることを明示する。
  rationale: τῶν πιστευόντωνは現在分詞で、文脈上は将来の信者も自然に含み得るが、原文自体は未来時制を明示していない。そのため時間的範囲を訳文で限定せず、広がりと曖昧さの双方を保った。
translation_notes:
  register: 明瞭な現代標準日本語。祈りの文脈にふさわしい丁寧さと品位を保ちながら、過度に文語的な「願わくは」や、解釈を強める「祈る」は避けた。
