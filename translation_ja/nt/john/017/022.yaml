  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: ja
  text: あなたがわたしに与えてくださった栄光を、わたしも彼らに与えました。[a] それは、わたしたちが一つであるように、彼らも一つであるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「また、あなたがわたしに与えてくださった栄光を、わたしは彼らに与えました。」ギリシア語のκἀγώは、「また、わたしは」または「わたしも」と訳し得る、付加的な強調を含む表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: また…わたしも
  rationale: καίとἐγώの融合形が持つ付加的・強調的な意味を自然な日本語で明示した。文脈上、前節からの連続も「また」で保っている。
- source_word: δόξαν
  choice: 栄光
  rationale: ヨハネ文書における神的な重みと用語の一貫性を保ち、単なる人間的な「名誉」に限定しない。
- source_word: ἣν δέδωκάς μοι
  choice: あなたがわたしに与えてくださった
  rationale: 完了形が示す、すでに与えられ、その結果が続いている行為を日本語の自然な過去表現で示した。「くださった」は父に対する子の発話として敬意を自然に表す。
- source_word: δέδωκα αὐτοῖς
  choice: 彼らに与えました
  rationale: 完了した授与とその持続的な結果を、文脈に合う丁寧体で自然に表現した。
- source_word: ἵνα
  choice: それは…ためです
  rationale: 目的ないし意図された結果を明確にしつつ、どちらか一方に過度に限定しない。
- source_word: ὦσιν
  choice: 一つとなる
  rationale: ἵνα節の目的性を「ためです」で担わせ、日本語として自然に表現した。継続的な一致を排除しない。
- source_word: ἓν
  choice: 一つ
  rationale: 中性単数の簡潔な表現を保ち、「一致している」などの解釈的な語に置き換えない。
- source_word: καθὼς
  choice: …ように
  rationale: 比較を明確に示す、自然で現代的な日本語表現。
- source_word: ἡμεῖς ἕν
  choice: わたしたちが一つである
  rationale: ギリシア語で省略された繋辞を補いながら、父と子の一性の性質を翻訳で規定せず、簡潔さを保った。
theological_decisions:
- issue: 信じる者たちの一性と父・子の一性との比較の性質
  choice: 「わたしたちが一つであるように、彼らも一つとなる」と比較をそのまま訳し、一性の様態を規定しない。
  alternative: 関係的、存在論的、宣教的、または制度的な一致のいずれかに限定して訳す。
  rationale: 本文は両者を実際に比較しているが、その比較の厳密な様態をこの節だけでは定義していないため、神学的緊張と真正な曖昧さを保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。祈りとしての語調に合わせて丁寧体を用いた。「わたし」「彼ら」「一つ」は簡潔で一般読者に理解しやすい表現とし、教派固有の解釈を加えていない。
