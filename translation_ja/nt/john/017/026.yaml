id: JHN.17.26
reference: John 17:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: ja
  text: わたしは彼らにあなたの御名[a]を知らせました。そして、これからも知らせます[b]。それは、あなたがわたしを愛してくださったその愛が彼らのうちにあり[c]、また、わたしも彼らのうちにいるようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「御名」は、単なる呼び名ではなく、神が明らかにされたご自身の存在とご性質を指します。
    reason: cultural_note
  - marker: b
    text: 別訳「明らかにしました。そして、これからも明らかにします」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「彼らの間に」。ただし、「彼らのうちに」は、ヨハネ福音書における内住の主題をより直接に保っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: 知らせました
  rationale: アオリスト能動直説法一人称単数。γνωρίζωの「知るようにする」という使役的意味を自然な現代日本語で表し、後続のγνωρίσωとの対応も保つ。
- source_word: τὸ ὄνομά σου
  choice: あなたの御名
  rationale: 本文の具体的な「名」という表現を保ち、「あなたがどのような方か」などの説明的意訳を本文に入れない。「御名」は神を指す文脈にふさわしい、明瞭で品位ある表現。
- source_word: γνωρίσω
  choice: これからも知らせます
  rationale: 未来能動直説法。目的語は直前の「御名」から明らかなため反復せず、καίと未来形が示す継続的・将来的な行為を「そして、これからも」で自然に表す。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的を表すἵνα節の力を、現代日本語で明確に示す。
- source_word: ἡ ἀγάπη
  choice: その愛
  rationale: 直前の関係節で特定される愛を自然に受けるため「その」を用い、ἀγάπηは基本義どおり「愛」とする。
- source_word: ἣν ἠγάπησάς με
  choice: あなたがわたしを愛してくださった
  rationale: 父から子への愛を示す関係節を自然な日本語にする。「くださった」は、日本語における父への敬意と愛の方向を表すが、意味内容は加えない。
- source_word: ἐν αὐτοῖς
  choice: 彼らのうちに
  rationale: ἐν＋与格の直接的な意味を保ち、ヨハネ福音書に見られる内住の主題も曖昧にしない。
- source_word: ᾖ
  choice: あり
  rationale: ἵναに続く現在接続法を目的節内の「ある」として表現し、後半の省略された動詞にも意味を自然につなぐ。
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: わたしも彼らのうちにいる
  rationale: ギリシア語では動詞が省略されているが、日本語では「いる」を補って意味を明確にする。καίは「も」として、愛とイエスの内住という並列された二つの要素を保つ。
theological_decisions:
- issue: ヨハネ神学における「あなたの名」の意味
  choice: 本文では「あなたの御名」を保つ。
  alternative: 「あなたがどのような方か」「あなたのご性質」
  rationale: この表現は父の啓示された存在・ご性質を含意するが、原文は「名」と述べる。説明的な解釈に置き換えず、聖書的表現とその神学的な広がりを保つ。
- issue: 父の愛とキリストの内住との関係
  choice: 「その愛が彼らのうちにあり、わたしも彼らのうちにいる」と並列して訳す。
  alternative: キリストの内住を愛の原因または結果として明示する訳
  rationale: 原文は二つの現実を並置しており、両者の因果関係を明示していない。その神学的な緊張と簡潔さを解釈によって解消しない。
- issue: ἐν αὐτοῖςの理解
  choice: 「彼らのうちに」と訳す。
  alternative: 「彼らの間に」
  rationale: 「間に」も文脈上可能だが、「うちに」はἐνの直接的な意味とヨハネ福音書の内住の主題をよりよく保つ。一方、別解の可能性は注で示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、祈りの文脈にふさわしい品位を保った。「わたし」「あなた」は平易さと荘重さの均衡を取り、「御名」は神に対する自然な敬意を示す。「これからも」により、過去の啓示と将来の啓示の対比を日本語として明確にした。
