- from: しかし今、私はあなたのもとに行きます。そして、彼らのうちに私の喜びが満ちあふれるようになるために[a]、私は世にいる間に、これらのことを語っています。
  to: しかし今、私はあなたのもとに行きます。そして私は、彼らが私の喜びを自分たちのうちに満ち満ちたものとして持つために[a]、世にあってこれらのことを語っています。
  rationale: 原文の節の順序を保ち、ἵναの目的、ἔχωσινの「持つ」、およびπεπληρωμένηνの「満たされた結果状態」を訳文に回復した。「世」は維持しつつ、ἐν τῷ κόσμῳを「世にあって」として場所・状況の表現にとどめた。脚注は必要な構文上の説明に絞り、本文の意味を超えて「彼らの間に」という別解を強調しない。
