  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: ja
  text: しかし今、私はあなたのもとに行きます。そして私は、彼らが私の喜びを自分たちのうちに満ち満ちたものとして持つために[a]、世にあってこれらのことを語っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「彼らが私の喜びを自分たちのうちに満たされたものとして持つために」。
    reason: ἔχωσιν（「持つ」）に、完了受動分詞πεπληρωμένην（「満たされた」）が結びつく構文を示すため。
lexical_decisions:
- source_word: νῦν δὲ
  choice: しかし今
  rationale: νῦνの時間的な転換と、δέの穏やかな対照・展開の働きを自然な日本語で示した。
- source_word: πρὸς σὲ ἔρχομαι
  choice: 私はあなたのもとに行きます
  rationale: 話者であるイエスから御父への移動を表すため、日本語の視点では「来ます」より「行きます」が自然である。「あなたのもとに」によりπρόςの方向性も保った。
- source_word: ταῦτα λαλῶ
  choice: これらのことを語っています
  rationale: λαλέωの発話行為と現在の継続的な場面を、明瞭で品位ある現代日本語にした。
- source_word: ἐν τῷ κόσμῳ
  choice: 世にいる間に
  rationale: 単なる場所だけでなく、イエスがなお世にいる時に語っているという文脈上の意味を自然に表した。同時にヨハネ文書で反復される「世」という語を保持した。
- source_word: ἵνα ἔχωσιν
  choice: 彼らのうちに…なるために
  rationale: ἵναの目的を明示した。ἔχωσινを逐語的な「持つ」とせず、喜びが彼らの内に十分に存在することを日本語として自然に表現した。
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: 私の喜び
  rationale: 強調を伴う所有表現を簡潔に訳し、イエス自身に属する喜びであることを保持した。
- source_word: πεπληρωμένην
  choice: 満ちあふれるようになる
  rationale: 完了受動分詞が示す、満たされた結果の状態を目標とする意味を表した。「成就する」よりも「喜び」と自然に結びつき、πληρόωの充満の比喩も伝える。
- source_word: ἐν ἑαυτοῖς
  choice: 彼らのうちに
  rationale: 再帰代名詞が示す、弟子たちの内に喜びが存在し経験される意味を自然に表した。「彼らの間に」という集合的な理解を排除し切らないよう脚注に別訳を示した。
theological_decisions:
- issue: 「私の喜び」の性質
  choice: イエス自身に属する喜びが弟子たちのうちに満ちることとして訳した。
  alternative: イエスについて抱く喜びと解する。
  rationale: ἐμὴνは最も自然にはイエス自身の喜びを指す。ただし、それが弟子たちにどのように共有されるかについては本文以上の教理的説明を加えなかった。
- issue: ἐν ἑαυτοῖςの範囲
  choice: 個々および共同体の内的経験を含み得る「彼らのうちに」とした。
  alternative: 「彼らの間に」として共同体的な意味を前面に出す。
  rationale: 再帰形と文脈から内在的な意味が自然だが、複数形には共同体的な含みもあり得るため、訳文で過度に限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、祈りの厳粛さにふさわしい丁寧体とした。「世」「私の喜び」などヨハネ福音書の主要語を保持し、過度に説明的な言い換えは避けた。
