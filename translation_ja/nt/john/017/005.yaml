  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: ja
  text: 今、父よ、あなたご自身のもとで[a]、世界が存在する前[b]に私があなたのもとで持っていたあの栄光をもって、私を栄光に輝かせてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「あなたご自身のそばで」とも訳せる。ギリシア語は、父の近くにいること、または父の臨在のうちにあることを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「世界がある前」または「世界が生じる前」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν με
  choice: 私に栄光を与えてください
  rationale: 命令形の意味を自然な現代日本語で表しつつ、ヨハネ福音書で重要な「栄光」の語彙を保持した。文脈上、以前持っていた栄光を再び受ける願いなので、「誉れを与える」より適切である。
- source_word: παρὰ σεαυτῷ
  choice: あなたご自身のもとで
  rationale: παρά＋与格の近接・臨在の意味と、再帰代名詞σεαυτῷの強調をともに保った。「もとで」は空間的・関係的な含みを自然に伝える。
- source_word: τῇ δόξῃ ᾗ εἶχον
  choice: 私が…持っていたあの栄光を
  rationale: ギリシア語では与格だが、日本語では願われている栄光を目的語として組み替えると明瞭で自然になる。未完了過去εἶχονは、世界存在以前にその栄光を持っていたことを表す。
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: 世界が存在する前に
  rationale: 冠詞付き不定詞による先行時間を明確に表し、εἶναιの存在の意味を過不足なく保持した。
- source_word: παρὰ σοί
  choice: あなたのもとで
  rationale: παρά＋与格が示す近接・臨在を簡潔に表した。前半のπαρὰ σεαυτῷとの対応も保っている。
- source_word: σύ, πάτερ
  choice: 父よ
  rationale: 呼びかけとして自然で荘重な日本語を用いた。明示されたσύの強調は「あなたご自身のもとで」によって文中でも表れている。
- source_word: κόσμον
  choice: 世界
  rationale: ヨハネ文書におけるκόσμοςの標準的で文脈に適した訳語であり、宇宙・被造秩序に限定する解釈を加えない。
theological_decisions:
- issue: 御子の先在
  choice: 世界が存在する前にイエスが父のもとで栄光を持っていたという時間関係をそのまま訳す。
  alternative: 先在を弱め、栄光が予定されていたという意味に解釈して訳す。
  rationale: 原文は、世界の存在以前にイエスが父のもとでその栄光を持っていたと述べる。翻訳ではこの主張を弱めず、同時に説明を付加しない。
- issue: 父と共有された「栄光」の性質
  choice: 「栄光」を保持し、その内容を本文中で限定しない。
  alternative: 「威光」または「誉れ」と具体化する。
  rationale: 本文はその栄光の性質をここで詳述していないため、ヨハネ的な語彙と神学的含意を開いたまま保つ。
- issue: τῇ δόξῃの統語的表現
  choice: 日本語では「あの栄光を…私に与えてください」と目的語構文に組み替える。
  alternative: 「あの栄光によって私に栄光を与えてください」と与格を形式的に再現する。
  rationale: 後者は日本語では不自然で、別の栄光を手段として用いるようにも読める。目的語構文は、指定された栄光を伴う栄化という原意を明瞭に伝える。
translation_notes:
  register: 明瞭な現代標準語を用い、祈りの呼びかけには簡潔で品位のある「父よ」を採用した。「あなたのもとで」を反復して原文の対応関係を保ちつつ、σεαυτῷは「ご自身」で明示した。英語監修層では脚注記号の位置と内容が対応していなかったため、日本語稿では該当句に正しく配置した。
