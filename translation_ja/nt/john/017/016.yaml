  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: ja
  text: 彼らは世に属していません[a]。私が世に属していないのと同じです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「世から」。ギリシア語の「から」（ἐκ）は、起源や由来のほか、帰属を表すこともあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: から出た
  rationale: 起源・由来を表す前置詞の方向性を保ちつつ、現代日本語として文意が通る形にした。ここでは物理的な移動だけでなく、由来や帰属を含み得る。
- source_word: κόσμου
  choice: 世
  rationale: ヨハネ文書で神に背く人間世界を指し得るが、本文では解釈を狭める「世の体制」などを避け、簡潔な「世」を保った。
- source_word: οὐκ εἰσὶν
  choice: 者ではありません
  rationale: 主語が人々であり、後続する由来の表現を自然な日本語にするため「出た者ではありません」とした。否定の現在的な断定を保っている。
- source_word: καθὼς
  choice: のと同じです
  rationale: 弟子たちとイエスとの対応関係を明確に示す、自然な現代日本語の比較表現。
- source_word: ἐγὼ
  choice: 私が
  rationale: 原文の明示的な一人称代名詞を残し、比較におけるイエスへの焦点を保った。
- source_word: οὐκ εἰμὶ
  choice: 者ではない
  rationale: 前半との対応と反復を保ちながら、日本語の従属節に自然な形で否定を表した。
- source_word: ἐκ τοῦ κόσμου
  choice: 世から出た者
  rationale: 二つの節で同じ訳語を反復し、原文の平行構造を保持した。「世に属する者」は帰属の意味を明確にするが、起源・由来の含みを弱めるため脚注に示した。
theological_decisions:
- issue: ヨハネ文書における「世」の意味
  choice: 本文では解釈的な言い換えを加えず「世」とする。
  alternative: 「神に背く世界」「この世の体制」
  rationale: κόσμοςには神から離れた人間世界という神学的含意があり得るが、この節だけで意味を限定せず、ヨハネ特有の幅と緊張を保つ。
- issue: ἐκが示す由来と帰属の関係
  choice: 「世から出た者」として由来の像を前面に残す。
  alternative: 「世に属する者」
  rationale: ἐκは起源・由来を直接表しつつ、文脈上は帰属や本質的な結びつきも含み得る。本文で一方に限定せず、帰属の読みを脚注で示す。
translation_notes:
  register: 明瞭で現代的な敬体を用い、祈りの文脈にふさわしい端正さを保った。原文の反復と比較構造を再現し、「世」の神学的意味は本文中で説明的に限定していない。
