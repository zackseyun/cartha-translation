source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: ja
  text: 永遠のいのちとは、唯一のまことの神であるあなたと、あなたがお遣わしになったメシアであるイエス[a]とを知ることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシアであるイエス」は、伝統的には「イエス・キリスト」。ギリシア語の「クリストス」は「メシア」という称号を意味するが、文脈によっては名前のようにも用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ
  choice: 永遠のいのちとは…ことです
  rationale: 説明を導く構文を、現代日本語で自然な定義表現として訳した。δέの連結性は文脈上保ちつつ、不自然な「そして」を加えなかった。
- source_word: ἵνα γινώσκωσι
  choice: 知ること
  rationale: ここでἵνα節は永遠のいのちの内容を示す。「知る」は単なる情報の把握に限定せず、継続的・人格的な認識を含み得る原文の幅を保つ。
- source_word: σὲ τὸν μόνον ἀληθινὸν θεὸν
  choice: 唯一のまことの神であるあなた
  rationale: σέへの同格句を明瞭に示し、μόνονとἀληθινόνの意味を簡潔かつ荘重な日本語で保持した。
- source_word: ὃν ἀπέστειλας
  choice: あなたがお遣わしになった
  rationale: 父に対するイエスの祈りという場面にふさわしい敬語を用い、派遣を表す単純過去の内容を自然に訳した。
- source_word: Ἰησοῦν Χριστόν
  choice: メシア、イエス
  rationale: Χριστόςの称号としての意味を「メシア」で示しつつ、日本語で人物を自然に特定できる同格表現とした。「イエス・キリスト」という慣用形も可能なため脚注に示した。
theological_decisions:
- issue: 「唯一のまことの神」とイエスとの関係
  choice: 父を「唯一のまことの神」と呼び、イエスを父がお遣わしになった方として区別する原文の構文をそのまま保つ。
  alternative: 後代の三位一体論または反三位一体論の結論を説明的に本文へ加える。
  rationale: この節そのものの表現と神学的緊張を保持し、他のヨハネ文書のキリスト論を本文に読み込んで明示的に調整しない。
- issue: Χριστόνの訳
  choice: メシア
  alternative: キリスト
  rationale: この語の称号としての意味を読者に伝えるため本文では「メシア」とし、慣用的・名前的な「キリスト」は脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、祈りの中で父に語りかける箇所には「お遣わしになった」という自然な敬語を採用した。「いのち」はヨハネ文書での神的な生命という含みと聖書語としての品位を保つため、ひらがな表記とした。脚注記号[a]は本文末に置き、語句全体に関わる異訳であることを示した。
