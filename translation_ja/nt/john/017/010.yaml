id: JHN.17.10
reference: John 17:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὰ ἐμὰ πάντα σά ἐστιν καὶ τὰ σὰ ἐμά, καὶ δεδόξασμαι ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/010.yaml
  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: ja
  text: わたしのものはすべてあなたのものであり、あなたのものはわたしのものです。そして、わたしは彼らのうちにあって[a]栄光を受けています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らを通して」または「彼らの間で」。ギリシア語は直訳すると「彼らのうちに」であり、文脈上、場所・領域、手段、または彼らにおける栄光の現れを表しえます。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: わたしのものはすべて
  rationale: 中性複数の所有形容詞と πᾶς の組み合わせを、物質的な「物」に狭めず、イエスに属するすべてを包括する自然な日本語とした。
- source_word: σά
  choice: あなたのもの
  rationale: 所有を表す形容詞の述語的用法を簡潔に表し、父への呼びかけに対応させた。
- source_word: τὰ σὰ ἐμά
  choice: あなたのものはわたしのものです
  rationale: 前半との対称性を保ち、相互の所有関係を弱めずに明瞭な日本語とした。
- source_word: δεδόξασμαι
  choice: 栄光を受けました
  rationale: 完了受動形を、すでに栄光を受け、その結果が及んでいることを示しうる日本語で訳した。「栄光を現しました」と能動に変えることは避けた。
- source_word: ἐν αὐτοῖς
  choice: 彼らのうちに
  rationale: ἐν の基本的な表現を保ち、文脈上の指示対象を父から与えられた人々として「彼ら」とした。手段・場所・顕現の含みは本文で一つに限定せず、脚注に示した。
theological_decisions:
- issue: 御子と父との相互的な所有
  choice: 「わたしのものはすべてあなたのもの」「あなたのものはわたしのもの」と相互の所有をそのまま訳す。
  alternative: 単なる働き上の協力関係として弱めて表現する。
  rationale: ギリシア語は相互の所有を明言しているため、その強さを保った。一方、本文にない後代の教理用語は加えていない。
- issue: ἐν αὐτοῖς の意味と指示対象
  choice: 本文では「彼らのうちに」とし、ἐν の曖昧さを残す。
  alternative: 「彼らを通して」と手段に限定する、または「彼らの間で」と場所・関係に限定する。
  rationale: ἐν はこの文脈で場所、手段、または彼らにおける栄光の現れを示しうるため、本文では解釈を一つに固定せず、他の可能性を脚注に残した。
translation_notes:
  register: 現代の一般読者に明瞭でありつつ、祈りの言葉にふさわしい端正な敬体とした。相互に対応する二つの節の形を保ち、所有関係を自然かつ簡潔に表現した。脚注記号は、その説明対象である「彼らのうちに」の直後に置いた。
