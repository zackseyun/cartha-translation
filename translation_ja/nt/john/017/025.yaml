id: JHN.17.25
reference: John 17:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: ja
  text: 正しい父よ、世[a]はあなたを知りませんが、私はあなたを知っています。そして、この人たちはあなたが私を遣わされたことを知っています。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「世」は、被造世界だけでなく、神を知らず神から離れている人間世界を指しうる。
    reason: ヨハネに特徴的な κόσμος の意味の広がりを示し、本文では解釈を限定しないため。
  - marker: b
    text: 「知らない」「知る」に当たる三つの動詞は、ギリシア語ではいずれもアオリスト形である。「知らなかった／知っていた／知った」とも訳しうるが、本文は祈りの時点にも及ぶ状態として訳した。
    reason: 原文の時制・相の形を開示し、日本語本文で現在形を選んだ理由と別訳の可能性を示すため。
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: 正しい父よ
  rationale: 呼格による直接の呼びかけ。「正しい」は、δίκαιος が表す道徳的・関係的な正しさを保ちつつ、現代日本語で自然に理解できる。
- source_word: καὶ … ἐγὼ δέ
  choice: …が、私は…
  rationale: 最初の καί と、それに続く対照の δέ が作る譲歩・対比関係を、日本語として自然な「…が、私は…」で表した。単なる並列に固定せず、文脈上の対照を明確にした。
- source_word: ὁ κόσμος
  choice: 世
  rationale: ヨハネ文書で重層的な意味を持つ κόσμος を、解釈的に「世の人々」などへ限定せず、聖書日本語として定着しつつ簡潔な「世」で表した。
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: 知りません／知っています／知っています
  rationale: いずれもアオリスト形だが、ここでの「知る」は継続的な関係と現在に及ぶ認識を表す。日本語の自然さと文脈上の現在的意義を保つため、状態を表す現在形で訳した。
- source_word: οὗτοι
  choice: この人たち
  rationale: 指示代名詞の指示性を保ちながら、日本語で「これら」とする不自然さを避けた。「弟子たち」とは明示せず、原文以上に対象を限定しない。
- source_word: σύ με ἀπέστειλας
  choice: あなたが私を遣わされた
  rationale: σύ の強調を主語「あなたが」で示し、ἀποστέλλω はヨハネにおける派遣の含意を保つ「遣わす」とした。父への敬意を日本語の尊敬表現で自然に示した。
theological_decisions:
- issue: δίκαιε が表す父の属性
  choice: 正しい父
  alternative: 義なる父／公正な父
  rationale: 「義なる」は荘重だが現代の日常語から遠く、「公正な」は司法的公平に狭まりやすい。「正しい」は道徳的・関係的な広がりを保つ。
- issue: ヨハネにおける κόσμος の意味
  choice: 世
  alternative: 世の人々／この世の体制
  rationale: 神から離れた人類という含意はあるが、語の幅と神学的緊張を本文で一義的に解消しない。
- issue: γινώσκω のアオリスト三形の時制・相
  choice: 日本語では現在に及ぶ状態として訳す
  alternative: 「知らなかった／知っていた／知った」と過去形で統一する
  rationale: 原文のアオリスト性は注で示しつつ、過去形によって現在は状況が変化したとの誤解を生じさせない。祈りの時点で有効な関係的認識を自然な日本語で表す。
- issue: καί と δέ の談話関係
  choice: 譲歩を含む対比として「…が、私は…」
  alternative: 「そして世は…しかし私は…」
  rationale: 原文の接続詞を一語ずつ機械的に対応させず、世界の無知とイエスの認識との対照を明瞭にする一方、「にもかかわらず」ほど強く解釈しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、祈りにふさわしい品位を保った。「父よ」「遣わされた」は敬意を示すが、古語的・過度に典礼的な表現は避けた。
