review_pass:
  verdict: revise
  source_fidelity: 原文の位置関係と、ἔκειτο（体がその場所に横たわっていた／置かれていた状態）はおおむね捉えている。ただし「横たえられていた所の頭の側」は日本語として係り方が不自然で、原文が示す「体の頭の側・足の側」という位置関係をやや読みにくくしている。
  naturalness: 「そして見ると」は主語省略の文脈では可能だが、節の冒頭ではやや唐突である。「彼女が見ると」として主語を補い、「場所の頭の方／足の方」とするほうが、明瞭な現代標準日本語になる。
  terminology: ἀγγέλους はこの文脈では「天使」が最も明瞭で標準的である。「御使い」も聖書的用例として誤りではないが、対象方針の明瞭な現代標準日本語では「天使」が適切である。「イエスの体」は維持する。
  issues:
  - severity: medium
    issue: 位置句の日本語が不自然で分かりにくい。
    rationale: 「イエスの体が横たえられていた所の頭の側に」は、「所」に頭があるかのようにも読める。原文のπρὸς τῇ κεφαλῇ／πρὸς τοῖς ποσίνは、体の頭側・足側に対応する位置を示すため、「場所の頭の方に／足の方に」と明示するのが自然である。
  - severity: low
    issue: 「御使い」はやや伝統的な教会語である。
    rationale: 原文の文脈上の指示対象は天的存在であり、「天使」は意味を保ちつつ、より広く通じる現代標準語である。
  - severity: low
    issue: 脚注の対案が本文の不自然な「横たえられていた所」を前提としている。
    rationale: ἔκειτοは横たわっている状態を表す。本文を自然な「横たわっていた場所」に改め、脚注では「置かれていた」という可能な状態表現を示す。
  revised_text: そして、彼女が見ると、白い衣をまとった二人の天使が座っていた。一人はイエスの体が横たわっていた[a]場所の頭の方に、もう一人は足の方にいた。
