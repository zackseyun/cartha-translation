- from: そして見ると、白い衣をまとった二人の御使いが座っていた。一人は、イエスの体が横たえられていた所の頭の側に、もう一人は足の側にいた。[a]
  to: そして、彼女が見ると、白い衣をまとった二人の天使が座っていた。一人はイエスの体が横たわっていた[a]場所の頭の方に、もう一人は足の方にいた。
  rationale: 原文の「二人の天使が白い装いで座っている」という描写、および頭側と足側の対照を保ちながら、日本語の係り受けを明瞭にした。「横たわっていた」はἔκειτοの状態的意味を過度に受動化せずに表す。脚注は未完了過去の語彙的・文脈的な含みを説明するにとどめ、時制を文法的に一義化しない。
