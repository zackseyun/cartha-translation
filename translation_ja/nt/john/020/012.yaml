id: JHN.20.12
reference: John 20:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: ja
  text: そして、彼女が見ると、白い衣をまとった二人の天使が座っていた。一人はイエスの体が横たわっていた[a]場所の頭の方に、もう一人は足の方にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「置かれていた」とも訳せる。ギリシア語の未完了過去は、イエスの体がその場所に横たわっていた継続した状態を表す。文脈上、その体は見ている時点にはすでにそこになかったことが示されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: 見ると
  rationale: 歴史的現在による場面の生き生きした展開を、現代日本語の自然な物語表現で示す。主語のマリアは文脈上明らかなため、ここでは明示しない。
- source_word: ἀγγέλους
  choice: 御使い
  rationale: 空の墓と白い装いという文脈では天的存在を指す。「使者」よりも文脈に適合し、聖書本文として自然である。
- source_word: ἐν λευκοῖς
  choice: 白い衣をまとった
  rationale: 直訳は「白いものの中に」だが、衣服を指す省略表現であるため、日本語では意味を自然に明示する。
- source_word: καθεζομένους
  choice: 座っていた
  rationale: 二人の姿勢を表す分詞。日本語では主節と一体化して自然に描写する。
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: 一人は…頭の側に、もう一人は足の側に
  rationale: πρός＋与格の近接・位置関係を「側に」で表し、遺体が置かれていた場所の両端を示す。
- source_word: ἔκειτο
  choice: 横たえられていた
  rationale: κεῖμαι は横たわっている状態を表し、受動的な結果状態の含みもある。墓に納められた体について、日本語で自然かつ文脈に即して表現する。時制は観察時点より前の状態として読めるが、ギリシア語の未完了過去自体は単純に当時の状態を描くこともできるため注記する。
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: イエスの体
  rationale: 「体」は標準的で敬意ある訳語であり、「遺体」ほど解釈を強く限定しない。
theological_decisions:
- issue: ἀγγέλους が指す存在
  choice: 天的存在として「御使い」
  alternative: 人間の「使者」
  rationale: 語自体には「使者」の意味もあるが、復活の墓と白い装いという直接の文脈が天的存在を示す。
- issue: ἔκειτο の時間的・状態的な意味
  choice: 以前そこにあった状態を「横たえられていた」と表現
  alternative: 「横たわっていた」または「置かれていた」
  rationale: 観察時には体がないという文脈を反映しつつ、未完了過去が表す継続状態を保つ。「横たえられていた」は墓に納められた結果状態を自然に示すが、能動・受動を過度に教理化しない。
translation_notes:
  register: 明瞭で現代的だが、聖書本文にふさわしい品位を保った。「御使い」は一般語の「天使」よりやや聖書的な語感を持つが、現代の読者にも理解できる。原文の一文を日本語では二文に分け、位置関係を読み取りやすくした。
