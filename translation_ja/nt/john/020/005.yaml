  text: καὶ παρακύψας βλέπει κείμενα τὰ ὀθόνια, οὐ μέντοι εἰσῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/005.yaml
  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: ja
  text: そして身をかがめて中をのぞくと、亜麻布が置かれているのが見えた。しかし、中には入らなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακύψας
  choice: 身をかがめて中をのぞくと
  rationale: 墓の入口で体をかがめ、内側を見る動作を一体として自然な現代日本語で表した。アオリスト分詞の先行・付帯状況は「と」で主動詞につないだ。
- source_word: βλέπει
  choice: 見えた
  rationale: ギリシア語は物語を生き生きと描く歴史的現在だが、日本語では過去の叙述に現在形を置くと不自然になりやすいため、自然な物語時制で訳した。主体が意図的に観察したことより、目に入った光景を表す。
- source_word: κείμενα
  choice: 置かれている
  rationale: κεῖμαιが示す、そこに横たわる・置かれた状態を表した。受動の出来事を強調せず、目に見える静的な配置を伝える表現である。
- source_word: τὰ ὀθόνια
  choice: 亜麻布
  rationale: ὀθόνιαを素材に即して簡潔に訳した。埋葬用であることは文脈から分かるため、「埋葬布」などの説明は本文に加えなかった。
- source_word: οὐ μέντοι
  choice: しかし
  rationale: 布を目にしたことと、墓内には入らなかったこととの穏やかな対比を、標準的で品位ある接続語で表した。
- source_word: εἰσῆλθεν
  choice: 中には入らなかった
  rationale: 墓の内部へ入る動作を自然な日本語で示し、「は」によって、のぞいて見たが入らなかったという対照も表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書叙述にふさわしい落ち着いた文体とした。ギリシア語の歴史的現在は、日本語として自然な過去時制に調整した。原文の語順どおりに分詞を「亜麻布」に密着させる訳も可能だが、日本語本文では意味が明瞭になるため注記を要しない。
