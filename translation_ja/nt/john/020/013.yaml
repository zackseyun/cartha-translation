id: JHN.20.13
reference: John 20:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: ja
  text: すると、彼らは彼女に言った。「婦人よ、なぜ泣いているのですか。[a]」彼女は彼らに言った。「人々が私の主[b]を取り去りました。そして、どこに置いたのか、私には分かりません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「何を泣いているのですか」。ここでは、泣いている理由を尋ねる表現。
    reason: lexical_alternative
  - marker: b
    text: 「私の先生」または「私の主人」とも訳せる。ギリシア語のキュリオスは敬称としても用いられるが、本訳では通常「主」と訳す。
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: 婦人よ
  rationale: 呼格として丁寧な呼びかけであり、無礼な響きを避けつつ、原文の直接的な表現を保つ。
- source_word: τί κλαίεις
  choice: なぜ泣いているのですか
  rationale: τίは字義的には「何」だが、この構文では理由を尋ねる慣用的な問いである。現在形の継続的な動作も自然な日本語で表した。
- source_word: Ἦραν
  choice: だれかが…取り去りました
  rationale: ギリシア語は三人称複数で、ここでは行為者が特定されていない。日本語では不特定の複数主体を「だれかが」とするのが自然で、「取り去る」によって墓から移された意味を保つ。
- source_word: τὸν κύριόν μου
  choice: 私の主
  rationale: κύριοςの敬称としての意味とキリスト論的な響きの双方を残し、どちらか一方に限定しない。
- source_word: οὐκ οἶδα
  choice: 私には分かりません
  rationale: οἶδαは現在の認識状態を表すため、現代日本語として自然な「分かりません」とした。
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: どこに置いたのか
  rationale: τίθημιの基本的な意味を簡潔に表し、置かれた場所が分からないという現在に続く結果を自然な日本語で示す。
- source_word: ἐκεῖνοι
  choice: 彼ら
  rationale: 直前に登場する二人を受ける指示代名詞であり、日本語では「彼ら」が明瞭で自然である。
theological_decisions:
- issue: マリアの発言におけるκύριοςの訳語
  choice: 私の主
  alternative: 私の先生／私の主人
  rationale: 文脈上は敬愛する師への呼称としても理解できる一方、ヨハネ福音書における「主」の神学的な響きもあるため、「主」として両義性を保った。
- issue: Γύναιの語調
  choice: 婦人よ
  alternative: 女の方よ／あなた
  rationale: 原語は丁寧な呼びかけであり、冷淡または無礼ではない。「婦人よ」は荘重さと直接性を保ち、原文にない親愛の情を付け加えない。
- issue: Ἦρανの不特定の複数主語
  choice: だれかが
  alternative: 彼らが
  rationale: 原文は三人称複数だが、マリアは行為者を特定していない。不特定複数を自然な日本語で表しつつ、単独犯だと断定する意図ではない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい品位を保った。会話では丁寧語を用い、Γύναιの敬意を示した。
