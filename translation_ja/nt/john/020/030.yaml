  text: Πολλὰ μὲν οὖν καὶ ἄλλα σημεῖα ἐποίησεν ὁ Ἰησοῦς ἐνώπιον τῶν ⸀μαθητῶν, ἃ οὐκ ἔστιν γεγραμμένα ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: ja
  text: イエスは弟子たちの前で、このほかにも多くのしるし[a]を行った。それらはこの書には記されていない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「奇跡」。ギリシア語は「しるし」で、イエスが誰であるかを指し示す行為であることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: このほかにも多くの
  rationale: 「多くの、さらに別の」という意味を自然な日本語で表した。οὖνの文脈を受ける働きと、31節へ続くμένの対照は、独立した接続語を補わず「が」による文の展開の中で示した。
- source_word: σημεῖα
  choice: しるし
  rationale: ヨハネ福音書では、イエスが誰であるかを指し示す奇跡的な行為を表す重要語であるため、単なる力ある業という印象に限定される「奇跡」ではなく「しるし」とした。
- source_word: ἐποίησεν
  choice: 行われた
  rationale: しるしを「行う」という自然な日本語を用いた。主語イエスへの敬意を表す一般的な聖書文体として尊敬表現を用いているが、神学的意味は付加していない。
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: 弟子たちの前で
  rationale: 弟子たちが目撃者として居合わせたことを、簡潔で自然な現代日本語で表した。原文に所有代名詞がないため「ご自分の弟子たち」とはしなかった。
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: それらは……記されていない
  rationale: 完了受動分詞を伴う迂言形が示す、書かれていない状態を保ち、「記録されなかった」ではなく現在にも関わる「記されていない」とした。
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: この書には
  rationale: 福音書という文書を指すβιβλίονを、現代語として明瞭でありながら格調も保つ「書」と訳した。
theological_decisions:
- issue: ヨハネ福音書におけるσημεῖα
  choice: 「しるし」と訳す
  alternative: 「奇跡」と訳す
  rationale: イエスの業がその身元と使命を指し示すというヨハネ特有の含意を保ち、単なる超自然的な力の現れへ意味を狭めないため。
- issue: μέν...δέの対照関係
  choice: 30節末を「が」とし、31節へ続く対照を開いたままにする
  alternative: 30節を独立した断定文として閉じる
  rationale: μένは31節のδέと対応し、「多くのしるしは記されていないが、これらは記された」という対照を形成するため、その未完の論理関係を日本語でも保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書本文にふさわしい簡潔で品位ある文体とした。「この書」は「この本」よりやや格調があるが、一般読者にも十分理解できる。
