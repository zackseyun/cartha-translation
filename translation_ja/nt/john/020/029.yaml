id: JHN.20.29
reference: John 20:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: ja
  text: イエスは彼に言われた。「あなたはわたしを見たので、信じたのですか。[a] 見ないで信じた人たちは幸いです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「あなたはわたしを見たので、信じたのです。」ギリシア語は疑問文とも平叙文とも読める。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: イエスは彼に言われた
  rationale: λέγει は物語現在だが、日本語の自然な物語の流れに合わせて過去形とした。αὐτῷ（彼に）も明示し、イエスの発言には現代日本語として自然な敬意表現を用いた。
- source_word: Ὅτι ἑώρακάς με
  choice: あなたはわたしを見たので
  rationale: ὅτι を理由を示す「ので」と解し、ἑώρακάς の完了形が示す、見たという出来事と現在の信仰とのつながりを文脈上自然に表した。
- source_word: πεπίστευκας
  choice: 信じたのですか
  rationale: 完了形の結果的な意味を文脈に即して自然な日本語で表し、疑問文として訳した。
- source_word: μακάριοι
  choice: 幸いです
  rationale: 単なる主観的な幸福感ではなく、神の前で恵まれた状態を告げる祝福の言葉として、定着した「幸い」を用いた。
- source_word: οἱ μὴ ἰδόντες καὶ πιστεύσαντες
  choice: 見ないで信じた人たち
  rationale: 二つの分詞の関係を簡潔で自然な日本語にした。καί に明示されない「それでも」「のに」は本文に加えず、見ることなしに信じたという対照は「見ないで」で表した。
theological_decisions:
- issue: イエスの最初の文を疑問文とするか、平叙文とするか
  choice: 「あなたはわたしを見たので、信じたのですか」と疑問文にした。
  alternative: 「あなたはわたしを見たので、信じたのです」と平叙文にする。
  rationale: ギリシア語本文そのものには現代的な句読法がなく、疑問文と平叙文の両方が可能である。本文では文脈上自然な修辞疑問として訳し、別の読みを脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの言葉にふさわしい簡潔さと品位を保った。「見ないで信じた」として、原文に明示されない逆接語を加えず、見ることと信じることの対照を自然に示した。
