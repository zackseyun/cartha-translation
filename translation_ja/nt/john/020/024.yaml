  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: ja
  text: 十二人の一人で、ディディモ[a]と呼ばれるトマスは、イエスが来られた時、彼らと一緒にいなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ディディモ」はギリシア語で「双子」という意味。
    reason: 呼び名として音写したギリシア語の語義を示すため。
lexical_decisions:
- source_word: δὲ
  choice: （訳出しない）
  rationale: ここでは強い逆接ではなく、話題をトマスへ移す穏やかな談話標識である。日本語では文脈と主題提示の「トマスは」によって自然に表せるため、接続語を補わない。
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: 十二人の一人
  rationale: イエスが選んだ「十二人」という既知の集団に属することを、簡潔で自然な日本語で示す。
- source_word: ὁ λεγόμενος Δίδυμος
  choice: ディディモと呼ばれる
  rationale: Δίδυμοςはここでトマスの呼び名として用いられているため本文では音写し、その語義「双子」は脚注で明示する。これにより固有の呼称とその意味の双方を保つ。
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: 彼らと一緒にいなかった
  rationale: 未完了過去とμετά＋属格が示す、その時点でトマスが一同と共にいなかった状態を直接表す。
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: イエスが来られた時
  rationale: ἔρχομαιを基本義どおり「来る」とし、主語イエスに対する自然で品位ある敬意を「来られた」で表す。
theological_decisions:
- issue: Δίδυμοςの扱い
  choice: 本文では「ディディモ」と音写し、脚注で「双子」の意を示す。
  alternative: 本文で「双子と呼ばれる」と訳す。
  rationale: この語は意味を持つ一方、構文上はトマスの別名・呼び名として提示されている。本文で呼称を保ち、脚注で語義を示すことで、固有名的機能と読者への意味の透明性を両立させる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、「十二人」「彼らと一緒にいなかった」という平易な表現で原文の構造と意味を保った。δὲには不必要に強い逆接を加えず、自然な日本語の話題提示に委ねた。
