  to: さて、その日、すなわち週の初めの日の夕方になったとき、弟子たちがユダヤ人たち[a]を恐れていたため、彼らのいた所の戸には鍵がかけられていた。そこへイエスが来て、彼らの真ん中に立ち、「あなたがたに平安がありますように[b]」と言われた。
