id: JHN.20.19
reference: John 20:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: ja
  text: さて、その日、すなわち週の初めの日の夕方になったとき、弟子たちがユダヤ人たち[a]を恐れていたため、彼らのいた所の戸には鍵がかけられていた。そこへイエスが来て、彼らの真ん中に立ち、「あなたがたに平安がありますように[b]」と言われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈により、「ユダヤ人の指導者たち」または「ユダヤの人々」とも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「平安があなたがたと共にあるように」とも訳せる。ギリシア語では直訳すると「あなたがたに平安」となる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης οὖν ὀψίας
  choice: さて、……夕方
  rationale: 属格独立構文による時の設定を自然な日本語にし、οὖνの穏やかな物語上のつながりを「さて」で示した。
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: その日、すなわち週の初めの日
  rationale: 二つの時の表現が同じ日を指すことを「すなわち」で明確にし、慣用表現を現代の読者に分かる形で訳した。
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: 戸に鍵がかけられていた
  rationale: 完了受動分詞が表す、すでに閉ざされてその状態にあることを示す。恐れという文脈から、単に閉じていた以上の防備の意味を「鍵がかけられていた」で表した。
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: 弟子たちがいた所
  rationale: 原文が明示する所在だけを訳し、「集まっていた」「滞在していた」などの補足は加えなかった。
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: ユダヤ人たちを恐れて
  rationale: διάと対格による原因を自然な日本語で表した。Ἰουδαίωνは本文では語義を狭めず「ユダヤ人たち」とした。
- source_word: ἔστη εἰς τὸ μέσον
  choice: 彼らの真ん中に立ち
  rationale: イエスが弟子たちの間の中央に立ったという具体的な空間表現を保った。
- source_word: λέγει αὐτοῖς
  choice: 言われた
  rationale: 歴史的現在を日本語の物語として自然な過去形にし、イエスへの通常の敬意を表す尊敬語を用いた。
- source_word: Εἰρήνη ὑμῖν
  choice: あなたがたに平安があるように
  rationale: 直訳的な意味を保ちながら、祝福と挨拶の響きが伝わる自然で格調ある表現とした。
theological_decisions:
- issue: ヨハネ福音書における τῶν Ἰουδαίων の指示対象
  choice: 本文では「ユダヤ人たち」とし、脚注で文脈上の別解を示す。
  alternative: 「ユダヤ人の指導者たち」または「ユダヤ地方の人々」
  rationale: 原語自体は指導者に限定していないため、本文で範囲を狭めない。一方、エルサレムで敵対する当局者を特に指す可能性や、地域的呼称である可能性を脚注に残し、民族全体への一般化を避ける。
- issue: Εἰρήνη ὑμῖν の性格
  choice: 「あなたがたに平安があるように」と訳す。
  alternative: 「平安があなたがたと共にあるように」または挨拶としての「平安あれ」
  rationale: 単なる日常の挨拶とも、復活したイエスによる平安の宣言・祝福とも読める表現であるため、その両方の響きを保つ言い方を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、復活後の顕現場面にふさわしい落ち着きと品位を保った。「そこへ」により、閉ざされた場所にイエスが現れた物語の流れを自然につないだ。
