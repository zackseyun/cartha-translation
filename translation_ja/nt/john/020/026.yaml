source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: ja
  text: 八日後、弟子たちは再び屋内にいて、トマスも彼らと一緒にいた。戸が閉じられていたのに、イエスは来て中央に立ち、「あなたがたに平安があるように」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: 八日後
  rationale: 字義どおりには「八日の後」。当時の包括的な日数の数え方では翌週の同じ日に当たり得るが、本文の表現を簡潔に保った。
- source_word: ἔσω
  choice: 家の中に
  rationale: 語自体は「中に」だが、文脈上は弟子たちが集まっていた屋内を指すため、自然な日本語として「家の中に」とした。
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: 戸には鍵がかけられていたが
  rationale: 完了受動分詞の結果状態を表し、閉鎖されていた戸にもかかわらずイエスが来たという譲歩的な関係を自然に示した。「戸」は複数形だが、日本語では集合的単数が自然。
- source_word: ἔρχεται
  choice: 来て
  rationale: ギリシア語は歴史的現在「来る」だが、日本語の物語では時制を機械的に現在形にすると不自然なため、出来事の鮮明さを保ちつつ連用形で訳した。
- source_word: εἰς τὸ μέσον
  choice: 真ん中に
  rationale: 弟子たちの集まりの中央を指す自然で明確な表現。
- source_word: Εἰρήνη ὑμῖν
  choice: あなたがたに平安があるように
  rationale: 通常の挨拶であると同時に、この文脈で響く「平安」の意味を保つため、単なる「こんにちは」には置き換えなかった。
theological_decisions:
- issue: 閉ざされた戸とイエスの到来との関係
  choice: 「戸には鍵がかけられていたが、イエスが来て」と訳し、対照だけを示す
  alternative: イエスが戸を通り抜けた、または超自然的に室内へ現れたと明示する
  rationale: 本文は戸が閉ざされていたこととイエスの到来を並べるが、その具体的方法は説明していないため、解釈を本文へ加えない。
- issue: 「平安」の発言の機能
  choice: 祝福・挨拶の両方に開かれた表現を保つ
  alternative: 単なる日常挨拶、または救済論的宣言のどちらかに限定する
  rationale: εἰρήνη ὑμῖν は慣用的挨拶でありつつ、復活後の文脈ではより深い含意も持ち得るため、その緊張を保存した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、復活顕現の記事にふさわしい落ち着いた格調を保った。「おられた／来られた」のような過度の敬語化は避け、イエスの発言のみ丁寧な引用形ではなく聖書的に自然な叙述とした。
