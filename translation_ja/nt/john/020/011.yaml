lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前に弟子たちが帰ったことを受け、場面をマリアへ移す穏やかな対比を表す。
- source_word: εἱστήκει
  choice: 立っていた
  rationale: 完了過去形が示す継続した状態を、自然な日本語で表した。
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: 墓の外に
  rationale: 墓の内部との空間的な対照を簡潔かつ自然に示す。
- source_word: κλαίουσα / ἔκλαιεν
  choice: 泣いていた／泣きながら
  rationale: 繰り返される語と動作の継続性を保ちつつ、日本語として冗長にならないよう整えた。
- source_word: παρέκυψεν
  choice: 身をかがめて……のぞき込んだ
  rationale: 中を見るために身をかがめるという動作を明示し、墓の内部へ視線を向ける意味を表した。
- source_word: εἰς τὸ μνημεῖον
  choice: 墓の中を
  rationale: εἰςが示す内部への方向を、「のぞき込む」と自然に結び付けた。
