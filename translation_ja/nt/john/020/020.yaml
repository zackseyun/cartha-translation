id: JHN.20.20
reference: John 20:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: ja
  text: こう言ってから、イエスは弟子たちにご自分の両手と脇腹をお見せになった。弟子たちは主を見て喜んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: こう言ってから
  rationale: アオリスト分詞が主動詞に先立つ行為を表すため、自然な現代日本語で時間的順序を示した。
- source_word: ἔδειξεν
  choice: お見せになった
  rationale: 「見えるように示す」という基本義を保ち、イエスを主語とする文脈にふさわしい自然な敬語表現とした。
- source_word: τὰς χεῖρας
  choice: ご自分の両手
  rationale: ギリシア語には所有代名詞がないが、身体部位を示す日本語として所有関係を明示するのが自然である。複数形も「両手」で表した。
- source_word: τὴν πλευράν
  choice: 脇腹
  rationale: πλευράは身体の「脇腹、横腹」を指す。19:34の傷を想起させつつ、本文にない「傷」は補わなかった。
- source_word: αὐτοῖς
  choice: 弟子たちに
  rationale: 間接目的語を文脈上の指示対象で明示し、日本語として分かりやすくした。
- source_word: ἐχάρησαν
  choice: 喜んだ
  rationale: χαίρωの意味を明快で自然な現代日本語で表す。「大いに喜んだ」ほどの強意は原文に加えなかった。
- source_word: οὖν
  choice: （文脈上の結果として語順で表現）
  rationale: οὖνの結果・展開の働きは、直前の提示に続けて「弟子たちは…喜んだ」と述べる日本語の流れで十分に伝わるため、機械的な「そこで」は置かなかった。
- source_word: οἱ μαθηταί
  choice: 弟子たち
  rationale: 福音書におけるμαθητήςの標準的で定着した訳語を用いた。
- source_word: ἰδόντες
  choice: 主を見て
  rationale: 喜びの契機を示すアオリスト分詞を、簡潔な接続助詞「て」で自然に表した。
- source_word: τὸν κύριον
  choice: 主
  rationale: 復活したイエスに対するヨハネ文書の称号としての重みを保つ標準的な訳語である。
theological_decisions:
- issue: κύριοςの訳し方
  choice: 主
  alternative: 先生／主人
  rationale: 復活顕現の文脈では単なる敬称や主人を意味する以上に、イエスを指す称号として機能しているため「主」とした。
- issue: 手と脇腹が示すものの明示
  choice: 「傷」を補わず「両手と脇腹」と訳す
  alternative: 傷のある両手と脇腹
  rationale: 文脈上は十字架の傷が想起されるが、この節のギリシア語本文は傷を明記していないため、含意を説明的に本文へ加えなかった。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「イエス」はギリシア語の省略主語を文脈に基づいて補い、誰が両手と脇腹を見せたかを明確にした。敬語は過度に重ねず、「お見せになった」に限定した。
