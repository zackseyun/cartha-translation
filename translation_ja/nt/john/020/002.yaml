id: JHN.20.2
reference: John 20:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: ja
  text: そこで、彼女は走ってシモン・ペトロと、イエスが愛しておられたもう一人の弟子[a]のところへ行き、二人に言った。「主を墓から取り去りました。どこに置いたのか、私たちには分かりません[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「愛しておられた」に当たるギリシア語の動詞はフィレオーで、親愛の情を表すことがある。「親しく思っておられた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「私たちには分かりません」は、ギリシア語の一人称複数形をそのまま訳したもの。マリアがほかの女性たちを含めていると理解することもできるが、ここで本文はその複数形を説明していない。
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει οὖν καὶ ἔρχεται
  choice: そこで、彼女は走って……のところへ行き
  rationale: οὖνの前文からの帰結を「そこで」で示した。歴史的現在は、現代日本語の自然な物語叙述に合わせて過去の出来事として訳しつつ、二つの動作を連続させて切迫感を保った。
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: シモン・ペトロと……もう一人の弟子のところへ
  rationale: πρόςの移動先を自然な日本語の「のところへ」で表し、ἄλλονの対比を「もう一人の」によって明示した。
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: イエスが愛しておられた
  rationale: φιλέωの愛情を「愛していた」で表し、イエスへの敬意を自然に示す補助動詞「おられた」を用いた。未完了過去の継続的背景もこの表現に反映される。
- source_word: λέγει αὐτοῖς
  choice: 二人に言った
  rationale: 代名詞の指示対象を日本語で明瞭にするため「二人」とした。歴史的現在は物語として自然な過去形にした。
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: 主を墓から取り去りました
  rationale: κύριοςはイエスへの称号として「主」、μνημεῖονは文脈上の埋葬墓として「墓」とした。ギリシア語で明示されない行為者を補わず、日本語でも主語を省略して曖昧さを保った。
- source_word: οὐκ οἴδαμεν
  choice: 私たちには分かりません
  rationale: 一人称複数形をそのまま「私たち」とし、マリア一人の発言に合わせて単数化しなかった。
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: どこに置いたのか
  rationale: τίθημιの基本的な配置の意味を自然な「置いた」で表した。行為者は原文同様に特定しない。
theological_decisions:
- issue: イエスを指すκύριοςの訳語
  choice: 主
  alternative: 主人／先生
  rationale: 復活物語の文脈で弟子がイエスを指して用いる敬称・称号であり、意味を狭めず標準的なキリスト論的呼称「主」とした。
- issue: οἴδαμενの一人称複数
  choice: 私たちには分かりません
  alternative: 私には分かりません
  rationale: 本文が明示する複数形を保持し、ほかの女性たちを含むのかなど、本文が説明していない点を訳文で解決しない。
- issue: Ἦρανおよびἔθηκανの行為者
  choice: 主語を補わない
  alternative: だれかが／人々が
  rationale: 動詞は三人称複数だが、行為者は特定されていない。日本語の主語省略を用いることで、不特定の行為者という原文の曖昧さを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。会話部分は丁寧体とし、マリアの切迫した報告として自然に読めるようにした。原文で特定されない行為者や説明されない一人称複数を補足・調整せず、脚注で必要な情報だけを示した。
