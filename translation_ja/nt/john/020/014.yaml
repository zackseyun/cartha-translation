source:
  edition: SBLGNT
  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: ja
  text: こう言ってから、彼女は振り向き、イエスが立っておられるのを見た。しかし、その方がイエスだとは分からなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その方がイエスだと気づかなかった」。ギリシア語は直訳すると「その方がイエスであるとは知らなかった」で、その人物の正体を認識していなかったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰποῦσα
  choice: こう言ってから
  rationale: 複数指示詞を日本語では直前の発言全体を受ける自然な「こう」で表し、アオリスト分詞の先行動作を「言ってから」で明示した。
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: 振り向き
  rationale: 背後の方へ向きを変えるというギリシア語の慣用的な動作を、簡潔で自然な現代日本語で表した。
- source_word: θεωρεῖ
  choice: 見た
  rationale: 歴史的現在を日本語の物語叙述に自然な過去形で訳した。文脈上、実際に目にしたことを示しつつ、直ちに認識したとは含意しない。
- source_word: τὸν Ἰησοῦν ἑστῶτα
  choice: イエスが立っておられるのを
  rationale: 対格名詞と分詞の構文を日本語の知覚構文で表した。「おられる」はイエスへの敬意を保つ自然な表現であり、立っている状態を伝える。
- source_word: οὐκ ᾔδει
  choice: 分からなかった
  rationale: οἶδαの知識・認知の意味を保ちつつ、日本語で人の正体が判明していないことを自然に表す。「見分けられなかった」ほど原因や能力を限定しない。
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: それがイエスだとは
  rationale: 目の前に立つ人物の正体についての内容節として訳した。ギリシア語の現在形は、間接的な叙述でも同一性を端的に示すため、日本語では「だ」とした。
theological_decisions:
- issue: 復活したイエスの同一性をマリアが把握していなかったこと
  choice: それがイエスだとは分からなかった
  alternative: イエスだと見分けられなかった
  rationale: 本文はマリアがその人物の正体を知らなかったことを述べるが、その原因までは説明しない。「分からなかった」はこの叙述上の緊張を保ち、視覚的な識別不能などの説明を付加しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語として自然な流れと品位を両立させた。敬語はイエスの動作を述べる「立っておられる」に限定し、過度に古風な表現は避けた。
