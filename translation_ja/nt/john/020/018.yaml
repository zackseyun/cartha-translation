  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: ja
  text: マグダラのマリアは弟子たちのところに来て、「私は主を見ました。また、主が私にこれらのことを語られました」と知らせた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳：「マグダラのマリアは弟子たちのところに来て、『私は主を見ました』と知らせた。そして主は彼女にこれらのことを語られた。」最後の句は、マリアの報告の一部とも、語り手による説明とも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: 行き
  rationale: 物語上の歴史的現在を自然な日本語の過去の出来事として表した。移動先が「弟子たちのところ」と示されるため、「行き」が明快である。
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: マグダラのマリア
  rationale: 日本語聖書で広く定着し、地名に由来する呼称であることも分かる形を採った。
- source_word: ἀγγέλλουσα
  choice: 知らせた
  rationale: 弟子たちに消息を伝える分詞の働きを、主動詞と一体化した自然な日本語で表した。
- source_word: τοῖς μαθηταῖς
  choice: 弟子たち
  rationale: μαθητήςの標準的な訳語であり、原文に明示されない所有表現は加えていない。
- source_word: Ἑώρακα
  choice: 私は主を見ました
  rationale: 完了形が示す、見たという出来事とその現在的な確信を、報告として自然な丁寧体で表した。
- source_word: τὸν κύριον
  choice: 主
  rationale: 復活したイエスを指す称号としての神学的重みを保つ標準的な訳語である。
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: また主が自分にこれらのことを語られたと
  rationale: マリアが知らせた内容の続きと解し、発話者を日本語で明確にするため文脈上の「主」を補った。「これらのこと」はταῦταを保持する。
theological_decisions:
- issue: 復活物語におけるκύριοςの訳
  choice: 主
  alternative: 主人／先生
  rationale: イエスへの称号として認められる意味とキリスト論的な含みを弱めず、特定教派の解釈も付加しない。
- issue: καὶ ταῦτα εἶπεν αὐτῇとマリアの報告との関係
  choice: マリアが知らせた内容の一部として訳す
  alternative: 語り手による独立した説明として「そして主は彼女にこれらのことを語られた」と訳す
  rationale: 二つ目のὅτιはないものの、この節はἀγγέλλουσαの内容が継続していると自然に読める。ただし統語上は語り手の説明とも取れるため、脚注で曖昧さを明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、復活の証言にふさわしい落ち着いた文体を用いた。マリアの直接話法は自然な丁寧体とし、原文の統語的曖昧さは本文で一方を採りながら脚注に保存した。
