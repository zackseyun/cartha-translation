    text: 写本には「信じるようになるため」（アオリスト）と読むものがある。一方、本文は「信じるため」と訳した現在形であり、「信じ続ける」という含みを持ち得る。本文の訳は、いずれか一方に限定しない。
    reason: textual_variant
