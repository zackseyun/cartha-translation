    rationale: SBLGNT本文は現在接続法 πιστεύητε であり、脚注はアオリスト異読との対照として本文形を明示するほうが正確である。現在形そのものを写本群が支持するという表現は、この文脈では本文と異読の関係を不必要に曖昧にする。
  revised_text: しかし、これらのことが書き記されたのは、あなたがたがイエスがメシア[b]であり、神の子であると信じるため、また、信じることによってその方の名においていのちを得るためである。
  revised_footnotes:
