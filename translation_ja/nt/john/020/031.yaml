id: JHN.20.31
reference: John 20:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: ja
  text: しかし、これらのことが書き記されたのは、あなたがたがイエスがメシア[b]であり、神の子であると信じるため、また、信じることによってその方の名においていのちを得るためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 別訳「キリスト」。ギリシア語の「クリストス」は、油を注がれた者を意味する称号。ここではその意味を表す「メシア」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 直前に述べられたしるしと、それらについて記された内容を指す。日本語では「これらのこと」が自然で明確。
- source_word: δὲ
  choice: しかし
  rationale: 前節の、ほかにも多くのしるしが行われたという記述との穏やかな対照を示す。
- source_word: γέγραπται
  choice: 書かれた
  rationale: 完了受動の結果的な意味を、日本語の目的構文「書かれたのは」で自然に表した。
- source_word: ἵνα πιστεύητε
  choice: あなたがたが信じるため
  rationale: 目的を明示しつつ、現在接続法の継続的含意を本文で過度に限定しない。「あなたがた」は動詞の二人称複数を表す。
- source_word: ὅτι Ἰησοῦς ἐστιν ὁ χριστός
  choice: イエスがメシアであると
  rationale: ὅτι節を信じる内容として示し、χριστόςは固有名ではなく称号なので、その意味を伝える「メシア」とした。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: キリスト論的称号を説明的に薄めず、簡潔かつ伝統的に保持した。
- source_word: καὶ ἵνα
  choice: そして…ため
  rationale: 第二の目的節であることが分かるよう、第一の目的節との並行を保った。
- source_word: πιστεύοντες
  choice: 信じることによって
  rationale: 分詞を手段として自然に表し、「いのちを得る」との関係を明確にした。
- source_word: ζωὴν
  choice: いのち
  rationale: 原文に「永遠の」に当たる語はないため補わず、ヨハネ文書で神から与えられる生命を含意し得る表記「いのち」を用いた。
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: その方の名において
  rationale: ἐνの意味を単に手段へ限定せず、権威・人格・関係を含み得る「名において」で原文の幅を保った。αὐτοῦの指示対象を丁寧に表すため「その方」とした。
theological_decisions:
- issue: Χριστόςの称号としての訳
  choice: メシア
  alternative: キリスト
  rationale: ここではイエスの身分を表す称号として機能するため、音写的な「キリスト」ではなく、そのメシア的意味を伝える「メシア」とした。別訳は脚注で示した。
- issue: πιστεύητεの本文異読とアスペクト
  choice: 信じるため
  alternative: 信じ続けるため／信じるようになるため
  rationale: SBLGNT本文の現在接続法は継続的信仰を含意し得る一方、異読のアオリスト接続法は信仰に至ることをより示唆し得る。本文は広く訳し、異読と含意を脚注に残した。
- issue: 「いのち」の限定
  choice: いのち
  alternative: 永遠のいのち
  rationale: ヨハネ的文脈では永遠のいのちが含意され得るが、この節の原文には「永遠の」がないため、本文では補わない。
- issue: ἐν τῷ ὀνόματι αὐτοῦの意味範囲
  choice: その方の名において
  alternative: その方の名によって
  rationale: 「によって」だけでは手段に限定されやすい。ἐνと「名」が持ち得る権威、人格、関係の含みを保つ表現を選んだ。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体。原文の二つの目的節を保ち、信仰の開始か継続かという本文上・アスペクト上の緊張は脚注で明示した。脚注記号は関連語句の直後に配置した。
