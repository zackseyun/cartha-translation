  to: しかし、これらのことが書き記されたのは、あなたがたがイエスがメシア[b]であり、神の子であると信じるため、また、信じることによってその方の名においていのちを得るためである。
  rationale: 本文の意味を変えず、二つのキリスト論的称号の並列を明示し、二つの目的節を自然に整えた。さらに、脚注aをSBLGNT本文の現在接続法とアオリスト異読の関係に即して修正した。
