id: JHN.20.7
reference: John 20:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: ja
  text: また、イエスの頭にあった覆い布は、亜麻布と一緒にはなく、別に一か所に巻かれた状態であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「包まれた状態であった」「たたまれた状態であった」とも訳せる。
    reason: ἐντετυλιγμένονは、巻かれた、包まれた、またはたたまれた状態を表し得るため。
lexical_decisions:
- source_word: σουδάριον
  choice: 覆い布
  rationale: 埋葬の文脈で頭または顔を覆っていた布を指す。「覆い布」は、現代日本語で不自然な「手ぬぐい」などを避けつつ、用途を過度に限定しない。続く「頭にあった」が位置を明示する。
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: イエスの頭にあった
  rationale: ἐπίの空間的関係を簡潔に保ち、頭の周囲に巻かれていたのか、上に載せられていたのかを特定しない。日本語では代名詞より「イエス」とするほうが指示対象が明瞭である。
- source_word: ὀθονίων
  choice: 亜麻布
  rationale: 墓に残されていた複数の亜麻布を指す。日本語では素材名としての「亜麻布」が集合的にも自然で、用途を「包み布」と限定しすぎない。
- source_word: κείμενον
  choice: 置かれず
  rationale: 布がそこに横たわっている状態を表す。否定と対比を自然な日本語にするため、「横たわっておらず」ではなく「置かれず」とした。
- source_word: χωρὶς
  choice: 離れた
  rationale: ほかの亜麻布とは空間的に別であったことを、「離れた一か所」と自然に表す。
- source_word: ἐντετυλιγμένον
  choice: 巻かれていた
  rationale: 完了受動分詞が示す、巻かれた状態を直接表す。「たたまれていた」と断定すると、布の整然とした折り畳みを本文以上に具体化する可能性があるため、別訳を脚注に示す。
- source_word: εἰς ἕνα τόπον
  choice: 一か所に
  rationale: ほかの布とは異なる特定の場所にあったという意味を、簡潔で自然な日本語で保つ。
- source_word: καὶ
  choice: また
  rationale: 前節から墓の中で見えたものを続けて列挙する接続を、日本語の物語文として自然に示す。
theological_decisions:
- issue: 覆い布の配置に、本文が明言しない象徴的・護教的意味を持たせるか
  choice: 覆い布がほかの亜麻布から離れ、巻かれた状態にあったという観察的描写にとどめる。
  alternative: 整然と折り畳まれていたことが、復活の意図性や秩序を象徴または証明すると訳文に示す。
  rationale: ギリシャ語本文は布の位置と状態を描写するが、その象徴的意味や出来事の具体的再構成を明言していないため、そのような推論を訳文に持ち込まない。
translation_notes:
  register: 明瞭で落ち着いた現代標準日本語。「覆い布」「亜麻布」により埋葬場面の品位を保ちつつ、布の厳密な形状や配置を本文以上に特定しない。
