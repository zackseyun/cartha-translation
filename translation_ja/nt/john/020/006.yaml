source:
  edition: SBLGNT
  text: ἔρχεται οὖν ⸀καὶ Σίμων Πέτρος ἀκολουθῶν αὐτῷ, καὶ εἰσῆλθεν εἰς τὸ μνημεῖον· καὶ θεωρεῖ τὰ ὀθόνια κείμενα,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/006.yaml
  text: Then Simon Peter also came[a], following him, and entered into the tomb; and he sees the linen cloths lying there,
translation:
  language: ja
  text: そこで、シモン・ペトロも彼の後について来て、墓の中に入った。そして、亜麻布が横たわっているのを見る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「来る」と「見る」の両方が、過去の出来事を現在形で生き生きと描く歴史的現在になっている。ここでは日本語の自然な物語の流れに合わせて、前者を「来て」とし、後者は「見る」と現在形を保った。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: 来て
  rationale: ギリシア語は歴史的現在だが、日本語では後続する「入った」につながる連用形にし、出来事の進行を自然に表した。
- source_word: οὖν
  choice: そこで
  rationale: 前節を受けた物語上の展開を示す接続語として、推論と場面進行の双方に適する。
- source_word: καὶ Σίμων Πέτρος
  choice: シモン・ペトロも
  rationale: καίの付加的な意味を「も」で明示し、先に着いたもう一人の弟子に続いてペトロも来たことを表した。
- source_word: ἀκολουθῶν αὐτῷ
  choice: 彼の後について
  rationale: 現在分詞が主動作と同時の状況を示すため、自然な日本語で追随の動作を表した。
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: 墓の中に入った
  rationale: εἰςの方向性を「中に」で示し、μνημεῖονを文脈に即して「墓」とした。
- source_word: θεωρεῖ
  choice: 見る
  rationale: 注意を向けて目にする意味を簡潔に表し、ギリシア語の歴史的現在に対応して非過去形を保った。
- source_word: τὰ ὀθόνια
  choice: 亜麻布
  rationale: 埋葬に用いられた小幅の亜麻布を指す語だが、「埋葬布」と解釈を限定せず、素材を明示する語を選んだ。日本語では集合的に単数形で自然に表せる。
- source_word: κείμενα
  choice: 置かれている
  rationale: 布がそこに横たわるように存在している状態を表す。意図的に整えられたとまでは断定しない表現とした。
