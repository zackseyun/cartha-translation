id: JHN.20.25
reference: John 20:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: ja
  text: そこで、ほかの弟子たちはトマスに、「私たちは主を見た」と繰り返し伝えていた。しかし、トマスは彼らに言った。「彼の手にある釘の跡を見て、釘の跡に自分の指を入れ、彼の脇腹に自分の手を入れなければ、私は決して信じない。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私は絶対に信じない」とも訳せる。ギリシア語では強い否定が用いられている。
    reason: 強意の否定οὐ μήの力を示しつつ、本文とは異なる自然な日本語表現を提示するため。
lexical_decisions:
- source_word: ἔλεγον
  choice: 繰り返し伝えていた
  rationale: 未完了時制の継続・反復の含みを自然な日本語で表す。単に「言った」とするより、弟子たちがトマスに繰り返し証言していた場面を保つ。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けた物語の展開を示す接続語として、現代日本語で自然に表した。
- source_word: Ἑωράκαμεν
  choice: 私たちは主を見た
  rationale: ギリシア語の完了形は現在にも関わる経験を示すが、日本語では「見た」が自然であり、その現在的意義は発言の文脈から伝わる。
- source_word: ὁ κύριος
  choice: 主
  rationale: 復活したイエスを指す称号として、冠詞を日本語では明示せず定着した「主」と訳す。
- source_word: τύπος τῶν ἥλων
  choice: 釘の跡
  rationale: 釘によって残された目に見える痕跡を簡潔かつ具体的に示す。
- source_word: βάλω ... εἰς
  choice: 入れ
  rationale: 動作の方向を表す εἰς を保ち、要求の生々しさを弱めない。
- source_word: ἡ πλευρά
  choice: 脇腹
  rationale: 人体の側面を指す語として、文脈に即した自然で明確な訳語。
- source_word: οὐ μὴ πιστεύσω
  choice: 私は決して信じない
  rationale: οὐ μή による強い否定を「決して」で表し、条件が満たされない限り信じないという断固たる拒否を示す。
theological_decisions:
- issue: トマスの拒否 οὐ μὴ πιστεύσω の強さ
  choice: 「私は決して信じない」
  alternative: 「私は絶対に信じない」「私は信じようとはしない」
  rationale: 強意の否定を明確に保ちながら、条件文の中での拒否であることを本文の構造に委ね、トマスの心理や恒久的な不信を付加しない。
- issue: 弟子たちの証言の継続性
  choice: 「繰り返し伝えていた」
  alternative: 「言っていた」
  rationale: ἔλεγον の未完了時制が持つ反復的な読みを示す。ただし、回数や期間は特定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会話には簡潔さと厳粛さを保った。「その手にある釘の跡」は身体上の位置を自然に示し、「指を入れ」「手を入れ」によって原文の反復と具体性を保持した。固有名「トマス」は原文の代名詞を文脈上明確にするため補った。
