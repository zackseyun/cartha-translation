  to: イエスは彼女に言われた。「わたしにすがりついていてはいけない[a]。わたしはまだ父のもとへ上っていないからだ。しかし、わたしの兄弟たち[b]のところへ行き、彼らにこう伝えなさい。『わたしは、わたしの父、あなたがたの父である方、わたしの神、あなたがたの神である方のもとへ上って行く。』」
  rationale: 父と神についての「わたしの…、あなたがたの…」という反復的並行を、現代日本語として不自然にならない範囲で本文に明示した。また、δέには限定的な「それより」ではなく、より中立的な「しかし」を用いた。脚注アンカーと脚注内容はいずれも本文に対応しており、変更を要しない。
