id: JHN.20.17
reference: John 20:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: ja
  text: イエスは彼女に言われた。「わたしにすがりついていてはいけない[a]。わたしはまだ父のもとへ上っていないからだ。しかし、わたしの兄弟たち[b]のところへ行き、彼らにこう伝えなさい。『わたしは、わたしの父、あなたがたの父である方、わたしの神、あなたがたの神である方のもとへ上って行く。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしに触れてはいけない」または「わたしをつかんでいてはいけない」とも訳せる。ギリシア語は、単に触れることよりも、すがりつくこと、あるいはつかみ続けることを指す可能性が高い。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」はギリシア語の男性複数形を訳したもの。ここではイエスの弟子たちを指し、より広い代表的な一団を含む可能性もある。
    reason: cultural_note
lexical_decisions:
- source_word: Μή μου ἅπτου
  choice: わたしにすがりついていてはいけない
  rationale: μήを伴う現在命令形の継続的な含みと文脈を踏まえ、単なる接触の禁止ではなく、すがりつくこと、またはつかみ続けることを自然な現代日本語で表した。
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: わたしはまだ父のもとへ上っていないからだ
  rationale: 完了形の「まだ上っていない」を保ち、ヨハネ福音書における父への上昇という意味を「上る」で表した。γάρは理由を示す「からだ」とした。
- source_word: πρὸς τὸν πατέρα
  choice: 父のもとへ
  rationale: 最初の句には所有代名詞がないため「わたしの父」と補わず、定冠詞を伴うπατέραを「父」とした。πρόςの方向性は「もとへ」で表した。
- source_word: πορεύου
  choice: 行き
  rationale: 移動を命じる語として、簡潔で自然な「行く」を採用した。後続の命令と滑らかにつなぐため連用形とした。
- source_word: τοὺς ἀδελφούς μου
  choice: わたしの兄弟たち
  rationale: 男性複数形を本文では「兄弟たち」と正確に訳し、文脈上の指示対象については脚注で説明した。
- source_word: εἰπὲ αὐτοῖς
  choice: 彼らにこう伝えなさい
  rationale: 報告内容を告げる命令として、直訳的な「彼らに言いなさい」より自然な日本語を用いた。αὐτοῖςも「彼らに」と明示した。
- source_word: Ἀναβαίνω
  choice: 上って行く
  rationale: 現在形が示す目前の動きと方向性を保ちつつ、日本語として自然に表した。
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: わたしの父であり、あなたがたの父でもある方
  rationale: イエスと弟子たちとの関係をそれぞれ明示する並行表現を保ち、一方を他方に吸収しない形にした。
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: わたしの神であり、あなたがたの神でもある方
  rationale: 「わたしの神」と「あなたがたの神」をともに直接表現し、教理的な言い換えによって緊張を弱めないようにした。
theological_decisions:
- issue: Μή μου ἅπτου の意味
  choice: 継続してすがりつくことへの禁止
  alternative: わたしに触れてはいけない
  rationale: 現在命令形の相と場面から、あらゆる接触そのものの禁止と断定せず、すがりつく、またはつかみ続ける行為を表す訳を本文に採用した。別訳は脚注に残した。
- issue: 最初の節における πατέρα の訳
  choice: 父
  alternative: わたしの父
  rationale: 原文の最初の句にはμουがないため、所有表現を補わなかった。後続の発言にある「わたしの父」との対照も保たれる。
- issue: 「わたしの神、あなたがたの神」のキリスト論的含意
  choice: 原文の表現をそのまま明示する
  alternative: 「わたしの神」の力を弱める説明的意訳
  rationale: この節が持つ神学的な重みと緊張を、教理上の調整によって解消せず、そのまま読者に提示した。
translation_notes:
  register: 明瞭で現代的ながら、復活したイエスの発言にふさわしい落ち着きと品位を保った。「わたし」「あなたがた」を用い、過度に古風な言い回しや教派的な用語は避けた。
