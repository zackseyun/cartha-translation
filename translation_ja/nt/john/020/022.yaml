id: JHN.20.22
reference: John 20:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ἐνεφύσησεν καὶ λέγει αὐτοῖς· Λάβετε πνεῦμα ἅγιον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/022.yaml
  text: And after saying this[a], he breathed on them and said to them, “Receive the Holy Spirit.”
translation:
  language: ja
  text: こう言ってから、イエスは彼らに息を吹きかけて[a]言われた。「聖霊を受けなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らに息を吹き込んで」。この動詞は、創世記2章7節やエゼキエル書37章に見られる創造と新しい創造のイメージも思い起こさせる。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: こう言ってから
  rationale: アオリスト分詞が主動詞に先立つ動作を表すことを、自然な現代日本語で示す。
- source_word: ἐνεφύσησεν
  choice: 彼らに息を吹きかけて
  rationale: 基本的な意味を自然に表しつつ、「中へ吹き込んだ」と限定せず、創造・新創造を想起させる語感も保持する。
- source_word: λέγει αὐτοῖς
  choice: 言われた
  rationale: 歴史的現在を日本語の物語として自然な過去形に整え、相手への敬意ではなくイエスを立てる通常の聖書文体を用いる。
- source_word: Λάβετε
  choice: 受けなさい
  rationale: この文脈では「取る」よりも、聖霊を授けられて受けることを表す「受ける」が自然である。
- source_word: πνεῦμα ἅγιον
  choice: 聖霊
  rationale: 無冠詞だが、ヨハネ福音書の文脈では神の霊である聖霊を指す。日本語では冠詞を補う必要がない。
theological_decisions:
- issue: πνεῦμα ἅγιονが神の聖霊を指すか、不特定の「聖なる霊」を指すか
  choice: 聖霊
  alternative: 聖なる霊
  rationale: ヨハネ福音書と新約聖書の用法から、ここでは神の聖霊を指すのが最も自然である。ただし原文にない説明語は加えない。
- issue: ἐνεφύσησενの方向性と創造物語への響き
  choice: 息を吹きかけて
  alternative: 息を吹き込んで
  rationale: 創世記2章7節やエゼキエル37章を想起させうるが、本文だけでは「彼らの中へ」と明示されないため、方向を限定しない訳を本文に置く。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。短い発話の力強さを保ち、原文の語順と時間的な流れを無理なく再現した。
