id: JHN.20.8
reference: John 20:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: ja
  text: そこで、先に墓に着いていたもう一人の弟子も中に入り[a]、見て、信じた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「入った」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は単に「信じた」と述べ、何を信じたのかを明示していない。イエスの復活を信じた、目の前の証拠を信じた、あるいは先の報告を信じた、などの解釈がある。
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: そこで
  rationale: 物語の時間的進行と、ペトロが中に入ったことを受けた緩やかな帰結の両方を、自然な日本語で表す。
- source_word: εἰσῆλθεν
  choice: 中に入り
  rationale: 墓の内部へ入る具体的な動作を、現代日本語の自然な叙述で表す。
- source_word: ὁ ἄλλος μαθητής
  choice: もう一人の弟子
  rationale: ヨハネ福音書で用いられる呼称を、定着した聖書用語で明確に訳す。
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: 先に墓に着いていた
  rationale: 主動詞より前に、この弟子がペトロより先に墓へ到着していたことを自然に示す。
- source_word: μνημεῖον
  choice: 墓
  rationale: この復活物語ではイエスの遺体が納められた埋葬場所を指すため、「墓」が簡潔で正確である。
- source_word: καὶ εἶδεν
  choice: 見て
  rationale: 何を見たかを原文以上に補わず、動詞の簡潔さを保つ。
- source_word: ἐπίστευσεν
  choice: 信じた
  rationale: 原文には信じた内容を示す目的語がないため、何を信じたかを補わず絶対用法のまま訳す。
theological_decisions:
- issue: 弟子が何を信じたのか
  choice: 目的語を補わず「信じた」とする。
  alternative: イエスが復活したと信じた／目の前の証拠を信じた／マリアの報告を信じた
  rationale: ギリシア語は信じた内容を明示しておらず、続く節との関係も含めて解釈が分かれる。特定の内容を補うと、原文が残している物語的・神学的緊張を解消してしまうため。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、簡潔な接続と動詞の連なりによって原文の物語的な進行を保った。「信じた」の内容は意図的に限定していない。
