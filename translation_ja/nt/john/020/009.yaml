revisions:
- from: 彼らはまだ、聖書が、イエスは死者の中から復活しなければならない、と述べていることを理解していなかったのである。
  to: というのも、彼らはまだ聖書を理解していなかったのである。すなわち、イエスが死者の中から復活しなければならないということを。
  rationale: γάρの説明的な働きを「というのも」で表し、τὴν γραφήνを「聖書」と単数で保持した。ὅτι節は「すなわち」で前の「聖書」を説明する内容として置き、「聖書が述べている」という原文にない発話動詞を加えなかった。δεῖと能動不定詞ἀναστῆναιはそれぞれ「しなければならない」「復活する」とした。
