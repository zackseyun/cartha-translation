review_pass:
  verdict: revise
  source_fidelity: 「聖書が……と述べていること」は、ὅτι節を聖書の内容として明示する点では理解可能です。しかし原文は「聖書をまだ理解していなかった、すなわち／それは彼が……復活しなければならないということ」という関係であり、「述べている」という発話動詞と現在形を補う必要はありません。
  naturalness: 現代標準日本語として、「聖書をまだ理解していなかった。すなわち、…ということを。」よりも、「聖書が、イエスは…ということを、まだ理解していなかった」はやや係り受けが重くなります。「聖書が示している、イエスは…ということを」のような補足も原文以上です。簡潔に「聖書をまだ理解していなかったのである」とし、内容を同格的に続ける形が自然です。
  terminology: 「聖書」「死者の中から」「復活する」は適切です。「復活する」は能動形ἀναστῆναιに対応する日本語の自動詞であり、受動的な行為主体を持ち込みません。「しなければならない」はδεῖの必然性を保ちます。
  issues:
  - severity: medium
    issue: 「聖書が……と述べていること」という補足
    rationale: 原文のᾔδεισαν τὴν γραφήν ὅτιは、弟子たちが聖書（およびその内容）を理解していなかったことをいう表現で、「聖書が述べている」という発話動詞・現在時制を明示していません。補足を避け、聖書と内容節の結び付きを同格的に表すのがより忠実です。
  revised_text: というのも、彼らはまだ聖書を理解していなかったのである。すなわち、イエスが死者の中から復活しなければならないということを。
