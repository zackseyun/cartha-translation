id: JHN.20.9
reference: John 20:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδέπω γὰρ ᾔδεισαν τὴν γραφὴν ὅτι δεῖ αὐτὸν ἐκ νεκρῶν ἀναστῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: ja
  text: というのも、彼らはまだ聖書を理解していなかったのである。すなわち、イエスが死者の中から復活しなければならないということを。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδέπω
  choice: まだ……ていなかった
  rationale: その時点まで理解に至っていなかったという時間的意味を、自然な日本語で表す。
- source_word: γὰρ
  choice: のである
  rationale: 直前の叙述に対する説明であることを、文末の説明調で自然に示す。
- source_word: ᾔδεισαν
  choice: 理解していなかった
  rationale: 聖書の存在を知らなかったという意味ではなく、その内容を悟っていなかったことを表す。
- source_word: τὴν γραφὴν
  choice: 聖書
  rationale: 単数形を集合的または特定の聖書証言として読める「聖書」で表し、特定箇所か聖書全体の証言かを限定しすぎない。
- source_word: ὅτι
  choice: ……と述べていること
  rationale: 聖書の内容を導く接続詞として明確な日本語にする。
- source_word: δεῖ
  choice: しなければならない
  rationale: 神的必然性を含む必要の意味を保つ。
- source_word: αὐτὸν
  choice: イエスは
  rationale: 日本語では代名詞「彼」より指示対象を明示する方が自然で、文脈上の指示対象も明白である。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 復活表現として自然でありつつ、複数形 νεκρῶν の「死んだ者たちの中から」という像を保つ。
- source_word: ἀναστῆναι
  choice: 復活する
  rationale: 能動不定詞の形を保ち、「復活させられる」という受動表現に変えない。日本語の定着した復活用語として明瞭である。
theological_decisions:
- issue: 復活表現と行為主体
  choice: イエスは死者の中から復活しなければならない
  alternative: イエスは死者の中から復活させられなければならない
  rationale: ギリシア語は能動形 ἀναστῆναι を用いるため、本文も能動表現とする。他の箇所に見られる受動表現との神学的調和をこの節に持ち込まず、原文の表現を保つ。
- issue: 「聖書」と内容節の関係
  choice: 聖書が……と述べていること
  alternative: 聖書を理解していなかった。すなわち、イエスは……
  rationale: ὅτι を聖書の内容を示す節として明確に訳す一方、「聖書」が特定の一節か聖書的証言一般かは決めつけない。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある説明調。「のである」で前節への理由説明を示した。固い直訳調を避けつつ、聖書の単数性、必要性、復活動詞の能動性を保持した。
