  yaml_path: translation/nt/john/020/003.yaml
  text: So Peter and the other disciple went out and were going to the tomb[a].
translation:
  language: ja
  text: そこで、ペトロともう一人の弟子は外に出て、墓へ向かっていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「墓へ行った」。ギリシア語の未完了過去は、より簡潔に訳すこともできるが、「向かっていた」は進行中の動作をより明確に表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 外に出て
  rationale: ἐξέρχομαιのアオリストで、その場から出たことを表す。「外に出て」は方向性を保ちつつ、現代日本語として自然である。
- source_word: οὖν
  choice: そこで
  rationale: 前節の知らせを受けた結果として物語が進むことを示す接続語。「そこで」は、οὖνの帰結的・叙述的な働きを自然に表す。
- source_word: ὁ Πέτρος
  choice: ペトロ
  rationale: 人名Πέτροςには、日本語聖書で広く用いられる標準的な音写を採用した。
- source_word: ὁ ἄλλος μαθητής
  choice: もう一人の弟子
  rationale: 文脈上すでに言及された、ペトロとは別の弟子を指す。日本語では「もう一人の弟子」が自然で、ἄλλοςの区別も明確に伝える。
- source_word: ἤρχοντο
  choice: 向かっていた
  rationale: ἔρχομαιの未完了過去であり、墓を目指して進んでいた継続中の動作を表す。「向かっていた」は日本語で目的地への移動と未完了的な相をともに自然に示す。
- source_word: εἰς τὸ μνημεῖον
  choice: 墓へ
  rationale: この文脈のμνημεῖονはイエスが葬られた墓を指す。εἰςは目的地への移動を表し、まだ墓の中に入ったとは述べていないため、「墓へ」とした。
