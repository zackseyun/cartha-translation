  text: ἔτρεχον δὲ οἱ δύο ὁμοῦ· καὶ ὁ ἄλλος μαθητὴς προέδραμεν τάχιον τοῦ Πέτρου καὶ ἦλθεν πρῶτος εἰς τὸ μνημεῖον,
base_translation:
  language: en
  yaml_path: translation/nt/john/020/004.yaml
  text: The two were running together[a], and the other disciple ran ahead faster than Peter and came first to the tomb.
translation:
  language: ja
  text: 二人は一緒に走っていた。そして、もう一人の弟子はペトロより速く走り、先に墓に着いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔτρεχον
  choice: 走っていた
  rationale: 未完了時制が示す過去の継続中の動作を自然な日本語で表す。
- source_word: δὲ
  choice: が
  rationale: 弱い接続または対照を表す語であり、二人が共に走っていたことから、もう一人が先行したことへの軽い転換を示す。
- source_word: οἱ δύο ὁμοῦ
  choice: 二人は一緒に
  rationale: 二人による共同の動作を簡潔かつ明瞭に表す。
- source_word: ὁ ἄλλος μαθητής
  choice: もう一人の弟子
  rationale: 直前の文脈にいるペトロと区別される弟子を指す、福音書に自然な定訳。
- source_word: προέδραμεν
  choice: 走って先に進み
  rationale: 『前方へ走る、先に走る』という複合動詞の像を保ちつつ、後続する速度の比較との不自然な重複を避ける。
- source_word: τάχιον τοῦ Πέτρου
  choice: ペトロより速く
  rationale: 比較表現を明示し、原文の語順と意味を自然な日本語で保持する。
- source_word: ἦλθεν πρῶτος
  choice: 最初に…着いた
  rationale: 到着の順位を示す πρῶτος を明確に表し、日本語の移動場面では『来た』より『着いた』が自然。
- source_word: εἰς τὸ μνημεῖον
  choice: 墓に
  rationale: ここではイエスの埋葬場所を指す。次節ではまだ中に入っていないため、εἰς を『墓の中へ』とは訳さず、到達点として表す。
