id: JHN.20.16
reference: John 20:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· ⸀Μαριάμ. στραφεῖσα ἐκείνη λέγει αὐτῷ ⸀Ἑβραϊστί· Ραββουνι (ὃ λέγεται Διδάσκαλε).
base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: ja
  text: イエスは彼女に「マリア」と言われた。彼女は振り向き、ヘブライ語で[a]「ラボニ」と言った（「先生」という意味である）。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「アラム語で」。ヨハネが用いる「ヘブライ語」は、ユダヤ地方で話されていたセム系の言葉を広く指す場合がある。
    reason: 原語の字義的表現と、歴史言語学的に有力な別解の両方を示すため。
lexical_decisions:
- source_word: λέγει
  choice: 言われた／言った
  rationale: ギリシア語では歴史的現在形だが、日本語で自然かつ品位ある物語文となるよう過去形で表現した。イエスの発話には敬意を示す「言われた」を用いた。
- source_word: Μαριάμ
  choice: マリア
  rationale: 日本語聖書で定着し、一般読者にも明瞭な人名表記を採用した。
- source_word: στραφεῖσα
  choice: 振り向き
  rationale: アオリスト分詞が示す動作を簡潔に表し、呼びかけを受けて向きを変える場面の流れを保った。
- source_word: Ἑβραϊστί
  choice: ヘブライ語で
  rationale: 本文ではギリシア語の字義どおりに訳した。ユダヤ地方のセム系言語、特にアラム語を広く指す可能性は脚注に残した。
- source_word: Ραββουνι
  choice: ラボニ
  rationale: 福音書本文が直後に意味を説明しているため、称号を訳語に置き換えず、日本語で慣用的な音写を用いた。
- source_word: ὃ λέγεται Διδάσκαλε
  choice: 「先生」という意味である
  rationale: λέγεταιによる語義説明を自然な現代日本語で示し、呼格 Διδάσκαλε は権威性を過度に強めない標準的な「先生」とした。
theological_decisions:
- issue: ヨハネ文書におけるἙβραϊστίの言語指定
  choice: 本文を「ヘブライ語で」とする
  alternative: 「アラム語で」とする
  rationale: 原文の明示的な語形を本文で尊重しつつ、この語が当時のアラム語を含むユダヤ地方のセム系言語を広く指し得るという解釈上の幅を脚注で保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、復活したイエスとマリアの再会場面にふさわしい簡潔さと品位を保った。脚注記号は、それが説明する「ヘブライ語で」の直後に置いた。
