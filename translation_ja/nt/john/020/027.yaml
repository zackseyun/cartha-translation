  to: それから、トマスに言われた。「あなたの指をここに伸ばして、わたしの両手を見なさい。あなたの手を伸ばして、わたしの脇腹に入れなさい。信じない者とならず、信じる者となりなさい。」[a]
  rationale: 指と手を「持って来る」とする逐語的な表現を、身体動作として自然な「伸ばす」に改めた。これにより、傷へ向けるという文脈上の方向性を保ちつつ、不自然な運搬の含みを避ける。原文の複数形は「両手」で明示した。終結部は「…者とならず、…者となりなさい」として、γίνουの変化を求める力と対照を保った。脚注は語彙上可能な代替を保存しつつ、現代語として自然な「不忠実」に修正した。
