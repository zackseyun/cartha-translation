id: JHN.20.27
reference: John 20:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ Θωμᾷ· Φέρε τὸν δάκτυλόν σου ὧδε καὶ ἴδε τὰς χεῖράς μου, καὶ φέρε τὴν χεῖρά σου καὶ βάλε εἰς τὴν πλευράν μου, καὶ μὴ γίνου ἄπιστος ἀλλὰ πιστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: ja
  text: それから、トマスに言われた。「あなたの指をここに伸ばして、わたしの両手を見なさい。あなたの手を伸ばして、わたしの脇腹に入れなさい。信じない者とならず、信じる者となりなさい。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「不忠実な者ではなく、忠実な者になりなさい」。ギリシア語の二つの形容詞にはこの意味もあり得るが、ここでは復活したイエスをトマスが信じるかどうかが対照の中心となっている。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: それから
  rationale: 物語の時間的な順序を自然な現代日本語で示す。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形にし、主語であるイエスへの敬意を表す尊敬語を用いた。
- source_word: Φέρε
  choice: 持って来て
  rationale: 「運ぶ、持って来る」という基本義と、二度繰り返される命令の対応を保つ。
- source_word: δάκτυλόν σου ὧδε
  choice: あなたの指をここに
  rationale: ὧδε の直示的な「ここに」を明瞭に保つ。
- source_word: ἴδε
  choice: 見なさい
  rationale: 命令の力を保ちながら、古風にならない自然な表現とした。
- source_word: τὰς χεῖράς μου
  choice: わたしの手
  rationale: ギリシア語は複数形だが、日本語では身体部位として無標の「手」が自然で、両手を指す文脈も損なわない。
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: わたしの脇腹に入れなさい
  rationale: εἰς の方向性を「に入れる」で表し、傷のあるイエスの脇腹を指す πλευρά を「脇腹」とした。
- source_word: μὴ γίνου
  choice: …者にならず
  rationale: γίνομαι の過程・変化の含みを「なる」で保持し、単なる静的な「であるな」としなかった。
- source_word: ἄπιστος
  choice: 信じない者
  rationale: 復活したイエスを信じるかどうかが中心となる文脈に即し、明快な現代日本語とした。
- source_word: πιστός
  choice: 信じる者
  rationale: ἄπιστος との対照と語形の対応を保ち、この場面における信仰・信頼の意味を前面に出した。
theological_decisions:
- issue: ἄπιστος / πιστός の対照
  choice: 信じない者／信じる者
  alternative: 不信実な者／忠実な者、信仰のない者／信仰のある者
  rationale: 直前の文脈は、復活したイエスについての証言をトマスが信じるかどうかに焦点を置くため、信じることを表す訳を本文に採用した。ただし、両形容詞には「不信実／忠実」の語義もあり得るため、脚注で曖昧さを保存した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。イエスの発話には自然な命令形を用い、地の文では「言われた」として敬意を表した。原文にない「イエスは」は補わず、前後の文脈に委ねた。
