  text: ⸀ἀπεκρίθη Θωμᾶς καὶ εἶπεν αὐτῷ· Ὁ κύριός μου καὶ ὁ θεός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/028.yaml
  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: ja
  text: トマスは彼に答えて言った[a]。「私の主よ、そして私の神よ！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳（可能性は低い）「トマスは答えて言った。『私の主よ、そして私の神よ！』」。これを単なる感嘆と見る解釈もあるが、ギリシア語には「彼に言った」とあり、イエスへの直接の呼びかけであることを支持している。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えて
  rationale: 物語文における標準的な応答表現。「答えた」だけでなく、後続の「言った」と組み合わせて原文の構文を保った。
- source_word: Θωμᾶς
  choice: トマス
  rationale: 人名を現代日本語で一般的な形に音写した。
- source_word: εἶπεν αὐτῷ
  choice: 彼に言った
  rationale: 与格代名詞 αὐτῷ を明示し、トマスの言葉が直前のイエスに向けられたことを保つ。原文に固有名はないため「イエスに」とは補わない。
- source_word: Ὁ κύριός μου
  choice: 私の主
  rationale: κύριος の敬意と神学的な重みを保つため「主」とし、μου を「私の」と明示した。
- source_word: ὁ θεός μου
  choice: 私の神
  rationale: θεός を「神」、μου を「私の」と訳し、個人的な告白の形を保った。
- source_word: καὶ
  choice: 、
  rationale: 日本語では二つの呼びかけを読点で並置するほうが自然で力強い。「私の主、私の神」は、原文の二つの称号が一つの告白として結ばれていることを十分に表す。
theological_decisions:
- issue: トマスの言葉をイエスへの直接の告白とするか、神に向けた単なる感嘆とするか
  choice: イエスへの直接の呼びかけとして「私の主、私の神！」と訳す。
  alternative: 「ああ、私の主、私の神よ」のように、イエスとは別に神へ発した感嘆と解する。
  rationale: 原文はトマスが「彼に言った」（εἶπεν αὐτῷ）と明記している。また、冠詞付き主格形はコイネー・ギリシア語で呼格的に用いられ得る。そのため、神学的な含意を弱めず、トマスがイエスに直接語ったという自然な読みを本文に保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「私の主、私の神！」は簡潔で力強い告白として訳した。「答えて彼に言った」はやや原文寄りだが、「彼に」を残すことが、この節の宛先と神学的緊張を正確に伝えるために重要である。
