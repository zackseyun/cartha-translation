  text: ἀπῆλθον οὖν πάλιν πρὸς ⸀αὑτοὺς οἱ μαθηταί.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/010.yaml
  text: So the disciples went away again to their own homes[a].
translation:
  language: ja
  text: そこで弟子たちは、再び自分たちのところへ帰って行った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「自分たちのもとへ」。このギリシア語表現は、自分たちが滞在していた所、または自分たちの居場所へ戻ったという意味だと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: 帰って行った
  rationale: ἀπέρχομαιのアオリストで、その場を去る動作を表す。ここではπάλινおよび行き先を示す句と合わせ、墓から元いた場所へ戻る文脈を自然な日本語で示した。
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語上の展開・帰結を示す接続語として、硬すぎず自然な「そこで」とした。
- source_word: πάλιν
  choice: 再び
  rationale: 反復または元の場所へ戻ることを示す語であり、原文の意味を簡潔に保つ。
- source_word: πρὸς αὑτούς
  choice: 自分たちのところへ
  rationale: 字義的な再帰表現を残しつつ、単に「自分自身へ」ではなく、自分たちが属する場所、または滞在していた所へ戻ったという文脈上の意味を自然に表す。「家」と断定することは避けた。
- source_word: οἱ μαθηταί
  choice: 弟子たちは
  rationale: イエスに従う者たちを指す、福音書で定着した自然かつ正確な訳語である。
theological_decisions: []
