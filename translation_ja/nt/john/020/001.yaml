id: JHN.20.1
reference: John 20:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: ja
  text: 週の初めの日[a]、マグダラのマリアは、朝早く、まだ暗いうちに墓へ来て、石が墓から取りのけられているのを見る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「安息日々の一日」。これは「週の初めの日」を意味する慣用表現。
    reason: 字義的な形と慣用的な意味の違いを示すため。
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: 週の初めの日
  rationale: 字義どおりには「安息日の一日」に近い表現だが、コイネー・ギリシア語では週の第一日を指す慣用句である。δέはここでは強い対比を表さないため、独立した接続語を加えず、自然な日本語の叙述とした。
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: マグダラのマリア
  rationale: 地名に由来する呼称を含む人名として、日本語聖書で広く理解される自然な形を用いた。
- source_word: ἔρχεται
  choice: 来て
  rationale: ギリシア語の歴史的現在が持つ物語の臨場感を、後続する「見る」とともに日本語の非過去形の叙述の中で保った。
- source_word: πρωῒ
  choice: 朝早く
  rationale: 早い時刻を表す副詞であり、続く「まだ暗いうちに」と両立する。夜明けと限定する語は補わなかった。
- source_word: σκοτίας ἔτι οὔσης
  choice: まだ暗いうちに
  rationale: 属格独立構文が示す継続中の時間的状況を、簡明で自然な日本語にした。
- source_word: εἰς τὸ μνημεῖον
  choice: 墓へ
  rationale: この文脈のμνημεῖονは遺体を納めた墓を指す。「記念墓」などの不自然な直訳を避けた。
- source_word: βλέπει
  choice: 見る
  rationale: 知覚を表す基本的な意味を採り、歴史的現在による物語の臨場感を保った。「気づく」のような解釈的要素は加えていない。
- source_word: τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου
  choice: 石が墓から取りのけられている
  rationale: 完了受動分詞が示す、すでに行為が完了してその結果が続いている状態を「取りのけられている」で表した。ἐκ τοῦ μνημείουに対応して「墓から」を明示し、原文にない「入口」は補わなかった。
theological_decisions:
- issue: 復活記事における歴史的現在
  choice: 「来て……見る」と非過去形で語る
  alternative: 「来て……見た」と過去形にそろえる
  rationale: 原文のἔρχεταιとβλέπειはいずれも歴史的現在である。現代日本語でも物語を現在形で描くことは可能なため、その臨場感を保ちつつ、復活について原文以上の解釈を加えない。
- issue: 石が取りのけられた行為者
  choice: 受動表現のまま行為者を明示しない
  alternative: 神または御使いが石を取りのけたと明示する
  rationale: この節の受動形は行為者を特定していない。文脈からの神学的推定を本文へ持ち込まず、原文の余白を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準語を用いた。「墓へ来て」「取りのけられている」は一般読者に理解しやすく、原文の歴史的現在と完了受動分詞の結果状態も保っている。
