source:
  edition: SBLGNT
  text: ἄν τινων ἀφῆτε τὰς ἁμαρτίας ⸀ἀφέωνται αὐτοῖς· ἄν τινων κρατῆτε κεκράτηνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: ja
  text: あなたがたがだれかの罪を赦すなら、その人の罪は赦されている[a]。だれかの罪をとどめるなら、その罪はとどめられている[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は完了受動形で、「赦された」という行為の結果が続いている状態を表しうる。また、「その人の罪」は、直訳に近くは「その人たちに赦された罪」に当たる表現である。
    reason: 時制・態および与格の説明
  - marker: b
    text: 別訳「だれかの罪を保持するなら、その罪は保持されている」。ここで「とどめる」は、罪を赦しから解放せず保持することを表す。ギリシア語は完了受動形である。
    reason: 語彙上の別訳と時制・態の説明
lexical_decisions:
- source_word: ἄν τινων
  choice: だれかの……なら
  rationale: ἄνと接続法による不定条件を、現代日本語で自然な「だれかの……なら」とし、条件性と対象の不特定性を保った。
- source_word: ἀφῆτε
  choice: 赦す
  rationale: 罪を目的語とするἀφίημιの通常の意味を明確に表す。「免除する」より一般的で、この文脈にふさわしい。
- source_word: τὰς ἁμαρτίας
  choice: 罪
  rationale: 日本語では定冠詞を独立して表さず、「だれかの罪」とするのが自然である。
- source_word: ἀφέωνται αὐτοῖς
  choice: その人の罪は赦されている
  rationale: 完了受動の結果状態を「赦されている」で表し、αὐτοῖςが罪を赦される人々を指すことを、自然な日本語の所有表現で明示した。行為者は補わない。
- source_word: κρατῆτε
  choice: そのまま残す
  rationale: ここでは罪を解放せず保持する意味であり、「保持する」「とどめる」より普通の読者に明瞭な「そのまま残す」を選んだ。
- source_word: κεκράτηνται
  choice: 残されたままである
  rationale: 完了受動が示す継続的な結果状態と、前半との対照を保つため、受動表現に「まま」を加えた。
theological_decisions:
- issue: 弟子たちの行為が独立して赦しを成立させるのか、それとも神による既成の現実に対応するのか
  choice: 「赦されている」「残されたままである」と受動・結果状態の表現を保ち、行為者を明記しない。
  alternative: 「神が赦している／赦していない」または単純に「赦される／赦されない」と訳す。
  rationale: ギリシア語は神を行為者として明記せず、二つの完了受動形を用いる。神を補うことも、単純な未来的結果へ変えることも避け、弟子たちの行為と赦しの現実との関係にある神学的緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言にふさわしい簡潔で重みのある文体とした。「赦されている」と「残されたままである」により、ギリシア語の完了受動が示す結果状態を不自然にならない範囲で保持した。
