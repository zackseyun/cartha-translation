reference: John 20:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: ja
  text: イエスは彼女に言われた。「女の方、なぜ泣いているのですか。だれを捜しているのですか。」彼女は、その人が庭師だと思い、言った。「あなた[a]、もしあなたがあの方を運び去ったのでしたら、どこに置いたのか教えてください。私がその方を運んで行きます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「主よ」。ここでは、マリアが相手を庭師だと思っているため、敬意を込めた呼びかけと考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: 女の方
  rationale: 敬意を失わない呼びかけであり、現代日本語で単に「女よ」とすることで生じる不必要な粗さを避けつつ、原文の直接的な呼びかけを保つ。
- source_word: τί κλαίεις
  choice: なぜ泣いているのですか
  rationale: τίを理由を問う「なぜ」とし、κλαίωの継続的な泣きを自然な現代日本語で表す。
- source_word: τίνα ζητεῖς
  choice: だれを捜しているのですか
  rationale: 人を目的語とするτίναと、ここでのζητέωの探索の意味を明瞭に表す。
- source_word: δοκοῦσα
  choice: 思い
  rationale: マリアの誤った推測を簡潔かつ自然に示し、確信の度合いを過度に強めない。
- source_word: ὁ κηπουρός
  choice: 園の番人
  rationale: 墓のある園を管理する人物という文脈を自然に伝える。「庭師」も可能だが、現代日本語では造園職人を強く連想させることがある。
- source_word: Κύριε
  choice: あなた
  rationale: マリアは相手を園の番人と思っているため、ここではκύριεを敬意ある呼びかけとして訳す。日本語の自然な会話では「旦那様」等より「あなた」が文脈に合う。原語上「主よ」と同じ語であることは脚注に示す。
- source_word: ἐβάστασας αὐτόν
  choice: あの方を運び去った
  rationale: 遺体を物理的に移したというβαστάζωの意味を保ち、敬意のある人物指示「あの方」を用いる。
- source_word: ποῦ ἔθηκας αὐτόν
  choice: どこに置いたのか
  rationale: τίθημιの基本的な「置く」を自然な日本語で表し、「葬った」など原文にない解釈を加えない。
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: 私が引き取ります
  rationale: αἴρωの持ち去る・移す意図を、この場面で自然な日本語にする。マリアが実際に一人で運べるかという問題を説明的に補わない。
theological_decisions:
- issue: 復活したイエスにまだ気づいていないマリアのκύριε
  choice: あなた
  alternative: 主よ
  rationale: κύριεは「主よ」とも訳せるが、マリアは相手を園の番人だと思っているため、ここでは敬意ある呼びかけと解するのが文脈上自然である。語の神学的な重なりは脚注で保持する。
translation_notes:
  register: 明瞭で現代的かつ荘重さを保つ会話文。「言われた」はイエスへの日本語上の自然な敬意による。「女の方」は原文の呼びかけを残しながら、現代語の「女よ」が帯びやすい侮蔑的な響きを避ける。
