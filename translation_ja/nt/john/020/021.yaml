id: JHN.20.21
reference: John 20:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: ja
  text: そこでイエスはもう一度、彼らに言われた。「あなたがたに平安があるように。父がわたしを遣わされたように、わたしもあなたがたを遣わす。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の場面を受けた叙述の継続と展開を、自然な現代日本語で示す。強い論理的結論を表す「それゆえ」ほどには限定しない。
- source_word: πάλιν
  choice: もう一度
  rationale: 前節ですでに語られた平安の挨拶が繰り返されることを明確にする。
- source_word: Εἰρήνη ὑμῖν
  choice: あなたがたに平安があるように
  rationale: 動詞のない簡潔なギリシア語の挨拶を、日本語として明瞭で荘重な祝福の表現にする。「平安あれ」より現代の一般読者に理解しやすい。
- source_word: καθὼς
  choice: ～ように
  rationale: 父によるイエスの派遣と、イエスによる弟子たちの派遣との対応関係を簡潔に表す。
- source_word: ἀπέσταλκέν
  choice: 遣わされた
  rationale: 完了形が示す、すでに行われ現在も意義を持つ派遣を文脈上自然に表す。日本語では「遣わしておられる」よりも明瞭で、父を主語とする敬語表現にも適する。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 原文に明示されない所有代名詞「わたしの」を補わず、ヨハネ文書に特徴的な呼称を保つ。
- source_word: κἀγὼ
  choice: わたしも
  rationale: καίとἐγώの結合が示す対応と主語の強調を、日本語の「も」で自然に表す。
- source_word: πέμπω
  choice: 遣わす
  rationale: 現在形によるこの場での任命・派遣を、直接的な宣言として自然に表す。「遣わしている」では継続中の移動を過度に連想させるため避ける。
theological_decisions:
- issue: 父によるイエスの派遣と、イエスによる弟子たちの派遣との関係
  choice: 「父がわたしを遣わされたように、わたしもあなたがたを遣わす」
  alternative: 「父がわたしを遣わされたのと全く同じ権威で、わたしもあなたがたを派遣する」
  rationale: 原文が示す使命上の対応関係を保ちつつ、権威、様式、職務があらゆる点で同一だという教理的説明を付加しない。比較の重みと余白をそのまま残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には簡潔で dignified な調子を保った。「平安があるように」は日常的すぎず古語的すぎない祝福表現とした。敬称「イエス様」は原文にないため用いず、父を主語とする動詞には自然な尊敬表現「遣わされた」を用いた。
