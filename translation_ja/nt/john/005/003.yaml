  text: ἐν ταύταις κατέκειτο ⸀πλῆθος τῶν ἀσθενούντων, τυφλῶν, χωλῶν, ⸀ξηρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/003.yaml
  text: In these lay a multitude of the sick[a], blind, lame, and paralyzed.
translation:
  language: ja
  text: それらの回廊には、病気の人、目の見えない人、足の不自由な人、手足の萎えた人[a]が大勢、横たわっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「乾いた人」。手足などが萎縮した人を指すと考えられ、「体の麻痺した人」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταύταις
  choice: それらの回廊には
  rationale: 女性複数の指示語が前節の「回廊」を指すことを、日本語で自然かつ明確に示した。名詞は本節に明記されていないが、前節から補っている。
- source_word: κατέκειτο
  choice: 横たわっていた
  rationale: 未完了過去が表す継続的な状態と、κατάκειμαιの「横になっている」という意味を自然な日本語で伝える。
- source_word: πλῆθος
  choice: 大勢
  rationale: 多数の人々という集合的な意味を、現代日本語で簡潔に表した。
- source_word: τῶν ἀσθενούντων
  choice: 病気の人
  rationale: ここでは身体的な病や衰弱のある人々を指すため、「弱い人」ではなく「病気の人」とした。
- source_word: τυφλῶν
  choice: 目の見えない人
  rationale: 意味を明確に保ちつつ、現代日本語で自然で配慮ある表現とした。
- source_word: χωλῶν
  choice: 足の不自由な人
  rationale: 歩行に障害のある状態を指すχωλόςを、侮蔑的に響かない明瞭な現代語で表した。
- source_word: ξηρῶν
  choice: 手足の萎えた人
  rationale: 字義的な「乾いた、萎えた」という身体的表現を保ち、文脈上は手足が萎縮して機能しない人を指すことが伝わるようにした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、列挙される人々を簡潔かつ尊重ある表現で示した。前節とのつながりを明確にするため「回廊」を補った。
