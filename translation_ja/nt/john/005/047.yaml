  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: ja
  text: しかし、あなたがたがモーセの書いたもの[a]を信じないなら、どうしてわたしのことばを信じるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼の手紙」。ギリシア語は「手紙」または「書かれたもの」を意味し、ここではモーセが書いたものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、…なら
  rationale: δέの対照を「しかし」で示し、εἰによる条件を自然な現代日本語の「なら」で表した。
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: その人の書いたもの
  rationale: ἐκείνουは直前の文脈のモーセを指すが、原文どおり名を繰り返さない。γράμματαはここでは文字そのものではなく、モーセが書いたものを指すため、この表現とした。
- source_word: οὐ πιστεύετε
  choice: 信じない
  rationale: 与格を伴うπιστεύωは、ここでは書かれた証言を真実として受け入れる意味であり、「信じる」が二つの節の並行も保つ。
- source_word: πῶς
  choice: どうして
  rationale: 後半の未来形と結びつく修辞疑問を、能力の不可能性に限定せず自然に表す。
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: わたしのことば
  rationale: ῥήματαを、モーセの書いたものと対照されるイエスの語ったことばとして、簡潔かつ格調を保って訳した。
- source_word: πιστεύσετε
  choice: 信じるでしょうか
  rationale: 未来直説法を「でしょうか」で表し、前半と同じ「信じる」を用いて原文の反復を保った。
theological_decisions:
- issue: ἐκείνουの指示対象
  choice: 本文では「その人」とし、文脈上モーセを指す
  alternative: 本文で「モーセ」と明示する
  rationale: 5:45–46でモーセが明示されているため指示対象は明らかだが、本文では原文の代名詞表現を保った。
- issue: πιστεύωの意味
  choice: 両節とも「信じる」
  alternative: 「信頼する」
  rationale: ここではモーセの書いた証言とイエスのことばを真実として受け入れることが焦点であり、「信じる」が適切である。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「わたし」「ことば」によって聖書本文としての落ち着いた格調を保った。原文の対照、条件文、修辞疑問、および「信じる」の反復を維持した。
