  text: I do not receive glory from men[b][a],
translation:
  language: ja
  text: 私は、人々からの栄光[a]を受けない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「栄光」は、「誉れ」または「称賛」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: 栄光
  rationale: 文脈上は人から与えられる誉れ・称賛を指すが、ヨハネ福音書全体における「栄光」という語のつながりを保つため、「栄光」とした。
- source_word: παρὰ ἀνθρώπων
  choice: 人々から
  rationale: παρά＋属格の起点・源を「から」で表した。ἀνθρώπωνはここでは人間一般を指すため、現代日本語で自然な「人々」とした。
- source_word: οὐ λαμβάνω
  choice: 受けない
  rationale: λαμβάνωの基本的な意味を保ち、現在形を自然な日本語の非過去形で訳した。「求めない」などの解釈的な補足は本文に加えていない。
theological_decisions:
- issue: イエスと人からの評価との関係
  choice: イエスは人々を源とする栄光を受けないと述べている
  alternative: 人から誉れを求めない、または人の称賛によって自らを正当化しないという意味を明示する
  rationale: 文脈上その含意はあるが、原文は「求める」ではなく「受ける」と述べる。人間からの誉れを一切いかなる意味でも受けないという絶対的主張に狭めず、原文の簡潔さと神学的緊張を残した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。「人間から」より自然な「人々から」を用い、文の荘重さを保った。
