id: JHN.5.23
reference: John 5:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: ja
  text: それは、すべての人が、父を敬うのと同じように、子を敬うためである。子を敬わない者は、子を遣わした父を敬わない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: それは～ためである
  rationale: 目的を表す接続詞の力を明確に保ちつつ、前文を受ける日本語として自然にした。
- source_word: πάντες
  choice: すべての人
  rationale: 主語としての意味を明示し、現代日本語で誤解なく読める形にした。
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: 敬う
  rationale: 相手にふさわしい尊敬を示す意味を簡潔に表し、原文で反復される動詞を訳文でも一貫して反復した。
- source_word: τὸν υἱὸν
  choice: 子
  rationale: 文脈上イエスを指す称号として、日本語聖書で自然な表現を採用した。
- source_word: καθὼς
  choice: ～のと同じように
  rationale: 単なる類似より強い対応関係を示す比較の力を保った。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 文脈上、神である父を指す関係的称号として簡潔に訳した。
- source_word: ὁ μὴ τιμῶν
  choice: 敬わない者
  rationale: 冠詞付き分詞の一般的・格言的な主語を、自然で簡潔な日本語にした。
- source_word: τὸν πέμψαντα αὐτόν
  choice: その子を遣わした
  rationale: 分詞句が父を修飾する構造を保ち、αὐτόνの指示対象が子であることを日本語で明確にした。
- source_word: πέμψαντα
  choice: 遣わした
  rationale: ヨハネ文書における派遣の含意にふさわしく、単なる移動以上の使命を帯びた『送る』を自然に表す。
theological_decisions:
- issue: 子を敬うことと父を敬うことの比較の強さ
  choice: 「父を敬うのと同じように」と訳し、καθὼςの強い対応を保った。
  alternative: 「父を敬うように」
  rationale: 原文が示す比較を弱めず、同時に後代の教理用語を本文へ持ち込まないため。
- issue: 「父」と「子」の表記
  choice: 「父」「子」と表記した。
  alternative: 「御父」「御子」
  rationale: 原文の関係的称号を保ちながら、特定の教派的・文語的な敬称を加えず、現代標準日本語として明快にするため。
- issue: 二つの否定文の関係
  choice: 「子を敬わない者は、その子を遣わした父を敬っていない」と断定形で保った。
  alternative: 「子を敬わない者は、父をも敬わない」
  rationale: 原文の論理的な断定と、父が子を遣わした方であるという修飾を省略せずに保持するため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の「敬う」の三度の反復と、父・子の並行関係を維持した。節単独ではἵναが前文を受けるため、「それは」で接続を示した。
