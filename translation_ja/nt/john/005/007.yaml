id: JHN.5.7
reference: John 5:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: ja
  text: 病気の人は答えた。「主よ、水がかき立てられたとき、私を池に入れてくれる人がいません。私がそこへ向かう間に、ほかの人が私より先に降りてしまうのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: 病気の人
  rationale: 分詞の実質的用法を、文脈に即して自然な現代日本語で表した。病名や障害の性質は特定しない。
- source_word: Κύριε
  choice: 主よ
  rationale: κύριε の通常の呼びかけを保持し、イエスへの敬意と、ヨハネ福音書における「主」の含意を訳文で狭めない。
- source_word: ταραχθῇ τὸ ὕδωρ
  choice: 水がかき立てられたとき
  rationale: 受動態と水の動きを表す語義を保持した。何が水を動かすのかは本文がここで明示しないため補わない。
- source_word: βάλῃ με εἰς τὴν κολυμβήθραν
  choice: 私を池に入れてくれる
  rationale: 直訳的な「投げ入れる」が日本語では不必要に乱暴な印象を与えるため、介助して池へ入れるという文脈上の意味を自然に表した。
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: 私が行こうとしている間に
  rationale: 本人が池へ向かっている途中であることを自然に表し、自力で歩けたかどうかは断定しない。
- source_word: καταβαίνει
  choice: 降りてしまう
  rationale: 池へ「下る」という空間的表現を保持しつつ、先を越されるという話者の困窮を自然な日本語で示した。
theological_decisions:
- issue: Κύριε が単なる敬称か信仰告白としての「主」か
  choice: 主よ
  alternative: だんな様／先生
  rationale: 原語は双方の幅を持ちうる。「主よ」は原語との語彙的連続性を保ち、病人の理解の程度を訳者が確定しない。
- issue: 水が動く原因
  choice: 原因を明示しない
  alternative: 御使いが水を動かしたと補う
  rationale: 提示されたSBLGNTの本節は原因を述べていないため、後代の異読や周辺説明を本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語。病人の切迫感を保ちながら、過度に口語的または古風にならない丁寧な発話とした。
