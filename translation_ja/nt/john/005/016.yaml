  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: ja
  text: このため、ユダヤ人たち[a]はイエスを迫害していた。イエスが安息日にこのようなことをしていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」とも訳せる。文脈上は「ユダヤ人の指導者たち」を指す可能性もある。ヨハネ福音書では、この語がしばしばイエスに敵対する特定の集団を指し、すべてのユダヤ人を一律に指すわけではない。
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前の出来事を迫害の原因として指し示す因果関係を、簡潔で自然な日本語で表す。
- source_word: ἐδίωκον
  choice: 迫害していた
  rationale: 未完了過去の継続的・反復的な敵対行為を保持しつつ、18節に明示される殺意までは先取りしない。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 語の直接的な民族宗教的呼称を本文に保ち、「指導者たち」と解釈的に限定しない。文脈上の指示範囲は脚注で説明する。
- source_word: ταῦτα
  choice: このようなこと
  rationale: 直前に語られた行為を指す複数指示語の意味を、日本語として自然に表現する。
- source_word: ἐποίει
  choice: していた
  rationale: 未完了過去が示す継続・反復の相を自然な日本語で反映する。
- source_word: ἐν σαββάτῳ
  choice: 安息日に
  rationale: 安息日の時間内に行われたことを、標準的かつ明瞭な日本語で示す。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示対象
  choice: 本文では「ユダヤ人たち」
  alternative: 「ユダヤ地方の人々」または文脈上「ユダヤ人の指導者たち」
  rationale: 原語の直接的な表現を維持し、本文だけで指導者層に限定しない。一方、ヨハネの文脈ではイエスに敵対する特定集団を指すことが多く、すべてのユダヤ人を一括して指すとは限らないため、脚注でその緊張を保持する。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「迫害していた」「していた」により原文の未完了過去の継続性を反映した。脚注記号 [a] は該当語句の直後に置いた。
