- from: まことに、まことに、あなたがたに言います。死者たちが神の子の声を聞く時が来ます。そして、それは今です。その声を聞いた者たちは生きます。[a]
  to: まことに、まことに、あなたがたに言います。死者たちが神の子の声を聞く時が来ます。しかも、その時は今です。その声を聞いた者たち[a]は生きます。
  rationale: 原文の「時が来る」と「今である」の並置を、一つの時を指す自然な日本語として整えました。死者の意味、聞くことの含意、また「生きる」の意味は限定していません。脚注はアオリスト分詞に対応する句へ移動しました。
