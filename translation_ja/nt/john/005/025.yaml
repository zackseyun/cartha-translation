review_pass:
  verdict: revise
  source_fidelity: 原文の主要な意味はおおむね保たれていますが、「時が来ます。そして、それは今です」は、ἔρχεται ὥρα καὶ νῦν ἐστιν の一続きの宣言として不自然に分断されています。接続語καίの「しかも／そして」の重なりを明示し、「今」がその「時」を指すことを自然に示すのが適切です。
  naturalness: 「その時は今です」は明瞭な現代標準日本語であり、未来的な到来と現在性との緊張を、説明的に解消せずに表せます。「まことに、まことに、あなたがたに言います」および「神の子」は、荘重さと読みやすさのバランスが取れています。
  terminology: 「死者たち」「神の子」「声」「生きます」はいずれも原文の曖昧さと神学的な含意を不必要に限定しません。「聞いた者たち」はアオリスト分詞の先行性を表す許容範囲の訳です。
  issues:
  - severity: medium
    issue: 「時が来ます。そして、それは今です」の分断と指示語
    rationale: ギリシア語は「時が来ている、しかも今である」と同一の「時」について述べています。現行文は「そして、それは」と文を切るためややぎこちなく、何が「今」なのかも一瞬不明瞭です。「しかも、その時は今です」とすることで、原文の接続と指示関係を自然に保てます。
  - severity: low
    issue: 脚注アンカーの位置
    rationale: 語彙代替は分詞「聞いた者たち」に関わるため、文末ではなく当該句の直後に置くほうが脚注の対象が明確です。
  revised_text: まことに、まことに、あなたがたに言います。死者たちが神の子の声を聞く時が来ます。しかも、その時は今です。その声を聞いた者たち[a]は生きます。
