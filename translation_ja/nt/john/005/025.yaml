id: JHN.5.25
reference: John 5:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: ja
  text: まことに、まことに、あなたがたに言います。死者たちが神の子の声を聞く時が来ます。しかも、その時は今です。その声を聞いた者たち[a]は生きます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その声を聞く者たちは生きます」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: 荘重な強調の反復を保ちつつ、現代日本語で意味が明瞭な表現とした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 複数への直接の呼びかけと、ヨハネ福音書に特徴的な改まった調子を保つ。
- source_word: ἔρχεται ὥρα καὶ νῦν ἐστιν
  choice: 時が来ます。そして、それは今です
  rationale: ὥραを文脈に適した自然な日本語の「時」とし、未来と現在が重なる緊張を明示的な補語「それ」で保った。
- source_word: οἱ νεκροὶ
  choice: 死者たち
  rationale: 霊的な死か肉体的な死かを限定せず、複数の人々を指すことを自然に表した。
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: 声を聞く
  rationale: 人格的な発声を指すφωνήを「声」とし、応答や服従まで訳文に加えないようἀκούωを「聞く」とした。
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: 神の子
  rationale: ギリシア語のキリスト論的称号を簡潔かつ伝統的な日本語で直接表した。
- source_word: οἱ ἀκούσαντες
  choice: その声を聞いた者たち
  rationale: アオリスト分詞の先行的な相を「聞いた」で示し、何を聞いた者かが日本語で明確になるよう「その声」を補った。
- source_word: ζήσουσιν
  choice: 生きます
  rationale: 復活だけに意味を狭める「生き返ります」を避け、ζάωの広がりを保った。
theological_decisions:
- issue: 「死者たち」が指すもの
  choice: 解釈を加えず「死者たち」とした
  alternative: 霊的に死んでいる者たち／肉体的に死んだ者たち
  rationale: 「それは今です」は現在的な意味を示唆する一方、周辺文脈は将来の肉体的復活も扱うため、訳文で一方に限定しない。
- issue: 未来と現在の関係
  choice: 「時が来ます。そして、それは今です」
  alternative: 「その時はすでに来ています」
  rationale: 未来形ἔρχεταιと現在表現νῦν ἐστινを同化せず、到来しつつあり既に現在でもあるという緊張を保った。
- issue: 「聞いた者たち」の時制・相
  choice: アオリスト分詞を「聞いた者たち」とした
  alternative: 「聞く者たち」
  rationale: 原文の形を反映し、声を聞くことに続いて生きるという関係を示す。ただし格言的・未来的文脈では現在的に理解する余地もあるため脚注を付した。
translation_notes:
  register: 明瞭で現代的かつ荘重な標準日本語。「まことに」の反復と丁寧体によりイエスの厳粛な宣言の調子を保った。
