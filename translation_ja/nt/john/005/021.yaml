id: JHN.5.21
reference: John 5:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: ja
  text: というのも、父が死者を起こし、命を与えるのと同じように、子もまた、子が望む者に命を与えるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 〜ように、〜からです
  rationale: ὥσπερの比較を「〜ように」で示し、γάρの説明的な働きを文末の「〜からです」で自然に表した。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: ヨハネ文書の文脈で神を指す称号として、現代日本語の聖書文体に自然な「父」とした。
- source_word: ἐγείρει τοὺς νεκρούς
  choice: 死者たちを起こして
  rationale: 復活の文脈にあるἐγείρωを「起こす」とし、τοὺς νεκρούςの集合的かつ複数的な指示を「死者たち」で明示した。
- source_word: ζῳοποιεῖ
  choice: 命を与える
  rationale: 単なる回復に限定せず、命をもたらすという語義を明瞭で自然な日本語にした。二つの用例を同じ表現で訳し、父と子の並行を保った。
- source_word: οὕτως καὶ
  choice: 子もまた
  rationale: 父の働きに対応する子の働きを「もまた」で示し、比較の並行関係を保った。
- source_word: ὁ υἱὸς
  choice: 子
  rationale: 父との対句にあるキリスト論的称号として、説明を加えず「子」とした。
- source_word: οὓς θέλει
  choice: 自分が望む者たちに
  rationale: θέλειの意志的意味を「望む」で表し、主語が子であることを日本語で明瞭にするため「自分が」を補った。οὓςの複数性は「者たち」で表した。
theological_decisions:
- issue: 父と子による命付与の並行関係
  choice: 父が命を与えるのと同様に、子も命を与えるという明示的な並行を保つ
  alternative: キリスト論的含意を弱めるため、比較をより緩やかに訳す
  rationale: 原文のὥσπερ…οὕτως καίは、父と子の命を与える働きを意図的に対応させている。訳文はその強い並行を保持しつつ、存在論的説明を付加しない。
- issue: θέλειが表す子の意志
  choice: 自分が望む
  alternative: 自分が欲する／自分の意志のままに
  rationale: 子の主体的な意志を保ちながら、現代標準日本語として自然で、過度に硬質または口語的にならない表現を選んだ。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「死者たち」「者たち」により原文の複数形を可視化し、二度のζῳοποιεῖは同じ「命を与える」で統一した。
