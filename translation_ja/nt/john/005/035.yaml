id: JHN.5.35
reference: John 5:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: ja
  text: 彼は、燃えて輝くともしびだった。あなたがたはしばらくの間、その光の中で大いに喜ぶことを望んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνος
  choice: あの人
  rationale: 文脈上はバプテスマのヨハネを指す強意的な指示代名詞であり、「あの人」として指示性を保った。
- source_word: λύχνος
  choice: ともしび
  rationale: 携帯用の灯火を指し、抽象的な「光」ではない。ヨハネが光そのものではなく、光を放つ灯火であるという区別も保たれる。
- source_word: καιόμενος καὶ φαίνων
  choice: 燃えて輝く
  rationale: 二つの現在分詞が表す継続的な働きを、簡潔で自然な連体表現にした。φαίνων はここでは「現れる」ではなく、光を放つ意味。
- source_word: ἠθελήσατε
  choice: 喜ぼうとした
  rationale: 意志・望みを表すアオリストとして、その時の自発的な反応を示す。持続的な願望まで含意しない表現とした。
- source_word: ἀγαλλιαθῆναι
  choice: 大いに喜ぶ
  rationale: 強い喜びや歓喜を表すため、単なる「喜ぶ」より強意を明示した。
- source_word: πρὸς ὥραν
  choice: しばらくの間
  rationale: 文字どおりの六十分ではなく、限られた期間を表す慣用句として訳した。
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: その光の中で
  rationale: 前置詞 ἐν と光の比喩を保ち、ヨハネの証言による照らしの中で喜ぶという像を自然な日本語で表した。
theological_decisions:
- issue: ヨハネ福音書における、ヨハネとイエスの光の比喩上の区別
  choice: ヨハネを「ともしび」と訳し、「光」そのものとはしない。
  alternative: 「あの人は光であった」
  rationale: 原文は φῶς ではなく λύχνος を用いる。ヨハネは光を証しする者であって究極の光そのものではないという本文上の区別を、説明の付加なしに保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、比喩の対照が伝わるよう「ともしび」と「光」を区別した。「大いに喜ぶ」で原語の強い歓喜を示し、全体は朗読にも適する簡潔で品位ある文体とした。
