- from: あの人は、燃えて輝くともしびであった。あなたがたは、その光の中で、しばらくの間[a]、大いに喜ぼうとした。
  to: 彼は、燃えて輝くともしびだった。あなたがたはしばらくの間、その光の中で大いに喜ぶことを望んだ。
  rationale: 原文の「燃えて輝くともしび」と「その光」の対照を維持したまま、意志を表す動詞を日本語で明確にした。「彼は」は文脈上の指示対象を自然に受け、「大いに喜ぶことを望んだ」は強い歓喜と一時的な意向の双方を表す。脚注はπρὸς ὥρανの慣用的意味を適切に説明しているため維持する。
