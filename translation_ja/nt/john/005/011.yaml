  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: ja
  text: しかし彼は彼らに答えた。「私を治してくれたその人が、私に『敷物[a]を取り上げて、歩きなさい』と言ったのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寝床」とも訳せる。ギリシア語は、簡素な寝具である敷物や寝床を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: ヨハネの対話叙述における標準的な応答動詞として、自然で直接的な現代日本語を用いた。
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: 私を治してくれたその人
  rationale: 身体が健やかな状態にされたという文脈上の意味を「治してくれた」で自然に表し、分詞句と後続の強意代名詞を「その人」にまとめた。
- source_word: ἐκεῖνός
  choice: その人が
  rationale: 単なる「彼」ではなく「その人」として、ギリシア語の指示的・強意的な響きを保った。
- source_word: Ἆρον
  choice: 持ち上げて
  rationale: 具体物を取り上げる命令を明瞭に表す。文脈上は携えて運ぶことを含むが、「担いで」と限定しすぎない表現を選んだ。
- source_word: κράβαττον
  choice: 敷物
  rationale: 大型家具としての「ベッド」ではなく、簡素な寝具や寝床を指す語なので、現代の読者に誤解されにくい語を選んだ。
- source_word: περιπάτει
  choice: 歩きなさい
  rationale: 現在命令形が持ち得る継続性を過度に明示せず、癒やしの命令として自然な日本語にした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の問いかけや非難に対する応答の軽い対照を示した。
theological_decisions:
- issue: 癒やしを表す ὑγιῆ の範囲
  choice: 治してくれた
  alternative: 完全なものにしてくれた
  rationale: この文脈では身体の癒やしが直接述べられている。「完全なものにした」などの表現が帯び得る広い霊的含意を持ち込まず、具体的な治癒の主張を訳した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。癒やされた人の発言として過度に古風または宗教的な語調にせず、引用内の命令は簡潔で dignified な「歩きなさい」とした。
