  text: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: ja
  text: というのも、あなたがたがモーセを信じていたなら、わたしをも信じたはずです。モーセがわたしについて書いたからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: 〜なら、…のですから
  rationale: γάρが前の議論に理由を添える働きは、文末の「のですから」で自然に示し、εἰによる条件は「なら」で表した。
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: モーセを信じていた
  rationale: πιστεύω＋与格は、ここでは人物の言葉や証言を真実として受け入れる意味。未完了過去と反事実条件を踏まえ、「信じていたなら」とした。
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: わたしをも信じたはずです
  rationale: 未完了過去＋ἄνによる反事実条件の帰結を「信じたはずです」で表した。ἐμοίは与格であり、εἰςがないため「わたしを信じる」とし、「も」でモーセとの対応を自然に示した。
- source_word: περὶ γὰρ ἐμοῦ
  choice: わたしについて…のですから
  rationale: περί＋属格の「〜について」をそのまま明瞭な現代日本語で表し、γάρの理由提示も保持した。
- source_word: ἐκεῖνος
  choice: 彼
  rationale: 強意的な指示代名詞だが、直前のモーセを指すことが明らかなので自然な日本語の「彼」とした。
- source_word: ἔγραψεν
  choice: 書いた
  rationale: アオリストの事実叙述を自然な過去形で訳した。
theological_decisions:
- issue: モーセの文書とイエスとの関係
  choice: 彼はわたしについて書いた
  alternative: あの方はわたしに関して書いた
  rationale: モーセの文書がイエスについて証言するという本文の主張を保ちつつ、特定の箇所や解釈方法を訳文に付加しなかった。
- issue: πιστεύω＋与格の意味
  choice: モーセを信じる／わたしを信じる
  alternative: モーセに信頼する／わたしを信じる
  rationale: 両節で同じ動詞と同じ与格構文が用いられている対応を保持し、「信じる」と統一した。「わたしを信じる」は、原文にないεἰςを補う「わたしを信仰する」より限定の少ない表現である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あなたがた」「わたし」により福音書の対話文として自然な調子を保ち、反事実条件は「〜ていたなら、〜たはずです」で明示した。
