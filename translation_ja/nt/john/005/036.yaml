id: JHN.5.36
reference: John 5:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: ja
  text: しかし、私にはヨハネの証しにまさる証しがある[a]。父が、私が成し遂げるために与えてくださった業、すなわち私が行っているその業そのものが、私について、父が私を遣わされたことを証ししている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ヨハネよりも大きな証しがある」。文脈上、「ヨハネの証しにまさる」という意味。
    reason: 比較の属格 τοῦ Ἰωάννου にある省略を補った本文訳と、原文のより直訳的な形を併記するため。
lexical_decisions:
- source_word: μαρτυρίαν
  choice: 証し
  rationale: 証言・証拠としての働きを含むヨハネ文書の法廷的な響きを保ちつつ、現代日本語として自然である。
- source_word: μείζω τοῦ Ἰωάννου
  choice: ヨハネの証しにまさる
  rationale: 比較級の強さを「まさる」で表し、属格を文脈上省略された「ヨハネの証し」と解した。属格のより直訳的な形は脚注に残した。
- source_word: ἔργα
  choice: 業
  rationale: 奇跡だけに限定せず、イエスに託された働き全体を指し得る神学的な幅を保つため、「行い」より重みのある「業」とした。
- source_word: δέδωκέν μοι ὁ πατήρ
  choice: 父が…私に与えてくださった
  rationale: 完了形が示す、すでに与えられ現在も効力を持つ委託を自然な日本語で表した。
- source_word: ἵνα τελειώσω αὐτά
  choice: 私が成し遂げるために
  rationale: ἵνα節の目的を明示し、τελειόωを単なる終了ではなく、託された務めを完成に至らせる意味の「成し遂げる」とした。
- source_word: αὐτὰ τὰ ἔργα ἃ ποιῶ
  choice: 私が行っているその業そのもの
  rationale: αὐτάの強調と、ποιῶの継続中の現在的な働きをともに表した。
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: 私について…証ししている
  rationale: περὶ ἐμοῦを省かず、業がイエスの由来と使命を裏づける証言となることを示した。
- source_word: ἀπέσταλκεν
  choice: 遣わされた
  rationale: 派遣という語感と完了形の継続的意義を保ち、父を主語とする敬意表現として自然にした。
theological_decisions:
- issue: イエスを裏づける証しの性質
  choice: 父から託された業全体が、イエスが父から遣わされたことを証しする
  alternative: 業を奇跡だけに限定し、それだけが権威を証明すると読む
  rationale: ἔργαは奇跡を含み得るが、それに限定されない。本文自体がその業を父から与えられたものとし、イエスの派遣を証しすると述べているため、その幅を保った。
- issue: ὁ πατήρの訳
  choice: 父
  alternative: 神／私の父
  rationale: 原文には「神」や所有代名詞が明記されていないため、称号的な「父」をそのまま保持した。
- issue: τοῦ Ἰωάννουの比較対象
  choice: ヨハネの証し
  alternative: ヨハネ本人
  rationale: 文脈上は直前から続くヨハネの証しが比較対象と考えるのが自然だが、ギリシア語は文字どおりには「ヨハネより」とも取れる形なので、脚注でその形を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「証し」「業」「遣わす」によってヨハネ福音書の法廷的・神学的な重みを保持した。父に対する敬意は自然な敬語で表したが、原文にない教派的な解釈は加えていない。
