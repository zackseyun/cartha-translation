id: JHN.5.10
reference: John 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: ja
  text: そこで、ユダヤ人たちは癒やされた人に[a]言っていた。「今日は安息日だ。あなたが寝床を担ぐことは許されていない[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人たち」は、ここでは「ユダヤ人の指導者たち」または「ユダヤ地方の人々」を指す可能性もある。
    reason: alternative_reading
  - marker: b
    text: 「寝床」は、持ち運べる簡素な敷物や寝台を指す。また「担ぐ」は「持ち上げる」「取り上げる」とも訳せる。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: 言った
  rationale: 未完了形は継続・反復を含み得るが、この場面では日本語の自然な物語文として「言った」とし、発言の導入を明瞭にした。
- source_word: οὖν
  choice: そこで
  rationale: 直前の癒やしと、男が寝床を担いで歩いたことを受けた物語上の帰結・進行を自然に示す。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: ギリシア語の表現を狭めずに訳した。ヨハネ文書では指導者層やユダヤ地方の人々を指す可能性もあるため、注記で曖昧さを保持した。
- source_word: τῷ τεθεραπευμένῳ
  choice: 癒やされた人に
  rationale: 完了受動分詞が示す、癒やしが完了し、その結果が続いている状態を簡潔に表す。
- source_word: Σάββατόν ἐστιν
  choice: 今日は安息日だ
  rationale: 日本語では日についての発言であることを補う「今日は」が自然であり、安息日当日であるという意味を明瞭にする。
- source_word: οὐκ ἔξεστίν σοι
  choice: あなたには許されていない
  rationale: 安息日規定を背景とする許可・適法性を表しつつ、現代日本語として自然な表現を採った。
- source_word: ἆραι
  choice: 担ぐ
  rationale: αἴρωは「持ち上げる」「取り上げる」「運ぶ」の幅を持つ。この文脈では携帯用寝床を持って移動する行為への非難なので「担ぐ」が具体的で自然。
- source_word: κράβαττον
  choice: 寝床
  rationale: 携帯できる簡素な寝具・敷物を指す。「ベッド」では大型家具を連想させやすく、「寝床」は文脈に合う広さを保つ。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示対象
  choice: ユダヤ人たち
  alternative: ユダヤ人の指導者たち／ユダヤ地方の人々
  rationale: この節だけでは指導者層とも地理的なユダヤ人とも明示されていないため、本文では語義を狭めない。ヨハネにおける文脈依存の可能性は脚注に残す。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、会話には安息日規定をめぐる公的な非難の響きを残した。「癒やす」は聖書本文にふさわしい品位を保ちながら一般読者にも理解できる表記とした。
