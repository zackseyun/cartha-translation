  text: καὶ ἐξουσίαν ἔδωκεν ⸀αὐτῷ κρίσιν ποιεῖν, ὅτι υἱὸς ἀνθρώπου ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: ja
  text: また、父は子に、裁きを行う権威をお与えになった。子が人の子[a]だからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子が人間だから」。本文は、ヨハネ福音書では「人の子」が称号として用いられている可能性が高いことを反映している。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: 権威
  rationale: 単なる能力ではなく、父から授けられた正当な裁判権を表すため。
- source_word: ἔδωκεν αὐτῷ
  choice: 子に…お与えになった
  rationale: 直訳は「彼に与えた」。文脈上、与える方は父、受ける方は子なので、現代日本語で指示関係を明確にした。父を主語とする敬語表現は、自然で品位ある聖書文体にかなう。
- source_word: κρίσιν ποιεῖν
  choice: 裁きを行う
  rationale: 「裁きをなす」という司法的な意味を保ちつつ、現代日本語として自然に表した。
- source_word: ὅτι
  choice: だからである
  rationale: 権威が与えられた理由を示す因果用法として訳した。
- source_word: υἱὸς ἀνθρώπου
  choice: 人の子
  rationale: 冠詞はないが、ヨハネ福音書の文脈ではイエスの称号として読む可能性が高い。「人の子」は日本語聖書で定着した称号であり、ダニエル書との響きも保つ。
- source_word: ἐστίν
  choice: である
  rationale: 現在形の連結動詞を、理由節を結ぶ自然で品位ある文末にした。
theological_decisions:
- issue: υἱὸς ἀνθρώπουをキリスト論的称号として訳すか、人間性を表す一般表現として訳すか
  choice: 本文では称号「人の子」とした。
  alternative: 「一人の人の子だから」、または「人間だから」
  rationale: ヨハネ福音書における定着した自己称号と、裁きの権威を受ける者を描くダニエル書7章との関連を保つため。ただし、ギリシア語に冠詞がなく、人間性に重点を置く解釈も可能なので脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用い、「裁きを行う権威」で司法的意味を保持した。「また」は前節との連続を示す。指示対象を明確にするため、代名詞を「父」「子」とした。
