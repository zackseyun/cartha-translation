id: JHN.5.45
reference: John 5:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ δοκεῖτε ὅτι ἐγὼ κατηγορήσω ὑμῶν πρὸς τὸν πατέρα· ἔστιν ὁ κατηγορῶν ὑμῶν Μωϋσῆς, εἰς ὃν ὑμεῖς ἠλπίκατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: ja
  text: わたしが父の前であなたがたを訴えるのだと思ってはならない[a]。あなたがたを訴える者がいる。それは、あなたがたが望みを置いてきたモーセである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしが父の前であなたがたを告発するのだと思ってはならない」。
    reason: lexical_alternative
  - marker: b
    text: 彼らが信頼を寄せていたモーセ、特に律法の仲介者また証人であるモーセが、かえって彼らを訴える者となる、という意味。
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: 思ってはならない
  rationale: μήを伴う現在命令形の禁止を、直接的で自然な現代日本語として表した。
- source_word: κατηγορήσω
  choice: 訴える
  rationale: κατηγορέωの法廷的な意味を保ち、「罪に定める」のように最終的な判決まで含めない表現とした。
- source_word: πρὸς τὸν πατέρα
  choice: 父の前で
  rationale: 告発を表す動詞との組み合わせにある法廷的な場面を自然に示しつつ、ヨハネ福音書に特徴的な「父」という呼称を保持した。
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: あなたがたを訴える者がいる
  rationale: 別の告発者を提示する構文と現在分詞の継続的な含みを、明瞭な日本語で表した。
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語聖書で広く定着している固有名詞の表記を用いた。
- source_word: εἰς ὃν ὑμεῖς ἠλπίκατε
  choice: あなたがたが望みを置いてきた
  rationale: ἐλπίζωとεἰςが示す、ある者に望みを置く意味を保ち、完了形が示す過去から現在まで続く姿勢を「置いてきた」で表した。
theological_decisions:
- issue: イエスの発言における告発の法廷的意味
  choice: 「訴える」と訳す
  alternative: 「罪に定める」
  rationale: κατηγορέωは告発することを意味し、最終的な有罪宣告そのものを意味しないため、原文以上に強い司法的・教理的主張を加えない。
- issue: モーセに置かれた望みの対象
  choice: 「モーセ」を直接の対象として残す
  alternative: 「モーセの律法」または「モーセの書いたもの」
  rationale: 文脈上はモーセの書物や律法との関連があるが、原文はモーセ本人を直接名指ししているため、その緊張を本文に保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」「あなたがた」を用いて語りかけの直接性を保ち、法廷的な比喩は「父の前で」「訴える」によって自然に示した。
