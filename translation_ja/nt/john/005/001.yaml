id: JHN.5.1
reference: John 5:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ⸀ἦν ἑορτὴ τῶν Ἰουδαίων, καὶ ⸀ἀνέβη Ἰησοῦς εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: ja
  text: その後、ユダヤ人の祭りがあり、イエスはエルサレムに上られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: その後
  rationale: 直訳的な「これらのことの後」より自然な現代日本語で、出来事の後に続くというヨハネの物語上の移行を保つ。
- source_word: ἦν ἑορτὴ
  choice: 祭りがあり
  rationale: ἦνを存在表現として取り、宗教的な祝祭を表すἑορτήを、現代日本語で広く理解できる「祭り」とした。どの祭りかは原文が特定していないため補わない。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人の
  rationale: ここでは地域住民としての「ユダヤ地方の人々」ではなく、ユダヤ人が守る祭りを示す属格と解するのが文脈上自然である。
- source_word: ἀνέβη
  choice: 上られた
  rationale: エルサレムへの移動に慣用される「上る」という方向性を保持した。「られた」は主語イエスへの自然な敬意を示し、移動そのものに神学的意味を付加しない。
- source_word: Ἱεροσόλυμα
  choice: エルサレム
  rationale: 地名の現代日本語における標準的な表記。
theological_decisions:
- issue: ヨハネ文書におけるἸουδαίωνの指示範囲
  choice: 「ユダヤ人の」と訳す
  alternative: 「ユダヤ地方の人々の」
  rationale: Ἰουδαῖοιは文脈によって「ユダヤ人」と「ユダヤ地方の人々」の双方を表し得るが、本節ではἑορτήを修飾し、民族・宗教共同体の祝祭を指すため、「ユダヤ人」が最も自然である。
- issue: 祭りの特定
  choice: 名称を特定せず「祭り」とする
  alternative: 過越祭など、特定の祭りの名称を補う
  rationale: 原文には祭りの名称がなく、本文批評・解釈上も確定できないため、特定の祭りを補わない。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔で品位ある物語文とした。「その後」でギリシア語の慣用的な移行句を自然に表し、「上られた」によってエルサレムへ向かう方向性とイエスへの通常の敬意を両立させた。
