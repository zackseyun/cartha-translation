base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: ja
  text: イエスはその人に言われた。「起き上がりなさい。自分の寝床[a]を担いで、歩きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「床」とも訳せる。ギリシア語は、家具としての大きなベッドとは限らず、簡素な敷き寝具や携帯できる寝台を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語はヨハネの物語に多い歴史的現在だが、日本語で現在形の「言われる」とすると不自然になりやすいため、自然な物語文として過去形で表した。敬語の「言われた」はイエスの発言を現代標準語で品位を保って示す。
- source_word: αὐτῷ
  choice: その人に
  rationale: 与格の間接目的語を明示しつつ、文脈上の人物を自然な日本語で指す。「彼に」よりも、直前まで語られている人を指す表現として分かりやすい。
- source_word: Ἔγειρε
  choice: 起き上がりなさい
  rationale: 横たわっていた状態から身を起こす直接の命令を、自然で明確な現代日本語にした。「立ちなさい」では動作を狭く限定しすぎるため避けた。
- source_word: ἆρον
  choice: 持ち上げ
  rationale: αἴρωの、物を上げて取るという具体的動作を表す。「取り上げ」は現代日本語では話題として扱う、没収するなどの意味にも取られうるため避けた。
- source_word: κράβαττόν
  choice: 寝床
  rationale: 持ち運べる簡素な寝具を指す語であり、大型家具を連想させる「ベッド」より文脈に合う。「敷物」では寝具であることが不明瞭になりやすい。
- source_word: περιπάτει
  choice: 歩きなさい
  rationale: ここでは比喩ではなく身体的に歩くことを命じている。継続相を過度に明示せず、直接的な命令として訳した。
theological_decisions:
- issue: 癒やしの文脈におけるイエスの命令の性質
  choice: 起き上がること、寝床を持ち上げること、歩くことを直接の身体的命令として訳す。
  alternative: 「癒やされて立ちなさい」など、癒やしを命令文に明示する。
  rationale: 癒やしは文脈から明らかだが、この節のギリシア語本文には「癒やされる」という語はない。本文が述べる三つの命令に解釈的な語句を加えない。
translation_notes:
  register: 明瞭な現代標準語を用い、命令形は威圧的になりすぎない「〜なさい」で統一した。文体の品位を保ちながら、原文の簡潔で直接的な語調を維持した。
