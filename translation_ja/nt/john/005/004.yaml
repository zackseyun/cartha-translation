id: JHN.5.4
reference: John 5:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: robinson-pierpont-2005-byzantine
  text: Ἄγγελος γὰρ κατὰ καιρὸν κατέβαινεν ἐν τῇ κολυμβήθρᾳ, καὶ ἐτάρασσεν τὸ ὕδωρ· ὁ οὖν πρῶτος ἐμβὰς μετὰ τὴν ταραχὴν τοῦ ὕδατος, ὑγιὴς ἐγίνετο, ᾧ δήποτε κατείχετο νοσήματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: ja
  text: というのも、御使いが時折その池に降りて来て、水をかき動かしていたからである。そこで、水がかき動かされた後、最初に入った者は、どんな病にかかっていても、健康になった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節（および3節後半）は、現存する最初期のギリシア語パピルス（3世紀のパピルス66、75など）や、4世紀の主要写本（シナイ写本、バチカン写本）にはない。一方、ビザンツ系多数本文の伝統や初期のラテン語訳・シリア語訳には含まれている。池に病人たちが集まっていた理由を説明するため、早い時期に書記が加えた文と見る学者が多い。
    reason: textual_critical
lexical_decisions:
- source_word: ἄγγελος
  choice: 御使い
  rationale: 文脈では神的な使者を指すため、現代日本語の聖書文体で明瞭かつ自然な「御使い」とした。
- source_word: κατὰ καιρόν
  choice: 時折
  rationale: 一定の季節や厳密な周期と断定せず、折々に起きることを表す句として訳した。
- source_word: κατέβαινεν
  choice: 降りて来て…していた
  rationale: 未完了過去の反復・習慣的な側面を「時折」と「していた」によって自然な日本語で示した。
- source_word: ἐτάρασσεν
  choice: かき動かしていた
  rationale: 水を揺り動かすという具体的な意味を保ち、「かき乱す」ほど否定的な含みを強めない表現とした。
- source_word: ὁ πρῶτος ἐμβάς
  choice: 最初に入った者
  rationale: 分詞の先行動作を簡潔に表し、池の中へ入ることが自然に理解できる形とした。
- source_word: ὑγιὴς ἐγίνετο
  choice: 癒やされた
  rationale: 病から健康な状態になることを自然に表した。未完了過去の反復性は、前半から続く一般的・習慣的な叙述によって示される。
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: どのような病にかかっていても
  rationale: κατέχω の受動的な「病に捕らえられている」という意味を、日本語で自然な病態表現にした。
theological_decisions:
- issue: 御使いの行為を叙述者の事実認定として訳すか
  choice: 本文の文法どおり理由説明として直接叙述する
  alternative: 人々の信念や伝承として「と言われていた」とする
  rationale: 指定されたビザンツ本文には伝聞や信念を示す語がないため、その限定を訳文に加えなかった。
- issue: 治癒の表現
  choice: 「癒やされた」
  alternative: 「健康になった」
  rationale: ὑγιὴς ἐγίνετο は健康な状態になることを表す。「癒やされた」は文脈上自然だが、治癒の主体を明示的に補わない受動表現として、原文の神学的余白を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、理由を示す γάρ は「というのも…からである」、結果・展開を示す οὖν は「そこで」として論理関係を保持した。叙述全体の反復的な過去は「時折」「していた」と文脈で表した。
