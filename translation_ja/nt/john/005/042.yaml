  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: ja
  text: しかし、わたしはあなたがたを知っている。あなたがた自身の内には、神の愛[a]がない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神に対する愛」とも取れる。ギリシア語は、「神から来る愛」または「神ご自身の愛」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の文脈との強い対照を、現代日本語で自然かつ簡潔に示す。
- source_word: ἔγνωκα
  choice: 知っている
  rationale: 完了形が表す、知るに至った結果としての確かな現在の認識を自然な日本語で表す。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 二人称複数の直接目的語であることを明示する。
- source_word: ὅτι
  choice: 。あなたがたのうちには
  rationale: イエスが知っている内容を次の文として自然に提示する。日本語では逐語的な「ということを」より明瞭で、内容節の関係も保たれる。
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: 神の愛[a]
  rationale: 属格の「神に対する愛」「神から来る愛／神が持つ愛」という曖昧さを本文で限定せず、「神の愛」として保つ。主要な解釈は脚注で示す。
- source_word: οὐκ ἔχετε
  choice: がない
  rationale: 彼らがその愛を内に持っていない現在の状態を、簡潔で自然な日本語で表す。
- source_word: ἐν ἑαυτοῖς
  choice: あなたがたのうちには
  rationale: 各人の内面にその愛が存在しないことを表す。文脈上不自然になりやすい「自分自身の中に」を避けつつ、内在の意味を保つ。
theological_decisions:
- issue: 「神の愛」における属格 τοῦ θεοῦ の意味
  choice: 本文では「神の愛」とし、方向や起源を限定しない。
  alternative: 「神を愛する心」／「神から来る愛」／「神が持つ愛」
  rationale: 文脈上は神に向けられた愛を欠いているという理解が有力だが、ギリシア語の属格自体は複数の関係を許す。本文では神学的な緊張を保ち、脚注で解釈の幅を示す。
translation_notes:
  register: 明快な現代標準日本語。イエスの発言として簡潔さと威厳を保ち、「あなたがた」で複数を明示した。原文の内容節は日本語として自然な二文構成にした。
