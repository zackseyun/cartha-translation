  text: ὥσπερ γὰρ ὁ πατὴρ ἔχει ζωὴν ἐν ἑαυτῷ, οὕτως ⸂καὶ τῷ υἱῷ ἔδωκεν⸃ ζωὴν ἔχειν ἐν ἑαυτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/026.yaml
  text: For just as the Father has life in himself[b][a], so he also granted the Son to have life in himself.
translation:
  language: ja
  text: 父がご自身のうちにいのちを持っておられるように、同じように子にも、ご自身のうちにいのちを持つこと[a]をお与えになったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ご自身のうちにいのちを持つ」は、いのちがご自身に固有のものであることを指すと理解されることがある。本文では、「自存するいのち」のような神学的な言い換えをせず、ギリシア語の表現を保った。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: 〜ように、…からである
  rationale: ὥσπερ…οὕτως の対応を「〜ように」で示し、γάρの説明・根拠を文末の「からである」で自然に表した。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: ヨハネ文書における神への称号として、簡潔で定着した訳語を用いた。
- source_word: ἔχει ζωὴν ἐν ἑαυτῷ
  choice: ご自身のうちにいのちを持っておられる
  rationale: 現在形と前置詞句を明示し、父への敬意を自然な尊敬表現で示した。「自存するいのち」のような神学的術語への置換は避けた。
- source_word: οὕτως καὶ τῷ υἱῷ
  choice: 子にも
  rationale: ὥσπερとの相関は前半の「〜ように」と構文全体で表し、καίと与格は簡潔な「子にも」で再現した。
- source_word: ἔδωκεν
  choice: お与えになった
  rationale: 通常の意味である「与える」を保ち、アオリストを完了的な過去として訳した。文脈上の父の行為には自然な敬語を用いた。
- source_word: ζωὴν ἔχειν ἐν ἑαυτῷ
  choice: ご自身のうちにいのちを持つこと
  rationale: 不定詞構文を自然な日本語の名詞節にし、父について用いられた句との並行性を保った。
theological_decisions:
- issue: ἐν ἑαυτῷを「自存」などの神学的術語で明示するか
  choice: 「ご自身のうちに」と原文の表現を保つ
  alternative: 「自存するいのち」「ご自身に本来的ないのち」
  rationale: この句は自身に内在するいのちを示しうるが、技術的な教理用語に置き換えず、原文が持つ含意と余地を保存した。
- issue: 父が子にいのちを持つことをἔδωκενしたという関係をどう表すか
  choice: 「お与えになった」と明言する
  alternative: 「授けられた」「持たせられた」
  rationale: 父から子への『与える』という本文の語りを弱めず、同時に、その意味を後代の教理的説明で補ったり、子の神性を否定する方向へ解釈したりしない。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書本文にふさわしい品位を保った。「いのち」はヨハネ福音書で神的・永遠的な生命を含意する主要語として、ひらがなの慣用表記を採用した。父と子の並行を保ち、両者を指す再帰表現はいずれも「ご自身」とした。
