id: JHN.5.38
reference: John 5:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: ja
  text: また、あなたがたのうちには、父のことばがとどまっていません。父が遣わした方を、あなたがたは信じていないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον
  choice: ことば
  rationale: ここでは神が語り、啓示したことばを指す。「ことば」はヨハネ文書におけるλόγοςの語感を保ち、「メッセージ」より原文に近い。
- source_word: οὐκ ἔχετε ἐν ὑμῖν μένοντα
  choice: あなたがたのうちには…とどまっていません
  rationale: ἔχετεと現在分詞μένονταが表す、内に持続して存在する状態を、自然な現代日本語で表した。「宿っていません」も可能だが、μένωの継続性をやや明確にするため「とどまっていません」とした。
- source_word: ὅτι
  choice: …からです
  rationale: 後半が前半の理由を示す因果関係を明確に表す。
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: 父が遣わした方
  rationale: ἐκεῖνοςの指示対象は文脈上、父なる神である。日本語で曖昧になりやすい代名詞を「父」と明示し、敬意を伴う「方」で遣わされたイエスを指した。
- source_word: τούτῳ ὑμεῖς οὐ πιστεύετε
  choice: …方を、あなたがたは信じていない
  rationale: 前置されたτούτῳの強調を目的語の提示と読点によってある程度保ち、πιστεύω＋与格を簡潔に「…を信じる」と訳した。
theological_decisions:
- issue: 父のことばが内にとどまらないことと、遣わされたイエスを信じないこととの関係
  choice: イエスを信じていないことを、父のことばが彼らのうちにとどまっていない理由として述べる
  alternative: 聖書を内に保ち、従っていないことだけを指すと限定する
  rationale: ὅτιの因果関係をそのまま示しつつ、再生、内住、堅忍など特定の教理体系に踏み込まず、本文の神学的緊張を保った。
- issue: ἐκεῖνοςの指示対象
  choice: 「父」と明示する
  alternative: 「その方」または「彼」と訳す
  rationale: 直前までの文脈ではイエスを遣わした父を指す。現代日本語では代名詞の連続が不明瞭になるため、指示対象を明示したが、新たな解釈は加えていない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御言葉」は避け、一般読者にも理解しやすい「ことば」を採用した。「あなたがた」は複数形を明示し、原文の対照的な語順と非難の調子を保った。
