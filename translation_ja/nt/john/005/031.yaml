  text: Ἐὰν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἡ μαρτυρία μου οὐκ ἔστιν ἀληθής·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/031.yaml
  text: If I testify about myself[a], my testimony is not true.
translation:
  language: ja
  text: もしわたしが自分について証言するなら、わたしの証言は真実ではない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの証言は有効ではない」。証言の有効性が問われる法的な背景を反映した訳。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: もし〜なら
  rationale: 条件節を自然な現代日本語で表し、反復の意味を加えない。
- source_word: ἐγὼ
  choice: わたしが
  rationale: ギリシア語の明示された代名詞による穏やかな強調を保つ。
- source_word: μαρτυρῶ
  choice: 証言する
  rationale: 証人・証言という文脈を保ちつつ、現代日本語として自然である。
- source_word: περὶ ἐμαυτοῦ
  choice: 自分について
  rationale: περί＋属格の基本的な意味を直接表し、「自分のために」のような法廷的解釈を本文に加えない。
- source_word: ἡ μαρτυρία μου
  choice: わたしの証言
  rationale: 動詞「証言する」との語根上のつながりと、証拠・証言の含意を保つ。
- source_word: οὐκ ἔστιν ἀληθής
  choice: 真実ではない
  rationale: ἀληθήςの直接的な語義を保ち、単に法的に「有効ではない」と限定して解釈しない。
theological_decisions:
- issue: イエスが自らの証言を「真実ではない」と述べる意味
  choice: 本文では「真実ではない」と直接訳す。
  alternative: 「有効ではない」または「証言として認められない」
  rationale: ἀληθήςの語義とヨハネ8章14節との緊張をそのまま残す。証言に関する法的慣行を背景とする「有効ではない」という理解は可能だが、それを本文で確定しない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「わたし」を用い、文脈にある証言の法的含意と、字義上の「真実」との緊張を保った。
