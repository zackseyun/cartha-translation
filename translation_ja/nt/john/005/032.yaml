id: JHN.5.32
reference: John 5:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: ja
  text: わたしについて証しする別の方がおられる[a]。そして、その方がわたしについてなさる証しが真実であることを、わたしは知っている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしについて証言する別の方がおられる」。
    reason: μαρτυρέωは「証しする」とも「証言する」とも訳せるため。後者は法廷的な響きをより明示する。
lexical_decisions:
- source_word: ἄλλος
  choice: 別の方
  rationale: 直前の自己証言との対比を保ちつつ、人物を指す男性単数形であることを自然な日本語で示す。「もう一人」とすると人数の数え上げが前面に出るため避けた。
- source_word: ὁ μαρτυρῶν
  choice: 証しする
  rationale: 冠詞付き現在分詞の継続的・特徴的な働きを簡潔に表す。現代日本語で通じやすく、文脈にある証言の法廷的な響きも保持する。
- source_word: περὶ ἐμοῦ
  choice: わたしについて
  rationale: 属格を伴うπερίの、対象・主題を示す意味を自然かつ直接的に訳した。
- source_word: οἶδα
  choice: わたしは知っている
  rationale: 確かな認識を表す基本的な意味をそのまま訳し、強調された一人称主語も明示した。
- source_word: ἀληθής
  choice: 真実である
  rationale: 証しの内容が真実で信頼できることを表し、「有効である」などの解釈を加えない。
- source_word: ἡ μαρτυρία ἣν μαρτυρεῖ
  choice: その方が……なさる証し
  rationale: 同根の名詞と動詞の反復を「証しする／なさる証し」によって可能な範囲で保ちながら、日本語としての不自然な重複を抑えた。
theological_decisions:
- issue: 「別の方」（ἄλλος）の同定
  choice: 本文では指示対象を特定せず、「別の方」とした。
  alternative: バプテスマのヨハネ、父なる神、または法廷的な意味での別の証人と明示する。
  rationale: この節自体はその人物を明示していないため、周辺文脈に基づく特定の解釈を訳文へ持ち込まず、原文の曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「別の人」ではなく敬意と文脈上の含みを保つ「別の方」とした。「なさる」は同一文中での「証し」の過度な反復を避けつつ、指示対象を不用意に卑俗化しないための自然な表現である。
