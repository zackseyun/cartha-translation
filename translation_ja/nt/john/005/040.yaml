id: JHN.5.40
reference: John 5:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐ θέλετε ἐλθεῖν πρός με ἵνα ζωὴν ἔχητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/040.yaml
  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: ja
  text: それなのに、あなたがたは、いのちを得るためにわたしのもとに来ようとはしない。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「そして、あなたがたは、いのちを得るためにわたしのもとに来ようとしない」。ギリシア語の接続詞は単純に「そして」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヨハネ福音書で「いのち」はしばしば、神から与えられるいのち、すなわち永遠のいのちという豊かな意味を持つ。ただし、ここでは「永遠の」という語は明記されていない。
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: それなのに
  rationale: 通常は「そして」だが、直前で聖書がイエスについて証ししていると述べたことと、聞き手がイエスのもとに来ないこととの対照を文脈に即して自然に示す。
- source_word: οὐ θέλετε
  choice: 来ようとはしない
  rationale: θέλωの意志・望みの要素を保ちつつ、「拒んでいる」ほど強く断定しない現代日本語の表現。否定は不定詞「来る」と合わせて自然に訳した。
- source_word: ἐλθεῖν πρός με
  choice: わたしのもとに来る
  rationale: πρός＋対格を伴う表現を自然な日本語にし、ヨハネにおける信仰との関連を説明的に「信じる」と置き換えず、原文の具体的な比喩を保つ。
- source_word: ἵνα
  choice: ために
  rationale: ここでの目的を簡潔で自然な日本語によって表す。
- source_word: ζωὴν
  choice: いのち
  rationale: ヨハネ福音書では神からのいのちという深い含意を持つが、原文に「永遠の」はないため補わない。文脈上の重みを示すため、聖書語として自然な平仮名表記を用いる。
- source_word: ἔχητε
  choice: 得る
  rationale: 直訳的な「持つ」より、この文脈でいのちを受けて有することを自然に表す。「ために」と組み合わせて接続法を伴う目的構文を示す。
theological_decisions:
- issue: ζωὴνを「いのち」とするか「永遠のいのち」とするか
  choice: いのち
  alternative: 永遠のいのち
  rationale: ヨハネ文書で救いに関わる豊かな意味を持つものの、この節にはαἰώνιοςが明記されていないため、本文には限定語を加えない。
- issue: 「わたしのもとに来る」を信仰の説明に置き換えるか
  choice: わたしのもとに来る
  alternative: わたしを信じる／信じてわたしのもとに来る
  rationale: イエスのもとに来ることはヨハネ福音書で信じることと密接に関係するが、原文の具体的な表現とその含みを保ち、本文で解釈に置き換えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「あなたがた」「わたし」は福音書の対話として自然な聖書文体を保つ。「それなのに」で文脈上の対照を示し、「来ようとはしない」によって責任を伴う意志的な不応答を、過度に強い断定を避けながら表した。
