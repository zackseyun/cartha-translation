  text: ἠρώτησαν ⸀οὖν αὐτόν· Τίς ἐστιν ὁ ἄνθρωπος ὁ εἰπών σοι· ⸀Ἆρον καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: ja
  text: そこで彼らはその人に尋ねた。「あなたに『それ[a]を取り上げて、歩きなさい』と言った人は、だれなのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「取り上げて、歩きなさい」で、目的語は明記されていない。「それ」は前の文脈にある、その人が横たわっていた寝床を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: 尋ねた
  rationale: アオリスト能動直説法三人称複数。文脈上、敵意を必要以上に強めず、自然な現代日本語で質問行為を表す。
- source_word: οὖν
  choice: そこで
  rationale: 前節を受けた物語上・論理上の展開を示す。ここでは「それゆえ」より自然で、問いが直前の返答から生じたことも伝わる。
- source_word: αὐτόν
  choice: その人に
  rationale: 癒やされた男性を指す対格男性単数。日本語では質問の相手を「に」で示し、指示対象を明確にするため「その人」とした。
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: 人は、だれなのか
  rationale: 特定の男性を問う構文。引用節を先に置く自然な日本語語順の中で、人物を特定する問いとして表現した。
- source_word: ὁ εἰπών σοι
  choice: と言った
  rationale: 冠詞付きアオリスト分詞が、その人物を以前の発言によって特定している。σοιは日本語の直接引用の構造上、明示しなくても質問相手への発言だと明瞭である。
- source_word: Ἆρον
  choice: それを取り上げて
  rationale: αἴρωのアオリスト命令形。目的語はギリシア語本文では省略され、前文脈の寝床を指すため、日本語では「それ」を補って自然にした。
- source_word: καὶ περιπάτει
  choice: 歩きなさい
  rationale: περιπατέωの現在命令形。相の違いを過剰に説明せず、命令として自然で端正な日本語にした。
theological_decisions: []
translation_notes:
  register: 明快で現代的ながら品位のある叙述調。「そこで」で前節とのつながりを示し、問いにはやや詰問的にも聞こえうる「だれなのか」を用いた。ただし動詞自体は中立的な「尋ねた」とし、原文以上の敵意は加えていない。
