id: JHN.5.22
reference: John 5:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: ja
  text: 父はだれをも裁かず、裁きのすべてを御子に委ねておられるからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: からです
  rationale: γάρは直前の発言を説明する働きを持つ。οὐδέの否定の力は「だれをも……ず」に自然に反映し、現代日本語として明瞭な理由節にした。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: ヨハネ文書における神の称号であり、御子との関係を示すため「父」とした。
- source_word: κρίνει
  choice: 裁かず
  rationale: 現在形による一般的な事実を表す。「罪に定める」と狭めず、後続の κρίσις との語義上のつながりを保った。
- source_word: οὐδένα
  choice: だれをも
  rationale: 包括的否定を、自然で格調を失わない現代日本語で表した。
- source_word: ἀλλὰ
  choice: （否定形と後続節の対照）
  rationale: 日本語では「……ず、……」という構文自体で明確な対照が成立するため、接続詞「しかし」を加えず自然に表現した。
- source_word: τὴν κρίσιν πᾶσαν
  choice: 裁きのすべて
  rationale: κρίσις を権威だけに限定せず、裁く働き・行為を表す名詞として保ち、πᾶσαν の包括性も明示した。
- source_word: δέδωκεν
  choice: 委ねておられる
  rationale: 完了形が示す、過去に成立して現在も続く状態を表した。「与えた」より日本語として裁きの職務を託す意味が自然だが、単なる委任以上の意味は加えていない。
- source_word: τῷ υἱῷ
  choice: 御子に
  rationale: 所有代名詞を補わず、父との関係における称号として表した。敬意を伴う日本語の定着した聖書用語「御子」を用いた。
theological_decisions:
- issue: 父が裁かないことと御子が裁くことの関係
  choice: 父はだれをも裁かず、裁きのすべてを御子に委ねた、と直接的に訳す。
  alternative: 「御子から独立しては裁かない」と補う、または終末の最後の審判だけに限定する。
  rationale: ギリシア語にない調和的な限定を加えず、本文が示す神学的緊張をそのまま保った。
- issue: 「御子」というキリスト論的称号
  choice: 「御子」を称号として保持する。
  alternative: 「自分の子」「その息子」と言い換える。
  rationale: 原文は所有代名詞を伴わない定冠詞付きの υἱός であり、ヨハネ福音書における父と御子の関係を示す称号として訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「裁く／裁き」で原文の語彙的連関を再現し、文末の「からです」で前節への説明関係を明示した。
