  yaml_path: translation/nt/john/005/005.yaml
  text: There was a man there who had been in his sickness for thirty-eight years[a].
translation:
  language: ja
  text: 三十八年間、体の不調を抱えていた男性がそこにいた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身体的な弱さの状態にあった」または「病を患っていた」とも訳せる。ギリシャ語の「アステネイア」は、身体の弱さや病気を広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δέ
  choice: いた
  rationale: δέは強い対比ではなく物語を進める弱い接続であり、日本語では明示的な接続詞を置かず、自然な叙述で表す。
- source_word: τις ἄνθρωπος
  choice: 人が
  rationale: 不定の一人を導入する表現。文脈上は男性だが、日本語では自然で過度に限定しない「人」が適切。
- source_word: ἐκεῖ
  choice: そこに
  rationale: 直前に描かれた場所にいたことを示す。
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: 三十八年もの間
  rationale: 期間を表す。「もの」は長期にわたる状態を自然に伝えるが、数字以上の情報は加えない。
- source_word: ἔχων ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: 病気で苦しんでいる
  rationale: 直訳的な「自分の弱さの中にあって三十八年を持つ」は日本語として不自然であるため、継続していた身体的な不調を自然に表す。ἀσθένειαの語義幅は脚注に残す。
