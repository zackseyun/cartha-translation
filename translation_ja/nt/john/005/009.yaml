id: JHN.5.9
reference: John 5:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: ja
  text: すると、その人はすぐに治り、寝床[a]を取り上げて歩き始めた[b]。その日は安息日であった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「敷物」または「寝具」とも訳せる。ギリシア語は、必ずしも家具としてのベッドではなく、簡素な敷物や持ち運べる寝床を指す。
    reason: lexical_alternative
  - marker: b
    text: 「歩いていた」とも訳せる。ギリシア語の未完了過去形は、歩き続けていたことを表すことも、この文脈で歩き始めたことを表すこともあり得る。
    reason: lexical_alternative
  - marker: c
    text: 直訳すると「その日には安息日であった」。ギリシア語の「安息日」には冠詞がないが、日本語では「安息日」と「その安息日」のどちらとも機械的には決まらない。
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: すぐに
  rationale: 癒やしが即座に起こったことを、明瞭で自然な現代日本語で表す。
- source_word: ἐγένετο ὑγιὴς
  choice: 治り
  rationale: 直訳的には「健康な状態になった」。病気が癒えたという文脈に即し、行為者をギリシア語以上に明示しない表現とした。
- source_word: ὁ ἄνθρωπος
  choice: その人
  rationale: すでに登場している特定の男性を指す。日本語では文脈上、性別を重ねて明示せずとも自然かつ正確である。
- source_word: ἦρε
  choice: 取り上げて
  rationale: 寝床を持ち上げて運べる状態にする動作を表し、後続の歩行へ自然につなげる。
- source_word: κράβαττον
  choice: 寝床
  rationale: 大型家具としてのベッドではなく、持ち運べる簡素な敷物や寝具を指す語である。「寝床」は用途を明確にしつつ物の形状を限定しすぎない。
- source_word: περιεπάτει
  choice: 歩き始めた
  rationale: 未完了過去は継続する歩行とも、癒やされた後に歩行を開始したこととも理解できる。この場面では後者が自然だが、継続相の可能性は脚注に残した。
- source_word: Ἦν δὲ
  choice: その日は…であった
  rationale: δέは強い逆接よりも、続く論争の背景となる説明への移行を示す。日本語では独立した文によってその転換を自然に表した。
- source_word: σάββατον
  choice: 安息日
  rationale: ユダヤ教の聖なる休息日を表す定着した訳語。ギリシア語は冠詞を欠くが、日本語では冠詞の区別を表面化させる必要がない。
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: その日は
  rationale: 「その日に」を存在文として自然な日本語に整えた表現。
theological_decisions:
- issue: 物語中のσάββατονの限定性
  choice: 安息日
  alternative: その安息日
  rationale: 原文は無冠詞であり、特定の安息日に称号的な限定を加えるより、その日が安息日だったことを告げる時間的背景として訳した。日本語には英語の不定冠詞と定冠詞に相当する必須の区別がないため、曖昧さを保てる。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔でありながら聖書物語にふさわしい落ち着いた文体とした。「寝床」は携帯可能な簡素な寝具を想定し、「ベッド」という大型家具を連想させやすい語を避けた。英語資料の脚注記号は本文との対応が入れ替わっていたため、内容に即して[a]をκράβαττον、[b]をπεριεπάτει、[c]をσάββατονに対応させた。
