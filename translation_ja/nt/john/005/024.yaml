  rationale: 本文の語彙選択と神学的な抑制は維持した。完了形μεταβέβηκενをより明確に反映するため「移っています」を「移ったのです」に改め、脚注で完了した移行の継続的な結果を補った。また、「裁きに至る」を自然な現代日本語の「裁きを受ける」に改めた。脚注アンカーは、それぞれκρίσιςとμεταβέβηκενに対応している。
