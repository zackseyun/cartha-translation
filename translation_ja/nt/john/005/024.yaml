id: JHN.5.24
reference: John 5:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: ja
  text: まことに、まことに、あなたがたに言います。私のことばを聞き、私を遣わした方を信じる者は、永遠のいのちを持っており、裁きを受けることはなく[a]、死からいのちへと移ったのです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「有罪の宣告を受けることはなく」とも訳せる。ギリシア語のκρίσιςは一般に「裁き」を意味するが、この文脈では不利な裁き、すなわち有罪の宣告を指す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の完了形は、死からいのちへの移行がすでに成し遂げられ、その結果が今も続いていることを示す。
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: 二度繰り返される荘重な強調を保ちつつ、現代日本語で意味が明瞭に伝わる表現とした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 直接的な発言の定型句を、原文に近く自然な日本語で表した。
- source_word: ὁ ... ἀκούων καὶ πιστεύων
  choice: 聞いて……信じる者
  rationale: 冠詞付き現在分詞が表す一般的・継続的な人物像を、性別を限定しない自然な日本語で示した。
- source_word: τὸν λόγον μου
  choice: 私のことば
  rationale: イエスが語る知らせを指す一方、ヨハネ文書におけるλόγοςの響きも残すため、「メッセージ」ではなく「ことば」とした。
- source_word: πιστεύων τῷ πέμψαντί με
  choice: 私を遣わした方を信じる
  rationale: πιστεύωと与格の組み合わせが表す、相手を信じ、信頼する意味を簡潔に表した。
- source_word: ἔχει ζωὴν αἰώνιον
  choice: 永遠のいのちを持っており
  rationale: 現在形ἔχειが示す現在の所有を明示し、ヨハネ福音書で定着した「永遠のいのち」を用いた。
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: 裁きに至ることはなく
  rationale: εἰςの方向性を保ちながら、κρίσιςをより限定的な「有罪判決」とせず、広い意味の「裁き」とした。
- source_word: μεταβέβηκεν
  choice: 移っています
  rationale: 完了した移行と、その結果が現在も続いていることを、日本語の「移っている」で表した。
- source_word: ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: 死からいのちへと
  rationale: 二つの前置詞が示す出発点と到達点、およびヨハネ的な「死」と「いのち」の対照を保った。
theological_decisions:
- issue: 救いの文脈におけるκρίσιςの意味
  choice: 裁き
  alternative: 有罪の宣告
  rationale: 文脈上は不利な終末的裁きを含み得るが、語そのものは「有罪の宣告」より広い。「裁き」とすることで、本文の語義上の幅と神学的緊張を保った。
- issue: 現在形と完了形が示す救いの時制
  choice: 永遠のいのちを現在持ち、死からいのちへの移行が完了して、その結果が続いている
  alternative: 永遠のいのちも裁きからの解放も将来にのみ属する
  rationale: ἔχειは現在形、μεταβέβηκενは完了形であるため、現在の所有と、完了して継続する移行を訳文に反映した。特定の教派的体系は付加していない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの宣言の荘重さを保った。「いのち」はヨハネ福音書の主要語としての響きを考慮して平仮名表記とし、「方」は父なる神への敬意を自然に示す表記とした。
