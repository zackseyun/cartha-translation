id: JHN.5.15
reference: John 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπῆλθεν ὁ ἄνθρωπος καὶ ⸀ἀνήγγειλεν τοῖς Ἰουδαίοις ὅτι Ἰησοῦς ἐστιν ὁ ποιήσας αὐτὸν ὑγιῆ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/015.yaml
  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: ja
  text: その人は立ち去り、ユダヤ人たち[a]に、自分を健康にしたのはイエスだと知らせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈によっては「ユダヤ人の指導者たち」または「ユダヤ地方の人々」とも訳せる。ヨハネ福音書で「ユダヤ人たち」がどのような意味で使われているかによる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: 立ち去り
  rationale: 場を離れたことを示すアオリスト。現代日本語として自然で、移動の意味を明確に保つ。
- source_word: ὁ ἄνθρωπος
  choice: その人
  rationale: 文脈上、癒やされた男性を指す。日本語では既出人物を自然に受ける「その人」とした。
- source_word: ἀνήγγειλεν
  choice: 知らせた
  rationale: 報告する、告げ知らせるという意味。公の布告という含みを強めず、情報を伝えたことを自然に表す。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たち
  rationale: 語の表面上の意味を本文に残した。ヨハネ福音書では文脈により指導者層またはユダヤ地方の人々を指し得るため、その可能性は脚注に示す。
- source_word: ὅτι
  choice: と
  rationale: 知らせた内容を導く日本語の引用・内容節として自然に表現した。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で定着した固有名の表記。
- source_word: ἐστιν
  choice: だ
  rationale: ギリシア語の現在形を、間接話法で機械的に過去へ移さず、日本語として自然な同定表現にした。
- source_word: ὁ ποιήσας
  choice: したのは
  rationale: 冠詞付きアオリスト分詞が、先に行為をした者を特定している。「のは…だ」の焦点構文でその同定を保った。
- source_word: αὐτὸν ὑγιῆ
  choice: 自分を健康に
  rationale: ποιέωと補語ὑγιῆの構造を保ち、癒やされた本人を「自分」で明確に受けた。「健康にした」は「癒やした」より原文の構文に近い。
theological_decisions:
- issue: ヨハネ福音書における「ユダヤ人たち」の指示対象
  choice: 本文では「ユダヤ人たち」とし、文脈上の可能性を脚注に記す。
  alternative: 「ユダヤ人の指導者たち」または「ユダヤ地方の人々」
  rationale: Ἰουδαίοιςそのものを不必要に限定せず、同時にヨハネにおける文脈的な語義の幅も隠さないため。
translation_notes:
  register: 明快で現代的かつ品位ある叙述。「その人」で既出人物を受け、「知らせた」でἀναγγέλλωを過度に公的な語感なく表した。脚注記号[a]は該当語の直後に置いた。
