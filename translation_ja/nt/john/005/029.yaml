source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: ja
  text: そして、人々は出て来る――善を行った者たちは命の復活へ、悪を行った者たちは裁きの復活へ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裁きの復活」は、「有罪の裁きを受ける復活」とも訳せます。しかし、ギリシア語はより広い意味の「裁き」です。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: 出て来る
  rationale: 直前の文脈では死者が墓の中から出ることを指すため、現代日本語として自然な「出て来る」とした。
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: 善を行った者たち
  rationale: 冠詞付きの中性複数形容詞を目的語として捉え、「善を行う」と簡潔に訳した。アオリスト分詞は行為を全体として示す。
- source_word: ἀνάστασιν ζωῆς
  choice: 命の復活
  rationale: 属格表現と後半との並行を保ち、意味を「命に至る」と断定的に展開しすぎない訳とした。
- source_word: τὰ φαῦλα πράξαντες
  choice: 悪を行った者たち
  rationale: φαῦλα はこの裁きの文脈で道徳的な悪を表す。ποιέω と πράσσω の語彙差は日本語で不自然に強調せず、対句の明瞭さを優先した。
- source_word: ἀνάστασιν κρίσεως
  choice: 裁きの復活
  rationale: κρίσις の基本的で幅のある意味を保ち、「有罪判決」や「滅び」へ狭めなかった。
- source_word: δὲ
  choice: （対照的な並列）
  rationale: 日本語では「善を…、悪を…」という対句そのものによって対照が明確なため、「しかし」を加えず自然な並列で表した。
theological_decisions:
- issue: κρίσεως を「裁き」とするか、より限定的な「有罪判決」とするか
  choice: 裁き
  alternative: 有罪判決
  rationale: κρίσις 自体は「裁き」という広い意味を持つ。文脈上の厳粛な対照は保ちつつ、原文以上に結果を限定しない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。前半から続く文であることを「そして」で示し、二群の対照は簡潔な並行表現で保った。
