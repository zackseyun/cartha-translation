  naturalness: 明瞭で自然な現代標準日本語であり、「父」「御子」「業」という用語の組合せも本文の品位とヨハネ福音書の語調に合う。「これらよりもさらに大きな業」は自然だが、「さらに」は比較級の意味を補強する語であり、原文の意味を実質的には変えない。
  terminology: 「御子」は本文脈で定着した適切な敬称であり、「業」は ἔργα の反復されるヨハネ的な語感をよく保つ。「愛し」は φιλέω を不当に弱めず、ἀγαπάω との語彙上の差を教義的に固定しない適切な訳語である。
