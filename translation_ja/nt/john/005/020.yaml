id: JHN.5.20
reference: John 5:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: ja
  text: 父は御子を愛し、ご自分がしていることをすべて御子に示されるからです。そして、あなたがたが驚くように、これらよりもさらに大きな業を御子に示されます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そのため、あなたがたは驚くことになります」とも訳せる。ギリシア語のἵναと接続法は目的を表し、この文脈では、イエスの聞き手たちが驚くという結果も含みうる。
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: 愛し
  rationale: ヨハネ文書ではἀγαπάωとの意味の重なりがあり、愛の程度を弱めず、父と御子の親密な関係を自然に表すため。
- source_word: δείκνυσιν / δείξει
  choice: 示される／示されます
  rationale: 同じ動詞の現在形と未来形の対応を保ちつつ、父に対する敬語として自然な日本語にした。
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: ご自分がしていることをすべて
  rationale: πάνταの包括性、αὐτόςの強調、およびποιεῖの継続的な現在の働きを明示する。
- source_word: μείζονα τούτων ... ἔργα
  choice: これらよりもさらに大きな業
  rationale: ἔργαをヨハネ福音書における神学的含意も保てる「業」とし、比較級を明瞭に表した。
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: あなたがたが驚くように
  rationale: 複数二人称を明示し、ἵνα節の目的と結果の両方に開かれた自然な表現とした。
theological_decisions:
- issue: φιλέωで表される父の御子への愛
  choice: 「愛し」と訳し、弱い愛や単なる好意とは限定しない。
  alternative: 「慈しみ」「親愛の情を抱き」
  rationale: 語彙上の差異を過度に神学化せず、父と御子の親密な関係を保つため。
- issue: ἵνα ὑμεῖς θαυμάζητεの目的・結果の含み
  choice: 「あなたがたが驚くように」
  alternative: 「あなたがたは驚くことになる」
  rationale: ἵνα＋接続法が持つ目的の意味を基本にしつつ、聞き手が実際に驚くという結果の含みも排除しないため。
- issue: 父が御子に業を示すという関係
  choice: 本文どおり父が御子に示すと訳し、その関係を説明的に解消しない。
  alternative: 「御子を通して現す」など、行為主体の関係を解釈して訳す。
  rationale: 父と御子の関係に関する本文の神学的緊張と表現をそのまま保つため。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「御子」「業」を用いてヨハネ福音書の文体と神学的語感を保ち、「示す」の反復によって原文の語彙的対応を再現した。脚注記号は対応する節末に配置した。
