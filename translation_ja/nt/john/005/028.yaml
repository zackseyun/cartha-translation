id: JHN.5.28
reference: John 5:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: ja
  text: このことに驚いてはならない。墓の中にいる者は皆、彼の声を聞く時が来るからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: 驚いてはならない
  rationale: μήを伴う現在命令形の禁止を自然で格調ある現代日本語にした。「不思議に思ってはならない」も可能だが、ここでは驚嘆の意味合いが強い。
- source_word: τοῦτο
  choice: このこと
  rationale: 直前の発言を指す指示語として明確に訳した。
- source_word: ὅτι
  choice: からである
  rationale: 後続節が禁止の理由を示すため、因果関係が明瞭になる形にした。
- source_word: ἔρχεται ὥρα
  choice: 時が来る
  rationale: ヨハネ文書で神学的な含みを持ち得るὥραを「時」とし、定冠詞のない表現を日本語として自然に訳した。
- source_word: ἐν ᾗ
  choice: （その）時
  rationale: 関係節の時間的意味を「時が来る」の構文に組み込み、過度に逐語的な「その時の中で」を避けた。
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: 墓の中にいる者が皆
  rationale: πάντεςの全体性と、μνημεῖονが示す具体的な埋葬場所の像を保った。
- source_word: ἀκούσουσιν
  choice: 聞く
  rationale: 未来直説法は、日本語では「時が来る」によって未来性が明らかなため、自然な非過去形で表した。
- source_word: τῆς φωνῆς αὐτοῦ
  choice: 彼の声
  rationale: ἀκούωに伴う属格を日本語で自然な目的語として訳し、φωνήを「声」とした。
theological_decisions:
- issue: 墓にいる者が声を聞くという復活の含意
  choice: 「墓の中にいる者」という具体的な埋葬の像をそのまま保つ
  alternative: 「死者」と明示して教理的含意を説明する
  rationale: 本文は復活を指し示すが、この節自体の表現を越えて「死者」や「肉体の復活」と説明的に補わず、神学的含意と緊張を保持した。
- issue: αὐτοῦが指す人物
  choice: 「彼」と訳す
  alternative: 文脈上の指示対象を「人の子」または「イエス」と明示する
  rationale: この節単独では代名詞であり、訳文でも指示対象を解釈的に置き換えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文にふさわしい落ち着いた格調を保った。「驚くな」よりも「驚いてはならない」として、禁止命令を明確かつ自然に表現した。
