  text: ἔστιν δὲ ἐν τοῖς Ἱεροσολύμοις ἐπὶ τῇ προβατικῇ κολυμβήθρα ἡ ἐπιλεγομένη Ἑβραϊστὶ ⸀Βηθεσδά, πέντε στοὰς ἔχουσα·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: ja
  text: エルサレムには、羊の門[c]のそばに、ヘブライ語[a]で「ベテスダ」[b]と呼ばれ、五つの回廊を備えた池がある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アラム語で」とも考えられる。ヨハネが用いる「ヘブライ語」という表現は、厳密な意味での古典ヘブライ語ではなく、ユダヤ地方で使われていたセム系の言語を指すことが多い。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては「ベトザタ」または「ベトサイダ」となっている。
    reason: textual_variant
  - marker: c
    text: ギリシア語は羊の門の一帯を指すと考えられる（ネヘミヤ3:1、12:39参照）。原文には「門」に当たる語は明記されていない。
    reason: cross_reference
lexical_decisions:
- source_word: ἔστιν δὲ
  choice: には……がある
  rationale: 現在形の存在表現を保ち、δέの弱い接続は日本語で不自然な接続語を加えず、文脈上の流れに委ねた。
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: エルサレムには
  rationale: 地名を現代日本語の標準的な形で示し、存在文の場所を自然に主題化した。
- source_word: ἐπὶ τῇ προβατικῇ
  choice: 羊の門のそばに
  rationale: προβατικῇは名詞が省略された形で、エルサレムの「羊の門」付近を指す可能性が高い。補足した「門」は脚注で明示した。
- source_word: κολυμβήθρα
  choice: 池
  rationale: 貯水池や水浴池を指し得るが、ここでは簡潔で広く理解できる「池」とした。
- source_word: ἡ ἐπιλεγομένη
  choice: と呼ばれる
  rationale: 池の名称を導入する受動的な分詞の意味を自然に表した。
- source_word: Ἑβραϊστὶ
  choice: ヘブライ語で
  rationale: 本文の語義をそのまま保った。ヨハネの用法では当地のセム語、すなわちアラム語を含み得るため、その点は脚注に示した。
- source_word: Βηθεσδά
  choice: ベテスダ
  rationale: 提示されたSBLGNT本文の読みを日本語で音写した。他の写本の異読は脚注に残した。
- source_word: πέντε στοὰς ἔχουσα
  choice: 五つの回廊がある
  rationale: στοάは柱の並ぶ屋根付き回廊を指す。「回廊」は簡潔で理解しやすく、ἔχουσαの内容を自然な日本語の存在表現にした。
