source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: ja
  text: わたしは、自分からは何一つ行うことができない。[a] わたしは聞くとおりに裁く。そして、わたしの裁きは正しい。わたしは自分の意志ではなく、わたしを遣わした方の意志を求めているからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分自身で何も行うことができない」とも訳せる。ギリシア語の表現は、行為の源が自分にあることと、独立して行動することの両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: わたしは、自分からは何一つ行うことができない
  rationale: 否定された能力を明示する δύναμαι と強調された ἐγώ を反映しつつ、ἀπ’ ἐμαυτοῦ の起点・源の含みを「自分からは」で保った。οὐδέν は否定文の中で自然な「何一つ」とした。
- source_word: καθὼς ἀκούω κρίνω
  choice: わたしは聞くとおりに裁く
  rationale: καθὼς が示す、聞くことと裁くことの対応関係を簡潔に表した。κρίνω はヨハネ福音書における司法的な語彙の連続性を保つため「裁く」とした。
- source_word: ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν
  choice: わたしの裁きは正しい
  rationale: κρίσις を先の κρίνω と対応する「裁き」とし、司法的文脈の δικαία は現代日本語で自然な「正しい」と訳した。
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: わたしは自分の意志ではなく…求めている
  rationale: ζητῶ の継続的・一般的な志向を「求めている」で表し、強調された所有表現 τὸ θέλημα τὸ ἐμὸν は「自分の意志」とした。
- source_word: τὸ θέλημα τοῦ πέμψαντός με
  choice: わたしを遣わした方の意志
  rationale: 分詞表現をそのまま関係的な呼称として訳し、原文にない「父」を本文へ補わなかった。「方」により指示対象への敬意を自然に示した。
theological_decisions:
- issue: ἀπ’ ἐμαυτοῦ が示すイエスの行為と遣わした方との関係
  choice: 「自分からは」と訳し、行為の源または独立性に関する表現を保持した。
  alternative: 「自分だけでは」「独力では」
  rationale: この句が絶対的な無能力を述べるのか、遣わした方から独立して行動しないことを述べるのかを説明的に決め切らず、原文の起点の比喩と神学的緊張を残した。
- issue: δικαία の司法的・道徳的含意
  choice: 「正しい」
  alternative: 「公正である」「義にかなっている」
  rationale: 「裁き」と自然に結び付き、その判断の正当性と道徳的正しさの双方を過度に限定せず表せるため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言にふさわしい簡潔で品位ある文体とした。「裁く／裁き」の語根上の対応を日本語でも保ち、原文の反復と論理展開を見えやすくした。
