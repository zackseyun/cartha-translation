id: JHN.5.19
reference: John 5:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: ja
  text: そこでイエスは彼らに答えて言われた。「まことに、まことに、あなたがたに言います。子は、父が何かをしておられるのを見るのでなければ、自分からは何一つすることができません。[a] 父がなさることは何であれ、子も同じようにするのです。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子は、父がしておられるのを見て行うことのほか、自分からは何もできません。」
    reason: lexical_alternative
  - marker: b
    text: この言葉は、子が父から独立して行動するのではなく、父のなさることと同じことを行うと述べている。
    reason: theological_clarification
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: そこでイエスは彼らに答えて言われた
  rationale: οὖνを文脈上のつながりを示す「そこで」とし、Ἀπεκρίνατοとἔλεγενの組み合わせは、不自然な進行形を避けつつ両動詞を反映する定型的で自然な日本語とした。
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: まことに、まことに、あなたがたに言います
  rationale: 厳粛な強調を表す反復を保ち、「アーメン」より意味が伝わりやすい現代日本語にした。
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν
  choice: 子は……自分からは何一つすることができません
  rationale: δύναταιの能力を表す意味と、ἀφ’ ἑαυτοῦが示す行為の源・独立性を明示し、οὐδὲνの全面的な否定も保った。
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: 父が何かをしておられるのを見るのでなければ
  rationale: ἐὰν μήの条件・例外表現と、τιの不定性を「何か」によって保持した。「しておられる」は父への敬意を自然に表す。
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: 父がなさることは何であれ
  rationale: 関係詞とἄνを伴う接続法の一般化された意味を「何であれ」で表した。ἐκεῖνοςは日本語で「その方」とすると不自然になり得るため、指示対象の「父」を明示した。
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: 子も同じようにするのです
  rationale: καίとὁμοίωςが示す父と子の行為の対応を、簡潔で自然な日本語で保った。
theological_decisions:
- issue: 子が自分からは何もできないという表現の解釈
  choice: 本文では能力を表す「することができません」を保ち、脚注では父から独立した行動をしないという関係性を指摘する
  alternative: 「自分勝手には何もしません」または「自分の意志だけでは何もできません」と意訳する
  rationale: 原文のοὐ δύναταιを単なる意志や許可へ弱めず、同時に後半が示す父と子の行為の完全な対応も読者に見えるようにした。存在論的な結論を本文へ付加せず、原文の緊張を保つ。
- issue: ὁ υἱόςとὁ πατήρの称号的用法
  choice: 子／父
  alternative: 御子／御父
  rationale: ヨハネ文書での特定の関係的称号として理解しつつ、特定の教会語彙に偏らない明快な現代日本語を選んだ。
translation_notes:
  register: 明快な現代標準語を用いながら、イエスの厳粛な宣言にふさわしい品位を保った。「まことに」の反復、全面否定、条件節、父と子の行為の対応という原文の構造をできる限り見える形にしている。
