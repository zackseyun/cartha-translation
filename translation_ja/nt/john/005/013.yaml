  text: ὁ δὲ ἰαθεὶς οὐκ ᾔδει τίς ἐστιν, ὁ γὰρ Ἰησοῦς ἐξένευσεν ὄχλου ὄντος ἐν τῷ τόπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/013.yaml
  text: But the man who had been healed did not know who he was[a], for Jesus had withdrawn, since there was a crowd in the place.
translation:
  language: ja
  text: ところが、癒やされた人は、その方がだれなのか知らなかった。そこに群衆がいたため、イエスは人目につかないように立ち去られたからである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「身を引かれた」「そっと立ち去られた」。ギリシア語の動詞には、人目につかないようにその場を離れたという含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰαθεὶς
  choice: 癒やされた人
  rationale: 冠詞を伴うアオリスト受動分詞を名詞的に訳し、癒やしを受けたことと、その出来事が主動詞に先立つことを自然な日本語で示す。
- source_word: οὐκ ᾔδει
  choice: 知らなかった
  rationale: 文脈に即した平明で自然な訳。継続的に知らない状態にあったことも表せる。
- source_word: τίς ἐστιν
  choice: その方がだれなのか
  rationale: イエスという人物を指す間接疑問として自然に訳した。「その方」は、癒やした人物への指示を明確にしつつ、原文にない固有名をこの節前半へ補わない。
- source_word: ἐξένευσεν
  choice: 人目につかないように立ち去っておられた
  rationale: 単なる移動ではなく、目立たずその場を離れたという動詞の含みを表す。文脈上、癒やされた人が知らなかった理由となる先行動作として「立ち去っておられた」とした。
- source_word: ὄχλου ὄντος
  choice: 群衆がいたので
  rationale: 属格独立構文を理由・付帯状況として自然な日本語にした。群衆の存在とイエスの退去との関係を示すが、群衆に紛れたとまでは明示しない。
- source_word: ἐν τῷ τόπῳ
  choice: その場所には
  rationale: 場所を明示する原文を保ちつつ、日本語として自然な指示表現にした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、叙述の品位を保つためイエスへの言及には敬語を用いた。接続詞「ところが」で前節からの対照を示し、二文に分けて理由関係を読み取りやすくした。
