  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: ja
  text: しかし、イエスは彼らに答えた。「わたしの父は今に至るまで働いておられる。そして、わたしも働いている[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの父は今に至るまで働かれる。そして、わたしも働く」。ギリシア語の現在形は、継続中の働きとしても、単純現在としても訳しうる。
    reason: 時制・アスペクト上の別訳を示し、原文にある幅を保つため。
lexical_decisions:
- source_word: δὲ
  choice: しかし
  rationale: 直前の非難に対する応答の展開と緩やかな対照を、自然な日本語で示す。
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: イエスは彼らに答えた
  rationale: 文脈上の主語を明示し、アオリストの応答を簡潔で自然な日本語にした。
- source_word: Ὁ πατήρ μου
  choice: わたしの父
  rationale: イエスと父との個人的関係を直接的に保つ。日本語では表記上の大文字による区別がないため、語そのものを過度に説明しない。
- source_word: ἕως ἄρτι
  choice: 今に至るまで
  rationale: 過去から発話時点までの継続を明確に表し、「今もなお」という含みも保てる。
- source_word: ἐργάζεται
  choice: 働いておられる
  rationale: 現在の継続的な働きを示しつつ、イエスが「父」について語る日本語として自然な敬意を表す。
- source_word: κἀγὼ
  choice: そして、わたしも
  rationale: καίの接続と、ἐγώに伴う付加的な強調を明確に保つ。因果関係は加えない。
- source_word: ἐργάζομαι
  choice: 働いている
  rationale: 父の働きとの平行を保ち、現在進行中の活動として自然に表現する。
theological_decisions:
- issue: 安息日における父の働きとイエスの働きとの関係
  choice: 「わたしの父は今に至るまで働いておられる。そして、わたしも働いている」と、両者の働きを並行して示す。
  alternative: 「わたしの父は今に至るまで働かれる。そして、わたしも働く」
  rationale: 原文は父の活動とイエス自身の活動を意図的に並べている。この神学的緊張を弱めず、同時に安息日、神的特権、父との同等性について本文にない説明を訳文へ加えない。
translation_notes:
  register: 明瞭で現代的な標準語を用い、発言は荘重さを保ちながらも日常の読者に理解しやすくした。「父」には敬意を表す「おられる」を用いる一方、イエス自身の発言には「働いている」を用いて不自然な自己敬語を避けた。
