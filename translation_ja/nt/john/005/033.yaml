id: JHN.5.33
reference: John 5:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς ἀπεστάλκατε πρὸς Ἰωάννην, καὶ μεμαρτύρηκε τῇ ἀληθείᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/033.yaml
  text: You have sent to John[a], and he has testified to the truth.
translation:
  language: ja
  text: あなたがたはヨハネのもとに人を遣わし、彼は真理について証しをしました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「真理について証言しました」。
    reason: 「証しをする」と「証言する」はいずれも μαρτυρέω の証人・証言の比喩を表せるため。
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 明示された二人称複数代名詞を訳し、文脈上の穏やかな強調を保った。「あなたがた自身は」とすると強調が過度になる。
- source_word: ἀπεστάλκατε
  choice: 人を遣わし
  rationale: 完了形が指す、すでに行われて現在にも関わる派遣を、自然な日本語で表した。原文では目的語が省略されているが、日本語ではヨハネへの使者派遣であることを「人を」で明示するのが自然である。
- source_word: πρὸς Ἰωάννην
  choice: ヨハネのもとに
  rationale: 人物を目的地とする πρός の意味を自然に表した。文脈上はバプテスマのヨハネだが、原文どおり固有名だけを用いた。
- source_word: μεμαρτύρηκε
  choice: 証しをしました
  rationale: 証人として真実を述べたという語義を保ちつつ、現代日本語として平明な表現を選んだ。完了形の継続的な意義は文脈に委ね、「今も証言している」とは限定しなかった。
- source_word: τῇ ἀληθείᾳ
  choice: 真理について
  rationale: μαρτυρέω に伴う与格を、証しの内容・対象を示す自然な日本語にした。定冠詞を伴う ἀλήθεια のヨハネ文書における含みを「真理」で保った。
theological_decisions:
- issue: ヨハネ文書における「真理」
  choice: 真理
  alternative: 真実
  rationale: 単なる発言の正しさに狭めず、定冠詞を伴う語が持ち得る神学的な響きを保つ一方、その内容を特定の教理に限定しなかった。
- issue: ヨハネの証言の現在的意義
  choice: 証しをしました
  alternative: 証しをしています
  rationale: ギリシア語完了形には過去の証言とその現在的意義が含まれ得るが、「しています」は証言行為そのものが継続中だと読まれやすい。自然な日本語を優先し、現在的意義は文脈に残した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、「遣わす」「真理」「証し」によって本文の格調と証言語彙を保った。
