id: JHN.5.43
reference: John 5:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: ja
  text: わたしはわたしの父の名によって来たのに[a]、あなたがたはわたしを受け入れない。ほかの者が自分の名によって来れば[b]、あなたがたはその者を受け入れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの父の権威を帯びて」とも訳せる。「名によって」というギリシア語の表現は、その名を持つ方を代表することや、その方の権威によることを意味しうる。
    reason: lexical_alternative
  - marker: b
    text: 「自分自身の権威で」とも訳せる。「自分の名によって」は、イエスが「わたしの父の名によって」来たことと鮮明な対照をなしている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ ἐλήλυθα
  choice: わたしは……来たのに
  rationale: 完了形は、すでに来て今ここにいるという結果状態を含む。日本語では「来た」が自然であり、後続の「受け入れない」との逆接を「のに」で明確にした。
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: 父の名によって
  rationale: 「名」による代理・権威の含意を保ちつつ、後半の「自分の名によって」との意図的な並行を維持する。
- source_word: οὐ λαμβάνετέ με
  choice: あなたがたはわたしを受け入れない
  rationale: ここでの λαμβάνω は物理的に取ることではなく、イエスを認めて受容することを表す。「受け入れる」は歓迎と信認の両方の含みを保てる。
- source_word: ἐὰν ἄλλος ἔλθῃ
  choice: ほかの者が……来れば
  rationale: 不定の別人を指す条件節として自然であり、特定の人物を示す解釈を加えない。
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: 自分の名によって
  rationale: 自らを根拠として来るという含意を残し、「父の名によって」との鮮明な対照を保持する。
- source_word: ἐκεῖνον λήμψεσθε
  choice: あなたがたはその者を受け入れる
  rationale: 前半と同じ「受け入れる」を反復して修辞的対照を保つ。「その者」は ἐκεῖνον の指示性を自然に表す。
theological_decisions:
- issue: 「父」を神と明示するか
  choice: 本文では「父」とし、「神」を補わない。
  alternative: 「父なる神」または「わたしの父である神」
  rationale: ヨハネ文脈では神を指すことは明らかだが、原文にない語を補わず、イエスの「わたしの父」という関係表現を保つ。日本語には英語の大文字表記に相当する区別がない。
- issue: 「名によって」を権威の表現に置き換えるか
  choice: 両節とも「名によって」を本文に残し、権威・代理の意味は注で示す。
  alternative: 「父の権威を帯びて」／「自分自身の権威で」
  rationale: 権威という意味は重要だが、それだけに限定すると「名」の文学的・神学的響きと二つの節の並行性が弱まるため。
- issue: 「ほかの者」が特定の終末的人物を指すと明示するか
  choice: 不特定の「ほかの者」と訳す。
  alternative: 特定の偽メシアまたは反キリストを示す訳
  rationale: ἄλλος 自体は特定の人物を明示しないため、本文では解釈を限定しない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの発言にふさわしい落ち着いた格調を保った。「わたし」「あなたがた」を用いて複数の聞き手を明示し、「名によって」の反復と「受け入れる」の反復を維持した。
