id: JHN.5.44
reference: John 5:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: ja
  text: あなたがたは、互いから栄光を受けながら、唯一の神から来る栄光を求めないで、どうして信じることができるでしょうか。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「栄光」は、二か所とも「誉れ」とも訳せる（ギリシア語 δόξα）。
    reason: lexical_alternative
  - marker: b
    text: 「唯一の神」は、「ただひとりの神」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ὑμεῖς πιστεῦσαι
  choice: あなたがたは……どうして信じることができるでしょうか
  rationale: πῶςとδύνασθεが作る、信じることの可能性を問う修辞疑問を、自然な現代日本語で表した。明示されたὑμεῖςは「あなたがた」で保持したが、不自然に強い「あなたがた自身は」とはしなかった。
- source_word: δόξαν
  choice: 栄光
  rationale: 二度のδόξαを同じ語で訳し、人から得るものと神から来るものとの対照と語の反復を保持した。文脈上は「誉れ」も可能であるため注記した。
- source_word: παρ’ ἀλλήλων λαμβάνοντες
  choice: 互いから栄光を受けながら
  rationale: 相互的な源を示すπαρ’ ἀλλήλωνと、主節に伴う分詞λαμβάνοντεςの継続的な姿勢を直接的に表した。
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: 唯一の神から来る栄光
  rationale: 限定する前置詞句を日本語で自然な連体修飾として表し、μόνουの排他的意味を「唯一の」で保持した。
- source_word: οὐ ζητεῖτε
  choice: 求めないで
  rationale: 先行する分詞句と主節の修辞疑問を日本語で滑らかにつなぎ、求めていない状態が信仰の可能性への問いと結び付く構造を示した。
theological_decisions:
- issue: ヨハネ文書の文脈におけるπιστεῦσαι
  choice: 信じる
  alternative: 信頼する
  rationale: 「信じる」はπιστεύωの意味範囲を広く保ち、信仰または信頼のどちらか一方へ狭く限定しない。
- issue: 二度のδόξαの訳語
  choice: 両方とも「栄光」
  alternative: 両方とも「誉れ」
  rationale: 人に由来するδόξαと神に由来するδόξαとの意図的な語彙上の対照を保持した。
- issue: τοῦ μόνου θεοῦの訳
  choice: 唯一の神
  alternative: ただひとりの神
  rationale: 神の唯一性を簡潔に表し、本文を越えるキリスト論的または反キリスト論的含意を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。修辞疑問を「どうして……できるでしょうか」とし、原文の可能性への問いを自然に表現した。二つの「栄光」をそろえて対照を保持した。
