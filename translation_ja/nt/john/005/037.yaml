id: JHN.5.37
reference: John 5:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με πατὴρ ⸀ἐκεῖνος μεμαρτύρηκεν περὶ ἐμοῦ. οὔτε φωνὴν αὐτοῦ ⸂πώποτε ἀκηκόατε⸃ οὔτε εἶδος αὐτοῦ ἑωράκατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/037.yaml
  text: And the Father who sent me—that one has testified about me[a]. You have neither ever heard his voice nor seen his form[b],
translation:
  language: ja
  text: また、わたしを遣わした父ご自身が、わたしについて証ししてくださった[a]。あなたがたは、これまで一度も父の声を聞いたことがなく、その姿を見たこともない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしを遣わした父、その方が、わたしについて証ししてくださった」。ギリシア語は、直前の「父」を改めて指し示して強調している。
    reason: lexical_alternative
  - marker: b
    text: 「姿」は「外見」または「形」とも訳せる。ギリシア語は目に見える姿や外観を表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: わたしを遣わした父
  rationale: 冠詞付きアオリスト分詞を自然な連体節で表し、父を同定する働きを保った。
- source_word: ἐκεῖνος
  choice: その方が
  rationale: 直前の「父」を受け直す指示代名詞の強調を保ちつつ、現代日本語として不自然にならない敬意ある表現とした。
- source_word: μεμαρτύρηκεν περὶ ἐμοῦ
  choice: わたしについて証ししてくださった
  rationale: 完了形が示す、すでになされた証言の現在的な効力を文脈上保つ。「証しする」により証言・証人の語義を反映し、父を主語とするため「くださった」で自然な敬意を示した。
- source_word: οὔτε ... οὔτε
  choice: なく、…もない
  rationale: 二つの否定を相関的に結び、日本語として明瞭に表した。
- source_word: φωνὴν αὐτοῦ πώποτε ἀκηκόατε
  choice: これまで一度もその方の声を聞いたことがなく
  rationale: 否定文中の πώποτε を「これまで一度も」で明示し、完了形を経験の否定として自然に表した。
- source_word: εἶδος αὐτοῦ ἑωράκατε
  choice: その姿を見たこともない
  rationale: εἶδος の可視的な形・外観という幅を「姿」で保ち、完了形を経験の否定として訳した。
theological_decisions:
- issue: 父を指す強調的な ἐκεῖνος の訳し方
  choice: 「父、その方が」と明示的に受け直す
  alternative: 「父ご自身が」または単に「父が」
  rationale: 指示代名詞による強調を落とさず、父ご自身が証人であるという本文の力点を保持する。「ご自身」は自然だが、指示的な受け直しを弱める可能性がある。
- issue: εἶδος αὐτοῦ の意味範囲
  choice: 「その姿」
  alternative: 「その外見」または「その形」
  rationale: 文字どおりの可視的形態、現れ、啓示的知覚のいずれかに意味を限定せず、原文の含みを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、父への言及には「その方」「くださった」を用いて自然な尊敬を示した。節末は独立した日本語訳として句点で閉じた。
