id: JHN.5.14
reference: John 5:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: ja
  text: その後、イエスは神殿でその人を見つけて言われた。「見なさい。あなたは治った。もう罪を犯してはならない。そうでないと、もっと悪いことがあなたに起こるかもしれない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この警告は、以前の病気が特定の罪によって生じたのかどうかを明言していない。また、「もっと悪いこと」が現世での苦しみ、最後の裁き、あるいはその両方を指すのかも明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: その後
  rationale: 複数形を逐語的に再現する「これらのことの後」より自然な現代日本語で、ヨハネの物語上の時間的推移を保つ。
- source_word: εὑρίσκει
  choice: 見つけて
  rationale: ギリシア語の歴史的現在を、日本語の自然な叙述として文脈に即して表した。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόνは内陣だけでなく神殿域を指し得るため、解釈を狭めない標準的な訳語とした。
- source_word: Ἴδε
  choice: 見なさい
  rationale: 相手の注意を現在の回復した状態へ向ける命令の力を、古風にならない形で保つ。
- source_word: ὑγιὴς γέγονας
  choice: あなたは良くなった
  rationale: 完了形が示す、回復という変化とその結果としての現在の状態を自然な日本語で表す。
- source_word: μηκέτι ἁμάρτανε
  choice: もう罪を犯してはならない
  rationale: 今後は罪をやめるよう求める警告を明確にしつつ、継続的に罪を犯していたと相の意味を過度に限定しない。
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: そうでないと、もっと悪いことがあなたに起こるかもしれない
  rationale: 警告として自然な日本語にし、接続法が示す潜在的な出来事を「かもしれない」で保持した。
theological_decisions:
- issue: 罪と苦しみの関係、および「もっと悪いこと」の内容
  choice: 将来の罪に対する警告と、より悪い事態の可能性をそのまま訳し、具体的内容は脚注で未確定のまま示す。
  alternative: 以前の病気を特定の罪への直接的処罰と断定する、または「もっと悪いこと」を現世の苦難か最終的裁きの一方に限定する。
  rationale: 本文は罪を犯さないよう警告するが、以前の病気の原因や、より悪い事態の性質を明示していないため、神学的緊張を解消しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「見なさい」は注意喚起の力を保ち、「もう罪を犯してはならない」は厳粛な警告を自然に伝える。
