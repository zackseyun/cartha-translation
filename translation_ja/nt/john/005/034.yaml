id: JHN.5.34
reference: John 5:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: ja
  text: しかし、わたしは人からの証言を受けるのではない。むしろ、あなたがたが救われるために、これらのことを言っている。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: 人からの
  rationale: παρά＋属格の起点・出所を「から」で表した。単数のἄνθρωποςはここでは特定の一人というより、人間を類として指すため、現代日本語で自然な「人」とした。
- source_word: τὴν μαρτυρίαν
  choice: 証言
  rationale: 文脈にある証拠・証しの内容という意味を保ち、「証人」と誤解されない表現を選んだ。
- source_word: λαμβάνω
  choice: 受ける
  rationale: 現在形と基本義を率直に反映した。「受け入れる」も可能だが、真実性への同意という意味を強めすぎないよう「受ける」とした。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 中性複数形を反映し、単数的な「このこと」には平板化しなかった。
- source_word: λέγω
  choice: 言っている
  rationale: 現在形を自然な日本語で表し、この発言において語っていることを示した。
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: あなたがたが救われるために
  rationale: ἵναの目的を「ために」で明示し、二人称複数と受動態を保った。救いの内容や仕方は本文以上に限定していない。
- source_word: δὲ ... ἀλλὰ
  choice: しかし……ただ
  rationale: 前文との逆接を「しかし」で示し、後半は、前半を単純に置換するというより発言の目的を示すため、現代日本語で自然な「ただ」とした。
theological_decisions:
- issue: 「救われる」の意味
  choice: 救いを広く含む受動表現「救われる」を保持する。
  alternative: 助け出される／救いに至る
  rationale: σωθῆτεの受動形と救済的な重みを保ちつつ、身体的救出だけに限定せず、また特定の救済論的枠組みも付加しない。
- issue: 人からの証言とイエスの関係
  choice: 「受けるのではない」と訳し、人間の証言への依存を否定する表現を保つ。
  alternative: 人の証言を認めない／信用しない
  rationale: 本文は証言の真偽を否定しているとは限らないため、「認めない」「信用しない」のように意味を狭めない。
translation_notes:
  register: 明瞭な現代標準日本語の常体。イエスの発言として落ち着いた品位を保ちつつ、過度に文語的な語順や語彙は避けた。
