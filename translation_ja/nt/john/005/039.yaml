id: JHN.5.39
reference: John 5:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: ja
  text: あなたがたは、聖書の中に永遠のいのちがあると思って、聖書を調べています[a]。そして、まさにその聖書が、わたしについて証ししているのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「聖書を調べなさい」。Ἐραυνᾶτεを直説法ではなく命令法と取ることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: 調べています
  rationale: 直説法現在と命令法現在の両方に解し得る形。文脈上は、相手の現状を指摘する直説法と取り、継続的・習慣的な行為を自然な現代日本語で表した。命令法の可能性は脚注に残した。
- source_word: τὰς γραφάς
  choice: 聖書
  rationale: ヨハネ文書の用法ではイスラエルの聖なる文書を指すため、日本語で定着した「聖書」とした。
- source_word: ὅτι
  choice: と思って
  rationale: 理由を示す用法と判断し、δοκεῖτεと合わせて「あると思って」とすることで、聖書を調べる動機を自然に示した。
- source_word: δοκεῖτε
  choice: 思って
  rationale: 相手の信念ないし思い込みを表す。批判的含意を過度に強めず、平明な表現とした。
- source_word: ἐν αὐταῖς
  choice: 聖書の中に
  rationale: ἐνの位置的なニュアンスを保ち、代名詞だけでは指示対象が曖昧になりやすい日本語に合わせて「聖書」を明示した。
- source_word: ζωὴν αἰώνιον
  choice: 永遠のいのち
  rationale: ヨハネ文書の主要概念として定着した訳語を用い、「いのち」は単なる生存を超える含意を保つため平仮名表記とした。
- source_word: ἐκεῖναί
  choice: その聖書こそ
  rationale: 女性複数形が「聖書」を受けることを明示し、強意的な指示を係助詞「こそ」で表した。
- source_word: αἱ μαρτυροῦσαι
  choice: 証ししているもの
  rationale: ヨハネ文書で重要な証言の語感を「証し」で保ち、現在分詞の継続的性格を「している」で表した。
- source_word: περὶ ἐμοῦ
  choice: わたしについて
  rationale: περί＋属格の基本的意味を、自然で明瞭な現代日本語にした。
theological_decisions:
- issue: Ἐραυνᾶτεの法
  choice: 直説法：「聖書を調べています」
  alternative: 命令法：「聖書を調べなさい」
  rationale: ギリシア語の形だけでは両義的だが、続く理由節と前後の批判的文脈は、相手の現在の行為を述べる直説法によく適合する。ただし命令法も文法上真正な可能性なので脚注に示し、解釈上の緊張を保持した。
- issue: 永遠のいのちと聖書の関係
  choice: 「聖書の中に永遠のいのちがあると思って」
  alternative: 「聖書によって永遠のいのちを得ると思って」
  rationale: ἐν αὐταῖςを「中に」と訳し、手段を意味する「によって」へ解釈的に限定しなかった。これにより、彼らの理解へのイエスの批判と、聖書がイエスを証しするという主張との緊張を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「聖書」の反復は原文の指示関係を明確にするため保持し、「その聖書こそ」でἐκεῖναίの強調を表現した。
