id: JHN.5.6
reference: John 5:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: ja
  text: イエスは、この人が横たわっているのを見、すでに長い間その状態にあることを知って、彼に言われた。「よくなりたいか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον
  choice: この人
  rationale: 直前まで語られている病気の人を具体的に指す指示代名詞であり、現代日本語では「この人」が自然で明確。
- source_word: ἰδὼν
  choice: 見
  rationale: 主動詞に先立つアオリスト分詞。日本語では連用形により、イエスが彼を見た後に語りかけた流れを自然に示す。
- source_word: κατακείμενον
  choice: 横たわっている
  rationale: その人が伏している姿勢・状態を表す。「横になっている」よりも文体上の品位を保ちつつ、場面を明瞭に描く。
- source_word: γνοὺς
  choice: 知って
  rationale: イエスが事情を知っていたことを述べるが、知った手段は原文が明示しないため、「知って」とだけ訳す。
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: すでに長い間その状態にある
  rationale: 直訳的には目的語が省かれた「すでに長い時を持つ」。文脈上、長く続いているのは彼の病状・無力な状態と解するのが自然であり、「その状態にある」として曖昧さを過度に限定しない。
- source_word: λέγει αὐτῷ
  choice: 彼に言われた
  rationale: 歴史的現在を、日本語の物語として自然な過去形で表す。イエスへの敬意を示す一般的な聖書文体として尊敬表現を用いる。
- source_word: Θέλεις
  choice: たいか
  rationale: 意志・願望を問う θέλω を、直接的で自然な現代日本語の願望表現で訳す。
- source_word: ὑγιὴς γενέσθαι
  choice: よくなりたい
  rationale: ὑγιής は健康で健全な状態、γενέσθαι はその状態になることを示す。「よくなる」は回復への移行を自然に表し、単なる「健康でありたい」より文脈に適する。
theological_decisions:
- issue: γνοὺς におけるイエスの知識の性質
  choice: 知識の取得手段を示さず、単に「知って」と訳す。
  alternative: 超自然的に知った、または観察や人からの情報によって知った、と明示する。
  rationale: 本文はイエスが知っていた事実だけを述べ、その手段を説明していないため、どちらにも限定しない。
- issue: πολὺν ἤδη χρόνον ἔχει が示す期間
  choice: 「長い間その状態にある」とし、長く続く病状・無力な境遇を指すものとして訳す。
  alternative: 「長い間そこにいる」として、池のそばで過ごした期間に限定する。
  rationale: ἔχει の補語は省略されており、「その病状が長い」とも「その状況に長くいる」とも理解し得る。直前の5:5に病気の期間が示されているため状態の継続が文脈上自然だが、「その状態」として具体的病名などは補わない。
translation_notes:
  register: 明快な現代標準日本語を基調とし、地の文では簡潔で品位ある聖書文体を採用した。イエスの問いは原文の率直さを保つため「よくなりたいか」と簡潔にした。
