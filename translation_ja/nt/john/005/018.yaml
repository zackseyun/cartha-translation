id: JHN.5.18
reference: John 5:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: ja
  text: このため、ユダヤ人たち[a]は、ますますイエスを殺そうとしていた。イエスが安息日を破っていただけでなく、神をご自分の父と呼び、ご自分を神と等しい者としていた[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヨハネ福音書で「ユダヤ人たち」は、文脈によってはすべてのユダヤ人を区別なく指すのではなく、イエスに敵対したユダヤ地方の人々、または一部のユダヤ人当局者を特に指す。
    reason: cultural_note
  - marker: b
    text: 別訳「ご自分を神に等しい者としていた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: このため
  rationale: 二つの推論表現が前節との因果的なつながりを強めていることを、現代日本語として不自然に重ねず、一つの明確な接続表現で示した。
- source_word: μᾶλλον
  choice: ますます
  rationale: 殺そうとする動きが以前より強まったという比較・増進の意味を自然な日本語で表す。
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: 殺そうとしていた
  rationale: 未完了過去が示す継続的な企てを「していた」で表し、ἀποκτεῖναιの直接的な意味を「殺す」と訳した。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文の語を狭めて「指導者たち」とせず保持しつつ、文脈上の指示範囲は脚注で説明した。
- source_word: ἔλυε τὸ σάββατον
  choice: 安息日を破っていた
  rationale: λύωをここでは安息日の規定を破るという慣用的意味に取り、明瞭で一般的な表現にした。
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: 神をご自分の父と呼び
  rationale: ἴδιονの強調を「ご自分の」で保ち、神を父とする固有の関係を述べた表現を再現した。
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: ご自分を神と等しい者としていた
  rationale: ποιῶνの「〜とする」という構文と、ἴσονが表す神との等しさを弱めずに訳した。
theological_decisions:
- issue: 神との等しさを述べる句のキリスト論的な強さ
  choice: ご自分を神と等しい者としていた
  alternative: 神と等しいと主張していた
  rationale: 原文は明確に「等しい」と述べるため、その意味を弱めなかった。一方、「主張していた」とすると、ποιῶνを発言行為に限定し、単なる自己主張との含みを加えかねないため避けた。
- issue: 「ユダヤ人たち」の指示範囲
  choice: 本文では「ユダヤ人たち」を保持し、脚注で文脈を説明する
  alternative: ユダヤ人の指導者たち
  rationale: οἱ Ἰουδαῖοιの語形を保ちながら、ヨハネ福音書の文脈ではすべてのユダヤ人を一括して指すとは限らない点も明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙述の厳粛さを保った。「ご自分」はイエスを受ける自然な敬語的再帰表現であり、原文のἑαυτόνとἴδιονを区別しながら読みやすく示す。
