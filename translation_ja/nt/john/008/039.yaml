  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ· Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν. λέγει αὐτοῖς ὁ Ἰησοῦς· Εἰ τέκνα τοῦ Ἀβραάμ ⸀ἐστε, τὰ ἔργα τοῦ Ἀβραὰμ ⸀ἐποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/039.yaml
  text: They answered and said to him[a], “Abraham is our father.” Jesus says to them, “If you are Abraham’s children, you would be doing Abraham’s works.”
translation:
  language: ja
  text: 彼らはイエスに答えて言った。「私たちの父はアブラハムです。」イエスは彼らに言われた。「もしあなたがたがアブラハムの子どもなら、アブラハムの行いをしているはずです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もしあなたがたがアブラハムの子どもであったなら、アブラハムの行いをするはずです」。ギリシア語の未完了過去形は、事実に反する条件を示すものと理解することもできる。
    reason: 条件文におけるギリシア語未完了過去形の解釈上の幅を示すため。
lexical_decisions:
- source_word: Ἀπεκρίθησαν καὶ εἶπαν αὐτῷ
  choice: 彼らはイエスに答えて言った
  rationale: ヨハネ福音書に特徴的な「答えた、そして言った」という二重動詞を残しつつ、日本語として理解できる形にした。αὐτῷの指示対象は文脈上イエスなので明示した。
- source_word: Ὁ πατὴρ ἡμῶν Ἀβραάμ ἐστιν
  choice: 私たちの父はアブラハムです
  rationale: 血統上の父祖であるとの主張を、自然で明瞭な現代日本語で表した。「父祖」と解釈的に狭めず、πατήρを「父」とした。
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: イエスは彼らに言われた
  rationale: λέγειは歴史的現在だが、日本語の物語では過去形が自然である。イエスの発話には現代の標準的な聖書文体として尊敬表現を用いた。
- source_word: τέκνα τοῦ Ἀβραάμ
  choice: アブラハムの子ども
  rationale: τέκναは男女を含む親子関係・帰属を表すため、「息子」や「子孫」ではなく「子ども」とした。
- source_word: τὰ ἔργα τοῦ Ἀβραὰμ
  choice: アブラハムの行い
  rationale: ἔργαの具体的・倫理的な意味を保ち、「したこと」と説明的に言い換えず「行い」とした。
- source_word: ἐποιεῖτε
  choice: しているはずです
  rationale: 未完了過去形が条件文中で示す、現実の行動との食い違いと継続的な行為の含みを、自然な日本語の「しているはず」で表した。単純な事実命題にはしなかった。
theological_decisions:
- issue: アブラハムの子であることの性質
  choice: 「アブラハムの子ども」という関係表現と、その主張にふさわしい行いとの緊張をそのまま示した。
  alternative: 肉体的な血統を全面的に否定する、または霊的子たることだけを意味すると明示する。
  rationale: 本文は父祖との関係の主張を行いによって吟味しているが、肉体的血統と霊的関係についての体系的結論までは明言していないため。
- issue: 条件文の現実性
  choice: 「もし……なら、……しているはずです」とし、現在形の前件と反事実的な含意を併存させた。
  alternative: 「もし……であったなら、……したでしょう」と全面的な反事実条件として訳す。
  rationale: ἐστεは現在形である一方、帰結部のἐποιεῖτεは未完了過去形で、彼らの主張と実際の行動との緊張を生む。どちらか一方に完全には平板化しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話には丁寧体を採用した。逐語性を保ちながらも、歴史的現在は日本語の自然な物語時制で表した。神学的な含意を説明的に本文へ持ち込まず、条件文の緊張は脚注とともに保持した。
