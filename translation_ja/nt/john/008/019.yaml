reference: John 8:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ· Ποῦ ἐστιν ὁ πατήρ σου; ἀπεκρίθη Ἰησοῦς· Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου· εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/019.yaml
  text: So they were saying to him[a], “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”
translation:
  language: ja
  text: そこで、彼らはイエスに言った。「あなたの父はどこにいるのですか。」イエスは答えた。「あなたがたは、わたしも、わたしの父も知りません。もしわたしを知っていたなら、わたしの父をも知っていたでしょう[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシャ語は未完了過去形を用いた反事実的な条件文である。この日本語の「知っていたなら」は、必ずしも過去の時点だけを指すのではなく、聞き手が現在イエスを知っていないことに対する仮定を表しうる。
    reason: 原文の未完了過去＋ἄνによる反事実的含意を示し、日本語の過去形を過去時への限定として誤解しないようにするため。
lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的・反復的な側面を自然な日本語で保つ。「言い続けていた」ほど反復を強調しない。
- source_word: οὖν
  choice: そこで
  rationale: 直前の発言を受けた談話の進行と応答を示す接続語として、自然で明瞭な表現。
- source_word: Ποῦ ἐστιν ὁ πατήρ σου;
  choice: あなたの父はどこにいるのですか
  rationale: 問いの直接性を保ちつつ、πατήρを「父」と訳して、単なる「父親」へ意味を狭めない。日本語には大文字表記の区別がないため、神を指すことは文脈に委ねる。
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 物語文として簡潔で標準的な応答表現。原文にない敬語的評価を加えない。
- source_word: Οὔτε ἐμὲ οἴδατε οὔτε τὸν πατέρα μου
  choice: あなたがたは、わたしも、わたしの父も知りません
  rationale: οὔτε…οὔτεの並列否定を日本語の「…も、…も…ない」で自然に表し、「知る」が持つ知識・認識・関係性の幅を残す。
- source_word: οἶδατε / ᾔδειτε
  choice: 知りません／知っている
  rationale: 同じ動詞の語彙的連続性を保ち、「認める」「理解する」など一面的な解釈に限定しない。日本語では状態を自然に示すため、条件節に「知っている」を用いる。
- source_word: εἰ ἐμὲ ᾔδειτε, καὶ τὸν πατέρα μου ἂν ᾔδειτε
  choice: もしわたしを知っているのなら、わたしの父をも知っているはずです
  rationale: 現在の事実に反する含みを直前の否定と「はずです」によって示しつつ、過去の出来事だけを指すような日本語を避ける。καίは「も」で反映する。
theological_decisions:
- issue: 「父」が神を指すことの示し方
  choice: 本文では一貫して「父」と訳し、文脈によって神を指すことを示す
  alternative: 「父なる神」と明示する
  rationale: 原文はπατήρであり、「父なる神」と補えば対話に含まれる聞き手側の誤解やヨハネ福音書特有の含みを先回りして解消してしまう。日本語には英語の大文字・小文字の区別がない。
- issue: イエスと父を「知る」ことの意味
  choice: 広い意味を持つ「知る」を保持する
  alternative: 「理解する」または「認める」
  rationale: 知的理解、認識、関係的な知識を含みうるヨハネ的な緊張を保ち、特定の神学的説明に限定しない。
- issue: 条件文の反事実性
  choice: 現在時の表現を保ち、「はずです」と文脈で反事実的含意を伝える
  alternative: 「もしわたしを知っていたなら、わたしの父をも知っていたでしょう」
  rationale: ギリシャ語の未完了過去とἄνは反事実的条件を示すが、日本語の過去完了的表現は過去時のみを強く連想させうる。本文は現在の認識についての発言として自然にし、文法的含みを注で示す。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、会話は丁寧だが過度に格式張らない調子とした。イエスの発言内容には敬意を保ちつつ、原文にない尊敬語は物語地の文へ持ち込まなかった。
