  text: οἶδα ὅτι σπέρμα Ἀβραάμ ἐστε· ἀλλὰ ζητεῖτέ με ἀποκτεῖναι, ὅτι ὁ λόγος ὁ ἐμὸς οὐ χωρεῖ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/037.yaml
  text: I know that you are Abraham’s offspring[a]; but you are seeking to kill me[b], because my word has no place in you.
translation:
  language: ja
  text: あなたがたがアブラハムの子孫[a]であることは、私は知っている。しかし、あなたがたは私を殺そうとしている。私の言葉は、あなたがたのうちに入り込む余地がないからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「アブラハムの種」。すなわち、アブラハムの血統に連なる者たち。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私の言葉が、あなたがたのうちに場所を得ないからである」または「私の言葉が、あなたがたの間で広まらないからである」。
    reason: lexical_alternative
lexical_decisions:
- source_word: σπέρμα Ἀβραάμ
  choice: アブラハムの子孫
  rationale: σπέρμαはここでは集合的に血統上の子孫を指す。「子孫」は現代日本語として自然であり、単数形の「種」が生む不自然さを避けつつ、系譜的意味を明確に保つ。
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: あなたがたは私を殺そうとしている
  rationale: ζητέω＋不定詞は、ある行為を求める、企てる、しようとする意味を表しうる。「殺そうとしている」は現在形の継続的な企てを自然な日本語で示し、動機まで過度に限定しない。
- source_word: ὁ λόγος ὁ ἐμὸς
  choice: 私の言葉
  rationale: λόγοςの基本的な語感とヨハネ文書における重層性を保つため、「教え」や「メッセージ」と限定せず「言葉」とした。
- source_word: οὐ χωρεῖ ἐν ὑμῖν
  choice: あなたがたのうちに入る余地がない
  rationale: χωρέωがもつ「場所を得る、受け入れられる、進展する」という比喩的な幅を保つ。「入る余地がない」は、彼らの内にイエスの言葉を受け入れる場所がないという文脈を自然に表す。
- source_word: ἀλλὰ
  choice: しかし
  rationale: アブラハムの血統に属するという承認と、イエスを殺そうとする行動との強い対照を明確に示す。
- source_word: οἶδα ὅτι
  choice: ～であることは、私も知っている
  rationale: 内容節を明示しつつ、後続する対照を自然に際立たせる日本語語順とした。「私も」は、相手の主張を認める含みを文脈上自然に表す。
theological_decisions:
- issue: アブラハムからの身体的血統と、アブラハムに真に倣うこととの関係
  choice: σπέρμα Ἀβραάμを血統上の意味で「アブラハムの子孫」と訳す。
  alternative: アブラハムの子どもたち
  rationale: この節でイエスは彼らの身体的・系譜的な出自を認めながら、その行動との矛盾を指摘している。「子孫」とすることで、周辺の節で展開される霊的・倫理的な子としての議論を先取りせず、神学的緊張を保つ。
- issue: οὐ χωρεῖ ἐν ὑμῖνの解釈範囲
  choice: 「あなたがたのうちに入る余地がない」とし、内的受容の欠如を表す比喩を保持する。
  alternative: 「あなたがたの間で広まらない」または「あなたがたの心に根づかない」
  rationale: 原文は、内に場所を得ないことと進展しないことの両方を含みうる。「入る余地がない」は一方に狭く限定しすぎず、拒絶という文脈に合う。
translation_notes:
  register: 明瞭な現代標準日本語を用い、対話の厳粛さを保った。「私」を採用し、文末は説明的な「である」で整えた。比喩的表現は不自然にならない範囲で原文に近く保持した。
