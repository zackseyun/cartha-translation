  text: ταῦτα αὐτοῦ λαλοῦντος πολλοὶ ἐπίστευσαν εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/030.yaml
  text: As he was saying these things[b][a], many believed in him.
translation:
  language: ja
  text: イエスがこれらのことを語っておられる間に、多くの人がイエスを信じた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスに信頼を置いた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 中性複数対格の指示代名詞で、直前までのイエスの発言内容を受ける。複数形と文脈上のつながりを保った。
- source_word: αὐτοῦ λαλοῦντος
  choice: イエスが…語っておられると
  rationale: 現在分詞による属格絶対で、信じる出来事と同時進行の発話を表す。日本語では主語を「イエス」と明示し、継続性を「語っておられる」で示した。
- source_word: πολλοὶ
  choice: 多くの人が
  rationale: 形容詞の名詞的用法。日本語として自然かつ明確にするため「人」を補った。
- source_word: ἐπίστευσαν
  choice: 信じた
  rationale: アオリスト直説法を、出来事全体を簡潔に述べる過去形で表した。「信じるようになった」として起動相を明示することは避けた。
- source_word: εἰς αὐτόν
  choice: イエスを
  rationale: ヨハネに特徴的な πιστεύω + εἰς は、単に発言を真実と認めること以上に、その人物へ向けられた信頼を表す。現代日本語では「イエスを信じた」が自然である。
theological_decisions:
- issue: ヨハネ文書における πιστεύω εἰς αὐτόν の訳し方
  choice: イエスを信じた
  alternative: イエスに信頼を置いた
  rationale: 人物に向けられた信頼という関係的な力を保ちつつ、原語以上に信仰の質や持続性を規定しない簡潔な表現とした。後続文脈がこの信仰のあり方に緊張を生じさせる可能性も、訳文で先取りして解消しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「おられる」はイエスへの敬意を自然に示し、発話の継続性も表す。代名詞の連続による曖昧さを避けるため、主節と従属節の双方で「イエス」を明示した。
