id: JHN.8.52
reference: John 8:52
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀εἶπον αὐτῷ οἱ Ἰουδαῖοι· Νῦν ἐγνώκαμεν ὅτι δαιμόνιον ἔχεις. Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται, καὶ σὺ λέγεις· Ἐάν τις τὸν λόγον μου τηρήσῃ, οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/052.yaml
  text: The Jews said to him[a], “Now we know that you have a demon. Abraham died, and the prophets also, yet you say, ‘If anyone keeps my word[c][b], he will certainly never taste death forever.’”
translation:
  language: ja
  text: ユダヤ人たちはイエスに言った。「これで、あなたが悪霊につかれていることが分かった[a]。アブラハムは死に、預言者たちも死んだ。それなのに、あなたは、『わたしのことばを守る者は、決して死を味わうことはない[b]』と言う。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたは悪霊を持っている」。
    reason: lexical_alternative
  - marker: b
    text: 「決して…ない」はギリシア語の強い否定を表す。「いつまでも」に当たる表現は、この否定が将来のいかなる時点にも及ぶことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 本文の集団呼称を直接に訳した。「ユダヤの指導者たち」は文脈上の解釈を加えるため採らない。
- source_word: Νῦν ἐγνώκαμεν
  choice: これで…分かった
  rationale: 完了形が示す、今の認識に至ったという結果を自然な日本語で表した。
- source_word: δαιμόνιον ἔχεις
  choice: 悪霊につかれている
  rationale: 字義は「悪霊を持っている」だが、日本語として自然で、当時の非難の意味を明確に伝える表現を本文に採用した。字義的表現は脚注に示す。
- source_word: Ἀβραὰμ ἀπέθανεν καὶ οἱ προφῆται
  choice: アブラハムは死に、預言者たちも死んだ
  rationale: καίによる並列と、両者が死んだという反論の論旨を明瞭にした。
- source_word: καὶ σὺ λέγεις
  choice: それなのに、あなたは…と言う
  rationale: 文脈における対比的な力を自然な日本語で表した。
- source_word: τὸν λόγον μου τηρήσῃ
  choice: わたしのことばを守る
  rationale: λόγοςを「ことば」、τηρέωを「守る」とし、聞く、従う、保つという含意を一つに狭めないようにした。
- source_word: οὐ μὴ γεύσηται θανάτου εἰς τὸν αἰῶνα
  choice: 決していつまでも死を味わうことがない
  rationale: οὐ μήの強い否定、γεύομαιの比喩「味わう」、εἰς τὸν αἰῶναの時間的広がりを保った。「永遠に死を味わう」と誤読されない語順にした。
theological_decisions:
- issue: 「死を味わう」が指す死の性質
  choice: 「死を味わう」という比喩をそのまま残す
  alternative: 肉体の死、霊的な死、または終末的・永遠の死と明示する
  rationale: 反対者はアブラハムと預言者の肉体的な死を挙げる一方、ヨハネ福音書の表現には重層的な意味があり得る。本文が特定していない意味を訳文で一つに限定しない。
- issue: δαιμόνιον ἔχεις の表現
  choice: 本文では「悪霊につかれている」
  alternative: 「悪霊を持っている」
  rationale: 非難の意味を現代日本語で自然に示しつつ、ギリシア語の字義は脚注で保持した。
translation_notes:
  register: 明快な現代標準語を用い、対話の鋭さを保ちながら過度に口語的にはしなかった。「イエス」はギリシア語では代名詞だが、日本語で話者の指示対象を明確にするため補った。脚注記号[a][b]はすべて本文に対応させた。
