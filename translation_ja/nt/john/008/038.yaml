id: JHN.8.38
reference: John 8:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ἃ ἐγὼ⸃ ἑώρακα παρὰ τῷ ⸀πατρὶ λαλῶ· καὶ ὑμεῖς οὖν ⸂ἃ ἠκούσατε⸃ παρὰ ⸂τοῦ πατρὸς⸃ ποιεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/038.yaml
  text: I speak what I have seen with the Father[a], and you, then, do what you have heard from your father.
translation:
  language: ja
  text: わたしは、父のもとで見たことを語っている。だから、あなたがたも、父から聞いたことを行っている。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「行っている」は、文法上「行いなさい」とも取れる。より直訳に近くは、「わたしは父のもとで見たことを語っている。だから、あなたがたも父から聞いたことを行っている」。ギリシャ語では二番目の「父」に「あなたがたの」や「自分たちの」に当たる語はなく、その父が誰かはこの節では明示されていない（44節参照）。
    reason: ποιεῖτε は直説法現在形と命令法現在形で形が同一であり、また δεύτεの「父」には所有代名詞が明示されていないため、その両方の曖昧さを保持する。
lexical_decisions:
- source_word: ἃ
  choice: こと
  rationale: 中性複数の関係代名詞を、「見たこと」「聞いたこと」という自然な日本語の内容節で表した。
- source_word: ἑώρακα
  choice: 見た
  rationale: 完了形が示す過去の経験と現在への関わりは文脈で十分伝わるため、自然な日本語の過去形とした。
- source_word: παρὰ τῷ πατρὶ
  choice: 父のもとで
  rationale: 与格を伴う παρά の近接・臨在の意味を保ち、単なる情報源を示す「父から」と区別した。
- source_word: λαλῶ
  choice: 話している
  rationale: 現在形の継続的な発話を自然に表し、内容は直前の「見たこと」を目的語として受けた。
- source_word: οὖν
  choice: だから
  rationale: 前半と後半の推論的・対照的なつながりを、現代日本語で明瞭に示した。
- source_word: ἠκούσατε
  choice: 聞いた
  rationale: アオリストを自然な過去形で表し、現在の行為への影響は後続の現在形によって示した。
- source_word: παρὰ τοῦ πατρὸς
  choice: 自分たちの父から
  rationale: 属格を伴う παρά の起点・源泉を「から」で表した。ギリシャ語に所有代名詞はないが、対照と日本語の明瞭さのため、文脈上含意される関係を「自分たちの」で示した。
- source_word: ποιεῖτε
  choice: 行っている
  rationale: 直説法現在として理解し、彼らが現にしていること、また継続的な行動を表した。命令形の可能性は注記した。
- source_word: πατήρ / πατρὸς
  choice: 父／父
  rationale: 日本語では大文字・小文字の区別がないため、第一の父は文脈上神を指し、第二の父の正体は本文で先取りせず、対照そのものを保った。
theological_decisions:
- issue: 第二の「父」を悪魔と明示するか
  choice: 「自分たちの父」とし、正体を本文では明示しない。
  alternative: 「悪魔から」または「父から」
  rationale: 44節で明示される正体を38節へ先取りせず、物語上の緊張と段階的な開示を保った。
- issue: ποιεῖτε を直説法と命令法のどちらに取るか
  choice: 直説法「行っている」
  alternative: 命令法「行いなさい」
  rationale: 形態上は両方が可能だが、イエスが父のもとで見たことを語るのに対し、相手も自分たちの父から聞いたことを行うという対照として読むと、直説法が文脈に適する。ただし真正な曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら尊厳ある語調とした。「父のもとで」は臨在を表し、「自分たちの父から」は対照を自然に伝える。訳文では ποιεῖτε を直説法に取り、別解を脚注に示した。
