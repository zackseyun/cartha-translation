source:
  edition: robinson-pierpont-2005-byzantine
  text: Ὄρθρου δὲ πάλιν παρεγένετο εἰς τὸ ἱερόν, καὶ πᾶς ὁ λαὸς ἤρχετο πρὸς αὐτόν· καὶ καθίσας ἐδίδασκεν αὐτούς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/002.yaml
  text: At dawn he came again to the temple, and all the people were coming to him; and he sat down and began to teach them.
translation:
  language: ja
  text: 夜明けに、イエスは再び神殿に来られた。民はみな、イエスのもとに来ていた。イエスは座って、彼らを教えておられた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、姦通の現場で捕らえられた女の物語（ヨハネ7:53—8:11）の続きである。この物語は最古期のギリシャ語写本にはない。ヨハネ7:53の注を参照。
    reason: textual_critical
lexical_decisions:
- source_word: Ὄρθρου
  choice: 夜明けに
  rationale: 日の出前後の早朝を表す時の属格を、簡潔で自然な現代日本語にした。
- source_word: παρεγένετο
  choice: 来られた
  rationale: 目的地である神殿への到来を表す。主語は文脈上イエスであり、日本語として明示した。
- source_word: ἱερόν
  choice: 神殿
  rationale: 内陣だけでなく、教えることのできた境内を含む神殿域全体を指す。標準的な訳語を用いた。
- source_word: πᾶς ὁ λαὸς
  choice: 民は皆
  rationale: λαός を文脈に即して「民」とし、πᾶς の包括性を「皆」で保持した。
- source_word: ἤρχετο
  choice: やって来た
  rationale: 未完了過去の継続・反復的な含みは文脈に残るが、日本語では自然さを優先して単純過去とした。
- source_word: καθίσας
  choice: 座り
  rationale: 教え始める前に座ったという分詞の時間的関係を自然に表した。
- source_word: ἐδίδασκεν
  choice: 教え始められた
  rationale: 未完了過去にあり得る開始相を採用した。ただし継続相の「教えておられた」も可能である。
theological_decisions:
- issue: 主語代名詞 αὐτός の訳出
  choice: イエス
  alternative: 彼
  rationale: 日本語で指示対象を明確にし、自然な敬体ではない叙述文にするため、文脈上の指示対象を固有名で示した。神学的解釈を付加するものではない。
- issue: ἐδίδασκεν の時制・相
  choice: 教え始められた
  alternative: 教えておられた
  rationale: 座るという先行動作の後に教授が始まる流れを表したが、ギリシャ語の未完了過去は進行・継続としても理解できるため、その曖昧さを注記する。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述調。「来られた」「教え始められた」により、イエスへの自然な敬意を示した。脚注記号は本文末に置き、節全体が本文批評上の注の対象であることを明確にした。
