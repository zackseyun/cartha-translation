  text: εἶπον οὖν αὐτῷ οἱ Φαρισαῖοι· Σὺ περὶ σεαυτοῦ μαρτυρεῖς· ἡ μαρτυρία σου οὐκ ἔστιν ἀληθής.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/013.yaml
  text: So the Pharisees said to him, “You are testifying about yourself; your testimony is not true.”
translation:
  language: ja
  text: そこで、ファリサイ人たちは彼に言った。「あなたは自分について証言している。あなたの証言は真実ではない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの証言は有効ではない」。ギリシア語は直訳すると「真実ではない」だが、この文脈では法的に有効でないという意味も含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの発言を受けた論理的・物語的な展開を、自然な現代日本語で示す。
- source_word: εἶπον ... αὐτῷ οἱ Φαρισαῖοι
  choice: ファリサイ派の人々は彼に言った
  rationale: 語順を自然な日本語に整えつつ、αὐτῷを固有名詞に置き換えず「彼に」と訳した。οἱ Φαρισαῖοιは集団を指すことが明瞭になるよう「ファリサイ派の人々」とした。
- source_word: Σὺ περὶ σεαυτοῦ
  choice: あなたは自分自身について
  rationale: 明示されたΣὺと再帰代名詞σεαυτοῦの強調を保ち、自己についての証言であることを明確にした。
- source_word: μαρτυρεῖς
  choice: 証言している
  rationale: 現在形の継続的な響きと、文脈にある証言・立証の含意を自然に表す。
- source_word: ἡ μαρτυρία σου
  choice: あなたの証言
  rationale: μαρτυρεῖςとの語彙的なつながりを保ち、法廷的な含意も残す。
- source_word: οὐκ ἔστιν ἀληθής
  choice: 真実ではない
  rationale: ἀληθήςの直接的な意味を保ち、単に法的に「有効でない」という意味へ限定しない。
theological_decisions:
- issue: 自己証言に対するファリサイ派の異議の意味
  choice: あなたの証言は真実ではない
  alternative: あなたの証言は有効ではない
  rationale: 文脈には法的な有効性をめぐる含みがあるが、ἀληθήςはそれより広く真実性も表すため、本文では両義の緊張を保つ表現を選び、法的な可能性は脚注で示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。対話の鋭さを保ちつつ、過度に古風な「証しする」は避け、「証言する」を用いた。
