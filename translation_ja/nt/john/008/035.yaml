  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ δοῦλος οὐ μένει ἐν τῇ οἰκίᾳ εἰς τὸν αἰῶνα· ⸀ὁ υἱὸς μένει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/035.yaml
  text: The servant does not remain in the household forever[b][a]; the son remains forever.
translation:
  language: ja
  text: 奴隷[a]はいつまでも家にとどまることはない。息子[b]はいつまでもとどまる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」とも訳せるが、ギリシア語δοῦλοςは基本的に奴隷を指す。ここでは家における息子との身分の対比を明確にするため、「奴隷」とした。
    reason: lexical_alternative
  - marker: b
    text: ここでの「息子」は家における身分を述べる格言的な表現だが、周囲の文脈ではイエスを暗示している可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: 奴隷
  rationale: 息子との身分上の対比が中心であり、家における拘束された非恒久的な立場を明確に伝えるため。「しもべ」より原語の社会的身分を保つ。
- source_word: μένει
  choice: とどまる
  rationale: 二度の反復を日本語でも保ち、家における立場が続くことを自然に表す。
- source_word: οἰκία
  choice: 家
  rationale: 物理的な建物だけでなく、家族・家に属する共同体をも指し得る自然な日本語。文脈上、奴隷と息子の所属と身分の対比が伝わる。
- source_word: εἰς τὸν αἰῶνα
  choice: いつまでも
  rationale: 継続が恒久的であることを、現代日本語で自然に表す。両節で同じ表現を用いて対照を保つ。
- source_word: υἱός
  choice: 息子
  rationale: 男性単数の語義と、家における奴隷との身分上の対比を保つ。文脈上イエスを響かせる可能性も排除しない。
- source_word: δὲ
  choice: （訳語を明示しない）
  rationale: 日本語では主題提示と後続する二つの文の対照によって談話上の転換が十分伝わるため、不自然な接続語を加えない。
theological_decisions:
- issue: 「息子」がイエスを暗示する可能性
  choice: 普通名詞として「息子」と訳し、称号化しない
  alternative: 「御子」
  rationale: この節は家における身分についての格言的な言い方であると同時に、続く節のイエスの言葉を準備している。「御子」として明示せず、原文の含みと神学的緊張を保つ。
translation_notes:
  register: 明快で現代的だが品位のある標準語。「とどまる」を二度繰り返して原文の対句構造を保ち、「息子」を「御子」とせず、格言的意味とキリスト論的な含みの両方を残した。
