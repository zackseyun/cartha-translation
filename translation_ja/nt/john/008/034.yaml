  text: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι πᾶς ὁ ποιῶν τὴν ἁμαρτίαν δοῦλός ἐστιν τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/john/008/034.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you[b], everyone who practices sin is a servant of sin.”
translation:
  language: ja
  text: イエスは彼らに答えられた。「よくよくあなたがたに言っておく。罪を犯す者[a]は皆、罪の奴隷である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪を行う者は皆」とも訳せる。ギリシア語の現在分詞には、継続的または特徴的に罪を行うという含みがあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς
  choice: イエスは彼らに答えられた
  rationale: 対話における応答を自然な現代日本語で表し、αὐτοῖςも「彼らに」と明示した。
- source_word: Ἀμὴν ἀμὴν
  choice: よくよく
  rationale: ヨハネ福音書に特徴的な二重の厳粛な確言を、反復の重みを保つ定着した聖書的表現で示した。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言っておく
  rationale: 宣言の厳粛さと聞き手への直接性を、自然で格調ある日本語にした。
- source_word: πᾶς ὁ ποιῶν τὴν ἁμαρτίαν
  choice: 罪を行っている者は皆
  rationale: 現在分詞の継続的・特徴的な含みを「行っている」で保ちつつ、「習慣的に」と解釈を狭めすぎないようにした。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 単なる奉仕者ではなく、罪の支配下にある拘束状態が議論の中心なので、比喩の強さを保持した。
- source_word: τῆς ἁμαρτίας
  choice: 罪の
  rationale: 属格が表す所属・支配関係を簡潔に保ち、「罪の奴隷」という自然な日本語にした。
theological_decisions:
- issue: 現在分詞 ποιῶν が表す罪の行為の性質
  choice: 「罪を行っている者」とし、継続的または特徴的な行為の含みを残す
  alternative: 「罪を犯す者」または「罪を習慣的に行う者」
  rationale: 「罪を犯す」では単発の行為とも読め、「習慣的に」では文法上の含意を明示しすぎるため、中間的な訳で原文の幅を保った。
- issue: δοῦλος の隷属比喩
  choice: 「罪の奴隷」
  alternative: 「罪の僕」または「罪に仕える者」
  rationale: 文脈は自由と隷属の対照であり、「奴隷」が罪による拘束と支配を最も明確に伝える。
translation_notes:
  register: 明瞭な現代標準語を基調としながら、イエスの厳粛な宣言には「よくよく」「言っておく」を用いて格調を保った。「奴隷」は歴史的・社会的に強い語だが、ここでは原文の隷属比喩を弱めないため採用した。
