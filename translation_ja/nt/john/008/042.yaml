source:
  edition: SBLGNT
  text: ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ, ἐγὼ γὰρ ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω· οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα, ἀλλ’ ἐκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/042.yaml
  text: Jesus said to them[a], “If God were your Father, you would love me, because I came from God and am here. For I have not come from myself[b], but he sent me.”
translation:
  language: ja
  text: イエスは彼らに言われた。「もし神があなたがたの父であったなら、あなたがたはわたしを愛していたでしょう。わたしは神から出て来て、ここにいるからです。[a] というのも、わたしは自分から来たのではなく、神がわたしを遣わされたからです。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「わたしは神から出て来て、ここに来たのです」。ここで「神から出て来た」は、神を起源・出所とすることを表します。
    reason: lexical_alternative
  - marker: b
    text: 「自分の判断で来たのではなく」とも訳せます。ギリシア語は、自分を出所としたのではないことと、独自の意志で来たのではないことの両方を含み得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ ὁ θεὸς πατὴρ ὑμῶν ἦν ἠγαπᾶτε ἂν ἐμέ
  choice: もし神があなたがたの父であるなら、あなたがたはわたしを愛するはずです
  rationale: εἰ＋未完了過去とἄνによる事実に反する条件を、現代日本語で不自然にならない「もし…であるなら、…はずです」で表した。文脈上、現実にはそうではないという含みがある。
- source_word: ἐκ τοῦ θεοῦ ἐξῆλθον καὶ ἥκω
  choice: わたしは神のもとから出て来て、今ここにいる
  rationale: ἐκとἐξῆλθονが示す起源・出所を「神のもとから出て来て」で保ち、到着後の現在的な状態を含むἥκωを「今ここにいる」とした。
- source_word: οὐδὲ γὰρ ἀπ’ ἐμαυτοῦ ἐλήλυθα
  choice: わたしは自分から来たのではなく
  rationale: ἀπ’ ἐμαυτοῦの出所を表す形を保ちつつ、自発的・独断的に来たのではないという含みも日本語の「自分から」に残した。γάρは前文の理由づけだが、日本語では続く対比構文の流れによって明確なため、接続語を重ねなかった。
- source_word: ἀλλ’ ἐκεῖνός με ἀπέστειλεν
  choice: 神がわたしを遣わされたのです
  rationale: 強意的なἐκεῖνοςの指示対象を曖昧にしないよう「神」と明示し、ἀποστέλλωの使命・派遣の語感を「遣わす」で保持した。
theological_decisions:
- issue: イエスの神からの起源を表す言葉
  choice: 神のもとから出て来て、今ここにいる
  alternative: 神から出て来て、来ている
  rationale: 神的起源と派遣を明確にしながら、ἐξέρχομαιを後代の教義上の専門用語に固定せず、ἥκωの現在的到着状態も自然な日本語で示した。
- issue: ἀπ’ ἐμαυτοῦが表す出所と独立した意志の両義性
  choice: 自分から来たのではなく
  alternative: 自分自身を出所として来たのではなく／自分の判断で来たのではなく
  rationale: 「自分から」は日本語でも出所と自発的行動の双方を含み得るため、原文の意味の幅を狭めず、直後の「神が…遣わされた」との対比を保てる。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。イエスの発話には丁寧体を用い、「父」「遣わす」などヨハネ福音書の関係性と使命を示す語を保持した。脚注記号は対応箇所の本文中に配置した。
