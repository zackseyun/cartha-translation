reference: John 8:53
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἀβραάμ, ὅστις ἀπέθανεν; καὶ οἱ προφῆται ἀπέθανον· τίνα ⸀σεαυτὸν ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/053.yaml
  text: Surely you are not greater than our father Abraham[a], who died? The prophets also died[b]. Who do you make yourself out to be?
translation:
  language: ja
  text: まさかあなたが、死んだ私たちの父アブラハムよりも偉大なのですか。[a] 預言者たちも死にました。あなたは自分を何者だと主張するのですか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたが、死んだ私たちの父アブラハムよりも偉大なのですか」。ギリシア語の問いは、否定の答えを予想する形になっている。
    reason: 修辞疑問の含意を示すため
  - marker: b
    text: 直訳に近くは「あなたは自分を何者としているのですか」。ここでは「自分を何者だと主張するのか」という意味。
    reason: ギリシア語の慣用表現と訳語の関係を示すため
lexical_decisions:
- source_word: μὴ σὺ
  choice: まさかあなたは……というのですか
  rationale: μήで始まる問いが否定の答えを予想していることを、「まさか」によって自然な現代日本語で示し、相手を問い詰める調子も保った。
- source_word: μείζων
  choice: 偉い
  rationale: 地位・重要性・卓越性を含み得る比較表現であるため、意味を特定の一面に限定しない簡潔な訳語とした。
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: 私たちの父アブラハムよりも
  rationale: 比較に伴う属格を「よりも」で表し、アブラハムを民族的祖先として敬う「私たちの父」という表現を保持した。
- source_word: ὅστις ἀπέθανεν
  choice: 死んだ
  rationale: アブラハムが歴史上死んだという事実を、アオリストに即して端的に表した。
- source_word: καὶ οἱ προφῆται ἀπέθανον
  choice: 預言者たちも死にました
  rationale: καίを「も」と訳し、アブラハムと同様に預言者たちも死んだという並行関係を明確にした。
- source_word: τίνα σεαυτὸν ποιεῖς
  choice: あなたは自分を何者だというのですか
  rationale: 字義どおりの不自然な表現を避けつつ、自分を何者として示し、または主張しているのかと問い詰める慣用的な意味を保った。
theological_decisions:
- issue: イエスがアブラハムや預言者たちより偉大なのかをめぐる修辞的な挑戦
  choice: 否定の答えを予想する敵対的な問いとして訳す
  alternative: 中立的に「あなたは私たちの父アブラハムより偉いのですか」と訳す
  rationale: ギリシア語のμήは否定の答えを予想させる。そこで「まさか」を用いて話者の強い否認と挑戦を示す一方、イエスの身分について本文自体がここで与えていない神学的結論は訳文に加えなかった。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、対立場面にふさわしい厳粛さと鋭い問いの調子を保った。「ですか／ました」で統一し、口語的すぎる表現は避けた。
