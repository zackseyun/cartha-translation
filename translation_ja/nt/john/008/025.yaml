  text: ἔλεγον οὖν αὐτῷ· Σὺ τίς εἶ; ⸀εἶπεν αὐτοῖς ὁ Ἰησοῦς· Τὴν ἀρχὴν ⸂ὅ τι⸃ καὶ λαλῶ ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/025.yaml
  text: So they were saying to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning.”
translation:
  language: ja
  text: そこで彼らはイエスに言った。「あなたは、いったい何者なのですか。」イエスは彼らに言われた。「初めからあなたがたに話してきたとおりの者だ。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: イエスの返答に当たるギリシア語は解釈が難しい。「初めから、私があなたがたに話してきたとおりの者だ」とも、「まさに、私があなたがたに言っているとおりの者だ」とも、「そもそも、なぜあなたがたに話しているのか」とも訳し得る。
    reason: Τὴν ἀρχὴν の意味と文全体の統語関係には実際の曖昧さがあり、主要な解釈を示して本文の一解釈を限定するため。
lexical_decisions:
- source_word: Σὺ τίς εἶ;
  choice: 「あなたは、いったい何者なのですか」
  rationale: τίς は身元・正体を問う表現。強調された Σὺ を、自然な現代日本語の「あなたは、いったい」で表した。
- source_word: Τὴν ἀρχὴν
  choice: 「初めから」
  rationale: 対格句を時間的用法と捉え、イエスが当初から語ってきた内容を指す読みを本文に採用した。
- source_word: ὅ τι καὶ λαλῶ ὑμῖν
  choice: 「あなたがたに話している、その者だ」
  rationale: 直訳的な構文の緊張を保ちつつ、質問「何者か」への答えとして通じる日本語にした。現在形 λαλῶ は「話している」とした。
theological_decisions:
- issue: イエスの返答 Τὴν ἀρχὴν ὅ τι καὶ λαλῶ ὑμῖν の解釈
  choice: 「初めからあなたがたに話している、その者だ」
  alternative: 「そもそも、なぜあなたがたに話しているのか」／「まさに、私があなたがたに言っているとおりの者だ」
  rationale: ギリシア語は統語・語義上きわめて難解で複数の解釈がある。文脈上、イエスがこれまで一貫して示してきた自己証言を指す読みを本文に置くが、異なる解析を脚注で明示し、曖昧さを隠さない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、問いの切迫感を「いったい」で示した。イエスの返答は断定の簡潔さと原文の解釈上の緊張を保ち、主要な別訳を脚注に収めた。
