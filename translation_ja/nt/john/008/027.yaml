    text: 別訳「彼らは、イエスが父について自分たちに語っていたことを知らなかった。」
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἔγνωσαν
  choice: 理解しなかった
  rationale: γινώσκωの基本義は「知る」だが、ここではイエスの言葉が何を指すかを聞き手が把握できなかったことを表すため、現代日本語として自然な「理解しなかった」とした。
- source_word: ὅτι
  choice: ことを
  rationale: 彼らが理解しなかった内容を導く内容節として、「〜ことを」で表した。
- source_word: τὸν πατέρα
  choice: 父
  rationale: ヨハネ福音書の直近の文脈ではイエスが神を指して用いている呼称であり、日本語聖書として簡潔に「父」とした。
- source_word: αὐτοῖς
  choice: 自分たちに
  rationale: λέγωとともに発言の相手を示す与格である。主節の「彼ら」との関係が明確になる自然な日本語として「自分たちに」とした。
- source_word: ἔλεγεν
  choice: 話しておられる
  rationale: 未完了過去の継続的・進行的な側面を反映した。地の文ではイエスへの敬意を示す自然な現代日本語として尊敬表現を用いたが、発話内容そのものは加えていない。
theological_decisions:
- issue: 「父」の指示対象
  choice: 神である父を指す呼称として「父」と訳す。
  alternative: 人間の父を指す普通名詞として読む。
  rationale: 直前のヨハネ福音書の文脈で、イエスはご自分を遣わした方を「父」と呼んでいる。これは文脈上の同定を反映するもので、後代の教理的説明を本文に付加するものではない。
- issue: 文脈におけるγινώσκωの訳
  choice: 「理解しなかった」とする。
  alternative: 「知らなかった」または「気づかなかった」とする。
  rationale: 聞き手がイエスの発言の指示対象を把握できなかったという文脈的意味を自然に示す。「知らなかった」という語義上可能な訳は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イエス」を補って主語を明示し、日本語での照応の曖昧さを避けた。本文の[a]と脚注を対応させた。
