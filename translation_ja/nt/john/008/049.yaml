  to: イエスは答えた[a]。「わたしは悪霊を宿していません。わたしはわたしの父を敬っていますが、あなたがたはわたしを辱めています。」
  rationale: 「悪霊を宿していません」により、悪霊の単なる不在ではなく、話者が悪霊を有するとの非難を否定する原文の構文を日本語で表しました。「わたしの父」として原文の所有表現を過不足なく保ち、「が」により敬うことと辱めることの対照を自然に示しました。脚注は解釈的な状態表現のみを簡潔に提示します。
