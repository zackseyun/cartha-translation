id: JHN.8.49
reference: John 8:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐγὼ δαιμόνιον οὐκ ἔχω, ἀλλὰ τιμῶ τὸν πατέρα μου, καὶ ὑμεῖς ἀτιμάζετέ με.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/049.yaml
  text: Jesus answered[a], “I do not have a demon, but I honor my Father, and you dishonor me.”
translation:
  language: ja
  text: イエスは答えた[a]。「わたしは悪霊を宿していません。わたしはわたしの父を敬っていますが、あなたがたはわたしを辱めています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしは悪霊に取りつかれてはいません」。
    reason: 「悪霊を持つ」という原文の慣用表現が指す状態を明示する解釈的な別訳。
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: ヨハネの対話における標準的な応答動詞として、自然で直接的な日本語を用いた。
- source_word: δαιμόνιον οὐκ ἔχω
  choice: わたしには悪霊はいません
  rationale: 「悪霊を持つ」というギリシア語の言い回しを、日本語として理解可能な存在構文で比較的直接に保持した。「悪霊に取りつかれてはいない」は意味を明示する解釈的訳なので脚注に置いた。
- source_word: τιμῶ
  choice: 敬っています
  rationale: τιμάωの「敬う、尊ぶ」という意味を表し、後続のἀτιμάζωとの対照も保てる。
- source_word: τὸν πατέρα μου
  choice: 自分の父
  rationale: 話者イエスの父、すなわち文脈上は神を指す。日本語では固有の神称として不自然な表記を加えず、文脈に委ねた。再帰的な「自分の」により主語との関係を明確にした。
- source_word: ἀτιμάζετέ με
  choice: あなたがたはわたしを辱めています
  rationale: ἀτιμάζωの「不名誉を与える、敬意を払わない」を表し、τιμάωとの敬意・不敬の対照を保つ。「侮辱する」よりも発言だけに限定されない。
- source_word: Ἐγὼ … καὶ ὑμεῖς
  choice: わたしは……それなのに、あなたがたは
  rationale: 明示された代名詞の対照を保持し、ἀλλάとκαίが作る論旨上の対比を自然な日本語で示した。
theological_decisions:
- issue: 「わたしの父」の指示対象
  choice: 文脈上、神を指す「自分の父」と訳す
  alternative: 一般的な肉親の父を指す表現として読む
  rationale: ヨハネ福音書の直近の議論では、イエスが神を父として語っている。ただし訳文には「神」を補わず、原文の父という関係語を保持した。
- issue: 「悪霊がいる」の意味
  choice: 原文の「悪霊を持つ」に近い「わたしには悪霊はいません」を本文に置く
  alternative: 「わたしは悪霊に取りつかれてはいません」
  rationale: 後者はこの慣用表現の意図を明確にするが、憑依という状態を明示する解釈的な表現であるため脚注に回した。
- issue: 敬う者と辱められる者の非対称性
  choice: イエスが父を敬う一方、人々がイエスを辱めるという原文の非対称な対照をそのまま残す
  alternative: 人々が父を辱めるという含意まで本文で明示する
  rationale: 原文でἀτιμάζωの直接目的語はμε（わたしを）であり、神への含意があり得ても本文では補わない。
translation_notes:
  register: 明瞭で現代的ながら、対話の厳粛さを保つ文体とした。「辱める」は日常語の「侮辱する」よりやや格調があるが、父を「敬う」とイエスを「不名誉に扱う」との語義的対照を広く保てる。
