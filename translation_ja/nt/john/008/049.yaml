  terminology: 「悪霊に取りつかれている」は原文の慣用句の意味を明確にする訳であり、本文ではより語義に近い「悪霊を宿している」を用います。「敬う／辱める」の対応は保持します。「父」は文脈上の神への指示を保ちつつ、本文に「神」を補いません。
