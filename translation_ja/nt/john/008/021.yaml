id: JHN.8.21
reference: John 8:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς· Ἐγὼ ὑπάγω καὶ ζητήσετέ με, καὶ ἐν τῇ ἁμαρτίᾳ ὑμῶν ἀποθανεῖσθε· ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/021.yaml
  text: So he said to them again[a], “I am going away, and you will seek me, and you will die in your sin. Where I am going[c][b], you are not able to come.”
translation:
  language: ja
  text: そこで、イエスは再び彼らに言われた。「わたしは去っていく。あなたがたはわたしを捜すが、自分たちの罪の中で[a]死ぬ。わたしが行くところに、あなたがたは来ることができない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では「罪」は単数。個々の罪深い行為ではなく、罪の状態を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 前のやり取りを受けた話の展開と緩やかな帰結を、現代日本語で自然に示す。
- source_word: πάλιν
  choice: 再び
  rationale: 発言が繰り返されたことを、簡潔で品位ある標準語として表す。
- source_word: Ἐγὼ ὑπάγω
  choice: わたしは去って行く
  rationale: 明示された主語の対照性を保ちつつ、ヨハネにおけるὑπάγωの離去の含みを訳出する。行き先や神学的意味は本文で限定しない。
- source_word: ζητήσετέ με
  choice: あなたがたはわたしを捜す
  rationale: ζητέωの、人を捜し求める基本義を自然に表し、単なる物理的探索にも霊的な探求にも読める余地を残す。
- source_word: ἐν τῇ ἁμαρτίᾳ ὑμῶν
  choice: あなたがたの罪のうちに
  rationale: 名詞の単数と前置詞ἐνを保ち、個々の行為の列挙ではなく罪の状態を指し得る表現とする。
- source_word: ἀποθανεῖσθε
  choice: 死ぬことになる
  rationale: 未来の確実な帰結を自然な日本語で示す。
- source_word: ὅπου ἐγὼ ὑπάγω
  choice: わたしが行く所
  rationale: 同じ動詞の反復を不自然に重くせず、現在進行中の離去と目的地への言及を保つ。
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: 来ることができない
  rationale: δύνασθεが表す能力・可能性の否定を明示し、「来ない」ではなく「来ることができない」とする。
theological_decisions:
- issue: ἁμαρτίᾳが単数であること
  choice: 「あなたがたの罪のうちに」と単数で訳す
  alternative: 「あなたがたの罪々のために／罪の数々のうちに」
  rationale: 原文の単数を保持し、複数の違反行為よりも、罪の継続的な状態を指し得る神学的緊張を解消しないため。
- issue: ὑπάγωが指すイエスの離去
  choice: 「去って行く」
  alternative: 「父のもとへ帰る」「死ぬ」
  rationale: ヨハネ文書では死、復活、父への帰還を含み得るが、この節自体は行き先を明示しないため、解釈を本文に織り込まない。
- issue: 彼らがイエスを捜すことの意味
  choice: 「捜す」とし、目的や動機を限定しない
  alternative: 「救いを求めて尋ね求める」「捕らえるために捜す」
  rationale: ζητέωは文脈上複数の含みを持ち得るため、霊的探求か物理的探索かを翻訳で決めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言には簡潔で厳粛な調子を保った。「わたし」「あなたがた」により人数の対比を明確にし、原文にない敬称や教派的解釈は加えていない。脚注記号[a]は該当表現の直後に置いた。
