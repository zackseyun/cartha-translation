id: JHN.8.32
reference: John 8:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γνώσεσθε τὴν ἀλήθειαν, καὶ ἡ ἀλήθεια ἐλευθερώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/032.yaml
  text: and you will know the truth[b][a], and the truth will set you free.
translation:
  language: ja
  text: そして、あなたがたは真理を知り[a]、真理はあなたがたを自由にします[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「真理を知るようになり」。
    reason: lexical_alternative
  - marker: b
    text: この節の表現だけでは、何からの自由かは明示されていません。続く文脈では、罪からの自由と結びつけられています。
    reason: cross_reference
lexical_decisions:
- source_word: γνώσεσθε
  choice: 知り
  rationale: γινώσκωの未来形。日本語では後続の「自由にします」と並ぶ文脈の中で「知り」とすることで、将来の帰結を自然に表せる。「知るようになり」も可能だが、到達的なニュアンスをやや強く明示するため脚注に置いた。
- source_word: ἀλήθειαν / ἀλήθεια
  choice: 真理
  rationale: 二度とも定冠詞を伴い、同一の特定された「真理」を指す反復を保つ。日本語では「その真理」より「真理」の反復が自然で格調も保てる。
- source_word: ἐλευθερώσει
  choice: 自由にします
  rationale: ἐλευθερόωの使役的意味を、明瞭で自然な現代日本語で表す。「解放します」は可能だが、政治的・社会的含意を強めるおそれがある。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 二人称複数を明示し、単数の「あなた」と区別する。
- source_word: καὶ ... καὶ
  choice: そして、…、…
  rationale: 冒頭の接続を「そして」で表し、後半は日本語として不自然な接続の重複を避けつつ、二つの帰結が連なる構造を読点で保った。
theological_decisions:
- issue: 「真理はあなたがたを自由にする」における自由の性質
  choice: 本文では自由の対象や領域を限定せず、「自由にします」と訳す。
  alternative: 「罪から解放します」「霊的に自由にします」
  rationale: 直後の文脈は罪からの自由と結びつけるが、この節自体は何からの自由かを明示していない。本文の簡潔さと神学的な広がりを保ち、文脈による説明は脚注に示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「真理」の反復と宣言的な調子を保った。「自由にしてくれます」よりも主体の働きを端的に示す「自由にします」を採用した。
