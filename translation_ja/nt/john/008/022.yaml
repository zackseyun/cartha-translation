id: JHN.8.22
reference: John 8:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι· Μήτι ἀποκτενεῖ ἑαυτὸν ὅτι λέγει· Ὅπου ἐγὼ ὑπάγω ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/022.yaml
  text: So the Jews were saying[a], “Surely he will not kill himself, since he says, ‘Where I am going, you cannot come’?”
translation:
  language: ja
  text: そこで、ユダヤ人たち[a]は言っていた。「『わたしが行く所に、あなたがたは来ることができない』と言っているが、まさか自殺するのだろうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈によっては、「ユダヤ地方の人々」または「ユダヤ人指導者たち」を指す可能性もある。
    reason: 語句 οἱ Ἰουδαῖοι の文脈上の指示対象に幅があるため。
lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了時制が示す継続的・反復的な発言を、自然な日本語で表した。
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの発言を受けた物語上の展開と推論を示す接続語として訳した。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 語の基本的な意味を本文に残した。ヨハネ福音書では文脈によりユダヤ地方の人々やユダヤ人指導者層を指し得るため、その可能性は脚注に示した。
- source_word: Μήτι
  choice: まさか、…のではあるまい
  rationale: 否定の答えを予想する疑問のニュアンスを、疑念を含む自然で品位ある日本語にした。
- source_word: ἀποκτενεῖ ἑαυτόν
  choice: 自殺する
  rationale: 直訳的には「自分自身を殺す」であり、現代日本語で簡潔かつ明確な表現を用いた。未来形の含意は文脈と疑問表現の中で保たれている。
- source_word: ὅτι
  choice: …と言っているのだから
  rationale: 彼らの推測の根拠を導く理由・説明の用法を表した。
- source_word: λέγει
  choice: 言っている
  rationale: ギリシア語の現在時制を保ち、直前の発言を現在のものとして取り上げる語感を示した。
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: わたしが行く所に
  rationale: ὑπάγωの「行く、立ち去る」という意味を過度に限定せず、自然な日本語で表した。
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: あなたがたは来ることができない
  rationale: δύνασθεが表す能力・可能性の否定を明示的に保った。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示対象
  choice: 本文では「ユダヤ人たち」とする
  alternative: 「ユダヤ地方の人々」または「ユダヤ人指導者たち」
  rationale: この語句自体は広く「ユダヤ人たち」を意味するが、ヨハネ福音書では特定のユダヤ地方の人々や宗教的指導者・反対者を指す場合がある。本節だけで指示対象を狭めず、民族全体を意味すると断定することも避けるため、本文は字義を保ち、文脈上の可能性を脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、発言の疑念と皮肉を帯びた調子を「まさか、…のではあるまい」で表した。「自殺する」は直接的だが、原文の意味に即した通常の現代語である。
