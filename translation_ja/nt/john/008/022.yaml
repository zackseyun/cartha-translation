  to: そこで、ユダヤ人たち[a]は言っていた。「『わたしが行く所に、あなたがたは来ることができない』と言っているが、まさか自殺するのだろうか。」
  rationale: 発言を明確な修辞的疑問文に改め、μήτιが示す「まさか…するのだろうか」という否定を予想する響きを保った。引用を先に置き、「…と言っているが」によって、彼らがイエスの言葉を根拠にこの推測をしている関係を自然な日本語で表した。
