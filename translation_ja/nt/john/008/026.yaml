id: JHN.8.26
reference: John 8:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλὰ ἔχω περὶ ὑμῶν λαλεῖν καὶ κρίνειν· ἀλλ’ ὁ πέμψας με ἀληθής ἐστιν, κἀγὼ ἃ ἤκουσα παρ’ αὐτοῦ ταῦτα ⸀λαλῶ εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/026.yaml
  text: I have many things to say and to judge concerning you[a]. But the one who sent me is true, and what I heard from him[b], these things I speak to the world.
translation:
  language: ja
  text: あなたがたについて、わたしには言うべきことも、裁くべきことも多くある。[a] しかし、わたしを遣わした方は真実であり、わたしはその方から聞いたこと、これらのことを世に語っている。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたに関して」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では、直前の「聞いたこと」を指示語「これらのこと」で改めて受け、強調している。
    reason: source_emphasis
lexical_decisions:
- source_word: πολλὰ
  choice: 多くある
  rationale: 中性複数の形容詞が名詞的に用いられている。日本語では「言うべきことも、裁くべきことも多くある」とすることで、複数の内容があることを自然に表した。
- source_word: περὶ ὑμῶν
  choice: あなたがたについて
  rationale: 属格を伴う περί が示す話題・関連の意味を、明瞭で自然な日本語で表した。
- source_word: λαλεῖν
  choice: 言うべきこと
  rationale: πολλὰ ἔχω と結びつく不定詞を、日本語として自然な「言うべきことが多くある」という構文で表した。後半の λαλῶ は文脈に応じて「語っている」とした。
- source_word: κρίνειν
  choice: 裁くべきこと
  rationale: κρίνω の広い意味を保ち、「罪に定める」と狭く限定しなかった。「裁く」は司法的な響きも保持する。
- source_word: ὁ πέμψας με
  choice: わたしを遣わした方
  rationale: 冠詞付き分詞を人格的な名詞句として訳した。文脈上の指示対象を「父」と明示せず、原文の表現を保った。
- source_word: ἀληθής
  choice: 真実であり
  rationale: 「真実である」「偽りがない」「信頼できる」という含みを過度に一つへ限定せず、ヨハネ文書における神学的な響きを保った。
- source_word: ἃ ἤκουσα παρ’ αὐτοῦ
  choice: その方から聞いたこと
  rationale: 話し手が遣わした方から受け取った内容を、自然な日本語で表した。
- source_word: ταῦτα
  choice: それを
  rationale: 先行する関係節の内容を受け直す指示語を明示し、ギリシア語の反復による強調を保持した。
- source_word: λαλῶ
  choice: 語っている
  rationale: 現在形の継続的・現行的な発話を表し、公に告げる文脈に合う語を選んだ。
- source_word: εἰς τὸν κόσμον
  choice: 世に
  rationale: 発話が向けられる範囲・聴衆を示す表現として、簡潔で自然な聖書日本語とした。κόσμος はここでは人間世界を含意するが、訳文では説明を加えず「世」とした。
theological_decisions:
- issue: 「わたしを遣わした方」の指示対象
  choice: 原文どおり「わたしを遣わした方」とし、父を暗示するにとどめた。
  alternative: 「わたしを遣わした父」
  rationale: ヨハネ福音書の文脈では父を指すが、この節のギリシア語本文は「父」という名詞を明示していないため、訳文にも補わなかった。
- issue: κρίνειν の意味の強さ
  choice: 「裁くべきこと」
  alternative: 「罪に定めるべきこと」
  rationale: κρίνω は裁定から断罪まで幅がある。この句だけで狭い断罪の意味に確定せず、原文の意味範囲を保持した。
- issue: ἀληθής の意味
  choice: 「真実であり」
  alternative: 「真実を語る方であり」／「信頼できる方であり」
  rationale: この語が表し得る真実性、誠実さ、信頼性の緊張を保ち、発言の真偽だけに限定しなかった。
translation_notes:
  register: 現代標準日本語による、明瞭で品位のある語り口とした。「わたし」「遣わした方」「世」はヨハネ福音書の文体と語彙の連続性を保つ表現である。原文の語順を日本語として理解可能な範囲で反映し、特に「聞いたこと、それを」という指示語の反復を残した。
