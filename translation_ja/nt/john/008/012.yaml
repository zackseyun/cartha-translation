id: JHN.8.12
reference: John 8:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πάλιν οὖν αὐτοῖς ⸂ἐλάλησεν ὁ Ἰησοῦς⸃ λέγων· Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου· ὁ ἀκολουθῶν ⸀ἐμοὶ οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ, ἀλλ’ ἕξει τὸ φῶς τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/012.yaml
  text: So Jesus spoke to them again[a], saying, “I am the light of the world. The one who follows me will certainly not walk in the darkness[b], but will have the light of life.”
translation:
  language: ja
  text: そこで、イエスは再び彼らに語られた。「わたしは世の光です。わたしに従う者は、決して闇の中を歩むことはなく[a]、かえって、いのちの光を持つでしょう[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「決して……ない」は、ギリシア語の強い否定（οὐ μή）を表している。
    reason: lexical_alternative
  - marker: b
    text: 「いのちの光」は、「いのちを与える光」という意味にも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Πάλιν οὖν
  choice: そこで、再び
  rationale: οὖνを文脈の流れを示す「そこで」、Πάλινを反復を表す「再び」とし、論理的な因果を強めすぎずに接続を保った。
- source_word: ἐλάλησεν ὁ Ἰησοῦς λέγων
  choice: イエスは……語られた
  rationale: λαλέωの発話行為を「語る」で表し、λέγωνは日本語では直接引用によって自然に示されるため重ねて訳さなかった。敬語は現代の日本語聖書としての品位を保つために用いた。
- source_word: Ἐγώ εἰμι τὸ φῶς τοῦ κόσμου
  choice: わたしは世の光です
  rationale: 述語名詞を伴う明瞭な同定表現として訳し、κόσμοςはヨハネ文書で自然な「世」とした。神名への明示的な言及は訳文に付加しない。
- source_word: ὁ ἀκολουθῶν ἐμοὶ
  choice: わたしに従う者
  rationale: 冠詞付き現在分詞の代表的・継続的な意味を、簡潔な単数表現で保持した。
- source_word: οὐ μὴ περιπατήσῃ ἐν τῇ σκοτίᾳ
  choice: 決して闇の中を歩むことがなく
  rationale: οὐ μήの強い否定を「決して……ない」で示し、περιπατέωの歩行の比喩を「歩む」で保った。定冠詞を伴うσκοτίαは領域的な響きのある「闇の中」とした。
- source_word: ἀλλ’ ἕξει
  choice: 持つようになります
  rationale: ἀλλάによる対比を「がなく、……」の構文で自然に示した。ἕξειは未来を表すため、単なる現在の所有ではなく「持つようになります」とした。
- source_word: τὸ φῶς τῆς ζωῆς
  choice: いのちの光
  rationale: 属格関係を解釈で限定せず、「いのちに属する光」「いのちを与える光」などの含意を保持できる定着した表現を採用した。
theological_decisions:
- issue: Ἐγώ εἰμιにおける自己同定の含意
  choice: 述語を伴う「わたしは世の光です」と訳す
  alternative: 神名への響きを強調する訳や注を加える
  rationale: ここではἘγώ εἰμιが述語名詞τὸ φῶς τοῦ κόσμουと文法的に結び付いている。より広いヨハネ的含意を排除はしないが、訳文で明示して読みを固定しない。
- issue: 「いのちの光」の属格の意味
  choice: 「いのちの光」と保持する
  alternative: 「いのちを与える光」「いのちをもたらす光」
  rationale: τῆς ζωῆςは起源・性質・結果など複数の関係を含み得るため、説明的に一つへ限定しない。
- issue: 光と闇の対比
  choice: 「世の光」「闇の中」「いのちの光」という比喩をそのまま保つ
  alternative: 善、真理、救いなどの抽象概念に言い換える
  rationale: ヨハネ福音書の象徴的な緊張を保持し、訳者の神学的解釈によって比喩を平板化しない。
translation_notes:
  register: 明瞭で現代的ながら品位のある標準日本語を用いた。イエスの発話には「です」を用い、地の文では「語られた」とした。「命」ではなく神学的・聖書的用法として読みやすい「いのち」を採用。すべての脚注マーカーを本文中の対応箇所に置いた。
