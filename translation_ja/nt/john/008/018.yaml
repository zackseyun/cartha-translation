  rationale: 本文では μαρτυρέω の二回の使用を「証言する」で一貫して訳し、原文の並列構造を自然な日本語の「…であり、…も」で示した。「父」への解釈的補足は加えていない。脚注は英語監査記録の lexical alternative に対応させ、本文と異なる語彙的選択肢「証しする」を明瞭な現代表記で示す。
