  yaml_path: translation/nt/john/008/018.yaml
  text: I am the one who testifies about myself[a], and the Father who sent me testifies about me.
translation:
  language: ja
  text: わたし自身について証言するのはわたしであり、わたしを遣わした父も、わたしについて証言します。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたし自身について証しするのはわたしであり、わたしを遣わした父も、わたしについて証しします。」
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγώ εἰμι ὁ μαρτυρῶν
  choice: 証言するのは、わたしです
  rationale: 冠詞付き現在分詞の実質的用法と、ἐγώ の強調を自然な現代日本語で表し、法廷的な証言の語感を保つ。
- source_word: περὶ ἐμαυτοῦ
  choice: わたし自身について
  rationale: περί＋属格の「～について」を採り、再帰代名詞の意味を明示する。「自分のために」として弁護の意味を過度に加えない。
- source_word: μαρτυρεῖ
  choice: 証言しています
  rationale: 前半と同じ「証言」を用いて反復を保つ。現在形の継続的・現行的な響きを自然な日本語で示す。
- source_word: περὶ ἐμοῦ
  choice: わたしについて
  rationale: περί＋属格を簡潔かつ自然に訳し、前半との対応を保つ。
- source_word: ὁ πέμψας με πατήρ
  choice: わたしを遣わした父
  rationale: 冠詞付きアオリスト分詞を関係節として訳す。「わたしの父」や「父なる神」は原文に明示されないため補わない。
theological_decisions:
- issue: ヨハネ文書の文脈における「父」の指示対象
  choice: 「父」とのみ訳し、遣わした方との関係を原文どおり示す。
  alternative: 「わたしの父」または「父なる神」
  rationale: 原文は ὁ ... πατήρ であり、所有代名詞や「神」を明示していない。説明的な教理表現を加えず、関係的・神学的主張を保持する。
- issue: 証言語彙の法廷的な力
  choice: μαρτυρέω を一貫して「証言する」と訳す。
  alternative: 「あかしする」
  rationale: 文脈にある証人・法廷の含みを現代日本語で明確に伝え、同一語の反復も保持する。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、反復と証言の法廷的語感を保持した。「わたしです」で主語の強調を示し、「父」には原文にない限定を加えていない。脚注記号は節末に置き、節全体に関わる語彙上の別訳を示した。
