id: JHN.8.54
reference: John 8:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Ἐὰν ἐγὼ ⸀δοξάσω ἐμαυτόν, ἡ δόξα μου οὐδέν ἐστιν· ἔστιν ὁ πατήρ μου ὁ δοξάζων με, ὃν ὑμεῖς λέγετε ὅτι θεὸς ⸀ἡμῶν ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/054.yaml
  text: Jesus answered[a], “If I glorify myself, my glory is nothing. My Father is the one who glorifies me, he whom you say is our God,”
translation:
  language: ja
  text: イエスは答えられた。「もしわたしが自分自身に栄光を与えるなら、わたしの栄光は何の意味もない。わたしに栄光を与えてくださるのは、わたしの父であり、あなたがたが私たちの神[a]だと言っている方である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「私たちの神」の代わりに「あなたがたの神」とする。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えられた
  rationale: 対話を導入する標準的な訳。イエスへの敬意を自然な現代日本語の敬語で表した。
- source_word: δοξάσω / δοξάζων
  choice: 栄光を与える／栄光を与えてくださる
  rationale: ヨハネ福音書における「栄光」の主題を保ち、「尊敬する」よりも原語の神学的な重みを伝える。父を主語とする箇所では自然な敬語を用いた。
- source_word: ἡ δόξα μου οὐδέν ἐστιν
  choice: わたしの栄光は何の意味もない
  rationale: 直訳的な「何ものでもない」より明瞭な現代日本語で、自己による栄光には価値・効力がないという文意を保つ。
- source_word: ὁ πατήρ μου
  choice: わたしの父
  rationale: イエスと父との関係を原文どおり簡潔に示す。日本語では固有の神的称号であることを大文字で示せないため、文脈に委ねた。
- source_word: ὁ δοξάζων με
  choice: わたしに栄光を与えてくださるのは
  rationale: 冠詞付き現在分詞を、継続的・特徴的な働きを自然に示す係り受けで訳した。
- source_word: ὃν ὑμεῖς λέγετε ὅτι θεὸς ἡμῶν ἐστιν
  choice: あなたがたが『私たちの神だ』と言っている方
  rationale: 関係代名詞の指示先を「方」で明示し、ὅτι以下を発言内容として自然に表した。本文のἡμῶνを「私たちの」とした。
- source_word: θεὸς
  choice: 神
  rationale: 文脈上イスラエルの神を指すため、通常の日本語聖書用語「神」を用いた。
- source_word: ἡμῶν
  choice: 私たちの
  rationale: SBLGNT本文の一人称複数を採用した。異読ὑμῶνは脚注に示した。
theological_decisions:
- issue: θεὸς ἡμῶν／ὑμῶν ἐστινの代名詞
  choice: 私たちの神
  alternative: あなたがたの神
  rationale: 底本SBLGNTのἡμῶνに従う。一方、論争の含意に関わるὑμῶνという異読もあるため、本文で解消せず脚注に保存した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。イエスの一人称は「わたし」、相手への複数呼称は「あなたがた」とした。引用内の「私たち」は発言内容として視認しやすい表記にした。
