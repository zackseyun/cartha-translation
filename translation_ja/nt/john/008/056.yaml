  text: Ἀβραὰμ ὁ πατὴρ ὑμῶν ἠγαλλιάσατο ἵνα ἴδῃ τὴν ἡμέραν τὴν ἐμήν, καὶ εἶδεν καὶ ἐχάρη.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/056.yaml
  text: Abraham your father rejoiced to see my day[b][a]; he saw it and was glad.
translation:
  language: ja
  text: あなたがたの父アブラハムは、わたしの日を見ることを願って、歓喜した。[a][b]そしてそれを見て、喜んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしの日を見ることを喜んだ」「わたしの日を見るために歓喜した」。ギリシア語のἵναを用いた節には、目的・期待・内容に近い、互いに関連する複数の訳し方が可能である。
    reason: lexical_alternative
  - marker: b
    text: 「わたしの日」は、イエスのメシアとしての日、またはその成就を広く指す可能性があるが、この節自体は具体的な出来事や時を特定していない。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀβραὰμ ὁ πατὴρ ὑμῶν
  choice: あなたがたの父アブラハム
  rationale: ギリシア語の語順と呼びかけの関係性を保ちつつ、現代日本語として自然にした。
- source_word: ἠγαλλιάσατο
  choice: 歓喜した
  rationale: 強い喜び、歓喜を表す語であり、後半のἐχάρη「喜んだ」との語感の違いも保てる。
- source_word: ἵνα ἴδῃ
  choice: 見ることを思って
  rationale: 目的・期待・内容のいずれにも近接しうるἵνα節を、アブラハムの前向きな期待として自然に表現しつつ、脚注で別訳の余地を示した。
- source_word: τὴν ἡμέραν τὴν ἐμήν
  choice: わたしの日
  rationale: 何を指すかを本文で限定せず、原文の簡潔さと神学的な含みを保持した。
- source_word: καὶ εἶδεν
  choice: そして実際にそれを見て
  rationale: 繰り返されたκαίの強意的な流れを「そして実際に」で表し、「それ」は直前の「わたしの日」を受ける自然な補充である。
- source_word: καὶ ἐχάρη
  choice: 喜んだ
  rationale: 一般的な喜びを表す自然な訳語とし、前半の強い「歓喜した」と区別した。
theological_decisions:
- issue: 「わたしの日」が指す範囲
  choice: 「わたしの日」と直訳的に保持する
  alternative: イエスの到来の日、地上の宣教、十字架と復活、メシアの時代、終末的顕現の日などに特定する
  rationale: この節自体は指示対象となる出来事や時点を限定していないため、本文では解釈を固定しない。
- issue: ἵνα節の機能
  choice: 期待を含む「見ることを思って」
  alternative: 目的として「見るために」、内容として「見ることを」、可能性として「見ることができるように」
  rationale: 目的・内容の近接したニュアンスがありうるため、一つに狭く固定せず、脚注で訳の幅を明示する。
- issue: アブラハムがどのように見たか
  choice: 方法を説明せず「実際にそれを見て」とする
  alternative: 幻、預言的信仰、死後の認識など、特定の仕方を補う
  rationale: 原文は「見た」と述べるだけで、その方法を説明していない。
translation_notes:
  register: 明瞭で格調ある現代標準語。「歓喜した」は強い喜びを示し、「喜んだ」と区別した。脚注記号は、ἵνα節に関する[a]を該当句の直後に、「わたしの日」の解釈に関する[b]を文末に置いた。
