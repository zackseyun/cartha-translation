  yaml_path: translation/nt/john/008/007.yaml
  text: But when[a] they continued questioning him, he straightened up and said to them, "Let the one among you who is without sin be the first to throw a stone at her."
translation:
  language: ja
  text: 彼らがなおも問い続けたので、イエスは身を起こして彼らに言った。「あなたがたの中で罪のない者が、まずこの女に石を投げなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέμενον ἐρωτῶντες
  choice: なおも問い続けた
  rationale: 未完了過去ἐπέμενονと現在分詞ἐρωτῶντεςが表す、執拗に継続して質問する動作を、自然な現代日本語で表した。
- source_word: ἀνακύψας
  choice: 身を起こして
  rationale: 地面にかがんでいた直前の姿勢から上体を起こす身体動作を簡潔に表す。文脈上、完全に立ち上がったとまでは限定しない。
- source_word: ἀναμάρτητος
  choice: 罪のない者
  rationale: この新約聖書中まれな形容詞の、罪がないという道徳的・法的含意を保ちつつ、平明な日本語とした。
- source_word: πρῶτος ἐπ' αὐτὴν τὸν λίθον βαλέτω
  choice: まずこの女に石を投げなさい
  rationale: πρῶτοςの先行性と、三人称命令法の許可・命令的な力を自然に表した。「最初の石」と名詞句化せず、ギリシャ語の『まず投げる』という構造を反映した。
theological_decisions:
- issue: 「罪のない」の範囲
  choice: 限定を加えず「罪のない者」とした
  alternative: 「この罪を犯したことのない者」「この件で罪のない者」
  rationale: 原文ἀναμάρτητοςは罪の種類や当該事件への関与に明示的に限定されていないため、その神学的・法的緊張を保持した。
- issue: 命令の強さ
  choice: 「投げなさい」
  alternative: 「投げてもよい」
  rationale: βαλέτωは三人称アオリスト命令法であり、許可的に理解できる余地はあるが、発言の直接性を保つため命令形で訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼ら」「あなたがた」「この女」により指示対象を明確にし、原文にない解釈的限定は避けた。
