  terminology: 「イエス」「ユダヤ人たち」「言葉」「とどまる」「弟子」は福音書本文として適切である。πιστεύω＋与格について、「イエスを信じた」を本文に置き、「イエスの言うことを信じた」を脚注に示して、信頼・信仰と発言内容への信認のいずれかに固定しない。
