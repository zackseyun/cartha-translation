source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν ὁ Ἰησοῦς πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους· Ἐὰν ὑμεῖς μείνητε ἐν τῷ λόγῳ τῷ ἐμῷ, ἀληθῶς μαθηταί μού ἐστε,
base_translation:
  language: en
  yaml_path: translation/nt/john/008/031.yaml
  text: So Jesus was saying to the Jews who had believed him[a], “If you remain in my word, you are truly my disciples,”
translation:
  language: ja
  text: そこでイエスは、イエスを信じたユダヤ人たちにこう言っておられた。¹「あなたがたがわたしの言葉にとどまるなら、あなたがたは本当にわたしの弟子です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγεν
  choice: 言っておられた
  rationale: 未完了時制の継続的な発話の側面を保ちつつ、イエスへの自然で品位ある敬語表現とした。
- source_word: οὖν
  choice: そこで
  rationale: 文脈の展開と帰結の双方を示しながら、「したがって」ほど論理的な強さを持たせない自然な接続語。
- source_word: πρὸς τοὺς πεπιστευκότας αὐτῷ Ἰουδαίους
  choice: 自分の言うことを信じたユダヤ人たちに
  rationale: πιστεύω＋与格は、ここではその人の言葉を真実として受け入れる意味が自然である。「彼を信じた」では日本語で「彼に信頼した／信仰した」と紛らわしいため、αὐτῷの指す発言者への信認を明確かつ過剰な神学化なしに表した。完了分詞の先行し、なお関連する状態は文脈上伝わる。
- source_word: Ἐὰν
  choice: なら
  rationale: 接続法を伴う条件を、現代日本語で自然かつ明瞭に示す。
- source_word: ὑμεῖς
  choice: あなたがた
  rationale: 明示された複数代名詞を訳出し、呼びかけの焦点を保った。
- source_word: μείνητε
  choice: とどまる
  rationale: ヨハネ文書に特徴的な、継続・残留・関係的持続を含む μένω の幅を保つ。
- source_word: ἐν τῷ λόγῳ τῷ ἐμῷ
  choice: わたしの言葉に
  rationale: λόγος を「教え」に限定せず、ヨハネ福音書の語法と響きを保つ。「にとどまる」は自然な日本語の結び付き。
- source_word: ἀληθῶς
  choice: 本当に
  rationale: 弟子であることの真正さを、明快な現代日本語で表す。
- source_word: μαθηταί μού ἐστε
  choice: あなたがたは本当にわたしの弟子です
  rationale: μαθηταίを福音書の標準的表現「弟子」とし、ἀληθῶςが弟子としての真正性にかかることを自然な語順で示した。
theological_decisions:
- issue: πιστεύω＋与格 αὐτῷ の訳し方
  choice: 自分の言うことを信じた
  alternative: イエスを信じた／イエスを信じるようになった
  rationale: εἰςを伴う「〜を信じる」と同一の神学的意味に自動的に拡張せず、与格構文が表し得る「その人の言うことを信じる」を採用した。これにより、直後の対話が生む信仰の性質をめぐる緊張も保持する。
- issue: 条件文と真の弟子性の関係
  choice: わたしの言葉にとどまるなら、あなたがたは本当にわたしの弟子です
  alternative: わたしの教えを守り続けるなら、真の弟子となります
  rationale: 原文は「なる」ではなく現在形 ἐστε（である）を用いるため、継続を弟子になるための功績として言い換えず、弟子としての真正性を示す条件として表現した。
translation_notes:
  register: 明瞭な現代標準日本語。会話として自然でありながら、聖書本文にふさわしい品位を保った。「言っておられた」以外は過度な敬語化を避けた。
