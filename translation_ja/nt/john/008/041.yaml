source:
  edition: SBLGNT
  text: ὑμεῖς ποιεῖτε τὰ ἔργα τοῦ πατρὸς ὑμῶν. ⸀εἶπαν αὐτῷ· Ἡμεῖς ἐκ πορνείας ⸂οὐ γεγεννήμεθα⸃· ἕνα πατέρα ἔχομεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/041.yaml
  text: You are doing the works of your father.” They said to him[a], “We were not born of sexual immorality; we have one Father—God.”
translation:
  language: ja
  text: 「あなたがたは、自分たちの父の行いをしているのです。」彼らはイエスに言った。「私たちは淫らな行いの結果として生まれたのではない[a]。私たちにはただひとりの父、神がおられる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私たちは非嫡出子ではない」。ギリシア語を直訳すると、「私たちは淫らな行いから生まれたのではない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖτε
  choice: している
  rationale: 現在形の継続的・現行的な響きを自然な日本語で表す。
- source_word: τὰ ἔργα
  choice: 行い
  rationale: 行為・業を意味する一般的な語として、文脈上自然であり、ποιεῖτεとの意味上の結びつきも保つ。
- source_word: τοῦ πατρὸς ὑμῶν
  choice: 自分たちの父の
  rationale: 比喩的な系譜・源を指す緊張を解消せず、「父」をそのまま保つ。再帰的な「自分たちの」により、発話相手との関係を自然に示す。
- source_word: ἐκ πορνείας
  choice: 淫らな関係から
  rationale: πορνείαの性的に不道徳な関係という意味と、ἐκの起源を表す力を保ちながら、出生についての日本語として理解できる形にする。
- source_word: οὐ γεγεννήμεθα
  choice: 生まれたのではない
  rationale: 完了受動形が表す出生の事実を、日本語で自然な過去表現として訳す。
- source_word: ἕνα πατέρα ἔχομεν
  choice: ただひとりの父がおられる
  rationale: ἕναが示す唯一性を「ただひとり」で明示し、神を指すため敬意を伴う存在表現「おられる」を用いる。
- source_word: τὸν θεόν
  choice: 神
  rationale: 「父」を同格的に特定しているため、読点を用いて「ただひとりの父、神」と表す。
theological_decisions:
- issue: ἐκ πορνείας οὐ γεγεννήμεθαを、非嫡出子ではないという主張として明示するか
  choice: 本文では「淫らな関係から生まれたのではない」と原文の出生表現を保つ
  alternative: 私たちは私生児ではない／私たちは婚外関係によって生まれたのではない
  rationale: この句は出生の正統性を主張する慣用的な含みを持ちうるが、原文はπορνείαを起源として生まれたことを否定している。含意を本文で一義的に確定せず、脚注で示す。
- issue: 「あなたがたの父」が誰を指すか
  choice: 「自分たちの父」として指示対象を明示しない
  alternative: 悪魔である父／霊的な父
  rationale: この時点の発言が持つ修辞的・神学的緊張を保ち、後続文脈による特定を先取りしない。
translation_notes:
  register: 明瞭で現代的ながら dignified な会話体。「淫乱」「姦淫」のように意味を狭めたり古風になったりしうる語は避け、「淫らな関係」とした。「業」より一般読者に分かりやすい「行い」を採用した。
