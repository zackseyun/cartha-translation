id: JHN.8.46
reference: John 8:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τίς ἐξ ὑμῶν ἐλέγχει με περὶ ἁμαρτίας; ⸀εἰ ἀλήθειαν λέγω, διὰ τί ὑμεῖς οὐ πιστεύετέ μοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/046.yaml
  text: Which one of you convicts me of sin? If I speak the truth[c][b][a], why do you not believe me?
translation:
  language: ja
  text: あなたがたのうち、だれがわたしに罪があると証明できますか。わたしが真理を語っているのなら、なぜあなたがたはわたしを信じないのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの言うことを信じないのですか」または「わたしを信頼しないのですか」とも訳せる。ギリシア語は、話し手の言葉を信じる意味と、その人を信頼する意味の両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς ἐξ ὑμῶν
  choice: あなたがたのうち、だれが
  rationale: 「あなたがたの中からだれが」という直接的な問いかけを、自然な現代日本語で表した。
- source_word: ἐλέγχει με περὶ ἁμαρτίας
  choice: わたしに罪があると証明できますか
  rationale: ἐλέγχωの「罪責を立証する」という法廷的な響きを保ちつつ、日本語として自然にした。περὶ ἁμαρτίαςを特定の一つの違反に狭めず、「罪がある」とした。
- source_word: εἰ ἀλήθειαν λέγω
  choice: わたしが真理を語っているのなら
  rationale: εἰの条件形を維持し、文脈上の修辞的含意を「真理を語っているのだから」と断定的に言い換えなかった。ἀλήθειαはヨハネ文書における語の重みを考慮して「真理」とした。
- source_word: διὰ τί
  choice: なぜ
  rationale: 理由を問う標準的で自然な訳語。
- source_word: πιστεύετέ μοι
  choice: わたしを信じないのですか
  rationale: 与格を伴うπιστεύωが持つ、話を真実と認める意味と人物を信頼する意味の双方を残せる表現とした。
theological_decisions:
- issue: イエスの無罪性と語る真理についての修辞的主張
  choice: 二つの問いを明示的な補足なしに、その強い問いかけのまま訳す。
  alternative: 「わたしが罪を犯したと証明できる者がいるか」のように、含意を説明的に展開する。
  rationale: 本文は、イエスに罪があることを立証できるかと敵対者に問い、その問いをイエスの語る真理への不信と結び付ける。含意を弱めたり教理的説明を加えたりせず、本文の緊張を保持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。対話場面の直接性を保つため「あなたがた」「わたし」を用い、修辞疑問は丁寧体で自然に整えた。
