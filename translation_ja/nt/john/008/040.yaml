id: JHN.8.40
reference: John 8:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: νῦν δὲ ζητεῖτέ με ἀποκτεῖναι, ἄνθρωπον ὃς τὴν ἀλήθειαν ὑμῖν λελάληκα ἣν ἤκουσα παρὰ τοῦ θεοῦ· τοῦτο Ἀβραὰμ οὐκ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/040.yaml
  text: But now you are seeking to kill me, a man who has told you the truth that I heard from God. Abraham did not do this.
translation:
  language: ja
  text: しかし今、あなたがたは、神から聞いた真理をあなたがたに語った一人の人である私を、殺そうとしています。アブラハムはそのようなことをしませんでした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: しかし今
  rationale: δέの逆接とνῦνの時間的対比を、自然で明瞭な日本語で保つ。
- source_word: ζητεῖτέ με ἀποκτεῖναι
  choice: 私を、殺そうとしています
  rationale: ζητέω＋不定詞が表す継続中の意図・企てを「殺そうとしている」で自然に表し、ἀποκτείνωに「殺人」などの追加的な法的評価を持ち込まない。
- source_word: ἄνθρωπον
  choice: 者である私
  rationale: ここではイエス自身を指す対格同格表現である。「一人の人である私」は日本語として不自然なため、人間としての自己言及を消さずに文脈へ自然に組み込む「者である私」とした。
- source_word: τὴν ἀλήθειαν
  choice: 真理
  rationale: ヨハネ文書で重みを持つ、確かな内容としてのἀλήθειαを「真理」とし、単なる事実の正しさに狭めない。日本語では冠詞を明示しない。
- source_word: ὑμῖν λελάληκα
  choice: あなたがたに語った
  rationale: 完了形の結果的な関連性は文脈に含ませつつ、関係節内で不自然な「語ってきた」を避ける。「語る」はλαλέωを dignified かつ自然に表す。
- source_word: ἣν ἤκουσα παρὰ τοῦ θεοῦ
  choice: 神から聞いた
  rationale: παρά＋属格を情報の源として「神から」と訳し、「父」など本文にない称号へ特定しない。
- source_word: τοῦτο Ἀβραὰμ οὐκ ἐποίησεν
  choice: アブラハムはそのようなことをしませんでした
  rationale: 指示語τοῦτοが直前の殺害の企てを受けることを、日本語で明瞭に表す。「これをしなかった」より自然でありつつ、具体的内容を過度に限定しない。
theological_decisions:
- issue: ἄνθρωπονによるイエスの自己言及
  choice: 者である私
  alternative: 一人の人である私
  rationale: 本文はイエスが自らをἄνθρωποςと呼ぶ形で、その人間性を率直に示す。ただし日本語で「一人の人である私を」は硬く不自然なため、「者である私」によって自己言及の構造を保持した。神性を否定する含意も、本文にない教理的補足も加えない。
- issue: イエスが聞いた言葉の源 παρὰ τοῦ θεοῦ
  choice: 神から
  alternative: 父から
  rationale: 原文はτοῦ θεοῦであり、ヨハネ福音書の広い神学的文脈から「父」を補って本文より具体化しない。
- issue: τοῦτοが指すアブラハムの行為
  choice: そのようなこと
  alternative: これ
  rationale: 直前の「私を殺そうとしている」ことを受けると理解できるが、指示内容を説明的に固定せず、原文の簡潔さと修辞的対比を保つ。
translation_notes:
  register: 現代標準日本語。イエスの厳しい対比を保ちながら、過度に古風な「汝ら」「殺さんとしている」や、口語的すぎる表現は避けた。敬体で本文を統一し、明瞭で格調ある語調とした。
