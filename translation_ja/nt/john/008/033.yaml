id: JHN.8.33
reference: John 8:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν ⸂πρὸς αὐτόν⸃· Σπέρμα Ἀβραάμ ἐσμεν καὶ οὐδενὶ δεδουλεύκαμεν πώποτε· πῶς σὺ λέγεις ὅτι Ἐλεύθεροι γενήσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/033.yaml
  text: They answered him[a], “We are Abraham’s offspring and have never been enslaved to anyone. How can you say[c][b], ‘You will become free’?”
translation:
  language: ja
  text: 彼らはイエスに答えた。「私たちはアブラハムの子孫[a]であり、これまで誰にも奴隷として仕えたことはありません[b]。それなのに、どうしてあなたは『あなたがたは自由になる』[c]と言うのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「アブラハムの種」。ギリシア語では、血統を表す単数形の集合表現が用いられている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「これまで誰にも仕えたことはありません」。ここでは自由との対比から、奴隷として仕える意味が強い。
    reason: lexical_alternative
  - marker: c
    text: 「自由になる」は、現在は自由でない状態から自由な状態へ移ることを表す。別訳「自由の身となる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν πρὸς αὐτόν
  choice: 彼らはイエスに答えた
  rationale: 日本語として自然な応答表現を用いた。αὐτόνは文脈上イエスを指すため、孤立した節でも対象が明瞭になるよう固有名で示した。
- source_word: Σπέρμα Ἀβραάμ
  choice: アブラハムの子孫
  rationale: σπέρμαは単数形の集合表現で血統を指す。「種」という直訳より、現代日本語で自然かつ意味の明瞭な「子孫」を本文に採用した。
- source_word: οὐδενὶ δεδουλεύκαμεν πώποτε
  choice: これまで誰にも奴隷として仕えたことはありません
  rationale: δουλεύωの能動的な「奴隷として仕える」という意味と、完了形およびπώποτεを伴う強い否定を自然な日本語で表した。
- source_word: πῶς σὺ λέγεις
  choice: どうしてあなたは……と言うのですか
  rationale: 話者の驚きと異議を含む問いを表し、明示されたσὺの強調も「あなたは」によって保った。
- source_word: Ἐλεύθεροι γενήσεσθε
  choice: あなたがたは自由になる
  rationale: γίνομαιが示す状態への移行を「なる」で保ち、ἐλεύθεροιを文脈に即して「自由」とした。
theological_decisions:
- issue: 自由との対比におけるδουλεύωの訳
  choice: 奴隷として仕えた
  alternative: 仕えた／奴隷になった
  rationale: 直後の自由と奴隷の議論を踏まえ、単なる奉仕よりも拘束された身分を明示しつつ、能動態の動作性も保った。
- issue: Σπέρμα Ἀβραάμが表す血統
  choice: アブラハムの子孫
  alternative: アブラハムの種
  rationale: ここでは身体的な血統の主張を表す。後代の神学的含意を持ち込まず、集合的な意味を自然な日本語で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、引用部分には簡潔で dignified な会話調を採用した。「奴隷として仕える」により歴史的・比喩的な拘束の強さを保ち、「自由になる」で原文の変化の含意を維持した。
