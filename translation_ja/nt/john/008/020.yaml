  text: ταῦτα τὰ ῥήματα ⸀ἐλάλησεν ἐν τῷ γαζοφυλακίῳ διδάσκων ἐν τῷ ἱερῷ· καὶ οὐδεὶς ἐπίασεν αὐτόν, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/020.yaml
  text: He spoke these words in the treasury while teaching in the temple[a], and no one seized him[b], because his hour had not yet come.
translation:
  language: ja
  text: イエスは、神殿[a]で教えていたとき、献金所でこれらの言葉を語った。だれもイエスを捕らえなかった。まだイエスの時[b]が来ていなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿境内で」とも訳せる。ギリシア語は、聖所の建物だけでなく、神殿の境内全体を指す。
    reason: lexical_alternative
  - marker: b
    text: ヨハネ福音書の「イエスの時」は、イエスの苦難と栄光が頂点に達する、定められた時を指す。「イエスに定められた時」とも訳せる。
    reason: cross_reference
lexical_decisions:
- source_word: ταῦτα τὰ ῥήματα ἐλάλησεν
  choice: これらの言葉を語られた
  rationale: 直前の発言を受ける「これらの言葉」を保ち、λαλέωを自然で品位ある「語る」とした。主語のイエスは文脈から補った。
- source_word: ἐν τῷ γαζοφυλακίῳ
  choice: 献金所で
  rationale: 神殿の献金を扱う場所・区域を指す。単一の箱と限定せず、現代日本語で分かりやすい表現とした。
- source_word: διδάσκων ἐν τῷ ἱερῷ
  choice: 神殿で教えていたとき
  rationale: 現在分詞が主動詞と同時の動作を示すことを自然な時間表現で示した。ἱερόνは内陣だけでなく神殿境内全体を指し得る。
- source_word: οὐδεὶς ἐπίασεν αὐτόν
  choice: だれもイエスを捕らえなかった
  rationale: πιάζωの敵対的に身柄を押さえる意味を「捕らえる」で表し、正式な法的逮捕に意味を狭めなかった。代名詞は日本語で指示を明確にするため「イエス」とした。
- source_word: ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ
  choice: イエスの時がまだ来ていなかったからである
  rationale: 理由を示すὅτιと過去完了の意味を自然に表し、ヨハネ特有の「時」という主題的表現を保持した。
theological_decisions:
- issue: ヨハネ福音書における「イエスの時」
  choice: 「イエスの時」を本文に残す
  alternative: 「イエスに定められた時」または「イエスの時機」
  rationale: 受難と栄光に結び付くヨハネの主題的な緊張を保持し、本文だけで意味を一義的に説明しすぎないため。
translation_notes:
  register: 明瞭な現代標準日本語としつつ、物語文としての品位を保った。「献金所」は場所・区域として理解できる簡潔な訳語を採用し、「時」はヨハネの神学的含意を残した。
