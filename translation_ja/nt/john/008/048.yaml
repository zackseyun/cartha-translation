id: JHN.8.48
reference: John 8:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ἀπεκρίθησαν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Οὐ καλῶς λέγομεν ἡμεῖς ὅτι Σαμαρίτης εἶ σὺ καὶ δαιμόνιον ἔχεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/048.yaml
  text: The Jews answered and said to him[c][b][a], “Are we not right in saying that you are a Samaritan and have a demon?”
translation:
  language: ja
  text: ユダヤ人たちはイエスに答えて言った[a]。「私たちが、あなたはサマリア人で、悪霊に取りつかれている[c]と言うのは、正しいのではないか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人たち」は、文脈によっては「ユダヤの人々」または「ユダヤ人の指導者たち」とも訳し得る。ヨハネ福音書では、しばしばイエスに反対する特定の集団を指し、すべてのユダヤ人を例外なく指すわけではない。
    reason: alternative_reading
  - marker: b
    text: 別訳「私たちは正しく言っているではないか」。
    reason: lexical_alternative
  - marker: c
    text: 直訳「悪霊を持っている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπεκρίθησαν
  choice: 答えて
  rationale: 受動態の形をしたデポーネント動詞で、ここでは「答えた」「返答した」の意。続く εἶπαν と合わせ、原文の叙述上の重なりを自然な日本語で保持した。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 語句自体は単純に「ユダヤ人たち」。文脈上の指示対象を「指導者たち」などに狭めず、原文の表現を本文に残した。
- source_word: εἶπαν αὐτῷ
  choice: イエスに……言った
  rationale: 直訳は「彼に言った」。日本語では指示対象を明確にするため「イエスに」とし、Ἀπεκρίθησαν との両方を訳出した。
- source_word: Οὐ καλῶς λέγομεν ἡμεῖς
  choice: と私たちが言うのは正しいではないか
  rationale: οὐ を用いた修辞疑問が肯定の答えを期待することを示し、καλῶς の「正しく、もっともに」という意味を自然な現代日本語で表した。
- source_word: Σαμαρίτης
  choice: サマリア人
  rationale: 民族的・宗教的呼称をそのまま訳し、この文脈では侮蔑として用いられていることを本文の語調から保った。
- source_word: δαιμόνιον ἔχεις
  choice: 悪霊につかれている
  rationale: 字義的には「悪霊を持っている」だが、日本語では悪霊の支配・憑依を表す定着した自然な表現。字義形は脚注で示した。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示対象
  choice: ユダヤ人たち
  alternative: ユダヤの人々／ユダヤ人の指導者たち
  rationale: 語彙上は対象を指導者に限定していないため、本文では広い表現を保持した。ただし、すべてのユダヤ人を一括して指すとは限らず、この場面でイエスに反対する特定の人々を指すことを脚注で明確にした。
- issue: δαιμόνιον ἔχεις の表現
  choice: 悪霊につかれている
  alternative: 悪霊を持っている
  rationale: 日本語として意味が明瞭な慣用表現を採用しつつ、原文の字義的な言い方を脚注に残して解釈の透明性を確保した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての品位を保った。「答えて言った」は日常語では重複的だが、原文の二つの発話動詞を反映するため残した。脚注記号は該当表現に近接して配置した。
