  to: あなたがたは、父である悪魔に属する者であり、その父が望むことを行おうとしている。悪魔は初めから人殺しであり、真理に立ったことがない。彼のうちに真理がないからである。彼は偽りを語るとき、自分に属するものから語る[a]。彼は偽り者であり、偽りの父だからである[b]。
