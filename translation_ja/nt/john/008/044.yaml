id: JHN.8.44
reference: John 8:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς ἐκ τοῦ πατρὸς τοῦ διαβόλου ἐστὲ καὶ τὰς ἐπιθυμίας τοῦ πατρὸς ὑμῶν θέλετε ποιεῖν. ἐκεῖνος ἀνθρωποκτόνος ἦν ἀπ’ ἀρχῆς, καὶ ἐν τῇ ἀληθείᾳ ⸂οὐκ ἔστηκεν⸃, ὅτι οὐκ ἔστιν ἀλήθεια ἐν αὐτῷ. ὅταν λαλῇ τὸ ψεῦδος, ἐκ τῶν ἰδίων λαλεῖ, ὅτι ψεύστης ἐστὶν καὶ ὁ πατὴρ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/044.yaml
  text: You are from your father[a], the devil, and you want to do your father's desires. He was a murderer from the beginning, and he has not stood in the truth, because there is no truth in him. Whenever he speaks the lie, he speaks from his own nature[c][b], because he is a liar and the father of it.
translation:
  language: ja
  text: あなたがたは、父である悪魔に属する者であり、その父が望むことを行おうとしている。悪魔は初めから人殺しであり、真理に立ったことがない。彼のうちに真理がないからである。彼は偽りを語るとき、自分に属するものから語る[a]。彼は偽り者であり、偽りの父だからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「自分に属するものから語る」。自分の性質や、自分の内にあるものに基づいて語る、という意味に理解できる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「彼は偽り者であり、それの父である」。ここでは「それ」を直前の「偽り」と理解した。「偽りの父」と一般化して理解することもできる。文法上は「彼の父」と読む可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ πατρὸς τοῦ διαβόλου
  choice: あなたがたの父、悪魔から出た者
  rationale: ἐκとεἰμίが表す源・帰属を「から出た者」で示し、τοῦ διαβόλουを同格として自然に読めるようにした。
- source_word: τὰς ἐπιθυμίας
  choice: 欲望
  rationale: 文脈上の悪い願望を示しつつ、現代日本語で性的意味だけに狭めない語を選んだ。
- source_word: θέλετε ποιεῖν
  choice: 行いたいと願っている
  rationale: 行為への意志と志向を明確に表す。
- source_word: ἀνθρωποκτόνος
  choice: 人殺し
  rationale: 人を殺す者という語義を、直接的で一般読者に分かりやすい日本語で表した。
- source_word: ἐν τῇ ἀληθείᾳ οὐκ ἔστηκεν
  choice: 真理のうちに立っていない
  rationale: 「立つ」という原文の比喩を保ち、かつ、以前は真理のうちにいたが後に離れたという解釈を訳文に加えない。
- source_word: ὅταν λαλῇ τὸ ψεῦδος
  choice: 彼が偽りを語るとき
  rationale: 冠詞を伴う単数形の「偽り」を保ちながら、日本語として不自然にならない形にした。
- source_word: ἐκ τῶν ἰδίων λαλεῖ
  choice: 自分自身から語っている
  rationale: 「自分に属するものから」という原文の簡潔で曖昧な表現を過度に「本性」などと限定せずに残した。
- source_word: ψεύστης
  choice: 偽り者
  rationale: 人格的・習慣的に偽る者であることを簡潔に表す。
- source_word: ὁ πατὴρ αὐτοῦ
  choice: 偽りの父
  rationale: 直前のτὸ ψεῦδοςを代名詞の指示対象と理解し、日本語で明瞭にした。単数の「偽り」を維持した。
theological_decisions:
- issue: ὁ πατὴρ αὐτοῦ の指示対象
  choice: 「偽り」を指し、悪魔を「偽りの父」とする
  alternative: 「彼の父」として悪魔の父を指す、または一般化して「すべての偽りの父」とする
  rationale: 最も近く文脈に適合する先行詞はτὸ ψεῦδοςである。ただし、代名詞の形が許す別解の存在は脚注で示した。
- issue: 悪魔が以前は真理のうちに立っていたことを含意するか
  choice: 「真理のうちに立っていない」とし、以前の状態について断定しない
  alternative: 「真理にとどまらなかった」と訳し、以前は真理のうちにいたことを含意する
  rationale: οὐκ ἔστηκενの立つという像を保ち、堕落以前の状態に関する争点を訳文だけで決着させない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヨハネ文書の「真理」「偽り」「父」という反復と、「真理のうちに立つ」という比喩を保持した。語調は厳粛で直接的だが、古語的な文末や過度に教派的な用語は避けた。
