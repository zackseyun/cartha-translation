    rationale: SBLGNTは『どこから来るのか、あるいはどこへ行くのか』というἢを採用します。草案は接続関係を表面化せず、脚注も文末に置かれているため、καίとの異読がどの語に関わるか明確ではありません。ἢに対応する箇所へ脚注を置き、本文・脚注双方で対照を示す必要があります。
  - severity: low
    issue: 後半のἔρχομαιの時制・相の区別
    rationale: 前半はἦλθον（来た）、後半はἔρχομαι（来る）です。日本語では後半を『どこから来るのか』とし、原文の表現上の区別を保つのが安全です。
