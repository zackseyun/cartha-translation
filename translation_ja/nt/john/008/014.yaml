id: JHN.8.14
reference: John 8:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Κἂν ἐγὼ μαρτυρῶ περὶ ἐμαυτοῦ, ἀληθής ἐστιν ἡ μαρτυρία μου, ὅτι οἶδα πόθεν ἦλθον καὶ ποῦ ὑπάγω· ὑμεῖς δὲ οὐκ οἴδατε πόθεν ἔρχομαι ⸀ἢ ποῦ ὑπάγω.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/014.yaml
  text: Jesus answered and said to them[a], “Even if I testify about myself, my testimony is true, because I know where I came from and where I am going[b]; but you do not know where I come from or where I am going.”
translation:
  language: ja
  text: イエスは彼らに答えて言われた。「たとえわたしが自分について証言しても、わたしの証言は真実です。わたしは、どこから来て、どこへ行くのかを知っているからです。しかし、あなたがたは、わたしがどこから来るのか、あるいはどこへ行くのか[a]を知りません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本は「あるいは」を「そして」としています。
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεκρίθη ... καὶ εἶπεν
  choice: 答えて言われた
  rationale: 二つの動詞から成るヨハネ特有の叙述を保ちつつ、現代日本語でも無理なく読める表現とした。
- source_word: Κἂν
  choice: たとえ…ても
  rationale: 相手の前提を仮に認めながら主張する譲歩の力を明確に表す。
- source_word: μαρτυρῶ / μαρτυρία
  choice: 証言する／証言
  rationale: 法廷的な響きを保ちながら、現代日本語で自然かつ明瞭な語を用いた。
- source_word: περὶ ἐμαυτοῦ
  choice: 自分について
  rationale: περί＋属格の基本的な意味を素直に表し、「自分のために」のような含意を加えない。
- source_word: ἀληθής
  choice: 真実です
  rationale: 証言の内容が真であるというヨハネ的な主題を保ち、「有効です」として法的妥当性だけに狭めない。
- source_word: ὅτι
  choice: …からです
  rationale: イエスの証言が真実である理由を示す因果関係を自然な日本語で明示する。
- source_word: πόθεν ἦλθον καὶ ποῦ ὑπάγω
  choice: 自分がどこから来て、どこへ行くのか
  rationale: 起源と行き先の対を自然に表し、本文以上に天的・形而上学的な説明を加えない。
- source_word: ὑμεῖς δὲ οὐκ οἴδατε
  choice: しかし、あなたがたは…知りません
  rationale: 明示された代名詞の対照的な強調と、知識の欠如という動詞本来の意味を保つ。
theological_decisions:
- issue: イエスの自己証言の性質
  choice: その証言は、イエス自身が自らの起源と行き先を知っているため真実である、と訳した。
  alternative: 法的な「有効性」を前面に出す訳、または天的起源を訳文中で明示する訳。
  rationale: 原文は証言の真実性と、その根拠となるイエスの知識を述べる。より広いキリスト論は文脈に委ね、ここへ教理的説明を挿入しない。
- issue: 節末の接続詞の本文異同
  choice: SBLGNT本文の ἢ に従い、起点と行き先を「どこから…どこへ…」と並べた。
  alternative: 一部写本の καί に従い、「どこから来たのか、またどこへ行くのか」と累加的に訳す。
  rationale: 採用本文に従う一方、日本語では疑問内容を対で並べるため「または」を表面化すると不自然になりやすい。異同は脚注で明示する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「証し」よりも法廷的な含意が明確な「証言」を採用した。敬体の直接話法とし、イエスの一人称は「わたし」とした。脚注記号は対応箇所である文末に置いた。
