source:
  edition: SBLGNT
  text: καὶ ἐὰν κρίνω δὲ ἐγώ, ἡ κρίσις ἡ ἐμὴ ⸀ἀληθινή ἐστιν, ὅτι μόνος οὐκ εἰμί, ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/016.yaml
  text: But even if I do judge[a], my judgment is true, because I am not alone, but I and the Father who sent me.
translation:
  language: ja
  text: しかし、たとえわたしが裁くことがあっても[a]、わたしの裁きは真実です。わたしは一人ではなく、わたしと、わたしを遣わした父とが共にいるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「もしわたしが裁くなら」。ギリシア語の条件表現はより形式的にも訳せるが、ここでは「たとえ……ても」という譲歩の意味合いがあると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν κρίνω
  choice: たとえわたしが裁くとしても
  rationale: ἐάνと現在接続法κρίνωは条件的可能性を表すが、文脈では譲歩の意味合いが強い。「たとえ…としても」はその含みを自然な日本語で示す。
- source_word: δὲ
  choice: しかし
  rationale: 前節の発言を受けた対照・展開を明確にする。
- source_word: ἡ κρίσις ἡ ἐμὴ
  choice: わたしの裁き
  rationale: 所有を自然に表しつつ、κρίσιςの法廷的・神学的な響きを保つ。
- source_word: ἀληθινή
  choice: 真実です
  rationale: 「有効」「真正」も可能だが、「真実」はヨハネ文書における真理の響きを保ち、正しさと確かさの両方を含み得る。
- source_word: μόνος οὐκ εἰμί
  choice: わたしは一人ではなく
  rationale: イエスの裁きが単独のものではないという関係的な主張を、明快な現代日本語で表す。
- source_word: ἀλλ’ ἐγὼ καὶ ὁ πέμψας με πατήρ
  choice: わたしと、わたしを遣わした父とがいる
  rationale: 原文の「わたしと父」という並列を保ち、「遣わした」を父を特定する分詞句として訳す。「いる」を補って日本語として文を完結させる。
theological_decisions:
- issue: イエスの裁きと父の関与との関係
  choice: イエスの裁きが真実である根拠を、イエスが単独ではなく、遣わした父とともにいることに置く。
  alternative: 法的な証言者の人数に関する主張だけに限定して読むこともできる。
  rationale: 本文はイエスの非孤立性と父の関与を明示的な根拠としている。後代の教理的定式を付加せず、この関係性をそのまま残す。
translation_notes:
  register: 明快で格調ある現代標準日本語。「裁く」「裁き」を対応させ、原文の反復と法廷的な語感を保持した。神を指す「父」は本文どおり簡潔に表記した。
