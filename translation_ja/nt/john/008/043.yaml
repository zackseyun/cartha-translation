  text: διὰ τί τὴν λαλιὰν τὴν ἐμὴν οὐ γινώσκετε; ὅτι οὐ δύνασθε ἀκούειν τὸν λόγον τὸν ἐμόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/043.yaml
  text: Why do you not understand my way of speaking? Because you are not able to hear my word[a][b].
translation:
  language: ja
  text: なぜあなたがたはわたしの話し方[a]が分からないのですか。それは、わたしのことばを聞くことができない[b]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの話」または「わたしの言葉遣い」とも訳せる。ここで用いられたギリシア語は、話す行為や話しぶりを指しうる語で、後半の「わたしのことば」とは異なる語である。
    reason: lexical_alternative
  - marker: b
    text: 「わたしのことばを聞けない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλιὰν
  choice: 話し方
  rationale: 話す行為や話しぶりを表しうる語であり、後半の λόγος（「ことば」）との語の違いを保つため。
- source_word: γινώσκετε
  choice: 分からない
  rationale: ここでは、単に知っているかではなく、イエスの話を理解できるかが問題となっているため。現代日本語として自然な表現を用いた。
- source_word: ἀκούειν
  choice: 聞く
  rationale: 基本義を保ち、受容や服従という含意を本文で明示しすぎないため。
- source_word: λόγον
  choice: ことば
  rationale: イエスが語る内容やメッセージを指すが、神学的な響きと λαλιὰν との区別を保てる表現であるため。
- source_word: οὐ δύνασθε
  choice: できない
  rationale: 単なる不願ではなく、本文が述べる能力の欠如を率直に表すため。
- source_word: ὅτι
  choice: それは、…からです
  rationale: 前の問いに対する理由を、自然で明瞭な日本語で示すため。
- source_word: τὴν ἐμὴν / τὸν ἐμόν
  choice: わたしの
  rationale: 二つの所有表現の並行関係を、自然な日本語で保つため。
theological_decisions:
- issue: 「わたしのことばを聞くことができない」という不能の性質
  choice: 不能をそのまま述べ、その原因となる神学的な仕組みは特定しない。
  alternative: 道徳的な拒絶、神によるかたくなさ、または霊的無能力と明示的に解釈する。
  rationale: この節は不能を述べるが、それがどのような仕組みによるものかまでは説明していない。本文の緊張を保ち、特定の教理的説明を訳文に持ち込まないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、問いと答えの厳粛な調子を保った。「話し方」と「ことば」を訳し分け、原文の語彙上の対比を示した。
