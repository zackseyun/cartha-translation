  text: Τοῦτο δὲ ἔλεγον πειράζοντες αὐτόν, ἵνα ἔχωσιν κατηγορίαν κατ' αὐτοῦ. Ὁ δὲ Ἰησοῦς κάτω κύψας, τῷ δακτύλῳ ἔγραφεν εἰς τὴν γῆν, μὴ προσποιούμενος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/006.yaml
  text: They[a] were saying this to test him, so that they might have an accusation against him. But Jesus, bending down, wrote on the ground with his finger, paying no attention.
translation:
  language: ja
  text: 彼ら[a]がこのように言っていたのは、イエスを試し、彼を告発する理由を得るためであった。しかし、イエスは身をかがめ、彼らを意に介さず、指で地面に書いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 姦淫の現場で捕らえられた女についての物語（ヨハネ7:53—8:11）の続き。この箇所についてはヨハネ7:53の注を参照。
    reason: textual_critical
lexical_decisions:
- source_word: πειράζοντες
  choice: 試し
  rationale: ここでは、イエスを罪に問う材料を得ようと難問を突きつける行為を指す。「誘惑する」よりも、敵意を帯びた吟味という文脈に合う。
- source_word: κατηγορίαν
  choice: 訴える口実
  rationale: κατηγορίαは告発・訴えを意味する。ἔχωσινとの組み合わせを自然な日本語にし、イエスを告発する根拠を得ようとした意図を表した。
- source_word: κάτω κύψας
  choice: 身をかがめ
  rationale: 下方に身を曲げる動作を、簡潔で自然な現代日本語で表した。
- source_word: ἔγραφεν
  choice: 書いていた
  rationale: 未完了過去形が示す継続中の動作を反映した。何を書いたかは本文が明示しないため補わない。
- source_word: μὴ προσποιούμενος
  choice: 彼らを意に介さず
  rationale: 気づかない、または聞こえないかのように振る舞うことを表す分詞句。対象を文脈から「彼ら」とし、意図的に応じない様子を自然に示した。
theological_decisions:
- issue: イエスが地面に書いた内容
  choice: 内容を特定しない
  alternative: 律法や告発者たちの罪を書いたと補う
  rationale: 原文は書いた内容を明示しておらず、特定の解釈を本文へ持ち込まないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼ら」が直前の律法学者たちとファリサイ派の人々を受けることを示しつつ、原文の目的節と継続的な筆記動作を自然に表現した。
