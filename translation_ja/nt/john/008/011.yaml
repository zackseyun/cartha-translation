  text: She[a] said, "No one, Lord." And Jesus said, "Neither do I condemn you; go, and sin no more."
translation:
  language: ja
  text: 彼女は言った。「だれもいません、主よ。」するとイエスは言われた。「わたしもあなたを罪に定めない。行きなさい。そして、もう罪を犯してはならない。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 姦淫の現場で捕らえられた女の物語（ヨハネ7章53節―8章11節）の最終節。ヨハネ7章53節の注を参照。
    reason: textual_critical
lexical_decisions:
- source_word: κύριε
  choice: 主よ
  rationale: 呼格としてイエスへの敬意と権威の承認を表す。文脈上「先生」も可能だが、伝統的かつ神学的な含みを保つ「主よ」とした。
- source_word: κατακρίνω
  choice: 罪に定める
  rationale: 単なる批判ではなく、有罪判決を下すという司法的意味を明確に表す。
- source_word: μηκέτι ἁμάρτανε
  choice: もう罪を犯してはならない
  rationale: μηκέτιの「今後はもはや～しない」という継続的な禁止と、ἁμαρτάνωの罪という意味を自然な現代日本語で伝える。
- source_word: πορεύου
  choice: 行きなさい
  rationale: 現在中命令形の簡潔な送り出しを、自然で dignified な命令表現として訳す。
theological_decisions:
- issue: κύριε の敬称としての強さ
  choice: 主よ
  alternative: 先生／あなたさま
  rationale: 語そのものは丁重な呼びかけにもなり得るため意味を過度に限定しない必要があるが、ヨハネ福音書の文脈と受容史を踏まえ、イエスの権威を認める表現として「主よ」を採用した。
- issue: イエスの不処罰と罪への命令の緊張
  choice: 「罪に定めない」と「もう罪を犯してはならない」をともに明示
  alternative: 赦しを説明的に補う
  rationale: 原文は「赦す」と明言せず、断罪しない宣言と罪をやめる命令を並置しているため、その神学的緊張を説明で解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、イエスの発言には簡潔で威厳ある調子を保った。「だれも。」は原文の省略文を保持し、直前の問いに対する自然な短答としている。脚注記号は物語全体の本文批評上の注意に対応させ、節末に置いた。
