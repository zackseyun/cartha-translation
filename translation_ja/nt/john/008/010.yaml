  text: Ἀνακύψας δὲ ὁ Ἰησοῦς, καὶ μηδένα θεασάμενος πλὴν τῆς γυναικός, εἶπεν αὐτῇ, Ἡ γυνή, ποῦ εἰσιν ἐκεῖνοι οἱ κατήγοροί σου; Οὐδείς σε κατέκρινεν;
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/010.yaml
  text: Then Jesus[a] straightened up, and seeing no one except the woman, said to her, "Woman, where are those accusers of yours? Has no one condemned you?"
translation:
  language: ja
  text: イエスは身を起こし、女のほかには誰もいないのを見て、彼女に言われた。「女の人、あなたを訴えたあの者たちはどこにいるのですか。誰もあなたに有罪の判決を下さなかったのですか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節は、姦淫の現場で捕らえられた女の物語（ヨハネ7:53–8:11）の一部です。この箇所は最古期のギリシア語写本にはありません。ヨハネ7:53の注を参照してください。
    reason: textual_critical
lexical_decisions:
- source_word: ἀνακύψας
  choice: 身を起こし
  rationale: 直前でかがんで地面に書いていた姿勢から上体を起こしたことを自然に表す。「立ち上がり」では、完全に起立したと本文以上に限定するおそれがある。
- source_word: θεασάμενος
  choice: 見て
  rationale: 周囲を見て、女のほかには誰もいないと認めたという視覚的知覚を簡潔に表す。
- source_word: Ἡ γυνή
  choice: 女の人
  rationale: 呼びかけの γυνή は、この文脈で侮蔑語ではない。「婦人」より現代的であり、「あなた」だけにして呼びかけ自体を省かない。
- source_word: οἱ κατήγοροί σου
  choice: あなたを訴えていた者たち
  rationale: κατήγορος の法的な含みを保ちつつ、現代の一般読者に明瞭な表現とした。指示語 ἐκεῖνοι は、直前までいた者たちを指す日本語の文脈に自然に織り込んだ。
- source_word: κατέκρινεν
  choice: 有罪の判決を下さなかった
  rationale: 単なる批判や一般的な判断ではなく、法的・準法的に罪ありと宣告する意味を明確にする。アオリストは、この場で誰かが実際に判決を下したかを問うものとして表現した。
theological_decisions:
- issue: 本文批評上の位置づけ
  choice: 訳文はビザンツ本文に従って掲載し、本文批評上の問題を脚注で明示する
  alternative: 本文から除外する、または括弧で囲む
  rationale: 指定された原文エディションには本節が含まれるため本文として訳す一方、ヨハネ7:53–8:11が初期のギリシア語写本にないという重要な写本証拠を隠さない。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準語。「言われた」でイエスへの敬意を自然に示しつつ、発言内容は丁寧な問いとして訳した。脚注記号は対象節全体に関わるため節末に置いた。
