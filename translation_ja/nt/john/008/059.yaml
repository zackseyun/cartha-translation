  text: ἦραν οὖν λίθους ἵνα βάλωσιν ἐπ’ αὐτόν· Ἰησοῦς δὲ ἐκρύβη καὶ ἐξῆλθεν ἐκ τοῦ ⸀ἱεροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/059.yaml
  text: So they picked up stones to throw at him[a], but Jesus hid himself and went out of the temple.
translation:
  language: ja
  text: そこで彼らは、イエスに投げつけようと石を拾った。しかしイエスは身を隠し、神殿[a]から出て行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語はヒエロンで、神殿の建物だけでなく、その境内や庭を含む神殿域全体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: 拾った
  rationale: 石を手に取って攻撃しようとする場面を、現代日本語で自然かつ明確に表す。
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの発言を受けた結果・展開を示し、日本語の物語文として自然につなぐ。
- source_word: λίθους
  choice: 石
  rationale: 投石による攻撃を表すこの文脈での標準的な訳語。
- source_word: ἵνα βάλωσιν ἐπ’ αὐτόν
  choice: イエスに投げつけようと
  rationale: ἵνα＋接続法の目的を簡潔に表し、ἐπ’ αὐτόνの敵対的な方向性を「投げつける」で明確にする。
- source_word: ἐκρύβη
  choice: 身を隠し
  rationale: 形態上は受動形だが、文脈では自ら身を隠したという中動的な意味が自然であり、外部の行為者を補わない。
- source_word: ἐξῆλθεν
  choice: 出て行った
  rationale: ἐκ τοῦ ἱεροῦと組み合わせ、場所の外へ移動したことを平明に示す。
- source_word: ἐκ τοῦ ἱεροῦ
  choice: 神殿から
  rationale: 本文では読みやすい慣用的な表現を用い、ἱερόνが内陣ではなく神殿境内全体を指す点は脚注で明示する。
theological_decisions:
- issue: イエスがその場を逃れた仕方
  choice: イエスが身を隠して神殿から出たとのみ訳す
  alternative: 奇跡的に群衆の間を通り抜けた、または見えなくなったと補う
  rationale: SBLGNT本文が述べるのは、イエスが身を隠して神殿から出たことだけである。後代の写本伝承に見られる詳細を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語による簡潔で品位ある叙述。「出て行かれた」のような尊敬表現は、受動・自発との紛れを避け、原文にない敬語的含意を加えないため用いなかった。脚注記号は説明対象である「神殿」の直後に置いた。
