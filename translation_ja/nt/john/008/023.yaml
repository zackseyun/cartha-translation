id: JHN.8.23
reference: John 8:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ⸀ἔλεγεν αὐτοῖς· Ὑμεῖς ἐκ τῶν κάτω ἐστέ, ἐγὼ ἐκ τῶν ἄνω εἰμί· ὑμεῖς ἐκ ⸂τούτου τοῦ κόσμου⸃ ἐστέ, ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/023.yaml
  text: And he was saying to them[a], “You are from below; I am from above. You are from this world[b]; I am not from this world.”
translation:
  language: ja
  text: イエスは彼らに言われた。「あなたがたは下からの者であり[a]、わたしは上からの者である。あなたがたはこの世からの者であり[b]、わたしはこの世からの者ではない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたは下にあるものに由来し、わたしは上にあるものに由来する」。
    reason: lexical_alternative
  - marker: b
    text: ヨハネによる福音書で「世」は、物理的な世界だけでなく、神から離れた人間の秩序を指すことが多い。
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言われた
  rationale: 未完了過去は継続的な発話を示し得るが、この文脈では日本語の「言っておられた」より「言われた」が自然である。継続相を過度に強調せず、談話の進行を明瞭にした。
- source_word: Ὑμεῖς / ἐγὼ
  choice: あなたがた / わたし
  rationale: ギリシア語で明示された代名詞の強調を保ち、聞き手とイエスとの鋭い対照を示した。
- source_word: ἐκ τῶν κάτω / ἐκ τῶν ἄνω
  choice: 下からの者 / 上からの者
  rationale: ἐκが示す起源・由来と上下の対照を、解釈的に「地上」「天」と限定せず、自然な日本語で保った。
- source_word: κόσμος
  choice: 世
  rationale: ヨハネ文書で広い意味を持つκόσμοςに対応する伝統的かつ自然な語であり、物理的な世界だけにも、神に背く人間秩序だけにも狭く限定しない。
- source_word: τούτου τοῦ κόσμου / τοῦ κόσμου τούτου
  choice: この世
  rationale: 二つの語順はいずれも指示詞を伴う同じ表現として自然に訳し、この領域との由来的な関係を保った。
- source_word: οὐκ εἰμὶ ἐκ τοῦ κόσμου τούτου
  choice: わたしはこの世からの者ではない
  rationale: 所属だけを表す「この世に属していない」ではなく、反復されるἐκの起源・由来の含みを維持した。
theological_decisions:
- issue: 「下から／上から」および「この世から」が示す対照
  choice: 起源・由来と領域を示す比喩的表現をそのまま保つ。
  alternative: 「地上に属する者／天から来た者」など、道徳的または天上対地上の意味を明示する。
  rationale: 本文はイエスと聞き手の間にヨハネ的な鋭い対照を置くが、その比喩を本文以上に狭い教理的説明へ置き換えず、キリスト論的な緊張と含意を残すため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの宣言にふさわしい簡潔で荘重な「である」調とした。「下から／上から」「この世から」を反復し、原文の並行構造と対照を可視化した。
