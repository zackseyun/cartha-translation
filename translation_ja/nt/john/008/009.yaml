source:
  edition: robinson-pierpont-2005-byzantine
  text: Οἱ δὲ ἀκούσαντες, καὶ ὑπὸ τῆς συνειδήσεως ἐλεγχόμενοι, ἐξήρχοντο εἷς καθ' εἷς, ἀρξάμενοι ἀπὸ τῶν πρεσβυτέρων ἕως τῶν ἐσχάτων· καὶ κατελείφθη μόνος ὁ Ἰησοῦς, καὶ ἡ γυνὴ ἐν μέσῳ ἑστῶσα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/008/009.yaml
  text: But those[a] who heard it, being convicted by their conscience, went out one by one, beginning with the older ones down to the last. And Jesus was left alone, with the woman standing in the midst.
translation:
  language: ja
  text: しかし、それを聞いた者たちは[a]、良心に責められ、年長者たちから始めて最後の者に至るまで、一人また一人と出て行った。こうして、イエスだけが残され、女はその場の中央に立っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 姦通の場で捕らえられた女についての段落（ヨハネ7:53—8:11）の続き。この段落の本文上の問題については、ヨハネ7:53の注を参照。
    reason: textual_critical
lexical_decisions:
- source_word: συνείδησις
  choice: 良心
  rationale: 善悪を識別して内面から証言する働きを表す、この文脈での標準的かつ自然な訳語。
- source_word: ἐλέγχω
  choice: 責められ
  rationale: 良心によって罪を自覚させられる受動の意味を、自然な日本語で表す。「有罪と認められ」では外的な法的宣告に寄りすぎる。
- source_word: πρεσβύτερος
  choice: 年長者たち
  rationale: ここでは役職としての「長老」よりも、列の中で年齢・序列が上の者を指すとみられるため。
- source_word: εἷς καθ' εἷς
  choice: 一人また一人と
  rationale: 一人ずつ順に立ち去る動きを、明瞭で自然な日本語として表す。
- source_word: ἕως τῶν ἐσχάτων
  choice: 最後の者に至るまで
  rationale: 年長者たちを起点とする人々の順序を示す。ἐσχάτωνを本文にない「若者たち」と限定せず、「最後の者」とした。
- source_word: κατελείφθη μόνος
  choice: イエスだけが残され
  rationale: 受動形とμόνοςの強調を保つ。続く女の存在との表面的な緊張も、説明を加えて解消しない。
- source_word: ἐν μέσῳ ἑστῶσα
  choice: 真ん中に立っていた
  rationale: 女がその場の中央に立ったままであったという状態を、簡潔に再現する。
theological_decisions:
- issue: 姦通の女の段落の本文上の位置と伝承
  choice: 指定されたビザンツ本文を本文として訳し、段落全体に関する本文批評上の問題は脚注で示す
  alternative: 本文から除外する、または括弧に入れる
  rationale: 指定原文を忠実に翻訳しつつ、この段落の写本伝承に重要な問題があることを読者に知らせるため。
- issue: 「イエスだけが残された」と女がいたことの関係
  choice: 原文の表現をそのまま保つ
  alternative: 「訴える者たちのうちでは、イエスだけが残り」などと補足する
  rationale: μόνοςの範囲を訳文で限定せず、原文の簡潔さと解釈上の緊張を保持するため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、叙述の厳粛さを保った。「一人また一人と」で場面の進行を自然に表し、「良心に責められ」で内面的な罪責の自覚を簡潔に示した。
