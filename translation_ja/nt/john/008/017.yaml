id: JHN.8.17
reference: John 8:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐν τῷ νόμῳ δὲ τῷ ὑμετέρῳ γέγραπται ὅτι δύο ἀνθρώπων ἡ μαρτυρία ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/017.yaml
  text: And even in your law it is written that the testimony of two men is true[a].
translation:
  language: ja
  text: あなたがたの律法にも、「二人の人の証言は真実である」と書かれています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμῳ
  choice: 律法
  rationale: ここでは、イエスが相手の認める聖書的・法的権威に訴えている。「律法」は日本語の聖書文脈でその意味を明確に伝える。
- source_word: ὑμετέρῳ
  choice: あなたがたの
  rationale: 二人称複数の所有をそのまま示し、イエスが対話相手に向けて述べる修辞的な距離と緊張を保った。「あなたがた自身の」とまでは強めない。
- source_word: γέγραπται
  choice: 書かれています
  rationale: 聖書引用の定型表現として自然であり、完了形が示す、書かれた内容が今も効力を持つという含みも保てる。
- source_word: δύο ἀνθρώπων
  choice: 二人の人
  rationale: ἄνθρωποςはここで人間の証人を指す。日本語の「人」は性別を不必要に限定せず、原語の一般的な法的用法を自然に表す。
- source_word: μαρτυρία
  choice: 証言
  rationale: 法的文脈に適し、証人が述べる内容を明確に表す。
- source_word: ἀληθής
  choice: 真実である
  rationale: 原語の基本義である「真実な」を保持する。文脈上は法的に有効・確かな証言という含みがあるが、本文ではそれに限定しない。
- source_word: καὶ ... δὲ
  choice: にも
  rationale: 前後とのつながりと、「あなたがたの律法にさえ」という付加的な強調を、簡潔で自然な日本語として表す。
theological_decisions:
- issue: 「あなたがたの律法」の修辞的意味
  choice: 「あなたがたの」を明示する
  alternative: 「律法には」
  rationale: 原文の二人称所有形を保ち、イエスと対話相手との間にある修辞的緊張を弱めない。一方で、イエスが律法そのものを退けているという解釈までは訳文に持ち込まない。
- issue: ἀληθήςの法的含意
  choice: 「真実である」
  alternative: 「有効である」
  rationale: 法的有効性は文脈に含まれるが、原語の意味をそれだけに狭めず、「真実」という語が持つヨハネ福音書内の広がりも保持する。
- issue: δύο ἀνθρώπωνの性別表現
  choice: 「二人の人」
  alternative: 「二人の男」
  rationale: ここでのἄνθρωποςは法的格言の中で人間の証人を一般的に指す。日本語の「人」は原語の指示範囲を自然に保ち、男性だけに限定する不必要な含意を避ける。
translation_notes:
  register: 現代標準日本語による、簡潔で端正な直接話法。「書かれています」により敬体の文脈に合わせ、「二人の人」は法的な格言であることが分かる明瞭な表現とした。
