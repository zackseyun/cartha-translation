  text: εἶπεν ⸀αὐτοῖς Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, πρὶν Ἀβραὰμ γενέσθαι ἐγὼ εἰμί.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/058.yaml
  text: Jesus said to them[a], “Truly, truly, I say to you, before Abraham came to be[b], I am.”
translation:
  language: ja
  text: イエスは彼らに言われた。「まことに、まことに、あなたがたに言います。アブラハムが存在する以前から、わたしはいる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしはずっといる」とも訳せる。しかし、ギリシア語は直訳すると「わたしはいる」であり、現在形による際立った表現と、そこに含まれ得る神学的な響きを保っている。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν αὐτοῖς Ἰησοῦς
  choice: イエスは彼らに言われた
  rationale: 語順は自然な日本語に整えつつ、物語の導入を直接的に訳した。イエスの発言には、現代標準語として自然で品位のある敬語を用いた。
- source_word: Ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: 二重の厳粛な強調を保持する。「アーメン、アーメン」より一般読者に意味が明瞭で、ヨハネ福音書の定型句も保てる。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 厳粛な直接呼びかけを保ちながら、自然な現代日本語とした。
- source_word: πρὶν
  choice: 前から
  rationale: 基準となる出来事より以前であることを示す。後続する「わたしはいる」と自然につながるよう「前から」とした。
- source_word: Ἀβραὰμ
  choice: アブラハム
  rationale: 日本語聖書で定着した人名表記。
- source_word: γενέσθαι
  choice: 存在するようになる
  rationale: γίνομαι の広い意味を保ち、単に「生まれる」と狭めない。また、成立・存在開始と、後続する現在形「わたしはいる」との対照を示す。
- source_word: ἐγὼ εἰμί
  choice: わたしはいる
  rationale: ギリシア語の現在形と際立った絶対的表現を保持する。「わたしは存在していた」のように過去の先在だけへ意味を限定せず、神学的な響きと緊張を残す。
theological_decisions:
- issue: キリスト論的含意を持つ ἐγὼ εἰμί の訳し方
  choice: わたしはいる
  alternative: わたしは存在していた／わたしはずっといた
  rationale: 原文は現在形であり、文脈上きわめて際立つ表現である。日本語として通常なら時制を整えたくなる箇所だが、そうすると先在の主張だけに平滑化され、神的自己提示との可能な響きが弱まるため、現在形の異様さを意図的に保持した。
- issue: γενέσθαι の意味範囲
  choice: 存在するようになる
  alternative: 生まれる
  rationale: アブラハムの誕生を指すと理解できるが、動詞自体はより広く「生じる、存在するようになる」を表す。本文ではその広さと ἐγὼ εἰμί との対照を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、イエスの厳粛な宣言にふさわしい品位を保った。「存在するようになる」は日常語よりやや硬いが、γενέσθαι の意味の広さと後半との対照を保持するため採用した。脚注記号 [a] は該当表現の直後に置いた。
