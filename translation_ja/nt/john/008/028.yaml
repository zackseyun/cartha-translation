source:
  edition: SBLGNT
  text: εἶπεν ⸀οὖν ὁ Ἰησοῦς· Ὅταν ὑψώσητε τὸν υἱὸν τοῦ ἀνθρώπου, τότε γνώσεσθε ὅτι ἐγώ εἰμι, καὶ ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν, ἀλλὰ καθὼς ἐδίδαξέν με ὁ ⸀πατὴρ ταῦτα λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/028.yaml
  text: So Jesus said[a], “When you lift up the Son of Man, then you will know that I am he, and that I do nothing from myself, but just as the Father taught me[b], I speak these things.”
translation:
  language: ja
  text: そこで、イエスは言われた。「あなたがたが人の子を上げる[a]とき、そのとき、あなたがたは、わたしであること[b]、また、わたしは自分からは何もせず、父がわたしに教えたとおりに、これらのことを語ることを知るようになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上げる」は、物理的に上へ上げることを指すと同時に、ヨハネ福音書では高められることも響かせています。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語はἐγώ εἰμι（直訳「わたしはある／わたしである」）だけで、補語は明示されていません。別訳「わたしがその者である」。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた展開・帰結を、現代日本語で自然に示す。
- source_word: Ὅταν
  choice: 〜とき
  rationale: 接続法を伴い、ここでは反復ではなく特定の将来の出来事を指す。
- source_word: ὑψώσητε
  choice: 上げる
  rationale: 物理的に上げることと高く上げることの両義を保ち、「十字架につける」または「高く上げる」の一方だけに限定しない。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書における自己呼称とその聖書間の響きを保つ定着した訳語。
- source_word: γνώσεσθε
  choice: 知るようになる
  rationale: 将来の認識・悟りに至る含みを、日本語で明確に表す。
- source_word: ἐγώ εἰμι
  choice: わたしがある
  rationale: 原文に補語がないことを保ち、通常の「わたしである」よりも絶対的・存在的にも読める表現を採った。日本語としての異例さは、原文の厳粛で解釈の開かれた言い方に対応する。
- source_word: ἀπ’ ἐμαυτοῦ ποιῶ οὐδέν
  choice: わたしは自分からは何もせず
  rationale: 行為の源または独自の主導を否定する表現を、原文に近く自然な日本語で示す。
- source_word: καθὼς ἐδίδαξέν με ὁ πατὴρ
  choice: 父がわたしに教えたとおりに
  rationale: καθώςの一致・対応の意味と、過去形の教示を保つ。
- source_word: ταῦτα λαλῶ
  choice: これらのことを語っている
  rationale: 指示語ταῦταを明示し、λαλέωの発話の含みを「語る」で表す。現在形は文脈に即して継続的な発話として訳す。
theological_decisions:
- issue: 補語のないἐγώ εἰμιの訳し方
  choice: わたしがある
  alternative: わたしがその者である／わたしである
  rationale: 原文は「わたしは〜である」の補語を明示せず、ヨハネ福音書において厳粛かつ神学的な響きを持ち得る。特定の同定表現や神名への直接的主張のどちらかに決めず、緊張を残した。
- issue: ヨハネ文書におけるὑψώσητεの意味
  choice: 上げる
  alternative: 十字架につける／高く上げる
  rationale: 十字架上で物理的に上げられることと、栄誉ある高揚の双方を響かせ得るため、一方だけに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの発言にふさわしい簡潔で厳粛な調子を保った。「わたしがある」は日常語として異例だが、補語を欠く原文の曖昧さと神学的緊張を意図的に保持するための選択。
