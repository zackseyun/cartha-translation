lexical_decisions:
- source_word: λέγουσιν
  choice: 言った
  rationale: 物語を生き生きと描く歴史的現在だが、現代日本語の自然な叙述に合わせて過去形とした。
- source_word: Διδάσκαλε
  choice: 先生
  rationale: 呼びかけとして自然であり、教える者への敬称という語義を明確に伝える。
- source_word: κατείληπται
  choice: 捕らえられました
  rationale: 完了受動形が示す、捕らえられた出来事とその結果が現在も問題となっていることを、文脈上自然な受動表現で示した。
- source_word: ἐπαυτοφώρῳ
  choice: 現場で
  rationale: 犯罪行為の最中に発見されたことを表す慣用句。後続の現在分詞と合わせ、「姦淫の現場で」と簡潔かつ自然に表現した。
- source_word: μοιχευομένη
  choice: 姦淫の
  rationale: 女性が姦淫している最中に捕らえられたことを示す現在分詞。「現場で」と組み合わせて行為の最中だった意味を保持した。
