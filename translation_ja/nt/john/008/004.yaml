  source_fidelity: ギリシア語の歴史的現在λέγουσινを日本語の物語叙述として「言った」とするのは適切です。「この女」はαὕτη ἡ γυνήを保ち、「姦淫の現場で捕らえられました」はἐπαυτοφώρῳ μοιχευομένη（姦淫を行っているまさにその時・場で捕らえられた）の意味を自然に伝えています。完了受動形κατείληπταιも、捕縛された状態が現在の訴えの前提となっている文脈で十分に反映されています。
  naturalness: 明瞭で自然な現代標準日本語です。「先生」という呼びかけ、発話の丁寧体、地の文の常体の組合せも、引用発話として違和感がありません。「姦淫の現場」はやや法的・報道的な響きがありますが、この場面と品位ある聖書本文の文体に適しています。
  terminology: 「イエス」「先生」「姦淫」は一貫しており、Διδάσκαλεおよびμοιχεύω語群の意味を過度に解釈せずに表しています。「姦淫」は婚姻関係に関わる原語の語義を保持する適切な用語です。脚注は当該段落（ヨハネ7:53—8:11）の本文批評上の事情を簡潔かつ中立的に示しています。
