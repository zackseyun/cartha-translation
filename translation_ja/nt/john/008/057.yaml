  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς αὐτόν· Πεντήκοντα ἔτη οὔπω ἔχεις καὶ Ἀβραὰμ ἑώρακας;
base_translation:
  language: en
  yaml_path: translation/nt/john/008/057.yaml
  text: So the Jews said to him, “You are not yet fifty years old, and you have seen Abraham?”
translation:
  language: ja
  text: そこで、ユダヤ人たち[a]はイエスに言った。「あなたはまだ五十歳にもなっていないのに、アブラハムを見たことがあるのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人たち」は、文脈によっては「ユダヤ地方の人々」または「ユダヤ人の指導者たち」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: ギリシア語の広い呼称をそのまま保つ自然な訳。文脈上「ユダヤ地方の人々」や「ユダヤ人の指導者たち」と取る余地はあるが、本文自体は指導者だけに限定していない。
- source_word: οὖν
  choice: そこで
  rationale: 直前の発言を受けた応答・展開を示す接続語として、自然な現代日本語にした。
- source_word: Πεντήκοντα ἔτη οὔπω ἔχεις
  choice: あなたはまだ五十歳にもなっていない
  rationale: 年齢を「持つ」と表すギリシア語の慣用句を、日本語の自然な年齢表現で訳した。「にも」により驚きと反論の調子を伝える。
- source_word: ἑώρακας
  choice: 見たことがある
  rationale: ὁράωの完了形が表す過去の経験と現在に関わる含意を、日本語の経験表現で自然に示した。
- source_word: καὶ
  choice: のに
  rationale: 形式上は接続詞「そして」だが、ここでは年齢と主張の食い違いを突く反語的な問いであるため、日本語では逆接の「のに」がその関係を自然に伝える。
- source_word: Ἀβραὰμ
  choice: アブラハム
  rationale: 日本語聖書で定着している固有名の表記を用いた。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示範囲
  choice: ユダヤ人たち
  alternative: ユダヤ地方の人々／ユダヤ人の指導者たち
  rationale: 原文はこの箇所で指導者に限定していないため、本文では包括的な呼称を保持する。一方、この語が文脈により地理的または指導層を指し得る曖昧さは脚注に残した。
- issue: ἑώρακας の完了形
  choice: 見たことがある
  alternative: 見たのか
  rationale: 経験を問う日本語表現により、ギリシア語完了形の含意を保った。イエスとアブラハムの関係について、この節の話者が示す不信と驚きを越えて解釈を加えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある会話文。「五十歳にもなっていないのに」で話者の驚きと反論を自然に表し、末尾の疑問形で原文の問いを保持した。脚注記号[a]は本文中に明示した。
