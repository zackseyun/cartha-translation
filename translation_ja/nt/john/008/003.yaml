lexical_decisions:
- source_word: Ἄγουσιν
  choice: 連れて来て
  rationale: 歴史的現在形だが、日本語の物語として自然に流れるよう、後続する動作につながる連用表現とした。人を導いて来るという語義も保っている。
- source_word: οἱ γραμματεῖς
  choice: 律法学者たち
  rationale: ユダヤ教の聖書および律法の専門家を指す文脈上の意味を、現代日本語で明確に伝える定着した訳語。
- source_word: ἐν μοιχείᾳ κατειλημμένην
  choice: 姦淫の現場で捕らえられた
  rationale: 完了受動分詞が示す、姦淫をしているところを発見され捕らえられた状態を明示する。「姦淫」は本文の法的・倫理的文脈にふさわしい。
- source_word: στήσαντες αὐτὴν ἐν μέσῳ
  choice: 人々の真ん中に立たせ
  rationale: 意図的に女を中央に立たせた動作を自然な日本語で表した。「人々」はギリシア語に明記されないが、ἐν μέσῳが指す集団の中を日本語で分かりやすく補った。
