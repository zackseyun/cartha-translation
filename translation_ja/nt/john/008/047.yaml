id: JHN.8.47
reference: John 8:47
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ὢν ἐκ τοῦ θεοῦ τὰ ῥήματα τοῦ θεοῦ ἀκούει· διὰ τοῦτο ὑμεῖς οὐκ ἀκούετε ὅτι ἐκ τοῦ θεοῦ οὐκ ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/047.yaml
  text: The one who is from God hears the words of God[a]. For this reason you do not hear[b], because you are not from God.
translation:
  language: ja
  text: 神に由来する者[a]は、神の言葉を聞く。あなたがたが聞かないのは、あなたがたが神に由来するのではないからである。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神に由来する」は「神に属する」とも訳せる。ギリシア語の表現は、神を源・起源とすることを強調している。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたは、自分たちが神に由来するのではないということを聞かない」と読むことも文法上は可能である。ギリシア語の接続詞ὅτιには「ということ」の意味もあるが、ここでは理由を示す「…から」の意味が文脈によく合う。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ὢν
  choice: 者
  rationale: 冠詞を伴う現在分詞を実体的に捉え、ある性質を持つ人を代表する単数として簡潔に表した。
- source_word: ἐκ τοῦ θεοῦ
  choice: 神から出た
  rationale: ἐκが示す源・起源の意味を保った。「神に属する」より原文の比喩を残し、「神から来た」より派遣の意味に限定されにくい。
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: 神の言葉
  rationale: ῥήματαの複数性は日本語では集合的な「言葉」で自然に表せる。発言・語られた言葉という具体性を保った。
- source_word: ἀκούει / ἀκούετε
  choice: 聞く／聞かない
  rationale: 同じ動詞の反復を保ち、受け入れる・従うという文脈上の含みを主文で明示しすぎないようにした。
- source_word: διὰ τοῦτο
  choice: …のは
  rationale: 後続する理由節と合わせて「…のは、…からである」という自然な日本語の理由構文にし、原文の論理関係を明確にした。
- source_word: ὅτι
  choice: …からである
  rationale: ここでは因果を示す接続詞と解し、聞かない理由を述べる構文とした。
- source_word: ὑμεῖς
  choice: あなたがた
  rationale: 二人称複数を明示した。原文では代名詞が明示されて強調を帯びるが、日本語で「あなたがたこそ」などを加えるほどには強めなかった。
theological_decisions:
- issue: 「神から出た」の意味
  choice: 源・起源を示す表現をそのまま保つ
  alternative: 「神に属する」「神によって生まれた」
  rationale: 所属、再生、選びなど特定の体系的教理に限定せず、ヨハネ文書に特徴的なἐκ τοῦ θεοῦの表現とその神学的緊張を残した。
- issue: ἀκούωの意味の広がり
  choice: 「聞く」と訳す
  alternative: 「聞き従う」「受け入れる」
  rationale: 文脈上は受容や応答を含みうるが、主文では基本義と反復を保ち、含意を訳語だけで確定しない。
- issue: ὅτιの統語的解釈
  choice: 理由を示す「…から」
  alternative: 内容を示す「…ということを」
  rationale: 「神から出た者ではないため聞かない」という因果関係が文脈に最もよく合うが、文法上可能な別解は脚注に示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、断定の重みを保つため文末を「からである」とした。「神から出た」は日常語としてやや特異だが、原文の源・起源の比喩を保つため採用し、脚注で自然な別訳を示した。
