  text: '[A] in our law, Moses commanded that such women be stoned. So what do you say?'
translation:
  language: ja
  text: '[a]私たちの律法では、モーセはこのような女たちを石打ちにするよう命じました。それでは、あなたは何と言われますか。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 姦淫の現場で捕らえられた女の物語（ヨハネ7:53―8:11）の続き。この箇所についてはヨハネ7:53の注を参照。
    reason: textual_critical
lexical_decisions:
- source_word: ἐν τῷ νόμῳ ἡμῶν
  choice: 私たちの律法では
  rationale: 前置詞句を、この律法規定を話題として提示する自然な日本語にした。「私たちの」によりἡμῶνを明示した。
- source_word: ἐνετείλατο
  choice: 命じました
  rationale: モーセが権威ある命令を与えたことを表すアオリスト中動態に対応する、明確で標準的な表現。
- source_word: τὰς τοιαύτας
  choice: このような女たち
  rationale: 女性複数対格を反映し、文脈上、この女と同様の行為をした女性たちを指す。単数の「この女」として範囲を狭めない。
- source_word: λιθοβολεῖσθαι
  choice: 石打ちにするよう
  rationale: 受動不定詞が示す石打ち刑を、日本語の「命じる」と自然につながる形で表した。死刑であることは語に含意されるが、原文にない「殺す」を補わなかった。
- source_word: σὺ οὖν τί λέγεις
  choice: それでは、あなたは何と言われますか
  rationale: οὖνの推論的なつながりを「それでは」で示し、明示されたσὺの対照的な焦点を「あなたは」で保持した。イエスへの直接の問いとして自然な敬語を用いた。
theological_decisions:
- issue: モーセ律法の規定と、話し手によるその要約との関係
  choice: 「モーセは、このような女たちを石打ちにするよう命じました」と、発言内容を原文どおり伝える
  alternative: 旧約の関連規定を踏まえて対象者や処刑方法を本文中で補足・修正する
  rationale: この節は登場人物の主張を記録している。申命記などとの法的整合性を訳文で解決せず、物語にある緊張を保持した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、法的・公的な場面にふさわしい品位を保った。「何と言われますか」は相手への敬意を示す自然な問いであり、内容を過度に改まった文語にはしていない。
