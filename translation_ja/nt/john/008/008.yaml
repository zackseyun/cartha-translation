lexical_decisions:
- source_word: πάλιν
  choice: もう一度
  rationale: 直前の同じ動作の反復を自然な現代日本語で示す。
- source_word: κάτω κύψας
  choice: 身をかがめて
  rationale: κάτω と κύψας が表す、体を前方・下方へ曲げる動作を簡潔かつ自然に表現する。
- source_word: ἔγραφεν
  choice: 書いていた
  rationale: 未完了過去形が示す継続中の動作を保ち、この場面の描写として自然な日本語にする。何を書いたかは原文が明示しないため補わない。
- source_word: εἰς τὴν γῆν
  choice: 地面に
  rationale: ここでの γῆ は目の前の地表を指す。εἰς は書く動作の向かう面を示すため、日本語では自然に「地面に」とする。
