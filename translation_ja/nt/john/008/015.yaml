  text: ὑμεῖς κατὰ τὴν σάρκα κρίνετε, ἐγὼ οὐ κρίνω οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/015.yaml
  text: You judge according to the flesh[a]; I judge no one.
translation:
  language: ja
  text: あなたがたは肉に従って[a]裁くが、わたしは誰も裁かない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人間的な基準で」または「うわべによって」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 明示された二人称複数代名詞を訳出し、後半の「わたしは」との対照を保った。
- source_word: κατὰ τὴν σάρκα
  choice: 肉に従って
  rationale: ヨハネ文書における「肉」という語の響きと、この句が持つ人間的・外面的な基準という含意を、どれか一つに限定せずに保持した。自然な意味の候補は脚注に示した。
- source_word: κρίνετε
  choice: 裁く
  rationale: 現在能動直説法二人称複数を、簡潔で文脈に適した現代日本語にした。
- source_word: ἐγὼ
  choice: わたしは
  rationale: 明示された一人称代名詞を訳し、「あなたがたは」との対照を表した。
- source_word: οὐ κρίνω οὐδένα
  choice: わたしは誰も裁かない
  rationale: οὐδένα の全面的な否定を「誰も……ない」で自然かつ端的に表した。
theological_decisions:
- issue: κατὰ τὴν σάρκα における σάρξ の意味
  choice: 本文では「肉に従って」とし、語義上の緊張を保持する。
  alternative: 「人間的な基準で」「うわべによって」
  rationale: この句は、人間的・世俗的または外面的な基準による判断を指し得るが、一つの解釈に限定すると原文の含みが失われる。「罪深い性質」とはせず、解釈的な候補を脚注に置いた。
translation_notes:
  register: 明快な現代標準語を用いながら、対照的で簡潔な原文の構造を保った。「裁く」は法的判断に限らず、人を評価・断定する意味も含み得る。
