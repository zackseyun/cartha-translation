id: JHN.8.55
reference: John 8:55
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οὐκ ἐγνώκατε αὐτόν, ἐγὼ δὲ οἶδα αὐτόν· κἂν εἴπω ὅτι οὐκ οἶδα αὐτόν, ἔσομαι ὅμοιος ⸀ὑμῖν ψεύστης· ἀλλὰ οἶδα αὐτὸν καὶ τὸν λόγον αὐτοῦ τηρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/055.yaml
  text: Yet you have not known him[a], but I know him. If I were to say that I do not know him, I would be a liar like you. But I do know him[c][b], and I keep his word.
translation:
  language: ja
  text: あなたがたは神を知りません。しかし、わたしは神を知っています。もし、わたしが神を知らないと言うなら、わたしはあなたがたと同じようなうそつきになります。しかし、わたしは神を知っており、そのことばを守っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「守る」は、「従う」「守り行う」とも訳せる。この語には、ことばを大切に保ち、忠実に従うという意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώκατε
  choice: 知りません
  rationale: 完了形は、これまで知るに至らず、今も知らない状態を表す。現代日本語では「知りません」がその継続的な状態を自然に伝える。
- source_word: οἶδα
  choice: 知っています
  rationale: 形は完了形だが、現在の状態を表す動詞として「知っている」の意味で用いられている。
- source_word: κἂν εἴπω
  choice: もし、わたしが…と言うなら
  rationale: 仮定的な発言を導く構文。反実仮想と断定しすぎず、日本語として自然な条件表現にした。
- source_word: ἔσομαι
  choice: …になります
  rationale: 未来形の結果節を、条件文に対応する自然な日本語で表した。
- source_word: ὅμοιος ὑμῖν ψεύστης
  choice: あなたがたと同じように、うそつき
  rationale: 相手への直接的で鋭い比較を保ち、ψεύστηςを単なる誤認ではなく「うそつき」と訳した。
- source_word: τὸν λόγον αὐτοῦ
  choice: その方のことば
  rationale: λόγοςが持つ発言と啓示されたメッセージの幅を残しつつ、ヨハネ文書の語法を保つ。
- source_word: τηρῶ
  choice: 守っています
  rationale: 従う、保つ、守り行うという意味の広がりを持つ語であり、「守る」がその関係的・継続的な含みをよく保つ。
theological_decisions:
- issue: イエスが神を知ることと、対立者たちが神を知らないこととの対照
  choice: 真に神を知り、そのことばを守っているという主張を、本文どおり直接的に訳す。
  alternative: 独自の神的子性を説明する語を補う、または「知る」を単なる面識へ弱める。
  rationale: 本文自体が知識と忠実さについて鋭い対照を示しているため、その緊張を保ち、本文を超えた教理的説明は加えない。
- issue: κἂν εἴπω の仮定の強さ
  choice: 「もし…と言うなら」
  alternative: 「たとえ…と言っても」または「もし…と言ったとすれば」
  rationale: ギリシア語は仮定を示すが、日本語訳で反実仮想を必要以上に確定せず、発言した場合の帰結を明確にした。
translation_notes:
  register: 明瞭な現代標準語を用いた。「彼」ではなく「この方／その方」として、直前から続く神への指示を自然かつ尊敬を失わずに表現した。「うそつき」は原文の直接的な強さを保つ。
