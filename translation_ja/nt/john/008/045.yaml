  text: ἐγὼ δὲ ὅτι τὴν ἀλήθειαν λέγω, οὐ πιστεύετέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/045.yaml
  text: But because I tell the truth[a], you do not believe me.
translation:
  language: ja
  text: しかし、わたしが真理を語るから、あなたがたはわたしを信じません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、わたしが真理を語るということを、あなたがたは信じません」。ギリシア語の接続詞は、「から」「ので」と理由を示すとも、「ということ」と発言内容を導くとも取れる。
    reason: ὅτιの因果用法と内容節用法の間にある統語上の可能性を示すため。
lexical_decisions:
- source_word: ἐγὼ
  choice: わたしが
  rationale: 明示された一人称代名詞を残し、前後の文脈にあるイエスと聞き手との対照を示した。
- source_word: δὲ
  choice: しかし
  rationale: 前の発言との対照を、現代日本語で自然かつ明確に表す。
- source_word: ὅτι
  choice: からこそ
  rationale: ここでは理由を示す接続詞と理解した。「こそ」を添えることで、真理を語ることが不信の理由になるという文脈上の鋭い逆説を自然に表した。
- source_word: τὴν ἀλήθειαν
  choice: 真理を
  rationale: ἀλήθειαの標準的な訳語であり、この箇所の真偽をめぐる文脈にも適する。ギリシア語の冠詞は日本語では明示しないのが自然である。
- source_word: λέγω
  choice: 語る
  rationale: 現在形を保ちつつ、目的語「真理」と自然に結び付く、品位ある現代日本語とした。
- source_word: οὐ πιστεύετέ μοι
  choice: あなたがたはわたしを信じません
  rationale: πιστεύωと与格の組み合わせを、人を信じるという直接的な意味で訳した。二人称複数も「あなたがた」で明示した。
theological_decisions:
- issue: ὅτιが、イエスが真理を語ることと聞き手の不信との間に示す関係
  choice: 理由を示す用法：「真理を語るからこそ」
  alternative: 内容を示す用法：「わたしが真理を語るということを、あなたがたは信じない」
  rationale: 直前の、悪魔が真理に立たず偽りを語るという対照を受けると、イエスが真理を語るまさにそのために聞き手が信じない、という因果的な読みが談話の流れと逆説をよく保つ。ただし、ὅτιには内容を導く読みの可能性もあるため、脚注に残した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「わたし」「あなたがた」を用いて人称と対照を明示し、「からこそ」により原文の因果関係と逆説を簡潔に伝えた。脚注記号[a]は本文中に配置した。
