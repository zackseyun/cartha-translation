id: JHN.8.29
reference: John 8:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ πέμψας με μετ’ ἐμοῦ ἐστιν· οὐκ ἀφῆκέν με ⸀μόνον, ὅτι ἐγὼ τὰ ἀρεστὰ αὐτῷ ποιῶ πάντοτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/029.yaml
  text: And the one who sent me is with me[a]. He has not left me alone[b], because I always do what is pleasing to him.
translation:
  language: ja
  text: わたしを遣わした方は、わたしと共におられる。その方はわたしを一人にはしておかれなかった。わたしはいつも、その方に喜ばれることを行っているからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πέμψας με
  choice: わたしを遣わした方
  rationale: 冠詞付きアオリスト分詞の名詞的用法を自然な日本語で表し、文脈上の父を明示的に補わず、原文の関係的表現を保った。
- source_word: μετ’ ἐμοῦ ἐστιν
  choice: わたしと共におられる
  rationale: μετά＋属格の同伴・臨在を表す。対象への敬意を自然に示しつつ、継続する共在を伝える。
- source_word: οὐκ ἀφῆκέν με μόνον
  choice: わたしを一人にはしておかれなかった
  rationale: ἀφίημιと述語的なμόνονを、日本語として自然な『一人にしておく』で表した。アオリストの形を尊重して過去形としつつ、直前の現在形が継続する臨在を示す。
- source_word: ὅτι
  choice: からである
  rationale: ここでは理由を導く因果用法として訳した。
- source_word: τὰ ἀρεστὰ αὐτῷ
  choice: その方に喜ばれること
  rationale: 中性複数の名詞的表現を自然な包括表現にし、ἀρεστόςの『喜ばしい、意にかなう』という評価的意味を保った。
- source_word: ποιῶ πάντοτε
  choice: いつも…行っている
  rationale: 現在形の習慣的・継続的な側面とπάντοτεの恒常性を表した。
theological_decisions:
- issue: 『わたしを遣わした方』の指示対象
  choice: 本文では『わたしを遣わした方』を保持する
  alternative: 『わたしを遣わした父』と明示する
  rationale: ヨハネ福音書の文脈では父を指すが、ギリシア語本文は関係的表現を用いるため、明示的な『父』を補わず原文の言い回しを保った。
- issue: ἀφῆκενの時制と継続的含意
  choice: 『しておかれなかった』と過去形で訳す
  alternative: 『一人にはしておかれない』と現在的に訳す
  rationale: ギリシア語のアオリストを尊重しながら、直前の『共におられる』によって現在も続く臨在が明確になるようにした。因果関係が機械的・功績的に聞こえ得る緊張は、原文どおり解消せず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発話として簡潔さと品位を保った。神を指す表現には自然な尊敬表現『おられる／おかれなかった』を用いた。
