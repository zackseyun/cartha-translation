id: JHN.8.24
reference: John 8:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπον οὖν ὑμῖν ὅτι ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν· ἐὰν γὰρ μὴ πιστεύσητε ὅτι ἐγώ εἰμι, ἀποθανεῖσθε ἐν ταῖς ἁμαρτίαις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/024.yaml
  text: So I told you that you will die in your sins. For unless you believe that I am[a], you will die in your sins.
translation:
  language: ja
  text: だから、わたしはあなたがたに、あなたがたは自分たちの罪の中で死ぬ、と言ったのです。というのも、わたしがその者である[a]と信じなければ、あなたがたは自分たちの罪の中で死ぬからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「わたしはある」。ギリシア語のἐγώ εἰμιには明示された補語がなく、この表現はヨハネの福音書の中で、さらに深い響きを帯びている可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν ὑμῖν
  choice: だから、わたしはあなたがたに……と言ったのです
  rationale: οὖνの推論的・談話接続的な働きを「だから」で表し、εἶπονと与格ὑμῖνを自然な現代日本語の「あなたがたに……と言った」とした。
- source_word: ἀποθανεῖσθε
  choice: 死ぬ
  rationale: ἀποθνῄσκωの未来形をそのまま「死ぬ」とした。「滅びる」では原文に明示されない解釈的含意が加わるため避けた。
- source_word: ἐν ταῖς ἁμαρτίαις ὑμῶν
  choice: 自分たちの罪を負ったまま
  rationale: ἐνが表す、罪の領域・状態にとどまったまま死ぬという意味を、現代日本語で明瞭に表した。日本語の「罪」は数を明示しなくても複数のἁμαρτίαιςを包含でき、「自分たちの」によってὑμῶνを示した。
- source_word: ἐὰν γὰρ μὴ
  choice: というのも、……なければ……からです
  rationale: γάρが前文の根拠を示すことを「というのも……からです」で、ἐὰν μήの否定条件を「……なければ」で表した。
- source_word: πιστεύσητε
  choice: 信じる
  rationale: ヨハネ文書におけるπιστεύωの標準的な意味を、信頼の含みも持ちうる日本語の「信じる」で表した。
- source_word: ὅτι ἐγώ εἰμι
  choice: わたしがその者である
  rationale: ギリシア語にはἐγώ εἰμιの後に明示的な補語がない。本文では文脈上の自己同定を自然な日本語で表し、絶対的な「わたしはある」とも聞こえうる原文の響きは脚注に残した。
theological_decisions:
- issue: 補語を伴わないヨハネの表現ἐγώ εἰμιをどう訳すか
  choice: わたしがその者である
  alternative: わたしはある
  rationale: この句は文脈に即した自己同定とも、神的自己啓示を想起させうる絶対的表現とも読める。本文では自然な自己同定として訳し、原文の形式と神学的な含みを脚注で示すことで、曖昧さを一方に決め切らないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、語り口の荘重さと原文の反復を保った。「罪のうちに死ぬ」という不自然になりやすい直訳は避け、「罪を負ったまま死ぬ」として状態・領域の意味を伝えた。
