  text: ἐὰν οὖν ὁ υἱὸς ὑμᾶς ἐλευθερώσῃ, ὄντως ἐλεύθεροι ἔσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/036.yaml
  text: So if the Son sets you free[a], you will be truly free.
translation:
  language: ja
  text: ですから、御子があなたがたを自由にするなら、あなたがたは真に自由になります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「本当に自由になります」または「まさしく自由になります」とも訳せる。ギリシア語の副詞は、この自由が名目だけでなく、現実で確かなものであることを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: ですから、…なら
  rationale: οὖνの前文からの帰結を「ですから」で示し、ἐὰνの条件を「なら」で自然に表した。
- source_word: ὁ υἱὸς
  choice: 御子
  rationale: ヨハネ福音書の文脈ではイエスを指す称号であり、現代日本語の聖書文体として明確かつ簡潔に表した。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: ギリシア語の二人称複数を日本語でも明示した。
- source_word: ἐλευθερώσῃ
  choice: 自由にする
  rationale: 罪の奴隷状態との対比を保ちつつ、行為を直接的で自然な日本語にした。原文に明示されない敬語的要素は加えていない。
- source_word: ὄντως
  choice: 真に
  rationale: 自由が名目上ではなく現実のものであることを強調する副詞の力を、簡潔で品位ある語で表した。
- source_word: ἐλεύθεροι ἔσεσθε
  choice: 自由な者となります
  rationale: 未来の結果として成立する自由な状態を表し、動詞ἐλευθερόωとの語のつながりも保った。
theological_decisions:
- issue: 「御子」の指示対象
  choice: イエスを指すキリスト論的称号として「御子」とする
  alternative: 一般的な「息子」
  rationale: 定冠詞を伴う表現とヨハネ福音書の直前の文脈では、家にとどまる「子」として語るイエス自身を指す。固有の称号として訳すが、本文にはそれ以上の教理的説明を加えない。
- issue: 自由の性質と範囲
  choice: 「真に自由」と広く表現する
  alternative: 「罪から霊的に自由」と限定して表現する
  rationale: 直前の文脈は罪への隷属を扱うが、この節の結果表現自体は広い。訳文では自由を特定の政治的・社会的・内面的範疇だけに限定せず、原文の強調と含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「御子」「真に」によって聖書本文としての品位を保った。「解放する」より日常的で文脈にも合う「自由にする」を採用し、複数の聞き手は「あなたがた」で明示した。
