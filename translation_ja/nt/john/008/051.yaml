  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐάν τις τὸν ⸂ἐμὸν λόγον⸃ τηρήσῃ, θάνατον οὐ μὴ θεωρήσῃ εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/051.yaml
  text: Truly, truly, I say to you, if anyone keeps my word, he will certainly never see death forever.
translation:
  language: ja
  text: 「まことに、まことに、あなたがたに言います。だれでもわたしのことばを守るなら、その人は永遠に決して死を見ることはありません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: イエスの厳粛な断言を示す反復を保ち、現代日本語でも品位のある定型表現とした。
- source_word: τὸν ἐμὸν λόγον τηρήσῃ
  choice: わたしのことばを守るなら
  rationale: λόγος はここではイエスの教え・告知を指す単数形であり、「ことば」とした。τηρέω の、保持し従うという含みを「守る」で表した。
- source_word: θάνατον οὐ μὴ θεωρήσῃ
  choice: 死を見ることが決してありません
  rationale: οὐ μή の強い否定を「決して…ありません」で示し、「死を見る」という原文の比喩的表現を保持した。
- source_word: εἰς τὸν αἰῶνα
  choice: 永遠に
  rationale: 時間的に限りがないことを表す慣用句として自然かつ簡潔に訳した。強い否定と併せ、永続的否定を示す。
theological_decisions:
- issue: 「死を見る」と信者の肉体的死との関係
  choice: 原文どおり「死を見る」を残し、意味を特定の種類の死に限定しない
  alternative: 「永遠の死を経験することはない」などと解釈を明示する
  rationale: 文脈には肉体的死と究極的な死をめぐる緊張があるため、「永遠の死」などの補足を本文に持ち込まず、イエスの逆説的表現を保持した。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、イエスの荘重な宣言としての調子を保った。「あなたがたに言います」は平明さを優先し、「言っておきます」などの説明的表現は避けた。
