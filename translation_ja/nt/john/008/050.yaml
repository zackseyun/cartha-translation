  text: ἐγὼ δὲ οὐ ζητῶ τὴν δόξαν μου· ἔστιν ὁ ζητῶν καὶ κρίνων.
base_translation:
  language: en
  yaml_path: translation/nt/john/008/050.yaml
  text: But I do not seek my own glory[b][a]; there is One who seeks it and judges.
translation:
  language: ja
  text: しかし、わたしは自分の栄光を求めてはいない。それ[a]を求める方[b]がいて、裁くのもその方である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「求め、裁く方がいる」。ここで「それ」は、前の文の「わたしの栄光」を受けて、「求める」の目的語として補った語。
    reason: lexical_alternative
  - marker: b
    text: この「方」は文脈上、父を指すと一般に理解されるが、ギリシア語本文はここで明記していない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ δὲ
  choice: しかし、わたしは
  rationale: 明示された代名詞ἐγώの強調と、δέの対比を自然な現代日本語で表した。
- source_word: οὐ ζητῶ
  choice: 求めてはいない
  rationale: 現在形の否定を表し、後半のζητῶνとの語彙上のつながりを保つため「求める」を反復した。
- source_word: τὴν δόξαν μου
  choice: 自分の栄光
  rationale: δόξαをヨハネ文脈に即して「栄光」とし、μουが示す自己の栄光という対照を日本語として明瞭にした。
- source_word: ἔστιν ὁ ζητῶν
  choice: それを求め…方がいる
  rationale: ἔστινを存在表現「いる」で訳し、冠詞付き分詞を人格を指す「方」で表した。目的語「それ」は直前の「自分の栄光」を受ける補足である。
- source_word: καὶ κρίνων
  choice: 裁く
  rationale: ζητῶνと並列する現在分詞を連体節内の動詞として訳し、法廷的含意を持つκρίνωに「裁く」を用いた。
theological_decisions:
- issue: 栄光を求め、裁く主体の正体
  choice: 本文では「方」とし、父とは明記しない。
  alternative: 「父がそれを求め、裁く」と明示する。
  rationale: 文脈上は父を指すと理解されるが、ギリシア語本文は主体を名指ししていないため、その含みを保持した。
- issue: ζητῶνの省略された目的語
  choice: 「それ」を補い、直前のイエスの栄光を指すものとして訳す。
  alternative: 「求め、裁く方がいる」と目的語を明示しない。
  rationale: 目的語は文法上明記されていないが、前節から自然に補われる。日本語の明瞭さのため本文に「それ」を置き、注で補足であることを示した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「おられる」は解釈的な敬語を加えるため避け、原文の簡潔な存在表現に対応して「いる」とした。
