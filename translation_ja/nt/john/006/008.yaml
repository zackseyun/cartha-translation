  text: λέγει αὐτῷ εἷς ἐκ τῶν μαθητῶν αὐτοῦ, Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/008.yaml
  text: One of his disciples, Andrew, Simon Peter’s brother, said to him,
translation:
  language: ja
  text: 弟子の一人、シモン・ペテロの兄弟であるアンデレが、イエスに言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は物語現在形だが、現代日本語の自然な物語叙述に合わせて過去形とした。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 代名詞の指示対象は文脈上イエスであり、日本語では明示したほうが自然で分かりやすい。
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 弟子の一人
  rationale: 部分を表す εἷς ἐκ＋属格複数を、簡潔で自然な日本語にした。
- source_word: μαθητῶν
  choice: 弟子
  rationale: 福音書における μαθητής の師弟関係と従う者としての含意を保つ標準的な訳語。
- source_word: Ἀνδρέας
  choice: アンデレ
  rationale: 日本語聖書で広く定着している人名表記を採用した。
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: シモン・ペテロの兄弟
  rationale: 属格によるアンデレの家族関係の説明を、そのまま自然な日本語で表した。ἀδελφός はここでは男性のきょうだいを指すが、年長・年少は原文から確定できないため「兄」「弟」と限定しなかった。
- source_word: Σίμωνος Πέτρου
  choice: シモン・ペテロ
  rationale: 二つの名を一人の人物を示す定着した複合的呼称として表記した。
theological_decisions:
- issue: ἀδελφός の年長・年少関係
  choice: 兄弟
  alternative: 兄／弟
  rationale: 原文は男性のきょうだいであることを示すが、どちらが年長かは示さないため、不要な限定を避けた。
translation_notes:
  register: 明快な現代標準日本語。簡潔な物語文として品位を保ち、人名は日本語聖書で定着した表記を用いた。
