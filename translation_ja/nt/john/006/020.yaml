  text: ὁ δὲ λέγει αὐτοῖς· Ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/020.yaml
  text: But he said to them[a], “It is I; do not be afraid.”
translation:
  language: ja
  text: しかし、イエスは彼らに言われた。「わたしだ。[a] 恐れることはない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には「わたしはある」。ヨハネ福音書では、この表現は単純な自己同定として用いられる一方、より広い神学的な響きを帯びる可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ δὲ
  choice: しかし、イエスは
  rationale: δέは穏やかな展開・対照を示すため「しかし」とした。冠詞ὁは代名詞的にイエスを指す。日本語では単に「彼は」より、文脈上の主語を「イエス」と明示するほうが自然で明瞭である。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形にした。イエスの発言なので、現代標準日本語として無理のない敬意を表す「言われた」を用いた。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 原文は三人称複数の代名詞であり、この節では「弟子たち」と明示していないため、「彼らに」とした。
- source_word: Ἐγώ εἰμι
  choice: わたしだ
  rationale: この場面では、恐れている弟子たちにイエスが自分であると知らせる自己同定として自然に伝わる。ただし字義的には「わたしはある／わたしである」とも訳せ、ヨハネ福音書におけるより広い神学的響きの可能性を脚注に残した。
- source_word: μὴ φοβεῖσθε
  choice: 恐れることはない
  rationale: μήを伴う現在命令形による禁止・安心の呼びかけを、簡潔で dignified な現代日本語にした。「恐れてはいけない」よりも、この場面での慰めと励ましが自然に伝わる。
theological_decisions:
- issue: Ἐγώ εἰμιを単純な自己同定として訳すか、「わたしはある」という神学的含意を前面に出すか
  choice: 本文では「わたしだ」
  alternative: 「わたしはある」「わたしである」
  rationale: 直近の文脈では、イエスが弟子たちを安心させるために自分であると知らせている。一方、ヨハネ福音書のἐγώ εἰμιにはより広い神学的響きがあり得るため、それを断定も排除もせず、字義的な形を脚注に示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、聖書本文にふさわしい簡潔さと品位を保った。「わたしだ」は口語的すぎない自己同定として採用し、原文の曖昧さは脚注で保持した。
