id: JHN.6.45
reference: John 6:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔστιν γεγραμμένον ἐν τοῖς προφήταις· Καὶ ἔσονται πάντες διδακτοὶ θεοῦ· ⸀πᾶς ὁ ⸀ἀκούσας παρὰ τοῦ πατρὸς καὶ μαθὼν ἔρχεται πρὸς ⸀ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/045.yaml
  text: It is written in the Prophets[a], ‘And they will all be taught by God.’ Everyone who has heard from the Father and has learned comes to me.
translation:
  language: ja
  text: 預言者の書にこう書かれています。「彼らは皆、神に教えられる。」父から聞いて学んだ者は皆、わたしのもとに来ます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστιν γεγραμμένον
  choice: こう書かれています
  rationale: 完了の結果が現在も有効であることを含む定型表現を、自然な現代日本語で表した。
- source_word: ἐν τοῖς προφήταις
  choice: 預言者の書に
  rationale: 単に預言者たちという人物を指すより、聖書の預言書群を指す引用句として理解しやすい形にした。
- source_word: ἔσονται πάντες διδακτοὶ θεοῦ
  choice: 彼らは皆、神に教えられる
  rationale: 未来の意味と、神が教える方であることを簡潔に保った。「神に教えられた者となる」という可能な含みも損なわない。
- source_word: πᾶς ὁ ἀκούσας
  choice: 聞いた者は皆
  rationale: 実詞化された単数形の普遍的な意味と、主動詞に先立つ行為を自然に表した。
- source_word: παρὰ τοῦ πατρὸς
  choice: 父から
  rationale: 属格を伴う παρά の源・起点の意味を保持し、ヨハネ文書に特徴的な「父」という呼称をそのまま示した。
- source_word: καὶ μαθὼν
  choice: 学んだ
  rationale: 「聞いて」と並ぶ先行行為として簡潔に訳し、聞くことと学ぶことの両方を保持した。
- source_word: ἔρχεται πρὸς ἐμέ
  choice: わたしのもとに来ます
  rationale: 現在形と、イエスに向かう人格的な動きを自然な日本語で表した。
theological_decisions:
- issue: 神から教えられることとイエスのもとに来ることの関係
  choice: 父から聞いて学んだ者は皆、イエスのもとに来るという本文の連関をそのまま示した。
  alternative: 神の決定的な働きをさらに強調する訳、または人間の応答をさらに強調する訳
  rationale: ギリシア語本文は両者の関係を述べるが、その形而上学的な仕組みまでは説明していないため、特定の教派的解釈で補わなかった。
- issue: 「父」と「わたし」の関係
  choice: 「父」と「わたし」を直接結びつけた本文の表現を保持した。
  alternative: イエスの権威や身分を説明的に補う訳
  rationale: 父から真に聞き学ぶことがイエスのもとに来ることへ結びつくというキリスト論的な力を保ちつつ、本文にない説明は加えなかった。
translation_notes:
  register: 明瞭で現代的かつ礼節ある文体。「預言者の書」は聖書の預言書群を指すことが普通の読者にも伝わるようにした。引用部は簡潔で格調を保ち、後半は神学的緊張を解消する説明を加えず、原文の順序と関係を自然な日本語で示した。
