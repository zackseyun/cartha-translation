id: JHN.6.9
reference: John 6:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔστιν ⸀παιδάριον ὧδε ⸀ὃς ἔχει πέντε ἄρτους κριθίνους καὶ δύο ὀψάρια· ἀλλὰ ταῦτα τί ἐστιν εἰς τοσούτους;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/009.yaml
  text: There is a boy here who has five barley loaves and two fish[a], but what are these for so many?
translation:
  language: ja
  text: 「ここに、大麦のパン五つと魚二匹を持っている少年がいます。しかし、こんなに大勢の人に対して、これが何になるでしょうか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、こんなに大勢の人に、これだけで何の足しになるでしょうか」。直訳に近くは「しかし、これらは、こんなに大勢の人に対して何でしょうか」。
    reason: 原文の疑問は字義的な形と、量的にほとんど役に立たないという評価的な意味の両方を帯びるため。
lexical_decisions:
- source_word: παιδάριον
  choice: 少年
  rationale: 子どもまたは年若い男子を指す語。文脈に合い、現代日本語として自然な「少年」とした。小ささを必要以上に強調する「幼い男の子」は避けた。
- source_word: ὧδε
  choice: ここに
  rationale: 場所を示す副詞を、簡潔で自然な現代日本語に訳した。
- source_word: ὃς ἔχει
  choice: 持っている
  rationale: 少年を、その所持品によって特定する関係節の働きを自然な連体修飾で表した。
- source_word: ἄρτους κριθίνους
  choice: 大麦のパン
  rationale: ἄρτοςはパンまたはパンの塊、κριθίνουςは大麦製であることを示す。「大麦のパン」は日本語で明瞭かつ簡潔である。
- source_word: ὀψάρια
  choice: 魚
  rationale: この文脈ではパンとともに食べる魚を指す。「小魚」も可能だが、語だけから大きさを断定せず、自然な「魚」とした。
- source_word: ἀλλὰ
  choice: しかし
  rationale: 手元にある食物と群衆の多さとの対照を、直接的かつ品位ある接続語で示した。
- source_word: ταῦτα τί ἐστιν
  choice: これが何になるでしょうか
  rationale: 字義上は「これらは何か」だが、ここでは量的な不足を問う評価的な疑問である。日本語でその修辞的な力を自然に伝えつつ、「何になる」という原文に近い表現を保った。
- source_word: εἰς τοσούτους
  choice: こんなに大勢の人に対して
  rationale: 非常に多くの人々との関係で、食物がどれほど役に立つかを問う表現。「に対して」により関係・充足性の含みを保った。
theological_decisions: []
