id: JHN.6.23
reference: John 6:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ ἦλθεν ⸀πλοιάρια ἐκ Τιβεριάδος ἐγγὺς τοῦ τόπου ὅπου ἔφαγον τὸν ἄρτον εὐχαριστήσαντος τοῦ κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/023.yaml
  text: But boats came from Tiberias near the place where they ate the bread after the Lord had given thanks[a].
translation:
  language: ja
  text: しかし、主が感謝をささげられた後に人々がパンを食べた場所の近くに、ティベリアスから小舟が来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 前節までの状況との対照を示す接続詞として、自然で明確な「しかし」とした。
- source_word: ἦλθεν
  choice: 来た
  rationale: 到来を物語るアオリストであり、日本語では簡潔に「来た」とする。
- source_word: πλοιάρια
  choice: 小舟
  rationale: πλοιάριον の指小的な形を日本語で無理なく反映できるため、「小舟」とした。文脈上も舟の種類を過度に限定しない。
- source_word: ἐκ Τιβεριάδος
  choice: ティベリアスから
  rationale: 出発地・起点を示す標準的な表現。
- source_word: ἐγγὺς τοῦ τόπου
  choice: 場所の近くに
  rationale: 位置的な近さを自然な現代日本語で表す。
- source_word: ὅπου ἔφαγον τὸν ἄρτον
  choice: 人々がパンを食べた場所
  rationale: 主語は動詞の三人称複数形から補い、直前の群衆を指すものとして一般的な「人々」とした。定冠詞付きのパンは既出のパンを指すが、日本語では文脈上「その」を加えなくても明瞭である。
- source_word: εὐχαριστήσαντος τοῦ κυρίου
  choice: 主が感謝をささげられた後に
  rationale: 属格絶対に近い構文とアオリスト分詞が、パンを食べたことに先行する行為を示すため「後に」とした。敬意を帯びた自然な日本語として「感謝をささげられた」を用いる。
theological_decisions:
- issue: κύριος の訳語
  choice: 主
  alternative: 主人／先生
  rationale: ここではイエスを指す尊称であり、ヨハネ文書におけるキリスト論的な響きを保ちつつ、過剰な解釈を加えない「主」が適切である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ギリシア語の語順をそのまま追わず、修飾関係が一読で分かるように「主が…後に人々が…場所」を「場所」に前置した。「小舟」で指小形のニュアンスを本文に反映したため脚注は不要。
