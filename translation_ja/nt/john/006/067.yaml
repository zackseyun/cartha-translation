  text: εἶπεν οὖν ὁ Ἰησοῦς τοῖς δώδεκα· Μὴ καὶ ὑμεῖς θέλετε ὑπάγειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/067.yaml
  text: So Jesus said to the Twelve[a], “You do not want to go away too, do you?”
translation:
  language: ja
  text: そこで、イエスは十二人に言われた。「あなたがたも去って行きたいのではないでしょうね。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたも去って行きたいのですか」。ギリシア語の疑問文には、通常、否定の答えを予想するμήが使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 多くの弟子が去った直前の出来事を受け、物語上のつながりと帰結を自然な現代日本語で示す。
- source_word: τοῖς δώδεκα
  choice: 十二人に
  rationale: イエスの内側の弟子集団を指す定着した呼称として、説明語を補わず簡潔に訳す。
- source_word: Μὴ καὶ ὑμεῖς
  choice: あなたがたまで……わけではないでしょう
  rationale: μήが否定の答えを予想する疑問を導くこと、καίがほかの弟子たちに加えて『あなたがたまで』という含みを持つことを表す。
- source_word: θέλετε
  choice: 行きたい
  rationale: ここでのθέλωは意志・願望を表すため、自然な現代日本語の『たい』で訳す。
- source_word: ὑπάγειν
  choice: 去って行く
  rationale: イエスのもとから離れて行くという文脈上の動きを保ち、『見捨てる』などの解釈的な語は避ける。
theological_decisions:
- issue: μήで導かれるイエスの問いの力
  choice: 否定の答えを予想しつつ問いかける『……わけではないでしょう』
  alternative: より中立的な『あなたがたも去って行きたいのですか』
  rationale: μήは通常、否定の答えを期待する問いを示す。ただし弟子たちの応答を断定するほど強めず、問いとしての緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イエスの問いに含まれる否定回答への期待を、日本語として不自然にならない形で示した。
