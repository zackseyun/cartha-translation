  text: わたしは命のパンです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγώ εἰμι
  choice: わたしは～です
  rationale: 明示された一人称主語と現在形の連結動詞による自己同定を、自然な現代日本語で表した。「このわたしこそ」とすると強調を加えすぎるため避けた。
- source_word: ὁ ἄρτος
  choice: パン
  rationale: 文脈上の比喩的な自己同定を明確に伝える語。「パンこそ」とはせず、ギリシア語の定冠詞が持つ同定の働きは「AはBです」という構文全体で表した。
- source_word: τῆς ζωῆς
  choice: 命の
  rationale: 属格の簡潔さとヨハネ文書に特徴的な表現を保った。「命を与える」と解釈的に展開せず、命との関係が持つ含みを残した。
theological_decisions:
- issue: ヨハネ福音書における「わたしは～である」という自己宣言の力点
  choice: わたしは命のパンです
  alternative: このわたしこそ、命のパンです
  rationale: ここは絶対用法のἐγώ εἰμιではなく、補語を伴う自己同定である。キリスト論的な重みを保ちつつ、原文にない強調や神学的説明を加えない訳とした。
- issue: 「命のパン」が示す関係
  choice: 属格を「命の」として保持する
  alternative: 命を与えるパン
  rationale: 「命を与える」は文脈上妥当な含意だが、τῆς ζωῆςの関係を一義的に説明してしまう。原文の簡潔さと意味の広がりを保った。
translation_notes:
  register: 明瞭で自然な現代標準日本語。短い宣言の荘重さを保つため「わたし」を用い、口語的すぎる言い換えや説明的な補足は避けた。
