  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ τὸν Ἰούδαν Σίμωνος ⸀Ἰσκαριώτου· οὗτος γὰρ ἔμελλεν ⸂παραδιδόναι αὐτόν⸃, ⸀εἷς ἐκ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/071.yaml
  text: He was speaking about Judas[a], the son of Simon Iscariot, for this one was about to betray him, being one of the Twelve.
translation:
  language: ja
  text: イエスが言っていたのは、シモン・イスカリオテの子ユダのことであった。このユダは十二人の一人であり、イエスを裏切る[a]ことになっていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「引き渡す」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν δὲ τὸν Ἰούδαν
  choice: イエスが言っていたのは……ユダのことであった
  rationale: 未完了過去の説明的な語りを自然な日本語で表した。主語の「イエス」は直前の文脈から補い、δὲは独立した接続語にせず、説明の流れに織り込んだ。
- source_word: Σίμωνος Ἰσκαριώτου
  choice: シモン・イスカリオテの子
  rationale: 連続する属格を父子関係として理解し、イスカリオテをシモンに結び付けるギリシア語の語順を保った。
- source_word: οὗτος
  choice: このユダは
  rationale: 指示代名詞のやや強調された指示を、単なる「彼」ではなく、自然で明確な日本語として再提示した。
- source_word: ἔμελλεν
  choice: ことになる者だった
  rationale: 将来起こることを視野に入れた表現とし、本人の意図や神的な宿命を本文以上に断定する「しようとしていた」「定められていた」は避けた。
- source_word: παραδιδόναι αὐτόν
  choice: イエスを裏切る
  rationale: 受難物語におけるユダの行為の関係的・物語的意味を明瞭に示した。より字義的な「引き渡す」は脚注に残した。
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: 十二人の一人であり
  rationale: ユダが十二人に属していたという衝撃的な付加説明を簡潔に保ち、原文に明示されない強い逆接は加えなかった。
theological_decisions:
- issue: ユダの行為を表す παραδιδόναι の訳
  choice: 裏切る
  alternative: 引き渡す
  rationale: この文脈では「裏切る」が行為の物語的意味を明確にするが、原語自体の基本的な像である「引き渡す」も重要なので脚注で示した。
- issue: ἔμελλεν が示す将来性
  choice: ことになる者だった
  alternative: しようとしていた／定められていた
  rationale: 将来の出来事を示しつつ、ユダのその時点での意図や予定説的な必然性を訳文で過度に確定しないようにした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、聖書本文としての落ち着きと品位を保つ常体を用いた。「このユダ」と再提示して οὗτος の指示性を表し、文末の「のである」で語り手による説明であることを自然に示した。
