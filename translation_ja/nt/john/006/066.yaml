source:
  edition: SBLGNT
  text: Ἐκ τούτου πολλοὶ ⸀ἐκ ⸂τῶν μαθητῶν αὐτοῦ ἀπῆλθον⸃ εἰς τὰ ὀπίσω καὶ οὐκέτι μετ’ αὐτοῦ περιεπάτουν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/066.yaml
  text: From this time many of his disciples went back and no longer walked with him[a].
translation:
  language: ja
  text: この時から、弟子たちのうち多くの者が後戻りして、もはやイエスと共に歩まなくなった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このことのために、弟子たちのうち多くの者が離れて行った」。冒頭のギリシア語は原因を表すとも取れるが、文脈では転機を示す「この時から」が自然である。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐκ τούτου
  choice: この時から
  rationale: 文脈上、イエスの厳しいことばを転機として、その後の継続的な変化を示す時間的表現と取るのが自然。ただし原因を示す解釈も可能なので脚注に残した。
- source_word: πολλοὶ ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 弟子たちのうち多くの者
  rationale: ἐκ の部分を示す用法を明示し、十二人に限定せず、より広い弟子の集団から多くが離れたことを保つ。
- source_word: ἀπῆλθον εἰς τὰ ὀπίσω
  choice: 離れて戻って行き
  rationale: ἀπῆλθον の離去と εἰς τὰ ὀπίσω の後方へ戻る意味をともに表し、単なる移動ではなく、それまでの歩みから退いた含みを過度に解釈せず伝える。
- source_word: οὐκέτι
  choice: もはや…なくなった
  rationale: その時点以後の継続的な停止を、自然な現代日本語で示す。
- source_word: μετ’ αὐτοῦ περιεπάτουν
  choice: イエスと共に歩まなくなった
  rationale: περιπατέω の歩行の比喩を保ちながら、同行と継続的な結びつきの両方を表す。日本語では指示対象を明確にするため αὐτοῦ を「イエス」とした。
theological_decisions:
- issue: ここでの μαθηταί が十二人または真の信者だけを意味するか
  choice: 弟子たち
  alternative: 従っていた人々
  rationale: 本文は彼らを弟子と呼ぶが、十二人とは同定せず、信仰の真正性についても翻訳段階で判定していない。「弟子たち」は物語上の呼称と神学的緊張を保つ。
- issue: 「共に歩く」を単に「従う」と意訳するか
  choice: 共に歩む
  alternative: 従う
  rationale: 原文の比喩と、実際の同行および弟子としての関係という重なりを保持し、一義的に解消しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「離れて戻って行き」で原文の二重の動きを自然に示し、「共に歩む」によってヨハネ本文の比喩的な余韻を保った。
