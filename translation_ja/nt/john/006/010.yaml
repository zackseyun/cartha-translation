  text: ⸀εἶπεν ὁ Ἰησοῦς· Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν. ἦν δὲ χόρτος πολὺς ἐν τῷ τόπῳ. ἀνέπεσαν οὖν οἱ ἄνδρες τὸν ἀριθμὸν ⸀ὡς πεντακισχίλιοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/010.yaml
  text: Jesus said, “Have the people sit down.” Now there was plenty of grass in the place. So the men sat down, about five thousand in number.
translation:
  language: ja
  text: イエスは言われた。「人々を座らせなさい。」その場所には草がたくさん生えていた。そこで男たちは座った。人数はおよそ五千人であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「座らせなさい」「座った」は、食事のために「身を横たえさせなさい」「身を横たえた」とも訳せる。また原文は初めに群衆を「人々」と呼び、約五千という人数については男性を表す語を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ποιήσατε τοὺς ἀνθρώπους ἀναπεσεῖν
  choice: 人々を座らせなさい
  rationale: ποιέω＋不定詞の使役表現を、命令の力を保った自然な現代日本語にした。ἀναπίπτωは食事のために身を横たえることも指すが、屋外の群衆については「座る」が明瞭で自然である。
- source_word: τοὺς ἀνθρώπους
  choice: 人々
  rationale: ここでのἄνθρωποςは群衆全般を指す。後半の男性を明示するἄνδρεςとの語義上の違いを保った。
- source_word: χόρτος πολὺς ἐν τῷ τόπῳ
  choice: その場所には草がたくさん生えていた
  rationale: χόρτος πολὺςの豊富な草という情景を自然に表し、ἐν τῷ τόπῳを「その場所には」と明示した。「生えていた」は日本語で草の存在を自然に述べる表現である。
- source_word: ἀνέπεσαν οὖν
  choice: そこで人々は座った
  rationale: οὖνの物語上の帰結を「そこで」で示した。ギリシア語の主語はοἱ ἄνδρεςだが、日本語で直ちに「男たちは座った」とすると、座った者が男性だけだったとの不要な含意を生みやすいため、動作の主体は文脈に沿って「人々」とし、男性に限定された人数は次文で明示した。
- source_word: οἱ ἄνδρες τὸν ἀριθμὸν ὡς πεντακισχίλιοι
  choice: 男の数はおよそ五千人であった
  rationale: ἄνδρεςが男性を指すことと、ὡςによる概数をともに保持した。τὸν ἀριθμόνは「数は」と訳した。
theological_decisions:
- issue: 給食物語における人数の性別範囲
  choice: 最初のἀνθρώπουςを「人々」、人数を示すἄνδρεςを「男」と訳し分ける
  alternative: 両方を「人々」として性別の区別を示さない
  rationale: 原文は群衆一般を表す語から男性を表す語へ切り替えている。約五千という数が男性についての数であることを保持しつつ、群衆全体が男性だけだったとはしない。
- issue: ἀναπίπτωが示す姿勢
  choice: 「座る」
  alternative: 「横になる」「身を横たえる」
  rationale: 食事の姿勢として横になる含意はあり得るが、ここでは屋外で群衆を配置する動作を自然な日本語で表した。語義上の別案は脚注で示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。直訳調を避けつつ、群衆一般と数えられた男性との原文上の区別、および概数表現を保持した。
