id: JHN.6.70
reference: John 6:70
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην; καὶ ἐξ ὑμῶν εἷς διάβολός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/070.yaml
  text: Jesus answered them[a], “Did I not choose you, the Twelve? Yet one of you is a devil.”
translation:
  language: ja
  text: イエスは彼らに答えた。「あなたがた十二人を選んだのは、わたしではなかったか。それなのに、あなたがたのうちの一人は悪魔[a]である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「中傷する者」とも訳せる。ギリシア語は偽って訴える者を指すことがあり、多くの文脈では「悪魔」を指す。ここでは無冠詞で、サタンそのものと直接同定するというより、その性質を言い表している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς
  choice: 彼らに答えた
  rationale: 応答を表す標準的な叙述として、自然な現代日本語にした。
- source_word: Οὐκ ἐγὼ ὑμᾶς τοὺς δώδεκα ἐξελεξάμην;
  choice: あなたがた十二人を選んだのは、わたしではなかったか
  rationale: 肯定の答えを予期する否定疑問の修辞的な力と、ἐγώに置かれた強調を保った。「十二人」は文脈上、特定の弟子集団を指す。
- source_word: καὶ
  choice: それなのに
  rationale: 形式上は接続的な語だが、ここでは十二人を選んだことと、その一人が悪魔であることの強い対照を自然に示す。
- source_word: ἐξ ὑμῶν εἷς
  choice: あなたがたのうちの一人
  rationale: 部分を表すἐξの意味を明確かつ自然に表現した。
- source_word: διάβολός
  choice: 悪魔
  rationale: 無冠詞の述語名詞が持つ性質描写の含みを本文だけで限定せず、原文の鋭さと曖昧さを保持した。日本語には不定冠詞がないため、注で「中傷する者」という語義と、サタンそのものとの直接同定とは限らない点を示す。
theological_decisions:
- issue: διάβολόςがサタンとの直接的同定か、性質を表す描写か
  choice: 悪魔
  alternative: 中傷する者／悪魔のような者
  rationale: 「悪魔のような者」とすると比喩に限定し、「中傷する者」とすると神学的・修辞的な強さを弱める。本文では「悪魔」を保ち、無冠詞による質的な含みと語義の幅を注で説明して、緊張を解消しない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。修辞疑問には自然な語順を用い、後半との対照を明示した。
