  naturalness: 改訂文は現代標準日本語として自然で、二つの認識内容を「こと」で並列する原文の構造を明瞭に示す。「舟に乗り込まなかった」「弟子たちだけで出発した」は文脈に即した自然な表現である。
  terminology: πλοιάριονを「小舟」、πλοῖονを「舟」と訳し分ける。Ἰησοῦςは「イエス」、μαθηταίは「弟子たち」とする。
