id: JHN.6.22
reference: John 6:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ὁ ὄχλος ὁ ἑστηκὼς πέραν τῆς θαλάσσης ⸀εἶδον ὅτι πλοιάριον ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ⸀ἕν, καὶ ὅτι οὐ συνεισῆλθεν τοῖς μαθηταῖς αὐτοῦ ὁ Ἰησοῦς εἰς τὸ ⸀πλοῖον ἀλλὰ μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/022.yaml
  text: On the next day[a], the crowd that had been standing on the other side of the sea saw that no other small boat had been there except one, and that Jesus had not gone with his disciples into the boat[b], but that his disciples had gone away alone.
translation:
  language: ja
  text: 翌日、海の向こう岸にいた群衆は、そこには一そうの小舟のほかには舟がなかったこと、また、イエスは弟子たちと一緒にその舟に乗り込まず、弟子たちだけで出発したことを知った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節では、最初の「小舟」はギリシア語πλοιάριον、後の「舟」はπλοῖονです。写本と校訂本文には、この二語の読みについて異同があります。本文は、ここに掲げたギリシア語本文の各箇所の語形を反映しています。
    reason: textual_variant
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: 翌日
  rationale: 次の日への場面転換を示す慣用的な時の表現として、簡潔で自然な日本語を用いた。
- source_word: ὁ ὄχλος ὁ ἑστηκὼς
  choice: 残っていた群衆
  rationale: 完了分詞が表す、その場所に立っていて引き続きそこにいた状態を、文脈に即して自然に表した。
- source_word: πέραν τῆς θαλάσσης
  choice: 湖の向こう岸に
  rationale: ガリラヤ湖を指す文脈で、θαλάσσαを現代日本語として自然な「湖」とし、πέρανの位置的意味を「向こう岸」で示した。
- source_word: εἶδον
  choice: 気づいた
  rationale: 後続する二つのὅτι節の内容を認識したという意味を自然に示す。単なる視覚動作に限定せず、観察から事情を把握した文脈に適する。
- source_word: πλοιάριον
  choice: 小舟
  rationale: 指小形の語形が持つ小ささの含みを保ち、簡潔な日本語にした。
- source_word: ἄλλο οὐκ ἦν ἐκεῖ εἰ μὴ ἕν
  choice: そこには小舟が一そうしかなかった
  rationale: 「ほかにはなく、一つだけ」という排他的な意味を自然な日本語で明確にした。舟の助数詞には「そう」を用いた。
- source_word: οὐ συνεισῆλθεν ... εἰς τὸ πλοῖον
  choice: 弟子たちと一緒にその舟に乗らず
  rationale: 原語の「共に中へ入る」を、舟について自然な「一緒に乗る」で表した。
- source_word: μόνοι οἱ μαθηταὶ αὐτοῦ ἀπῆλθον
  choice: 弟子たちだけが出て行った
  rationale: μόνοιの排他的強調を「だけ」で保ち、ἀπῆλθονを移動の文脈に合う「出て行った」とした。
