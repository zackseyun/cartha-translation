id: JHN.6.28
reference: John 6:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτόν· Τί ποιῶμεν ἵνα ἐργαζώμεθα τὰ ἔργα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/028.yaml
  text: Then they said to him[a], “What must we do so that we may work the works of God?”
translation:
  language: ja
  text: そこで彼らはイエスに言った。「神の業を行うために、私たちは何をすべきでしょうか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神の業を行うために、私たちは何をしたらよいのでしょうか」とも訳せる。また、「神が求める業を行うために」という意味にも理解できる。
    reason: 原文の熟慮を表す問いのニュアンスと、「神の業」という属格表現の解釈上の幅を示すため。
lexical_decisions:
- source_word: εἶπον οὖν πρὸς αὐτόν
  choice: そこで彼らはイエスに言った
  rationale: οὖνを物語の流れと前文からの応答を示す「そこで」とし、発話の相手が文脈上イエスであることを明示した。εἶπονは単純な過去の発話として「言った」とした。
- source_word: Τί ποιῶμεν
  choice: 私たちは何をすべきでしょうか
  rationale: 熟慮を表す接続法の問いとして、必要とされる行為を尋ねる自然な現代日本語にした。「何をしなければなりませんか」も可能だが、原文にない強い義務感を避けた。
- source_word: ἵνα ἐργαζώμεθα
  choice: 行うために
  rationale: ἵναの目的を「ために」で表した。日本語では動詞と同族目的語の反復をそのまま再現すると不自然になりやすいため、句全体を自然にまとめた。
- source_word: τὰ ἔργα τοῦ θεοῦ
  choice: 神の業
  rationale: 属格を「神の」と形式的に保ち、神が求める業、神に属する業、神が行う業という可能性を本文で一つに限定しない。「業」は文脈上の神学的含意を保てる語である。
theological_decisions:
- issue: τὰ ἔργα τοῦ θεοῦ における属格の意味
  choice: 本文では「神の業」とし、属格の意味を限定しない
  alternative: 「神が求めること」「神に属する業」「神が行う業」
  rationale: ギリシア語の属格は複数の理解を許し、続く29節との間にも意味上の緊張があるため、解釈を本文に織り込まず保持した。
translation_notes:
  register: 明瞭で自然な現代標準語を用い、会話として丁寧な「でしょうか」とした。「業」はやや格調を保ちつつ、ヨハネ文書におけるἔργονの含意と属格の曖昧さを保持する。脚注記号は該当する発言全体の末尾に置いた。
