id: JHN.6.40
reference: John 6:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο ⸀γάρ ἐστιν τὸ θέλημα τοῦ ⸂πατρός μου⸃ ἵνα πᾶς ὁ θεωρῶν τὸν υἱὸν καὶ πιστεύων εἰς αὐτὸν ἔχῃ ζωὴν αἰώνιον, καὶ ἀναστήσω αὐτὸν ⸀ἐγὼ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/040.yaml
  text: 'For this is the will of my Father: that everyone who sees the Son and believes in him may have eternal life[b][a], and I myself will raise him up on the last day.'
translation:
  language: ja
  text: というのは、子を見て、その子を信じる者がみな永遠のいのちを持ち[a]、わたし自身が[b]その人を終わりの日に復活させること、これがわたしの父のみこころだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子を注意深く見る」とも訳せる。ここで用いられた動詞は、単に目に入ることではなく、注意を向けて見ることを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「わたしが」とも訳せる。ギリシャ語では「わたし」が明示されており、イエスご自身が復活させるという強調がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο γάρ ἐστιν
  choice: というのも、……だからです
  rationale: γάρの前節を説明する働きを、現代日本語として自然な理由説明の構文で表した。τοῦτο ἐστινの指示・同定の力は「みこころは……ことであり」によって保持した。
- source_word: τὸ θέλημα τοῦ πατρός μου
  choice: わたしの父のみこころ
  rationale: θέλημαは神の意志を表す文脈で定着した「みこころ」とし、τοῦ πατρός μουはイエスと父との関係をそのまま示す「わたしの父」とした。
- source_word: πᾶς ὁ θεωρῶν τὸν υἱὸν
  choice: 子を見つめ……人がみな
  rationale: θεωρέωには単に視界に入る以上の、注意深く見る含みがあり、「見つめる」で表した。πᾶςと冠詞付き分詞の一般的範囲は「人がみな」で保持した。
- source_word: καὶ πιστεύων εἰς αὐτὸν
  choice: 子を信じる
  rationale: πιστεύω εἰςは対象へ向かう信頼を伴う信仰を表す。「信じる」はヨハネ文書の反復語彙として自然であり、代名詞を「子」として日本語で参照先を明確にした。
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: 永遠のいのちを持つようになる
  rationale: ἵναと接続法ἔχῃの目的・内容を「ようになる」で示し、単純な直説法に平板化しなかった。ζωὴν αἰώνιονは定着しつつ意味の広がりを保つ「永遠のいのち」とした。
- source_word: καὶ ἀναστήσω αὐτὸν ἐγὼ
  choice: わたし自身がその人を……よみがえらせる
  rationale: 明示されたἐγώの強調を「わたし自身が」で保持した。ἀναστήσωは終末の復活を指すため「よみがえらせる」とした。単数αὐτόνは、直前の集合全体ではなく一人一人を指す形を「その人」で表した。
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 終わりの日に
  rationale: ヨハネ福音書における終末論的な定型表現として、自然で荘重な「終わりの日に」を採用した。
theological_decisions:
- issue: πᾶς ὁ θεωρῶν … καὶ πιστεύωνの範囲と条件
  choice: 子を見つめ、子を信じる人がみな永遠のいのちを持つようになる
  alternative: 子を見て信じる者はだれでも永遠のいのちを持つ
  rationale: 見ることと信じることによって特徴づけられるすべての人、というギリシャ語の一般的表現を保持した。選びや人間の自由意志について、本文がここで明示しない特定の体系を持ち込んでいない。
- issue: ἐγώによるイエスの主体性の強調
  choice: わたし自身がその人を……よみがえらせる
  alternative: わたしがその人を……よみがえらせる
  rationale: 独立人称代名詞ἐγώの強調を訳文に明示し、復活におけるイエス自身の働きを本文どおり示した。
- issue: ἵνα節の目的・内容の関係
  choice: みこころは、……持つようになることであり、……よみがえらせること
  alternative: みこころは、……永遠のいのちを持つことである。わたしは……よみがえらせる
  rationale: ἵναが父のみこころの内容を導くと同時に目的的な響きも持つため、「ようになる」で両面を残した。二つの動詞を同じ構文内に保ち、父のみこころと終わりの日の復活との結びつきを明確にした。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、聖書本文にふさわしい品位を保った。「御心」ではなく読みやすい「みこころ」、「命」ではなく聖書語として認識しやすい「いのち」を採用した。節末は理由説明の「というのも……だからです」で前節とのつながりを示した。
