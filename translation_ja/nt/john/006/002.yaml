    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκολούθει
  choice: ついて来ていた
  rationale: 未完了過去の継続的な動作を自然な現代日本語で表し、文脈上の移動も伝える。
- source_word: δὲ
  choice: そして
  rationale: 強い対比ではなく、物語を進める緩やかな接続を表す。
- source_word: ὄχλος πολύς
  choice: 大勢の群衆
  rationale: 群衆の規模が大きいことを、明瞭で一般的な日本語で示す。
- source_word: ἐθεώρουν
  choice: 見ていた
  rationale: 未完了過去が示す継続・反復的な目撃を保つ。文脈上、単なる一瞥以上の観察も含みうる。
- source_word: σημεῖα
  choice: しるし
  rationale: ヨハネ福音書で、行為の奇跡性だけでなく、それがイエスについて示す意味を担う語であるため。
- source_word: ἐποίει
  choice: なさっていた
  rationale: 未完了過去の継続性を保ちつつ、イエスの行為を自然で品位ある日本語にする。
- source_word: ἐπὶ τῶν ἀσθενούντων
  choice: 病人たちに
  rationale: 病人がしるしの働きかけの対象であることを、日本語として自然に表す。
- source_word: ἀσθενούντων
  choice: 病人たち
  rationale: この文脈では身体的に病んでいる人々を指す。
theological_decisions:
- issue: ヨハネ福音書における σημεῖα の用語法
  choice: しるし
  alternative: 奇跡／奇跡的なしるし
  rationale: 超自然的な出来事という面だけに限定せず、その業がイエスについて何を明らかにするかというヨハネ特有の含意を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。物語調の品位を保ちつつ、未完了過去の継続性を「ついて来ていた」「見ていた」「なさっていた」で表した。「しるし」は平仮名表記とし、一般読者が「徴」の字でつまずかないようにした。
