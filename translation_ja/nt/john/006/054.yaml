  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἔχει ζωὴν αἰώνιον, κἀγὼ ἀναστήσω αὐτὸν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/054.yaml
  text: The one who eats my flesh and drinks my blood has eternal life[b][a], and I will raise him up on the last day.
translation:
  language: ja
  text: わたしの肉を食べ[a]、わたしの血を飲む者は永遠の命を持っている。そして、わたしはその人を終わりの日に復活させる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食べる」のほか、より具体的には「かむ」とも訳せる。ギリシア語の動詞τρώγωは、一般的な「食べる」より具体的な響きを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: 食べる者
  rationale: 定冠詞を伴う現在分詞を、行為によって特徴づけられる一人の者を表す名詞句として訳した。日本語として自然であり、単数の個人的な指示も保つ。
- source_word: τρώγων
  choice: 食べ
  rationale: τρώγωの具体的な「食べる」という意味を明瞭に伝える。語が持ち得る「かむ」「食べ続ける」という含みは脚注に残した。
- source_word: μου τὴν σάρκα
  choice: わたしの肉
  rationale: σάρξを具体的な語のまま訳し、「体」などに言い換えて解釈を狭めない。
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: わたしの血を飲む
  rationale: 並列する現在分詞の構造を保ち、「血」という具体的な表現を弱めずに訳した。
- source_word: ἔχει ζωὴν αἰώνιον
  choice: 永遠の命を持っている
  rationale: 現在形ἔχειが示す現在の所有を「持っている」で表し、ヨハネ文書の定着した表現ζωὴ αἰώνιοςを「永遠の命」とした。
- source_word: κἀγὼ ἀναστήσω αὐτόν
  choice: そしてわたしは、その人を……よみがえらせる
  rationale: καὶ ἐγώの明示された主語と未来形を保った。αὐτόνは先行する単数の「者」を受けるため、自然な日本語の「その人」とした。
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 終わりの日に
  rationale: ヨハネ福音書で繰り返される終末論的表現を、明瞭で定着した日本語として訳した。
theological_decisions:
- issue: 肉を食べ、血を飲むという表現を、聖餐または信仰の比喩として本文中で解釈するか
  choice: 具体的な「肉」「血」「食べる」「飲む」という表現をそのまま保持する
  alternative: 本文で聖餐への明示的言及、または「信じる」という比喩に置き換える
  rationale: ギリシア語本文自体の具体的な表現を保ち、聖餐的理解と比喩的理解のいずれかに翻訳で限定しないため。
- issue: αὐτόνの指示を日本語でどう表すか
  choice: その人
  alternative: 彼
  rationale: ギリシア語では男性単数だが、日本語の「者」を受ける「その人」は単数性と個人的な指示を保ちつつ、文脈上不要な性別の強調を加えない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、イエスの言葉の厳粛さと具体性を保つ文体とした。「いのち」ではなく標準的な漢字表記「命」を用い、全体を自然な現代標準日本語に整えた。
