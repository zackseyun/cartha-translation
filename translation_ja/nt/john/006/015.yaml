id: JHN.6.15
reference: John 6:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν γνοὺς ὅτι μέλλουσιν ἔρχεσθαι καὶ ἁρπάζειν αὐτὸν ἵνα ⸀ποιήσωσιν βασιλέα ἀνεχώρησεν ⸀πάλιν εἰς τὸ ὄρος αὐτὸς μόνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/015.yaml
  text: So Jesus[a], knowing that they were about to come and seize him in order to make him king, withdrew again to the mountain by himself.
translation:
  language: ja
  text: そこでイエスは、人々が今にも来て自分を力ずくで捕らえ[a]、王にしようとしていることを知ると、再び山へ、ただひとりで退かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「無理やり連れて行き」。
    reason: ἁρπάζεινは「力ずくで捕らえる」のほか、文脈上「無理に連れて行く」とも訳し得る。
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語上の展開と帰結を、自然な現代日本語で示す。
- source_word: γνοὺς
  choice: 知り
  rationale: イエスが群衆の企てを認識したことが、続く行動の事情・理由となっている分詞構文を簡潔に表す。
- source_word: μέλλουσιν ἔρχεσθαι
  choice: やって来て……しようとしている
  rationale: 目前に迫った行動と意図の両面を文脈に即して自然に表す。
- source_word: ἁρπάζειν αὐτόν
  choice: 自分を無理やり連れて行き
  rationale: ἁρπάζωの強制的に捕らえる含意を明示しつつ、王に擁立するため群衆がイエスの身柄を押さえようとした場面を自然な日本語にする。別訳の可能性は脚注に残す。
- source_word: ἵνα ποιήσωσιν βασιλέα
  choice: 王にしようとしている
  rationale: ἵναと接続法が示す群衆の目的を、日本語では意図を表す「ようとする」で自然に示す。
- source_word: ἀνεχώρησεν
  choice: 退き
  rationale: 群衆の企てを避けてその場から離れたという含みを保つ。
- source_word: πάλιν
  choice: 再び
  rationale: 先行する山への移動または再度の退避を示す反復の意味を保持する。
- source_word: εἰς τὸ ὄρος
  choice: 山へ
  rationale: 定冠詞付きのὄροςを、文脈上すでに言及された山として過度に特定せず簡潔に訳す。
- source_word: αὐτὸς μόνος
  choice: ただひとりでそこにおられた
  rationale: 主語を強調するαὐτόςと「ひとり」を意味するμόνοςの強調を自然な日本語で表す。「そこにおられた」は日本語の文を整えるための最小限の補足。
theological_decisions:
- issue: 群衆がイエスを王にしようとした行為の性質
  choice: 強制を伴う政治的擁立として「無理やり連れて行き、王にしようとしている」と訳す。
  alternative: 「捕らえて王にしようとしている」
  rationale: ἁρπάζεινは単なる招請ではなく、力ずくで身柄を押さえる意味を持つ。群衆の行為を好意的な戴冠として弱めず、同時に王権の神学的性格を本文以上に説明しない。
translation_notes:
  register: 明瞭で現代的ながら品位ある叙述体。「イエス」への敬意は「おられた」で自然に示し、過剰な敬語は避けた。脚注記号は節末に置き、該当する語句全体の別訳を示す。
