id: JHN.6.14
reference: John 6:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ οὖν ἄνθρωποι ἰδόντες ⸂ὃ ἐποίησεν σημεῖον⸃ ⸀ἔλεγον ὅτι Οὗτός ἐστιν ἀληθῶς ὁ προφήτης ὁ ἐρχόμενος εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/014.yaml
  text: So when the people saw the sign that he had done[a], they were saying[b], “This truly is the Prophet who is coming into the world.”
translation:
  language: ja
  text: そこで、人々はイエスの行ったしるし[a]を見て、「この方こそ、まことに、世に来られるあの預言者[b]だ」と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスの行った奇跡」。ヨハネは一貫して「しるし」（σημεῖον）という語を用い、イエスの働きが奇跡であるだけでなく、その方を示す意味を持つことを強調している。
    reason: lexical_alternative
  - marker: b
    text: 「あの預言者」は、モーセのような預言者として待望されていた人物を指すと思われる（申命記18章15–18節）。
    reason: cross_reference
lexical_decisions:
- source_word: οἱ οὖν ἄνθρωποι
  choice: そこで、人々は
  rationale: οὖνによる物語の展開・帰結を「そこで」で示し、ἄνθρωποιは男性に限定せず、群衆を指す自然な「人々」とした。
- source_word: ἰδόντες
  choice: 見て
  rationale: アオリスト分詞を、主節に先行する行為として自然な接続形で表した。
- source_word: ὃ ἐποίησεν σημεῖον
  choice: イエスの行ったしるし
  rationale: σημεῖονはヨハネ福音書で、単なる奇跡性だけでなくイエスを啓示する働きも含むため「しるし」とした。日本語では文脈上の主語を「イエス」と明示し、関係節を自然な連体修飾にした。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去の継続的・反復的な側面を保ち、単発の発言に限定しない表現とした。
- source_word: ἀληθῶς
  choice: まことに
  rationale: 真実性を強調する語を、明瞭でありながら品位のある現代日本語で表した。
- source_word: ὁ προφήτης
  choice: あの預言者
  rationale: 定冠詞を伴う既知・待望の人物という含みを「あの」で示した。日本語には大文字による称号表示がないため、単なる不定の「一人の預言者」と誤解されにくい形を選んだ。
- source_word: ὁ ἐρχόμενος εἰς τὸν κόσμον
  choice: 世に来られる
  rationale: 冠詞付き現在分詞の表現を保ち、到来が期待される人物を指す句として訳した。「来ることになっている」など、時制や予定性を過度に限定する表現は避けた。
theological_decisions:
- issue: 「ὁ προφήτης」の同定
  choice: 本文では「あの預言者」とし、人物を明示的に同定しない。
  alternative: 「モーセのような預言者」または「一人の預言者」
  rationale: 申命記18章15–18節の、モーセのような預言者への期待を指す可能性は高いが、ギリシア語本文は単に定冠詞付きの「預言者」と述べる。本文ではその含みと曖昧さを保ち、関連は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、群衆の告白には「この方こそ」「まことに」「来られる」を用いて品位を保った。「しるし」はヨハネ特有の神学的含意を保持するため、平仮名表記とした。
