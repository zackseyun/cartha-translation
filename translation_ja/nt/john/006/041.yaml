source:
  edition: SBLGNT
  text: Ἐγόγγυζον οὖν οἱ Ἰουδαῖοι περὶ αὐτοῦ ὅτι εἶπεν· Ἐγώ εἰμι ὁ ἄρτος ὁ καταβὰς ἐκ τοῦ οὐρανοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/041.yaml
  text: So the Jews were grumbling about him because he said[a], “I am the bread that came down from heaven.”
translation:
  language: ja
  text: そこで、ユダヤ人たち[a]は、イエスが「わたしは天から下って来たパンである」と言ったので、イエスについて不平を漏らしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」とも訳せる。文脈によっては「ユダヤ人の指導者たち」を指す場合もある。ヨハネ福音書の「ユダヤ人たち」は、ユダヤ人全体ではなく、イエスに反対する特定の集団を指すことがある。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγόγγυζον
  choice: 不平を言っていた
  rationale: 未完了過去の継続的な側面と、γογγύζωが表す不満を込めたつぶやきの意味を、自然な現代日本語で表す。
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの発言を受けた叙述上・論理上の展開を示す。硬すぎる「それゆえ」より自然である。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: この節自体は指導者層や地域住民に明示的に限定していないため、ギリシア語を直接的に訳す。ただしヨハネ文書では、文脈上イエスに反対する特定の集団を指すことがあり、全ユダヤ人を一括して指すとは限らないことを脚注で明示する。
- source_word: περὶ αὐτοῦ
  choice: イエスのことで
  rationale: περί＋属格の基本義「～について」を自然に表し、「イエスに反対して」のように敵意を過度に補わない。代名詞の連続による曖昧さを避けるため、指示対象を名で示した。
- source_word: ὅτι εἶπεν
  choice: 言ったので
  rationale: ὅτιを不平の理由を導く因果表現として捉え、自然な日本語の理由節にした。
- source_word: Ἐγώ εἰμι
  choice: わたしは…である
  rationale: 強調された一人称を保ち、パンとの自己同定を簡潔かつ荘重に表す。
- source_word: ὁ ἄρτος
  choice: パン
  rationale: 日本語では名詞に定冠詞を対応させられないが、文脈と「～である」という同定構文によって、特定のパンとしての意味を伝える。
- source_word: ὁ καταβὰς ἐκ τοῦ οὐρανοῦ
  choice: 天から下って来た
  rationale: 冠詞付きアオリスト分詞を自然な連体修飾で表し、下降と天に由来することを保持する。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示対象
  choice: 本文では「ユダヤ人たち」と訳し、脚注で文脈上の限定可能性を示す
  alternative: 「ユダヤの人々」または「ユダヤ人の指導者たち」
  rationale: 原文はこの節で指導者やユダヤ地方出身者に明示的に限定していないため、本文では広い語義を保つ。一方、ヨハネの用法を全ユダヤ人への普遍的非難と誤解させないよう、特定の反対者集団を指し得ることを注記する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの引用は「わたし」「～である」として簡潔で dignified な調子を保った。脚注記号[a]は、注の対象である「ユダヤ人たち」について節末に付した。
