  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ, ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν τὸν ἄρτον ἐκ τοῦ οὐρανοῦ τὸν ἀληθινόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/032.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, Moses has not given you the bread from heaven[b], but my Father gives you the true bread from heaven.”
translation:
  language: ja
  text: そこでイエスは彼らに言われた。「まことに、まことに、あなたがたに言います。あなたがたに天からのパンを与えたのはモーセではありません[a]。しかし、わたしの父が天からのまことのパン[b]をあなたがたに与えるのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたに天からのパンを与えたのはモーセではなかった」。ギリシア語では否定辞が「モーセ」の前に置かれ、だれが与えたのかという対比が特に強調されています。
    reason: lexical_alternative
  - marker: b
    text: 「まことのパン」は、「真に実在するパン」「真正なパン」とも訳せます。以前のマナとは異なる、究極的な天からのパンを指す表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けて発言が続くことを、自然な現代日本語で示す。強い論理的帰結に限定しない接続表現とした。
- source_word: Ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: ヨハネ特有の厳粛で強調された導入句。反復を省かず、一般読者にも意味が明瞭な形で訳した。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 原文の語順と荘重さを大きく崩さず、現代日本語として自然な敬体にした。
- source_word: οὐ Μωϋσῆς δέδωκεν ὑμῖν
  choice: あなたがたに天からのパンを与えたのはモーセではありません
  rationale: 否定辞がモーセの前に置かれているため、行為者の対比が明確になる「～のはモーセではありません」という構文を採用した。完了形は日本語で不自然に形式化せず、現在の議論に関わる過去の授与として表した。
- source_word: τὸν ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: 天からのパン
  rationale: ἐκの起点とパンの比喩を簡潔かつ自然に保持した。
- source_word: ἀλλ’ ὁ πατήρ μου δίδωσιν ὑμῖν
  choice: わたしの父が、天からのまことのパンをあなたがたに与えてくださるのです
  rationale: 現在形δίδωσινを非過去形で表し、モーセに結び付けられた過去の出来事との対照を保った。「くださる」は受益関係に即した自然な敬語だが、授与の意味以上の説明は加えていない。
- source_word: ὁ πατήρ μου
  choice: わたしの父
  rationale: イエスの固有の父子関係を説明的に展開せず、そのまま明瞭に示した。
- source_word: τὸν ἀληθινόν
  choice: まことの
  rationale: ἀληθινόςが持つ「真実な」「真正な」「究極的な実体」という幅を残し、ヨハネ文書の神学的響きを過度に限定しない表現とした。
theological_decisions:
- issue: モーセと父の授与行為の対比
  choice: 「与えたのはモーセではありません。わたしの父が…与えてくださるのです」
  alternative: 「モーセが…与えたのではなく、わたしの父が…与えています」
  rationale: 原文では否定がモーセに先行し、行為者の対比が前景化される。日本語の焦点構文でこれを保ちつつ、過去のマナと父の現在的な授与との時制上の対照も示した。
- issue: 「まことのパン」の意味
  choice: 「まことのパン」
  alternative: 「本当のパン」または「真実のパン」
  rationale: 先のマナが虚偽だったという意味に狭めず、それを超える真正・究極のパンというヨハネ的な含みを保持するため、解釈的な言い換えを避けた。
translation_notes:
  register: 明瞭な現代標準日本語の敬体を用い、イエスの厳粛な宣言にふさわしい品位を保った。「まことに、まことに」の反復を維持し、焦点構文によって原文の行為者対比を自然に再現した。脚注記号[a][b]は本文中に配置済み。
