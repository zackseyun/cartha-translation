id: JHN.6.27
reference: John 6:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐργάζεσθε μὴ τὴν βρῶσιν τὴν ἀπολλυμένην ἀλλὰ τὴν βρῶσιν τὴν μένουσαν εἰς ζωὴν αἰώνιον, ἣν ὁ υἱὸς τοῦ ἀνθρώπου ὑμῖν δώσει, τοῦτον γὰρ ὁ πατὴρ ἐσφράγισεν ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/027.yaml
  text: Do not work for the food that perishes[a], but for the food that remains to eternal life, which the Son of Man will give to you[b]; for God the Father has set his seal on him.
translation:
  language: ja
  text: 朽ちてしまう食べ物のために働くのではなく、永遠の命に至る食べ物のために働きなさい[a]。それを、人の子があなたがたに与えます。父である神が、この方に印を押された[b]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「永遠の命のために残る食べ物」。
    reason: μένω は「残る」、εἰς ζωὴν αἰώνιον は永遠の命への目標・結果を表す。本文はその方向性を自然な日本語で表し、別訳は食べ物の持続性をより明示する。
  - marker: b
    text: 直訳「封印した」。ここでは、印を付して認証し、権威を与えることを表す。
    reason: σφραγίζω の印章の比喩を保持しつつ、この文脈での認証・権威付与の含意を説明する。
lexical_decisions:
- source_word: ἐργάζεσθε
  choice: 働きなさい
  rationale: 現在命令形の命令の力を保ちつつ、後続する「食べ物のために」と自然につながる現代日本語とした。
- source_word: βρῶσιν
  choice: 食べ物
  rationale: この文脈では食べる行為ではなく、食物そのものを指すため。
- source_word: ἀπολλυμένην
  choice: 朽ちてしまう
  rationale: 腐敗だけに限定せず、失われ、滅びゆく性質を表す現在分詞の意味を、自然な日本語で示す。
- source_word: μένουσαν εἰς ζωὴν αἰώνιον
  choice: 永遠の命に至るまで残る
  rationale: μένωの「残る」と、εἰςが示し得る到達点・持続の方向を保ち、「朽ちてしまう」との対照を明確にした。結果を強く表す別解は脚注に示した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 定着した称号訳であり、原文の表現と聖書的含意を保つ。
- source_word: ὑμῖν δώσει
  choice: あなたがたに与える
  rationale: 未来の授与と複数の受け手を明示する。日本語では関係節を「それは……ものです」と受けて自然に表した。
- source_word: ἐσφράγισεν
  choice: 証印を押された
  rationale: 封印・認証・権威付与を含む印章の比喩を残しつつ、単なる「封じる」と誤解されにくい表現とした。
- source_word: ὁ πατὴρ ... ὁ θεός
  choice: 父である神
  rationale: 「父」と「神」の同格関係を、自然で明瞭な日本語として表す。
- source_word: τοῦτον
  choice: この方
  rationale: 指示語が直前の「人の子」を指すことを保ち、敬意ある日本語の文体に整えた。
theological_decisions:
- issue: μένουσαν εἰς ζωὴν αἰώνιον の関係
  choice: 永遠の命に至るまで残る
  alternative: 永遠の命に至る食べ物
  rationale: 前者は食べ物の持続性と「朽ちる」との対照を前面に出す。一方、εἰςには目標・結果の含みもあるため、後者を脚注に残して原文の幅を保った。
- issue: ὁ πατὴρ ... ὁ θεός の同格
  choice: 父である神
  alternative: 父、すなわち神
  rationale: 父を神と同定する原文の同格構造を明示しながら、本文として流れのよい表現を選んだ。
- issue: ἐσφράγισεν が人の子について表す意味
  choice: この方に証印を押された
  alternative: この方を認証された
  rationale: 神による認証・権威付与という意味を含む印章の比喩を、解釈語だけに置き換えず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを保った。「人の子」「永遠の命」は定着した聖書語として維持し、「証印」は印章の比喩を残しながら現代の読者にも意味を推測しやすい語として選んだ。
