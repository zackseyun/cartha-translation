  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δέ ἐστιν τὸ θέλημα τοῦ πέμψαντός ⸀με ἵνα πᾶν ὃ δέδωκέν μοι μὴ ἀπολέσω ἐξ αὐτοῦ ἀλλὰ ἀναστήσω ⸀αὐτὸ τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/039.yaml
  text: 'And this is the will of the one who sent me: that I should lose nothing of all that he has given me[a], but should raise it up on the last day.'
translation:
  language: ja
  text: わたしを遣わした方のみこころは、わたしに与えてくださったすべてのもののうち、何一つも失わず、それを終わりの日によみがえらせることである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 人を明示して、「わたしに与えてくださった人をだれ一人失わず、その人々を終わりの日によみがえらせる」とも訳せる。ギリシア語は字義的には「与えてくださったすべてのもの……それ」という集合的な中性単数表現を用いている。
    reason: alternative_reading
lexical_decisions:
- source_word: θέλημα
  choice: みこころ
  rationale: 神の意志・意向を表すヨハネ文書の文脈に合い、現代日本語の聖書文体として自然で尊厳がある。
- source_word: τοῦ πέμψαντός με
  choice: わたしを遣わした方
  rationale: 実体詞的分詞の動作と関係性を保ちつつ、自然な日本語にした。
- source_word: ἵνα
  choice: 〜ことである
  rationale: 直前の「みこころ」の内容を示す構文として自然に表し、目的の含みも失わない。
- source_word: πᾶν ὃ δέδωκέν μοι
  choice: わたしに与えてくださったもの
  rationale: 中性単数の集合的表現を「もの」で保持し、人々を指すという解釈を本文で確定しない。完了形の継続的結果は文脈上この表現に含ませた。
- source_word: μὴ ἀπολέσω ἐξ αὐτοῦ
  choice: わたしが何一つ失わず
  rationale: ἐξ αὐτοῦの部分的意味を「何一つ」に反映し、ここでのἀπόλλυμιを自然に「失う」と訳した。
- source_word: ἀναστήσω αὐτὸ
  choice: それを…よみがえらせる
  rationale: 終末的な復活を明確にしつつ、中性単数代名詞による集合的表現を「それ」で保った。
- source_word: τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 終わりの日に
  rationale: ヨハネ福音書の終末論的表現として明瞭で、一般読者にも理解しやすい。
theological_decisions:
- issue: 集合的な中性単数を、人を明示する複数表現にするか
  choice: 「与えてくださったもの…それ」と中性単数に対応する集合表現を保持する
  alternative: 「与えてくださった人をだれ一人…その人々を」
  rationale: 原文のπᾶν、ὃ、αὐτόはいずれも中性単数である。文脈上は人々を指し得るが、本文ではその文法的な集合性と曖昧さを保ち、個人化した読みは脚注に示す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神を指す「方」と「みこころ」によって簡潔で尊厳ある調子を保った。「よみがえらせる」は一般読者に分かりやすく、終末的復活を自然に表す。
