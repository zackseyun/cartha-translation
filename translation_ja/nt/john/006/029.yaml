id: JHN.6.29
reference: John 6:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀ὁ Ἰησοῦς καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ ἔργον τοῦ θεοῦ ἵνα ⸀πιστεύητε εἰς ὃν ἀπέστειλεν ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/029.yaml
  text: 'Jesus answered and said to them[b][a], “This is the work of God: that you believe in the one whom he has sent.”'
translation:
  language: ja
  text: イエスは彼らに答えて言われた。「神のわざとは[a]、神が遣わした方を信じること[b]である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神が求めるわざ」または「神が行うわざ」。ギリシア語の「神のわざ」は複数の意味に取れるため、本文ではその曖昧さを残している。
    reason: alternative_reading
  - marker: b
    text: 別訳「神が遣わした方に信頼すること」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: 答えて言われた
  rationale: ギリシア語の二つの動詞を反映しつつ、日本語の対話表現として自然で格調のある形にした。
- source_word: Τοῦτό ἐστιν
  choice: …とは…である
  rationale: 指示内容を明示する日本語の構文を用い、イエスの答えの焦点を保った。
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: 神のわざ
  rationale: 属格の関係を本文で限定せず、神が求めるわざとも神が行うわざとも取り得る原文の含みを可能な限り保った。
- source_word: ἵνα πιστεύητε
  choice: 信じること
  rationale: ここではἵνα節が『神のわざ』の内容を示すため、現代日本語で自然な名詞節として訳した。現在接続法を不自然に様態化せず、一般的な要求・内容として表した。
- source_word: εἰς ὃν
  choice: …方を
  rationale: πιστεύω εἰςを日本語で自然な『…を信じる』とし、関係代名詞の人格的な対象を『方』で示した。
- source_word: ἀπέστειλεν ἐκεῖνος
  choice: 神が遣わした
  rationale: ἐκεῖνοςが直前の『神』を指すことを日本語では明示し、アオリストを簡潔な過去形で表した。
theological_decisions:
- issue: 「神のわざ」（τὸ ἔργον τοῦ θεοῦ）における属格の意味
  choice: 本文では「神のわざ」として曖昧さを残す。
  alternative: 「神が求めるわざ」または「神が行うわざ」
  rationale: 文脈上、人が行うべきことへの問いに対する答えとも、信じることを生じさせる神の働きとも理解し得る。本文で一方に決めず、原文の神学的緊張を保った。
- issue: πιστεύητε εἰςの訳語
  choice: …を信じる
  alternative: …に信頼する
  rationale: ヨハネ文書における標準的で理解しやすい訳を採用した。ただし、単なる事実認定ではなく人格的な信頼を含み得るため、別訳を脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言には簡潔で格調のある「である」調を採用した。「わざ」は日常語の「仕事」よりも広い意味を持ち、原文のἔργονと属格の含みを保つため、ひらがな表記とした。
