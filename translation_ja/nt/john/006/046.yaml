id: JHN.6.46
reference: John 6:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐχ ὅτι τὸν πατέρα ⸂ἑώρακέν τις⸃ εἰ μὴ ὁ ὢν παρὰ τοῦ θεοῦ, οὗτος ἑώρακεν τὸν πατέρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/046.yaml
  text: Not that anyone has seen the Father[a], except the one who is from God; he has seen the Father.
translation:
  language: ja
  text: だれかが父を見た、ということではない。神から出た方[a]だけが、父を見たのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神のもとにおられる方」または「神のもとから来られた方」とも訳せる。ギリシア語の表現には、神から出ているという由来だけでなく、神のそばにいるという人格的な近さの含みもあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὅτι
  choice: というのではない
  rationale: 直前の発言を否定するのではなく、その意味を限定して誤解を正す表現として、現代日本語で自然な形にした。
- source_word: τὸν πατέρα
  choice: 父
  rationale: ヨハネ福音書における神への呼称を、簡潔で尊厳ある日本語として訳した。
- source_word: ἑώρακέν τις
  choice: だれかが…見た
  rationale: 否定文中の不定代名詞 τις を「だれか」とし、完了形は文脈上、過去の出来事だけでなく現在にも有効な認識を表すが、日本語では自然な「見た」で表した。
- source_word: εἰ μὴ
  choice: だけが
  rationale: 条件ではなく唯一の例外を示すため、日本語では「〜だけが」と明確に表した。
- source_word: ὁ ὢν παρὰ τοῦ θεοῦ
  choice: 神のもとから来た方
  rationale: ὁ ὢν の継続的な関係性と、παρά＋属格が示し得る起源・近接性を自然な日本語で併せて表した。「来た」は文脈に即した補足であり、脚注で別のニュアンスを保持した。
- source_word: οὗτος
  choice: （その方）だけが
  rationale: 直前に示された人物を強く指し返す機能を、日本語の限定構文「だけが」によって表した。
- source_word: ἑώρακεν τὸν πατέρα
  choice: 父を見たのである
  rationale: 完了形の確定的・持続的意義を、説明的な結び「のである」で自然に強調した。
theological_decisions:
- issue: παρὰ τοῦ θεοῦ が示す御子と神との関係
  choice: 神のもとから来た方
  alternative: 神のもとにいる方／神のそばから来た方
  rationale: 神に由来することを本文で明確にしつつ、神の御前における人格的近接という含みも「もと」によって残した。存在論的関係や派遣の意味を必要以上に限定せず、可能な別のニュアンスを脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「方」「のである」によって尊厳と説明的な調子を保った。原文の二度の完了形は、日本語で不自然な時制表現を避けて「見た」とし、その確定性を文全体の構造で伝えた。
