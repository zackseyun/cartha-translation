  text: οὗτός ἐστιν ὁ ἄρτος ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων ἵνα τις ἐξ αὐτοῦ φάγῃ καὶ μὴ ἀποθάνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/050.yaml
  text: This is the bread that comes down from heaven[b][a], so that anyone may eat from it and not die.
translation:
  language: ja
  text: これは、だれでもそれを食べて死なない[b]ように、天から降って来るパン[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これは、天から降りつつあるパンである。」
    reason: 現在分詞 καταβαίνων の進行的な響きをより明示する訳。本文は自然な日本語を優先しつつ、現在的な性格を保っている。
  - marker: b
    text: 「死なない」が、究極的な死、霊的な死、終末における滅びのいずれを特に指すかは、本文では限定されていない。
    reason: 本文の広い表現を保ち、文脈から生じる複数の理解を注記するため。
lexical_decisions:
- source_word: οὗτός
  choice: これは
  rationale: 指示代名詞の直接性を保ち、イエスが今示しているパンを自然な日本語で受ける表現とした。
- source_word: ἄρτος
  choice: パン
  rationale: 通常の語義をそのまま採用し、この章における文字どおりの意味と比喩的な意味の重なりを保った。
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβαίνων
  choice: 天から降って来る
  rationale: 現在分詞の継続的・特徴づける働きを、日本語の連体修飾で自然に表した。「降って来た」として完了した過去に限定しない。
- source_word: οὐρανός
  choice: 天
  rationale: 文脈上、物理的な空ではなく神の領域を指すため、聖書日本語として自然で簡潔な「天」とした。
- source_word: ἵνα
  choice: ためである
  rationale: 目的・結果を示す節の力を保ちつつ、前文を受ける自然で格調ある日本語とした。
- source_word: τις
  choice: 人
  rationale: 不定の一般的な人を表す。日本語では「それを食べる人」とすることで、特定の人物に限定しない開かれた意味が自然に伝わる。
- source_word: ἐξ αὐτοῦ φάγῃ
  choice: それを食べる
  rationale: ギリシア語では「それから食べる」だが、日本語ではパンを目的語として「それを食べる」とするのが自然であり、意味を変えない。
- source_word: μὴ ἀποθάνῃ
  choice: 死なない
  rationale: 動詞の基本義を保ち、「滅びない」などの解釈的な限定を避けた。
theological_decisions:
- issue: 「死なない」が指す死の性質
  choice: 「死なない」とだけ訳し、死の種類を限定しない。
  alternative: 「霊的に死なない」または「永遠に滅びない」
  rationale: 命のパンの文脈は究極的・霊的な含意を持つが、この節自体は死の性質を明示しないため、ヨハネ文書にある神学的な広がりと緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「パン」「天」「死なない」という中心語を解釈的に言い換えず、簡潔で格調ある語調に整えた。二文に分け、目的節を読み取りやすくした。
