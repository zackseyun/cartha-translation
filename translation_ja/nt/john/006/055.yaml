  text: ἡ γὰρ σάρξ μου ⸀ἀληθής ἐστι βρῶσις, καὶ τὸ αἷμά μου ⸁ἀληθής ἐστι πόσις.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/055.yaml
  text: For my flesh is true food[a], and my blood is true drink.
translation:
  language: ja
  text: というのも、わたしの肉はまことの食べ物であり、わたしの血はまことの飲み物だからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「本当の食べ物」「本当の飲み物」。
    reason: ἀληθής は「まことの」のほか、「本当の」「真正な」とも訳し得るため。
lexical_decisions:
- source_word: γὰρ
  choice: だからです
  rationale: 直前の発言を根拠づける説明的な接続を、自然な現代日本語で示した。
- source_word: σάρξ
  choice: 肉
  rationale: 「血」との並行関係を保ち、解釈的な「体」ではなく原語を直接反映した。
- source_word: ἀληθής
  choice: まことの
  rationale: ヨハネ文書における語の重みを保ちつつ、「本物の」として特定の神学的理解に傾けることを避けた。
- source_word: βρῶσις
  choice: 食べ物
  rationale: 行為としての「食べること」も語義上可能だが、述語構文と πόσις との並行から、食べられるものを指すと判断した。
- source_word: αἷμα
  choice: 血
  rationale: 「肉」との対句を保ち、婉曲化せず字義どおりに訳した。
- source_word: πόσις
  choice: 飲み物
  rationale: 行為としての「飲むこと」も可能だが、βρῶσις との並行から、飲まれるものを指す自然な表現とした。
theological_decisions:
- issue: 聖餐をめぐる文脈で ἀληθής をどう訳すか
  choice: まことの
  alternative: 本当の／本物の
  rationale: 「まことの」は原語の「真実な、真正な」という幅を保ち、イエスの肉と血についての実在性や聖餐上の含意を翻訳だけで確定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」を用い、原文の肉／血、食べ物／飲み物という並行を簡潔に再現した。脚注記号は節末に置き、二度現れる ἀληθής の双方に関わる別訳であることを脚注本文で明示した。
