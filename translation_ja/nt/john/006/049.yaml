base_translation:
  language: en
  yaml_path: translation/nt/john/006/049.yaml
  text: Your fathers ate the manna in the wilderness[a], and they died.
translation:
  language: ja
  text: あなたがたの父祖[a]は荒野でマナを食べ、そして死んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたがたの先祖」。ギリシア語は直訳すると「あなたがたの父たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ὑμῶν
  choice: あなたがたの父祖
  rationale: πατέρεςは字義的には「父たち」だが、ここでは荒野の時代のイスラエルの先祖を指す。「父祖」は男性形の歴史的・代表的な響きを保ちながら、現代日本語で自然に祖先世代を表す。
- source_word: ἔφαγον
  choice: 食べた
  rationale: ἐσθίωのアオリスト直説法であり、過去の出来事として簡潔に表した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: 出エジプト後のイスラエルがいた場所を指す聖書的な語感を保ち、「砂漠」より文脈に適する。日本語では場所を示す助詞「で」が自然である。
- source_word: τὸ μάννα
  choice: マナ
  rationale: 荒野で与えられた既知の食物を指す。日本語では固有の名称として「マナ」だけで定性が明らかなため、ギリシア語の冠詞を別語で表さない。
- source_word: καὶ ἀπέθανον
  choice: が、死んだ
  rationale: καίは単なる継起にも読めるが、直前・直後の文脈ではマナを食べてもなお死んだという対比が明白であるため、日本語では「が」で自然に表した。ἀπέθανονは実際の死を指し、主語は前半と同じなので省略した。
theological_decisions:
- issue: 荒野のイスラエル世代への言及
  choice: あなたがたの父祖
  alternative: あなたがたの先祖／あなたがたの父たち
  rationale: 「父祖」は、聞き手と荒野の世代との歴史的連続性、およびπατέρεςの男性形を保つ。「先祖」も意味上可能だが原語の形を弱め、「父たち」は現代日本語では実父たちと誤解されやすい。
- issue: マナを食べたことと死との関係
  choice: 食べたが、死んだ
  alternative: 食べ、そして死んだ
  rationale: καί自体は通常「そして」だが、この談話では、荒野のマナが死を免れさせなかったことと、永遠に生かすパンとの対照が形成されている。「が」はその文脈的緊張を自然な日本語で示しつつ、死の原因がマナだったとは含意しない。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。聖書的な歴史用語として「父祖」「荒野」「マナ」を用い、荘重さを保ちながら古風すぎる表現は避けた。
