source:
  edition: SBLGNT
  text: ἀλλὰ εἰσὶν ἐξ ὑμῶν τινες οἳ οὐ πιστεύουσιν. ᾔδει γὰρ ἐξ ἀρχῆς ὁ Ἰησοῦς τίνες εἰσὶν οἱ μὴ πιστεύοντες καὶ τίς ἐστιν ὁ παραδώσων αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/064.yaml
  text: But there are some among you who do not believe[a]. For Jesus knew from the beginning who those were who did not believe[b], and who it was who would betray him.
translation:
  language: ja
  text: 「しかし、あなたがたの中には信じない者たちがいる。」というのも、イエスは初めから、信じない者たちがだれなのか、また、イエスを裏切ることになる者[a]がだれなのかを知っておられたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「イエスを引き渡すことになる者」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の発言との対照を明確に示す、自然な逆接表現。
- source_word: ἐξ ὑμῶν τινες
  choice: あなたがたの中には…者たちがいる
  rationale: 聞き手の集団に属する不特定の複数の人を表す。直訳的な「あなたがたから」より、日本語として自然に所属関係を示す。
- source_word: οἳ οὐ πιστεύουσιν / οἱ μὴ πιστεύοντες
  choice: 信じない者たち
  rationale: 現在形および現在分詞が示す継続的・特徴的な不信を、簡潔で自然な日本語で表す。
- source_word: ᾔδει
  choice: 知っておられた
  rationale: 過去に継続していた認識状態を表す。主語がイエスであるため、現代日本語の聖書文体に適した敬意表現を用いる。
- source_word: ἐξ ἀρχῆς
  choice: 初めから
  rationale: 何の『初め』かを本文以上に限定せず、時間的意味と原文の曖昧さを保つ。
- source_word: παραδώσων
  choice: 裏切ることになる者
  rationale: 未来分詞の時間的含意を「ことになる」で示しつつ、ヨハネ福音書の文脈における敵への引き渡しという背信行為を「裏切る」で自然に表す。より字義的な訳は脚注に残す。
- source_word: αὐτόν
  choice: ご自分を
  rationale: 指示対象が主語のイエス自身であることを、日本語で曖昧にならないよう再帰表現で示す。
theological_decisions:
- issue: πιστεύωを弟子たちのイエスへの応答という文脈でどう訳すか
  choice: 信じる
  alternative: 信頼する
  rationale: 「信じる」は認識的側面と人格的信頼の双方を排除せず、ヨハネ福音書における語の広がりを保つ。「信頼する」だけに狭めない。
- issue: ユダを指すπαραδίδωμιの訳
  choice: 裏切る
  alternative: 引き渡す
  rationale: 語そのものには「引き渡す」という広い意味があるが、この物語ではイエスを敵に渡す背信行為を指す。「裏切る」は文脈上の意味を自然に伝え、字義的な選択肢は脚注で明示する。
translation_notes:
  register: 明快な現代標準日本語を用い、直接話法と語り手の説明を区別した。「というのも…からである」によりγάρの説明的関係を明示しつつ、全体を品位ある自然な文体に整えた。
