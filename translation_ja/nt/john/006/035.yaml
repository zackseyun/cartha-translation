source:
  edition: SBLGNT
  text: ⸀Εἶπεν αὐτοῖς ὁ Ἰησοῦς· Ἐγώ εἰμι ὁ ἄρτος τῆς ζωῆς· ὁ ἐρχόμενος πρὸς ἐμὲ οὐ μὴ πεινάσῃ, καὶ ὁ πιστεύων εἰς ⸀ἐμὲ οὐ μὴ ⸀διψήσει πώποτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/035.yaml
  text: Jesus said to them, “I am the bread of life; the one who comes to me will never hunger, and the one who believes in me will never thirst again.”
translation:
  language: ja
  text: イエスは彼らに言われた。「わたしが命のパンです。わたしのもとに来る者は決して飢えることがなく、わたしを信じる者は決して渇くこともありません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: 彼らに言われた
  rationale: 物語の導入として自然に訳し、イエスへの敬意を現代日本語の尊敬表現で示した。
- source_word: Ἐγώ εἰμι
  choice: わたしが…です
  rationale: 明示された主語Ἐγώの強調を助詞「が」で自然に表し、自己同定の直接性を保った。
- source_word: ὁ ἄρτος τῆς ζωῆς
  choice: 命のパン
  rationale: 属格表現と比喩を解釈的に言い換えず、明瞭で定着した日本語として保持した。
- source_word: ὁ ἐρχόμενος πρὸς ἐμέ
  choice: わたしのもとに来る者
  rationale: 名詞化された現在分詞の一般的・継続的な意味を自然に表した。「もとに」は人物への接近を明瞭にする。
- source_word: οὐ μὴ πεινάσῃ
  choice: 決して飢えることがなく
  rationale: οὐ μήの強い否定を「決して」で表した。後続節との並行性も保っている。
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: わたしを信じる者
  rationale: ヨハネ文書におけるπιστεύω εἰςの関係的な信頼を含みつつ、日本語で最も自然かつ透明な「信じる」を用いた。
- source_word: οὐ μὴ διψήσει πώποτε
  choice: いつまでも決して渇くことがありません
  rationale: οὐ μήの強い否定とπώποτεの「いつの時にも」の意味を併せて示し、「再び」という原文にない意味を加えなかった。
theological_decisions:
- issue: Ἐγώ εἰμιによるイエスの自己同定
  choice: わたしが…です
  alternative: このわたしこそ…です
  rationale: 原文の強調は助詞「が」で保ちつつ、神学的含意を説明的な表現で過度に確定しないようにした。
- issue: πιστεύων εἰς ἐμέの訳
  choice: わたしを信じる者
  alternative: わたしに信頼する者
  rationale: 信仰と信頼の両面を排除しない、ヨハネ文書で標準的かつ自然な訳を採用した。
- issue: 飢えと渇きの比喩
  choice: 比喩をそのまま保持
  alternative: 霊的に満たされると説明する
  rationale: 何に対する飢えや渇きかを訳文で限定せず、原文の比喩と神学的広がりを保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「言われた」「ありません」によって敬意を示しつつ、古風な文語表現は避けた。原文の二つの節の並行構造と強い否定を保った。
