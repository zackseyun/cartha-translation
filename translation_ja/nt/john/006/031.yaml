id: JHN.6.31
reference: John 6:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν τὸ μάννα ἔφαγον ἐν τῇ ἐρήμῳ, καθώς ἐστιν γεγραμμένον· Ἄρτον ἐκ τοῦ οὐρανοῦ ἔδωκεν αὐτοῖς φαγεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/031.yaml
  text: 'Our fathers ate the manna in the wilderness[b][a], just as it is written: ‘He gave them bread from heaven to eat.’'
translation:
  language: ja
  text: 私たちの父祖は荒野でマナを食べました。[a]『天からのパンを彼らに食べるために与えた』と書かれているとおりです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「荒野」は「荒れ野」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: 私たちの父祖
  rationale: 直訳的な「私たちの父たち」では現代日本語で実父を指すように響きやすいため、イスラエルの先祖を指す文脈に合う「父祖」とした。原文の男性形と歴史的な連続性も保つ。
- source_word: τὸ μάννα
  choice: マナ
  rationale: 出エジプトの荒野で与えられた食物を指す、日本語聖書で定着した音訳を用いた。
- source_word: ἔφαγον
  choice: 食べました
  rationale: アオリスト直説法の単純な過去の出来事を、発言に自然な丁寧体で表した。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: 出エジプト伝承とのつながりを保ちつつ、ἔρημος の無人で荒涼とした地域という意味を自然に表す。
- source_word: καθώς ἐστιν γεγραμμένον
  choice: と書かれているとおりです
  rationale: 聖書引用を導入する定型句として、καθώς と完了受動分詞が示す現に書かれている証言を自然な日本語で表した。
- source_word: Ἄρτον ἐκ τοῦ οὐρανοῦ
  choice: 天からのパン
  rationale: 供給源が天であることを簡潔に示し、後続するヨハネ福音書の「パン」をめぐる語彙的連続性を保つ。
- source_word: ἔδωκεν αὐτοῖς φαγεῖν
  choice: 彼らに与えて食べさせた
  rationale: δίδωμι＋与格＋不定詞を自然な日本語にし、パンを与えた目的・結果が食べることである点を保った。主語は引用文の文脈上暗黙のままにした。
theological_decisions:
- issue: マナについての引用に、後のキリスト論的解釈を先取りして入れるか
  choice: 歴史的・聖書的主張として「天からのパン」と訳し、解釈的な補足や特別な表記を加えない
  alternative: イエスが真のパンであることを先取りする語句を補う
  rationale: ここでは群衆が荒野のマナについて聖書を引用している。より深いキリスト論的意味は後続の対話から展開させるべきで、この発言自体に読み込まない。
- issue: 引用文のἔδωκενの主語を明示するか
  choice: 原文どおり主語を補わず、「与えて食べさせた」とする
  alternative: 「神は」または「彼は」を補う
  rationale: ギリシア語では三人称単数の主語が明示されず、引用元の伝承上は神を指すが、この節だけでは直前の明示的先行詞がない。日本語でも省略が自然であり、原文の含みを保てる。
translation_notes:
  register: 群衆がイエスに語る場面として丁寧体を用いた。聖書引用は現代の読者に明快でありながら、荘重さを失わない簡潔な表現とした。「父祖」はやや文語的だが、実父ではなくイスラエルの歴代の先祖を指す語として正確で定着している。
