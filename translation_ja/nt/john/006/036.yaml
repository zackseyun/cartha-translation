  text: ἀλλ’ εἶπον ὑμῖν ὅτι καὶ ἑωράκατέ με καὶ οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/036.yaml
  text: But I told you that you have even seen me[a], and yet you do not believe.
translation:
  language: ja
  text: しかし、わたしはあなたがたに、あなたがたはわたしを見たのに、それでも信じないと言いました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 前節の内容との明確な対比を、簡潔で自然な逆接として示す。
- source_word: εἶπον ὑμῖν
  choice: あなたがたに言いました
  rationale: 過去になされた発言を指すアオリストと、複数の聞き手への間接目的語を自然な日本語で表す。
- source_word: ὅτι
  choice: と
  rationale: イエスが語った内容を引用内容として導く日本語の補文標識。
- source_word: καὶ ἑωράκατέ με
  choice: わたしを見たのに
  rationale: 第一のκαίが帯びる強意と、見たにもかかわらず信じないという文脈上の意外性を、自然な譲歩表現で示す。ἑωράκατέの完了形は、見た事実が現在の状況に関わることを含む。
- source_word: καὶ οὐ πιστεύετε
  choice: それでも信じない
  rationale: 第二のκαίによる連結と対照を「それでも」で明示し、現在形が示す継続中の不信を自然に表す。πιστεύωはヨハネ文書で基本的に「信じる」とする。
theological_decisions:
- issue: καὶ ἑωράκατέ με の第一の καί の力
  choice: 「わたしを見たのに」と譲歩的に表す
  alternative: 「実際にわたしを見て、それでも」または「わたしをも見たが」
  rationale: καίを機械的に「そして／も」とせず、見たことと信じないことの修辞的な対照を日本語で自然に保つ。特定の教理的解釈を付加するものではない。
- issue: πιστεύετε の訳語
  choice: 信じない
  alternative: 信頼しない／信仰を持たない
  rationale: ヨハネ福音書におけるπιστεύωの直接的で定着した対応語を用い、知的同意だけ、または特定の信仰概念だけに意味を狭めない。
translation_notes:
  register: 現代標準日本語。イエスの発言として明快で品位ある語調を保ち、複数の聞き手は「あなたがた」、一人称は「わたし」とした。原文の語順より日本語として自然な引用構文を優先した。
