  to: そこで群衆は、イエスもその弟子たちもそこにいないのを見て、自分たちも小舟に乗り込み、イエスを捜してカファルナウムへ行った。
  rationale: 知覚動詞εἶδενを「見て」と直接に訳し、αὐτοὶの強調は不必要な「独力」の含みを避けて「自分たちも」とした。また、現在分詞ζητοῦντεςは日本語の目的的な連結として自然な「捜して」で表した。意味内容、地名表記、および小舟という指小的ニュアンスは維持している。
