source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδεν ὁ ὄχλος ὅτι Ἰησοῦς οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ, ἐνέβησαν αὐτοὶ εἰς τὰ ⸀πλοιάρια καὶ ἦλθον εἰς Καφαρναοὺμ ζητοῦντες τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/024.yaml
  text: So when the crowd saw that Jesus was not there[a], nor his disciples, they themselves got into the boats and came to Capernaum, looking for Jesus.
translation:
  language: ja
  text: そこで群衆は、イエスもその弟子たちもそこにいないのを見て、自分たちも小舟に乗り込み、イエスを捜してカファルナウムへ行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτε οὖν
  choice: そこで……すると
  rationale: 時間的な展開と、前の出来事を受けた物語上のつながりの両方を、自然な現代日本語で表した。
- source_word: ὁ ὄχλος
  choice: 群衆
  rationale: その場に集まっていた人々の集団を指す一般的で明確な訳語。
- source_word: εἶδεν
  choice: 知る
  rationale: ここでは目で見た結果として不在を認めたことを表す。日本語では「いないことを見た」より「いないことを知る」が自然であり、「悟る」ほど強い推論は含ませない。
- source_word: οὐκ ἔστιν ἐκεῖ οὐδὲ οἱ μαθηταὶ αὐτοῦ
  choice: イエスも弟子たちもそこにいない
  rationale: 二重の不在を「も……も」で簡潔に示し、ギリシア語の現在形は日本語の従属節で自然な非過去形として保った。
- source_word: ἐνέβησαν αὐτοὶ
  choice: 自分たちで……乗り込み
  rationale: ἐμβαίνωの乗船の意味を「乗り込み」で表し、強意のαὐτοίを「自分たちで」によって保持した。
- source_word: τὰ πλοιάρια
  choice: 小舟
  rationale: πλοιάριονの指小形を日本語で自然に表せるため、本文で「小舟」とした。文脈上、実際に小型の舟を指す用法として無理がない。
- source_word: ἦλθον εἰς Καφαρναούμ
  choice: カファルナウムへ行った
  rationale: 日本語の物語視点では、群衆が現在地から目的地へ移動することを「行った」とするのが自然。到達先は「へ」で示した。
- source_word: ζητοῦντες τὸν Ἰησοῦν
  choice: イエスを捜しながら
  rationale: ζητέωの具体的な捜索の意味を表し、「求める」が帯び得る宗教的含意を避けた。分詞の同時的・目的的な関係は「ながら」で保った。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、物語文として自然でありながら品位を保った。「カファルナウム」は一般的な聖書地名表記を採用した。原文上説明を要する重大な異読や神学的曖昧さはなく、πλοιάριαの指小的意味は本文の「小舟」で直接反映したため脚注は設けない。
