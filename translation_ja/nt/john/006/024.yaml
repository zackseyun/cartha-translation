    issue: εἶδενを「知る」としている。
    rationale: 「知る」は見た結果としての認識を表せるが、原文の知覚動詞をやや解釈的にする。「いないのを見て」がより直接的で自然である。
  - severity: low
    issue: αὐτοὶを「自分たちで」としている。
    rationale: 日本語の「自分たちで」には手段・独力の含意が生じ得る。「自分たちも」は、この場面での群衆側の行為を際立たせる強調としてより無理がない。
