id: JHN.6.1
reference: John 6:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἀπῆλθεν ὁ Ἰησοῦς πέραν τῆς θαλάσσης τῆς Γαλιλαίας τῆς Τιβεριάδος.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/001.yaml
  text: After these things[a], Jesus went away to the other side of the Sea of Galilee[b], which is the Sea of Tiberias.
translation:
  language: ja
  text: その後、イエスはガリラヤ湖、すなわちティベリア湖の向こう岸へ渡られた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ガリラヤ湖」と「ティベリア湖」は、同じ湖を指す二つの呼び名です。
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: その後
  rationale: 直訳は「これらのことの後」だが、ヨハネの物語を進める移行句として、複数形の指示内容を過度に特定せず自然な現代日本語にした。
- source_word: ἀπῆλθεν
  choice: 渡られた
  rationale: ἀπέρχομαι自体は「立ち去る／行く」だが、πέρανと湖を目的地とする文脈を合わせ、日本語では対岸への移動を自然に表す「渡る」とした。主語イエスへの穏当な敬意として尊敬表現を用いた。
- source_word: πέραν τῆς θαλάσσης
  choice: 湖の向こう岸へ
  rationale: 水域を越えて反対側へ移動する意味を明瞭にし、自然な日本語にした。
- source_word: τῆς θαλάσσης τῆς Γαλιλαίας
  choice: ガリラヤ湖
  rationale: θάλασσαは「海」も意味するが、対象は内陸湖であり、日本語で定着した地名「ガリラヤ湖」を採用した。
- source_word: τῆς Τιβεριάδος
  choice: すなわちティベリア湖
  rationale: 同じ水域に付された第二の名称として理解できるよう、ギリシア語の同格的な属格の連なりを「すなわち」で明示した。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準日本語としつつ、聖書本文にふさわしい落ち着いた文体を採用した。「その後」は逐語的な「これらのことの後」より自然であり、物語上の時間的移行を保持する。
