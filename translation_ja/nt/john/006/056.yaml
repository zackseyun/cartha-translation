id: JHN.6.56
reference: John 6:56
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ τρώγων μου τὴν σάρκα καὶ πίνων μου τὸ αἷμα ἐν ἐμοὶ μένει κἀγὼ ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/056.yaml
  text: The one who eats my flesh and drinks my blood remains in me[b][a], and I in him.
translation:
  language: ja
  text: わたしの肉を食べ[a]、わたしの血を飲む者は、わたしのうちにとどまり[b]、わたしもその人のうちにとどまる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食べる」に当たるギリシア語には、「かんで食べる」という、より生々しい響きがある。
    reason: lexical_alternative
  - marker: b
    text: 「とどまる」は、「そこに居続ける」「住み続ける」という意味にも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρώγων
  choice: 食べる者
  rationale: 定冠詞を伴う現在分詞を名詞的に捉え、その行為をする人を表す。「者」により原文の単数形を保ち、現在分詞の継続的・特徴的な含みは文脈に委ねた。
- source_word: τρώγων
  choice: 食べ
  rationale: τρώγωには「かんで食べる」という生々しい響きがあり得るが、本文では明瞭で自然な「食べる」とし、その語感は脚注に残した。
- source_word: μου τὴν σάρκα
  choice: わたしの肉
  rationale: σάρξの具体的で衝撃的な表現を保ち、「体」などに言い換えなかった。
- source_word: καὶ πίνων μου τὸ αἷμα
  choice: わたしの血を飲む
  rationale: 並列する現在分詞を率直に訳し、犠牲を思わせる原文の具体的なイメージを保った。
- source_word: ἐν ἐμοὶ μένει
  choice: わたしのうちにとどまり
  rationale: ヨハネ文書で重要なμένωを、現代日本語として自然でありながら持続性を示す「とどまる」とした。
- source_word: κἀγὼ ἐν αὐτῷ
  choice: わたしもその人のうちにとどまる
  rationale: 原文では動詞が省略されているが、日本語では意味上補って反復することで相互性を明瞭かつ自然に表した。κἀγώの「わたしも」を保った。
- source_word: αὐτῷ
  choice: その人
  rationale: 先行する「食べる者」を自然に受ける現代日本語とし、性別を不必要に限定しなかった。
theological_decisions:
- issue: 肉を食べ、血を飲むことの聖餐的解釈と比喩的解釈
  choice: 原文の具体的な表現をそのまま保ち、解釈を本文に加えない。
  alternative: 聖餐を明示する、または「信じる」ことだと明示する。
  rationale: この表現の解釈には教派間の議論があるが、この節のギリシア語自体はそれを明示的に決着させていないため、神学的な緊張を保った。
- issue: キリストと信じる者との相互内在
  choice: μένειを「うちにとどまる」と訳す。
  alternative: 「一つに結ばれている」「宿っている」などと意訳する。
  rationale: 相互内在の表現を保ちつつ、後代の特定の教理体系に狭めないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言が持つ厳粛さと具体的な衝撃を保った。「肉」「血」「うちにとどまる」は解釈的に薄めず、宗派固有の説明も加えていない。
