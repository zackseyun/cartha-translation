  yaml_path: translation/nt/john/006/007.yaml
  text: Philip answered him, “Two hundred denarii worth of bread is not enough for them, so that each one may receive a little.”
translation:
  language: ja
  text: フィリポはイエスに答えた。「二百デナリ分のパンでは、皆が少しずつ受け取るには足りません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Φίλιππος
  choice: フィリポはイエスに答えた
  rationale: 日本語では代名詞の「彼に」より、文脈上の指示対象であるイエスを明示するほうが自然である。ἀποκρίνομαι は簡潔に「答えた」とした。
- source_word: Διακοσίων δηναρίων ἄρτοι
  choice: 二百デナリ分のパン
  rationale: 属格はパンの価格・相当額を示す。「デナリ」は当時の貨幣単位として保持し、具体的な現代通貨への換算は避けた。
- source_word: οὐκ ἀρκοῦσιν αὐτοῖς
  choice: では足りません
  rationale: 複数のパンが群衆に十分ではないという意味を、自然な日本語で表した。
- source_word: ἵνα ἕκαστος βραχύ τι λάβῃ
  choice: めいめいが少しずつ受け取るとしても
  rationale: ἵνα 節はここで最低限の配分さえ賄えないという結果・想定を表す。日本語では不足の強調が明瞭になるよう譲歩的に表現しつつ、「一人一人」と「少しばかり」の要素を保持した。
