id: JHN.6.38
reference: John 6:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι καταβέβηκα ⸀ἀπὸ τοῦ οὐρανοῦ οὐχ ἵνα ποιῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/038.yaml
  text: For I have come down from heaven, not to do my own will, but the will of the one who sent me.
translation:
  language: ja
  text: わたしが天から下って来たのは、自分の意志を行うためではなく、わたしを遣わした方の意志を行うためだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: からです
  rationale: 直前の発言の理由を示す接続詞。日本語では文末の「からです」とすることで、因果関係を自然かつ明確に表した。
- source_word: καταβέβηκα
  choice: 下って来た
  rationale: 完了形が示す、完了した下降とその現在的な意味を文脈に即して表す。「降臨した」などの術語化は避けた。
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 空間的な起点とヨハネ福音書における天的起源の含意を、簡潔な定訳で保持した。
- source_word: οὐχ ἵνα ποιῶ … ἀλλὰ
  choice: …を行うためではなく、…を行うため
  rationale: 否定された目的と肯定された目的の対比を明瞭にし、原文で後半に省略されている目的構文を日本語では補って自然にした。
- source_word: τὸ θέλημα τὸ ἐμὸν
  choice: 自分の意志
  rationale: ἐμὸν の強調を「自分の」で表し、対照を保持した。「意志」は意図し選び行おうとすることを示し、この文脈に適する。
- source_word: τοῦ πέμψαντός με
  choice: わたしを遣わした方
  rationale: 冠詞付き分詞を自然な敬意ある日本語で表した。原文がこの節で明示していない「父」を補わず、指示の余地を保った。
theological_decisions:
- issue: イエスが天から下って来たという主張
  choice: 天的起源を示す発言として「天から下って来た」と率直に訳す。
  alternative: 神から使命を受けたことだけを指す比喩として弱めて訳す。
  rationale: 原文は明確に空間的な下降表現を用いており、単なる派遣の比喩へ還元すべきではない。一方、本文を越えた教理的説明は加えない。
- issue: イエス自身の意志と遣わした方の意志との関係
  choice: 双方を「意志」と訳し、対比をそのまま残す。
  alternative: 「自分の望むこと／あの方が望むこと」と動的に言い換える。
  rationale: 原文の反復と神学的緊張を保持し、両者の関係を後代の専門用語で解消したり説明したりしない。
translation_notes:
  register: 明快な現代標準日本語。イエスの発言として「わたし」を用い、「遣わした方」によって自然な敬意を示した。原文の目的構文は、日本語で理解しやすい「〜のは、〜ためではなく、〜ためだからです」に整えた。
