  text: Καὶ εὑρόντες αὐτὸν πέραν τῆς θαλάσσης εἶπον αὐτῷ· Ῥαββί, πότε ὧδε γέγονας;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/025.yaml
  text: And when they found him on the other side of the sea[a], they said to him, “Rabbi, when did you get here?”
translation:
  language: ja
  text: そして彼らは、湖の向こう岸でイエスを見つけると、イエスに言った。「ラビ、いつここに着かれたのですか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「いつここに来られたのですか」。ギリシア語では完了形が用いられており、到着して今ここにいるという結果も含みうるが、文脈では到着の時を尋ねている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: そして
  rationale: 前の叙述とのつながりを保ちつつ、現代日本語の物語として自然な接続にした。
- source_word: εὑρόντες αὐτὸν
  choice: イエスを見つけると
  rationale: 先行するアオリスト分詞を時間的に捉え、主動詞に先立つ出来事として自然に表した。代名詞の指示対象は文脈上明らかなイエスであるため、曖昧さを避けて固有名で示した。
- source_word: πέραν τῆς θαλάσσης
  choice: 湖の向こう岸で
  rationale: πέραν＋属格の「向こう側」という位置関係を表す。ここでのθάλασσαはガリラヤ湖を指すため、現代日本語で地理的に明瞭な「湖」とし、対岸を自然に「向こう岸」と表現した。
- source_word: εἶπον αὐτῷ
  choice: イエスに言った
  rationale: 内容は質問だが、λέγωの基本的な意味を保って「尋ねた」ではなく「言った」とした。
- source_word: Ῥαββί
  choice: ラビ
  rationale: ユダヤ的背景と呼びかけの称号を保つため、解釈的な「先生」に置き換えず音写した。
- source_word: πότε ὧδε γέγονας
  choice: いつここに着かれたのですか
  rationale: πότεとὧδεをそれぞれ「いつ」「ここに」とし、γίνομαιの完了形がこの文脈で表す到着を、自然で敬意のある日本語の問いとして訳した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用い、会話にはラビへの敬意が自然に伝わる丁寧表現を採用した。「ラビ」は歴史的・文化的背景を保つため訳語に置き換えていない。
