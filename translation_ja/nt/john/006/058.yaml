source:
  edition: SBLGNT
  text: οὗτός ἐστιν ὁ ἄρτος ὁ ⸀ἐξ οὐρανοῦ καταβάς, οὐ καθὼς ἔφαγον οἱ ⸀πατέρες καὶ ἀπέθανον· ὁ τρώγων τοῦτον τὸν ἄρτον ⸀ζήσει εἰς τὸν αἰῶνα.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/058.yaml
  text: This is the bread that came down from heaven[a], not as the fathers ate and died[b]; the one who eats this bread will live forever.
translation:
  language: ja
  text: これは、天から下って来たパンである。父祖たち[a]が食べて死んだのとは違い、このパンを食べる者は永遠に生きる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「先祖たち」。ギリシア語は直訳すると「父たち」で、荒野でマナを食べたイスラエルの父祖を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「その時代へ」。ここでは「永遠に」「とこしえに」を意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτός ἐστιν ὁ ἄρτος
  choice: これは…パンである
  rationale: 指示詞と繋辞を自然な日本語で表し、文脈ですでに示されている特定のパンを指す表現を保った。
- source_word: ὁ ἐξ οὐρανοῦ καταβάς
  choice: 天から下って来た
  rationale: アオリスト分詞を日本語の連体修飾節で表し、ἐξ οὐρανοῦ の起点をそのまま保った。
- source_word: οὐ καθὼς ἔφαγον οἱ πατέρες καὶ ἀπέθανον
  choice: 父祖たちが食べて死んだのとは違い
  rationale: 比較を表す οὐ καθὼς を自然な対照表現とし、二つのアオリスト動詞の出来事を簡潔に保持した。
- source_word: οἱ πατέρες
  choice: 父祖たち
  rationale: 荒野でマナを食べたイスラエルの先人たちへの言及を示しつつ、ギリシア語の男性複数形の響きを保つ語を選んだ。
- source_word: ὁ τρώγων τοῦτον τὸν ἄρτον
  choice: このパンを食べる者
  rationale: 現在分詞の一般的・継続的な性格を自然に表し、τρώγω の意味を神学的に限定せず「食べる」とした。
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: 永遠に生きる
  rationale: 字義的には「その時代に至るまで生きる」に近いヨハネ特有の慣用表現を、現代日本語で意味が明確な形にした。
theological_decisions:
- issue: 荒野のパンとの比較における οἱ πατέρες の指示対象
  choice: 父祖たち
  alternative: 先祖たち
  rationale: イスラエルの父祖、特に荒野でマナを食べた世代への言及を保った。「先祖たち」も意味上可能であるため脚注に示した。
- issue: 命のパンの議論における τρώγων の神学的含意
  choice: 食べる者
  alternative: これを食する者／これにあずかる者
  rationale: 聖餐的解釈と比喩的・信仰的解釈のいずれにも訳文だけで決着をつけず、動詞の基本的な意味を保持した。
- issue: εἰς τὸν αἰῶνα の時間的範囲
  choice: 永遠に生きる
  alternative: その時代に至るまで生きる
  rationale: 原文の慣用的な永続性を明瞭に伝えつつ、字義的な形は脚注で確認できるようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「である」「父祖たち」によって聖書本文としての落ち着きと品位を保った。比較構文は日本語として自然になるよう「…のとは違い」とした。
