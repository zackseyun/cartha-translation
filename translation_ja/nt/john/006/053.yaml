id: JHN.6.53
reference: John 6:53
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ φάγητε τὴν σάρκα τοῦ υἱοῦ τοῦ ἀνθρώπου καὶ πίητε αὐτοῦ τὸ αἷμα, οὐκ ἔχετε ζωὴν ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/053.yaml
  text: So Jesus said to them[a], “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood[b], you do not have life in yourselves.”
translation:
  language: ja
  text: そこでイエスは彼らに言われた。「まことに、まことに、あなたがたに言います。人の子の肉[a]を食べ、その血を飲まなければ、あなたがたのうちに命[b]はありません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「肉」は「体」と訳すこともできるが、ギリシア語は「肉」（σάρξ）であり、この言葉の具体的で鮮烈な響きを保っている。
    reason: lexical_alternative
  - marker: b
    text: この節は単に「命」と述べており、「永遠の命」とは明記していない。ただし、ヨハネによる福音書の広い文脈では、この命はしばしば永遠の命と結び付けられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の議論を受けた帰結的なつながりを、自然な現代日本語で示す。
- source_word: Ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: ヨハネ特有の二重の厳粛な宣言を、省略せず荘重かつ理解しやすく伝える。
- source_word: ἐὰν μὴ
  choice: …なければ
  rationale: 否定条件を自然な日本語で表す。
- source_word: φάγητε
  choice: 食べ
  rationale: 語の具体的で直接的な意味を保ち、比喩的・礼典的な解釈を訳文に加えない。
- source_word: σάρκα
  choice: 肉
  rationale: 具体的で衝撃的な語感を保つ。「体」ではなく、ギリシア語σάρξに対応する「肉」とする。
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: 人の子の
  rationale: イエスの定着した自己呼称を保ち、その聖書的・メシア的含意を解釈で置き換えない。
- source_word: πίητε
  choice: 飲まなければ
  rationale: πίνωの直接的な意味を保ち、「食べる」との鮮烈な並行を維持する。
- source_word: αἷμα
  choice: 血
  rationale: 原文の具体的な表現と神学的緊張をそのまま保つ。
- source_word: ζωὴν
  choice: 命
  rationale: 原文には「永遠の」に当たる形容詞がないため、文脈から補わず単に「命」とする。
- source_word: ἐν ἑαυτοῖς
  choice: あなたがたのうちに
  rationale: 内的な所有を表す前置詞句を、自然で原文に近い日本語にする。
theological_decisions:
- issue: 肉を食べ血を飲むという表現を、礼典的または比喩的に解釈して訳すか
  choice: 「肉を食べ、その血を飲む」という具体的表現を保持する
  alternative: 「あずかる」「受け入れる」、または明示的に聖餐を示す表現にする
  rationale: 原文の意図的に鮮烈な表現を残し、礼典的、比喩的、あるいはその両方という解釈上の緊張を訳文で解消しない。
- issue: ζωήを文脈に基づいて「永遠の命」と拡張するか
  choice: 本文では「命」とする
  alternative: 「永遠の命」とする
  rationale: ヨハネ文書の広い文脈では永遠の命との関連が強いが、この節自体にはαἰώνιοςがないため、明示されていない語を補わない。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、イエスの宣言の厳粛さと原文の鮮烈さを保持した。「言われた」「まことに、まことに」により適度な格調を保ち、解釈的な言い換えは避けた。
