id: JHN.6.65
reference: John 6:65
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔλεγεν· Διὰ τοῦτο εἴρηκα ὑμῖν ὅτι οὐδεὶς δύναται ἐλθεῖν πρός με ἐὰν μὴ ᾖ δεδομένον αὐτῷ ἐκ τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/065.yaml
  text: And he was saying[b][a], “For this reason I have told you that no one is able to come to me unless it has been given to him from the Father.”
translation:
  language: ja
  text: そしてイエスは言われた。「このために、わたしはあなたがたに、『父からその人に与えられていなければ、だれもわたしのもとに来ることはできない』と言ったのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: 言われた
  rationale: 未完了時制は談話の継続的背景を示しうるが、この文脈では日本語の自然な叙述として「言われた」とし、敬意を保った。
- source_word: Διὰ τοῦτο
  choice: だから
  rationale: 直前の発言を受けて理由・帰結を示す結合表現を、明瞭で自然な現代日本語にした。
- source_word: εἴρηκα ὑμῖν
  choice: わたしはあなたがたに……と言ったのです
  rationale: 完了形による過去の発言と現在的関連を、説明調の「言ったのです」で自然に表した。
- source_word: οὐδεὶς δύναται
  choice: だれも……ことはできない
  rationale: 許可ではなく能力・可能性の否定を明確に表す。
- source_word: ἐλθεῖν πρός με
  choice: わたしのもとに来る
  rationale: ヨハネ文書における関係的・信仰的含意を説明的に限定せず、自然な定型表現で保持した。
- source_word: ἐὰν μὴ ᾖ δεδομένον αὐτῷ
  choice: 与えられていなければ
  rationale: δίδωμι の受動と必要条件を保持した。日本語では受益者が文脈上明らかなため、αὐτῷを不自然に明示せず、「その人に与えられて」の意味を含ませた。
- source_word: ἐκ τοῦ πατρός
  choice: 父から
  rationale: ἐκ の起点・源泉の意味を保持し、行為者を強調する「父によって」にはしなかった。
theological_decisions:
- issue: イエスのもとに来ることにおける神の付与と人間の能力
  choice: 父から与えられていることを、来るための必要条件としてそのまま訳した。
  alternative: 特定の神学体系に従い、不可抗的な召命または万人への先行的恩恵として説明する。
  rationale: 本文は父からの付与なしには来られないと述べるが、その付与の性質や範囲について後代の教理論争を決着させてはいないため。
- issue: αὐτῷ の男性単数・総称用法
  choice: 日本語本文では「だれも」と受動表現の組み合わせにより総称的な個人を示し、性別を付加しない。
  alternative: 「その人に与えられていなければ」と明示する。
  rationale: 日本語には英語の he に相当する総称的男性代名詞を置く必要がなく、主語と受益者が同一人物であることも文脈から明瞭である。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。イエスの発言には「です」を用いて説明の響きを表しつつ、過度に口語的にも古風にもならないようにした。引用符内に以前の発言内容を示し、完了形の現在的関連を読み取りやすくした。
