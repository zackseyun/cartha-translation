review_pass:
  verdict: revise
  source_fidelity: 受動の δεδομένον とその受益者 αὐτῷ は、「父から与えられていなければ」だけでは日本語上十分に表れていません。何が与えられるかを原文どおり明示しないことは可能ですが、「その人に」を補って受益者を示すのが安全です。ἐκ τοῦ πατρός の源泉を示す「父から」、および来ることの不可能性は適切です。
  naturalness: 全体として明瞭で自然な現代標準日本語です。ただし、受益者を補った「父からその人に与えられていなければ」のほうが、条件節の係り方が明確です。
  terminology: 「父」「わたし」「あなたがた」「わたしのもとに来る」はヨハネの文脈にふさわしく、一貫した品位ある表現です。「だから」も許容されますが、「このために」は Διὰ τοῦτο の先行文脈を指す説明的な接続をより直接に保ちます。
  issues:
  - severity: medium
    issue: αὐτῷ（その人に）が本文で明示されていない
    rationale: ギリシア語は、父から何かが『その人に』与えられることを条件として述べます。日本語で対象物を省略して原文の含みを保つことはできても、受益者まで省くと「父から与えられる」という受動条件の意味関係が曖昧になります。
