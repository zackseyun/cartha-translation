- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: 答えた
  rationale: ギリシア語の「答えて言った」という談話上の定型表現を、意味を損なわず明瞭で自然な現代日本語にまとめた。
- source_word: Μὴ γογγύζετε
  choice: つぶやいてはいけません
