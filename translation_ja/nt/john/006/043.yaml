- source_word: μετ’ ἀλλήλων
  choice: 互いに
  rationale: 集団内で相互に行われていることを簡潔で自然な日本語で表す。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で定着した人名表記を用いた。
