id: JHN.6.51
reference: John 6:51
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγώ εἰμι ὁ ἄρτος ὁ ζῶν ὁ ἐκ τοῦ οὐρανοῦ καταβάς· ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου ⸀ζήσει εἰς τὸν αἰῶνα, καὶ ὁ ἄρτος δὲ ὃν ἐγὼ δώσω ἡ σάρξ μού ⸀ἐστιν ὑπὲρ τῆς τοῦ κόσμου ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/051.yaml
  text: I am the living bread that came down from heaven[a]. If anyone eats of this bread, he will live forever[c][b]. And the bread that I will give for the life of the world is my flesh.
translation:
  language: ja
  text: わたしは、天から下って来た生きているパンです。だれでもこのパンを食べるなら、永遠に生きます。[a] そして、わたしが世の命のために与えるパンは、わたしの肉です。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その時代へと生きます」。この表現は、いつまでも、永遠に生きることを意味します。
    reason: lexical_alternative
  - marker: b
    text: 原文は「体」ではなく「肉」です。具体的で強い表現が用いられています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἄρτος ὁ ζῶν
  choice: 生きているパン
  rationale: ζῶνを形容詞的に訳し、近接文脈の「命のパン」と混同せず、パンそのものが生きているという具体的な表現を保つ。
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: 天から下って来た
  rationale: 完了した下降を表すアオリスト分詞を自然な連体節で表し、天からの実際の来臨という主張をそのまま保つ。
- source_word: ἐάν τις φάγῃ ἐκ τούτου τοῦ ἄρτου
  choice: だれでもこのパンを食べるなら
  rationale: ἐάνと接続法による一般的条件、およびτιςの包括的な意味を自然な現代日本語で表す。ἐκの部分・起点の含みは日本語では単に「このパンを食べる」が最も自然である。
- source_word: ζήσει εἰς τὸν αἰῶνα
  choice: 永遠に生きます
  rationale: ヨハネ文書でのεἰς τὸν αἰῶναの慣用的意味を、明瞭で自然な日本語にする。
- source_word: ὁ ἄρτος δὲ ὃν ἐγὼ δώσω
  choice: そして、わたしが…与えるパン
  rationale: δέは強い逆接ではなく論述の展開を示すため「そして」とし、未来形δώσωは文脈上の将来的な自己授与を表す日本語現在形「与える」で自然に表現する。
- source_word: ἡ σάρξ μού ἐστιν
  choice: わたしの肉です
  rationale: σάρξの具体的で意図的に強い語感を保つ。「体」とすると原語を和らげ、解釈を加えることになる。
- source_word: ὑπὲρ τῆς τοῦ κόσμου ζωῆς
  choice: 世の命のために
  rationale: ὑπέρの受益・目的の意味を自然に示し、κόσμοςの広がりを狭めずに保つ。
theological_decisions:
- issue: イエスの自己描写におけるσάρξの意味
  choice: 本文で「肉」と訳す
  alternative: 「体」
  rationale: この箇所のσάρξは具体的で、イエスの自己授与と結びついている。「体」は語の衝撃を弱め、聖餐論など特定の解釈へ寄せる可能性がある。
- issue: 「世」の範囲
  choice: 「世」をそのまま保持する
  alternative: 「人類」または特定の集団に限定する訳
  rationale: κόσμοςの広いヨハネ的表現を保ち、救いの範囲について本文以上の限定を加えない。
- issue: 「天から下って来た」のキリスト論的含意
  choice: 実際の下降を率直に訳す
  alternative: 単なる神的派遣の比喩として言い換える
  rationale: 原文の下降表現を薄めずに保ちつつ、それ以上の教理的説明は本文に加えない。
- issue: εἰς τὸν αἰῶναの時間的意味
  choice: 「永遠に」
  alternative: 「その時代まで」または「世々に」
  rationale: ヨハネ文書における慣用的な永続性を明瞭に伝え、終末論的な力を保つ。
translation_notes:
  register: 明瞭な現代標準語を用い、イエスの発言にふさわしい簡潔で荘重な調子を保った。神への敬語的な持ち上げや古語調は避け、です・ます体で統一した。
