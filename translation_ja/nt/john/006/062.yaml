  text: ἐὰν οὖν θεωρῆτε τὸν υἱὸν τοῦ ἀνθρώπου ἀναβαίνοντα ὅπου ἦν τὸ πρότερον;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/062.yaml
  text: Then what if you were to see the Son of Man ascending to where he was before?[a]
translation:
  language: ja
  text: それでは、人の子が以前いた所へ上って行くのを、あなたがたが見るなら、どうでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それでは、人の子が以前いた所へ上って行くのを、あなたがたが見たなら、どうでしょうか」。ギリシア語は、修辞的な問いとして用いられた条件文です。
    reason: 原文の条件構文は、日本語では「見たなら」とも表せるため。
lexical_decisions:
- source_word: ἐὰν οὖν
  choice: それでは、…見たなら、どうでしょうか
  rationale: οὖνの推論的なつながりと、ἐὰνによる条件を、日本語として自然な修辞疑問の形で表した。
- source_word: θεωρῆτε
  choice: あなたがたが見たなら
  rationale: θεωρέωの『目にする、見守る』という意味を保ちつつ、将来的な条件を自然な現代日本語で示した。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: 福音書で定着したイエスの自己呼称として保持し、ダニエル書を背景とする響きを残した。
- source_word: ἀναβαίνοντα
  choice: 上って行くのを
  rationale: 上方への移動を明確にしつつ、行き先を本文以上に『天』などと特定しない表現とした。
- source_word: ὅπου ἦν τὸ πρότερον
  choice: 以前いた所へ
  rationale: 以前の存在場所を指す表現を簡潔に保ち、『父のもと』『天』といった解釈的補足を加えなかった。
theological_decisions:
- issue: 上昇を先在および天的起源への明示的言及として訳文内で説明するか
  choice: 「以前いた所へ」とし、場所を特定しない
  alternative: 「以前いた天へ」または「以前いた父のもとへ」
  rationale: ギリシア語は先在と上昇を強く示唆するが、この節自体は天や父を明記していないため、含意を保ちながら解釈的な語を補わない。
- issue: 文全体を修辞疑問として明示するか
  choice: 「見たなら、どうでしょうか」と訳す
  alternative: 「見たなら」とだけ訳し、帰結を省略した条件文として残す
  rationale: 原文末の疑問符と文脈上の働きを日本語で分かりやすく示しつつ、何が起こるかという具体的な帰結は補わない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書的な尊厳を保った。「昇る」より動作が分かりやすい「上って行く」を採用し、本文にない行き先の特定は避けた。
