id: JHN.6.44
reference: John 6:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδεὶς δύναται ἐλθεῖν πρός ⸀με ἐὰν μὴ ὁ πατὴρ ὁ πέμψας με ἑλκύσῃ αὐτόν, κἀγὼ ἀναστήσω αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/044.yaml
  text: No one is able to come to me unless the Father who sent me draws him[b][a], and I will raise him up on the last day.
translation:
  language: ja
  text: わたしを遣わした父がその人を引き寄せなければ[a]、だれもわたしのもとに来ることはできない。そしてわたしは、その人を終わりの日によみがえらせる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「引っ張らなければ」、または、より強く「引きずらなければ」とも訳せる。このギリシア語動詞は、対象を自分の方へ動かす強い働きを表すことがある。本文では、父が人を御子のもとへ来させる仕方について特定の神学的説明に限定しないため、「引き寄せる」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδεὶς δύναται
  choice: だれも……できない
  rationale: 普遍的な否定と能力の欠如を、現代日本語で自然かつ明確に表す。
- source_word: ἐλθεῖν πρός με
  choice: わたしのもとに来る
  rationale: イエスに向かう動きと、ヨハネ福音書における関係的な含みを保ちつつ、意味を過度に解釈しない。
- source_word: ὁ πατὴρ ὁ πέμψας με
  choice: わたしを遣わした父
  rationale: 冠詞付き分詞を自然な連体修飾として訳し、イエスが用いる「父」という呼称を保持する。
- source_word: ἑλκύσῃ
  choice: 引き寄せなければ
  rationale: 対象を自分の方へ動かす語の力を保ちながら、「引きずる」ほど物理的・強制的な像に限定しない。より強い語感の可能性は脚注に示す。
- source_word: αὐτόν
  choice: その人
  rationale: ギリシア語は男性単数形だが、ここでは一般の人を代表している。日本語の「その人」は単数の照応を明確に保ち、性別を不必要に限定しない。
- source_word: κἀγὼ ἀναστήσω αὐτόν
  choice: そしてわたしは、その人を……よみがえらせる
  rationale: καίと明示された主語ἐγώを「そしてわたしは」で表し、ἀναστήσωの復活の意味を「よみがえらせる」で明確にする。
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 終わりの日に
  rationale: 終末論的な特定の日を、聖書的な響きを保つ簡潔な現代日本語で表す。
theological_decisions:
- issue: 救いに関する文脈でのἑλκύσῃの力の程度
  choice: 引き寄せる
  alternative: 引っ張る／引きずる
  rationale: この動詞は文脈によって強い牽引を表し得るが、ここで神の働き方を特定の神学体系に沿って説明し切らないため、方向性と作用を示す「引き寄せる」を本文に置き、強い代案を脚注に残す。
- issue: 男性単数代名詞αὐτόνの一般的用法
  choice: その人
  alternative: 彼
  rationale: 原文の単数の照応は保ちつつ、代表的用法を日本語で自然に表す。「彼」は現代日本語では男性に限定して受け取られやすいため用いない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「来ることはできない」によって能力を明示し、「よみがえらせる」で復活を平易に表現した。敬語的な補助表現は原文にない受益の含みを加え得るため避けた。
