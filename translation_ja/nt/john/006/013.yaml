  text: συνήγαγον οὖν, καὶ ἐγέμισαν δώδεκα κοφίνους κλασμάτων ἐκ τῶν πέντε ἄρτων τῶν κριθίνων ἃ ⸀ἐπερίσσευσαν τοῖς βεβρωκόσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/013.yaml
  text: So they gathered them[b][a], and filled twelve baskets with pieces from the five barley loaves left over by those who had eaten.
translation:
  language: ja
  text: そこで彼らはそれらを集め、食べた人々の食後に余った[b]五つの大麦のパンのかけら[a]で、十二の籠をいっぱいにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「かけら」は「パンの切れ端」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「食べた人々にとって余った（有り余った）もの」。食べた人々が食べた後に残った分を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήγαγον οὖν
  choice: そこで彼らはそれらを集め
  rationale: οὖνが直前の命令を受けた結果を示すため「そこで」とした。συνήγαγονの目的語は文脈上の残り物なので、日本語では「それら」を補って自然な叙述にした。
- source_word: ἐγέμισαν δώδεκα κοφίνους
  choice: 十二の籠をいっぱいにした
  rationale: 能動態と数量をそのまま保ち、κοφίνουςは種類を過度に限定せず、一般に分かりやすい「籠」とした。
- source_word: κλασμάτων
  choice: かけら
  rationale: 裂かれたパンの残片を指す語として、現代日本語で自然な「かけら」を採用した。「パンの切れ端」も可能である。
- source_word: ἐκ τῶν πέντε ἄρτων τῶν κριθίνων
  choice: 五つの大麦のパンの
  rationale: ἐκが示す由来は日本語の連体関係で自然に表し、五つの元のパンから出たかけらであることを示した。κρίθινοςは「大麦の」と明示した。
- source_word: ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν
  choice: 食べた人々に余った
  rationale: 「食べ終えた人々にとって余った／有り余った」というギリシア語の関係を、主体を『人々が残した』と断定せず簡潔に表した。
theological_decisions:
- issue: 関係節 ἃ ἐπερίσσευσαν τοῖς βεβρωκόσιν の意味関係
  choice: 食べた人々に余った…かけら
  alternative: 食べた人々が残した…かけら
  rationale: 後者は食べた人々を明確な行為主体にするが、原文の与格は「彼らにとって／彼らのところで余った」という幅を持つ。奇跡後の余剰という含みを狭めない訳を選んだ。
translation_notes:
  register: 明瞭で落ち着いた現代標準日本語。文の流れを自然にしつつ、原文の能動的な叙述と、余ったものを表す関係節の含みを保った。
