- source_word: τὴν σάρκα αὐτοῦ
  choice: 自分の肉
  rationale: σάρξの具体的で生々しい語を「体」と解釈的に和らげず、この箇所の緊張を保った。主語との対応が明確になるようαὐτοῦを「自分の」とした。
- source_word: φαγεῖν
  choice: 食べさせる
  rationale: 「私たちに与えて食べるようにする」という構造を、δοῦναιとの結びつきを残しつつ自然な日本語で表した。
