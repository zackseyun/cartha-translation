  text: εἶπον οὖν πρὸς αὐτόν· Κύριε, πάντοτε δὸς ἡμῖν τὸν ἄρτον τοῦτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/034.yaml
  text: So they said to him[a], “Lord, always give us this bread.”
translation:
  language: ja
  text: そこで彼らは彼に言った。「主よ[a]、いつもこのパンを私たちにお与えください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、敬意を表す呼びかけ。「主」を意味するほか、敬意を込めた呼びかけとしても用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπον οὖν
  choice: そこで彼らは言った
  rationale: アオリストの発話動詞を自然な物語文の「言った」とし、οὖνは直前の話を受けた応答であることを示す「そこで」で表した。
- source_word: πρὸς αὐτόν
  choice: 彼に
  rationale: 発話動詞に伴うπρός＋対格は、話しかける相手を示すため、「彼に」とした。
- source_word: Κύριε
  choice: 主よ
  rationale: 呼格を保ち、イエスへの敬称としての意味と、より深い「主」の含意の両方を残した。文脈上、単なる丁寧な呼びかけとも解し得るため脚注を付した。
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的な供給を願う表現として、明瞭で自然な現代日本語を選んだ。
- source_word: δὸς ἡμῖν
  choice: 私たちにお与えください
  rationale: 命令形による直接の願いを、日本語の敬意ある依頼表現で示した。
- source_word: τὸν ἄρτον τοῦτον
  choice: そのパン
  rationale: 直前に話題となったパンを指す指示表現として、日本語では「そのパン」が自然である。「このパン」も可能だが、話し手の手元にある物ではなく、イエスが語ったパンを受けているため「その」とした。
theological_decisions:
- issue: イエスへの直接呼称κύριοςの訳
  choice: 主よ
  alternative: 先生
  rationale: 話し手がこの時点で十分なキリスト論的理解を持っていたと断定せず、それでも原語が持ち得る「主」という含意を失わない訳を本文に置いた。礼儀上の呼称である可能性は脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、対話にふさわしい敬意と聖書本文としての品位を保った。「お与えください」は話し手がイエスに向ける敬意を自然に表す。
