id: JHN.6.11
reference: John 6:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλαβεν ⸀οὖν τοὺς ἄρτους ὁ Ἰησοῦς καὶ εὐχαριστήσας ⸀διέδωκεν τοῖς ἀνακειμένοις, ὁμοίως καὶ ἐκ τῶν ὀψαρίων ὅσον ἤθελον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/011.yaml
  text: So Jesus took the loaves[a], and after giving thanks he distributed them to those who were reclining; likewise also from the fish[b], as much as they wanted.
translation:
  language: ja
  text: そこでイエスはパンを取り、感謝をささげてから、食事の席に着いていた人々[a]に分け与えた。魚[b]も同じように、彼らが望むだけ分け与えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「横になっていた人々」。当時、食事の際には身を横たえるのが一般的だった。
    reason: lexical_alternative
  - marker: b
    text: 「小魚」とも訳せる。このギリシア語は、パンとともに食べる魚、場合によっては小魚を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 物語上の展開と前後の論理的なつながりを、現代日本語で自然に示す。
- source_word: τοὺς ἄρτους
  choice: パン
  rationale: 複数形は複数のパンを指すが、日本語では通常「パン」と集合的に表すのが自然であり、文脈上も個数は明らかである。
- source_word: εὐχαριστήσας
  choice: 感謝をささげてから
  rationale: アオリスト分詞が主動詞に先立つ行為を表すことを明確にしつつ、原文に明示されない感謝の対象を補わない。
- source_word: διέδωκεν
  choice: 分け与えた
  rationale: 単に渡すのではなく、群衆の間に配るという分配の意味を自然に表す。
- source_word: τοῖς ἀνακειμένοις
  choice: 食事の席に着いていた人々
  rationale: 語義上は食事のために横になる姿勢を指すが、日本語では食事の場に着いていたことを表すこの言い方が自然である。字義的な姿勢は脚注に示す。
- source_word: ὁμοίως καὶ
  choice: 魚も同じように
  rationale: パンと魚の扱いの並行関係と、καίの付加的な意味を明瞭に表す。
- source_word: ἐκ τῶν ὀψαρίων
  choice: 魚
  rationale: ὀψάριονはパンとともに食べる魚、とりわけ小魚を指し得るが、本文では過度に限定しない自然な総称を用いる。
- source_word: ὅσον ἤθελον
  choice: 彼らが望むだけ
  rationale: 人々が欲する量に応じて制限なく受け取ったことを、簡潔かつ忠実に表す。
theological_decisions:
- issue: 給食物語における εὐχαριστήσας の聖餐的含意
  choice: 「感謝をささげて」と訳し、聖餐的解釈を本文に付加しない
  alternative: 「祝福して」と訳す、または聖餐との関連を明示する
  rationale: この動詞が直接表すのは感謝する行為である。ヨハネ文脈に聖餐的な響きを認める余地は保ちつつ、翻訳本文で特定の神学的解釈を確定しない。
translation_notes:
  register: 明快な現代標準日本語を用い、語調は簡潔で品位を保った。「食事の席に着いていた」で当時の食事場面を自然に伝え、字義的な姿勢は脚注に残した。
