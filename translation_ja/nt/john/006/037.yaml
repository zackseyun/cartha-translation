source:
  edition: SBLGNT
  text: πᾶν ὃ δίδωσίν μοι ὁ πατὴρ πρὸς ἐμὲ ἥξει, καὶ τὸν ἐρχόμενον πρός ⸀με οὐ μὴ ἐκβάλω ἔξω,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/037.yaml
  text: All that the Father gives me will come to me[b][a], and the one who comes to me I will certainly not cast out.
translation:
  language: ja
  text: 父がわたしに与えるものはすべて、わたしのもとに来ます。そして、わたしのもとに来る人を、わたしは決して外に追い出しません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「決して追い払いません」とも訳せる。原文は強い否定表現を用い、直訳的には「決して外へ追い出さない」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὃ
  choice: ものはすべて
  rationale: 中性単数の集合表現を保ちつつ、現代日本語として自然にした。「人はみな」と個人に限定せず、集合的な表現の含みを残す。
- source_word: δίδωσίν μοι
  choice: わたしに与える
  rationale: 現在直説法を素直な現在形で訳し、継続中または完了済みと限定しない。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 明示されていない所有表現を補わず、ヨハネ福音書における称号として訳す。
- source_word: πρὸς ἐμὲ ἥξει
  choice: わたしのもとに来ます
  rationale: 方向を示す前置詞句と未来形を自然に表し、ヨハネ福音書での「イエスのもとに来る」という用法を保つ。
- source_word: τὸν ἐρχόμενον πρός με
  choice: わたしのもとに来る人を
  rationale: 冠詞付き現在分詞の一般的な指示を明瞭な日本語で表す。前半の中性集合表現とは異なり、ここでは男性単数の人を指す形も反映する。
- source_word: οὐ μὴ ἐκβάλω ἔξω
  choice: わたしは決して外に追い出しません
  rationale: οὐ μήの強い否定を「決して…ません」で示し、ἐκβάλλωとἔξωが表す排除・放逐の像も「外に追い出す」として明示する。
theological_decisions:
- issue: 父が与えるものと、イエスのもとに来ることとの関係
  choice: 中性単数の集合表現を「ものはすべて」と訳す。
  alternative: 「父がわたしに与える人はみな」
  rationale: 原文の中性単数集合表現を人格化して限定せず、集団を一つの全体として見る可能性と、文脈上人々を指す可能性との緊張を保つ。
- issue: οὐ μὴ ἐκβάλω ἔξω における約束の強さ
  choice: 「決して外に追い出しません」
  alternative: 「絶対に退けません」
  rationale: 強意否定を明確に保ちながら、この節だけでは明示されていない救済論上の体系や、後の背教・忍耐に関する教理まで読み込まない。
translation_notes:
  register: 明瞭で現代的な敬体を用い、イエスの発言として品位を保った。「ものはすべて」により原文の中性単数集合表現を残し、「外に追い出す」により原文末尾のἔξωも反映した。
