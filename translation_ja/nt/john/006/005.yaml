id: JHN.6.5
reference: John 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπάρας οὖν ⸂τοὺς ὀφθαλμοὺς ὁ Ἰησοῦς⸃ καὶ θεασάμενος ὅτι πολὺς ὄχλος ἔρχεται πρὸς αὐτὸν λέγει ⸀πρὸς Φίλιππον· Πόθεν ⸀ἀγοράσωμεν ἄρτους ἵνα φάγωσιν οὗτοι;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/005.yaml
  text: So Jesus[a], lifting up his eyes and seeing that a large crowd was coming toward him, said to Philip[c][b], “Where are we to buy bread so that these may eat?”
translation:
  language: ja
  text: そこでイエスは目を上げ、大勢の群衆がご自分のところへやって来るのを見て、フィリポに言われた。「この人たちが食べるためのパンを、どこで買おうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπάρας ... τοὺς ὀφθαλμούς
  choice: 目を上げ
  rationale: 身体部位を伴うギリシア語の慣用表現を、自然で簡潔な現代日本語として保った。
- source_word: οὖν
  choice: そこで
  rationale: 直前の物語を受ける展開上のつながりを示し、日本語の叙述として自然にした。
- source_word: θεασάμενος
  choice: 見て
  rationale: 群衆が近づく様子を認めたという知覚を、過度な解釈を加えず表した。
- source_word: πολὺς ὄχλος
  choice: 大勢の群衆
  rationale: 人数の多さを明確にしつつ、現代日本語で自然な表現とした。
- source_word: ἔρχεται πρὸς αὐτόν
  choice: ご自分のところへやって来る
  rationale: 現在形の生き生きとした進行感と、πρόςの方向性を自然な日本語で表した。
- source_word: λέγει πρὸς Φίλιππον
  choice: フィリポに言われた
  rationale: 歴史的現在を日本語の自然な過去叙述にし、イエスへの敬意は標準的な尊敬表現で示した。
- source_word: Πόθεν ἀγοράσωμεν
  choice: どこで買おうか
  rationale: Πόθενは字義的には「どこから」だが、購入先を尋ねる日本語として「どこで」が自然である。第一人称複数の接続法は、相談を持ちかける形の「買おうか」で保持した。
- source_word: ἄρτους
  choice: パン
  rationale: 個々のパンを指す可能性もあるが、この文脈では食物としてのパンを自然に総称できる。
- source_word: ἵνα φάγωσιν οὗτοι
  choice: この人たちに食べさせる
  rationale: 目的関係を日本語の連体修飾に組み替え、οὗτοιがその場の人々を指すことを明確かつ自然に表した。
theological_decisions:
- issue: イエスの問いに含まれる第一人称複数の扱い
  choice: 「どこで買おうか」
  alternative: 「どこで買えばよいだろうか」
  rationale: 弟子を含む「私たち」が買うという原文の形を保ちつつ、この節だけでは問いの意図を試験・相談・熟慮のいずれかに限定しない。
- issue: 歴史的現在と分詞による物語進行
  choice: 「目を上げ…見て…言われた」
  alternative: 「目を上げ…見ると…言われる」
  rationale: 出来事の順序を保ちながら、現代日本語の物語文として自然な過去叙述に統一した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。イエスの発話は自然な問いかけとし、原文にない試みの意図や感情は補わない。
