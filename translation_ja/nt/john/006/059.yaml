  text: He said these things while teaching in the synagogue in Capernaum.
translation:
  language: ja
  text: イエスは、カファルナウムの会堂で教えながら、これらのことを話した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 中性複数の指示代名詞で、直前の一連の発言内容を指すため、複数性を保って「これらのこと」とした。
- source_word: εἶπεν
  choice: 語られた
  rationale: λέγωのアオリストを自然な日本語で表した。主語はギリシア語では省略されているが、日本語では文脈上の主語を明示しないと不自然になりやすいため「イエスは」を補った。
- source_word: ἐν συναγωγῇ
  choice: 会堂で
  rationale: 無冠詞だが、カファルナウムにある地域のユダヤ教会堂を指す文脈であり、日本語では定・不定を過度に明示せず「会堂で」とするのが自然である。
- source_word: διδάσκων
  choice: 教えていた時
  rationale: 現在分詞が主動詞と同時進行の動作を示すことを、「教えていた時」で明確かつ自然に表した。
- source_word: ἐν Καφαρναούμ
  choice: カファルナウムの
  rationale: 場所を示す句を日本語の自然な連体修飾に組み替え、「カファルナウムの会堂」とした。地名は一般的な音写を用いた。
