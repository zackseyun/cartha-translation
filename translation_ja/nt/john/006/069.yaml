id: JHN.6.69
reference: John 6:69
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡμεῖς πεπιστεύκαμεν καὶ ἐγνώκαμεν ὅτι σὺ εἶ ὁ ⸀ἅγιος τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/069.yaml
  text: And we have believed and have come to know that you are the Holy One of God[a][b].
translation:
  language: ja
  text: そして私たちは、あなたが神の聖なる方[a][b]であると信じ、また知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「あなたはキリスト、生ける神の子です」とあります。
    reason: textual_variant
  - marker: b
    text: 別訳「神から来た聖なる方」。ギリシア語の属格は、関係または起源を表し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς
  choice: 私たちは
  rationale: 明示された代名詞による強調を、主題を明示する「私たちは」で自然に表した。文脈上、過度に強い「私たち自身は」とする必要はない。
- source_word: πεπιστεύκαμεν
  choice: 信じています
  rationale: 完了形が示す、信じた結果として今も続く確立した状態を、日本語の継続表現で表した。本文では後続の「知っています」と共有される形に整えた。
- source_word: ἐγνώκαμεν
  choice: 知っています
  rationale: 知るに至った結果として現在も知っているという完了形の結果状態を、自然な現代日本語で表した。「知るに至りました」は獲得過程を強く出しすぎるため避けた。
- source_word: ὅτι
  choice: …であると
  rationale: 信仰と認識の内容を導く接続表現として訳した。理由を示す「なぜなら」ではない。
- source_word: ὁ ἅγιος
  choice: 聖なる方
  rationale: 神によって特別に聖別された者を指すキリスト論的称号として、名詞的で尊厳のある「聖なる方」とした。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格が表し得る関係・帰属・起源を一つに限定せず、日本語でも幅を保つ「神の」とした。
theological_decisions:
- issue: ヨハネ6章69節のキリスト論的称号
  choice: 神の聖なる方
  alternative: 神から来た聖なる方／キリスト、生ける神の子
  rationale: SBLGNT本文のὁ ἅγιος τοῦ θεοῦを直接訳し、マタイ16章16節に似た異読へ調和させなかった。また、属格を起源だけに限定せず、神との関係を広く保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、キリスト論的称号には「聖なる方」という尊厳ある表現を採用した。二つの完了形は、過去の到達そのものより現在に続く確立した状態を自然に伝えるため、「信じ、また知っています」とした。
