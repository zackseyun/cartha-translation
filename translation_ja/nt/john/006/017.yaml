  text: καὶ ἐμβάντες ⸀εἰς πλοῖον ἤρχοντο πέραν τῆς θαλάσσης εἰς Καφαρναούμ. καὶ σκοτία ἤδη ἐγεγόνει καὶ ⸀οὔπω ἐληλύθει πρὸς αὐτοὺς ὁ Ἰησοῦς,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/017.yaml
  text: They got into a boat and were heading across the sea to Capernaum[a]. And it had already become dark[c][b], and Jesus had not yet come to them.
translation:
  language: ja
  text: 弟子たちは舟に乗り、湖[a]を渡ってカファルナウムへ向かっていた。すでに暗くなっていたが、イエスはまだ彼らのところに来ておられなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は「海」を意味する語を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβάντες εἰς πλοῖον
  choice: 舟に乗り
  rationale: アオリスト分詞を、主動詞に先立つ動作として自然な日本語の連用形で表した。πλοῖονはこの場面に適した「舟」とした。
- source_word: ἤρχοντο
  choice: 向かっていた
  rationale: ἔρχομαιの未完了過去が示す進行中の移動を「向かっていた」で保持した。
- source_word: πέραν τῆς θαλάσσης εἰς Καφαρναούμ
  choice: 湖の向こう岸のカファルナウムへ
  rationale: πέρανの到達方向とεἰς Καφαρναούμを一続きに自然に表した。θάλασσαは地理的実体に即して「湖」としたが、原語には「海」の語が用いられているため脚注で示した。
- source_word: σκοτία ἤδη ἐγεγόνει
  choice: すでに暗くなっていた
  rationale: 完了過去が示す、すでに暗くなった結果としての状態を自然な日本語で表した。
- source_word: οὔπω ἐληλύθει πρὸς αὐτοὺς
  choice: まだ彼らのところに来ておられなかった
  rationale: οὔπωと完了過去による、その時点まで到来していない状態を保ち、πρὸς αὐτούςを直接的に訳した。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 日本語で定着した人名表記を用いた。
theological_decisions:
- issue: 物語の時制・相と出来事の順序
  choice: 舟に乗った後、カファルナウムへ向かう動作が進行中であり、すでに暗くなっていた一方、イエスはまだ来ていなかったという順序を保持した。
  alternative: 「舟でカファルナウムへ渡った」「もう暗かった」など、相を単純化して訳す。
  rationale: 後続する水上での出来事に向けた物語上の緊張を保ちつつ、本文以上の神学的意味を加えないため。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「おられなかった」はイエスへの自然な敬意を示す通常の日本語表現であり、原文にない教理的含意は加えていない。
