id: JHN.6.21
reference: John 6:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἤθελον οὖν λαβεῖν αὐτὸν εἰς τὸ πλοῖον, καὶ εὐθέως ⸂ἐγένετο τὸ πλοῖον⸃ ἐπὶ τῆς γῆς εἰς ἣν ὑπῆγον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/021.yaml
  text: So they were willing to take him into the boat[a], and immediately the boat was at the land to which they were going.
translation:
  language: ja
  text: そこで彼らは、イエスを舟に迎え入れようと思った。すると舟はたちまち、彼らが向かっていた陸地に着いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「すると舟はすぐに、彼らが向かっていた岸に着いた」。
    reason: γῆはここで目的地の「陸地」を指すが、文脈上「岸」と訳すこともできる。
lexical_decisions:
- source_word: ἤθελον
  choice: 迎え入れようとした
  rationale: 未完了過去の θέλω が示す意向・意思を自然な日本語で表す。実際に迎え入れたと本文が明記しているかどうかは断定しない。
- source_word: οὖν
  choice: そこで
  rationale: 直前の恐れが解かれたことを受けた物語上の帰結を、現代日本語で自然に示す。
- source_word: λαβεῖν αὐτὸν εἰς τὸ πλοῖον
  choice: イエスを舟に迎え入れる
  rationale: λαμβάνω の「受け入れる／取る」という意味と、舟内へ迎える具体的な場面の双方を明瞭に表す。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: πλοῖον
  choice: 舟
  rationale: ガリラヤ湖で用いられる比較的小型の舟にふさわしく、聖書本文としても自然な語を選ぶ。
- source_word: εὐθέως
  choice: たちまち
  rationale: 出来事の急速さと唐突さを保ち、奇跡的とも受け取れる叙述の力を弱めない。
- source_word: ἐγένετο τὸ πλοῖον ἐπὶ τῆς γῆς
  choice: 舟は……陸地のところに来ていた
  rationale: γίνομαι と場所表現による「その場所に至る／そこにある」の幅を保ちながら、「舟が陸上に乗り上げた」という誤解を避ける。「着いた」よりも原文の結果状態をやや明示する。
- source_word: γῆς
  choice: 陸地
  rationale: γῆ の基本的な意味に近く、目的地となる陸側を指す。文脈的な「岸」は脚注に残す。
- source_word: εἰς ἣν ὑπῆγον
  choice: 彼らが向かっていた
  rationale: 目的地へ進行中だったことを示す未完了過去の側面を自然に表す。
theological_decisions:
- issue: 後半を、奇跡的な瞬時の移動を説明または緩和する形で訳すか
  choice: 「たちまち……陸地のところに来ていた」とし、唐突な即時性を保つ。
  alternative: 「舟はすぐに、彼らが向かっていた岸に着いた」
  rationale: 原文は出来事を簡潔に述べ、εὐθέως によって際立った即時性を持たせている。移動の仕方を説明したり、「間もなく」などで弱めたりせず、解釈上の緊張を残す。
- issue: 弟子たちが実際にイエスを舟へ迎え入れたと断定するか
  choice: 「迎え入れようとした」として、弟子たちの意思を表す。
  alternative: 「喜んでイエスを舟に迎え入れた」
  rationale: ἤθελον は彼らの意思・意向を明示するが、この節自体は迎え入れる行為の完了を明瞭には述べないため、その曖昧さを保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「たちまち」「陸地」によって簡潔で品位ある聖書本文の調子を保った。「陸地のところに来ていた」はやや特徴的な表現だが、原文の場所的・結果的な言い方と突然性を残すために採用した。
