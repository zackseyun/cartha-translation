  source_fidelity: 「行けばよいのでしょう」は、πρὸς τίνα ἀπελευσόμεθα の未来形による修辞疑問を「だれのもとへ行くべきか」という当為・適切さの問いへとやや移している。ここは「だれのところへ行くのでしょうか」として、未来の問いと、ほかに行く相手がいないという文脈上の含みを保つのがよい。ほかの箇所は原文に忠実であり、「イエスに」の明示も文脈上適切である。
  naturalness: 「私たちはだれのところへ行くのでしょうか」は明瞭で自然な現代標準日本語であり、修辞疑問としてもよく機能する。「主よ、」の読点を補うと呼びかけの区切りが明確になる。
  terminology: 「シモン・ペテロ」「主よ」「永遠のいのちのことば」はいずれも適切である。「いのち」はヨハネ文書の用語として自然であり、「ことば」はῥήματαの複数を不自然に逐語化せず表せている。脚注の「先生」は可能な代替訳として許容できる。
