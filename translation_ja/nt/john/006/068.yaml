  text: ⸀ἀπεκρίθη αὐτῷ Σίμων Πέτρος· Κύριε, πρὸς τίνα ἀπελευσόμεθα; ῥήματα ζωῆς αἰωνίου ἔχεις,
base_translation:
  language: en
  yaml_path: translation/nt/john/006/068.yaml
  text: Simon Peter answered him[a], “Lord, to whom will we go? You have words of eternal life,”
translation:
  language: ja
  text: シモン・ペテロはイエスに答えた。「主よ[a]、私たちはだれのところへ行くのでしょうか。あなたは永遠のいのちのことばを持っておられます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「先生」とも訳せる。ギリシア語の称号は敬意を込めた呼びかけとして用いられることもあるが、ここではヨハネ福音書での用法にも合う「主」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ
  choice: イエスに答えた
  rationale: 応答を表す標準的な叙述。「彼に」では日本語として指示対象が不自然に曖昧になるため、文脈上の指示対象であるイエスを明示した。
- source_word: Σίμων Πέτρος
  choice: シモン・ペテロ
  rationale: 現代日本語の聖書で広く通用する固有名表記を用いた。
- source_word: Κύριε
  choice: 主よ
  rationale: κύριοςの呼格。敬意ある呼びかけとヨハネ福音書における称号としての含みを保つため「主よ」とした。
- source_word: πρὸς τίνα ἀπελευσόμεθα
  choice: 私たちはだれのところへ行けばよいのでしょう
  rationale: 直訳的な「だれのところへ行くのでしょう」より、行くべき相手がほかにいないという修辞疑問の力を自然な日本語で表した。
- source_word: ῥήματα ζωῆς αἰωνίου
  choice: 永遠のいのちのことば
  rationale: ῥήματαの複数性は、日本語で集合的に用いられる「ことば」によって自然に表現した。属格の結びつきは説明的に限定せず、「永遠のいのちのことば」として簡潔に保った。
- source_word: ἔχεις
  choice: 持っておられます
  rationale: 所有を表す単純な現在形を訳し、イエスへの直接の呼びかけにふさわしい自然な敬語を用いた。
theological_decisions:
- issue: イエスへの呼びかけΚύριεの意味合い
  choice: 主よ
  alternative: 先生
  rationale: この称号は一般的な敬称としても機能しうるが、ここではヨハネ福音書におけるキリスト論的な響きを消さず、同時に本文以上の意味を説明として加えない「主よ」を採用した。
- issue: 「永遠のいのち」と「ことば」の関係
  choice: 永遠のいのちのことば
  alternative: 永遠のいのちを与えることば
  rationale: 後者は意味を明示する一方、ギリシア語の属格がもつ簡潔さと幅を狭めるため、原文の関係性をそのまま保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、ペテロの敬意と告白的な重みが感じられる丁寧な文体とした。「いのち」はヨハネ福音書の重要語として慣用的な平仮名表記を採用した。
