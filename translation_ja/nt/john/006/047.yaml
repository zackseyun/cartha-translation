  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ ⸀πιστεύων ἔχει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/047.yaml
  text: Truly[a], truly, I say to you[b], the one who believes has eternal life.
translation:
  language: ja
  text: まことに、まことに、あなたがたに言います。信じる者は永遠の命を持っています。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: ヨハネ福音書に特徴的な、厳粛で強調された宣言の導入句。反復を保ちつつ、現代日本語で自然かつ格調ある表現とした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: λέγω の現在形と複数二人称の与格を明確に表し、導入句に続くヨハネ的な調子を保った。
- source_word: ὁ πιστεύων
  choice: 信じる者
  rationale: 冠詞付き現在分詞が表す、信じる人を指す実体的用法を簡潔に再現した。日本語では「信じている者」も可能だが、過度に継続性を強調しない自然な表現を選んだ。
- source_word: ἔχει
  choice: 持っています
  rationale: 現在形を保持し、永遠の命が将来だけでなく現在すでに与えられているという本文の主張を示した。
- source_word: ζωὴν αἰώνιον
  choice: 永遠の命
  rationale: ヨハネ文書の定着した自然な日本語であり、単なる無限の持続だけに限定せず、αἰώνιος の意味の広がりを保てる。
theological_decisions:
- issue: 永遠の命を現在持つこと
  choice: 永遠の命を持っています
  alternative: 永遠の命を持つようになります／持つでしょう
  rationale: ギリシア語の ἔχει は現在形であるため、未来に言い換えず、現在的な所有という神学的緊張をそのまま残した。
- issue: 信じる者の表現範囲
  choice: 信じる者
  alternative: 信じる人はだれでも
  rationale: ὁ πιστεύων は一般的な範囲を持ち得るが、本文自体は冠詞付き現在分詞であるため、普遍性を明示的に補わず、原文の形に近い表現を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの宣言の厳粛さと反復を保持した。「持っています」により現在時制を明示し、過度に古風な文語や教派固有の語法は避けた。
