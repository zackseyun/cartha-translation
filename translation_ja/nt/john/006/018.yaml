  text: ἥ τε θάλασσα ἀνέμου μεγάλου πνέοντος ⸀διεγείρετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/018.yaml
  text: And the sea was being stirred up because a strong wind was blowing[a].
translation:
  language: ja
  text: そして、強い風が吹いていて、湖は荒れていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「湖はかき立てられていた」または「湖は波立っていた」。
    reason: διεγείρετο は、風によって水面がかき立てられ、荒れた状態が続くことを表し得る。
lexical_decisions:
- source_word: ἥ τε θάλασσα
  choice: 湖は
  rationale: θάλασσαは一般には「海」だが、文脈上はガリラヤ湖を指す。現代日本語でこの水域を自然かつ明確に表すため「湖」とした。τεの軽い接続は、日本語では前後の文脈によって十分伝わるため、独立した接続語を置かなかった。
- source_word: ἀνέμου μεγάλου
  choice: 強い風
  rationale: ἄνεμοςは「風」、μέγαςはここでは風の強さを表す。日本語の自然な気象表現として「強い風」とした。
- source_word: πνέοντος
  choice: 吹いていたので
  rationale: 現在分詞が風の継続的な状態と、湖が荒れる状況的・因果的背景を示すため、継続を表す「吹いていた」と因果を示す「ので」で訳した。
- source_word: διεγείρετο
  choice: 荒れ始めていた
  rationale: 未完了過去受動形が、湖面がかき立てられて荒れていく進行中の様子を示す。「荒れていた」だけより動的な変化を伝えるため「荒れ始めていた」としたが、開始局面そのものを明示する語ではないため別訳を脚注に示した。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準日本語を用いた。「海」ではなく、日本語でガリラヤ湖を指す通常の表現である「湖」を採用した。進行中の情景を保ちつつ、簡潔で朗読しやすい文に整えた。
