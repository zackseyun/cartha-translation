  text: ὡς δὲ ἐνεπλήσθησαν λέγει τοῖς μαθηταῖς αὐτοῦ· Συναγάγετε τὰ περισσεύσαντα κλάσματα, ἵνα μή τι ἀπόληται.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/012.yaml
  text: And when they were filled[a], he says to his disciples, “Gather up the leftover pieces[d][c][b], so that nothing may be lost.”
translation:
  language: ja
  text: 彼らが満腹になったとき、イエスは弟子たちに言われた[a]。「余ったパン切れを集めなさい。一つも失われないように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、物語を生き生きと語る歴史的現在で「言う」となっている。日本語では自然な過去形で訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς δὲ ἐνεπλήσθησαν
  choice: 彼らが満腹になると
  rationale: 食物によって満たされ、十分に食べたことを、現代日本語で自然かつ簡潔に表す。δὲは日本語の流れの中で明示せず、時間的な接続を「すると」で示した。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、日本語の物語文では過去形が自然である。イエスに対する丁寧さを保つため尊敬表現とした。
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: 弟子たちに
  rationale: 「弟子」は福音書における μαθητής の標準的で明確な訳語。所有者は文脈上明白なので「ご自分の」を補わない。
- source_word: Συναγάγετε
  choice: 集めなさい
  rationale: 直接的な命令を、自然で威圧的すぎない日本語の命令表現で示す。
- source_word: τὰ περισσεύσαντα κλάσματα
  choice: 余ったパン切れ
  rationale: κλάσματα はパンを裂いて生じた断片を指し、直前の文脈からパンであることが明白。「余ったパン切れ」は日本語として自然で、περισσεύσαντα と κλάσματα の双方を表す。
- source_word: ἵνα μή τι ἀπόληται
  choice: 一つも失われないように
  rationale: 否定を伴う不定代名詞 τι を「一つも」と表し、ἀπόληται の基本的な「失われる」を保持する。「無駄にならない」より字義に近く、ヨハネ文書にあり得る語感も解釈で消さない。
theological_decisions:
- issue: しるしの文脈における ἀπόληται の神学的な含意
  choice: 「失われない」と訳し、直接には残ったパン切れを指す表現として保持した。
  alternative: 「無駄にならない」と実際的な意味に限定して訳す、または「滅びない」と強い神学的響きを持たせる。
  rationale: 直接の文脈は残った食物の回収である一方、ヨハネ福音書における「失う／滅びる」という語の響きを翻訳で完全に消すべきではない。「失われない」は、物質的な指示対象を自然に表しつつ、可能な文学的・神学的共鳴を断定しない。
translation_notes:
  register: 明瞭な現代標準日本語。福音書としての品位を保ちながら、古風な言い回しは避けた。イエスの発話導入には自然な尊敬表現を用いた。
