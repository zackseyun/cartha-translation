  text: ἦν δὲ ἐγγὺς τὸ πάσχα, ἡ ἑορτὴ τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/004.yaml
  text: The Passover[a], the feast of the Jews, was near.
translation:
  language: ja
  text: ユダヤ人の祭りである過越祭[a]が近づいていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々の祭り」とも訳せる。原語は文脈により、ユダヤ人一般またはユダヤ地方の人々を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （独立した語としては訳出しない）
  rationale: 弱い接続辞で、ここでは物語の進行・場面設定を示す。日本語では文脈によって自然に表せるため、「さて」などを機械的に加えない。
- source_word: ἐγγὺς
  choice: 近づいていた
  rationale: ἦν とともに時間的な近さを表す。祭りの日が迫っていることを自然な現代日本語で示す。
- source_word: πάσχα
  choice: 過越祭
  rationale: ユダヤ教の過越の祭りを指す、日本語聖書・一般用語として定着した訳語。
- source_word: ἑορτὴ
  choice: 祭り
  rationale: 宗教的な祝祭を表す。現代の一般読者に明瞭で、文脈にもふさわしい。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人の
  rationale: Ἰουδαῖοι は文脈により「ユダヤ人」または「ユダヤ地方の人々」を表し得るが、ここでは過越祭を民族的・宗教的な祭りとして説明しているため、「ユダヤ人」が自然である。
theological_decisions:
- issue: ヨハネ文書における Ἰουδαίων の訳し方
  choice: ユダヤ人の祭り
  alternative: ユダヤ地方の人々の祭り
  rationale: 語自体には地域的意味の可能性もあるが、この箇所では過越祭がユダヤ人全体に属する宗教的祭りであることを説明していると読むのが文脈上自然である。一方、原語の語義上の幅は脚注で示す。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「ユダヤ人の祭りである」を同格説明として先に置き、過越祭について知らない読者にも理解しやすくした。
