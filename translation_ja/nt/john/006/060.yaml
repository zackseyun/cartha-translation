id: JHN.6.60
reference: John 6:60
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πολλοὶ οὖν ἀκούσαντες ἐκ τῶν μαθητῶν αὐτοῦ εἶπαν· Σκληρός ἐστιν ⸂ὁ λόγος οὗτος⸃· τίς δύναται αὐτοῦ ἀκούειν;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/060.yaml
  text: Therefore many of his disciples[a], when they heard it, said, “This word is hard[b]; who can listen to it?”
translation:
  language: ja
  text: そこで、弟子たちのうち多くの者が、これを聞いて言った。「これは厳しいことばだ[a]。だれがこれに耳を傾けることができようか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これは受け入れがたい話だ」「これは厳しい教えだ」とも訳せる。ここで「ことば」と訳したλόγοςは、「発言」「話」「教え」「メッセージ」を意味し得る。
    reason: lexical_alternative
  - marker: b
    text: 「だれがこれを聞くことができようか」「だれがこれを聞き入れることができようか」とも訳せる。ギリシア語の動詞は、文脈により「聞く」「耳を傾ける」「聞き入れる」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ … ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 弟子たちのうち多くの者
  rationale: 話した者たちが、イエスの弟子たちという広い集団の中の多数であったことを明確かつ自然に表す。
- source_word: οὖν
  choice: そこで
  rationale: 直前の教えを受けた展開・帰結を示しつつ、現代日本語の物語文として自然である。
- source_word: ἀκούσαντες
  choice: これを聞いて
  rationale: アオリスト分詞の時間的な働きを自然に表す。「これ」は直前のイエスの教えを指す文脈上の補足である。
- source_word: Σκληρός
  choice: 厳しい
  rationale: 単に知的に難解というだけでなく、受け止めにくい、耐えがたい、手厳しいという幅を保てる。
- source_word: ὁ λόγος οὗτος
  choice: これは…ことばだ
  rationale: λόγοςが直前に語られた発言・教えを指すことを示しながら、「教え」など一つの意味に限定しない。
- source_word: τίς δύναται αὐτοῦ ἀκούειν
  choice: だれがこれを聞いていられよう
  rationale: 能力を問う修辞疑問を簡潔に表し、ἀκούωの「聞く」「耳を傾ける」「聞き入れる」という意味の広がりと、聞き続けることへの耐えがたさを保つ。
theological_decisions:
- issue: 弟子たちがイエスのことばを「厳しい」と評した意味
  choice: そのことばが受け止めにくく厳しいという表現にとどめ、困難の性質を限定しない。
  alternative: 「理解しにくい」「不快だ」「受け入れられない」など、知的・感情的・道徳的な理由のいずれかに限定する。
  rationale: σκληρόςは、難しさ、厳しさ、耳障りさ、耐えがたさを含み得るため、本文ではその緊張を残す。
- issue: ἀκούεινが含む応答の度合い
  choice: 「聞いていられよう」とし、聴取と受容の両方を含み得る表現にする。
  alternative: 「受け入れられよう」として、明確な受容・服従の意味に限定する。
  rationale: 文脈上は単なる音声の聴取以上を示唆するが、語そのものを「受け入れる」と断定せず、多義性を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「厳しいことば」と「聞いていられよう」により、弟子たちの反発の強さを自然に示しつつ、知的な難解さ、心理的な不快感、受容の困難さのいずれか一つに意味を狭めない。
