id: JHN.6.63
reference: John 6:63
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ πνεῦμά ἐστιν τὸ ζῳοποιοῦν, ἡ σὰρξ οὐκ ὠφελεῖ οὐδέν· τὰ ῥήματα ἃ ἐγὼ ⸀λελάληκα ὑμῖν πνεῦμά ἐστιν καὶ ζωή ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/063.yaml
  text: It is the Spirit who gives life[a]; the flesh benefits nothing[c][b]. The words that I have spoken to you are spirit and are life.
translation:
  language: ja
  text: 命を与えるのは聖霊である[a]。肉は何の役にも立たない[b]。わたしがあなたがたに語った言葉は、霊であり、命である[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「聖霊」は「霊」とも訳せる。ギリシア語 πνεῦμα は「聖霊」と「霊」のどちらも意味し得るが、ここでは文脈上、聖霊を指す可能性が高い。
    reason: alternative_reading
  - marker: b
    text: 「肉」は、単に人間的なものを広く指す可能性がある。ここで「罪深い性質」と訳すと、原文が求める以上に意味を限定することになる。
    reason: lexical_alternative
  - marker: c
    text: 「霊であり、命である」は、「聖霊であり、命である」または「霊的で、命を与える」とも理解できる。ギリシア語は簡潔で、性質を表す表現である。
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 定冠詞を伴う主語であり、ヨハネ福音書の文脈では命を与える聖霊を指す可能性が高い。「聖霊」と補い切らず「御霊」として、原文の語形に近く保った。
- source_word: ζῳοποιοῦν
  choice: 命を与える
  rationale: 「生かす、命を与える」という現在分詞の働きを、自然な現代日本語の動詞表現で示した。
- source_word: ἡ σὰρξ
  choice: 肉
  rationale: 身体、単なる人間的なものなどを含み得る広い語義を保ち、「罪深い性質」のような限定的解釈を訳文に持ち込まないため。
- source_word: οὐκ ὠφελεῖ οὐδέν
  choice: 何の役にも立たない
  rationale: 利益や助けを全くもたらさないという強い否定を、明瞭で自然な日本語にした。
- source_word: τὰ ῥήματα
  choice: 言葉
  rationale: 口に出された発言を指す語であり、文脈上「言葉」が簡潔で自然である。
- source_word: λελάληκα
  choice: 語った
  rationale: イエスがすでに語り、その言葉が今も意味を持つという完了形を、日本語で過度に説明せず自然に表した。
- source_word: πνεῦμά ἐστιν
  choice: 霊である
  rationale: 無冠詞の述語が持つ性質的で圧縮された表現を保ち、「霊的である」や「御霊そのものである」と解釈を限定しなかった。
- source_word: ζωή
  choice: 命
  rationale: ヨハネ福音書で重要な神学的含意を持つ「命」を、直接的かつ一貫して訳した。
theological_decisions:
- issue: 最初の πνεῦμα が指すもの
  choice: 聖霊を指す可能性が高いものとして「御霊」
  alternative: 一般的な霊、または人間の霊として「霊」
  rationale: ヨハネ福音書では命を与える働きが聖霊と強く結びつき、定冠詞も特定の指示対象を示唆する。ただし語そのものの曖昧さは脚注に残した。
- issue: 御霊と対照される σάρξ の意味
  choice: 意味を限定せず「肉」
  alternative: 罪深い性質、人間的な力、身体
  rationale: 原文の広さと神学的緊張を保ち、特定の人間論へ狭めないため。
- issue: 結びの πνεῦμά ἐστιν の述語的意味
  choice: 性質を表す圧縮表現として「霊である」
  alternative: 「御霊である」または「霊的で、命を与える」
  rationale: 無冠詞の述語は性質的に理解できるが、原文は簡潔で多義的であるため、説明的に言い換えず脚注で主要な可能性を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「御霊」は第一節の有力な指示対象を示しつつ脚注で語義上の曖昧さを保存し、後半では無冠詞述語の質的な響きを保つため「霊」とした。「肉」は解釈的に言い換えず、原文の対照と緊張を残した。
