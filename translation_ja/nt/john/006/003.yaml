  text: ἀνῆλθεν δὲ εἰς τὸ ⸀ὄρος Ἰησοῦς, καὶ ἐκεῖ ἐκάθητο μετὰ τῶν μαθητῶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/003.yaml
  text: Then Jesus went up on the mountain, and there he sat with his disciples.
translation:
  language: ja
  text: それから、イエスは山に登り、そこで弟子たちと一緒に座っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθεν
  choice: 登り
  rationale: 山への上方移動を表す通常の物語表現として「登る」が自然であり、文脈にも即している。
- source_word: δὲ
  choice: それから
  rationale: 強い対照ではなく物語の進行を示すため、現代日本語で自然な「それから」とした。
- source_word: εἰς τὸ ὄρος
  choice: 山に
  rationale: ἀνῆλθενとの組み合わせで、特定の山または山地へ登ることを表す。「その山に」とすると、日本語では既出の山を指す含みが原文以上に強くなりうるため、「山に」とした。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語聖書で定着した標準的な表記を用いた。
- source_word: ἐκεῖ
  choice: そこで
  rationale: 先に述べた場所での次の動作を自然につなぐ場所表現である。
- source_word: ἐκάθητο
  choice: 座っておられた
  rationale: 未完了過去が描く継続的・場面設定的な着座状態を表す。「おられた」はイエスを主語とする日本語として自然な敬意を保つが、神学的称号を付加するものではない。
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: 弟子たちと一緒に
  rationale: μετάの同伴関係と、μαθητήςの師に従う者という福音書での定着した意味を明瞭に表す。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、簡潔な物語調と品位を保った。原文の語順に無理に拘束されず、移動の後にその場所で弟子たちと座るという場面の流れを自然に示した。
