id: JHN.6.42
reference: John 6:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἔλεγον· ⸀Οὐχ οὗτός ἐστιν Ἰησοῦς ὁ υἱὸς Ἰωσήφ, οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα; πῶς ⸀νῦν ⸀λέγει ὅτι Ἐκ τοῦ οὐρανοῦ καταβέβηκα;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/042.yaml
  text: And they were saying, “Is this not Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”
translation:
  language: ja
  text: そして彼らは言っていた。「これはヨセフの息子イエスではないか。私たちはその父も母も知っている。それなのに、どうして今、『私は天から下って来た』と言うのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了時制が示す継続的または反復的な発言を、自然な日本語で保持する。
- source_word: Οὐχ οὗτός ἐστιν
  choice: これは…ではないか
  rationale: 同意を予期する否定疑問の修辞的な力を、現代日本語の自然な形で表す。
- source_word: ὁ υἱὸς Ἰωσήφ
  choice: ヨセフの息子
  rationale: 属格構文を明瞭に訳し、群衆が知っているとするイエスの人間的な家族背景への強調を保つ。
- source_word: οὗ ἡμεῖς οἴδαμεν τὸν πατέρα καὶ τὴν μητέρα
  choice: 私たちはその父も母も知っている
  rationale: 関係節の内容と、父母の双方を知っているという彼らの主張を自然な日本語で表す。
- source_word: πῶς νῦν λέγει
  choice: それなのに、どうして今…と言うのか
  rationale: πῶςの基本義「どうして／どのように」とνῦν、現在時制のλέγειを保ちつつ、既知の家族背景との対照を自然に示す。「言えるのか」のような可能の意味は加えない。
- source_word: Ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 起源・出所を示すἐκ＋属格を、簡潔で標準的な日本語にする。
- source_word: καταβέβηκα
  choice: 下って来た
  rationale: 完了形が示す完了した下降と現在への関わりを文脈上自然に表す。日本語では引用内の過去形が発言時までに完了した出来事を表し、「降臨した」のような解釈的・専門的表現を避ける。
theological_decisions:
- issue: イエスが天に起源を持つとの主張に対する群衆の反論
  choice: 「私は天から下って来た」という直接的な主張をそのまま保つ。
  alternative: 「私は天から来た」または比喩的・説明的な言い換え
  rationale: 本文は、地上の家族を知っているという群衆の認識と、イエスの天からの下降の主張との緊張を示す。どちらかを説明によって解消せず、原文の神学的緊張を保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、引用部分には品位を保った。「父親」「母親」より簡潔な「父」「母」を選び、原文の反復的な発話の相は「言っていた」で示した。
