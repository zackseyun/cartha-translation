id: JHN.6.26
reference: John 6:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν, ζητεῖτέ με οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι ἐφάγετε ἐκ τῶν ἄρτων καὶ ἐχορτάσθητε·
base_translation:
  language: en
  yaml_path: translation/nt/john/006/026.yaml
  text: Jesus answered them[a], “Truly, truly, I say to you, you are seeking me not because you saw signs, but because you ate of the loaves and were filled.
translation:
  language: ja
  text: イエスは彼らに答えて言われた。「まことに、まことに、あなたがたに言います。あなたがたがわたしを捜しているのは、しるしを見たからではなく、パンを食べて満腹したからです。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「パン」は複数形で、「パンから食べて、満たされたから」と表現されている。「満腹した」と訳した語は、「十分に食べて満たされた」「満足した」とも訳せる。
    reason: ἐκ τῶν ἄρτωνの複数形と分有的な含み、およびἐχορτάσθητεの語義の幅を、不自然な擬似逐語訳を避けて示すため。
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: イエスは彼らに答えて言われた
  rationale: ギリシア語の重ねた発話導入を日本語でも無理なく保持し、丁寧で荘重な物語文とした。
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: まことに、まことに、あなたがたに言います
  rationale: ヨハネ特有の二重のἀμήνと、続く厳粛な宣言形式を明瞭に保った。
- source_word: ζητεῖτέ με
  choice: あなたがたがわたしを捜している
  rationale: 現在形が示す継続中の行為を「捜している」で表した。文脈上、所在を求めて来たことを自然に示す。
- source_word: οὐχ ὅτι εἴδετε σημεῖα ἀλλ’ ὅτι
  choice: しるしを見たからではなく、…からです
  rationale: 理由を対比する構文を、明快な「からではなく、…から」で再現した。
- source_word: σημεῖα
  choice: しるし
  rationale: 単なる奇跡ではなく、イエスを指し示す出来事というヨハネ特有の含意を保持した。
- source_word: ἐφάγετε ἐκ τῶν ἄρτων
  choice: パンを食べて
  rationale: ἐκの分有的意味と複数形ἄρτωνは、直訳的な「パン々から」では不自然になるため、既出の複数のパンを集合的に表す自然な日本語とした。
- source_word: ἐχορτάσθητε
  choice: 満腹した
  rationale: 食物によって十分に満たされたという動詞の具体的意味を簡潔に表した。
theological_decisions:
- issue: σημεῖαのヨハネ文書における意味
  choice: しるし
  alternative: 奇跡／奇跡的なしるし
  rationale: 業そのものの驚異性だけでなく、それが指し示す意味を残し、説明的な語を本文へ加えないため。
- issue: 群衆の動機に関する対比
  choice: 「しるしを見たからではなく、パンを食べて満腹したから」
  alternative: しるしの意味を悟らなかったので、食物だけを求めた
  rationale: 原文は「見る」と満腹を理由として対比するが、「悟る」と明言してはいないため、その神学的含意を本文で説明しすぎず緊張を保った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、イエスの宣言には荘重さを保った。「まことに、まことに」はヨハネ特有の反復を残し、「しるし」は書全体の重要語として統一可能な表現とした。
