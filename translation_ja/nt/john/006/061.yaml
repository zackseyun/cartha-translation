id: JHN.6.61
reference: John 6:61
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ ὅτι γογγύζουσιν περὶ τούτου οἱ μαθηταὶ αὐτοῦ εἶπεν αὐτοῖς· Τοῦτο ὑμᾶς σκανδαλίζει;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/061.yaml
  text: But Jesus[a], knowing in himself that his disciples were grumbling about this, said to them, “Does this offend you?"
translation:
  language: ja
  text: しかしイエスは、弟子たちがこのことについて不平を言っているのを、ご自身で知って、彼らに言われた。「このことは、あなたがたをつまずかせるのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このことは、あなたがたの気に障るのか」。ここで「つまずかせる」は、不快にさせるだけでなく、信じることを妨げるという意味を含みうる。
    reason: σκανδαλίζειの感情的な反発と、信仰上のつまずきという語義の幅を示すため。
lexical_decisions:
- source_word: εἰδὼς δὲ ὁ Ἰησοῦς ἐν ἑαυτῷ
  choice: しかしイエスは……自ら知り
  rationale: 分詞の同時的な意味を自然な日本語で表し、ἐν ἑαυτῷが示す、外から知らされたのではない内的な認知を「自ら」で簡潔に保った。
- source_word: γογγύζουσιν
  choice: 不平をつぶやいている
  rationale: 不満を小声で口にする語感を明確にし、単なる会話や公然たる抗議とは区別した。
- source_word: περὶ τούτου
  choice: このことについて
  rationale: 直前のイエスの発言を指す指示性を保ち、「教え」など原文にない説明語を加えなかった。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たち
  rationale: 文脈上、所有関係は日本語では明白であるため、不自然な「彼の弟子たち」を避けた。十二人だけに限定する表現にもしていない。
- source_word: σκανδαλίζει
  choice: つまずかせる
  rationale: 単なる感情的な不快感に狭めず、受け入れを妨げ、離反を招きうる比喩的・神学的な幅を保った。
theological_decisions:
- issue: σκανδαλίζειが表す、不快感と信仰上のつまずきの重なり
  choice: このことが、あなたがたをつまずかせるのか。
  alternative: このことが、あなたがたの気に障るのか。／このことに、あなたがたはつまずくのか。
  rationale: 使役形はギリシア語の構文を保ちつつ、「つまずく」が持つ拒絶や離反の可能性も残す。「気に障る」だけでは感情的な不快感に狭まりうるため、脚注でその語義を補った。
translation_notes:
  register: 明快で現代的ながら、聖書本文としての品位を保つ文体。「言われた」でイエスへの敬意を自然に示し、引用文は簡潔な問いとして原文の緊張感を維持した。
