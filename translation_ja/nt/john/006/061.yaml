  terminology: 「弟子たち」「つまずかせる」は適切です。「ご自身で」「言われた」は本文の品位を保ちつつ過度に古風ではありません。脚注は主文の語義の幅を適切に示していますが、別訳は主文と同じく主題を明示した形に整えます。
