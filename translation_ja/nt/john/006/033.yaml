  text: ὁ γὰρ ἄρτος τοῦ θεοῦ ἐστιν ὁ καταβαίνων ἐκ τοῦ οὐρανοῦ καὶ ζωὴν διδοὺς τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/033.yaml
  text: For the bread of God is the one who comes down from heaven and gives life to the world[a].
translation:
  language: ja
  text: というのは、神のパンは、天から下って来て世に命を与える方だからである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天から下って来て、世に命を与えるもの」。ギリシア語では「パン」が男性名詞であるため、男性形の分詞だけでは人格的な指示かどうかは決まらない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρτος
  choice: パン
  rationale: 比喩の基盤となる具体的な語を保ち、「食物」などへ一般化しない。
- source_word: τοῦ θεοῦ
  choice: 神の
  rationale: 属格の簡潔な形を保ち、神に属するもの、また神から与えられるものという含みを文脈に委ねる。
- source_word: ὁ καταβαίνων
  choice: 下って来て……方
  rationale: 男性単数の冠詞付き分詞が示す人格的な指示を自然な日本語で表す。現在分詞の継続的・特徴的な動作は「下って来て」によって伝える。
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: 天から
  rationale: 起源を示すἐκを、明瞭で自然な日本語として訳す。
- source_word: ζωὴν
  choice: 命
  rationale: ヨハネ文書で重要な語の簡潔さと重みを保つ。
- source_word: διδοὺς
  choice: 与える
  rationale: 「下って来る」と並ぶ、その方の特徴的な働きを自然な現在形で示す。
- source_word: τῷ κόσμῳ
  choice: 世に
  rationale: ヨハネにおけるκόσμοςの広がりを保ち、「人類」や「すべての人」へ狭く限定しない。
- source_word: γὰρ
  choice: とは……ことである
  rationale: 日本語では独立した「というのは」を置くより、直前の発言を説明する定義文として表すほうが自然であり、γάρの説明的なつながりを文型に織り込める。
theological_decisions:
- issue: 「神のパン」と男性単数の分詞ὁ καταβαίνων、διδοὺςの人格的・非人格的解釈
  choice: 「天から下って来て、世に命を与える方」
  alternative: 「天から下って来て、世に命を与えるもの」
  rationale: パンという概念自体は非人格的にも理解できるが、ギリシア語の男性単数形は人格的な指示を強く示唆し、文脈上もイエスの自己提示を先取りする。ただし別解の余地は脚注に残す。
- issue: κόσμοςの範囲
  choice: 「世」
  alternative: 「人類」または「すべての人」
  rationale: 命を与える働きの広がりを本文どおり保ち、その範囲や適用をめぐる神学的論点を翻訳で先取りして限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書本文にふさわしい簡潔で格調ある調子とした。「方」により人格性を示し、「世」「命」というヨハネ的な主要語を簡潔に保持した。
