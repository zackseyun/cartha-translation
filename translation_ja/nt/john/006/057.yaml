id: JHN.6.57
reference: John 6:57
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καθὼς ἀπέστειλέν με ὁ ζῶν πατὴρ κἀγὼ ζῶ διὰ τὸν πατέρα, καὶ ὁ τρώγων με κἀκεῖνος ⸀ζήσει δι’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/057.yaml
  text: Just as the living Father sent me[a], and I live because of the Father[b], so also the one who feeds on me will live because of me.
translation:
  language: ja
  text: 生ける父がわたしを遣わし、わたしが父のゆえに生きているのと同じように、わたしを食べる者[a]もまた、わたしのゆえに生きる。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしを食している者」。ギリシア語の動詞は具体的で鮮明な語で、文字どおりには食べること、かんで食べることを指す。
    reason: lexical_alternative
  - marker: b
    text: 「父によって生きている」「わたしによって生きる」とも訳せる。ギリシア語の前置詞は、原因・根拠とも手段・媒介とも理解し得る。本文では、父と子、子と食べる者との並行を保つため、原因・根拠の意味に訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς
  choice: …のと同じように
  rationale: 文全体を支配する比較を自然な現代日本語で明示し、後半の「もまた」と対応させた。
- source_word: ὁ ζῶν πατὴρ
  choice: 生ける父
  rationale: ζῶνの属性的用法とヨハネ福音書の「命」の主題を簡潔に保つ。「命を与える父」として意味を狭めない。
- source_word: ἀπέστειλέν με
  choice: わたしを遣わし
  rationale: アオリストの出来事を端的に表し、「任命した」などの限定的な意味を加えない。
- source_word: ζῶ
  choice: 生きている
  rationale: 現在の継続的な生を表し、後半の「生きる」との語の連関を保つ。
- source_word: διὰ τὸν πατέρα
  choice: 父のゆえに
  rationale: διά＋対格の原因・根拠の意味を表し、後半のδι’ ἐμέとの並行を保つ。
- source_word: ὁ τρώγων με
  choice: わたしを食べる者
  rationale: τρώγωの具体的で鮮明な「食べる」意味を保ち、聖餐的解釈にも比喩的解釈にも限定しない。
- source_word: κἀκεῖνος
  choice: 者もまた
  rationale: 強意を伴う「その者も」を自然な日本語で表し、父・子と子・食べる者との対応を示す。
- source_word: ζήσει
  choice: 生きる
  rationale: 未来の生を日本語の非過去形で自然に表し、ζῶとの語彙的な並行を維持する。
- source_word: δι’ ἐμέ
  choice: わたしのゆえに
  rationale: 前半と同じく原因・根拠として訳し、父と子、子と信じる者の関係の並行を明確にする。
theological_decisions:
- issue: διὰ τὸν πατέραが示す御子と父との関係
  choice: 「父のゆえに生きている」と原因・根拠を表す訳にした。
  alternative: 「父によって生きている」
  rationale: 本文が示す関係的な依存と並行構造を保ちつつ、御子の本質や位格間の関係について本文以上の結論を訳文に持ち込まない。
- issue: ὁ τρώγων μεの聖餐的意味と比喩的意味
  choice: 具体的に「わたしを食べる者」と訳した。
  alternative: 「わたしに養われる者」
  rationale: ギリシア語の具体性を残し、聖餐のみ、または信仰による結合のみへと解釈を限定せず、本文の神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「生ける父」「遣わす」に聖書本文にふさわしい簡潔で dignified な格調を持たせた。「わたし」は話者であるイエスの一人称として平仮名表記に統一した。
