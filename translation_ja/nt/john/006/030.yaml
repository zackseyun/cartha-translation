id: JHN.6.30
reference: John 6:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπον οὖν αὐτῷ· Τί οὖν ποιεῖς σὺ σημεῖον, ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι; τί ἐργάζῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/006/030.yaml
  text: So they said to him[a], “Then what sign are you doing, so that we may see and believe you? What work are you doing?”
translation:
  language: ja
  text: そこで彼らはイエスに言った。「では、私たちが見て、あなたの言うことを信じる[a]ために、あなたはどんなしるしを行うのですか。どんなわざをするのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたを信じる」「あなたを信頼する」。ギリシア語は πιστεύω に与格の「あなた」を伴う表現であり、ヨハネ福音書でより一般的な πιστεύω εἰς（「あなたを信じる」「あなたに信仰を置く」）とは構文が異なる。
    reason: πιστεύω + 与格 σοι の意味の幅を示しつつ、πιστεύω εἰς との相違を、日本語として自然かつ構文上正確に説明するため。
lexical_decisions:
- source_word: εἶπον οὖν αὐτῷ
  choice: そこで彼らはイエスに言った
  rationale: οὖνが前の発言を受ける推論的・継起的なつながりを「そこで」で自然に示した。αὐτῷの指示対象は文脈上イエスなので、日本語では固有名を補って明確にした。
- source_word: Τί οὖν
  choice: では、…どんな
  rationale: 繰り返されたοὖνを「では」で残し、相手に証拠を迫る問いの調子を保った。
- source_word: ποιεῖς σὺ σημεῖον
  choice: どんなしるしを行うのですか
  rationale: σημεῖονはヨハネ福音書で、出来事そのものを越えた意味を指し示す重要語なので、解釈を加えた「奇跡」ではなく「しるし」とした。明示されたσὺの強調は、文脈と丁寧な問いかけの中で自然に伝わる形にした。
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμέν σοι
  choice: 私たちが見て、あなたの言うことを信じるために
  rationale: ἵναと接続法が示す目的を「ために」で表した。πιστεύωが与格σοιを伴うため、ヨハネで一般的な「あなたを信じる」という対人的信仰の表現に一義化せず、「あなたの言うことを信じる」とした。
- source_word: τί ἐργάζῃ
  choice: どんなわざをするのですか
  rationale: ἐργάζομαιの働き・業という含みを「わざ」で示し、直前の問いとの修辞的な並行を保った。
theological_decisions:
- issue: 与格σοιを伴うπιστεύωの意味
  choice: あなたの言うことを信じる
  alternative: あなたを信じる／あなたを信頼する
  rationale: 原文は、ヨハネに多いπιστεύω εἰς（人を信じる、信仰を置く）ではなく与格代名詞を用いている。その構文差を保ち、イエスの主張を真実として受け入れる意味を本文に示しつつ、より広い信頼の意味も脚注で認めた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会衆朗読にも耐える品位を保った。「しるし」「わざ」はヨハネ福音書の語彙的・神学的響きを残すため、平仮名表記とした。
