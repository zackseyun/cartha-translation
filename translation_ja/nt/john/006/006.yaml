  text: τοῦτο δὲ ἔλεγεν πειράζων αὐτόν, αὐτὸς γὰρ ᾔδει τί ἔμελλεν ποιεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/006.yaml
  text: But he was saying this to test him[a], for he himself knew what he was about to do.
translation:
  language: ja
  text: しかし、イエスがこう言われたのは、フィリポを試すためであった。[a] イエスご自身は、何をしようとしておられるのかを知っておられたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「試みるため」とも訳せる。この動詞には「誘惑する」という意味もあるが、ここでは相手を試し、その応答を確かめる意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ ἔλεγεν
  choice: しかし、イエスがこう言われたのは
  rationale: τοῦτοは直前の問いを受けて「こう」とし、δὲの穏やかな対照を「しかし」で表した。ἔλεγενの未完了相は、日本語では不自然な進行形を避けつつ文脈上の発言として自然に訳した。主語「イエス」は文脈から補い、指示対象を明確にした。
- source_word: πειράζων αὐτόν
  choice: フィリポを試すため
  rationale: 文脈では罪へ誘う「誘惑する」ではなく、フィリポの理解や応答を試す意味である。分詞の目的的な働きを自然な日本語で示した。αὐτόνの指示対象は直前の文脈にあるフィリポとして明示した。
- source_word: αὐτὸς γὰρ ᾔδει
  choice: ご自分では……分かっておられたからである
  rationale: αὐτόςの強調を「ご自分では」で保持し、γάρの説明関係を文末の「からである」で表した。ᾔδειは継続的な知識状態を自然な敬語表現で訳した。
- source_word: τί ἔμελλεν ποιεῖν
  choice: 何をしようとしているのか
  rationale: μέλλω＋不定詞が持つ予定・意図・間近な行為という幅を、過度に限定しない「しようとしている」で表した。
theological_decisions:
- issue: πειράζωνが表すイエスの行為
  choice: 「試す」と訳す
  alternative: 「誘惑する」「試みる」
  rationale: この場面では悪へ誘う意味ではなく、フィリポの理解や応答を試す行為を指す。「試す」はその文脈的意味を明瞭にしつつ、試験の具体的内容までは補わない。
- issue: イエスの認識に対するαὐτόςの強調
  choice: 「ご自分では……分かっておられた」と強調を保持する
  alternative: 単に「分かっておられた」
  rationale: 明示された代名詞αὐτόςの対照的・強調的な働きを保ち、イエスが行おうとすることをすでに把握していたという本文の叙述を、その範囲を超えて教理的に拡張せずに示した。
- issue: ἔμελλεν ποιεῖνにおける意図と切迫性
  choice: 「何をしようとしているのか」
  alternative: 「何をするつもりか」「何をしようとしておられるか」
  rationale: 意図と目前の行為の両方を含み得る原文の幅を保つため、どちらか一方に固定しすぎない表現を採用した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。イエスへの敬語は福音書本文として自然な「言われた」「分かっておられた」を用いた。脚注記号[a]は対応箇所の直後に置いた。
