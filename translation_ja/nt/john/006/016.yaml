lexical_decisions:
- source_word: Ὡς δὲ
  choice: 〜になると
  rationale: ὡςの時間的な移行を自然な日本語で示す。δέの弱い接続機能は文脈上明白であり、不要な「さて」などは加えない。
- source_word: ὀψία ἐγένετο
  choice: 夕方になる
  rationale: 夕方の到来を表すギリシア語の慣用表現を、明快で自然な現代日本語にした。
- source_word: κατέβησαν
  choice: 下って行った
  rationale: καταβαίνωの下方への移動を保ち、語り手の視点に合う「行った」を用いた。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たち
  rationale: 直訳は「彼の弟子たち」だが、直前までの文脈でイエスの弟子であることが明白なため、日本語として自然に所有表現を省いた。
- source_word: ἐπὶ τὴν θάλασσαν
  choice: 湖へ
  rationale: ἐπί＋対格の移動先を「へ」で示した。θάλασσα自体は「海」だが、指示対象はガリラヤ湖であり、日本語の通常の地理的呼称を本文に採用し、原語の字義は注記した。
