id: JHN.6.19
reference: John 6:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐληλακότες οὖν ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα θεωροῦσιν τὸν Ἰησοῦν περιπατοῦντα ἐπὶ τῆς θαλάσσης καὶ ἐγγὺς τοῦ πλοίου γινόμενον, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/006/019.yaml
  text: So when they had rowed about twenty-five or thirty stadia[a], they saw Jesus walking on the sea and coming near the boat[b], and they were afraid.
translation:
  language: ja
  text: こうして、二十五ないし三十スタディオン[a]ほどこぎ進んだとき、彼らはイエスが湖の上[b]を歩いて舟に近づいて来るのを見て、恐れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一スタディオンは古代の距離の単位。二十五ないし三十スタディオンは、およそ五〜六キロメートル。
    reason: cultural_note
  - marker: b
    text: ギリシア語では直訳すると「海の上」。「海」はここではガリラヤ湖を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐληλακότες
  choice: こぎ進んだ
  rationale: ἐλαύνωはこの航行の文脈では、舟をこいで進めることを表す。完了分詞による先行動作は「こぎ進んだころ」と自然に表現した。
- source_word: οὖν
  choice: こうして
  rationale: 前節からの物語の進行と成り行きを示す接続辞。現代日本語で自然に流れをつなぐ。
- source_word: ὡς σταδίους εἴκοσι πέντε ἢ τριάκοντα
  choice: 二十五ないし三十スタディオンほど
  rationale: ὡςの概数を「ほど」で示し、古代の距離単位スタディオンは本文に保持した。現代の概算距離は脚注で補う。
- source_word: θεωροῦσιν
  choice: 見て
  rationale: 意識的な視認を表し得るが、この物語では簡明な「見る」が自然で十分である。
- source_word: περιπατοῦντα ἐπὶ τῆς θαλάσσης
  choice: 湖の上を歩いて
  rationale: θάλασσαはガリラヤ湖を指すため日本語では「湖」とし、ἐπίのここでの意味を「上を」として、湖面を歩くという出来事を弱めずに伝えた。
- source_word: ἐγγὺς τοῦ πλοίου γινόμενον
  choice: 舟に近づいて来られる
  rationale: γίνομαιとἐγγύςの組み合わせが、近い状態になる動きを示すため「近づいて来る」とした。イエスへの敬意を自然な敬語で表した。
- source_word: πλοίου
  choice: 舟
  rationale: ガリラヤ湖上の小型船という文脈にふさわしく、日本語聖書文体でも明瞭な「舟」とした。
- source_word: ἐφοβήθησαν
  choice: 恐れた
  rationale: 弟子たちの恐怖の反応を簡潔かつ格調を保って表す。
theological_decisions:
- issue: 奇跡の描写を弱めず、原文の指示対象を自然な日本語で表すこと
  choice: 湖の上を歩いて
  alternative: 湖のほとりを歩いて／水の上を歩いて
  rationale: 文脈上、弟子たちは岸から離れた湖上におり、「湖のほとり」は適合しない。「水の上」は出来事の意味をよく伝えるが、原文のθάλασσαを直接反映するため「湖の上」とした。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての品位を保った。「スタディオン」は原文の古代単位を保持し、脚注で現代換算を示した。日本語で通常「ガリラヤ湖」と呼ぶ地理的対象に合わせてθάλασσαを「湖」と訳した。
