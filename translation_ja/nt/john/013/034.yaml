id: JHN.13.34
reference: John 13:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐντολὴν καινὴν δίδωμι ὑμῖν ἵνα ἀγαπᾶτε ἀλλήλους, καθὼς ἠγάπησα ὑμᾶς ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/034.yaml
  text: 'A new commandment I give to you: that you love one another[a]. Just as I loved you[b], you also are to love one another.'
translation:
  language: ja
  text: わたしはあなたがたに、新しい戒めを与えます。互いに愛し合いなさい。わたしがあなたがたを愛したように、あなたがたも互いに愛し合いなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後半は「わたしがあなたがたを愛したように、あなたがたも互いに愛し合うようになるためです」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολὴν καινὴν
  choice: 新しい戒め
  rationale: 「戒め」はἐντολήの正式な倫理的要求を保ちつつ、ヨハネ文書の用語として自然である。「新しい」は、その新しさが時間・性質・実現のどれにあるかを本文で限定しない。
- source_word: δίδωμι ὑμῖν
  choice: わたしはあなたがたに…与えます
  rationale: 現在形δίδωμιと与格ὑμῖνを明示し、イエスの直接的で厳かな語りとして自然な現代日本語にした。
- source_word: ἵνα ἀγαπᾶτε ἀλλήλους
  choice: 互いに愛し合いなさい
  rationale: 戒めの内容を導くἵναの命令的な力を、日本語では直接命令形で自然に表した。「愛し合う」によりἀγαπάωとἀλλήλουςを簡潔に表す。
- source_word: καθὼς ἠγάπησα ὑμᾶς
  choice: わたしがあなたがたを愛したように
  rationale: καθώςを「ように」とし、イエスの愛が弟子たちの相互愛の模範・基準であることを保った。アオリストἠγάπησαは「愛した」とした。
- source_word: ἵνα καὶ ὑμεῖς ἀγαπᾶτε ἀλλήλους
  choice: あなたがたも互いに愛し合いなさい
  rationale: καὶ ὑμεῖςの強調を「あなたがたも」で保ち、二つ目のἵνα節にも文脈上の勧告・命令の力を反映した。
theological_decisions:
- issue: 「新しい戒め」の新しさの性質
  choice: 「新しい」とだけ訳し、その意味を本文で説明しない
  alternative: 時間的に新しい、質的に新しい、またはイエスの模範によって新しく実現された、と明示する
  rationale: この節自体は新しさの厳密な意味を定義していないため、解釈上の幅と神学的緊張を保持した。
- issue: 二つ目のἵνα節の統語的機能
  choice: 命令・勧告として「愛し合いなさい」と訳す
  alternative: 目的・結果として「愛し合うようになるためです」と訳す
  rationale: δίδωμι ἐντολήνに続く文脈では戒めの内容を反復する読みが自然だが、目的・結果として読む余地もあるため脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」「あなたがた」を用いて談話の厳かな調子を維持し、同じ愛の語を反復して原文の強調を保った。
