  rationale: 悪魔がユダの心に入れた内容と、ユダが行為者であることを明確にし、ἵνα節の意味を自然な現代日本語で保持した。固有名詞の句読点を整え、父シモンと呼称イスカリオテの関係を明瞭にした。脚注アンカーは該当箇所に維持し、b注の代替表現の指示対象を具体化した。
