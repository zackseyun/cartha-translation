id: JHN.13.2
reference: John 13:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ δείπνου ⸀γινομένου, τοῦ διαβόλου ἤδη βεβληκότος εἰς τὴν καρδίαν ⸂ἵνα παραδοῖ αὐτὸν Ἰούδας Σίμωνος ⸀Ἰσκαριώτου⸃,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/002.yaml
  text: And during supper[a], when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him[c][b],
translation:
  language: ja
  text: 夕食の最中[a]、悪魔は、ユダがイエスを裏切る[c]という思いを、シモンの子、イスカリオテのユダの心にすでに入れていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「夕食が行われている間」。ギリシャ語は、夕食がすでに終わっていたという意味ではない。
    reason: lexical_alternative
  - marker: b
    text: 直訳「すでに心に入れていた」。別訳「すでに裏切るよう促していた」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「引き渡す」。この文脈では「裏切る」が表現の意味合いをよく伝える。
    reason: alternative_reading
lexical_decisions:
- source_word: δείπνου γινομένου
  choice: 夕食の最中
  rationale: 属格絶対構文が夕食と同時進行の状況を示すため。夕食が終わった後とはせず、自然で簡潔な日本語とした。
- source_word: διάβολος
  choice: 悪魔
  rationale: ヨハネの物語では人格的な悪しき者を指す定着した呼称である。
- source_word: ἤδη βεβληκότος εἰς τὴν καρδίαν
  choice: すでに……心に……思いを入れていた
  rationale: 完了分詞の先行する状態と、「心に投げ入れる」という比喩的表現を、自然な日本語で保った。
- source_word: καρδίαν
  choice: 心
  rationale: 感情だけでなく意志や意図を含む聖書的な身体比喩を保持する。
- source_word: ἵνα παραδοῖ
  choice: 裏切る
  rationale: 字義的には「引き渡す」だが、ユダの行為という文脈上の力を明確に伝える。
- source_word: αὐτόν
  choice: イエスを
  rationale: 日本語では「彼を」より指示対象を明示するほうが自然で、文脈上の指示対象も明白である。
- source_word: Ἰούδας Σίμωνος Ἰσκαριώτου
  choice: シモンの子イスカリオテのユダ
  rationale: 本文の語順と属格関係を踏まえつつ、イスカリオテがユダを識別する呼称であり、シモンが父であることが伝わる形にした。
theological_decisions:
- issue: ユダの裏切りにおける悪魔とユダの主体性
  choice: 悪魔がユダの心に裏切る思いを入れたと表現する。
  alternative: 悪魔がユダを裏切るよう促していた。
  rationale: 悪魔の働きを明示しながら、実際に裏切る者がユダであるという本文の緊張を保ち、決定論や単独原因へ解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として自然でありながら荘重さを保った。「夕食の最中」によって同時進行を明確にし、伝統的だが誤解を招く「夕食が終わった時」は避けた。
