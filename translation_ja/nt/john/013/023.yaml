  text: ⸀ἦν ἀνακείμενος εἷς ⸀ἐκ τῶν μαθητῶν αὐτοῦ ἐν τῷ κόλπῳ τοῦ Ἰησοῦ, ὃν ἠγάπα ὁ Ἰησοῦς·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/023.yaml
  text: One of his disciples[a], whom Jesus loved, was reclining in Jesus' bosom.
translation:
  language: ja
  text: 弟子の一人、すなわちイエスが愛しておられた者が、食事の席でイエスの胸元[a]に寄りかかっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「イエスの胸元に」または「イエスの懐に」。当時の食事では横になって食べることがあり、この表現は、その弟子がイエスのすぐ隣にいた位置を表す。
    reason: 字義的表現と古代の食事姿勢を示し、「胸の内」という内面的な意味への誤解を避けるため。
lexical_decisions:
- source_word: ἀνακείμενος
  choice: 寄りかかって食事の席に着いていた
  rationale: 古代の食事で横になって席に着く姿勢を表す。単なる「座っていた」ではなく、当時の食事姿勢が分かる自然な日本語とした。
- source_word: εἷς ἐκ τῶν μαθητῶν αὐτοῦ
  choice: 弟子の一人
  rationale: 部分を表す自然で簡潔な日本語として、ギリシア語を正確に伝える。
- source_word: ἐν τῷ κόλπῳ τοῦ Ἰησοῦ
  choice: イエスの胸元に
  rationale: κόλποςの身体的・空間的な表現を保ちつつ、食卓でイエスのすぐ隣に横たわる位置を示す日本語とした。具体的な食事配置は脚注で補う。
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: イエスが愛しておられた者
  rationale: 関係節とἀγαπάωの基本的意味を保ち、イエスへの敬意を自然な現代標準語で表した。
theological_decisions:
- issue: 愛された弟子の、イエスに対する位置の表現
  choice: イエスの胸元に寄りかかって
  alternative: イエスのすぐそばで横になって
  rationale: この句は第一に食事の席での位置と姿勢を描くが、「胸元」という原文の具体的表現とヨハネ文書内の響きを消さないようにした。神秘的結合などの解釈は本文に加えず、食事姿勢について脚注で説明する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「胸元」で原文の像を残し、「食事の席に着いていた」で場面を明確にした。
