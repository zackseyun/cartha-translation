id: JHN.13.18
reference: John 13:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ περὶ πάντων ὑμῶν λέγω· ἐγὼ οἶδα ⸀τίνας ἐξελεξάμην· ἀλλ’ ἵνα ἡ γραφὴ πληρωθῇ· Ὁ τρώγων ⸀μου τὸν ἄρτον ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/018.yaml
  text: 'I am not speaking about all of you[a]. I know whom I have chosen[c][b]. But this is so that the Scripture may be fulfilled: ‘The one who eats my bread has lifted up his heel against me.’'
translation:
  language: ja
  text: 「わたしは、あなたがた全員について言っているのではない。わたしは、わたしがだれを選んだか知っている。しかし、それは聖書が成就するためである。『わたしのパンを食べる者が、わたしに対してかかとを上げた。』[a][b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 詩編41編9節（日本語の多くの聖書では41編10節）の引用または言及。
    reason: cross_reference
  - marker: b
    text: 「かかとを上げる」は、敵対や裏切りを表す比喩。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ περὶ πάντων ὑμῶν λέγω
  choice: わたしは、あなたがた全員について言っているのではない
  rationale: περίの「〜について」を保ちつつ、否定が「全員」に及ぶことを明確にした、自然な現代日本語。
- source_word: οἶδα
  choice: 知っている
  rationale: 形は完了形だが、コイネー・ギリシア語では現在の意味で機能するため。
- source_word: τίνας ἐξελεξάμην
  choice: 自分が選んだ者たち
  rationale: 選びの対象が複数の人であることを示しつつ、その選びの神学的性質を訳文で限定しない。
- source_word: ἀλλ’ ἵνα
  choice: しかし、これは〜ためである
  rationale: 省略を含むギリシア語のつながりを日本語として補い、目的・結果の含みを過度に決めずに表した。
- source_word: ἡ γραφὴ πληρωθῇ
  choice: 聖書が成就する
  rationale: ヨハネ文書におけるγραφήを聖なる書として訳し、πληρόωの聖書成就用法を定着した表現で示した。
- source_word: Ὁ τρώγων μου τὸν ἄρτον
  choice: わたしのパンを食べる者
  rationale: 実体詞的分詞を自然に「〜する者」とし、μουを「パン」に係る所有表現として訳した。
- source_word: ἐπῆρεν ἐπ’ ἐμὲ τὴν πτέρναν αὐτοῦ
  choice: わたしに対してかかとを上げた
  rationale: ἐπίの敵対的方向を「〜に対して」で示し、詩編引用のかかとの比喩を平板な意訳に置き換えず保持した。
theological_decisions:
- issue: イエスの「選び」と裏切る者との関係
  choice: 「自分が選んだ者たち」と直接的に訳し、選びの性質を限定しない
  alternative: 救いへの選び、または使徒職への任命だけを意味するように訳す
  rationale: この節自体は「選ぶ」の神学的範疇を定義していないため、選びと裏切りをめぐる本文の緊張を保った。
- issue: ἀλλ’ ἵναと裏切り・聖書成就との関係
  choice: 「しかし、これは聖書が成就するためである」
  alternative: 「聖書は必ず実現しなければならなかった」など、決定論的因果を明示する
  rationale: 目的・結果を表す成就表現を保持しつつ、本文にない因果説明を加えない。
translation_notes:
  register: イエスの発言として、明快で現代的ながらも品位ある常体を用いた。聖書引用の比喩は本文に残し、現代の読者には分かりにくい含意を脚注で補った。
