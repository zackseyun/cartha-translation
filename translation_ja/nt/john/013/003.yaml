    issue: 「その手」の指示対象
    rationale: 直前の主語は「父」であるため、「その手」は父の手とも読め、日本語として一瞬曖昧になりうる。αὐτῷがイエスを指すことを「イエスの手に」で明確にする。
  - severity: medium
    issue: 「行こうとしている」が意図・企図を示しうる
    rationale: ὑπάγειはここで現在形の「行く／去って行く」であり、「〜しようとしている」は日本語で主観的な意図または開始直前の企図を加えうる。「行かれる」がより直接的である。
