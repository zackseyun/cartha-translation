id: JHN.13.3
reference: John 13:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀εἰδὼς ὅτι πάντα ⸀ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας, καὶ ὅτι ἀπὸ θεοῦ ἐξῆλθεν καὶ πρὸς τὸν θεὸν ὑπάγει,
base_translation:
  language: en
  yaml_path: translation/nt/john/013/003.yaml
  text: Jesus[a], knowing that the Father had given all things into his hands, and that he had come from God and was going to God[b],
translation:
  language: ja
  text: イエスは、父がすべてをイエスの手に委ねたこと、また、ご自分が神のもとから来られ[a]、神のもとへ行かれる[b]ことを知っておられたので、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神のもとから出て来られた」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「神のもとへ戻って行かれる」。ギリシア語は単に「神のもとへ行かれる」。
    reason: alternative_reading
lexical_decisions:
- source_word: εἰδὼς
  choice: 知っておられたので
  rationale: 後続する行動の背景・理由を示す分詞として訳した。文脈上の因果的なつながりを自然な現代日本語で表す。
- source_word: πάντα
  choice: すべて
  rationale: 中性複数形の包括的な範囲を簡潔に保つ。
- source_word: ἔδωκεν αὐτῷ ὁ πατὴρ εἰς τὰς χεῖρας
  choice: 父がすべてをその手に委ねた
  rationale: 「手に与える」という具体的比喩を残しつつ、権限と託された支配を自然に伝える。「その手」は直前のイエスを指す。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 明示的な所有表現を加えず、ヨハネ福音書で重みを持つ称号をそのまま保つ。
- source_word: ἀπὸ θεοῦ
  choice: 神のもとから
  rationale: 起点を表すἀπόを自然に示し、「父」と言い換えず原文どおり「神」を保つ。
- source_word: ἐξῆλθεν
  choice: 来て
  rationale: 神を起点とする由来と派遣の含みを自然に表す。完了した来臨と、続く現在の移動との対照は文脈で明らかになる。
- source_word: πρὸς τὸν θεὸν
  choice: 神のもとへ
  rationale: 神へ向かう動きを示しながら、単なる方向以上の関係的な含みも日本語で自然に伝える。
- source_word: ὑπάγει
  choice: 行こうとしている
  rationale: 現在形が示す差し迫った出発を自然な日本語で表し、「戻る」という解釈は本文に加えない。
theological_decisions:
- issue: ἀπὸ θεοῦ ἐξῆλθενにおけるキリストの由来
  choice: 神のもとから来て
  alternative: 神から出て来て
  rationale: イエスの神的な由来と派遣を保ちつつ、この節に明記されていない後代の教理的表現を加えない。
- issue: πρὸς τὸν θεὸν ὑπάγειにおける行き先
  choice: 神のもとへ行こうとしている
  alternative: 神のもとへ戻ろうとしている
  rationale: 文脈から帰還の意味は推察できるが、この句自体には「戻る」に相当する語がないため、本文では明示しない。
translation_notes:
  register: 明瞭で格調ある現代標準語。原文の分詞が次節の行動へつながる構造を「ので、」と読点で保った。敬意表現はイエスについての「知っておられた」に限定し、全体を過度に古風にはしていない。
