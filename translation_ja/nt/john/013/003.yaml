  to: イエスは、父がすべてをイエスの手に委ねたこと、また、ご自分が神のもとから来られ[a]、神のもとへ行かれる[b]ことを知っておられたので、
  rationale: 「イエスの手に」によりαὐτῷの指示対象を自然に明示した。「来られた」はἐξῆλθενの完了した出来事を、「行かれる」はὑπάγειの現在形を、それぞれ余分な解釈を加えず表す。「戻る」は本文に採用せず脚注の代替訳にとどめた。末尾の「ので、」は次節へ続く原文の構文を保持する。
