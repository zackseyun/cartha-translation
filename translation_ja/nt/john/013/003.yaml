  naturalness: 全体として明瞭な現代標準語である。「イエスの手に」と明示し、「神のもとへ行かれる」とするほうが自然で、原文の現在形にもより直接的に対応する。
  terminology: 「父」「神」を区別して保持しており、ヨハネ的な表現を教理的に言い換えていない。「神のもとから／神のもとへ」も適切である。
