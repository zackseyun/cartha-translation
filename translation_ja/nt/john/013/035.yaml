id: JHN.13.35
reference: John 13:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τούτῳ γνώσονται πάντες ὅτι ἐμοὶ μαθηταί ἐστε, ἐὰν ἀγάπην ἔχητε ἐν ἀλλήλοις.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/035.yaml
  text: By this everyone will know that you are my disciples[b][a], if you have love for one another.
translation:
  language: ja
  text: あなたがたが互いに愛を抱いているなら[b]、そのことによって[a]、すべての人が、あなたがたがわたしの弟子であることを知るでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このことによって」または「このことを手段として」。
    reason: ἐν τούτῳは、この相互愛を、弟子であることが知られるしるし・手段として指し示す。
  - marker: b
    text: 直訳に近くは「互いの間に愛を持っているなら」。すなわち、互いに愛し合うこと。
    reason: ἀγάπην ἔχητε ἐν ἀλλήλοιςは、愛を「持つ」という名詞表現で、相互的な関係を表す。
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: そのことによって
  rationale: 指示語を伴う前置詞句を手段・しるしとして理解し、後続の相互愛が弟子であることを人々に知らせる証拠となる意味を自然な日本語で表した。条件節を先に置いたため、「この」ではなく照応上自然な「その」とした。
- source_word: γνώσονται
  choice: 知ります
  rationale: γινώσκωの未来形が表す、事実を知る・認識するという幅を保つ。文脈上「見分けます」も可能だが、識別という解釈に狭めない表現を選んだ。
- source_word: πάντες
  choice: すべての人
  rationale: 文法上は男性複数だが、ここでは性別を限定しない総称であるため、現代日本語で普遍的範囲を明確にした。
- source_word: ἐμοὶ μαθηταί ἐστε
  choice: あなたがたがわたしの弟子である
  rationale: 与格ἐμοίの帰属的な働きを「わたしの」で表し、μαθηταίは福音書における師と弟子の関係を保つ「弟子」とした。
- source_word: ἐὰν
  choice: なら
  rationale: 接続法を伴う条件を日本語の自然な条件表現で示し、弟子となる功績ではなく、弟子であることが知られる条件・証拠という文の働きを保った。
- source_word: ἀγάπην ἔχητε ἐν ἀλλήλοις
  choice: あなたがたの間に互いへの愛がある
  rationale: 直訳的な「互いの間に愛を持つ」の意味を、相互性を明示しつつ自然な日本語で表した。「愛し合う」よりも名詞ἀγάπηνと動詞ἔχητεの形を残している。
theological_decisions:
- issue: ἐὰνが導く条件の性質
  choice: あなたがたの間に互いへの愛があるなら
  alternative: あなたがたが互いに愛し合うとき
  rationale: ギリシア語の条件形を保ち、相互愛を弟子となるための功績とはせず、弟子であることが人々に知られるしるし・条件として表した。
- issue: πάντεςの包括範囲
  choice: すべての人
  alternative: みな
  rationale: 男性だけを指す語ではなく一般の人々を包括するため、性別を限定しない明瞭な表現とした。
- issue: 相互愛と弟子性の関係
  choice: そのことによって…弟子であることを知ります
  alternative: そのことから…弟子だと見分けます
  rationale: 相互愛が弟子性の公的なしるしとなるという関係を示しつつ、「見分ける」が含み得る排他的・判定的な響きを本文に加えないようにした。
translation_notes:
  register: 現代標準日本語の丁寧体を用いた。原文の語順では指示表現が先行するが、日本語で指示対象を明瞭にするため条件節を前置した。荘重さを保ちながら、教会外の読者にも理解しやすい語彙と構文にした。
