id: JHN.13.7
reference: John 13:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὃ ἐγὼ ποιῶ σὺ οὐκ οἶδας ἄρτι, γνώσῃ δὲ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/007.yaml
  text: Jesus answered and said to him[a], “What I am doing you do not know now[b], but you will understand after these things.”
translation:
  language: ja
  text: イエスは彼に答えて言われた。「わたしがしていることを、あなたは今は知らない[a]。しかし、これらのことの後で分かるようになる[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「知らない」と「分かるようになる」に当たる原語は異なる動詞である。前者は「知っている」、後者は「知るようになる、理解する」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「これらのことの後で」が、この場面でこの後に起こることを指すのか、イエスの行為の意味を明らかにするさらに後の出来事まで含むのかは、原文では限定されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: 答えて言われた
  rationale: 二つの発話動詞を保ちつつ、現代日本語の聖書文体として自然で品位ある表現にした。
- source_word: Ὃ ἐγὼ ποιῶ
  choice: わたしがしていること
  rationale: 現在進行中の行為を指す現在形の文脈的な進行性を明確に表した。
- source_word: οὐκ οἶδας ἄρτι
  choice: 今は知らない
  rationale: οἶδαの基本的な意味である「知る」を保ち、ἄρτιを自然な「今は」で表した。理解の欠如という含みは文脈と後半との対比から伝わる。
- source_word: γνώσῃ
  choice: 分かるようになる
  rationale: γινώσκωの未来形が示す、後に認識・理解へ至る動きを表し、前半のοἶδαςとの語彙上の違いも日本語で可能な限り保った。
- source_word: δὲ
  choice: しかし
  rationale: 現在の無知と後の理解との対照を明確にした。
- source_word: μετὰ ταῦτα
  choice: これらのことの後で
  rationale: 単なる「後で」よりも原文の複数指示表現を保ち、それが直後の出来事か、より広い後の出来事かを限定しないようにした。
theological_decisions:
- issue: 後に理解する時点と範囲
  choice: 「これらのことの後で」とし、特定の出来事に限定しない
  alternative: 「後で」と意訳する、または洗足の説明後・復活後・聖霊降臨後のいずれかを明示する
  rationale: 原文はμετὰ ταῦταとのみ述べ、どの後続出来事を指すか確定していないため、その神学的・時間的な開放性を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの発言には簡潔で品位ある語調を保った。「彼」は文脈上ペトロを指すが、この節単独では原文どおり代名詞のままとした。
