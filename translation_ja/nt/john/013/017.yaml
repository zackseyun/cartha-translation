  text: εἰ ταῦτα οἴδατε, μακάριοί ἐστε ἐὰν ποιῆτε αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/017.yaml
  text: If you know these things[a], you are blessed if you do them.
translation:
  language: ja
  text: これらのことを知っているなら、それらを行うなら、あなたがたは幸い[a]です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幸い」は、「幸福」「恵まれた状態」とも訳せる。ギリシア語は、単にうれしく感じることではなく、恵まれた、好ましい状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: なら
  rationale: 直説法を伴う条件節を自然な現代日本語で示す。「もし」を加えなくても条件の意味は明確である。
- source_word: ταῦτα
  choice: これらのこと
  rationale: 中性複数形を保ち、直前のイエスの模範と教えを指す表現とした。
- source_word: οἴδατε
  choice: 知っている
  rationale: οἶδαの基本的な知識・認識の意味を直接表し、「理解している」と狭めない。
- source_word: μακάριοί
  choice: 幸いです
  rationale: 単なる主観的な喜びではなく、恵まれた好ましい状態を表す、聖書文体として定着しつつ理解しやすい表現である。
- source_word: ἐὰν ποιῆτε αὐτά
  choice: それを行うとき
  rationale: 接続法を伴う条件を示し、知識だけでなく実行が幸いに結びつくことを自然に表す。日本語の「それ」は直前の複数内容をまとめて受ける。
theological_decisions:
- issue: 弟子として実行する者についての μακάριοι の訳
  choice: 幸いです
  alternative: 幸福です／恵まれています
  rationale: 神の好意と栄えある状態を含み得る語の厚みを保ちつつ、感情だけに限定しない。「祝福されています」は受動的な行為を明示し、原文以上に解釈を加えるため採らない。
- issue: 二つの条件表現 εἰ と ἐὰν の関係
  choice: 「知っているなら、それを行うとき」
  alternative: 「知っていて、それを行うなら」
  rationale: 知ることを前提として提示し、実行を現実化すべき条件として置く原文の段階的な構造を保つ。両者を同一の条件へ平板化しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「幸いです」に聖書的で品位ある響きを残した。複数の「あなたがた」を明示し、原文の共同体的な呼びかけを保持した。
