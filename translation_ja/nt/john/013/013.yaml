  text: ὑμεῖς φωνεῖτέ με Ὁ διδάσκαλος καὶ Ὁ κύριος, καὶ καλῶς λέγετε, εἰμὶ γάρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/013.yaml
  text: You call me Teacher and Lord, and you speak rightly, for I am.
translation:
  language: ja
  text: あなたがたはわたしを『先生』と『主』[a]と呼んでいます。あなたがたの言うとおりです。実際、わたしはそうなのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主」は「主人」とも訳せる。ギリシア語キュリオスは、権威を持つ者や主権者を指すことがある。ここでは称号として「主」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνεῖτέ
  choice: 呼んでいます
  rationale: 人をある称号で呼ぶという構文を、現代日本語で直接かつ自然に表す。現在形の継続的・慣行的な響きも保つ。
- source_word: Ὁ διδάσκαλος
  choice: 先生
  rationale: 弟子たちがイエスに用いる称号として、現代日本語で明快かつ自然である。ギリシア語の定冠詞は称号性を示すが、日本語では付加語を置かない。
- source_word: Ὁ κύριος
  choice: 主
  rationale: 新約聖書におけるイエスの称号としての神学的重みと、権威・主権の含意を保つ。
- source_word: καλῶς λέγετε
  choice: その言うとおりです
  rationale: 直訳的な「正しく言っています」より自然な現代日本語で、弟子たちの呼称が正しいという評価を明示する。
- source_word: εἰμὶ γάρ
  choice: 実際、わたしはそうなのです
  rationale: γάρの根拠提示と、補語を省略した簡潔な自己同定を、日本語で不自然にならない範囲で保持する。
theological_decisions:
- issue: イエスに対する κύριος の称号
  choice: 主
  alternative: 主人
  rationale: 「主」はキリスト論的称号としての響きを保ちつつ、原語が持つ権威・主権の幅を過度に限定しない。「主人」も文脈上可能だが、社会的関係だけに狭めて受け取られやすい。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「先生」「主」を引用符で示し、二つの称号であることを読み取りやすくした。原文の簡潔さを尊重しつつ、εἰμὶ γάρ は日本語として意味が通るよう「実際、わたしはそうなのです」とした。
