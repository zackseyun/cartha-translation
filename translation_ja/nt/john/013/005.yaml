  text: εἶτα βάλλει ὕδωρ εἰς τὸν νιπτῆρα, καὶ ἤρξατο νίπτειν τοὺς πόδας τῶν μαθητῶν καὶ ἐκμάσσειν τῷ λεντίῳ ᾧ ἦν διεζωσμένος.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/005.yaml
  text: Then he pours water into the washbasin[b][a], and began to wash the disciples’ feet and to wipe them with the towel with which he was girded.
translation:
  language: ja
  text: それからイエスは洗い鉢に水を注ぎ、弟子たちの足を洗い始め、腰に巻いていた手ぬぐいでその足を拭いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶτα
  choice: それから
  rationale: 物語の中で動作が次へ進むことを、自然な現代日本語で示す。
- source_word: βάλλει ὕδωρ εἰς τὸν νιπτῆρα
  choice: 洗い鉢に水を注ぎ
  rationale: βάλλει は広く「入れる」を意味するが、水と容器の文脈では「注ぐ」が自然。νιπτήρ は洗うための器なので「洗い鉢」とした。
- source_word: ἤρξατο νίπτειν
  choice: 洗い始め
  rationale: 開始を表す ἤρξατο と、体の一部を洗う νίπτειν の意味を簡潔に保つ。
- source_word: τοὺς πόδας τῶν μαθητῶν
  choice: 弟子たちの足
  rationale: 属格関係を自然な日本語の連体修飾で表した。
- source_word: ἐκμάσσειν
  choice: 拭かれた
  rationale: 布でこすって水分を拭き取る動作を表す。「乾かす」より原語の具体的な動作に近い。敬語ではなく、イエスの動作を示す文体上の尊敬表現。
- source_word: τῷ λεντίῳ ᾧ ἦν διεζωσμένος
  choice: 腰に巻いていた手ぬぐいで
  rationale: λεντίον を拭くための布として「手ぬぐい」とし、διαζώννυμι の腰に帯びる動作を現代日本語で明確に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。主語は文脈上明確だが、単独節としての分かりやすさのため「イエス」を補った。ギリシャ語の歴史的現在 βάλλει とアオリスト ἤρξατο の推移は、日本語では自然な連続動作としてまとめた。
