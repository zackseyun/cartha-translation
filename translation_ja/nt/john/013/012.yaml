  source_fidelity: 原文は、洗足、衣服を取ること、再び食卓で身を横たえること、その後に語ることを、いずれも完了した出来事として順に述べる。現行の「身を横たえると」は文脈上は理解できるが、非過去形にも読め、前の出来事との時制・順序がやや不明瞭である。また、τὰ ἱμάτια は複数の「衣服」であり、「上着」だけに限定しないほうが安全である。
