source:
  edition: SBLGNT
  text: Ὅτε οὖν ἔνιψεν τοὺς πόδας αὐτῶν ⸀καὶ ἔλαβεν τὰ ἱμάτια αὐτοῦ ⸂καὶ ἀνέπεσεν⸃, πάλιν εἶπεν αὐτοῖς· Γινώσκετε τί πεποίηκα ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/012.yaml
  text: So when he had washed their feet and taken his garments and reclined again[a], he said to them[b], “Do you understand what I have done for you?”
translation:
  language: ja
  text: さて、イエスは弟子たちの足を洗い、ご自分の衣服を取ってから、再び食卓に身を横たえ、彼らに言われた。「わたしがあなたがたにしたことが分かりますか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「わたしがあなたがたのためにしたこと」とも訳せる。ギリシア語の与格には、行為の対象と受益者のどちらの含みもあり得る。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: さて、…すると
  rationale: ὅτεの時間的な関係と、οὖνの物語を進める働きを、自然な現代日本語で表した。
- source_word: ἔνιψεν τοὺς πόδας αὐτῶν
  choice: 弟子たちの足を洗い
  rationale: 目的語と所有関係を自然に示し、前後の文脈からαὐτῶνを「弟子たち」と明示した。
- source_word: ἔλαβεν τὰ ἱμάτια αὐτοῦ
  choice: ご自分の上着を取って
  rationale: ἱμάτιαは衣服を指すが、この場面では洗足の前に脱いだ衣を指す。「身に着けて」とまでは語義に含まれないため、「取って」とした。
- source_word: ἀνέπεσεν
  choice: 食卓に身を横たえると
  rationale: 古代の食事における姿勢を示す語であり、単なる「座る」より歴史的な情景を正確に伝える。食卓の語は文脈上の含意を明らかにする補足。
- source_word: πάλιν
  choice: 再び
  rationale: 反復を表す副詞を直接的に訳した。
- source_word: Γινώσκετε
  choice: 分かりますか
  rationale: ここでは行為を知覚したかではなく、その意味を理解しているかを問うため、現代日本語として自然な「分かりますか」とした。
- source_word: τί πεποίηκα ὑμῖν
  choice: わたしがあなたがたにしたこと
  rationale: 完了形が示す、完了した行為の現在的な意味を文脈に委ねつつ自然に表した。ὑμῖνは「に」と訳し、受益の含みを限定せず保持した。
theological_decisions:
- issue: 食卓に戻ったイエスの姿勢
  choice: 食卓に身を横たえる
  alternative: 再び座る／再び席に着く
  rationale: ἀναπίπτωが当時の食事の姿勢を具体的に示すことを反映し、歴史的情景を保った。
- issue: τί πεποίηκα ὑμῖνにおけるὑμῖνの意味
  choice: あなたがたにしたこと
  alternative: あなたがたのためにしたこと
  rationale: 与格は受益的にも対象的にも理解できる。「ために」は奉仕という文脈にはよく合うが、本文ではより広い「に」を用いて原文の曖昧さを保った。
translation_notes:
  register: 明快で格調を保った現代標準日本語。イエスへの敬意は「ご自分」「言われた」で示し、発話では自然な丁寧体を用いた。古代の食卓姿勢は本文と注で説明し、ὑμῖνの解釈可能性は本文で狭めず注記した。
