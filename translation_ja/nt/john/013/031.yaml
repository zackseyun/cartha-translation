id: JHN.13.31
reference: John 13:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅτε ⸀οὖν ἐξῆλθεν ⸀λέγει Ἰησοῦς· Νῦν ἐδοξάσθη ὁ υἱὸς τοῦ ἀνθρώπου, καὶ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/031.yaml
  text: So when he had gone out[a], Jesus said, “Now the Son of Man has been glorified, and God has been glorified in him.”
translation:
  language: ja
  text: そこで、彼が出て行った後、イエスは言われた。「今、人の子は栄光を受け、神もまた、その人の子において[a]栄光を受けた。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人の子を通して」。ギリシア語の表現は、神が人の子において栄光を受けたとも、人の子を通して栄光を受けたとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅτε οὖν
  choice: そこで、～すると
  rationale: ὅτεの時間的な意味と、οὖνが示す物語の進行を、現代日本語として自然な形でともに表した。
- source_word: ἐξῆλθεν
  choice: 彼が出て行くと
  rationale: 直前の文脈でユダがその場から外へ出たことを指す。日本語では従属節の「出て行くと」によって、発言に先立つ出来事の順序が自然に伝わる。
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在だが、日本語の物語文として自然な過去表現にした。敬意を保ちつつ、明瞭で一般的な表現とした。
- source_word: Νῦν
  choice: 今
  rationale: ユダの退出を受けて到来した決定的な時を告げる語の時間的・談話的な力を保った。
- source_word: ἐδοξάσθη
  choice: 栄光を受けた
  rationale: アオリスト受動態を簡潔に表し、何が神の栄光の出来事を構成するかを訳文で限定しない。「今」と過去形の緊張関係も原文どおり残した。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの定着した自己呼称であり、ダニエル書を含む聖書的な響きを保持する。
- source_word: ὁ θεὸς
  choice: 神
  rationale: θεόςの標準的で直接的な訳語。
- source_word: ἐν αὐτῷ
  choice: 人の子において
  rationale: αὐτῷの指示対象を日本語で明確にしつつ、ἐνの場所的・関係的な表現を保った。道具的な「人の子を通して」も可能なので脚注に示した。
theological_decisions:
- issue: 人の子の栄光化が指す範囲
  choice: 「栄光を受けた」とだけ訳し、すでに始まった栄光の出来事として表す
  alternative: 十字架だけ、または復活・高挙だけを指すように明示する
  rationale: 原文は栄光化の具体的範囲をここで限定していないため、死、復活、父への帰還をめぐるヨハネ福音書の広い神学的緊張を保った。
- issue: ἐν αὐτῷの意味
  choice: 人の子において
  alternative: 人の子を通して
  rationale: 関係的・領域的な意味と道具的な意味の双方が成り立ち得る。本文では原文に近い表現を採り、別の理解を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言にふさわしい簡潔で重みのある調子を保った。「人の子」など定着した聖書用語は、その間テクスト的な響きを保つため維持した。
