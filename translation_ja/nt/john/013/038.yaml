  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται Ἰησοῦς· Τὴν ψυχήν σου ὑπὲρ ἐμοῦ θήσεις; ἀμὴν ἀμὴν λέγω σοι, οὐ μὴ ἀλέκτωρ φωνήσῃ ἕως οὗ ⸀ἀρνήσῃ με τρίς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/038.yaml
  text: Jesus answered[a], “Will you lay down your life for me? Truly, truly, I say to you, the rooster will certainly not crow until you have denied me three times.”
translation:
  language: ja
  text: イエスは答えられた。「わたしのために自分の命[a]を捨てるのか。よくよく言っておく。あなたが三度わたしを知らないと言うまで、雄鶏は決して鳴かない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「魂」。ギリシア語プシュケーは「魂」を意味することもあるが、ここではイエスのために命を差し出すことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: 答えられた
  rationale: ギリシア語は歴史的現在形だが、日本語の物語として自然な過去形とし、イエスへの敬意を表す自然な尊敬表現を用いた。
- source_word: Τὴν ψυχήν σου ... θήσεις
  choice: 命を捨てる
  rationale: ψυχήはここでは非物質的な「魂」ではなく、自らの命を差し出すことを指す。τίθημιとのヨハネ特有の表現を「命を捨てる」で簡潔に再現した。
- source_word: ὑπὲρ ἐμοῦ
  choice: わたしのために
  rationale: 身代わり・利益の含意を保ちつつ、文脈に自然で簡潔な日本語とした。
- source_word: ἀμὴν ἀμὴν λέγω σοι
  choice: 本当にはっきり言っておく
  rationale: 重ねられたἀμήνの厳粛な強調を現代日本語で明確に伝える。逐語的な「まことに、まことに」より理解しやすく、定型句としての重みも保つ。
- source_word: οὐ μὴ ... φωνήσῃ
  choice: 決して鳴かない
  rationale: οὐ μήの強い否定を「決して」で表し、鶏についてのφωνέωを自然な「鳴く」とした。
- source_word: ἕως οὗ
  choice: まで
  rationale: 鶏が鳴かない期間の終点を示す原文の時間関係をそのまま保った。
- source_word: ἀρνήσῃ με
  choice: わたしを知らないと言う
  rationale: ἀρνέομαιはここで、イエスとの関係を否認する行為を指す。後続の物語でペトロが実際に口にする否認が伝わる、明瞭で自然な表現を選んだ。
- source_word: τρίς
  choice: 三度
  rationale: 簡潔で格調を損なわない現代標準語。
theological_decisions:
- issue: ψυχήの人間論的な含意
  choice: 命
  alternative: 魂
  rationale: 文脈はペトロがイエスのために死ぬ覚悟を語る場面であり、身体と区別された魂について述べているのではないため。
- issue: ἀρνήσῃ μεの否認の性質
  choice: わたしを知らないと言う
  alternative: わたしを否定する／わたしとの関係を否認する
  rationale: 単なる命題の否定ではなく、イエスとの関係を認めないことを指す。後続場面とのつながりを明確にしつつ、特定の教理的解釈を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な警告としての重みを保った。「と言うのか」によって修辞疑問の驚きと反問を自然に表した。脚注は不要と判断したため、本文に脚注記号は置いていない。
