  naturalness: 全体として読みやすい現代標準語である。「本当にはっきり言っておく」は理解できるが、日本語としてやや不自然で、ἀμὴν ἀμὴν の反復も明示されない。「よくよく言っておく」は自然で、厳粛な定型的強調を保つ。
  terminology: ψυχήは本文では「命」が適切である。ἀρνήσῃ με の「わたしを知らないと言う」は、この場面の関係的否認を自然に表すが、原語のより広い「否認する」の含みも残るため、本文の訳語として採用できる。ψυχή の「魂」という語義可能性は、本文の意味を損なわない範囲で脚注に示す。
