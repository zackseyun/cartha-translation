id: JHN.13.20
reference: John 13:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ λαμβάνων ⸀ἄν τινα πέμψω ἐμὲ λαμβάνει, ὁ δὲ ἐμὲ λαμβάνων λαμβάνει τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/020.yaml
  text: Truly[a], truly, I say to you, whoever receives anyone I send receives me[b], and whoever receives me receives the one who sent me.
translation:
  language: ja
  text: まことに、まことに、あなたがたに言います。わたしが遣わす者を受け入れる人は、わたしを受け入れます。そして、わたしを受け入れる人は、わたしを遣わした方[a]を受け入れます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上、「わたしを遣わした方」は父を指す。
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: 二重の定型句が持つ厳粛な強調を保ちつつ、現代日本語で理解できる表現とした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 現在形と複数二人称を素直に反映し、ヨハネ福音書に繰り返される宣言の形式を保った。
- source_word: ὁ λαμβάνων
  choice: 受け入れる人
  rationale: 冠詞付き現在分詞の一般的・代表的な意味を、性別を限定せず自然な日本語で表した。
- source_word: ἄν τινα πέμψω
  choice: わたしが遣わす者
  rationale: ἄν、τινα、接続法πέμψωによる不定の範囲を文脈上自然に表した。「者」は特定の一人に限定せず、イエスが遣わす者ならだれでも含み得る。
- source_word: λαμβάνει
  choice: 受け入れます
  rationale: 人を迎え入れ、受け止める意味を表しつつ、節全体で繰り返される同じ動詞を同一表現で保持した。
- source_word: ὁ δὲ ἐμὲ λαμβάνων
  choice: そして、わたしを受け入れる人は
  rationale: δέはここでは強い対立よりも連結を示し、派遣された者からイエス、さらに遣わした方へと続く並行関係を自然に示すため「そして」とした。
- source_word: τὸν πέμψαντά με
  choice: わたしを遣わした方
  rationale: アオリスト分詞の関係的な表現を保ち、本文に明記されていない「父」という称号を本文へ補わなかった。敬意を伴う「方」は神を指す文脈に自然である。
theological_decisions:
- issue: 「わたしを遣わした方」の同定
  choice: 本文では「わたしを遣わした方」とする
  alternative: 「わたしを遣わした父」とする
  rationale: ヨハネ福音書の文脈では父を指すが、この節自体は「父」と明記せず、派遣者と遣わされた者との関係で表現している。そのため本文の含みを保ち、同定は脚注で示した。
- issue: 冠詞付き男性単数分詞の一般性
  choice: 「受け入れる人」とする
  alternative: 「受け入れる男」または男性に限定され得る表現
  rationale: 男性単数形はここで性別を限定するものではなく、一般的・代表的に人を指すため、日本語でも性別を限定しない表現とした。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの厳粛な宣言にふさわしい格調を保った。「受け入れます」を三度繰り返し、原文の代表・派遣の連鎖が聞き手に明瞭に伝わるようにした。
