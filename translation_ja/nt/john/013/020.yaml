  naturalness: 「まことに、まことに、あなたがたに言います」は現代標準日本語として理解可能で、ヨハネに特有の厳粛な宣言の調子にも合う。「受け入れる人」の反復と「そして」による接続も、並行する文の構造を明瞭にしている。
  terminology: 「遣わす」「受け入れる」を一貫して用い、派遣と受容の対応関係を保っている。「わたしを遣わした方」は本文にない「父」を補わず、脚注で文脈上の指示対象を示しており、原文の表現と神学的節度の双方に適う。
