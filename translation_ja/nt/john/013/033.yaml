review_pass:
  verdict: approve
  source_fidelity: 原文の呼びかけ（τεκνία）、残り短い同在（ἔτι μικρὸν μεθ’ ὑμῶν εἰμι）、将来の「捜す」、以前ユダヤ人たちに語った内容との比較、そして弟子たちにも今同じことを告げるという流れを適切に再現しています。「来ることができない」は οὐ δύνασθε ἐλθεῖν の可能・不可能の表現を保ち、理由を補っていません。
  naturalness: 明瞭な現代標準日本語として自然です。「子どもたちよ」という呼びかけと、です・ます調の本文は親愛と厳粛さの双方に適しています。「わたしがあなたがたと一緒にいるのも、あとしばらくです」も意味が明確で、短い残存時間を自然に表します。
  terminology: 「ユダヤ人たち」は τοῖς Ἰουδαίοις を本文で不当に限定せずに訳しており、文脈上のより狭い指示対象の可能性を脚注に留保しています。「子どもたちよ」は τεκνία の家族的で親愛を含む呼びかけとして適切です。
