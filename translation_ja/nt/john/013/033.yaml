id: JHN.13.33
reference: John 13:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τεκνία, ἔτι μικρὸν μεθ’ ὑμῶν εἰμι· ζητήσετέ με, καὶ καθὼς εἶπον τοῖς Ἰουδαίοις ὅτι Ὅπου ⸂ἐγὼ ὑπάγω⸃ ὑμεῖς οὐ δύνασθε ἐλθεῖν, καὶ ὑμῖν λέγω ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/033.yaml
  text: Little children[a], I am with you a little while longer. You will seek me, and just as I said to the Jews, ‘Where I am going[b], you are not able to come,’ so now I also say to you.
translation:
  language: ja
  text: 子どもたちよ、わたしがあなたがたと一緒にいるのも、あとしばらくです。あなたがたはわたしを捜すでしょう。わたしがユダヤ人たち[a]に、『わたしが行く所に、あなたがたは来ることができない[b]』と言ったように、今、あなたがたにも言います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈によっては「ユダヤ人の指導者たち」とも理解できます。ヨハネ文書の「ユダヤ人たち」は、場合によりユダヤ地方の権力者たちをより限定的に指すことがあります。
    reason: alternative_reading
  - marker: b
    text: より簡潔には「来られない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τεκνία
  choice: 子どもたちよ
  rationale: 呼びかけの複数形で、親愛を込めた家族的な比喩である。「幼子たち」では実年齢を強く連想させやすいため、現代日本語として自然な「子どもたちよ」とした。
- source_word: ἔτι μικρόν
  choice: あとしばらく
  rationale: 残された時間が短いことを表す慣用的な時間表現。「もう少しの間」も可能だが、別離が迫っている文脈を自然に示す。
- source_word: μεθ’ ὑμῶν εἰμι
  choice: わたしがあなたがたと一緒にいる
  rationale: 現在の同在をそのまま表し、「とどまる」など原文にない意味を加えない。
- source_word: ζητήσετέ με
  choice: あなたがたはわたしを捜すでしょう
  rationale: ζητέωの未来形を、いなくなった者を捜し求める文脈に合う現代日本語で表した。
- source_word: τοῖς Ἰουδαίοις
  choice: ユダヤ人たち
  rationale: 語の通常の意味を本文に保ち、この箇所だけで指導者層に限定しない。ヨハネ文書における文脈上の限定の可能性は脚注に示した。
- source_word: Ὅπου ἐγὼ ὑπάγω
  choice: わたしが行く所
  rationale: ὑπάγωが示す立ち去りを、日本語で過度に説明せず自然に表現した。強調されたἐγώは「わたしが」に反映した。
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: あなたがたは来ることができない
  rationale: δύνασθεの可能・能力の意味を明示し、単なる禁止とは解釈しない形にした。
- source_word: καὶ ὑμῖν λέγω ἄρτι
  choice: 今、あなたがたにも言います
  rationale: ἄρτιの「今」と、先に語られた相手に加えて弟子たちにも同じことを告げる並行関係を自然に示した。
theological_decisions:
- issue: ヨハネ文書における τοῖς Ἰουδαίοις の指示範囲
  choice: ユダヤ人たち
  alternative: ユダヤ人の指導者たち
  rationale: 原語自体は広く「ユダヤ人たち」を意味し、この節だけでは指導者層への限定が確定しないため、本文では範囲を狭めなかった。一方、ヨハネ文書では文脈によりユダヤ地方の権力者・指導者を指す場合があるため、その可能性を脚注に残した。
- issue: 弟子たちがイエスの行く所へ来られないことの性質
  choice: 来ることができない
  alternative: 来られない
  rationale: 原文は理由をこの節で明示せず、能力・可能性の否定として述べる。時期、資格、存在論的隔たりなどに一義的に解決せず、原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの親愛を込めた呼びかけと別離を告げる厳粛さを保った。「です・ます」調で統一し、逐語的すぎる不自然さを避けつつ、原文の反復と対比を保持した。英語相談層では脚注記号と対象語の位置にずれが見られたため、日本語稿では各脚注を実際に説明する語句の直後に配置した。
