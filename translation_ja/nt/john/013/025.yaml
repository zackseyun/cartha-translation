source:
  edition: SBLGNT
  text: ⸀ἀναπεσὼν ἐκεῖνος οὕτως ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ λέγει αὐτῷ· Κύριε, τίς ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/025.yaml
  text: So he[a], leaning back in this way against Jesus' chest, says to him, “Lord, who is it?”
translation:
  language: ja
  text: そこで彼は、そのままイエスの胸に寄りかかり[a]、イエスに言った。「主よ、だれですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イエスの胸元にもたれるように横になり」。ギリシア語は、当時、食卓で横になって食事をした姿勢を反映している。
    reason: 食事時の姿勢と動作に関する語義上・文化上の補足。
lexical_decisions:
- source_word: ἀναπεσὼν
  choice: 寄りかかり
  rationale: 食卓で横になっていた姿勢から身を傾ける動作を表す。直後の「イエスの胸に」と合わせ、当時の食事姿勢と具体的な動きを自然な現代日本語で伝える。
- source_word: ἐκεῖνος
  choice: 彼は
  rationale: 直前に言及された弟子を指す代名詞として訳し、「その弟子」と説明的に補わず、原文の指示表現を保つ。
- source_word: οὕτως
  choice: そのまま
  rationale: 直前の節に描かれた位置・姿勢を受けて、その状態からイエスのほうへ身を寄せたことを自然に示す。
- source_word: ἐπὶ τὸ στῆθος τοῦ Ἰησοῦ
  choice: イエスの胸に
  rationale: στῆθοςを現代日本語で明瞭な「胸」とし、ἐπίと動作の組み合わせを「胸に寄りかかる」と表現した。
- source_word: λέγει αὐτῷ
  choice: イエスに言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語文として自然な過去形にした。代名詞の指示先は明瞭さのため「イエス」とした。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけとヨハネ福音書における称号としての含みをともに残す。
- source_word: τίς ἐστιν;
  choice: それはだれですか
  rationale: 裏切る者の正体を尋ねる文脈を受け、「それ」を補うことで日本語として自然にしつつ、問いの簡潔さを保つ。
theological_decisions:
- issue: イエスへの呼びかけ κύριος の訳
  choice: 主よ
  alternative: 先生／あなた
  rationale: 単なる丁寧な呼称に限定せず、敬意ある呼びかけとキリスト論的称号の両方に開かれた原語の含みを保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。食卓での姿勢は本文を過度に説明的にせず、脚注で文化的背景を補った。
