source:
  edition: SBLGNT
  text: εἰ οὖν ἐγὼ ἔνιψα ὑμῶν τοὺς πόδας ὁ κύριος καὶ ὁ διδάσκαλος, καὶ ὑμεῖς ὀφείλετε ἀλλήλων νίπτειν τοὺς πόδας·
base_translation:
  language: en
  yaml_path: translation/nt/john/013/014.yaml
  text: If I then[a], the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet.
translation:
  language: ja
  text: ですから、主であり教師であるこのわたしが、あなたがたの足を洗ったのなら、あなたがたも互いの足を洗うべきです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: ですから、…のなら
  rationale: 条件を表す εἰ と、前文からの推論を示す οὖν を、自然な日本語で保った。
- source_word: ἐγὼ
  choice: このわたしが
  rationale: 明示された代名詞の強調と、弟子たちとの対比を「このわたし」で表した。
- source_word: ἔνιψα
  choice: 洗った
  rationale: 直前に完了した具体的行為を、日本語で自然な過去形にした。
- source_word: ὑμῶν τοὺς πόδας
  choice: あなたがたの足を
  rationale: 属格を自然な所有表現として訳した。
- source_word: ὁ κύριος καὶ ὁ διδάσκαλος
  choice: 主であり教師である
  rationale: 二つの定冠詞付き称号を保持し、イエスの立場とその行為との対照を示した。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: καί の対応関係と、明示された ὑμεῖς の強調を簡潔に表した。
- source_word: ὀφείλετε
  choice: べきです
  rationale: 負っている義務・道徳的責務を表しつつ、命令形以上に強くしない表現とした。
- source_word: ἀλλήλων νίπτειν τοὺς πόδας
  choice: 互いに足を洗う
  rationale: 相互性と具体的な足洗いの行為をそのまま保持し、一般的な奉仕へ意訳しなかった。
theological_decisions:
- issue: κύριος の称号としての訳
  choice: 主
  alternative: 主人
  rationale: 文脈上、弟子たちがイエスに用いる称号であり、通常のキリスト論的称号として「主」を採用した。
- issue: 足を洗うことの命令の性質
  choice: 具体的に「互いに足を洗う」と訳す
  alternative: 「互いに謙遜に仕える」と一般化する
  rationale: 本文は具体的な足洗いを明記しているため、その象徴的・模範的意味を訳文中で先取りして限定しない。
translation_notes:
  register: 明瞭で現代的な敬体を用いながら、イエスの称号と論理的な条件・帰結を格調を損なわずに表現した。「このわたし」で原文の明示的な ἐγώ の強調を伝えた。
