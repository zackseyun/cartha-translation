  text: 弟子たちは、誰のことを言っておられるのかと当惑し、互いに顔を見合わせていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβλεπον
  choice: 顔を見合わせていた
  rationale: 未完了過去が示す継続的な動作を「〜ていた」で表した。εἰς ἀλλήλουςと合わせ、日本語で自然に相互の視線を表現する。
- source_word: εἰς ἀλλήλους
  choice: 互いに顔を見合わせて
  rationale: 弟子たちが相互に見ていたことを、場面に即した自然な日本語で表した。原文に「顔」は明示されないが、日本語の慣用表現として視線の交錯を過不足なく伝える。
- source_word: οἱ μαθηταὶ
  choice: 弟子たちは
  rationale: 定冠詞は文脈上すでに知られている弟子たちを指す。「イエスの」は原文にないため補わない。
- source_word: ἀπορούμενοι
  choice: 分からず
  rationale: 誰を指すのか判断できず困惑している状態を、明瞭な現代日本語で表した。単なる知識不足ではなく当惑を含むことは文脈と「顔を見合わせていた」によって伝わる。
- source_word: περὶ τίνος
  choice: 誰のことを
  rationale: περί＋属格の問いを、自然で正確な日本語にした。
- source_word: λέγει
  choice: 言っておられるのか
  rationale: 歴史的現在を日本語の物語文に自然な形で訳し、発話者イエスへの敬意を通常の敬語で示した。「意味している」と解釈を加えず、発言そのものを保つ。
