  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ οὐδὲ ἀπόστολος μείζων τοῦ πέμψαντος αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/016.yaml
  text: Truly[a], truly, I say to you, a servant is not greater than his master[c][b], nor is an apostle greater than the one who sent him.
translation:
  language: ja
  text: まことに、まことに、あなたがたに言います。奴隷[a]はその主人[b]より上ではなく、遣わされた者[c]は、その者を遣わした方より上ではありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「しもべ」とも訳せます。ギリシア語は主人の権威の下にある者を指し、ここではその強い社会的従属関係を示すため「奴隷」としました。
    reason: lexical_alternative
  - marker: b
    text: 「主」とも訳せます。ここでは奴隷との社会的関係を表す語として「主人」としました。
    reason: lexical_alternative
  - marker: c
    text: 「使徒」または「使者」とも訳せます。ここでは「遣わした者」との対応を示すため「遣わされた者」としました。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: ヨハネ福音書に特徴的な厳粛で強調された導入句として、反復を保ちながら現代日本語で意味が明瞭になるようにした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 二人称複数と発言の定型句を、自然で明快な敬体として表した。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 主人の権威の下にある身分が比較の中心なので、より弱い「しもべ」ではなく、社会的従属関係を明確に示す「奴隷」とした。
- source_word: μείζων
  choice: 偉い
  rationale: ここでは大きさではなく、地位・権威において上位であることを表す。日本語の比較表現「より偉くはない」が両句に自然に対応する。
- source_word: κύριος
  choice: 主人
  rationale: 直接的な称号としての「主」ではなく、奴隷との社会的関係を示す語なので「主人」とした。
- source_word: ἀπόστολος
  choice: 遣わされた者
  rationale: 語の一般的な意味である使者・派遣された者を表し、直後の「遣わした者」との語義的な対応を明瞭にした。「使徒」だと制度的称号に限定して読まれる可能性がある。
- source_word: τοῦ πέμψαντος αὐτόν
  choice: 自分を遣わした者
  rationale: 属格の定冠詞付きアオリスト分詞を自然に表し、αὐτόνが遣わされた者を指すことを日本語で明確にした。
theological_decisions:
- issue: κύριοςを称号として訳すか、社会的関係を示す語として訳すか
  choice: 主人
  alternative: 主
  rationale: 文脈は奴隷とその所有者・主人との関係を用いた比較であり、ここで直接キリスト論的称号と断定する必要はない。社会的比喩を保つ「主人」を採用した。
- issue: ἀπόστολοςを「使徒」とするか、一般的な派遣者の意味を表すか
  choice: 遣わされた者
  alternative: 使徒
  rationale: ἀπόστολοςには委任を受けた使者という一般的意味があり、πέμψαντοςとの並行がその意味を前面に出している。特定の役職だけに狭めず、原文の意味範囲を保った。
translation_notes:
  register: 明瞭な現代標準日本語の敬体を用いた。イエスの厳粛な宣言を保つため「まことに」を反復し、二つの比較節も対応する構造にした。語調は平易だが、聖書本文としての品位を保っている。
