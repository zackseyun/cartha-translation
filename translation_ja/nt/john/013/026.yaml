id: JHN.13.26
reference: John 13:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἀποκρίνεται ὁ Ἰησοῦς· Ἐκεῖνός ἐστιν ᾧ ἐγὼ ⸀βάψω τὸ ψωμίον ⸂καὶ δώσω αὐτῷ⸃· ⸂βάψας οὖν⸃ τὸ ⸀ψωμίον δίδωσιν Ἰούδᾳ Σίμωνος ⸀Ἰσκαριώτου.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/026.yaml
  text: Jesus answers[a], “It is he to whom I will dip the piece of bread and give it.” So, having dipped the piece of bread, he gives it to Judas, the son of Simon Iscariot.
translation:
  language: ja
  text: イエスは答えられた。「私がパン切れを浸して与える相手が、その人です。」そこで、パン切れを浸してから、シモン・イスカリオテの子ユダ[a]にそれを与えられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「シモンの子、イスカリオテのユダ」。ギリシア語の語句は、どちらの意味にも取ることができる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται
  choice: 答えられた
  rationale: ギリシア語は物語を生き生きと描く歴史的現在だが、日本語では過去形が自然である。イエスへの敬意を表すため尊敬表現とした。
- source_word: Ἐκεῖνός ἐστιν
  choice: その人です
  rationale: 人物を特定する指示表現として、明瞭で自然な現代日本語にした。
- source_word: ᾧ ἐγὼ βάψω τὸ ψωμίον καὶ δώσω αὐτῷ
  choice: 私がパン切れを浸して与える相手
  rationale: 未来形の予告的な意味を文脈上自然な連体節で表し、浸すことと与えることの対象が同一人物であることを明確にした。
- source_word: ψωμίον
  choice: パン切れ
  rationale: 小さな一片のパンを指す語であり、「パン切れ」は簡潔で現代の読者に分かりやすい。
- source_word: βάψας οὖν
  choice: そして、パン切れを浸すと
  rationale: アオリスト分詞が主動詞に先立つ動作を表すため、自然な日本語で動作の順序を示した。οὖνは文脈上の展開を「そして」で表した。
- source_word: δίδωσιν
  choice: それを与えられた
  rationale: 歴史的現在を日本語の物語として自然な過去形で表し、省略された目的語を補った。
- source_word: Ἰούδᾳ Σίμωνος Ἰσκαριώτου
  choice: シモン・イスカリオテの子ユダに
  rationale: 語順と属格関係に最も直接的に従った。ただし「イスカリオテ」がユダを指すという別解も可能なので脚注に示した。
theological_decisions:
- issue: 末尾の「イスカリオテ」がシモンとユダのどちらを修飾するか
  choice: 本文では「シモン・イスカリオテの子ユダ」とした。
  alternative: 「シモンの子、イスカリオテのユダ」
  rationale: Σίμωνος Ἰσκαριώτου という連続する属格は、表面的な統語では「イスカリオテのシモンの」と読める。一方、伝統的な人物呼称としてユダに「イスカリオテ」を結び付ける理解も可能であるため、曖昧さを脚注で保持した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。イエスの発話と行為には一貫して尊敬表現を用い、物語の歴史的現在は日本語として自然な過去形で訳した。
