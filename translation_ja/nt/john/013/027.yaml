revisions:
- from: そのパン切れ[a]を受けると、その時、サタンが彼の中に入った。そこでイエスは彼に言われた。「しようとしていることを、もっと早くしなさい[b]。」
  to: そのパンの一切れ[a]を受け取った後、そのとき、サタンが彼の中に入った。そこでイエスは彼に言われた。「あなたがしていることを、もっと早くしなさい。」[b]
  rationale: 現在形Ὃ ποιεῖςの意味を保つため、「しようとしていること」を「あなたがしていること」に改めた。ψωμίονの後という時間関係は、日本語で自然に示すため「受け取った後」とした。サタンの侵入を直接述べる表現、οὖνの接続、イエスへの敬意ある発話表現、およびτάχιονの比較級「もっと早く」は維持した。脚注記号はそれぞれ該当語句・発話に配置した。
