  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ μετὰ τὸ ψωμίον τότε εἰσῆλθεν εἰς ἐκεῖνον ὁ Σατανᾶς. λέγει οὖν αὐτῷ ⸀ὁ Ἰησοῦς· Ὃ ποιεῖς ποίησον τάχιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/027.yaml
  text: And after the piece of bread[a], then Satan entered into him. So Jesus said to him, “What you are doing[b], do more quickly.”
translation:
  language: ja
  text: そのパンの一切れ[a]を受け取った後、そのとき、サタンが彼の中に入った。そこでイエスは彼に言われた。「あなたがしていることを、もっと早くしなさい。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一口分」とも訳せる。ギリシア語は小さな食物片を指し、ここでは食事の際に渡されたパンと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「早くしなさい」とも訳せる。ギリシア語は比較級で、字義的には「もっと早く」である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ψωμίον
  choice: パン切れ
  rationale: 食事の中で渡された小さな食物片を指す。直前の文脈ではパンなので、現代日本語で具体的かつ簡潔な「パン切れ」とした。
- source_word: εἰσῆλθεν εἰς ἐκεῖνον
  choice: 彼の中に入った
  rationale: εἰσέρχομαι＋εἰςの方向性を保ち、サタンの人格的な侵入を弱めたり、支配や憑依について本文以上に説明したりしない表現とした。
- source_word: ὁ Σατανᾶς
  choice: サタン
  rationale: 新約聖書で定着した固有名・称号として音写し、語源的な「敵対者」へ置き換えなかった。
- source_word: λέγει οὖν αὐτῷ ὁ Ἰησοῦς
  choice: そこでイエスは彼に言われた
  rationale: οὖνの文脈上のつながりを「そこで」で示し、歴史的現在λέγειは自然な日本語の物語時制で過去として表した。イエスの発言には通常の敬意を示す尊敬語を用いた。
- source_word: Ὃ ποιεῖς
  choice: しようとしていること
  rationale: 字義的には現在形で「していること」だが、この場面ではまだ実行に移すべき行為を指す自然な日本語として「しようとしていること」とした。意図を過度に特定しない。
- source_word: ποίησον
  choice: しなさい
  rationale: 簡潔で決然としたアオリスト命令の力を、自然な命令表現で示した。
- source_word: τάχιον
  choice: もっと早く
  rationale: 比較級の形を保つため、単なる「早く」ではなく「もっと早く」とした。比較の基準は本文が明示しないため補わない。
theological_decisions:
- issue: サタンのユダに対する行為の性質
  choice: 「サタンが彼の中に入った」と直接的に訳す
  alternative: 「サタンが彼を支配した」または「彼がサタンに身を委ねた」
  rationale: 人格的な侵入を述べる本文の緊張を保ち、単なる比喩に弱めることも、憑依や全面的支配について本文以上の教理を加えることもしない。
- issue: イエスの命令における比較級
  choice: 「もっと早く」と比較級を明示する
  alternative: 「早く」
  rationale: τάχιονの形態的な比較の含みを保存する。何と比較しているかは本文で明示されていないため、解釈によって補わない。
translation_notes:
  register: 明瞭で現代的ながら品位のある物語文。主節の「その時」はτότεを明示し、οὖνは「そこで」とした。イエスの発話には「言われた」を用いるが、本文にない神学的敬称や説明は加えていない。すべての脚注記号を本文に配置した。
