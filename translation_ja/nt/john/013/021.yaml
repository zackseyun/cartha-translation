id: JHN.13.21
reference: John 13:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ταῦτα εἰπὼν ⸀ὁ Ἰησοῦς ἐταράχθη τῷ πνεύματι καὶ ἐμαρτύρησεν καὶ εἶπεν· Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/021.yaml
  text: After saying these things[a], Jesus was troubled in spirit, and testified and said, “Truly, truly, I say to you, one of you will betray me.”
translation:
  language: ja
  text: これらのことを話した後、イエスは心のうちで動揺し、証しをして、こう言われた。「まことに、まことに、あなたがたに言います。あなたがたのうちの一人が、わたしを裏切ります[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「わたしを引き渡します」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα εἰπὼν
  choice: こう話してから
  rationale: アオリスト分詞を時間的な先行関係として自然な現代日本語にし、直前までの発言を受ける ταῦτα も「こう」で簡潔に示した。
- source_word: ἐταράχθη τῷ πνεύματι
  choice: 霊において心を騒がせ
  rationale: ἐταράχθη の内的な動揺を「心を騒がせ」で表しつつ、τῷ πνεύματι を省かず「霊において」として、その心理的・霊的な幅を保った。
- source_word: ἐμαρτύρησεν καὶ εἶπεν
  choice: 証言してこう言われた
  rationale: ヨハネ文書で重要な μαρτυρέω の証言・証しという語感と、後続する発言の厳粛さを保持した。
- source_word: Ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: ヨハネ特有の厳粛な導入句の反復を保ち、一般の読者にも意味が明瞭な表現とした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: λέγω の直接性と ὑμῖν の対象を明示し、引用内では自然でありながら厳粛な語調を用いた。
- source_word: εἷς ἐξ ὑμῶν
  choice: あなたがたのうちの一人
  rationale: 部分を示す ἐξ の関係と、弟子たちの中の一人であるという衝撃を明確に伝える。
- source_word: παραδώσει με
  choice: わたしを裏切ります
  rationale: この文脈ではユダの背信行為を指すため「裏切る」が自然で正確である。一方、παραδίδωμι のより字義的な「引き渡す」は受難物語で意味を持つため脚注に残した。
theological_decisions:
- issue: イエスの内的動揺の表現
  choice: 霊において心を騒がせ
  alternative: 心を騒がせ／霊が騒いだ
  rationale: イエスの真実な内的苦悩を弱めず、同時に τῷ πνεύματι を訳文上に保持した。苦悩の性質について本文以上の教理的説明は加えていない。
- issue: 裏切りの予告における παραδίδωμι
  choice: 裏切ります
  alternative: 引き渡します
  rationale: 直近の文脈における弟子の背信を明瞭に伝える語を本文に置き、原語の「引き渡す」という幅は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準語を用い、語りは品位ある常体、イエスの発言は厳粛さを保つ丁寧体とした。「霊において」はやや改まった表現だが、原文の τῷ πνεύματι を明示して解釈上の幅を保つため採用した。
