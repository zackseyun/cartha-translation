revisions:
- from: こう話してから、イエスは霊において心を騒がせ、証言してこう言われた。「まことに、まことに、あなたがたに言います。あなたがたのうちの一人が、わたしを裏切ります[a]。」
  to: これらのことを話した後、イエスは心のうちで動揺し、証しをして、こう言われた。「まことに、まことに、あなたがたに言います。あなたがたのうちの一人が、わたしを裏切ります[a]。」
  rationale: 内的動揺を表す ἐταράχθη τῷ πνεύματι を、現代日本語として不自然でない「心のうちで動揺し」とした。これは霊的・内面的領域を、特定の教理的解釈を加えずに表す。「証しをして」は μαρτυρέω のヨハネ的な語調を保持し、脚注は παραδίδωμι の字義的な代替訳を維持する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:26Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な意味内容と語順上の流れ、ヨハネ特有の「まことに、まことに」、また παραδώσει の文脈上の意味を適切に伝えている。「霊において心を騒がせ」は原語の与格を保持しようとする意図は理解できるが、日本語としては不自然で、しかも「心を騒がせる」は他動詞的にも読め、ἐταράχθη（動揺した）の表現として不安定である。
  naturalness: 「こう話してから」および「証言してこう言われた」は意味は通るものの、明瞭な現代標準語としてはややぎこちない。「これらのことを話した後」「心のうちで動揺し」「証しをして、こう言われた」とすることで、原文の厳粛さを保ちながら自然になる。
  terminology: 「証し」はヨハネ文書における μαρτυρέω の反復的・神学的な語感を保つ。「裏切ります」は当該文脈では適切であり、「引き渡します」を脚注に残すことで παραδίδωμι の語義の幅も確保される。
  issues:
  - severity: medium
    issue: 「霊において心を騒がせ」の不自然さと構文上の曖昧さ
    rationale: 日本語の「心を騒がせる」は通常、何かが人の心を動揺させるという他動詞的表現にもなり得るため、イエス自身が内的に動揺したという ἐταράχθη を明瞭に表しにくい。「心のうちで動揺し」は自然で、内面的な領域を示す τῷ πνεύματι の趣旨も保つ。
  - severity: low
    issue: 「こう話してから」「証言してこう言われた」の反復的で硬い表現
    rationale: 原文への対応はあるが、現代日本語では「これらのことを話した後」「証しをして、こう言われた」の方が明瞭かつ読みやすい。
