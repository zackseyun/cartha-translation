  text: νεύει οὖν τούτῳ Σίμων Πέτρος ⸂πυθέσθαι τίς ἂν εἴη⸃ περὶ οὗ λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/024.yaml
  text: So Simon Peter motioned to this one to ask who it might be about whom he was speaking[a].
translation:
  language: ja
  text: そこで、シモン・ペテロはその弟子に、イエスがだれのことを言っておられるのか尋ねるよう、合図をした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこで、シモン・ペテロはその弟子に合図を送り、イエスがだれのことを言っておられるのか尋ねるよう促した。」
    reason: νεύει（合図する）と不定詞 πυθέσθαι（尋ねること）の関係を、「合図を送り、…促した」と明示する別訳。
lexical_decisions:
- source_word: νεύει
  choice: 合図を送り
  rationale: 身ぶりなどによる非言語的な合図を表す。具体的に「うなずく」と限定せず、自然な日本語で動作の意味を保った。
- source_word: οὖν
  choice: そこで
  rationale: 前節を受けた物語上の帰結・展開を示すため、「そこで」とした。
- source_word: τούτῳ
  choice: その弟子に
  rationale: 直前に言及された弟子を指す指示代名詞である。日本語では文脈上の指示対象を明示する「その弟子」が自然である。
- source_word: πυθέσθαι
  choice: 尋ねさせた
  rationale: 不定詞はペテロの合図の意図、すなわち弟子に尋ねるよう促したことを表す。日本語では使役表現により簡潔に示した。
- source_word: τίς ἂν εἴη
  choice: だれのこと…なのか
  rationale: ἄνを伴う希求法が示す不確定性は、間接疑問の「だれ…なのか」で自然に表した。文脈では人物の同定を問う。
- source_word: περὶ οὗ λέγει
  choice: イエスが…のことを言っておられる
  rationale: περίは発言の対象を示す。「イエス」は原文では省略された主語だが文脈上明白で、日本語の曖昧さを避けるため補った。歴史的現在は場面の臨場感を保つ「言っておられる」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述とした。「この者」のような不自然な直訳は避けつつ、τούτῳの指示性を「その弟子」で保持した。
