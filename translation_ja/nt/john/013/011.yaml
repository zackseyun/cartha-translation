  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ᾔδει γὰρ τὸν παραδιδόντα αὐτόν· διὰ τοῦτο εἶπεν ⸀ὅτι Οὐχὶ πάντες καθαροί ἐστε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/011.yaml
  text: For he knew the one who was betraying him; for this reason he said[a], “Not all of you are clean.”
translation:
  language: ja
  text: イエスは、ご自分を裏切る者[a]を知っておられた。それで、「あなたがたが皆、清いわけではない」と言われたのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裏切る者」は、より字義的には「引き渡す者」。文脈ではユダの裏切りを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾔδει
  choice: 知っておられた
  rationale: οἶδαの過去完了形はここでは過去時点における継続的な認識を表す。イエスへの敬意を保ちつつ、自然な日本語の叙述とした。
- source_word: γὰρ
  choice: のである
  rationale: 前節の発言の理由を説明する接続関係を、文末の説明表現によって自然に示した。
- source_word: τὸν παραδιδόντα αὐτόν
  choice: ご自分を裏切ろうとしている者
  rationale: παραδίδωμιの基本義は「引き渡す」だが、受難物語ではユダの裏切りを指す。現在分詞の進行中・企図的な含みを「裏切ろうとしている」で表した。字義的な別訳は脚注に残した。
- source_word: διὰ τοῦτο
  choice: それで
  rationale: イエスの認識と発言との因果関係を、簡潔で自然な現代日本語で明示した。
- source_word: εἶπεν ὅτι
  choice: 「…」と言われた
  rationale: ὅτιが導く内容を直接話法で表し、日本語として自然な引用構文にした。
- source_word: Οὐχὶ πάντες
  choice: 皆、…わけではない
  rationale: 部分否定、すなわち「全員が清いのではない」という意味を、日本語で誤解のない形にした。
- source_word: καθαροί
  choice: 清い
  rationale: 洗足という身体的な清潔の比喩と、霊的・内面的な清さの双方を響かせる語として「清い」を選んだ。
- source_word: ἐστε
  choice: である
  rationale: 二人称複数の現在形を、引用内の自然な日本語の断定として表した。
theological_decisions:
- issue: παραδιδόνταがユダの行為をどう表すか
  choice: 裏切ろうとしている
  alternative: 引き渡そうとしている
  rationale: 文脈上はユダの背信行為を指すため本文では「裏切る」としたが、原語の字義的な「引き渡す」も脚注で保持した。
- issue: καθαροίの洗足談話における意味
  choice: 清い
  alternative: きれいだ／純粋だ
  rationale: 身体を洗う場面とのつながりと霊的状態への含意を一方に限定せず保つため、「清い」とした。
- issue: Οὐχὶ πάντεςの否定範囲
  choice: あなたがたが皆、清いわけではない
  alternative: あなたがたは皆、清くない
  rationale: ギリシア語は全員を否定するのではなく「全員が清い」という命題を否定する。部分否定を明確にして、弟子全員が清くないとの誤読を避けた。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「知っておられた」「言われた」でイエスへの自然な敬語を用い、部分否定は日常的で誤解の少ない構文にした。脚注標識[a]は対応する文の末尾に置いた。
