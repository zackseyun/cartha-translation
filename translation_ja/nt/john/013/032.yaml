  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂εἰ ὁ θεὸς ἐδοξάσθη ἐν αὐτῷ,⸃ καὶ ὁ θεὸς δοξάσει αὐτὸν ἐν ⸀αὑτῷ, καὶ εὐθὺς δοξάσει αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/032.yaml
  text: If God was glorified in him[a], God will also glorify him in himself[b], and will glorify him at once.
translation:
  language: ja
  text: もし[a]神が彼のうちで栄光をお受けになったのなら[b]、神もご自身のうちで彼に栄光をお与えになり[c]、そして、すぐに彼に栄光をお与えになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「もし」は、ここでは条件が事実であることを前提とし、「……ので」または「……以上」という意味に理解することもできる。
    reason: alternative_reading
  - marker: b
    text: 一部の古代写本は、「もし神が彼のうちで栄光をお受けになったのなら」に当たる部分を欠いている。
    reason: textual_variant
  - marker: c
    text: 「ご自身のうちで」は、「ご自身とともに」または「ご自身によって」と理解することもできる。原文は簡潔で、複数の含みを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: もし……なら
  rationale: 明示的な条件を表す語をそのまま保った。文脈上は条件が真であることを前提としている可能性が高いが、本文で「神が……ので」と断定的な理由表現には置き換えない。
- source_word: ἐδοξάσθη
  choice: 栄光をお受けになった
  rationale: アオリスト受動形を自然な現代日本語で表し、主語が神であることを保った。「栄光が現された」とするよりも、原文の『神が栄光を受ける』という構文に近い。
- source_word: ἐν αὐτῷ
  choice: 彼のうちで
  rationale: ἐν の基本的な空間・関係表現とヨハネ文書特有の含みを残した。「彼によって」は手段の意味に限定しすぎるため本文では避けた。
- source_word: δοξάσει
  choice: 栄光を与え／栄光をお与えになる
  rationale: 未来能動形を訳し、前節との語彙的連続性を「栄光」によって保った。後半では神を主語とする敬語を明示した。
- source_word: ἐν αὑτῷ
  choice: ご自身のうちで
  rationale: 再帰代名詞が神を指すことを明確にしつつ、簡潔で含意の深いギリシア語表現を解釈的に広げず残した。
- source_word: εὐθύς
  choice: すぐに
  rationale: 即時性を、普通の読者に自然で明瞭な現代日本語で表した。
theological_decisions:
- issue: 事実と見なされている可能性の高い文脈における εἰ の条件的用法
  choice: 本文を「もし……なら」とする
  alternative: 「神が彼のうちで栄光をお受けになったので」または「……以上」
  rationale: 文脈は条件の成立を前提としているように読めるが、原文は明示的な理由接続詞ではなく εἰ を用いる。条件表現を保持し、文脈的な理解を脚注に示すことで神学的緊張を解消しすぎない。
- issue: ἐν αὑτῷ が表す神と御子の栄光の関係
  choice: 「ご自身のうちで」と訳す
  alternative: 「ご自身とともに」または「ご自身によって」
  rationale: 原文の再帰表現と ἐν の簡潔さを保持し、場所・関係・手段のいずれか一つに意味を限定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神を主語とする箇所には節度ある敬語を用いた。「彼のうちで」「ご自身のうちで」は日常語よりやや格調があるが、ヨハネ文書の相互内在的な表現と原文の曖昧さを保つため採用した。
