  text: ἀπ’ ἄρτι λέγω ὑμῖν πρὸ τοῦ γενέσθαι, ἵνα ⸂πιστεύσητε ὅταν γένηται⸃ ὅτι ἐγώ εἰμι.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/019.yaml
  text: From now on I am telling you before it happens[a], so that when it does happen, you may believe that I am he.
translation:
  language: ja
  text: 今から、そのことが起こる前にあなたがたに告げておきます。それが起こったときに、あなたがたが「わたしはある[a]」と信じるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしがその者である」。直訳に近い「わたしはある」というギリシア語表現は、イザヤ書などに見られる神の自己宣言や、ヨハネ福音書のほかの箇所を反響している可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπ’ ἄρτι
  choice: 今から
  rationale: 現在を起点として先を指す自然な現代日本語で、前向きの時間的意味を保つ。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言っておきます
  rationale: 予告として事前に語る文脈を自然な日本語で示す。「言っておく」は直後の「起こる前に」と調和する。
- source_word: πρὸ τοῦ γενέσθαι
  choice: 事が起こる前に
  rationale: πρόを伴う冠詞付き不定詞の先行時間を明瞭に表す。何が起こるかは本文同様に特定しない。
- source_word: ἵνα
  choice: ためです
  rationale: 目的を表すἵναの機能を、日本語の文末で明確かつ自然に表す。
- source_word: πιστεύσητε
  choice: あなたがたが信じる
  rationale: πιστεύωの基本的意味を保ち、信頼や信仰開始などの含意を過度に限定しない。
- source_word: ὅταν γένηται
  choice: それが起こったとき
  rationale: 将来の出来事が実現する時を表すὅταν＋接続法を、自然な条件的時間表現で訳す。
- source_word: ὅτι ἐγώ εἰμι
  choice: わたしはある
  rationale: 明示された補語のない絶対用法を補わず、ヨハネ文書およびイザヤ書に響く可能性のある自己同定表現の曖昧さと神学的緊張を保持する。
theological_decisions:
- issue: ヨハネ文書で神的自己同定への響きを持ち得る絶対用法ἐγώ εἰμιの訳し方
  choice: わたしはある
  alternative: わたしがその者である
  rationale: 原文には補語がないため、「その者」を本文に補うと意味を限定し得る。やや異例でも「わたしはある」として原文の形と神学的含意を保ち、脚注で自然な別訳と可能な背景を示す。
translation_notes:
  register: 明瞭な現代標準語を基本としつつ、ἐγώ εἰμιだけは原文の意図的な無補語表現を保つため「わたしはある」とした。全体は弟子たちへの厳粛な予告にふさわしい丁寧体で統一した。
