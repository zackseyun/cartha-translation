  text: λαβὼν οὖν τὸ ψωμίον ἐκεῖνος ⸂ἐξῆλθεν εὐθύς⸃. ἦν δὲ νύξ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/030.yaml
  text: So after taking the piece of bread[a], he went out immediately[c][b]. And it was night.
translation:
  language: ja
  text: そこで、その人はパンの一切れ[a]を受け取ると、すぐに出て行った。[b] 時は夜であった。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その一口分」または「その一切れ」とも訳せる。ギリシア語のψωμίονは、食事の際に渡される小さなパンまたは食物の一片を指す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では「その人」に当たる指示表現が用いられ、単なる「彼」よりも強調されており、ユダに注意を向けていると考えられる。
    reason: lexical_alternative
  - marker: c
    text: 「夜」は文字どおりの時刻を示すが、同時に本福音書における光と闇の主題を響かせている可能性もある。
    reason: cross_reference
lexical_decisions:
- source_word: λαβὼν
  choice: 受け取ると
  rationale: アオリスト分詞を主動詞に先立つ出来事として自然な日本語で表し、パンを差し出された直前の文脈にも合うよう「受け取る」とした。
- source_word: οὖν
  choice: そこで
  rationale: 物語の展開と直前の出来事を受けた帰結を示す接続語として、現代日本語で自然な「そこで」を選んだ。
- source_word: τὸ ψωμίον
  choice: パンの一切れ
  rationale: ψωμίονが食事の際の小さなパンまたは食物の一片を指すことを、具体的で分かりやすく表した。
- source_word: ἐκεῖνος
  choice: その人
  rationale: 単なる代名詞にせず、ユダを指し示す強調された指示表現を保ちつつ、日本語として過度に不自然にならない形にした。
- source_word: ἐξῆλθεν
  choice: 出て行った
  rationale: ἐξέρχομαιの空間的な意味をそのまま保ち、「立ち去った」ほど解釈を加えない表現とした。
- source_word: εὐθύς
  choice: すぐに
  rationale: 行動の即時性を明確かつ自然な現代日本語で表した。
- source_word: ἦν δὲ νύξ
  choice: 時は夜であった
  rationale: 夜という時刻を簡潔に述べる原文の内容と文学的な重みを保ち、象徴的意味を本文に付加しなかった。
theological_decisions:
- issue: ヨハネ福音書における「夜」の象徴的含意
  choice: 時刻を示す文として「時は夜であった」と訳す。
  alternative: 本文で霊的な闇を明示する。
  rationale: 光と闇という本書の主題を響かせている可能性はあるが、原文自体は簡潔な時刻の叙述であるため、象徴的含意は注で示し、本文では解釈を確定しない。
- issue: ユダを指すἐκεῖνοςの強調
  choice: 「その人」として指示性を残す。
  alternative: 単に「彼」とする。
  rationale: 指示代名詞による強調または距離感を平板化せず、同時に日本語として理解しやすくした。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔で厳粛な物語調を保った。「その人」で原文の指示性を残し、「時は夜であった」で結句の文学的な力を生かした。
