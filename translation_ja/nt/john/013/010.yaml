id: JHN.13.10
reference: John 13:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ὁ λελουμένος ⸂οὐκ ἔχει χρείαν⸃ ⸂εἰ μὴ⸃ τοὺς πόδας νίψασθαι, ἀλλ’ ἔστιν καθαρὸς ὅλος· καὶ ὑμεῖς καθαροί ἐστε, ἀλλ’ οὐχὶ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/010.yaml
  text: Jesus said to him[a], “The one who has bathed has no need except to wash his feet, but is completely clean. And you are clean, but not all of you.”
translation:
  language: ja
  text: イエスは彼に言われた。「入浴した者は、足を洗うだけでよく、全身が清い。あなたがたも清い。しかし、皆が清いわけではない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ λελουμένος
  choice: 入浴した者
  rationale: λελουμένοςはλούωの完了分詞で、全身を洗った結果の状態を表す。「入浴した者」はその完了性と全身を洗う意味を自然な現代日本語で保つ。
- source_word: οὐκ ἔχει χρείαν εἰ μὴ
  choice: 足を洗うほかには、洗う必要がなく
  rationale: 必要を表す慣用句と唯一の例外を示すεἰ μήを、意味関係が明確になる自然な日本語にした。
- source_word: τοὺς πόδας νίψασθαι
  choice: 足を洗う
  rationale: νίπτωは足など身体の一部を洗うことに用いられ、前のλούωとの違いを「入浴する／足を洗う」で表した。ギリシア語の中動態を不自然に「自分の足を」と強調しない。
- source_word: καθαρὸς ὅλος
  choice: 全身が清い
  rationale: ὅλοςの全体性を「全身」で明示し、καθαρόςは洗浄の比喩と霊的含意の双方を許す「清い」とした。
- source_word: καὶ ὑμεῖς καθαροί ἐστε
  choice: あなたがたも清い
  rationale: 複数への呼びかけと、直前のκαθαρόςの反復をそのまま保った。
- source_word: ἀλλ’ οὐχὶ πάντες
  choice: しかし、皆が清いわけではない
  rationale: 弟子たちの集団内に例外があることを明確にし、補われる述語「清い」を日本語では明示した。
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: イエスは彼に言われた
  rationale: 歴史的現在を日本語の物語として自然な過去形にし、「彼」は直前の対話相手を指す。
theological_decisions:
- issue: 文字どおりの洗浄と象徴的・霊的な清さ
  choice: 「入浴した」「足を洗う」「清い」という洗浄の比喩を保ち、象徴の意味を本文で説明しない。
  alternative: 「霊的に清い」と解釈を明示する、または二つの動詞をどちらも単に「洗う」と訳す。
  rationale: 本文は文字どおりの行為と象徴的な清さを重ねている。語の違いを保ちつつ象徴を特定の教理に限定しないことで、その緊張と含意を残す。
- issue: 男性単数形の分詞
  choice: 「入浴した者」と一般的な単数表現にする。
  alternative: 「入浴した男」または男性代名詞で訳す。
  rationale: ギリシア語では文法上男性単数だが、格言的に入浴した人一般を指す。日本語の「者」は単数性を保ちながら不必要な性別限定を避ける。
translation_notes:
  register: 明瞭で品位ある現代標準語。「入浴」は「沐浴」より一般読者に分かりやすく、「清い」は身体的な清潔さと象徴的な意味の双方を保つ。イエスの発話には自然な敬意を表す「言われた」を用いた。
