  text: λέγει αὐτῷ Πέτρος· Οὐ μὴ νίψῃς ⸂μου τοὺς πόδας⸃ εἰς τὸν αἰῶνα. ἀπεκρίθη ⸂Ἰησοῦς αὐτῷ⸃· Ἐὰν μὴ νίψω σε, οὐκ ἔχεις μέρος μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/008.yaml
  text: Peter said to him[a], “You will never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”
translation:
  language: ja
  text: ペトロはイエスに言った。「私の足を、決してお洗いにならないでください。」イエスは答えた。「もし私があなたを洗わなければ、あなたは私と何の関わりも持てない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたには、私と共にあずかる分がない」。
    reason: μέροςは「分、取り分、分け前」を意味し、ここではイエスとの参与・関わりを表す比喩として用いられている。
lexical_decisions:
- source_word: Οὐ μὴ νίψῃς … εἰς τὸν αἰῶνα
  choice: 決してお洗いにならないでください
  rationale: οὐ μήとεἰς τὸν αἰῶναが表す非常に強い拒絶を、ペトロがイエスに語る場面にふさわしい敬語を用いた自然な日本語で表した。
- source_word: μου τοὺς πόδας
  choice: 私の足
  rationale: 明示された所有関係と目的語を、そのまま簡潔に訳した。
- source_word: Ἐὰν μὴ νίψω σε
  choice: もし私があなたを洗わなければ
  rationale: 条件構文と目的語σεを明示し、直前の足洗いを受けつつも、ここでは「足」に限定されていない原文の表現を保った。
- source_word: οὐκ ἔχεις μέρος μετ’ ἐμοῦ
  choice: あなたには私と共にあずかる分がない
  rationale: μέροςの「分、取り分、参与」の比喩を残し、μετ’ ἐμοῦを「私と共に」と訳した。関係性は示しつつ、その神学的な仕組みまでは限定していない。
- source_word: ἀπεκρίθη Ἰησοῦς αὐτῷ
  choice: イエスは答えられた
  rationale: 標準的な応答表現として自然に訳し、文脈上明らかな間接目的語は日本語では省いた。
theological_decisions:
- issue: イエスと共に「分を持つ」ことの意味
  choice: 「私と共にあずかる分がない」とし、イエスとの参与・結びつきを示す幅のある表現を採用した。
  alternative: 「私と何の関わりもない」
  rationale: この発言を洗礼、聖餐、救済、または謙遜な奉仕の象徴のいずれか一つに限定せず、μέροςが持つ比喩と神学的緊張を保つため。
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた敬体を会話内に用いた。ペトロの強い拒絶は保ちつつ、目上のイエスに対する不自然に乱暴な口調は避けた。
