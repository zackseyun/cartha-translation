id: JHN.13.15
reference: John 13:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑπόδειγμα γὰρ ἔδωκα ὑμῖν ἵνα καθὼς ἐγὼ ἐποίησα ὑμῖν καὶ ὑμεῖς ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/015.yaml
  text: For I have given you an example[a], so that just as I have done to you[c][b], you also may do.
translation:
  language: ja
  text: わたしがあなたがたに模範[a]を示したのは、わたしがあなたがたにしたとおりに、あなたがたもするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「手本」または「型」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπόδειγμα
  choice: 模範
  rationale: 人が倣うべき実例・型を表す語。この文脈では、自然で格調を保ちつつ、イエスの行為を弟子たちが実行に移すべきことを明確に伝える。別訳「手本」も可能。
- source_word: γὰρ
  choice: 〜のは
  rationale: 直前の教えを説明する接続関係を、日本語では目的節を伴う「〜したのは…ためです」という構文に織り込み、自然に表した。
- source_word: ἔδωκα
  choice: 示した
  rationale: 直訳は「与えた」だが、日本語では「模範を示す」が自然な連語であり、直前に行われた行為を模範として提示した意味を保つ。アオリストの過去性は「示した」で表した。
- source_word: ἵνα
  choice: 〜するためです
  rationale: 弟子たちが同様に行うことを目的として示す接続詞の力を明確に表す。
- source_word: καθὼς
  choice: 〜したとおりに
  rationale: イエスの行為と弟子たちに求められる行為との対応を自然な日本語で明示する。
- source_word: ἐποίησα ὑμῖν
  choice: わたしがあなたがたにした
  rationale: 広義の ποιέω と与格 ὑμῖν を過度に解釈せず、「あなたがたにした」と訳して、原文の関係を保持する。文脈上、それが弟子たちのためになされた行為であることは否定しない。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: イエスに対応して弟子たちも行うという付加・対応の意味を簡潔に表す。
- source_word: ποιῆτε
  choice: する
  rationale: ἵνα に続く接続法は目的節の中で「するため」と訳し、意図・期待を自然に表した。独立した命令形にはせず、同時に文脈上の実践的要請を弱めない。
theological_decisions:
- issue: 弟子たちがイエスの行為に倣うことの範囲
  choice: イエスの行為を、弟子たちが対応する行為によって倣うべき模範として訳す。
  alternative: すべての信者に対する洗足儀礼の直接的制定と限定する、または具体的な模倣を伴わない純粋な象徴と限定する。
  rationale: 本文はイエスが弟子たちの模範となり、弟子たちも同様に行うという目的を明言する一方、その実践を特定の教派的・儀礼的理解に限定してはいない。
translation_notes:
  register: 明瞭で現代的な標準日本語。「模範を与えた」という不自然さを避けて「模範を示した」とし、説明を表す γάρ と目的を表す ἵνα を日本語の焦点構文「〜したのは…ためです」で一体的に表現した。
