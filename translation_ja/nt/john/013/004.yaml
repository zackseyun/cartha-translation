base_translation:
  language: en
  yaml_path: translation/nt/john/013/004.yaml
  text: He rises from the supper and lays aside his outer garments[a], and taking a towel[b], tied it around himself.
translation:
  language: ja
  text: イエスは食事の席から立ち上がり、上着を脱いだ。そして手ぬぐいを取り、腰に巻いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγείρεται
  choice: 立ち上がり
  rationale: 物語現在を日本語で不自然に現在形へ固定せず、一連の動作として自然に表した。起き上がる動作そのものを明確に伝える。
- source_word: ἐκ τοῦ δείπνου
  choice: 食事の席から
  rationale: δεῖπνον は夕食・晩餐を指し得るが、ここでは食事の場から立つという日本語として自然な表現を選び、現代の特定の食事時刻に限定しなかった。
- source_word: τίθησιν τὰ ἱμάτια
  choice: 上着を脱いだ
  rationale: τίθημι はここでは衣を脇に置く、すなわち脱ぐ意。ἱμάτια を全衣服とはせず、外側に着る衣として簡潔に表した。
- source_word: λαβὼν λέντιον
  choice: 手ぬぐいを取り
  rationale: λέντιον は奉仕の際に用いる亜麻布の布・タオル。日本語の聖書文体で分かりやすく、腰に巻き足を拭く用途にも合う「手ぬぐい」とした。
- source_word: διέζωσεν ἑαυτόν
  choice: 腰に巻いた
  rationale: 腰帯を締めるように自分の体へ巻き付けた動作を、現代日本語で明瞭に表した。直前の手ぬぐいが目的語であることは文脈上明らかである。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用い、簡潔で品位ある物語文とした。ギリシア語の歴史的現在は、日本語の自然な連続動作として過去形で統一した。「イエス」は当該節のギリシア語では省略されている主語だが、直前の文脈から補った。
