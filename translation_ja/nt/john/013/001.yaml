source:
  edition: SBLGNT
  text: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα εἰδὼς ὁ Ἰησοῦς ὅτι ⸀ἦλθεν αὐτοῦ ἡ ὥρα ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ εἰς τέλος ἠγάπησεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/001.yaml
  text: Before the Feast of the Passover[a], Jesus, knowing that his hour had come to depart from this world to the Father, having loved his own who were in the world[b], loved them to the end.
translation:
  language: ja
  text: さて、過越の祭りの前、イエスは、この世から父のもとへ移るご自分の時が来たことを知っておられた。世にいるご自分の者たちを愛してこられたイエスは、彼らを最後まで[a]愛された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この上なく」または「余すところなく」とも訳せる。ギリシア語の表現は、最後の時まで愛し抜いたことと、完全な仕方で愛したことの両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ δὲ τῆς ἑορτῆς τοῦ πάσχα
  choice: さて、過越の祭りの前
  rationale: πρό＋属格の時間的意味を「前」で表し、δέの穏やかな談話上の移行を「さて」で示した。「過越の祭り」はἑορτήとπάσχαの双方を自然に保持する。
- source_word: εἰδὼς
  choice: 知っておられた
  rationale: 主動作時のイエスの認識を表す分詞。日本語では敬意を保ちつつ自然な従属節とした。
- source_word: ἦλθεν αὐτοῦ ἡ ὥρα
  choice: ご自分の時が来た
  rationale: ヨハネ福音書に特徴的な「時」という表現を保ち、受難・父への帰還・栄光化を含む決定的な時を説明的に限定しなかった。
- source_word: ἵνα μεταβῇ ἐκ τοῦ κόσμου τούτου πρὸς τὸν πατέρα
  choice: この世から父のもとへ移る
  rationale: μεταβαίνωの移行の意味を「移る」とし、死だけに限定せず、地上の領域から父のもとへの移行というヨハネ的表現を保った。
- source_word: ἀγαπήσας τοὺς ἰδίους τοὺς ἐν τῷ κόσμῳ
  choice: 世にいるご自分の者たちを愛してこられたが
  rationale: τοὺς ἰδίουςを弟子だけに狭めず「ご自分の者たち」とした。アオリスト分詞は、それまでの愛を背景として主文の頂点へつなぐ日本語「愛してこられたが」で表現した。
- source_word: εἰς τέλος
  choice: 最後まで
  rationale: 時間的な終わりまでという意味を自然に表しながら、文脈上、愛の完全さをも響かせ得る表現として保持した。質的意味は脚注で明示する。
- source_word: ἠγάπησεν αὐτούς
  choice: 彼らを…愛された
  rationale: ἀγαπάωを一貫して「愛する」と訳し、単なる感情でなく、続く行為に表される愛を過度に説明せず保持した。
theological_decisions:
- issue: εἰς τέλοςが時間的完遂と質的完全さのどちらを示すか
  choice: 本文では「最後まで」
  alternative: 「この上なく」「余すところなく」
  rationale: ギリシア語句は、最終時まで愛し抜いたことと、完全な仕方で愛したことの両方を含み得る。本文で一方に限定せず、質的な可能性を脚注に示した。
- issue: τοὺς ἰδίουςの範囲
  choice: 「ご自分の者たち」
  alternative: 「弟子たち」
  rationale: 直近の場面では弟子たちが中心だが、原文はより広い関係的表現であるため、指示対象を狭めなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、荘重さは保ちつつ過度に文語的な表現を避けた。長いギリシア語一文は日本語の理解しやすさのため二文に分けた。「父」はヨハネ福音書の関係的称号として「御父」などの教派的・伝統的表記に限定しなかった。
