id: JHN.13.37
reference: John 13:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Πέτρος· Κύριε, διὰ τί οὐ δύναμαί σοι ⸀ἀκολουθῆσαι ἄρτι; τὴν ψυχήν μου ὑπὲρ σοῦ θήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/037.yaml
  text: Peter said to him[a], “Lord[b], why am I not able to follow you now? I will lay down my life for you.”
translation:
  language: ja
  text: ペトロはイエスに言った。「主よ、なぜ私は今、あなたについて行くことができないのですか。あなたのために、私は命を捨てます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語文として自然な過去形で表した。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意を伴う呼びかけと神学的な含みの双方を保ち、過度に意味を限定しない。
- source_word: διὰ τί οὐ δύναμαί
  choice: なぜ…できないのですか
  rationale: 理由を問う表現と能力・可能性の否定を、明快で自然な現代日本語にした。
- source_word: σοι ἀκολουθῆσαι
  choice: あなたについて行く
  rationale: 実際に同行する意味と弟子として従う意味の重なりを保てる表現を選んだ。
- source_word: ἄρτι
  choice: 今は
  rationale: 直前の発言との対照を自然に示しつつ、時間的な即時性を表す。
- source_word: τὴν ψυχήν μου
  choice: 私は命を
  rationale: ここでのψυχήは、死を覚悟して差し出す自分の命を指す慣用的用法であり、日本語の「命」が最も自然で正確である。
- source_word: ὑπὲρ σοῦ
  choice: あなたのためなら
  rationale: 利益・身代わり・献身の可能性を狭く確定せず、「あなたのため」という広い含みを保った。「なら」はペトロの強い決意を自然に表す。
- source_word: θήσω
  choice: 捨てます
  rationale: τίθημιとψυχήの組み合わせは「命を差し出す／捨てる」という慣用句であり、ヨハネ文書で定着した「命を捨てる」を用いた。
theological_decisions:
- issue: ψυχήの意味
  choice: 「命」と訳す
  alternative: 「魂」
  rationale: 文脈はイエスのために死ぬ覚悟についてであり、「魂」では原文にない形而上学的意味が前面に出るため。
- issue: ἀκολουθέωの含意
  choice: 「ついて行く」と訳す
  alternative: 「同行する」「従う」
  rationale: イエスが行く所への移動と、弟子として従うことの両方が響く文脈なので、二つの層を保つ表現とした。
- issue: ὑπέρの関係性
  choice: 「あなたのため」と訳す
  alternative: 「あなたに代わって」
  rationale: この句だけで厳密な身代わりの意味に限定せず、献身または利益のためという幅を残した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、ペトロの率直で強い申し出にふさわしい丁寧さと荘重さを保った。「イエス」は原文の代名詞が指す人物を日本語で明確にするため補った。脚注は不要と判断した。
