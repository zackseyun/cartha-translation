review_pass:
  verdict: revise
  source_fidelity: 概ね原文に忠実です。λέγειの歴史的現在を「言った」とすること、ἀκολουθῆσαιを「ついて行く」とすること、ψυχήをこの文脈で「命」とすることはいずれも適切です。ただし、「あなたのためなら」はὑπὲρ σοῦに原文にはない条件・強調（「あなたのためであるなら」）を加えうるため、単純に「あなたのために」とするのがより忠実です。
  naturalness: 全体として明快で自然な現代標準日本語です。「主よ」と丁寧語の問いかけの組合せも文脈にふさわしいです。「今」を「私は」の後に置くことで、ἄρτιの即時性を保ちながら読みやすくしました。
  terminology: 「主よ」「ついて行く」「命を捨てます」は、ヨハネによる福音書の文脈と日本語の聖書的用法の双方に適しています。「ペトロ」は日本語のキリスト教文献で用例のある表記であり、この一節だけで変更を要する問題はありません。
  issues:
