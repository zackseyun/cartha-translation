id: JHN.13.29
reference: John 13:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τινὲς γὰρ ἐδόκουν, ἐπεὶ τὸ γλωσσόκομον ⸀εἶχεν Ἰούδας, ὅτι λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἀγόρασον ὧν χρείαν ἔχομεν εἰς τὴν ἑορτήν, ἢ τοῖς πτωχοῖς ἵνα τι δῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/029.yaml
  text: For some thought that[a], because Judas had the money box, Jesus was telling him[b], “Buy what we need for the feast,” or that he should give something to the poor.
translation:
  language: ja
  text: ユダが金入れ[a]を持っていたので、何人かは、イエスがユダに、「祭りのために必要な物を買いなさい」と言われたか、あるいは貧しい人々に何か施すように言われたのだと思った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「金箱」または「金袋」とも訳せる。ギリシア語は、一行の資金を収めていた容器を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: τινὲς
  choice: 何人か
  rationale: その場にいた者たちのうち一部を指す不定複数として、自然で簡潔に訳した。
- source_word: ἐδόκουν
  choice: 思った
  rationale: 彼らの推測を表す未完了過去であり、日本語の物語文では「思った」が自然である。
- source_word: ἐπεὶ
  choice: ので
  rationale: ユダが金入れを持っていたことが推測の理由であることを明確に示す。
- source_word: γλωσσόκομον
  choice: 金入れ
  rationale: 一行の資金を収める容器を指す。形状を箱や袋に限定しすぎない、明瞭な訳語とした。
- source_word: εἶχεν
  choice: 持っていた
  rationale: 原語の基本的な意味を保つ。文脈上、保管・管理を任されていた含みはあるが、本文では明示しすぎない。
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: イエスがユダに……言われた
  rationale: 歴史的現在を日本語の物語に自然な過去として訳し、敬意を示す通常の聖書文体を用いた。代名詞の指示対象を明確にするため「ユダ」とした。
- source_word: Ἀγόρασον
  choice: 買いなさい
  rationale: 単純で直接的な命令として、現代日本語で自然に訳した。
- source_word: ὧν χρείαν ἔχομεν
  choice: 必要な物
  rationale: 直訳的な「私たちが必要としているもの」の意味を、簡潔で自然な日本語にした。
- source_word: εἰς τὴν ἑορτήν
  choice: 祭りのために
  rationale: 宗教的な祭りを指す。文脈上は過越の祭りだが、この節自体が名称を繰り返していないため本文には補わない。
- source_word: τοῖς πτωχοῖς
  choice: 貧しい人々に
  rationale: 実際の人々を指す形容詞の名詞的用法を、尊厳を保つ自然な表現で訳した。
- source_word: ἵνα τι δῷ
  choice: 何か施すように言われた
  rationale: 弟子たちが推測した、イエスの意図された指示として自然に表現した。「施す」は困窮者への贈与を簡潔に示す。
theological_decisions:
- issue: 祭りの特定
  choice: 本文では「祭り」とする
  alternative: 「過越の祭り」と明示する
  rationale: 周辺文脈では過越の祭りだが、原文の当該節は一般名詞 ἑορτή のみを用いるため、その表現を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語として自然な語順に整えた。「言われた」にはイエスへの通常の敬意を反映しつつ、解釈上の情報を付加していない。原文の二つの推測内容は「か、あるいは」で保った。
source_grounding:
  english_pob_role: consult_only
