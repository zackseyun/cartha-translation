id: JHN.13.6
reference: John 13:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔρχεται οὖν πρὸς Σίμωνα Πέτρον. ⸀λέγει ⸀αὐτῷ· Κύριε, σύ μου νίπτεις τοὺς πόδας;
base_translation:
  language: en
  yaml_path: translation/nt/john/013/006.yaml
  text: So he comes to Simon Peter. He says to him[a], “Lord, are you washing my feet?”
translation:
  language: ja
  text: こうしてイエスはシモン・ペテロのところに来た。ペテロはイエスに言った。「主よ[a]、あなたが私の足をお洗いになるのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「先生」。ギリシア語κύριεは、敬意を表す呼びかけとしても用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχεται
  choice: 来た
  rationale: ギリシア語は歴史的現在だが、日本語で「来る」とすると不自然になりやすいため、自然な物語叙述として過去形にした。移動の到達先は「ところに」で明示した。
- source_word: οὖν
  choice: こうして
  rationale: 直前からの物語の進行と帰結を示す接続語。硬い「それゆえ」ではなく、文脈を受ける自然な表現とした。
- source_word: πρὸς Σίμωνα Πέτρον
  choice: シモン・ペテロのところに
  rationale: πρός＋対格が示す人物への接近を、現代日本語で自然に表した。
- source_word: λέγει αὐτῷ
  choice: ペテロはイエスに言った
  rationale: 原文の代名詞が指す人物を日本語で明示し、話者と聞き手の混同を避けた。歴史的現在は自然な過去形で訳した。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけとヨハネ福音書におけるキリスト論的な響きの双方を保つ標準的な訳語。
- source_word: σύ
  choice: あなたが
  rationale: 明示された主語代名詞の強調を係助詞「が」によって表し、ペテロの驚きを保った。
- source_word: μου
  choice: 私の
  rationale: 足との所有関係を自然な日本語で表した。
- source_word: νίπτεις
  choice: 洗ってくださる
  rationale: 身体の一部を洗う動作を「洗う」で表し、目下の者が行う務めをイエスが自分にすることへのペテロの驚きを、尊敬を示す授受表現によって自然に伝えた。進行中か差し迫った行為かを過度に限定しない。
- source_word: τοὺς πόδας
  choice: 足
  rationale: 日本語では通常、複数性を明示せず「足」と言うため、自然な単数形の語で訳した。
theological_decisions:
- issue: ペテロによる κύριε という呼びかけ
  choice: 主よ
  alternative: 先生、あなたが私の足を洗うのですか。
  rationale: κύριε は一般的な敬称にもなり得るが、ここではイエスへの呼びかけとして「主よ」が自然であり、ヨハネ福音書における語の神学的な含みも失わない。日本語の「主よ」は文脈上十分に理解可能なので、別訳注は付さない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ギリシア語の歴史的現在は、日本語として自然な物語の過去形に統一した。疑問文では「あなたが」と「くださるのですか」により、ペテロの驚きと敬意を表した。
