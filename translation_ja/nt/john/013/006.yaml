revisions:
- from: こうしてイエスはシモン・ペテロのところに来た。ペテロはイエスに言った。「主よ、あなたが私の足を洗ってくださるのですか。」
  to: こうしてイエスはシモン・ペテロのところに来た。ペテロはイエスに言った。「主よ[a]、あなたが私の足をお洗いになるのですか。」
  rationale: 叙述の時制、人物関係、移動、問いの内容は維持した。「くださる」を、原文にない受益性を帯びにくい尊敬表現「お洗いになる」に改めた。また、「主よ」という本文訳を維持しながら、κύριεの語義上の幅を別訳注で明示した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T08:28:15Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は、イエスがシモン・ペテロのもとに来て、ペテロがイエスに問いかけるという場面の展開を正確に伝えている。歴史的現在を日本語の過去形にすることも自然である。ただし「洗ってくださる」は原文にない受益の含みを加えうるため、尊敬表現のみで問いを表すほうがより直接的である。κύριεには「主」と一般的な敬称の両義的な幅があるため、本文の「主よ」を保ちつつ別訳注でその幅を示す。
  naturalness: 「こうしてイエスはシモン・ペテロのところに来た。ペテロはイエスに言った」は明瞭で自然な現代標準日本語である。「主よ、あなたが私の足をお洗いになるのですか。」は、ペテロの驚きとイエスへの敬意を不自然な授受表現なしに表す。
  terminology: 「主よ」はκύριεの有力な訳語であり、ヨハネ福音書内での含意を不当に限定しない。ただしこの箇所のκύριεは敬意ある「先生」にもなりうるため、注で代替可能性を示す。「足」は日本語として自然で、ギリシア語の複数形を損なわない。
  issues:
  - severity: low
    issue: 「洗ってくださる」が受益の意味合いを伴いうる。
    rationale: νίπτειςは単に「洗う」であり、くださるは日本語では話し手・ペテロへの恩恵として行うことを含意しうる。この場面の驚きは主として主人が僕の務めを行う逆転にあるため、「お洗いになる」で敬意のみを表すほうが原文に近い。
  - severity: low
    issue: κύριεの敬称としての幅を示す注がない。
    rationale: 「主よ」を本文に採ることは適切だが、κύριεは文脈により敬意ある呼びかけ（「先生」等）にもなりうる。英語監査訳の注とも整合するよう、短い別訳注を付すのが望ましい。
  revised_text: こうしてイエスはシモン・ペテロのところに来た。ペテロはイエスに言った。「主よ[a]、あなたが私の足をお洗いになるのですか。」
  revised_footnotes:
  - marker: a
    text: または「先生」。ギリシア語κύριεは、敬意を表す呼びかけとしても用いられる。
    reason: alternative_reading
  revision_rationale: 叙述の時制、人物関係、移動、問いの内容は維持した。「くださる」を、原文にない受益性を帯びにくい尊敬表現「お洗いになる」に改めた。また、「主よ」という本文訳を維持しながら、κύριεの語義上の幅を別訳注で明示した。
