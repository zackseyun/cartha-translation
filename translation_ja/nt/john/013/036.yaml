  text: Λέγει αὐτῷ Σίμων Πέτρος· Κύριε, ποῦ ὑπάγεις; ⸀ἀπεκρίθη Ἰησοῦς· Ὅπου ὑπάγω οὐ δύνασαί μοι νῦν ἀκολουθῆσαι, ⸂ἀκολουθήσεις δὲ ὕστερον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/036.yaml
  text: Simon Peter says to him[a], “Lord, where are you going?” Jesus answered, “Where I am going, you are not able to follow me now[b], but you will follow later.”
translation:
  language: ja
  text: シモン・ペトロがイエスに言った。「主よ、どこへ行かれるのですか。」イエスは答えた。「私が行く所へは、あなたは今、私について来ることができない[a]。しかし、後にはついて来る[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたは今、私について来られない」。ギリシア語では、能力や可能性を表す動詞が明示されている。
    reason: lexical_alternative
  - marker: b
    text: 「後にはついて来る」は、後にペトロが苦しみや死においてイエスに従うことを暗示している可能性があるが、この表現自体はその仕方を特定していない。
    reason: cross_reference
lexical_decisions:
- source_word: Λέγει αὐτῷ Σίμων Πέτρος
  choice: シモン・ペトロがイエスに言った
  rationale: ヨハネの物語に見られる歴史的現在を、自然な現代日本語の物語時制で表した。代名詞の指示対象は文脈上イエスなので明示した。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけと、κύριοςという称号の神学的含意の双方を保つ。
- source_word: ποῦ ὑπάγεις / Ὅπου ὑπάγω
  choice: どこへ行かれるのですか／私が行く所
  rationale: ὑπάγωの基本的な移動の意味を自然に表し、質問と答えの語の対応も保った。ペトロの問いでは敬意を示す表現を用いた。
- source_word: οὐ δύνασαί μοι νῦν ἀκολουθῆσαι
  choice: あなたは今、私について来ることができない
  rationale: δύναμαιが明示する能力・可能性の意味を省かず、ἀκολουθέωの「ついて行く／従う」という含みを過度に限定しない表現とした。
- source_word: ἀκολουθήσεις δὲ ὕστερον
  choice: しかし、後にはついて来ることになる
  rationale: δέの対照とὕστερονの時間差を示し、未来形を日本語で自然に表した。将来の殉教、回復後の弟子としての歩み、死と栄光への参与のいずれかに限定していない。
theological_decisions:
- issue: ペトロが後にイエスについて行くことの意味
  choice: 本文では、その具体的な成就の仕方を特定しない
  alternative: ペトロの殉教、復活後の弟子としての歩み、または終末的にイエスに従うことへの明示的言及とする
  rationale: ギリシア語本文は「今はできないが、後にはついて来る」とだけ述べるため、物語上および神学上の開かれた意味を保った。
translation_notes:
  register: 明快で現代的な標準語を用いながら、イエスへの呼びかけと応答には品位ある敬語を保った。物語の歴史的現在は、日本語として不自然な時制の揺れを避けるため過去形で表した。脚注記号は内容に対応する箇所へ配置した。
