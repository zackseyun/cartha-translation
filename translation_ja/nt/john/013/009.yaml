  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Σίμων Πέτρος· Κύριε, μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/013/009.yaml
  text: Simon Peter says to him[a], “Lord, not only my feet, but also my hands and my head.”
translation:
  language: ja
  text: シモン・ペテロはイエスに言った。「主よ[a]、足だけでなく、手も頭も。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「先生」。ギリシア語は「キュリオス」。
    reason: κύριος は敬称として「先生」とも訳し得るため。
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は物語を生き生きと語る歴史的現在だが、現代日本語の物語として自然な過去形で表した。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 原文は「彼に」だが、日本語では指示対象を明示したほうが自然であり、直前の文脈からイエスを指すことは明らかである。
- source_word: Σίμων Πέτρος
  choice: シモン・ペテロ
  rationale: 新約聖書の人名として定着した標準的な音写を用いた。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけであるとともに、ヨハネ福音書における神学的な響きを保つため「主」とした。呼格は自然な日本語の「よ」で示した。
- source_word: μὴ τοὺς πόδας μου μόνον ἀλλὰ καὶ τὰς χεῖρας καὶ τὴν κεφαλήν
  choice: 足だけでなく、手も頭も洗ってください
  rationale: 「足だけでなく、手と頭も」という対照的追加を保った。原文では動詞が省略されているが、日本語で発言を明瞭かつ自然にするため、直前の文脈から理解される「洗ってください」を補った。所有の「私の」は日本語では身体部位について通常省略される。
theological_decisions:
- issue: イエスへの呼びかけ κύριος の訳
  choice: 主
  alternative: 先生
  rationale: この語は文脈上、敬称としても理解できるが、「主」は新約聖書での通常の力とヨハネ福音書における含意を保つ。別訳の可能性は脚注で示した。
translation_notes:
  register: 明快な現代標準日本語を用い、ペテロの勢いある応答が自然に伝わるようにした。「洗ってください」は先行文脈に基づく省略補充であり、新たな意味を加えるものではない。
