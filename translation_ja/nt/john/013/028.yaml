  text: But none of those reclining at the table knew why he said this to him[a].
translation:
  language: ja
  text: しかし、食卓に着いていた者たちのだれも、イエスがユダにそう言ったのはなぜ[a]かを知らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「何のためにイエスがユダにそう言ったのか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: そう
  rationale: 直前のイエスの言葉を指す指示代名詞。日本語では「そう言われた」とすることで指示性を自然に保てる。
- source_word: δὲ
  choice: しかし
  rationale: 前節を受け、弟子たちには発言の意図が分からなかったという対照を示す。
- source_word: οὐδεὶς
  choice: 一人も…なかった
  rationale: 全否定を自然な現代日本語で明確に表す。
- source_word: ἔγνω
  choice: 知る
  rationale: γινώσκωの基本的な意味を保つ。「理解する」も可能だが、解釈を狭めない表現を採用した。
- source_word: τῶν ἀνακειμένων
  choice: 食卓に着いていた者たちのうち
  rationale: 当時の食事姿勢は横になって食卓につくことだが、日本語の「横になっていた」では休息の印象が強いため、食事の場面を自然かつ明確に示した。
- source_word: πρὸς τί
  choice: なぜ
  rationale: 目的・理由を問う表現を、自然な現代日本語で訳した。目的の含意は脚注で示す。
- source_word: εἶπεν αὐτῷ
  choice: イエスがユダにそう言われた
  rationale: ギリシア語の主語と間接目的語は代名詞のままだが、日本語で「彼が彼に」とすると不明瞭になるため、文脈上の指示対象を固有名で明示した。イエスへの敬意を自然に示すため尊敬語を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。食事姿勢を字義的に「横たわる」とせず、日本語で自然な「食卓に着く」とした。代名詞の曖昧さは日本語では過度になるため、直前の文脈に基づき「イエス」「ユダ」と明示した。
