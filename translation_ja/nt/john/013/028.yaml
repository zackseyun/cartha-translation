review_pass:
  verdict: revise
  source_fidelity: 本文は全体として原文の意味を正確に伝えている。しかし、脚注はπρὸς τί（「なぜ／何のために」）に関するものなので、文末ではなく該当語「なぜ」に直接付すのが適切である。また、原文の通常の叙述動詞εἶπενに対して、敬語の「言われた」は原文にない敬意のニュアンスを加えるため、中立的な「言った」がより忠実である。
  naturalness: 「食卓に着いていた者たちのうち、…知る者は一人もいなかった」も自然だが、「食卓に着いていた者たちのだれも、…を知らなかった」とすると、現代日本語としてより流麗である。
  terminology: 「食卓に着いていた者たち」は、食事のために横たわっていたというἀνακειμένωνの場面上の意味を、不要に異文化的な表現にせず適切に表している。「なぜ」はπρὸς τίの自然な訳であり、目的の含意は脚注で補える。
  issues:
  - severity: low
    issue: 脚注アンカーが文末に置かれている。
    rationale: 脚注は「なぜ」の別訳（「何のために」）を示すため、該当する疑問語に直接アンカーを置くと参照関係が明確になる。
  - severity: low
    issue: 「言われた」に敬語が用いられている。
    rationale: εἶπενは中立的な叙述であり、敬語は日本語としては可能でも、原文にない対人的敬意を付加する。中立的な「言った」が最も直接的である。
  revised_text: しかし、食卓に着いていた者たちのだれも、イエスがユダにそう言ったのはなぜ[a]かを知らなかった。
