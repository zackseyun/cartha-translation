  rationale: 原文の構文は「食卓に着いていた者たちのだれも、このこと、すなわち彼が彼に何のために言ったのかを知らなかった」という意味である。文脈上明白な代名詞を「イエス」「ユダ」と明示する方針は維持した。「言った」に改めて原文の中立的な叙述を保ち、脚注アンカーを「なぜ」に移してπρὸς τίとの対応を明確にした。
