reference: John 14:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐὰν πορευθῶ ⸀καὶ ἑτοιμάσω ⸂τόπον ὑμῖν⸃, πάλιν ἔρχομαι καὶ παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν, ἵνα ὅπου εἰμὶ ἐγὼ καὶ ὑμεῖς ἦτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/003.yaml
  text: And if I go and prepare a place for you[a], I am coming again and will take you to myself, so that where I am[b], you also may be.
translation:
  language: ja
  text: そして、もし私が行ってあなたがたのために場所を用意したなら、私は再び来て[a][b]、あなたがたを私のもとに迎える。私がいる所に、あなたがたもいるようにするためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は再び来る」。ギリシア語では現在形の動詞が用いられているが、文脈上は将来の意味を表す。
    reason: lexical_alternative
  - marker: b
    text: 「再び来る」が、特にイエスの終末における再臨、復活後の顕現、聖霊の到来のどれを指すのか、または複数の成就を重ねた約束なのかについては、解釈が分かれる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐὰν πορευθῶ
  choice: 私が行って……したなら
  rationale: ἐάν＋アオリスト接続法が示す将来の条件を「したなら」で表し、πορεύομαιは文脈に解釈を加えすぎない「行く」とした。
- source_word: ἑτοιμάσω τόπον ὑμῖν
  choice: あなたがたのために場所を用意した
  rationale: ἑτοιμάζωを「用意する」、τόποςを「場所」とし、その場所の性質について本文以上の説明を加えなかった。
- source_word: πάλιν ἔρχομαι
  choice: 私は再び来て
  rationale: πάλινを「再び」、ἔρχομαιを「来る」とした。日本語では非過去形やテ形が文脈により将来を自然に表せるため、約束の将来性を保ちつつ、ギリシア語の現在形を不必要に断定的な未来表現へ変えなかった。
- source_word: παραλήμψομαι ὑμᾶς πρὸς ἐμαυτόν
  choice: あなたがたを私のもとに迎える
  rationale: παραλαμβάνωの「引き取る・迎え入れる」という意味と、πρὸς ἐμαυτόνの関係的な方向性を、現代日本語で自然な「私のもとに迎える」で表した。
- source_word: ἵνα
  choice: ためである
  rationale: 目的を示すἵναを、日本語の目的節として明確な「ため」で表した。
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: 私がいる所に
  rationale: 場所を示すὅπουと現在形εἰμίを直接的に表した。明示されたἐγώは「私が」により自然に保持した。
- source_word: καὶ ὑμεῖς ἦτε
  choice: あなたがたもいるようになる
  rationale: καίを「も」で保持し、ἵναに続く接続法ἦτεを単なる未来断定ではなく、目的の実現を表す「いるようになる」とした。
theological_decisions:
- issue: πάλιν ἔρχομαιが指すイエスの到来の性質
  choice: 将来に向けた「再び来る」という約束として訳し、その時期や様態は特定しない。
  alternative: 復活後の顕現、聖霊の到来、終末における再臨、または複数の成就を重ねた約束と解する。
  rationale: 本文はイエスが再び来て弟子たちを自分のもとに迎えることを約束するが、それがどの出来事だけを指すかをこの一節自体は明示しない。訳文ではこの解釈上の幅を保った。
- issue: ἵνα節の目的と実現性
  choice: 「あなたがたもいるようになるため」として、イエスと弟子たちが同じ所にいるという目的を表す。
  alternative: 「あなたがたもいることができるため」と可能性を強調する、または「あなたがたもいることになる」と結果・未来を強調する。
  rationale: 接続法を伴うἵναの目的性を保ち、可能性だけ、あるいは単純な未来だけに狭めなかった。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの告別の言葉にふさわしい落ち着いた格調を保った。「場所」「私のもと」「いる所」など、原文の簡潔で関係的な表現を過度に説明的にしなかった。
