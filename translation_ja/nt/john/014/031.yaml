id: JHN.14.31
reference: John 14:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλ’ ἵνα γνῷ ὁ κόσμος ὅτι ἀγαπῶ τὸν πατέρα, καὶ καθὼς ⸀ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ. Ἐγείρεσθε, ἄγωμεν ἐντεῦθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/031.yaml
  text: But so that the world may know that I love the Father[a], I do just as the Father has commanded me. Rise, let us go from here.
translation:
  language: ja
  text: しかし、わたしが父を愛しており、父がわたしに命じたとおりに、わたしが行うことを世が知るためである。立ちなさい。ここから行こう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: しかし
  rationale: 直前の発言との逆接を明確にし、自然な現代日本語とした。
- source_word: ἵνα γνῷ
  choice: 知るためである
  rationale: ἵνα＋接続法の目的の意味を保持した。
- source_word: ὁ κόσμος
  choice: 世
  rationale: ヨハネ文書に特徴的なκόσμοςの表現と、人間世界を指す神学的な響きを保つ。
- source_word: ἀγαπῶ τὸν πατέρα
  choice: わたしが父を愛しており
  rationale: 現在形の継続的な関係を自然に表し、原文にない所有代名詞を加えなかった。
- source_word: καθὼς ἐνετείλατο μοι ὁ πατὴρ οὕτως ποιῶ
  choice: 父がわたしに命じられたとおりに行っている
  rationale: καθώςとοὕτωςの対応関係、およびἐντέλλομαιの強い『命じる』という意味を自然な日本語で表した。父を主語とするため、敬意を示す主語尊敬語を用いた。
- source_word: Ἐγείρεσθε
  choice: 立ちなさい
  rationale: 複数の弟子への命令を、簡潔で品位ある現代日本語にした。
- source_word: ἄγωμεν ἐντεῦθεν
  choice: ここから行こう
  rationale: 一人称複数の勧奨と、現在地からの出発を直接的に表した。
theological_decisions:
- issue: ヨハネのキリスト論におけるπατήρという関係的称号
  choice: 父
  alternative: わたしの父
  rationale: ギリシア語に明示されていない所有表現を補わず、父と子の関係を原文どおりに示した。
- issue: 父と子の関係を述べるἐντέλλομαιの語勢
  choice: 命じられた
  alternative: 指示された
  rationale: 動詞が表す命令・委託の強さを教理上の配慮から弱めず、イエスの父への従順という本文の緊張を保った。
- issue: ἵνα節とκαθώς…οὕτως節の統語的関係
  choice: 愛と従順の両方を世が知る内容として本文に組み込む
  alternative: 『世が、わたしが父を愛していることを知るためである。父が命じたとおり、わたしは行う』と区切る
  rationale: 句読法には解釈上の幅がある。本文はκαίを自然に連結語として読み、愛が従順な行為に現れる構造を示しつつ、別の区切り方を脚注に残した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。イエスの一人称は「わたし」とし、弟子たちへの命令は硬すぎない「立ちなさい」、勧奨は自然な「行こう」とした。
