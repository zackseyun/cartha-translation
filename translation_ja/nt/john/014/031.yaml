  timestamp: '2026-07-17T08:28:43Z'
review_pass:
  verdict: revise
  source_fidelity: 本文はἵνα γνῷ（「知るため」）の目的、κόσμος（「世」）、πατήρ（「父」）、ἐντέλλομαι（「命じる」）、および最後の複数命令・勧奨をおおむね正確に反映している。ただし、ποιῶは現在形であり、「行っている」より「行う」のほうが、文脈に不必要な進行相を加えず適切である。
  naturalness: 「父がわたしに命じられた」は主語尊敬の意図を理解できるが、現代標準語では受け身にも見え得る。「父がわたしに命じたとおりに、わたしは行う」とするほうが明瞭で自然である。
  terminology: 「世」「父」「愛する」「命じる」はいずれもヨハネ福音書の用語として適切である。「父」に所有表現を補わない点も原文に忠実である。
  issues:
  - severity: medium
    issue: 「父がわたしに命じられたとおりに行っている」
    rationale: 「命じられた」は主語尊敬としても読める一方、形の上では受け身との曖昧さがあり、明瞭な現代標準語としては避けるのが安全である。また「行っている」はποιῶに進行中の含みを加え得るため、「行う」がより中立的である。
  - severity: low
    issue: 脚注の別訳
    rationale: 原文のκαί以下を独立文として区切る可能性はあるが、脚注の代替文も本文と同じ内容を別の統語配置で示すのみであり、この短い節では読者に必要な意味上の差を十分に示さない。本文で目的節内に両内容を置く訳を採るなら、脚注は不要である。
  revised_text: しかし、わたしが父を愛しており、父がわたしに命じたとおりに、わたしが行うことを世が知るためである。立ちなさい。ここから行こう。
  revised_footnotes: []
