revisions:
- from: しかし、わたしが父を愛しており、父がわたしに命じられたとおりに行っていることを、世が知るためである。[a] 立ちなさい。ここから行こう。
  to: しかし、わたしが父を愛しており、父がわたしに命じたとおりに、わたしが行うことを世が知るためである。立ちなさい。ここから行こう。
  rationale: 「命じられた」を能動形の「命じた」に改め、尊敬語と受け身の形式上の曖昧さを除いた。「行っている」を「行う」としてποιῶの現在形を不必要に進行形化せず、καθὼς…οὕτωςの対応を「父が…命じたとおりに、わたしが行う」と明示した。本文が採る統語理解を十分に表しているため、実質的な意味差を示さない脚注は削除した。
