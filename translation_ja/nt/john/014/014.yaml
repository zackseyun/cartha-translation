  text: ἐάν τι αἰτήσητέ ⸀με ἐν τῷ ὀνόματί μου ⸀ἐγὼ ποιήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/014.yaml
  text: If you ask me anything in my name[a], I will do it.
translation:
  language: ja
  text: あなたがたが、わたしの名によって何かをわたしに[a]求めるなら、わたしがそれを行います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「あなたがたが、わたしの名によって何かを求めるなら、わたしがそれを行います」とあり、「わたしに」がありません。
    reason: textual_variant
lexical_decisions:
- source_word: ἐάν
  choice: なら
  rationale: 接続法を伴う条件節を導く語であり、文脈に合う自然な日本語の条件表現とした。
- source_word: τι
  choice: 何かを
  rationale: 不定代名詞の開かれた範囲を自然に表す。日本語では肯定的な条件節の中で「何かを」が適切である。
- source_word: αἰτήσητέ
  choice: 求める
  rationale: 祈りや願いとして請い求める意味を保ちつつ、現代日本語として簡潔で品位のある表現とした。二人称複数は「あなたがた」で明示した。
- source_word: με
  choice: わたしに
  rationale: SBLGNT本文にある一人称単数代名詞を明示し、求めの相手がイエスであるという採用本文の読みをそのまま訳した。
- source_word: ἐν τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: イエスの名、権威、人格との関係を示すヨハネ文書の表現を、解釈的に広げすぎず自然な日本語で表した。
- source_word: ἐγὼ
  choice: わたしが
  rationale: ギリシア語で明示された主語を「が」で示し、控えめな強調を保った。
- source_word: ποιήσω
  choice: それを行います
  rationale: 未来の約束を丁寧体で表し、「それを」によって先行する求めの内容を受けた。
theological_decisions:
- issue: ヨハネ14:14のμε（「わたしに」）の有無と、願いがイエスに直接向けられる含意
  choice: 本文では「わたしに求める」と訳す
  alternative: 「あなたがたが、わたしの名によって何かを求めるなら、わたしがそれを行います」
  rationale: 指定されたSBLGNT本文にはμεがあるため、本文ではこれを訳出した。一方、この語を欠く写本もあり、願いの直接の相手に関わる神学的含意があるので、異読を脚注に明示して緊張を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語の丁寧体を用いた。「あなたがた」で複数形を示し、「わたしの名によって」は伝統的な響きを保ちながらも一般読者に理解しやすい表現とした。脚注記号[a]は異読の対象である「わたしに求めるなら」の直後に置いた。
