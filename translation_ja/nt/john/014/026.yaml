id: JHN.14.26
reference: John 14:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ παράκλητος, τὸ πνεῦμα τὸ ἅγιον ὃ πέμψει ὁ πατὴρ ἐν τῷ ὀνόματί μου, ἐκεῖνος ὑμᾶς διδάξει πάντα καὶ ὑπομνήσει ὑμᾶς πάντα ἃ εἶπον ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/026.yaml
  text: But the Advocate[a], the Holy Spirit, whom the Father will send in my name, he will teach you all things and remind you of all that I said to you.
translation:
  language: ja
  text: しかし、助け主[a]、すなわち聖霊を、父がわたしの名によって遣わされる。その方が、あなたがたにすべてを教え、わたしがあなたがたに言ったすべてのことを思い起こさせる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「弁護者」「慰め主」「援助者」。ギリシア語パラクレートスは、そばに呼ばれて助け、執り成し、励ます者を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: παράκλητος
  choice: 助け主
  rationale: 法的な弁護・代言だけでなく、支援、励まし、慰めを含み得る語である。日本語の聖書語彙として定着し、人格的かつ能動的な役割を広く保てる「助け主」を本文に置き、主要な別訳を脚注に示した。
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: 聖霊
  rationale: 現代日本語で定着した簡潔な称号であり、πνεῦμα と ἅγιον を正確に表す。
- source_word: ὃ πέμψει ὁ πατήρ
  choice: 父が……遣わす
  rationale: 関係節の内容を自然な日本語の連体修飾として保ち、派遣する主体が父であることを明確にした。
- source_word: ἐν τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: 代理、権威、代表という含意を一つに限定せず保持できる、自然で定着した表現である。
- source_word: ἐκεῖνος
  choice: 聖霊が
  rationale: ギリシア語の強意的な指示代名詞は παράκλητος を受け、人格的な行為主体を際立たせる。日本語では「その方は」と重ねるより、「聖霊が」を後続述語の主語としてまとめる方が自然で、指示対象も明瞭である。
- source_word: διδάξει ὑμᾶς πάντα
  choice: あなたがたにすべてを教え
  rationale: διδάσκω の通常の意味と πάντα の広がりを保ちつつ、現代日本語として自然な語順にした。
- source_word: ὑπομνήσει ὑμᾶς
  choice: 思い起こさせてくださいます
  rationale: ὑπομιμνῄσκω の使役的意味を明示する。「くださいます」は聖霊の働きへの敬意を表す自然な日本語で、原文にない新たな内容を加えるものではない。
- source_word: πάντα ἃ εἶπον ὑμῖν
  choice: わたしがあなたがたに話したことをことごとく
  rationale: πάντα と関係節の範囲を保ち、「ことごとく」によって既述の πάντα との重複を不自然にせず全体性を表した。
theological_decisions:
- issue: 聖霊の人格的な表現
  choice: 聖霊を教え、思い起こさせる人格的な行為主体として訳す
  alternative: πνεῦμα の文法上の中性に引かれ、非人格的な力のように訳す
  rationale: 原文は中性名詞 πνεῦμα と、男性名詞 παράκλητος を受ける強意的な ἐκεῖνος を組み合わせている。さらに「教える」「思い起こさせる」という能動的行為を帰しているため、人格的主体として表すのが文脈と統語に即している。
- issue: παράκλητος の訳語
  choice: 助け主
  alternative: 弁護者、慰め主、援助者
  rationale: この語は法的・代表的側面と支援・励ましの側面を併せ持ち得る。「助け主」は日本語でその役割を比較的広く保つが、単独では全意味域を尽くさないため、脚注で別訳を示す。
- issue: ἐν τῷ ὀνόματί μου の意味範囲
  choice: わたしの名によって
  alternative: わたしに代わって／わたしの権威によって
  rationale: 代理と権威のどちらか一方に限定せず、原文の慣用句が持つ神学的な幅を保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの告別説教にふさわしい品位を保った。「あなたがた」で複数形を明示し、文末は敬体として聖霊の働きへの敬意を自然に表した。
