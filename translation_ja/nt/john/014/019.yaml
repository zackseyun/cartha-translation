id: JHN.14.19
reference: John 14:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔτι μικρὸν καὶ ὁ κόσμος με οὐκέτι θεωρεῖ, ὑμεῖς δὲ θεωρεῖτέ με, ὅτι ἐγὼ ζῶ καὶ ὑμεῖς ⸀ζήσετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/019.yaml
  text: A little while longer[a], and the world will no longer see me, but you will see me. Because I live[b], you also will live.
translation:
  language: ja
  text: あとしばらくすると、世はもう私を見なくなります。しかし、あなたがたは私を見ます。[a] 私が生きているので、あなたがたも生きるのです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見る」と訳したギリシア語は、じっと見ることや、よく認めることを含む場合があります。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたも生きる」は、弟子たちがイエスの復活の命にあずかること、イエスと結ばれて霊的に生きること、またはその両方を指す可能性があります。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτι μικρὸν
  choice: あとしばらくすると
  rationale: 残された時間が短いことと、その後に起こる変化を、自然な現代日本語で表す。
- source_word: ὁ κόσμος
  choice: 世
  rationale: ヨハネ文書で神やイエスに背く人間世界を指し得る語だが、本文では解釈を限定せず、伝統的で簡潔な「世」とする。
- source_word: θεωρεῖ / θεωρεῖτέ
  choice: 見なくなります／見ます
  rationale: θεωρέωには注視・認知の含みもあり得るが、「見る」が両方の用例に自然で、身体的な目撃か霊的な認識かを限定しない。「見なくなります」は直前の時間表現とοὐκέτιが示す間近な変化を明示する。
- source_word: οὐκέτι
  choice: もう…なくなります
  rationale: 間もなく、それまでの状態が終わることを自然な日本語で示す。
- source_word: δὲ
  choice: しかし
  rationale: 世と弟子たちとの対照を明確にする。
- source_word: ὅτι
  choice: ので
  rationale: イエスが生きていることを、弟子たちも生きることの根拠として示す因果関係を自然に表す。
- source_word: ἐγὼ ζῶ
  choice: 私が生きている
  rationale: 現在形を保ち、イエスの生きている現実を説明的に言い換えない。
- source_word: καὶ ὑμεῖς ζήσετε
  choice: あなたがたも生きるのです
  rationale: καίを「も」で表し、イエスの命と弟子たちの命との結び付きを示す。日本語の非過去形と文脈により未来を自然に表しつつ、どのような意味で生きるのかは限定しない。
theological_decisions:
- issue: 弟子たちがイエスを「見る」ことの意味
  choice: 単に「見ます」とし、復活後の目撃、信仰による霊的認識、またはその両方のどれかに限定しない。
  alternative: 「目にする」「認める」などとして、身体的または霊的な意味を強く打ち出す。
  rationale: 本文は「見る」ことの様態を明示せず、ヨハネ的な重層性を持ち得るため、その緊張を保つ。
- issue: 「あなたがたも生きる」の範囲
  choice: 広く「あなたがたも生きるのです」と訳し、復活の命、キリストとの結び付きによる霊的な命、または両方を含み得るようにする。
  alternative: 「復活して生きる」「霊的に生きる」「永遠の命を持つ」と限定する。
  rationale: ζήσετεは未来の命を示すが、その範囲を一つの教理的説明に限定していないため、原文の豊かさを保つ。
translation_notes:
  register: 明快で現代的な敬体を用いながら、イエスの告別説教にふさわしい簡潔さと品位を保った。「世」は聖書語として定着した簡潔な表現を採用し、本文中では説明を加えなかった。
