id: JHN.14.28
reference: John 14:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἠκούσατε ὅτι ἐγὼ εἶπον ὑμῖν· Ὑπάγω καὶ ἔρχομαι πρὸς ὑμᾶς. εἰ ἠγαπᾶτέ με ἐχάρητε ἄν, ⸀ὅτι πορεύομαι πρὸς τὸν πατέρα, ὅτι ὁ ⸀πατὴρ μείζων μού ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/028.yaml
  text: You heard that I said to you[a], ‘I am going away, and I am coming to you.’ If you loved me, you would have rejoiced that I am going to the Father[b], because the Father is greater than I.
translation:
  language: ja
  text: あなたがたは、わたしがこう言ったのを聞きました。「わたしは去って行き、あなたがたのところに来る。」もしあなたがたがわたしを愛していたなら、わたしが父のもとへ行くことを喜んだはずです。[a] 父はわたしより偉大だからです。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「喜ぶはずです」とも訳せます。ギリシア語の形はより一般的に訳すこともできますが、文脈上の事実に反する条件には「喜んだはずです」がよく合います。
    reason: lexical_alternative
  - marker: b
    text: 「父はわたしより偉大」は原文どおりに訳し、「役割において」「身分において」などの解釈上の限定を加えていません。
    reason: alternative_reading
lexical_decisions:
- source_word: ἠκούσατε
  choice: 聞きました
  rationale: アオリスト直説法を、すでになされた発言を聞いたという完了した出来事として、自然な現代日本語の過去形で表した。
- source_word: Ὑπάγω
  choice: 去って行き
  rationale: 弟子たちのもとを離れる動きを保ちつつ、文脈上の近い将来を日本語の非過去形で自然に表した。
- source_word: ἔρχομαι πρὸς ὑμᾶς
  choice: あなたがたのところに来る
  rationale: 現在形の生き生きとした将来的用法を保ち、「戻る」と意味を限定せず、方向を示す πρὸς を「ところに」で表した。
- source_word: εἰ ἠγαπᾶτέ με
  choice: もしあなたがたがわたしを愛していたなら
  rationale: 未完了過去による事実に反する条件を、日本語の反実仮想として明確に表した。
- source_word: ἐχάρητε ἄν
  choice: 喜んだはずです
  rationale: アオリスト直説法と ἄν による反実仮想の帰結を自然に表す。「喜ぶはずです」と一般的・現在的に訳す余地は脚注に残した。
- source_word: πορεύομαι πρὸς τὸν πατέρα
  choice: 父のもとへ行く
  rationale: 移動と目的地を明確にし、πατήρ を明示的な所有表現に変えず、称号として「父」とした。
- source_word: μείζων μού
  choice: わたしより偉大
  rationale: 比較表現をそのまま保ち、「立場において」などの解釈的限定を加えなかった。
theological_decisions:
- issue: 「父はわたしより偉大」の意味と父・子の関係
  choice: 本文では「父はわたしより偉大」と限定を加えずに訳す。
  alternative: 「父は立場においてわたしより上である」「受肉した状態のわたしより父は偉大である」
  rationale: 原文は比較を端的に述べており、その意味を役割・身分・受肉状態のいずれかに限定していない。翻訳本文で神学的緊張を解消せず、原文の曖昧さを保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある「です・ます」調。イエスの一人称は「わたし」、複数の弟子への二人称は「あな​​たがた」とし、教派固有の術語を避けた。
