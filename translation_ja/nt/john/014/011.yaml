source:
  edition: SBLGNT
  text: πιστεύετέ μοι ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί· εἰ δὲ μή, διὰ τὰ ἔργα αὐτὰ ⸀πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/011.yaml
  text: Believe me that I am in the Father and the Father is in me; but if not[a], believe because of the works themselves.
translation:
  language: ja
  text: わたしを信じなさい。わたしが父のうちにおり、父がわたしのうちにおられるということを。そうでなければ[a]、そのわざそのものを根拠に信じなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「しかし、もしそうでないなら」。前の「信じなさい」という要請を受け入れない場合を示す。後の「信じなさい」には、ギリシア語で明示された目的語がない。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύετέ μοι
  choice: わたしの言葉を信じなさい
  rationale: πιστεύω＋与格 μοι は「わたしを信じる／わたしの言うことを信じる」の意。日本語の「わたしを信じなさい」では人格全般への信頼とも取れるため、この文脈で後続の内容節を自然につなぐ「わたしの言葉を信じなさい」とした。
- source_word: ὅτι
  choice: …ことを
  rationale: 信じる内容を導く接続詞であり、理由を表す「なぜなら」ではなく、内容節として訳した。
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: 父のうちに…わたしのうちに
  rationale: ヨハネ特有の相互内在の表現を保ち、「一つである」などの解釈的な言い換えを避けた。
- source_word: εἰ δὲ μή
  choice: そうできないなら
  rationale: 直前の訴えを受け入れられない場合の別の根拠を示す条件句として、現代日本語で自然に表現した。何を「できない」のかは脚注で明示した。
- source_word: διὰ τὰ ἔργα αὐτὰ
  choice: そのわざそのものを根拠に
  rationale: διά＋対格の理由・根拠を「根拠に」で表し、αὐτάの強意を「そのもの」で保持した。ἔργαはヨハネにおいてイエスの証しとなる行為を広く指すため「わざ」とした。
- source_word: πιστεύετε
  choice: 信じなさい
  rationale: 目的語のない命令形を、日本語でも目的語を補わずに訳し、何を信じるかを限定しすぎないようにした。
theological_decisions:
- issue: 御子と父の相互内在
  choice: 「わたしが父のうちにおり、父がわたしのうちにおられる」と原文の関係表現を保持する。
  alternative: 「わたしと父は一つである」と教理的に言い換える。
  rationale: 父とイエスの深い一致を弱めず、同時に、この節の実際の「うちに」という表現を別の定式へ置き換えないため。
- issue: わざが信仰の根拠となること
  choice: 二つ目の πιστεύετε には目的語を補わず、「そのわざそのものを根拠に信じなさい」とする。
  alternative: 「わざのゆえにわたしを信じなさい」または「わたしが父のうちにいることを信じなさい」と目的語を補う。
  rationale: 原文には明示的な目的語がなく、わざが十分な信仰の根拠であるという簡潔な表現と解釈上の余地を保つため。
translation_notes:
  register: 明快な現代標準語を用いつつ、父には敬語「おられる」を用いて尊厳を保った。「業」より読みやすく、ヨハネ文書での広い意味も保てる「わざ」を採用した。
