id: JHN.14.23
reference: John 14:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἐάν τις ἀγαπᾷ με τὸν λόγον μου τηρήσει, καὶ ὁ πατήρ μου ἀγαπήσει αὐτόν, καὶ πρὸς αὐτὸν ἐλευσόμεθα καὶ μονὴν παρ’ αὐτῷ ⸀ποιησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/023.yaml
  text: Jesus answered and said to him[a], “If anyone loves me, he will keep my word, and my Father will love him[b], and we will come to him and make our dwelling with him.”
translation:
  language: ja
  text: イエスは彼に答えて言われた。「だれでもわたしを愛するなら、その人はわたしのことばを守ります[a]。わたしの父はその人を愛し、わたしたちはその人のもとに来て、その人と共に住まいを設けます[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの教え」または「わたしの言うこと」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「その人と共に住まいを造ります」。「その人と共に住みます」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: 答えて言われた
  rationale: 二つの動詞から成るギリシア語の語り口を保ちつつ、現代日本語として理解できる表現にした。
- source_word: Ἐάν τις
  choice: だれでも…なら
  rationale: 不特定の一人を想定する開かれた条件を、自然な日本語で表した。
- source_word: ἀγαπᾷ / ἀγαπήσει
  choice: 愛する／愛し
  rationale: 同じ語根の動詞を一貫して「愛する」と訳し、イエスへの愛と父の愛との対応を保った。
- source_word: τὸν λόγον μου
  choice: わたしのことば
  rationale: λόγοςの持つ、イエスが語る教え・メッセージという幅とヨハネ文書における響きを保った。
- source_word: τηρήσει
  choice: 守ります
  rationale: τηρέωが含む、心に保つことと従うことの両面を狭めずに表せる。
- source_word: ὁ πατήρ μου
  choice: わたしの父
  rationale: ヨハネ福音書で神を指すイエスの特徴的な呼称をそのまま表した。
- source_word: πρὸς αὐτὸν ἐλευσόμεθα
  choice: その人のもとに来て
  rationale: πρόςが示す、その人へ向かう人格的な動きを明示した。
- source_word: μονὴν παρ’ αὐτῷ ποιησόμεθα
  choice: その人のところに住まいを設けます
  rationale: 「住まいを造る」という原文の表現を、日本語で不自然になりすぎない形にし、継続的な臨在の意味を保った。
theological_decisions:
- issue: 「わたしたちは来て…設けます」という複数主語
  choice: 父とイエスが共に来て住まいを設けるという複数形を明示した。
  alternative: 複数性を弱め、「神が共に住む」などと意訳する。
  rationale: ἐλευσόμεθαとποιησόμεθαはいずれも一人称複数であり、直前のイエスと父を共同の行為者として示す。本文以上の教理説明は加えず、この緊張を保持した。
- issue: 不特定単数のτιςと後続するαὐτόν／αὐτῷ
  choice: 「だれでも」で範囲を開き、後続部分では「その人」と単数で受けた。
  alternative: 「人々」などの複数表現に置き換える。
  rationale: 性別を限定せず、同時に原文の不特定単数構文を保つため。
- issue: 父の愛とことばを守ることとの関係
  choice: 条件文と後続する未来形を、説明を加えず原文どおり並べた。
  alternative: 愛を報酬や功績への応答として明示的に説明する。
  rationale: 本文は両者の関係を述べるが、その体系的な仕組みまでは説明していないため、神学的因果を訳文で補わない。
translation_notes:
  register: 明快な現代標準語を用いながら、「答えて言われた」「ことば」「住まいを設けます」により原文の語り口と荘重さを保った。敬体で統一し、「その人」によって不特定単数を性別に偏らず表現した。
