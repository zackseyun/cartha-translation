  text: I have spoken these things to you while staying with you[a].
translation:
  language: ja
  text: わたしは、あなたがたと共にいる間に、これらのことをあなたがたに話してきました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あなたがたのもとにとどまりながら」。ここで「いる」と訳したギリシア語は、ヨハネによる福音書で繰り返し用いられる「とどまる」という動詞です。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: これらのこと
  rationale: 中性複数の指示代名詞で、直前までの教えを指す。日本語でも複数性を保ち、「このこと」と単数化しない。
- source_word: λελάληκα
  choice: 話してきました
  rationale: λαλέωの完了形。過去に語った行為と現在までのつながりを、日本語で自然に表す。単純過去の「話しました」も可能だが、完了形の含みが弱くなる。
- source_word: ὑμῖν
  choice: あなたがたに
  rationale: 二人称複数の与格。文全体では「あなたがたと共にいる間に」と組み合わせ、日本語で対象が明瞭なため、訳文上は「あなたがたに」を重ねていない。
- source_word: παρ’ ὑμῖν
  choice: あなたがたと共に
  rationale: παρά＋与格が示す近接・同席を、自然で格調のある日本語で表す。「あなたがたのもとで」も可能。
- source_word: μένων
  choice: いる間に
  rationale: μένωの現在分詞を時の付帯状況として自然に訳した。直訳的な「とどまりながら」より明瞭だが、ヨハネ文書で反復される語とのつながりは脚注で示す。
theological_decisions:
- issue: ヨハネ文書に反復されるμένωの語彙的連続性
  choice: 本文では「あなたがたと共にいる間に」と自然に訳し、脚注で「とどまる」との対応を示す
  alternative: あなたがたと共にとどまりながら
  rationale: この箇所のμένωはイエスが弟子たちと共にいる期間を表す。本文で「とどまる」を機械的に用いると日本語では不自然になりやすい一方、重要な反復語であるため、脚注によって語彙的連続性を保持する。特定の神学的解釈は付加しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、イエスの告別説教にふさわしい落ち着いた丁寧体とした。「共に」は適度な格調を保ち、「話してきました」でギリシア語完了形の継続的な含みを自然に表した。
