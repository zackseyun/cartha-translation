id: JHN.14.15
reference: John 14:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐὰν ἀγαπᾶτέ με, τὰς ἐντολὰς τὰς ἐμὰς ⸀τηρήσετε·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/015.yaml
  text: If you love me[a], you will keep my commandments.
translation:
  language: ja
  text: あなたがたがわたしを愛するなら、わたしの戒めを守ります[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの命令に従います」とも訳せる。この動詞には、守る、保つ、遵守する、従うなどの意味がある。本文の「守ります」は、その幅広い意味を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: なら
  rationale: 条件を導く接続表現。反復を強調する「するときはいつでも」ではなく、文脈に自然な条件文として訳した。
- source_word: ἀγαπᾶτέ
  choice: 愛する
  rationale: 現在能動接続法二人称複数。日本語では条件節の中で「愛する」とするのが自然であり、継続相を必要以上に明示しない。
- source_word: με
  choice: わたしを
  rationale: イエスを指す単数一人称代名詞の対格をそのまま表した。
- source_word: τὰς ἐντολὰς τὰς ἐμὰς
  choice: わたしの戒め
  rationale: 所有を自然な日本語で示しつつ、ἐντολήの重みとヨハネ文書での用法を保つため「命令」より「戒め」を選んだ。
- source_word: τηρήσετε
  choice: 守ります
  rationale: 未来能動直説法二人称複数を命令形に変えず、条件の帰結を述べる表現とした。「守る」は、従うだけでなく、大切に保ち、遵守するという広がりも保持する。
theological_decisions:
- issue: τηρήσετεを命令として訳すか、未来の帰結を述べる直説法として訳すか
  choice: 未来の帰結を述べる「守ります」
  alternative: 命令的な「守りなさい」
  rationale: ギリシア語の形は未来直説法であり、命令法ではない。愛が戒めを守ることに結びつくという神学的緊張を保ち、直接の命令へと平板化しないため。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、イエスの発言としてふさわしい簡潔で格調ある文体。「あなたがた」で複数を明示し、未来直説法を日本語の非過去形「守ります」で自然に表現した。
