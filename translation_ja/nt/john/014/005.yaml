id: JHN.14.5
reference: John 14:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Θωμᾶς· Κύριε, οὐκ οἴδαμεν ποῦ ὑπάγεις· ⸀πῶς ⸂δυνάμεθα τὴν ὁδὸν εἰδέναι⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/005.yaml
  text: Thomas said to him[a], “Lord, we do not know where you are going[b]. How can we know the way?”
translation:
  language: ja
  text: トマスはイエスに言った。「主よ、私たちは、あなたがどこへ行かれるのか知りません。どうしてその道を知ることができるでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει αὐτῷ Θωμᾶς
  choice: トマスはイエスに言った
  rationale: 歴史的現在の λέγει は、日本語の自然な物語文として過去形「言った」とした。αὐτῷ は直訳すれば「彼に」だが、指示対象を明瞭にするため「イエスに」とした。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけであると同時に、ヨハネ福音書における弟子の認識の含みを保つ表現とした。
- source_word: οὐκ οἴδαμεν
  choice: 私たちは…知りません
  rationale: οἶδα の基本的な知識の意味を直接表し、「理解していません」と狭めなかった。
- source_word: ποῦ ὑπάγεις
  choice: あなたがどこへ行かれるのか
  rationale: ὑπάγω が持ちうる「立ち去る」という響きを過度に明示せず、イエスの行き先をめぐる物語上・神学上の緊張を保った。尊敬語は呼びかけの関係に即した自然な日本語である。
- source_word: πῶς δυνάμεθα
  choice: どうして…ことができるでしょうか
  rationale: 疑問を伴う能力・可能性を自然で格調ある現代日本語にした。「どうして」はここで「どのようにして／どうすれば」の意味。
- source_word: τὴν ὁδὸν
  choice: その道
  rationale: 定冠詞を文脈指示的に「その」と表し、次節の「道」との主題的連続性を保った。
- source_word: εἰδέναι
  choice: 知る
  rationale: 同じ語根の οἴδαμεν と εἰδέναι をともに「知る」と訳し、原文の反復とトマスの論理を保持した。
theological_decisions:
- issue: ヨハネ福音書における ὑπάγεις の神学的含意
  choice: 「どこへ行かれるのか」と中立的に訳す
  alternative: 「どこへ去って行かれるのか」
  rationale: 父のもとへの帰還という含意を訳文で先取りせず、トマスが行き先を知らないという場面の緊張を保つため。
- issue: ὁδός と次節の「道」との関係
  choice: 「その道」と訳して語の連続性を保つ
  alternative: 「行き方」
  rationale: 「行き方」と意訳すると具体的な経路に限定されやすい。原文の「道」を保つことで、次節で展開される意味を先取りも遮断もしない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、弟子からイエスへの呼びかけには「主よ」と尊敬表現「行かれる」を採用した。原文にない説明は加えず、「知る」の反復と「道」の語を保持した。
