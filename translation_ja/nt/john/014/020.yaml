id: JHN.14.20
reference: John 14:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ⸂γνώσεσθε ὑμεῖς⸃ ὅτι ἐγὼ ἐν τῷ πατρί μου καὶ ὑμεῖς ἐν ἐμοὶ κἀγὼ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/020.yaml
  text: On that day you will know that I am in my Father[a], and you are in me[b], and I am in you.
translation:
  language: ja
  text: その日、あなたがたは、わたしが父のうちにおり、あなたがたがわたしのうちにおり、わたしもあなたがたのうちにいることを知ります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「うちに」という語を繰り返す原文の表現を保っている。これは互いの深い結びつきや内在を示すが、単に「一つである」「結ばれている」と言い換えるよりも広い含みを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: その日
  rationale: 時間を表す句として、指示性を保ちながら自然な現代日本語にした。
- source_word: γνώσεσθε ὑμεῖς
  choice: あなたがたは……知ります
  rationale: 未来の認識を率直に表した。明示された代名詞ὑμεῖςは「あなたがたは」によって示し、「あなたがた自身」と過度に強調することは避けた。
- source_word: ὅτι
  choice: ……ことを
  rationale: 原因ではなく、弟子たちが知る内容を導く接続詞として訳した。
- source_word: ἐγὼ ἐν τῷ πατρί μου
  choice: わたしが父のうちにおり
  rationale: ヨハネ文書に特徴的なἐνの比喩を保ち、「一つである」「結ばれている」などの解釈を本文に持ち込まないようにした。
- source_word: καὶ ὑμεῖς ἐν ἐμοὶ
  choice: あなたがたがわたしのうちにおり
  rationale: 原文では省かれている連結動詞を日本語で補い、反復される「うちに」を保持した。
- source_word: κἀγὼ ἐν ὑμῖν
  choice: わたしもあなたがたのうちにいる
  rationale: κἀγώの付加的・対応的な意味を「わたしも」で表し、相互的な内在を示す表現をそのまま保った。
theological_decisions:
- issue: ἐνを三度用いる相互内在の表現
  choice: 三つの句すべてを「うちに」で統一した。
  alternative: 「一つである」「結ばれている」「一体となっている」
  rationale: 原文は、父とイエス、イエスと弟子たちの関係を同じ前置詞で表しつつ、その関係の性質を一義的に説明していない。反復を保つことで、存在・交わり・結合に関わる豊かな含意と神学的緊張を保持した。
- issue: イエスと父との関係
  choice: 「わたしが父のうちにおり」
  alternative: 「わたしと父は本質において一つであり」または「わたしは父と共におり」
  rationale: 原文の強いキリスト論的表現を弱めず、同時に後代の教理的定式を本文へ直接付加しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「おり」と「いる」を用いて長い内容節を自然につなぎつつ、原文の三つの対応する句と反復を見える形で保持した。
