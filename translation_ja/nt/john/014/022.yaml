id: JHN.14.22
reference: John 14:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ἰούδας, οὐχ ὁ Ἰσκαριώτης· Κύριε, ⸀τί γέγονεν ὅτι ἡμῖν μέλλεις ἐμφανίζειν σεαυτὸν καὶ οὐχὶ τῷ κόσμῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/022.yaml
  text: Judas (not Iscariot) said to him[a], “Lord[b], what has happened that you are going to reveal yourself to us and not to the world?”
translation:
  language: ja
  text: イスカリオテではないユダがイエスに言った。「主よ、どうして、私たちにはご自分を現そうとしておられるのに、世には現そうとしておられないのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: 物語中の歴史的現在だが、現代日本語の自然な叙述に合わせて過去形とした。
- source_word: Ἰούδας, οὐχ ὁ Ἰσκαριώτης
  choice: イスカリオテでないユダ
  rationale: 同名のイスカリオテのユダとの区別を、原文どおり簡潔に明示した。
- source_word: Κύριε
  choice: 主よ
  rationale: 敬意ある呼びかけであると同時に、ヨハネ福音書における称号としての重みを保つ。
- source_word: τί γέγονεν
  choice: 何があって
  rationale: 完了形が示す、何らかの事態が生じて現在の意向につながったという含みを、自然な疑問表現で示した。
- source_word: μέλλεις
  choice: …ようとしておられる
  rationale: 将来への意向を表しつつ、直ちに起こることだと限定しない表現を選んだ。
- source_word: ἐμφανίζειν σεαυτόν
  choice: ご自分を現す
  rationale: 自らを見えるようにすることと、知られるようにすることの両方を含み得る語義を保った。
- source_word: κόσμῳ
  choice: 世
  rationale: ヨハネ文書で神に背く人間世界を含意し得る語だが、ここでは解釈を限定せず、簡潔な定訳語で緊張を残した。
theological_decisions:
- issue: ヨハネ福音書における κόσμος の意味
  choice: 世
  alternative: 世の人々／神に背く世界
  rationale: この節だけで指示範囲や神学的含意を一義的に定めず、ヨハネ特有の多層的な意味を文脈に委ねた。
- issue: ἐμφανίζειν の啓示的含意
  choice: ご自分を現す
  alternative: ご自分を知らせる
  rationale: 可視的な顕現と自己啓示のどちらか一方に狭めず、原語の幅を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、弟子がイエスに向ける敬意を「主よ」「おられる」で表した。疑問の驚きと理由を尋ねる響きを「何があって」で自然に再現した。
