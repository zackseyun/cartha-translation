  source_fidelity: 主要な内容は原文に忠実である。「何があって」は τί γέγονεν の完了形的な前提をある程度表すが、この構文全体では「どうして」のほうが、出来事・事情を問いつつ ὅτι 以下へ自然に接続する。否定側でも自己顕現の動詞を明示すると、καὶ οὐχὶ τῷ κόσμῳ との対応が明瞭になる。
  naturalness: 「イスカリオテでないユダ」および「何があって」は意味は通るものの、明瞭で現代的な標準日本語としてはやや硬く、不自然さがある。「イスカリオテではないユダ」「どうして」が自然である。
