  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰρήνην ἀφίημι ὑμῖν, εἰρήνην τὴν ἐμὴν δίδωμι ὑμῖν· οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν. μὴ ταρασσέσθω ὑμῶν ἡ καρδία μηδὲ δειλιάτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/027.yaml
  text: Peace I leave with you; my peace I give to you. I do not give to you as the world gives. Do not let your heart be troubled[a], nor let it be fearful.
translation:
  language: ja
  text: わたしはあなたがたに平安を残します。わたしの平安をあなたがたに与えます。わたしは、世が与えるように与えるのではありません。心を騒がせてはなりません。また、おびえてもなりません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「また、恐れてはなりません」または「また、勇気を失ってはなりません」とも訳せる。ギリシア語の動詞には、恐れたり、おじけたりする意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνην
  choice: 平安
  rationale: 単なる争いの不在に限定せず、ヨハネ文書における広い意味を保てる、聖書文脈でも自然な標準訳。
- source_word: ἀφίημι
  choice: 残します
  rationale: ここでは平安を弟子たちのもとに残す意。遺贈の含みを断定する「遺します」は避け、現在の日本語として自然にした。
- source_word: εἰρήνην τὴν ἐμὴν
  choice: わたしの平安
  rationale: 強調された所有表現を簡潔に保ち、世が与えるものとの対比を明確にする。
- source_word: δίδωμι
  choice: 与えます
  rationale: 反復される動詞を同じ語で訳し、イエスの与え方と世の与え方の対照を保つ。
- source_word: οὐ καθὼς ὁ κόσμος δίδωσιν ἐγὼ δίδωμι ὑμῖν
  choice: わたしは、世が与えるように与えるのではありません
  rationale: ギリシア語の比較と主語の対照を保ちつつ、現代日本語として明瞭にした。何をどのように与えないのかは本文以上に限定しない。
- source_word: κόσμος
  choice: 世
  rationale: ヨハネにおける多義的な用法を保ち、人間社会や堕落した秩序など一つの解釈に狭めない定着した訳語。
- source_word: μὴ ταρασσέσθω ὑμῶν ἡ καρδία
  choice: 心を騒がせてはなりません
  rationale: 14章1節との語の響きを保ち、受動命令の意味を自然な日本語で表す。複数の所有者に対する単数形「心」は、日本語でも集合的に自然である。
- source_word: μηδὲ δειλιάτω
  choice: また、おびえてもなりません
  rationale: ταράσσωとの違いを保ち、恐れや勇気を失う意味を表す。「臆病になる」は道徳的非難が強すぎるため避けた。
theological_decisions:
- issue: イエスが与える平安の性質
  choice: 本文では「平安」「わたしの平安」とし、その内容を限定しない
  alternative: 内面的な平静、終末的・契約的な充足、神との和解のいずれかに明示的に限定する
  rationale: この節自体は平安を一義的に定義していないため、語の神学的な広がりと緊張を保った。
- issue: 「世が与えるようにではない」の具体的意味
  choice: 比較表現をそのまま保つ
  alternative: 世の平安は一時的・偽りであるなどと説明的に補う
  rationale: 原文は相違を明言するが、その相違の内容をここで詳述してはいないため、解釈的補足を本文に加えない。
translation_notes:
  register: 明瞭で品位ある現代標準語。敬体で統一し、「平安」「世」などヨハネ文書の重要語を簡潔に保持した。脚注記号は該当する第二の命令の後に置いた。
