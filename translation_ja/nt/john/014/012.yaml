  source_fidelity: 全体として、πιστεύων εἰς ἐμέ、τὰ ἔργα、κἀκεῖνος、μείζονα τούτων、ὅτι、および父へ行くという因果関係を忠実に伝えている。「これらよりも大きなわざ」は、原文で省略されている「わざ」を自然に補いながら、その『大きさ』の意味を限定していない。もっとも、「言っておく」はλέγωの単純な現在の発話を、あらかじめ告げておくという含みへわずかに寄せる。また「行っている」は可能ではあるが、原文の一般的現在を継続相として強める。
  naturalness: 「よくよく、あなたがたに言っておく」は現代標準日本語としてやや不自然で、「よくよく、あなたがたに言う」のほうが定型的な厳粛さを保ちつつ自然である。「わたしが行うわざ」とすると不必要な進行相を避け、文も引き締まる。二つの未来の述語は「また」で区切ると、信じる者がイエスのわざを行うことと、さらに大きなわざを行うことが明瞭になる。
  terminology: 「わたし」「父」「わざ」はヨハネ福音書の文脈にふさわしく、一貫している。「わざ」はἔργαの反復と神学的語彙上の連関を保つ適切な表記である。「信じる者」「その人」は代表単数を自然に表しており、性別を限定しない。
