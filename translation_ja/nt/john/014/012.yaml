  to: まことに、まことに、あなたがたに言う。わたしを信じる者は、わたしが行うわざを、その人も行う。また、これらよりも大きなわざを行う。わたしが父のもとへ行くからである。
  rationale: 原文の意味および神学的な曖昧さを保ったまま、λέγωの直接性とποιῶの相の幅をより忠実に反映するため、「言っておく」を「言う」、「行っている」を「行う」に改めた。後半は二つの未来の約束を「また」で明瞭に分けた。「大きなわざ」が何の点で大きいかは本文で説明せず、解釈を付加していない。
