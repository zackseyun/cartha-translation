id: JHN.14.12
reference: John 14:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ πιστεύων εἰς ἐμὲ τὰ ἔργα ἃ ἐγὼ ποιῶ κἀκεῖνος ποιήσει, καὶ μείζονα τούτων ποιήσει, ὅτι ἐγὼ πρὸς τὸν ⸀πατέρα πορεύομαι·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/012.yaml
  text: Truly[a], truly, I say to you, the one who believes in me will also do the works that I do; and he will do greater works than these[b], because I am going to the Father.
translation:
  language: ja
  text: まことに、まことに、あなたがたに言う。わたしを信じる者は、わたしが行うわざを、その人も行う。また、これらよりも大きなわざを行う。わたしが父のもとへ行くからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: よくよく
  rationale: イエスの厳粛で強調された二重の確言を、現代日本語でも聖書的な品位を保つ定着表現で示す。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言っておく
  rationale: 複数の聞き手への宣言であることを明示しつつ、この確言句に自然な日本語とした。
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: わたしを信じる者
  rationale: 冠詞付き現在分詞の一般的・代表的用法を簡潔に表し、ヨハネ文書における πιστεύω εἰς の自然な訳語を用いた。
- source_word: τὰ ἔργα ἃ ἐγὼ ποιῶ
  choice: わたしが行っているわざ
  rationale: ἔργα をヨハネ福音書の語彙的連関が見える「わざ」とし、現在形は継続中の働きを自然に示す「行っている」とした。
- source_word: κἀκεῖνος ποιήσει
  choice: その人も行い
  rationale: κἀκεῖνος の指示性と追加の意味を「その人も」で保ち、ποιέω の反復も同じ「行う」で表した。
- source_word: καὶ μείζονα τούτων ποιήσει
  choice: さらに、これらよりも大きなわざを行う
  rationale: 中性複数 μείζονα の省略された名詞を直前の ἔργα から補い、日本語として明瞭にした。「大きな」の具体的意味は限定しない。
- source_word: ὅτι
  choice: からである
  rationale: イエスが父のもとへ行くことが前文の理由であるという因果関係を明確に示す。
- source_word: πρὸς τὸν πατέρα πορεύομαι
  choice: わたしが父のもとへ行く
  rationale: πρός の方向性を「父のもとへ」で表し、定冠詞付き πατέρα に所有代名詞を付加せず、文脈上の近接未来として自然に訳した。
theological_decisions:
- issue: 「これらよりも大きなわざ」の意味
  choice: 何がどの意味で「大きい」のかを限定せず、イエスが父のもとへ行くこととの因果関係だけを本文に示す。
  alternative: 宣教範囲の拡大、救済史上の意義、力ある奇跡、または聖霊による教会の働きのいずれかに特定する。
  rationale: 原文は「大きい」ことの尺度や様態を説明していないため、特定の教理的解釈を訳文へ持ち込まず、神学的な広がりと緊張を保った。
- issue: 単数形の信者への言及
  choice: 「わたしを信じる者……その人」と一般的な代表単数として訳す。
  alternative: 複数化して「信じる人々」とする、または性別を明示する代名詞を用いる。
  rationale: ギリシア語の単数構文を保ちながら、日本語では性別を不必要に限定せず、どの信者にも当てはまる一般性を自然に示せる。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、イエスの厳粛な宣言には「よくよく」「である」を用いて品位を保った。「わざ」はヨハネ福音書内の語彙的連関を維持するため漢字の「業」ではなく仮名表記とした。
