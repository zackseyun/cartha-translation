id: JHN.14.4
reference: John 14:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅπου ἐγὼ ὑπάγω οἴδατε ⸂τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/004.yaml
  text: And you know the way where I am going[a].
translation:
  language: ja
  text: わたしがどこへ行くのか、その道をあなたがたは知っています。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「わたしがどこへ行くのか、あなたがたは知っており、その道も知っています」とあります。
    reason: textual_variant
lexical_decisions:
- source_word: καὶ
  choice: （明示せず）
  rationale: 前後を結ぶ単純な接続詞だが、日本語では文脈上あえて「そして」を置かないほうが自然であり、意味上の連続性は保たれる。
- source_word: ὅπου
  choice: どこへ
  rationale: 移動を表す「行く」とともに、行き先を自然な現代日本語で示す。
- source_word: ἐγὼ
  choice: わたしが
  rationale: 明示された一人称主語を保持し、話者イエスの行き先であることを明確にする。
- source_word: ὑπάγω
  choice: 行く
  rationale: 現在形の移動・間近な出発の含みを、過度に解釈せず自然に表す。
- source_word: οἴδατε
  choice: あなたがたは知っています
  rationale: οἶδαの現在的意味を丁寧体で表し、複数の聞き手も明示する。
- source_word: τὴν ὁδόν
  choice: その道
  rationale: 「道」は物理的な道筋と比喩的な方法の両方を担いうるため、直後の文脈につながる語義の幅を保つ。「その」は既知の行き先に関わる特定の道を示す。
theological_decisions:
- issue: 「どこへ行くのか」と「道」の統語的関係
  choice: わたしがどこへ行くのか、その道をあなたがたは知っています。
  alternative: わたしが行く所への道を、あなたがたは知っています。
  rationale: ギリシア語の語順と関係を比較的近く保ちつつ、日本語として理解できる形にした。「所への道」として目的地への経路に限定しすぎず、ὁδόςが持つ比喩的な含みと神学的緊張を残す。
- issue: 本文異読
  choice: SBLGNTの短い読みを本文とする。
  alternative: 「わたしがどこへ行くのか、あなたがたは知っており、その道も知っています。」
  rationale: 指定された原語本文は οἴδατε τὴν ὁδόν の短い形である。行き先と道の双方を明示的に知るとする長い異読は本文に取り込まず、脚注で示す。
translation_notes:
  register: 明瞭で品位のある現代標準日本語の丁寧体。「道」の多義性を保ち、後続する14章6節の内容を先取りして解釈しない。
