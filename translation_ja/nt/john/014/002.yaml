  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν τῇ οἰκίᾳ τοῦ πατρός μου μοναὶ πολλαί εἰσιν· εἰ δὲ μή, εἶπον ἂν ὑμῖν ⸀ὅτι πορεύομαι ἑτοιμάσαι τόπον ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/002.yaml
  text: In my Father's house there are many dwelling places[a]. If it were not so[b], would I have told you that I am going to prepare a place for you?
translation:
  language: ja
  text: わたしの父の家には、住まいがたくさんあります[a]。もしそうでなかったなら、わたしはあなたがたに、「あなたがたのために場所を用意しに行く」と言ったでしょうか[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「部屋がたくさんあります」。ギリシア語は、とどまる所、住まいを意味します。「住まい」は意味を広く保ち、この章の「とどまる」という主題とのつながりも示します。
    reason: lexical_alternative
  - marker: b
    text: 別の区切り方では、「もしそうでなかったなら、わたしはあなたがたに言ったでしょう。わたしがあなたがたのために場所を用意しに行くからです」とも訳せます。ギリシア語のこの部分は、修辞疑問ではなく陳述として読むこともできます。
    reason: alternative_reading
lexical_decisions:
- source_word: οἰκίᾳ
  choice: 家
  rationale: ここでは具体的な家、住まいを指すのが自然であり、「わたしの父の家」というヨハネ福音書の表現を保つ。「家族」や「家の者」とは解釈しない。
- source_word: πατρός μου
  choice: わたしの父
  rationale: 属格を自然な現代日本語で表した。文脈上、イエスが神を指して語っている。
- source_word: μοναὶ πολλαί
  choice: 住む所がたくさん
  rationale: μονήは、とどまる所、住まいを意味する。「部屋」より広い語義を保ち、同章に見られる「とどまる」という主題とのつながりも損なわない。
- source_word: εἰ δὲ μή
  choice: もしそうでなかったなら
  rationale: 文脈から補われる条件を明示し、現代日本語として自然にした。
- source_word: εἶπον ἂν ὑμῖν
  choice: わたしはあなたがたに……と言ったでしょうか
  rationale: ἄνを伴うアオリストを反実仮想の帰結として表し、採用した句読法に従って修辞疑問とした。
- source_word: ὅτι
  choice: 引用を導く「と」
  rationale: ὅτιを発言内容を導く語と解し、日本語では直接引用と引用助詞「と」で自然に表した。
- source_word: πορεύομαι
  choice: 行く
  rationale: 目的をもってこれから向かうことを、引用内の自然な日本語で表した。
- source_word: ἑτοιμάσαι
  choice: 用意しに
  rationale: 目的を表す不定詞の働きを「用意しに」で簡潔に示した。
- source_word: τόπον
  choice: 場所
  rationale: τόποςの広い意味を保ち、「部屋」と狭く限定しない。
- source_word: ὑμῖν
  choice: あなたがたのために
  rationale: 複数二人称に対する受益の与格を明示した。
theological_decisions:
- issue: μονήと終末的な住まいのイメージ
  choice: 住む所がたくさん
  alternative: 部屋がたくさん／住まいがたくさん
  rationale: 「豪邸」のような後代の連想を持ち込まず、また建物内部の区画である「部屋」に限定せず、とどまり住む場所という語義を保った。
- issue: 後半の句読法と発話の力
  choice: 「もしそうでなかったなら……と言ったでしょうか」という修辞疑問
  alternative: 「もしそうでなかったなら、あなたがたに言ったでしょう。わたしはあなたがたのために場所を用意しに行くのです」という陳述
  rationale: 原文には元来の句読点がなく、ὅτιを発言内容の導入と取るか理由を示す接続詞と取るかで構文が分かれうる。本文では文脈に合う修辞疑問を採用し、別の可能性を注記した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語とした。イエスの一人称は「わたし」、弟子たちへの複数二人称は「あなたがた」とし、具体的な家の比喩を保ちながら、建築的細部や後代の宗派的理解を加えていない。
