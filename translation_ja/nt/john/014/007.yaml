id: JHN.14.7
reference: John 14:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ ⸀ἐγνώκειτέ με, καὶ τὸν πατέρα μου ⸂ἂν ᾔδειτε⸃· ⸀ἀπ’ ἄρτι γινώσκετε αὐτὸν καὶ ἑωράκατε ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/007.yaml
  text: If you had known me, you would have known my Father also. From now on you do know him and have seen him.
translation:
  language: ja
  text: もしあなたがたがわたしを知っていたなら、わたしの父をも知っていたはずです。今からは、あなたがたは父を知っているのです。そして、父を見たのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本には、前半の「知っていた」の動詞形を異にするものがある。
    reason: 前半には動詞形と構文に関する本文異読があるが、異読の意味を不正確に将来形の条件文として限定しないため。
lexical_decisions:
- source_word: ἐγνώκειτέ / γινώσκετε
  choice: 知っていた／知っており
  rationale: 同じ「知る」という語彙で訳しつつ、前者の反実仮想的な過去と、後者の現在の認識を区別した。
- source_word: ἑωράκατε
  choice: すでに…見ています
  rationale: 完了形が示す、見た出来事とその現在に続く結果を自然な現代日本語で表した。
- source_word: ὁ πατήρ μου / αὐτόν
  choice: わたしの父／父
  rationale: 代名詞の指示対象が父であることを日本語で明確にし、自然な文章にした。
- source_word: ἀπ’ ἄρτι
  choice: 今から
  rationale: この時点以後を指す時間表現を簡潔に訳した。
theological_decisions:
- issue: 前半の本文異読
  choice: 「もしあなたがたがわたしを知っていたなら、わたしの父をも知っていたはずです」
  alternative: 「もしあなたがたがわたしを知っているなら、わたしの父をも知るでしょう」
  rationale: 提示されたSBLGNT本文の過去完了形とἄνを伴う反実仮想を本文に反映したが、重要な異読は脚注に示した。
- issue: 「父を見た」の意味
  choice: 比喩的・神学的意味を説明語で限定せず、そのまま「父を見ています」とした
  alternative: 「父がどのような方かを見ています」
  rationale: イエスを見ることと父を見ることの関係について、原文の強い表現と神学的緊張を保った。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、イエスの厳粛な語調を保つ丁寧体とした。「あなたがた」により複数形を明示し、「父」は文脈上の称号として簡潔に表記した。
