review_pass:
  verdict: revise
  source_fidelity: 前半はSBLGNTの過去完了形（ἐγνώκειτε）とἄνを伴う反実仮想を適切に反映している。一方、ἀπ’ ἄρτιは「今から」より「今からは」とするほうが、この時点以後という対比を明確にする。ἑωράκατεは完了形であり、「見ています」より「見たのです」が、すでに起きた見る行為とその有効性をより自然に表す。
  naturalness: 「今から、…知っており、すでに…見ています」は、時間副詞と「知っており」の接続がやや不自然である。「今からは、父を知っているのです。そして、父を見たのです」とすると、現代標準日本語として明瞭で、原文の強調と二つの完了・現在の叙述を保てる。
  terminology: 「わたし」「父」「あなたがた」は文脈に適し、神学的説明を加えず「父を見た」とする方針も妥当である。ただし、脚注の異読の提示は、提示本文と異なる動詞形・構文を正確に示す必要があり、現行の「知っているなら…知るでしょう」という説明はこの箇所の主要な異読を適切に代表していない。
  issues:
  - severity: medium
    issue: ἀπ’ ἄρτιの訳が「今から」となっている。
    rationale: 「今からは」として、直前の反実仮想に対する「この時から以後」の転換を自然に明示する。
  - severity: medium
    issue: ἑωράκατεの完了形を「すでに父を見ています」としている。
    rationale: 日本語の「見ています」は進行中の視覚行為にも読まれうる。「父を見たのです」は完了した出来事を明瞭にし、文脈上の強い主張を保つ。
  - severity: high
    issue: 脚注が、意味のある本文異読を不正確に「もし…知っているなら、…知るでしょう」と提示している。
    rationale: 異読注は実在する異なる動詞形・構文を正確に説明すべきであり、将来形の訳文として提示すると写本上の差異を誤って伝えるおそれがある。
