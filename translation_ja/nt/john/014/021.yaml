id: JHN.14.21
reference: John 14:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἔχων τὰς ἐντολάς μου καὶ τηρῶν αὐτὰς ἐκεῖνός ἐστιν ὁ ἀγαπῶν με· ὁ δὲ ἀγαπῶν με ἀγαπηθήσεται ὑπὸ τοῦ πατρός μου, κἀγὼ ἀγαπήσω αὐτὸν καὶ ἐμφανίσω αὐτῷ ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/021.yaml
  text: The one who has my commandments and keeps them is the one who loves me[a]. And the one who loves me will be loved by my Father[c][b], and I will love him and reveal myself to him.
translation:
  language: ja
  text: 'わたしの戒めを持ち、それを守る人こそ、わたしを愛する人である。わたしを愛する人は、わたしの父に愛される。そして、わたしもその人を愛し、その人にわたし自身を現す[a]。


    [a] 「わたし自身を知らせる」とも訳せる。ここで用いられている語は、自分を見えるようにすることも、自分がどのような者かを知らせることも表しうる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたし自身を知らせる」とも訳せる。ここで用いられている語は、自分を見えるようにすることも、自分がどのような者かを知らせることも表しうる。
    reason: ἐμφανίζωの意味の幅と、自己顕現・自己開示の両方の可能性を保つため。
lexical_decisions:
- source_word: ὁ ἔχων τὰς ἐντολάς μου
  choice: わたしの戒めを持ち
  rationale: ὁ ἔχωνの継続的・代表的な性格を保ちつつ、原文の「持つ」を過度に「知る」「受け入れる」と限定しないようにした。
- source_word: ἐντολάς
  choice: 戒め
  rationale: イエスの言葉が持つ権威を表し、ヨハネ文書での用法にも合う、現代日本語の聖書文体として自然な語を選んだ。
- source_word: τηρῶν
  choice: 守る
  rationale: 単なる一時的な服従ではなく、戒めを保ち、忠実に実行するというτηρέωの幅を簡潔に表す。
- source_word: ἐκεῖνός ἐστιν ὁ ἀγαπῶν με
  choice: その人こそ、わたしを愛する人である
  rationale: ἐκεῖνοςの強調を「こそ」で表し、戒めを持って守る人とイエスを愛する人との同定を保った。
- source_word: ἀγαπῶν / ἀγαπηθήσεται / ἀγαπήσω
  choice: 愛する／愛される／愛し
  rationale: 原文が意図的に繰り返すἀγαπάω語群を、同じ「愛」の語で一貫して再現した。
- source_word: κἀγώ
  choice: そして、わたしも
  rationale: 父の愛に続くイエス自身の対応する行為として、καίの付加的な力を「も」で明示した。
- source_word: ἐμφανίσω αὐτῷ ἐμαυτόν
  choice: その人にわたし自身を現す
  rationale: ἐμαυτόνの反射的強調を「わたし自身」で保ち、ἐμφανίζωが含みうる可視的な出現と人格的な自己開示の両方に開かれた表現とした。
- source_word: αὐτὸν / αὐτῷ
  choice: その人を／その人に
  rationale: ギリシア語の男性単数は代表的用法である。日本語では単数性を保つ「その人」が自然であり、性別を不必要に付加しない。
theological_decisions:
- issue: 愛と戒めを守ることの関係
  choice: 戒めを持って守る人を、イエスを愛する人として同定した。
  alternative: 従順が愛を証明する、または神の愛を獲得する、と説明的に訳す。
  rationale: 原文は両者を強く結びつけるが、功績や因果関係を明示してはいない。そのため、同定の構文を保ち、神の愛が報酬として獲得されるという解釈を加えなかった。
- issue: 父とイエスによる愛
  choice: 「父に愛される」「わたしもその人を愛し」と未来形をそのまま述べた。
  alternative: 父とイエスがすでに愛していることを強調する現在的表現に置き換える。
  rationale: ἀγαπηθήσεταιとἀγαπήσωの未来形を保ち、その時間的・神学的緊張を説明によって解消しないようにした。
- issue: イエスの自己顕現の性質
  choice: 「わたし自身を現す」とし、注で「知らせる」という可能性を示した。
  alternative: 「姿を見せる」または「自分がどのような者かを知らせる」と一義的に訳す。
  rationale: ἐμφανίζωは可視的な顕現と人格的な自己開示の双方を表しうるため、文脈に基づいて一方だけに限定しなかった。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの発言としての荘重さを保つため、文末は「である」とした。「彼」ではなく「その人」を用いて、原文の単数の代表性を自然な日本語で表した。
