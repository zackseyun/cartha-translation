id: JHN.14.9
reference: John 14:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· ⸂Τοσούτῳ χρόνῳ⸃ μεθ’ ὑμῶν εἰμι καὶ οὐκ ἔγνωκάς με, Φίλιππε; ὁ ἑωρακὼς ἐμὲ ἑώρακεν τὸν πατέρα· ⸀πῶς σὺ λέγεις· Δεῖξον ἡμῖν τὸν πατέρα;
base_translation:
  language: en
  yaml_path: translation/nt/john/014/009.yaml
  text: Jesus said to him[a], “Have I been with you for so long, and you still have not known me, Philip? The one who has seen me has seen the Father. How can you say, ‘Show us the Father’?”
translation:
  language: ja
  text: イエスは彼に言われた。「フィリポ、こんなに長い間[a]あなたがたと一緒にいるのに、あなたはまだわたしを知っていないのですか。わたしを見た者は、父を見たのです。それなのに、どうしてあなたは『私たちに父を見せてください』と言うのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これほど長い間」。
    reason: Τοσούτῳ χρόνῳ の程度表現には、同じ期間の長さを示す自然な別訳が可能であるため。
lexical_decisions:
- source_word: Τοσούτῳ χρόνῳ
  choice: こんなに長い間
  rationale: 程度を表す τοσοῦτος と χρόνος の与格により、現在まで続く長い期間を表す。日本語として自然で、問いかけに込められた驚きと叱責の響きも保つ。
- source_word: μεθ’ ὑμῶν εἰμι
  choice: あなたがたと一緒にいる
  rationale: 現在形 εἰμι と期間表現の組み合わせを、日本語では継続中の状態として自然に表した。ὑμῶν の複数も「あなたがた」で明示した。
- source_word: οὐκ ἔγνωκάς με
  choice: あなたはまだわたしを知っていない
  rationale: γινώσκω の完了形が示す、これまで知る機会があったにもかかわらず現在も知らない状態を「まだ」と「知っていない」で表した。単なる知識ではなく人格的な認識も含み得るため、「分かっていない」などに狭めなかった。
- source_word: Φίλιππε
  choice: フィリポ
  rationale: 日本語聖書で広く定着した固有名の表記を用いた。呼格の働きは文中で直接呼びかけることによって示した。
- source_word: ὁ ἑωρακὼς ἐμὲ
  choice: わたしを見た者
  rationale: 冠詞付き完了分詞を一般的・代表的な「者」として訳した。完了形の結果的含意は後続の文全体に保たれており、日本語では簡潔な「見た」が自然である。
- source_word: ἑώρακεν τὸν πατέρα
  choice: 父を見たのです
  rationale: 原文の強い断定をそのまま保ち、「父がどのような方かを見た」のような説明的な弱化を避けた。τὸν πατέρα はヨハネ福音書の用語法に従い「父」とした。
- source_word: πῶς σὺ λέγεις
  choice: それなのに、どうしてあなたは…と言うのですか
  rationale: πῶς の修辞的な驚きと不釣り合いへの問いを、文脈との対照を示す「それなのに」と自然な疑問表現「どうして」で表した。強調された σὺ は「あなた」で明示した。
- source_word: Δεῖξον ἡμῖν τὸν πατέρα
  choice: 私たちに父を見せてください
  rationale: δείκνυμι のアオリスト命令形を、直前のフィリポの願いをそのまま引用する丁寧な依頼表現として訳した。ἡμῖν の複数を「私たちに」で保持した。
theological_decisions:
- issue: イエスを見ることと父を見ることとの関係
  choice: 「わたしを見た者は、父を見たのです」と直接的に訳す
  alternative: 「わたしを見た者は、父がどのような方かを見たのです」と説明的に弱める、または後代の教理用語を補って存在論的関係を明示する
  rationale: 原文の強いキリスト論的主張を薄めずに保つ一方、本文にない教理的説明は加えず、その意味の広がりと緊張を残した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、イエスの厳粛な問いかけにふさわしい丁寧で格調ある文体とした。イエスの一人称は「わたし」、引用内の弟子たちの一人称複数は可読性のため「私たち」と表記した。
