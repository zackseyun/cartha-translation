id: JHN.14.24
reference: John 14:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ μὴ ἀγαπῶν με τοὺς λόγους μου οὐ τηρεῖ· καὶ ὁ λόγος ὃν ἀκούετε οὐκ ἔστιν ἐμὸς ἀλλὰ τοῦ πέμψαντός με πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/024.yaml
  text: The one who does not love me does not keep my words[a]. And the word that you hear is not mine[b], but belongs to the Father who sent me.
translation:
  language: ja
  text: わたしを愛さない人は、わたしのことばを守らない。あなたがたが聞いていることば[a]は、わたしのものではなく、わたしを遣わした父のものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ことば」は、「教え」または「メッセージ」とも訳せる。
    reason: λόγος はここで、個々の語ではなく、聞かれている教えやメッセージ全体を指す可能性があるため。
lexical_decisions:
- source_word: ὁ μὴ ἀγαπῶν με
  choice: わたしを愛さない人
  rationale: 冠詞付き現在分詞を、イエスを愛さない者一般を指す自然な現代日本語で表した。現在分詞の継続的・特徴的な含みも保っている。
- source_word: τοὺς λόγους μου
  choice: わたしのことば
  rationale: 複数形 λόγους はイエスの語った教えの数々を指す。「ことば」は日本語では通常、単複を形で区別しないが、文脈上自然であり、λόγος との語彙的なつながりも保てる。
- source_word: τηρεῖ
  choice: 守らない
  rationale: τηρέω はここで、イエスのことばを心に留めて従い、忠実に保つことを表す。「守る」は「従う」だけに狭めず、その意味の幅を自然に伝える。
- source_word: ὁ λόγος ὃν ἀκούετε
  choice: あなたがたが聞いていることば
  rationale: 単数 λόγος を集合的な一つのことば・教えとして保ち、現在形 ἀκούετε は「聞いている」とした。原文に明示されない「わたしから」は補わない。
- source_word: οὐκ ἔστιν ἐμὸς
  choice: わたしのものではなく
  rationale: 所有・帰属を示す ἐμός を直接的に訳し、続く父との対比を保った。
- source_word: ἀλλὰ τοῦ πέμψαντός με πατρός
  choice: わたしを遣わした父のものである
  rationale: 属格を「父のもの」として明示し、「わたしを遣わした」が自然に「父」を修飾する形にした。ことばの帰属・源が父にあることを示す。
theological_decisions:
- issue: イエスのことばと父のことばとの関係
  choice: 「わたしのものではなく、わたしを遣わした父のものである」
  alternative: 「わたしから出たものではなく、わたしを遣わした父から出たものである」
  rationale: 原文は、イエスが語ることばと、そのことばの父への帰属・由来を同時に示す。「から出た」と意味を限定せず、父と子の区別、および伝えられることばの一致に関する原文の緊張を保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの発言としての簡潔さと威厳を保った。「わたし」「あなたがた」「父」は、ヨハネ福音書の対話に自然な聖書的文体である。
