id: JHN.14.17
reference: John 14:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὸ πνεῦμα τῆς ἀληθείας, ὃ ὁ κόσμος οὐ δύναται λαβεῖν, ὅτι οὐ θεωρεῖ αὐτὸ οὐδὲ ⸀γινώσκει· ⸀ὑμεῖς γινώσκετε αὐτό, ὅτι παρ’ ὑμῖν μένει καὶ ἐν ὑμῖν ⸀ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/017.yaml
  text: the Spirit of truth[a], whom the world is not able to receive, because it neither sees him nor knows him. You know him[b], because he remains with you and will be in you.
translation:
  language: ja
  text: すなわち、真理の霊です[a]。世はこの方を受け入れることができません。この方を見ず、知りもしないからです。しかし、あなたがたはこの方を知っています。この方はあなたがたと共におられ、あなたがたの内におられるようになるからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「霊」に当たるギリシア語は文法上は中性ですが、ここでは人格的な方を指しています。
    reason: 原語の文法的性と人格的指示対象との関係を説明するため。
  - marker: b
    text: 「あなたがたの間におられるようになる」とも訳せます。また、写本によっては「あなたがたの内におられます」と現在形で読みます。
    reason: 複数代名詞を伴うἐνの共同体的解釈と、ἔσταιに関する重要な本文異読を示すため。
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: 真理の霊
  rationale: 属格表現を保ち、ヨハネ文書に特徴的な言い回しを自然な日本語で再現した。「霊」は文脈上、聖霊を指すが、原文にない「聖」を本文へ補わない。
- source_word: ὃ / αὐτό
  choice: この方
  rationale: πνεῦμαは文法上中性だが、文脈では人格的な指示対象である。日本語で「それ」として非人格性を暗示するのを避けつつ、性別を原文以上に明示しない表現とした。
- source_word: ὁ κόσμος
  choice: 世
  rationale: ヨハネ文書におけるκόσμοςの広がりと含意を保つ定着した聖書語であり、「人類」や「世の体制」と限定しない。
- source_word: οὐ δύναται λαβεῖν
  choice: 受け入れることができません
  rationale: δύναταιの不可能・無能力と、λαμβάνωの受領の意味をともに表す。ここでは人格的な対象との関係を自然に示すため「受け取る」より「受け入れる」とした。
- source_word: θεωρεῖ
  choice: 見ず
  rationale: 知覚と認識の重なりを過度に解釈せず、γινώσκειとの区別も保つ簡潔な訳。
- source_word: γινώσκει / γινώσκετε
  choice: 知り／知っています
  rationale: 世が知らないことと弟子たちが知っていることの語彙上の対照を同じ動詞で保持した。
- source_word: παρ’ ὑμῖν μένει
  choice: あなたがたと共におられ
  rationale: παρά＋与格を「共に」とし、μένωの持続的な意味を敬意ある人格表現「おられる」で示した。
- source_word: ἐν ὑμῖν ἔσται
  choice: あなたがたの内におられるようになる
  rationale: ἔσταιの未来時制を明示し、παρ’ ὑμῖνとの違いを保つ。「あなたがた」は複数なので共同体的な『あなたがたの間に』も可能だが、ἐνの基本義と直前の『共に』との対照を優先した。
theological_decisions:
- issue: 文法上中性の「霊」を人格的にどう指すか
  choice: 「この方」という人格的で性別を限定しない指示表現を用いる
  alternative: 「それ」と訳し、ギリシア語の文法的中性を表面上反映する
  rationale: ギリシア語の中性形はπνεῦμαの文法的性に一致するもので、指示対象の非人格性を意味しない。日本語では人格的な文脈を自然に伝えつつ、原文にない男性性を付加しない。
- issue: 「共に」と「内に」の関係
  choice: παράとἐνをそれぞれ「共に」「内に」と訳し、未来形も保持する
  alternative: 両方を一般的な臨在として「共に」または「間に」と平準化する
  rationale: 二つの前置詞表現と時制の違いを残し、聖霊の臨在について本文が示す進展と緊張を訳文で解消しない。
- issue: ἔσταιの本文形と時制
  choice: SBLGNTの未来形に従い「おられるようになる」とする
  alternative: 異読の現在形に基づき「おられる」とする
  rationale: 指定された底本のἔσταιを優先し、現在の『共におられる』と将来の『内におられるようになる』との対照を保持する。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖霊への人格的敬意を「この方」「おられる」で表した。「すなわち」は前節から続く同格句であることを示す。文を適度に分け、朗読時にも理解しやすい格調ある文体とした。
