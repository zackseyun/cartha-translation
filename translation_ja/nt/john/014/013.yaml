id: JHN.14.13
reference: John 14:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅ τι ἂν αἰτήσητε ἐν τῷ ὀνόματί μου τοῦτο ποιήσω, ἵνα δοξασθῇ ὁ πατὴρ ἐν τῷ υἱῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/014/013.yaml
  text: And whatever you ask in my name[a], this I will do, so that the Father may be glorified in the Son.
translation:
  language: ja
  text: また、あなたがたがわたしの名によって願うことは何でも、わたしがそれを行います。それは、父が子において[a]栄光をお受けになるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子を通して」。ギリシア語は直訳すると「子において」で、父が栄光を受ける領域または媒介を表している可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅ τι ἂν
  choice: ことは何でも
  rationale: 不定の関係表現が示す広がりを、現代日本語で自然に表す。
- source_word: αἰτήσητε
  choice: 願う
  rationale: ここでは弟子たちがイエスに求める文脈に適し、「求める」より祈りの響きも自然に伝える。二人称複数は「あなたがた」で明示した。
- source_word: ἐν τῷ ὀνόματί μου
  choice: わたしの名によって
  rationale: 日本語として定着した自然な表現であり、イエスの権威、代理、イエスとの一致などの含みを一つに限定しない。
- source_word: τοῦτο ποιήσω
  choice: わたしがそれを行います
  rationale: 明示された指示代名詞 τοῦτο を「それ」として残し、主語「わたし」の強調も伝える。
- source_word: ἵνα
  choice: それは……ためです
  rationale: 目的を表す ἵνα の働きを明瞭な現代日本語で示す。
- source_word: δοξασθῇ
  choice: 栄光をお受けになる
  rationale: 受動形の意味を敬意ある自然な日本語で表し、聖書的な「栄光」の語を保持する。
- source_word: ὁ πατὴρ
  choice: 父
  rationale: 原文は「わたしの父」ではなく、ヨハネ福音書で神を指す称号としての「父」である。
- source_word: ἐν τῷ υἱῷ
  choice: 子において
  rationale: ἐν を手段だけに狭めず、父が栄光を受ける領域または媒介という原文の含みを保つ。
theological_decisions:
- issue: 「わたしの名によって」願うことの意味
  choice: 解釈的な説明を加えず、「わたしの名によって」とした。
  alternative: 「わたしの権威に基づいて」「わたしと一つになって」「わたしの御心にかなって」
  rationale: ヨハネ文書におけるこの句は、権威、代理、関係、意志との一致など複数の含みを持つため、本文で一つに限定しない。
- issue: ἐν τῷ υἱῷ の意味
  choice: 「子において」とした。
  alternative: 「子を通して」
  rationale: 前置詞 ἐν は、ここで領域または媒介を表し得る。原文が一義的に限定していないため、本文ではより形式対応的な表現を保ち、自然な別訳を脚注に示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「子において」は日常語よりやや改まった表現だが、原文の前置詞が持つ曖昧さと神学的な緊張を保つために採用し、脚注で自然な別訳を示した。
