  text: Μὴ ταρασσέσθω ὑμῶν ἡ καρδία· πιστεύετε εἰς τὸν θεόν, καὶ εἰς ἐμὲ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/001.yaml
  text: Do not let your heart be troubled[a]. Believe in God[b]; believe also in me.
translation:
  language: ja
  text: あなたがたは、心を騒がせてはならない。神を信じなさい[a]。わたしをも信じなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは、「あなたがたは神を信じている。わたしをも信じなさい」。ギリシア語のπιστεύετεは、直説法（「信じている」）とも命令法（「信じなさい」）とも取れる。
    reason: alternative_reading
  - marker: b
    text: 「神に信頼しなさい。わたしにも信頼しなさい」とも訳せる。この動詞は、あることを信じるだけでなく、相手に信頼を寄せる意味を持ち得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ ταρασσέσθω
  choice: 騒がせてはならない
  rationale: μήを伴う現在受動命令法三人称単数の禁止を自然な日本語で表した。「心が騒ぐ」の慣用的な結び付きを用い、単なる不安や恐怖に意味を狭めなかった。
- source_word: ὑμῶν ἡ καρδία
  choice: あなたがたは、心を
  rationale: 複数の所有者を示すὑμῶνと単数のἡ καρδίαという集合的な表現を保ちつつ、日本語として明瞭になるよう「あなたがたは」を主題として示した。
- source_word: πιστεύετε
  choice: 信じなさい
  rationale: πιστεύωの基本的な意味と、εἰςが示す対象への信頼の方向性を含み得る一般的な訳語を選んだ。直説法と命令法の形態上の曖昧さは脚注に残した。
- source_word: εἰς τὸν θεόν
  choice: 神を
  rationale: πιστεύω＋εἰςは、対象に信頼を寄せることを表す。日本語では「神を信じる」が自然であり、「神の中へ」のような過度な逐語訳を避けた。
- source_word: καὶ εἰς ἐμὲ πιστεύετε
  choice: そして、わたしをも信じなさい
  rationale: καίの追加・並列の力を「も」で表し、神を信じることとイエスを信じることの平行関係を保った。また、原文どおり動詞を繰り返した。
theological_decisions:
- issue: 二つのπιστεύετεを直説法と取るか命令法と取るか
  choice: 両方を命令法として「神を信じなさい。そして、わたしをも信じなさい」と訳した。
  alternative: 「あなたがたは神を信じている。わたしをも信じなさい」
  rationale: 二人称複数現在の直説法と命令法は同形であり、原文には真の曖昧さがある。文脈では、冒頭の禁止命令に続く慰めと勧めとして二つの命令法が自然だが、直説法の可能性も脚注で明示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「心を騒がせる」は聖書的な響きを残しながら現代日本語でも理解できる表現とした。「わたし」は話者イエスの一人称として平仮名表記を採用した。
