  text: Λέγει αὐτῷ Φίλιππος· Κύριε, δεῖξον ἡμῖν τὸν πατέρα, καὶ ἀρκεῖ ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/008.yaml
  text: Philip said to him[a], “Lord, show us the Father, and that is enough for us.”
translation:
  language: ja
  text: フィリポがイエスに言った。「主よ、私たちに父をお示しください。それで私たちには十分です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語文として自然な過去形で表した。
- source_word: αὐτῷ
  choice: イエスに
  rationale: 直訳は「彼に」だが、発話の相手を明確にするため、文脈上の指示対象であるイエスを補った。
- source_word: Φίλιππος
  choice: フィリポ
  rationale: 新約聖書の人名として一般的な日本語表記を用いた。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの呼びかけであり、敬称としての幅とヨハネ福音書におけるキリスト論的含意の双方を保つ。「先生」も語義上はあり得るが、ここでは弱すぎる。
- source_word: δεῖξον
  choice: お示しください
  rationale: 直接的な要請を、敬意を伴う自然な現代日本語で表した。「見せてください」よりも、目に見える提示と啓示の両方を含み得る。
- source_word: ἡμῖν
  choice: 私たちに
  rationale: 動詞δεῖξονに伴う与格を自然に表した。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 文脈上、神である父を指す。日本語では大文字による区別がないため、簡潔に「父」とした。
- source_word: καὶ
  choice: そうすれば
  rationale: 単純な接続の「そして」も可能だが、依頼が満たされた場合の結果を述べる自然な日本語として表した。
- source_word: ἀρκεῖ ἡμῖν
  choice: 私たちには十分です
  rationale: 「私たちにとって足りる」という現在の充足性を、簡潔で自然な日本語にした。
theological_decisions:
- issue: イエスへの呼びかけとしてのκύριος
  choice: 主よ
  alternative: 先生
  rationale: κύριοςは礼儀的な「先生」とも訳し得るが、この文脈では「主」が敬意とヨハネ福音書のキリスト論的重みを過不足なく保持する。
- issue: 「父」の指示対象
  choice: 父
  alternative: 父なる神
  rationale: 文脈から神である父を指すことは明らかだが、「父なる神」と明示すると原文にない説明を本文へ加えるため、原文どおり「父」とした。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「お示しください」により弟子からイエスへの敬意を表しつつ、全体は簡潔な対話文とした。
