  source_fidelity: 原文の否定未来（Οὐκ ἀφήσω）を「…しておかない」で適切に表し、ὀρφανούςの親を失い保護を欠く子どもという具体的な比喩も「親のない子ども」によって保たれている。「わたしはあなたがたのところに来る」はἔρχομαι πρὸς ὑμᾶςの現在形と方向性を自然に再現し、到来の時期・様態を限定していない。
