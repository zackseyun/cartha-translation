id: JHN.14.18
reference: John 14:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Οὐκ ἀφήσω ὑμᾶς ὀρφανούς, ἔρχομαι πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/018.yaml
  text: I will not leave you as orphans[b][a]; I am coming to you.
translation:
  language: ja
  text: あなたがたを親のない子どものままにはしておかない。わたしはあなたがたのところに来る。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしはあなたがたのところに来る」が、復活後に弟子たちに現れること、聖霊を通して来ること、あるいは将来の再臨のどれを指すのかは、このギリシア語表現だけでは一つに定まらない。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφήσω
  choice: しておかない
  rationale: ここでのἀφίημιは「残しておく、置き去りにする」の意。日本語では、目的格補語ὀρφανούςと合わせて「親のない子どものままにはしておかない」とするのが自然である。
- source_word: ὀρφανούς
  choice: 親のない子ども
  rationale: 親を失って保護を受けられない子どもという具体的な家族的比喩を保つ。「孤児」よりも意味が直ちに伝わり、比喩的な文脈にもなじむ。
- source_word: ἔρχομαι
  choice: 来る
  rationale: 現在形の切迫感を保ちつつ、日本語では確定した近い将来にも自然に用いられる非過去形で訳す。「戻って来る」とすると原文に明示されない意味を加えるため避けた。
- source_word: πρὸς ὑμᾶς
  choice: あなたがたのところに
  rationale: 人を目標とするπρόςの移動方向を、現代日本語で自然に表す。
- source_word: Οὐκ
  choice: 〜ない
  rationale: 未来形ἀφήσωにかかる通常の否定を、日本語の述語末の否定で表した。
theological_decisions:
- issue: 「わたしはあなたがたのところに来る」が指す出来事と時期
  choice: 本文では、復活後の顕現、聖霊を通しての到来、将来の再臨のいずれかに限定しない。
  alternative: 復活後の顕現だけ、聖霊による到来だけ、または終末の再臨だけを指すものとして訳す。
  rationale: 直近の文脈には聖霊の約束がある一方、表現そのものはイエスが弟子たちのもとへ来ることを広く示し、単一の指示対象を強制しない。原文の神学的な幅を保った。
translation_notes:
  register: 明瞭で現代的かつ品位ある常体。「親のない子ども」によって原文の具体的な家族的比喩を保ち、「来る」は簡潔な非過去形としてギリシア語現在形の近接性と曖昧さを伝える。
