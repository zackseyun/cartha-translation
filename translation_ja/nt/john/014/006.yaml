id: JHN.14.6
reference: John 14:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/006.yaml
  text: Jesus said to him[a], “I am the way, and the truth, and the life[b]. No one comes to the Father except through me.”
translation:
  language: ja
  text: イエスは彼に言われた[a]。「わたしは道であり、真理であり、命です。わたしを通してでなければ、だれも父のもとに行くことはできません[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「イエスは彼に言われる」。ギリシア語はここで物語現在形を用いている。
    reason: lexical_alternative
  - marker: b
    text: または「わたしを通してでなければ、だれも父のもとに来ません」。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語現在形だが、日本語の自然な物語叙述に合わせて過去形とした。イエスへの敬意を表す一般的な敬語表現を用いた。
- source_word: αὐτῷ
  choice: 彼に
  rationale: 発話の間接目的語を明示する与格代名詞を、そのまま自然な日本語で表した。
- source_word: Ἐγώ εἰμι
  choice: わたしは…です
  rationale: 明示された一人称代名詞の強調を主題提示の「わたしは」で保ち、後続する三つの述語に結びつけた。
- source_word: ἡ ὁδός
  choice: 道
  rationale: 文字どおりの道と、父への到達手段という比喩の両方を保てる標準的な訳語。
- source_word: ἡ ἀλήθεια
  choice: 真理
  rationale: ヨハネ文書における神学的な広がりを保ちつつ、ἀλήθειαの語義を簡潔かつ品位ある日本語で示す。
- source_word: ἡ ζωή
  choice: 命
  rationale: 肉体的生命に限定せず、ヨハネ文書における十全な命や永遠の命を含み得る広がりを保った。
- source_word: οὐδεὶς
  choice: だれも…ない
  rationale: 全称的否定を自然な日本語の呼応表現で示した。
- source_word: ἔρχεται πρὸς τὸν πατέρα
  choice: 父のもとに行くことはできません
  rationale: 直訳的な「父のもとに来る」は日本語では発話者と父との位置関係を不自然に強調し得るため、方向性を表す自然な「行く」を採用した。否定条件と合わせて可能表現にすることで、日本語として明瞭にした。
- source_word: εἰ μὴ
  choice: …でなければ
  rationale: 例外条件を表す「もし…でなければ」に近い構造を自然に保ち、「ただし」のような説明的追加を避けた。
- source_word: δι’ ἐμοῦ
  choice: わたしを通して
  rationale: 属格を伴うδιάの媒介・手段の意味を明確に保つ自然な訳語。
theological_decisions:
- issue: イエスを通してのみ父に至るという排他性
  choice: 「わたしを通してでなければ、だれも父のもとに行くことはできません」
  alternative: 「わたしによらなければ、だれも父のもとに来ません」
  rationale: 原文のοὐδεὶςとεἰ μὴが示す排他的主張を弱めず、同時にその範囲を本文以上に説明しない形で保持した。
- issue: 三つの定冠詞付き述語の並列
  choice: 「道であり、真理であり、命です」
  alternative: 「道、真理、命です」
  rationale: 各名詞をκαίで結ぶ原文の三項構造と、それぞれが独立した述語である重みを、反復する「であり」によって自然な日本語で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、荘重さを保ちながら過度に古風な文体を避けた。「父」はこの文脈で神を指す呼称として用いた。三項の並列は日本語として自然な範囲で反復を保った。
