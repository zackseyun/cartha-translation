id: JHN.14.16
reference: John 14:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κἀγὼ ἐρωτήσω τὸν πατέρα καὶ ἄλλον παράκλητον δώσει ὑμῖν ἵνα ⸀ᾖ μεθ’ ὑμῶν εἰς τὸν ⸀αἰῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/016.yaml
  text: And I will ask the Father[a], and he will give you another Advocate, so that he may be with you forever,
translation:
  language: ja
  text: そしてわたしは父に願います。父はもうひとりの弁護者[a]をあなたがたに与え、その方がいつまでもあなたがたとともにいるようにしてくださいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「助け手」「助言者」、また伝統的には「慰め主」とも訳される。ギリシア語は παράκλητος（パラクレートス）。
    reason: 重要で意味領域の広い語について、主要な別訳を示し、一つの機能だけに限定しないため。
lexical_decisions:
- source_word: κἀγὼ
  choice: そしてわたしは
  rationale: καίとἐγώの融合形。前の文とのつながりと主語の軽い強調を、自然な現代日本語で示した。
- source_word: ἐρωτήσω
  choice: 願います
  rationale: 父に対する求めを表す未来形。日本語では非過去形で将来の行為を自然に表せる。「祈ります」は、この語自体が必ずしも要求しない宗教的な定型表現を強めるため避けた。
- source_word: τὸν πατέρα
  choice: 父
  rationale: 原文には所有代名詞がないため、「わたしの父」を補わず、ヨハネ文書での呼称を保った。
- source_word: ἄλλον
  choice: もうひとりの
  rationale: すでにいる者との区別を伴う「別の、もうひとりの」という意味を示す。誰との対比かは文脈に委ね、本文では説明を加えなかった。
- source_word: παράκλητον
  choice: 弁護者
  rationale: この語が持つ援助、擁護、代表といった幅のうち、人格的かつ法廷的な含意を保ち、ヨハネ文書全体でも対応しやすい訳語とした。ただし一語では意味を尽くせないため、別訳を脚注に示した。
- source_word: δώσει ὑμῖν
  choice: あなたがたに与え
  rationale: 未来の授与と複数の受け手を明確に保った。後続の目的節につながる自然な連用形とした。
- source_word: ἵνα ᾖ
  choice: いるようにしてくださいます
  rationale: ἵναと接続法が示す目的・意図を「ように」で表した。単純な未来の断定だけに平板化しないようにした。
- source_word: μεθ’ ὑμῶν
  choice: あなたがたとともに
  rationale: μετάの共同・同伴の意味を明確に表し、「あなたがたの間に」へ限定しなかった。
- source_word: εἰς τὸν αἰῶνα
  choice: いつまでも
  rationale: ヨハネ文書における持続的な永続性を、明瞭で自然な現代日本語の慣用表現で示した。
theological_decisions:
- issue: 三位一体的文脈におけるπαράκλητοςの訳し方
  choice: 弁護者
  alternative: 助け手、助言者、伝統的には慰め主
  rationale: 「もうひとりの」という表現にふさわしい人格性と、擁護・代表する働きを保つため「弁護者」とした。一方、この語の意味を法廷的機能だけに限定せず、訳語上の長年の幅と解釈上の緊張を脚注に残した。
- issue: ἄλλονが示す関係
  choice: もうひとりの
  alternative: 同じ種類のもうひとりの
  rationale: 原文は「別の者」を示すが、「同じ種類の」という神学的説明までは明示していない。その関係は文脈から理解されるべきものとして、本文に解釈を加えなかった。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。イエスの一人称は「わたし」、弟子たちへの複数呼称は「あなたがた」とした。「その方」によりπαράκλητοςの人格性を自然に示しつつ、本文を教義的な説明へ展開しすぎないようにした。
