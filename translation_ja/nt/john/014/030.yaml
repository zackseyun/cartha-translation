id: JHN.14.30
reference: John 14:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν, ἔρχεται γὰρ ὁ τοῦ κόσμου ἄρχων· καὶ ἐν ἐμοὶ οὐκ ἔχει οὐδέν,
base_translation:
  language: en
  yaml_path: translation/nt/john/014/030.yaml
  text: I will no longer speak much with you[a], for the ruler of the world is coming[b]. And he has nothing in me.
translation:
  language: ja
  text: もうこれ以上、あなたがたと多くを語ることはしません。世の支配者[a]が来るからです。そして、彼はわたしのうちに何も持っていません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この世の支配者」と訳すこともできます。ヨハネ福音書の類似表現に沿って「この」を補う訳もありますが、ここで原文は単に「世の」としています。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼はわたしのうちに何も持っていません」。意味としては、「彼にはわたしに対する何の権利もない」または「彼はわたしを支配するための何の足がかりも持たない」とも理解できます。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκέτι πολλὰ λαλήσω μεθ’ ὑμῶν
  choice: もう、あなたがたと多くは話しません
  rationale: οὐκέτιの時間的な意味を「もう……ません」で表し、πολλὰの副詞的用法を「多くは」とした。μεθ’ ὑμῶνは弟子たちとの会話を指すため「あなたがたと」と訳した。
- source_word: ἔρχεται
  choice: 来る
  rationale: 文脈上、間近に迫る出来事を示す現在形。日本語では簡潔な現在形「来る」が自然に切迫感を伝える。
- source_word: ὁ τοῦ κόσμου ἄρχων
  choice: 世の支配者
  rationale: ἄρχωνを現代語として明確な「支配者」とし、本文にない指示語「この」を補わず、κόσμοςを「世」とした。
- source_word: καί
  choice: しかし
  rationale: 形式上は接続詞「そして」だが、来つつある支配者と、イエスに対して何も持たないこととの対照を日本語で明確かつ自然に示した。
- source_word: ἐν ἐμοὶ οὐκ ἔχει οὐδέν
  choice: 彼はわたしのうちに何も持っていません
  rationale: 原文の簡潔で含みのある表現を保ち、「何の権利もない」「何の力も及ぼせない」など一つの解釈に限定しなかった。
theological_decisions:
- issue: 「世の支配者」の指示対象
  choice: 称号をそのまま「世の支配者」と訳す
  alternative: 本文で「サタン」と明示する
  rationale: ヨハネ福音書の文脈ではサタンを指すと理解されるが、原文は固有名ではなく称号を用いているため、その推論を本文に書き込まない。
- issue: 「わたしのうちに何も持っていない」の意味
  choice: 原文に近い表現を本文に残す
  alternative: 「わたしに対して何の権利もない」「わたしを支配する何の足掛かりもない」
  rationale: この句は、正当な要求権、支配の足掛かり、共有するものなどを含意し得る。神学的な含みを一つに狭めず、解釈候補は脚注に示した。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「わたし」「あなたがた」を用い、イエスの落ち着いた語調を保った。原文の最後の句が持つ意図的な曖昧さは本文で保持し、自然な意味の候補を脚注に示した。
