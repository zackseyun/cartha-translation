  text: καὶ νῦν εἴρηκα ὑμῖν πρὶν γενέσθαι, ἵνα ὅταν γένηται πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/029.yaml
  text: And now I have told you before it happens[c][b][a], so that when it happens you may believe.
translation:
  language: ja
  text: そして今、私は、それが起こる前にあなたがたに告げておきました。それが起こる時、あなたがたが信じるためです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信じる」は「信頼する」とも訳せる。ここでのギリシア語は、信仰の始まりを指すのか、すでにある信仰が強められることを指すのかを明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ νῦν
  choice: そして今
  rationale: καίによる前文とのつながりと、νῦνの時間的意味をともに保つ、自然な現代日本語。
- source_word: εἴρηκα ὑμῖν
  choice: 私は…あなたがたに話しました
  rationale: 完了形が示す、すでになされた発言とその現在的な効力を文脈上自然に表す。「言いました」も可能だが、予告を伝えた意味合いに「話しました」が合う。
- source_word: πρὶν γενέσθαι
  choice: それが起こる前に
  rationale: 暗黙の出来事を「それ」で補い、πρίνと不定詞の時間関係を明確にする。後半のγίνομαιと同じ「起こる」を用いて反復を保つ。
- source_word: ἵνα
  choice: …ためです
  rationale: 目的を示すἵναの力を明確かつ自然に表す。
- source_word: ὅταν γένηται
  choice: それが起こる時
  rationale: 将来の出来事を指すὅταν＋接続法を表し、前半と同じ「起こる」を用いて原文の反復を保つ。
- source_word: πιστεύσητε
  choice: あなたがたが信じるようになる
  rationale: ヨハネ文書で標準的な「信じる」を採用する。ἵνα節内の接続法は目的として表し、信仰の開始か強化かを本文で限定しない。
theological_decisions:
- issue: πιστεύσητεが信仰の開始を指すか、既存の信仰の強化・継続を指すか
  choice: 信じるようになる
  alternative: 信じ続けるようになる／信頼するようになる
  rationale: ギリシア語自体は開始か継続かを明示しないため、「信じ続ける」と限定しない。「信じるようになる」は目的を自然に示しつつ、文脈上の信仰の確証・深化も排除しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。γίνομαιの反復は「起こる」で再現し、原文にない神学的限定を避けた。
