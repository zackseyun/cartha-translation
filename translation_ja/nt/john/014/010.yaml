id: JHN.14.10
reference: John 14:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ πιστεύεις ὅτι ἐγὼ ἐν τῷ πατρὶ καὶ ὁ πατὴρ ἐν ἐμοί ἐστιν; τὰ ῥήματα ἃ ἐγὼ ⸀λέγω ὑμῖν ἀπ’ ἐμαυτοῦ οὐ λαλῶ, ὁ δὲ ⸀πατὴρ ἐν ἐμοὶ ⸀μένων ποιεῖ τὰ ἔργα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/014/010.yaml
  text: Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak from myself[b][a], but the Father who remains in me does his works.
translation:
  language: ja
  text: わたしが父のうちにおり、父がわたしのうちにおられることを、あなたは信じないのですか。わたしがあなたがたに言う言葉を、わたしは自分から[a]語っているのではありません。むしろ、わたしのうちにとどまっておられる[b]父が、ご自分のわざを行っておられるのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分だけで」または「自分の権威によって」。原文は、言葉の源、主導、権威を含み得ます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「住んでおられる」。ここで「とどまる」は、継続して内にいることを表します。
    reason: lexical_alternative
lexical_decisions:
- source_word: πιστεύεις
  choice: 信じる
  rationale: ヨハネ福音書で繰り返される πιστεύω との語彙的なつながりを保つため、標準的な「信じる」とした。動詞は単数形なので、最初の問いかけは「あなた」とした。
- source_word: ἐν τῷ πατρὶ ... ἐν ἐμοί
  choice: 父のうちに……わたしのうちに
  rationale: 相互内在を表す ἐν をそのまま保ち、「一つである」などの解釈的な言い換えを避けた。「中」よりも人格的・関係的文脈になじむ「うち」を用いた。
- source_word: ῥήματα
  choice: 言葉
  rationale: 発言内容を自然かつ直接的に表し、ヨハネ文書の語彙にも適した一般的な訳語である。
- source_word: λέγω
  choice: 言う
  rationale: 後続の λαλῶ「語る」と穏やかに訳し分けながら、内容を告げる行為を自然な日本語で示す。
- source_word: ἀπ’ ἐμαυτοῦ
  choice: 自分から
  rationale: 発言の源、主導、権威のいずれをも含み得る原文の幅を保つ。「自分の考えで」や「自分の権威によって」ほど意味を限定しない。
- source_word: λαλῶ
  choice: 語る
  rationale: 先行する λέγω「言う」との語の違いを、不自然にならない範囲で反映した。
- source_word: μένων
  choice: とどまっておられる
  rationale: 継続的な内在を示す μένω のニュアンスと、ヨハネ福音書における反復語彙とのつながりを保つ。
- source_word: ποιεῖ
  choice: 行っておられる
  rationale: 主語である父への敬意を自然に表しつつ、「わざ」を目的語とする動作を明確にした。
- source_word: τὰ ἔργα αὐτοῦ
  choice: ご自分のわざ
  rationale: αὐτοῦ の所有関係を明示し、「わざ」によってヨハネ福音書の神学的な「働き／業」の語彙を簡潔に保った。
theological_decisions:
- issue: 父と子の相互内在
  choice: 「わたしが父のうちにおり、父がわたしのうちにおられる」と訳す。
  alternative: 「わたしと父は一つである」「わたしは父と結ばれ、父もわたしと結ばれている」
  rationale: この箇所固有の相互内在の表現を保持し、他のヨハネ的表現や後代の教理用語で置き換えないため。
- issue: イエスの言葉と父のわざにおける主体性
  choice: 「自分から語っているのではありません」「父が、ご自分のわざを行っておられる」と訳す。
  alternative: 「自分の権威で語るのではない」「父がわたしを通してわざを行う」
  rationale: 父と子の区別、および宣教における一致と関係性を原文どおり保ち、「単なる代理人」あるいは「同一の人格」といった方向へ意味を解消しないため。
translation_notes:
  register: 明瞭な現代標準語の丁寧体を用いた。イエスの問いでは単数形 πιστεύεις を「あなた」、続く ὑμῖν は複数形なので「あなたがた」と訳し分けた。「うちに」「とどまる」「わざ」によってヨハネ的な語彙と神学的緊張を保ちつつ、過度に古風な表現は避けた。
