reference: John 21:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: ja
  text: イエスがなさったことは、このほかにも数多くある。それらが一つ一つ書き記されるなら、書き記される書物を収めるだけの余地は、この世界そのものにもない[a]だろうと、私は思う。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この世界そのものも、書き記される書物を収めきれないだろう」とも訳せる。ギリシア語の動詞には、「場所・余地がある」と「収容する」の両方の意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ
  choice: このほかにも数多くある
  rationale: δὲの穏やかな継続とκαίの「も」、ἄλλα πολλὰの追加性と多数性を、自然な現代日本語で表した。
- source_word: ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: イエスがなさったこと
  rationale: ποιέωを行為全般を指す「なさった」とし、敬意を保ちつつ平明に訳した。
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: それらを一つ一つ書き記すなら
  rationale: 仮定を表すἐάν＋接続法と、καθ’ ἕνの逐一的な意味を保持した。受動形は、日本語として自然な一般主体の能動表現にした。
- source_word: οὐδ’ αὐτὸν ... τὸν κόσμον
  choice: この世界そのものにもない
  rationale: οὐδέの「〜さえない」と、強意的なαὐτόνを「世界そのもの」で示した。
- source_word: οἶμαι
  choice: 私は思う
  rationale: 語り手自身の判断を示す挿入句を省かず、自然で格調ある表現にした。
- source_word: χωρήσειν
  choice: 収める余地は……ないだろう
  rationale: 「場所がある」と「収容する」の両義性をある程度保ち、空間的な誇張表現を明確にした。
- source_word: τὰ γραφόμενα βιβλία
  choice: 書かれる書物
  rationale: 現在受動分詞を簡潔に反映し、仮定の結果として書かれる書物を指す文脈を保った。
theological_decisions:
- issue: 世界にも書物を収めきれないという修辞的誇張
  choice: 世界そのものにも収める余地がないという像を保持する
  alternative: 「数えきれないほどの本になる」などの意訳
  rationale: 福音書末尾の強い修辞的証言を弱めず、同時に文字どおりか比喩かを訳文で決めつけないため。
translation_notes:
  register: 明瞭な現代標準日本語。福音書の結語にふさわしい品位を保ちながら、過度に文語的な表現は避けた。
