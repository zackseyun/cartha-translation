  text: λέγει αὐτοῖς Σίμων Πέτρος· Ὑπάγω ἁλιεύειν· λέγουσιν αὐτῷ· Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί. ἐξῆλθον καὶ ἐνέβησαν εἰς τὸ ⸀πλοῖον, καὶ ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: ja
  text: シモン・ペトロが彼らに言った[a]。「私は漁に行く。」彼らは彼に言った。「私たちもあなたと一緒に行きます。」彼らは出て行き、舟に乗り込んだ。その夜、彼らは何も捕れなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では物語的現在形で、「シモン・ペトロが彼らに言う……彼らは彼に言う」となっている。これは物語でよく用いられる表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει ... λέγουσιν
  choice: 言った……言った
  rationale: ギリシア語は物語的現在形だが、現代日本語の自然な物語叙述に合わせて過去形とし、注で原文の形を示した。二度目は主語と間接目的語が文脈上明らかなため、自然な日本語として簡潔にした。
- source_word: Ὑπάγω ἁλιεύειν
  choice: 私は漁に行く
  rationale: 移動を表すὙπάγωと目的を表すἁλιεύεινを、簡潔で自然な日本語にした。
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: 私たちも一緒に行こう
  rationale: καὶ ἡμεῖςの強調を「私たちも」、σὺν σοίを「一緒に」で表した。日本語ではペトロに同行する意思として「行こう」が自然である。
- source_word: ἐξῆλθον
  choice: 出て行って
  rationale: 外へ出るという移動を保ちつつ、後続する乗船動作へ自然につないだ。
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: 舟に乗り込んだ
  rationale: 漁の場面に適するπλοῖονを「舟」とし、乗船を自然に「乗り込んだ」と表した。
- source_word: ἐν ἐκείνῃ τῇ νυκτί
  choice: その夜は
  rationale: 時間を示す与格句を自然な日本語にし、後続する全否定との対照を「は」で表した。
- source_word: ἐπίασαν οὐδέν
  choice: 何も捕れなかった
  rationale: 漁の文脈でπιάζωを「捕る」と理解し、οὐδένの全面的否定を日本語の「何も……なかった」で表した。
