  text: τοῦτον ⸀οὖν ἰδὼν ὁ Πέτρος λέγει τῷ Ἰησοῦ· Κύριε, οὗτος δὲ τί;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/021.yaml
  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: ja
  text: そこで、ペトロは彼を見て、イエスに言った。「主よ、この人はどうなのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον … ἰδών
  choice: 彼を見て
  rationale: 指示代名詞は直前の文脈にいる弟子を指すため、自然な日本語の代名詞で表した。分詞は主動詞に先立つ動作として訳した。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、現代日本語の物語として自然な過去形を用いた。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの直接の呼びかけであり、κύριος の敬意と神学的含意を保つ定訳を採用した。
- source_word: οὗτος δὲ τί;
  choice: この人はどうなのですか
  rationale: 省略を含む口語的な問いを、不必要に内容を補わず自然な日本語で表した。δέ の対比・話題転換は係助詞「は」に反映した。
theological_decisions:
- issue: ペトロの問いが具体的に何を尋ねているか
  choice: 「この人はどうなのですか」と曖昧さを保持した
  alternative: 「この人には何が起こるのですか」または「この人はどうすればよいのですか」
  rationale: 原文 οὗτος δὲ τί; は述語が省略されており、直後のイエスの応答から将来についての問いと推測できるものの、本文自体は明示していないため。
translation_notes:
  register: 明瞭で現代的な標準日本語。会話は丁寧さを保ちつつ簡潔にし、原文の省略による含みを残した。
