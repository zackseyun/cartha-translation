  text: λέγει οὖν αὐτοῖς ⸀ὁ Ἰησοῦς· Παιδία, μή τι προσφάγιον ἔχετε; ἀπεκρίθησαν αὐτῷ· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/005.yaml
  text: So Jesus said to them[a], “Children, you do not have any fish, do you?” They answered him, “No.”
translation:
  language: ja
  text: そこでイエスは彼らに言った。「子どもたち、何か食べる物[a]はないのか。」彼らは「ありません」と答えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「魚」。ギリシア語は、より厳密にはパンと一緒に食べる物を指す。この漁の場面では、魚を意味すると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の物語を受けて展開を進める接続詞として、因果を強調しすぎない自然な日本語にした。
- source_word: Παιδία
  choice: 子どもたち
  rationale: παιδίον の呼格複数を直接的に訳し、親しみを帯びた呼びかけを保った。「皆さん」では親愛の含みが薄れ、「若者たち」では年齢を限定しすぎる。
- source_word: μή τι
  choice: 何もないのか
  rationale: μή を伴う疑問が否定の答えを予期する含みを、日本語の否定疑問で表した。
- source_word: προσφάγιον
  choice: 食べる魚
  rationale: 本来はパンと一緒に食べる副食を指す語だが、漁の文脈では魚を指す可能性が高い。「食べる」を添えて食用のものという語義を保ち、別訳を脚注に示した。
- source_word: ἔχετε
  choice: ないのか
  rationale: 所有を表す現在形を、否定を予期する疑問文の中で自然な日本語にした。
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: 彼らは…と答えた
  rationale: 標準的な応答表現として、簡潔で格調を損なわない語順にした。
- source_word: Οὔ
  choice: ありません
  rationale: 簡潔な否定応答を保ちつつ、岸にいる呼びかけ手への返答として自然な丁寧体を用いた。
theological_decisions: []
