source:
  edition: SBLGNT
  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: ja
  text: ほかの弟子たちは小舟で来た。岸から遠くなく、約二百ペキュス[a]しか離れていなかったので、魚の入った網[b]を引いて来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 二百ペキュスは、およそ九十メートル。
    reason: cultural_note
  - marker: b
    text: 直訳すると「魚の網」。ここでは、魚の入った網を意味すると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: ほかの弟子たちは
  rationale: δέは直前のペテロの行動との対照を示すが、日本語では主題の切り替え自体で対照が明確なため、機械的に「しかし」を加えず自然に表した。
- source_word: τῷ πλοιαρίῳ
  choice: 小舟で
  rationale: πλοιάριονの小ささのニュアンスを保ちつつ、手段・乗り物を示す与格を自然な日本語で表した。
- source_word: ἦλθον
  choice: やって来た
  rationale: 物語の視点に即してἔρχομαιのアオリストを自然に訳した。
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: 陸から遠くなく
  rationale: γάρの理由説明は後続の「ので」で明示し、γῆは水上との対比を保つ「陸」とした。
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: 二百ペキュスほど、すなわち約九十メートルしか離れていなかった
  rationale: ὡςの概数を「ほど」で表し、古代単位を保持しながら現代の読者に距離が分かるよう換算値を併記した。「しか」は「遠くなく、むしろ約二百ペキュス」という対比を自然に伝える。
- source_word: σύροντες
  choice: 引いて来た
  rationale: 到来と同時進行する分詞であり、網を水中で引く動作を自然な日本語で表した。
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: 魚の入った網
  rationale: 属格は内容を示すと理解でき、「魚でいっぱい」とまでは明示せず、魚を収めた網という文脈上の意味を自然に表した。
