source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: ja
  text: さて、彼らが陸に上がると[a]、彼らは炭火[b]があり、その上に魚が載っており、パンもあるのを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「岸に上がると」。ギリシア語は直訳的には「陸へ出ると」。
    reason: lexical_alternative
  - marker: b
    text: 「炭火」に当たるギリシア語は、ペトロがイエスを否認した場面を描くヨハネ18章18節でも使われている。
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: さて、……と
  rationale: ὡςの時を示す働きと、οὖνの物語をつなぐ働きを、自然な現代日本語の叙述として表した。
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: 彼らが陸に上がる
  rationale: 舟から出て陸へ移る動作を表す。自然な日本語を保ちながら、γῆを特定の「岸」と狭めず「陸」とした。
- source_word: βλέπουσιν
  choice: そこには……あった
  rationale: 歴史的現在を日本語の自然な過去叙述で表現し、目に入った光景を「そこには」で提示した。
- source_word: ἀνθρακιὰν κειμένην
  choice: 炭火があり
  rationale: ἀνθρακιάを明瞭な「炭火」とし、κειμένηνの存在・設置の状態を日本語では自然な「あり」で表した。
- source_word: ὀψάριον ἐπικείμενον
  choice: その上に魚が載せてあり
  rationale: 魚が炭火の上に置かれていた関係を明示した。ὀψάριονは単数形だが食物として集合的にも理解できるため、数を限定しない「魚」とした。
- source_word: ἄρτον
  choice: パンもあった
  rationale: ἄρτοςを過度に「一個のパン」や「パン一つ」と限定せず、無標の「パン」とした。καίは並列する別の品を自然に示す「も」で表した。
theological_decisions:
- issue: 歴史的現在 βλέπουσιν の扱い
  choice: 自然な日本語の過去叙述として「そこには……あった」とする
  alternative: 臨場感を優先して「彼らは……見る」と現在形を保つ
  rationale: この現在形は物語上の歴史的現在であり、時制上の神学的主張ではない。現代日本語の読みやすさを優先して出来事の叙述を過去として表した。
- issue: ἀνθρακιὰν によるヨハネ18章18節との語彙的連関
  choice: 両箇所で対応可能な「炭火」と訳す
  alternative: 「燃えている炭」「炭のおき火」などと訳す
  rationale: 原文にある語彙上の連関を保つ一方、その連関が持つ神学的意味を本文で説明して確定することは避けた。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、聖書本文にふさわしい落ち着いた叙述調を採用した。「陸」「炭火」「魚」「パン」という原文の具体語を保持し、本文にない調理済みなどの情報は加えていない。
