  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐνέγκατε ἀπὸ τῶν ὀψαρίων ὧν ἐπιάσατε νῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/010.yaml
  text: Jesus said to them[a], “Bring some of the fish that you have now caught.”
translation:
  language: ja
  text: イエスは彼らに言われた。「今捕った魚を何匹か持って来なさい。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「あなたがたが今捕った魚の中から持って来なさい」。
    reason: 「何匹か」は、ἀπόと属格が示す部分の意味を自然な日本語にしたもの。
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: 物語中の歴史的現在だが、日本語の自然な物語時制として過去形にした。イエスの発言には、明快で品位ある敬語表現を用いた。
- source_word: Ἐνέγκατε
  choice: 持って来なさい
  rationale: φέρωのアオリスト命令法・二人称複数。話し手のいる所へ運ぶ直接的な命令を自然な日本語で表した。
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: 魚を何匹か
  rationale: ἀπόと属格による部分の意味を、捕獲した魚全体のうちの一部を求める自然な日本語で表した。
- source_word: ὀψαρίων
  choice: 魚
  rationale: 文脈は今しがた海で捕った魚を指すため、大きさや調理済みであることを限定せず「魚」とした。
- source_word: ὧν ἐπιάσατε
  choice: 捕った魚
  rationale: 関係節を日本語の連体修飾にし、弟子たちが捕獲した魚であることを明確にした。
- source_word: νῦν
  choice: 今
  rationale: 直前の捕獲を指す時間表現を、原語に即して簡潔に「今」とした。
