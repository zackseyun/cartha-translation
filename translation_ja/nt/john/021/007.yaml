id: JHN.21.7
reference: John 21:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: ja
  text: そこで、イエスが愛しておられたあの弟子がペトロに言った。「主だ。」シモン・ペトロは、主だと聞くと、上着を体に巻きつけた。軽装だったからである[a]。そして、海に身を投じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「裸だった」。ギリシア語は、文字どおり裸であることも、十分な衣服を身に着けていないことも表し得る。
    reason: γυμνόςの語義上の別解を示し、原文の曖昧さを保持するため。
lexical_decisions:
- source_word: λέγει οὖν
  choice: そこで……言った
  rationale: οὖνが示す物語上の進展と、直前の出来事を受けた推論の両方を、自然な現代日本語で表す。
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: イエスが愛しておられたあの弟子
  rationale: ἐκεῖνοςの指示性を「あの」で保ち、ヨハネ福音書に特徴的な呼称を自然に訳した。
- source_word: Ὁ κύριός ἐστιν
  choice: 主だ
  rationale: κύριοςを「主」とし、人物を見分けた際の日本語として簡潔で自然な断定にした。
- source_word: ἀκούσας ὅτι ὁ κύριός ἐστιν
  choice: 主だと聞くと
  rationale: アオリスト分詞の時間的・契機的関係を「聞くと」で自然に表した。
- source_word: τὸν ἐπενδύτην διεζώσατο
  choice: 上着を体に巻きつけた
  rationale: ἐπενδύτηςを特定の衣服名に狭めず「上着」とし、διαζώννυμι中動態が示す、身に巻いて留める動作を表した。
- source_word: ἦν γὰρ γυμνός
  choice: 身に着けているものが少なかったからである
  rationale: γυμνόςが「裸」と「十分に衣服を着けていない」の双方を取り得るため、漁の場面に合う後者を本文に置きつつ、前者を脚注に残した。
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: 湖に身を投じた
  rationale: βάλλωの勢いを「身を投じた」で保つ。この場のθάλασσαはガリラヤ湖を指すため、現代日本語の地理的呼称として「湖」とした。
theological_decisions:
- issue: 復活したイエスを認める場面でのκύριος
  choice: 主
  alternative: 先生／主人
  rationale: 一般的な敬称としての響きとキリスト論的な重みの双方を保持し、どちらか一方に説明的に限定しない。
- issue: ペトロの状態を表すγυμνός
  choice: 身に着けているものが少なかった
  alternative: 裸だった
  rationale: 語の意味範囲と漁労の文脈を踏まえて本文では軽装の意味を採り、文字どおりの可能性を脚注で明示して曖昧さを保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。会話は簡潔にし、叙述では原文の展開と動作の勢いを保った。固有名は「ペトロ」とした。
