  to: イエスは彼に言われた。「もしわたしが、来るまで[b]彼にとどまっていてほしいと望むなら[a]、それがあなたに何の関係があるのか。あなたはわたしに従いなさい。」
  rationale: 単純条件であるἐὰνを「もし…なら」と訳し、θέλω＋αὐτὸν μένεινを「彼にとどまっていてほしいと望む」と自然に構成し直した。「とどまる」と「来る」は解釈的に限定せず保持した。脚注a・bはそれぞれ該当する語句に直接配置した。
