id: JHN.21.22
reference: John 21:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: ja
  text: イエスは彼に言われた。「もしわたしが、来るまで[b]彼にとどまっていてほしいと望むなら[a]、それがあなたに何の関係があるのか。あなたはわたしに従いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしがそう意志するなら」とも訳せる。ギリシア語の動詞は、願望にも意志にも用いられる。
    reason: lexical_alternative
  - marker: b
    text: 「わたしが来るまで」が何を指すかは、本文では特定されていない。歴史上の出来事におけるイエスの到来と見る解釈も、終わりの日の到来と見る解釈もある。
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: イエスは彼に言われた
  rationale: 歴史的現在を自然な日本語の物語時制で表し、イエスの発言であることを明確にした。
- source_word: Ἐὰν ... θέλω
  choice: わたしが望むとしても
  rationale: 条件文の仮定性とθέλωの意志・願望の幅を保ちつつ、現代日本語として自然にした。
- source_word: αὐτὸν ... μένειν
  choice: 彼にとどまっていてほしい
  rationale: 使役的な逐語表現を避けながら、μένωを「生き続ける」と限定せず、ヨハネ文書に特徴的な「とどまる」の語感を残した。
- source_word: ἕως ἔρχομαι
  choice: わたしが来るまで
  rationale: 「来る」が指す出来事を特定せず、原文の開放性を保持した。
- source_word: τί πρὸς σέ;
  choice: それがあなたに何の関係があるのか
  rationale: 相手の関与を退ける慣用句の直接性を、明瞭で自然な日本語で表した。
- source_word: σύ μοι ἀκολούθει
  choice: あなたは、わたしに従いなさい
  rationale: 明示されたσύの対照的な強調を「あなたは」で示し、現在命令形は文脈上継続性を含み得るが、過剰に説明せず自然な命令として訳した。
theological_decisions:
- issue: ἕως ἔρχομαιにおけるイエスの「来る」の意味
  choice: 「わたしが来るまで」と一般的に訳し、指示対象を特定しない
  alternative: 復活後の顕現、歴史的な裁きにおける到来、または終末の再臨を明示する
  rationale: この節自体は何を指すか定義しておらず、特定の終末論的解釈を本文に持ち込まないため。
- issue: 弟子が「とどまる」ことの意味
  choice: 「とどまっていて」と訳す
  alternative: 「生きている」「死なない」と解釈して訳す
  rationale: 直後の23節が、イエスはその弟子が死なないと言ったのではないと説明するため、本節でも生命の存続に意味を限定しない。
translation_notes:
  register: 明瞭で現代的ながら、イエスの発言にふさわしい簡潔で dignified な調子とした。「あなたは」に読点を置き、「彼」との対照を自然に際立たせた。すべての脚注標識を本文に配置した。
