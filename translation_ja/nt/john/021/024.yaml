  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: ja
  text: この人が、これらのことについて証言しており、これらのことを書いた弟子です。[a] 私たちは、彼の証言が真実であることを知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「証言しており」と「証言」には、ギリシア語で同じ語根の語が用いられています。
    reason: lexical_connection
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ μαθητὴς
  choice: この人こそ…弟子です
  rationale: 直前に言及された弟子を指し示して特定する構文。自然な現代日本語で、その同定と強調の働きを保つ。
- source_word: ὁ μαρτυρῶν περὶ τούτων
  choice: これらのことについて証言し
  rationale: 現在分詞の継続的・特徴的な働きを、文脈上自然な連用形で表す。「証言」は後半の「その証言」と同根語の連関を明瞭に保つ。
- source_word: ὁ γράψας ταῦτα
  choice: これらのことを書いた
  rationale: アオリスト分詞が示す執筆という完了した行為を、自然な関係節相当の表現で訳す。
- source_word: οἴδαμεν
  choice: 私たちは…知っています
  rationale: 現在の認識を表す第一人称複数をそのまま訳し、その話者が誰かは特定しない。
- source_word: ἀληθὴς αὐτοῦ ἡ μαρτυρία ἐστίν
  choice: その証言が真実である
  rationale: ἀληθήςを直接的に「真実」とし、属格代名詞は日本語で自然な「その」によって当該弟子を指す。
theological_decisions:
- issue: 「私たちは」（οἴδαμεν）の話者の同定
  choice: 第一人称複数を「私たちは」と明示し、話者を特定しない
  alternative: 福音書記者の編集上の複数、または愛された弟子の証言を保証する共同体と解する
  rationale: 原文は複数の話者を示すが、その正体を明示していないため、著者問題や共同体仮説を訳文で解決しない。
- issue: 証言する弟子と執筆者の関係
  choice: 同一の「弟子」に二つの分詞句をかける
  alternative: 証言者と執筆者を別人であるかのように読ませる
  rationale: 二つの冠詞付き分詞は同じ「弟子」を修飾するのが素直であり、原文の統語構造を保つ。
translation_notes:
  register: 明快で現代的ながら、聖書本文としての品位を保つ。「この人こそ」で指示と同定の力を表し、「証言し／証言」によって原文の同根語の反復を自然に再現した。
