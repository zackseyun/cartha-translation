  text: τοῦτο ἤδη τρίτον ἐφανερώθη ⸀ὁ Ἰησοῦς τοῖς ⸀μαθηταῖς ἐγερθεὶς ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/014.yaml
  text: This was now the third time Jesus was revealed to the disciples after he had been raised from the dead[a].
translation:
  language: ja
  text: イエスが死者の中からよみがえられた後、弟子たちにご自身を現されたのは、これで三度目であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスが死者の中からよみがえられた後、弟子たちに現れたのは、これで三度目であった。」
    reason: ἐφανερώθηは受動形で、文脈上「現れた」とも自然に訳せるため。
lexical_decisions:
- source_word: τοῦτο
  choice: これは
  rationale: 直前に語られた顕現の出来事を指す指示語として、自然な日本語にした。
- source_word: ἤδη τρίτον
  choice: 三度目のことであった
  rationale: ἤδηは回数がこの時点で三度に達したことを示す。日本語では「三度目のことであった」にその語用的意味を自然に含めた。
- source_word: ἐφανερώθη
  choice: ご自身を現された
  rationale: 受動形の字義は「現された」だが、日本語でイエスを主語として不自然にならないよう再帰表現にした。ヨハネ文書に特徴的な「現す」という語感を保つ。
- source_word: τοῖς μαθηταῖς
  choice: 弟子たちに
  rationale: 原文には所有代名詞がないため、「ご自分の弟子たち」と補わずに訳した。
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: 死者の中からよみがえらされた後
  rationale: 分詞の主動詞に先立つ時間関係と受動態を保った。「死者の中から」はἐκ νεκρῶνの像を明確に伝える。
theological_decisions:
- issue: ἐγερθεὶς ἐκ νεκρῶνの復活表現
  choice: 死者の中からよみがえらされた後
  alternative: 死者の中からよみがえった後
  rationale: 原文のアオリスト受動分詞を保ち、能動的・自動詞的表現へ置き換えなかった。行為者は原文同様に明示しない。
- issue: ἐφανερώθηの態と意味
  choice: ご自身を現された
  alternative: 現れた
  rationale: 単なる出現とも訳せるが、「現す／明らかにする」というφανερόωの語感を本文に残した。日本語の再帰的敬語表現により、原文の受動形を機械的に再現するより自然さを優先した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「ご自身を現された」は敬意を保ちながら、φανερόωの顕現・啓示的な語感を伝える。
