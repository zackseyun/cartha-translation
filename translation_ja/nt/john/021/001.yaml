  text: Μετὰ ταῦτα ἐφανέρωσεν ἑαυτὸν πάλιν ⸀ὁ Ἰησοῦς τοῖς μαθηταῖς ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος· ἐφανέρωσεν δὲ οὕτως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: ja
  text: これらのことの後、イエスはティベリアス湖のほとりで、弟子たちに再びご自分を現された[a]。そして、このようにご自分を現された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ご自分を明らかにされた」。ギリシア語の動詞は、見えるようにすること、または知られるようにすることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: これらのことの後
  rationale: 複数形の指示語を保ち、ヨハネの物語に見られる時間的な移行を簡潔に表す。
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: ご自分を現された
  rationale: 再帰的な表現と、見えるようになること・ご自分を明らかにすることの両面を自然な日本語で保つ。
- source_word: πάλιν
  choice: 再び
  rationale: それ以前の復活後の顕現に続く反復を明確に示す。
- source_word: τοῖς μαθηταῖς
  choice: 弟子たちに
  rationale: 原文に明示されていない所有表現を補わずに訳す。
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: ティベリアス湖のほとりで
  rationale: 場所を示すἐπί＋属格を自然に表し、日本語で一般的な地理的呼称として「湖」を用いる。
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: その現れ方はこうであった
  rationale: 同じ動詞の意味を名詞的に受けて文学的な反復を保ちつつ、続く出来事の導入として自然な日本語にする。
theological_decisions:
- issue: 復活したイエスの顕現を表す語
  choice: ご自分を現された
  alternative: 現れた／ご自分を明らかにされた
  rationale: 単なる視覚的出現だけに限定せず、イエスご自身による自己顕示という原語の含みを保つ。同時に、実際の復活後の出会いであることも自然に伝える。
translation_notes:
  register: 明瞭で格調のある現代標準語。「ご自分」「現された」によりイエスへの自然な敬意を示しつつ、過度に古風な表現は避けた。
