  to: そこで、「あの弟子は死なない」という話が兄弟たちの間に広まった[a][b]。しかし、イエスがペトロに「あの弟子は死なない」と言われたのではない。そうではなく、「わたしが来るまで、彼がとどまり続けることをわたしが望むなら、それがあなたに何の関係があるのか」と言われたのである[c]。
