id: JHN.21.23
reference: John 21:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: ja
  text: そこで、「あの弟子は死なない」という話が兄弟たちの間に広まった[a][b]。しかし、イエスがペトロに「あの弟子は死なない」と言われたのではない。そうではなく、「わたしが来るまで、彼がとどまり続けることをわたしが望むなら、それがあなたに何の関係があるのか」と言われたのである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この言葉が兄弟たちの間に広まった」とも訳せる。ギリシア語のλόγοςは、「言葉」「発言」「話」などを意味する。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は、ここでは弟子たちの共同体を指す。ギリシア語は男性複数形ἀδελφοίを用いている。
    reason: cultural_note
  - marker: c
    text: イエスは、この弟子が決して死なないと約束されたのではない。「わたしが来るまで彼がとどまり続けることを、わたしが望むなら」という仮定の形で語られた。
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: 広まった
  rationale: 話や情報が共同体の中へ出て行くという文脈上の意味を、現代日本語で自然に表す。
- source_word: οὗτος ὁ λόγος
  choice: この話
  rationale: λόγοςの「言葉・発言・話」という幅を保ちつつ、ここでは流布した内容を指すため「話」とした。「うわさ」ほど否定的な評価を訳文に加えない。
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: 兄弟たちの間に
  rationale: εἰςはここでは情報が共同体内に広がった到達範囲を示す。ἀδελφοίの男性複数形を本文では「兄弟たち」とし、指示範囲は注で説明する。
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: あの弟子
  rationale: ἐκεῖνοςの指示性を保ち、直前から話題となっている特定の弟子を示す。
- source_word: οὐκ ἀποθνῄσκει
  choice: 死なない
  rationale: 流布した話の内容を日本語の直接的な引用形式で表し、ギリシア語現在形の簡潔さを保つ。
- source_word: οὐκ εἶπεν δὲ
  choice: しかし…言われたのではなく
  rationale: δέが示す対照と、著者による誤解の訂正を明確に表す。敬意を示すためイエスの動作には尊敬表現を用いる。
- source_word: αὐτῷ
  choice: ペトロに
  rationale: 代名詞の指示対象は直前の文脈ではペトロであり、日本語では明示した方が誤読を避けられる。
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: 彼をとどまらせたいと、わたしが望んだとしても
  rationale: θέλωの意志とἐάνの仮定性を明示する。μένεινはヨハネ文書で意味の響きを持つため「とどまる」を基礎とし、対格＋不定詞の構文を「とどまらせたい」と表した。
- source_word: ἕως ἔρχομαι
  choice: わたしが来るまで
  rationale: ἔρχομαιを解釈的な「再臨する」に狭めず、原文どおり「来る」とした。
- source_word: τί πρὸς σέ
  choice: それがあなたに何の関係があるのか
  rationale: 相手の関与を退ける慣用句を、直接的で自然な現代日本語にした。
theological_decisions:
- issue: 愛された弟子について広まった理解の性質
  choice: 共同体内に広まった「話」として訳し、イエスが不死を約束したとはしない
  alternative: 「この言葉が出て行った」と逐語的に訳す、または初めから「誤ったうわさ」と評価する
  rationale: 本文自身が、広まった理解とイエスの実際の発言を区別している。「話」はその区別を示しつつ、原文にない評価を先取りしない。
- issue: 条件文の仮定性
  choice: 「望んだとしても」と訳して仮定を保つ
  alternative: イエスが実際にその弟子を来臨まで生かすと決定したかのように訳す
  rationale: ἐάνによる条件は、その弟子が必ず生き残るとの約束ではない。本文の神学的緊張を解消せず、条件として提示する。
- issue: ἕως ἔρχομαιが指す出来事
  choice: 「わたしが来るまで」とし、何を指すか本文で限定しない
  alternative: 「わたしが再臨するまで」と明示する
  rationale: 文脈上、終末的来臨を含意し得るが、原文は単に「来る」と述べるため、解釈を訳文に固定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、聖書本文にふさわしい落ち着きと品位を保った。イエスには尊敬表現を用い、発言内の一人称は「わたし」とした。反語的な結びは過度に口語化せず、原文の直接性を残した。
