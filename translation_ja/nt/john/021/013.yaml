source:
  edition: SBLGNT
  text: ⸀ἔρχεται ⸀ὁ Ἰησοῦς καὶ λαμβάνει τὸν ἄρτον καὶ δίδωσιν αὐτοῖς, καὶ τὸ ὀψάριον ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: ja
  text: イエスは来て、パンを取り、彼らに与える。魚についても同じようにする。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスは来て、パンを取り、彼らに与えた。魚についても同じようにした」。ギリシア語では、過去の出来事を現在形で語る歴史的現在が用いられている。
    reason: lexical_alternative
  - marker: b
    text: 直訳「そして魚も同じように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: 来て
  rationale: ヨハネの語りに見られる歴史的現在を生かし、後続の「与える」とともに場面を目前の出来事として描く。
- source_word: λαμβάνει τὸν ἄρτον
  choice: パンを取り
  rationale: 食事の場にある特定のパンを手に取る単純な動作として訳した。日本語では定冠詞を不自然に明示しない。
- source_word: δίδωσιν αὐτοῖς
  choice: 彼らに与える
  rationale: 直前の「パン」が目的語として明らかなため、自然な日本語では繰り返さず、「仕える」などの解釈的な表現も避けた。
- source_word: ὀψάριον
  choice: 魚
  rationale: この文脈では食物としての魚を指す。「焼いた魚」とまで限定する情報は語そのものにはないため、簡潔に「魚」とした。
- source_word: ὁμοίως
  choice: 同じようにする
  rationale: パンについて行った一連の動作を魚についても行うことを、簡潔な並行表現で示した。
theological_decisions:
- issue: 復活後の顕現記事における歴史的現在
  choice: 「来て……取り……与える」と現在形の語りを保つ
  alternative: 「来て……取り……与えた」と過去形に整える
  rationale: 教理上の意味を付加せず、ギリシア語本文の生き生きとした叙述上の特徴を日本語でも可能な限り保つため。
translation_notes:
  register: 明瞭な現代標準語を用いた。敬語によって本文にない解釈的な格調を加えることは避けつつ、簡潔で厳かな叙述にした。
