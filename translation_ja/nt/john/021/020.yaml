  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: ja
  text: ペトロが振り向くと、イエスが愛しておられた弟子が後について来る[a]のが見えた。この弟子は、あの夕食の時、イエスの胸もとに寄りかかって[b]、「主よ、あなたを裏切るのはだれですか」と尋ねた者である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「ついて来る」の目的語は明示されていない。「彼らの後について来る」または「イエスの後について来る」とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「その夕食の時、イエスの胸に身を横たえた」。当時、食事の席では横になっていたことを背景とする表現。
    reason: cultural_and_lexical_clarification
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: 振り向くと
  rationale: アオリスト分詞が示す先行動作を、自然な日本語の場面展開として表した。
- source_word: βλέπει
  choice: 見えた
  rationale: ギリシア語は歴史的現在だが、日本語の物語として自然な過去形にした。目的語を伴う知覚構文「〜のが見えた」により、後続する分詞句との関係も明確にした。
- source_word: τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς
  choice: イエスが愛しておられた弟子
  rationale: ヨハネ文書で特徴的な呼称を保ちつつ、イエスへの敬意を自然な日本語で示した。
- source_word: ἀκολουθοῦντα
  choice: 後について来る
  rationale: 移動中の場面に自然であり、ギリシア語に明示されない目的語を本文では補わなかった。
- source_word: ἀνέπεσεν … ἐπὶ τὸ στῆθος αὐτοῦ
  choice: イエスの胸もとに寄りかかって
  rationale: 横になって食事をする当時の姿勢を背景に、現代の読者が動作を理解しやすい表現とした。代名詞の指示対象は日本語で明確にするため「イエス」とした。
- source_word: ἐν τῷ δείπνῳ
  choice: あの夕食の時
  rationale: 既知の特定の食事を指すことを「あの」で示し、典礼的な含意を不要に持ち込まない表現にした。
- source_word: Κύριε
  choice: 主よ
  rationale: イエスへの直接の呼びかけとして、敬意とヨハネ福音書の神学的響きを保つ標準的な訳語を用いた。
- source_word: ὁ παραδιδούς σε
  choice: あなたを裏切るのはだれ
  rationale: 受難物語の文脈における παραδίδωμι の意味を「裏切る」とし、現在分詞の進行・切迫感を日本語の自然な問いとして表した。
theological_decisions:
- issue: 歴史的現在 βλέπει の扱い
  choice: 日本語の過去形「見えた」
  alternative: 現在形「見える」
  rationale: 物語の時制を自然にしつつ、出来事の内容や神学的意味を変えない。
- issue: ἀκολουθοῦντα の省略された目的語
  choice: 目的語を補わず「後について来る」
  alternative: 「彼らの後について来る」または「イエスの後について来る」
  rationale: 原文は誰の後についていたかを文法上明示していないため、その曖昧さを本文に残した。文脈上の可能性は脚注で示す。
- issue: 食事時の姿勢の描写
  choice: 「胸もとに寄りかかって」
  alternative: 「胸もとに身を横たえて」
  rationale: 当時の横臥式の食事姿勢を過度に説明せず、親密な位置関係と具体的動作の双方を自然な現代日本語で伝える。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。ヨハネ福音書特有の「イエスが愛しておられた弟子」という表現を保持し、原文で明示されない追随の対象は断定しない。脚注記号は対応箇所に配置した。
