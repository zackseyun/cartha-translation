id: JHN.21.11
reference: John 21:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: ja
  text: そこで、シモン・ペトロは舟に上がり[a]、網を岸へ引き上げた。網は百五十三匹の大きな魚でいっぱいであった。それほど多かったのに、網は裂けなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「上がった」。文脈上は、網を引くため舟に上がったという意味と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: 舟に上がり
  rationale: 基本義「上がる」を保ちつつ、直前の舟の場面から、舟に乗り込んだことを自然に示す。本文だけでは上がった先が明示されないため、文脈上の補足として「舟に」を加え、注で直訳を示す。
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの指示を受けたペトロの行動を導く、自然な物語上の接続を表す。
- source_word: εἵλκυσεν
  choice: 引き上げた
  rationale: 網を水中から岸へ移す動作を自然な日本語で表す。「引いた」より場面が明瞭で、「引きずった」ほど摩擦を強調しない。
- source_word: τὸ δίκτυον
  choice: 網
  rationale: 漁に用いる網を表す標準的で直接的な訳語。
- source_word: εἰς τὴν γῆν
  choice: 岸へ
  rationale: 直訳は「陸へ」だが、湖での漁の文脈では水辺の陸地、すなわち岸を指すため、自然な日本語とした。
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: 百五十三匹の大きな魚でいっぱいであった
  rationale: μεστόνの充満の意味と、ἰχθύων μεγάλωνの内容を明確に保持する。日本語では魚の数に助数詞「匹」を用いる。
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: 百五十三匹
  rationale: 原文の具体的な数をそのまま保持する。
- source_word: τοσούτων ὄντων
  choice: それほど多かったのに
  rationale: 属格独立構文の譲歩的な関係を自然に示し、多数の魚にもかかわらず網が裂けなかったという対比を保つ。
- source_word: οὐκ ἐσχίσθη
  choice: 裂けなかった
  rationale: 受動形の結果状態を、日本語で網について最も自然な自動詞表現にする。「破れなかった」も可能だが、σχίζωの裂けるという像をより直接に保つ。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語として自然でありながら原文の動作、具体的な魚の数、譲歩的な対比を保持した。「であった」で落ち着いた聖書本文の格調を保ちつつ、過度に古風な語法は避けた。
