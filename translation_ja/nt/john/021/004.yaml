source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: ja
  text: すでに夜が明けたころ、イエスは岸辺に立っていた。しかし弟子たちは、それがイエスだとは知らなかった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それがイエスだとは気づかなかった」。ギリシア語では、より直訳的には「それがイエスだとは知らなかった」。
    reason: 文脈上は認知・同定の意味を帯びるものの、原語は「知る」を意味するοἶδαであるため。
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: すでに夜が明けたころ
  rationale: 属格独立構文の時間的意味とἤδηを保ち、πρωΐαを現代日本語で自然な「夜が明けたころ」とした。δὲは物語を進める緩やかな接続であり、独立した語を加えず文脈上の流れに含めた。
- source_word: ἔστη
  choice: 立たれた
  rationale: アオリストの出来事として簡潔に訳した。日本語としての品位を保つため、イエスを主語とする自然な尊敬表現を用いた。
- source_word: εἰς τὸν αἰγιαλόν
  choice: 岸辺に
  rationale: 立つ位置を表す慣用的なεἰςと、湖岸・浜を指すαἰγιαλόςを、文脈に即して簡潔に表した。
- source_word: οὐ μέντοι
  choice: しかし
  rationale: イエスがそこに立っていることと、弟子たちがその正体を知らないこととの対照を自然に示した。
- source_word: ᾔδεισαν
  choice: 知らなかった
  rationale: 動詞οἶδαの基本的意味「知る」を保持した。文脈上は「気づく・見分ける」に近いが、本文ではその解釈に限定しなかった。
- source_word: οἱ μαθηταὶ
  choice: 弟子たち
  rationale: 定冠詞は既知の一団を指すため、日本語では無標の「弟子たち」が自然であり、原文にない所有表現は加えなかった。
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: それがイエスだとは
  rationale: 同定を表すギリシア語節を、日本語で自然な形にした。
theological_decisions:
- issue: 復活後のイエスを弟子たちが同定できなかったこと
  choice: 「それがイエスだとは知らなかった」とし、認識できなかった事実だけを述べる
  alternative: 「イエスだと気づかなかった」または「イエスだと分からなかった」
  rationale: この節は弟子たちがイエスだと知らなかった理由を説明していない。外見の変化や超自然的な認識阻害などの説明を訳文に持ち込まず、原文の神学的・物語的余白を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「立たれた」は自然な尊敬表現であり、過度に古風な語法は避けた。
