  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: ja
  text: イエスは彼に、二度目にもまた言われた。[a]「ヨハネの子シモン、あなたはわたしを愛していますか。」彼はイエスに言った。「はい、主よ。私があなたを愛していることは、あなたがご存じです。」イエスは彼に言われた。「わたしの羊を、羊飼いとして世話をしなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、この問答の「愛する」に二つの異なる動詞が使われている。イエスの問いはアガパオー、ペトロの答えはフィレオーである。両者に意味の違いを見る解釈もあるが、文体上の言い換えと見る解釈もある。本文では違いを強調しすぎないよう、どちらも「愛する」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: 再び、二度目に
  rationale: πάλινと第二を表す δεύτερον の両方を訳し、原文の重ねた表現を保持した。日本語では読点を置くことで意味を明確にした。
- source_word: Σίμων Ἰωάννου
  choice: ヨハネの子シモン
  rationale: 属格を父称として自然に訳した。この異読本文の「ヨハネ」を採り、「ヨナ」は持ち込まない。
- source_word: ἀγαπᾷς / φιλῶ
  choice: 愛していますか／愛している
  rationale: ヨハネ文書では両動詞の意味が重なり得るため、本文ではともに「愛する」とした。ただし原語の違いは脚注で明示する。
- source_word: κύριε
  choice: 主よ
  rationale: 復活したイエスに対するペトロの呼びかけとして、敬意と告白的含意を保つ「主」を用いた。
- source_word: σὺ οἶδας
  choice: あなたがご存じです
  rationale: 明示された主語 σὺ の軽い強調を「あなたが」で示し、敬語表現によって自然な日本語にした。
- source_word: Ποίμαινε
  choice: 牧しなさい
  rationale: 羊飼いとして導き、世話し、養うという ποιμαίνω の牧羊比喩を保つ。「養いなさい」より広い働きを示す。
- source_word: τὰ πρόβατά μου
  choice: わたしの羊
  rationale: 具体的な羊の比喩とイエスへの帰属をそのまま保持した。
theological_decisions:
- issue: ἀγαπάω と φιλέω の違いを訳し分けるか
  choice: 本文では両方を「愛する」と訳し、動詞の違いを脚注に示す。
  alternative: ἀγαπάωを「愛する」、φιλέωを「慕う」または「親しく思う」と訳し分ける。
  rationale: 二つの動詞には実際に語形上の違いがあるが、この文脈で愛の程度や種類の明確な対比を意図するかは確定できない。本文で強い差を設けず、脚注によって解釈上の緊張を保存する。
- issue: πάλιν δεύτερον の重複表現
  choice: 「再び、二度目に」と両要素を訳す。
  alternative: 自然さを優先して「二度目に」とだけ訳す。
  rationale: 原文は反復を示す二語を重ねているため、その強調を本文に残した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、イエスの発言には「言われた」、ペトロの認識表現には「ご存じです」を用いて、簡潔で品位ある聖書文体とした。「牧しなさい」はやや文語的だが、牧羊の比喩と包括的な世話の意味を簡潔に保持できるため採用した。
