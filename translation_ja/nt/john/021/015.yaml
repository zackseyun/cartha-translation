id: JHN.21.15
reference: John 21:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: ja
  text: さて、一同が朝食を済ませると、イエスはシモン・ペトロに言われた。「ヨハネの子シモン、あなたはこれら以上に、わたしを愛していますか。[a]」ペトロは答えた。「はい、主よ。私があなたを愛していることは、あなたがご存じです。[b]」イエスは言われた。「わたしの子羊を養いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これら以上に」は、「これらの人たちがわたしを愛する以上に」という意味とも、「これらの人たちや物を愛する以上に」という意味とも取れる。ギリシア語では、「これら」が何を指すか、および比較の内容が明示されていない。
    reason: alternative_reading
  - marker: b
    text: イエスの問いではἀγαπάω、ペトロの答えではφιλέωという、異なる二つの「愛する」が用いられている。ここに意味の違いを見る解釈もあれば、文体上の言い換えと見る解釈もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρίστησαν
  choice: 朝の食事を終えると
  rationale: ἀριστάωは朝の食事を取ることを表す。日本語として自然な時間的つながりを示しつつ、食事の時間帯を明示した。
- source_word: λέγει
  choice: 言われた／答えた
  rationale: ギリシア語の歴史的現在は、現代日本語の物語文として自然な過去表現で訳した。ペトロの発話では話者交替を明瞭にするため「答えた」とした。
- source_word: Σίμων Ἰωάννου
  choice: ヨハネの子シモン
  rationale: 属格Ἰωάννουを父称として直接訳した。別伝承に基づく「ヨナの子」は採用しない。
- source_word: ἀγαπᾷς
  choice: 愛していますか
  rationale: 直接的で自然な問いとして訳した。φιλέωとの語の違いは本文で過度に際立たせず、注で示す。
- source_word: πλέον τούτων
  choice: この人たち以上に
  rationale: τούτωνは文脈上、その場にいる弟子たちを指す可能性が高いが、比較の基準は省略されており、「彼らが愛する以上に」か「彼らを愛する以上に」かは確定しない。この曖昧さを注で保持する。
- source_word: κύριε
  choice: 主よ
  rationale: ヨハネ福音書の復活後の文脈とペトロの敬意に即してκύριοςを「主」とした。
- source_word: οἶδας
  choice: ご存じです
  rationale: イエスへの敬意を自然な現代日本語で表しつつ、οἶδαの認識の意味を保った。
- source_word: φιλῶ
  choice: 愛している
  rationale: φιλέωは親愛・愛情を帯び得るが、この箇所でἀγαπάωとの明確な段階差を本文に持ち込まないため、同じ「愛する」で訳し、語の交替を注記した。
- source_word: Βόσκε
  choice: 養いなさい
  rationale: βόσκωは羊に食物を与えることを中心に表す。「養う」は牧会的比喩を自然に保ち、後続箇所のποιμαίνωとの完全な同一化も避けられる。
- source_word: τὰ ἀρνία μου
  choice: わたしの子羊
  rationale: ἀρνίονの若い羊という牧羊の比喩と、μουが示すイエスへの帰属を簡潔に保った。
theological_decisions:
- issue: ἀγαπάωとφιλέωを本文で区別するか
  choice: 両方を「愛する」と訳し、語の交替を脚注で示す。
  alternative: ἀγαπάωを「愛する」、φιλέωを「慕う」「親しく思う」などと訳し分ける。
  rationale: 二つの動詞に意図的な意味の差を見る解釈と、ヨハネ文書に見られる文体的な言い換えと見る解釈がある。本文で愛の上下関係を確定せず、原文の語彙的緊張を注に残した。
- issue: πλέον τούτωνの比較内容
  choice: 「この人たち以上に」とし、比較基準の二つの可能性を脚注で明示する。
  alternative: 「この人たちが愛する以上に」または「この人たちを愛する以上に」と一義的に訳す。
  rationale: 中性・男性同形のτούτωνと省略された比較構文には解釈の余地がある。日本語では指示対象をある程度示す必要があるため直前の弟子たちを指す訳を採ったが、比較の向きは確定しなかった。周囲の物を指す可能性も完全には排除できないため注記した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、イエスには「わたし」、ペトロには「私」を用いた。会話は敬意を保ちながら過度に古風にせず、命令は dignified な「養いなさい」とした。脚注記号は該当する句と発言の直後に配置した。
