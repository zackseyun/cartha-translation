source:
  edition: SBLGNT
  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: ja
  text: シモン・ペトロ、双子と呼ばれるトマス、ガリラヤのカナ出身のナタナエル、ゼベダイの息子たち、それにイエスの弟子のうちほかの二人が、一緒にいた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: 一緒にいた
  rationale: 未完了過去の存在状態と、同じ場所に集まっていたことを、自然な現代日本語で表した。
- source_word: Σίμων Πέτρος
  choice: シモン・ペトロ
  rationale: 日本語聖書で広く通用する音写を用いた。
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: 双子と呼ばれるトマス
  rationale: Δίδυμοςは意味を持つ呼称で「双子」を表すため、音写せず意味を訳した。λεγόμενοςの受動的な表現も保持した。
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: ガリラヤのカナ出身のナタナエル
  rationale: 出身地を示すἀπόを「出身」とし、日本語で明瞭な地名関係になる語順にした。
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: ゼベダイの息子たち
  rationale: ギリシャ語では省略されている親族名詞を、文脈上確実な「息子たち」として補った。
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: イエスの弟子のうちほかの二人
  rationale: ἐκの部分集合の意味を「弟子のうち」で保った。日本語では代名詞「あの方の／彼の」より指示対象を明確にするため「イエス」とした。
- source_word: καί … καί
  choice: 読点で列挙し、最後を「それに」で接続
  rationale: 反復される並列関係を保ちつつ、自然で読みやすい日本語の列挙に整えた。
