  source_fidelity: 原文の列挙、存在を表す未完了過去（ἦσαν）、および「一緒に」（ὁμοῦ）が適切に反映されている。「双子と呼ばれる」はΘωμᾶς ὁ λεγόμενος Δίδυμοςを意味どおりに訳し、「ゼベダイの息子たち」と「イエスの弟子のうちほかの二人」もそれぞれ原文の省略された名詞と部分属格を自然に表している。αὐτοῦを「イエス」と明示することは、この文脈では指示対象が明白であり、意味を不当に限定していない。
