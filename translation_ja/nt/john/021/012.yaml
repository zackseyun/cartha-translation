  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: ja
  text: イエスは彼らに言われた。「さあ、朝食を取りなさい。」[a] 弟子たちは、主だと分かっていたので、だれも「あなたはどなたですか」とあえて尋ねようとはしなかった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「朝食を食べなさい」とも訳せます。このギリシア語動詞は、特に朝の食事を取ることを指します。
    reason: lexical_alternative
  - marker: b
    text: 「尋ねる」と訳した語には、「問いただす」「詳しく確かめる」という意味もあります。また、「主だと分かっていたので」は「主だと分かっていて」とも訳せます。
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: さあ
  rationale: 食事へ招く命令的な呼びかけを、現代日本語で自然かつ簡潔に表した。
- source_word: ἀριστήσατε
  choice: 朝の食事をしなさい
  rationale: 朝の食事を取ることを指す動詞の時間的な限定を明示した。「朝食を食べなさい」より自然で、場面にもふさわしい。
- source_word: οὐδεὶς δὲ
  choice: だれも…なかった
  rationale: 日本語の否定呼応で自然に表現した。δέの軽い転換は文を分けることで示し、強すぎる逆接は避けた。
- source_word: ἐτόλμα
  choice: あえて…しようとはしなかった
  rationale: 勇気を出して行う、思い切って行うという含みを保ちつつ、日本語として自然な否定表現にした。
- source_word: ἐξετάσαι
  choice: 尋ねよう
  rationale: 直接話法の問いを発する文脈では「尋ねる」が明瞭である。詳しく問いただす可能性は脚注に残した。
- source_word: Σὺ τίς εἶ;
  choice: あなたはどなたですか
  rationale: 明示された二人称代名詞を「あなたは」で保ち、相手の身元を問う丁寧な直接疑問として訳した。
- source_word: εἰδότες ὅτι
  choice: 主だと分かっていたので
  rationale: 分詞の付帯的・理由的関係を自然な日本語で表した。「ので」は文脈上の理由を示すが、論理を過度に強めない。
- source_word: ὁ κύριός
  choice: 主
  rationale: 復活したイエスを指す称号としてのキリオスを、キリスト論的な重みを保つ標準的な「主」とした。
theological_decisions:
- issue: イエスを指す κύριος の訳語
  choice: 主
  alternative: 主人
  rationale: 復活顕現の文脈では単なる敬称や社会的な「主人」より、物語上の称号「主」が適切であり、原文の神学的含意を狭めない。
- issue: εἰδότες の論理関係
  choice: 主だと分かっていたので
  alternative: 主だと分かっていながら
  rationale: 弟子たちが尋ねなかった理由を示す読みが文脈上自然である。ただし分詞自体は理由を文法的に一義化しないため、代案の余地を脚注で示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、復活顕現の場面にふさわしい落ち着いた格調を保った。イエスの招きは親しみのある「さあ」とし、弟子たちの畏れを「だれも…あえて…しなかった」で表した。
