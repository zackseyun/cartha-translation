revisions:
- from: まことに、まことに、あなたに言います。あなたが若かったころは、自分で身支度をし、行きたい所を歩いていました。しかし、年を取ると、あなたは両手を伸ばし[a]、ほかの人があなたに帯を締め[b]、行きたくない所へ連れて行きます[c]。
  to: まことに、まことに、あなたに言います。あなたが若かったころは、自分で帯を締め、好きな所へ歩いて行っていました。しかし、年を取ると、あなたは両手を伸ばし[a]、ほかの人があなたに帯を締め[b]、あなたの行きたくない所へ連れて行きます[c]。
  rationale: 原文で二度用いられる ζώννυμι を本文でも「帯を締める」と統一し、若い時の自己決定と老年の他者への依存という対照を可視化しました。「縛る」という解釈的な表現は本文に採らず、死の様態も次節に先立って明文化していません。また、移動を表す日本語を自然な「好きな所へ歩いて行っていました」に整えました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T09:18:13Z'
