id: JHN.21.18
reference: John 21:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: ja
  text: まことに、まことに、あなたに言います。あなたが若かったころは、自分で帯を締め、好きな所へ歩いて行っていました。しかし、年を取ると、あなたは両手を伸ばし[a]、ほかの人があなたに帯を締め[b]、あなたの行きたくない所へ連れて行きます[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「両手を伸ばす」は、ペトロが十字架刑によって死ぬことを暗示すると広く理解されています。次の節は、イエスがこの言葉によって、ペトロがどのような死によって神の栄光を現すかを示した、と説明しています。
    reason: cross_reference
  - marker: b
    text: 直訳「ほかの人があなたに帯を締める」。前半の「自分で帯を締め」と同じ動詞です。この動詞は、衣服を身につけるために帯を締めることを表します。
    reason: lexical_alternative
  - marker: c
    text: 別訳「運んで行きます」。原語は、人や物を運ぶ、連れて行くことを表し得ます。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: ヨハネ福音書に特徴的な二重の厳粛な導入句を、音写せず、明瞭で格調ある現代日本語として保持する。
- source_word: λέγω σοι
  choice: あなたに言います
  rationale: 二人称単数への直接の語りかけを明示し、原文の簡潔さを保つ。
- source_word: ὅτε ἦς νεώτερος
  choice: あなたが若かったころは
  rationale: 比較級は後に述べる老年との対比を表すため、日本語では自然な「若かったころ」とする。
- source_word: ἐζώννυες σεαυτόν
  choice: 自分で身支度をし
  rationale: ζώννυμι は衣服や帯を締める動作だが、ここでは自分で自由に出かける支度をする意味を自然に伝える。後半の同語とのつながりは脚注で補う。
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: 行きたい所を歩いていました
  rationale: 比喩的な生き方ではなく具体的な移動を指すため、「歩く」を保持し、本人の自由との対比を表す。
- source_word: ὅταν δὲ γηράσῃς
  choice: しかし、年を取ると
  rationale: 未来を指す不定時の表現を自然な日本語にし、δέ の対照を「しかし」で示す。
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: あなたは両手を伸ばし
  rationale: 原文の像を解釈せずそのまま訳し、十字架刑への示唆は本文で明示しない。「両手」は複数形を自然に表す。
- source_word: ἄλλος σε ζώσει
  choice: ほかの人があなたに帯を締め
  rationale: 前半と同じ ζώννυμι を、ここではより字義的に訳して、他者に身を委ねる状況と拘束を含み得る像を保つ。
- source_word: οἴσει
  choice: 連れて行きます
  rationale: φέρω は運ぶ・連れて行く・連行する意味を持ち得る。人を望まない場所へ移動させる文脈では「連れて行く」が自然で、強制の度合いを過度に確定しない。
- source_word: ὅπου οὐ θέλεις
  choice: 行きたくない所へ
  rationale: 原文で省略されている移動の意味を、日本語の目的地表現として自然に補う。
theological_decisions:
- issue: 「両手を伸ばす」を本文で十字架刑と明示するか
  choice: 本文では具体的な動作の像を保持し、明示しない
  alternative: 「十字架につけられる」ことを直接表す訳にする
  rationale: 次節で語り手が、この言葉はペトロがどのような死によって神の栄光を現すかを示したものだと説明する。本文の展開を先取りせず、象徴的含意と字義的な像の双方を保つ。
- issue: ζώννυμι を「帯を締める」とするか「縛る」とするか
  choice: 後半は「あなたに帯を締め」とする
  alternative: 「あなたを縛り」とする
  rationale: 「縛る」は死への強制連行という解釈を強めるが、同じ動詞が前半の自分で身支度をする行為にも使われている。語彙上の連続性を優先しつつ、拘束の可能性は脚注に示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「です・ます」体でイエスの厳粛な語りを表しつつ、古語的な「帯びる」「まことまこと」などは避けた。前半の自立と後半の他者への依存という対照を自然に示し、死の様態は次節に先立って本文中で断定しない。
