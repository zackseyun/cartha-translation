source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν αὐτοῖς· Βάλετε εἰς τὰ δεξιὰ μέρη τοῦ πλοίου τὸ δίκτυον, καὶ εὑρήσετε. ἔβαλον οὖν, καὶ οὐκέτι αὐτὸ ἑλκύσαι ⸀ἴσχυον ἀπὸ τοῦ πλήθους τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: ja
  text: しかし、彼は彼らに言った。「舟の右側に網を投げなさい。そうすれば、魚を見つけるでしょう[a]。」そこで彼らは網を投げた。しかし、魚が非常に多かったため、もはやその網を引き上げることができなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「そうすれば、あなたがたは見つける」。何を見つけるかはギリシア語では明記されていないが、漁の文脈から魚を指す。
    reason: 原文で目的語が省略されていることを示しつつ、日本語本文で補った「魚」を説明するため。
lexical_decisions:
- source_word: Βάλετε
  choice: 投げなさい
  rationale: 網を水中へ投じる動作を表す命令として、現代日本語で自然かつ明確である。
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: 舟の右側
  rationale: μέρηの字義的な「部分」よりも、この構文と場面に即した方向・場所を自然に示す。
- source_word: πλοίου
  choice: 舟
  rationale: ガリラヤ湖で用いる漁船という文脈に適し、「船」より小型の舟を自然に想起させる。
- source_word: τὸ δίκτυον
  choice: 網
  rationale: 漁に用いる網を指す明確な対応語である。
- source_word: εὑρήσετε
  choice: 魚が捕れる
  rationale: 字義は「あなたがたは見つける」だが、漁の文脈で目的語の魚が省略されている。日本語では結果を自然に表すため「魚が捕れる」としたが、原文の表現は脚注に保持した。
- source_word: οὐκέτι
  choice: もはや～できなかった
  rationale: 大漁の後に能力が失われたという時間的な変化を明確に表す。
- source_word: ἑλκύσαι
  choice: 網を引き上げる
  rationale: 魚で満ちた網を舟へ取り込もうとする動作として自然であり、単なる「引く」より場面が明瞭である。
- source_word: ἴσχυον
  choice: できなかった
  rationale: ここでは身体的な力を含む遂行能力を表しており、日本語では可能表現が自然である。
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: 魚が非常に多く
  rationale: ἀπόの原因・理由の関係と、πλῆθοςが示す多数を、簡潔で自然な日本語で表した。
theological_decisions: []
