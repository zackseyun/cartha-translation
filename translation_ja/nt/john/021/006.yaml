revisions:
- from: しかし、彼は彼らに言った。「舟の右側に網を投げなさい。そうすれば、魚が捕れる[a]。」そこで彼らが網を投げると、魚が非常に多く、もはや網を引き上げることができなかった。
  to: しかし、彼は彼らに言った。「舟の右側に網を投げなさい。そうすれば、魚を見つけるでしょう[a]。」そこで彼らは網を投げた。しかし、魚が非常に多かったため、もはやその網を引き上げることができなかった。
  rationale: 本文の「魚が捕れる」を、原文の εὑρήσετε に対応する「魚を見つけるでしょう」へ改めた。これにより、漁の文脈から補われる目的語は明示しつつ、「見つける」という原文の表現を保持する。また、後半を独立した過去叙述に改め、οὖν による出来事の進行と、魚の多さを原因とする不能の関係を明確にした。
