id: JHN.21.19
reference: John 21:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: ja
  text: イエスは、ペトロがどのような死によって神に栄光を帰すことになるのかを示すために、こう言った[a]。そして、こう言ってから、ペトロに言う[b]。「わたしに従いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どのような死に方によって神に栄光を帰すことになるのか」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語では、ここで歴史的現在が用いられ、「ペトロに言う」となっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: 示すために
  rationale: この分詞は、直前の発言が何を示していたかを説明する。間接的に意味を示す含みを保ちつつ、現代日本語として明瞭にした。
- source_word: ποίῳ θανάτῳ
  choice: どのような死によって
  rationale: ποῖος の質的なニュアンスと、手段を表す与格をともに自然な日本語で表した。
- source_word: δοξάσει τὸν θεόν
  choice: 神の栄光を現すことになる
  rationale: 日本語では「神を栄光化する」より自然であり、未来形の前望的な意味も「ことになる」で保持した。
- source_word: λέγει αὐτῷ
  choice: 彼に言う
  rationale: 歴史的現在を現在形で残し、ヨハネの叙述の生き生きとした転換を保持した。
- source_word: Ἀκολούθει μοι
  choice: わたしに従いなさい
  rationale: 現在命令形が持ちうる継続的弟子道の含みを排除せず、直接の命令として自然かつ格調ある日本語にした。
- source_word: καὶ τοῦτο εἰπὼν
  choice: そして、こう言ってから
  rationale: アオリスト分詞の先行動作を、自然な時間節として表した。
theological_decisions:
- issue: ペトロの死が「神の栄光を現す」ことの意味
  choice: 説明を加えず、死によって神の栄光を現すという本文の表現を保持する
  alternative: 殉教による忠実な証しが神に栄光を帰す、と明示する
  rationale: 本文はその死が神の栄光に関わると述べるが、その仕組みを詳しく説明してはいないため、殉教理解を訳文に過剰に織り込まない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい簡潔さと格調を保った。歴史的現在は脚注とともに本文でも保持した。
