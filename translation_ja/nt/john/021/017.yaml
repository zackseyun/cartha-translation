reference: John 21:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: ja
  text: イエスは三度目に[a]ペトロに言われた。「ヨハネの子シモン、あなたはわたしを愛していますか。」イエスが三度目に「あなたはわたしを愛していますか」と言われたので、ペトロは心を痛めた。ペトロはイエスに言った。「主よ、あなたはすべてをご存じです。わたしがあなたを愛していることを、あなたは知っておられます。」イエスはペトロに言われた[b]。「わたしの羊を養いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで使われているギリシア語はフィレオー（「愛する、親愛の情を抱く」）です。この対話の前二回の問いでは、イエスはアガパオーという別の動詞を使っています。この違いに意味があると見る解釈もあれば、この文脈では両語の意味は重なっていると見る解釈もあります。本文では違いを必要以上に強調せず、どちらも「愛する」と訳しています。
    reason: lexical_alternative
  - marker: b
    text: ペトロの返答では、「知る」に当たる二つのギリシア語動詞（オイダとギノースコー）が使われています。何らかのニュアンスの違いがある可能性はありますが、解釈を加えず自然な日本語で明確に訳し分けることは困難です。
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: 三度目に
  rationale: 反復される問いを明確に示しつつ、自然な現代日本語の副詞表現とした。
- source_word: Σίμων Ἰωάννου
  choice: ヨハネの子シモン
  rationale: 属格を父称として読み、本文の異読を別箇所の伝統的な「ヨナの子」に置き換えない。
- source_word: φιλεῖς / φιλῶ
  choice: 愛していますか／愛している
  rationale: φιλέωは愛情を表すが、ここでἀγαπάωとの厳密な意味差を日本語本文に強制する根拠は十分でないため、いずれも自然で重みのある「愛する」とした。語の交替は脚注で示す。
- source_word: ἐλυπήθη
  choice: 心を痛めた
  rationale: 悲しみと内面的な苦痛を自然な現代日本語で表し、単なる不快感には弱めない。
- source_word: Κύριε
  choice: 主よ
  rationale: 復活したイエスへのペトロの呼びかけとして、単なる敬称以上の重みを保つ。
- source_word: πάντα σὺ οἶδας
  choice: あなたはすべてをご存じです
  rationale: πάνταの包括性をそのまま保ち、イエスへの敬意を自然な敬語で表した。
- source_word: οἶδας ... γινώσκεις
  choice: ご存じです……知っておられます
  rationale: 二つのギリシア語動詞はいずれもここでは「知る」を意味する。日本語では敬語表現に自然な変化を持たせながら、解釈的な意味差を持ち込まない。
- source_word: Βόσκε
  choice: 養いなさい
  rationale: βόσκωの、餌を与えて養うという意味を保ち、ποιμαίνωのより広い「牧する」との違いも維持する。
- source_word: πρόβατά
  choice: 羊
  rationale: 一般に羊を指し、15節のἀρνία「小羊」との語彙上の違いを保つ。
theological_decisions:
- issue: イエスとペトロの対話におけるφιλέωとἀγαπάωの差を明示するか
  choice: 本文では双方を「愛する」と訳し、鋭い区別を含意させない
  alternative: 「愛する」と「慕う」など、異なる日本語動詞で訳し分ける
  rationale: コイネー・ギリシア語における両動詞の意味領域は重なっており、この文脈で神学的な段階差を翻訳そのものに確定的に織り込むべきではない。語の交替自体は脚注で保存する。
- issue: ペトロの「あなたはすべてをご存じです」の射程
  choice: イエスの包括的な知識についての強い発言として、そのまま訳す
  alternative: 「このことは何もかもご存じです」と文脈に限定する、または全知についての教理的説明を本文に加える
  rationale: ギリシア語は明確に「すべて」を述べる。強さを弱めず、同時に本文以上の教理的注釈も加えない。
translation_notes:
  register: 明快で現代的ながら、復活したイエスとペトロの厳粛な対話にふさわしい品位を保った。「言われた」「ご存じです」「知っておられます」により敬意を自然に示し、命令の「養いなさい」は簡潔で力のある表現とした。すべての脚注記号を本文中に配置した。
