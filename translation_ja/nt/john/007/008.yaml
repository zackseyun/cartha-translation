id: JHN.7.8
reference: John 7:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς ἀνάβητε εἰς τὴν ⸀ἑορτήν· ἐγὼ ⸀οὐκ ἀναβαίνω εἰς τὴν ἑορτὴν ταύτην, ὅτι ὁ ⸂ἐμὸς καιρὸς⸃ οὔπω πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/008.yaml
  text: You go up to the feast[a]. I am not going up to this feast[b], because my time has not yet come to fulfillment.
translation:
  language: ja
  text: あなたがたは祭りに上って行きなさい。わたしはこの祭りには上って行かない[a]。わたしの時はまだ満ちていないからだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本では、「わたしはまだこの祭りには上って行かない」とある。
    reason: textual_variant
  - marker: b
    text: または、「わたしに定められた時は、まだ満ちていない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: 上って行きなさい
  rationale: エルサレムへの巡礼という文脈で、ἀναβαίνωの方向性を自然な日本語で保つ。
- source_word: ἑορτή
  choice: 祭り
  rationale: 宗教的な祝祭を指す語として、現代日本語で明瞭かつヨハネ福音書の文脈に適する。
- source_word: οὐκ ἀναβαίνω
  choice: 上って行かない
  rationale: 底本のοὐκをそのまま「行かない」と訳し、現在形を目前の行動についての発言として自然に表した。「まだ」は本文に補わず、異読を脚注に示す。
- source_word: καιρός
  choice: 時
  rationale: 定められた機会・時機という含みを残しながら、簡潔で自然な訳語とした。
- source_word: οὔπω πεπλήρωται
  choice: まだ満ちていない
  rationale: 完了受動形が示す充足・完成のニュアンスを保ち、「まだ来ていない」と単なる到来に平板化しない。
theological_decisions:
- issue: 祭りへ行くことについてのイエスの発言にある本文異読
  choice: SBLGNTのοὐκに従い、本文を「わたしはこの祭りには上って行かない」とする。
  alternative: 一部の写本のοὔπωに従い、「わたしはまだこの祭りには上って行かない」とする。
  rationale: 指定された底本を本文で採用し、後にイエスが祭りへ行くこととの緊張を訳文で解消しない。重要な異読は脚注で明示する。
- issue: καιρόςの神学的含意
  choice: 「わたしの時」と訳す。
  alternative: 「わたしに定められた時」と訳す。
  rationale: 神によって定められた時機という含みは文脈上可能だが、本文で明示的に補わず、原文の簡潔さと含意の幅を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの発言として簡潔で dignified な調子を保った。「上って行く」によりエルサレムへの方向性を示し、底本が持つ解釈上の緊張は脚注を伴って保持した。
