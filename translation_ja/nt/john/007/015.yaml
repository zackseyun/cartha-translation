id: JHN.7.15
reference: John 7:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: ja
  text: そこで、ユダヤ人たち[a]は驚きながら言った。「この人は学んだこともないのに、どうして学識があるのか。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「ユダヤ人たち」とは、ユダヤ民族全体ではなく、文脈上、エルサレムでイエスに対峙していた人々を指しており、ユダヤの指導者たちも含まれていたと考えられる。
    reason: cultural_note
  - marker: b
    text: 直訳すると「どうして文字を知っているのか」。ここで「文字」は、文字そのものだけでなく、学識や教養を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: 驚いていた／驚いて言った
  rationale: 未完了時制の継続的な反応を踏まえつつ、後続の分詞 λέγοντες と自然な日本語で結び、「驚いて言った」とした。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受ける叙述上のつながりを、現代日本語として自然に示す。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 語の通常の意味を本文に保ち、文脈上の範囲は脚注で明確にした。
- source_word: Πῶς
  choice: どうして
  rationale: 驚きを伴う、手段・理由への問いを自然な疑問表現で表した。
- source_word: οὗτος
  choice: この人
  rationale: 指示語の距離感を保ちながら、過度に侮蔑的にならない自然な表現とした。
- source_word: γράμματα οἶδεν
  choice: これほどの学問を身につけている
  rationale: 直訳は「文字を知っている」だが、ここでは読み書きそのものより、聖書を論じる学識・教養を指す慣用的な表現と判断した。
- source_word: μὴ μεμαθηκώς
  choice: 学んだこともないのに
  rationale: 完了分詞が示す、正式な教育を受けた経歴がないという状態を、簡潔で自然な日本語にした。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示範囲
  choice: 本文では「ユダヤ人たち」と訳し、文脈上の範囲を脚注で説明する
  alternative: 「ユダヤの指導者たち」または「ユダヤ地方の人々」
  rationale: 原文の一般的な語形を解釈的に狭めず保持する一方、ユダヤ民族全体への一般化と誤読されないよう、エルサレムでイエスに対峙していた人々を指すことを注記した。
- issue: γράμματα の意味
  choice: 学問
  alternative: 文字／聖書の知識
  rationale: 文脈では、正式な教育を受けていないイエスの学識への驚きが焦点である。特定の内容を「聖書」に限定せず、原語の幅を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の驚きと距離感を残しつつ、不自然な直訳調を避けた。
