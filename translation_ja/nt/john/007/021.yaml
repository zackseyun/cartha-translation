base_translation:
  language: en
  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: ja
  text: イエスは彼らに答えて言われた。「わたしが一つのわざ[a]を行ったので、あなたがたは皆、驚いている。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わざ」は「行い」とも訳せる。ここでは、ヨハネ福音書でイエスの働きを指して繰り返し用いられる語とのつながりを保つため、「わざ」とした。
    reason: lexical_alternative
  - marker: b
    text: おそらく、ヨハネ5章1～18節に記された、イエスが安息日に足の不自由な人を癒やした出来事を指す。
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: 答えて言われた
  rationale: 二つの動詞から成る原文の語りの定型を保ちつつ、現代日本語として理解できる表現にした。イエスへの敬意を表すため「言われた」とした。
- source_word: Ἓν ἔργον
  choice: 一つのわざ
  rationale: Ἓν の強調を「一つ」で保った。「わざ」は単なる行為に限定せず、ヨハネ福音書でイエスの働きを指すἔργονの反復と神学的含みを保持できる。
- source_word: ἐποίησα
  choice: わたしが…行った
  rationale: 単純な過去の行為として訳し、主語を明示してἛν ἔργονとの焦点を自然に伝えた。
- source_word: πάντες θαυμάζετε
  choice: あなたがたは皆、驚いている
  rationale: πάντεςと二人称複数を明示し、現在形を継続中の反応として表した。θαυμάζετεには驚嘆にも当惑にもなり得る幅があるため、中立的な「驚いている」とした。
theological_decisions:
- issue: ヨハネ福音書におけるἔργονの含意
  choice: わざ
  alternative: 行い／仕事
  rationale: 「わざ」は、具体的な行為を指しながら、ヨハネ福音書で繰り返されるイエスの「わざ」としての響きを保つ。「仕事」はこの文脈では日常的職務に聞こえやすく、「行い」は可能だが鍵語としての響きが弱い。
- issue: 「一つのわざ」が指す出来事
  choice: 本文では特定せず、脚注でヨハネ5章の安息日の癒やしとの関連を示す
  alternative: 本文中で癒やしと明示する
  rationale: 原文は出来事を明示していないため、本文で補わず、文脈上有力な参照先を脚注に留めた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「答えて言われた」は原文の二重動詞を保つため意図的に採用した。「驚いている」は称賛とも当惑とも断定せず、原語の幅を保つ。脚注標識[a][b]は、それぞれ「わざ」と節全体が暗示する出来事に対応させて本文末に配置した。
