  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: ja
  text: 「『あなたがたはわたしを捜すが、見つけることはなく、わたしがいる所に、あなたがたは来ることができない』と言った、この言葉はいったい何のことか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「この言葉は何なのか」。λόγος は文脈により「言葉」「発言」「言明」などを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: 言葉
  rationale: ここでは、イエスが語った発言内容を指す。日本語の「言葉」は単語一語に限らず、発言や言明も自然に表せる。
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: この言葉はどういうことなのか
  rationale: 直訳的な「この言葉は何か」より自然でありつつ、問いの構造と、発言の意味を問う文脈を保つ。
- source_word: Ζητήσετέ με
  choice: あなたがたはわたしを捜す
  rationale: ζητέωの具体的な探索の意味に合い、続く「見つける」と自然に対応する。未来の意味は文脈と述語の連続によって明確である。
- source_word: οὐχ εὑρήσετε
  choice: 見つけることはなく
  rationale: 単純な未来否定を表し、前節の目的語「わたし」を日本語では自然に省略した。
- source_word: ὅπου εἰμὶ ἐγώ
  choice: わたしがいる所に
  rationale: 現在形 εἰμί をそのまま保ち、「わたしが行く所」と解釈的に変更しない。日本語では移動動詞「来る」に伴う助詞「に」が自然である。
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: あなたがたは来ることができない
  rationale: δύνασθεが示す能力・可能性の否定を明示し、平明な現代日本語とした。
- source_word: εἶπε
  choice: あの人が言った
  rationale: λέγωのアオリストを自然に「言った」と訳す。直前の文脈で当局者たちがイエスを「あの人」と呼ぶ流れにも合う。
theological_decisions:
- issue: イエスの発言における現在形「わたしがいる所」
  choice: 現在形を保ち、「わたしがいる所」とする。
  alternative: 「わたしが行く所」
  rationale: 原文は現在形 εἰμί を用いている。ヨハネ福音書におけるイエスの起源、身分、父との関係をめぐる緊張を、未来の行き先だけに限定して解消しないためである。
translation_notes:
  register: 明瞭で品位ある現代標準語。原文の一続きの引用を保ち、現在形「いる」を維持した。「いったい」で話者たちの困惑を自然に示す。
