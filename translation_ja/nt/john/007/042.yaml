id: JHN.7.42
reference: John 7:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: ja
  text: 聖書には、メシア[a]はダビデの子孫から、またダビデがいた村、ベツレヘムから来る、と書かれているではないか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語は「ホ・クリストス」（「油を注がれた者」を意味する称号）。
    reason: 称号ὁ χριστόςの伝統的な別訳を示すため。
lexical_decisions:
- source_word: ἡ γραφή
  choice: 聖書
  rationale: ヨハネ文書で権威ある聖書の証言を指す定型的な用法であり、現代日本語では「聖書」が自然である。
- source_word: εἶπεν
  choice: 書かれている
  rationale: 直訳は「言った」だが、日本語で聖書本文の継続的な証言を示す表現として自然であり、修辞疑問の現在的な効力も伝える。
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: ダビデの子孫から
  rationale: σπέρμαはここでは文字どおりの種ではなく血統・子孫を意味するため、明瞭で自然な「子孫」とした。
- source_word: ἀπὸ Βηθλέεμ
  choice: ベツレヘムから
  rationale: ἀπόが示す出身・起源を簡潔に表す。
- source_word: τῆς κώμης
  choice: 村
  rationale: κώμηは都市ではなく小規模な集落を指すため、「町」より語義に近い。
- source_word: ὅπου ἦν Δαυίδ
  choice: ダビデがいた
  rationale: 原文の簡潔で曖昧な表現を保ち、「住んでいた」「出身であった」などの解釈を加えない。
- source_word: ἔρχεται
  choice: 来る
  rationale: 現在形による一般的・預言的な言明をそのまま自然に表す。
- source_word: ὁ χριστός
  choice: メシア
  rationale: この文脈ではユダヤ人が待望する油注がれた王という称号として機能しているため、音写的な「キリスト」ではなく称号の意味を伝える。
theological_decisions:
- issue: ὁ χριστόςという称号の訳
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法ではなく、出自が論じられている待望の救済者の称号であるため。「キリスト」も伝統的な訳語として脚注に示す。
- issue: 群衆の主張と物語上の皮肉
  choice: 発言を説明せず、そのまま修辞疑問として訳す
  alternative: イエスの実際の出生地に関する説明を本文へ補う
  rationale: 本節は登場人物の聖書理解と認識を記録しており、語り手はここで誤解を明示的に解消していない。その緊張を保持する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。οὐχで始まる肯定を期待する修辞疑問は「ではないか」で表した。「ダビデがいた」は不自然さを過度に避けようとして意味を限定せず、原文の簡潔さを保持した。
