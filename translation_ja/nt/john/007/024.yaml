  text: μὴ κρίνετε κατ’ ὄψιν, ἀλλὰ τὴν δικαίαν κρίσιν ⸀κρίνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: ja
  text: 見かけによって裁いてはならない。むしろ、正しい裁きをしなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: 裁いてはならない
  rationale: μήを伴う現在命令形の禁止を、文脈に即した明確で自然な日本語にした。相を過度に解釈して「裁くのをやめなさい」とはしない。
- source_word: κατ’ ὄψιν
  choice: うわべで
  rationale: 目に映る外面的な様子を判断の基準とする意を、簡潔で現代的な日本語で表す。「見たところによって」より自然である。
- source_word: ἀλλὰ
  choice: （句点による対照）
  rationale: 禁止と命令の強い対照を、二つの短い文の並置によって自然に示した。
- source_word: τὴν δικαίαν κρίσιν
  choice: 正しい裁き
  rationale: 直訳的な「正しい裁きを裁く」の不自然さを避けつつ、δικαίανの倫理的・司法的な正しさとκρίσινの「裁き」を保った。
- source_word: κρίνετε
  choice: 裁きをしなさい
  rationale: 前半と同じ語根の反復を「裁く／裁き」によって保持し、命令の力を明示した。
theological_decisions:
- issue: δικαίανを倫理的・司法的文脈でどう訳すか
  choice: 正しい
  alternative: 公正な／義にかなった
  rationale: 「正しい」は倫理的正当性と公正さの双方を含み、特定の教派的含意を加えず、一般の読者にも明瞭である。「公正な」は司法的公平さに狭まりやすく、「義にかなった」はこの短い命令ではやや説明的である。
translation_notes:
  register: 明快な現代標準語。短い対句の力強さを保ち、日常的でありながら品位のある命令表現とした。
