  terminology: 「世」はヨハネ文書におけるκόσμοςの標準的で適切な訳語です。「憎む」「証言する」も原語の強さと証言語彙をよく保っています。πονηράは道徳的な悪を指すため、「悪い」より「悪である」がやや明確です。
