id: JHN.7.7
reference: John 7:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: ja
  text: 世[a]はあなたがたを憎むことができませんが、わたしを憎みます。わたしが世について、その行いが悪であると証言するからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヨハネ文書で「世」はしばしば、被造世界そのものではなく、神に敵対する人間社会や秩序を指します。
    reason: cultural_note
lexical_decisions:
- source_word: οὐ δύναται
  choice: 憎むことができません
  rationale: δύναμαιが表す能力・可能性の否定を明示し、「憎めません」よりも意味を透明に保った。
- source_word: ὁ κόσμος
  choice: 世
  rationale: ヨハネ文書で重層的な意味を持つκόσμοςを、解釈的に「神に逆らう人類」などと狭めず、標準的な訳語で保持した。
- source_word: μισεῖν / μισεῖ
  choice: 憎む／憎んでいます
  rationale: 同じ動詞μισέωの反復と、弟たちとイエスとの鋭い対比を保った。
- source_word: μαρτυρῶ
  choice: 証言している
  rationale: 証人として公に告げるμαρτυρέωの含意を、現代日本語で明瞭に表した。
- source_word: τὰ ἔργα αὐτοῦ
  choice: その行い
  rationale: ἔργαを自然な日本語で表しつつ、世に属する行為全般を指す複数形の意味を保った。
- source_word: πονηρά
  choice: 悪い
  rationale: 単なる劣悪さではなく道徳的な悪を表す文脈に即し、明瞭で直接的な語を選んだ。
theological_decisions:
- issue: ヨハネ文書における「世」の指示対象と神学的含意
  choice: 本文では解釈的な説明を加えず「世」とした
  alternative: 神に逆らう人間社会／この世の体制
  rationale: κόσμοςは被造世界、人間世界、神に敵対する秩序などの意味を文脈に応じて帯びる。この節ではイエスを憎み、その行いが悪いものとして描かれるが、本文で一義的に言い換えず、ヨハネ特有の緊張と広がりを保持した。
- issue: 「世はあなたがたを憎むことができない」の力点
  choice: 能力・可能性の否定を明示した
  alternative: 世はあなたがたを憎みません
  rationale: 原文のοὐ δύναταιを単なる事実の否定に弱めず、世が弟たちを憎む理由を持たないという文脈上の含みを、説明しすぎることなく保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの発言にふさわしい簡潔で格調ある調子と、原文の対比構造を保った。
