  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: ja
  text: イエスは、ご自分を信じた者たちが受けようとしていた霊について、こう言われたのである。なぜなら、霊はまだなかった[a]。イエスがまだ栄光を受けておられなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「まだ霊は与えられていなかった」という意味とも考えられる。ギリシア語本文は簡潔に「まだ霊はなかった」とあり、イエスがまだ栄光を受けておられなかったことと結びつけている。
    reason: 原文の簡潔で神学的緊張を伴う表現を保ちつつ、文脈上の理解を示すため。
lexical_decisions:
- source_word: τοῦ πνεύματος / πνεῦμα
  choice: 霊
  rationale: 文脈上、信じる者たちが受ける神の霊を指す。「聖霊」は意味を明確にするが、原文にἅγιονはないため、本文では「霊」とした。
- source_word: οὗ
  choice: （関係節を「霊について」に組み替え）
  rationale: ギリシア語では「霊」を受ける目的語とする関係代名詞だが、日本語では「信じる者たちが受けようとしていた霊について」と前置修飾にすると自然で、指示関係も明確である。
- source_word: ἔμελλον λαμβάνειν
  choice: 受けようとしていた
  rationale: μέλλω＋不定詞の将来的・予期的意味を保ちつつ、物語時点から見た近い将来を自然な日本語で表す。
- source_word: οἱ πιστεύσαντες εἰς αὐτόν
  choice: ご自分を信じる者たち
  rationale: ヨハネ文書で重要なπιστεύω εἰςの方向性を「信じる」で自然に表した。アオリスト分詞を過去完了的に限定せず、この言葉が指す信者たちを日本語の連体節で示す。
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: その時にはまだ霊はなかった
  rationale: 原文の簡潔で難しい表現を保ち、「与えられていなかった」などを本文へ補わない。「その時には」により、イエスの栄光化以前という時間的局面を示しつつ、原文の神学的緊張は脚注とともに残す。
- source_word: ἐδοξάσθη
  choice: 栄光を受けておられなかった
  rationale: ヨハネにおけるイエスの受難・復活・高挙に関わるδοξάζωの主題を保つ。受動形を自然で尊敬を伴う日本語にした。
theological_decisions:
- issue: οὔπω γὰρ ἦν πνεῦμαを、霊そのものが存在しなかったとの存在論的断定に見えないようにしつつどう訳すか。
  choice: 本文では「その時にはまだ霊はなかった」と原文の緊張を残す。
  alternative: 「まだ霊が与えられていなかった」または「まだ霊が現れていなかった」
  rationale: 原文には「与える」「現れる」に相当する語がなく、イエスがまだ栄光を受けていなかったことと結びつけて、単に「霊はまだなかった」と述べる。解釈上の補足は脚注に置き、本文で一義的に解決しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「ご自分」「言われた」「おられなかった」でイエスへの自然な敬意を示した。長いギリシア語一文は、日本語での理解を助けるため三文に分けた。
