source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: ja
  text: モーセがあなたがたに律法を与えたではありませんか。それなのに、あなたがたのうち、律法を守る者は一人もいません。なぜあなたがたはわたしを殺そうとしているのですか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: 与えたではありませんか
  rationale: 文頭のοὐを伴う疑問は肯定の答えを予期する修辞疑問。ギリシア語完了形は現在にも及ぶ結果を含み得るが、日本語では歴史上のモーセによる授与を自然に表す過去形が適切である。
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語聖書で定着した標準的な固有名表記。
- source_word: τὸν νόμον
  choice: 律法
  rationale: モーセを明示しているため、一般的な法ではなく、イスラエルに与えられたモーセ律法を指す。日本語では「律法」が簡潔で明確。
- source_word: καὶ
  choice: それなのに
  rationale: 基本義は「そして」だが、ここでは律法を与えられたことと誰も実行していないことの対比を示すため、自然な逆接表現とした。
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: あなたがたのうち誰一人
  rationale: 全否定の強調を自然な現代日本語で保持する。
- source_word: ποιεῖ τὸν νόμον
  choice: 律法を守っていません
  rationale: 字義的には「律法を行う」だが、文脈上は律法に従い実践すること。「守る」が現代日本語で最も自然である。
- source_word: τί
  choice: なぜ
  rationale: ζητεῖτεと不定詞を伴い、理由を問う自然な日本語として訳した。
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: 殺そうとしている
  rationale: 現在形が示す継続中の意図・企てを、過度に硬くならない現代日本語で表す。
- source_word: ἀποκτεῖναι
  choice: 殺す
  rationale: 直接的で平明な対応語。「死なせる」「死刑にする」などの限定的解釈は加えない。
theological_decisions:
- issue: 「律法」の指示対象
  choice: モーセを通して与えられた律法
  alternative: 一般的・抽象的な道徳法則
  rationale: モーセが与えたものとして明示されるため、モーセ律法／トーラーを指すと判断する。ただし本文には「モーセ律法」などの説明語を足さず、原文の簡潔さを保つ。
- issue: 「誰一人、律法を守っていない」という非難の範囲
  choice: 聞き手である「あなたがた」全体への修辞的な全面非難としてそのまま訳す
  alternative: 律法を完全には守っていないという限定を補う
  rationale: 原文は限定を明示していないため、「完全には」などを補わず、発言の緊張と強さを保持する。
translation_notes:
  register: 明瞭で現代的ながら品位ある口調。修辞疑問は「ではありませんか」で肯定を予期する力を示し、後半は「ですか」で直接的な問いを保った。注を要するほど日本語上の重要な異読・翻訳差はないため、脚注は付していない。
