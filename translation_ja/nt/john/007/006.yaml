id: JHN.7.6
reference: John 7:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: ja
  text: そこで、イエスは彼らに言われた。「わたしの時[a]はまだ来ていません。しかし、あなたがたの時はいつでも整っています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの定められた時」とも訳せる。ギリシア語は、単なる時間一般ではなく、ふさわしい時機や定められた時を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の兄弟たちの言葉を受けた応答であることを、現代日本語の自然な物語接続で示す。推論と叙述の継続の両方に適する。
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: イエスは……言われた
  rationale: ギリシア語は歴史的現在形だが、日本語の物語として自然な過去形で訳した。イエスに対する通常の敬意を表す「言われた」を用いた。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 与格の間接目的語を簡潔に訳し、文脈上の指示対象を本文で説明しすぎない。
- source_word: καιρός
  choice: 時
  rationale: 単なる時間の流れではなく、ふさわしい時機や定められた時を指し得るが、本文では意味を一つに限定しない簡潔な「時」とした。語義の幅は脚注で示す。
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: わたしの時
  rationale: 強調された所有の対比を自然な日本語で保ち、「時」や「時刻」以上の神学的説明を本文に持ち込まない。
- source_word: οὔπω πάρεστιν
  choice: まだ来ていません
  rationale: 「まだ現れていない／到来していない」という時間的意味を、自然な現代日本語で表す。
- source_word: δὲ
  choice: しかし
  rationale: イエスの時と彼らの時との明確な対照を示す。
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: あなたがたの時
  rationale: 前半の「わたしの時」との対応を保ち、対照構造を明瞭にする。
- source_word: πάντοτέ ἐστιν ἕτοιμος
  choice: いつでも整っています
  rationale: πάντοτεの「いつでも」とἕτοιμοςの「備えができている／整っている」を保ちつつ、過度に解釈的な「いつでも都合がよい」を避けた。
theological_decisions:
- issue: ヨハネ文書におけるイエスの「時」の意味
  choice: 本文では「わたしの時」と訳した。
  alternative: 「わたしの定められた時」または「わたしの時機」
  rationale: ヨハネ福音書ではイエスの時が使命や栄光と神学的に結びつくことがあるが、ここで使われる語はὥραではなくκαιρόςである。本文でその含意を特定せず、原文の語彙上の緊張と文脈的含意を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、発言には落ち着いた品位を持たせた。「わたしの時」と「あなたがたの時」の平行と対照を維持し、神学的意味を本文で過度に説明しないようにした。
