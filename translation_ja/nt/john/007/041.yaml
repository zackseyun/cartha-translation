  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: ja
  text: ほかの人々は、「この人がメシアだ」と言っていた。しかし、別の人々は、「まさか、メシアがガリラヤから来るはずがあるだろうか」と言っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: ほかの人々
  rationale: 群衆の中の別の一群を示す複数の実質的形容詞。後続する対立する一群との区別を自然な日本語で表す。
- source_word: ἔλεγον
  choice: 言っていた／言った
  rationale: 未完了過去は群衆の中で続いていた発言を示す。第一の用例では「言っていた」と明示し、第二の用例は日本語の反復を避けて「言った」としたが、同じ継続的な場面の発言として読める。
- source_word: Οὗτός ἐστιν
  choice: この方こそ…だ
  rationale: 人物を指す敬意ある自然な指示表現とし、同定の力を「こそ」で表した。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名ではなく、待望されている油注がれた者という称号として用いられているため。
- source_word: οἱ δὲ
  choice: しかし、別の人々は
  rationale: δέの対照と、異なる一群を導入する複数冠詞の働きを明示する。
- source_word: Μὴ γὰρ
  choice: まさか…はずはないだろう？
  rationale: 否定の答えを予期する修辞疑問と、γάρの驚き・反論を伴う語気を自然な日本語で表す。
- source_word: ἐκ τῆς Γαλιλαίας
  choice: ガリラヤから
  rationale: 出身地・起源を表すἐκを簡潔に訳した。
- source_word: ἔρχεται
  choice: 出る
  rationale: ここでは到来そのものより、メシアがどこから現れるかという起源・出現地が論点であるため、「来る」より自然な「出る」を採用した。
theological_decisions:
- issue: Χριστόςという称号の訳
  choice: メシア
  alternative: キリスト
  rationale: 群衆が待望の人物の出現を論じている文脈なので、称号としてのヘブライ的・ユダヤ的背景を伝える「メシア」が適切。日本語では「キリスト」が固有名のように受け取られやすい。
- issue: 修辞疑問が予期する答え
  choice: 「まさか…はずはないだろう？」
  alternative: 「メシアはガリラヤから来るのだろうか？」
  rationale: μήで始まる疑問は否定の答えを予期する。その含みを保ちつつ、話者の主張を叙述文に変えないよう疑問形を維持した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「この方」は人物への自然な指示、「まさか…はずはないだろう？」は群衆の反論的な口調を示す。本文に脚注は設けない。
