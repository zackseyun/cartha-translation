lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: 答えた
  rationale: 対話における応答を表す標準的な物語叙述として、自然かつ原文に近い。
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた結果・展開を、現代日本語の自然な物語の流れで示す。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 与格の間接目的語を明示し、ファリサイ派の人々が前節の者たちに応答したことを保つ。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 当時のユダヤ教内の集団名であることが一般読者にも明確になる標準的な表現。
- source_word: Μὴ καὶ ὑμεῖς
  choice: あなたがたまで…のか
  rationale: καίの「あなたがたまで」という追加・驚きの含みと、μήによる否定の答えを予期する修辞疑問の響きを、過度な補足なしに表す。
- source_word: πεπλάνησθε
  choice: 惑わされた
  rationale: πλανάωの完了受動形が示す、他者によって誤りへ導かれた状態を簡潔に表す。「だまされた」という意味も文脈上可能なため脚注に残す。
theological_decisions:
- issue: μήで始まる疑問文の修辞的な力
  choice: 「あなたがたまで…のか」とし、否定の答えを予期する非難と驚きを語調に含ませる。
  alternative: 「まさか、あなたがたまで惑わされたのではあるまいな。」
  rationale: 原文は話者が否定の答えを期待しているが、「まさか」や「あるまいな」を加えると日本語ではその期待を原文以上に明示するおそれがある。簡潔な疑問形によって緊張を保つ。
translation_notes:
  register: 明快な現代標準日本語を用いながら、ファリサイ派の人々の驚きと非難を帯びた修辞疑問を簡潔に保った。「まで」により、彼らが聞き手を意外な同調者と見なした含みを表した。
