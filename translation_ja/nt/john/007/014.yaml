  text: Ἤδη δὲ τῆς ἑορτῆς μεσούσης ⸀ἀνέβη Ἰησοῦς εἰς τὸ ἱερὸν καὶ ἐδίδασκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/014.yaml
  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: ja
  text: 祭りがすでに半ばになったころ[a]、イエスは神殿の境内[b]に上り、教えておられた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「祭りの中ごろになったとき」。
    reason: lexical_alternative
  - marker: b
    text: ここで「神殿の境内」と訳したギリシア語はἱερόνで、内殿だけでなく、中庭などを含む神殿域全体を指す。
    reason: cultural_note
  - marker: c
    text: ギリシア語の未完了過去形は、教える行為が続いていたことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: すでに
  rationale: 祭りの進行がすでに半ばに達していたことを明示する、自然で簡潔な訳語。
- source_word: δὲ
  choice: （独立した接続語を置かない）
  rationale: ここでは強い逆接ではなく緩やかな物語の移行を示す。日本語では文脈と「も」によって自然に流れが伝わるため、機械的に「さて」「しかし」を加えない。
- source_word: τῆς ἑορτῆς μεσούσης
  choice: 祭りも……半ばになったころ
  rationale: 属格独立構文の時間的意味と、祭りが中ほどに達した状態を自然な現代日本語で表す。「半ば」は厳密な一点にも、その前後の時期にも理解できる表現である。
- source_word: ἀνέβη
  choice: 上り
  rationale: ἀναβαίνωの方向性を保ち、神殿へ上って行く動きを簡潔に表す。
- source_word: Ἰησοῦς
  choice: イエス
  rationale: 日本語で定着している固有名詞の表記。
- source_word: εἰς τὸ ἱερὸν
  choice: 神殿の境内に
  rationale: ἱερόνは内殿だけでなく中庭を含む神殿域全体を指すため、日本語で場面を誤解しにくい「神殿の境内」とした。εἰςの方向性は助詞「に」で表す。
- source_word: ἐδίδασκεν
  choice: 教えておられた
  rationale: 未完了過去の継続的な様相を保つ。「教え始めた」のような開始の意味は本文に明示されていないため加えない。敬意を含む自然で品位ある叙述とした。
theological_decisions:
- issue: ἱερόνが指す範囲
  choice: 内殿に限定せず、中庭を含む神殿の境内を指す
  alternative: 一般的に「神殿」とだけ訳す
  rationale: ἱερόνとναόςの語義上の区別を保ち、イエスが公に教えていた場所を内殿と誤解させないため。これは教派的解釈ではなく、語彙的・文化的な明確化である。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「神殿の境内」で歴史的な場所の範囲を明確にし、「教えておられた」で未完了過去の継続性を自然に表現した。
