id: JHN.7.3
reference: John 7:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: ja
  text: そこで、イエスの兄弟たちは彼に言った。「ここを去ってユダヤへ行きなさい。あなたがしている業を、あなたの弟子たちも見るように[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「見るでしょう」または「見ることになります」。ギリシア語の動詞は未来形ですが、ここでは目的を表す節の中に置かれています。また、この語には「じっと見る」「目の当たりにする」という含みもあり得ます。
    reason: 未来形という語形と、θεωρέωの「見る」の意味の幅を示しつつ、目的節における用法を注記するため。
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受ける推論的・継起的な接続を、現代日本語で自然に表す。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: イエスの兄弟たち
  rationale: 男性複数形と文脈に従い、家族関係を示す「兄弟たち」とした。日本語で指示対象が明確になるよう「イエスの」と表した。
- source_word: Μετάβηθι ἐντεῦθεν
  choice: ここを去って
  rationale: 現在地から離れるよう命じるアオリスト命令形の直接的な力を、簡潔で自然な表現にした。
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: ユダヤへ行きなさい
  rationale: 移動を命じる表現と地名を、標準的で明瞭な日本語にした。
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: あなたの弟子たちも……見るためです
  rationale: ἵναの目的の意味と、καὶの「も」を保った。μαθηταίはヨハネ文書での師弟関係を示す「弟子たち」とした。
- source_word: θεωρήσουσιν
  choice: 見る
  rationale: 注意深く目にすることを含み得る動詞だが、ここでは目的節の中で自然な「見る」とした。未来直説法の形が持つ別の表し方は脚注で示した。
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: あなたがしている業
  rationale: σοῦと関係節の内容を日本語で重複なく表した。「業」はヨハネ福音書でのἔργαの主題的な響きを保つ。
theological_decisions:
- issue: 「イエスの兄弟たち」の指示対象
  choice: 物語上、イエスの家族である兄弟たちを指す表現として訳す
  alternative: より広い親族・近親者を指す可能性を訳文に織り込む
  rationale: 本文は通常の家族語を用い、7章3–5節では彼らがイエスに語りかけている。訳文では本文以上の教理的結論を加えず、「兄弟たち」と率直に表した。
- issue: ἵνα節内の未来直説法 θεωρήσουσιν
  choice: 目的を表す「見るためです」
  alternative: 結果・予測を前面に出す「見ることになります」または「見るでしょう」
  rationale: ἵναが目的を導く構文を本文で明確にしつつ、動詞形そのものが未来直説法である点は脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、命令は自然で直接的な「行きなさい」とした。「業」はやや格調を保ちながらも聖書読者に理解しやすく、ヨハネ福音書における主題的な語の連続性を保つ。
