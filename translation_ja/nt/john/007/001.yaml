id: JHN.7.1
reference: John 7:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: ja
  text: その後、イエスはガリラヤを歩き回っておられた。ユダヤ地方を歩き回ろうとはなさらなかった。ユダヤ人たち[a]がイエスを殺そうとねらっていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」、または「ユダヤ人の指導者たち」とも訳せる。ヨハネ福音書で「ユダヤ人たち」は、しばしばユダヤ人全体ではなく、物語の文脈におけるユダヤ地方の当局者やイエスに敵対する人々を指す。
    reason: 語義上および文脈上の別訳を示し、民族全体を指すとの誤解を避けるため。
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: その後
  rationale: 複数形を直訳した「これらのことの後」より自然な現代日本語としつつ、ヨハネの時間的な物語展開を明確に示す。
- source_word: περιεπάτει / περιπατεῖν
  choice: 巡っておられた／巡ろうとなさらなかった
  rationale: 地域内を継続的に行き巡る意味を表し、同じ動詞の反復も日本語で保持する。不完了過去の継続性は「巡っておられた」で表した。
- source_word: ἐν τῇ Γαλιλαίᾳ / ἐν τῇ Ἰουδαίᾳ
  choice: ガリラヤを／ユダヤでは
  rationale: 移動を表す「巡る」と自然に結び付く助詞を用い、二地域の対照を「では」で明確にした。
- source_word: οὐ γὰρ ἤθελεν
  choice: 巡ろうとなさらなかった
  rationale: 意志を示すἤθελενを、不能ではなく本人がそうする意向を持たなかったこととして、敬意を保った自然な表現にした。γάρの説明関係は後続文全体の「からである」で示す。
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: 殺そうとしていた
  rationale: 不完了過去による継続的な敵意と、目的を示す不定詞を、明瞭で自然な日本語にまとめた。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文の通常の語義を本文に残す一方、この語が文脈上すべてのユダヤ人を一括して指すとは限らないことを脚注で明示する。
theological_decisions:
- issue: ヨハネ福音書における「οἱ Ἰουδαῖοι」の指示対象
  choice: 本文は「ユダヤ人たち」とし、文脈上の限定を脚注で説明する。
  alternative: 「ユダヤの人々」または「ユダヤ人の指導者たち」と本文で限定する。
  rationale: 語の表面上の意味とヨハネの用語法にある文脈的な幅の双方を保持するため。民族全体への包括的非難と誤読されることを避けながら、原文が明示していない限定を本文へ一意に持ち込まない。
translation_notes:
  register: 明瞭で品位ある現代標準語。「おられた」「なさらなかった」によりイエスへの自然な敬意を示すが、過度に古風な敬語は避けた。原文のπεριπατέωの反復は「巡る」で再現し、二つの理由節は日本語として読みやすいよう文を分けた。
