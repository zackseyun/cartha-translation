  to: その後、イエスはガリラヤを歩き回っておられた。ユダヤ地方を歩き回ろうとはなさらなかった。ユダヤ人たち[a]がイエスを殺そうとねらっていたからである。
  rationale: 地域内を継続して移動・活動するπεριπατέωの反復を「歩き回る」で一貫して表した。「ねらっていた」は、殺害のために継続して機会を求めていたἐζήτουνの含意を、殺害行為がすでに始まっていたと断定せずに伝える。脚注は本文の形式的訳を保ちながら、οἱ Ἰουδαῖοιの文脈上の指示範囲を明確にした。
