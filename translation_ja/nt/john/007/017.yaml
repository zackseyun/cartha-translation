id: JHN.7.17
reference: John 7:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: ja
  text: だれでも、神の御心を行おうとするなら、この教えが神からのものか、それとも、わたしが自分から[a]語っているのかが分かる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分の考えで」または「自分自身の権威によって」。ギリシア語は直訳すると「自分自身から」。
    reason: ἀπ’ ἐμαυτοῦが表す出所の意味を本文の「自分から」に保ちつつ、「自分自身の権威によって」という文脈上の含意を別訳として示すため。
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: だれでも、…行おうとするなら
  rationale: ἐάν＋接続法による一般的な条件を「なら」で表し、θέλωの意志・願望の含みを自然な現代日本語の「行おうとする」で示した。
- source_word: τὸ θέλημα αὐτοῦ
  choice: その方のみこころ
  rationale: αὐτοῦを明示的に「神」と置き換えず、文脈上の指示対象を保った。「みこころ」は神の意志を表す、現代日本語でも通用する尊重を帯びた表現である。
- source_word: ποιεῖν
  choice: 行う
  rationale: θέλημαと結びつくποιεῖνを、簡潔で自然な「みこころを行う」とした。
- source_word: γνώσεται
  choice: 分かる
  rationale: 将来生じる認識・識別を日本語の条件文に自然な「分かる」で表した。
- source_word: περὶ τῆς διδαχῆς
  choice: この教えが…なのか
  rationale: περίの論題を、日本語では「この教えについて…分かる」より自然な埋め込み疑問文として表現した。「この」は直前から論じられているイエスの教えを指す。
- source_word: πότερον ... ἢ
  choice: …なのか、それとも…のか
  rationale: 二つの選択肢を対照させる構文を、明瞭で自然な日本語の「…なのか、それとも…のか」で再現した。
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: 神から出たものなのか
  rationale: ἐκの起源・出所を「神から」で保ち、日本語として述語が自然になるよう「出たもの」を補った。
- source_word: ἀπ’ ἐμαυτοῦ
  choice: 自分から
  rationale: 原文の出所を示す表現を直截に保ち、「自分勝手に」などの評価的な意味は加えなかった。独自の権威によるという含みは脚注の別訳で示した。
- source_word: λαλῶ
  choice: 語っている
  rationale: 談話中の現在の発話を表す現在形を、自然な継続表現「語っている」で訳した。
theological_decisions:
- issue: αὐτοῦの指示対象
  choice: 「その方」とし、文脈上は神を指すが代名詞的表現を保つ。
  alternative: 「神のみこころ」
  rationale: 直後の「神から」により指示対象は明瞭だが、原文は神を名詞で反復していないため、その区別を保った。
- issue: ἀπ’ ἐμαυτοῦの意味合い
  choice: 「自分から」として、発言の出所という原文の像を保つ。
  alternative: 「自分の考えで」または「自分自身の権威によって」
  rationale: 独立した権威による発言という含意はあり得るが、本文でそれを明示すると原文以上に限定するため、別訳を脚注に置いた。
- issue: 意志を行うことと認識との関係
  choice: 原文どおり条件と帰結として訳し、両者の神学的関係を説明で限定しない。
  alternative: 従順であれば必ず教理的確信が得られる、という意味に説明的に展開する。
  rationale: 本文は意志・実行と教えの出所を知ることを結びつけるが、その仕組みや範囲までは明示していないため、緊張をそのまま保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、イエスの語りにふさわしい簡潔で dignified な調子を保った。「御心」ではなく読みやすい「みこころ」を採用し、過度に古風な語法を避けた。脚注記号は該当する「自分から」の直後に置いた。
