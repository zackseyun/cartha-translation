  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγὼ οἶδα αὐτόν, ὅτι παρ’ αὐτοῦ εἰμι κἀκεῖνός με ἀπέστειλεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/029.yaml
  text: I know him[a], because I am from him[b], and he sent me.
translation:
  language: ja
  text: わたしはその方を知っている。わたしはその方からの者であり[a]、その方がわたしを遣わされたからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その方のもとから来た」。ギリシア語は、その方を源または起源とすることを表し得る。
    reason: alternative_reading
  - marker: b
    text: また、ὅτιを内容を導く語と取り、「わたしがその方からの者であり、その方がわたしを遣わされたことを、わたしは知っている」とも訳せる。文脈上は理由を示す読みが自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: わたしは
  rationale: 明示された一人称代名詞を訳出し、周囲の人々との対照を担う強調を保った。
- source_word: οἶδα
  choice: 知っている
  rationale: 現在の知識状態を表す自然な現代日本語とした。
- source_word: αὐτόν
  choice: その方を
  rationale: 文脈上は父を指すが、本文では説明を加えず、敬意のある人称表現で指示関係を保った。
- source_word: ὅτι
  choice: からである
  rationale: 後続する二つの節全体を、イエスがその方を知っている理由として読む因果的用法を採った。内容を導く「ことを」という可能性は脚注に示した。
- source_word: παρ’ αὐτοῦ
  choice: その方から
  rationale: 属格を伴う παρά の源・起源の意味を自然に表し、単なる場所や使命への限定を避けた。
- source_word: εἰμι
  choice: 出た者であり
  rationale: 直訳的な「その方からである」は不自然なため、起源を表す日本語にした。ただし移動だけに限定する「来た」よりも存在・由来の含みを残した。
- source_word: κἀκεῖνός
  choice: その方が
  rationale: καί と ἐκεῖνος の結合を、前節との連結と同一人物への指示が自然に伝わる形で訳した。
- source_word: με
  choice: わたしを
  rationale: 動詞「遣わされた」の直接目的語として明示した。
- source_word: ἀπέστειλεν
  choice: 遣わされた
  rationale: 単なる移動の「送る」より使命を帯びた派遣を表す「遣わす」を用い、主語への敬意から尊敬形とした。アオリストの出来事性は保持した。
theological_decisions:
- issue: παρ’ αὐτοῦ εἰμι が示すイエスと父との関係
  choice: 「その方から出た者であり」として、源・起源と存在的な由来の含みを保つ。
  alternative: 「その方のもとから来た」「その方のそばにいる」
  rationale: 使命として来たことだけ、または空間的な近接だけに意味を狭めず、ヨハネ福音書におけるイエスの由来をめぐる神学的な深みを残した。
- issue: ὅτι の統語的機能
  choice: 因果を表す「からである」と読む。
  alternative: 内容を導く「わたしがその方から出た者であり、その方がわたしを遣わされたことを、わたしは知っている」
  rationale: 直前の対照と文脈から、後続節はイエスがその方を知る根拠を述べると判断したが、ギリシア語にある内容節の可能性も脚注に残した。
translation_notes:
  register: 明瞭で格調ある現代標準語。「その方」で父への敬意と代名詞の指示を保ち、「遣わされた」は尊敬語として用いた。理由を示す節が長いため、日本語として自然になるよう主節を先に置いた。
