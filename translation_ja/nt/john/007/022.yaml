source:
  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: ja
  text: このため、モーセはあなたがたに割礼を与えました――もっとも、それはモーセに由来するのではなく、父祖たちに由来するのですが[a]――。そして、あなたがたは安息日にも男性に割礼を施します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「先祖たちに由来する」。ここでの「父祖たち」は、割礼がモーセに先立つ父祖たちに由来することを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前の文脈を受けつつ、ここでイエスが説明を続ける因果的・説明的なつながりを簡潔に示す。
- source_word: Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν
  choice: モーセはあなたがたに割礼を与えました
  rationale: 完了形δέδωκενが示す、過去に与えられて現在も効力を持つ制度という含みを、日本語では文脈に委ねつつ自然に表した。「割礼」は行為だけでなく制度・慣行を指す。
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: もっとも、割礼はモーセからではなく、父祖たちから始まったものです
  rationale: 挿入的な歴史説明として読みやすくし、ἐκの起源・由来の意味を「から始まった」で明示した。「父祖たち」は族長時代の先祖を指す聖書的用語として保った。
- source_word: ἐν σαββάτῳ
  choice: 安息日にも
  rationale: 一般的・慣習的な安息日の実践を指す。「にも」は、安息日であっても割礼を行うという論旨を自然に示す。
- source_word: περιτέμνετε ἄνθρωπον
  choice: 人に割礼を施しています
  rationale: 現在形の慣習的な意味を「しています」で表した。日本語の「人に割礼を施す」は対象が男性であることが慣行上明らかで、「一人の男に」より自然で品位がある。
theological_decisions:
- issue: 「父祖たち」の指示対象
  choice: 割礼がモーセ以前の族長たちに由来することを示す
  alternative: イスラエルの先祖全般を広く指す
  rationale: 文脈上、割礼がモーセ律法より前から存在したという歴史的・法的な点が中心である。訳文は族長たちへの言及を保ち、特定の教派的解釈を付加しない。
- issue: διὰ τοῦτοと後半のκαίの関係
  choice: 冒頭を前文からの説明的接続とし、後半を「それで」で続ける
  alternative: 「このため」を後半の「安息日にも割礼を施す」に直接結び付ける
  rationale: ギリシア語の構文には句読法上の難しさがある。本文では自然な説明の流れを示しつつ、脚注で別の区切り方を提示して曖昧さを保持する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、挿入句はダッシュで示した。「父祖たち」「安息日」「割礼」は聖書本文として定着した語を保持しつつ、全体の語順と敬体を自然に整えた。
