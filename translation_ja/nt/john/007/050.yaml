id: JHN.7.50
reference: John 7:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: ja
  text: 以前イエスのもとに来たことがあり[a]、彼らの一人であったニコデモが、彼らに言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「以前彼のもとに来た者」と、代名詞を用いる。文脈上、「彼」はイエスを指す。
    reason: 本文で補った指示対象を明示しつつ、原文が代名詞を用いることと冠詞付き分詞による人物説明を正確に示すため。
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在形だが、日本語の物語文として自然な過去形を用い、発話を導入する機能を保った。
- source_word: Νικόδημος
  choice: ニコデモ
  rationale: 日本語聖書で広く定着した人名表記を採用した。
- source_word: πρὸς αὐτούς
  choice: 彼らに
  rationale: 発話動詞とともに用いられた πρός と対格は発言の相手を示すため、簡潔に「彼らに」とした。
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: 以前イエスのもとに来たことがあり
  rationale: 冠詞付き分詞句がニコデモを説明する構造を、自然な日本語の連体的な説明として表した。πρότερον は「以前」、πρὸς αὐτόν は文脈上イエスのもとに来たことを指す。原文が固有名ではなく代名詞を用いる点は脚注で明示した。
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: 彼らの一人であった
  rationale: ニコデモがその集団に属していたという背景説明を保ち、理由を示す表現にはしなかった。
theological_decisions:
- issue: 「πρὸς αὐτόν」の αὐτόν が指す人物
  choice: 本文では文脈上の指示対象を「イエス」と明示する
  alternative: 原文の代名詞に沿って「その人」または「その方」とする
  rationale: ヨハネ3章1–2節との物語上のつながりから指示対象はイエスである。単独の節でも明瞭で自然な日本語にするため本文では名を補い、原文が代名詞であることを脚注に残した。
- issue: εἷς ὢν ἐξ αὐτῶν の論理関係
  choice: 所属を示す背景説明として訳す
  alternative: 「彼らの一人だったので」と因果的に訳す
  rationale: 分詞句そのものは因果関係を明示しないため、神学的・修辞的な動機を訳文で付加しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ギリシア語の挿入的な説明を日本語として自然な語順に整えつつ、ニコデモが以前イエスを訪ねた人物であり、かつ彼らの一人であるという二つの情報を保持した。
