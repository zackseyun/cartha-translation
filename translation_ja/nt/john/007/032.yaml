source:
  edition: SBLGNT
  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: ja
  text: ファリサイ派の人々は、群衆がイエスについてこうしたことをつぶやいている[a]のを聞いた。そして、祭司長たちとファリサイ派の人々は、イエスを捕らえる[c]ために役人たち[b]を遣わした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ひそひそ話している」「不平を漏らしている」。ギリシア語は、声を抑えた話や、不満を帯びた話を表すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「下役たち」または「神殿の警備の者たち」とも訳せる。ここでは、ユダヤ人指導者たちに仕える公的な係の者を指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「逮捕する」。ギリシア語は、より字義的には「捕らえる」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: 聞いた
  rationale: アオリスト直説法の出来事として、群衆の話を耳にしたことを自然な現代日本語で表す。
- source_word: τοῦ ὄχλου
  choice: 群衆
  rationale: その場に集まっていた人々を指すὄχλοςの一般的で明瞭な訳。
- source_word: γογγύζοντος
  choice: ひそひそ話している
  rationale: 声を抑えた話し方という語感を自然に表しつつ、「不平を言う」と断定して否定的意味を強めすぎない。別の語感は脚注に残す。
- source_word: περὶ αὐτοῦ ταῦτα
  choice: イエスについてこのようなことを
  rationale: περί＋属格を「〜について」、複数形ταῦταを文脈に即して「このようなこと」とした。日本語で指示対象が明瞭になるようαὐτοῦは固有名で表した。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 当時の祭司階級の指導者層を指す定着した訳であり、複数の大祭司が同時に在職していたとの誤解を避ける。
- source_word: ὑπηρέτας
  choice: 役人たち
  rationale: 宗教当局の命令を執行する公的な下役という機能を簡潔に示す。「神殿警備隊」ほど制度を限定せず、代案を脚注で示す。
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: イエスを捕らえるために
  rationale: ἵνα＋接続法の目的を明示し、πιάζωの身体的に確保する意味を「捕らえる」で保つ。文脈上の「逮捕する」は脚注に示す。
theological_decisions:
- issue: ὑπηρέταςの制度上の身分
  choice: 祭司長たちとファリサイ派の権威のもとで行動する「役人たち」
  alternative: 下役たち／神殿警備隊／警備の者たち
  rationale: イエスの拘束を命じられた公的な執行者であることは示しつつ、ギリシア語本文が明記しない具体的な組織名までは本文に持ち込まない。
- issue: πιάσωσινが表す行為
  choice: 捕らえる
  alternative: 逮捕する
  rationale: 法的逮捕という文脈は認められるが、原語のより基本的な「つかまえる、捕らえる」という意味を本文に残し、制度的な意味への限定を避ける。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、語調は簡略化しすぎないよう整えた。「ファリサイ人」より集団名として理解しやすい「ファリサイ派の人々」を用いた。原文の二つの節の連続は、日本語では「そこで」で因果的な展開を自然に示した。
