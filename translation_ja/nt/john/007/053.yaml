  text: Καὶ ἐπορεύθη ἕκαστος εἰς τὸν οἶκον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/john/007/053.yaml
  text: And[a] each went to his own home.
translation:
  language: ja
  text: そして[a]、人々はそれぞれ自分の家へ帰って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この節から、姦淫の現場で捕らえられた女性の物語（7章53節―8章11節）が始まる。この箇所全体は、3世紀のパピルス写本や4世紀のシナイ写本・バチカン写本など、現存する初期のギリシア語写本、および初期のコプト語訳・シリア語訳には見られない。一方、5世紀のベザ写本、ラテン語本文の伝統、後代のビザンツ系多数本文には含まれている。また写本によっては、ヨハネ21章25節の後やルカ21章38節の後など、別の位置に置かれている。このことは、この物語が当初は独立して伝えられ、後に本文伝承へ取り入れられた可能性を示す。本訳では、約千五百年にわたりキリスト教会で愛され、神学的・牧会的に大切に読まれてきたことを踏まえ、ここに収める。
    reason: textual_critical
lexical_decisions:
- source_word: Καί
  choice: そして
  rationale: 前の場面からのつながりを示す接続詞として自然に訳した。本文批評上、この語から一続きの物語が始まることは脚注で示す。
- source_word: ἐπορεύθη
  choice: 帰って行った
  rationale: 移動を表す動詞であり、行き先が各自の家なので、日本語では単なる「行った」より「帰って行った」が自然である。
- source_word: ἕκαστος
  choice: 人々はそれぞれ
  rationale: 単数形で一人一人の別々の行動を強調する語。「それぞれ」だけでは主語が不明瞭になりやすいため、文脈上の複数の人を「人々」で補った。
- source_word: οἶκον
  choice: 家
  rationale: 基本義は「家」であり、εἰς τὸν οἶκον αὐτοῦ は各自が自宅へ戻ることを表す自然な言い回しである。
theological_decisions:
- issue: ヨハネ7:53—8:11の本文上の位置づけ
  choice: 受け継がれてきた本文として訳文に収め、写本上の問題を脚注で明示する
  alternative: 本文から除外する、または括弧に入れる
  rationale: 指定されたビザンツ本文にはこの節があり、長い教会的受容もある一方、最古層の主要なギリシア語写本と古代訳には欠け、位置も移動するため、その緊張を隠さず読者に知らせる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての落ち着きと品位を保った。「人々」はギリシア語に明示されないが、ἕκαστοςを日本語として自然かつ明確に表すための最小限の補足である。
