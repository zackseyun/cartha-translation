source:
  edition: SBLGNT
  text: ⸂Ἐκ τοῦ ὄχλου οὖν⸃ ἀκούσαντες ⸂τῶν λόγων τούτων⸃ ⸀ἔλεγον· Οὗτός ἐστιν ἀληθῶς ὁ προφήτης·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: ja
  text: そこで、群衆の中のある人々は、これらの言葉を聞いて、「この方こそ、まことにあの預言者だ」と言っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あの預言者」は、モーセのような預言者として待ち望まれていた人物を指す可能性が高い（申命記18章15節参照）。ただし、これをより一般的に「その預言者」と理解する見方もある。
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: 群衆の中には……人々がいた
  rationale: 前置詞句の部分的な意味を自然な日本語で明示し、群衆全体ではなく、その中の一部が語ったことを表す。
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの発言を受けた展開・結果を示す接続語として、文脈に自然で明瞭な「そこで」を用いる。
- source_word: ἀκούσαντες
  choice: 聞いて
  rationale: 主動詞に先立つ行為を表すアオリスト分詞を、自然な連用形で表現する。
- source_word: τῶν λόγων τούτων
  choice: これらのことば
  rationale: 直前に語られたイエスの発言を指すため、平明で直接的な「これらのことば」とする。
- source_word: ἔλεγον
  choice: と言う人々がいた
  rationale: 未完了過去の継続的・反復的な側面を、日本語として不自然にならない形で表す。単発の一斉発言とは限定しない。
- source_word: Οὗτός ἐστιν
  choice: この方こそ……だ
  rationale: イエスを指す指示表現を敬意ある自然な日本語の「この方」で示し、「こそ」によって断定の力を表す。
- source_word: ἀληθῶς
  choice: まことに
  rationale: 発言の確信と荘重さを保つ、現代日本語でも理解しやすい表現。
- source_word: ὁ προφήτης
  choice: あの預言者
  rationale: 定冠詞を伴う特定の待望された人物という含みを日本語で伝えつつ、メシアと明示的に同一視せず、本文の曖昧さを保つ。
theological_decisions:
- issue: 「ὁ προφήτης」が指す人物
  choice: 称号的な「あの預言者」と訳し、申命記18章15節に関連する待望の預言者への言及である可能性を注で示す。
  alternative: 一般的な意味での「その預言者」または「預言者」、あるいは「メシア」と明示する。
  rationale: ヨハネ福音書の文脈ではモーセのような預言者への期待が考えられるが、本文自体はその人物をメシアと明確に同定していない。そのため、特定性を示しながら神学的緊張を残す。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「この方」「まことに」により発言の敬意と荘重さを保ち、「あの預言者」で特定の待望的人物という含みを自然に示した。
