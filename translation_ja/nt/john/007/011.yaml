  text: οἱ οὖν Ἰουδαῖοι ἐζήτουν αὐτὸν ἐν τῇ ἑορτῇ καὶ ἔλεγον· Ποῦ ἐστιν ἐκεῖνος;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: ja
  text: そこで、ユダヤ人たち[a]は祭りの間、イエスを捜しながら、「あの人はどこにいるのか」と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」とも訳せる。ヨハネ福音書のこの文脈では、特にユダヤ人の宗教指導者たちを指している可能性もある。
    reason: Ἰουδαῖοιの指示範囲には文脈上の幅があるため。
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けた物語の展開を、自然な現代日本語で示す。強い論理的帰結に限定しない。
- source_word: Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 語の基本的な意味を本文に保ち、この節だけから「指導者たち」などに限定しない。ヨハネ福音書の文脈ではユダヤ地方の人々や宗教当局を指し得るため、注で補う。
- source_word: ἐζήτουν
  choice: 捜しながら
  rationale: 未完了過去の継続的な動作を表し、同じく未完了過去の発言と自然につなぐ。目的語は日本語で明確にするため「イエス」とした。
- source_word: ἐν τῇ ἑορτῇ
  choice: 祭りの場で
  rationale: 既出の祭りにおける出来事であることを簡潔に示す。「祭りの間」も可能だが、ここでは探索が行われた場面を自然に表す。
- source_word: ἔλεγον
  choice: 言っていた
  rationale: 未完了過去が示す継続または反復的な発言を保つ。
- source_word: ἐκεῖνος
  choice: あの人
  rationale: 単なる「彼」よりも指示語の距離感を保ちつつ、日本語として自然にする。原語は男性単数を指すので、「人」を補っても指示対象を不当に限定しない。
theological_decisions:
- issue: ヨハネ福音書におけるἸουδαῖοιの指示対象
  choice: 本文では「ユダヤ人たち」とし、特定集団に狭めない
  alternative: 「ユダヤ地方の人々」または「ユダヤ人の指導者たち」
  rationale: この節自体は指示対象を明示的に限定していない。一般的な語義を本文に置きつつ、物語上より限定された集団を指す可能性を注に残す。
translation_notes:
  register: 明快で現代的ながら品位のある叙述。「あの人」はἐκεῖνοςの距離感を自然に伝える。注記号は対応箇所の意味に直接結びつくよう、「ユダヤ人たち」の直後ではなく文末に置いたが、注の対象は同語である。
