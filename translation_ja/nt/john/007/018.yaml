id: JHN.7.18
reference: John 7:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: ja
  text: 自分から語る者は、自分自身の栄光を求める[a]。しかし、自分を遣わした方の栄光を求める者こそ真実であり[b]、その人の内には不義がない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分から」は、「独自に」または「自分の権威によって」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「真実であり」は、「誠実であり」または「信頼できる者であり」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「不義」は、「不正」または「不公正」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: 自分から
  rationale: 字義に近い表現を保ちつつ、他者から遣わされた者との対比を自然な日本語で示す。「自分勝手に」まで意味を限定しない。
- source_word: λαλῶν
  choice: 語る者
  rationale: 実質的な名詞として働く現在分詞を、一般的・継続的な行為を表す自然な日本語にした。
- source_word: δόξαν
  choice: 栄光
  rationale: ヨハネ文書における神学的響きと、同節内の反復を保つ。文脈上「誉れ」の意味も含む。
- source_word: τὴν ἰδίαν
  choice: 自分自身の
  rationale: 自分に属するものという強調を表し、遣わした方の栄光との対照を明確にする。
- source_word: ζητεῖ
  choice: 求める
  rationale: 二つの節における同じ動詞の反復をそのまま保つ。
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: 自分を遣わした方
  rationale: 冠詞付き分詞の人格的主体を明瞭に示す。「方」により、自然で敬意ある現代日本語とした。
- source_word: οὗτος
  choice: 者こそ
  rationale: 指示代名詞の強調を、日本語では係助詞「こそ」によって自然に表した。
- source_word: ἀληθής
  choice: 真実な者
  rationale: 単なる発言の正直さに狭めず、人物の真実性・信頼性を表す幅を保つ。
- source_word: ἀδικία
  choice: 不義
  rationale: 不正・不公正・悪を含み得る倫理的、神学的な広がりを簡潔に保持する。
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: その人の内には…ない
  rationale: 存在構文とἐν αὐτῷの内的な人物評価を、明瞭な日本語で保持する。
theological_decisions:
- issue: 「自分から語る」と遣わした方の栄光を求めることの対比
  choice: 自己を源または基準として語り、自分の栄光を求める者と、遣わした方の栄光を求める者との対比として訳す。
  alternative: 「自分の権威で語る」または「独断で語る」と明示する。
  rationale: 原文は権威や独断の含意を持ち得るが、それだけに限定していないため、「自分から」で曖昧さとヨハネ的対比を保った。
- issue: ἀληθήςの人物評価
  choice: 「真実な者」とし、誠実さ・信頼性・真正さを含み得る表現にする。
  alternative: 「真実を語る者」または「誠実な者」とする。
  rationale: 原文は人物そのものをἀληθήςと述べており、発言内容だけに狭めない。
- issue: ἀδικίαの意味範囲
  choice: 「不義」として倫理的・神学的な広がりを保つ。
  alternative: 「不正」「不公正」「悪」とする。
  rationale: 特定の社会的不公正や個別の悪行だけに限定せず、原語の幅を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「者こそ」でοὗτοςの強調を自然に表し、「方」は遣わした主体への敬意を示す。原文の二つの「求める」と二つの「栄光」の対応を維持した。
