base_translation:
  language: en
  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: ja
  text: こうして、群衆の間に彼をめぐって分裂が生じた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: 分裂
  rationale: 人々の意見が割れ、集団内に亀裂が生じたことを表す語であり、文脈に合う自然で明確な訳語。
- source_word: οὖν
  choice: こうして
  rationale: 直前の議論を受けた結果を示す接続語。堅すぎず、物語の流れと因果関係を自然に伝える。
- source_word: ἐγένετο
  choice: 生じた
  rationale: 分裂が起こったことを表す。原文の「生じる、起こる」という出来事性を簡潔に保つ。
- source_word: ἐν τῷ ὄχλῳ
  choice: 群衆の間に
  rationale: 集まっていた人々の内部で分裂が生じたことを、現代日本語で自然に示す。
- source_word: δι’ αὐτόν
  choice: 彼をめぐって
  rationale: διά＋対格の原因を踏まえつつ、ここでは彼についての見解の相違が分裂を引き起こしたという文脈を自然に表す。「彼のために」より意味が明瞭。
theological_decisions:
- issue: αὐτόνの指示対象
  choice: 「彼」のまま訳し、文脈上イエスを指す
  alternative: 「イエスをめぐって」と明示する
  rationale: 直前の文脈から指示対象は明らかであり、原文どおり代名詞を保つことで、不必要な明示化を避ける。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての落ち着きと品位を保った。短い結果文として原文の簡潔さも維持している。
