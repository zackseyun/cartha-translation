id: JHN.7.49
reference: John 7:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ ὁ ὄχλος οὗτος ὁ μὴ γινώσκων τὸν νόμον ⸀ἐπάρατοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: ja
  text: しかし、律法[b]を知らないこの群衆は、呪われている[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「呪いの下にある」。
    reason: lexical_alternative
  - marker: b
    text: 「律法」は、ユダヤ人の律法、すなわちトーラーを指す。
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の発言との強い対比を、自然な現代日本語の逆接で表した。
- source_word: ὁ ὄχλος οὗτος
  choice: この群衆
  rationale: ὄχλοςの集合的な意味を保ちつつ、「暴徒」のような原文に必須でない否定的含意を避けた。
- source_word: ὁ μὴ γινώσκων
  choice: 知らない
  rationale: 冠詞付き現在分詞が「この群衆」を限定する働きを、簡潔な連体節で表した。
- source_word: τὸν νόμον
  choice: 律法
  rationale: この文脈ではユダヤ人の律法、すなわちトーラーを指すため、日本語聖書で一般的かつ明確な語を用いた。
- source_word: ἐπάρατοί εἰσιν
  choice: 呪われている
  rationale: 述語形容詞が示す、呪いを受けた状態にあるとの厳しい断定を自然な日本語で保った。ギリシア語の複数形は、集合名詞「群衆」に含まれる人々を指す。
theological_decisions:
- issue: この断罪を語り手自身の神学的断定として読ませるか
  choice: 話者たちが群衆を厳しく断罪する直接話法として、そのまま訳した。
  alternative: 「彼らによれば、この群衆は呪われている」のように、語り手との距離を明示する。
  rationale: 原文はイエスに敵対する者たちの直接話法であり、その苛烈さを弱めるべきではない一方、原文にない説明を加えて語り手の見解として承認または否認すべきでもない。
translation_notes:
  register: 明快で格調を保った現代標準日本語。話者の侮蔑的で断定的な口調を保ちつつ、「群衆」を「暴徒」などと過度に悪く描く語は避けた。脚注記号は説明対象に合わせ、[b]を「律法」の直後、[a]を「呪われている」の直後に置いた。
