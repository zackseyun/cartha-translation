id: JHN.7.27
reference: John 7:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: ja
  text: しかし、この人がどこから来たのか、私たちは知っている。だが、メシアが来るときには、どこから来たのか、だれも知らない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: しかし
  rationale: 直前の議論との対比を明確にしつつ、現代日本語として自然に表した。
- source_word: τοῦτον
  choice: この人
  rationale: イエスを指す具体的でやや強い指示表現を、自然な日本語で表した。
- source_word: οἴδαμεν
  choice: 私たちは知っている
  rationale: 話者たちが自分たちの持つ知識を主張していることを率直に表した。
- source_word: πόθεν ἐστίν
  choice: どこから来たのか
  rationale: 場所だけでなく由来・出自を問いうる表現であり、二つの節で同じ言い回しを保った。
- source_word: ὁ δὲ χριστός
  choice: だが、メシア
  rationale: δέによる対比を「だが」で示し、χριστόςはここでは待望される者の称号なので「メシア」とした。
- source_word: ὅταν ἔρχηται
  choice: 来るときには
  rationale: 不定の将来を含む表現を、期待される到来という文脈に合う自然な日本語にした。
- source_word: οὐδεὶς γινώσκει
  choice: だれも知らない
  rationale: 普遍的否定と知識についての主張を簡潔かつ明瞭に表した。
theological_decisions:
- issue: χριστόςの称号としての訳
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法ではなく、群衆が到来を期待する人物の称号として用いられているため。
- issue: メシアの出自に関する群衆の主張
  choice: 説明を加えず、発言としてそのまま訳す
  alternative: 「メシアがどこから現れるかは、だれにも分からない」などと解釈的に補う
  rationale: この言葉が語り手による教理的断定ではなく、群衆の認識や期待を報告するものであるという緊張を保つため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、群衆の対照的な論法と原文における「どこから」の反復を保持した。
