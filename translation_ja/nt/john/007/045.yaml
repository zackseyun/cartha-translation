  text: Ἦλθον οὖν οἱ ὑπηρέται πρὸς τοὺς ἀρχιερεῖς καὶ Φαρισαίους, καὶ εἶπον αὐτοῖς ἐκεῖνοι· Διὰ τί οὐκ ἠγάγετε αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: ja
  text: そこで、役人たちは祭司長たちとファリサイ派の人々のところに来た。すると、祭司長たちとファリサイ派の人々は役人たちに言った。「なぜ彼を連れて来なかったのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語上の展開と帰結を、自然な現代日本語で示す。
- source_word: ὑπηρέται
  choice: 下役たち
  rationale: ここでは宗教指導者たちの命を受けてイエスを捕らえに行った者たちを指す。「役人」より所属関係を示し、「警備兵」ほど具体化しすぎない。
- source_word: ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 複数形で、指導的な祭司層を指す新約聖書上の定着した表現。
- source_word: Φαρισαίους
  choice: ファリサイ派の人々
  rationale: 集団名を現代の一般読者に分かりやすく表す。
- source_word: Ἦλθον
  choice: 戻った
  rationale: 語そのものは「来た」だが、彼らが派遣元である祭司長たちとファリサイ派の人々のもとへ帰還したという文脈を自然に表す。
- source_word: ἐκεῖνοι
  choice: 祭司長たちとファリサイ派の人々は
  rationale: ギリシア語の指示代名詞が直前の宗教指導者たちを強く指すため、曖昧な「彼ら」ではなく指示対象を繰り返して明示する。
- source_word: Διὰ τί οὐκ ἠγάγετε αὐτόν
  choice: なぜ、あの者を連れて来なかったのか
  rationale: ἄγω の「導く／連れて行く・来る」の幅を保ちつつ、拘束して連行することが期待されていた文脈に合う自然な表現とした。αὐτόν は発話者から距離を置く「あの者」で受けた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ἐκεῖνοι の強調は脚注に退けず、主語を反復して本文に反映した。発話は権威者による詰問として「なかったのか」とした。
