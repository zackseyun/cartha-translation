  text: τινὲς δὲ ἤθελον ἐξ αὐτῶν πιάσαι αὐτόν, ἀλλ’ οὐδεὶς ⸀ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/044.yaml
  text: But some of them wanted to seize him[b][a], yet no one laid hands on him.
translation:
  language: ja
  text: しかし、彼らの中にはイエスを捕らえようとする者もいた。だが、だれもイエスを捕らえることはなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τινὲς δὲ
  choice: しかし、…何人かは
  rationale: τινέςの不特定の一部を「何人か」で自然に表し、δέは直前の群衆の反応との対照を示すため「しかし」とした。
- source_word: ἤθελον
  choice: …ようとしていた
  rationale: 未完了過去が示す継続的な意図を自然な日本語で表す。実行したとは断定しない。
- source_word: ἐξ αὐτῶν
  choice: 彼らのうち
  rationale: より大きな集団に属する一部という意味を明示し、原文の部分を表す表現を保つ。
- source_word: πιάσαι αὐτόν
  choice: イエスを捕らえよう
  rationale: πιάζωの「つかまえる、捕らえる」という基本的意味を保ちつつ、この文脈にある拘束・逮捕の含みも自然に伝える。代名詞は日本語で指示対象を明確にするため「イエス」とした。
- source_word: ἀλλ’ οὐδεὶς
  choice: それでも、だれも…なかった
  rationale: 意図と結果の強い対照を「それでも」で示し、οὐδείςを「だれも…ない」という標準的な否定表現にした。
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: イエスに手をかけなかった
  rationale: 敵対的に手を伸ばして身柄を押さえる慣用表現である。「手をかける」は文脈上、危害よりも捕縛を指すものとして理解でき、原文の身体的な比喩を保つ。
theological_decisions: []
