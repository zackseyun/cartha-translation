- from: しかし、彼らのうち何人かはイエスを捕らえようとしていた。それでも、だれもイエスに手をかけなかった。
  to: しかし、彼らの中にはイエスを捕らえようとする者もいた。だが、だれもイエスを捕らえることはなかった。
  rationale: 原文の不特定の一部（τινὲς ἐξ αὐτῶν）、継続的な意図（ἤθελον）、および意図に反して実際の拘束がなかったという強い対比（ἀλλ’ οὐδείς）を保った。「手をかける」が帯びる危害・殺害の含意を避けるため、ギリシア語の慣用句を文脈上明確な「捕らえることはなかった」と訳した。脚注を必要とする未解決の語義上の曖昧さはない。
