id: JHN.7.30
reference: John 7:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: ja
  text: そこで、人々はイエスを捕らえようとしていた[a]。しかし、だれもイエスに手を伸ばすことはなかった。イエスの時[b]がまだ来ていなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「逮捕しようとしていた」とも訳せる。ギリシア語は「つかむ、捕らえる」を意味し、この文脈では逮捕する意図が含まれると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「イエスの時」はヨハネ福音書に繰り返し現れる表現で、イエスの使命において神が定めた時、特にその苦難、死、復活、栄光を受けることに関わる時を指す。
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: 〜ようとした
  rationale: 未完了過去が表す継続的な企てを、自然な現代日本語で示す。単なる一回の動作としての「求めた」は避けた。
- source_word: οὖν
  choice: そこで
  rationale: 直前の議論を受けた物語上・論理上の展開を、硬すぎない現代日本語で示す。
- source_word: πιάσαι
  choice: 捕らえる
  rationale: 基本義である「つかむ、捕らえる」を保つ。文脈上は逮捕を意図するが、本文では法的意味に限定しない。
- source_word: οὐδεὶς
  choice: だれも〜なかった
  rationale: ギリシア語の全否定を明瞭で標準的な日本語にする。
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: イエスに手をかけなかった
  rationale: 相手を取り押さえることを表す慣用表現として自然であり、「手」という原文の表現も保持する。
- source_word: ὅτι
  choice: 〜からである
  rationale: だれも行動しなかった理由を明確に示す。
- source_word: οὔπω
  choice: まだ〜ていなかった
  rationale: 時間的な「まだ〜ない」を自然に表す。
- source_word: ἐληλύθει
  choice: 来ていなかった
  rationale: 過去のその時点まで「時」が到来していなかったという過去完了の関係を日本語の文脈で表す。
- source_word: ἡ ὥρα αὐτοῦ
  choice: イエスの時
  rationale: ヨハネ福音書で神に定められた使命の時を指す含意を保ちつつ、日本語として不自然になりやすい「彼の時」を避ける。本文では意味を死だけに限定しない。
theological_decisions:
- issue: ヨハネ福音書における「彼の時」の意味
  choice: 本文では「イエスの時」とし、内容を限定せずに保持する。
  alternative: 「イエスが死ぬ定めの時」または「イエスの時刻」
  rationale: この表現はイエスの苦難、死、復活、栄光化に関わる神に定められた時を指すが、この節自体はそれを死だけに限定していないため、ヨハネ特有の神学的な幅と緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「イエス」を繰り返して指示対象を明確にし、ヨハネ特有の「時」という表現を平板化せずに残した。
