id: JHN.7.13
reference: John 7:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: ja
  text: しかし、ユダヤ人たちを恐れて、イエスについて公然と話す者はだれもいなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この文脈では、より具体的に「ユダヤ人指導者たち」または「ユダヤ地方の権威者たち」を指す可能性がある。ヨハネ福音書の「ユダヤ人たち」は、ユダヤ人一般を指す場合もあれば、イエスに敵対したエルサレムの権威者たちを指す場合もある。
    reason: 原語の指示対象にある文脈的な曖昧さを示すため。
lexical_decisions:
- source_word: οὐδεὶς
  choice: だれも～なかった
  rationale: 否定を伴う不定代名詞を、現代日本語で自然な全面否定として表した。
- source_word: μέντοι
  choice: しかし
  rationale: 前節まで人々がイエスについてさまざまに論じていたこととの穏やかな逆接を示す。
- source_word: παρρησίᾳ
  choice: 公然と
  rationale: 人目をはばからず、公の場で隠さず語るという文脈上の意味を簡潔に表す。
- source_word: ἐλάλει
  choice: 話す者はだれもいなかった
  rationale: 未完了過去が示す、その場で継続していた状況を日本語として自然に表した。
- source_word: περὶ αὐτοῦ
  choice: イエスについて
  rationale: 代名詞の指示対象を日本語で明確にし、περί＋属格の意味を自然に訳した。
- source_word: διὰ τὸν φόβον
  choice: 恐れて
  rationale: 原因を表すδιά＋対格と名詞句の意味を、簡潔で自然な日本語の理由表現にした。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人たち
  rationale: 語の表面的な広がりを本文に残しつつ、この文脈で権威者層を指す可能性は脚注で示した。
theological_decisions:
- issue: ヨハネ福音書における「ユダヤ人たち」（τῶν Ἰουδαίων）の指示対象
  choice: 本文では「ユダヤ人たち」とし、文脈上の限定的な意味を脚注で示す。
  alternative: ユダヤ人指導者たち／ユダヤ地方の権威者たち
  rationale: 原語が持つ指示範囲の曖昧さを本文で保持しながら、ここでは特にエルサレムを中心とする権威者層を指しうることを明記し、ユダヤ人全体への敵対として誤読されるのを避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「公然と」によりπαρρησίᾳの公的で隠し立てのない発言という含意を保ち、「イエス」と明示して日本語での指示を自然にした。
