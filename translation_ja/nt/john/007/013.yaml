  source_fidelity: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων is accurately represented. 「しかし」 appropriately conveys μέντοι; 「公然と」 captures the openness/public boldness of παρρησίᾳ; and 「恐れて」 naturally expresses the causal force of διὰ τὸν φόβον. Explicitly naming 「イエス」 is a natural Japanese resolution of αὐτοῦ and does not add interpretation.
  naturalness: The sentence is clear, idiomatic modern standard Japanese, with a suitably restrained biblical register. The order 「ユダヤ人たちを恐れて、イエスについて公然と話す者はだれもいなかった」 is natural and readily understood.
  terminology: 「ユダヤ人たち」 formally preserves τῶν Ἰουδαίων without prematurely restricting its referent. The footnote responsibly explains the contextually possible reference to Jewish/Judean authorities in John without asserting that narrowing as certain or imputing hostility to Jewish people generally.
