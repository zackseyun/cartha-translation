  text: ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: ja
  text: あなたがたは私を捜すが、見つけることはない[a]。また、私がいる所には、あなたがたは来ることができない[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文のつながりを「あなたがたは私を捜す。そして、見つけることはない」と訳すこともできる。
    reason: 構文上の別訳
  - marker: b
    text: 別訳「あなたがたは来られない」。
    reason: 語句上の別訳
lexical_decisions:
- source_word: ζητήσετέ
  choice: 捜す
  rationale: 未来能動直説法・二人称複数。文脈はイエスの居場所を求めることなので、現代日本語で自然な「捜す」とした。未来性は文全体の予告によって表される。
- source_word: με
  choice: 私を
  rationale: イエスを指す一人称単数の目的格代名詞。
- source_word: οὐχ εὑρήσετε
  choice: 見つけることはない
  rationale: 否定された未来直説法を、過度な強調を加えず予告として表した。
- source_word: ὅπου
  choice: 所に
  rationale: 場所を示す関係副詞。「私がいる所に」とすることで、後続する移動動詞「来る」と自然につながる。
- source_word: εἰμὶ ἐγώ
  choice: 私がいる
  rationale: 明示されたἐγώによる対照を、主格を示す「私が」で保った。「そこに」など原文にない語は補わない。
- source_word: ὑμεῖς
  choice: あなたがたは
  rationale: 二人称複数の明示的主語。ἐγώとの対照が伝わるよう、訳文でも主語を明示した。
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: 来ることができない
  rationale: δύνασθεが表す能力・可能性の欠如を明示し、許可の拒否とは訳さない。
theological_decisions:
- issue: 「私がいる所に、あなたがたは来ることができない」という言葉が示す不能の性質
  choice: 理由や性質を限定せず、「来ることができない」と能力・可能性の欠如として訳す。
  alternative: 「来てはならない」のように禁止として訳す。
  rationale: 原文のδύνασθεは能力・可能性を表す。この節自体は、その不能が道徳的、霊的、裁きによるもの、または一時的なものかを明示していないため、解釈を訳文に持ち込まない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの厳粛な予告にふさわしい簡潔で品位ある調子を保った。「私」は現代的な表記とし、「あなたがた」で複数と主語の対照を明示した。
