id: JHN.7.16
reference: John 7:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη οὖν αὐτοῖς ⸀ὁ Ἰησοῦς καὶ εἶπεν· Ἡ ἐμὴ διδαχὴ οὐκ ἔστιν ἐμὴ ἀλλὰ τοῦ πέμψαντός με·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/016.yaml
  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: ja
  text: そこで、イエスは彼らに答えて言われた。「わたしの教えは、わたし自身のものではなく、わたしを遣わした方のものである。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしを遣わした方から出たものである」。ギリシア語の属格は、教えの帰属と出所の両方を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: そこで、イエスは彼らに答えて言われた
  rationale: οὖνの文脈を受ける接続を「そこで」で示し、ἀπεκρίθηとκαὶ εἶπενの二つの発話動詞を日本語でも自然な聖書叙述として保持した。
- source_word: Ἡ ἐμὴ διδαχή
  choice: わたしの教え
  rationale: διδαχήを、現代日本語で明瞭かつ非専門的な「教え」とし、ἐμὴの強調された所有を自然に表した。
- source_word: οὐκ ἔστιν ἐμὴ
  choice: わたし自身のものではなく
  rationale: 反復されるἐμὴの対比的強調を「自身」で示し、単なる所有だけでなく独自の出所ではないという含みも保った。
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: わたしを遣わした方のものである
  rationale: 省略された述語を日本語で補い、属格が示し得る所有と出所の両方を残した。「遣わした」はπέμπωの基本的意味を忠実に表す。
theological_decisions:
- issue: イエスの教えと、イエスを遣わした方との関係
  choice: 「わたし自身のものではなく、わたしを遣わした方のものである」
  alternative: 「わたしから出たものではなく、わたしを遣わした方から出たものである」
  rationale: 原文の所有・帰属を示す対照を保ち、教えの出所だけに限定しない。イエスと遣わした方との区別、および使命と教えの一致を示しつつ、それ以上の教理的説明を本文に持ち込まない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「方」により、遣わした者を敬意をもって指す。発話導入は原文の二重表現を保持しつつ、日本語として通る形にした。
