  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἔτι ⸂χρόνον μικρὸν⸃ μεθ’ ὑμῶν εἰμι καὶ ὑπάγω πρὸς τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: ja
  text: そこでイエスは言われた。「わたしは、あとしばらくの間、あなたがたと共にいます。そして、わたしを遣わされた方[a]のもとへ行きます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしを遣わされた方」は、ヨハネ福音書の文脈では父を指します。
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた物語上・論理上の展開を、自然な現代日本語で示す。
- source_word: Ἔτι χρόνον μικρόν
  choice: あとわずかな間
  rationale: ἔτιの「なお、あと」とχρόνον μικρόνの「短い期間」を一つの自然な表現にまとめ、残された時間が短いことを示す。
- source_word: μεθ’ ὑμῶν εἰμι
  choice: わたしがあなたがたと共にいる
  rationale: 現在の継続的な同在を率直に表し、「とどまる」という意味を不必要に補わない。
- source_word: καὶ ὑπάγω
  choice: その後、…行きます
  rationale: καίは前文に続く出来事を結び、時間表現を受ける日本語として自然な順序を示す。ὑπάγωの出発・移行の含みは、簡潔な「行きます」で保つ。
- source_word: πρὸς τὸν πέμψαντά με
  choice: わたしを遣わされた方のもとへ
  rationale: 冠詞付き分詞を敬意ある自然な日本語で表し、本文が明示していない「父」を訳文に直接補わない。πρόςの対人的な方向性は「もとへ」で示す。
theological_decisions:
- issue: 「わたしを遣わされた方」の同定
  choice: 本文では間接表現を保ち、「わたしを遣わされた方」とする。
  alternative: 「わたしを遣わされた父」と明示する。
  rationale: ヨハネ福音書の広い文脈では父を指すが、この節のギリシア語自体は父と明記していないため、その語り方を保つ。
- issue: ὑπάγωが含むイエスの出発の神学的意味
  choice: 「行きます」と簡潔に訳す。
  alternative: 「帰ります」または「去ります」と訳す。
  rationale: 文脈上は父のもとへの帰還を含むが、原語はここで「帰る」を明示していない。「行く」によって方向を保ちつつ、死・復活・昇天のどれか一つに限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある「です・ます」調。イエスの発言には「わたし」、複数の聞き手には「あなたがた」を用いた。脚注は本文末の該当文に付した。
