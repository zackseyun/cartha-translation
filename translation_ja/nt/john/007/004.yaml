id: JHN.7.4
reference: John 7:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: ja
  text: というのも、公に知られようとしながら、ひそかに何かを行う人はいません。[a] こうしたことを行うなら、自分を世に示しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「公の場で知られようとしながら」とも訳せる。ギリシア語の表現は、公然としていること、人目に触れることを強調している。
    reason: παρρησίαの語義には、公的な可視性と公に知られることの両面があり、本文だけではその幅をすべて表しにくいため。
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: というのも、…人はいません
  rationale: γάρの前文を説明する働きを「というのも」で示し、οὐδεὶςを現代日本語として自然な一般命題にした。
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: ひそかに事を行う
  rationale: τιの不定の目的語を「事」で表し、ἐν κρυπτῷの隠密性を「ひそかに」で保持した。
- source_word: ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: 公の場に出ようとしながら
  rationale: この文脈のπαρρησίαは大胆な発言より、公然性・公的な可視性を指す。αὐτόςによる主語の強調は、「自ら」を不自然に加えず、対照的な構文全体で表した。
- source_word: εἰ ταῦτα ποιεῖς
  choice: こうしたことを行っているのなら
  rationale: 現在形の継続的・現実的な含みを自然な日本語で示しつつ、条件文の含みを解消しない。
- source_word: φανέρωσον σεαυτὸν
  choice: 自分を…示しなさい
  rationale: φανερόωの公に明らかにする意味と、命令の直接的な調子を保った。
- source_word: τῷ κόσμῳ
  choice: 世に
  rationale: 直近の文脈では公衆を指し得るが、ヨハネ文書におけるκόσμοςの文学的・神学的響きを残すため「世」とした。
theological_decisions:
- issue: ヨハネ文書におけるκόσμοςの意味
  choice: 世
  alternative: 人々／世間
  rationale: ここでは公衆という意味が前面に出るものの、「世」はその意味に通じると同時に、ヨハネに特徴的な鍵語の響きを保持する。
- issue: 兄弟たちの条件文の含み
  choice: 行っているのなら
  alternative: 行っているのだから
  rationale: εἰの条件性を保ち、兄弟たちがイエスの行為を認めているのか、挑発的に疑っているのかを翻訳で決めつけない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、兄弟たちの率直で挑発的な語調を保った。「公の場に出る」は自然な表現だが、単なる移動ではなく公然性を意味することを脚注で補った。
