id: JHN.7.51
reference: John 7:51
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: ja
  text: 「私たちの律法は、まず本人から話を聞き、その人が何をしているのかを確かめてからでなければ、人を裁くことはないではないか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: ことはないではないか
  rationale: 否定の答えを予期する修辞疑問の力を、自然な現代日本語の反語表現で示した。
- source_word: ὁ νόμος ἡμῶν
  choice: 私たちの律法
  rationale: ニコデモが共同体の法的規範に訴えていることを、所有表現を保って訳した。「律法」は文脈上、ユダヤ人の法的・宗教的規範を指す自然な訳語である。
- source_word: κρίνει
  choice: 裁く
  rationale: 法的な判断を下すという広い意味を保ち、文脈が必ずしも要求しない「有罪とする」「断罪する」まで意味を強めない。
- source_word: τὸν ἄνθρωπον
  choice: 人を
  rationale: 定冠詞付き単数形はここでは特定人物ではなく代表的・一般的な人を指すため、日本語では自然な総称表現「人」とした。
- source_word: ἐὰν μὴ
  choice: てからでなければ
  rationale: 裁きに先立つ必要条件を示す構文として訳し、手続き上の順序を明確にした。
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: まず本人から話を聞き
  rationale: παρά＋属格が表す「その人から直接聞く」という意味と、πρῶτονの手続き上の先行性を保った。
- source_word: γνῷ
  choice: 確かめ
  rationale: この文脈では単なる状態としての「知る」より、事情を聞いて事実を把握するという起動的な意味が自然である。
- source_word: τί ποιεῖ
  choice: その人が何をしているのか
  rationale: 現在形ποιεῖの現在的・継続的な含みを保ち、「何をしたのか」と過去に限定しなかった。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。法的手続きに訴えるニコデモの発言として自然に響くようにしつつ、原文の修辞疑問、条件関係、本人から直接聞くという要素を保持した。
