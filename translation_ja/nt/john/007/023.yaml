source:
  edition: SBLGNT
  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: ja
  text: 人が、モーセの律法が破られないように[b]、安息日に割礼を受けるのなら[a]、私が安息日に一人の人をすっかり健やかにしたからといって[c]、あなたがたは私に腹を立てるのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「割礼を施される」とも訳せる。ギリシア語は直訳すると「割礼を受け取る」という慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「モーセの律法がないがしろにされないように」、または「無効にされないように」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「一人の人をすっかり健やかにした」という表現は、身体の一部に施す割礼と、人の全体を健やかにすることとの対比を際立たせている。
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: 割礼を受ける
  rationale: ギリシア語の「割礼を受け取る」という慣用表現を、日本語で自然かつ原文に近く表した。「割礼を施される」も可能だが、通常の現代日本語としては「割礼を受ける」が明快である。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 割礼を受ける者なので具体的には男性を指すが、日本語の「人」は文脈上その意味を自然に担い、不必要に硬い「男」を用いずに済む。
- source_word: ἐν σαββάτῳ
  choice: 安息日に
  rationale: 時を表す与格を、安息日の制度とその日の出来事の双方に適した標準的な日本語で訳した。
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: モーセの律法が破られないように
  rationale: λύωはここで律法を破る、無効にする、ないがしろにするという範囲を持つ。「破られない」は法に関する日本語として最も明快であり、受動形も保持する。
- source_word: χολᾶτε
  choice: 腹を立てる
  rationale: 怒りや憤りを表す動詞を、修辞疑問に合う自然な現代日本語とした。「激怒する」ほど強さを限定しない。
- source_word: ὅλον ἄνθρωπον
  choice: 一人の人を全身
  rationale: 割礼が身体の一部に関わるのに対し、イエスが人の全体を健やかにしたという対比を見える形で残した。日本語として意味が通るよう「一人の人を全身」と構成した。
- source_word: ὑγιῆ ἐποίησα
  choice: 健やかにした
  rationale: 「健康な状態にした」という原文の使役的な構文を保ち、「癒やした」とだけしてὅλονとの語の結び付きを弱めることを避けた。
theological_decisions:
- issue: 安息日の割礼と癒やしの比較が意味すること
  choice: モーセの律法を破らないために安息日にも行われる割礼を前提に、安息日に人の全体を健やかにすることの正当性を問う議論として訳した。
  alternative: 儀礼的な律法と一般的な慈愛の行為との対比として広く言い換える。
  rationale: 原文の論理は、受け入れられていた安息日の割礼から、人を全体として健やかにする行為へと論を進める点にある。律法を否定する後代の教理的対立を持ち込まず、この比較そのものを保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの修辞疑問と原文の条件構文を保持した。「全身健やかにした」はやや特徴的な表現だが、ὅλον ἄνθρωπονとὑγιῆ ἐποίησαの結び付き、および身体の一部と全体との対比を保存するために採用した。
