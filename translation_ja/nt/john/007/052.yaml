base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: ja
  text: 彼らは彼に答えて言った。「あなたもガリラヤ出身なのか。[a] よく調べて、確かめてみなさい。ガリラヤからは預言者は出ないのだ。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたもガリラヤ出身ではないだろうな」とも訳せる。ギリシア語の問いは、否定の答えを予期する形になっている。
    reason: lexical_alternative
  - marker: b
    text: 「ガリラヤから預言者は起こされない」とも訳せる。神が預言者を起こすという含みを持つ可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: 彼らは答えて言った
  rationale: ヨハネ文書に見られる二重動詞の語り口を保ちつつ、現代日本語として理解できる表現にした。
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: あなたもガリラヤの出身なのか
  rationale: μήが否定の答えを予期する問いであることは文脈と語調に委ね、本文では自然で侮蔑的な詰問として訳した。
- source_word: ἐκ τῆς Γαλιλαίας
  choice: ガリラヤから／ガリラヤの出身
  rationale: 出身を問う箇所では「ガリラヤの出身」、預言者の出現を述べる箇所では原文の起点の表現を保つ「ガリラヤから」とした。
- source_word: ἐραύνησον καὶ ἴδε
  choice: よく調べてみなさい。…ことが分かる
  rationale: 二つの命令の流れを自然な日本語で表し、実際に吟味して確認せよという挑戦的な語調を保った。
- source_word: προφήτης
  choice: 預言者
  rationale: 冠詞がないため、特定の終末的な『あの預言者』ではなく、一般に預言者を指す表現とした。
- source_word: οὐκ ἐγείρεται
  choice: 出ない
  rationale: ここでは預言者が現れる、起こるという意味を自然な日本語で表した。神によって起こされるという受動的含意の可能性は脚注に残した。
theological_decisions:
- issue: μήを伴う修辞疑問の否定予期
  choice: 本文では「あなたもガリラヤの出身なのか」と自然な詰問にする
  alternative: 「まさか、あなたもガリラヤの出身ではあるまい」
  rationale: 話者が否定の答えを期待している点を断定的に補いすぎず、原文の修辞的圧力は脚注で明示した。
- issue: ἐγείρεταιの態と神的受動の可能性
  choice: 「出ない」
  alternative: 「起こされない」
  rationale: 文脈上は預言者の出現を指す自然な中動・受動形として読める一方、神が預言者を起こすという含みも排除できないため、本文では自然さを優先し、代案を脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、宗教的・論争的場面にふさわしい格調を保った。「よく調べてみなさい」は相手を見下した挑戦の響きを自然に伝える。脚注記号は対応箇所の直後に配置した。
