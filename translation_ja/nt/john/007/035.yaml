  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: ja
  text: そこで、ユダヤ人たち[a]は互いに言った。「私たちが見つけられないような所へ、いったいこの人はどこへ行こうとしているのか。まさか、ギリシア人の間に離散しているユダヤ人たち[b]のもとへ行き、ギリシア人を教えようとしているのではあるまい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ地方の人々」。ギリシア語は、ユダヤ人一般を指すことも、文脈によってはユダヤ地方の人々を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の表現は、ギリシア人の間に散在していたユダヤ人共同体を指す。ギリシア人が離散していたという意味ではない。
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 語の通常の民族的・宗教的意味を保ち、本文に明記されていない「指導者たち」には限定しない。文脈によっては「ユダヤ地方の人々」も可能なので脚注に示す。
- source_word: πρὸς ἑαυτούς
  choice: 互いに
  rationale: この文脈では集団内で言葉を交わす相互的な意味であり、自然な現代日本語とした。
- source_word: Ποῦ οὗτος μέλλει πορεύεσθαι
  choice: いったいどこへこの人は行こうとしているのか
  rationale: μέλλει＋不定詞の将来への意向・見込みを「行こうとしている」で表し、οὗτοςの距離を置いた調子を「この人」に残した。
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: われわれが見つけられないような
  rationale: 直訳的な因果・結果のつながりを日本語の疑問文として自然に表した。能力そのものを明示する語は加えていない。
- source_word: ἡ διασπορὰ τῶν Ἑλλήνων
  choice: ギリシア人の間に離散しているユダヤ人たち
  rationale: διασποράが異民族の間に散在するユダヤ人共同体を指すことを、現代の一般読者に誤解なく伝える。τῶν Ἑλλήνωνを、ギリシア人から成る離散ではなく、彼らの間にある離散として解した。
- source_word: τοὺς Ἕλληνας
  choice: ギリシア人
  rationale: 通常の民族・文化的意味を保ち、「異邦人」へ不必要に一般化しない。
- source_word: μὴ ... μέλλει
  choice: …ようとしているのではあるまい
  rationale: 否定の答えを予想するμή疑問文の修辞的な力を、やや品位ある自然な日本語で保持した。
theological_decisions:
- issue: ヨハネ福音書におけるἸουδαῖοιの範囲
  choice: ユダヤ人たち
  alternative: ユダヤ地方の人々
  rationale: この節は地域的意味に限定する明確な根拠を持たず、また「ユダヤ人指導者たち」と狭める根拠も本文にないため、広さを保つ訳を本文に置いた。現代の読者が全ユダヤ人への一括した非難と受け取らないよう、可能な別訳を脚注で示す。
- issue: διασπορὰ τῶν Ἑλλήνωνの指示対象
  choice: ギリシア人の間に離散しているユダヤ人たち
  alternative: ギリシア人の離散
  rationale: ユダヤ的用法のδιασποράは諸民族の間に散在するユダヤ人を指す。「ギリシア人の離散」とすると、散らされた者がギリシア人であるとの誤解を招くため、場所・関係を表す属格として訳した。
translation_notes:
  register: 明快な現代標準日本語を基本としつつ、発話の修辞的疑問には「ではあるまい」を用いて品位と否定回答への予想を表した。「離散」だけでは意味が不透明になりやすいため、指示対象を本文で明示した。
