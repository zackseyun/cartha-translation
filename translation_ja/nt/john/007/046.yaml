id: JHN.7.46
reference: John 7:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οἱ ὑπηρέται· Οὐδέποτε ⸂ἐλάλησεν οὕτως⸃ ⸀ἄνθρωπος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/046.yaml
  text: The officers answered[a], “Never has a man spoken like this.”
translation:
  language: ja
  text: 役人たちは答えた。「これまで、このように語った人は一人もいません[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人がこのように語ったことは、かつてありません。」
    reason: 原文は直訳すると「人がこのように語ったことは決してない」であり、日本語では出来事を主語にした表現も可能なため。
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: 答えた
  rationale: 対話の流れに合う自然な物語表現であり、アオリストの出来事を簡潔に示す。
- source_word: οἱ ὑπηρέται
  choice: 役人たち
  rationale: 7章32節、45節でイエスを捕らえるために遣わされた者たちを指す。単なる「しもべ」より職務上の役割が伝わり、「神殿警備員」ほど限定的に解釈しない表現とした。
- source_word: Οὐδέποτε
  choice: これまで…一人もいません
  rationale: 過去から発言時点まで一度もないという強い否定を、現代日本語で自然に表した。
- source_word: ἐλάλησεν
  choice: 語った
  rationale: 単に発声したことではなく、イエスの語り方と内容に対する反応であるため、品位ある「語った」が適切である。
- source_word: οὕτως
  choice: このように
  rationale: 話し方・あり方を示す様態の副詞として、原文の簡潔さと指示性を保つ。
- source_word: ἄνθρωπος
  choice: 人
  rationale: 単数形だが代表的・一般的な意味で用いられている。日本語の「人」は性別を不必要に補わず、原文の一般的な射程を自然に伝える。
theological_decisions:
- issue: ἄνθρωποςの単数・代表的用法
  choice: 人は一人もいません
  alternative: このように語った人は、かつていません／人がこのように語ったことはありません
  rationale: 原文の単数形を「人」で保ちつつ、「一人も…ない」によって代表的・包括的な否定を明確にした。日本語では文法上の男性形を再現する必要がなく、「男」とすると意味を不当に男性へ限定するため避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「役人」は職務を表しつつ「神殿警備員」と断定しない。「これまで」と「一人もいません」の組み合わせで、原文の強い否定を自然に表現した。
