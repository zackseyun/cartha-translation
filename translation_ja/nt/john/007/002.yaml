id: JHN.7.2
reference: John 7:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἦν δὲ ἐγγὺς ἡ ἑορτὴ τῶν Ἰουδαίων ἡ σκηνοπηγία.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/002.yaml
  text: The Jewish feast[a], the Feast of Tabernacles, was near.
translation:
  language: ja
  text: ユダヤ人の祭りである仮庵の祭り[a]が近づいていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「仮小屋の祭り」。
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: （訳文では明示しない）
  rationale: 弱い談話接続辞であり、この一節だけでも日本語の文脈上自然に推移が伝わるため、逆接や明示的な時間表現を加えず省略した。
- source_word: ἐγγὺς
  choice: 近づいていた
  rationale: ここでは時間的な近さを表す。「間近だった」も可能だが、祭りの時期が迫っていたことを自然な現代日本語で示した。
- source_word: ἑορτὴ
  choice: 祭り
  rationale: 宗教的な祝祭を表す一般的で自然な日本語。後続する祭りの名称ともよくつながる。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人の
  rationale: この属格は祭りがユダヤ人の祝祭であることを示す。論争的な含意を持たせず、原文の帰属関係を保った。
- source_word: σκηνοπηγία
  choice: 仮庵の祭り
  rationale: 仮設の小屋を伴う秋の巡礼祭を指す、日本語聖書で広く認識される名称。語義をより直接的に示す別訳を脚注に残した。
theological_decisions:
- issue: τῶν Ἰουδαίων の祭礼名における表現
  choice: ユダヤ人の祭り
  alternative: ユダヤの祭り
  rationale: 民族への敵対的・論争的評価ではなく、その祭りがユダヤ人に属する宗教的祝祭であることを表す文脈なので、原文の属格を明瞭に保った。
- issue: σκηνοπηγία の祭礼名
  choice: 仮庵の祭り
  alternative: 仮小屋の祭り
  rationale: 本文では定着した名称を用いて読みやすさを確保し、構成語の意味が見えやすい訳を脚注で示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「ユダヤ人の祭りである」によって同格関係を明示しつつ、簡潔で落ち着いた聖書本文の文体を保った。
