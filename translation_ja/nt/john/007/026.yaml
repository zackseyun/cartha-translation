id: JHN.7.26
reference: John 7:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: ja
  text: 「ほら、この人は公然と話しているのに、彼らは彼に何も言わない。ひょっとして、指導者たちは、この人がメシアだと本当に知ったのだろうか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「まさか、指導者たちは、この人がメシアだと本当に知ったのだろうか。」
    reason: μήποτεを、可能性へのためらいとして取るか、否定を予期する驚きとして強めに表すかには幅があるため。
lexical_decisions:
- source_word: ἴδε
  choice: 見なさい
  rationale: 話し手が周囲の注意を目の前の事実に向ける間投詞として、現代日本語で自然かつ明瞭に表した。
- source_word: παρρησίᾳ
  choice: 公然と
  rationale: 勇気そのものよりも、人前で隠さず語っているという文脈上の意味を表す。
- source_word: λαλεῖ
  choice: 話している
  rationale: 目の前で進行している発言を現在進行的に表した。
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: 彼らは何も言わない
  rationale: αὐτῷの相手関係は日本語では文脈から明らかなため、自然な形で表した。「非難しない」「制止しない」とは解釈的に限定しなかった。
- source_word: μήποτε
  choice: ひょっとして……のだろうか
  rationale: 驚きを伴うためらいがちな推測を表し、単純な否定疑問には固定しなかった。
- source_word: ἀληθῶς
  choice: 本当に
  rationale: 認識が事実であるかを問う副詞の力を、自然な現代日本語で保持した。
- source_word: ἔγνωσαν
  choice: 知った
  rationale: アオリストが示しうる、指導者たちがその認識に至ったという含みを保った。
- source_word: οἱ ἄρχοντες
  choice: 指導者たち
  rationale: この文脈のユダヤ人社会の権威者・統治者を、過度に制度化せず分かりやすく表した。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名の一部ではなく、群衆が論じる油注がれた者の称号として用いられているため。
theological_decisions:
- issue: ὁ χριστόςという称号の訳
  choice: メシア
  alternative: キリスト
  rationale: この箇所では期待されていた人物を指す称号として機能しており、ユダヤ的な文脈を明確に保つため「メシア」とした。
- issue: μήποτεを含む問いの方向性
  choice: 驚きを伴う可能性の問い
  alternative: 「まさか……ではあるまい」と否定を強く予期する問い
  rationale: μήποτεはここで、群衆の驚きとためらいを伴う推測を示す。肯定・否定の期待を日本語で一方に固定しすぎないようにした。
translation_notes:
  register: 群衆の直接話法として自然な口調を保ちつつ、俗語的にならない明瞭で品位ある現代標準日本語とした。「見なさい」で注意喚起を表し、「公然と」で公の場における開かれた発言を示した。
