  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: ja
  text: そこで、エルサレムの住民のうち何人かが言っていた。「この人は、彼らが殺そうとしている人ではないか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: 言っていた
  rationale: 未完了時制が表す、その場で続いていた、または繰り返されていた発言を自然な日本語で示す。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けた物語上の展開を示し、因果を過度に強めない自然な接続表現。
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: エルサレムの住民のうち何人か
  rationale: ἐκの部分集合の意味と、Ἱεροσολυμίτηςの「エルサレムの住民」という意味を明確かつ自然に表す。
- source_word: Οὐχ οὗτός ἐστιν
  choice: この人は……ではないか
  rationale: 肯定の答えを予期する否定疑問の修辞的な力を保ちつつ、現代日本語として自然にする。
- source_word: ζητοῦσιν ἀποκτεῖναι
  choice: 彼らが殺そうとしている
  rationale: 現在形の継続中の意図と、ζητέω＋不定詞がこの文脈で示す企図を、簡潔な現代日本語で伝える。
