- source_word: ἔμεινεν
  choice: とどまっていた
  rationale: その時点でガリラヤに引き続き滞在したという継続的な状態を、自然な物語文として表す。
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: ガリラヤに
  rationale: 地理的な所在を簡潔で自然な日本語にする。
