id: JHN.7.38
reference: John 7:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: ja
  text: 「わたしを信じる者は、聖書が言ったとおり、その人[a]の内[b]から、生きた水の川が幾筋も流れ出る。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その人」は通常、直前の「わたしを信じる者」を指すと理解される。イエス（メシア）を指すと見る解釈もある。
    reason: alternative_reading
  - marker: b
    text: 直訳「腹」または「胎」。ここでは、人の内なるところを表す比喩と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: わたしを信じる者
  rationale: 冠詞付き現在分詞を、継続的・一般的な信仰者を表す自然な日本語にした。εἰς ἐμέは、イエスに向けられた信頼を表す。
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: 聖書が言っているとおり
  rationale: 単数形のἡ γραφήを「聖書」とし、過去に語られ今も権威を持つ聖書の言葉を、日本語の引用定型として自然に表した。
- source_word: ποταμοὶ
  choice: 川が幾筋も
  rationale: 複数形が示す豊かさを、自然な日本語で明示した。「流れ」よりも原語の大きな水流の比喩を保つ。
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: その人の内から
  rationale: κοιλίαの字義は「腹」または「胎」だが、ここでは人の内なるところを指す比喩として理解できる。「その人」は最も近い先行詞である信じる者を指す読みを本文に採用し、別解を注記した。
- source_word: ῥεύσουσιν
  choice: 流れ出る
  rationale: 未来形の約束を、日本語では文脈上未来を表せる非過去形で自然に訳した。「ほとばしる」のような原文に明示されない勢いは加えていない。
- source_word: ὕδατος ζῶντος
  choice: 生きた水
  rationale: ヨハネ福音書で重要な比喩を説明に置き換えず保持した。現代日本語として分かりやすくしつつ、「流水」と「命を与える水」の両方を響かせる表現である。
theological_decisions:
- issue: αὐτοῦ（その人）の指示対象
  choice: 信じる者を指す
  alternative: メシアであるイエスを指す
  rationale: 文法上最も近い先行詞は「信じる者」であり、7:39の御霊についての説明ともよくつながる。ただし、イエスを命の水の源と見る構文上・解釈上の可能性は注で保持した。
- issue: κοιλίαの訳し方
  choice: 内
  alternative: 腹／胎
  rationale: 身体部位を表す字義を本文にそのまま置くと、現代の読者には解剖学的な意味に限定して受け取られやすい。本文では内なるところを示す自然な比喩表現とし、字義を注記した。
- issue: καθὼς εἶπεν ἡ γραφήの係り方
  choice: 続く「その人の内から…」という内容を聖書の言葉として導入する
  alternative: 直前の「わたしを信じる者」を修飾する
  rationale: ギリシア語には現代的な引用符がなく、係り方には一定の曖昧さがある。本文の語順を保つことで、その緊張を過度に解消しないようにした。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、イエスの宣言にふさわしい簡潔で荘重な調子を保った。「生ける水」という文語的な定型ではなく「生きた水」とし、現代の一般読者にも理解しやすくした。
