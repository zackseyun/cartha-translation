revisions:
- from: しかし、兄弟たちが祭りに上って行った後、イエスも上って行かれた。ただし、公然とではなく、ひそかに行くかのようにであった。[a]
  to: しかし、兄弟たちが祭りに上って行った後、イエスも上って行った。人目につくようにではなく、ひそかに、というような形でであった。[a]
  rationale: 原文の時間的順序、付加的な「イエスも」、公然性の否定、およびὡςによる限定を保持した。接続と結語を自然な現代標準日本語に改め、イエスのみへの敬語を避けて叙述文体を統一した。
