id: JHN.7.10
reference: John 7:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: ja
  text: しかし、兄弟たちが祭りに上って行った後、イエスも上って行った。人目につくようにではなく、ひそかに、というような形でであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ひそかに」。ギリシャ語は直訳すると「ひそかに、というような形で」であり、表現を幾分和らげている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: しかし、…後
  rationale: ὡςとアオリストによる時間関係を自然な日本語の「…後」で示し、δέが担う前文との緩やかな対比を「しかし」で保った。
- source_word: ἀνέβησαν ... ἀνέβη
  choice: 上って行った…上って行かれた
  rationale: エルサレムへの地理的・巡礼的な「上る」を保持する。最初の動作が先行することは「後」で明示し、イエスへの自然な敬意として後半は敬語形とした。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: 兄弟たち
  rationale: 直前の文脈で言及されるイエスの男性の兄弟たちを指すため、包括的な「きょうだい」ではなく「兄弟たち」とした。
- source_word: εἰς τὴν ἑορτήν
  choice: 祭りに
  rationale: 文脈上は仮庵の祭りであり、ἑορτήを簡潔で自然な「祭り」と訳した。
- source_word: τότε καὶ αὐτὸς
  choice: イエスも
  rationale: καίの付加的意味を「も」で保った。τότεの時間的順序は前半の「…後」によって自然に表現されるため、重複する「その時」を置かなかった。代名詞は日本語で指示対象を明瞭にするため「イエス」とした。
- source_word: οὐ φανερῶς
  choice: 公然とではなく
  rationale: φανερῶςの、公に人目につく仕方でという意味を直接表し、後続句との対比を保った。
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: ひそかに行くかのようにであった
  rationale: ὡςを省かず、「ひそかに」と断定するよりもわずかに限定された原文の言い方を「かのように」で保持した。日本語として意味を補うため「行く」を加えた。
theological_decisions:
- issue: 祭りに上らないという直前のイエスの発言と、この行動との関係
  choice: 兄弟たちの後に、イエスも公然とではない仕方で上ったことをそのまま訳す。
  alternative: 心変わりを示唆したり、7章8節との緊張を説明的な言い換えによって解消したりする。
  rationale: ギリシャ語本文は時間差と行き方の違いを述べるだけで、その関係を説明していないため、物語上の緊張を訳文でも残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文にふさわしい落ち着いた文体とした。「行かれた」は尊敬表現であり、原文にない神学的意味を付加する意図はない。脚注記号[a]は該当表現の直後に置いた。
