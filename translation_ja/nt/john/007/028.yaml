id: JHN.7.28
reference: John 7:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: ja
  text: そこでイエスは、神殿で教えながら、声を張り上げて言われた。「あなたがたはわたしを知っており、わたしがどこから来たのかも知っている。[a] しかし、わたしは自分から来たのではない。[b] わたしを遣わした方はまことの方である。[c] あなたがたはその方を知らない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この言葉は文脈上、皮肉や挑戦として聞くこともできるが、ギリシア語の形は断定文である。
    reason: alternative_reading
  - marker: b
    text: 「自分から」は、「自分の意思や権限だけで」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「まことの」は、「真の」「真正な」、また「信頼できる」という意味も含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: 声を張り上げて言われた
  rationale: 大声で公に語る動作を自然な現代日本語で表し、苦痛の叫びという不要な含みを避けた。
- source_word: ἐν τῷ ἱερῷ
  choice: 神殿で
  rationale: ἱερόνは内陣に限らず神殿境内全体を指し得る。日本語では簡潔で通例的な「神殿で」とした。
- source_word: διδάσκων ... καὶ λέγων
  choice: 教えながら、声を張り上げて言われた
  rationale: 分詞が示す、教えている最中の発言という状況を明確にした。日本語では「教えながら……言われた」とするのが自然である。
- source_word: Κἀμὲ οἴδατε
  choice: あなたがたはわたしを知っており
  rationale: καίを含むΚἀμέの強調を後続する「も」と並ぶ文脈の中で表した。断定形を保ち、疑問や皮肉を本文に加えていない。
- source_word: πόθεν εἰμί
  choice: わたしがどこから来たのか
  rationale: 地理的出身にも、より深い由来にも開かれた表現とし、ヨハネ福音書にある多層的な意味を狭めない。
- source_word: ἀπ’ ἐμαυτοῦ
  choice: 自分の考えで
  rationale: 字義的には「自分から」だが、ここでは独自の発意・権限で来たのではないという意味を、自然な日本語で表した。別訳を脚注に示した。
- source_word: οὐκ ἐλήλυθα
  choice: 来たのではない
  rationale: ギリシア語完了形の結果的な意味は文脈に含ませつつ、日本語として過度に不自然な時制表現を避けた。
- source_word: ἀληθινὸς
  choice: 真実な方
  rationale: 信頼できることと、真正・まことの存在であることの双方を響かせ得る表現を選んだ。
- source_word: ὁ πέμψας με
  choice: わたしを遣わした方
  rationale: 人格的な行為者を保ちつつ、原文にない「父」を補わなかった。
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: あなたがたはその方を知らない
  rationale: 先行詞を日本語で明示し、聞き手への直接的な指摘を保持した。
theological_decisions:
- issue: 「わたしを知っており、どこから来たのかも知っている」が断定、皮肉、挑戦のどれか
  choice: 本文では原文の文法どおり断定形とした
  alternative: 「わたしを知り、どこから来たかも知っているというのか」のような反語的表現
  rationale: 文脈上は皮肉や挑戦として聞こえる可能性があるが、ギリシア語は形式上断定文である。解釈を本文で固定せず、脚注で含みを示した。
- issue: 「どこから来たのか」が指すイエスの由来
  choice: 地理的出身と神的使命の双方に開かれた表現を維持した
  alternative: 地上の出身地だけ、または天からの由来だけに限定する訳
  rationale: ヨハネ福音書ではイエスの由来がしばしば重層的に描かれるため、原文以上に限定しなかった。
- issue: 「わたしを遣わした方」の明示的な同定
  choice: 「父」を補わず、関係的な呼称をそのまま訳した
  alternative: 「わたしを遣わした父」
  rationale: 文脈上の指示対象は理解できるが、この節のギリシア語本文は「父」と明記していないため、その緊張と表現を保った。
- issue: ἀληθινόςの意味領域
  choice: 「真実な方」とした
  alternative: 「まことの方」「真正な方」「信頼できる方」
  rationale: 発言の真実性だけに限定せず、ヨハネ文書で見られる「真にそうである、真正である」という含みも残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、イエスの公的で厳粛な発言にふさわしい品位を保った。敬語は地の文の「言われた」にとどめ、引用内は力強く直接的な語調とした。
