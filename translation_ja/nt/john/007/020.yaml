  text: ἀπεκρίθη ὁ ⸀ὄχλος· Δαιμόνιον ἔχεις· τίς σε ζητεῖ ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/020.yaml
  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: ja
  text: 群衆は答えた。「あなたは悪霊に取りつかれている[a]。だれがあなたを殺そうとしているのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたは悪霊を持っている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 対話における応答を表す標準的な物語叙述として、自然で明瞭な日本語にした。
- source_word: ὄχλος
  choice: 群衆
  rationale: その場にいる多数の人々を指す語であり、ヨハネ福音書の場面に合う簡潔な訳語。
- source_word: Δαιμόνιον ἔχεις
  choice: あなたは悪霊に取りつかれている
  rationale: 直訳は「あなたは悪霊を持っている」だが、日本語では不自然で意味も伝わりにくいため、当時の非難の内容を自然に表す慣用的な言い方とした。直訳は脚注に残した。
- source_word: τίς
  choice: だれが
  rationale: 明示された疑問代名詞を保ち、群衆の反論を修辞疑問として訳した。
- source_word: ζητεῖ
  choice: 殺そうとしている
  rationale: 現在形の継続的な企てを、後続の不定詞と合わせて自然な日本語で表した。
- source_word: ἀποκτεῖναι
  choice: 殺す
  rationale: 法的・道徳的含意を余分に加えず、動詞の直接的な意味を表した。
theological_decisions:
- issue: イエスに対する δαιμόνιον ἔχεις という非難の訳し方
  choice: 本文では「悪霊に取りつかれている」、脚注では直訳「悪霊を持っている」を示す。
  alternative: 「あなたは悪霊を持っている」
  rationale: 語句を群衆の敵対的な非難としてそのまま報告し、真実として承認する表現にはしない。日本語本文では意味が明瞭な慣用表現を用いつつ、原文の形は脚注で保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語。群衆の非難と修辞的な問いの鋭さを保ちつつ、過度に古風または説明的な表現を避けた。
