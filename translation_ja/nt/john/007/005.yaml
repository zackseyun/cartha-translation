  text: οὐδὲ γὰρ οἱ ἀδελφοὶ αὐτοῦ ἐπίστευον εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: ja
  text: というのも、イエスの兄弟たちでさえ、イエスを信じていなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスを信じなかった」とも訳せる。ギリシア語の動詞は未完了過去形で、過去における継続的な状態を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: ～さえ…なかった
  rationale: 否定を強める語として、兄弟たちも例外ではなかったという強調を自然な日本語で表す。
- source_word: γὰρ
  choice: というのも、～からである
  rationale: 前の文脈に対する理由・説明を示す接続関係を明確に保つ。
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: イエスの兄弟たち
  rationale: 文脈上の指示対象を明示し、男性複数形をそのまま表す。「兄弟」は親族を広く指す可能性もあるが、本文では解釈を加えず通常の訳語を採る。
- source_word: ἐπίστευον
  choice: 信じていなかった
  rationale: 未完了過去の継続的・状態的な含みを自然な日本語の「～ていなかった」で表す。
- source_word: εἰς αὐτόν
  choice: イエスを
  rationale: πιστεύω εἰς の対象に向かう信頼・信仰を、日本語で最も自然な「人を信じる」によって表す。指示対象を明瞭にするため固有名を用いる。
theological_decisions:
- issue: ヨハネ文書における πιστεύω εἰς αὐτόν の意味
  choice: イエスを信じる
  alternative: イエスに信頼を置く／イエスを信頼する
  rationale: 個人的な信頼を含み得る表現だが、この節自体がその信仰の内容や理由を詳述しているわけではないため、神学的説明を加えず、ヨハネ福音書で自然かつ一貫した表現にする。
- issue: ἀδελφοί の親族関係
  choice: 兄弟たち
  alternative: 近親者たち／親族たち
  rationale: 語は文脈によって近親者を指し得るものの、ここで関係を限定的に再解釈せず、基本的な意味を本文に置く。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「というのも……からである」で説明を示す γὰρ を保持し、代名詞の連続による曖昧さを避けるため、日本語本文では「イエス」を補っている。
