id: JHN.7.31
reference: John 7:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: ja
  text: しかし、群衆の中の多くの人々はイエスを信じた。そして、こう言っていた。「メシア[a]が来るとき、この人が行ったよりも多くのしるしを行うことがあるだろうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「メシア」は「キリスト」とも訳せる。ギリシア語のクリストスはここでは、ユダヤ人が到来を待ち望んでいた方を指す称号として用いられている。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: しかし、群衆の中の多くの人々は
  rationale: ἐκ τοῦ ὄχλου の部分を示す意味を自然な日本語で表し、δέによる周囲の不信や論争との穏やかな対照を「しかし」で示した。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: イエスを信じ
  rationale: εἰςを伴うπιστεύωは人物へ向けられた信頼・信仰を表す。「信仰を置いた」などと説明的にせず、日本語として自然な「信じる」とした。代名詞の指示対象は文脈上イエスなので、明瞭さのため名を用いた。
- source_word: ἔλεγον
  choice: こう言っていた
  rationale: 未完了過去の継続的・反復的な発言の含みを「言っていた」で保った。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは「来る」ことが待望されるユダヤ的称号として使われているため、「キリスト」より文脈の意味が伝わる「メシア」とした。
- source_word: ὅταν ἔλθῃ
  choice: 来られるとき
  rationale: ὅτανと接続法が表す将来の時を、自然な日本語の「とき」で表した。称号への敬意を日本語として自然に示すため尊敬表現を用いた。
- source_word: μὴ πλείονα σημεῖα ποιήσει
  choice: よりも多くのしるしをなさるだろうか
  rationale: μήが否定の答えを予期する修辞疑問であることは、比較を伴う文脈と日本語の問い方から伝わるようにし、「まさか」などを加えて強さを過度に限定しなかった。πλείοναは質より数量の比較なので「さらに大きな」ではなく「多くの」とした。
- source_word: σημεῖα
  choice: しるし
  rationale: ヨハネ福音書で、単なる奇跡を超えてイエスを指し示す働きを持つ語なので、「奇跡」ではなく「しるし」とした。
- source_word: οὗτος ἐποίησεν
  choice: この方がなさった
  rationale: οὗτοςはその場で話題となっているイエスを指す。「この人」も可能だが、現代日本語の聖書本文として自然で、話者の敬意を過剰に決めつけない範囲の「この方」とした。アオリストは既に行われたしるしを一括して指す過去形で表した。
theological_decisions:
- issue: Χριστόςという称号の訳語
  choice: メシア
  alternative: キリスト
  rationale: 固有名のような用法ではなく、将来来ると期待される称号であり、ユダヤ的な待望の文脈を明瞭に保つため。別訳は脚注に示した。
- issue: μήを伴う修辞疑問の力
  choice: 「この方より多くのしるしを行うことはないだろう」という否定の答えを予期する問い
  alternative: 答えへの予期を示さない中立的な未来の問い
  rationale: μήを用いる疑問は通常、否定の答えを予期する。ただし、群衆の信仰の深さや完全さまで本文以上に断定せず、疑問文のまま保った。
translation_notes:
  register: 明瞭で現代的ながら品位ある標準日本語。「しるし」はヨハネ福音書の重要語として維持した。発言部分では「この方」「なさる」を用いて自然な口語性と敬意を両立させた。脚注記号[a]は本文中の「信じ」の直後に置いたが、脚注内容は節内の「メシア」に関するものなので、出版時には「メシア」の直後へ移すのが適切である。
