  to: しかし、群衆の中の多くの人々はイエスを信じた。そして、こう言っていた。「メシア[a]が来るとき、この人が行ったよりも多くのしるしを行うことがあるだろうか。」
  rationale: アオリストのἐπίστευσανは「信じた」とし、未完了形のἔλεγονは「言っていた」で継続・反復の含みを保った。メシアという称号とヨハネ福音書で重要な「しるし」は維持した。μήを伴う修辞疑問は「行うことがあるだろうか」と訳して、否定的な答えを予期する力を示した。脚注アンカーを説明対象の「メシア」に移し、本文が明示しない敬称と尊敬語は除いた。
