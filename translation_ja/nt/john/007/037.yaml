  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: ja
  text: 祭りの最後の、最も重要な日に、イエスは立って、声を張り上げて言われた。「渇いている人はだれでも、わたしのところに来て飲みなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 祭りの終わりの日に
  rationale: ἐν＋与格の時を表す用法を「日に」で表し、δέは日本語では明示しなくても文脈の流れが自然であるため省略した。ἐσχάτῃは祭りの期間の「終わり」を指す自然な表現とした。
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: 大いなる日に
  rationale: μεγάλῃの強調を単なる「重要な」に弱めず、祭りの最終日を際立たせる表現として「大いなる」を用いた。「祭り」は前方にまとめ、日本語として自然な語順にした。
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: イエスは立って
  rationale: εἱστήκειが表す立った姿勢を保ち、続く大声での公的な呼びかけへ自然につないだ。
- source_word: ἔκραξεν λέγων
  choice: 声を張り上げて言われた
  rationale: κράζωの大きく公然と発声する意味を「声を張り上げて」で表した。λέγωνは日本語では独立した「言って」を重ねず、一つの自然な発話導入にまとめた。
- source_word: Ἐάν τις διψᾷ
  choice: 渇いている人はだれでも
  rationale: τιςの不特定・包括的な意味を「だれでも」で明示し、διψᾷの現在的な状態を「渇いている」とした。身体的・比喩的の双方に開かれた原文の像を保持した。
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: わたしのところに来て飲みなさい
  rationale: 二つの現在命令を一続きの招きとして自然に表した。日本語では主語の性を示す必要がなく、単数の不特定者への呼びかけも損なわれない。
theological_decisions:
- issue: 渇きと飲むことの比喩的意味
  choice: 「渇いている」「飲みなさい」という像をそのまま保つ
  alternative: 「いのちを求める者は、わたしを信じなさい」などと意味を説明して訳す
  rationale: この節自体は比喩を説明語に置き換えておらず、周辺文脈で展開される意味を本文で先取りしないため。身体的な渇きと霊的な招きの重なりも保持できる。
- issue: τιςと単数命令の表現
  choice: 「人はだれでも」とし、後続では日本語の自然な省略を用いる
  alternative: 男性を明示する代名詞を補う
  rationale: ギリシア語は文法上単数の不特定表現だが、性別を限定していない。日本語では代名詞を補わずに単数・一般的な招きを自然かつ正確に伝えられる。
- issue: 祭りの「大いなる日」
  choice: 評価を保って「大いなる日」と訳す
  alternative: 具体的に祭りの第七日または第八日と特定する
  rationale: 原文は日付を明示せず「最後の、大いなる日」とだけ述べるため、祭儀暦上の同定を本文に持ち込まず曖昧さを保つ。
translation_notes:
  register: 現代標準日本語。公の場での荘重な招きを示すため「声を張り上げて」「大いなる」を用いつつ、引用部は普通の読者に明快な語順とした。敬体ではなく聖書本文にふさわしい常体を採用した。
