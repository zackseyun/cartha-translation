id: JHN.7.12
reference: John 7:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ γογγυσμὸς ⸂περὶ αὐτοῦ ἦν πολὺς⸃ ἐν τοῖς ὄχλοις· οἱ μὲν ἔλεγον ὅτι Ἀγαθός ἐστιν, ἄλλοι ⸀δὲ ἔλεγον· Οὔ, ἀλλὰ πλανᾷ τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: ja
  text: 群衆の間では、イエスについて多くのささやきがあった[a]。ある者たちは「良い人だ」と言い、ほかの者たちは「いや、それどころか、群衆を惑わしている[b]」と言っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イエスについて多くのつぶやきがあった」または「不平をささやく声が多くあった」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「群衆をだましている」または「群衆を誤った道へ導いている」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: あれこれと小声で語る声
  rationale: 公然とした議論ではなく、低い声で交わされる不満やささやきという語感を、文脈上の賛否両論も含めて自然な現代日本語で表した。
- source_word: περὶ αὐτοῦ
  choice: イエスのことを
  rationale: 代名詞の指示対象を日本語で明瞭にしつつ、「彼について」という意味を保った。
- source_word: πολύς
  choice: 多く聞かれた
  rationale: そのような声が群衆の間に広くあったことを、日本語として自然に表した。
- source_word: ἐν τοῖς ὄχλοις
  choice: 群衆の間では
  rationale: 複数形が示す人々の集まりの中に、その話が広がっていた状況を表した。
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: ある者たちは……ほかの者たちは……
  rationale: 群衆の中で意見が二つに分かれていた対比を明確にした。
- source_word: Ἀγαθός ἐστιν
  choice: 良い方だ
  rationale: 原文にない「人」を補わず、イエスの人格に対する肯定的評価として自然で敬意ある日本語にした。
- source_word: Οὔ, ἀλλὰ
  choice: いや、それどころか
  rationale: 先の評価を否定し、正反対の評価を強く提示する構造を保った。
- source_word: πλανᾷ
  choice: 惑わしている
  rationale: 意図的な欺きと、誤った方向へ導く結果とのどちらにも開かれた語義を保てる表現を選んだ。
- source_word: τὸν ὄχλον
  choice: 群衆を
  rationale: 単数形の集合的な意味をそのまま自然に表した。
theological_decisions:
- issue: イエスに対する群衆の相反する評価
  choice: 肯定と非難の双方を直接話法で中立的に報告した。
  alternative: どちらか一方を語り手の評価として強調する。
  rationale: 本文は群衆の相反する判断を記しており、この節自体では語り手がいずれかを明示的に承認してはいないため、その緊張を保った。
- issue: πλανᾷが示す非難の強さ
  choice: 「惑わしている」
  alternative: 「だましている」「道を踏み外させている」
  rationale: 欺瞞の意図を断定せず、誤導という非難を十分に伝えるため。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての落ち着きと品位を保った。「良い方」は原文の形容詞述語を尊重し、「良い人」という補足を避けた。低声の噂、不平、ささやきにまたがる γογγυσμός の幅は本文と脚注で示した。
