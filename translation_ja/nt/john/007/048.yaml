  text: μή τις ἐκ τῶν ἀρχόντων ἐπίστευσεν εἰς αὐτὸν ἢ ἐκ τῶν Φαρισαίων;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: ja
  text: 指導者たち、あるいはファリサイ派の中で、彼を信じた者が一人でもいるだろうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、否定の答えを予想する形の疑問文。
    reason: μή τιςの修辞的含意を、本文の疑問形式を変えずに説明するため。
lexical_decisions:
- source_word: μή τις
  choice: 一人でもいるだろうか
  rationale: 否定の答えを予想する修辞疑問の形を保ちつつ、含意される「いない」を本文で断定せず、自然な日本語にした。
- source_word: ἐκ τῶν ἀρχόντων
  choice: 議員たち…の中で
  rationale: この文脈のἄρχοντεςはユダヤ人の公的な指導層、特に議会に連なる者たちを指すため、「支配者」より自然で具体的な「議員たち」とした。ἐκは集団内の所属を「の中で」で表した。
- source_word: ἐπίστευσεν εἰς αὐτόν
  choice: 彼を信じた
  rationale: ヨハネ文書で信頼と信仰の対象を示す定型的表現として、現代日本語で自然な「彼を信じる」とした。アオリストは文脈に即して過去形で表した。
- source_word: ἢ
  choice: や
  rationale: 二つの集団を、日本語の疑問文の中で自然に併記するため「や」で結んだ。原文の選言的な並列を過度に強調しない。
- source_word: ἐκ τῶν Φαρισαίων
  choice: ファリサイ派の中で
  rationale: 集団名を現代日本語で分かりやすく示し、ἐκによる集団内の所属を「の中で」と表した。
theological_decisions:
- issue: μή τιςによる否定疑問の修辞的な力
  choice: 否定の答えを予想させる疑問文として訳す。
  alternative: 「議員たちやファリサイ派の中には、彼を信じた者など一人もいない」と明示的な否定文にする。
  rationale: 原文の話者は「いない」という答えを見込んでいるが、実際の文型は疑問である。その形式と尊大で退けるような語調を保ち、含意を本文で断定へ変えない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「一人でもいるだろうか」によって、話者が否定の答えを当然視する響きを自然に伝えた。
