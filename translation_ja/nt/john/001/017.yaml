id: JHN.1.17
reference: John 1:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: ja
  text: というのは、律法はモーセを通して与えられ、恵みと真理はイエス・メシア[a]を通して現れたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「イエス・キリスト」。
    reason: Χριστόςの伝統的な音訳を示すため。
lexical_decisions:
- source_word: ὅτι
  choice: というのは……からである
  rationale: 直前の内容を説明する接続語として、因果・説明の働きを自然な日本語で明示した。
- source_word: ὁ νόμος
  choice: 律法
  rationale: モーセを通して与えられた契約上の教えを指す、日本語聖書で定着した明確な訳語。
- source_word: διὰ Μωϋσέως
  choice: モーセを通して
  rationale: 属格を伴うδιάの媒介・代理の意味を保ち、後半との並行も示す。
- source_word: ἐδόθη
  choice: 与えられ
  rationale: アオリスト受動の意味を簡潔に保ち、与えた主体を本文以上に特定しない。
- source_word: ἡ χάρις καὶ ἡ ἀλήθεια
  choice: 恵みと真理
  rationale: ヨハネ1:14との語彙的な響きを保つ、自然で定着した訳語。
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: イエス・メシアを通して
  rationale: διάの媒介性を保ち、Χριστόςを称号として意味の分かる形に訳した。中黒により固有名と称号の結びつきを自然に示した。
- source_word: ἐγένετο
  choice: 現れた
  rationale: 単なる存在開始と断定せず、恵みと真理がイエスを通して歴史的に現実のものとなったという文脈上の意味を、自然な日本語で表した。
theological_decisions:
- issue: Χριστοῦの訳し方
  choice: メシア
  alternative: キリスト
  rationale: ここでは称号としての意味が保たれており、その内容を日本語で明示するため「メシア」とした。伝統的な音訳は脚注に残した。
- issue: 律法と恵み・真理の関係
  choice: 原文どおり並置し、対立を補足しない
  alternative: 「しかし」などを加えて強い対立として訳す
  rationale: 原文には明示的な逆接接続詞がないため、律法を否定する神学的対立を訳文に持ち込まず、二つの節の対照と並行をそのまま保った。
- issue: ἐγένετοの神学的含意
  choice: 現れた
  alternative: 生じた／存在するようになった
  rationale: 恵みと真理がそれ以前には存在しなかった、という断定を避けつつ、イエスを通して到来・実現したという動きを表した。
translation_notes:
  register: 明瞭で格調のある現代標準語。前節への説明関係を「というのは……からである」で示し、二つの節の並行構造を保った。
