id: JHN.1.33
reference: John 1:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: ja
  text: わたしもその方を知りませんでした[a]。しかし、水によって洗礼を授けるためにわたしを遣わした方が、わたしにこう言われました。『あなたが、霊がだれかの上に降り、その人の上にとどまる[b]のを見るなら、その人こそ、聖霊によって洗礼を授ける方である[c]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その方をそれと分かりませんでした」とも訳せる。ギリシア語は、面識がなかったことも、その方が誰であるかを認識していなかったことも表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「とどまる」は、ヨハネ文書で繰り返し用いられる重要な語で、「住み続ける」「とどまり続ける」とも訳される。
    reason: lexical_alternative
  - marker: c
    text: 「水で……聖霊によって」または「水を用いて……聖霊を用いて」とも訳せる。ギリシア語は両方の句で同じ前置詞を用いており、本文では「によって」を両句に用いてその並行を保った。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: わたしも
  rationale: καίとἐγώの融合形。文脈とのつながりと主語の強調を簡潔な現代日本語で表す。
- source_word: οὐκ ᾔδειν αὐτόν
  choice: その方を知りませんでした
  rationale: οἶδαの未完了過去が示す、それ以前には知らなかった状態を直接的に訳した。文脈上は「見分けられなかった」の可能性もあるため脚注に示す。
- source_word: ὁ πέμψας με
  choice: わたしを遣わした方
  rationale: 冠詞付きアオリスト分詞を自然な関係節として訳し、定まった人物への言及を保つ。
- source_word: βαπτίζειν ἐν ὕδατι
  choice: 水の中で洗礼を授ける
  rationale: ἐνを「中で」とし、後半のἐν πνεύματι ἁγίῳとの意図的な並行を保持する。βαπτίζωは日本語聖書語として広く理解される「洗礼を授ける」とした。
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: あなたが、霊がある人の上に…のを見るなら
  rationale: 不定関係的な構文を条件的な「…なら」で表し、識別のしるしであることを明確にする。
- source_word: τὸ πνεῦμα
  choice: 霊
  rationale: 後半の「聖霊」と同じ神の霊を指す。日本語では大文字小文字の区別がないため、語形どおり簡潔に訳す。
- source_word: καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: その人の上に降って、その人の上にとどまる
  rationale: 二つの現在分詞を連続する動作・状態として表し、ἐπ’ αὐτόνの関係を明示する。μένωのヨハネ文書における重要な語感は「とどまる」で保つ。
- source_word: οὗτός ἐστιν ὁ βαπτίζων
  choice: その人こそ…洗礼を授ける方である
  rationale: οὗτός ἐστινの明示的な同定と強調を「こそ」で自然に示す。
- source_word: ἐν πνεύματι ἁγίῳ
  choice: 聖霊の中で
  rationale: 前半と同じ前置詞ἐνを「中で」と訳して並行を保ち、「聖霊によって／をもって」と解釈的に限定しない。
theological_decisions:
- issue: 二つの洗礼句におけるἐνの訳し分け
  choice: 水の中で…聖霊の中で
  alternative: 水で…聖霊によって（または聖霊をもって）
  rationale: 同一の前置詞を同様に訳し、ヨハネの洗礼とイエスの洗礼の対照的な並行を保つ。手段・領域のどちらかに意味を限定しない。
- issue: οὐκ ᾔδεινの意味
  choice: 知りませんでした
  alternative: 見分けられませんでした／それと分かりませんでした
  rationale: 語の基本的な意味を本文に置きつつ、ここで個人的面識の欠如を指すのか、メシアとしての認識の欠如を指すのかという曖昧さを脚注で保持する。
- issue: πνεῦμαとπνεύματι ἁγίῳの指示対象
  choice: 霊…聖霊
  alternative: 御霊…聖なる霊
  rationale: 直後の明示的表現により、降る霊が聖霊を指すことは文脈上明らかである。「霊」は原文の表現差を保ち、「聖霊」は現代日本語で定着した呼称とした。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「その方」「方」でイエスと遣わした者への敬意を自然に示しつつ、過度な敬語化は避けた。引用内は識別のしるしを理解しやすくするため条件構文に整え、原文の反復と神学的な曖昧さは可能な限り保持した。
