- from: わたしもその方を知りませんでした[a]。しかし、水の中で洗礼を授けるためにわたしを遣わした方が、わたしにこう言われました。『あなたが、霊がある人の上に降って、その人の上にとどまる[b]のを見るなら、その人こそ、聖霊の中で洗礼を授ける方である[c]。』」
  to: わたしもその方を知りませんでした[a]。しかし、水によって洗礼を授けるためにわたしを遣わした方が、わたしにこう言われました。『あなたが、霊がだれかの上に降り、その人の上にとどまる[b]のを見るなら、その人こそ、聖霊によって洗礼を授ける方である[c]。』
  rationale: 水と聖霊を用いる二つの洗礼句を、自然な日本語で同じ「によって」にそろえた。「霊がある人の上に」という曖昧で不自然な連結を、「霊がだれかの上に降り、その人の上にとどまる」と改め、原文の関係・識別構文を明確にした。余分な引用符も訂正した。
