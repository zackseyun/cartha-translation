  terminology: μαρτυρία／μαρτυρέωの対応として「証人／証しをする」は自然で、語の連関も保たれる。「光」はヨハネ文脈の人格的・神学的な指示を日本語の通常表記の範囲で保つ。δι’ αὐτοῦの指示対象の曖昧さは本文の「彼」と注で保持する。
  issues:
