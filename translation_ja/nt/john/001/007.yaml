  - severity: low
    issue: 「信じるようになる」が開始・変化の含みを加える可能性
    rationale: πιστεύσωσινはここでは目的節のアオリスト接続法であり、信じること自体を述べる。「信じるため」がより過不足ない。
  - severity: low
