  source_fidelity: 原文は「この人」が証人として来た目的を、光について証しすること、そしてすべての人が「彼を通して」信じることとして、二つのἵνα節で示す。現行訳は概ね忠実だが、「証しし、…ためである」というつながりでは、後半だけが前半の証しの目的であるようにも読め、二つの目的節の関係がやや不明瞭である。
