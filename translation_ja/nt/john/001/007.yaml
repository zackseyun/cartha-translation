  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: ja
  text: この人は証人として来た。それは、光について証しをし、すべての人が彼[a]を通して信じるためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼」は、文脈上は証人であるヨハネを指すと考えられる。すなわち、人々がヨハネの証しを通して信じるため、という意味である。これを「光」を指すと取る見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: この人
  rationale: 直前に登場したヨハネを指す指示語の力を保ちつつ、現代日本語として自然にした。
- source_word: ἦλθεν εἰς μαρτυρίαν
  choice: 証しのために来た
  rationale: 到来とその目的を明確に表し、μαρτυρίαの証言的な意味を保つ。
- source_word: ἵνα μαρτυρήσῃ περὶ τοῦ φωτός
  choice: 光について証しし
  rationale: ἵναの目的を後続句と合わせて自然な日本語で示し、περίの『〜について』という意味を明示した。
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: すべての人が……信じるようになるため
  rationale: πάντεςの包括性と、二つ目のἵνα節が示す目的を保った。
- source_word: δι’ αὐτοῦ
  choice: 彼を通して
  rationale: διά＋属格の媒介・手段を直訳に近い形で保持し、代名詞の指示対象に関する原文上の余地も残した。
theological_decisions:
- issue: δι’ αὐτοῦのαὐτοῦが指す人物
  choice: 本文では『彼』とし、文脈上は証人ヨハネを指す読みを優先する
  alternative: 光、すなわちメシアを指す
  rationale: 節の主語であるヨハネが談話上の主要な先行詞であり、次節もヨハネと光を区別する。ただしギリシア語代名詞だけでは指示対象を明示していないため、注で別解を示す。
translation_notes:
  register: 明快で格調を保った現代標準日本語。『証し』を反復して原文のμαρτυρία／μαρτυρέωの語の連なりを保持した。『光』は日本語では通常の表記慣行に従い、文脈上の人格的指示を大文字表記に頼らず示す。
