- from: フィリポはナタナエルを見つけて言った。「私たちは、モーセが律法の中に書き、預言者たちも書いた方を見つけた。ナザレ出身の、ヨセフの子イエスだ。」
  to: フィリポはナタナエルを見つけて言った。「私たちは、モーセが律法に記し、預言者たちも記した方を見つけた。ヨセフの子で、ナザレ出身のイエスだ。」
  rationale: 原文の意味を変更せず、日本語として不自然な「律法の中に書き」を「律法に記し」に、読みにくい末尾の同格句を自然な語順に改めた。「ヨセフの子」と「ナザレ出身」はいずれもフィリポによる通常の人物同定として、そのまま保持している。
