id: JHN.1.45
reference: John 1:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: ja
  text: フィリポはナタナエルを見つけて言った。「私たちは、モーセが律法に記し、預言者たちも記した方を見つけた。ヨセフの子で、ナザレ出身のイエスだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρίσκει
  choice: 見つけて
  rationale: 歴史的現在だが、日本語の物語として自然な出来事の進行を表すため、「見つけて」とした。
- source_word: λέγει
  choice: 言った
  rationale: 歴史的現在を、前後の物語の流れに合う自然な過去形で表した。
- source_word: Ὃν ἔγραψεν
  choice: 書いた方
  rationale: 関係代名詞Ὃνが人を指し、その人について聖書に記したという意味を、日本語で簡潔かつ明瞭に表した。
- source_word: ἐν τῷ νόμῳ
  choice: 律法の中に
  rationale: モーセに結び付く聖書的な律法を指すことを保ちつつ、原文のἐνを反映した。
- source_word: οἱ προφῆται
  choice: 預言者たち
  rationale: モーセと並ぶ、預言者による聖書的証言を指す標準的な訳語。
- source_word: εὑρήκαμεν
  choice: 私たちは……見つけた
  rationale: 完了形が表す、発見が現在の確信につながっている含みは文脈から伝わるため、自然な日本語の完了表現とした。
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: ヨセフの子
  rationale: フィリポの発言にある通常の社会的な人物同定を、そのまま訳した。
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: ナザレ出身の
  rationale: ἀπόの出所・由来の意味を明確にし、「ナザレ人」という称号的表現に置き換えなかった。
- source_word: Ναθαναὴλ
  choice: ナタナエル
  rationale: 日本語聖書で広く通用する人名表記。
- source_word: Ἰησοῦν
  choice: イエス
  rationale: 日本語で定着した人名表記。
- source_word: Μωϋσῆς
  choice: モーセ
  rationale: 日本語で定着した人名表記。
theological_decisions:
- issue: 「ヨセフの子」とキリスト論との関係
  choice: フィリポの発言どおり「ヨセフの子イエス」とした。
  alternative: 「ヨセフの子と思われていたイエス」または「法的・社会的にはヨセフの子であるイエス」
  rationale: この節はフィリポによる当初の人物同定を伝えている。処女懐胎についての後の理解を訳文に補って、発言自体を変更しない。
- issue: 「モーセが律法の中に書き、預言者たちも書いた」の範囲
  choice: モーセと預言者たちの双方が、その方について書いたという構造を保った。
  alternative: 「律法と預言者に記されている方」
  rationale: 原文ではモーセと預言者たちがそれぞれ書き手として示されるため、その二重の聖書的証言を明示した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体。「方」により指示対象が人物であることを自然に示し、「だ」はフィリポの発見の告知として直接的な響きを保つ。
