  - severity: low
    issue: 末尾の同格表現の読点と語順
    rationale: 「ナザレ出身の、ヨセフの子イエスだ」は不自然な読点により修飾関係が曖昧になり得る。「ヨセフの子で、ナザレ出身のイエスだ」として両方の人物同定を滑らかに示す。
