  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ἵνα φανερωθῇ τῷ Ἰσραὴλ διὰ τοῦτο ἦλθον ἐγὼ ⸀ἐν ὕδατι βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: ja
  text: わたしもその方を知らなかった。[a] しかし、その方がイスラエルに現されるように、この目的のために、わたしは水で洗礼を授けに来たのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その方だとは分からなかった」。ギリシア語は、面識や知識がなかったこととも、その方を認識していなかったこととも取れる。本文では、より広い意味を持つ表現にした。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: わたしは
  rationale: καίを含む語形だが、前後の証言の流れは日本語では明示的な「そして」を置かなくても自然に保たれる。ἐγώの主語は「わたし」で示した。
- source_word: οὐκ ᾔδειν αὐτόν
  choice: その方を知らなかった
  rationale: 過去における知識・認識の欠如を広く表す。「見分けていなかった」と限定せず、個人的面識かメシアとしての認識かという原文の幅を保つ。αὐτόνは敬意を保ちながら文脈上の人物を示す「その方」とした。
- source_word: ἀλλ’
  choice: しかし
  rationale: ヨハネがその方を知らなかったことと、洗礼を授けに来た目的との対照を明確かつ自然に示す。
- source_word: ἵνα φανερωθῇ τῷ Ἰσραὴλ
  choice: その方がイスラエルに現されるために
  rationale: ἵναの目的を「ために」で示し、φανερωθῇの受動態を「現される」として保持した。τῷ Ἰσραήλは集合的名称のまま「イスラエルに」とした。
- source_word: διὰ τοῦτο
  choice: その方がイスラエルに現されるために
  rationale: 前方のἵνα節を指す理由・目的表現。日本語では「このために」と重ねるより、目的節を直接「ために」と結ぶほうが自然であり、意味も保たれる。
- source_word: ἦλθον ἐγὼ
  choice: わたしは…来たのです
  rationale: アオリストを過去形「来た」で表し、明示されたἐγώと説明的な文脈の力を「わたしは」「のです」で自然に示した。
- source_word: ἐν ὕδατι βαπτίζων
  choice: 水で洗礼を授けに
  rationale: ἐν ὕδατιはここでは洗礼に用いる要素を表す自然な日本語として「水で」とした。分詞βαπτίζωνは来訪の目的・働きを日本語らしく「洗礼を授けに」と表し、洗礼の様式を原文以上に限定しない。
theological_decisions:
- issue: ヨハネがイエスを「知らなかった」という発言の意味
  choice: 「その方を知らなかった」と広く訳す
  alternative: 「その方だとは分からなかった」「その方をメシアとして知らなかった」
  rationale: 本文は、個人的な面識がなかったのか、メシアとして認識していなかったのかを明示していない。調和的説明を本文に持ち込まず、その緊張と意味の幅を保つ。
- issue: φανερωθῇの受動表現
  choice: 「現される」と受動態を保つ
  alternative: 「明らかになる」「知らせる」
  rationale: 行為者を補わず、原文の神的受動とも取り得る曖昧さを保持する。「知らせる」ではヨハネ自身を明示的な行為者にしすぎる。
translation_notes:
  register: 明瞭な現代標準語を用いながら、証言の場面にふさわしい端正さを保った。「バプテスマ」ではなく一般読者に通じやすい「洗礼」を採用し、動作は「洗礼を授ける」とした。
