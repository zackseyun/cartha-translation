id: JHN.1.20
reference: John 1:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: ja
  text: 彼は公言し、否定しなかった。そして、「私はメシア[a]ではない」と公言した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語の称号はΧριστός（クリストス）で、ここでは「メシア」を意味する。
    reason: alternative_reading
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: 公言した
  rationale: 公の場で率直に認め、言い表すという意味と、原文で二度繰り返される厳粛な強調を保つ。
- source_word: οὐκ ἠρνήσατο
  choice: 否定しなかった
  rationale: ヨハネ文書におけるἀρνέομαιの通常の意味を直接表し、「公言し」と対をなす原文の強調を保つ。
- source_word: καὶ ... καὶ ... καὶ
  choice: し、…しなかった。そして、…
  rationale: καίの反復による畳みかけを、日本語として明瞭な接続で表した。
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: 私は…ではない
  rationale: 明示された主語Ἐγώの強調を「私は」で示し、直接的な否定を自然な日本語で保つ。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは人名のような呼称ではなく、待望されていた油注がれた者を指す称号として用いられているため。
theological_decisions:
- issue: 称号Χριστόςの訳し方
  choice: メシア
  alternative: キリスト
  rationale: この文脈では、ヨハネが自分は待望の油注がれた者ではないと否定している。称号としての機能とユダヤ的背景を明確にするため「メシア」としたが、伝統的な音訳「キリスト」も可能である。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ὡμολόγησενの反復を同じ「公言した」で再現し、証言の公然性と強調を保った。脚注記号は、その対象である「メシア」の直後に置いた。
