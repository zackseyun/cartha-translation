id: JHN.1.43
reference: John 1:43
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον ἠθέλησεν ἐξελθεῖν εἰς τὴν Γαλιλαίαν. καὶ εὑρίσκει Φίλιππον καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: ja
  text: その翌日、イエスはガリラヤへ[a]出かけようと思った。そしてフィリポを見つけ、彼に言った[b]。「わたしについて来なさい[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「ガリラヤの中へ」。ギリシア語の前置詞は、その地域の内部へ入って行く動きを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「見つける」と「言う」は、ギリシア語では現在形。過去の出来事を生き生きと語る歴史的現在である。
    reason: lexical_alternative
  - marker: c
    text: 「わたしについて来なさい」は、実際に同行することと、イエスの弟子として従うことの両方を意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: その翌日
  rationale: 物語の時間的な連続を、明快で自然な現代日本語で示す。
- source_word: ἠθέλησεν
  choice: 思った
  rationale: θέλωの意志・願望を表しつつ、「決意した」のように熟慮や決断の強さを加えない。「出かけようと思った」という形で自然な日本語にした。
- source_word: ἐξελθεῖν
  choice: 出かけよう
  rationale: ἐξέρχομαιの「外へ出る」という動きと、目的地へ向かう文脈の両方を自然に表す。
- source_word: εἰς τὴν Γαλιλαίαν
  choice: ガリラヤへ
  rationale: εἰςが示す方向・内部への移動を、日本語で自然な方向助詞「へ」によって表した。
- source_word: εὑρίσκει
  choice: 見つけ
  rationale: 単に偶然目にしたというより、フィリポを見いだすという動作を簡潔に表す。ギリシア語の歴史的現在は脚注で示す。
- source_word: λέγει αὐτῷ
  choice: 彼に言った
  rationale: 与格代名詞の対象を明示し、現代日本語の自然な物語文とした。ギリシア語の歴史的現在は脚注で示す。
- source_word: Ἀκολούθει μοι
  choice: わたしについて来なさい
  rationale: 身体的に後について行く意味と、弟子として従う召しの意味をどちらも持ち得る日本語表現を選んだ。
- source_word: Φίλιππον
  choice: フィリポ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: ギリシア語で明示される主語を訳文にも明示し、前半の省略された主語も同じ人物であることが自然に分かるようにした。
theological_decisions:
- issue: フィリポに対する命令の意味
  choice: 「わたしについて来なさい」とし、同行と弟子として従う召しの両方を保つ
  alternative: 単に「一緒に来なさい」として身体的な同行だけを前面に出す
  rationale: ἀκολούθει μοιは場面上の移動を含み得る一方、福音書では弟子として従う召しも担う。訳文で一方に限定せず、その重なりを保持した。
translation_notes:
  register: 明快で自然な現代標準語を用い、過度な敬語化や古風な語尾を避けた。叙述は日本語として自然な過去形にし、原文の歴史的現在は脚注で保持した。
