  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: ja
  text: 私の後から来られる方、その方のサンダルの留めひもを解くにも、私はふさわしくありません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: 私の後から来られる方
  rationale: 冠詞付き現在分詞を特定の人物を指す表現として訳した。「後から」は、空間的位置に限定せず、登場・働きの順序を自然な現代日本語で示す。「来られる方」は敬意を表す自然な言い方で、文脈上の人物への言及に適している。
- source_word: οὗ
  choice: その方の
  rationale: 属格関係を日本語の所有表現で自然に示し、後続する「履物のひも」に結び付けた。
- source_word: οὐκ εἰμὶ ἄξιος
  choice: 私は…ふさわしくない
  rationale: ἄξιοςの価値・資格に関する意味を保ち、ヨハネのへりくだりを過度に説明せず表した。
- source_word: ἵνα λύσω
  choice: 解くにも
  rationale: 価値・資格を表す表現に続くἵνα＋接続法を、日本語では行為への資格を示す「解くにも」とした。単なる能力不足ではなく、その行為をするに値しないという意味を伝える。
- source_word: ἱμάντα
  choice: ひも
  rationale: 履物を留める革ひもを指す語であり、「履物のひも」は明瞭で自然な現代日本語となる。
- source_word: τοῦ ὑποδήματος
  choice: 履物
  rationale: ὑπόδημαは足に履く物を広く指し得るため、原文の語義幅を保つ「履物」を採用した。歴史的にはサンダルが想定されるが、本文でそれに限定しなかった。
theological_decisions:
- issue: 「私の後」の関係
  choice: 働き・登場の順序を示す「私の後から」
  alternative: 空間的な「私の後ろから」
  rationale: ヨハネ文書の文脈では後に来る者という時間的・継起的意味が自然である。近接文脈が示す優越性をこの句自体に付加せず、含意と緊張を保持した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「来られる方」で敬意を示しつつ、過度に古風な語調は避けた。注記を要するほどの訳語上の別案はないため、脚注は設けていない。
