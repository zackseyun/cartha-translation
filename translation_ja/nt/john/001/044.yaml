  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: ja
  text: フィリポは、ベツサイダ、すなわちアンデレとペトロの町[a]の出身であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アンデレとペトロの町」は、その町がアンデレとペトロの出身地でもあったことを示す。
    reason: 属格は単純な所有を表すのではなく、町とアンデレおよびペトロとの出身地としての関係を表す。
lexical_decisions:
- source_word: ἦν
  choice: 出身であった
  rationale: 未完了過去形の存在動詞が、ここではフィリポの出身という過去の状態・背景を示す。日本語では「出身であった」が自然で明確。
- source_word: δὲ
  choice: （明示せず）
  rationale: 弱い談話接続を示す語だが、強い対比や時間的な「さて」を意味しない。現代日本語では文脈上自然に省略できる。
- source_word: ὁ Φίλιππος
  choice: フィリポ
  rationale: 人名を日本語聖書で広く用いられる形に音写した。
- source_word: ἀπὸ Βηθσαϊδά
  choice: ベツサイダの出身で
  rationale: ἀπόは起点・出身を表す。「ベツサイダから」より、人の出身地を述べる日本語として自然。
- source_word: ἐκ τῆς πόλεως
  choice: 町の出身であった
  rationale: ἐκは起源を示し、πόλιςは都市にも町にもなり得る。ここでは規模を過度に断定しない一般的な「町」を採用し、原文の反復構造も保った。
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: アンデレとペトロの
  rationale: 属格を簡潔に保ち、その町が二人の出身地であるという関係を表す。
