id: JHN.1.5
reference: John 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: ja
  text: 光は闇の中で輝いている。そして、闇は光に打ち勝たなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「闇は光を理解しなかった」または「闇は光を捉えなかった」。原語には「打ち勝つ」と「捉える・理解する」のどちらの意味もあり得る。
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: 光
  rationale: 定冠詞を伴う主題的な「光」だが、日本語では文脈上特定されるため、不自然な指示語を加えず「光」とした。
- source_word: σκοτίᾳ / σκοτία
  choice: 闇
  rationale: 「光」と対をなす、ヨハネ序文の主題的かつ擬人的な表現として「闇」とした。
- source_word: φαίνει
  choice: 輝いている
  rationale: 現在形の継続的・現前的な響きを自然な現代日本語で表した。
- source_word: κατέλαβεν
  choice: 打ち勝たなかった
  rationale: この動詞には「捕らえる、把握する、理解する」と「制圧する」の意味域がある。光と闇の対立という比喩には「打ち勝つ」がよく合うが、別の意味は脚注に残した。
- source_word: αὐτό
  choice: 光
  rationale: ギリシア語では中性単数代名詞で φῶς を受ける。日本語の「それ」では指示がやや曖昧になるため、名詞「光」を繰り返した。
theological_decisions:
- issue: 光と闇の対比における κατέλαβεν の意味
  choice: 闇は光に打ち勝たなかった
  alternative: 闇は光を理解しなかった／捉えなかった
  rationale: 直接の比喩は敵対的な「制圧する、打ち勝つ」という読みを支持する一方、原語は認知的な「把握する、理解する」も表し得る。本文では前者を採り、ヨハネ的な重層性を失わないよう後者を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「輝いている」で継続性を示し、「打ち勝たなかった」で光と闇の対立を自然に表現した。脚注記号は、曖昧さの中心である第二文の直後に置いた。
