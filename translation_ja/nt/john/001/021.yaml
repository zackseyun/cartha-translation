  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: ja
  text: そして彼らは彼に尋ねた。「では、どうなのですか。あなたはエリヤですか。」彼は言った[b]。「そうではありません。」「あなたはあの預言者[a]ですか。」彼は答えた。「いいえ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その預言者」。おそらく、モーセのような預言者が来るという期待を指す（申命記18章15節、18節）。
    reason: alternative_reading
  - marker: b
    text: ギリシア語では、物語を生き生きと語る歴史的現在形で「言う」となっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρώτησαν
  choice: 尋ねた
  rationale: 直接の問いを導く通常の語として、強い詰問の響きを加えず、現代日本語で自然に表した。
- source_word: Τί οὖν;
  choice: では
  rationale: 直前の否定を受けて次の可能性を問う、短く畳みかける論理的なつながりを日本語の問いの導入として表した。独立した「では、何なのですか」とすると、原文以上に身分を明示して尋ねる響きが出るため、後続の問いと自然に結んだ。
- source_word: σὺ Ἠλίας εἶ
  choice: あなたはエリヤですか
  rationale: 強調された代名詞を「あなたは」で示し、固有名は日本語で定着した「エリヤ」とした。
- source_word: Οὐκ εἰμί
  choice: そうではありません
  rationale: 目的語を補わない簡潔な否定を保ちつつ、日本語として自然な応答にした。「私はエリヤではありません」と反復して原文にない語を補うことを避けた。
- source_word: Ὁ προφήτης
  choice: あの預言者
  rationale: 定冠詞が示す、聞き手にも知られた特定の待望の人物という含みを「あの」で表した。単なる一人の預言者とはしない一方、誰を指すかは本文で断定しない。
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は歴史的現在だが、日本語の物語文として不自然にならないよう過去形で表し、原文の時制は注記した。
- source_word: ἀπεκρίθη
  choice: 答えた
  rationale: 応答を示す標準的な物語表現として訳した。
- source_word: Οὔ
  choice: いいえ
  rationale: 単独の否定応答を、簡潔で自然な現代日本語にした。
theological_decisions:
- issue: 「あの預言者」の正体
  choice: 本文では「あの預言者」とし、特定の待望の人物であることだけを示す。
  alternative: 申命記18章のモーセのような預言者と本文中で明示する、または一般的な「預言者」とする。
  rationale: 冠詞は特定の人物を示唆するが、この節そのものはその正体を説明していない。申命記18章との関連は注にとどめ、本文の含みを保持した。
- issue: ヨハネによるエリヤであることの否定
  choice: 「そうではありません」と、その否定をそのまま訳す。
  alternative: 「文字どおりのエリヤではありません」などと限定したり、他の福音書との調和を本文に織り込んだりする。
  rationale: 原文には否定を限定する説明がないため、他箇所との神学的緊張を解消せず、その簡潔な否定を保った。
translation_notes:
  register: 明瞭な現代標準語を用い、短い問答のテンポと簡潔さを保った。敬体の会話によって自然さと品位を両立させ、神学的な説明や他箇所との調和を本文に持ち込まなかった。
