id: JHN.1.12
reference: John 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: ja
  text: しかし、この方を受け入れたすべての人、すなわち、その名を信じる人々には、神の子どもとなる権利[a]をお与えになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「権威」または「力」。ギリシア語は、授けられた権威、権利、あるいは能力を表し得る。
    reason: ἐξουσίανの意味領域にある genuine ambiguity を保持するため。
lexical_decisions:
- source_word: ὅσοι δὲ
  choice: しかし、この方を受け入れたすべての人
  rationale: δὲの前節との対比を「しかし」で示し、ὅσοιの複数かつ包括的な意味を「すべての人」で自然に表した。
- source_word: ἔλαβον αὐτόν
  choice: この方を受け入れた
  rationale: 文脈上、ロゴスを物理的に取ることではなく、迎え入れることを指す。「彼」より「この方」が日本語として指示対象を明確にし、品位も保つ。
- source_word: ἔδωκεν αὐτοῖς
  choice: 人々には……お与えになった
  rationale: δίδωμιの直接的な意味を保ちつつ、主語であるロゴスへの敬意を自然な尊敬表現で示した。
- source_word: ἐξουσίαν
  choice: 権利
  rationale: ここでは単なる能力よりも、神から授けられた資格・許可の意味が中心である。ただし「権威」「力」の含意もあり得るため脚注に示した。
- source_word: τέκνα θεοῦ γενέσθαι
  choice: 神の子どもとなる
  rationale: τέκναは性別を限定しない「子ども」であり、γενέσθαιが示す新たな状態への移行を「となる」で保持した。
- source_word: τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ
  choice: すなわち、その名を信じる人々
  rationale: 受け入れた人々をさらに説明する同格的な句として訳し、「その名」を省かず、人格と啓示されたアイデンティティへ向けられた信頼を表した。
theological_decisions:
- issue: 「この方を受け入れる」と「その名を信じる」の関係
  choice: 両方を訳し、後者を「すなわち」で前者を説明する同格的表現とした。
  alternative: 二つを完全な同義表現として一方だけを訳す。
  rationale: ギリシア語本文は両表現を明記している。両者の関係を過度に区別も同一化もせず、ヨハネ文書特有の重なりを保持する。
- issue: 神との親子関係を表す語
  choice: 神の子ども
  alternative: 神の息子たち
  rationale: 原文は男性に限定されるυἱοίではなくτέκναを用いているため、性別を限定しない「子ども」が正確である。
- issue: ἐξουσίανの意味領域
  choice: 本文では「権利」とし、脚注で「権威」「力」の可能性を示す。
  alternative: 本文を「権威」または「力」とする。
  rationale: この文脈では神の子どもとなるために授けられた資格・許可が前景化するが、語そのものの意味領域を一義的に狭めないよう脚注を付した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「彼」ではなく「この方」を用いて指示対象を明確にし、長い原文の構造は「すなわち」で読みやすく整理した。脚注記号[a]は該当語の直後に置いた。
