id: JHN.1.25
reference: John 1:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: ja
  text: 彼らはヨハネに尋ね、こう言った。「では、あなたがメシア[a]でも、エリヤでも、あの預言者[b]でもないのなら、なぜ洗礼を授けているのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「キリスト」。ギリシア語の称号 Χριστός（クリストス）は、ヘブライ語由来の「メシア」と同じく「油を注がれた者」を意味する。ここではユダヤ人のメシア待望を表すため「メシア」と訳した。
    reason: alternative_reading
  - marker: b
    text: 「あの預言者」は、モーセのような預言者として待望されていた人物を指すと考えられる（申命記18章15節参照）。
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν ... καὶ εἶπαν αὐτῷ
  choice: 尋ね、こう言った
  rationale: 原文の「尋ねた」と「言った」という二つの動詞を保ちつつ、現代日本語の自然な発話導入にした。目的語の代名詞は文脈上ヨハネを指すため、明示した。
- source_word: Τί οὖν βαπτίζεις
  choice: では、なぜ洗礼を授けているのですか
  rationale: τί はこの構文で行為の理由・根拠を問うため「なぜ」とした。現在形 βαπτίζεις は継続中の活動を表すので「授けている」と訳した。
- source_word: ὁ χριστός
  choice: メシア
  rationale: 人名ではなく、ユダヤ的な待望を背景とする称号として用いられているため「メシア」とした。
- source_word: Ἠλίας
  choice: エリヤ
  rationale: 日本語聖書で広く定着している固有名の表記を用いた。
- source_word: ὁ προφήτης
  choice: あの預言者
  rationale: 定冠詞を伴い、単なる一人の預言者ではなく、聞き手に知られた待望の人物を指す。「あの」によって日本語でその特定性を表した。
- source_word: οὐδὲ ... οὐδὲ
  choice: でも、…でも
  rationale: 先行する否定に結び付く並列を、日本語で自然な「AでもBでもCでもない」の形にした。
- source_word: βαπτίζεις
  choice: 洗礼を授けている
  rationale: 他者に洗礼を施す行為であることを明確にする、自然で品位ある日本語表現を採用した。
theological_decisions:
- issue: Χριστόςをヨハネ福音書の問いの中でどう訳すか
  choice: メシア
  alternative: キリスト
  rationale: ここでは固有名のような用法ではなく、イスラエルが待望する者の称号として機能しているため、その背景を伝える「メシア」を本文に採用した。
- issue: ὁ προφήτηςを特定の待望された人物として示すか
  choice: あの預言者
  alternative: その預言者／預言者
  rationale: 定冠詞と文脈は、一般的な預言者ではなく、特定の待望された人物を指し示す。「あの預言者」はその特定性を自然な日本語で示す一方、誰であるかを本文で断定しすぎない。
translation_notes:
  register: 明快な現代標準語を用い、問いの丁寧さは「ですか」で表した。「ヨハネ」は直前の文脈で指示対象が明白な代名詞 αὐτόν を自然に補ったもの。「洗礼を授ける」は宗派固有の方式を含意せず、βαπτίζω の対人的な行為を表す。
