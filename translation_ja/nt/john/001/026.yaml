  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: ja
  text: ヨハネは彼らに答えた。「私は水で洗礼を授けています。あなたがたの間に、あなたがたの知らない人が立っています。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: ヨハネは彼らに答えた
  rationale: λέγωνは返答内容を導く分詞であり、日本語では「答えて言った」と重ねず、「答えた」と自然にまとめた。
- source_word: βαπτίζω
  choice: 洗礼を授けています
  rationale: キリスト教文脈で定着した訳語を用い、「浸す」のように儀式の様態を過度に限定しない。現在形の継続的な働きも表した。
- source_word: ἐν ὕδατι
  choice: 水で
  rationale: 手段・領域のどちらにも取り得るἐνの幅を踏まえ、日本語として自然な「水で」とした。「水の中で」は浸礼の方式を必要以上に特定し得る。
- source_word: μέσος ὑμῶν
  choice: あなたがたの間には
  rationale: 集団のただ中にいることを、明瞭で現代的な日本語で表した。
- source_word: ἕστηκεν
  choice: 立っておられます
  rationale: 完了形が示す現在の状態を自然な現在表現で伝え、文脈上の人物への敬意を日本語の尊敬表現で示した。
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: あなたがたの知らない方
  rationale: οἶδαの基本義である「知る」を保ち、「見分けない」「気づかない」と解釈的に限定しなかった。ὑμεῖςの明示による強調も「あなたがたの」で表した。
theological_decisions:
- issue: 彼らの間に立つ、名を挙げられていない人物の正体
  choice: 「方」とだけ訳し、イエスやメシアと明示しない
  alternative: 「メシア」または「イエス」
  rationale: 周辺文脈ではその人物が明らかになるが、この節自体の修辞的な未特定性と緊張を保つため。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「洗礼を授ける」は一般読者にも通じる定着表現とし、語りの簡潔さを保った。
