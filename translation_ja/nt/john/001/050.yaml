- from: イエスは彼に答えて言った。「いちじくの木の下にいるあなたを見たと、わたしが言ったので、あなたは信じるのか。[a] あなたは、これらのことよりも大きなことを見る。」
  to: イエスは彼に答えた。「いちじくの木の下にいるあなたを見たと、わたしが言ったから、あなたは信じるのか。あなたはこれらよりも偉大なことを見る。」
  rationale: 原文の因果関係を保ったまま疑問文をより自然な現代日本語に整え、対話導入のギリシア語定型を日本語として無理のない形にした。「これらよりも偉大なこと」は、μείζω τούτωνの比較級・複数形を保持し、原文が具体的に何を指すかを限定しない。脚注は語順から可能な焦点化した読みを適切に保存している。
