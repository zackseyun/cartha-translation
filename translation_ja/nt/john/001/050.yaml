id: JHN.1.50
reference: John 1:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: ja
  text: イエスは彼に答えた。「いちじくの木の下にいるあなたを見たと、わたしが言ったから、あなたは信じるのか。あなたはこれらよりも偉大なことを見る。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: イエスは彼に答えて言った
  rationale: ギリシア語の対話導入の定型句を反映しつつ、現代日本語として理解できる形にした。「彼に」はαὐτῷを明示する。
- source_word: Ὅτι
  choice: ので
  rationale: 最初のὅτιの理由・根拠を示す働きを自然な日本語で表した。疑問全体の焦点を理由に置く別の構文も可能なので脚注に示した。
- source_word: ὅτι εἶδόν σε
  choice: あなたを見たと
  rationale: 二つ目のὅτιは発言内容を導くため、引用内容を示す「と」で訳した。εἶδόνは単純な過去として「見た」とした。
- source_word: ὑποκάτω τῆς συκῆς
  choice: いちじくの木の下にいる
  rationale: 具体的な情景を保つ自然な表現。「いる」は日本語の文として補ったもので、位置関係を明確にする。
- source_word: πιστεύεις
  choice: あなたは信じるのか
  rationale: 現在形の修辞的な問いを、断定や強い叱責にせず簡潔な疑問として保った。
- source_word: μείζω τούτων
  choice: これらのことよりも大きなこと
  rationale: 比較級と複数の指示語を保ち、直前に述べられた事柄を受ける表現とした。
- source_word: ὄψῃ
  choice: あなたは……見る
  rationale: 未来の出来事を告げる文脈では、日本語の非過去形「見る」が自然に未来を表す。主語が単数のナタナエルであることを「あなた」で明示した。
theological_decisions:
- issue: πιστεύειςの発話の力
  choice: 「あなたは信じるのか」という修辞的疑問
  alternative: 「あなたは信じる」とする平叙文、または「そんなことで信じるのか」という叱責を強めた表現
  rationale: 文脈と疑問形を保ちつつ、ナタナエルの信仰への評価を本文以上に肯定または否定しない。続く約束との緊張も残した。
- issue: 最初のὅτιが疑問文のどこに係るか
  choice: 理由を表す「ので」として問いの前半に置く
  alternative: 「信じるのは……からなのか」と理由そのものを問いの焦点にする
  rationale: どちらもギリシア語の簡潔な語順から可能であるため、本文では自然な因果表現を採り、焦点化した読みを脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、古風な終助詞や過度な敬語は避けた。イエスの言葉は簡潔で品位ある常体とし、原文の修辞的な問いと未来の約束を保った。
