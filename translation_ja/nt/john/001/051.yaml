source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: ja
  text: そしてイエスは彼に言われた。「まことに、まことに、あなたがたに言います。[a] あなたがたは、天が開かれており、神の天使たちが人の子の上に昇り降りするのを見るでしょう。[b]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたに」と、後の「あなたがたは」は、ギリシア語では複数形です。イエスはナタナエル一人に語りかけていますが、ここでは複数へと移っています。
    reason: lexical_alternative
  - marker: b
    text: この光景は、創世記28章12節に記されたヤコブの夢を思い起こさせます。ここでは、天使たちの昇り降りが「人の子」の上に描かれています。
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: 二重の厳粛な導入句を保ちつつ、現代日本語で意味が明瞭になるようにした。
- source_word: ὑμῖν / ὄψεσθε
  choice: あなたがたに／あなたがたは…見る
  rationale: いずれもギリシア語では複数形であり、物語上はナタナエル一人に語りかけながら、発言の対象が複数へ広がることを本文で明示した。
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: 天が開かれ
  rationale: 完了分詞が示す、天が開かれた状態を自然な日本語で表した。
- source_word: ἀγγέλους τοῦ θεοῦ
  choice: 神の御使いたち
  rationale: 神に属する超自然的な使者を指す文脈なので「御使い」とし、複数も示した。
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: 昇り降りする
  rationale: 創世記28章12節を想起させる方向の対を簡潔に保った。
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子の上に
  rationale: ἐπί＋対格の空間的な像を解釈的に言い換えず、「人の子」と御使いたちの動きとの関係を保った。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称としての聖書的・黙示的な響きを保つ定着した訳語を採用した。
theological_decisions:
- issue: 物語上の単数の相手（αὐτῷ）から、直接話法内の複数（ὑμῖν、ὄψεσθε）への移行
  choice: 本文で「あなたがた」と明示し、脚注でも数の移行を説明する。
  alternative: 本文を数の曖昧な表現にし、脚注だけで複数と説明する。
  rationale: 日本語では複数を自然に明示でき、この発言がナタナエル一人だけに限定されないという原文の文法的特徴を保持できる。
- issue: 創世記28章12節のヤコブの夢との関連
  choice: 本文では像をそのまま訳し、相互参照を脚注に置く。
  alternative: 本文中で、イエスがはしごや神の啓示の場であると説明的に言い換える。
  rationale: 原文の暗示と神学的緊張を保ち、特定の解釈を本文に付加しないため。
- issue: 御使いたちが「人の子の上に」昇り降りするという表現の解釈
  choice: 「人の子の上に」と空間的な表現を保持する。
  alternative: 「人の子を通して」または「人の子を中心に」と解釈的に訳す。
  rationale: ἐπίの像には解釈上の幅があるため、媒介や中心性を本文で断定しない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの厳粛な宣言にふさわしい品位を保った。「まことに、まことに」と「人の子」は聖書的な響きを残し、「あなたがた」で原文の複数を明示した。
