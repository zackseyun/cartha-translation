  to: そしてイエスは彼に言われた。「まことに、まことに、あなたがたに言います。[a] あなたがたは、天が開かれており、神の天使たちが人の子の上に昇り降りするのを見るでしょう。[b]」
  rationale: 完了分詞が示す「開かれた状態」を「天が開かれており」で表し、単純未来を「見るでしょう」とした。「神の御使いたち」は意味上誤りではないが、対象方言の明瞭な現代標準語に合わせて「神の天使たち」とした。複数形の転換、創世記への暗示、「人の子の上に」という解釈の余地を残す表現、および脚注アンカーは保持した。
