source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: ja
  text: ナタナエルはイエスに言った[a]。「どうして私のことを知っているのですか。」イエスは答えて言われた。「フィリポがあなたを呼ぶ前、あなたがいちじくの木の下にいたとき、私はあなたを見ました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳、「どこから私のことを知っているのですか」。
    reason: Πόθεν は字義的には「どこから」を意味するが、ここではイエスがナタナエルを知るに至った根拠・由来を問う表現である。
lexical_decisions:
- source_word: Πόθεν με γινώσκεις;
  choice: どうして私を知っているのですか
  rationale: Πόθεν は字義的には「どこから」だが、γινώσκεις とともに、相手が自分を知るに至った由来・根拠を問う表現。現代日本語では「どうして」が自然で、その意味を保つ。
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: イエスは答えて言われた
  rationale: 原文の「答えた」と「言った」の二動詞を残しつつ、イエスへの敬意を表す自然で格調ある日本語とした。
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: フィリポがあなたを呼ぶ前
  rationale: Πρὸ τοῦ と不定詞による先行時を明確に表し、φωνέω は文脈に即して「呼ぶ」とした。
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: あなたがいちじくの木の下にいたとき
  rationale: 分詞 ὄντα の付帯的・時間的状況を、明瞭で自然な日本語として表現した。定冠詞付きの συκῆν は「いちじくの木」とした。
- source_word: εἶδόν σε
  choice: 私はあなたを見ました
  rationale: アオリストを単純な過去として直接的に訳した。見ることがフィリポの呼びかけより前だったことは、前節の時間表現ですでに明示される。
theological_decisions:
- issue: イエスがナタナエルを知っていた仕方
  choice: 「私はあなたを見ました」と直接的に訳し、その仕方を説明しない
  alternative: 超自然的な予知・洞察であったと訳文中で明示する、または通常の目撃だったと限定する
  rationale: 本文はイエスが先にナタナエルを見ていたことを述べるが、その認識の仕組みまでは説明しないため、解釈を加えず神学的な余地を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら聖書本文にふさわしい品位を保った。「ナタナエルはイエスに」として代名詞の指示対象を明確にした。本文に脚注は設けていない。
