source:
  edition: SBLGNT
  text: Ἐν ἀρχῇ ἦν ὁ λόγος, καὶ ὁ λόγος ἦν πρὸς τὸν θεόν, καὶ θεὸς ἦν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/001.yaml
  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: ja
  text: 初めに[b]、ことばがあった。ことばは神とともにあり、ことばは神[a]であった。
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 別訳「ことばは神的であった」、または「神がどのような方であるか、そのような方がことばであった」。最後の節のギリシア語は「神」を冠詞なしで述語として置いており、ことばの性質を述べる表現と理解することができる。これは、前の節の「神」とことばが同一の人物であるとは明示していない。
    reason: alternative_reading
  - marker: b
    text: この冒頭句は創世記1章1節を響かせ、ことばを天地創造の初めと結び付けている。
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: 初めに
  rationale: 創世記1章1節を響かせる表現であり、簡潔で自然な日本語として、その文学的・神学的な結び付きを保つ。
- source_word: ἦν
  choice: あった／あり／であった
  rationale: 未完了過去の反復を、日本語の各構文に合わせて自然に表した。「存在していた」と明示するより簡潔で、本文が述べる継続的な存在を過度に説明しない。
- source_word: ὁ λόγος
  choice: ことば
  rationale: ヨハネ福音書における人格的・キリスト論的な呼称であると同時に、語ること、表現、啓示という広がりを保つ。「理性」や「メッセージ」より解釈を限定せず、現代の一般読者にも理解しやすい。
- source_word: πρὸς τὸν θεόν
  choice: 神とともに
  rationale: πρόςが示す対人的な関係と向き合いを、自然な日本語で表す。「神に向かって」では不自然に硬く、「神の御前に」では意味を説明的に限定しすぎる。
- source_word: θεὸς ἦν ὁ λόγος
  choice: ことばは神であった
  rationale: 冠詞のない前置述語 θεός の質的な力を保ち、ことばの神としての本質を明言する。同時に、直前の「神とともに」による区別を消さない。
theological_decisions:
- issue: 最後の節にある無冠詞の述語 θεός の訳し方
  choice: ことばは神であった
  alternative: ことばは神的であった／神がいかなる方であるか、そのような方がことばであった
  rationale: ギリシア語の語順と無冠詞の述語は、ことばを直前の「神」と同一の人格として扱うより、ことばの本質が神であることを質的に述べていると理解できる。本文では簡潔で力のある訳を採り、別訳でその含みを示す。
translation_notes:
  register: 明瞭な現代標準日本語。荘重さを保ちながら古語を避けた。「ことば」は平仮名とし、日常語としての分かりやすさと、文脈によって人格的呼称となる余地を両立させた。脚注記号は説明対象の語句に直接配置した。
