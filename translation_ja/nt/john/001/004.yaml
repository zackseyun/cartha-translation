id: JHN.1.4
reference: John 1:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν αὐτῷ ζωὴ ἦν, καὶ ἡ ζωὴ ἦν τὸ φῶς τῶν ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/004.yaml
  text: In him was life[a], and the life was the light of men.
translation:
  language: ja
  text: この方のうちに命があった。その命は、人々の光であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: この方のうちに
  rationale: αὐτῷは直前の「ことば」を指し、文脈では人格的に描かれている。「彼のうちに」よりも、現代日本語で敬意と指示対象の明瞭さを自然に保つ「この方のうちに」とした。ἐνの内在的な表現も保持している。
- source_word: ζωὴ
  choice: 命
  rationale: 単純で重みのある語義を保ち、ここで「永遠の命」などと説明的に限定しない。
- source_word: ἦν
  choice: あった／であった
  rationale: 未完了過去のεἰμίを簡潔に表し、序文における継続的な存在の含みを過度に説明しない。日本語の自然さに応じて第一節では「あった」、第二節の述語同定では「であった」とした。
- source_word: ἡ ζωὴ
  choice: その命
  rationale: 冠詞による前出の「命」への照応を、日本語では「その」によって明示した。
- source_word: τὸ φῶς
  choice: 光
  rationale: ヨハネ文書の中心的な比喩をそのまま保つ。日本語では定冠詞を機械的に補わず、述語として自然な「光」とした。
- source_word: τῶν ἀνθρώπων
  choice: 人々の
  rationale: ἄνθρωποιは性別を限定せず人間一般を指す。属格を「人々の」と訳し、「人間の」より自然な文として原文の構造を保った。
theological_decisions:
- issue: αὐτῷの指示対象と人格性
  choice: 「この方」とし、「ことば」を人格的な指示対象として訳す。
  alternative: 「それ」または「その中」
  rationale: 直前の文脈で「ことば」は神との関係において人格的に提示されている。ただし、この節自体に後代の教理用語を加えることはしない。
- issue: ἀνθρώπωνの一般的な指示範囲
  choice: 男女を含む「人々」
  alternative: 「人間」または文語的・男性限定にも聞こえ得る表現
  rationale: ギリシア語は文法上男性複数形だが、ここでは人類一般を指す。現代日本語でその包括的意味を曖昧にしない。
- issue: 命と光の関係
  choice: 「その命は、人々の光であった」と述語同定の形を保持する。
  alternative: 「その命が人々を照らした」など機能的に言い換える。
  rationale: 原文は「命」が「光」であったと述べており、照明作用だけに意味を狭めないため、比喩と神学的緊張をそのまま保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の二つの節を二文に分け、照応関係を「その命」で明確にした。注記を要する異読・語義上の重大な代案はないため、脚注は付していない。
