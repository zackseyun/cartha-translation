id: JHN.1.2
reference: John 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτος ἦν ἐν ἀρχῇ πρὸς τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: ja
  text: この方は初めに神とともにおられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この者は初めに神とともにいた。」
    reason: οὗτοςとἦνを、より形式的に訳す可能性を示すため。
lexical_decisions:
- source_word: οὗτος
  choice: この方
  rationale: 直訳的には「この者」だが、文脈上は1節の「ことば」を受ける指示代名詞である。現代日本語として自然で敬意を保つ「この方」とし、指示的な強調も残した。
- source_word: ἦν
  choice: おられた
  rationale: εἰμίの未完了過去で、初めにすでに継続して存在していたことを表す。人格的な主語と「神とともに」という文脈に合わせ、「いた」よりも品位ある「おられた」とした。
- source_word: ἐν ἀρχῇ
  choice: 初めに
  rationale: 創世記1章1節への明瞭な響きを保ち、ヨハネ1章1節との反復も維持する。「初めから」では起点以後という含みが強くなるため採らない。
- source_word: πρὸς
  choice: とともに
  rationale: 対格を伴うπρόςはここで、近さだけでなく相手に向き合う人格的な関係と区別を示す。「とともに」は日本語として自然で、関係性を過度に説明せずに表せる。
- source_word: τὸν θεόν
  choice: 神
  rationale: ギリシア語では定冠詞を伴うが、日本語では冠詞を訳し分けない。「神」として特定の指示対象を自然に表した。
theological_decisions:
- issue: οὗτοςが指すもの
  choice: 1節の「ことば」を受け、「この方」と訳す。
  alternative: 「この者」または文脈を補って「彼」
  rationale: οὗτοςの指示性を保ちつつ、主語が人格的に語られていることを自然な日本語で示す。本文にはない固有名や教理的説明は加えない。
- issue: πρὸς τὸν θεόνの含意
  choice: 「神とともに」として、関係と区別を表す。
  alternative: 「神に向かって」または「神のもとに」
  rationale: 「神に向かって」は方向性を強く出しすぎ、「神のもとに」は従属的・場所的に響く可能性がある。「神とともに」は、両者の親しい関係と区別という原文の緊張を過度に規定せず保つ。
translation_notes:
  register: 明快な現代標準日本語を用いながら、ヨハネ福音書冒頭にふさわしい簡潔さと品位を保った。1節との語句の反復が見えるよう「初めに」「神とともに」を維持した。
