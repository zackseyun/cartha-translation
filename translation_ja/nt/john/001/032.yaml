id: JHN.1.32
reference: John 1:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐμαρτύρησεν Ἰωάννης λέγων ὅτι Τεθέαμαι τὸ πνεῦμα καταβαῖνον ⸀ὡς περιστερὰν ἐξ οὐρανοῦ, καὶ ἔμεινεν ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/032.yaml
  text: And John testified[a], saying, “I have seen the Spirit descending like a dove out of heaven[b], and it remained on him.”
translation:
  language: ja
  text: また、ヨハネはこう証言した。「私は、御霊が天から鳩のように降って来て、この方の上にとどまったのを見ました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: 証言した
  rationale: μαρτυρέωの証人として証しするという含意を保ちつつ、現代日本語で明瞭な表現とした。
- source_word: Τεθέαμαι
  choice: 見ました
  rationale: 完了形が示す、実際に目撃し、その認識が現在にも及んでいることを文脈から自然に伝える。日本語では不自然な完了表現を避けた。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 直後の1:33を含む文脈では神の霊を指す。「御霊」は人格的・神的指示対象を明確にしつつ、「聖なる」を本文へ補わない。
- source_word: καταβαῖνον
  choice: 降って来て
  rationale: 下方への移動を自然な現代日本語で表し、後続するἔμεινενと一続きの目撃内容として訳した。
- source_word: ὡς περιστερὰν
  choice: 鳩のように
  rationale: ὡςの比較の働きを明示し、御霊を文字どおり鳩と同一視しない原文の比喩的余地を保つ。
- source_word: ἐξ οὐρανοῦ
  choice: 天から
  rationale: 起点を示すἐξを明瞭に表す。日本語では「天の外から」より「天から」が自然で、移動の起点も十分に伝わる。
- source_word: ἔμεινεν
  choice: とどまる
  rationale: ヨハネ文書で重要なμένωの継続・滞在の意味を保ち、関連箇所との語彙的一貫性にも配慮した。
- source_word: ἐπ’ αὐτόν
  choice: この方の上に
  rationale: 指示対象であるイエスへの敬意を自然に示しながら、ἐπίの空間的表現「上に」を保持する。
theological_decisions:
- issue: τὸ πνεῦμαの指示対象
  choice: 神の霊を指す「御霊」
  alternative: 一般的な「霊」
  rationale: 1:32–33の洗礼の文脈により神の霊が指示対象である。ただし原文にない「聖なる」は本文へ補わなかった。
- issue: ὡς περιστερὰνの意味
  choice: 比較を表す「鳩のように」
  alternative: 同一化とも読まれ得る「鳩として」
  rationale: ὡςはここで最も自然には様態・外観の類似を表すため、現象の具体的な形態を必要以上に断定しない。
- issue: ἔμεινενの主語と日本語での表現
  choice: 主語を繰り返さず「とどまる」とする
  alternative: 「御霊はこの方の上にとどまりました」
  rationale: ギリシア語では中性名詞πνεῦμαを受ける動詞であり、性別を示す代名詞はない。日本語でも代名詞を補わず、人格性や非人格性を文法以上に規定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「また、ヨハネはこう証言した」で叙述と引用を自然につなぎ、「この方」は直前の文脈で示されるイエスを指す。原文の分詞構造は、日本語として読みやすい「降って来て……とどまるのを見ました」に再構成した。
