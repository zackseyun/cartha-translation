  rationale: 動詞「とどまる」を過去形の「とどまった」に改め、原文のἔμεινενが示す完結した出来事を反映した。語順を「天から鳩のように」に整え、起点と比較の両方を自然に明示した。それ以外の意味内容と文脈上の敬意表現は維持した。
