source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: ja
  text: 彼は言った[a]。「私は荒野で叫ぶ者の声です。『主の道をまっすぐにせよ』と、預言者イザヤが言ったとおりです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の区切り方では、「私は荒野における、叫ぶ者の声です」とも訳せる。しかし、本文の読みのほうが自然である。
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: 彼は言った
  rationale: 直前の対話を受ける標準的な発話導入として、簡潔で自然な現代日本語にした。
- source_word: Ἐγὼ φωνὴ
  choice: 私は…声です
  rationale: 明示された一人称代名詞による自己提示を保ちつつ、日本語として自然な判断文にした。ギリシア語の無冠詞性を日本語で不自然に明示せず、比喩をそのまま保った。
- source_word: βοῶντος
  choice: 叫ぶ者の
  rationale: 属格分詞を「声」に結び付け、「叫ぶ者の声」とした。「叫ぶ」は預言的な呼びかけの強さを保つ。
- source_word: ἐν τῇ ἐρήμῳ
  choice: 荒野で
  rationale: ἔρημοςの地理的・聖書的響きを保つ一般的な訳語。「叫ぶ」に係る自然な読みを本文に採用した。
- source_word: Εὐθύνατε
  choice: まっすぐにせよ
  rationale: 複数へのアオリスト命令の直接性と、道を直くする比喩を、簡潔で格調ある命令形で表した。
- source_word: τὴν ὁδὸν
  choice: 道
  rationale: 具体的な道路と比喩的な生き方・備えの双方を担える語として「道」を選んだ。
- source_word: κυρίου
  choice: 主
  rationale: イザヤ引用における神を指す称号としての重みを保ち、文脈上の神学的含意を弱めない。
- source_word: καθὼς εἶπεν Ἠσαΐας ὁ προφήτης
  choice: 預言者イザヤが言ったとおりです
  rationale: καθὼςの一致・対応を「とおり」で明示し、日本語で自然な語順に整えた。
theological_decisions:
- issue: イザヤ引用中のκύριοςの訳
  choice: 主
  alternative: 主人
  rationale: 旧約引用における神への称号としての響きを保持し、単なる人間の主人という意味に狭めないため。
- issue: 「荒野で」の係り先
  choice: 荒野で叫ぶ者の声
  alternative: 荒野にある、叫ぶ者の声
  rationale: 語順上は別の係り方も構文的に考えられるが、本文の読みが最も自然であり、ヨハネの活動場所とも整合する。曖昧性は脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、預言の引用部分では「せよ」によって簡潔で格調ある調子を保った。引用の入れ子が分かるように二重かぎ括弧と一重かぎ括弧を使った。
