  terminology: 「荒野」「主」「道」「預言者イザヤ」はいずれも適切である。「まっすぐにせよ」は命令の直接性と引用の簡潔な格調を保っている。脚注の代案は、φωνήに「荒野で」を係らせる可能性をより正確かつ自然に示すため、「荒野における、叫ぶ者の声」とする。
