  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: ja
  text: イエスは彼らに言われた。「来なさい。そうすれば、見るでしょう。」そこで彼らは行って、彼がどこに滞在しているかを見、その日、彼のもとにとどまった。時刻は第十時ごろであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 日の出から数えるなら午後4時ごろ。ローマ式の時刻法では午前10時ごろと理解する見方もある。
    reason: 原文は時刻の数え方を特定していないため、本文では「第十時」を保持し、主要な二つの解釈を示す。
lexical_decisions:
- source_word: Ἔρχεσθε
  choice: 来なさい
  rationale: 現在命令法複数による招きを、自然で直接的な日本語として表した。
- source_word: ὄψεσθε
  choice: 分かります
  rationale: 直訳は「見ることになります」だが、この応答では来れば答えを実際に知るという含みがあるため、自然な招きとして「分かります」とした。後続の εἶδαν は具体的な視認なので「見て」と訳し、文脈上の用法の違いを示した。
- source_word: ἦλθαν οὖν
  choice: そこで彼らはついて行き
  rationale: οὖν の帰結を「そこで」で示し、ἦλθαν はイエスの招きに応じて同行した動きを日本語として自然に表した。
- source_word: εἶδαν
  choice: 見て
  rationale: 単純な視認を表すアオリストとして、簡潔に「見て」とした。
- source_word: ποῦ μένει
  choice: どこに滞在しておられるか
  rationale: μένω はここでは滞在場所を指す。「おられる」は、弟子たちのイエスへの発話・関わりを踏まえた自然な敬語表現である。
- source_word: παρ’ αὐτῷ
  choice: イエスのもとに
  rationale: παρά＋与格が示す近接と同伴を自然に表し、代名詞の指示対象を明確にした。
- source_word: ἔμειναν
  choice: 滞在した
  rationale: 先行する μένει との語彙的なつながりを保つため、同じ「滞在」を用いた。
- source_word: τὴν ἡμέραν ἐκείνην
  choice: その日は
  rationale: 原文どおり「その日」を保ち、「その日の残り」や「一日中」といった明示されない解釈を加えなかった。
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: 時刻は第十時ごろであった
  rationale: ὡς を「ごろ」、δεκάτη を「第十時」とし、時刻の数え方を本文で決めずに原文の表現を保持した。
- source_word: λέγει αὐτοῖς
  choice: イエスは彼らに言われた
  rationale: 歴史的現在を自然な日本語の過去叙述とし、主語を明示して読みやすくした。
theological_decisions:
- issue: 「第十時」の時刻算定
  choice: 本文では「第十時ごろ」と原文の時刻表現を保持する。
  alternative: 日の出から数えれば午後四時ごろ、ローマ式の数え方と理解すれば午前十時ごろ。
  rationale: 原文はどの時刻算定法かを明記していないため、本文では一方に決めず、主要な理解を脚注に示した。
translation_notes:
  register: 明瞭で現代的かつ品位のある標準語。会話は自然な敬体、地の文は簡潔な叙述体とした。「第十時」は古代の時刻表現を保持し、脚注で現代時刻の可能性を説明する。
