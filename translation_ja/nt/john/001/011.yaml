base_translation:
  language: en
  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: ja
  text: この方はご自分のところに来られたが、ご自分の民はこの方を受け入れなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ご自分のところ」は、「ご自分に属するもの」とも訳せる。ギリシア語では最初が中性複数形で、続く、人々を指す男性複数形の「ご自分の民」と区別されている。また「受け入れなかった」は、「迎え入れなかった」とも訳せる。
    reason: alternative_reading_and_lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: ご自分のところに
  rationale: 中性複数形は人々ではなく、この方に属する領域・故郷・家などを指す。日本語として自然さを保ちつつ、特定の一義に狭めない表現とした。
- source_word: ἦλθεν
  choice: 来られた
  rationale: ἔρχομαιのアオリストを素直に訳した。文脈上の主体である「ことば」への敬意を、現代日本語として自然な尊敬表現で示した。
- source_word: οἱ ἴδιοι
  choice: ご自分の民
  rationale: 男性複数形が人々を指すことを明示し、直前の中性複数形との違いを保った。「民」は所属する人々を簡潔かつ格調をもって表す。
- source_word: αὐτὸν
  choice: この方を
  rationale: 文脈上の「ことば」を指す男性単数代名詞。日本語で指示対象を明確にし、人格的な指示を保った。
- source_word: οὐ παρέλαβον
  choice: 受け入れなかった
  rationale: παραλαμβάνωがここで持つ、迎え入れる・受容するという幅を自然な日本語で表す。「歓迎しなかった」ほど情緒面に限定しない。
theological_decisions:
- issue: ἴδιοςの二つの用法の指示対象と対照
  choice: 最初の中性複数を「ご自分のところ」、次の男性複数を「ご自分の民」と訳し、領域と人々の区別を示す。
  alternative: 両方を「ご自分の民」とする、または最初を「ご自分の家」と限定する。
  rationale: 原文はτὰ ἴδια（中性複数）からοἱ ἴδιοι（男性複数）へ形を変えており、属する領域と属する人々との意図的な対照が認められる。最初を家・故郷・世界のどれか一つに限定せず、原文の含みを残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヨハネ福音書冒頭にふさわしい簡潔さと品位を保った。「ご自分のところ」は日常語として理解しやすく、同時に原文の領域的な曖昧さを保持する。
