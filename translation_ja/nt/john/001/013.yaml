  text: οἳ οὐκ ἐξ αἱμάτων οὐδὲ ἐκ θελήματος σαρκὸς οὐδὲ ἐκ θελήματος ἀνδρὸς ἀλλ’ ἐκ θεοῦ ἐγεννήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: ja
  text: この人々は、血筋からではなく[a]、肉の意志からでもなく、男の意志からでもなく、神から生まれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「血々からではなく」。ギリシア語では「血」が異例の複数形で、血筋、すなわち人間の親からの自然な出生を指す表現と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: この人々は
  rationale: 前節で述べられた人々を受ける関係代名詞。日本語では独立した節として自然につながるよう「この人々は」とした。
- source_word: ἐξ αἱμάτων
  choice: 血によってではなく[a]
  rationale: 原文の「血」は異例の複数形で、自然な血統や人間の親からの出生を指すと考えられる。日本語では複数形を不自然に作らず「血」とし、その特異な表現と意味を脚注で示した。
- source_word: θελήματος
  choice: 意志
  rationale: 三つの起源を対比する反復構造を保ち、人の欲求だけでなく意向や決定も含み得る語として「意志」を用いた。
- source_word: σαρκὸς
  choice: 肉
  rationale: 人間の身体的・生殖的側面を表す語を「肉」と訳し、「罪深い性質」など特定の神学的解釈を加えなかった。
- source_word: ἀνδρὸς
  choice: 男
  rationale: 成人男性を表す語であり、ここでは出生における男性側の意志を指すと考えられるため、一般的な「人」に平板化せず「男」とした。
- source_word: ἐκ θεοῦ
  choice: 神によって
  rationale: 先行する三つの人間的起源との対比を保ち、出生の源が神にあることを自然な日本語で示した。
- source_word: ἐγεννήθησαν
  choice: 生まれた
  rationale: γεννάω のアオリスト受動形。文脈上、自然な現代日本語の「生まれた」が適切であり、神による出生という受動的起源も文全体から明確である。
theological_decisions:
- issue: 人間的起源と神的起源との対比
  choice: 自然な血統、肉的な生殖、男性の意志に基づく出生を三重に否定し、神を起源とする出生を述べる表現として訳した。
  alternative: 民族的血統の否定に限定して読むことや、後代の特定の秘跡論的・形而上学的枠組みで詳しく規定することもあり得る。
  rationale: 原文は三つの否定句と「神によって」という肯定句を対照させるが、その出生の仕方をさらに定義してはいないため、特定教派の再生論を訳文に持ち込まなかった。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「肉」「男」という原文上の対比を保持しつつ、語順と助詞は日本語として読みやすく整えた。脚注記号[a]は本文中の該当箇所に置いた。
