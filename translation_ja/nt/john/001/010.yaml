id: JHN.1.10
reference: John 1:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: ja
  text: この方は世におられ、世はこの方を通して生じた[a]。そして、世はこの方を知らなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「世はこの方を通して存在するようになった」または「造られた」。ギリシア語の動詞は「生じる」「存在するようになる」という意味。
    reason: lexical_alternative
  - marker: b
    text: 「知らなかった」には、「この方だと分からなかった」「認めなかった」という意味合いもあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: 世
  rationale: 三度のκόσμοςを一貫して「世」と訳し、被造世界、人間社会、神に背く人類というヨハネ文書での重層的な含みを保つ。
- source_word: ἦν
  choice: おられ
  rationale: 未完了過去が示す継続的な存在を自然な敬体ではない聖書文体で表し、人格的な主語にも適合させる。
- source_word: δι’ αὐτοῦ
  choice: この方を通して
  rationale: 属格を伴うδιάの媒介・手段の意味を明確にし、1章3節とのつながりも保つ。
- source_word: ἐγένετο
  choice: 生じた
  rationale: 「存在する」を表すἦνとの対照を保ちつつ、世界が存在するようになったことを簡潔に示す。「造られた」よりも原語の態を直接反映する。
- source_word: ἔγνω
  choice: 知らなかった
  rationale: γινώσκωの基本義を保つ。文脈上含まれる「見分けなかった」「認めなかった」という意味合いは脚注で示す。
- source_word: αὐτόν / αὐτοῦ
  choice: この方
  rationale: 直前までのロゴスを指す男性単数代名詞の人格的指示を明確にする。日本語で「彼」を反復するより自然で、敬意ある文体にも合う。
theological_decisions:
- issue: 省略された主語の指示対象
  choice: 「この方」と補い、直前のロゴスを人格的に指す
  alternative: 「それ」として非人格的に訳す
  rationale: 直前の文脈ではロゴスが人格的に語られている。日本語では主語と代名詞の指示を明確にしつつ、本文以上の称号は加えない。
- issue: ロゴスと創造との関係
  choice: 「世はこの方を通して生じた」
  alternative: 「世はこの方によって造られた」
  rationale: ἦνとἐγένετοの対照、およびδιάが示す媒介性を保つ。「造られた」も可能だが、受動態を補わず原文の表現に近くした。
- issue: 第三節の接続関係
  choice: 「それなのに」で、創造者を世が知らなかったという逆接を明示する
  alternative: 単純接続の「そして」
  rationale: ギリシア語のκαί自体は単純接続だが、節間には明白な意外性・対照がある。自然な現代日本語でその談話関係を表しつつ、命題内容は変えない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、荘重さを保った。「この方」の反復により人格的指示を明確にし、「世」を三度一貫して用いて原文の反復と意味の重層性を保持した。
