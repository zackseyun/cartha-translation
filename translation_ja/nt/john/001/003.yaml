  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: ja
  text: すべてのものは、この方を通して生じた。生じたもののうち、この方によらずに生じたものは一つもない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳（この句を4節の冒頭に結び付ける場合）「この方にあって生じたものは、いのちであった。」
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: すべてのもの
  rationale: 中性複数の包括的な意味を保ち、被造物全体を指す宇宙的な範囲を明確にする。
- source_word: δι’ αὐτοῦ
  choice: この方を通して
  rationale: 属格を伴うδιάが示す媒介・手段を表す。「この方」は直前の「ことば」を受ける人格代名詞αὐτοῦを、自然かつ敬意ある日本語で示す。
- source_word: ἐγένετο
  choice: 生じた
  rationale: 単なる製作ではなく、存在するに至ったことを表すγίνομαιの意味を簡潔に伝える。
- source_word: χωρὶς αὐτοῦ
  choice: この方によらずに
  rationale: 媒介から離れて、またはそれなしに、というχωρίςの否定的関係を自然な日本語で表す。
- source_word: οὐδὲ ἕν
  choice: 一つもなかった
  rationale: 「一つさえない」という強い全面否定を、日本語として明瞭に表す。
- source_word: ὃ γέγονεν
  choice: すなわち、生じたものはすべて、この方を通して生じたのである
  rationale: 提示された句読法に従って3節に結び付け、完了形が示す現存する結果を「生じたもの」で表す。日本語では原文どおりの関係節を直訳すると不自然な重複になるため、総括的な言い換えで包括性を保持する。
theological_decisions:
- issue: 末尾の句 ὃ γέγονεν の結び付き
  choice: 3節に結び付け、すでに生じたものすべてが「この方」を通して生じたと読む。
  alternative: 4節の冒頭に結び付け、「この方にあって生じたものは、いのちであった」と読む。
  rationale: 初期のギリシア語写本には現代的な句読点がなく、どちらの構文も可能である。本文では提示されたSBLGNTの句読法に従い、真正な曖昧さは脚注に残す。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、ヨハネ福音書序文にふさわしい格調を保った。「彼」ではなく「この方」として、直前の「ことば」との照応を明確にした。脚注記号[a]は、代替的な節区分・構文解釈が関わる末尾に置いた。
