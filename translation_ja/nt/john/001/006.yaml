  text: There was a man sent from God[a], whose name was John.
translation:
  language: ja
  text: 神から遣わされた人がいた。名はヨハネであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένετο
  choice: 現れた
  rationale: ここでは新たな人物を物語に登場させる語。「現れた」は、存在の創始を意味すると決めつけず、自然な日本語でその登場を表す。
- source_word: ἄνθρωπος
  choice: 一人の人
  rationale: 個人としての男性ヨハネを指す。「一人の人」は原文の一般名詞としての表現を保ちつつ、自然に人物を導入する。
- source_word: ἀπεσταλμένος
  choice: 遣わされた
  rationale: 完了受動分詞が示す、送り出された者としての状態と使命を簡潔に保持する。
- source_word: παρὰ θεοῦ
  choice: 神から
  rationale: 属格を伴うπαράは起点・源を示す。神が派遣の源であることを表し、単に行為主体を示す「神によって」より原文の形に近い。
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: その名はヨハネであった
  rationale: 直訳的な構造を自然で格調ある現代日本語にしたもの。人物の名を明示する原文の独立した提示を保つ。
- source_word: Ἰωάννης
  choice: ヨハネ
  rationale: 日本語聖書で広く定着している標準的な人名表記を用いる。
theological_decisions:
- issue: ヨハネの使命の性格
  choice: ヨハネは「神から遣わされた」者として描かれる。
  alternative: 「神によって遣わされた」として神の行為主体性を前面に出す。
  rationale: ἀπεσταλμένοςとπαρὰ θεοῦの組み合わせは、神に由来する派遣・委任を示す。「神から」はその起点を保ちつつ、本文を超えて預言者職などの教理的規定を加えない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文にふさわしい簡潔で dignified な文体とした。「現れた」は物語への登場を自然に示し、「その名はヨハネであった」は原文の人物紹介の区切りを保つ。
