id: JHN.1.28
reference: John 1:28
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα ἐν Βηθανίᾳ ἐγένετο πέραν τοῦ Ἰορδάνου, ὅπου ἦν ⸀ὁ Ἰωάννης βαπτίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/028.yaml
  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: ja
  text: これらのことは、ヨルダン川の向こう側にあるベタニア[a]で起こった。そこでは、ヨハネが洗礼を授けていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一部の写本と後代の翻訳伝統では、「ベタニア」ではなく「ベタバラ」となっている。
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 複数形の指示代名詞を保ち、直前に記された一連のやり取りと出来事を受ける表現とした。
- source_word: ἐν Βηθανίᾳ
  choice: ベタニアで
  rationale: 地名を示すἐνの自然な場所表現として訳した。
- source_word: ἐγένετο
  choice: 起こった
  rationale: ここでは一連の出来事が生じたことを述べるため、現代日本語として簡潔な表現を用いた。
- source_word: πέραν τοῦ Ἰορδάνου
  choice: ヨルダン川の向こう側にある
  rationale: 基準となる側から川を越えた場所を指す表現であり、その位置関係を自然な日本語で示した。
- source_word: ὅπου
  choice: そこでは
  rationale: 先行するベタニアという場所を受け、後続文とのつながりが明瞭になるようにした。
- source_word: ἦν … βαπτίζων
  choice: 洗礼を授けていた
  rationale: 迂言的未完了形が表す継続中の活動を「～ていた」で保った。「洗礼を授ける」はこの文脈で広く理解される自然な表現である。
theological_decisions:
- issue: 地名Βηθανίᾳ（ベタニア）と異読Βηθαβαρᾷ（ベタバラ）
  choice: ベタニア
  alternative: ベタバラ
  rationale: 本文は提示されたSBLGNTの読みΒηθανίᾳに従う。後代の写本や翻訳伝統で知られる「ベタバラ」は、本文に採用せず異読として脚注に残した。
- issue: βαπτίζωの訳語
  choice: 洗礼を授ける
  alternative: 浸す／バプテスマを授ける
  rationale: 水を用いる儀礼的行為という文脈を明確にしつつ、浸礼など特定の施行方式を本文で断定しない、一般に理解しやすい訳語を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「これらのこと」で原文の複数形を保ち、「洗礼を授けていた」で継続的な動作を自然に表した。地理表現は「ヨルダン川の向こう側にある」とし、位置関係を分かりやすくした。
