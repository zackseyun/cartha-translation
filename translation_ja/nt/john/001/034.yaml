  text: κἀγὼ ἑώρακα, καὶ μεμαρτύρηκα ὅτι οὗτός ἐστιν ὁ ⸀ἐκλεκτὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/034.yaml
  text: And I have seen and have testified that this is the Chosen One of God[a].
translation:
  language: ja
  text: そして私も、この方を見、この方こそ神に選ばれた方だと証言してきた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「神に選ばれた方」の代わりに「神の子」とある。
    reason: textual_variant
lexical_decisions:
- source_word: κἀγώ
  choice: そして私は
  rationale: καίとἐγώの融合形。前節とのつながりと、証言者である「私」への強調を自然な日本語で保つ。
- source_word: ἑώρακα
  choice: それを見て
  rationale: 完了形はヨハネ自身の目撃と、その認識が現在の証言の根拠であることを示す。日本語では後続の完了形と連ね、「見て」とすることで自然に表現した。目的語の「それ」は前節のしるしを受ける文脈上の補足である。
- source_word: μεμαρτύρηκα
  choice: 証言してきた
  rationale: 完了形の、過去になされた証言が現在も有効であるという含みを、明瞭な現代日本語で表す。
- source_word: ὅτι
  choice: と
  rationale: 証言の内容を導く接続詞であり、日本語の引用助詞「と」で自然に表す。
- source_word: οὗτός
  choice: この方こそ
  rationale: イエスを直接指し示す指示代名詞。敬意ある「この方」とし、「こそ」によってギリシア語の指示の強さを自然に示す。
- source_word: ἐκλεκτός
  choice: 選ばれた方
  rationale: 定冠詞を伴って名詞的に用いられた形容詞。「選ばれた方」は現代日本語として明瞭で、称号的な用法も保つ。
- source_word: τοῦ θεοῦ
  choice: 神に
  rationale: 属格が示す選びの主体・関係を、日本語では「神に選ばれた方」と自然に表現する。「神の選ばれた方」より明晰である。
theological_decisions:
- issue: ヨハネ1:34のキリスト論的称号
  choice: 神に選ばれた方
  alternative: 神の子
  rationale: 指定されたSBLGNT本文のὁ ἐκλεκτὸς τοῦ θεοῦを直接訳し、より広く知られた異読に本文を合わせない。重要な異読「神の子」は脚注に明記し、本文批評上および神学上の緊張を保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この方」はイエスを指す敬意ある自然な表現。「証言してきた」により二つのギリシア語完了形のうち、証言の継続的な有効性を明示した。
