  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: ja
  text: シモン・ペテロの兄弟アンデレは、ヨハネから聞き、その方について行った二人のうちの一人であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「ヨハネから聞き、彼について行った二人のうちの一人」。文脈上、「彼」はイエスを指す。
    reason: 原文の代名詞αὐτῷを本文では「その方」として保ち、文脈上の指示対象を説明するため。
lexical_decisions:
- source_word: ἦν
  choice: であった
  rationale: 未完了過去形の連結動詞であり、アンデレを「二人のうちの一人」と同定している。現代日本語として自然で、叙述の格調も保つ。
- source_word: Ἀνδρέας
  choice: アンデレ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: シモン・ペテロの兄弟
  rationale: 属格関係を自然な日本語で表した。ἀδελφόςはここでは実の兄弟を指すが、原文は兄か弟かを明示しないため「兄弟」とした。
- source_word: εἷς ἐκ τῶν δύο
  choice: 二人のうちの一人
  rationale: 部分を示す定型表現を正確かつ自然に訳した。
- source_word: τῶν ἀκουσάντων παρὰ Ἰωάννου
  choice: ヨハネから聞いて
  rationale: παρά＋属格の出所を「ヨハネから」で保持した。何を聞いたかは直前の文脈に委ね、本文に補わない。
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: イエスについて行った
  rationale: ἀκολουθέωを具体的な移動を含む「ついて行く」と訳した。日本語では単なる「彼」がヨハネを指すように誤読されやすいため、文脈上の指示対象であるイエスを明示した。
theological_decisions:
- issue: αὐτῷの指示対象
  choice: 本文で「イエス」と明示する
  alternative: 「彼について行った」として代名詞のまま残す
  rationale: ギリシア語の代名詞だけなら形式上は曖昧だが、1:35–39の物語では二人がヨハネの言葉を聞いた後にイエスについて行っている。日本語の「彼」は直前のヨハネを指すと受け取られやすいため、物語上明確な指示対象を示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「であった」によって聖書本文にふさわしい落ち着いた叙述調を保った。「兄弟」は年長・年少を特定せず原文の情報量を維持する。
