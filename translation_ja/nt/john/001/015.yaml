  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: ja
  text: ヨハネはこの方について証しし、声を上げてこう言っている。「この方こそ、私が『私の後から来る方は、私に先立つ方となられた[a]。私より先におられたからである[b]』と言った方である。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私にまさる者となられた」または「私より上位になった」。ギリシア語は、順序だけでなく、優先性や地位を表すこともできる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私より先に存在しておられた」。本文の「私より先におられた」は原文により近い表現でありながら、文脈における先在の含みも残している。
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: 証しし
  rationale: 現在形の生き生きとした証言の働きを保ちつつ、法廷的な証言の意味も持つ自然な現代日本語とした。
- source_word: περὶ αὐτοῦ
  choice: この方について
  rationale: περί＋属格を自然に表し、文脈上の指示対象に敬意を示す日本語とした。
- source_word: κέκραγεν λέγων
  choice: 声を上げてこう言っている
  rationale: κράζωの強い発声と、完了形が示す過去の発言の持続的な効力を、日本語として不自然にならない範囲で表した。
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: と私が言ったのは、この方のことである
  rationale: 日本語では引用を先に置くことで自然にしつつ、過去の発言への指示と「この方」という同定を保持した。
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: 私の後から来る方
  rationale: ὀπίσωの時間的・順序的な意味と、現在分詞の継続的な表現を簡潔に保った。
- source_word: ἔμπροσθέν μου γέγονεν
  choice: 私より先になった
  rationale: ἔμπροσθενの前後・優先という比喩と、γέγονενの完了的な「そうなった」を保ち、「私にまさる」と一義的に解釈しすぎないようにした。
- source_word: ὅτι
  choice: からである
  rationale: 直前の主張の理由を導く接続として明確に表した。
- source_word: πρῶτός μου ἦν
  choice: 私より先におられた
  rationale: πρῶτος＋属格が表す先行性を保持し、「存在していた」と明示的に補わず、文脈が示す先在の含意を残した。
theological_decisions:
- issue: 結びの句とキリストの先在との関係をどこまで明示するか
  choice: 「私より先におられた」と訳す
  alternative: 「私より先に存在しておられた」
  rationale: 文脈はキリストの先在を強く示すが、「存在していた」と説明的に補うことは避け、原文の簡潔さと神学的な含みを保持した。
- issue: ἔμπροσθέν μου γέγονενを地位の優越として明示するか
  choice: 「私より先になった」と訳す
  alternative: 「私にまさる者となった」／「私より上位になった」
  rationale: 原語は順序だけでなく優先性や地位も表し得るため、本文では多義性を残し、解釈的な選択肢を脚注に示した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語を用いた。「この方」「おられた」により自然な敬意を示したが、教派固有の用語は避けた。脚注記号は、それぞれが説明する句の直後に配置した。
