revisions:
- from: さて、ヨハネの証言は次のとおりである。ユダヤ人たち[a]がエルサレムから祭司たちとレビ人たちを遣わし、「あなたは誰ですか」と彼に尋ねさせた時のことである。
  to: これは、ユダヤ人たち[a]がエルサレムから祭司とレビ人を派遣し、「あなたは誰ですか」と彼に尋ねるために遣わした時の、ヨハネの証言である。
  rationale: 時間節を主文に統合してὅτεの関係を明瞭にした。派遣の目的を「彼に尋ねるために」と訳し、ἵνα節を使役表現なしで表した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T06:23:24Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は全体として原文の意味を適切に伝えている。しかし、「証言は次のとおりである」と「…時のことである」の組合せは、ὅτεが導く時間節を不自然に重複して処理している。また「尋ねさせた」は使役にも読め、ἵναが示す派遣目的を「尋ねるために」と明示するほうが正確である。
  naturalness: 明瞭な現代標準日本語として、時間節を「…時の、ヨハネの証言である」と一文に整え、目的を「尋ねるために」とするほうが自然である。「派遣した」は「遣わした」より現代語として平明であり、公的な派遣の文脈にも適する。
  terminology: 「証言」「祭司」「レビ人」は適切である。「ユダヤ人たち」は原語の集団呼称を保持し、脚注で文脈上の限定的な指示対象を説明する方法も妥当である。脚注の「ユダヤ地方の人々」は可能な別訳として保持できるが、本文の派遣主体が宗教的権威者層を含意する点を「特に」として慎重に述べる。
  issues:
  - severity: medium
    issue: 時間節の処理が重複し、日本語の文構造が不自然である。
    rationale: 「ヨハネの証言は次のとおりである。…時のことである」は、同じ導入機能を二重に果たしている。ὅτεの時間的関係を一つの構文で表す必要がある。
  - severity: medium
    issue: 「彼に尋ねさせた」は使役表現であり、派遣の目的を十分明確にしない。
    rationale: ἵνα ἐρωτήσωσιν αὐτόνは、派遣された祭司とレビ人がヨハネに尋ねるためという目的を表す。「彼に尋ねるために派遣した」が自然かつ忠実である。
  revised_text: これは、ユダヤ人たち[a]がエルサレムから祭司とレビ人を派遣し、「あなたは誰ですか」と彼に尋ねるために遣わした時の、ヨハネの証言である。
