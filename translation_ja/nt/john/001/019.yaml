id: JHN.1.19
reference: John 1:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ αὕτη ἐστὶν ἡ μαρτυρία τοῦ Ἰωάννου ὅτε ⸀ἀπέστειλαν οἱ Ἰουδαῖοι ἐξ Ἱεροσολύμων ἱερεῖς καὶ Λευίτας ἵνα ἐρωτήσωσιν αὐτόν· Σὺ τίς εἶ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/019.yaml
  text: And this is the testimony of John[a], when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”
translation:
  language: ja
  text: これは、ユダヤ人たち[a]がエルサレムから祭司とレビ人を派遣し、「あなたは誰ですか」と彼に尋ねるために遣わした時の、ヨハネの証言である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ人の指導者たち」または「ユダヤ地方の人々」とも訳せる。ヨハネ福音書で「ユダヤ人たち」は、ユダヤ人全体ではなく、特にユダヤ地方の宗教的権威者たちを指すことが多い。
    reason: 語句の別訳と指示対象の範囲を明確にするため。
lexical_decisions:
- source_word: μαρτυρία
  choice: 証言
  rationale: 法廷的な「証し」の含みを保ちつつ、ここでヨハネが述べる内容を指す名詞として、現代日本語で自然かつ明確である。
- source_word: τοῦ Ἰωάννου
  choice: ヨハネの証言
  rationale: 属格を主語的に取り、ヨハネについての証言ではなく、ヨハネが行った証言を表す。
- source_word: ὅτε
  choice: 時のことである
  rationale: 証言がなされた機会を導く時間的接続詞として訳し、日本語として文の関係が明瞭になる形にした。
- source_word: ἀπέστειλαν
  choice: 遣わし
  rationale: 公的な使者として祭司たちとレビ人たちを送ったという文脈に合い、「送る」よりも任務を帯びた派遣の含みが伝わる。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文の集団呼称を本文で保持する。ただし本節ではエルサレムの宗教的権威者たちが特に念頭にある可能性を脚注で明示する。
- source_word: ἐξ Ἱεροσολύμων
  choice: エルサレムから
  rationale: 出発地を表す前置詞句の標準的で自然な訳。
- source_word: ἱερεῖς καὶ Λευίτας
  choice: 祭司たちとレビ人たち
  rationale: 神殿に関係する二つの異なる集団を原文どおり区別して訳す。
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: 彼に尋ねさせた
  rationale: 派遣の目的と、遣わされた者たちが質問する関係を簡潔に示す。
- source_word: Σὺ τίς εἶ;
  choice: あなたは誰ですか
  rationale: 明示された二人称代名詞を自然な日本語の問いとして表し、相手の身元を問う意味を保つ。
theological_decisions:
- issue: ヨハネ福音書における οἱ Ἰουδαῖοι の指示対象
  choice: 本文では「ユダヤ人たち」とし、脚注でより限定的な指示対象の可能性を説明する。
  alternative: 「ユダヤ人の指導者たち」または「ユダヤ地方の人々」
  rationale: 原文の表現とその曖昧さを本文で保ちながら、全ユダヤ民族を一括して指すと誤解されないようにする。本節でエルサレムから祭司とレビ人を派遣する主体は、特に宗教的権威者層を指す可能性が高い。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、証言場面にふさわしい簡潔で格調ある叙述にした。「さて」で新しい段落の展開を示し、「次のとおりである」によって後続する証言場面を自然に導入した。
