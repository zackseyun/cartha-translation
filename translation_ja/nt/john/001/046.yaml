  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: ja
  text: ナタナエルはフィリポに言った。「ナザレから何か良いものが出るだろうか。」フィリポはナタナエルに言った。「来て、見なさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ Ναθαναήλ
  choice: ナタナエルは彼に言った
  rationale: καίは前節との単純な接続だが、日本語では文頭の「そして」を省くほうが自然である。αὐτῷは指示対象を補わず「彼に」として原文に沿った。
- source_word: Ἐκ Ναζαρὲτ
  choice: ナザレから
  rationale: ἐκが示す起点・出所を、現代日本語で自然な「から」によって表した。
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: 何か良いものが出るだろうか
  rationale: εἶναιの字義は「ある／存在する」だが、場所を起点とするἐκと結びついた問いとして「出る」が自然である。ただし字義的な別訳を脚注に残した。δύναταιの可能性は反語的な「だろうか」で表した。
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: フィリポは彼に言った
  rationale: 歴史的現在λέγειは、日本語の物語文として自然な過去形「言った」とした。冠詞は人名の前で訳出しない。
- source_word: Ἔρχου καὶ ἴδε
  choice: 来て、見なさい
  rationale: 二つの命令を自然な連続動作として表現した。ἴδεは単なる視線だけでなく自ら確かめる含みも保てる「見なさい」とした。
theological_decisions:
- issue: ナタナエルの問いの語調
  choice: 懐疑を示す反語的な問いとして訳し、嘲笑や侮蔑を明示する語は加えない
  alternative: ナザレから良いものなど出るものか
  rationale: 原文は強い疑念を示すが、明示的に嘲笑の調子までは示していないため、解釈を過度に加えない。
- issue: εἶναιとἐκの関係
  choice: 本文では自然な「出る」とし、脚注に字義的な「ある」を示す
  alternative: ナザレから何か良いものがあり得るだろうか
  rationale: 起源を問う文脈上「出る」が自然だが、原語の不定詞は「来る」ではなく「ある」であり、その形式上の違いを脚注で保持する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、会話の簡潔さと品位を保った。人名は日本語聖書で広く定着した「ナタナエル」「フィリポ」とした。
