  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: ja
  text: その翌日、ヨハネは再びそこに立っていて、ヨハネの弟子のうち二人もヨハネと一緒にいた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: その翌日
  rationale: 定冠詞を伴う時の慣用表現で、直前の出来事に続く日を指す。「その翌日」は物語上の連続性を自然に示す。
- source_word: πάλιν
  choice: 再び
  rationale: 前の場面と同様の状況が繰り返されていることを簡潔に表す。
- source_word: εἱστήκει
  choice: そこに立っており
  rationale: ἵστημι の過去完了形がここでは継続中の状態を描く。「立っており」によって場面の背景的・継続的な姿勢を示し、「そこに」は日本語として場所的な用法を自然にするために補った。
- source_word: ὁ Ἰωάννης
  choice: ヨハネ
  rationale: 人名の標準的な日本語表記。文脈上はバプテスマのヨハネだが、原文どおり名前だけを記す。
- source_word: καὶ
  choice: （読点による並列）
  rationale: ヨハネと二人の弟子が同じ場面にいることを並列する接続詞。日本語では読点で自然に接続し、後半を独立した述語で表した。
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: 弟子のうち二人が一緒にいた
  rationale: ἐκ の部分集合の意味を「うち二人」で保った。原文では後半の動詞が省略されているため、同じ場にいたことを日本語で自然に示す「一緒にいた」を補った。
