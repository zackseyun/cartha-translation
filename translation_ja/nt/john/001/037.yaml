  text: καὶ ἤκουσαν ⸂οἱ δύο μαθηταὶ αὐτοῦ⸃ λαλοῦντος καὶ ἠκολούθησαν τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: ja
  text: その二人の弟子は、ヨハネがそう語るのを聞いて[a]、イエスについて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼の二人の弟子は、彼が語るのを聞いて」。文脈上、どちらの「彼」もバプテスマのヨハネを指す。
    reason: 原文の代名詞的表現と、その文脈上の指示対象を示すため。
lexical_decisions:
- source_word: ἤκουσαν
  choice: 聞いて
  rationale: アオリストは、語られたことを耳にした出来事を簡潔に表す。文脈上、単なる聴覚ではなく、その言葉を受け止めて行動したことも自然に伝わる。
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: その二人の弟子
  rationale: 直前の節に登場した、バプテスマのヨハネと共にいた二人の弟子を指す。日本語では「その二人の弟子」とすることで既出の二人を自然に特定し、所有代名詞の不自然な反復を避ける。
- source_word: λαλοῦντος
  choice: ヨハネがそう語るのを
  rationale: 現在分詞は弟子たちが聞いた時にヨハネが語っていたことを示す。日本語では文脈上の話者を「ヨハネ」と明示し、「そう」によって直前の発言を受ける形が明瞭で自然である。
- source_word: ἠκολούθησαν
  choice: ついて行った
  rationale: ここではまずイエスの後を実際に追って行く動作を表すが、弟子として従うという物語上の含みもある。「ついて行った」は直近の動作を自然に表しつつ、その含みを排除しない。
- source_word: τῷ Ἰησοῦ
  choice: イエスに
  rationale: ἀκολουθέωに伴う与格は従う相手を示す。日本語では「イエスについて行った」とするのが自然である。
theological_decisions:
- issue: αὐτοῦおよびλαλοῦντοςの主体が誰か
  choice: バプテスマのヨハネを指すものとして訳文で明示した。
  alternative: 「彼の二人の弟子は、彼が語るのを聞いて」のように代名詞のまま残す。
  rationale: 直前の1:35–36ではヨハネが二人の弟子と共におり、イエスについて語っているため、統語上・文脈上ともにヨハネを指す。日本語で「彼」を重ねると指示対象がかえって不明瞭になり、イエスの弟子だと誤解されるおそれがある。
- issue: 「ついて行った」における物理的追従と弟子として従う含意
  choice: まず実際に後について行った出来事として訳し、弟子化の含意は語の響きとして残した。
  alternative: 「弟子となって従った」と明示する。
  rationale: この時点の叙述は具体的な移動を描いており、弟子となることまで明示すると本文以上に解釈を確定してしまう。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、福音書の叙述にふさわしい簡潔で品位ある調子とした。「そう語る」で直前のヨハネの発言とのつながりを保ち、「ついて行った」で具体的行動と弟子として従う含みの双方を残した。
