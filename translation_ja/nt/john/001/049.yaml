id: JHN.1.49
reference: John 1:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: ja
  text: ナタナエルは答えた。「ラビ、あなたは神の子です。あなたはイスラエルの王です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη αὐτῷ Ναθαναήλ
  choice: ナタナエルは答えた
  rationale: 日本語では応答の相手を文脈から自然に補えるため、αὐτῷを不自然に明示せず、対話叙述として簡潔に訳した。
- source_word: Ῥαββί
  choice: ラビ
  rationale: 当時のユダヤ的背景と呼びかけの称号を保つため、一般にも定着した音写を用いた。
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: 神の子
  rationale: 定冠詞を持つキリスト論的称号としてそのまま訳し、不定的な『神の一人の子』にも、解釈的な言い換えにもしていない。
- source_word: βασιλεὺς τοῦ Ἰσραήλ
  choice: イスラエルの王
  rationale: 属格を自然かつ形式的に保持し、王的・メシア的称号を『イスラエルを治める王』などと敷衍しなかった。
- source_word: σὺ εἶ … σὺ βασιλεὺς εἶ
  choice: あなたは…です。あなたは…です
  rationale: 明示された二度のσὺと並行構造の強調を、二つの独立した文で再現した。
- source_word: Ναθαναήλ
  choice: ナタナエル
  rationale: 現代日本語の聖書人名として分かりやすい慣用音写を採用した。
theological_decisions:
- issue: 『神の子』という告白のキリスト論的含意
  choice: 称号を弱めたり後代の教理表現で拡張したりせず、『神の子』とした。
  alternative: 『神のひとりの子』『神から来た者』
  rationale: ヨハネ福音書における強いキリスト論的響きを保持しつつ、この節自体が述べる範囲を越えて意味を限定しないため。
- issue: 『イスラエルの王』の王的・メシア的含意
  choice: 『イスラエルの王』という称号形を保持した。
  alternative: 『イスラエルを治める王』『イスラエルの支配者』
  rationale: 原文の王という語と属格表現を保ち、メシア的含意を説明的な意訳によって決め切らないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、直接の告白にふさわしい簡潔さと荘重さを保った。原文の反復による強調を維持した。
