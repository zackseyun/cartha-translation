  text: ⸀ὅτι ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν, καὶ χάριν ἀντὶ χάριτος·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: ja
  text: というのも、私たちは皆、この方の満ちあふれる豊かさから、恵みに代わる恵みを受けたからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恵みの上にさらに恵みを」または「次から次へと恵みを」とも訳せる。ギリシア語の表現は、一つの恵みに続いて別の恵みが与えられることを示し得るが、ἀντίはより字義的には「〜に代わって」を意味する。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: というのも〜からです
  rationale: 直前の叙述を受けて、その根拠または説明を導く接続詞の働きを、自然な現代日本語で表した。
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: この方の満ちあふれる豊かさから
  rationale: πλήρωμαの「満ちていること・充満・全体」という意味を保ちつつ、日本語として意味が伝わるよう「満ちあふれる豊かさ」とした。αὐτοῦは文脈上、ことばを指すため、尊厳ある「この方」とした。
- source_word: ἡμεῖς πάντες
  choice: 私たちは皆
  rationale: 明示された代名詞とπάντεςによる包括性と強調を、そのまま自然な語順で示した。
- source_word: ἐλάβομεν
  choice: 受けた
  rationale: アオリストの事実叙述を簡潔に表し、日本語では文脈上、現在に及ぶ受領の含みも妨げない。
- source_word: καὶ
  choice: （句を並置）
  rationale: 後続句が受けたものを補足・明示する働きを、日本語では句の並置によって表した。機械的に「そして」を加えるより自然である。
- source_word: χάριν ἀντὶ χάριτος
  choice: 恵みに代わる恵みを
  rationale: ἀντίの基本的な「〜に代わって／〜に代わる」という語義を保ち、置換と継起の間にある原文の解釈上の緊張を本文で残した。
theological_decisions:
- issue: χάριν ἀντὶ χάριτος の解釈
  choice: 恵みに代わる恵み
  alternative: 恵みの上にさらに恵み／次から次へと恵み
  rationale: ἀντίは基本的に「〜の代わりに」を意味する一方、この句は相次ぐ恵みを表すとも理解される。本文ではより字義的な関係を保ち、累加・継起の解釈は脚注に示して、曖昧さを一方に決着させない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着きと尊厳を保った。「この方」は指示対象への敬意と文脈上の明確さを両立させる。末尾の目的語句を独立させ、原文の印象的な反復を生かした。
