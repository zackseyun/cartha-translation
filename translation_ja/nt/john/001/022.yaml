  text: εἶπαν οὖν αὐτῷ· Τίς εἶ; ἵνα ἀπόκρισιν δῶμεν τοῖς πέμψασιν ἡμᾶς· τί λέγεις περὶ σεαυτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: ja
  text: そこで、彼らはヨハネに言った。「あなたは誰なのですか。私たちを遣わした人たちに返答をするために、あなた自身について何と言うのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のやり取りを受けた推論的・継続的な展開を、自然な現代日本語で示す。
- source_word: εἶπαν ... αὐτῷ
  choice: 彼らはヨハネに言った
  rationale: λέγωによる直接話法の導入を素直に訳した。日本語では代名詞だけだと指示対象が曖昧になりやすいため、文脈上の相手であるヨハネを明示した。
- source_word: Τίς εἶ;
  choice: あなたは誰なのですか
  rationale: 簡潔な身元への問いを保ちつつ、調査者たちの問いとして自然で丁寧な表現にした。
- source_word: ἵνα
  choice: できるように
  rationale: 遣わした者たちに返答するという目的を自然な日本語で表した。
- source_word: ἀπόκρισιν δῶμεν
  choice: 返事ができる
  rationale: 直訳的な「答えを与える」より自然で、派遣者へ回答を持ち帰る意味を明確に伝える。
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: 私たちを遣わした人たちに
  rationale: 冠詞付き分詞の実質的な名詞用法を、明瞭な関係節で表した。
- source_word: τί λέγεις
  choice: 何と言うのですか
  rationale: 現在形による自己証言の要求を、自然な直接質問として表した。
- source_word: περὶ σεαυτοῦ
  choice: あなた自身について
  rationale: περί＋属格の話題・関連の意味と再帰的な強調をともに保持した。
