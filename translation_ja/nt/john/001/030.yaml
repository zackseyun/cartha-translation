id: JHN.1.30
reference: John 1:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτός ἐστιν ⸀ὑπὲρ οὗ ἐγὼ εἶπον· Ὀπίσω μου ἔρχεται ἀνὴρ ὃς ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: ja
  text: この方こそ、私が『私の後から一人の人が来られる。その方は私にまさる方となられた[a]。私より先におられたからである[b]』と言った、その方です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その方は私に先立つ方となられた」。ギリシア語は、時間的に先であることだけでなく、優先性や上位の地位を表すこともできます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私より前から存在しておられた」。この表現はイエスの先在を示唆しますが、ギリシア語本文は簡潔に「私より先におられた」と述べています。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: この方こそ…その方です
  rationale: 指示代名詞とコピュラによる強調された同定を、現代日本語で自然かつ荘重に表した。
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: 私が…と言った、その方
  rationale: εἶπονに続くὑπὲρ οὗの指示関係を、日本語として自然な連体構造で示した。
- source_word: Ὀπίσω μου ἔρχεται
  choice: 私の後から…来る
  rationale: ὀπίσωの第一義的な前後関係を保ち、文脈上の時間的順序も自然に伝える。
- source_word: ἀνὴρ
  choice: 一人の人
  rationale: 成人男性を指す語だが、日本語でイエスを『一人の男』と呼ぶ不自然さを避けつつ、個人を明示する。
- source_word: ἔμπροσθέν μου γέγονεν
  choice: 私より先におられるようになった
  rationale: ἔμπροσθενの『前・先』とγέγονενの完了形が示す成立後の現状態をできる限り保持し、優位だけに限定しない。
- source_word: ὅτι
  choice: …からである
  rationale: 先行する発言の理由を示す因果関係を明確にした。
- source_word: πρῶτός μου ἦν
  choice: 私より先におられた
  rationale: 時間的先在と優先性の両方に開かれた、ギリシア語の簡潔な表現を保つ。
theological_decisions:
- issue: 末尾の句とキリストの先在との関係
  choice: 私より先におられた
  alternative: 私より前から存在しておられた／私より上位であった
  rationale: ヨハネ文書の文脈では先在を強く示唆するが、本文は『存在していた』と明示せず、優先性との響き合いも残すため、解釈を訳文で一つに固定しない。
- issue: ἔμπροσθέν μου γέγονενにおける時間と地位の含意
  choice: 私より先におられるようになった
  alternative: 私より上位になられた
  rationale: 優位・先行の意味を認めつつ、地位だけに限定せず、γέγονενの完了的な形も反映した。
translation_notes:
  register: 明瞭な現代標準語を用い、証言としての荘重さを保った。「方」「おられる」によって指示対象への敬意を自然に示しつつ、教派固有の語彙は避けた。
