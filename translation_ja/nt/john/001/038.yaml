id: JHN.1.38
reference: John 1:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: ja
  text: そこでイエスは振り向き、彼らがついて来るのを見て、「何を求めているのですか[a]」と言われた。彼らはイエスに言った。「ラビ（訳すと『先生』）[b]、どこに滞在しておられるのですか[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何を探しているのですか」。ギリシア語は普通に何かを探すことも表すが、「求める」には、この問いが持ち得るより深い響きも残る。
    reason: lexical_alternative
  - marker: b
    text: 「ラビ」はヘブライ語またはアラム語に由来する呼称で、「先生」という意味。
    reason: cultural_note
  - marker: c
    text: 別訳「どこにとどまっておられるのですか」。このギリシア語動詞は、ヨハネ福音書のほかの箇所でしばしば「とどまる」と訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: 振り向き
  rationale: イエスが彼らの方へ向きを変えた動作を、方向を過度に限定せず自然な日本語で表す。
- source_word: θεασάμενος
  choice: 見て
  rationale: 単なる視認だけでなく注意を向けて見た含みを文脈が補えるため、簡潔で自然な表現とした。
- source_word: ἀκολουθοῦντας
  choice: ついて来る
  rationale: その時点で実際に後を歩いていた継続的な動作を表しつつ、弟子として従うというヨハネ福音書上の含みも排除しない。
- source_word: Τί ζητεῖτε;
  choice: 何を求めているのですか
  rationale: ζητέωの通常の『探す』という意味と、より深い願いや探求を問う可能性の双方を保つ。
- source_word: Ῥαββί
  choice: ラビ
  rationale: 本文自身が直後に訳語を添えているため、ユダヤ的な呼称を音写して保持する。
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: 訳すと『先生』
  rationale: セム語の称号をギリシア語読者に説明する本文の挿入句を、簡潔で自然な現代日本語にした。
- source_word: ποῦ μένεις;
  choice: どこに滞在しておられるのですか
  rationale: この場面では居所を尋ねる実際的な問いであるため『滞在する』とした。同時に、『泊まる』よりもμένωの継続性をある程度保つ。
theological_decisions:
- issue: ヨハネ福音書で神学的な重みを持つμένωの最初期の用例
  choice: どこに滞在しておられるのですか
  alternative: どこにとどまっておられるのですか
  rationale: 直近の文脈ではイエスの滞在場所を尋ねているため、自然な場所表現を採用した。一方、脚注で同じ動詞が後に『とどまる』とも訳されることを示し、語の連関を失わせない。
- issue: ζητέωにあり得るヨハネ的な二重の響き
  choice: 何を求めているのですか
  alternative: 何を探しているのですか
  rationale: 日常的な問いとしても、人生や信仰上の探求を問う言葉としても読める表現を選び、どちらか一方に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話には自然な敬意を持たせた。叙述は簡潔で格調を保ち、ζητέωとμένωにある日常的意味とヨハネ的な含みの緊張を本文と脚注で保持した。
