  source_fidelity: SBLGNTの構文と語義を適切に反映している。στραφεὶςは「振り向き」、θεασάμενος αὐτοὺς ἀκολουθοῦνταςは「彼らがついて来るのを見て」と自然に表され、現在分詞の進行中の動作も保たれている。Τί ζητεῖτε;を「何を求めているのですか」としたことで、通常の探索とヨハネ文脈での含みの双方を不必要に限定していない。ποῦ μένεις;も、この場面での実際の居場所を問う意味として「どこに滞在しておられるのですか」は妥当である。
  naturalness: 明瞭な現代標準日本語として自然であり、叙述と会話の敬意の水準も一貫している。「ラビ（訳すと『先生』）」は、原文の説明的挿入句を読みやすく再現している。
  terminology: 「イエス」「ラビ」「先生」「求める」は適切である。「ラビ」を音写し、本文内の訳語説明を保持したことは原文に忠実である。「滞在する」はμένωのこの文脈上の居所・宿泊先という意味に適合し、脚注が「とどまる」というヨハネ内の語の連関を控えめに示している。
