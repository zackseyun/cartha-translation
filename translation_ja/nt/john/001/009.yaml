base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: ja
  text: すべての人を照らすまことの光が世に来ていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「世に来るすべての人を照らす、まことの光があった。」ギリシア語の「来る」は、「まことの光」ではなく「すべての人」に掛かるとも読める。
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: 光
  rationale: ヨハネ文書でキリストを指す比喩として働くが、原文は通常名詞なので、自然な普通名詞「光」とした。
- source_word: ἀληθινόν
  choice: まことの
  rationale: 単なる事実上の正しさに限らず、本物で究極的なものというヨハネ的な含みを保つ。
- source_word: φωτίζει
  choice: 照らす
  rationale: 光を与えるという字義と、霊的・認識的な比喩の双方を自然な日本語で保てる。
- source_word: πάντα ἄνθρωπον
  choice: すべての人
  rationale: 単数の総称表現が示す普遍性を、現代日本語で自然かつ性別を限定せずに表した。
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: 世に来ようとしていた
  rationale: 本文では「まことの光」に意味上結び付け、ἦνとの組み合わせを未完了的な到来として表現した。ただし文法上「すべての人」に掛ける読みも注で示す。
- source_word: κόσμον
  choice: 世
  rationale: κόσμοςに対する簡潔で定着した聖書的日本語であり、ここでは「世界」より自然に到来の表現を構成する。
- source_word: ἦν
  choice: していた
  rationale: 未完了過去の継続・進行的な性格を、分詞「来る」と合わせて表した。
theological_decisions:
- issue: ἐρχόμενον（「来る」）の統語的な係り先
  choice: 意味上「まことの光」に掛け、「まことの光が、世に来ようとしていた」とする。
  alternative: 「すべての人」に掛け、「世に来るすべての人を照らす、まことの光があった」とする。
  rationale: 分詞は文法上一致するἄνθρωπονに掛けられる一方、ヨハネ福音書における「世に来る」というキリスト論的表現と序文の流れは、光の到来という理解を支持する。本文で後者を採り、真正な曖昧さは脚注に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、荘重さを保ちつつ過度に古風な語法を避けた。「まこと」はヨハネ的な語感と日本語聖書の格調を両立させるため平仮名表記とした。
