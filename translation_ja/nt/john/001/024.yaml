  text: ⸀Καὶ ἀπεσταλμένοι ἦσαν ἐκ τῶν Φαρισαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/024.yaml
  text: And they had been sent from the Pharisees[a].
translation:
  language: ja
  text: また、彼らはファリサイ派から遣わされていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らはファリサイ派によって遣わされていた」。ギリシア語は直訳すると「ファリサイ派から」であり、派遣の出所を示す。
    reason: ἐκは直接には出所を示すが、文脈上はファリサイ派を派遣者として理解することもできるため。
lexical_decisions:
- source_word: Καὶ
  choice: さて
  rationale: 単純な接続を表しつつ、直前の問いから使節の所属・背景を説明する文への移行を、自然な日本語で示す。
- source_word: ἀπεσταλμένοι ἦσαν
  choice: 遣わされていた
  rationale: ἀποστέλλωの完了分詞とἦσανによる迂言形を、先になされた派遣の結果として彼らがその立場にあったことを示す表現で訳した。
- source_word: ἐκ
  choice: の人々の中から
  rationale: ἐκの基本的な起点・出所の意味を明示し、単に『によって』として行為主体を断定することを避ける。
- source_word: τῶν Φαρισαίων
  choice: ファリサイ派の人々
  rationale: 当時の宗教的集団を指す名称として、現代日本語で分かりやすい標準的な表現を用いる。
theological_decisions:
- issue: 使節とファリサイ派との関係
  choice: 彼らはファリサイ派の人々の中から遣わされていた
  alternative: 彼らはファリサイ派から遣わされていた／ファリサイ派によって遣わされていた
  rationale: ἐκ＋属格は直接には出所・所属を表すため、使節がファリサイ派に属していたという読みを本文で保持した。文脈上、ファリサイ派が派遣主体である可能性もあるため、脚注に代案を示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。『遣わされていた』により完了的な結果状態を表し、『の人々の中から』によって原文の出所・所属のニュアンスを保持した。
