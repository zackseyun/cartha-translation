id: JHN.1.29
reference: John 1:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: ja
  text: その翌日、ヨハネはイエスが自分のほうへ来られるのを見て、言った。「見よ、世の罪を取り除く神の小羊だ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: その翌日
  rationale: 物語の時間的な連続を、自然で明確な現代日本語で表す。
- source_word: βλέπει
  choice: 見て
  rationale: 歴史的現在形は、日本語の物語として自然になるよう過去の文脈に合わせた。
- source_word: πρὸς αὐτόν
  choice: 自分のほうへ
  rationale: イエスがヨハネのいる方向へ来るという意味を自然に表した。
- source_word: Ἴδε
  choice: 見よ
  rationale: 注意を強く促す命令表現を、簡潔で格調のある日本語として保持した。
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: 神の小羊
  rationale: 属格の解釈を限定せず、定着した聖書的表現を保持した。
- source_word: ὁ αἴρων
  choice: 取り除く
  rationale: αἴρω がここで持つ、罪を除去する意味を直接表す。「負う」という可能な含意を本文で一義化しない。
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: 世の罪
  rationale: 単数形の「罪」を保ち、人類世界に属する罪を集合的・包括的に表す原文の緊張を維持した。
theological_decisions:
- issue: 「神の小羊」の意味
  choice: 比喩を説明せず「神の小羊」とした
  alternative: 神が備えた犠牲の小羊
  rationale: 原文は犠牲、過越、イザヤ書などとの関連を明示的に特定していないため、象徴の豊かさと曖昧さを保った。
- issue: αἴρων の意味範囲
  choice: 取り除く
  alternative: 負う／担う
  rationale: 直接的な文脈と一般的用法に即して「取り除く」としたが、どのように取り除くかという贖罪論的仕組みは訳文で補わない。
- issue: 「世の罪」の単数形
  choice: 世の罪
  alternative: 世の罪々／人々の罪
  rationale: 原文の単数形を保持し、個々の罪だけでなく世界を支配する罪の総体も含みうる表現とした。
translation_notes:
  register: 明快な現代標準語を基本としつつ、宣言の力を保つため Ἴδε は「見よ」とした。主語の「彼」は曖昧になりやすいため、直前の文脈上の人物であるヨハネを明示した。イエスへの敬意を自然に表すため「来られる」としたが、過度な敬語表現は避けた。
