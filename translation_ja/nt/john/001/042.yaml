reference: John 1:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: ja
  text: アンデレはシモンをイエスのもとに連れて行った。イエスは彼を見つめて言われた。「あなたはヨハネ[a]の子シモンです。あなたはケファ[b]と呼ばれることになります。」（これは、ペトロと訳される。）
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 異本には「ヨナ」とするものがある。SBLGNT本文は「ヨハネ」。
    reason: textual_variant
  - marker: b
    text: 「ケファ」は「ペトロ」に対応するアラム語の名で、「岩」または「石」という意味を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν
  choice: 彼はその人をイエスのもとに連れて行った
  rationale: ἄγωのアオリストを完了した動作として自然に表し、πρός＋対格の方向性を「イエスのもとに」で示した。αὐτόνは文脈上シモンを指すが、本文にない固有名を補わず「その人」とした。
- source_word: ἐμβλέψας αὐτῷ
  choice: 彼をじっと見つめて
  rationale: ἐμβλέπωが示す、単なる一瞥よりも注意深く目を向けるニュアンスを、現代日本語として自然な「じっと見つめる」で表した。
- source_word: Σὺ εἶ Σίμων ὁ υἱὸς Ἰωάννου
  choice: あなたはヨハネの子シモンである
  rationale: 明示されたσὺの直接性を「あなたは」で保ち、SBLGNT本文のἸωάννουを「ヨハネ」とした。
- source_word: σὺ κληθήσῃ Κηφᾶς
  choice: あなたはケファと呼ばれる
  rationale: 未来受動形κληθήσῃの命名表現をそのまま保ち、Κηφᾶςは人名として標準的に音写した。
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: ケファは、訳すとペトロである
  rationale: 原文の説明的な挿入を括弧内に保ち、Πέτροςを人名「ペトロ」として音写した。「訳すと」はἑρμηνεύεταιの意味を平明な日本語で表す。
theological_decisions:
- issue: ケファ／ペトロの説明句の訳し方
  choice: 本文では両方を人名として「ケファ」「ペトロ」とする
  alternative: 意味を前面に出して「岩」または「石」と訳す
  rationale: 原文はセム語系の名Κηφᾶςをギリシア語の名Πέτροςで説明している。本文では命名という機能を保ち、語義は脚注で示すことで、この名に関する後代の神学的結論を本文へ持ち込まない。
translation_notes:
  register: 明瞭で現代的ながら、語りとイエスの宣言にふさわしい端正な文体とした。脚注記号は内容に対応する語の直後に置き、[a]を「ヨハネ」、[b]を「ケファ」に付した。
