  text: οὐκ ἦν ἐκεῖνος τὸ φῶς, ἀλλ’ ἵνα μαρτυρήσῃ περὶ τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: ja
  text: 彼はその光ではなかった。そうではなく、その光について証しするために来たのである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では後半の主節の動詞が省略されており、直前の文脈から補われる。直訳に近くは「彼はその光ではなかった。しかし、その光について証しするために［来た］のである。」
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκ ἦν
  choice: ではなく
  rationale: εἰμίの未完了過去に否定辞が付いた表現。日本語では、後半との対比を自然につなぐため「ではなく」とした。
- source_word: ἐκεῖνος
  choice: 彼
  rationale: 指示代名詞だが、ここでは直前のヨハネを強く指す人称的用法。「あの人」より自然な現代日本語である。
- source_word: τὸ φῶς
  choice: その光
  rationale: 定冠詞を踏まえ、序文ですでに示された特定の「光」を指すことを「その」で表した。
- source_word: ἀλλ’ ἵνα
  choice: その光について証しするために来たのである
  rationale: ἀλλάの後では主節の動詞が省略され、ἵναが目的を示す。前節の文脈から「来た」を補い、日本語として完結した自然な文にした。補足であることは脚注に示した。
- source_word: μαρτυρήσῃ
  choice: 証しする
  rationale: ヨハネ福音書で重要な証言・証言行為の意味を保ちつつ、現代日本語として通用する表現である。
- source_word: περὶ τοῦ φωτός
  choice: その光について
  rationale: 属格を伴うπερίの「〜について、〜に関して」という意味を明瞭に表した。
theological_decisions:
- issue: ヨハネと光との区別、およびヨハネの役割
  choice: ヨハネ自身が光であることを否定し、その光について証しすることが彼の目的だったと訳す。
  alternative: より逐語的に「彼はその光ではなく、ただその光について証しするためであった」として、後半の省略を残す。
  rationale: 証人と光を明確に区別する原文の対照を保った。「来た」は前節から補われる文脈上の省略を自然な日本語にしたもので、追加の教理説明ではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「証し」は本文の証言語彙との一貫性を意識した。省略された動詞を本文では自然に補い、原文の構造は脚注で示した。
