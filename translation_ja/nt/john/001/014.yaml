  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: ja
  text: ことばは肉となり、私たちの間に住まわれた[a]。私たちはその方の栄光を見た。それは、父から来られたひとり子の栄光に等しい栄光であり、その方は恵みと真理に満ちておられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「私たちの間に幕屋を張られた」。この動詞は、神が民の間に宿られた幕屋を思い起こさせる。
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγος
  choice: ことば
  rationale: ヨハネ福音書の序文で人格的な称号として用いられる語。日本語で定着した「ことば」を用い、「メッセージ」「理性」など一部の意味だけに限定しないようにした。
- source_word: σὰρξ ἐγένετο
  choice: 肉となり
  rationale: 受肉の具体性と、ἐγένετο が示す強い変化を保つため、「人となり」と意訳せず「肉となり」とした。
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: 私たちの間に住まわれた
  rationale: 本文では自然で明瞭な日本語とし、幕屋を想起させる動詞の比喩は脚注に残した。
- source_word: ἐθεασάμεθα
  choice: 私たちは……見た
  rationale: 直接目にした証言を、古風にならない簡潔な日本語で表した。
- source_word: δόξαν
  choice: 栄光
  rationale: 聖書全体およびヨハネ文書での重みと連関を保つ標準的な訳語。
- source_word: μονογενοῦς παρὰ πατρός
  choice: 父のもとから来られたひとり子
  rationale: μονογενής の唯一性と、παρά が示す父との由来・関係を自然に表した。ギリシア語本文には「子」に当たる名詞が明記されていないため、その点と別訳を脚注で示した。
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: その方は恵みと真理に満ちておられた
  rationale: πλήρης が男性単数で「ことば／ひとり子」を描写することを明確にし、「栄光」が満ちていたとの誤読を避けた。
theological_decisions:
- issue: μονογενοῦς を「ひとり子」と訳すか、「唯一の方」と訳すか
  choice: 本文は「ひとり子」
  alternative: 「父のもとから来られた唯一の方」
  rationale: 文脈上は父と子の関係が強く示唆され、日本語の「ひとり子」は唯一性を自然に伝える。ただし、語自体は主として唯一無二であることを表し、この節のギリシア語には「子」が明記されていないため、別訳を脚注に保存した。
- issue: ἐσκήνωσεν の幕屋の含意を本文で前面に出すか
  choice: 本文は「住まわれた」
  alternative: 「私たちの間に幕屋を張られた」
  rationale: 明瞭な現代日本語を優先しつつ、神が民の間に宿る幕屋のイメージを脚注で明示して、含意を失わないようにした。
- issue: πλήρης の指示対象
  choice: 「その方は」を補い、ことば／ひとり子を指すと示す
  alternative: 「恵みと真理に満ちた栄光」と続ける
  rationale: ギリシア語の πλήρης は男性単数であり、女性名詞「栄光」ではなく、ことばである方を描写している。この文法的関係を日本語で明確にした。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「住まわれた」「来られた」「満ちておられた」により、対象への敬意を自然に示した。「ことば」「肉」「栄光」「恵み」「真理」は本文の神学的連関を保つため、聖書日本語として定着した簡潔な語を用いた。
