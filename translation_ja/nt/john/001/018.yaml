id: JHN.1.18
reference: John 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: ja
  text: いまだかつて、神を見た者はいない。父の懐におられる唯一の神[a][b]が、その方を明らかにされた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、「唯一の神」の代わりに「唯一の子」（または「ひとり子」）とある。
    reason: textual_variant
  - marker: b
    text: 別訳「父の傍らにおられる」。ギリシア語は直訳すると「父の懐に」で、親密な結びつきを表す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「その方を解き明かされた」または「その方を知らせてくださった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: 神を
  rationale: ἑώρακενの直接目的語であり、ここでは絶対的な意味で神を指すため、標準的に「神」とした。
- source_word: οὐδεὶς
  choice: 者はいない
  rationale: 普遍的な否定を、現代日本語として自然かつ格調を保って表した。
- source_word: ἑώρακεν πώποτε
  choice: いまだかつて、見た
  rationale: 完了形とπώποτεを合わせた「これまで一度も見たことがない」という意味を、否定文全体の中で簡潔に表した。
- source_word: μονογενὴς θεὸς
  choice: ただひとりの神
  rationale: SBLGNT本文のθεόςをそのまま反映し、μονογενήςは通常の語義に基づいて「生まれた」を直接読み込まず、唯一無二の存在であることを示す「ただひとり」とした。異読は脚注に残した。
- source_word: ὁ ὢν
  choice: おられる
  rationale: μονογενὴς θεόςを説明する分詞句を、神的な人物を指す文脈にふさわしい自然な敬語表現にした。
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: 父の懐に
  rationale: κόλποςの「胸、懐」という比喩を保ち、父との親密な近さを表した。
- source_word: ἐκεῖνος
  choice: （主語「ただひとりの神」で表現）
  rationale: ギリシア語では指示代名詞によって主語が強調されるが、日本語で「その方が」を重ねると冗長になるため、明示された主語と係助詞「が」で自然に表した。
- source_word: ἐξηγήσατο
  choice: 明らかに示された
  rationale: 語り明かす、説明する、知らせるという意味領域を踏まえ、この文脈での神の啓示を明瞭に伝える表現とした。目的語の神は文脈上補った。
theological_decisions:
- issue: μονογενὴς θεὸςとὁ μονογενὴς υἱόςの本文異読
  choice: SBLGNT本文に従い、本文を「ただひとりの神」とした。
  alternative: 「ただひとりの子」または「ひとり子」
  rationale: 指定された原文はμονογενὴς θεόςであるため本文ではこれを訳し、重要なキリスト論的・本文批評上の異読を脚注で明示して、緊張関係を解消せずに残した。
- issue: μονογενήςの意味
  choice: 「ただひとり」
  alternative: 「ひとり子として生まれた」「唯一無二の」
  rationale: 現在の語彙的証拠に基づき、唯一性・比類なさを中心に訳した。「生まれた」という概念を語そのものの意味として本文に加えることは避けた。
- issue: ἐξηγήσατοの目的語
  choice: 日本語では「神を」と明示した。
  alternative: 「その方が明らかにされた」
  rationale: ギリシア語では目的語が省略され、直前の「神」が文脈上の対象となる。日本語では明示するほうが意味関係が明瞭であり、父と「ただひとりの神」との区別を不必要に曖昧にしない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「父の懐」という原文の比喩と荘重さを保った。敬語は神的な人物への自然な敬意を示す範囲にとどめ、教派固有の用語は避けた。脚注記号は、それぞれが説明する語句の直後に置いた。
