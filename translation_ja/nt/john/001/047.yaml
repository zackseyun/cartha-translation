base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: ja
  text: イエスはナタナエルがご自分のほうへ来るのを見て、彼について言われた。「見なさい。まことのイスラエル人だ。この人には偽りがない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: 見なさい
  rationale: 注意を促す命令表現として、現代日本語で自然かつ原文の力を保つ。
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: まことのイスラエル人
  rationale: ἀληθῶςが示す真正さを簡潔に表し、「本当の」よりも格調ある文脈に適する。
- source_word: δόλος
  choice: 偽り
  rationale: 欺き、策略、裏表のある態度を含み得る語であり、ここでは自然で広がりのある「偽り」とした。
theological_decisions:
- issue: 「まことのイスラエル人」の意味
  choice: まことのイスラエル人
  alternative: 真のイスラエル人／本当にイスラエル人
  rationale: 民族的帰属だけでなく人物の真正さを評価する可能性を残し、神学的意味を限定しない。
- issue: ἐν ᾧ の表現
  choice: この人には偽りがない
  alternative: その内に偽りがない
  rationale: 内面的性質を表す含意を保ちつつ、現代日本語として明瞭にした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、イエスの宣言には簡潔な格調を持たせた。「見なさい」は単なる間投詞に弱めず、聞き手の注意を促す原文の命令形を反映する。
