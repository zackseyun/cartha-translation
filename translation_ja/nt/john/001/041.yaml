id: JHN.1.41
reference: John 1:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: ja
  text: 彼はまず、自分の兄弟シモンを見つけて、「私たちはメシアを見つけた」と言った（メシアとは、訳せば「油を注がれた者」という意味である）[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 括弧内は伝統的に「これは、訳せば『キリスト』である」と訳される。「メシア」と「キリスト」は、いずれも「油を注がれた者」を意味する称号。
    reason: 原文のセム語称号とギリシア語での対応を明示し、伝統的な音写「キリスト」も示すため。
lexical_decisions:
- source_word: εὑρίσκει
  choice: 見つけて
  rationale: ギリシア語は物語的現在だが、前後の動作と自然につながる現代日本語の連用形で出来事を表した。
- source_word: οὗτος
  choice: 彼は
  rationale: 文脈上アンデレを指す指示代名詞を、日本語の自然な代名詞で表した。
- source_word: πρῶτον
  choice: まず
  rationale: 最初に行ったことを示す時間的・順序的な意味を保持した。
- source_word: τὸν ἀδελφὸν τὸν ἴδιον
  choice: 自分の兄弟
  rationale: ἴδιονの強調を「自分の」で保ち、ἀδελφόςは性別を限定しすぎない通常の「兄弟」とした。
- source_word: Σίμωνα
  choice: シモン
  rationale: 人名を日本語の標準的な形で音写した。
- source_word: λέγει αὐτῷ
  choice: 言った
  rationale: 物語的現在を自然な日本語の過去形にし、発言行為を簡潔に表した。相手がシモンであることは直前の目的語から明白なので「彼に」は省いた。
- source_word: Εὑρήκαμεν
  choice: 私たちは…見つけた
  rationale: 完了形が示す発見の成就を自然な日本語で表した。
- source_word: Μεσσίαν
  choice: メシア
  rationale: セム語由来の称号を音写し、後続の説明との関係を保った。
- source_word: μεθερμηνευόμενον
  choice: 訳せば…という意味である
  rationale: 別言語での対応表現を提示する説明機能を、現代日本語で明瞭にした。
- source_word: χριστός
  choice: 油を注がれた者
  rationale: χριστόςの語義を示し、Μεσσίαςに対する括弧内の説明が日本語でも実際に意味を伝えるようにした。伝統的な音写「キリスト」は脚注に示した。
theological_decisions:
- issue: Μεσσίαςとχριστόςの説明関係
  choice: 本文では「メシア」を「油を注がれた者」と説明する
  alternative: 「メシア……キリストと訳される」
  rationale: 原文はセム語の称号とそのギリシア語訳を対応させている。日本語で両方を単に音写すると説明性が弱くなるため、本文ではχριστόςの語義を示し、伝統的表現は脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語的現在は日本語として自然な過去表現にし、括弧内の語義説明は一般読者にも理解できる形にした。
