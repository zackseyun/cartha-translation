source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: ja
  text: そして、縄でむちを作り、羊も牛も含めて、すべてを神殿の境内[a]から追い出した。また、両替人たちの硬貨をまき散らし、机を倒した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語 ἱερόν は、内陣だけでなく庭を含む神殿区域全体を指す。
    reason: cultural_note
lexical_decisions:
- source_word: ποιήσας
  choice: 作ると
  rationale: アオリスト分詞が主動詞に先立つ動作を表すため、自然な現代日本語で動作の順序を明示した。
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: 縄でむち
  rationale: φραγέλλιον は打つためのむち、σχοινίον は縄・ひもを指す。「縄でむちを作る」で素材と道具を簡潔に伝えた。
- source_word: πάντας
  choice: すべてを
  rationale: 後続する羊と牛を含む包括的な表現だが、指示範囲を人だけ、または動物だけに限定しないよう、中性的な「すべてを」とした。
- source_word: ἐξέβαλεν
  choice: 追い出した
  rationale: 強制的に外へ出す動作を、明快で自然な日本語で表した。
- source_word: τοῦ ἱεροῦ
  choice: 神殿の境内
  rationale: ἱερόν は内陣そのもの（ναός）ではなく神殿建造物と庭を含む区域を指すため、「境内」とした。
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: 羊も牛もである
  rationale: πάντας の後に置かれた具体化を別文で保ち、羊と牛が追い出されたことを明示しつつ、πάντας の範囲を過度に限定しないようにした。βόας は文脈上、一般読者に明瞭な「牛」とした。
- source_word: κολλυβιστῶν
  choice: 両替人たち
  rationale: 神殿で通貨を交換していた者たちを表す、定着した分かりやすい語を用いた。
- source_word: ἐξέχεεν τὰ κέρματα
  choice: 硬貨をぶちまけ
  rationale: ἐκχέω の「注ぎ出す」という勢いのある動作を、硬貨について自然な現代日本語で表した。κέρματα は小額硬貨を指し得るが、本文では過度に限定せず「硬貨」とした。
- source_word: τὰς τραπέζας ἀνέστρεψεν
  choice: 台をひっくり返した
  rationale: 両替に用いる台を転覆させた具体的動作を、平明で生き生きした日本語にした。
theological_decisions:
- issue: 神殿で追い出された対象と、むちが用いられた対象
  choice: 「すべてを」と訳し、その後に「羊も牛もである」と原文の順序に沿って示した。むちを人に用いたとは本文で明言しない。
  alternative: 人々と動物を全員追い出した／羊と牛だけを追い出した
  rationale: 原文は男性複数形 πάντας の後に「羊も牛も」と続くため、追放対象の範囲には解釈上の緊張がある。また、むちを作ったことと追い出したことは結び付いているが、誰または何をむちで打ったかは明記されていない。訳文ではこの曖昧さを解消しすぎないようにした。
translation_notes:
  register: 明快な現代標準日本語を基調とし、「境内」で神殿区域を正確に表した。「ぶちまけ」「ひっくり返した」は行為の勢いを伝える自然な語だが、口語的になりすぎない文脈に整えた。原文の πάντας と後続する動物名の関係は、説明的に狭めず、短い別文と注で保持した。
