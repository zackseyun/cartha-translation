id: JHN.2.22
reference: John 2:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: ja
  text: そこで、イエスが死者の中から起こされたとき[a]、弟子たちは、イエスがこのことを語っておられたのを思い出し[b]、聖書と、イエスが語られたことば[c]を信じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「死者の中からよみがえった」。ギリシア語の動詞は受動態であり、本文ではその形を保っている。
    reason: lexical_alternative
  - marker: b
    text: 別訳「イエスがこのことを語られたのを」または「このことを言われたのを」。ギリシア語の未完了過去は、過去の継続的または背景的な発話を示すことがある。
    reason: lexical_alternative
  - marker: c
    text: 「ことば」は「発言」または「言明」とも訳せる。ここではイエスが語られた内容を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: そこで、〜とき
  rationale: ὅτεの時を示す働きと、οὖνの推論・物語上のつながりを、自然な現代日本語でともに表す。
- source_word: ἠγέρθη
  choice: 起こされた
  rationale: アオリスト受動態を保ち、復活の文脈における「死から起こす」という意味を明確にする。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: νεκρῶνの複数形とἐκの「中から」という像を保ちつつ、日本語として理解可能な表現にする。
- source_word: ἐμνήσθησαν
  choice: 思い出し
  rationale: 弟子たちが以前の発言を想起したことを、簡潔で自然な日本語で表す。
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: イエスがこのことを語っておられたのを
  rationale: 未完了過去ἔλεγενの継続的・背景的な側面を「語っておられた」で保つ。主語は文脈上イエスであるため明示する。
- source_word: ἐπίστευσαν
  choice: 信じた
  rationale: 与格目的語を伴うπιστεύωを過度に解釈せず、聖書とイエスのことばを真実として受け入れたことを表す。
- source_word: τῇ γραφῇ
  choice: 聖書
  rationale: 単数形γραφήを、権威ある聖なる書を指す一般的で自然な日本語として訳す。
- source_word: τῷ λόγῳ ὃν εἶπεν ὁ Ἰησοῦς
  choice: イエスが語られたことば
  rationale: λόγοςがここでは直前のイエスの発言を指すことを示しつつ、「ことば」によってヨハネ文書の語感を保つ。
theological_decisions:
- issue: 復活動詞の受動態
  choice: イエスが死者の中から起こされた
  alternative: イエスが死者の中からよみがえった
  rationale: 原文の受動態を保持し、行為者を本文に補わない。自動詞的な訳も意味上可能だが、本文の文法的形態を主文に反映する。
- issue: πιστεύωと与格目的語の訳
  choice: 聖書と、イエスが語られたことばを信じた
  alternative: 聖書と、イエスが語られたことばに信頼した
  rationale: 「信じた」は最も解釈を加えない自然な訳であり、啓示された内容を弟子たちが信じたという本文の緊張を保つ。
- issue: 未完了過去ἔλεγενのアスペクト
  choice: 語っておられた
  alternative: 語られた／言われた
  rationale: 未完了過去が示し得る継続的・背景的な過去の発話を主文で表す。ただし単純な過去の発言として理解する余地を脚注に残す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい落ち着いた格調を保った。「語っておられた」「語られた」はイエスへの通常の敬意を表す日本語として用い、原文にない教理的内容は加えていない。
