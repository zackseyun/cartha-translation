id: JHN.2.18
reference: John 2:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: ja
  text: そこで、ユダヤ人たち[a]はイエスに答えて言った。「あなたがこのようなことをするからには、私たちにどんなしるしを見せるのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ人の指導者たち」または「ユダヤ地方の人々」。ヨハネ福音書で「ユダヤ人たち」は、文脈によってはユダヤ人全体ではなく、特定の代表者、とりわけユダヤ地方の権威者たちを指すことがある。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: そこで、…答えて
  rationale: οὖνが前節の出来事を受ける流れを「そこで」で示し、ἀπεκρίθησανは会話上の応答として「答えて」と訳した。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: ギリシア語の表現を本文では限定せずに保った。ヨハネ福音書では文脈により指導者層やユダヤ地方の人々を指す場合があるため、別訳を脚注に示した。
- source_word: εἶπαν αὐτῷ
  choice: イエスに…言った
  rationale: 直訳は「彼に言った」だが、現代日本語で指示対象を明瞭にするため、文脈上の対象であるイエスを明示した。ἀπεκρίθησανとの重なりも原文に従って「答えて言った」と保った。
- source_word: Τί σημεῖον
  choice: どんなしるし
  rationale: σημεῖονはヨハネ福音書で、単なる奇跡ではなく、その意味や権威を指し示す出来事を表すため、「奇跡」ではなく「しるし」とした。
- source_word: δεικνύεις ἡμῖν
  choice: 私たちに…見せるのか
  rationale: δεικνύειςの現在形による直接的な要求を、自然な日本語の問いとして表した。
- source_word: ὅτι ταῦτα ποιεῖς
  choice: あなたがこのようなことをするからには
  rationale: ὅτιが彼らの要求の根拠を導く関係を「からには」で表した。ταῦταの複数性は、日本語として自然な「このようなこと」に含ませた。
theological_decisions:
- issue: 「ユダヤ人たち」が指す範囲
  choice: 本文では「ユダヤ人たち」とした
  alternative: 「ユダヤ人の指導者たち」または「ユダヤ地方の人々」
  rationale: この語はヨハネ福音書で、すべてのユダヤ人ではなく、特定の代表者、とりわけユダヤ地方の権威者を指すことがある。しかし、この節のギリシア語自体はその範囲を明示していないため、本文で解釈的に限定せず、脚注で文脈上の可能性を示した。
- issue: しるしを求める問いとイエスの行為との論理関係
  choice: 「このようなことをするからには」
  alternative: 「このようなことをするのなら」または「このようなことをするという」
  rationale: ὅτιには因果的・説明的な幅がある。ここでは、イエスの行為を根拠として、正当性を示すしるしを要求する発言の力を自然に表しつつ、「権威」という語を本文に補わなかった。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「答えて言った」は日常語ではやや重なるが、原文の応答と発話の二つの動詞を保つため採用した。「しるし」はヨハネ福音書の重要語として一貫して平仮名表記にした。
