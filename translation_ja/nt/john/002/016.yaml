id: JHN.2.16
reference: John 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: ja
  text: そして、鳩を売っている者たちに言った。「これらをここから運び去りなさい。わたしの父の家を商いの家[a]にしてはならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「市場」とも訳せる。ギリシア語は「家」という語を繰り返しており、「商いの家」はその反復を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: 鳩
  rationale: 犠牲として売られていた鳥を指す。日本語では「鳩」が自然であり、鳥の種類を原文以上に限定しない。
- source_word: πωλοῦσιν
  choice: 売っている
  rationale: 現在分詞が表す継続中の商業活動を、自然な日本語で保つ。
- source_word: Ἄρατε
  choice: 運び去りなさい
  rationale: 移動を伴う命令の力を明確にし、ἐντεῦθεν（ここから）と自然につながる表現とした。
- source_word: ταῦτα
  choice: これら
  rationale: 中性複数の指示語を曖昧なまま保ち、鳩そのもの、籠、売り物などのいずれかに限定しない。
- source_word: ἐντεῦθεν
  choice: ここから
  rationale: 話者のいる場所から外へ移すことを直接表す。
- source_word: μὴ ποιεῖτε
  choice: してはならない
  rationale: μήを伴う現在命令形の禁止を、明確で格調を保った現代日本語にした。「変える」と解釈的に言い換えることは避けた。
- source_word: οἶκον τοῦ πατρός μου
  choice: わたしの父の家
  rationale: μουの単数一人称所有と、イエスが父との関係を明示する表現をそのまま保つ。
- source_word: οἶκον ἐμπορίου
  choice: 商いの家
  rationale: ἐμπόριονの商取引の意味を表しつつ、原文のοἶκος（家）の反復と修辞的対比を保つ。
theological_decisions:
- issue: イエスが神殿を「わたしの父の家」と呼ぶこと
  choice: 「わたしの父の家」と明示する
  alternative: 「私たちの父の家」または「神の家」
  rationale: 原文はπατρός μουと単数一人称所有を明記している。イエスの父との関係および文脈上の権威を弱めたり、本文を越えて一般化したりしない。
- issue: 神殿での商業活動を表す比喩
  choice: 「商いの家」として「家」の反復を保つ
  alternative: 「市場」
  rationale: 「市場」は意味を滑らかに伝えるが、原文の「父の家／商いの家」という緊張と反復を失うため、本文ではより形式に即した表現を採用した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令の強さと神殿をめぐる厳粛さを保った。「言われた」は丁寧語ではなく尊敬表現として用い、聖書本文にふさわしい落ち着いた文体とした。
