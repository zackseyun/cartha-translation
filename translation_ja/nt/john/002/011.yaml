id: JHN.2.11
reference: John 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταύτην ⸀ἐποίησεν ἀρχὴν τῶν σημείων ὁ Ἰησοῦς ἐν Κανὰ τῆς Γαλιλαίας καὶ ἐφανέρωσεν τὴν δόξαν αὐτοῦ, καὶ ἐπίστευσαν εἰς αὐτὸν οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: ja
  text: イエスはガリラヤのカナで、これを最初のしるしとして行い[a]、ご自分の栄光を現された。そして、弟子たちはイエスを信じた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では、「しるしの始まりであるこのことを行い」。
    reason: ἀρχήは「最初」または「始まり」を表し、この句は最初のしるしを指すとも、しるしの連続の始まりを強調するとも表現できるため。
lexical_decisions:
- source_word: ταύτην
  choice: これを
  rationale: 直前に語られた出来事を指す指示代名詞として訳し、原文にない「奇跡」や「しるし」を代名詞自体に補わない。
- source_word: ἐποίησεν
  choice: 行い
  rationale: ποιέωの広い意味を保ちつつ、この文脈で自然な現代日本語とした。「起こした」や「成し遂げた」のような解釈的な含みを避ける。
- source_word: ἀρχὴν τῶν σημείων
  choice: 最初のしるしとして
  rationale: この出来事が一連のしるしの端緒であったことを、自然な日本語で表す。ἀρχήの字義的な「始まり」も脚注に残す。
- source_word: σημείων
  choice: しるし
  rationale: ヨハネ福音書では、行為がイエスの身分と栄光を指し示すという重要な意味を持つため、「奇跡」ではなく「しるし」とした。
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: ガリラヤのカナで
  rationale: 属格を含む地名表現を、明瞭で自然な日本語の地名表記にした。
- source_word: ἐφανέρωσεν
  choice: 現された
  rationale: φανερόωの「見えるようにする、明らかにする」という意味を保ち、栄光が開示されたことを自然に表す。
- source_word: τὴν δόξαν αὐτοῦ
  choice: ご自分の栄光
  rationale: δόξαをヨハネ福音書の主要語として「栄光」と訳し、再帰的所有を敬意ある自然な日本語で示す。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: イエスを信じた
  rationale: πιστεύω εἰςが表す、イエスへ向けられた信頼を日本語の慣用的な表現で訳す。「信じるようになった」は起点を明示しすぎるため避けた。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちは
  rationale: 文脈上、イエスの弟子たちであることが明白なため、重複を避けて自然な日本語とした。
theological_decisions:
- issue: ヨハネ福音書におけるσημεῖον
  choice: 「しるし」と訳す。
  alternative: 「奇跡」
  rationale: 力ある行為そのものだけでなく、それがイエスの身分と栄光を指し示すというヨハネ福音書特有の働きを保つため。
- issue: ἀρχὴν τῶν σημείωνの構文と意味
  choice: 「これを最初のしるしとして行い」と訳す。
  alternative: 「しるしの始まりであるこのことを行い」
  rationale: ἀρχήが最初・端緒を表すことを自然な現代日本語で伝えつつ、字義に近い「しるしの始まり」は脚注で保持する。
- issue: 弟子たちの信仰の時間的含意
  choice: 「信じた」と訳す。
  alternative: 「信じるようになった」
  rationale: アオリストは出来事を述べるが、この一節だけで弟子たちがその時初めて信仰を持ったと断定せず、原文の緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、本文にふさわしい落ち着いた格調を保った。「ご自分」はイエスへの敬意を自然に示すが、過度な敬語化は避けた。接続詞καίは、日本語の文の流れを明確にするため、後半を「そして」で結んだ。
