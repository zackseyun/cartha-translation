  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Γεμίσατε τὰς ὑδρίας ὕδατος· καὶ ἐγέμισαν αὐτὰς ἕως ἄνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/007.yaml
  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: ja
  text: イエスは彼らに言われた。「水がめを水で満たしなさい。」そこで彼らは、水がめを縁までいっぱいにした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は物語現在だが、日本語の自然な物語叙述に合わせて過去形とした。イエスの発言を表す文脈にふさわしい、現代の聖書文体として自然な敬意表現を用いた。
- source_word: αὐτοῖς
  choice: 彼らに
  rationale: 複数の間接目的語を明示し、イエスが直前の給仕たちに命じたことを原文どおり示す。
- source_word: Γεμίσατε
  choice: 満たしなさい
  rationale: アオリスト能動命令法二人称複数の直接的な命令を、明瞭で品位ある現代日本語にした。
- source_word: τὰς ὑδρίας
  choice: 水がめを
  rationale: ὑδρίαは水を入れるかめを指す。石製であることは前節にあるが、本節では繰り返されていないため補わない。
- source_word: ὕδατος
  choice: 水で
  rationale: γεμίζωに続く内容の属格を、日本語では満たす材料を表す助詞「で」により自然に訳した。
- source_word: ἐγέμισαν αὐτάς
  choice: 水がめを…いっぱいにした
  rationale: 代名詞の指示対象を日本語で明確にするため「水がめ」を再提示し、完了した行為を簡潔に表した。
- source_word: ἕως ἄνω
  choice: 縁までいっぱいに
  rationale: 直訳的な「上まで」の意味を、この容器の文脈で自然かつ明瞭に表し、完全に満たしたことを伝える。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある物語調とした。「言われた」は過度に古風にならない範囲でイエスへの自然な敬意を示す。英語相談層の脚注は本文中の位置と内容が対応しておらず、原文にも訳注を要する実質的異読・曖昧さがないため採用しなかった。
