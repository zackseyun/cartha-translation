  text: καὶ εὗρεν ἐν τῷ ἱερῷ τοὺς πωλοῦντας βόας καὶ πρόβατα καὶ περιστερὰς καὶ τοὺς κερματιστὰς καθημένους,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/014.yaml
  text: And he found in the temple those selling oxen and sheep and doves[a], and the money changers sitting there.
translation:
  language: ja
  text: そして、神殿[a]で牛や羊や鳩を売っている者たちと、座っている両替人たちを見つけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「神殿」と訳したギリシア語はἱερόνで、内側の聖所そのものではなく、境内を含む神殿一帯を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὗρεν
  choice: 見つけた
  rationale: εὑρίσκωのアオリストの基本的な意味を保ち、イエスが神殿でその光景に出会ったことを自然な日本語で表す。「目にした」も文脈上可能だが、原語の語義には「見つけた」がより直接的である。
- source_word: ἱερῷ
  choice: 神殿
  rationale: ἱερόνは内陣に限らず神殿の境内・一帯を指す。本文では簡潔で一般的な「神殿」とし、空間的な範囲は脚注で明示する。
- source_word: πωλοῦντας
  choice: 売っている者たち
  rationale: 現在分詞が表す継続中の行為と、名詞的用法の両方を、明瞭で自然な日本語にした。
- source_word: βόας
  choice: 牛
  rationale: βοῦςは広く牛を指し得る。性別や去勢の有無を不必要に限定せず、犠牲用家畜の文脈にも合う一般的な訳語とした。
- source_word: πρόβατα
  choice: 羊
  rationale: この文脈におけるπρόβαταの通常かつ明瞭な対応語である。
- source_word: περιστερὰς
  choice: 鳩
  rationale: περιστεράは鳩類を指す。日本語では「鳩」が犠牲用の鳥としても自然で、種別を過度に限定しない。
- source_word: κερματιστὰς
  choice: 両替人たち
  rationale: 貨幣を交換する者を指すκερματιστήςに対応する、定着した簡潔な日本語表現である。
- source_word: καθημένους
  choice: そこに座っている
  rationale: 両替人たちの姿勢と、その場に腰を据えていた様子を自然に表す。「そこに」は日本語上の明瞭さを補う。
theological_decisions:
- issue: エルサレム神殿に関するἱερόνの範囲
  choice: 本文では「神殿」と訳し、神殿の境内・一帯を指すことを脚注で説明する。
  alternative: 「神殿の境内」「神殿域」「聖所」
  rationale: 動物を売る者や両替人がいる場面は、内陣ではなく広い神殿域を示す。本文の読みやすさを保ちながら、ἱερόνと内なる聖所をより限定的に指すναόςとの違いを脚注で保持する。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある叙述。「そして」で前節との連続性を保ち、ギリシア語で省略された主語を日本語でも文脈に委ねた。動物名は日本語で自然な単数形の総称とした。
