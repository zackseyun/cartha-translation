source:
  edition: SBLGNT
  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: ja
  text: この後、イエスは、母、兄弟たち[a]、弟子たちと一緒にカファルナウムへ下って行った。彼らはそこに長くは滞在しなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「親族たち」「近親者たち」。ギリシア語は狭い意味での兄弟を指すことも、文脈によってはより広い親族関係を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: この後
  rationale: 単数の指示語を保ちつつ、物語の時間的推移を自然な現代日本語で表す。
- source_word: κατέβη
  choice: 下って行き
  rationale: カナからカファルナウムへの地理的・地形的移動を示す「下る」の意味を保持する。
- source_word: εἰς Καφαρναοὺμ
  choice: カファルナウムへ
  rationale: 都市を目的地とする移動を自然な日本語で表し、地名は慣用的に音写する。
- source_word: αὐτὸς καὶ ἡ μήτηρ αὐτοῦ
  choice: イエスは、母…と一緒に
  rationale: 日本語では直訳的な「彼自身と彼の母」より自然であり、直前の文脈から主語を明示する。「母」に名を補わない。
- source_word: οἱ ἀδελφοὶ
  choice: 兄弟たち
  rationale: 男性複数形の最も直接的な意味を本文に置き、より広い親族関係の可能性は脚注に残す。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たち
  rationale: ヨハネ福音書の主要語として、学ぶ者・従う者という含意を持つ定着した訳語を用いる。
- source_word: ἐκεῖ ἔμειναν
  choice: そこで…過ごした
  rationale: 複数主語の滞在を、文脈に即した自然な日本語で表す。
- source_word: οὐ πολλὰς ἡμέρας
  choice: 幾日もたたないうちに
  rationale: 原文の否定表現を保とうとしたが、日本語として期間表現との接続を図った。
theological_decisions:
- issue: イエスとの関係におけるἀδελφοίの指示対象
  choice: 本文では「兄弟たち」とする。
  alternative: 「親族たち」「近親者たち」
  rationale: ἀδελφοίの最も直接的な意味と男性複数形を保持し、後代のマリア論に関する論争を本文で決着させない。語が文脈によって広い親族関係を指し得る可能性は脚注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述調。「カファルナウム」「弟子」は日本語聖書で定着した語を採用した。
