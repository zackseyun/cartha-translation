source:
  edition: SBLGNT
  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: ja
  text: さて、三日目に、ガリラヤのカナで婚礼[a]があり、イエスの母はそこにいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「婚宴」とも訳せる。ギリシア語は、結婚の出来事だけでなく、その祝いの宴を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: さて
  rationale: 物語を次の場面へ進める接続語として、解釈を加えず自然な現代日本語にした。
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: 三日目に
  rationale: 時を表す与格を簡潔に訳し、復活への象徴的連想などを本文に付加しない。
- source_word: γάμος
  choice: 婚礼
  rationale: 結婚の儀式だけでなく祝宴を含む祝いの場も表し得る語なので、その幅を比較的保てる「婚礼」とした。
- source_word: ἐγένετο
  choice: があり
  rationale: 出来事の発生を示す表現を、「婚礼」と自然につながる簡潔な日本語にした。
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: ガリラヤのカナで
  rationale: 属格による地域指定を、日本語で自然な地名表現として訳した。
- source_word: ἦν
  choice: いた
  rationale: 人物の所在を述べる未完了過去を、背景説明として自然な日本語にした。
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: イエスの母
  rationale: ギリシア語の属格関係を簡潔かつ格調を損なわずに保った。
- source_word: ἐκεῖ
  choice: そこに
  rationale: 単純な場所の副詞として直接訳した。
theological_decisions:
- issue: 「三日目」という時間表現
  choice: 物語上の時間表示としてそのまま「三日目」とした。
  alternative: 復活を暗示する象徴性を訳文に明示する。
  rationale: ヨハネ文書の読者が象徴的な響きを感じる可能性は残しつつ、原文が明示していない神学的解釈を本文に組み込まない。
translation_notes:
  register: 明瞭で落ち着いた現代標準語を用いた。冒頭の接続語は物語の流れを示す「さて」とし、「婚礼」によって原語の意味の幅を保った。
