  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: ja
  text: 宴会の世話役は、ぶどう酒になった水を味見したが、それがどこから来たのか知らなかった。水をくんだ給仕たちは知っていた。そこで、宴会の世話役は花婿を呼んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、ここで「呼ぶ」は現在形です。過去の出来事を生き生きと語る物語的現在の用法です。
    reason: 原文の物語的現在を、本文では自然な日本語の過去形にしたため、その文体的特徴を示す。
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: 宴会の世話役
  rationale: 宴席全体を取り仕切る者を指す。現代の一般読者に役割が明瞭で、「給仕長」より職務を狭く限定しない。
- source_word: ἐγεύσατο
  choice: 味見した
  rationale: 飲み物を味わって確かめる場面に自然であり、単なる飲食より原語の意味を明確に伝える。
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: ぶどう酒になった水
  rationale: 完了分詞が示す、すでに生じて結果が存続している変化を簡潔に保持する。
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: それがどこから来たのか知らなかった
  rationale: πόθενの起源・出所への問いを自然な現代日本語で表す。
- source_word: διάκονοι
  choice: 給仕たち
  rationale: この宴席の文脈では教会職ではなく、飲食物を運ぶ奉仕者を指すため。
- source_word: ἠντληκότες
  choice: くんだ
  rationale: 水を容器または水源から取り出す行為を簡潔に表す。
- source_word: φωνεῖ
  choice: 呼んだ
  rationale: ギリシア語は物語的現在だが、日本語では過去形の連続が自然であり、出来事の順序を明瞭にする。
- source_word: νυμφίον
  choice: 花婿
  rationale: 婚礼の文脈における標準的で明確な訳語。
- source_word: ὡς δὲ
  choice: 〜したとき、…ので
  rationale: 時間的導入と、後続する行為へつながる叙述を日本語の一文として自然に構成する。独立した「さて」は補わない。
theological_decisions:
- issue: 奇跡における水の変化の叙述
  choice: 「ぶどう酒になった水」と実際の状態変化をそのまま訳す
  alternative: 「ぶどう酒のようになった水」など、知覚上の変化として弱める
  rationale: 原文は水がぶどう酒になったことを明示しており、それ以上の教理的説明は加えず、同時に単なる外見や印象へ弱めない。
- issue: φωνεῖの物語的現在
  choice: 自然な日本語の過去叙述として「呼んだ」とする
  alternative: 原文の現在形を形式的に反映して「呼ぶ」とする
  rationale: 時制形の機械的な再現より物語機能を優先する。神学的含意はなく、内容上の曖昧さも生じない。
translation_notes:
  register: 明快な現代標準日本語。婚礼の格式を損なわない穏やかで品位ある叙述とし、「宴会の世話役」「給仕たち」で両者の役割を区別した。挿入説明はダッシュで示し、原文の情報構造を読みやすく保った。
