id: JHN.2.19
reference: John 2:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: ja
  text: イエスは彼らに答えられた。「この神殿を壊しなさい。三日で、わたしはそれを建てる。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この神殿を取り壊しなさい。三日で、わたしはそれを建て直す」とも訳せる。ここで「建てる」と訳したギリシア語は「起こす」の意味ももち、文脈では復活を思わせる。ヨハネは後に、イエスがご自分の体という神殿について語っておられたと説明している（2:21）。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: 答えて言われた
  rationale: 二つの動詞から成る原文の語り方を保ちつつ、現代日本語として通じる表現にした。イエスへの敬意を示す自然な物語文として「言われた」を用いた。
- source_word: Λύσατε
  choice: 壊しなさい
  rationale: ここでの λύω は神殿を破壊・解体することを指す。「壊す」は「滅ぼす」より具体的で、「解体する」より一般読者に自然である。
- source_word: τὸν ναὸν τοῦτον
  choice: この神殿
  rationale: ναός は神殿、特に聖所を指し得るが、ここでは自然な日本語の「神殿」とした。τοῦτον の指示性を「この」で保持し、身体という真の指示対象は21節の説明に委ねた。
- source_word: ἐν τρισὶν ἡμέραις
  choice: 三日で
  rationale: 期間内に成し遂げるという自然な日本語であり、厳密な時間計算を不必要に確定しない。
- source_word: ἐγερῶ
  choice: 起こす
  rationale: ἐγείρω の基本的な「起こす／立ち上がらせる」を保持し、建物なら「建て直す」とも聞こえ、身体については復活の響きも残るようにした。「再建する」と限定して復活との重なりを失わないようにした。
- source_word: αὐτόν
  choice: それを
  rationale: 文法上の直近の先行詞である「神殿」を受ける自然な日本語。21節で明かされるイエスの身体への指示を代名詞の段階で先取りしない。
theological_decisions:
- issue: 「この神殿」がイエスの身体を指すことを本文で明示するか
  choice: 本文では「この神殿」のままにする
  alternative: 「わたしの体というこの神殿」と説明する
  rationale: 2:19の謎めいた発言と2:21の後の説明という物語構造を保ち、意味を先回りして解消しないため。
- issue: ἐγερῶ を建築用語と復活用語のどちらに寄せるか
  choice: 「起こす」と訳し、復活の含みを保つ
  alternative: 「建て直す」
  rationale: 聞き手には神殿再建の意味に聞こえ得る一方、ヨハネの説明ではイエスの復活を指す。原文の二重の響きを一方に限定しないため。
- issue: 命令形 Λύσατε の語用論的意味
  choice: 「壊しなさい」と直接的な命令形を保持する
  alternative: 「もし壊すなら」
  rationale: 条件文へ言い換えず、原文のアオリスト命令形が持つ挑戦的で謎めいた言い方を保持する。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。発言の謎めいた性格を保ち、「起こす」によって建物と復活の双方に通じる原文の語感を残した。脚注標識[a]は該当する発言の末尾に置いた。
