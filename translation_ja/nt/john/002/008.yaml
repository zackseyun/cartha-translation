base_translation:
  language: en
  yaml_path: translation/nt/john/002/008.yaml
  text: And he said to them[b][a], “Draw some out now and take it to the master of the feast.” So they took it.
translation:
  language: ja
  text: そこでイエスは彼らに言った。「さあ、くんで、宴会の世話役[a]のところへ持って行きなさい。」彼らはそのとおり持って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「宴会の責任者」とも訳せる。ギリシア語は、宴席を取り仕切る人を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: 物語を生き生きと語る歴史的現在と理解し、現代日本語の自然な物語時制で表した。主語のイエスは文脈から補った。
- source_word: Ἀντλήσατε
  choice: くんで
  rationale: 液体を容器からくみ出す動作を表す。目的語は文脈上明らかであり、日本語では省略するほうが自然である。
- source_word: νῦν
  choice: さあ
  rationale: 命令に伴う即時性を、自然な日本語で表した。「今」も可能だが、ここでは行動を促す語感が適している。
- source_word: φέρετε
  choice: 持って行きなさい
  rationale: くみ出したものを宴会の世話役のいる所まで運ぶ動作を、移動の方向が明瞭な日本語で表した。
- source_word: ἀρχιτρικλίνῳ
  choice: 宴会の世話役
  rationale: 宴席を取り仕切る人物を指す語として、特定の近代的役職名に限定せず、一般読者に分かりやすく表した。
- source_word: οἱ δὲ ἤνεγκαν
  choice: 彼らはそのとおり持って行った
  rationale: δέは軽い接続として無理に訳出せず、命令への応答であることを「そのとおり」で自然に示した。目的語は日本語では省略できるため補わなかった。
