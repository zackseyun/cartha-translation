id: JHN.2.10
reference: John 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: ja
  text: そして彼に言った。「だれでも[b]、まず良いぶどう酒を出し、人々が酔ってから[a]、質の劣るものを出します。ところが、あなたは良いぶどう酒を今まで取っておきました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「酔っているとき」または「十分に飲んでから」。ギリシア語の動詞は通常「酔う、酔っている」を意味する。一部の訳は、明示的な酩酊ではなく判断力の低下を強調して表現を和らげる。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の「すべての人」は、男性だけでなく一般に人々を指す総称的な単数表現である。
    reason: cultural_note
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: 彼に言った
  rationale: λέγει は物語を生き生きと語る歴史的現在。現代日本語の自然な叙述として過去形にした。文脈上の相手は宴会の世話役が呼んだ花婿である。
- source_word: Πᾶς ἄνθρωπος
  choice: だれでも
  rationale: 男性だけを指すのではなく、人一般について述べる総称的な単数表現。日本語では「だれでも」が自然で正確。
- source_word: τὸν καλὸν οἶνον τίθησιν
  choice: 良いぶどう酒を出し
  rationale: καλός はここでは品質の良さを表し、τίθημι は宴席で供することを意味する。「出す」は簡潔で自然。
- source_word: ὅταν μεθυσθῶσιν
  choice: 人々が酔ってから
  rationale: μεθύω の通常の意味である「酔う」を弱めずに訳した。ὅταν とアオリスト接続法が示す一般的な順序関係を「酔ってから」で表した。
- source_word: τὸν ἐλάσσω
  choice: 質の劣るもの
  rationale: 比較級 ἐλάσσων は先の良いぶどう酒より品質が劣ることを表す。省略された「ぶどう酒」を「もの」で受け、比較の観点を明示した。
- source_word: τετήρηκας
  choice: 取っておきました
  rationale: 完了形が示す、今に至るまで保持してきた結果を自然な日本語で表した。
- source_word: ἕως ἄρτι
  choice: 今まで
  rationale: 発話時点までを指す表現として簡潔で自然。
theological_decisions:
- issue: ぶどう酒の奇跡の文脈における μεθυσθῶσιν の訳し方
  choice: 「人々が酔ってから」と、酩酊を表す通常の意味を保持する
  alternative: 「十分に飲んでから」「たくさん飲んでから」
  rationale: 本文は宴席での一般的な慣行について語り手が述べた言葉を報告しており、酩酊を倫理的に承認しているとは限らない。教理上の配慮から原語の率直さを弱めず、緊張をそのまま残した。
translation_notes:
  register: 明瞭で現代的な標準日本語。宴会の世話役から花婿への直接話法として、丁寧な語尾を用いた。原文にない説明は本文へ加えず、「良い」と「質の劣る」の対比を明確にした。
