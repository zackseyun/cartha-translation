base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: ja
  text: 母は給仕の者たち[a]に言った。「彼があなたがたに何を言っても、そのとおりにしなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「給仕の者たち」は、直訳的には「奉仕する者たち」。ここでは婚宴で給仕を担当していた者たちを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ μήτηρ αὐτοῦ
  choice: 母
  rationale: 直訳的には「彼の母」だが、日本語では文脈上明らかな所有表現を省くほうが自然であり、イエスを指す固有名を補わずに原文の簡潔さを保てる。
- source_word: τοῖς διακόνοις
  choice: 給仕の者たち
  rationale: 婚宴の場で飲食物の給仕を担う者たちを指す。後代の教会職制としての「執事」をここに持ち込まず、文脈上の役割を明確にした。
- source_word: Ὅ τι ἂν
  choice: 何を……ても
  rationale: 不定関係詞とἄνが表す開かれた条件性を、現代日本語で自然な「何を言っても」によって示した。
- source_word: λέγῃ ὑμῖν
  choice: 彼があなたがたに……言っても
  rationale: 原文では主語が省略されているが、文脈上イエスを指す。日本語では「彼」として明示しつつ、固有名を補う解釈的拡張を避けた。接続法の不定的な将来性は「何を……ても」という構文全体で表した。
- source_word: ποιήσατε
  choice: そのとおりにしなさい
  rationale: アオリスト命令形複数の明確な命令を保ち、目的語は先行する「何を言っても」を受ける「そのとおりに」で自然に表した。
theological_decisions:
- issue: λέγῃの省略された主語の指示対象
  choice: 「彼」と訳し、イエスを指すものとした
  alternative: 「イエスが」と明示する、または受け身の「言われたとおりに」とする
  rationale: 文脈上の指示対象はイエスであるが、原文は名を繰り返していない。「彼」はその簡潔さを保ち、固有名の補足による過度な明示化も、受け身による構文上の変更も避ける。
translation_notes:
  register: 明快な現代標準語を用い、母から給仕の者たちへの直接的な命令として自然に読める丁寧すぎない発話調にした。「しなさい」によって命令の強さを保ちつつ、過度に古風な文体は避けた。
