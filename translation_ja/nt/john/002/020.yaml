id: JHN.2.20
reference: John 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: ja
  text: そこでユダヤ人たちは言った。[a]「この神殿は四十六年かけて建てられた。それを、あなたは三日で建て起こすというのか。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」とも訳せる。ギリシア語は「ユダヤ人たち」。ヨハネ福音書では、文脈によってこの語が指す範囲は異なる。
    reason: alternative_reading
  - marker: b
    text: 「建て直す」とも訳せる。話している人々は建築の意味に受け取っているが、「建て起こす」は、ヨハネが後にイエスの復活と結びつける原文の表現を保っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のイエスの発言を受けた応答であることを、自然な現代日本語で示す。
- source_word: οἱ Ἰουδαῖοι
  choice: ユダヤ人たち
  rationale: 原文の表現を保ち、文脈から明示されない「指導者たち」などへの限定を避ける。ヨハネ福音書における語の文脈的な幅は脚注で示す。
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: 四十六年かけて
  rationale: 建設に要した期間を表す与格を、意味の明瞭な日本語にする。
- source_word: οἰκοδομήθη
  choice: 建てられた
  rationale: アオリスト受動形を簡潔に訳し、建設過程について原文以上の歴史的説明を加えない。
- source_word: ὁ ναὸς οὗτος
  choice: この神殿
  rationale: ναόςは聖所を指し得るが、この場面では「神殿」が自然で理解しやすい。
- source_word: καὶ σὺ
  choice: それを、あなたは
  rationale: σὺの強調と、話者の驚きや疑念を日本語の語順で表す。
- source_word: ἐν τρισὶν ἡμέραις
  choice: 三日で
  rationale: 所要期間を示す自然な日本語であり、続く復活への含みも損なわない。
- source_word: ἐγερεῖς
  choice: 建て起こす
  rationale: 神殿についての建築的理解が可能でありながら、「起こす」によって次節以降の復活との語のつながりを保つ。「建て直す」と断定して二重の意味を解消しない。
- source_word: αὐτόν
  choice: それを
  rationale: 直前の「この神殿」を自然に受ける指示語とする。
theological_decisions:
- issue: ヨハネ福音書の οἱ Ἰουδαῖοι が反ユダヤ的に過度に一般化される可能性
  choice: 本文では「ユダヤ人たち」とする
  alternative: ユダヤ地方の人々／ユダヤ人の指導者たち
  rationale: 原文の呼称を保持しつつ、この節だけでは明示されない範囲に限定しない。語の指示範囲が文脈により異なることを脚注で補う。
- issue: ἐγερεῖςと復活の主題との関係
  choice: 「建て起こす」とする
  alternative: 建て直す／起こす
  rationale: 話者が神殿の建築として理解していることと、語り手が後にイエスの体と復活へ結びつけることの双方を響かせ、神学的なアイロニーを先回りして解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「それを、あなたは」と読点を置いて主語の強調と不信のこもった修辞疑問を表した。
