  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: ja
  text: イエスがエルサレムで、過越祭、すなわち祭りの期間中におられたとき、多くの人がイエスの行っていたしるし[b]を見て、その名を信じた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イエスを信じた」。直訳は「その名を信じた」。ヨハネに特徴的な表現で、明らかにされたイエスの身元に信頼を向けることを強調している。
    reason: lexical_alternative
  - marker: b
    text: 「しるし」はヨハネが特徴的に用いる語で、その出来事自体を越えて、イエスが何者であるかを指し示す働きを表す。「奇跡のしるし」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις
  choice: イエスが……エルサレムにおられたとき
  rationale: ὡςの時間的意味を「とき」で表し、δέの弱い接続性は日本語では不自然な接続語を足さず文脈に委ねた。主語は直前の文脈からイエスであり、日本語で明確にした。
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: 過越祭の祝いの間
  rationale: πάσχαとἑορτήが同じ祭りの時期を重ねて示す表現としてまとめ、過度な反復を避けつつ祭りの期間中という意味を保った。
- source_word: πολλοὶ
  choice: 多くの人が
  rationale: 日本語では人物を指すことを明示したほうが自然である。
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: その名を信じた
  rationale: ヨハネ特有の「その名を信じる」という表現を平板な「彼を信じた」に置き換えず、啓示されたイエスの身元へ向かう信頼という含みを保った。
- source_word: θεωροῦντες
  choice: 見て
  rationale: 主動詞と同時に行われた観察を自然な現代日本語で表した。継続性は後続する未完了過去の訳「行っていた」と併せて伝わる。
- source_word: τὰ σημεῖα
  choice: しるし
  rationale: 単なる奇跡ではなく、イエスが何者であるかを指し示すヨハネの特徴的な語法を保った。
- source_word: ἃ ἐποίει
  choice: イエスの行っていた
  rationale: 未完了過去の継続的・反復的な側面を「行っていた」で表した。日本語で指示対象が明瞭になるよう主語を補った。
theological_decisions:
- issue: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦが表す信仰の性質
  choice: 「その名を信じた」とそのまま肯定的に訳し、この節だけで信仰を弱めて解釈しない。
  alternative: 「奇跡を見て表面的に信じた」「信じるようになっただけ」と限定する。
  rationale: 本文自体は多くの人が信じたと述べており、その信仰の十分性については次節が緊張を加える。訳文で先回りして評価を決めず、物語上の緊張を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「その名を信じた」「しるし」というヨハネの神学的に重要な語法を保持した。「おられた」は物語の中心人物であるイエスに対する自然で節度ある敬語。脚注記号は説明対象の語句の直後に配置した。
