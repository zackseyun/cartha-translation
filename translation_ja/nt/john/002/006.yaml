  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: ja
  text: そこには、ユダヤ人の清めの慣習に従って[a]、石の水がめが六つ置いてあった。それぞれ二、三メトレテスを入れる容量があった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ユダヤ人の清めのために」。儀礼上の清めの慣習を指す。
    reason: lexical_alternative
  - marker: b
    text: 「メトレテス」は古代の液量単位。一メトレテスはおよそ三五～四〇リットル。したがって、水がめ一つの容量はおよそ七〇～一二〇リットルであった。
    reason: cultural_note
lexical_decisions:
- source_word: ἦσαν δὲ ἐκεῖ
  choice: そこには……あった
  rationale: δέの軽い接続性は日本語の文脈に委ね、ἐκεῖを「そこには」で明示した。
- source_word: λίθιναι ὑδρίαι
  choice: 石の水がめ
  rationale: λίθιναιは材質、ὑδρίαιは水を入れるかめを指すため、自然で具体的な現代日本語とした。
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: ユダヤ人の清めのしきたりのために
  rationale: κατάがここで表しうる用途・慣習との関係を自然に示し、καθαρισμόςの儀礼的な清めという意味を保った。
- source_word: κείμεναι
  choice: 置いてあった
  rationale: 容器がその場所に据えられていた状態を表す。日本語では「立っていた」より自然である。
- source_word: χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: それぞれ二、三メトレテス入る
  rationale: χωροῦσαιを容量として訳し、ἀνάの分配的意味を「それぞれ」で示した。古代単位は本文で換算せず音写した。
theological_decisions:
- issue: τῶν Ἰουδαίωνの意味
  choice: ユダヤ人の
  alternative: ユダヤ地方の人々の
  rationale: ここでは地域的出自より、共同体に知られた宗教的な清めの慣習を指すため、「ユダヤ人の」が適切である。
- issue: κατὰ τὸν καθαρισμόνが示す関係
  choice: 清めのしきたりのために
  alternative: 清めのしきたりに従って
  rationale: κατάには規範との一致と用途の両方の含みがありうる。水がめの用途を文脈に即して示しつつ、「しきたり」により慣習との関係も残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「しきたり」は一般読者に理解しやすく、儀礼的慣習という意味を伝える。単位名は原語を音写し、概算を脚注に置いた。
