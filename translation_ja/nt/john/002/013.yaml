source:
  edition: SBLGNT
  text: Καὶ ἐγγὺς ἦν τὸ πάσχα τῶν Ἰουδαίων, καὶ ἀνέβη εἰς Ἱεροσόλυμα ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/013.yaml
  text: The Passover of the Jews was near[a], and Jesus went up to Jerusalem.
translation:
  language: ja
  text: ユダヤ人の過越の祭りが近づいていた[a]。イエスはエルサレムへ上って行かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々の過越の祭り」とも訳せる。ヨハネ福音書では「ユダヤ人」と訳した語が、文脈によっては「ユダヤ地方の人々」を指すことがあるが、ここではユダヤ人の祭りであることを示すのが最も自然。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγὺς ἦν
  choice: 近づいていた
  rationale: ここでは時期が迫っていたことを表す。現代日本語として自然で、時間的な近さを明確に伝える。
- source_word: τὸ πάσχα
  choice: 過越の祭り
  rationale: ユダヤ教の祭りを指す定着した聖書用語。「過越」だけより一般読者に祭りであることが明瞭。
- source_word: τῶν Ἰουδαίων
  choice: ユダヤ人の
  rationale: ここでは過越祭がユダヤ人の祭りであることを示すのが最も自然。「ユダヤ地方の人々の」という語義の可能性は脚注に残す。
- source_word: ἀνέβη
  choice: 上って行かれた
  rationale: エルサレムへの移動を表す慣用的な「上る」を保持しつつ、人物への自然な敬意を表す日本語とした。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムへ
  rationale: 目的地を自然な現代日本語で示す。
- source_word: Καὶ … καὶ
  choice: （文頭は無表示）…（二文に分割）
  rationale: καίは物語の継続と節の連結を担う。日本語では逐語的に「そして」を重ねず、文脈上自然な無接続と二文構成で表した。
theological_decisions:
- issue: ヨハネ福音書における Ἰουδαῖοι の訳
  choice: ユダヤ人
  alternative: ユダヤ地方の人々
  rationale: 本節では特定の地域集団や対立集団ではなく、過越祭をユダヤ人の祭りとして示す用法と読むのが自然。ただしヨハネ福音書における語の幅を踏まえ、別訳を脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「過越の祭り」で一般読者にも対象を明示し、「上って行かれた」でエルサレムへの巡礼移動の表現を保持した。
