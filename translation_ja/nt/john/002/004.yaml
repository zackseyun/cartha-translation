id: JHN.2.4
reference: John 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀καὶ λέγει αὐτῇ ὁ Ἰησοῦς· Τί ἐμοὶ καὶ σοί, γύναι; οὔπω ἥκει ἡ ὥρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: ja
  text: イエスは彼女に言われた。「婦人よ[a]、そのことが私とあなたに何の関わりがあるのですか。[b] 私の時はまだ来ていません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「婦人よ」は、当時、女性に対する通常の呼びかけであり、必ずしも無礼な表現ではありません。
    reason: cultural_note
  - marker: b
    text: より直訳すれば、「私とあなたに何があるのですか」。関心や責任について距離を置く慣用表現で、必ずしも敵意を表すものではありません。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言われた
  rationale: ギリシア語は歴史的現在形だが、日本語の物語として自然な過去形にした。「言われた」は現代の聖書文体として明瞭で品位があり、発話内容を変えない。
- source_word: Τί ἐμοὶ καὶ σοί
  choice: そのことが私とあなたに何の関わりがあるでしょうか
  rationale: 直訳調を避けつつ、関心や責任について距離を置く慣用句の力を保った。敵意や関係断絶までを明示する表現にはしていない。
- source_word: γύναι
  choice: 女の方
  rationale: 字義的な「女」よりも呼びかけとして自然で、当時必ずしも無礼ではなかった語調を表せる。「お母さん」は原文にない親子関係を呼称へ持ち込み、「奥様」は社会的含意を加えるため避けた。
- source_word: οὔπω
  choice: まだ…ていません
  rationale: 現時点までその時が到来していないことを、自然な現代日本語で直接表した。
- source_word: ἥκει
  choice: 来ていません
  rationale: 到来を表す動詞を「時」と自然に結び付け、ヨハネ文書に繰り返される表現も保った。
- source_word: ἡ ὥρα μου
  choice: 私の時
  rationale: 単なる都合のよい時機と限定せず、イエスの使命と栄光に関わるヨハネ福音書の主題的な含みを保持した。日本語では「私の時」が自然であり、「私の時間」よりも定められた時という響きを保てる。
theological_decisions:
- issue: 母に対するイエスの呼びかけと応答の語調
  choice: 敬意を失わずに距離を置く応答
  alternative: 厳しい叱責、または親愛を明示した呼びかけ
  rationale: Τί ἐμοὶ καὶ σοί は立場や関心の距離を示し、γύναι は文脈上必ずしも侮辱ではない。本文と脚注により、冷酷さにも親愛さにも過度に傾けず、原文の緊張を残した。
- issue: 「私の時」の意味
  choice: 目前の出来事を越えて、神によって定められたイエスの時を含意し得る表現
  alternative: このしるしを行う時だけを指す、または一般的な時間の話にすぎないと限定する理解
  rationale: ヨハネ福音書における「時」はイエスの使命、受難、死、復活、栄光と主題的に結び付く。本文では説明を付加せず「私の時」として、その広い響きと文脈上の曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの応答が持つ距離感と「私の時」のヨハネ的な重みを保持した。「女の方」は現代日本語ではやや唐突に響き得るため、脚注で当時の語用を説明した。
