  text: αὐτὸς ⸀δὲ Ἰησοῦς οὐκ ἐπίστευεν ⸀αὑτὸν αὐτοῖς διὰ τὸ αὐτὸν γινώσκειν πάντας
base_translation:
  language: en
  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: ja
  text: しかし、イエスご自身は、彼らにご自分を委ねようとはされなかった。すべての人を知っておられたからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では、前節の「イエスを信じた」と同じ動詞が使われている。多くの人がイエスを「信じた」のに対し、イエスは彼らにご自分を「委ねようとはされなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: しかし、イエスご自身は
  rationale: δέの逆接と、主格のαὐτόςが示す強調を保ち、前節で信じた人々とイエスとの対照を明確にした。
- source_word: οὐκ ἐπίστευεν
  choice: 委ねてはいなかった
  rationale: πιστεύωはここで再帰代名詞と与格を伴い、「自分を相手に委ねる、信任する」という意味になる。未完了過去の継続的・態度的な含みを「てはいなかった」で表した。
- source_word: αὑτὸν αὐτοῖς
  choice: 彼らにご自分を
  rationale: 再帰的な目的語と与格の関係を自然な日本語で保ち、イエスが彼らに自己を託さなかったことを示した。
- source_word: διὰ τὸ αὐτὸν γινώσκειν
  choice: 知っておられたからである
  rationale: διά＋冠詞付き不定詞の原因を「から」で表現し、γινώσκωを文脈に即して「知る」と訳した。
- source_word: πάντας
  choice: すべての人を
  rationale: 男性複数形が文脈上、人間一般を指すことを明示し、特定の集団に限定しなかった。
theological_decisions:
- issue: 23節と24節におけるπιστεύωの語の反復
  choice: 24節では「委ねる」と訳し、同じ動詞であることを脚注で示す。
  alternative: 両節で「信じる」または「信頼する」を用いて語形をそろえる。
  rationale: ギリシア語の語遊びを日本語本文だけで自然かつ正確に再現するのは難しい。「ご自分を信じる」は誤解を招くため、本文では意味を優先し、語彙上のつながりは脚注に残した。
- issue: πάνταςの範囲
  choice: 「すべての人」とし、人間一般を指す表現にする。
  alternative: 「彼らすべて」または「すべてをご存じ」と限定・拡張して訳す。
  rationale: 目的語は人を指すが、本文は特定集団に明示的に限定していない。次節とのつながりも考慮し、包括的だが過度に教理化しない訳とした。
translation_notes:
  register: 明快な現代標準語を用いながら、聖書本文としての品位を保った。「ご自身」「ご自分」「知っておられた」により、自然な敬語表現とした。
