  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: ja
  text: 弟子たちは、「あなたの家への熱意が、私を食い尽くす」と書かれている[a]のを思い出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私を食い尽くした」。詩篇69篇9節の一部の本文伝承を反映する訳。ヨハネのギリシア語本文は「私を食い尽くす」という未来形。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: 思い出した
  rationale: アオリスト形を、自然で直接的な現代日本語として訳した。受け身の「思い起こさせられた」とせず、文脈に即して主体的な想起を表す。
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちは
  rationale: μαθητήςの新約聖書における標準的で自然な訳語「弟子」を用い、αὐτοῦは日本語では文脈上明白なため明示しない。
- source_word: γεγραμμένον ἐστίν
  choice: 書かれている
  rationale: 完了受動の聖書引用定型句を、書かれた言葉が現在も効力を持つ含意を保つ自然な日本語で表した。
- source_word: Ὁ ζῆλος τοῦ οἴκου σου
  choice: あなたの家を思う熱意
  rationale: 属格を客観的属格として自然に展開し、神の家に向けられた強い献身を表した。「家」を保持して詩篇の引用表現を保ち、「神殿」と限定しなかった。
- source_word: καταφάγεταί με
  choice: 私を焼き尽くす
  rationale: 未来形を日本語の非過去形で表し、今後の成就を含み得る原文の方向性を保持した。κατεσθίωの強い比喩を、引用として自然かつ荘重な「焼き尽くす」で表した。
theological_decisions:
- issue: 詩篇引用におけるκαταφάγεταίの時制
  choice: 未来形に対応する「私を焼き尽くす」を本文に採用
  alternative: 「私を焼き尽くした」または「私を食い尽くした」
  rationale: ヨハネ本文のギリシア語は未来形であり、別の詩篇本文伝承の過去的表現に調和させず、ヨハネが記した時制と、イエスへの適用が持つ将来的含みを保った。
- issue: 「家」の指示対象
  choice: 引用本文では「家」を保持
  alternative: 「神殿」
  rationale: 直前の文脈では神殿を指すが、οἶκοςという詩篇引用の語を保ち、解釈を訳文の中で限定しすぎないようにした。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、聖書引用としての品位を保った。「熱意」はζῆλοςの強さを伝え、「焼き尽くす」は比喩の激しさを自然に表す。脚注記号[a]を本文中に配置した。
