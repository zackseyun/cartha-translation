id: JHN.2.25
reference: John 2:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: ja
  text: そして、人についてだれかに証言してもらう必要はなかった。ご自身が、人の内に何があるかを知っておられたからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人」は、ここでは一人の人を代表的に指すとも、人間一般を指すとも取れる。ギリシア語では単数形が二度用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ χρείαν εἶχεν
  choice: 必要もなかった
  rationale: χρείαν ἔχειν（必要がある）という慣用表現を、現代日本語として自然に否定形で表した。「も」は前節から続く理由の並列を示す。
- source_word: ἵνα τις μαρτυρήσῃ
  choice: だれかに証言してもらう
  rationale: μαρτυρέωの証言・証しという意味を保ちつつ、必要の有無を述べる日本語の構文として自然にした。τιςは不特定の「だれか」とした。
- source_word: περὶ τοῦ ἀνθρώπου
  choice: 人について
  rationale: 単数形ἄνθρωποςの総称的用法を、性別を限定しない日本語の「人」で表した。個人と人間一般の双方を含み得る広がりを残す。
- source_word: αὐτὸς γὰρ
  choice: ご自身が……からである
  rationale: αὐτόςの強調を「ご自身」で保持し、γάρは直前の理由を示す「からである」とした。
- source_word: ἐγίνωσκεν
  choice: 知っておられた
  rationale: 状態的・継続的な知識を表す未完了過去を自然な日本語で表現した。敬語はイエスを指す文脈に即した通常の聖書文体である。
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: 人の内に何があるか
  rationale: 内面的なものを指し得るἐνの幅を「内に」で保ち、同じἄνθρωποςを再び「人」と訳して原文の反復を再現した。日本語では一般的・恒常的な内容として自然な「ある」を用いた。
theological_decisions:
- issue: イエスが人について持つ知識の範囲
  choice: 「人の内に何があるか」と広く訳し、イエスが外部の証言によらず直接知っていたことを示す。
  alternative: 「一人一人の心の中」または「人間の本性」と限定する。
  rationale: 単数形のἀνθρώπου／ἀνθρώπῳは、個々人を代表的に指す意味と人間一般を指す意味の双方を含み得る。原文が明示しない範囲を翻訳で限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。前節とのつながりを「また」と「も」で示し、法廷的含意を持つ「証言」を保持した。脚注記号は節末に置き、訳語「人」が持つ総称的な幅を説明した。
