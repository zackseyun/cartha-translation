id: JHN.2.3
reference: John 2:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὑστερήσαντος οἴνου λέγει ἡ μήτηρ τοῦ Ἰησοῦ πρὸς αὐτόν· Οἶνον οὐκ ἔχουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/003.yaml
  text: And when the wine ran out[a], the mother of Jesus says to him[b], “They have no wine.”
translation:
  language: ja
  text: ぶどう酒がなくなると[a]、イエスの母はイエスに言う[b]。「ぶどう酒がありません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「ぶどう酒が不足したとき」。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は、過去の出来事を現在形で語る歴史的現在を用いて「言う」としている。「言った」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: ぶどう酒がなくなると
  rationale: 属格独立構文のアオリスト分詞が、主動詞に先立つ状況を示している。日本語として自然に不足の発生を表し、続く「ぶどう酒がありません」とも整合する。直訳的な「ぶどう酒が不足したとき」は脚注に示す。
- source_word: λέγει
  choice: 言う
  rationale: ギリシア語の歴史的現在を保ち、ヨハネの叙述の生き生きとした調子を伝える。日本語でも物語文における現在形として理解できる。
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: イエスの母
  rationale: 原文の呼称をそのまま保ち、この場面で母の名を明示しないヨハネの表現に従う。
- source_word: πρὸς αὐτόν
  choice: イエスに
  rationale: 日本語では「彼に」より指示対象が明確で自然であるため、代名詞の指示対象を明示した。新たな情報は加えていない。
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: ぶどう酒がありません
  rationale: 日本語では所有者を明示せずにこのように言うのが自然であり、原文の複数主語が誰を指すかを特定しないまま、ぶどう酒がないという直接的な知らせを伝えられる。
- source_word: οἶνος
  choice: ぶどう酒
  rationale: 通常の意味を明確に表す現代日本語の標準的な訳語であり、語義を弱めたり別の飲み物に言い換えたりしない。
theological_decisions:
- issue: ヨハネの物語叙述における歴史的現在
  choice: 現在形の「言う」を保つ
  alternative: 過去形の「言った」とする
  rationale: 教理上の意味を付加せず、原文の時制と談話上の生き生きとした効果を可能な範囲で反映するため。
- issue: 「ぶどう酒がない」の暗黙の複数主語が指す相手
  choice: 日本語でも所有者を明示せず、「ぶどう酒がありません」とする
  alternative: 「あの人たちにはぶどう酒がありません」「宴会の主催者にはぶどう酒がありません」などと補う
  rationale: 原文は複数主語の指示対象を明示していない。日本語の自然な省略を用いることで、その曖昧さを保ち、婚宴の主催者などに限定する解釈を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書の物語としての品位を保った。「イエスの母はイエスに」は反復を伴うが、「彼に」より明確で、声に出して読んでも理解しやすい。
