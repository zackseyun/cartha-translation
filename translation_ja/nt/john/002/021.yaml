  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐκεῖνος δὲ ἔλεγεν περὶ τοῦ ναοῦ τοῦ σώματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/021.yaml
  text: But he was speaking about the temple of his body[a].
translation:
  language: ja
  text: しかし、イエスはご自分の体という神殿[a]について語っておられたのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「聖所」。ここで「神殿」と訳したギリシア語ナオスは、神殿の境内全体よりも、特にその中心となる聖所を指すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνος
  choice: イエスは
  rationale: 文脈上の指示対象を明確にし、現代日本語で不自然な「その方は」を避けた。
- source_word: δὲ
  choice: しかし
  rationale: 前節の聞き手の誤解と、ここで示される真意との穏やかな対比を表す。
- source_word: ἔλεγεν
  choice: 語っておられた
  rationale: 未完了過去の叙述的な側面を保ちつつ、イエスにふさわしい自然で敬意ある表現とした。「意味していた」ほど解釈的にはしない。
- source_word: περὶ
  choice: について
  rationale: 属格を伴う περί の基本的な意味を、明快な現代日本語で表す。
- source_word: ναοῦ
  choice: 神殿
  rationale: 標準的で読みやすい訳語を採用し、神殿域全体ではなく聖所を指しうる語義上の精密さは脚注に残す。
- source_word: τοῦ σώματος αὐτοῦ
  choice: ご自分の体という
  rationale: イエス自身の体であることと、体を神殿として示す比喩的同定を自然な日本語で保持する。
theological_decisions:
- issue: イエスの体と神殿との比喩的同定
  choice: 「ご自分の体という神殿」として比喩を直接保持する
  alternative: 「ご自分の体である聖所」または「神殿とはご自分の体のことであった」
  rationale: ヨハネの説明を教理的に敷衍せず、体と神殿の結び付きを明確かつ自然な日本語で示す。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、説明文としての格調を保った。「のである」は語り手による解説であることを自然に示す。
