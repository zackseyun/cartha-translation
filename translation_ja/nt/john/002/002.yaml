  text: ἐκλήθη δὲ καὶ ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὸν γάμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/002.yaml
  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: ja
  text: イエスも弟子たちとともに、その婚礼に招かれていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: 招かれていた
  rationale: 社交行事である婚礼への出席という文脈では、καλέω の受動形は「呼ばれた」より「招かれた」が自然。日本語ではその時点で招待を受けていた状態を自然に表すため「招かれていた」とした。
- source_word: δὲ καὶ
  choice: も
  rationale: 前節に登場するイエスの母に加えて、イエスも招かれていたことを示す穏やかな接続と追加の意味を、自然な日本語の係助詞「も」で表した。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: 固有名を日本語で定着した形に音写した。
- source_word: καὶ οἱ μαθηταὶ αὐτοῦ
  choice: 弟子たちとともに
  rationale: 第二の καὶ がイエスとその弟子たちを並列していることを自然に表現した。μαθηταί は、学ぶ者としての関係とイエスに従う集団としての意味を保つ慣用的な「弟子たち」とした。
- source_word: εἰς τὸν γάμον
  choice: その婚礼に
  rationale: γάμος はここでは結婚の祝いの行事を指す。「婚礼」は祝宴だけに限定せず、文脈にも合う簡潔で品位ある表現。「その」は前節ですでに言及された婚礼を受ける。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位のある標準日本語。ギリシア語の語順を機械的に写さず、イエスと弟子たちがともに招かれたという構造を自然に伝える。解釈上必要のない補足は加えていない。
