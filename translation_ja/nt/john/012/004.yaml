  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: ja
  text: しかし、弟子の一人で、後にイエスを裏切る[a]ことになるイスカリオテのユダが言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「裏切る」は、直訳すると「引き渡す」。
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: 言った
  rationale: ギリシア語は物語上の現在形だが、現代日本語の自然な叙述に合わせて過去形とした。
- source_word: δὲ
  choice: しかし
  rationale: 直前のマリアの行為と、これに続くユダの異議との穏やかな対照を示す。
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: イスカリオテのユダ
  rationale: 日本語聖書で広く通用する固有名の形を用いた。
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: 弟子の一人
  rationale: 師と弟子の関係を正確かつ簡潔に表す。所有代名詞は文脈上明らかなため、日本語として自然になるよう明示しなかった。
- source_word: ὁ μέλλων
  choice: やがて…しようとしていた
  rationale: μέλλωの将来への見込み・企図を表しつつ、直ちに起こることに限定しすぎない表現とした。
- source_word: παραδιδόναι
  choice: 裏切ろうとしていた
  rationale: 語の基本義は「引き渡す」だが、ユダがイエスに対して行うことを指すこの文脈では「裏切る」が自然で明確。字義的な選択肢は脚注に残した。
- source_word: αὐτόν
  choice: イエスを
  rationale: 日本語では「彼を」より指示対象を明示する方が自然で、文脈上の指示対象も明白である。
theological_decisions:
- issue: ユダの行為を表す παραδιδόναι の訳
  choice: 裏切る
  alternative: 引き渡す
  rationale: 「裏切る」は行為の背信性を文脈に即して明示する一方、「引き渡す」は原語の広い基本義と他箇所との語彙的連続性を保つ。本文では自然で文脈に即した「裏切る」を採り、字義的な訳を脚注に示した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。文末の「言った」は次節の発言へ続く導入として用い、脚注記号は節末に配置した。
