  terminology: 「人の子」は定着した称号として適切です。「栄光を受ける」はδοξασθῇの受動態と、栄光を与える主体を明示しない原文の含みを保ちます。脚注aの「直訳的には『時刻』または『時』」は、本文自体が「時」であり、ὥραの説明としても不正確・不自然になりうるため整理します。
