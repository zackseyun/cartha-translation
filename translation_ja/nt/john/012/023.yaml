id: JHN.12.23
reference: John 12:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: ja
  text: イエスは彼らに答えて、こう言われた。「人の子[b]が栄光を受ける時[a]が到来した。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は「時（ὥρα）」。「時」はヨハネ福音書で繰り返される語で、イエスの苦難と栄光のために定められた時を指す。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語の「人の子」は称号であり、ダニエル書7章との関連を想起させる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: 彼らに答えて言った
  rationale: 歴史的現在のἀποκρίνεταιは、日本語の物語として自然な過去形にした。λέγωνは直接話法を導く働きを保ち、「答えて言った」と訳した。
- source_word: Ἐλήλυθεν
  choice: 来た
  rationale: 完了形が示す、定められた時が到来して今や現実となった状態を、自然な日本語の「来た」で表した。
- source_word: ὥρα
  choice: 時
  rationale: 単なる時刻ではなく、ヨハネ福音書で繰り返される、イエスの苦難と栄光のために定められた決定的な時を表すため、「時」とした。
- source_word: δοξασθῇ
  choice: 栄光を受ける
  rationale: 受動態を保ちつつ、現代日本語で自然に読める表現とした。ヨハネにおける死、復活、高挙を含む豊かな含意を限定しない。
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: 人の子
  rationale: ダニエル書7章との関連と、イエスの自己呼称としての神学的・間テクスト的な力を保つ定着した訳語である。
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπουという称号の訳
  choice: 人の子
  alternative: 人なる者
  rationale: 一般的な人間を指す表現へ平板化せず、ダニエル書7章とヨハネ福音書におけるキリスト論的な響きを保つため。
- issue: Ἐλήλυθεν ἡ ὥραの時制と神学的含意
  choice: 時が来た
  alternative: その時はすでに来ている
  rationale: ギリシア語完了形の到来と現在的結果を簡潔に表し、ヨハネ福音書における「時」の主題を維持するため。
- issue: δοξασθῇの受動表現
  choice: 栄光を受ける
  alternative: 栄光を現す
  rationale: 原文の受動態を保ち、栄光を与える主体を本文が明示していないという含みを、解釈によって埋めないため。
translation_notes:
  register: 明快な現代標準語を用い、直接話法は簡潔で荘重さを失わない常体とした。原文のλέγωνは不自然に省略せず「答えて言った」と表し、「時」と「人の子」というヨハネ的な主要語を保持した。
