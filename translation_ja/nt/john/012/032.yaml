id: JHN.12.32
reference: John 12:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: κἀγὼ ⸀ἐὰν ὑψωθῶ ἐκ τῆς γῆς, πάντας ἑλκύσω πρὸς ἐμαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: ja
  text: そしてわたしは、地から上げられる時[a][b]、すべての人を[c]わたしのもとに引き寄せる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「上げられるなら」。ギリシア語は条件形だが、文脈では間もなく確実に起こるイエスの死を指している。
    reason: alternative_reading
  - marker: b
    text: 「上げられる」には「高くされる」という意味もあり、十字架と栄光化を重ねるヨハネの二重の意味が込められている。
    reason: lexical_alternative
  - marker: c
    text: 直訳「すべてを」。ギリシア語では人々を指すと考えられるが、救いの範囲をめぐる後代の神学的論争をこの表現だけで決着させるものではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: そしてわたしは
  rationale: καίとἐγώの融合形である。前の文とのつながりと「わたし」の軽い強調を、自然な日本語で保った。
- source_word: ἐὰν
  choice: 時
  rationale: 接続法を伴う条件表現だが、文脈では差し迫った出来事として語られているため、「時」とした。条件形そのものは脚注に残した。
- source_word: ὑψωθῶ
  choice: 上げられる
  rationale: 十字架上に物理的に上げられることと、高くされ栄光を受けることとのヨハネ的な二重の意味を保てる表現である。
- source_word: ἐκ τῆς γῆς
  choice: 地から
  rationale: ここでγῆは、十字架によって地面から上げられるという意味に最も自然に合う。「地上から」より簡潔で、原文の空間的表現も保つ。
- source_word: πάντας
  choice: すべての人を
  rationale: 男性複数対格が単独で用いられ、人々を指すと理解するのが自然である。「すべて」だけでは物を含むようにも読めるため、人を補った。
- source_word: ἑλκύσω
  choice: 引き寄せる
  rationale: ἕλκωの「引く」という力のある動きを保ちつつ、人を自分のもとへ導くという文脈に自然な表現である。働きの仕方を必要以上に限定しない。
- source_word: πρὸς ἐμαυτόν
  choice: わたしのもとに
  rationale: 再帰代名詞による行き先の強調を、現代日本語として自然に表した。
theological_decisions:
- issue: πάνταςが指す範囲と救いに関する理解
  choice: すべての人
  alternative: すべて／あらゆる人々
  rationale: 原文は人を指す男性複数形で、イエスが引き寄せる働きの広がりを述べている。しかし、それが例外なく各個人を意味するのか、あらゆる種類や集団の人々を意味するのかという後代の論争までは、この節だけでは決定しない。訳文はその広がりを保ち、特定の教派的結論を加えない。
- issue: ὑψωθῶの二重の意味
  choice: 上げられる
  alternative: 高く上げられる／高くされる
  rationale: ヨハネでは、十字架上に上げられることと、栄光を受け高くされることが重なっている。一方だけに限定せず、両方を含みうる表現を採った。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、イエスの発言としての簡潔さと厳粛さを保った。「わたし」「引き寄せる」により自然な口調と原文の力強さを両立させた。
