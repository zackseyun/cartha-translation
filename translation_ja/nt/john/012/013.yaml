id: JHN.12.13
reference: John 12:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: ja
  text: '人々は、なつめやしの枝を手に取り、イエスを迎えに出て行き、こう叫んでいた。


    「ホサナ！[a]

    主の名によって来られる方は、祝福されますように。[b]

    イスラエルの王もまた！」[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ホサナ」はヘブライ語に由来し、もとは「どうか、お救いください」という意味。この時代には賛美と歓喜の叫びとしても用いられた。
    reason: lexical_alternative
  - marker: b
    text: 詩編118:26を踏まえた言葉。
    reason: cross_reference
  - marker: c
    text: 別訳「そして、イスラエルの王！」。ギリシア語の接続詞は、前の「来られる方」を「イスラエルの王」と説明・強調するとも、もう一つの歓呼を加えるとも取れる。
    reason: alternative_reading
lexical_decisions:
- source_word: τὰ βαΐα τῶν φοινίκων
  choice: なつめやしの枝
  rationale: βάϊονは枝、φοῖνιξはこの文脈ではなつめやし（しゅろ）類の木を指す。「なつめやしの枝」は現代日本語で具体的かつ自然であり、二つの名詞の関係も十分に表す。
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: イエスを迎えに出て行って
  rationale: 字義的には「彼に会うため出て行った」。歓迎の文脈が明白なので、日本語では「迎えに出る」が自然である。代名詞だけでは参照先が曖昧になりやすいため「イエス」とした。
- source_word: ἐκραύγαζον
  choice: 叫び続けた
  rationale: 未完了過去の継続・反復的な様相を簡潔に表す。
- source_word: Ὡσαννά
  choice: ホサナ
  rationale: 当時すでに歓呼として機能していたヘブライ語由来の表現なので音写し、語源的意味は脚注に示す。
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: 来られる方に、祝福があるように
  rationale: 詩編118:26の歓呼として自然な日本語にしつつ、ὁ ἐρχόμενοςの名詞的用法を「来られる方」で保持する。敬語は歓呼の対象への敬意を自然に示す。
- source_word: ἐν ὀνόματι κυρίου
  choice: 主の名によって
  rationale: 権威・委任を含み得る聖書的表現を、解釈的に展開せず形式的に保持する。
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: イスラエルの王に！
  rationale: 直前の「祝福があるように」を補って同格的・追加的な歓呼として読める日本語にした。ただしκαίは単純な接続とも取れるため、その曖昧さを脚注に残す。
theological_decisions:
- issue: 詩編引用中のκύριοςの表記
  choice: 主
  alternative: 主なる神／ヤハウェ
  rationale: ギリシア語本文はκύριοςであり、「主」が直接的である。背後のヘブライ語神名を本文へ明示的に持ち込まない。
- issue: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλの統語的関係
  choice: 前の祝福句に同格的に続く歓呼として「イスラエルの王に！」
  alternative: 「そして、イスラエルの王！」または「すなわち、イスラエルの王！」
  rationale: καίは「そして」とも、説明・強調的に「すなわち／まさに」とも理解できる。本文では自然な歓呼として訳し、意味を一つに固定しないよう脚注で別訳を示す。
- issue: 王としての称号の保持
  choice: イスラエルの王
  alternative: イスラエルを治める王
  rationale: 本文の明示的な王的・メシア的称号を拡張も弱化もせず、そのまま保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。群衆の継続的な歓呼が耳で聞いて分かるよう改行した。「ホサナ」は典礼的・歴史的な響きを保持し、意味は脚注で補った。
