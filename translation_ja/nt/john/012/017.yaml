id: JHN.12.17
reference: John 12:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐμαρτύρει οὖν ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε τὸν Λάζαρον ἐφώνησεν ἐκ τοῦ μνημείου καὶ ἤγειρεν αὐτὸν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: ja
  text: そこで、イエスがラザロを墓から呼び出し、死者の中からよみがえらせたときにイエスと一緒にいた群衆は、証しをしていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「証言していた」。ギリシア語の動詞は、証言すること、または証しをすることを表し、ヨハネ福音書で繰り返される重要な語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: 証しをしていた
  rationale: 未完了過去の継続的・反復的な側面を「していた」で表しつつ、ヨハネ福音書で繰り返される「証し」の主題との語彙的連続性を保った。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けた物語上・論理上のつながりを、現代日本語で自然に示す。
- source_word: ὁ ὄχλος
  choice: 群衆
  rationale: その場に集まった多数の人々を指す標準的で明瞭な訳語。
- source_word: ὁ ὢν μετ’ αὐτοῦ
  choice: イエスと一緒にいた
  rationale: 冠詞付き分詞句が特定する群衆を自然に限定する。代名詞の指示対象は日本語で明確になるよう「イエス」とした。
- source_word: ὅτε
  choice: ときに
  rationale: 群衆がイエスと共にいた時点を示す時間接続をそのまま保った。
- source_word: ἐφώνησεν
  choice: 呼び出し
  rationale: イエスがラザロに呼びかけて墓の外へ出したことを、文脈に即して簡潔に表す。
- source_word: ἐκ τοῦ μνημείου
  choice: 墓から
  rationale: μνημεῖονを埋葬場所として訳し、ἐκが示す内部から外への動きを自然な日本語で表した。
- source_word: ἤγειρεν
  choice: よみがえらせた
  rationale: 復活の文脈における使役的な意味を明確にし、ラザロが死から生へ戻されたという本文の主張を保つ。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 複数形νεκρῶνとἐκの表現を反映し、復活表現として自然かつ原文に近い形を採った。
theological_decisions:
- issue: ラザロについての復活表現
  choice: 死者の中からよみがえらせた
  alternative: 死者の中から起こした
  rationale: ἐγείρωの字義を保ちながら、この文脈で明白な死からの復活を現代日本語で誤解なく伝える。奇跡の主張を弱めず、追加の教理説明も加えていない。
- issue: 群衆の証しの内容
  choice: 目的語を補わず「証しをしていた」とする
  alternative: そのことを証ししていた
  rationale: ギリシア語本文には明示的な目的語がないため、証しの内容を文脈から理解できる形にし、原文の統語的な余白を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長い関係節は日本語の連体修飾として整理し、主語「群衆」と主要動詞「証しをしていた」の関係が追えるようにした。
