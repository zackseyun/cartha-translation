  source_fidelity: 原文の語順と統語関係を適切に反映している。「イエスがラザロを墓から呼び出し、死者の中からよみがえらせたときにイエスと一緒にいた群衆」は、ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ ὅτε…の限定を明確に表す。ἐμαρτύρειの未完了過去も「証しをしていた」により継続的な描写として保たれている。
  naturalness: 明瞭な現代標準日本語であり、関係節の長さも許容範囲で、主語と述語の関係が分かりやすい。「そこで」「群衆」「証しをしていた」は本文の格調を保ちつつ不自然ではない。
  terminology: 「ラザロ」「墓」「死者の中からよみがえらせた」は文脈と伝統的な聖書日本語の双方に適合する。「証し」はヨハネ文書におけるμαρτυρέωの反復的語彙を保つ、適切で非教派的な訳語である。
