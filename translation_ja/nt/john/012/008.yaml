id: JHN.12.8
reference: John 12:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τοὺς πτωχοὺς γὰρ πάντοτε ἔχετε μεθ’ ἑαυτῶν, ἐμὲ δὲ οὐ πάντοτε ἔχετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: ja
  text: というのも、貧しい人々はいつもあなたがたと一緒にいますが、わたしはいつもあなたがたと一緒にいるわけではありません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς πτωχούς
  choice: 貧しい人々
  rationale: 形容詞の名詞的用法で、貧困にある人々を総称する。現代日本語では「貧しい人々」が明瞭で自然である。
- source_word: γάρ
  choice: （独立した接続語としては訳出しない）
  rationale: 前節への説明を示すが、日本語では文脈と文の流れによって説明関係が十分伝わり、冒頭の「というのは」などを置くとかえって重くなる。
- source_word: πάντοτε
  choice: いつも
  rationale: 継続的に共にいること、または共にいられることを表す。両節で同じ語を軸にしつつ、後半は自然な否定表現に組み込んだ。
- source_word: ἔχετε
  choice: 一緒にいます／一緒にいる
  rationale: 所有ではなく、そばにいる状態・共に過ごせる状況を表すため、日本語の「持っている」ではなく存在・同伴を示す表現とした。
- source_word: μεθ’ ἑαυτῶν
  choice: あなたがたと一緒に
  rationale: 直訳的な「あなたがた自身と共に」ではなく、複数の聞き手と共にいることを自然な現代日本語で表す。
- source_word: ἐμέ
  choice: わたし
  rationale: 話者であるイエス自身を指す一人称代名詞として、本文の品位に合う表記を用いた。
- source_word: δέ
  choice: が
  rationale: 貧しい人々が常に共にいることと、イエスが常に共にいるわけではないことの対照を、自然な日本語の逆接で示す。
- source_word: οὐ πάντοτε
  choice: いつも……いるわけではありません
  rationale: 「いつもいる」の全体を否定するギリシア語を自然に表し、「決していない」という全面否定にならないようにした。
theological_decisions:
- issue: この発言が貧しい人々への配慮を軽んじるものとして誤用される可能性
  choice: 貧しい人々が継続して共にいることと、イエスが常に共にいるわけではないこととの時間的な対照として、本文をそのまま訳す。
  alternative: 貧しい人々よりイエスのほうが重要だという評価を補う意訳、または対照を弱める意訳。
  rationale: 原文は二者の価値を比較せず、共にいる期間について対照している。貧しい人々への配慮を否定する含意も、逆に本文の切迫した対照を和らげる説明も加えない。
translation_notes:
  register: 明瞭で現代的かつ丁寧な標準日本語。「貧しい人々」は一般読者に自然で、「わたし」「あなたがた」は聖書本文としての落ち着いた品位を保つ。
