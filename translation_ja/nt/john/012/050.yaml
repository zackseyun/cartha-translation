id: JHN.12.50
reference: John 12:50
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: ja
  text: そして、父の命令が永遠のいのちであることを、わたしは知っています。[a] ですから、わたしが語ることは、父がわたしに言われたとおりに語るのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「父の命令は永遠のいのちに導く」または「父の命令は永遠のいのちに関するものである」とも理解できる。ギリシア語は、より直訳的には「父の命令は永遠のいのちである」。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: 命令
  rationale: 権威ある指示を表す語として、現代日本語で自然かつ原文に近い。「戒め」も可能だが、ここではやや伝統的・宗教的な響きを加えやすい。
- source_word: ζωὴ αἰώνιος
  choice: 永遠のいのち
  rationale: ヨハネ文書の定型的な表現を保ち、単なる無限の存続だけでなく、来たるべき時代に属するいのちという神学的含意も担える。
- source_word: οἶδα
  choice: 知っています
  rationale: 確かな認識を自然な現代日本語で表す。
- source_word: ἃ
  choice: こと
  rationale: 中性複数関係代名詞を日本語として自然にまとめ、イエスが語る内容全体を指す形にした。
- source_word: λαλῶ
  choice: 語る／語っている
  rationale: 二度のλαλῶの反復を可能な限り保つ。後半は日本語の文脈に合わせて進行・継続を示す形にしたが、意味上の追加は意図していない。
- source_word: καθὼς
  choice: とおりに
  rationale: 父の言葉とイエスの発言との対応関係を明確で自然に示す。
- source_word: εἴρηκέν μοι
  choice: わたしに言われた
  rationale: 完了形の、過去に語られ現在も効力を持つ含みを文脈に委ねつつ、尊敬表現によって父を主語とする自然な日本語にした。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 原文の定冠詞付き称号を「父」とし、「わたしの父」という所有表現は補わない。
- source_word: οὖν
  choice: ですから
  rationale: 前半を受ける論理的帰結を、明瞭で品位ある現代日本語で示す。
theological_decisions:
- issue: 「その命令は永遠のいのちである」の意味
  choice: 「父の命令が永遠のいのちである」と等置表現を本文に保持する。
  alternative: 「父の命令は永遠のいのちに導く」または「永遠のいのちに関するものである」と解釈して訳す。
  rationale: 原文はἐστινを用いた直接的な等置表現である。結果・内容・本質のいずれを強調するかを本文で限定せず、ヨハネ的な神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの厳粛な発言にふさわしい品位を保った。「いのち」はヨハネ文書での神学的な用法を意識して平仮名表記とした。脚注記号は節末に置き、等置表現全体への注であることを示した。
