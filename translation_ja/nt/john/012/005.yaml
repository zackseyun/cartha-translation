id: JHN.12.5
reference: John 12:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: ja
  text: 「なぜこの香油を三百デナリで売って、貧しい人々に施さなかったのか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一デナリは労働者の標準的な一日分の賃金に相当した。働かない日を考慮すると、三百デナリはおよそ一年分の収入であった。
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: なぜ
  rationale: 理由を問う簡潔な疑問表現であり、現代日本語として自然に修辞的な非難の響きを伝える。
- source_word: μύρον
  choice: 香油
  rationale: 香りのある高価な塗油用の品を指す。文脈に適し、聖書用語としても一般読者に理解しやすい。
- source_word: ἐπράθη
  choice: 売って
  rationale: アオリスト受動形の意味を日本語の「売る」で表す。後続の受動形と合わせて逐語的に「売られ」とするより、「売って…施す」という目的を伴う自然な反実仮想の表現を選んだ。
- source_word: τριακοσίων δηναρίων
  choice: 三百デナリで
  rationale: 価格を示す属格を助詞「で」で表し、歴史的な貨幣単位を本文に保持する。その価値は脚注で説明する。
- source_word: ἐδόθη
  choice: 施さなかった
  rationale: 貧しい人々への慈善という文脈で、単なる「与える」より自然な日本語となる「施す」を用いた。οὐκとともに、実現しなかった行為への非難を表す。
- source_word: πτωχοῖς
  choice: 貧しい人々に
  rationale: 形容詞の名詞的用法と与格を、尊厳を保った明瞭な現代日本語で表す。
theological_decisions: []
translation_notes:
  register: ユダの発言として、口語的でありながら品位のある修辞疑問にした。原文の「なぜ…されなかったのか」という受動構文は、日本語では不自然になりやすいため、「売って、…施さなかったのか」と能動的に構成した。貨幣単位「デナリ」は保持し、その購買価値を脚注で補った。
