  text: διὰ τοῦτο οὐκ ἠδύναντο πιστεύειν ὅτι πάλιν εἶπεν Ἠσαΐας·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/039.yaml
  text: 'For this reason they were not able to believe, because Isaiah said again:'
translation:
  language: ja
  text: このため、彼らは信じることができなかった。なぜなら、イザヤがさらにこう言ったからである：
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 前の文脈を受ける明示的な因果関係を、簡潔で自然な現代日本語で示す。
- source_word: οὐκ ἠδύναντο
  choice: できなかった
  rationale: δύναμαι の未完了過去が表す能力・可能性の欠如を保ち、単なる不願意へと弱めない。
- source_word: πιστεύειν
  choice: 信じることが
  rationale: ヨハネ福音書における πιστεύω の通常の意味を自然に表す。
- source_word: ὅτι
  choice: からである
  rationale: 後続するイザヤの引用が、信じることのできなかった理由を示すという因果的な働きを保つ。
- source_word: πάλιν
  choice: さらに
  rationale: 直前のイザヤ引用に続く別の引用であることを日本語として自然に示す。「再び」も可能だが、同じ発言の反復との誤解を避ける。
- source_word: εἶπεν
  choice: 言っている
  rationale: 聖書の引用を現在にも効力を持つ言葉として導入する、日本語の自然な引用表現。ギリシア語のアオリストは字義的には「言った」とも訳せる。
- source_word: Ἠσαΐας
  choice: イザヤ
  rationale: 日本語聖書で定着した固有名の表記を用いる。
theological_decisions:
- issue: 信じることができなかったという不能の性質
  choice: 「信じることができなかった」と率直に訳す。
  alternative: 「信じようとしなかった」と意志の拒絶に弱める、または特定の予定論・自由意志論で説明を加える。
  rationale: ギリシア語は単なる不願意ではなく不能を述べている。一方、その不能と神の働き、人間の責任との関係は訳文だけで教派的に解決せず、本文の緊張を保つ。
- issue: ὅτι が導く因果関係
  choice: イザヤの次の言葉を、彼らの不能を説明する理由として「からである」で結ぶ。
  alternative: 説明的な「というのは」や、引用内容を示す「と」と解する。
  rationale: この文脈では因果的理解が最も自然だが、その具体的内容は次節の引用に委ね、本文以上の説明は加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の因果構造と「信じることができなかった」という神学的緊張を維持した。文末のコロンに相当する働きは、日本語では「こう言っているからである。」によって次節の引用へ自然につなげた。
