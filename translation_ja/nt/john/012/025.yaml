id: JHN.12.25
reference: John 12:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: ja
  text: 自分の命[a]を愛する者は、それを失う。しかし、この世で自分の命を憎む[b]者は、永遠の命に至るよう、それを保つ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「命」と訳したギリシア語 ψυχή は、文脈により「魂」または「自分自身」を意味することもある。
    reason: lexical_alternative
  - marker: b
    text: 「自分の命を憎む」は、この世で自分の命に執着することを退けるという意図的な逆説であり、自己嫌悪を勧めるものではない。同様の表現についてはルカ14章26節参照。
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: 愛する者
  rationale: 冠詞付き現在分詞の一般的・継続的な意味を、現代日本語で自然な名詞句として表した。
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: 自分の命
  rationale: この文脈の ψυχή は、失ったり保ったりする自己の命を指す。「魂」に限定せず、再帰的な所有関係も自然な日本語で示した。
- source_word: ἀπολλύει αὐτήν
  choice: それを失う
  rationale: 目的語が「命」であり、後半の「保つ」との対照も明確になるため。「滅ぼす」より文脈に適する。
- source_word: ὁ μισῶν
  choice: 憎む者
  rationale: μισέω の強い逆説的表現を弱めず保持した。意味の限定は「この世で」と脚注によって示す。
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: この世で
  rationale: 現在の世界秩序に属する生への執着と永遠の命との対照を、簡潔で自然な表現にした。
- source_word: φυλάξει αὐτήν
  choice: それを保つ
  rationale: 未来形を日本語の文脈で表し、「失う」との対照を保った。「守る」より命の保持という意味に合う。
- source_word: εἰς ζωὴν αἰώνιον
  choice: 永遠の命に至るよう
  rationale: εἰς の目標・帰結の方向性を表し、「永遠の命のために」より、命が永遠の命へと保たれる関係を明確にした。
theological_decisions:
- issue: 「自分の命を憎む」の意味
  choice: 「憎む」という強い表現を本文に残し、この世の命への執着を退ける逆説として読む。
  alternative: 「自分の命をより少なく愛する」「自分の命を惜しまない」
  rationale: 原文の μισέω が持つ修辞的な鋭さと神学的緊張を、説明的な意訳で解消しないため。自己嫌悪の奨励ではないことは脚注で明示した。
- issue: ψυχή の訳語
  choice: 命
  alternative: 魂／自分自身
  rationale: この節では「失う」「保つ」と結びつき、人の命・自己存在を指す。「魂」と訳して心身二元論的な意味に狭めることを避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「愛する／憎む」「失う／保つ」の二重の対照を維持し、原文の逆説を本文で弱めず、誤解を避ける説明は脚注に置いた。
