  text: ἀπεκρίθη ⸂Ἰησοῦς καὶ εἶπεν⸃· Οὐ δι’ ἐμὲ ⸂ἡ φωνὴ αὕτη⸃ γέγονεν ἀλλὰ δι’ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/030.yaml
  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: ja
  text: イエスは答えて言われた。「この声がしたのは、わたしのためではなく、あなたがたのためです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「この声がしたのは、わたしのゆえではなく、あなたがたのゆえです」。ギリシア語の前置詞は原因を表すとも理解できるが、文脈では「～のため」と理解するのが適切である。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν
  choice: イエスは答えて言われた
  rationale: ヨハネに見られる応答の定型句である二つの動詞を保ちつつ、現代日本語として自然で格調ある表現にした。
- source_word: ἡ φωνὴ αὕτη
  choice: この声
  rationale: 直前に天から聞こえた発言を指すため、「音」よりも「声」が文脈に適している。指示語 αὕτη は「この」で表した。
- source_word: γέγονεν
  choice: あった
  rationale: γίνομαι の完了形がここでは声の出現・出来事を指す。「生じた」より自然であり、出来事が起こったという意味を簡潔に伝える。
- source_word: δι’ ἐμὲ ... δι’ ὑμᾶς
  choice: わたしのためではなく、あなたがたのため
  rationale: διά＋対格の並行表現を、文脈上もっとも自然な目的・受益の意味で訳し、対照を明確に保った。
- source_word: Οὐ ... ἀλλὰ
  choice: ではなく
  rationale: 否定と対照の構造を日本語で直接かつ自然に表した。
theological_decisions:
- issue: 天からの声の目的
  choice: その声はイエスのためではなく、周囲にいた人々のためにあった。
  alternative: その声はイエスが原因で生じたのではなく、人々が原因で生じた。
  rationale: 両節の διά＋対格は原因とも解し得るが、イエス自身には確認を必要とせず、聞いている人々に向けられた声であるという文脈には、目的・受益の理解がより適合する。これ以上の教理的説明は加えない。
translation_notes:
  register: 明瞭な現代標準語を用いた。「答えて言われた」は原文の二重動詞を保つため採用し、発話部分は丁寧体として、荘重さと一般読者への分かりやすさを両立させた。
