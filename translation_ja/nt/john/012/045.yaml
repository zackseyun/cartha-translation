id: JHN.12.45
reference: John 12:45
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: ja
  text: また、わたしを見る者は、わたしを遣わした方を見ている[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見つめている」「よく見て認めている」とも訳せる。ギリシア語の動詞は、単に目に映ることだけでなく、注意深く見て認識する意味を含むことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: また
  rationale: 前節から発言をつなぐ接続詞。日本語では「また」が自然で、文脈上の連続性を示す。
- source_word: ὁ θεωρῶν ἐμὲ
  choice: わたしを見る者
  rationale: 冠詞付き現在分詞を一般的な人物を指す表現として訳した。「見る者」は代表的単数と継続的・特徴的な行為を簡潔に保つ。
- source_word: θεωρεῖ
  choice: 見ている
  rationale: θεωρέω の「見る、注視する、認める」という幅を踏まえ、現代日本語として自然な「見ている」を採用し、原文の同語反復も保持した。
- source_word: τὸν πέμψαντά με
  choice: わたしを遣わした方
  rationale: 冠詞付きアオリスト分詞を関係節で自然に表現した。「父」という称号を補わず、原文どおり遣わした者との関係的表現を保つ。「方」は指示対象への敬意を自然に示す。
theological_decisions:
- issue: イエスを見ることと、イエスを遣わした方を見ることとの関係
  choice: 両者を直接結びつける原文の表現を、そのまま「見る者は…見ている」と訳す。
  alternative: イエスを通して遣わした方を知る、またはイエスと遣わした方が同一である、と説明的に言い換える。
  rationale: 本文は啓示における強い結びつきを述べるが、そのあり方を説明してはいない。弱めた意訳も、存在論的同一性を明示する強めた意訳も避け、神学的緊張を保持する。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保った。「わたし」「遣わした方」を用い、不要な教理的補足を本文に加えていない。
