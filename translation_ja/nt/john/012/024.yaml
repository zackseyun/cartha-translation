  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: ja
  text: まことに、まことに、あなたがたに言います。一粒の麦が地に落ちて死ななければ、ただ一粒のままにとどまります[a]。しかし、死ねば[b]、多くの実を結びます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それだけでとどまります」。
    reason: lexical_alternative
  - marker: b
    text: 地に落ちた麦粒が、実を結ぶために死ななければならないという比喩。文脈では、イエスはこのあり方を自らの死に当てはめ、続いて自分に従う者についても語っている。
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: まことに、まことに
  rationale: ヨハネ福音書に特徴的な厳粛な導入句であり、反復と強調を保ちながら、現代日本語で自然かつ重みのある表現とした。
- source_word: λέγω ὑμῖν
  choice: あなたがたに言います
  rationale: 複数の聞き手への直接的な語りかけと、原文の定型的な言い回しを明瞭に保った。
- source_word: ἐὰν μὴ
  choice: 死ななければ
  rationale: 否定条件を日本語として自然な「～なければ」で表し、後半の肯定条件との対照を明確にした。
- source_word: ὁ κόκκος τοῦ σίτου
  choice: 一粒の麦
  rationale: κόκκοςの粒・種という意味とσίτουの麦を、農耕の比喩として最も自然な日本語で表した。「麦の種」も可能だが、「一粒の麦」は単独性を示す後続句ともよく対応する。
- source_word: πεσὼν εἰς τὴν γῆν
  choice: 地に落ちて
  rationale: 分詞が示す、落ちた後に死ぬという動作のつながりを自然に表した。γῆはこの農耕的文脈では「地」が簡潔で適切である。
- source_word: ἀποθάνῃ
  choice: 死ななければ／死ねば
  rationale: 条件節中のアオリスト接続法を、日本語の自然な条件表現で訳した。原文が反復する「死ぬ」を両方の節で保持した。
- source_word: αὐτὸς μόνος μένει
  choice: ただ一粒のままです
  rationale: αὐτόςの強意とμόνοςの「単独で」という意味を、麦粒の比喩に即して表した。感情的な孤独を連想させず、実を生じないまま単独で残る意味を伝える。
- source_word: ἐὰν δὲ ἀποθάνῃ
  choice: しかし、死ねば
  rationale: δέの対照を「しかし」で明示し、前半の否定条件と釣り合う簡潔な表現とした。
- source_word: πολὺν καρπὸν φέρει
  choice: 多くの実を結びます
  rationale: 「実を結ぶ」はφέρει καρπόνに対応する自然な日本語の慣用表現であり、ヨハネ福音書における実の比喩も保つ。「大きな収穫」とすると解釈を加えすぎるため避けた。
theological_decisions:
- issue: 農耕の比喩に暗示されるキリスト論的・弟子道的意味
  choice: 本文では農耕の比喩をそのまま保ち、イエスの死や従う者への適用を明文化しない。
  alternative: イエス自身の死と、それによって多くの人に及ぶ実りを本文中で明示する。
  rationale: 文脈上、この言葉はイエス自身の死を指し、続く節では従う者にも関係する。しかし本節そのものは比喩を提示するにとどまるため、その神学的適用を本文へ織り込まず、文脈が持つ含意と緊張を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、イエスの厳粛な宣言にふさわしい重みを保った。文体は丁寧体で統一し、「まことに、まことに」の反復によってヨハネ特有の導入句を保持した。
