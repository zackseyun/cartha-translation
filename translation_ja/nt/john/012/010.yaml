  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: ja
  text: そこで祭司長たちは、ラザロも殺すことに決めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこで祭司長たちは、ラザロも殺そうと相談した。」
    reason: ἐβουλεύσαντο は、協議することに重点を置いて「相談した」とも訳せるが、この文脈では協議を経た決定を表すと理解できる。
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: 相談した
  rationale: 中動態の動詞は、関係者が協議して方針を定めようとしたことを表す。「相談した」は現代日本語として自然で、 deliberation の要素を保つ。文脈上は決定・計画の含みもあるため脚注で別訳を示す。
- source_word: δὲ
  choice: そこで
  rationale: 前節を受けた物語の展開と因果的なつながりを自然に示す。強い逆接は原文に必須ではない。
- source_word: οἱ ἀρχιερεῖς
  choice: 祭司長たち
  rationale: 福音書で祭司階層の指導者たちを指す標準的な訳語。複数形も明示する。
- source_word: ἵνα ... ἀποκτείνωσιν
  choice: 殺そうと
  rationale: βουλεύομαι に続く目的・企図の内容を、日本語の意向形と引用助詞で簡潔に表す。司法的処刑を示す語は原文にないため「処刑する」とはしない。
- source_word: καὶ
  choice: も
  rationale: イエスに加えてラザロも対象になったという添加の意味を自然に示す。
- source_word: τὸν Λάζαρον
  choice: ラザロ
  rationale: 固有名詞を日本語の慣用表記で音写し、冠詞は訳出しない。
- source_word: ἀποκτείνωσιν
  choice: 殺す
  rationale: 語の直接的な意味を保つ。「殺害する」は硬く、「処刑する」は司法的含意を加え、「暗殺する」は手段を限定するため避ける。
theological_decisions:
- issue: 祭司長たちのラザロに対する意図の描写
  choice: ラザロも殺すことを協議したと直接的に訳す
  alternative: 「陰謀を企てた」「共謀した」など、謀略性を強めて訳す
  rationale: 原文は熟慮・協議と殺害の意図を示すが、陰謀を専門的に表す語は用いていない。敵意の深刻さを保ちつつ、動機や手段を補わない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「相談した」は日常的すぎない範囲で協議の意味を伝え、脚注で「決めた」という結果重視の理解を保存した。
