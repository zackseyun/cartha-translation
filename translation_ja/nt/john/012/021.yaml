id: JHN.12.21
reference: John 12:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: ja
  text: そこで、この人たちは、ガリラヤのベツサイダ出身のフィリポのところに来て、こう頼んでいた。「先生[a]、私たちはイエスを見たいのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主よ」。ギリシャ語の呼びかけ κύριε は「主よ」を意味するほか、人に対する丁重な呼びかけとしても用いられる。
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι οὖν
  choice: そこで、この人たちは
  rationale: οὗτοιを「この人たち」として前節のギリシャ人たちとのつながりを保ち、οὖνは物語の展開を自然に示す「そこで」とした。
- source_word: προσῆλθον Φιλίππῳ
  choice: フィリポのところに来て
  rationale: προσέρχομαιの「近づく、もとへ行く」という意味を、現代日本語の自然な叙述で表した。
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: ガリラヤのベツサイダ出身の
  rationale: 冠詞付き前置詞句がフィリポを特定していることを、簡潔な連体修飾で表した。
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: こう頼んでいた
  rationale: ἠρώτωνの未完了過去が示す継続的な依頼の様相を「頼んでいた」で保ち、λέγοντεςは引用を導く「こう」によって自然に統合した。
- source_word: Κύριε
  choice: 先生
  rationale: ここではフィリポ本人への丁重な呼びかけであり、神学的称号としての「主」よりも、日本語で敬意を示す呼称「先生」が文脈に適する。語義上の別訳は脚注に残した。
- source_word: θέλομεν τὸν Ἰησοῦν ἰδεῖν
  choice: 私たちはイエスを見たいのです
  rationale: θέλωの願望を「見たい」、ἰδεῖνの基本義を「見る」とし、面会の意味に限定せず原文の表現を保った。「のです」によって丁重な依頼として自然にした。
theological_decisions:
- issue: フィリポへの呼びかけ Κύριε の訳
  choice: 先生
  alternative: 主よ
  rationale: κύριεは「主よ」とも訳せるが、この箇所では話し相手がフィリポであるため、敬称として理解するのが文脈上自然である。キリスト論的な称号であるかのように読ませない一方、原語の幅は脚注で明示した。
- issue: ἰδεῖν が意味する願いの範囲
  choice: 見たい
  alternative: お会いしたい
  rationale: 文脈上は面会を求めている可能性が高いが、原語は単に「見る」とも取れるため、本文では曖昧さを狭めない表現を採用した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、引用部分には丁重さを持たせた。地名と人名は一般的な聖書表記を用い、ἰδεῖνの語義的な曖昧さを本文に残した。
