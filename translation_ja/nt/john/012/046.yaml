source:
  edition: SBLGNT
  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: ja
  text: わたしは、光として[a]世に来た。わたしを信じる者がだれも[b]闇の中にとどまらないようにするためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一つの光として」。ギリシア語の「光」には冠詞がなく、「光として」とも「一つの光として」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「わたしを信じる者は誰でも」。
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: 光として
  rationale: 冠詞のない φῶς を性質・役割を表す語として受け取り、ヨハネ文書に一貫する「光」の比喩を説明的に言い換えず保持した。日本語には冠詞の区別がないため、「一つの光」とはしなかった。
- source_word: εἰς τὸν κόσμον
  choice: 世に
  rationale: εἰς の方向性と、κόσμος が表す人間世界への到来を、自然で簡潔な日本語で表した。
- source_word: ἐλήλυθα
  choice: 来た
  rationale: ギリシア語完了形は、到来という出来事とその結果が現在に及ぶことを示す。日本語では文脈上その含みを持ちうる自然な完了表現「来た」とした。
- source_word: ἵνα
  choice: それは〜ためである
  rationale: 目的を明示する接続表現として訳し、文の論理関係を明瞭にした。
- source_word: πᾶς ὁ πιστεύων
  choice: わたしを信じる者が誰一人として
  rationale: 信じる者全体を例外なく指す表現を、後続する否定と自然に結び付けた。継続的・一般的な参与者を表す現在分詞は「信じる者」とした。
- source_word: πιστεύων εἰς ἐμέ
  choice: わたしを信じる
  rationale: εἰς を伴う πιστεύω が表す、イエスに向けられた人格的信頼を、日本語聖書語としても一般語としても明瞭な表現で訳した。
- source_word: ἐν τῇ σκοτίᾳ
  choice: 闇の中に
  rationale: 定冠詞を伴う σκοτία を、ヨハネ文書で認識可能な霊的・道徳的領域として描く比喩を保った。
- source_word: μὴ μείνῃ
  choice: とどまることのない
  rationale: ἵνα に続く否定のアオリスト接続法が示す目的を表し、闇の領域に居続ける意味を「とどまる」で保持した。
theological_decisions:
- issue: ヨハネ文書の光の比喩におけるキリスト論的自己提示
  choice: 「光として世に来た」
  alternative: 「世を照らすために来た」または「一つの光として世に来た」
  rationale: イエス自身を光として示す原文の比喩を保ち、その働きだけを述べる意訳や、ギリシア語の無冠詞形から不定性を過度に読み込む訳を避けた。
- issue: πᾶς ὁ πιστεύων の範囲
  choice: 「わたしを信じる者が誰一人として」
  alternative: 「わたしを信じる者は誰でも」
  rationale: 信じる者全体を例外なく含む原文の範囲を示しつつ、信仰の成立過程に関する特定の教派的立場は付加しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、イエスの宣言にふさわしい簡潔で格調ある文体とした。「世」「闇」「とどまる」はヨハネ文書の反復される主題語として保持した。
