id: JHN.12.19
reference: John 12:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: ja
  text: そこで、ファリサイ派の人々は互いに言った。「分かるだろう。あなたがたは何の成果も上げていない。見ろ、世[a]は彼の後について行ってしまった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「皆が彼について行ってしまった」とも訳せる。原文は「世」で、ここでは誇張を込めた表現と考えられる。
    reason: κόσμοςの字義を保ちつつ、この文脈での修辞的な意味と訳の可能性を示すため。
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた帰結的な展開を、現代日本語で自然に示す。
- source_word: οἱ Φαρισαῖοι
  choice: ファリサイ派の人々
  rationale: 宗教的集団を指す名称として、一般読者にも分かりやすい表現を用いた。
- source_word: πρὸς ἑαυτούς
  choice: 互いに
  rationale: ここでは集団内で言い交わす相互的な意味であり、「自分たちに」より自然で明確である。
- source_word: Θεωρεῖτε ὅτι
  choice: 見てのとおり
  rationale: 現在形複数の認識を促す修辞的な言い方を、命令に限定せず、苛立ちを含む自然な日本語にした。
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: あなたがたは何をしても無駄だ
  rationale: 二重の否定が表す、彼らの働きが何の成果も生んでいないという実際的な徒労感を明瞭に伝える。
- source_word: ἴδε
  choice: 見なさい
  rationale: 注意を強く引く間投詞の働きを、明瞭な現代日本語で保った。
- source_word: κόσμος
  choice: 世
  rationale: 修辞的な誇張を「皆」と解釈して本文に織り込まず、ヨハネ文書に特徴的な語の響きも保った。
- source_word: ὀπίσω αὐτοῦ ἀπῆλθεν
  choice: 彼について行ってしまった
  rationale: 誰かの後を追い従うという句の意味と、すでに生じて今も問題となっている結果への話者の焦りを自然に表した。
theological_decisions:
- issue: κόσμοςが指す範囲
  choice: 本文では「世」を保ち、誇張表現として提示する。
  alternative: 「皆」または「群衆全体」と訳す。
  rationale: ファリサイ派の人々は苛立ちの中で誇張している。語義を狭めずに原文の表現とヨハネ的な響きを残すことで、全人類が文字どおり従ったという教理的断定も避けられる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、直接話法の苛立ちと誇張を保った。「世」は日常会話よりやや格調があるが、原文の語彙とヨハネ福音書内の響きを伝えるため適切である。
