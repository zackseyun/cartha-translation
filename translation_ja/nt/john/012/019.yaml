  naturalness: 全体として明瞭な現代標準日本語であるが、同じ発話内で「見てのとおり」と「見なさい」が続くため、やや訳文調で不自然に響く。「分かるだろう」と「見ろ」の組み合わせは、苛立った相互の発話として自然で、二つのギリシア語の機能差も保てる。
  terminology: 「ファリサイ派の人々」「世」「彼」は適切である。「世」はヨハネ文書で重要な語であり、本文で「皆」や「群衆」と狭めない方針は支持できる。
