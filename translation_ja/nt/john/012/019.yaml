  to: そこで、ファリサイ派の人々は互いに言った。「分かるだろう。あなたがたは何の成果も上げていない。見ろ、世[a]は彼の後について行ってしまった。」
  rationale: 原文の現在形が示す目前の徒労を「何の成果も上げていない」とし、「何をしても」という一般化を避けた。θεωρεῖτεとἴδεの異なる修辞機能は、「分かるだろう」と「見ろ」によって自然な現代日本語で区別した。「世」と注は維持し、誇張の範囲を本文で解釈的に限定していない。
