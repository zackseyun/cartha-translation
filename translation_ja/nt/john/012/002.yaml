source:
  edition: SBLGNT
  text: ἐποίησαν οὖν αὐτῷ δεῖπνον ἐκεῖ, καὶ ἡ Μάρθα διηκόνει, ὁ δὲ Λάζαρος εἷς ἦν ⸀ἐκ τῶν ἀνακειμένων σὺν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/002.yaml
  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: ja
  text: そこで人々は、イエスのために夕食を用意した。マルタは給仕をしており、ラザロはイエスと一緒に食卓で身を横たえていた人々[a]の一人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼と一緒に身を横たえていた者たちの一人」。当時、改まった食事では、身を横たえて食べるのが慣習だった。
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν
  choice: 用意した
  rationale: ποιέωがδεῖπνονを目的語に取る場合、食事を作る、または整えることを表す。「用意した」は主催者を特定せず、自然な現代日本語で意味を伝える。
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受けた物語の展開と緩やかな帰結を示す。「そこで」は、この接続関係を自然に表す。
- source_word: αὐτῷ
  choice: イエスのために
  rationale: 与格は、この夕食がイエスのために用意されたことを示す。日本語では文脈上の指示対象を明示するほうが分かりやすい。
- source_word: δεῖπνον
  choice: 夕食
  rationale: δεῖπνονは一日の主要な食事、通常は夕刻の食事を指す。「宴会」では規模を過大に示しうるため、「夕食」とした。
- source_word: ἐκεῖ
  choice: そこで
  rationale: 場所を表し、文脈上はベタニアを指す。接続語οὖνと合わせた「そこで」により、場所と物語の展開の双方を簡潔に表した。
- source_word: διηκόνει
  choice: 給仕をしており
  rationale: 食事の場で仕えていたことを表す。未完了過去の継続的な様相を「しており」で反映し、宗教的な響きの強い「奉仕していた」は避けた。
- source_word: δὲ
  choice: （文の並置による緩やかな対照）
  rationale: マルタが給仕していたことと、ラザロが食卓にいたことを緩やかに対照させる。日本語で「しかし」とすると対立を強めすぎるため、文を並置して表した。
- source_word: εἷς ἦν ἐκ
  choice: 人々の一人であった
  rationale: ラザロが同席者の集団に属する一人だったことを、原文の構造に沿って表す。
- source_word: ἀνακειμένων
  choice: 食卓で横になっていた
  rationale: 当時の改まった食事で横になって食べる姿勢を指す。文化的に不慣れな表現だが、原文の具体性を残し、脚注で説明する。
- source_word: σὺν αὐτῷ
  choice: イエスと一緒に
  rationale: 単純な同伴を表す。指示対象が明確になるよう、代名詞を「イエス」とした。
theological_decisions: []
translation_notes:
  register: 明快で品位のある現代標準日本語を用いた。「給仕」は食事の場面に即した語であり、「食卓で横になっていた」は現代日本語ではやや異文化的に響くものの、原文が示す姿勢を保つため採用し、脚注で補足した。
