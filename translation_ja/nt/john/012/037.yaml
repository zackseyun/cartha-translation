base_translation:
  language: en
  yaml_path: translation/nt/john/012/037.yaml
  text: Although he had done so many signs before them[a], they did not believe in him[b],
translation:
  language: ja
  text: イエスが彼らの目の前でこれほど多くのしるしを行ったにもかかわらず、彼らはイエスを信じなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語の動詞は未完了過去であり、「信じ続けなかった」または「繰り返し信じなかった」という継続的・反復的な不信を示唆し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: これほど多くの
  rationale: しるしの数の多さを強調する表現として、現代日本語で自然に訳した。
- source_word: δὲ
  choice: しかし
  rationale: 前後の対照を明示する。ただし、譲歩表現「のに」と意味が重なるため、文脈上の転換を保つ目的で用いた。
- source_word: σημεῖα
  choice: しるし
  rationale: ヨハネ福音書で、行為そのものを超えてイエスを指し示す意味を持つため、「奇跡」ではなく「しるし」とした。
- source_word: πεποιηκότος
  choice: 行われた
  rationale: 完了分詞が示す先行する行為と、その結果がなお関係していることを、譲歩節の中で自然に表した。敬語はイエスに対する現代日本語の聖書文体として用いている。
- source_word: ἔμπροσθεν αὐτῶν
  choice: 彼らの目の前で
  rationale: しるしが彼らの見ているところで公然と行われたことを明確にした。
- source_word: οὐκ ἐπίστευον
  choice: 信じようとはしなかった
  rationale: 未完了過去が示し得る継続的な不信を自然な日本語で表した。ただし意志的拒絶をやや強く響かせる可能性があるため、脚注でより中立的な訳を示した。
- source_word: εἰς αὐτόν
  choice: イエスを
  rationale: 日本語では「彼を信じる」が自然だが、指示対象を明確にするため固有名を補い、πιστεύω εἰς の人格的な信頼を表した。
theological_decisions:
- issue: 未完了過去 οὐκ ἐπίστευον に表れる不信の継続性
  choice: 彼らはイエスを信じようとはしなかった
  alternative: 彼らはイエスを信じなかった
  rationale: 多くの公然のしるしにもかかわらず不信が続いたという文脈を示す一方、ギリシア語が必ずしも明示しない意志的拒絶を断定しすぎないよう、脚注に中立的な代案を掲げた。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「しるし」はヨハネ特有の神学的含意を保つ。主節の継続的な不信を自然に表すため意訳を採ったが、解釈の幅は脚注で保持した。
