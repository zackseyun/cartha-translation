  text: Τῇ ἐπαύριον ⸀ὁ ὄχλος πολὺς ὁ ἐλθὼν εἰς τὴν ἑορτήν, ἀκούσαντες ὅτι ἔρχεται ⸁ὁ Ἰησοῦς εἰς Ἱεροσόλυμα,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/012.yaml
  text: The next day[a], the large crowd that had come to the feast, when they heard that Jesus was coming to Jerusalem[b],
translation:
  language: ja
  text: その翌日、祭りに来ていた大勢の群衆は、イエスがエルサレムに来られると聞いて、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: その翌日
  rationale: 時間を示す与格的表現を、物語の順序が明確になる自然な現代日本語で表した。
- source_word: ὁ ὄχλος πολὺς
  choice: 大勢の群衆
  rationale: ὄχλοςの「群衆」とπολύςが示す人数の多さを、明瞭で自然な表現にした。
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: 祭りに来ていた
  rationale: 冠詞付き分詞が「群衆」を限定しているため連体修飾で表し、主たる場面より前に来ていたことを「来ていた」で示した。ἑορτήは宗教的祝祭を指す自然で広い語として「祭り」とした。
- source_word: ἀκούσαντες
  choice: 聞いて
  rationale: アオリスト分詞の時間的・契機的な働きを自然な接続形で表した。ギリシア語では集合名詞「群衆」が文法上は単数でも、分詞はその構成員を意識して複数形になっている。
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: イエスが来られると
  rationale: ἔρχεταιの歴史的現在を、日本語の引用内容の現在形「来られる」で保った。敬意を表す「来られる」は現代の聖書文体として自然であり、動作の受け身を意味しない。
- source_word: εἰς Ἱεροσόλυμα
  choice: エルサレムに
  rationale: 移動の到達先を示すεἰςを、日本語で最も自然な助詞「に」によって表した。
theological_decisions: []
