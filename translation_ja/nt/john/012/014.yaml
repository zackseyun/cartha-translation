  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: ja
  text: そしてイエスは、ろばの子[a]を見つけ、その上に座られた。次のように書いてある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「小さなろば」。ギリシア語の「オナリオン」はろばを指し、若いろばを指すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρὼν
  choice: 見つけ
  rationale: アオリスト能動分詞で、主動詞「座られた」に先立つ行為を示す。日本語では「見つけて」に相当する連用形で、動作の順序を自然に表した。
- source_word: δὲ
  choice: そして
  rationale: 強い対立ではなく、物語を進める穏やかな接続を表すため、「そして」とした。
- source_word: ὀνάριον
  choice: ろばの子
  rationale: ろばを指す指小形で、若いろばを指すことが多い。現代日本語で明確かつ自然な「ろばの子」とし、語が必ずしも年齢だけを厳密に指定しない点は脚注に示した。
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: その上に座られた
  rationale: 原文の「それの上に座った」を直接的に保ち、「乗られた」のように意味を広げすぎない表現とした。イエスへの敬意を示す自然な日本語として尊敬表現を用いた。
- source_word: καθώς ἐστιν γεγραμμένον
  choice: 次のように書かれているとおりである
  rationale: καθώςの対応・比較の意味と、聖書引用を導入する定型表現を保った。後続の引用へ自然につながるよう「次のように」を補った。
- source_word: ὁ Ἰησοῦς
  choice: イエス
  rationale: ギリシア語の物語文では固有名詞に冠詞が付くが、日本語では訳出しないのが自然である。
theological_decisions:
- issue: イエスの行為と続く聖書引用との関係
  choice: イエスがろばの子を見つけて座った行為が、書かれていることに対応すると述べるにとどめた。
  alternative: 預言を意図的に成就するためにこの行為をした、と明示する訳。
  rationale: 本文は行為を記した後に引用定型句を置くが、イエスの動機を明言してはいない。預言との対応を保ちつつ、意図について本文以上に断定しないようにした。
translation_notes:
  register: 明瞭で現代的ながら、聖書引用へ移る場面にふさわしい品位を保った。「座られた」は原文の具体的な動作を保ちつつ、通常の日本語聖書で自然な敬意を示す。脚注記号[a]は該当語「ろばの子」の直後に置いた。
