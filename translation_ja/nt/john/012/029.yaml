  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: ja
  text: そこで、そこに立っていて、その声を聞いた群衆は、「雷が鳴ったのだ」と言っていた。ほかの人々は、「天使が彼に語りかけたのだ」と言っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の天からの声を受けた物語の展開を、自然な現代日本語で示す。
- source_word: ὁ ὄχλος ὁ ἑστὼς
  choice: そこに立っていて…群衆
  rationale: 完了分詞が表す、その場に立っている群衆の状態を保つ。
- source_word: ἀκούσας
  choice: その声を聞いた
  rationale: 主動詞に先立つ知覚を示す。目的語は文脈上、直前の声を指すため「その声」と補った。
- source_word: ἔλεγεν
  choice: 言っていた
  rationale: 未完了過去の継続的な発言を反映する。
- source_word: βροντὴν γεγονέναι
  choice: 雷が鳴ったのだ
  rationale: 字義的には雷が生じたことを表すが、日本語では「雷が鳴った」が正確で自然である。
- source_word: ἄλλοι
  choice: ほかの人々
  rationale: 群衆の中の別の一群との対比を明確にする。
- source_word: Ἄγγελος
  choice: 御使い
  rationale: この文脈では天的存在を指すため、日本語聖書で広く理解される語を用いる。
- source_word: αὐτῷ
  choice: この方に
  rationale: 指示対象であるイエスを明示しつつ、群衆の発言として自然な敬意を表す。
- source_word: λελάληκεν
  choice: 語りかけたのだ
  rationale: 完了した発話とその現時点での意味を「のだ」で自然に示し、与格に対する方向性も表す。
theological_decisions:
- issue: ἄγγελος が指す存在
  choice: 御使い
  alternative: 使者
  rationale: 直前の天からの声についての群衆の解釈であり、ここでは人間の使者より天的存在が自然である。
- issue: αὐτῷ の指示対象
  choice: この方に
  alternative: 彼に
  rationale: 指示対象はイエスだが、名前を本文に追加せず、群衆の発言として自然に示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。ギリシア語の時制・相の違いを可能な範囲で反映しながら、不自然な直訳は避けた。
