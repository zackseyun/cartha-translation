  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: ja
  text: だれかがわたしの言葉を聞き、それを守らないなら[a]、わたしはその人を裁かない[b]。わたしが来たのは、世を裁くためではなく、世を救うためだからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「守らない」の代わりに「信じない」と読む写本もある。
    reason: textual_variant
  - marker: b
    text: 「有罪に定めない」とも訳せる。ギリシア語の動詞は「裁く」を基本義とし、文脈によって不利な判決を下す意味にもなる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: だれかが～なら
  rationale: 不定の条件を自然な現代日本語で表し、特定の人に限定されない一般的な意味を保つ。
- source_word: ἀκούσῃ
  choice: 聞いても
  rationale: 基本義である「聞く」を保つ。「聞き従う」のような応答や服従の意味は加えない。後続の否定条件とのつながりを自然にするため「聞いても」とした。
- source_word: τῶν ῥημάτων
  choice: わたしの言葉
  rationale: イエスが語った言葉を指す。現代日本語として自然であり、「ことばを聞く」というヨハネ文書の表現にも適する。
- source_word: φυλάξῃ
  choice: それを守らない
  rationale: φυλάσσωには、守る、保つ、従って実行するという幅がある。「守る」はその広がりを保ち、「従わない」ほど意味を限定しない。
- source_word: οὐ κρίνω αὐτόν
  choice: わたしはその人を裁かない
  rationale: κρίνωを後続の同じ動詞と一貫して「裁く」と訳し、「有罪に定める」と限定しない。αὐτόνは日本語で自然かつ包括的な「その人」とした。
- source_word: οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον
  choice: わたしが来たのは、世を裁くためではなく
  rationale: ἵναの目的を「～ため」として明示し、イエスの来臨の目的に関する対比を自然に表す。κόσμοςはヨハネ福音書で定着した「世」とした。
- source_word: ἀλλ’ ἵνα σώσω τὸν κόσμον
  choice: 世を救うためだからである
  rationale: ἀλλάによる目的の対比を明瞭にし、σῴζωの中心的な意味を「救う」で保つ。γάρの理由説明は文末の「からである」で表した。
theological_decisions:
- issue: 「わたしはその人を裁かない」とヨハネ福音書の他の裁きの言葉との緊張関係
  choice: κρίνωを一貫して「裁く」と訳し、時期や裁きの種類を本文で補わない。
  alternative: 「有罪に定めない」または「今は裁かない」と意訳する。
  rationale: 本文は、イエスが来た目的を裁きではなく救いとして述べている。「今は」などを補わず、周辺の裁きに関する発言との神学的緊張をそのまま残す。
- issue: 男性単数代名詞 αὐτόν の一般的用法
  choice: 「その人」と訳す。
  alternative: 「彼を」と訳す。
  rationale: αὐτόνは不定代名詞 τιςを受ける文法上の男性単数で、内容上は性別を問わない。「その人」は単数性と一般性を保ちつつ、現代日本語で誤解が少ない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「だれか」「その人」により一般的な対象を自然に示し、「裁く」「救う」の対照を簡潔に保った。
