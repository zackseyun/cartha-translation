source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: ja
  text: そこで、イエスは言った[a]。「彼女を放っておきなさい[b]。彼女がわたしの葬りの日のために、それを取っておけるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼女を放っておきなさい。彼女はわたしの葬りの日のために、それを取っておいたのです。」この節を、彼女が今後することではなく、すでにしたことの説明と理解することもできる。
    reason: alternative_reading
  - marker: b
    text: 別訳「彼女を放っておきなさい。彼女がわたしの葬りの日まで、それを取っておけるように。」ギリシア語の構文は、時間的な終点をより明示する意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前のユダの発言を受けた物語上の展開と応答の流れを、自然な現代日本語で示す。
- source_word: Ἄφες αὐτήν
  choice: この人を放っておきなさい
  rationale: ἀφίημιのアオリスト命令形を、彼女への干渉をやめるよう命じる文脈的な意味で訳した。「彼女」よりも、目の前にいる女性を指す自然な発話として「この人」を用いた。
- source_word: ἵνα
  choice: 〜ために
  rationale: 目的または意図された結果を表す節の関係を保つ。日本語では後続する「取っておかせなさい」と組み合わせて自然に表現した。
- source_word: εἰς τὴν ἡμέραν
  choice: その日のために
  rationale: 将来の特定の機会に向けて取っておく意味を示し、「その日まで」と時間的な終点に限定しすぎない訳とした。本文では「わたしの葬りの日のために」と一続きにした。
- source_word: ἐνταφιασμοῦ
  choice: 葬り
  rationale: 埋葬を意味する語を、明瞭でありながら尊厳のある日本語で表した。「埋葬」より発話として自然で、「葬られるための準備」に意味を限定しない。
- source_word: τηρήσῃ
  choice: 取っておく
  rationale: 特定の日のために保持し、残しておく意味を自然な現代日本語で表した。ἵνα節の接続法は、命令文との関係を「取っておかせなさい」として示した。
- source_word: αὐτό
  choice: それ
  rationale: 中性代名詞を代名詞のまま訳し、原文にない「香油」を本文へ補わないようにした。
theological_decisions:
- issue: 香油をイエスの死と葬りに結びつける発言の時制的・統語的解釈
  choice: 彼女に、イエスの葬りの日のためにそれを取っておかせるという、前方を向いた目的表現として訳す。
  alternative: 「彼女はわたしの葬りの日のために、それを取っておいた」と、すでになされた行為を述べる表現として訳す。
  rationale: ギリシア語のἌφες…ἵνα…τηρήσῃは統語的に難しく、複数の理解が可能である。本文は命令と目的節の表面的な関係を保ちつつ、別の有力な理解を脚注に示して、イエスの迫る死との結びつきに関する真正な曖昧さを解消しないようにした。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、イエスの発話には簡潔で dignified な調子を保った。「葬り」は一般読者に理解でき、かつ場面にふさわしい語として選んだ。原文の難しい目的節を過度に意訳せず、主要な別解は脚注に残した。
