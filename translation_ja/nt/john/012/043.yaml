  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: ja
  text: 彼らは、神からの栄誉よりも、人からの栄誉を愛したのである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人の栄誉」「神の栄誉」とも訳せる。ギリシア語の「栄誉」は「栄光」「称賛」「評価」とも訳し得る。
    reason: 属格を出所ではなく帰属として理解する可能性と、δόξαの語義の幅を示すため。
lexical_decisions:
- source_word: ἠγάπησαν
  choice: 愛した
  rationale: アオリスト能動直説法三人称複数。単に「好んだ」「選んだ」とせず、ἀγαπάωの強い意志的愛着を保つ。比較の意味は μᾶλλον ἤπερ が担う。
- source_word: γὰρ
  choice: のである
  rationale: 直前の記述の理由を示す説明的接続。日本語では文末の「のである」によって、自然に因果・説明関係を表した。
- source_word: δόξαν
  choice: 栄誉
  rationale: δόξα は栄光、誉れ、称賛、評価を含み得る。ここでは人または神から与えられる誉れという文脈に合わせて「栄誉」とし、同じ語を反復して原文の対句を保った。
- source_word: τῶν ἀνθρώπων
  choice: 人からの
  rationale: ἄνθρωποι はここで人間一般を指す。属格は栄誉の源を表すものとして自然に理解できるため、性別を限定しない現代日本語の「人からの」とした。
- source_word: μᾶλλον ἤπερ
  choice: よりも
  rationale: 二つの対象の比較と選好を簡潔かつ自然に示す。
- source_word: τοῦ θεοῦ
  choice: 神からの
  rationale: 人からの栄誉との平行を保ち、属格を栄誉の源として自然な日本語にした。ただし所有・帰属の含みもあり得るため脚注で示す。
theological_decisions:
- issue: 人と神の対比における δόξα の意味
  choice: 栄誉
  alternative: 栄光／称賛／評価
  rationale: ヨハネ文書における「栄光」の響きを失わない範囲で、この文脈の人や神から受ける誉れを自然に表す。「評価」「称賛」だけに狭めず、原語の幅を残した。
- issue: 属格 τῶν ἀνθρώπων／τοῦ θεοῦ の関係
  choice: 人からの／神からの
  alternative: 人の／神の
  rationale: 文脈上は誉れの源を示す理解が自然だが、原文の属格自体には帰属の余地もある。その曖昧さを脚注で補った。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「のである」で前節への理由説明を示し、「人からの／神からの」を対称に配置して原文の対比を保った。
