id: JHN.12.42
reference: John 12:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅμως μέντοι καὶ ἐκ τῶν ἀρχόντων πολλοὶ ἐπίστευσαν εἰς αὐτόν, ἀλλὰ διὰ τοὺς Φαρισαίους οὐχ ὡμολόγουν ἵνα μὴ ἀποσυνάγωγοι γένωνται,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: ja
  text: それにもかかわらず、指導者たちの中にも、彼を信じた者が多くいた。しかし、ファリサイ派の人々のゆえに、彼らはそれを公に告白していなかった。会堂から締め出されることがないようにである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「会堂から追放されることがないように」。ここでのギリシア語は、会堂を中心とする共同体から排除されることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: しかし、それでも
  rationale: 二つの小辞が重なって強い譲歩と対比を示すため、現代日本語でその強調を自然に表した。
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: 指導者たちの中にも彼を信じた者が多くいた
  rationale: ἐκ＋属格による集団内の所属を「中にも」で表し、ἄρχοντεςは文脈上、一般的な支配者ではなく宗教社会の指導的立場の人々を指すとした。
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: 彼を信じた
  rationale: ヨハネ文書に特徴的な、イエスに向けられた人格的信頼を、自然で過不足のない日本語で表した。
- source_word: διὰ τοὺς Φαρισαίους
  choice: ファリサイ派の人々のために
  rationale: διά＋対格の原因を直訳寄りに示した。恐れは文脈から推測できるが、この句自体には明示されていないので訳文に加えなかった。
- source_word: οὐχ ὡμολόγουν
  choice: そのことを公には言い表していなかった
  rationale: 目的語が明示されていないため「そのこと」とし、直前の信仰を受ける曖昧さを保った。未完了過去の継続的・反復的な含みを「言い表していなかった」で示した。「公には」は、この文脈での告白・公言の意味を自然に伝える。
- source_word: ἵνα μὴ
  choice: ないためであった
  rationale: 望ましくない結果を避ける目的を明確な現代日本語で表した。
- source_word: ἀποσυνάγωγοι γένωνται
  choice: 会堂から締め出されない
  rationale: ἀποσυνάγωγοςが示す会堂共同体からの排除を、過度に法的な「除名」に限定せず、一般読者に分かりやすく表した。γένωνταιの結果的意味も文全体の目的表現に含めた。
theological_decisions:
- issue: 指導者たちのイエスへの信仰の性質
  choice: ἐπίστευσανをそのまま「彼を信じた」と訳す
  alternative: 「信じると公言したにすぎない」または「真に救われる信仰を持った」と解釈を補う
  rationale: 本文は彼らが信じたと述べる一方、公に言い表さなかったとも述べる。その信仰の神学的な真偽や救いとの関係を訳文で決着させず、本文の緊張を保った。
- issue: ὡμολόγουνの暗黙の目的語
  choice: 「そのこと」として、信仰を公に言い表すことを示す
  alternative: 「彼を公に認めていなかった」としてイエスを明示的な目的語にする
  rationale: ギリシア語に目的語は明示されていないため、イエス本人を目的語として固定せず、直前の「彼を信じた」という事実を自然に受ける表現とした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい端正さを保った。「公には」は明示的な目的語を補わずに告白の社会的性格を伝えるために用い、「締め出す」は制度的な除名だけに意味を狭めない語として選んだ。
