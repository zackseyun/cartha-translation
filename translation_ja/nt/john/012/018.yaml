source:
  edition: SBLGNT
  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: ja
  text: このため、群衆もイエスを迎えに出た[a]。イエスがこのしるし[b]を行ったと聞いたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「群衆もイエスに会いに行った」。ギリシア語の動詞には、相手を迎えるために出向く意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「しるし」は、イエスが何者であり、どのような使命を持つかを指し示す行為を表す、ヨハネ福音書に特徴的な語。別訳「奇跡」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: このため
  rationale: 直前の出来事を群衆の行動の理由として示す因果関係を、簡潔で自然な日本語で表す。
- source_word: καὶ
  choice: も
  rationale: 先行文脈に加えて群衆も行動したという添加の意味を保持する。
- source_word: ὑπήντησεν αὐτῷ
  choice: イエスを迎えに出た
  rationale: 動いて会いに行くというὑπαντάωの方向性を自然に表す。代名詞の指示対象は文脈上イエスであり、日本語では固有名を補うと明瞭になる。
- source_word: ὁ ὄχλος
  choice: 群衆
  rationale: 集まった人々を指す一般的で現代的な訳語。
- source_word: ὅτι ἤκουσαν
  choice: 聞いたからである
  rationale: ὅτιの因果的用法を明示し、アオリストを自然な過去形で表す。
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: イエスがこのしるしを行った
  rationale: 完了不定詞が示す完了した行為とその現時点での意味を文脈上自然に表し、τοῦτοとτὸ σημεῖονの結び付きを「このしるし」とする。
- source_word: τὸ σημεῖον
  choice: しるし
  rationale: ヨハネ福音書で、驚異そのものだけでなくイエスの正体と使命を指し示す行為を表す特徴的な語法を保持する。
theological_decisions:
- issue: ヨハネ福音書のσημεῖονの訳し方
  choice: しるし
  alternative: 奇跡
  rationale: 「奇跡」だけでは薄れうる啓示的・指示的な含意を保持しつつ、その意味を本文で過度に説明しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「迎えに出た」によって移動の含意を示し、「しるし」は平仮名表記として聖書文体になじませた。脚注記号は対応箇所と文末に配置した。
