    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: ところへ行って
  rationale: 移動の到達先が続く与格の人物であることを、自然な現代日本語で明示した。時制は歴史的現在として「行って」と現在形の叙述に保った。
- source_word: λέγει
  choice: 伝える
  rationale: 直前のギリシア人たちの願いをアンデレに取り次ぐ文脈に合い、単なる発話以上の伝達を自然に表す。
- source_word: τῷ Ἀνδρέᾳ
  choice: アンデレのところへ／アンデレに
  rationale: 与格が移動の到達先と伝達の相手を示すため、日本語ではそれぞれの動詞に応じて自然に表現した。人名は慣用的な音写を用いた。
- source_word: ἔρχεται Ἀνδρέας καὶ Φίλιππος
  choice: アンデレとフィリポはイエスのところへ行って
  rationale: 後続の複数動詞と合わせ、二人が共にイエスへ向かう動作として訳した。ギリシア語の歴史的現在も維持した。
- source_word: λέγουσιν
  choice: 伝える
  rationale: 複数主語による伝達を表し、前半との語彙的な並行を保った。日本語では複数形を形態的に示す必要がない。
- source_word: τῷ Ἰησοῦ
  choice: イエスのところへ／イエスに
  rationale: 与格が移動先および伝達相手であることを自然な日本語の構文で示した。
- source_word: καί
  choice: そして／と／て
  rationale: 等位・連続を、文脈に応じて日本語の接続表現および並列助詞で表した。原文にない因果関係は加えていない。
- source_word: ὁ Φίλιππος
  choice: フィリポ
  rationale: 定冠詞は固有名詞に伴う通常の用法であり、日本語には訳出しない。人名は日本語聖書で広く通用する形を用いた。
