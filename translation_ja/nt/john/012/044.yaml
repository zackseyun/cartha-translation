id: JHN.12.44
reference: John 12:44
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: ja
  text: しかし、イエスは声を上げて言われた。「わたしを信じる者[a]は、わたしを信じるのではなく[b]、わたしを遣わした方を信じるのである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしを信じる人はだれでも」。
    reason: 冠詞付き分詞ὁ πιστεύωνの一般的な意味を別の自然な日本語で示すため。
  - marker: b
    text: これは、イエスが信仰の正当な対象であることを否定するものではない。イエスを信じることは、イエスを遣わした父を信じることと切り離せない、という意味である。
    reason: 原文の強い否定的表現を保ったまま、ヨハネ福音書の文脈に沿った関係を示し、誤読を避けるため。
lexical_decisions:
- source_word: ἔκραξεν καὶ εἶπεν
  choice: 声を上げて言われた
  rationale: κράζωの大声で公に告げる響きを「声を上げて」で保ち、続くεἶπενを自然で品位ある日本語にした。
- source_word: Ὁ πιστεύων
  choice: 信じる者
  rationale: 冠詞付き現在分詞の一般的・実質名詞的な働きを簡潔に表し、特定の一人ではなく一般に当てはまる発言であることを示す。
- source_word: πιστεύων / πιστεύει
  choice: 信じる
  rationale: ヨハネ文書におけるπιστεύω εἰςの定着した宗教的・人格的用法を表し、同じ動詞の反復も保持する。
- source_word: εἰς ἐμέ
  choice: わたしを
  rationale: πιστεύω εἰςは日本語では「～を信じる」が自然であり、信頼の向かう対象を明確に表す。
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: わたしを遣わした方を信じるのである
  rationale: ἀλλάの強い対比を「ではなく」で示し、分詞句の間接的な呼称を保って、本文中で「父」と明示しすぎないようにした。
- source_word: δὲ
  choice: しかし
  rationale: 直前の文脈からの移行と対照を表す接続語として、自然な「しかし」を選んだ。
theological_decisions:
- issue: 「わたしを信じるのではなく、わたしを遣わした方を信じる」が、イエスを信仰の対象から除外する表現と誤解され得ること
  choice: 原文の否定と対比をそのまま保ち、注で、イエスを信じることと遣わした方を信じることの不可分性を説明する。
  alternative: 「わたしだけを信じるのではなく」と本文に「だけ」を補う。
  rationale: ギリシア語本文には「だけ」に相当する語がなく、それを補えばヨハネ福音書が意図的に残す神学的緊張を解消してしまうため。
translation_notes:
  register: 現代の一般読者に分かる、簡潔で品位ある聖書文体。「方」は遣わした者への敬意と間接的な指示を自然に表し、「父」という解釈的明示は本文に加えていない。イエスの発話には「わたし」を用いた。
