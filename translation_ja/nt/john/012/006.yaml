source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: ja
  text: 彼がこう言ったのは、貧しい人々を気にかけていたからではなく、彼が盗人であり、金入れ[a]を預かっていて、そこに入れられるものを持ち去っていた[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「金箱」または伝統的には「金袋」とも訳せる。ギリシア語は、金銭を収める容器を指す。
    reason: lexical_alternative
  - marker: b
    text: 「運んでいた」とも訳し得る。この動詞は通常「運ぶ、担う」を意味するが、ここでは「盗人だった」という文脈から、自分のものとして持ち去ることを指すと考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: 彼がこう言ったのは
  rationale: δέを強い逆接として過剰に表さず、τοῦτοを自然な日本語の「こう」で受けた。後続の理由構文と結び付けている。
- source_word: οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: 貧しい人々を気にかけていたからではない
  rationale: οὐχ ὅτιによる動機の否定と、μέλειの個人的な関心を、明瞭な現代日本語で表した。
- source_word: ἀλλ’ ὅτι κλέπτης ἦν
  choice: 彼は盗人で
  rationale: κλέπτηςはひそかに盗む者を指すため、「強盗」ではなく「盗人」とした。ἀλλ’ ὅτιの真の理由は、文を分けたうえで末尾の「からである」によって明示した。
- source_word: τὸ γλωσσόκομον ἔχων
  choice: 金入れを預かり
  rationale: ἔχωνは単なる所持以上に、共同の金を収める容器を彼が手元で扱っていた状況を示す。「預かり」は管理下にあったことを自然に伝える。γλωσσόκομονの容器形状は本文で限定しない。
- source_word: τὰ βαλλόμενα
  choice: そこに入れられるもの
  rationale: 現在受動分詞の反復・一般的状況を反映し、目的先を「そこに」で明示した。文脈上は献金などの金銭を指すが、原文どおり「もの」とした。
- source_word: ἐβάσταζεν
  choice: 持ち去っていた
  rationale: 未完了過去の反復・継続性を「ていた」で示した。βαστάζωの基本的な「運ぶ」と、この文脈での横領・窃取の含意をともに保つ表現を選んだ。
theological_decisions:
- issue: ἐβάσταζενがユダの窃取をどこまで明示するか
  choice: 「持ち去っていた」と訳し、継続的な不正取得を文脈上明らかにする
  alternative: 「運んでいた」または「盗んでいた」
  rationale: 直前の「盗人」が不正取得を強く示す一方、動詞自体には「運ぶ、担う」の語義もある。「持ち去る」は告発の力を保ちつつ、「盗む」と語義を完全に固定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準語。原文の理由構文を日本語で読みやすい二文に分けたが、否定された動機と真の動機の対照は維持した。「盗人」はやや文語的ながら聖書本文に適した簡潔で通用性の高い語として採用した。
