id: JHN.12.1
reference: John 12:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: ja
  text: そこでイエスは、過越の祭りの六日前にベタニアへ来られた。そこには、イエスが死者の中からよみがえらせたラザロがいた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「死者たちの中から」とも直訳できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の文脈を受ける物語上のつながりを、現代日本語として自然に示す。強い論理的帰結を表す「それゆえ」ほど限定しない。
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: 過越の祭りの六日前に
  rationale: ギリシア語の時間表現を自然かつ明確な日本語にした。πάσχαはここでは既知のユダヤの祭りを指す。
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: ベタニアへ来られた
  rationale: 移動を表すἦλθενを「来られた」とし、イエスへの敬意を保ちながら、過度に古風にならない叙述とした。
- source_word: ὅπου ἦν Λάζαρος
  choice: そこには……ラザロがいた
  rationale: ἦνの単純な存在・所在の意味を保ち、「住んでいた」「滞在していた」など原文に明示されない情報を加えない。
- source_word: ἤγειρεν
  choice: よみがえらせた
  rationale: 死者に関する文脈でのἐγείρωの使役的意味を明確に表す。「起こした」よりも日本語で復活の出来事が自然に伝わる。
- source_word: ἐκ νεκρῶν
  choice: 死者の中から
  rationale: 前置詞ἐκと複数形νεκρῶνの像を比較的明瞭に保ち、ラザロが死者の領域から起こされたことを表す。
theological_decisions:
- issue: ラザロをよみがえらせた主体の明示
  choice: イエスが死者の中からよみがえらせた
  alternative: 彼が死者の中からよみがえらせた
  rationale: 節末で主語Ἰησοῦςが明示的に繰り返されているため、日本語でも「イエス」を保持し、行為者を明確にした。
- issue: ἐκ νεκρῶνの表現
  choice: 死者の中から
  alternative: 死から／死者のうちから
  rationale: 複数形νεκρῶνとἐκの字義的な空間像を保ちつつ、特定の復活論的体系を本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「来られた」はイエスに対する自然な敬意表現として用い、その他は簡潔にした。脚注標識は節末に置き、ἐκ νεκρῶνのより逐語的な形を示した。
