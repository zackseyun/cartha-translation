id: JHN.12.41
reference: John 12:41
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταῦτα εἶπεν Ἠσαΐας ⸀ὅτι εἶδεν τὴν δόξαν αὐτοῦ, καὶ ἐλάλησεν περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: ja
  text: イザヤがこれらのことを言ったのは、彼の栄光を見て、彼について語ったからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼」は、ヨハネの文脈ではイエスを指す可能性が高い。一方、その背景であるイザヤ6章1節では、イザヤは主の栄光を見ている。そのため、「神の栄光を見て、神について語った」と理解することもできる。
    reason: 代名詞の指示対象について、ヨハネの直近の文脈とイザヤ書の背景の双方を示すため。
lexical_decisions:
- source_word: ταῦτα
  choice: これらのこと
  rationale: 中性複数の指示代名詞で、直前に引用された預言の言葉を受けるため、複数性を保った。
- source_word: εἶπεν
  choice: 言った
  rationale: λέγω のアオリストを自然に訳し、後の ἐλάλησεν「語った」と緩やかに訳し分けた。
- source_word: Ἠσαΐας
  choice: イザヤ
  rationale: 日本語聖書で広く定着している預言者名の表記を用いた。
- source_word: ὅτι
  choice: からである
  rationale: ここでは、イザヤがこれらのことを言った理由を示すと読むのが文脈上自然である。「ということを」も文法上は可能。
- source_word: εἶδεν
  choice: 見て
  rationale: ὁράω のアオリストを簡潔かつ自然に表した。後続の動詞と日本語で滑らかにつなぐため連用形とした。
- source_word: τὴν δόξαν αὐτοῦ
  choice: 彼の栄光
  rationale: δόξα の神学的な重みを「栄光」で保ち、代名詞 αὐτοῦ の指示対象を本文では明示せず、原文の形を保持した。
- source_word: ἐλάλησεν
  choice: 語った
  rationale: λαλέω の発話の意味を表し、先の εἶπεν「言った」と軽く訳し分けた。
- source_word: περὶ αὐτοῦ
  choice: 彼について
  rationale: περί＋属格の「～について」を自然な現代日本語で表し、代名詞の曖昧さを保持した。
theological_decisions:
- issue: 二つの αὐτοῦ が指す相手
  choice: 本文では「彼」とし、ヨハネの文脈ではイエスを指す可能性が高いことを脚注で示す。
  alternative: 本文で「イエスの栄光」「イエスについて」と明示する、または「神の栄光」と明示する。
  rationale: 直近の文脈はイエスへの不信を論じており、キリスト論的な指示が強い。一方、背景となるイザヤ6章は主の栄光の幻であり、ギリシア語本文自体は固有名を繰り返さないため、本文では代名詞を保って緊張を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」を用いて原文の代名詞を保持し、その指示対象に関する解釈上の緊張は脚注で説明した。
