id: JHN.12.48
reference: John 12:48
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: ja
  text: わたしを退け、わたしのことばを受け入れない[a]者には、その人を裁くものがある。わたしが語ったことば[b]、それが終わりの日にその人を裁くのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしのことばを受け取らない」。ギリシア語の動詞には、受け取る、迎え入れる、受け入れるという意味がある。
    reason: lexical_alternative
  - marker: b
    text: 「ことば」は「メッセージ」とも訳せる。ギリシア語ロゴスは、文脈により「ことば」または「伝えられた内容」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: 退け
  rationale: 人としてのイエスを拒絶する意味を自然な現代日本語で表し、「無視する」より強い原文の力を保つ。
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: わたしのことばを受け入れない
  rationale: λαμβάνω の「受け取る・迎え入れる・受け入れる」という幅のうち、啓示への応答を示す文脈に自然な「受け入れる」を採った。
- source_word: τὰ ῥήματά μου
  choice: わたしのことば
  rationale: 複数の発言内容を指すが、日本語では集合的に「ことば」とするのが自然であり、語られた内容という含みも保てる。
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: その人を裁くものがある
  rationale: 「すでに自分を裁くものを持っている」という構文を、日本語として明瞭にしつつ、後続の「ことば」が裁く主体として示されるつながりを保った。
- source_word: ὁ λόγος
  choice: ことば
  rationale: λόγος の単数で重みのある、擬人的とも取れる表現を保つ。「メッセージ」も可能なので脚注に示した。
- source_word: ὃν ἐλάλησα
  choice: わたしが語った
  rationale: アオリストを簡潔な過去表現とし、イエスが実際に語った啓示を指すことを明確にした。
- source_word: ἐκεῖνος
  choice: それが
  rationale: 先行する「ことば」を強く指し戻す指示代名詞の強調を、自然な日本語で表した。
- source_word: κρινεῖ
  choice: 裁く
  rationale: 終末的な審判を指すが、結果を「罪に定める」と限定せず、κρίνω の広い意味を保持した。
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: 終わりの日に
  rationale: ヨハネ文書の終末論的表現を簡潔に保ち、特定の教理体系を付加しない。
theological_decisions:
- issue: 裁く主体としての「ことば」の性格
  choice: イエスが語った「ことば」そのものが終わりの日に裁く、という本文の表現をそのまま保つ。
  alternative: 「ことば」を単に裁きの基準と説明する、または裁く主体を明示的にイエスへ置き換える。
  rationale: 本文はまず「裁くものがある」と述べ、続いてそれを「わたしが語ったことば」と同定する。ヨハネ福音書の他の箇所におけるイエスの審判者としての役割との緊張を、訳文で解消しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「者」と「その人」を組み合わせて過度な古風さを避けた。「裁くもの」は文法的な曖昧さと後続の擬人的表現を保つために採用した。表記は神学的な重みと日本語聖書の慣用を考慮して「ことば」とした。
