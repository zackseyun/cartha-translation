id: JHN.12.38
reference: John 12:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: ja
  text: 'それは、預言者イザヤの言葉が成就するためであった。イザヤはこう言った。


    「主よ、誰が私たちの知らせ[a]を信じたでしょうか。


    主の御腕は、誰に現されたでしょうか。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちが聞いたこと」または「私たちの伝えたこと」。
    reason: ἀκοήは、聞くこと、聞いた内容、または伝えられた知らせを意味し得るため。
lexical_decisions:
- source_word: ἵνα
  choice: それは……ためであった
  rationale: 直前の不信と預言の成就を結ぶ接続を自然な日本語で表し、目的とも結果とも取り得る含みを限定しないようにした。
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου
  choice: 預言者イザヤが語った言葉
  rationale: λόγοςを「言葉」とし、属格と後続のὃν εἶπενの内容を、日本語として明瞭に伝えた。
- source_word: πληρωθῇ
  choice: 成就する
  rationale: 聖書の言葉が実現するというヨハネの主題を保つ、簡潔で定着した表現を採用した。
- source_word: Κύριε
  choice: 主よ
  rationale: 呼格を明示し、聖書引用における神への呼びかけを保持した。
- source_word: ἐπίστευσεν
  choice: 信じたでしょうか
  rationale: 修辞疑問として自然な現代日本語にしつつ、アオリストの問いを過度に時制解釈しない表現とした。
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: 私たちの伝えたこと
  rationale: ἀκοήがここで表し得る、聞かれるべき知らせ・宣べ伝えられた内容という意味を、普通の日本語で明確に表した。語の多義性は脚注に残した。
- source_word: ὁ βραχίων κυρίου
  choice: 主の御腕
  rationale: 神の力と働きを示す聖書的比喩を説明に置き換えず、そのまま保持した。
- source_word: ἀπεκαλύφθη
  choice: 現された
  rationale: 受動態を保ち、主の御腕が人に示されるという比喩を自然な日本語で表した。
theological_decisions:
- issue: 成就表現における神的目的と結果
  choice: 「それは……成就するためであった」とし、目的・結果の両方を含み得る形を保持する
  alternative: 「こうして……成就した」または「その結果……成就した」
  rationale: ἵναと接続法の表現が持つヨハネ的な目的・結果の緊張を、一方に限定して解消しないため。
- issue: イザヤ引用におけるἀκοήの意味
  choice: 本文では「私たちの伝えたこと」
  alternative: 「私たちが聞いたこと」「私たちの知らせ」
  rationale: 宣べ伝えられた内容という文脈上の意味を自然に示しつつ、行為としての「聞く」と知らせの両義性を脚注で保持した。
- issue: 「主の腕」の比喩
  choice: 「主の御腕」として比喩を保持する
  alternative: 「主の力」または「主の働き」
  rationale: 神の力や救いの働きを意味する比喩だが、本文自体の象徴的表現を解釈語に置き換えないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書引用にふさわしい品位を保った。「御腕」は日常語ではないが、原文の重要な比喩を保つため採用した。脚注記号[a]は対応する語句の直後に置いた。
