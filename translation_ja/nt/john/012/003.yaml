id: JHN.12.3
reference: John 12:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: ja
  text: そこでマリアは、一リトラ[a]の非常に高価な純粋な[b]ナルドの香油を取り、イエスの足に塗り、自分の髪でイエスの足をぬぐった。家は香油の香りで満たされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一リトラはローマの重量単位で、約三百二十七グラム。
    reason: cultural_note
  - marker: b
    text: 「純粋な」と訳したギリシア語の意味には議論があり、「真正な」とも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の場面を受けた物語の展開と緩やかなつながりを、自然な現代日本語で示す。
- source_word: λίτραν
  choice: 一リトラ
  rationale: 古代ローマの重量単位を現代の単位に置き換えず音写し、概量は脚注で示す。
- source_word: μύρου νάρδου
  choice: ナルドの香油
  rationale: μύρονは香りのある油・軟膏を指し、ここでは塗る行為と香りの双方に合う「香油」が自然である。νάρδοςは香料の名称として保持する。
- source_word: πιστικῆς
  choice: 純粋な
  rationale: 語義には議論があるが、文脈上はナルドの品質・真正性を表すとみられる。「純粋な」を本文に置き、別案を脚注に残す。
- source_word: πολυτίμου
  choice: 非常に高価な
  rationale: 香油の大きな金銭的価値を明確かつ自然に伝える。
- source_word: ἤλειψεν
  choice: 塗り
  rationale: 香油を身体に塗る具体的な行為を明瞭に表し、「油を注ぐ」が招きうる過度な儀礼的含意を避ける。象徴的可能性は排除しない。
- source_word: ἐξέμαξεν ταῖς θριξὶν αὐτῆς
  choice: その髪で…ぬぐった
  rationale: 手段を表す与格を自然な日本語で示し、動作を直接的に訳す。
- source_word: ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου
  choice: 家は香油の香りで満たされた
  rationale: 受動態と、香りが家中に広がった結果を簡潔に保持する。
theological_decisions:
- issue: 香油を塗る行為の神学的含意
  choice: 「イエスの足に塗り」と訳す
  alternative: 「イエスの足に油を注ぎ」または「イエスの足に香油を塗って」
  rationale: 本文の身体的動作を正確に表しつつ、王の任職、葬り、秘跡など特定の神学的解釈を訳文だけで確定しないため。文脈が持ちうる象徴性は開いたままにする。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。古代の単位名と香料名は保持し、必要な説明を脚注に置いた。日本語で定着していない伝統的英語表現 spikenard の独立した脚注は設けなかった。
