  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: ja
  text: あなたがたに光がある間に、その光を信じなさい。光の子となるように[a]。」イエスはこれらのことを語った後、立ち去って、彼らから身を隠した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「光の息子たち」。これは、光に属し、光によって特徴づけられる人々を表す言い方です。
    reason: 原文の男性名詞と慣用的・包括的な意味の双方を示すため。
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: あなたがたに光があるうちに
  rationale: ὡςと現在形ἔχετεの組み合わせを時間的に捉え、光がなお与えられている限られた時への切迫した呼びかけを、自然な現代日本語で表した。二人称複数も「あなたがたに」で明示した。
- source_word: τὸ φῶς
  choice: その光
  rationale: 定冠詞を文脈照応的な「その」で表し、ヨハネ福音書における「光」の比喩的・キリスト論的含意を説明的に限定せず保持した。
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: その光を信じなさい
  rationale: πιστεύω εἰςのヨハネ的表現を簡潔に保った。「信頼しなさい」などの言い換えで意味を狭めず、命令形の直接性も示した。
- source_word: ἵνα υἱοὶ φωτὸς γένησθε
  choice: 光の子となるためです
  rationale: ἵναの目的の力とγένησθεの「なる」という変化を保持した。υἱοὶ φωτόςはセム語的な所属・性質を表す慣用句として、日本語で自然かつ定着した「光の子」とした。
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: イエスはこれらのことを語ると
  rationale: λαλέωを「語る」とし、直前の発言全体を指すταῦταを「これらのこと」と表した。「語ると」は後続動作との時間的連続を自然に示す。
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: 立ち去り、彼らから身を隠された
  rationale: 先行するアオリスト分詞と主動詞の順序を、日本語の連用形による自然な継起で表した。ἐκρύβηは形態上受動形だが文脈上は中動的な「身を隠す」と理解し、ἀπ’ αὐτῶνも「彼らから」と保持した。
theological_decisions:
- issue: υἱοὶ φωτόςの性別を伴う家族的表現
  choice: 光の子
  alternative: 光の息子たち
  rationale: 原文のυἱοίは男性複数だが、この属格句は「光に属し、光によって特徴づけられる者たち」を指す慣用表現である。日本語の「子」は慣用性を保ちながら対象を不当に男性だけに限定しない。原文の形は脚注で明示した。
- issue: πιστεύω εἰςのヨハネ的信仰表現
  choice: その光を信じなさい
  alternative: その光に信頼しなさい
  rationale: 対象への人格的信頼を含み得るが、本文では定着した「信じる」を用い、光の正体や信仰の様態を訳文で過度に説明しない。
- issue: ἐκρύβηの態の解釈
  choice: 身を隠された
  alternative: 彼らから見えなくなられた
  rationale: 形式的受動を機械的に訳さず、イエスが立ち去った後に自ら姿を隠すという文脈上自然な中動的意味を採った。ただし原因や手段は補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「光」「信じる」「光の子」というヨハネ福音書の反復語彙を保った。発話末から地の文への移行を閉じ引用符で明示し、後半は簡潔で荘重な叙述調とした。
