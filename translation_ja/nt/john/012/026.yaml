  verdict: revise
  source_fidelity: 第二文のὁ διάκονος ὁ ἐμόςは「わたしの仕える者」であり、現行訳の「わたしに仕える者」でも関係はおおむね伝わる。しかし、「そこに」という原文の場所指示を明示し、未来の約束としてより直接的に表すと対応が明瞭になる。第一・第三文の条件構文、従うよう求める命令、父がその人を尊ぶという約束は適切に保持されている。
  naturalness: 現行訳は読みやすいが、「わたしがいる所には、…いることになる」よりも、「わたしがいる所に、…もいることになる」とすると、原文の「そこにも」に対応する日本語として自然で明確になる。「だれでも、」の読点は不要である。
  terminology: 「仕える／仕える者」はδιακονέω／διάκονοςの語のつながりを自然に表し、教会職としての「執事」を誤って示さない。「従いなさい」はἀκολουθείτωの命令を保つ。「父」「重んじてくださる」も、所有格や報いの内容を不必要に補わず適切である。
