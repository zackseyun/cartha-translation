id: JHN.12.26
reference: John 12:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: ja
  text: だれでもわたしに仕えるなら、わたしに従いなさい。わたしがいる所に、わたしに仕える者もいることになる。だれでもわたしに仕えるなら、父はその人を重んじてくださる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διακονῇ / διάκονος
  choice: 仕える／仕える者
  rationale: ここでは教会の職制ではなく、イエスに奉仕することと、その人を指す。語根のつながりを保ちつつ、現代日本語で自然に表した。
- source_word: ἀκολουθείτω
  choice: 従いなさい
  rationale: 三人称現在命令の勧告・命令の力を、明瞭な日本語の命令表現で示した。継続の含みを過度に明文化していない。
- source_word: ὅπου εἰμὶ ἐγώ
  choice: わたしがいる所
  rationale: 明示されたἐγώの焦点を、主語を明記する自然な日本語で保った。
- source_word: ἐκεῖ καὶ ... ἔσται
  choice: そこには…もいることになる
  rationale: 場所を示すἐκεῖと付加のκαί、未来形の約束を自然に表し、単なる現在の状態に弱めなかった。
- source_word: τιμήσει
  choice: 重んじてくださる
  rationale: τιμάωが示す敬意・尊重を表す。神である父の行為について、日本語として自然な敬語を用いたが、その栄誉の具体的な形は限定していない。
- source_word: ὁ πατήρ
  choice: 父
  rationale: 原文には所有表現がないため、「わたしの父」と補わず、ヨハネ文書での呼称として「父」とした。
- source_word: τις / αὐτόν
  choice: だれでも／その人
  rationale: 原文の不定代名詞は包括的で、後続の男性単数代名詞は文法的一致である。日本語では性別を付加せず、単数の指示関係を明確にした。
theological_decisions:
- issue: イエスに仕えることと従うことの関係
  choice: 「仕えるなら、わたしに従いなさい」
  alternative: 「仕えようとする者は、わたしに従わなければならない」
  rationale: 条件文と命令をそのまま保ち、義務性を原文以上に強める「なければならない」は避けた。
- issue: 仕える者がイエスのいる所にいるという約束
  choice: 「わたしがいる所には、わたしに仕える者もいることになる」
  alternative: 天国または死後の報いと明示する
  rationale: 文脈には受難と栄光の含みがあるが、この節自体は場所や時を限定していないため、その広がりを保った。
- issue: 父が与える「誉れ」の性質
  choice: 「父はその人を重んじてくださる」
  alternative: 天上の報酬や終末的栄光と特定する
  rationale: 父が仕える者を尊ぶという約束を明瞭にしつつ、その具体的形態を一つの教理的理解に限定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「だれでも」を反復して原文の二つの条件文を際立たせ、「仕える／仕える者」によって語彙上の連関を示した。日本語では性を標示しないため、原文の総称的な男性単数構文について脚注は設けなかった。
