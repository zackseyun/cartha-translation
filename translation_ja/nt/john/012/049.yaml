id: JHN.12.49
reference: John 12:49
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: ja
  text: わたしは自分から語ったのではなく、わたしを遣わした父ご自身が、何を言い、何を語るべきかを、わたしに命じられたからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分から」は、文脈によって「自分の判断で」または「自分自身の権威によって」とも訳せる。原文は後半で、「言う」と「語る」に異なる二つの動詞を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: 自分から
  rationale: 起源・根拠を表す表現を簡潔に保ち、イエスが独自に語ったのではないという意味を、過度に解釈せず伝える。
- source_word: οὐκ ἐλάλησα
  choice: 語ったのではなく
  rationale: アオリストを文脈に即した自然な日本語の過去形で表し、これまでの発言全体についての否定として読めるようにした。
- source_word: ὁ πέμψας με πατὴρ
  choice: わたしを遣わした父
  rationale: 分詞句と「父」の関係を自然に表現した。日本語では神を指す称号であっても通常は大文字化しない。
- source_word: αὐτός
  choice: 父ご自身が
  rationale: 強意代名詞の強調を「ご自身」で明示した。
- source_word: ἐντολὴν δέδωκεν
  choice: 命じられた
  rationale: 直訳的な「命令を与えた」より自然で、ἐντολήの権威性と完了形の現在に及ぶ効力を文脈上保つ敬語表現とした。
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: 何を言い、何を語るべきか
  rationale: 間接疑問と指示の力を「べきか」で表し、λέγωとλαλέωの二つの動詞も「言う」「語る」と訳し分けた。
theological_decisions:
- issue: 御子の発言と父の命令との関係
  choice: イエスが自分を起点として独自に語るのではなく、遣わした父の命令に従って語ることを示す。
  alternative: イエスが父とは独立した権威で語る、または単なる人間の預言者としてのみ語ると限定する。
  rationale: 本文は宣教と発言における父との関係を明言するが、御子の本性について直接説明してはいないため、それ以上の含意を訳文に加えない。
- issue: πατήρ の訳語
  choice: 父
  alternative: 父なる神
  rationale: ヨハネ文脈では神を指すが、原文は単にπατήρであり、「なる神」を補わず簡潔に保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「父ご自身」で原文の強調を保持し、「何を言い、何を語る」で原文の動詞の違いを見える形にした。脚注記号は文全体に関わるため文末に置いた。
