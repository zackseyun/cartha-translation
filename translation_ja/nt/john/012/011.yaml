id: JHN.12.11
reference: John 12:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: ja
  text: それは、ラザロのゆえに、多くのユダヤ人が離れて行き、イエスを信じていたからである。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々」とも訳せる。ヨハネ福音書の「ユダヤ人」は、文脈によってユダヤ地方の人々やユダヤ人指導者たちを指すことがある。
    reason: alternative_reading
  - marker: b
    text: 「去って行き」「立ち去り」とも訳せる。何から離れたのかは原文には明記されていない。
    reason: lexical_alternative
  - marker: c
    text: 「イエスに信頼を置いていた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: それは……からである
  rationale: 前節で祭司長たちがラザロをも殺そうと相談した理由を示す。文脈との因果関係が自然に伝わる日本語とした。
- source_word: πολλοὶ … τῶν Ἰουδαίων
  choice: ユダヤ人のうち多くの人
  rationale: 属格の部分的用法を明示し、ユダヤ人全体ではなく、その中の多くの人を指すことを正確に表す。Ἰουδαῖοι の地理的な訳の可能性は脚注に残した。
- source_word: δι’ αὐτὸν
  choice: 彼のことで
  rationale: διά＋対格の原因・理由を表す。ここでの代名詞は直前のラザロを指し、彼をめぐる出来事が人々の行動のきっかけだったことを自然に示す。
- source_word: ὑπῆγον
  choice: 離れて行き
  rationale: 未完了過去が示す継続的・反復的な動きを保つ。何から離れたかは原文に明示されないため、当局から、またはその影響から、と本文で限定しない。
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: イエスを信じていた
  rationale: イエスへ向けられた信を表し、未完了過去の継続的・反復的側面も「信じていた」で示す。弟子となった、救われた、などの含意は加えない。
theological_decisions:
- issue: ヨハネ福音書における Ἰουδαίων の指示範囲
  choice: 本文では「ユダヤ人」とし、「そのうち多くの人」という部分表現を明確にした。
  alternative: 「ユダヤ地方の人々」または文脈によっては「ユダヤ人指導者たち」
  rationale: この語はヨハネ福音書で文脈により異なる範囲を指すが、ここでは指導者だけでなく、ラザロのゆえにイエスを信じるようになった人々を含む。民族全体への非難にならないよう、原文の部分的表現を明示した。
- issue: πιστεύω εἰς の神学的含意
  choice: 「イエスを信じていた」
  alternative: 「イエスに信頼を置いていた」
  rationale: 本文が述べるイエスへの信をそのまま表し、回心、弟子化、救済の完成など、節自体が明言しない神学的結論を加えない。
- issue: ὑπῆγον で人々が何から離れたか
  choice: 目的語を補わず「離れて行き」とした。
  alternative: 「ユダヤ人指導者たちのもとを離れて行き」
  rationale: 文脈上は反対勢力の立場や影響から離れることが考えられるが、原文は起点や対象を明示しないため、曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的かつ格調を保った常体。「彼」は直前のラザロを指す。原文の二つの未完了過去は「離れて行き」「信じていた」で継続的な動きとして表し、明示されていない離脱先や信仰の結果は補わなかった。
