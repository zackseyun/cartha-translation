id: JHN.12.34
reference: John 12:34
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: ja
  text: そこで群衆はイエスに答えた。「私たちは律法から、メシアは永遠にとどまると聞いています。それなのに、どうしてあなたは、『人の子は上げられなければならない』と言うのですか。この『人の子』とは、いったいだれなのですか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上げられる」は、「高く上げられる」とも訳せる。ヨハネの福音書では、十字架上に上げられることと、高くされることの両方を響かせている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: そこで群衆はイエスに答えた
  rationale: οὖνの文脈上のつながりを「そこで」で示し、ὁ ὄχλοςを自然な現代日本語の「群衆」とした。代名詞αὐτῷは、日本語で指示対象を明確にするため「イエスに」とした。
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: 私たちは律法から…と聞いています
  rationale: 受け継いだ教えが現在も意味を持つ文脈を「聞いています」で表し、νόμοςは聖書的枠組みを保つ「律法」とした。
- source_word: ὁ χριστός
  choice: メシア
  rationale: ここでは固有名に近い「キリスト」ではなく、待望される者の称号として機能しているため「メシア」とした。
- source_word: μένει εἰς τὸν αἰῶνα
  choice: 永遠にとどまる
  rationale: μένειの継続性とεἰς τὸν αἰῶναの慣用的な永続性を、簡潔かつ自然に表した。
- source_word: καὶ πῶς λέγεις σὺ
  choice: それなのに、どうしてあなたは…と言うのですか
  rationale: 群衆が、メシアの永続と人の子が上げられる必要性との食い違いを問いただす調子を表した。
- source_word: δεῖ ὑψωθῆναι
  choice: 上げられなければならない
  rationale: δεῖの必然性を保ちつつ、ὑψωθῆναιが十字架上への物理的な上昇と高くされることの双方を響かせ得るよう「上げられる」とした。
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: 人の子
  rationale: イエスの自己呼称として定着した表現を用い、ダニエル書的背景も保持した。
- source_word: τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου
  choice: この『人の子』とは、いったいだれなのですか
  rationale: οὗτοςの指示性と、群衆の困惑・問い返しの力を自然な日本語で示した。
theological_decisions:
- issue: ὁ χριστόςの訳語
  choice: メシア
  alternative: キリスト
  rationale: この箇所では、律法によって永遠にとどまると教えられてきた待望の者という称号的用法であり、ユダヤ的背景を明瞭にする「メシア」が適切である。
- issue: ὑψωθῆναιのヨハネ文書における重層的意味
  choice: 上げられる
  alternative: 高く上げられる／十字架につけられる
  rationale: 十字架上に物理的に上げられることと、栄光ある高揚との緊張を一方に限定せず保持するため、解釈を狭めない表現を選んだ。
- issue: δεῖが示す必然性
  choice: 上げられなければならない
  alternative: 上げられることになっている
  rationale: 神学的必然性を含み得るδεῖを、特定の体系に限定せず、明確な必要性として表した。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準語。「律法」「メシア」「人の子」は聖書的な称号・概念として保持した。引用内の引用にはかぎ括弧を使い、群衆の論理的な反論が自然に伝わるよう整えた。
