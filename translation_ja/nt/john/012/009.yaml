- from: そこで、ユダヤ人の大群衆は、イエスがそこにいることを知り[a]、やって来た。それはイエスのためだけではなく、イエスが死者の中からよみがえらせたラザロを見るためでもあった。
  to: そこで、ユダヤ人[a]の大群衆は、イエスがそこにいることを知ってやって来た。彼らはイエスのことだけが理由で来たのではなく、イエスが死者の中からよみがえらせたラザロを見るためにも来たのである。
  rationale: 来訪の動機を表すδιὰ τὸν Ἰησοῦνを、日本語で目的・受益の意味に曖昧化しないよう「イエスのことだけが理由で来たのではなく」と改めた。あわせて、Ἰουδαίωνに関する脚注を該当語へ正しくアンカーし、脚注本文を自然な日本語に整えた。その他の原文上の意味、対比、目的節、名前・神学的表現は維持した。
