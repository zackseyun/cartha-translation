id: JHN.12.9
reference: John 12:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: ja
  text: そこで、ユダヤ人[a]の大群衆は、イエスがそこにいることを知ってやって来た。彼らはイエスのことだけが理由で来たのではなく、イエスが死者の中からよみがえらせたラザロを見るためにも来たのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダヤ地方の人々から成る大群衆」とも訳せる。ギリシア語の語は、ユダヤ人一般を指すことも、ヨハネ福音書の一部の文脈では特にユダヤ地方の人々を指すこともある。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἔγνω
  choice: 知り
  rationale: アオリストは、すでに知っていた状態よりも、その情報を知るに至ったことを表す。日本語では文脈上「知り」が自然である。
- source_word: οὖν
  choice: そこで
  rationale: 直前の出来事を受けた物語上の展開・帰結を、現代日本語で自然に示す。
- source_word: ὄχλος πολὺς
  choice: 大群衆
  rationale: 単数の集合名詞と規模の大きさを簡潔に保つ。
- source_word: ἐκ τῶν Ἰουδαίων
  choice: ユダヤ人の
  rationale: 群衆がユダヤ人の中から成ることを自然な日本語で表す。Ἰουδαῖοιには「ユダヤ地方の人々」という可能性もあるため、脚注で示す。
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: イエスがそこにいることを
  rationale: ギリシア語では主語が省略されているが、文脈上イエスを指す。現在形の「いる」は原文の時制を自然に保持する。
- source_word: ἦλθον
  choice: やって来た
  rationale: 場面の視点に即した到来を、自然な物語表現で示す。
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: イエスのためだけではなく
  rationale: διά＋対格が示す理由・動機を、簡潔な日本語で表す。
- source_word: ἀλλ’ ἵνα καὶ ... ἴδωσιν
  choice: 見るためでもあった
  rationale: 対比と目的の両方を自然な日本語で保持する。
- source_word: Λάζαρον
  choice: ラザロ
  rationale: 日本語聖書で定着した人名表記を用いる。
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: イエスが死者の中からよみがえらせた
  rationale: 関係節の主語を明示し、ἐκ νεκρῶνの字義的な集合表現を保ちながら、ラザロが生き返らされたことを表す。
theological_decisions:
- issue: ヨハネ文書におけるἸουδαίωνの訳
  choice: ユダヤ人の
  alternative: ユダヤ地方の人々の中から
  rationale: 祭りをめぐる公の場面では民族・宗教的集団を指す読みが自然だが、ヨハネでは地理的に「ユダヤ地方の人々」を指し得る。その曖昧さを脚注に残し、反ユダヤ的な含意を加えない。
- issue: ἐκ νεκρῶνの表現
  choice: 死者の中から
  alternative: 死者の中から復活させた／生き返らせた
  rationale: 原文の「死者の中から」という表現を保ちつつ、ἐγείρωの使役的意味を「よみがえらせた」で示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語としての品位を保った。「大群衆」は原文の規模感を簡潔に伝え、「よみがえらせた」は宗教的文脈で理解しやすい表現とした。
