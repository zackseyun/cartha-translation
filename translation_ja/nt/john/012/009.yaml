  terminology: 「ユダヤ人」「イエス」「ラザロ」「死者の中からよみがえらせた」は適切である。「よみがえらせた」はラザロに対するἐγείρωの使役用法を自然に伝える。Ἰουδαίωνの地理的可能性を示す脚注も妥当である。
