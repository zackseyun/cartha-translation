id: JHN.12.35
reference: John 12:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: ja
  text: そこでイエスは彼らに言われた。「光は、なおしばらくの間、あなたがたの間にある[a]。光があるうちに歩みなさい。闇があなたがたを捕らえないように。闇の中を歩む者は、自分がどこへ行くのか分からない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたがたの内に」または「あなたがたと共に」。ギリシア語の表現には複数の理解が可能だが、ここでは公に人々の間におられるイエスを指す「あなたがたの間に」が文脈に最もよく合う。
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: そこで
  rationale: 直前の対話を受ける自然な談話接続として訳し、強すぎる論理的帰結は示さない。
- source_word: Ἔτι μικρὸν χρόνον
  choice: もうしばらくの間
  rationale: ἔτιの継続性とμικρὸν χρόνονの短い時間幅を、自然な現代日本語で表す。
- source_word: τὸ φῶς
  choice: 光
  rationale: ヨハネ文書における比喩的・キリスト論的な含みを保つため、説明的に言い換えず直訳する。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間に
  rationale: 群衆に対するイエスの公の臨在という直近の文脈に最もよく合う。ギリシア語の別の理解は脚注に残す。
- source_word: περιπατεῖτε
  choice: 歩みなさい
  rationale: 生き方を含意する聖書的な歩行の比喩を保ちつつ、日本語として自然な表現にする。
- source_word: ὡς τὸ φῶς ἔχετε
  choice: 光があるうちに
  rationale: ὡςを時間的に捉え、限られた機会への切迫感を明瞭に表す。
- source_word: ἵνα μὴ
  choice: ことのないためである
  rationale: 否定を伴う目的を、明瞭で格調のある現代日本語として示す。
- source_word: σκοτία
  choice: 闇
  rationale: 光との対照を簡潔に保ち、ヨハネ特有の象徴性を損なわない。
- source_word: καταλάβῃ
  choice: 捕らえる
  rationale: 闇が追いついて人を捉えるという動的な像を保つ。「打ち勝つ」と断定して多義性を狭めない。
- source_word: ὁ περιπατῶν ἐν τῇ σκοτίᾳ
  choice: 闇の中を歩む者
  rationale: 定冠詞付き分詞の一般的な単数を、日本語の自然な総称表現で再現する。
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: 自分がどこへ行くのか分からない
  rationale: 方向と行く末の双方を含み得る原文の表現を、解釈で限定せず自然に訳す。
theological_decisions:
- issue: 「光」に関するἐν ὑμῖνの意味
  choice: あなたがたの間に
  alternative: あなたがたの内に／あなたがたと共に
  rationale: 当面の文脈では、世の光であるイエスが群衆のもとにいる限られた期間を指す理解が最も自然である。ただしἐνには内面的または同伴的な理解の余地があるため、脚注で保持する。
- issue: καταλάβῃが表す闇の作用
  choice: 捕らえる
  alternative: 追いつく／襲う／打ち勝つ
  rationale: ここでは歩行と行き先の比喩が続くため、「捕らえる」が闇に追いつかれる動的な像をよく保つ一方、霊的勝敗だけに意味を固定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「光」「闇」「歩む」という原文の比喩を保持した。発話には簡潔で荘重な調子を持たせ、過度に古風な語法や教派固有の表現は避けた。
