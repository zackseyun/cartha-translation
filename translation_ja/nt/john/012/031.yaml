  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: ja
  text: 今、この世に対する裁きがある。今、この世の支配者[a]は外へ追い出される。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この世の君」。
    reason: lexical_alternative
  - marker: b
    text: 「この世の支配者」は、一般にサタンを指すと理解されている。
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: 今
  rationale: 二度とも「今」とし、強調された時の切迫性と並行構造を保った。
- source_word: κρίσις ἐστὶν τοῦ κόσμου τούτου
  choice: この世が裁かれる時である
  rationale: 属格は、この世を対象とする裁きを表すものとして自然な現代日本語にした。「時」を補うことで、νῦν と名詞文の意味を明瞭にした。
- source_word: κόσμου τούτου
  choice: この世
  rationale: 指示語 τούτου を反映し、ヨハネ文書における「この世」という表現を保持した。
- source_word: ἄρχων
  choice: 支配する者
  rationale: 権威を行使する者という意味を、現代日本語で明瞭かつ過度に解釈的にならない形で表した。
- source_word: ἐκβληθήσεται ἔξω
  choice: 外へ追い出される
  rationale: 未来受動の形と、ἔξω によって強められた排除・放逐の意味を保持した。
theological_decisions:
- issue: 「この世を支配する者」の正体
  choice: 本文では称号のまま「この世を支配する者」とした
  alternative: サタン／悪魔と明記する、またはこの世の体制の擬人化と解する
  rationale: ヨハネ文書の文脈では一般にサタンを指すと理解されるが、原文は固有名ではなく称号を用いているため、本文では明示的な同定を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。二度の「今」を反復し、原文の強調と対句を再現した。すべての脚注記号を本文中に配置した。
