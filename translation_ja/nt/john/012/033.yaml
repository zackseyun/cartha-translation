  text: τοῦτο δὲ ἔλεγεν σημαίνων ποίῳ θανάτῳ ἤμελλεν ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/033.yaml
  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: ja
  text: イエスは、ご自分がどのような死を遂げようとしておられたのかを示して、こう言われたのである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どのような死に方で」。ギリシア語の表現は、死の様態を強調することができる。
    reason: ποίῳ θανάτῳ の様態を表す可能性を明示するため。
lexical_decisions:
- source_word: τοῦτο
  choice: こう
  rationale: 中性単数の指示語で、直前のイエスの発言を指す。日本語では「こう言われた」とするのが自然で明確。
- source_word: δὲ
  choice: （明示せず）
  rationale: ここでは弱い接続・移行を表す。日本語で「さて」「しかし」などを補うと働きを強めすぎるため、文脈に委ねた。
- source_word: ἔλεγεν
  choice: 言われたのである
  rationale: 未完了過去の文脈的な叙述を踏まえつつ、説明を加える語り手の文として自然な日本語にした。敬語は福音書本文におけるイエスへの自然な言及として用いた。
- source_word: σημαίνων
  choice: 示して
  rationale: 発言によって死の様態を示唆・表示するという分詞の働きを簡潔に保つ。
- source_word: ποίῳ θανάτῳ
  choice: どのような死を
  rationale: 死の事実だけでなく、その種類・様態を問う表現。「どのような死に方で」も可能なので脚注に示した。
- source_word: ἤμελλεν
  choice: 遂げようとしている
  rationale: 近く起ころうとしている未来を表す。予定や神的必然を必要以上に明示する「定められている」は避けた。
- source_word: ἀποθνῄσκειν
  choice: 死を遂げる
  rationale: μέλλωの補語となる不定詞。日本語では「どのような死を遂げる」とすることで重複を避け、意味を自然に伝える。
theological_decisions:
- issue: この死が十字架刑であることを本文で明示するか
  choice: 「どのような死を遂げようとしているのか」という間接的表現を保つ
  alternative: 「十字架上で死のうとしているのか」または「どのように処刑されるのか」
  rationale: 文脈上は十字架刑を指すが、この節自体はそれを名指しせず、死の種類・様態を示したと述べる。本文以上の解釈を織り込まず、語りの間接性を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、聖書本文としての品位を保った。「こう言われたのである」により、直前の発言を説明する語り手の文であることを自然に示した。
