id: JHN.12.16
reference: John 12:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: ja
  text: 弟子たちは初め、これらのことを理解していなかった[a]。しかし、イエスが栄光を受けられた時[b]、これらのことがイエスについて書かれていたこと、また人々がイエスにこれらのことを行ったことを思い出した[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「これらのことを知らなかった」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヨハネ福音書でイエスが「栄光を受ける」という表現は、その死、復活、高挙と結び付いている。
    reason: cross_reference
  - marker: c
    text: 「人々」は原文では名詞として明示されておらず、動詞は三人称複数形である。
    reason: source_clarity
lexical_decisions:
- source_word: ἔγνωσαν
  choice: 理解していなかった
  rationale: 単なる情報の欠如ではなく、目の前の出来事が持つ意味を弟子たちがまだ悟っていなかったという文脈を、自然な現代日本語で表す。なお、「知らなかった」という語義も可能なため脚注に残す。
- source_word: αὐτοῦ οἱ μαθηταί
  choice: 弟子たち
  rationale: 直前から主語がイエスであることは明白で、日本語では「イエスの弟子たち」と重ねるより「弟子たち」が自然である。後半では主語を明確にするため再度「弟子たちは」とした。
- source_word: τὸ πρῶτον
  choice: 初め
  rationale: 時間的な「最初は」を簡潔で自然に表す。
- source_word: ἐδοξάσθη
  choice: 栄光を受けられた
  rationale: ヨハネ福音書における δοξάζω の神学的な重みを保ちつつ、受動形とイエスへの敬意を自然な日本語で表す。
- source_word: ἐμνήσθησαν
  choice: 思い出した
  rationale: 出来事の後に聖書の記述との対応を想起したという物語の流れを明瞭に表す。
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: イエスについて書かれており
  rationale: ἐπί＋与格をここでは話題・関係を示す「〜について」と理解し、聖書にすでに記されていた状態を表す。
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: 人々がそれらをイエスに行った
  rationale: ギリシア語の三人称複数を、直前の入城場面で行動した人々として自然に補った。「イエスに」は αὐτῷ を保ち、「行った」は ἐποίησαν の広い意味を過度に限定しない。
- source_word: ταῦτα
  choice: これらのこと／それら
  rationale: 中性複数の反復を保ちつつ、日本語で不自然な重複にならないよう、二度目は指示語「それら」とした。
theological_decisions:
- issue: イエスが「栄光を受けられた」時の範囲
  choice: 「栄光を受けられた」とし、その範囲を本文で限定しない
  alternative: 「復活された時」または「高く上げられた時」
  rationale: ヨハネ福音書の栄光の表現は、イエスの死、復活、高挙を重層的に指し得る。特定の一局面だけに狭めず、原文の神学的な含みを保つ。
- issue: ἐποίησαν の三人称複数の主体
  choice: 文脈上、入城の場面で行動した「人々」として訳す
  alternative: 主体を示さず「それらがイエスになされた」と受動態で訳す
  rationale: 原文は動作主を名詞で明示しないが、直前の文脈から複数の人々を指すと理解できる。日本語の明瞭さのため「人々」を補い、その補足性を脚注で示す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語とした。「栄光を受けられた」はヨハネ特有の表現を保ち、「理解していなかった」は弟子たちが出来事の意味をまだ悟っていなかったことを自然に伝える。原文で省略された複数の動作主は文脈に基づき「人々」と補い、脚注で明示した。
