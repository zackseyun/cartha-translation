  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: ja
  text: 「父よ、あなたの御名の栄光を現してください。」すると、天から声がした。「わたしは栄光を現した。そして、もう一度栄光を現す。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάτερ
  choice: 父よ
  rationale: 神への直接の呼びかけである。原文に所有代名詞はないため、「わたしの父よ」とは補わない。
- source_word: δόξασόν σου τὸ ὄνομα
  choice: あなたの御名の栄光を現してください
  rationale: δοξάζωのヨハネ文書における「栄光」の語彙的・神学的つながりを保ちつつ、神の御名に内在する栄光が明らかにされることを求める表現として、自然な現代日本語にした。
- source_word: ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: すると、天から声がした
  rationale: οὖνはここでは物語の進行を示すため「すると」とした。φωνήは後続する発話から「声」、ἐκ τοῦ οὐρανοῦは神的起源を示す「天から」と訳した。
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: わたしはすでに栄光を現した。そして、もう一度栄光を現す
  rationale: 最初のアオリストを完了した行為として「すでに…現した」、未来形を「現す」とした。πάλινは未来の動詞に結び付けて「もう一度」と訳した。日本語では目的語を自然に省略できるため、原文どおり明示せず、直前の「御名」から理解できる形にした。
theological_decisions:
- issue: 神の返答における省略された目的語の指示対象
  choice: 目的語を明示せず、直前の「御名」から理解させる
  alternative: 「御名の栄光をすでに現した」と目的語を補う
  rationale: ギリシア語は目的語を明示していない。日本語でも省略が自然であり、指示対象を文脈上明瞭に保ちながら原文の形式を尊重できる。
- issue: ヨハネ福音書で神学的重みを持つδοξάζωの訳
  choice: 栄光を現す
  alternative: あがめる／栄光を与える
  rationale: 父と子をめぐるヨハネの「栄光」の語彙的連関を保ち、「敬う」だけに意味を狭めない。「栄光を与える」よりも、神の栄光が出来事を通して顕現する含意を自然に表せる。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神名への敬意を表す慣用として「御名」を用い、発話は簡潔に保った。
