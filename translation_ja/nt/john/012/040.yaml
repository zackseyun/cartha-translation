  to: 神は彼らの目を見えなくし、彼らの心をかたくなにした。それは、彼らが目で見ず、心で悟らず、立ち返らないようにするためである[a]。そうすれば、わたしは彼らを癒やす[b]。[c]
  rationale: 肯定未来形 ἰάσομαι を本文で「わたしは彼らを癒やす」と明示しつつ、先行する否定目的節との関係から生じる引用の条件的・結果的含意を「そうすれば」で自然に示した。これにより、原文の曖昧さとイザヤ書への反響を保ち、癒やしを否定する読みを本文・脚注の双方から除いた。
