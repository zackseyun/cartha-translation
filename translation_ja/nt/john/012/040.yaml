  naturalness: 「目を見えなくし」「心をかたくなにした」「立ち返る」は明快な現代標準日本語であり、預言引用の重みも保つ。ただし、原文の並行を自然に示すため、「目で見ることも、心で悟ることも、立ち返ることもなく」より「目で見ず、心で悟らず、立ち返らないように」とする。
  terminology: 「心」「かたくなにする」「立ち返る」「癒やす」は適切である。「回心する」は本文には採らず、語彙上の代案として脚注に残すのがよい。冒頭の「神は」は文脈上妥当であり、神の行為主体を弱めない。
