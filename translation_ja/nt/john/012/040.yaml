id: JHN.12.40
reference: John 12:40
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: ja
  text: 神は彼らの目を見えなくし、彼らの心をかたくなにした。それは、彼らが目で見ず、心で悟らず、立ち返らないようにするためである[a]。そうすれば、わたしは彼らを癒やす[b]。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立ち返る」は「回心する」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「癒やす」に当たるギリシア語は未来形。直訳すれば「そして、わたしは彼らを癒やす」。引用元イザヤ書の文脈では、立ち返るなら癒やされるという条件的・結果的な含意を伴う。
    reason: lexical_alternative
  - marker: c
    text: この一節はイザヤ書6章10節を踏まえている。
    reason: cross_reference
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: 目を見えなくし
  rationale: 完了形が示す、行為の結果として続く状態を自然な日本語で表した。「盲目にした」よりも、目という具体的な語との結びつきが明瞭である。
- source_word: ἐπώρωσεν
  choice: かたくなにした
  rationale: 感覚を鈍らせ、頑なにする意味を持つ。預言的・審判的な響きを保ちつつ、現代日本語として自然である。
- source_word: καρδίαν / καρδίᾳ
  choice: 心
  rationale: 理解力を含む聖書的な内面の中心を表す語であり、「悟る」によって認知的側面も明示される。原文の単数形を保ち、「彼らの心」とした。
- source_word: ἵνα μὴ
  choice: それは……ないようにするためである
  rationale: 目的と結果の両方を帯びうる構文の強さを保った。神の行為と後続する否定的結果との関係を弱めない。
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: 目で見る
  rationale: 具体的な身体表現と、「心で悟る」との並行関係をそのまま保つ。
- source_word: νοήσωσιν
  choice: 悟る
  rationale: 単なる知識ではなく、意味を認識し理解することを簡潔に表す。
- source_word: στραφῶσιν
  choice: 立ち返る
  rationale: 方向転換と悔い改め・帰還の含意を保ちながら、「回心する」という教会用語に限定しない。
- source_word: ἰάσομαι
  choice: わたしが彼らを癒やすこともない
  rationale: 語形自体は未来形だが、否定を伴う目的・結果の連鎖の中で、立ち返った場合の癒やしが実現しないことを自然な日本語で示した。未来形であることは脚注に明記した。
theological_decisions:
- issue: 目を見えなくし、心をかたくなにする主体
  choice: 「神は」として神の能動的な働きを明示する
  alternative: 主語を省略する、または受動表現で神の関与を弱める
  rationale: ギリシア語は単数の能動形で行為者を示しており、引用文脈では神を指す。神による審判的な頑なさという難しい緊張を和らげずに保った。
- issue: στραφῶσιν の回心的含意
  choice: 本文では「立ち返る」
  alternative: 「回心する」
  rationale: 原語は広く「向きを変える、戻る」を意味するため、悔い改めの含意を保ちつつ、特定の教理用語に狭めない。
- issue: ἰάσομαι と否定構文の関係
  choice: 「癒やすこともないように」と目的・結果の連鎖に含める
  alternative: 「そうすれば、わたしは彼らを癒やす」と独立した未来の帰結として訳す
  rationale: ヨハネにおける引用全体の審判的文脈と、先行する ἵνα μὴ の支配を日本語で明瞭にした。ただし、未来形をより直接に反映する別訳の可能性を脚注で示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、預言の引用にふさわしい重みを保った。「かたくな」「立ち返る」「癒やす」は聖書的な響きを持つが、一般読者にも理解できる語である。原文の反復と、目／心、見る／悟るという並行関係を維持した。
