  text: Μὴ φοβοῦ, θυγάτηρ Σιών· ἰδοὺ ὁ βασιλεύς σου ἔρχεται, καθήμενος ἐπὶ πῶλον ὄνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: ja
  text: 「恐れるな、シオンの娘よ。見よ、あなたの王が、ろばの子に乗って来る。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ゼカリヤ9章9節を踏まえた言葉。「シオンの娘」は、シオンすなわちエルサレムを娘として呼びかける預言的表現である。「ろばの子」は直訳すると「ろばの若いもの」。
    reason: cross_reference_cultural_and_lexical_note
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: 恐れるな
  rationale: μήを伴う命令形の禁止を、簡潔で格調を保った現代日本語で表した。
- source_word: θυγάτηρ Σιών
  choice: シオンの娘よ
  rationale: シオン／エルサレムを娘として擬人化する預言的呼びかけを保持した。
- source_word: ἰδοὺ
  choice: 見よ
  rationale: 注意を喚起する指示詞の働きを保つ。やや格調ある語だが、聖書の引用句として現代日本語でも明瞭である。
- source_word: ὁ βασιλεύς σου
  choice: あなたの王
  rationale: 定冠詞を伴う名詞句と二人称単数の所有関係をそのまま表した。日本語では大文字小文字による称号化がないため、解釈を加えていない。
- source_word: ἔρχεται
  choice: 来られる
  rationale: 現在形の生き生きとした到来を表し、王への敬意を自然な尊敬語で示した。
- source_word: καθήμενος ἐπὶ πῶλον ὄνου
  choice: ろばの子に乗って
  rationale: καθήμενοςは字義的には「座っている」だが、乗用動物との組み合わせでは日本語の「乗って」が自然である。πῶλον ὄνουは、ろばの若い個体を示す。
theological_decisions:
- issue: ゼカリヤ9章9節への引用・暗示とメシア的王権
  choice: 預言的呼称「シオンの娘」と「あなたの王」を本文に保持し、説明は脚注に置く。
  alternative: 本文で「エルサレム」や「約束された王」と明示する。
  rationale: ヨハネ本文の表現とその預言的緊張を保ち、解釈的な展開を本文へ持ち込まないため。
- issue: καθήμενοςの訳し方
  choice: 乗って
  alternative: 座って／腰を下ろして
  rationale: 原語は「座っている」だが、ろばの子との関係を自然な日本語で示すには「乗って」が最適である。王の謙遜や具体的な乗り方を過度に説明しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、預言の引用であることが伝わるよう「恐れるな」「見よ」という簡潔で格調ある表現を採用した。
