id: JHN.12.20
reference: John 12:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ⸂Ἕλληνές τινες⸃ ἐκ τῶν ἀναβαινόντων ἵνα προσκυνήσωσιν ἐν τῇ ἑορτῇ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: ja
  text: さて、祭りの際に礼拝するため上って来た人々の中に、何人かのギリシア人がいた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あるギリシア人たち」。ユダヤ人ではない人々で、祭りの際に礼拝するため上って来た可能性がある。
    reason: 「ギリシア人」の身元に関する原文の曖昧さと、τινεςの別訳を示すため。
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: さて、…いた
  rationale: ἦσανの存在表現を「いた」とし、δέの穏やかな場面転換を現代日本語で自然な「さて」によって示した。時間を意味する語は加えていない。
- source_word: Ἕλληνές τινες
  choice: 何人かのギリシア人
  rationale: Ἕλληνεςを民族的・文化的呼称の「ギリシア人」とし、τινεςの不定性を「何人かの」で表した。「異邦人」と一般化せず、原文の幅を保った。
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: 上って来た人々の中に
  rationale: ἐκが示す集団内の所属を「人々の中に」で表現した。「上る」はエルサレムへの巡礼の慣用を保持し、日本語の視点では「上って来た」が自然である。
- source_word: ἵνα προσκυνήσωσιν
  choice: 礼拝するため
  rationale: ἵνα＋接続法の目的を明示した。ここでのπροσκυνέωは単なる平伏ではなく宗教的礼拝を指す。
- source_word: ἐν τῇ ἑορτῇ
  choice: 祭りの際に
  rationale: ἑορτήをユダヤ教の祭りとして自然に訳し、ἐνを、この祭りを機会として礼拝に来たことを示す「際に」で表した。祭りの最中と断定しすぎない。
theological_decisions:
- issue: Ἕλληνεςの身元
  choice: 「ギリシア人」という原文の民族的・文化的呼称を保持する。
  alternative: 「異邦人」と訳す、またはギリシア語を話すユダヤ人・改宗者・神を敬う者のいずれかと特定する。
  rationale: 本文は彼らをἝλληνεςと呼び、祭りに礼拝しに来たこと以外、その宗教的身分を特定していない。訳文で解釈上の緊張を解消しない。
translation_notes:
  register: 明快な現代標準日本語を用い、聖書本文としての品位を保った。「礼拝するため」で目的を明瞭にしつつ、「ギリシア人」を解釈的に「異邦人」へ置き換えない。
