  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: ja
  text: 今、わたしの心は揺れ動いている[a]。何と言おうか。「父よ、この時を免れさせてください。」しかし、わたしはまさにこのために、この時に至ったのだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「今、わたしの心は揺れ動いている。何と言おうか。『父よ、この時を免れさせてください』とでも言おうか。」ギリシア語は、「父よ」以下を直接の願いではなく、修辞的な問いの一部として読むこともできる。
    reason: 原文の句読法は後代のものであり、「父よ」以下を直接の祈願とする読みと、退けられる可能性を示す修辞疑問の一部とする読みの両方が文法上可能であるため。
lexical_decisions:
- source_word: Νῦν
  choice: 今
  rationale: イエスが現に直面している苦悩の切迫性を、簡潔で自然な現代日本語で示す。
- source_word: ἡ ψυχή μου
  choice: わたしの心
  rationale: ここでは人格の内面、感情と意志を含む自己を指す。「魂」より日常的で明瞭な「心」を選びつつ、単なる感情に限定しない文脈的な重みを保つ。
- source_word: τετάρακται
  choice: 揺れ動いている
  rationale: 完了形が示す、動揺させられた結果として今も続く状態を表す。「悩んでいる」より強い内的動揺を自然に伝える。
- source_word: τί εἴπω
  choice: 何と言おうか
  rationale: 熟慮・逡巡を表す審議的接続法の響きを、簡潔な自問として再現する。
- source_word: πάτερ
  choice: 父よ
  rationale: 神への直接の呼びかけを、現代日本語として自然でありながら荘重な形で表す。
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: この時からわたしを救ってください
  rationale: 命令形による切実な願いと、ἐκ の「〜からの救出」を保つ。日本語では神への祈願として自然な敬語形を用いる。
- source_word: ὥρα
  choice: 時
  rationale: ヨハネ福音書で、イエスの受難・死・栄光に関わる定められた決定的時を指す反復語。「時間」や「瞬間」ではなく「時」として主題的な重みを保つ。
- source_word: ἀλλὰ διὰ τοῦτο
  choice: しかし、わたしはまさにこのために
  rationale: ἀλλά の強い転換と、διὰ τοῦτο の理由・目的の含みを表す。「まさに」を補い、直前の救出願望との対照を明確にする。
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: この時に至ったのだ
  rationale: εἰς を目的を断定する「この時のために」ではなく、到達点を示す「この時に」とし、ἦλθον の到来を自然な日本語で表す。
theological_decisions:
- issue: 「父よ、この時からわたしを救ってください」を直接の祈願とするか、「何と言おうか」に続く修辞疑問の内容とするか
  choice: 本文では直接の祈願として訳す。
  alternative: 「何と言おうか。『父よ、この時からわたしを救ってください』とでも言おうか」と、退けられる可能性を示す修辞疑問として読む。
  rationale: 初期写本の句読法は原文に由来せず、ギリシア語は両様に読める。SBLGNTの句読法に従って直接の願いとして示しつつ、続く逆接との緊張を保持する。別解は脚注に明記し、イエスの苦悩と使命受容の関係を教理的に一方へ固定しない。
- issue: ψυχή の日本語表現
  choice: 「心」
  alternative: 「魂」または「わたし自身」
  rationale: ここではイエスの内的人格が動揺していることを指す。「心」は現代の一般読者に明瞭で自然であり、「魂」が生みうる身体と分離した実体という含意を不用意に強めない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「父よ」「この時」「〜のだ」によって適度な格調とヨハネ文書の荘重さを保った。「わたし」で統一し、過度に古風な語法や教派特有の表現は避けた。
