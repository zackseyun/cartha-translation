id: JAS.1.13
reference: James 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μηδεὶς πειραζόμενος λεγέτω ὅτι Ἀπὸ θεοῦ πειράζομαι· ὁ γὰρ θεὸς ἀπείραστός ἐστιν κακῶν, πειράζει δὲ αὐτὸς οὐδένα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/013.yaml
  text: Let no one who is being tempted say[a], “I am being tempted by God,” for God is untemptable by evil, and he himself tempts no one.
translation:
  language: ja
  text: 誘惑を受けている人は、だれも「私は神から誘惑されている」と言ってはなりません。神は悪に誘惑されることがなく[a]、神ご自身、だれをも誘惑なさらないからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「神は悪いものによって誘惑され得ない方であり」。この箇所のギリシア語は難解で、「神は悪を経験することがない」とも解されます。「悪いもの」は原文では複数形です。
    reason: まれな形容詞ἀπείραστοςと属格複数κακῶνの語義上の幅を示し、本文で一つの解釈に固定しすぎないため。
lexical_decisions:
- source_word: μηδεὶς … λεγέτω
  choice: だれも…と言ってはなりません
  rationale: 否定不定代名詞と三人称命令形による禁止を、明瞭で自然な現代日本語にした。
- source_word: πειραζόμενος
  choice: 誘惑を受けている人は
  rationale: 現在受動分詞の継続的・受動的な意味を保った。直後の悪い欲望と罪についての文脈から、「試される」ではなく「誘惑を受ける」とした。
- source_word: Ἀπὸ θεοῦ πειράζομαι
  choice: 私は神から誘惑されている
  rationale: ἀπόが示す起点・源を「神から」で表し、現在受動形の継続的な含みも残した。
- source_word: ἀπείραστός ἐστιν κακῶν
  choice: 神は悪に誘惑されることがなく
  rationale: まれで解釈の難しい形容詞を、文脈上もっとも自然な「悪の誘惑を受ける可能性がない」という意味に訳した。κακῶνの複数形は、日本語では総称的な「悪」とするのが自然である。表現の難しさと別訳は脚注に示した。
- source_word: πειράζει
  choice: 誘惑なさらない
  rationale: 同じ語根を「誘惑」で統一し、神が罪へ誘うという意味を否定する文脈を明確にした。神を主語とするため敬語を用いた。
- source_word: αὐτὸς οὐδένα
  choice: ご自身もだれをも
  rationale: 強意代名詞αὐτόςの強調を「ご自身」で保ち、οὐδέναを「だれをも…ない」と訳した。
theological_decisions:
- issue: πειράζω語群を「試す」とするか「誘惑する」とするか
  choice: 節全体で「誘惑する／誘惑を受ける」とする
  alternative: 一部または全部を「試す／試される」とする
  rationale: 続く14–15節では人が自分の欲望に引かれて罪へ進むことが論じられるため、ここでは道徳的悪へ誘う意味が中心である。ただし、聖書の他の箇所に見られる別の意味での「試練」まで否定する表現にはしなかった。
- issue: ἀπείραστός ἐστιν κακῶνの意味
  choice: 神は悪に誘惑されることがない
  alternative: 神は悪を経験することがない／神は悪によって試され得ない
  rationale: 形容詞はまれで意味に幅があるが、後半の「ご自身もだれをも誘惑なさらない」との論理的つながりから、悪の誘惑を受けないという解釈を本文に採った。語義上の難しさは脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、命令の厳粛さと神を主語とする文の品位を保った。「言ってはなりません」「誘惑なさらない」により、堅すぎず口語的すぎない聖書本文の文体とした。
