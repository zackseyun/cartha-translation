  text: ὁ δὲ πλούσιος ἐν τῇ ταπεινώσει αὐτοῦ, ὅτι ὡς ἄνθος χόρτου παρελεύσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/010.yaml
  text: and the rich man in his humiliation[b][a], because like a flower of grass he will pass away.
translation:
  language: ja
  text: 一方、富んでいる人は、自分が低くされることを誇りとしなさい。その人は草の花[b]のように過ぎ去るからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「草の花」はギリシア語の比喩を字義どおりに訳した表現で、草木が花を咲かせてもすぐに衰えるように、富む人も速やかに過ぎ去ることを強調しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ πλούσιος
  choice: 一方、富んでいる人は
  rationale: δὲは9節との並行と対照を穏やかに示す「一方」とした。πλούσιοςは名詞的用法だが、日本語では性を不必要に明示せず「富んでいる人」とするのが自然である。
- source_word: ἐν τῇ ταπεινώσει αὐτοῦ
  choice: 自分が低くされることを
  rationale: ταπείνωσιςには低い状態、屈辱、低くされることの幅がある。ここでは後続する富と命のはかなさが、富む人が低くされることを示すため、単なる内面的な謙遜と限定しない表現にした。日本語では9節の「誇る」に対応させるため、ἐνの意味を「〜を誇る」の目的語として自然に表した。
- source_word: ὅτι
  choice: からです
  rationale: 前文の理由を明確に示す因果表現であり、現代日本語として自然である。
- source_word: ὡς ἄνθος χόρτου
  choice: 草の花のように
  rationale: ギリシア語の比喩を直訳的に保ち、咲いてもすぐ衰える草木のはかなさを伝える。「野の花」や「野花」は原文にない「野」を補うため採らない。
- source_word: παρελεύσεται
  choice: 過ぎ去る
  rationale: ここでは空間的に通り過ぎることより、富む人の命と栄えが消えゆくはかなさを表す。「過ぎ去る」はその含意を保ちつつ、死だけに意味を狭めない。
theological_decisions:
- issue: 9節から補われる省略
  choice: 本文では「誇りなさい」を補わず、「自分が低くされることを。」と省略を残した。
  alternative: 「一方、富んでいる人は、自分が低くされることを誇りなさい」と明示する。
  rationale: ギリシア語本文は9節の命令を受けるが、10節自体には動詞がない。日本語でも意図的な省略として理解可能なので、原文の形を保ち、補足解釈は脚注に示した。
- issue: 富む人の「低くされること」の意味
  choice: 富と命の移ろいやすさの中で、その人が低くされることとして訳した。
  alternative: 自発的な謙遜、または一般的な低い社会的身分を指すと解する。
  rationale: 「草の花のように過ぎ去る」という理由づけは、徳としての謙遜だけでなく、富む人の地位と命が失われる逆転を示す。特定の教理体系に限定せず、この緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書本文としての品位を保った。9節に依存する省略は、多少の中断感を残して原文どおり本文に保持し、脚注で補った読みを示した。
