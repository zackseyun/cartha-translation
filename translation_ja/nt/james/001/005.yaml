reference: James 1:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ δέ τις ὑμῶν λείπεται σοφίας, αἰτείτω παρὰ τοῦ διδόντος θεοῦ πᾶσιν ἁπλῶς καὶ ⸀μὴ ὀνειδίζοντος, καὶ δοθήσεται αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/005.yaml
  text: But if any of you lacks wisdom[a], let him ask of God, who gives to all generously and without reproach[b], and it will be given to him.
translation:
  language: ja
  text: あなたがたのうちに知恵に欠けている人がいるなら、その人は神に願い求めるべきです。神は、すべての人に惜しみなく、責めることなく与えてくださる方です。そうすれば、知恵はその人に与えられます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰ δέ
  choice: いるなら
  rationale: δέの穏やかな展開を日本語の条件文の流れに溶け込ませた。直前の文脈とのつながりは保ちつつ、不自然な「しかし」で強い対比を作らない。
- source_word: τις ὑμῶν
  choice: あなたがたのうちに…人がいる
  rationale: 部分属格を自然な現代日本語で表し、読者への直接的な呼びかけを保った。
- source_word: λείπεται σοφίας
  choice: 知恵の欠けている
  rationale: 「知恵に不足している」状態を簡潔に表す。知恵を試練に対処する実践的知恵だけに限定せず、原文の広がりを残した。
- source_word: αἰτείτω παρὰ τοῦ…θεοῦ
  choice: 神に願い求めなさい
  rationale: 三人称命令の勧告を、日本語で自然な直接命令として表現した。「願い求める」により、神から与えられるものを求める意味を示す。
- source_word: τοῦ διδόντος θεοῦ
  choice: 神は…与えてくださる方です
  rationale: 分詞が神の性質を描くことを明確にし、敬意ある自然な日本語とした。
- source_word: πᾶσιν
  choice: すべての人に
  rationale: 対象の広い範囲を狭めずに明示した。
- source_word: ἁπλῶς
  choice: 惜しみなく
  rationale: この文脈では、神が出し惜しみせず寛大に与える意味を自然に伝える。「気前よく」よりも聖書本文にふさわしい品位を保つ。
- source_word: μὴ ὀνειδίζοντος
  choice: 責めることなく
  rationale: 求める者を非難したり辱めたりしないという意味を、明瞭で現代的な表現で伝える。
- source_word: δοθήσεται αὐτῷ
  choice: その人に与えられます
  rationale: 未来受動形の約束を保ち、「その人」によって代表的単数を性別に限定せず自然に表した。何が与えられるかは直前の「知恵」から明らかなため、原文同様に補足しない。
theological_decisions:
- issue: 代表的単数表現
  choice: その人は…その人に
  alternative: 彼は…彼に／その人たちは…その人たちに
  rationale: 原文の単数性を保ちながら、男性だけを指すという誤解を避ける。日本語では「その人」が性別を限定せず、τιςとαὐτῷの代表的用法を自然に表せる。
- issue: ἁπλῶςにおける神の与え方
  choice: 惜しみなく
  alternative: 寛大に／分け隔てなく／純一に
  rationale: 知恵を求める文脈では、神が出し惜しみせず与えることを表す可能性が最も高い。「分け隔てなく」はπᾶσινとの関連を強めすぎ、「純一に」は現代日本語では意味が伝わりにくい。
- issue: 知恵が与えられるとの約束
  choice: そうすれば、その人に与えられます
  alternative: そうすれば、必ず知恵が与えられます
  rationale: 未来受動形の確かな約束を保つ一方、「必ず」を追加せず、次節に示される信仰をもって求めるという文脈との緊張を残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「惜しみなく」は神の寛大さを平易に伝え、「責めることなく」は求める者を辱めない意味を簡潔に示す。原文に脚注を必要とするほどの本文異読はなく、日本語では代表的単数も自然に処理できるため脚注は設けない。
