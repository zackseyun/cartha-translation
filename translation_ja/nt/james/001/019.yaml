  text: ⸀Ἴστε, ἀδελφοί μου ἀγαπητοί. ἔστω ⸀δὲ πᾶς ἄνθρωπος ταχὺς εἰς τὸ ἀκοῦσαι, βραδὺς εἰς τὸ λαλῆσαι, βραδὺς εἰς ὀργήν,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/019.yaml
  text: 'Know this[a], my beloved brothers: let every man be quick to hear, slow to speak, slow to anger[c][b],'
translation:
  language: ja
  text: 私の愛する兄弟たちよ、このことを心得ておきなさい。[a] だれでも、聞くことには早く、語ることには遅く、怒ることには遅くありなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の愛する兄弟たちよ、あなたがたはこのことを知っています」。冒頭のギリシア語は、命令とも直説とも取ることができる。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴστε
  choice: 次のことを心得ておきなさい
  rationale: 命令形として取り、後に続く勧告への導入を自然な現代日本語で表した。「次のこと」は談話上の指示内容を明確にするための補い。直説法「あなたがたは知っています」と取る可能性は脚注に残した。
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: 愛する私の兄弟たちよ
  rationale: 親愛を表すἀγαπητοίと、共同体への呼びかけであるἀδελφοίを明示した。ここでの「兄弟たち」は女性を含む信仰共同体全体を指し得るため、その点を脚注で説明した。
- source_word: ἔστω δὲ πᾶς ἄνθρωπος
  choice: 人は皆、…ありなさい
  rationale: πᾶς ἄνθρωποςの包括的な単数表現を、性別を限定せず個々人に及ぶ自然な日本語「人は皆」で表した。ἔστωの第三人称命令の勧告的な力は「ありなさい」で保持した。δέは軽い接続であり、日本語では明示しなくても流れが保たれる。
- source_word: ταχὺς εἰς τὸ ἀκοῦσαι
  choice: 聞くには早く
  rationale: 単なる聴覚ではなく、相手の言葉に耳を傾ける用意があることを含みつつ、ἀκούωとの語彙的対応を保った。
- source_word: βραδὺς εἰς τὸ λαλῆσαι
  choice: 語るには遅く
  rationale: 形容詞と不定詞による対句を保ち、「聞くには早く」と釣り合う簡潔で品位ある表現とした。
- source_word: βραδὺς εἰς ὀργήν
  choice: 怒るには遅く
  rationale: ὀργήに向かうのを性急にしないというギリシア語の慣用的意味を自然に表し、前二句との反復構造も保持した。
theological_decisions:
- issue: 冒頭のἼστεを命令形と見るか直説法と見るか
  choice: 命令形として「次のことを心得ておきなさい」
  alternative: 直説法として「愛する私の兄弟たちよ、あなたがたはこのことを知っています」
  rationale: 後続する第三人称命令と勧告の流れには命令形がよく合うが、語形自体は直説法としても理解できるため、別解を脚注に明記して曖昧さを保持した。
- issue: ἀδελφοίの指示範囲
  choice: 本文では「兄弟たち」と訳し、共同体的な呼称を保持する
  alternative: 「兄弟姉妹たち」または「皆さん」
  rationale: 原文の男性複数形を本文に反映しつつ、この呼称が女性を含む信仰共同体全体に用いられ得ることを脚注で明示し、対象範囲を狭めないようにした。
- issue: πᾶς ἄνθρωποςの総称性
  choice: 「人は皆」
  alternative: 「一人一人」
  rationale: ἄνθρωποςはここで性別を限定する「男」ではなく人間一般を指す。日本語では「人は皆」が原文の単数総称と普遍的な勧告を自然に伝える。
translation_notes:
  register: 明快な現代標準日本語を用い、呼びかけには節度ある荘重さを持たせた。「聞くには早く、語るには遅く、怒るには遅く」という三つの並行句をそろえ、原文の簡潔な格言的リズムを保った。
