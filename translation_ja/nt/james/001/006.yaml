id: JAS.1.6
reference: James 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αἰτείτω δὲ ἐν πίστει, μηδὲν διακρινόμενος, ὁ γὰρ διακρινόμενος ἔοικεν κλύδωνι θαλάσσης ἀνεμιζομένῳ καὶ ῥιπιζομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/006.yaml
  text: But let him ask in faith[a], doubting nothing, for the one who doubts is like a wave of the sea, driven by the wind and tossed about.
translation:
  language: ja
  text: ただし、少しも疑わず、信仰をもって[a]願い求めなさい。疑う人は、風に吹かれて揺れ動く海の波のようだからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神を信頼して」とも訳せます。ここで「信仰」と訳したギリシア語は、この文脈では神に信頼してより頼むことを含みます。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτείτω
  choice: 願い求めなさい
  rationale: 三人称現在命令法の勧告的な力を、前節で神に知恵を求める文脈に即して自然な日本語の命令表現で示した。
- source_word: δὲ
  choice: ただし
  rationale: 前節の約束に対し、願い求める際の条件を付け加える穏やかな対照・展開を表す。
- source_word: ἐν πίστει
  choice: 信仰をもって
  rationale: 前置詞句の様態を自然な日本語で示し、πίστιςの基本的な訳語である「信仰」を保った。文脈上は神への信頼を含む。
- source_word: μηδὲν διακρινόμενος
  choice: 少しも疑わず
  rationale: μηδένの全面否定と、ここでのδιακρίνομαιが表す内的なためらい・疑いを、明瞭で自然な日本語にした。
- source_word: ὁ γὰρ διακρινόμενος
  choice: 疑う人は……だからです
  rationale: 冠詞付き分詞を性別を限定しない一般的な人物表現とし、γάρの理由説明を日本語の文末で表した。
- source_word: κλύδωνι θαλάσσης
  choice: 海の波
  rationale: 海上のうねりや波を指す比喩を、簡潔で視覚的な現代日本語にした。
- source_word: ἀνεμιζομένῳ καὶ ῥιπιζομένῳ
  choice: 風に吹かれて揺れ動く
  rationale: 二つの受動分詞が描く、風によって動かされ翻弄される不安定さを、過度に語を重ねず一続きの自然な描写にした。
theological_decisions:
- issue: 祈りの文脈における πίστις の訳
  choice: 信仰
  alternative: 信頼
  rationale: 本文では神学的連続性のある基本訳「信仰」を用いる一方、この文脈で中心となる神への信頼という含意を脚注に明示し、両者の重なりを保った。
- issue: διακρίνομαι の意味
  choice: 疑う
  alternative: 心が揺れる／ためらう
  rationale: 祈りにおける内的な分裂や動揺を示す語であり、続く海の波の比喩とも対応する。「疑う」は文脈上もっとも明瞭だが、単なる知的疑問に狭めないよう全体の比喩で揺らぎを示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「ただし」で前節との条件的なつながりを示し、命令形は一般読者に自然な「願い求めなさい」とした。比喩は簡潔に保ちつつ、不安定に揺さぶられる印象を伝えた。
