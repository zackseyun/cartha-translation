id: JAS.1.14
reference: James 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἕκαστος δὲ πειράζεται ὑπὸ τῆς ἰδίας ἐπιθυμίας ἐξελκόμενος καὶ δελεαζόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/014.yaml
  text: But each one is tempted by his own desire[b][a], being drawn away and enticed.
translation:
  language: ja
  text: しかし、一人ひとりが誘惑されるのは、自分自身の欲望[a]に引き出され、おびき寄せられるからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「欲望」は「強い欲求」または「渇望」とも訳せます。ギリシア語は強い願望を広く表すことができ、性的な欲望だけを意味するわけではありません。
    reason: lexical_alternative
  - marker: b
    text: 「引き出され、おびき寄せられる」という一組の表現には、獲物や魚が餌で誘い出され、罠にかけられる情景が込められています。
    reason: cultural_note
lexical_decisions:
- source_word: ἕκαστος
  choice: 一人ひとり
  rationale: 単数で個々人に焦点を当てる原文の配分的な意味を保ちつつ、現代日本語として自然にした。
- source_word: δὲ
  choice: しかし
  rationale: 神は人を誘惑しないという直前の13節との穏やかな対照を示す。
- source_word: πειράζεται
  choice: 誘惑される
  rationale: この文脈では一般的な試練よりも、罪へ誘う働きを指す。15節で欲望が罪を生むという展開にも合う。
- source_word: ὑπὸ τῆς ἰδίας ἐπιθυμίας
  choice: 自分自身の欲望に
  rationale: 誘惑の直接的な源がその人自身に属する欲望であることを表す。「自分自身」によりἰδίαςの強調を保った。
- source_word: ἐπιθυμίας
  choice: 欲望
  rationale: 強い願望を表し得る語だが、この文脈では罪へ向かわせる欲求を指す。「情欲」では性的意味に狭まりやすいため避けた。
- source_word: ἐξελκόμενος
  choice: 引き出され
  rationale: 外へ引き出す、引き離すという動きを保ち、続く罠や餌の比喩とつながる表現にした。
- source_word: δελεαζόμενος
  choice: おびき寄せられる
  rationale: 餌で誘い、罠へ導く比喩を、理解しやすい現代日本語で表した。
theological_decisions:
- issue: 誘惑の源と神との関係
  choice: 誘惑の直接的な源を、その人自身の欲望として訳した。
  alternative: 外的な試練や状況によって試される、という意味に弱める。
  rationale: 13節は神が人を誘惑することを否定し、14節は各人の欲望を誘惑の直接的な源として示す。ただし、本文を越えてより広い因果論までは加えない。
- issue: 代表単数の表現
  choice: 「一人ひとり」「自分自身」を用いた。
  alternative: 「人々」「彼ら自身」と複数化する。
  rationale: 原文の単数による個別化と、各人の責任への焦点を、日本語で性別を不自然に限定せずに保持する。
- issue: 二つの受動分詞の関係
  choice: 「誘惑されるのは……からです」として原因・過程を表した。
  alternative: 「誘惑され、引き出され、おびき寄せられる」と並列する。
  rationale: 分詞は、欲望が人を引き出して誘い込むことによって誘惑が生じる過程を説明している。日本語では理由の構文がその関係を明確かつ自然に表す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「一人ひとり」で原文の個別的強調を示し、「欲望」は意味を性的領域に限定しない語を選んだ。二つの比喩的分詞は、平易さを保ちながら餌や罠のイメージが感じられる表現にした。
