base_translation:
  language: en
  yaml_path: translation/nt/james/001/016.yaml
  text: Do not be deceived[a], my beloved brothers.
translation:
  language: ja
  text: 私の愛する兄弟たち[a]、惑わされてはいけません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せる。ギリシア語の「兄弟たち」は、女性を含む信仰者全体への呼びかけとして使われることがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: 惑わされてはいけません
  rationale: μήを伴う現在命令形の禁止を、自然な現代日本語の否定命令で表した。πλανᾶσθεはここでは、誤った考えに陥ることへの警告として受動的な「惑わされる」が適切であり、継続・中止などの相を文脈以上に限定しない。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 呼格男性複数の語形を本文で保った。共同体全体を指し、女性を含み得ることは脚注で明示する。
- source_word: μου
  choice: 私の
  rationale: 話し手と読者との親しい関係を示す所有表現として素直に訳した。
- source_word: ἀγαπητοί
  choice: 愛する
  rationale: 親愛を込めた呼びかけを、現代日本語として自然で品位のある「愛する」で表した。「私の兄弟たち」に先行させることで、日本語の呼びかけとしての流れも整えた。
theological_decisions:
- issue: キリスト者共同体への性別を伴う呼びかけ
  choice: 本文ではἀδελφοίを「兄弟たち」とし、女性を含む共同体全体への呼びかけになり得ることを脚注で示す。
  alternative: 「兄弟姉妹たち」または「信仰の仲間たち」
  rationale: 原文の男性複数形を本文に反映しつつ、その代表的・包括的な指示範囲を隠さないため。
translation_notes:
  register: 簡潔で切迫感のある禁止命令と、温かな牧会的呼びかけを両立させた。語順は自然な現代標準日本語に整えつつ、原文の呼びかけと命令の関係を保持した。
