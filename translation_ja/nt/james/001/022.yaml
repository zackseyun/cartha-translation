  text: Γίνεσθε δὲ ποιηταὶ λόγου καὶ μὴ ⸂ἀκροαταὶ μόνον⸃ παραλογιζόμενοι ἑαυτούς.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/022.yaml
  text: But be doers of the word[a], and not hearers only, deceiving yourselves.
translation:
  language: ja
  text: しかし、みことばを行う者になりなさい。ただ聞くだけの者となって、自分を欺いてはいけません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分を惑わしている」、または「誤った理屈で自分を欺いている」とも訳せる。
    reason: παραλογιζόμενοι は、単なる欺きだけでなく、誤った推論によって自分を迷わせる含みを持ちうるため。
lexical_decisions:
- source_word: Γίνεσθε
  choice: 者となりなさい
  rationale: 現在命令の継続的な勧告を表しつつ、「なりなさい」という自然な命令形で生き方の転換と持続を伝える。
- source_word: δὲ
  choice: しかし
  rationale: 前節までの「みことばを受け入れなさい」という勧めを受け、聞くだけで終わる態度との対比を明確にする。
- source_word: ποιηταὶ λόγου
  choice: みことばを行う者
  rationale: ποιηταί と ἀκροαταί の名詞的な対照を保つ。「みことば」は直前の1章21節との連続性と聖書的響きを保ち、「行う」は内容を実践する意味を簡潔に示す。
- source_word: ἀκροαταὶ μόνον
  choice: みことばを聞くだけで
  rationale: μόνον の限定を自然な現代日本語で示し、単なる聴取と実践との対照を明瞭にする。
- source_word: παραλογιζόμενοι ἑαυτούς
  choice: 自分を欺く
  rationale: 自己欺瞞という中心的意味を明快に表す。動詞に含まれうる誤った推論による自己惑乱の含意は脚注に残す。
theological_decisions:
- issue: λόγος の意味
  choice: みことば
  alternative: ことば／教え／知らせ
  rationale: 1章21節の「植えつけられたことば」とのつながりを保ちながら、それを特定の教理概念に狭く限定しない。
- issue: Γίνεσθε の命令の力
  choice: みことばを行う者となりなさい
  alternative: みことばを行う者でありなさい
  rationale: 語形上は「なる」の意味を素直に反映しつつ、現在命令が示す継続的な生き方への勧告として読める表現にした。
- issue: 分詞 παραλογιζόμενοι の関係
  choice: 聞くだけで、自分を欺く者となってはいけません
  alternative: 自分を欺いて、聞くだけの者となってはいけません
  rationale: 聞くだけで実行しないことが自己欺瞞を伴うという論理を自然な日本語で表し、因果関係を必要以上に断定しない。
translation_notes:
  register: 明快で現代的ながら、聖書本文としての品位を保つ。「実践する」よりも「行う」を採用し、「聞く者／行う者」という文脈上の対照を自然に示した。脚注記号[a]は本文末に置き、節全体の自己欺瞞表現に対応させた。
