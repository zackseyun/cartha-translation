  text: ὀργὴ γὰρ ἀνδρὸς δικαιοσύνην θεοῦ ⸂οὐκ ἐργάζεται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/020.yaml
  text: For a man's anger does not produce God's righteousness.
translation:
  language: ja
  text: 人の怒りは、神の義を実現しないからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀργὴ ... ἀνδρός
  choice: 人の怒り
  rationale: 属格を自然な日本語で表し、特定の一人の男性ではなく、人間が抱く怒りという一般的な意味を保った。
- source_word: δικαιοσύνην θεοῦ
  choice: 神の義
  rationale: 「神が求める正しさ」などと解釈を限定せず、神に由来する義、神の前での義、神が成し遂げる義を含み得る原文の属格の幅を保った。
- source_word: οὐκ ἐργάζεται
  choice: 実現しない
  rationale: ἐργάζομαι の「生み出す・成し遂げる・もたらす」という働きを、この文脈で簡潔かつ自然に表した。
theological_decisions:
- issue: 「神の義」（δικαιοσύνη θεοῦ）の属格の解釈
  choice: 「神の義」とし、意味を限定しない
  alternative: 「神が求める正しさ」「神の正義」
  rationale: 原文は複数の理解を許すため、神の基準にかなう正しさだけに狭めず、神に属する義という神学的緊張と曖昧さを残した。
- issue: 人の怒りと義の関係
  choice: 「実現しない」
  alternative: 「生み出さない」
  rationale: 怒りが神の義を達成する手段にはならないという主張を表しつつ、義そのものを人が産出するとの含意を避けた。
translation_notes:
  register: 明瞭で現代的な標準語。「からです」により前節への理由説明である γάρ を自然に示し、簡潔ながら威厳のある文体とした。
