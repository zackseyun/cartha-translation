source:
  edition: SBLGNT
  text: Πᾶσα δόσις ἀγαθὴ καὶ πᾶν δώρημα τέλειον ἄνωθέν ἐστιν, καταβαῖνον ἀπὸ τοῦ πατρὸς τῶν φώτων, παρ’ ᾧ οὐκ ἔνι παραλλαγὴ ἢ τροπῆς ἀποσκίασμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/017.yaml
  text: Every good gift and every perfect gift is from above[a], coming down from the Father of lights[b], with whom there is no variation or shadow of turning.
translation:
  language: ja
  text: 良い贈り物[a]はすべて、また完全な賜物はすべて、上から、光の父から下って来ます。この方には、変化も、移り変わる影[b]もありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 最初の「贈り物」に当たる語は、「良いものを与えること」と訳すこともできます。次の「賜物」に当たる語は、与えられた物そのものをより強く表します。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「転じることの影」または「転じることによって生じる影」。天の光の動きに伴って影が移り変わることを暗示している可能性があります。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα δόσις ἀγαθὴ
  choice: 良い贈り物はすべて
  rationale: δόσιςは「与えること」と「与えられたもの」のどちらも表し得る。本文では自然な日本語として「贈り物」とし、行為を強調する可能性は脚注に残した。Πᾶσαの一つ一つに及ぶ意味は「すべて」で表した。
- source_word: πᾶν δώρημα τέλειον
  choice: 完全な賜物はすべて
  rationale: δώρημαは与えられた物を指すため「賜物」とした。先行するδόσιςとの語の違いも日本語で示し、τέλειονは欠けのない、十分に良いという含みを保って「完全な」とした。
- source_word: ἄνωθέν ἐστιν, καταβαῖνον
  choice: 上から、…下って来ます
  rationale: ἄνωθενの起源を示す「上から」と、現在分詞καταβαῖνονの下降のイメージを、自然な日本語の一続きの表現にした。
- source_word: ἀπὸ τοῦ πατρὸς τῶν φώτων
  choice: 光の父から
  rationale: 「光の父」という比喩を保持し、本文で天体や創造者という解釈に限定しなかった。複数形τῶν φώτωνは、日本語では集合的な「光」で自然に表した。
- source_word: παρ’ ᾧ οὐκ ἔνι παραλλαγὴ
  choice: この方には、変化も…ありません
  rationale: παρ’ ᾧを神との関係・その方における性質として自然に表し、παραλλαγήは「変化」と訳した。神の不変性を教理的に敷衍せず、原文の否定命題を保った。
- source_word: ἢ τροπῆς ἀποσκίασμα
  choice: 移り変わる影も
  rationale: 難解な属格表現を、現代日本語で理解でき、かつ光と影の比喩を残す形にした。「回転による影」という可能性は脚注で明示した。否定文中のἢは日本語の並列「も…もない」で表した。
theological_decisions:
- issue: 「光の父」と神の不変性を結ぶ比喩
  choice: 比喩を本文に残し、神には変化も移り変わる影もないと訳す
  alternative: 「天の光を造られた父」と説明し、末尾を「決して変わらない」と抽象化する
  rationale: 原文は、変化する光や影を想起させつつ、神については変化を否定している。本文でその比喩を天体に限定したり、抽象的な教理表現に置き換えたりせず、原文の神学的緊張と詩的イメージを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「光の父」「上から下って来る」「移り変わる影」という原文の格調ある比喩を保持した。「賜物」は日常語よりやや改まった語だが、δώρημαを「贈り物」と区別し、この文脈にふさわしい尊厳を保つため採用した。
