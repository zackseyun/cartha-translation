id: JAS.1.25
reference: James 1:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ δὲ παρακύψας εἰς νόμον τέλειον τὸν τῆς ἐλευθερίας καὶ παραμείνας, ⸀οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος ἀλλὰ ποιητὴς ἔργου, οὗτος μακάριος ἐν τῇ ποιήσει αὐτοῦ ἔσται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/025.yaml
  text: But the one who has looked intently into the perfect law[a], the law of freedom[c][b], and has continued in it—not becoming a forgetful hearer but a doer of the work—this one will be blessed in his doing.
translation:
  language: ja
  text: しかし、完全な律法、すなわち自由の律法[a]を注意深くのぞき込み、そこにとどまる人、すなわち、聞いて忘れる者ではなく行いをする者は、自分の行いにおいて祝福されるでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自由の完全な律法」。
    reason: 「完全な」と「自由の」の双方が「律法」を修飾するまとまりとして訳すこともできるため。
lexical_decisions:
- source_word: παρακύψας
  choice: 注意深くのぞき込み
  rationale: 身をかがめて中をのぞくという語の具体性と、注意深く見るという文脈上の含意を、自然な現代日本語で表した。
- source_word: νόμον τέλειον τὸν τῆς ἐλευθερίας
  choice: 完全な律法、すなわち自由の律法
  rationale: τὸν τῆς ἐλευθερίαςを同格と捉え、原文の構造を保つため「律法」を繰り返した。「自由を与える律法」とはせず、属格の解釈を限定していない。
- source_word: παραμείνας
  choice: そこにとどまる
  rationale: 一時的に見るだけでなく、先に述べた律法との関わりを持続することを示す。「守り続ける」として従順の意味だけに限定することは避けた。
- source_word: οὐκ ἀκροατὴς ἐπιλησμονῆς γενόμενος
  choice: 聞いて忘れる者ではなく
  rationale: 直訳的な「忘却の聞き手」より自然であり、属格が表す性質を明瞭に伝える。
- source_word: ποιητὴς ἔργου
  choice: 行いを実践する者
  rationale: ἔργουを明示しつつ、日本語で不自然な「行いの行い手」を避けた。直前の「聞く」との対比も保たれる。
- source_word: μακάριος
  choice: 祝福されます
  rationale: 単なる主観的な幸福や幸運ではなく、神からの恵みを含み得る語の宗教的な響きを保った。
- source_word: ἐν τῇ ποιήσει αὐτοῦ
  choice: 自分の行いにおいて
  rationale: 先行する「実践する者」との語義的な連関を保ち、行為の領域において祝福されるという表現を明示した。
- source_word: ὁ ... οὗτος
  choice: …人は…その人は
  rationale: 単数の代表的用法を保ちながら、男性だけを指すとの誤解を避ける自然な日本語とした。
theological_decisions:
- issue: 「自由の律法」の意味
  choice: 「自由の律法」という表現をそのまま保つ
  alternative: 「自由を与える律法」または福音・成就された道徳律などと明示する
  rationale: 原文は自由と律法の関係を一義的に説明していないため、神学的な豊かさと緊張を保ち、特定の教派的解釈に限定しない。
- issue: 律法への持続的な関わり
  choice: 「そこにとどまる」
  alternative: 「それを守り続ける」
  rationale: παραμένωの持続性を表しつつ、それをただちに律法遵守という一側面だけへ狭めない。
- issue: 一般的な男性単数形の扱い
  choice: 「人」「その人」
  alternative: 「男」または男性代名詞を用いる
  rationale: 文脈上は男性限定ではなく、一般的・代表的な単数であるため、その範囲と単数性をともに保った。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の「見る―とどまる」「聞く―行う」という対照を保ち、過度に逐語的で不自然な表現は避けた。
