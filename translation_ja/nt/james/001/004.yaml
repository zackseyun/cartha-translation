source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ ἔργον τέλειον ἐχέτω, ἵνα ἦτε τέλειοι καὶ ὁλόκληροι, ἐν μηδενὶ λειπόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/004.yaml
  text: And let endurance have its perfect work[a], so that you may be mature and complete, lacking in nothing.
translation:
  language: ja
  text: 忍耐には、その働きを十分に果たさせなさい。[a] あなたがたが成熟し、完全な者となり、何一つ欠けることがないようになるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「忍耐には完全な働きをさせなさい」。ここで「十分に果たす」と「成熟した／完全な」と訳したギリシア語は、意図された終わりに達することを表す関連語です。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπομονὴ
  choice: 忍耐
  rationale: 試練の下で踏みとどまり続けることを表す。直前の試練の文脈に合い、現代日本語でも自然である。
- source_word: ἔργον τέλειον ἐχέτω
  choice: その働きを最後まで全うさせなさい
  rationale: 直訳的な「完全な働きを持たせる」は不自然なため、忍耐の働きが意図された終わりに達するという意味と、三人称命令の勧告を自然な日本語で表した。
- source_word: ἵνα ἦτε
  choice: そうすれば、あなたがたは…者となり
  rationale: 目的と結果の両面を帯びうる表現なので、日本語では文脈上自然な帰結を示しつつ、成熟へ向かう目的性も保った。
- source_word: τέλειοι
  choice: 成熟し
  rationale: 人について、目標に達した成熟を指しうる語であり、罪のない絶対的完全という解釈に限定しない。
- source_word: ὁλόκληροι
  choice: 欠けたところのない者
  rationale: あらゆる部分がそろった全体性を表し、τέλειοιとの意味の重なりと違いを保つ。
- source_word: ἐν μηδενὶ λειπόμενοι
  choice: 何一つ不足することがありません
  rationale: どの点にも欠乏がないという包括的な意味を、明瞭で自然な現代日本語にした。
theological_decisions:
- issue: 聖化の文脈における τέλειοι の意味
  choice: 成熟し
  alternative: 完全な者となり
  rationale: 霊的成長が意図された到達点に至ることを表しうるため、「成熟」とした。現世での無罪の完全を断定せず、同時に語の目標到達の含意を脚注で示す。
- issue: ἵνα 節の目的・結果の関係
  choice: そうすれば
  alternative: それは、あなたがたが…となるためです
  rationale: 試練の中で忍耐に働きを全うさせることから生じる結果を自然に示す。ただし原文には目的の含みもあるため、一方だけを教理的に固定しない。
translation_notes:
  register: 明瞭な現代標準語を用い、勧告としての力を保った。「全うさせなさい」はやや格調を備えるが一般読者にも理解でき、原文の完成・目標到達という語のつながりを伝える。
