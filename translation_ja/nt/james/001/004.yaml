revisions:
- from: 忍耐には、その働きを最後まで全うさせなさい。[a] そうすれば、あなたがたは成熟し、欠けたところのない者となり、何一つ不足することがありません。
  to: 忍耐には、その働きを十分に果たさせなさい。[a] あなたがたが成熟し、完全な者となり、何一つ欠けることがないようになるためです。
  rationale: 原文の命令に続くἵνα節を、日本語でも目的を示す形に整えました。「十分に果たさせなさい」は、ἔργον τέλειον ἐχέτωを不自然な直訳にせず、忍耐がその働きを完全に果たすという意味を保ちます。「成熟し、完全な者となり、何一つ欠けることがない」は、τέλειοι、ὁλόκληροι、ἐν μηδενὶ λειπόμενοιの重なりつつ異なる強調を保持します。
