  timestamp: '2026-07-19T02:40:08Z'
review_pass:
  verdict: revise
  source_fidelity: 原文の三人称命令（ἐχέτω）と、忍耐の働きが完成に至るという趣旨は捉えられています。しかし「そうすれば」はἵναの目的性を結果へやや限定し、「何一つ不足することがありません」は直前の「者となり」と統語的につながりにくく、現在形の断定にも聞こえます。
  naturalness: 「忍耐には、その働きを最後まで全うさせなさい」は理解可能ですが、「働きを十分に果たさせなさい」の方が現代標準語としてやや自然です。後半は目的節として一続きに整える必要があります。
  terminology: 「忍耐」「成熟」は適切です。ὁλόκληροιには「完全な者」を用い、後続の「何一つ欠けることがない」で全体性・欠乏のないことを具体化します。「完全」が無罪性を一義的に断定しないよう、文脈上「成熟」と並置し、脚注で語の連関を示します。
  issues:
  - severity: medium
    issue: ἵνα節の目的性と日本語の統語
    rationale: 「そうすれば」は目的・結果を結果寄りに狭めます。また「…者となり、何一つ不足することがありません」は、連用形の「となり」に現在形の述語が続くため不均衡です。目的を表す「…となるためです／…ようになるためです」として一続きにします。
  - severity: low
    issue: 「最後まで全うさせなさい」の表現
    rationale: 意味は通りますが、「全う」はやや硬く、「最後まで」はτέλειονの意味を時間的完了に寄せます。「十分に果たさせなさい」は、働きが完全にその役割を果たすという文脈上の意味を自然に示します。
  revised_text: 忍耐には、その働きを十分に果たさせなさい。[a] あなたがたが成熟し、完全な者となり、何一つ欠けることがないようになるためです。
