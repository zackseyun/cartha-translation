  text: Καυχάσθω δὲ ὁ ἀδελφὸς ὁ ταπεινὸς ἐν τῷ ὕψει αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/009.yaml
  text: But let the lowly brother boast in his exaltation[b][a],
translation:
  language: ja
  text: しかし、低い立場にある兄弟[a]は、自分の高い立場[b]を誇りとしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「低い立場にある兄弟、または姉妹」の意にも取れる。ギリシア語は男性単数の「兄弟」だが、仲間の信者を代表して指している場合がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼の高さにおいて」。神の前で与えられた尊い立場を指すことがあり、現在または将来における立場の逆転を含み得る。
    reason: alternative_reading
lexical_decisions:
- source_word: Καυχάσθω
  choice: 誇りなさい
  rationale: 現在中態命令の勧告を自然な日本語で表しつつ、καυχάομαι の「誇る」という語義を保つ。誇りの根拠は自己ではなく、神から与えられた高い立場にある。
- source_word: δὲ
  choice: しかし
  rationale: 前後の流れにおける穏やかな対比と、9–10節の「低い身分」と「富んでいる者」の対照を示す。
- source_word: ὁ ἀδελφὸς
  choice: 兄弟
  rationale: ギリシア語の男性単数を保つ。ここでは共同体に属する信者を指し、代表的に用いられている可能性は脚注で示す。
- source_word: ὁ ταπεινὸς
  choice: 低い身分にある
  rationale: 社会的・経済的に低い立場と、へりくだった状態の双方に開かれた表現であり、「貧しい」または「謙遜な」に限定しない。
- source_word: ἐν τῷ ὕψει αὐτοῦ
  choice: 自分が高くされたことを
  rationale: 直訳的な「彼の高さ」を不自然にせず、ὕψος の高揚・高い地位という意味と文脈上の逆転を表す。現在の神の前での尊い立場と将来の高揚のどちらか一方には限定しない。
theological_decisions:
- issue: 低い身分の信者の「高さ／高揚」の意味
  choice: 神によって高くされたことを指す表現とし、現在の尊い立場と将来の逆転の双方に余地を残す。
  alternative: 現在の社会的上昇だけ、神の前での霊的身分だけ、または終末における将来の高揚だけを指すと限定する。
  rationale: 9–10節は低い者と富む者を対置し、逆転を語る。原文が持つ時間的・神学的な幅を狭めないためである。
- issue: ἀδελφός の性の表現
  choice: 本文では男性単数に対応する「兄弟」とする。
  alternative: 「兄弟姉妹」または「信者」とする。
  rationale: 原文の文法的形を保持しながら、共同体の成員を代表して用いられ得ることを脚注で補う。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「低い身分にある」は κοινων的な低さに限定しすぎず、「高くされたこと」は日本語として自然にしながら神的受動をほのめかす。脚注標識は該当句の直後に置いた。
