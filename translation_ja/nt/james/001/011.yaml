id: JAS.1.11
reference: James 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀνέτειλεν γὰρ ὁ ἥλιος σὺν τῷ καύσωνι καὶ ἐξήρανεν τὸν χόρτον, καὶ τὸ ἄνθος αὐτοῦ ἐξέπεσεν καὶ ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ ἀπώλετο· οὕτως καὶ ὁ πλούσιος ἐν ταῖς πορείαις αὐτοῦ μαρανθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/011.yaml
  text: For the sun rose with its scorching heat and dried up the grass[a], and its flower fell off and the beauty of its appearance perished[b]; so also the rich man will wither away in the midst of his pursuits.
translation:
  language: ja
  text: というのも、太陽が焼けつく暑さ[a]を伴って昇り、草を枯らし、その花は落ち、その姿の美しさは失われたからです。それと同じように、富んでいる人も、自分の活動[b]のただ中でしおれていくでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「焼けつく熱風」。ギリシア語「カウソーン」は、強烈な暑さを指すほか、それをもたらす熱風を指すこともあります。
    reason: lexical_alternative
  - marker: b
    text: 別訳「自分の旅の中で」。ここでのギリシア語は、文字どおりの旅のほか、その人が進めている活動や企てを広く指すことがあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέτειλεν
  choice: 昇り
  rationale: 太陽が昇るという具体的な情景を、自然な現代日本語で表した。アオリストの叙述的な働きは、一般的な情景を描く日本語の連用形で伝えている。
- source_word: σὺν τῷ καύσωνι
  choice: 焼けつくような暑さとともに
  rationale: καύσωνは強烈な暑さを指し、熱風を指すこともある。本文では太陽との結びつきが自然な「暑さ」を採用し、別解を脚注に残した。
- source_word: ἐξήρανεν τὸν χόρτον
  choice: 草を枯らす
  rationale: 熱によって草が乾燥し、しおれて枯れる作用を、日本語として簡潔かつ具体的に表した。
- source_word: τὸ ἄνθος αὐτοῦ ἐξέπεσεν
  choice: その花は落ち
  rationale: ἐκπίπτωの物理的な「落ちる」という像を保った。αὐτοῦは直前の草を受けるため「その」とした。
- source_word: ἡ εὐπρέπεια τοῦ προσώπου αὐτοῦ
  choice: 見た目の美しさ
  rationale: πρόσωπονを植物について不自然な「顔」とせず、「外観」の意味を自然な日本語で示し、εὐπρέπειαの美しさを保った。
- source_word: ἀπώλετο
  choice: 失われる
  rationale: ここでは花の外観の美が消失することを表すため、過度に強い「滅びる」ではなく「失われる」とした。
- source_word: ὁ πλούσιος
  choice: 富んでいる人
  rationale: 冠詞付き形容詞の実体的用法を、富裕な人を指す自然な日本語で表した。文法上の男性形を日本語で不必要に男性限定せず、代表的な人物への警告として訳した。
- source_word: ἐν ταῖς πορείαις αὐτοῦ
  choice: 自分の営みのさなかに
  rationale: πορείαの字義は旅・行程だが、複数形は人生における活動や企てを広く指し得る。文脈上の広がりを「営み」で示し、字義的別解を脚注に残した。
- source_word: μαρανθήσεται
  choice: 衰え果てる
  rationale: 植物がしおれ、色あせる比喩を人に適用する未来表現。直前の植物像を響かせつつ、富む人自身の衰退を自然に表した。
theological_decisions:
- issue: ὁ πλούσιοςが指す人物の性別と範囲
  choice: 富んでいる人
  alternative: 富んでいる男／富む者
  rationale: ギリシア語は男性単数形だが、ここでは富裕な人物を代表的に指す。日本語では性別を補わず、警告の一般的な適用範囲を狭めない訳を選んだ。
- issue: πορείαιςが指す活動の範囲
  choice: 営み
  alternative: 旅／道中／商い
  rationale: 字義的な旅に限定せず、その人が進めている活動や企て全般を含み得る表現とした。ただし原語の具体的な「旅」の可能性は脚注で明示した。
- issue: 植物の衰退と富む人への警告の対応
  choice: それと同じように、富んでいる人も…衰え果てる
  alternative: そのように、富んでいる人も…消え去る
  rationale: οὕτως καίの明示的な比較と、μαραίνωが保つ植物の比喩を維持し、警告の確実な未来性を「衰え果てるのです」で示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、草、花、美しさの消失、衰退という連続した比喩を保った。「というのも…からです」でγάρの説明的なつながりを示し、文末は聖書本文として落ち着きのある丁寧体に整えた。
