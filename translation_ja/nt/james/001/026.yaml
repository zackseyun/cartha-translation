  source_fidelity: 原文は、自己をθρησκός（宗教的・信心深い者）と見なす者が、自分の舌を制御せず、自己の心を欺いているなら、その者のθρησκείαはμάταιοςである、と述べる。現訳は自己評価、くつわの比喩、自己欺瞞、無益という結論を概ね正確に伝える。しかし「信仰深い」と「信仰の営み」は原文のθρησκός／θρησκείαの語の連関を弱め、前者は内面的な敬虔さへ、後者は「信仰」そのものへ意味を寄せうる。
