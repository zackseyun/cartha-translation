id: JAS.1.26
reference: James 1:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἴ τις δοκεῖ θρησκὸς ⸀εἶναι μὴ χαλιναγωγῶν γλῶσσαν ⸀αὐτοῦ ἀλλὰ ἀπατῶν καρδίαν ⸀αὐτοῦ, τούτου μάταιος ἡ θρησκεία.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/026.yaml
  text: If anyone thinks he is religious while not bridling his tongue but deceiving his heart[c][b][a], this person's religion is worthless.
translation:
  language: ja
  text: 自分は宗教的だと思いながら、自分の舌にくつわをかけず、自分の心を欺いている人の宗教は、むなしい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「むなしい」は、「無益である」「役に立たない」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: δοκεῖ
  choice: 思っていても
  rationale: この文脈では、外見上そう見えることよりも、自分自身を信仰深いと評価することを表す。条件文の流れに合わせて自然な日本語とした。
- source_word: θρησκὸς
  choice: 信仰深い
  rationale: 宗教的実践に熱心な者という意味を、現代日本語で自然に表す。「敬虔」は内面的徳を強く連想させるため避けた。
- source_word: χαλιναγωγῶν
  choice: 舌にくつわをかけず
  rationale: 動物を制御する「くつわ」の比喩を保ち、3章の舌に関する議論とのつながりも維持した。
- source_word: γλῶσσαν αὐτοῦ
  choice: 舌
  rationale: 単に「言葉」や「発言」とせず、原文の身体的で鮮明な表現を保った。日本語では主語から所有者が明らかなため、最初の αὐτοῦ は明示しない。
- source_word: ἀπατῶν καρδίαν αὐτοῦ
  choice: 自分の心を欺いている
  rationale: 「心」を内なる自己の座として保持し、再帰的な自己欺瞞を自然な日本語で示した。
- source_word: τούτου
  choice: その人の
  rationale: 直前に述べられた人物を指し示す原文の指示的な力を自然に表した。
- source_word: μάταιος
  choice: むなしい
  rationale: 成果も実質もないという評価を表しつつ、原語が持つ「空虚」「無益」の幅を保つ。
- source_word: ἡ θρησκεία
  choice: 信仰の営み
  rationale: ここでは宗教一般の体系ではなく、礼拝や実践を含む宗教的行為・あり方が問題にされているため。「信仰深い」との語形上の結びつきは弱まるが、現代日本語での誤解を避けた。
theological_decisions:
- issue: δοκεῖ の意味
  choice: 自分は信仰深いと思っていても
  alternative: 信仰深く見えても
  rationale: δοκεῖ は「思う」と「そう見える」の両義を持ち得るが、この文脈では「自分の心を欺く」と続くため、自己評価を前面に出した。別の可能性は脚注に示した。
- issue: θρησκεία の射程
  choice: 信仰の営み
  alternative: 宗教／宗教的実践
  rationale: ヤコブが信仰そのものを一律に否定しているような誤解を避けつつ、外面的な礼拝・実践を評価する文脈を表した。特定の教派的な宗教観は加えていない。
- issue: 一般的人物を指す男性単数形
  choice: その人／自分
  alternative: 彼／彼の
  rationale: ギリシア語の男性単数はここで一般的な人物を指す。日本語では性別を補わずに単数の指示を自然に保てるため、「その人」「自分」とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、格調を保った。「舌にくつわをかける」という原文の比喩は意図的に残した。脚注記号は該当する評価語の後ではなく、節全体の末尾に置き、本文の読みやすさを優先した。
