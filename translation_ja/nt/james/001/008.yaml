  text: a double-minded man[a], unstable in all his ways.
translation:
  language: ja
  text: 心が二つに分かれた人[a]は、その歩みのすべてにおいて不安定です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語では「男」（男性単数）を指す語ですが、ここでは一般に人を代表して述べていると考えられます。
    reason: gendered_representative_language
lexical_decisions:
- source_word: ἀνὴρ
  choice: 人
  rationale: 語形は男性単数だが、文脈では前節の願い求める者を代表的に指す。現代日本語では「人」が性別を限定せず、この一般的な力を自然に表す。
- source_word: δίψυχος
  choice: 心が二つに分かれた
  rationale: 直訳的には「二つの魂を持つ」だが、ここでは内面や忠誠が二つに割れ、揺れ動く状態を表す。「心が二つに分かれた」は比喩を保ちつつ現代日本語として理解しやすい。
- source_word: ἀκατάστατος
  choice: 不安定です
  rationale: 考えや行動に一貫性と確かさがないことを表す。「無秩序」よりも、この文脈で強調される定まらなさを適切に伝える。
- source_word: ἐν πάσαις ταῖς ὁδοῖς αὐτοῦ
  choice: その生き方のすべてにおいて
  rationale: ὁδοῖς は比喩的に、その人の歩みや行動全般を指す。「生き方」はこの比喩的意味を自然な現代日本語で伝え、「すべてにおいて」により πάσαις を保持する。
theological_decisions:
- issue: 男性単数形の代表的用法
  choice: 本文では「人」とする
  alternative: 「男」または「男性」
  rationale: ギリシア語 ἀνὴρ は男性単数形だが、ここで述べる性質は男性だけに限定されず、前節の願い求める者一般を代表的に指す。日本語の「人」は原文の指示範囲を自然かつ正確に表す。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「二心の者」のような文語的・教会用語的表現は避けた。原文の内面的分裂という比喩と、生活全般の不安定さとの緊張を保っている。
