id: JAS.1.2
reference: James 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πᾶσαν χαρὰν ἡγήσασθε, ἀδελφοί μου, ὅταν πειρασμοῖς περιπέσητε ποικίλοις,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/002.yaml
  text: Consider it all joy[a], my brothers, whenever you fall into various trials[b],
translation:
  language: ja
  text: 私の兄弟たち[a]、さまざまな試練[b]に遭うときはいつでも、それをこの上ない喜びと考えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の兄弟姉妹たち」とも訳せる。この男性複数形の呼びかけは、女性を含む信仰者の共同体全体を指している可能性が高い。
    reason: alternative_reading
  - marker: b
    text: このギリシア語は「試み」や、文脈によっては「誘惑」を意味することもある。ここでは、信仰を試す外的な困難を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσαν χαρὰν
  choice: この上ない喜び
  rationale: 述語補語として「全面的に喜びとみなす」という意味を表す句。直訳調の「あらゆる喜び」では日本語で意味が取りにくいため、程度と全体性を自然に伝える「この上ない喜び」とした。
- source_word: ἡγήσασθε
  choice: 考えなさい
  rationale: ἡγέομαιのアオリスト中動態命令法二人称複数であり、状況を一定のものとして評価・判断するよう命じる語。「考えなさい」は命令の力と知的評価の意味を自然な現代日本語で表す。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: 男性複数形の呼びかけを本文で形態に即して訳した。信仰共同体全体を指す可能性は脚注に示した。
- source_word: ὅταν
  choice: ときはいつでも
  rationale: 接続法περιπέσητεを伴う不定時の表現で、単発の特定時点ではなく「そのようなことが起こる場合にはいつでも」という含みを保つ。
- source_word: πειρασμοῖς
  choice: 試練
  rationale: 文脈では信仰を試す外的な困難を指すと理解するのが最も自然である。ただし語自体には「誘惑」や「試み」の意味域もあるため、脚注で幅を示した。
- source_word: περιπέσητε
  choice: 遭う
  rationale: 字義的には「中に落ち込む、出くわす」。日本語の「試練に遭う」は、不意に困難な状況に直面する意味を自然に表す。
- source_word: ποικίλοις
  choice: さまざまな
  rationale: 種類や様相の多様性を示す形容詞であり、簡潔で自然な対応語とした。
theological_decisions:
- issue: 書簡の呼びかけにおけるἀδελφοίの包括性
  choice: 本文は「私の兄弟たち」とし、共同体全体を含み得ることを脚注で示す。
  alternative: 「私の兄弟姉妹たち」
  rationale: 原文の男性複数形を見える形で保ちつつ、この呼びかけが女性を含む信仰共同体全体に向けられた可能性も明示し、どちらかを暗黙に排除しない。
- issue: πειρασμοῖςが指す試みの性質
  choice: 本文では外的困難を示す「試練」と訳す。
  alternative: 「誘惑」または「試み」
  rationale: 直後の文脈は信仰が試されることと忍耐を述べるため「試練」が適切である。一方、同語群は罪への「誘惑」にも用いられるので、その語義上の緊張を脚注に残す。
translation_notes:
  register: 明瞭な現代標準語を用い、命令の力を保ちながら過度に古風な表現を避けた。「私の兄弟たち」は書簡的で品位ある呼びかけとして残し、包括的な指示範囲は脚注で補った。
