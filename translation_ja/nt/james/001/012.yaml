id: JAS.1.12
reference: James 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μακάριος ἀνὴρ ὃς ὑπομένει πειρασμόν, ὅτι δόκιμος γενόμενος λήμψεται τὸν στέφανον τῆς ζωῆς, ὃν ⸀ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/012.yaml
  text: Blessed is the man who endures trial[a], because after he has been approved, he will receive the crown of life[b], which he promised to those who love him.
translation:
  language: ja
  text: 試練[a]に耐え抜く人は幸いです。その人は、試練を経て確かな者と認められた後、神がご自分を愛する人々に約束された、いのちの冠[b]を受けるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誘惑」または「試み」とも訳せます。ギリシア語は、困難による試練と罪への誘惑の両方を表し得ますが、ここでは試練に耐えることが強調されています。
    reason: lexical_alternative
  - marker: b
    text: 「冠」に当たるギリシア語は、王の冠ではなく、競技の勝者などに授けられる花冠や栄冠を指すことがあります。
    reason: cultural_note
lexical_decisions:
- source_word: Μακάριος
  choice: 幸いです
  rationale: 祝福を告げる表現として、主観的な感情だけを表す「幸福」よりも、聖書の祝福宣言にふさわしく、現代日本語でも理解しやすい。
- source_word: ἀνὴρ
  choice: 人
  rationale: 男性単数形だが、ここでは一般的・代表的に人を指す。日本語の「人」は原文の一般的な適用範囲を自然に伝える。
- source_word: ὑπομένει
  choice: 耐え抜く
  rationale: 圧力の下にとどまり、忍耐強く持ちこたえる継続的な意味を簡潔に表す。
- source_word: πειρασμόν
  choice: 試練
  rationale: 文脈は忍耐、吟味、報いを強調しているため「試練」が中心的意味に適する。ただし「誘惑」「試み」の意味域も脚注で保持する。
- source_word: δόκιμος γενόμενος
  choice: 試練を経て確かな者と認められた後
  rationale: 吟味を通過して真正・適格と認められる意味と、分詞の時間的関係を明瞭に伝える。受動態と断定しすぎず、結果としての承認を表す。
- source_word: λήμψεται
  choice: 受ける
  rationale: 約束された報いを将来受領するという通常の意味を自然に表す。
- source_word: στέφανον
  choice: 冠
  rationale: 伝統的で自然な訳語を保ちつつ、王冠に限らず勝者に授ける花冠・栄冠を指し得ることを脚注で説明する。
- source_word: τῆς ζωῆς
  choice: いのちの
  rationale: 属格の曖昧さを解釈的に「いのちである」「いのちを与える」と限定せず、原文に近い連結を保つ。
- source_word: ἐπηγγείλατο
  choice: 約束された
  rationale: アオリストの約束行為を表す。日本語では関係節を冠に自然に係らせ、敬意を伴う主体表現とした。
- source_word: τοῖς ἀγαπῶσιν αὐτόν
  choice: ご自分を愛する人々に
  rationale: 現在分詞が表す特徴的・継続的な愛を、日本語の自然な現在的表現で伝える。
theological_decisions:
- issue: ヤコブ1:12におけるπειρασμόςの意味
  choice: 試練
  alternative: 誘惑、試み
  rationale: 忍耐、吟味、冠という直近の文脈では、困難の下で試される意味が前面に出る。ただし同語が罪への誘惑も表し得る緊張を脚注で残した。
- issue: ἐπηγγείλατοの省略された主語
  choice: 主
  alternative: 神
  rationale: 本文には主語が明記されておらず、約束する方は文脈上神を指すと理解される。「主」は省略主語を補う必要のある日本語で自然だが、原文が固有の呼称を明記していない点には留意する。
- issue: τὸν στέφανον τῆς ζωῆςの属格関係
  choice: いのちの冠
  alternative: いのちである冠、いのちを与える冠
  rationale: 原文の属格が持つ可能性を狭めず、定着した簡潔な表現を維持する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「耐え抜く」で継続的な忍耐を表し、「いのち」は聖書本文として読みやすい平仮名表記とした。日本語では省略主語を補わないと約束者が直前の「人」に見えやすいため、「主」を補った。
