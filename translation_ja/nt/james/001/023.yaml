id: JAS.1.23
reference: James 1:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅτι εἴ τις ἀκροατὴς λόγου ἐστὶν καὶ οὐ ποιητής, οὗτος ἔοικεν ἀνδρὶ κατανοοῦντι τὸ πρόσωπον τῆς γενέσεως αὐτοῦ ἐν ἐσόπτρῳ,
base_translation:
  language: en
  yaml_path: translation/nt/james/001/023.yaml
  text: For if anyone is a hearer of the word and not a doer, this one is like a man carefully looking at the face of his birth[a] in a mirror,
translation:
  language: ja
  text: なぜなら、もし、みことばを聞くだけで実行しない人がいるなら、その人は、鏡で生まれつきの自分の顔[a]をじっと見ている男性に似ているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「自分の出生の顔」。すなわち、生まれつきの顔。
    reason: 原文の属格表現 τῆς γενέσεως αὐτοῦ の字義を示しつつ、本文の自然な訳語が指す意味を明らかにするため。
lexical_decisions:
- source_word: ἀκροατὴς λόγου
  choice: みことばを聞くだけ
  rationale: 名詞表現を自然な日本語の動詞表現にし、後続の「実行しない」と聞くこと・行うことの対照を明確にした。「だけ」は οὐ ποιητής との結びつきから補った。λόγος は文脈上、神からのことばを指すため「みことば」とした。
- source_word: ποιητής
  choice: 実行しない
  rationale: ここでは聞いたことばを行動に移す者を意味する。「行う者ではない」より自然で、倫理的な実践を表す「実行する」を用いた。
- source_word: ἔοικεν
  choice: 似ている
  rationale: 完了形ながら現在の状態を表す比較として、自然な日本語にした。
- source_word: ἀνδρὶ
  choice: 人
  rationale: ギリシア語は男性名詞だが、この比喩は不特定の誰にでも当てはまる。日本語の「男」は不要な性別限定として響くため、代表的・一般的な「人」とした。
- source_word: κατανοοῦντι
  choice: じっと見ている
  rationale: 単に一瞥するのでなく、注意を向けて観察する含意を、自然な日本語で表した。
- source_word: τὸ πρόσωπον τῆς γενέσεως αὐτοῦ
  choice: 生まれつきの自分の顔
  rationale: 字義的には「彼の出生の顔」だが、日本語では不自然である。出生以来の自然の顔という意味を明瞭にしつつ、原文特有の表現は脚注に残した。
- source_word: ἐν ἐσόπτρῳ
  choice: 鏡に映る
  rationale: 場所を表す前置詞句を、鏡像を見る場面として日本語で自然に表現した。
theological_decisions:
- issue: λόγος が指すもの
  choice: みことば
  alternative: ことば／教え
  rationale: 直前の文脈では神から植え付けられた「ことば」が念頭にあり、単なる一般的発言ではない。ただし本文に「神の」を補って指示内容を過度に限定することは避けた。
- issue: ἀνήρ の性別表現
  choice: 人
  alternative: 男
  rationale: 原語は文法的・語彙的に男性を示すが、比喩の適用対象を男性だけに限定する趣旨ではない。現代日本語で一般的な人物を表す自然な表現を優先した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての品位を保った。「みことば」は周辺文脈との連続性を示す慣用的な表記。節が次節へ続く理由説明であることを「というのも……からです」で示した。
