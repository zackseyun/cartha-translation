id: JAS.1.1
reference: James 1:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἰάκωβος θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ δοῦλος ταῖς δώδεκα φυλαῖς ταῖς ἐν τῇ διασπορᾷ χαίρειν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/001.yaml
  text: 'James[a], a servant of God and of the Lord Jesus the Messiah[c][b], to the twelve tribes in the Dispersion: greetings.'
translation:
  language: ja
  text: 神と主イエス・キリスト[a]の奴隷[b]であるヤコブから、離散している[c]十二部族へ。挨拶を送ります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「キリスト」は「メシア」、すなわち「油を注がれた者」という称号です。
    reason: 称号の意味を明示するため。
  - marker: b
    text: 「奴隷」と訳したギリシア語は、主人に属する者を意味します。「しもべ」とも訳せます。
    reason: 語の強さと訳語の選択肢を示すため。
  - marker: c
    text: 「離散」は、イスラエルの地の外に散って暮らすユダヤ人、またその状態を指す用語です。ただし、ここでの「十二部族」が文字どおり離散したユダヤ人だけを指すのか、より広く神の民を指すのかは明示されていません。
    reason: 歴史文化的背景と指示対象の曖昧さを保つため。
lexical_decisions:
- source_word: Ἰάκωβος
  choice: ヤコブ
  rationale: ギリシア語名のもとになったヘブライ語名に対応する、日本語聖書で定着した表記。英語の慣用名「James」には依存しない。
- source_word: θεοῦ καὶ κυρίου Ἰησοῦ Χριστοῦ
  choice: 神と主イエス・キリストの
  rationale: 二つの属格がδοῦλοςにかかる構造を保ち、κύριοςを称号「主」、Ἰησοῦを固有名「イエス」、Χριστοῦを日本語で定着した称号「キリスト」とした。
- source_word: δοῦλος
  choice: 奴隷
  rationale: 主人に属する者という語の強い意味を保持する。「しもべ」より現代語として明確であり、自己卑下だけでなく全面的な帰属を表す。
- source_word: ταῖς δώδεκα φυλαῖς
  choice: 十二部族へ
  rationale: イスラエルの契約共同体を想起させる表現を一般化せず、そのまま保持した。
- source_word: ἐν τῇ διασπορᾷ
  choice: 離散の地にいる
  rationale: διασποράのユダヤ的な準専門用語としての意味を保ちつつ、日本語で宛先として自然に読める形にした。
- source_word: χαίρειν
  choice: ごあいさつ申し上げます
  rationale: 手紙冒頭の定型句として訳し、語源的な「喜べ」ではなく文脈上の機能を伝えた。
theological_decisions:
- issue: Χριστόςを称号としてどう表すか
  choice: キリスト
  alternative: メシア
  rationale: 日本語では「イエス・キリスト」が定着しているが、称号としての意味が失われないよう脚注で「メシア」を明示した。
- issue: δοῦλοςによるヤコブの自己規定
  choice: 奴隷
  alternative: しもべ
  rationale: 神と主イエス・キリストへの全面的な帰属を示す強い語義を保った。ただし日本語の「奴隷」が伴う歴史的含意との差を脚注で補った。
- issue: 「十二部族」の指示対象
  choice: 十二部族という表現を保持
  alternative: 離散しているユダヤ人、または神の民
  rationale: 実際の離散ユダヤ人を指すのか、より広く神の民を象徴的に呼ぶのかを本文で決めず、原文の含みを保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、書簡冒頭として簡潔かつ端正な調子にした。「奴隷」は意図的に強いが、原語の帰属関係を明確にするため採用し、脚注で補足した。
