  text: μὴ γὰρ οἰέσθω ὁ ἄνθρωπος ἐκεῖνος ὅτι λήμψεταί τι παρὰ τοῦ κυρίου
base_translation:
  language: en
  yaml_path: translation/nt/james/001/007.yaml
  text: For that man must not suppose that he will receive anything from the Lord,[a]
translation:
  language: ja
  text: なぜなら、そのような人は、主から何かを受けることになると考えてはなりません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その男」。ギリシア語は男性単数形ですが、前節で述べられた、疑う一人の人を代表的に指しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γὰρ
  choice: そのような人は…と思ってはなりません
  rationale: γάρは前節の疑う人についての説明を続ける。日本語では「そのような」に前節との因果的・説明的なつながりを担わせ、禁止の力を「てはなりません」で自然に表した。
- source_word: οἰέσθω
  choice: 思ってはなりません
  rationale: οἴομαιの「思う、考える」という心的判断を直接表す。「期待する」では、受けることへの期待という文脈的意味を先取りしすぎるため避けた。
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: そのような人
  rationale: 直前に描かれた疑う者を指す。日本語の「人」は文法的性を表示しないため、自然な現代語として代表的な個人を指す表現にした。
- source_word: ὅτι
  choice: （内容節として表現）
  rationale: 日本語では引用内容を「と」で受けるのが自然であり、独立した語として訳さず構文に反映した。
- source_word: λήμψεταί
  choice: 受けられる
  rationale: λαμβάνωの未来形を、本人が将来受ける見込みについて思うという日本語の内容節に合わせて「受けられる」と表した。可能の意味を断定的に付加するのではなく、「受けることになると思うな」という期待内容を自然に示す。
- source_word: τι
  choice: 何か
  rationale: 否定は主節の禁止「思ってはならない」にかかるため、日本語では「何かを受けられると思ってはならない」が自然で、主から何らかのものを受けるとの見込みを全面的に退ける。
- source_word: παρὰ τοῦ κυρίου
  choice: 主から
  rationale: 属格を伴う παρά の源を示す意味を「から」で表し、κύριοςは指示対象を本文以上に限定せず「主」とした。
theological_decisions:
- issue: 「主」（τοῦ κυρίου）の指示対象
  choice: 主
  alternative: 神／主なる神
  rationale: ギリシア語は κύριος とだけ述べているため、「主」として曖昧さを保ち、本文が明示しない同定を訳文に加えない。
- issue: ὁ ἄνθρωπος ἐκεῖνος の性別表現
  choice: そのような人
  alternative: その男／その人
  rationale: ギリシア語は男性単数形だが、前節の疑う個人を代表的に指す。日本語の「人」は性別を限定せず、男性形の文法情報を自然に再現できないため、脚注で原文の形と代表的用法を明示する。
translation_notes:
  register: 明瞭で現代的ながら、勧告の厳粛さを保つ敬体。「思ってはなりません」で禁止を明確にし、「主」は聖書的な尊称として簡潔に保持した。
