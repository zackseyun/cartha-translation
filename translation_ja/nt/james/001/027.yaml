  source_fidelity: 原文の構文と意味をよく保っている。「父である神の御前で」は παρὰ τῷ θεῷ καὶ πατρί の評価・臨在の含意と、神と父が同一の方を指す関係を適切に表す。「信仰の実践」は θρησκεία の外に現れる敬虔な営みを自然に示し、「顧み」は ἐπισκέπτεσθαι の実際的な配慮を、「世に汚されないよう自分を守る」は ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου を忠実に伝えている。
