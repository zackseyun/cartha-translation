  terminology: 「父である神」「信仰の実践」「孤児」「やもめ」「世」は文脈に適した用語である。「世」を本文で簡潔に保ち、脚注で倫理的な用法を限定しているため、被造世界一般を否定する解釈を本文に持ち込んでいない。脚注aは「顧み」の訪問と積極的配慮の両面を適切に補っている。
