id: JAS.1.27
reference: James 1:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θρησκεία καθαρὰ καὶ ἀμίαντος παρὰ ⸀τῷ θεῷ καὶ πατρὶ αὕτη ἐστίν, ἐπισκέπτεσθαι ὀρφανοὺς καὶ χήρας ἐν τῇ θλίψει αὐτῶν, ἄσπιλον ἑαυτὸν τηρεῖν ἀπὸ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/027.yaml
  text: 'Religion that is pure and undefiled before God the Father is this: to care for orphans and widows in their affliction[b][a], and to keep oneself unstained from the world.'
translation:
  language: ja
  text: 父である神の御前で、清く、汚れのない信仰の実践とは、こういうことです。苦難の中にいる孤児ややもめを顧み[a]、世[b]に汚されないよう自分を守ることです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「顧み」は、「訪ねる」とも訳せるギリシア語です。ここでは、訪問するだけでなく、気遣い、実際に世話をすることも含みます。
    reason: lexical_alternative
  - marker: b
    text: ここでいう「世」は、被造世界そのものではなく、神に逆らう道徳的に腐敗した秩序を指します。
    reason: cultural_note
lexical_decisions:
- source_word: θρησκεία
  choice: 信仰の実践
  rationale: この語は信仰一般や宗教制度よりも、外に現れる礼拝・敬虔の営みを指す。「信仰の実践」は、ヤコブが強調する行動を伴う敬虔を現代日本語で自然に表す。
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: 清く、汚れのない
  rationale: 二つの形容語が重ねる道徳的・祭儀的な純潔の響きを保ちつつ、自然な日本語とした。
- source_word: παρὰ τῷ θεῷ καὶ πατρὶ
  choice: 父である神の御前で
  rationale: παρά＋与格の評価・臨在の意味を「御前で」で表し、θεῷ と πατρὶ が同じ方を指すことを「父である神」として明確にした。
- source_word: ἐπισκέπτεσθαι
  choice: 顧み
  rationale: 単なる訪問ではなく、実際に気遣い、必要に応じて世話をする意味を含められる語として選んだ。訪問の含意は脚注に示した。
- source_word: ὀρφανοὺς καὶ χήρας
  choice: 孤児ややもめ
  rationale: 社会的な保護を失った二つの集団を直接表す。「やもめ」は聖書特有の意味を保ちつつ、現代日本語でも理解可能である。
- source_word: ἐν τῇ θλίψει αὐτῶν
  choice: 苦難の中にいる
  rationale: θλῖψις の苦しみ、困窮、圧迫を含む重い意味を保ち、対象となる人々の状況を自然な日本語で示した。
- source_word: ἄσπιλον ἑαυτὸν τηρεῖν
  choice: 汚されないよう自分を守る
  rationale: 道徳的な汚染を避け続けるという比喩と、意識的に身を保つ τηρεῖν の意味を表した。ἑαυτόν の一般的用法は性別を限定しない「自分」とした。
- source_word: ἀπὸ τοῦ κόσμου
  choice: 世に
  rationale: κόσμος を解釈的に言い換えず「世」とし、神に逆らう道徳的秩序という文脈上の意味は脚注で補った。
theological_decisions:
- issue: 倫理的文脈における κόσμος の意味
  choice: 本文では「世」とし、神に逆らう道徳的秩序を指す文脈上の意味を脚注で示す。
  alternative: 世の腐敗／神に逆らう社会秩序
  rationale: 被造世界そのものを悪とする読みや、社会からの全面的隔離を命じる読みを避けながら、原文の簡潔さと神学的緊張を保つ。
- issue: ἑαυτόν の一般的な指示範囲
  choice: 「自分」と訳し、すべての読者に当てはまる格言として表す。
  alternative: 彼自身
  rationale: ギリシア語の男性単数形はここでは一般的に用いられており、男性だけを指すものではない。
- issue: θεῷ καὶ πατρὶ の関係
  choice: 「父である神」として一人の方への二つの呼称と解する。
  alternative: 神と父の御前で／私たちの父なる神の御前で
  rationale: 単一の冠詞を共有する表現は、神と父を別々の対象ではなく同一の方として示す。「私たちの」は原文にないため補わない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「宗教」は制度や宗派を連想させやすいため「信仰の実践」とし、孤児とやもめへの具体的な配慮と、自らを守る倫理的責任との並行を保った。
