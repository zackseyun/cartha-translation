id: JAS.1.15
reference: James 1:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἶτα ἡ ἐπιθυμία συλλαβοῦσα τίκτει ἁμαρτίαν, ἡ δὲ ἁμαρτία ἀποτελεσθεῖσα ἀποκύει θάνατον.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/015.yaml
  text: Then desire[a], after it has conceived, gives birth to sin; and sin, when it is fully grown[b], brings forth death.
translation:
  language: ja
  text: それから、欲望は身ごもって罪を産み、罪は成熟すると[a]死を生み出します。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「完成すると」。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα
  choice: それから
  rationale: 前節から続く誘惑、罪、死という進行の順序を自然な現代日本語で示す。
- source_word: ἐπιθυμία
  choice: 欲望
  rationale: 性的な意味に限定せず、文脈上の誤った願望全般を表す。
- source_word: συλλαβοῦσα
  choice: 身ごもると
  rationale: 分詞の先行的な意味を保ちつつ、受胎から出産へ続く比喩を簡潔で自然な日本語にする。
- source_word: τίκτει
  choice: 産み
  rationale: 出産の比喩を明確に保ち、欲望から罪が生じる展開を表す。
- source_word: ἁμαρτίαν
  choice: 罪
  rationale: 道徳的悪を指す標準的で正確な訳語。
- source_word: δὲ
  choice: （読点による連結）
  rationale: 強い対比ではなく展開の継続を示すため、日本語では接続詞を補わず並列させるのが自然。
- source_word: ἀποτελεσθεῖσα
  choice: 成長しきると
  rationale: 完成・成熟に達する意味を、生命的な誕生の比喩に調和させて表す。原語は単に『完成すると』とも取り得るため脚注を付す。
- source_word: ἀποκύει
  choice: 生み出します
  rationale: 再び出産に関わる語を用い、比喩を保ちながら直前の『産み』との不自然な反復を避ける。
- source_word: θάνατον
  choice: 死
  rationale: 原文どおり範囲を限定せず、簡潔で重い表現を保つ。
theological_decisions:
- issue: 欲望、罪、死を結ぶ比喩の性質
  choice: 受胎と出産を連ねた擬人化された比喩を保持する。
  alternative: 「欲望は罪につながり、罪は死につながる」と因果関係だけを説明する。
  rationale: 抽象的な因果表現に置き換えると、原文の鮮烈な出生の比喩と修辞的な力が失われる。
- issue: θάνατοςの範囲
  choice: 限定せず「死」と訳す。
  alternative: 「霊的な死」または「永遠の死」と特定する。
  rationale: 原文は死の種類を明示していないため、身体的、霊的、永遠のいずれかに限定する教理的説明を本文へ持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、受胎・出産・成長という原文の連続的な比喩を保った。「生み出します」により文体の品位と可読性を両立させた。
