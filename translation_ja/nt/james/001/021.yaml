id: JAS.1.21
reference: James 1:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: διὸ ἀποθέμενοι πᾶσαν ῥυπαρίαν καὶ περισσείαν κακίας ἐν πραΰτητι δέξασθε τὸν ἔμφυτον λόγον τὸν δυνάμενον σῶσαι τὰς ψυχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/021.yaml
  text: Therefore, having put away all filthiness and the overflow of wickedness, receive with meekness the implanted word, which is able to save your souls.
translation:
  language: ja
  text: ですから、あらゆる汚れと悪のあふれ[a]を捨て去り、柔和に[b]、あなたがたの内に植え付けられたことば[c]、すなわちあなたがたの魂[d]を救うことのできることばを受け入れなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「豊かな悪」「はびこる悪意」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「へりくだって」「穏やかに」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「生まれつき備わったことば」。伝統的には「接ぎ木されたことば」。
    reason: lexical_alternative
  - marker: d
    text: 「命」または「あなたがた自身」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: ですから
  rationale: 直前の勧めを受けた推論を、現代日本語で自然かつ明確に示す。
- source_word: ἀποθέμενοι
  choice: 捨て去り
  rationale: 主命令「受け入れなさい」に伴うアオリスト分詞。先行または一体となった行為を、日本語の連用形で自然に表す。
- source_word: πᾶσαν ῥυπαρίαν
  choice: あらゆる汚れ
  rationale: 道徳的な不潔さを表す鮮明な比喩を保ちつつ、過度な説明を加えない。
- source_word: περισσείαν κακίας
  choice: あふれる悪
  rationale: περισσείαの過剰・豊富という含みと、κακίαの広い倫理的意味を簡潔に保持する。
- source_word: ἐν πραΰτητι
  choice: 心を柔和にして
  rationale: 柔和さ、穏やかさ、へりくだって教えを受ける姿勢を表す。単なる対人的な優しさに限定しない。
- source_word: δέξασθε
  choice: 受け入れなさい
  rationale: 能動的に迎え入れることを求めるアオリスト命令形の力を自然に表す。
- source_word: τὸν ἔμφυτον λόγον
  choice: あなたがたの内に植え付けられたみことば
  rationale: ἔμφυτοςの「植え付けられた／生来の」という幅のうち、文脈に適した植栽の比喩を保つ。「内に」を補って日本語での係り受けを明確にする。
- source_word: τὸν δυνάμενον σῶσαι
  choice: このみことばは…救うことができます
  rationale: λόγονを修飾する分詞句を独立文にし、救う力があるという能力表現を明確で自然な日本語にする。
- source_word: τὰς ψυχὰς ὑμῶν
  choice: あなたがたの魂
  rationale: ψυχήの伝統的・神学的な重みを保ちつつ、「命」または「あなたがた自身」という意味の可能性は脚注に示す。
theological_decisions:
- issue: 救いの文脈における ψυχὰς ὑμῶν の意味
  choice: あなたがたの魂
  alternative: あなたがたの命／あなたがた自身
  rationale: 救いに関わる語の重みを保つ一方、ψυχήが人の命や自己全体を指し得る曖昧さを脚注で保持する。
- issue: ἔμφυτον λόγον の意味
  choice: あなたがたの内に植え付けられたみことば
  alternative: 生来備わっていることば／接ぎ木されたことば
  rationale: 神によって植え付けられたことばとも、すでに聞き手の内に根付いていることばとも理解できる幅を残し、その仕組みを本文で限定しない。
- issue: λόγος の訳語
  choice: みことば
  alternative: ことば
  rationale: 神からの救いのことばを指す文脈にふさわしい尊敬を示すが、特定の教派的理解やキリスト論的同定を本文に付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、命令の厳粛さを保った。「ですから」で論理関係を明示し、長いギリシア語文は二文に分けて可読性を高めた。「魂」は本文に保持し、その意味範囲を脚注で示した。
