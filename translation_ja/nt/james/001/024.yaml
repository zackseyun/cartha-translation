  text: κατενόησεν γὰρ ἑαυτὸν καὶ ἀπελήλυθεν καὶ εὐθέως ἐπελάθετο ὁποῖος ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/024.yaml
  text: For he looked at himself and went away[a], and immediately forgot what kind of person he was.
translation:
  language: ja
  text: 自分をよく見てから立ち去り、すぐに自分がどのような者であったかを忘れてしまうからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατενόησεν
  choice: よく見ても
  rationale: κατανοέωは注意深く見る、観察するという意味を持つ。鏡の比喩に合う自然な表現として「よく見る」とし、後続の動作との対照を日本語で明瞭にするため接続助詞「ても」を用いた。
- source_word: γὰρ
  choice: からです
  rationale: 前節の比喩を説明する機能を、現代日本語で自然な文末の「からです」によって示した。
- source_word: ἑαυτὸν
  choice: 自分を
  rationale: 再帰代名詞をそのまま「自分」と訳し、この節には明示されていない「顔」を補わなかった。
- source_word: ἀπελήλυθεν
  choice: 立ち去ると
  rationale: ἀπέρχομαιの完了形は立ち去った結果も帯びうるが、ここでは一連の動作を自然に示す「立ち去る」とした。「と」は、その直後に忘れるという展開を明瞭にする。
- source_word: εὐθέως
  choice: すぐに
  rationale: 即時性を保ちつつ、一般読者に自然で明快な現代日本語とした。
- source_word: ἐπελάθετο
  choice: 忘れてしまう
  rationale: 動詞の基本義を「忘れる」で表し、「しまう」によって、よく見たにもかかわらず忘れるという比喩の意外性を自然に伝えた。
- source_word: ὁποῖος ἦν
  choice: 自分がどのような者であったか
  rationale: ὁποῖοςの種類・性質を問う含意を「どのような者」で保持した。「者」は文脈上の一般的な人を指し、性別を限定しない。
theological_decisions:
- issue: 鏡の比喩における文法上の男性単数の一般的用法
  choice: 自分がどのような者であったか
  alternative: 自分がどのような男であったか
  rationale: ギリシア語の男性単数は、この文脈では男性だけを限定せず、一般的な例として機能している。「者」とすることで、その一般性を保った。
- issue: ὁποῖος ἦνの質的意味
  choice: どのような者であったか
  alternative: 自分が何者であったか
  rationale: ὁποῖοςは単なる身元や同一性よりも、どのような性質・ありさまであったかを表す。「何者」ではなく「どのような者」とし、その質的な意味を保持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。鏡を見る具体的動作と、直ちに自己のありさまを忘れる対照が自然に伝わるようにした。原文の動詞時制の相違を日本語の不自然な時制対応で再現せず、動作の連続として表現した。
