id: JAS.1.3
reference: James 1:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: γινώσκοντες ὅτι τὸ δοκίμιον ὑμῶν τῆς πίστεως κατεργάζεται ὑπομονήν·
base_translation:
  language: en
  yaml_path: translation/nt/james/001/003.yaml
  text: because you know that the testing of your faith produces endurance[a][b].
translation:
  language: ja
  text: あなたがたの信仰が試されること[a]が、忍耐[b]を生み出すと知っているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「試練を経て証明された、あなたがたの信仰の確かさ」。ギリシア語は、試す過程と、試すことによって明らかになった確かさのどちらをも指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「揺るがずに耐え抜く力」または「忍耐強さ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: 知っているからです
  rationale: 現在能動分詞で、2節の勧告を支える理由を表すと理解できる。日本語では文末に因果関係を明示することで、前節とのつながりを自然に示した。
- source_word: ὅτι
  choice: 〜と
  rationale: 知っている内容を導く接続辞として、現代日本語で自然な引用・内容節の「と」を用いた。
- source_word: τὸ δοκίμιον
  choice: 試されること
  rationale: 試す過程と、試して証明された性質の両方を指し得る語である。本文では文脈に合う試験の過程を明瞭に表し、結果・証明の意味は脚注に残した。
- source_word: ὑμῶν τῆς πίστεως
  choice: あなたがたの信仰
  rationale: 属格関係を自然に表した。この文脈の πίστις は、読者の信仰が試されることを指すため、「信仰」が明瞭で標準的である。
- source_word: κατεργάζεται
  choice: 生み出す
  rationale: ある働きが結果をもたらすという能動的・結果的な意味を、明快な現代日本語で表した。
- source_word: ὑπομονήν
  choice: 忍耐
  rationale: 困難の下で持ちこたえ続ける態度を表す語として、簡潔で聖書文脈にも一般読者にも通じる「忍耐」を採用した。粘り強さ・堅忍の含意は脚注に示した。
theological_decisions:
- issue: πίστις の訳語
  choice: 信仰
  alternative: 信頼、忠実さ
  rationale: ここでは読者が抱く信仰が試されるという意味が最も自然であり、「信仰」が神学的意味を狭めず、標準的かつ明瞭である。
- issue: δοκίμιον の過程と結果の曖昧さ
  choice: 本文では試される過程として訳す
  alternative: 試練を経て証明された信仰の確かさ
  rationale: 直前のさまざまな試練との論理的つながりから過程の意味が自然だが、ギリシア語は試験によって証明された真正さ・確かさも表し得るため、脚注で別解を保持した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、前節を受ける理由節であることを「〜からです」で示した。「信仰が試されることが、忍耐を生み出す」という簡潔な構文にして、原文の因果関係を保った。
