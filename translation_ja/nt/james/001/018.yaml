revisions:
- from: 神はご自身の意志で[a]、真理のことばによって私たちを生んでくださいました。それは、私たちが、神の造られたものの中で、いわば初穂[b]となるためです。
  to: 神はご自身の意志によって[a]、真理のことばによって私たちを生み出されました。それは、私たちが神の造られたものの、いわば初穂[b]となるためです。
  rationale: 受益を示す「くださる」を除き、出生の比喩を自然に保つ「生み出されました」に改めた。あわせて初穂の注釈を、その農耕的・献げ物としての意味が明確になるよう整えた。神の意志、真理のことば、目的、被造物全体との関係については、原文および英語監査記録の曖昧さを越えて解釈を加えていない。
