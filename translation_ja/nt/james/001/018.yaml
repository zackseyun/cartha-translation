id: JAS.1.18
reference: James 1:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: βουληθεὶς ἀπεκύησεν ἡμᾶς λόγῳ ἀληθείας, εἰς τὸ εἶναι ἡμᾶς ἀπαρχήν τινα τῶν αὐτοῦ κτισμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/james/001/018.yaml
  text: Having willed it[a], he gave birth to us by the word of truth[b], so that we might be a kind of firstfruits of his creatures.
translation:
  language: ja
  text: 神はご自身の意志によって[a]、真理のことばによって私たちを生み出されました。それは、私たちが神の造られたものの、いわば初穂[b]となるためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神は自ら望んで」。神ご自身の意志が、私たちを生み出す働きの源であることを表す。
    reason: alternative_rendering
  - marker: b
    text: 「初穂」は収穫の最初の実りで、神に献げられる特別な部分。ここでは、信じる者たちが神の造られたものの中で、最初の、神に献げられた部分であることを表す。
    reason: cultural_note
lexical_decisions:
- source_word: βουληθεὶς
  choice: ご自身の意志で
  rationale: 神の意志が主動作に先立ち、その源となっていることを自然な日本語で示す。特定の予定論や再生論を付加しない。
- source_word: ἀπεκύησεν
  choice: 私たちを生んでくださいました
  rationale: 「産む・生む」という誕生の比喩を保ち、1章15節で欲望が罪を「生む」表現との響き合いも残す。
- source_word: λόγῳ ἀληθείας
  choice: 真理のことばによって
  rationale: 与格の手段用法を「によって」で表し、真実な知らせ、特に福音を指し得る聖書的表現の幅を保つ。
- source_word: εἰς τὸ εἶναι ἡμᾶς
  choice: それは、私たちが……となるためです
  rationale: 目的または意図された結果を表す構文を、決定論的に狭めず明瞭に訳す。
- source_word: ἀπαρχήν
  choice: 初穂
  rationale: 収穫の最初の部分であり神に献げられる部分という、祭儀的・農耕的な比喩を保持する。
- source_word: τινα
  choice: いわば
  rationale: 述語を限定する不定代名詞の働きを自然に表し、信者がある意味で初穂であるという含みを残す。
- source_word: τῶν αὐτοῦ κτισμάτων
  choice: 神の造られたものの中で
  rationale: 複数の被造物を広く指す表現を保ち、人類だけに範囲を狭めない。「中で」により、被造物全体に対する初穂という関係を明瞭にする。
theological_decisions:
- issue: 新しい誕生における神の主導性
  choice: 「神はご自身の意志で」とし、神の意志が誕生の源であることを示す。
  alternative: 「神はそう望んで」「神は御心のままに」
  rationale: ギリシア語は神の意志を行為に先行するものとして示すが、特定教派の予定論・再生論の全体系までは述べていないため。
- issue: κτισμάτωνの範囲
  choice: 「神の造られたもの」と広く訳す。
  alternative: 「全被造物」「神に造られた人々」
  rationale: 原文は造られた存在・物を広く指し得る。人間だけに限定する解釈を本文へ持ち込まないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、誕生と初穂の比喩を残した。「ことば」は聖書翻訳で定着した表記を採用し、全体を平易かつ品位ある敬体に整えた。
