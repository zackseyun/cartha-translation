source:
  edition: SBLGNT
  text: εἷς ⸀ἐστιν νομοθέτης ⸂καὶ κριτής⸃, ὁ δυνάμενος σῶσαι καὶ ἀπολέσαι· σὺ δὲ τίς εἶ, ⸂ὁ κρίνων⸃ τὸν ⸀πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/012.yaml
  text: There is one Lawgiver and Judge, the one who is able to save and to destroy. But who are you, judging your neighbor?
translation:
  language: ja
  text: 立法者であり裁判官である方は、ただひとりです。救うことも滅ぼすこともできる方です。だが、隣人を裁いているあなたは、いったい何者ですか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νομοθέτης
  choice: 立法者
  rationale: 法律を制定する権威を持つ者という語義を、簡潔かつ格調ある現代日本語で表した。
- source_word: κριτής / κρίνων
  choice: 裁判官／裁いている
  rationale: 同語根の関係を保ちつつ、前者は権威ある審判者、後者は隣人に対して現に行っている行為として訳し分けた。
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: 救うことも滅ぼすことも
  rationale: 救済と滅びの対照を原文どおり保持し、ἀπολέσαιを弱めずに訳した。
- source_word: πλησίον
  choice: 隣人
  rationale: 物理的な近隣者に限定されない、他者・同胞を指し得る聖書的用法を保つ定着した訳語を採用した。
theological_decisions:
- issue: 「立法者」と「裁判官」の唯一性
  choice: 「立法者であり裁判官である方は、ただひとりです」
  alternative: 「立法者、また裁判官はひとりだけです」
  rationale: εἷςを明示し、制定と審判の権威が同じ唯一の方に属することを自然な日本語で示した。
- issue: 修辞疑問における非難の強さ
  choice: 「隣人を裁いているあなたは、いったい何者ですか」
  alternative: 「あなたは何者なので、隣人を裁くのですか」
  rationale: 分詞ὁ κρίνωνの継続的・現行的な響きと、σὺ δὲ τίς εἶの鋭い問いを保ち、裁き一般を体系的に禁じる形へ過度に一般化しなかった。
translation_notes:
  register: 明瞭で現代的ながら、神の唯一の権威を語る箇所にふさわしい格調を維持した。「それなのに」と「いったい」により、δὲを伴う修辞疑問の対照と非難を自然に表した。
