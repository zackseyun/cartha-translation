id: JAS.4.2
reference: James 4:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐπιθυμεῖτε, καὶ οὐκ ἔχετε· φονεύετε καὶ ζηλοῦτε, καὶ οὐ δύνασθε ἐπιτυχεῖν· μάχεσθε καὶ πολεμεῖτε. οὐκ ἔχετε διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/002.yaml
  text: You desire and do not have[a]; you murder and envy and are not able to obtain; you fight and wage war[d][c][b]. You do not have because you do not ask.
translation:
  language: ja
  text: あなたがたは欲しがりますが、得られません。殺人を犯し、ねたみますが、手に入れることができません。争い、戦っています。あなたがたが得られないのは、求めない[a]からです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「求める」相手は文脈上、神であると考えられますが、原文では明示されていません。
    reason: cross_reference
lexical_decisions:
- source_word: ἐπιθυμεῖτε
  choice: 欲しがる
  rationale: 強い欲求を表し、この文脈では誤った欲望という否定的な響きを帯びる。「情欲を抱く」のように性的意味へ狭めず、現代日本語で自然に表した。
- source_word: οὐκ ἔχετε
  choice: 得られません
  rationale: 直訳的には「持っていない」だが、欲しているものを獲得できないという文脈と、後続の ἐπιτυχεῖν との流れを自然な日本語で表す。
- source_word: φονεύετε
  choice: 人を殺し
  rationale: φονεύω の強い字義を保ち、比喩や誇張と決めつけて弱めない。「殺人を犯す」より簡潔で自然な表現とした。
- source_word: ζηλοῦτε
  choice: ねたんでも
  rationale: 敵対的な文脈では否定的な「ねたむ」が適切であり、肯定的な「熱心になる」は採らない。
- source_word: οὐ δύνασθε ἐπιτυχεῖν
  choice: 手に入れることができません
  rationale: 望む対象に到達し、獲得することができない意を、明瞭な現代日本語で示す。
- source_word: μάχεσθε καὶ πολεμεῖτε
  choice: 争い、戦っています
  rationale: 二つの動詞を区別し、後者のより強い戦闘的な響きを「戦う」で保った。
- source_word: διὰ τὸ μὴ αἰτεῖσθαι ὑμᾶς
  choice: 求めないからです
  rationale: διά＋冠詞付き不定詞の原因を表す構文を自然に訳した。求める相手は文脈上神だが、原文には明示されていないため本文では補わない。
theological_decisions:
- issue: φονεύετε を比喩的・修辞的表現として弱めるか
  choice: 本文で「人を殺し」と強い語義を保つ
  alternative: 「憎む」「殺したいほど憎む」などと解釈的に訳す
  rationale: 原文自体の強烈な表現を維持し、それが文字どおりか修辞的かは翻訳で断定しない。
- issue: αἰτεῖσθαι の相手として神を明記するか
  choice: 「求めない」とし、目的語を補わない
  alternative: 「神に求めない」
  rationale: 周辺文脈では神が暗示されるが、この節のギリシア語本文には明示されていないため、その含意を本文で限定しない。
translation_notes:
  register: 明瞭で現代的かつ品位ある敬体。原文の短く畳みかける非難の調子を保ちつつ、日本語として理解しやすい節構造にした。脚注記号は該当する最終文の後に置いた。
