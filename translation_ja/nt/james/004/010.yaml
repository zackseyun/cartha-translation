  text: ταπεινώθητε ἐνώπιον ⸀κυρίου, καὶ ὑψώσει ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/010.yaml
  text: Humble yourselves before the Lord[b][a], and he will exalt you.
translation:
  language: ja
  text: 主の御前で[a]へりくだりなさい。そうすれば、主があなたがたを高く上げてくださいます[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主の臨在の中で」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「引き上げてくださいます」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταπεινώθητε
  choice: へりくだりなさい
  rationale: 受動形はこの勧告の文脈で再帰的・中動的な意味を帯び、「自らへりくだるように」との命令を表す。現代日本語として自然であり、自発的に身を低くするという意味を保つ。
- source_word: ἐνώπιον
  choice: 御前で
  rationale: 「前で」「臨在の中で」を意味する語。主に対する関係と、その臨在のもとにあることを簡潔かつ敬意ある日本語で表す。
- source_word: κυρίου
  choice: 主
  rationale: 定まった指示対象を持つ「主」と訳し、それが神か主イエスかを本文で限定しない。
- source_word: ὑψώσει
  choice: 高くしてくださいます
  rationale: 謙遜に続いて主が地位や誉れを高めるという比喩的意味を表す。「引き上げる」よりも、高くするという原語の像と尊厳ある語調を保つ。
- source_word: ὑμᾶς
  choice: あなたがたを
  rationale: 二人称複数の目的語であることを明示する。
theological_decisions:
- issue: 「主」の指示対象
  choice: 本文では「主」とし、神か主イエスかを特定しない。
  alternative: 「神」または「主イエス」と明示する。
  rationale: ヤコブ書では κύριος が神を指す場合もイエスを指す場合もあり、この句だけでは一方に限定できない。原文の曖昧さを保つ。
- issue: 後半の動作主
  choice: 「主が」と補って明示する。
  alternative: 主語を省略して「あなたがたを高くしてくださいます」とする。
  rationale: ギリシア語の三人称単数動詞の主語は直前の「主」と理解される。日本語でも動作主を明示することで約束の主体を分かりやすくしつつ、主の指示対象自体は限定しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「御前」「へりくだる」によって聖書本文にふさわしい端正さを保った。「そうすれば」は命令に続く約束という文脈上のつながりを自然に表す。
