id: JAS.4.15
reference: James 4:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀντὶ τοῦ λέγειν ὑμᾶς· Ἐὰν ὁ κύριος ⸀θελήσῃ, καὶ ⸀ζήσομεν καὶ ⸀ποιήσομεν τοῦτο ἢ ἐκεῖνο.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/015.yaml
  text: Instead, you ought to say, “If the Lord wills, we will live and also do this or that.”
translation:
  language: ja
  text: むしろ[a]、あなたがたはこう言うべきです。「主がお望みなら、私たちは生き、これやあれをするでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたがたが言う代わりに」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντὶ τοῦ λέγειν ὑμᾶς
  choice: むしろ、あなたがたはこう言うべきです
  rationale: 直訳は「あなたがたが言う代わりに」だが、前節の思い上がった発言を正す含意を、自然な現代日本語で明確にした。直訳形は脚注に残した。
- source_word: Ἐὰν
  choice: なら
  rationale: アオリスト接続法を伴う条件を、引用文として自然な日本語の条件表現で示した。
- source_word: ὁ κύριος
  choice: 主
  rationale: κύριος の基本的かつ伝統的な訳語。父なる神か主イエスかを訳文で特定せず、原文の余地を保った。
- source_word: θελήσῃ
  choice: お望み
  rationale: 神の意志を表す動詞 θέλω を尊敬表現で訳した。「御心」という名詞表現に置き換えず、原文の動詞性を保った。
- source_word: καὶ ζήσομεν
  choice: 私たちは生き
  rationale: 将来の生そのものが主の望みに依存することを示す。日本語では後続の「するでしょう」と並列させることで未来の意味が文全体に及ぶ。
- source_word: καὶ ποιήσομεν
  choice: これやあれをするでしょう
  rationale: ποιέω を広い意味の「する」とし、二つの καί による「生きること」と「行うこと」の並列を保ちつつ、過度な強調となり得る「さらに」は加えなかった。
- source_word: τοῦτο ἢ ἐκεῖνο
  choice: これやあれ
  rationale: 計画される種々の行為を指す不定的な対を、簡潔で自然な日本語にした。
theological_decisions:
- issue: 条件文における「主」の指示対象と効力
  choice: 「主」とだけ訳し、人の生命と行動が主の意志に依存することを示す。
  alternative: 「神」または「主イエス」と特定する。
  rationale: 原文は ὁ κύριος とだけ述べているため、父なる神と主イエスのどちらを特に指すかを翻訳で決めず、神学的な余地を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、引用文には簡潔で品位ある調子を保った。「主がお望みなら」は日常的にも理解でき、原文の動詞表現を直接反映する。
