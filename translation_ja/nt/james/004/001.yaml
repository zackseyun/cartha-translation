id: JAS.4.1
reference: James 4:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πόθεν πόλεμοι καὶ ⸀πόθεν μάχαι ἐν ὑμῖν; οὐκ ἐντεῦθεν, ἐκ τῶν ἡδονῶν ὑμῶν τῶν στρατευομένων ἐν τοῖς μέλεσιν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/001.yaml
  text: From where come wars and from where come fights among you? Is it not from here—from your pleasures that wage war in your members?[a][b][c]
translation:
  language: ja
  text: あなたがたの間の戦争は、どこから来るのでしょうか。争いは、どこから来るのでしょうか。[a][b] あなたがたの肢体の中で戦っている快楽からではありませんか。[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「戦争……争い」は、共同体内の対立を軍事的な語で表したもの。「争い」は「戦い」または「けんか」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたの間」は「あなたがたの中」とも訳せる。原文は、読者同士の対立と、一人一人の内側の葛藤のどちらをも示しうる。
    reason: alternative_reading
  - marker: c
    text: 「肢体」は直訳。身体の各部分、または広く人の内にあるさまざまな働きを指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Πόθεν ... πόθεν
  choice: どこから来るのでしょうか……どこから来るのでしょうか
  rationale: 起源を問う疑問副詞の反復を保ち、修辞的な畳みかけを自然な現代日本語で表した。
- source_word: πόλεμοι
  choice: 戦争
  rationale: 共同体内の深刻な対立を指す比喩だが、原文の強い軍事的イメージを保持した。
- source_word: μάχαι
  choice: 争い
  rationale: 「戦争」と区別しつつ、共同体内の口論や衝突を自然に表す語を選んだ。軍事語としての直訳「戦い」も可能であるため注記した。
- source_word: ἐν ὑμῖν
  choice: あなたがたの間
  rationale: ここでは読者共同体に生じている対人関係上の争いを第一義として表しつつ、内面的な意味の可能性を脚注に残した。
- source_word: οὐκ ἐντεῦθεν, ἐκ
  choice: ……からではありませんか
  rationale: 肯定の答えを期待する修辞疑問を明確にし、日本語では重複的になる「ここから、すなわち」を省いて直後の原因に直接つないだ。
- source_word: ἡδονῶν
  choice: 快楽
  rationale: 自己満足的な含みを持ちうる「楽しみ、快楽」の意味を直接保ち、「欲望」と解釈的に言い換えることを避けた。
- source_word: στρατευομένων
  choice: 戦っている
  rationale: 継続する内的抗争という軍事的イメージを保った。
- source_word: ἐν τοῖς μέλεσιν ὑμῶν
  choice: あなたがたの肢体の中で
  rationale: 身体部分または人間の諸機能を指しうる原文の身体的比喩と曖昧さを保持した。
theological_decisions:
- issue: 冒頭の争いを共同体内の対立と取るか、個人内部の葛藤と取るか
  choice: 最初のἐν ὑμῖνは「あなたがたの間」、後半は「あなたがたの肢体の中」と訳し、外的な争いと内的な快楽の戦いを結びつけた。
  alternative: 最初も「あなたがたの中」として内面的に訳す。
  rationale: 文脈上は共同体内の衝突が前景にあるが、ギリシア語は内面的な読みも許す。本文と脚注によって両面を保った。
- issue: ἡδοναίを道徳的に限定して訳すか
  choice: 「快楽」とし、それ自体に「罪深い」「悪い」などの限定を加えなかった。
  alternative: 「欲望」「情欲」「身勝手な欲望」と訳す。
  rationale: 文脈は否定的だが、原語の語義以上の神学的・道徳的限定を本文へ持ち込まないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。冒頭の二つの問いを分けて原文の反復と修辞的迫力を維持した。「肢体」は日常語よりやや文語的だが、身体的比喩と解釈上の幅を保存するため採用し、脚注で説明した。
