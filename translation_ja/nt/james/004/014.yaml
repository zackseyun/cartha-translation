  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: οἵτινες οὐκ ἐπίστασθε ⸀τὸ τῆς αὔριον ⸀ποία ἡ ζωὴ ὑμῶν· ἀτμὶς γάρ ⸀ἐστε ⸀ἡ πρὸς ὀλίγον φαινομένη, ⸀ἔπειτα καὶ ἀφανιζομένη·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/014.yaml
  text: You do not know what tomorrow will bring[a]. What is your life? For you are a mist that appears for a little while and then vanishes.
translation:
  language: ja
  text: あなたがたは、明日どうなるかも知りません。あなたがたの命とは、いったい何でしょう。あなたがたの命は、ほんのしばらく現れ、その後消える霧[a]なのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「蒸気」とも訳せる。
    reason: ἀτμίς は、霧だけでなく蒸気を指すこともできるため。いずれも、しばらく見えて消えるものという比喩の中心を保つ。
lexical_decisions:
- source_word: ἐπίστασθε
  choice: 知りません
  rationale: 未来についての人間の無知を表す文脈なので、現代日本語で最も直接的かつ自然な「知る」を用いた。
- source_word: τὸ τῆς αὔριον
  choice: 明日どうなるか
  rationale: 直訳的には「明日のこと」だが、省略を含むギリシア語表現が指す、明日起こる事柄や状況を自然な日本語で表した。将来の具体的内容を訳文側で限定してはいない。
- source_word: ποία ἡ ζωὴ ὑμῶν
  choice: あなたがたの命とは、いったい何でしょう
  rationale: ποία が命の性質を問う修辞的な問いであることを保ち、「いったい」によって問いの力を自然に示した。「命」はこの文脈での人の生のはかなさを明瞭に伝える。
- source_word: ἀτμὶς
  choice: 霧[a]
  rationale: 一時見えてすぐ消えるものという比喩に適し、現代日本語で自然である。「蒸気」も語義上可能なので脚注に残した。
- source_word: πρὸς ὀλίγον
  choice: ほんのしばらく
  rationale: 短い継続時間を自然に示し、命の短さを強調する語調も保った。
- source_word: φαινομένη
  choice: 現れ
  rationale: 霧が一時的に目に見えるようになるという像を簡潔に保った。
- source_word: ἔπειτα καὶ ἀφανιζομένη
  choice: その後消えてしまう
  rationale: ἔπειτα の時間的順序と、見えなくなることを表す分詞を自然な日本語で再現した。「しまう」は不可逆的に消える印象を過度な解釈なしに伝える。
theological_decisions:
- issue: 人の命のはかなさを表す比喩
  choice: 命を、一時現れて消える「霧」としてそのまま描く
  alternative: 「あなたがたの命ははかない」と抽象的に説明する
  rationale: 本文は、将来を確実視する人間の限界を、短時間で消える霧の像によって示している。比喩を保持し、死や裁きについて本文がここで明言していない教理的説明を加えなかった。
- issue: ποία ἡ ζωὴ ὑμῶν の修辞的機能
  choice: 独立した問いとして「あなたがたの命とは、いったい何でしょう」と訳す
  alternative: 前文に結び付けて「明日あなたがたの命がどうなっているか」と訳す
  rationale: ギリシア語は句読法と統語上、一定の曖昧さを許すが、問いとして区切る読みは後続の「霧なのです」という答えとの修辞的対応が明瞭であり、本文の緊張を保つ。
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「いったい何でしょう」で修辞的な問いを自然にし、「ほんのしばらく」「その後」により時間的推移を読みやすくした。脚注記号は対応語「霧」の直後に置いた。
