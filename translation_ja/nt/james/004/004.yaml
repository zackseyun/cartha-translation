id: JAS.4.4
reference: James 4:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀μοιχαλίδες, οὐκ οἴδατε ὅτι ἡ φιλία τοῦ κόσμου ἔχθρα τοῦ θεοῦ ἐστιν; ὃς ⸀ἐὰν οὖν βουληθῇ φίλος εἶναι τοῦ κόσμου, ἐχθρὸς τοῦ θεοῦ καθίσταται.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/004.yaml
  text: Adulteresses[a], do you not know that friendship with the world is hostility toward God? Therefore[d][c][b], whoever wants to be a friend of the world makes himself an enemy of God.
translation:
  language: ja
  text: 姦通する女たちよ[a]、世を友とすることが神に対する敵意[c]であることを、あなたがたは知らないのですか。ですから、世の友でありたいと願う者はだれでも、神の敵となるのです[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「姦通する女たちよ」は女性複数形の呼びかけ。ここでは、預言書に見られるような、神に対する霊的・契約的な不忠実の比喩と考えられる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「神との敵対関係」。
    reason: alternative_reading
  - marker: d
    text: 別訳「自らを神の敵とするのです」。
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχαλίδες
  choice: 姦婦たちよ
  rationale: 女性複数の呼格を、その鋭さと比喩性を弱めずに訳した。文脈上は預言書的な契約不忠実の比喩と考えられるが、本文では具体的な語を保持した。
- source_word: οὐκ οἴδατε
  choice: あなたがたは知らないのですか
  rationale: 否定疑問が持つ修辞的な問いかけの力を、自然な現代日本語で表した。
- source_word: φιλία
  choice: 友情
  rationale: 後半の φίλος（友）との語彙上のつながりを保ち、単なる好意以上の関係性を表した。
- source_word: κόσμου
  choice: 世
  rationale: 神に逆らう人間の価値体系や秩序を指す文脈だが、原文の広がりを保つため説明的な言い換えを本文に入れなかった。
- source_word: ἔχθρα τοῦ θεοῦ
  choice: 神に対する敵意
  rationale: 属格を目的語的に理解し、世との友情が神へ向けられた敵意になるという意味を明確にした。ただし『神との敵対関係』という理解も脚注に残した。
- source_word: ὃς ἐὰν οὖν
  choice: ですから、…者はだれでも
  rationale: οὖν の推論と、不定関係節の一般化する力の両方を自然な日本語で表した。
- source_word: βουληθῇ
  choice: ありたいと願う
  rationale: βούλομαι の意志・願望を明示し、単なる状態ではなく意図的な志向を示した。
- source_word: φίλος εἶναι τοῦ κόσμου
  choice: 世の友でありたい
  rationale: 『友情』との対応を保ちながら、名詞的表現を直接的に訳した。
- source_word: ἐχθρὸς τοῦ θεοῦ
  choice: 神の敵
  rationale: 『世の友』との強い関係的対照をそのまま保った。
- source_word: καθίσταται
  choice: となる
  rationale: ある立場・状態に入ることを表す動詞として、過度に使役・再帰の意味を加えずに訳した。主体の意志的な選択は直前の βουληθῇ によって十分に示される。
theological_decisions:
- issue: μοιχαλίδες の比喩的意味
  choice: 本文では字義どおり『姦婦たちよ』とし、霊的・契約的な不忠実という比喩的背景は脚注で示す。
  alternative: 『不貞な者たちよ』『神に不忠実な者たちよ』
  rationale: ヤコブは預言書に見られる契約不忠実の比喩を用いている可能性が高いが、解釈を本文に置き換えず、原文の具体的で衝撃的な女性複数形を保持した。
- issue: κόσμος の範囲
  choice: 本文では『世』と訳す。
  alternative: 『神に逆らうこの世の秩序』『世の価値体系』
  rationale: ここでは被造世界そのものではなく、神に反する人間の秩序を指すと考えられる。ただし原文の簡潔さと意味の幅を保つため、詳しい説明は脚注に置いた。
- issue: ἔχθρα τοῦ θεοῦ の属格
  choice: 『神に対する敵意』とする。
  alternative: 『神との敵対関係』
  rationale: 文脈上、世との友情が神に向けられた敵意となるという目的語的属格の理解が自然である一方、相互的な敵対関係を表す可能性も排除せず脚注に示した。
- issue: καθίσταται における主体の関与
  choice: 『神の敵となる』とする。
  alternative: 『自らを神の敵とする』
  rationale: 動詞はある状態に至ることを表し得るため、本文では直接的な『となる』を採用した。意志的責任をより強調する訳も可能なので脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、呼格の鋭さと『友情／友』『敵意／敵』の対照を保持した。文末は丁寧体で統一し、修辞的な問いと警告にふさわしい厳粛さを保った。
