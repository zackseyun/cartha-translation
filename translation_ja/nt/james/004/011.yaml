source:
  edition: SBLGNT
  text: Μὴ καταλαλεῖτε ἀλλήλων, ἀδελφοί· ὁ καταλαλῶν ἀδελφοῦ ⸀ἢ κρίνων τὸν ἀδελφὸν αὐτοῦ καταλαλεῖ νόμου καὶ κρίνει νόμον· εἰ δὲ νόμον κρίνεις, οὐκ εἶ ποιητὴς νόμου ἀλλὰ κριτής.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/011.yaml
  text: Do not speak against one another[a], brothers. The one who speaks against a brother or judges his brother speaks against the law and judges the law. But if you judge the law[b], you are not a doer of the law but a judge.
translation:
  language: ja
  text: 兄弟たち[b]、互いに悪く言ってはなりません[a]。兄弟を悪く言う、あるいは自分の兄弟を裁く者は、律法を悪く言い、律法を裁いているのです。もしあなたが律法を裁くなら、あなたは律法を実行する者ではなく、裁く者です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「中傷してはなりません」とも訳せる。ギリシア語の動詞は、人について非難するように悪く言うことを意味し得る。
    reason: lexical_alternative
  - marker: b
    text: ここで「兄弟たち」と訳したギリシア語は男性複数形だが、兄弟姉妹を含む共同体全体への呼びかけと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: καταλαλεῖτε / καταλαλῶν / καταλαλεῖ
  choice: 悪く言う
  rationale: 人を敵意や中傷をもって非難する意味を自然な日本語で表しつつ、節中の三つの用例を同じ表現で結び、原文の反復を保つ。「中傷する」だけに限定しない。
- source_word: ἀλλήλων
  choice: 互いを
  rationale: 相互性を簡潔に表し、禁止命令として自然な日本語になる。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数呼格と共同体の家族的比喩を保つ。共同体全体を含む可能性は脚注で示す。
- source_word: ἀδελφοῦ / τὸν ἀδελφὸν αὐτοῦ
  choice: 兄弟／自分の兄弟
  rationale: 同じ家族的比喩を保持し、「仲間の信者」のような説明的な言い換えを避ける。
- source_word: ἢ
  choice: たり…たり
  rationale: 二つの並列行為を選言的に示す原文の構造を、自然な日本語の列挙で表す。
- source_word: κρίνων / κρίνει / κρίνεις
  choice: 裁く
  rationale: 人と律法の双方を「裁く」という語の反復を維持する。「断罪する」ほど意味を狭めない。
- source_word: νόμου / νόμον
  choice: 律法
  rationale: ヤコブ書の文脈にある神の規範を指す語として定着した訳語を用いるが、「モーセの律法」「王の律法」などとは限定しない。
- source_word: ποιητὴς
  choice: 実行する者
  rationale: 現代日本語として明瞭であり、律法を聞くだけでなく行うというヤコブ書の主題を保つ。
- source_word: κριτής
  choice: 裁く者
  rationale: 「実行する者」との対照を明確にし、動詞「裁く」との語彙的なつながりも保つ。
theological_decisions:
- issue: 呼びかけ「兄弟たち」の範囲
  choice: 本文では「兄弟たち」とし、男女を含む共同体全体への呼びかけであり得ることを脚注に記す。
  alternative: 「兄弟姉妹たち」または「信仰の仲間たち」
  rationale: 原文の男性複数形と家族的比喩を本文で保持しながら、文脈上の包括的な指示範囲を読者に知らせる。
- issue: 「律法」の指示対象
  choice: 本文では単に「律法」と訳し、具体的範囲を限定しない。
  alternative: 「モーセの律法」「王の律法」「神の律法」
  rationale: 文脈上は隣人愛を含む神の教えが念頭にある可能性が高いが、この節自体は指示対象を明示的に限定していないため、その幅を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「悪く言う」「裁く」「律法」の反復によって原文の論理展開を見えやすくした。「兄弟たち」は聖書的な家族比喩として保持し、現代読者に必要な包括的意味は脚注で補った。
