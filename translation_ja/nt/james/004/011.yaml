  to: 兄弟たち[b]、互いに悪く言ってはなりません[a]。兄弟を悪く言う、あるいは自分の兄弟を裁く者は、律法を悪く言い、律法を裁いているのです。もしあなたが律法を裁くなら、あなたは律法を実行する者ではなく、裁く者です。
