  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἄγε νῦν οἱ λέγοντες· Σήμερον ⸀ἢ αὔριον ⸀πορευσόμεθα εἰς τήνδε τὴν πόλιν καὶ ⸀ποιήσομεν ἐκεῖ ⸀ἐνιαυτὸν καὶ ⸀ἐμπορευσόμεθα καὶ ⸀κερδήσομεν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/013.yaml
  text: Come now[a], you who say, “Today or tomorrow we will go into this city and spend a year there and do business and make a profit.”
translation:
  language: ja
  text: さあ、聞きなさい。『今日か明日、この町へ行き、そこで一年を過ごし、商売をして、利益を上げる』と言う人たちよ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: さあ、聞きなさい
  rationale: 注意を促しつつ叱責を導入する慣用的な呼びかけ。直訳調の不自然さを避けながら、原文の直接的な力を保つ。
- source_word: οἱ λέγοντες
  choice: 「…」と言う人たち
  rationale: 定冠詞付き分詞は呼びかけとして機能している。後置して日本語として自然にしつつ、冒頭の「聞きなさい」によって直接の呼びかけであることを示す。
- source_word: Σήμερον ἢ αὔριον
  choice: 今日か明日
  rationale: ἢ の選択・分離の意味を「か」で明確に表す。
- source_word: πορευσόμεθα
  choice: 行き
  rationale: 文脈上、単純な移動を表す自然で明瞭な訳。
- source_word: εἰς τήνδε τὴν πόλιν
  choice: あの町へ
  rationale: 話者たちが計画の中で念頭に置く特定の町を指す指示表現として、引用内の日本語では「あの町」が自然。
- source_word: ποιήσομεν ἐκεῖ ἐνιαυτόν
  choice: そこで一年を過ごして
  rationale: ποιέω と期間を表す対格による「期間を過ごす」という慣用的意味を自然な日本語で示す。
- source_word: ἐμπορευσόμεθα
  choice: 商売をし
  rationale: 交易・商業活動を指す語を、現代の一般読者に明瞭な表現で訳す。
- source_word: κερδήσομεν
  choice: 利益を上げよう
  rationale: 商業の文脈に即して、金銭的な利得を意図することを明確にする。未来形の断定的な計画は意志を含む自然な引用として表す。
theological_decisions:
- issue: 使徒的叱責の呼びかけの調子
  choice: 「さあ、聞きなさい」と直接呼びかける
  alternative: 「さて、『…』と言う人たちよ」
  rationale: ヤコブが無思慮な将来計画を語る者たちに直接向き合う修辞的な力を保持しつつ、現代日本語で自然な表現とする。
- issue: 将来計画を表す動詞のニュアンス
  choice: 引用全体を「行き…利益を上げよう」と意志的に表現する
  alternative: 「行って…利益を上げるだろう」
  rationale: ギリシア語の未来形は計画を確信的に述べており、日本語では意志形がその発話状況を自然に伝える。ただし、神の摂理への言及はこの節自体に加えず、次節以降との緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語。叱責にふさわしい直接性と聖書本文としての品位を保ち、過度に古風な「いざ」「〜する者よ」は避けた。
