id: JAS.4.7
reference: James 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑποτάγητε οὖν τῷ θεῷ· ἀντίστητε δὲ τῷ διαβόλῳ, καὶ φεύξεται ἀφ’ ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/007.yaml
  text: Submit yourselves[a], therefore, to God. But resist the devil, and he will flee from you.
translation:
  language: ja
  text: ですから、神に服従しなさい[a]。しかし、悪魔には抵抗しなさい。そうすれば、悪魔はあなたがたから逃げて行きます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神に従いなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑποτάγητε
  choice: 服従しなさい
  rationale: アオリスト受動命令形だが、ここでは勧告における再帰的な意味を帯び、神の権威のもとに自らを置くことを命じている。「服従しなさい」はその従属関係を明確に保つ。
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論から導かれる結論を示す。現代日本語として自然であり、論理的なつながりも明確である。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: ὑποτάγητεの与格補語を簡潔に表す。
- source_word: ἀντίστητε
  choice: 抵抗しなさい
  rationale: 相手に対して立ち、屈しないことを命じるアオリスト能動命令形。「抵抗する」は簡潔で、霊的・倫理的な対抗を自然に表す。
- source_word: δὲ
  choice: しかし
  rationale: 神への服従と悪魔への抵抗との対照を明示する。δέの軽い対照よりやや明示的だが、日本語の文脈では自然で分かりやすい。
- source_word: τῷ διαβόλῳ
  choice: 悪魔には
  rationale: 冠詞付きのδιάβολοςはここで人格的な敵を指す称号として用いられている。「には」によって、神への服従との対照も自然に示す。
- source_word: καὶ
  choice: そうすれば
  rationale: 命令に続く約束された結果という文脈上の関係を、自然な日本語で明確に表す。単純な「そして」よりも、この連結の含意が伝わりやすい。
- source_word: φεύξεται
  choice: 逃げて行きます
  rationale: 未来中動態で、抵抗の結果として悪魔が離れていくことを表す。日本語では主語を再提示して明瞭さを保った。
- source_word: ἀφ’ ὑμῶν
  choice: あなたがたから
  rationale: ἀπόと属格が示す離隔を直接表す。「あなたがた」により複数形を保持する。
theological_decisions:
- issue: διάβολοςの解釈
  choice: 人格的な超自然的敵を指す「悪魔」
  alternative: 一般的な「中傷する者」、または非人格的な悪の力
  rationale: 冠詞付きで用いられ、神への服従と対になる霊的対抗の対象として描かれているため、抽象的な悪の原理ではなく人格的存在を指す読みがギリシア語と文脈に最もよく合う。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、命令と約束の荘重さを保った。「服従」は原語の権威関係を明確にし、脚注でより平易な訳語「従う」を提示した。
