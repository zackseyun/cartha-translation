id: JAS.4.5
reference: James 4:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἢ δοκεῖτε ὅτι κενῶς ἡ γραφὴ λέγει· Πρὸς φθόνον ἐπιποθεῖ τὸ πνεῦμα ὃ ⸀κατῴκισεν ἐν ἡμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/004/005.yaml
  text: Or do you think that the Scripture speaks in vain? The Spirit whom he caused to dwell in us yearns jealously[a].
translation:
  language: ja
  text: それとも、聖書の言葉が無意味だと思うのですか。「神が私たちのうちに住まわせた聖霊は、ねたむほどに慕い求めておられる。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神が私たちのうちに住まわせた霊は、ねたみをもって慕い求める。」ギリシア語の「霊」は聖霊とも人間の霊とも取ることができ、「ねたむほどに」は「ねたみをもって」とも訳せる。
    reason: 「霊」の指示対象と、φθόνοςを含む難解な表現の二重の曖昧さを保存するため。
lexical_decisions:
- source_word: κενῶς
  choice: むなしく
  rationale: 「空しく、無益に」という副詞の意味を保ちつつ、聖書の語りが無意味・無目的ではないという修辞的な問いを、自然で格調ある日本語にした。
- source_word: ἡ γραφὴ
  choice: 聖書
  rationale: 定冠詞付き単数形が指す、権威ある書かれた啓示という新約聖書の慣用を簡潔に表す。
- source_word: Πρὸς φθόνον
  choice: ねたむほどに
  rationale: 前置詞句を慕い求める強さを示す副詞句として訳した。「ねたみをもって」という否定的意味にも取り得る曖昧さは脚注に残した。
- source_word: ἐπιποθεῖ
  choice: 慕い求めておられる
  rationale: 強く切望するという語義を表し、主語を御霊とする本文の読みでは敬語を用いて自然な日本語にした。
- source_word: τὸ πνεῦμα
  choice: 御霊
  rationale: 本文では、神が信者のうちに住まわせた聖霊を指すとの読みを採用した。ただし、人間の霊を指す文法上可能な読みは脚注に明記した。
- source_word: κατῴκισεν
  choice: 住まわせた
  rationale: κατοικίζω の使役的な意味とアオリストの行為を保つ。文脈上の行為者を明示するため「神が」とした。
- source_word: ἐν ἡμῖν
  choice: 私たちのうちに
  rationale: 共同体の間にいることよりも内住を自然に示し、同時に複数形も保つ。
theological_decisions:
- issue: τὸ πνεῦμα が指すもの
  choice: 信者のうちに住む聖霊として「御霊」と訳す。
  alternative: 神が人間のうちに住まわせた「霊」、すなわち人間の霊。
  rationale: 「住まわせた」という表現は聖霊の内住を自然に想起させるが、ギリシア語の文法だけでは人間の霊という読みを排除できない。そのため本文で一方を採りつつ、もう一方を脚注に保存した。
- issue: φθόνος の道徳的含意
  choice: 「ねたむほどに」とし、御霊の強く排他的な慕いを表す。
  alternative: 「ねたみをもって」または「ねたみに向かって」。
  rationale: φθόνος は通常「ねたみ」を表すため難解だが、御霊を主語とする場合、本文で罪深い羨望と断定するのは避けるべきである。一方、否定的な意味の可能性を消さないよう脚注に示した。
- issue: 「聖書が語る」内容の出典と引用範囲
  choice: 後続句を聖書が語る内容として引用符に入れる。
  alternative: 特定の旧約聖書の直接引用ではなく、聖書全体の趣旨を要約した言葉、または前節までを指すと見る。
  rationale: ギリシア語の句読法は原文写本に由来せず、後続文の正確な旧約出典も不明である。本文では最も直接的な構文を示すが、特定箇所からの逐語引用とは断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、修辞的な問いには「とでも思うのですか」を用いて原文の強さを表した。聖霊を指す本文の読みでは「御霊」と敬語表現を用いたが、異なる読みを脚注で明示して神学的緊張を保持した。
