id: JAS.4.8
reference: James 4:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐγγίσατε τῷ θεῷ, καὶ ⸀ἐγγιεῖ ὑμῖν. καθαρίσατε χεῖρας, ἁμαρτωλοί, καὶ ἁγνίσατε καρδίας, δίψυχοι.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/008.yaml
  text: Draw near to God[a], and he will draw near to you. Cleanse your hands, sinners, and purify your hearts, double-minded people.
translation:
  language: ja
  text: 神に近づきなさい。そうすれば、神もあなたがたに近づきます。罪人たちよ、手を清めなさい。心が二つに分かれている者たち[a]よ、心を清くしなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「二つの魂を持つ者たち」。忠誠や内なる決意が二つに分かれている人を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίσατε
  choice: 近づきなさい
  rationale: アオリスト能動命令法二人称複数。神に近づくという関係的・霊的な意味を自然な現代日本語で保ち、後半の同じ動詞との対応も示す。
- source_word: τῷ θεῷ
  choice: 神に
  rationale: ἐγγίζωの与格目的語を簡潔に訳した。
- source_word: ἐγγιεῖ
  choice: 神もあなたがたに近づきます
  rationale: 未来能動直説法三人称単数。前節の「神」を主語として明示し、「近づく」を反復して原文の並行関係を保った。「くださる」は原文に明示されない恩恵的含意を加えうるため避けた。
- source_word: καθαρίσατε
  choice: 清めなさい
  rationale: アオリスト能動命令法。儀礼的意味と道徳的意味の双方を含みうる「清める」を用い、命令の鋭さを保った。
- source_word: χεῖρας
  choice: 手を
  rationale: 外面的な行いを暗示しうる身体的比喩を解釈的に言い換えず、そのまま保持した。日本語では所有代名詞を補わなくても自然である。
- source_word: ἁμαρτωλοί
  choice: 罪人たちよ
  rationale: 呼格複数の直接的な叱責を明確に表した。
- source_word: ἁγνίσατε
  choice: 清くしなさい
  rationale: καθαρίσατεとの語彙上の違いをある程度示すため、同じ「清めなさい」の反復を避けた。内面を純一にするよう求める命令として自然な表現である。
- source_word: καρδίας
  choice: 心を
  rationale: 聖書的用法における内なる人、動機、忠誠を指す身体的比喩を保持した。日本語として自然になるよう単数集合的な「心」とした。
- source_word: δίψυχοι
  choice: 心の定まらない者たち
  rationale: 内面的な忠誠や決意が二つに分かれた状態を、現代の一般読者に伝わる表現で訳した。原語の鮮烈な字義的イメージは脚注に残した。
theological_decisions:
- issue: 道徳的勧告における身体的比喩
  choice: 「手」と「心」のイメージを保持し、その倫理的意味を本文中で説明しすぎない。
  alternative: 「行いを正し、動機を純粋にしなさい」と意訳する。
  rationale: ヤコブの表現には道徳的含意と清めの儀礼的響きが重なりうる。比喩を保持することで、その広がりと緊張を保つ。
- issue: δίψυχοιの訳し方
  choice: 本文では「心の定まらない者たち」とし、字義的表現を脚注に示す。
  alternative: 「二心の者たち」「二つの魂を持つ者たち」
  rationale: 原語は内的忠誠が分裂している者を表す。「心の定まらない」は現代日本語として理解しやすく、「二つの魂」という原語の像も脚注で確認できる。
- issue: 神が近づくことを表す未来形
  choice: 「神もあなたがたに近づきます」と訳す。
  alternative: 「神もあなたがたに近づいてくださいます」
  rationale: 約束としての未来を明瞭にしつつ、原文に明示されていない受益表現を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。連続する命令と二つの直接呼びかけを保ち、原文の厳しい調子を弱めない。「手」と「心」の対比、および「近づく」の反復を維持した。脚注記号は説明対象である「心の定まらない者たち」の直後に置いた。
