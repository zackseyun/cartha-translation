- from: しかし、神はさらに豊かな恵みを与えてくださいます。ですから、こう記されています[a]。「神は高ぶる者に敵対し、へりくだる者には恵みを与える。」
  to: しかし、さらに豊かな恵みを与えてくださいます。ですから、こう言っています[a]。「神は高ぶる者に敵対し、へりくだる者には恵みを与える。」
  rationale: 原文で省略された二つの主語を本文で補わず、λέγειの能動態を「こう言っています」と反映しました。これにより、前後の文脈が示す神への言及や聖書引用という性格を不必要に断定せず、脚注で可能な補い方を示します。他の語句は原文の比較、対照、反復を自然な日本語で十分に保っているため維持しました。
