id: JAS.4.6
reference: James 4:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μείζονα δὲ δίδωσιν χάριν· διὸ λέγει· Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/006.yaml
  text: But he gives greater grace. Therefore it says[a], “God opposes the proud, but gives grace to the humble.”
translation:
  language: ja
  text: しかし、さらに豊かな恵みを与えてくださいます。ですから、こう言っています[a]。「神は高ぶる者に敵対し、へりくだる者には恵みを与える。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ですから、こう言っています」。だれが言っているのかはギリシア語では明示されていないため、「ですから、神はこう言われます」または「ですから、聖書はこう言っています」とも訳せます。
    reason: alternative_reading
lexical_decisions:
- source_word: μείζονα
  choice: さらに豊かな
  rationale: 比較級の力を保ちつつ、日本語で「恵み」と自然に結び付く表現。直訳的な「より大きな」より明瞭である。
- source_word: δίδωσιν χάριν
  choice: 恵みを与える
  rationale: 同じ語句が節内で反復される修辞効果を保つ。前半では主語が神であることを明らかにし、丁寧さのため「与えてくださいます」とした。
- source_word: διὸ
  choice: ですから
  rationale: 前の文からの帰結を、明瞭で現代的な日本語で示す。
- source_word: λέγει
  choice: こう記されています
  rationale: ギリシア語では主語が明示されない。聖書引用であることを自然に示しながら、神・聖書など特定の主語を本文に補いすぎない受動表現とした。
- source_word: ὑπερηφάνοις
  choice: 高ぶる者
  rationale: 傲慢な態度を表し、対句の「へりくだる者」と自然に対応する。
- source_word: ἀντιτάσσεται
  choice: 敵対し
  rationale: 単なる消極的な抵抗ではなく、向かい合って対抗する能動的な意味を明確に伝える。
- source_word: ταπεινοῖς
  choice: へりくだる者
  rationale: 文脈上の倫理的・霊的な謙遜を表し、社会的身分の低さだけを連想させにくい。
- source_word: δὲ
  choice: しかし／には
  rationale: 冒頭と引用内の対照を日本語として自然に示す。引用内では「者に」と「者には」の対照で逆接を表現した。
theological_decisions:
- issue: λέγει の引用導入句における暗黙の主語
  choice: ですから、こう記されています
  alternative: ですから、神はこう言われます／ですから、聖書はこう言っています
  rationale: 原文は「言う」の主語を明示していない。受動形により聖書引用であることを示しつつ、主語を神または聖書と断定せず、原文の曖昧さを脚注で保持する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「高ぶる者／へりくだる者」の対句を維持し、「恵みを与える」の反復も保存した。神を主語とする前半のみ、自然な敬意を示す補助表現を用いた。
