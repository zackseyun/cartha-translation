  naturalness: 「しかし、さらに豊かな恵みを与えてくださいます。ですから、こう言っています」は、主語を省略しても自然な現代標準日本語です。「高ぶる者／へりくだる者」「恵みを与える」という対句と反復も明瞭です。
  terminology: 「恵み」「高ぶる者」「へりくだる者」は文脈に適した定着した表現です。「敵対し」もἀντιτάσσεταιの積極的な対抗を適切に表します。神への敬意を表す「与えてくださいます」は日本語の宗教文脈で自然であり、本文の主語を明示する必要はありません。
