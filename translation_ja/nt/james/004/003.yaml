id: JAS.4.3
reference: James 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: αἰτεῖτε καὶ οὐ λαμβάνετε, διότι κακῶς αἰτεῖσθε, ἵνα ἐν ταῖς ἡδοναῖς ὑμῶν δαπανήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/003.yaml
  text: You ask and do not receive[a], because you ask wrongly[b], so that you may spend it on your pleasures.
translation:
  language: ja
  text: あなたがたは、求めても受けません。それは、自分の快楽のために使おうとして、誤った求め方をしているからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の欲望を満たすために使おうとして」とも訳せます。「快楽」は、自己放縦的な欲望や情欲を指すこともあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰτεῖτε
  choice: 願い求めても
  rationale: 神への祈願が含意される文脈で、「願い求める」は自然で格調を保つ。目的語の「神に」は原文に明示されないため補わない。
- source_word: οὐ λαμβάνετε
  choice: 受けられません
  rationale: 求めることと受けることの対応を保ちつつ、現代日本語として自然に表現した。
- source_word: κακῶς αἰτεῖσθε
  choice: 誤った求め方をしている
  rationale: κακῶςの広い意味を「動機が悪い」だけに限定せず、求める行為のあり方が誤っていることを示す。
- source_word: ἵνα
  choice: 使おうとして
  rationale: ここでは誤った求めの目的を表すため、目的を自然な日本語で明示する。
- source_word: ἐν ταῖς ἡδοναῖς ὑμῶν
  choice: 自分の快楽のために
  rationale: ἡδοναίの「快楽」と自己放縦的な欲望の含みを保つ。「自分の」は複数二人称の所有を日本語で自然に示す。
- source_word: δαπανήσητε
  choice: 使おうとして
  rationale: 「費やす」より平明な「使う」を採用し、原語自体には必ずしも含まれない「浪費する」という評価を加えない。目的語は文脈上、求めたものを指すが、日本語では省略しても明瞭である。
theological_decisions:
- issue: 願い求める相手が神であることを明示するか
  choice: 「神に」を補わず、「願い求めても」とする
  alternative: 神に願い求めても
  rationale: 文脈上は祈りが強く示唆されるが、この節のギリシア語本文は相手を明示していないため、その含意を本文で確定しない。
- issue: κακῶςを動機の悪さに限定するか
  choice: 「誤った求め方」とする
  alternative: 悪い動機で求める
  rationale: κακῶςは「悪く、誤って」という広い副詞であり、動機だけに限定しない。後続の目的節が、その誤りの具体的内容を説明している。
- issue: ἵναを目的として訳すか
  choice: 「使おうとして」と目的を示す
  alternative: その結果、自分の快楽のために使うことになるので
  rationale: この文脈では、快楽のために使う意図が願いの誤りを説明しているため、目的の意味を主に採る。ただしἵναには結果的な含みも生じうる。
translation_notes:
  register: 明瞭な現代標準語を用いながら、聖書本文としての品位を保った。「誤った求め方」で原文の幅を残し、後半の目的節との論理関係を自然な語順で示した。脚注標識[a]は該当内容を含む文末に置いた。
