  text: εἰδότι οὖν καλὸν ποιεῖν καὶ μὴ ποιοῦντι, ἁμαρτία αὐτῷ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/004/017.yaml
  text: So[a], for the one who knows to do good and does not do it, it is sin for him.
translation:
  language: ja
  text: ですから[a]、善を行うことを知っていながら行わない人にとって、それは罪です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それゆえ、行うべき善を知りながら、それを行わない人にとっては罪です。」
    reason: οὖνの接続の強さと、καλὸν ποιεῖνを義務として明示する解釈上の可能性を示すため。
lexical_decisions:
- source_word: εἰδότι
  choice: 知っていながら……人
  rationale: 与格単数の分詞を一般的な人物を指す実質的用法として訳した。「知っていながら」により、知識と不履行の対照を自然な日本語で示す。
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論から導かれる推論・結論を示す接続語として、明瞭で現代的かつ品位のある表現を選んだ。
- source_word: καλὸν ποιεῖν
  choice: 善を行うこと
  rationale: καλόνの広い倫理的意味を「善」とし、ποιεῖνを直接的に「行う」と訳した。特定の善行だけに狭めない。
- source_word: μὴ ποιοῦντι
  choice: それを行わない
  rationale: 省略された目的語を「それ」で補い、知っている善を実行しないという対照を明確にした。現在分詞の一般的な性質は日本語の非過去形で表した。
- source_word: ἁμαρτία
  choice: 罪
  rationale: 無冠詞の述語名詞が示す性質づけを、自然な日本語の「罪です」で表し、単に不適切なのではなく罪であるとの断定を保った。
- source_word: αὐτῷ
  choice: その人にとって
  rationale: 関係・基準を示す与格を「にとって」で表し、当人についてその不履行が罪となるという個人的適用を保った。
- source_word: ἐστιν
  choice: です
  rationale: 連結動詞を日本語の丁寧体の断定として表し、本文全体の明瞭で品位ある調子に合わせた。
theological_decisions:
- issue: 知っている善を行わないことについての命題の範囲
  choice: 善を知りながら行わないことは罪である、という一般性を持つ命題として訳す。
  alternative: 直前の文脈にある高慢な将来計画だけを指す限定的な命題として訳す。
  rationale: 直前の文脈との推論的つながりは「ですから」で示しつつ、原文の一般的な言い方を狭めず、怠りの罪に関する特定の教理体系も訳文に持ち込まない。
translation_notes:
  register: 明瞭な現代標準日本語の丁寧体を用いた。「善を行う」は聖書本文にふさわしい品位を保ちながら一般読者にも理解しやすい。主文の重なりを避けず、原文の「知る者／行わない者／その人にとって罪」という論理構造を保持した。
