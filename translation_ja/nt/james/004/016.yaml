base_translation:
  language: en
  yaml_path: translation/nt/james/004/016.yaml
  text: But as it is[a], you boast in your arrogance. All such boasting is evil.
translation:
  language: ja
  text: しかし今、あなたがたは自分たちの尊大な自負を誇っています[a]。そのような誇りはすべて悪です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分たちの思い上がりのうちで」「自分たちの大言において」とも訳せる。ギリシア語は、尊大な自己確信や誇大的な自負を表す。ここでは特に、直前に述べられた将来についての自信過剰な計画と関係していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: しかし今
  rationale: 直前の「主のみこころなら」というへりくだった姿勢と、読者の現状とを対比する接続表現として、δέの逆接とνῦνの現在性を簡潔に保つ。
- source_word: καυχᾶσθε
  choice: 誇っています
  rationale: 自らの態度や主張を誇ることを表す。後半の同語根の名詞καύχησιςも「誇り」とし、語のつながりを示す。
- source_word: ἐν ταῖς ἀλαζονείαις ὑμῶν
  choice: 自分たちの思い上がった言い分を
  rationale: ἀλαζονείαの複数形が示す、尊大な自信から出る種々の主張・大言を表す。「計画」と限定せず、直前の自己確信的な計画を含みつつ、語そのものの幅を保つ。日本語では「～を誇る」として自然に表現した。
- source_word: πᾶσα καύχησις τοιαύτη
  choice: そのような誇りはすべて
  rationale: τοιαύτηの類型的な指示と、πᾶσαの包括的な一般化を自然な日本語で保つ。
- source_word: πονηρά
  choice: 悪いものです
  rationale: 単なる不適切さではなく道徳的な悪を示す。現代日本語として明瞭で、断定の力も保つ。
theological_decisions:
- issue: 非難されている誇りの性質
  choice: 主への服従を欠いた自己確信的な主張を誇ることとして訳す。
  alternative: あらゆる自己信頼一般への非難、または商業計画だけへの限定的な非難。
  rationale: 4章13～15節は将来の計画を自信満々に語る人々を扱うが、16節後半は「そのような誇り」を一般化する。「言い分」は文脈との関連を保ちつつ、「計画」とだけ限定するのを避ける。
translation_notes:
  register: 明瞭な現代標準語を用いながら、倫理的な警告にふさわしい端正で断定的な調子を保った。「思い上がった言い分」は原語の複数形と意味の幅を反映し、「計画」という文脈的補足を本文に直接持ち込まない訳である。
