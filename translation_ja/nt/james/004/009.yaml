  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ταλαιπωρήσατε καὶ πενθήσατε καὶ κλαύσατε· ὁ γέλως ὑμῶν εἰς πένθος ⸀μετατραπήτω καὶ ἡ χαρὰ εἰς κατήφειαν·
base_translation:
  language: en
  yaml_path: translation/nt/james/004/009.yaml
  text: Be miserable and mourn and weep[b][a]. Let your laughter be turned into mourning and your joy into gloom.
translation:
  language: ja
  text: 苦しみなさい[a]、悲しみなさい、泣きなさい。あなたがたの笑いを悲しみに、喜びを意気消沈に変えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「惨めになりなさい」。ギリシア語は、苦難や惨めさの中にあることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαιπωρήσατε
  choice: 苦しみなさい
  rationale: 苦難や惨めな状態に身を置くことを命じる強いアオリスト命令形。後続の「悲しみ」「泣く」と区別しつつ、現代日本語で自然に厳しさを伝える。
- source_word: πενθήσατε
  choice: 悲しみなさい
  rationale: 深い悲嘆、とりわけ文脈上の悔い改めに伴う悲しみを表す。日本語として自然で、次の「泣きなさい」とも区別できる。
- source_word: κλαύσατε
  choice: 泣きなさい
  rationale: 涙を流して泣くという具体的な反応を簡潔に表し、三つの命令の進展を保つ。
- source_word: ὁ γέλως ὑμῶν εἰς πένθος
  choice: あなたがたの笑いを悲しみに
  rationale: γέλωςを具体的な「笑い」とし、πένθοςを前半のπενθήσατεと同じ意味領域にある「悲しみ」として、対照を明確にした。
- source_word: μετατραπήτω
  choice: 変えなさい
  rationale: 三人称アオリスト受動命令形の変化要求を、日本語では二つの対句を目的語とする能動的な命令として自然に表現した。変化を求める力は保持している。
- source_word: ἡ χαρὰ εἰς κατήφειαν
  choice: 喜びを沈んだ心に
  rationale: κατήφειαが表す、うなだれた陰鬱な心の状態を、現代日本語で理解しやすく表した。並行関係により、喜びが聞き手のものであることも自然に伝わる。
theological_decisions:
- issue: 悔い改めに伴う悲しみの強さ
  choice: 命令の厳しさを弱めず、苦しみ、悲しみ、泣くようにとの強い呼びかけとして訳す。
  alternative: 単に浮ついた態度をやめて真剣になるよう求める穏やかな勧告とする。
  rationale: ヤコブ4章6－10節の文脈は、神の前にへりくだることを求める切迫した呼びかけである。ただし、「悔い改め」という語を本文に補わず、原文の感情的・神学的緊張をそのまま保った。
- issue: μετατραπήτωの受動態
  choice: 日本語として自然な「変えなさい」で、聞き手に変化を求める命令として表す。
  alternative: 「変えられなさい」または「変わりなさい」と受動・自動詞的に表す。
  rationale: ギリシア語の受動形が行為者を明示しない点は神学的に特定せず、日本語の命令として明瞭にした。神が変えるのか本人が変えるのかを訳文で断定しない。
translation_notes:
  register: 明快な現代標準語を用いながら、三つの命令と二つの対句が持つ厳粛で鋭い調子を保った。「沈んだ心」は口語的すぎず、一般読者にも直ちに理解できる表現とした。
