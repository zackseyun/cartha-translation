id: JAS.2.18
reference: James 2:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἀλλ’ ἐρεῖ τις· Σὺ πίστιν ἔχεις κἀγὼ ἔργα ἔχω. δεῖξόν μοι τὴν πίστιν σου ⸀χωρὶς τῶν ⸀ἔργων, κἀγώ ⸂σοι δείξω⸃ ἐκ τῶν ἔργων μου τὴν ⸀πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/018.yaml
  text: But someone will say[a], “You have faith, and I have works.” Show me your faith apart from works[c][b], and I will show you my faith by my works.
translation:
  language: ja
  text: しかし、ある人は言うでしょう[a]。「あなたには信仰があり、私には行いがある。」行いとは別に[b]、あなたの信仰を私に示しなさい。私も、自分の行いによって[c]、私の信仰をあなたに示そう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代ギリシア語本文には現代式の引用符がないため、ある人の発言がどこまで続くかには別の区切り方もあります。
    reason: discourse_ambiguity
  - marker: b
    text: 別訳「行いなしに」。ギリシア語は、行いから切り離された状態、または行いがない状態のどちらにも表せます。
    reason: lexical_alternative
  - marker: c
    text: 別訳「自分の行いから」。ギリシア語の前置詞は起点、または根拠・手段を表し得ます。ここでは、行いによって信仰が目に見える形で示されるという意味に取りました。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀλλ’
  choice: しかし
  rationale: 直前までの議論に対する反論・異議を導入する逆接として、簡潔で自然な現代日本語とした。
- source_word: ἐρεῖ τις
  choice: ある人はこう言うでしょう
  rationale: 未来直説法による仮想の論者の発言を示す修辞的用法を保ちつつ、日本語として自然に表現した。
- source_word: πίστιν / πίστιν
  choice: 信仰
  rationale: ヤコブ書全体における「信仰と行い」の語彙的連続性を保ち、「信頼」や「忠実」と解して論点を先取りしないため。
- source_word: ἔργα / ἔργων
  choice: 行い
  rationale: 単なる個別の行動よりも、信仰との対比を成す実践全般を表し、現代日本語の聖書用語としても明瞭である。
- source_word: δεῖξόν μοι
  choice: 私に示しなさい
  rationale: 具体的な提示を求めるアオリスト命令法の直接的な力を保った。
- source_word: χωρὶς τῶν ἔργων
  choice: 行いなしに
  rationale: χωρίς の分離・欠如の意味を簡潔な現代日本語で表した。「行いとは別に」も可能なので脚注に残した。
- source_word: κἀγώ σοι δείξω
  choice: そうすれば私は……あなたに示しましょう
  rationale: 話者の対照を明確にし、前の命令に応じる論理関係を自然な日本語で示した。接続の「そうすれば」は文脈上の関係を明示するが、内容を付加しない。
- source_word: ἐκ τῶν ἔργων μου
  choice: 自分の行いによって
  rationale: ἐκ がここで行いを信仰の可視的な根拠・手段として示すことを自然に表現した。起点を強調する「行いから」も可能なので脚注に示した。
theological_decisions:
- issue: 信仰と行いの関係を論じる文脈での πίστις の訳
  choice: 信仰
  alternative: 信頼／忠実
  rationale: 本文は、告白された信仰とそれを示す行いとの緊張関係を扱う。「忠実」と訳すと解釈を一方向に決めかねないため、広がりを保つ「信仰」とした。
- issue: 仮想の論者の発言がどこまで続くか
  choice: 「あなたには信仰があり、私には行いがある」までを引用とする
  alternative: 節の残りの全部または一部も仮想の論者の発言と見る
  rationale: 古代ギリシア語写本には現代式の引用符がなく、発言範囲には解釈上の曖昧さがある。本文では議論の応答関係が最も明瞭になる区切りを採り、別の可能性を脚注に保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。仮想の反論者と話者の応答が聞き手に分かるようにしつつ、原文にある引用範囲、χωρίς、ἐκ の曖昧さは脚注で保持した。
