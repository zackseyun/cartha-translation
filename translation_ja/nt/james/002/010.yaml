id: JAS.2.10
reference: James 2:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὅστις γὰρ ὅλον τὸν νόμον ⸂τηρήσῃ, πταίσῃ⸃ δὲ ἐν ἑνί, γέγονεν πάντων ἔνοχος.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/010.yaml
  text: For whoever keeps the whole law but stumbles in one point has become guilty of all of it[a][b].
translation:
  language: ja
  text: というのも、律法全体を守っていても、一つの点でつまずく人は[a]、律法全体について責任を負う者となります[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一つのことで過ちを犯すなら」または「一つの部分を破るなら」。ギリシア語は「一つの点でつまずく」と述べ、道徳的な失敗を比喩で表しています。
    reason: lexical_alternative
  - marker: b
    text: 別訳「律法全体について有罪となる」または「律法全体について責任を問われる」。一つの点でつまずく者は、律法全体に関して責任を負う、という意味です。
    reason: alternative_reading
lexical_decisions:
- source_word: ὅστις
  choice: その人は（条件節では主語を省略）
  rationale: 不定関係代名詞が示す一般原則を、「〜なら、その人は」という自然な日本語で表した。特定の人物に限定しない。
- source_word: γὰρ
  choice: というのも〜からです
  rationale: 直前の文を根拠づける説明の接続を、現代日本語で明瞭に示す。
- source_word: ὅλον τὸν νόμον
  choice: 律法全体
  rationale: ὅλον の全体性を保ち、νόμος は文脈上の宗教的・倫理的な法を表す標準的な「律法」とした。
- source_word: τηρήσῃ
  choice: 守っていても
  rationale: τηρέω の「守る、遵守する」という意味を直接表す。δὲ との対照関係を自然に示すため譲歩形にした。
- source_word: πταίσῃ
  choice: つまずく
  rationale: 道徳的な過ちを「つまずき」として描く原文の比喩を保持した。
- source_word: ἐν ἑνί
  choice: 一つの点で
  rationale: 律法の一つの事項・点に関して、という範囲を明確にする。
- source_word: γέγονεν
  choice: となった
  rationale: 完了形が示す、行為の結果として成立した状態を表す。
- source_word: πάντων
  choice: 律法全体に対して
  rationale: 複数属格が示す全体に関する責任を、日本語で曖昧にならないよう先行する「律法」を補って表した。
- source_word: ἔνοχος
  choice: 罪ある者
  rationale: 法的・道徳的な有責性を表しつつ、「すべての個別命令を犯した」とまでは断定しない表現とした。
theological_decisions:
- issue: 一つの違反と律法全体に対する有責性の範囲
  choice: 一つの点でつまずく者は、律法全体に対して罪ある者となる。
  alternative: 一つの命令に違反することは、すべての命令を一つ一つ犯すことと同じである。
  rationale: πάντων ἔνοχος は律法全体に関して責任を負うことを自然に表すが、各違反の重さが同一であることや、すべての命令を個別に犯したことまでは明示しない。その神学的緊張を解消せず保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「というのも〜からです」で説明関係を示し、「つまずく」という原文の比喩を本文に残した。脚注記号 [a] と [b] は対応箇所に配置した。
