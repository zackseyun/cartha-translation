  to: というのも、律法全体を守っていても、一つの点でつまずく人は[a]、律法全体について責任を負う者となります[b]。
  rationale: 冒頭の「というのも」で γάρ の説明的接続を保ちつつ、文末の「からです」を削除して日本語の因果表現の重複を解消しました。「責任を負う者となります」は γέγονεν の結果としての状態と ἔνοχος の有責性を自然に表します。これは律法全体に関する責任を述べるのであって、すべての命令を一つずつ破ったことや、すべての違反の重大さが同じであることを主張しません。
