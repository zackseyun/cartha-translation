id: JAS.2.26
reference: James 2:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὥσπερ ⸀γὰρ τὸ σῶμα χωρὶς πνεύματος νεκρόν ἐστιν, οὕτως καὶ ἡ πίστις ⸀χωρὶς ἔργων νεκρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/026.yaml
  text: For just as the body without the spirit is dead[b][a], so also faith without works is dead.
translation:
  language: ja
  text: というのも、霊[a]のない体が死んでいるのと同じように、行いのない信仰[b]も死んでいるからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「息」とも訳せる。ギリシア語は「霊」と「息」のどちらも意味しうる。
    reason: lexical_alternative
  - marker: b
    text: 「信頼」または「忠実さ」とも訳しうる。ここでは標準的な訳語として「信仰」とした。
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ … οὕτως καὶ
  choice: …のと同じように、…も
  rationale: 前半と後半の対応関係を明確にしつつ、現代日本語として自然な比較構文にした。
- source_word: γὰρ
  choice: というのも…からです
  rationale: 直前の議論を説明する接続辞であることを、文頭と文末を呼応させて自然に示した。
- source_word: τὸ σῶμα
  choice: 体
  rationale: 物理的な身体を指す標準的で明快な訳語。
- source_word: χωρὶς πνεύματος
  choice: 霊のない
  rationale: χωρίςの欠如・分離の意味を「ない」で表し、πνεῦμαの主要な意味である「霊」を本文に採用した。「息」も文脈上可能なので脚注に残した。
- source_word: νεκρόν ἐστιν / νεκρά ἐστιν
  choice: 死んでいる
  rationale: 二度反復される同じ述語を同じ表現で訳し、比喩の力と並行性を保った。
- source_word: ἡ πίστις
  choice: 信仰
  rationale: ヤコブ書の議論との語彙的連続性を保つ標準訳。「信頼」「忠実さ」という語義の可能性は脚注に示した。
- source_word: χωρὶς ἔργων
  choice: 行いのない
  rationale: ἔργονの具体的な実践という意味を、聖書日本語として定着しつつ一般読者にも理解しやすい「行い」で表した。
theological_decisions:
- issue: χωρὶς πνεύματος における πνεῦμα の意味
  choice: 霊
  alternative: 息
  rationale: 生命を与えるものを欠いた体という比喩を保ち、語の通常の意味範囲を狭めないため本文では「霊」とした。一方、「息」も死体の描写として十分可能なので脚注に保存した。
- issue: πίστις の意味
  choice: 信仰
  alternative: 信頼、または忠実さ
  rationale: 本文では神学的に一方へ解釈を固定せず、標準的な訳語「信仰」を用いた。語が持ちうる他のニュアンスは脚注に示して、ヤコブの議論にある緊張を保持した。
- issue: 信仰と行いの関係
  choice: 「行いのない信仰も死んでいる」と原文どおり述べる
  alternative: 行いが救いを獲得する、または行いは単なる証拠にすぎない、と説明的に補う
  rationale: 原文はこの一文で両者の体系的関係を詳説していないため、特定の教派的説明を訳文へ加えず、強い断言と比喩をそのまま保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「というのも…からです」で説明的な接続を保った。「死んでいる」を反復して原文の簡潔さと修辞的な並行性を維持し、教派的な解説は本文に持ち込んでいない。
