id: JAS.2.5
reference: James 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀκούσατε, ἀδελφοί μου ἀγαπητοί. οὐχ ὁ θεὸς ἐξελέξατο τοὺς πτωχοὺς ⸂τῷ κόσμῳ⸃ πλουσίους ἐν πίστει καὶ κληρονόμους τῆς βασιλείας ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/005.yaml
  text: 'Listen[c][b][a], my beloved brothers: has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom that he promised to those who love him?'
translation:
  language: ja
  text: 私の愛する兄弟たち[a]、よく聞きなさい。神は、この世では貧しい人たち[b]を、信仰[c]に富む者、また、ご自分を愛する人たちに約束された御国を受け継ぐ者として選ばれたのではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、信仰共同体全体への呼びかけとして、女性を含むことがある。
    reason: alternative_reading
  - marker: b
    text: 別訳「世の基準では貧しい人たち」または「世の目には貧しい人たち」。
    reason: lexical_alternative
  - marker: c
    text: 「信仰」は「信頼」とも訳せる。この箇所では可能性が低いが、「忠実」という意味もあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατε
  choice: よく聞きなさい
  rationale: 複数へのアオリスト命令形で、注意を促す直接的な呼びかけ。「よく聞きなさい」は現代日本語として自然で、その強さを保つ。
- source_word: ἀδελφοί μου ἀγαπητοί
  choice: 私の愛する兄弟たち
  rationale: ἀδελφοίの男性複数形とἀγαπητοίの愛情深い呼称を保つ。共同体全体を含み得ることは脚注に示す。
- source_word: οὐχ ... ἐξελέξατο
  choice: 選ばれたのではありませんか
  rationale: 肯定の答えを期待する修辞疑問を自然な日本語で表す。ἐξελέξατοは単純に「選ばれた」とし、特定の選びの教理を付加しない。
- source_word: τοὺς πτωχοὺς τῷ κόσμῳ
  choice: この世では貧しい人たち
  rationale: τῷ κόσμῳを領域・観点の与格として捉え、世的な領域または基準における貧しさを表す。別解は脚注に残す。
- source_word: πλουσίους ἐν πίστει
  choice: 信仰に富む者
  rationale: πίστιςのこの文脈での第一義を「信仰」とし、世における貧しさとの対照を明瞭にする。
- source_word: κληρονόμους τῆς βασιλείας
  choice: 御国を受け継ぐ者
  rationale: κληρονόμοςの相続概念を自然な現代日本語で表す。「御国」は神の国を指す文脈にふさわしい尊敬を帯びた慣用表現。
- source_word: ἧς ἐπηγγείλατο τοῖς ἀγαπῶσιν αὐτόν
  choice: ご自分を愛する人たちに約束された
  rationale: 関係節を日本語の語順に整えつつ、御国が神を愛する人々に約束されたという修飾関係を保持する。
theological_decisions:
- issue: 神の選びの教理的含意
  choice: ἐξελέξατοを「選ばれた」と簡潔に訳す。
  alternative: 予定論などの体系的意味を明示する訳。
  rationale: この節は貧しい人々に対する神の評価と、えこひいきの矛盾を論じている。語の神学的重みは保つが、後代の体系を本文に持ち込まない。
- issue: ἀδελφοίの範囲
  choice: 本文では「兄弟たち」とし、共同体全体を含み得ることを脚注で示す。
  alternative: 本文で「兄弟姉妹たち」とする。
  rationale: 原文の文法上の男性複数を保ちつつ、書簡的呼びかけが女性を含む信徒共同体全体を指し得る点も明示する。
- issue: πίστιςの意味
  choice: 「信仰」と訳す。
  alternative: 「信頼」または、この箇所では可能性の低い「忠実」。
  rationale: 「信仰に富む」がこの構文と文脈に最も自然であるが、語の意味範囲は脚注に保存する。
- issue: πλουσίουςとκληρονόμουςの統語関係
  choice: 「信仰に富む者、また…受け継ぐ者として」と並列的に訳す。
  alternative: 選ばれた結果として富むようになったことを明示する訳。
  rationale: 原文は二つの対格補語を置くが、時間的・因果的な展開までは明示しないため、その曖昧さを保つ。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「よく聞きなさい」で呼びかけの力を出し、長い修辞疑問は修飾関係が追えるよう日本語の語順に整理した。「御国」は一般読者にも通じる聖書的語彙として用い、過度に古風な表現は避けた。
