lexical_decisions:
- source_word: ἐὰν
  choice: もし
  rationale: 後続節の条件を導く語として、仮定の意味を自然な現代日本語で表す。
- source_word: ἀδελφὸς ἢ ἀδελφή
  choice: 兄弟か姉妹
  rationale: 原文が男性形と女性形を明示しているため、その対を保つ。文脈上は信仰共同体の仲間を指すと考えられるが、訳文では原文の家族的表現をそのまま残す。
- source_word: γυμνοὶ ὑπάρχωσιν
  choice: 十分な着る物がなく
  rationale: γυμνόςは文字どおりには裸を意味し得るが、食べ物の欠乏と並ぶこの文脈では、必要な衣服が足りない窮状を表す可能性が高い。ὑπάρχωσινはここでは状態を表すため、日本語では一体として自然に訳した。
- source_word: λειπόμενοι
  choice: 事欠いている
  rationale: 必要なものが継続的に不足している状態を、自然かつ簡潔に表す。
- source_word: τῆς ἐφημέρου τροφῆς
  choice: その日の食べ物
  rationale: ἐφήμεροςの「その日一日分の」という切迫した日ごとの意味と、τροφήの「食べ物、糧」の意味を明確に表す。
theological_decisions:
