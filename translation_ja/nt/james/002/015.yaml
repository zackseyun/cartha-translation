  choice: 「兄弟か姉妹」とし、ヤコブが用いる信仰共同体の家族的呼称を保持する。
  alternative: 困窮している人一般を指す表現に広げる。
  rationale: 文脈上は仲間の信者を指す可能性が高いが、対象範囲を訳文で一般化せず、原文の表現と含みを保つ。
