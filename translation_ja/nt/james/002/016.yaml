id: JAS.2.16
reference: James 2:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν· Ὑπάγετε ἐν εἰρήνῃ, θερμαίνεσθε καὶ χορτάζεσθε, μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος, ⸀τί ὄφελος;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/016.yaml
  text: and one of you says to them[a], “Go in peace; keep warm and be filled,” but you do not give them the necessities of the body, what benefit is that?
translation:
  language: ja
  text: あなたがたのうちの誰かがその人たちに、「安心して行きなさい。暖かくして、満腹になりなさい」[a]と言いながら、体に必要なものを与えないなら、何の役に立つでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「暖められ、満たされなさい」とも訳せる。ギリシア語の形は、受動の意味にも中動の意味にも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπῃ δέ τις αὐτοῖς ἐξ ὑμῶν
  choice: あなたがたのうちの誰かがその人たちに…と言いながら
  rationale: 仮定的な例と部分の属格を自然な日本語で表した。δέは後半の否定との対照を「ながら」で明確にしつつ、独立した強い逆接にはしなかった。αὐτοῖςは前節の困窮者たちを受ける複数形なので「その人たち」とした。
- source_word: Ὑπάγετε ἐν εἰρήνῃ
  choice: 安心して行きなさい
  rationale: 別れの挨拶・祝福としての定型表現を、現代日本語で自然に伝える。「平安のうちに行きなさい」より明瞭で、文脈上の皮肉も保たれる。
- source_word: θερμαίνεσθε καὶ χορτάζεσθε
  choice: 暖かくして、満腹になりなさい
  rationale: 中動態・受動態の形が持つ幅を、主体や手段を特定しない日本語で表した。「満腹」は食物によって満たされる身体的必要を明確にする。より字義的な受動表現は脚注に示した。
- source_word: μὴ δῶτε δὲ αὐτοῖς τὰ ἐπιτήδεια τοῦ σώματος
  choice: 体に必要なものを与えないなら
  rationale: ἐπιτήδειαを身体の維持に要る具体的な物資として平明に表した。仮定例の構文に合わせ、否定の条件を「なら」で自然につないだ。
- source_word: τί ὄφελος;
  choice: 何の役に立つでしょうか
  rationale: 実際的な効用を問う修辞疑問として、現代日本語で自然かつ明確にした。直前の行為全体を受けるため、指示語を補わずとも意味が通る。
theological_decisions:
- issue: θερμαίνεσθε と χορτάζεσθε の態の解釈
  choice: 「暖かくして、満腹になりなさい」とし、自力でそうするのか、他者からそうしてもらうのかを限定しない
  alternative: 「暖められ、満たされなさい」または「自分で暖まり、腹を満たしなさい」
  rationale: 本文の焦点は、困窮者への物質的援助を欠いた言葉の空しさにある。ギリシア語の中動態・受動態の曖昧さを一方に決めず、字義的な別訳を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、教会的な定型句に偏りすぎない品位ある口調とした。「安心して行きなさい」は日常的な別れの言葉としての表面上の善意と、援助を伴わない皮肉との両方を伝える。
