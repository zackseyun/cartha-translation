  source_fidelity: 原文の構文と語義を適切に反映している。θέλεις δὲ γνῶναι は「しかし、…知りたいのですか」という意志を問う修辞疑問として保たれ、ὦ ἄνθρωπε κενέ の単数呼格も「中身のない人よ」として保持されている。ὅτι以下も、行いを欠く信仰がἀργήであるという内容を正確に伝える。
