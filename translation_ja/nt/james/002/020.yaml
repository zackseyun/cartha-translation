  terminology: 「信仰」「行い」「役に立たない」は文脈に即し、神学的解釈を持ち込まない。「役に立たない」はἀργήの無活動・無益という含意を明瞭に表し、「死んでいる」と混同していない。脚注a・bは本文中の該当語に正しく付され、それぞれ有用な語義上の代替を示している。
