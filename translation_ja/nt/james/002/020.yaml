id: JAS.2.20
reference: James 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: θέλεις δὲ γνῶναι, ὦ ἄνθρωπε κενέ, ὅτι ἡ πίστις χωρὶς τῶν ἔργων ⸀ἀργή ἐστιν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/020.yaml
  text: But do you want to know[a], O foolish man[b], that faith apart from works is useless?
translation:
  language: ja
  text: しかし、中身のない人よ[a]、行いを伴わない信仰は役に立たない[b]ということを、知りたいのですか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「空の人よ」。または「愚かな人よ」「空疎な人よ」。
    reason: lexical_alternative
  - marker: b
    text: または「働かない」「実を結ばない」。ギリシア語は、活動せず成果を生まないことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλεις δὲ γνῶναι
  choice: しかし、……知りたいのですか
  rationale: θέλω＋不定詞の意志・願望を自然な現代日本語で表し、δέの対比・展開を「しかし」で示した。修辞的な問いの形も保持した。
- source_word: ὦ ἄνθρωπε κενέ
  choice: 中身のない人よ
  rationale: κενόςの字義である「空の、中身のない」を保ちつつ、人の内面的な空疎さを表す呼びかけとして理解できる形にした。「愚かな人」は文脈上自然だが、解釈を一段加えるため脚注に置いた。
- source_word: ἡ πίστις
  choice: 信仰
  rationale: ヤコブ書の議論での標準的かつ過度に解釈的でない訳語を採用した。
- source_word: χωρὶς τῶν ἔργων
  choice: 行いを伴わない
  rationale: χωρίςの分離・欠如を、日本語として自然に表現した。「行いから離れた」より明瞭で、「行いなしの」より読みやすい。
- source_word: ἀργή ἐστιν
  choice: 役に立たない
  rationale: ἀργόςが表す、働かず成果を生まない状態を明瞭な現代日本語で示した。「死んでいる」とはせず、本文固有の語を保持した。
theological_decisions:
- issue: 信仰と行いの関係
  choice: 行いを伴わない信仰を「役に立たない」と表現する
  alternative: 「働かない」「実を結ばない」、または近接節に合わせて「死んでいる」とする
  rationale: 原文はἀργήであり、νεκράではない。したがって、後続・先行箇所の「死んでいる」に同化させず、無活動・無効という本節の表現を保った。信仰の存在論的性質について宗派的説明を加えていない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。単数の呼びかけと修辞疑問を保持した。「中身のない」はやや特異だが、κενόςの具体的な比喩を消さないため本文に採用し、自然な解釈語を脚注で補った。
