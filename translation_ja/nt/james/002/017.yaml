source:
  edition: SBLGNT
  text: οὕτως καὶ ἡ πίστις, ἐὰν μὴ ⸂ἔχῃ ἔργα⸃, νεκρά ἐστιν καθ’ ἑαυτήν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/017.yaml
  text: So also faith[a], if it does not have works, is dead by itself.
translation:
  language: ja
  text: 同じように、信仰[a]も、行いがなければ、それ自体では死んでいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信頼」とも訳せる。この箇所では可能性が低いが、「忠実さ」の意もある。ギリシア語ピスティスにはこれらの意味があるが、ここでのヤコブの議論には「信仰」が最もよく合う。
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: 同じように、～も
  rationale: 直前のたとえとの対応を示すοὕτωςと、信仰にも同じことが当てはまることを示すκαίを、自然な日本語で表した。
- source_word: ἡ πίστις
  choice: 信仰
  rationale: ヤコブ2章では、告白される信仰と行いとの関係が論じられているため、「信仰」が文脈に最も適する。「信頼」「誠実さ」という語義の可能性は脚注に残した。
- source_word: ἐὰν μὴ ἔχῃ ἔργα
  choice: 行いが伴わなければ
  rationale: 直訳的な「行いを持っていなければ」は日本語として不自然なので、信仰に行いがないという条件を明瞭かつ自然に表した。行いが信仰の結果なのか構成要素なのかは訳文で限定していない。
- source_word: ἔργα
  choice: 行い
  rationale: 外に現れる行為を指しつつ、ヤコブ2章における反復語としての広がりを保つ。「業」より現代の一般読者に分かりやすい。
- source_word: νεκρά ἐστιν
  choice: 死んでいます
  rationale: 比喩の強さを弱めず、原文の端的な断定を保った。
- source_word: καθ’ ἑαυτήν
  choice: それだけでは
  rationale: 行いから切り離され、単独である信仰を指す。「それ自体で」より自然な日本語であり、信仰一般が死んでいるとの誤読も避けられる。
theological_decisions:
- issue: 信仰と行いをめぐる議論の中でのπίστιςの訳し方
  choice: 信仰
  alternative: 信頼／誠実さ
  rationale: 原文の神学的緊張を保ち、信仰と行いの関係を特定の教派的枠組みで説明しない。「信仰」がこの文脈に最も適するが、原語の語義の幅は脚注で示した。
- issue: 信仰に行いがないことを表す条件節
  choice: 行いが伴わなければ
  alternative: 行いがなければ
  rationale: 「伴う」は自然な日本語で関係を示すが、行いを信仰の根拠・功績・単なる証拠のいずれかに限定しないため、原文の余地を保っている。
translation_notes:
  register: 明快な現代標準日本語。「死んでいます」という強い比喩を保ちつつ、「それだけでは」によってκαθ’ ἑαυτήνの孤立の意味を自然に表した。
