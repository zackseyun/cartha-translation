base_translation:
  language: en
  yaml_path: translation/nt/james/002/007.yaml
  text: Do not they themselves blaspheme the good name that was called upon you?[a][b]
translation:
  language: ja
  text: 彼ら自身が、あなたがたの上に唱えられたその尊い名を冒涜しているのではありませんか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたの上に呼ばれた」とも、「あなたがたがその名によって呼ばれている」とも訳せる。この表現は、信者を識別する名を指す可能性があり、契約や洗礼の言葉を響かせている可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: οὐκ αὐτοὶ
  choice: あの人たち自身が…しているのではありませんか
  rationale: οὐκによる肯定の答えを予期する修辞疑問と、αὐτοὶの強調を保つ。「あの人たち」は直前に述べられた者たちを自然に指す。
- source_word: βλασφημοῦσιν
  choice: 冒瀆している
  rationale: 人への中傷も表し得る語だが、ここでは信者と結び付いた「名」が対象であり、宗教的な侮辱・不敬という強い含意を保つ。
- source_word: τὸ καλὸν ὄνομα
  choice: その尊い名
  rationale: καλόςの「立派な、誉れある、尊い」という価値判断を自然な現代日本語で表す。「良い名」では評判の意味に偏りやすいため避けた。
- source_word: τὸ ἐπικληθὲν ἐφ’ ὑμᾶς
  choice: あなたがたの上に呼ばれた
  rationale: 名が人々の「上に呼ばれる」という受動構文と旧約的・契約的な響きを保ち、単に「あなたがたが名乗る」と解釈してしまわない。
theological_decisions:
- issue: 「その尊い名」が何を指すか
  choice: 名の具体的な持ち主を本文では明示せず、「その尊い名」とする
  alternative: 「キリストの尊い名」または「主の尊い名」と明示する
  rationale: 直近の文脈（2:1）からイエス／主の名である可能性が高いが、ギリシア語本文は名の持ち主を明記しない。したがって、キリスト論的な含意を残しつつ曖昧さを保存する。
- issue: 「名が上に呼ばれる」という表現の含意
  choice: 原文の比喩的構文を本文に保持する
  alternative: 「あなたがたがその名によって呼ばれている」
  rationale: この句は所属や同定を示し、契約または洗礼の言語を響かせる可能性があるが、どれか一つに限定できないため、解釈を確定しない。
translation_notes:
  register: 明瞭で現代的だが、聖書本文としての品位を保つ文体。「冒瀆」は常用的な宗教語として採用し、「あなたがたの上に呼ばれた」は原文の特徴的な言い回しと解釈上の幅を保持した。
