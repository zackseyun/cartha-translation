  text: βλέπεις ὅτι ἡ πίστις συνήργει τοῖς ἔργοις αὐτοῦ καὶ ἐκ τῶν ἔργων ἡ πίστις ἐτελειώθη,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/022.yaml
  text: You see that faith was working together with his works[b][a], and by the works faith was brought to completion.
translation:
  language: ja
  text: あなたにも分かるとおり、信仰[a]は彼の行いとともに働いており、その行いによって信仰は完成された[b]のです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「信仰」に当たるギリシア語（πίστις）は、「信実」または「信頼」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「完全なものとされた」「全うされた」。このギリシア語動詞は、意図された終点や成熟に達することを表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπεις
  choice: あなたには分かるでしょう
  rationale: 現在能動直説法二人称単数の直接的な呼びかけを保ちつつ、ヤコブの論証を受けて読者に理解を促す自然な日本語とした。
- source_word: πίστις
  choice: 信仰
  rationale: アブラハムの信じる応答を論じる文脈に合い、標準的な語義と神学上の用語の連続性を保つ。関連する「信実」「信頼」の可能性は脚注に示した。
- source_word: συνήργει
  choice: ともに働いており
  rationale: 未完了過去の継続的・同時的な様相と、接頭辞 σύν- が示す協働の意味を表す。信仰と行いの関係を一方的な説明に還元しない。
- source_word: τοῖς ἔργοις αὐτοῦ
  choice: 彼の行いとともに
  rationale: συνεργέω に伴う与格を「ともに」で自然に示し、ἔργα はこの段落で具体的な行為を指すため「行い」とした。
- source_word: ἐκ τῶν ἔργων
  choice: その行いによって
  rationale: ἐκ がここで示す源・手段の意味を、日本語として自然な「によって」で表した。
- source_word: ἐτελειώθη
  choice: 完成された
  rationale: アオリスト受動形を保ち、意図された終点・成熟に達したという τελειόω の意味を簡潔に表す。以前の信仰に道徳的欠陥があったと不必要に示唆しない。
theological_decisions:
- issue: ヤコブの論証における信仰と行いの関係
  choice: 信仰が行いとともに働き、行いによって完成されたという本文の相互関係をそのまま示す。
  alternative: 行いは人の前で信仰を証明するだけである、または行いが信仰を成熟させる、もしくは行いが信仰に不可欠な表現として協働する、と説明的に訳す。
  rationale: ギリシア語本文は協働と完成を述べるが、義認についての体系的説明までは与えていないため、特定の教派的結論を訳文に持ち込まず、神学的緊張を保持した。
- issue: πίστις の訳語
  choice: 信仰
  alternative: 信実、信頼
  rationale: この文脈で最も標準的かつ理解しやすい訳語であり、関連する語義を排除しきらないよう脚注で代案を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、論証的で品位ある調子を保った。「彼」は直前の文脈のアブラハムを指す。脚注記号は、それぞれ対応する語の直後に配置した。
