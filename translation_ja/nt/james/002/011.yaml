id: JAS.2.11
reference: James 2:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ γὰρ εἰπών Μὴ ⸀μοιχεύσῃς εἶπεν καί Μὴ ⸀φονεύσῃς· εἰ δὲ οὐ ⸂μοιχεύεις φονεύεις⸃ δέ, γέγονας παραβάτης νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/011.yaml
  text: For he who said, “Do not commit adultery,” also said, “Do not murder.” Now if you do not commit adultery but do murder, you have become a transgressor of the law.
translation:
  language: ja
  text: 「姦淫してはならない」と言った方は、「殺人を犯してはならない」とも言ったからです。姦淫をしなくても、殺人を犯すなら、あなたは律法を破る者となったのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... εἰπών
  choice: 言った方
  rationale: 冠詞付き分詞を実体詞的に訳し、命令を与えた同一の人格を示す。神であることを本文に明示的に補わず、原文の表現を保った。
- source_word: Μὴ μοιχεύσῃς
  choice: 姦淫してはならない
  rationale: μήを伴うアオリスト接続法の禁止命令を、十戒の引用にふさわしい明瞭で格調ある現代日本語にした。
- source_word: καί
  choice: とも
  rationale: 同じ方がもう一つの命令も語ったという論旨を、日本語で自然に示す。
- source_word: Μὴ φονεύσῃς
  choice: 殺人を犯してはならない
  rationale: φονεύωは殺す行為一般ではなく不法な殺人を指すため、「殺してはならない」より意味範囲が明確な表現を選んだ。
- source_word: εἰ δὲ
  choice: たとえ…ても、…なら
  rationale: 対照を含む仮定的適用を、日本語として明確な条件構文で表した。
- source_word: οὐ μοιχεύεις ... φονεύεις δέ
  choice: 姦淫をしなくても、殺人を犯すなら
  rationale: 現在形を一般的な事例として訳し、δέによる二つの行為の対照を自然に示した。
- source_word: γέγονας
  choice: となったのです
  rationale: 完了形が示す、ある行為によってその状態に至り、今もその立場にあるという結果の含みを保った。
- source_word: παραβάτης νόμου
  choice: 律法を破る者
  rationale: 法律的・倫理的な意味を保ちつつ、「律法の違反者」より自然で理解しやすい現代日本語とした。
- source_word: νόμου
  choice: 律法
  rationale: 直前に引用された個別の戒めを含む、神の律法を指す文脈に合わせた。
theological_decisions:
- issue: 戒めを語った方の身元
  choice: 「言った方」とし、神という語を補わない
  alternative: 「神は」と明示する
  rationale: 文脈上は神を指すが、ギリシア語本文は固有の主語を明示せず「言った方」と表現しているため、その間接性を保った。
- issue: 律法違反の範囲
  choice: 「律法を破る者」とする
  alternative: 「その戒めを破る者」と限定する
  rationale: ヤコブの論旨は、一つの戒めへの違反によって律法に背く者となるという点にあるため、νόμουを個別の戒めに狭めなかった。
translation_notes:
  register: 明瞭な現代標準語を用いながら、十戒の引用には「してはならない」という端正な命令表現を採用した。全体は説明的に膨らませず、同じ語り手、二つの戒めの対照、律法違反者となった結果状態を保っている。
