id: JAS.2.25
reference: James 2:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁμοίως δὲ καὶ Ῥαὰβ ἡ πόρνη οὐκ ἐξ ἔργων ἐδικαιώθη, ὑποδεξαμένη τοὺς ἀγγέλους καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/025.yaml
  text: And likewise[b][a], was not Rahab the prostitute also justified by works when she welcomed the messengers and sent them out by another way?
translation:
  language: ja
  text: 同じように、娼婦ラハブも、使者たち[b]を迎え入れ、別の道を通って送り出したとき、行いによって義とされた[a]のではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「義と認められた」または「義であることが示された」とも訳せる。ギリシア語は「義とする」に当たる語を用いており、ここではその意味を一つに限定していない。
    reason: lexical_alternative
  - marker: b
    text: ギリシア語は「使者たち」。文脈では、天使ではなく、ラハブが迎え入れた人々を指す（ヨシュア記2章参照）。
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως δὲ καὶ
  choice: 同じように、…も
  rationale: 直前のアブラハムの例との比較と、ラハブをもう一つの例として加える働きを、自然な現代日本語で表す。
- source_word: Ῥαὰβ
  choice: ラハブ
  rationale: 日本語聖書で定着している人名表記を用いる。
- source_word: ἡ πόρνη
  choice: 娼婦
  rationale: πόρνηの意味を、古風な語を避けつつ簡潔で品位ある現代日本語で示す。
- source_word: οὐκ ... ἐδικαιώθη
  choice: 義とされたのではありませんか
  rationale: 受動形と修辞疑問を保ち、δικαιόωを特定の神学的解釈に狭めず、ヤコブの議論との語彙的なつながりを維持する。
- source_word: ἐξ ἔργων
  choice: 行いによって
  rationale: ἐκが示す根拠・手段の関係を、日本語として自然かつ簡潔に表し、周辺文脈の「行い」と用語を統一する。
- source_word: ὑποδεξαμένη
  choice: 迎え入れ
  rationale: 単に受け取るのではなく、人を受け入れてもてなす含意を自然に伝える。
- source_word: τοὺς ἀγγέλους
  choice: 使者たち
  rationale: ἄγγελοςの基本的な多義性を踏まえつつ、この文脈ではヨシュアに遣わされた人間を指すため「使者」とする。「斥候」は文脈上正しいが、原語より具体的になりすぎる。
- source_word: καὶ ἑτέρᾳ ὁδῷ ἐκβαλοῦσα
  choice: 別の道から送り出した
  rationale: ここでのἐκβάλλωは強制的に追い出す意味ではなく送り出すことを表し、ἑτέρᾳ ὁδῷの異なる経路という意味も保持する。
theological_decisions:
- issue: ヤコブ2章25節におけるδικαιόωと行いの関係
  choice: 本文では「義とされた」とし、法廷的な義認か、義しいことの実証・承認かに限定しない。
  alternative: 「義と認められた」「義しいことが示された」
  rationale: 本文の神学的緊張と語の幅を保ち、特定の教理体系に沿って意味を先に決定しないため。解釈上の可能性は脚注で示す。
translation_notes:
  register: 明快な現代標準日本語を用いながら、修辞疑問の形と原文の神学的緊張を保持した。「娼婦」は意味を明確にしつつ過度に俗悪でない語として採用し、全体を簡潔で品位ある文体に整えた。
