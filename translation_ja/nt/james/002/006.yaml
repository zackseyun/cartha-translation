id: JAS.2.6
reference: James 2:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑμεῖς δὲ ἠτιμάσατε τὸν πτωχόν. οὐχ οἱ πλούσιοι καταδυναστεύουσιν ὑμῶν, καὶ αὐτοὶ ἕλκουσιν ὑμᾶς εἰς κριτήρια;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/006.yaml
  text: But you have dishonored the poor man[b][a]. Is it not the rich who oppress you and themselves drag you into courts?
translation:
  language: ja
  text: しかし、あなたがたは貧しい人[a]を辱めました。あなたがたを虐げ、あなたがたを法廷[b]へ引きずって行くのは、ほかならぬ富んでいる人たちではありませんか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「貧しい者」。ギリシア語は単数で、直前の具体例に出てくる貧しい人を受けながら、貧しい人々を代表しているとも考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「法廷」は、司法上の裁判の場を指す。
    reason: lexical_clarification
lexical_decisions:
- source_word: ἠτιμάσατε
  choice: 辱めました
  rationale: 相手の名誉を損ない、軽んじて扱うという意味を簡潔に表す。単なる言葉による侮辱に限定しない。
- source_word: τὸν πτωχόν
  choice: 貧しい人
  rationale: 定冠詞付き男性単数で、直前の具体例に登場した貧しい人を指しつつ、代表的な意味も帯びる。日本語では性別を不必要に補わず、単数を保った。
- source_word: οἱ πλούσιοι
  choice: 富んでいる人たち
  rationale: 実体詞的な複数形容詞を自然な現代日本語で表し、社会的な一群を指すことを明確にした。
- source_word: καταδυναστεύουσιν
  choice: 虐げ
  rationale: 力を振るって相手を圧迫する強い意味を保つ。「搾取する」のように手段を限定しない。
- source_word: ἕλκουσιν
  choice: 引きずって行く
  rationale: 強制的に引いて行くという動詞の生々しさを保ち、敵対的な司法の場面に合う。
- source_word: κριτήρια
  choice: 法廷
  rationale: ここでは司法上の裁きの場を指すため、現代日本語で明確な「法廷」とした。
- source_word: καὶ αὐτοὶ
  choice: ほかならぬ
  rationale: 富んでいる人たち自身がまさにその行為者であるという強調を、自然な日本語で表した。
- source_word: οὐχ ... ;
  choice: ではありませんか
  rationale: 肯定の答えを予期する修辞疑問の力を自然に伝える。
theological_decisions:
- issue: 単数形「貧しい人」の指示対象
  choice: 直前の会堂の例に登場する一人の貧しい人を指しながら、貧しい人々を代表する表現として訳す
  alternative: 集合的単数として一般に「貧しい人々」と訳す
  rationale: ヤコブ2:2–3の具体的な場面とのつながりを保つため単数としたが、より広い代表的適用を排除しない。
- issue: 富んでいる人たちについての修辞疑問
  choice: 聞き手自身の経験を指摘する一般的な問いとして、そのまま保持する
  alternative: すべての富者への普遍的・無例外の断定として訳す
  rationale: 原文は修辞疑問によって共同体が経験している逆説を突いており、原文以上の普遍化を避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「辱める」「虐げる」「引きずって行く」により、名誉の剝奪、権力的圧迫、強制性をそれぞれ区別して表した。脚注記号は対応する語句の直後に配置した。
