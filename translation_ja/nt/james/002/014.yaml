id: JAS.2.14
reference: James 2:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀Τί ὄφελος, ἀδελφοί μου, ἐὰν πίστιν λέγῃ τις ἔχειν ἔργα δὲ μὴ ἔχῃ; μὴ δύναται ἡ πίστις σῶσαι αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/014.yaml
  text: What good is it[a], my brothers[c][b], if someone says he has faith but does not have works? Can that faith save him?
translation:
  language: ja
  text: 私の兄弟たち[a]、もし誰かが、自分には信仰[b]があると言いながら、行いがないなら、何の役に立つでしょうか。その信仰がその人を救うことができるでしょうか[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」はギリシア語の男性複数形による呼びかけで、ここでは信者共同体の男女を代表して指し得ます。別訳「私の兄弟姉妹たち」。
    reason: lexical_alternative
  - marker: b
    text: 「信仰」は「信頼」とも訳せます。文脈によっては「誠実さ」の意味もありますが、ここでは本人があると言う信仰を指します。
    reason: lexical_alternative
  - marker: c
    text: 別訳「そのような信仰がその人を救うことができるでしょうか」。ギリシア語は直訳すると「その信仰が」となり、直前に述べられた、行いのない信仰を指しています。この疑問は否定の答えを予期します。
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὄφελος
  choice: 何の役に立つでしょうか
  rationale: 実際上の益や効用を問う修辞疑問を、現代日本語として自然に表した。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: 原文の男性複数形を保ちつつ、共同体への呼びかけとして訳した。信者共同体全体を代表的に指し得ることは脚注で示す。
- source_word: πίστιν
  choice: 信仰
  rationale: ここでは、あると本人が言明する信仰を指す。「信頼」も語義上可能だが、文脈と用語の連続性から「信仰」が適切。
- source_word: λέγῃ τις ἔχειν
  choice: もし誰かが、自分には……があると言いながら
  rationale: 単なる発言の形を保ち、「主張する」と断定的に解釈しすぎないようにした。後続する対照は「と言いながら」で自然に示した。
- source_word: ἔργα δὲ μὴ ἔχῃ
  choice: 行いがないなら
  rationale: ἔργαを「行い」とし、信仰との対照および周辺文脈との語彙的連続性を保った。
- source_word: μὴ δύναται
  choice: できるでしょうか
  rationale: μήを伴う疑問が否定の答えを予期する修辞疑問であることを、日本語の文脈に委ねて過剰に明示しなかった。
- source_word: ἡ πίστις
  choice: その信仰
  rationale: 定冠詞の照応的な働きを反映し、直前に述べられた、行いを伴わないとされる信仰を指す表現とした。
- source_word: σῶσαι αὐτόν
  choice: その人を救う
  rationale: σῴζωの神学的な重みを保つ標準的な訳語「救う」を用い、αὐτόνは日本語として自然な「その人」とした。
theological_decisions:
- issue: 信仰と行いの関係
  choice: 「その信仰」と訳し、直前に述べられた行いのない信仰を指すようにする。
  alternative: 「信仰がその人を救えるでしょうか」と一般化する、または「そのような信仰」と解釈を明示する。
  rationale: ἡ πίστιςの照応性を保ち、信仰一般についての命題へ広げず、同時に特定の教理的解決を本文へ持ち込まない。
- issue: 呼びかけにおける性の表現
  choice: 本文では「私の兄弟たち」とする。
  alternative: 「私の兄弟姉妹たち」または「皆さん」とする。
  rationale: 原文の男性複数形を保持しながら、信者共同体全体を代表的に指し得ることを脚注で明示する。
- issue: 修辞疑問の否定的含意
  choice: 「救うことができるでしょうか」と疑問形のまま訳す。
  alternative: 「救うことはできないではありませんか」と否定の予期を明示する。
  rationale: 原文の修辞的力は保ちつつ、予期される答えを本文で説明しすぎない。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「何の役に立つでしょうか」と「救うことができるでしょうか」を対応する修辞疑問として整えた。男性形の呼びかけと信仰の語義・照応性は脚注で補足し、本文では神学的緊張を解消しない。
