id: JAS.2.13
reference: James 2:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ γὰρ κρίσις ἀνέλεος τῷ μὴ ποιήσαντι ἔλεος· κατακαυχᾶται ⸀ἔλεος κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/013.yaml
  text: For judgment is without mercy to the one who has shown no mercy[a]; mercy triumphs over judgment.
translation:
  language: ja
  text: あわれみを示さなかった者には、あわれみのない裁きが下されるからです。あわれみは裁きに打ち勝ちます[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あわれみは裁きに対して勝ち誇ります」。ギリシア語の動詞には、相手に対して誇る、または勝ち誇るという意味があります。ここでは文脈上「打ち勝ちます」と訳しました。
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίσις / κρίσεως
  choice: 裁き
  rationale: 神による司法的な評価という文脈上の力を保ちつつ、二度の用例を同じ語で訳して節内の対比を明確にした。
- source_word: ἀνέλεος
  choice: あわれみのない
  rationale: ἔλεοςとの語のつながりを日本語でも保ち、裁きの性質を明瞭に表した。
- source_word: τῷ μὴ ποιήσαντι ἔλεος
  choice: あわれみを示さなかった者には
  rationale: ποιέωとἔλεοςの組み合わせは「あわれみを行う」、すなわち「あわれみを示す」という意味であり、現代日本語として自然に訳した。アオリスト分詞はここでその者を特徴づける表現として過去形にした。
- source_word: κατακαυχᾶται
  choice: 打ち勝ちます
  rationale: 基本的な比喩である「誇る／勝ち誇る」の響きを踏まえつつ、この文脈で裁きに優越するという修辞的な力を自然な日本語で伝えた。字義的な可能性は脚注に残した。
- source_word: ἔλεος
  choice: あわれみ
  rationale: 慈悲深い行為と態度の双方を表せる一般的な訳語であり、節内で繰り返して原文の結びつきを保った。
theological_decisions:
- issue: 結語「κατακαυχᾶται ἔλεος κρίσεως」の主語と射程
  choice: 一般原則として「あわれみは裁きに打ち勝ちます」と訳す
  alternative: 「あわれみは裁きに対して勝ち誇ります」、または、あわれみ深い人が示したあわれみが裁きの際に優位に立つという限定的理解
  rationale: 原文は簡潔で、あわれみが神のあわれみを指すのか、人が示すあわれみを指すのかを明示していない。その曖昧さを保ち、功績による救いなどの特定の教理を訳文に持ち込まないようにした。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、聖書本文としての格調を保った。「憐れみ」ではなく「あわれみ」と開いて読みやすくし、前半の反復による警告と後半の簡潔な希望の対照を維持した。
