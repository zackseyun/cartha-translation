  text: Ἀβραὰμ ὁ πατὴρ ἡμῶν οὐκ ἐξ ἔργων ἐδικαιώθη, ἀνενέγκας Ἰσαὰκ τὸν υἱὸν αὐτοῦ ἐπὶ τὸ θυσιαστήριον;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/021.yaml
  text: Was not Abraham our father justified by works when he offered up Isaac his son on the altar?[a]
translation:
  language: ja
  text: 私たちの父であるアブラハムは、その子イサクを祭壇にささげたとき、行いによって義と認められたのではありませんか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正しい者であることが示された」または「正しいと証明された」。ギリシア語の動詞は、文脈によって「義と認められる」という意味にも、「正しさが示される」という意味にもなり得る。
    reason: alternative_reading
lexical_decisions:
- source_word: πατὴρ ἡμῶν
  choice: 私たちの父
  rationale: 契約共同体におけるアブラハムとの家族的な結びつきを保つ。「私たちの祖先」よりも原文の比喩的・関係的な力を直接伝える。
- source_word: ἐξ ἔργων
  choice: 行いによって
  rationale: ἐξが示す根拠・手段の含みを、現代日本語として自然に表しつつ、この段落の神学的な用語のつながりを保つ。
- source_word: ἐδικαιώθη
  choice: 義と認められた
  rationale: δικαιόωの宣言的な意味を自然な日本語で表しながら、「正しい者であることが示された」という文脈上可能な意味に一義的に限定しない。代替の含みは脚注に示す。
- source_word: ἀνενέγκας
  choice: ささげたとき
  rationale: アオリスト分詞の時間的関係を自然に示し、イサクを祭壇に供えたという犠牲奉献の文脈を保つ。
- source_word: θυσιαστήριον
  choice: 祭壇
  rationale: 犠牲をささげる場所を指す標準的で明瞭な訳語。
- source_word: οὐκ ... ἐδικαιώθη;
  choice: 義と認められたのではありませんか
  rationale: 肯定の答えを予期するギリシア語の修辞疑問を、自然で格調ある現代日本語として再現する。
theological_decisions:
- issue: ヤコブ2章21節におけるδικαιόωと行いの関係
  choice: 本文では「義と認められた」とし、義認をめぐる語彙的つながりと神学的緊張を保つ。
  alternative: 「正しい者であることが示された」「正しいと証明された」
  rationale: この箇所は信仰と行いの関係を論じており、δικαιόωを純粋に法廷的な宣言、または単なる実証のどちらかに固定すると原文の含みを狭める。本文では広がりのある訳語を用い、実証・立証の可能性を脚注に残す。
translation_notes:
  register: 明瞭で格調ある現代標準語。「御子」など過度に古風な語を避け、「その子」で原文の所有関係を自然に示した。「ささげる」は宗教的文脈になじむ表記として平仮名を用いた。
