id: JAS.2.8
reference: James 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Εἰ μέντοι νόμον τελεῖτε βασιλικὸν κατὰ τὴν γραφήν Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν, καλῶς ποιεῖτε·
base_translation:
  language: en
  yaml_path: translation/nt/james/002/008.yaml
  text: If[a], however, you are fulfilling the royal law according to the Scripture, “You shall love your neighbor as yourself,” you are doing well.
translation:
  language: ja
  text: しかし、聖書に従って、「あなたの隣人を自分自身のように愛しなさい」という王の律法[a]を実行しているのなら、あなたがたは正しいことをしています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「王的な律法」。王から出た律法、最高位の律法、または御国に属する律法という意味を含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ μέντοι
  choice: しかし、…のなら
  rationale: 条件を表す εἰ と、軽い対比・限定を添える μέντοι の両方を、自然な現代日本語で表した。
- source_word: νόμον ... βασιλικὸν
  choice: 王の律法
  rationale: βασιλικός の王に属する性格を簡潔に示しつつ、その由来・最高位・御国との関係のいずれか一つに意味を限定しない。別の可能性は脚注に示した。
- source_word: τελεῖτε
  choice: 実行している
  rationale: 律法の要求を実際に成し遂げるという τελέω の意味と現在形を自然に表す。
- source_word: κατὰ τὴν γραφήν
  choice: 聖書に従って
  rationale: 聖書に記された内容に即して、またそれに合致して、という意味を明瞭に表す。
- source_word: Ἀγαπήσεις
  choice: 愛しなさい
  rationale: 未来形が命令の働きをする引用であるため、現代日本語で明確な命令形とした。
- source_word: τὸν πλησίον σου
  choice: あなたの隣人
  rationale: 倫理的意味での πλησίον に対応する、定着した自然な聖書用語を用いた。
- source_word: ὡς σεαυτόν
  choice: 自分自身のように
  rationale: 原文の簡潔な比較表現を、補足的な語を加えず保持した。
- source_word: καλῶς ποιεῖτε
  choice: あなたがたは正しいことをしています
  rationale: 行為への肯定を明確にし、現在形の継続的な響きも保つ。
theological_decisions:
- issue: 「王の律法」の意味
  choice: 王に属する性格を持つ律法として訳し、意味の幅を保つ
  alternative: 王が与えた律法／諸律法のうち最高の律法／御国の律法
  rationale: βασιλικός は王的な由来、最高の地位、御国との関連を示し得るため、本文では一つの教理的説明に限定せず、脚注で可能性を示す。
translation_notes:
  register: 明瞭で現代的ながら尊厳のある文体。レビ記19章18節の引用は、命令として自然な「愛しなさい」とした。条件文の論理を保ち、意味を教派的に限定する表現は避けた。
