source:
  edition: SBLGNT
  text: ⸂ἐπιβλέψητε δὲ⸃ ἐπὶ τὸν φοροῦντα τὴν ἐσθῆτα τὴν λαμπρὰν καὶ ⸀εἴπητε· Σὺ κάθου ὧδε καλῶς, καὶ τῷ πτωχῷ εἴπητε· Σὺ στῆθι ⸂ἢ κάθου ἐκεῖ⸃ ὑπὸ τὸ ὑποπόδιόν μου,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/003.yaml
  text: and if you pay attention to the one wearing the bright clothing and say[a], “You sit here in a good place,” and say to the poor man, “You stand there[b], or sit under my footstool,”
translation:
  language: ja
  text: そして、華やかな服を着た人に目を留めて[a]、「あなたはこちらの良い席にお座りください」と言い、貧しい人には、「あなたは立っていなさい。あるいは、そこで私の足台の下に座りなさい[b]」と言うなら、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「きらびやかな服」または「立派な服」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 写本によっては「あるいは、そこで座りなさい」に当たる語句がなく、「あなたは立っていなさい。あるいは、私の足台の下に座りなさい」となる。ここでは、その語句を含む本文に従った。
    reason: textual_variant
lexical_decisions:
- source_word: ἐπιβλέψητε
  choice: 目を留めて
  rationale: 単に見るだけでなく、特別に注意を向ける含みを自然な日本語で表す。ただし、この節だけで「えこひいきする」と解釈を明示しすぎない。
- source_word: φοροῦντα
  choice: 着た
  rationale: 衣服を身に着けていることを簡潔で自然な現代日本語にする。
- source_word: ἐσθῆτα τὴν λαμπράν
  choice: 華やかな服
  rationale: λαμπρόςの「輝く、きらびやかな、立派な」という意味域と、目を引く上等な装いという文脈を自然に伝える。別訳は脚注に示す。
- source_word: Σὺ κάθου ὧδε καλῶς
  choice: あなたはこちらの良い席にお座りください
  rationale: καλῶςが示す好ましい場所という対比を「良い席」で明確にし、富裕な来訪者への丁重な扱いは敬語で再現する。
- source_word: τῷ πτωχῷ
  choice: 貧しい人
  rationale: 特定の一人を指すことを保ちつつ、現代日本語では文脈上自然な「人」とする。ギリシア語の文法的男性を不必要に「男」と強調しない。
- source_word: στῆθι
  choice: 立っていなさい
  rationale: その場に立ったままでいるよう命じる場面として自然であり、富裕な人への丁重な言葉との待遇差も表れる。
- source_word: ἢ κάθου ἐκεῖ
  choice: それとも、…座りなさい
  rationale: 二つの屈辱的な選択肢を示すἤを保つ。ἐκεῖは採用本文の統語上、後続の足台の位置を指すものとして日本語では重ねて訳出しない。
- source_word: ὑπὸ τὸ ὑποπόδιόν μου
  choice: 私の足台の下に
  rationale: ὑπό＋対格の空間的な「下に」を保ち、意図的に屈辱的で不自然さもある表現を弱めない。
theological_decisions:
- issue: 社会的なえこひいきの表現
  choice: 具体的な注目、席、命令の対比によって差別的待遇を描く
  alternative: 本文で「特別扱いする」「えこひいきする」と明示する
  rationale: 文脈上の非難は明らかだが、この節自体は具体的な言動を提示しているため、教理的評価語を先取りせず、対比から意味が立ち上がるようにした。
- issue: πτωχῷの性別表現
  choice: 貧しい人
  alternative: 貧しい男
  rationale: ギリシア語は男性単数形だが、ここで生物学的性別が論点とは限らない。特定の一人という単数性を保ちながら、現代日本語として過剰な性別明示を避けた。
- issue: 富裕な人と貧しい人への発話の待遇差
  choice: 前者には敬語、後者には尊大な命令形を用いる
  alternative: 双方を同じ文体の命令として訳す
  rationale: 原文の命令形そのものは双方にあるが、καλῶςと場所の対照が示す社会的待遇の落差を、日本語で自然に伝えるため。
translation_notes:
  register: 明瞭で品位ある現代標準語。富裕な人への「お座りください」と貧しい人への「立っていなさい／座りなさい」の落差を利用し、原文が描く偏った待遇を説明語なしで伝える。節が次節へ続く条件節であるため、末尾は「と言うなら、」とした。
