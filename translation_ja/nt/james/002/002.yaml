  text: ἐὰν γὰρ εἰσέλθῃ ⸀εἰς συναγωγὴν ὑμῶν ἀνὴρ χρυσοδακτύλιος ἐν ἐσθῆτι λαμπρᾷ, εἰσέλθῃ δὲ καὶ πτωχὸς ἐν ῥυπαρᾷ ἐσθῆτι,
base_translation:
  language: en
  yaml_path: translation/nt/james/002/002.yaml
  text: For if a man wearing gold rings and bright clothing enters into your assembly[a], and a poor man in filthy clothing also enters,
translation:
  language: ja
  text: というのも、もし、あなたがたの集まり[a]に、金の指輪をはめ、きらびやかな服を着た男性が入って来て、汚れた服を着た貧しい男性も入って来るとすれば、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「会堂」。ギリシア語は「シナゴーゲー」で、「会堂」または「集まり」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: συναγωγήν
  choice: 集まり
  rationale: 語義として「会堂」と「集会」の両方があり、ここでは信者たちの集まりを自然に表す「集まり」とした。原語の具体性は脚注に残した。
- source_word: ἀνὴρ
  choice: 人
  rationale: 男性単数だが、日本語では「人」が自然であり、人物を指す語として性別を不必要に曖昧化するものではない。後半の貧しい人物との対比も保てる。
- source_word: χρυσοδακτύλιος
  choice: 金の指輪をはめ
  rationale: 文字どおりには指を金で飾った状態を表す形容詞であり、自然な日本語で富裕な外見を具体的に示す。単数か複数かを日本語で過度に限定しない。
- source_word: ἐσθῆτι λαμπρᾷ
  choice: きらびやかな服
  rationale: λαμπρόςの明るさと華麗さの双方を伝え、対照的に目を引く装いを自然に表す。
- source_word: πτωχὸς
  choice: 貧しい人
  rationale: 形容詞の名詞的用法を自然に訳し、第一の人物との社会的・経済的対比を明確にした。
- source_word: ῥυπαρᾷ ἐσθῆτι
  choice: 汚れた服
  rationale: ῥυπαρόςの実際の汚れや不潔さを保ち、「みすぼらしい」のように衣服の質へ意味をずらさない。
- source_word: εἰσέλθῃ ... εἰσέλθῃ
  choice: 入って来て……も入って来た
  rationale: 同じ動詞の反復と二人の登場の並行性を保ちつつ、日本語の仮定例として自然な文にした。
- source_word: γὰρ
  choice: というのも
  rationale: 前節の戒めを具体例で説明する論理的つながりを、現代日本語で明確に示す。
theological_decisions:
- issue: キリスト者の文脈における συναγωγή の訳
  choice: 集まり
  alternative: 会堂
  rationale: 特定の制度的建物を断定せず、共同体が集う場面を表す。原語が「会堂」とも訳せることは脚注で明示し、初期のユダヤ的キリスト教集会語法である可能性を残す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。前節との説明的接続を保ち、例示の仮定性を「とします」で自然に示した。人物の外見上の対比は強く保ちながら、原文が明示しない宗教施設や教会制度は断定していない。
