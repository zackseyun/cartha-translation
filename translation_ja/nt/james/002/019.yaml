source:
  edition: SBLGNT
  text: σὺ πιστεύεις ὅτι ⸂εἷς ἐστιν ὁ θεός⸃; καλῶς ποιεῖς· καὶ τὰ δαιμόνια πιστεύουσιν καὶ φρίσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/019.yaml
  text: You believe that God is one[a]; you do well[b]. Even the demons believe—and shudder.
translation:
  language: ja
  text: あなたは、神は唯一である[a]と信じている。それは結構なことだ。悪霊たちでさえ信じ、震えおののいている。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神はただひとりである」。ギリシア語はどちらにも訳せるが、「神は唯一である」は原文の表現により近く、ユダヤ人の唯一神信仰の告白を響かせている可能性がある。
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ
  choice: あなたは
  rationale: 明示された二人称単数代名詞を訳出し、相手に直接語りかける強調を自然な日本語で保った。
- source_word: πιστεύεις / πιστεύουσιν
  choice: 信じている／信じて
  rationale: ὅτι節の内容を真実と認める意味に適し、二つの動詞の語彙的反復も保持する。「信頼する」では人格的な委ねを読み込みすぎる。
- source_word: εἷς ἐστιν ὁ θεός
  choice: 神は唯一である
  rationale: ギリシア語の述語構造と、唯一神信仰の告白を思わせる表現を保つ。存在文としての「神は一人だけである」も可能なため脚注で示した。
- source_word: καλῶς ποιεῖς
  choice: それは結構なことだ
  rationale: 短い肯定を現代日本語として自然かつ品位ある形で表し、直後の鋭い対比を損なわない。
- source_word: καὶ τὰ δαιμόνια
  choice: 悪霊どもでさえ
  rationale: καίの累加・強意を「でさえ」で表し、δαιμόνιαを一般読者に明瞭な「悪霊」とした。「ども」は一群を指すとともに否定的な含みを自然に伝える。
- source_word: φρίσσουσιν
  choice: 震え上がっている
  rationale: 恐怖による強い身体反応を表すφρίσσωの力を、現代日本語で生き生きと伝える。単なる「震えている」より恐れの含意が明確である。
theological_decisions:
- issue: εἷς ἐστιν ὁ θεόςという唯一神告白の訳し方
  choice: 神は唯一である
  alternative: 神は一人だけである／神はただひとりである
  rationale: ギリシア語の述語表現に近く、イスラエルの唯一神告白との響き合いを保つ。一方、存在を強調する訳も文法上可能なので脚注に残した。
- issue: 人の信仰告白と悪霊の信仰との対比
  choice: 悪霊どもでさえ信じて、震え上がっている
  alternative: 悪霊どもも信じて、震えている
  rationale: καίの強意を「でさえ」で示し、正しい命題への同意だけでは十分でないというヤコブの修辞的・神学的緊張を、説明の付加なしに保持した。
translation_notes:
  register: 明瞭な現代標準語を用い、断定の簡潔さとヤコブの鋭い修辞を保持した。「それは結構なことだ」は過度に口語的にも古風にもならない短い肯定。「震え上がっている」は恐怖反応を明確にする。英語版の脚注bは英語のshudder/tremble間の語彙選択に関するもので、日本語本文では自然に強意を表せるため独立脚注を設けなかった。
