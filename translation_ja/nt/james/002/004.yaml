id: JAS.2.4
reference: James 2:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ⸀οὐ διεκρίθητε ἐν ἑαυτοῖς καὶ ἐγένεσθε κριταὶ διαλογισμῶν πονηρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/004.yaml
  text: have you not made distinctions among yourselves and become judges with evil thoughts?[a][b]
translation:
  language: ja
  text: あなたがたは、自分たちの間で分け隔てをし[a]、よこしまな考えを持つ裁き手になったのではありませんか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自分たちの間で差別をし」。この動詞は「分裂する」、別の文脈では「疑う」という意味にもなり得るが、ここでは人を不当に区別する意味が文脈に最もよく合う。
    reason: lexical_alternative
  - marker: b
    text: 直訳「よこしまな考え（または、推論）の裁き手」。
    reason: lexical_alternative
lexical_decisions:
- source_word: διεκρίθητε
  choice: 分け隔てをし
  rationale: 直前の2:1–3では富んだ人と貧しい人を異なる仕方で扱うことが問題となっているため、ここでは社会的な差別や不当な区別を表す語として訳した。「疑う」「分裂する」という語義の可能性は脚注に残した。
- source_word: ἐν ἑαυτοῖς
  choice: 自分たちの間で
  rationale: 集会における共同体内の振る舞いが文脈の中心なので、内面的な意味の「自分自身の内で」よりも、相互関係を示す表現を選んだ。
- source_word: ἐγένεσθε
  choice: なった
  rationale: 分け隔てをした結果、彼らがどのような裁き手となったかを示す自然で直接的な訳語。
- source_word: κριταὶ
  choice: 裁き手
  rationale: 司法的・道徳的な響きを保ちつつ、必ずしも公職の裁判官を指すと誤解されないよう「裁き手」とした。
- source_word: διαλογισμῶν πονηρῶν
  choice: よこしまな考えを持つ
  rationale: 属格を自然な日本語にしながら、διαλογισμόςの「考え・推論」という内容を保った。「悪い動機」は意味を狭めすぎるため避けた。原文の直訳的な構造は脚注に示した。
- source_word: οὐ
  choice: …のではありませんか
  rationale: 肯定の答えを予期する叱責的な修辞疑問の力を、自然な現代日本語で表した。
theological_decisions:
- issue: διακρίνωがえこひいきとの関係で表す意味
  choice: 信仰共同体の中で差別的な区別をすることへの叱責
  alternative: 心の内で分裂すること、または疑うことへの言及
  rationale: ヤコブ1:6などでは「疑う」という意味があり得るが、2:1–3の直接の文脈は富んだ人を優遇し、貧しい人を冷遇する行為である。そのため本文では「分け隔てをする」と訳し、別の可能性は脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「分け隔て」は一般読者に理解しやすく、直前のえこひいきの具体例にも自然につながる。「裁判官」ではなく「裁き手」とすることで、共同体内で他者を値踏みして裁くという倫理的な意味を保った。
