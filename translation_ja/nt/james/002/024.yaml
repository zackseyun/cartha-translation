  text: ⸀ὁρᾶτε ὅτι ἐξ ἔργων δικαιοῦται ἄνθρωπος καὶ οὐκ ἐκ πίστεως μόνον.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/024.yaml
  text: You see that a man is justified by works and not by faith alone[a][b][c].
translation:
  language: ja
  text: あなたがたは、人が行いによって義とされるのであって、信仰だけによるのではないことが分かります[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正しい者であることが示される」または「正しいと認められる」。ヤコブの表現を保ち、ここでの「義とされる」がパウロの用法とどのように関係するかという解釈上の議論を、訳文では決着させていない。
    reason: alternative_reading
  - marker: b
    text: 「信仰」は、文脈によっては「忠実さ」または「信頼」とも訳し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁρᾶτε
  choice: あなたがたには……ことが分かります
  rationale: 二人称複数の現在直説法として、先の例から読者が理解できることを直接語りかける表現。命令形にはせず、現代日本語として自然にした。
- source_word: ἐξ ἔργων
  choice: 行いによって
  rationale: ἐξが示す根拠・よりどころを自然な日本語で表し、「行い」というヤコブ書の文脈上の語を保った。
- source_word: δικαιοῦται
  choice: 義とされる
  rationale: δικαιόωの中心的かつ神学的に重要な表現を保ち、「正しい者であることが示される」「正しいと認められる」という文脈上可能な意味に本文だけで限定しなかった。
- source_word: ἄνθρωπος
  choice: 人
  rationale: ここでは人間一般を代表して指す語であり、日本語の「人」は性別を限定せず、その一般的用法を自然に表す。
- source_word: πίστεως
  choice: 信仰
  rationale: πίστιςの基本訳を採用し、行いとの対比を明確に保った。別の語義の可能性は注に示した。
- source_word: μόνον
  choice: だけ
  rationale: πίστεωςを限定する語として「信仰だけ」とし、μόνονの排他的意味を簡潔で自然な日本語にした。
theological_decisions:
- issue: δικαιοῦταιの意味と義認をめぐる神学的緊張
  choice: 本文では「義とされる」と訳し、ヤコブの表現をそのまま保つ。
  alternative: 「正しい者であることが示される」「正しいと認められる」
  rationale: δικαιόωには、義とする、正しいと認める、正しさを立証するという意味領域がある。本文で一つの解釈に狭めず、パウロの用法との関係を訳文によって解消しない。
- issue: ἄνθρωποςの一般的用法
  choice: 「人」と訳す。
  alternative: 「人間」
  rationale: 男性だけを指す文脈ではなく、人間一般についての主張である。日本語では「人」が原文の単数形と代表的な意味を自然に伝える。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「義とされる」「信仰」「行い」という重要語の対応と神学的緊張を保持した。「あなたがたには……分かります」により、ὁρᾶτεの複数の聞き手への直接的な語りかけと直説法の力を自然に表した。
