  source_fidelity: 本文は禁止命令、えこひいき、主イエス・メシアへの信仰という基本的意味をよく伝えている。しかし、τῆς δόξηςを「栄光ある方」と独立して後置する現行の語順は、日本語として何に係るかが不明瞭である。また脚注cの「信実」は、この文脈で属格構文の主要な代案として提示するには根拠が弱く、英語監査記録の争点（「～への信仰」対「～の信仰」）とも一致しない。
