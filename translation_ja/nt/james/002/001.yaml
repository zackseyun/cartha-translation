  terminology: 「主」「イエス」「メシア」「信仰」は適切である。Χριστόςの称号性を保つため「メシア」を維持する。「兄弟たち」は原文の男性複数形を保ち、共同体全体への呼びかけでありうる点を脚注で示すのが適切である。
