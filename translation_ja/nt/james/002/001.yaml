  text: Ἀδελφοί μου, μὴ ἐν προσωπολημψίαις ἔχετε τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τῆς δόξης;
base_translation:
  language: en
  yaml_path: translation/nt/james/002/001.yaml
  text: My brothers[d][c][b][a], do not hold the faith of our Lord Jesus the Messiah with partiality.
translation:
  language: ja
  text: 私の兄弟たち[a]、栄光に満ちた私たちの主イエス・メシアへの信仰を、えこひいきを伴わせてはなりません。[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹の皆さん」とも訳せる。ギリシア語は「兄弟たち」だが、ここでは信仰共同体全体への呼びかけと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「栄光の主である、私たちの主イエス・メシアへの信仰」。
    reason: alternative_reading
  - marker: c
    text: 直訳に近くは「私たちの主イエス・メシアの信仰」。また「私たちの主イエス・メシアに対する信仰」とも訳せる。ギリシア語の属格構文には解釈の幅がある。
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: 男性複数形の呼びかけを形態上忠実に訳した。文脈上は信仰共同体全体への呼びかけであるため、包括的な意味は脚注に示す。
- source_word: μὴ ... ἔχετε
  choice: 結びつけてはなりません
  rationale: μήを伴う現在命令形の禁止を明確に表す。日本語で「信仰をえこひいきのうちに持つ」と直訳するより、両者を両立させないよう戒める意味を自然に伝える。
- source_word: ἐν προσωπολημψίαις
  choice: えこひいきと
  rationale: 身分や外見によって人を偏って扱うことを、現代日本語で分かりやすく表す。ギリシア語の複数形は個々のえこひいきの行為を含みうるが、日本語では集合的に単数で表すのが自然。
- source_word: τὴν πίστιν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: 私たちの主イエス・メシアへの信仰
  rationale: 後続の属格を、ここでは自然な日本語となる目的的関係「～への信仰」として訳す。ただし「主イエス・メシアの信仰／信実」という別解の余地を脚注で保つ。Χριστόςは称号として「メシア」とする。
- source_word: τῆς δόξης
  choice: 栄光ある方
  rationale: δόξηςを主イエス・メシアに係る表現と理解し、荘重さを保ちながら日本語として明瞭にした。「栄光の主」という同格的理解も可能なので脚注に示す。
theological_decisions:
- issue: πίστιςと属格τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦの関係
  choice: 「私たちの主イエス・メシアへの信仰」
  alternative: 「私たちの主イエス・メシアの信仰（または信実）」
  rationale: 日本語本文では勧告の意味が最も明瞭な目的的属格として表したが、ギリシア語の属格構文だけでは関係を一義的に固定できないため、別解を脚注に残す。
- issue: τῆς δόξηςの統語的関係
  choice: 「栄光ある方」として主イエス・メシアに係ける
  alternative: 「栄光の主」
  rationale: δόξηςは「主」に同格的に係るとも、形容的に「栄光ある」と表せるとも解される。本文では過度に説明的にならない表現を選び、伝統的な別訳を脚注に保つ。
- issue: Ἀδελφοίの性と指示範囲
  choice: 「兄弟たち」
  alternative: 「兄弟姉妹の皆さん」
  rationale: 文法上の男性複数を本文に保つ一方、実際の呼びかけが男女を含む信仰共同体に向けられている可能性を脚注で明示する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、「えこひいき」で倫理的な非難を直接伝えた。敬体の禁止表現により、共同体への牧会的な呼びかけとしての品位を保った。
