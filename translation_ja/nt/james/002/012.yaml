  text: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε ὡς διὰ νόμου ἐλευθερίας μέλλοντες κρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/012.yaml
  text: So speak and so act as those who are going to be judged through the law of freedom.
translation:
  language: ja
  text: 自由の律法を通して裁かれることになる者として、そのように語り、そのように行いなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως λαλεῖτε καὶ οὕτως ποιεῖτε
  choice: 語り、また行いなさい
  rationale: 反復されるοὕτωςは後続のὡς節が示す生き方を受ける。日本語では「そのように」を二度重ねず、命令の並行性を自然に保った。
- source_word: ὡς ... μέλλοντες κρίνεσθαι
  choice: 裁かれようとしている者らしく
  rationale: ὡςは規範となる身分・状況を「者らしく」で表し、μέλλοντεςの将来的な見通しを「ようとしている」で保持した。
- source_word: διὰ νόμου ἐλευθερίας
  choice: 自由をもたらす律法を通して
  rationale: διά＋属格の媒介的意味を「を通して」とし、属格ἐλευθερίαςは自然な日本語で律法の性質・働きを示す「自由をもたらす」と訳した。
theological_decisions:
- issue: 裁きにおける「自由の律法」の関係
  choice: 律法を通して裁かれる
  alternative: 律法によって裁かれる
  rationale: διά＋属格の媒介性を明示し、律法を直接の裁き主とみなすような読みを避けつつ、裁きとの実質的な関係は保持した。
- issue: νόμος ἐλευθερίαςの属格関係
  choice: 自由をもたらす律法
  alternative: 自由の律法
  rationale: 「自由の律法」が持つ圧縮された曖昧さよりも、律法と自由の積極的関係を普通の読者に明瞭に伝える表現を選んだ。ただし、自由の源・特徴・領域のいずれかに過度に限定しない。
translation_notes:
  register: 現代標準語の簡潔で格調ある勧告文。命令形「なさい」は明瞭だが過度に威圧的ではなく、使徒的勧告の力を保つ。
