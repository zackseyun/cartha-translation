id: JAS.2.23
reference: James 2:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἐπληρώθη ἡ γραφὴ ἡ λέγουσα· Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην, καὶ φίλος θεοῦ ἐκλήθη.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/023.yaml
  text: And the Scripture was fulfilled that says[a], “Abraham believed God, and it was counted to him as righteousness,” and he was called a friend of God.
translation:
  language: ja
  text: こうして、「アブラハムは神を信じ、それが彼の義と認められた」と言う聖書の言葉が成就し、彼は神の友と呼ばれた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπληρώθη
  choice: 成就し
  rationale: 聖書引用の成就を表す受動形。日本語では「聖書の言葉が成就し」とすることで、引用された言葉がアブラハムの行動において実現したというヤコブの主張を自然に保つ。
- source_word: ἡ γραφὴ ἡ λέγουσα
  choice: 「…」と言う聖書の言葉
  rationale: γραφήを聖なる書としての「聖書」とし、分詞λέγουσαを自然な現代日本語の引用表現にした。「聖書の言葉」は、特定の引用箇所を指す単数形の機能を明確にする。
- source_word: Ἐπίστευσεν ... Ἀβραὰμ τῷ θεῷ
  choice: アブラハムは神を信じ
  rationale: πιστεύωと与格の組み合わせを、神の言葉を真実として受け入れた意味を保つ「神を信じる」で訳した。「神に信頼した」も可能だが、創世記引用の簡潔な表現を優先した。
- source_word: ἐλογίσθη αὐτῷ εἰς δικαιοσύνην
  choice: それが彼の義と認められた
  rationale: λογίζομαιの算定・帰属の含みを「認められた」で表し、εἰς δικαιοσύνηνを「義と」とした。「それ」は直前の信じたことを受けるが、原文同様、何がどのような意味で帰属されたかを過度に説明しない。
- source_word: φίλος θεοῦ
  choice: 神の友
  rationale: 属格を自然で簡潔な関係表現とし、神との親しい関係を示しつつ、それ以上の解釈を加えない。
- source_word: ἐκλήθη
  choice: 呼ばれた
  rationale: καλέωの受動形を直接的に訳し、称号として名づけられたのか、そのように認知されたのかという原文の幅を残す。
theological_decisions:
- issue: アブラハムの信仰と行いの関係
  choice: 「聖書の言葉が成就し」と訳し、直前の従順な行動によって創世記15章6節の言葉が成就したという文脈上のつながりを保つ。
  alternative: 義認を行いから切り離すように説明的に訳す、または行いが信仰に取って代わるように訳す。
  rationale: 本文は信仰についての創世記の言葉と、後に示されたアブラハムの従順を結びつけている。翻訳ではこの神学的緊張を解消せず、そのまま示す。
- issue: δικαιοσύνηの訳語
  choice: 義
  alternative: 正しさ、正義
  rationale: 創世記引用と義認をめぐる文脈には、聖書語として定着しつつ簡潔な「義」が最も適する。「正義」は社会的公正に意味が寄りやすい。
- issue: 接続詞καίと引用中のδέ
  choice: 冒頭を「こうして」とし、引用冒頭には接続語を置かない。
  alternative: すべてを「そして」で逐語的に連結する。
  rationale: 冒頭のκαίは前節からの帰結的なつながりを担うため「こうして」が自然。引用中のδέは日本語では明示しなくても流れが保たれ、創世記引用として自然に読める。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「義」「成就」など本文の神学的・聖書的重みを担う語は保持した。文体は朗読にも適する簡潔で品位ある調子とした。
