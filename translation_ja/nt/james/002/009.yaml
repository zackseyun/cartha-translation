  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ προσωπολημπτεῖτε, ἁμαρτίαν ἐργάζεσθε, ἐλεγχόμενοι ὑπὸ τοῦ νόμου ὡς παραβάται.
base_translation:
  language: en
  yaml_path: translation/nt/james/002/009.yaml
  text: But if you show partiality[d][c][b][a], you commit sin and are convicted by the law as transgressors.
translation:
  language: ja
  text: しかし、人を分け隔てするなら[a]、罪を犯し、律法によって違反者として責められます[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人をえこひいきするなら」。原語は、外見や地位によって人を判断し、扱いを変えることを指す。
    reason: lexical_alternative
  - marker: b
    text: 「責められます」は、「誤りを明るみに出されます」「有罪だと示されます」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「違反者として」は、「律法を破る者として」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: しかし、…なら
  rationale: εἰの条件と、δέが示す前の文脈との穏やかな対照を、自然な現代日本語で表した。
- source_word: προσωπολημπτεῖτε
  choice: 人を分け隔てする
  rationale: 外見や社会的地位によって人を不公平に扱うという意味を表す。直訳的な「顔を受ける」は避け、行為の内容が明確な表現とした。
- source_word: ἁμαρτίαν ἐργάζεσθε
  choice: 罪を犯している
  rationale: 「罪を行う」という語の結び付きを自然な日本語にしつつ、現在形が示す行為の現実性を保った。
- source_word: ἐλεγχόμενοι
  choice: 責められます
  rationale: 誤りを明るみに出し、有罪であることを示す受動分詞の意味を簡潔に表した。日本語では主節に並ぶ述語として処理し、条件文全体を自然にした。
- source_word: ὑπὸ τοῦ νόμου
  choice: 律法によって
  rationale: 受動表現の行為主体を保った。「律法」はヤコブ書の文脈に合う聖書的用語だが、モーセ律法などに範囲を限定していない。
- source_word: ὡς παραβάται
  choice: 違反者だと
  rationale: 定められた境界を越え、規範に背く者という法的な意味を保つ。「律法違反者」も可能だが、原文の名詞に「律法」を重ねて補わない表現を本文に採った。
theological_decisions:
- issue: ヤコブの倫理的議論における νόμος の範囲
  choice: 「律法」と訳し、それ以上に限定しない。
  alternative: 「モーセの律法」または「神の律法」
  rationale: 本文は、人を分け隔てすることを罪として明らかにする規範として律法を示すが、その範囲をこの節だけで特定してはいないため、特定の契約理解や教派的解釈を付加しない。
- issue: ἐλεγχόμενοι の統語的関係
  choice: 「罪を犯しているのであり、…責められます」と、主節に伴う結果・状態として表す。
  alternative: 「律法によって責められながら、罪を犯しています」
  rationale: 分詞が持つ関係を過度に限定せず、罪を犯すことと律法による指摘・有罪認定の結び付きを保ちながら、日本語として自然にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「分け隔てする」は一般読者に理解しやすく、文脈上の不公平な扱いを表す。「律法」「罪」は聖書本文として定着した語を用いながら、文構造は現代的で自然に整えた。
