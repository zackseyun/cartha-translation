id: JAS.5.15
reference: James 5:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ εὐχὴ τῆς πίστεως σώσει τὸν κάμνοντα, καὶ ἐγερεῖ αὐτὸν ὁ κύριος· κἂν ἁμαρτίας ᾖ πεποιηκώς, ἀφεθήσεται αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/015.yaml
  text: And the prayer of faith will save the one who is sick[a], and the Lord will raise him up. And if he has committed sins[c][b], he will be forgiven.
translation:
  language: ja
  text: 信仰による祈りは、病んでいる人を救い[a]、主がその人を起き上がらせてくださいます。その人が罪を犯していたとしても[b]、赦されます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「癒やす」または「元気にする」とも訳せます。ギリシア語は「救う」です。
    reason: lexical_alternative
  - marker: b
    text: 「その人が罪を犯していたなら」とも訳せます。
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχὴ τῆς πίστεως
  choice: 信仰による祈り
  rationale: 文脈上、εὐχήは「誓願」ではなく祈りを指す。属格 πίστεωςは、神への信頼に基づく、または信仰を特徴とする祈りという自然な意味を表すため、「信仰による」とした。
- source_word: σώσει
  choice: 救い
  rationale: 病の文脈では「癒やす、回復させる」の意味を含むが、原語 σῴζω のより広い「救う」という語義と、身体的・霊的救済の響きを保った。
- source_word: τὸν κάμνοντα
  choice: 病んでいる人
  rationale: κάμνω には疲労や衰弱の意味もあるが、直前の病人、油注ぎ、祈りという文脈では病気の人を指す。
- source_word: ἐγερεῖ
  choice: 起き上がらせてくださいます
  rationale: ἐγείρω の「起こす、立ち上がらせる」という像を保ち、病床からの回復を自然に表現した。主を動作主とするため、現代日本語として自然な敬意表現を用いた。
- source_word: κἂν ἁμαρτίας ᾖ πεποιηκώς
  choice: その人が罪を犯していたとしても
  rationale: κἄν の条件的・譲歩的な含みを「としても」で表し、病が常に本人の罪に起因するとの読みを避けた。完了形の含意は「犯していた」で示した。
- source_word: ἀφεθήσεται αὐτῷ
  choice: 赦されます
  rationale: 未来受動形による神的受動を自然な日本語で表した。赦される対象は文脈上その人の罪であり、「その人は赦されます」よりも、罪が赦されるという原文の構造に近い主語省略とした。
theological_decisions:
- issue: σώσειを身体的な癒やしに限定するか、より広い救いとして訳すか
  choice: 本文では「救い」とし、病の文脈によって癒やし・回復の意味を示す。
  alternative: 「癒やし」「元気にし」
  rationale: ヤコブは狭義の医療的な動詞ではなく σῴζω を用いているため、直接的な病の回復と、より広い救済の響きの双方を保った。
- issue: 祈りによる回復を自動的・無条件の保証として説明するか
  choice: 原文の未来形をそのまま断定的に訳し、限定語も強調語も加えない。
  alternative: 「救うことがあります」または「必ずどんな病気も癒やします」
  rationale: 原文の力強い約束を弱めず、同時に特定の教派的な癒やしの教理を訳文へ持ち込まないため。
- issue: 罪と病気の関係
  choice: 「罪を犯していたとしても」と譲歩的・条件的に訳す。
  alternative: 「罪を犯したので病気になったとしても」または単純な「罪を犯していたなら」
  rationale: 本文は罪を可能性として述べるが、すべての病が本人の罪に起因するとは述べていない。κἄν の譲歩的な含みを示すことで、その緊張を保った。
- issue: πίστεωςの意味
  choice: 「信仰による」とし、神への信頼に基づく祈りと理解する。
  alternative: 「信頼に満ちた」「忠実な」
  rationale: この癒やしの文脈では「信仰・信頼」が最も自然であり、「忠実さ」は語義上あり得ても可能性が低い。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、聖書本文にふさわしい端正さを保った。「病んでいる人」は「病人」より原文の分詞表現を反映し、「起き上がらせてくださいます」は病床からの回復という像と主の働きへの敬意を自然に示す。
