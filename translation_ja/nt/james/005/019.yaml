  text: Ἀδελφοί ⸀μου, ἐάν τις ἐν ὑμῖν πλανηθῇ ἀπὸ τῆς ἀληθείας καὶ ἐπιστρέψῃ τις αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/james/005/019.yaml
  text: My brothers[a], if anyone among you wanders from the truth and someone turns him back[c][b],
translation:
  language: ja
  text: 私の兄弟たち[a]、あなたがたのうちのだれかが真理から迷い出て[b]、だれかがその人を連れ戻すなら[c]、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹」とも訳せる。ギリシア語は男性複数形だが、共同体全体を含む呼びかけとして用いられ得る。
    reason: lexical_alternative
  - marker: b
    text: または「真理から迷わされて」「真理から惑わされて」。原語は「迷い出る」とも「惑わされる」とも理解できる。
    reason: lexical_alternative
  - marker: c
    text: または「だれかがその人を立ち返らせるなら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: 直訳的な呼びかけを保ちつつ、現代日本語として理解できる形にした。ギリシア語の男性複数形は共同体全体を含み得るため、その点は脚注で示す。
- source_word: ἐάν τις ἐν ὑμῖν
  choice: あなたがたのうちに…人がいて
  rationale: 不定代名詞τιςと条件構文を、日本語として自然な「…人がいて、…なら」で表した。
- source_word: πλανηθῇ ἀπὸ τῆς ἀληθείας
  choice: 真理から迷い出る
  rationale: πλανηθῇには、自ら道を外れる意味と、惑わされるという受動的含意の両方があり得る。「迷い出る」は逸脱の比喩を自然に保ち、別の可能性を脚注に残す。
- source_word: καὶ ἐπιστρέψῃ τις αὐτόν
  choice: だれかがその人を連れ戻す
  rationale: ἐπιστρέφωの「向きを変えさせる／立ち返らせる」という意味を、誤りからの回復という文脈に合う自然な日本語で表した。「その人」は日本語では性別を特定せず、単数の先行詞を明確に受ける。
theological_decisions:
- issue: Ἀδελφοίの包摂範囲
  choice: 本文では「兄弟たち」とし、共同体の姉妹たちを含み得ることを脚注に記す
  alternative: 兄弟姉妹たち
  rationale: 原文の男性複数形を本文に反映しながら、この呼びかけが信仰共同体全体に向けられている可能性を隠さないため。
- issue: πλανηθῇの態と意味
  choice: 本文では「迷い出る」とし、受動的な「惑わされる」を脚注に示す
  alternative: 真理から惑わされる
  rationale: この受動形は、道を踏み外すことにも、欺かれて逸脱することにも理解できる。本文で原因や主体を断定せず、原文の意味の幅を脚注で保持する。
- issue: ἐπιστρέψῃの回復の比喩
  choice: 連れ戻す
  alternative: 立ち返らせる
  rationale: 他者が迷った人を真理へ戻すという他動的意味を明確にしつつ、回心について特定の教派的理解を付加しない。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた呼びかけとした。節末は次節へ続く条件節なので、読点で終えて構文の継続を示した。
