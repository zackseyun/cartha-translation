  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Πρὸ πάντων δέ, ἀδελφοί μου, μὴ ὀμνύετε, μήτε τὸν οὐρανὸν μήτε τὴν γῆν μήτε ἄλλον τινὰ ὅρκον· ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ, ἵνα μὴ ⸂ὑπὸ κρίσιν⸃ πέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/012.yaml
  text: But above all[a], my brothers, do not swear, either by heaven or by earth or by any other oath. Instead, let your yes be yes and your no, no[b], so that you may not fall under judgment.
translation:
  language: ja
  text: 何よりも、私の兄弟たち[a]、誓ってはなりません。天にかけても、地にかけても、また、ほかのどんな誓いを立てることもしてはなりません。むしろ、あなたがたの「はい」は「はい」、「いいえ」は「いいえ」であるようにしなさい。裁き[b]のもとに陥らないようにするためです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、信じる者の共同体全体に呼びかけていると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「罪に定められること」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: Πρὸ πάντων
  choice: 何よりも
  rationale: 勧告の優先性または格別な重要性を示す表現。直訳的な「すべてに先立って」より自然で、強調も保つ。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: ギリシア語の男性複数形を本文で保った。この呼びかけは信仰共同体全体を代表的に指すと考えられるため、その点を脚注で明示する。
- source_word: μὴ ὀμνύετε
  choice: 誓ってはなりません
  rationale: 一般的な禁止として明確かつ端正に表現した。ここで問題なのは罵り言葉ではなく、後続句が示す誓約行為である。
- source_word: μήτε τὸν οὐρανὸν μήτε τὴν γῆν
  choice: 天にかけても、地にかけても
  rationale: 被造物を指して誓うという意味を、現代日本語で自然な「〜にかけて誓う」によって表した。
- source_word: μήτε ἄλλον τινὰ ὅρκον
  choice: また、ほかのどのような誓いによっても
  rationale: 禁止の包括性を保ち、「天」「地」以外のあらゆる誓いも含むことを明確にした。文意を明瞭にするため「誓ってはなりません」を補って反復した。
- source_word: ἤτω δὲ ὑμῶν τὸ Ναὶ ναὶ καὶ τὸ Οὒ οὔ
  choice: むしろ、あなたがたの「はい」は「はい」、「いいえ」は「いいえ」であるようにしなさい
  rationale: δὲの対照を「むしろ」で示し、簡潔で格言的な反復を保ちながら、率直で偽りのない応答を自然な日本語で表した。
- source_word: ἵνα μὴ ὑπὸ κρίσιν πέσητε
  choice: 裁きのもとに陥らないためです
  rationale: ὑπόの「下に」とπίπτωの「陥る」という像を保ちつつ、κρίσιςを限定しすぎない「裁き」とした。
theological_decisions:
- issue: κρίσιςを広い意味の「裁き」とするか、より強い「罪に定めること」とするか
  choice: 裁き
  alternative: 罪に定められること
  rationale: κρίσις自体は広く裁きを意味し、最終的な断罪に限定する必要はない。本文では意味を狭めず、より強い解釈を脚注に残した。
- issue: 混合された共同体への呼びかけにおけるἀδελφοίの訳し方
  choice: 私の兄弟たち
  alternative: 私の兄弟姉妹たち
  rationale: 原文の男性複数形を本文で可視化しつつ、共同体全体を含む代表的用法である可能性を脚注で説明した。
translation_notes:
  register: 明瞭な現代標準語を用い、勧告としての厳粛さを保った。「誓ってはなりません」の反復により、日本語で禁止の範囲が曖昧にならないようにした。引用語の「はい」「いいえ」は平易さと原文の格言的な簡潔さを両立させている。
