id: JAS.5.9
reference: James 5:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: μὴ στενάζετε, ⸂ἀδελφοί, κατ’ ἀλλήλων⸃, ἵνα μὴ κριθῆτε· ἰδοὺ ὁ κριτὴς πρὸ τῶν θυρῶν ἕστηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/009.yaml
  text: Do not grumble against one another[a], brothers, so that you may not be judged. Look, the Judge is standing at the doors.
translation:
  language: ja
  text: 兄弟たち[a]、互いに対して不平を言ってはいけません。裁かれないように。見なさい、裁き主が戸口の前[b]に立っておられます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」に当たるギリシア語は、文脈により、女性を含む信仰共同体の仲間全体への呼びかけとして用いられます。
    reason: lexical_alternative
  - marker: b
    text: 原文では「戸口」は複数形です。この表現は、裁きが間近に迫っていることを示します。
    reason: source_form_and_idiom
lexical_decisions:
- source_word: στενάζετε
  choice: 不平を言って
  rationale: 動詞には「うめく、ため息をつく」という意味もあるが、ここでは「互いに」によって共同体内の相手に向けられた不満や愚痴が問題とされているため、文脈上の倫理的な力を自然な日本語で表した。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数形を保ちつつ、初期キリスト教共同体全体への呼びかけとして女性も含み得ることを脚注で明示した。
- source_word: κατ’ ἀλλήλων
  choice: 互いに
  rationale: κατάと属格が示す、相手に向けられた対立的な方向性を簡潔で自然な日本語にした。「不平を言う」と組み合わせることで、単なる内面的な嘆きではなく対人関係上の不満であることが伝わる。
- source_word: κριθῆτε
  choice: 裁かれない
  rationale: κρίνωの受動態をそのまま「裁かれる」とし、結果が有罪判決であるとまでは限定しなかった。ἵνα μήの目的・結果の含みは「ためです」で表した。
- source_word: κριτὴς
  choice: 裁く方
  rationale: 日本語では英語の大文字表記による称号性を再現できないため、人格的で荘重な「裁く方」とした。神または主であることを本文で明示せず、原文の指示対象の余地を残した。
- source_word: πρὸ τῶν θυρῶν
  choice: 戸口の前
  rationale: 目前に迫った近さを表す慣用的な像として自然な日本語にした。原文が複数形であることは脚注に示した。
- source_word: ἕστηκεν
  choice: 立っておられます
  rationale: 完了形が示す、すでに立っていて今もその状態にあるという臨場感を表した。敬語は文脈上の神的な裁き手への敬意を示すが、その正体を本文で特定はしない。
theological_decisions:
- issue: 「裁く方」の指示対象
  choice: 終末の裁きを行う神的な方として示すが、固有の指示対象は特定しない
  alternative: 文脈上「主」またはキリストと明示する／一般的に神と明示する
  rationale: 直前の文脈は主の来臨と差し迫った裁きを示唆するが、この節のギリシア語は単に「裁く方」と述べている。そこで終末論的な重みを保ちながら、主、キリスト、神のいずれかを訳文で補わないようにした。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、勧告と終末的警告にふさわしい荘重さを保った。「見なさい」はἰδούの注意喚起を明示し、「立っておられます」で現在の切迫感を表現した。
