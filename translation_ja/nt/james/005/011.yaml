id: JAS.5.11
reference: James 5:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ μακαρίζομεν τοὺς ⸀ὑπομείναντας· τὴν ὑπομονὴν Ἰὼβ ἠκούσατε, καὶ τὸ τέλος κυρίου ⸀εἴδετε, ὅτι πολύσπλαγχνός ἐστιν ⸂ὁ κύριος⸃ καὶ οἰκτίρμων.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/011.yaml
  text: Behold, we count those who have endured as blessed. You have heard of Job’s endurance, and you have seen the Lord’s outcome, that the Lord is very compassionate and merciful.
translation:
  language: ja
  text: 見なさい。私たちは、耐え忍んだ人たちを幸いな者と呼びます。あなたがたはヨブの忍耐について聞き、主の最終的な取り計らい[a]を見ました。主は慈しみにあふれ、憐れみ深い方だからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「主の結末」。ギリシア語の表現は、ヨブに関して主が最終的にどのように取り計らわれたか、またその最終的な結果を指すと理解される。
    reason: τὸ τέλος κυρίου の属格関係と τέλος の語義の幅を示しつつ、日本語で「主の結末」が主自身の終わりを指すように読まれるのを避ける。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 注意を促す間投詞の働きを保ちつつ、現代日本語で自然かつ明瞭にした。
- source_word: μακαρίζομεν
  choice: 幸いな者と呼びます
  rationale: 単に幸福だと感じるのではなく、その人を幸いだと認めて言うという他動詞の意味を表した。
- source_word: τοὺς ὑπομείναντας / ὑπομονήν
  choice: 耐え忍んだ人たち／忍耐
  rationale: 同語根のつながりを、自然な日本語の範囲で保った。
- source_word: τὸ τέλος κυρίου
  choice: 主がもたらされた結末
  rationale: τέλοςを「目的」と断定せず、ヨブの苦難の後に主がもたらした最終的な成り行きを示す「結末」とした。属格の曖昧さは、日本語で意味が通るよう主を結末の主体として表現した。
- source_word: πολύσπλαγχνος
  choice: 慈しみにあふれ
  rationale: 深い内なる同情・慈愛を表す語を、普通の読者に理解しやすい表現にした。
- source_word: οἰκτίρμων
  choice: 憐れみ深い
  rationale: 神の憐れみ深い性質を示す定着した自然な表現を用いた。
theological_decisions:
- issue: τὸ τέλος κυρίου の解釈
  choice: 主がもたらされた結末
  alternative: 主の目的／主の最期
  rationale: 文脈はヨブの忍耐とその後の主の取り扱いを指すため、「目的」として摂理の意図に限定せず、「主の最期」というキリスト論的解釈にも限定しない。
- issue: ὅτι の論理関係
  choice: 主は…方だからです
  alternative: すなわち、主は…方です
  rationale: 結末が主の深い慈しみと憐れみを示すという理由・根拠の関係として訳したが、説明的用法の含みも大きく損なわない。
translation_notes:
  register: 現代標準日本語。会衆での朗読にも適する、明瞭で dignified な「です・ます」調を採用した。過度に古風な「見よ」「あわれみ」を避けた。
