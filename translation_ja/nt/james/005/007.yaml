id: JAS.5.7
reference: James 5:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Μακροθυμήσατε οὖν, ἀδελφοί, ἕως τῆς παρουσίας τοῦ κυρίου. ἰδοὺ ὁ γεωργὸς ἐκδέχεται τὸν τίμιον καρπὸν τῆς γῆς, μακροθυμῶν ἐπ’ ⸀αὐτῷ ἕως ⸀λάβῃ πρόϊμον καὶ ὄψιμον.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/007.yaml
  text: Be patient[a], therefore, brothers, until the coming of the Lord. Look, the farmer waits for the precious fruit of the earth[b], being patient over it until it receives the early and late rains.
translation:
  language: ja
  text: ですから、兄弟たち[a]、主が来られる時[b]まで、忍耐しなさい。見なさい。農夫は大地の尊い実りを待ち望み、その実りが秋の雨と春の雨を受けるまで、忍耐して待っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟姉妹たち」とも訳せる。ギリシア語は「兄弟たち」だが、この呼びかけはしばしば信仰共同体全体に向けられている。
    reason: alternative_reading
  - marker: b
    text: 直訳すると「主の到来」または「主の現臨」。ここでは、将来主が来られることを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακροθυμήσατε / μακροθυμῶν
  choice: 忍耐しなさい／忍耐強く待っています
  rationale: 苦境の中で辛抱強く待つことを表す同語根の反復を、日本語でも「忍耐」によって保った。分詞は農夫が待つ際の継続的な態度として自然に表現した。
- source_word: οὖν
  choice: ですから
  rationale: 直前の議論を受けた帰結を示し、現代日本語として明確で自然な接続とした。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: ギリシア語の男性複数呼格を本文で保持した。共同体全体への呼びかけとなり得ることは脚注で示した。
- source_word: παρουσίας τοῦ κυρίου
  choice: 主が来られる時
  rationale: 終末的文脈における主の到来を、専門用語に偏らない明瞭な日本語で表した。「現臨」という語義の幅は脚注に残した。
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 農夫の例へ注意を向けさせる命令的な力を、簡潔で尊厳ある現代語で保った。
- source_word: ὁ γεωργὸς
  choice: 農夫
  rationale: 一般的な耕作者を指す語として、聖書文体にも現代日本語にもなじむ語を選んだ。
- source_word: ἐκδέχεται
  choice: 待ち望み
  rationale: 単に時間を過ごすのでなく、期待しながら待つ継続的な意味を表した。
- source_word: τὸν τίμιον καρπὸν τῆς γῆς
  choice: 大地の尊い実り
  rationale: καρπόςの農業的比喩を狭く「収穫物」と限定せず、τίμιοςの価値と望ましさを「尊い」で示した。
- source_word: πρόϊμον καὶ ὄψιμον
  choice: 秋の雨と春の雨
  rationale: 名詞が省略された形容詞を雨として理解し、パレスチナの農耕周期に即して、早い雨を「秋の雨」、遅い雨を「春の雨」とした。
theological_decisions:
- issue: ἀδελφοίの指す範囲
  choice: 本文は「兄弟たち」
  alternative: 「兄弟姉妹たち」
  rationale: 文法上の男性複数形を本文に反映しつつ、信仰共同体全体を含み得る語用論的範囲を脚注で明示した。
- issue: παρουσία τοῦ κυρίουの意味
  choice: 「主が来られる時」
  alternative: 「主の現臨」「主の到来」
  rationale: この勧告の終末的文脈では未来の到来が最も自然だが、παρουσίαが「臨在・現臨」を意味し得る語義上の幅を脚注で保持した。
- issue: λάβῃの省略された主語
  choice: 日本語でも主語を明示せず「秋の雨と春の雨を受けるまで」
  alternative: 「作物が…受けるまで」または「土地が…受けるまで」
  rationale: ギリシア語は受け手を明示しておらず、土地または実りを指すと理解できる。日本語の主語省略を用いて不必要な確定を避け、脚注で説明した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「忍耐しなさい」「見なさい」に勧告の力と品位を持たせた。「農夫」「大地の尊い実り」により農耕の比喩を保ち、過度に専門的な「来臨」は本文では避けた。
