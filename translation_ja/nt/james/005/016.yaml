  to: ですから、互いに自分の罪を告白し、互いのために祈りなさい。あなたがたが癒やされるためです。正しい人の祈りは、働いているとき、大きな力を発揮します。[a]
  rationale: 「願い」を「祈り」に改め、δέησιςが本節で指す祈願としての祈りを明確にした。目的節から不自然な指示語を除き、ὅπωςの目的の意味を保った。ἐνεργουμένηについては、誰が祈りを働かせるか、あるいは熱心さを意味するかを本文で決めず、「働いているとき」として曖昧さを維持し、脚注で自然な別表現を示した。
