id: JAS.5.16
reference: James 5:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐξομολογεῖσθε ⸀οὖν ἀλλήλοις ⸂τὰς ἁμαρτίας⸃ καὶ ⸀εὔχεσθε ὑπὲρ ἀλλήλων, ὅπως ἰαθῆτε. πολὺ ἰσχύει δέησις δικαίου ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/016.yaml
  text: Therefore[a], confess your sins to one another and pray for one another, so that you may be healed. The prayer of a righteous person is very powerful as it is at work.
translation:
  language: ja
  text: ですから、互いに自分の罪を告白し、互いのために祈りなさい。あなたがたが癒やされるためです。正しい人の祈りは、働いているとき、大きな力を発揮します。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「効力を現している正しい人の祈りには、大きな力がある。」
    reason: ἐνεργουμένηは「働いている」「作用している」「効力を現している」などと理解でき、πολὺ ἰσχύειとの関係には複数の訳し方が可能である。
lexical_decisions:
- source_word: ἐξομολογεῖσθε
  choice: 告白し
  rationale: 罪を公に認めるという命令の意味を、宗教的な重みを保ちつつ自然な現代日本語で表す。特定の聖職制度や秘跡的実践に限定しない。
- source_word: οὖν
  choice: ですから
  rationale: 直前の祈り、罪、回復についての議論から導かれる推論を明示し、丁寧で読みやすい文体にした。
- source_word: ἀλλήλοις
  choice: 互いに
  rationale: 共同体の構成員相互の行為であることを明確に示す。
- source_word: τὰς ἁμαρτίας
  choice: 自分の罪
  rationale: 定冠詞付きの「罪」を、相互的な命令の中で自然に理解できる日本語にした。「自分の」は各人が告白する罪を指し、原文にない罪の種類を加えない。
- source_word: εὔχεσθε ὑπὲρ ἀλλήλων
  choice: 互いのために祈りなさい
  rationale: ὑπέρの執り成しの意味と、相互性を簡潔かつ自然に保つ。
- source_word: ὅπως ἰαθῆτε
  choice: それは、あなたがたが癒やされるためです
  rationale: 目的を表すὅπωςと受動態を保ち、癒やしを身体的または霊的なものだけに限定しない。
- source_word: δέησις
  choice: 願い
  rationale: 一般的な祈りよりも、必要を訴える嘆願・祈願の語感を示す。文脈上、神に向けられた願いであることは明らかである。
- source_word: δικαίου
  choice: 正しい人
  rationale: 形容詞の名詞的用法を性別に限定せず、神の前で正しい者という意味を簡潔に表す。
- source_word: πολὺ ἰσχύει
  choice: 大きな力を発揮します
  rationale: 大いに力がある、または大きな効力を持つという句の意味を、現代日本語で自然に表す。
- source_word: ἐνεργουμένη
  choice: 働くとき
  rationale: 祈りが現に作用しているという分詞の意味を保ちながら、中動態的な「働く」と受動態的な「働かされる」のどちらかに過度に固定しない。
theological_decisions:
- issue: 罪の告白が聖職者への秘跡的告白を命じるのか、信徒相互の告白を命じるのか
  choice: 共同体の中で互いに罪を告白する命令として訳す
  alternative: 聖職者を介する告白に限定する
  rationale: ἀλλήλοιςは明示的に相互性を表すため、本文では特定の教会制度に限定しない。
- issue: ἰαθῆτεが指す癒やしの範囲
  choice: 「癒やされる」として広い意味を保つ
  alternative: 身体的治癒だけ、または霊的回復だけに限定する
  rationale: 直前の文脈では病が中心だが、この節では罪にも言及されるため、原文の幅と緊張を残す。
- issue: δικαίουの性別表現
  choice: 正しい人
  alternative: 正しい男
  rationale: 男性単数形はここでは格言的・一般的に用いられており、性別を限定しない日本語が原意に合う。
- issue: ἐνεργουμένηの態と祈りの効力との関係
  choice: 「働くとき」とし、作用している祈りとして表す
  alternative: 「神によって力を与えられるとき」または「熱心にささげられるとき」と解釈する
  rationale: 分詞は中動態・受動態の両様に理解され得る難しい表現であり、誰が働かせるか、また熱心さを意味するかを本文で決めない。
translation_notes:
  register: 明快な現代標準日本語を用い、命令には「なさい」、説明文には丁寧体を採用した。「告白」は宗教的文脈にふさわしいが、制度的・秘跡的意味を付加しない。「癒やす」は身体と霊の双方に開かれた語として用いた。
