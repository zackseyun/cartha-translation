  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὁ χρυσὸς ὑμῶν καὶ ὁ ἄργυρος κατίωται, καὶ ὁ ἰὸς αὐτῶν εἰς μαρτύριον ὑμῖν ἔσται καὶ φάγεται τὰς σάρκας ὑμῶν· ὡς πῦρ ἐθησαυρίσατε ἐν ἐσχάταις ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/003.yaml
  text: Your gold and silver have rusted[a], and their corrosion will be evidence against you and will eat your flesh like fire[b]. You have stored up treasure in the last days.
translation:
  language: ja
  text: あなたがたの金も銀も腐食している[a]。その腐食は、あなたがたに不利な証拠となり、火のようにあなたがたの肉を食い尽くす[b]。あなたがたは終わりの日々に宝を蓄えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「腐食している」は、直訳すると「さびついている」。ここでは金や銀の変色・腐食を広く表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳：「その腐食は、あなたがたに不利な証拠となり、あなたがたの肉を食い尽くす。あなたがたは終わりの日々に、火のように宝を蓄えた。」原文の「火のように」を後の「宝を蓄えた」に結びつけることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: κατίωται
  choice: 腐食している
  rationale: 完了形が、以前に生じた作用の結果として現在すでに腐食した状態にあることを示すため。「さびついている」よりも、金と銀の双方に自然に当てはまる。
- source_word: ἰὸς
  choice: 腐食
  rationale: 金属について用いられているため、「毒」ではなく、さび・変色を含む腐食作用またはその生成物を指す。現代日本語では「腐食」が金銀にも無理なく通じる。
- source_word: εἰς μαρτύριον ὑμῖν
  choice: あなたがたに不利な証拠となり
  rationale: 法廷的な含みを明確にし、この文脈で富の腐食が所有者を告発する働きをすることを自然な日本語で表す。
- source_word: φάγεται τὰς σάρκας ὑμῶν
  choice: あなたがたの肉を食い尽くす
  rationale: 「肉」を保って身体的な裁きの衝撃的な比喩を伝え、「食い尽くす」によって動詞の具体性と破壊性を表す。
- source_word: ὡς πῦρ
  choice: 火のように
  rationale: 直前の「肉を食い尽くす」に結びつけ、腐食が火のように滅ぼすという自然な比喩として訳す。
- source_word: ἐθησαυρίσατε
  choice: 宝を蓄えた
  rationale: 動詞に含まれる「宝を蓄える」という意味を明示する。「ため込んだ」ほど強い解釈的な非難を語そのものに加えない。
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: 終わりの日々に
  rationale: 終末論的な定型表現を簡潔に保ち、原文にない「この」を加えない。
theological_decisions:
- issue: ὡς πῦρ（火のように）が文中のどこにかかるか
  choice: 直前の節に結びつけ、「火のようにあなたがたの肉を食い尽くす」とする。
  alternative: 後続の節に結びつけ、「あなたがたは終わりの日々に、火のようなものを蓄えた」と理解する。
  rationale: 語順と意味の流れは、腐食が火のように肉を食い尽くすという理解をより自然に支持する。ただし、後続の「蓄えた」に結びつける古くからの解釈も文法上排除できないため、脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語の常体。「肉を食い尽くす」という強い比喩を弱めず、金銀の描写には科学的にも不自然になりにくい「腐食」を用いた。
