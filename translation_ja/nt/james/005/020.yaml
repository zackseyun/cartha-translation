source:
  edition: SBLGNT
  text: ⸀γινωσκέτω ὅτι ὁ ἐπιστρέψας ἁμαρτωλὸν ἐκ πλάνης ὁδοῦ αὐτοῦ σώσει ψυχὴν ⸀αὐτοῦ ἐκ θανάτου καὶ καλύψει πλῆθος ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/020.yaml
  text: let him know that whoever turns a sinner back from the error of his way will save his soul from death and will cover a multitude of sins[a][b].
translation:
  language: ja
  text: 罪人を自分の道の迷いから立ち返らせる者は、その人の魂を死から救い、多くの罪を覆うことを知っておきなさい[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その人の命を死から救い」とも訳せる。ギリシア語の「魂」に当たる語は「命」を意味することもある。
    reason: lexical_alternative
  - marker: b
    text: 「その人」は、立ち返らせられた罪人を指すとも、その罪人を立ち返らせた者を指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: γινωσκέτω
  choice: 知りなさい
  rationale: 三人称単数の現在命令形。19–20節で想定されている、迷い出た人を立ち返らせる者への勧告として、命令の力を自然な現代日本語で表した。
- source_word: ὁ ἐπιστρέψας
  choice: 立ち返らせる者
  rationale: 冠詞付きアオリスト分詞の一般的・実体詞的用法。逸脱した人を元へ戻すという回復の意味を保ち、「改宗させる」のような後代の専門的含意は避けた。
- source_word: ἁμαρτωλὸν
  choice: 罪人を
  rationale: 無冠詞の対格単数を一般的な類型として訳した。
- source_word: ἐκ πλάνης ὁδοῦ αὐτοῦ
  choice: その人の道の迷いから
  rationale: πλάνηの「迷い・誤り」と、ὁδόςが持つ道および生き方の比喩をともに残した。「その人」はここでは罪人を指す。
- source_word: σώσει
  choice: 救い
  rationale: σῴζωの未来形。「救う」という標準的な語を用い、救出と救済の双方に開かれた重みを保った。
- source_word: ψυχὴν αὐτοῦ
  choice: 彼の魂
  rationale: ψυχήの基本的な訳語として「魂」を採用した。「彼」は文脈上の指示対象を本文で明示せず、ギリシア語のαὐτοῦが罪人または立ち返らせる者を指し得る曖昧さを脚注で示した。
- source_word: ἐκ θανάτου
  choice: 死から
  rationale: 身体的死か霊的死かを本文が限定していないため、広い意味を持つ「死」をそのまま用いた。
- source_word: καλύψει
  choice: 覆う
  rationale: 罪を「覆う」という聖書的比喩を保持し、「隠す」「赦す」など一つの解釈に狭めなかった。
- source_word: πλῆθος ἁμαρτιῶν
  choice: 多くの罪
  rationale: 集合的な数量の大きさを、現代日本語として自然でありながら荘重さも保つ表現で伝えた。
theological_decisions:
- issue: ψυχὴν αὐτοῦのαὐτοῦが指す人物
  choice: 本文では「彼」とし、指示対象を明示的に限定しない
  alternative: 立ち返らせられた罪人の魂／その罪人を立ち返らせた者の魂
  rationale: 文脈上は罪人を指す理解が自然だが、文法上は立ち返らせる者を指すとの理解も可能であるため、本文で決着させず脚注に両解釈を記した。
- issue: ψυχήとθάνατοςの意味の範囲
  choice: 「魂」と「死」という幅のある語を保持する
  alternative: 「命を死から救う」／「魂を霊的な死から救う」
  rationale: 身体的生命の保全、霊的救済、またはその双方という可能性を、特定の教理体系に限定せず残した。
- issue: 「多くの罪を覆う」の主体と意味
  choice: ギリシア語どおり主語を補足せず、比喩をそのまま保つ
  alternative: 神が多くの罪を赦す／立ち返らせる者が罪を覆い隠す
  rationale: καλύψειの表現は罪の赦しを示唆し得るが、本文は主体や作用を詳説していないため、説明的な神学解釈を本文に持ち込まなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「魂」「死」「罪を覆う」という原文の荘重な語彙と比喩を保持した。文末の「知りなさい」により命令形を自然に表し、指示代名詞の曖昧さは本文と脚注の組み合わせで保存した。
