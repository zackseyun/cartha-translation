reference: James 5:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ ὁ μισθὸς τῶν ἐργατῶν τῶν ἀμησάντων τὰς χώρας ὑμῶν ὁ ⸀ἀφυστερημένος ἀφ’ ὑμῶν κράζει, καὶ αἱ βοαὶ τῶν θερισάντων εἰς τὰ ὦτα Κυρίου Σαβαὼθ ⸀εἰσεληλύθασιν·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/004.yaml
  text: Look[a], the wages of the workers who harvested your fields, which have been withheld by you, are crying out, and the cries of those who did the harvesting have entered into the ears of the Lord of Hosts.
translation:
  language: ja
  text: 見なさい、あなたがたの畑を刈り取った働き人たちの賃金、あなたがたが支払いを差し控えている賃金が、叫んでいます。そして、収穫をした人たちの叫びは、万軍の主[a]の耳に入っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主サバオト」。ギリシア語本文は、ヘブライ語に由来する称号「サバオト」を音写した形で残している。
    reason: 神の称号の音写による別訳を示すため。
lexical_decisions:
- source_word: ἰδοὺ
  choice: 見なさい
  rationale: 注意を強く促す語。現代日本語として明瞭でありつつ、文頭の強調を保つ。
- source_word: μισθὸς
  choice: 賃金
  rationale: 農作業に従事した働き人に支払われるべき報酬を指す。
- source_word: ἐργατῶν
  choice: 働き人たち
  rationale: 農業労働者を表す一般的な語として、平易さと聖書本文にふさわしい品位を両立させる。
- source_word: ἀμησάντων
  choice: 刈り取った
  rationale: 畑の作物を刈る農作業を表す。後続の θερισάντων と意味領域は重なるが、同一表現に固定せず原文の語の違いも穏やかに示す。
- source_word: τὰς χώρας
  choice: 畑
  rationale: この文脈では地主に属する耕作地を指すため、「土地」より具体的で自然。
- source_word: ὁ ἀφυστερημένος ἀφ’ ὑμῶν
  choice: あなたがたが支払わずにいるその賃金
  rationale: 不当に留保された賃金という意味を明確にし、行為者が「あなたがた」であるとの直接的な告発を保つ。「だまし取った」とまでは訳し込まない。
- source_word: κράζει
  choice: 叫び声を上げています
  rationale: 未払い賃金そのものが正義を求めて叫ぶという擬人化を、自然で鮮明な日本語で保つ。
- source_word: αἱ βοαὶ
  choice: 叫び
  rationale: 助けや正義を切実に求める声を簡潔に表す。
- source_word: τῶν θερισάντων
  choice: 刈り入れをした人たち
  rationale: 収穫作業に従事した者を表す分詞を、分かりやすい現代日本語で訳す。
- source_word: εἰς τὰ ὦτα
  choice: 耳に入っています
  rationale: 原文の身体的で生き生きとした比喩を保ち、「届いています」と平板化しない。
- source_word: Κυρίου Σαβαὼθ
  choice: 万軍の主
  rationale: ヘブライ語由来の神の称号を、その意味が日本語読者に伝わる伝統的で簡潔な表現にする。
- source_word: εἰσεληλύθασιν
  choice: 入っています
  rationale: 完了した到達とその現在的な結果を示す完了形を、日本語の結果状態として自然に表す。
theological_decisions:
- issue: 神の称号 Κυρίου Σαβαὼθ の訳し方
  choice: 万軍の主
  alternative: 主サバオト
  rationale: Σαβαώθ は旧約聖書の背景を持つ神の称号であり、意味を伝える「万軍の主」を本文に置く。ギリシア語がヘブライ語系の形を音写していることは脚注で示し、固有名のように一義的に扱わない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、告発の鋭さと未払い賃金の擬人化を保った。「労働者」よりやや広く自然な「働き人たち」を採用し、神の称号には日本語聖書で理解されやすい「万軍の主」を用いた。
