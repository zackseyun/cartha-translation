translation:
  language: ja
  text: あなたがたの富は朽ち、あなたがたの衣服は蛾に食われてしまいました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πλοῦτος ὑμῶν
  choice: あなたがたの富
  rationale: πλοῦτοςは蓄えられた財産や富を指す。「富」は簡潔で現代的であり、富む者への非難という文脈にも適する。
- source_word: σέσηπεν
  choice: 朽ち
  rationale: 完了形が表す、腐敗が生じてその結果が現に残るという力を、自然な日本語の「朽ち」で簡潔に表した。「腐ってしまいました」も可能だが、財物全般については「朽ちる」が自然で格調も保てる。
- source_word: τὰ ἱμάτια ὑμῶν
  choice: 衣服
  rationale: ἱμάτιαは広く衣類を指す。「衣服」は現代日本語として明瞭で、「着物」のような文化的限定を避けられる。二度目の「あなたがたの」は日本語では省いても所有関係が明白である。
- source_word: σητόβρωτα
  choice: 虫に食われて
  rationale: 語は蛾など衣類を害する虫に食われた状態を表す。日本語では「虫に食われる」が自然で具体的であり、「虫食いになった」より原語の受動的な像を保つ。
- source_word: γέγονεν
  choice: しまいました
  rationale: γίνομαιの完了形が示す、そうなって現在その状態にあるという結果性を「食われてしまいました」で表した。「しまう」はここでは話者の嘆きというより、破滅的で取り返しのつかない結果を自然に示す。
theological_decisions:
- issue: 財産の腐敗が現実の状態か、預言的に確実な将来を現在完了で述べたものか
  choice: 時制上の結果状態を保ち、「朽ち」「食われてしまいました」と訳す
  alternative: 「朽ち果てる」「虫に食われる」と将来の裁きとして明示する
  rationale: 本文の完了形は結果状態を鮮明に描くが、その修辞的・終末論的な時間関係を翻訳で一義的に決めるべきではないため、原文の表現に沿って現在に至る結果を示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、富の無価値化を告発する簡潔で荘重な調子を保った。節前半と後半の並行性を自然な日本語で示し、不要な補足は加えていない。
