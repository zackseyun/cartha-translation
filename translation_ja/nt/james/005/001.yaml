  text: Ἄγε νῦν οἱ πλούσιοι, κλαύσατε ὀλολύζοντες ἐπὶ ταῖς ταλαιπωρίαις ὑμῶν ταῖς ἐπερχομέναις.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/001.yaml
  text: Come now[a], you rich, weep[b], wailing over the miseries that are coming upon you.
translation:
  language: ja
  text: さあ、富んでいる人たちよ。あなたがたに迫り来る苦難のために、泣きわめきなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄγε νῦν
  choice: さあ
  rationale: 鋭い呼びかけによって非難を切り出す談話標識。現代日本語で自然かつ強い「さあ」とした。
- source_word: οἱ πλούσιοι
  choice: 富んでいる人たちよ
  rationale: 形は主格だが呼格的に用いられた直接呼称。対象を「富んでいる人たち」と明示し、預言者的な呼びかけを「よ」で保った。
- source_word: κλαύσατε
  choice: 泣き…なさい
  rationale: 目に見える嘆きを命じるアオリスト命令形。「泣く」は平明でありながら十分な重みがある。
- source_word: ὀλολύζοντες
  choice: わめき
  rationale: 大声を上げて嘆くことを表す現在分詞。「泣きわめく」と一続きに訳し、継続的で激しい公然の嘆きを自然な日本語で表した。
- source_word: ἐπὶ ταῖς ταλαιπωρίαις
  choice: 災いを思い
  rationale: ἐπί＋与格は嘆きの根拠・契機を示す。「災いのゆえに」より自然な命令文となるよう「災いを思い」とした。
- source_word: ταλαιπωρίαις
  choice: 災い
  rationale: 迫る深刻な苦難や悲惨な状態を指す。裁きの文脈に適し、現代日本語で明瞭な「災い」を採用した。
- source_word: ταῖς ἐπερχομέναις
  choice: あなたがたに降りかかろうとしている
  rationale: 近づいて来る苦難を表す現在分詞。日本語では「降りかかる」により、災いが彼らを襲うという含意を自然に示し、「ようとしている」で接近を表した。
theological_decisions:
- issue: 富んでいる人たちへの呼びかけの調子と対象
  choice: 迫る災い・裁きに直面する富裕な人々への預言者的非難として訳し、その信仰上の立場は特定しない。
  alternative: 抑圧的な未信者の地主に限定する、またはキリスト者共同体内の富裕層に限定する。
  rationale: この節は「富んでいる人たち」に直接呼びかけ、迫る災いを告げるが、彼らが信者か未信者かを明示していないため、本文以上に対象を限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、「人たちよ」「泣きわめきなさい」により、原文の厳粛で預言者的な非難の調子を保った。注記を要するほどの本文異読や、日本語本文だけでは保持できない重大な語義上の曖昧さはないと判断した。
