  source_fidelity: 「災いを思い」は、ἐπὶ ταῖς ταλαιπωρίαις（迫り来る苦難を理由として／そのために）の嘆きの根拠を、「災いについて考える」という行為へと移しているため、原文の関係を直接表す訳に改めるのが安全です。また、「降りかかろうとしている」は意味としては可能ですが、「迫り来る」はἐπερχομέναιςの接近して来る含意をより簡潔に保ちます。
  naturalness: 全体は明瞭な現代標準語です。ただし「災いを思い、泣きわめきなさい」はやや説明的で、命令の激しい調子が弱まります。「苦難のために、泣きわめきなさい」とするほうが自然で直接的です。
  terminology: ταλαιπωρίαιςには「苦難」を用い、深刻な悲惨・苦境という広い意味を保ちます。「災い」も可能ですが、ここでは受難・悲惨の側面を含む「苦難」がより中立的です。富裕者の身分や信仰上の立場、また神の裁きという語は本文に補いません。
