  yaml_path: translation/nt/james/005/013.yaml
  text: Is anyone among you suffering? Let him pray[a]. Is anyone cheerful? Let him sing praise.
translation:
  language: ja
  text: あなたがたの中に苦しんでいる人がいますか。その人は、祈りなさい。元気な人がいますか。その人は、賛美を歌いなさい[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「詩編を歌いなさい」。このギリシア語の動詞は、特に詩編を歌うことも、より広く賛美を歌うことも意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: Κακοπαθεῖ
  choice: 苦しんでいる
  rationale: κακοπαθέωは、困難や苦難を経験することを広く表す。「苦しんでいる」は、迫害や病気だけに限定せず、原文の幅を自然な現代日本語で保つ。
- source_word: τις
  choice: 人がいますか
  rationale: 不定代名詞の単数・総称的な働きを、日本語で性別を限定せず自然に表す。
- source_word: ἐν ὑμῖν
  choice: あなたがたの中に
  rationale: 問いかけられている共同体の中にいる人を指す原文を直接的に表す。
- source_word: προσευχέσθω
  choice: その人は祈りなさい
  rationale: 三人称単数の現在命令形による勧告を保ちつつ、現代日本語として明瞭にする。
- source_word: εὐθυμεῖ
  choice: 心が晴れやかな
  rationale: εὐθυμέωが表す「気持ちが明るい、元気である」という状態を、苦しみとの対比が伝わる自然な表現にした。
- source_word: ψαλλέτω
  choice: 賛美を歌いなさい
  rationale: この文脈では神に向けて歌うことを表す。「賛美を歌う」は広い礼拝的意味を明確に伝え、特定の詩編だけに不必要に限定しない。狭義の可能性は脚注に残す。
theological_decisions:
- issue: 単数形による総称的な勧告
  choice: 「人がいますか。その人は……なさい」
  alternative: 「人々は……なさい」
  rationale: 原文のτιςと三人称単数命令形を複数形に均さず、日本語では性別を示さない「その人」によって単数かつ総称的な働きを保った。
- issue: ψαλλέτωの意味
  choice: 賛美を歌いなさい
  alternative: 詩編を歌いなさい
  rationale: 神に向けた歌という文脈上の意味を自然に表しつつ、特定の詩編を歌う意味に限定しない。語が持ち得る狭義は脚注で明示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。二つの修辞疑問と、それぞれに続く単数の勧告という原文の並行構造を保った。英語資料では脚注記号が「pray」の後に置かれているが、脚注内容はψαλλέτωに関するため、日本語本文では「賛美を歌いなさい」の後に付した。
