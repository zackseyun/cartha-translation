id: JAS.5.10
reference: James 5:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ὑπόδειγμα λάβετε, ⸀ἀδελφοί, τῆς κακοπαθίας καὶ τῆς μακροθυμίας τοὺς προφήτας, οἳ ἐλάλησαν ⸀ἐν τῷ ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/010.yaml
  text: Brothers[a], take the prophets who spoke in the name of the Lord as an example of suffering and patience.
translation:
  language: ja
  text: 兄弟たち[a]、苦しみと忍耐の模範として、主の名によって語った預言者たちを見なさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」と訳した語は、原文では男性複数形です。この文脈では、女性を含む信仰共同体全体への呼びかけである可能性が高いと考えられます。
    reason: 原語の性を保ちながら、文脈上の包括的な指示範囲を明らかにするため。
lexical_decisions:
- source_word: ὑπόδειγμα λάβετε
  choice: 模範として…見なさい
  rationale: ὑπόδειγμαは見倣うべき「模範」、λάβετεはここでは「…を模範とする」という意味を成す。日本語では目的語を後に置き、「模範として…見なさい」とすることで、命令の力と原文の構造を自然に伝える。
- source_word: ἀδελφοί
  choice: 兄弟たち
  rationale: 男性複数形の呼びかけを明示的に訳した。文脈上、女性を含む信仰共同体全体への呼びかけである可能性は脚注で示す。
- source_word: κακοπαθίας
  choice: 苦しみ
  rationale: 苦難や苦しみを経験することを表す語であり、現代日本語として広く明瞭な「苦しみ」を採用した。
- source_word: μακροθυμίας
  choice: 忍耐
  rationale: 長く耐えること、辛抱強さを表す。簡潔で格調を保つ「忍耐」が文脈に適する。
- source_word: τοὺς προφήτας
  choice: 預言者たち
  rationale: 見倣うべき模範として挙げられる人々を直接示すため、通常の訳語を用いた。
- source_word: ἐλάλησαν
  choice: 語った
  rationale: 一般的な「話す、語る」を表す。預言者という文脈に合う自然な日本語として「語った」とし、「宣べ伝えた」などの意味は加えない。
- source_word: ἐν τῷ ὀνόματι κυρίου
  choice: 主の名によって
  rationale: 主を代表し、その権威のもとで語ることを示す聖書的表現を保った。「主のために」などと意訳せず、原文の「名」の表現を残す。
theological_decisions:
- issue: 共同体への呼びかけであるἀδελφοίの性別表現
  choice: 本文では「兄弟たち」とし、女性を含む可能性を脚注で説明する
  alternative: 「兄弟姉妹たち」または「信徒の皆さん」
  rationale: 原語は文法上男性複数形であるため、その形を本文に反映する。一方、書簡の呼びかけとして信仰共同体全体を指す可能性が高いことを脚注で明確にし、語形と文脈上の指示範囲の両方を伝える。
- issue: 預言者たちと「模範」との統語的関係
  choice: 預言者たちを、苦しみと忍耐の点で模範として見るよう命じる
  alternative: 預言者たちが苦しみを忍耐したことを明示的に補って訳す
  rationale: 二つの属格が、預言者たちがどの点で模範なのかを示している。本文は「苦しみと忍耐の模範」として関係を保ち、苦しみと忍耐の具体的な関係を説明的に限定しない。
translation_notes:
  register: 明瞭で現代的ながら、勧告としての格調を保つ文体とした。「主の名によって」という聖書的慣用句は保持した。
source_grounding:
  english_pob_role: consult_only
