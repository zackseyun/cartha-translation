language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἀσθενεῖ τις ἐν ὑμῖν; προσκαλεσάσθω τοὺς πρεσβυτέρους τῆς ἐκκλησίας, καὶ προσευξάσθωσαν ἐπ’ αὐτὸν ἀλείψαντες ⸀αὐτὸν ἐλαίῳ ἐν τῷ ὀνόματι τοῦ κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/014.yaml
  text: Is anyone among you sick? Let him call for the elders of the church[a], and let them pray over him[b], anointing him with oil in the name of the Lord.
translation:
  language: ja
  text: あなたがたの中に病気の人がいますか。その人は教会の長老たちを呼び寄せなさい。長老たちは、主の名によってその人に油を塗りながら[b]、その人のために祈りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 油を塗ることは、治療のため、象徴的な行為、またはその両方とも理解されうる。本文自体は、その働き方を特定していない。
    reason: cultural_note
lexical_decisions:
- source_word: ἀσθενεῖ
  choice: 病気の人がいる
  rationale: 語義には広く「弱っている」も含まれるが、長老を呼ぶこと、祈り、油を塗ること、次節の回復の文脈から、ここでは身体的な病気を第一義とした。
- source_word: τις ἐν ὑμῖν
  choice: あなたがたの中に…人がいるなら
  rationale: 共同体の構成員の誰かを指す不定の問いを、自然で包括的な現代日本語にした。
- source_word: προσκαλεσάσθω
  choice: 呼びなさい
  rationale: 三人称単数のアオリスト命令法の指示を、日本語で明瞭な命令として表した。文脈上、来てもらうために呼ぶ意味である。
- source_word: τοὺς πρεσβυτέρους τῆς ἐκκλησίας
  choice: 教会の長老たち
  rationale: 単なる年長者ではなく、教会における認められた指導者を指すため、定着した「長老」を用いた。ἐκκλησίαはここではキリスト者の共同体を指すため「教会」とした。
- source_word: προσευξάσθωσαν ἐπ’ αὐτόν
  choice: その人の上で祈りなさい
  rationale: 複数形の命令を保ち、ἐπί＋対格の空間的・方向的な表現を「上で」として残した。「その人のために」と解釈だけに狭めないようにした。
- source_word: ἀλείψαντες αὐτὸν ἐλαίῳ
  choice: その人に油を塗り
  rationale: ἀλείφωは油を塗る行為を表す。日本語の「油を注ぐ」は原文以上に儀礼的含意を帯びうるため、行為を直接表す「塗る」とした。薬用・象徴的・儀礼的のいずれかに限定しない。
- source_word: ἐν τῷ ὀνόματι τοῦ κυρίου
  choice: 主の名によって
  rationale: 主の人格と権威に基づいて行うという聖書的表現を自然な日本語で示した。「主」はκύριοςの称号を保つ。
theological_decisions:
- issue: ἀσθενεῖが指す弱さの性質
  choice: 本文では身体的な病気を第一義とする
  alternative: 一般的な弱さ、霊的な弱さ
  rationale: 祈り、油を塗る行為、次節の「病んでいる人」と主が起こすという文脈は身体的疾患を強く示唆する。ただし語そのものの広い意味は脚注で保持した。
- issue: 油を塗る行為の機能
  choice: 機能を特定せず、中立的に行為だけを訳す
  alternative: 医療的処置、象徴的行為、秘跡的儀礼
  rationale: 原文は油を塗ることを命じるが、その仕組みや神学的性格を明示していないため、特定の教派的理解を本文に持ち込まない。
- issue: ἐπ’ αὐτόνを伴う祈り
  choice: その人の上で祈る
  alternative: その人のために祈る
  rationale: 「ために」は目的・執り成しの意味へ明確化する一方、原文のἐπίは病人のそばでその上に祈るという描写を許すため、その表現を保った。
- issue: 「主」が誰を指すか
  choice: 称号「主」のまま訳す
  alternative: 「主イエス」と明示する
  rationale: キリスト者共同体の文脈ではイエスを指す可能性が高いが、この節のギリシア語は固有名を明示しないため、訳文でも補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。問いの形を条件表現「いるなら」で自然に再現し、命令の主体を明示して読みやすくした。原文の分詞は日本語の動作順に合わせて「油を塗り、…祈りなさい」としたが、祈りに伴う行為という関係は保持している。
