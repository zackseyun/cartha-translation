  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐτρυφήσατε ἐπὶ τῆς γῆς καὶ ἐσπαταλήσατε, ἐθρέψατε τὰς καρδίας ⸀ὑμῶν ἐν ἡμέρᾳ σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/005.yaml
  text: You have lived in luxury on the earth and indulged yourselves[d][c][b][a]; you have fattened your hearts in a day of slaughter.
translation:
  language: ja
  text: あなたがたは地上でぜいたくに暮らし、快楽にふけり、屠殺の日にあなたがたの心を肥え太らせました。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「屠殺の日のために、あなたがたの心を肥え太らせました」。屠殺を前に家畜を太らせる情景が背景にあり、迫り来る裁きが暗示されている可能性があります。
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: ἐτρυφήσατε
  choice: ぜいたくに暮らし
  rationale: 享楽的でぜいたくな生活を表す語であり、単なる楽しみではなく、この文脈の非難の響きを自然な現代日本語で保つ。
- source_word: ἐπὶ τῆς γῆς
  choice: 地上で
  rationale: γῆの広い意味である「地・世界」を取り、世俗的な富裕生活への非難に合う簡潔で自然な表現とした。
- source_word: ἐσπαταλήσατε
  choice: 快楽にふけってきました
  rationale: 先行する動詞を強め、放縦で自己 indulgent な生活を示す。現代日本語として明瞭であり、道徳的な非難も伝える。
- source_word: ἐθρέψατε
  choice: 肥え太らせた
  rationale: 通常は「養う」だが、続く屠殺の比喩によって、屠られる家畜を太らせる皮肉な像が生じるため、その像を明示的な解釈にせず保った。
- source_word: τὰς καρδίας ὑμῶν
  choice: 自分の心
  rationale: 聖書的な「心」の比喩を保持しつつ、日本語の主語「あなたがた」に自然に対応させた。
- source_word: ἐν ἡμέρᾳ σφαγῆς
  choice: 屠られる日に
  rationale: ἐνの時間的意味を保ち、「屠殺の日」という不自然に硬い名詞句を避けながら、差し迫る裁きの鮮烈な比喩を維持する。「屠られる日のために」も文脈上可能なので脚注に示した。
theological_decisions:
- issue: 「屠られる日」の比喩的意味
  choice: 差し迫る屠殺／裁きの比喩を本文に残し、神の裁きとは明記しない。
  alternative: 「神の裁きの日」と説明的に訳す、または周辺文脈における無実の者の殺害への言及と見る。
  rationale: 裁きの含意は強いが、ギリシア語はその主体や具体的指示対象を明記していないため、神学的な緊張と曖昧さを保った。
- issue: ἐν ἡμέρᾳ σφαγῆς の時間・目的の関係
  choice: 「屠られる日に」と訳し、ἐνの基本的な時間表現を本文に反映する。
  alternative: 「屠られる日のために」とし、肥育の目的を前面に出す。
  rationale: 屠殺前の肥育という像から目的の含意も自然に生じるが、それを本文で確定せず、脚注で別訳として提示する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、富裕層への厳しい非難と屠殺の鮮烈な比喩を保持した。「快楽にふける」は「放縦に暮らす」より一般読者に理解しやすく、「肥え太らせる」は文脈上の皮肉を伝える。脚注記号[a]は該当文末に置いた。
