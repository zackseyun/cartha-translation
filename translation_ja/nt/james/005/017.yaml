id: JAS.5.17
reference: James 5:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Ἠλίας ἄνθρωπος ἦν ὁμοιοπαθὴς ἡμῖν, καὶ προσευχῇ προσηύξατο τοῦ μὴ βρέξαι, καὶ οὐκ ἔβρεξεν ἐπὶ τῆς γῆς ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ·
base_translation:
  language: en
  yaml_path: translation/nt/james/005/017.yaml
  text: Elijah was a man with a nature like ours[a], and he prayed earnestly that it would not rain, and it did not rain on the land for three years and six months.
translation:
  language: ja
  text: エリヤは、私たちと同じ人間的な性質を持つ人でした[a]。そして、雨が降らないようにと熱心に祈りました。すると、三年六か月の間、その地に雨は降りませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちと同じような人でした」、または「私たちと同じ感情を持つ人でした」。
    reason: ὁμοιοπαθήςは、同じ人間的な性質・経験・感情を共有することを幅広く表し得るため。
lexical_decisions:
- source_word: Ἠλίας
  choice: エリヤ
  rationale: 旧約の預言者名として日本語聖書で広く定着している表記を用いた。
- source_word: ἄνθρωπος
  choice: 人
  rationale: エリヤが読者と同じ人間であることを自然かつ簡潔に示す。
- source_word: ὁμοιοπαθὴς ἡμῖν
  choice: 私たちと同じ弱さを持つ
  rationale: ὁμοιοπαθήςは同じ経験、感情、影響を受ける人間的なあり方を共有することを表す。「弱さ」は文脈上の励ましを明瞭にするが、意味をそれだけに限定しないよう別訳を脚注に示した。
- source_word: προσευχῇ προσηύξατο
  choice: 熱心に祈ると
  rationale: 同語根の名詞と動詞を重ねる強意的な表現を、現代日本語で自然な「熱心に祈る」とした。
- source_word: τοῦ μὴ βρέξαι
  choice: 雨が降らないようにと
  rationale: 祈りの内容または目的を表す不定詞句を、両方の含みを保てる自然な日本語にした。
- source_word: οὐκ ἔβρεξεν
  choice: 雨は降りませんでした
  rationale: ギリシア語の非人称的な雨の表現に対応する標準的な日本語表現。
- source_word: ἐπὶ τῆς γῆς
  choice: その地に
  rationale: エリヤ物語における干ばつの地域を指す文脈に合わせ、世界全体という不要な含意を避けた。定冠詞は既知の土地を示す「その」で表した。
- source_word: ἐνιαυτοὺς τρεῖς καὶ μῆνας ἕξ
  choice: 三年六か月の間
  rationale: 期間を示す対格を自然な日本語で明示した。
theological_decisions:
- issue: ὁμοιοπαθὴςが示すエリヤと読者の共通性
  choice: エリヤは読者と同じ弱さを持つ人間であった
  alternative: エリヤは私たちと同じような人であった／私たちと同じ感情を持つ人であった
  rationale: この文は、際立った祈りの結果を得たエリヤも読者と共通の人間的条件にあったことを強調する。「弱さ」はその意図を伝えやすい一方、語の範囲は感情や経験も含み得るため、脚注で広い別訳を保持した。
- issue: καίによる祈りと結果の連結
  choice: 「それでも」で、人間的な弱さと力ある祈りの対照を文脈に即して表した
  alternative: 単純な並列の「そして」
  rationale: ギリシア語のκαί自体は広い接続機能を持つが、直前の普通の人間性と続く祈りの効力には修辞的な対照がある。ただし因果関係や特別な霊性は付加していない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。敬体で統一し、強意表現は慣用的に訳した。脚注記号[a]を該当箇所に置いた。
