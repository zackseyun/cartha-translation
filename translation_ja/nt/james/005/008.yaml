  text: μακροθυμήσατε καὶ ὑμεῖς, στηρίξατε τὰς καρδίας ὑμῶν, ὅτι ἡ παρουσία τοῦ κυρίου ἤγγικεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/008.yaml
  text: You also be patient; strengthen your hearts[a], because the coming of the Lord has drawn near.
translation:
  language: ja
  text: あなたがたも忍耐しなさい。心を強くしなさい。主の到来[a]が近づいているからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主の臨在」とも訳せる。ギリシア語は「臨在」と「到来」のどちらも意味し得るが、ここでは終わりの時に主が来られることを指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: μακροθυμήσατε
  choice: 忍耐しなさい
  rationale: 苦難の中で長く耐えることを命じるアオリスト命令形。前節の農夫のたとえとのつながりを保ちつつ、現代日本語として明瞭にした。
- source_word: καὶ ὑμεῖς
  choice: あなたがたも
  rationale: 前節で挙げられた農夫の忍耐を受け、読者にも同じ忍耐を促す強調を自然に表す。
- source_word: στηρίξατε τὰς καρδίας ὑμῶν
  choice: 心を強くしなさい
  rationale: στηρίζω の「堅固にする、強める」という意味と、καρδία の内面・意志・勇気を表す聖書的比喩を、自然な日本語で保持する。
- source_word: ὅτι
  choice: からです
  rationale: 二つの命令の根拠を示す因果関係を明確に表す。
- source_word: ἡ παρουσία τοῦ κυρίου
  choice: 主が来られる時
  rationale: παρουσία は「臨在」と「到来」の意味領域を持つが、5:7–8の終末論的文脈では主の到来を指す。「来臨」より一般読者に明瞭で、主への敬意も表せる。
- source_word: ἤγγικεν
  choice: 近づいている
  rationale: 完了形が示す、すでに近くなり、その状態が続いているという含みを自然な現代日本語で表す。
theological_decisions:
- issue: 終末論的文脈における παρουσία の意味
  choice: 主が来られる時
  alternative: 主の臨在
  rationale: 語自体には「臨在」と「到来」の両義があるが、ヤコブ5:7–8は待ち望むべき将来の主の到来を語っている。本文では文脈上の意味を明瞭にし、語の幅は脚注に残す。
- issue: ἤγγικεν の完了形と主の到来の近さ
  choice: 近づいている
  alternative: 近い
  rationale: 単なる時期の断定に平板化せず、近づいた結果として近い状態にあるという完了形のニュアンスを反映する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「忍耐」「心」という聖書的に定着した語を用い、「来臨」のような専門語は避けた。脚注記号[a]は、それが補足する παρουσία の訳の直後ではなく文末に置き、節全体の読みやすさを優先した。
