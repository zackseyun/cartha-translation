reference: James 5:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ πάλιν προσηύξατο, καὶ ὁ οὐρανὸς ⸂ὑετὸν ἔδωκεν⸃ καὶ ἡ γῆ ἐβλάστησεν τὸν καρπὸν αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/james/005/018.yaml
  text: And he prayed again[a], and the sky gave rain[b], and the earth produced its fruit.
translation:
  language: ja
  text: そして、彼は再び祈った。すると、空[a]は雨を降らせ、大地はその実り[b]を生み出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「天」とも訳せる。ギリシア語は「空」と「天」のどちらも意味し得る。ここでは雨の文脈に合わせて「空」とした。
    reason: lexical_alternative
  - marker: b
    text: 「地はその実りをもたらした」または「土地は作物を生み出した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: 再び
  rationale: 祈りが繰り返されたことを簡潔かつ自然に示す。前節の「熱心に」という意味をここへ補わない。
- source_word: προσηύξατο
  choice: 彼が祈ると
  rationale: アオリスト形を自然な日本語の順接で表した。動詞自体は単に「祈った」を意味するため、「熱心に」などは加えない。
- source_word: ὁ οὐρανὸς
  choice: 空
  rationale: 雨という気象の文脈では、目に見える空を指すのが自然である。ただし「天」の可能性も脚注に残す。
- source_word: ὑετὸν ἔδωκεν
  choice: 雨を降らせ
  rationale: 直訳は「雨を与えた」だが、日本語では「空は雨を降らせ」が自然であり、空を文法上の主語とする原文の表現も保てる。
- source_word: ἡ γῆ
  choice: 大地
  rationale: 空との対句を保ちつつ、雨を受けて作物を生じさせる地面・土地の広い意味を表す。
- source_word: ἐβλάστησεν
  choice: 生じさせた
  rationale: 芽生える、成長して産出するという語義を、目的語「実り」と自然に結び付ける表現。
- source_word: τὸν καρπὸν αὐτῆς
  choice: その実り
  rationale: 農作物を含む土地の産出物を指す。日本語の「実り」は「実」より広く、ここでの農耕的意味に適する。
theological_decisions:
- issue: エリヤの祈りと雨をもたらす神の働き
  choice: 神が雨を降らせたという説明を補わず、空が雨を降らせ、大地が実りを生じさせたという本文の表現を保つ。
  alternative: 「神が雨を降らせた」と明示する。
  rationale: 文脈上、神の応答は明らかだが、この節自体は空と大地を主語として結果を描いているため、神学的説明を訳文に追加しない。
translation_notes:
  register: 明快で現代的な標準日本語としつつ、「空」と「大地」の並行表現を生かした。「生じさせた」はやや格調を保ちながら一般読者にも理解できる表現である。
