  text: κατεδικάσατε, ἐφονεύσατε τὸν δίκαιον. οὐκ ἀντιτάσσεται ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/james/005/006.yaml
  text: You condemned[a], you murdered the righteous one[b]. He does not resist you.
translation:
  language: ja
  text: あなたがたは、正しい人[a]を罪に定め、殺しました。その人は、あなたがたに抵抗していないのではありませんか[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「正しい人」は、富む者に虐げられる代表的な義人を指すと考えられますが、「正しい方」であるイエスを暗示している可能性もあります。
    reason: alternative_reading
  - marker: b
    text: この節は、「その人は、あなたがたに抵抗しません」と平叙文として訳すこともできます。ギリシア語本文では、否定の答えを予期する修辞疑問の形になっています。
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεδικάσατε
  choice: 罪に定め
  rationale: 司法的な有罪宣告・断罪の意味を保ちつつ、現代日本語として簡潔で力強い表現にした。アオリスト二人称複数の告発調は「あなたがたは……ました」で表した。
- source_word: ἐφονεύσατε
  choice: 殺しました
  rationale: φονεύωの不正な殺害という強い非難は文脈によって明らかであり、日本語では不自然に専門語化せず、直接的な「殺しました」とした。
- source_word: τὸν δίκαιον
  choice: 正しい人
  rationale: 冠詞付き男性単数形容詞の名詞的用法を、特定の一人を指し得ると同時に代表的な義人とも読める表現にした。「者」より一般読者に自然な「人」を用い、イエスを指す称号とは本文で断定しない。
- source_word: οὐκ ἀντιτάσσεται ὑμῖν
  choice: その人は、あなたがたに抵抗していないではありませんか
  rationale: ἀντιτάσσομαιを「抵抗する」とし、現在形と単数の主語を保持した。SBLGNTの疑問符とοὐκを伴う修辞疑問の形を日本語でも残し、答えとして「抵抗していない」ことを見込む問いとして訳した。
theological_decisions:
- issue: 「正しい人」の指示対象
  choice: 富む者に虐げられる代表的な正しい人として読める本文
  alternative: 「正しい方」というイエスへの暗示または称号
  rationale: 直前の文脈は富む者による義人への抑圧を一般的に告発しており、単数形は代表的用法で理解できる。一方、イエスへの響きも排除せず、脚注で示した。
- issue: 末尾の節の文の力
  choice: 否定を含む修辞疑問として訳す
  alternative: 「その人は、あなたがたに抵抗しません」という平叙文
  rationale: 原文校訂版の疑問符とοὐκを尊重しつつ、日本語で否定の答えを予期する問いとして表現した。平叙文として理解する解釈も脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語の丁寧体を用いた。告発の鋭さを保つため動詞は簡潔にし、原文の修辞疑問と指示対象の曖昧さを本文と脚注で保持した。
