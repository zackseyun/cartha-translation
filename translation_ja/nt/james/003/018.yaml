  text: καρπὸς ⸀δὲ δικαιοσύνης ἐν εἰρήνῃ σπείρεται τοῖς ποιοῦσιν εἰρήνην.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/018.yaml
  text: And the fruit of righteousness is sown in peace by those who make peace[a][b].
translation:
  language: ja
  text: そして、義の実は、平和をつくる人たちによって、平和の中で蒔かれます[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「正義の実」。原語は、道徳的な正しさと、対人関係や法における公正さの両方を含み得る。
    reason: lexical_alternative
  - marker: b
    text: 別訳「平和をつくる人たちのために」。原語の与格は別の取り方もできるが、ここでは受動動詞とのつながりから「人たちによって」と訳した。
    reason: alternative_reading
lexical_decisions:
- source_word: καρπὸς
  choice: 実
  rationale: 「実」は単数名詞の比喩を自然に保つ。「収穫」も文脈上は可能だが、原語の語形と結実のイメージには「実」がより近い。
- source_word: δὲ
  choice: そして
  rationale: ここでは強い逆接ではなく、直前の天からの知恵についての説明を受ける穏やかな接続を表す。
- source_word: δικαιοσύνης
  choice: 義
  rationale: 道徳的な正しさに加え、対人・法的な公正さも含み得る語である。本文では簡潔で広がりのある「義」とし、「正義」という可能性を脚注に残す。
- source_word: ἐν εἰρήνῃ
  choice: 平和のうちに
  rationale: 種蒔きがなされるあり方、または領域のどちらとも取り得る表現を、過度に限定せず保持する。
- source_word: σπείρεται
  choice: 蒔かれます
  rationale: 現在受動形を自然な日本語の受動表現で示し、種蒔きの比喩を保つ。
- source_word: τοῖς ποιοῦσιν εἰρήνην
  choice: 平和をつくり出す人々によって
  rationale: 受動動詞に伴う与格を行為者と理解する読みを本文に採用した。「平和をつくり出す」は ποιέω と εἰρήνη の組み合わせを明示しつつ、現代日本語として自然である。
theological_decisions:
- issue: 「義の実」の意味
  choice: 属格の関係を限定せず、「義の実」と表現する。
  alternative: 義そのものである収穫、または義を生み出す実と解する。
  rationale: δικαιοσύνης は、実の性質・内容・結果など複数の関係を表し得る。本文では、天からの知恵と平和な行いから生じる義なる結実という文脈を保ちつつ、どの関係かを訳文で断定しない。
- issue: 与格 τοῖς ποιοῦσιν εἰρήνην の機能
  choice: 受動動詞の行為者として「平和をつくり出す人々によって」とする。
  alternative: 受益者として「平和をつくり出す人々のために」とする。
  rationale: 受動形 σπείρεται とのつながりでは行為者の読みが最も自然だが、与格には受益者として理解する余地もあるため、脚注で代案を示す。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文としての品位を保った。「義の実」「平和のうちに」により原文の比喩と意味の幅を維持し、「平和をつくり出す」で原語の動詞表現を自然に反映した。
