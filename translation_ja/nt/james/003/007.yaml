id: JAS.3.7
reference: James 3:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πᾶσα γὰρ φύσις θηρίων τε καὶ πετεινῶν ἑρπετῶν τε καὶ ἐναλίων δαμάζεται καὶ δεδάμασται τῇ φύσει τῇ ἀνθρωπίνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/007.yaml
  text: For every kind of beast and bird[a], of reptile and sea creature, is being tamed and has been tamed by humankind.
translation:
  language: ja
  text: なぜなら、あらゆる種類の獣や鳥、地を這うものや海の生き物は、人類[a]によって飼いならされており、また、すでに飼いならされてきたからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「人間の本性によって」または「人類によって」。ギリシア語の表現は、人類全体を集合的に指すとも、人間の本性・人間性を指すとも理解できます。本文は前者を採っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσα ... φύσις
  choice: あらゆる種類
  rationale: 動物を列挙する文脈では、φύσις は個々の「性質」ではなく「種類・類」を表す。「あらゆる種類」は πᾶσα の包括性も自然に伝える。
- source_word: γὰρ
  choice: というのも……からです
  rationale: 直前の主張に理由や説明を加える接続関係を、現代日本語で明確に示す。
- source_word: θηρίων
  choice: 獣
  rationale: 野生の動物、獣を指す語。簡潔で格調があり、鳥以下の分類との並びにも適する。
- source_word: πετεινῶν
  choice: 鳥
  rationale: 飛ぶ生き物を指す語を、通常の日本語の分類名で自然に表す。
- source_word: ἑρπετῶν
  choice: 地を這うもの
  rationale: 語義は現代生物学上の「爬虫類」より広く、這う生き物全般を含み得るため、原語の幅を保つ。
- source_word: ἐναλίων
  choice: 海の生き物
  rationale: 海中にいるものを広く指す形容詞の名詞的用法を、限定しすぎない自然な表現にする。
- source_word: δαμάζεται
  choice: 飼いならされており
  rationale: 現在受動形が示す一般的・継続的な事実を表す。文脈上、動物を人間の支配下に置く意味を自然に伝える。
- source_word: δεδάμασται
  choice: すでに飼いならされてきた
  rationale: 完了受動形を現在形と区別し、これまでになされた飼いならしの結果があることを示す。
- source_word: τῇ φύσει τῇ ἀνθρωπίνῃ
  choice: 人類によって
  rationale: ここでは動物の各種と対照される人間の種・人類全体を行為者として理解するのが文脈に合う。抽象的な「人間の本性によって」という可能性は注記に残す。
theological_decisions:
- issue: τῇ φύσει τῇ ἀνθρωπίνῃ が人類という集合的行為者を指すか、人間の本性・人間的領域を指すか
  choice: 本文では「人類によって」とする
  alternative: 「人間の本性によって」または「人間の力によって」
  rationale: 動物の諸種類と人間とを対照する文脈では集合的な人類が自然だが、ギリシア語 φύσις の抽象的な意味も文法上排除できないため、本文で断定しすぎず脚注で保持する。
translation_notes:
  register: 明快な現代標準語を用いつつ、聖書本文としての落ち着いた格調を保った。「というのも……からです」で前節との説明関係を明示し、二つの受動動詞は「飼いならされており」と「すでに飼いならされてきた」で時制・相の対比をできる限り保持した。
