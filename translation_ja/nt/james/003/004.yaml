id: JAS.3.4
reference: James 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἰδοὺ καὶ τὰ πλοῖα, τηλικαῦτα ὄντα καὶ ὑπὸ ⸂ἀνέμων σκληρῶν⸃ ἐλαυνόμενα, μετάγεται ὑπὸ ἐλαχίστου πηδαλίου ὅπου ⸂ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται⸃·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/004.yaml
  text: 'Look also at the ships: though they are so large and are driven by strong winds[a], they are steered by a very small rudder wherever the inclination of the one steering wills.'
translation:
  language: ja
  text: また、船を見てください。あれほど大きく、強い風に吹き立てられても、ごく小さな舵によって、操る人の意向のままに進路を変えられます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「操る人の意向が望む所へ」。または「操る人が望む所へ」。
    reason: ὁρμήとβούλεταιを組み合わせたギリシア語独特の表現について、字義に近い形と自然な別訳を示すため。
lexical_decisions:
- source_word: ἰδοὺ καὶ τὰ πλοῖα
  choice: また、船を見てください
  rationale: 前節に続く例へ注意を促す表現として、現代日本語で自然かつ明瞭に訳した。
- source_word: τηλικαῦτα ὄντα
  choice: あれほど大きく
  rationale: 船の際立った大きさと、小さな舵との対比を簡潔に表した。
- source_word: ὑπὸ ἀνέμων σκληρῶν ἐλαυνόμενα
  choice: 強い風に吹き立てられても
  rationale: σκληρόςの強烈さとἐλαύνωの受動的な推進を自然な航海表現で示し、文脈上の譲歩も表した。
- source_word: μετάγεται
  choice: 進路を変えられます
  rationale: πηδάλιονとの組み合わせにおける、船を操って別の方向へ向ける意味を明確にした。
- source_word: ὑπὸ ἐλαχίστου πηδαλίου
  choice: ごく小さな舵によって
  rationale: 最上級ἐλάχιστοςの強調を、日本語で絶対的な最小を不自然に示さず「ごく小さな」とした。
- source_word: ὅπου ἡ ὁρμὴ τοῦ εὐθύνοντος βούλεται
  choice: 操る人の意向のままに
  rationale: ὁρμήの意向・志向とβούλομαιの意志を自然にまとめつつ、操船者の内的な意図が方向を定める趣旨を保持した。
theological_decisions:
- issue: 操船者の意志を表す句の字義性
  choice: 操る人の意向のままに
  alternative: 操る人が望む所へ／操る人の衝動が望む所へ
  rationale: 「衝動が望む」という逐語的な擬人表現は日本語では意味を取りにくい。一方、単に目的地だけを述べず、ὁρμήが示す内的な志向とβούλεταιの意志性を「意向のままに」で保った。比喩の神学的含意を訳文で過度に解釈していない。
translation_notes:
  register: 明瞭な現代標準日本語。船と舵の対比を読みやすく保ちつつ、「あれほど」「ごく小さな」によって原文の大小の強調を再現した。
