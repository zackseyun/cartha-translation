id: JAS.3.17
reference: James 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἡ δὲ ἄνωθεν σοφία πρῶτον μὲν ἁγνή ἐστιν, ἔπειτα εἰρηνική, ἐπιεικής, εὐπειθής, μεστὴ ἐλέους καὶ καρπῶν ἀγαθῶν, ⸀ἀδιάκριτος, ἀνυπόκριτος·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/017.yaml
  text: But the wisdom from above is first pure[a], then peaceable, gentle, open to reason, full of mercy and good fruits, impartial, sincere.
translation:
  language: ja
  text: しかし、上からの知恵は、何よりもまず清く、次に平和を求め、寛容で、聞く耳を持ち、憐れみと良い実に満ち、分け隔てがなく[a]、偽善がありません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「心が分かれず」または「疑うことがなく」とも訳せる。ギリシア語の語は、「分け隔てをしない」という意味にも、「心が分裂していない、迷いがない」という意味にも理解できる。
    reason: ἀδιάκριτος の複数の語義と、ヤコブ書内でそれぞれを支持しうる文脈を保存するため。
lexical_decisions:
- source_word: ἄνωθεν
  choice: 上からの
  rationale: 直訳的な空間表現を保ちつつ、3章15節の「地上の」との対比を明確にする。「天からの」と限定しすぎない。
- source_word: σοφία
  choice: 知恵
  rationale: 文脈上、行動と実によって示される知恵の性質を表す標準的な訳語。
- source_word: πρῶτον μὲν
  choice: 何よりもまず
  rationale: 単なる列挙の第一項だけでなく、清さの優先性を自然な日本語で示す。
- source_word: ἁγνή
  choice: 清く
  rationale: 性的な貞潔に限定せず、道徳的な清さと混じり気のない誠実さを表せる。
- source_word: ἔπειτα
  choice: 次に
  rationale: 最初の性質に続く諸性質を導く順序表現を保つ。
- source_word: εἰρηνική
  choice: 平和を求め
  rationale: 単に静穏な状態ではなく、平和を志向し促す性質を自然な現代日本語で表す。
- source_word: ἐπιεικής
  choice: 寛容で
  rationale: 厳格に権利を押し通さず、穏やかに譲る公平さ・思いやりを含む語として選んだ。
- source_word: εὐπειθής
  choice: 聞く耳を持ち
  rationale: 説得を受け入れ、頑固でなく、正しいことに従う用意があるという稀な形容詞の意味を、誤解の少ない自然な表現で示す。
- source_word: μεστὴ ἐλέους
  choice: 憐れみに満ち
  rationale: μεστήが示す豊かさを保ち、苦しむ人への慈しみを表す。
- source_word: καρπῶν ἀγαθῶν
  choice: 良い実に満ち
  rationale: 目に見える良い結果や行いを示す「実」の比喩と、ギリシア語の複数的な広がりを保つ。
- source_word: ἀδιάκριτος
  choice: 分け隔てがなく
  rationale: ヤコブ書2章のえこひいきへの戒めとも響き合う社会倫理的な意味を自然に表す。ただし語義には「心が分かれない」「疑わない」もあり、脚注に残す。
- source_word: ἀνυπόκριτος
  choice: 偽りがありません
  rationale: 見せかけや偽善がなく、真実であることを明瞭な現代日本語で表す。
theological_decisions:
- issue: ἀδιάκριτος の解釈
  choice: 分け隔てがなく
  alternative: 心が分かれず／疑うことがなく
  rationale: この倫理的な性質の列挙では、憐れみ、良い実、偽りのなさと並ぶ「公平で差別しない」という理解がよく適合し、2章1–4節とも関連する。一方、1章6–8節や4章8節を踏まえれば、内面の分裂や疑いがないという理解も可能なため、本文で一義的に解消せず脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。抽象的な形容詞を機械的に連ねず、「平和を求め」「聞く耳を持ち」など、普通の読者に意味が伝わる自然な述語表現を用いた。脚注記号[a]は該当語「分け隔てがなく」の直後に置いた。
