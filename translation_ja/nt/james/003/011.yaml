  text: Does a spring pour out both sweet and bitter water from the same opening?[a]
translation:
  language: ja
  text: 泉が、同じ出口から甘い水と苦い水の両方を湧き出すでしょうか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
