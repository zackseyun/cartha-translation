lexical_decisions:
- source_word: μήτι
  choice: ……でしょうか
  rationale: 否定の答えを予想する修辞疑問を、文脈上その含意が自然に伝わる現代日本語の疑問形で表した。
- source_word: ἡ πηγή
  choice: 一つの泉
  rationale: 天然の水源を指す語であり、日本語では「泉」が簡潔で自然。「一つの」は同一の泉から相反するものが出るという対比を明瞭にする。
- source_word: ἐκ τῆς αὐτῆς ὀπῆς
  choice: 同じ口から
  rationale: ὀπήは穴・開口部を意味するが、泉の水が出る箇所には日本語の「口」が自然で、身体の口をめぐる直前の文脈との響きも保つ。
- source_word: βρύει
  choice: 湧き出させる
  rationale: 水が勢いよく湧く、噴き出す動作を表す。泉を主語とする自然な日本語として使役的な形を採用した。
- source_word: τὸ γλυκὺ καὶ τὸ πικρόν
  choice: 甘い水と苦い水
  rationale: 形容詞が名詞的に用いられ、泉から出る水を指す。「水」を補って日本語で対象を明確にしつつ、「甘い／苦い」という原文の対照を保持した。
