  text: μὴ δύναται, ἀδελφοί μου, συκῆ ἐλαίας ποιῆσαι ἢ ἄμπελος σῦκα; ⸂οὔτε ἁλυκὸν⸃ γλυκὺ ποιῆσαι ὕδωρ.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/012.yaml
  text: My brothers[a], can a fig tree produce olives[c][b], or a grapevine figs? Neither can salt water produce fresh water.
translation:
  language: ja
  text: 私の兄弟たち[a]、いちじくの木がオリーブの実を結ぶことができるでしょうか。あるいは、ぶどうの木がいちじくの実を結ぶことができるでしょうか。塩水が真水[b]を出すこともできません[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の兄弟姉妹たち」。ギリシア語は男性複数形の「兄弟たち」だが、男女を含む一団への呼びかけにも用いられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「甘い水」。ここでは塩水と対照される「真水」を意味する。
    reason: lexical_alternative
  - marker: c
    text: この節の最後の句はギリシア語では省略を含む簡潔な表現である。前節の泉の比喩を踏まえ、「塩水の泉が真水を出すこともできません」と理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち
  rationale: 男性複数形の呼びかけを本文で保ちつつ、ヤコブ書では共同体全体への呼びかけとなり得ることを脚注で示した。
- source_word: μὴ δύναται
  choice: できるでしょうか
  rationale: μήで始まり否定の答えを予期する修辞疑問を、自然な現代日本語の疑問形で表した。
- source_word: συκῆ
  choice: いちじくの木
  rationale: 果実ではなく樹木を指すため、「いちじく」だけでなく「いちじくの木」とした。
- source_word: ἐλαίας ποιῆσαι
  choice: オリーブの実を結ぶ
  rationale: ποιέωはここでは木が実を産することを表すので、日本語の自然な農耕表現「実を結ぶ」を用いた。
- source_word: ἄμπελος
  choice: ぶどうの木
  rationale: この文脈ではぶどうを実らせるつる性の木を指すため、明瞭な「ぶどうの木」とした。
- source_word: σῦκα
  choice: いちじくの実
  rationale: 複数の果実を指す。日本語では数を明示せず、「実」を補って樹木との対比を明確にした。
- source_word: οὔτε ἁλυκὸν
  choice: 塩水が…こともできません
  rationale: ἁλυκόνは実質的に名詞として用いられた「塩辛いもの」で、文脈上は水または泉が補われる。本文では過度に限定しない「塩水」とした。
- source_word: γλυκὺ ποιῆσαι ὕδωρ
  choice: 真水を生み出す
  rationale: γλυκύςの字義は「甘い」だが、塩水との対比では「塩分を含まない真水」を意味するため、自然な日本語で「真水」とした。
