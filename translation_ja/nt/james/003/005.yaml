  text: οὕτως καὶ ἡ γλῶσσα μικρὸν μέλος ἐστὶν καὶ ⸂μεγάλα αὐχεῖ⸃. Ἰδοὺ ⸀ἡλίκον πῦρ ἡλίκην ὕλην ἀνάπτει·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/005.yaml
  text: So also the tongue is a small member[a], and yet it boasts of great things[b]. See how small a fire sets ablaze so great a forest.
translation:
  language: ja
  text: 同じように、舌も体の小さな一部分ですが、大きなことを言い誇ります。見てください。ごく小さな火[a]が、なんと大きな森[b]を燃やすことでしょう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語は、「なんと大きな火が、なんと大きな森を燃やすことでしょう」とも訳せます。本文は、小さな原因が大きな結果を生むという直前のたとえに沿っています。
    reason: alternative_reading
  - marker: b
    text: 「森」に当たるギリシア語は、木材、薪、燃えやすい草木などを指すこともあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: γλῶσσα
  choice: 舌
  rationale: 発話という働きに置き換えず、体の一部分としての具体的なたとえを保つため。
- source_word: μικρὸν μέλος
  choice: 体の小さな一部分
  rationale: μέλοςの身体的な意味を明確にしつつ、現代日本語で自然に理解できる表現とした。「器官」より広く、文脈にも適する。
- source_word: μεγάλα αὐχεῖ
  choice: 大きなことを誇ります
  rationale: 誇るという動詞の意味と、μεγάλαが表す誇大な内容の両方を保った。単に「大言壮語する」とすると語調が強くなりすぎる。
- source_word: Ἰδοὺ
  choice: 見てください
  rationale: 次の具体例へ注意を向けさせる働きを、古風にならない丁寧で明瞭な日本語で表した。
- source_word: ἡλίκον πῦρ
  choice: ごく小さな火
  rationale: 語形だけなら「なんと大きな火」とも取れるが、直前の「小さな一部分」と、わずかな原因が大きな結果を生む対比を本文で明確にした。原文の解釈上の幅は脚注に残した。
- source_word: ἡλίκην ὕλην
  choice: なんと大きな森
  rationale: ὕληは森、木材、燃料となる草木などを指し得る。火が広範囲に燃え広がる比喩として、日本語では「森」が最も自然で鮮明である。
- source_word: ἀνάπτει
  choice: 燃え上がらせる
  rationale: 火が大量の可燃物に燃え移る動きを、現代日本語で生き生きと表すため。
theological_decisions:
- issue: 小さな火と大きな結果との対比
  choice: 本文では「ごく小さな火」とした
  alternative: 「なんと大きな火が、なんと大きな森を燃やすことか」
  rationale: 舌が小さな体の一部分でありながら大きな影響を及ぼすという直前直後の論旨を優先した。ただし、ἡλίκονを通常の感嘆表現として取る可能性を排除せず、脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、身体と火の具体的なたとえを保持した。「にすぎませんが」で小ささと大きな働きの対照を自然に示しつつ、全体を朗読にも適する dignified な文体に整えた。
