id: JAS.3.8
reference: James 3:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: τὴν δὲ γλῶσσαν οὐδεὶς ⸂δαμάσαι δύναται ἀνθρώπων⸃· ⸀ἀκατάστατον κακόν, μεστὴ ἰοῦ θανατηφόρου.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/008.yaml
  text: But no one among men is able to tame the tongue[a]. It is a restless evil[b], full of deadly poison.
translation:
  language: ja
  text: しかし、人間のだれにも、舌を飼いならすことはできません。舌は、静まることのない悪であり[a]、死をもたらす毒に満ちています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「不安定な悪」または「手に負えない悪」。
    reason: ἀκατάστατονは、不安定、無秩序、静まらない、制御しにくいといった意味の幅を持つため。
lexical_decisions:
- source_word: γλῶσσαν
  choice: 舌
  rationale: 身体器官を表す語をそのまま用い、前後の文脈で人間のことばを指す比喩と、動物を飼いならす話とのつながりを保った。
- source_word: δαμάσαι
  choice: 飼いならす
  rationale: 直前の動物について用いられた動詞との連続性を保ちつつ、日本語でも比喩として理解できる表現とした。
- source_word: οὐδεὶς … ἀνθρώπων
  choice: 人間の中に…人は一人もいません
  rationale: ἀνθρώπωνをοὐδείςにかかる部分属格と理解し、性別を限定せず「人間のうちのだれもいない」という意味を自然な日本語で示した。
- source_word: ἀκατάστατον
  choice: 静まることのない
  rationale: 不安定、無秩序、抑えがたいという語の幅のうち、舌の絶えず動いて害を及ぼす性質を自然に表す「静まることのない」を採用した。別の語義の可能性は脚注に残した。
- source_word: κακόν
  choice: 悪
  rationale: 単なる害ではなく、道徳的かつ破壊的な性質を表す語として訳した。
- source_word: ἰοῦ θανατηφόρου
  choice: 死をもたらす毒
  rationale: この文脈のἰόςを「毒」と取り、θανατηφόροςの致死的な力を明瞭で自然な日本語にした。
theological_decisions:
- issue: οὐδεὶςとἀνθρώπωνにおける人間一般の表現
  choice: 人間の中に…人は一人もいません
  alternative: 舌を飼いならすことは、だれにもできません
  rationale: 原文が人間一般について述べていることを明示しつつ、男性だけを指すとの誤解を避けた。
- issue: 舌を飼いならせる者はいないという断定の範囲
  choice: 原文どおり、人間にはできないという絶対的な表現を保持
  alternative: 舌を完全に飼いならすことは難しい
  rationale: 原文の強い否定を弱めず、神の働きや例外について本文が明言していないことも補わなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「飼いならす」「舌」「毒」という具体的な比喩を保ち、簡潔で重みのある文調とした。
