  text: οὐκ ἔστιν αὕτη ἡ σοφία ἄνωθεν κατερχομένη, ἀλλὰ ἐπίγειος, ψυχική, δαιμονιώδης·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/015.yaml
  text: This wisdom is not coming down from above[a], but is earthly, unspiritual, demonic.
translation:
  language: ja
  text: この知恵は、上から下って来るものではなく、地上のもの、霊的でないもの[a]、悪霊的なものです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「自然のままのもの」。ギリシア語は、御霊に属するものとは対照的に、自然の生命の領域に属するものを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη ἡ σοφία
  choice: この知恵
  rationale: 直前に描かれた種類の知恵を指す指示表現を、簡潔かつ直接的に訳した。
- source_word: ἄνωθεν κατερχομένη
  choice: 上から下って来る
  rationale: ἄνωθενの「上から」という表現を保ち、ヤコブ1:17にも通じる神的起源の含意を「天から」と限定せずに残した。現在分詞は継続的・特徴的な動きを自然な日本語で表した。
- source_word: ἐπίγειος
  choice: 地上のもの
  rationale: 「上から」との空間的・神学的対照を明確に保ち、「世俗的」のような解釈的意味を加えない訳語とした。
- source_word: ψυχική
  choice: 生まれながらの人に属するもの
  rationale: ψυχικόςが、御霊に属するものと対照される自然的生命・人間に属することを示す点を表した。「非霊的」より自然な日本語でありつつ、単に身体的・感覚的という意味には限定しない。
- source_word: δαιμονιώδης
  choice: 悪霊に属するもの
  rationale: 悪霊に由来する、または悪霊的な性質を持つという語義を明瞭に伝える。「悪魔的」は単数の悪魔を想起させ得るため避けた。
theological_decisions:
- issue: ψυχικήが示す霊的・道徳的対照
  choice: 生まれながらの人に属するもの
  alternative: 霊的でないもの／自然のままのもの
  rationale: この語は自然的生命に属することと、神の御霊に属さないことの双方を含み得る。本文では前者を読みやすく示し、後者との対照を脚注で補って、特定の教理体系に限定せず語義の幅を保った。
- issue: 三つの形容詞の関係
  choice: 「地上のもの、生まれながらの人に属するもの、悪霊に属するもの」と並列した
  alternative: 「地上的で、非霊的で、悪霊的です」
  rationale: 原文の三語の累積的な厳しさを保ち、それぞれを同じ構文で提示した。段階的評価であることを説明的な接続語で固定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、三つの述語を「〜もの」でそろえて原文の修辞的な列挙を保持した。「上から」は原文の曖昧さと神学的響きを残すため、「天から」と解釈的に限定していない。
