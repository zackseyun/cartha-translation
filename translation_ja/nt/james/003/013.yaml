id: JAS.3.13
reference: James 3:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: Τίς σοφὸς καὶ ἐπιστήμων ἐν ὑμῖν; δειξάτω ἐκ τῆς καλῆς ἀναστροφῆς τὰ ἔργα αὐτοῦ ἐν πραΰτητι σοφίας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/013.yaml
  text: Who is wise and understanding among you? Let him show his works by his good conduct[b][a], in the meekness of wisdom.
translation:
  language: ja
  text: あなたがたの中で、知恵があり、物事をわきまえている人はだれですか。その人は、立派な生き方によって、自分の行いを、知恵に伴う柔和さをもって示すべきです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「知恵から生まれる柔和さをもって」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: Τίς
  choice: だれですか
  rationale: 共同体の中で該当する人物を問う修辞的な問いを、自然な現代日本語で表した。
- source_word: σοφὸς καὶ ἐπιστήμων
  choice: 知恵があり、物事をわきまえている
  rationale: σοφόςの実践的・道徳的な知恵と、ἐπιστήμωνの理解力・識見を区別しつつ、自然な組み合わせにした。
- source_word: ἐν ὑμῖν
  choice: あなたがたの中で
  rationale: 手紙の受け手である共同体内の人物を指す表現として明瞭である。
- source_word: δειξάτω
  choice: 示しなさい
  rationale: 三人称単数のアオリスト命令法の勧告・命令の力を保つ。日本語では直前の「その人は」によって単数の代表的用法が明らかになる。
- source_word: τὰ ἔργα αὐτοῦ
  choice: 自分の行い
  rationale: ἔργαを実際の行為として自然に訳し、αὐτοῦが問いに該当する人物を受けることを「自分の」で示した。
- source_word: ἐκ τῆς καλῆς ἀναστροφῆς
  choice: 立派な生き方によって
  rationale: ἀναστροφήが一時的な振る舞いだけでなく日常の行状・生活態度を指す広がりを「生き方」で表し、ἐκの源・手段的関係を「によって」で示した。
- source_word: ἐν πραΰτητι σοφίας
  choice: 知恵に伴う柔和さをもって
  rationale: πραΰτηςを単なる穏やかさではなく、抑制された謙和な徳として「柔和さ」と訳した。属格σοφίαςは複数の解釈が可能なため、知恵に特徴づけられる柔和さという自然な理解を本文に置き、別解を注記した。
theological_decisions:
- issue: 男性単数形の命令と代表的用法
  choice: その人は……示しなさい
  alternative: そのような人は……示すべきです
  rationale: ギリシア語は男性単数形だが、共同体内で条件に当てはまる人物を代表的に指す。日本語には文法上の性がないため、不必要に「彼」とせず、単数性と代表性を「その人」で保った。
- issue: 「知恵の柔和さ」という属格の関係
  choice: 知恵に伴う柔和さ
  alternative: 知恵から生まれる柔和さ／知恵ある柔和さ
  rationale: σοφίαςは源、性質、帰属などの含みを持ち得る。本文では関係を過度に限定しない「伴う」を用い、起源を明示する理解を脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、勧告の厳粛さを保った。「知恵があり、物事をわきまえている」は知的能力だけでなく実践的識見を表し、「柔和さ」は聖書的な徳の語感を保つ。脚注記号[a]は対応箇所の文末に配置した。
