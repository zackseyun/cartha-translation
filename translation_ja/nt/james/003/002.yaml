id: JAS.3.2
reference: James 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: πολλὰ γὰρ πταίομεν ἅπαντες. εἴ τις ἐν λόγῳ οὐ πταίει, οὗτος τέλειος ἀνήρ, δυνατὸς χαλιναγωγῆσαι καὶ ὅλον τὸ σῶμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/002.yaml
  text: For we all stumble in many ways[a]. If anyone does not stumble in word, this one is a mature man[c][b], able also to bridle the whole body.
translation:
  language: ja
  text: 私たちは皆、多くの点でつまずくのです。だれでも、言葉で[a]つまずかないなら、その人は成熟した人[b][c]であり、全身をもくつわで制御できます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「言葉において」。ここでは、話すこと、すなわち口にする言葉を指す。
    reason: lexical_alternative
  - marker: b
    text: 「完全な」または「欠けのない」とも訳せる。ここでは、絶対に罪を犯さないというより、人格的・倫理的に円熟していることを指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: 原文は「男」を表す語を用いているが、ここでは一般的な人を代表する言い方として用いられている。
    reason: cultural_note
lexical_decisions:
- source_word: πολλὰ
  choice: 多くの点で
  rationale: 中性複数対格が副詞的に用いられ、「多くの事柄を」ではなく「多くの面で」を意味する。失敗がさまざまな領域に及ぶことを自然な日本語で表した。
- source_word: γὰρ
  choice: からです
  rationale: 直前の教師への警告の根拠を示す接続語であるため、文末表現によって説明・理由の関係を明確にした。
- source_word: πταίομεν / πταίει
  choice: つまずく
  rationale: 歩行上のつまずきを倫理的失敗に重ねる比喩を保持した。「罪を犯す」と限定せず、原語の幅を残す。
- source_word: ἅπαντες
  choice: 私たちは皆
  rationale: 著者自身を含む強調された包括的主語をそのまま表した。
- source_word: εἴ τις
  choice: 人がいるなら
  rationale: 不特定の人物についての一般的な条件を、自然な日本語の条件文で表した。
- source_word: ἐν λόγῳ
  choice: 言葉で
  rationale: ここでの λόγος は発言・語ることを指す。簡潔な表現を本文に置き、意味を脚注で明示した。
- source_word: οὗτος
  choice: その人
  rationale: 直前に仮定された人物を指し示す指示的な力を、自然な日本語で保持した。
- source_word: τέλειος
  choice: 成熟した
  rationale: 絶対的な無罪性よりも、人格の完成・円熟を表す倫理的文脈に合う。原語が持つ「完全な」「欠けのない」という可能性は脚注に残した。
- source_word: ἀνήρ
  choice: 人
  rationale: 原語は男性を表す名詞だが、ここでは一般命題の中で代表的に用いられている。日本語本文では一般的適用が自然に伝わる「人」とし、原語の形は脚注で示した。
- source_word: δυνατὸς
  choice: ことができます
  rationale: 能力・可能性を直接かつ明瞭に表した。
- source_word: χαλιναγωγῆσαι
  choice: くつわをかける
  rationale: 単に「制御する」とせず、続く馬とくつわの比喩につながる原語の具体的イメージを保持した。
- source_word: καὶ
  choice: にも
  rationale: 言葉を御することに加えて全身をも御せるという付加の意味を、日本語の助詞で自然に示した。
theological_decisions:
- issue: 倫理的文脈における τέλειος の意味
  choice: 「成熟した」と訳す
  alternative: 「完全な」「欠けのない」と訳す
  rationale: ヤコブ書では人格的・倫理的な完成や円熟を指し得る語であり、直前の「私たちは皆……つまずく」との緊張関係からも、現代日本語の「完全な」が暗示しやすい絶対的無罪性を本文で断定しない。ただし原語の意味の広がりは脚注に保持した。
- issue: ἀνήρ の代表的男性形
  choice: 本文では一般的な「人」とし、男性名詞であることを脚注で示す
  alternative: 本文で「男」または「男性」とする
  rationale: 原語は男性単数名詞だが、εἴ τις による一般条件文の中で代表的に機能している。「男」とすると男性だけに限定する含意が日本語では強くなるため、一般的適用を本文で伝えつつ、原語の性別情報を脚注で失わないようにした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保つ文体とした。「つまずく」と「くつわをかける」により原文の比喩を保持し、「御する」のような日常語として難しい表現は避けた。
