  text: ⸂εἰ δὲ⸃ τῶν ἵππων τοὺς χαλινοὺς εἰς τὰ στόματα βάλλομεν ⸀εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν, καὶ ὅλον τὸ σῶμα αὐτῶν μετάγομεν.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/003.yaml
  text: If we put bits into the mouths of horses so that they obey us[a], we also guide their whole bodies.
translation:
  language: ja
  text: 馬が私たちに従うように、馬の口にくつわ[a]をかませるなら、私たちはその体全体をも導きます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「くつわ」は、ここでは特に馬の口にかませる部分を指す。この語は文脈によって、手綱などを含む馬具を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: なら
  rationale: 条件を表す εἰ を自然な日本語の「なら」で示した。δέ の弱い接続機能は文脈に委ね、原文にない時間的な「さて今」を加えなかった。
- source_word: χαλινοὺς
  choice: くつわ
  rationale: 馬の口に入れるものという文脈では、馬具全体よりも口にかませる部分を指す「くつわ」が最も的確である。
- source_word: εἰς τὰ στόματα βάλλομεν
  choice: その口に…をはめる
  rationale: εἰς の方向性と βάλλομεν の「置く、入れる」を、馬具について自然な日本語となるよう「口に…をはめる」とした。複数の馬それぞれの口を「その口」と分配的に表現した。
- source_word: εἰς τὸ πείθεσθαι αὐτοὺς ἡμῖν
  choice: 馬が私たちに従うように
  rationale: 目的または結果を表す構文を「ように」で保ち、πείθεσθαι と与格 ἡμῖν を「私たちに従う」と訳した。
- source_word: ὅλον τὸ σῶμα αὐτῶν
  choice: その全身をも
  rationale: 各々の馬の体全体を指す分配的な単数として、簡潔な「その全身」を用いた。καί は「も」で表した。
- source_word: μετάγομεν
  choice: 思いどおりに動かします
  rationale: 小さなくつわによって馬の体全体の進む向きを制御する意味を、現代日本語で明瞭に表した。「導く」より身体的な方向操作が伝わる。
