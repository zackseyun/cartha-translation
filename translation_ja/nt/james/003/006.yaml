id: JAS.3.6
reference: James 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: καὶ ἡ γλῶσσα πῦρ, ὁ κόσμος τῆς ⸀ἀδικίας ἡ γλῶσσα καθίσταται ἐν τοῖς μέλεσιν ἡμῶν, ἡ σπιλοῦσα ὅλον τὸ σῶμα καὶ φλογίζουσα τὸν τροχὸν τῆς γενέσεως καὶ φλογιζομένη ὑπὸ τῆς γεέννης.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/006.yaml
  text: And the tongue is a fire. The tongue is set among our members as a world of unrighteousness, staining the whole body and setting on fire the wheel of birth, and being set on fire by Gehenna.
translation:
  language: ja
  text: 舌もまた火です。舌は、私たちの体の諸部分の中にあって、不義の世界となっています。それは全身を汚し[a]、生の車輪[b]を燃え上がらせ、自らもゲヘナ[c]によって燃やされます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「全身をけがし」。
    reason: lexical_alternative
  - marker: b
    text: 「生の車輪」は、「人生の歩み」または「生涯の循環」という意味にも取れる。
    reason: lexical_alternative
  - marker: c
    text: ゲヘナはギリシア語の語。伝統的には「地獄」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: γλῶσσα
  choice: 舌
  rationale: 文脈を通して身体器官としての比喩が具体的に用いられ、同時に換喩として言葉や発言を指すため、「舌」を保持した。
- source_word: πῦρ
  choice: 火
  rationale: 破壊力を表す直接的な比喩を、日本語で自然かつ簡潔に保持した。
- source_word: ὁ κόσμος τῆς ἀδικίας
  choice: 不義の世界
  rationale: 意味を「悪に満ちている」などと平板化せず、ギリシア語の鮮烈で難解な表現を保持した。ἀδικίαはここでは単なる社会的不正より広い道徳的悪を表すため、「不義」とした。
- source_word: καθίσταται ἐν τοῖς μέλεσιν ἡμῶν
  choice: 私たちの体の諸部分の中にあって、…となっています
  rationale: καθίσταταιが表す位置と状態の両面を、日本語として理解できる形で示した。「体の諸部分」はμέληの身体的意味を明確にする。
- source_word: σπιλοῦσα
  choice: 汚し
  rationale: 染みを付ける像と道徳的汚染の双方を自然な日本語で表す。より明示的な「けがし」も脚注に示した。
- source_word: ὅλον τὸ σῶμα
  choice: 全身
  rationale: ὅλονの全体性を簡潔で自然な日本語で表した。
- source_word: φλογίζουσα
  choice: 燃え上がらせ
  rationale: 舌が火であるという反復的な火のイメージと、能動的に発火させる働きを保持した。
- source_word: τὸν τροχὸν τῆς γενέσεως
  choice: 生の車輪
  rationale: 難解な原文の車輪の比喩を解消せず、γένεσιςを文脈上広く「生」として表した。解釈的に分かりやすい代案は脚注に置いた。
- source_word: φλογιζομένη
  choice: 自らも…燃やされます
  rationale: 受動形を明示し、舌が他を燃やす一方で、それ自体も別の源によって燃やされるという対照を保持した。
- source_word: ὑπὸ τῆς γεέννης
  choice: ゲヘナによって
  rationale: 原語の固有の歴史的・概念的表現を音写して保持し、より一般化された神学用語へ本文で置き換えることを避けた。
theological_decisions:
- issue: γέενναの訳し方
  choice: ゲヘナ
  alternative: 地獄
  rationale: ギリシア語が用いる固有の語を保持し、後代の体系的な含意を本文に過度に持ち込まないため。伝統的な訳語は脚注で示した。
- issue: τὸν τροχὸν τῆς γενέσεωςの解釈
  choice: 生の車輪
  alternative: 人生の歩み／生涯の循環
  rationale: この句の比喩的な難しさと解釈上の幅を保持し、本文で一つの説明的意味に限定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書本文としての品位を保った。原文の反復する火の比喩と「不義の世界」「生の車輪」という意図的に鮮烈で難解な表現を残し、説明的な読みは脚注に委ねた。
