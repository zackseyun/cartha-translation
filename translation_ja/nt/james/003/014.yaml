id: JAS.3.14
reference: James 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: εἰ δὲ ζῆλον πικρὸν ἔχετε καὶ ἐριθείαν ἐν τῇ καρδίᾳ ὑμῶν, μὴ κατακαυχᾶσθε καὶ ψεύδεσθε κατὰ τῆς ἀληθείας.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/014.yaml
  text: But if you have bitter jealousy and selfish ambition in your hearts[d][c][b][a], do not boast and lie against the truth.
translation:
  language: ja
  text: しかし、もしあなたがたの心に苦いねたみ[a]や利己的な野心[b]があるなら、誇ったり、真理に逆らって偽りを言ったりしてはなりません[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「苦い熱心」または「苦いねたみ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「対立心」または「党派心」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「真理に反して偽りを言ってはなりません」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῆλον πικρὸν
  choice: 苦々しいねたみ
  rationale: ζῆλοςには「熱心」「ねたみ」の両義があるが、ここではἐριθείαと並び否定的に語られているため、「ねたみ」が文脈に最も適する。πικρόνは「苦々しい」として、その破壊的な性質を保持した。
- source_word: ἐριθείαν
  choice: 利己的な野心
  rationale: 自己追求的な野心と、そこから生じる対立・党派心を表す語である。本文では内面的な動機を明瞭に示す「利己的な野心」とし、対立や党派心という含みは脚注に残した。
- source_word: ἐν τῇ καρδίᾳ ὑμῶν
  choice: あなたがたの心に
  rationale: καρδίᾳは単数形、ὑμῶνは複数形で、各人の心を指す配分的表現である。日本語では「あ​​なたがたの心に」が自然であり、集団への呼びかけと各人の内面の双方を表せる。
- source_word: μὴ κατακαυχᾶσθε
  choice: 誇ったり……してはなりません
  rationale: 動詞の基本的な意味である「誇る」を保った。後続の命令と「たり」で結び、ねたみや野心を抱きながら自己を誇るという文脈上の高慢さを自然に示した。
- source_word: ψεύδεσθε κατὰ τῆς ἀληθείας
  choice: 真理に逆らって偽ったり
  rationale: ψεύδεσθεの「偽る」と、κατά＋属格が示す対立を「真理に逆らって」で明示した。「真理」を単なる誠実さや特定の教理体系に限定しない表現である。
- source_word: εἰ δὲ
  choice: しかし、もし
  rationale: δέが前節までに描かれた上からの知恵との対照を示すため、「しかし」で転換を明確にし、εἰを「もし」で表した。
theological_decisions:
- issue: 「真理」の範囲
  choice: 限定せず「真理」と訳す
  alternative: 「福音の真理」「知恵の正しい道」「真実な言動」と限定する
  rationale: ἀλήθειαがこの箇所で指す範囲は明示されていない。神の真理、真の知恵、言動の真実性を含み得る広がりを保ち、特定の教理や単なる主観的誠実さに狭めなかった。
- issue: 二つの禁止命令の関係
  choice: 「誇ったり、真理に逆らって偽ったりしてはなりません」と並列する
  alternative: 「誇ることによって真理に逆らう偽りを語るな」と従属的に解釈する
  rationale: 原文には二つの命令形がκαίで結ばれているため、両者の密接な関係を示しつつ、一方を他方の手段や説明に限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令の厳粛さを保つため「してはなりません」とした。「ねたみ」「野心」「真理」は一般読者に理解しやすく、同時に原文の倫理的・神学的重みを保持する語である。
