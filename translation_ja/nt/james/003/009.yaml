id: JAS.3.9
reference: James 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: SBLGNT
  text: ἐν αὐτῇ εὐλογοῦμεν τὸν ⸀κύριον καὶ πατέρα, καὶ ἐν αὐτῇ καταρώμεθα τοὺς ἀνθρώπους τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/009.yaml
  text: With it we bless the Lord and Father[b][a], and with it we curse people who have been made according to the likeness of God.
translation:
  language: ja
  text: 私たちは、この舌で主であり、父である方[a]をほめたたえ、同じ舌で、神に似せて造られた人々を呪います。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「主と父」。この表現は、「主である父」あるいは「主、すなわち父」と理解することも、神を「主」と「父」という二つの呼び名で表したものと理解することもできます。
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: この舌で／同じ舌で
  rationale: 直前の文脈で言及された「舌」を指す。日本語では指示代名詞だけにせず対象を明示し、手段を表す「で」とした。後半では対照を明確にするため「同じ舌で」とした。
- source_word: εὐλογοῦμεν
  choice: ほめたたえ
  rationale: 神に向けられた εὐλογέω の意味を、現代日本語として自然に表す。「祝福する」よりも、ここでは神を賛美する行為であることが明瞭である。
- source_word: τὸν κύριον καὶ πατέρα
  choice: 主また父である方
  rationale: 「主」と「父」が同一の方を指す可能性を自然に示しつつ、二つの称号を残した。両語の関係に残る構文上の幅は脚注で示した。
- source_word: καταρώμεθα
  choice: 呪います
  rationale: 「ほめたたえる」との強い倫理的対照を保つ、直接的で自然な訳語である。
- source_word: τοὺς ἀνθρώπους
  choice: 人々
  rationale: ここでは男性だけでなく人間一般を指すため、包括的で自然な「人々」とした。
- source_word: τοὺς καθ’ ὁμοίωσιν θεοῦ γεγονότας
  choice: 神に似せて造られた
  rationale: 創造を想起させる表現として、καθ’ ὁμοίωσιν の対応・類似と、γεγονότας の成立した結果の状態を簡潔に表した。受動形により暗黙の創造者を過度に補わない。
theological_decisions:
- issue: 「主」と「父」の関係
  choice: 主また父である方
  alternative: 主と父／主、すなわち父
  rationale: ギリシア語は「主であり父である方」という同格的理解を許す一方、字面は二つの名詞を καί で結ぶ。本文では同一の神を指す自然な日本語とし、構文の幅を脚注に残した。
- issue: 人間一般を指す ἀνθρώπους
  choice: 人々
  alternative: 人間たち／男たち
  rationale: 神に似せて造られた人類一般が対象であり、男性に限定しない訳語を選んだ。
- issue: 神の「似姿」に造られたという表現
  choice: 神に似せて造られた
  alternative: 神の似姿に従って生じた
  rationale: 創造への言及を自然に伝えながら、「神に等しい」といった意味に強めず、類似・対応を表す原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、前半と後半の「同じ舌」による鋭い対照を保った。「ほめたたえ」と「呪います」は日常的に理解できつつ、聖書本文にふさわしい格調を持つ表現とした。
