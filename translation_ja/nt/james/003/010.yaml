  text: ἐκ τοῦ αὐτοῦ στόματος ἐξέρχεται εὐλογία καὶ κατάρα. οὐ χρή, ἀδελφοί μου, ταῦτα οὕτως γίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/010.yaml
  text: From the same mouth come blessing and cursing. My brothers[a], these things ought not to be so.
translation:
  language: ja
  text: 同じ口から、祝福とのろいが出ます。私の兄弟たち[a]、このようなことがあってはなりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の兄弟姉妹たち」。ギリシア語は「兄弟たち」だが、文脈上、ヤコブは信仰者の共同体全体に呼びかけていると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ αὐτοῦ στόματος
  choice: 同じ口から
  rationale: 発言が一つの源から出るという原文の比喩を、簡潔で自然な日本語のまま保つ。
- source_word: ἐξέρχεται
  choice: 出て来ます
  rationale: 口から言葉が発せられる像を保ちつつ、現代日本語として理解しやすく訳す。ギリシア語では単数形だが、二つの並列された主語を受けている。
- source_word: εὐλογία καὶ κατάρα
  choice: 祝福とのろい
  rationale: 発話としての祝福とのろいの対照を直接的に示す。「のろい」は読みやすさを優先して平仮名とした。
- source_word: οὐ χρή
  choice: あってはなりません
  rationale: 単なる勧告よりも強い、道徳的に不適切であって容認されないという意味を自然に表す。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち[a]
  rationale: 男性複数形である原文の形を本文に反映しつつ、共同体全体を指す可能性を脚注に残す。
- source_word: ταῦτα οὕτως γίνεσθαι
  choice: このようなことがあってはなりません
  rationale: ταῦτα と οὕτως を日本語で自然にまとめ、「このようなこと」とし、事態がそのように生じることへの否定を明確にする。
theological_decisions:
- issue: ἀδελφοί μου の性別を伴う共同体的呼びかけ
  choice: 私の兄弟たち
  alternative: 私の兄弟姉妹たち
  rationale: 原文の男性複数形を本文で保持する。一方、ヤコブが信仰共同体全体に語りかけている可能性が高いため、包括的な意味は脚注で明示する。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい端正さを保った。「祝福」と「のろい」の鋭い対照、および同じ口から双方が出るという原文の修辞を維持した。
