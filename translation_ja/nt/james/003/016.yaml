source:
  edition: SBLGNT
  text: ὅπου γὰρ ζῆλος καὶ ἐριθεία, ἐκεῖ ἀκαταστασία καὶ πᾶν φαῦλον πρᾶγμα.
base_translation:
  language: en
  yaml_path: translation/nt/james/003/016.yaml
  text: For where jealousy and selfish ambition are[b][a], there is disorder and every vile practice.
translation:
  language: ja
  text: というのも、ねたみ[a]や利己的な野心のあるところには、混乱とあらゆる悪い行い[b]があります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「嫉妬」とも訳せる。ギリシア語は「熱心」を意味することもあるが、ここでは文脈上、否定的な意味である。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あらゆる邪悪な事柄」。直訳は「あらゆる卑しい事柄」。
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου
  choice: あるところには
  rationale: ἐκεῖとの対応を保ちつつ、一般的な条件・状況を表す自然な日本語とした。
- source_word: γὰρ
  choice: というのも…からです
  rationale: 前節の説明を導く接続関係を、日本語として自然な呼応表現で示した。
- source_word: ζῆλος
  choice: ねたみ
  rationale: 直前の3章14節と地上的な知恵を論じる文脈では否定的な感情を指す。「熱心」という中立・肯定的な意味を避け、現代日本語で明瞭な「ねたみ」とした。
- source_word: ἐριθεία
  choice: 利己的な野心
  rationale: 自己の利益や地位を求める対立的な自己追求を表す語として、動機と社会的影響の両面を伝える。
- source_word: ἐκεῖ
  choice: には
  rationale: ὅπουと対応する「ところには」の形に組み込み、ギリシア語の「そこに」という相関構造を自然な日本語で保った。
- source_word: ἀκαταστασία
  choice: 混乱
  rationale: 単なる心の迷いではなく、共同体に生じる無秩序や騒乱を含む語であり、日本語では「混乱」が簡潔で自然である。
- source_word: πᾶν
  choice: あらゆる
  rationale: 個々の種類を包括する意味を保ち、単数句を自然な日本語にした。
- source_word: φαῦλον
  choice: 悪い
  rationale: 道徳的に卑しく邪悪であるという否定的評価を、平明な現代日本語で表した。より強い「邪悪な」や直訳的な「卑しい」も可能なため脚注で補った。
- source_word: πρᾶγμα
  choice: 行い
  rationale: 直訳では「事柄・もの」だが、悪徳を扱う文脈では具体的な悪い行為を指す「行い」が自然である。
theological_decisions:
- issue: ζῆλοςの道徳的意味
  choice: 否定的な悪徳として「ねたみ」
  alternative: 中立的・肯定的な「熱心」、または「嫉妬」
  rationale: 3章14–15節の「苦いねたみ」と利己的な野心、および地上的な知恵についての議論により、ここでは否定的意味が明白である。ただし語自体の意味範囲は脚注で示した。
- issue: πᾶν φαῦλον πρᾶγμαの具体性
  choice: あらゆる悪い行い
  alternative: あらゆる邪悪な事柄／あらゆる卑しいこと
  rationale: 原文の広い表現を過度に特定の罪へ限定せず、同時に悪徳の実際的な結果を自然な日本語で表した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。原文の「ὅπου…ἐκεῖ…」という相関構造は「あるところには」で簡潔に再現し、γὰρの説明的機能は「というのも…からです」で明示した。
