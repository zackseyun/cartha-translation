source:
  edition: SBLGNT
  text: Μὴ πολλοὶ διδάσκαλοι γίνεσθε, ἀδελφοί μου, εἰδότες ὅτι μεῖζον κρίμα λημψόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/james/003/001.yaml
  text: Not many of you should become teachers[a], my brothers, knowing that we will receive a greater judgment.
translation:
  language: ja
  text: 私の兄弟たち[a]、あなたがたのうち多くの人が教師になってはいけません。私たちがより厳しい裁きを受けることを知っているのですから。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「兄弟たち」は、女性を含む共同体全体への呼びかけである可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ πολλοὶ
  choice: あなたがたのうち、多くの人が……になってはいけません
  rationale: μήと現在命令形による禁止・勧告の力を、現代日本語で明確に表した。「あなたがたのうち」は二人称複数の呼びかけを自然に補う。
- source_word: διδάσκαλοι
  choice: 教師
  rationale: 教える者を指す一般的な語であり、本文が明示しない特定の役職制度を持ち込まない。
- source_word: γίνεσθε
  choice: なってはいけません
  rationale: γίνομαιの「なる」という変化の意味と、μήによる禁止を合わせて表し、教師という立場に就くことへの警告を示す。
- source_word: ἀδελφοί μου
  choice: 私の兄弟たち[a]
  rationale: 語形上の男性複数を本文に残しつつ、共同体全体を指す可能性は脚注で示した。
- source_word: εἰδότες
  choice: 知っているからです
  rationale: 分詞が勧告の根拠を示す文脈上の働きを、自然な日本語で表した。
- source_word: μεῖζον
  choice: より厳しい
  rationale: 比較級の「より大きい」という意味を、裁きとの結びつきに即して自然に表した。裁きの重大さ・厳格さが増すという警告を伝える。
- source_word: κρίμα
  choice: 裁き
  rationale: 有罪判決や最終的な断罪に意味を限定せず、評価・判決を含み得る原語の幅を保つ。
- source_word: λημψόμεθα
  choice: 私たちが……受ける
  rationale: 一人称複数と未来の意味を保持し、著者自身も教師への警告に含めている表現をそのまま示す。
theological_decisions:
- issue: ἀδελφοί μουが指す範囲
  choice: 本文では「私の兄弟たち」とし、共同体の女性も含む可能性を脚注に記す。
  alternative: 「私の兄弟姉妹たち」
  rationale: 原語の男性複数形を見える形で保ちながら、初期キリスト教共同体全体への呼びかけである可能性も失わないため。
- issue: 教師が受けるκρίμαの性質
  choice: 「より厳しい裁き」
  alternative: 「より重い断罪」または「より大きな裁き」
  rationale: 教師の責任がより厳しく問われるという比較の力を表しつつ、それが必ず最終的な断罪を意味すると限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「なってはいけません」で勧告的な禁止を平易に示し、「裁き」は神学的意味を過度に限定しない語として用いた。
