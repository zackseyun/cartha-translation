  text: וָ/אֵ֖רֶא בַּ/חֲלֹמִ֑/י וְ/הִנֵּ֣ה שֶׁ֣בַע שִׁבֳּלִ֗ים עֹלֹ֛ת בְּ/קָנֶ֥ה אֶחָ֖ד מְלֵאֹ֥ת וְ/טֹבֽוֹת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/022.yaml
  text: And I saw in my dream[a], and behold, seven ears of grain were coming up on one stalk, full and good.
translation:
  language: ja
  text: 私は夢の中で見た。見ると、一本の茎に七つの穂が生えていた。それらは実が詰まり、よく育った穂だった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֵרֶא
  choice: 私は……見た
  rationale: ראהのQal未完了形ワウ継続法で、ファラオの一人称による夢の叙述を進める。日本語では単純過去が自然である。
- source_word: בַּחֲלֹמִי
  choice: 夢の中で
  rationale: 前置詞בと一人称単数接尾辞を伴うחֲלוֹםを、自然かつ直接的に表した。
- source_word: וְהִנֵּה
  choice: すると、なんと
  rationale: 目の前に現れた光景を生き生きと提示するהִנֵּהの働きを保ちつつ、現代日本語として過度に古風にならない表現を選んだ。
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: 七つの穂
  rationale: שִׁבֹּלֶתはここでは穀物の穂を指す。文脈上明瞭なので、簡潔で自然な「穂」とした。
- source_word: עֹלֹת
  choice: 伸び出ていた
  rationale: 女性複数分詞が示す、夢の中で進行中の生き生きとした動きを反映した。穂が茎から生じる農作物の情景にも適する。
- source_word: בְּקָנֶה אֶחָד
  choice: 一本の茎から
  rationale: קָנֶהはここでは穀物の茎を指す。בは位置・結びつきを表しうるが、日本語では複数の穂が同じ茎から伸びるという像を自然に示すため「から」とした。
- source_word: מְלֵאֹת
  choice: 実が詰まっていて
  rationale: 字義は「満ちた」だが、穀物の穂についての日本語として意味が明瞭になるよう表現した。
- source_word: וְטֹבוֹת
  choice: 良い穂だった
  rationale: טוֹבの広い意味を狭めすぎず、穂の好ましい状態・品質を表す「良い」を保持した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、夢の光景を鮮明に提示するהִנֵּהと、分詞による進行的な描写を残した。「見た。すると、なんと」と区切り、ヘブライ語の叙述の勢いを日本語として自然に再現した。
