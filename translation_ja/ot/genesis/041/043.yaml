base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/043.yaml
  text: He had him ride in the second chariot that he had[a], and they cried out before him, “Abrek!” And he set him over all the land of Egypt.
translation:
  language: ja
  text: ファラオはヨセフを、ファラオが持つ第二の戦車に乗せた。人々は彼の前で「アブレク！」[a]と叫んだ。こうしてファラオは彼をエジプト全土を治める者とした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アブレク」は意味の確定が難しい語で、エジプト語またはヘブライ語の歓呼だった可能性があります。「ひざまずけ」のような意味とする解釈もあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכֵּב אֹתוֹ
  choice: ファラオはヨセフを…乗せた
  rationale: 使役形の意味を自然な日本語の「乗せた」で表した。日本語で指示対象が曖昧になるのを避けるため、文脈上の主語と目的語を明示した。
- source_word: בְּמִרְכֶּבֶת הַמִּשְׁנֶה אֲשֶׁר־לוֹ
  choice: 自分の持つ第二の戦車に
  rationale: מִשְׁנֶה の「第二位・次席」の意味と、所有を示す関係節を保った。「第二の戦車」はファラオ自身の戦車に次ぐ格式の戦車を指すと考えられるが、本文では説明を加えすぎない。
- source_word: וַיִּקְרְאוּ לְפָנָיו
  choice: 人々は彼の前で…と叫んだ
  rationale: קרא の公的な呼び声を「叫んだ」で表し、לְפָנָיו の空間的・行列的含意を「彼の前で」として保持した。
- source_word: אַבְרֵךְ
  choice: アブレク
  rationale: 語義が不確かで、エジプト語由来の歓呼またはヘブライ語としての命令とも解されるため、本文では音写し、推定される意味を脚注に示した。
- source_word: וְנָתוֹ אֹתוֹ
  choice: こうしてファラオは彼を…立てた
  rationale: 不定詞絶対形による叙述を、文脈上の帰結を示す自然な日本語で表した。「立てた」は任命・権威付与の意味を保つ。
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: エジプト全土の上に
  rationale: עַל の統治権・権威の含意を「上に」で保持し、אֶרֶץ の領域性を「全土」とした。
