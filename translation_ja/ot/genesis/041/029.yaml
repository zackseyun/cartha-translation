  text: 見よ、エジプト全土に、大いなる豊かさに満ちた七年が訪れる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 見よ
  rationale: 聞き手の注意を喚起し、目前に迫る事柄を鮮明に示す語。現代日本語でも聖書の荘重な語り口として理解できる「見よ」を用いた。
- source_word: שֶׁבַע שָׁנִים
  choice: 七年
  rationale: 期間を表す簡明な数詞表現として、そのまま訳した。
- source_word: בָּאוֹת
  choice: やって来る
  rationale: 「年々」と文法的に呼応する女性複数分詞で、将来の到来を生き生きと描く。「来る」よりも到来の動きを明確にした。
- source_word: שָׂבָע גָּדוֹל
  choice: 大豊作
  rationale: 直訳は「大いなる豊かさ」だが、この文脈では農産物・食糧が潤沢になることを指すため、自然で具体的な「大豊作」とした。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土に
  rationale: エジプトの領域全体に及ぶことを、簡潔で自然な現代日本語で表した。
