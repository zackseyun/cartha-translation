  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת יְפ֥וֹת מַרְאֶ֖ה וּ/בְרִיאֹ֣ת בָּשָׂ֑ר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/002.yaml
  text: And behold[a], seven cows were coming up from the Nile, beautiful in appearance and fat in flesh[c][b], and they were grazing in the reed grass.
translation:
  language: ja
  text: 見ると、ナイル川[a]から、姿が美しく肉づきがよい七頭の雌牛が上がってきて、葦の生える草地[b]で草を食べていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「川」。エジプトの文脈ではナイル川を指す。
    reason: lexical_alternative
  - marker: b
    text: または「湿地の草むらで」「葦の間で」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: すると、なんと
  rationale: 夢の光景へ注意を向ける生き生きとした談話標識を、現代日本語で自然に表した。「見よ」より平明だが、驚きと即時性を保っている。
- source_word: הַיְאֹר
  choice: ナイル川
  rationale: 語自体は「川」を意味し得るが、エジプトを舞台とするこの文脈ではナイル川を指すため、本文で明示した。
- source_word: עֹלֹת
  choice: 上がって来て
  rationale: 分詞が描く進行中の動きを自然な日本語で表し、川から岸へ現れる光景を保持した。
- source_word: פָּרוֹת
  choice: 雌牛
  rationale: 女性形の名詞が示す雌の牛を明確にした。「牛」だけより原文に即し、「未経産牛」ほど限定的ではない。
- source_word: יְפוֹת מַרְאֶה
  choice: 姿が美しく
  rationale: 外見の美しさを表す句を、明瞭で自然な現代日本語にした。
- source_word: וּבְרִיאֹת בָּשָׂר
  choice: 肉づきのよい
  rationale: 単なる健康状態ではなく、肉が豊かについている身体的な充実を自然に表した。
- source_word: וַתִּרְעֶינָה
  choice: 草を食べていた
  rationale: 放牧されて草を食べる動作を、夢の継続的な光景として自然に描写した。
- source_word: בָּאָחוּ
  choice: 葦の茂みで
  rationale: ナイル川沿いの湿地性の草や葦が生える場所を指す語として、情景が伝わる表現を選んだ。
theological_decisions: []
