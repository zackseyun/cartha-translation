  text: וְ/הָ/רָעָ֣ב הָיָ֔ה עַ֖ל כָּל פְּנֵ֣י הָ/אָ֑רֶץ וַ/יִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת כָּל אֲשֶׁ֤ר בָּ/הֶם֙ וַ/יִּשְׁבֹּ֣ר לְ/מִצְרַ֔יִם וַ/יֶּחֱזַ֥ק הָֽ/רָעָ֖ב בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/056.yaml
  text: And the famine was over all the face of the earth[a], and Joseph opened all that was in them and sold grain to Egypt[b], and the famine grew severe in the land of Egypt.
translation:
  language: ja
  text: 飢饉は全地に及んだ[a]。ヨセフはすべての貯蔵所を開き[b]、エジプト人に穀物を売った。飢饉はエジプトの地でますます激しくなった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全地」は「その土地全体」とも訳せる。ヘブライ語は直訳すると「地の全面に」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は、何を開いたのかを省略した表現で、字義的には「その中にあるすべてを開いた」となる。「その中」の先行詞は明示されていないが、文脈上、穀物を蓄えた貯蔵所を指す。
    reason: implicit_object
lexical_decisions:
- source_word: הָרָעָב
  choice: 飢饉
  rationale: 深刻かつ広域の食糧不足を表す文脈なので、「飢え」ではなく「飢饉」が適切である。
- source_word: עַל כָּל פְּנֵי הָאָרֶץ
  choice: 全地に
  rationale: 「地の全面に」というヘブライ語の空間的な慣用表現を、自然な日本語で簡潔に表した。הָאָרֶץ は「地」「土地」のどちらにも取り得るため、範囲の曖昧さは脚注に示した。
- source_word: וַיִּפְתַּח ... אֶת כָּל אֲשֶׁר בָּהֶם
  choice: すべての貯蔵所を開き
  rationale: 原文は字義的には「その中にあるすべてを開いた」という省略的な表現で、収納施設が明示されていない。本文では文脈上の意味を明瞭にし、原文の省略は脚注で保存した。
- source_word: וַיִּשְׁבֹּר לְמִצְרַיִם
  choice: エジプト人に穀物を売った
  rationale: שׁבר はこの文脈で穀物・食糧を売ることを表す慣用語である。「穀物」を補い、集合的な מִצְרַיִם を自然な日本語で「エジプト人」とした。
- source_word: וַיֶּחֱזַק
  choice: ますます激しくなった
  rationale: 字義は「強くなった」だが、主語が飢饉なので、その深刻化を自然な日本語で表した。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地で
  rationale: 原文の「エジプトの地で」を保ち、創世記の叙述にふさわしい簡潔で格調ある表現とした。
