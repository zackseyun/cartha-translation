source:
  edition: WLC
  text: אַתָּה֙ תִּהְיֶ֣ה עַל בֵּיתִ֔/י וְ/עַל פִּ֖י/ךָ יִשַּׁ֣ק כָּל עַמִּ֑/י רַ֥ק הַ/כִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/040.yaml
  text: You shall be over my house[a], and all my people shall obey your command. Only with respect to the throne will I be greater than you.
translation:
  language: ja
  text: あなたはわたしの家を治め、わたしの民は皆、あなたの命令に従う[a]。ただ王座においてのみ、わたしはあなたより上に立つ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に、「あなたの口に、わたしの民は皆口づけする」。ここでは一般に、ヨセフの命令に従う、または敬意を表して服するという意味に理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל בֵּיתִי
  choice: わたしの家を治め
  rationale: 前置詞 עַל はここでは権限・監督を表す。「家」を残しつつ、ヨセフがファラオの家政・宮廷を統轄する意味が自然に伝わるよう「治める」とした。
- source_word: וְעַל־פִּיךָ יִשַּׁק כָּל־עַמִּי
  choice: わたしの民は皆、あなたの命令に従う
  rationale: 直訳的には「あなたの口に、わたしの民は皆口づけする」だが、文脈ではヨセフの言葉・指示に服することを表す慣用的な言い回しと判断した。字義と解釈上の幅は脚注に残した。
- source_word: כָּל עַמִּי
  choice: わたしの民は皆
  rationale: עַם の集合的意味を明瞭で自然な現代日本語にした。
- source_word: רַק הַכִּסֵּא
  choice: ただ王座においてのみ
  rationale: רַק の限定・例外の働きを「ただ……のみ」で示し、כִּסֵּא は王としての地位を示す「王座」とした。
- source_word: אֶגְדַּל מִמֶּךָּ
  choice: わたしはあなたより上に立つ
  rationale: גדל と比較の מן が表す優越を、人格的な偉大さではなく地位上の優越として自然に理解できる表現にした。
theological_decisions: []
translation_notes:
  register: ファラオによる権限委譲の宣言として、簡潔で威厳のある現代標準語を用いた。「家」「王座」という原文の具体的な語を保ちつつ、字義訳では意味が不明瞭になる慣用表現のみ本文で明確化し、原文の像は脚注に示した。
