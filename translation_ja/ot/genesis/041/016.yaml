reference: Genesis 41:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֨עַן יוֹסֵ֧ף אֶת פַּרְעֹ֛ה לֵ/אמֹ֖ר בִּלְעָדָ֑/י אֱלֹהִ֕ים יַעֲנֶ֖ה אֶת שְׁל֥וֹם פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/016.yaml
  text: Joseph answered Pharaoh[a], saying, “It is not in me[b]; God will answer for Pharaoh’s well-being.”
translation:
  language: ja
  text: ヨセフはファラオに答えた。「私ではありません。神がファラオに平安をもたらす答えをお与えになります。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 答えた
  rationale: 物語において直接話法を導く ענה の通常の用法を、自然な現代日本語で表した。
- source_word: בִּלְעָדָי
  choice: 私ではありません
  rationale: ヨセフ自身が答えや解き明かしの源ではないという排除と対比を、簡潔で自然な日本語にした。「私のうちにはありません」よりも明瞭である。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数動詞を伴い、ここではヨセフが答えの源として告白する神を指す。
- source_word: יַעֲנֶה
  choice: 答えをお与えになります
  rationale: 直訳は「答える」だが、目的語 שְׁלוֹם פַּרְעֹה とのヘブライ語的な結びつきを日本語で自然に示すため「答えを与える」とした。神に対する敬意を自然な敬語で表した。
- source_word: שְׁלוֹם פַּרְעֹה
  choice: ファラオに平安をもたらす答え
  rationale: שָׁלוֹם の「平安・無事・好ましい結果」という幅を保ち、神の答えがファラオの安寧に関わることを表す。単に「良い答え」として結果を断定しすぎない。
theological_decisions:
- issue: 夢の解き明かしの源
  choice: 「私ではありません。神が…」として、ヨセフと神を明確に対比した。
  alternative: 「私の力によるのではありません」
  rationale: בִּלְעָדָי と「神が答える」の対比を保ち、解き明かしの能力がヨセフ自身に由来しないことを示す一方、本文にない教理的説明は加えない。
- issue: שְׁלוֹם が示す答えの性質
  choice: 「平安をもたらす答え」
  alternative: 「無事についての答え」または「良い答え」
  rationale: 「平安」「安寧」「好ましい結果」という語義の広がりを保つ。「良い答え」だけでは、後に告げられる飢饉との緊張を過度に解消しかねない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。לֵאמֹר は日本語では引用符で十分に示されるため、冗長な「言って」を置かなかった。「ファラオ」は固有の称号として定着した表記を採用した。
