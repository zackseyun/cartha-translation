id: GEN.41.17
reference: Genesis 41:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְדַבֵּ֥ר פַּרְעֹ֖ה אֶל יוֹסֵ֑ף בַּ/חֲלֹמִ֕/י הִנְ/נִ֥י עֹמֵ֖ד עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/017.yaml
  text: Then Pharaoh said to Joseph[a], “In my dream, behold, I was standing on the bank of the Nile.”
translation:
  language: ja
  text: そこでファラオはヨセフに言った。「夢の中で、見ると、私はナイル川[a]の岸に立っていた。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「川」。創世記のエジプトを舞台とする文脈では、この語は通常ナイル川を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 言った
  rationale: 形式的には「語った」だが、直接話法を導く日本語の物語文では「言った」が自然で、発話機能を正確に表す。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として、日本語聖書で広く定着した音写を用いた。
- source_word: אֶל יוֹסֵף
  choice: ヨセフに
  rationale: 前置詞 אֶל は発話の相手を示すため、日本語では助詞「に」で自然に表した。
- source_word: בַּחֲלֹמִי
  choice: 夢の中で
  rationale: 前置詞 ב と一人称単数接尾辞を反映しつつ、ファラオが自分の夢の場面を語り始める自然な表現とした。
- source_word: הִנְנִי
  choice: 見ると、私は
  rationale: 現前提示の小辞がもつ、夢の光景を生き生きと示す働きを「見ると」で表した。「見よ」では自己の夢を語る現代日本語として硬すぎるため避けた。
- source_word: עֹמֵד
  choice: 立っていた
  rationale: 「立つ」を意味する分詞を、過去の夢を回想する文脈に合わせて継続状態として表した。
- source_word: עַל שְׂפַת
  choice: 岸に
  rationale: שָׂפָה は字義的には「唇、縁」だが、川との組み合わせでは「岸」を指す。עַל はこの日本語表現では位置を示す「に」が自然である。
- source_word: הַיְאֹר
  choice: ナイル川
  rationale: 語自体は「川」とも訳せるが、創世記のエジプトという文脈では通常ナイル川を指す。本文では指示対象を明確にし、字義的な選択肢を脚注に残した。
