  yaml_path: translation/ot/genesis/041/049.yaml
  text: And Yoseph stored up grain[a], like the sand of the sea, in very great abundance, until he stopped counting[c][b], because there was no number.
translation:
  language: ja
  text: ヨセフは、海の砂のように非常に多くの穀物を蓄え、ついには数えるのをやめた。数えきれないほどだったからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְבֹּר
  choice: 蓄えた
  rationale: צברは積み上げ、蓄積することを表す。豊作の年の穀物を保管する文脈に即して「蓄えた」とした。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 現代日本語の聖書で広く認知され、ヘブライ語名にも近い慣用表記を用いた。
- source_word: בָּר
  choice: 穀物
  rationale: 特定の麦類に限定されない穀類一般を指すため、「穀物」とした。
- source_word: כְּחוֹל הַיָּם
  choice: 海の砂のように
  rationale: 莫大な量を示すヘブライ語の比喩を、その聖書的なイメージを保って自然な日本語にした。
- source_word: הַרְבֵּה מְאֹד
  choice: 非常に多く
  rationale: 量の大きさを重ねて強調する表現として、簡潔かつ明瞭に訳した。
- source_word: עַד כִּי
  choice: ついには
  rationale: 蓄積が達した結果・限界を自然な日本語で示した。
- source_word: חָדַל לִסְפֹּר
  choice: 数えるのをやめた
  rationale: 主語は直前のヨセフと取るのが自然であり、動作の中止を現代語で明確に表した。
- source_word: כִּי אֵין מִסְפָּר
  choice: それは数えきれなかったからである
  rationale: 字義的には「数がない」だが、ここでは数量が計数不能なほど多いという慣用的意味を明瞭に表した。
