base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/055.yaml
  text: And all the land of Egypt became hungry[a], and the people cried out to Pharaoh for bread. Pharaoh said to all Egypt, “Go to Joseph. What he says to you, do.”
translation:
  language: ja
  text: エジプト全土が飢えるようになると、民はパンを求めてファラオに叫んだ。ファラオはエジプトのすべての人に言った。「ヨセフのところへ行きなさい。彼があなたがたに言うとおりにしなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּרְעַב
  choice: 飢えに苦しむようになると
  rationale: רעבの、飢えが生じて経験されるという動的な意味と、続く民の訴えへの時間的な流れを表す。
- source_word: כָּל אֶרֶץ מִצְרַיִם
  choice: エジプト全土
  rationale: 「エジプトの全地」という構造を、明瞭で自然な現代日本語にした。
- source_word: וַיִּצְעַק הָעָם
  choice: 民は…叫び求めた
  rationale: צעקが表す、苦境の中から助けを求める切迫した叫びを簡潔に伝える。
- source_word: לַלָּחֶם
  choice: 食べ物を求めて
  rationale: לֶחֶםの字義は「パン」だが、古代の文脈では主食・食糧を指しうるため、日本語で誤解の少ない文脈上の意味を採った。
- source_word: לְכָל מִצְרַיִם
  choice: 全エジプトに
  rationale: 地名を集合的に用いる原文の表現を保った。文脈上、エジプトの住民全体への言葉として理解できる。
- source_word: לְכוּ אֶל יוֹסֵף
  choice: ヨセフのところへ行き
  rationale: 命令形と前置詞の意味を自然に表し、人名は日本語聖書で定着した「ヨセフ」とした。
- source_word: אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ
  choice: 彼があなたがたに言うとおりにしなさい
  rationale: 原文の「彼があなたがたに言うことを行え」という命令を、強調を損なわず自然な現代日本語で表した。
