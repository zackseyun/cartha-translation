base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/050.yaml
  text: Before the year of famine came[a], two sons were born to Joseph, whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: ja
  text: 飢饉の年が来る前に[a]、ヨセフに二人の息子が生まれた。二人は、オンの祭司ポティ・フェラの娘アセナトがヨセフに産んだ子であった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文ではここで「年」が単数形で用いられており、飢饉の時期の始まりを指している。
    reason: lexical_alternative
  - marker: b
    text: オンはエジプトの都市で、後にギリシア語でヘリオポリスと呼ばれた。
    reason: cultural_note
lexical_decisions:
- source_word: יֻלַּד
  choice: 生まれた
  rationale: 受動形と複数主語「二人の息子」を、日本語で自然な出生表現「生まれた」とした。
- source_word: וּ/לְ/יוֹסֵף
  choice: ヨセフに
  rationale: 受益・関係を示す前置詞לを、出生表現に自然な「ヨセフに」で表した。
- source_word: בְּ/טֶרֶם
  choice: 来る前に
  rationale: 後続する出来事に先立つ時を明瞭に示す。
- source_word: תָּבוֹא שְׁנַת הָרָעָב
  choice: 飢饉の年が来る
  rationale: 原文の単数「年」と動詞「来る」を保持し、飢饉期の到来を指す表現とした。
- source_word: שְׁנֵי בָנִים
  choice: 二人の息子
  rationale: 人数と親子関係を自然かつ正確に表す。
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: 二人を彼のために産んだのは
  rationale: 関係節が二人の息子を受けることを明示しつつ、לּוֹの受益的な含みを「彼のために」で保持した。
- source_word: אָסְנַת
  choice: アセナト
  rationale: 人名をヘブライ語の形に基づいて音写した。
- source_word: בַּת פּוֹטִי פֶרַע
  choice: ポティ・フェラの娘
  rationale: 連語形による父娘関係をそのまま表し、固有名を音写した。
- source_word: כֹּהֵן אֽוֹן
  choice: オンの祭司
  rationale: כֹּהֵןを通常の意味「祭司」とし、オンを地名として音写した。
