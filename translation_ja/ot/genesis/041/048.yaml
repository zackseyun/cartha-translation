  text: וַ/יִּקְבֹּ֞ץ אֶת כָּל אֹ֣כֶל שֶׁ֣בַע שָׁנִ֗ים אֲשֶׁ֤ר הָיוּ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יִּתֶּן אֹ֖כֶל בֶּ/עָרִ֑ים אֹ֧כֶל שְׂדֵה הָ/עִ֛יר אֲשֶׁ֥ר סְבִיבֹתֶ֖י/הָ נָתַ֥ן בְּ/תוֹכָֽ/הּ־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/048.yaml
  text: And he gathered all the food of the seven years that were in the land of Egypt[a], and he put the food in the cities. In each city he put the food from the fields around it.
translation:
  language: ja
  text: ヨセフは、エジプトの地にあった七年の食物をすべて集め、町々に食物を置いた。各町について、その周囲の畑でとれた食物をその町の中に置いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: 集め
  rationale: קבץの基本義である、各所から一か所へ集める動作を、自然な現代日本語で表す。
- source_word: כָּל אֹכֶל
  choice: 食物をすべて
  rationale: אֹכֶלは穀物に限定されないため、「穀物」や「収穫物」と狭めず、広い語義を保つ。
- source_word: שֶׁבַע שָׁנִים אֲשֶׁר הָיוּ בְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地に訪れた七年の間に得られた
  rationale: 直訳的には「エジプトの地にあった七年の食物」だが、文脈上は豊作の七年間に得られた食物を指す。日本語として意味関係が明瞭になるよう表現した。
- source_word: וַיִּתֶּן אֹכֶל בֶּעָרִים
  choice: 町々に蓄えた
  rationale: נתןの字義は「置いた」だが、飢饉に備えて食物を町に収蔵する文脈では「蓄えた」が自然であり、行為の意図を過度に付加せず伝える。
- source_word: אֹכֶל שְׂדֵה הָעִיר אֲשֶׁר סְבִיבֹתֶיהָ
  choice: それぞれの町の周囲の畑で得られた食物
  rationale: 単数形による配分的表現を「それぞれの町」とし、畑と食物との関係を自然な日本語で明示する。
- source_word: נָתַן בְּתוֹכָהּ
  choice: その町の中に蓄えた
  rationale: 女性単数代名詞の指示先である「町」を明示し、各町の周辺で得た食物を同じ町に入れたという対応関係を保つ。
theological_decisions: []
