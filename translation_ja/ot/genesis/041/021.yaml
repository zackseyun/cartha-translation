  yaml_path: translation/ot/genesis/041/021.yaml
  text: And they went into their bellies[a], but it was not known that they had gone into their bellies, and their appearance was bad, just as at the beginning[b]. Then I awoke.
translation:
  language: ja
  text: 太った雌牛たちはやせた雌牛たちの腹の中に入ったが、入ったことは分からず、やせた雌牛たちの姿は初めのときと同じようにひどかった。そこで私は目を覚ました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹאנָה אֶל־קִרְבֶּנָה
  choice: 太った雌牛は、やせた雌牛の腹の中に入ってしまった
  rationale: בוא の3人称女性複数形の主語は、文脈上、食べられた太った雌牛。קֶרֶב は「内側・内部」を意味し、この夢の具体的な情景では「腹の中」が自然。日本語で代名詞だけにすると、やせた雌牛が自分自身の腹へ入る意味に誤解されるため、文脈上の指示対象を明示した。
- source_word: וְלֹא נוֹדַע כִּי בָאוּ אֶל־קִרְבֶּנָה
  choice: それでも、太った雌牛が腹の中に入ったとは分からず
  rationale: נודע はידעのニファル形で、入った事実が見た目には認識できなかったことを表す。「それでも」により、食べたにもかかわらず外見が変わらない対照を自然に示し、ヘブライ語の反復も保った。
- source_word: וּמַרְאֵיהֶן רַע
  choice: やせた雌牛の見た目は……ひどいままだった
  rationale: מַרְאֶה は目に見える姿・外見、רַע はここでは外見の悪さを指す。「醜い」と限定しすぎず、前後の描写にも合う「ひどい」を選んだ。
- source_word: כַּאֲשֶׁר בַּתְּחִלָּה
  choice: 初めと変わらず
  rationale: 食べる前の最初の状態との比較を、明瞭で自然な現代日本語にした。原文の「初めの時と同じように」という意味を保つ。
- source_word: וָאִיקָץ
  choice: そこで私は目を覚ました
  rationale: יקץ の1人称単数形。夢の報告を締めくくる出来事の順序を「そこで」で自然に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。曖昧な代名詞は夢の文脈に即して名詞に置き換え、誰が誰の腹に入ったのかを明確にした。一方、רַע の具体的なニュアンスは「醜い」「やせ衰えた」などに狭めず、「ひどい」とした。
