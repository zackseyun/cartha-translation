revisions:
- from: 太った雌牛は、やせた雌牛の腹の中に入ってしまった[a]。それでも、太った雌牛が腹の中に入ったとは分からず、やせた雌牛の見た目は初めと変わらず、ひどいままだった。そこで私は目を覚ました。
  to: 太った雌牛たちはやせた雌牛たちの腹の中に入ったが、入ったことは分からず、やせた雌牛たちの姿は初めのときと同じようにひどかった。そこで私は目を覚ました。
  rationale: 原文の反復と夢の具体的なイメージを保ちつつ、主語と所有関係を明確にしました。「入ってしまった」と「それでも」が加えていた語調を除き、原文の単純な叙述と比較表現により近づけました。
