  text: וַ/יְדַבֵּר֙ שַׂ֣ר הַ/מַּשְׁקִ֔ים אֶת פַּרְעֹ֖ה לֵ/אמֹ֑ר אֶת חֲטָאַ֕/י אֲנִ֖י מַזְכִּ֥יר הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/009.yaml
  text: Then the chief cupbearer spoke to Pharaoh[a], saying, “Today I remember my offenses.”
translation:
  language: ja
  text: すると、献酌官長がファラオに言った。「私は今日、自分の過ち[a]を思い起こします。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「罪」または「落ち度」とも訳せる。ヘブライ語は、道徳上または職務上の違反を広く指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: すると、…言った
  rationale: 物語を進める接続形を、現代日本語で自然な「すると」で表し、דברによる発話導入を「言った」とした。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 献酌官長
  rationale: ファラオの飲み物を扱う宮廷役人の長を指す称号。「給仕役の長」より簡潔で、聖書の宮廷文脈にもふさわしい。
- source_word: אֶת־פַּרְעֹה
  choice: ファラオに
  rationale: 目的語標識を、日本語の発話相手を示す助詞「に」で自然に表した。
- source_word: לֵאמֹר
  choice: 言った
  rationale: ヘブライ語の定型的な発話導入を、前の動詞と合わせて日本語では重複を避け、一つの「言った」にまとめた。
- source_word: אֶת חֲטָאַי
  choice: 自分の過ち
  rationale: חטאの「罪・過失・落ち度」という幅を保ちつつ、この宮廷場面での職務上または道徳上の違反を自然に表すため「過ち」とした。複数形は日本語では数を明示せず自然に表した。
- source_word: אֲנִי מַזְכִּיר
  choice: 私は…思い起こします
  rationale: זכרのヒフィル形が持つ「思い出させる・言及する・思い起こす」の意味のうち、過去の過ちをファラオの前で自ら取り上げる文脈に合う表現とした。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 時間的な強調を、明快な現代日本語でそのまま表した。
