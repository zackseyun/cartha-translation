source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֣ה שֵׁם יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵחַ֒ וַ/יִּתֶּן ל֣/וֹ אֶת אָֽסְנַ֗ת בַּת פּ֥וֹטִי פֶ֛רַע כֹּהֵ֥ן אֹ֖ן לְ/אִשָּׁ֑ה וַ/יֵּצֵ֥א יוֹסֵ֖ף עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/045.yaml
  text: And Pharaoh called Joseph’s name Zaphenath-paneah[a], and he gave him Asenath, the daughter of Potiphera, the priest of On, as a wife[d][c][b]. And Joseph went out over the land of Egypt.
translation:
  language: ja
  text: ファラオはヨセフをツァフェナト・パネア[a]と名づけ、オン[b]の祭司であるポティフェラ[d]の娘アセナトを妻として彼に与えた。ヨセフはエジプト全土を巡った[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツァフェナト・パアネア」とも音写できる。このエジプト名の意味は確定しておらず、さまざまな解釈が提案されている。
    reason: lexical_alternative
  - marker: b
    text: オンは、後にギリシア語でヘリオポリスと呼ばれたエジプトの都市。
    reason: cultural_note
  - marker: c
    text: 直訳に近くは「エジプトの地に出て行った」。ここでの表現は、全土を行き巡る意味にも取れる。
    reason: alternative_reading
  - marker: d
    text: 「オンの祭司」はポティフェラを説明している。
    reason: syntactic_clarification
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה שֵׁם יוֹסֵף
  choice: ファラオはヨセフを…と名づけ
  rationale: 「ヨセフの名を…と呼んだ」というヘブライ語の命名表現を、意味を保ちながら自然な現代日本語にした。
- source_word: צָפְנַת פַּעְנֵחַ
  choice: ツァフェナト・パネア
  rationale: 語源と意味が確定していないエジプト名なので、推測による訳語を当てず、ヘブライ語本文の形に基づいて音写した。
- source_word: וַיִּתֶּן לוֹ אֶת אָסְנַת
  choice: アセナトを…彼に与えた
  rationale: נתן と間接目的語接尾辞の構文を明確に表した。アセナトは固有名として音写した。
- source_word: בַּת פּוֹטִי פֶרַע כֹּהֵן אֹן
  choice: オンの祭司ポティ・フェラの娘
  rationale: 「オンの祭司」はポティ・フェラを説明する同格句であり、その娘がアセナトであるという修飾関係が日本語で明確になる語順にした。
- source_word: לְאִשָּׁה
  choice: 妻として
  rationale: 結婚関係を成立させる定型的な用法を、簡潔で自然な日本語にした。
- source_word: וַיֵּצֵא יוֹסֵף עַל אֶרֶץ מִצְרָיִם
  choice: ヨセフはエジプト全土を巡った
  rationale: יצא は出て行くこと、עַל אֶרֶץ はその地を広く行き巡ることを文脈上示す。直訳調を避けつつ、ヨセフが任務のため国内に出た動きを表した。
theological_decisions:
- issue: ヨセフがエジプトの地に「出た」ことの意味
  choice: 統治権の行使を明示せず、「全土を巡った」とした。
  alternative: エジプト全土を治めるために出て行った。
  rationale: 文脈は新たな権限と職務を示唆するが、この節の本文自体には「治めるために」に相当する明示的表現がないため、目的を補わなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。固有名は日本語聖書で理解しやすい音写を用い、エジプト名の不確かな意味は本文で解釈せず注に残した。
