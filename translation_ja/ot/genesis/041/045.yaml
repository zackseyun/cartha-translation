revisions:
- from: ファラオはヨセフをツァフェナト・パネア[a]と名づけ、オン[b]の祭司ポティ・フェラ[d]の娘アセナトを妻として彼に与えた。こうしてヨセフはエジプト全土を巡った[c]。
  to: ファラオはヨセフをツァフェナト・パネア[a]と名づけ、オン[b]の祭司であるポティフェラ[d]の娘アセナトを妻として彼に与えた。ヨセフはエジプト全土を巡った[c]。
  rationale: 標準的な固有名表記「ポティフェラ」を採用し、同格の関係を「祭司である」で明確にした。また、原文にない結果を示す「こうして」を除いた。末文は英語監査資料が採る「over the land of Egypt」と同様に、全土に及ぶ移動という理解を本文に置きつつ、より字義的な読みを注で保持した。
