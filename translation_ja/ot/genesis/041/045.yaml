  terminology: 「ファラオ」「ヨセフ」「アセナト」「オン」「祭司」は適切です。ポティフェラは日本語の聖書翻訳で広く用いられる表記であり、英語監査資料のPotipheraにも対応します。ツァフェナト・パネアは、意味の不確かな名を訳さない処理として妥当です。
