base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/007.yaml
  text: And the thin ears swallowed up the seven healthy and full ears[a]. Then Pharaoh awoke, and behold[b], it was a dream.
translation:
  language: ja
  text: 細い穂[a]が、よく育ち、実の詰まった七つの穂[b]をのみ込んだ。ファラオは目を覚ました。見ると、それは夢だった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「穂」に当たるヘブライ語は、茎全体ではなく、穀粒の付く穂の部分を指す。
    reason: lexical_clarification
  - marker: b
    text: 「よく育ち」は、別訳「肥えた」または「ふっくらした」。原語は、健康で十分に養われた状態を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְנָה
  choice: のみ込んだ
  rationale: בלעの基本義「のみ込む」をそのまま生かし、夢の不思議で鮮烈な光景を保った。「食い尽くした」では、原語に必須でない捕食の含みが強くなる。
- source_word: הַשִּׁבֳּלִים
  choice: 穂
  rationale: この文脈のשִׁבֹּלֶתは、茎全体ではなく穀粒の付く部分を指す。日本語の「穂」が簡潔で正確である。
- source_word: הַדַּקּוֹת
  choice: 細い
  rationale: 「薄い、細い」を表す形容詞を穂に自然な日本語で訳した。牛について用いられた「やせた」と不必要に同一化しない。
- source_word: הַבְּרִיאוֹת וְהַמְּלֵאוֹת
  choice: よく育ち、実の詰まった
  rationale: 前者の健全で肥えた状態と、後者の「満ちた」という二つの描写を区別しつつ、穂について自然な日本語にした。
- source_word: וַיִּיקַץ
  choice: 目を覚ました
  rationale: 睡眠から覚めることを表す標準的で自然な物語表現。
- source_word: וְהִנֵּה חֲלוֹם
  choice: なんと、それは夢だった
  rationale: 原文の簡潔な「見よ、夢」を、日本語で必要な判断表現を補って訳した。「なんと」によりהִנֵּהの突然の気づきと注意喚起を保った。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、夢の異様な比喩と、ファラオが目覚めた瞬間の唐突な気づきを保った。「穂」は日本語だけで原語の指示対象を適切に表せるが、厳密さのため脚注で範囲を明示した。
