id: GEN.41.25
reference: Genesis 41:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/025.yaml
  text: Then Joseph said to Pharaoh[a], “Pharaoh’s dreams are one[b]; what God is doing he has declared to Pharaoh.”
translation:
  language: ja
  text: そこでヨセフはファラオに言った。「ファラオの夢は一つです[a]。神は、ご自分がなさろうとしていることをファラオに告げられたのです[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ファラオの夢は一つです」。文脈では、二つの夢が一つの知らせを表すことを指す。
    reason: 単数形「夢」と、文脈上の二つの夢との関係を明示するため。
  - marker: b
    text: 別訳「神がなさっていること」または「神がなさること」。ヘブライ語の分詞は、ここでは神が間もなく行おうとしていることを指すと考えられる。
    reason: 分詞 עֹשֶׂה の時間的な幅と原文の曖昧さを示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を前へ進めるワウ継続法の順接を、自然な現代日本語で表した。
- source_word: חֲלוֹם פַּרְעֹה אֶחָד הוּא
  choice: ファラオの夢は一つです
  rationale: ヘブライ語の単数形「夢」と述語「一つ」をそのまま尊重し、二つの夢が一つの啓示を伝えるという文脈上の意味を保持した。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 定冠詞付きで唯一の神を指す自然な日本語表現。原文以上の教派的含意は加えていない。
- source_word: עֹשֶׂה
  choice: なさろうとしている
  rationale: 分詞の進行的・近接未来的な幅のうち、これから起こる出来事を示す文脈に即して意志・近い将来を表した。ただし別訳を脚注に示した。
- source_word: הִגִּיד
  choice: 告げられた
  rationale: נגדのヒフィルが表す「知らせる、告げる」を、神を主語とする敬意ある自然な日本語で訳した。完了した啓示を表す過去形とした。
theological_decisions:
- issue: 神の行為を表す分詞 עֹשֶׂה の時間的意味
  choice: ご自分がなさろうとしていること
  alternative: 神がなさっていること／神がなさること
  rationale: 原文の分詞自体には現在・習慣・近接未来の幅がある。後続する飢饉と豊作の予告という文脈から近接未来を本文に採ったが、曖昧さを脚注で保持した。
- issue: 二つの夢と単数形 חֲלוֹם の関係
  choice: ファラオの夢は一つです
  alternative: ファラオの二つの夢は一つです／ファラオの夢は同じ意味です
  rationale: 単数形と「一つ」という原文の表現を保持し、二つの夢を一つの神的メッセージとして扱う含意を過度に説明し尽くさないようにした。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「です」を用いて、ヨセフが王に語る敬意を自然に表した。神の発話・行為には過剰に古風でない敬語を用いた。
