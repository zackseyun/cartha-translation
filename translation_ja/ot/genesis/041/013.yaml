  text: 'And it happened just as he interpreted for us[a], so it was: me he restored to my office[b], but him he hanged.'
translation:
  language: ja
  text: 彼が私たちのために解き明かしたとおりになりました。私は元の職[a]に戻され、彼はつるされました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「私の定まった場所に」。以前の役職や持ち場に戻されたことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר ... כֵּן הָיָה
  choice: …とおりになりました
  rationale: 二つの היה を機械的に反復せず、解き明かしと結果が正確に一致したというヘブライ語全体の強調を、自然な現代日本語で一続きに表した。
- source_word: פָּתַר לָנוּ
  choice: 私たちのために解き明かした
  rationale: פתר は夢の文脈で、その意味を解釈することを指す。「解き明かす」は夢の意味を明らかにする行為を自然かつ明確に伝える。
- source_word: אֹתִי הֵשִׁיב
  choice: 私は…戻され
  rationale: 前置された目的語 אֹתִי と次の וְאֹתוֹ の対照を、「私は」と「あの者は」の対句で保った。動作主は文脈上ファラオだが、原文同様ここでは明示しない。
- source_word: עַל־כַּנִּי
  choice: 元の職に
  rationale: כַּן はここでは以前の定まった地位・役職を表す慣用句であり、「元の職」が杯を献げる役への復帰を簡潔に伝える。
- source_word: וְאֹתוֹ תָלָה
  choice: あの者はつるされました
  rationale: 前節との鋭い対照を保ちつつ、תלה の基本像を「つるす」で表現した。処刑方法や、死後に遺体をさらしたのかという原文だけでは確定しない点を訳文で限定しない。
