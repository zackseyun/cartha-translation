  text: וַ/יֹּ֧אמֶר פַּרְעֹ֛ה אֶל יוֹסֵ֖ף אֲנִ֣י פַרְעֹ֑ה וּ/בִלְעָדֶ֗י/ךָ לֹֽא יָרִ֨ים אִ֧ישׁ אֶת יָד֛/וֹ וְ/אֶת רַגְל֖/וֹ בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/044.yaml
  text: Then Pharaoh said to Joseph[a], “I am Pharaoh[b], and without you no man will lift up his hand or his foot in all the land of Egypt.”
translation:
  language: ja
  text: ファラオはヨセフに言った。「私はファラオである。だが、あなたを抜きにしては[a]、エジプト全土で、だれ一人、手も足も上げることはできない[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたなしには」。ヨセフの権限や関与を離れて、エジプトのだれも行動できないことを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「手と足を上げることはできない」。何かを行うこと、または動き出すことを表す慣用表現。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ連続法。日本語では文脈上、接続語を補わずとも自然に継起が伝わる。
- source_word: אֲנִי פַרְעֹה
  choice: 私はファラオである
  rationale: 動詞のない強調的な自己宣言を、簡潔で威厳ある表現として保持した。
- source_word: וּבִלְעָדֶיךָ
  choice: あなたの許しなしには
  rationale: 字義的には「あなたなしには／あなたを別にして」。ここではヨセフに授けられた権限に基づき、彼の承認なしには行動できないという文脈上の意味を自然に表した。字義的な別訳は脚注に残した。
- source_word: לֹא יָרִים אִישׁ
  choice: だれ一人…上げることはできない
  rationale: אִישׁ の総称的意味を現代日本語の「だれ一人」で表し、王の布告が示す不許可・不可能の含みを「できない」で伝えた。
- source_word: אֶת יָדוֹ וְאֶת רַגְלוֹ
  choice: 手も足も上げる
  rationale: ヘブライ語の具体的な慣用表現を本文に保持した。「も…も」は否定文において原文の「手と足」の包括性を自然に示す。意味は脚注で説明した。
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土で
  rationale: 領域全体を表す句を、明瞭で自然な現代日本語にした。
