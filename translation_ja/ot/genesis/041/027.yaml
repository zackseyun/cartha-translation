base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/027.yaml
  text: And the seven thin and bad cows that came up after them are seven years[a], and the seven empty heads of grain, scorched by the east wind[b], will be seven years of famine.
translation:
  language: ja
  text: また、それらの後に上がって来た、やせ細り、状態の悪い七頭の雌牛は七年であり、東風に焼かれた中身のない七つの穂は、七年の飢饉となります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרַקּוֹת
  choice: やせて
  rationale: 雌牛が肉づきに乏しく、やせ細っている状態を表す。現代日本語として明瞭で、夢の描写にも適している。
- source_word: וְהָרָעֹת
  choice: 状態の悪い
  rationale: ここでの רַע は道徳的な悪ではなく、雌牛の外見や健康状態の悪さを指す。「醜い」だけに限定せず、原語の広さを保った。
- source_word: הָעֹלֹת אַחֲרֵיהֶן
  choice: その後に上がって来た
  rationale: 夢の中で先の雌牛に続いて現れた順序と、川から上がって来た動きを自然に表す。
- source_word: שֶׁבַע שָׁנִים הֵנָּה
  choice: 七年であり
  rationale: 夢の象徴である七頭の雌牛を七年と同定する表現を簡潔に保つ。
- source_word: הַשִׁבֳּלִים
  choice: 穂
  rationale: 穀物の穂を指す語。文脈上明らかであり、日本語では簡潔な「穂」が自然である。
- source_word: הָרֵקוֹת
  choice: 中身のない
  rationale: 穂に実が十分入っていない空虚な状態を、農作物の描写として分かりやすく表す。
- source_word: שְׁדֻפוֹת הַקָּדִים
  choice: 東風に焼かれた
  rationale: 熱く乾いた東風によって穂が損なわれたことを、受動的な原文の形と鮮明な比喩を保って訳した。
- source_word: יִהְיוּ
  choice: となります
  rationale: 未完了形の将来的・予告的な力を反映しつつ、ヨセフがファラオに語る場面にふさわしい丁寧さを用いた。
- source_word: שְׁנֵי רָעָב
  choice: 七年の飢饉
  rationale: 広範な食糧不足を指す定型的かつ文脈に即した訳語である。
theological_decisions: []
