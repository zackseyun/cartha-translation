base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/005.yaml
  text: Then he slept and dreamed a second time[a], and behold, seven ears of grain were coming up on one stalk[b], plump and good.
translation:
  language: ja
  text: 彼は眠り、再び夢を見た。すると、そこに一本の茎に七つの穀物の穂[a]が生え出ていた。実がよく詰まった、立派な穂であった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「穂」は、穀粒を付ける穀物の先端部分を指す。
    reason: lexical_clarification
  - marker: b
    text: 直訳すると「肥えており」。穀粒が十分に詰まった状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּישָׁן
  choice: 彼は再び眠り
  rationale: 物語を進める継続形を自然な現代日本語で表した。「再び」は、先の夢の後にもう一度眠ったという文脈上の順序を明確にする。
- source_word: וַיַּחֲלֹם שֵׁנִית
  choice: 二度目の夢を見た
  rationale: שֵׁנִיתの「二度目に」という意味を保ちつつ、日本語として自然な表現にした。
- source_word: וְהִנֵּה
  choice: すると
  rationale: 夢の中に新たな光景が鮮やかに現れる提示機能を、古風すぎない物語表現で示した。
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: 七つの穀物の穂
  rationale: שִׁבֳּלִיםは穀粒を付ける穂を指す。穀物の種類を特定せず、現代日本語で明瞭に表した。
- source_word: עֹלוֹת
  choice: 伸び出ていた
  rationale: 分詞が描く進行中の生長を、夢の光景として生き生きと表した。
- source_word: בְּקָנֶה אֶחָד
  choice: 一本の茎に
  rationale: 一つの茎に複数の穂が生じている関係を、日本語の自然な位置表現で示した。
- source_word: בְּרִיאוֹת
  choice: よく実り
  rationale: 穂が太って十分に実の詰まった状態を自然な農作物表現で表した。「健康な」という不自然な直訳を避けた。
- source_word: וְטֹבוֹת
  choice: 良い穂
  rationale: טוֹבの広い評価的意味を限定しすぎず、品質の良さとして直接的に表した。
