  text: וַ/תְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָ/רָעָב֙ לָ/ב֔וֹא כַּ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יְהִ֤י רָעָב֙ בְּ/כָל הָ֣/אֲרָצ֔וֹת וּ/בְ/כָל אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/054.yaml
  text: And the seven years of famine began to come[a], just as Joseph had said. And there was famine in all the lands, but in all the land of Egypt there was bread.
translation:
  language: ja
  text: ヨセフが言ったとおり、七年間の飢饉が始まった。あらゆる地に飢饉があったが、エジプト全土にはパン[a]があった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「食物」とも訳せる。ヘブライ語の「パン」は、より広く食物や食糧を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּחִלֶּינָה ... לָבוֹא
  choice: 始まった
  rationale: 直訳的には「来始めた」だが、飢饉の七年間が到来し始めたことを表す起動の意味を、自然な現代日本語で示した。
- source_word: שֶׁבַע שְׁנֵי הָרָעָב
  choice: 七年にわたる飢饉
  rationale: 「飢饉の七年」という構造を、期間が明瞭に伝わる自然な日本語にした。
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: ヨセフが言ったとおり
  rationale: 出来事がヨセフの先の言葉と一致したことを表すכַּאֲשֶׁרの意味を保持した。
- source_word: וַיְהִי רָעָב
  choice: 飢饉があった
  rationale: 存在を表すהיהを簡潔に訳し、原文の叙述の調子を保った。
- source_word: בְּכָל הָאֲרָצוֹת
  choice: あらゆる地に
  rationale: 複数形אֲרָצוֹתを、近代的な政治単位を含意する「国々」ではなく、広く諸地域を指す表現で訳した。
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: だが、エジプト全土には
  rationale: 接続詞は形式上「そして」だが、他の地の飢饉とエジプトの食糧の存在との明白な対照を、日本語では「だが」で自然に示した。
- source_word: הָיָה לָחֶם
  choice: パンがあった
  rationale: לֶחֶםの具体的な基本義「パン」を本文に残した。文脈上の広い意味「食物」は脚注で示す。
theological_decisions: []
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。「こうして」で物語の進行を示しつつ、全体を dignified な聖書叙述として整えた。脚注記号は、その内容が説明する「パン」の直後に置いた。
