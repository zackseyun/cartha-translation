  text: And the thin and ugly cows ate up the first seven healthy cows[a].
translation:
  language: ja
  text: やせて見栄えの悪い雌牛が、最初の七頭の肥えた雌牛を食べてしまいました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「やせて醜い雌牛が……先の七頭の健康な雌牛を」。
    reason: רָעוֹת は「醜い」「外見の悪い」とも訳せ、בְּרִיאוֹת は「健康な」とも訳せるため。
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: 食べてしまいました
  rationale: 動詞 אכל は「食べる」の意。夢の中で雌牛がほかの雌牛を食べ尽くす出来事を、文脈に即して自然に表す。
- source_word: הַפָּרוֹת
  choice: 雌牛
  rationale: 女性複数形であり、一般的な「牛」よりも原文の性を正確に伝える。
- source_word: הָרַקּוֹת
  choice: やせて
  rationale: 肉づきが乏しい状態を表し、現代日本語として明快である。
- source_word: וְהָרָעוֹת
  choice: 醜い
  rationale: ここで רעות は道徳的な悪ではなく、外見の悪さを指すため、「醜い」とした。
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: 七頭の雌牛を
  rationale: 目的語標識に続く数詞と名詞を、日本語で自然な助数詞「頭」を用いて表した。
- source_word: הָרִאשֹׁנוֹת
  choice: 先に現れた
  rationale: 夢の中で先行して登場した一群を指すので、単なる順位ではなく時間的な順序が明確になるようにした。
- source_word: הַבְּרִיאֹת
  choice: 肥えた
  rationale: בריא はここで健康で肉づきのよい状態を指す。直前の夢の描写との整合性と、やせた雌牛との対照を保つため「肥えた」とした。
