  terminology: 「雌牛」は女性形 פָּרוֹת を正確に反映する。「肥えた」は בְּרִיאוֹת の豊かで健康な状態をこの夢の対比に即して表す。脚注では「健康な」を可能な語義として示し、本文の選択を不当に固定しない。
