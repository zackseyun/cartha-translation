id: GEN.41.42
reference: Genesis 41:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּ֨סַר פַּרְעֹ֤ה אֶת טַבַּעְתּ/וֹ֙ מֵ/עַ֣ל יָד֔/וֹ וַ/יִּתֵּ֥ן אֹתָ֖/הּ עַל יַ֣ד יוֹסֵ֑ף וַ/יַּלְבֵּ֤שׁ אֹת/וֹ֙ בִּגְדֵי שֵׁ֔שׁ וַ/יָּ֛שֶׂם רְבִ֥ד הַ/זָּהָ֖ב עַל צַוָּארֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/042.yaml
  text: Then Pharaoh removed his signet ring from his hand and put it on Joseph’s hand[c][b][a], and he clothed him in garments of fine linen and put a gold chain around his neck.
translation:
  language: ja
  text: そこでファラオは、自分の手から印章指輪[a]を外してヨセフの手にはめ、上質の亜麻布[b]の衣を着せ、首に金の首飾り[c]をかけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「指輪」。ヘブライ語は指輪一般を指すことがあるが、王が権限を委ねるこの文脈では、印章指輪と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「上質の亜麻布」はヘブライ語 שֵׁשׁ の訳。富や栄誉と結びついた高品質の亜麻布を指す。
    reason: cultural_note
  - marker: c
    text: または「金の鎖」「金の襟飾り」。このヘブライ語が指す首の装身具の正確な形は不明。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסַר
  choice: 外して
  rationale: 「取り除く、外す」を意味し、手から指輪を取る動作を自然な現代日本語で表す。
- source_word: טַבַּעְתּוֹ
  choice: 自分の印章指輪
  rationale: 語そのものは一般に「指輪」だが、王が権限を委ねる文脈では印章として用いる指輪と考えられる。「自分の」は接尾辞の指示先がファラオであることを明確にする。
- source_word: מֵעַל יָדוֹ
  choice: 自分の手から
  rationale: ヘブライ語の空間表現を、日本語として自然に訳した。
- source_word: וַיִּתֵּן אֹתָהּ עַל יַד יוֹסֵף
  choice: ヨセフの手にはめ
  rationale: נתן は通常「与える、置く」だが、指輪を手の上に置くという文脈では、日本語の「手にはめる」が具体的な動作を最も自然に伝える。
- source_word: וַיַּלְבֵּשׁ אֹתוֹ
  choice: 衣を着せ
  rationale: 使役的な形を保ち、ファラオがヨセフに衣服を着せた叙任の行為として表現する。
- source_word: בִּגְדֵי שֵׁשׁ
  choice: 上質の亜麻布の衣
  rationale: שֵׁשׁ は身分や栄誉と結びつく高品質の亜麻布を指す。「上質の亜麻布」は素材と品質を明瞭に伝える。
- source_word: רְבִד הַזָּהָב
  choice: 金の首飾り
  rationale: 首に着ける金製の装身具を指すが、具体的な形状は確定できないため、鎖に限定しない「首飾り」とした。
- source_word: עַל צַוָּארוֹ
  choice: 首に
  rationale: 装身具を身に着けさせる場面に合う簡潔で自然な日本語。
