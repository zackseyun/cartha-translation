  text: וְ/עַתָּה֙ יֵרֶ֣א פַרְעֹ֔ה אִ֖ישׁ נָב֣וֹן וְ/חָכָ֑ם וִ/ישִׁיתֵ֖/הוּ עַל אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/033.yaml
  text: Now let Pharaoh look for a discerning and wise man[a], and appoint him over the land of Egypt.
translation:
  language: ja
  text: 今、ファラオが、分別があり知恵のある男性を見いだし[a]、その人をエジプトの地を治める者として任命されますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「見て選び」。ヘブライ語の動詞は、文脈により「見る」「見いだす」「選ぶ」の意味を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: そこで今
  rationale: 夢の解き明かしから具体的な提言への移行を示す。「そこで」で文脈上のつながりを、「今」で直訳的な時間・談話標識を保った。
- source_word: יֵרֶא
  choice: 見いだし
  rationale: ראה の未完了形がここでは勧告的に用いられ、単に目で見るだけでなく、適任者を見つけて選ぶ含みを持つ。後続の任命とも自然につながる。
- source_word: פַרְעֹה
  choice: ファラオ
  rationale: 王号として日本語聖書で定着した表記を採用した。
- source_word: אִישׁ
  choice: 人
  rationale: 文脈では男性の官吏を想定し得るが、現代日本語の「人」はヘブライ語 אִישׁ の人物指示を自然に表し、性別を不必要に強調しない。
- source_word: נָבוֹן
  choice: 分別のある
  rationale: 状況を理解し、適切に判断する実務的洞察を表す。行政を担う人物の資質として自然である。
- source_word: וְחָכָם
  choice: 知恵のある
  rationale: 判断力と統治能力を含む חכם の広い意味を、定着した聖書語彙を保ちつつ明瞭に表す。
- source_word: וִישִׁיתֵהוּ
  choice: その人を…任命なさってください
  rationale: שים の「置く、据える」を統治上の文脈に即して「任命する」とした。勧告の並列を、ファラオへの敬意を示す自然な依頼表現で表した。
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: エジプトの地の上に
  rationale: עַל が示す管轄・権限と、אֶרֶץ מִצְרַיִם の「エジプトの地」という表現を保持した。「上に」は支配・監督の位置を表す。
