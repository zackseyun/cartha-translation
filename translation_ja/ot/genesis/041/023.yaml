  yaml_path: translation/ot/genesis/041/023.yaml
  text: And behold[a], seven ears, thin and scorched by the east wind[b], were sprouting after them.
translation:
  language: ja
  text: すると、なんと、しなびて細く、東風に焼かれた七つの穂が、その後から生えてきた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: すると、なんと
  rationale: 夢の場面に新たな光景が現れる際の、鮮明な提示と驚きの響きを、現代日本語で自然に表した。
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: 七つの穂
  rationale: שִׁבֳּלִים は穀物の穂を指す。「七本」よりも、原文どおり穂そのものに焦点を置く表現とした。
- source_word: צְנֻמוֹת
  choice: しなびて
  rationale: 枯れて縮み、実りに乏しい状態を表す語として理解し、後続の דַּקּוֹת と区別して訳した。
- source_word: דַּקּוֹת
  choice: 細く
  rationale: 物理的に薄い、細いという形状を表し、צְנֻמוֹת と重なるものの別個の描写として保持した。
- source_word: שְׁדֻפוֹת קָדִים
  choice: 東風に焼かれた
  rationale: 乾燥した熱い東風によって穀物が損なわれた状態を、簡潔で具体的な日本語にした。
- source_word: צֹמְחוֹת
  choice: 生えてきた
  rationale: 分詞の進行的な情景を、日本語の夢物語として自然な動きのある表現で示した。
- source_word: אַחֲרֵיהֶם
  choice: その後から
  rationale: 先に現れた七つの穂に続いて生じたという順序を明確にした。
