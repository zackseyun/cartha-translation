base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/026.yaml
  text: The seven good cows are seven years[a], and the seven good ears of grain are seven years; it is one dream.
translation:
  language: ja
  text: 七頭の良い雌牛は七年であり、七つの良い穀物の穂も七年です。夢は一つです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּרֹת
  choice: 雌牛
  rationale: ファラオの夢に現れた雌の牛を具体的に指すため、「牛」より正確な「雌牛」とした。
- source_word: הַטֹּבֹת
  choice: 良い
  rationale: 語の広い意味を保ち、外見や健康状態だけに限定して解釈しないため。
- source_word: שָׁנִים
  choice: 年
  rationale: 夢の象徴が表す期間として明示される語の直接的な訳。
- source_word: שִׁבֳּלִים
  choice: 穀物の穂
  rationale: 穀粒をつける茎の先端部分を指す語であり、現代日本語で誤解なく伝わる表現。
- source_word: חֲלוֹם אֶחָד הוּא
  choice: 夢は一つです
  rationale: 二組の象徴が一つの夢、すなわち統一された夢の内容であるという単数の強調を自然な日本語で保つ。
- source_word: הֵנָּה
  choice: であり／です
  rationale: ヘブライ語の女性複数代名詞が担う繋辞的機能を、日本語の自然な断定表現で示した。
