  text: And Pharaoh said to Joseph, “See, I have set you over all the land of Egypt.”
translation:
  language: ja
  text: ファラオはヨセフに言った。「見よ、わたしはあなたをエジプト全土を治める者に任命した。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ワウ継続法による物語の進行は、日本語では文脈と語順で自然に示されるため、接続語を補わず簡潔に訳した。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として現代日本語の聖書用語に定着した表記を採用した。
- source_word: אֶל יוֹסֵף
  choice: ヨセフに
  rationale: 発話の相手を示す前置詞と固有名を、自然な現代日本語で表した。
- source_word: רְאֵה
  choice: 見よ
  rationale: 実際に見ることだけでなく、続く厳粛な宣言へ注意を促す命令形の機能を保つ。格調を保ちつつ、現代日本語でも理解できる表現である。
- source_word: נָתַתִּי אֹתְךָ עַל
  choice: わたしはあなたを……の上に立てた
  rationale: נתן の基本義は「与える」だが、ここでは עַל とともに統治権を授ける任命を表す。「上に立てた」は権威関係を保ち、直後の任命行為にも自然につながる。
- source_word: כָּל אֶרֶץ מִצְרָיִם
  choice: エジプト全土
  rationale: כָּל の包括性と אֶרֶץ の領土的意味を、簡潔で自然な日本語にした。
