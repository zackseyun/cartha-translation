  text: וְ/לֹֽא יִוָּדַ֤ע הַ/שָּׂבָע֙ בָּ/אָ֔רֶץ מִ/פְּנֵ֛י הָ/רָעָ֥ב הַ/ה֖וּא אַחֲרֵי כֵ֑ן כִּֽי כָבֵ֥ד ה֖וּא מְאֹֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/031.yaml
  text: And the abundance in the land will not be known because of that famine afterward[b][a], for it will be very severe.
translation:
  language: ja
  text: その後に来る飢饉のために、この地にあった豊かさは分からなくなる。その飢饉が非常に厳しいからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִוָּדַע
  choice: 分からなくなる
  rationale: ニファル形の「知られる・認められる」を文脈に即して表し、先の豊作が後の飢饉によって認識できないほどになることを、自然な現代日本語で示す。
- source_word: הַשָּׂבָע
  choice: 豊作があったこと
  rationale: 直訳的には「豊かさ・満ち足りた状態」だが、創世記41章の農業的文脈では収穫の豊かさを指すため、「豊作」とした。
- source_word: בָּאָרֶץ
  choice: この地に
  rationale: 文脈上、全世界ではなくエジプトの地を指す地域的表現である。「この地」は発話場面にも自然に合う。
- source_word: מִפְּנֵי
  choice: ～のため
  rationale: ここでは原因を示す前置詞であり、後の飢饉のために先の豊作が分からなくなるという関係を明確にする。
- source_word: הָרָעָב הַהוּא אַחֲרֵי כֵן
  choice: その後に来る飢饉
  rationale: 指示語と時間的順序を保ちつつ、「その後のあの飢饉」のような不自然さを避け、自然な日本語にした。
- source_word: כִּי כָבֵד הוּא מְאֹד
  choice: その飢饉が非常に厳しいからである
  rationale: כבד の字義は「重い」だが、飢饉については「厳しい、深刻な」の意。「非常に」で מְאֹד の強意を保った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、ヨセフが王に夢の意味を説明する場面にふさわしい、簡潔で dignified な叙述調とした。原文の因果関係と、豊作の記憶・認識が飢饉によって消えるという含意を保っている。
