base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/019.yaml
  text: And behold[a], seven other cows came up after them, poor and very ugly in appearance and thin in flesh[b]. I had not seen any like them in all the land of Egypt for ugliness.
translation:
  language: ja
  text: すると、その後から別の七頭の雌牛が上がって来ました。弱々しく、姿もひどく醜く、肉付きもひどく痩せていました。エジプト全土で、これほどひどい雌牛を見たことはありません。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「悪さの点で」。外見や身体の状態が並外れて悪かったことを強調する表現です。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: すると、見よ
  rationale: 夢の報告に次の光景を生き生きと導入する談話標識として、「見よ」を残した。「すると」によって日本語の物語の流れも明確にした。
- source_word: שֶׁבַע פָּרוֹת אֲחֵרוֹת
  choice: 別の七頭の雌牛
  rationale: פָּרוֹת は雌の牛を指すため「雌牛」とし、אֲחֵרוֹת は先の七頭とは別の一群であることを表す「別の」とした。
- source_word: עֹלוֹת אַחֲרֵיהֶן
  choice: その後から…上がって来ました
  rationale: 継続的・情景描写的な分詞を、ファラオが夢を回想して語る自然な日本語の過去表現にした。上る動きは原文どおり保持した。
- source_word: דַּלּוֹת
  choice: 貧弱で
  rationale: 弱々しく、乏しい身体状態を表す語として、後続の「肉付きもやせ細って」と不必要に重ならない表現を選んだ。
- source_word: וְרָעוֹת תֹּאַר מְאֹד
  choice: 姿がひどく醜く
  rationale: ここでの רָעוֹת は道徳的な悪ではなく、תֹּאַר と結びついて外見の悪さを示すため、「醜く」と明示した。מְאֹד の強意は「ひどく」で表した。
- source_word: וְרַקּוֹת בָּשָׂר
  choice: 肉付きもやせ細っていました
  rationale: 直訳的な「肉が薄い」の不自然さを避けつつ、肉体が著しく痩せているという具体的な描写を保った。
- source_word: לֹא רָאִיתִי כָהֵנָּה
  choice: あれほど…見たことがありません
  rationale: 同類を一度も見ていないという比較と経験否定を、現代日本語で自然に表した。
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: エジプト全土で
  rationale: 地理的範囲の全体性を簡潔で自然な日本語にした。
- source_word: לָרֹעַ
  choice: あれほどひどい
  rationale: 原文の広い評価語を、外見だけに狭めすぎず、雌牛の醜さと惨めな身体状態をまとめる表現として訳した。
