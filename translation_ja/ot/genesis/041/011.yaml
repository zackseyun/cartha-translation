  yaml_path: translation/ot/genesis/041/011.yaml
  text: And we dreamed a dream in one night[a], I and he; each man dreamed according to the interpretation of his dream.
translation:
  language: ja
  text: 同じ夜に、私も彼も夢を見ました。それぞれ、自分の夢の解き明かしに応じた夢を見たのです[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「私も彼も同じ夜に夢を見た。それぞれ、自分の夢の解き明かしに応じて夢を見た」。
    reason: 原文は、各人の夢がその夢の解き明かしに対応していたことを、分配的な表現と「夢を見た」の反復によって示している。
lexical_decisions:
- source_word: וַנַּחַלְמָה חֲלוֹם
  choice: 夢を見ました
  rationale: 動詞と同語根の目的語を用いるヘブライ語表現は、日本語では自然な「夢を見る」とした。接続形の物語上の進行は文脈と「その夜」で十分に伝わる。
- source_word: בְּלַיְלָה אֶחָד
  choice: その夜
  rationale: 字義的には「一つの夜に」。二人が同じ夜に夢を見たという時間的一致を、明瞭で自然な日本語で表した。
- source_word: אֲנִי וָהוּא
  choice: 私と彼
  rationale: 原文の二人を明示しつつ、日本語として自然な語順を採った。
- source_word: אִישׁ
  choice: それぞれ
  rationale: ここでは分配的用法であり、二人が各自異なる夢を見たことを表す。日本語では「それぞれ」が最も自然で明確。
- source_word: כְּפִתְרוֹן חֲלֹמוֹ
  choice: それぞれ自分の夢の解き明かしに応じた
  rationale: 前置詞 כְּ の対応関係を「応じた」で保持し、各人の夢とその解き明かしとの個別の対応を示した。
- source_word: חָלָמְנוּ
  choice: 私たちが見た夢は…ものでした
  rationale: 節末で反復される「私たちは夢を見た」を、日本語では第二文の主題として再構成し、原文の分配的な強調を保ちながら不自然な重複を避けた。
theological_decisions: []
