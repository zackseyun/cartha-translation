base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/008.yaml
  text: In the morning[a], his spirit was troubled, so he sent and called all the magicians of Egypt and all its wise men. Pharaoh told them his dreams, but there was no one who could interpret them for Pharaoh.
translation:
  language: ja
  text: 朝になると、ファラオの心は騒いだ。そこで彼は使者を遣わし、エジプトの呪術師を皆、その知者を皆、呼び集めた。ファラオは彼らに自分の夢を語って聞かせたが、それらを[a]ファラオに解き明かせる者はいなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直前の「夢」はヘブライ語で単数ですが、ここで「それらを」に当たる代名詞は複数です。夢の中の個々の要素を指すとも、夢の体験を複数のものとして扱っているとも考えられます。「その夢を」と訳すこともできます。
    reason: 原文にある単数名詞と複数代名詞のずれを説明し、別訳を示すため。
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: 朝になると
  rationale: 物語の時間的進行を、明瞭で自然な現代日本語で表した。
- source_word: וַתִּפָּעֶם רוּחוֹ
  choice: ファラオの心は騒いだ
  rationale: רוּחַ は直訳すれば「霊」だが、ここでは内面の動揺を指す。「心は騒いだ」は פעמ の強い不安と動揺を自然に伝え、単なる思考として狭めない。
- source_word: וַיִּשְׁלַח וַיִּקְרָא
  choice: 人を遣わし、…呼び集めた
  rationale: 二つの動詞を反映しつつ、使者を送って召集したという文脈上の意味を自然に示した。
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: エジプト中の呪術師
  rationale: 夢の解釈や秘術に携わったエジプトの専門家を指す語として、「魔術師」よりも儀礼的・秘術的役割を伝えやすい「呪術師」を採用した。
- source_word: כָּל חֲכָמֶיהָ
  choice: 知恵ある者をことごとく
  rationale: 接尾辞が指すエジプト全体の賢者たちを表し、חַרְטֻמִּים とは別の集団として保った。
- source_word: וַיְסַפֵּר פַּרְעֹה לָהֶם אֶת חֲלֹמוֹ
  choice: ファラオは彼らに自分の夢を語って聞かせた
  rationale: 本文の「夢」が単数であることを保ち、ספר の詳しく語る意味を自然な日本語で表した。
- source_word: וְאֵין פֹּתֵר אֹתָם לְפַרְעֹה
  choice: それらをファラオに解き明かせる者はいなかった
  rationale: 「夢」は直前で単数だが、目的語代名詞は複数である。この不一致を均さず「それら」とし、解釈を要する夢の諸要素を指し得る原文の表現を残した。
theological_decisions: []
