  text: וַ/תִּבְלַ֨עְןָ֙ הָ/שִׁבֳּלִ֣ים הַ/דַּקֹּ֔ת אֵ֛ת שֶׁ֥בַע הַֽ/שִׁבֳּלִ֖ים הַ/טֹּב֑וֹת וָֽ/אֹמַר֙ אֶל הַֽ/חַרְטֻמִּ֔ים וְ/אֵ֥ין מַגִּ֖יד לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/024.yaml
  text: And the thin ears swallowed up the seven good ears[a]. Then I told the magicians[c][b], but there was no one who could explain it to me.
translation:
  language: ja
  text: そして、細い穂が七つの良い穂を飲み込みました[a]。そこで私はその夢を呪術師たち[b]に話しましたが、私にその意味を告げる者はだれもいませんでした[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「穂」は、穀物の実がまとまってつく部分を指します。
    reason: lexical_clarification
  - marker: b
    text: 「呪術師」は、エジプトで祭儀や占術、夢の解釈に携わった専門家を指します。
    reason: cultural_note
  - marker: c
    text: 別訳「私のためにそれを解き明かす者はだれもいませんでした」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּבְלַעְןָ
  choice: のみ込んでしまいました
  rationale: בלעの鮮烈な夢の描写を保ちつつ、完了した出来事として自然な現代日本語にした。
- source_word: שִׁבֳּלִים
  choice: 穂
  rationale: この農耕的文脈では穀物の穂を指す。日本語では「穂」が簡潔で自然である。
- source_word: הַדַּקֹּת
  choice: やせた
  rationale: 字義的には「細い」だが、良い穂との対照と不良な穀物の姿を自然に表すため「やせた」とした。
- source_word: הַטֹּבוֹת
  choice: 良い
  rationale: טובの広い意味を狭めず、原文の素朴な対照を保った。
- source_word: וָאֹמַר אֶל
  choice: そこで私は…に話しました
  rationale: 目的語を補わず、ファラオが夢の内容を彼らに話したという文脈上の含意を自然に伝えた。
- source_word: הַחַרְטֻמִּים
  choice: 呪術師たち
  rationale: エジプト宮廷の祭儀・占術・夢解きに携わる専門家を指す語であり、現代日本語で舞台芸人を連想しやすい「魔術師」より文脈に適する。
- source_word: וְאֵין מַגִּיד לִי
  choice: 私にその意味を告げる者はだれもいませんでした
  rationale: נגדは字義的には「告げる、知らせる」。夢の解釈という文脈を「その意味」で明らかにしつつ、「解き明かす」と断定しすぎず語義の幅を保った。
theological_decisions: []
