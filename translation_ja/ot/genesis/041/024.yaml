revisions:
- from: そして、やせた穂が、七つの良い穂をのみ込んでしまいました[a]。そこで私は呪術師たち[b]に話しましたが、私にその意味を告げる者はだれもいませんでした[c]。
  to: そして、細い穂が七つの良い穂を飲み込みました[a]。そこで私はその夢を呪術師たち[b]に話しましたが、私にその意味を告げる者はだれもいませんでした[c]。
  rationale: 原語の「細い」という描写を保つため「やせた」を「細い」に改めました。また、日本語としての明快さを保つため、ファラオが呪術師たちに語った内容を、文脈上明白な「その夢」として補いました。注のアンカーと内容は本文の各該当箇所に適切に対応しており、維持します。
