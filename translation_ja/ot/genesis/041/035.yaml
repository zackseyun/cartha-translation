  text: וְ/יִקְבְּצ֗וּ אֶת כָּל אֹ֨כֶל֙ הַ/שָּׁנִ֣ים הַ/טֹּבֹ֔ת הַ/בָּאֹ֖ת הָ/אֵ֑לֶּה וְ/יִצְבְּרוּ בָ֞ר תַּ֧חַת יַד פַּרְעֹ֛ה אֹ֥כֶל בֶּ/עָרִ֖ים וְ/שָׁמָֽרוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/035.yaml
  text: Let them gather all the food of these coming good years[a], and let them store up grain under Pharaoh’s authority as food in the cities[b], and let them keep it.
translation:
  language: ja
  text: これから来るこの豊作の年々の食糧をすべて集め、ファラオの権限のもとで、町々に食糧として穀物を蓄え、それを保管させなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それを守らせなさい」「それを保存させなさい」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִקְבְּצוּ
  choice: 集めさせなさい
  rationale: ヨセフが提案を述べる文脈での指示・勧告の意味を、自然な日本語の使役命令で表した。
- source_word: כָּל אֹכֶל
  choice: 食糧をすべて
  rationale: 豊作の年に集める農産物・備蓄物を広く指すため、「食物」より行政的備蓄の文脈に合う「食糧」とした。
- source_word: הַשָּׁנִים הַטֹּבוֹת הַבָּאֹת הָאֵלֶּה
  choice: これから来るこの豊作の年々に
  rationale: 「良い年々」の意味を文脈に即して「豊作の年々」とし、分詞と指示語の意味も保持した。
- source_word: וְיִצְבְּרוּ
  choice: 蓄えさせなさい
  rationale: 大量に積み上げて備蓄する意味を、現代日本語で自然に表した。
- source_word: בָּר
  choice: 穀物
  rationale: 脱穀した穀類を指し得る語であり、特定の穀物に限定しない訳語を選んだ。
- source_word: תַּחַת יַד פַּרְעֹה
  choice: ファラオの管理のもとで
  rationale: 直訳では「ファラオの手の下で」だが、権限・統制下に置くというヘブライ語の慣用的意味を明瞭にした。
- source_word: אֹכֶל בֶּעָרִים
  choice: 町々の食糧として
  rationale: 蓄えた穀物が各都市に置かれる食糧となるという同格的・機能的関係を示した。
- source_word: וְשָׁמָרוּ
  choice: 保管させなさい
  rationale: ここでは穀物を将来に備えて保持し、守る意味。「保管する」が備蓄行政の文脈に自然だが、「守らせる」という語義もあり得るため注記した。
theological_decisions: []
