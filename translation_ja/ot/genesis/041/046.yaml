  text: Joseph was thirty years old when he stood before Pharaoh king of Egypt. And Joseph went out from before Pharaoh and traveled through all the land of Egypt.
translation:
  language: ja
  text: ヨセフは三十歳で、エジプトの王ファラオの前に立った。ヨセフはファラオの前を去り、エジプト全土を巡った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן שְׁלֹשִׁים שָׁנָה
  choice: 三十歳であった
  rationale: ヘブライ語の年齢表現を、意味を保ちながら自然な現代日本語にした。
- source_word: בְּעָמְדוֹ לִפְנֵי פַּרְעֹה
  choice: ファラオの前に立ったとき
  rationale: 前置詞付き不定詞構文の時間的意味と、宮廷で王の前に立つという表現を簡潔に保った。
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: エジプト王ファラオ
  rationale: 同格の構造を、日本語として自然で明確な称号表現にした。
- source_word: וַיֵּצֵא ... מִלִּפְנֵי פַרְעֹה
  choice: ファラオの前から出て
  rationale: יצאの移動と、前節から反復される「前」の語を保った。
- source_word: וַיַּעְבֹר בְּכָל אֶרֶץ מִצְרָיִם
  choice: エジプト全土を巡った
  rationale: עברとבְּכָלの組み合わせが表す、国中を広く移動したことを自然な日本語で示した。行政視察などの目的は本文に明記されていないため補わなかった。
