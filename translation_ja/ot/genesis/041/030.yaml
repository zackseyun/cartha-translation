id: GEN.41.30
reference: Genesis 41:30
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ֠/קָמוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵי/הֶ֔ן וְ/נִשְׁכַּ֥ח כָּל הַ/שָּׂבָ֖ע בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/כִלָּ֥ה הָ/רָעָ֖ב אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/030.yaml
  text: Then seven years of famine will arise after them[a], and all the abundance in the land of Egypt will be forgotten[b], and the famine will consume the land.
translation:
  language: ja
  text: その後、七年の飢饉が起こり、エジプトの地の豊かさ[a]はすべて忘れ去られ、飢饉がその地を食い尽くす[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「満ち足りた状態」。ヘブライ語は、特に飢饉と対照をなす満足や豊富さを表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その地を滅ぼす」。この動詞は、完全に消耗させる、または荒廃させる意味にもなり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָמוּ
  choice: その後、…が起こり
  rationale: 預言的な文脈にある完了形を未来の出来事として捉え、接続のワウと「後に」という順序関係を自然な日本語で示した。
- source_word: שֶׁבַע שְׁנֵי רָעָב
  choice: 七年の飢饉
  rationale: 構成連語を簡潔に表し、רָעָבを文脈に即して「飢饉」とした。
- source_word: אַחֲרֵיהֶן
  choice: その後
  rationale: 女性複数の接尾辞は前節の豊作の七年を指す。日本語ではその時間的連続を自然に「その後」と表した。
- source_word: וְנִשְׁכַּח
  choice: 忘れ去られ
  rationale: שׁכחのニファル形の受動的意味を保ち、後の飢饉の激しさによって以前の豊かさが記憶から消えることを表した。
- source_word: כָּל הַשָּׂבָע
  choice: 豊かさはすべて
  rationale: שָׂבָעは満ち足りた状態や豊富さを表す。食糧だけに限定せず、飢饉との対照が明確な「豊かさ」を採用した。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地の
  rationale: 地理的表現を保ちつつ、後続する「豊かさ」に自然につながる日本語にした。
- source_word: וְכִלָּה הָרָעָב אֶת הָאָרֶץ
  choice: 飢饉がその地を食い尽くす
  rationale: כלהの徹底的に消耗させる意味と、飢饉が土地を消費するという原文の強い比喩を保持した。
