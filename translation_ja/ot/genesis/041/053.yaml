  yaml_path: translation/ot/genesis/041/053.yaml
  text: Then the seven years of abundance that had been in the land of Egypt came to an end.
translation:
  language: ja
  text: こうして、エジプトの地にあった七年の豊作は終わった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְלֶינָה
  choice: 終わった
  rationale: כלהのワイイクトール形で、「七年」に対応する女性複数形。物語の進行を自然な現代日本語で示し、期間が完了した意味を明確に伝える。
- source_word: שֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: 七年の豊作
  rationale: 「豊かさ（満ち足り）」の七年間を指す連語。文脈上は収穫の豊かな期間なので、「七年の豊作」が簡潔で分かりやすい。
- source_word: אֲשֶׁר הָיָה
  choice: あった
  rationale: 先行する「七年の豊作」を修飾する関係節。日本語では単純過去の「あった」で、すでに続いていた期間が終わる関係を自然に表せる。
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地に
  rationale: אֶרֶץを省かず「地」と訳し、原文の表現を保ちながら聖書物語として自然な日本語にした。
- source_word: וַ
  choice: こうして
  rationale: 物語を次の段階へ進める接続を表す。単なる「そして」より、直前まで述べられた豊作の七年間が完了した流れを自然に示す。
