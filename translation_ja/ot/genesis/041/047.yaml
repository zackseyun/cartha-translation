base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/047.yaml
  text: During the seven years of abundance[a], the land produced by handfuls.
translation:
  language: ja
  text: 豊かな七年間、土地は豊かに実った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すると「手づかみで」。豊かな収穫を表す表現と理解される。
    reason: 本文を自然な日本語にしつつ、לִקְמָצִים の具体的な「手づかみ」の語像を示すため。
lexical_decisions:
- source_word: וַתַּעַשׂ
  choice: 実りを生み出した
  rationale: 動詞 עשה は本来「行う、造る」を意味するが、農地が主語であるため、作物を産出することを表す。「実りを」を補い、現代日本語として自然にした。
- source_word: הָאָרֶץ
  choice: 地
  rationale: ここでは全世界ではなく、文脈上エジプトの耕地を指す。「地」は原語の簡潔さを保ちつつ、土地の生産力を表せる。
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: 豊作の七年間
  rationale: שׂבע は「満ち足りること、豊かさ」を表し、この文脈では農産物が豊富な期間を指す。「豊作」は明瞭で簡潔な現代日本語である。
- source_word: לִקְמָצִים
  choice: ひと握りずつ
  rationale: קְמָץ は手またはこぶしで握れる量を指す。比喩を「豊かに」と抽象化せず、原文の具体的でやや特異な表現を残した。
theological_decisions: []
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。農業的な文脈が明確になるよう「実り」を補った一方、לִקְמָצִים の珍しい「ひと握り」の像は本文に保持した。
