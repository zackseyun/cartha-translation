  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵ֛ת שֵׁ֥ם הַ/שֵּׁנִ֖י קָרָ֣א אֶפְרָ֑יִם כִּֽי הִפְרַ֥/נִי אֱלֹהִ֖ים בְּ/אֶ֥רֶץ עָנְיִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/052.yaml
  text: And he named the second Ephraim[a], for God has made me fruitful in the land of my affliction.
translation:
  language: ja
  text: また、二番目の子をエフライム[a]と名づけた。「神が、私の苦難の地で、私を実り多い者としてくださったからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エフライム」は、ヘブライ語の「私を実り多くしてくださった」という表現と響きが似ている。
    reason: 名前と命名理由とのヘブライ語の語呂合わせを説明するため。
lexical_decisions:
- source_word: וְאֵת שֵׁם הַשֵּׁנִי קָרָא
  choice: また、二番目の子を…と名づけた
  rationale: ヘブライ語の命名表現を、文脈上その子を指すことが明瞭な自然な現代日本語にした。接続詞 וְ は「また」で保持した。
- source_word: אֶפְרָיִם
  choice: エフライム
  rationale: 固有名詞として日本語で一般的な音写を用いた。
- source_word: כִּי
  choice: …からだ
  rationale: 名づけの理由を導く説明の接続関係を自然な日本語で示した。
- source_word: הִפְרַנִי
  choice: 私を実り多い者としてくださった
  rationale: פרה のヒフィル形が表す「実り多くする」を保ち、エフライムという名との語呂合わせが伝わるようにした。神の行為への敬意を日本語として自然な補助動詞「くださった」で表した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数動詞を伴い、文脈上イスラエルの神を指すため、単数の「神」とした。
- source_word: בְּאֶרֶץ עָנְיִי
  choice: 私の苦難の地で
  rationale: 「地」と「苦難」の両要素を簡潔に保持した。「苦難を受けた地」と限定せず、原文の名詞連結が持つ幅を残した。
theological_decisions:
- issue: ヨセフの命名理由における実りと苦難の併存
  choice: 神による実りを告白しつつ、その場所を「私の苦難の地」と呼ぶ緊張をそのまま保持した。
  alternative: 苦難をエジプト到着以前の出来事だけに限定する、または家族から離れた境遇だけを指すと明示する。
  rationale: 原文は苦難の範囲を特定せず、神の恵みと苦難の記憶を並置しているため、解釈を狭めなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「実り多い者」は原語の比喩と名前の語呂合わせを保つために採用した。引用符によりヨセフ自身の命名説明であることを明確にした。
