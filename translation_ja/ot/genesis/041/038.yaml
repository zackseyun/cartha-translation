  text: וַ/יֹּ֥אמֶר פַּרְעֹ֖ה אֶל עֲבָדָ֑י/ו הֲ/נִמְצָ֣א כָ/זֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/038.yaml
  text: Then Pharaoh said to his servants[a], “Can we find a man like this[b], in whom is the spirit of God?”
translation:
  language: ja
  text: そこでファラオは家臣たちに言った。「このような人で、神の霊[a]が宿っている者を、われわれは見つけられるだろうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神からの霊」または「神的な霊」とも訳せる。ヘブライ語の表現には解釈の幅がある。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を前へ進めるワウ連続法の働きを、現代日本語で自然な順接として表した。
- source_word: עֲבָדָיו
  choice: 家臣たち
  rationale: 王宮の文脈では、単なる召使いよりもファラオに仕える廷臣・役人を含む語として「家臣」が自然である。
- source_word: הֲנִמְצָא
  choice: われわれは見つけられるだろうか
  rationale: 疑問辞を伴う一人称複数形を、否定的な答えを予想する修辞疑問として訳した。
- source_word: כָזֶה אִישׁ
  choice: この人のように……人物
  rationale: 指示表現が直前のヨセフを指すことを明確にしつつ、「このような人物」という意味を自然な日本語で保った。
- source_word: רוּחַ אֱלֹהִים
  choice: 神の霊
  rationale: 構文上最も直接的な訳を本文に置き、定冠詞のないヘブライ語句が許す「神からの霊」「神的な霊」という理解も脚注に残した。
- source_word: בּוֹ
  choice: 宿っている
  rationale: 直訳は「彼の内にある」だが、人の内に霊があることを現代日本語で自然かつ荘重に表すため「宿っている」とした。
theological_decisions:
- issue: רוּחַ אֱלֹהִים が特定の「神の霊」を指すのか、より一般的な「神からの霊／神的な霊」を指すのか
  choice: 神の霊
  alternative: 神からの霊、または神的な霊
  rationale: 物語ではヨセフの知恵が神に由来する一方、語形そのものと異教の王ファラオの発言という設定には解釈の幅がある。本文では直接的な訳を採り、脚注で曖昧さを保存した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、王の発言にふさわしい品位を保った。「われわれ」はファラオが家臣たちに問いかける場面に合う表現であり、修辞疑問の響きも自然に伝える。
