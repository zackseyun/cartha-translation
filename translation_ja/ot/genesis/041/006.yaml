  text: וְ/הִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים דַּקּ֖וֹת וּ/שְׁדוּפֹ֣ת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵי/הֶֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/006.yaml
  text: And behold[a], seven thin ears of grain, scorched by the east wind, were sprouting up after them.
translation:
  language: ja
  text: すると見よ、東風に焼けた[a]、やせ細った七つの穂が、その後から生えてきた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「東風に吹き枯らされた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: すると見よ
  rationale: 夢の中に新たな光景が突然現れる、生き生きとした物語上の標識を保った。「見よ」はやや格調があるが、聖書本文として明瞭で簡潔である。
- source_word: שֶׁבַע שִׁבֳּלִים
  choice: 七つの穂
  rationale: שִׁבֳּלִים は穀物の実がつく穂を指す。直前の文脈から穀物であることが明らかなため、自然な日本語として「穂」とした。
- source_word: דַּקּוֹת
  choice: やせ細った
  rationale: 穂が薄く実りに乏しい状態を表す。「細い」だけよりも、不作を思わせる貧弱さが自然に伝わる。
- source_word: וּשְׁדוּפֹת קָדִים
  choice: 東風に焼けた
  rationale: 熱く破壊的な東風によって穂が損なわれた状態を簡潔に表した。動詞には「吹き枯らされる」という含みもあるため、脚注に別訳を示した。
- source_word: צֹמְחוֹת
  choice: 生えてきた
  rationale: 分詞が描く、夢の光景の中で穂が伸び出てくる動きを自然な日本語で表現した。
- source_word: אַחֲרֵיהֶן
  choice: その後から
  rationale: 前節の七つの穂に続いて現れたことを示しつつ、背後から生えるという空間的な像も排除しない表現とした。
theological_decisions: []
