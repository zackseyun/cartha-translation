  text: וַ/יִּקְרָ֥א יוֹסֵ֛ף אֶת שֵׁ֥ם הַ/בְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי נַשַּׁ֤/נִי אֱלֹהִים֙ אֶת כָּל עֲמָלִ֔/י וְ/אֵ֖ת כָּל בֵּ֥ית אָבִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/051.yaml
  text: Joseph called the name of the firstborn Manasseh[a], for he said[c][b], “God has made me forget all my hardship and all my father’s house.”
translation:
  language: ja
  text: ヨセフは長男をマナセ[a]と名づけた。彼は、「神が、私のすべての苦しみと、父の家のすべてを忘れさせてくださった」と言ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「マナセ」は、ヘブライ語の「忘れさせる」という語を思わせる名。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא יוֹסֵף אֶת שֵׁם הַבְּכוֹר
  choice: ヨセフは長男を…と名づけた
  rationale: ヘブライ語の「長子の名を呼んだ」という命名表現を、意味を保ちながら自然な現代日本語にした。「長男」は男性であることが文脈上明らかな長子を簡潔に表す。
- source_word: מְנַשֶּׁה
  choice: マナセ
  rationale: 日本語聖書で広く定着した音写を用いた。後続の נַשַּׁנִי との語呂合わせは脚注で示す。
- source_word: כִּי
  choice: …と言ったからである
  rationale: 命名の理由を導く接続詞。原文で含意されるヨセフの説明を、日本語で明瞭な直接話法として示した。
- source_word: נַשַּׁנִי
  choice: 私を…忘れさせてくださった
  rationale: 動詞の使役的意味「私に忘れさせた」を保持した。神の行為についてのヨセフの発言なので、自然で品位ある敬語補助動詞「くださった」を用いた。
- source_word: כָּל עֲמָלִי
  choice: 私のすべての苦しみ
  rationale: עָמָל は労苦、悩み、苦難を表し得る。ヨセフが経験した広範な辛苦を自然に包含する「苦しみ」とした。
- source_word: וְאֵת כָּל בֵּית אָבִי
  choice: 父の家のすべて
  rationale: 「父の家」というヘブライ語の親族・家族集団を表す表現を保持し、「すべて」も原文どおり残した。個々の家族だけを指すと限定せず、原文の緊張を保つ。
theological_decisions:
- issue: ヨセフが「父の家のすべて」を忘れたという含意
  choice: ヨセフ自身の命名理由として「父の家のすべてを忘れさせてくださった」と率直に訳す。
  alternative: 「父の家にまつわる苦痛を忘れさせてくださった」または誇張的な安堵の表現と解釈する。
  rationale: 原文は「私のすべての苦しみと、父の家のすべて」を直接目的語として並べている。痛みだけを忘れたとの解釈を本文へ織り込まず、意味上・神学上の緊張を保存した。
translation_notes:
  register: 明瞭で自然な現代標準日本語としつつ、聖書本文にふさわしい落ち着いた文体を採用した。命名表現は逐語的な「名を呼んだ」ではなく「名づけた」とし、説明節は読みやすい語順に整えた。
