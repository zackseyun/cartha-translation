  text: יַעֲשֶׂ֣ה פַרְעֹ֔ה וְ/יַפְקֵ֥ד פְּקִדִ֖ים עַל הָ/אָ֑רֶץ וְ/חִמֵּשׁ֙ אֶת אֶ֣רֶץ מִצְרַ֔יִם בְּ/שֶׁ֖בַע שְׁנֵ֥י הַ/שָּׂבָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/034.yaml
  text: 'Let Pharaoh do this: let him appoint overseers over the land and take a fifth of the produce of the land of Egypt during the seven years of abundance[a].'
translation:
  language: ja
  text: ファラオはこうなさってください。全土に役人を任命し、豊作の七年間、エジプトの地の産物の五分の一を徴収してください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「豊作の七年間に、エジプトの地から五分の一を取り立ててください」。ヘブライ語の動詞は、五分の一を課す、または取り立てる意味に理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲשֶׂה
  choice: ファラオはこうなさってください
  rationale: 動詞 עשה の広い意味を保ちつつ、ヨセフがファラオに進言している文脈に合わせ、敬意ある勧告として自然な日本語にした。目的語「こう」は直前から含意される内容を示す。
- source_word: וְיַפְקֵד
  choice: 任命し
  rationale: ヒフィル形 פקד は、責任ある役目に人を就けることを表すため、行政的文脈に合う「任命する」とした。
- source_word: פְּקִדִים
  choice: 監督官たち
  rationale: 任命されて管理・監督を担う役人を指す。「役人」より職務内容が明確であり、軍事的な響きも避けられる。
- source_word: עַל הָאָרֶץ
  choice: 国中に
  rationale: ここでの אֶרֶץ はファラオの統治領域を指す。עַל の行政的な配置の意味を、日本語では自然な「国中に」で表した。
- source_word: וְחִמֵּשׁ
  choice: 五分の一を徴収させてください
  rationale: ピエル形 חמשׁ は、この文脈では五分の一を取り立てる、または集める意味と解される。ファラオが監督官を通して実施する流れを自然に示すため使役表現とした。語義の幅は脚注に残した。
- source_word: אֶת אֶרֶץ מִצְרַיִם
  choice: エジプトの地の産物
  rationale: ヘブライ語は直訳すると「エジプトの地」を目的語とするが、実際に集める対象は豊作期の収穫物と理解されるため、「産物」を補って誤解を避けた。
- source_word: בְּשֶׁבַע שְׁנֵי הַשָּׂבָע
  choice: 豊作の七年間に
  rationale: שָׂבָע は満ち足りた豊かさを表し、この物語では収穫の豊富な年々を指すため、簡潔で明瞭な「豊作」とした。
