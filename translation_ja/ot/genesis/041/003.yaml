  text: וְ/הִנֵּ֞ה שֶׁ֧בַע פָּר֣וֹת אֲחֵר֗וֹת עֹל֤וֹת אַחֲרֵי/הֶן֙ מִן הַ/יְאֹ֔ר רָע֥וֹת מַרְאֶ֖ה וְ/דַקּ֣וֹת בָּשָׂ֑ר וַֽ/תַּעֲמֹ֛דְנָה אֵ֥צֶל הַ/פָּר֖וֹת עַל שְׂפַ֥ת הַ/יְאֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/003.yaml
  text: And behold[a], seven other cows came up after them from the Nile, ugly in appearance and thin in flesh[b], and they stood beside the cows on the bank of the Nile.
translation:
  language: ja
  text: すると、そこに別の七頭の雌牛が、先の雌牛たちに続いてナイル川[a]から上って来た。その雌牛たちは姿が醜く、やせ細っていた[b]。そして、ナイル川の岸辺で、先の雌牛たちのそばに立った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「川」。エジプトを舞台とするここでは、ナイル川を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「姿が悪く、肉づきが乏しい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: すると見よ
  rationale: 夢の場面に新たな光景が突然現れる、 vivid な談話標識の力を保つ。「すると」で物語の展開を示し、「見よ」で注意喚起を表した。
- source_word: פָּרוֹת
  choice: 雌牛
  rationale: 女性複数形であり、単なる「牛」より正確に雌であることを示す。年齢は明記されないので「若い雌牛」とはしない。
- source_word: אֲחֵרוֹת
  choice: さらに…（七頭の雌牛）
  rationale: 先の七頭とは別の一群が続いて現れることを、自然な日本語で示す。
- source_word: עֹלוֹת אַחֲרֵיהֶן
  choice: その後から…上って来た
  rationale: 分詞の進行的な情景と、先の雌牛に続く順序の両方を自然に表す。
- source_word: הַיְאֹר
  choice: 大河
  rationale: 語形は定冠詞付きの「川／大河」であり、エジプトの文脈ではナイル川を指す。本文では原語の一般名詞的表現を保ち、脚注で指示対象を明示する。
- source_word: רָעוֹת מַרְאֶה
  choice: 姿は醜く
  rationale: ここで רָעוֹת は道徳的な悪ではなく、外見の悪さ・見苦しさを表す。「姿は醜く」は簡潔で視覚的。
- source_word: דַקּוֹת בָּשָׂר
  choice: 肉づきはやせ細っていた
  rationale: 直訳的な「肉が薄い」の身体的イメージを、現代日本語として自然な家畜の描写にした。
- source_word: וַתַּעֲמֹדְנָה אֵצֶל
  choice: そばに立った
  rationale: 単純な物語の継起と近接関係を明瞭に伝える。
- source_word: שְׂפַת הַיְאֹר
  choice: 大河の岸辺
  rationale: שְׂפַת の字義は「縁／唇」だが、川については「岸辺」が自然で明確。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、夢の鮮烈さを保つため「見よ」を用いた。「肉づきはやせ細っていた」は原文の身体的表現を自然に伝える。後半の二組の雌牛の区別を明確にするため「先の雌牛」と補った。
