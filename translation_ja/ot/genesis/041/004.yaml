  text: וַ/תֹּאכַ֣לְנָה הַ/פָּר֗וֹת רָע֤וֹת הַ/מַּרְאֶה֙ וְ/דַקֹּ֣ת הַ/בָּשָׂ֔ר אֵ֚ת שֶׁ֣בַע הַ/פָּר֔וֹת יְפֹ֥ת הַ/מַּרְאֶ֖ה וְ/הַ/בְּרִיאֹ֑ת וַ/יִּיקַ֖ץ פַּרְעֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/004.yaml
  text: Then the cows ugly in appearance and thin in flesh ate the seven cows beautiful in appearance and fat[a], and Pharaoh awoke.
translation:
  language: ja
  text: すると、見た目が醜く、肉のやせた雌牛が、見た目が美しく、肥えた七頭の雌牛[a]を食べた。ファラオは目を覚ました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見た目が悪く、肉のやせた雌牛が、見た目が美しく、健康な七頭の雌牛を」。原語は字義的には「悪い」と「健康な／肉付きのよい」とも訳せるが、ここでは醜くやせた牛と、美しく肥えた牛との身体的な対照を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאכַלְנָה
  choice: すると、…食べた
  rationale: 動詞の基本義「食べる」を保ち、接続形が示す夢の中の出来事の進行を、自然な日本語の「すると」で表した。「食い尽くした」は原語自体より強いため避けた。
- source_word: הַפָּרוֹת
  choice: 雌牛
  rationale: 原語は「牛」の女性複数形であり、具体的かつ自然な「雌牛」とした。
- source_word: רָעוֹת הַמַּרְאֶה
  choice: 見た目が醜く
  rationale: רָעוֹת は字義的には「悪い」だが、「見た目」と結び付いて外見の醜さを表す。対句の「見た目が美しく」との対応も保った。
- source_word: וְדַקֹּת הַבָּשָׂר
  choice: 肉のやせた
  rationale: 「肉が薄い」という原語の身体的描写を、明瞭で自然な日本語にした。「やせ細った」ほど意味を強めず、肥えた牛との対照を示す。
- source_word: אֵת שֶׁבַע הַפָּרוֹת
  choice: 七頭の雌牛を
  rationale: 目的語標識、数詞、名詞をそのまま反映し、日本語で牛を数える助数詞「頭」を用いた。
- source_word: יְפֹת הַמַּרְאֶה
  choice: 見た目が美しく
  rationale: 「見た目の美しい」という原語を自然に表し、「見た目が醜く」との並行関係を維持した。
- source_word: וְהַבְּרִיאֹת
  choice: 肥えた
  rationale: בָּרִיא は「健康な／肉付きのよい／肥えた」の幅を持つが、ここでは「肉のやせた」との身体的対照から「肥えた」が文脈に最も適する。
- source_word: וַיִּיקַץ פַּרְעֹה
  choice: そこでファラオは目を覚ました
  rationale: 「目を覚ます」という基本義を自然な現代日本語で表した。「そこで」は物語の次の出来事への移行を示す。
