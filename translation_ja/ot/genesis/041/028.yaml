source:
  edition: WLC
  text: ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל פַּרְעֹ֑ה אֲשֶׁ֧ר הָ/אֱלֹהִ֛ים עֹשֶׂ֖ה הֶרְאָ֥ה אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/028.yaml
  text: 'This is the matter that I spoke to Pharaoh: what God is doing he has shown to Pharaoh[a].'
translation:
  language: ja
  text: これは、私がファラオに申し上げたことです。神は、ご自分が行おうとしている[a]ことをファラオにお示しになったのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神が行っていること」とも訳せる。ヘブライ語の分詞は、現在進行中の行為にも、間近に起ころうとしている行為にも用いられる。ここでは夢がこれからの出来事を示す文脈から、「行おうとしている」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא הַדָּבָר
  choice: これは…ことです
  rationale: 指示代名詞と名詞句による同定表現を、現代日本語で自然に表した。「事柄」よりも、前節までの説明内容を受ける「こと」が明瞭。
- source_word: אֲשֶׁר דִּבַּרְתִּי אֶל פַּרְעֹה
  choice: 私がファラオに申し上げた
  rationale: דבר の発話の意味を保ちつつ、臣下であるヨセフが王に語る場面にふさわしい敬語とした。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 定冠詞付きであるが、ここでは特定の神、すなわち神を指す通常の用法なので、日本語では自然に「神」とした。
- source_word: עֹשֶׂה
  choice: 行おうとしている
  rationale: 分詞は進行中または切迫した行為を表し得る。夢が将来の出来事を予告する文脈を踏まえつつ、単純な未来へ断定しすぎない表現とした。
- source_word: הֶרְאָה אֶת פַּרְעֹה
  choice: ファラオにお示しになった
  rationale: ראה のヒフィル「見せる、示す」と受け手の目的語を自然な日本語にし、神を主語とするため尊敬表現を用いた。
theological_decisions:
- issue: 神の行為を表す分詞 עֹשֶׂה の時間的含意
  choice: 行おうとしている
  alternative: 行っている／これから行う
  rationale: 原語の分詞が持つ現在・切迫した未来の幅を残し、夢の解釈として将来性を示す。「これから行う」と断定すると分詞の現在的な響きが薄れ、「行っている」だけでは文脈上の来るべき出来事が伝わりにくい。
- issue: ヨセフの発話における הָאֱלֹהִים
  choice: 神
  alternative: その神
  rationale: ヘブライ語の定冠詞を機械的に訳さず、特定の唯一の神を指す日本語の通常の呼称とした。特定教派の説明は加えていない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ファラオへの発話には「申し上げた」、神の行為には「お示しになった」を用い、場面に即した敬意を自然に表した。
