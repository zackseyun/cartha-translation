base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/014.yaml
  text: Then Pharaoh sent and called for Joseph[a], and they quickly brought him out of the pit. He shaved, changed his clothes[c][b], and came to Pharaoh.
translation:
  language: ja
  text: そこでファラオは使いを遣わしてヨセフを呼び出した。人々は彼を急いで穴[a]から連れ出した。ヨセフはひげをそり、衣服を着替えて、ファラオのもとに出た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「穴」。貯水槽のような穴、または監禁場所として用いられた穴を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא אֶת־יוֹסֵף
  choice: 人を遣わしてヨセフを呼び出した
  rationale: 二つの動詞を保ちつつ、日本語で一続きの召喚行為として自然に表した。
- source_word: וַיְרִיצֻהוּ
  choice: 彼を…急いで連れ出した
  rationale: 使役的な形が示す、周囲の者がヨセフを速やかに移動させたという意味を明確にした。
- source_word: מִן־הַבּוֹר
  choice: 地下牢
  rationale: בּוֹר の字義は「穴」だが、ここでは監禁場所を指すため、文脈上明瞭な「地下牢」とし、字義的な選択肢を注記した。
- source_word: וַיְגַלַּח
  choice: ひげをそり
  rationale: 目的語は明示されないが、ファラオへの拝謁前の身支度という文脈に即して、現代日本語で自然な表現とした。
- source_word: וַיְחַלֵּף שִׂמְלֹתָיו
  choice: 着物を着替えて
  rationale: 衣服を取り替える動作を、平明で品位ある現代日本語で表した。
- source_word: וַיָּבֹא אֶל־פַּרְעֹה
  choice: ファラオのもとに出た
  rationale: 単なる移動だけでなく王の前へ出る場面に自然な日本語としつつ、「拝謁した」ほどの解釈は加えなかった。
