source:
  edition: WLC
  text: וְ/שָׁ֨ם אִתָּ֜/נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְ/שַׂ֣ר הַ/טַּבָּחִ֔ים וַ/נְּ֨סַפֶּר ל֔/וֹ וַ/יִּפְתָּר לָ֖/נוּ אֶת חֲלֹמֹתֵ֑י/נוּ אִ֥ישׁ כַּ/חֲלֹמ֖/וֹ פָּתָֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/012.yaml
  text: And there with us was a young Hebrew man[a], a servant of the captain of the guard, and we told him, and he interpreted our dreams for us[c][b]; he interpreted each man's dream according to his dream.
translation:
  language: ja
  text: そこには、私たちと一緒に、侍従長の奴隷であるヘブライ人の若者がいました。私たちが彼に夢を話すと、彼は私たちの夢を解き明かしてくれました。彼は一人一人の夢に応じて解き明かしたのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近く訳すと、「彼は一人一人に、その人の夢に応じて解き明かした」。
    reason: ヘブライ語の末尾の句が持つ配分的な構文と、「夢に応じて」という字義を示すため。
lexical_decisions:
- source_word: נַעַר עִבְרִי
  choice: ヘブライ人の若者
  rationale: נַעַרはここでは子どもというより若い男性を指し、עִבְרִיは民族的呼称なので、自然な現代日本語で「ヘブライ人の若者」とした。
- source_word: עֶבֶד
  choice: 奴隷
  rationale: ヨセフが侍従長に属する身分であることが明示されているため、拘束された法的・社会的身分を曖昧にしない「奴隷」とした。
- source_word: שַׂר הַטַּבָּחִים
  choice: 侍従長
  rationale: 字義的には処刑人・護衛隊の長を示し得る宮廷称号だが、創世記の物語で定着した人物呼称として、明瞭で品位ある「侍従長」を採用した。
- source_word: וַנְּסַפֶּר לוֹ
  choice: 私たちが彼に夢を話すと
  rationale: ספרはここで夢の内容を語ること。「話す」は現代日本語として自然であり、目的語「夢」を文脈から補って明示した。
- source_word: וַיִּפְתָּר לָנוּ אֶת חֲלֹמֹתֵינוּ
  choice: 彼はその夢を解き明かしてくれました
  rationale: פתרは夢の解釈を意味する。「私たちのために」という受益の含みを「くれました」で自然に表した。
- source_word: אִישׁ כַּחֲלֹמוֹ פָּתָר
  choice: 彼は一人一人に、その人の夢に応じた解き明かしをした
  rationale: אִישׁの配分的な意味と、各人の夢に即した個別の解釈だったという強調を、重苦しい反復を避けつつ保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、宮廷での回想にふさわしい丁寧体とした。「奴隷」は身分を明確にし、「解き明かす」は夢の解釈を表す聖書語として理解しやすく品位も保てるため採用した。
