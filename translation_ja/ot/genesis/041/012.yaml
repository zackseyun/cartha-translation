revisions:
- from: そこには、私たちと一緒に、侍従長の奴隷であるヘブライ人の若者がいました。私たちが彼に夢を話すと、彼はその夢を解き明かしてくれました。彼は一人一人に、その人の夢に応じた解き明かしをしたのです。[a]
  to: そこには、私たちと一緒に、侍従長の奴隷であるヘブライ人の若者がいました。私たちが彼に夢を話すと、彼は私たちの夢を解き明かしてくれました。彼は一人一人の夢に応じて解き明かしたのです。[a]
  rationale: 「私たちの夢」として原文の複数形および一人称複数の所有接尾辞を明示した。末尾は、各人に対応する解釈という原文の配分的強調を保ちつつ、明瞭で自然な現代日本語に整えた。職名・民族名・隷属身分の用語は維持した。
