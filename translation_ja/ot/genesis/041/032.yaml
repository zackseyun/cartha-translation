  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עַ֨ל הִשָּׁנ֧וֹת הַ/חֲל֛וֹם אֶל פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי נָכ֤וֹן הַ/דָּבָר֙ מֵ/עִ֣ם הָ/אֱלֹהִ֔ים וּ/מְמַהֵ֥ר הָ/אֱלֹהִ֖ים לַ/עֲשֹׂתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/032.yaml
  text: And as for the dream being repeated to Pharaoh twice[a], it is because the matter is fixed by God[b], and God is hastening to do it.
translation:
  language: ja
  text: ファラオに夢が二度繰り返されたのは、このことが神によって確定されており[a]、神が速やかにそれを実行されるからです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このことは神から確定されている」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「神がすぐにそれを行われる」または「神がまもなくそれを行われる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: ～のは
  rationale: 直前の夢の反復を取り上げ、その理由を説明する談話上の働きを、自然な日本語の主題提示で表した。
- source_word: הִשָּׁנוֹת הַחֲלוֹם
  choice: 同じ夢が……繰り返された
  rationale: 受動的な不定詞構文を自然な日本語にしつつ、夢が反復されたという意味を保持した。「同じ」は反復の意味から補った。
- source_word: אֶל־פַּרְעֹה
  choice: ファラオに
  rationale: 夢の提示先・経験者を示す前置詞を簡潔に表した。
- source_word: פַּעֲמָיִם
  choice: 二度
  rationale: 双数形の意味を自然な現代日本語で表した。
- source_word: כִּי
  choice: ～からです
  rationale: 夢が繰り返された理由を導く因果関係を明示した。
- source_word: נָכוֹן הַדָּבָר
  choice: このことが……確定されており
  rationale: נָכוֹן の堅固さ・定まっている状態を表し、הַדָּבָר は文脈上、夢で告げられた事柄を指すため「このこと」とした。
- source_word: מֵעִם הָאֱלֹהִים
  choice: 神によって
  rationale: 神を起源・決定主体とする句の働きを日本語で明確にした。直訳的な「神のもとから」も可能だが、この述語との組み合わせでは「神によって」が自然である。
- source_word: וּמְמַהֵר הָאֱלֹהִים
  choice: 神が速やかに……行おうとしておられる
  rationale: 分詞が示す切迫性・進行的な構えを保ち、単なる速度だけでなく実行が迫っていることを表した。
- source_word: לַעֲשֹׂתוֹ
  choice: それを行おうとしておられる
  rationale: 代名詞接尾辞が、夢で告げられた事柄の実現を指すことを保った。
theological_decisions:
- issue: הָאֱלֹהִים の数と指示対象
  choice: 神
  alternative: 神々
  rationale: 形態上は複数形だが、単数の分詞およびヨセフの発言の文脈から、ここでは唯一の神を指す。
- issue: 神による事柄の確定と実行の切迫性
  choice: 「確定されており」「行おうとしておられる」とし、決定済みであることと実行が迫ることの双方を表す
  alternative: 「確実であり、神がすぐに行われる」
  rationale: 原文の נָכוֹן と分詞 מְמַהֵר の緊張関係を保ち、神の決定と迅速な実行を一方に解消しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヨセフがファラオに説明する場面に合わせて丁寧体とし、過度に古風な敬語は避けた。脚注記号は、それぞれ נָכוֹן מֵעִם הָאֱלֹהִים と מְמַהֵר の訳語に対応する位置に置いた。
