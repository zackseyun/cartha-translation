  source_fidelity: 主文は、夢の反復、その事柄が神によって確定していること、神がその実現を速やかに行うこと、というヘブライ語の三要素をおおむね忠実に伝えている。ただし「行おうとしておられる」は意図・企図の意味にも読め、מְמַהֵר（速やかに実行する／実行を急ぐ）の切迫性をやや弱める。
