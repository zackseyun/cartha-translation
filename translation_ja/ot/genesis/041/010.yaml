base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/010.yaml
  text: Pharaoh was angry with his servants[a], and he put me in custody in the house of the captain of the guard[b], me and the chief baker.
translation:
  language: ja
  text: ファラオは自分の家臣たちに腹を立て、護衛長[b]の家に、私とパン職人の長を拘禁しました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「拘禁」と訳したヘブライ語は、監視下で身柄を拘束されることを表し、正式な牢獄の建物に入れられたとまでは限定しない。
    reason: lexical_alternative
  - marker: b
    text: 「護衛長」は宮廷の役職名。より字義的には「屠る者たち」または「処刑人たちの長」。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָצַף
  choice: 腹を立て
  rationale: 怒りを表す動詞。強度を不必要に誇張せず、現代日本語として自然に表現した。
- source_word: עֲבָדָיו
  choice: 自分の家臣たち
  rationale: 直訳的には「彼の僕たち」だが、ここではファラオに仕える献酌官と料理官という宮廷の役人を指すため、「家臣たち」とした。
- source_word: בְּמִשְׁמַר
  choice: 拘禁しました
  rationale: 監視下に置かれた拘束状態を示す語であり、独立した正式な牢獄の建物までは特定しない。
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: 護衛長の家
  rationale: שַׂר הַטַּבָּחִים は字義的には「屠る者たち／処刑人たちの長」だが、ヨセフ物語では宮廷の役職名として「護衛長」が文脈に適する。בֵּית は「家」と訳し、拘禁場所がその管轄下にあったことを保った。
- source_word: שַׂר הָאֹפִים
  choice: パン職人の長
  rationale: パンや焼き物を作る者たちの責任者を指す。一般読者に役割が明確になる表現を選んだ。
- source_word: אֹתִי ... וְאֵת שַׂר הָאֹפִים
  choice: 私とパン職人の長を
  rationale: 二つの目的語を自然な日本語の並列として表し、拘禁された両者を明確にした。
