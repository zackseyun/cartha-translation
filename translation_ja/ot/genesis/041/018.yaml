  text: וְ/הִנֵּ֣ה מִן הַ/יְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת בְּרִיא֥וֹת בָּשָׂ֖ר וִ/יפֹ֣ת תֹּ֑אַר וַ/תִּרְעֶ֖ינָה בָּ/אָֽחוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/018.yaml
  text: And behold[a], seven cows were coming up from the Nile, healthy in flesh and beautiful in form[c][b], and they grazed in the reeds.
translation:
  language: ja
  text: すると見よ、ナイル川から、肉づきがよく、姿も美しい七頭の雌牛が上って来て、葦の茂みで草を食べていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: すると見よ
  rationale: 夢の情景を生き生きと提示する談話標識の唐突さを保ちつつ、現代日本語として理解できる表現にした。
- source_word: מִן הַיְאֹר
  choice: ナイル川から
  rationale: エジプトを舞台とする文脈では、יְאֹר は一般的な川ではなくナイル川を指すのが自然である。
- source_word: עֹלֹת
  choice: 上って来て
  rationale: 分詞が描く進行中の動きを自然な日本語で表し、水中または川辺から姿を現す情景を保った。
- source_word: שֶׁבַע פָּרוֹת
  choice: 七頭の雌牛
  rationale: פָּרוֹת は雌の牛を明示するため、「牛」だけでなく「雌牛」とした。
- source_word: בְּרִיאוֹת בָּשָׂר
  choice: 肉づきがよく
  rationale: 身体が充実し健やかであることを表すヘブライ語の具体的な身体描写を、自然な現代日本語で伝える。
- source_word: וִיפֹת תֹּאַר
  choice: 姿も美しい
  rationale: 外形・容姿の美しさを表す定型的な句を、簡潔で品位ある日本語にした。
- source_word: וַתִּרְעֶינָה
  choice: 草を食べていた
  rationale: 放牧動物が草を食む意味を、一般読者に最も分かりやすい表現で示した。
- source_word: בָּאָחוּ
  choice: 葦の茂みで
  rationale: ナイル川沿いの湿地性植物を指す語として、単なる野原ではなく水辺の植生が伝わる表現を選んだ。
theological_decisions: []
