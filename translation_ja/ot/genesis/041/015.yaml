source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף חֲל֣וֹם חָלַ֔מְתִּי וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/אֲנִ֗י שָׁמַ֤עְתִּי עָלֶ֨י/ךָ֙ לֵ/אמֹ֔ר תִּשְׁמַ֥ע חֲל֖וֹם לִ/פְתֹּ֥ר אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/015.yaml
  text: And Pharaoh said to Joseph, “I have dreamed a dream, and there is no one to interpret it. But I have heard it said about you that when you hear a dream, you can interpret it.”
translation:
  language: ja
  text: ファラオはヨセフに言った。「私は夢を見たが、それを解き明かせる者がいない。だが、あなたは夢を聞けば、それを解き明かせると聞いている。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְתִּי
  choice: 私は夢を見た
  rationale: ヘブライ語では同語根の名詞と動詞を重ねているが、日本語で「夢を夢見た」とすると不自然なため、意味を明瞭に保つ自然な表現とした。
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: それを解き明かせる者がいない
  rationale: פֹתֵר は夢の意味を解釈する者を指す。「解釈する」より、聖書の夢の文脈で自然かつ格調のある「解き明かす」を用いた。
- source_word: שָׁמַעְתִּי עָלֶיךָ לֵאמֹר
  choice: あなたは……と聞いている
  rationale: 直訳的には「あなたについて、こう言われるのを聞いた」。日本語では伝聞内容を引用節としてまとめ、情報源を特定しない原文の性質を保った。
- source_word: תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ
  choice: あなたは夢を聞けば、それを解き明かせる
  rationale: 直訳に近い構文は「夢を聞いて、それを解き明かす」。文脈上、能力についての評判を述べているため、条件表現と可能表現で自然に示した。
theological_decisions:
- issue: 夢を解き明かす能力の帰属
  choice: この節ではファラオの認識どおり、ヨセフが解き明かせるとの伝聞として表現する
  alternative: 神がヨセフを通して解き明かすと先取りして明示する
  rationale: 原文はここでファラオの発言だけを記しており、神への帰属は次節のヨセフの返答で明らかになるため、本節に補足しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、王の発言にふさわしい簡潔で端正な調子とした。「ファラオ」は固有称号として一般的な表記を採用した。
