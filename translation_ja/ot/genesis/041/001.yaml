  text: וַ/יְהִ֕י מִ/קֵּ֖ץ שְׁנָתַ֣יִם יָמִ֑ים וּ/פַרְעֹ֣ה חֹלֵ֔ם וְ/הִנֵּ֖ה עֹמֵ֥ד עַל הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/001.yaml
  text: At the end of two full years[a], Pharaoh dreamed, and behold[b], he was standing by the Nile.
translation:
  language: ja
  text: さて、満二年[a]が終わったとき、ファラオは夢を見た。見ると、彼はナイル川[b]のほとりに立っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「二年の日々」。満二年の期間を意味するヘブライ語の慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「川」とも訳せる。エジプトを舞台とするこの箇所では、ナイル川を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִקֵּץ
  choice: さて、…が終わったころ
  rationale: 物語の新たな展開を示す וַיְהִי と、期間の終点を表す מִקֵּץ を、自然な日本語の時間表現としてまとめた。
- source_word: שְׁנָתַיִם יָמִים
  choice: 丸二年
  rationale: 直訳は「二年の日々」だが、期間が満了したことを表すヘブライ語の慣用句なので、「丸二年」とした。
- source_word: פַרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として、現代日本語で一般的な表記を用いた。
- source_word: חֹלֵם
  choice: 夢を見た
  rationale: 分詞形による場面描写を踏まえつつ、日本語の物語文として自然な表現にした。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 夢の中に現れた光景へ注意を向ける談話標識の働きを、現代日本語で自然に保った。
- source_word: עֹמֵד
  choice: 立っていた
  rationale: 分詞が示す継続中の情景を「立っていた」で表した。
- source_word: עַל הַיְאֹר
  choice: ナイル川のほとりに
  rationale: עַל はこの位置関係では「ほとりに」を意味し、יְאֹר はエジプトの文脈でナイル川を指す。
