  text: וְ/הָיָ֨ה הָ/אֹ֤כֶל לְ/פִקָּדוֹן֙ לָ/אָ֔רֶץ לְ/שֶׁ֨בַע֙ שְׁנֵ֣י הָ/רָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּ/אֶ֣רֶץ מִצְרָ֑יִם וְ/לֹֽא תִכָּרֵ֥ת הָ/אָ֖רֶץ בָּ/רָעָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/036.yaml
  text: That food shall be a reserve for the land for the seven years of famine that will be in the land of Egypt[c][b][a], so that the land may not be cut off by the famine.
translation:
  language: ja
  text: その食糧は、エジプトの地に来る七年間の飢饉に備え、その地のための備蓄となる。こうして、その地が飢饉によって滅びないようにする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה
  choice: ものとなる
  rationale: 指示に基づいて将来実現する用途・状態を表す文脈なので、未来的な意味を自然な日本語で示した。
- source_word: הָאֹכֶל
  choice: その食糧
  rationale: 語義は穀物に限定されない「食物・食糧」であり、前節で集める産物を受けるため「その」とした。
- source_word: לְפִקָּדוֹן
  choice: 蓄えておく
  rationale: 保管・備蓄されるものを意味する。行政的な備蓄という文脈を、明瞭で自然な日本語の動詞表現にした。
- source_word: לָאָרֶץ
  choice: 国のために
  rationale: ここで אֶרֶץ はエジプトの国土・国を指す。「国」とすることで日本語で住民を含む国家的危機の意味が自然に伝わる。
- source_word: לְשֶׁבַע שְׁנֵי הָרָעָב
  choice: 七年間の飢饉に備えて
  rationale: 前置詞 לְ の目的・将来への備えという機能を文脈に即して表した。七年はすでに夢の解釈で特定されている。
- source_word: אֲשֶׁר תִּהְיֶיןָ בְּאֶרֶץ מִצְרָיִם
  choice: エジプトの地に臨む
  rationale: 飢饉の七年間が将来エジプトに生じることを、簡潔で自然な日本語にした。
- source_word: וְלֹא תִכָּרֵת הָאָרֶץ
  choice: 国が……滅びることのないようにする
  rationale: כרת のニファル形は直訳すれば「断ち切られる」だが、この文脈では飢饉により国が壊滅・滅亡することを意味するため、日本語で明瞭な「滅びる」とした。
- source_word: בָּרָעָב
  choice: 飢饉によって
  rationale: 飢饉が国の滅亡を引き起こす手段・原因であることを示す。
