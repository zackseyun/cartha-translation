  text: וְ/כָל הָ/אָ֨רֶץ֙ בָּ֣אוּ מִצְרַ֔יְמָ/ה לִ/שְׁבֹּ֖ר אֶל יוֹסֵ֑ף כִּֽי חָזַ֥ק הָ/רָעָ֖ב בְּ/כָל הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/057.yaml
  text: And all the earth came to Egypt to Joseph to buy grain[a], because the famine was severe in all the earth.
translation:
  language: ja
  text: 全地から人々が、穀物を買うためにエジプトへ、ヨセフのもとに来た[a]。全地で飢饉が厳しかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全地」は「全土」または「世界中」とも訳せる。ヘブライ語 אֶרֶץ（エレツ）は「地」「土地」「国」を意味し得る。ここでは、飢饉の影響を受けた広い地域を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הָאָרֶץ
  choice: 全地から人々が
  rationale: 直訳的な「全地が来た」は日本語では不自然なため、土地によって住民を表す換喩を明示して「全地から人々が」とした。「全地」という広い表現は保ち、周辺諸国を広く指す物語的な誇張を狭めない。
- source_word: בָּאוּ מִצְרַיְמָה
  choice: エジプトの…もとにやって来た
  rationale: 方向を示す語尾を「エジプト…に」で表し、בוא の基本的な移動の意味を自然な日本語の「やって来た」で訳した。
- source_word: לִשְׁבֹּר
  choice: 穀物を買うため
  rationale: 飢饉の記事における שׁבר は穀物を購入・調達することを意味するため、目的語「穀物」を補って明確にした。
- source_word: אֶל יוֹסֵף
  choice: ヨセフのもとに
  rationale: 前置詞の基本的な方向性を保ちつつ、穀物管理者ヨセフを訪ねたことが自然に伝わる表現とした。「ヨセフから」として取引関係を過度に明示することは避けた。
- source_word: כִּי
  choice: …からである
  rationale: 人々がエジプトへ来た理由を導く因果関係を、明瞭な現代日本語で示した。
- source_word: חָזַק הָרָעָב
  choice: 飢饉が非常に厳しかった
  rationale: חזק の字義は「強かった」だが、飢饉については「厳しかった」が自然である。文脈上の強意を「非常に」で表した。
- source_word: בְּכָל הָאָרֶץ
  choice: 全地で
  rationale: 冒頭と同じ אֶרֶץ の広い範囲を「全地」として反復し、原文の修辞的な強調を保った。
theological_decisions: []
