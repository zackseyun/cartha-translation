id: GEN.41.39
reference: Genesis 41:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר פַּרְעֹה֙ אֶל יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְ/ךָ֖ אֶת כָּל זֹ֑את אֵין נָב֥וֹן וְ/חָכָ֖ם כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/041/039.yaml
  text: Then Pharaoh said to Joseph[a], “Since God has made all this known to you, there is no one as discerning and wise as you.”
translation:
  language: ja
  text: そこでファラオはヨセフに言った。「神がこのすべてをあなたに知らせた以上[a]、あなたほど聡明で知恵のある者はいない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神がこのすべてをあなたに知らせた後では」。ヘブライ語の前置詞は字義的には「後に」だが、ここではファラオの結論の根拠を示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: ワウ継続法による物語の進行を、自然な現代日本語で表した。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として、日本語聖書で広く通用する表記を用いた。
- source_word: אַחֲרֵי
  choice: 以上
  rationale: 字義的には「後に」だが、ここでは神が知らせたことを根拠としてファラオが結論を述べている。「以上」はその推論関係を自然に示す。字義的な選択肢は脚注に残した。
- source_word: הוֹדִיעַ
  choice: 知らせた
  rationale: ידעのヒフィル形が持つ「知るようにする、知らせる」という使役的意味を簡潔に表した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 動詞の形と文脈では単数の神を指しており、自然な日本語として「神」とした。
- source_word: אֶת כָּל זֹאת
  choice: このすべて
  rationale: ヨセフが解き明かした事柄全体を指す簡潔な表現とした。
- source_word: אֵין
  choice: ……者はいない
  rationale: 存在否定を、後続する人物比較に合う自然な日本語にした。
- source_word: נָבוֹן
  choice: 聡明
  rationale: 物事を理解し見分ける洞察力を表し、ヨセフが示した判断力にふさわしい語を選んだ。
- source_word: וְחָכָם
  choice: 知恵のある
  rationale: חכםの通常の意味を保ちつつ、「聡明」と並ぶ二つの資質として訳し分けた。
- source_word: כָּמוֹךָ
  choice: あなたほど
  rationale: 否定を伴う比較を、現代日本語で自然な形にした。
theological_decisions:
- issue: ファラオの発言における אֱלֹהִים の指示対象
  choice: 神
  alternative: 神々
  rationale: אֱלֹהִים は形態上複数に見える場合があるが、ここでは単数形の動詞を伴い、ヨセフに夢の意味を知らせた神を指すため、単数の「神」が文法と文脈に最も即している。
translation_notes:
  register: 明快で格調を保った現代標準日本語。物語の流れを「そこで」で示し、ファラオの推論は「以上」で自然に表した。原文にない敬語的・恩恵的含意を加えないため、「知らせてくださった」ではなく「知らせた」とした。
