base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/017.yaml
  text: And he was afraid and said[a], “How awesome this place is! This is none other than the house of God[b], and this is the gate of heaven.”
translation:
  language: ja
  text: 彼は恐れて[a]言った。「この場所は、なんと畏れ多い場所だろう。ここは神の家にほかならない。ここは天の門だ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恐れて」と「畏れ多い」は同じヘブライ語の語根に由来する。ここには、恐怖と畏敬の両方の響きがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: 彼は恐れて
  rationale: 語根 ירא の物語上の反応を率直に表し、単なる敬虔さに限定せず、実際の恐れを保つ。
- source_word: מַה נּוֹרָא
  choice: なんと畏れ多いことか
  rationale: נוֹרָא が含む恐れと聖なる畏敬の両面を、現代日本語で自然かつ荘重に表す。
- source_word: הַמָּקוֹם הַזֶּה
  choice: この場所
  rationale: 指示表現を簡潔で自然な日本語にした。
- source_word: אֵין זֶה כִּי אִם
  choice: ここはまさしく
  rationale: 排他的で強い同定を示すヘブライ語の慣用句を、「ただの」より荘重で自然な強調として表した。
- source_word: בֵּית אֱלֹהִים
  choice: 神の家
  rationale: 構文を明瞭に訳し、後代の神殿を先取りして限定することなく、聖所的な響きを保つ。
- source_word: שַׁעַר הַשָּׁמָיִם
  choice: 天への門
  rationale: 属格を関係的に自然な日本語で表し、地上から天の領域へ通じる門という文脈上のイメージを明確にする。
theological_decisions:
- issue: 単数を指す אֱלֹהִים の訳
  choice: 神
  alternative: 神々
  rationale: 形態上は複数形だが、直前の幻と契約の文脈ではヤコブに現れた唯一の神を指すため、単数で訳す。
- issue: 聖なる場面における נוֹרָא の含意
  choice: 畏れ多い
  alternative: 恐ろしい
  rationale: 恐怖を消さず、それと同時に神の臨在への畏敬を表す。否定的な恐怖だけにも、穏やかな感嘆だけにも限定しない。
- issue: שַׁעַר הַשָּׁמָיִם の関係表現
  choice: 天への門
  alternative: 天の門
  rationale: 原文の連語は「天の門」とも直訳できるが、夢に現れた地と天との連絡という文脈を自然な日本語で示すため「天への門」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、神の臨在に対する恐れと畏敬が共存する荘重さを保った。「畏れ多い」は日常語より格調があるが、聖なる場面に適し、一般読者にも理解できる。
