source:
  edition: WLC
  text: וְ/אֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְ/ךָ֔ וְ/יַפְרְ/ךָ֖ וְ/יַרְבֶּ֑/ךָ וְ/הָיִ֖יתָ לִ/קְהַ֥ל עַמִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/003.yaml
  text: And may God Almighty bless you[a], and make you fruitful, and multiply you[b], so that you may become an assembly of peoples.
translation:
  language: ja
  text: 全能の神[a]があなたを祝福し、あなたを実り豊かにし、あなたを多くして、あなたが諸民族の集まりとなるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「エル・シャダイ」。伝統的に「全能の神」と訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: 全能の神
  rationale: 神の称号を音写せず意味で訳した。日本語聖書で定着しており、文脈にも適する。原語の形は脚注に残した。
- source_word: יְבָרֵךְ
  choice: 祝福してくださるように
  rationale: 祝福の言葉における願望・祈願的な未完了形を、単純未来ではなく自然な願いの表現で示した。
- source_word: וְיַפְרְךָ
  choice: 子孫を豊かにし
  rationale: 使役形の意味を保ちつつ、この族長物語の文脈で何が豊かになるのかを明瞭にした。
- source_word: וְיַרְבֶּךָ
  choice: その数を増し加え
  rationale: 増加させるという使役的意味を表し、「その数」によって直前の子孫とのつながりを自然に示した。
- source_word: וְהָיִיתָ
  choice: こうして、あなたが…となるように
  rationale: 前の祝福に続く帰結を示しながら、祝福全体の願望的な調子を保った。
- source_word: לִקְהַל עַמִּים
  choice: 諸民族の集まり
  rationale: קהל の集合体・共同体という意味と、עמים の複数性を保った。「諸民族」により、単なる多数の個人ではなく複数の民を示す。
theological_decisions:
- issue: 神の称号 אֵל שַׁדַּי の訳し方
  choice: 全能の神
  alternative: エル・シャダイ
  rationale: 称号は意味を訳す方針に従い、本文では広く理解される訳語を用いた。一方、語義には議論の余地があるため、原語の音写と伝統的訳であることを脚注で明示した。
- issue: 「諸民族の集まり」の指示内容
  choice: 原文どおり集合体を表す表現にとどめる
  alternative: 多くの民の先祖となる
  rationale: 文脈上は子孫の増加が念頭にあるが、本文は「先祖」とは明言しないため、解釈を本文へ加えなかった。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、祝福の言葉としての荘重さを保った。「くださるように」で祈願を自然に表し、「諸民族の集まり」は原文の複数性と集合的意味を保持した。
