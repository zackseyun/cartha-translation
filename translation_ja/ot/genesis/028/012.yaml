  text: וַֽ/יַּחֲלֹ֗ם וְ/הִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָ/ה וְ/רֹאשׁ֖/וֹ מַגִּ֣יעַ הַ/שָּׁמָ֑יְמָ/ה וְ/הִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְ/יֹרְדִ֖ים בּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/012.yaml
  text: And he dreamed[a], and behold, a ladder was set up on the earth, and its top reached to heaven; and behold[b], the angels of God were ascending and descending on it.
translation:
  language: ja
  text: 彼は夢を見た。見ると、地の上に階段[a]が据えられており、その頂は天に達していた。さらに見ると、神の御使いたちがその上を[b]上り下りしていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「はしご」とも訳せる。ヘブライ語は、より広く昇り降りするための構造物を指す可能性がある。
    reason: lexical_alternative
  - marker: b
    text: 「彼の上を」と取ることもできる。ただし、文脈上もっとも自然な指示対象は階段である。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּחֲלֹם
  choice: 彼は夢を見た
  rationale: 物語を進めるワウ継続法を、現代日本語で自然な叙述として表した。
- source_word: וְהִנֵּה
  choice: 見ると／さらに見ると
  rationale: 夢の中で光景が鮮やかに現れる提示の力を保ちつつ、古風すぎる「見よ」を避けた。二度目も訳出して場面の展開を示した。
- source_word: סֻלָּם
  choice: 階段
  rationale: 語は昇降のための構造物を指すが、横木のある狭い「はしご」に限定されない。御使いたちが上り下りする光景にも自然に合う。伝統的な「はしご」は脚注に残した。
- source_word: מֻצָּב אַרְצָה
  choice: 地の上に立っており
  rationale: 据えられた状態を表す受動分詞と、地に向かう・地に接する方向形を、日本語として自然な静態描写にした。
- source_word: וְרֹאשׁוֹ מַגִּיעַ הַשָּׁמָיְמָה
  choice: その頂は天に達していた
  rationale: 物体の最上部を表す רֹאשׁ を「頂」とし、地と天を結ぶ垂直的な構図を明確に保った。
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: 神の御使いたち
  rationale: 幻の文脈では超自然的な使者を指すため、現代の聖書日本語として明瞭で品位のある「御使い」を選んだ。
- source_word: עֹלִים וְיֹרְדִים
  choice: 上り下りしていた
  rationale: 二つの分詞が描く継続的な動きを、自然な日本語の進行的描写で表した。原文どおり「上る」を先に置いた。
- source_word: בּוֹ
  choice: その上を
  rationale: 最も近い先行詞である「階段」を受ける解釈が文脈上もっとも自然である。男性単数接尾辞がヤコブを指す可能性は脚注に示した。
theological_decisions:
- issue: סֻלָּם が表す構造物の形状
  choice: 階段
  alternative: はしご
  rationale: この希少語は昇降用の構造物を指すが、その具体的形状を確定できない。「階段」は複数の御使いが昇降する場面に自然であり、「はしご」に限定しない一方、伝統的な訳語も脚注で保持した。
- issue: בּוֹ の指示対象
  choice: 階段の上を
  alternative: 彼の上を／彼のそばを
  rationale: 文法上、男性単数形の「階段」とヤコブのいずれも候補になりうる。直近の先行詞と昇降の描写から本文では階段を採ったが、ヤコブを指す可能性を排除せず脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、夢の光景にふさわしい品位を保った。「見よ」の直訳ではなく「見ると」を用いて הִנֵּה の鮮明な提示機能を自然に表現した。固有名は原節に現れないため補わず、「彼」とした。
