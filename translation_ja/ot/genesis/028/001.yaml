  text: וַ/יִּקְרָ֥א יִצְחָ֛ק אֶֽל יַעֲקֹ֖ב וַ/יְבָ֣רֶךְ אֹת֑/וֹ וַ/יְצַוֵּ֨/הוּ֙ וַ/יֹּ֣אמֶר ל֔/וֹ לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/001.yaml
  text: Then Isaac called Jacob and blessed him and commanded him[a], saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: ja
  text: そこでイサクはヤコブを呼び、彼を祝福して命じ、こう言った。「カナンの娘たち[a]から妻を迎えてはならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「カナンの娘たち」は、カナン人の女性たちを指すヘブライ語の表現。
    reason: 原文の字義的な言い回しを本文に保ちながら、その意味を明確にするため。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び
  rationale: קרא は אֶל と人を伴い、その人を呼ぶ、または呼び寄せることを表す。文脈上、過度に改まった「召喚する」より自然な「呼ぶ」が適切。
- source_word: וַיְבָרֶךְ
  choice: 祝福して
  rationale: ברך の基本的な意味をそのまま表し、物語を進める連続動作として訳した。
- source_word: וַיְצַוֵּהוּ
  choice: 命じ
  rationale: צוה は権威をもって命令することを表す。父から息子への強い指示を保つため、「言い聞かせ」ではなく「命じ」とした。
- source_word: וַיֹּאמֶר לוֹ
  choice: こう言った
  rationale: 直後の直接話法を自然に導入しつつ、לוֹ の相手が直前のヤコブであることは日本語の文脈で明らかなため、冗長な「彼に」を省いた。
- source_word: לֹא תִקַּח
  choice: 迎えてはならない
  rationale: 結婚相手を「取る」というヘブライ語表現を現代日本語の婚姻表現に合わせ、「妻を迎える」とした。否定命令の強さは「てはならない」で保持した。
- source_word: אִשָּׁה
  choice: 妻
  rationale: ここでは婚姻が問題であり、אִשָּׁה は一般的な「女」ではなく「妻」を意味する。
- source_word: מִבְּנוֹת כְּנָעַן
  choice: カナンの娘たちの中から
  rationale: 原文の「カナンの娘たち」という表現を本文に残した。「中から」により、妻を選ぶ集団を示す מִן の意味を自然な日本語で表した。
- source_word: וַ
  choice: そこで
  rationale: 物語を進める接続を示す。前後関係を受けた展開として、機械的な「そして」より「そこで」が明瞭で自然。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、父の権威ある命令と聖書物語にふさわしい品位を保った。連続するヘブライ語の動詞は、日本語で不自然な反復にならないよう一文にまとめた。
