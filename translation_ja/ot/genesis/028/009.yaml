  text: וַ/יֵּ֥לֶךְ עֵשָׂ֖ו אֶל יִשְׁמָעֵ֑אל וַ/יִּקַּ֡ח אֶֽת מָחֲלַ֣ת בַּת יִשְׁמָעֵ֨אל בֶּן אַבְרָהָ֜ם אֲח֧וֹת נְבָי֛וֹת עַל נָשָׁ֖י/ו ל֥/וֹ לְ/אִשָּֽׁה־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/009.yaml
  text: So Esau went to Ishmael and took Mahalath[a], the daughter of Ishmael son of Abraham, the sister of Nebaioth, as a wife for himself in addition to his wives.
translation:
  language: ja
  text: そこでエサウはイシュマエルのもとへ行き、アブラハムの子イシュマエルの娘で、ネバヨトの姉妹であるマハラトを、すでにいた妻たちに加えて[a]、自分の妻とした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「妻たちのほかに」。ヘブライ語の表現は、エサウがそれまでの妻たちに代えてではなく、もう一人の妻としてマハラトを迎えたことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל
  choice: そこでエサウはイシュマエルのもとへ行き
  rationale: 物語を進める連続形を「そこで」で受け、人物を目的地とする אֶל は自然な日本語の「〜のもとへ」とした。
- source_word: וַיִּקַּח
  choice: 妻とした
  rationale: 直訳は「取った」だが、後続の לְאִשָּׁה が婚姻を明示するため、現代日本語では両者をまとめて「妻とした」とするのが自然である。
- source_word: מָחֲלַת
  choice: マハラト
  rationale: 人名を原語の発音に沿って音写した。
- source_word: בַּת יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: アブラハムの子イシュマエルの娘
  rationale: マハラトの父と祖父を示す連語の関係を保ちつつ、明瞭な日本語にした。
- source_word: אֲחוֹת נְבָיוֹת
  choice: ネバヨトの妹
  rationale: אחות は年齢を特定しない「姉妹」だが、日本語の系譜表現として自然な「妹」を採用した。ただし原文自体は姉か妹かを明示しない。
- source_word: עַל נָשָׁיו
  choice: すでにいた妻たちに加えて
  rationale: ここでの עַל は空間的な「上に」ではなく追加を表し、従来の妻を替えたのではなく、さらに妻を迎えた意味を明確にした。
- source_word: לוֹ לְאִשָּׁה
  choice: 自分の妻とした
  rationale: לוֹ の本人に帰する含みと לְאִשָּׁה の婚姻上の目的・結果を、簡潔で自然な日本語で表した。
