- from: エサウは、イサクがヤコブを祝福し、彼をパダン・アラムへ送り、そこから妻を迎えさせようとしたこと、また彼を祝福した際、「カナンの娘たちの中から妻を迎えてはならない」と命じたことを知った。
  to: エサウは、イサクがヤコブを祝福し、そこから妻を迎えるために彼をパダン・アラムへ送ったこと、またヤコブを祝福した際、「カナンの娘たちの中から妻を迎えてはならない」と命じたことを知った。
  rationale: 派遣の目的を「そこから妻を迎えるために」として、לָקַחַת לוֹ מִשָּׁם אִשָּׁהを直接表現した。「ヤコブを祝福した際」として、当該箇所の主語・目的語の指示を明確にした。原文に対応する日本語本文上、脚注を要する語義上の曖昧さはない。
  reviewer_model: gpt-5.6-terra
