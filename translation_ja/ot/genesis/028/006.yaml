  text: וַ/יַּ֣רְא עֵשָׂ֗ו כִּֽי בֵרַ֣ךְ יִצְחָק֮ אֶֽת יַעֲקֹב֒ וְ/שִׁלַּ֤ח אֹת/וֹ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם לָ/קַֽחַת ל֥/וֹ מִ/שָּׁ֖ם אִשָּׁ֑ה בְּ/בָרֲכ֣/וֹ אֹת֔/וֹ וַ/יְצַ֤ו עָלָי/ו֙ לֵ/אמֹ֔ר לֹֽא תִקַּ֥ח אִשָּׁ֖ה מִ/בְּנ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/006.yaml
  text: Esau saw that Isaac had blessed Jacob and sent him to Paddan-aram to take a wife for himself from there[a], and that when he blessed him, he commanded him, saying, “You shall not take a wife from the daughters of Canaan.”
translation:
  language: ja
  text: エサウは、イサクがヤコブを祝福し、そこから妻を迎えるために彼をパダン・アラムへ送ったこと、またヤコブを祝福した際、「カナンの娘たちの中から妻を迎えてはならない」と命じたことを知った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא עֵשָׂו
  choice: エサウは……知った
  rationale: ראהは基本的に「見る」だが、後続するכִּי節の内容を認識する意味なので、現代日本語では「知った」が自然。物理的に目撃したとの限定は避ける。
- source_word: כִּי בֵרַךְ יִצְחָק אֶת יַעֲקֹב
  choice: イサクがヤコブを祝福し
  rationale: כִּי以下をエサウが認識した内容として示す。日本語では文脈により先行時を明確にできるため、過去完了に相当する補足語は加えない。
- source_word: וְשִׁלַּח אֹתוֹ פַּדֶּנָה אֲרָם
  choice: 彼をパダン・アラムへ送り
  rationale: 地名は慣用的に音写し、方向を示す語尾־ָהは「へ」で表す。
- source_word: לָקַחַת לוֹ מִשָּׁם אִשָּׁה
  choice: そこから妻を迎えさせようとした
  rationale: לקח אשהは婚姻の文脈で「妻を迎える」。לוֹはヤコブ自身の妻であることを含み、使役目的を自然な日本語で表した。
- source_word: בְּבָרֲכוֹ אֹתוֹ
  choice: 彼を祝福した際
  rationale: 前置詞בְּを付帯状況・時として取り、「祝福した際」と簡潔に表す。主語は直前のイサク。
- source_word: וַיְצַו עָלָיו לֵאמֹר
  choice: 命じたこと
  rationale: צוהの命令の強さを保つ。日本語の直接引用自体がלֵאמֹרの機能を担うため、冗長な「言って」は置かない。
- source_word: לֹא תִקַּח אִשָּׁה
  choice: 妻を迎えてはならない
  rationale: 否定未完了形の禁止を、明確で格調を保つ現代日本語にした。
- source_word: מִבְּנוֹת כְּנָעַן
  choice: カナンの娘たちの中から
  rationale: ヘブライ語の「カナンの娘たち」という表現を保ちつつ、מןの選択範囲を「中から」で明示する。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。長い従属構造は維持しつつ、「こと、また……こと」で認識内容を整理した。引用内は父の命令にふさわしい端正な文体とした。
