    issue: 「そこから妻を迎えさせようとした」
    rationale: 原文は「彼がそこから自分のために妻を迎えるために、彼をパダン・アラムへ送った」である。日本語案の使役形と「ようとした」は、原文に明示されない使役的・未達的な含意を生じうる。
  revised_text: エサウは、イサクがヤコブを祝福し、そこから妻を迎えるために彼をパダン・アラムへ送ったこと、またヤコブを祝福した際、「カナンの娘たちの中から妻を迎えてはならない」と命じたことを知った。
