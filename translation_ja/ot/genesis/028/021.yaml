  text: וְ/שַׁבְתִּ֥י בְ/שָׁל֖וֹם אֶל בֵּ֣ית אָבִ֑/י וְ/הָיָ֧ה יְהוָ֛ה לִ֖/י לֵ/אלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/021.yaml
  text: and I return in peace to my father's house[a], and Yahweh will be my God.
translation:
  language: ja
  text: そして私が無事に父の家へ帰り[a]、ヤハウェは私の神となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「平安のうちに父の家へ帰り」。ここで「平安」は、安全、健やかさ、無事であることを含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתִּי
  choice: そして私が……帰るなら
  rationale: 動詞 שׁוב は「帰る、戻る」。この節は前節から続くヤコブの条件文の一部なので、日本語では将来の帰還を「帰るなら」と表し、文脈上の条件関係を明確にした。
- source_word: בְשָׁלוֹם
  choice: 無事に
  rationale: שָׁלוֹם は平安、健全、安寧、安全を含む。旅からの帰還という文脈では「無事に」が自然だが、語の広がりは脚注に残した。
- source_word: אֶל בֵּית אָבִי
  choice: 父の家へ
  rationale: 直訳に近く、父の家族・家産を含む家の意味を保ちながら、現代日本語として自然である。
- source_word: וְהָיָה יְהוָה לִי לֵאלֹהִים
  choice: ヤハウェは私の神となる
  rationale: 「ヤハウェが私にとって神となる」という関係的な表現を自然な日本語にした。接続詞 וְ の結果的な働きは、前半の「なら」と後半の主節という構造で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を称号に置き換えず、日本語で一般的な音写によって示した。
theological_decisions:
- issue: ヤコブの言葉が、ヤハウェを自分の神とすることを条件付きで述べるのか、それとも単に誓願として告白するのか
  choice: 前節から続く条件文として「帰るなら、ヤハウェは私の神となる」と訳し、条件・帰結の緊張を保つ。
  alternative: 「そして私は無事に父の家へ帰り、ヤハウェは私の神となる」と並列的に訳す。
  rationale: 20節の אִם（もし）から続く構文と本節中央の区切りは、後半を帰結として読むことを支持する。一方、ヤコブの動機や信仰を断定的に評価する語句は加えなかった。
translation_notes:
  register: 明快で現代的な標準語を用い、「無事に」で旅の文脈に合う自然さを確保した。神名は荘重さを損なわない「ヤハウェ」とし、条件構文は簡潔に示した。
