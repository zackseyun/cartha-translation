source:
  edition: WLC
  text: וְ/הִנֵּ֨ה יְהוָ֜ה נִצָּ֣ב עָלָי/ו֮ וַ/יֹּאמַר֒ אֲנִ֣י יְהוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔י/ךָ וֵ/אלֹהֵ֖י יִצְחָ֑ק הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔י/הָ לְ/ךָ֥ אֶתְּנֶ֖/נָּה וּ/לְ/זַרְעֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/013.yaml
  text: And behold[a], Yahweh was standing above it, and he said, “I am Yahweh, the God of Abraham your father and the God of Isaac[b]. The land on which you are lying I will give to you and to your offspring.”
translation:
  language: ja
  text: すると見よ、ヤハウェがその上に立っておられ[a]、こう言われた。「わたしはヤハウェ、あなたの父祖アブラハムの神、イサクの神である。あなたが横たわっている地を、わたしはあなたとあなたの子孫に与える。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼のそばに立っておられ」「彼の上方に立っておられ」。代名詞が階段ではなくヤコブを指す場合。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנֵּה
  choice: すると見よ
  rationale: 物語の展開を示す接続と、幻の光景を鮮やかに提示する注意喚起の力を保つ。現代日本語でも荘重な聖書叙述として理解できる表現。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: נִצָּב עָלָיו
  choice: その上に立っておられ
  rationale: 分詞の継続的・状態的な含意を表し、直前の男性単数名詞である階段を代名詞の指示対象とする。ただし指示対象の曖昧さは脚注に残す。
- source_word: אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: あなたの父祖アブラハムの神
  rationale: אָבִיךָを直系の父ではなく祖先を含む呼称として自然な日本語にし、アブラハムとヤコブの関係を明確にする。
- source_word: הָאָרֶץ אֲשֶׁר אַתָּה שֹׁכֵב עָלֶיהָ
  choice: あなたが横たわっているこの地
  rationale: 約束の文脈におけるהָאָרֶץを「地」とし、分詞が示す現在継続中の姿勢と空間関係を自然に表す。
- source_word: לְךָ אֶתְּנֶנָּה
  choice: わたしはあなたに与える
  rationale: 約束の文脈にある未完了形を未来的な確約として訳す。
- source_word: וּלְזַרְעֶךָ
  choice: あなたの子孫に
  rationale: זֶרַעの集合的な意味を、現代日本語で自然かつ包括的に表す。
theological_decisions:
- issue: 神名 יְהוָה の訳出
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の四文字神名を称号で代替せず、固有名として示す。
- issue: עָלָיו の指示対象
  choice: その上に（階段の上に）
  alternative: 彼のそばに／彼の上方に（ヤコブを指す）
  rationale: 直前の文脈上の先行詞である階段を指す読みを本文に採る一方、男性単数接尾辞はヤコブを指す可能性もあるため、脚注で曖昧さを保持する。
- issue: אָבִיךָ におけるアブラハムとヤコブの関係
  choice: 父祖
  alternative: 父
  rationale: ヘブライ語の「父」は祖先を含み得る。日本語で「父」とすると実父と誤解されやすいため、系譜的な関係を自然に表す「父祖」とした。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の顕現と約束にふさわしい品位を保った。「見よ」は原文の提示機能を残すため意図的に用いた。脚注記号[a]は該当する曖昧な句の直後に置いた。
