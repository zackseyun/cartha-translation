  text: Then Jacob made a vow[a], saying, “If God will be with me and will keep me on this way that I am going[d][c][b], and will give me bread to eat and clothing to wear,”
translation:
  language: ja
  text: そこでヤコブは誓願を立てて言った。「もし神が私とともにいて、私が行くこの道で私を守ってくださり、食べるためのパンと着るための衣服を与えてくださるなら、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּדַּר יַעֲקֹב נֶדֶר
  choice: そこでヤコブは誓願を立てて
  rationale: 動詞נדרと同根の名詞נֶדֶרによる慣用表現。日本語では「誓願を立てる」が、厳粛な行為を明示しつつ自然である。
- source_word: לֵאמֹר
  choice: 言った
  rationale: 誓願の内容を導入する標準的で自然な表現。
- source_word: אִם
  choice: もし
  rationale: 条件節をそのまま示し、ヤコブの確信または疑念の度合いを訳文で決めつけない。
- source_word: אֱלֹהִים עִמָּדִי
  choice: 神が私とともにいて
  rationale: 直前にヤコブへ現れた神を指す。「ともにいる」は神の臨在を自然かつ端正に表す。
- source_word: וּשְׁמָרַנִי
  choice: 私を守り
  rationale: שׁמרの保護・見守りの意味を簡潔に表す。
- source_word: בַּדֶּרֶךְ הַזֶּה אֲשֶׁר אָנֹכִי הוֹלֵךְ
  choice: 私が行くこの旅路で
  rationale: דֶּרֶךְの「道」の像を「旅路」で保ち、実際の旅という文脈と関係節の構造を自然な日本語で示す。
- source_word: וְנָתַן לִי לֶחֶם לֶאֱכֹל
  choice: 食べるパンを与えてくださり
  rationale: לֶחֶםを具体的な「パン」として保持し、神を主語とするため敬語補助動詞を用いる。
- source_word: וּבֶגֶד לִלְבֹּשׁ
  choice: 着る衣服を
  rationale: 「衣服」はבֶּגֶדの意味を明確かつ端正に伝え、目的を表す不定詞も保持する。
theological_decisions:
- issue: ヤコブの条件付き誓願の性質
  choice: 「もし」と訳して条件性を保つ
  alternative: 「神がともにいてくださるとき」「神が必ずともにいてくださるので」
  rationale: אִםは自然に条件を表す。これを確信とも疑念とも断定せず、本文にある神学的緊張を保持する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、誓願にふさわしい端正さを保った。原文は次節まで続く条件文なので、本節末も閉じずに読点で終える。
