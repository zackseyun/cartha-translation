language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָ/אֶ֣בֶן הַ/זֹּ֗את אֲשֶׁר שַׂ֨מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְ/כֹל֙ אֲשֶׁ֣ר תִּתֶּן לִ֔/י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥/נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/022.yaml
  text: And this stone[a], which I have set up as a pillar, will be God’s house[b], and of all that you give me I will surely give a tenth to you.
translation:
  language: ja
  text: わたしが石柱として立てたこの石は、神の家となります。そして、あなたがわたしに与えてくださるすべてのものの十分の一を、必ずあなたにささげます。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַצֵּבָה
  choice: 石柱
  rationale: 立てられた石の記念物・標識を指す。文脈の具体的な像を保ち、現代日本語でも理解しやすい。
- source_word: יִהְיֶה בֵּית אֱלֹהִים
  choice: 神の家となります
  rationale: 構文上は「神の家」を意味する。「となります」は、この石についてヤコブが誓願の中で述べる将来的な位置づけを自然に表す。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 直前の文脈でヤコブに現れた神を指しており、一般的な神格ではない。
- source_word: תִּתֶּן לִי
  choice: あなたがわたしに与えてくださる
  rationale: 単純な「与える」の意味を保ちつつ、神に対する発話として自然で敬意ある日本語にした。条件的な枠組みは誓願全体の文脈から理解される。
- source_word: עַשֵּׂר אֲעַשְּׂרֶנּוּ
  choice: 十分の一を、必ず……ささげます
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「必ず」で表し、専門的な宗教用語に頼らず内容を明示した。
- source_word: לָךְ
  choice: あなたに
  rationale: 誓願による十分の一の受け手が神であることを直接表す。
- source_word: הָאֶבֶן הַזֹּאת אֲשֶׁר שַׂמְתִּי
  choice: わたしが……立てたこの石
  rationale: 関係節を日本語として自然な前置修飾にし、「立てた」によって石を据え起こした動作を表した。
theological_decisions:
- issue: 石に関するヤコブの誓願の性質
  choice: 石が「神の家となる」という原文の表現を保ち、神との出会いに結びつく聖なる場所・しるしとして読めるようにする。
  alternative: 石そのものが神殿になる、または後代の神殿を直接預言するものと明示する。
  rationale: 本文はこの石が「神の家となる」と述べるが、その意味を後代の神殿神学によって限定してはいないため、解釈的説明を本文へ加えない。
- issue: 十分の一を表す誓願表現
  choice: 神から与えられるすべてのものの十分の一を、必ず神にささげるとの約束として訳す。
  alternative: 後代の制度的な十分の一税・献金として専門用語化する。
  rationale: 本文の強意を「必ず」で保ちながら、モーセ律法や教会制度を創世記へ読み込まない。
translation_notes:
  register: 明瞭で現代的かつ礼節ある標準日本語。「石柱」「十分の一」など具体的で一般読者に分かりやすい語を用い、後代の制度的含意は加えていない。
