language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הִנֵּ֨ה אָנֹכִ֜י עִמָּ֗/ךְ וּ/שְׁמַרְתִּ֨י/ךָ֙ בְּ/כֹ֣ל אֲשֶׁר תֵּלֵ֔ךְ וַ/הֲשִׁ֣בֹתִ֔י/ךָ אֶל הָ/אֲדָמָ֖ה הַ/זֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזָבְ/ךָ֔ עַ֚ד אֲשֶׁ֣ר אִם עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר דִּבַּ֖רְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/015.yaml
  text: And behold[a], I am with you, and I will keep you wherever you go, and I will bring you back to this land[c][b]. For I will not leave you until I have done what I have spoken to you.
translation:
  language: ja
  text: 見よ[a]、わたしはあなたとともにいる。あなたがどこへ行っても、わたしはあなたを守り[b]、あなたをこの土地に連れ戻す。わたしがあなたに語ったこと[d]を成し遂げるまで、わたしはあなたを見捨てない[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見よ」は、続く言葉に注意を促す表現。
    reason: discourse_marker
  - marker: b
    text: または「見守る」。
    reason: lexical_alternative
  - marker: c
    text: または「離れない」「置き去りにしない」。
    reason: lexical_alternative
  - marker: d
    text: 文脈上は「約束したこと」という意味だが、ヘブライ語は直訳すると「語ったこと」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: 見よ
  rationale: 神の語りかけを際立たせ、聞き手の注意を促す談話標識の力を保つ。現代語ではやや荘重だが、神の直接話法にふさわしく明瞭である。
- source_word: אָנֹכִי עִמָּךְ
  choice: わたしはあなたとともにいる
  rationale: 独立代名詞による主語の強調を自然な日本語の主題提示で表し、神の臨在を示す表現をそのまま保つ。
- source_word: וּשְׁמַרְתִּיךָ
  choice: わたしはあなたを守り
  rationale: שׁמרが持つ「守る・見守る・保護する」という意味領域を、簡潔で自然な「守る」で表した。
- source_word: בְּכֹל אֲשֶׁר תֵּלֵךְ
  choice: あなたがどこへ行っても
  rationale: ヤコブが行くあらゆる場所を指すヘブライ語表現を、意味を狭めず自然な日本語にした。
- source_word: וַהֲשִׁבֹתִיךָ
  choice: あなたを……連れ戻す
  rationale: שובのヒフィル形の使役的な意味を自然に表し、単なる自発的帰還ではなく、神が帰還させることを明示する。
- source_word: אֶל הָאֲדָמָה הַזֹּאת
  choice: この土地に
  rationale: אֲדָמָהは「地面・土」をも意味するが、ここではヤコブが横たわる場所であり、約束に関わる領域を指すため「土地」が適切である。
- source_word: לֹא אֶעֱזָבְךָ
  choice: わたしはあなたを見捨てない
  rationale: עזבの「離れる・捨てる・見捨てる」という意味のうち、神の臨在と保護の約束を自然に伝える表現を選んだ。
- source_word: עַד אֲשֶׁר אִם עָשִׂיתִי
  choice: 成し遂げるまで
  rationale: 未来の時点で神の言葉が実現し終わることを示す構文を、簡潔な日本語で表した。
- source_word: אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ
  choice: わたしがあなたに語ったこと
  rationale: דברは字義的には「語る」であり、文脈上は約束を指すものの、本文では解釈を加えすぎず原文の表現を保った。
theological_decisions:
- issue: 神の臨在、保護、帰還、言葉の成就
  choice: 神がヤコブとともにいて守り、帰還させ、自ら語ったことを成就するという約束を、本文の範囲内で直接的に訳す。
  alternative: 後代の聖書本文との響きを強めるため、より伝統的・教理的な語彙を用いる。
  rationale: 原文にある契約的な響きを保ちつつ、後代の定式や特定の教派的理解を本文へ持ち込まない。
- issue: 「成し遂げるまで」と神の臨在の継続
  choice: 原文の「～まで」という時間表現を保つ。
  alternative: 成就後も決して離れないという意味を訳文に明示する。
  rationale: この構文は約束の確実な成就まで神が離れないことを保証するが、成就後について本文が明言していない内容を補わない。
translation_notes:
  register: 明瞭な現代標準語を基本とし、神の直接話法にふさわしい簡潔で格調ある調子にした。「見よ」以外は過度な文語表現を避け、反復される「わたし」「あなた」を適度に残して、神の個人的な臨在と約束を際立たせた。
