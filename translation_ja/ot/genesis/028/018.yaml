id: GEN.28.18
reference: Genesis 28:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יַעֲקֹ֜ב בַּ/בֹּ֗קֶר וַ/יִּקַּ֤ח אֶת הָ/אֶ֨בֶן֙ אֲשֶׁר שָׂ֣ם מְרַֽאֲשֹׁתָ֔י/ו וַ/יָּ֥שֶׂם אֹתָ֖/הּ מַצֵּבָ֑ה וַ/יִּצֹ֥ק שֶׁ֖מֶן עַל רֹאשָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/018.yaml
  text: Jacob rose early in the morning[a], took the stone that he had placed at his head, set it up as a pillar[c][b], and poured oil on its top.
translation:
  language: ja
  text: ヤコブは朝早く起きると、頭のところに置いていた石を取り、それを石の柱[a]として立て、その頂[b]に油を注いだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「立て石」。
    reason: מַצֵּבָה は、立てて据えられた石を指す。
  - marker: b
    text: 直訳「その頭」。
    reason: רֹאשָׁהּ は石を擬人的に表現し、その上端を指す。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם יַעֲקֹב בַּבֹּקֶר
  choice: ヤコブは朝早く起きると
  rationale: 動詞は「早く起きる」を表し、בַּבֹּקֶר が時を明示する。「朝早く起きる」は自然な現代日本語であり、「すると」によって後続する一連の行為を滑らかにつなぐ。
- source_word: הָאֶבֶן אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו
  choice: 頭のところに置いていた石
  rationale: מְרַאֲשֹׁתָיו は頭の周辺・頭もとを指す。「枕にしていた」や「頭の下に置いた」と断定せず、原文の空間表現を保つ。
- source_word: וַיָּשֶׂם אֹתָהּ מַצֵּבָה
  choice: それを石の柱として立て
  rationale: מַצֵּבָה は立てられた石または石柱を指す。「石の柱」は物体を明確に示し、「立てる」によって据え起こす動作も表す。
- source_word: וַיִּצֹק שֶׁמֶן
  choice: 油を注いだ
  rationale: 原文は油を「注ぐ」と明記する。「油を塗って聖別した」などの解釈を加えず、行為をそのまま描写する。
- source_word: עַל רֹאשָׁהּ
  choice: その頂に
  rationale: 直訳は「その頭に」だが、石柱の上端を指すため、日本語では「頂」が自然である。身体部位を用いた原文の比喩は脚注に残す。
theological_decisions:
- issue: מַצֵּבָה と油を注ぐ行為が持つ祭儀的意味
  choice: 石柱を立てて油を注いだという行為を記述的に訳す
  alternative: 「記念碑を立てた」「油を注いで聖別した」と解釈的に訳す
  rationale: この節自体は行為の肯定的・否定的評価や目的を明言していない。後代の立石に対する評価や聖別という理解を訳文に持ち込まず、物語の神学的緊張を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の連続する動作は、一つの主語に続く動詞列として自然にまとめ、簡潔で速い物語の運びを保った。
