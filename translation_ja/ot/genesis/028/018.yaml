  source_fidelity: ヘブライ語の一連の動作（早朝に起きる／頭もとに置いた石を取る／それを立てる／その上に油を注ぐ）を過不足なく反映している。「頭のところ」は、原文が必ずしも「頭の下」と明示しない点を保っている。「その頂」は עַל רֹאשָׁהּ（直訳「その頭の上に」）の石の上端という意味を自然に伝える。
