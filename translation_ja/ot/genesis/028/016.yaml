base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/016.yaml
  text: Then Jacob awoke from his sleep and said[a], “Surely Yahweh is in this place, and I did not know it.”
translation:
  language: ja
  text: ヤコブは眠りから目を覚まし、言った。「確かに、ヤハウェ[a]はこの場所におられる。私はそれを知らなかった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェ」は、ヘブライ語で四つの子音字יהוה（YHWH）と記される神の名。その古代の正確な発音には不確かさがあり、伝統的に「主」と訳されることもある。
    reason: divine_name
lexical_decisions:
- source_word: וַיִּיקַץ
  choice: 目を覚まして
  rationale: 睡眠から覚めることを表す動詞。物語の流れに合う自然な現代日本語とした。
- source_word: מִשְּׁנָתוֹ
  choice: 眠りから
  rationale: 直訳的な意味を保ちつつ、「目を覚ます」と自然につながる表現である。
- source_word: אָכֵן
  choice: まことに
  rationale: 新たに気づいた事実を強く認める語。「確かに」も可能だが、ヤコブの驚きを伴う厳かな認識を表すため「まことに」とした。
- source_word: יֵשׁ
  choice: おられる
  rationale: ここではヤハウェの存在・臨在を表す。神を主語とする自然で敬意ある日本語として「おられる」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語本文に記された神の固有名を音写した。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: この場所に
  rationale: ヤコブが眠り、夢を見た特定の場所を指す簡潔で自然な表現である。
- source_word: וְאָנֹכִי
  choice: それなのに、私は
  rationale: 接続詞は基本的には「そして」だが、ここではヤハウェの臨在とヤコブ自身の無知との対照を文脈上明確に表す。独立代名詞の強調は「私は」で保持した。
- source_word: לֹא יָדָעְתִּי
  choice: 知らなかった
  rationale: その時までヤハウェの臨在を認識していなかったことを表す。目的語は直前の内容から明白なので、日本語では補わない方が自然である。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文は称号ではなく四文字神名を用いているため、その区別を保つよう音写した。発音の完全な確実性については脚注で明示した。
- issue: この場所におけるヤハウェの存在の表現
  choice: この場所におられる
  alternative: この場所に臨在しておられる
  rationale: יֵשׁ は存在・所在を示すが、その臨在の様態を詳しく規定してはいない。「臨在」を本文に加えて神学的意味を限定せず、原文の簡潔さと含みを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神との遭遇場面にふさわしい品位を保った。「まことに」はやや格調があるが、突然の認識と強い確信を簡潔に伝える。「それなのに」によって原文の接続詞が文脈上担う対照を自然に表した。
