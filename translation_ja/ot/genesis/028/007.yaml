  text: and that Jacob listened to his father and his mother[a], and went to Paddan-aram.
translation:
  language: ja
  text: また、ヤコブが父と母に聞き従い[a]、パダン・アラムへ行ったことを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「父と母に耳を傾け」。ヘブライ語の動詞は、この文脈では単に聞くことと、聞き入れて従うことの両方の意味合いを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: 言うことに聞き従い
  rationale: שׁמע に前置詞 אֶל が続くここでは、単に音声を聞くのではなく、親の指示を聞いてそれに従う意味を帯びる。「言うことに聞き従う」は、聞くことと従うことの両面を自然な現代日本語で表す。
- source_word: אֶל אָבִיו וְאֶל אִמּוֹ
  choice: 父と母の言うことに
  rationale: 原文は「彼の父に、また彼の母に」と双方を明示する。日本語では「父と母の言うことに」とまとめることで、両親それぞれが対象であることを保ちつつ自然に表現できる。
- source_word: וַיֵּלֶךְ
  choice: 行った
  rationale: הלך の基本的な移動の意味を、余分な含意を加えず簡潔に表す。
- source_word: פַּדֶּנָה אֲרָם
  choice: パダン・アラムへ
  rationale: 地名として音写し、פַּדֶּנָה の方向を示す語尾を助詞「へ」で表す。
- source_word: וַ
  choice: そして／～ことも
  rationale: この節は前節から続く、エサウが知った事柄の並列要素である。冒頭の「そして」と文末近くの「も」により、単独の文として不自然にならない範囲で文脈上の接続と従属関係を示す。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。原文では本節が前節の「エサウは見た」に統語的に従属するため、日本語本文にも「ことも知った」を補って文脈的関係を明示した。地名は日本語聖書で理解しやすい中黒表記とした。
