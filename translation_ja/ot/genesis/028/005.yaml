source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יִצְחָק֙ אֶֽת יַעֲקֹ֔ב וַ/יֵּ֖לֶךְ פַּדֶּ֣נָֽ/ה אֲרָ֑ם אֶל לָבָ֤ן בֶּן בְּתוּאֵל֙ הָֽ/אֲרַמִּ֔י אֲחִ֣י רִבְקָ֔ה אֵ֥ם יַעֲקֹ֖ב וְ/עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/005.yaml
  text: So Isaac sent Jacob away[a], and he went to Paddan-aram, to Laban son of Bethuel the Aramean, the brother of Rebekah, the mother of Jacob and Esau.
translation:
  language: ja
  text: そこでイサクはヤコブを送り出した。ヤコブはパダン・アラムにいる、アラム人[a]ベトエルの子ラバンのもとへ行った。ラバンは、ヤコブとエサウの母リベカの兄弟である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古い英語訳の伝統では「シリア人」とする。ヘブライ語は、より厳密には「アラム人」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 送り出し
  rationale: この文脈の שׁלח は、人をある目的地へ向けて去らせることを表す。「送った」よりも、出発させたという物語上の動きを自然に伝える。
- source_word: וַיֵּלֶךְ
  choice: 行った
  rationale: הלך の基本義を明確で自然な現代日本語で表した。主語の曖昧さを避けるため、「彼」ではなく「ヤコブ」を補った。
- source_word: פַּדֶּנָה אֲרָם
  choice: パダン・アラムへ
  rationale: 地名として音写し、פַּדֶּנָה の方向を示す語尾を助詞「へ」で表した。
- source_word: בֶּן בְּתוּאֵל
  choice: ベトエルの子
  rationale: ヘブライ語の父子関係を簡潔かつ標準的に表した。
- source_word: הָאֲרַמִּי
  choice: アラム人
  rationale: 歴史的・民族的呼称を具体的に示す語であり、古い訳語「シリア人」より原語に即している。
- source_word: אֲחִי רִבְקָה
  choice: リベカの兄
  rationale: אָח は兄弟の年長・年少を明示しないが、日本語ではラバンがリベカの兄として通常表現されるため「兄」とした。ただし厳密には「兄弟」も可能である。
- source_word: אֵם יַעֲקֹב וְעֵשָׂו
  choice: リベカはヤコブとエサウの母である
  rationale: 原文の同格説明を、長い修飾の連鎖を避けた独立文として自然かつ明瞭に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語を用いた。原文は一続きの文だが、日本語で系譜関係を読み取りやすくするため、リベカについての同格説明を二文目に分けた。英語版では脚注記号が「sent away」の後に置かれているが、脚注内容は הָאֲרַמִּי の訳語に関するものなので、日本語本文では「アラム人」の直後に置いた。
