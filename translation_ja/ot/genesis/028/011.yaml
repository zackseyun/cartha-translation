base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/011.yaml
  text: He came to a certain place and spent the night there[a], because the sun had set. He took one of the stones of the place, put it under his head[c][b], and lay down in that place.
translation:
  language: ja
  text: 彼はある場所にたどり着き、そこで夜を過ごした[a]。日が沈んだのである。彼はその場所の石を一つ取り[b]、頭もとに置き[c]、その場所に横になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、最初に出る時から「その場所」と定冠詞が付いている。ここでは自然な日本語として「ある場所」としたが、この場所は後の物語で重要な意味を持つ。
    reason: lexical_alternative
  - marker: b
    text: 別訳「その場所の石を幾つか取り」。原文は複数形の「石」に「〜から」を伴う表現で、一つの石とも、幾つかの石とも理解できる。
    reason: alternative_reading
  - marker: c
    text: 「頭もとに」は、頭の位置または頭もとを指すヘブライ語の表現。文脈から「頭の下に」または「枕として」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגַּע בַּמָּקוֹם
  choice: ある場所にたどり着き
  rationale: פגעはこの移動の文脈では、人との遭遇ではなく、ある地点に達することを表す。「たどり着く」は旅の進行を自然に示し、偶然性を不必要に強調しない。
- source_word: וַיָּלֶן שָׁם
  choice: そこで夜を過ごした
  rationale: לוןは一夜を過ごすことを表す。現代日本語として明快で自然な表現を選んだ。
- source_word: כִּי בָא הַשֶּׁמֶשׁ
  choice: 日が沈んだからである
  rationale: 太陽を主語とするבואは、ここでは日没を表す慣用表現であり、前の行為の理由を示している。
- source_word: וַיִּקַּח מֵאַבְנֵי הַמָּקוֹם
  choice: その場所の石を一つ取り
  rationale: 複数名詞「石」に付く部分を表すמִןを、文脈上一般的な単数理解に基づいて自然な日本語にした。ただし「幾つかの石」とする余地は脚注に残した。
- source_word: מְרַאֲשֹׁתָיו
  choice: 頭のところに
  rationale: この語は頭の位置・頭もとを指し得る。「頭の下に」として石の具体的な用い方を確定せず、原文の空間的な幅を保った。
- source_word: וַיִּשְׁכַּב בַּמָּקוֹם הַהוּא
  choice: その場所に横になった
  rationale: שכבは横たわる動作を表すため、「眠った」と先取りしない。また「その場所」を繰り返し、原文が場所を強調する語り方を保った。
theological_decisions: []
translation_notes:
  register: 明快で落ち着いた現代標準日本語。原文における「場所」の反復を保持しつつ、初出の定冠詞は本文では自然な「ある場所」とし、その語りの特徴を脚注で示した。石の数と置かれた位置については、本文を読みやすくしながら、原文に残る解釈の幅を脚注で保存した。
