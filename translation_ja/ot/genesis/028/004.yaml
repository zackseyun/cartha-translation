source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ אֶת בִּרְכַּ֣ת אַבְרָהָ֔ם לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֣ אִתָּ֑/ךְ לְ/רִשְׁתְּ/ךָ֙ אֶת אֶ֣רֶץ מְגֻרֶ֔י/ךָ אֲשֶׁר נָתַ֥ן אֱלֹהִ֖ים לְ/אַבְרָהָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/004.yaml
  text: May he give you the blessing of Abraham[a], to you and to your offspring with you, so that you may possess the land of your sojournings[b], which God gave to Abraham.
translation:
  language: ja
  text: どうか神が、あなたと、あなたと共にあるあなたの子孫に、アブラハムの祝福を与え、神がアブラハムに与えたあなたの寄留の地を、あなたが受け継ぐことができるようにしてくださいますように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיִתֶּן
  choice: どうか神が……与えてくださり
  rationale: 祝福の文脈における希求の用法を「どうか」で明示した。主語は直前の文脈から神であり、日本語では自然さのため補った。
- source_word: בִּרְכַּת אַבְרָהָם
  choice: アブラハムの祝福
  rationale: 連語の形を保ち、アブラハムに結びつく契約的な響きを説明的に言い換えず残した。
- source_word: לְךָ וּלְזַרְעֲךָ אִתָּךְ
  choice: あなたに、またあなたと共にいるあなたの子孫に
  rationale: לְךָ の反復と אִתָּךְ「あなたと共に」を省かず、現代日本語として理解できる形にした。
- source_word: זַרְעֲךָ
  choice: あなたの子孫
  rationale: 字義的には「種」で単数形だが、ここでは集合的に後代の子孫を指すため、自然な日本語の「子孫」とした。
- source_word: לְרִשְׁתְּךָ
  choice: あなたが所有することができるように
  rationale: לְ付き不定詞の目的・結果を「ように」で表した。ירש は土地を受け継ぐこと、また取得して所有することを含み得るため、本文では文脈に即して「所有する」とした。
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: あなたの寄留の地
  rationale: מָגוּר が表す、一時的滞在者・在留異邦人として暮らす場所という族長物語の含意を「寄留」で保持した。
- source_word: אֲשֶׁר נָתַן אֱלֹהִים לְאַבְרָהָם
  choice: 神がアブラハムに与えた
  rationale: 関係節を簡潔に訳し、אֱלֹהִים を「神」とした。
theological_decisions:
- issue: アブラハムへの約束との契約的連続性
  choice: 「アブラハムの祝福」と土地の所有を明示した
  alternative: 「アブラハムに約束された祝福」と説明的に訳す
  rationale: 原文の簡潔な表現を保ち、祝福の内容を繁栄などに限定せず、読者が文脈から契約的なつながりを受け取れるようにした。
- issue: ירש の土地に関する意味合い
  choice: 本文は「所有する」、脚注で「受け継ぐ」も示す
  alternative: 本文を「受け継ぐ」とする
  rationale: 取得・占有の直接的意味を本文に置きつつ、相続・継承という契約的含意も排除しないよう脚注で保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「どうか」で祝福の希求を示し、「寄留」は族長たちが約束の地に一時的滞在者として住んだ含意を保つため採用した。
