revisions:
- from: どうか神が、あなたに、またあなたと共にいるあなたの子孫[a]に、アブラハムの祝福を与えてくださり、神がアブラハムに与えた、あなたの寄留の地を、あなたが所有する[b]ことができるように。
  to: どうか神が、あなたと、あなたと共にあるあなたの子孫に、アブラハムの祝福を与え、神がアブラハムに与えたあなたの寄留の地を、あなたが受け継ぐことができるようにしてくださいますように。
  rationale: 本文を日本語として完結した祝福・祈願文に改めた。「あなたと共に」は原文どおり保持しつつ、「いる」を「ある」にして現時点の同席を示す読みを弱めた。土地に関する ירש は本文では「受け継ぐ」とし、取得・所有の側面を脚注に残した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:49:13Z'
