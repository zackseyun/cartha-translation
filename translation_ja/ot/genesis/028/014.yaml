source:
  edition: WLC
  text: וְ/הָיָ֤ה זַרְעֲ/ךָ֙ כַּ/עֲפַ֣ר הָ/אָ֔רֶץ וּ/פָרַצְתָּ֛ יָ֥מָּ/ה וָ/קֵ֖דְמָ/ה וְ/צָפֹ֣נָ/ה וָ/נֶ֑גְבָּ/ה וְ/נִבְרֲכ֥וּ בְ/ךָ֛ כָּל מִשְׁפְּחֹ֥ת הָ/אֲדָמָ֖ה וּ/בְ/זַרְעֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/014.yaml
  text: Your offspring will be like the dust of the earth[a], and you will spread out to the west and to the east and to the north and to the south; and in you and in your offspring all the families of the earth will be blessed.
translation:
  language: ja
  text: あなたの子孫は地のちりのようになり、あなたは西へ、東へ、北へ、南へと広がっていく。地上のすべての氏族は、あなたとあなたの子孫にあって祝福される[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地上のすべての氏族は、あなたとあなたの子孫にあって自らを祝福する」。ヘブライ語の動詞は、再帰的または中動的な意味にも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה זַרְעֲךָ
  choice: あなたの子孫は……ようになり
  rationale: 約束の文脈における未来の意味を「なる」で表した。זֶרַע は集合的に子や後代を指し、日本語の「子孫」は単複を限定せず自然にその意味を保てる。
- source_word: כַּעֲפַר הָאָרֶץ
  choice: 地のちりのように
  rationale: 数えきれないほどの多さを表す比喩を簡潔に保持した。「地」は約束の土地との語感も残しつつ、広い意味にも読める。
- source_word: וּפָרַצְתָּ
  choice: 広がっていく
  rationale: 原語には「突き破る、勢いよく進出する」という像があるが、四方への拡大という文脈では「広がっていく」が明瞭で自然である。
- source_word: יָמָּה וָקֵדְמָה וְצָפֹנָה וָנֶגְבָּה
  choice: 西へ、東へ、北へ、南へ
  rationale: 方向を示す語尾を各方角の「へ」で表した。ここで נֶגֶב は地名よりも方向としての「南」を指す。
- source_word: וְנִבְרֲכוּ
  choice: 祝福される
  rationale: ニファル形を受動に取り、族長への約束の定型に沿って訳した。再帰・中動の可能性は脚注に残した。
- source_word: בְךָ ... וּבְזַרְעֶךָ
  choice: あなたとあなたの子孫にあって
  rationale: 前置詞 ב の表現を保ち、単に手段を示す「によって」「を通して」と断定することを避けた。日本語として荘重ながら理解可能な表現である。
- source_word: כָּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: 地上のすべての氏族
  rationale: מִשְׁפָּחוֹת は個々の家庭だけでなく血縁的な集団を指すため「氏族」とした。הָאֲדָמָה はここでは約束の普遍的範囲を表す「地上」とした。
theological_decisions:
- issue: 族長への祝福の約束における ברך のニファル形の意味
  choice: 受動：「祝福される」
  alternative: 再帰・中動：「自らを祝福する」または「祝福を願う」
  rationale: この形は受動として素直に理解でき、約束の文脈にもよく合う。一方、再帰的または中動的な理解も文法上論じられるため、媒介される祝福の意味を一つに固定せず脚注で示した。
- issue: בְךָ と וּבְזַרְעֶךָ の関係表現
  choice: 「あなたとあなたの子孫にあって」
  alternative: 「あなたとあなたの子孫を通して」または「によって」
  rationale: 手段・媒介の意味はあり得るが、原文の ב が持つ幅を狭めないため、本文では「にあって」とした。
translation_notes:
  register: 明瞭な現代標準日本語を基本とし、神の約束にふさわしい簡潔で格調ある調子とした。「にあって」はやや荘重だが、原文の前置詞が持つ神学的・文法的な幅を保つために採用した。脚注記号は、実際に異読が関わる「祝福される」の直後に置いた。
