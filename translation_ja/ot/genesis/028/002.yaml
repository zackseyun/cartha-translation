  source_fidelity: ヘブライ語の命令、目的地、ベトエルとラバンの親族関係、婚姻相手をラバンの娘たちから得ることは、全体として適切に訳されている。「母の兄弟」は原文が年長・年少を示さない曖昧さも保っている。ただし「自分の妻」は、日本語ではすでに自分の妻であるかのように読める可能性があり、אִשָּׁהの不定性および「自分のために」の与格のニュアンスを自然に表せていない。
