  text: ק֥וּם לֵךְ֙ פַּדֶּ֣נָֽ/ה אֲרָ֔ם בֵּ֥יתָ/ה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑/ךָ וְ/קַח לְ/ךָ֤ מִ/שָּׁם֙ אִשָּׁ֔ה מִ/בְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/002.yaml
  text: Arise[a], go to Paddan-aram, to the house of Bethuel, your mother's father, and take for yourself from there a wife from the daughters of Laban, your mother's brother.
translation:
  language: ja
  text: 立って、パダン・アラムへ、あなたの母の父であるベトエルの家へ行きなさい。そこから、あなたの母の兄弟であるラバンの娘たちの中から、妻を迎えなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの母の父」は「母方の祖父」、「あなたの母の兄弟」は「母方のおじ」とも訳せる。本文ではヘブライ語の親族表現を明示的に残した。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֥וּם לֵךְ֙
  choice: 立って、…行きなさい
  rationale: 連続する二つの命令を保ちつつ、現代日本語として自然な命令表現にした。
- source_word: פַּדֶּ֣נָֽה אֲרָ֔ם
  choice: パダン・アラムへ
  rationale: 地名を音写し、方向を示す語尾を助詞「へ」で表した。
- source_word: בֵּ֥יתָה בְתוּאֵ֖ל
  choice: ベトエルの家へ
  rationale: 移動の方向と「ベトエルの家」という構造を明示した。ここでの「家」は住居だけでなく家族・一族を含み得る。
- source_word: אֲבִ֣י אִמֶּ֑ךָ
  choice: あなたの母の父
  rationale: 字義的な親族表現を保ち、「母方の祖父」と解釈的に簡約しなかった。
- source_word: וְקַח לְךָ֤
  choice: 自分の妻を迎えなさい
  rationale: לקח の「取る」と利益・関与を示す לְךָ を、婚姻の文脈に適した自然な日本語で表した。
- source_word: מִשָּׁם֙
  choice: そこから
  rationale: 起点を示す前置詞 מן を明示した。
- source_word: אִשָּׁ֔ה
  choice: 妻
  rationale: 結婚相手を求める文脈なので、一般的な「女」ではなく「妻」とした。
- source_word: מִבְּנ֥וֹת לָבָ֖ן
  choice: ラバンの娘たちの中から
  rationale: 部分を示す מן を自然な日本語で明確に表した。
- source_word: אֲחִ֥י אִמֶּֽךָ
  choice: あなたの母の兄弟
  rationale: 原文は年長・年少を特定しないため、日本語の「兄」「弟」を避け、「兄弟」として曖昧さを保った。
