  terminology: 「パダン・アラム」「ベトエル」「ラバン」は適切である。「妻を迎えなさい」は、この文脈におけるאִשָּׁהを自然かつ適切に表す。親族表現を本文で直訳的に保ち、脚注で「母方の祖父／おじ」を示す方針も妥当である。
