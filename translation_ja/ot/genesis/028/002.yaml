revisions:
- from: 立って、パダン・アラムへ、あなたの母の父ベトエルの家へ行きなさい。そして、そこから、あなたの母の兄弟ラバンの娘たちの中から、自分の妻を迎えなさい。[a]
  to: 立って、パダン・アラムへ、あなたの母の父であるベトエルの家へ行きなさい。そこから、あなたの母の兄弟であるラバンの娘たちの中から、妻を迎えなさい。[a]
  rationale: 「自分の妻」を「妻」に改め、婚姻を表す「迎える」と組み合わせることで、原文の「自分のために妻を得る」という意味を自然な日本語で表した。ベトエルとラバンには「である」を補い、親族関係を明瞭にした。「そこから」と「娘たちの中から」は、原文にある起点のמןと部分を示すמןの双方を保持している。
