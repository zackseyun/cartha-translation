  text: וַ/יַּ֣רְא עֵשָׂ֔ו כִּ֥י רָע֖וֹת בְּנ֣וֹת כְּנָ֑עַן בְּ/עֵינֵ֖י יִצְחָ֥ק אָבִֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/008.yaml
  text: And Esau saw that the daughters of Canaan were evil in the eyes of Isaac his father[a].
translation:
  language: ja
  text: エサウは、カナンの娘たちが父イサクの目に好ましくないことを見て取った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「見た」。文脈上、エサウがカナンの娘たちに対する父イサクの評価を見て取ったことを表す。「好ましくない」は「悪い」とも訳せるが、ここでは、カナンの娘たちを結婚相手とすることをイサクが好ましく思わなかったことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 知った
  rationale: 基本義は「見た」だが、ここでは直前の出来事から事情を認識したことを表す。現代日本語では「知った」が文脈上自然である。
- source_word: כִּי
  choice: 〜ことを
  rationale: エサウが認識した内容を導く接続詞として訳した。
- source_word: רָעוֹת
  choice: 良くない
  rationale: 語義の「悪い」を保ちつつ、この文脈ではカナンの女性たち自身を絶対的に悪と断定するより、結婚相手としてイサクが好ましく思わなかったという評価を表す。
- source_word: בְּנוֹת כְּנָעַן
  choice: カナンの娘たち
  rationale: ヘブライ語の民族的・家族的表現を保った。「カナンの女たち」も可能だが、原文により近い表現を採用した。
- source_word: בְּעֵינֵי
  choice: 〜の目に
  rationale: 評価を表すヘブライ語の慣用句を、日本語でも理解可能な形で保持した。
- source_word: יִצְחָק אָבִיו
  choice: 父イサク
  rationale: 日本語として自然かつ簡潔に、エサウとの父子関係を明示した。
theological_decisions:
- issue: カナンの娘たちへの評価の強さ
  choice: 良くない
  alternative: 悪い／気に入らない
  rationale: 原語 רָעוֹת の否定的評価を弱めすぎず、同時に「イサクの目に」という主観的評価の枠を保つ。「気に入らない」では軽すぎ、「悪い」だけでは女性たちへの道徳的断罪と読まれやすい。
translation_notes:
  register: 明瞭な現代標準日本語。「父イサクの目に良くない」により原文の語順と評価の慣用表現をできるだけ保ちつつ、「知った」で物語上の認識を自然に示した。
