base_translation:
  language: en
  yaml_path: translation/ot/genesis/028/010.yaml
  text: Jacob departed from Beersheba and went to Haran[a].
translation:
  language: ja
  text: ヤコブはベエル・シェバを出て、ハランへ向かった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ハランへ」に当たるヘブライ語の地名には、方向を示す語尾が付いている。
    reason: 原文の方向を示す語形を明示するため。
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出て
  rationale: יצאは、ある場所から外へ出ることを表す。起点を示す「ベエル・シェバを」と組み合わせ、「出発した」より原語の基本的な動きを直接かつ自然に表した。
- source_word: יַעֲקֹב
  choice: ヤコブ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: מִבְּאֵר שָׁבַע
  choice: ベエル・シェバを
  rationale: 前置詞מִןは出発点を示す。日本語では移動動詞「出る」とともに場所を「を」で示すのが自然であり、地名は定着した表記「ベエル・シェバ」とした。
- source_word: וַיֵּלֶךְ
  choice: 向かった
  rationale: הלךは基本的に「行く」を意味するが、目的地への方向を示すחָרָנָהと合わせ、日本語の自然な移動表現として「へ向かった」とした。旅程などの意味を過度に加えてはいない。
- source_word: חָרָנָה
  choice: ハランへ
  rationale: 地名に付く方向を示す語尾（directional he）を、日本語の方向助詞「へ」で自然に反映した。到着そのものより、ハランを目指す動きを表す。
theological_decisions: []
translation_notes:
  register: 簡潔な物語文として、現代の一般読者に自然でありながら品位を保つ表現とした。「出て、…へ向かった」により、原文の二つの連続動作と移動方向を明瞭に示した。
