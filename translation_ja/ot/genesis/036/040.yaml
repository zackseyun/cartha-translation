  text: וְ֠/אֵלֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְ/מִשְׁפְּחֹתָ֔/ם לִ/מְקֹמֹתָ֖/ם בִּ/שְׁמֹתָ֑/ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/040.yaml
  text: 'And these are the names of the chiefs of Esau[a], according to their clans, according to their places, by their names: Chief Timna, Chief Alvah[b], Chief Jetheth.'
translation:
  language: ja
  text: エサウの首長たちの名は、氏族ごと、場所ごとに、名を挙げると次のとおりである。首長ティムナ[a]、首長アルワ[b]、首長エテテ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ティムナ」は「ティムナー」と表記されることもある。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「アルワ」。歴代誌第一1章51節には、関連する形として「アリヤ」がある。
    reason: cross_reference
lexical_decisions:
- source_word: וְאֵלֶּה שְׁמוֹת
  choice: 名を……挙げると
  rationale: 一覧を導入するヘブライ語の構文を、前節とのつながりを保ちながら、現代日本語で自然な列挙表現にした。
- source_word: אַלּוּפֵי / אַלּוּף
  choice: 首長たち／首長
  rationale: 創世記36章ではエドムの氏族的・地域的指導者を指す。後代の欧州貴族の称号を連想させず、各名の前に繰り返される称号も保持できる。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: מִשְׁפָּחָה はここでは家族より広い氏族集団を表すため、「氏族」とした。接頭辞 לְ の分類的な働きを「ごと」で表した。
- source_word: לִמְקֹמֹתָם
  choice: 地域ごと
  rationale: מָקוֹם の基本義は「場所」だが、この首長一覧では各集団に属する土地・地域を指すと考えられる。「居住地」と限定しすぎず、自然な日本語となる「地域」を選んだ。
- source_word: בִּשְׁמֹתָם
  choice: 名を……挙げると
  rationale: 首長たちを名前によって列挙するという機能を、日本語の一覧導入表現に組み込んだ。
- source_word: תִּמְנָע
  choice: ティムナ
  rationale: ヘブライ語の人名を日本語で明瞭に音写した。
- source_word: עַלְוָה
  choice: アルワ
  rationale: WLC本文の עַלְוָה に従い、歴代誌の類似形に同化させず音写した。
- source_word: יְתֵת
  choice: エテテ
  rationale: この節のヘブライ語形 יְתֵת を日本語で音写し、類似する別名に同化させなかった。
theological_decisions: []
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。ヘブライ語の反復される称号を省略せず、「氏族ごと、地域ごと」という並行構造を保った。注記記号は該当する人名の直後に置いた。
