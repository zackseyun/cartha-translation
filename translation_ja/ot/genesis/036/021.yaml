base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/021.yaml
  text: and Dishon[a], and Ezer, and Dishan. These are the chiefs of the Horites, the sons of Seir, in the land of Edom.
translation:
  language: ja
  text: ディション、エツェル、ディシャン。これらは、エドムの地にいた、セイルの子らであるホリ人の族長たち[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「族長たち」は「氏族の長たち」とも訳せる。ヘブライ語は、単に著名な人物ではなく、社会的・政治的な集団の指導者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: דִשׁוֹן
  choice: ディション
  rationale: 固有名詞として、ヘブライ語の音に即して日本語で音写した。
- source_word: אֵצֶר
  choice: エツェル
  rationale: 固有名詞として、ヘブライ語の音に即して日本語で音写した。
- source_word: דִישָׁן
  choice: ディシャン
  rationale: ディション（דִשׁוֹן）との母音の違いを保ち、固有名詞として音写した。
- source_word: אַלּוּפֵי
  choice: 族長たち
  rationale: エドム人・ホリ人の氏族的、社会政治的な集団を率いる者を指す語であり、古風な称号を避けつつ指導者としての意味を表した。
- source_word: הַחֹרִי
  choice: ホリ人
  rationale: 形態上は単数だが、ここでは民族・集団を集合的に表すため、日本語では「ホリ人」とした。
- source_word: בְּנֵי שֵׂעִיר
  choice: セイルの子ら
  rationale: 系譜上のつながりを示す原文の「子ら」を保持した。文脈上は子孫を含み得る。
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: エドムの地にいた
  rationale: 「地」を明示する原文を保ち、日本語の文として自然になるよう存在を表す「いた」を補った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ格調を保つ文体とした。前節から続く名簿であるため、冒頭の接続詞は日本語では省略した。「セイルの子ら」と「ホリ人」の関係は同格と理解できるよう「すなわち」を補った。
