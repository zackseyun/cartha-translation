lexical_decisions:
- source_word: אֵלֶּה בְנֵי
  choice: 息子たちは
  rationale: ヘブライ語の無動詞による系譜紹介句。「次のとおりである」と補わず、後続する二名を述語として自然な現代日本語にした。
- source_word: דִישָׁן
  choice: ディシャン
  rationale: 人名として、原語の子音と母音を踏まえて音写した。
- source_word: עוּץ
  choice: ウツ
  rationale: 人名として音写した。日本語の聖書で広く認識される形とも一致する。
- source_word: וַאֲרָן
  choice: とアラン
  rationale: 接続詞וを「と」とし、二人目の名אֲרָןを「アラン」と音写した。
