- source_word: רְעוּאֵל בֶּן עֵשָׂו
  choice: エサウの子レウエル
  rationale: ヘブライ語の系譜上の関係を簡潔かつ明確に示した。
- source_word: אַלּוּף
  choice: 首長
  rationale: エドムの部族または氏族を率いる者を表す語として、古風な称号を避けつつ広がりを保てる語を選んだ。
- source_word: נַחַת
  choice: ナハト
  rationale: ヘブライ語の人名を日本語で音写した。
- source_word: זֶרַח
  choice: ゼラ
  rationale: ヘブライ語の人名を日本語で音写した。
- source_word: שַׁמָּה
  choice: シャンマ
  rationale: ヘブライ語の子音重複を慣用的な日本語音写で表した。
- source_word: מִזָּה
  choice: ミザ
  rationale: ヘブライ語の人名を日本語で自然に音写した。
- source_word: אֵלֶּה אַלּוּפֵי רְעוּאֵל
  choice: これらが…レウエルの首長たちである
  rationale: 先の一覧を総括する指示表現と属格関係を保った。
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: エドムの地にいた
  rationale: 原文に明記された「地」を残し、日本語の文脈に合わせて所在を自然に表した。
- source_word: בָשְׂמַת אֵשֶׁת עֵשָׂו
  choice: エサウの妻バセマト
  rationale: 母系を特定する同格的な句を、関係が明瞭な日本語の語順で表した。
