base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/017.yaml
  text: 'And these are the sons of Reuel[a], the son of Esau: chief Nahath, chief Zerah, chief Shammah, chief Mizzah. These are the chiefs of Reuel in the land of Edom. These are the sons of Basemath, Esau’s wife.'
translation:
  language: ja
  text: また、エサウの子レウエルの息子たちは次のとおりである。首長[a]ナハト、首長ゼラ、首長シャマ、首長ミザ。これらが、エドムの地におけるレウエルの首長たちである。これらは、エサウの妻バセマトの息子たちである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「氏族の長」とも訳せる。ここで繰り返されるヘブライ語は、エドムの部族または氏族の指導者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: また、…次のとおりである
  rationale: 接続詞による前の系譜とのつながりを「また」で示し、系譜を導入する定型表現を自然な現代日本語にした。
- source_word: בְּנֵי
  choice: 息子たち
