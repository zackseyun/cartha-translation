  text: And the sons of Eliphaz were Teman[a], Omar, Zepho, Gatam, and Kenaz.
translation:
  language: ja
  text: エリファズの息子たちは、テマン、オマル、ツェフォ[a]、ガタム、ケナズであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツェフォ」を「ツェポ」とする訳もある。ここでマソラ本文は「ツェフォ」と読ませている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: であった
  rationale: 系図において子らの名を列挙する連結・存在表現であり、変化を意味する「なった」ではなく、自然で格調あるコピュラ表現とした。
- source_word: בְּנֵי
  choice: 息子たち
  rationale: ヘブライ語は男性複数形で、ここではエリファズの男子を列挙しているため、性を明示した。
- source_word: אֱלִיפָז
  choice: エリファズ
  rationale: 人名として、現代日本語で定着した聖書固有名詞の表記を用いた。
- source_word: תֵּימָן
  choice: テマン
  rationale: この系図では人名であり、意味を訳さず音写した。
- source_word: אוֹמָר
  choice: オマル
  rationale: 人名として音写した。
- source_word: צְפוֹ
  choice: ツェフォ
  rationale: マソラ本文の子音と母音を踏まえ、語中の摩擦音を反映して音写した。異綴りは脚注に示した。
- source_word: גַעְתָּם
  choice: ガアタム
  rationale: 人名として音写し、喉音字עの存在を慣用的な母音連続で表した。
- source_word: קְנַז
  choice: ケナズ
  rationale: 人名として、日本語の聖書で理解しやすい慣用表記を採用した。
