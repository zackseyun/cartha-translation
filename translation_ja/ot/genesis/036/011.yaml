  register: 簡潔な系図の文体を保ちつつ、「であった」によって現代標準日本語として自然で落ち着いた調子にした。列挙には読点を用い、固有名詞は日本語の慣用的な聖書表記に寄せた。脚注記号は対象となる「ツェフォ」の直後に置いた。
