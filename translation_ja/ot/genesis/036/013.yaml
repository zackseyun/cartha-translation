  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָ/זֶ֖רַח שַׁמָּ֣ה וּ/מִזָּ֑ה אֵ֣לֶּ֣ה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/013.yaml
  text: 'And these were the sons of Reuel: Nahath[a], Zerah, Shammah, and Mizzah. These were the sons of Basemath, Esau’s wife.'
translation:
  language: ja
  text: レウエルの息子たちは、ナハト、ゼラ、シャンマ、ミザであった。彼らは、エサウの妻バセマトの子孫[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「息子たち」。ここでは、バセマトの息子レウエルを通して生まれた子孫を指す。
    reason: 原語 בְּנֵי の字義と、この文脈での系譜的な用法の双方を示すため。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: （独立には訳出せず）レウエルの息子たちは
  rationale: 接続詞を含む系図の導入句。日本語では文脈上の連続性が明らかなため、不自然な「そして、これらは」を避け、主題提示で自然に表した。
- source_word: בְּנֵי רְעוּאֵל
  choice: レウエルの息子たち
  rationale: 直後に男子の名が個別に列挙されているため、直接の男子を示す「息子たち」が正確である。
- source_word: נַחַת וָזֶרַח שַׁמָּה וּמִזָּה
  choice: ナハト、ゼラ、シャンマ、ミザ
  rationale: 固有名詞を日本語の聖書名として音写し、列挙は自然な読点で表した。
- source_word: אֵלֶּה הָיוּ
  choice: 彼らは…であった
  rationale: 直前に挙げた人物を受ける系図上の過去の同定として、明瞭で自然な日本語にした。
- source_word: בְּנֵי בָשְׂמַת
  choice: バセマトの子孫
  rationale: בְּנֵי は字義的には「息子たち」だが、創世記36章10節ではレウエルがバセマトの息子とされるため、ここで列挙された者たちは彼女の孫に当たる。語の系譜的な広がりを保ちつつ、原文が世代を明示していないことにも配慮して「子孫」とした。
- source_word: אֵשֶׁת עֵשָׂו
  choice: エサウの妻
  rationale: ヘブライ語の連語を簡潔で自然な現代日本語の所有表現にした。
theological_decisions:
- issue: בְּנֵי בָשְׂמַת が示す親族関係
  choice: 子孫
  alternative: 息子たち／孫たち
  rationale: 「息子たち」は形式的には近いが、同節前半および36章10節との関係を日本語読者に誤解させやすい。一方「孫たち」は文脈上正しいものの、原語自体が世代を限定していないため、「子孫」とし、字義を脚注で示した。これは系図の意味を明確にしつつ原文の表現上の幅を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。系図の反復調を残しながら、ヘブライ語の指示語を逐語的に重ねる不自然さは避けた。
