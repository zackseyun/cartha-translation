  text: וְ/אֵ֨לֶּה֙ בְּנֵ֣י שׁוֹבָ֔ל עַלְוָ֥ן וּ/מָנַ֖חַת וְ/עֵיבָ֑ל שְׁפ֖וֹ וְ/אוֹנָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/023.yaml
  text: 'These are the sons of Shobal: Alvan[a], Manahath, Ebal, Shepho[b], and Onam.'
translation:
  language: ja
  text: ショバルの息子たちは、アルワン[a]、マナハテ、エバル、シェフォ[b]、オナムである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は「アルワン」。並行する系図である歴代誌上1:40では「アリアン」となっている。
    reason: alternative_reading
  - marker: b
    text: ヘブライ語本文は「シェフォ」。並行する系図である歴代誌上1:40では「シェフィ」となっている。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: ～たちは…である
  rationale: 系図の次の項目を導入する定型表現。接続詞は、日本語では文脈上あえて「また」とせずとも自然に連続性が伝わる。
- source_word: בְּנֵי
  choice: 息子たち
  rationale: ここでは男性の直接の子らを列挙しているため、「子孫」ではなく「息子たち」とした。
- source_word: שׁוֹבָל
  choice: ショバル
  rationale: ヘブライ語の人名を現代日本語で自然な形に音写した。
- source_word: עַלְוָן
  choice: アルワン
  rationale: WLC本文の子音表記と母音に基づく音写。並行箇所の異形「アリアン」は脚注に示した。
- source_word: וּ/מָנַחַת
  choice: マナハテ
  rationale: ヘブライ語名 מָנַחַת を音写した。語末の無声子音を反映する慣用的な日本語表記を採った。
- source_word: וְ/עֵיבָל
  choice: エバル
  rationale: ヘブライ語の人名を音写した。
- source_word: שְׁפוֹ
  choice: シェフォ
  rationale: 創世記本文のマソラ本文にある形を音写し、歴代誌上1:40の異形は脚注に保持した。
- source_word: וְ/אוֹנָם
  choice: オナム
  rationale: ヘブライ語の人名を音写した。接続詞は日本語の列挙読点により自然に表した。
theological_decisions: []
translation_notes:
  register: 明快で簡潔な現代標準日本語。系図にふさわしい端正な「である」調を用い、人名はヘブライ語本文から一貫して音写した。脚注記号は該当する人名の直後に置いた。
