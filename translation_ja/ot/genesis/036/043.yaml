  text: אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה אַלּוּפֵ֣י אֱד֗וֹם לְ/מֹֽשְׁבֹתָ/ם֙ בְּ/אֶ֣רֶץ אֲחֻזָּתָ֔/ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/043.yaml
  text: Chief Magdiel[a], chief Iram. These are the chiefs of Edom according to their settlements in the land of their possession. This is Esau[d][c][b], the father of Edom.
translation:
  language: ja
  text: 族長マグディエル、族長イラム。これらが、彼らの所有地における居住地ごとのエドムの族長たちである。このエサウが、エドム人の父祖である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: 族長
  rationale: 創世記36章では、エドムの部族または氏族を率いる者の称号を指す。「族長」は現代日本語で自然かつ簡潔で、指導者としての地位を保つ。
- source_word: מַגְדִּיאֵל
  choice: マグディエル
  rationale: 固有名詞として、ヘブライ語の音に基づいて表記した。
- source_word: עִירָם
  choice: イラム
  rationale: 固有名詞として、ヘブライ語の音に基づいて表記した。
- source_word: לְמֹשְׁבֹתָם
  choice: それぞれの居住地ごとの
  rationale: 接頭辞לְが示す分類・区分の意味を表し、族長たちが居住地別に挙げられていることを自然な日本語で示す。
- source_word: בְּאֶרֶץ אֲחֻזָּתָם
  choice: 所有の地にある
  rationale: אֲחֻזָּהの土地としての所有・保有という名詞的表現を保ちつつ、前後に無理なくつながる日本語とした。
- source_word: הוּא עֵשָׂו
  choice: エサウは
  rationale: 直訳的な「彼はエサウである」では直前のイラムを指すように誤解されうる。系譜全体を締めくくる同定として、主題を明示した。
- source_word: אֲבִי אֱדֹם
  choice: エドム人の父祖
  rationale: אָבの系譜的・民族的意味を明確にし、エサウがエドム人の祖先であることを表す。地名または民族名としての「エドム」との原文上の簡潔さは脚注で示す。
theological_decisions:
- issue: エサウをエドムの祖とする系譜的称号
  choice: エドム人の父祖
  alternative: エドムの父
  rationale: この句は直接の父子関係ではなく、エサウがエドム人の祖先であることを示す。「父祖」は系譜的意味を明確にし、余分な神学的含意を加えない。
translation_notes:
  register: 列挙と系譜の締めくくりにふさわしい簡潔で端正な文体とした。「族長」を反復して原文の称号の統一性を保ち、「以上が」でまとめの機能を明示した。
