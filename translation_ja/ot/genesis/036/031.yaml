source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ הַ/מְּלָכִ֔ים אֲשֶׁ֥ר מָלְכ֖וּ בְּ/אֶ֣רֶץ אֱד֑וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/031.yaml
  text: These are the kings who reigned in the land of Edom before a king reigned over the sons of Israel[a].
translation:
  language: ja
  text: イスラエルの子らを王が治める前に、エドムの地で治めた王たちは次のとおりである[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イスラエルの子らのために王が治める前に」。ヘブライ語は直訳すると「イスラエルの子らに／のために王が治める前に」。
    reason: 前置詞 ל は、この文脈では統治の対象を示すと理解できる一方、「〜のために」の関係としても取り得るため。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 次のとおりである
  rationale: 新しい一覧を導入する提示表現。接続詞を機械的に「そして」とせず、現代日本語で自然な一覧導入とした。
- source_word: הַמְּלָכִים אֲשֶׁר מָלְכוּ
  choice: 治めた王たち
  rationale: 同語根の名詞と動詞を、日本語では不自然な重複を避けつつ、王として統治した意味が明確になるよう表した。
- source_word: בְּאֶרֶץ אֱדוֹם
  choice: エドムの地で
  rationale: 「地」を明示する原文の領域的表現を保持した。
- source_word: לִפְנֵי
  choice: 前に
  rationale: ここでは時間的先行を示す。
- source_word: מְלָךְ מֶלֶךְ
  choice: 王が立つ
  rationale: 王が統治するようになることを、簡潔で自然な日本語で表した。単数形も保持している。
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: イスラエルの子らに
  rationale: 定型的民族呼称の形を保ち、「に」によってヘブライ語前置詞 ל の関係性を過度に限定しないようにした。
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל の訳し方
  choice: イスラエルの子ら
  alternative: イスラエル人
  rationale: 民族全体を指す定型句だが、原文の「子ら」という形を保持し、系譜的・共同体的な響きを残した。
- issue: לִבְנֵי יִשְׂרָאֵל における ל の解釈
  choice: イスラエルの子らに王が立つ
  alternative: イスラエルの子らを王が治める
  rationale: 文脈上はイスラエルに対する王の統治を指すが、前置詞 ל 自体には「〜のために／〜に対して」の幅があるため、本文では自然さを保ちながら解釈を狭めすぎず、別訳を脚注に示した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、一覧を導入する叙述として簡潔かつ品位ある文体にした。「王が立つ」は現代の読者にも理解できる慣用表現であり、原文の単数と王政開始の含意を保つ。
