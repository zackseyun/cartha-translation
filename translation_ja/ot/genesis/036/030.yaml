  naturalness: 「首長部族ごとに」は不自然で意味を取りにくいため、「首長区分ごとに」とするほうが明瞭です。文全体も、セイルとの地理的関係を「セイルの地における」として簡潔に保てます。
  terminology: 「首長」はこの文脈のאַלּוּףにふさわしい現代標準語です。「ホリ人」「セイル」および三人の人名表記も一貫しています。「部族」は原語が明示しない社会単位を狭く示し得るため避け、「首長区分」として脚注で代替可能性を示します。
