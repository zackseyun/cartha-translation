base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/030.yaml
  text: Chief Dishon[a], chief Ezer[b], chief Dishan—these were the chiefs of the Horites according to their chiefs in the land of Seir.
translation:
  language: ja
  text: 首長ディション、首長エツェル、首長ディシャン。これらは、セイルの地におけるホリ人の首長たちであり、それぞれの首長区分[a]ごとによるものである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼らの首長たちに従って」。ここでのヘブライ語は、各首長による分類、または各首長が率いる区分による分類を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַלּוּף
  choice: 首長
  rationale: エドム人・ホリ人の氏族的集団を率いる者を指す。古風または制度限定的な語を避け、反復も原文どおり保った。
- source_word: דִּשֹׁן / אֵצֶר / דִּישָׁן
  choice: ディション／エツェル／ディシャン
  rationale: 固有名として音写し、ディションとディシャンの区別を保った。
- source_word: אַלּוּפֵי הַחֹרִי
  choice: ホリ人の首長たち
  rationale: הַחֹרִיを民族集団を表す集合的呼称として自然な日本語にした。
- source_word: לְאַלֻּפֵיהֶם
  choice: それぞれの首長部族ごとに
  rationale: 前置詞לְの分類的用法と、אַלּוּףが首長の率いる区分・部族を指し得ることを表した。単に「首長ごとに」とすると日本語では同語反復が不透明になるため、首長を単位とする部族区分であることを示した。
- source_word: בְּאֶרֶץ שֵׂעִיר
  choice: セイルの地にいた
  rationale: 地理的所在を示す表現として、要約文に自然に組み込んだ。
