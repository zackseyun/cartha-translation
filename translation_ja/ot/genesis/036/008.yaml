  text: וַ/יֵּ֤שֶׁב עֵשָׂו֙ בְּ/הַ֣ר שֵׂעִ֔יר עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/008.yaml
  text: So Esau settled in the hill country of Seir[a]; Esau is Edom.
translation:
  language: ja
  text: こうして、エサウはセイルの山地に住んだ[a]。エサウはエドムである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「セイル山に住んだ」。
    reason: הַרは山岳地域を指す場合と、単一の山を指す場合があるため。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住んだ
  rationale: ישׁבの物語を進める形。ある地域を居住地とした文脈を自然な現代日本語で表しつつ、「住む」という基本義を保った。
- source_word: בְּהַר
  choice: 山地に
  rationale: הַרは一つの山だけでなく山岳地域も指し得る。ここではセイルという地域を表すため、「山地」が自然である。単一の山を指す可能性は脚注に残した。
- source_word: שֵׂעִיר
  choice: セイル
  rationale: 地名として、日本語聖書で広く認識される表記を用いた。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 人名として、日本語聖書で定着した表記を用いた。
- source_word: הוּא אֱדוֹם
  choice: エサウはエドムである
  rationale: 動詞のない同定文を直接的に訳し、エサウとエドムを同一視する系譜的な注記を保った。
