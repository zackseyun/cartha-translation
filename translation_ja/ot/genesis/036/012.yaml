  source_fidelity: 本文はヘブライ語の系譜叙述を正確に反映している。「エリファズの側妻」「エリファズとの間にアマレクを産んだ」は、פִּילֶגֶשׁおよび ילד＋父を示すלְの関係を自然な日本語で過不足なく表す。「これらは…アダの子らである」も、定型句אֵלֶּה בְּנֵי עָדָהに忠実である。
