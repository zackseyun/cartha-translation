id: GEN.36.12
reference: Genesis 36:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/תִמְנַ֣ע הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽ/אֱלִיפַז֙ בֶּן עֵשָׂ֔ו וַ/תֵּ֥לֶד לֶ/אֱלִיפַ֖ז אֶת עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/012.yaml
  text: Timna was a concubine of Eliphaz[a], Esau’s son, and she bore Amalek to Eliphaz. These are the sons of Adah[b], Esau’s wife.
translation:
  language: ja
  text: ティムナは、エサウの子エリファズの側妻[a]であり、エリファズとの間にアマレクを産んだ。これらは、エサウの妻アダの子ら[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「側妻」は、正妻とは異なる立場で、婚姻的関係にあった女性を指す。伝統的には「そばめ」とも訳される。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「子ら」。ヘブライ語の「子」は系譜では広く「子孫」を意味することがあり、ここでは文脈上、アダの孫たちを含む。
    reason: genealogical_ambiguity
lexical_decisions:
- source_word: וְתִמְנַע
  choice: ティムナ
  rationale: 接続詞を伴う固有名。日本語では文頭を自然に始め、接続詞は明示しない。
- source_word: הָיְתָה פִילֶגֶשׁ לֶאֱלִיפַז
  choice: エリファズの側妻であり
  rationale: היה はここでは状態を表す連結動詞。פִילֶגֶשׁ は正妻より下位の公認された婚姻的関係にある女性を指すため、「側妻」とした。前置詞 ל は所属・関係として自然な日本語にした。
- source_word: בֶּן עֵשָׂו
  choice: エサウの子
  rationale: ヘブライ語の連語関係を簡潔で自然な日本語にした。
- source_word: וַתֵּלֶד לֶאֱלִיפַז אֶת עֲמָלֵק
  choice: エリファズとの間にアマレクを産んだ
  rationale: ילד は「産む」。父を示す ל を、日本語の系譜表現として自然な「との間に」で表した。
- source_word: אֵלֶּה בְּנֵי עָדָה
  choice: これらは…アダの子らである
  rationale: 系譜をまとめる定型句。בְּנֵי の字義的な「子ら」を本文に保ち、その広い系譜的用法は脚注で示した。
- source_word: אֵשֶׁת עֵשָׂו
  choice: エサウの妻
  rationale: 連語関係を自然な所有表現で訳した。
theological_decisions:
- issue: בְּנֵי がアダとの関係をどの世代として表すか
  choice: 本文では「子ら」とし、脚注で「子孫」、文脈上は「孫たち」を含むことを説明する
  alternative: 本文を「孫たち」または「子孫」とする
  rationale: ヘブライ語本文の語形を保ちつつ、系譜用語 בֵּן の意味範囲と、エリファズの子たちがアダの孫に当たるという文脈の双方を明示し、曖昧さを一方的に解消しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、系譜にふさわしい簡潔で格調ある文体とした。「側妻」は社会的区別を保ちつつ、「そばめ」より現代の読者に意味を推測しやすい語として採用した。
