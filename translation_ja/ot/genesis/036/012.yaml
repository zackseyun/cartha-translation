  terminology: 人名表記（ティムナ、エサウ、エリファズ、アマレク、アダ）は一貫している。「側妻」はפילגשの区別を保持する適切な訳語である。子らについて本文はヘブライ語の表現を保ち、脚注は系譜における「子」の広い用法と文脈上の世代関係を適切に説明している。
