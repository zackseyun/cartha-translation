- source_word: אֵלֶּה
  choice: ～たちは…である
  rationale: 系図の一覧を導入する提示表現として、日本語で自然な文型にした。
- source_word: בְנֵי
  choice: 息子たち
  rationale: ここでは男性名が列挙されているため、広義の「子孫」ではなく直接的な系譜表現を保持した。
- source_word: שֵׂעִיר הַחֹרִי
  choice: ホリ人セイル
  rationale: הַחֹרִיを民族的呼称としてセイルに同格的に結び付け、固有名は慣用的に音写した。
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: この地に住んでいた
  rationale: 複数形の分詞を列挙される息子たちに係る表現として訳した。「地」は文脈上の土地を指すため「この地」とし、系譜叙述に合わせて過去形にした。
- source_word: לוֹטָן וְשׁוֹבָל וְצִבְעוֹן וַעֲנָה
  choice: ロタン、ショバル、ツィブオン、アナ
  rationale: 各固有名を日本語の標準的な表記に沿って音写した。
