  yaml_path: translation/ot/genesis/036/016.yaml
  text: Chief Korah, chief Gaatham, chief Amalek—these are the chiefs of Eliphaz in the land of Edom; these are the sons of Adah.
translation:
  language: ja
  text: コラ族長、ガアタム族長、アマレク族長。これらは、エドムの地におけるエリファズの族長たちであり、アダの子らである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּף
  choice: 族長
  rationale: エドムの氏族・部族集団を率いる者を指す称号であり、現代日本語で簡潔かつ自然に表した。
- source_word: גַּעְתָּם
  choice: ガアタム
  rationale: ヘブライ語の子音構成と母音表示に沿って固有名を音写した。
- source_word: בְּנֵי עָדָה
  choice: アダの子孫
  rationale: 列挙された人物は直系の息子とは限らず氏族的な系譜に属するため、「子ら」の意味範囲を自然な日本語で示した。
theological_decisions:
- issue: 「アダの子ら」の系譜的範囲
  choice: アダの子孫
  alternative: アダの子ら
  rationale: 本節の族長たちはアダの息子エリファズに属するため、ヘブライ語 בנים の広い系譜的用法を反映し、関係を誤解しにくくした。
translation_notes:
  register: 系譜一覧にふさわしい簡潔で荘重な現代標準日本語。反復される称号を保持し、後半は日本語として明瞭になるよう述語を補った。
