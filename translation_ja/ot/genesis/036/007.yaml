  text: כִּֽי הָיָ֧ה רְכוּשָׁ֛/ם רָ֖ב מִ/שֶּׁ֣בֶת יַחְדָּ֑ו וְ/לֹ֨א יָֽכְלָ֜ה אֶ֤רֶץ מְגֽוּרֵי/הֶם֙ לָ/שֵׂ֣את אֹתָ֔/ם מִ/פְּנֵ֖י מִקְנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/007.yaml
  text: For their possessions were too great for them to dwell together[b][a], and the land of their sojourning could not support them because of their livestock.
translation:
  language: ja
  text: 彼らが共に住むには、彼らの財産は多すぎたからである。また、彼らが寄留していた地[a]は、彼らの家畜が多かったために、彼らを支えることができなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼らの寄留の地」。一時的な滞在者として住んでいたという意味を含む。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼らを担うことができなかった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: からである
  rationale: 前節でエサウがヤコブから離れた理由を示す接続表現として、説明の働きを自然な日本語で表した。
- source_word: רְכוּשָׁם
  choice: 彼らの財産
  rationale: 家畜を含む、彼らが所有していた動産や富を広く指す語として明瞭である。
- source_word: רָב מִשֶּׁבֶת יַחְדָּו
  choice: 一緒に住むには多すぎた
  rationale: 比較を表す前置詞מִןと不定詞の組み合わせを、共同生活が困難になるほどの多さとして自然に表した。
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: 彼らが寄留していた地
  rationale: 一時的滞在者、在留異邦人として住んでいたというמְגוּרִיםの含意を保ちつつ、現代日本語として理解しやすくした。
- source_word: לָשֵׂאת אֹתָם
  choice: 彼らを支えきれなかった
  rationale: נשאの字義は「担う」だが、土地が主語である文脈では、その土地に彼らとその所有物を維持するだけの収容力がなかったことを自然に伝える。
- source_word: מִפְּנֵי מִקְנֵיהֶם
  choice: 彼らの家畜のため
  rationale: מִפְּנֵיの原因を示す働きと、מִקְנֶהが広く家畜を指すことを簡潔に表した。
