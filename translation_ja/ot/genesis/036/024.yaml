base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/024.yaml
  text: 'These are the sons of Zibeon: Aiah and Anah[a]. This is the Anah who found the yemim in the wilderness while he was pasturing the donkeys for Zibeon his father.'
translation:
  language: ja
  text: ツィブオンの息子たちは、アヤとアナである。このアナは、父ツィブオンのろばを荒野で飼っていたとき、イェミム[a]を見つけた者である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「イェミム」の意味は不明。「温泉」と解する説や、古代および後代の一部の解釈に見られる「ラバ」とする説がある。語義を確定できないため、本文ではヘブライ語を音写した。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי צִבְעוֹן
  choice: ツィブオンの息子たち
  rationale: 系図上の実子である男性二人を指すため、構文を直接かつ自然に訳した。
- source_word: אַיָּה וַעֲנָה
  choice: アヤとアナ
  rationale: 固有名をヘブライ語の発音に沿って日本語で音写した。
- source_word: הוּא עֲנָה אֲשֶׁר
  choice: このアナは……者である
  rationale: 同名人物を特定する指示・同定の働きを、明瞭な現代日本語で表した。
- source_word: מָצָא
  choice: 見つけた
  rationale: 一般的な意味を保つ平明な訳語であり、「発見した」より原文の語感を限定しない。
- source_word: הַיֵּמִם
  choice: イェミム
  rationale: 語義が確定できず、「温泉」や「らば」などの解釈があるため、本文では音写して曖昧さを保存した。
- source_word: בַּמִּדְבָּר
  choice: 荒野で
  rationale: מִדְבָּרの聖書的用法に適し、必ずしも砂漠だけを意味しない表現を選んだ。
- source_word: בִּרְעֹתוֹ אֶת הַחֲמֹרִים
  choice: ろばを……飼っていたとき
  rationale: 同時進行を示す構文を自然な日本語にし、対象がろばであるため「牧していた」より平明な「飼っていた」とした。
- source_word: לְצִבְעוֹן אָבִיו
  choice: 父ツィブオンの
  rationale: ろばが父ツィブオンに属する、または彼のために世話されていた関係を、日本語では自然な所有表現で示した。
