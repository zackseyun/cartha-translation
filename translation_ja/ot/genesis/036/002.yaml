source:
  edition: WLC
  text: עֵשָׂ֛ו לָקַ֥ח אֶת נָשָׁ֖י/ו מִ/בְּנ֣וֹת כְּנָ֑עַן אֶת עָדָ֗ה בַּת אֵילוֹן֙ הַֽ/חִתִּ֔י וְ/אֶת אָהֳלִֽיבָמָה֙ בַּת עֲנָ֔ה בַּת צִבְע֖וֹן הַֽ/חִוִּֽי־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/002.yaml
  text: 'Esau took his wives from the daughters of Canaan: Adah daughter of Elon the Hittite[a], and Oholibamah daughter of Anah, daughter of Zibeon the Hivite.'
translation:
  language: ja
  text: エサウは、カナンの娘たちの中から妻たちを迎えた。すなわち、ヒッタイト人エロンの娘アダと、ヒビ人[a]ツィブオンの娘アナの娘オホリバマである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は「ヒビ人」。関連する系譜との調和を図り、「ホリ人」と読む、またはその系統として理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח
  choice: めとった
  rationale: 字義は「取った」だが、ここでは妻としたことを表す。現代日本語で婚姻の意味を自然かつ簡潔に伝える「めとった」とした。
- source_word: נָשָׁיו
  choice: 妻
  rationale: 文脈上は単なる「女たち」ではなくエサウの妻たちを指す。日本語では「妻をめとった」とすることで複数の名が続くことも自然に示される。
- source_word: מִבְּנוֹת כְּנָעַן
  choice: カナンの娘たちの中から
  rationale: ヘブライ語の「カナンの娘たち」という表現を保ちつつ、前置詞 מִן の選択・出所の意味を「中から」で明確にした。
- source_word: בַּת
  choice: 娘
  rationale: 系譜を示す構文を一貫して「娘」と訳し、原文で繰り返される親子関係を保った。
- source_word: הַחִתִּי
  choice: ヒッタイト人
  rationale: חִתִּי の標準的な日本語民族名を用いた。
- source_word: אָהֳלִיבָמָה
  choice: オホリバマ
  rationale: ヘブライ語の母音と子音に沿った、分かりやすい日本語音写を採用した。
- source_word: הַחִוִּי
  choice: ヒビ人
  rationale: マソラ本文は חִוִּי（ヒビ人）と読むため、本文ではそれに従った。関連系譜から生じる別理解は脚注に残した。
theological_decisions:
- issue: 末尾の民族名と関連系譜との緊張
  choice: マソラ本文に従い「ヒビ人」とする
  alternative: 創世記36章20節などとの調和を図り、「ホリ人」と読む、またはその系統として理解する
  rationale: 原語本文を本文訳の基礎とし、関連箇所との系譜上の緊張を本文で黙って解消せず、脚注で別の理解を示した。
- issue: アナとツィブオンの系譜表現
  choice: 原文の二つの בַּת を反映し、「ツィブオンの娘アナの娘」とする
  alternative: 関連系譜に合わせて「アナの娘で、ツィブオンの孫娘」と整理する
  rationale: この節の文法的な連鎖を優先し、関連箇所に基づいて性別や世代関係を本文中で調整しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用い、系譜記事にふさわしい簡潔で落ち着いた文体とした。「すなわち」で妻たちの名を導入し、長い血縁表現を読み取りやすくした。
