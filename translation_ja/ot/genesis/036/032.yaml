  text: ベオルの子ベラがエドムで王となった[a]。彼の町の名はディヌハバであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エドムを治めた」。ヘブライ語は直訳すると「エドムで王となった」。
