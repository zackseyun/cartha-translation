lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: 王となった
  rationale: 王名表における王位継承を表す語として、即位と統治の開始を自然な日本語で示す。単に「治めた」とするより、この文脈の継承通知に適している。
- source_word: בֶּאֱדוֹם
  choice: エドムで
  rationale: 前置詞 ב の場所を示す基本的な意味を保ち、ベラが王となった領域を自然に表す。
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: ベオルの子ベラ
  rationale: 固有名を日本語の慣用的な聖書表記で音写し、בֶּן の親子関係を明示する。
- source_word: וְשֵׁם עִירוֹ
  choice: 彼の町の名は
  rationale: עִירוֹ の三人称男性単数接尾辞を「彼の」と明示し、ヘブライ語の構造を自然な日本語で保持する。
- source_word: דִּנְהָבָה
  choice: ディンハバ
  rationale: 地名として音写する。
