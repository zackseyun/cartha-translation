  text: וְ/אֶת בָּשְׂמַ֥ת בַּת יִשְׁמָעֵ֖אל אֲח֥וֹת נְבָיֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/003.yaml
  text: and Basemath[a], the daughter of Ishmael, the sister of Nebaioth.
translation:
  language: ja
  text: また、イシュマエルの娘で、ネバヨトの姉妹であるバセマト。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: また
  rationale: וְは妻たちの列挙にもう一人を加える接続語として「また」とし、直接目的語標識אֵתは日本語では訳出しない。前節から続く目的語句であるため、断片的な構文を保持した。
- source_word: בָּשְׂמַת
  choice: バセマト
  rationale: 固有名詞として、ヘブライ語の子音とマソラ母音に基づき日本語で音写した。
- source_word: בַּת יִשְׁמָעֵאל
  choice: イシュマエルの娘
  rationale: 連語形による親子関係を、自然な現代日本語の属格表現で示した。
- source_word: אֲחוֹת נְבָיוֹת
  choice: ネバヨトの姉妹
  rationale: 連語形によるきょうだい関係を直訳的に保った。ヘブライ語は年長・年少を明示しないため、「姉」「妹」と限定せず「姉妹」とした。
- source_word: נְבָיוֹת
  choice: ネバヨト
  rationale: 固有名詞をヘブライ語נְבָיוֹתの発音に沿って音写した。英語圏固有の綴りの異形は日本語本文の理解に関係しないため、注記しない。
theological_decisions: []
translation_notes:
  register: 系譜的な列挙にふさわしい簡潔で品位ある現代標準日本語。原文が前節から続く目的語句であることを反映し、完全文に補わなかった。「姉妹」は年齢順を特定しない語として用いた。
