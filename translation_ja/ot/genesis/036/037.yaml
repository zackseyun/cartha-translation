  yaml_path: translation/ot/genesis/036/037.yaml
  text: Then Samlah died[c][b][a], and Shaul from Rehoboth on the River reigned in his place.
translation:
  language: ja
  text: サムラが死に、川沿いのレホボト[b]出身のシャウル[a]が彼に代わって王となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的な表記では「サウル」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「川のレホボト」。ある特定の川のほとりにあるレホボトを指すと考えられるが、川名は記されていない。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死ぬと
  rationale: 物語を進める連続形の働きを、先行する死と後続する王位継承の時間的つながりが自然に伝わる形で表した。
- source_word: שַׂמְלָה
  choice: サムラ
  rationale: ヘブライ語の人名を、日本語で発音しやすい形に音写した。
- source_word: וַיִּמְלֹךְ
  choice: 王となった
  rationale: 王位継承の定型的文脈では、統治の開始を表す日本語が自然である。単に「治めた」とするより、前王に代わる即位の含意を明確にできる。
- source_word: תַּחְתָּיו
  choice: 彼に代わって
  rationale: 王位継承において、前の王の地位を引き継ぐことを示す慣用句として訳した。
- source_word: שָׁאוּל
  choice: シャウル
  rationale: ヘブライ語 שָׁאוּל の音を比較的直接に反映する表記とした。伝統的な日本語表記「サウル」は脚注に示した。
- source_word: מֵרְחֹבוֹת
  choice: レホボト出身の
  rationale: 前置詞 מִן が示す出身・所属を明示し、רְחֹבוֹת はこの文脈では普通名詞に訳さず地名として音写した。
- source_word: הַנָּהָר
  choice: 川のほとりの
  rationale: 定冠詞を伴う「川」がレホボトを地理的に限定していると捉え、日本語で自然な所在地表現にした。川名は本文から特定できないため補わなかった。
