translation_notes:
  register: 簡潔な王位継承の記事として、現代の一般読者に自然でありながら格調を損なわない文体とした。「死ぬと」「彼に代わって王となった」により、ヘブライ語の物語上の順序と継承関係を明瞭に表している。
