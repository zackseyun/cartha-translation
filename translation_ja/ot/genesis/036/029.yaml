  yaml_path: translation/ot/genesis/036/029.yaml
  text: 'These are the chiefs of the Horites: chief Lotan[a], chief Shobal, chief Zibeon, chief Anah.'
translation:
  language: ja
  text: ホリ人の族長たちは次のとおりである。族長ロタン[a]、族長ショバル、族長ツィブオン、族長アナ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「部族の長」または「氏族の長」とも訳せる。ヘブライ語は、氏族や部族を率いる者を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 次のとおりである
  rationale: 列挙を導く指示語。現代日本語として自然で明瞭な形にした。
- source_word: אַלּוּפֵי / אַלּוּף
  choice: 族長たち／族長
  rationale: 氏族または部族を率いる者を指す語であり、文脈に合う「族長」とした。各固有名の前で単数形が反復される原文の形も保持した。
- source_word: הַחֹרִי
  choice: ホリ人
  rationale: 形態上は定冠詞付きの単数民族形容詞だが、ここでは民族集団を集合的に表すため、日本語の慣用に従って「ホリ人」とした。
- source_word: לוֹטָן
  choice: ロタン
  rationale: ヘブライ語の人名を日本語で一般的な形に音写した。
- source_word: שׁוֹבָל
  choice: ショバル
  rationale: ヘブライ語の人名を音写した。
- source_word: צִבְעוֹן
  choice: ツィブオン
  rationale: ヘブライ語の子音 צ と母音配列を踏まえ、識別しやすい日本語表記に音写した。
- source_word: עֲנָה
  choice: アナ
  rationale: ヘブライ語の人名を音写した。
