  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/001.yaml
  text: These are the generations of Esau (that is[a], Edom).
translation:
  language: ja
  text: これはエサウ（すなわちエドム[a]）の系図である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「これはエサウの系図である。エサウはエドムである」。
    reason: הוּא אֱדוֹם を、括弧内の同格的説明ではなく、エサウをエドムと同定する独立した述語文として訳すこともできるため。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: これは
  rationale: וְ は新しい区分を導く接続辞として働く。現代日本語では冒頭の「そして」を省き、「これは」とすることで自然に節を導入できる。
- source_word: תֹּלְדוֹת
  choice: 系図
  rationale: 創世記で繰り返される構成上の見出し語。ここでは続く内容がエサウの子孫と氏族を列挙するため、「系図」が自然である。ただし、この語には一族の歴史・由来を含み得る幅がある。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 固有名を日本語聖書で一般的な形に音写した。
- source_word: הוּא
  choice: すなわち
  rationale: エサウとエドムが同一であることを示す同格的・説明的な代名詞として訳した。直訳的な「彼は」も可能なので脚注に示した。
- source_word: אֱדוֹם
  choice: エドム
  rationale: 固有名を一般的な日本語表記で音写し、エサウの別名または彼に結びつく民族名として保持した。
theological_decisions:
- issue: תֹּלְדוֹת の範囲
  choice: 系図
  alternative: 歴史／由来
  rationale: この語を単なる物語にも生物学的子孫だけにも限定せず、創世記の反復される見出しとして扱った。本章の内容に即して本文では「系図」としたが、原語の意味領域がより広いことは認識している。
- issue: הוּא אֱדוֹם による同定
  choice: （すなわちエドム）
  alternative: 彼がエドムである
  rationale: 原文はエサウとエドムを簡潔に同定している。本文では自然な同格表現を用い、独立した述語文として読む可能性を脚注に残した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、創世記の見出しにふさわしい簡潔で格調ある文体とした。「系図である」により見出しとしての性格を保ち、括弧内の説明は過度に重くならない形にした。
