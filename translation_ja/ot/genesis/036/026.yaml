  text: וְ/אֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְ/אֶשְׁבָּ֖ן וְ/יִתְרָ֥ן וּ/כְרָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/026.yaml
  text: 'And these were the sons of Dishan: Hemdan[a], Eshban, Ithran, and Keran.'
translation:
  language: ja
  text: また、ディシャンの息子たちは、ヘムダン、エシュバン、イトラン、ケランであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: また、…たちは
  rationale: 接続詞と指示詞が系図の新しい項目を導入している。日本語では「また」で文脈との連続を示し、指示詞は「息子たちは」という主題提示に自然に織り込んだ。
- source_word: בְּנֵי
  choice: 息子たち
  rationale: 直近の男子を列挙する系図であり、より広い「子孫」ではなく、原語に近い「息子たち」とした。
- source_word: דִישָׁן
  choice: ディシャン
  rationale: ヘブライ語の人名を、現代日本語で読める形に音写した。
- source_word: חֶמְדָּן
  choice: ヘムダン
  rationale: マソラ本文の発音に基づいて人名を音写した。
- source_word: וְ/אֶשְׁבָּן
  choice: エシュバン
  rationale: 人名を音写し、接続詞は日本語の列挙表現に吸収した。
- source_word: וְ/יִתְרָן
  choice: イトラン
  rationale: マソラ本文の発音に基づいて人名を音写した。
- source_word: וּ/כְרָן
  choice: ケラン
  rationale: כをカ行音で表し、マソラ本文の発音に即して音写した。接続詞は読点による日本語の列挙に吸収した。
theological_decisions: []
translation_notes:
  register: 簡潔な系図文として、現代標準日本語の自然さと原文の列挙構造を両立させた。ヘブライ語には明示的な動詞がないが、物語中の系図叙述として「であった」を補った。固有名は統一的にカタカナで表記した。
