  naturalness: 明瞭な現代標準日本語でありつつ、王名表にふさわしい簡潔な文体である。「その町の名はアビトであった」も日本語として自然で、原文の命名定型をよく反映する。
  terminology: フシャム、ベダド、ハダド、ミディアン、モアブ、アビトの固有名詞表記は一貫している。「王となった」「討った者」は文脈に適切であり、神学用語上の問題もない。
