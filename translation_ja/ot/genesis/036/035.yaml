id: GEN.36.35
reference: Genesis 36:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּ֖מָת חֻשָׁ֑ם וַ/יִּמְלֹ֨ךְ תַּחְתָּ֜י/ו הֲדַ֣ד בֶּן בְּדַ֗ד הַ/מַּכֶּ֤ה אֶת מִדְיָן֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב וְ/שֵׁ֥ם עִיר֖/וֹ עֲוִֽית־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/035.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab[b]; and the name of his city was Avith.
translation:
  language: ja
  text: フシャムが死ぬと、ベダドの子ハダドが代わって王となった。ハダドはモアブの野[b]でミディアンを討った者[a]であり、その町の名はアビトであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ミディアンを打ち破った者」。ヘブライ語の分詞は、直訳すると「ミディアンを打った者」。
    reason: נכהの語が表す打撃と撃破の間の意味の幅、および分詞形を示すため。
  - marker: b
    text: 「モアブの野」は、「モアブ地方」または「モアブの領域」とも訳せる。
    reason: שדהは「野、畑」のほか、地理的文脈では「地方、領域」を指すことがあるため。
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死ぬと
  rationale: מותの意味を婉曲化せず「死ぬ」とし、連続する王位継承との関係を自然な日本語の「と」で表した。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: 代わって王となった
  rationale: מלךの王として治める意味と、תחתיוが示す前王からの継承を、明快な現代日本語で表した。
- source_word: הֲדַד בֶּן בְּדַד
  choice: ベダドの子ハダド
  rationale: בןを系譜・王名表で自然な「〜の子」とし、固有名詞はヘブライ語に基づいて音写した。
- source_word: הַמַּכֶּה
  choice: 討った者
  rationale: נכהのヒフィル分詞がハダドをその行為によって特定している形を「〜した者」で保った。「討った」は攻撃・打撃・撃破の幅を持ち、文脈上自然である。
- source_word: אֶת מִדְיָן
  choice: ミディアン
  rationale: 原文の固有名をそのまま音写し、「ミディアン人」と明示する解釈は本文に加えなかった。
- source_word: בִּשְׂדֵה מוֹאָב
  choice: モアブの野で
  rationale: שדהの基本義を反映しつつ、日本語で地理的な広がりも表し得る「野」を選んだ。「地方」「領域」の可能性は脚注に示した。
- source_word: וְשֵׁם עִירוֹ
  choice: その町の名は…であった
  rationale: ヘブライ語の命名定型を、簡潔で格調を保った自然な日本語にした。
- source_word: עֲוִית
  choice: アビト
  rationale: 地名として日本語で簡潔に音写した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、王名表の簡潔で荘重な調子を保った。原文の分詞によるハダドの説明は「討った者」として残し、地理語שדהの幅は脚注で保持した。
