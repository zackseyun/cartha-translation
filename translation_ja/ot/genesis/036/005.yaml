lexical_decisions:
- source_word: אָהֳלִיבָמָה
  choice: オホリバマ
  rationale: ヘブライ語の人名を、日本語で読みやすい慣用的な形に音写した。
- source_word: יָלְדָה
  choice: 産んだ
  rationale: 女性であるオホリバマを主語とする出産の動詞であり、系譜文の簡潔さを保って自然に訳した。
- source_word: יעיש
  choice: エウシュ
  rationale: ヘブライ語人名の発音に基づく日本語音写。
- source_word: יַעְלָם
  choice: ヤラム
  rationale: ヘブライ語人名の発音に基づく日本語音写。
- source_word: קֹרַח
  choice: コラ
  rationale: ヘブライ語人名の発音に基づく日本語音写。
- source_word: בְּנֵי
  choice: 息子たち
  rationale: ここでは列挙される男子を具体的に指すため、性別を保持した。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: אֲשֶׁר יֻלְּדוּ לוֹ
  choice: エサウに生まれた
  rationale: 受動形と与格代名詞の構造を保ち、父エサウの子として生まれたことを自然な日本語で表した。母を明示する別表現は、この節後半の原文にない要素を補うため避けた。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地で
  rationale: אֶרֶץ（地）を明示しつつ、出生地を示す自然な日本語とした。
