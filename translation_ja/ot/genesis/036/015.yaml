base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/015.yaml
  text: 'These are the chiefs of the sons of Esau: the sons of Eliphaz[a], Esau’s firstborn: Chief Teman, Chief Omar, Chief Zepho[b], Chief Kenaz.'
translation:
  language: ja
  text: これらはエサウの子らの族長たちである。エサウの長子エリファズの子らは、族長テマン、族長オマル、族長ツェフォ、族長ケナズである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַלּוּפֵי / אַלּוּף
  choice: 族長たち／族長
  rationale: エドムの系譜における氏族・部族集団の長を表す称号として、現代日本語で明瞭かつ簡潔な「族長」を用いた。「首長」も可能だが、この文脈では氏族的性格が伝わりやすい。
- source_word: בְנֵי
  choice: 子ら
  rationale: 原文の系譜表現を保つため「子ら」とした。文脈上は子孫を含み得るが、ここではエリファズから直接続く名簿として自然である。
- source_word: בְּכוֹר
  choice: 長子
  rationale: 出生順位と身分上の含意を簡潔に保持する、聖書本文にふさわしい現代標準語。
- source_word: אֵלֶּה
  choice: これらは
  rationale: 名簿を導入する無動詞文を、日本語で自然な提示表現にした。
- source_word: עֵשָׂו / אֱלִיפַז / תֵּימָן / אוֹמָר / צְפוֹ / קְנַז
  choice: エサウ／エリファズ／テマン／オマル／ツェフォ／ケナズ
  rationale: ヘブライ語の固有名を、日本語聖書で認識しやすい慣用的な音写に従って表記した。צְפוֹ は子音を反映して「ツェフォ」とした。
