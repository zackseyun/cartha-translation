id: GEN.36.6
reference: Genesis 36:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח עֵשָׂ֡ו אֶת נָ֠שָׁי/ו וְ/אֶת בָּנָ֣י/ו וְ/אֶת בְּנֹתָי/ו֮ וְ/אֶת כָּל נַפְשׁ֣וֹת בֵּית/וֹ֒ וְ/אֶת מִקְנֵ֣/הוּ וְ/אֶת כָּל בְּהֶמְתּ֗/וֹ וְ/אֵת֙ כָּל קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יֵּ֣לֶךְ אֶל אֶ֔רֶץ מִ/פְּנֵ֖י יַעֲקֹ֥ב אָחִֽי/ו־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/006.yaml
  text: And Esau took his wives[a], his sons, his daughters, and all the persons of his household, along with his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and went to a land because of his brother Jacob.
translation:
  language: ja
  text: エサウは、妻たち、息子たち、娘たち、家の者すべてを連れ、自分の家畜、すべての動物、またカナンの地で得たすべての財産を携えて、兄弟であるヤコブのもとを離れ[b]、ある土地[a]へ行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は「ある土地へ」。一部の写本と古代訳は「セイルの地へ」という読みを支持する。文脈に基づいて「別の土地へ」と訳すこともある。
    reason: textual_variant
  - marker: b
    text: ヘブライ語は直訳すると「兄弟ヤコブの前から」。この表現は「ヤコブのもとを離れて」とも、「ヤコブのために」とも理解できる。
    reason: semantic_ambiguity
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 連れ……携えて
  rationale: 基本義は「取る」。ここでは移住に際して人々と財産を一緒に移すことを表すため、人には「連れ」、物には「携えて」と自然な日本語で訳し分けた。
- source_word: נָשָׁיו
  choice: 妻たち
  rationale: 文脈上、複数形はエサウの妻たちを指す。
- source_word: בָּנָיו / בְּנֹתָיו
  choice: 息子たち、娘たち
  rationale: 原文が息子と娘を明示的に区別しているため、「子どもたち」とまとめずに保持した。
- source_word: כָּל נַפְשׁוֹת בֵּיתוֹ
  choice: 家に属するすべての者
  rationale: נֶפֶשׁ はこの慣用句では「魂」ではなく人を指す。家族だけに限定せず、家に属する者全体を表した。
- source_word: מִקְנֵהוּ
  choice: 家畜
  rationale: 飼育される財産としての動物群を表す一般的な語なので、現代日本語の「家畜」とした。
- source_word: כָּל בְּהֶמְתּוֹ
  choice: すべての動物
  rationale: בְּהֵמָה の広い意味を保ち、直前の מִקְנֶה「家畜」と同一表現にせず原文の並列を残した。
- source_word: כָּל קִנְיָנוֹ אֲשֶׁר רָכַשׁ
  choice: 得たすべての財産
  rationale: קִנְיָן と רכשׁ に共通する取得の意味を、重くなりすぎない自然な日本語で表した。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地で
  rationale: 原文の地理的表現「カナンの地」を保持した。
- source_word: אֶל אֶרֶץ
  choice: ある土地へ
  rationale: マソラ本文の不定表現「一つの土地へ」をそのまま反映し、「別の土地」や「セイルの地」を本文に補わなかった。
- source_word: מִפְּנֵי יַעֲקֹב אָחִיו
  choice: 弟ヤコブのゆえに
  rationale: מִפְּנֵי が持ちうる因果的な意味を反映した。次節は共住できなかった事情を説明するが、訳文ではその原因をさらに具体化していない。ヤコブがエサウの弟であることは物語上明白で、日本語として自然に示した。
theological_decisions:
- issue: מִפְּנֵי の空間的意味と因果的意味
  choice: 弟ヤコブのゆえに
  alternative: 弟ヤコブから離れて
  rationale: 前置詞には「面前から／離れて」と「～のために」の両義がありうる。続く36:7が分離の理由を述べるため、ここでは因果的な力を本文に出したが、具体的な動機までは補わなかった。
translation_notes:
  register: 明快な現代標準日本語を用いながら、列挙の重みと物語文の品位を保った。人と物に同じ動詞を不自然に当てず、「連れ」「携えて」と訳し分けた。
