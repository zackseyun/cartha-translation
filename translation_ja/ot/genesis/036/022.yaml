source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵי לוֹטָ֖ן חֹרִ֣י וְ/הֵימָ֑ם וַ/אֲח֥וֹת לוֹטָ֖ן תִּמְנָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/022.yaml
  text: The sons of Lotan were Hori and Hemam[b][a], and Lotan’s sister was Timna.
translation:
  language: ja
  text: ロタンの息子たちはホリとヘマム[a]であり、ロタンの姉妹はティムナであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は「ヘマム」。並行する歴代誌第一1章39節では「ホマム」となっている。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: であり
  rationale: 系図において子らの名を挙げる連結表現であり、存在や変化ではなく単純な関係を自然な日本語で示す。
- source_word: בְנֵי
  choice: 息子たち
  rationale: ここでは男性名二人が続くため、広義の「子どもたち」ではなく男性の子を明示する。
- source_word: לוֹטָן
  choice: ロタン
  rationale: ヘブライ語の人名を現代日本語で読みやすく音写した。
- source_word: חֹרִי
  choice: ホリ
  rationale: 人名として翻訳せず音写した。
- source_word: הֵימָם
  choice: ヘマム
  rationale: この節のマソラ本文の母音を反映した。並行箇所の「ホマム」は脚注で示す。
- source_word: וַאֲחוֹת
  choice: 姉妹は
  rationale: 原語は年長・年少を特定しないため、「姉」「妹」とせず、曖昧さを保つ「姉妹」とした。日本語として文を整えるため助詞「は」を補った。
- source_word: תִּמְנָע
  choice: ティムナ
  rationale: この箇所のヘブライ語の人名を音写した。
theological_decisions: []
translation_notes:
  register: 簡潔な系図文の調子を保ちつつ、現代標準日本語として自然で格調ある叙述にした。「姉妹」は年齢関係を決めない語として用いた。英語綴りにのみ関わる Timna/Timnah の相違は、日本語訳では独立した有益な異読にならないため脚注化しなかった。
