  text: וְ/אֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּ/הַ֖ר שֵׂעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/009.yaml
  text: And these are the generations of Esau[a], the father of Edom, in the hill country of Seir.
translation:
  language: ja
  text: さて、以下は、セイルの山地[a]にいた、エドムの父であるエサウの系譜である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「セイル山にいた」、あるいは「セイルの山々にいた」。
    reason: ヘブライ語 הַר は、単一の山、山々、山岳地域のいずれをも指し得るため。
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: さて、以下は
  rationale: 接続詞による前段とのつながりを「さて」で示し、系譜を導入する定型句として現代日本語に自然な「以下は」を用いた。
- source_word: תֹּלְדוֹת
  choice: 系譜
  rationale: 創世記の各区分を導入する反復的な語であり、ここでは直後に子孫の一覧が続くため、「系譜」が文学的機能と文脈の双方を明瞭に表す。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 日本語聖書で広く定着した固有名表記を用いた。
- source_word: אֲבִי אֱדוֹם
  choice: エドムの父祖
  rationale: 直訳的な「エドムの父」よりも、民族の始祖・祖先という文脈上の意味を自然に伝えつつ、エサウとエドムの密接な同定関係を保つ。
- source_word: בְּ/הַר שֵׂעִיר
  choice: セイルの山地における
  rationale: הַר は単一の山にも山岳地域にもなり得る。ここでは地域名セイルとの地理的表現として「山地」を本文に採り、別の可能性を脚注に残した。
theological_decisions: []
translation_notes:
  register: 創世記の系譜導入句としての格調を保ちながら、一般の読者に明快な現代標準日本語とした。「系譜」「父祖」により、過度に古風にならず系譜的文脈を明示した。
