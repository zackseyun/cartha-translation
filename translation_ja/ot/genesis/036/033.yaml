  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: ja
  text: ベラが死に、ボツラ出身[a]のゼラの子ヨバブが、彼に代わって王となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ボツラの」。ヘブライ語の前置詞は、その町の出身であること、またはその町との関係を示すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死ぬと
  rationale: 物語を進めるワイイクトル形。前王の死に続いて次王が即位する継起関係を、自然な日本語で表した。
- source_word: בָּלַע
  choice: ベラ
  rationale: ヘブライ語の固有名を、現代日本語で一般的な聖書人名表記に従って音写した。
- source_word: וַיִּמְלֹךְ
  choice: 王となった
  rationale: 王位継承の定型表現における動詞で、ここでは統治の継続よりも即位を含む継承が焦点となるため、自然な日本語にした。
- source_word: תַּחְתָּיו
  choice: 彼に代わって
  rationale: 前の統治者に代わってその地位を継ぐ意味を明確に保つ。
- source_word: יוֹבָב
  choice: ヨバブ
  rationale: ヘブライ語の固有名を日本語で音写した。
- source_word: בֶּן זֶרַח
  choice: ゼラの子
  rationale: 父称を示す連語を簡潔かつ直接的に訳した。
- source_word: מִבָּצְרָה
  choice: ボツラ出身の
  rationale: 前置詞 מִן の起点・出身を表す通常の意味を採用した。都市との所属・関係を示す可能性もあるが、日本語では「出身」が文脈に自然である。
theological_decisions: []
translation_notes:
  register: 簡潔な王位継承記事として、現代の一般読者に明瞭でありつつ品位ある叙述にした。原文の語順よりも日本語として自然な修飾関係を優先し、「ボツラ出身の」をヨバブにかけた。英語相談層の脚注は died ではなく from Bozrah に関する内容と見られるが、原文の מִן の通常義を本文で十分に表せるため脚注は付さなかった。
