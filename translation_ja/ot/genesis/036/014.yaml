  text: וְ/אֵ֣לֶּה הָי֗וּ בְּנֵ֨י אָהֳלִיבָמָ֧ה בַת עֲנָ֛ה בַּת צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַ/תֵּ֣לֶד לְ/עֵשָׂ֔ו אֶת יעיש וְ/אֶת יַעְלָ֖ם וְ/אֶת קֹֽרַח־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/014.yaml
  text: 'And these were the sons of Oholibamah daughter of Anah, daughter of Zibeon, Esau''s wife: she bore to Esau Jeush, Jalam, and Korah.'
translation:
  language: ja
  text: また、アナの娘であり、ツィブオンの娘である、エサウの妻オホリバマの息子たちは次のとおりである。彼女はエサウに、エウシュ、ヤラム、コラを産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה הָיוּ
  choice: また、…次のとおりである
  rationale: 接続詞וを「また」で保ちつつ、系譜を導入するヘブライ語の定型表現を、自然で明瞭な現代日本語にした。
- source_word: בְּנֵי
  choice: 息子たち
  rationale: 列挙される人物はいずれも男性であり、一般的な「子どもたち」より原文に即している。
- source_word: אָהֳלִיבָמָה
  choice: オホリバマ
  rationale: ヘブライ語の人名を日本語で慣用的に音写した。
- source_word: בַת עֲנָה בַּת צִבְעוֹן
  choice: アナの娘であり、ツィブオンの娘である
  rationale: 原文がבַתを二度用いる系譜表現をあえて保持し、「孫娘」と解釈して平滑化しなかった。
- source_word: אֵשֶׁת עֵשָׂו
  choice: エサウの妻
  rationale: 連語関係を簡潔で自然な日本語の所有表現にした。
- source_word: וַ/תֵּלֶד לְ/עֵשָׂו
  choice: 彼女はエサウに…を産んだ
  rationale: 前置詞לが示す、エサウとの関係を「エサウに」で保持した。
- source_word: יעיש
  choice: エウシュ
  rationale: ヘブライ語人名の一般的な日本語音写を採用した。
- source_word: יַעְלָם
  choice: ヤラム
  rationale: ヘブライ語の子音と母音に基づいて音写した。
- source_word: קֹרַח
  choice: コラ
  rationale: ヘブライ語人名の一般的な日本語音写を採用した。
theological_decisions:
- issue: בַת עֲנָה בַּת צִבְעוֹןにおける親族関係
  choice: 「アナの娘であり、ツィブオンの娘である」と原文の反復を保持
  alternative: 「アナの娘、ツィブオンの孫娘」
  rationale: בַתが二度現れる原文は関係を明示的に「孫娘」と言い換えていないため、系譜上の緊張や古代の親族表現を訳文で解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、系譜の定型性にふさわしい簡潔で端正な文体とした。人名は日本語聖書で理解しやすい音写を採用した。
