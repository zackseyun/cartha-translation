- source_word: אַלּוּף
  choice: 族長
  rationale: エドムの部族・氏族を率いる者を指す語であり、簡潔で自然な現代日本語として「族長」を採用した。反復される名簿の形式も保持する。
- source_word: קְנַז
  choice: ケナズ
  rationale: 人名または氏族名として音写した。
- source_word: תֵּימָן
  choice: テマン
  rationale: 語根には「南」などの意味があるが、ここでは固有名として機能するため音写した。
- source_word: מִבְצָר
  choice: ミブツァル
  rationale: 固有名として、ヘブライ語の子音と母音を踏まえ、日本語で判別しやすい形に音写した。
