  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: ja
  text: シャウルが死に[a]、アクボルの子バアル・ハナンが彼に代わって王となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: これらの名は、伝統的な訳では別の表記が用いられることがある。本訳の「シャウル」「アクボル」は、ヘブライ語の音形に近い表記である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死に
  rationale: מותのカル形連続叙述法であり、婉曲表現を避け、簡潔な系譜的叙述に合う直接的な訳とした。
- source_word: שָׁאוּל
  choice: シャウル
  rationale: ヘブライ語の音形を比較的明瞭に反映する現代日本語の音写とした。
- source_word: וַיִּמְלֹךְ
  choice: 王となった
  rationale: מלךはここでは王位継承を述べる定型表現である。続く「彼に代わって」と自然につながり、即位して統治者となったことを簡潔に表す。
- source_word: תַּחְתָּיו
  choice: 彼に代わって
  rationale: 王位継承の文脈における「その者の地位を継ぐ」という意味を、自然な日本語で表した。
- source_word: בַּעַל חָנָן
  choice: バアル・ハナン
  rationale: 二要素から成るヘブライ語名であることが分かるよう、中黒で区切って音写した。
- source_word: בֶּן
  choice: の子
  rationale: 直接の父子関係を表す標準的な連語として訳した。
- source_word: עַכְבּוֹר
  choice: アクボル
  rationale: ヘブライ語名の子音構成を、日本語で無理なく読める形に音写した。
