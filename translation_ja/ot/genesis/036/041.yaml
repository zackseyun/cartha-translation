lexical_decisions:
- source_word: אַלּוּף
  choice: 族の首長
  rationale: 創世記36章では、エドムの氏族的集団を率いる者を指す。現代日本語で理解しやすく、君主制の爵位を連想させる語を避けた。簡潔な列挙調を保つため、各名に「族の首長」を添えた。
- source_word: אָהֳלִיבָמָה
  choice: オホリバマ
  rationale: ヘブライ語の固有名を、現代日本語で読みやすい形に音写した。ここでは氏族名として理解できる文脈にある。
- source_word: אֵלָה
  choice: エラ
  rationale: 固有名としてヘブライ語から直接音写した。普通名詞としての意味は訳文に持ち込まない。
- source_word: פִּינֹן
  choice: ピノン
  rationale: ヘブライ語の固有名を直接音写し、子音の重複を不必要に加えない自然な日本語表記とした。
