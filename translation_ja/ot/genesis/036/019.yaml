source:
  edition: WLC
  text: אֵ֧לֶּה בְנֵי עֵשָׂ֛ו וְ/אֵ֥לֶּה אַלּוּפֵי/הֶ֖ם ה֥וּא אֱדֽוֹם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/019.yaml
  text: These are the sons of Esau[a], and these are their chiefs. He is Edom.
translation:
  language: ja
  text: 以上がエサウの子らであり、以上が彼らの族長たち[a]である。エサウはエドムである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「首長たち」。ヘブライ語 אַלּוּפִים は、エドムにおける氏族または部族の長を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以上が
  rationale: 直前までの系譜を受けて総括する指示表現。日本語の系譜の結びとして自然であり、無動詞文の現在的な提示も保つ。
- source_word: בְנֵי עֵשָׂו
  choice: エサウの子ら
  rationale: 男性の子孫を列挙する系譜の文脈なので、広い意味の「子孫」ではなく「子ら」とした。固有名 עֵשָׂו は慣用表記「エサウ」とした。
- source_word: וְאֵלֶּה
  choice: であり、以上が
  rationale: 接続詞と反復された指示語を訳し、二つの総括句の並行構造を保った。
- source_word: אַלּוּפֵיהֶם
  choice: 彼らの族長たち
  rationale: 創世記36章ではエドムの氏族・部族を率いる者を指す。「族長」はその社会的役割を簡潔かつ自然に表す。
- source_word: הוּא אֱדוֹם
  choice: エサウはエドムである
  rationale: 代名詞 הוּא がエサウを受けてエドムと同定していることを明示した。単なる言い換えではなく、人物と祖先名・民族名との同定を保つ。
theological_decisions:
- issue: エサウとエドムの同定
  choice: 「エサウはエドムである」と直接的に訳す
  alternative: 「これがエドムである」または「すなわちエドムである」
  rationale: ヘブライ語の男性単数代名詞 הוּא はエサウを受けるため、個人名とエドムとの神学的・系譜的な同定を説明的に弱めず表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、系譜を締めくくる荘重さと、原文にある二つの指示句の並行性を保った。「以上が」の反復は意図的である。
