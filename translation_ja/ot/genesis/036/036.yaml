lexical_decisions:
- source_word: וַיָּמָת
  choice: 死ぬと
  rationale: 物語を進めるワイイクトル形であり、ここでは死と次の王の即位との継起を自然な日本語で示す。
- source_word: הֲדָד
  choice: ハダド
  rationale: 人名として音写した。
- source_word: וַיִּמְלֹךְ
  choice: 王となった
  rationale: מלך は王として統治することを表すが、この継承定型句では即位を含む「王となった」が自然で明瞭である。
- source_word: תַּחְתָּיו
  choice: 彼に代わって
  rationale: 前王を継いでその地位を占めるという交代・継承の意味を保つ。
- source_word: שַׂמְלָה
  choice: サムラ
  rationale: 人名としてヘブライ語の子音と母音に即して音写した。
- source_word: מִמַּשְׂרֵקָה
  choice: マスレカ出身の
  rationale: 前置詞 מִן が示す場所的起源を、人物を自然に修飾する現代日本語で表した。
