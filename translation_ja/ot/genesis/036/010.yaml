  text: אֵ֖לֶּה שְׁמ֣וֹת בְּנֵֽי עֵשָׂ֑ו אֱלִיפַ֗ז בֶּן עָדָה֙ אֵ֣שֶׁת עֵשָׂ֔ו רְעוּאֵ֕ל בֶּן בָּשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/010.yaml
  text: 'These are the names of Esau’s sons: Eliphaz son of Adah[a], Esau’s wife; Reuel son of Basemath[b], Esau’s wife.'
translation:
  language: ja
  text: エサウの息子たちの名は次のとおりである。エサウの妻アダの子エリファズ、エサウの妻バセマトの子レウエル。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת בְּנֵי עֵשָׂו
  choice: エサウの息子たちの名は次のとおりである
  rationale: 提示表現「これらが～の名である」の意味を保ちつつ、現代日本語の系譜の導入として自然にした。בְּנֵי は男性複数なので「息子たち」とした。
- source_word: אֱלִיפַז
  choice: エリファズ
  rationale: ヘブライ語の人名を日本語聖書で一般的な形に音写した。
- source_word: בֶּן עָדָה
  choice: アダの子
  rationale: בֶּן の直接の親子関係を簡潔に表した。語順は日本語として自然になるよう、後続する「エサウの妻」と合わせて「エサウの妻アダの子」とした。
- source_word: אֵשֶׁת עֵשָׂו
  choice: エサウの妻
  rationale: 連語を自然な日本語の所有表現で訳した。原文では各母親の名の後に繰り返されているため、二度とも保持した。
- source_word: רְעוּאֵל
  choice: レウエル
  rationale: ヘブライ語の子音と母音に基づき、日本語で定着した形に音写した。
- source_word: בֶּן בָּשְׂמַת
  choice: バセマトの子
  rationale: 前半の同じ親子関係の表現と一貫させた。
- source_word: בָּשְׂמַת
  choice: バセマト
  rationale: ヘブライ語人名を日本語で一般的な形に音写した。
