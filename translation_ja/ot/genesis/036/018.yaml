base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/018.yaml
  text: 'And these were the sons of Oholibamah[a], Esau’s wife: chief Jeush, chief Jalam, chief Korah. These were the chiefs of Oholibamah daughter of Anah, Esau’s wife.'
translation:
  language: ja
  text: また、エサウの妻オホリバマの息子たちは次のとおりである。首長[a]エウシュ、首長ヤラム、首長コラ。これらが、アナの娘でエサウの妻であるオホリバマの首長たちである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「氏族の長」。ヘブライ語は、エドム人の集団または氏族を率いる者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 息子たち
  rationale: 男性複数形で、ここでは名を挙げられた男子を指すため、広い意味の「子孫」ではなく「息子たち」とした。
- source_word: אֵשֶׁת עֵשָׂו
  choice: エサウの妻
  rationale: ヘブライ語の連語を自然な現代日本語の所有表現で訳し、二度の出現を一貫して表した。
- source_word: אַלּוּף
  choice: 首長
  rationale: 創世記36章ではエドムの集団または氏族を率いる者を指す。「首長」は簡潔で現代的であり、語義を狭く限定しすぎない。
- source_word: יְעוּשׁ
  choice: エウシュ
  rationale: ヘブライ語の人名に基づく日本語音写。
- source_word: יַעְלָם
  choice: ヤラム
  rationale: ヘブライ語の人名に基づく日本語音写。
- source_word: קֹרַח
  choice: コラ
  rationale: ヘブライ語の人名に基づく日本語音写。
- source_word: אֵלֶּה אַלּוּפֵי
  choice: これらが……の首長たちである
  rationale: 原文には「子孫である」という明示的な語がないため補わず、所属・関連を表す構文として訳した。
- source_word: בַּת עֲנָה
  choice: アナの娘
  rationale: 系譜的な属格関係を簡潔かつ直接的に表した。
- source_word: וְאֵלֶּה ... אֵלֶּה
  choice: また、……次のとおりである。……これらが
  rationale: 反復される指示語による系譜記事の枠組みを保ちつつ、自然な日本語に整えた。
