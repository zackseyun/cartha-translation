  text: וַ/יָּמָת֮ בַּ֣עַל חָנָ֣ן בֶּן עַכְבּוֹר֒ וַ/יִּמְלֹ֤ךְ תַּחְתָּי/ו֙ הֲדַ֔ר וְ/שֵׁ֥ם עִיר֖/וֹ פָּ֑עוּ וְ/שֵׁ֨ם אִשְׁתּ֤/וֹ מְהֵֽיטַבְאֵל֙ בַּת מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/036/039.yaml
  text: Baal-hanan son of Achbor died[a], and Hadar reigned in his place. The name of his city was Pau, and the name of his wife was Mehetabel daughter of Matred[c][b], daughter of Me-zahab.
translation:
  language: ja
  text: アクボルの子バアル・ハナンが死に、ハダル[a]が彼に代わって王となった。彼の町の名はパウ[b]で、妻の名はメヘタブエル、マトレドの娘、メ・ザハブの娘であった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の本文伝承および歴代誌第一1章50節では「ハダド」。
    reason: textual_variant
  - marker: b
    text: 歴代誌第一1章50節では「パイ」。
    reason: textual_variant
  - marker: c
    text: 「マトレドの娘であり、マトレドはメ・ザハブの娘であった」とも読める。原文は「娘」を繰り返している。
    reason: ambiguity
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死ぬと
  rationale: מותの完了した出来事を率直に表し、後続する王位継承との時間的つながりも自然な日本語で示す。
- source_word: בַּעַל חָנָן בֶּן עַכְבּוֹר
  choice: アクボルの子バアル・ハナン
  rationale: 系譜的な属格構文を自然な日本語の語順で訳し、固有名は音写する。
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: 代わって王となった
  rationale: מלךの即位・統治の意味と、תחתיוの後継関係を簡潔で明瞭に表す。
- source_word: הֲדַר
  choice: ハダル
  rationale: 提示されたWLC本文の読みを採用する。並行箇所などの異読「ハダド」は脚注に残す。
- source_word: וְשֵׁם עִירוֹ פָּעוּ
  choice: その町の名はパウ
  rationale: ヘブライ語の定型句を自然に保ち、地名はマソラ本文の母音に従って音写する。
- source_word: וְשֵׁם אִשְׁתּוֹ מְהֵיטַבְאֵל
  choice: 妻の名はメヘタブエルといい
  rationale: 名前を示す定型表現を現代日本語として読みやすく訳し、固有名を音写する。
- source_word: בַּת מַטְרֵד בַּת מֵי זָהָב
  choice: マトレドの娘、メ・ザハブの娘
  rationale: 原文が「娘」を反復する同格的な系譜表現を保持し、誰がメ・ザハブの娘かという日本語上の曖昧さは脚注で説明する。
