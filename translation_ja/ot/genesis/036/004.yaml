  yaml_path: translation/ot/genesis/036/004.yaml
  text: Adah bore Eliphaz to Esau, and Basemath bore Reuel.
translation:
  language: ja
  text: アダはエサウとの間にエリファズを産み、バセマトはレウエルを産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד / יָלְדָה
  choice: 産み／産んだ
  rationale: いずれも ילד（産む）の活用形。系譜の簡潔な叙述に合う自然な現代日本語とし、母親が主語であることを明確にした。
- source_word: לְעֵשָׂו
  choice: エサウとの間に
  rationale: ילד とともに用いられる לְ は、ここでは父親を示す。日本語では「エサウに産んだ」より「エサウとの間に」が自然であり、親子関係を過不足なく表す。
- source_word: אֶת
  choice: 訳語を立てない
  rationale: 目的語を示す文法標識で独立した語義はないため、日本語の語順で機能を表した。
- source_word: אֱלִיפָז
  choice: エリファズ
  rationale: マソラ本文のヘブライ語人名を、日本語聖書で通用する読みやすい形で音写した。
- source_word: בָשְׂמַת
  choice: バセマト
  rationale: マソラ本文のヘブライ語人名を音写した。語末の子音を反映して「バセマト」とした。
- source_word: רְעוּאֵל
  choice: レウエル
  rationale: マソラ本文の母音と子音に沿って人名を音写した。
- source_word: וּ
  choice: そして／～し
  rationale: 二つの出生記事を結ぶ単純な接続を、日本語では連用形「産み」で自然に表した。
