  text: And Jobab died[b][a], and Husham from the land of the Temanites reigned in his place.
translation:
  language: ja
  text: ヨバブが死に、彼に代わって、テマン人の地から来たフシャムが王となった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「テマンの地から来た」とも訳せる。ヘブライ語の形は、テマンに関係する地域を指すとも、テマン人に関係する地を指すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死ぬと
  rationale: 物語を進める連続形であり、ヨバブの死に続いて王位継承が起きたことを、自然な現代日本語で示す。
- source_word: יוֹבָב
  choice: ヨバブ
  rationale: 固有名詞を標準的な日本語音写で表した。
- source_word: וַיִּמְלֹךְ
  choice: 王となった
  rationale: この王名表では、単に統治を続けたことより王位に就いたことを表すため、「治めた」ではなく「王となった」とした。
- source_word: תַּחְתָּיו
  choice: 彼に代わって
  rationale: 前王に代わる王位継承・交代という意味を明確かつ自然に表す。
- source_word: חֻשָׁם
  choice: フシャム
  rationale: 固有名詞をヘブライ語の子音に即して日本語音写した。
- source_word: מֵאֶרֶץ
  choice: 地出身の
  rationale: 前置詞מִןが示す地理的出自を、日本語で自然な連体表現にした。
- source_word: הַתֵּימָנִי
  choice: テマン人
  rationale: 定冠詞付きの民族・地域形容語として読み、テマンに属する人々またはその地域との結び付きを表した。地域名そのものを指す可能性は脚注に残した。
