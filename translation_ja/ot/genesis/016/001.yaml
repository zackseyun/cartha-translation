id: GEN.16.1
reference: Genesis 16:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/שָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑/וֹ וְ/לָ֛/הּ שִׁפְחָ֥ה מִצְרִ֖ית וּ/שְׁמָ֥/הּ הָגָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/001.yaml
  text: Sarai[a], Abram’s wife, had borne him no children, and she had an Egyptian servant woman whose name was Hagar.
translation:
  language: ja
  text: アブラムの妻サライは、アブラムの子を産んでいなかった。彼女には、ハガルという名のエジプト人の女奴隷[a]がいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「女召使い」「はしため」。ヘブライ語は、家庭内で仕える隷属身分の女性を指す。ここでは、その拘束された社会的身分を明確にするため「女奴隷」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂרַי
  choice: サライは
  rationale: 接続詞 וְ は物語の継続を示すが、この文脈の自然な現代日本語では明示せず、主題提示の「は」で新たな場面への移行を表した。固有名は慣用表記「サライ」とした。
- source_word: אֵשֶׁת אַבְרָם
  choice: アブラムの妻
  rationale: 連語の意味と語順を自然な日本語で明示した。
- source_word: לֹא יָלְדָה לוֹ
  choice: アブラムの子を産んでいなかった
  rationale: 直訳的な「彼のために産んでいなかった」は日本語では不自然なため、לוֹ が示す夫との関係を「アブラムの子」として表した。目的語「子」は出産を表す動詞と文脈から補った。継続する背景状況は「産んでいなかった」で示した。
- source_word: וְלָהּ
  choice: 彼女には……がいた
  rationale: 所有を表す前置詞句を、人を所有対象として扱う文脈に適した日本語の存在構文で表した。
- source_word: שִׁפְחָה
  choice: 女奴隷
  rationale: 家庭内で仕える隷属身分の女性を指す語であり、後続物語に重要な法的・社会的な非自由身分を曖昧にしない表現を選んだ。
- source_word: מִצְרִית
  choice: エジプト人の
  rationale: 女奴隷の出身・民族的属性を示す形容詞を、自然な連体修飾で表した。
- source_word: וּשְׁמָהּ הָגָר
  choice: ハガルという名の
  rationale: 名を明示する原文を、前の名詞句に自然につながる日本語で表した。固有名は慣用表記「ハガル」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「はしため」は古風なので本文では避け、歴史的な隷属身分を隠さない「女奴隷」を採用した。二つの節を二文に分け、背景説明として読みやすくした。
