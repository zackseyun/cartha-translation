id: GEN.16.11
reference: Genesis 16:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הִנָּ֥/ךְ הָרָ֖ה וְ/יֹלַ֣דְתְּ בֵּ֑ן וְ/קָרָ֤את שְׁמ/וֹ֙ יִשְׁמָעֵ֔אל כִּֽי שָׁמַ֥ע יְהוָ֖ה אֶל עָנְיֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/011.yaml
  text: Then the angel of Yahweh said to her[a], “Behold, you are pregnant and will bear a son, and you shall call his name Ishmael, because Yahweh has heard your affliction.”
translation:
  language: ja
  text: すると、ヤハウェの御使い[a]は彼女に言った。「見よ、あなたは身ごもっており、男の子を産む。その名をイシュマエルと呼びなさい。ヤハウェがあなたの苦しみを聞かれたからである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェの使者」。
    reason: מַלְאַךְ は「御使い」または「使者」を意味し得るため。
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ヤハウェの使い
  rationale: מַלְאַךְ は「使者」とも「御使い」とも訳し得る。本文では天的存在を指す文脈に合う「使い」としつつ、その正体について本文以上の神学的特定を避けた。
- source_word: הִנָּךְ הָרָה
  choice: 見よ、あなたは身ごもっており
  rationale: הִנֵּה の注意喚起と荘重な告知の調子を「見よ」で保ち、הָרָה は明瞭で自然な「身ごもっている」とした。
- source_word: וְיֹלַדְתְּ בֵּן
  choice: 男の子を産む
  rationale: 未来の出産を告げる表現として、簡潔で自然な現代日本語にした。
- source_word: וְקָרָאת שְׁמוֹ
  choice: その名を…と呼びなさい
  rationale: 聖書に繰り返される「名を呼ぶ」という命名定型を保持し、文脈上の指示の力を「なさい」で表した。
- source_word: יִשְׁמָעֵאל
  choice: イシュマエル
  rationale: 人名として標準的に音写した。名の意味は後続の理由節によって示されるため、本文中では翻訳しない。
- source_word: כִּי שָׁמַע יְהוָה
  choice: ヤハウェが…聞かれたからである
  rationale: כִּי を命名理由として訳し、完了形 שָׁמַע はすでに聞き届けたことを示す過去形で表した。神の行為への敬意を自然な日本語の尊敬表現で示した。
- source_word: עָנְיֵךְ
  choice: あなたの苦しみ
  rationale: この語が表す苦難、圧迫された状態、惨めさを過度に限定せず、一般読者に明瞭な語を選んだ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を保持し、称号への置換を避けるため。
- issue: מַלְאַךְ יְהוָה の存在の同定
  choice: ヤハウェの使い
  alternative: ヤハウェの使者、ヤハウェの御使い
  rationale: 天的な使いという文脈を伝えながら、キリスト顕現など本文が明言しない特定の神学的同定を訳文に持ち込まない。語義上の別訳は脚注に示した。
- issue: 神が「聞いた」こととイシュマエルの名の関係
  choice: 理由節をそのまま保持
  alternative: 名の意味を本文に補足する
  rationale: 原文は語呂の関連を説明するが、名の意味を明示的に挿入してはいないため、説明を本文へ追加しなかった。
translation_notes:
  register: 明瞭な現代標準語を基調とし、「見よ」と命名定型「その名を…と呼びなさい」によって原文の荘重さと聖書的な文学性を保った。
