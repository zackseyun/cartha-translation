source:
  edition: WLC
  text: עַל כֵּן֙ קָרָ֣א לַ/בְּאֵ֔ר בְּאֵ֥ר לַחַ֖י רֹאִ֑י הִנֵּ֥ה בֵין קָדֵ֖שׁ וּ/בֵ֥ין בָּֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/014.yaml
  text: Therefore the well was called Beer-lahai-roi. Look, it is between Kadesh and Bered.
translation:
  language: ja
  text: それゆえ、その井戸は「ベエル・ラハイ・ロイ」[a]と呼ばれた。見よ、それはカデシュとベレデの間にある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ベエル・ラハイ・ロイ」は、おおよそ「私を見ておられる生ける方の井戸」の意。
    reason: 音写されたヘブライ語の井戸名の語義と、直前の物語とのつながりを示すため。語義の説明を「直訳」と断定せず、名称内の解釈上の幅を保つ。
lexical_decisions:
- source_word: עַל כֵּן
  choice: それゆえ
  rationale: 直前の出来事を受けた命名の理由を、自然で格調ある現代日本語で示す。
- source_word: קָרָא
  choice: 呼ばれた
  rationale: ヘブライ語は能動形で主語が明示されないため、命名されたという意味を日本語の受身で自然に表した。
- source_word: בְּאֵר לַחַי רֹאִי
  choice: ベエル・ラハイ・ロイ
  rationale: 固有の井戸名として音写し、語義については脚注で示した。
- source_word: הִנֵּה
  choice: それは
  rationale: ここでは読者の注意を所在地へ向ける談話標識であり、日本語では独立した『見よ』を置くより、指示語によって自然に焦点を示す。
- source_word: בֵין קָדֵשׁ וּבֵין בָּרֶד
  choice: カデシュとベレデの間に
  rationale: 二重のבֵיןによる『AとBの間』という地理的位置を標準的な日本語で表した。
theological_decisions:
- issue: 井戸名の語義
  choice: 本文では音写し、脚注で『私を見ておられる生ける方の井戸』と説明する
  alternative: 語義を本文中の名称として訳出する
  rationale: 固有名としての機能を保ちつつ、前節の神を見る／神に見られるという意味上のつながりを読者に示すため。語義には文法上の解釈幅があるので『直訳』として限定した。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語とし、地名は一般的な聖書表記に近い音写を採用した。原文のהִנֵּהは所在地を指し示す働きとして自然な日本語に織り込み、過度に古風な『見よ』は避けた。
