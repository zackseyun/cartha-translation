  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי מִ/זֶּ֥ה בָ֖את וְ/אָ֣נָה תֵלֵ֑כִי וַ/תֹּ֕אמֶר מִ/פְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔/י אָנֹכִ֖י בֹּרַֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/008.yaml
  text: And he said[a], “Hagar, Sarai’s servant woman, where have you come from, and where are you going?” And she said[b], “I am fleeing from the presence of Sarai my mistress.”
translation:
  language: ja
  text: 彼は言った。「ハガル、サライの女奴隷[a]よ。あなたはどこから来て、どこへ行くのか。」彼女は答えた。「私は女主人サライのもとから[b]逃げています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕え女」とも訳せる。ヘブライ語は、サライのもとで隷属的身分にある女性を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「女主人サライの前から」。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁפְחַת
  choice: 女奴隷
  rationale: 女性であることと、サライのもとで自由を制限された隷属的身分にあることの両方を明示する。伝統的な「はしため」より現代の読者に明確で、「女中」や「召使い」より身分を婉曲化しない。
- source_word: אֵי מִזֶּה בָאת
  choice: あなたはどこから来て
  rationale: 起点を問うヘブライ語の慣用表現を、自然な現代日本語で表した。
- source_word: וְאָנָה תֵלֵכִי
  choice: どこへ行くのか
  rationale: אָנָה は目的地を問い、未完了形 תֵלֵכִי はこの文脈では進行中または目前の行為を表し得る。「どこへ行くのか」はその幅を保つ。
- source_word: מִפְּנֵי
  choice: もとから
  rationale: 字義的には「顔／前から」で、人のもとを離れて逃れることを示す。「もとから」は日本語として自然でありつつ、単なる原因ではなくサライの支配領域からの離脱を表す。
- source_word: גְּבִרְתִּי
  choice: 女主人
  rationale: 女性の上位者・所有者を指す女性形。ハガル自身が認めるサライとの上下関係を明確に示す。
- source_word: בֹּרַחַת
  choice: 逃げているところです
  rationale: 女性単数分詞による継続中の逃走を自然な日本語で表した。
- source_word: וַיֹּאמַר
  choice: 彼は言った
  rationale: 前節の話者を男性単数代名詞で受けるが、この節にない「主の使い」という称号は補わない。
- source_word: וַתֹּאמֶר
  choice: 彼女は答えた
  rationale: 字義は「彼女は言った」だが、直前の問いへの応答であることを自然な日本語で示す。内容上の情報は加えていない。
- source_word: שָׂרַי / הָגָר
  choice: サライ／ハガル
  rationale: 日本語聖書で広く認知されている標準的な音写を用いる。
theological_decisions:
- issue: ハガルの社会的身分の訳し方
  choice: 女奴隷
  alternative: 仕え女／女中／召使い
  rationale: שִׁפְחָה が示す女性の隷属的身分を婉曲化せず、本文にある力関係を保つ。
- issue: 話者を「主の使い」と明示するか
  choice: 彼は言った
  alternative: 主の使いは言った
  rationale: 前節から話者は判明するが、本節のヘブライ語は称号を繰り返していないため、本文そのものの表現を保つ。
- issue: מִפְּנֵי の空間的・関係的含意
  choice: 女主人サライのもとから
  alternative: 女主人サライの前から／女主人サライから
  rationale: 「前／面前」という字義的像と、支配下から逃れる文脈の両方を「もとから」で自然に伝える。原因を表す「サライのために」とは解さない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として自然でありながら尊厳ある調子を保った。「はしため」のような古語は避け、ハガルの隷属的身分と逃走の継続性を明示した。
