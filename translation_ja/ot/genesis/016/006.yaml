source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אַבְרָ֜ם אֶל שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵ/ךְ֙ בְּ/יָדֵ֔/ךְ עֲשִׂי לָ֖/הּ הַ/טּ֣וֹב בְּ/עֵינָ֑יִ/ךְ וַ/תְּעַנֶּ֣/הָ שָׂרַ֔י וַ/תִּבְרַ֖ח מִ/פָּנֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/006.yaml
  text: Then Abram said to Sarai[a], “Look, your female servant is in your hand; do to her what is good in your eyes.” Then Sarai afflicted her, and she fled from her presence.
translation:
  language: ja
  text: そこでアブラムはサライに言った。「見なさい。あなたの女奴隷はあなたの手の内にいる。あなたがよいと思うように、彼女を扱いなさい。」するとサライは彼女を苦しめた[a]。彼女はサライのもとから逃げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「彼女を虐待した」「彼女を厳しく扱った」。ヘブライ語の動詞は、苦しめること、辱めること、または過酷に扱うことを表し得る。
    reason: ענה（ピエル）は深刻な加害・抑圧を示す一方、この節だけではその具体的な形態を特定しないため。
lexical_decisions:
- source_word: הִנֵּה
  choice: 見なさい
  rationale: 相手の注意を促す指示的な力を保ちつつ、現代日本語として理解できる表現にした。
- source_word: שִׁפְחָתֵךְ
  choice: あなたの女奴隷
  rationale: この語が示す女性の隷属的な身分と、物語における権力関係を弱めずに明示した。
- source_word: בְּיָדֵךְ
  choice: あなたの手にある
  rationale: 支配下・権限下にあるという意味を含むヘブライ語の「手」の比喩を、日本語でも理解可能な形で保持した。
- source_word: עֲשִׂי לָהּ הַטּוֹב בְּעֵינָיִךְ
  choice: あなたが良いと思うように彼女を扱いなさい
  rationale: 「あなたの目に良いことを彼女にせよ」という意味を自然な現代日本語で表し、判断がサライに委ねられていることを保った。
- source_word: וַתְּעַנֶּהָ
  choice: 彼女を苦しめた
  rationale: ピエル形が表す加害、抑圧、屈辱を幅広く含めつつ、具体的な方法を本文以上に限定しない表現とした。
- source_word: וַתִּבְרַח מִפָּנֶיהָ
  choice: 彼女はサライのもとから逃げ去った
  rationale: 逃走の切迫感と、サライのいる場所・支配圏から離れたことを自然な日本語で表した。
theological_decisions:
- issue: ハガルの社会的身分の表現
  choice: 女奴隷
  alternative: 女中／仕え女
  rationale: שִׁפְחָה が示す隷属的身分は、この節の権力関係を理解するうえで重要であるため、一般的な奉仕者へと弱めなかった。
- issue: サライの扱いの厳しさ
  choice: 苦しめた
  alternative: 虐待した／厳しく扱った
  rationale: וַתְּעַנֶּהָ は実際の抑圧や加害を示すが、その具体的形態は明記しない。「苦しめた」により重大さを保ち、別訳を脚注に示して語義の幅を残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語を用いた。「女奴隷」によって身分を明示しつつ、発話部分ではヘブライ語の「手」の比喩を残した。叙述は簡潔にし、サライの行為とハガルの逃走との因果的なつながりが自然に伝わるようにした。
