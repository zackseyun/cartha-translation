  to: そこでアブラムはサライに言った。「見なさい。あなたの女奴隷はあなたの手の内にいる。あなたがよいと思うように、彼女を扱いなさい。」するとサライは彼女を苦しめた[a]。彼女はサライのもとから逃げた。
  rationale: 原文の逐次的な叙述を保つため、「ので」を文末で区切る形に改めました。また、「手」の比喩が示すサライの権限を、現代日本語として自然な「手の内にいる」で表しました。その他の訳語と脚注は、隷属的身分およびサライの扱いの厳しさを弱めず、かつ原文が特定しない詳細を加えない点で適切です。
