  yaml_path: translation/ot/genesis/016/016.yaml
  text: Abram was eighty-six years old when Hagar bore Ishmael to Abram[a].
translation:
  language: ja
  text: ハガルがアブラムに[a]イシュマエルを産んだ時、アブラムは八十六歳であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アブラムのために」。この文脈で、ヘブライ語の前置詞はどちらにも訳すことができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַבְרָם
  choice: アブラム
  rationale: 固有名詞を、日本語聖書で広く定着している表記に従って音写した。文頭の接続詞は、単独節として自然な日本語にするため明示しない。
- source_word: בֶּן
  choice: 八十六歳であった
  rationale: 年齢を表すヘブライ語の慣用表現なので、字義どおりの「…の子」ではなく、自然な日本語の年齢表現とした。
- source_word: שְׁמֹנִים שָׁנָה וְ/שֵׁשׁ שָׁנִים
  choice: 八十六歳
  rationale: 「八十年と六年」という構造を、意味を保った現代日本語の通常の数詞表現にまとめた。
- source_word: בְּ/לֶדֶת
  choice: 産んだ時
  rationale: 前置詞と不定詞連語が示す時間関係を、明瞭で自然な従属節として訳した。
- source_word: הָגָר
  choice: ハガル
  rationale: 固有名詞を、日本語聖書で広く定着している表記に従って音写した。
- source_word: אֶת יִשְׁמָעֵאל
  choice: イシュマエルを
  rationale: 目的語標識 אֶת は訳語を置かず、固有名詞を定着した日本語表記で音写し、目的格を助詞「を」で示した。
- source_word: לְ/אַבְרָם
  choice: アブラムに
  rationale: 前置詞 לְ が示す、出産とアブラムとの関係を簡潔に保った。「アブラムのために」と理解する余地もあるため脚注を付した。
