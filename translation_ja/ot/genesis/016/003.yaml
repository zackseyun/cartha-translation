source:
  edition: WLC
  text: וַ/תִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת אַבְרָ֗ם אֶת הָגָ֤ר הַ/מִּצְרִית֙ שִׁפְחָתָ֔/הּ מִ/קֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְ/שֶׁ֥בֶת אַבְרָ֖ם בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/אַבְרָ֥ם אִישָׁ֖/הּ ל֥/וֹ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/003.yaml
  text: So Sarai[a], Abram’s wife, took Hagar the Egyptian, her female servant, after Abram had lived ten years in the land of Canaan[b], and gave her to Abram her husband as a wife.
translation:
  language: ja
  text: さて、アブラムがカナンの地に住んで十年たった後、アブラムの妻サライは、自分の女奴隷であるエジプト人ハガルを取り、夫アブラムに妻として与えた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文はハガルをサライの「女奴隷」と呼ぶ一方、ここではアブラムに「妻として」与えられたと記している。
    reason: 原文が併記する二つの身分関係を明示し、「そばめ」という解釈語への置き換えを避けるため。
lexical_decisions:
- source_word: וַתִּקַּח
  choice: 取った
  rationale: לקח の通常の物語用法を保つ。「選んだ」などの解釈を加えず、後続する「与えた」との連続した動作を示す。
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: アブラムの妻サライ
  rationale: 同格的な関係表示を、自然な現代日本語の語順で表した。
- source_word: הָגָר הַמִּצְרִית
  choice: エジプト人ハガル
  rationale: 固有名は慣用的に音写し、民族的・地理的出自を簡潔に示した。
- source_word: שִׁפְחָתָהּ
  choice: 自分の女奴隷
  rationale: שִׁפְחָה が示す隷属的な社会身分を、「召使い」などで弱めずに明示した。
- source_word: מִקֵּץ עֶשֶׂר שָׁנִים
  choice: 十年たった後
  rationale: 十年という期間の完了後を示す句として、明快で自然な日本語にした。
- source_word: לְשֶׁבֶת אַבְרָם בְּאֶרֶץ כְּנָעַן
  choice: アブラムがカナンの地に住み始めて
  rationale: 不定詞構文が示す時間の起点・状況を、日本語では有限節として明瞭に表現した。
- source_word: וַתִּתֵּן אֹתָהּ לְאַבְרָם אִישָׁהּ
  choice: 夫アブラムに……与えた
  rationale: サライが動作主であり、アブラムがその夫であることを、簡潔で自然な形で保った。
- source_word: לוֹ לְאִשָּׁה
  choice: 妻として
  rationale: 原文の אִשָּׁה を「そばめ」と言い換えず、与えられた身分・関係をそのまま示した。לוֹ は日本語では受け手「夫アブラムに」によって十分表される。
theological_decisions:
- issue: ハガルとアブラムの関係上の身分
  choice: 「妻として」と訳し、同時にハガルをサライの「女奴隷」と明記する。
  alternative: 「そばめとして」または「妻にするため」
  rationale: 原文はハガルを שִׁפְחָה（女奴隷）と呼ぶ一方、アブラムとの関係には אִשָּׁה（妻／女）を用いる。両方を残し、社会的・法的な緊張を一方に解消しない。
translation_notes:
  register: 明快な現代標準語を用いながら、物語文としての品位を保った。「さて」で叙述の進行を示し、「女奴隷」「妻」という原文の異なる身分語を意図的に併存させた。
