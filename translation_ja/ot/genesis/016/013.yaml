source:
  edition: WLC
  text: וַ/תִּקְרָ֤א שֵׁם יְהוָה֙ הַ/דֹּבֵ֣ר אֵלֶ֔י/הָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲ/גַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/013.yaml
  text: So she called the name of Yahweh who spoke to her[a], “You are a God who sees me,” for she said[c][b], “Have I really here seen after the One who sees me?”
translation:
  language: ja
  text: そこで彼女は、自分に語りかけたヤハウェを、「あなたは私を見ておられる神です」[a]と呼んだ。彼女が、「私はここでも、私を見る方に見られた後で、見たのだろうか」[b]と言ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたは見る神です」または「あなたは見ることの神です」。
    reason: רֳאִי の語形と意味には複数の理解があるため。
  - marker: b
    text: この結びは意味の取りにくいヘブライ語。別の理解では、「私はここで、私を見る方を見た後も生きているのだろうか」という意味になりうる。また「あの方に見られた後で」は「あの方の後ろを」と理解される可能性もある。
    reason: 難解な רָאִיתִי אַחֲרֵי רֹאִי について、本文では構文上の曖昧さをできるだけ保ち、代表的な解釈を脚注に示すため。
lexical_decisions:
- source_word: וַתִּקְרָא שֵׁם יְהוָה
  choice: ヤハウェの名を、…と呼んだ
  rationale: 「名を呼ぶ」というヘブライ語の形を保ちつつ、引用句がヤハウェに与えられた呼び名であることが日本語で分かる形にした。神名 יהוה は称号に置き換えず「ヤハウェ」とした。
- source_word: הַדֹּבֵר אֵלֶיהָ
  choice: 自分に語りかけた
  rationale: 分詞は、ここでハガルに語っている方を指す。文脈に即して自然な過去表現とした。
- source_word: אַתָּה אֵל רֳאִי
  choice: あなたは私を見てくださる神です
  rationale: רֳאִי は「見ること」「私を見る方」など複数の理解が可能である。直前まで顧みられなかったハガルへの神のまなざしを表す文脈に沿い、「私を見てくださる」としたが、別解は脚注に残した。
- source_word: הֲגַם הֲלֹם
  choice: ここで…本当に…だろうか
  rationale: 疑問と驚きを表す二つの小辞の強調を、日本語の「本当に」と疑問形で表した。
- source_word: רָאִיתִי אַחֲרֵי רֹאִי
  choice: 私を見る方の後を本当に見たのだろうか
  rationale: 極めて難解な句であり、ראה（見る）と אחרי（後、後ろ）の語感を本文に残した。生き延びたという意味を本文へ補わず、可能な解釈として脚注に示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、称号「主」に置き換えず音写した。
- issue: 神への呼称 אֵל רֳאִי の解釈
  choice: 私を見てくださる神
  alternative: 見る神／見ることの神
  rationale: ハガルが神に見いだされた直前の文脈を自然に表す一方、難しい名詞形の別解を脚注に明記した。
- issue: 末尾 רָאִיתִי אַחֲרֵי רֹאִי の解釈
  choice: 私を見る方の後を…見た
  alternative: 私を見る方を見た後も生きている
  rationale: 原文の圧縮された構文と「後／後ろ」の曖昧さを保ち、神を見ても生き延びたという伝統的理解を本文で断定しなかった。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で品位ある叙述体。「見てくださる」は敬意と神の顧みを自然に示すが、本文の難所は過度に説明せず脚注で補った。
