source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה שׁ֖וּבִי אֶל גְּבִרְתֵּ֑/ךְ וְ/הִתְעַנִּ֖י תַּ֥חַת יָדֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/009.yaml
  text: Then the angel of Yahweh said to her[c][b][a], “Return to your mistress and humble yourself under her hand.”
translation:
  language: ja
  text: すると、ヤハウェの御使い[a]は彼女に言った。「女主人のもとに帰り、その支配に服しなさい[b][c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヤハウェの使者」。
    reason: lexical_alternative
  - marker: b
    text: または「身を低くしなさい」「苦しみを受け入れなさい」。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語では直訳すると「彼女の手の下で」。ここでは彼女の権威・支配のもとにあることを表す。
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: ヤハウェの使い
  rationale: מַלְאַךְ は「使者」と「御使い」の両義を持つ。ここでは神的な遭遇を描く文脈に即し、天的な使者として自然な「使い」を採用しつつ、脚注で一般的な「使者」の可能性を示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として音写した。
- source_word: שׁוּבִי
  choice: 帰り
  rationale: 女性単数への命令であることを踏まえ、文脈上の出発点である女主人のもとへ戻ることを自然な日本語で表した。
- source_word: גְּבִרְתֵּךְ
  choice: 女主人
  rationale: ハガルに対して上位の立場にある女性を指すため、現代日本語で明確な「女主人」とした。
- source_word: וְהִתְעַנִּי
  choice: 身を低くしなさい
  rationale: ענה のヒトパエル命令形が含む、自らを低い立場に置き、服従・苦難を受け入れる意味の幅を保つ表現とした。権威への服従だけに限定せず、脚注で別の理解を示した。
- source_word: תַּחַת יָדֶיהָ
  choice: その手の下に
  rationale: 「彼女の手の下に」というヘブライ語の比喩を保持した。日本語でも従属のイメージを伝えられるが、「権威の下に」の意であることを脚注で明示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文にある神の固有名を称号へ置換せずに示すため。
- issue: מַלְאַךְ を天使的存在と一般の使者のどちらとして訳すか
  choice: 使い
  alternative: 使者
  rationale: 神的な遭遇の物語文脈では天的な使いが自然だが、この語自体は「使者」も意味するため、その語義上の幅を脚注に残した。
- issue: וְהִתְעַנִּי が示す服従と苦難の関係
  choice: 身を低くしなさい
  alternative: 服しなさい／苦しみを受け入れなさい
  rationale: 命令の厳しさを弱めず、同時に、単なる内面的謙遜とも受動的な被害とも断定しない訳を選んだ。
translation_notes:
  register: 明快で現代的な標準日本語を基調としつつ、命令の重さとヘブライ語の「手の下」という比喩を保った。「身を低くする」は日常語として理解可能であり、ここでは社会的な従属と苦難を受け入れる含みを持つ。
