  text: וַֽ/יִּמְצָאָ֞/הּ מַלְאַ֧ךְ יְהוָ֛ה עַל עֵ֥ין הַ/מַּ֖יִם בַּ/מִּדְבָּ֑ר עַל הָ/עַ֖יִן בְּ/דֶ֥רֶךְ שֽׁוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/007.yaml
  text: And the angel of Yahweh found her by a spring of water in the wilderness[b][a], by the spring on the way to Shur.
translation:
  language: ja
  text: ヤハウェ[b]の使者[a]は、荒野の泉のほとりで彼女を見つけた。その泉は、シュルへ向かう道沿いにあった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「使者」に当たるヘブライ語は、「天使」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェ」は、ヘブライ語本文に記された神の名YHWHを表す。伝統的には「主」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּמְצָאָהּ
  choice: 彼女を見つけた
  rationale: מצאの基本的な意味「見つける」を保ち、女性単数目的語接尾辞を「彼女」と明示した。文脈上はハガルを指すが、原文どおり代名詞を維持した。
- source_word: מַלְאַךְ יְהוָה
  choice: ヤハウェの使い
  rationale: מַלְאַךְは人間の使者にも天的な使者にも用いられるため、「使い」として語義の幅を保った。יְהוָהは称号に置き換えず、固有の神名として「ヤハウェ」とした。
- source_word: עַל עֵין הַמַּיִם
  choice: 泉のほとりで
  rationale: ここでעַיִןは水源・泉を意味する。עַלは位置を表すため、自然な日本語の「ほとりで」とした。「水の泉」という不自然な重複は避けた。
- source_word: בַּמִּדְבָּר
  choice: 荒野の
  rationale: מִדְבָּרは必ずしも砂漠に限定されず、人里離れた乾燥地や原野を指すので、聖書叙述に適した「荒野」とした。
- source_word: עַל הָעַיִן בְּדֶרֶךְ שׁוּר
  choice: その泉は、シュルへ向かう道沿いにあった
  rationale: 反復されるעַיִןが同じ泉を指すことを「その泉」で明確にし、場所を示す句を自然な独立文として表した。בְּדֶרֶךְはここでは経路・道筋を表す。
theological_decisions:
- issue: מַלְאַךְの存在論的な特定
  choice: 使い
  alternative: 天使／御使い
  rationale: 原語自体は「使者」と「天使」の双方を表し得るため、本文では「使い」として曖昧さを保持し、天的存在であることを訳語だけで断定しなかった。
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に固有の神名があることを見える形で保った。「主」は伝統的な代読だが、称号への置換となるため脚注で説明した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、物語文としての簡潔さと品位を保った。「泉」の反復は原文の位置指定を伝えるため残し、二文に分けて自然な日本語に整えた。
