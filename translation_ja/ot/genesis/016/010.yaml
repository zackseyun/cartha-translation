source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר לָ/הּ֙ מַלְאַ֣ךְ יְהוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת זַרְעֵ֑/ךְ וְ/לֹ֥א יִסָּפֵ֖ר מֵ/רֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/010.yaml
  text: Then the angel of Yahweh said to her[a], “I will greatly multiply your offspring, so that it cannot be counted because of its multitude.”
translation:
  language: ja
  text: すると、ヤハウェの使者[a]が彼女に言った。「わたしはあなたの子孫を大いに増やす。あまりに多くて、数えることができないほどになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤハウェの御使い」とも訳せる。
    reason: ヘブライ語 מַלְאָךְ は「使者」を意味し、文脈によっては天的な使者、すなわち「御使い」を指す。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると、……が彼女に言った
  rationale: 物語を進めるワウ継続法を、現代日本語で自然に前後関係を示す「すると」で表した。
- source_word: מַלְאַךְ יְהוָה
  choice: ヤハウェの使い
  rationale: מַלְאַךְ が持つ「使者」と超自然的な「御使い」の両方の含みを、簡潔な「使い」で保った。神名 יְהוָה は称号に置き換えず「ヤハウェ」とした。
- source_word: הַרְבָּה אַרְבֶּה
  choice: 大いに増やす
  rationale: 不定詞絶対形と定動詞の組み合わせによる数量・程度の強調を、確実性の強調に変えず自然な日本語で表した。
- source_word: זַרְעֵךְ
  choice: あなたの子孫
  rationale: 集合的単数の זֶרַע を、文脈上ハガルから生まれる後代を指す自然な日本語で表した。日本語の「子孫」は数を明示せず集合的に用いることができる。
- source_word: וְלֹא יִסָּפֵר מֵרֹב
  choice: あまりに多くて、数えることができないほどになる
  rationale: 多数であるため数えられないという結果と理由の関係を、明快な現代日本語で表した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の神名を称号に置き換えず、一般的な学術的音写で示した。
- issue: מַלְאַךְ יְהוָה の存在の性格
  choice: ヤハウェの使い
  alternative: ヤハウェの御使い／ヤハウェの使者
  rationale: 語が持つ人間の使者と天的な御使いの語義幅を本文で狭めず、文脈にある神学的な含みを保持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。発話は簡潔にし、強調表現は過度に古風な直訳を避けつつ原文の程度の強さを保持した。
