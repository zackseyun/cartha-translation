  text: וַ/יָּבֹ֥א אֶל הָגָ֖ר וַ/תַּ֑הַר וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וַ/תֵּקַ֥ל גְּבִרְתָּ֖/הּ בְּ/עֵינֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/004.yaml
  text: He went in to Hagar[a], and she conceived. When she saw that she had conceived, her mistress was despised in her eyes.
translation:
  language: ja
  text: 彼はハガルのもとに入った。ハガルは身ごもった。自分が身ごもったと分かると、女主人は彼女の目に軽んじられる者となった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼女の女主人は、彼女の目に軽くなった」。これは、ハガルの目には女主人が軽んじられる者となったこと、すなわちハガルが女主人を軽んじたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֶל הָגָר
  choice: 彼はハガルのもとに入り
  rationale: בוא אל はこの文脈で性的関係を婉曲に表す慣用句。「もとに入る」として、原文の慎みある表現と意味を保った。
- source_word: וַתַּהַר / הָרָתָה
  choice: 身ごもった
  rationale: הרה は妊娠する、または妊娠していることを表す。同じ訳語を反復し、原文の語彙的な繰り返しを保った。
- source_word: וַתֵּרֶא כִּי
  choice: 知ると
  rationale: 直訳は「見たとき」だが、ここでは自分の妊娠を認識したことを表すため、自然な現代日本語とした。
- source_word: וַתֵּקַל גְּבִרְתָּהּ בְּעֵינֶיהָ
  choice: 女主人を軽く見るようになった
  rationale: 直訳的には「彼女の女主人は彼女の目に軽くなった」。日本語では、ハガルの評価や態度の変化を自然に示す「軽く見る」とした。
- source_word: גְּבִרְתָּהּ
  choice: 女主人
  rationale: גברת は女性の主人、上位者を指す。ハガルに対するサライの社会的立場を明確に表す。
theological_decisions:
- issue: 最後の節がサライ自身の変化を述べるのか、ハガルの評価・態度を述べるのか
  choice: ハガルが女主人を軽く見るようになったという評価・態度として本文に訳す
  alternative: 女主人は彼女の目に軽んじられる者となった
  rationale: בְּעֵינֶיהָ（彼女の目に）は評価の観点を示す慣用句であり、サライの本質的変化ではなく、ハガルから見た地位の低下を表す。ただしヘブライ語の文法上の主語は「女主人」なので、その形は脚注に残した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。性的関係については原文の婉曲表現を保ち、最後の節は日本語として自然な能動表現にしつつ、原文の構文と含みを脚注で示した。
