source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר שָׂרַ֣י אֶל אַבְרָם֮ חֲמָסִ֣/י עָלֶי/ךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִ/י֙ בְּ/חֵיקֶ֔/ךָ וַ/תֵּ֨רֶא֙ כִּ֣י הָרָ֔תָה וָ/אֵקַ֖ל בְּ/עֵינֶ֑י/הָ יִשְׁפֹּ֥ט יְהוָ֖ה בֵּינִ֥/י וּ/בֵינֶֽיׄ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/005.yaml
  text: Then Sarai said to Abram[a], “The wrong done to me is on you. I gave my female servant into your embrace, and when she saw that she had conceived, I became contemptible in her eyes[b]. May Yahweh judge between me and you.”
translation:
  language: ja
  text: サライはアブラムに言った。「私が受けた不当な仕打ちの責任は、あなたにあります[a]。私は自分の女奴隷をあなたのもとに差し出しました[b]。ところが、彼女が身ごもったことを知ると、彼女の目には、私は取るに足りない者となりました。ヤハウェが、私とあなたとの間を裁かれますように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私の不法（または暴虐）はあなたの上に」。この表現は、サライが自分の受けた不当な仕打ちについてアブラムに責任を問う言葉と理解できるが、字義的な表現には幅がある。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「あなたの懐に」。ここでは、親密な性的関係のために女奴隷をアブラムに差し出したことを表す婉曲的な言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמָסִי עָלֶיךָ
  choice: 私が受けた不当な仕打ちの責任は、あなたにあります
  rationale: חָמָסは暴力、不法、不当な仕打ちを表し、接尾辞はここではサライが被った不当さを指すと理解できる。עָלֶיךָはアブラムに責任を負わせる告発の力を保つ。
- source_word: שִׁפְחָתִי
  choice: 自分の女奴隷
  rationale: שִׁפְחָהが示す隷属的な身分を曖昧にせず、現代日本語で明確に表した。
- source_word: בְּחֵיקֶךָ
  choice: あなたの懐に入れました
  rationale: חֵיקの字義的な身体比喩を保ちつつ、ここでの親密な受け入れを慎みのある自然な日本語で表した。
- source_word: הָרָתָה
  choice: 身ごもった
  rationale: 完了した受胎と、その結果としての妊娠を自然な日本語で示す。
- source_word: וָאֵקַל בְּעֵינֶיהָ
  choice: 私を軽んじるようになりました
  rationale: 直訳では「私は彼女の目に軽い者となった」。日本語では、ハガルの評価の中でサライの地位が低下したことを能動表現で自然に伝える。
- source_word: יִשְׁפֹּט
  choice: 裁かれますように
  rationale: 未完了形の勧奨・願望的な力を、神による裁定を求める祈願として表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 固有の神名として音写し、一般称号に置き換えなかった。
- source_word: בֵּינִי וּבֵינֶיךָ
  choice: 私とあなたとの間
  rationale: 争う二者の間で神に裁定を求める直接的な表現を保持した。
theological_decisions:
- issue: חֲמָסִיの責任の所在
  choice: サライが受けた不当な仕打ちについてアブラムに責任を問う発言
  alternative: サライ自身の犯した不法がアブラムの上に帰するという発言
  rationale: 文脈上は告発として読むのが自然だが、ヘブライ語の「私の不法／暴虐」という簡潔な所有表現には字義上の幅があるため、脚注で残した。
- issue: יִשְׁפֹּטの法的・祈願的ニュアンス
  choice: ヤハウェによる裁定を願う表現
  alternative: ヤハウェが裁くという断定・予告
  rationale: 語形と発話状況は願望的用法を支持するが、未完了形として断定的にも理解し得る。本文では祈願を採った。
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された固有の神名を明示するため音写した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、サライの強い告発と神への裁定の訴えを荘重に保った。「女奴隷」は社会的身分を明示し、「懐」は原文の比喩と婉曲性を残す表現とした。
