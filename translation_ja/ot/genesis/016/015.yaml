source:
  edition: WLC
  text: וַ/תֵּ֧לֶד הָגָ֛ר לְ/אַבְרָ֖ם בֵּ֑ן וַ/יִּקְרָ֨א אַבְרָ֧ם שֶׁם בְּנ֛/וֹ אֲשֶׁר יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/015.yaml
  text: Hagar bore a son to Abram[a], and Abram called the name of his son, whom Hagar bore, Ishmael.
translation:
  language: ja
  text: ハガルはアブラムに男の子を産んだ。アブラムは、ハガルが産んだ自分の息子をイシュマエルと名づけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: 女性を主語とするカル動詞 ילד の通常の意味「産む」を、現代日本語で簡潔かつ自然に表した。
- source_word: לְאַבְרָם
  choice: アブラムに
  rationale: 前置詞 ל が示す関係・帰属を保ち、ハガルがアブラムの子として男児を産んだことを表す。
- source_word: בֵּן
  choice: 男の子
  rationale: 無冠詞の בֵּן を物語文として自然な「男の子」とした。
- source_word: וַיִּקְרָא ... שֵׁם
  choice: 名づけた
  rationale: ヘブライ語の「名を呼ぶ」という命名の慣用句を、意味を損なわない自然な現代日本語で表した。
- source_word: בְּנוֹ
  choice: 自分の息子
  rationale: 接尾辞がアブラムへの所有・親子関係を示すため、主語との関係が明瞭になるよう「自分の息子」とした。
- source_word: אֲשֶׁר יָלְדָה הָגָר
  choice: ハガルが産んだ
  rationale: 関係節をそのまま保ち、母がハガルであることを原文どおり明示した。
- source_word: יִשְׁמָעֵאל
  choice: イシュマエル
  rationale: 日本語聖書で広く定着している人名表記を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語。原文にあるハガルの反復を保持しつつ、קרא שם は逐語的な「名を呼んだ」ではなく、命名を意味する自然な「名づけた」とした。
