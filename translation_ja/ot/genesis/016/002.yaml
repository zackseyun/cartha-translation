  text: וַ/תֹּ֨אמֶר שָׂרַ֜י אֶל אַבְרָ֗ם הִנֵּה נָ֞א עֲצָרַ֤/נִי יְהוָה֙ מִ/לֶּ֔דֶת בֹּא נָא֙ אֶל שִׁפְחָתִ֔/י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑/נָּה וַ/יִּשְׁמַ֥ע אַבְרָ֖ם לְ/ק֥וֹל שָׂרָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/002.yaml
  text: Then Sarai said to Abram[a], “Look now, Yahweh has kept me from bearing children. Please go in to my female servant; perhaps I will be built up through her.” And Abram listened to the voice of Sarai.
translation:
  language: ja
  text: そこでサライはアブラムに言った。「ご覧ください。ヤハウェは私が子を産むのを妨げておられます。どうか私の女奴隷のもとに入りなさい。もしかすると、彼女によって私は家を築けるかもしれません[a]。」アブラムはサライの言葉を聞き入れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「もしかすると、私は彼女によって（または、彼女から）建てられるかもしれない」。ここでの「建てられる」は、彼女を通して子を得、家族または家系が築かれることを表す比喩と考えられる。
    reason: 原文の建築比喩を明示しつつ、本文の「家を築ける」が文脈上の自然な日本語による表現であることを示すため。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ連続法を、自然な日本語の叙述として表した。
- source_word: הִנֵּה נָא
  choice: ご覧ください
  rationale: 注意を促す הִנֵּה と、語調を和らげる נָא の働きを、現代の丁寧な日本語で表した。
- source_word: עֲצָרַנִי יְהוָה מִלֶּדֶת
  choice: ヤハウェは、私が子を産むことを妨げておられます
  rationale: サライが不妊をヤハウェの働きに帰している原文を弱めず、עצר の阻止・抑制の意味を明確にした。
- source_word: בֹּא נָא אֶל
  choice: どうか……のところに入ってください
  rationale: 性交を指す原文の婉曲表現を、露骨に言い換えずに保持した。נָא は「どうか」で表した。
- source_word: שִׁפְחָתִי
  choice: 私の女奴隷
  rationale: 単なる雇用人ではなく隷属身分の女性を指すため、その社会的地位を婉曲化しなかった。
- source_word: אִבָּנֶה מִמֶּנָּה
  choice: 彼女によって私も築き上げられるかもしれません
  rationale: בנה の「建てる／築く」という比喩と受動形を保持しつつ、מִמֶּנָּה を手段・起点として「彼女によって」とした。慣用的意味は脚注で補った。
- source_word: וַיִּשְׁמַע ... לְקוֹל
  choice: ……の声に聞き従った
  rationale: 単に「従った」とせず、「声を聞く」という原文の表現と服従の含意をともに残した。
theological_decisions:
- issue: サライの不妊におけるヤハウェの関与
  choice: ヤハウェは、私が子を産むことを妨げておられます
  alternative: ヤハウェは私に子を授けてくださいません
  rationale: 原文はサライ自身の言葉として、ヤハウェが出産を阻んだと明示する。これを一般的な摂理の説明へ弱めたり、訳文側で正否を評価したりしない。
- issue: 性的結合を表す婉曲語法
  choice: 私の女奴隷のところに入ってください
  alternative: 私の女奴隷と関係を持ってください
  rationale: 原文の慣用的な婉曲表現とその抑制された語調を保った。
- issue: אִבָּנֶה の家族形成の比喩
  choice: 私も築き上げられるかもしれません
  alternative: 彼女によって子を得られるかもしれません
  rationale: 子を得て家系が築かれるという含意を認めつつ、原文の「築く」という語像と解釈上の幅を本文に残した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある物語文とした。固有の神名は「ヤハウェ」、隷属身分は婉曲化せず「女奴隷」とした。性的行為については原文同様の婉曲表現を保ち、末尾は相互参照上重要な「声に聞き従った」を採用した。
