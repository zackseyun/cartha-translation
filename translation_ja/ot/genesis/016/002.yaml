  to: そこでサライはアブラムに言った。「ご覧ください。ヤハウェは私が子を産むのを妨げておられます。どうか私の女奴隷のもとに入りなさい。もしかすると、彼女によって私は家を築けるかもしれません[a]。」アブラムはサライの言葉を聞き入れた。
