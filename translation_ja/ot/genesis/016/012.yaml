source:
  edition: WLC
  text: וְ/ה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣/וֹ בַ/כֹּ֔ל וְ/יַ֥ד כֹּ֖ל בּ֑/וֹ וְ/עַל פְּנֵ֥י כָל אֶחָ֖י/ו יִשְׁכֹּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/016/012.yaml
  text: And he will be a wild donkey of a man[a]; his hand will be against everyone, and everyone's hand against him[c][b], and he will dwell opposite all his brothers.
translation:
  language: ja
  text: 彼は野ろばのような男となる[a]。彼の手はすべての者に向けられ、すべての者の手は彼に向けられる。彼はすべての兄弟[b]の前に住む[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「野ろばの男」。野ろばを用いた比喩であり、単に「野性的な男」という意味ではない。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟」は、実の兄弟だけでなく、近親者や同族の民を含むことがある。
    reason: lexical_alternative
  - marker: c
    text: または「すべての兄弟に面して」「すべての兄弟と対して」。このヘブライ語表現は、「前に」「面して」「対して」という幅を持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּרֶא אָדָם
  choice: 野ろばのような男
  rationale: פֶּרֶא は単なる「野性的」ではなく野生のろばを指す。日本語で不自然な複合語を避けつつ、原文の動物比喩を明示的に保った。
- source_word: יָדוֹ בַכֹּל וְיַד כֹּל בּוֹ
  choice: 彼はすべての人に手向かい、すべての人も彼に手向かう
  rationale: 「手」の反復を「手向かう」に織り込み、相互の敵対という文脈上の意味とヘブライ語の並行性を自然な日本語で表した。
- source_word: וְעַל־פְּנֵי
  choice: 向かい合って
  rationale: この表現が持ちうる「前で」「面して」「対峙して」の幅を残し、単なる敵対や特定の方角に限定しなかった。
- source_word: כָּל־אֶחָיו
  choice: 自分のすべての兄弟
  rationale: 基本義の「兄弟」を本文に保ち、親族や同族まで含みうる広がりは脚注に示した。
- source_word: יִשְׁכֹּן
  choice: 住む
  rationale: 継続的に住む、居住するという一般的意味を、明瞭な現代日本語で表した。
theological_decisions:
- issue: イシュマエルを表す פֶּרֶא אָדָם の性格づけ
  choice: 動物比喩を「野ろばのような男」として明示する
  alternative: 「野性的な男」
  rationale: 原文の鮮明な比喩を一般的な性格描写へ弱めずに保つ一方、それ自体を一義的な道徳的非難とは断定しない。
- issue: עַל־פְּנֵי の関係的含意
  choice: 「向かい合って」とし、空間的・対峙的な両義性を保つ
  alternative: 「敵対して」または「東に」
  rationale: 文脈には緊張があるが、この前置詞句だけで敵対または方角に限定することを避けた。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「手向かう」によって原文の「手」のイメージと相互的な敵対を簡潔に表現し、「向かい合って」には原文の空間的・関係的な曖昧さを残した。
