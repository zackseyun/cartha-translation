  text: וּ/מִ/פְּרִ֣י הָ/עֵץ֮ אֲשֶׁ֣ר בְּ/תוֹךְ הַ/גָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔/נּוּ וְ/לֹ֥א תִגְּע֖וּ בּ֑/וֹ פֶּן תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/003.yaml
  text: But from the fruit of the tree that is in the middle of the garden[a], God said, ‘You shall not eat from it, and you shall not touch it, lest you die.’
translation:
  language: ja
  text: しかし、園の中央にある木の実については[a]、神は言われました。『あなたがたはそれを食べてはならない。それに触れてもならない。死ぬといけないから。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「園の中にある木の実については」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִפְּרִי
  choice: しかし、…木の実については
  rationale: 接続詞と前置詞を、前節との対比が自然に伝わる日本語にした。מןの関係を示しつつ、引用される禁止命令へ滑らかにつなげる。
- source_word: הָעֵץ
  choice: 木
  rationale: 定冠詞を文脈上の特定性によって表し、自然な日本語では「その」を重ねなかった。
- source_word: אֲשֶׁר בְּתוֹךְ הַגָּן
  choice: 園の中央にある
  rationale: בְּתוֹךְの空間的意味を明瞭で現代的な表現にした。「園の中にある」も可能なため脚注で示した。
- source_word: אָמַר אֱלֹהִים
  choice: 神は言われました
  rationale: 完了形が先になされた発言を報告していることを表す。神への敬意を保ちつつ、現代の標準的な語り口にした。
- source_word: לֹא תֹאכְלוּ מִמֶּנּוּ
  choice: あなたがたはそれを食べてはならない
  rationale: 二人称複数と禁止の力を明示した。日本語では「それから食べる」より「それを食べる」が自然である。
- source_word: וְלֹא תִגְּעוּ בּוֹ
  choice: それに触れてもならない
  rationale: 追加された禁止をそのまま訳し、創世記2章17節との違いを調和させなかった。前置詞בの関係を「それに」で表した。
- source_word: פֶּן תְּמֻתוּן
  choice: 死ぬといけないから
  rationale: פןが表す回避すべき結果・懸念を、断定的な「必ず死ぬ」へ狭めず、理解しやすい現代日本語で表した。
theological_decisions:
- issue: 女の報告には、創世記2章17節の命令にはない「触れてもならない」が含まれる。
  choice: 女の発言を本文どおり訳し、「それに触れてもならない」を保持した。
  alternative: 創世記2章17節に合わせて、この句を省くか弱める。
  rationale: 語りの中にある発言の相違と神学的緊張を保ち、翻訳によって調和させないため。
- issue: פֶּן תְּמֻתוּןが示す結果の様態
  choice: 「死ぬといけないから」とし、懸念・回避の含みを残した。
  alternative: 「そうすれば必ず死ぬ」または「死ぬことになる」。
  rationale: פןの予防的・否定的結果のニュアンスを、確定的な予告として過度に断定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話として読める自然さと聖書本文としての品位を両立させた。命令は「食べてはならない」「触れてもならない」として強さを保ち、古風すぎる表現は避けた。
