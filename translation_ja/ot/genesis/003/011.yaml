source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר מִ֚י הִגִּ֣יד לְ/ךָ֔ כִּ֥י עֵירֹ֖ם אָ֑תָּה הֲ/מִן הָ/עֵ֗ץ אֲשֶׁ֧ר צִוִּיתִ֛י/ךָ לְ/בִלְתִּ֥י אֲכָל מִמֶּ֖/נּוּ אָכָֽלְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/011.yaml
  text: And he said[b][a], “Who told you that you were naked? Have you eaten from the tree from which I commanded you not to eat?”
translation:
  language: ja
  text: 彼は言った。「あなたが裸だと、だれがあなたに告げたのか。私があなたに、それから食べてはならないと命じたその木から、食べたのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 彼は言った
  rationale: 物語を進めるワウ継続法を自然な日本語の過去形で表した。節内に主語名は明記されていないため、文脈上の男性単数主語を「彼」とした。
- source_word: מִי הִגִּיד לְךָ
  choice: だれがあなたに告げたのか
  rationale: מִי は疑問代名詞「だれ」、נגד のヒフィル形はここでは「告げる、知らせる」の意味。「告げた」は明瞭で品位ある現代日本語である。
- source_word: כִּי עֵירֹם אָתָּה
  choice: あなたが裸だと
  rationale: כִּי を発言内容を導く「と」とし、עֵירֹם を文脈どおり「裸」とした。ヘブライ語は名詞文であり、日本語では時制を過度に限定しない形にした。
- source_word: הֲמִן הָעֵץ
  choice: あの木から……のか
  rationale: 疑問辞 הֲ を終助詞「のか」で表し、מן の起点・源を「から」で保持した。定冠詞付きの「木」は既出の特定の木を指すため「あの木」とした。
- source_word: אֲשֶׁר צִוִּיתִיךָ
  choice: 私が命じた
  rationale: 関係節を日本語の連体修飾として自然に配置し、צוה の命令の意味をそのまま保った。
- source_word: לְבִלְתִּי אֲכָל
  choice: 食べてはならないと
  rationale: לְבִלְתִּי と不定詞による禁止を、明確な禁止表現「てはならない」で訳した。
- source_word: אָכָלְתָּ
  choice: 食べたのか
  rationale: 完了形二人称男性単数を、完了した行為を問う自然な日本語の過去形で表した。日本語では英語の単純過去と現在完了の対立を明示する必要がない。
theological_decisions:
- issue: 男性単数の発話者をどう示すか
  choice: 彼は言った
  alternative: 神である主は言った
  rationale: この節のヘブライ語本文は三人称男性単数の動詞だけを置き、発話者の名を繰り返していない。前後の文脈では神が発話者だが、この節自体にない神名を補わず、原文の照応関係を保った。
- issue: 問いを告発の断定へ強めるか
  choice: 食べたのか
  alternative: 食べたのだな
  rationale: 疑問辞 הֲ が明示されているため、神の認識や意図を推測して断定調にせず、原文どおり問いとして訳した。
translation_notes:
  register: 明瞭で現代的だが、会話をくだけさせすぎない文体とした。「だれ」「裸」「食べてはならない」は一般読者に分かりやすく、原文の直接的な問いの緊張も保つ。
