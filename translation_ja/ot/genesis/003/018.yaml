  text: וְ/ק֥וֹץ וְ/דַרְדַּ֖ר תַּצְמִ֣יחַֽ לָ֑/ךְ וְ/אָכַלְתָּ֖ אֶת עֵ֥שֶׂב הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/018.yaml
  text: It will produce thorns and thistles for you[c][b][a], and you will eat the plants of the field.
translation:
  language: ja
  text: 土地は、あなたのために、いばらとあざみを生えさせる[a]。そして、あなたは野の植物[b]を食べる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「芽生えさせる」。原文の動詞は使役形で、主語は前節の「土地」を受けている。
    reason: lexical_alternative
  - marker: b
    text: 「野の草」または「野の草木」とも訳せる。ここでの「植物」は、食用となる草本などを広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקֹוץ
  choice: いばら
  rationale: קוֹץはとげのある植物を集合的に指す。対をなすדַרְדַּרとの区別を保ちつつ、現代日本語で自然な「いばら」とした。
- source_word: וְדַרְדַּר
  choice: あざみ
  rationale: דַרְדַּרはקוֹץとは別の、とげのある雑草を指す。「あざみ」は伝統的な訳語であり、特定の植物種を厳密に同定するものではない。
- source_word: תַּצְמִיחַ לָךְ
  choice: あなたのために……生えさせる
  rationale: צמחのヒフィル形が持つ使役の意味を「生えさせる」で示し、לָךְも「あなたのために」と明示した。文脈上、それは利益ではなく、人に降りかかる労苦を表す。
- source_word: וְאָכַלְתָּ
  choice: そして、あなたは……食べる
  rationale: 前節から続く結果の叙述として、現代日本語で自然な非過去形を用いた。
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: 野の草
  rationale: עֵשֶׂבは食用となる草本や植物一般を指し得る。「野の草」は簡潔で自然であり、הַשָּׂדֶהとの連語も保つ。
theological_decisions:
- issue: 女性単数動詞תַּצְמִיחַの主語
  choice: 前節の「土地」を主語として明示する
  alternative: 主語を省いて「いばらとあざみが生える」とする
  rationale: 動詞の女性単数形は、創世記3:17の女性名詞הָאֲדָמָה（土地）を自然に受ける。使役の意味も保つため、「土地は……生えさせる」とした。
translation_notes:
  register: 明瞭な現代標準語を用い、文語的な「なんじ」「産出する」などは避けた。「そして」で結果の連続を示しつつ、簡潔で格調を失わない文とした。
