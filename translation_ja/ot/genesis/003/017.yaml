id: GEN.3.17
reference: Genesis 3:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְ/אָדָ֣ם אָמַ֗ר כִּֽי שָׁמַעְתָּ֮ לְ/ק֣וֹל אִשְׁתֶּ/ךָ֒ וַ/תֹּ֨אכַל֙ מִן הָ/עֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֨י/ךָ֙ לֵ/אמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ אֲרוּרָ֤ה הָֽ/אֲדָמָה֙ בַּֽ/עֲבוּרֶ֔/ךָ בְּ/עִצָּבוֹן֙ תֹּֽאכֲלֶ֔/נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/017.yaml
  text: And to Adam he said[a], “Because you listened to the voice of your wife and ate from the tree about which I commanded you, saying, ‘You shall not eat from it,’ the ground is cursed because of you[f][e][d][c][b]; in painful toil you shall eat from it all the days of your life.”
translation:
  language: ja
  text: 'また、アダムに言われた[a]。


    「あなたが妻の声に聞き従い、わたしが『それから食べてはならない』と命じた木から食べたので、地はあなたのゆえに呪われている。あなたは一生、苦労して地から食を得る。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アダム」は「その人」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: לְאָדָם
  choice: アダムに
  rationale: 文脈ではエデン物語の特定の男性を指すため、固有名として訳した。ただし「人に」も可能なので脚注に示した。
- source_word: שָׁמַעְתָּ לְקוֹל אִשְׁתֶּךָ
  choice: 妻の声に聞き従い
  rationale: 「声に聞く」というヘブライ語の表現を反映しつつ、単に音声を聞いたのではなく、その言葉を受け入れた含意を自然な日本語で表した。「妻に従い」ほど意味を限定しない。
- source_word: וַתֹּאכַל מִן הָעֵץ
  choice: 木から食べた
  rationale: 前置詞 מִן の起点・出所を保ち、実際には木の実を食べたという文脈を自然に伝える。
- source_word: אֲשֶׁר צִוִּיתִיךָ לֵאמֹר
  choice: わたしが『……』と命じておいた木
  rationale: לֵאמֹר が命令内容を導く構造を日本語の直接引用で自然に表した。「命じておいた」は先行する命令を指す。
- source_word: לֹא תֹאכַל מִמֶּנּוּ
  choice: それから食べてはならない
  rationale: 否定命令の力を明確にし、מִמֶּנּוּ の「それから」を保持した。
- source_word: אֲרוּרָה הָאֲדָמָה
  choice: 地は……呪われる
  rationale: 農耕の対象となる土壌を含む הָאֲדָמָה を、荘重さと語の広がりを保つ「地」とした。ヘブライ語の述語形容詞は日本語で自然な受け身表現にした。
- source_word: בַּעֲבוּרֶךָ
  choice: あなたのゆえに
  rationale: 原因・責任を示し、利益目的とも読まれ得る「あなたのために」を避けた。
- source_word: בְּעִצָּבוֹן
  choice: 苦労して
  rationale: この語は苦痛、悲しみ、労苦の意味領域を持つ。食物を得る農耕の文脈では「苦労して」が自然だが、意味幅を脚注で補った。
- source_word: תֹּאכֲלֶנָּה
  choice: 地から食べ物を得る
  rationale: 女性単数接尾辞は「地」を受けるが、土そのものを食べる意味ではないため、地の産物によって食を得る趣旨を明示した。
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: 一生
  rationale: 「あなたの命の日々のすべて」という慣用句を、明快で格調を損なわない現代日本語にした。
theological_decisions:
- issue: אָדָם を固有名とするか普通名詞とするか
  choice: アダム
  alternative: 人
  rationale: ここでは物語中の特定の個人への呼びかけとして読むのが自然である。一方、定冠詞を欠く形でも固有名か普通名詞かには翻訳上の余地があるため、代案を脚注に残した。
- issue: 土地への呪いと人の責任の関係
  choice: 地はあなたのゆえに呪われる
  alternative: あなたのために地は呪われる
  rationale: בַּעֲבוּרֶךָ は因果・関与を示すものとして訳し、呪いがアダムの利益を目的とするとの解釈を持ち込まないようにした。
- issue: בְּעִצָּבוֹן の苦痛と労働の含意
  choice: 苦労して
  alternative: 苦しみのうちに／苦痛をもって
  rationale: 農耕と食物の文脈に即して労苦を前面に出したが、前節の出産の苦痛との語彙的連関を消さないよう、脚注で意味幅を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣告としての荘重さを保った。「妻の声に聞き従う」「あなたのゆえに」は原文の語感を残すやや格調ある表現である。本文中の脚注標識は該当箇所に付し、語義上重要な曖昧さのみ注記した。
