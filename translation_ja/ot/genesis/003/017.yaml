revisions:
- from: 'また、アダムに言われた[a]。

    「あなたが妻の声に聞き従い、わたしが『それから食べてはならない』と命じておいた木から食べたので、地はあなたのゆえに呪われる。あなたは一生、苦労して地から食べ物を得る。」'
  to: 'また、アダムに言われた[a]。


    「あなたが妻の声に聞き従い、わたしが『それから食べてはならない』と命じた木から食べたので、地はあなたのゆえに呪われている。あなたは一生、苦労して地から食を得る。」'
  rationale: 原文の時制・相の含意を保つため、「呪われる」を状態を表す「呪われている」に改めた。末尾は原文の「食べる」という語義を保ちながら、日本語として自然な「地から食を得る」とした。脚注はאָדָםの普通名詞的な読みを、定冠詞の含意を損なわない形で示す。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:38:34Z'
review_pass:
  verdict: revise
  source_fidelity: 主要な内容は原文に忠実である。しかし、אֲרוּרָה（「呪われている／呪われた」）は宣告の結果としての状態を述べる語であり、「呪われる」という未来的出来事の表現より「呪われている」が適切である。また、末尾の「食べ物を得る」は意味を明示する有益な補いではあるが、原文の「地から食べる」をやや「獲得」に寄せるため、「地から食を得る」として食べることとの結び付きを保つ。
  naturalness: 「妻の声に聞き従い」は現代標準日本語として理解可能で、ヘブライ語の慣用表現の含意も保つ。「わたしが『……』と命じた木」は、先行する命令を表す簡潔で自然な構文である。
  terminology: 「アダム」「妻」「地」「呪われている」は文脈と神の宣告の文体に適する。「地」は農耕対象としてのאֲדָמָהを無理なく表す。脚注の代案は、定冠詞を伴うאָדָםの可能性をより正確に示すため「その人」とする。
  issues:
  - severity: medium
    issue: 「地はあなたのゆえに呪われる」
    rationale: 原文の受動分詞אֲרוּרָהは、地が呪いの下にある状態を表す。「呪われる」は将来の受動的出来事として響くため、「呪われている」に改める。
  - severity: low
    issue: 「地から食べ物を得る」
    rationale: 文脈上は正しい解釈だが、תֹּאכֲלֶנָּהは直訳すれば「それ（地）を食べる」、すなわち地から食べるである。「食を得る」は補足を抑えつつ自然な日本語にする。
  - severity: low
    issue: 脚注の「人に」という代案
    rationale: 原文のלָאָדָםは定冠詞を伴うため、普通名詞として訳す場合は単なる「人」より「その人」が対応しやすい。
