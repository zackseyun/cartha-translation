id: GEN.3.15
reference: Genesis 3:15
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵיבָ֣ה אָשִׁ֗ית בֵּֽינְ/ךָ֙ וּ/בֵ֣ין הָֽ/אִשָּׁ֔ה וּ/בֵ֥ין זַרְעֲ/ךָ֖ וּ/בֵ֣ין זַרְעָ֑/הּ ה֚וּא יְשׁוּפְ/ךָ֣ רֹ֔אשׁ וְ/אַתָּ֖ה תְּשׁוּפֶ֥/נּוּ עָקֵֽב׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/015.yaml
  text: And I will put enmity[a] between you and the woman, and between your seed[b] and her seed; he will crush your head[c][d], and you will bruise his heel.
translation:
  language: ja
  text: わたしは、おまえと女との間に、また、おまえの子孫[b]と女の子孫との間に、敵意[a]を置く。彼[c]はおまえの頭を打ち砕き[d]、おまえは彼のかかとを傷つける。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「敵対」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は両箇所とも字義的には「種」。集合的に子孫を指すことも、その子孫を代表する一個人を指すこともできる。
    reason: lexical_alternative
  - marker: c
    text: 「それ」とも訳せる。ヘブライ語では、集合名詞「種」を男性単数代名詞が受けている。
    reason: alternative_reading
  - marker: d
    text: 原文では、頭への行為とかかとへの行為に同じ動詞が用いられている。「打つ」または「傷つける」とも訳せる。本文の「打ち砕く」は、頭への一撃がより重大であることを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיבָה
  choice: 敵意
  rationale: 一時的な反感ではなく、持続する敵対を表す語。「敵意」は現代日本語として明瞭で、原語の強さも保つ。
- source_word: אָשִׁית
  choice: 置く
  rationale: שׂים の基本義「置く、据える」を保ち、神がその敵意を両者の間に定めるという表現を簡潔に伝える。
- source_word: בֵּינְךָ ... וּבֵין הָאִשָּׁה
  choice: おまえと女との間に
  rationale: 反復される関係表現を保ち、蛇への直接の呼びかけであることを示す。
- source_word: זַרְעֲךָ ... זַרְעָהּ
  choice: おまえの子孫……女の子孫
  rationale: זֶרַע は字義的には「種」で、集合的な子孫にも代表となる一個人にも用い得る。本文では自然な現代日本語の「子孫」を用い、原語の比喩と幅は注で示す。
- source_word: הוּא
  choice: 彼
  rationale: 原語は、集合名詞 זֶרַע を受ける男性単数代名詞。日本語でも単数の「彼」とし、代表となる一個人の可能性を残す一方、集合的理解も注で明示する。
- source_word: יְשׁוּפְךָ ... תְּשׁוּפֶנּוּ
  choice: 打ち砕き……傷つける
  rationale: ヘブライ語では同じ稀な動詞が反復されるが、対象が頭とかかとで異なるため、傷の重大さの非対称性を自然な日本語で表した。語の反復と別訳は注で保つ。
- source_word: רֹאשׁ
  choice: 頭
  rationale: 身体部位を表す通常の字義どおりの訳。
- source_word: עָקֵב
  choice: かかと
  rationale: 身体部位を表す通常の字義どおりの訳。
theological_decisions:
- issue: 女の「子孫」に集合的意味と代表的一個人の意味の双方を残すか
  choice: זֶרַע を両箇所とも「子孫」とし、続く הוּא を「彼」とした。
  alternative: 「種」と直訳する、または集合的に「彼ら」とする。
  rationale: 原文は蛇側と女側に同じ集合名詞を用い、その後に男性単数代名詞を置く。「子孫」と「彼」の組み合わせによって両方の可能性を残し、本文だけで特定の教理的解釈に限定しない。
- issue: 頭に対する שׁוּף の強さをどう表すか
  choice: 頭には「打ち砕く」、かかとには「傷つける」とした。
  alternative: 両方を「打つ」または「傷つける」と訳す。
  rationale: 原文では同じ動詞だが、頭とかかとという対象の違いが結果の重大さの差を示唆する。本文ではその非対称性を伝え、同一動詞であることは注記する。
translation_notes:
  register: 明瞭な現代標準日本語。神の発話として簡潔で荘重な調子を保ち、蛇への二人称は「おまえ」とした。過度に古風な「汝」「裔」は避けた。
