id: GEN.3.6
reference: Genesis 3:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָֽ/אִשָּׁ֡ה כִּ֣י טוֹב֩ הָ/עֵ֨ץ לְ/מַאֲכָ֜ל וְ/כִ֧י תַֽאֲוָה ה֣וּא לָ/עֵינַ֗יִם וְ/נֶחְמָ֤ד הָ/עֵץ֙ לְ/הַשְׂכִּ֔יל וַ/תִּקַּ֥ח מִ/פִּרְי֖/וֹ וַ/תֹּאכַ֑ל וַ/תִּתֵּ֧ן גַּם לְ/אִישָׁ֛/הּ עִמָּ֖/הּ וַ/יֹּאכַֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/006.yaml
  text: So the woman saw that the tree was good for food[a], and that it was a delight to the eyes, and that the tree was desirable to make one wise. So she took from its fruit and ate, and she also gave some to her husband, who was with her[b], and he ate.
translation:
  language: ja
  text: 女は、その木が食べるのに良く、目に魅力的で[a]、賢くするのに望ましい[b]のを見た。それで、その実を取って食べ、一緒にいた夫にも与えた。夫も食べた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すれば「目にとって望まれるもの」の意。木が視覚的に魅力のあるものだったことを表す。「目に好ましく」とも訳せる。
    reason: תַאֲוָה לָעֵינַיִם の慣用的な意味と、視覚的魅力という含意を自然かつ正確に示すため。
  - marker: b
    text: 「知恵を得るために望ましい」とも訳せる。ヘブライ語は、人を賢くすること、また知恵を得ることを表し得る。
    reason: לְהַשְׂכִּיל の使役形と、文脈上可能な理解の幅を保持するため。
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 見た
  rationale: 基本的な知覚を表す物語動詞として、解釈を加えず直接的に訳した。
- source_word: טוֹב הָעֵץ לְמַאֲכָל
  choice: その木が食べるのに良く
  rationale: 木が食物として適しているという評価を、自然な現代日本語で表した。
- source_word: תַאֲוָה הוּא לָעֵינַיִם
  choice: 目に慕わしく
  rationale: 視覚的な魅力と、目が引きつけられる欲求の含みを保ちつつ、ここで露骨な道徳的非難を持ち込まない表現とした。
- source_word: וְנֶחְמָד הָעֵץ
  choice: その木が……望ましい
  rationale: 魅力的で欲しくなる対象という意味を保ち、「むさぼる」などの強い否定的評価は加えなかった。
- source_word: לְהַשְׂכִּיל
  choice: 賢くなるために
  rationale: 知恵や洞察を得るという目的・結果を自然に表す。使役的に「人を賢くする」と取る余地は脚注に残した。
- source_word: מִפִּרְיוֹ
  choice: その実を取って
  rationale: 日本語では「その実を取る」で、木の実の一部を取ったことが自然に理解される。
- source_word: וַתִּתֵּן גַּם לְאִישָׁהּ
  choice: 夫にも与えた
  rationale: גַּם の追加の意味を助詞「も」で示し、אִישָׁהּ は文脈上自然な「夫」とした。
- source_word: עִמָּהּ
  choice: 一緒にいた
  rationale: 夫が彼女と共にいたという本文の情報を明示しながら、その場にいた期間などは限定しない。
theological_decisions:
- issue: 女が木を見た際の評価に道徳的な色づけを加えるか
  choice: 「良く」「慕わしく」「望ましい」という比較的中立的な語で訳す
  alternative: 「情欲をそそり」「むさぼりたくなる」など、罪深さを明示する語で訳す
  rationale: ヘブライ語は女の認識を肯定的な評価語で描いてから行為を述べるため、翻訳段階で本文以上の道徳的断罪を先取りしない。
- issue: לְהַשְׂכִּיל の主体と作用
  choice: 「賢くなるために」と訳し、知恵を得る読みを本文に置く
  alternative: 「人を賢くするために」と使役的に訳す
  rationale: ヘブライ語の使役形には知恵を得ることと知恵を与えることの両面を表し得る余地があるため、別の可能性を脚注に示して緊張を保つ。
- issue: 夫の居合わせ
  choice: 「一緒にいた夫」と明示する
  alternative: 「彼女の夫にも」とだけ訳す
  rationale: עִמָּהּ は夫が彼女と共にいたことを明記しており、これを省略しない。ただし、それ以上の関与や責任のあり方は訳文に加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「女」は物語上の呼称を維持し、まだ固有名「エバ」は用いない。「目に慕わしく」はやや文語的だが現代の読者にも理解でき、視覚的魅力と欲求の含みを簡潔に伝える。
