  text: וַ/יְגָ֖רֶשׁ אֶת הָֽ/אָדָ֑ם וַ/יַּשְׁכֵּן֩ מִ/קֶּ֨דֶם לְ/גַן עֵ֜דֶן אֶת הַ/כְּרֻבִ֗ים וְ/אֵ֨ת לַ֤הַט הַ/חֶ֨רֶב֙ הַ/מִּתְהַפֶּ֔כֶת לִ/שְׁמֹ֕ר אֶת דֶּ֖רֶךְ עֵ֥ץ הַֽ/חַיִּֽים־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/024.yaml
  text: So he drove out the man[a], and to the east of the garden of Eden he stationed the cherubim and the flame of the sword that turns every way[b], to guard the way to the tree of life.
translation:
  language: ja
  text: こうして神はその人を追放し、エデンの園の東側に[a]ケルビムと、向きを変える剣の炎[b]を置き、命の木への道を守らせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エデンの園の東方に」とも訳せる。ヘブライ語の表現は、園の東側または東方を指す。
    reason: lexical_alternative
  - marker: b
    text: 伝統的には「四方に回る炎の剣」と訳される。ヘブライ語は、より字義的には「向きを変える剣の炎」と表現している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגָרֶשׁ
  choice: 追放し
  rationale: גרשׁの、力をもって外へ出すという意味を、自然で格調ある現代日本語で表す。
- source_word: הָאָדָם
  choice: その人
  rationale: ここでは人類一般ではなく、直前まで語られてきた特定の人を指す。日本語では文脈上「その人」が自然であり、原語の定冠詞による既知性も示せる。
- source_word: וַיַּשְׁכֵּן
  choice: 配置して
  rationale: שׁכןのヒフィル形は「住まわせる、置く」を意味するが、ここでは道を守る役割を担わせる場面なので、「配置する」が文脈に適する。
- source_word: מִקֶּדֶם לְגַן עֵדֶן
  choice: エデンの園の東側に
  rationale: 空間的用法のקדםを園の東側または東方として理解し、簡潔で自然な日本語にした。位置関係にわずかな幅があるため注を付す。
- source_word: הַכְּרֻבִים
  choice: ケルビム
  rationale: 聖書固有の天的存在を表す語として、原語の複数形に基づく定着した音写を用いる。
- source_word: לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת
  choice: 四方に向きを変える剣の炎
  rationale: 「剣の炎」という構文を保ちつつ、再帰・反復的な動きを示す分詞を「四方に向きを変える」と表した。伝統的な「炎の剣」への単純化は避けた。
- source_word: לִשְׁמֹר
  choice: 守らせた
  rationale: שׁמרの警護・接近阻止の意味を示し、配置の目的を自然な日本語の使役表現で結んだ。
- source_word: דֶּרֶךְ עֵץ הַחַיִּים
  choice: 命の木への道
  rationale: 形式上は「命の木の道」だが、ここでは木へ至る経路を意味するため、日本語で関係が明確になるよう「への」とした。
theological_decisions:
- issue: אָדָםを個人として訳すか、人類一般として訳すか
  choice: その人
  alternative: 人間／人類
  rationale: 物語上、園から追放される特定の一人を指している。人類全体という神学的含意を本文に先取りして盛り込まない。
- issue: 動作主を明示するか
  choice: 神は
  alternative: 主語を省略して「その人を追放し」
  rationale: ヘブライ語では三人称単数の動作主が前文脈から神であることが明らかである。日本語の独立した節として読みやすくするため明示したが、新たな解釈は加えていない。
- issue: 剣と炎、および回転するものの関係
  choice: 四方に向きを変える剣の炎
  alternative: 四方に回る炎の剣
  rationale: 原文の「剣の炎」という連語と、女性形分詞が直近の女性名詞「剣」と結びつき得る構造を尊重した。日本語では修飾関係を完全には固定せず、注で字義を補う。
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語文としての荘重さを保った。「ケルビム」は固有の聖書用語として音写し、「命の木」など定着した表現を採用した。
