id: GEN.3.14
reference: Genesis 3:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים אֶֽל הַ/נָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִ/כָּל הַ/בְּהֵמָ֔ה וּ/מִ/כֹּ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה עַל גְּחֹנְ/ךָ֣ תֵלֵ֔ךְ וְ/עָפָ֥ר תֹּאכַ֖ל כָּל יְמֵ֥י חַיֶּֽי/ךָ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/014.yaml
  text: Then Yahweh God said to the serpent[a], “Because you have done this, cursed are you above all livestock and above every beast of the field. On your belly you shall go[b], and dust you shall eat all the days of your life.”
translation:
  language: ja
  text: 'そこで、主なる神は蛇[a]に言われた。


    「おまえはこのことをしたので、


    あらゆる家畜、あらゆる野の獣にもまして、


    呪われている。


    おまえは腹ばいで進み、


    生きているかぎり、ちりを食べる[b]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「へび」とも表記できる。
    reason: lexical_alternative
  - marker: b
    text: 「ちりを食べる」は、文字どおりの食物についてだけでなく、屈辱や敗北を表すイメージとしても用いられ得る。
    reason: cultural_note
lexical_decisions:
- source_word: יְהֹוָה אֱלֹהִים
  choice: 主なる神
  rationale: 神名と אֱלֹהִים の組み合わせを保ちつつ、日本語聖書として自然で荘重な表現とした。
- source_word: הַנָּחָשׁ
  choice: 蛇
  rationale: 文脈上の生き物を過度な神学的解釈を加えずに表す、現代日本語の標準的な語。
- source_word: כִּי עָשִׂיתָ זֹּאת
  choice: おまえはこのことをしたので
  rationale: 後続する宣告の理由を示す因果関係を明確にした。
- source_word: אָרוּר אַתָּה
  choice: 呪われる
  rationale: 司法的な宣告の響きを保ちながら、現代日本語として自然にした。ヘブライ語の強調は改行によっても示した。
- source_word: מִכָּל הַבְּהֵמָה וּמִכֹּל חַיַּת הַשָּׂדֶה
  choice: あらゆる家畜、あらゆる野の獣にもまして
  rationale: 比較を表す מִן を「にもまして」とし、家畜と野生動物の区別を保持した。
- source_word: עַל גְּחֹנְךָ תֵלֵךְ
  choice: おまえは腹で進み
  rationale: תֵלֵךְ は単に「行く、進む」であり、「這う」と明示しない原文の表現を保った。
- source_word: וְעָפָר תֹּאכַל
  choice: ちりを食べる
  rationale: 具体的描写と屈辱・敗北の比喩的含意の双方を残し、本文では一方に限定しなかった。
- source_word: כָּל יְמֵי חַיֶּיךָ
  choice: 生きているかぎり
  rationale: 「あなたの命の日々のすべて」を、意味と継続性を保つ自然な現代日本語で表した。
theological_decisions:
- issue: 蛇の正体と呪いの性質
  choice: 本文では物語上の「蛇」への宣告として訳し、具体的な身体描写を保持する。
  alternative: 蛇をサタンと明示し、後代の神学的同定を本文に織り込む。
  rationale: この節自体は蛇に語りかけているため、後の聖書本文との関連を否定も断定もせず、直接の指示対象と神学的緊張を保った。
- issue: 「ちりを食べる」の意味
  choice: 直訳的な像を本文に残し、比喩的可能性を脚注で示す。
  alternative: 「屈辱を受ける」「敗北する」と解釈して本文に置く。
  rationale: 原文は具体的表現を用いており、文字どおりの描写と屈辱・敗北の慣用的イメージが重なり得るため、本文で意味を一つに限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣告にふさわしい荘重さを改行と簡潔な句で保った。蛇への呼びかけは、上下関係と裁きの文脈に合う「おまえ」とした。
