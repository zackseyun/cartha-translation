id: GEN.3.9
reference: Genesis 3:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרָ֛א יְהוָ֥ה אֱלֹהִ֖ים אֶל הָֽ/אָדָ֑ם וַ/יֹּ֥אמֶר ל֖/וֹ אַיֶּֽ/כָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/009.yaml
  text: Then Yahweh God called to the man and said to him[a], “Where are you?”
translation:
  language: ja
  text: そして、ヤハウェ[a]神はその人に呼びかけて言われた。「あなたはどこにいるのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主なる神」。
    reason: 神名 יְהוָה の伝統的な代読に基づく訳語を示すため。
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼びかけて
  rationale: קרא のQal・物語継続形。ここでは相手に声をかける意味であり、現代日本語では「呼びかける」が自然である。「召し出す」のような権威的ニュアンスは加えない。
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 固有の神名 יְהוָה を「ヤハウェ」と音写し、אֱלֹהִים を「神」とした。複合的な呼称を簡潔に保つ。
- source_word: הָאָדָם
  choice: その人
  rationale: 定冠詞付きの אָדָם は、この文脈では園にいる特定の人を指す。日本語では既出の人物を示す「その人」が自然で、固有名「アダム」とはしない。
- source_word: וַיֹּאמֶר לוֹ
  choice: 言われた
  rationale: 直訳的には「彼に言った」だが、「その人に呼びかけて」によって相手が明示されているため、日本語では重複を避けた。神を主語とする文脈にふさわしい敬語表現を用いた。
- source_word: אַיֶּכָּה
  choice: あなたはどこにいるのか
  rationale: 場所を問う二人称男性単数形。問いの意図を説明的に補わず、直接の問いとして訳した。
- source_word: וַ
  choice: そこで
  rationale: 物語の連続と、直前の出来事を受けた展開を自然な日本語で示す。「そして」も可能だが、この箇所では「そこで」が文脈上なめらかである。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名が記されていることを本文で明示する。伝統的な代読に基づく「主」も可能なので脚注に示す。
- issue: הָאָדָם の指示対象
  choice: その人
  alternative: 人間／アダム
  rationale: ここでは人類一般ではなく特定の男性を指す一方、ヘブライ語本文は固有名として明示していないため、「人間」と一般化せず、「アダム」と固有名詞化もしない。
- issue: 神の問いの含意
  choice: 場所を尋ねる問いをそのまま保持
  alternative: 所在を知りつつ責任を問う呼びかけと解釈して意訳する
  rationale: 神がなぜ問うたかは本文に明記されていない。神学的含意を訳文に織り込まず、原文の問いを保つ。
translation_notes:
  register: 明瞭で現代的かつ荘重な物語文。「言われた」によって神への敬意を示しつつ、過度に古風な言い回しは避けた。
