id: GEN.3.2
reference: Genesis 3:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר הָֽ/אִשָּׁ֖ה אֶל הַ/נָּחָ֑שׁ מִ/פְּרִ֥י עֵֽץ הַ/גָּ֖ן נֹאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/002.yaml
  text: And the woman said to the serpent[a], “We may eat from the fruit of the trees of the garden,”
translation:
  language: ja
  text: 女は蛇に言った。「園の木々の実は食べてもよいのです。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「園の木の実から、私たちは食べてもよい」。ここで「木」は集合的な意味と理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 言った
  rationale: ワウ継続法による物語の進行は、日本語では文脈上自然な「言った」で表した。機械的な「そして」は加えず、滑らかな叙述とした。
- source_word: הָאִשָּׁה
  choice: 女
  rationale: ここでは婚姻上の役割よりも、物語中の女性としての人物を指すため、「妻」ではなく「女」とした。
- source_word: הַנָּחָשׁ
  choice: 蛇
  rationale: נָחָשׁ の通常の指示対象を、現代日本語で自然かつ格調を損なわない「蛇」とした。
- source_word: מִפְּרִי
  choice: 実は
  rationale: מן は食べる対象の由来・範囲を示すが、日本語では「実から食べる」より、目的語を主題化した「実は食べる」が自然である。
- source_word: עֵץ הַגָּן
  choice: 園の木々
  rationale: עֵץ は形態上単数だが、文脈では園内の木を集合的・分配的に指すため、誤解を避けて複数の「木々」とした。
- source_word: נֹאכֵל
  choice: 食べてもよいのです
  rationale: 未完了形は創世記2:16の許可を受けた発言として理解し、単なる能力ではなく許可を表す「食べてもよい」とした。「のです」は蛇の問いへの応答として自然な説明調を示す。
theological_decisions:
- issue: 食べることを許された木々の範囲
  choice: 「園の木々の実」とし、一般的な許可を表す
  alternative: 「園の木の実」と単数形を保つ
  rationale: ヘブライ語 עֵץ は単数形だが、この構文と直前の神の許可を踏まえると集合的な意味が自然である。日本語の複数表現により、ただ一本の木だけを指すとの誤解を避けつつ、次節の例外提示につなげた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語としての簡潔さと聖書本文にふさわしい落ち着いた調子を保った。脚注標識は該当文末に置いた。
