id: GEN.3.7
reference: Genesis 3:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תִּפָּקַ֨חְנָה֙ עֵינֵ֣י שְׁנֵי/הֶ֔ם וַ/יֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽ/יִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַ/יַּעֲשׂ֥וּ לָ/הֶ֖ם חֲגֹרֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/007.yaml
  text: Then the eyes of both of them were opened[a], and they knew that they were naked[b]. So they sewed fig leaves together and made coverings for themselves.
translation:
  language: ja
  text: すると、二人の目が開かれ、自分たちが裸であることを知った。そこで二人はいちじくの葉を縫い合わせ、自分たちのために腰を覆うもの[a]を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「腰布」「前掛け」。原語は腰に巻き付けるものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפָּקַחְנָה
  choice: 開かれ
  rationale: ニファル形の受動的・自発的なニュアンスと「目が開く」というヘブライ語の表現を保ち、新たな認識の性質を説明しすぎない。
- source_word: עֵינֵי שְׁנֵיהֶם
  choice: 二人の目
  rationale: 二人双方に起きたことを簡潔で自然な現代日本語で表す。
- source_word: וַיֵּדְעוּ
  choice: 知った
  rationale: ידעの基本義を保ち、「悟った」「気づいた」などによって心理状態を過度に解釈しない。
- source_word: עֵירֻמִּם
  choice: 裸である
  rationale: 語の直接的な意味を表し、創世記2章25節との物語上のつながりも保つ。
- source_word: וַיִּתְפְּרוּ
  choice: 縫い合わせ
  rationale: 葉をつなぎ合わせる動作を、自然かつ具体的な日本語で表す。
- source_word: עֲלֵה תְאֵנָה
  choice: いちじくの葉
  rationale: 連語の意味を日本語として自然に訳す。
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: 自分たちのために…作った
  rationale: לָהֶםの自己のためという意味を明示し、彼ら自身による備えであることを保つ。
- source_word: חֲגֹרֹת
  choice: 腰を覆うもの
  rationale: 腰に巻き付ける物という語義を示しつつ、具体的な衣類の形を「前掛け」や「腰布」と断定しない。
theological_decisions:
- issue: 目が開かれたことと羞恥・道徳意識との関係
  choice: 目が開かれ、裸であることを知ったという本文の叙述にとどめる。
  alternative: 「恥ずかしくなった」「良心が目覚めた」などと明示する。
  rationale: 羞恥や自己認識の変化は文脈からうかがえるが、この節自体はそれを明言していないため、神学的・心理的説明を補わない。
- issue: חֲגֹרֹתの具体的形状
  choice: 腰を覆うもの
  alternative: 腰布、前掛け、帯
  rationale: 腰に着ける物である点は示しながら、その形状や覆う範囲について原文以上に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「二人」を必要な箇所で繰り返して主語を明確にし、原文の叙述順序を保った。
