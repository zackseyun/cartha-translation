base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/020.yaml
  text: And the man called his wife's name Eve[b][a], because she was the mother of all the living.
translation:
  language: ja
  text: その人は妻をエバと名づけた[a]。彼女が、すべての生きているものの母であったからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アダムは妻をエバと名づけた」。ヘブライ語は定冠詞を伴う「その人」。
    reason: alternative_reading
  - marker: b
    text: 直訳「彼女は、すべての生きているものの母であった」。「すべての生きているもの」は、「すべての生きている人」または「すべての生き物」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם
  choice: 名づけた
  rationale: ヘブライ語の命名表現を、現代日本語で自然かつ簡潔に表した。
- source_word: הָאָדָם
  choice: その人
  rationale: 定冠詞を伴うため固有名「アダム」と断定せず、文脈上すでに知られている男性を指す表現とした。
- source_word: אִשְׁתּוֹ
  choice: 妻を
  rationale: この文脈では配偶者を指すため、自然な日本語の「妻」とした。
- source_word: חַוָּה
  choice: エバ
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: כִּי
  choice: からである
  rationale: 命名の理由を導く因果関係を明確に表した。
- source_word: הָיְתָה
  choice: となった
  rationale: 日本語では、物語上の位置と母としての関係を自然に示すため「となった」とした。ただし、原語は状態を表す「であった」とも訳し得る。
- source_word: אֵם כָּל חָי
  choice: すべて生きているものの母
  rationale: 原文の簡潔で範囲の広い表現を保ち、「全人類」などに限定しなかった。
theological_decisions:
- issue: הָאָדָםを固有名として訳すか、普通名詞として訳すか
  choice: その人
  alternative: アダム
  rationale: 定冠詞付きの「人」であることを本文に反映しつつ、別訳を脚注に示した。
- issue: 「すべて生きているもの」の範囲
  choice: 範囲を限定せずに訳す
  alternative: すべての生きている人／すべての生き物
  rationale: 原文には解釈上の幅があるため、人間だけ、または生物全般のいずれかに本文で限定しなかった。
- issue: הָיְתָהの状態・推移の含み
  choice: となった
  alternative: であった
  rationale: 日本語としての物語の流れを優先したが、原語の基本的な状態表現も脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。「その人」により定冠詞付き普通名詞のニュアンスを保ち、命名句は自然な日本語の「妻をエバと名づけた」とした。
