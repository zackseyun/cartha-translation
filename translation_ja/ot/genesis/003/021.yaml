source:
  edition: WLC
  text: וַ/יַּעַשׂ֩ יְהוָ֨ה אֱלֹהִ֜ים לְ/אָדָ֧ם וּ/לְ/אִשְׁתּ֛/וֹ כָּתְנ֥וֹת ע֖וֹר וַ/יַּלְבִּשֵֽׁ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/021.yaml
  text: And Yahweh God made garments of skin for the man and for his wife[b][a], and clothed them.
translation:
  language: ja
  text: ヤハウェ神は、その人[a]とその妻のために皮の衣[b]を作り、二人に着せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アダム」。ヘブライ語の אָדָם は、文脈により固有名「アダム」とも、普通名詞「人」とも取れる。
    reason: alternative_reading
  - marker: b
    text: 別訳「皮の長衣」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な学術的音写で示した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: יְהוָהと同格であり、この物語で用いられる「ヤハウェ神」という複合的な呼称を自然な日本語で表した。
- source_word: לְאָדָם
  choice: 人のために
  rationale: この文脈では妻と対になる男性個人を指す一方、固有名「アダム」とも読める曖昧さがある。本文では物語上なお自然な普通名詞「人」を採用し、別訳を脚注に示した。
- source_word: וּלְאִשְׁתּוֹ
  choice: その妻のために
  rationale: 三人称男性単数の接尾辞を保ち、婚姻関係を明確かつ自然に表した。
- source_word: כָּתְנוֹת
  choice: 衣
  rationale: 身体を覆う衣服を指す語。現代日本語として自然で格調も保てる「衣」を採用し、より具体的な「長衣」を脚注の別訳とした。
- source_word: עוֹר
  choice: 皮
  rationale: 動物の皮・皮革を表す語であり、加工の程度を限定しない「皮」が原語に最も近い。
- source_word: וַיַּעַשׂ
  choice: 作り
  rationale: עשהの基本義を簡潔に表し、不要な解釈を加えない。
- source_word: וַיַּלְבִּשֵׁם
  choice: 二人に着せた
  rationale: 使役形の「彼らに着せる」を自然な日本語にし、目的語が人と妻の二人であることを明確にした。
theological_decisions:
- issue: אָדָםを固有名として訳すか、普通名詞として訳すか
  choice: 普通名詞「人」
  alternative: 固有名「アダム」
  rationale: この箇所では「その妻」と対になる男性個人を指すが、ヘブライ語は固有名と普通名詞の両方に読める。本文では普通名詞としての物語的な響きを保ち、固有名の可能性を脚注で明示した。
translation_notes:
  register: 明瞭で現代的ながら聖書本文にふさわしい格調を保った。「彼ら」より自然で指示対象も明確な「二人」を用いた。原文の簡潔な二つの動作「作る」「着せる」を維持した。
