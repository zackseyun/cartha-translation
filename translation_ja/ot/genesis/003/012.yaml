  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר הָֽ/אָדָ֑ם הָֽ/אִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔/י הִ֛וא נָֽתְנָה לִּ֥/י מִן הָ/עֵ֖ץ וָ/אֹכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/012.yaml
  text: And the man said[a], “The woman whom you gave to be with me—she gave me from the tree, and I ate.”
translation:
  language: ja
  text: 人は言った。「私と共にいる者として、あなたが与えてくださったその女が、木からのものを私にくれ、私は食べました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָדָם
  choice: 人
  rationale: ここでは人類一般ではなく、神に答える個々の男性を指す。創世記の文脈に沿い、固有名の「アダム」とはせず「人」とした。
- source_word: הָאִשָּׁה
  choice: あの女
  rationale: 基本義の「女」を保ち、独立代名詞 הִוא の強調も日本語として自然に反映する。「妻」は可能だが、原文より関係を限定するため採らない。
- source_word: אֲשֶׁר נָתַתָּה עִמָּדִי
  choice: あなたが私と共にいるようにと与えてくださった
  rationale: עִמָּדִי の同伴・共在の意味を自然な日本語で示す。神への発話として敬語を用いるが、責任を神へ向ける含みは弱めない。
- source_word: נָתְנָה לִי
  choice: 私にくれた
  rationale: 完了した出来事を自然な過去表現で示す。
- source_word: מִן הָעֵץ
  choice: 木から取ったもの
  rationale: 原文には「実」に当たる語がないため「木の実」と断定せず、ただし日本語で「木から私にくれた」とする不自然さを避けるため、文脈上暗示される目的語を「取ったもの」と補った。
- source_word: וָאֹכֵל
  choice: 私は食べました
  rationale: 物語上の順序を保ち、因果を過度に強めず、率直な過去の叙述とした。
theological_decisions:
- issue: 人の返答に含まれる、女と神への責任転嫁の含み
  choice: 「あなたが私と共にいるようにと与えてくださったあの女」とし、原文の言い回しを保つ
  alternative: 「一緒に置いてくださった女」または含みを弱めた「女が」
  rationale: 原文は神が与えた女であることを明示し、責任を女だけでなく神にも向けるような緊張を残す。翻訳で非難を強調も緩和もしない。
translation_notes:
  register: 明瞭な現代標準日本語。神への直接話法には自然な敬語を用いながら、全体は簡潔で荘重な物語調とした。原文にない「実」は本文に直接補わず、「取ったもの」で暗示された目的語を最小限に明示した。
