id: GEN.3.1
reference: Genesis 3:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/נָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִ/כֹּל֙ חַיַּ֣ת הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהוָ֣ה אֱלֹהִ֑ים וַ/יֹּ֨אמֶר֙ אֶל הָ֣/אִשָּׁ֔ה אַ֚ף כִּֽי אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִ/כֹּ֖ל עֵ֥ץ הַ/גָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/001.yaml
  text: The serpent was more crafty than any beast of the field that Yahweh God had made[a]. And he said to the woman, “Indeed, has God said[c][b], ‘You shall not eat from any tree of the garden’?”
translation:
  language: ja
  text: 蛇は、ヤハウェ神が造られた野のどの生き物よりも狡猾であった[a]。蛇は女に言った。「本当に神は、『園のどの木からも食べてはならない』と言われたのですか[b][c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「狡猾」は、「抜け目がない」「賢い」とも訳せる。ヘブライ語は文脈によって思慮深さを表すこともあるが、ここでは欺くような問いかけが続くため、否定的な含みがある。
    reason: lexical_alternative
  - marker: b
    text: 語り手は「ヤハウェ神」と呼ぶが、蛇は「神」とだけ言っている。原文の呼称の変化を訳文でも保っている。
    reason: alternative_reading
  - marker: c
    text: 直訳的には「園のすべての木から」。否定を伴うこの問いでは、「園のどの木からも」とすることで、神の命令を誇張する蛇の言い方が自然に伝わる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנָּחָשׁ
  choice: さて、蛇は
  rationale: 接続詞 וְ の場面展開・連続性を、明示的な時間語を加えず、日本語の自然な物語導入「さて」で表した。名詞は定冠詞を伴うため「蛇」とした。
- source_word: עָרוּם
  choice: 狡猾
  rationale: この語は文脈により「賢い」「抜け目がない」ともなり得るが、ここでは直後の欺瞞的な問いかけにより否定的な含みが強い。「狡猾」はその含みを自然に伝える。
- source_word: מִכֹּל חַיַּת הַשָּׂדֶה
  choice: 野のどの生き物よりも
  rationale: מִן＋כֹּל の比較構文を「どの…よりも」とし、חַיַּת הַשָּׂדֶה は過度に限定的な「野獣」ではなく「野の生き物」とした。
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 固有の神名 יְהוָה を「ヤハウェ」と音写し、אֱלֹהִים との結合も保った。
- source_word: וַיֹּאמֶר אֶל־הָאִשָּׁה
  choice: 蛇は女に言った
  rationale: 日本語では主語を再提示した方が明瞭であるため「蛇は」とした。「女」は本文の呼称を保ち、後の名「エバ」を先取りしない。
- source_word: אַף כִּי אָמַר אֱלֹהִים
  choice: 本当に神は…と言われたのですか
  rationale: אַף כִּי の解釈に議論はあるが、ここでは疑念を差し挟む問いとして自然な「本当に…のですか」とした。語順上、蛇が אֱלֹהִים のみを用いる点も保った。
- source_word: לֹא תֹאכְלוּ מִכֹּל עֵץ הַגָּן
  choice: 園のどの木からも食べてはならない
  rationale: 否定文中の מִכֹּל を日本語の自然な全面否定「どの…からも…ない」で表し、蛇が命令を誇張している問いの形を保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／主なる神
  rationale: 原文が固有名 יְהוָה を明記しているため、それを称号に置き換えず「ヤハウェ」とした。
- issue: 語り手と蛇による神の呼称の違い
  choice: 語り手は「ヤハウェ神」、蛇は「神」
  alternative: 両方を「ヤハウェ神」に統一する
  rationale: 原文は語り手の יְהוָה אֱלֹהִים から蛇の אֱלֹהִים へ呼称を変えており、その文学的・神学的緊張を調和させず保持した。
- issue: עָרוּם の道徳的含意
  choice: 狡猾
  alternative: 抜け目がない／賢い
  rationale: 語自体には文脈依存の幅があるが、直後の発言が欺瞞的であるため本文では否定的含意を出し、別の可能性を脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語としての品位を保った。「言われたのですか」は、蛇の問いの慇懃さと疑念をにじませる自然な表現。「野獣」は攻撃的な獣に狭く受け取られ得るため「野の生き物」とした。
