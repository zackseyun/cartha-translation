  text: וַֽ/יְשַׁלְּחֵ֛/הוּ יְהוָ֥ה אֱלֹהִ֖ים מִ/גַּן עֵ֑דֶן לַֽ/עֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר לֻקַּ֖ח מִ/שָּֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/023.yaml
  text: So Yahweh God sent him out from the garden of Eden to work the ground from which he had been taken[a].
translation:
  language: ja
  text: そこで、神であるヤハウェは、彼が取られた土を耕すために、彼をエデンの園から送り出した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「耕す」と訳したヘブライ語は、「働く」または「仕える」という意味にもなりうる。ここでは土を対象としているため、「耕す」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחֵהוּ
  choice: 彼を……から送り出し
  rationale: ピエル形の基本的な「送る、去らせる」と、エデンから外へ出す方向性を自然に表す。次節の גּרשׁ が持つ、より強い「追放する、追い出す」という語感は先取りしない。
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 固有の神名 יהוה を「ヤハウェ」と音写し、אֱלֹהִים との組み合わせを簡潔に保つ。
- source_word: מִגַּן עֵדֶן
  choice: エデンの園から
  rationale: 前置詞 מִן の分離・起点を、日本語として自然な「から」で示す。
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: 土を耕させた
  rationale: עבד は広く「働く、仕える」を意味するが、目的語が אֲדָמָה（土）なので、農耕の文脈に即した「耕す」が明瞭で自然。目的を表す不定詞を、日本語では送り出した結果・目的が明確になる使役表現で訳す。語義の幅は脚注に残す。
- source_word: אֲשֶׁר לֻקַּח מִשָּׁם
  choice: 彼がそこから取られた
  rationale: 受動形を保ち、創世記2章で人が土から形造られたこととの結び付きを明示する。「そこ」が先行する「土」を指す関係も日本語で自然に伝える。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文にある固有名を固有名として示し、一般称号へ置き換えない。
- issue: 人の務めと土との関係
  choice: 土を耕させた
  alternative: 土に仕えさせた／土で働かせた
  rationale: 農耕という文脈上の意味を自然に示す一方、刑罰・贖いなど本文に明記されない神学的説明は加えない。עבד の語義の幅は脚注で示す。
- issue: 送り出す行為の強さ
  choice: 送り出し
  alternative: 追い出し
  rationale: この節の שׁלח と次節のより強い גּרשׁ の語彙上の違いを保ち、ここで強制的追放のニュアンスを過度に強めない。
translation_notes:
  register: 明快な現代標準日本語を用い、物語文として簡潔で格調ある調子を保った。「彼」は直前の男を指す。主節を一文にまとめ、ヘブライ語の行為と目的のつながりが普通の読者にも明確になるようにした。
