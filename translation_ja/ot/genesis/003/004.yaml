id: GEN.3.4
reference: Genesis 3:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר הַ/נָּחָ֖שׁ אֶל הָֽ/אִשָּׁ֑ה לֹֽא מ֖וֹת תְּמֻתֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/004.yaml
  text: But the serpent said to the woman[b][a], “You will not surely die.”
translation:
  language: ja
  text: しかし、蛇は女に言った。「あなたがたは決して死にません[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「死ぬこと、あなたがたは死ぬ」という強調構文が否定されており、「あなたがたは決して死なない」という断固とした意味になります。「あなたがた」は原文で複数形です。
    reason: ヘブライ語の強調構文と二人称複数形を説明するため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかし、……言った
  rationale: 接続形は物語を進めるが、ここでは直前の神の警告に対する明白な反論なので、文脈上の対立を自然な日本語で示す「しかし」とした。
- source_word: הַנָּחָשׁ
  choice: 蛇
  rationale: נָחָשׁ は蛇を指す。創世記の物語で定着した呼称を保ちつつ、現代日本語として自然である。
- source_word: הָאִשָּׁה
  choice: 女
  rationale: אִשָּׁה は「女」または「妻」を意味し得るが、この箇所ではエバと名づけられる前の物語上の呼称「女」を保つ。
- source_word: לֹא מוֹת תְּמֻתוּן
  choice: あなたがたは決して死にません
  rationale: 不定詞絶対形と定動詞の組み合わせを לֹא が否定しており、蛇による断固とした否定を表す。「決して〜ない」によってその強調を曖昧にせず、二人称複数形も「あなたがた」で明示した。
theological_decisions:
- issue: 蛇の否定の強さ
  choice: 「決して死にません」という全面的で強い否定
  alternative: 「必ず死ぬわけではありません」または単に「死にません」
  rationale: ヘブライ語は創世記2章17節の強調構文を否定形で直接打ち返している。死が即時か将来かという解釈を加えず、警告との鋭い対立を保持した。
- issue: 二人称複数形の扱い
  choice: 「あなたがた」と明示する
  alternative: 日本語で自然な単数的表現「あなた」
  rationale: 発話の直接の相手は女だが、תְּמֻתוּן は文法上複数形であるため、解釈で狭めず原文の数を保持した。
translation_notes:
  register: 明快な現代標準日本語を用い、会話として自然な丁寧体にした。「決して〜ません」により蛇の断定的な反論を保ち、過度に古風な「死ぬことはない」や曖昧になり得る「必ずしも死なない」は避けた。
