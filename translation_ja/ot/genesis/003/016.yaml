id: GEN.3.16
reference: Genesis 3:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֶֽל הָ/אִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣/ךְ וְ/הֵֽרֹנֵ֔/ךְ בְּ/עֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְ/אֶל אִישֵׁ/ךְ֙ תְּשׁ֣וּקָתֵ֔/ךְ וְ/ה֖וּא יִמְשָׁל בָּֽ/ךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/016.yaml
  text: To the woman he said[a], “I will greatly multiply your pain and your conception; in pain you will bear children. Your desire will be for your husband[c][b], and he will rule over you.”
translation:
  language: ja
  text: '女に、こう言われた。


    「わたしは、あなたの苦しみと妊娠を大いに増す[a]。


    あなたは苦しみながら子どもを産む[b]。


    あなたの願いは夫に向かう[c]。


    夫はあなたを支配する。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「妊娠」と訳したヘブライ語は、受胎または妊娠を意味し得る。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「息子たち」。ここでは子ども、または子孫一般を指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: 「願い」と訳したヘブライ語は用例が少なく、「欲求」「慕い」とも訳し得る。広い意味での欲求を指すとも、夫との関係や性的な慕いを指すとも、創世記4章7節との比較から支配しようとする欲求を指すとも解釈される。
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: 女
  rationale: この裁きの場面では、妻という関係だけでなく女性である人そのものに語りかけているため、「女」とした。後半の אִישֵׁךְ は婚姻関係を明示するので「夫」と訳し分けた。
- source_word: הַרְבָּה אַרְבֶּה
  choice: 大いに増す
  rationale: 不定詞絶対形と定動詞の組み合わせによる強意を、自然な現代日本語で表した。
- source_word: עִצְּבוֹנֵךְ
  choice: あなたの苦しみ
  rationale: この語は苦痛、労苦、悲しみを含み得る。出産の文脈に適合しつつ意味を狭めすぎない「苦しみ」とした。
- source_word: וְהֵרֹנֵךְ
  choice: 身ごもり
  rationale: 受胎または妊娠を指す語。日本語ではその両方を比較的自然に包摂できる「身ごもり」を採用し、語義の幅を脚注に示した。
- source_word: בְּעֶצֶב
  choice: 苦しみながら
  rationale: 出産に伴う状況・様態を表す前置詞句を、自然な日本語にした。
- source_word: תֵּלְדִי בָנִים
  choice: 子どもを産む
  rationale: בָנִים は字義的には「息子たち」だが、ここでは子孫・子ども一般を指す用法と判断した。字義は脚注に残した。
- source_word: אִישֵׁךְ
  choice: 夫
  rationale: ここでは女との婚姻関係にある男性を指すため、「男」ではなく「夫」が自然である。
- source_word: תְּשׁוּקָתֵךְ
  choice: あなたの求めは…に向かい
  rationale: まれで解釈の分かれる語であり、慕情、性的欲求、依存、支配への欲求のいずれかに限定しない表現を選んだ。
- source_word: יִמְשָׁל בָּךְ
  choice: あなたを支配する
  rationale: 動詞の基本義である統治・支配を直接表す。「威圧する」など、原語以上に強い評価的意味は加えなかった。
theological_decisions:
- issue: 女の夫に対する תְּשׁוּקָה の意味
  choice: 「求め」と訳し、その内容を特定しない。
  alternative: 性的な欲求、関係的な慕いまたは依存、創世記4章7節との並行に基づく支配欲。
  rationale: この名詞は用例が少なく、文脈だけでは一つの意味に確定できない。本文では解釈上の緊張を保ち、主な理解を脚注に示した。
- issue: 「夫はあなたを支配する」が規範か結果の描写か
  choice: 堕落後に起こることの叙述として「支配する」と訳す。
  alternative: 男性の権威を命じる規範的宣言と読む。
  rationale: ヘブライ語の動詞形は、何が起こるかを述べており、何が起こるべきかを明示的に命じてはいない。訳文に規範的主張を付加しなかった。
- issue: 「苦しみ」と「身ごもり」の関係
  choice: ヘブライ語の並列を保ち、「苦しみと身ごもり」と訳す。
  alternative: 二語一意として「妊娠の苦しみ」または「出産の苦痛」とまとめる。
  rationale: 原文は二つの名詞を接続しており、その関係には解釈の余地があるため、本文で一方に限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の宣告としての簡潔さと荘重さを保った。「身ごもり」「求め」は日常的に理解できる語を選びつつ、原語の曖昧さを脚注で補った。
