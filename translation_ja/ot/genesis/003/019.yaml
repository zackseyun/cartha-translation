source:
  edition: WLC
  text: בְּ/זֵעַ֤ת אַפֶּ֨י/ךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְ/ךָ֙ אֶל הָ֣/אֲדָמָ֔ה כִּ֥י מִמֶּ֖/נָּה לֻקָּ֑חְתָּ כִּֽי עָפָ֣ר אַ֔תָּה וְ/אֶל עָפָ֖ר תָּשֽׁוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/019.yaml
  text: By the sweat of your face you will eat bread until you return to the ground[a], because from it you were taken; for you are dust, and to dust you will return.
translation:
  language: ja
  text: あなたは、土に帰るまで、顔に汗を流してパンを食べる。あなたが土から取られたからだ。あなたはちりであり、ちりに帰るからだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたはちりであり、ちりに帰る。なぜなら、あなたはちりだからである」。
    reason: 原文の二つ目の「なぜなら」による説明関係を示すため。
lexical_decisions:
- source_word: בְּזֵעַת אַפֶּיךָ
  choice: 顔に汗を流して
  rationale: 直訳は「あなたの顔の汗によって」。ヘブライ語の身体的なイメージを保ちつつ、現代日本語として自然な表現にした。
- source_word: תֹּאכַל לֶחֶם
  choice: パンを食べる
  rationale: לֶחֶם は文脈上、食物全般を指し得るが、語そのものは「パン」なので、具体的な表現を本文に残した。
- source_word: עַד שׁוּבְךָ אֶל הָאֲדָמָה
  choice: 土に帰る時まで
  rationale: עַד の期限を明示し、אֲדָמָה を人が取られ、再び帰る「土」として自然に訳した。
- source_word: כִּי מִמֶּנָּה לֻקָּחְתָּ
  choice: お前は土から取られたのだから
  rationale: 女性単数代名詞の指示対象である אֲדָמָה を「土」と明示し、受動形「取られた」を保持した。
- source_word: עָפָר
  choice: ちり
  rationale: אֲדָמָה の「土」と区別しつつ、人間の物質的起源と死すべき性質を表す עָפָר の伝統的かつ的確な意味を保った。
- source_word: תָּשׁוּב
  choice: 帰る
  rationale: 宣告された帰結の確実さを、簡潔で荘重な現代日本語で表した。
theological_decisions:
- issue: 人間の死と物質的起源
  choice: 人が、取られた土へ身体的に帰るとの宣告として訳す。
  alternative: 身体的な死よりも屈辱を中心とする比喩的な読み。
  rationale: אֲדָמָה（「土」）と עָפָר（「ちり」）の対応、および直近の文脈は、死と身体の土への帰還を強く示す。ただし、本文を越えた後代の教理的説明は加えない。
- issue: 二つの כִּי の説明関係
  choice: 第一の כִּי を「のだから」で因果関係として示し、第二は「お前はちりであり」と直接的な根拠の宣言として表す。
  alternative: 二つとも接続詞「なぜなら」を明示する。
  rationale: 原文の説明の連鎖を保ちながら、日本語で冗長になる接続詞の反復を避けた。第二の因果関係は文脈上明瞭である。
translation_notes:
  register: 神が男に直接語る厳粛な宣告として、二人称は「お前」を用いた。古語調を避けつつ、短い断定文によって重みを保った。語順は日本語の明瞭さのため一部整えたが、「土に帰る時まで」という期限、パン、土、ちりの主要な語彙と論理関係を保持している。
