    rationale: 原語のיַהְוֶה אֱלֹהִיםの並置を、日本語では「ヤハウェなる神」とするほうが自然であり、神名と称号の双方を保持できる。
  revised_text: そこで、ヤハウェなる神は言った。「見よ、人は善悪を知る、われわれの一人のようになった。今や、彼が手を伸ばして命の木からも取り、食べて永遠に生きることになっては――」
