revisions:
- from: そこで、ヤハウェ神は言った。「見よ、人はわれわれの一人のようになり[a]、善悪を知る者となった。今や、彼が手を伸ばして命の木からも取り、食べて永遠に生きることになっては――」
  to: そこで、ヤハウェなる神は言った。「見よ、人は善悪を知る、われわれの一人のようになった。今や、彼が手を伸ばして命の木からも取り、食べて永遠に生きることになっては――」
  rationale: 神名と称号の表現を自然な日本語に整え、「善悪を知る」が「われわれの一人のように」を説明する原文の関係を明瞭にした。פֶּן節の未完結性は「ことになっては――」と長いダッシュによって保持し、暗黙の帰結や否定を補っていない。
