id: GEN.3.22
reference: Genesis 3:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽ/אָדָם֙ הָיָה֙ כְּ/אַחַ֣ד מִמֶּ֔/נּוּ לָ/דַ֖עַת ט֣וֹב וָ/רָ֑ע וְ/עַתָּ֣ה פֶּן יִשְׁלַ֣ח יָד֗/וֹ וְ/לָקַח֙ גַּ֚ם מֵ/עֵ֣ץ הַֽ/חַיִּ֔ים וְ/אָכַ֖ל וָ/חַ֥י לְ/עֹלָֽם׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/022.yaml
  text: Then Yahweh God said[a], “Behold, the man has become like one of us, knowing good and evil. And now, lest he reach out his hand and also take from the tree of life and eat, and live forever—”
translation:
  language: ja
  text: そこで、ヤハウェなる神は言った。「見よ、人は善悪を知る、われわれの一人のようになった。今や、彼が手を伸ばして命の木からも取り、食べて永遠に生きることになっては――」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 神の固有名である四文字名を「ヤハウェ」と音写し、後続する אֱלֹהִים を「神」とした。
- source_word: הֵן
  choice: 見よ
  rationale: 注意を促す間投詞の力と、神の発言にふさわしい厳粛な調子を保つ。
- source_word: הָאָדָם
  choice: 人
  rationale: ここでは直前から語られている個人としての人を指す。日本語では性別を不必要に補わず、文脈上明瞭な「人」とした。
- source_word: הָיָה כְּאַחַד מִמֶּנּוּ
  choice: われわれの一人のようになり
  rationale: 完了形が示す出来事後の結果的状態を「なり」で表し、一人称複数を解釈せずそのまま残した。
- source_word: לָדַעַת טוֹב וָרָע
  choice: 善悪を知る者となった
  rationale: 不定詞が前句の内容または結果を説明する働きを、自然な日本語で示した。「善悪」の意味範囲は狭く限定していない。
- source_word: וְעַתָּה פֶּן
  choice: 今や……ことになっては――
  rationale: וְעַתָּה の切迫した展開を「今や」で示し、פֶּן の危惧・防止の意味を、未完のまま途切れる日本語の構文で表した。
- source_word: יִשְׁלַח יָדוֹ
  choice: 手を伸ばして
  rationale: ヘブライ語の具体的な身体表現を、自然な日本語として保持した。
- source_word: עֵץ הַחַיִּים
  choice: 命の木
  rationale: 構成形を簡潔かつ慣用的に訳した。
- source_word: וְלָקַח גַּם ... וְאָכַל וָחַי לְעֹלָם
  choice: からも取り、食べて永遠に生きる
  rationale: גַּם の付加的意味を「も」で保ち、連続する動作と לְעֹלָם の時間的意味を明瞭に表した。
theological_decisions:
- issue: 「われわれ」の複数形
  choice: 複数形を「われわれ」として保持し、本文では説明しない。
  alternative: 神的会議、熟慮の複数、威厳の複数、または神内部の複数性を示す表現として明示する。
  rationale: 原文は明確に一人称複数を用いるが、その指示対象を確定していない。特定の神学的理解に限定せず、原文の緊張と曖昧さを残す。
- issue: 神の発言の突然の中断
  choice: 長いダッシュで未完の発言を保持する。
  alternative: 暗黙の帰結を補って完全文にする。
  rationale: 原文の פֶּן 節は帰結が明示されないまま途切れ、次節の行動へ移る。補足せず、中断を日本語でも示した。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、「見よ」「今や」によって神の発言の厳粛さと切迫感を保った。末尾は「ことになっては――」として、日本語として理解可能でありながら原文の中断を明確に再現した。
