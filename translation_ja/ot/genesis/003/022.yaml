  source_fidelity: 本文は全体としてヘブライ語の語順と意味をよく保ち、「われわれ」という複数形、命の木から「も」取るという付加、発言の中断も適切に扱っている。ただし、「われわれの一人のようになり、善悪を知る者となった」は、原文の「善悪を知る」が「われわれの一人のように」の内容を説明する関係をやや分離して響かせる。
  naturalness: 「ヤハウェ神」は意味は明瞭だが、現代標準日本語では「ヤハウェなる神」のほうが固有名ヤハウェと称号「神」の並置を自然に表す。また、「善悪を知る、われわれの一人のようになった」とすれば、原文の修飾関係を簡潔で自然な日本語にできる。
  terminology: 神名は「ヤハウェ」とし、אֱלֹהִים を「神」とする方針を維持した。「命の木」「善悪」「永遠に生きる」も適切である。脚注は複数形の指示対象を決めつけず、英語監査記録の趣旨に沿っている。
