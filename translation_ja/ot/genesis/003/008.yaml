  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֞וּ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּ/גָּ֖ן לְ/ר֣וּחַ הַ/יּ֑וֹם וַ/יִּתְחַבֵּ֨א הָֽ/אָדָ֜ם וְ/אִשְׁתּ֗/וֹ מִ/פְּנֵי֙ יְהוָ֣ה אֱלֹהִ֔ים בְּ/ת֖וֹךְ עֵ֥ץ הַ/גָּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/008.yaml
  text: And they heard the sound of Yahweh God walking in the garden in the breeze of the day[c][b][a], and the man and his wife hid themselves from the presence of Yahweh God among the trees of the garden.
translation:
  language: ja
  text: 二人は、日の風の時に[b]、園の中を歩いておられるヤハウェ神の物音[a]を聞いた。その人[c]とその妻は、ヤハウェ神の御前から、園の木々の間に身を隠した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「物音」は「声」とも訳せる。ヘブライ語はどちらの意味にもなり得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「日の風の時に」。伝統的には「日の涼しいころ」とも訳される。
    reason: lexical_alternative
  - marker: c
    text: 「その人」は「アダム」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: קוֹל
  choice: 物音
  rationale: 「声」と「音」の両方を表し得る語だが、ここでは神が語ったとは明記されず、「歩いておられる」と結びつくため、「物音」とした。「声」の可能性は脚注に残す。
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 神の固有名יהוהを称号に置き換えず「ヤハウェ」と音写し、אלהיםを「神」と訳す。
- source_word: מִתְהַלֵּךְ
  choice: 歩いておられる
  rationale: 園の中を動き回ることを示すヒトパエル分詞。擬人的な描写を弱めたり比喩化したりせず、自然な敬語表現で保持する。
- source_word: לְרוּחַ הַיּוֹם
  choice: 日の風が吹くころ
  rationale: 直訳的な「日の風」を保ちながら、日本語として時を表す句になるよう「吹くころ」とした。「涼しいころ」という結果に基づく解釈は脚注に示す。
- source_word: הָאָדָם
  choice: 人
  rationale: 定冠詞付きの語で、この文脈では妻を持つ個人を指す一方、人類を代表する響きもある。「アダム」と固定せず「人」とし、別解を脚注に示す。
- source_word: מִפְּנֵי
  choice: 御前を避けて
  rationale: 字義は「顔／臨在から」。単なる場所的な逃避以上の関係的含意を保ちつつ、現代日本語として自然にした。
- source_word: בְּתוֹךְ עֵץ הַגָּן
  choice: 園の木々の間に
  rationale: עֵץは形態上単数だが集合的に用いられており、隠れる場面に即して「木々」と訳す。
theological_decisions:
- issue: 神が園を「歩く」という擬人的描写
  choice: 「園の中を歩いておられる」と具体的に訳す
  alternative: 「園の中を動いておられる」または「神の臨在の音」と抽象化する
  rationale: 原文の鮮明な擬人的表現とそこに伴う神学的緊張を、そのまま保持するため。
- issue: הָאָדָםの個人名・普通名詞としての読み
  choice: 本文では「人」
  alternative: 「アダム」または「その男」
  rationale: 直近の「その妻」は個人を指すが、この段階の語には「人」という代表的な響きも残るため、本文で普通名詞として訳し、固有名の可能性を脚注に示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。神への敬意を表すため「歩いておられる」「御前」を用いたが、原文の具体性は弱めていない。脚注記号は対応する語句の直後に配置した。
