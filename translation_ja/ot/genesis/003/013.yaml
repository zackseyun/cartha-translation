  text: וַ/יֹּ֨אמֶר יְהוָ֧ה אֱלֹהִ֛ים לָ/אִשָּׁ֖ה מַה זֹּ֣את עָשִׂ֑ית וַ/תֹּ֨אמֶר֙ הָֽ/אִשָּׁ֔ה הַ/נָּחָ֥שׁ הִשִּׁיאַ֖/נִי וָ/אֹכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/013.yaml
  text: Then Yahweh God said to the woman[a], “What is this you have done?” And the woman said, “The serpent deceived me, and I ate.”
translation:
  language: ja
  text: そこで、ヤハウェ神は女に言われた。「あなたは、いったい何ということをしたのか。」女は言った。「蛇が私を欺き[a]、私は食べました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私を惑わした」とも訳せる。ヘブライ語の動詞は、人を誤らせること、欺くことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で表した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: יְהוָה אֱלֹהִים という結び付きを、自然で明瞭な「ヤハウェ神」とした。
- source_word: לָאִשָּׁה
  choice: 女に
  rationale: אִשָּׁה には「妻」の意味もあるが、ここでは物語中の呼称に合わせて「女」とした。
- source_word: מַה זֹּאת עָשִׂית
  choice: あなたは、いったい何ということをしたのか
  rationale: 疑問詞と指示語の強い問いかけを、因果を問う「なぜ」に変えず、自然な現代日本語で表した。
- source_word: הַנָּחָשׁ
  choice: 蛇
  rationale: 文脈上の動物と物語上の存在を、定着した簡潔な日本語で表した。
- source_word: הִשִּׁיאַנִי
  choice: 私を欺き
  rationale: この動詞が表す、誤らせるためにだますという意味を明瞭に伝える。「たぶらかす」は現代語としてやや古風なため避けた。
- source_word: וָאֹכֵל
  choice: 私は食べました
  rationale: 蛇の欺きに続く女自身の行為を明示し、接続を過度に因果的な表現へ限定しないようにした。
theological_decisions:
- issue: 蛇の行為についての女の説明
  choice: 蛇が私を欺き
  alternative: 蛇が私を惑わし／たぶらかし
  rationale: 蛇による欺きという本文の意味を保ちつつ、女の責任や蛇の意図について本文以上の解釈を加えない表現とした。
translation_notes:
  register: 明瞭で現代的ながら、神と人との厳粛な対話にふさわしい品位を保った。神の発話には自然な敬意を示す「言われた」を用い、女の返答は簡潔に「言った」とした。
