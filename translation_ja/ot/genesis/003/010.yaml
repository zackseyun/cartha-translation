base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/010.yaml
  text: And he said[a], “I heard your voice in the garden, and I was afraid because I was naked, so I hid myself.”
translation:
  language: ja
  text: 彼は言った。「私は園であなたの声[a]を聞きました。私は裸だったので、恐れ、身を隠しました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「音」。ヘブライ語のコールは「音」または「声」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 彼は言った
  rationale: ヘブライ語の物語を進める標準的な表現。直前の問いに対する男の返答として、自然で簡潔な日本語にした。
- source_word: אֶת קֹלְךָ
  choice: あなたの物音
  rationale: קוֹלは「声」にも「音」にもなり得る。ここでは発話そのものと限定せず、園の中で神が動く気配を含み得る広い意味を保つため「物音」とした。
- source_word: שָׁמַעְתִּי בַּגָּן
  choice: 私は園で…聞きました
  rationale: 場所を示すבַּגָּןを自然な日本語の語順で表し、既出の特定の園を「園」とした。
- source_word: וָאִירָא
  choice: 恐ろしくなり
  rationale: יראが表す恐れを現代日本語で自然に表現し、後続する身を隠す行為へつないだ。
- source_word: כִּי עֵירֹם אָנֹכִי
  choice: 私は裸だったので
  rationale: כִּיの因果関係を「ので」で示した。名詞文自体に時制は明示されないが、過去の行動を説明する日本語として「だった」が自然である。
- source_word: וָאֵחָבֵא
  choice: 身を隠しました
  rationale: חבאの再帰的な意味を、簡潔で自然な日本語の「身を隠す」で表した。
theological_decisions:
- issue: 神の臨在に関連するקוֹלの訳
  choice: 物音
  alternative: 声
  rationale: 原語は「音」と「声」の双方を表し得る。この箇所で明瞭な発話を聞いたと断定せず、意味の幅を本文に残した。「声」という伝統的で可能な訳は脚注に示した。
translation_notes:
  register: 明瞭な現代標準日本語。男が神に答える場面なので引用内は丁寧体とし、簡潔さと荘重さを保った。
