id: GEN.3.5
reference: Genesis 3:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּ/יוֹם֙ אֲכָלְ/כֶ֣ם מִמֶּ֔/נּוּ וְ/נִפְקְח֖וּ עֵֽינֵי/כֶ֑ם וִ/הְיִיתֶם֙ כֵּֽ/אלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָ/רָֽע׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/003/005.yaml
  text: For God knows that on the day you eat from it[a], your eyes will be opened, and you will be like God, knowing good and evil.
translation:
  language: ja
  text: というのも、あなたがたがそれを食べる日に、あなたがたの目が開かれ、神のように[a]善と悪を知る者になることを、神は知っているからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神々のように」または「神的な存在のように」とも訳せる。ヘブライ語の「エロヒーム」には、文脈によってこれらの意味もある。
    reason: כֵּאלֹהִים の אֱלֹהִים が単数の「神」か、複数の「神々」または「神的な存在」かには、解釈上の余地があるため。
lexical_decisions:
- source_word: כִּי
  choice: というのも……からだ
  rationale: 直前の蛇の主張を理由づける接続表現として、ヘブライ語の談話上の働きを自然な現代日本語で表した。
- source_word: יֹדֵעַ אֱלֹהִים
  choice: 神は知っている
  rationale: 分詞が表す継続的な認識を、自然な日本語の現在表現で訳した。
- source_word: כִּי
  choice: ……ことを
  rationale: 神が知っている内容を導く補文標識として、日本語の文構造に合わせた。
- source_word: בְּיוֹם
  choice: 日に
  rationale: 原文の時間表現を保ちつつ、ここでは必ずしも二十四時間の一日を限定せず、食べる時を指し得る表現とした。
- source_word: אֲכָלְכֶם מִמֶּנּוּ
  choice: あなたがたがそれを食べる
  rationale: 二人称複数を明示し、対象となる木の実を自然な日本語で「それ」と受けた。
- source_word: וְנִפְקְחוּ עֵינֵיכֶם
  choice: あなたがたの目が開かれ
  rationale: ニファル形の受動的な形と、認識・自覚を表す比喩の両方を保持した。
- source_word: וִהְיִיתֶם
  choice: ……者になる
  rationale: 状態への移行を文脈に即して明確にし、後続する分詞句と自然につないだ。
- source_word: כֵּאלֹהִים
  choice: 神のように
  rationale: 直近の文脈で אֱלֹהִים が神を指すことを踏まえた主要訳。ただし語形上可能な複数・神的存在の読みは脚注に残した。
- source_word: יֹדְעֵי
  choice: 知る者
  rationale: 複数分詞が主語である二人を述べる構造を保ち、「善と悪」の認識を担う者という意味を明瞭にした。
- source_word: טוֹב וָרָע
  choice: 善と悪
  rationale: 道徳的意味と識別に関わる含意を保つ、簡潔で定着した日本語表現を採用した。
theological_decisions:
- issue: כֵּאלֹהִים における אֱלֹהִים の指示対象
  choice: 神のように
  alternative: 神々のように／神的な存在のように
  rationale: この節前半の אֱלֹהִים は単数の神を指し、物語でも善悪を知ることが神との類似として語られるため、本文では「神」を採用した。ただしヘブライ語に実在する意味上の曖昧さは脚注で明示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、蛇の説明・理由づけとしての荘重さを保った。「というのも……からだ」で原文の二つの כִּי の機能を日本語として無理なく表現し、二人称複数は「あなたがた」で明示した。
