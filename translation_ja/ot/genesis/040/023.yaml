  text: וְ/לֹֽא זָכַ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת יוֹסֵ֖ף וַ/יִּשְׁכָּחֵֽ/הוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/023.yaml
  text: But the chief cupbearer did not remember Joseph[a], but forgot him.
translation:
  language: ja
  text: しかし、献酌官長はヨセフのことを思い出さず[a]、彼を忘れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「そして、献酌官長はヨセフのことを思い出さず、彼を忘れた」。
    reason: 冒頭の接続詞 וְ は、文脈上の対比を表す「しかし」とも、単純な連続を表す「そして」とも訳せるため。
lexical_decisions:
- source_word: וְ/לֹא
  choice: しかし……ず
  rationale: 前節でヨセフの解き明かしが実現したことを受けつつ、期待に反する展開へ転じる接続を自然な日本語で示す。
- source_word: זָכַר
  choice: 思い出す
  rationale: 基本義を保ち、ヨセフのために行動しなかったという含意を本文で過度に説明しない。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 献酌官長
  rationale: 王に酒を供する宮廷職の長を指す称号として、簡潔で品位ある表現を採る。
- source_word: אֶת יוֹסֵף
  choice: ヨセフのことを
  rationale: 目的格標識は独立して訳さず、日本語では「思い出す」の対象を「のことを」で自然に示す。
- source_word: וַיִּשְׁכָּחֵהוּ
  choice: 彼を忘れてしまった
  rationale: 「思い出さなかった」を言い換えて強調するヘブライ語の反復を保持し、「しまった」で結果として忘れた状態を自然に表す。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、宮廷職名には聖書叙述にふさわしい「献酌官長」を採用した。原文の「思い出さず／忘れた」という強調的反復を残した。
