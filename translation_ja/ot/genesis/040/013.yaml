source:
  edition: WLC
  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת רֹאשֶׁ֔/ךָ וַ/הֲשִֽׁיבְ/ךָ֖ עַל כַּנֶּ֑/ךָ וְ/נָתַתָּ֤ כוֹס פַּרְעֹה֙ בְּ/יָד֔/וֹ כַּ/מִּשְׁפָּט֙ הָֽ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽ/הוּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/013.yaml
  text: In three more days Pharaoh will lift up your head and restore you to your position[a], and you will place Pharaoh’s cup into his hand, according to the former custom when you were his cupbearer.
translation:
  language: ja
  text: あと三日たつと、ファラオはあなたの頭を上げ[a]、あなたを元の地位に戻す。あなたは、かつて献酌官であった時の慣例どおり、ファラオの杯をファラオの手に渡す。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたの頭を上げる」。ここでは、好意を示して元の地位に戻すことを表す慣用句。同じ表現が19節では対照的な意味合いで用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: あと三日たつと
  rationale: 残る期間を示す表現を、出来事までさらに三日あるという自然な日本語で表した。
- source_word: יִשָּׂא ... אֶת רֹאשֶׁךָ
  choice: あなたの頭を上げ
  rationale: この箇所では好意的な取り計らいを表す慣用句だが、19節との意図的な対応を保つため、字義的な比喩表現を本文に残した。
- source_word: וַהֲשִׁיבְךָ עַל כַּנֶּךָ
  choice: あなたを元の地位に戻す
  rationale: כֵּן が宮廷における定まった持ち場・職位を指すため、明瞭な現代日本語とした。
- source_word: וְנָתַתָּ כוֹס פַּרְעֹה בְּיָדוֹ
  choice: ファラオの杯をその手に渡す
  rationale: 献酌官が杯を王の手に置く具体的な奉仕動作を、自然な日本語で保持した。
- source_word: כַּמִּשְׁפָּט הָרִאשׁוֹן
  choice: かつての慣例どおり
  rationale: מִשְׁפָּט はここでは以前の定まった手順・慣例を意味するため。
- source_word: אֲשֶׁר הָיִיתָ מַשְׁקֵהוּ
  choice: かつて献酌官であった時
  rationale: מַשְׁקֶה を単なる給仕行為ではなく宮廷の職名として訳した。
theological_decisions:
- issue: 「頭を上げる」という表現の解釈
  choice: 慣用句を本文に残し、続く復職の句と脚注で好意的意味を示す
  alternative: 「あなたを取り立て」と意味を本文で明示する
  rationale: 同じ表現が19節で不吉な付加句とともに用いられる文学的対照を保持しつつ、この節での肯定的意味も読者に伝えるため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「献酌官」は宮廷職名として正確であり、文脈から理解できる。ヘブライ語の文学的反復を保つため「頭を上げる」を維持した。
