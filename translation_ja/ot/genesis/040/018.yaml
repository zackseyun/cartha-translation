base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/018.yaml
  text: 'Joseph answered and said, “This is its interpretation: the three baskets are three days.”'
translation:
  language: ja
  text: ヨセフは答えて言った。「その解き明かしはこうです。三つの籠は三日です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 答えて
  rationale: 物語の対話で返答を導入する動詞であり、直前のパン職人長の夢の語りに対する応答として自然かつ簡潔に表した。
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ヘブライ語の二重の発話導入句「答えて言った」を保ち、原文の形式を明瞭な日本語で再現した。
- source_word: פִּתְרֹנוֹ
  choice: その解き明かし
  rationale: 夢の象徴を説明する文脈であるため、「意味」よりも夢の解釈を指すことが明確な「解き明かし」を選んだ。接尾辞の指示も「その」で保持した。
- source_word: שְׁלֹשֶׁת הַסַּלִּים
  choice: 三つの籠
  rationale: סַלの基本的意味を簡潔に表した。材質や編み方は本文で明示されないため付加しなかった。
- source_word: שְׁלֹשֶׁת יָמִים הֵם
  choice: 三日です
  rationale: 原文の無動詞同定文「それらは三日」を、日本語として自然な象徴的同定の形で表した。「三日を意味します」と説明的に言い換えず、原文の直接性を保った。
theological_decisions: []
