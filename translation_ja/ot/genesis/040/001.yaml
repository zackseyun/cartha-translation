  text: וַ/יְהִ֗י אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה חָֽטְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ מִצְרַ֖יִם וְ/הָ/אֹפֶ֑ה לַ/אֲדֹנֵי/הֶ֖ם לְ/מֶ֥לֶךְ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/001.yaml
  text: After these things[a], the cupbearer of the king of Egypt and the baker sinned against their master, the king of Egypt.
translation:
  language: ja
  text: これらの出来事の後[a]、エジプト王の献酌官とパン職人が、彼らの主人であるエジプト王に罪を犯した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これらのことの後」。ヘブライ語の物語上の定型表現をより直訳すると、「これらのことの後、こういうことがあった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: これらの出来事の後
  rationale: 物語を次の場面へ移す定型表現。וַיְהִי を日本語で逐語的に「そして、…ということがあった」とせず、自然な時間表現にした。「出来事」は דְּבָרִים が文脈上指す内容を明確にする。
- source_word: מַשְׁקֵה
  choice: 献酌官
  rationale: 王の飲み物を取り扱う宮廷の役職を指す。単なる「給仕」より職務上の地位を示し、後続文脈にも適する。
- source_word: הָאֹפֶה
  choice: 料理人
  rationale: 定冠詞を伴う「焼く者、パンを作る者」。古代宮廷の役職として、日本語で理解しやすい「料理人」を採用した。ただし、より限定的には「パン職人」とも訳せる。
- source_word: חָטְאוּ ... לַאֲדֹנֵיהֶם
  choice: 彼らの主人に罪を犯した
  rationale: חטא の道徳的・関係的な強さと、ל が示す被害・対立の相手を保つ。「過ちを犯した」では意味を弱める可能性がある。
- source_word: לְמֶלֶךְ מִצְרָיִם
  choice: エジプト王
  rationale: 「彼らの主人」を同格的に特定する句。原文どおり王を再度明示し、誰に対する罪かを強調する。
theological_decisions:
- issue: חָטְאוּ を宗教的な意味に限定するか
  choice: 「罪を犯した」とし、王に対する重大な違反という広がりを残す
  alternative: 「不届きを働いた」「過ちを犯した」
  rationale: 語は「罪を犯す」のほか、相手に対して違反・不正を行う意味を持つ。ここでは具体的な罪状が示されないため、内容を補わず、原語の強い表現を保持した。
translation_notes:
  register: 明瞭で格調のある現代標準語。「献酌官」は一般語ではないが、宮廷職を正確かつ簡潔に示す伝統的な聖書用語として採用した。「彼らの主人である」により、同格関係を自然な日本語で表した。
