id: GEN.40.5
reference: Genesis 40:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּֽחַלְמוּ֩ חֲל֨וֹם שְׁנֵי/הֶ֜ם אִ֤ישׁ חֲלֹמ/וֹ֙ בְּ/לַ֣יְלָה אֶחָ֔ד אִ֖ישׁ כְּ/פִתְר֣וֹן חֲלֹמ֑/וֹ הַ/מַּשְׁקֶ֣ה וְ/הָ/אֹפֶ֗ה אֲשֶׁר֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁ֥ר אֲסוּרִ֖ים בְּ/בֵ֥ית הַ/סֹּֽהַר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/005.yaml
  text: And the two of them dreamed a dream[a], each man his own dream, in one night, each according to the interpretation of his dream—the cupbearer and the baker who belonged to the king of Egypt[d][c][b], who were confined in the prison house.
translation:
  language: ja
  text: 監獄に収監されていた、エジプト王に仕える献酌官とパン焼き役の二人は、同じ夜に、それぞれ自分の夢、すなわちそれぞれの夢にふさわしい解き明かしを伴う夢を見た[a][b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「夢を夢見た」。ヘブライ語は同根の動詞と名詞を重ねている。
    reason: 原文の同根語表現を示すため。
  - marker: b
    text: 「同じ夜に」は直訳では「一つの夜に」。
    reason: 時間句の字義と、二人が同じ夜に夢を見たという意味を示すため。
  - marker: c
    text: 別訳「それぞれの夢には、それぞれ固有の解き明かしがあった」。また、「エジプト王に仕える」は、王への所属または公的な奉仕関係を示す。
    reason: 夢と解き明かしの対応を表す句、および王との関係を表す前置詞 לְ の表現上の幅を示すため。
lexical_decisions:
- source_word: וַיַּחַלְמוּ חֲלוֹם
  choice: 夢を見た
  rationale: ヘブライ語は同根語を重ねて直訳すれば「夢を夢見た」となるが、日本語では不自然なため、通常の表現「夢を見た」とし、原文の語法は脚注に示した。
- source_word: שְׁנֵיהֶם
  choice: 二人
  rationale: 直前の二人の男性官吏を指すため、双数的な意味を簡潔に明示した。
- source_word: אִישׁ חֲלֹמוֹ
  choice: それぞれ自分の夢
  rationale: אִישׁ の配分的用法と、各人の夢が別個であることを自然な現代日本語で表した。
- source_word: בְּלַיְלָה אֶחָד
  choice: 一夜のうちに
  rationale: 直訳的な「一つの夜に」の意味を保ちつつ、二人が同じ夜に夢を見たことが自然に伝わる表現とした。
- source_word: אִישׁ כְּפִתְרוֹן חֲלֹמוֹ
  choice: それぞれの夢には、それに応じた解き明かしがあった
  rationale: כְּ の対応・適合の意味を「それに応じた」で表し、各夢が固有の解釈を伴うという原文の含みを保った。
- source_word: הַמַּשְׁקֶה
  choice: 献酌官
  rationale: 王に飲み物を供する宮廷官職を表す、簡潔で定着した聖書日本語を用いた。「長」はこの節に明記されないため加えなかった。
- source_word: הָאֹפֶה
  choice: パン焼き役
  rationale: パンなどを焼く職務を表す語として、現代の読者にも意味が分かる表現を採用した。「長」は原文にないため加えなかった。
- source_word: אֲשֶׁר לְמֶלֶךְ מִצְרַיִם
  choice: エジプト王付きの
  rationale: לְ が示す王への所属・職務上の結び付きを、機能を過度に限定せず簡潔に表した。
- source_word: אֲסוּרִים בְּבֵית הַסֹּהַר
  choice: 牢獄に拘禁されていた
  rationale: אסר の「縛る／拘禁する」という受動的意味と、牢獄内に置かれていた状況を明確な現代日本語で表した。
theological_decisions:
- issue: 各夢とその解き明かしの関係
  choice: それぞれの夢には、それに応じた解き明かしがあった
  alternative: それぞれ、その夢の解き明かしどおりの夢を見た
  rationale: 原文の簡潔な句は、夢がそれぞれ固有の解釈に対応していたことを示すが、その解釈が夢の中で既に与えられたとまでは明記しない。時間的・神学的な説明を補わず、対応関係だけを表した。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、宮廷官職には簡潔で品位のある「献酌官」を用いた。「獄屋」のような過度に古風な直訳は避け、「牢獄」「拘禁」で原文の拘束状態を明示した。原文の反復は、日本語本文では不自然にならないよう整理し、その語感を脚注で保存した。
