  rationale: 官吏二人を文の主語として原文の同格関係を自然な日本語で再現した。「同じ夜に」により時間句を明瞭にしつつ、字義は注で保持した。解き明かしについては、夢との対応だけを本文に表し、解き明かしがその時点で示されたという含意を避けた。
