  yaml_path: translation/ot/genesis/040/007.yaml
  text: So he asked Pharaoh’s officials who were with him in custody in his master’s house[a], saying[b], “Why are your faces downcast today?”
translation:
  language: ja
  text: そこでヨセフは、主人の家でヨセフと共に拘留されていたファラオの役人たち[a]に尋ねた。「今日は、どうして沈んだ顔をしているのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ファラオの宦官たち」とも訳せる。ヘブライ語は、文字どおりの宦官を指すことも、広く王宮の高官を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: そこでヨセフは……尋ねた
  rationale: 物語を進めるワウ継続法を自然な日本語の接続で表し、文脈上の主語ヨセフを明示した。
- source_word: סְרִיסֵי פַרְעֹה
  choice: ファラオの廷臣たち
  rationale: סָרִיסは宦官そのものにも宮廷の高官にもなり得る。ここでは職務上の身分が中心なので「廷臣」を本文に採用し、語義の幅を脚注に残した。
- source_word: אֲשֶׁר אִתּוֹ בְמִשְׁמַר
  choice: 自分と共に拘留されていた
  rationale: אִתּוֹの関係を保ちつつ、מִשְׁמָרが示す拘禁状態を明瞭な現代日本語で表した。
- source_word: בֵּית אֲדֹנָיו
  choice: 主人の家で
  rationale: אֲדֹנָיוは文脈上ヨセフの主人を指す。「家」は邸宅・家産に属する拘禁場所を含み得るため、そのまま保持した。
- source_word: לֵאמֹר
  choice: 尋ねた。「……」
  rationale: 引用を導く定型表現は、日本語では独立した「言って」を置かず、発話動詞と直接話法で自然に表した。
- source_word: מַדּוּעַ פְּנֵיכֶם רָעִים הַיּוֹם
  choice: 今日は、どうして沈んだ顔をしているのですか
  rationale: 直訳的には「なぜ今日、あなたがたの顔は悪いのか」だが、顔つきが悲しげ・憂うつであるという慣用的意味を「沈んだ顔」で表した。
