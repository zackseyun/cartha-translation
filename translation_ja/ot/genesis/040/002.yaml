  yaml_path: translation/ot/genesis/040/002.yaml
  text: And Pharaoh was angry with his two officials[b][a], with the chief cupbearer and with the chief baker.
translation:
  language: ja
  text: ファラオは二人の宮廷役人[a]、すなわち献酌官の長とパン焼き職人の長に腹を立てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二人の宦官」とも訳せる。ヘブライ語は文脈によって「宮廷役人」を意味することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: 腹を立てた
  rationale: קצףの怒りを表しつつ、物語文として自然な現代日本語にした。「激怒した」ほど強度を限定しない。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: 古代エジプト王の称号として、日本語聖書および一般用法で定着した表記。
- source_word: שְׁנֵי סָרִיסָיו
  choice: 二人の家臣
  rationale: סָרִיסは宦官を指す場合も宮廷の役人を指す場合もある。ここでは直後に宮廷職が明示されるため、身体的地位を断定せず王に仕える者を表す「家臣」とした。語義の幅は脚注に残した。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 献酌官の長
  rationale: 王に飲み物を供する者たちの長という職務と階層を簡潔に示す。日本語では「献酌官」がやや専門的だが、古代宮廷の役職名として正確で簡潔。
- source_word: שַׂר הָאוֹפִים
  choice: 料理人の長
  rationale: אפהは基本的に焼くこと、אֹפִיםはパン焼き職人を指すが、宮廷職として日本語で不自然に狭く響かないよう「料理人の長」とした。
- source_word: עַל ... עַל ... וְעַל
  choice: 二人の家臣、すなわち…と…に
  rationale: 怒りの対象を示す前置詞の反復を、日本語では同格関係が明瞭になるよう「すなわち」で表現した。三者ではなく、後二者が「二人の家臣」の内訳であることを示す。
