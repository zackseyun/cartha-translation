  register: 明快で格調を保った現代標準日本語。冒頭の接続辞は単独節として不自然になるため明示せず、ヘブライ語の連続叙述は日本語の文脈で担わせた。「すなわち」により二人の家臣と二つの役職の同格関係を明示した。
