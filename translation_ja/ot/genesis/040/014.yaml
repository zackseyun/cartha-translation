  text: כִּ֧י אִם זְכַרְתַּ֣/נִי אִתְּ/ךָ֗ כַּ/אֲשֶׁר֙ יִ֣יטַב לָ֔/ךְ וְ/עָשִֽׂיתָ נָּ֥א עִמָּדִ֖/י חָ֑סֶד וְ/הִזְכַּרְתַּ֨/נִי֙ אֶל פַּרְעֹ֔ה וְ/הוֹצֵאתַ֖/נִי מִן הַ/בַּ֥יִת הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/014.yaml
  text: But if you remember me when it goes well for you[a], please show kindness to me, and mention me to Pharaoh[b], and bring me out of this house.
translation:
  language: ja
  text: しかし、あなたの身の上がよくなったときには、私のことを覚えていて、どうか私に親切にしてください。そして、ファラオに私のことを伝え、この家から私を出してください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この家」は、ヨセフが閉じ込められていた場所を指す。
    reason: 原文の「家」を保ちつつ、その文脈上の指示対象を明らかにするため。
lexical_decisions:
- source_word: כִּי אִם
  choice: ただ
  rationale: 前節を受けて強い願いを切り出す表現。後続の条件節と合わせ、現代日本語で自然な逆接的限定を表す。
- source_word: זְכַרְתַּנִי אִתְּךָ
  choice: 私のことを心に留め
  rationale: 直訳的な「あなたと共に私を覚える」は日本語では不自然なため、אִתְּךָの個人的に心に掛ける含みを「心に留め」で表した。
- source_word: כַּאֲשֶׁר יִיטַב לָךְ
  choice: あなたの身の上が良くなった時には
  rationale: 献酌官の復職と境遇の好転を指す。単なる気分ではなく、身の上が好転する意味を明確にした。
- source_word: וְעָשִׂיתָ נָּא עִמָּדִי חָסֶד
  choice: どうか私に恵みを示してください
  rationale: נָאの懇願を「どうか」で表し、חֶסֶדはこの個人的な依頼における親切で好意的な行為として「恵み」と訳した。
- source_word: וְהִזְכַּרְתַּנִי אֶל פַּרְעֹה
  choice: ファラオに私のことを話し
  rationale: ヒフィル形がここではヨセフをファラオの注意に上らせることを意味するため、自然な日本語で「私のことを話し」とした。
- source_word: וְהוֹצֵאתַנִי
  choice: 私を出してください
  rationale: יצאのヒフィル形の使役的意味を保ちつつ、願いとして自然な日本語にした。
- source_word: מִן הַבַּיִת הַזֶּה
  choice: この家から
  rationale: 原文のבַּיִתを「家」として保持し、拘禁施設を指す文脈上の意味は脚注で補った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある依頼の言葉とした。ヨセフの切実さは「どうか」と丁寧な命令形で表現し、過度に古風な語法は避けた。
