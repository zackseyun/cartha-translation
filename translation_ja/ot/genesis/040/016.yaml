  source_fidelity: ヘブライ語の内容を適切に伝えている。שַׂר הָאֹפִים は「パン焼き役の長」、כִּי טוֹב פָּתָר は解釈の評価を限定しない「よい解き明かし」、אַף אֲנִי は「私も」とされている。夢の報告として省略的な בַּחֲלֹמִי を「夢を見ました」と補うのも自然である。וׄהִנֵּה の導入も「見ると」により無理なく表現され、三つの籠が頭の上にあるという位置関係も保持されている。
