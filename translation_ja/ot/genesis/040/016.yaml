  terminology: ヨセフの表記は日本語で定着した自然な音写である。「解き明かし」は夢の解釈という文脈に適切。語義が不確かな חֹרִי を本文では伝統的な「白いパン」としつつ、脚注で内容物説と籠の形状説の双方を明記しており、本文の採用を過度に確定的なものにしていない。
