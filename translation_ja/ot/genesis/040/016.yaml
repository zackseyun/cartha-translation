source:
  edition: WLC
  text: וַ/יַּ֥רְא שַׂר הָ/אֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַ/יֹּ֨אמֶר֙ אֶל יוֹסֵ֔ף אַף אֲנִי֙ בַּ/חֲלוֹמִ֔/י וְ/הִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל רֹאשִֽׁ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/016.yaml
  text: When the chief baker saw that he had interpreted well[a], he said to Yoseph, “I also had a dream, and behold, three baskets of white bread were on my head.”
translation:
  language: ja
  text: パン焼き役の長は、ヨセフがよい解き明かしをしたのを見て、ヨセフに言った。「私も夢を見ました。見ると、頭の上に白いパンを入れた籠が三つありました[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「白いパンを入れた籠」のヘブライ語は意味が不確かで、「焼いた食べ物を入れた籠」とも、籠そのものを「目の粗い籠」または「編み籠」と説明しているとも考えられます。
    reason: חֹרִי の語義が不確かで、籠の中身を指す解釈と籠の形状を指す解釈があるため。
lexical_decisions:
- source_word: שַׂר הָאֹפִים
  choice: パン焼き役の長
  rationale: שַׂר は職務上の長、הָאֹפִים はパンを焼く者たちを指す。「パン焼き役の長」は宮廷の役職であることを保ちつつ、現代日本語で役割が明確に伝わる。
- source_word: כִּי טוֹב פָּתָר
  choice: ヨセフがよい解き明かしをしたのを
  rationale: טוֹב の評価を「好都合に」と限定せず、「よい」として残した。解釈が的確だったことと、内容が好ましかったことの両方を含み得る。
- source_word: אַף אֲנִי בַּחֲלוֹמִי
  choice: 私も夢を見ました
  rationale: ヘブライ語は省略を含む夢語りの表現であるため、日本語では自然に補って訳し、אַף אֲנִי の追加・強調を「私も」で表した。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 夢の中の光景を生き生きと導入する機能を、現代日本語の物語表現「見ると」で示した。
- source_word: שְׁלֹשָׁה סַלֵּי חֹרִי
  choice: 白いパンを入れた籠が三つ
  rationale: חֹרִי を伝統的理解に従って白いパンないし菓子類と捉え、籠と内容物の関係が日本語で誤解されないよう「入れた」を補った。ただし語義は不確かなので別解を脚注に残した。
- source_word: עַל רֹאשִׁי
  choice: 頭の上に
  rationale: 単純な位置関係を自然で明確な日本語にした。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: ヘブライ語名 יוֹסֵף の一般的な日本語音写を用いた。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、夢の報告としての簡潔さと物語の品位を保った。「見よ」の直訳は避け、同じ談話機能を持つ「見ると」を採用した。
