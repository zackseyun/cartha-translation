base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/020.yaml
  text: And on the third day[a], Pharaoh’s birthday, he made a feast for all his servants, and he lifted up the head of the chief cupbearer and the head of the chief baker among his servants.
translation:
  language: ja
  text: さて、三日目、すなわちファラオの誕生日に、ファラオはすべての家臣のために宴を催し、家臣たちの中で、献酌官長とパン焼き長の頭を上げた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「頭を上げた」。ここでは「取り上げた」「処遇を決めた」といった意味に理解できる。この表現は、前後の物語で二人の異なる結末を語る際の言葉の掛け合わせにもなっている。
    reason: ヘブライ語の慣用句を本文で保ち、その解釈上の幅と物語内の語法上のつながりを、結論を決めつけずに示すため。
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַשְּׁלִישִׁי
  choice: さて、三日目は……であった
  rationale: 物語の進行を示す וַיְהִי を、現代日本語で自然な場面転換として表し、時を示す句を明確に保った。
- source_word: יוֹם הֻלֶּדֶת אֶת־פַּרְעֹה
  choice: ファラオの誕生日
  rationale: 字義は「ファラオが生まれた日」。現代日本語では「誕生日」が簡潔で自然である。
- source_word: וַיַּעַשׂ מִשְׁתֶּה
  choice: 宴を催し
  rationale: מִשְׁתֶּה は飲食を伴う宴を指す。「宴を催す」は王宮の場面にふさわしい自然で格調ある表現である。
- source_word: לְכָל עֲבָדָיו
  choice: すべての家臣のために
  rationale: עֶבֶד は僕、廷臣、役人を広く表し得る。王宮の文脈では、身分を不必要に奴隷へ限定しない「家臣」が自然である。
- source_word: וַיִּשָּׂא אֶת־רֹאשׁ
  choice: 頭を上げた
  rationale: 直訳的な慣用句を保持した。13節と19節で同じ表現が正反対の結末に結び付く文学的な掛け合わせを残すためである。意味の取り方は脚注で補った。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 献酌官長
  rationale: 王の飲み物を扱う者たちの長という宮廷職を、簡潔な伝統的日本語で示した。
- source_word: שַׂר הָאֹפִים
  choice: 料理官長
  rationale: אֹפִים は字義的には「焼く者たち」だが、王宮の食物調理を担う職の長を指すため、「料理官長」とした。
- source_word: בְּתוֹךְ עֲבָדָיו
  choice: 家臣たちの中で
  rationale: 王の家臣たちが居合わせる公の場での行為であることを示す位置句を保持した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、王宮物語にふさわしい簡潔で品位ある文体とした。「頭を上げた」は意図的に字義を保持し、曖昧さと文学的効果を脚注で支えた。
