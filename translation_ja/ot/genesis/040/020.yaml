  naturalness: 文章は明瞭で自然である。「三日目はファラオの誕生日であった」よりも、「三日目、すなわちファラオの誕生日に」として出来事の時を直接示すほうが、原文の叙述と現代日本語の流れの双方に適する。
  terminology: 「ファラオ」「献酌官長」「家臣」は文脈に適切である。「料理官長」は「パン焼き長」に改め、原語の具体性と二人の宮廷官吏の対照を保つ。脚注は、慣用句の意味を一義に決めず、物語上の言葉の掛け合わせを正確に説明する。
