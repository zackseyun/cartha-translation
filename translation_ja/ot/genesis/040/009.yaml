  text: וַ/יְסַפֵּ֧ר שַֽׂר הַ/מַּשְׁקִ֛ים אֶת חֲלֹמ֖/וֹ לְ/יוֹסֵ֑ף וַ/יֹּ֣אמֶר ל֔/וֹ בַּ/חֲלוֹמִ֕/י וְ/הִנֵּה גֶ֖פֶן לְ/פָנָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/009.yaml
  text: So the chief cupbearer told his dream to Joseph and said to him[a], “In my dream, behold, a vine was before me.”
translation:
  language: ja
  text: そこで、献酌官長は自分の夢をヨセフに語り、彼に言った。「夢の中で、見ると、私の前に一本のぶどうの木があった。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「夢の中で、見よ、私の前に一本のぶどうの木があった」。ヘブライ語の וְהִנֵּה は、夢の光景を生き生きと提示する注意喚起の語。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 語り
  rationale: ピエル形の「詳しく語る、物語る」を自然な現代日本語で表し、夢の内容を伝える文脈にも合う。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 献酌官の長
  rationale: 王に飲み物を供する役人の長を指す。歴史的な宮廷職としての性格を保ちつつ、日本語の聖書文体でも理解可能な表現とした。
- source_word: אֶת חֲלֹמוֹ
  choice: 自分の夢を
  rationale: 三人称男性単数接尾辞を、主語との関係が明瞭な日本語の再帰表現で示した。
- source_word: לְיוֹסֵף
  choice: ヨセフに
  rationale: 前置詞 לְ が示す語りかけの相手を助詞「に」で表した。
- source_word: וַיֹּאמֶר לוֹ
  choice: 彼に言った
  rationale: 原文に明示された לוֹ「彼に」を省かず保持した。文脈上「彼」はヨセフを指す。
- source_word: בַּחֲלוֹמִי
  choice: 夢の中で
  rationale: 直訳的な「私の夢の中で」は日本語では後続の一人称表現と重複感があるため、自然な「夢の中で」とした。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 夢の像を鮮やかに導入する注意喚起標識を、現代日本語の物語で自然に機能する「見ると」で表した。単なる存在文には平板化しなかった。
- source_word: גֶפֶן
  choice: 一本のぶどうの木
  rationale: 文脈上は実を結ぶ葡萄樹を指すため、「つる」より像が明瞭な「ぶどうの木」とし、可算的な一個体を「一本」で示した。
- source_word: לְפָנָי
  choice: 私の前に
  rationale: 空間的な意味「私の前に」を直接保持し、日本語に必要な存在述語「あった」を補った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、宮廷職名には dignified な「献酌官」を採用した。「見よ」は現代語では強く古風なため本文では「見ると」とし、その提示機能と直訳を脚注で示した。
