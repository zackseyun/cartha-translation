translation:
  language: ja
  text: そのぶどうの木には三本の枝[a]がありました。その木が芽を出すと、花が咲き[b]、その房は熟して、ぶどうの実になりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「三本のつる」または「三本の若枝」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語を直訳すると、「それが芽を出しているとき、その花が現れた」。芽吹きから開花へ急速に進む様子を描いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַגֶּפֶן
  choice: そのぶどうの木には
  rationale: 前置詞を日本語の植物描写として自然な「には」で表し、文脈上既知の木なので「その」を添えた。
- source_word: שָׂרִיגִם
  choice: 枝
  rationale: ぶどうの木から伸びる枝・若枝を指す。本文では最も広く理解される「枝」とし、より限定的な候補は脚注に残した。
- source_word: כְפֹרַחַת
  choice: 芽を出すと
  rationale: 分詞を伴う表現が示す成長段階と、その後の急速な展開を自然な時系列で表した。
- source_word: עָלְתָה נִצָּהּ
  choice: 花を咲かせ
  rationale: 直訳的には「その花が上がった／現れた」。日本語では、ぶどうの木を主語とする「花を咲かせ」が明瞭で自然である。
- source_word: הִבְשִׁילוּ אַשְׁכְּלֹתֶיהָ עֲנָבִים
  choice: 房にはぶどうの実が熟しました
  rationale: 房とぶどうの実の関係を日本語で自然に示しつつ、完熟へ進む夢の描写を保った。
