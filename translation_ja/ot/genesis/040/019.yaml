  text: בְּ/ע֣וֹד שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת רֹֽאשְׁ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/תָלָ֥ה אוֹתְ/ךָ֖ עַל עֵ֑ץ וְ/אָכַ֥ל הָ/ע֛וֹף אֶת בְּשָׂרְ/ךָ֖ מֵ/עָלֶֽי/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/019.yaml
  text: In three more days Pharaoh will lift up your head from upon you and hang you on a tree[b][a], and the birds will eat your flesh from upon you.
translation:
  language: ja
  text: あと三日すると、ファラオはあなたの頭を上げ、あなたの体から取り去る[a]。そしてあなたを木に掛ける[b]。鳥があなたの体から肉を食べる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたの頭をあなたの上から上げる」。献酌官長について語った13節の「頭を上げる」と同じ表現を用いた不気味な言葉遊びで、ここでは頭が体から取り去られることを示すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「木の上につるす」、または「木製の柱・杭に掛ける（さらす）」「杭に刺し通す」とも訳せる。ヘブライ語は「木に」。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעוֹד שְׁלֹשֶׁת יָמִים
  choice: あと三日たつと
  rationale: 残る三日という時間幅を、現代日本語で自然かつ明確に表した。
- source_word: יִשָּׂא פַרְעֹה אֶת רֹאשְׁךָ מֵעָלֶיךָ
  choice: ファラオはあなたの頭をあなたの体から上げ
  rationale: 13節の肯定的な「頭を上げる」との不気味な語呂合わせを残しつつ、מֵעָלֶיךָ によってここでは頭を体から取り去る処刑の意味になることを示した。「首をはねる」と断定すれば意味は明快になるが、原文の文学的な反転が失われる。
- source_word: וְתָלָה אוֹתְךָ עַל עֵץ
  choice: あなたを木に掛ける
  rationale: תלה の「掛ける／つるす」と עֵץ の「木」を直接反映した。具体的な処刑方法が絞り切れないため、本文では「杭に刺す」などと限定しなかった。
- source_word: וְאָכַל הָעוֹף אֶת בְּשָׂרְךָ מֵעָלֶיךָ
  choice: 鳥が、あなたの肉をその身から食い取る
  rationale: 集合的単数 הָעוֹף を日本語では自然な総称の「鳥」とし、בְּשָׂרְךָ の具体的な「肉」を保った。末尾の מֵעָלֶיךָ は、吊るされた体から肉が食い取られる情景として自然に表現した。
theological_decisions:
- issue: 処刑の情景と「頭を上げる」という反転表現をどこまで明示するか
  choice: 「頭をあなたの体から上げ」と訳し、原文の語呂合わせと残酷な情景を併せて残す。
  alternative: 「あなたの首をはね、その体を杭に掛ける」と意味を明示する。
  rationale: 文脈は死刑を明確に示すが、具体的に斬首と断定するより、13節と同じ表現が逆の意味に転じる文学的緊張を保存するのが適切である。
- issue: עֵץ が指す処刑具
  choice: 本文では広い意味を保つ「木」とする。
  alternative: 「柱」「杭」または「木の柱」とする。
  rationale: עֵץ は木、木材、木製の処刑具を指し得る。吊るすのか杭にさらすのかという具体像を本文で一つに固定せず、脚注で可能性を示す。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、死刑宣告の厳粛さと原文の生々しさを弱めないようにした。「あなたの体から上げ」は意図的にやや異様な言い回しとし、13節との語句の反復を認識できる形にしている。
