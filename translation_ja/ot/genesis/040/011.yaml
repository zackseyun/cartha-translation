  text: וְ/כ֥וֹס פַּרְעֹ֖ה בְּ/יָדִ֑/י וָ/אֶקַּ֣ח אֶת הָֽ/עֲנָבִ֗ים וָֽ/אֶשְׂחַ֤ט אֹתָ/ם֙ אֶל כּ֣וֹס פַּרְעֹ֔ה וָ/אֶתֵּ֥ן אֶת הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/011.yaml
  text: Pharaoh’s cup was in my hand[a], and I took the grapes and squeezed them into Pharaoh’s cup[c][b], and I placed the cup into Pharaoh’s hand.
translation:
  language: ja
  text: ファラオの杯が私の手にありました。私はぶどうを取り、それを搾り、その汁をファラオの杯に注ぎ、その杯をファラオの手に渡しました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「その杯をファラオの手のひらの上に置きました」。
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: 杯
  rationale: 飲み物を入れる器を表す一般語。宮廷の場面にふさわしく、現代日本語でも自然な「杯」とした。
- source_word: בְּיָדִי
  choice: 私の手にありました
  rationale: 夢の中の情景を具体的に保ちつつ、日本語として自然に表現した。
- source_word: וָאֶקַּח אֶת הָעֲנָבִים
  choice: 私はぶどうを取り
  rationale: לקח の基本的な意味と物語の動作の連続を簡潔に表した。
- source_word: וָאֶשְׂחַט אֹתָם אֶל כּוֹס פַּרְעֹה
  choice: それを搾ってファラオの杯に入れ
  rationale: שׂחט はここで、ぶどうから汁を搾り出す動作を指す。「搾って…入れ」は、液体が杯に入ることを自然に伝える。
- source_word: וָאֶתֵּן אֶת הַכּוֹס עַל כַּף פַּרְעֹה
  choice: その杯をファラオの手に渡しました
  rationale: 直訳的には「ファラオの手のひらの上に置いた」だが、杯を手渡す動作を表す自然な日本語として「手に渡しました」とした。
