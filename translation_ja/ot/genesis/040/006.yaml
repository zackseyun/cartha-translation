  language: ja
  text: ヨセフは朝、彼らのところへ来て、彼らを見ると、彼らは沈んだ顔をしていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「悩んだ様子だった」「憂鬱そうだった」。ヘブライ語は、心の乱れや落胆が表情に現れている状態を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: 彼らのところへ来て
  rationale: בוא と方向を示す אֲלֵיהֶם を、物語の動きを保つ自然な現代日本語で表した。「入った」では場所を限定しすぎる。
- source_word: בַּבֹּקֶר
  choice: 朝
  rationale: 時を示す句を、簡潔で自然な日本語にした。
- source_word: וַיַּרְא אֹתָם
  choice: 彼らを見ると
  rationale: ראה の直接的な知覚を「見る」で保ちつつ、続く発見内容へ自然につないだ。
- source_word: וְהִנָּם
  choice: 見ると（構文に反映）
  rationale: 提示・注目を促す הִנֵּה の機能を、独立した「見よ」とせず、日本語の発見表現「見ると」に織り込んだ。
- source_word: זֹעֲפִים
  choice: 沈んだ顔をしていた
  rationale: 文脈上、内面的感情だけでなくヨセフに見て取れる陰鬱で悩ましげな様子を表す。語義を怒りに限定せず、視覚的状態を自然に示す。
