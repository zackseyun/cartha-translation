base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/012.yaml
  text: 'Then Joseph said to him[a], “This is its interpretation: the three branches are three days.”'
translation:
  language: ja
  text: そこでヨセフは彼に言った。「その解き明かしはこうです。三本の枝[a]は三日です。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ぶどうの枝」「巻きひげ」。
    reason: ヘブライ語 שָׂרִיג は、ぶどうの木の枝、若枝、または巻きひげを指し得るため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を前へ進めるワウ継続法の順接的な働きを、自然な現代日本語で表した。
- source_word: לוֹ
  choice: 彼に
  rationale: ヘブライ語の代名詞を保ち、本文では指示対象を「献酌官」と補わなかった。
- source_word: פִּתְרֹנוֹ
  choice: その解き明かし
  rationale: 夢の象徴を解釈することを指すため、文脈に即した明瞭で格調ある表現とした。三人称男性単数接尾辞は「その」で表した。
- source_word: שְׁלֹשֶׁת
  choice: 三本／三日
  rationale: 象徴とその意味を対応させる原文の反復構造を保持した。枝には日本語として自然な助数詞「本」を用いた。
- source_word: הַשָּׂרִגִים
  choice: 枝
  rationale: ぶどうの木の枝や若枝、巻きひげを指し得る語である。本文では最も明瞭で過度に限定しない「枝」とし、別訳の可能性を脚注に示した。
- source_word: יָמִים
  choice: 日
  rationale: 象徴が表す期間として、原語の時間名詞をそのまま訳した。
- source_word: הֵם
  choice: ……のことです
  rationale: 主語と述語の同定を表す独立代名詞の機能を、自然な日本語の説明表現で示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、ヨセフの説明には丁寧体を採用した。簡潔な夢解きの宣言と、三本の枝と三日の対応が明確になる語順を保った。
