  yaml_path: translation/ot/genesis/040/022.yaml
  text: But he hanged the chief baker[a], just as Joseph had interpreted to them.
translation:
  language: ja
  text: しかし、料理役の長は木に掛けられた[a]。ヨセフが二人に解き明かしたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「掛けた」。ヘブライ語の動詞は「掛ける」を意味し、絞首のほか、文脈によっては串刺し、または処刑後に遺体を木などに掛けてさらすことを指す場合もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: しかし、
  rationale: 接続詞は前節で献酌官が復職したこととの対照を示す。目的語標識は訳出せず、現代日本語として自然な「しかし」で談話上の対比を表した。
- source_word: שַׂר הָאֹפִים
  choice: 料理役の長
  rationale: שַׂר は宮廷の役職の長を指す。האֹפִים は字義的には「パンを焼く者たち」だが、王の食物を扱う役職として日本語聖書で理解しやすい「料理役」を用いた。
- source_word: תָּלָה
  choice: 木に掛けた
  rationale: 動詞の基本義「掛ける」を保ちつつ、処刑または処刑後のさらしを含み得る方法の曖昧さを残した。本文だけで絞首刑と断定しない。
- source_word: כַּאֲשֶׁר
  choice: とおり
  rationale: 出来事がヨセフの先の解釈に一致したことを自然に示す。
- source_word: פָּתַר
  choice: 解き明かした
  rationale: 夢の意味を解釈する文脈であり、現代日本語で明瞭かつ dignified な表現とした。
- source_word: לָהֶם
  choice: 二人に
  rationale: 複数代名詞が献酌官と料理役の長の両人を指すことを、日本語で曖昧なく示した。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語で定着している人名表記。
