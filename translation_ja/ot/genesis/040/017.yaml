  text: and in the top basket were all kinds of food for Pharaoh[a], the work of a baker, and the birds were eating them from the basket above my head.
translation:
  language: ja
  text: 一番上の籠には、パン職人が作った、ファラオのあらゆる食べ物が入っていました。そして鳥が、私の頭の上にある籠からそれらを食べていました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַסַּל הָעֶלְיוֹן
  choice: 一番上の籠には
  rationale: עֶלְיוֹןの空間的な意味を保ち、重ねた籠の最上部を自然な現代日本語で示す。
- source_word: מִכֹּל מַאֲכַל פַּרְעֹה
  choice: ファラオのための……あらゆる食べ物
  rationale: מִכֹּלと集合的なמַאֲכַלが表す種類の豊富さを「あらゆる食べ物」で表し、属格的関係は文脈上自然な「ファラオのための」とした。
- source_word: מַעֲשֵׂה אֹפֶה
  choice: パン職人が作った
  rationale: 直訳的には「パン職人の仕事／作ったもの」だが、食べ物を修飾する句として自然にしつつ、製作者を明示する原文の意味を保った。
- source_word: וְהָעוֹף
  choice: ところが、鳥たちが
  rationale: עוֹףを集合名詞と捉えて複数形にした。夢の中の望ましくない展開への移行を、日本語で自然な逆接「ところが」で表した。
- source_word: אֹכֵל
  choice: 食べていました
  rationale: 分詞が描く継続中の動作を「ていました」で再現した。
- source_word: אֹתָם
  choice: それらを
  rationale: 男性複数接尾辞が籠の中の複数の食べ物を受けることを明示した。
- source_word: מִן הַסַּל מֵעַל רֹאשִׁי
  choice: 私の頭の上の籠から
  rationale: מןの起点とמעלの上方という空間関係を保ち、籠が頭に直接触れているかどうかを断定しない表現とした。
