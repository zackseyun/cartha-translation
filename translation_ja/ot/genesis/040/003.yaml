  text: וַ/יִּתֵּ֨ן אֹתָ֜/ם בְּ/מִשְׁמַ֗ר בֵּ֛ית שַׂ֥ר הַ/טַבָּחִ֖ים אֶל בֵּ֣ית הַ/סֹּ֑הַר מְק֕וֹם אֲשֶׁ֥ר יוֹסֵ֖ף אָס֥וּר שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/003.yaml
  text: And he put them in custody in the house of the captain of the guard[a], in the prison house[c][b], the place where Joseph was confined.
translation:
  language: ja
  text: ファラオは彼らを近衛隊長[a]の家にある監獄に入れ、拘留した。そこはヨセフが囚われていた場所であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「近衛隊長」に当たるヘブライ語は、字義的には「処刑人たちの長」または「屠殺人たちの長」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן אֹתָם בְּמִשְׁמַר
  choice: 彼らを……拘留し
  rationale: נתןは字義的には「与える」だが、この拘禁の文脈では「置く、入れる」の意。בְּמִשְׁמַרの拘禁・監視下という意味を自然な日本語の「拘留し」で表した。
- source_word: בֵּית שַׂר הַטַּבָּחִים
  choice: 近衛隊長の家
  rationale: שַׂר הַטַּבָּחִיםは字義的には「屠殺人たち／処刑人たちの長」だが、宮廷の官職名として文脈に適する慣用的な「近衛隊長」を採用した。字義的な可能性は脚注に残した。
- source_word: אֶל בֵּית הַסֹּהַר
  choice: 監獄に入れた
  rationale: בֵּית הַסֹּהַרは拘禁施設を指す。「監獄」は明確で格調を保つ現代日本語であり、אֶלの方向性も「に入れた」で表現した。
- source_word: אֲשֶׁר יוֹסֵף אָסוּר שָׁם
  choice: そこはヨセフが囚われていた場所であった
  rationale: אָסוּרには「縛られた」と「投獄された／拘束された」の両義がある。監獄の文脈に自然な「囚われていた」とし、שָׁםを「そこは」に反映した。
theological_decisions:
- issue: 近衛隊長の家と監獄との統語的関係
  choice: 本文では「家で拘留し、監獄に入れた」と並べ、監獄がその家に属する可能性を保った
  alternative: 「近衛隊長の家にある監獄に入れた」
  rationale: ヘブライ語は「近衛隊長の家で／に」と「監獄へ」を連ねており、同一施設の詳説とも、場所を段階的に特定する表現とも読める。本文で完全な同格関係を断定せず、脚注で別訳を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、「拘留」「監獄」「囚われる」によって法的・拘禁的な場面の重みを保った。前節から続く主語は、単独でも理解できるよう「ファラオ」と明示した。
