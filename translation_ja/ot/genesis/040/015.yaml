  text: כִּֽי גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵ/אֶ֖רֶץ הָ/עִבְרִ֑ים וְ/גַם פֹּה֙ לֹא עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי שָׂמ֥וּ אֹתִ֖/י בַּ/בּֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/015.yaml
  text: For I was indeed kidnapped from the land of the Hebrews[b][a], and even here I have done nothing that they should put me in the pit.
translation:
  language: ja
  text: なぜなら、私はヘブライ人の地から、確かにさらわれて来たのです[a]。しかも、ここでも、牢獄[b]に入れられるようなことは何一つしていません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、不定詞絶対形を定動詞と重ねて、「さらわれた」ことを強調している。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「穴」または「坑」。この文脈では拘禁場所を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （訳文では独立した説明文として表現）
  rationale: 直前の願いを支える理由・説明を導く。日本語では接続詞を明示せずとも文脈上自然であり、因果関係は保たれる。
- source_word: גֻנֹּב גֻּנַּבְתִּי
  choice: 確かにさらわれて来た
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「確かに」で示す。人が本人の意思に反して連れ去られた意味を、現代日本語で自然な「さらわれた」とした。
- source_word: מֵאֶרֶץ הָעִבְרִים
  choice: ヘブライ人の地から
  rationale: 民族名と属格的表現を保ち、特定の政治的領域であると過度に限定しない。
- source_word: וְגַם פֹּה
  choice: しかも、ここでも
  rationale: 前半に加えて、現在いるエジプトでも無実であるという付加的な強調を表す。
- source_word: לֹא עָשִׂיתִי מְאוּמָה
  choice: 何一つしていません
  rationale: מְאוּמָה の全面的否定を自然な現代日本語で明確に表す。
- source_word: כִּי שָׂמוּ אֹתִי
  choice: 入れられるようなことは
  rationale: 投獄に値する行為を何もしていない、という文脈上の意味を自然に示しつつ、主体が明示されない原文の表現を不必要に補わない。
- source_word: בַּבּוֹר
  choice: 牢獄
  rationale: 字義は「穴、坑」だが、この文脈では拘禁場所を指す。本文では意味が直ちに伝わる「牢獄」とし、原語の比喩的・物理的含意は脚注に示す。
theological_decisions: []
translation_notes:
  register: ヨセフが自身の不当な境遇を訴える場面にふさわしく、平明でありながら dignified な丁寧体とした。「さらわれて来た」で移動の到達点を自然に含ませ、「入れられるようなこと」で投獄の根拠がないという関係を明確にした。
