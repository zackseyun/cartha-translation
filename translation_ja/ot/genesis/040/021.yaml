id: GEN.40.21
reference: Genesis 40:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּ֛שֶׁב אֶת שַׂ֥ר הַ/מַּשְׁקִ֖ים עַל מַשְׁקֵ֑/הוּ וַ/יִּתֵּ֥ן הַ/כּ֖וֹס עַל כַּ֥ף פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/021.yaml
  text: He restored the chief cupbearer to his office[b][a], and he put the cup into Pharaoh’s hand.
translation:
  language: ja
  text: ファラオは献酌官長[a]を元の務めに戻し、献酌官長[b]は杯をファラオの手に渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「献酌官長」は、王に飲み物を供する者たちの長。
    reason: 現代の一般読者にはなじみの薄い宮廷役職名を説明するため。
  - marker: b
    text: ヘブライ語では主語が名詞で明示されず、直訳すれば「彼は」となる。文脈上、杯を渡したのは献酌官長と考えられる。
    reason: 第二節の主語にある原文上の曖昧さと、本文での解釈的明示を知らせるため。
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: 元の務めに戻し
  rationale: 使役形の「以前の地位・状態に戻す」という意味を、現代日本語で自然に表した。
- source_word: שַׂר הַמַּשְׁקִים
  choice: 献酌官長
  rationale: 宮廷で飲み物を供する者たちの長を指す役職名として簡潔であり、文脈にも適する。一般読者には脚注で説明する。
- source_word: עַל מַשְׁקֵהוּ
  choice: 元の務めに
  rationale: 直訳的には「彼の献酌（飲み物を供する務め）に」だが、日本語では復職を表す「元の務めに」が自然である。
- source_word: וַיִּתֵּן
  choice: 渡した
  rationale: 杯をファラオの手に置く、または手渡す動作を自然な日本語で示す。
- source_word: הַכּוֹס
  choice: 杯
  rationale: 宮廷で飲み物を供する場面にふさわしい、具体的で簡潔な訳語である。
- source_word: עַל כַּף פַּרְעֹה
  choice: ファラオの手に
  rationale: כַּף は字義的には「手のひら」だが、この文脈では日本語の「手に」が自然である。
theological_decisions:
- issue: 第二節の動詞 וַיִּתֵּן の主語
  choice: 本文では「献酌官長」と明示し、ヘブライ語の主語表現上の曖昧さを脚注に残す
  alternative: 「彼は」として、直前の主語であるファラオを指し得る形を保つ
  rationale: ヘブライ語の動詞には独立した主語名詞がなく、形式上は直前のファラオが継続するようにも読める。しかし、杯をファラオの手に渡すという職務内容と文脈から、行為者は復職した献酌官長と理解するのが自然である。本文の明瞭さを確保しつつ、原文の形式的曖昧さは脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「献酌官長」という簡潔な役職名を用い、脚注で意味を補った。第一節の主語は前後の文脈からファラオと明示し、第二節は不自然な誤読を避けるため献酌官長を明示した。
