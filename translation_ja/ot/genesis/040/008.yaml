  text: וַ/יֹּאמְר֣וּ אֵלָ֔י/ו חֲל֣וֹם חָלַ֔מְנוּ וּ/פֹתֵ֖ר אֵ֣ין אֹת֑/וֹ וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יוֹסֵ֗ף הֲ/ל֤וֹא לֵֽ/אלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ נָ֖א לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/008.yaml
  text: They said to him[a], “We have dreamed a dream, and there is no one to interpret it.” Joseph said to them[b], “Do not interpretations belong to God? Please tell them to me.”
translation:
  language: ja
  text: 二人は彼に言った。「私たちは夢を見たのですが、それを解き明かす者がいないのです。」ヨセフは二人に言った。「解き明かしは神に属するものではありませんか。どうぞ夢のことを私に話してください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲלוֹם חָלַמְנוּ
  choice: 私たちは夢を見た
  rationale: 同根語を重ねた「夢を夢見た」という表現。日本語では「夢を見た」が自然で、意味を過不足なく伝える。
- source_word: וּפֹתֵר אֵין אֹתוֹ
  choice: それを解き明かす者がいない
  rationale: 能動分詞 פֹתֵר を「解き明かす者」とし、夢の意味を解釈できる人物がいないことを表した。
- source_word: הֲלוֹא
  choice: ではありませんか
  rationale: 同意を予期する修辞疑問の力を、自然な日本語の反語表現で保持した。
- source_word: לֵאלֹהִים פִּתְרֹנִים
  choice: 解き明かしは神に属する
  rationale: ל による所属・帰属の表現を保ち、夢の解釈が神に由来し神の領域に属するという主張を、説明しすぎずに訳した。
- source_word: פִּתְרֹנִים
  choice: 解き明かし
  rationale: ヘブライ語は複数形だが、日本語では抽象的・総称的な「解き明かし」が数を限定せず自然であり、原文の一般的意味を伝える。
- source_word: סַפְּרוּ נָא לִי
  choice: どうぞ私に話してください
  rationale: סִפֵּר の「語る、詳しく話す」と נָא の丁寧な促しを表す。目的語は原文でも明示されていないため、日本語でも補わず、二人の夢を話すよう求める文脈を保った。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で定着した人名表記を用いた。
theological_decisions:
- issue: ヨセフの発言における אֱלֹהִים の指示対象
  choice: 神
  alternative: 神々／ある神
  rationale: ヨセフ物語の文脈では、夢の解き明かしの源である唯一の神をヨセフが指している。ここで多神教的な不特定性を持ち込む文脈上の根拠はない。
- issue: 夢の解き明かしと神との関係
  choice: 「神に属する」として帰属を明示
  alternative: 「神がなさる」「神だけがおできになる」
  rationale: 原文の לֵאלֹהִים が示す帰属・所有の構文を保持し、「神だけ」という排他的要素や行為主体性を訳文で過度に補わない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会話としての丁寧さと物語文の品位を保った。「二人」は直前の給仕長と料理長を受け、複数代名詞を自然に表す。「解釈」よりも夢の意味を明らかにする語感を持つ「解き明かし」を採用した。
