  text: וַ֠/יִּפְקֹד שַׂ֣ר הַ/טַּבָּחִ֧ים אֶת יוֹסֵ֛ף אִתָּ֖/ם וַ/יְשָׁ֣רֶת אֹתָ֑/ם וַ/יִּהְי֥וּ יָמִ֖ים בְּ/מִשְׁמָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/040/004.yaml
  text: So the captain of the guard assigned Joseph to them[a], and he attended them[b]; and they were in custody for some time.
translation:
  language: ja
  text: そこで、侍衛長はヨセフを二人のもとに配置し[a]、ヨセフは二人の世話をした。二人はしばらく拘留されていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヨセフを二人の監督に任じた」。ヘブライ語の動詞は責任ある役目への任命・配置を表すことがあり、ヨセフを二人の世話のために配置したとも、二人を監督する者に任じたとも理解できる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「二人は拘留の中に日々いた」。ある期間そこにとどまったことを意味するヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: 付き添わせ
  rationale: פקד はここで、ヨセフを二人に関わる務めへ任命・配置することを表す。後続の「世話をした」と自然につながる一方、監督者に任じた可能性も注で保持する。
- source_word: שַׂר הַטַּבָּחִים
  choice: 侍衛長
  rationale: 字義的には「屠る者たちの長」だが、創世記では王の警護や拘禁に関わる高官の称号であり、文脈に即した簡潔で品位ある訳語とした。
- source_word: אֶת יוֹסֵף אִתָּם
  choice: ヨセフを二人に付き添わせ
  rationale: אִתָּם は字義的に「彼らと共に」。日本語では、ヨセフがこの二人のために配置された関係を「付き添わせ」で自然に示す。
- source_word: וַיְשָׁרֶת אֹתָם
  choice: ヨセフは二人の世話をした
  rationale: שרת は仕える、身の回りの務めをする意。宗教的な響きを避け、この拘禁状況での日常的な奉仕を明瞭に表す。
- source_word: וַיִּהְיוּ יָמִים
  choice: しばらく
  rationale: 字義的な「彼らは日々いた」は、ある期間そこにとどまったことを示すヘブライ語の慣用表現である。
- source_word: בְּמִשְׁמָר
  choice: 拘留されていた
  rationale: מִשְׁמָר は監視下の拘禁を指す。「牢獄」よりも、警備され自由を制限された状態に焦点を置く。
