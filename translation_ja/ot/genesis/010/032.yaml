  to: これらは、ノアの息子たちの氏族であり、系譜に従い、民族ごとに分けられている。洪水の後、これらから諸民族が地上に分かれていった。
  rationale: 本文にない「まとめた」という説明を除き、前半を原文の名詞的総括と二つの分類句により近く対応させた。「分けられている」は前半の氏族の分類を示し、後半の「分かれていった」は נִפְרְדוּ の分離・展開を、原因や主体を補わずに表す。
