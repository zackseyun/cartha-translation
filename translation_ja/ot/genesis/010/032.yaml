  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי נֹ֛חַ לְ/תוֹלְדֹתָ֖/ם בְּ/גוֹיֵ/הֶ֑ם וּ/מֵ/אֵ֜לֶּה נִפְרְד֧וּ הַ/גּוֹיִ֛ם בָּ/אָ֖רֶץ אַחַ֥ר הַ/מַּבּֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/032.yaml
  text: These are the families of the sons of Noah[a], according to their generations, by their nations[c][b]; and from these the nations were separated on the earth after the flood.
translation:
  language: ja
  text: これらは、ノアの息子たちの氏族であり、系譜に従い、民族ごとに分けられている。洪水の後、これらから諸民族が地上に分かれていった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: 氏族
  rationale: 血縁に基づく集団を指す。日本語の「家族」では核家族的に狭く響きやすいため、諸民族の系譜を総括する文脈に適した「氏族」とした。
- source_word: לְתוֹלְדֹתָם
  choice: それぞれの系譜に従って
  rationale: תּוֹלְדוֹת は世代、子孫、系譜を表し得るが、ここでは直前の系図を分類・総括しているため「系譜」が自然である。
- source_word: בְּגוֹיֵהֶם
  choice: 民族に従って
  rationale: 前の前置詞句と並んで分類の観点を示すと理解し、各氏族が形成した民族的区分を表す訳とした。
- source_word: וּמֵאֵלֶּה
  choice: これらから
  rationale: 直前に列挙・総括されたノアの息子たちの氏族を起点として示す。日本語では接続関係が明らかなため、וְ を独立した「そして」とせず自然に結んだ。
- source_word: נִפְרְדוּ
  choice: 分かれていった
  rationale: פרד のニファル形が示す分離を保ちつつ、諸民族が各地に分岐していく文脈に自然な表現とした。分離の原因や主体は補わない。
- source_word: הַגּוֹיִם
  choice: 諸民族
  rationale: ノアの子孫から生じた複数の民族集団を指すため、「諸国」より人々に焦点のある「諸民族」とした。
- source_word: בָּאָרֶץ
  choice: 地上に
  rationale: 民族表の広い範囲を総括するため、特定地域の「土地」に限定せず、全地的な「地上」とした。
- source_word: אַחַר הַמַּבּוּל
  choice: 洪水の後
  rationale: 時間を表す句を簡潔かつ直接的に訳した。定冠詞のある הַמַּבּוּל は物語中の洪水を指す。
theological_decisions:
- issue: בָּאָרֶץ の範囲
  choice: 全地的な「地上」
  alternative: 特定の地域を指す「その地に」
  rationale: 創世記10章はノアの子孫から生じた諸民族を広く総括しているため、特定の土地に狭めない。ただし地理的分布の細部は訳文に付加しない。
- issue: נִפְרְדוּ における分離の主体・原因
  choice: 受動・自発の含みを残す「分かれていった」
  alternative: 神が分けた／人々が散った
  rationale: ヘブライ語本文はここで分離を引き起こした主体を明示しないため、バベル物語との関係を先取りして主体や原因を補わない。
translation_notes:
  register: 明瞭で現代的かつ荘重な叙述。「まとめたものである」は、この節が直前の民族表の総括であることを自然な日本語で示す。原文の二つの分類句は「それぞれの系譜と民族に従って」と並列させ、曖昧さを過度に解消しない。
