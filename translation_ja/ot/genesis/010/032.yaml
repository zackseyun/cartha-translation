    rationale: 「まとめた」は原文にない要約・編集の行為を加えます。また、「系譜と民族に従って」は二つの前置詞句の関係をやや曖昧にし、בְּגוֹיֵהֶם の「民族ごとに／各民族の中で」という分類的な含みを弱めます。
  revised_text: これらは、ノアの息子たちの氏族であり、系譜に従い、民族ごとに分けられている。洪水の後、これらから諸民族が地上に分かれていった。
