  text: These are the sons of Shem[a], by their clans, by their languages, in their lands, by their nations.
translation:
  language: ja
  text: 以上がセムの子らである。氏族ごとに、言語ごとに、それぞれの土地において、国民ごとに。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「以上がセムの子らである。彼らの氏族に従い、彼らの言語に従い、彼らの土地において、彼らの国民に従って。」ヘブライ語では、分類を示す前置詞が繰り返されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以上が…であり
  rationale: 系譜のまとめを指し示す無動詞文。日本語では直前までの一覧を受ける「以上が」が自然である。
- source_word: בְנֵי
  choice: 子ら
  rationale: 系譜上の定型表現を保ち、「子孫」と広く解釈しすぎないようにした。
- source_word: שֵׁם
  choice: セム
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: לְמִשְׁפְּחֹתָם
  choice: その氏族…ごとに
  rationale: מִשְׁפָּחָה は部族的・系譜的集団を指すため「氏族」とした。前置詞 לְ の分類・区分の働きは、日本語では列挙全体を受ける「ごとに」で表した。
- source_word: לִלְשֹׁנֹתָם
  choice: その言語…ごとに
  rationale: 身体器官としての「舌」ではなく、諸集団の使用言語を意味するため、明瞭な現代語の「言語」とした。
- source_word: בְּאַרְצֹתָם
  choice: その土地
  rationale: בְּ は所在を示す。「国土」や現代的な「国家」を含意しすぎない広い語として「土地」を採用した。
- source_word: לְגוֹיֵהֶם
  choice: その国民ごとに
  rationale: גּוֹי は民族的・政治的な民の集団を表す。「国々」では土地との重複が強いため、「国民」として人々の集団を示した。
