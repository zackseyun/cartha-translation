  text: וְ/אֶת עוֹבָ֥ל וְ/אֶת אֲבִֽימָאֵ֖ל וְ/אֶת שְׁבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/028.yaml
  text: and Obal[a], and Abimael, and Sheba.
translation:
  language: ja
  text: オバル、アビマエル、シェバをもうけた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「もうけた」は前節から補った。ヘブライ語では、それぞれの名の前に「そして」と目的語を示す標識が繰り返されている。
    reason: 原文の省略された動詞と反復構文を明示するため。
lexical_decisions:
- source_word: וְ/אֶת
  choice: 、／を
  rationale: וְは列挙を示す接続詞であり、日本語では読点で自然に表した。אֶתは定目的語を示す標識で、直接対応する語はないが、前節から続く動詞「もうけた」の目的語として助詞「を」で示した。
- source_word: עוֹבָל
  choice: オバル
  rationale: 固有名詞として、ヘブライ語の子音と母音に即して音写した。
- source_word: אֲבִימָאֵל
  choice: アビマエル
  rationale: 系図中の固有名詞なので語義に訳さず、原語に即して音写した。
- source_word: שְׁבָא
  choice: シェバ
  rationale: この綴りの固有名詞 שְׁבָא を、慣用的かつ原音に近い「シェバ」とした。別名の「セバ」とは区別した。
theological_decisions:
- issue: 原文に動詞が明記されていないこと
  choice: 前節から補って「もうけた」とした
  alternative: 「オバル、アビマエル、シェバ。」と名だけを列挙する
  rationale: 本節は前節の出生一覧に統語的に続き、וְאֶתで各名を目的語として列挙している。日本語で独立した節として明瞭に読むため、前文脈の動詞を補った。補足であることは脚注に示した。
translation_notes:
  register: 現代の一般読者に自然な系図表現とし、簡潔で品位ある文体を用いた。名は原語から音写し、節単独でも意味が通るよう前節の動詞を補った。
