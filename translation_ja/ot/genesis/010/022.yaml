  yaml_path: translation/ot/genesis/010/022.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud[b], and Aram.'
translation:
  language: ja
  text: セムの息子たちは、エラム、アシュル、アルパクシャド[a]、ルド、そしてアラム[b]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語名は「アルパクシャド」。ギリシア語訳の影響を受けた伝統的な表記では「アルファクサド」などとされる。
    reason: lexical_alternative
  - marker: b
    text: 「アシュル」と「アラム」は、それぞれ後にアッシリア、アラム地方およびその民と結び付けられる名である。
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: 息子たち
  rationale: בֵּןの複数構成形。系図の男性系を示す原文の表現を保ち、「子孫たち」のように意味を広げない。
- source_word: שֵׁם
  choice: セム
  rationale: 固有名詞として、日本語で定着しているヘブライ語名の表記を用いた。
- source_word: עֵילָם
  choice: エラム
  rationale: ここでは系図上の名として提示されているため、地名に置き換えず固有名を音写した。
- source_word: אַשּׁוּר
  choice: アシュル
  rationale: 後代の地域名「アッシリア」に置き換えず、系図に記されたヘブライ語の固有名を音写した。
- source_word: אַרְפַּכְשַׁד
  choice: アルパクシャド
  rationale: ギリシア語系の伝統的表記ではなく、ヘブライ語本文の子音構成を反映する音写とした。
- source_word: לוּד
  choice: ルド
  rationale: 本文の単数形の固有名をそのまま音写し、別形の「ルディム」とはしなかった。
- source_word: אֲרָם
  choice: アラム
  rationale: 後代の地理的呼称「シリア」に置き換えず、系図上の固有名を音写した。
theological_decisions: []
translation_notes:
  register: 原文は動詞を置かない簡潔な系図一覧であるため、日本語でも見出し的な二文構成として簡潔さを保った。固有名は現代日本語で読みやすい音写とし、後代の国名・地域名への置換は避けた。英語相談層の脚注[a]は配置が内容と一致していなかったため、対象語「アルパクシャド」の直後に置いた。
