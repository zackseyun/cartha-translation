  variant: clear modern standard Japanese
source:
  edition: WLC
  text: מִן הָ/אָ֥רֶץ הַ/הִ֖וא יָצָ֣א אַשּׁ֑וּר וַ/יִּ֨בֶן֙ אֶת נִ֣ינְוֵ֔ה וְ/אֶת רְחֹבֹ֥ת עִ֖יר וְ/אֶת כָּֽלַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/011.yaml
  text: From that land Asshur went out and built Nineveh[a], Rehoboth-Ir, and Calah.
translation:
  language: ja
  text: その地からアシュルが出て行き、ニネベ[a]、レホボト・イル、カラを建てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼はその地からアッシリアへ出て行き、ニネベ、レホボト・イル、カラを建てた」。この場合、主語は前節のニムロドで、アシュルを人名ではなく地域名「アッシリア」と解する。
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הָאָרֶץ הַהִוא
  choice: その地から
  rationale: מִןは起点を示し、אֶרֶץはここでは土地・地域を指す。「その地から」は簡潔で自然に地理的な意味を保つ。
- source_word: יָצָא
  choice: 出て行き
  rationale: יצאの基本義「出る、出て行く」を文脈に即して表し、移動の起点も明確にする。
- source_word: אַשּׁוּר
  choice: アシュル
  rationale: 人名アシュルとも地域名アッシリアとも解し得るが、直近の構文では動詞に続く明示的主語として人名に取るのが自然である。地域名と取る読みは脚注に残す。
- source_word: וַיִּבֶן
  choice: 建てた
  rationale: בנהの基本的な意味を直接表す。「築いた」「建設した」より平明で、都市を建てるという用法にも適する。
- source_word: נִינְוֵה
  choice: ニネベ
  rationale: 日本語で定着した地名表記を用いる。
- source_word: רְחֹבֹת עִיר
  choice: レホボト・イル
  rationale: 反復される目的語標識אֶתを伴う都市名の列に置かれているため、複合地名として音写する。字義的には「町の広場」なども可能だが、この文脈では地名の可能性が高い。
- source_word: כָּלַח
  choice: カラ
  rationale: ヘブライ語の地名を日本語に音写した。
theological_decisions:
- issue: אַשּׁוּרの指示対象と節の主語
  choice: 「アシュルが出て行き」—אַשּׁוּרを人名で明示的主語とする。
  alternative: 「彼はその地からアッシリアへ出て行き」—前節のニムロドを主語とし、אַשּׁוּרを地域名とする。
  rationale: ヘブライ語本文ではאַשּׁוּרが人名「アシュル」と地域名「アッシリア」のどちらにもなり得る。語順上は動詞の後の明示的主語と取る読みが自然だが、前節からニムロドを主語として補う読みも可能なので、本文で一方を採りつつ脚注で真正な曖昧さを示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「出て行き」「建てた」という一般的な語を用い、地名は日本語で通用する音写とした。主語と地名の解釈上の曖昧さは本文で過度に説明せず、脚注に示した。
