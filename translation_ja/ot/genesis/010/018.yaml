id: GEN.10.18
reference: Genesis 10:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶת הָֽ/אַרְוָדִ֥י וְ/אֶת הַ/צְּמָרִ֖י וְ/אֶת הַֽ/חֲמָתִ֑י וְ/אַחַ֣ר נָפֹ֔צוּ מִשְׁפְּח֖וֹת הַֽ/כְּנַעֲנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/018.yaml
  text: and the Arvadites[a], the Zemarites, and the Hamathites. Afterward the clans of the Canaanites were scattered.
translation:
  language: ja
  text: また、アルワド人、ツェマル人、ハマト人である。その後、カナン人[a]の諸氏族は各地に散っていった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では単数形の「カナン人」が、カナンの民全体を集合的に指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאַרְוָדִי
  choice: アルワド人
  rationale: 民族・氏族を表す単数形の呼称だが、諸民族の一覧では集合的に用いられている。日本語では「アルワド人」が個人にも集団にも自然に使える。
- source_word: הַצְּמָרִי
  choice: ツェマル人
  rationale: 周囲の民族名と同様、集合的な民族・氏族名として訳した。固有名の音写はヘブライ語の子音構成を明瞭に反映する。
- source_word: הַחֲמָתִי
  choice: ハマト人
  rationale: 諸民族の一覧における集合的な呼称として、自然な日本語の民族名にした。
- source_word: וְאַחַר
  choice: その後
  rationale: 列挙された諸氏族に続いて起きたことを示す時間表現として、簡潔で自然である。
- source_word: נָפֹצוּ
  choice: 各地に散っていった
  rationale: ニファル形が表す分散の結果と推移を自然な日本語で示しつつ、誰が散らしたのかという、原文に明示されていない行為者を補わない。
- source_word: מִשְׁפְּחוֹת
  choice: 諸氏族
  rationale: ここでは核家族ではなく、系譜的・民族的な親族集団を指すため、「家族」より「氏族」が適切である。
- source_word: הַכְּנַעֲנִי
  choice: カナン人
  rationale: 文法上は定冠詞を伴う単数形だが、カナンの民を集合的に指す。日本語の「カナン人」は集合的にも理解できる。
theological_decisions:
- issue: נָפֹצוּ における分散の行為者
  choice: 行為者を明示せず「各地に散っていった」とした
  alternative: 「散らされた」
  rationale: ニファル形には受動的・結果的な含みがあり得るが、本文は誰が散らしたかを明記していない。神を行為者として暗黙に特定する読みを訳文で固定しないため、中立的な表現を選んだ。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いた。冒頭は前節から続く民族名の列挙であるため、「また」と「である」によってその連続性を示した。「諸氏族」は系譜・民族一覧にふさわしい、簡潔で格調を保つ語である。
