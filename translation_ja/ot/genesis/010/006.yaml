source:
  edition: WLC
  text: וּ/בְנֵ֖י חָ֑ם כּ֥וּשׁ וּ/מִצְרַ֖יִם וּ/פ֥וּט וּ/כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/006.yaml
  text: 'And the sons of Ham: Cush[a], Mizraim, Put[b], and Canaan.'
translation:
  language: ja
  text: また、ハムの子らは、クシュ、ミツライム[a]、プテ[b]、カナンである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ミツライム」は、通常「エジプト」と訳されるヘブライ語名。ここでは系図上の祖名として音写した。
    reason: alternative_reading
  - marker: b
    text: 「プテ」は「プト」とも表記される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: また、～の子らは
  rationale: 接続詞וּを「また」として系図の連続性を示し、בְנֵיは系譜上の定型表現として「子ら」と訳した。ここでは子孫・氏族の祖を含み得るが、本文では意味を限定しすぎない。
- source_word: חָם
  choice: ハム
  rationale: ヘブライ語の固有名を、日本語聖書で広く定着している形で表記した。
- source_word: כּוּשׁ
  choice: クシュ
  rationale: 固有名として音写し、日本語で一般的な聖書名表記を用いた。
- source_word: מִצְרַיִם
  choice: ミツライム
  rationale: 通常は地名「エジプト」を指す語だが、この系図では人物・祖名として並ぶため、地名に置き換えず音写した。
- source_word: פוּט
  choice: プテ
  rationale: 固有名として、日本語聖書で定着している表記を採用した。ヘブライ語に近い別表記の可能性は脚注に示した。
- source_word: כְנָעַן
  choice: カナン
  rationale: 固有名として、日本語で広く定着している聖書名表記を用いた。
theological_decisions:
- issue: בְנֵיの系譜上の範囲
  choice: 子ら
  alternative: 子孫／氏族
  rationale: この語は系図で後代の子孫や諸集団をも指し得るが、原文の親族表現とその含みを保つため、本文では「子ら」とした。
- issue: מִצְרַיִםを人物名と地名のどちらで表すか
  choice: ミツライム
  alternative: エジプト
  rationale: 列挙された他の名と同様、ここではハムの系譜に属する祖名として機能しているため音写した。一方、同じヘブライ語が通常「エジプト」を表すことは脚注で明示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、系図にふさわしい簡潔で格調ある文体とした。固有名は日本語聖書で定着した表記を優先し、原文の接続詞は「また」で自然に保持した。英語相談層では脚注[a]がクシュの後に置かれていたが、内容はミツライムに関するものなので、日本語稿では対応する語の直後に正しく配置した。
