  source_fidelity: WLCの語順と列挙を正確に反映している。וּは「また」で系図の継続として自然に示され、בְנֵי חָםは「ハムの子ら」と適切に訳されている。クシュ、ミツライム、プテ、カナンの各固有名も原文に忠実である。
  naturalness: 「また、ハムの子らは、…である。」は現代標準日本語として明瞭で、系図本文にふさわしい簡潔な文体である。「子ら」はこの文脈で自然であり、系譜用語としての広がりも不必要に狭めていない。
  terminology: 「ミツライム」を祖名として音写し、通常の地名的訳語「エジプト」を脚注で補う処理は、原文の系図上の用法と英語監査記録の趣旨に合致する。「プテ」および脚注の「プト」という表記情報も妥当である。脚注[a]は日本語稿ではミツライムの直後に正しく配置されている。
