  yaml_path: translation/ot/genesis/010/030.yaml
  text: And their settlement was from Mesha as you go toward Sephar[a], the hill country of the east.
translation:
  language: ja
  text: 彼らの居住地は、メシャから、東の山地にあるセファルへ向かう一帯にあった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らの居住地は、メシャから、セファル、すなわち東の山地へ向かう一帯にあった。」
    reason: セファルと「東の山地」の関係は、セファルを東の山地にある地名と見ることも、両者を同格と見ることも可能であるため。
lexical_decisions:
- source_word: וַיְהִי
  choice: 及んでいた
  rationale: 地理的範囲を述べる文脈で、単なる「であった」より自然に領域の広がりを表す。ただし存在動詞の意味を過度に具体化しないよう、脚注により別解を示す。
- source_word: מוֹשָׁבָם
  choice: 彼らの居住地
  rationale: 集団が住んだ地域を指すため、現代日本語で明瞭な「居住地」とした。
- source_word: מִמֵּשָׁא
  choice: メシャから
  rationale: 地名を音写し、前置詞 מִן の起点を「から」で表した。
- source_word: בֹּאֲכָה
  choice: セファルに向かう道に沿って
  rationale: 「行くとき／向かって」という地理的方向を示す慣用表現を、境界記述として自然な日本語にした。
- source_word: סְפָרָה
  choice: セファル
  rationale: 地名 סְפָר を音写し、方向を示す語尾は「に向かう」に反映した。
- source_word: הַר
  choice: 山地
  rationale: 単一の山とも山岳地域とも取り得るが、居住範囲の記述では地域的な「山地」が自然である。
- source_word: הַקֶּדֶם
  choice: 東の
  rationale: קֶדֶם の地理的意味を簡潔に表し、הַר と結びつけて「東の山地」とした。
