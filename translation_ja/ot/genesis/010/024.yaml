  text: וְ/אַרְפַּכְשַׁ֖ד יָלַ֣ד אֶת שָׁ֑לַח וְ/שֶׁ֖לַח יָלַ֥ד אֶת עֵֽבֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/024.yaml
  text: Arpachshad fathered Shelah[a], and Shelah fathered Eber.
translation:
  language: ja
  text: アルパクシャドはシェラをもうけ、シェラはエベルをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: アルパクシャドは
  rationale: 接続詞וְは日本語の文脈上あえて独立して訳さず、固有名אַרְפַּכְשַׁדはヘブライ語の音形に基づいて「アルパクシャド」とした。主題を示す「は」を補い、自然な系譜文とした。
- source_word: יָלַד
  choice: もうけた
  rationale: 男性を主語とする系譜で「父となった、子をもうけた」を意味する。「生んだ」ではなく「もうけた」とし、簡潔で自然な現代日本語にした。
- source_word: אֶת
  choice: 訳出しない
  rationale: 直接目的語を示す文法標識であり、日本語では目的格の助詞「を」によって機能を表した。
- source_word: שָׁלַח / וְ/שֶׁלַח
  choice: シェラ／シェラは
  rationale: 同一人物名の異なる母音表記を、本文のヘブライ語音形に沿って一貫して「シェラ」とした。後半のוְは文をつなぐ「そして」にせず読点で自然に表し、「は」を補った。
- source_word: עֵבֶר
  choice: エベル
  rationale: ヘブライ語עֵבֶרの慣用的かつ音形に近い日本語表記として「エベル」を採用した。
theological_decisions: []
translation_notes:
  register: 簡潔な系譜の反復構造を保ちつつ、現代の一般読者に自然で品位ある「もうけた」を用いた。固有名はギリシア語・英語の伝統形ではなく、WLCのヘブライ語音形を優先して表記した。
