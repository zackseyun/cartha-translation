source:
  edition: WLC
  text: וּ/לְ/שֵׁ֥ם יֻלַּ֖ד גַּם ה֑וּא אֲבִי֙ כָּל בְּנֵי עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַ/גָּדֽוֹל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/021.yaml
  text: And to Shem also[a], the father of all the sons of Eber, the brother of Japheth the elder, children were born.
translation:
  language: ja
  text: セムにもまた子どもたちが生まれた。セムは、エベルのすべての子らの父祖であり、ヤフェトの兄[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「年長のヤフェトの兄弟であった」。ヘブライ語の「年長の」に当たる語は、セムを指すともヤフェトを指すとも取れる。
    reason: 「年長の」という形容詞の修飾先に原文上の曖昧さがあるため。
lexical_decisions:
- source_word: וּלְשֵׁם ... יֻלַּד
  choice: セムにもまた子どもたちが生まれた
  rationale: 与格の「セムに」と受動形「生まれた」を保ちつつ、系図の文脈で省略されている子孫を「子どもたち」と補い、現代日本語として自然にした。
- source_word: גַּם הוּא
  choice: にもまた
  rationale: ノアの他の息子たちに続き、セムにも子孫が生まれたという添加と強調を表す。
- source_word: אֲבִי כָּל־בְּנֵי־עֵבֶר
  choice: エベルのすべての子らの父祖
  rationale: אָבの系譜上の意味を「父祖」とし、בְּנֵיの比喩的広がりを残すため「子ら」と訳した。「ヘブライ人」と意訳せず、固有名エベルを保持した。
- source_word: אֲחִי יֶפֶת הַגָּדוֹל
  choice: ヤフェトの兄
  rationale: הַגָּדוֹלを年長の意に取り、セムがヤフェトの年長の兄であるという解釈を本文に採用した。修飾先の曖昧さは脚注で保持した。
theological_decisions:
- issue: הַגָּדוֹלがセムとヤフェトのどちらを年長者として示すか
  choice: セムを年長者とする「ヤフェトの兄」
  alternative: ヤフェトを年長者とする「兄ヤフェトの弟」または「年長のヤフェトの兄弟」
  rationale: ヘブライ語の語順では形容詞の係り先に曖昧さがある。本文では一つの可能な読みを採り、もう一方を脚注に示して系譜上の不確定性を解消しすぎないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「父祖」によって系図上の祖先という意味を簡潔に示し、曖昧な年齢関係は本文と脚注に分けて提示した。
