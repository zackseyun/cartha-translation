base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/007.yaml
  text: 'And the sons of Cush: Seba[a], Havilah, Sabtah, Raamah, and Sabteca[b]. And the sons of Raamah: Sheba and Dedan.'
translation:
  language: ja
  text: クシュの子ら[a]は、セバ、ハビラ、サブタ、ラアマ、サブテカ[b]。ラアマの子らは、シェバとデダン。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 系図でいう「子ら」は、直系の息子だけでなく、子孫、またはそこから出た氏族や民族を指すことがある。
    reason: cultural_note
  - marker: b
    text: この節の名のいくつかは、個人だけでなく、民族、地域、またはその祖とされた人物を指す可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: 子ら
  rationale: בְּנֵי の構文上の複数形を直接反映した。系図では実子だけでなく、子孫やそこから出た氏族・民族を含み得るため、その広がりは脚注で示した。
- source_word: כּוּשׁ
  choice: クシュ
  rationale: 固有名詞として、現代日本語聖書で通用する音写を用いた。
- source_word: סְבָא
  choice: セバ
  rationale: 個人、地域、民族のいずれを指すかを本文で限定せず、固有名詞として音写した。
- source_word: חֲוִילָה
  choice: ハビラ
  rationale: ヘブライ語の固有名詞を、日本語で定着した形に音写した。
- source_word: סַבְתָּה
  choice: サブタ
  rationale: ヘブライ語名の音を簡潔な現代日本語表記で示した。
- source_word: רַעְמָה
  choice: ラアマ
  rationale: 固有名詞として音写し、個人か集団かを訳文で確定しなかった。
- source_word: סַבְתְּכָא
  choice: サブテカ
  rationale: ヘブライ語の固有名詞を日本語で読みやすく音写した。
- source_word: וּבְנֵי רַעְמָה
  choice: ラアマの子ら
  rationale: 前半と同じ系図上の定型表現を保ち、原文の反復構造を明確にした。
- source_word: שְׁבָא
  choice: シェバ
  rationale: 固有名詞として、日本語で一般的な音写を採用した。
- source_word: דְדָן
  choice: デダン
  rationale: 民族形容ではなく、本文どおり固有名詞として音写した。
