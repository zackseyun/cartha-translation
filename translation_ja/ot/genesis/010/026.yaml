  text: Joktan fathered Almodad[a], Sheleph, Hazarmaveth, and Jerah.
translation:
  language: ja
  text: ヨクタンは、アルモダド、シェレフ、ハツァルマベト、およびエラをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָקְטָן
  choice: ヨクタン
  rationale: 固有名詞として音写した。語頭のヨードを「ヨ」で表し、日本語の聖書名として明瞭な形を採った。節頭の接続詞וְは、日本語では文脈上なくてもつながりが自然なため独立には訳さない。
- source_word: יָלַד
  choice: には…が生まれた
  rationale: 系譜における男性を主語とする語で、子をもうけたことと系譜上の関係を示す。日本語では「もうけた」より自然で dignified な系譜表現とし、生物学的な父子関係を必要以上に断定しない構文を採った。
- source_word: אֶת
  choice: 訳語を置かない
  rationale: 直接目的語を示す標識であり、日本語では語順と構文によって機能を表す。
- source_word: אַלְמוֹדָד
  choice: アルモダド
  rationale: 固有名詞としてヘブライ語の発音に沿って音写した。
- source_word: שָׁלֶף
  choice: シェレフ
  rationale: 固有名詞として音写し、母音を反映して「シェレフ」とした。
- source_word: חֲצַרְמָוֶת
  choice: ハツァルマベト
  rationale: 固有名詞として音写した。חֲを「ハ」、צַを「ツァ」、語中のוを子音として「マベト」に反映した。
- source_word: יָרַח
  choice: エラ
  rationale: 固有名詞として音写した。語頭のיְ系の音を日本語の慣用に合わせて「エ」とし、語末חは日本語で無理に表記しなかった。
- source_word: וְאֶת（反復）
  choice: 読点による列挙と最後の「、」
  rationale: 各名の前に反復されるוְを一つずつ「そして」とすると日本語では過度に重くなるため、列挙の関係を読点で自然に表した。情報内容は保持している。
