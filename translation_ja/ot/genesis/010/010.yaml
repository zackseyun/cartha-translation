base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/010.yaml
  text: The beginning of his kingdom was Babel[a], Erech, Accad, and Calneh[b], in the land of Shinar.
translation:
  language: ja
  text: 彼の王国の始まりは、シンアルの地にあるバベル[a]、エレク、アッカド、カルネ[b]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「バビロン」とも表記される。
    reason: lexical_alternative
  - marker: b
    text: エレクは一般に古代都市ウルクと同定される。アッカドも古代メソポタミアのアッカドに当たると考えられている。
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי
  choice: であった
  rationale: ここでは継続・結果を強調するより、ニムロドの王国の初期の構成を述べる過去の連結辞として自然に表した。
- source_word: רֵאשִׁית
  choice: 始まり
  rationale: 「最初の部分」「主要部」の可能性を過度に限定せず、王国の起源または初期の範囲を表す語として訳した。
- source_word: מַמְלַכְתּוֹ
  choice: 彼の王国
  rationale: 都市名が列挙される文脈なので、「統治」よりも領域を含む「王国」が明瞭である。
- source_word: בָּבֶל
  choice: バベル
  rationale: ヘブライ語の固有名を音写し、創世記11章との文学的なつながりも保った。
- source_word: אֶרֶךְ
  choice: エレク
  rationale: 本文のヘブライ語形を日本語で音写した。古代都市ウルクとの一般的な同定は脚注に示す。
- source_word: אַכַּד
  choice: アッカド
  rationale: ヘブライ語の地名を、日本語で一般に認識しやすい歴史的表記で示した。
- source_word: כַלְנֵה
  choice: カルネ
  rationale: マソラ本文の語形をそのまま音写し、別箇所の類似地名と同一視しなかった。
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: シンアルの地にある
  rationale: 列挙された諸都市がシンアル地方に位置するという地理的関係を、自然な日本語で保持した。
