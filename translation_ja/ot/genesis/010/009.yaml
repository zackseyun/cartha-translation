source:
  edition: WLC
  text: הֽוּא הָיָ֥ה גִבֹּֽר צַ֖יִד לִ/פְנֵ֣י יְהוָ֑ה עַל כֵּן֙ יֵֽאָמַ֔ר כְּ/נִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/009.yaml
  text: He was a mighty hunter before Yahweh; therefore it is said[a], “Like Nimrod, a mighty hunter before Yahweh.”
translation:
  language: ja
  text: 彼はヤハウェの前で力強い狩人であった。それで、「ニムロドのように、ヤハウェの前で力強い狩人だ」と言われる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この句を広い文脈から敵対的な意味に取る場合、「ヤハウェに逆らう力強い狩人」とも考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: גִבֹּר צַיִד
  choice: 力ある狩人
  rationale: 「狩りに秀でた者、並外れた狩人」を表す結合として取り、「力ある狩人」と簡潔かつ荘重に訳した。「勇敢な狩人」では、狩りの力量より勇気を強調しすぎるため避けた。
- source_word: לִפְנֵי
  choice: 前で
  rationale: 基本的な空間的・関係的意味である「前で／面前で」を本文に保ち、敵対的な含意の可能性は脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: עַל כֵּן
  choice: それで
  rationale: 後続することわざの由来を示す因果表現。現代日本語として自然でありながら、原文のつながりを明確に保つ。
- source_word: יֵאָמַר
  choice: と言われる
  rationale: ニファル未完了形の非人称的用法を、今も通用することわざを導入する日本語の受身表現で表した。
- source_word: כְּנִמְרֹד
  choice: ニムロドのような
  rationale: 接頭辞 כְּ の比較の意味を自然な日本語で表し、後続の名詞句につながる形にした。
theological_decisions:
- issue: ニムロドについての לִפְנֵי יְהוָה の解釈
  choice: ヤハウェの前で
  alternative: ヤハウェに逆らう
  rationale: לִפְנֵי の通常の意味を本文に置く。文脈から敵対的意味を読み取る可能性はあるが、前置詞句そのものが明示的に「逆らう」と述べているわけではないため、本文で断定せず脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、ことわざを引用する語り口の品位を保った。「力ある」は日常語よりやや荘重だが、גִבֹּר の強さと卓越性を簡潔に伝え、聖書本文の文体にも適する。脚注記号[a]は、それが説明する「と言われる」の直後に置いた。
