  text: וּ/בְנֵ֥י יָוָ֖ן אֱלִישָׁ֣ה וְ/תַרְשִׁ֑ישׁ כִּתִּ֖ים וְ/דֹדָנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/004.yaml
  text: 'And the sons of Javan: Elishah[a], Tarshish, Kittim, and Dodanim.'
translation:
  language: ja
  text: ヤワンの子らは、エリシャ、タルシシュ、キティム、ドダニム[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 写本によっては、また歴代誌第一1章7節では、「ロダニム」となっている。
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: の子らは
  rationale: 系図の定型を保ち、בְנֵי の直接的な意味を自然な現代日本語で表した。冒頭の接続詞は、節単独の日本語として不自然にならないよう明示せず、列挙の連続性は文脈に委ねた。
- source_word: יָוָן
  choice: ヤワン
  rationale: 固有名として、聖書日本語で理解されやすく原音にも対応する形に音写した。
- source_word: אֱלִישָׁה
  choice: エリシャ
  rationale: 民族または地名を示す固有名として音写した。
- source_word: וְ/תַרְשִׁישׁ
  choice: タルシシュ
  rationale: 固有名として音写し、ヘブライ語の語形を保った。
- source_word: כִּתִּים
  choice: キティム
  rationale: 複数形を含む民族名・地域名として、慣用的で明瞭な音写を採用した。
- source_word: וְ/דֹדָנִים
  choice: ドダニム
  rationale: 本文はWLCのマソラ本文 דֹדָנִים に従った。異読「ロダニム」は脚注に残した。
theological_decisions: []
