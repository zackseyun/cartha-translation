id: GEN.10.25
reference: Genesis 10:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/025.yaml
  text: 'And to Eber two sons were born: the name of the one was Peleg[a], for in his days the earth was divided, and his brother''s name was Joktan.'
translation:
  language: ja
  text: エベルには二人の息子が生まれた。一人の名はペレグであった。彼の時代に地[a]が分けられたからである。その兄弟の名はヨクタンであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「全地」とも「土地」とも訳せる。ヘブライ語はどちらの意味にもなり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: エベルには
  rationale: 接続詞と前置詞を含む系図上の導入を、前後との連続性を保ちつつ自然な日本語にした。
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: 二人の息子が生まれた
  rationale: 受動形と複数主語をそのまま反映し、「もうけた」のような能動表現を避けた。
- source_word: שֵׁם הָאֶחָד
  choice: 一人の名は
  rationale: 「第一の者」と順序を明示せず、もう一人との対比を表す原文に沿った。
- source_word: פֶּלֶג
  choice: ペレグ
  rationale: ヘブライ語の人名を日本語で一般的な形に音写した。
- source_word: בְיָמָיו
  choice: 彼の時代に
  rationale: ペレグが生きていた時代を指す慣用句として、明瞭で自然な現代日本語にした。
- source_word: נִפְלְגָה
  choice: 分けられた
  rationale: ニファル形の受動的意味を保持し、ペレグという名との語音上の関連も可能な限り伝える。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 「全地」と「土地」の双方に開かれた日本語を選び、原語の範囲の曖昧さを本文で過度に限定しないようにした。
- source_word: וְשֵׁם אָחִיו
  choice: その兄弟の名は
  rationale: 兄か弟かを原文は特定しないため、「兄」や「弟」とせず「兄弟」とした。
- source_word: יָקְטָן
  choice: ヨクタン
  rationale: ヘブライ語の人名を日本語で一般的な形に音写した。
theological_decisions:
- issue: הָאָרֶץ が指す範囲
  choice: 本文では「地」とし、脚注で「全地」または「土地」の可能性を示す
  alternative: 「全地」または「土地」と本文で限定する
  rationale: 創世記10章の諸民族という広い文脈は「全地」を支持し得るが、語そのものは地域的な「土地」も意味する。歴史的な分割の範囲や仕組みを訳文で断定しないため、曖昧さを保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。系図の簡潔な文体を維持し、長い一文を適度に分けた。本文中に脚注記号[a]を付した。
