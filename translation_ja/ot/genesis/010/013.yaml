  yaml_path: translation/ot/genesis/010/013.yaml
  text: And Mizraim fathered the Ludim[a], the Anamim, the Lehabim[b], and the Naphtuhim.
translation:
  language: ja
  text: ミツライムは、ルディム人、アナミム人、レハビム人、ナフトヒム人[a]をもうけた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここに並ぶ名は、場所の名や後代の民族名に置き換えず、ヘブライ語の民族名を音写したもの。
    reason: cultural_note
  - marker: b
    text: 「生んだ」「父祖となった」とも訳せる。ヘブライ語では、子孫を生じさせたことを表す系図の標準的な語。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִצְרַיִם
  choice: ミツライム
  rationale: 諸国民の系図では、エジプトという地名に置き換えず、父祖を表す固有名としてヘブライ語形を音写した。
- source_word: יָלַד
  choice: 生んだ
  rationale: 系図で子孫をもうけたことを表す標準的な動詞である。日本語でも簡潔な系図表現として用い、ここでは諸民族の父祖となったことを示す。
- source_word: לוּדִים / עֲנָמִים / לְהָבִים / נַפְתֻּחִים
  choice: ルディム人／アナミム人／レハビム人／ナフトヒム人
  rationale: いずれも複数形の民族名として音写し、日本語で人々の集団であることが分かるよう「人」を添えた。不確かな後代の民族・地域との同定は本文に持ち込まない。
- source_word: אֶת
  choice: 訳語を置かない
  rationale: 目的語を示す文法標識であり、日本語では助詞「を」と語順によって機能を表した。
- source_word: וְ
  choice: 読点による並列
  rationale: 繰り返される接続詞は、日本語の列挙として自然になるよう読点で表した。
theological_decisions:
- issue: 個人の子らか、子孫である諸民族か
  choice: 民族名に「人」を添えつつ、系図動詞「生んだ」を保持した
  alternative: 「諸民族の祖となった」
  rationale: 目的語の複数形は民の集団を指す一方、原文は系図上の直接的な「生む」という表現を用いる。その比喩的・系図的な緊張を説明的な言い換えで消さないため。
translation_notes:
  register: 明瞭で簡潔な現代標準語。固有名は日本語で発音しやすい音写とし、列挙は読点で自然に整えた。「生んだ」は簡潔で格調ある系図表現として保持した。
