  text: オフィル、ハビラ、ヨバブ。これらは皆、ヨクタンの息子たち[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヨクタンの子孫」。ヘブライ語の「息子たち」は、系譜ではより広く子孫を指すこともあるが、ここでは直前まで名を挙げられた息子たちを指すと考えるのが最も自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: （目的語を示す語は訳出せず、列挙として表現）
  rationale: 前節から続く系譜の列挙で、反復される אֵת は各固有名を目的語として示す。日本語ではこれを個別に訳出せず、読点による自然な列挙とした。
- source_word: אוֹפִר
  choice: オフィル
  rationale: 固有名。日本語聖書で広く用いられる慣用的な音写を採用した。
- source_word: חֲוִילָה
  choice: ハビラ
  rationale: 固有名。原語の音形と日本語での慣用を踏まえて音写した。
- source_word: יוֹבָב
  choice: ヨバブ
  rationale: 固有名。原語の音形と日本語での慣用を踏まえて音写した。
- source_word: כָּל אֵלֶּה
  choice: これらは皆
  rationale: 列挙された者たちを総括する表現。明瞭で自然な現代日本語とした。
- source_word: בְּנֵי
  choice: 息子たち
  rationale: 系譜では広く「子孫」を指す場合もあるが、直前まで列挙された男子を指すこの文脈では、基本義の「息子たち」が最も自然である。
- source_word: יָקְטָן
  choice: ヨクタン
  rationale: 固有名。日本語聖書で広く用いられる慣用的な音写を採用した。
