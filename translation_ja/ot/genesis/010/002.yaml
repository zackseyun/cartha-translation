  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: ja
  text: ヤフェトの息子たちは、ゴメル、マゴグ、マダイ[a]、ヤワン、トバル、メシェク、ティラスである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後代の用法では、「マダイ」は「メディア人」、「ヤワン」は「イオニア」または「ギリシア人」を指すことがある。本文では、系図に記されたヘブライ語の名を音写した。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: 息子たち
  rationale: בֵּןの複数構文形で、系図における直接の男性子孫を示すため、意味を広げず「息子たち」とした。
- source_word: יֶפֶת
  choice: ヤフェト
  rationale: 固有名詞として、日本語聖書で広く認知される表記を用いた。
- source_word: גֹּמֶר
  choice: ゴメル
  rationale: この系図では個人名として機能するため、音写した。
- source_word: מָגוֹג
  choice: マゴグ
  rationale: 後代には民族・地域との関連を持ち得るが、ここでは系図上の名として音写した。
- source_word: מָדַי
  choice: マダイ
  rationale: メディア人を指す用法もあるが、本文では固有名として提示されているため、ヘブライ語形を音写した。
- source_word: יָוָן
  choice: ヤワン
  rationale: イオニアまたはギリシア人を指す用法もあるが、系図の形式を保つため固有名として音写した。
- source_word: תֻבָל
  choice: トバル
  rationale: 固有名詞として、ヘブライ語の形に基づき音写した。
- source_word: מֶשֶׁךְ
  choice: メシェク
  rationale: 固有名詞として音写した。
- source_word: תִירָס
  choice: ティラス
  rationale: 固有名詞として音写した。
