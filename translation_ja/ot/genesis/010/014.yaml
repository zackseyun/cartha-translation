id: GEN.10.14
reference: Genesis 10:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/014.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: ja
  text: また、パトロス人、カスル人（そこからペリシテ人が出た）、カフトル人を生んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そこからペリシテ人が出た」は、直前のカスル人に結び付けて「カスル人からペリシテ人が出た」と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: パトロス人
  rationale: 地名パトロスに由来する民名として、現代日本語で分かりやすい「〜人」の形にした。
- source_word: כַּסְלֻחִים
  choice: カスル人
  rationale: 同定が不確かな民名なので、意味を推測せずヘブライ語の音を写した。
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: そこから…が出た
  rationale: 直訳的な「そこから出た」を保ち、直前のカスル人だけを先行詞と断定しないようにした。
- source_word: פְּלִשְׁתִּים
  choice: ペリシテ人
  rationale: 日本語聖書で広く定着している民名を用いた。
- source_word: כַּפְתֹּרִים
  choice: カフトル人
  rationale: カフトルに関係する民名として、音写に「人」を添えた。
- source_word: וְאֶת
  choice: また、…を
  rationale: 系譜の目的語を連ねる接続表現として自然な日本語にした。
theological_decisions:
- issue: 「そこからペリシテ人が出た」という関係節の指示対象
  choice: 本文では「そこから」と訳して、ヘブライ語の場所・起源を示す表現を保持した。
  alternative: 「カスル人からペリシテ人が出た」として、直前の民名に明確に結び付ける。
  rationale: 直前のカスル人を指す可能性は高いが、原文は「彼らから」ではなく「そこから」と述べているため、曖昧さを残した。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。前節から続く系譜の文であるため、「生んだ」を補って統語関係を明確にした。脚注記号は節末に置き、関係節の曖昧さを説明した。
