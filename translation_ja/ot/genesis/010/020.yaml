  text: אֵ֣לֶּה בְנֵי חָ֔ם לְ/מִשְׁפְּחֹתָ֖/ם לִ/לְשֹֽׁנֹתָ֑/ם בְּ/אַרְצֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/020.yaml
  text: These are the sons of Ham[a], by their clans, by their languages, in their lands[b], by their nations.
translation:
  language: ja
  text: これらが、氏族ごと、言語ごと、土地ごと、民族ごとに分かれたハムの子孫[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「ハムの子ら」。系譜では後代の子孫をも含みうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以上が
  rationale: 直前までの系譜を総括する指示語として、現代日本語で自然な「以上が」とした。
- source_word: בְנֵי חָם
  choice: ハムの子孫
  rationale: 字義的には「ハムの息子たち」だが、この系譜の総括では後代を含む集団を指すため、「子孫」が文脈上明確である。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごと
  rationale: לְ の分類・区分の働きを「ごと」で表し、מִשְׁפָּחָה は個々の家庭より広い血縁集団なので「氏族」とした。
- source_word: לִלְשֹׁנֹתָם
  choice: 言語ごと
  rationale: לָשׁוֹן は字義的には「舌」だが、ここでは各集団が用いる言語を意味する。分類の働きも「ごと」で示した。
- source_word: בְּאַרְצֹתָם
  choice: それぞれの土地
  rationale: אֶרֶץ の複数形を、近代的な国民国家を連想させる「国家」ではなく「土地」と訳した。
- source_word: בְּגוֹיֵהֶם
  choice: それぞれの国民
  rationale: גּוֹי は氏族とは異なる民族的・政治的まとまりを表すため「国民」とし、複数の集団を「それぞれの」で示した。
theological_decisions:
- issue: 列挙された前置詞句の統語的関係
  choice: 「分かれていた」を補って、氏族・言語・土地・国民による区分を表した。
  alternative: 「その氏族、その言語、その土地、その国民ごとのハムの子ら」と名詞句のまま訳す。
  rationale: ヘブライ語は動詞を置かない総括文だが、反復される前置詞は分類と所在を示す。日本語では述語を補うことで意味を明確にしつつ、分類の各側面を並列に保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。系譜の総括として簡潔にし、氏族・言語・土地・国民という四つの区分を区別して示した。
