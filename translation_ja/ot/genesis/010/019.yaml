id: GEN.10.19
reference: Genesis 10:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יְהִ֞י גְּב֤וּל הַֽ/כְּנַעֲנִי֙ מִ/צִּידֹ֔ן בֹּאֲ/כָ֥ה גְרָ֖רָ/ה עַד עַזָּ֑ה בֹּאֲ/כָ֞ה סְדֹ֧מָ/ה וַ/עֲמֹרָ֛ה וְ/אַדְמָ֥ה וּ/צְבֹיִ֖ם עַד לָֽשַׁע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/019.yaml
  text: And the border of the Canaanites was from Sidon[a], as you go toward Gerar, as far as Gaza; and as you go toward Sodom and Gomorrah and Admah and Zeboiim, as far as Lasha.
translation:
  language: ja
  text: カナン人の境界は、シドンから、ゲラルの方へ進んでガザまで、またソドム、ゴモラ、アデマ、ツェボイムの方へ進んでラシャ[a]までであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「レシャ」。
    reason: 地名 לָשַׁע の音写には「ラシャ」と「レシャ」の二通りがあるため。
lexical_decisions:
- source_word: וַיְהִי
  choice: ～であった
  rationale: 物語を進める接続形であり、ここでは境界の所在を述べる連結辞として、現代日本語で自然な過去の叙述にした。
- source_word: גְּבוּל
  choice: 境界
  rationale: 領土そのものよりも、後続する地名によって示される境の線・範囲を指すため。
- source_word: הַכְּנַעֲנִי
  choice: カナン人
  rationale: 形態上は単数の民族呼称だが、ここでは集合的にカナンの民を指す。日本語では「カナン人」が自然に集合的意味を担う。
- source_word: מִצִּידֹן
  choice: シドンから
  rationale: 前置詞 מִן が境界記述の起点を示す。地名は日本語で一般的な表記「シドン」とした。
- source_word: בֹּאֲכָה
  choice: ～の方へ進んで
  rationale: 境界記述で、ある地点へ向かう方向・経路を示す慣用表現。「～に至る道筋で」と断定しすぎず、移動方向の含みを保った。
- source_word: גְרָרָה
  choice: ゲラルの方へ
  rationale: 方向を示す語尾を「の方へ」に反映し、地名は「ゲラル」と音写した。
- source_word: עַד
  choice: ～まで
  rationale: 境界が及ぶ終点を簡潔かつ明確に示す。
- source_word: עַזָּה
  choice: ガザ
  rationale: 日本語で定着した地名表記を用いた。
- source_word: סְדֹמָה וַעֲמֹרָה וְאַדְמָה וּצְבֹיִם
  choice: ソドム、ゴモラ、アデマ、ツェボイム
  rationale: 境界の方向を示す一連の地名として音写し、現代日本語で読みやすい列挙にした。
- source_word: לָשַׁע
  choice: ラシャ
  rationale: マソラ本文の母音 לָשַׁע を比較的直接に反映した音写。別表記の可能性は脚注に残した。
theological_decisions: []
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。古風な接続語を補わず、原文の二つの方向表現を「～の方へ進んで」で対応させた。脚注記号は該当地名「ラシャ」の直後に置いた。
