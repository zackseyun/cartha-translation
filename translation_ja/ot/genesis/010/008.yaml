id: GEN.10.8
reference: Genesis 10:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כ֖וּשׁ יָלַ֣ד אֶת נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽ/הְי֥וֹת גִּבֹּ֖ר בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/008.yaml
  text: And Cush fathered Nimrod[d][c][b][a]; he began to be a mighty man on the earth.
translation:
  language: ja
  text: クシュはニムロデをもうけた。ニムロデは地上で力ある者となり始めた。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「力ある者」は、「勇士」「英雄」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「地上で」は、「その地で」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכ֖וּשׁ
  choice: クシュは
  rationale: 接続詞וְは系図の流れを受けるが、日本語では節冒頭の「そして」を省くほうが自然である。固有名は一般的な聖書表記に従った。
- source_word: יָלַ֣ד
  choice: もうけた
  rationale: 系図における男性側の生殖・父系関係を、古風すぎない簡潔な日本語で表す。
- source_word: נִמְרֹ֑ד
  choice: ニムロデ
  rationale: 固有名として日本語聖書で広く用いられる形を採用した。
- source_word: ה֣וּא
  choice: ニムロデは
  rationale: 独立代名詞による主語の再提示を、日本語では固有名を繰り返して明確にした。
- source_word: הֵחֵ֔ל לִֽהְי֥וֹת
  choice: となり始めた
  rationale: 「最初の者となった」という優先性を加えず、開始・発端を示すヘブライ語を直接反映する。
- source_word: גִּבֹּ֖ר
  choice: 力ある者
  rationale: 強者、勇士、英雄などを含み得る語義の幅を保ち、軍事的意味だけに限定しない。
- source_word: בָּאָֽרֶץ
  choice: 地上で
  rationale: 創世記10章の諸民族の文脈では広い「地／世界」が自然であり、日本語として活動領域を自然に示す「地上で」とした。
theological_decisions:
- issue: הֵחֵל לִהְיוֹתの意味
  choice: となり始めた
  alternative: 最初に力ある者となった
  rationale: 原文は「始める」を表し得るが、時間的優先性を明示してはいないため、その解釈を本文に加えない。
- issue: גִּבּוֹרの人物像
  choice: 力ある者
  alternative: 勇士／英雄
  rationale: この節だけでは軍事的勇者や英雄に限定できないため、原語の広い意味を保つ。
- issue: אֶרֶץの範囲
  choice: 地上
  alternative: その地／国土
  rationale: 諸民族を扱う章全体の文脈では広域的な意味が有力だが、「地」の語義上の可能性は注で示す。
translation_notes:
  register: 明快な現代標準語を用い、系図らしい簡潔さと文体上の品位を保った。「もうけた」は自然な父系表現、「力ある者」は原語の曖昧さを保持する表現である。
