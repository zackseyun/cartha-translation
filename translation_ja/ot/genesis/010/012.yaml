  text: וְֽ/אֶת רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּ/בֵ֣ין כָּ֑לַח הִ֖וא הָ/עִ֥יר הַ/גְּדֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/012.yaml
  text: and Resen[a], between Nineveh and Calah[b]; that is the great city.
translation:
  language: ja
  text: また、ニネベとカラ[a]の間にレセンを建てた。それは大きな町であった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「カラ」は、アッシリア語形に基づいて「カルフ」とも表記される。
    reason: lexical_alternative
  - marker: b
    text: 「それは大きな町であった」は、レセンだけを指すとも、ニネベとカラの間に広がる都市地域を指すとも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֶת
  choice: また、…を
  rationale: 接続詞と目的語標識が、町を建てたという前節から続く列挙の次の項目を導く。日本語では「また」と目的格の「を」で自然に示した。
- source_word: רֶסֶן
  choice: レセン
  rationale: ヘブライ語の地名を、現代日本語で読みやすい形に音写した。
- source_word: בֵּין ... וּבֵין
  choice: …と…の間に
  rationale: 二地点の間という位置関係を示す相関的な前置詞構文を、自然な日本語で表した。
- source_word: נִינְוֵה
  choice: ニネベ
  rationale: 日本語聖書で広く定着している地名表記を用いた。
- source_word: כָּלַח
  choice: カラ
  rationale: ヘブライ語本文の地名を日本語で慣用的に音写した。アッシリア語形に基づく「カルフ」は脚注に残した。
- source_word: הִוא
  choice: これが
  rationale: 独立代名詞による再提示・繋辞的な働きを簡潔に表し、何を指すかは本文で説明し尽くさない形にした。
- source_word: הָעִיר הַגְּדֹלָה
  choice: 大きな町
  rationale: 定冠詞を伴う名詞句。גדול は規模と重要性の双方を含み得るが、ここでは意味を狭めない「大きな」を選び、自然な日本語として冠詞を逐語的には表さなかった。
theological_decisions:
- issue: 「これが大きな町である」の指示対象
  choice: 本文では「これが」とし、指示対象を明示的に限定しない。
  alternative: レセンだけを指すと明示する、またはニネベからカラに及ぶ都市圏全体を指すと明示する。
  rationale: ヘブライ語の הִוא が具体的にレセンを受けるのか、より広い都市地域を指すのかについて構文上の余地があるため、翻訳本文では曖昧さを保ち、脚注で説明した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。前節から続く都市建設の列挙であることを自然に示すため、ヘブライ語では省略されている動詞を文脈から「建てた」と補った。地名は日本語で定着した音写を優先し、解釈上の曖昧さは本文と脚注で保持した。
