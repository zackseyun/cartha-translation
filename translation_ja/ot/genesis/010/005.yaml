  text: מֵ֠/אֵלֶּה נִפְרְד֞וּ אִיֵּ֤י הַ/גּוֹיִם֙ בְּ/אַרְצֹתָ֔/ם אִ֖ישׁ לִ/לְשֹׁנ֑/וֹ לְ/מִשְׁפְּחֹתָ֖/ם בְּ/גוֹיֵ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/005.yaml
  text: From these the coastlands of the nations were separated in their lands[a], each according to his language, by their clans[c][b], in their nations.
translation:
  language: ja
  text: これらから、諸国民の沿岸地域[a]は、それぞれの土地で、言語ごとに[b]、氏族ごとに、国々として分かれていった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「諸国民の島々」とも訳せる。ヘブライ語は島と沿岸地域のどちらをも指し得る。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると「一人一人、その言語に従って」。ここでは配分を表し、「言語ごとに」という意味。
    reason: lexical_alternative
  - marker: c
    text: 「分離した」とも訳せる。この動詞は、互いに分かれること、または別々に広がることを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: これらから
  rationale: 前置詞 מִן と指示代名詞の組み合わせが、直前に挙げられた子孫を起点として示すため。
- source_word: נִפְרְדוּ
  choice: 分かれていった
  rationale: פרד のニファル形が表す分離・分散の意味を保ちつつ、諸集団が各地に分かれる文脈に合う自然な日本語とした。
- source_word: אִיֵּי הַגּוֹיִם
  choice: 諸国民の沿岸地域
  rationale: אִיִּים は島だけでなく沿岸地域も指し得る。構文上の「諸国民の」を保ち、地理的表現に含まれる換喩的な含みを解消しすぎないようにした。
- source_word: בְּאַרְצֹתָם
  choice: それぞれの地で
  rationale: 各集団が占める土地・領域を指す。日本語では「それぞれの地で」が簡潔で自然。
- source_word: אִישׁ לִלְשֹׁנוֹ
  choice: 言語ごとに
  rationale: 字義的には「一人一人、その言語に従って」だが、אִישׁ の配分的用法を日本語で自然に表した。
- source_word: לְמִשְׁפְּחֹתָם
  choice: 氏族ごとに
  rationale: מִשְׁפָּחָה はこの系譜的・民族的文脈では核家族より広い氏族集団を指す。
- source_word: בְּגוֹיֵהֶם
  choice: 国民ごとに
  rationale: 各々の民族・国民集団に即した区分を表す。原文の前置詞を機械的に「国民の中で」とせず、列挙される分類軸として自然に表現した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準語。「言語ごとに、氏族ごとに、国民ごとに」と並べ、原文の分類的なリズムを日本語で再現した。地理的名称が住民をも含意する原文の換喩は本文に残し、脚注で「島々」という語義上の別案を示した。
