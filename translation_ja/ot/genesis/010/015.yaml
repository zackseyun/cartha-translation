  text: וּ/כְנַ֗עַן יָלַ֛ד אֶת צִידֹ֥ן בְּכֹר֖/וֹ וְ/אֶת חֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/015.yaml
  text: And Canaan fathered Sidon his firstborn[a], and Heth.
translation:
  language: ja
  text: カナンは、長子シドンとヘト[a]をもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘトは、この系図の文脈でヒッタイト人と結び付けられる祖先である。
    reason: cross_reference
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: カナンは
  rationale: 接続詞וは系図の連続を示すが、日本語では文脈上明らかなため独立した「そして」を置かず、自然な主題提示とした。固有名כְנַעַןは慣用表記「カナン」とした。
- source_word: יָלַד
  choice: もうけた
  rationale: 系図において父として子孫を生じさせたことを表す。現代日本語として自然で、男性側の系譜関係を明確に示す。
- source_word: אֶת
  choice: 訳出しない
  rationale: 直接目的語を示す標識であり、日本語では目的語全体に付ける助詞「を」によって統語関係を表した。
- source_word: צִידֹן
  choice: シドン
  rationale: ヘブライ語固有名の日本語における一般的な慣用表記を用いた。
- source_word: בְּכֹר/וֹ
  choice: 長子
  rationale: 三人称男性単数接尾辞を伴い、シドンがカナンの最初に生まれた子であることを示す。主語がカナンであるため、日本語では「彼の」を補わず「長子」とするのが自然である。
- source_word: וְ/אֶת
  choice: と
  rationale: 第二の目的語ヘトをシドンと並列する接続として、日本語の「と」で表した。
- source_word: חֵת
  choice: ヘト
  rationale: 本文は民族名への説明的な言い換えをせず、個人名のみを記しているため、固有名として音写した。
theological_decisions: []
translation_notes:
  register: 簡潔な系図文として、現代の一般読者に分かりやすい「もうけた」を採用した。固有名は日本語聖書で広く通用する表記とし、原文にない民族名の説明は本文ではなく脚注に置いた。
