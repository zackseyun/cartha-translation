base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/003.yaml
  text: 'And the sons of Gomer: Ashkenaz[a], Riphath, and Togarmah.'
translation:
  language: ja
  text: ゴメルの息子たちは、アシュケナズ、リファト[a]、トガルマである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 歴代誌第一1章6節では「ディファト」となっている。
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 息子たちは
  rationale: בְּנֵי は構文形の複数で、系図の文脈に即して「息子たち」とした。接続詞 ו は、前節から続く一覧であることが日本語の文脈上明らかなため、独立した「そして」とせず自然な列挙文に整えた。
- source_word: גֹּמֶר
  choice: ゴメル
  rationale: 固有名詞として、一般的な日本語聖書表記に沿って音写した。
- source_word: אַשְׁכֲּנַז
  choice: アシュケナズ
  rationale: 固有名詞としてヘブライ語の発音に近い形で音写した。
- source_word: וְ/רִיפַת
  choice: リファト[a]
  rationale: WLC本文の רִיפַת を採用して音写した。並行箇所の異読は脚注に示した。接続詞は日本語の列挙形式で表現した。
- source_word: וְ/תֹגַרְמָה
  choice: トガルマ
  rationale: 固有名詞として音写し、語頭の接続詞は日本語の列挙形式によって表現した。
theological_decisions: []
translation_notes:
  register: 簡潔な系図の文体を保ちつつ、現代日本語として自然で格調を失わない表現とした。固有名詞は日本語で通用する音写を用い、本文と脚注の対応を明示した。
