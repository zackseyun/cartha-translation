  text: וּ/בְנֵ֖י אֲרָ֑ם ע֥וּץ וְ/ח֖וּל וְ/גֶ֥תֶר וָ/מַֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/023.yaml
  text: 'The sons of Aram: Uz[a], Hul, Gether, and Mash.'
translation:
  language: ja
  text: アラムの子らは、ウツ、フル、ゲテル、マシュ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 歴代誌第一1章17節のヘブライ語本文では「メシェク」。
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: 子らは
  rationale: בְּנֵי は構文上「～の子ら」を表す。系図の定型を保ちつつ、語頭の接続詞 וּ は、独立した節として自然な日本語にするため明示しない。
- source_word: אֲרָם
  choice: アラム
  rationale: 固有名詞として、現代日本語の聖書で理解しやすい慣用的な音写を用いる。
- source_word: עוּץ
  choice: ウツ
  rationale: ヘブライ語の固有名詞を日本語で簡潔に音写する。
- source_word: חוּל
  choice: フル
  rationale: 語頭の ח を日本語の慣用的な聖書人名表記に沿って「フ」とし、固有名詞を音写する。
- source_word: גֶתֶר
  choice: ゲテル
  rationale: ヘブライ語の固有名詞を日本語として読みやすく音写する。
- source_word: מַשׁ
  choice: マシュ
  rationale: 本文のマソラ本文は מַשׁ であるため、その読みを主本文に反映する。歴代誌第一1章17節の異読に相当する名は脚注で示す。
theological_decisions: []
translation_notes:
  register: 簡潔な系図の文体を保ち、現代標準日本語として自然で格調のある表現にした。原文には連結動詞がないため、日本語でも名簿形式の体言止めとした。英語相談層では脚注記号が「Uz」の後に置かれているが、脚注内容は מַשׁ の本文異同に関するため、日本語稿では「マシュ」の後に置いた。
