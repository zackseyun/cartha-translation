id: GEN.10.1
reference: Genesis 10:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי נֹ֔חַ שֵׁ֖ם חָ֣ם וָ/יָ֑פֶת וַ/יִּוָּלְד֥וּ לָ/הֶ֛ם בָּנִ֖ים אַחַ֥ר הַ/מַּבּֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/010/001.yaml
  text: 'These are the generations of the sons of Noah: Shem[a], Ham, and Japheth. And sons were born to them after the flood.'
translation:
  language: ja
  text: これは、ノアの息子たち、セム、ハム、ヤフェトの系譜[a]である。洪水の後、彼らには息子たちが生まれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「系譜」と訳したヘブライ語は、「子孫」、またはある人物から生じた事柄についての記録を広く指すことがある。
    reason: 創世記の定型的な見出し語 תּוֹלְדֹת が持つ意味の幅を示すため。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: これは
  rationale: 新しい区分を導入するヘブライ語の定型表現。日本語では、明示的な時間語を補わず「これは」とすることで、簡潔に見出しの働きを示した。
- source_word: תּוֹלְדֹת
  choice: 系譜
  rationale: 創世記で繰り返される構成上の見出し語であり、家系と、そこから生じた者たちについての記録を指し得る。「系譜」は定型性を保ちつつ、現代日本語で理解しやすい。意味の広がりは脚注で示した。
- source_word: בְּנֵי נֹחַ
  choice: ノアの息子たち
  rationale: 連語をそのまま明確に訳し、男性複数の語義を保持した。
- source_word: שֵׁם חָם וָיָפֶת
  choice: セム、ハム、ヤフェト
  rationale: 固有名詞として、日本語聖書で広く認識される音写を用いた。
- source_word: וַיִּוָּלְדוּ לָהֶם
  choice: 彼らには……が生まれた
  rationale: ' ילד のニファル形が表す受動的・自動詞的な「生まれる」を保ち、לָהֶם は所属・関係を自然な日本語の「彼らには」で表した。'
- source_word: בָּנִים
  choice: 息子たち
  rationale: 原文は男性複数を明示し、続く系譜も男子を列挙するため、性別を一般化せず訳した。
- source_word: אַחַר הַמַּבּוּל
  choice: 洪水の後
  rationale: 創世記の大洪水を指す時間表現として、明瞭で標準的な訳語を採用した。
theological_decisions:
- issue: 創世記の見出し語 תּוֹלְדֹת の訳し方
  choice: 系譜
  alternative: 子孫／由来についての記録
  rationale: 創世記全体を構成する反復表現であることを保つ一方、この語を単に子孫だけに限定しないよう、脚注で意味範囲を示した。
- issue: בָּנִים の性別表現
  choice: 息子たち
  alternative: 子どもたち
  rationale: 原語が男性を明示し、この箇所の系譜的文脈でも男子が扱われるため、「子どもたち」と一般化しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。見出しとしての簡潔さを優先し、不要な「さて」や「今」を補わなかった。第二文の接続詞 ו は、日本語では文脈上自然に連続性が伝わるため、独立した「そして」を置かずに表現した。
