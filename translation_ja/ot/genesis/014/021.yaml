  text: וַ/יֹּ֥אמֶר מֶֽלֶךְ סְדֹ֖ם אֶל אַבְרָ֑ם תֶּן לִ֣/י הַ/נֶּ֔פֶשׁ וְ/הָ/רְכֻ֖שׁ קַֽח לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/021.yaml
  text: Then the king of Sodom said to Abram[a], “Give me the people[b], and take the possessions for yourself.”
translation:
  language: ja
  text: そこで、ソドムの王はアブラムに言った。「人々[a]を私に渡せ。財産[b]はあなたが取れ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「その魂（いのち、人）」と単数形で、ここでは取り戻された人々を集合的に指す。
    reason: lexical_alternative
  - marker: b
    text: または「品物」「所有物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで、…言った
  rationale: 物語を前へ進めるワウ継続法の順接を、自然な現代日本語で表した。
- source_word: מֶלֶךְ סְדֹם
  choice: ソドムの王
  rationale: 連語の関係をそのまま明瞭に訳し、地名は日本語で定着した表記を用いた。
- source_word: אֶל אַבְרָם
  choice: アブラムに
  rationale: 前置詞 אֶל の方向・相手を、日本語の発話表現として自然な「に」で示した。
- source_word: תֶּן לִי
  choice: 私に返し
  rationale: 字義は「私に与えよ」だが、奪われた人々を取り戻した文脈では、日本語の「返す」が要求の意味を自然に伝える。命令の響きは後半との均衡を考慮して連用形で表した。
- source_word: הַנֶּפֶשׁ
  choice: 人々
  rationale: נֶפֶשׁ は単数形だが、ここでは回収された人を集合的に指す。「魂」ではなく、文脈に即して「人々」とした。
- source_word: וְהָרְכֻשׁ
  choice: 財産
  rationale: רְכוּשׁ は所有物、とりわけ物品・財物を指す。「人々」と対照させ、簡潔で広い意味を持つ「財産」とした。
- source_word: קַח לָךְ
  choice: あなたが取ってください
  rationale: לָךְ の受益・所有の含みを、主語「あなた」を明示して表現した。王の直接命令だが、現代日本語で不自然に粗暴にならない依頼命令形を用いた。
