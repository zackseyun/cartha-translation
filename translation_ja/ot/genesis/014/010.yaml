id: GEN.14.10
reference: Genesis 14:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עֵ֣מֶק הַ/שִׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַ/יָּנֻ֛סוּ מֶֽלֶךְ סְדֹ֥ם וַ/עֲמֹרָ֖ה וַ/יִּפְּלוּ שָׁ֑מָּ/ה וְ/הַ/נִּשְׁאָרִ֖ים הֶ֥רָ/ה נָּֽסוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/010.yaml
  text: The Valley of Siddim was full of bitumen pits[a], and the kings of Sodom and Gomorrah fled and fell there[c][b], while the rest fled to the hill country.
translation:
  language: ja
  text: シディムの谷には、瀝青の穴が至る所にあった[a]。ソドムとゴモラの王たちは逃げたが、そこで落ちた[b]。残った者たちは山地へ逃げた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「瀝青」は、天然のアスファルトまたはタール状の物質。原文は直訳すると「瀝青の穴、穴」で、穴が多くあったことを強調している。
    reason: lexical_alternative
  - marker: b
    text: 文脈上は瀝青の穴に落ちた可能性があるが、原文は「そこで落ちた」とだけ述べ、何に落ちたかを明示していない。
    reason: ambiguity
  - marker: c
    text: または「山々へ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵמֶק הַשִּׂדִּים
  choice: シディムの谷
  rationale: 固有の地名を伴う自然な日本語とし、原文にない時間表現は加えなかった。
- source_word: בֶּאֱרֹת בֶּאֱרֹת חֵמָר
  choice: 瀝青の穴が至る所にあった
  rationale: 名詞の反復が示す穴の多さを、明瞭な現代日本語で表した。חֵמָר は石油由来の粘着性物質であり、「瀝青」が正確である。
- source_word: מֶלֶךְ סְדֹם וַעֲמֹרָה
  choice: ソドムとゴモラの王たち
  rationale: 「王」は単数形だが、二つの都市と後続の複数動詞、および文脈から、それぞれの都市の王を指す集合的表現として訳した。
- source_word: וַיִּפְּלוּ שָׁמָּה
  choice: そこで落ちた
  rationale: נפל の基本義を保った。瀝青の穴に落ちた可能性は高いが、原文は目的語を明示していないため本文では補わない。
- source_word: וְהַנִּשְׁאָרִים
  choice: 残った者たち
  rationale: その場でなお逃げることのできた残りの者を指す、中立的で自然な表現とした。
- source_word: הֶרָה נָסוּ
  choice: 山地へ逃げた
  rationale: הַר に方向を示す語尾が付いた形を、地勢を表す自然な日本語にした。
theological_decisions:
- issue: 王たちが「落ちた」ことの具体的意味
  choice: そこで落ちた
  alternative: 瀝青の穴に落ちた／そこで倒された
  rationale: 原文の נפל と שָׁמָּה は「そこで落ちた」と読めるが、穴への転落、戦死、敗走などを明示してはいない。後の物語との緊張も解消せず、原文の曖昧さを保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準語を用いた。「瀝青」はやや専門的な語なので脚注で説明し、反復表現は「至る所に」で自然に伝えた。原文の短い物語的リズムと、「落ちた」の意図的な曖昧さを維持した。
