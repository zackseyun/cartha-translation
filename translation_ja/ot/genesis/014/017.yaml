source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֶֽלֶךְ סְדֹם֮ לִ/קְרָאת/וֹ֒ אַחֲרֵ֣י שׁוּב֗/וֹ מֵֽ/הַכּוֹת֙ אֶת כְּדָרלָעֹ֔מֶר וְ/אֶת הַ/מְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑/וֹ אֶל עֵ֣מֶק שָׁוֵ֔ה ה֖וּא עֵ֥מֶק הַ/מֶּֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/017.yaml
  text: Then the king of Sodom went out to meet him after his return from defeating Kedorlaomer and the kings who were with him[a], to the Valley of Shaveh (that is[b], the King's Valley).
translation:
  language: ja
  text: アブラムがケドルラオメルと彼と共にいた王たちを打ち破って帰還した後、ソドムの王は彼を迎えるため、シャベの谷、すなわち「王の谷」へ出て行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出て来た
  rationale: 物語を前に進める動詞として自然な日本語にし、話者の視点から相手を迎えに出る動きを表した。
- source_word: מֶלֶךְ סְדֹם
  choice: ソドムの王
  rationale: ヘブライ語の連語を簡潔に訳し、地名は日本語聖書で広く定着した表記を用いた。
- source_word: לִקְרָאתוֹ
  choice: 彼を迎えるため
  rationale: 単に会うだけでなく、相手のもとへ出向いて迎えるという文脈上の動きを自然に表した。
- source_word: אַחֲרֵי שׁוּבוֹ
  choice: アブラムが帰って来ると
  rationale: 接尾辞の指示対象は文脈上アブラムであるため明示し、時間的な前後関係を自然な日本語で示した。
- source_word: מֵהַכּוֹת
  choice: 打ち破って
  rationale: נכה の使役形がここでは軍事的勝利を表すため、殺害の範囲を不必要に確定せず、勝利を明瞭に伝える語を選んだ。
- source_word: כְּדָרלָעֹמֶר
  choice: ケドルラオメル
  rationale: ヘブライ語の子音と母音を踏まえつつ、日本語で読みやすい音写とした。
- source_word: וְאֶת־הַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: その配下の王たち
  rationale: 直訳は「彼と共にいた王たち」。軍事同盟における同行を簡潔に表す一方、ケドルラオメルとの関係を過度に制度化しない表現とした。
- source_word: אֶל עֵמֶק שָׁוֵה
  choice: シャベの谷へ
  rationale: אֶל の方向性を「へ」で保ち、地名 שָׁוֵה は音写した。
- source_word: הוּא עֵמֶק הַמֶּלֶךְ
  choice: すなわち「王の谷」
  rationale: 地名を同定する説明句として明瞭に訳した。引用符により固有の呼称であることを示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。長いヘブライ語文を、時間節を先に置く自然な日本語語順へ整えた。代名詞の曖昧さは文脈上必要な範囲でアブラムと明示した。
