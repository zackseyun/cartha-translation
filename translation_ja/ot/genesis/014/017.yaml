    issue: 「その配下の王たち」
    rationale: אֲשֶׁר אִתּוֹ は字義的には「彼と共にいた」であり、当該王たちのケドルラオメルへの従属・配下関係をこの句自体は明示しません。中立的な「彼と共にいた王たち」とする必要があります。
  - severity: low
    issue: 「出て来た」および「帰って来ると」
    rationale: どちらも日本語の話者・視点地点への「来る」を含みますが、原文はその視点を示しません。「出て行った」「帰還した後」とすることで、原文の叙述をより直接に保てます。
  revised_text: アブラムがケドルラオメルと彼と共にいた王たちを打ち破って帰還した後、ソドムの王は彼を迎えるため、シャベの谷、すなわち「王の谷」へ出て行った。
