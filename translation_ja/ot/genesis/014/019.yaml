base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/019.yaml
  text: And he blessed him and said[a], “Blessed be Abram by God Most High[b], possessor of heaven and earth.”
translation:
  language: ja
  text: 'そして彼を祝福して言った。


    「いと高き神、

    天と地の所有者[a]によって、

    アブラムが祝福されますように。[b]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天と地の創造者」。ヘブライ語の分詞は「所有者」「取得者」を意味し、文脈によっては「創造者」を意味することもある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「諸天と地」。ヘブライ語の「天」は形の上では複数形である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרְכֵהוּ
  choice: そして彼を祝福して
  rationale: 物語を進める接続形と三人称男性単数の目的語接尾辞を保ち、前後の流れに自然につながる現代日本語とした。
- source_word: וַיֹּאמַר
  choice: 言った
  rationale: 祝福の言葉を導入する通常の物語表現として簡潔に訳した。
- source_word: בָּרוּךְ
  choice: 祝福されよ
  rationale: 祝福定型句の荘重さと宣言的・祈願的な響きを保つ。「祝福されている」と断定する訳も可能だが、ここでは祝福の発話として自然な形を選んだ。
- source_word: אַבְרָם
  choice: アブラム
  rationale: この時点ではまだアブラハムへの改名以前なので、原文の名を音写した。
- source_word: לְאֵל
  choice: 神によって
  rationale: 祝福定型句における לְ を、祝福の源を示すものとして訳した。「神に属する祝福された者」といった関係的解釈も文法上考え得るが、文脈上は動作主・源を表す日本語が明瞭である。
- source_word: אֵל עֶלְיוֹן
  choice: いと高き神
  rationale: 神名的称号の意味と格調を保ちつつ、日本語で理解しやすい定着した表現を用いた。
- source_word: קֹנֵה
  choice: 所有する方
  rationale: קנה の分詞には「所有する」「取得する」のほか、文脈により「造る」の意味があり得る。本文では語の基本的な所有の意味を採り、創造者という可能性を脚注に残した。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天と地
  rationale: 被造世界全体を表す対句を、自然で格調ある日本語にした。形態上複数の שָׁמַיִם をより明示する別訳は脚注に示した。
theological_decisions:
- issue: 神への称号における קֹנֵה の意味
  choice: 天と地を所有する方
  alternative: 天と地を造った方
  rationale: この語は所有・取得と創造の両方の意味領域に関わり得るため、本文で一方を選びつつ、もう一方を脚注に明示して原文の語義上の緊張を保存した。
- issue: 祝福定型句の לְ の関係
  choice: いと高き神によって、アブラムは祝福されよ
  alternative: アブラムは、いと高き神に属する祝福された者である
  rationale: לְ は帰属・関係を示す可能性もあるが、この祝福の発話では神を祝福の源として読むのが自然であり、日本語でも明瞭である。ただし本文は神が祝福の源である以上の教派的含意を加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祝福の発話にふさわしい簡潔で荘重な調子を採用した。原文の詩的な並行性を見せるため改行した。「所有する方」は現代語として理解できる一方、脚注に「造った方」を置いて語義の曖昧さを保持した。
