  text: אִם מִ/חוּט֙ וְ/עַ֣ד שְׂרֽוֹךְ נַ֔עַל וְ/אִם אֶקַּ֖ח מִ/כָּל אֲשֶׁר לָ֑/ךְ וְ/לֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת אַבְרָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/023.yaml
  text: that I would not take from a thread to a sandal strap[a], or anything that is yours, lest you say, ‘I have made Abram rich.’
translation:
  language: ja
  text: 糸一本からサンダルのひも一本に至るまで[a]、あなたの所有物は何一つ受け取りません。あなたが『私がアブラムを富ませた』と言うことのないように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では省略された誓いの言い方で、直訳すると「もし糸一本からサンダルのひも一本に至るまで、また、もしあなたのものを何か受け取るなら……」となる。ここでは、何も受け取らないという誓いを意味する。
    reason: 原文の省略的な誓約表現と、本文で補った否定を説明するため。
lexical_decisions:
- source_word: אִם ... וְאִם
  choice: 何一つ受け取りません
  rationale: 前節で手を上げて誓ったことを受ける省略的な誓約表現。日本語では否定を明示して、誓いによる断固たる拒絶を自然に表した。
- source_word: מִחוּט וְעַד שְׂרוֹךְ נַעַל
  choice: 糸一本から履物のひも一本に至るまで
  rationale: 最小の品々を具体的に挙げる原文の表現を保った。「履物」は古代のサンダルを不必要に限定せず、現代日本語で明瞭である。
- source_word: אֶקַּח מִכָּל אֲשֶׁר לָךְ
  choice: あなたのものは何一つ受け取りません
  rationale: 所有の意味と כָּל の包括性を自然な日本語で表し、誓約文脈に即して未来の拒絶として訳した。
- source_word: וְלֹא תֹאמַר
  choice: そうすれば、あなたが…と言うことはありません
  rationale: アブラムが品物を拒む目的・結果を明瞭に示す。原文の接続の幅を保ちつつ、文脈上の意図が伝わる表現とした。
- source_word: הֶעֱשַׁרְתִּי אֶת אַבְרָם
  choice: 私がアブラムを富ませた
  rationale: עשר のヒフィル形の使役的意味「富ませる」を直接表した。
theological_decisions:
- issue: 省略された誓約構文
  choice: 否定を補い、何も受け取らないという誓いとして訳す
  alternative: 「もし糸一本から…もし私が受け取るなら」と条件文の形をそのまま残す
  rationale: אִם を用いる誓約では、違反した場合の帰結が省略される。前節の誓いと文脈により拒絶の意味は明白なので、日本語では否定を補う一方、脚注で原文の省略を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、誓いにふさわしい端正さを保った。「糸一本」「ひも一本」により具体性と最小物の強調を再現した。
