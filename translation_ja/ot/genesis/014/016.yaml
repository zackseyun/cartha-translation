source:
  edition: WLC
  text: וַ/יָּ֕שֶׁב אֵ֖ת כָּל הָ/רְכֻ֑שׁ וְ/גַם֩ אֶת ל֨וֹט אָחִ֤י/ו וּ/רְכֻשׁ/וֹ֙ הֵשִׁ֔יב וְ/גַ֥ם אֶת הַ/נָּשִׁ֖ים וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/016.yaml
  text: He brought back all the possessions[a]; he also brought back Lot his kinsman, and his possessions[d][c][b], and also the women and the people.
translation:
  language: ja
  text: 彼はすべての財産を取り戻した。また、親族であるロト[a]とその財産も取り戻し、さらに女たち[b]と人々も連れ戻した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼の兄弟ロト」。ここで「兄弟」は広く親族を指す。ロトはアブラムのおいである。
    reason: lexical_alternative
  - marker: b
    text: 「女たち」は文脈によっては妻たちを含み得るが、ヘブライ語そのものはそれより広い語である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב / הֵשִׁיב
  choice: 取り戻した／連れ戻した
  rationale: いずれも使役態のשׁובで、「戻らせる、取り戻す、連れ戻す」の意。目的語が財産の場合は「取り戻した」、人の場合は自然な日本語として「連れ戻した」とした。二つの動詞がある原文の構造も訳文に保った。
- source_word: כָּל הָרְכֻשׁ
  choice: すべての財産
  rationale: רְכוּשׁは所有物、財貨、家財を広く指す。「財産」は略奪されていた物品全体を自然かつ簡潔に表す。
- source_word: וְגַם
  choice: また／も／さらに
  rationale: 反復される添加の力を、日本語の文脈に応じて「また」「も」「さらに」で表した。
- source_word: לוֹט אָחִיו
  choice: 親族であるロト
  rationale: אָחִיוの字義は「彼の兄弟」だが、ここでは広い血縁関係を表す。物語上ロトはアブラムのおいなので、本文では誤解の少ない「親族」とし、字義を脚注に残した。
- source_word: וּרְכֻשׁוֹ
  choice: その財産
  rationale: 接尾辞はロトを指す。同節のרְכוּשׁと訳語をそろえた。
- source_word: הַנָּשִׁים
  choice: 女たち
  rationale: נָשִׁיםは文脈により「妻たち」ともなり得るが、ここではより広い通常の意味を保持した。
- source_word: הָעָם
  choice: 人々
  rationale: עָםは捕らえられていた集団全体を指し、男性だけに限定されないため「人々」とした。
theological_decisions: []
