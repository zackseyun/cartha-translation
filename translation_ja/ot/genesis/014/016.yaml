  register: 明瞭で格調を保った現代標準日本語。物と人に同じ動詞を機械的に当てず、「取り戻す」と「連れ戻す」を使い分けつつ、原文に二度現れる使役態動詞と、添加を示すוְגַםの反復を可視化した。
