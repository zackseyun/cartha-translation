  text: וַ/יֵּצֵ֨א מֶֽלֶךְ סְדֹ֜ם וּ/מֶ֣לֶךְ עֲמֹרָ֗ה וּ/מֶ֤לֶךְ אַדְמָה֙ וּ/מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִוא צֹ֑עַר וַ/יַּֽעַרְכ֤וּ אִתָּ/ם֙ מִלְחָמָ֔ה בְּ/עֵ֖מֶק הַ/שִּׂדִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/008.yaml
  text: Then the king of Sodom[a], the king of Gomorrah, the king of Admah, the king of Zeboiim, and the king of Bela (that is, Zoar) went out, and they drew up for battle with them in the Valley of Siddim.
translation:
  language: ja
  text: そこで、ソドムの王、ゴモラの王、アドマの王、ツェボイムの王、そしてベラ（すなわちツォアル）の王は出陣し、シディムの谷で彼らと戦うために陣を敷いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: そこで…出陣し
  rationale: 物語を進める接続形を「そこで」で表し、軍事的文脈における「出て行く」を自然な日本語の「出陣する」とした。動詞は単数形だが、後続する複合主語全体を受けるものとして訳した。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 各都市の支配者を表す標準的な訳語。原文の反復も保った。
- source_word: סְדֹם / עֲמֹרָה / אַדְמָה / צביים
  choice: ソドム／ゴモラ／アドマ／ツェボイム
  rationale: 日本語聖書で広く認知される地名表記を用いた。צביים は母音に沿って「ツェボイム」とした。
- source_word: בֶּלַע הִוא צֹעַר
  choice: ベラ（すなわちツォアル）
  rationale: הִוא が示す同定関係を、説明的な挿入として括弧内に明示した。
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: 迎え撃つために陣を敷いた
  rationale: ערך の軍事的用法である戦列の配置を「陣を敷く」で表した。מִלְחָמָה と אִתָּם を合わせ、敵対的な戦闘準備であることが自然に伝わるよう「迎え撃つために」とした。
- source_word: אִתָּם
  choice: 彼らを迎え撃つ
  rationale: 字義的には「彼らと」だが、戦闘を表す構文では敵対関係を示す。日本語で「彼らと戦いの陣を敷く」は不自然なため、文脈上の意味を自然に表した。
- source_word: בְּעֵמֶק הַשִּׂדִּים
  choice: シディムの谷で
  rationale: עֵמֶק を現代日本語の標準的な「谷」、地名 שִּׂדִּים を音写して「シディム」とした。
theological_decisions: []
