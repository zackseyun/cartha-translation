  text: וּ/בְ/אַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדָרְלָעֹ֗מֶר וְ/הַ/מְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יַּכּ֤וּ אֶת רְפָאִים֙ בְּ/עַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְ/אֶת הַ/זּוּזִ֖ים בְּ/הָ֑ם וְ/אֵת֙ הָֽ/אֵימִ֔ים בְּ/שָׁוֵ֖ה קִרְיָתָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/005.yaml
  text: In the fourteenth year[a], Kedorlaomer came, along with the kings who were with him, and they defeated the Rephaim at Ashteroth-karnaim, the Zuzim at Ham[c][b], and the Emim at Shaveh-kiriathaim.
translation:
  language: ja
  text: 第十四年に、ケドルラオメルと彼とともにいた王たちがやって来て、アシュテロト・カルナイムでレファイム人[a]を、ハムでズジム人を、シャベ・キルヤタイム[b]でエミム人を討ち破った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レファイム人」は民族・集団名として音写した。伝統的に「巨人」と訳されることもある。
    reason: lexical_alternative
  - marker: b
    text: 「シャベ・キルヤタイム」は、「キルヤタイムの平原」と理解することもできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַרְבַּע עֶשְׂרֵה שָׁנָה
  choice: 第十四年に
  rationale: 物語の時間を示す句として自然に訳した。冒頭の接続詞は、日本語では文脈上明らかなため明示しない。
- source_word: בָּא
  choice: やって来て
  rationale: 基本義である「来る」を保ち、軍事行動を意味する「進軍した」などの解釈を加えない。
- source_word: כְדָרְלָעֹמֶר
  choice: ケドルラオメル
  rationale: ヘブライ語の固有名を、現代日本語で読みやすい形に音写した。
- source_word: וְהַמְּלָכִים אֲשֶׁר אִתּוֹ
  choice: 彼とともにいた王たち
  rationale: 同行・同盟関係を表す原文を保ち、「配下」などの上下関係は付加しない。
- source_word: וַיַּכּוּ
  choice: 討ち破った
  rationale: 動詞 נכה の「打つ」という基本的な力を残しつつ、戦闘の文脈に合う自然な日本語とした。
- source_word: רְפָאִים
  choice: レファイム人
  rationale: 民族・集団名として音写し、「巨人」と解釈的に訳すことを避けた。
- source_word: בְּעַשְׁתְּרֹת קַרְנַיִם
  choice: アシュテロト・カルナイムの
  rationale: 戦いの場所を示す地名として音写し、日本語では対象となる民族名の前に置いた。
- source_word: הַזּוּזִים בְּהָם
  choice: ハムのズジム人
  rationale: ズジムを集団名、ハムを地名として音写し、簡潔な日本語の所在地表現にした。
- source_word: הָאֵימִים
  choice: エミム人
  rationale: 民族・集団名として音写した。
- source_word: בְּשָׁוֵה קִרְיָתָיִם
  choice: シャベ・キルヤタイムの
  rationale: 地名全体として音写しつつ、「シャベ」を普通名詞「平原」と取る可能性は注で示した。
theological_decisions:
- issue: レファイムの性格
  choice: 民族・集団名として「レファイム人」とする
  alternative: 「巨人たち」と訳す
  rationale: この節の構文では他の民族名と並んでおり、身体的特徴や超自然的性格まで本文から確定するべきではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。固有名は一貫して音写し、民族名には「人」を添えて一般読者に分かりやすくした。戦闘の叙述では簡潔な列挙のリズムを保った。
