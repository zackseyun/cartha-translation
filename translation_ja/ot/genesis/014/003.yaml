source:
  edition: WLC
  text: כָּל אֵ֨לֶּה֙ חָֽבְר֔וּ אֶל עֵ֖מֶק הַ/שִּׂדִּ֑ים ה֖וּא יָ֥ם הַ/מֶּֽלַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/003.yaml
  text: All these joined together in the Valley of Siddim (that is[a], the Salt Sea).
translation:
  language: ja
  text: これらは皆、シディムの谷、すなわち塩の海[a]に集結した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 後代の名称では「死海」。
    reason: 本文の「塩の海」に対応する、よく知られた後代の名称を示すため。
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: これらは皆
  rationale: 名詞を補わず、指示表現と全体性を自然な現代日本語で表した。文脈上は王たちを指すが、本文には「王」はないため加えない。
- source_word: חָבְרוּ
  choice: 集結した
  rationale: Qal形が表す「一つに集まる、合流する」という意味を、軍事的文脈にも合う簡潔な日本語で表した。「同盟を結んだ」では政治的意味を強く確定しすぎる。
- source_word: אֶל
  choice: に
  rationale: 集合の到達先・場所を示す語として、日本語では「に」が自然である。
- source_word: עֵמֶק הַשִּׂדִּים
  choice: シディムの谷
  rationale: עֵמֶקを基本義どおり「谷」とし、地名שִׂדִּיםは音写した。
- source_word: הוּא
  choice: すなわち
  rationale: 前の地名を後の名称で同定する説明的・同格的な働きを明確にした。
- source_word: יָם הַמֶּלַח
  choice: 塩の海
  rationale: ヘブライ語の名称を直接反映した。「死海」は後代・現代の通称として脚注に示す。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「集結した」により文脈上の共同集合を自然に示しつつ、「同盟」の成立までは本文で断定しない。脚注記号[a]は本文中の対応箇所に付した。
