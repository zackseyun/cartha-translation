lexical_decisions:
- source_word: שְׁתֵּים עֶשְׂרֵה שָׁנָה
  choice: 十二年間
  rationale: 期間を表すヘブライ語を、自然な日本語の継続期間として訳した。
- source_word: עָבְדוּ
  choice: 仕えていた
  rationale: 政治的文脈では従属国として宗主に仕えることを表す。「仕えていた」は原語の基本義を保ちつつ、反逆に至るまでの継続も自然に示す。
- source_word: אֶת כְּדָרְלָעֹמֶר
  choice: ケドルラオメル
  rationale: 人名をヘブライ語の子音形に即して音写した。
- source_word: וּשְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: しかし、十三年目に
  rationale: 字義的には「そして十三年」だが、十二年間の服属の後、十三年目に反逆したという時間的推移と対照を、明瞭で自然な日本語で示した。
- source_word: מָרָדוּ
  choice: 反逆した
  rationale: 宗主への政治的反抗を表すため、「反逆した」と訳した。
