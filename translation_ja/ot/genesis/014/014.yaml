id: GEN.14.14
reference: Genesis 14:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑י/ו וַ/יָּ֨רֶק אֶת חֲנִיכָ֜י/ו יְלִידֵ֣י בֵית֗/וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּ/שְׁלֹ֣שׁ מֵא֔וֹת וַ/יִּרְדֹּ֖ף עַד דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/014.yaml
  text: When Abram heard that his kinsman had been taken captive[a], he led out his trained men, born in his household, three hundred and eighteen[b], and pursued them as far as Dan.
translation:
  language: ja
  text: アブラムは、自分の兄弟[a]が捕虜になったと聞くと、自分の家で生まれた、訓練を受けた者たち三百十八人を招集し[b]、ダンまで彼らを追跡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟」に当たるヘブライ語は、おいなど近い男性親族を指すこともある。ここではロトを指す。
    reason: lexical_alternative
  - marker: b
    text: この動詞は「連れ出した」、あるいは「武装させた」とも理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: נִשְׁבָּה
  choice: 捕虜になった
  rationale: 戦争で捕らえられたことを表すשׁבהのニファル形を、軍事的な意味が明確な現代日本語で表した。
- source_word: אָחִיו
  choice: 自分の兄弟
  rationale: ロトはアブラムのおいだが、ヘブライ語אָחは近い男性親族を指すこともある。本文の表現を解釈的に狭めず、「兄弟」を残した。
- source_word: וַיָּרֶק
  choice: 招集し
  rationale: 語義には「連れ出す」「武装させる」などの議論があるため、一義に決めすぎず、追跡のため人員を集めて動かしたという文脈上の意味を表した。
- source_word: חֲנִיכָיו
  choice: 訓練を受けた者たち
  rationale: アブラムの権威のもとで訓練された者たちを指す。原文に明示されない身分を「僕」などで補わなかった。
- source_word: יְלִידֵי בֵיתוֹ
  choice: 自分の家で生まれた
  rationale: アブラムの家に属し、そこで生まれた者たちという社会的背景を、自然な日本語で保った。
- source_word: שְׁמֹנָה עָשָׂר וּשְׁלֹשׁ מֵאוֹת
  choice: 三百十八人
  rationale: ヘブライ語の人数を日本語の通常の数え方で表した。
- source_word: וַיִּרְדֹּף
  choice: 彼らを追跡した
  rationale: 軍事的な追跡を表す動詞であり、目的語は先行文脈に基づいて日本語で明示した。
- source_word: עַד דָּן
  choice: ダンまで
  rationale: עַדが示す追跡の到達範囲を簡潔に表した。
theological_decisions:
- issue: ロトを指す親族名称
  choice: 本文では「自分の兄弟」とする
  alternative: 自分の親族、身内
  rationale: אָחִיוの字面と意味の幅を保ち、ロトがおいであることに合わせて本文を解釈的に言い換えない。広い親族用法は脚注で説明する。
- issue: וַיָּרֶקの不確かな語義
  choice: 招集し
  alternative: 連れ出し、武装させ
  rationale: 語義上の議論を一方に決着させず、軍事行動のため配下を集めて出動させたという文脈を自然に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「兄弟」という原文の親族語と、語義に議論のある動詞の曖昧さを脚注とともに保持した。
