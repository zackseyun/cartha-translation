source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַבְרָ֖ם אֶל מֶ֣לֶךְ סְדֹ֑ם הֲרִימֹ֨תִי יָדִ֤/י אֶל יְהוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/022.yaml
  text: But Abram said to the king of Sodom[a], “I have raised my hand to Yahweh, God Most High[c][b], possessor of heaven and earth.”
translation:
  language: ja
  text: しかし、アブラムはソドムの王に言った。「私は天と地を所有するいと高き神ヤハウェに向かって手を上げた[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「手を上げた」は、誓いを立てる際のしぐさをいう。すなわち、アブラムはここで誓っている。「天と地を所有する」は「天と地を創造した」とも訳せる。ヘブライ語には「所有する」「取得する」のほか、文脈によっては「創造する」という意味もあり得る。
    reason: cultural_note; lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかし、……言った
  rationale: 物語を進める接続形だが、直前のソドムの王の申し出に対する対照的な応答なので、文脈上「しかし」が自然。
- source_word: הֲרִימֹתִי יָדִי
  choice: 私は……手を上げた
  rationale: 誓いを立てる際の具体的なしぐさを表すヘブライ語の慣用表現を本文に残し、その意味を脚注で説明する。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語の標準的な音写で示す。
- source_word: אֵל עֶלְיוֹן
  choice: いと高き神
  rationale: 神の至高性を表す称号として、明瞭で格調ある日本語に訳す。
- source_word: קֹנֵה
  choice: 所有される方
  rationale: この分詞の基本的な「取得する、所有する」という意味を保つ。「創造する方」という理解も可能なので脚注に示す。
- source_word: שָׁמַיִם וָאָרֶץ
  choice: 天と地
  rationale: 被造世界全体を指す定型的な組み合わせとして、自然な日本語で表現する。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号で代替せず、音写して保持する。
- issue: קֹנֵה שָׁמַיִם וָאָרֶץ の意味
  choice: 天と地を所有される方
  alternative: 天と地を創造された方
  rationale: 語が持つ所有・取得と創造の意味範囲を一方に断定しない。本文では語彙的に直接的な「所有」を採り、重要な別解を脚注で保存する。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で格調ある叙述。「所有される」は敬語ではなく、神を主語とする尊敬表現。誓いの慣用句は直訳を保ち、脚注で文化的意味を補った。
