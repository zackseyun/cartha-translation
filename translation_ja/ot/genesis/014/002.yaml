  text: עָשׂ֣וּ מִלְחָמָ֗ה אֶת בֶּ֨רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְ/אֶת בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב מֶ֣לֶךְ אַדְמָ֗ה וְ/שֶׁמְאֵ֨בֶר֙ מֶ֣לֶךְ צביים וּ/מֶ֥לֶךְ בֶּ֖לַע הִיא צֹֽעַר־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/002.yaml
  text: they made war against Bera king of Sodom[a], Birsha king of Gomorrah, Shinab king of Admah, Shemeber king of Zeboiim, and the king of Bela (that is[c][b], Zoar).
translation:
  language: ja
  text: 彼らは、ソドムの王ベラ、ゴモラの王ビルシャ、アデマの王シンアブ、ツェボイムの王シェムエベル、およびベラ（すなわちツォアル）の王と戦った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָשׂוּ מִלְחָמָה
  choice: 戦った
  rationale: 直訳は「戦いを行った」だが、現代日本語では「戦った」が簡潔で自然であり、戦争をしたという意味を十分に伝える。
- source_word: אֶת ... וְאֶת
  choice: …と戦った
  rationale: この文脈では、目的語標識が戦いの相手を示す。日本語では敵対する相手も助詞「と」で自然に表せるため、列挙された五者すべてを「戦った」に係らせた。
- source_word: בֶּרַע
  choice: ベラ
  rationale: 人名としてヘブライ語の音を日本語で慣用的に表記した。
- source_word: בִּרְשַׁע
  choice: ビルシャ
  rationale: 人名として音写した。
- source_word: שִׁנְאָב
  choice: シンアブ
  rationale: 人名として音写した。
- source_word: שֶׁמְאֵבֶר
  choice: シェムエベル
  rationale: 人名として音写した。
- source_word: צביים
  choice: ツェボイム
  rationale: 地名の子音とマソラ本文の発音を踏まえて音写した。
- source_word: מֶלֶךְ בֶּלַע
  choice: ベラの王
  rationale: この最後の王だけは個人名が記されず、都市名によって特定されているため、その違いを保持した。
- source_word: הִיא צֹעַר
  choice: すなわちツォアル
  rationale: ベラという町がツォアルであることを説明する同格的な補足として、自然で明確な日本語にした。
