id: GEN.14.18
reference: Genesis 14:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מַלְכִּי צֶ֨דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָ/יָ֑יִן וְ/ה֥וּא כֹהֵ֖ן לְ/אֵ֥ל עֶלְיֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/018.yaml
  text: And Melchizedek king of Salem brought out bread and wine[b][a]. He was a priest of God Most High.
translation:
  language: ja
  text: サレムの王メルキゼデクは、パンとぶどう酒を持って来た。彼は至高の神[a]の祭司であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「エル・エルヨン」。
    reason: 原語では神を指す呼称אֵל עֶלְיוֹןが用いられており、その音写形も参照できるようにするため。
lexical_decisions:
- source_word: מַלְכִּי צֶדֶק
  choice: メルキゼデク
  rationale: 人名として、その意味を本文中で訳さず、日本語で定着した形に音写した。
- source_word: מֶלֶךְ שָׁלֵם
  choice: サレムの王
  rationale: מֶלֶךְを「王」、地名שָׁלֵםを定着した音写「サレム」とし、自然な日本語の連体表現にした。
- source_word: הוֹצִיא
  choice: 持って来た
  rationale: ヒフィル形の「外へ出す、持ち出す」という具体的な動作を、文脈に即した自然な現代日本語で表した。「運び出した」も可能だが、出発地点を不必要に強調しない表現を選んだ。
- source_word: לֶחֶם וָיָיִן
  choice: パンとぶどう酒
  rationale: 両語の通常の具体的意味をそのまま訳し、後代の祭儀的含意を本文へ持ち込まなかった。
- source_word: כֹהֵן
  choice: 祭司
  rationale: 礼拝に仕える職務を表す標準的な訳語であり、後代のイスラエル祭司制度の細部までは読み込まない。
- source_word: אֵל עֶלְיוֹן
  choice: 至高の神
  rationale: 神名・称号の意味を明瞭で品位ある現代日本語に訳した。「いと高き神」より現代の一般読者に理解しやすい。
- source_word: וְהוּא
  choice: 彼は…であった
  rationale: 接続詞を伴う独立代名詞がメルキゼデクの身分を際立たせて新しい節を始めるため、日本語では文を分けて明示した。
theological_decisions:
- issue: パンとぶどう酒に後代の聖餐的意味を明示するか
  choice: 単純な歴史的叙述として「パンとぶどう酒を持って来た」とした
  alternative: 聖餐の予型を示唆する表現を加える
  rationale: 創世記14章18節自体は、メルキゼデクがパンとぶどう酒を持って来たことを述べるだけであり、後代の神学的解釈を本文に付加しないため。
- issue: אֵל עֶלְיוֹןを固有名として音写するか、称号として訳すか
  choice: 「至高の神」と訳した
  alternative: 「エル・エルヨン」と音写する
  rationale: この句の意味を日本語読者に明確に伝えつつ、原語形は脚注に保存した。固有名か称号かという見方を必要以上に断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある歴史叙述とした。文頭のוּは日本語で不自然な接続語を置かず、文脈上の連続性に委ねた。
