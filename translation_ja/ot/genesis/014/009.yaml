source:
  edition: WLC
  text: אֵ֣ת כְּדָרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְ/תִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְ/אַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְ/אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת הַ/חֲמִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/009.yaml
  text: Chedorlaomer king of Elam[a], Tidal king of Goiim, Amraphel king of Shinar, and Arioch king of Ellasar—four kings against the five.
translation:
  language: ja
  text: エラムの王ケドルラオメル、ゴイム[a]の王ティドアル、シンアルの王アムラフェル、エラサルの王アルヨク。四人の王が五人の王を相手に戦った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「諸国民の王ティドアル」。ヘブライ語の「ゴイム」は普通名詞で「諸国民」を意味するが、ここでは地名である可能性もある。
    reason: alternative_reading
lexical_decisions:
- source_word: אֵת ... אֶת
  choice: …を相手に戦った
  rationale: この戦闘の王名表では、通常は目的語を示す אֵת が両陣営の対立関係を表している。日本語でその関係を自然に明示するため、「四人の王が五人の王を相手に戦った」とした。
- source_word: כְּדָרְלָעֹמֶר
  choice: ケドルラオメル
  rationale: 人名として、ヘブライ語の形に沿いつつ日本語で読みやすく音写した。
- source_word: מֶלֶךְ עֵילָם
  choice: エラムの王
  rationale: 連語を簡潔かつ直接的に訳した。
- source_word: תִדְעָל
  choice: ティドアル
  rationale: 人名として音写した。
- source_word: גּוֹיִם
  choice: ゴイム
  rationale: 王号に伴う地名である可能性を重視して音写した。ただし、普通名詞「諸国民」と読む余地を脚注に残した。
- source_word: אַמְרָפֶל
  choice: アムラフェル
  rationale: 人名として音写した。
- source_word: שִׁנְעָר
  choice: シンアル
  rationale: 歴史地理上の同定を本文に持ち込まず、ヘブライ語の地名を音写した。
- source_word: אַרְיוֹךְ
  choice: アルヨク
  rationale: 人名として音写した。
- source_word: אֶלָּסָר
  choice: エラサル
  rationale: 推測的な地域同定を避け、固有地名として音写した。
- source_word: אַרְבָּעָה מְלָכִים
  choice: 四人の王
  rationale: 数詞と名詞を直接訳し、日本語では人を数える助数表現を用いた。
- source_word: הַחֲמִשָּׁה
  choice: 五人の王
  rationale: 直訳は「その五人」だが、前後関係から省略されている「王」を補い、現代日本語で明瞭にした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある叙述とした。原文は動詞を省いた戦闘参加者の列挙だが、この節を単独でも自然に理解できるよう、文脈上の戦闘を「戦った」と明示した。固有名は歴史的同定で置き換えず音写し、「ゴイム」の語義上の曖昧さは脚注で保持した。
