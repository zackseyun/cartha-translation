lexical_decisions:
- source_word: וְאֶת
  choice: また、…を…討った
  rationale: 前節から続く討伐対象の列挙である。目的語標識自体は訳さず、文脈から動詞「討った」を補って自然な日本語にした。
- source_word: הַחֹרִי
  choice: フリ人
  rationale: 民族名を日本語聖書で広く用いられる形に音写し、集合的複数として表した。
- source_word: בְּהַרְרָם שֵׂעִיר
  choice: セイルの山地に住む
  rationale: 字義的には「彼らの山々、セイル」。場所と住民との関係を明瞭にしつつ、山岳地域を表す自然な日本語とした。
- source_word: עַד
  choice: …まで
  rationale: 軍事行動の地理的な到達範囲を示す。
- source_word: אֵיל פָּארָן
  choice: エル・パラン
  rationale: 固定した地名として音写し、אֵילを「樫の木」などと断定しないことで語源上の曖昧さを保った。
- source_word: אֲשֶׁר עַל הַמִּדְבָּר
  choice: 荒野のほとりにある
  rationale: この場所を荒野との位置関係によって示す節であり、עַלの幅のある空間的意味を自然な日本語で表した。
