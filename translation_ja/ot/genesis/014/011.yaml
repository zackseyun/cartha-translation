  yaml_path: translation/ot/genesis/014/011.yaml
  text: Then they took all the possessions of Sodom and Gomorrah[a], and all their food, and went away.
translation:
  language: ja
  text: 彼らはソドムとゴモラのすべての財物と、すべての食糧[a]を取って、去って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「食べ物」。ヘブライ語は一般的な食べ物を指すほか、旅や軍事行動のための食料を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 奪い取り
  rationale: 基本義は「取る」だが、戦勝者が町の財物と食糧を持ち去る文脈を自然な現代日本語で表すため「奪い取り」とした。
- source_word: כָּל
  choice: すべての
  rationale: 財物と食糧の双方に繰り返される包括性を保持した。
- source_word: רְכֻשׁ
  choice: 財物
  rationale: 動産、所有物、物資を広く指す語であり、略奪された品々を具体的かつ簡潔に表せる。
- source_word: סְדֹם וַעֲמֹרָה
  choice: ソドムとゴモラ
  rationale: 日本語聖書で広く定着した地名表記を用いた。
- source_word: אָכְלָם
  choice: 食糧
  rationale: 名詞 אֹכֶל と三人称男性複数接尾辞から成り、「彼らの食べ物」を意味する。文脈に合う簡潔な表現として「食糧」を選び、軍事行動のための「糧食・物資」の可能性は脚注に残した。
- source_word: וַיֵּלֵכוּ
  choice: 立ち去った
  rationale: 略奪の後、その場を去ったという物語の進行を自然に示す。
