lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 奪い
  rationale: 基本義は「取る」だが、戦勝者が人と財産を連行・略奪する文脈なので、日本語では「奪う」が自然である。動詞自体以上に暴力性を強調しないよう、「捕らえた」などとはしない。
- source_word: רְכֻשׁוֹ
  choice: その財産
  rationale: רְכוּשׁは、とりわけ携行・移動可能な所有物を指す。「財産」は現代日本語で明快であり、この略奪の文脈にも合う。
- source_word: בֶּן אֲחִי אַבְרָם
  choice: アブラムのおい
  rationale: 直訳は「アブラムの兄弟の息子」。日本語では親族関係を自然かつ正確に表す「おい」を本文に用い、原文の表現を脚注で示す。
- source_word: וַיֵּלֵכוּ
  choice: 立ち去った
  rationale: הלךの基本義は「行く」。ここでは人と財産を奪った者たちがその場から去るため、「立ち去った」が自然である。
- source_word: וְהוּא יֹשֵׁב בִּסְדֹם
  choice: ロトはソドムに住んでいたのである
  rationale: 分詞יֹשֵׁבは継続的な居住を表す。主語を「ロト」と明示し、この節が彼が捕らえられた背景を説明することを自然な日本語で表した。
