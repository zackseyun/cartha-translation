  text: וַ/יָּבֹא֙ הַ/פָּלִ֔יט וַ/יַּגֵּ֖ד לְ/אַבְרָ֣ם הָ/עִבְרִ֑י וְ/הוּא֩ שֹׁכֵ֨ן בְּ/אֵֽלֹנֵ֜י מַמְרֵ֣א הָ/אֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַ/אֲחִ֣י עָנֵ֔ר וְ/הֵ֖ם בַּעֲלֵ֥י בְרִית אַבְרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/013.yaml
  text: Then a fugitive came and told Abram the Hebrew[a]. Now he was dwelling by the oaks of Mamre the Amorite, brother of Eshcol and brother of Aner[c][b]; these were allies of Abram.
translation:
  language: ja
  text: その時、逃れてきた者が、ヘブライ人アブラムに知らせた。アブラムは、アモリ人マムレの樫の木々[a]のそばに住んでいた。マムレはエシュコルの兄弟であり、アネルの兄弟でもあった[b]。この三人はアブラムと同盟を結んでいた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「マムレのテレビンの木々」とも訳せる。ヘブライ語は大木を指し、樫またはテレビンの木と理解されることがある。
    reason: lexical_alternative
  - marker: b
    text: 「エシュコルの親族、またアネルの親族」とも訳せる。「兄弟」に当たるヘブライ語は、より広い親族関係を指すこともある。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「アブラムとの契約の所有者たち」。すなわち、盟約によってアブラムと結ばれていた人々を指す。
    reason: cultural_note
lexical_decisions:
- source_word: הַפָּלִיט
  choice: 逃れて来た者
  rationale: 戦いや危険から脱出した者を指す。文脈上、逃走中の犯罪者を連想させやすい「逃亡者」よりも、脱出という動作を明確に表す。
- source_word: וַיַּגֵּד
  choice: 知らせた
  rationale: 情報を告げるという基本義を、簡潔で自然な日本語の物語表現にした。
- source_word: הָעִבְרִי
  choice: ヘブライ人
  rationale: アブラムに付された民族的・社会的呼称を、定着した日本語でそのまま保持した。
- source_word: שֹׁכֵן
  choice: 住んでいた
  rationale: 分詞が表す当時の継続的な居住状態を自然に示す。
- source_word: בְּאֵלֹנֵי מַמְרֵא
  choice: マムレの樫の木々のそばに
  rationale: אֵלוֹן の樹種には幅があるが、本文では日本語としてなじみのある「樫」を採用し、テレビンの木の可能性を脚注に残した。前置詞 בְּ はこの地勢表現では「そばに」とした。
- source_word: הָאֱמֹרִי
  choice: アモリ人
  rationale: マムレを説明する民族名として標準的な音写を用いた。
- source_word: אֲחִי אֶשְׁכֹּל וַאֲחִי עָנֵר
  choice: エシュコルの兄弟、またアネルの兄弟
  rationale: אָח の通常の意味である「兄弟」を本文に置き、より広い親族関係の可能性は脚注で示した。原文の反復も保持した。
- source_word: בַּעֲלֵי בְרִית אַבְרָם
  choice: アブラムと同盟を結んでいた者たち
  rationale: 字義的には「アブラムとの契約の所有者たち」だが、ここでは条約・盟約によって結ばれた関係を指すため、現代日本語で明瞭に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の流れを自然にしつつ、「ヘブライ人」「兄弟」「契約に基づく同盟」という原文の主要な表現と曖昧さを保持した。固有名は一般的な聖書日本語表記を採用した。
