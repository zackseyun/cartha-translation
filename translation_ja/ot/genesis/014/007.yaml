source:
  edition: WLC
  text: וַ֠/יָּשֻׁבוּ וַ/יָּבֹ֜אוּ אֶל עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַ/יַּכּ֕וּ אֶֽת כָּל שְׂדֵ֖ה הָ/עֲמָלֵקִ֑י וְ/גַם֙ אֶת הָ֣/אֱמֹרִ֔י הַ/יֹּשֵׁ֖ב בְּ/חַֽצְצֹ֥ן תָּמָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/007.yaml
  text: Then they turned back and came to En-mishpat (that is[a], Kadesh), and struck all the country of the Amalekites[c][b], and also the Amorites who were living in Hazazon-tamar.
translation:
  language: ja
  text: 彼らは引き返して、エン・ミシュパト[a]、すなわちカデシュに来た。そして、アマレク人の全土[b]を討ち、さらにハツェツォン・タマル[c]に住んでいたアモリ人をも討った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エン・ミシュパト」は「裁きの泉」という意味。
    reason: cultural_note
  - marker: b
    text: 直訳は「アマレク人のすべての野」。ここでは、アマレク人が住んでいた土地一帯を指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: ハツェツォン・タマルは、歴代誌第二20章2節でエン・ゲディと同定されている。
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 彼らは引き返して
  rationale: 物語の連続した動作を表す形であり、文脈上は進行方向を変えて戻る意味なので、「引き返して」とした。
- source_word: וַיָּבֹאוּ אֶל
  choice: ～に来た
  rationale: בוא と אֶל の組み合わせを自然な現代日本語で表し、前の「引き返して」に続く到着を示した。
- source_word: עֵין מִשְׁפָּט
  choice: エン・ミシュパト
  rationale: 地名として音写した。語義は本文で訳し込まず、脚注で示した。
- source_word: הִוא קָדֵשׁ
  choice: （すなわちカデシュ）
  rationale: 前の地名をカデシュと同定する説明的な挿入句として明確に表した。
- source_word: וַיַּכּוּ
  choice: 討った
  rationale: נכה は「打つ、討つ」の幅を持つ。「滅ぼした」「征服した」と結果を過度に限定せず、軍事的文脈に自然な「討った」とした。
- source_word: כָּל שְׂדֵה הָעֲמָלֵקִי
  choice: アマレク人の全地域
  rationale: שָׂדֶה の字義は「野、畑」だが、ここではアマレク人が占める土地一帯を指すと考えられるため、「全地域」とした。集合的な民族名は日本語で「アマレク人」とした。
- source_word: וְגַם
  choice: さらに～をも
  rationale: 次の攻撃対象を付加する強調を、日本語として自然な「さらに…をも」で保った。
- source_word: אֶת הָאֱמֹרִי הַיֹּשֵׁב
  choice: 住んでいたアモリ人を
  rationale: 民族形容詞の集合的意味と、分詞が表す継続的居住を自然な日本語で表した。
- source_word: בְּחַצְצֹן תָּמָר
  choice: ハツェツォン・タマルに
  rationale: 地名を音写し、居住地を示す前置詞 בְּ を「に」で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「撃破した」のように勝敗を断定する表現を避け、「討った」で原語の意味の幅を保持した。地名は一般的な聖書音写に沿い、説明は脚注に分けた。
