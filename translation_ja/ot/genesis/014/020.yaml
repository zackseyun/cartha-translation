id: GEN.14.20
reference: Genesis 14:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר מִגֵּ֥ן צָרֶ֖י/ךָ בְּ/יָדֶ֑/ךָ וַ/יִּתֶּן ל֥/וֹ מַעֲשֵׂ֖ר מִ/כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/020.yaml
  text: And blessed be God Most High[a], who delivered your enemies into your hand[b]. And he gave him a tenth of everything.
translation:
  language: ja
  text: 'また、いと高き神がほめたたえられますように。


    神はあなたの敵をあなたの手に渡してくださった。」


    そしてアブラムは、すべてのものの十分の一を彼に与えた。[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「与えた」の主語が明示されていない。文脈上、アブラムがメルキゼデクに、すべてのものの十分の一を与えたという意味に取るのが最も自然である。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבָרוּךְ
  choice: また、…ほめたたえられますように
  rationale: 祝福の宣言を表す受動分詞を、現代日本語で自然かつ荘重な祈願表現として訳した。接続詞 וּ は「また」で示した。
- source_word: אֵל עֶלְיוֹן
  choice: いと高き神
  rationale: 神の称号としての אֵל を「神」、最上位・至高を表す עֶלְיוֹן を、聖書的な荘重さを保ちながら理解しやすい「いと高き」とした。
- source_word: מִגֵּן
  choice: 渡されました
  rationale: ここでは「盾となる」ではなく、敵を相手の支配下へ引き渡すという動詞の用法。続く「あなたの手に」と合わせて軍事的勝利の授与を表す。
- source_word: צָרֶיךָ
  choice: あなたの敵
  rationale: 敵対する者たちを指す複数形。日本語では集合的に「敵」とするのが自然で明瞭。
- source_word: בְּיָדֶךָ
  choice: あなたの手に
  rationale: 相手の支配・力のもとへ渡すというヘブライ語の具体的な慣用表現を保持した。
- source_word: מַעֲשֵׂר
  choice: 十分の一
  rationale: 語の基本義を直接示し、後代の制度的含意を帯びやすい「十分の一税」などを避けた。
- source_word: מִכֹּל
  choice: すべての物の
  rationale: 全体から取られた十分の一という包括的意味を、自然な日本語で表した。
theological_decisions:
- issue: וַיִּתֶּן の省略された主語
  choice: 文脈に基づき「アブラム」を主語として補った
  alternative: 主語を明示せず「そして、すべての物の十分の一を彼に与えた」とする、またはメルキゼデクを主語と取る
  rationale: ヘブライ語本文はこの節で主語を明示していないが、物語の文脈ではアブラムがメルキゼデクに与えたと取るのが最も自然である。本文の明瞭さのため主語を補い、原文上の省略と別解の可能性は脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祝福の言葉には「いと高き」「ほめたたえられますように」という荘重な表現を用いた。引用の閉じ括弧は、前節から続くメルキゼデクの発言の終わりを示す。
