  terminology: 「いと高き神」は אֵל עֶלְיוֹן の定着した意味を自然に表しています。「十分の一」は מַעֲשֵׂר の基本義を適切に保っています。「あなたの手に」は支配・勝利を表す原文の比喩を保持しています。
