  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בִּלְעָדַ֗/י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַ/נְּעָרִ֔ים וְ/חֵ֨לֶק֙ הָֽ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑/י עָנֵר֙ אֶשְׁכֹּ֣ל וּ/מַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽ/ם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/024.yaml
  text: I will take nothing except only what the young men have eaten[a], and the share of the men who went with me—Aner, Eshcol, and Mamre[c][b]. Let them take their share.
translation:
  language: ja
  text: ただし、若者たちが食べた分[a]と、私と共に行った人々、すなわちアネル、エシュコル、マムレの取り分だけは別です。彼らには自分たちの取り分を受け取らせてください[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「若者たち」は「従者たち」とも訳せる。ヘブライ語は、若者のほか、仕える者や随行者を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: または「彼らは自分たちの取り分を受け取ります」。ヘブライ語の動詞形は単純な未来とも読めるが、ここでは許可・要請を表すと理解した。
    reason: alternative_reading
lexical_decisions:
- source_word: בִּלְעָדַי רַק
  choice: ただし……だけは別です
  rationale: 前節から続くアブラムの受け取り拒否を補いつつ、二つの限定表現が示す強い例外を、自然な現代日本語で表した。
- source_word: אֲשֶׁר אָכְלוּ הַנְּעָרִים
  choice: 若者たちが食べた分
  rationale: נְעָרִים の基本的な意味である「若者たち」を本文に採用し、文脈上可能な「従者たち」は脚注に残した。
- source_word: וְחֵלֶק הָאֲנָשִׁים אֲשֶׁר הָלְכוּ אִתִּי
  choice: 私と共に行った人々……の取り分
  rationale: חֵלֶק を戦利品の分配に自然な「取り分」とし、הלך の移動・同行の意味を「共に行った」で保った。
- source_word: עָנֵר אֶשְׁכֹּל וּמַמְרֵא
  choice: アネル、エシュコル、マムレ
  rationale: 固有名を現代日本語で一般的な形に音写した。
- source_word: הֵם יִקְחוּ חֶלְקָם
  choice: 彼らには自分たちの取り分を受け取らせてください
  rationale: 未完了形を文脈上の許可・要求として訳した。「取る」よりも分配の文脈に自然な「受け取る」を用いた。
theological_decisions:
- issue: 前節から省略されている受け取り拒否の継続
  choice: 「ただし……だけは別です」として拒否に対する例外を明示する
  alternative: 「……のほかは」のような動詞を欠く断片的表現
  rationale: ヘブライ語は前節の発言に依存するが、日本語では例外を明示したほうが文として自然であり、アブラム自身は戦利品を受け取らないという趣旨も保たれる。
- issue: יִקְחוּ の法的ニュアンス
  choice: 許可・要請として「受け取らせてください」
  alternative: 単純未来として「彼らは取り分を受け取る」
  rationale: アブラムが同行者の権利を自分の辞退から除外している文脈では、未来の予告より許可・要求が適切。ただし形態上は単純未来も可能なので脚注で示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。前節への依存を自然に補い、戦利品分配の場面に合う「取り分」「受け取る」を採用した。固有名の列挙は「すなわち」で関係を明確にした。
