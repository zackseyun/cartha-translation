  text: וַ/יְהִ֗י בִּ/ימֵי֙ אַמְרָפֶ֣ל מֶֽלֶךְ שִׁנְעָ֔ר אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר כְּדָרְלָעֹ֨מֶר֙ מֶ֣לֶךְ עֵילָ֔ם וְ/תִדְעָ֖ל מֶ֥לֶךְ גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/014/001.yaml
  text: 'And it happened in the days of Amraphel king of Shinar[a], Arioch king of Ellasar, Chedorlaomer king of Elam, and Tidal king of nations:'
translation:
  language: ja
  text: シンアルの王アムラフェル、エラサルの王アリヨク、エラムの王ケドルラオメル、そして諸国[a]の王ティデアルの時代、
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ゴイムの王」とも訳せる。ヘブライ語「ゴイム」は通常「諸国」または「諸民族」を意味するが、ここではほかの王号と同じように地名として用いられている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 時代、
  rationale: 物語の背景を導入する語形。ここでは後続する2節の出来事へ続く未完の構文なので、独立した「出来事が起こった」と補わず、節末を読点としてつないだ。
- source_word: בִּימֵי
  choice: 〜の時代
  rationale: 直訳的な「〜の日々に」より自然な現代日本語で、時間的背景を示す定型句の意味を保つ。
- source_word: מֶלֶךְ
  choice: 王
  rationale: 各固有名詞に付された王号を一貫して訳した。日本語では地域名を先に置く「〜の王…」という自然な語順を採用した。
- source_word: שִׁנְעָר
  choice: シンアル
  rationale: 地名として、原語の音に沿う日本語の慣用的表記を用いた。
- source_word: אַמְרָפֶל
  choice: アムラフェル
  rationale: 人名を日本語で音写した。
- source_word: אֶלָּסָר
  choice: エラサル
  rationale: 地名を日本語で音写した。
- source_word: אַרְיוֹךְ
  choice: アルヨク
  rationale: 人名をヘブライ語本文の発音に沿って音写した。
- source_word: עֵילָם
  choice: エラム
  rationale: 地名の標準的な日本語表記を用いた。
- source_word: כְּדָרְלָעֹמֶר
  choice: ケドルラオメル
  rationale: 人名の広く認識される日本語表記を用いた。
- source_word: וְתִדְעָל
  choice: そして…ティドアル
  rationale: 接続詞を列挙の最後に自然な「そして」で表し、人名を音写した。
- source_word: מֶלֶךְ גּוֹיִם
  choice: 諸国の王
  rationale: גּוֹיִםの通常の語義「諸国、諸民族」を本文に反映した。ただし、並行する他の王号と同様に地名として機能する可能性を脚注に残した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文では1節の時間句が2節へ続くため、文を完結させず読点で終えた。王号は日本語として自然な「地域名の王・人名」の順に統一した。
