  text: By night he and his servants divided themselves against them, struck them down, and pursued them as far as Hobah, which is north of Damascus.
translation:
  language: ja
  text: 夜、彼はしもべたちとともに部隊を分けて彼らに襲いかかり、彼らを打ち倒し、ダマスコの北にあるホバまで追撃した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּחָלֵק עֲלֵיהֶם לַיְלָה הוּא וַעֲבָדָיו
  choice: 夜、彼はしもべたちと手分けして彼らを襲い
  rationale: חלק のニファル形は、アブラムと配下が部隊を分けて攻撃したことを表す。「手分けして」で再帰的・戦術的な意味を自然な日本語にし、עֲלֵיהֶם の敵対的方向性を「襲い」で示した。
- source_word: וַיַּכֵּם
  choice: 彼らを打ち破り
  rationale: נכה は文脈上、単に殴ることではなく敵軍を撃破することを指すため、「打ち破る」とした。殺害し尽くしたとまでは限定しない。
- source_word: וַיִּרְדְּפֵם
  choice: 追撃した
  rationale: 戦闘後に逃走する敵を追う軍事的文脈なので、簡潔で自然な「追撃した」とした。
- source_word: מִשְּׂמֹאל לְדַמָּשֶׂק
  choice: ダマスコの北にある
  rationale: 古代の方位表現で「左」は東を向いた際の北を意味する。この地理的意味を現代の読者に明確に伝えた。
- source_word: חֹובָה
  choice: ホバ
  rationale: 地名として音写した。
