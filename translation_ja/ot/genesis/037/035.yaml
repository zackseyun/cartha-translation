  naturalness: 現代標準語として読みやすく、悲嘆の場面にもふさわしい。もっとも、「息子のもとへ、嘆きながらシェオルへ下って行く」は意図的に原文の二重の方向表現を保持するため、やや重なりのある表現となるが、この箇所では注による補助を伴えば許容される。
  terminology: 「シェオル」の音写は、語を単に「墓」に限定しない点で適切である。「慰める／慰められる」の対応も良い。「彼の父」として関係を明示すれば、結びの主語・目的語の照応がいっそう明瞭になる。
