  text: וַ/יָּקֻמוּ֩ כָל בָּנָ֨י/ו וְ/כָל בְּנֹתָ֜י/ו לְ/נַחֲמ֗/וֹ וַ/יְמָאֵן֙ לְ/הִתְנַחֵ֔ם וַ/יֹּ֕אמֶר כִּֽי אֵרֵ֧ד אֶל בְּנִ֛/י אָבֵ֖ל שְׁאֹ֑לָ/ה וַ/יֵּ֥בְךְּ אֹת֖/וֹ אָבִֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/035.yaml
  text: Then all his sons and all his daughters rose up to comfort him[a], but he refused to be comforted and said, “For I will go down to Sheol to my son[b], mourning.” So his father wept for him.
translation:
  language: ja
  text: 息子たちも娘たちも皆、立ち上がって彼を慰めようとした。しかし彼は慰められることを拒み、こう言った。「私は、息子のもとへ、嘆きながらシェオルへ下って行くのだ[a]。」こうして、彼の父は彼のために泣いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シェオル」は、死者の領域を指すヘブライ語で、「墓」と訳すこともできる。原文は直訳すれば「私は、わが息子へ、嘆きつつシェオルへ下って行く」となり、「息子のもとへ」と「シェオルへ」の関係を簡潔には限定していない。
    reason: lexical_alternative_and_syntactic_ambiguity
lexical_decisions:
- source_word: וַיָּקֻמוּ כָל־בָּנָיו וְכָל־בְּנֹתָיו
  choice: 息子たちも娘たちも皆、立ち上がって
  rationale: ヘブライ語が「息子たち」と「娘たち」を明示的に区別しているため、その対を保った。קוםは物語上の動作として自然な「立ち上がって」とした。
- source_word: לְנַחֲמוֹ ... לְהִתְנַחֵם
  choice: 彼を慰めようとした……慰められることを
  rationale: 同じ語根 נחם のピエルとヒトパエルの対応を「慰める／慰められる」で示した。前者の不定詞は文脈上の目的を自然な日本語で表した。
- source_word: וַיְמָאֵן
  choice: 拒み
  rationale: מאןの積極的な拒絶の意味を簡潔に表す。
- source_word: אֵרֵד
  choice: 下って行くのだ
  rationale: 死者の領域へ「下る」という原文の空間的表現を保持し、発言の強い決意は終助表現「のだ」で自然に示した。
- source_word: אֶל־בְּנִי
  choice: 息子のいる……へ
  rationale: 直訳の「息子のもとへ」を基礎としつつ、目的地シェオルとの関係が日本語で明瞭になるよう最小限に補った。息子がそこにいるとヤコブが考えている文脈を示すが、死後の状態を詳説しない。
- source_word: אָבֵל
  choice: 嘆きながら
  rationale: 喪に服し悲嘆する状態を、移動を修飾する自然な日本語で表した。
- source_word: שְׁאֹלָה
  choice: シェオルへ
  rationale: 単なる墓と限定せず、死者の領域を指し得る旧約固有の語の幅を保つため音写した。
- source_word: וַיֵּבְךְּ אֹתוֹ אָבִיו
  choice: こうして、その父は彼のために泣いた
  rationale: 主語「その父」と目的語「彼」を原文どおり保ち、物語の継続を「こうして」で自然に示した。
theological_decisions:
- issue: שְׁאוֹל の訳し方
  choice: シェオル
  alternative: 墓、死者の国
  rationale: 「墓」だけに狭めたり、後代の詳細な死後観を持ち込んだりせず、ヘブライ語の概念的な幅と神学的緊張を保つため。
- issue: 「息子のもとへ」とシェオルの関係
  choice: 息子のいるシェオルへ
  alternative: 息子のもとへ、嘆きながらシェオルへ
  rationale: 原文の אֶל־בְּנִי と שְׁאֹלָה の双方を一つの自然な日本語句にまとめた。ヤコブの認識を表すにとどめ、死者の状態について断定を加えない。
translation_notes:
  register: 明瞭で現代的ながら、悲嘆の場面にふさわしい簡潔で格調ある文体とした。「シェオル」は本文に残し、一般読者向けの説明を脚注に置いた。
