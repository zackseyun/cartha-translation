id: GEN.37.29
reference: Genesis 37:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב רְאוּבֵן֙ אֶל הַ/בּ֔וֹר וְ/הִנֵּ֥ה אֵין יוֹסֵ֖ף בַּ/בּ֑וֹר וַ/יִּקְרַ֖ע אֶת בְּגָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/029.yaml
  text: When Reuben returned to the pit[a], behold, Joseph was not in the pit[b], and he tore his clothes.
translation:
  language: ja
  text: ルベンが穴[a]に戻ってみると、なんと、ヨセフは穴の中にいなかった。ルベンは自分の衣を引き裂いた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「穴」と訳したヘブライ語ボールは、「貯水槽」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 衣を引き裂くことは、悲しみ、衝撃、苦悩を表す当時の慣習だった。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 戻ってみると
  rationale: שׁובの帰還の意味を「戻る」で示し、後続のוְהִנֵּהが導く発見を、日本語の自然な物語表現「戻ってみると」につないだ。
- source_word: הַבּוֹר / בַּבּוֹר
  choice: 穴／穴の中に
  rationale: בּוֹרは穴または貯水槽を意味し得る。本文では広く理解しやすく文脈にも合う「穴」とし、「貯水槽」の可能性は脚注に残した。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 注意を促し、予想外の事態を際立たせるהִנֵּהの物語上の働きを、現代日本語で明瞭な「なんと」によって表した。
- source_word: אֵין יוֹסֵף בַּבּוֹר
  choice: ヨセフは穴の中にいなかった
  rationale: אֵיןが表す不在を自然な日本語で訳し、「連れ去られていた」など本文にない事情は補わなかった。
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: 自分の衣を引き裂いた
  rationale: 悲嘆や衝撃を示す慣用的行為を直接表した。「衣」はこの聖書的・文化的動作に適した簡潔で品位ある語である。主語の混同を避けるため、後半では「ルベン」を明示した。
theological_decisions: []
