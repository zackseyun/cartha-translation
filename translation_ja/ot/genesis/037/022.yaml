id: GEN.37.22
reference: Genesis 37:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֣ם רְאוּבֵן֮ אַל תִּשְׁפְּכוּ דָם֒ הַשְׁלִ֣יכוּ אֹת֗/וֹ אֶל הַ/בּ֤וֹר הַ/זֶּה֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר וְ/יָ֖ד אַל תִּשְׁלְחוּ ב֑/וֹ לְמַ֗עַן הַצִּ֤יל אֹת/וֹ֙ מִ/יָּדָ֔/ם לַ/הֲשִׁיב֖/וֹ אֶל אָבִֽי/ו׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/022.yaml
  text: And Reuben said to them[a], “Do not shed blood. Throw him into this pit that is in the wilderness, but do not lay a hand on him”—that he might rescue him from their hand[b], to return him to his father.
translation:
  language: ja
  text: ルベンは彼らに言った。「血を流してはならない。荒野にあるこの穴[a]に彼を投げ込み、彼に手を下してはならない。」これは、彼らの手[b]から彼を救い出し、父のもとへ帰すためであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「貯水槽」。ヘブライ語は、水をためるために掘った穴を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「彼らの手」は、彼らの力や支配を表すヘブライ語の言い回し。
    reason: idiom
lexical_decisions:
- source_word: אַל תִּשְׁפְּכוּ דָם
  choice: 血を流してはならない
  rationale: 「血を流す」というヘブライ語の慣用表現を保ちつつ、殺害や血の罪を生じさせる暴力を禁じる意味が現代日本語で自然に伝わる。
- source_word: הַשְׁלִיכוּ אֹתוֹ
  choice: 彼を投げ込み
  rationale: 物理的に穴へ入れる動作を明確に表し、文脈に合う自然な表現とした。
- source_word: הַבּוֹר
  choice: 穴
  rationale: 水をためる穴や貯水槽をも指し得る語だが、本文では意味範囲の広い「穴」とし、具体的な別訳を脚注に示した。
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: 荒野にある
  rationale: 関係節の形を反映し、砂漠に限定されない מִדְבָּר の意味を「荒野」で表した。
- source_word: וְיָד אַל תִּשְׁלְחוּ בוֹ
  choice: 彼に手を下してはならない
  rationale: 直訳調の「彼に手を伸ばす」では意図が曖昧になるため、危害を加えることを禁じるヘブライ語の慣用的な力を自然な日本語で表した。
- source_word: הַצִּיל אֹתוֹ מִיָּדָם
  choice: 彼らの手から彼を救い出し
  rationale: נצל の救出の意味を明確にしつつ、「手」を支配や力の比喩として残した。
- source_word: לַהֲשִׁיבוֹ אֶל אָבִיו
  choice: 父のもとへ帰す
  rationale: 使役形の「戻らせる、連れ戻す」を簡潔で自然な日本語にした。
- source_word: רְאוּבֵן
  choice: ルベン
  rationale: 日本語聖書で広く定着した人名表記を用いた。
theological_decisions:
- issue: לְמַעַן 以下を誰の発言または説明として示すか
  choice: 引用を閉じ、語り手によるルベンの目的説明として訳す
  alternative: 「彼に手を下してはならない。彼らの手から彼を救い出し……」までをルベンの直接話法として続ける
  rationale: 三人称の「彼を救い出す」という表現と文脈は、ルベンの隠れた意図を語り手が説明していると読むのが最も自然である。ただし古代ヘブライ語本文自体には現代的な引用符がない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「血を流す」「彼らの手」のような重要な原語の比喩は保持した。直接話法の後に独立した説明文を置き、ルベンの表向きの提案と隠れた目的の移行を読み取りやすくした。
