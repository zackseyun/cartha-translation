  text: וַ/יֹּ֣אמֶר ל֗/וֹ לֶךְ נָ֨א רְאֵ֜ה אֶת שְׁל֤וֹם אַחֶ֨י/ךָ֙ וְ/אֶת שְׁל֣וֹם הַ/צֹּ֔אן וַ/הֲשִׁבֵ֖/נִי דָּבָ֑ר וַ/יִּשְׁלָחֵ֨/הוּ֙ מֵ/עֵ֣מֶק חֶבְר֔וֹן וַ/יָּבֹ֖א שְׁכֶֽמָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/014.yaml
  text: He said to him[a], “Go now, see about the well-being of your brothers and the well-being of the flock, and bring me word.” So he sent him from the Valley of Hebron, and he came to Shechem.
translation:
  language: ja
  text: 彼はヨセフに言った。「さあ、行って、兄たちが無事か、また羊や山羊の群れが無事か[a]、見てきなさい。そして、私に知らせを持ち帰りなさい。」こうして彼はヨセフをヘブロンの谷から送り出し、ヨセフはシェケムに着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「無事」と訳した二つの箇所のヘブライ語は、いずれも「シャローム」で、「無事」「安否」「健やかな状態」などを意味する。
    reason: 原文で同じ語が二度用いられていることと、この文脈における語義の幅を示すため。
lexical_decisions:
- source_word: לֶךְ נָא
  choice: さあ、行って……見てきなさい
  rationale: 命令形「行け」と、依頼を和らげたり促したりする נָא を、親が子に語る自然な現代日本語で表した。
- source_word: רְאֵה אֶת שְׁלוֹם
  choice: 無事か……見てきなさい
  rationale: ראה の具体的な「見る」と、שלום がここで表す安否・健在の意味を自然に組み合わせた。
- source_word: שְׁלוֹם
  choice: 無事
  rationale: ここでは単なる争いのない状態ではなく、兄たちと群れの安否・健全な状態を指す。二度の反復も本文に残した。
- source_word: אַחֶיךָ
  choice: 兄たち
  rationale: 文脈上ヨセフの年長の男兄弟を指すため、日本語として具体的な「兄たち」とした。
- source_word: הַצֹּאן
  choice: 家畜の群れ
  rationale: צאן は羊だけでなく山羊を含む小家畜の群れを指し得るため、種を限定しすぎない表現とした。
- source_word: וַהֲשִׁבֵנִי דָּבָר
  choice: 私に知らせを持ち帰りなさい
  rationale: 使役形の שוב と דבר の組み合わせが表す「報告を持ち帰る」という意味と、帰還の含みを明示した。
- source_word: מֵעֵמֶק חֶבְרוֹן
  choice: ヘブロンの谷から
  rationale: עמק を省かず、地理的な出発地点を原文どおり示した。
- source_word: שְׁכֶמָה
  choice: シェケムに
  rationale: 地名に付く方向を示す語尾を、現代日本語の到着点を表す助詞「に」で自然に訳した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。代名詞だけでは日本語で指示対象が不明瞭になりやすいため、文脈上の目的語を「ヨセフ」と明示した。שלום の反復は訳文でも保持した。
