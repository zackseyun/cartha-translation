  to: 彼はヨセフに言った。「さあ、行って、兄たちが無事か、また羊や山羊の群れが無事か[a]、見てきなさい。そして、私に知らせを持ち帰りなさい。」こうして彼はヨセフをヘブロンの谷から送り出し、ヨセフはシェケムに着いた。
