  text: And he said to them[a], “Please listen to this dream that I dreamed.”
translation:
  language: ja
  text: そしてヨセフは彼らに言った。「どうか、私が見たこの夢を聞いてください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: そしてヨセフは彼らに言った
  rationale: 継続法による物語の進行を「そして」で表した。主語は直前の文脈からヨセフであり、日本語で明確にするため補った。אֲלֵיהֶם は「彼らに」とした。
- source_word: שִׁמְעוּ־נָא
  choice: どうか…聞いてください
  rationale: 複数命令形と、依頼・勧めを和らげる נָא の働きを、自然で丁寧な現代日本語で表した。
- source_word: הַחֲלוֹם הַזֶּה
  choice: この夢
  rationale: 定冠詞を伴う名詞と指示詞の組み合わせを、自然な日本語の「この夢」とした。
- source_word: אֲשֶׁר חָלָמְתִּי
  choice: 私が見た
  rationale: 日本語では夢について通常「夢を見る」と言うため、「私が夢見た」より自然な表現を選んだ。ヘブライ語の同根語反復は日本語でも「見た…夢」によって部分的に保たれる。
