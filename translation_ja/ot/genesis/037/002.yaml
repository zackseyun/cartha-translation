source:
  edition: WLC
  text: אֵ֣לֶּה תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן שְׁבַֽע עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת אֶחָי/ו֙ בַּ/צֹּ֔אן וְ/ה֣וּא נַ֗עַר אֶת בְּנֵ֥י בִלְהָ֛ה וְ/אֶת בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑י/ו וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת דִּבָּתָ֥/ם רָעָ֖ה אֶל אֲבִי/הֶֽם׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/002.yaml
  text: 'These are the generations of Jacob: Joseph[a], being seventeen years old, was shepherding the flock with his brothers. He was a youth with the sons of Bilhah and the sons of Zilpah, his father''s wives[c][b], and Joseph brought a bad report about them to their father.'
translation:
  language: ja
  text: 'これはヤコブの歴史である。[a]


    ヨセフは十七歳のとき、兄たちと一緒に羊の群れを飼っていた。彼はまだ若く、父の妻たちであるビルハの息子たちやジルパの息子たちと一緒にいた。ヨセフは彼らについての悪い報告を、彼らの父に伝えた。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「これはヤコブの系譜である」「これはヤコブの家族の物語である」。ヘブライ語の「トレドート」は創世記で新しい区分を導入する語で、単なる子孫の一覧だけでなく、その人物から展開する家族の歴史を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 原文は「彼らの父」と複数形で、ヤコブがヨセフと兄たちに共通する父であることを明示している。
    reason: source_form
lexical_decisions:
- source_word: תֹּלְדוֹת
  choice: 歴史
  rationale: 創世記の区分を示す標題語で、ヤコブから展開する家族の経緯を指す。「系図」だけに限定せず、後に続く物語を自然な日本語で示す。別訳を脚注に残した。
- source_word: הָיָה רֹעֶה
  choice: 飼っていた
  rationale: 分詞を伴う構文の継続的な働きを表す。日本語では「羊飼いをしていた」よりも、目的語の「羊の群れ」と自然につながる。
- source_word: אֶת אֶחָיו בַּצֹּאן
  choice: 兄たちと一緒に羊の群れを飼っていた
  rationale: ヨセフが兄たちを飼っていたのではなく、彼らと共に群れの世話をしていたという文脈上自然な関係を明示する。
- source_word: נַעַר
  choice: まだ若く
  rationale: 十七歳という直前の年齢説明に合い、「少年」と年齢を過度に限定せず、若者であったことを表す。
- source_word: אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה
  choice: ビルハの息子たちやジルパの息子たちと一緒にいた
  rationale: 難しい統語を、彼がこの異母兄弟たちと共にいたことを示す状況句として訳した。原文の二つの群の区別も保った。
- source_word: נְשֵׁי אָבִיו
  choice: 父の妻たち
  rationale: ビルハとジルパを修飾する直接的な所有表現をそのまま保つ。
- source_word: דִּבָּתָם רָעָה
  choice: 彼らについての悪い報告
  rationale: 彼らに関する好ましくない報告という意味を自然に表し、それが虚偽の告げ口だったとまでは断定しない。
- source_word: אֶל אֲבִיהֶם
  choice: 彼らの父のもとへ
  rationale: 原文の複数接尾辞「彼らの」を保ち、ヤコブがヨセフと兄たちに共通する父であることを示す。
theological_decisions:
- issue: דִּבָּתָם רָעָה が報告の虚偽性やヨセフの悪意を含むか
  choice: 「悪い報告」とし、内容が不利・好ましくないことだけを表す
  alternative: 「悪口」「中傷」「告げ口」
  rationale: 原文は報告が虚偽だったとも、ヨセフが悪意から告げたとも明示しないため、人物評価を先取りしない。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述体。「兄たち」は文脈に即した自然な日本語とし、ビルハとジルパの息子たちを具体的に示す後続句とのつながりを保った。冒頭は標題として独立させ、長すぎる一文を避けた。
