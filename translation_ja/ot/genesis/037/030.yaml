  text: He returned to his brothers and said[a], “The boy is gone, and I—where shall I go?”
translation:
  language: ja
  text: 彼は兄弟たちのところに戻って言った。「あの子がいない。私は、いったいどこへ行けばよいのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 彼は……戻って
  rationale: שׁובの物語叙述形は、元の場所へ戻る動作を表す。「戻って」として、後続の発言へ自然につないだ。
- source_word: אֶל אֶחָיו
  choice: 兄弟たちのところに
  rationale: אֶלは方向を示し、אֶחָיוは文脈上ルベンの兄弟たちを指す。現代日本語として自然な方向表現にした。
- source_word: הַיֶּלֶד
  choice: あの子
  rationale: יֶלֶדは「子、少年」。ここではその場の全員が念頭に置くヨセフを指すため、「あの子」が自然であり、ルベンの切迫した口調にも合う。
- source_word: אֵינֶנּוּ
  choice: いない
  rationale: 文字どおりには「彼がいない」で、ここでは不在を表す。死亡を断定する「もういない」は避けた。
- source_word: וַאֲנִי
  choice: それなのに私は
  rationale: 接続詞と独立代名詞による強調された自己への転換を示す。文脈上の動揺と困惑を自然な日本語で表した。
- source_word: אָנָה אֲנִי בָא
  choice: いったいどこへ行けばよいのか
  rationale: 字義的には「私はどこへ来るのか」だが、אָנָהと移動動詞の組み合わせは進む先を問う慣用表現。「どうしたらよいのか」という含みを保ちつつ、方向の比喩を訳文に残した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。ルベンの驚愕と切迫感を、「いったい」と語順の中断感によって表した。原文の不在表現から死を読み込まず、問いの慣用的意味も過度に意訳しない方針とした。
