base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/009.yaml
  text: 'Then he dreamed another dream and told it to his brothers[a], and said, “Look, I have dreamed another dream: the sun, the moon, and eleven stars were bowing down to me.”'
translation:
  language: ja
  text: それからヨセフは、また別の夢を見て、それを兄たちに話した。「聞いてくれ。私はまた別の夢を見た。見ると、太陽と月と十一の星が、私にひれ伏していた[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の前で身をかがめていた」。このヘブライ語動詞は深い拝礼を表し得る。ここでは神への礼拝とは限らず、敬意や服従を示す行為を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲלֹם עוֹד חֲלוֹם אַחֵר
  choice: それからヨセフは、また別の夢を見て
  rationale: 物語を進める接続形を自然な「それから」で表し、עוֹד と אַחֵרによる夢の反復も「また別の夢」として保持した。原文では主語が代名詞的に継続するが、日本語では節単独でも明瞭になるよう「ヨセフ」を補った。
- source_word: וַיְסַפֵּר אֹתוֹ לְאֶחָיו
  choice: それを兄たちに話した
  rationale: סִפֵּרの一般的な「語る、話す」を平明に訳した。文脈上、אֶחָיוはヨセフの兄たちを指すため、日本語として自然な「兄たち」とした。
- source_word: הִנֵּה
  choice: 聞いてくれ
  rationale: 直接話法冒頭の注意喚起を、現代日本語の発話として自然に表した。「見よ」はこの位置では硬く不自然になりやすい。
- source_word: חָלַמְתִּי חֲלוֹם עוֹד
  choice: 私はまた夢を見た
  rationale: 同族目的語の構文は日本語では慣用的な「夢を見た」とし、עוֹדの反復性を「また」で明示した。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 夢の光景を生き生きと導入する注意喚起の働きを、自然な語りの「見ると」で保持した。
- source_word: הַשֶּׁמֶשׁ וְהַיָּרֵחַ וְאַחַד עָשָׂר כּוֹכָבִים
  choice: 太陽と月と十一の星
  rationale: 天体と数を原文どおり明確に訳した。
- source_word: מִשְׁתַּחֲוִים לִי
  choice: 私にひれ伏していた
  rationale: 分詞が描く夢の中の継続的な光景を「していた」で示した。השתחוהは深く身をかがめる敬意・服従の行為を表し得るため、礼拝に限定されない「ひれ伏す」を選んだ。
theological_decisions:
- issue: מִשְׁתַּחֲוִים が表す行為の性質
  choice: 私にひれ伏していた
  alternative: 私を礼拝していた
  rationale: 直近の文脈と後の物語的成就は、家族による敬意または服従を扱っている。神への礼拝という意味に限定せず、ヘブライ語が持つ深い拝礼の動作を保つため「ひれ伏す」とした。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、夢の場面の荘重さを保った。直接話法の注意喚起は自然な「聞いてくれ」とし、夢の光景を導く二度目の הִנֵּה は「見ると」と訳し分けた。
