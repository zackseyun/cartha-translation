base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/025.yaml
  text: Then they sat down to eat bread, and they lifted up their eyes and looked, and behold, a caravan of Ishmaelites was coming from Gilead, with their camels carrying gum, balm, and myrrh, on their way to take it down to Egypt.
translation:
  language: ja
  text: 彼らは腰を下ろして食事をした。目を上げて見ると、見よ、イシュマエル人の隊商がギルアドからやって来るところだった。そのらくだは香料用の樹脂、香油、ラダナムを積み、それらをエジプトへ下って行くところであった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「香料用の樹脂、香油、ラダナム」に当たるヘブライ語は、古代の交易品を指す語である。第一の品は芳香性の樹脂、第二の品はバルサムまたは香膏の類、第三の品は一般にラダナムと理解されるが、それぞれの厳密な物質同定には不確かさがある。
    reason: 三つの交易品の語義・物質同定に残る不確かさを明示しつつ、本文の「乳香」「没薬」という不適切に限定的な同定を改めるため。
lexical_decisions:
- source_word: לֶאֱכָל לֶחֶם
  choice: 食事をした
  rationale: 直訳は「パンを食べる」だが、ヘブライ語では一般に食事をすることを表すため、自然な現代日本語とした。
- source_word: אֹרְחַת יִשְׁמְעֵאלִים
  choice: イシュマエル人の隊商
  rationale: אֹרְחָה は旅する一団、とりわけ交易隊を指す文脈なので「隊商」とした。
- source_word: נְכֹאת
  choice: 樹脂
  rationale: 香料または薬用の芳香性樹脂を指すと見られるが、厳密な同定は不確かなので一般的な語を用いた。
- source_word: צְרִי
  choice: 乳香
  rationale: 芳香性または薬用の樹脂・香膏を指す。伝統的には「乳香」と訳されることがあるが、植物学的同定には不確かさがある。
- source_word: לֹט
  choice: 没薬
  rationale: 香料となる樹脂性物質を指す語として伝統的な訳語を採用したが、具体的な物質の同定は確実ではない。
- source_word: מִצְרָיְמָה
  choice: エジプトへ
  rationale: 方向を示す語尾 ה を反映し、目的地として自然に訳した。
