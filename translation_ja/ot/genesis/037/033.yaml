  yaml_path: translation/ot/genesis/037/033.yaml
  text: He recognized it and said[a], “It is my son’s tunic. A wild animal has devoured him[c][b]. Joseph has surely been torn to pieces.”
translation:
  language: ja
  text: 彼はそれと分かると言った。「私の息子の長服だ。野獣が彼を食い尽くしたのだ。ヨセフは確かに引き裂かれてしまった。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「確かに引き裂かれてしまった」に当たるヘブライ語は、同じ語根を重ねて「引き裂かれた、まさに引き裂かれた」と強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכִּירָהּ
  choice: 彼はそれを見分けて
  rationale: נכרのヒフィルは「見分ける、識別する」。女性単数接尾辞は長服を指すため、日本語では自然に「それ」とした。
- source_word: כְּתֹנֶת בְּנִי
  choice: 息子の長服
  rationale: כְּתֹנֶתは身体を覆う長い衣服を指す。「上着」より具体的で、現代日本語でも意味を取りやすい「長服」を採用した。
- source_word: חַיָּה רָעָה
  choice: 獣
  rationale: 文脈上、人を襲う危険な野生動物を表す。日本語の「獣」は捕食動物としての含意を自然に伝え、רָעָהを不必要に道徳的な「悪い」と訳すことを避ける。
- source_word: אֲכָלָתְהוּ
  choice: 息子を食い殺した
  rationale: 直訳は「彼を食べた」だが、獣による死というヤコブの結論を自然な現代日本語で明瞭に表した。
- source_word: טָרֹף טֹרַף
  choice: 確かに引き裂かれてしまった
  rationale: 不定詞絶対形と受動完了形の組み合わせによる強調を「確かに」で表し、被害の完了と嘆きの響きを「しまった」で伝えた。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着したヘブライ人名の表記を用いた。
theological_decisions:
- issue: ヤコブの発言が事実認定か推論か
  choice: 断定的な直接話法を保つ
  alternative: 「獣に食い殺されたに違いない」と推量表現にする
  rationale: ヘブライ語本文は明示的な推量助動詞を置かず、ヤコブの確信を強い断定として表しているため、その緊張を保持した。
translation_notes:
  register: 明瞭で現代的ながら、物語の悲痛さにふさわしい簡潔で品位ある文体。ヘブライ語の強調構文は本文で自然に表し、脚注で形式を補足した。
