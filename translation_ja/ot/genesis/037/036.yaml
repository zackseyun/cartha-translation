id: GEN.37.36
reference: Genesis 37:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ֨/מְּדָנִ֔ים מָכְר֥וּ אֹת֖/וֹ אֶל מִצְרָ֑יִם לְ/פֽוֹטִיפַר֙ סְרִ֣יס פַּרְעֹ֔ה שַׂ֖ר הַ/טַּבָּחִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/036.yaml
  text: Meanwhile[a], the Medanites sold him into Egypt to Potiphar, an officer of Pharaoh[c][b], the captain of the guard.
translation:
  language: ja
  text: 一方、メダン人[a]たちはヨセフをエジプトへ売り渡した。買い取ったのは、ファラオの廷臣[b]で、護衛隊長[c]のポティファルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は「メダン人」。周囲の物語（37章28節など）と古代訳に照らし、ここを「ミディアン人」と理解する伝統もある。
    reason: alternative_reading
  - marker: b
    text: 「宦官」とも訳せる。ヘブライ語の語は、文字どおりの宦官だけでなく、王に仕える高官を指すこともある。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「屠る者たちの長」。王宮の文脈では、処刑や警護を担う者たちの長、すなわち護衛隊長を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּדָנִים
  choice: 一方、メダン人たちは
  rationale: 接続詞וְは場面を切り替えてヨセフの行方に戻る働きを「一方」で表した。民族名はWLCの母音を含む本文מְדָנִיםに従い「メダン人」とし、周辺文脈や古代訳に基づく「ミディアン人」という理解は脚注に残した。
- source_word: מָכְרוּ אֹתוֹ אֶל מִצְרָיִם
  choice: ヨセフをエジプトへ売り渡した
  rationale: מָכְרוּは物語の完了形として「売り渡した」とした。אֹתוֹの指示対象を日本語で明確にするため「ヨセフ」とした。אֶלの方向性を「エジプトへ」で保った。
- source_word: לְפוֹטִיפַר
  choice: 買い取ったのは……ポティファルであった
  rationale: לְが示す買い手を自然な日本語で明示するため、文を分けて「買い取ったのは」と再構成した。
- source_word: סְרִיס פַּרְעֹה
  choice: ファラオの廷臣
  rationale: סָרִיסは宦官そのものも王に仕える高官も指し得るため、本文では文脈に適した非限定的な「廷臣」とし、語義の幅を脚注で示した。
- source_word: שַׂר הַטַּבָּחִים
  choice: 護衛隊長
  rationale: 直訳は「屠る者たちの長」だが、王宮の文脈では処刑や警護を担う者たちの長を指すと考えられるため、自然な役職名「護衛隊長」とした。直訳的な意味は脚注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の方向表現「エジプトへ」と買い手「ポティファル」の双方を不自然なく示すため二文に再構成した。民族名と二つの役職語に残る語義上・本文上の幅は、本文で一つに断定しすぎず脚注で明示した。
