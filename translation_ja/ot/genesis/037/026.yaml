  text: וַ/יֹּ֥אמֶר יְהוּדָ֖ה אֶל אֶחָ֑י/ו מַה בֶּ֗צַע כִּ֤י נַהֲרֹג֙ אֶת אָחִ֔י/נוּ וְ/כִסִּ֖ינוּ אֶת דָּמֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/026.yaml
  text: Then Judah said to his brothers[a], “What profit is there if we kill our brother and cover up his blood?”
translation:
  language: ja
  text: そこでユダは兄弟たちに言った。「私たちの兄弟を殺し、その血を覆い隠して[a]、何の得になるだろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「その血を覆って」。流血の事実や、それに対する責任を隠すことを表す言い回し。
    reason: 原文の比喩的な表現と、その慣用的意味を明示するため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ継続法の順次性を、現代日本語で自然に示す。
- source_word: יְהוּדָה
  choice: ユダ
  rationale: 日本語聖書で定着している人名表記。
- source_word: אֶל אֶחָיו
  choice: 兄弟たちに
  rationale: 文脈上、ヨセフの男の兄弟たちを指す。簡潔で自然な表現とした。
- source_word: מַה בֶּצַע
  choice: 何の得になるだろう
  rationale: בֶּצַע が表す利益・利得という自己本位な含みを保ちつつ、修辞疑問として自然な日本語にした。
- source_word: כִּי נַהֲרֹג אֶת אָחִינוּ
  choice: 私たちの兄弟を殺し
  rationale: כִּי が導く想定内容を日本語では条件的な連用表現で示し、אָחִינוּ の家族関係と道徳的な重みを保持した。
- source_word: וְכִסִּינוּ אֶת דָּמוֹ
  choice: その血を覆い隠して
  rationale: 原文の「血を覆う」という像を残しながら、殺害の事実や責任を隠すという慣用的意味が現代日本語で伝わるようにした。
