base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/034.yaml
  text: Then Jacob tore his clothes[a], put sackcloth around his waist, and mourned for his son many days.
translation:
  language: ja
  text: そこでヤコブは衣服を引き裂き、腰[a]に粗布を巻き、息子を悼んで何日も喪に服した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「腰」と訳した語は、腰から股にかけての部分を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרַע
  choice: 引き裂き
  rationale: קרעは、悲嘆のしるしとして衣服を裂く具体的な行為を表す。「引き裂く」は現代日本語で自然であり、その動作を明確に伝える。
- source_word: שִׂמְלֹתָיו
  choice: 自分の衣服
  rationale: שִׂמְלָהは衣類を広く指すため、特定の形状を想定させる「上着」や「長衣」ではなく「衣服」とした。
- source_word: שַׂק
  choice: 粗布
  rationale: שַׂקは喪や悔い改めの際に身に着ける粗い布を指す。「粗布」は文化的背景を保ちつつ、「袋布」より分かりやすい。
- source_word: בְּמָתְנָיו
  choice: 腰に
  rationale: מָתְנַיִםは腰、または腰から股にかけての部分を指す。本文では自然な「腰に」とし、語義の幅は脚注で示した。
- source_word: וַיִּתְאַבֵּל
  choice: 喪に服した
  rationale: אבלのヒトパエル形は、単に悲しむだけでなく、慣習的なしるしを伴って喪に服することを表す。この文脈では「喪に服した」が適切である。
- source_word: עַל־בְּנוֹ
  choice: 息子のために
  rationale: 哀悼を表す動詞に伴うעַלは、その対象を示す。「息子のために」は日本語として自然である。
- source_word: יָמִים רַבִּים
  choice: 幾日も
  rationale: 直訳は「多くの日々」。「幾日も」は期間の長さを自然な現代日本語で表し、原文の特定されない長期間という意味を保つ。
