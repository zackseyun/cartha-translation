source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הָ/אִישׁ֙ נָסְע֣וּ מִ/זֶּ֔ה כִּ֤י שָׁמַ֨עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָ/ה וַ/יֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔י/ו וַ/יִּמְצָאֵ֖/ם בְּ/דֹתָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/017.yaml
  text: The man said[a], “They have moved on from here, because I heard them saying[b], ‘Let us go to Dothan.’” So Joseph went after his brothers and found them at Dothan.
translation:
  language: ja
  text: その人は言った。「彼らはここを去って行った。私が彼らの『ドタンへ[a]行こう』と言っているのを聞いた[b]からだ。」そこでヨセフは兄たちの後を追い、ドタンで彼らを見つけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、地名「ドタン」に方向を示す語尾が付き、文字どおりには「ドタンの方へ」という形になっている。
    reason: cultural_note
  - marker: b
    text: 別訳「私は彼らが『ドタンへ行こう』と言うのを聞いた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: נָסְעוּ מִזֶּה
  choice: ここをたって行った
  rationale: נסעには、その場所を出発して先へ移る意味がある。「ここをたって行った」は、野営を畳むという含みを過度に明示せず、文脈に即して自然に移動と出発を表す。
- source_word: כִּי
  choice: からだ
  rationale: ここでは、兄たちが移動したと判断した理由を導くため、現代日本語で因果関係が明確になるよう「からだ」とした。
- source_word: שָׁמַעְתִּי אֹמְרִים
  choice: 言っているのを、私は聞いた
  rationale: 分詞 אֹמְרִים の継続的な響きを「言っている」で保った。発言者は文脈上ヨセフの兄たちである。
- source_word: נֵלְכָה
  choice: 行こう
  rationale: 一人称複数の勧奨形が持つ、自分たちへの促し・提案のニュアンスを自然な日本語の「行こう」で表した。
- source_word: דֹּתָיְנָה
  choice: ドタンへ
  rationale: 地名に付く方向を表す語尾を、目的地への移動を示す助詞「へ」で表した。
- source_word: אַחַר אֶחָיו
  choice: 兄たちの後を追い
  rationale: 単に後方にいるのではなく、兄たちを求めてその行程をたどる文脈なので、「後を追い」と自然に訳した。
- source_word: וַיִּמְצָאֵם בְּדֹתָן
  choice: ドタンで彼らを見つけた
  rationale: מצאの基本的な意味を「見つけた」とし、場所を示す前置詞 בְּ は日本語の「で」で表した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、会話は過度に口語的にも古風にもならない常体とした。「私は」は原文の一人称動詞を適度に明示し、理由説明の焦点を保っている。
