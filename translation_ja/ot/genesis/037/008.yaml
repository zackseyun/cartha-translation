  text: וַ/יֹּ֤אמְרוּ ל/וֹ֙ אֶחָ֔י/ו הֲ/מָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔י/נוּ אִם מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑/נוּ וַ/יּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔/וֹ עַל חֲלֹמֹתָ֖י/ו וְ/עַל דְּבָרָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/008.yaml
  text: His brothers said to him, “Will you really reign over us? Will you really rule over us?” So they hated him even more because of his dreams and because of his words.
translation:
  language: ja
  text: 兄たちはヨセフに言った。「おまえが本当に私たちの王となるというのか。おまえが本当に私たちを治めるというのか。」こうして兄たちは、ヨセフの夢と彼の言葉のために、ますます彼を憎んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲמָלֹךְ תִּמְלֹךְ
  choice: 本当に私たちの王となるというのか
  rationale: 同根語を重ねる不定詞絶対形の強調を「本当に」で表し、מלך の王権的な意味を「王となる」で保持した。文脈上、兄たちの反語的な問いとして自然にした。
- source_word: אִם מָשׁוֹל תִּמְשֹׁל
  choice: 本当に私たちを治めるというのか
  rationale: אם はここでは並列された疑問を導き、同根語の重複による強調を「本当に」で表した。משׁל は前半の「王となる」と区別して「治める」とした。
- source_word: דְּבָרָיו
  choice: その話
  rationale: 直訳的な「彼の言葉」も可能だが、ここではヨセフが夢について語った内容を指すため、自然な日本語の「その話」とした。指示対象を夢そのものと同一視せず、語った内容として残した。
theological_decisions:
- issue: 二つの疑問文の反語性と強調
  choice: 「本当に……というのか」を二度用いる
  alternative: 「まさか……するつもりなのか」
  rationale: 兄たちの拒絶と嘲りを伝えつつ、「つもり」としてヨセフの意図に限定する解釈を避け、夢が示唆する将来への問いという原文の幅を保った。
- issue: מלך と משׁל の関係
  choice: 「王となる」と「治める」を訳し分ける
  alternative: 両方を「支配する」とする
  rationale: 並行性を保ちながら語彙上の差異も示し、王権と統治の重なりを一語に平板化しないようにした。
translation_notes:
  register: 現代の一般読者に明瞭で、物語文として自然かつ dignified な文体。「おまえ」は兄たちの敵意と同輩間の直接的な発話を示すが、過度に俗悪な表現は避けた。固有名「ヨセフ」を補い、代名詞の指示を日本語で明確にした。
