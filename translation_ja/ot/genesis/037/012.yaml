  text: 兄たちは、シェケムで父の家畜の群れを放牧するために出かけた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「シェケムの近くで」。ヘブライ語の前置詞は、その場所の中だけでなく、その地点や周辺を表すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: 行った
  rationale: 物語の次の出来事を示すワウ継続法。明示的な「さて」は加えず、自然な叙述として訳した。
- source_word: אֶחָיו
  choice: 兄たち
  rationale: 文脈上、ヨセフの男性のきょうだいたちを指す。日本語ではヨセフより年長であることが文脈から明らかなため「兄たち」とした。
- source_word: לִרְעוֹת
  choice: 養うため
  rationale: 家畜の群れに草を食べさせ、世話をする目的を表す不定詞。現代日本語で自然な表現を選んだ。
- source_word: צֹאן
  choice: 家畜の群れ
  rationale: 羊や山羊を中心とする小家畜の集合語であり、「羊」と種を限定しないようにした。
- source_word: אֲבִיהֶם
  choice: 父の
  rationale: 接尾辞付き構文による所有関係を簡潔に表した。
- source_word: בִּשְׁכֶם
  choice: シェケムへ
  rationale: 前置詞 ב は場所の内部またはその地点・周辺を表し得る。移動動詞に続く自然な日本語として「へ」を用いたが、厳密には「シェケムで」も可能。
