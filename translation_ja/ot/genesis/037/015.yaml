  text: וַ/יִּמְצָאֵ֣/הוּ אִ֔ישׁ וְ/הִנֵּ֥ה תֹעֶ֖ה בַּ/שָּׂדֶ֑ה וַ/יִּשְׁאָלֵ֧/הוּ הָ/אִ֛ישׁ לֵ/אמֹ֖ר מַה תְּבַקֵּֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/015.yaml
  text: A man found him[a], and behold, he was wandering in the field. The man asked him, saying, “What are you seeking?”
translation:
  language: ja
  text: 一人の男がヨセフを見つけた。見ると、ヨセフは野原をさまよっていた。男はヨセフに尋ねた。「何を捜しているのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצָאֵהוּ
  choice: ヨセフを見つけた
  rationale: מצאの基本義「見つける」を保った。日本語では目的語を「彼」とすると後続箇所との関係が分かりにくいため、文脈上の指示対象である「ヨセフ」を明示した。
- source_word: אִישׁ
  choice: 一人の男
  rationale: 不特定の男性一人を表すאישを具体的かつ自然に訳した。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: הנהが持つ、場面を生き生きと提示して注意を向ける働きを、現代日本語の物語文として自然な「見ると」で表した。
- source_word: תֹעֶה
  choice: さまよっていた
  rationale: תעהの分詞が表す、道を外れて歩き回る継続的な状態を訳した。「迷っていた」よりも、完全に道に迷ったと断定せず原語の幅を保てる。
- source_word: בַּשָּׂדֶה
  choice: 野原を
  rationale: שדהは畑や野、開けた土地を指し得る。この場面では移動を伴う「さまよう」と自然に結び付く「野原を」とした。ヘブライ語のבは場所を示す。
- source_word: וַיִּשְׁאָלֵהוּ
  choice: 彼に尋ねた
  rationale: שאלの通常の意味を、やや品位を保った自然な現代日本語で表した。
- source_word: לֵאמֹר
  choice: 直接話法で表現
  rationale: 日本語では「言って」と重ねず、引用を直ちに続けることで、発言を導入するヘブライ語の定型表現を自然に再現した。
- source_word: מַה תְּבַקֵּשׁ
  choice: 何を捜しているのですか
  rationale: בקשの「捜し求める」という意味と進行中の行為を保った。「求めている」より、この具体的な捜索場面に自然である。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、聖書物語としての品位を保つ文体とした。「見ると」によってהנהの注意喚起を不自然な古語調にせず表現した。原文に実質的な異読や神学的曖昧さはないため注は付していない。提示された英語注の内容は実際には問いの訳語候補に関するものだが、本文中の[a]の位置と対応していないため、その不整合を日本語版には引き継がなかった。
