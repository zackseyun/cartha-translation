  text: And when Joseph came to his brothers[a], they stripped Joseph of his tunic, the tunic of many colors that was on him.
translation:
  language: ja
  text: ヨセフが兄たちのところに来ると、彼らはヨセフが身に着けていた長衣、すなわち特別な長衣[a]をはぎ取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
