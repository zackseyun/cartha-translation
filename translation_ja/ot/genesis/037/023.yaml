    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ～すると
  rationale: 物語を次の出来事へ進める時間的構文。ヘブライ語の定型句を逐語的に再現せず、自然な日本語で出来事の連続を示す。
- source_word: בָּא יוֹסֵף אֶל אֶחָיו
  choice: ヨセフが兄たちのところに来る
  rationale: 文脈上 אֶחָיו はヨセフの男性のきょうだいたちを指すため、「兄たち」とした。
- source_word: וַיַּפְשִׁיטוּ
  choice: はぎ取った
  rationale: 本人の意思によらず衣服を脱がせる強制的な動作を明確に伝える。
- source_word: כֻּתָּנְתּוֹ
  choice: 長衣
  rationale: כֻּתֹּנֶת は身体を覆うチュニック状の衣服。「上着」より衣服の形を示しつつ、一般読者にも理解しやすい語を選んだ。
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: 特別な長衣
  rationale: פַּסִּים の正確な意味は不確かで、長い袖、装飾、色彩などの可能性がある。「特別な」は衣の際立った性格を示しながら、特定の語義に断定しない。
- source_word: אֲשֶׁר עָלָיו
  choice: 着ていた
  rationale: 直訳的な「彼の上にあった」より自然に、当時ヨセフが身に着けていたことを表す。
