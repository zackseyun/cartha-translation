  text: And they said to one another[a], “Look, this dreamer is coming.”
translation:
  language: ja
  text: 彼らは互いに言った。「見ろ、あの夢見る者[a]がやって来る。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「夢の主人」。夢によって特徴づけられた者を指す表現で、ここでは兄たちの嘲りを帯びている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 彼らは……言った
  rationale: 物語を進めるワイイクトール形。日本語では自然な叙述として訳した。
- source_word: אִישׁ אֶל־אָחִיו
  choice: 互いに
  rationale: 直訳は「人がその兄弟に」だが、ここでは相互的な慣用表現なので、明瞭な現代日本語にした。
- source_word: הִנֵּה
  choice: 見ろ
  rationale: 近づくヨセフに注意を向ける間投詞。兄たちの直接的な発言に合う簡潔な命令表現とした。
- source_word: בַּעַל הַחֲלֹמוֹת
  choice: 夢見る者
  rationale: 直訳的には「夢の主人」だが、ここでは夢によって特徴づけられた者を指す。「夢見る者」は意味を自然に伝えつつ、文脈上の嘲りも保てる。
- source_word: הַלָּזֶה
  choice: あの
  rationale: 目の前に近づいているヨセフを指し示す、やや突き放した響きの指示語として訳した。
- source_word: בָּא
  choice: やって来る
  rationale: 接近中の動作を表す分詞。「やって来る」は進行中の到来を自然な日本語で示す。
