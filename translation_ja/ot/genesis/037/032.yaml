  text: וַֽ/יְשַׁלְּח֞וּ אֶת כְּתֹ֣נֶת הַ/פַּסִּ֗ים וַ/יָּבִ֨יאוּ֙ אֶל אֲבִי/הֶ֔ם וַ/יֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר נָ֗א הַ/כְּתֹ֧נֶת בִּנְ/ךָ֛ הִ֖וא אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/032.yaml
  text: Then they sent the robe with long sleeves and brought it to their father[a], and said, “We found this[b]. Please identify whether it is your son's robe or not.”
translation:
  language: ja
  text: 彼らは袖の長い衣[a]を送り、父のもとに持って来て言った。「これを見つけました。これがあなたの息子の衣かどうか、どうかお確かめ[b]ください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「飾りのある衣」「華やかな長衣」とも訳せる。伝統的には「色とりどりの衣」。このヘブライ語表現の正確な意味は不明である。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「見分けてください」または「それと認めてください」。見分けることと見誤ることが繰り返される物語全体で、この言葉は重要な響きを持つ。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: 送り届け
  rationale: שלחのピエル形による「送る」という動作を保ちつつ、品物を父のもとへ届ける場面に合う自然な日本語とした。
- source_word: כְּתֹנֶת הַפַּסִּים
  choice: 袖の長い衣
  rationale: כְּתֹנֶתは衣・長衣の類を指す。פַּסִּיםの意味は不確かだが、手のひら付近まで届く袖、または丈の長い衣を示す可能性が高いため、伝統的な「色とりどりの衣」を本文には採らなかった。
- source_word: וַיָּבִיאוּ אֶל אֲבִיהֶם
  choice: それを父のもとに持って来て
  rationale: 明示された「彼らの父」を簡潔に「父」とし、目的語は直前の衣を受けて「それ」と補った。話の視点に沿い、父のもとへ運んだことを表す。
- source_word: זֹאת מָצָאנוּ
  choice: これを見つけました
  rationale: 兄たちの欺瞞を含む簡潔な言い方を、説明を加えずそのまま自然な現代日本語にした。
- source_word: הַכֶּר נָא
  choice: どうかお確かめください
  rationale: נכרのヒフィル形は「見分ける、認める、同定する」の意。父への依頼として自然な敬語にし、נאを「どうか」で表した。語根が担う「認知」の含みは脚注に残した。
- source_word: הַכְּתֹנֶת בִּנְךָ הִוא אִם לֹא
  choice: これがあなたの息子の衣かどうか
  rationale: 「……か、そうでないか」という間接疑問を自然な日本語にした。「あなたの息子」という距離を置く原文の表現を「あなたの子」などに弱めず保持した。
