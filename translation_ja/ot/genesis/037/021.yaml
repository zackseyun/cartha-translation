  yaml_path: translation/ot/genesis/037/021.yaml
  text: But when Reuben heard it[a], he rescued him from their hand and said, “Let us not take his life.”
translation:
  language: ja
  text: だが、ルベンはこれを聞くと、彼を彼らの手から救い出し、「彼の命を奪うのはやめよう[a]」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼を殺すのはやめよう」。ヘブライ語では直訳すると「命にかかわるように彼を打つな」で、致命的な一撃を加えることを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: これを聞くと
  rationale: 基本義「聞く」を保ちつつ、直前に語られた兄弟たちの計画を受ける目的語を日本語として自然に補った。接続形の物語上の時間的推移は「聞くと」で表した。
- source_word: רְאוּבֵן
  choice: ルベン
  rationale: 固有名を日本語で一般的な聖書表記に音写した。
- source_word: וַיַּצִּלֵהוּ
  choice: 彼を…救い出し
  rationale: ヒフィル形の「救い出す、助け出す」という意味を、差し迫った危害からの救出にふさわしい現代日本語で表した。
- source_word: מִיָּדָם
  choice: 彼らの手から
  rationale: 単に「彼らから」とせず、支配や危害を加える力を示すヘブライ語の「手」の比喩を保持した。
- source_word: לֹא נַכֶּנּוּ נָפֶשׁ
  choice: 彼の命を奪うのはやめよう
  rationale: נכה（打つ）とנפש（命）から成る表現が、この文脈では致命的な一撃を加えて殺すことを意味するため、その意味を自然で格調ある日本語にした。字義的な打撃のイメージと別訳は脚注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として自然な流れを保った。「彼らの手から」によって原文の比喩を残し、結びのヘブライ語特有の表現は本文で意味を明確にしつつ脚注で字義を補った。
