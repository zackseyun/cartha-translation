base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/020.yaml
  text: So now[a], come, let us kill him and throw him into one of the pits, and we will say[b], ‘A wild animal has devoured him.’ Then we will see what becomes of his dreams.’
translation:
  language: ja
  text: 「さあ、今こそ、あいつを殺して、穴の一つ[a]に投げ込もう。そして、『野獣[b]があいつを食べてしまった』と言おう。そうすれば、あいつの夢がどうなるか、見てみよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「貯水穴の一つ」とも訳せる。ヘブライ語の בּוֹר は、文脈により穴、貯水穴、井戸状の場所を指す。
    reason: lexical_alternative
  - marker: b
    text: 「害をなす野獣」とも訳せる。ヘブライ語の חַיָּה רָעָה は、危険または害を及ぼす野生動物を指す表現である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לְכוּ
  choice: さあ、今
  rationale: 接続・時間を示す「そして今」と、複数への勧誘として慣用的に用いられる命令形を、差し迫った提案として自然な日本語にした。
- source_word: וְנַהַרְגֵהוּ
  choice: あいつを殺して…しよう
  rationale: 一人称複数の意志・勧誘の力を、後続の動作とまとめた「〜しよう」で表した。「あいつ」は兄たちの敵意を自然に示す。
- source_word: וְנַשְׁלִכֵהוּ
  choice: 投げ込もう
  rationale: 動詞の「投げる、放り込む」という意味と、穴の中への方向を簡潔に表す。
- source_word: בְּאַחַד הַבֹּרוֹת
  choice: 穴の一つ
  rationale: בּוֹרは穴や貯水穴を指し得るため、本文では広い意味を保つ「穴」とし、より具体的な可能性は脚注に示した。
- source_word: וְאָמַרְנוּ
  choice: と言おう
  rationale: 計画された次の行為を示すとともに、文脈上の共同意志を自然な日本語で表した。
- source_word: חַיָּה רָעָה
  choice: 獰猛な野獣
  rationale: חַיָּהの野生動物という意味と、רָעָהがここで示す危険で害を及ぼす性質を、自然で引き締まった表現にした。
- source_word: אֲכָלָתְהוּ
  choice: 食い殺した
  rationale: 基本義は「食べた」だが、人が野獣に食べられたという文脈で、捕食され死んだことを現代日本語で自然に表す。
- source_word: וְנִרְאֶה
  choice: 見てやろう
  rationale: 一人称複数形が持ち得る「見よう」と「見ることになる」の幅を保ちつつ、兄たちの挑戦的・嘲笑的な調子を表した。
- source_word: מַה יִּהְיוּ חֲלֹמֹתָיו
  choice: あいつの夢がどうなるか
  rationale: 直訳的な「彼の夢が何になるか」を、日本語で自然にしながら、夢の成就を嘲る含みを保った。
theological_decisions:
- issue: ヨセフの夢の成就に対する兄たちの言葉の調子
  choice: 「夢がどうなるか、見てやろう」
  alternative: 「夢がどうなるか、見よう」
  rationale: 夢が神から来たかどうかを本文以上に断定せず、兄たちがその成り行きを嘲って挑む語調だけを表した。
translation_notes:
  register: 明瞭な現代標準語を用い、兄たちの荒々しい敵意と嘲りを会話として自然に表した。古風すぎる語尾は避けつつ、「獰猛な野獣」など物語にふさわしい品位を保った。脚注記号は該当語の直後に置いた。
