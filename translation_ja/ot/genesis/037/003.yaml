id: GEN.37.3
reference: Genesis 37:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/יִשְׂרָאֵ֗ל אָהַ֤ב אֶת יוֹסֵף֙ מִ/כָּל בָּנָ֔י/ו כִּֽי בֶן זְקֻנִ֥ים ה֖וּא ל֑/וֹ וְ/עָ֥שָׂה ל֖/וֹ כְּתֹ֥נֶת פַּסִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/003.yaml
  text: Israel loved Joseph more than all his sons[a], because he was the son of his old age; and he made for him a richly ornamented robe.
translation:
  language: ja
  text: イスラエルは、どの息子よりもヨセフを愛していた。ヨセフが、イスラエルが年老いてからもうけた息子だったからである。そしてイスラエルは、ヨセフのために華やかな長衣[a]を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的には「色とりどりの長衣」。ヘブライ語の表現の意味は確定しておらず、華やかに飾られた衣を指すとも、手首や足首まで届く長い衣を指すとも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִשְׂרָאֵל
  choice: イスラエルは
  rationale: 本文どおり個人名「イスラエル」を保った。語頭の接続詞は物語の流れを担うが、日本語では明示しなくても自然に連続性が伝わるため、不要な「さて」や「そして」を冒頭に加えなかった。
- source_word: אָהַב
  choice: 愛していた
  rationale: 文脈上は偏愛を表すが、原語は通常の「愛する」という動詞なので、「ひいきした」と解釈的に限定しなかった。
- source_word: מִכָּל בָּנָיו
  choice: どの息子よりも
  rationale: 比較を自然な現代日本語で表しつつ、原語の男性複数「息子たち」を反映した。
- source_word: כִּי בֶן זְקֻנִים הוּא לוֹ
  choice: ヨセフが、イスラエルが年老いてからもうけた息子だったからである
  rationale: 「彼の老年の子」というヘブライ語表現の意味を明瞭にし、代名詞の指示が曖昧にならないよう父を「イスラエル」と明示した。「もうけた」は出生に関する意味を自然に伝え、「授かった」のような追加の神学的含意を避ける。
- source_word: וְעָשָׂה לוֹ
  choice: そしてイスラエルは、ヨセフのために…作った
  rationale: 接続と受益者を明示し、日本語で主語と対象が混同されないよう固有名を補った。
- source_word: כְּתֹנֶת
  choice: 長衣
  rationale: 身体を覆うチュニック状の衣服を、現代日本語で読みやすく、かつ現代的な洋服を連想させすぎない語で表した。
- source_word: פַּסִּים
  choice: 華やかな
  rationale: 語義は不確かで、色彩豊かな衣、装飾された衣、手首や足首まで届く衣などの解釈がある。本文では特定の構造や色に断定せず、特別で立派な衣という文脈上の印象を伝え、詳細は脚注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の「愛する」を維持しつつ、比較関係と指示対象を自然に明示した。衣服を表す不確かな表現については本文で一つの説に断定せず、脚注で主要な解釈を提示した。
