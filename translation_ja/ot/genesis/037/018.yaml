  text: They saw him from a distance[a], and before he came near to them, they conspired against him to kill him.
translation:
  language: ja
  text: 彼らは遠くからヨセフを見た。そして、ヨセフが彼らに近づく前に、彼らは彼を殺そうと企んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼に対して陰謀を企てた」とも訳せる。ヘブライ語の動詞は、欺きを用いて策を巡らすことを表しうるが、ここでは続く「彼を殺そうと」によって企みの目的が明示されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אֹתוֹ מֵרָחֹק
  choice: 彼らは遠くからヨセフを見つけ
  rationale: ראהはここでは視覚による認知を表す。「見つけ」は、遠方にいるヨセフを彼らが認めたという場面を自然な現代日本語で伝える。目的語の「彼」は文脈上ヨセフを指すため、明瞭さを優先して固有名詞を用いた。
- source_word: וּבְטֶרֶם יִקְרַב אֲלֵיהֶם
  choice: ヨセフがまだ自分たちのところに近づかないうちに
  rationale: בְטֶרֶםの「まだ～しないうちに／～する前に」という時間的意味と、קרב אלの「彼らのところへ近づく」という空間的意味を保持した。主語を明示して日本語での指示関係を明確にした。
- source_word: וַיִּתְנַכְּלוּ אֹתוֹ
  choice: 彼を……企んだ
  rationale: נכלのヒトパエル形は、敵意をもって策略を巡らすことを表す。後続する目的句と合わせ、「彼を殺そうと企んだ」とすることで、共同の悪意ある計画を明瞭かつ自然に表した。
- source_word: לַהֲמִיתוֹ
  choice: 彼を殺そうと
  rationale: מותのヒフィル不定詞と三人称男性単数接尾辞は、企みの目的が彼を死なせることにあったと示す。「殺そうと」は目的を簡潔に表す。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語文として簡潔に整えた。「自分たちのところに」によりאֲלֵיהֶםの方向性を保ち、代名詞の連続による曖昧さを避けるため、必要な箇所では「ヨセフ」を補った。
