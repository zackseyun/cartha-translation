  text: Then they took Joseph’s tunic[a], slaughtered a male goat, and dipped the tunic in the blood.
translation:
  language: ja
  text: そこで彼らはヨセフの衣[a]を取り、雄やぎを殺して、その衣を血に浸した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上着」「長衣」とも訳せる。ヘブライ語はチュニック状の衣服を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: そこで彼らは……取り
  rationale: 物語を進める連続形。現代日本語の自然な叙述として「そこで」を用い、前後の出来事の連続を示した。
- source_word: כְּתֹנֶת יוֹסֵף
  choice: ヨセフの長衣
  rationale: כְּתֹנֶת は身体を覆う衣を指す。日本語の「上着」では現代的で短い衣服を連想しやすいため、丈のある衣を自然に示す「長衣」とした。
- source_word: וַיִּשְׁחֲטוּ
  choice: ほふって
  rationale: 動物を屠殺するという具体的な意味を保つ。文語に偏りすぎず、聖書叙述にふさわしい重みもある。
- source_word: שְׂעִיר עִזִּים
  choice: 雄やぎ
  rationale: 雄のやぎという性別の指定を簡潔に保持した。
- source_word: וַיִּטְבְּלוּ
  choice: 浸した
  rationale: 衣を液体の中に入れる動作を自然な現代日本語で表す。「漬けた」よりも文体上の品位があり、十分に具体的である。
- source_word: הַכֻּתֹּנֶת
  choice: その長衣
  rationale: 同じ衣を指す定冠詞の働きを「その」で示し、前半の訳語と統一した。
- source_word: בַּדָּם
  choice: 血に
  rationale: 直前に屠った雄やぎの血を指すことが文脈上明白であり、日本語では「その血に」と補わずとも自然に特定される。
