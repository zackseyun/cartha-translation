revisions:
- from: すると、私たちは畑の真ん中で穀物の束を作っていた。見ると、私の束が起き上がり、まっすぐに立った。すると、あなたたちの束が私の束の周りを取り囲み[a]、それにひれ伏した[b]。
  to: 見ると、私たちは畑の真ん中で穀物の束を作っていた。見ると、私の束が起き上がり、さらにまっすぐに立った。見ると、あなたたちの束が私の束の周りに集まり[a]、私の束にひれ伏した[b]。
  rationale: 反復する夢の提示表現を「見ると」で一貫して表し、「すると」が生む因果・時間順の含みを避けた。束が周囲へ動く場面は、自然な日本語でその動きを伝える「私の束の周りに集まり」とした。ほかは原語の農耕比喩、直立、ひれ伏す動作を保っている。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:52:14Z'
