source:
  edition: WLC
  text: וְ֠/הִנֵּה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּ/ת֣וֹךְ הַ/שָּׂדֶ֔ה וְ/הִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖/י וְ/גַם נִצָּ֑בָה וְ/הִנֵּ֤ה תְסֻבֶּ֨ינָה֙ אֲלֻמֹּ֣תֵי/כֶ֔ם וַ/תִּֽשְׁתַּחֲוֶ֖יןָ לַ/אֲלֻמָּתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/007.yaml
  text: And behold[a], we were binding sheaves in the midst of the field, and behold, my sheaf rose and also stood upright; and behold[c][b], your sheaves gathered around and bowed down to my sheaf.
translation:
  language: ja
  text: 見ると、私たちは畑の真ん中で穀物の束を作っていた。見ると、私の束が起き上がり、さらにまっすぐに立った。見ると、あなたたちの束が私の束の周りに集まり[a]、私の束にひれ伏した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「周りを巡り」。このヘブライ語は、向きを変えること、または周囲を巡ることを表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「身をかがめた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: すると／見ると
  rationale: 夢を生き生きと語る反復的な提示表現。古風な「見よ」を避けつつ、場面が次々に目の前へ現れる語り口を保った。
- source_word: מְאַלְּמִים אֲלֻמִּים
  choice: 穀物の束を作っていた
  rationale: 同語根の動詞と名詞による「束を束ねる」という農作業を、過度に重複感のある日本語にせず明確に表した。穀物の種類は本文が特定していないため「麦」とはしなかった。
- source_word: בְּתוֹךְ הַשָּׂדֶה
  choice: 畑の真ん中で
  rationale: 単なる「畑で」より具体的な、畑の内部・中央という空間的ニュアンスを保った。
- source_word: קָמָה
  choice: 起き上がり
  rationale: 束が上へ立ち上がる動きを表し、後続する静止状態の「立った」と区別した。
- source_word: וְגַם נִצָּבָה
  choice: まっすぐに立った
  rationale: 起き上がった後、しっかり直立したという追加的な描写を自然な日本語で示した。
- source_word: תְסֻבֶּינָה
  choice: 周りを取り囲み
  rationale: 語根の「向きを変える、巡る」という意味から、この場面で束が周囲を囲む動きを表した。
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: ひれ伏した
  rationale: 深く身をかがめる動作を明確に表しつつ、夢の象徴が含み得る服従や敬意の意味を説明として本文に付け加えなかった。
- source_word: אֲלֻמָּתִי / אֲלֻמֹּתֵיכֶם
  choice: 私の束／あなたたちの束
  rationale: 農作業と夢の象徴の対応が明瞭になるよう、一貫して「束」と訳した。
theological_decisions:
- issue: 束がひれ伏す行為の含意
  choice: 動作そのものを「ひれ伏した」と訳す
  alternative: 「服従した」「敬意を表した」と意味を明示する
  rationale: ヘブライ語は身体動作を描き、それが服従・敬意・礼拝のいずれを意味するかは文脈に委ねられているため、解釈を本文へ持ち込まなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、夢の語りの反復と鮮明さを保った。「見よ」のような文語調は避けたが、口語的になりすぎない簡潔で品位ある文体とした。
