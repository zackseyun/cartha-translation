  text: וַ/יִּרְא֣וּ אֶחָ֗י/ו כִּֽי אֹת֞/וֹ אָהַ֤ב אֲבִי/הֶם֙ מִ/כָּל אֶחָ֔י/ו וַֽ/יִּשְׂנְא֖וּ אֹת֑/וֹ וְ/לֹ֥א יָכְל֖וּ דַּבְּר֥/וֹ לְ/שָׁלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/004.yaml
  text: When his brothers saw that their father loved him more than all his brothers[a], they hated him and could not speak peaceably to him.
translation:
  language: ja
  text: 兄たちは、父が兄弟のだれよりもヨセフを愛していたのを見て、ヨセフを憎み、彼に親しく話すことができなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼に平和に話すことができなかった」。すなわち、友好的な態度で話すことができなかったという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: 見て
  rationale: 物語を進める接続形であり、父の愛を兄たちが認識したことと、その結果としての憎しみを自然につなぐ。
- source_word: אֶחָיו
  choice: 兄たち／兄弟
  rationale: 文脈上、ヨセフの男性のきょうだいたちを指す。主語では自然な「兄たち」、比較句では集合を表す「兄弟」とした。
- source_word: כִּי
  choice: …のを
  rationale: 兄たちが見て取った内容を導く語として解し、理由だけを表す「…ので」にはしなかった。
- source_word: אָהַב
  choice: 愛している
  rationale: 基本義の「愛する」を保つ。えこひいきの含意は比較表現と文脈から伝わるため、「ひいきする」とはしない。
- source_word: אֲבִיהֶם
  choice: 父
  rationale: 三人称男性複数接尾辞を持ち、兄弟全員の父を指す。日本語では所有者が文脈上明白なので「彼らの」を省いた。
- source_word: מִכָּל אֶחָיו
  choice: 兄弟のだれよりも
  rationale: 比較の מן と כָּל を自然な現代日本語で表し、ヨセフ以外の兄弟全員との比較であることを明確にした。
- source_word: וַיִּשְׂנְאוּ
  choice: 憎み
  rationale: שׂנא の直接的な意味「憎む」を保ち、心理を弱めない。
- source_word: וְלֹא יָכְלוּ
  choice: できなかった
  rationale: 兄たちの憎しみから生じた不能を、簡潔で自然な日本語で表した。
- source_word: דַּבְּרוֹ
  choice: 彼に…話す
  rationale: 接尾辞は話しかける相手であるヨセフを指すため、「彼に話す」とした。
- source_word: לְשָׁלֹם
  choice: 親しく
  rationale: ここでの שָׁלוֹם は平和で友好的な関係・態度を示す。「親しく」は文脈に自然だが、直訳的な「平和に」という含みは脚注で保持した。
