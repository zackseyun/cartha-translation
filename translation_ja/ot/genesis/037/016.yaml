  text: He said[a], “I am looking for my brothers. Please tell me where they are pasturing.”
translation:
  language: ja
  text: 彼は言った。「兄たちを捜しています。彼らがどこで羊の群れを飼っているのか[a]、どうか教えてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「どこで放牧しているのか」または「どこで群れの世話をしているのか」とも訳せる。ヘブライ語の分詞は、放牧地で家畜を飼い、世話することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 彼は言った
  rationale: 物語を進める標準的な接続形であり、現代日本語では文頭の接続詞を補わず自然に表した。
- source_word: אֶת אַחַי
  choice: 兄たちを
  rationale: אַחַי は「私の兄弟たち」。文脈上ヨセフの年長の男兄弟を指すため、日本語では自然な「兄たち」とした。
- source_word: אָנֹכִי מְבַקֵּשׁ
  choice: 捜しています
  rationale: 独立代名詞と分詞による、今まさに続いている探索を自然な現代日本語の進行表現で示した。
- source_word: הַגִּידָה נָּא לִי
  choice: どうか教えてください
  rationale: 命令形に נָא が添えられた丁寧な依頼のニュアンスを、「どうか」と「ください」で表した。
- source_word: אֵיפֹה הֵם רֹעִים
  choice: 彼らがどこで羊の群れを飼っているのか
  rationale: 場所を尋ねる疑問と、家畜を牧して世話する継続的な行為を自然な日本語で表した。目的語はヘブライ語には明示されないが、直前の文脈にある羊の群れを補った。
