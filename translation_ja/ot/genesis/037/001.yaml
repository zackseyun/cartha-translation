id: GEN.37.1
reference: Genesis 37:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּ֣שֶׁב יַעֲקֹ֔ב בְּ/אֶ֖רֶץ מְגוּרֵ֣י אָבִ֑י/ו בְּ/אֶ֖רֶץ כְּנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/001.yaml
  text: Jacob lived in the land of his father's sojournings[a], in the land of Canaan.
translation:
  language: ja
  text: ヤコブは、父が寄留していた地[a]、カナンの地に住んでいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には「父の寄留の地」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住んでいた
  rationale: ישׁבは「座る／住む／定住する」を表す。ここでは居住の状態を自然な現代日本語で示しつつ、永住の意味を過度に強めない「住んでいた」とした。接頭のוַは物語を進めるが、独立した時を表す語ではないため、「さて」「その後」などは補わなかった。
- source_word: בְּאֶרֶץ
  choice: 地に
  rationale: אֶרֶץの領域・土地としての意味を保つため「地」とした。
- source_word: מְגוּרֵי
  choice: 寄留していた地
  rationale: מָגוֹרは、よそ者として滞在すること、寄留を指す。直訳的な「父の寄留の地」より自然でありながら、単なる居住ではない含意を保つ。
- source_word: אָבִיו
  choice: 父が
  rationale: 三人称男性単数の所有接尾辞を伴い、「彼の父」、すなわち文脈上イサクを指す。日本語では自然に「父が」とした。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地に
  rationale: 原文がאֶרֶץを繰り返して地理的領域を明示するため、単に「カナンに」とせず「カナンの地に」とした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭で、聖書本文にふさわしい落ち着いた文体とした。「寄留」は日常語よりやや改まった語だが、よそ者として一時的に住むという原語の重要な意味を簡潔に伝えるため保持した。
