  text: וַ/יַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽ/יִּמְשְׁכוּ֙ וַ/יַּֽעֲל֤וּ אֶת יוֹסֵף֙ מִן הַ/בּ֔וֹר וַ/יִּמְכְּר֧וּ אֶת יוֹסֵ֛ף לַ/יִּשְׁמְעֵאלִ֖ים בְּ/עֶשְׂרִ֣ים כָּ֑סֶף וַ/יָּבִ֥יאוּ אֶת יוֹסֵ֖ף מִצְרָֽיְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/028.yaml
  text: Then Midianite men[a], traders, passed by; and they pulled Joseph up and lifted him out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver[c][b]. Then they brought Joseph to Egypt.
translation:
  language: ja
  text: そこへ、商人であるミディアン人たちが通りかかった。彼らはヨセフを引っ張り上げて穴から出し、銀二十枚[a]でヨセフをイシュマエル人に売った。そして彼らはヨセフをエジプトへ連れて行った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すると「銀二十」で、重さまたは貨幣の単位を明記していない。本文の「枚」は日本語として読みやすくするために補った。
    reason: lexical_alternative
  - marker: b
    text: この節では、ミディアン人の商人たちとイシュマエル人が言及される一方、「引っ張り上げた」「出した」「売った」「連れて行った」の主体はいずれも単に複数形で表されている。そのため、各行為をどちらの集団がしたのかには曖昧さが残る。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: 通りかかった
  rationale: עברの移動の意味を、場面の近くを通過したことが自然に伝わる現代日本語で表した。
- source_word: אֲנָשִׁים מִדְיָנִים סֹחֲרִים
  choice: 商人であるミディアン人たち
  rationale: 「人々、ミディアン人、商う者たち」という情報を、日本語として自然な同格表現にまとめた。
- source_word: וַיִּמְשְׁכוּ וַיַּעֲלוּ אֶת־יוֹסֵף מִן־הַבּוֹר
  choice: ヨセフを引っ張り上げて穴から出し
  rationale: משךとעלהの連続を一語に畳み込まず、「引っ張り上げる」と「穴から出す」で上方への動きを明瞭にした。בורは文脈上「穴」としたが、「水ため」とも訳し得る。
- source_word: לַיִּשְׁמְעֵאלִים
  choice: イシュマエル人に
  rationale: 売却先として明示される民族名をそのまま保持した。
- source_word: בְּעֶשְׂרִים כָּסֶף
  choice: 銀二十枚
  rationale: 字義的には「銀二十」で単位が明記されていない。本文では理解しやすさのため助数詞「枚」を補い、その点を脚注で示した。
- source_word: וַיָּבִיאוּ אֶת־יוֹסֵף מִצְרָיְמָה
  choice: 彼らはヨセフをエジプトへ連れて行った
  rationale: בואの使役形と方向を示す語尾を、目的地への移送を表す自然な日本語にした。
theological_decisions:
- issue: ミディアン人とイシュマエル人が言及された後の複数形動詞の主体
  choice: 「彼ら」とし、各行為の主体を本文で特定しない
  alternative: すべての行為をミディアン人の商人たちのものとする、または売却後の移送をイシュマエル人のものと明示する
  rationale: ヘブライ語は一連の動詞を三人称複数形で記すだけで、各段階の主体を明示しない。物語上の緊張を解消する補足を本文に持ち込まず、脚注で曖昧さを説明した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔で品位ある調子にした。「そこへ」で場面の進行を示し、「こうして」は連続する移送を自然につなぐ。民族名と売買の表現は原文の厳しさを弱めず保持した。
