revisions:
- from: ヨセフはその夢を父と兄たちに話した。すると父は彼を叱って言った。「おまえが見たこの夢は、いったい何なのだ。私とおまえの母と兄たちが、本当におまえのところへ来て、地にひれ伏すというのか[a]。」
  to: ヨセフはその夢を父と兄たちに話した。すると父は彼を叱って言った。「おまえが見たこの夢は、いったい何なのだ。私と、おまえの母と兄たちが、ほんとうに来て、おまえの前で地にひれ伏すというのか[a]。」
  rationale: 主節の「来る」と、伏礼の相手を示す「おまえの前で」を分けて訳し、原文のלְהִשְׁתַּחֲוֺת לְךָ（おまえに対してひれ伏す）を明確にした。それ以外の表現と脚注は、原文の強調・口調・語義を十分に保っているため維持した。
