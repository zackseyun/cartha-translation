  text: וַ/יְסַפֵּ֣ר אֶל אָבִי/ו֮ וְ/אֶל אֶחָי/ו֒ וַ/יִּגְעַר בּ֣/וֹ אָבִ֔י/ו וַ/יֹּ֣אמֶר ל֔/וֹ מָ֛ה הַ/חֲל֥וֹם הַ/זֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲ/ב֣וֹא נָב֗וֹא אֲנִי֙ וְ/אִמְּ/ךָ֣ וְ/אַחֶ֔י/ךָ לְ/הִשְׁתַּחֲוֺ֥ת לְ/ךָ֖ אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/010.yaml
  text: And he told it to his father and to his brothers[a], and his father rebuked him and said to him, “What is this dream that you have dreamed? Shall I and your mother and your brothers indeed come to bow down to the ground before you?”
translation:
  language: ja
  text: ヨセフはその夢を父と兄たちに話した。すると父は彼を叱って言った。「おまえが見たこの夢は、いったい何なのだ。私と、おまえの母と兄たちが、ほんとうに来て、おまえの前で地にひれ伏すというのか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「おまえの前に身を低くしてひれ伏す」とも訳せる。ヘブライ語は深い伏礼を表し、ここでは必ずしも礼拝を意味しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 話した
  rationale: ピエル形のספרは「語る、話して聞かせる」の意。文脈上の目的語である夢を日本語では自然に補った。
- source_word: וַיִּגְעַר בּוֹ
  choice: 彼を叱って
  rationale: גערは強い言葉でたしなめることを表す。現代日本語で自然かつ十分な強さを持つ「叱る」とした。
- source_word: מָה הַחֲלוֹם הַזֶּה אֲשֶׁר חָלָמְתָּ
  choice: おまえが見たこの夢は、いったい何なのだ
  rationale: ヘブライ語の修辞的な問いと驚き・非難の調子を「いったい」で表した。日本語では夢を「見る」と言うため、語根反復は無理に再現しなかった。
- source_word: הֲבוֹא נָבוֹא
  choice: 本当に…来て
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「本当に」で表した。
- source_word: לְהִשְׁתַּחֲוֺת לְךָ אָרְצָה
  choice: おまえのところへ来て、地にひれ伏す
  rationale: השתחוהはここでは礼拝に限定されず、服従・敬意を示す深い伏礼を指す。ארצהの方向性を「地に」で表した。
theological_decisions:
- issue: 非祭儀的文脈における השתחוה の意味
  choice: 地にひれ伏す
  alternative: おまえを礼拝する
  rationale: 家族がヨセフに服従・敬意を示す場面であり、神礼拝の意味を持ち込まない。「ひれ伏す」は身体動作と社会的服従の含みを保つ。
- issue: 「おまえの母」の指示対象
  choice: 本文どおり「おまえの母」と訳し、人物を特定しない
  alternative: ラケル、または継母などと特定する
  rationale: この節自体は母の名や身元を明示しないため、物語上の緊張を翻訳で解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、父の叱責は「おまえ」「いったい何なのだ」で自然に表現した。原文の強調は「本当に」で保持し、荘重さを損なわず過度に古風な語法は避けた。
