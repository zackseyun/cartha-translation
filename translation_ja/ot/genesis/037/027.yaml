base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/027.yaml
  text: Come[a], let us sell him to the Ishmaelites, and let not our hand be upon him, for he is our brother[c][b], our own flesh.” And his brothers listened.
translation:
  language: ja
  text: 「さあ、彼をイシュマエル人たちに売ろう。彼に手をかけるのはやめよう[a]。彼は私たちの兄弟、私たちの肉親[b]なのだから。」兄弟たちは彼の言うことを聞き入れた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私たちの手が彼の上にあってはならない」。ここでは、彼に直接危害を加えないという意味。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私たちの肉」。すなわち、同じ血を分けた者、肉親を指す。
    reason: lexical_alternative
  - marker: c
    text: 「聞き入れた」は、「耳を傾けた」または文脈上「同意した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכוּ
  choice: さあ
  rationale: 複数形の命令だが、ここでは移動を命じるより、仲間に行動を促す間投詞的な用法。「さあ」が現代日本語の協議的な呼びかけとして自然。
- source_word: וְנִמְכְּרֶנּוּ
  choice: 彼を…売ろう
  rationale: 一人称複数の意志・勧誘を表す形で、ユダが兄弟たちに提案していることを「売ろう」で明確にした。
- source_word: לַיִּשְׁמְעֵאלִים
  choice: イシュマエル人たちに
  rationale: 定冠詞を伴う民族名を、集団を自然に示す日本語で訳した。
- source_word: וְיָדֵנוּ אַל תְּהִי בוֹ
  choice: 彼に手をかけるのはやめよう
  rationale: 直訳は「私たちの手が彼の上にあってはならない」。直接危害を加えないという慣用的意味を、ヘブライ語の「手」の比喩を残しつつ自然な日本語にした。
- source_word: כִּי
  choice: …なのだから
  rationale: 提案の理由を導く接続詞。日本語では文末の理由表現にして自然な発話の流れを保った。
- source_word: אָחִינוּ
  choice: 私たちの兄弟
  rationale: 血縁関係を明示する基本的な意味をそのまま訳した。
- source_word: בְשָׂרֵנוּ
  choice: 私たちの肉親
  rationale: 字義は「私たちの肉」だが、ここでは近い血縁を表す。「肉親」は具体的な身体性と親族関係の双方を自然に伝える。
- source_word: וַיִּשְׁמְעוּ אֶחָיו
  choice: 兄弟たちは彼の言うことを聞き入れた
  rationale: שמע は「聞く」「耳を傾ける」「聞き従う」の幅を持つ。文脈上は提案を受け入れたことを示すが、完全な意見一致と断定せず「聞き入れた」とした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明快でありながら、族長物語の発話にふさわしい簡潔で品位ある文体とした。「手」「肉」という原文の身体的な比喩は、それぞれ本文と脚注で保持した。
