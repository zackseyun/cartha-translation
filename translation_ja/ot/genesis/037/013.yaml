base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/013.yaml
  text: Then Israel said to Joseph[a], “Are not your brothers shepherding at Shechem? Come, and I will send you to them.” And he said to him, “Here I am.”
translation:
  language: ja
  text: イスラエルはヨセフに言った。「おまえの兄弟たちはシェケムで群れの世話をしているではないか。さあ、おまえを彼らのもとへ遣わそう。」ヨセフは彼に言った。「はい、ここにいます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 本文にある名をそのまま音写し、「ヤコブ」に置き換えない。
- source_word: הֲלוֹא
  choice: ではないか
  rationale: 同意を見込む修辞疑問の力を、自然な現代日本語で保つ。
- source_word: אַחֶיךָ
  choice: おまえの兄たち
  rationale: 文脈上ヨセフより年長の兄弟たちを指すため、日本語として具体的な「兄たち」とした。
- source_word: רֹעִים
  choice: 羊の群れを飼っている
  rationale: רעה の分詞が表す、家畜の群れを牧し世話する継続中の行為を明確にした。目的語は文脈から補った。
- source_word: בִּשְׁכֶם
  choice: シェケムで
  rationale: 場所における活動を示す前置詞 ב を、自然な場所格「で」で表した。
- source_word: לְכָה
  choice: さあ
  rationale: ここでは移動方向を厳密に示す「来なさい」よりも、次の派遣を促す呼びかけとして自然に表した。
- source_word: וְאֶשְׁלָחֲךָ
  choice: おまえを遣わそう
  rationale: 命令に続く一人称意志形のニュアンスを「遣わそう」で表す。
- source_word: אֲלֵיהֶם
  choice: 彼らのもとへ
  rationale: 兄たちを受ける代名詞と方向性を、自然な日本語で表した。
- source_word: הִנֵּנִי
  choice: はい、ここにおります
  rationale: 呼びかけに応じ、自ら進んで応答する定型句の意味を、敬意を含む自然な返答として保った。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある物語文。父から子への呼びかけは「おまえ」、ヨセフの応答は「おります」とし、関係性を自然に示した。原文の反復的な「彼に言った」は、日本語で指示対象が明らかなため「答えた」とした。
