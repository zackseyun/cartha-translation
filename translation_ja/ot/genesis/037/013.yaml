review_pass:
  verdict: revise
  source_fidelity: 「羊の群れを飼っている」は日本語では所有・飼育の意味にも読め、רֹעִים（群れを牧し世話する）の活動をやや曖昧にします。「群れの世話をしている」とすると、原文の分詞が示す牧畜活動を自然に表せます。また、הִנֵּנִיには敬語自体は含まれないため、「おります」は原文にない対人敬意を加えます。
  naturalness: 現行文は概ね明瞭ですが、父の「おまえ」に対するヨセフの「おります」は現代日本語の会話として敬意の度合いが強く、語調が不均衡です。「ここにいます」は自然で品位を保てます。
  terminology: 「イスラエル」「ヨセフ」「シェケム」は適切です。「兄たち」はこの物語の文脈では可能ですが、原文のאַחֶיךָは年齢関係を語彙的に指定しないため、「兄弟たち」がより直接的です。
  issues:
  - severity: medium
    issue: 「羊の群れを飼っている」
    rationale: 「飼う」は群れを所有して飼育する意味にもなり、羊飼いとして群れを牧する行為を表す原文の分詞に比べて不正確になり得ます。
  - severity: low
    issue: 「はい、ここにおります」
    rationale: 原文の定型的な自己応答 הִנֵּנִי は敬語を標示しません。「おります」は父への強い敬意を明示的に付加します。
  - severity: low
    issue: 「兄たち」
    rationale: 物語全体の事情とは整合しますが、この語自体は単に「兄弟たち」です。明示されていない年齢関係を本文の語彙として固定しないほうが直接的です。
  revised_text: イスラエルはヨセフに言った。「おまえの兄弟たちはシェケムで群れの世話をしているではないか。さあ、おまえを彼らのもとへ遣わそう。」ヨセフは彼に言った。「はい、ここにいます。」
