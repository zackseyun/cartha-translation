revisions:
- from: イスラエルはヨセフに言った。「おまえの兄たちはシェケムで羊の群れを飼っているではないか。さあ、彼らのもとへおまえを遣わそう。」ヨセフは答えた。「はい、ここにおります。」
  to: イスラエルはヨセフに言った。「おまえの兄弟たちはシェケムで群れの世話をしているではないか。さあ、おまえを彼らのもとへ遣わそう。」ヨセフは彼に言った。「はい、ここにいます。」
  rationale: 牧畜行為を明確にしつつ、過度に専門的な「牧する」は避けました。人名・地名は原文どおり音写しました。修辞疑問、派遣の意志、そして הִנֵּנִי の簡潔な応答を保ち、原文にない敬語上の含意は加えません。
