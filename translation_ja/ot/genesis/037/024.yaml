  text: Then they took him and threw him into the pit[a]. Now the pit was empty; there was no water in it.
translation:
  language: ja
  text: 彼らはヨセフをつかまえ、穴[a]に投げ込んだ。穴は空で、水はなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「貯水槽」とも訳せる。ヘブライ語の「ボール」は、水をためる穴や槽を指すことがあり、続く「水はなかった」という記述にも合う。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֻהוּ
  choice: 彼らはヨセフを捕らえ
  rationale: לקחの基本義は「取る」だが、この場面では本人の意思に反して身柄を押さえる行為なので、現代日本語として自然な「捕らえ」とした。目的語の代名詞は、単独節でも指示対象が明瞭になるよう「ヨセフ」とした。
- source_word: וַיַּשְׁלִכוּ אֹתוֹ
  choice: 投げ込んだ
  rationale: השליךの「投げる、投げ入れる」という意味と、方向を示す「穴へ」を自然な日本語で表す。「放り込んだ」よりも口語性を抑え、暴力的な動作は保った。
- source_word: הַבֹּרָה
  choice: 穴[a]の中に
  rationale: בּוֹרは穴、水溜め、井戸状の穴を指し得る。本文では意味範囲の広い「穴」とし、水がないとの記述に合う「貯水穴」を脚注の代案として示した。方向を表す接尾要素は「中に」で明示した。
- source_word: וְהַבּוֹר רֵק
  choice: その穴は空で
  rationale: 後半は穴の状態を説明する補足節である。日本語では接続詞を加えず「その穴は」と受け、「空で」によって次の節へ自然につないだ。
- source_word: אֵין בּוֹ מָיִם
  choice: 中には水がなかった
  rationale: 存在否定と明示された「水」をそのまま保ち、自然で簡潔な日本語にした。
