  text: וַ/יְקַנְאוּ ב֖/וֹ אֶחָ֑י/ו וְ/אָבִ֖י/ו שָׁמַ֥ר אֶת הַ/דָּבָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/037/011.yaml
  text: So his brothers were jealous of him[a], but his father kept the matter in mind.
translation:
  language: ja
  text: 兄たちはヨセフをねたんだ。しかし父は、このことを心に留めていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְקַנְאוּ ב֖וֹ אֶחָיו
  choice: 兄たちはヨセフをねたんだ
  rationale: קנא はこの文脈で、ヨセフの夢によって引き起こされたねたみを表す。日本語では目的語を明確にするため、文脈上の指示対象を「ヨセフ」とした。
- source_word: וְאָבִיו
  choice: しかし父は
  rationale: 接続詞 וְ は基本的に「そして」だが、兄たちのねたみと父の慎重な態度との対照を自然な日本語で示すため「しかし」とした。
- source_word: שָׁמַר
  choice: 心に留めていた
  rationale: 基本義は「守る、保つ」。ここでは、聞いた内容を忘れず意識に保ち続けるという慣用的意味を表す。
- source_word: אֶת־הַדָּבָר
  choice: このこと
  rationale: דָּבָר は「言葉、事柄、こと」の意味を持つ。ここではヨセフが語った夢とその意味合いを広く指すため、「このこと」が自然である。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で格調を保った。「ねたんだ」は自然で理解しやすく、「心に留めていた」は父がその内容を保持し考え続けた含意を伝える。
