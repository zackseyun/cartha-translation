translation:
  language: ja
  text: ヨセフは夢を見て、それを兄たちに話した。すると兄たちは、いっそう彼を憎んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּחֲלֹם יוֹסֵף חֲלוֹם
  choice: ヨセフは夢を見て
  rationale: 動詞 חלם と同根の名詞 חֲלוֹם による同族目的語構文。日本語で「夢を夢見る」とすると不自然なので、意味を保ちつつ自然な「夢を見る」とした。
- source_word: וַיַּגֵּד
  choice: それを…話した
  rationale: נגד の使役形は、知らせる、告げる、語るの意。直前の夢を目的語として補い、家族間の物語に自然な「話した」とした。
- source_word: לְאֶחָיו
  choice: 兄たちに
  rationale: אָח は広く兄弟を表すが、物語上ヨセフより年長の兄弟たちを指すため、日本語では自然で明確な「兄たち」とした。
- source_word: וַיּוֹסִפוּ עוֹד
  choice: ますます…ようになった
  rationale: יסף と עוד の組み合わせが、すでにあった憎しみの増大を表す。「ますます」により比較的な強まりを自然に示した。
- source_word: שְׂנֹא אֹתוֹ
  choice: 彼を…憎む
  rationale: יסף に続く不定詞構文を、現代日本語として自然な有限動詞表現にした。
- source_word: וַ
  choice: すると
  rationale: 最後の接続辞は、夢を話したことに続く兄たちの反応という物語の進展を示すため、「すると」とした。冒頭の接続辞は日本語では明示せず、自然な物語文とした。
