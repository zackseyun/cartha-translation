  text: וְ/נֹ֕חַ בֶּן שֵׁ֥שׁ מֵא֖וֹת שָׁנָ֑ה וְ/הַ/מַּבּ֣וּל הָיָ֔ה מַ֖יִם עַל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/006.yaml
  text: Noah was six hundred years old[b][a], and the flood was upon the earth.
translation:
  language: ja
  text: ノアは六百歳であった。そして、洪水の水が地[a]の上にあった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地」は「大地」または「土地」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נֹחַ בֶּן שֵׁשׁ מֵאוֹת שָׁנָה
  choice: ノアは六百歳であった
  rationale: 「六百年の子」というヘブライ語の年齢表現を、自然で格調を保った現代日本語にした。節頭の וְ は物語をつなぐが、日本語では無理に「そして」を置かなくても連続性が伝わる。
- source_word: וְ/הַ/מַּבּוּל
  choice: その時、洪水が
  rationale: מַבּוּל はこの物語固有の大洪水を指す。「その時」は接続詞 וְ の文脈的な連結を自然に示すが、厳密な時間従属節を新たに作るものではない。
- source_word: הָיָה מַיִם עַל הָ/אָרֶץ
  choice: 地を覆っていた
  rationale: 直訳的には「地の上に水としてあった」という特異な構文。洪水の水が地上に存在した状態を、日本語として明瞭に表した。מַיִם の水の意味は「洪水」に内包される。
- source_word: הָ/אָרֶץ
  choice: 地
  rationale: אֶרֶץ は「地」「大地」「土地」のいずれにもなり得る。「地」は洪水物語の広い範囲を自然に示しつつ、語そのものが持つ範囲の曖昧さを保てる。
theological_decisions:
- issue: הָאָרֶץ の範囲
  choice: 地
  alternative: 大地／土地
  rationale: 原語だけでは「全地球」か特定の「土地」かを語彙的に断定できない。「地」は文脈上の広がりに適合し、範囲を教理的に決め過ぎない。
- issue: הָיָה מַיִם の関係
  choice: 洪水が地を覆っていた
  alternative: 洪水は地の上に水としてあった
  rationale: 原文の叙述には状態的な緊張がある。日本語本文では意味を明瞭にしつつ、「来た」「起こった」など原文にない出来事の開始を明示する動詞は避けた。
translation_notes:
  register: 明瞭な現代標準日本語。年齢表現は平明にし、洪水の叙述には簡潔で dignified な文体を用いた。原語の状態表現を尊重し、「来た」という開始の含意は加えていない。
