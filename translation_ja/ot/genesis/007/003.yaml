  yaml_path: translation/ot/genesis/007/003.yaml
  text: Also from the birds of the sky[a], seven and seven, male and female, to keep offspring alive on the face of all the earth.
translation:
  language: ja
  text: また、空の鳥も、七、七、雄と雌を取りなさい。全地に子孫を生き延びさせるためである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּם
  choice: また……も
  rationale: 前節の動物についての命令に、鳥を追加する継続の意味を自然な現代日本語で表す。
- source_word: מֵעוֹף הַשָּׁמַיִם
  choice: 空の鳥から
  rationale: עוֹףはこの文脈では「鳥」、שָּׁמַיִםは鳥のいる領域として「空」が自然で明確である。
- source_word: שִׁבְעָה שִׁבְעָה
  choice: 七羽ずつ
  rationale: 数詞の反復による配分的表現を、日本語として理解しやすく訳した。七羽ずつか七つがいかという解釈の幅は脚注に示す。
- source_word: זָכָר וּנְקֵבָה
  choice: 雄と雌
  rationale: 動物の性別を表す標準的で簡明な日本語であり、ヘブライ語の対をそのまま保つ。
- source_word: לְחַיּוֹת
  choice: 生かしておく
  rationale: ヒフィル形が表す、命を存続させるという目的を明確に伝える。
- source_word: זֶרַע
  choice: 子孫
  rationale: 直訳は「種」だが、ここでは洪水後にも鳥の系統を存続させることを指すため、「子孫」が自然である。
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: 全地の面に
  rationale: ヘブライ語の空間的な比喩を保ちつつ、聖書文として明瞭な表現にした。
- source_word: '[前節から補われる命令]'
  choice: 取りなさい
  rationale: 原文では動詞が前節の命令から省略されている。日本語で独立した節として通じるよう、文脈上明白な命令を補った。
