id: GEN.7.22
reference: Genesis 7:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת ר֨וּחַ חַיִּ֜ים בְּ/אַפָּ֗י/ו מִ/כֹּ֛ל אֲשֶׁ֥ר בֶּ/חָֽרָבָ֖ה מֵֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/022.yaml
  text: Everything on the dry land in whose nostrils was the breath of the spirit of life died[a][b].
translation:
  language: ja
  text: 乾いた地にいたもののうち、鼻に命の息[a]があったものは、すべて死んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「命の霊の息」。ここで「霊」と訳せる語には「風」「息」という意味もある。
    reason: 原文の複合表現とרוּחַの語義の幅を示すため。
lexical_decisions:
- source_word: כֹּל אֲשֶׁר ... מִכֹּל אֲשֶׁר
  choice: もののうち…ものは、すべて
  rationale: 二重の包括表現を、日本語で範囲が明瞭になるように表した。人間だけでなく動物も含むため、「者」ではなく「もの」とした。
- source_word: נִשְׁמַת רוּחַ חַיִּים
  choice: 命の息
  rationale: 「息」と「霊／風」の意味領域が重なる複合表現であり、本文では生命を保つ呼吸という全体の意味を、自然で明瞭な日本語にした。原文の語を重ねた形は脚注に残した。
- source_word: בְּאַפָּיו
  choice: 鼻に
  rationale: 原文は三人称男性単数接尾辞を伴う分配的な表現。日本語では所有代名詞を補わず「鼻に」とするのが自然で、鼻孔に生命の息があるという意味も保たれる。
- source_word: חָרָבָה
  choice: 乾いた地
  rationale: 水に覆われた場所と対照される乾いた地面を指す。洪水の文脈を明確に保つ表現とした。
- source_word: מֵתוּ
  choice: 死んだ
  rationale: 完了した死を直接述べる動詞なので、簡潔に「死んだ」と訳した。
theological_decisions:
- issue: רוּחַを本文で「霊」と明示するか
  choice: 本文は複合句全体を「命の息」と訳し、直訳的な形を脚注に示す
  alternative: 「命の霊の息」
  rationale: ここでרוּחַを独立した霊的実体として明示すると、原文が必ずしも要求しない形而上学的区別を読み込むおそれがある。一方、語の重なりは脚注で保持し、解釈上の幅を失わないようにした。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、叙述の荘重さを損なわない簡潔な文体。「いた」は乾いた地に属するものという範囲を自然に示し、「もの」を用いて人間と動物の双方を含めた。
