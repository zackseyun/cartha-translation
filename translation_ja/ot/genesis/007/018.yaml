  text: וַ/יִּגְבְּר֥וּ הַ/מַּ֛יִם וַ/יִּרְבּ֥וּ מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/תֵּ֥לֶךְ הַ/תֵּבָ֖ה עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/018.yaml
  text: The waters prevailed and increased greatly over the earth[a], and the ark moved along on the surface of the waters.
translation:
  language: ja
  text: 水は地の上で勢いを増し、非常に増えた。箱舟は水面を進んだ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「水面に浮かんで進んだ」。ヘブライ語では直訳すると「水の面の上を行った」で、水面上の移動を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: 勢いを増し
  rationale: 語根 גבר の「強くなる、力を増す」という意味を、水の激しい増勢として自然な現代日本語で表した。単に「水位が上がる」として意味を狭めない。
- source_word: הַמַּיִם
  choice: 水
  rationale: ヘブライ語では複数形だが、日本語では洪水の水を集合的に「水」とするのが自然である。
- source_word: וַיִּרְבּוּ מְאֹד
  choice: ますます増え広がった
  rationale: רבה の増加と מְאֹד の強意を表しつつ、直前の「勢いを増し」との不自然な重複を避けた。「広がった」は地の上で水が増すという文脈に即した表現である。
- source_word: עַל הָאָרֶץ
  choice: 地の上で
  rationale: אֶרֶץ には「地」「土地」の幅があるため、ここでは範囲を解釈で限定しすぎない「地」を採用した。
- source_word: וַתֵּלֶךְ
  choice: 進んだ
  rationale: הלך の基本義「行く」を保ちながら、箱舟が水面上を移動したことを自然に示す。「漂った」ほど移動の仕方を特定しない。
- source_word: הַתֵּבָה
  choice: 箱舟
  rationale: ノア物語における תֵּבָה の定着した日本語訳であり、文脈上明確である。
- source_word: עַל פְּנֵי הַמָּיִם
  choice: 水面を
  rationale: 直訳的な「水の面の上を」が表す、水の表面上での移動を簡潔で自然な日本語にした。
theological_decisions:
- issue: הָאָרֶץ の範囲
  choice: 「地」とし、全地か特定の土地かをこの節だけで断定しない
  alternative: 「全地」または「大地」
  rationale: 本文にはここで「全」を表す語がなく、אֶרֶץ 自体が持つ意味の幅を保つため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の二つの動詞が示す水の勢いと増加を区別し、箱舟の移動方法は本文以上に限定しないようにした。
