id: GEN.7.1
reference: Genesis 7:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ לְ/נֹ֔חַ בֹּֽא אַתָּ֥ה וְ/כָל בֵּיתְ/ךָ֖ אֶל הַ/תֵּבָ֑ה כִּֽי אֹתְ/ךָ֥ רָאִ֛יתִי צַדִּ֥יק לְ/פָנַ֖/י בַּ/דּ֥וֹר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/001.yaml
  text: Then Yahweh said to Noah, “Enter the ark, you and all your household, because I have seen that you are righteous before me in this generation.”
translation:
  language: ja
  text: そこでヤハウェはノアに言われた。「あなたとあなたの家の者全員は、箱舟に入りなさい。わたしは、この世代にあって、あなたがわたしの前に正しい者であるのを見たからである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: וַיֹּאמֶר
  choice: そこで……言われた
  rationale: 物語を前へ進める接続形の働きを、自然な現代日本語で表した。神への敬意から「言われた」とした。
- source_word: בֹּא
  choice: 入りなさい
  rationale: 命令形の「来る、入る」を、箱舟を目的地とする文脈に即して自然に訳した。話者を基準に「来なさい」とする可能性を不必要に固定しない表現でもある。
- source_word: בֵּיתְךָ
  choice: あなたの家族
  rationale: ここでの「家」は建物ではなく、ノアに属する家の者たちを指すため、現代日本語で明瞭な「家族」とした。
- source_word: הַתֵּבָה
  choice: 箱舟
  rationale: ノアの物語における תֵּבָה の定着した訳語であり、箱状の避難用の舟という文脈を明確に伝える。
- source_word: כִּי
  choice: ……からである
  rationale: 箱舟に入るよう命じる理由を導く因果関係を明示した。
- source_word: רָאִיתִי
  choice: 認めた
  rationale: 字義は「見た」だが、ここではヤハウェがノアを正しい者と見て評価した意味を自然な日本語で表す。「見いだした」も可能。
- source_word: צַדִּיק
  choice: 正しい者
  rationale: 倫理的・関係的な正しさを表す語であり、本文以上にその根拠や性質を規定しない訳とした。
- source_word: לְפָנַי
  choice: わたしの前に
  rationale: 神の臨在と評価のもとにあることを示すヘブライ語の慣用表現を、意味を狭めずに保った。
- source_word: בַּדּוֹר הַזֶּה
  choice: この世代の中で
  rationale: ノアと同時代の人々の中における評価を表し、「時代」よりも原語の דּוֹר に近い「世代」を採った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に記された固有名を称号で代替せず、原語に基づく一般的な音写を用いた。
- issue: ノアの正しさの意味
  choice: あなたがわたしの前に正しい者であること
  alternative: あなただけが正しい者であること／わたしがあなたを正しいとみなしたこと
  rationale: ヘブライ語はノアに対する神の評価を述べるが、「あなただけ」とは明記せず、その正しさの根拠も説明していないため、本文の主張と神学的緊張をそのまま保った。
- issue: בַּדּוֹר הַזֶּה の関係範囲
  choice: この世代の中で
  alternative: この時代に／この世代に比べて
  rationale: 本文はノアの正しさを同時代の枠内で述べるが、それが相対的な正しさだけを意味するかどうかは断定せず、原文の幅を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。直接話法では神の発話として自然な文体を用い、「家族」「箱舟」など一般読者に理解しやすい語を選んだ。注記を要するほど本文で保持できない異読・語義上の曖昧さはないため、脚注は付していない。
