  yaml_path: translation/ot/genesis/007/017.yaml
  text: And the flood was on the earth forty days[a], and the waters increased and lifted up the ark, so that it rose above the earth.
translation:
  language: ja
  text: 洪水は四十日間、地上に続いた[a]。水は増して箱舟を持ち上げ、箱舟は地上から浮き上がった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「洪水は四十日間、地上にあった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: 続いた
  rationale: 期間を示す「四十日間」とともに用いられており、洪水がその期間にわたって存在したことを、現代日本語で自然に表す。
- source_word: הַמַּבּוּל
  choice: 洪水
  rationale: ノアの物語における特定の大洪水を指す、明快で定着した訳語。
- source_word: אַרְבָּעִים יוֹם
  choice: 四十日間
  rationale: 前置詞は明示されていないが、ここでは期間を表すため、日本語では「間」を補うのが自然である。
- source_word: עַל הָאָרֶץ
  choice: 地上に
  rationale: 洪水が地を覆っている状況を簡潔に表し、אֶרֶץの広い意味も保つ。
- source_word: וַיִּרְבּוּ הַמַּיִם
  choice: 水は増して
  rationale: 水の量や広がりが増大したことを自然に表す。
- source_word: וַיִּשְׂאוּ אֶת־הַתֵּבָה
  choice: 箱舟を持ち上げ
  rationale: 増した水が箱舟を上方へ押し上げたという物理的な動きを明確にする。
- source_word: הַתֵּבָה
  choice: 箱舟
  rationale: ノアの舟を指す、日本語聖書で広く理解される伝統的かつ文脈に適した訳語。
- source_word: וַתָּרָם
  choice: 箱舟は……浮き上がった
  rationale: 女性単数形の主語が箱舟であることを日本語で明示し、水によって地面を離れた結果を自然に表す。
- source_word: מֵעַל הָאָרֶץ
  choice: 地面から
  rationale: 箱舟が地の表面を離れて上がったことを表す。直前の「地上」との不自然な反復も避ける。
