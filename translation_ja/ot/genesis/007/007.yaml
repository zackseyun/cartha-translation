  yaml_path: translation/ot/genesis/007/007.yaml
  text: And Noah, with his sons, his wife, and his sons’ wives with him, entered the ark because of the waters of the flood.
translation:
  language: ja
  text: ノアは、息子たち、妻、息子たちの妻たちとともに、洪水の水のために箱舟に入った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 入った
  rationale: בואは文脈により「来る・行く・入る」を表す。目的地が箱舟であるため、日本語では「箱舟に入った」が自然で正確。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で広く定着した人名表記。
- source_word: בָנָיו
  choice: 息子たち
  rationale: בֵּןの複数形に三人称男性単数の接尾辞が付き、一般的な「子どもたち」ではなく、明確に「彼の息子たち」を指す。
- source_word: אִשְׁתּוֹ
  choice: 妻
  rationale: この文脈のאִשָּׁהは接尾辞とともに「彼の妻」を意味する。日本語では主語がノアと明らかなため「彼の」を省いても関係が明確。
- source_word: נְשֵׁי בָנָיו
  choice: 息子たちの妻たち
  rationale: ヘブライ語の構造「彼の息子たちの妻たち」を直接かつ自然に反映する。「嫁たち」より関係が明示的。
- source_word: אִתּוֹ
  choice: とともに
  rationale: ノアへの同伴を明示する語。列挙された家族全員がノアと一緒に入ったことを自然な日本語で示す。
- source_word: אֶל הַתֵּבָה
  choice: 箱舟に
  rationale: אֶלの方向性を助詞「に」で表し、תֵּבָהにはノア物語で定着した「箱舟」を用いる。
- source_word: מִפְּנֵי
  choice: 避けて
  rationale: 字義的には「～の前から／～のために」で、この文脈では洪水の水を理由として、またそれから逃れるために入ったことを示す。「避けて」は原因と退避の含意を簡潔に伝える。
- source_word: מֵי הַמַּבּוּל
  choice: 洪水の水
  rationale: 「洪水の水」という二つの名詞から成る原文の表現を保つ。「洪水」だけに縮約しない。
theological_decisions: []
