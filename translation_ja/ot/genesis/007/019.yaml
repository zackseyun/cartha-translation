  text: וְ/הַ/מַּ֗יִם גָּֽבְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל הָ/אָ֑רֶץ וַ/יְכֻסּ֗וּ כָּל הֶֽ/הָרִים֙ הַ/גְּבֹהִ֔ים אֲשֶׁר תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/019.yaml
  text: And the waters prevailed exceedingly over the earth[b][a], and all the high mountains under all the heavens were covered.
translation:
  language: ja
  text: 水は地[a]の上でますます勢いを増し、全天の下にある[b]高い山々はことごとく覆われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「土地」。ヘブライ語 אָרֶץ は、文脈により「地」または「土地」を意味する。
    reason: alternative_reading
  - marker: b
    text: 直訳「すべての天の下にある」。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְרוּ מְאֹד מְאֹד
  choice: ますます勢いを増し
  rationale: גבר の「強くなる、力を増す」という意味を洪水の文脈に即して表し、重ねられた מְאֹד מְאֹד の強い強調と増勢のニュアンスを自然な現代日本語で伝える。
- source_word: עַל הָאָרֶץ
  choice: 地の上で
  rationale: עַל の位置関係を「上で」とし、אָרֶץ は文脈上広い範囲を示し得る「地」と訳した。「地上」よりも原文の句構造を見せつつ、「土地」という別の理解も注で保持する。
- source_word: וַיְכֻסּוּ
  choice: 覆われた
  rationale: プアル形の受動態をそのまま反映し、山々が水に覆われた結果を明確に示す。
- source_word: כָּל הֶהָרִים הַגְּבֹהִים
  choice: 高い山々はことごとく
  rationale: כָּל の包括性を「ことごとく」で明示し、הָרִים と גְּבֹהִים をそれぞれ「山々」「高い」と素直に訳す。
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: 全天の下にある
  rationale: 日本語では「すべての天の下」より「全天の下」が自然であり、כָּל の包括性と שָּׁמָיִם の意味を保つ。別訳「空の下のすべての場所にある」を注記する。
theological_decisions:
- issue: 洪水物語における אָרֶץ の範囲
  choice: 地
  alternative: 土地
  rationale: 「全天の下」という句と結びつくため本文では広い意味を取り得る「地」を選ぶが、אָרֶץ 自体は「土地」も意味し得るため、洪水の範囲を訳文だけで断定しないよう別訳を注記する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ますます勢いを増し」で水の圧倒的な増勢を生き生きと示し、「ことごとく」で原文の包括性を自然に表した。すべての脚注記号を本文中に配置した。
