  yaml_path: translation/ot/genesis/007/024.yaml
  text: And the waters prevailed over the earth for 150 days[a].
translation:
  language: ja
  text: 水は百五十日の間、地の上で勢いをふるった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地」は「土地」とも訳せる。ヘブライ語 אֶרֶץ は文脈により、どちらの意味にもなりうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְבְּרוּ
  choice: 勢いを保った
  rationale: גבר の語義は「強くなる、優勢になる」。ここでは水がすでに増し、覆った状態が百五十日続いたことを表すため、単なる「増えた」ではなく、その圧倒的な勢力の持続を自然な日本語で示した。
- source_word: הַמַּיִם
  choice: 水
  rationale: ヘブライ語では複数形だが、日本語では集合的・物質的な水を通常「水」と表すのが自然であり、洪水の文脈にも適する。
- source_word: עַל הָאָרֶץ
  choice: 地の上で
  rationale: עַל は「上に／上で」、אֶרֶץ は文脈により「地」または「土地」を意味する。「地」は洪水物語の広い射程を保ちつつ、日本語として簡潔である。
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: 百五十日の間
  rationale: 字義的な数の配列は「五十と百の日」だが、日本語の通常の数え方に従い「百五十日」とし、継続期間であることを「の間」で明示した。
theological_decisions:
- issue: 洪水物語における אֶרֶץ の範囲
  choice: 地
  alternative: 土地
  rationale: 直近の物語は広範かつ普遍的な表現を用いるため「地」が適する。ただし אֶרֶץ 自体には「土地」の語義もあり、語彙上の可能性として脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「勢いを保った」により、גבר の力強さと、百五十日にわたる状態の継続をともに表した。
