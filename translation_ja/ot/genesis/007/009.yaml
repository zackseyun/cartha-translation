source:
  edition: WLC
  text: שְׁנַ֨יִם שְׁנַ֜יִם בָּ֧אוּ אֶל נֹ֛חַ אֶל הַ/תֵּבָ֖ה זָכָ֣ר וּ/נְקֵבָ֑ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֱלֹהִ֖ים אֶת נֹֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/009.yaml
  text: Two by two they came to Noah into the ark[a], male and female[b], just as God had commanded Noah.
translation:
  language: ja
  text: 二匹ずつ[a]、雄と雌がノアのもとへ来て、箱舟に入った[b]。神がノアに命じたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「二つ、二つ」。文脈上、動物が二匹一組で来たことを表す。
    reason: lexical_alternative
  - marker: b
    text: より字義的には「ノアのもとへ、箱舟へ来た」。
    reason: formal_rendering
lexical_decisions:
- source_word: שְׁנַיִם שְׁנַיִם
  choice: 二匹ずつ
  rationale: 数詞の反復が表す配分・組分けを、動物について自然な現代日本語で示す。「つがいずつ」は交配関係まで含意し得るため避けた。
- source_word: בָּאוּ
  choice: 来て
  rationale: 一般的な移動動詞 בוא を、ノアを到着点とする物語の視点に合わせて「来る」とした。箱舟への移動は後続句と合わせて自然な日本語に整えた。
- source_word: אֶל נֹחַ
  choice: ノアのもとへ
  rationale: ノアに向かう移動を明確にしつつ、「ノアへ」より自然で格調ある表現とした。
- source_word: אֶל הַתֵּבָה
  choice: 箱舟に入った
  rationale: אֶל 自体は「〜へ」だが、移動先が箱舟である文脈では内部への到達を示す「入った」が日本語として明瞭である。ただし形式的な別訳を脚注に残した。
- source_word: זָכָר וּנְקֵבָה
  choice: 雄と雌
  rationale: 動物の生物学的な性の組み合わせを簡潔に表し、「二匹ずつ」と同格であることを「すなわち」で明示した。
- source_word: כַּאֲשֶׁר
  choice: 〜とおり
  rationale: 動物の到来が神の命令に合致していたことを、自然な日本語で表す。
- source_word: צִוָּה אֱלֹהִים אֶת נֹחַ
  choice: 神がノアに命じられた
  rationale: 命令が動物の到来に先立つことは文脈と後続の「とおり」で明らかになる。神への敬意を示す主体尊敬語を用いたが、命令内容や実現の仕組みは補わない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この物語では唯一の神を指す単数として用いられているため、標準的に「神」と訳した。
theological_decisions:
- issue: 動物が到来した仕組みと主体性
  choice: 動物が来たことと、それが神の命令どおりであったことだけを述べる。
  alternative: 本能によって来た、神が直接集めた、またはノアが集めたと説明する。
  rationale: 原文は到来の仕組みを特定していないため、その余白を保ち、神の命令との一致のみを訳文に反映した。
- issue: 雄と雌の関係
  choice: 「二匹ずつ、すなわち雄と雌」とし、性別による組を示す。
  alternative: 「つがい」と訳して交配関係を明示する。
  rationale: 原文は雄と雌であることを述べるが、交配済みの一対という含意までは明示しないため、「つがい」は避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文としての簡潔さと品位を保った。「二匹ずつ」と「雄と雌」の関係は同格として読み取れるようにし、移動経路は日本語として自然な「来て箱舟に入った」で表した。
