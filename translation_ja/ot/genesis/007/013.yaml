  text: בְּ/עֶ֨צֶם הַ/יּ֤וֹם הַ/זֶּה֙ בָּ֣א נֹ֔חַ וְ/שֵׁם וְ/חָ֥ם וָ/יֶ֖פֶת בְּנֵי נֹ֑חַ וְ/אֵ֣שֶׁת נֹ֗חַ וּ/שְׁלֹ֧שֶׁת נְשֵֽׁי בָנָ֛י/ו אִתָּ֖/ם אֶל הַ/תֵּבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/013.yaml
  text: On that very day Noah entered the ark[a], with Shem, Ham, and Japheth, Noah’s sons, and Noah’s wife[c][b], and the three wives of his sons with them.
translation:
  language: ja
  text: まさにその日、ノアは、ノアの息子であるセム、ハム、ヤフェト、ノアの妻、そして息子たちの三人の妻と共に、箱舟に入った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「箱舟へ来た」。ここでは、箱舟の中に入ったことを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: まさにその日
  rationale: 「その日」そのものを強く特定するヘブライ語の慣用表現を、明瞭で自然な現代日本語にした。
- source_word: בָּא ... אֶל הַתֵּבָה
  choice: 箱舟に入った
  rationale: 動詞 בָּא は字義的には「来た」だが、目的地を示す אֶל と文脈により、箱舟の中へ入る動作を表す。「入った」が日本語では最も自然である。
- source_word: וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ
  choice: 息子たちのセム、ハム、ヤフェト
  rationale: בְּנֵי נֹחַ が三人の名を同格で説明していることを、重複を避けつつ明確に表した。
- source_word: וְאֵשֶׁת נֹחַ
  choice: ノアの妻
  rationale: 属格構文を自然な現代日本語で表した。
- source_word: וּשְׁלֹשֶׁת נְשֵׁי בָנָיו
  choice: 息子たちの三人の妻
  rationale: 人数と家族関係の両方を明示した。各息子に一人ずつ妻がいるという文脈にも自然に適合する。
- source_word: אִתָּם
  choice: 彼らと共に
  rationale: 男性複数形の代名詞をそのまま複数で表し、先に挙げられた一行との同行を示した。
- source_word: הַתֵּבָה
  choice: 箱舟
  rationale: ノア物語における תֵּבָה の定着した日本語訳を用いた。
