  variant: clear modern standard Japanese
source:
  edition: WLC
  text: בִּ/שְׁנַ֨ת שֵׁשׁ מֵא֤וֹת שָׁנָה֙ לְ/חַיֵּי נֹ֔חַ בַּ/חֹ֨דֶשׁ֙ הַ/שֵּׁנִ֔י בְּ/שִׁבְעָֽה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ בַּ/יּ֣וֹם הַ/זֶּ֗ה נִבְקְעוּ֙ כָּֽל מַעְיְנֹת֙ תְּה֣וֹם רַבָּ֔ה וַ/אֲרֻבֹּ֥ת הַ/שָּׁמַ֖יִם נִפְתָּֽחוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/011.yaml
  text: In the six hundredth year of Noah’s life[a], in the second month, on the seventeenth day of the month, on that day all the springs of the great deep burst open[b], and the windows of the heavens were opened.
translation:
  language: ja
  text: ノアの生涯の第六百年、第二の月、その月の十七日、まさにその日に、大いなる深淵のすべての泉[a]が裂け、天の窓[b]が開かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「泉」は「水源」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「天の窓」は「天の水門」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה לְחַיֵּי נֹחַ
  choice: ノアの生涯の第六百年
  rationale: ノアの生涯を基準とするヘブライ語の年代表現を保ちつつ、現代日本語として明瞭にした。
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: 第二の月、その月の十七日
  rationale: 月名が示されていない原文を補わず、日付の反復も自然な日本語で保持した。
- source_word: בַּיּוֹם הַזֶּה
  choice: まさにその日に
  rationale: 直前に特定された日を指すと同時に、הַזֶּה の強調を「まさに」で表した。
- source_word: נִבְקְעוּ
  choice: 裂け
  rationale: בקע のニファルが表す、裂けて開く激しい出来事を簡潔に伝える。日本語では自動詞形が自然である。
- source_word: כָּל מַעְיְנֹת תְּהוֹם רַבָּה
  choice: 広大な深淵の泉がことごとく
  rationale: מַעְיָן を「泉」、תְּהוֹם を宇宙的な原初の水を示す「深淵」とし、כָּל を「ことごとく」で明示した。רַבָּה は物理的大小に限定しない「広大な」とした。
- source_word: וַאֲרֻבֹּת הַשָּׁמַיִם
  choice: 天の窓
  rationale: 古代的・宇宙的比喩を現代科学的説明に置き換えず、אֲרֻבּוֹת の基本像である「窓」を保持した。
- source_word: נִפְתָּחוּ
  choice: 開かれた
  rationale: ニファルの受動的な形を日本語の受身で表し、前半との並行性を保った。
theological_decisions:
- issue: 洪水の水源を描く宇宙的表象
  choice: 「広大な深淵の泉」「天の窓」という原文の表象を保持する。
  alternative: 「地下水が噴き出し、空から豪雨が降った」など、現代的な自然現象として説明する。
  rationale: 本文は水源を古代の宇宙的イメージで描いているため、それを自然科学的な説明へ解消せず、物語に内在する緊張と詩的な力を保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。年代句の反復と宇宙的イメージを保ち、過度に古風な語順は避けた。脚注記号は該当表現に近づけるため、本文中では「泉がことごとく裂け[a]、天の窓が開かれた[b]」と配置するのが望ましい。
