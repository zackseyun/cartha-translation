lexical_decisions:
- source_word: וַיְהִי לְשִׁבְעַת הַיָּמִים
  choice: 七日がたつと
  rationale: 物語を進める וַיְהִי と、期間の到達点を示す時間表現を合わせ、七日後に次の出来事が生じたことを自然な現代日本語で表した。
- source_word: וּמֵי הַמַּבּוּל
  choice: 洪水の水
  rationale: 構文上定まった『洪水の水』を明確に表し、『洪水』だけに縮約して原文の מֵי（水）を失わないようにした。
- source_word: הָיוּ עַל
  choice: 上にあった
  rationale: 原文の状態動詞『あった／存在した』を保った。文脈上『押し寄せた』とも自然に解しうるが、ここでは出来事性を補って曖昧さを狭めない。
- source_word: הָאָרֶץ
  choice: 地
  rationale: אֶרֶץ が持つ『地／土地』の語義幅を日本語の『地』で比較的よく保ち、脚注で別訳を示した。
theological_decisions:
- issue: 洪水物語における אֶרֶץ の範囲
  choice: 地
  alternative: 土地、全地、大地
  rationale: この語だけでは局地的な『土地』か、より広い『全地／大地』かが確定しない。本文では範囲を過度に確定しない『地』を採り、語義上の可能性を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。短い物語文として自然にしつつ、הָיוּ עַל の静的な表現と אֶרֶץ の範囲の曖昧さを保持した。
