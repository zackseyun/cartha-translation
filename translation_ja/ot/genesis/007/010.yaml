  text: And after seven days[b][a], the waters of the flood came upon the earth.
translation:
  language: ja
  text: 七日が過ぎると、洪水の水が地[a]の上にあった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「土地」「大地」。ヘブライ語は文脈により、特定の土地にも、より広い地にも用いられる。
