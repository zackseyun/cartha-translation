  text: הֵ֜מָּה וְ/כָל הַֽ/חַיָּ֣ה לְ/מִינָ֗/הּ וְ/כָל הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ לְ/מִינֵ֑/הוּ וְ/כָל הָ/ע֣וֹף לְ/מִינֵ֔/הוּ כֹּ֖ל צִפּ֥וֹר כָּל כָּנָֽף־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/014.yaml
  text: they[a], and every wild animal according to its kind, and every livestock animal according to its kind, and every creeping thing that creeps on the earth according to its kind[b], and every bird according to its kind—every winged bird.
translation:
  language: ja
  text: 彼らと、種類ごとのすべての野生動物、種類ごとのすべての家畜、地の上を這うすべての生き物を、その種類ごとに、種類ごとのすべての鳥、すなわち翼のあるすべての鳥[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「すべての鳥、すべての翼」。翼のある鳥を漏れなく含むことを強調する同格的な表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: 彼ら
  rationale: 三人称男性複数代名詞で、直前の節に登場するノアとその家族を指す。文脈上、自然に「彼ら」とした。
- source_word: הַחַיָּה
  choice: 野生動物
  rationale: 創世記の動物分類では、後続の בְּהֵמָה（家畜）と区別される野生の陸生動物を指すため。
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: 種類ごとの
  rationale: מִין による分類表現を、明瞭で簡潔な現代日本語にした。
- source_word: הַבְּהֵמָה
  choice: 家畜
  rationale: 野生動物と対照をなす、人に飼われる動物の総称として自然であり、「牛」などに狭めない。
- source_word: הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: 地の上を這う……すべてのもの
  rationale: 名詞と同語根の分詞による反復を日本語でも「這う」によって反映しつつ、小さな地上性動物を広く含められる表現とした。
- source_word: הָעוֹף
  choice: 鳥
  rationale: עוֹף は広く飛ぶ生き物を表し得るが、後続する צִפּוֹר と כָּנָף の同格的説明から、ここでは「鳥」が自然である。
- source_word: כֹּל צִפּוֹר כָּל כָּנָף
  choice: すなわち翼のあるすべての鳥
  rationale: 直訳的には「すべての鳥、すべての翼」だが、後半を翼ある鳥を総括・強調する同格表現として自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 列挙の荘重さと分類表現の反復を保ちながら、現代の一般読者に明瞭な語彙を用いた。冒頭は前節から続く構文であるため「彼らと」とし、末尾の「であった」によって日本語の文として整えた。
