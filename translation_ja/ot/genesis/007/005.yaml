id: GEN.7.5
reference: Genesis 7:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/005.yaml
  text: And Noah did according to all that Yahweh had commanded him[a].
translation:
  language: ja
  text: ノアは、ヤハウェが命じたことをすべて、そのとおりに行った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳：「ヤハウェが彼に命じたすべてに従って行った。」
    reason: 原文のכְּכֹל אֲשֶׁרの形式と、צִוָּהוּに含まれる「彼に」を示すため。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 行った
  rationale: עשהは広く「する、作る」を意味するが、命令への服従を述べるこの構文では「行った」が自然であり、具体的な行為を必要以上に限定しない。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: כְּכֹל אֲשֶׁר
  choice: ことをすべて、そのとおりに
  rationale: 前置詞כְּの一致・準拠の意味と、כֹּלの全体性の両方を、明瞭で自然な現代日本語で表した。
- source_word: צִוָּהוּ
  choice: 命じた
  rationale: צוהの基本義をそのまま表す。「彼に」に当たる目的語接尾辞は、日本語では文脈上明らかなため本文では省略した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名יהוהを日本語で音写した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名יהוהを用いていることを明示し、称号への置換や特定の伝統的発音の採用を避けた。
- issue: ノアの服従の完全性
  choice: 「すべて、そのとおりに」
  alternative: 「命じられたことを行った」
  rationale: כְּכֹלが示す、命令全体への一致を保持した。ただし、ノアの内面的動機までは本文に付加しない。
translation_notes:
  register: 簡潔で格調を保ちつつ、一般の現代日本語話者に分かりやすい語順とした。「そのとおりに」により原文の準拠の意味を自然に表現している。
