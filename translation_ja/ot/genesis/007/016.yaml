id: GEN.7.16
reference: Genesis 7:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/בָּאִ֗ים זָכָ֨ר וּ/נְקֵבָ֤ה מִ/כָּל בָּשָׂר֙ בָּ֔אוּ כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִ֑ים וַ/יִּסְגֹּ֥ר יְהוָ֖ה בַּֽעֲדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/016.yaml
  text: And those that entered[a], male and female from all flesh, as God had commanded him[c][b]; and Yahweh shut him in.
translation:
  language: ja
  text: 入って来たものたち[a]、すなわち、あらゆる生き物のうちの雄と雌[b]は、神が彼に命じたとおりに入った。そしてヤハウェは彼を中に閉じ込めた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「入って来るものたち」または「入る者たち」とも訳せる。原文は定冠詞の付いた分詞。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「すべての肉から」。ここでの「肉」は生き物全体を集合的に指すヘブライ語の表現。
    reason: cultural_note
  - marker: c
    text: 直訳的には「ヤハウェは彼の後ろで（または彼のために）閉じた」。文脈上は箱舟の戸を閉めたことが含意されるが、原文に「戸」という語はない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּאִים ... בָּאוּ
  choice: 入って来たものたちは……入った
  rationale: 冠詞付き分詞と定動詞の反復を保ち、箱舟への移動を日本語で明確に表した。
- source_word: זָכָר וּנְקֵבָה
  choice: 雄と雌
  rationale: ここでは人間だけでなく動物を指すため、性別の対を自然な日本語で表した。
- source_word: מִכָּל בָּשָׂר
  choice: すべての肉なるものの中から
  rationale: 前置詞 מִן の「～から」と、בָּשָׂר の集合的な「肉なるもの」をともに保った。
- source_word: כַּאֲשֶׁר צִוָּה אֹתוֹ אֱלֹהִים
  choice: 神が彼に命じたとおりに
  rationale: 命令への一致を表す כַּאֲשֶׁר を「とおりに」とし、原文の男性単数代名詞を「彼」で保持した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写した。
- source_word: וַיִּסְגֹּר ... בַּעֲדוֹ
  choice: 彼の後ろを閉ざした
  rationale: 原文が扉を明記していないことを尊重し、בַּעֲדוֹ の空間的な含みを保った。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文には称号ではなく固有の神名が記されているため、その区別を本文に残した。
- issue: 神が閉ざした対象
  choice: 彼の後ろを閉ざした
  alternative: 彼を中に閉じ込めた／彼の後ろの戸を閉めた
  rationale: 神による保護という含意や「戸」という補語を本文で確定せず、原文の簡潔さと曖昧さを保持した。
translation_notes:
  register: 現代標準日本語を基調としつつ、「肉なるもの」「閉ざした」に簡潔で荘重な聖書叙述の調子を残した。原文の分詞と定動詞の反復、前置詞「～から」、神名、および閉じた対象が明示されない点を保持した。
