  text: וַ/יָּבֹ֥אוּ אֶל נֹ֖חַ אֶל הַ/תֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֨יִם֙ מִ/כָּל הַ/בָּשָׂ֔ר אֲשֶׁר בּ֖/וֹ ר֥וּחַ חַיִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/015.yaml
  text: They came to Noah into the ark[a], two by two from all flesh in which was the breath of life.
translation:
  language: ja
  text: 命の息[a]のあるすべての生き物が、二匹ずつ、ノアのところへ箱舟に入って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「命の霊」とも訳せる。ヘブライ語の「ルーアハ」には「息」「風」「霊」という意味がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 来て、箱舟に入った
  rationale: בוא は移動を表し、続く二つの אֶל 句が到達先を示す。日本語では「ノアのもとに来て、箱舟に入った」とすることで、原文の移動の流れと文脈上の到着点を自然に表す。
- source_word: אֶל נֹחַ
  choice: ノアのもとに
  rationale: 人を目標とする אֶל を、現代日本語で自然な「ノアのもとに」と訳した。
- source_word: אֶל הַתֵּבָה
  choice: 箱舟に入った
  rationale: אֶל 自体は「〜へ／〜に」だが、乗船の文脈では内部への移動が意図される。「箱舟に入った」はその到達点を明確にする。
- source_word: שְׁנַיִם שְׁנַיִם
  choice: 二匹ずつ
  rationale: 数詞の反復による配分の意味を表す。対象が動物であるため、自然な助数詞「匹」を用いた。雌雄一対とは明示せず、単に二匹ずつという原文の表現を保つ。
- source_word: מִכָּל הַבָּשָׂר
  choice: あらゆる肉なるものの中から
  rationale: בָּשָׂר の字義と洪水物語における反復的・主題的な響きを保つため、「生き物」と平滑化せず「肉なるもの」とした。מִן の選択・分離の意味は「中から」で表した。
- source_word: אֲשֶׁר בּוֹ
  choice: がある
  rationale: 「その中に〜がある」というヘブライ語の構文を、日本語の連体修飾として自然にまとめた。
- source_word: רוּחַ חַיִּים
  choice: 命の息
  rationale: 動物の生命を述べる文脈では רוּחַ を「息」と取るのが適切である。חַיִּים は形態上複数だが、ここでは慣用的に単数概念の「命」とした。
theological_decisions:
- issue: רוּחַ חַיִּים における רוּחַ の意味
  choice: 命の息
  alternative: 命の霊
  rationale: רוּחַ には「息」「風」「霊」の意味があり得る。ここでは箱舟に入る動物の生命を描くため本文では「息」としたが、「霊」という語義の可能性を脚注に残し、神学的含意を断定しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。原文の「肉」の主題的表現を「肉なるもの」として保持しつつ、動物を数える箇所では自然な「二匹ずつ」を用いた。
