id: GEN.7.23
reference: Genesis 7:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּ֜מַח אֶֽת כָּל הַ/יְק֣וּם אֲשֶׁ֣ר עַל פְּנֵ֣י הָֽ/אֲדָמָ֗ה מֵ/אָדָ֤ם עַד בְּהֵמָה֙ עַד רֶ֨מֶשׂ֙ וְ/עַד ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יִּמָּח֖וּ מִן הָ/אָ֑רֶץ וַ/יִשָּׁ֧אֶר אַךְ נֹ֛חַ וַֽ/אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָֽה־־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/023.yaml
  text: He blotted out every living thing that was on the face of the ground[a], from man to livestock to creeping things and to the birds of the heavens. They were blotted out from the earth, and only Noah was left[c][b], and those who were with him in the ark.
translation:
  language: ja
  text: こうして神は、地面の上にいたすべての生き物をぬぐい去った[a]。人[b]から家畜、地を這うもの、空の鳥[c]に至るまで、彼らは地上からぬぐい去られた。ただノアと、箱舟の中で彼と共にいたものたちだけが残った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「消し去った」とも訳せる。ヘブライ語の動詞には、拭ってなくす、または文字などを消すというイメージがある。
    reason: lexical_alternative
  - marker: b
    text: ここで「人」と訳したヘブライ語アダムは、人類を代表して指している。「人類」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳「天の鳥」。「空を飛ぶもの」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמַח / וַיִּמָּחוּ
  choice: ぬぐい去った／ぬぐい去られた
  rationale: מחה が持つ「拭ってなくす、消し去る」という比喩を保つ。二度目はニファル形の受動的表現を反映した。
- source_word: כָּל הַיְקוּם
  choice: すべての生き物
  rationale: 洪水物語の文脈では、抽象的な「存在」ではなく、地上に存在していた生き物全体を指すため。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 地面の上に
  rationale: ヘブライ語の「地面の面に」という空間的表現を、明瞭で自然な現代日本語にした。
- source_word: מֵאָדָם
  choice: 人から
  rationale: 単数形 אָדָם を、人類を代表する集合的な「人」として訳し、後続する生き物の列挙との形を保った。
- source_word: בְּהֵמָה
  choice: 家畜
  rationale: この語が通常指す飼育動物を、現代日本語で明確に表す。
- source_word: רֶמֶשׂ
  choice: 地を這うもの
  rationale: 地面近くを動く小動物を指す語の具体的な像を保った。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 空の鳥
  rationale: 「天／空の飛ぶもの」を、一般読者に自然で明瞭な表現にした。
- source_word: מִן הָאָרֶץ
  choice: 地上から
  rationale: אֶרֶץ の意味範囲を保ちつつ、生き物が地から除かれたという文脈を自然に表した。
- source_word: וַיִּשָּׁאֶר אַךְ נֹחַ
  choice: ただノア…だけが残った
  rationale: 制限を表す אַךְ と、「残る」を意味する שׁאר の双方を明示した。
- source_word: וַאֲשֶׁר אִתּוֹ בַּתֵּבָה
  choice: 箱舟の中で彼と共にいたものたち
  rationale: ノアと共にいた人間と動物の双方を含み得るよう、「者たち」ではなく「ものたち」とした。תֵּבָה はノア物語で定着している「箱舟」と訳した。
theological_decisions:
- issue: 洪水による滅びの範囲
  choice: 本文が挙げる人・陸上動物・鳥が地上からぬぐい去られたという物語上の主張を、そのまま表現する。
  alternative: 地域的な誇張表現と限定する、または現代科学的意味で全地球規模だったと明示する。
  rationale: ヘブライ語本文の包括的な語調は弱めず、同時に洪水の地理的範囲をめぐる特定の解釈を訳文に付加しないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「ぬぐい去る」の反復によって原文の厳粛さと修辞を保った。冒頭の動詞の主語はヘブライ語では文脈から補われるため、直前の文脈上の行為者である神を日本語で明示した。「地面」と「地上」を使い分け、אֲדָמָה と אֶרֶץ の語感の違いも可能な範囲で示した。
