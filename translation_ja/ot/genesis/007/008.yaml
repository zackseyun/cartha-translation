  variant: clear modern standard Japanese
source:
  edition: WLC
  text: מִן הַ/בְּהֵמָה֙ הַ/טְּהוֹרָ֔ה וּ/מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֥ר אֵינֶ֖נָּ/ה טְהֹרָ֑ה וּ/מִ֨ן הָ/ע֔וֹף וְ/כֹ֥ל אֲשֶׁר רֹמֵ֖שׂ עַל הָֽ/אֲדָמָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/008.yaml
  text: From the clean animals and from the animals that are not clean[a], and from the birds and everything that creeps on the ground—
translation:
  language: ja
  text: 清い動物の中からも、清くない動物[a]の中からも、また鳥の中からも、地面を這うすべてのものの中からも――
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「汚れた動物」とも訳せる。ヘブライ語では、直訳すると「清くない動物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן
  choice: 〜の中から
  rationale: 列挙された各分類から取られたことを示す前置詞。日本語では「〜から」より「〜の中から」が分類内からの選択を明確にし、反復によってヘブライ語の列挙構造も保てる。
- source_word: בְּהֵמָה
  choice: 動物
  rationale: 鳥や地面を這うものと対置される広い分類であり、家畜だけに限定しない「動物」が文脈に合う。
- source_word: טְּהוֹרָה
  choice: 清い
  rationale: 動物の儀礼的分類を表す語として、現代日本語の聖書文体で自然かつ簡潔な「清い」を採用した。
- source_word: אֲשֶׁר אֵינֶנָּה טְהֹרָה
  choice: 清くない
  rationale: 原文は「汚れた」に相当する単一語ではなく、「清くない」という否定表現を用いるため、その形を保持した。
- source_word: עוֹף
  choice: 鳥
  rationale: 飛ぶ生き物を広く指し得るが、この文脈では明瞭で自然な総称「鳥」が適切である。
- source_word: כֹּל אֲשֶׁר רֹמֵשׂ
  choice: 這うすべてのもの
  rationale: רמשׂ の動作的な意味を「這う」で表し、分類全体を「すべてのもの」として訳した。
- source_word: עַל הָאֲדָמָה
  choice: 地面を
  rationale: 生き物が這う場所としての土の表面を指すため「地面」とした。日本語では「地面を這う」が自然なので、助詞は「を」を用いた。
theological_decisions:
- issue: 清浄分類の表現
  choice: 清い／清くない
  alternative: 清い／汚れた
  rationale: 後代の制度的用語へ過度に寄せず、原文の非対称な「清い」「清くない」という表現を保ち、解釈上の含みを狭めない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。文末のダッシュは、原文が次節へ続く列挙の一部であり、この節だけでは文が完結しないことを示す。
