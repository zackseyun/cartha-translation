  text: כִּי֩ לְ/יָמִ֨ים ע֜וֹד שִׁבְעָ֗ה אָֽנֹכִי֙ מַמְטִ֣יר עַל הָ/אָ֔רֶץ אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וּ/מָחִ֗יתִי אֶֽת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר עָשִׂ֔יתִי מֵ/עַ֖ל פְּנֵ֥י הָֽ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/004.yaml
  text: For in seven more days I will make it rain on the earth forty days and forty nights[d][c][b][a], and I will wipe out every living thing that I have made from the face of the ground.
translation:
  language: ja
  text: あと七日すれば[a]、わたしは四十日四十夜、地上に雨を降らせ、わたしが造ったすべての生き物[b]を地の表からぬぐい去る[c]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「さらに七日たつと」。雨が降り始めるまで七日残っていることを示す表現。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「立っているものすべて」または「存立するものすべて」。この文脈では、洪水の裁きを受ける生ける被造物全体を指す。
    reason: lexical_clarification
  - marker: c
    text: 「ぬぐい去る」と訳した語には、拭いて消す、抹消するというイメージがある。原文は「地の表から」と続く。
    reason: lexical_clarification
lexical_decisions:
- source_word: כִּי
  choice: からである
  rationale: 前節の命令の理由を示す接続語として、文末で自然に理由関係を表した。
- source_word: לְיָמִים עוֹד שִׁבְעָה
  choice: あと七日すれば
  rationale: 雨が降り始めるまで七日残っていることを示すヘブライ語の時間表現を、明瞭で自然な日本語にした。
- source_word: מַמְטִיר עַל הָאָרֶץ
  choice: 地上に雨を降らせ
  rationale: 使役形が示す神の直接的な働きを「降らせ」で保ち、הָאָרֶץ は洪水の文脈にふさわしく「地上」とした。
- source_word: כָּל הַיְקוּם
  choice: すべての生きるもの
  rationale: 語の基本像は「立っているもの／存立するもの」だが、この文脈では洪水の裁きを受ける生けるもの全体を指す。「すべての存在」では範囲を広げすぎるため避けた。
- source_word: וּמָחִיתִי
  choice: ぬぐい去る
  rationale: מחה が持つ、拭いて消し去るという具体的な比喩を保ちつつ、現代日本語として理解しやすくした。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 大地の面から
  rationale: 「面から」という原文の空間的な表現を保ち、先の הָאָרֶץ「地上」と הָאֲדָמָה「大地」の語彙上の違いも示した。
theological_decisions:
- issue: 洪水の裁きの範囲
  choice: 「地上」「すべての生きるもの」という広い表現を用い、本文の包括的な響きを保つ。
  alternative: הָאָרֶץ を「その地」として地域的な範囲を明示する。
  rationale: この節の表現は広範な裁きを語るが、翻訳によって現代の科学的・教派的論争への結論を付け加えず、原文の強い包括性そのものを伝える。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、「大地の面」「ぬぐい去る」によって原文の具体的で厳粛な表現を保った。理由を示す כִּי は、前節とのつながりが自然に読めるよう文末の「からである」で表した。
