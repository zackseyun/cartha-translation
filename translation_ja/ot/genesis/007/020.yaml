  text: The waters rose fifteen cubits higher, and the mountains were covered.
translation:
  language: ja
  text: 水は十五キュビト高くなり、山々は覆われた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גָּבְרוּ
  choice: 増し
  rationale: 水が勢いを増して水位が上がったことを、文脈に即して自然な日本語で表す。
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה מִלְמַעְלָה
  choice: さらに十五キュビト
  rationale: 直訳的には「上へ十五アンマ」。直前からの水位上昇量を示す表現として「さらに」を用い、古代の単位名は換算せず保持する。
- source_word: וַיְכֻסּוּ הֶהָרִים
  choice: 山々は覆われた
  rationale: 受動形と複数形をそのまま反映し、簡潔で荘重な叙述とする。
theological_decisions:
- issue: 十五キュビトが何を基準にした高さか
  choice: 「さらに十五キュビト」とし、水位の上昇量として表現する
  alternative: 「山々の上、十五キュビトまで」として山頂からの深さを明示する
  rationale: ヘブライ語の簡潔な表現には係り受けの余地があるため、山頂からの深さを明示して解釈を固定せず、英語POBの監査済み判断とも整合させた。
translation_notes:
  register: 明瞭で現代的な標準日本語。簡潔な物語調を保ち、度量衡は聖書本文で一般的な「キュビト」とした。
