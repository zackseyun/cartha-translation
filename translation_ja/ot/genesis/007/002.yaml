source:
  edition: WLC
  text: מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה תִּֽקַּח לְ/ךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְ/אִשְׁתּ֑/וֹ וּ/מִן הַ/בְּהֵמָ֡ה אֲ֠שֶׁר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְ/אִשְׁתּֽ/וֹ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/002.yaml
  text: From every clean animal you shall take for yourself seven pairs[a], a male and its mate; and from the animals that are not clean, two[b], a male and its mate.
translation:
  language: ja
  text: 清い動物は種類ごとに、雄と雌の組を七組[a]、自分のために取りなさい。また、清くない動物[b]は、雄一匹とその相手の雌一匹を取りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「七、七、雄とその相手の雌」。ここでは七組の意味としたが、七匹の意味に取る見方もある。
    reason: alternative_reading
  - marker: b
    text: 「汚れた動物」とも訳せる。ヘブライ語は「清くない動物」と表現している。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל הַבְּהֵמָה
  choice: 動物はすべて、それぞれ
  rationale: מִן＋כֹּלの集合からの選択と分配の意味を、現代日本語で自然に表した。בְּהֵמָהはここで狭義の「家畜」に限定せず、「動物」とした。
- source_word: הַטְּהוֹרָה
  choice: 清い
  rationale: 後半の「清くない」と対をなし、清浄・不浄の区別を簡潔に表す。本文で「儀礼的に」と補って意味を限定することは避けた。
- source_word: תִּקַּח לְךָ
  choice: 自分のために取りなさい
  rationale: 命令として機能する未完了形を「取りなさい」とし、לְךָも「自分のために」と明示した。
- source_word: שִׁבְעָה שִׁבְעָה
  choice: それぞれ七つがいずつ
  rationale: 数詞の反復が示す分配性と、後続する雄雌の組み合わせを自然な日本語で表した。七匹と解する余地は脚注に残した。
- source_word: אִישׁ וְאִשְׁתּוֹ
  choice: 雄とその相手の雌
  rationale: 字義的には「男とその妻」だが、動物について雄雌の対を表す慣用表現である。単なる「雄と雌」よりも対応する相手という含みを保った。
- source_word: אֲשֶׁר לֹא טְהֹרָה הִוא
  choice: 清くない
  rationale: 原文が単一の反意語ではなく「清くない」と否定表現を用いる点を保持した。
- source_word: שְׁנַיִם
  choice: 二匹
  rationale: 語義は「二」であり、日本語では対象が動物であることを明確にするため助数詞「匹」を補った。後続句により雄雌一匹ずつの組み合わせであることが示される。
theological_decisions:
- issue: 清い動物の数を示す表現の解釈
  choice: 七つがい
  alternative: 七匹
  rationale: שִׁבְעָה שִׁבְעָהの反復と、直後の「雄とその相手の雌」は、雄雌を一組として七組取る意味を強く示す。ただし、七個体と理解する解釈もあるため脚注に明記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令としての重みを保つ端正な文体とした。「つがい」は平仮名書きとし、「雄」「雌」は一般的で簡潔な表記を採用した。
