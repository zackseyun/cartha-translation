base_translation:
  language: en
  yaml_path: translation/ot/genesis/007/021.yaml
  text: 'And all flesh that moved on the earth died: birds[a], livestock, wild animals, every swarming thing that swarms on the earth, and all mankind.'
translation:
  language: ja
  text: 地上を動くすべての生き物、すなわち、鳥、家畜、野生動物、地上に群がるあらゆる生き物、そしてすべての人間が死んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: 死に絶えた
  rationale: גועは「死ぬ、息絶える」を表す。ここでは洪水による包括的な死を述べるため、現代日本語として自然で厳粛な「死に絶えた」とした。
- source_word: כָּל בָּשָׂר
  choice: すべての肉なるもの
  rationale: 「すべての肉」というヘブライ語の表現を保ちつつ、生き物を集合的に指すことが伝わる形とした。洪水物語における反復表現とのつながりも保たれる。
- source_word: הָרֹמֵשׂ
  choice: 動く
  rationale: רמשは文脈により「這う、群がる、動く」を意味する。後続の列挙には鳥や家畜も含まれるため、狭く限定しない「動く」が適切である。
- source_word: עַל הָאָרֶץ
  choice: 地の上
  rationale: ארץは「地、土地」を意味し得るが、この洪水物語の範囲と日本語での聖書的な品位を考慮し、「地の上」とした。
- source_word: בָּעוֹף
  choice: 鳥
  rationale: עוףは飛ぶ生き物を広く指し得るが、この動物分類では自然で明瞭な「鳥」とした。
- source_word: וּבַבְּהֵמָה
  choice: 家畜
  rationale: בהמהはここで野生動物と対比される飼育動物の類を指すため、「家畜」とした。
- source_word: וּבַחַיָּה
  choice: 野の獣
  rationale: חיהは家畜と対比される野生動物を指す。現代でも理解でき、文章の品位を保つ「野の獣」とした。
- source_word: וּבְכָל הַשֶּׁרֶץ הַשֹּׁרֵץ
  choice: 群がるすべてのもの
  rationale: 名詞שׁרץと同根の分詞שׁרץによる反復は、日本語で逐語的に再現すると不自然になるため、「群がるすべてのもの」として意味を明瞭にした。小さく群生する生き物の類を表す。
- source_word: וְכֹל הָאָדָם
  choice: そして全人類
  rationale: 定冠詞付きאָדָםはここで個々の男性ではなく人類全体を集合的に指すため、包摂的で明瞭な「全人類」とした。
theological_decisions:
- issue: הָאָדָםの集合的意味
  choice: 全人類
  alternative: すべての人／すべての人間
  rationale: 文脈上、אָדָםは特定の男性や個人ではなく、人類を一つの類として指す。「全人類」はその集合的・包括的意味を過不足なく伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「肉なるもの」「野の獣」により原文の分類表現と厳粛な調子を保持した。「すなわち」を補って、冒頭の総称と後続する列挙の関係を日本語で明確にした。
