  text: לְ/אַבְרָהָ֥ם לְ/מִקְנָ֖ה לְ/עֵינֵ֣י בְנֵי חֵ֑ת בְּ/כֹ֖ל בָּאֵ֥י שַֽׁעַר עִירֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/018.yaml
  text: to Abraham as a possession before the eyes of the sons of Heth[a], before all who entered the gate of his city.
translation:
  language: ja
  text: それは、アブラハムの所有となった。ヘトの子ら[a]の面前で、その町の門に入るすべての人々の前で。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヒッタイト人」。直訳は「ヘトの子ら」。
    reason: 民族名としての文脈的訳と、ヘブライ語の字義的表現を併記するため。
lexical_decisions:
- source_word: לְאַבְרָהָם לְמִקְנָה
  choice: アブラハムの所有地として
  rationale: 二つの לְ を、譲渡の受益者とその結果を示す法的文脈に即して自然な日本語にまとめた。前節から続く文であり、「確定した」を補うことで土地が正式に所有物となったことを表す。
- source_word: לְעֵינֵי
  choice: 見ている前で
  rationale: 直訳的な「目の前で」のイメージを保ちつつ、公然と証人の面前で行われたことが明瞭になる表現とした。
- source_word: בְנֵי חֵת
  choice: ヘトの子孫
  rationale: 字義的には「ヘトの息子たち」だが、集団的な民族・子孫の呼称なので、現代日本語で自然な「ヘトの子孫」とした。「ヒッタイト人」も文脈上可能なため脚注に示す。
- source_word: בְּכֹל בָּאֵי
  choice: すべての人々の前で
  rationale: בְּכֹל と分詞 בָּאֵי を合わせ、取引を目撃した公的共同体の全員を指す自然な表現とした。
- source_word: שַׁעַר עִירוֹ
  choice: その町の門
  rationale: 古代の町の門が公的・法的手続きの場であることを損なわず、簡潔に訳した。接尾辞の指示対象にはわずかな曖昧さがあるため、「彼の町」ではなく文脈的に自然な「その町」とした。
theological_decisions: []
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある法的叙述。原文は前節から続く断片的な構文なので、日本語では「確定した」を補って独立した節として理解できる形にした。
