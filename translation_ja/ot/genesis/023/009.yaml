  text: וְ/יִתֶּן לִ֗/י אֶת מְעָרַ֤ת הַ/מַּכְפֵּלָה֙ אֲשֶׁר ל֔/וֹ אֲשֶׁ֖ר בִּ/קְצֵ֣ה שָׂדֵ֑/הוּ בְּ/כֶ֨סֶף מָלֵ֜א יִתְּנֶ֥/נָּה לִ֛/י בְּ/תוֹכְ/כֶ֖ם לַ/אֲחֻזַּת קָֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/009.yaml
  text: and let him give me the cave of Machpelah[a], which belongs to him, which is at the end of his field. For the full price in silver[d][c][b], let him give it to me among you as a burial property.
translation:
  language: ja
  text: 彼が所有する、自分の畑の端にあるマクペラの洞穴を、私に譲ってくれるよう取り計らってください。満額の銀で[a]、皆さんの中で、それを墓所としての所有地にするために[b]私に譲ってもらいたいのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「満額の銀で」は直訳では「満ちた銀で」。銀によって代価の全額を支払う、すなわち値引きなしの正当な価格で支払うという取引上の表現。
    reason: 原文の取引慣用句（בְּכֶסֶף מָלֵא）を明示するため。
  - marker: b
    text: 「墓所としての所有地」は、単に埋葬に使う場所ではなく、墓所のために法的に保有される土地を指す。
    reason: אֲחֻזַּת קָבֶרにある法的所有・保有の含意を示すため。
lexical_decisions:
- source_word: וְיִתֶּן
  choice: 譲ってくれるようにしてください
  rationale: 依頼の文脈にある未完了形の意向的用法を自然な日本語で表した。売買による権利移転の文脈では「与える」より「譲る」が明瞭だが、後続の代価表現によって無償贈与ではないことを示す。
- source_word: מְעָרַת הַמַּכְפֵּלָה
  choice: マクペラの洞穴
  rationale: 固有名を音写し、連語を簡潔に表した。
- source_word: אֲשֶׁר לוֹ
  choice: 彼の所有する
  rationale: 単なる所在ではなく、交渉上重要な所有関係を明確に表す。
- source_word: אֲשֶׁר בִּקְצֵה שָׂדֵהוּ
  choice: 自分の畑の端にある
  rationale: קָצֶה の「端・果て」という空間的意味を、過度に特定せず自然に表した。
- source_word: בְּכֶסֶף מָלֵא
  choice: 十分な銀額を受け取り
  rationale: 直訳は「満額の銀で」。値引きや贈与ではなく、銀による全額の支払いを申し出ている慣用的意味を表す。
- source_word: יִתְּנֶנָּה
  choice: それを……私に譲ってください
  rationale: 原語の反復を保ちつつ、日本語では取引による移転が分かる「譲る」を用いた。
- source_word: בְּתוֹכְכֶם
  choice: 皆さんの中で
  rationale: 共同体の面前で承認される社会的・法的場面を、原文に近く表した。
- source_word: לַאֲחֻזַּת קָבֶר
  choice: 墓地として所有できるよう
  rationale: אֲחֻזָּה が示す恒久的・法的な所有地の意味を、現代日本語で明瞭にした。
