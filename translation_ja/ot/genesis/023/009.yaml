revisions:
- from: 彼が、自分の畑の端にある、彼の所有するマクペラの洞穴を私に譲ってくれるようにしてください。皆さんの中で、十分な銀額を受け取り、それを墓地として所有できるよう、私に譲ってください。[a]
  to: 彼が所有する、自分の畑の端にあるマクペラの洞穴を、私に譲ってくれるよう取り計らってください。満額の銀で[a]、皆さんの中で、それを墓所としての所有地にするために[b]私に譲ってもらいたいのです。
  rationale: 洞穴の所有者が譲渡するよう共同体に仲介を求めるという原文の依頼構造を保った。「満額の銀で」を支払い条件として自然に配置し、共同体内で承認される取引の場面を「皆さんの中で」として残した。墓所に関する語句は、用途だけでなく土地所有の性格を明確にした。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:17:18Z'
review_pass:
  verdict: revise
  source_fidelity: 冒頭の依頼、マクペラの洞穴の所有と畑の端という修飾、満額の銀、共同体の中での譲渡、墓所のための法的所有という主要要素は捉えている。しかし、「皆さんの中で、…私に譲ってください」は、原文で洞穴の所有者に向けられる反復した「彼が譲るように」という依頼から、聞き手全員への直接命令へと主語関係を変えている。また「十分な銀額を受け取り」は支払いを受ける主体を不自然に前景化する。
  naturalness: 「彼が…譲ってくれるようにしてください」と「私に譲ってください」の連結は、誰に依頼しているのかが不安定である。「墓地として所有できるよう」も、土地自体を法的に取得する目的より、話者の能力・許可の意味に寄る。依頼の枠組みを一貫させ、「墓所としての所有地」とすることで明瞭な現代標準語になる。
  terminology: 「マクペラの洞穴」は適切。「満額の銀」は取引慣用句を保つため本文では「満額の銀で」とし、注で全額の代価という意味を示す。「墓所としての所有地」はאֲחֻזַּת קָבֶרの所有・法的保有の含意を自然に表す。
