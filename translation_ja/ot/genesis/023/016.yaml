  source_fidelity: 「エフロンの言うことを受け入れ」は、שׁמע אל の文脈上あり得る含意を表すものの、「受け入れ」は明示的な承諾をやや強く言い切る。「エフロンの言葉を聞き入れ」は、相手の言葉に耳を傾け、それに従ったという原文の慣用的な含意を保つ。銀を量ったという具体的行為、公の場での発言、四百シェケルという額は適切に反映されている。
  naturalness: 文全体は自然で明瞭である。「ヘトの子らが聞いているところで」は分かりやすいが、「ヘトの子らの聞いているところで」として連体修飾を明確にすると、現代標準語としていっそう滑らかである。
  terminology: 「銀」「シェケル」「ヘトの子ら」は適切である。「商人に通用する」は意味を伝えるが、商業上の標準・受容性を含む原句の慣用的幅を保つため、「商人の間で通用する」とする。脚注aは本文の「ヘトの子ら」に対応している。脚注bは本文末尾の句に対応するよう、代替訳を句として簡潔に示す。
