base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/016.yaml
  text: 'So Abraham listened to Ephron[a], and Abraham weighed out for Ephron the silver that he had spoken in the hearing of the sons of Heth: four hundred shekels of silver[b], current with the merchant.'
translation:
  language: ja
  text: そこでアブラハムはエフロンの言葉を聞き入れ、ヘトの子ら[a]の聞いているところでエフロンが述べた銀、すなわち商人の間で通用する銀四百シェケル[b]を量って、エフロンに渡した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヘト人」とも訳せる。直訳は「ヘトの子ら」。
    reason: lexical_alternative
  - marker: b
    text: 「商人に受け入れられるもの」、または「商取引の標準重量によるもの」とも訳せる。一シェケルは当時の重量単位。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אַבְרָהָם אֶל עֶפְרוֹן
  choice: アブラハムはエフロンの言うことを受け入れ
  rationale: שׁמע אל は「耳を傾ける」「従う」の意を持つ慣用句。ここでは提示された条件を受諾する文脈なので、「言うことを受け入れ」とし、単なる聴取にも明示的な契約同意にも寄せすぎない表現とした。
- source_word: וַיִּשְׁקֹל
  choice: 量って…渡した
  rationale: 銀貨鋳造以前の銀を重量で支払う具体的行為を示すため、「支払った」だけに一般化せず「量って」を保持した。「渡した」は日本語で受取人との関係を自然に示す補足。
- source_word: הַכֶּסֶף
  choice: 銀
  rationale: 支払い手段であると同時に素材を明示する語なので、一般的な「金銭」ではなく「銀」とした。
- source_word: אֲשֶׁר דִּבֶּר
  choice: 述べた
  rationale: דבר の基本義「語る」を保ちつつ、この文脈ではエフロンが公に提示した銀の額を指すことが自然に伝わる。
- source_word: בְּאָזְנֵי
  choice: 聞いているところで
  rationale: 直訳的な「耳に」ではなく、公衆の面前で聞こえるように述べたという証人性を自然な日本語で表した。
- source_word: בְנֵי חֵת
  choice: ヘトの子ら
  rationale: 字義的・系譜的表現を本文に保持した。民族名としての理解は脚注に示す。
- source_word: אַרְבַּע מֵאוֹת שֶׁקֶל כֶּסֶף
  choice: 銀四百シェケル
  rationale: 古代の重量単位と素材を簡潔に保持した。ここでシェケルは硬貨名ではなく重量単位。
- source_word: עֹבֵר לַסֹּחֵר
  choice: 商人に通用する
  rationale: 商取引で受け入れられる銀、または商人の標準重量に従った銀を指す可能性がある。慣用句の幅を狭めすぎない訳を本文に置き、別解を脚注に示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、取引の公的性格と銀を重量で支払った歴史的具体性を保つ、簡潔で dignified な叙述とした。固有表現「ヘトの子ら」は本文で保持し、理解を助ける民族名を脚注に置いた。
