  text: וַ/יָּ֨קָם֙ אַבְרָהָ֔ם מֵ/עַ֖ל פְּנֵ֣י מֵת֑/וֹ וַ/יְדַבֵּ֥ר אֶל בְּנֵי חֵ֖ת לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/003.yaml
  text: Then Abraham rose from before his dead wife and spoke to the sons of Heth[a], saying,
translation:
  language: ja
  text: それからアブラハムは、亡くなった妻のそばから立ち上がり、ヘトの子ら[a]に語りかけて言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヒッタイト人」。ヘブライ語では「ヘトの息子たち」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: それから…立ち上がり
  rationale: 物語を進めるワイイקטール形の連続性を「それから」で自然に示し、קוםの動作を「立ち上がる」と訳した。
- source_word: מֵעַל פְּנֵי
  choice: …のそばから
  rationale: 直訳的には「…の面前から」だが、ここでは遺体の傍らを離れる場面なので、現代日本語として自然な「そばから」とした。
- source_word: מֵתוֹ
  choice: 亡くなった妻
  rationale: ヘブライ語は字義的には「彼の死者」だが、文脈上はサラを指す。日本語では「彼の死者」が不自然なため、指示対象を明らかにしつつ、穏当で尊厳ある表現を用いた。
- source_word: וַיְדַבֵּר אֶל
  choice: …に語りかけて
  rationale: דבר אל の方向性と、後続する発言内容への導入を保つため「語りかけて」とした。
- source_word: בְּנֵי חֵת
  choice: ヘトの子孫
  rationale: 字義は「ヘトの息子たち」だが、集団・民族的な子孫を表す慣用句であるため「子孫」とした。慣用的な「ヒッタイト人」は脚注に示した。
- source_word: לֵאמֹר
  choice: 言った
  rationale: 次節の直接話法を導入する不定詞。日本語では「語りかけて言った」として原文の二重の発話表現を比較的自然に保った。
theological_decisions: []
