source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל עֶפְר֜וֹן בְּ/אָזְנֵ֤י עַם הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר אַ֛ךְ אִם אַתָּ֥ה ל֖וּ שְׁמָעֵ֑/נִי נָתַ֜תִּי כֶּ֤סֶף הַ/שָּׂדֶה֙ קַ֣ח מִמֶּ֔/נִּי וְ/אֶקְבְּרָ֥ה אֶת מֵתִ֖/י שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/013.yaml
  text: 'And he spoke to Ephron in the hearing of the people of the land[a], saying, “If only you would hear me: I give the silver for the field; take it from me[b], so that I may bury my dead there.”'
translation:
  language: ja
  text: そして彼は、その地の民が聞いているところでエフロンに言った。「どうか、私の言うことを聞いてください。畑の代金として銀をお渡しします[a]。私からそれを受け取ってください。そうすれば、私は自分の死者をそこに葬ることができます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「お渡しします」は、ヘブライ語では直訳すると「私は銀を与えた」です。ここでは交渉における正式な申し出を表す完了形と考えられますが、「私は与えます」あるいは「私は支払います」と訳すこともできます。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: 言った
  rationale: דבר の発話を、現代日本語の物語として自然に表現した。後続の לֵאמֹר と重ねて「語って言った」とはしない。
- source_word: בְּאָזְנֵי עַם הָאָרֶץ
  choice: その土地の民が聞いているところで
  rationale: 直訳的な「その土地の民の耳に」を避けつつ、公の場で聞こえるように交渉したという法的・社会的状況を保つ。
- source_word: אַךְ אִם אַתָּה לוּ שְׁמָעֵנִי
  choice: どうか、私の言うことを聞いてください
  rationale: 省略を含む慣用的な懇願表現を、丁寧で自然な日本語にした。אַךְ、אִם、לוּ の重なりが表す切実な願いを「どうか」で伝える。
- source_word: נָתַתִּי
  choice: お渡しします
  rationale: 形は完了形だが、交渉中の正式な申し出を遂行する用法と判断し、現在の申し出として自然な日本語にした。形態上の幅は脚注に示す。
- source_word: כֶּסֶף הַשָּׂדֶה
  choice: 畑の代金の銀
  rationale: כֶּסֶף の具体的な「銀」を残しながら、属格関係が価格を表すことを「代金」で明確にした。
- source_word: קַח מִמֶּנִּי
  choice: それを私から受け取ってください
  rationale: 文脈上の目的語である銀を「それ」で補い、取引における קח の意味を自然な「受け取る」で表した。
- source_word: וְאֶקְבְּרָה
  choice: そうすれば、私は…葬ることができます
  rationale: コホータティブが示す意図・帰結を、代金を受領してもらうことに続く目的として自然に表した。
- source_word: מֵתִי
  choice: 死んだ者
  rationale: 文脈上はサラだが、原文は固有の指示を明示せず「私の死者」と言うため、その一般性と厳粛さを保った。
- source_word: שָׁמָּה
  choice: そこに
  rationale: 場所を指す副詞を簡潔に訳した。
theological_decisions: []
translation_notes:
