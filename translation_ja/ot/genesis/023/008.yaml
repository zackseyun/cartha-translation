    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר אִתָּם לֵאמֹר
  choice: 彼は彼らに語った
  rationale: דבר עם の「彼らと語る」という構文を踏まえつつ、続く直接話法を現代日本語で自然に導入した。לֵאמֹר は日本語では独立して訳さず、引用によって機能を表した。
- source_word: אִם יֵשׁ אֶת־נַפְשְׁכֶם
  choice: もし……あなたがたが望んでくださるのなら
  rationale: נפש を含む慣用句は、ここでは内心の願望・意向を表す。字義的な「あなたがたの魂にあるなら」ではなく、丁重な交渉の調子も伝わる表現とした。
- source_word: לִקְבֹּר אֶת־מֵתִי מִלְּפָנַי
  choice: 私が亡き者を目の前から葬ることを
  rationale: מֵתִי は単数の「私の死者」であり、文脈上サラを指すが、原文にない「妻」を本文へ補わず「亡き者」とした。מִלְּפָנַי は埋葬によって遺体を自分の前から移す意味を保った。
- source_word: שְׁמָעוּנִי
  choice: 私の願いを聞き入れ
  rationale: 単なる聴覚行為ではなく、続く依頼に応じるよう求める命令なので、「願いを聞き入れ」と自然に表した。
- source_word: וּפִגְעוּ לִי בְּעֶפְרוֹן
  choice: 私のために……エフロンに取り次いでください
  rationale: פגע ב は「会う、働きかける、懇願する」などの幅を持つ。この土地交渉では、アブラハムに代わってエフロンへ申し入れるよう求める意味と判断し、「取り次ぐ」とした。
- source_word: עֶפְרוֹן בֶּן־צֹחַר
  choice: ツォハルの子エフロン
  rationale: ヘブライ語の系譜表現を日本語聖書として明瞭な語順で示し、固有名は原語に即して音写した。
