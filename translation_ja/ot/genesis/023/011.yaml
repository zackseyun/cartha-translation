revisions:
- from: 「いいえ[a]、旦那様。どうか、私の言うことをお聞きください。この畑をあなたに差し上げます。その中にある洞穴も、あなたに差し上げます[b]。私の同胞たちの見ている前で、これをあなたに差し上げます[c]。あなたの亡くなった方を葬ってください。」
  to: 「いいえ[a]、ご主人。私の言うことを聞いてください。その畑をあなたに差し上げます。その中にある洞窟も、あなたに差し上げます[b]。私の民の者たちの前で、これをあなたに差し上げます[c]。あなたの亡き人を葬ってください。」
  rationale: 敬称を現代日本語でより中立的な「ご主人」に改め、「旦那様」に伴う日本固有の配偶者・商店主等の連想を避けた。公的な共同体の立会いを表す句を原文により近く自然な表現へ整え、死者への余分な敬称を除いた。譲渡の反復、洞窟の位置関係、公開性、単数の被埋葬者はいずれも保持している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:17:18Z'
review_pass:
  verdict: revise
  source_fidelity: 全体として譲渡の遂行的宣言、洞窟が畑の中にあること、公的な立会い、埋葬の命令をよく伝えている。ただし「旦那様」は現代日本語では配偶者・商店主・雇用主などを強く連想させ、אֲדֹנִי の敬意ある呼びかけとして不適切である。「私の同胞たち」は原文の『私の民の子ら』が示す共同体の公的な構成員・証人という範囲をやや狭めうる。
  naturalness: 「ご主人」は文脈上の丁重な呼びかけとして「旦那様」より中立的である。「私の民の者たちの前で」は、逐語的すぎず、公の立会いという意味を自然に表す。「あなたの亡き人」は、単数の『あなたの死者』を不必要にサラと特定せず、現代標準語としても自然である。
  terminology: 「洞窟」は埋葬用の cave を明瞭に表す。「差し上げます」は話者から相手への敬意を表し、この交渉におけるアブラハムへの敬称と整合する。
