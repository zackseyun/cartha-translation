  register: 現代の標準的な日本語を用い、古風な「わが主よ」「聞きたまえ」は避けた。一方、交渉場面の敬意と厳粛な譲渡宣言を保つため、「旦那様」「差し上げます」「お聞きください」と丁重に整えた。
