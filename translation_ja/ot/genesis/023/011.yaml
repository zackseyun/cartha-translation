  - severity: low
    issue: 「私の同胞たちの見ている前で」
    rationale: 「同胞たち」は共同体の構成員を兄弟的・民族的な仲間へ狭める響きがあり、「見ている」は単なる目撃の進行を強調する。原文の公の立会いを「私の民の者たちの前で」とするほうが適切である。
  - severity: low
    issue: 「あなたの亡くなった方」
    rationale: 「方」は日本語の敬称を加える。原文は単に単数の『あなたの死者』であり、「亡き人」は哀悼の文脈を保ちつつ余分な敬称を避ける。
