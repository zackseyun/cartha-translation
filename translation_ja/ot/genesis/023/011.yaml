  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לֹֽא אֲדֹנִ֣/י שְׁמָעֵ֔/נִי הַ/שָּׂדֶה֙ נָתַ֣תִּי לָ֔/ךְ וְ/הַ/מְּעָרָ֥ה אֲשֶׁר בּ֖/וֹ לְ/ךָ֣ נְתַתִּ֑י/הָ לְ/עֵינֵ֧י בְנֵי עַמִּ֛/י נְתַתִּ֥י/הָ לָּ֖/ךְ קְבֹ֥ר מֵתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/011.yaml
  text: 'No[a], my lord, listen to me: I give you the field, and I give you the cave that is in it[b]. In the sight of the sons of my people I give it to you[c]. Bury your dead.'
translation:
  language: ja
  text: 「いいえ[a]、ご主人。私の言うことを聞いてください。その畑をあなたに差し上げます。その中にある洞窟も、あなたに差し上げます[b]。私の民の者たちの前で、これをあなたに差し上げます[c]。あなたの亡き人を葬ってください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そうではありません」。ここでは、アブラハムの申し出を丁重に退ける言葉。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「その中にある洞窟は、あなたに差し上げます」と、洞窟が先に置かれて強調されている。
    reason: source_structure
  - marker: c
    text: 直訳は「私の民の息子たちの目の前で」。共同体の人々が立ち会う公の場で、という意味。
    reason: cultural_note
lexical_decisions:
- source_word: לֹא
  choice: いいえ
  rationale: アブラハムの申し出を丁重に退け、別の提案を示す語用論的な否定として、現代日本語で自然な「いいえ」とした。単なる事実否定には限定しない。
- source_word: אֲדֹנִי
  choice: 旦那様
  rationale: 土地取引の相手に対する敬意ある呼びかけであり、神への称号と誤解されにくく、社会的な丁重さも表せる語を選んだ。
- source_word: שְׁמָעֵנִי
  choice: どうか、私の言うことをお聞きください
  rationale: 命令形の訴えかけを保ちながら、交渉場面にふさわしい丁重で自然な日本語にした。
- source_word: הַשָּׂדֶה
  choice: この畑
  rationale: 文脈上すでに話題となっている特定の土地を指すため「この」を用い、שׂדה の基本的意味を「畑」で表した。
- source_word: נָתַתִּי לָךְ
  choice: あなたに差し上げます
  rationale: 完了形はここでは譲渡を今ここで宣言する遂行的用法と理解し、現在の申し出として訳した。「差し上げます」は相手への敬意も反映する。
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ לְךָ נְתַתִּיהָ
  choice: その中にある洞穴も、あなたに差し上げます
  rationale: 洞穴が畑の中にあるという位置関係と、洞穴も譲渡対象であることを明示した。ヘブライ語の目的語前置による焦点は助詞「も」で自然に表した。
- source_word: לְעֵינֵי בְנֵי עַמִּי
  choice: 私の同胞たちの見ている前で
  rationale: 直訳的な「私の民の息子たち」ではなく、共同体の構成員が公に見届けるという慣用的意味を、自然な日本語で表した。
- source_word: נְתַתִּיהָ לָּךְ
  choice: これをあなたに差し上げます
  rationale: 女性単数接尾辞の指示対象を、日本語では文脈を受ける「これ」で保ち、公開の場における譲渡宣言として訳した。
- source_word: קְבֹר מֵתֶךָ
  choice: あなたの亡くなった方を葬ってください
  rationale: 命令の力を保ちつつ丁重な日本語とした。単数形は文脈上サラを指すが、本文で固有名を補わず、原文の表現範囲を保った。
