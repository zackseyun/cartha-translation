base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/007.yaml
  text: Then Abraham rose and bowed down to the people of the land[a], to the sons of Heth.
translation:
  language: ja
  text: そこでアブラハムは立ち上がり、その地の民、すなわちヘトの子ら[a]に向かって身をかがめた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヘト人」。ヘブライ語では「ヘトの子ら」。
    reason: 「ヘトの子ら」という系譜的な原文表現に対し、民族名としての自然な訳も示すため。
lexical_decisions:
- source_word: וַיָּקָם
  choice: そこでアブラハムは立ち上がり
  rationale: קוםの連続形は物語の進行に伴って立ち上がることを表す。「そこで」で前後の順次性を自然に示した。
- source_word: וַיִּשְׁתַּחוּ
  choice: 身をかがめた
  rationale: שׁחהの再帰的語形は敬意を示して低く身をかがめる動作を表す。文脈から必ずしも完全な平伏と断定せず、自然な日本語で身体的な敬礼を保った。
- source_word: לְעַם הָאָרֶץ
  choice: その地の民に向かって
  rationale: לְは礼をする相手を示す。עַם הָאָרֶץはここではその土地の住民を指すため、字義を保ちつつ「その地の民」とした。
- source_word: לִבְנֵי חֵת
  choice: すなわちヘトの子ら
  rationale: 直訳は「ヘトの子ら」。直前の「その地の民」を具体的に言い換える同格表現として「すなわち」を補い、系譜的な呼称を本文に残した。
- source_word: חֵת
  choice: ヘト
  rationale: 固有名詞として日本語聖書で通用する音写を用いた。
