  text: And Ephron answered Abraham, saying to him,
translation:
  language: ja
  text: エフロンはアブラハムに答えて言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: 答えて
  rationale: 対話叙述で、先の発言に対する応答を導く動詞。日本語でも「答えて」が応答の連続を簡潔に表す。
- source_word: עֶפְרוֹן
  choice: エフロン
  rationale: ヘブライ語の人名を、日本語聖書で一般的な形に音写した。
- source_word: אֶת אַבְרָהָם
  choice: アブラハムに
  rationale: אֶת は通常は直接目的語標識だが、ענה の発話用法では応答の相手を示す。自然な日本語では助詞「に」で表す。
- source_word: לֵאמֹר
  choice: 言った
  rationale: 発言内容を導入する不定詞。直訳的な「言って言った」を避けつつ、ヘブライ語の発話導入を保つため「答えて言った」とした。
- source_word: לוֹ
  choice: （「アブラハムに」に含めた）
  rationale: 三人称男性単数代名詞はアブラハムを指す。日本語で「アブラハムに、彼に」と重ねるのは不自然なため、応答相手を示す「アブラハムに」に統合した。
