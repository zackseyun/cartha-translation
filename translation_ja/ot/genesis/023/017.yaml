revisions:
- from: こうして、マムレに面するマクペラにあるエフロンの畑、すなわち、その畑と畑の中の洞穴、また、その周囲の境界内にある畑のすべての木は、正式に確定した[a]。
  to: こうして、マムレに面するマクペラにあるエフロンの畑、すなわち、その畑とその中にある洞窟、また畑の全周の境界内にあるすべての木は、法的に確定した[a]。
  rationale: 原文の法的な物件列挙と、קוםが売買文脈で帯びる法的確定の含意を保持した。「洞窟」は現代標準語として自然な語に整え、木を含む範囲を示す境界句の修飾関係を明瞭にした。
