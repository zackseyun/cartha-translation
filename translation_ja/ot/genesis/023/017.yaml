  text: וַ/יָּ֣קָם שְׂדֵ֣ה עֶפְר֗וֹן אֲשֶׁר֙ בַּ/מַּכְפֵּלָ֔ה אֲשֶׁ֖ר לִ/פְנֵ֣י מַמְרֵ֑א הַ/שָּׂדֶה֙ וְ/הַ/מְּעָרָ֣ה אֲשֶׁר בּ֔/וֹ וְ/כָל הָ/עֵץ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה אֲשֶׁ֥ר בְּ/כָל גְּבֻל֖/וֹ סָבִֽיב׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/017.yaml
  text: So Ephron’s field at Machpelah[a], which was before Mamre—the field, the cave that was in it, and every tree in the field, within all its surrounding border—was confirmed
translation:
  language: ja
  text: こうして、マムレに面するマクペラにあるエフロンの畑、すなわち、その畑とその中にある洞窟、また畑の全周の境界内にあるすべての木は、法的に確定した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「成立した」、あるいは「譲渡された」とも訳せる。ここで用いられているヘブライ語動詞は、この売買の文脈では、土地とその付属物が法的に確定したことを表すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 正式に確定した
  rationale: קוםの基本的な意味は「立つ」だが、この売買の法的文脈では土地と付属物が正式に確定・成立したことを表す慣用的用法と判断した。「譲渡された」と対象を明示しすぎず、法的含意を自然な日本語で示す。
- source_word: שְׂדֵה עֶפְרוֹן
  choice: エフロンの畑
  rationale: ヘブライ語の連語形を、自然な所有表現として訳した。
- source_word: בַּמַּכְפֵּלָה
  choice: マクペラにある
  rationale: マクペラを地名として音写し、畑の所在地を明確に示した。
- source_word: לִפְנֵי מַמְרֵא
  choice: マムレに面する
  rationale: לִפְנֵיの空間的意味「前に、面して」を保ち、方角を特定する「東」を補わなかった。
- source_word: הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: その畑と畑の中の洞穴
  rationale: 法的な物件列挙の調子を保ち、畑とその内部の洞穴をそれぞれ明示した。
- source_word: וְכָל הָעֵץ אֲשֶׁר בַּשָּׂדֶה
  choice: 畑のすべての木
  rationale: 単数集合名詞 הָעֵץ と כָל の組み合わせを、日本語で自然な総称表現にした。
- source_word: אֲשֶׁר בְּכָל גְּבֻלוֹ סָבִיב
  choice: その周囲の境界内にある
  rationale: 土地を取り巻く境界の内側に含まれるものすべて、という包括的な法的範囲を表した。
