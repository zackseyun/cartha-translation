base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/020.yaml
  text: So the field and the cave that was in it were deeded to Abraham as a burial property from the sons of Heth[a][b][c].
translation:
  language: ja
  text: こうして、その畑とその中にある洞窟は、ヘトの子ら[a]からアブラハムへ、埋葬のための所有地[b]として正式に譲渡された[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヘト人たち」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「墓の所有地として」。
    reason: lexical_alternative
  - marker: c
    text: 「アブラハムに、埋葬のための所有地として確定した」とも訳せる。ヘブライ語の動詞は、この文脈では所有権が法的に確定・移転したことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 正式に譲渡された
  rationale: この売買契約の文脈では、土地がアブラハムの法的所有として確定したことを表す。単なる「立った」ではなく、法的移転の意味を自然な現代日本語で示した。
- source_word: הַשָּׂדֶה
  choice: その畑
  rationale: 購入対象となった土地を指す定冠詞付きの語として訳した。
- source_word: וְהַמְּעָרָה אֲשֶׁר בּוֹ
  choice: その中にある洞窟
  rationale: 関係節と、畑を受ける代名詞接尾辞の意味を保ちつつ、自然な日本語にした。
- source_word: לְאַבְרָהָם
  choice: アブラハムに
  rationale: 法的移転の受領者・新たな所有者を示す。
- source_word: לַאֲחֻזַּת קָבֶר
  choice: 墓地として所有する土地として
  rationale: אֲחֻזָּהの所有地・保有地という法的含意と、קֶבֶרの埋葬用途の双方を明示した。
- source_word: מֵאֵת
  choice: から
  rationale: 取引における移転元を示す自然な日本語。
- source_word: בְּנֵי חֵת
  choice: ヘトの子ら
  rationale: ヘブライ語の系譜的・民族的表現を形式的に保った。「ヒッタイト人」という文脈的訳も可能。
