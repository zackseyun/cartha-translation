  text: אֲדֹנִ֣/י שְׁמָעֵ֔/נִי אֶרֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל כֶּ֛סֶף בֵּינִ֥/י וּ/בֵֽינְ/ךָ֖ מַה הִ֑וא וְ/אֶת מֵתְ/ךָ֖ קְבֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/015.yaml
  text: 'My lord[a], listen to me: a piece of land worth four hundred shekels of silver—what is that between me and you? Bury your dead.'
translation:
  language: ja
  text: 「ご主人[a]、どうか私の言うことをお聞きください。銀四百シェケル相当の土地など、私とあなたの間で何ほどのものでしょう。あなたの亡き人を葬ってください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「わが主よ」。神への呼びかけではなく、交渉相手に対する敬意ある呼びかけ。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: どうか
  rationale: 直訳的な敬称「わが主よ」は現代日本語では不自然で、神への呼びかけとも誤解されうる。ここではエフロンがアブラハムに示す丁重さを、後続の依頼表現と合わせて自然に表した。
- source_word: שְׁמָעֵנִי
  choice: 私の言うことをお聞きください
  rationale: 命令形による丁重な訴え。「私に聞け」より自然で、発言に耳を傾けるよう求める意味を明確にした。
- source_word: אֶרֶץ
  choice: 土地
  rationale: 交渉対象となっている具体的な土地を指す。文脈上明らかなため、「一区画の土地」などを補わず簡潔にした。
- source_word: אַרְבַּע מֵאֹת שֶׁקֶל כֶּסֶף
  choice: 銀四百シェケルの土地
  rationale: ヘブライ語の省略的な価格提示を保ちつつ、日本語で土地の価格を表す句として読める形にした。「価値のある」と説明的に補いすぎない。
- source_word: בֵּינִי וּבֵינְךָ מַה הִוא
  choice: 私とあなたの間では何ほどのことでしょう
  rationale: 両者にとってその金額は問題にするほどではない、と修辞的に小さく扱う交渉表現を自然な日本語で再現した。
- source_word: וְאֶת מֵתְךָ קְבֹר
  choice: さあ、亡くなった方を葬ってください
  rationale: וְ の談話上の推進力を「さあ」で表し、命令を丁重な依頼として訳した。מֵתְךָ は文脈上サラ一人を指すため、尊厳ある日本語の「亡くなった方」とした。
theological_decisions: []
translation_notes:
  register: 現代標準日本語による、丁重でありながら交渉の直接性を失わない文体。社会的敬意は古風な「わが主よ」ではなく敬語全体で示し、神への称号との混同を避けた。価格を軽く扱う修辞的含みを「何ほどのことでしょう」で保持した。
