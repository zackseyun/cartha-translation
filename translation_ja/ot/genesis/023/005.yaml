  text: ヘトの子らはアブラハムに答え、彼にこう言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 答えて
  rationale: ענהのカル・ワイイクトルで、後続する発言への応答を表す。日本語では「答えて」が対話の流れに自然である。
- source_word: בְנֵי חֵת
  choice: ヘトの子ら
  rationale: 字義どおりの「ヘトの子ら」とし、系譜的な集団呼称と固有名ヘトを保持する。文脈上は「ヒッタイト人」とも訳せるため脚注に示す。
- source_word: אֶת אַבְרָהָם
  choice: アブラハムに
  rationale: אֶתは定目的語を示すが、日本語では応答の相手を「アブラハムに」と表すのが自然である。
- source_word: לֵאמֹר
  choice: 言った
  rationale: אמרの不定詞連語形で直接話法を導入する。直訳的な「言って」より、文末で次節の発言につなぐ日本語として「言った」が明瞭である。
- source_word: לוֹ
  choice: 彼に
  rationale: 前置詞לと三人称男性単数接尾辞を明示し、後続の発言がアブラハムに向けられたことを保持する。
