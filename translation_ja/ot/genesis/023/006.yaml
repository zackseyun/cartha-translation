  to: 「どうかお聞きください、わが主よ。あなたは私たちの間で神の君[a]です。私たちの最良の墓所に、あなたの死者を葬ってください。私たちの中で、自分の墓所をあなたに使わせず、あなたの死者を葬ることを妨げる者は一人もいません。」
