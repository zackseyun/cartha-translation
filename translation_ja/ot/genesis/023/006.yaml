source:
  edition: WLC
  text: שְׁמָעֵ֣/נוּ אֲדֹנִ֗/י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּ/תוֹכֵ֔/נוּ בְּ/מִבְחַ֣ר קְבָרֵ֔י/נוּ קְבֹ֖ר אֶת מֵתֶ֑/ךָ אִ֣ישׁ מִמֶּ֔/נּוּ אֶת קִבְר֛/וֹ לֹֽא יִכְלֶ֥ה מִמְּ/ךָ֖ מִ/קְּבֹ֥ר מֵתֶֽ/ךָ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/006.yaml
  text: 'Hear us[a], my lord: you are a prince of God among us. Bury your dead in the choicest of our tombs. None of us will withhold his tomb from you[b], from burying your dead.'
translation:
  language: ja
  text: 「どうかお聞きください、わが主よ。あなたは私たちの間で神の君[a]です。私たちの最良の墓所に、あなたの死者を葬ってください。私たちの中で、自分の墓所をあなたに使わせず、あなたの死者を葬ることを妨げる者は一人もいません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「神の君」。このヘブライ語表現は、「きわめて偉大な君」という最上級の意味を表すこともあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָעֵנוּ
  choice: どうかお聞きください
  rationale: 命令形と一人称複数接尾辞を保ちつつ、敬意を込めた直接の訴えとして自然な現代日本語にした。
- source_word: אֲדֹנִי
  choice: わが主よ
  rationale: アブラハムに対する高い敬意を示す呼びかけ。単なる「あなた」や「旦那様」よりも原文の社会的な丁重さを保つ。
- source_word: נְשִׂיא אֱלֹהִים
  choice: 神の君
  rationale: 直訳的な構造を本文に残し、神との関係を表す可能性と、最上級的に「きわめて偉大な君」を表す可能性を脚注で示した。
- source_word: בְּתוֹכֵנוּ
  choice: 私たちの間で
  rationale: 共同体の中にいることを、明瞭で自然な日本語で表した。
- source_word: בְּמִבְחַר קְבָרֵינוּ
  choice: 私たちの墓の中から最良のものを選び
  rationale: מִבְחַר の「選り抜きのもの、最良のもの」という意味を、埋葬場所を自由に選べるという文脈に即して自然に表した。
- source_word: קְבֹר אֶת־מֵתֶךָ
  choice: 亡くなられた方を葬ってください
  rationale: 直訳的な「あなたの死者」は日本語では不自然なため、所有関係を文脈に委ね、故人への敬意を伴う表現とした。
- source_word: אִישׁ מִמֶּנּוּ
  choice: 私たちのうち…者は、一人もおりません
  rationale: 否定文の中の分配的表現を、日本語で意味が明確になるようにした。
- source_word: אֶת־קִבְרוֹ לֹא יִכְלֶה מִמְּךָ
  choice: 自分の墓をあなたに差し出さず
  rationale: כלה のこの文脈での意味を「拒む、差し控える」と捉え、墓の使用を拒絶しないという申し出を自然に表した。
- source_word: מִקְּבֹר מֵתֶךָ
  choice: 亡くなられた方を葬らせない
  rationale: 前置詞 מִן と不定詞が示す阻止・妨害の意味を明示し、直前の否定と合わせて『誰も埋葬を妨げない』という意味を伝えた。
theological_decisions:
- issue: נְשִׂיא אֱלֹהִים における אֱלֹהִים の働き
  choice: 本文では「神の君」として関係を限定しない
  alternative: 「きわめて偉大な君」または「神に選ばれた君」
  rationale: この表現は神との特別な関係を示すとも、神名を用いた最上級的表現とも理解できる。本文で一方に決めず、脚注で主要な別解を示した。
translation_notes:
  register: ヘト人たちがアブラハムに示す丁重さを保つため、全体を敬意ある会話調とした。「神の君」は日常語としてはやや格調の高い表現だが、原文の曖昧さを保つため本文に残し、脚注で慣用的な理解を補った。
