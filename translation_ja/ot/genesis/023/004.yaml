source:
  edition: WLC
  text: גֵּר וְ/תוֹשָׁ֥ב אָנֹכִ֖י עִמָּ/כֶ֑ם תְּנ֨וּ לִ֤/י אֲחֻזַּת קֶ֨בֶר֙ עִמָּ/כֶ֔ם וְ/אֶקְבְּרָ֥ה מֵתִ֖/י מִ/לְּ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/004.yaml
  text: I am a foreigner and a sojourner among you[a]. Give me a burial site among you[b], so that I may bury my dead out of my sight.
translation:
  language: ja
  text: 「私はあなたがたの間では、よそ者であり寄留者です[a]。あなたがたの間に、埋葬のための所有地を私に与えてください[b]。そうすれば、私の死んだ者を目の前から取り去って葬ることができます[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「よそ者」は本来の土地や親族集団の外で暮らす者、「寄留者」はその地に居住しながら、生来の住民と同じ土地上の地位を持たない者を指します。
    reason: lexical_clarification
  - marker: b
    text: 直訳に近くは「墓の所有地」。単に墓を掘る場所ではなく、埋葬のために保有する土地という意味を含みます。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「私の前から」。
    reason: literal_rendering
lexical_decisions:
- source_word: גֵּר וְתוֹשָׁב
  choice: よそ者であり寄留者
  rationale: גֵּרは本来の親族・土地を離れて暮らす者、תּוֹשָׁבはその地に居住しながらも十分な土地所有権や生来の地位を持たない者を表す。二語を残しつつ、現代日本語で理解しやすい組み合わせとした。
- source_word: עִמָּכֶם
  choice: あなたがたの間に／あなたがたのところに
  rationale: 直訳は「あなたがたと共に」だが、ここでは共同体の中での居住と、その領域内にある土地を指す。二つの出現箇所に応じて自然な日本語にした。
- source_word: תְּנוּ לִי
  choice: 私に与えてください
  rationale: נתןの命令形を率直に訳した。後続の交渉を先取りして「売ってください」とはしない。
- source_word: אֲחֻזַּת קֶבֶר
  choice: 墓地として所有できる土地
  rationale: אֲחֻזָּהには単なる埋葬場所ではなく、保有地・所有地という法的含意がある。章全体で重要となる土地所有の意味を明示しながら、自然な日本語とした。
- source_word: וְאֶקְבְּרָה
  choice: そうすれば……葬ることができます
  rationale: 依頼に続くコホルタティブの目的・結果のニュアンスを日本語で自然に表した。
- source_word: מֵתִי
  choice: 死んだ者
  rationale: 原文は一人称接尾辞を伴う単数形で、亡くなった身内を指す。「サラ」と明示せず、原文の簡潔な言い方を保った。
- source_word: מִלְּפָנַי
  choice: 目の前から
  rationale: 字義どおりの空間的表現を保った。文脈上は遺体を自分の前から移して埋葬することを意味する。
theological_decisions:
- issue: アブラハムの居住上・法的な立場
  choice: 「よそ者」と「寄留者」の二語をともに残す
  alternative: 「外国人」など一語にまとめる
  rationale: 原文が並べる二つの身分語の重なりと緊張を保持し、土地を持たず共同体の中に住む立場を過度に単純化しないため。
- issue: 埋葬地の取得方法
  choice: 「与えてください」と訳す
  alternative: 「売ってください」
  rationale: 物語の続きでは購入交渉になるが、この節の動詞自体は「与える」であり、取得方法を先取りして限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、アブラハムの丁寧かつ切実な申し出にふさわしい品位を保った。「よそ者」は理解しやすさを、「寄留者」は社会的・法的含意を担わせた。
