  yaml_path: translation/ot/genesis/023/002.yaml
  text: And Sarah died in Kiriath-arba (that is[a], Hebron) in the land of Canaan[b], and Abraham came to mourn for Sarah and to weep for her.
translation:
  language: ja
  text: サラはカナンの地のキルヤト・アルバ、すなわちヘブロンで死んだ。アブラハムはサラを悼み、彼女のために泣くためにやって来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּמָת
  choice: 死んだ
  rationale: מותの率直な意味を保ち、婉曲化せず自然な現代日本語で表した。
- source_word: בְּקִרְיַת אַרְבַּע
  choice: キルヤト・アルバで
  rationale: 地名として音写し、בְの場所を示す働きを「で」で表した。
- source_word: הִוא חֶבְרוֹן
  choice: すなわちヘブロン
  rationale: 二つの地名を同定するヘブライ語の説明的な同格を、簡潔で明瞭な日本語にした。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地にある
  rationale: 明示されたאֶרֶץを「地」として保持し、日本語では地名句を自然に修飾する形に整えた。
- source_word: וַיָּבֹא
  choice: やって来た
  rationale: בואの基本的な移動表現を保った。「来た」の視点は原文だけでは完全には確定しないが、物語上の到着を自然に示す。
- source_word: לִסְפֹּד לְשָׂרָה
  choice: サラのために嘆き
  rationale: ספדは死者への哀悼・嘆きを表す。「嘆く」は儀礼的な哀悼にも個人的悲嘆にも限定しすぎない。
- source_word: וְלִבְכֹּתָהּ
  choice: 泣くために
  rationale: בכהを自然な現代日本語の「泣く」とし、接尾代名詞の指示対象サラは直前ですでに明示されているため不自然な重複を避けた。
theological_decisions: []
