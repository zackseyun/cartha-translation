source:
  edition: WLC
  text: וַ/יִּשְׁתַּ֨חוּ֙ אַבְרָהָ֔ם לִ/פְנֵ֖י עַ֥ם הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/012.yaml
  text: Then Abraham bowed down before the people of the land[a].
translation:
  language: ja
  text: そこでアブラハムは、その土地の人々の前で身をかがめた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その土地の人々の前にひれ伏した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁתַּחוּ
  choice: 身をかがめた
  rationale: この語形は、敬意や恭順を示して身を低くする動作を表す。この場面は土地の売買交渉であり、神への礼拝を意味する語ではなく、相手への敬意を示す身体動作として自然に訳した。
- source_word: לִפְנֵי
  choice: 前で
  rationale: 「〜の前で」「〜の面前で」を意味する慣用表現。現代日本語として簡潔で自然な「前で」とした。
- source_word: עַם
  choice: 人々
  rationale: 取引に立ち会う地域住民を一つの社会的集団として指すため、「人々」とした。
- source_word: הָאָרֶץ
  choice: その土地
  rationale: עַם הָאָרֶץ という句で地域の住民を表す。文脈上すでに話題となっている土地なので、自然な日本語として「その土地」とした。
- source_word: וַ
  choice: そこで
  rationale: 物語を次の動作へ進める接続辞。直前のやり取りを受けた行為であることが伝わる「そこで」とした。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 日本語聖書で定着している固有名の表記を用いた。
theological_decisions:
- issue: וַיִּשְׁתַּחוּ が礼拝を意味する可能性
  choice: 社会的な敬意を表す動作として「身をかがめた」と訳す
  alternative: 「ひれ伏した」「礼拝した」
  rationale: 相手は土地の人々であり、文脈は墓地取得の交渉である。「礼拝した」では神的礼拝を連想させて誤解を招く。「ひれ伏した」も可能だが、姿勢の程度を原文以上に限定するおそれがあるため脚注に残した。
translation_notes:
  register: 明瞭で品位のある現代標準日本語。「身をかがめた」によって敬意を示す身体動作を自然に表し、神への礼拝という含意を避けた。
