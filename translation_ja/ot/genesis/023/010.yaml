  text: וְ/עֶפְר֥וֹן יֹשֵׁ֖ב בְּ/ת֣וֹךְ בְּנֵי חֵ֑ת וַ/יַּעַן֩ עֶפְר֨וֹן הַ/חִתִּ֤י אֶת אַבְרָהָם֙ בְּ/אָזְנֵ֣י בְנֵי חֵ֔ת לְ/כֹ֛ל בָּאֵ֥י שַֽׁעַר עִיר֖/וֹ לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/010.yaml
  text: Ephron was sitting among the sons of Heth[a], and Ephron the Hittite answered Abraham in the hearing of the sons of Heth, before all who entered the gate of his city, saying[b],
translation:
  language: ja
  text: エフロンはヘトの子ら[a]の間に座っていた。ヘト人エフロンは、ヘトの子らが聞いているところで、彼の町の門[b]に入って来るすべての人の前で、アブラハムにこう答えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヘト人たち」とも訳せる。この節の二つの「ヘトの子ら」は、ヘブライ語では字義どおりにはこの表現である。
    reason: lexical_alternative
  - marker: b
    text: 「町の門」は、証人たちの前で法律上の事柄や商取引が扱われた公の場所を指す。
    reason: cultural_note
lexical_decisions:
- source_word: יֹשֵׁב
  choice: 座っていた
  rationale: 分詞が場面中の継続した姿勢・状態を表すため、単純な過去よりも「座っていた」とした。「住んでいた」と取る可能性も語義上はあるが、ここでは公の集まりの場面にいる状態が自然である。
- source_word: בְּתוֹךְ
  choice: の間に
  rationale: 集まっている人々の中にいるという社会的・空間的な関係を、自然な現代日本語で表した。
- source_word: בְּנֵי חֵת
  choice: ヘトの子ら
  rationale: ヘブライ語の字義的な氏族表現を保ち、同節の民族名「ヒッタイト人」と区別した。読者には脚注で自然な代替表現を示す。
- source_word: וַיַּעַן
  choice: 答えて言った
  rationale: 対話における標準的な意味「答える」を保ち、後続節の直接話法へつなぐ לֵאמֹר も「言った」に反映した。
- source_word: הַחִתִּי
  choice: ヒッタイト人
  rationale: 定冠詞を伴う既知の民族的呼称として、現代日本語で一般的な名称を用いた。
- source_word: בְּאָזְנֵי
  choice: が聞いているところで
  rationale: 字義的な「耳に」ではなく、その人々に聞こえる公の場で語ったというヘブライ語慣用句の意味を自然に表した。
- source_word: לְכֹל בָּאֵי שַׁעַר עִירוֹ
  choice: 彼の町の門を入って来るすべての人の前で
  rationale: 町の門を出入りする人々が公的な証人となる場面を表しつつ、原文の「すべて」と「入って来る」を保持した。
- source_word: שַׁעַר עִירוֹ
  choice: 彼の町の門
  rationale: 原文の所有接尾辞を残し、町の門という公的取引の場所は脚注で説明した。
- source_word: לֵאמֹר
  choice: 言った
  rationale: 次節の直接話法を導く定型句として、「答えて言った」という自然で格調ある聖書叙述に組み込んだ。
