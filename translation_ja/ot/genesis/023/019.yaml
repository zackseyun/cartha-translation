  text: וְ/אַחֲרֵי כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת שָׂרָ֣ה אִשְׁתּ֗/וֹ אֶל מְעָרַ֞ת שְׂדֵ֧ה הַ/מַּכְפֵּלָ֛ה עַל פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּ/אֶ֖רֶץ כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/023/019.yaml
  text: After this[a], Abraham buried Sarah his wife in the cave of the field of Machpelah, facing Mamre (that is, Hebron), in the land of Canaan.
translation:
  language: ja
  text: その後、アブラハムは妻サラを、カナンの地のマムレ（すなわちヘブロン）に面する[a]マクペラの畑の洞窟に葬った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「マムレの向かいにある」。ヘブライ語の表現は、マムレの前にある、または向かいにあることを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 物語の時間的推移を示す一般的な表現。直前の出来事を受ける自然な現代日本語とした。
- source_word: קָבַר
  choice: 葬った
  rationale: 埋葬することを表す動詞。文脈にふさわしい、明瞭で品位ある日本語。
- source_word: אֶת שָׂרָה אִשְׁתּוֹ
  choice: 妻サラを
  rationale: ヘブライ語は「サラ、彼の妻」の順だが、日本語では「妻サラ」が自然であり、両者の関係も明確に伝わる。
- source_word: אֶל מְעָרַת
  choice: 洞窟に
  rationale: 前置詞は方向を表し得るが、埋葬の文脈では埋葬場所を示す日本語の「に」が自然。
- source_word: מְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: マクペラの畑の洞窟
  rationale: 連語の関係を保ち、洞窟がマクペラの畑に属することを過度に解釈せず示した。
- source_word: עַל פְּנֵי מַמְרֵא
  choice: マムレに面した
  rationale: 場所がマムレの前方または向かい側にあるという空間関係を示し、特定の方角は補わない。
- source_word: הִוא חֶבְרוֹן
  choice: （すなわちヘブロン）
  rationale: マムレとヘブロンの関係を説明する挿入句として、現代日本語で簡潔に表した。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地にある
  rationale: 原文の「地」を保持しつつ、日本語の地理的修飾として自然な位置に置いた。
