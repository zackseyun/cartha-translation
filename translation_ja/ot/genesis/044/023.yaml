source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ אֶל עֲבָדֶ֔י/ךָ אִם לֹ֥א יֵרֵ֛ד אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן אִתְּ/כֶ֑ם לֹ֥א תֹסִפ֖וּ/ן לִ/רְא֥וֹת פָּנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/023.yaml
  text: And you said to your servants[a], ‘If your youngest brother does not come down with you, you shall not continue to see my face.’
translation:
  language: ja
  text: そこで、あなたはあなたのしもべである私たちに言われました。『あなたがたの末の弟が、あなたがたと一緒に下って来なければ、あなたがたはもう再び私の顔を見ることは許されない[a]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「もう再び私の前に出ることは許されない」。
    reason: 「私の顔を見る」は、相手の前に出る、謁見することを表す慣用表現でもある。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: そして、あなたは……言われました
  rationale: 物語の連続を示す接続を「そして」で保ちつつ、ユダが高位の相手に語る場面にふさわしい敬語とした。
- source_word: עֲבָדֶיךָ
  choice: 僕たち
  rationale: 直訳は「あなたの僕たち」。宮廷的なへりくだった自己呼称として、現代日本語でも意味が通る「僕たち」を採用した。
- source_word: אִם לֹא
  choice: ……なければ
  rationale: 否定条件を自然な日本語の条件表現で明示した。
- source_word: יֵרֵד
  choice: 下って来る
  rationale: 動詞の下降方向を保ち、エジプトにいる話者の視点を「来る」で表した。
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: おまえたちの末の弟
  rationale: הַקָּטֹן は兄弟の中で最年少の者を指すため、「末の弟」とした。
- source_word: אִתְּכֶם
  choice: 一緒に
  rationale: 同行・随伴を簡潔で自然な日本語にした。
- source_word: לֹא תֹסִפוּן
  choice: 二度と……できない
  rationale: יסף＋不定詞が示す「今後さらに行うことはない」を、文脈上の面会拒否として自然に表した。
- source_word: לִרְאוֹת פָּנָי
  choice: 私の顔を見る
  rationale: ヘブライ語の具体的な表現を本文に残し、慣用的意味は脚注で示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調ある現代標準日本語。ユダのへりくだりは「僕たち」と敬語で表し、引用内のヨセフの権威ある口調は「おまえたち」で示した。「私の顔を見る」という原文の比喩的表現を保存しつつ、脚注で慣用的な意味を補った。
