  naturalness: 現行の「僕たち」は現代日本語では男性一人称複数としても読まれ、宮廷的な自己卑称・従属関係を十分に伝えにくい。「あなたのしもべである私たち」とすると、明瞭な現代語を保ちながら原文の関係を示せる。また「おまえたち」は原文にない侮蔑的な響きを加えうるため、中立的な「あなたがた」が適切である。
  terminology: עֲבָדֶיךָはこの場面のへりくだった自己呼称として「あなたのしもべである私たち」とする。「私の顔を見る」は本文に保持し、その慣用的意味を脚注で示す。
