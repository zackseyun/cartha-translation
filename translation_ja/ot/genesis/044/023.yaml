  rationale: 原文の「あなたのしもべたち」というへりくだった自己規定、同行を表す「あなたがたと共に」、および今後の面会が認められないという主節の効力を明確にした。本文では「私の顔を見る」という原文の表現を保ち、慣用的な意味は脚注に置いた。
