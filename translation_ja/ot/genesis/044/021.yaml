  naturalness: 「あなたは、あなたに仕える私たちに」は読点と「あなた」の反復がやや不自然なので、「そこで、あなたはあなたに仕える私どもにこう言われました」と整える。「連れて下って来なさい」は、エジプトへ『下る』という原文の方向感覚を保ちつつ日本語として理解可能である。
  terminology: 「あなたに仕える私ども」は、עֲבָדֶיךָ のへりくだった自己呼称を、古風すぎる「しもべども」を避けて明瞭に伝える。「目を留める」は「目を置く」の比喩を自然に反映し、注で複数の含意を示す方針も妥当である。
