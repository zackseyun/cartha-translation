  text: Then you said to your servants[a], ‘Bring him down to me, that I may set my eyes on him.’
translation:
  language: ja
  text: そこで、あなたはあなたに仕える私どもにこう言われました。『彼を私のもとへ連れて下って来なさい。わたしが彼に目を留めるために[a]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「わたしの目を彼の上に置く」。彼をじかに見る、確かめる、または特別に心を配る、という意味に理解できる。
    reason: ヘブライ語の比喩が持つ複数の意味合いを示すため。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: すると、あなたは……言われました
  rationale: 物語の順序を示す接続形を「すると」で表し、ユダがヨセフに直接、敬意をもって語る場面に合わせて丁寧な表現とした。
- source_word: עֲבָדֶיךָ
  choice: あなたに仕える私たち
  rationale: 直訳的な「あなたのしもべたち」が示すへりくだった関係を保ちつつ、現代日本語で自然に理解できる表現とした。ここでは奴隷身分そのものより、権力者に対する臣従的な自己表現が中心である。
- source_word: הוֹרִדֻהוּ
  choice: その子を……連れて下って来なさい
  rationale: ירדの使役形命令と男性単数接尾辞を反映した。エジプトへ向かう移動を「下る」と表す創世記の方向感覚も保持している。
- source_word: אֵלָי
  choice: 私のもとへ
  rationale: ヨセフ自身のところへの移動を表す前置詞句を、自然な日本語で明示した。
- source_word: וְאָשִׂימָה עֵינִי עָלָיו
  choice: 私が彼に目を留めよう
  rationale: 「私の目を彼の上に置く」というヘブライ語の比喩を、日本語の目に関する表現で保った。「見る」だけでなく、じかに確かめることや特別な注意を向けることも含みうるため、意味を一つに限定しない訳とした。
