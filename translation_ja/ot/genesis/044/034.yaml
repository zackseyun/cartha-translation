  text: כִּי אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל אָבִ֔/י וְ/הַ/נַּ֖עַר אֵינֶ֣/נּוּ אִתִּ֑/י פֶּ֚ן אֶרְאֶ֣ה בָ/רָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/034.yaml
  text: For how can I go up to my father if the boy is not with me? Otherwise, I would have to see the disaster that would come upon my father.
translation:
  language: ja
  text: どうして私は、この子が一緒にいないのに父のもとへ帰ることができるでしょうか。そうすれば、父に降りかかる災いを見てしまうことになるのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶעֱלֶה
  choice: 帰る
  rationale: 字義は「上る」だが、ここではエジプトからカナンにいる父のもとへ戻ることを指すため、現代日本語では文脈上自然な「帰る」とした。
- source_word: הַנַּעַר
  choice: この子
  rationale: ユダが目の前のベニヤミンを指す場面であり、「少年」よりも関係性と指示性を自然に表す。成人年齢の厳密な限定は持ち込まない。
- source_word: בָרָע
  choice: 災い
  rationale: רָעָה はここで父を襲う破局的な不幸を表す。原因や具体的結果を限定せず、原文の幅を保つ。
- source_word: יִמְצָא אֶת־אָבִי
  choice: 父に降りかかる
  rationale: 字義的には「父を見いだす／父に及ぶ」。災いが父に襲いかかるというヘブライ語の慣用を自然な日本語で表した。
theological_decisions:
- issue: פֶּן の叙法的ニュアンス
  choice: 見ることになってはなりません
  alternative: その災いを見るのが怖いのです／そうでなければ、私は見ることになります
  rationale: פֶּן は「〜しないように」「〜するといけないから」という懸念・回避を示す。英語監査層の結果的表現も参照しつつ、原文にあるユダの強い忌避を保持した。父の死など具体的結果までは補わない。
translation_notes:
  register: ユダの切迫した訴えにふさわしい、明快で dignified な現代標準日本語。疑問文から懸念の表明へ続く原文の感情的な流れを保った。
