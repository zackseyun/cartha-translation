  yaml_path: translation/ot/genesis/044/027.yaml
  text: Then your servant[a], my father, said to us, ‘You know that my wife bore me two sons.’
translation:
  language: ja
  text: そこで、あなたのしもべである私の父が、私たちにこう言いました。『あなたがたが知っているとおり、私の妻は私に二人[a]の子を産みました。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では単に「二人」。ここでの「子」は文脈から補った語であり、文脈上はヨセフとベニヤミンを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言いました
  rationale: 継続法のワウが物語を進める働きを、日本語として自然な「そこで」で表した。
- source_word: עַבְדְּךָ אָבִי
  choice: あなたのしもべである私の父
  rationale: ユダがヨセフに示すへりくだった呼称と、「私の父」という人物の特定をともに保持した。
- source_word: אֵלֵינוּ
  choice: 私たちに
  rationale: 前置詞と一人称複数接尾辞の通常の意味を簡潔に表した。
- source_word: אַתֶּם יְדַעְתֶּם
  choice: あなたがたも知っているとおり
  rationale: 明示された代名詞による強調を「も」で反映し、発言時にも有効な認識として自然な日本語にした。
- source_word: כִּי
  choice: ……とおり
  rationale: 知っている内容を導く語として、後続内容を自然につなぐ日本語表現を選んだ。
- source_word: שְׁנַיִם
  choice: 二人
  rationale: ヘブライ語は名詞を伴わず「二人／二つ」とだけ述べる。人を数える文脈なので「二人」とし、「息子たち」は本文に補わず注で明示した。
- source_word: יָלְדָה לִּי
  choice: 私に……を産みました
  rationale: 間接目的語 לִי を保持しつつ、現代日本語で自然な出生表現とした。
- source_word: אִשְׁתִּי
  choice: 私の妻
  rationale: この文脈での אִשָּׁה と一人称接尾辞の明確な意味を採った。
