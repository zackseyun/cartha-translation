  text: וַ/נֹּ֕אמֶר לֹ֥א נוּכַ֖ל לָ/רֶ֑דֶת אִם יֵשׁ֩ אָחִ֨י/נוּ הַ/קָּטֹ֤ן אִתָּ֨/נוּ֙ וְ/יָרַ֔דְנוּ כִּי לֹ֣א נוּכַ֗ל לִ/רְאוֹת֙ פְּנֵ֣י הָ/אִ֔ישׁ וְ/אָחִ֥י/נוּ הַ/קָּטֹ֖ן אֵינֶ֥/נּוּ אִתָּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/026.yaml
  text: But we said[a], ‘We cannot go down. If our youngest brother is with us, then we will go down[c][b], for we cannot see the man's face unless our youngest brother is with us.’
translation:
  language: ja
  text: しかし私たちは言いました。『私たちは下って行けません。末の弟が一緒なら、下って行きます。末の弟が一緒でなければ、あの人にお目にかかる[a]ことはできないからです。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「あの人の顔を見る」。ここでは、その人の前に出る、または面会するという意味の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: しかし私たちは言いました
  rationale: 接続詞は物語を進めると同時に、直前に述べられた要求に対する反応を導くため、文脈上の対比を自然な「しかし」で表した。
- source_word: לֹא נוּכַל לָרֶדֶת
  choice: 私たちは下って行けません
  rationale: יכל の能力・可能の否定を「できません」で表し、エジプトへの移動を指す ירד の「下る」という地理的表現も保持した。
- source_word: אָחִינוּ הַקָּטֹן
  choice: 末の弟
  rationale: קטן はこの家族関係では体格の小ささではなく兄弟中の最年少者を指すため、自然な日本語の「末の弟」とした。
- source_word: אִם יֵשׁ ... אִתָּנוּ וְיָרַדְנוּ
  choice: 一緒なら、下って行きます
  rationale: 肯定条件とその帰結を、ヘブライ語の二段階の構造を保ちながら自然な日本語で表した。
- source_word: לִרְאוֹת פְּנֵי הָאִישׁ
  choice: あの人にお目にかかる
  rationale: 直訳は「あの人の顔を見る」だが、ここではその人の前に出る、面会するという慣用表現であるため、文脈に合う自然な敬語表現とした。
- source_word: וְאָחִינוּ הַקָּטֹן אֵינֶנּוּ אִתָּנוּ
  choice: 末の弟が一緒でなければ
  rationale: 形式上は接続詞で連結された不在の節だが、意味上は面会できない状況・条件を示すため、日本語では条件節として明示した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な丁寧体を用いた。ユダがヨセフに父との会話を語っている場面に合わせて、直接話法内も丁寧な語調とした。「下って行く」は原文の地理的表現を残し、「顔を見る」は本文では日本語として自然な「お目にかかる」として脚注で原文の比喩を示した。
