  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר גַּם עַתָּ֥ה כְ/דִבְרֵי/כֶ֖ם כֶּן ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּ/וֹ֙ יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/010.yaml
  text: And he said[a], “Even now, let it be according to your words. The one with whom it is found will be my servant[b], and you will be innocent.”
translation:
  language: ja
  text: 彼は言った。「今も、あなたがたの言うとおりにしよう。それが見つかった者は私の奴隷[a]となり、あなたがたは罪に問われない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奴隷」と訳した語は、文脈によっては「しもべ」とも訳せる。ここでは罰として強制的に隷属させられる身分を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: では
  rationale: 直前の申し出を受けて応答する機能を、自然な現代日本語で表した。「今も」と逐語訳すると日本語では意味が不明瞭になるため、文脈上の応答・承認の力を優先した。
- source_word: כְדִבְרֵיכֶם כֶּן הוּא
  choice: あなたがたの言ったとおりにしよう
  rationale: 相手の言葉を受け入れる表現として訳した。ただし、後続文は兄弟たちの提案をそのまま繰り返すのではなく、家令が示す修正された処置なので、ヘブライ語の大きな区切りに従い文を分けた。
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ
  choice: それが見つかった者
  rationale: 杯の所持が発覚した者を指す関係節を、簡潔で自然な日本語にした。
- source_word: יִהְיֶה לִּי עָבֶד
  choice: 私の奴隷となり
  rationale: 罰として強制的な隷属状態に置かれる文脈なので、「僕」や「召使い」ではなく「奴隷」とした。יִהְיֶה の将来的な状態移行は「となり」で自然に表した。
- source_word: וְאַתֶּם תִּהְיוּ נְקִיִּם
  choice: あなたがたは罪に問われない
  rationale: נָקִי は罪・責任・処罰の対象から免れることを示す。ここでは道徳的な無実だけでなく法的・処罰上の免責が焦点なので、この表現を選んだ。
theological_decisions:
- issue: 家令が兄弟たちの提案を全面的に受け入れたか
  choice: 承認の句の後で文を切り、続く処置を家令自身の裁定として読めるようにした
  alternative: コロンなどで後半を「あなたがたの言ったとおり」の直接的な言い換えとして結ぶ
  rationale: 前節で兄弟たちは、杯を持つ者の死と残りの者の奴隷化を申し出たが、家令は杯が見つかった者だけを奴隷とし、他の者は免責すると述べる。הוּא 上のアトナハも主要な区切りを支持するため、両者を同一内容として扱わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「では」で会話の流れを自然に示し、「罪に問われない」で他の兄弟たちが責任と処罰を免れる意味を明確にした。
