  text: וַ/יָּבֹ֨א יְהוּדָ֤ה וְ/אֶחָי/ו֙ בֵּ֣יתָ/ה יוֹסֵ֔ף וְ/ה֖וּא עוֹדֶ֣/נּוּ שָׁ֑ם וַ/יִּפְּל֥וּ לְ/פָנָ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/014.yaml
  text: Then Judah and his brothers came into Joseph’s house[a]. He was still there[b], and they fell to the ground before him.
translation:
  language: ja
  text: ユダとその兄弟たちはヨセフの家に入った。ヨセフはまだそこにいた。彼らはヨセフの前で地にひれ伏した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 入った
  rationale: בואに方向を示すבֵּיתָהが続くため、単に「来た」ではなく、家の中への移動を自然な日本語で表した。
- source_word: יְהוּדָה וְאֶחָיו
  choice: ユダとその兄弟たち
  rationale: ユダを先頭に明示する原文の焦点と、兄弟関係の表現を保った。
- source_word: בֵּיתָה יוֹסֵף
  choice: ヨセフの家に
  rationale: 方向接尾辞־ָהが示す、ヨセフの家へ、文脈上はその中へ向かう動きを簡潔に表した。
- source_word: וְהוּא עוֹדֶנּוּ שָׁם
  choice: ヨセフはまだそこにいた
  rationale: 代名詞「彼」が指す人物を日本語で明確にし、עוֹדֶנּוּの継続の意味を「まだ」で表した。
- source_word: וַיִּפְּלוּ לְפָנָיו אָרְצָה
  choice: 彼らはヨセフの前で地にひれ伏した
  rationale: 字義的には「彼の前で地に倒れた」だが、この姿勢が表す恭順の動作を、自然で荘重な日本語の「ひれ伏した」で示し、אָֽרְצָהの方向性も「地に」で保った。
