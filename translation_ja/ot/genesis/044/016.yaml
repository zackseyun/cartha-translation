id: GEN.44.16
reference: Genesis 44:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָ֗ה מַה נֹּאמַר֙ לַֽ/אדֹנִ֔/י מַה נְּדַבֵּ֖ר וּ/מַה נִּצְטַדָּ֑ק הָ/אֱלֹהִ֗ים מָצָא֙ אֶת עֲוֺ֣ן עֲבָדֶ֔י/ךָ הִנֶּ/נּ֤וּ עֲבָדִים֙ לַֽ/אדֹנִ֔/י גַּם אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר נִמְצָ֥א הַ/גָּבִ֖יעַ בְּ/יָדֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/016.yaml
  text: And Judah said[a], “What shall we say to my lord? What shall we speak? Or how shall we justify ourselves? God has found out the guilt of your servants. Here we are, my lord’s servants[c][b], both we and the one in whose hand the cup was found.”
translation:
  language: ja
  text: ユダは言った。「わが主に、何と申し上げましょう。何を申し述べましょう。どうすれば、自分たちが正しいと示せるでしょうか。[a] 神は、わが主のしもべである私どもの罪を明るみに出されました。[b] このとおり、私たちも、杯がその手に見つかった者も、わが主の奴隷です。[c]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どうして自分たちの潔白を証明できましょうか」。ヘブライ語の動詞は、自分が正しいことを示す、または自分を正当化することを意味します。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「神は、わが主のしもべたちの罪を見いだされました」。ここでは、隠れていた罪を神が暴かれたという意味に取れます。
    reason: lexical_alternative
  - marker: c
    text: 前の「しもべ」は上位者に対する謙譲的な自称です。ここでの「奴隷」は、兄弟たちが実際に隷属する身分を受け入れるという意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: לַאדֹנִי
  choice: わが主に／わが主の
  rationale: 神への称号ではなく、権威あるヨセフに対する丁重な呼びかけ。宮廷的な敬意を保ちつつ、現代日本語でも理解できる表現とした。
- source_word: מַה נֹּאמַר מַה נְּדַבֵּר
  choice: 何と申し上げられましょう。何を語り
  rationale: 二つの発話動詞を訳し分け、弁明の言葉がないという修辞的な畳みかけを保った。最初は目上への発言なので「申し上げる」とした。
- source_word: וּמַה נִּצְטַדָּק
  choice: どうして自分たちの正しさを示せましょうか
  rationale: צדק のヒトパエルが持つ「自分が正しいと示す、自己を正当化する」という意味を、過度に専門的にならない自然な日本語で表した。
- source_word: מָצָא אֶת־עֲוֺן
  choice: 罪を明るみに出されました
  rationale: 直訳の「罪を見いだす」よりも、隠れていた罪責を神が露呈させたという文脈上の含意を明確に伝える。
- source_word: עֲבָדֶיךָ / עֲבָדִים
  choice: わが主のしもべである私ども／わが主の奴隷
  rationale: 最初は上位者に対する謙譲的な自称、後者は隷属身分の受諾を指すため、日本語でも「しもべ」と「奴隷」を訳し分けた。
- source_word: הִנֶּנּוּ
  choice: このとおり、私たちは
  rationale: 降伏して自分たちを差し出す提示の力を、現代日本語として自然な形で表した。
- source_word: גַּם אֲנַחְנוּ גַּם אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: 私たちも、杯を持っているのが見つかった者も
  rationale: 二重の גַּם による、兄弟全員と杯を発見された者の双方を含める構造を保持した。「手に」は日本語では所有・所持を表す「持っている」とした。
- source_word: הַגָּבִיעַ
  choice: 杯
  rationale: 器の種類を過度に具体化せず、物語の反復にも適した簡潔で格調ある語を選んだ。
theological_decisions:
- issue: הָאֱלֹהִים の指示対象
  choice: 神
  alternative: ある神／神々
  rationale: 創世記の物語文脈では、ユダは兄弟たちの隠れた罪を露呈させた方として唯一の神に言及している。定冠詞付きの形もこの理解に合致する。
- issue: עָוֹן の意味範囲
  choice: 罪
  alternative: 罪責／咎／罪への罰
  rationale: 語は罪そのもの、罪責、その結果を含み得る。ここでは過去の悪事とその罪責が神によって露呈したとの告白なので、意味を狭く限定しすぎない「罪」を本文に置いた。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、ユダの丁重で切迫した発言にふさわしく「わが主」「申し上げる」を用いた。「私ども」は服従的な場面の敬意を自然に示す。修辞的な三つの問いと、しもべ／奴隷の意味上の対照を保持した。
