  text: My lord asked his servants, saying, ‘Do you have a father or a brother?’
translation:
  language: ja
  text: わが主は僕どもに、『あなたがたには父か兄弟がいるのか』とお尋ねになりました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנִי
  choice: わが主
  rationale: 一人称単数接尾辞を伴う敬称であり、エジプトの支配者に対するユダの恭しい語り方を保つ。
- source_word: שָׁאַל
  choice: お尋ねになりました
  rationale: 質問する意。身分の高い相手の行為を述べる場面なので、自然な尊敬語とした。
- source_word: עֲבָדָיו
  choice: 僕ども
  rationale: 字義上は「彼の僕たち」。ここでは兄弟たちが支配者の前で自分たちをへりくだって呼ぶ宮廷的な自称であり、所有奴隷と断定しない訳語を選んだ。日本語では聞き手を所有者として示す「あなたの僕」より、自称として自然な「僕ども」とした。
- source_word: לֵאמֹר
  choice: 『……』と
  rationale: 後続する発言内容を導く不定詞。日本語では引用助詞「と」によって自然かつ明瞭に表した。
- source_word: הֲיֵשׁ לָכֶם
  choice: あなたがたには、……がいるのか
  rationale: 疑問辞と存在詞、前置詞 ל による存在・所有の問い。人について尋ねるため、日本語では「いる」を用いた。
- source_word: אָב
  choice: 父
  rationale: 家族関係を表す単数名詞。日本語では不定冠詞に相当する語を加えず、自然に「父」とした。
- source_word: אָח
  choice: 兄弟
  rationale: 単数の אָח は年長・年少を特定しないため、性別を保ちつつ出生順を決めない「兄弟」とした。文脈上も特定の一人の兄弟の有無を尋ねている。
- source_word: אוֹ
  choice: か
  rationale: 「または」を表す選言。父と兄弟のどちらかがいるかという原文の問いの形を、解釈で「と」に変えず保持した。
