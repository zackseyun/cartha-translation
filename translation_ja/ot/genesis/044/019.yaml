translation_notes:
  register: 現代標準日本語による、簡潔で品位ある宮廷的発話。ユダのへりくだりは「わが主」「僕ども」と尊敬語で示しつつ、古語調に寄りすぎないようにした。引用内の「父か兄弟」は、原文の אוֹ が持つ選言をそのまま保っている。
