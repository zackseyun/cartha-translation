  text: וְ/אֶת גְּבִיעִ֞/י גְּבִ֣יעַ הַ/כֶּ֗סֶף תָּשִׂים֙ בְּ/פִי֙ אַמְתַּ֣חַת הַ/קָּטֹ֔ן וְ/אֵ֖ת כֶּ֣סֶף שִׁבְר֑/וֹ וַ/יַּ֕עַשׂ כִּ/דְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/002.yaml
  text: And put my cup[a], the silver cup, in the mouth of the youngest one's sack, along with the silver for his grain purchase." And he did according to Joseph's word[b], which he had spoken.
translation:
  language: ja
  text: 「また、私の杯、すなわち銀の杯を、一番年下の者の袋の口[a]に、穀物の代金として払った銀[b]と一緒に入れておけ。」彼は、ヨセフが語った言葉どおりにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「袋の口」。袋の開いている部分を指す表現。
    reason: cultural_note
  - marker: b
    text: 「穀物の代金」または「穀物のための銀」とも訳せる。原語は、穀物や食糧を買うために支払った銀を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּבִיעִי גְּבִיעַ הַכֶּסֶף
  choice: 私の杯、あの銀の杯
  rationale: גְּבִיעַは杯・鉢形の器を指す。「杯」は現代日本語で自然かつ簡潔であり、同格的な反復も残して原文の強調を表した。
- source_word: תָּשִׂים
  choice: 入れておけ
  rationale: שׂיםは「置く、入れる」の意。袋の中に杯を忍ばせる文脈に合わせて「入れる」とし、命令の継続的な含みを「ておけ」で自然に表した。
- source_word: בְּפִי אַמְתַּחַת
  choice: 袋の口に
  rationale: 直訳は「袋の口に」。日本語でも容器の開口部を「口」と呼ぶため、原文の具体的な比喩を保ちながら自然に理解できる。
- source_word: הַקָּטֹן
  choice: 一番年下の者
  rationale: 字義は「小さい者／若い者」。ここでは兄弟のうち最年少の者を指すため、文脈上明確で、原文にない固有名を補わない表現とした。
- source_word: כֶּסֶף שִׁבְרוֹ
  choice: 穀物の代金として払った銀
  rationale: כֶּסֶףは「銀」または「金銭」、שֶׁבֶר系の語は飢饉物語では購入した穀物・食糧を指す。銀という素材語と取引上の意味の双方を明示した。
- source_word: וַיַּעַשׂ כִּדְבַר יוֹסֵף אֲשֶׁר דִּבֵּר
  choice: 彼は、ヨセフが語った言葉どおりにした
  rationale: 「言葉どおりにした」という原文の形式を保ち、「命令」と解釈的に限定しない。関係節אֲשֶׁר דִּבֵּרも「語った」と反映した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。ヨセフの指示は直接的な命令として自然に表しつつ、「私の杯、あの銀の杯」という原文の反復と、「言葉どおり」という物語上の形式を保持した。脚注記号は説明対象である「袋の口」と「銀」の直後に配置した。
