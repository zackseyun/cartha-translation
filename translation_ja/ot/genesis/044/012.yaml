  yaml_path: translation/ot/genesis/044/012.yaml
  text: And he searched[a], beginning with the oldest and finishing with the youngest, and the cup was found in Benjamin’s sack.
translation:
  language: ja
  text: 彼は一番年上の者から調べ始め、一番年下の者まで調べた。すると、杯[a]がベニヤミンの袋の中で見つかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ゴブレット」とも訳せる。ヘブライ語は、杯またはゴブレットを指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַפֵּשׂ
  choice: 彼は…調べ
  rationale: חפשׂはここでは荷物の中を捜索する行為を表す。「捜した」も可能だが、袋を順に点検する文脈に自然な「調べる」とした。
- source_word: בַּגָּדוֹל הֵחֵל
  choice: 一番年上の者から調べ始め
  rationale: גדולはこの兄弟間の文脈では体格や地位ではなく年齢順を指す。החלの開始点も自然な日本語で明示した。
- source_word: וּבַקָּטֹן כִּלָּה
  choice: 一番年下の者で調べ終えた
  rationale: קטןはגדולと対をなし、最年少者を指す。כלהが示す捜索の終点を保った。
- source_word: וַיִּמָּצֵא
  choice: 見つかった
  rationale: ニファル形の受動的な表現を保ち、「彼が見つけた」と能動に変えなかった。
- source_word: הַגָּבִיעַ
  choice: 杯
  rationale: גביעは杯または大杯・ゴブレットを指し得る。本文では簡潔で文脈に合う「杯」とし、語義の幅を脚注に残した。
- source_word: בְּאַמְתַּחַת
  choice: 袋の中から
  rationale: אמתחתは穀物や旅の物資を入れる袋を指す。「かばん」より当時の運搬用の袋に適した表現とした。
- source_word: בִּנְיָמִן
  choice: ベニヤミン
  rationale: 人名を日本語聖書で広く通用する形に音写した。
