source:
  edition: WLC
  text: וַ/יְהִי֙ כִּ֣י עָלִ֔ינוּ אֶֽל עַבְדְּ/ךָ֖ אָבִ֑/י וַ/נַּ֨גֶּד ל֔/וֹ אֵ֖ת דִּבְרֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/024.yaml
  text: And when we went up to your servant my father[a], we told him the words of my lord.
translation:
  language: ja
  text: こうして私たちが、あなたのしもべである私の父[a]のもとへ上って行ったとき、私たちは父に、わが主のお言葉を伝えました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の父、すなわちあなたのしもべ」。ヘブライ語の語順は「あなたのしもべ、私の父」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: こうして……とき
  rationale: 物語の展開を示す定型表現の順接的な力を保ちつつ、現代日本語として自然にした。
- source_word: עָלִינוּ
  choice: 上って行った
  rationale: エジプトからカナンへ向かう移動を表すעלהの地理的・叙述的な方向性を保持した。
- source_word: עַבְדְּךָ אָבִי
  choice: あなたのしもべである私の父
  rationale: ヘブライ語の語順と、ユダがヨセフに対してヤコブを『あなたのしもべ』と呼ぶ敬譲的な語調を明示した。
- source_word: וַנַּגֶּד לוֹ
  choice: 私たちは父に……伝えました
  rationale: Hiphil形の『知らせる、告げる』を自然な日本語の『伝える』とし、代名詞の指示対象を明確にした。
- source_word: אֵת דִּבְרֵי אֲדֹנִי
  choice: わが主のお言葉
  rationale: דִּבְרֵיの『言葉』を保持し、אֲדֹנִיが神名ではなく、ヨセフへの恭しい人間的呼称であることを『わが主』で表した。
