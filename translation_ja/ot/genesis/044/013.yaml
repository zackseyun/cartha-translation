  text: וַֽ/יִּקְרְע֖וּ שִׂמְלֹתָ֑/ם וַֽ/יַּעֲמֹס֙ אִ֣ישׁ עַל חֲמֹר֔/וֹ וַ/יָּשֻׁ֖בוּ הָ/עִֽירָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/013.yaml
  text: Then they tore their clothes[a], and each man loaded his donkey, and they returned to the city.
translation:
  language: ja
  text: 彼らは衣服を引き裂き[a]、それぞれ自分のろばに荷を載せて、町へ引き返した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「衣」を引き裂いた、とも訳せる。ヘブライ語は一般に衣類、特に外に着る物を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְעוּ
  choice: 引き裂き
  rationale: קרעの具体的な動作を保ち、悲嘆や衝撃を表す聖書的な行為として自然な日本語にした。
- source_word: שִׂמְלֹתָם
  choice: 衣服
  rationale: שִׂמְלָהは広く衣類、特に外に着る物を指し得る。「衣服」は意味範囲を狭めすぎず、現代日本語でも明瞭である。
- source_word: וַיַּעֲמֹס אִישׁ עַל חֲמֹרוֹ
  choice: それぞれ自分のろばに荷を載せて
  rationale: 単数形אִישׁの配分的な意味を「それぞれ」で表し、עמסの「荷を載せる」という意味を明示した。
- source_word: חֲמֹרוֹ
  choice: 自分のろば
  rationale: חֲמוֹרの通常の意味を現代的な表記で示し、接尾辞の所有関係は配分的文脈に合う「自分の」とした。
- source_word: וַיָּשֻׁבוּ הָעִירָה
  choice: 町へ引き返した
  rationale: שׁוּבの回帰の意味と、方向を示すהָעִירָהを自然に合わせた。「引き返した」は、直前まで町を離れていた物語状況にも適合する。
