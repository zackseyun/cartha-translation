  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י יֶשׁ לָ֨/נוּ֙ אָ֣ב זָקֵ֔ן וְ/יֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְ/אָחִ֨י/ו מֵ֜ת וַ/יִּוָּתֵ֨ר ה֧וּא לְ/בַדּ֛/וֹ לְ/אִמּ֖/וֹ וְ/אָבִ֥י/ו אֲהֵבֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/020.yaml
  text: And we said to my lord[a], ‘We have an elderly father, and a young son born in his old age. His brother is dead, so he alone is left of his mother[c][b], and his father loves him.’
translation:
  language: ja
  text: 私たちはご主人に申し上げました。『私たちには年老いた父がおり、父の老年に生まれた年若い子がいます。彼の兄弟は死に、同じ母の子で残っているのは彼一人だけです。[a] 父は彼を愛しています。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼だけが母に残されました」。つまり、同じ母から生まれた息子のうち、残っているのは彼一人だという意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: ご主人
  rationale: 目上の支配者への敬意ある呼びかけ。物語における社会的上下関係を保ちつつ、現代日本語の発話として自然にした。
- source_word: זָקֵן
  choice: 年老いた
  rationale: 父が高齢であることを率直かつ自然に表す。
- source_word: יֶלֶד זְקֻנִים קָטָן
  choice: その老年に生まれた年若い息子
  rationale: 「老年の子」というヘブライ語の慣用表現を明確にしつつ、יֶלֶד と קָטָן が示す息子の若さも保持した。
- source_word: וְאָחִיו מֵת
  choice: その兄は死に
  rationale: אָחִיו 自体は「彼の兄弟」だが、文脈上は同母兄ヨセフを指すため、日本語の自然な親族呼称として「兄」とした。死が現在の状況を生んだことを文脈に沿って表した。
- source_word: וַיִּוָּתֵר הוּא לְבַדּוֹ לְאִמּוֹ
  choice: 同じ母の子で残っているのは彼一人だけです
  rationale: 直訳的な「母に残された」では日本語で意味が曖昧になるため、母にとって唯一残った息子という関係を明示した。
- source_word: וְאָבִיו אֲהֵבוֹ
  choice: 父は彼を愛しています
  rationale: אהב の直接的な意味を保ち、父の現在の深い愛情を自然な日本語で表した。
