source:
  edition: WLC
  text: וְ/עַתָּ֗ה יֵֽשֶׁב נָ֤א עַבְדְּ/ךָ֙ תַּ֣חַת הַ/נַּ֔עַר עֶ֖בֶד לַֽ/אדֹנִ֑/י וְ/הַ/נַּ֖עַר יַ֥עַל עִם אֶחָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/033.yaml
  text: So now[a], please let your servant remain instead of the boy as a servant to my lord[b], and let the boy go up with his brothers.
translation:
  language: ja
  text: ですから今、どうか、このしもべを若者の代わりに、ご主人様の奴隷としておとどめください。若者は兄たちと一緒に上って行かせてください。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上って行く」は、エジプトからカナン地方へ向かう旅を表す一般的な言い方。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: ですから今
  rationale: 接続詞と談話上の帰結・転換、および「今」という時間的要素を、ユダの嘆願の結びにふさわしい自然な日本語で表した。
- source_word: יֵשֶׁב נָא
  choice: どうか、…残らせ
  rationale: ישׁב の使役的な文脈上の意味と、נָא を伴う丁重な願いを表す。「座る」ではなく、ベニヤミンの身代わりとしてその場にとどまる意味を明確にした。
- source_word: עַבְדְּךָ
  choice: このしもべ
  rationale: ここではユダが自分を低くして呼ぶ敬語的な自称なので、実際の隷属身分を直接示す「奴隷」ではなく「このしもべ」とした。
- source_word: תַּחַת הַנַּעַר
  choice: あの若者の代わりに
  rationale: תחת の代替・身代わりの意味を明示した。נער は幼児を意味しないため、現代日本語では「少年」より幅のある「若者」とした。
- source_word: עֶבֶד לַאדֹנִי
  choice: あなた様の奴隷として
  rationale: 二度目の עבד はヨセフのもとに拘束される実際の身分を指すため「奴隷」とした。אדני は人間であるヨセフへの尊称なので、神的称号と誤解されやすい「わが主」を避け、直接の敬称「あなた様」で社会的な上下関係を表した。
- source_word: וְהַנַּעַר יַעַל
  choice: あの若者は…上って行かせてください
  rationale: 嘆願の継続を自然な依頼表現で示しつつ、עלה の「上る」を保持した。単に「帰らせる」とすると原文に明示されない意味を加えるため避けた。
- source_word: עִם אֶחָיו
  choice: 兄たちと一緒に
  rationale: 文脈上、ベニヤミンと同行する実兄たちを指す。日本語では彼らが年長であることが明らかなので「兄たち」が自然である。
theological_decisions: []
translation_notes:
  register: ユダがヨセフに向けて語る丁重で切迫した嘆願として、現代の読者に理解しやすい敬語を用いた。最初の עבד はへりくだった自称として「しもべ」、後の עבד は身代わりとして受け入れる現実の隷属を示すため「奴隷」と訳し分けた。英語相談層の脚注記号は内容との対応がずれているため、原文上説明を要する「上って行く」に脚注を正しく付した。
