  to: ですから今、どうか、このしもべを若者の代わりに、ご主人様の奴隷としておとどめください。若者は兄たちと一緒に上って行かせてください。[a]
  rationale: 原文の二つの丁重な嘆願を、現代日本語として自然かつ明瞭な並行した依頼文に整えた。「しもべ」と「奴隷」の機能上の訳し分け、身代わりの意味、「上って行く」の地理的・慣用的含意、および脚注の係り先は維持した。
