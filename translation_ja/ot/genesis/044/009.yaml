  text: אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛/וֹ מֵ/עֲבָדֶ֖י/ךָ וָ/מֵ֑ת וְ/גַם אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽ/אדֹנִ֖/י לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/009.yaml
  text: Whichever of your servants it is found with[a], let him die[b], and we also will become servants to my lord.
translation:
  language: ja
  text: あなたのしもべたちのうちで杯が見つかった者は、死なせてください。私たちもまた、わが主の奴隷となります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲשֶׁר יִמָּצֵא אִתּוֹ מֵעֲבָדֶיךָ
  choice: あなた様の僕たちのうち、杯が見つかった者
  rationale: אֲשֶׁר は不定の関係節を導き、מִן は集団の中の一人を示す部分用法。יִמָּצֵא はニファル形なので受動的に訳した。何が見つかるかは前文脈の杯であり、日本語で指示対象を明確にするため補った。
- source_word: וָמֵת
  choice: 死ぬものとしてください
  rationale: 完了形に接続詞が付いた形は、ここでは兄弟たちが申し出る処罰の帰結を表す。単なる未来の予告ではなく、提案の力を保つ表現とした。
- source_word: וְגַם אֲנַחְנוּ נִהְיֶה
  choice: 私たちもまた……となります
  rationale: וְגַם の付加的強調と、היה が示す新たな状態への移行を自然な日本語で表した。
- source_word: לַאדֹנִי
  choice: わが主
  rationale: 一人称単数接尾辞を保持し、人間の高官に対する敬称として訳した。神を指す称号ではない。
- source_word: עבד（מֵעֲבָדֶיךָ／לַעֲבָדִים）
  choice: 僕たち／奴隷
  rationale: 最初は権力者へのへりくだった自己呼称なので「僕たち」、後者は処罰として実際に隷属する身分が中心なので「奴隷」とした。
theological_decisions:
- issue: 同じ語根 עבד の二つの用例
  choice: 最初を「僕たち」、後を「奴隷」
  alternative: 両方を「僕」または両方を「奴隷」
  rationale: 語彙上のつながりは注で示しつつ、前半の宮廷的な自己卑下と後半の現実の隷属という文脈上の差を本文で明確にした。特定の教派的理解には依存しない。
- issue: וָמֵת の法的・意志的な力
  choice: 「死ぬものとしてください」
  alternative: 「その者は死にます」または「その者を死刑にしてください」
  rationale: 兄弟たちによる処罰の申し出としての力を表しながら、「死刑」と明示して原文以上に制度的な意味を加えることは避けた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、ヨセフの家の管理者に対する丁重な発言としての品位を保った。「あなた様」と「わが主」により宮廷的な敬意を示し、「奴隷」は処罰としての隷属を曖昧にしない表現とした。
