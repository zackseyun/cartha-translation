base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/028.yaml
  text: One left me, and I said, ‘Surely he has been torn to pieces,’ and I have not seen him until now.
translation:
  language: ja
  text: 一人が私のもとを去り、私は、『きっと引き裂かれたのだ』と言いました。それ以来、今に至るまで、彼を見ていません。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא הָאֶחָד מֵאִתִּי
  choice: 一人は私のもとから出て行ってしまいました
  rationale: 直訳的には「その一人が私のもとから出て行った」。文脈上は息子の一人を指すが、原文の言い方を保ちつつ、完了した離別の痛みを自然な日本語の「しまいました」で表した。
- source_word: אַךְ
  choice: ああ、きっと
  rationale: 確信・強調を表す語。悲嘆を伴う発言として、断定の「きっと」に感嘆の「ああ」を添えた。
- source_word: טָרֹף טֹרָף
  choice: 引き裂かれたのだ
  rationale: 不定詞絶対形と完了形の反復による強調で、「確かに引き裂かれた」の意。強調は直前の「きっと」と断定表現によって日本語に反映した。
- source_word: וְלֹא רְאִיתִיו עַד הֵנָּה
  choice: それ以来、今に至るまで、その子を見ていません
  rationale: 「今ここに至るまで彼を見なかった」の意味。「それ以来」は文脈上の時間的つながりを明確にし、「その子」は日本語で指示対象を自然に示す。
