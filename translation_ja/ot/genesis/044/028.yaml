translation_notes:
  register: ユダが父ヤコブの言葉を引用する場面として、敬意のある現代標準語にした。父の喪失感が伝わる自然さを保ちつつ、ヨセフの死を事実として確定せず、あくまでヤコブ自身の判断として表現した。
