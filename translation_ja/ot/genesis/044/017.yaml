  text: וַ/יֹּ֕אמֶר חָלִ֣ילָ/ה לִּ֔/י מֵ/עֲשׂ֖וֹת זֹ֑את הָ/אִ֡ישׁ אֲשֶׁר֩ נִמְצָ֨א הַ/גָּבִ֜יעַ בְּ/יָד֗/וֹ ה֚וּא יִהְיֶה לִּ֣/י עָ֔בֶד וְ/אַתֶּ֕ם עֲל֥וּ לְ/שָׁל֖וֹם אֶל אֲבִי/כֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/017.yaml
  text: But he said[a], "Far be it from me to do this. The man in whose hand the cup was found—he shall be my servant[b], but you may go up in peace to your father."
translation:
  language: ja
  text: しかし彼は言った。「私がそんなことをするなど、断じてありえない。杯がその者の手もとで見つかった者[a]が、私の奴隷[b]となる。あなたがたは無事に父のもとへ上って行きなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その手に杯が見つかった者」。杯がその者の所持のもとで見つかったことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「僕」とも訳せる。ヘブライ語 עָבֶד は僕にも奴隷にも用いられるが、ここでは処罰として拘束される身分を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי
  choice: 私が……など、断じてあってはならない
  rationale: 強い拒絶と嫌悪を表す慣用句。現代日本語として自然でありながら、話者がその行為を断固として退ける力を保った。
- source_word: מֵעֲשׂוֹת זֹאת
  choice: そのようなことをする
  rationale: 前置詞付き不定詞が示す、拒絶される行為を簡潔に表した。
- source_word: הָאִישׁ אֲשֶׁר נִמְצָא הַגָּבִיעַ בְּיָדוֹ
  choice: 杯が手もとから見つかった者
  rationale: בְיָדוֹ の具体的な「その手に」という像を「手もと」で残しつつ、所有物の中から発見されたという文脈を自然な日本語で示した。
- source_word: הוּא יִהְיֶה לִּי עָבֶד
  choice: その者だけが、私の奴隷となる
  rationale: הוּא の限定・対比の力を「だけが」で表した。עָבֶד は幅のある語だが、ここでは処罰として拘束される身分を指すため「奴隷」とした。
- source_word: וְאַתֶּם עֲלוּ
  choice: あなたがたは……上って行きなさい
  rationale: 複数への命令を明示し、エジプトからカナンへ向かう移動に用いられた「上る」を保持した。前文との対比は「あなたがたは」で自然に伝わる。
- source_word: לְשָׁלוֹם
  choice: 安心して
  rationale: 無事に、争いなく去ることを許す文脈上の意味を、自然な現代日本語で表した。
- source_word: אֶל אֲבִיכֶם
  choice: 父上のもとへ
  rationale: 兄弟たちの父を指す敬意ある呼称として、ヨセフの発話にふさわしい自然な日本語を選んだ。
