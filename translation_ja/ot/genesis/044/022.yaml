source:
  edition: WLC
  text: וַ/נֹּ֨אמֶר֙ אֶל אֲדֹנִ֔/י לֹא יוּכַ֥ל הַ/נַּ֖עַר לַ/עֲזֹ֣ב אֶת אָבִ֑י/ו וְ/עָזַ֥ב אֶת אָבִ֖י/ו וָ/מֵֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/022.yaml
  text: And we said to my lord[a], ‘The boy cannot leave his father, for if he should leave his father, he would die.’
translation:
  language: ja
  text: 私たちはご主人様に申し上げました。「その子は父親のもとを離れることができません。父親のもとを離れれば、死んでしまいます[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼が父親を離れ、彼が死ぬ」。ヘブライ語の二つの動詞はいずれも三人称男性単数だが、「死ぬ」の指示対象は明示的な名詞句では示されていない。文脈上は、父親が死ぬことを指すと理解される。
    reason: 原文の動詞に含まれる人称表示と、指示対象が文脈に委ねられている点を区別して示し、日本語の逐語的引用によって少年が死ぬとの読みを不当に強めないため。
lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: 私たちは…申し上げました
  rationale: 一人称複数の発言を保ちつつ、ヨセフに対するユダのへりくだった語調を自然な敬語で表した。
- source_word: אֶל אֲדֹנִי
  choice: ご主人様に
  rationale: 宮廷的な場面での敬意ある呼びかけを示す。所有の接尾辞を日本語で不自然に直訳せず、敬称として表現した。
- source_word: לֹא יוּכַל
  choice: 離れることができません
  rationale: 能力・可能性の欠如を表す יכל の意味を明確に保った。
- source_word: הַנַּעַר
  choice: あの子
  rationale: נער は少年から若者までを指し得るが、ここでは父に依存するベニヤミンを家族的な視点から語っている。「あの子」は年齢を過度に限定せず、その語感を自然に伝える。
- source_word: לַעֲזֹב אֶת אָבִיו
  choice: 父親のもとを離れる
  rationale: עזב はここでは道徳的に『見捨てる』というより、父のそばから離れることを意味する。「もとを離れる」で関係と距離の両面を自然に表した。
- source_word: וְעָזַב אֶת אָבִיו וָמֵת
  choice: 父親のもとを離れれば、死んでしまいます
  rationale: 接続された動詞列を文脈上の条件表現として訳した。日本語では「死ぬ」の主語を明示せず、原文にある主語の曖昧さを保持した。
theological_decisions:
- issue: וָמֵת（「死ぬ」）の暗黙の主語
  choice: 本文では主語を補わず、「死んでしまいます」とした
  alternative: 「父親が死んでしまいます」または「あの子が死んでしまいます」
  rationale: 直前の文法的な流れだけなら「あの子」とも取り得る一方、創世記44章31節を含む文脈は父を指す理解を強く支持する。原文の省略を日本語でも保ち、注で文脈上の理解を示すことで、真正な曖昧さを一方的に解消しないようにした。
translation_notes:
  register: 明瞭で現代的な標準語を用い、ユダがヨセフに語る敬意は「ご主人様」「申し上げました」で表した。引用内は過度に古風にせず、切迫した家族的訴えが自然に伝わる語調とした。
