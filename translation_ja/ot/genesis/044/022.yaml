  to: 私たちはご主人様に申し上げました。「その子は父親のもとを離れることができません。父親のもとを離れれば、死んでしまいます[a]。」
  rationale: 本文の主語省略は原文の解釈上の余地を保つため維持し、指示詞をより中立な「その子」に整えた。脚注は、ヘブライ語に人称表示があることを踏まえつつ、死ぬ者の指示対象が明示的名詞句として特定されず、文脈では父が有力であることを正確に述べるよう改めた。
