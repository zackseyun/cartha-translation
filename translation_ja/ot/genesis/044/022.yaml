    rationale: 「そして彼が父親を離れ、そして死ぬ」は、日本語としては前半の「彼」が後半の「死ぬ」にも自然に係るため、少年が死ぬという読みを強く作ってしまう。一方で脚注は主語が明示されないと説明している。ヘブライ語の動詞には三人称男性単数の人称表示があるが、その指示対象はこの文脈で明示的な名詞句としては示されず、父と理解されることが文脈上有力である、と正確に説明すべきである。
  - severity: low
    issue: 「あの子」の指示詞
    rationale: 原文の定冠詞付きの「少年」を、空間的・談話的な距離を帯びやすい「あの子」とするより、「その子」とするほうが中立で明瞭である。
