  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת אֲשֶׁ֣ר עַל בֵּית/וֹ֮ לֵ/אמֹר֒ מַלֵּ֞א אֶת אַמְתְּחֹ֤ת הָֽ/אֲנָשִׁים֙ אֹ֔כֶל כַּ/אֲשֶׁ֥ר יוּכְל֖וּ/ן שְׂאֵ֑ת וְ/שִׂ֥ים כֶּֽסֶף אִ֖ישׁ בְּ/פִ֥י אַמְתַּחְתּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/001.yaml
  text: Then he commanded the one over his house[a], saying, “Fill the men's sacks with food, as much as they can carry, and put each man's silver in the mouth of his sack.”
translation:
  language: ja
  text: 彼は自分の家の管理者に命じた。「その男たちの袋を、彼らが運べるだけの食料でいっぱいにし、各自の銀をそれぞれの袋の口[a]に入れなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「袋の口」。袋の開口部を指す。
    reason: ヘブライ語の慣用的な身体比喩を本文に残し、その意味を明確にするため。
lexical_decisions:
- source_word: וַיְצַו
  choice: 彼は……命じた
  rationale: 物語を前へ進めるワイイクトール形。日本語では接続語を補わずとも順次性が明確なため、簡潔に訳した。主語はヘブライ語本文どおり文脈上の「彼」とした。
- source_word: אֲשֶׁר עַל־בֵּיתוֹ
  choice: 自分の家を管理する者
  rationale: 直訳的には「彼の家の上にいる者」で、家政を任された管理者を指す。「執事」と役職名を限定せず、職務が分かる表現にした。
- source_word: אַמְתְּחֹת
  choice: 袋
  rationale: 旅の食料や穀物を入れて運ぶ容器。現代日本語で自然かつ文脈に適した「袋」とした。
- source_word: אֹכֶל
  choice: 食料
  rationale: 語自体は穀物に限定されず、食べ物一般を表すため、「穀物」ではなく「食料」とした。
- source_word: כַּאֲשֶׁר יוּכְלוּן שְׂאֵת
  choice: 彼らが運べるだけ
  rationale: יכולת（できる）と נשׂא（担う、運ぶ）の組み合わせを、量的な上限が明確に伝わる自然な日本語にした。
- source_word: כֶּסֶף אִישׁ
  choice: それぞれの銀
  rationale: אִישׁの分配的意味を「それぞれ」で表し、כֶּסֶףは支払いの銀を指すが、本文では過度に説明せず「銀」とした。
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: その人の袋の口
  rationale: ヘブライ語の比喩的な「袋の口」を保持した。各人に対応する所有関係も「その人の」で明示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命令の簡潔さと物語文の品位を保った。「あの人たち」は話者が管理者に彼らを指して命じる場面に自然な表現であり、「兄弟たち」とはせず本文の הָאֲנָשִׁים（男たち／人々）の範囲を保持した。
