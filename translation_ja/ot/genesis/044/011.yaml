  text: וַֽ/יְמַהֲר֗וּ וַ/יּוֹרִ֛דוּ אִ֥ישׁ אֶת אַמְתַּחְתּ֖/וֹ אָ֑רְצָ/ה וַֽ/יִּפְתְּח֖וּ אִ֥ישׁ אַמְתַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/011.yaml
  text: So each man hurried and lowered his sack to the ground[b][a], and each man opened his sack.
translation:
  language: ja
  text: そこで彼らは急いで、それぞれ自分の袋を地面に下ろし、それぞれ自分の袋を開けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֲרוּ
  choice: 彼らは急いで
  rationale: מהר は迅速に行動することを表す。複数形の主語を保ちつつ、現代日本語で自然な「彼らは急いで」とした。
- source_word: וַיּוֹרִדוּ
  choice: 下ろし
  rationale: ירד のヒフィル形で「下へ移す、下ろす」の意。袋を地面へ移す動作を明確に表す。
- source_word: אִישׁ אֶת־אַמְתַּחְתּוֹ
  choice: それぞれ自分の袋を
  rationale: אִישׁ の分配的用法を「それぞれ」で表し、各人が自分の袋を扱ったことを保持した。
- source_word: אַמְתַּחַת
  choice: 袋
  rationale: 穀物や携行品を入れる容器を指す。物語の文脈に合い、現代日本語で広く理解できる。
- source_word: אָרְצָה
  choice: 地面に
  rationale: 方向を示す語形で、ここでは下方の地面への移動を表すため「地面に」とした。
- source_word: וַיִּפְתְּחוּ
  choice: 開けた
  rationale: פתח の基本義をそのまま明瞭に訳した。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準日本語。冒頭の複数動詞と、それに続く אִישׁ の分配性を「彼らは急いで、それぞれ…」で表し、原文で繰り返される「それぞれ」を両方の動作に残した。
