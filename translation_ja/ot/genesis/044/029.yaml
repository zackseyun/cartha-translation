id: GEN.44.29
reference: Genesis 44:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֧ם גַּם אֶת זֶ֛ה מֵ/עִ֥ם פָּנַ֖/י וְ/קָרָ֣/הוּ אָס֑וֹן וְ/הֽוֹרַדְתֶּ֧ם אֶת שֵׂיבָתִ֛/י בְּ/רָעָ֖ה שְׁאֹֽלָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/029.yaml
  text: If you also take this one from me[a], and harm happens to him, then you will bring my gray hair down to Sheol in misery.
translation:
  language: ja
  text: もし、この子までも私のもとから連れて行き、この子に災いが降りかかるなら、あなたがたは、私の白髪を苦しみのうちにシェオル[a]へ下らせることになる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「墓」または「死者の世界（陰府）」とも訳せる。
    reason: שְׁאוֹל の語義には、墓と死者の領域の双方に関連する幅があるため。
lexical_decisions:
- source_word: וּלְקַחְתֶּם גַּם אֶת־זֶה
  choice: もし、この子までも……連れて行き
  rationale: 前後の条件的な流れを日本語の「もし……なら」で明示し、גַּם は、すでに失った子に加えてこの子まで、という意味を「までも」で表した。
- source_word: מֵעִם פָּנַי
  choice: 私のもとから
  rationale: 直訳的には「私の顔／面前から」だが、ヤコブの身近なところから引き離す意味を、自然な現代日本語で表した。
- source_word: וְקָרָהוּ אָסוֹן
  choice: この子に災いが降りかかる
  rationale: קרה の「起こる、降りかかる」と אסון の重大な災難という意味を保ち、何が起こるかを必要以上に限定しなかった。
- source_word: וְהוֹרַדְתֶּם
  choice: あなたがたは……下らせることになる
  rationale: ירד のヒフィル形の使役的意味と、死者の領域へ下るという空間的比喩を保持した。
- source_word: שֵׂיבָתִי
  choice: 私の白髪
  rationale: 老齢の自分を指す換喩だが、物語で反復されるヘブライ語の具体的な「白髪」という像を残した。
- source_word: בְּרָעָה
  choice: 苦しみのうちに
  rationale: ここでは道徳的な悪ではなく、悲嘆や不幸の状態を指すため、「苦しみ」とした。
- source_word: שְׁאֹלָה
  choice: シェオルへ
  rationale: 単なる墓に限定せず、ヘブライ語聖書における死者の領域という概念と、その解釈上の幅を保つため音写した。
theological_decisions:
- issue: שְׁאוֹל の訳し方
  choice: シェオル
  alternative: 墓、死者の世界（陰府）
  rationale: 埋葬場所だけを意味すると断定せず、また後代の教理的な概念を持ち込まないため、本文では原語を音写し、脚注で意味の範囲を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「私の白髪」「下らせる」という原文の比喩を保持した。「この子」は文脈上のベニヤミンを指すが、本文に固有名を補わず、原文の指示表現を残した。
