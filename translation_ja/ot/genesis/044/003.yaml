lexical_decisions:
- source_word: הַבֹּקֶר אוֹר
  choice: 朝になって明るくなると
  rationale: 「朝」と、明るくなることを表す動詞 אוֹר の両方を自然な日本語で表し、夜明けの時を示す時間節とした。
- source_word: וְהָאֲנָשִׁים
  choice: その人たちは
  rationale: 定冠詞付きの複数名詞を、文脈上すでに知られている一行を指す「その人たち」と訳した。
- source_word: שֻׁלְּחוּ
  choice: 送り出された
  rationale: שלח のプアル形が持つ受動の意味を保ち、出発を許されて送り出されたという場面に合う表現とした。
- source_word: הֵמָּה וַחֲמֹרֵיהֶם
  choice: ろばとともに
  rationale: 直訳的には「彼らと彼らのろば」だが、日本語では主語の重複を避けつつ、人々とその所有するろばが一緒に送り出されたことを明確にした。所有関係は文脈上明らかである。
