    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると、…言いました
  rationale: 接続形が物語の次の出来事を進める働きを、自然な現代日本語で表した。
- source_word: אָבִינוּ
  choice: 父は私たちに
  rationale: 話者たちの実父ヤコブを指すため「父」とし、発言の相手が彼らであることを日本語として自然に示した。
- source_word: שֻׁבוּ
  choice: もう一度行って
  rationale: 元の場所へ再び買いに行くよう命じる文脈上の方向性を、自然な日本語で表した。「戻って」も可能だが、父のいる地点へ戻るとの誤読を避けた。
- source_word: שִׁבְרוּ
  choice: 買って来なさい
  rationale: ヨセフ物語で穀物・食料を買うことを表す動詞。日本語では往復を含む依頼として「買って来なさい」が自然である。
- source_word: לָנוּ
  choice: 私たちのために
  rationale: 受益を示す前置詞の意味を明示した。
- source_word: מְעַט
  choice: 少し
  rationale: 少量を表す語の意味を簡潔に保持した。
- source_word: אֹכֶל
  choice: 食べ物
  rationale: 原語は穀物に限定されない一般語なので、文脈から「穀物」と狭めずに訳した。
