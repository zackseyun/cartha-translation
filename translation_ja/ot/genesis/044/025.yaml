  text: Then our father said[a], ‘Go back; buy us a little food.’
translation:
  language: ja
  text: すると、父は私たちに言いました。「もう一度行って、私たちのために少し食べ物を買って来なさい。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
