source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ/רְאוֹת֛/וֹ כִּי אֵ֥ין הַ/נַּ֖עַר וָ/מֵ֑ת וְ/הוֹרִ֨ידוּ עֲבָדֶ֜י/ךָ אֶת שֵׂיבַ֨ת עַבְדְּ/ךָ֥ אָבִ֛י/נוּ בְּ/יָג֖וֹן שְׁאֹֽלָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/031.yaml
  text: then[a], when he sees that the boy is not there, he will die, and your servants will bring down the gray hair of your servant our father to Sheol in sorrow.
translation:
  language: ja
  text: そうなれば、父は、あの子がいないのを見て、死んでしまいます。そして、あなたの僕である私たちは、あなたの僕、私たちの父の白髪を、悲しみのうちにシェオル[a]へ下らせることになります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「墓」または「死者の領域」。ヘブライ語は「シェオル」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: そうなれば
  rationale: 直前の条件を受けて結果を導く表現。ヘブライ語の定型を逐語的にせず、文脈上の帰結を自然な日本語で示した。
- source_word: כִּרְאוֹתוֹ כִּי אֵין הַנַּעַר
  choice: 父は、あの子がいないのを見て
  rationale: 不定詞構文の時間的状況を自然に表現した。אֵיןはここでは不在を表し、「いなくなった」のように死を含意し得る表現を避けた。הַנַּעַרは家族内でのユダの視点を生かして「あの子」とした。
- source_word: וָמֵת
  choice: 死んでしまいます
  rationale: 文脈上の将来的な結果を表す。日本語の「てしまう」により、父の死という悲痛で望ましくない帰結を自然に伝えた。
- source_word: עֲבָדֶיךָ
  choice: あなたの僕である私たち
  rationale: 支配者へのへりくだった自己呼称であり、身分としての奴隷を強調せず、宮廷的な敬意を保つ「僕」とした。
- source_word: שֵׂיבַת עַבְדְּךָ אָבִינוּ
  choice: あなたの僕、私たちの父の白髪
  rationale: 「白髪」を老いた父その人を指す具体的な換喩として保持し、「あなたの僕」と「私たちの父」という二重の呼称も残した。
- source_word: בְּיָגוֹן
  choice: 悲しみのうちに
  rationale: 悲嘆を表す יָגוֹן と前置詞 בְּ の組み合わせを、荘重かつ自然な日本語にした。
- source_word: שְׁאֹלָה
  choice: シェオルへ
  rationale: 単なる墓に限定されない語義の幅を保持し、古代ヘブライ語の概念を性急に解釈しないため音写した。日本語として目的地を示す「へ」を用いた。
theological_decisions:
- issue: שְׁאוֹל の訳し方
  choice: シェオル
  alternative: 墓、死者の領域、よみ
  rationale: この語は埋葬場所だけでなく死者の領域を指し得るため、一つの宇宙観・教理的理解に狭めず、原語の意味の広がりと曖昧さを保った。
translation_notes:
  register: 現代の一般読者に理解できる丁寧で格調ある語調。ユダが高官に語る場面に合わせて敬語を用いながら、ヘブライ語の「白髪を下らせる」という具体的な比喩は保持した。
