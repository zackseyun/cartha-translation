  yaml_path: translation/ot/genesis/044/007.yaml
  text: And they said to him[b][a], “Why does my lord speak words like these? Far be it from your servants to do such a thing.”
translation:
  language: ja
  text: 彼らはその人に言った。「ご主人、なぜこのようなことをおっしゃるのですか。あなたのしもべたちがそのようなことをするなど、決してありえません。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: 彼らはその人に言った
  rationale: 物語の連続を示す定型的な言い回しを簡潔に訳し、אֵלָיוの指示対象を文脈に即して「その人」とした。
- source_word: אֲדֹנִי
  choice: ご主人様
  rationale: 神への呼称ではなく、ヨセフの家の管理者に対する丁重な人間的呼びかけ。現代日本語で敬意と上下関係を自然に表す。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: そのようなこと
  rationale: 直訳は「このような言葉」だが、ここでは発言内容を指す日本語として「そのようなこと」が自然である。
- source_word: חָלִילָה לַעֲבָדֶיךָ
  choice: あなたのしもべたちが……など、決してありえません
  rationale: 強い拒絶を表す間投詞と宮廷的な自己卑下の表現を、荘重さを保ちながら自然な現代日本語にした。
- source_word: כַּדָּבָר הַזֶּה
  choice: そのようなこと
  rationale: 疑われている行為を指し、「そのようなこと」とすることで自然な指示表現とした。
