  text: וַ/יִּגַּ֨שׁ אֵלָ֜י/ו יְהוּדָ֗ה וַ/יֹּאמֶר֮ בִּ֣י אֲדֹנִ/י֒ יְדַבֶּר נָ֨א עַבְדְּ/ךָ֤ דָבָר֙ בְּ/אָזְנֵ֣י אֲדֹנִ֔/י וְ/אַל יִ֥חַר אַפְּ/ךָ֖ בְּ/עַבְדֶּ֑/ךָ כִּ֥י כָמ֖וֹ/ךָ כְּ/פַרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/018.yaml
  text: Then Judah came near to him and said[a], “Please, my lord, let your servant speak a word in my lord’s hearing, and do not let your anger burn against your servant[c][b], for you are like Pharaoh.”
translation:
  language: ja
  text: そこでユダは彼に近づいて言った。「どうか、わが主よ。このしもべが、わが主のお耳に一言申し上げることをお許しください。このしもべに向けて怒りを燃やさないでください[c]。あなたはファラオのような方ですから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 直訳すると、「あなたの怒りがあなたのしもべに対して燃えないように」です。
    reason: ヘブライ語の「怒りが燃える」という比喩を本文で保ちつつ、その構文と比喩的表現を明示するため。
lexical_decisions:
- source_word: וַיִּגַּשׁ אֵלָיו
  choice: 彼に近づいて
  rationale: נגשׁの具体的な接近の動作を保ち、文脈上の指示対象であるヨセフを「彼」で表した。
- source_word: בִּי אֲדֹנִי
  choice: どうか、わが主よ
  rationale: בִּיをへりくだった嘆願として自然な「どうか」とし、אֲדֹנִיの宮廷的な敬称を「わが主」で保った。
- source_word: יְדַבֶּר נָא עַבְדְּךָ דָבָר
  choice: このしもべに一言……入れさせてください
  rationale: 三人称で自称するへりくだりを「このしもべ」によって保持し、דָבָרの単数を自然な日本語の「一言」で表した。
- source_word: בְּאָזְנֵי אֲדֹנִי
  choice: わが主のお耳に入れ
  rationale: 直訳的な「耳に」を生かしつつ、日本語で「聞いていただく」を意味する敬意ある慣用表現とした。
- source_word: וְאַל יִחַר אַפְּךָ בְּעַבְדֶּךָ
  choice: このしもべに対して怒りを燃やさないでください
  rationale: חרה אףの「怒りが燃える」というヘブライ語の比喩を、理解可能な日本語として保持した。
- source_word: כִּי כָמוֹךָ כְּפַרְעֹה
  choice: あなたはファラオのような方なのですから
  rationale: ヨセフの権威と地位をファラオになぞらえる比較を、同一視や完全な同格を過度に含意せず、そのまま残した。
theological_decisions:
- issue: 「あなたはファラオのようだ」という比較の範囲
  choice: 権威・地位についての直接的な比較として訳す
  alternative: 「あなたはファラオに等しい」と訳す
  rationale: 原文の比較表現כמו...כを保持し、政治的権威以上の同一性や絶対的同格を読み込まないため。
translation_notes:
  register: 現代の読者に明瞭でありながら、ユダの切迫したへりくだりと宮廷的な敬意を保つ文体。「わが主」「このしもべ」は反復をあえて残し、発言の正式さを表した。
