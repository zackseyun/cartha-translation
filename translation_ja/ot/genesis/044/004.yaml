  text: הֵ֠ם יָֽצְא֣וּ אֶת הָ/עִיר֮ לֹ֣א הִרְחִיקוּ֒ וְ/יוֹסֵ֤ף אָמַר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ ק֥וּם רְדֹ֖ף אַחֲרֵ֣י הָֽ/אֲנָשִׁ֑ים וְ/הִשַּׂגְתָּ/ם֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם לָ֛/מָּה שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/004.yaml
  text: They had gone out of the city; they had not gone far[a], when Joseph said to the one over his house, “Get up, pursue the men, and when you overtake them, say to them, ‘Why have you repaid evil for good?’”
translation:
  language: ja
  text: 彼らが町を出て、まだ遠くまで行かないうちに、ヨセフは自分の家の管理を任されていた者[a]に言った。「さあ、あの人たちを追いかけなさい。追いついたら、彼らにこう言いなさい。『なぜ、善に対して悪を返したのか。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼の家の上にいる者」。ヨセフの家を管理する者、すなわち家令を指す。
    reason: 原文の直訳的表現と、この人物の役割を示すため。
lexical_decisions:
- source_word: יָצְאוּ אֶת הָעִיר לֹא הִרְחִיקוּ
  choice: 町を出て、まだ遠くまで行かないうちに
  rationale: 町を出た後、さほど距離を置かない時点で次の行動が起きたという物語の時間関係を、自然な現代日本語で表した。
- source_word: לַאֲשֶׁר עַל בֵּיתוֹ
  choice: 家の管理を任せていた者
  rationale: 直訳は「彼の家の上にいる者」で、家政を監督する人物を指す。役職名に限定せず、原文の機能的な意味を明確にした。
- source_word: קוּם רְדֹף אַחֲרֵי
  choice: さあ、あの人たちを追いかけなさい
  rationale: קוּם は行動を促す命令として「さあ」とし、רדף אחרי の追跡の意味を「追いかけなさい」で自然に表した。
- source_word: וְהִשַּׂגְתָּם
  choice: 追いついたら
  rationale: ヒフィル形の「追いつく、到達する」を、後続の発言命令に先立つ条件・時点として簡潔に訳した。
- source_word: שִׁלַּמְתֶּם רָעָה תַּחַת טוֹבָה
  choice: 善に悪をもって報いた
  rationale: שלם の報復・返報の意味と、רעה と טובה の倫理的対照を保った。日本語として格調がありつつ理解しやすい表現である。
