source:
  edition: WLC
  text: הֲ/ל֣וֹא זֶ֗ה אֲשֶׁ֨ר יִשְׁתֶּ֤ה אֲדֹנִ/י֙ בּ֔/וֹ וְ/ה֕וּא נַחֵ֥שׁ יְנַחֵ֖שׁ בּ֑/וֹ הֲרֵעֹתֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/005.yaml
  text: Is this not the one from which my master drinks and by which he indeed practices divination? You have done evil in doing this[a][b].
translation:
  language: ja
  text: これは、私の主人がこの杯で飲む時に使い、またこれを使って必ず占いをする杯ではないか。こんなことをするとは、あなたがたは悪いことをしたものだ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「あなたがたは、自分たちのしたことで悪を行った」。
    reason: previous_rendering
lexical_decisions:
- source_word: הֲלֹא זֶה
  choice: これは…杯ではないか
  rationale: 同意を期待する修辞疑問として自然な現代日本語にした。「杯」は直前の文脈で指示対象が明白であり、日本語では補うことで読みやすくなる。
- source_word: אֲשֶׁר יִשְׁתֶּה אֲדֹנִי בּוֹ
  choice: 私の主人がこれで飲み
  rationale: בּוֹ は飲むために用いる器を指す。「私の主人」は使用人がヨセフを指す社会的な敬称を表し、神学的な含意を避ける。
- source_word: נַחֵשׁ יְנַחֵשׁ בּוֹ
  choice: これを使って必ず占いをする
  rationale: ピエル形の נחש を「占いをする」とし、前置詞句を道具の意味で訳した。不定詞絶対形と定動詞の組み合わせによる強意を「必ず」で示した。
- source_word: הֲרֵעֹתֶם אֲשֶׁר עֲשִׂיתֶם
  choice: こんなことをするとは、あなたがたは悪いことをしたものだ
  rationale: 原文の道徳的な重みを「悪いこと」で保ちつつ、同じ動詞を重ねるヘブライ語的表現を自然な日本語に整えた。
theological_decisions:
- issue: ヨセフが実際に占いを行っていたと断定するか、それとも偽装や試みの一部と見るか
  choice: 使用人の発言内の主張として「占いをする」と直接訳す
  alternative: 「これで占うことができる」または、世評にすぎないことを示すように弱める
  rationale: ヘブライ語の発言は占いを明言している。翻訳では、ヨセフの実際の信仰や行動について調和的な解釈を加えず、物語中の発言をそのまま提示する。
- issue: 不定詞絶対形 נַחֵשׁ と定動詞 יְנַחֵשׁ の強意
  choice: 「必ず占いをする」
  alternative: 単に「占いをする」、または「巧みに占う」
  rationale: この構文の強意を明示しつつ、能力、頻度、巧妙さなど原文が特定しない意味を加えない。
translation_notes:
  register: 明瞭で現代的だが、物語の緊張感と使用人の非難の重みを保つ文体。「ではないか」「したものだ」により、修辞疑問と叱責の調子を表した。
