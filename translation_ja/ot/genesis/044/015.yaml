  text: וַ/יֹּ֤אמֶר לָ/הֶם֙ יוֹסֵ֔ף מָֽה הַ/מַּעֲשֶׂ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר עֲשִׂיתֶ֑ם הֲ/ל֣וֹא יְדַעְתֶּ֔ם כִּֽי נַחֵ֧שׁ יְנַחֵ֛שׁ אִ֖ישׁ אֲשֶׁ֥ר כָּמֹֽ/נִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/015.yaml
  text: And Joseph said to them[a], “What is this deed that you have done? Did you not know that a man like me indeed practices divination?”
translation:
  language: ja
  text: ヨセフは彼らに言った。「あなたがたは、いったい何をしたのか。私のような者が必ず占いをすることを知らなかったのか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「必ず占う」、または「占いによって必ず突き止める」とも訳せる。ヘブライ語では、占いを表す動詞が強意形で重ねて用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה הַמַּעֲשֶׂה הַזֶּה אֲשֶׁר עֲשִׂיתֶם
  choice: あなたがたは、なんということをしたのか
  rationale: 直訳的な「あなたがたがしたこの行為は何か」の非難の力を保ちつつ、現代日本語の自然な叱責表現とした。
- source_word: הֲלוֹא יְדַעְתֶּם
  choice: 知らなかったのか
  rationale: 肯定の答えを予期する否定疑問の修辞的な響きを保持した。
- source_word: נַחֵשׁ יְנַחֵשׁ
  choice: 必ず占いをする
  rationale: 語根נחשの意味を明示し、不定詞絶対形と定動詞の重複による強意を「必ず」で表した。能力だけに限定せず、発言を率直な主張として訳した。
- source_word: אִישׁ אֲשֶׁר כָּמֹנִי
  choice: 私のような者
  rationale: 「私のような男」より日本語として自然で威厳があり、身分ある人物としてのヨセフの自己言及を伝える。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で定着した人名表記を用いた。
theological_decisions:
- issue: ヨセフの占いに関する発言を、実際の行為の主張として訳すか、策略や見せかけと解釈して弱めるか
  choice: 本文では「必ず占いをする」と直接的に訳す
  alternative: 「そのようなことを必ず見抜く」「占いによって必ず突き止める」
  rationale: ヘブライ語は占いを表す語根נחשを明示的かつ強意的に用いる。ヨセフが実際に占いをしたのか、エジプト高官としての役柄を演じているのかを本文はここで説明しないため、その緊張を解消しない。
translation_notes:
  register: 明瞭な現代標準日本語。ヨセフの厳しい詰問の調子を保ち、「占い」という原文の明示的な語を弱めずに訳した。脚注標識[a]は該当文末に置いた。
