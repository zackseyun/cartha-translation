base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/030.yaml
  text: Now[a], when I come to your servant my father[b], and the boy is not with us—his life being bound up with the boy’s life—
translation:
  language: ja
  text: 今、私があなたのしもべである私の父のもとに帰ったとき、あの子が私たちと一緒にいなければ――父の命はあの子の命と固く結ばれていて――[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「そして、彼のネフェシュは彼のネフェシュに結びついていて」。ヘブライ語は父とあの子の双方についてנֶפֶשׁ（ネフェシュ、「命、魂、自身」）を用いており、二つ目の「彼」は文脈上ベニヤミンを指す。
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: 今
  rationale: ユダの訴えが次の局面へ進むことを示す談話標識として、接続辞の働きを自然な日本語の流れに含めた。
- source_word: כְּבֹאִי
  choice: 私が…帰ったとき
  rationale: 前置詞כְּと一人称単数接尾辞を伴う不定詞連語の時を表す用法を反映した。父のもとへ戻る場面なので、日本語では「来た」より「帰った」が自然。
- source_word: אֶל־עַבְדְּךָ אָבִי
  choice: あなたのしもべである父のもとに
  rationale: ヨセフへの敬意を示す「あなたのしもべ」と、それが話者の父であることを表す同格関係を明確にした。
- source_word: הַנַּעַר
  choice: あの子
  rationale: בנימיןは幼児ではないが、ここでは父との関係とユダの情緒的な語り口が前面に出るため、「青年」より「あの子」が文脈に適する。
- source_word: אֵינֶנּוּ אִתָּנוּ
  choice: 私たちと一緒にいなければ
  rationale: 存在否定を平明に訳し、後続節へ続く未完の条件構文として日本語を整えた。
- source_word: וְנַפְשׁוֹ
  choice: 父の命
  rationale: נֶפֶשׁはここで父の生命・存在そのものを指し、専門的な意味での「魂」に限定されない。代名詞の指示対象を明示した。
- source_word: קְשׁוּרָה בְנַפְשׁוֹ
  choice: あの子の命と固く結ばれている
  rationale: 受動分詞が表す継続的で強い結びつきを自然な日本語で表した。二つ目の接尾辞は文脈上ベニヤミンを指すため「あの子」と明示した。
theological_decisions:
- issue: וְנַפְשׁוֹ קְשׁוּרָה בְנַפְשׁוֹ の前節に対する関係
  choice: 「…のですから」と背景・理由を示す挿入節として訳す
  alternative: 単に「そして父の命は…」と並列する
  rationale: 接続詞וְと分詞節は状況説明として読むことができ、父にとって少年の不在が重大である理由を文脈上示す。ただし明示的な因果接続詞ではないため、脚注でより直訳的な形を示した。
translation_notes:
  register: ユダがヨセフにへりくだって訴える場面にふさわしい、明瞭で品位ある現代標準日本語。「しもべ」は古風さを残す聖書的敬語だが、関係性を簡潔に示すため保持した。本文は次節へ続く未完の条件文であるため、末尾を長音ダッシュで開いた形にした。
