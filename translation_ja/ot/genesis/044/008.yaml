source:
  edition: WLC
  text: הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֨אנוּ֙ בְּ/פִ֣י אַמְתְּחֹתֵ֔י/נוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖י/ךָ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/אֵ֗יךְ נִגְנֹב֙ מִ/בֵּ֣ית אֲדֹנֶ֔י/ךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/008.yaml
  text: Look[a], the silver that we found in the mouths of our sacks we brought back to you from the land of Canaan. So how could we steal silver or gold from your master's house?
translation:
  language: ja
  text: ご覧ください。私たちは、袋の口[a]に入っていた銀を見つけ、カナンの地からあなたのもとへ持ち帰りました。それなのに、どうしてご主人の家から銀や金を盗むことなどできるでしょうか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「袋の口」。袋の開口部、つまり上部を指す表現。
    reason: cultural_note
lexical_decisions:
- source_word: הֵן
  choice: ご覧ください
  rationale: 相手の注意を引き、自分たちの行動を根拠として訴える談話標識。現代日本語で自然さと丁重さを保つ。
- source_word: כֶּסֶף
  choice: 銀
  rationale: 文脈上は貨幣を指すが、原語の具体的表現を保ち、後半の「銀や金」との対応も明確にする。
- source_word: בְּפִי אַמְתְּחֹתֵינוּ
  choice: 袋の口[a]で
  rationale: 容器の開口部を「口」と呼ぶヘブライ語の具体的な比喩を、日本語でも理解可能な形で保持する。
- source_word: הֱשִׁיבֹנוּ אֵלֶיךָ
  choice: あなたのもとへ持ち帰った
  rationale: 使役形の「戻らせる」を、銀を返しに来たという文脈に即して自然に表す。
- source_word: מֵאֶרֶץ כְּנָעַן
  choice: カナンの地から
  rationale: 地理的表現を簡潔かつ格調ある標準的な形で訳す。
- source_word: וְאֵיךְ נִגְנֹב
  choice: それなのに、どうして…盗むことなどできるでしょうか
  rationale: 前文を根拠とする反語的・推論的な力を明示し、自分たちが盗むはずがないという訴えを自然な日本語で表す。
- source_word: מִבֵּית אֲדֹנֶיךָ
  choice: ご主人の家から
  rationale: אדוןは神的称号ではなく、執事に対するヨセフの社会的立場を指すため「ご主人」とする。「家」は建物または家産を含み得る原文の表現を保持する。
- source_word: כֶּסֶף אוֹ זָהָב
  choice: 銀や金
  rationale: 原文の具体的な対句を保持し、前半の「銀」と呼応させる。日本語の否定的反語では「や」が自然。
