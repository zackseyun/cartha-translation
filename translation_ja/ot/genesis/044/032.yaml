  text: כִּ֤י עַבְדְּ/ךָ֙ עָרַ֣ב אֶת הַ/נַּ֔עַר מֵ/עִ֥ם אָבִ֖/י לֵ/אמֹ֑ר אִם לֹ֤א אֲבִיאֶ֨/נּוּ֙ אֵלֶ֔י/ךָ וְ/חָטָ֥אתִי לְ/אָבִ֖/י כָּל הַ/יָּמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/044/032.yaml
  text: For your servant became surety for the boy to my father[a], saying, ‘If I do not bring him to you[b], then I will bear the blame before my father all my days.’
translation:
  language: ja
  text: 実は、あなたのしもべは、この子の保証人となることを父に約束し[a]、『もし私がこの子をあなたのもとに連れ帰らなければ、私は生涯、父に対して罪を犯すことになります[b]』と申しました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この子について父に保証をした」「この子の身元を引き受けた」。ヘブライ語の動詞は、保証人として責任を引き受けることを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「私は父に対して、すべての日々、罪を犯すことになります」。この文脈では、父に対して生涯にわたり罪責または責任を負うことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: （文脈上、理由を示す接続を文全体に織り込む）
  rationale: ユダが身代わりを願う理由を説明する節である。日本語では独立した「なぜなら」を置くより、直前とのつながりの中で自然に理由説明として読める形にした。
- source_word: עַבְדְּךָ
  choice: あなたのしもべ
  rationale: 目上の相手に対するユダのへりくだった自称。奴隷という身分をここで必要以上に強調せず、宮廷的な敬意を保つ。
- source_word: עָרַב אֶת הַנַּעַר
  choice: この子について父に責任を負うと約束し
  rationale: 動詞は保証人として責任を引き受けることを表す。現代日本語で意味が明瞭になるよう「責任を負うと約束する」とした。
- source_word: הַנַּעַר
  choice: この子
  rationale: 文脈上ベニヤミンを指す。実年齢を幼児に限定せず、父との家族関係に即した自然な呼称とした。
- source_word: מֵעִם אָבִי
  choice: 父に
  rationale: 保証責任を引き受けた相手が父であることを示す。ヘブライ語の前置詞を直訳的に再現せず、עָרַבとの結びつきを日本語で明示した。
- source_word: לֵאמֹר
  choice: と申しました
  rationale: 誓約内容を導入する引用表現。ヨセフへの敬語的発話に合わせた。
- source_word: אִם לֹא אֲבִיאֶנּוּ אֵלֶיךָ
  choice: もし私がこの子をあなたのもとに連れ帰らなければ
  rationale: 条件文を明瞭に訳した。父のもとへ戻す場面なので、日本語では「連れ帰る」が自然である。
- source_word: וְחָטָאתִי לְאָבִי
  choice: 私は生涯、父に対して罪を負います
  rationale: חטאの「罪を犯す／罪責を負う」という語義を保ち、単なる非難より強い原文の表現を残した。「父に対して」はלְの関係的な幅を保つ。
- source_word: כָּל הַיָּמִים
  choice: 生涯
  rationale: 直訳は「すべての日々」だが、ここでは一生続く罪責を表す自然な日本語とした。
theological_decisions:
- issue: וְחָטָאתִי の罪・責任の表現
  choice: 罪を負います
  alternative: 責めを負います／罪を犯したことになります
  rationale: この文脈には保証責任への違反という意味がある一方、原語חטאの倫理的・関係的な「罪」の響きを消さないため、「罪を負う」とした。
translation_notes:
  register: 明瞭な現代標準語を用いながら、ユダがヨセフに語るへりくだった調子を「あなたのしもべ」「申しました」で保持した。誓約の法的・関係的な重みと、חטאが持つ「罪」の緊張を残している。
