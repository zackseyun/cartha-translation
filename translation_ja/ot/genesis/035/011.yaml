revisions:
- from: 神は彼に言われた。「わたしは全能の神[a]である。子を生み、数を増せ。一つの国民と諸国民の集まり[b]が、あなたから生まれる。また、王たちがあなたの腰から出る[c]。」
  to: 神は彼に言われた。「わたしは全能の神[a]である。子をもうけ、増え広がれ。一つの民と諸国民の集まり[b]が、あなたから生まれる。また、あなたの身から王たちが出る[c]。」
  rationale: 原文の命令形がヤコブへの呼びかけである点を自然な日本語で表し、子孫の増加という定型句の意味を明瞭にした。「国民」を「民」に改めて、現代日本語における語義のずれを避けた。最後の身体的系譜表現は、原文の具体性を保ちつつ日本語として理解できる「身から」とし、脚注でその意味を明示した。
