id: GEN.35.11
reference: Genesis 35:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ ל֨/וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּ/רְבֵ֔ה גּ֛וֹי וּ/קְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑/ךָּ וּ/מְלָכִ֖ים מֵ/חֲלָצֶ֥י/ךָ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/011.yaml
  text: And God said to him[a], “I am God Almighty. Be fruitful and multiply. A nation and an assembly of nations shall come from you[c][b], and kings shall come from your loins.”
translation:
  language: ja
  text: 神は彼に言われた。「わたしは全能の神[a]である。子をもうけ、増え広がれ。一つの民と諸国民の集まり[b]が、あなたから生まれる。また、あなたの身から王たちが出る[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「エル・シャダイ」。伝統的に「全能の神」と訳されるが、「シャダイ」の語源と厳密な意味については諸説がある。
    reason: lexical_alternative
  - marker: b
    text: 「諸国民の集まり」は、「諸国民の群れ」または「諸国民の会衆」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「あなたの身から王たちが出る」は、自分の体から生まれる実の子孫を表すヘブライ語の言い回し。
    reason: cultural_note
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数の動詞と物語の文脈から、イスラエルの神を指す単数の神称として訳した。
- source_word: אֵל שַׁדַּי
  choice: 全能の神
  rationale: 神の称号として意味を訳し、伝統的で理解しやすい日本語を用いた。ただし原語の意味には議論があるため脚注に音写を示した。
- source_word: פְּרֵה וּרְבֵה
  choice: 子を生み、数を増せ
  rationale: 二つの男性単数命令形を、族長への子孫の祝福という文脈に即して、現代日本語で明確に表した。
- source_word: גּוֹי
  choice: 一つの国民
  rationale: ここでは子孫から形成される一つの民・国家を指すため、「国民」とした。単数であることも「一つの」で明示した。
- source_word: קְהַל גּוֹיִם
  choice: 諸国民の集まり
  rationale: קהל の集合・会衆という意味を保ちつつ、現代の読者に分かりやすい表現とした。「群れ」「会衆」などの可能性は脚注で補った。
- source_word: יִהְיֶה מִמֶּךָּ
  choice: あなたから生まれる
  rationale: 字義的には「あなたから存在する／あなたから出る」だが、文脈上の系譜的な起源を自然な日本語で表した。
- source_word: מְלָכִים
  choice: 王たち
  rationale: 複数形をそのまま明確に訳した。
- source_word: מֵחֲלָצֶיךָ יֵצֵאוּ
  choice: あなたの腰から出る
  rationale: 身体から出る実の子孫という具体的な系譜表現を保持した。日本語では説明が必要なため脚注を付した。
theological_decisions:
- issue: 神の称号 אֵל שַׁדַּי の訳し方
  choice: 全能の神
  alternative: エル・シャダイ
  rationale: 称号の意味を伝える伝統的な訳を本文に採用した一方、語源と厳密な意味が確定しているかのようには扱わず、原語形を脚注に残した。
- issue: 子孫の約束における身体的表現
  choice: 王たちがあなたの腰から出る
  alternative: あなたから王たちが生まれる
  rationale: より滑らかな言い換えだけにせず、ヤコブ自身の身体から続く血統を示す原文の具体性を本文に保持した。
- issue: גּוֹי וּקְהַל גּוֹיִם の関係
  choice: 一つの国民と諸国民の集まり
  alternative: 一つの民と諸民族の群れ
  rationale: 単数の国民と複数の国民から成る集合を並べる原文の緊張を解消せず、そのまま区別して表した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の宣言と族長への約束にふさわしい簡潔で荘重な文体とした。「言われた」「である」「増せ」によって格調を保ち、難解な古語は避けた。
