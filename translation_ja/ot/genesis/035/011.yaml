    issue: 「子を生み、数を増せ」
    rationale: 原文は男性単数のヤコブへの命令であり、日本語の「子を生む」は通常、出産する女性に用いる。また「数を増せ」は何の数かがやや不明瞭である。子孫の増加を表す定型句として「子をもうけ、増え広がれ」とするのが自然である。
  - severity: low
    issue: 「一つの国民」
    rationale: 「国民」は現代日本語で一国家の人民・市民を指す用法が強い。原文の גּוֹי はここでは子孫から成る民・民族を指すため、「一つの民」が明瞭である。
  - severity: medium
    issue: 「あなたの腰から出る」
    rationale: ヘブライ語の「腰／腰部」は子孫の身体的起源をいう慣用句だが、日本語の「腰から出る」は不自然で意味を取りにくい。「あなたの身から王たちが出る」とし、脚注で実の子孫をいう表現であることを示すのが適切である。
