source:
  edition: WLC
  text: וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ וַ/יִּקְרָא֙ לַ/מָּק֔וֹם אֵ֖ל בֵּֽית אֵ֑ל כִּ֣י שָׁ֗ם נִגְל֤וּ אֵלָי/ו֙ הָֽ/אֱלֹהִ֔ים בְּ/בָרְח֖/וֹ מִ/פְּנֵ֥י אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/007.yaml
  text: There he built an altar and called the place El-bethel[a], because there God had revealed himself to him when he fled from his brother.
translation:
  language: ja
  text: そこで彼は祭壇を築き、その場所をエル・ベテル[a]と名づけた。彼が兄から逃げたとき、そこで神が彼に現れたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エル・ベテル」は、おそらく「ベテルの神」という意味。
    reason: 固有名の背後にある有力な語義を示すため。
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: そこで彼は祭壇を築き
  rationale: 物語を進める動詞と場所の副詞を、自然な現代日本語の語順で表した。מִזְבֵּחַは通常どおり「祭壇」とした。
- source_word: וַיִּקְרָא לַמָּקוֹם
  choice: その場所を…と名づけた
  rationale: קרא + לְがこの文脈では命名を表すため、日本語として明確な「名づけた」とした。
- source_word: אֵל בֵּית אֵל
  choice: エル・ベテル
  rationale: ヤコブがその場所につけた名として音写し、推定される意味は脚注に示した。
- source_word: כִּי
  choice: …からである
  rationale: 命名の理由を導く接続表現として、因果関係を明瞭にした。
- source_word: נִגְלוּ אֵלָיו הָאֱלֹהִים
  choice: 神が彼にご自身を現された
  rationale: נִגְלוּはニファル形で、ここでは神の自己顕現を表す。「現れた」も可能だが、「ご自身を現された」は自己開示の含意を保つ。形態上は複数形でも、文脈上の指示対象はイスラエルの神である。
- source_word: בְּבָרְחוֹ מִפְּנֵי אָחִיו
  choice: 彼が兄から逃げたとき
  rationale: 不定詞構文の時間的意味と、מִפְּנֵיの逃避を表す用法を自然な日本語にした。
theological_decisions:
- issue: 複数形のאֱלֹהִיםと複数動詞נִגְלוּがイスラエルの神を指すこと
  choice: 「神が彼にご自身を現された」と単数の指示対象として訳す
  alternative: 「神が彼に現れた」、または形態を反映した複数表現
  rationale: 文脈はベテルでヤコブに現れた一人の神を指しており、日本語で複数にすると多神教的な意味を不当に生じさせる。複数形という形態上の特徴から特定の神学を導入せず、文脈上の指示を優先した。
- issue: אֵל בֵּית אֵלを翻訳するか音写するか
  choice: 本文では場所の名として「エル・ベテル」と音写する
  alternative: 「ベテルの神」
  rationale: この句はヤコブによる命名として機能するため、本文では固有名を保った。その語義として有力な「ベテルの神」は脚注で示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」の反復を本文内で保ち、ヘブライ語の場所との結びつきを伝えた。神への敬意を自然に表すため「ご自身」を用いた。
