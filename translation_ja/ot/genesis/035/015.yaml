  text: וַ/יִּקְרָ֨א יַעֲקֹ֜ב אֶת שֵׁ֣ם הַ/מָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥/וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/015.yaml
  text: And Jacob called the name of the place where God had spoken with him there[b][a], Bethel.
translation:
  language: ja
  text: ヤコブは、神がそこでヤコブと語った場所を、ベテル[a]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ベテル」は「神の家」という意味。
    reason: 地名のヘブライ語での意味を示すため。
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶת שֵׁם
  choice: 名づけた
  rationale: 「名を呼ぶ」というヘブライ語の命名表現を、意味を保ちながら自然な現代日本語にした。
- source_word: הַמָּקוֹם
  choice: 場所
  rationale: 定冠詞を伴う語を、文脈上特定された「場所」として簡潔に訳した。
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ שָׁם אֱלֹהִים
  choice: 神がそこで自分と語られた
  rationale: שָׁם を「そこで」と明示し、דִּבֶּר אִתּוֹ の相互的な響きを「自分と語られた」で表した。「自分」は主節の主語ヤコブを指す。神への敬意を自然な尊敬表現で示した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 文脈と単数の動詞が示すとおり、ヤコブに語った唯一の神を指すため単数で訳した。
- source_word: בֵּית אֵל
  choice: ベテル
  rationale: 地名として日本語聖書で広く定着した音写を採用し、語義は脚注で示した。
theological_decisions:
- issue: אֱלֹהִים の数の理解
  choice: 神
  alternative: 神々
  rationale: 形は複数形だが、単数形の動詞 דִּבֶּר と物語の文脈により、ここでは単数の神を指す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「名を呼んだ」という原語の慣用句は、日本語として自然な「名づけた」とした。原文の「そこで」は省略せず保持した。
