  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ אֱלֹהִ֖ים שִׁמְ/ךָ֣ יַעֲקֹ֑ב לֹֽא יִקָּרֵא֩ שִׁמְ/ךָ֨ ע֜וֹד יַעֲקֹ֗ב כִּ֤י אִם יִשְׂרָאֵל֙ יִהְיֶ֣ה שְׁמֶ֔/ךָ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/010.yaml
  text: And God said to him[a], “Your name is Jacob. Your name will no longer be called Jacob, but Israel will be your name.” So he called his name Israel.
translation:
  language: ja
  text: 神は彼に言った。「あなたの名はヤコブである。あなたの名は、もはやヤコブとは呼ばれない。あなたの名はイスラエルとなる。」そして神は彼をイスラエルと名づけた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「彼の名をイスラエルと呼んだ」。また、「彼をイスラエルと呼んだ」とも訳せる。
    reason: 原文の「名を呼ぶ」という命名定型句を示しつつ、本文では自然な日本語の命名表現を用いるため。
lexical_decisions:
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数形の動詞とともに用いられ、ここでは唯一の神を指すため、現代日本語の標準的な訳語とした。
- source_word: שִׁמְךָ יַעֲקֹב
  choice: あなたの名はヤコブである
  rationale: 名を確認した上で改名を宣言する原文の構造を、簡潔で自然な日本語で保った。
- source_word: לֹא יִקָּרֵא ... עוֹד
  choice: もう…とは呼ばれず
  rationale: 否定辞と「なお、さらに」を表す עוֹד の組み合わせが示す「もはや～ない」という意味を、自然な現代日本語で表した。
- source_word: כִּי אִם
  choice: だが…イスラエルと
  rationale: 「ヤコブではなくイスラエル」という対照と置き換えを明確に示した。
- source_word: יִשְׂרָאֵל יִהְיֶה שְׁמֶךָ
  choice: イスラエルと呼ばれる
  rationale: 直訳は「イスラエルがあなたの名となる」だが、直前の受動表現と結び合わせ、改名宣言として自然にした。新しい名イスラエルへの焦点は保持している。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ יִשְׂרָאֵל
  choice: こうして神は彼をイスラエルと名づけた
  rationale: 字義的には「彼の名をイスラエルと呼んだ」という命名定型句である。日本語では「彼をイスラエルと名づけた」が同じ行為を最も自然かつ明確に表す。
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: ヤコブ／イスラエル
  rationale: 日本語聖書で広く定着している人名表記を用いた。
theological_decisions:
- issue: 旧名ヤコブが以後の物語でも使われる一方、ここでは改名が絶対的な形で宣言されること
  choice: あなたはもうヤコブとは呼ばれず、イスラエルと呼ばれる
  alternative: これからは主にイスラエルと呼ばれる
  rationale: 原文の強い改名宣言を弱めず、後の「ヤコブ」という用例との緊張を説明的な語句で解消しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、改名宣言の荘重さは保ちつつ、古風な「～であろう」「～と称せられる」は避けた。神の発話には過度な敬語を加えず、物語文として端正な文体に整えた。
