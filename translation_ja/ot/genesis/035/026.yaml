  text: וּ/בְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְ/אָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד ל֖/וֹ בְּ/פַדַּ֥ן אֲרָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/026.yaml
  text: 'And the sons of Zilpah[a], Leah’s servant: Gad and Asher[b]. These are the sons of Jacob who were born to him in Paddan-aram.'
translation:
  language: ja
  text: また、レアの女奴隷[a]であるジルパの息子たちは、ガドとアシェルである。以上が、パダン・アラムでヤコブに生まれた息子たちである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女奴隷」に当たるヘブライ語は、文脈によって「女召使い」「仕え女」とも訳せるが、隷属的な身分を表す語である。
    reason: lexical_alternative
  - marker: b
    text: ただし、ベニヤミンは後にカナンで生まれたと記されている（16～18節）。そのため、この一覧をパダン・アラム時代の家族についての概括と見ることもできるが、原文自体にはベニヤミンを明示的に除外する限定はない。
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: また、……の息子たちは
  rationale: 接続詞 וּ を「また」とし、בְנֵי の男性複数を系譜の文脈に即して「息子たち」と訳した。
- source_word: זִלְפָּה
  choice: ジルパ
  rationale: 人名を日本語聖書で広く用いられる形に音写した。
- source_word: שִׁפְחַת לֵאָה
  choice: レアの女奴隷
  rationale: שִׁפְחָה が示す女性であることと隷属的な社会的身分を明示した。「女召使い」も可能だが、身分の厳しさを弱めるおそれがあるため本文では「女奴隷」とした。
- source_word: גָּד וְאָשֵׁר
  choice: ガドとアシェル
  rationale: 接続関係を保ち、人名を標準的な日本語表記で音写した。
- source_word: אֵלֶּה בְּנֵי יַעֲקֹב
  choice: 以上が、……ヤコブに……息子たちである
  rationale: אֵלֶּה の一覧を受ける要約機能を、自然な日本語の「以上が」で表した。בְּנֵי は具体的に「息子たち」とした。
- source_word: אֲשֶׁר יֻלַּד לוֹ
  choice: ヤコブに生まれた
  rationale: 受動形と לוֹ を保ち、母親を明示せず、ヤコブの側から述べる原文の視点を自然な日本語にした。
- source_word: בְּפַדַּן אֲרָם
  choice: パダン・アラムで
  rationale: 地名として音写し、日本語で複合地名を読みやすくする中黒を用いた。
theological_decisions:
- issue: 「パダン・アラムで生まれた」という総括と、ベニヤミンがカナンで生まれたという35章16–18節との関係
  choice: 本文の包括的な言い方をそのまま保ち、脚注で文脈上の緊張を示す
  alternative: この場所句をベニヤミン以外に限定するよう本文を補足する
  rationale: 原文は限定を明示していないため、本文で調和的な解釈を加えず、読者が認識できるよう脚注で問題を示した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、系譜の簡潔で格調ある調子を保った。「女奴隷」は強い語感を伴うが、原語が示す社会的身分を曖昧にしないため採用し、別訳を脚注に示した。
