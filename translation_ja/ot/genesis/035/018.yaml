source:
  edition: WLC
  text: וַ/יְהִ֞י בְּ/צֵ֤את נַפְשָׁ/הּ֙ כִּ֣י מֵ֔תָה וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן אוֹנִ֑י וְ/אָבִ֖י/ו קָֽרָא ל֥/וֹ בִנְיָמִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/018.yaml
  text: And as her life was departing—for she was dying—she called his name Ben-oni[b][a]; but his father called him Benjamin.
translation:
  language: ja
  text: 彼女の命が尽きようとしていたとき――彼女は死にかけていたのである――、彼女はその子をベン・オニ[a]と名づけた。しかし、父は彼をベニヤミン[b]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ベン・オニ」は、「私の悲しみの子」または「私の苦しみの子」という意味と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「ベニヤミン」は、「右手の子」という意味と考えられる。「南の子」と理解する見方もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצֵאת נַפְשָׁהּ
  choice: 彼女の命が去ろうとしていたとき
  rationale: נֶפֶשׁはここでは人の「命」、すなわち生きている状態を指しうる。日本語の「魂」とすると、肉体から離れる非物質的実体について原文以上に限定した理解を招きうるため、「命」とした。ב＋不定詞は時間を表す表現として訳した。
- source_word: כִּי מֵתָה
  choice: 彼女は死にかけていたのである
  rationale: כִּיを先行表現への説明として捉え、物語の同時進行性を自然に示した。完了形は「死んだ」とも訳せるが、命名が死の間際に行われる文脈を踏まえ、「死にかけていた」とした。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: 彼女はその子を…と名づけた
  rationale: ヘブライ語の直訳的な「彼の名を呼んだ」よりも、命名を表す現代日本語として明瞭で自然な表現を採用した。
- source_word: בֶּן אוֹנִי
  choice: ベン・オニ
  rationale: 固有名として音写し、物語上重要な語義は脚注に示した。表記上、中点を用いて二要素から成る名であることを読み取りやすくした。
- source_word: וְאָבִיו קָרָא לוֹ
  choice: しかし、父は彼を…と名づけた
  rationale: 接続詞וְは、母の命名と父の命名の対照を文脈上明示する「しかし」とした。「彼の父」は日本語では「父」で十分明瞭である。
- source_word: בִנְיָמִין
  choice: ベニヤミン
  rationale: 日本語聖書で広く認識される固有名の音写を用い、語源上の複数の可能性は脚注に残した。
theological_decisions:
- issue: 死の文脈におけるנֶפֶשׁの人間論的意味
  choice: 本文では「魂」ではなく「命」と訳す
  alternative: 「彼女の魂が出て行くとき」
  rationale: נֶפֶשׁは生きた人そのもの、または命を指しうる。この節だけで霊魂と身体の関係について技術的な主張を確定せず、死の場面における自然な叙述として訳した。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、臨終の場面にふさわしい落ち着いた格調を保った。原文の反復的な説明はダッシュで挿入し、命名の対照は「しかし」で明示した。固有名の語義は本文に織り込まず、脚注で曖昧さを保持した。
