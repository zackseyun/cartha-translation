  text: וַ/יִּגְוַ֨ע יִצְחָ֤ק וַ/יָּ֨מָת֙ וַ/יֵּאָ֣סֶף אֶל עַמָּ֔י/ו זָקֵ֖ן וּ/שְׂבַ֣ע יָמִ֑ים וַ/יִּקְבְּר֣וּ אֹת֔/וֹ עֵשָׂ֥ו וְ/יַעֲקֹ֖ב בָּנָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/029.yaml
  text: Then Isaac breathed his last and died[a], and was gathered to his people, old and full of days. And Esau and Jacob, his sons, buried him.
translation:
  language: ja
  text: こうしてイサクは息を引き取り、死に、自分の民に集められた[a]。彼は年老い、長寿を全うしていた。息子たちのエサウとヤコブが彼を葬った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その同族（先祖）のもとに集められた」。ヘブライ語では死についての定型表現で、単なる埋葬以上のことを含意している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: 息を引き取り
  rationale: 死の告知で用いられるגועを自然な現代日本語で表し、続く「死んで」との区別も保つ。
- source_word: וַיָּמָת
  choice: 死んで
  rationale: מותの基本的な意味を簡潔に訳し、ヘブライ語の動作の連なりを保つ。
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: その民のもとに加えられた
  rationale: 定型的な死の表現を直訳調で残し、埋葬、祖先との合流、死後の状態のいずれかに限定しない。「民」はעַמָּיוとの語彙的対応を保つ。
- source_word: זָקֵן
  choice: 年老い
  rationale: 高齢であったことを、明瞭で自然な日本語で表す。
- source_word: וּשְׂבַע יָמִים
  choice: 日々に満ちていた
  rationale: 族長の死の記事に見られる慣用表現の文学的な響きを保ち、単なる「高齢」に平板化しない。
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 彼を葬った
  rationale: קברの意味を明瞭かつ品位ある現代日本語で表す。
- source_word: עֵשָׂו וְיַעֲקֹב בָּנָיו
  choice: 息子たちのエサウとヤコブ
  rationale: 二人がイサクの息子であることを自然な日本語の語順で明示する。
theological_decisions:
- issue: 「その民のもとに加えられた」という死の定型句の意味
  choice: 定型句を字義に近く残し、その意味を特定しない。
  alternative: 一族の墓への埋葬、祖先との死後の再会、または「先祖の列に加えられた」と解釈的に訳す。
  rationale: この句は物理的な埋葬だけでは説明しきれない可能性がある一方、死後の状態を明示してはいないため、原文の神学的な曖昧さを保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「日々に満ちていた」と「その民のもとに加えられた」は、原文の定型的・文学的表現と意味の余白を保つため、意図的にやや直訳的な響きを残した。
