revisions:
- from: こうしてイサクは息を引き取り、死んで、その民のもとに加えられた[a]。彼は年老い、日々に満ちていた。息子たちのエサウとヤコブが彼を葬った。
  to: こうしてイサクは息を引き取り、死に、自分の民に集められた[a]。彼は年老い、長寿を全うしていた。息子たちのエサウとヤコブが彼を葬った。
  rationale: 本文は、死去を表す三つの動詞を区別して保ちつつ、日本語として不自然な「日々に満ちていた」を「長寿を全うしていた」に改めた。「自分の民に集められた」とその注は、埋葬・祖先との再会・死後の状態のいずれにも意味を固定せず、原文の定型句がもつ曖昧さを維持する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:51:46Z'
review_pass:
  verdict: revise
  source_fidelity: ヘブライ語の三連の死去表現（「息を引き取る／死ぬ／自分の民に集められる」）と、エサウとヤコブによる埋葬は適切に反映されている。「その民のもとに加えられた」も定型句の意味を限定しない点で概ね妥当である。ただし「日々に満ちていた」は日本語として意味が取りにくく、וּשְׂבַע יָמִים（長い年月を十分に生きた、という死去定型）の表現として改める必要がある。
  naturalness: 「日々に満ちていた」は現代標準日本語では不自然で、「日々が満ちていた」のようにも受け取られうる。「長寿を全うしていた」は明瞭かつ品位があり、原文の死去記事の文体にも合う。「死んで」は「死に」とすると、原文の動詞連鎖を保ちながら文として滑らかになる。
  terminology: 人名表記「イサク」「エサウ」「ヤコブ」は適切。「自分の民に集められた」は、ヘブライ語の定型句を比較的直訳的に保持しつつ、「その民のもとに加えられた」より自然である。注は「先祖」と断定せず、死後や埋葬についての含意を可能性として述べており、曖昧さを保っている。
  issues:
