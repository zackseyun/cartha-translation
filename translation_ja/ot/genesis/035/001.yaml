id: GEN.35.1
reference: Genesis 35:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶֽל יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית אֵ֖ל וְ/שֶׁב שָׁ֑ם וַ/עֲשֵׂה שָׁ֣ם מִזְבֵּ֔חַ לָ/אֵל֙ הַ/נִּרְאֶ֣ה אֵלֶ֔י/ךָ בְּ/בָרְחֲ/ךָ֔ מִ/פְּנֵ֖י עֵשָׂ֥ו אָחִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/001.yaml
  text: Then God said to Jacob[a], “Arise, go up to Bethel and dwell there, and make there an altar to the God who appeared to you when you fled from the presence of Esau your brother.”
translation:
  language: ja
  text: 神はヤコブに言われた。「立ってベテルに上り、そこに住みなさい。そして、あなたが兄エサウから逃げていたとき、あなたに現れた神のために、そこに祭壇を築きなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を前進させる接続形。日本語では文脈上、明示的な「それから」を置かなくても継起が自然に伝わる。神の発言には敬語形を用いた。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、ここでは単数の動詞と結びつき、一人の神を指す。
- source_word: קוּם
  choice: 立って
  rationale: 起立と行動開始を促す命令。後続の「上り」と自然につながる現代日本語とした。
- source_word: עֲלֵה
  choice: 上り
  rationale: ベテルへ向かう方向・高低差を含む「上る」の意味を保持した。
- source_word: בֵית אֵל
  choice: ベテル
  rationale: 既成の地名として音写し、「神の家」と意味訳しなかった。
- source_word: וְשֶׁב שָׁם
  choice: そこに住みなさい
  rationale: ישב の定住・滞在の意味を、明瞭で自然な命令表現にした。
- source_word: וַעֲשֵׂה שָׁם מִזְבֵּחַ
  choice: そこに祭壇を築きなさい
  rationale: עשה は広く「造る」の意だが、祭壇との自然な日本語の連語として「築く」を選んだ。
- source_word: לָאֵל
  choice: 神のために
  rationale: 前置詞 ל が示す献納・対象を自然な日本語で表した。後続の関係節がその神を特定する。
- source_word: הַנִּרְאֶה אֵלֶיךָ
  choice: あなたに現れた
  rationale: ראה のニファル分詞を、神の顕現を表す標準的で明瞭な表現にした。
- source_word: בְּבָרְחֲךָ
  choice: 逃げていたとき
  rationale: 前置詞 ב を伴う不定詞構文の時間的状況を自然に表した。
- source_word: מִפְּנֵי
  choice: から
  rationale: 字義は「顔・面前から」だが、逃走の文脈では日本語の「から」がその離脱の意味を簡潔かつ自然に伝える。
- source_word: עֵשָׂו אָחִיךָ
  choice: 兄エサウ
  rationale: 日本語では関係を名前の前に置くのが自然であり、創世記の文脈から年長の兄であることを明示した。
theological_decisions:
- issue: אֱלֹהִים の指示対象
  choice: ヤコブに語り、かつ以前ヤコブに現れた一人の神
  alternative: 複数の神々
  rationale: 単数動詞と物語文脈により、一人の神を指すことが明確である。
- issue: לָאֵל の定冠詞を日本語でどう表すか
  choice: 後続節で特定される「神」とする
  alternative: 「その神」または「神に」とする
  rationale: ヘブライ語では定冠詞と関係節が神を特定するが、日本語で「その神」とすると別神を対比する含みが強まり得るため、関係節による特定を保った。
- issue: ベテルの扱い
  choice: 地名として「ベテル」と音写する
  alternative: 「神の家」と意味訳する
  rationale: この箇所では既知の場所を示す固有地名として機能しているため。
translation_notes:
  register: 明瞭な現代標準日本語。神の命令としての威厳を保ちつつ、古風な「起きよ」「住め」は避け、「立って」「住みなさい」とした。原文の命令の連続と場所を示す「そこ」の反復を保持した。
