  yaml_path: translation/ot/genesis/035/028.yaml
  text: And the days of Isaac were one hundred and eighty years[a].
translation:
  language: ja
  text: イサクの生涯は百八十年であった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「イサクの日々は百八十年であった」。ここで「日々」は生涯を表す慣用表現。
    reason: 原文の慣用表現と本文の自然な訳語との対応を示すため。
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: であった
  rationale: ここでは、イサクの生涯の年数を述べる単純な叙述の連結表現として機能している。文脈に合う、自然で格調ある過去表現とした。
- source_word: יְמֵי
  choice: 生涯
  rationale: 直訳は「日々」だが、人の寿命・生存期間全体を表すヘブライ語の慣用表現である。本文では現代日本語として明瞭な「生涯」とし、原文の表現は脚注に示した。
- source_word: יִצְחָק
  choice: イサク
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: מְאַת שָׁנָה וּשְׁמֹנִים שָׁנָה
  choice: 百八十年
  rationale: 原文の数詞を日本語として自然な一つの年数表現にまとめた。ヘブライ語では各数詞の後に単数形の「年」が置かれているが、日本語では「百八十年」が自然である。
