source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/שְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יֵּ֣לֶךְ רְאוּבֵ֔ן וַ/יִּשְׁכַּב֙ אֶת בִּלְהָה֙ פִּילֶ֣גֶשׁ אָבִ֔י/ו וַ/יִּשְׁמַ֖ע יִשְׂרָאֵ֑ל וַ/יִּֽהְי֥וּ בְנֵֽי יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר־פ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/022.yaml
  text: And it happened[a], while Israel was dwelling in that land, that Reuben went and lay with Bilhah, his father's concubine, and Israel heard of it[b]. Now the sons of Jacob were twelve.
translation:
  language: ja
  text: イスラエルがその地に住んでいた時、ルベンは行って、父のそばめビルハと寝た。イスラエルはそのことを聞いた[a]。さて、ヤコブの息子たちは十二人であった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると「イスラエルは聞いた」。何を聞いたかは明示されていないが、直前のルベンの行為を指すことは文脈から明らかである。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「そして、ヤコブの息子たちは十二人であった」。この文は、続く息子たちの一覧への移行を示していると考えられる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בִּשְׁכֹּן
  choice: 住んでいた時
  rationale: 前置詞בを伴う不定詞構文が示す、継続中の背景と時を自然な現代日本語で表した。וַיְהִיを機械的に「そして、…ということが起こった」とせず、時間節を主文へ自然につないだ。
- source_word: בָּאָרֶץ הַהִוא
  choice: その地に
  rationale: ここでのאֶרֶץは全世界ではなく、文脈上の地域を指す。「その土地」より簡潔で、聖書叙述にふさわしい「その地」とした。
- source_word: וַיֵּלֶךְ
  choice: 行って
  rationale: 原文がルベンの行動を独立した動詞で明示しているため、省略せず「行って」とした。目的地は原文にないので補わなかった。
- source_word: וַיִּשְׁכַּב אֶת
  choice: …と寝た
  rationale: 人を目的語とするשׁכבは性交を表す定型表現である。日本語でも文脈上その意味が明瞭な「…と寝た」とし、婉曲化しすぎず、臨床的に説明しすぎることも避けた。
- source_word: פִּילֶגֶשׁ
  choice: そばめ
  rationale: 古代家族内で正式に認められながら正妻より低い地位にあった女性を指す語として、簡潔で定着した訳語を用いた。
- source_word: וַיִּשְׁמַע יִשְׂרָאֵל
  choice: イスラエルはそのことを聞いた
  rationale: 原文は直訳すると「イスラエルは聞いた」で目的語を明示しないが、ルベンの行為を聞いたことは文脈上明らかである。日本語として自然になるよう「そのことを」を補った。
- source_word: וַיִּהְיוּ בְנֵי יַעֲקֹב שְׁנֵים עָשָׂר
  choice: さて、ヤコブの息子は十二人であった
  rationale: 後続する息子たちの一覧への移行を「さて」で示した。「十二人であった」は原文の数の叙述を簡潔に保つ。
theological_decisions:
- issue: ルベンの性的行為をどの程度明示するか
  choice: 父のそばめビルハと寝た
  alternative: 父のそばめビルハと性的な関係を持った
  rationale: 原文の性的慣用句を、過度に婉曲にも露骨にもせず直接的に訳した。本文は行為を報告するだけであり、動機や法的評価は付け加えない。
- issue: イスラエルが聞いた後の反応
  choice: 聞いたとのみ訳し、反応を補わない
  alternative: 怒った、黙認した、裁きを保留したなどの反応を推測して補う
  rationale: 原文はイスラエルが聞いたことだけを述べており、その反応を記していない。沈黙に神学的・倫理的意味を読み込まず、原文の緊張と余白を保った。
- issue: 最後の文の機能
  choice: 「さて」で息子たちの一覧への移行を示す
  alternative: 前文との因果関係やイスラエルの沈黙への評価を示す文として扱う
  rationale: この句は次節以降の十二人の息子の列挙を導く移行句と理解するのが自然である。ただし本文にない因果関係は導入しない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、叙述の重みを保った。「そばめ」は歴史的な身分を簡潔に示す語として採用し、「寝た」は原文の性的慣用句の直接性を保持した。イスラエルの反応や行為への評価は本文に補っていない。
