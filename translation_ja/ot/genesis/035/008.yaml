base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/008.yaml
  text: And Deborah[a], Rebekah’s nurse, died, and she was buried below Bethel, under the oak[b]. So he called its name Allon-bacuth.
translation:
  language: ja
  text: リベカの乳母デボラが死に、ベテルの下方、樫の木[a]の下に葬られた。そして、その樫の木をアロン・バクト[b]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の אַלּוֹן は、樫またはテレビンの木を指す可能性があり、正確な樹種は不明である。
    reason: lexical_alternative
  - marker: b
    text: 「アロン・バクト」は、おそらく「嘆きの樫」という意味。אַלּוֹןをテレビンの木と取れば、「嘆きのテレビンの木」となる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵינֶקֶת
  choice: 乳母
  rationale: 子どもに乳を与え、養育する女性を指す語である。ここでは長年リベカに仕えた女性の役割を自然かつ簡潔に表す「乳母」とした。
- source_word: מִתַּחַת לְבֵית אֵל
  choice: ベテルの下方に
  rationale: ベテルより低い位置にあることを示す空間表現として訳し、方角を特定する「南」とはしなかった。
- source_word: תַּחַת הָאַלּוֹן
  choice: 樫の木の下に
  rationale: תַּחַתの位置関係を「下に」とし、אַלּוֹןは伝統的かつ自然な「樫の木」とした。ただし樹種には不確かさがあるため脚注を付した。
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: その木を…と名づけた
  rationale: 動詞は能動態の三人称男性単数だが、主語は明示されていない。日本語では主語を補わずに自然に表現できるため、「彼」を加えず、命名の対象を文脈上の木として示した。
- source_word: אַלּוֹן בָּכוּת
  choice: アロン・バクト
  rationale: 地名または木の名として音写し、その語義は脚注で示した。
- source_word: וַתִּקָּבֵר
  choice: 葬られた
  rationale: ニファル形の受動的意味をそのまま表し、埋葬した人物を本文に補わなかった。
- source_word: וַתָּמָת
  choice: 死に
  rationale: 原文の直接的な表現を保ち、婉曲語には置き換えなかった。
