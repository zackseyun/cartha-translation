  text: Then God went up from him in the place where he had spoken with him[a].
translation:
  language: ja
  text: すると神は、ヤコブと語られたその場所で、ヤコブのもとから上って行かれた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼の上から上って行かれた」。ヘブライ語は「彼の上から」という表現を用い、神がこの出会いを終えて去る際の上向きの動きを描いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上って行かれた
  rationale: カル形のעלהが表す具体的な上方への移動を保ちつつ、現代日本語として自然な敬語表現にした。「去られた」では原文の垂直方向の描写が失われる。
- source_word: מֵעָלָיו
  choice: 彼のもとから
  rationale: 字義的には「彼の上から／彼の上方から」だが、日本語で過度に物理的・不自然に響くのを避け、ヤコブから離れる意味を自然に表した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、単数動詞を伴い、文脈上唯一の神を指す。
- source_word: בַּמָּקוֹם
  choice: その場所で
  rationale: 前置詞בの場所用法を自然な日本語の「で」で表し、定冠詞を文脈に即して「その」に反映した。
- source_word: אֲשֶׁר
  choice: ～たその
  rationale: 先行詞「場所」を修飾する関係節として、日本語では「語られたその場所」と自然に構成した。
- source_word: דִּבֶּר אִתּוֹ
  choice: ヤコブと語られた
  rationale: דברのピエル形とאֵתは「～と語る」を表す。代名詞の連続による曖昧さを避けるため、文脈上の相手を「ヤコブ」と明示し、相互的な含みを保つ「と」を用いた。
theological_decisions:
- issue: 神が去る際の擬人的・空間的描写
  choice: 「彼のもとから上って行かれた」として上方への移動を保持する。
  alternative: 「彼のもとを去られた」「彼から離れられた」
  rationale: 原文は通常の上昇語彙を用いる。空間表現を非空間的な言い換えに還元せず、神の顕現に伴う物語的描写とその緊張をそのまま残す。
translation_notes:
  register: 明瞭で現代的な標準日本語。神の動作には自然な尊敬表現を用い、原文の具体的な空間イメージを保持した。節単独でも指示対象が分かるよう「彼」と「ヤコブ」を併用した。
