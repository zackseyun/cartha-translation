  text: 'The sons of Leah: Jacob’s firstborn[a], Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: ja
  text: レアの息子たちは、ヤコブの長子ルベン、シメオン、レビ、ユダ、イッサカル、ゼブルンである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: レアの息子たち
  rationale: 構文上、レアから生まれた男子を列挙しているため、「子どもたち」ではなく「息子たち」とした。
- source_word: בְּכֹר יַעֲקֹב
  choice: ヤコブの長子
  rationale: 「ヤコブの最初に生まれた者」という関係を簡潔かつ格調ある現代日本語で示し、直後のルベンを同格で説明する形を保った。
- source_word: רְאוּבֵן וְשִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וּזְבוּלֻן
  choice: ルベン、シメオン、レビ、ユダ、イッサカル、ゼブルン
  rationale: 人名は日本語聖書で広く定着した表記を用いた。ヘブライ語では接続詞が反復されるが、日本語では読点による列挙が自然であり、内容上の関係も失われない。
