  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל בֵּית֔/וֹ וְ/אֶ֖ל כָּל אֲשֶׁ֣ר עִמּ֑/וֹ הָסִ֜רוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/תֹכְ/כֶ֔ם וְ/הִֽטַּהֲר֔וּ וְ/הַחֲלִ֖יפוּ שִׂמְלֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/002.yaml
  text: Then Jacob said to his household and to all who were with him[a], “Put away the foreign gods that are among you, purify yourselves[b], and change your clothes.”
translation:
  language: ja
  text: そこでヤコブは、自分の家の者たちと、共にいたすべての人に言った。「あなたがたの中にある異国の神々[a]を取り除き、身を清め[b]、衣服を着替えなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「外国人の神々」または「異質な神々」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「身を清める」は、神のもとへ向かう備えとしての儀礼的な清めを指す可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: בֵּיתוֹ
  choice: 自分の家族
  rationale: 直訳は「彼の家」だが、ここでは建物ではなく、ヤコブの家に属する人々を指す。現代日本語で自然な社会的意味を表した。
- source_word: כָּל אֲשֶׁר עִמּוֹ
  choice: 共にいたすべての人
  rationale: ヤコブに同行していた人々を指す。原文の包括性を保ちつつ、人を指すことが明確になる表現とした。
- source_word: הָסִרוּ
  choice: 取り除き
  rationale: 所有または共同体の中にある異教の神像などを排除せよという命令。「捨てる」と限定せず、原語の広い意味を保った。
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: 異国の神々
  rationale: 「外国人の神々」「異質な神々」とも解し得るが、イスラエルの神ではない他国の神々を指すことが明瞭な表現を選んだ。
- source_word: בְּתֹכְכֶם
  choice: あなたがたの中にある
  rationale: 「あなたがたの間に」「あなたがたが所持している」の両方を含み得るため、共同体内の存在と物理的所持を限定しない表現にした。
- source_word: וְהִטַּהֲרוּ
  choice: 身を清め
  rationale: 再帰的な命令であり、神に近づく備えとしての儀礼的な清めを示唆する。「身を清める」は現代日本語で自然であり、その含みも保つ。
- source_word: וְהַחֲלִיפוּ שִׂמְלֹתֵיכֶם
  choice: 衣服を着替えなさい
  rationale: 衣服を替えるという具体的な命令を、明快で自然な日本語にした。「衣服」は「服」よりやや荘重で、聖書本文の文体にも適する。
theological_decisions:
- issue: 清めの命令の性質
  choice: 「身を清め」とし、儀礼的・契約的な清めの可能性を残す
  alternative: 一般的な衛生行為として「体を洗い」と訳す
  rationale: 偶像を除き、神のもとへ向かう準備という文脈から儀礼的意味が示唆されるが、具体的な方法は本文にないため限定しなかった。
- issue: אֱלֹהֵי הַנֵּכָר の関係性
  choice: 「異国の神々」と訳す
  alternative: 「外国人の神々」または「異質な神々」
  rationale: 構文は外国に属する神々とも異質な神々とも表し得る。本文では唯一の神への忠誠に反する他の神々が問題だが、その神学的評価を訳文で必要以上に展開しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、命令の厳粛さに合う品位を保った。「そこで」は物語の継起を自然に示し、「衣服」「身を清める」により過度に口語的にならないようにした。
