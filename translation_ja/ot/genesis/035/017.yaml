  text: And when her labor was hard[a], the midwife said to her, “Do not fear[b], for this also is a son for you.”
translation:
  language: ja
  text: 彼女が難産で苦しんでいたとき、助産師は彼女に言った。「恐れないでください。この子も男の子です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְהַקְשֹׁתָהּ בְלִדְתָּהּ
  choice: 彼女が難産で苦しんでいたとき
  rationale: 直訳的には「彼女が産む際に困難を極めたとき」。出産が困難であったことを、現代日本語で自然かつ明確に表した。
- source_word: הַמְיַלֶּדֶת
  choice: 助産婦
  rationale: 出産を介助する女性を指す語。物語の時代背景にも合う一般的な訳語を用いた。
- source_word: אַל תִּירְאִי
  choice: 恐れないでください
  rationale: יראの基本義を保ちつつ、苦しむ産婦への直接の励ましとして自然な丁寧表現にした。
- source_word: כִּי גַם זֶה לָךְ בֵּן
  choice: この子も男の子です
  rationale: גַם זֶהの「この子も」を保持し、לָךְ בֵּןの所有・関係を日本語では文脈上自然に含意させた。「あなたの息子です」より、出産時に子の性別を知らせる発言として自然である。
