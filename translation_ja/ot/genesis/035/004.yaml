source:
  edition: WLC
  text: וַ/יִּתְּנ֣וּ אֶֽל יַעֲקֹ֗ב אֵ֣ת כָּל אֱלֹהֵ֤י הַ/נֵּכָר֙ אֲשֶׁ֣ר בְּ/יָדָ֔/ם וְ/אֶת הַ/נְּזָמִ֖ים אֲשֶׁ֣ר בְּ/אָזְנֵי/הֶ֑ם וַ/יִּטְמֹ֤ן אֹתָ/ם֙ יַעֲקֹ֔ב תַּ֥חַת הָ/אֵלָ֖ה אֲשֶׁ֥ר עִם שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/004.yaml
  text: So they gave Jacob all the foreign gods that were in their hands[a], and the rings that were in their ears[b], and Jacob hid them under the terebinth that was near Shechem.
translation:
  language: ja
  text: そこで彼らは、持っていた異国の神々をすべてヤコブに渡し、耳に着けていた耳輪も渡した。ヤコブはそれらを、シェケムの近くにあるテレビンの木[a]の下に隠した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「テレビンの木」を「樫の木」とする訳もある。
    reason: lexical_alternative
  - marker: b
    text: 「隠した」は「埋めた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ אֶל־יַעֲקֹב
  choice: そこで彼らは…ヤコブに渡し
  rationale: 物語を進めるワウ継続法を、前節への応答を自然に示す「そこで」で表した。נתן と אֶל の授与・方向の意味は「ヤコブに渡し」とした。
- source_word: כָּל־אֱלֹהֵי הַנֵּכָר
  choice: 異国の神々をすべて
  rationale: נֵכָר はここで、ヤコブの一族が捨てるべき他国・異教の神々を指す。「異国の神々」は対象を明確にしつつ、偶像という解釈語に置き換えない。
- source_word: אֲשֶׁר בְּיָדָם
  choice: 手元にあった
  rationale: 字義は「彼らの手にあった」。現代日本語で所有・所持を自然に示しながら、具体的なヘブライ語表現の響きも保つ。
- source_word: הַנְּזָמִים אֲשֶׁר בְּאָזְנֵיהֶם
  choice: 耳につけていた耳輪
  rationale: נֶזֶם 単独では鼻輪または耳輪を指し得るが、ここでは「彼らの耳に」と明示されているため「耳輪」が自然で正確。「耳から外した」とまでは原文にないので加えない。
- source_word: וַיִּטְמֹן אֹתָם
  choice: それらを…隠した
  rationale: טמן は隠す・埋めるの双方を含み得る。「隠した」は行為の方法を埋葬に限定せず、原文の語義範囲を保つ。
- source_word: תַּחַת הָאֵלָה
  choice: テレビンの木の下に
  rationale: אֵלָה は一般にテレビンの木を指す。伝統的な「樫の木」より植物名として原語に近い。
- source_word: אֲשֶׁר עִם שְׁכֶם
  choice: シェケムの近くにある
  rationale: 地名とともに用いられた עִם の近接・位置関係を、自然な日本語で表した。
theological_decisions:
- issue: 耳輪と異教礼拝との関係
  choice: 耳輪も渡されたことだけを述べ、その宗教的機能は説明しない
  alternative: 耳輪自体を護符または偶像礼拝の品と明示する／単なる装飾品と明示する
  rationale: 本文は異国の神々と耳輪を別々に挙げるが、耳輪が本質的に偶像礼拝的だったのか、以前の慣習に結びついていたのかは説明していないため、その余白を保つ。
- issue: 隠した方法
  choice: 隠した
  alternative: 埋めた
  rationale: 木の下という場所は示されるものの、動詞 טמן だけでは埋めたと断定する必要がないため、広い意味を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「耳輪」は文脈により部位が確定するため本文で採用し、曖昧さが残る טמן と樹木名 אֵלָה の主要な別訳は脚注に示した。
