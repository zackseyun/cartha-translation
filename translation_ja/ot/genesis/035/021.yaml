base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/021.yaml
  text: Then Israel journeyed on and pitched his tent beyond Migdal-eder[a].
translation:
  language: ja
  text: イスラエルはさらに旅を続け、ミグダル・エデル[a]の向こうに天幕を張った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ミグダル・エデル」は「群れの塔」という意味。
    reason: 地名の元となるヘブライ語の語義を示すため。
lexical_decisions:
- source_word: וַיִּסַּע
  choice: さらに旅を続け
  rationale: נסעは、宿営地を離れて先へ進むことを表す。物語を進める接続形の働きも含め、自然な日本語で継続的な移動を示した。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 原文は「ヤコブ」ではなく「イスラエル」という名を用いているため、そのまま保持した。
- source_word: וַיֵּט
  choice: 張った
  rationale: נטהは「天幕」を目的語とする場合、天幕を張ることを意味する定型的な表現である。
- source_word: אָהֳלֹה
  choice: 天幕を
  rationale: אֹהֶלは「天幕」、接尾辞は三人称男性単数の所有を示す。日本語では主語が明白なため、「彼の」を明示せず自然に訳した。
- source_word: מֵהָלְאָה
  choice: 向こうに
  rationale: 基準となる場所よりさらに先、または越えた位置を示す。ここでは地名との関係を自然に表す「向こうに」とした。
- source_word: לְמִגְדַּל עֵדֶר
  choice: ミグダル・エデル
  rationale: 文脈上は地名として機能するため音写し、語義は脚注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準語を用い、物語文として簡潔で品位ある調子に整えた。「天幕」は聖書時代の移動生活を伝えつつ、一般読者にも理解できる語として採用した。
