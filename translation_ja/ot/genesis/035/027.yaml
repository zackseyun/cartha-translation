  naturalness: 修正文は現代標準日本語として自然で、地名が連続する箇所は読点によって読みやすくした。「寄留していた」は叙事文に適した語であり、原語の含意を保つ。
  terminology: 人名は「ヤコブ」「イサク」「アブラハム」、地名は「マムレ」「キルヤト・アルバ」「ヘブロン」とし、日本語聖書で通用する表記に沿う。「寄留」はגורの、よそ者として居住するという含意を適切に伝える。
