  text: וַ/יָּבֹ֤א יַעֲקֹב֙ אֶל יִצְחָ֣ק אָבִ֔י/ו מַמְרֵ֖א קִרְיַ֣ת הָֽאַרְבַּ֑ע הִ֣וא חֶבְר֔וֹן אֲשֶׁר גָּֽר שָׁ֥ם אַבְרָהָ֖ם וְ/יִצְחָֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/027.yaml
  text: And Jacob came to Isaac his father at Mamre[a], Kiriath-arba (that is, Hebron), where Abraham and Isaac had sojourned.
translation:
  language: ja
  text: ヤコブは父イサクのもと、マムレ、キルヤト・アルバ、すなわちヘブロンに来た。そこは、アブラハムとイサクが寄留していた所である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留する」は、その地の定住民ではない者として、そこに住むことを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来た
  rationale: בוא の一般的な移動・到着の意味を、イサクのいる場所への到着という文脈に即して自然に表した。
- source_word: אֶל יִצְחָק אָבִיו
  choice: 父イサクのもとへ
  rationale: 方向を示す אֶל と父子関係を保ちつつ、現代日本語として自然な語順にした。
- source_word: מַמְרֵא
  choice: マムレ
  rationale: 地名として音写した。
- source_word: קִרְיַת הָאַרְבַּע
  choice: キルヤト・アルバ
  rationale: 固有の地名として音写し、後続のヘブロンとの同定を本文に残した。
- source_word: הִוא חֶבְרוֹן
  choice: （現在のヘブロン）
  rationale: 字義は「それはヘブロン」で、旧称と読者に知られる名称を同定する説明であるため、日本語では簡潔な挿入句とした。
- source_word: אֲשֶׁר ... שָׁם
  choice: そこは……所である
  rationale: 場所を先行詞とする関係節を、明瞭で自然な日本語の独立文に組み替えた。
- source_word: גָּר
  choice: 寄留していた
  rationale: גור が示す、よそ者・一時滞在者として住む含意を「住んでいた」だけに弱めず表した。
- source_word: אַבְרָהָם וְיִצְחָק
  choice: アブラハムとイサク
  rationale: 日本語聖書で広く通用する人名表記を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、叙事文としての品位を保った。「寄留」は日常語よりやや硬いが、原語 גור の重要な居住上の含意を簡潔に保持できるため採用した。地名の関係が読み取りやすいよう句読点と括弧を用いた。
