source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֗רֶץ אֲשֶׁ֥ר נָתַ֛תִּי לְ/אַבְרָהָ֥ם וּ/לְ/יִצְחָ֖ק לְ/ךָ֣ אֶתְּנֶ֑/נָּה וּֽ/לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֶתֵּ֥ן אֶת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/012.yaml
  text: And the land that I gave to Abraham and to Isaac[a], I will give to you[b]; and to your offspring after you I will give the land.
translation:
  language: ja
  text: わたしがアブラハムとイサクに与えた[a]地を、あなたに与える。また、あなたの後の子孫[b]にも、その地を与える。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしがアブラハムとイサクにすでに与えた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「子孫」に当たる語は集合単数で、「種」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: 地
  rationale: 族長への約束という文脈で特定の土地を指すため、「地」とした。後半では自然な照応を明確にするため「この地」とした。
- source_word: נָתַתִּי
  choice: 与えた
  rationale: 完了形を過去の授与・約束として訳し、後続する未完了形の「与える」との時間的な対照を保った。
- source_word: לְךָ אֶתְּנֶנָּה
  choice: あなたに与える
  rationale: 女性単数接尾辞は先行する「地」を受ける。日本語では目的語を関係節からそのまま受け、「それを」を重ねず自然に訳した。
- source_word: זַרְעֲךָ
  choice: あなたの後の子孫
  rationale: זֶרַע は集合単数で、ここでは後代の人々を指す。「子孫」は現代日本語で自然であり、集合的意味を適切に伝える。
- source_word: אַחֲרֶיךָ
  choice: あなたの後の
  rationale: 時間的・世代的な後続を表す語句として、子孫を修飾する自然な日本語にした。
- source_word: אֶתֵּן אֶת הָאָרֶץ
  choice: この地を与える
  rationale: 原文が「与える」と「地」を繰り返す点を保持し、ヤコブの子孫への約束を明示した。
theological_decisions:
- issue: 族長への土地の約束における過去の授与と将来の授与の関係
  choice: נָתַתִּיを「与えた」、後続の未完了形を「与える」と訳す。
  alternative: נָתַתִּיを「与えている」または「与えたところの」とし、約束の継続的効力を前面に出す。
  rationale: 原文はアブラハムとイサクへの先行する授与と、ヤコブおよびその子孫への将来の授与を並置している。その時間的・神学的緊張を解消せず保った。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「わたし」を用いて神の直接話法を自然に示し、原文の反復と過去・未来の対照を保持した。
