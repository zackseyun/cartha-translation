  text: וַ/יָּבֹ֨א יַעֲקֹ֜ב ל֗וּזָ/ה אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן הִ֖וא בֵּֽית אֵ֑ל ה֖וּא וְ/כָל הָ/עָ֥ם אֲשֶׁר עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/006.yaml
  text: So Jacob came to Luz (that is[a], Bethel), which is in the land of Canaan, he and all the people who were with him.
translation:
  language: ja
  text: こうしてヤコブは、彼とともにいたすべての人々とともに、カナンの地にあるルズ、すなわちベテル[a]に着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「ルズ……それはベテル」と記し、ルズをベテルと同定している。
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 着いた
  rationale: בוא の完了連続形は、ここでは目的地への到着を表す。「着いた」は、移動の到達点に焦点を置く文脈に自然である。
- source_word: לוּזָה
  choice: ルズに
  rationale: 地名 לוּז に方向を示す語尾 ה が付いているため、「ルズに」とした。語尾自体は音写せず、助詞「に」で移動の方向を表した。
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: カナンの地にある
  rationale: ルズの所在地を示す関係節を、自然な現代日本語の連体修飾として訳した。
- source_word: הִוא בֵּית אֵל
  choice: すなわちベテル
  rationale: 代名詞と地名による同定を説明的な同格表現として訳し、ルズとベテルが同じ場所を指すことを示した。
- source_word: הוּא וְכָל הָעָם אֲשֶׁר עִמּוֹ
  choice: 彼とともにいたすべての人々を連れて
  rationale: ヤコブ本人と同行者全員が到着したことを、日本語として自然な形に組み替えた。「人々」は民族集団ではなく、ここでは同行していた一団を指す。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語末尾の「彼と、彼とともにいたすべての民」を、日本語で誤解なく読めるよう「彼とともにいたすべての人々を連れて」と前方に組み替えた。地名の二重表記は本文と脚注の双方で保持した。
