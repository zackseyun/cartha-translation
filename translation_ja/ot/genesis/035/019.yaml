lexical_decisions:
- source_word: וַתָּמָת
  choice: 死に
  rationale: מותの直接的な意味である身体的な死を、婉曲表現を避けて明瞭に表した。
- source_word: רָחֵל
  choice: ラケル
  rationale: 日本語聖書で広く定着している人名表記を採用した。
- source_word: וַתִּקָּבֵר
  choice: 葬られた
  rationale: קברのニファル形が示す受動の意味を自然な日本語で表した。原文に明示されない「そこに」は補わなかった。
- source_word: בְּדֶרֶךְ
  choice: 道の途中に
  rationale: 前置詞בを伴うדרךは、ここでは経路上の場所を指す。「道の途中に」は埋葬場所を自然かつ明確に表す。
- source_word: אֶפְרָתָה
  choice: エフラタへ向かう
  rationale: 語尾の方向格הを反映し、エフラタへの途上であることを示した。地名はヘブライ語の形に即して「エフラタ」と音写した。
- source_word: הִוא
  choice: すなわち
  rationale: エフラタとベツレヘムを同定する同格的・説明的な働きを簡潔に表した。
- source_word: בֵּית לָחֶם
  choice: ベツレヘム
  rationale: 日本語で定着している地名表記を採用した。
