  yaml_path: translation/ot/genesis/035/016.yaml
  text: Then they journeyed from Bethel[a], and when there was still some distance to go before reaching Ephrath, Rachel gave birth, and she had difficulty in childbirth.
translation:
  language: ja
  text: 彼らはベテルを出発した。エフラタまでなおいくらかの道のり[a]を残していたとき、ラケルは子を産んだが、その出産は難産だった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「なお一キブラトの土地」。ここでいう距離がどれほどかは不明。
    reason: 稀な距離表現の字義と、その正確な長さが不確かであることを示すため。
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: 一行は……出発した
  rationale: נסעは、旅の途上で宿営地を発って先へ進むことを表す。「一行」を補うことで複数主語を自然な日本語で示した。
- source_word: מִבֵּית אֵל
  choice: ベテルを
  rationale: 起点を示す前置詞מִןを、日本語では移動動詞「出発した」に合わせて助詞「を」で表した。地名は日本語で一般的な「ベテル」とした。
- source_word: וַיְהִי עוֹד כִּבְרַת הָאָרֶץ
  choice: なおいくらかの道のりがあるところで
  rationale: 稀な表現כִּבְרַת הָאָרֶץの正確な距離は不明であるため、特定の単位を持ち込まず、到着まで距離が残っていたことを表した。
- source_word: לָבוֹא אֶפְרָתָה
  choice: エフラタに着くまで
  rationale: 不定詞לָבוֹאが示す目的地への到着を、前の距離表現につながる自然な日本語にした。אֶפְרָתָהは日本語で定着している「エフラタ」と表記した。
- source_word: וַתֵּלֶד רָחֵל
  choice: ラケルは子を産んだ
  rationale: 女性を主語とする ילד のカル形を直接的に訳した。目的語は明示されていないが、日本語では「子を産む」が自然である。
- source_word: וַתְּקַשׁ בְּלִדְתָּהּ
  choice: 難産だった
  rationale: קשהが出産の困難さを表すため、簡潔で明瞭な現代日本語の「難産だった」とした。原文にない症状や結果は加えていない。
