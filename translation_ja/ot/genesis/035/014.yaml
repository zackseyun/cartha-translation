  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּ/מָּק֛וֹם אֲשֶׁר דִּבֶּ֥ר אִתּ֖/וֹ מַצֶּ֣בֶת אָ֑בֶן וַ/יַּסֵּ֤ךְ עָלֶ֨י/הָ֙ נֶ֔סֶךְ וַ/יִּצֹ֥ק עָלֶ֖י/הָ שָֽׁמֶן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/014.yaml
  text: And Jacob set up a pillar in the place where he had spoken with him[a], a pillar of stone; and he poured out a drink offering on it[b], and he poured oil on it.
translation:
  language: ja
  text: ヤコブは、神がヤコブと語られた場所に、石の柱を立てた。その上に注ぎのささげ物[a]を注ぎ、さらにその上に油を注いだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「献酒」。液体を注いで献げるささげ物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: 立てた
  rationale: ヒフィル形の「立たせる、据える」という具体的な動作を、自然な現代日本語で表した。
- source_word: מַצֵּבָה / מַצֶּבֶת אָבֶן
  choice: 一本の柱、すなわち石の柱
  rationale: מַצֵּבָה は立てられた記念碑的な柱を指す。後続する「石の柱」という同格表現も残し、原文の反復と材質の明示を保った。
- source_word: אֲשֶׁר דִּבֶּר אִתּוֹ
  choice: 彼と語られた方のいた
  rationale: 文脈上、語った方は神であるが、ヘブライ語では主語が明示されていないため、「神」と補わず、敬語によって文脈的な指示を自然に示した。場所に関する関係節として日本語を整えた。
- source_word: וַיַּסֵּךְ ... נֶסֶךְ
  choice: 注ぎのささげ物を注ぎ
  rationale: 祭儀的に液体を注ぐ行為を表す同根的な語の組み合わせを保ちつつ、「献酒」より一般読者に意味が伝わる表現とした。
- source_word: וַיִּצֹק ... שָׁמֶן
  choice: 油を注いだ
  rationale: 原文は単に「油」としており、オリーブ油とは限定しない。先の祭儀的な注ぎとは異なる動詞の簡潔さも反映した。
theological_decisions:
- issue: 柱と注ぎのささげ物と油の意味
  choice: 行為を記述するにとどめ、奉献・聖別・記念などの目的を訳文に補わない。
  alternative: 「柱を聖別した」または「神との出会いを記念した」と解釈的に訳す。
  rationale: 節自体は行為の神学的意味を明示していないため、解釈を断定せず、原文の余地を保つ。
- issue: 語った者の特定
  choice: 「彼と語られた方」とし、文脈上神を指すことを示しつつ固有の主語を補わない。
  alternative: 「神が彼と語られた」と明示する。
  rationale: 直前の文脈では神が指示対象だが、この節のヘブライ語関係節では主語が明記されていないため、その統語的特徴をできるだけ保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「一本の柱、すなわち石の柱」により原文の同格的反復を残し、「注ぎのささげ物」には短い語注を付して祭儀用語を説明した。
