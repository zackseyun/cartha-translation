  text: וַ/יַּצֵּ֧ב יַעֲקֹ֛ב מַצֵּבָ֖ה עַל קְבֻרָתָ֑/הּ הִ֛וא מַצֶּ֥בֶת קְבֻֽרַת רָחֵ֖ל עַד הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/020.yaml
  text: And Jacob set up a pillar over her grave[a]. It is the pillar of Rachel’s grave to this day.
translation:
  language: ja
  text: ヤコブは彼女の墓の上に石柱を立てた。それは今日に至るまで、ラケルの墓の石柱である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: 立てた
  rationale: ヒフィル形が表す「立てる、据える」を、石柱を設置する動作として自然な現代日本語で訳した。
- source_word: מַצֵּבָה
  choice: 石柱
  rationale: 墓の上に立てられた直立石という具体的な像を保つ。「記念碑」では記念の機能を明示しすぎるため避けた。
- source_word: עַל קְבֻרָתָהּ
  choice: 彼女の墓の上に
  rationale: 前置詞 עַל の位置関係を保ち、קְבֻרָה を簡潔な「墓」とした。文脈上「彼女」は直前に葬られたラケルを指す。
- source_word: הִוא
  choice: それが
  rationale: 先行する石柱を受けて同定する代名詞として、前文とのつながりが自然になるよう訳した。
- source_word: מַצֶּבֶת קְבֻרַת רָחֵל
  choice: ラケルの墓の石柱
  rationale: ヘブライ語の連語が示す関係を過度に解釈せず、「墓を示す石柱」などと機能を補わない形で表した。
- source_word: עַד הַיּוֹם
  choice: 今日まで残る
  rationale: 語句そのものは「今日まで」だが、日本語では石柱が存続していることを「残る」で自然に明示した。
theological_decisions: []
translation_notes:
  register: 平明で格調を失わない現代標準日本語。「石柱」により מַצֵּבָה の具体性を保ち、「墓碑」や「記念碑」に伴う追加的な機能解釈を避けた。
