  yaml_path: translation/ot/genesis/035/009.yaml
  text: God appeared to Jacob again when he came from Paddan-aram[a], and he blessed him.
translation:
  language: ja
  text: 神は、ヤコブがパダン・アラムから来たとき、再び彼に現れ[a]、彼を祝福された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神は再びヤコブにご自身を現された」。ヘブライ語の動詞は、「現れる」または「自らを現す」という意味を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 現れ
  rationale: ראהのニファル形は、ここでは神が目に見える仕方で、または明らかな仕方で御自身を示すことを表す。「現れ」はその意味を自然な日本語で伝え、現れの具体的な様態までは限定しない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 動詞が単数で、物語の文脈でも唯一の神を指すため、「神」とする。
- source_word: עוֹד
  choice: 再び
  rationale: 以前にもあった神の顕現が繰り返されたことを示す副詞なので、「再び」が適切である。
- source_word: בְּבֹאוֹ
  choice: 帰って来たとき
  rationale: 前置詞בと接尾辞付き不定詞構文を時間節として訳す。מִפַּדַּן אֲרָםと文脈上、ヤコブがその地から戻ったことを自然に表すため「帰って来たとき」とした。
- source_word: מִפַּדַּן אֲרָם
  choice: パダン・アラムから
  rationale: 地名は音写し、接頭前置詞מִןを「から」で表す。
- source_word: וַיְבָרֶךְ אֹתוֹ
  choice: 彼を祝福された
  rationale: ברךのピエル形を「祝福する」と訳す。日本語では主語の反復を避けつつ、目的語「彼」を明示し、神への敬意を自然な敬語で表した。
theological_decisions:
- issue: 神の顕現の性質
  choice: 「神は…再び彼に現れ」とし、実際の神の顕現として表す。
  alternative: 「神は再びヤコブに御自身を現された」または「神は再びヤコブに見えるようになった」
  rationale: 本文は神の顕現を報告するが、その仕方が身体的、幻視的、その他のどれであったかは特定しない。「現れ」はこの曖昧さと神学的緊張を保つ。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「帰って来た」は文脈上の帰還を自然に示し、「祝福された」は神を主語とする日本語として穏当な敬語表現である。
