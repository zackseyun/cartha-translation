  text: וְ/נָק֥וּמָה וְ/נַעֲלֶ֖ה בֵּֽית אֵ֑ל וְ/אֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ לָ/אֵ֞ל הָ/עֹנֶ֤ה אֹתִ/י֙ בְּ/י֣וֹם צָֽרָתִ֔/י וַ/יְהִי֙ עִמָּדִ֔/י בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/003.yaml
  text: Let us rise and go up to Bethel[a], and there I will make an altar to the God who answered me in the day of my distress and was with me on the way that I went.
translation:
  language: ja
  text: さあ、立ってベテルへ上って行こう。そこで、私の苦難の日に私に答え[a]、私が歩んだ道で私と共にいてくださった神に、私は祭壇を築こう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私に答えてくださった」とも、「私に答えてくださる」とも訳せる。ヘブライ語は分詞であり、過去の具体的な応答を指すとも、神の継続的・特徴的なあり方を表すとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָק֥וּמָה וְנַעֲלֶ֖ה
  choice: さあ、立って……上って行こう
  rationale: 二つの一人称複数の意志・勧奨表現を、現代日本語で自然な呼びかけとして表した。「上って行く」によりעלהの空間的な含みも保った。
- source_word: בֵּֽית אֵ֑ל
  choice: ベテル
  rationale: 地名として慣用的な音写を用いた。
- source_word: וְאֶֽעֱשֶׂה שָּׁ֣ם מִזְבֵּ֗חַ
  choice: そこで……祭壇を築こう
  rationale: עשהは直訳すれば「造る」だが、祭壇との自然な日本語の結びつきから「築く」とした。一人称単数の意志形は「築こう」で表した。
- source_word: לָ/אֵ֞ל
  choice: 神のために
  rationale: לの奉献・対象の関係を自然な日本語で示した。後続の修飾節によって、ヤコブに応答し同行した神であることが特定される。
- source_word: הָ/עֹנֶ֤ה אֹתִ/י֙
  choice: 私に答え[a]
  rationale: 分詞は過去の具体的な応答を想起させる文脈に置かれているが、ヘブライ語自体の継続的・特徴的な読みの可能性を残すため、時制を明示しにくい日本語の連体形を採用し、脚注で別の含みを明示した。
- source_word: בְּ/י֣וֹם צָֽרָתִ֔/י
  choice: 私の苦難の日に
  rationale: 「苦難の日」というヘブライ語の表現を保ちつつ、צָרָהを文脈に適した「苦難」とした。
- source_word: וַ/יְהִי֙ עִמָּדִ֔/י
  choice: 私と共にいてくださった
  rationale: 過去の神の臨在を表す。日本語では神を主語とする文脈にふさわしい敬意を「いてくださった」で自然に示した。
- source_word: בַּ/דֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי
  choice: 私が歩んだ道で
  rationale: דרךとהלךの具体的な道・歩行の比喩を保ちながら、日本語として簡潔にした。
theological_decisions:
- issue: אֵלの指示内容
  choice: 神のために
  alternative: その神のために
  rationale: 定冠詞と後続の分詞節による特定性は修飾節全体で十分に表れるため、不自然になりやすい「その神」を避けた。唯一神観など、本文以上の教義的説明は加えていない。
- issue: 分詞הָעֹנֶהの時間的意味
  choice: 私に答え[a]
  alternative: 私に答えてくださった／私に答えてくださる
  rationale: 具体的な過去の出来事と、神の特徴的・継続的な応答の双方が分詞に含まれ得る。日本語本文では時間を限定しない連体形を用い、その曖昧さを保った。
- issue: 神の同行の表現
  choice: 私と共にいてくださった
  alternative: 私と共におられた
  rationale: 神の臨在を率直に述べ、特定の摂理論的説明や介入の仕方を付加しない表現とした。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「さあ」で家族への勧奨を自然に示し、「苦難の日」「共にいてくださった」などの表現で原文の簡潔さと重みを維持した。
