- from: さあ、立ってベテルへ上って行こう。そしてそこで、私の苦難の日に私に答え[a]、私が歩んだ道で私と共にいてくださった神のために、祭壇を築こう。」
  to: さあ、立ってベテルへ上って行こう。そこで、私の苦難の日に私に答え[a]、私が歩んだ道で私と共にいてくださった神に、私は祭壇を築こう。」
  rationale: 本文の語順を整え、「私は」を補って、共同の移動の呼びかけと、ヤコブ自身が祭壇を築くという原文の一人称単数の意志を区別した。「神に」は祭壇の献呈先を自然に表す。分詞の時間的な幅は、時制を限定しない「答え」と脚注によって保持した。
