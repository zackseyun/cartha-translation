source:
  edition: WLC
  text: וַ/יִּסָּ֑עוּ וַ/יְהִ֣י חִתַּ֣ת אֱלֹהִ֗ים עַל הֶֽ/עָרִים֙ אֲשֶׁר֙ סְבִיבֹ֣תֵי/הֶ֔ם וְ/לֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/035/005.yaml
  text: Then they set out[a], and a terror from God fell on the cities that were around them, so that they did not pursue the sons of Jacob.
translation:
  language: ja
  text: 彼らが出発すると、神からの恐怖[a]が彼らの周囲の町々を襲い、その町々の人々はヤコブの息子たちを追跡しなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「神の恐怖」。これは神に由来する恐怖、神的な恐怖、あるいは非常に大きな恐怖を指すとも考えられる。
    reason: חִתַּת אֱלֹהִים の構文は、神を恐怖の源とする理解が文脈上もっとも自然である一方、形式的な属格・性質の表現や強意的用法と理解する余地もあるため。
lexical_decisions:
- source_word: וַיִּסָּעוּ
  choice: 彼らが旅立つと
  rationale: נסעの移動開始の意味と、物語を進める接続形を、自然な現代日本語で表した。「すると」へ続く時間的・叙事的関係も保っている。
- source_word: וַיְהִי חִתַּת אֱלֹהִים עַל
  choice: 神からの恐れが……を襲った
  rationale: היהとעלの組み合わせが表す出来事性を、日本語で自然な「襲った」とした。חִתַּתは強い恐れ・恐怖を示すが、文脈に合う簡潔な「恐れ」を選んだ。
- source_word: חִתַּת אֱלֹהִים
  choice: 神からの恐れ
  rationale: 連語は神を恐れの源と読むのが文脈上自然である一方、所有・性質を表す「神の恐れ」という形式的な理解も可能なため、脚注に残した。
- source_word: הֶעָרִים אֲשֶׁר סְבִיבֹתֵיהֶם
  choice: 周囲の町々
  rationale: ヤコブ一行の周りにある複数の町を、簡潔で明瞭な日本語にした。
- source_word: וְלֹא רָדְפוּ אַחֲרֵי
  choice: 追わなかった
  rationale: רדף אחריという「後を追う、追跡する」の慣用表現を、日本語では重複を避けて「追う」とした。恐れの結果であることは「ので」で示した。
- source_word: בְּנֵי יַעֲקֹב
  choice: ヤコブの息子たち
  rationale: 男性複数の親族名称をそのまま保ち、文脈上のヤコブの男の子どもたちを明確に示した。
theological_decisions:
- issue: חִתַּת אֱלֹהִים の連語の意味
  choice: 神からの恐れ
  alternative: 神の恐れ／非常に大きな恐れ
  rationale: この場面では神がヤコブ一行を守るため周辺の町々に恐れを生じさせたという起源の読みが自然である。ただし、ヘブライ語の連語自体は「神の恐れ」とも形式的に訳せ、אֱלֹהִיםを強意的に理解する可能性もあるため、本文で意味を断定しすぎず、主要な形式的代案を脚注に示した。
- issue: 追跡しなかった主体
  choice: その町々の人々
  alternative: 町々
  rationale: 原文は文法上「町々」を先行詞として複数動詞を用いるが、実際に追跡するのは住民である。日本語で不自然な擬人化を避けるため「その町々の人々」と明示し、意味を変えずに補った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「恐怖」よりも聖書叙述になじみ、過度に心理学的でない「恐れ」を採用した。原文の簡潔さを保ちつつ、追跡主体のみ日本語の自然さのため明示した。
