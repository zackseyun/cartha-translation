  yaml_path: translation/ot/genesis/035/025.yaml
  text: 'And the sons of Bilhah[a], Rachel’s female servant: Dan and Naphtali.'
translation:
  language: ja
  text: ラケルの女性の使用人[a]ビルハの息子たちは、ダンとナフタリである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「女奴隷」。ヘブライ語は社会的身分の低い女性の使用人を指し、文脈によっては女性奴隷を意味することもあります。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 息子たちは
  rationale: בְנֵיは「息子たち」の構成形で、系譜の次の一群を示す。接頭辞の接続詞は、続く列挙であることが日本語の文脈から明らかなため、独立した「また」を置かず自然な列挙として表した。
- source_word: בִלְהָה
  choice: ビルハ
  rationale: 固有名詞として、日本語聖書で一般的な音写を用いた。
- source_word: שִׁפְחַת
  choice: 女召使い
  rationale: שִׁפְחָהは社会的身分の低い女性の使用人または奴隷身分の女性を指し得る。「女召使い」は性別と奉仕者としての立場を明示しつつ、文脈だけでは確定しにくい法的身分を本文で過度に限定しない。
- source_word: רָחֵל
  choice: ラケルの
  rationale: 固有名詞を一般的な日本語表記で音写し、構成関係を助詞「の」で自然に表した。
- source_word: דָּן
  choice: ダン
  rationale: 固有名詞として一般的な日本語表記を用いた。
- source_word: וְ/נַפְתָּלִי
  choice: とナフタリ
  rationale: 接続詞וְを、日本語の名詞列挙に自然な「と」で表した。
