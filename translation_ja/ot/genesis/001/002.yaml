id: GEN.1.2
reference: Genesis 1:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָ/אָ֗רֶץ הָיְתָ֥ה תֹ֨הוּ֙ וָ/בֹ֔הוּ וְ/חֹ֖שֶׁךְ עַל פְּנֵ֣י תְה֑וֹם וְ/ר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל פְּנֵ֥י הַ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/002.yaml
  text: And the earth was formless and empty[a], and darkness was over the surface of the deep, and the Spirit of God was hovering over the surface of the waters.
translation:
  language: ja
  text: 地は形がなく、空虚で[a]、闇が深い水の面の上にあった。神の霊[b]が水の面の上を漂っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「荒れ果て、何もない」とも訳せる。
    reason: תֹהוּ וָבֹהוּは、形の定まらない荒廃・空虚な状態を表す対句であり、訳語には幅がある。
  - marker: b
    text: 「神からの風」または「神の風」とも訳せる。
    reason: רוּחַ אֱלֹהִיםは「神の霊」とも、神に由来する風とも解し得る。
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: 地は
  rationale: הָאָרֶץはここでは「地」。接頭辞וְは前節との連続を示すが、日本語では「そして地は」とすると不自然に重くなるため、自然な節のつながりとして無標で表した。
- source_word: הָיְתָה
  choice: 形がなく、何もなく
  rationale: היהの完了形はここでは状態を表す連結辞であり、「なった」ではなく「〜であった」に相当する。日本語では述語表現に組み込んだ。
- source_word: תֹהוּ וָבֹהוּ
  choice: 形がなく、何もなく
  rationale: 形の定まらない空虚な状態を表す対句。「形もなく、空虚で」より日常的で分かりやすく、二語の対応も保つ表現とした。
- source_word: וְחֹשֶׁךְ
  choice: 闇が
  rationale: 名詞חֹשֶׁךְを直接「闇」と訳し、後続の場所句と自然な日本語の文を構成した。
- source_word: עַל־פְּנֵי
  choice: 面を覆っていた／面を
  rationale: 直訳は「〜の面の上に」。闇については日本語として自然な「面を覆っていた」とし、霊については動詞「舞っていた」と結び「面を」とした。いずれも表面上方の空間関係を保つ。
- source_word: תְהוֹם
  choice: 深い水
  rationale: 原初の深い水域を指す。「深淵」では抽象的・神話的に響きやすいため、水の文脈が明確な「深い水」とした。
- source_word: וְרוּחַ אֱלֹהִים
  choice: 神の霊
  rationale: רוּחַには「霊」「風」「息」の意味があり、אֱלֹהִיםも属格または起源・強意に解し得る。本文では伝統的かつ文脈上有力な「神の霊」を採り、「神からの風／激しい風」の可能性を脚注に残した。
- source_word: מְרַחֶפֶת
  choice: 舞っていた
  rationale: 継続的に上方を動く分詞。日本語の「舞っていた」は、単に静止する「浮かんでいた」よりも動きを表しつつ、鳥のように羽ばたく語感もある。
- source_word: הַמָּיִם
  choice: 水
  rationale: ヘブライ語では複数形だが、日本語では物質名詞「水」が自然であり、宇宙的な水域の意味を損なわない。
theological_decisions:
- issue: הָיְתָהを状態「であった」と取るか、変化「となった」と取るか
  choice: 状態を表す
  alternative: 地は形がなく、何もないものとなった
  rationale: この文脈では状態を述べる連結辞として読むのが最も自然であり、変化が起きたという神学的再構成を本文に持ち込まない。
- issue: וְרוּחַ אֱלֹהִיםを神の霊と取るか、神からの風と取るか
  choice: 神の霊
  alternative: 神からの風／激しい風
  rationale: ヘブライ語には実質的な曖昧さがある。本文では有力で伝統的な人格的解釈を採用しつつ、気象的解釈を脚注に明記して緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、荘重さを保ちながら古風な「虚空」「淵の面」「運行していた」は避けた。脚注記号[a]は本文中に配置した。
