id: GEN.1.14
reference: Genesis 1:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הַבְדִּ֕יל בֵּ֥ין הַ/יּ֖וֹם וּ/בֵ֣ין הַ/לָּ֑יְלָה וְ/הָי֤וּ לְ/אֹתֹת֙ וּ/לְ/מ֣וֹעֲדִ֔ים וּ/לְ/יָמִ֖ים וְ/שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/014.yaml
  text: And God said[a], “Let there be lights in the expanse of the heavens to separate the day from the night, and let them be for signs and for appointed times[d][c][b], and for days and years.”
translation:
  language: ja
  text: 神は言われた。「昼と夜を分けるため、天の大空に光るものがあれ。それらは、しるしのため、定められた時[a]のため、また日と年のためとなれ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「季節」とも訳せる。ヘブライ語は「定められた時」を意味し、文脈によっては祭りの時を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאֹרֹת
  choice: 光るもの
  rationale: 光を放つ天体を指す語であり、「光」だけよりも光の担い手であることが明確になる。専門的な「発光体」を避け、現代日本語として自然にした。
- source_word: רָקִיעַ
  choice: 大空
  rationale: 広く張り渡された天空の領域を表す。古代の宇宙観を「天蓋」として必要以上に具体化せず、文脈に合う荘重さも保つ。
- source_word: הַשָּׁמַיִם
  choice: 天
  rationale: 創世記1章における天空の領域を、簡潔で文学的な日本語にした。「天の大空」で原文の連語を反映する。
- source_word: לְהַבְדִּיל
  choice: 分けるため
  rationale: 不定詞が目的を表すことと、創世記1章で繰り返される区分の主題を明確に伝える。
- source_word: בֵּין הַיּוֹם וּבֵין הַלַּיְלָה
  choice: 昼と夜を
  rationale: 日本語では「昼と夜との間を分ける」より「昼と夜を分ける」が自然で、意味も保たれる。
- source_word: לְאֹתֹת
  choice: しるしのため
  rationale: 天体が何らかの目印や徴候となる広い意味を保ち、特定の種類のしるしに限定しない。
- source_word: לְמוֹעֲדִים
  choice: 定められた時のため
  rationale: 季節、暦上の時、祭りの時を含み得る語の広がりを保ち、この文脈で祭儀だけに限定しない。
- source_word: לְיָמִים וְשָׁנִים
  choice: 日と年のため
  rationale: 原文に挙げられた時間単位を簡潔にそのまま表す。
- source_word: יְהִי ... וְהָיוּ
  choice: あれ……となれ
  rationale: 神の命令としての表現を保つ。「それらは」を補って複数形を日本語でも明示した。
theological_decisions:
- issue: 創造物語における מוֹעֲדִים の意味
  choice: 広い意味の「定められた時」
  alternative: 「季節」または「祭りの時」
  rationale: 後の箇所では祭りの期日を指す場合があるが、ここでは宇宙的な時間秩序が文脈である。広い訳語によって、季節や暦上の時を含む可能性と、後の祭儀的用法への響きの両方を残す。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の創造命令には簡潔で格調のある「～があれ」「～となれ」を採用した。「しるし」は漢字の「徴」より読みやすい平仮名表記とした。
