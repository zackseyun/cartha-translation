  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לַ/יַּבָּשָׁה֙ אֶ֔רֶץ וּ/לְ/מִקְוֵ֥ה הַ/מַּ֖יִם קָרָ֣א יַמִּ֑ים וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/010.yaml
  text: And God called the dry land Earth[a], and the gathering of the waters he called Seas. And God saw that it was good.
translation:
  language: ja
  text: 神は乾いた所を「地」[a]と名づけ、水の集まった所を「海」と名づけた。神は、それが良いと見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地」は「土地」「大地」とも訳せる。ヘブライ語 אֶרֶץ は普通名詞としても用いられるが、ここでは乾いた所に与えられた呼称となっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא / קָרָא
  choice: 名づけた
  rationale: ここでは呼称を与える行為を表す。日本語では「名づけた」が自然で、二つの命名が並行していることも明確になる。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 複数形の形を持つ語だが、ここでは単数の動詞を伴って唯一の創造者を指すため、「神」とした。
- source_word: לַיַּבָּשָׁה
  choice: 乾いた所
  rationale: 集められた水と対照される乾いた領域を指す。「乾いた所」は原意を保ちつつ、現代日本語として分かりやすい。
- source_word: אֶרֶץ
  choice: 「地」
  rationale: 「土地」「地」「大地」などを意味し得るが、ここでは乾いた所に与えられた呼称として、引用符を付けて「地」とした。
- source_word: מִקְוֵה הַמַּיִם
  choice: 水の集まった所
  rationale: 直訳的な「水の集まり」よりも、集められた水の領域を指すことが自然に伝わる表現とした。
- source_word: יַמִּים
  choice: 「海」
  rationale: ヘブライ語は複数形だが、日本語の総称的な「海」は複数の海域を含み得る。命名であることを引用符で示した。
- source_word: וַיַּרְא
  choice: 見た
  rationale: 創世記1章で繰り返される評価の定型句を、簡潔な基本語で再現した。
- source_word: כִּי טוֹב
  choice: それを良しと
  rationale: טוֹבの広い評価的意味を狭めず、創造記事の荘重な反復表現として日本語で定着した自然な言い回しを用いた。
theological_decisions:
- issue: אֶרֶץを普通名詞として訳すか、命名された名称として示すか
  choice: 命名された呼称であることを引用符付きの「地」で示す
  alternative: 普通名詞として「地」または「大地」とし、引用符を付けない
  rationale: 本文は明示的な命名の場面であるため、引用符によって文学的機能を示した。ただし、日本語では英語の大文字表記に相当する区別がなく、現代的な惑星名という含意も避けるため、脚注で普通名詞としても理解できることを示した。
- issue: כִּי טוֹבの評価対象
  choice: 「それを良しと見た」とし、指示対象を限定しすぎない
  alternative: 「そのようになったのは良かった」または「海と地を良いと見た」
  rationale: ヘブライ語には明示的な目的語がなく、直前の命名対象または成立した状態全体を指し得るため、その曖昧さを保った。
translation_notes:
  register: 明快な現代標準語を基調としつつ、創造記事の簡潔で荘重な調子を保った。「良しと見た」は現代でも理解できる定型的表現として採用し、神に対する敬語は用いず、聖書叙述として一貫した常体にした。
