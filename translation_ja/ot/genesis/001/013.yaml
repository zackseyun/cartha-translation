id: GEN.1.13
reference: Genesis 1:13
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שְׁלִישִֽׁי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/013.yaml
  text: And there was evening[a], and there was morning—the third day.
translation:
  language: ja
  text: こうして夕となり、朝となった。第三の日である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: となり／となった
  rationale: ここでは創造の日を締めくくる定型句を構成する。日本語では「夕があった」よりも「夕となり、朝となった」が自然であり、出来事の推移と反復の調子を保てる。
- source_word: עֶרֶב
  choice: 夕
  rationale: 夕方・夕暮れを表す語。創世記1章の反復句として簡潔で格調のある「夕」を用いた。
- source_word: בֹּקֶר
  choice: 朝
  rationale: 朝を表す通常の語であり、「夕」と対をなす簡潔な表現を保った。
- source_word: יוֹם
  choice: 日
  rationale: 創造の叙述における番号付きの日を示すため、直接的に「日」と訳した。
- source_word: שְׁלִישִׁי
  choice: 第三
  rationale: 序数「第三」をそのまま訳し、創造の順序を明確にした。
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: こうして夕となり、朝となった
  rationale: ヘブライ語では「そして……となった」が二度反復される。日本語では後半の述語にまとめるのではなく、「となり、朝となった」として反復をある程度保持しつつ、自然な定型句にした。「こうして」は物語の継続を示す接続辞וַの働きを文脈に即して表す。
theological_decisions:
- issue: 創造の日の長さや文学的機能について特定の解釈を持ち込まないこと
  choice: 第三の日である
  alternative: 三日目である
  rationale: 原文の「日＋第三」という番号付けを明瞭に表しつつ、この節自体が定めていない一日の長さや叙述の文学的性格について判断を加えない。「第三の日」は反復句としての荘重さも保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、創世記1章の反復的で荘重な調子を保った。「夕となり、朝となった」は一般読者に自然で、原文の二つのוַיְהִיの反復も可能な範囲で反映している。英語版の脚注は英語表現上の直訳との差を説明するものだが、日本語本文は原文の語順と構造を十分に表せるため、脚注は設けなかった。
