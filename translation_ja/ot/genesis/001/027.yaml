  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּבְרָ֨א אֱלֹהִ֤ים אֶת הָֽ/אָדָם֙ בְּ/צַלְמ֔/וֹ בְּ/צֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑/וֹ זָכָ֥ר וּ/נְקֵבָ֖ה בָּרָ֥א אֹתָֽ/ם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/027.yaml
  text: So God created man in his image[a]; in the image of God he created him; male and female he created them.
translation:
  language: ja
  text: 'こうして神は、人[a]をご自分のかたちに創造された。神のかたちにその人を創造し、男と女に、彼らを創造された。


    [a] 「人類」とも訳せる。ここでヘブライ語の「アダム」は単数形だが、人類全体を代表して指している。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人類」とも訳せる。ここでヘブライ語の「アダム」は単数形だが、人類全体を代表して指している。
    reason: 代表的単数である אָדָם の別訳と文法的含意を示すため。
lexical_decisions:
- source_word: וַיִּבְרָא / בָּרָא
  choice: 創造された
  rationale: 神による創造を表す標準的な訳語であり、原文で三度繰り返される動詞を同じ語で再現して、荘重な反復を保つ。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、ここでは単数の動詞と結びつき、イスラエルの唯一の神を指す。
- source_word: הָאָדָם
  choice: 人
  rationale: 単数形でありながら、後半の「男と女」「彼ら」が示すように、人類全体を代表している。日本語の「人」はこの代表的単数を比較的自然に保てる。
- source_word: בְּצַלְמוֹ
  choice: ご自分のかたちに
  rationale: 接尾辞は神を指す。「ご自分の」によって指示対象を明確にしつつ、בְּ と צֶלֶם の基本的な意味を保つ。
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: 神のかたちに
  rationale: 直前の句を言い直して強調する原文の並行表現を保つため、「かたち」を反復する。
- source_word: אֹתוֹ
  choice: その人を
  rationale: 代表的人類を指す男性単数代名詞である。日本語では「彼を」より誤解が少ない「その人を」とし、単数から複数への移行を保つ。
- source_word: זָכָר וּנְקֵבָה
  choice: 男と女として
  rationale: 原語は関係的な「夫と妻」ではなく性別を表す語である。現代日本語で人間について自然かつ明瞭な「男と女」を用いる。
- source_word: אֹתָם
  choice: 彼らを
  rationale: 単数で表された代表的人類から複数への意図的な移行を明示する。
theological_decisions:
- issue: 代表的人類を指す אָדָם の訳し方
  choice: 人
  alternative: 人類／その人／男
  rationale: 原文は אָדָם とそれを受ける代名詞を単数で置いた後、「男と女」「彼ら」と複数へ移る。「人」は特定の男性一人に限定せず、代表的単数と人類全体という緊張を保てる。「人類」という明示的な読みは脚注に残した。
- issue: 単数から複数への移行
  choice: 「その人」から「彼ら」への移行を明示
  alternative: 全体を「人類」「人々」で統一する
  rationale: 原文の単数 אֹתוֹ と複数 אֹתָם の対照は、代表としての人と、男と女から成る人間の複数性を結ぶ文学的・神学的特徴であるため、平板化しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、三度の「創造された」と二度の「かたち」を反復し、原文の荘重な詩的並行を保った。「ご自分」は神を指す再帰表現として自然で敬意ある語調を与える。
