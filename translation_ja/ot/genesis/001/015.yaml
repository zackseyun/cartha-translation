  text: וְ/הָי֤וּ לִ/מְאוֹרֹת֙ בִּ/רְקִ֣יעַ הַ/שָּׁמַ֔יִם לְ/הָאִ֖יר עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/015.yaml
  text: And let them be for lights in the expanse of the heavens to give light on the earth[b][a]. And it was so.
translation:
  language: ja
  text: そして、それらは、天の大空[b]にあって地を照らすための、光を放つもの[a]となれ。すると、そのとおりになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「光るもの」または「光源」。ヘブライ語は抽象的な光ではなく、光を与える物体を指す。
    reason: lexical_alternative
  - marker: b
    text: または「天の広がり」。ヘブライ語は、広がった空の領域を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: そして、それらは…となれ
  rationale: 形態上は完了形だが、直前から続く創造命令の文脈では意志・命令の力を受け継ぐ。日本語でも命令の連続として自然に表した。
- source_word: לִמְאוֹרֹת
  choice: 光を放つもの
  rationale: מָאוֹרは抽象的な「光」ではなく、光を与える物体・光源を指す。「光を放つもの」は平明であり、その区別を保てる。
- source_word: בִּרְקִיעַ הַשָּׁמַיִם
  choice: 天の大空
  rationale: רָקִיעַの広げられた空間という像を、古風すぎない慣用的な日本語で表した。「天」は複数形שָׁמַיִםの定型的な意味を文脈に即して伝える。
- source_word: לְהָאִיר
  choice: 照らすため
  rationale: 使役形の「光を生じさせる、光を与える」という意味を自然な日本語で表した。
- source_word: עַל הָאָרֶץ
  choice: 地を
  rationale: 照明の及ぶ対象としてのעַל הָאָרֶץを、日本語では「地を照らす」と簡潔かつ自然に表せる。
- source_word: וַיְהִי כֵן
  choice: すると、そのとおりになった
  rationale: 神の命令に続く成就の定型句として、出来事の推移と命令どおりの実現を明瞭に示す。
theological_decisions:
- issue: 創造の言葉の中でのוְהָיוּの意志・命令的な力
  choice: 「…となれ」と命令の継続として訳す
  alternative: 「…となる」と単純な未来・叙述として訳す
  rationale: 直前の命令構文と、後続する成就句との文学的構造を保つため。特定の教理を付加せず、神の任命の言葉としての機能を示す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、創造命令とその成就という荘重な反復を保った。「光を放つもの」によって、抽象的な光と発光体との語彙上の違いを示した。
