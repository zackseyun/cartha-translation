source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֮ אֶת הָ/רָקִיעַ֒ וַ/יַּבְדֵּ֗ל בֵּ֤ין הַ/מַּ֨יִם֙ אֲשֶׁר֙ מִ/תַּ֣חַת לָ/רָקִ֔יעַ וּ/בֵ֣ין הַ/מַּ֔יִם אֲשֶׁ֖ר מֵ/עַ֣ל לָ/רָקִ֑יעַ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/007.yaml
  text: So God made the expanse and separated the waters that were under the expanse from the waters that were above the expanse[a]. And it was so.
translation:
  language: ja
  text: 神は大空[a]を造り、大空の下にあった水と、大空の上にあった水とを分けた。そのようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「広がり」とも訳せる。伝統的には「天蓋」とも訳される。
    reason: רָקִיעַは広げられたものを指しうる。本文の「大空」は読みやすい訳語であり、脚注は伝統的訳語を含む代替的表現を示して、宇宙論的な形状を本文で断定しない。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造り
  rationale: עשהの基本義「造る、行う」のうち、創造の文脈に自然な「造る」を選んだ。より限定的な形成方法を含意しない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 創世記1章では単数形の動詞と結びつき、唯一の創造者を指すため、標準的に「神」とした。
- source_word: הָרָקִיעַ
  choice: 大空
  rationale: רָקִיעַは広げられたものを表す。「大空」は現代日本語で明瞭かつ文脈に自然であり、具体的な宇宙構造を断定しない。語の像と別訳は脚注に示した。
- source_word: וַיַּבְדֵּל
  choice: 分けた
  rationale: בדלの「分離する、区別する」という意味を、二つの水を隔てるこの文脈で自然な日本語にした。
- source_word: בֵּין ... וּבֵין
  choice: …と…とを
  rationale: 二者の間を区分するヘブライ語構文を、「分けた」と自然に結びつく日本語で表した。
- source_word: הַמַּיִם
  choice: 水
  rationale: מיםは形態上複数形だが集合的・物質的に用いられるため、日本語では自然な質量名詞「水」とした。
- source_word: אֲשֶׁר מִתַּחַת לָרָקִיעַ
  choice: 大空の下にある水
  rationale: מִתַּחַתの垂直的な位置関係を、後半の「上」と対になる明瞭な表現で示した。
- source_word: אֲשֶׁר מֵעַל לָרָקִיעַ
  choice: 大空の上にある水
  rationale: מֵעַלの位置関係を「上」と訳し、前半の「下」との対照を保った。
- source_word: וַיְהִי כֵן
  choice: そのようになった
  rationale: 神の命令が実現したことを示す創世記1章の反復句として、簡潔で自然な表現を用いた。
theological_decisions:
- issue: 創造記事における רָקִיעַ の宇宙論的含意
  choice: 大空
  alternative: 広がり／天蓋
  rationale: 「天蓋」は特定の形状を強く示し、「広がり」は語源的な像を伝える一方、日本語本文では対象物としてやや不自然になりうる。「大空」を本文に置き、脚注で可能な訳を示すことで、本文が明示しない宇宙構造を断定せず、原語の解釈上の幅を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「こうして」で叙述の連続性を示し、「下／上」「水／水」の対称性を保った。
