base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/023.yaml
  text: And there was evening[a], and there was morning—the fifth day.
translation:
  language: ja
  text: 夕となり、朝となった。第五の日である。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: となり／となった
  rationale: ここでは創造記事に反復される物語上の定型句を形作る。日本語として自然な「夕となり、朝となった」によって、出来事の推移と反復のリズムを保った。
- source_word: עֶרֶב
  choice: 夕
  rationale: 夕方を指す基本語。反復句の簡潔で荘重な調子を保つため「夕」とした。
- source_word: בֹקֶר
  choice: 朝
  rationale: 朝を指す基本語であり、「夕」との対句をそのまま保つ。
- source_word: יוֹם
  choice: 日
  rationale: 番号を付された創造の日を表すため、直接対応する「日」とした。期間の長さについて解釈を加えていない。
- source_word: חֲמִישִׁי
  choice: 第五
  rationale: 「日」を修飾する序数であり、正確に「第五」と訳した。
theological_decisions:
- issue: 創造の日の定型句が示す期間の性質
  choice: 「夕となり、朝となった。第五の日である」と、夕・朝および序数による日付けをそのまま保持する。
  alternative: 一日を明示的に二十四時間と解釈する、または時代・長期的期間と解釈して訳す。
  rationale: ヘブライ語本文は夕と朝の反復句と「第五の日」という呼称を記すが、後代の議論における期間の長さや文学的性質を翻訳自体で確定してはいないため。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、創世記1章に反復される簡潔で荘重な定型リズムを保持した。「あった」より自然な時間推移を示す「となり、朝となった」を採用し、節末は「第五の日である」と明瞭にした。
