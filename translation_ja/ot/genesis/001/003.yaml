lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 神は言われた
  rationale: 接続ワウを伴う物語叙述形で、出来事の進行を示す。日本語では節のつながりを文脈に委ね、「神は言われた」と自然に表した。神への敬意を示す一般的な尊敬表現を用いた。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 複数形の形態を持つが、ここでは単数の動詞と結び、一人の創造者を指すため、日本語の標準的な訳語「神」とした。
- source_word: יְהִי
  choice: 光よ、あれ
  rationale: היה の指令・意志を表す短縮形。創造を告げる簡潔で荘重な命令として、対象を明示する呼びかけを伴う日本語「光よ、あれ」とした。「光があるように」とする可能性も注で示した。
- source_word: אוֹר
  choice: 光
  rationale: 基本的な語義をそのまま採用し、特定の光源や比喩的意味には限定しなかった。
- source_word: וַיְהִי
  choice: すると、…があった
  rationale: 神の発言に続く即時の結果を報告する物語叙述形。日本語では「すると」で結果の連続性を示し、「あった」によって היה の表現を保った。
- source_word: אוֹר
  choice: 光
  rationale: 命令と成就の対応を際立たせる原文の反復を保った。
theological_decisions:
- issue: 神の創造命令の訳し方
  choice: 光よ、あれ
  alternative: 光があるように
  rationale: ヘブライ語の指令・意志形が持つ神の意志と命令の力を、簡潔で荘重な日本語で表した。願望だけに狭めず、同時に原文が文法上持つ意志表現の幅は脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、創造の宣言にふさわしい簡潔で荘重な調子を保った。「言われた」は過度に古風ではない尊敬表現。「光よ、あれ」は原文の短さと命令の力を再現するために採用した。
