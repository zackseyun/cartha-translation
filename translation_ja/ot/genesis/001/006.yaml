id: GEN.1.6
reference: Genesis 1:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּ/ת֣וֹךְ הַ/מָּ֑יִם וִ/יהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָ/מָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/006.yaml
  text: And God said[a], “Let there be an expanse in the midst of the waters[b], and let it separate water from water.”
translation:
  language: ja
  text: 神は言われた。「水のただ中に大空[a]があれ。そして、それは水と水とを隔てるものとなれ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「広がり」「天空」「天蓋」とも訳せる。ヘブライ語は、広げられたものを指す。古代の宇宙像をどこまで具体的に訳文へ反映するかによって訳し方が異なる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「水と水との間を隔てるものとなれ」。すなわち、一方の水域と他方の水域を分けるということ。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 神は言われた
  rationale: 物語を進める接続形の流れを自然な日本語で表した。「そして」を補わなくても、前後の連続性は保たれる。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 複数形の形を持つ語だが、ここでは単数の動詞と結び、一人の創造者を指すため。
- source_word: יְהִי
  choice: があれ
  rationale: 神の意志によって存在を生じさせる指示・宣言の力を、簡潔で荘重な現代日本語にした。
- source_word: רָקִיעַ
  choice: 大空
  rationale: 語源的には広げられたものを指し、ここでは水の間に設けられる広がりである。「大空」は日本語として自然で、本文で特定の宇宙構造に断定しすぎない。
- source_word: בְּתוֹךְ הַמָּיִם
  choice: 水のただ中に
  rationale: 原初の水に囲まれた位置を示す表現を、原文に近く明瞭に表した。
- source_word: וִיהִי מַבְדִּיל
  choice: それは…隔てるものとなれ
  rationale: 継続する指示の意味と、大空が果たす分離の機能の双方を表した。
- source_word: בֵּין מַיִם לָמָיִם
  choice: 水と水とを
  rationale: 直訳的な「水と水との間」を、日本語の動詞「隔てる」に自然につながる形で表し、二つの水域が区別される像を保った。
theological_decisions:
- issue: רָקִיעַ と古代の宇宙像との関係
  choice: 大空
  alternative: 広がり、天空、天蓋、固い大空
  rationale: この節は、水の間に広げられ、両者を隔てるものを神が造ると述べる。「大空」はその機能と広がりを保ちつつ、物質的な固さや特定の形状を本文で決めつけない。可能な具体的理解は脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、創造の宣言にふさわしい簡潔で格調ある調子と、原文の反復的な「水と水」の表現を保った。
