id: GEN.1.11
reference: Genesis 1:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָ/אָ֨רֶץ֙ דֶּ֔שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְ/מִינ֔/וֹ אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ עַל הָ/אָ֑רֶץ וַֽ/יְהִי כֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/011.yaml
  text: 'And God said[a], “Let the earth sprout vegetation: plants yielding seed, and fruit trees bearing fruit according to their kinds, with their seed in them[c][b], on the earth.” And it was so.'
translation:
  language: ja
  text: 神は言われた。「地は、植物、すなわち種を生じる草と、種類ごとに[b]実を結び、その中に種がある[c]果樹とを、地の上に芽生えさせよ[a]。」すると、そのようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地は植物を生え出させよ」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「その種類に従って」と単数形だが、さまざまな種類のそれぞれを指す。
    reason: lexical_alternative
  - marker: c
    text: 直訳「その種がその中にある」。「その中」が木を指すのか、その実を念頭に置くのかは明示されていない。
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּדְשֵׁא
  choice: 芽生えさせよ
  rationale: ヒフィル形の指令の力を保ち、地が植物を生じさせるという原因的な意味と、芽が出るという原文のイメージを自然な現代日本語で表した。
- source_word: דֶּשֶׁא
  choice: 植物
  rationale: 新鮮な緑の生長を集合的に指す広い語であり、「草」だけに狭めず、後続する草と果樹を包括する表現とした。
- source_word: עֵשֶׂב
  choice: 草
  rationale: 木本に対する草本性の植物を、一般読者に分かりやすい語で表した。「薬草」などの限定的な意味は避けた。
- source_word: מַזְרִיעַ זֶרַע
  choice: 種を生じる
  rationale: 分詞が示す持続的・特徴的な種子生産を、簡潔で自然な日本語にした。
- source_word: עֵץ פְּרִי
  choice: 果樹
  rationale: 実を結ぶ木の類を表す簡潔で一般的な現代日本語を選んだ。
- source_word: עֹשֶׂה פְּרִי
  choice: 実を結び
  rationale: 木が実を産するという農耕的な意味を、日本語として自然な慣用表現で伝えた。
- source_word: לְמִינוֹ
  choice: 種類ごとに
  rationale: 形態上は単数だが、個々の類に配分的に適用されるため、日本語では自然な「種類ごとに」とした。
- source_word: אֲשֶׁר זַרְעוֹ בוֹ
  choice: その中に種がある
  rationale: 単数形の代名詞を過度に特定せず、「その中」が果樹ないしその実を指し得る原文の簡潔さを保った。
- source_word: עַל הָאָרֶץ
  choice: 地の上に
  rationale: 場所を示す句を明示的に訳し、創造の舞台が地上であることを保った。
- source_word: וַיְהִי כֵן
  choice: すると、そのようになった
  rationale: 命令に続く成就を表す定型句として、荘重さを失わない自然な現代日本語にした。
theological_decisions:
- issue: 創造された植物の区分の範囲
  choice: 「植物」を総称とし、その内訳として種を生じる草と実を結ぶ果樹を示す。
  alternative: 「青草、種を生じる草、実を結ぶ木」と三つの独立した分類として訳す。
  rationale: דֶּשֶׁא は広い植物の生長を指し、後続語はその具体的な類を示すと読むのが文脈上自然である。ただし、現代の植物分類学を本文に持ち込まず、原文の現象的で大まかな区分を保った。
- issue: 「その中に種がある」の指示対象
  choice: 指示対象を本文で「実」に限定せず、「その中」と訳す。
  alternative: 「その実の中に種がある」と明示する。
  rationale: ヘブライ語の男性単数代名詞は直近の עֵץ（木）と形態上対応し得る一方、意味上は実の中の種を想起させる。本文ではこの余地を保ち、解釈を一つに固定しない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。長い列挙はダッシュで区切り、「植物」が後続する二群の総称であることを読み取りやすくした。神の発話と成就の簡潔なリズムを保ち、科学的な専門語や宗派的表現は避けた。
