base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/019.yaml
  text: And there was evening[a], and there was morning—the fourth day.
translation:
  language: ja
  text: 夕があり、朝があった。第四の日である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より形式的には、「そして、夕があり、朝があった。第四の日」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: となり／となった
  rationale: 創造の日を締めくくる反復句として、ヘブライ語の存在・生起を表す動詞を自然な日本語で示す。「過ぎた」など時間経過を明示する語は原文にないため避けた。
- source_word: עֶרֶב
  choice: 夕
  rationale: 夕方を意味する語。反復句の簡潔で荘重な調子を保つため「夕」とした。
- source_word: בֹּקֶר
  choice: 朝
  rationale: 朝を意味する直接的な訳語であり、「夕」と対をなす原文の簡潔な構造を保つ。
- source_word: יוֹם רְבִיעִי
  choice: 第四の日
  rationale: 冠詞のない名詞と序数の組み合わせを、文脈上特定された日として自然かつ原文に近く訳した。
theological_decisions:
- issue: 創造の日の反復句を、特定の創造年代観に結びつけずに訳すこと
  choice: こうして夕となり、朝となった。第四の日である。
  alternative: 夕があり、朝があった。第四の日。
  rationale: 「夕」と「朝」をそのまま保持しつつ、それが示す日の性質や長さについて解釈を付け加えない。
translation_notes:
  register: 明瞭な現代標準語を用い、創造記事の反復するリズムと簡潔な荘重さを保った。「こうして」は連続する物語の接続を自然に表す。脚注で、וַיְהִי の存在表現により近い形式的な訳を示した。
