id: GEN.1.25
reference: Genesis 1:25
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ אֱלֹהִים֩ אֶת חַיַּ֨ת הָ/אָ֜רֶץ לְ/מִינָ֗/הּ וְ/אֶת הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ וְ/אֵ֛ת כָּל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/025.yaml
  text: And God made the beasts of the earth according to their kinds[a], and the livestock according to their kinds, and every creeping thing of the ground according to its kind[c][b]. And God saw that it was good.
translation:
  language: ja
  text: 神は、地の野生動物をそれぞれの種類に従って[a]、家畜をそれぞれの種類に従って、また地面[c]を這うすべてのものをその種類に従って[b]造られた。神は、それが良いと見られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地の獣」。この表現は、家畜と区別される野生の動物を指す。
    reason: lexical_alternative
  - marker: b
    text: 「種類」は生き物の区分を表す語であり、現代生物学の分類上の「種」と必ずしも同じではない。
    reason: cultural_note
  - marker: c
    text: 別訳「地面を動き回るすべてのもの」。原文では、前半の「地」とここでの「地面」に異なる語が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造られた
  rationale: עשהの基本義「造る／行う」に基づく。創造の文脈に自然であり、原文にない形成方法などの含意を加えない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、この箇所では単数動詞を伴い、一人の創造者を指すため、日本語の標準的な訳語「神」とした。
- source_word: חַיַּת הָאָרֶץ
  choice: 地の野生動物
  rationale: 後続の家畜および地面を這うものと区別される、陸上の野生動物の部類を表す。現代の読者に明瞭な表現を採った。
- source_word: לְמִינָהּ / לְמִינֵהוּ
  choice: その種類に従って
  rationale: מיןは生き物の種類・区分を表す。現代生物学の分類階級を持ち込む「種」よりも、広がりを保つ「種類」が適切である。集合名詞を受ける単数接尾辞も「その」で自然に反映した。
- source_word: הַבְּהֵמָה
  choice: 家畜
  rationale: 文脈上、野生動物と区別される、主として人に飼われる比較的大きな陸上動物を指す。「牛」では範囲が狭すぎる。
- source_word: כָּל רֶמֶשׂ הָאֲדָמָה
  choice: 地面を這うすべてのもの
  rationale: רמשは地面近くを動く小動物を表す。「這う」はこの部類を簡潔に示し、האדמהは前半のהארץと区別して「地面」とした。
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: 神は、それを良しと見られた
  rationale: 創世記1章で繰り返される神の評価を、簡潔で格調を保つ現代日本語にした。「それを」は日本語として節の対象を明示する補いである。
theological_decisions:
- issue: 創造された生き物の区分と現代科学上の分類との関係
  choice: 種類
  alternative: 種（生物学上の species）
  rationale: מיןは本文固有の生き物の区分を示すが、現代生物学の「種」と同一であるとは本文から確定できないため、その同一視を避けた。
- issue: הָאָרֶץとהָאֲדָמָהの語彙上の区別
  choice: 地……地面
  alternative: どちらも「地」または「地上」
  rationale: 同じ節にある二つの関連語を訳し分け、原文の区別を平板化しないようにした。
- issue: 神の創造行為と評価の表現
  choice: 造られた……良しと見られた
  alternative: お造りになった……良いと判断された
  rationale: 敬意と格調を保ちながら、過度な敬語や原文以上に分析的な表現を避けた。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、創造物語にふさわしい簡潔さと格調を保った。神に対しては「造られた」「見られた」という穏やかな敬語を用いた。列挙の反復は原文の構造を反映し、「その種類に従って」を各部類について保持した。
