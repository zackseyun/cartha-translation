  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַ/מַּ֜יִם מִ/תַּ֤חַת הַ/שָּׁמַ֨יִם֙ אֶל מָק֣וֹם אֶחָ֔ד וְ/תֵרָאֶ֖ה הַ/יַּבָּשָׁ֑ה וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/009.yaml
  text: And God said[a], “Let the waters under the heavens be gathered into one place, and let the dry land appear.” And it was so.
translation:
  language: ja
  text: 神は言われた。「天[a]の下にある水は一つの場所に集まれ。そして、乾いた地が現れよ。」そして、そのようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「空」。ヘブライ語 שָׁמַיִם は、文脈により「天」または「空」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 神は言われた
  rationale: ワウ継続法による物語の進行は、日本語では文脈上自然に示されるため、機械的な「そして」を加えず、簡潔で格調ある叙述とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数形の動詞と結びつき、創造主である唯一の神を指すため、日本語の標準的な訳語とした。
- source_word: יִקָּווּ
  choice: 集まれ
  rationale: ニファル未完了形の指示・願望用法を、被造物に対する神の命令として自然な日本語で表した。形態上の受動性より、結果として一か所に集まることを明確にした。
- source_word: הַמַּיִם
  choice: 水
  rationale: ヘブライ語では複数形だが、日本語では集合体として「水」が自然であり、「水々」のような不自然な複数表現を避けた。
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: 天の下にある
  rationale: 水の所在を示す句として自然に訳した。שָׁמַיִם は「天」「空」の両義があり、本文では創造物としての格調を保つ「天」を採用し、別訳を脚注に示した。
- source_word: אֶל מָקוֹם אֶחָד
  choice: 一つの場所に
  rationale: אֶל の方向性と אֶחָד の明示的な「一つ」を保持し、水が集約される先を自然に表した。
- source_word: וְתֵרָאֶה
  choice: そして、乾いた地が現れよ
  rationale: ニファル形の指示用法を、先行する命令と並列する命令として保持した。「見えるようになれ」より「現れよ」が簡潔で自然である。
- source_word: הַיַּבָּשָׁה
  choice: 乾いた地
  rationale: 集められた水と対照をなす、露出した乾燥地を指す。後続の10節とのつながりを保ちつつ、「陸地」という命名前の語であることも尊重した。
- source_word: וַיְהִי כֵן
  choice: すると、そのようになった
  rationale: 神の命令が実現したことを告げる反復句。「そのようになった」により כֵן を明示し、「すると」で物語の進行と結果を自然に示した。
theological_decisions:
- issue: 創造記事における שָׁמַיִם の意味
  choice: 天
  alternative: 空
  rationale: 語は文脈により「天」または「空」を表し得る。本文では創造記事の格調と用語の連続性から「天」を採用するが、特定の宇宙論を決めつけないよう「空」を脚注の別訳として保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、創造命令には「集まれ」「現れよ」を用いて簡潔で荘重な調子を保った。ヘブライ語の反復的な物語様式は尊重しつつ、日本語で冗長になる接続語は必要な範囲に整えた。
