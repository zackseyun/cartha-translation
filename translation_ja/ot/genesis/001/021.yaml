    issue: 水が生き物で満ちたことを示す関係節の反映
    rationale: אֲשֶׁר שָׁרְצוּ הַמַּיִם は直訳すれば「水が群がらせた／満ちた」生き物であり、草案の「水に群がって動く」は水中で群がる生き物の動作として読める。
  - severity: low
