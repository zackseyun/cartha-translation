  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּבְרָ֣א אֱלֹהִ֔ים אֶת הַ/תַּנִּינִ֖ם הַ/גְּדֹלִ֑ים וְ/אֵ֣ת כָּל נֶ֣פֶשׁ הַֽ/חַיָּ֣ה הָֽ/רֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַ/מַּ֜יִם לְ/מִֽינֵ/הֶ֗ם וְ/אֵ֨ת כָּל ע֤וֹף כָּנָף֙ לְ/מִינֵ֔/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/021.yaml
  text: So God created the great sea creatures[a], and every living creature that moves, with which the waters swarmed, according to their kinds, and every winged bird according to its kind. And God saw that it was good.
translation:
  language: ja
  text: こうして神は、巨大な水の生き物[a]と、水に満ちている、動き回るすべての生き物を、それぞれの種類に従って、また、翼のあるすべての鳥を、その種類に従って創造された。神はそれを見て、良しとされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「巨大な海の怪物」または「巨大な竜」。ヘブライ語は、大きな蛇状の生き物や怪物的な生き物を指すことがある。ここでは水中の被造物という文脈から「水の生き物」とした。
    reason: 原語 תַּנִּינִם の語義の幅と、怪物的・竜的な含意を持つ別訳を示すため。
lexical_decisions:
- source_word: וַיִּבְרָא
  choice: 創造された
  rationale: 創世記1章で用いられる特徴的な創造の動詞 ברא を保ち、神を主語とする格調ある現代日本語とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 複数形の形を持つが、ここでは単数動詞を伴い、イスラエルの唯一の神を指すため。
- source_word: הַתַּנִּינִם הַגְּדֹלִים
  choice: 巨大な水の生き物
  rationale: תנינים は大きな蛇状の生き物や怪物的な生き物を指し得るが、ここでは水中の被造物という文脈を明示しつつ、神話的意味を本文に過度に持ち込まない訳とした。語の幅は脚注に残した。
- source_word: כָּל נֶפֶשׁ הַחַיָּה
  choice: すべての生き物
  rationale: נפש חיה はここでは神学的意味での「魂」ではなく、生命を持つ被造物を表すため、自然な日本語で訳した。
- source_word: הָרֹמֶשֶׂת
  choice: 動く
  rationale: רמש は這うことに限定されず、広く動き回る生き物を指し得るため。
- source_word: אֲשֶׁר שָׁרְצוּ הַמַּיִם
  choice: 水に群がって
  rationale: שרץ が表す、数多く湧き出て群がる様子を簡潔な現代日本語で表した。
- source_word: לְמִינֵהֶם / לְמִינֵהוּ
  choice: それぞれの種類ごとに
  rationale: 創造された生き物の分類を示す מין の反復を保ち、日本語として明瞭にした。
- source_word: כָּל עוֹף כָּנָף
  choice: 翼のあるすべての鳥
  rationale: עוף の飛ぶ生き物という範疇と、כנף が明示する翼をともに反映した。
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: 神は、それを良しと見られた
  rationale: 創世記1章で繰り返される評価の定型句として、簡潔で格調ある表現を用いた。
theological_decisions:
- issue: 創造物としての תַּנִּינִם が持ち得る怪物的・神話的含意
  choice: 巨大な水の生き物
  alternative: 巨大な海の怪物／巨大な竜
  rationale: 直接の文脈は水中生物の創造であり、本文では神話的連想を断定せず、これらも神によって創造された存在であるという叙述を明瞭にした。一方、原語が持つ怪物的・蛇状の生き物という語義は脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、創造記事にふさわしい簡潔で格調ある文体とした。「創造された」「良しと見られた」により、神を主語とする日本語聖書の自然な敬意を保った。原文では一つの長い文だが、日本語の可読性のため鳥の創造を別文にし、反復を補って統語関係を明確にした。
