  text: בְּ/רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַ/שָּׁמַ֖יִם וְ/אֵ֥ת הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/001.yaml
  text: In the beginning, when God created the heavens and the earth[a]—
translation:
  language: ja
  text: 初めに、神が天と地を創造したとき[a]――
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: 伝統的には、「初めに、神は天と地を創造された」と完結した文に訳される。ヘブライ語では、冠詞を伴わない בְּרֵאשִׁית（「初めに」）に定動詞 בָּרָא（「創造した」）が続くため、創世記2:4後半などと同様に、時間を示す従属節と読むこともできる。この読みでは、3節の「神は言われた。『光あれ』」を主節とみなす。
    reason: alternative_reading
lexical_decisions:
- source_word: בְּרֵאשִׁית
  choice: 初めに、……されたとき
  rationale: 冠詞を伴わない בְּרֵאשִׁית に定動詞 בָּרָא が続く構文を時間を示す従属節として表しつつ、רֵאשִׁית の「初め」という語義も明示した。
- source_word: בָּרָא
  choice: 創造された
  rationale: 神による創造を表す標準的な動詞であり、その方法を本文以上に限定しない自然で定着した訳語。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 語形は複数形だが、ここでは単数形の動詞 בָּרָא を取るため、単数の「神」を指す。
- source_word: אֵת
  choice: 訳出しない（直接目的語標識）
  rationale: 定目的語を示す文法標識で、日本語に直接対応する語はない。
- source_word: הַשָּׁמַיִם
  choice: 天
  rationale: 複数形の語だが、日本語では「天」が自然であり、「地」と組み合わされて被造世界全体を表す。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 「土地」とも訳し得るが、宇宙的な「天と地」という組み合わせでは「地」が適切。
theological_decisions:
- issue: 冒頭節の統語関係
  choice: 「初めに、神が天と地を創造されたとき——」という時間的従属節
  alternative: 「初めに、神は天と地を創造された。」という独立した完全文
  rationale: 冠詞のない בְּרֵאשִׁית、直後の定動詞 בָּרָא、創世記2:4後半やホセア1:2の類例から、従属節として読む可能性を本文に反映した。ただし伝統的な独立文の読みも真正な解釈として脚注に残し、統語上の曖昧さを解消し切らない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「天と地」は聖書的な総称表現として自然に保ち、節が後続文へ続くことを長いダッシュで示した。
