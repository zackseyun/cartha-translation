id: GEN.1.26
reference: Genesis 1:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּ/צַלְמֵ֖/נוּ כִּ/דְמוּתֵ֑/נוּ וְ/יִרְדּוּ֩ בִ/דְגַ֨ת הַ/יָּ֜ם וּ/בְ/ע֣וֹף הַ/שָּׁמַ֗יִם וּ/בַ/בְּהֵמָה֙ וּ/בְ/כָל הָ/אָ֔רֶץ וּ/בְ/כָל הָ/רֶ֖מֶשׂ הָֽ/רֹמֵ֥שׂ עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/026.yaml
  text: Then God said[a], “Let us make man in our image, according to our likeness[d][c][b], and let them rule over the fish of the sea and over the birds of the heavens and over the livestock and over all the earth and over every creeping thing that creeps on the earth.”
translation:
  language: ja
  text: 神は言われた。「われわれのかたちに、われわれに似せて、人を造ろう[a][b]。そして彼らに、海の魚、空の鳥、家畜、全地、また地の上を這うあらゆるものを治めさせよう[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人」は、ここでは人類を一つの類として表す集合的な単数です。そのため、後半では「彼ら」と複数で受けています。別訳「人類」。
    reason: lexical_alternative
  - marker: b
    text: 「われわれ…造ろう」「われわれの」という複数表現は、ヘブライ語のまま保っています。神ご自身の熟慮、天上の会議への呼びかけ、またキリスト教の正典全体から見て後に示される三位一体と調和する示唆など、理解の仕方があります。
    reason: alternative_reading
  - marker: c
    text: 別訳「支配させよう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進めるワウ連続形。日本語では文脈上、接続語を置かなくても自然に継起が伝わる。神への敬意を示す自然な現代語として尊敬形を用いた。
- source_word: נַעֲשֶׂה
  choice: 造ろう
  rationale: 一人称複数の意向形の力を保つ。「われわれ」を明示し、複数表現の解釈を本文で限定しない。
- source_word: אָדָם
  choice: 人
  rationale: ここでは人類を一つの類として表す集合的単数であり、後続する複数動詞「彼らに…治めさせよう」がその集合性を示す。現代日本語の「人」は代表的単数と人類一般の双方を自然に表せる。
- source_word: בְּצַלְמֵנוּ
  choice: われわれのかたちに
  rationale: צֶלֶם の像・形・表象という意味を保つ定着した表現であり、前置詞 ב の対応も簡潔に示す。
- source_word: כִּדְמוּתֵנוּ
  choice: われわれに似るものとして
  rationale: דְּמוּת の類似・似姿という意味と、כ の対応・類似の力を示しつつ、「かたち」と同一語にせず区別を保つ。
- source_word: וְיִרְדּוּ
  choice: そして彼らに…治めさせよう
  rationale: 三人称複数の指示・願望的な形を使役表現で自然に再現し、人が支配するようにとの神の意向を示す。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 空の鳥
  rationale: שָׁמַיִם はこの連語では鳥が飛ぶ領域を指すため、現代日本語で明瞭な「空」を採用した。
- source_word: בְּהֵמָה
  choice: 家畜
  rationale: ここでは陸上の飼育動物の類を指し、「獣」や「動物」より範囲が適切である。
- source_word: כָל הָאָרֶץ
  choice: 全地
  rationale: 創世記1章の宇宙的文脈を保ち、局地的な土地ではなく地全体を表す。
- source_word: כָל הָרֶמֶשׂ הָרֹמֵשׂ
  choice: 地の上を這うあらゆるもの
  rationale: 語根 רמש の反復を、日本語では動詞「這う」と包括表現「あらゆるもの」で明瞭に伝える。
theological_decisions:
- issue: 「われわれ…造ろう」「われわれの」に見られる複数表現
  choice: 複数形をそのまま保ち、本文では相手や理由を特定しない。
  alternative: 神の熟慮、天上の会議への呼びかけ、または後の三位一体啓示と調和する示唆と明示する。
  rationale: ヘブライ語の一人称複数を忠実に保持し、この節だけでは決定できない神学的緊張を翻訳で解消しないため。
- issue: 集合的単数 אָדָם と複数動詞の関係
  choice: 「人」と訳し、後半を「彼らに」として単数・複数の移行を保つ。
  alternative: 「人類」と訳して集合性を最初から明示する。
  rationale: 原文は人を一つの類として単数で提示した後、複数として扱う。この特徴を日本語でも見えるようにするため。
- issue: רדה の支配概念
  choice: 「治める」とし、委ねられた統治を表す。
  alternative: 「支配する」「治める権限を持つ」。
  rationale: 原語の統治・支配の力を弱めず、現代日本語で不要に圧制的な含意を加えない表現である。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神の発話には「われわれ」を用いて荘重さと原文の複数性を保持した。「全地」は創造記事の高い文体に合わせた。注記記号は関連する本文箇所に配置した。
