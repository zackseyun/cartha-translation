  text: וַ/יְבָ֣רֶךְ אֹתָ/ם֮ אֱלֹהִים֒ וַ/יֹּ֨אמֶר לָ/הֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּ/רְב֛וּ וּ/מִלְא֥וּ אֶת הָ/אָ֖רֶץ וְ/כִבְשֻׁ֑/הָ וּ/רְד֞וּ בִּ/דְגַ֤ת הַ/יָּם֙ וּ/בְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/בְ/כָל חַיָּ֖ה הָֽ/רֹמֶ֥שֶׂת עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/028.yaml
  text: And God blessed them[a], and God said to them, “Be fruitful, and multiply, and fill the earth, and subdue it, and rule over the fish of the sea, and over the birds of the heavens[b], and over every living thing that moves on the earth.”
translation:
  language: ja
  text: 神は彼らを祝福し、彼らに言われた。「子を生み、増え、地に満ちよ。地を従わせよ。そして、海の魚、空の鳥、地上を動く[a]すべての生き物を支配せよ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地上を動く」は「地上を這う」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「支配せよ」は「治めよ」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 祝福し
  rationale: ピエル形が表す、実際に祝福を授ける行為を簡潔かつ自然に表す。
- source_word: פְּרוּ וּרְבוּ
  choice: 生めよ、増えよ
  rationale: 繁殖して数を増すよう命じる二つの命令を、簡潔で格調ある日本語で区別して表す。
- source_word: וּמִלְאוּ אֶת־הָאָרֶץ
  choice: 地に満ちよ
  rationale: 創造物語全体の普遍的な範囲を保ち、局地的な「土地」に限定しない。
- source_word: וְכִבְשֻׁהָ
  choice: 地を従わせよ
  rationale: כבש の強い統御の意味を保ち、「世話をせよ」などの解釈的な弱め方を避ける。
- source_word: וּרְדוּ
  choice: 支配せよ
  rationale: רדה が表す統治権・支配権の行使を明確に伝える。
- source_word: בִּדְגַת הַיָּם
  choice: 海の魚
  rationale: 広く海洋生物一般とせず、原語の具体的な対象を保つ。
- source_word: בְעוֹף הַשָּׁמַיִם
  choice: 空の鳥
  rationale: שמים はここでは鳥が飛ぶ領域を指すため、現代日本語として自然な「空」とする。
- source_word: בְכָל־חַיָּה הָרֹמֶשֶׂת
  choice: 地の上を動くすべての生き物
  rationale: חיה の広さと רמש の地面を移動する意味を保ちつつ、特定の小動物だけに狭めない。
theological_decisions:
- issue: 人間に与えられた כבש と רדה の命令の強さ
  choice: 「従わせよ」「支配せよ」と強い統御表現を保持する
  alternative: 「世話をせよ」「管理せよ」
  rationale: 原語は単なる世話や管理より強い。搾取を肯定する意味を加えず、同時に本文の力を弱めない。
- issue: הָאָרֶץ の範囲
  choice: 「地」
  alternative: 「土地」
  rationale: 創世記1章の宇宙的な創造文脈では、特定地域の土地ではなく、天に対応する地全体を指す。
translation_notes:
  register: 明快な現代標準日本語を用い、命令部分では簡潔で荘重な「〜よ」形を採用した。接続の反復は日本語として自然になるよう整理しつつ、祝福、繁殖、地を満たすこと、地を従わせること、生き物を支配することという原文の展開を保持した。
