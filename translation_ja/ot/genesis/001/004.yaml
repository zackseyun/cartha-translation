  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/א֖וֹר כִּי ט֑וֹב וַ/יַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָ/א֖וֹר וּ/בֵ֥ין הַ/חֹֽשֶׁךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/004.yaml
  text: And God saw that the light was good[a], and God separated the light from the darkness.
translation:
  language: ja
  text: 神は、光が良いのをご覧になった。そして神は、光と闇を分けた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「光と闇を区別した」とも訳せる。ヘブライ語の動詞は、二つのものを分離することだけでなく、両者の間に区別を設けることも表しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: ご覧になった
  rationale: 基本義「見た」を保ちつつ、ここでは光を良いと認める評価的な知覚も文脈に含まれる。神を主語とする自然で敬意ある現代日本語とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 複数形の形を持つ名詞だが、ここでは単数の動詞と結びつき、創造者である唯一の神を指す。
- source_word: אֶת
  choice: 訳出しない
  rationale: ヘブライ語の直接目的語標識であり、日本語では語順と助詞によって機能を表す。
- source_word: הָאוֹר
  choice: 光
  rationale: 定冠詞を伴い、直前に生じた特定の光を指す。日本語では文脈上明白なので、不自然な指示語を加えず「光」とした。
- source_word: כִּי
  choice: が良いのを
  rationale: 神が見た内容を導く語として理解し、日本語では内容節「光が良いのを」で自然に表した。
- source_word: טוֹב
  choice: 良い
  rationale: 標準的な評価語であり、「美しい」「有益な」などに意味を狭めず、広い意味領域を保つ。
- source_word: וַיַּבְדֵּל
  choice: 分けた
  rationale: 「分離する、区別する」を意味する。宇宙の秩序づけという文脈に合う簡潔な表現であり、分離の仕方は特定しない。
- source_word: בֵּין ... וּבֵין
  choice: 光と闇を
  rationale: 字義的には「光の間と闇の間」だが、日本語では動詞「分ける」とともに「光と闇を分けた」とするのが自然で、二者の分離を正確に伝える。
- source_word: הַחֹשֶׁךְ
  choice: 闇
  rationale: 定冠詞を伴い、すでに言及された闇を指す。日本語では文脈により特定性が明らかなため「闇」とした。
theological_decisions:
- issue: 二つの節で繰り返される主語 אֱלֹהִים
  choice: 両方の節で「神」を明示する
  alternative: 後半を「そして、光と闇を分けた」として主語を省略する
  rationale: 原文は神という主語を明示的に繰り返しているため、そのリズムと強調を保持した。
- issue: 光と闇の分離の性質
  choice: 「分けた」とし、分離の仕方を限定しない
  alternative: 「隔てた」または「区別した」
  rationale: 本文は空間的、時間的、概念的のいずれの分離かを説明していない。その開かれた意味を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「ご覧になった」によって神を語る箇所にふさわしい敬意と品位を持たせた。後半では原文どおり「神」を反復し、簡潔で荘重な語調を保った。
