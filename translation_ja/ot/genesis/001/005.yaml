  text: וַ/יִּקְרָ֨א אֱלֹהִ֤ים לָ/אוֹר֙ י֔וֹם וְ/לַ/חֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם אֶחָֽד׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/005.yaml
  text: And God called the light Day[a], and the darkness he called Night. And there was evening, and there was morning—the first day.
translation:
  language: ja
  text: 神は光を「昼」と呼び、闇を「夜」と呼んだ。夕となり、朝となった。第一の日であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「日、一つ」。「第一」ではなく、基数の「一」が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び
  rationale: קרא は名を付ける構文で「呼ぶ／名づける」を意味する。ここでは原文の命名表現と反復を保てる自然な「呼ぶ」を採った。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 複数形の形を持つが、単数の動詞と一致し、創造者である唯一の神を指すため、日本語の標準的な「神」とした。
- source_word: לָאוֹר ... יוֹם
  choice: 光を「昼」と
  rationale: 前置詞 לְ を伴う命名構文を、日本語では「光を『昼』と呼ぶ」と自然に表現した。引用符により「昼」が与えられた名であることを示した。
- source_word: וְלַחֹשֶׁךְ ... לָיְלָה
  choice: 闇を「夜」と
  rationale: 前半と平行する命名構文として訳し、「闇」と「夜」の区別を保った。
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: 夕となり、朝となった
  rationale: וַיְהִי の反復と時間的推移を簡潔な現代日本語で表した。「夕があり」のような不自然な直訳は避けた。
- source_word: יוֹם אֶחָד
  choice: 第一の日
  rationale: 字義的には基数による「一日／一つの日」だが、創造の日々の順序を示す文脈では「第一の日」が明瞭である。原文の特徴は脚注に残した。
theological_decisions:
- issue: יוֹם אֶחָד の訳し方
  choice: 第一の日
  alternative: 一日／一つの日
  rationale: ヘブライ語は序数「第一」ではなく基数 אֶחָד「一」を用いるが、物語上の順序を日本語で自然に伝えるため本文は「第一の日」とした。解釈上注目され得る字義的表現は脚注で明示し、特定の創造理解には踏み込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神への敬意を自然に示すため後半の述語を「呼ばれた」としつつ、古語的な言い回しは避けた。命名された語にはかぎ括弧を用いた。
