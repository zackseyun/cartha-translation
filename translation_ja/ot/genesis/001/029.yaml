source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָ/כֶ֜ם אֶת כָּל עֵ֣שֶׂב זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל פְּנֵ֣י כָל הָ/אָ֔רֶץ וְ/אֶת כָּל הָ/עֵ֛ץ אֲשֶׁר בּ֥/וֹ פְרִי עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָ/כֶ֥ם יִֽהְיֶ֖ה לְ/אָכְלָֽה־־׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/029.yaml
  text: And God said[a], “Behold, I have given you every seed-bearing plant that is on the face of all the earth, and every tree in which is the fruit of a tree bearing seed[c][b]. It will be for you as food.”
translation:
  language: ja
  text: 神は言われた。「見よ、わたしは、全地の地の表にある、種をつけるすべての植物と、その中に種をつける実のあるすべての木を、あなたがたに与えた。それらはあなたがたの食物となる。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 見よ
  rationale: 後に続く神の授与の宣言へ注意を促す指示的な力を保ちつつ、聖書本文にふさわしい簡潔で格調ある日本語とした。
- source_word: נָתַתִּי
  choice: 与えた
  rationale: 完了した授与を表すヘブライ語完了形を素直に反映した。文脈上、その効力が現在にも及ぶことは明らかである。
- source_word: כָּל עֵשֶׂב זֹרֵעַ זֶרַע
  choice: 種を生じるすべての草
  rationale: עֵשֶׂב は草本性の植物・草を広く指すため「草」とし、分詞句は種を産出する性質を明確に表す「種を生じる」とした。
- source_word: אֲשֶׁר עַל פְּנֵי כָל הָאָרֶץ
  choice: 全地の面にある
  rationale: עַל־פְּנֵי の空間的表現を「面に」で保ち、כָּל הָאָרֶץ を「全地」と簡潔に訳した。
- source_word: כָּל הָעֵץ
  choice: すべての木
  rationale: כָּל と単数名詞による総称・分配的意味を自然な日本語で表した。
- source_word: אֲשֶׁר בּוֹ פְרִי עֵץ זֹרֵעַ זָרַע
  choice: 種を生じる実のなるすべての木
  rationale: 直訳的な「その中に、種を生じる木の実がある」より自然な日本語にしつつ、木に種を生じる実があるという原文の内容を保った。
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: それらはあなたがたの食物となる
  rationale: ヘブライ語では集合的な先行内容を単数形で受けるが、日本語では二種類の植物を指すことが明瞭になるよう「それら」とした。「食物となる」は用途・授与を自然に表す。
theological_decisions:
- issue: 食物として与えられた植物群を受ける代名詞の数
  choice: それら
  alternative: それ／これらすべて
  rationale: 原文の יִהְיֶה は単数形だが、集合的な一まとまりを受けうる。日本語では直前の「草」と「木」を自然に受け、意味を変えない複数指示「それら」を採用した。
translation_notes:
  register: 現代の一般読者に理解しやすい標準的な文体を用いながら、神の直接発話には簡潔な威厳を持たせた。「見よ」は日常語より格調があるが、原文の注意喚起を明示するため保持した。
