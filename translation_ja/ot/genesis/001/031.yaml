id: GEN.1.31
reference: Genesis 1:31
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֤רְא אֱלֹהִים֙ אֶת כָּל אֲשֶׁ֣ר עָשָׂ֔ה וְ/הִנֵּה ט֖וֹב מְאֹ֑ד וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם הַ/שִּׁשִּֽׁי־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/031.yaml
  text: And God saw all that he had made, and behold, it was very good. And there was evening and there was morning, the sixth day.
translation:
  language: ja
  text: 神は、ご自分が造ったすべてのものをご覧になった。見よ、それは非常に良かった。夕があり、朝があった。第六日。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: ご覧になった
  rationale: 基本義「見た」を保ちつつ、神を主語とする現代日本語として自然な敬意を表す。「評価した」と明示せず、文脈に含まれる評価的知覚を過度に限定しない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 創世記1章では単数動詞と結びつき、創造者である唯一の神を指すため、日本語の標準的な訳語とした。
- source_word: כָּל אֲשֶׁר עָשָׂה
  choice: ご自分が造ったすべてのもの
  rationale: 被造物の全体を指す表現として明瞭で自然。「造った」により、直前までに完了した創造の働きを文脈上十分に示す。
- source_word: וְהִנֵּה
  choice: 見よ
  rationale: 注意を引き、叙述に鮮明さを与える談話標識の力を保持する。現代語ではやや荘重だが、聖書本文として明瞭で簡潔。
- source_word: טוֹב מְאֹד
  choice: 非常に良かった
  rationale: טוֹבの広い意味を「良い」で保ち、מְאֹדの強意を「非常に」で表す。道徳的、美的、機能的のいずれかに限定しない。
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: 夕があり、朝があった
  rationale: 創世記1章の反復定型を簡潔に再現する。「夕となり、朝となった」よりも存在表現を直接保つ。
- source_word: יוֹם הַשִּׁשִּׁי
  choice: 第六日
  rationale: 定冠詞を伴う序数表現を、日本語で自然かつ簡潔な「第六日」とした。
theological_decisions:
- issue: טוֹב מְאֹדが示す創造の良さの性質
  choice: 非常に良かった
  alternative: この上なく良かった／完全に良かった
  rationale: 原文の広い肯定を保ち、それを道徳的完全性、美的価値、機能的適合性のいずれかに限定しない。「完全に」は原文以上の体系的含意を帯びうるため避けた。
- issue: 創造の日をめぐる議論と日締めの定型句
  choice: 夕があり、朝があった。第六日。
  alternative: 夕となり、朝となった。六日目である。
  rationale: 原文の語順と反復的な定型を保ち、日の長さや文学的機能について解釈を加えない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」と「第六日」で原文の荘重さと定型性を保持した。神への敬語は過剰に重ねず、「ご自分」「ご覧になった」に限定した。
