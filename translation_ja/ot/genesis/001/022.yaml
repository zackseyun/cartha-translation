  text: וַ/יְבָ֧רֶךְ אֹתָ֛/ם אֱלֹהִ֖ים לֵ/אמֹ֑ר פְּר֣וּ וּ/רְב֗וּ וּ/מִלְא֤וּ אֶת הַ/מַּ֨יִם֙ בַּ/יַּמִּ֔ים וְ/הָ/ע֖וֹף יִ֥רֶב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/022.yaml
  text: And God blessed them[a], saying, “Be fruitful and multiply, and fill the waters in the seas, and let the birds multiply on the earth.”
translation:
  language: ja
  text: 神は彼らを祝福して言われた。「子を生み、数を増やし、海の水を満たしなさい。鳥[a]も地上で数を増やすように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「鳥」と訳した語は、より広く「空を飛ぶ生き物」を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 祝福して
  rationale: ピエル形が表す、神が祝福を授ける行為を簡潔かつ自然に表した。
- source_word: אֹתָם
  choice: 彼らを
  rationale: 前節の海の生き物と飛ぶ生き物を受ける複数の目的語代名詞として訳した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数の動詞を伴い、創造者である唯一の神を指すため、日本語の標準的な訳語を用いた。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 直接話法を導く定型表現を、現代日本語として自然な形にした。
- source_word: פְּרוּ
  choice: 子を生み
  rationale: 繁殖して実り豊かになることを表す命令形であり、生き物について自然で明瞭な日本語とした。
- source_word: וּרְבוּ
  choice: 数を増し
  rationale: 数的に多くなることを明示し、「子を生み」との意味の重なりを避けながら原文の並列を保った。
- source_word: וּמִלְאוּ
  choice: 満たせ
  rationale: מלא の命令形を直接的に訳し、原文の祝福に含まれる命令的な形を保った。
- source_word: אֶת הַמַּיִם בַּיַּמִּים
  choice: 海の水を
  rationale: 直訳的な「海々にある水」を避けつつ、水と海の両要素を簡潔で自然な日本語に収めた。
- source_word: וְהָעוֹף
  choice: 鳥
  rationale: 集合的単数として扱い、文脈上もっとも自然な訳語を採用した。ただし語義がより広い可能性は脚注に示した。
- source_word: יִרֶב
  choice: 数を増せ
  rationale: 単なる未来予告にせず、未完了形の意志・願望的な力を命令形によって表し、祝福と命令の緊張を保った。
- source_word: בָּאָרֶץ
  choice: 地上で
  rationale: 鳥が増える領域を指す表現として、簡潔で自然な訳語を用いた。
theological_decisions:
- issue: 祝福の発話が命令か予告か
  choice: 祝福の中で語られる命令・意志として、「子を生み、数を増し……満たせ」「数を増せ」と訳した。
  alternative: すべてを未来の予告として「子を生み、数を増し……満たすようになる」「鳥も増える」と訳す。
  rationale: 原文は祝福を述べた後、命令形と意志・願望的な未完了形を用いる。命令だけ、または予告だけに平板化せず、祝福が命令的な言葉として与えられる緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、創造物語にふさわしい簡潔で荘重な調子を保った。「子を生み」は生き物への語りかけとして自然であり、「数を増す」によって二つの動詞の区別を示した。
