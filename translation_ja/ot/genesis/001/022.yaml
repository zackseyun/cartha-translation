  terminology: 「神」「祝福」「海」「地上」は適切である。「鳥」はこの文脈では自然な代表訳であり、עוֹףがより広く飛ぶ生き物を指し得ることを脚注で示す処置も適切である。「子を生み」は動物一般について用いうる表現で、פְּרוּの生殖・繁殖の含意を具体化している。
