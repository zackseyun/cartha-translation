  text: וְ/לִ/מְשֹׁל֙ בַּ/יּ֣וֹם וּ/בַ/לַּ֔יְלָה וּֽ/לֲ/הַבְדִּ֔יל בֵּ֥ין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/018.yaml
  text: and to rule over the day and over the night[a], and to separate the light from the darkness. And God saw that it was good.
translation:
  language: ja
  text: また、昼と夜を治め、光と闇を分ける[a]ためであった。神はそれを見て、よしとされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の訳：「光と闇を区別する」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/מְשֹׁל
  choice: また、……治め
  rationale: 接続詞と前置詞を伴う不定詞は、前節から続く目的・役割を表す。「治める」は、天体に与えられた統治的機能を保ちつつ、独立した神的支配者であるかのような含みを加えない。
- source_word: בַּ/יּוֹם וּ/בַ/לַּיְלָה
  choice: 昼と夜を
  rationale: 定冠詞を伴う対句を、自然な現代日本語の並列で表した。「昼間と夜間」より簡潔で、創造物語の格調にも合う。
- source_word: וּֽ/לֲ/הַבְדִּיל
  choice: 分ける
  rationale: בדלが創世記1章で繰り返し示す、神によって設けられる分離・区分を明確に表す。「区別する」も可能なので脚注に残した。
- source_word: בֵּין הָ/א֖וֹר וּ/בֵ֣ין הַ/חֹ֑שֶׁךְ
  choice: 光と闇を
  rationale: ヘブライ語は「光と闇との間を」という構造だが、日本語では「光と闇を分ける」が自然であり、両者の分離という意味を保つ。
- source_word: וַ/יַּ֥רְא אֱלֹהִ֖ים
  choice: 神は見て
  rationale: 物語を進める接続形と、創世記1章で反復される「神が見る」という表現を簡潔に保った。
- source_word: כִּי טֽוֹב
  choice: それを良しとされた
  rationale: טובが含む良さ、適切さ、創造秩序への適合を狭めずに表す。「良し」は反復句として格調があり、現代日本語でも理解できる。
theological_decisions:
- issue: 天体が昼夜を「治める」という機能
  choice: 天体に、神の創造秩序の中で昼と夜を治める役割が与えられたと読める表現を保った。
  alternative: 「支配する」など、天体が独立した権力や神性を持つかのようにも響き得る表現。
  rationale: משלの統治的な語感は「治める」で保持する一方、文脈上、それらを造り配置し、良しと見る主体が神であることをそのまま示した。
- issue: 「良い」と見ることの意味
  choice: 神が被造世界を見て「良し」とされたという評価の表現を保った。
  alternative: 「美しかった」「役に立った」など、טובの意味を美的価値または実用性だけに限定する訳。
  rationale: טובには良さ、適切さ、望ましさが重なっているため、一つの側面に限定しなかった。
translation_notes:
  register: 明快な現代標準日本語を基調としつつ、創世記1章の反復的で荘重な語調を保つため、「治める」「良しとされた」を用いた。「ためであった」は前節から続くヘブライ語の目的を表す不定詞構文を、日本語の節として読める形にした。
