  text: וּֽ/לְ/כָל חַיַּ֣ת הָ֠/אָרֶץ וּ/לְ/כָל ע֨וֹף הַ/שָּׁמַ֜יִם וּ/לְ/כֹ֣ל רוֹמֵ֣שׂ עַל הָ/אָ֗רֶץ אֲשֶׁר בּ/וֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת כָּל יֶ֥רֶק עֵ֖שֶׂב לְ/אָכְלָ֑ה וַֽ/יְהִי כֵֽן־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/030.yaml
  text: And to every beast of the earth[a], and to every bird of the heavens, and to everything that creeps on the earth in which there is a living creature, every green plant is for food[c][b]. And it was so.
translation:
  language: ja
  text: また、地のすべての動物、空のすべての鳥、地の上を這うすべてのもの、すなわち生き物であるものには[a]、食物としてあらゆる緑の植物を与えた[b]。そのようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生き物であるもの」は、直訳すれば「その中に生きたネフェシュがあるもの」。ヘブライ語のネフェシュ・ハヤーは、ここでは「生き物」「命あるもの」を表す。
    reason: lexical_alternative
  - marker: b
    text: 「与えた」は前節から補った。この節のヘブライ語には動詞がなく、前節の「わたしは与えた」が引き続き働いている。
    reason: ellipsis_clarification
lexical_decisions:
- source_word: חַיַּת הָאָרֶץ
  choice: 地のすべての動物
  rationale: חַיָּהはここで陸上動物の総称。現代日本語の「動物」は範囲を明確に伝え、「獣」による野生動物への限定を避ける。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 空のすべての鳥
  rationale: עוֹףは飛ぶ生き物を広く指し得るが、創世記1章の文脈では「鳥」が明瞭で自然。「空」は日本語でשָׁמַיִםの領域を自然に表す。
- source_word: כֹל רוֹמֵשׂ עַל הָאָרֶץ
  choice: 地の上を這うものすべて
  rationale: רוֹמֵשׂの具体的な動きのイメージを「這う」で保ち、単なる「動くもの」へ広げすぎない。
- source_word: אֲשֶׁר בּוֹ נֶפֶשׁ חַיָּה
  choice: その内に生きるいのちがあるもの
  rationale: נֶפֶשׁ חַיָּהを、別のヘブライ語句である「いのちの息」と混同せず、「生き物」と「生きるいのち」の双方の含みを保つ表現とした。
- source_word: כָּל יֶרֶק עֵשֶׂב
  choice: あらゆる緑の草
  rationale: יֶרֶק עֵשֶׂבは食物となる緑の植物・草本を表す。「緑の草」は簡潔で、創造物としての具体性を保つ。
- source_word: לְאָכְלָה
  choice: 食物として
  rationale: 目的・用途を示すלְを自然な日本語で表した。
- source_word: וַיְהִי כֵן
  choice: そのようになった
  rationale: 創世記1章で繰り返される成就の定型句を、明瞭で荘重な現代日本語にした。
theological_decisions:
- issue: 動物についてのנֶפֶשׁ חַיָּהの訳し方
  choice: その内に生きるいのちがあるもの
  alternative: 生き物であるもの／その内に生きた魂があるもの
  rationale: この句は動物にも用いられ、単に人間固有の霊魂を意味しない。一方、「いのちの息」はנִשְׁמַת חַיִּיםという別の句なので採用しない。本文と脚注で語義上の幅を示した。
- issue: 前節から省略されている動詞の補充
  choice: 「与えた」を本文に補う
  alternative: 「あらゆる緑の草は食物である」と動詞を補わずに訳す
  rationale: 30節のヘブライ語は29節のנָתַתִּי（私は与えた）を受ける省略構文である。日本語で文を完結させ、連続する神の発言として自然にするため補ったが、補充であることを脚注で明示した。
translation_notes:
  register: 明瞭な現代標準語を用いながら、創造記事にふさわしい簡潔で荘重な調子を保った。「いのちの息」という別句との混同を避け、ヘブライ語の省略構文は日本語として補いつつ脚注で透明性を確保した。
