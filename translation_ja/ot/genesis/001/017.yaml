  text: וַ/יִּתֵּ֥ן אֹתָ֛/ם אֱלֹהִ֖ים בִּ/רְקִ֣יעַ הַ/שָּׁמָ֑יִם לְ/הָאִ֖יר עַל הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/017.yaml
  text: And God set them in the expanse of the heavens to give light on the earth[a].
translation:
  language: ja
  text: 神はそれらを天の大空[a]に置き、地を照らすようにされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天の広がりに」。
    reason: רָקִיעַには「広がり」と訳し得る語義があり、「大空」と異なる表現上の可能性を示すため。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 置き
  rationale: נתןは基本的に「与える、置く」を意味する。ここでは天体を所定の場所に配置する文脈なので、自然で明確な「置く」とした。
- source_word: אֹתָם
  choice: それらを
  rationale: 前節の二つの大きな光るものと星々を受ける複数の直接目的語代名詞であり、「それらを」と訳した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形は複数形だが、創世記1章では単数の動詞を伴い、創造者である唯一の神を指すため、「神」とした。
- source_word: בִּרְקִיעַ הַשָּׁמָיִם
  choice: 天の大空に
  rationale: רָקִיעַは広く延べ広げられた空間を表す。「天の大空」は古代の表現を保ちつつ、特定の物質的構造を断定せず、現代日本語として理解しやすい。
- source_word: לְהָאִיר
  choice: 照らすように
  rationale: אורのヒフィル形は「光を与える、照らす」という使役的意味を持つ。日本語では目的を自然に示す「照らすように」とした。
- source_word: עַל הָאָרֶץ
  choice: 地を
  rationale: 前置詞עַלはここでは光が及ぶ対象を示す。日本語では「地を照らす」が最も自然で、意味も明確である。
theological_decisions:
- issue: 創造記事におけるרָקִיעַの宇宙論的表現
  choice: 「大空」と訳し、本文を「天の大空」とした。
  alternative: 「天の広がり」「天の丸天井」
  rationale: 「大空」は語の広がりを示す意味と創造記事の荘重さを保ちながら、「丸天井」のように特定の宇宙構造を断定せず、また現代科学の用語へ置き換えることもしない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、創造記事にふさわしい簡潔で荘重な調子を保った。「置き」と「された」を組み合わせ、配置と目的の関係を自然に表現した。
