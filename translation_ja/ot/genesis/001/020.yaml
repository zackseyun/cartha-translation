source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַ/מַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְ/עוֹף֙ יְעוֹפֵ֣ף עַל הָ/אָ֔רֶץ עַל פְּנֵ֖י רְקִ֥יעַ הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/020.yaml
  text: And God said[a], “Let the waters swarm with swarms of living creatures[c][b], and let birds fly above the earth across the face of the expanse of the heavens.”
translation:
  language: ja
  text: 神は言われた。「水は、生き物の群れで満ちあふれよ[a]。また、空を飛ぶ生き物[b]は、地の上、天の大空[c]を飛べ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「群がる」という動詞と同じ語根の名詞を重ねており、生き物が豊かに群がることを強調している。
    reason: lexical_alternative
  - marker: b
    text: 「鳥」とも訳せる。ヘブライ語は、鳥に限らず空を飛ぶ生き物を広く指すことがある。
    reason: lexical_alternative
  - marker: c
    text: 「広がり」「天空」とも訳せる。伝統的には「大空」または「蒼穹」と訳されてきた。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 神は言われた
  rationale: 物語を進める接続形を日本語では自然な連続叙述として表し、神の発言を荘重かつ明瞭に示す。
- source_word: יִשְׁרְצוּ הַמַּיִם שֶׁרֶץ
  choice: 水は、生き物の群れで満ちあふれよ
  rationale: 同根の動詞と名詞による「群がるものを群がらせる」という強調を、現代日本語で理解しやすく、豊かな増殖を伝える表現にした。
- source_word: נֶפֶשׁ חַיָּה
  choice: 生き物
  rationale: ここでは生命ある動物を指し、「魂」という後代の神学的含意を不必要に持ち込まない。
- source_word: וְעוֹף
  choice: また、空飛ぶもの
  rationale: עוֹףは鳥類に限らず飛ぶ生き物を広く指し得るため、原語の範囲を保つ表現を採った。
- source_word: יְעוֹפֵף
  choice: 飛べ
  rationale: 文脈上の意志・命令的用法を簡潔に表す。
- source_word: עַל הָאָרֶץ
  choice: 地の上
  rationale: 飛翔の文脈におけるעַלの空間的意味を素直に表す。
- source_word: עַל פְּנֵי רְקִיעַ הַשָּׁמָיִם
  choice: 天の大空を
  rationale: 直訳的な「天の大空の面を」は日本語として不自然なため、視界に広がる大空を飛ぶという空間像を自然に表した。
- source_word: רְקִיעַ
  choice: 大空
  rationale: 創世記1章の空間的広がりを、古風すぎず特定の宇宙像に限定しない現代日本語で表す。
theological_decisions:
- issue: נֶפֶשׁ חַיָּהを被造物についてどう訳すか
  choice: 生き物
  alternative: 生きた魂／生きるもの
  rationale: この句はここで生命ある動物を表しており、魂に関する技術的・教理的主張として限定しない。
- issue: רְקִיעַの宇宙論的含意
  choice: 大空
  alternative: 広がり／天空のドーム
  rationale: 原語が示す天の広がりを保ちつつ、本文だけでは確定しない特定の物質的構造を訳文に織り込まない。
- issue: עוֹףの指示範囲
  choice: 空飛ぶもの
  alternative: 鳥
  rationale: 原語は鳥を中心としながら、飛翔する生き物をより広く含み得るため、その曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、創造の宣言にふさわしい簡潔で dignified な調子を保った。「満ちあふれよ」によって原語の同根語反復の力を自然に再現し、「空飛ぶもの」で原語の指示範囲を狭めないようにした。
