id: GEN.1.8
reference: Genesis 1:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א אֱלֹהִ֛ים לָֽ/רָקִ֖יעַ שָׁמָ֑יִם וַֽ/יְהִי עֶ֥רֶב וַֽ/יְהִי בֹ֖קֶר י֥וֹם שֵׁנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/008.yaml
  text: And God called the expanse Heaven[a]. And there was evening[b], and there was morning—the second day.
translation:
  language: ja
  text: 神はその大空[a]を「天」[b]と名づけた。夕となり、朝となった。第二の日である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大空」に当たるヘブライ語は、広げられたもの、広がりを意味する。「広がり」「天空」とも訳せる。伝統的には「蒼穹」と訳されることもある。
    reason: lexical_alternative
  - marker: b
    text: 「天」に当たるヘブライ語は、「空」または「もろもろの天」とも訳せる。ここでは神が大空に与えた名称である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 名づけた
  rationale: 前置詞 לְ を伴う קרא は、ここでは呼称を与えることを表す。「呼んだ」よりも命名の意味が明確で、現代日本語として自然である。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 創世記1章では単数動詞と一致し、唯一の創造者を指すため、日本語の標準的な訳語「神」とした。
- source_word: לָרָקִיעַ
  choice: その大空
  rationale: רָקִיעַ は広げられたもの、広がりを指す。「大空」は創造物としての天空を自然かつ格調を保って表し、物質的な『ドーム』と断定しない。定冠詞は文脈上すでに造られたものを指す「その」で表した。
- source_word: שָׁמָיִם
  choice: 「天」
  rationale: ここでは神が大空に与える名称なので、命名であることをかぎ括弧で示した。「天」は「空」より格調を保ちつつ、後代の宇宙観や神の住まいだけを意味すると限定しない。
- source_word: וַיְהִי עֶרֶב וַיְהִי בֹקֶר
  choice: 夕となり、朝となった
  rationale: 反復される日ごとの定型句を、物語の推移を保ちながら簡潔で自然な日本語にした。
- source_word: יוֹם שֵׁנִי
  choice: 第二の日である
  rationale: ヘブライ語では שֵׁנִי に冠詞がないが、創造の日々の順序を示す序数として機能する。簡潔で荘重な定型表現とした。
theological_decisions:
- issue: שָׁמָיִם を רָקִיעַ に与えられた名称としてどう訳すか
  choice: 「天」
  alternative: 「空」または「もろもろの天」
  rationale: 本文は神による命名を述べる。「天」は創造物としての天空を指し得る一方、神の住まいという後代的な意味だけに限定しない。語の意味の幅は脚注に残した。
- issue: רָקִיעַ の宇宙論的形状を訳文で確定するか
  choice: 「大空」とし、形状や材質を断定しない
  alternative: 「天蓋」または伝統的な「蒼穹」
  rationale: 語根には打ち広げる・延べ広げるという含意があるが、この節だけから硬いドーム状構造を断定しない。「大空」は本文の詩的・神学的緊張を保ちながら普通の読者にも理解しやすい。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、創造記事の簡潔で荘重な調子を保った。「名づけた」とかぎ括弧によって命名の行為を明示し、反復句は「夕となり、朝となった」と統一しやすい形にした。
