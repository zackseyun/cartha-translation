id: GEN.1.12
reference: Genesis 1:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תּוֹצֵ֨א הָ/אָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֨רַע֙ לְ/מִינֵ֔/הוּ וְ/עֵ֧ץ עֹֽשֶׂה פְּרִ֛י אֲשֶׁ֥ר זַרְע/וֹ ב֖/וֹ לְ/מִינֵ֑/הוּ וַ/יַּ֥רְא אֱלֹהִ֖ים כִּי טֽוֹב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/012.yaml
  text: And the earth brought forth vegetation[a], plants yielding seed according to their kinds, and trees bearing fruit in which is their seed, according to their kinds[b]. And God saw that it was good.
translation:
  language: ja
  text: 地は草木[a]を生え出させた。すなわち、種類に応じて種をつける草と、種類に応じて、種を内に含む実を結ぶ木[b]とを生え出させた。神はそれを見て、良しとされた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「草木」は、芽生え出る緑の植物全般を指す集合的な表現。単に「草」だけを意味するのではない。
    reason: lexical_scope
  - marker: b
    text: 「種類に応じて」の「種類」は、創造されたものの区分を表す。現代生物学の専門用語としての「種」を意味するとは限らない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹצֵא
  choice: 生じさせた
  rationale: 使役形の意味を保ち、地が草木を生え出させたことを、現代日本語で自然に表す。
- source_word: דֶּשֶׁא
  choice: 草木
  rationale: 草だけに限定されない、芽生える緑の植物全般を指す集合的な語として訳した。
- source_word: עֵשֶׂב מַזְרִיעַ זֶרַע
  choice: 種を生じる草
  rationale: 植物が種を作る継続的な性質を簡潔に表し、「草」はここで草本類を広く指す。
- source_word: לְמִינֵהוּ
  choice: 種類に応じて
  rationale: 古代本文における区分・類別を表し、現代生物学の専門用語である「種（species）」との混同を避ける。
- source_word: וְעֵץ עֹשֶׂה פְּרִי אֲשֶׁר זַרְעוֹ בוֹ
  choice: 種がその実の中にある実を結ぶ木
  rationale: 種が内部にあるという関係節を明示しつつ、עֵץ の集合的な意味と結実の描写を自然な日本語にした。
- source_word: וַיַּרְא אֱלֹהִים כִּי טוֹב
  choice: 神はそれを見て、良しとされた
  rationale: 創世記1章で繰り返される評価の句を、簡潔で格調ある現代日本語として統一的に表す。
theological_decisions:
- issue: 創造されたものの区分を現代生物学上の分類として読ませるか
  choice: 種類に応じて
  alternative: 種ごとに／生物学上の種に従って
  rationale: מִין は本文中の種類・区分を指すが、現代の分類学的な「種」と同一であるとは本文から断定できないため、後代の科学的・論争的概念を持ち込まない。
- issue: 神の評価を「良いと認めた」と意訳するか
  choice: 見て、良しとされた
  alternative: 良いと認められた
  rationale: 「見た」と「良い」の両要素を保ち、神の認識か宣言かという含みを過度に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、創造物語の簡潔さと反復的な格調を保った。「すなわち」で集合語「草木」と後続する二分類との関係を明確にした。
