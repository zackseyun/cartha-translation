  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָ/אָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְ/מִינָ֔/הּ בְּהֵמָ֥ה וָ/רֶ֛מֶשׂ וְ/חַֽיְתוֹ אֶ֖רֶץ לְ/מִינָ֑/הּ וַֽ/יְהִי כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/024.yaml
  text: 'And God said[a], “Let the earth bring forth living creatures according to their kinds: livestock, creeping things, and wild animals of the earth according to their kinds.” And it was so.'
translation:
  language: ja
  text: 神は言われた。「地は、種類ごとに生き物[a]を生み出せ。すなわち、家畜、地を這うもの、地上の野生動物を、それぞれ種類ごとに。」すると、そのようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「生きた存在」。直訳「生きたネフェシュ」。「ネフェシュ」はここでは、生命をもつ存在を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹצֵא
  choice: 生み出せ
  rationale: ヒフィル形の指示表現で、地を主語として生き物を出現させるよう命じる意味を、簡潔で自然な日本語にした。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 創造物語における陸上の領域を指す。文脈上、日本語では「地」が簡潔で格調にも合う。
- source_word: נֶפֶשׁ חַיָּה
  choice: 生き物
  rationale: ここでは動物一般を指す集合的表現であり、現代日本語で自然な「生き物」とした。「魂」という後代の神学的含意は本文に持ち込まない。
- source_word: לְמִינָהּ
  choice: 種類ごとに／それぞれ種類ごとに
  rationale: 形態上は単数女性形だが、列挙される動物群への分配的な意味を自然に示した。
- source_word: בְּהֵמָה
  choice: 家畜
  rationale: 野生動物と対比される、大型の飼育動物ないし従順な動物の類を明確に表す。
- source_word: רֶמֶשׂ
  choice: 地を這うもの
  rationale: 地面を這う、または地表を動く小動物という語の範囲を、過度に種を限定せず表した。
- source_word: חַיְתוֹ אֶרֶץ
  choice: 地の野生動物
  rationale: 家畜と区別される陸上の野生動物を表す構文として訳した。
- source_word: וַיְהִי כֵן
  choice: すると、そのようになった
  rationale: 命令が実現したことを示す創世記1章の定型句を、明瞭かつ荘重な現代日本語で表した。
theological_decisions:
- issue: נֶפֶשׁ חַיָּה を神学的含意の強い語で訳すか
  choice: 生き物
  alternative: 生きるもの／生きた魂
  rationale: この箇所は動物の生命ある存在を述べており、動物の形而上学的構成について教理的主張をしているわけではない。「生き物」は意味を保ちつつ、「魂」に伴う後代の教理的連想を避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用い、創造の命令と成就の簡潔で荘重な調子を保った。「生み出せ」は地への命令を明確にし、「地を這うもの」は専門的すぎない一般語として採用した。
