- from: 神は二つの大きな光を造られた。大きいほうの光には昼を治めさせ、小さいほうの光には夜を治めさせた。また、星々も造られた。
  to: 神は二つの大きな光、すなわち、昼を治めるための大きいほうの光と、夜を治めるための小さいほうの光と、星々を造られた。
  rationale: 使役表現を目的・役割を示す表現に改め、星々を「神は……造られた」の目的語として並列した。これにより、原文の一文構造、二つの光の対照、および末尾の星々の付加を、自然な現代日本語で保持する。
