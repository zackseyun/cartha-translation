  text: וַ/יַּ֣עַשׂ אֱלֹהִ֔ים אֶת שְׁנֵ֥י הַ/מְּאֹרֹ֖ת הַ/גְּדֹלִ֑ים אֶת הַ/מָּא֤וֹר הַ/גָּדֹל֙ לְ/מֶמְשֶׁ֣לֶת הַ/יּ֔וֹם וְ/אֶת הַ/מָּא֤וֹר הַ/קָּטֹן֙ לְ/מֶמְשֶׁ֣לֶת הַ/לַּ֔יְלָה וְ/אֵ֖ת הַ/כּוֹכָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/001/016.yaml
  text: 'And God made the two great lights: the greater light to rule the day[a], and the lesser light to rule the night, and the stars.'
translation:
  language: ja
  text: 神は二つの大きな光、すなわち、昼を治めるための大きいほうの光と、夜を治めるための小さいほうの光と、星々を造られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 造られた
  rationale: עשהの基本義「造る／行う」に基づく。ここでは天体を対象とするため「造る」が自然であり、「定める」のように機能だけを表す訳は避けた。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数形の動詞を伴い、創世記1章で唯一の神を指す標準的な訳語。
- source_word: שְׁנֵי הַמְּאֹרֹת הַגְּדֹלִים
  choice: 二つの大きな光
  rationale: מָאוֹרを平明な「光」とし、本文が太陽と月の名称を用いない点を保った。「光る物」より自然で格調も保てる。
- source_word: הַמָּאוֹר הַגָּדֹל
  choice: 大きいほうの光
  rationale: 字義的には「大きな光」だが、後続のקטןとの対比を自然な日本語で明示する。
- source_word: לְמֶמְשֶׁלֶת הַיּוֹם
  choice: 昼を治めさせ
  rationale: מֶמְשֶׁלֶתの支配・統治の意味を「治める」で保持し、לְによる目的・役割を日本語の使役表現で自然に示す。
- source_word: הַמָּאוֹר הַקָּטֹן
  choice: 小さいほうの光
  rationale: גדולとの対照を保ちつつ、現代日本語として自然に表現した。
- source_word: לְמֶמְשֶׁלֶת הַלַּיְלָה
  choice: 夜を治めさせた
  rationale: 前半と同じ構文と意味を対応させ、「治める」に統一した。
- source_word: וְאֵת הַכּוֹכָבִים
  choice: また、星々も造られた
  rationale: 接続詞と目的格標識が追加の被造物を導くことを明確にする。「星々」で複数を自然に表し、省略された動詞を補って日本語として完結させた。
theological_decisions:
- issue: 太陽と月を固有の名称で訳すか
  choice: 「大きいほうの光」「小さいほうの光」とする
  alternative: 「太陽」「月」とする
  rationale: 原文は通常の太陽・月の語を使わず、מָאוֹר（光／発光体）と記す。その語法を保ち、本文にない名称を持ち込まない。
- issue: 天体の役割を表すמֶמְשֶׁלֶתの訳
  choice: 「治める」とする
  alternative: 「支配する」「つかさどる」とする
  rationale: 統治・支配の意味を保ちながら、過度に強圧的な響きや古風さを避け、現代の一般読者に明瞭な表現とした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい簡潔で品位ある調子とした。神への敬意を自然に示すため主体敬語「造られた」を採用した。原文末尾の「そして星々」を独立した文として補足的に表し、簡潔な付加の効果を保った。
