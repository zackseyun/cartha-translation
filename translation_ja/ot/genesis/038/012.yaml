  naturalness: 「かなりの日がたって」は現代標準日本語としてやや不自然です。「長い時がたって」が自然で、原文の時間経過の慣用表現も十分に伝えます。また、「ところへ、ティムナに」は移動先を示す表現が重なって不自然なため、「ティムナへ、…のもとに」とします。
  terminology: 「ユダ」「シュア」「ヒラ」「アドラム人」「ティムナ」は一貫しており、固有名の扱いに問題はありません。「慰められた」はニファル形の含意を保つ適切な訳です。「羊の毛を刈る者たち」は、ユダ自身が刈るのではなく作業者のもとへ行くという原文の構文を適切に示します。
