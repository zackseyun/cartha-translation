  text: וַ/יִּרְבּוּ֙ הַ/יָּמִ֔ים וַ/תָּ֖מָת בַּת שׁ֣וּעַ אֵֽשֶׁת יְהוּדָ֑ה וַ/יִּנָּ֣חֶם יְהוּדָ֗ה וַ/יַּ֜עַל עַל גֹּֽזֲזֵ֤י צֹאנ/וֹ֙ ה֗וּא וְ/חִירָ֛ה רֵעֵ֥/הוּ הָ/עֲדֻלָּמִ֖י תִּמְנָֽתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/012.yaml
  text: After many days had passed[a], the daughter of Shua, Judah’s wife, died. When Judah was comforted[c][b], he went up to Timnah to his sheep shearers—he and his friend Hirah the Adullamite.
translation:
  language: ja
  text: 長い時がたって[a]、ユダの妻であるシュアの娘[b]が死んだ。ユダは慰められた後[c]、友人のアドラム人ヒラとともに、ティムナへ、自分の羊の毛を刈る者たちのもとに上って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「かなりの日がたって」。直訳は「日々が多くなって」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「シュアの娘」。これを「バト・シュア」という個人名と取ることもできる。
    reason: alternative_reading
  - marker: c
    text: 別訳「ユダが慰められると」または「そしてユダは慰められた」。ここで用いられているヘブライ語動詞は、喪の悲しみから慰められることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: かなりの日がたって
  rationale: 直訳的な「日々が多くなった」という時間経過の慣用表現を、意味を狭めず自然な現代日本語で表した。
- source_word: וַתָּמָת
  choice: 死んだ
  rationale: 物語文脈における מות の標準的で明瞭な訳。
- source_word: בַּת שׁוּעַ
  choice: シュアの娘
  rationale: ヘブライ語では親子関係を示す句として明瞭であり、固有名「バト・シュア」と断定しない訳を本文に採用した。
- source_word: אֵשֶׁת יְהוּדָה
  choice: ユダの妻
  rationale: 連語を自然な日本語の所有表現で訳した。
- source_word: וַיִּנָּחֶם יְהוּדָה
  choice: ユダは慰められた後
  rationale: נחם のニファル形がここでは死別の悲しみから慰められることを指すため、受動の含意と後続動作との時間関係を保った。
- source_word: וַיַּעַל
  choice: 上って行った
  rationale: עלה の方向性を保持した。単なる「行った」とするより原文に即している。
- source_word: עַל גֹּזֲזֵי צֹאנוֹ
  choice: 自分の羊の毛を刈る者たちのところへ
  rationale: 分詞を人として取り、ユダ自身が毛を刈る目的で行ったと読み替えず、毛を刈る作業者たちを行き先として表した。
- source_word: הוּא וְחִירָה רֵעֵהוּ
  choice: 友人のアドラム人ヒラとともに
  rationale: 同伴関係を自然な日本語で示し、רֵעַ を文脈に即して「友人」とした。
- source_word: הָעֲדֻלָּמִי
  choice: アドラム人
  rationale: ヒラがアドラムの出身者であることを示す形容語として訳した。
- source_word: תִּמְנָתָה
  choice: ティムナに
  rationale: 地名に付された方向を示す語尾を、日本語の移動先を示す助詞で表した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語文としての簡潔さと品位を保った。「慰められた」はやや直訳調だが、原文の受動的な形と死別後の慰めという意味を保持するため採用した。
