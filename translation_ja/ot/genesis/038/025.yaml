base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/025.yaml
  text: As she was being brought out[a], she sent word to her father-in-law, saying, “I am pregnant by the man to whom these belong.” And she said, “Please identify whose signet ring, cords, and staff these are.”
translation:
  language: ja
  text: 彼女が連れ出されていたとき、彼女は義父のもとへ人を遣わして、こう伝えた。「私は、これらの品の持ち主である男性の子を身ごもっています。」そして言った。「どうか、この印章とひもと杖がだれのものか、確かめてください[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「見分けてください」「見覚えがあるか見てください」。このヘブライ語の動詞は、見覚えのあるものを認めることにも、調べて持ち主を特定することにも用いられる。ここでは証拠を突きつける鋭い響きがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִוא מוּצֵאת
  choice: 彼女が連れ出されていたとき
  rationale: יצאのホフアル分詞で、処罰のため外へ連れ出される途中の継続的な動作を表す。日本語では受け身の進行表現で自然に示した。
- source_word: שָׁלְחָה אֶל חָמִיהָ לֵאמֹר
  choice: しゅうとのもとに使いを送り、こう言わせた
  rationale: 直訳的には「しゅうとに送って言った」。伝言を届けさせたことが文脈上明らかなため、「使いを送り、こう言わせた」とした。
- source_word: לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ אָנֹכִי הָרָה
  choice: 私は、これらの品の持ち主である人によって身ごもりました
  rationale: 所有を表す関係節と、妊娠させた男性を示すלְを、明瞭で自然な日本語にした。
- source_word: הַכֶּר נָא
  choice: どうか……確かめてください
  rationale: נכרの命令形は「見分ける、見覚えがある、確認する」の幅を持つ。נָאの丁寧な訴えを「どうか」で表し、この場面の証拠確認の響きを保った。
- source_word: הַחֹתֶמֶת
  choice: この印章
  rationale: 個人を特定し、封印に用いる品を指す。指輪と断定せず、ヘブライ語の語義に沿って「印章」とした。
- source_word: הַפְּתִילִים
  choice: ひも
  rationale: 形態は複数形で、印章に付随する複数のひもを指し得る。日本語の「ひも」は数量を明示せず自然に総称できる。
- source_word: הַמַּטֶּה
  choice: 杖
  rationale: 家長物語の携行品として自然で、標準的な訳語である。
