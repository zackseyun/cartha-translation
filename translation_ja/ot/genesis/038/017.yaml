  text: And he said[a], “I will send a young goat from the flock.” And she said, “If you will give a pledge until you send it.”
translation:
  language: ja
  text: 彼は言った。「群れから子やぎを一匹送ろう。」彼女は言った。「それを送ってくれるまで、保証の品[a]を渡してくれるなら。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「担保」または「保証物」とも訳せる（עֵרָבוֹן）。
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִי עִזִּים
  choice: 子やぎを一匹
  rationale: この連語は、やぎの若い個体を指す。現代日本語として自然な「子やぎ」とし、日本語で必要となる助数表現も補った。
- source_word: מִן הַצֹּאן
  choice: 群れの中から
  rationale: צֹאןは羊ややぎなどの小家畜の群れを指す。直前で子やぎと特定されているため、重複を避けて自然に訳した。
- source_word: עֵרָבוֹן
  choice: 保証の品
  rationale: 約束が果たされるまで差し出す担保・保証物を意味する。単なる口約束ではなく、実物を預ける文脈が伝わる表現を選んだ。
- source_word: עַד שָׁלְחֶךָ
  choice: それを送ってくださるまで
  rationale: 字義的には「あなたが送るまで」。目的語は文脈上、約束された子やぎなので、自然な日本語にするため「それを」を補った。
- source_word: אִם תִּתֵּן
  choice: 預けてくださるなら
  rationale: タマルが提示する条件を表す。保証物を一時的に手元に置くという文脈を自然な日本語で示した。
- source_word: אָנֹכִי אֲשַׁלַּח
  choice: 送ろう
  rationale: 独立代名詞אָנֹכִיには強調があり得るが、日本語では主語を重ねず、話者の意志と約束を「送ろう」で簡潔に表した。
