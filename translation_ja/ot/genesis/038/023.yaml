  source_fidelity: 全体として原文に忠実である。『物笑いの種になる』はפֶּן נִהְיֶה לָבוּזの社会的な嘲笑・軽蔑への懸念をよく表す。ただし、תִּקַּח לָהּは直訳すれば「あの女が自分のために取る／持ってよい」であり、担保品が複数であることを日本語で明示する方が文脈上明瞭である。
