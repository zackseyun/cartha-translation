base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/023.yaml
  text: And Judah said[a], “Let her keep them, lest we become a laughingstock. Look, I sent this young goat, but you did not find her.”
translation:
  language: ja
  text: ユダは言った。「あの女にあれらを持っていかせよう。そうでないと、私たちは物笑いの種になる[a]。いいか、私はこの子やぎを送ったのに、あなたはあの女を見つけられなかったのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちは恥さらしになる」または「私たちはあざけられる」。ヘブライ語の表現は、軽蔑や嘲笑の対象となることを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקַּח לָהּ
  choice: あの女にはあれをそのまま持たせておこう
  rationale: 三人称女性単数の未完了形は、この文脈では許容・譲歩を表す。「あれ」は直前の文脈にある複数の担保品をまとめて指し、「そのまま持たせておこう」でユダが返還を断念する意味を自然に表した。
- source_word: פֶּן נִהְיֶה לָבוּז
  choice: そうでないと、私たちは物笑いの種になる
  rationale: פֶּן の懸念・回避の意味と、בּוּז の軽蔑や嘲笑の対象となる意味を、明瞭な現代日本語で表した。
- source_word: הִנֵּה
  choice: 見なさい
  rationale: 後続内容へ注意を向ける談話標識としての力を保ちつつ、古風になりすぎない表現とした。
- source_word: שָׁלַחְתִּי הַגְּדִי הַזֶּה
  choice: 私はこの子やぎを送った
  rationale: גְּדִי を明確に「子やぎ」とし、指示詞 הַזֶּה の「この」も保持した。
- source_word: וְאַתָּה לֹא מְצָאתָהּ
  choice: あなたはあの女を見つけられなかったのだ
  rationale: 女性単数接尾辞は探していた女を指す。接続詞は直前との対比を日本語の「のに」で表した。
- source_word: יְהוּדָה
  choice: ユダ
  rationale: 日本語聖書で広く定着した固有名表記を用いた。
