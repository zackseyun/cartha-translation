base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/030.yaml
  text: Afterward his brother came out[a], with the scarlet thread on his hand[b], and he called his name Zerah.
translation:
  language: ja
  text: その後、手に緋色の糸がついていた彼の兄弟が出て来た。彼はその子をゼラと名づけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: その後
  rationale: 先に起きた出産に続く出来事であることを、自然な現代日本語で示す。
- source_word: יָצָא אָחִיו
  choice: 兄弟が出て来た
  rationale: יָצָאは出産の文脈で「出て来た」とし、אָחִיוは双子のもう一人を指すため「兄弟」と訳した。
- source_word: אֲשֶׁר עַל יָדוֹ הַשָּׁנִי
  choice: 手に緋色の糸をつけた
  rationale: הַשָּׁנִיは字義的には「その緋色のもの」だが、直前の38章28節にある糸を省略して指す表現なので、「糸」を補って明確にした。「緋色」は識別のしるしとなった鮮やかな赤色を表す。
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: その子は…と名づけられた
  rationale: 字義的には「彼はその名を呼んだ」だが、動詞の男性単数主語が本文中で明示されず、直前に登場する助産婦は女性である。日本語では受け身にして、不確かな命名者を特定せず命名の出来事を自然に表した。
- source_word: זָרַח
  choice: ゼラ
  rationale: ヘブライ語の人名を日本語聖書で一般的な形に音写した。
