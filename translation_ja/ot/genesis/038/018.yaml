base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/018.yaml
  text: He said[a], “What pledge shall I give you?” And she said, “Your seal, your cord, and your staff that is in your hand.” So he gave them to her and went in to her[c][b], and she conceived by him.
translation:
  language: ja
  text: 彼は言った。「何を担保として渡そうか。」彼女は答えた。「あなたの印章[a]とひも、それに、手に持っている杖を。」そこで彼はそれらを彼女に渡し、彼女のところに入った[b]。彼女は彼の子を身ごもった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「印章」は「印」とも訳せる。ヘブライ語は、印を押す道具の具体的な形状を明示していない。
    reason: lexical_alternative
  - marker: b
    text: 「彼女のところに入った」は、性交を表すヘブライ語の婉曲表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵרָבוֹן
  choice: 担保
  rationale: 後で支払うまでの保証として預ける品を指す。「担保」はこの取引の文脈を簡潔かつ明確に表す。
- source_word: חֹתָמְךָ
  choice: あなたの印章
  rationale: 本人確認などに用いる印または印章を指すが、指輪とは明記されていないため、形状を限定しない「印章」とした。
- source_word: פְתִילֶךָ
  choice: ひも
  rationale: 印章に伴うひもである可能性が高いが、本文は用途を明示しないため、解釈を加えず一般的な「ひも」とした。
- source_word: מַטְּךָ
  choice: 杖
  rationale: 手に携える個人用品として自然であり、語の通常の意味を保つ。
- source_word: אֲשֶׁר בְּיָדֶךָ
  choice: 手に持っている
  rationale: 杖を修飾する関係節として、原文の具体的な情景を自然な現代日本語で表した。
- source_word: וַיִּתֶּן לָּהּ
  choice: 彼はそれらを彼女に渡し
  rationale: 動詞自体には目的語代名詞がないが、直前に挙げられた三つの品を受け、日本語では「それら」を補うのが自然である。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: 彼女のところに入った
  rationale: 性交を表すヘブライ語の婉曲表現を保ち、脚注で意味を明示する。
- source_word: וַתַּהַר לוֹ
  choice: 彼女は彼によって身ごもった
  rationale: 妊娠したことと、その父が彼であることを示す לוֹ の関係を、明瞭で品位ある日本語にした。
