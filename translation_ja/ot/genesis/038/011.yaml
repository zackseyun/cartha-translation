  naturalness: 文体は明瞭で自然である。「嫁」は現代日本語では話者側の家族呼称としても用いられ、本文の親族関係を叙述する語としてはやや口語的かつ曖昧になりうるため、「息子の妻」が明確である。
  terminology: タマル、ユダ、シェラの固有名は適切。「未亡人のまま」は「やもめのまま」より明瞭な現代標準語であり、אַלְמָנָהが表す身分を保つ。「息子の妻」は כַּלָּתוֹ（彼の息子の妻）を明示する。
