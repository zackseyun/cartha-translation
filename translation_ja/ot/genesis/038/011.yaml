  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/תָמָ֨ר כַּלָּת֜/וֹ שְׁבִ֧י אַלְמָנָ֣ה בֵית אָבִ֗י/ךְ עַד יִגְדַּל֙ שֵׁלָ֣ה בְנִ֔/י כִּ֣י אָמַ֔ר פֶּן יָמ֥וּת גַּם ה֖וּא כְּ/אֶחָ֑י/ו וַ/תֵּ֣לֶךְ תָּמָ֔ר וַ/תֵּ֖שֶׁב בֵּ֥ית אָבִֽי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/011.yaml
  text: Then Judah said to Tamar his daughter-in-law[a], “Remain a widow in your father’s house until my son Shelah grows up,” for he said, “Lest he also die like his brothers.” So Tamar went and lived in her father’s house.
translation:
  language: ja
  text: そこでユダは、息子の妻タマルに言った。「私の息子シェラが大人になるまで、あなたの父の家で未亡人のままでいなさい。」彼は、「シェラも兄たちのように死ぬかもしれない」と思った[a]からである。タマルは行って、父の家で暮らした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼は言った」。ここでは心の中で考えたことを指すとみられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבִי אַלְמָנָה
  choice: やもめのままでいなさい
  rationale: 命令形「住む、とどまる」と身分を表す名詞「やもめ」を、日本語で自然に結び、ユダがタマルに未亡人の状態を保つよう命じたことを示す。
- source_word: בֵית אָבִיךְ
  choice: あなたの父の家で
  rationale: 父の家ないし父方の家族のもとでの居住を表す慣用句。文脈上、具体的な居所として自然に訳した。
- source_word: עַד יִגְדַּל שֵׁלָה בְנִי
  choice: 私の息子シェラが成人するまで
  rationale: 直訳は「大きくなるまで」。ここでは婚姻可能な年齢に達することを指すため、「成人する」が簡潔で明瞭。
- source_word: כִּי אָמַר
  choice: 彼は……と思った
  rationale: 直訳は「彼は言った」だが、発話の相手が示されず、ユダの内心の理由を導入している。現代日本語では「思った」が自然である一方、字義的な別訳を脚注に残した。
- source_word: פֶּן יָמוּת גַּם הוּא
  choice: シェラも……死ぬかもしれない
  rationale: פֶּן が示す懸念・危惧を、自然な現代日本語の「かもしれない」で表した。代名詞の指示対象は文脈上明白なため、シェラの名を補った。
- source_word: כְּאֶחָיו
  choice: 兄たちのように
  rationale: シェラの兄エルとオナンが死んだこととの比較を簡潔に保持した。
- source_word: וַתֵּשֶׁב בֵּית אָבִיהָ
  choice: 父の家で暮らした
  rationale: 継続的な居住を表す ישׁב を、物語の結びとして自然な「暮らした」で訳した。
- source_word: כַּלָּתוֹ
  choice: 嫁のタマル
  rationale: ユダとの親族関係を示す語。現代日本語で明瞭かつ簡潔な「嫁」を採用した。
theological_decisions:
- issue: ユダの言葉が表向きの約束か、実際にシェラを与える意図を伴うか
  choice: 本文には「成人するまで」とだけ訳し、ユダの意図を断定しない
  alternative: ユダがタマルを退けるため口実を述べたと明示する
  rationale: ヘブライ語本文はユダの恐れを示すが、約束を守る意思の有無まではこの節だけでは明言しないため、物語上の緊張を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「やもめ」は聖書文脈で通用する簡潔な語として用い、「成人する」で婚姻可能な成熟を過度な説明なしに表した。脚注記号[a]を該当箇所に置いた。
