revisions:
- from: そこでユダは、嫁のタマルに言った。「私の息子シェラが成人するまで、あなたの父の家で、やもめのままでいなさい。」彼は、「シェラも兄たちのように死ぬかもしれない」と思った[a]からである。タマルは行って、父の家で暮らした。
  to: そこでユダは、息子の妻タマルに言った。「私の息子シェラが大人になるまで、あなたの父の家で未亡人のままでいなさい。」彼は、「シェラも兄たちのように死ぬかもしれない」と思った[a]からである。タマルは行って、父の家で暮らした。
  rationale: 親族呼称を現代標準日本語として明確にし、「成人」という法的・制度的含みを避けて原語の『成長する』という表現の幅を保った。それ以外は、ユダの内心としての発話、恐れの内容、タマルが父の家に住んだという叙述を維持している。脚注記号は「思った」に対応し、脚注内容も本文の選択を適切に説明している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:42:05Z'
