  text: וַ/תַּ֖הַר וַ/תֵּ֣לֶד בֵּ֑ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ עֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/003.yaml
  text: She conceived and bore a son[a], and he called his name Er.
translation:
  language: ja
  text: 彼女は身ごもって男の子を産み、彼はその子をエルと名づけた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「彼はその名をエルと呼んだ」と男性単数形で記されている。「彼」は文脈上、ユダを指すと考えるのが最も自然である。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתַּהַר
  choice: 彼女は身ごもって
  rationale: הרה は妊娠する、身ごもることを表す。「身ごもる」は自然で品位のある現代日本語であり、続く出産との順序も明確に示す。
- source_word: וַתֵּלֶד בֵּן
  choice: 男の子を産み
  rationale: ילד の「産む」と בֵּן の男性の子という意味を、自然な日本語で簡潔に表す。文脈上は「息子」も可能だが、母親を主語とする文では「男の子」が滑らかである。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: 彼はその子を…と名づけた
  rationale: 動詞が男性単数形であることを「彼は」で保持しつつ、ヘブライ語の慣用句「その名を呼ぶ」を自然な現代日本語の「名づける」で表した。
- source_word: עֵר
  choice: エル
  rationale: ヘブライ語の人名を日本語の聖書翻訳で理解しやすい形に音写した。
theological_decisions:
- issue: וַיִּקְרָא（「名づけた」）の主語
  choice: 男性単数形を反映して「彼は」と訳し、文脈上ユダを指すものとする。
  alternative: 「彼女は名づけた」と調整する、または「エルと名づけられた」として主語を明示しない。
  rationale: 直前の二つの動詞は女性単数形だが、「名づけた」は男性単数形である。この文法上の切り替わりを保持し、女性主語へ調和させない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「名を呼んだ」という逐語的表現ではなく「名づけた」としつつ、原文の男性主語への切り替わりは明示的に保持した。
