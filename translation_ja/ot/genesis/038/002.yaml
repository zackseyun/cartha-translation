  yaml_path: translation/ot/genesis/038/002.yaml
  text: There Judah saw the daughter of a Canaanite man whose name was Shua[b][a], and he took her and went in to her.
translation:
  language: ja
  text: そこでユダは、名をシュア[a]というあるカナン人の男の娘を見た。彼は彼女を迎え、彼女のもとに入った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文の「その名はシュア」は、娘ではなく、カナン人の父を指す。
    reason: lexical_alternative
  - marker: b
    text: 「彼女のもとに入った」は、性的関係を持ったことを表すヘブライ語の慣用表現。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見かけた
  rationale: ראהの基本義「見る」を保ちつつ、この場面で初めて目にしたことを自然な現代日本語で表す。「出会った」では接触を読み込みすぎる。
- source_word: שָׁם
  choice: そこで
  rationale: 場所を示す副詞שָׁםを、前節から続く物語の流れに合う自然な接続表現で訳した。
- source_word: בַּת אִישׁ כְּנַעֲנִי
  choice: カナン人の娘
  rationale: 直訳的には「ある男、すなわちカナン人の娘」。日本語では父との関係と民族的帰属を簡潔に示す。
- source_word: וּשְׁמוֹ שׁוּעַ
  choice: シュアという名の
  rationale: 接尾辞「彼の」は男性を指すため、シュアは娘ではなくカナン人の父の名である。その係り先は脚注で明示する。
- source_word: וַיִּקָּחֶהָ
  choice: その娘を迎え
  rationale: לקחの基本義は「取る」だが、女性を迎えるこの文脈では婚姻を含意しうる。「妻に迎えた」と明示しすぎず、日本語として自然な「迎え」を採用した。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: 彼女のもとに入った
  rationale: 原文の「彼女のところへ入る」という婉曲表現を保ち、性的関係を表す慣用句であることは脚注で説明する。
