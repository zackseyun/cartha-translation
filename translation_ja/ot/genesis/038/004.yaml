base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/004.yaml
  text: She conceived again and bore a son, and she named him Onan.
translation:
  language: ja
  text: 彼女は再び身ごもって男の子を産み、その子をオナンと名づけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: 彼女は身ごもって
  rationale: 動詞 הרה は妊娠することを表す。「身ごもる」は現代日本語として自然であり、聖書物語にふさわしい品位も保つ。
- source_word: עוֹד
  choice: 再び
  rationale: ここでは出産が繰り返されたことを示すため、「なお」ではなく「再び」とした。
- source_word: וַתֵּלֶד בֵּן
  choice: 男の子を産み
  rationale: בן を明示しつつ、ילד の出産の意味を簡潔で自然な日本語にした。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: その子を…と名づけた
  rationale: 直訳的な「その名を呼んだ」ではなく、命名を表す自然な現代日本語とした。女性単数形 וַתִּקְרָא に従い、母が名づけたことを保持している。
- source_word: אוֹנָן
  choice: オナン
  rationale: 人名を一般的な日本語の音写で示した。
theological_decisions: []
translation_notes:
  register: 簡潔な連続叙述を保ちながら、明瞭で自然な現代標準日本語とした。「彼女」で前節からの主語を受け、「その子」によって日本語として命名の対象を明確にした。
