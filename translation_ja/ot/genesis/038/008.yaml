review_pass:
  verdict: revise
  source_fidelity: 「彼女に対して兄弟としての務めを果たし」は、יִבֵּם の義兄弟婚上の技術的義務を意図しているものの、日本語では単に実の兄弟としての務めとも読める。「彼女に夫の兄弟としての務めを果たし」とすれば、亡兄の妻に対する義務であることが明確になる。「兄のために子をもうけなさい」は、亡兄のために子孫（家系を継ぐ子）を立てるという זֶרַע の文脈上の意味を自然に伝える。
  naturalness: 全体の文体は明瞭な現代標準日本語である。ただし「彼女に対して兄弟としての務め」は不自然さと意味の曖昧さがあるため、より具体的な「彼女に夫の兄弟としての務めを果たし」に改める。
  terminology: 「夫の兄弟としての務め」は、後代の制度用語を本文に過度に持ち込まずに、יִבֵּם の家族的・法的な義務を表す。脚注では「義兄弟婚の務め」という技術的名称を補い、英語監査資料の lexical alternative に対応させる。脚注のアンカーは人名「オナン」ではなく当該義務を表す句に置く。
  issues:
  - severity: medium
    issue: 「兄弟としての務め」が義兄弟婚の義務を明確にしない
    rationale: יִבֵּם は兄弟一般の務めではなく、亡くなった兄弟の妻に対して夫の兄弟が果たす特有の義務を指す。現行訳は日本語として実兄弟間の一般的責務にも読める。
  - severity: low
    issue: 英語監査資料の語彙脚注に相当する注記がない
    rationale: 本文を平易に保つことは適切だが、技術的な義務を明示する脚注を当該句に付すと、原語の専門性と本文の読みやすさの両方を保てる。
  revised_text: そこでユダはオナンに言った。「兄の妻のところに入り、彼女に夫の兄弟としての務めを果たし[a]、兄のために子をもうけなさい。」
  revised_footnotes:
