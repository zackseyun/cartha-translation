- from: そこでユダはオナンに言った。「兄の妻のところに入り、彼女に対して兄弟としての務めを果たし、兄のために子孫をもうけなさい。」
  to: そこでユダはオナンに言った。「兄の妻のところに入り、彼女に夫の兄弟としての務めを果たし[a]、兄のために子をもうけなさい。」
  rationale: 原文の命令の順序と婉曲表現「妻のところに入り」を保ったまま、義兄弟婚の義務を指す動詞の意味を日本語で明確化した。「子孫」よりも、この場面で求められる直接の子を自然に指す「子」を用いた。
