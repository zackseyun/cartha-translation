  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוּדָה֙ לְ/אוֹנָ֔ן בֹּ֛א אֶל אֵ֥שֶׁת אָחִ֖י/ךָ וְ/יַבֵּ֣ם אֹתָ֑/הּ וְ/הָקֵ֥ם זֶ֖רַע לְ/אָחִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/008.yaml
  text: Then Judah said to Onan[a], “Go in to your brother’s wife, perform the duty of a brother-in-law to her, and raise up offspring for your brother.”
translation:
  language: ja
  text: そこでユダはオナンに言った。「兄の妻のところに入り、彼女に夫の兄弟としての務めを果たし[a]、兄のために子をもうけなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より専門的には、「彼女に対して義兄弟婚の務めを果たし」。
    reason: יִבֵּם は、亡くなった兄弟の妻に対して夫の兄弟が果たす義務を指す技術的な動詞である。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ連続法を、前後のつながりと順序が自然に伝わる現代日本語で表した。
- source_word: בֹּא אֶל
  choice: ……のところに入り
  rationale: 婚姻関係における性交を指す婉曲的な慣用句。露骨な説明に置き換えず、文脈上理解できる日本語表現とした。
- source_word: אֵשֶׁת אָחִיךָ
  choice: 兄の妻
  rationale: 構文を簡潔に訳した。文脈上、亡くなった兄エルの妻を指すため、日本語では「あなたの」を省いて自然にした。
- source_word: וְיַבֵּם אֹתָהּ
  choice: 彼女に対して兄弟としての務めを果たし
  rationale: יִבֵּםは、亡くなった兄弟の妻に対する義兄弟婚上の務めを果たすことを指す専門的な動詞。「レビラート婚」などの難解な術語を避けつつ、単なる性交や結婚に狭めず、家族上の義務を表した。
- source_word: וְהָקֵם זֶרַע
  choice: 子孫をもうけなさい
  rationale: 直訳的な「子孫を立てる」は現代日本語では不自然なため、亡兄の家系を継ぐ子を生じさせるという慣用的意味を明瞭にした。זֶרַעは集合的・継続的な含みを保つため「子」ではなく「子孫」とした。
- source_word: לְאָחִיךָ
  choice: 兄のために
  rationale: 前置詞לְの利益・目的の意味を保持し、その子孫が亡兄のために立てられることを簡潔に示した。
theological_decisions:
- issue: 義兄弟婚の専門用語を、後代の法体系や教派的説明を持ち込まずに訳すこと
  choice: 彼女に対して兄弟としての務めを果たし
  alternative: 彼女と義兄弟婚を行い／彼女を兄弟の妻としてめとり
  rationale: 原文の専門動詞が示す家族的・法的責務を保ちながら、行為を結婚だけ、または性交だけに限定しない表現を選んだ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の婉曲表現「入る」は日本語でも保ち、義兄弟婚の技術的概念は本文内で平易に説明した。脚注を必要とするほどの本文上の異読はないため、脚注は付していない。
