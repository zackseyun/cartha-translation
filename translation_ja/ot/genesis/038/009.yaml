source:
  edition: WLC
  text: וַ/יֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖/וֹ יִהְיֶ֣ה הַ/זָּ֑רַע וְ/הָיָ֞ה אִם בָּ֨א אֶל אֵ֤שֶׁת אָחִי/ו֙ וְ/שִׁחֵ֣ת אַ֔רְצָ/ה לְ/בִלְתִּ֥י נְתָן זֶ֖רַע לְ/אָחִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/009.yaml
  text: But Onan knew that the offspring would not be his[a]; so whenever he went in to his brother’s wife, he spilled it on the ground[b], so as not to give offspring to his brother.
translation:
  language: ja
  text: ところが、オナンは、生まれる子が自分の子とされないことを知っていた。[a] そこで、兄の妻と関係を持つたびに、兄のために子をもうけないよう、精液を地に流した。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「種」。ここでは、兄のためにもうけられる子、または子孫を指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は字義的には「それを地に損なった（または、無駄にした）」。文脈上、オナンが精液を地に流して受胎を妨げた行為を述べている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 知っていた
  rationale: 物語におけるידעの基本的な意味を保ち、オナンが結果を承知していたことを自然な日本語で示す。
- source_word: הַזָּרַע
  choice: 生まれる子
  rationale: 直訳は「種」だが、ここではレビラート婚のもとで生まれる子、すなわち亡兄の家を継ぐ子を指す。日本語では文脈上「生まれる子」が明瞭である。
- source_word: לֹא לוֹ יִהְיֶה הַזָּרַע
  choice: 生まれる子が自分のものにはならない
  rationale: その子が法的・家族的にオナン自身の子として扱われないという意味を表しつつ、「数えられない」など本文にない制度的説明は加えない。
- source_word: וְהָיָה אִם־בָּא
  choice: 関係を持つたびに
  rationale: 過去の反復的・習慣的行為を表す構文として訳した。
- source_word: בָּא אֶל־אֵשֶׁת אָחִיו
  choice: 兄の妻と関係を持つ
  rationale: 直訳的な婉曲表現は「兄の妻のところに入る」だが、現代日本語では性的関係を意味することが伝わりにくいため、品位を保った明瞭な表現とした。
- source_word: וְשִׁחֵת אַרְצָה
  choice: 地に流していた
  rationale: שחתは本来「損なう、滅ぼす、無駄にする」の意で、ここでは受胎を妨げる行為を表す。目的語を明示しない原文の簡潔さを保ちながら、文脈上の行為が分かる表現を選んだ。
- source_word: לְבִלְתִּי נְתָן זֶרַע לְאָחִיו
  choice: 兄のために子をもうけないよう
  rationale: 目的節を自然な日本語で表し、亡兄の家系のために子をもうけるという文脈を示す。
theological_decisions:
- issue: זֶרַעの法的・家族的意味と、オナンの身体的行為との関係
  choice: זֶרַעは子を指す表現として訳し、וְשִׁחֵת אַרְצָהは目的語を補わず「地に流していた」とした。
  alternative: 「種」で統一する、または「精液を地に流した」と明示する。
  rationale: この節は、亡兄のための子が生まれることと、それを避けるオナンの行為を結びつけている。「子」は家族法上の意味を明瞭にし、「地に流していた」は原文が明示していない目的語を本文で過度に特定せずに行為を伝える。特定の道徳的・教派的解釈は付加しない。
translation_notes:
  register: 明瞭な現代標準日本語。性的行為は「関係を持つ」、受胎を妨げる行為は「地に流す」とし、露骨さを避けつつ意味を伝えた。語調は簡潔で品位ある物語文とした。
