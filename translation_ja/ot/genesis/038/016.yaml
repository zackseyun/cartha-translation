  text: וַ/יֵּ֨ט אֵלֶ֜י/הָ אֶל הַ/דֶּ֗רֶךְ וַ/יֹּ֨אמֶר֙ הָֽבָ/ה נָּא֙ אָב֣וֹא אֵלַ֔יִ/ךְ כִּ֚י לֹ֣א יָדַ֔ע כִּ֥י כַלָּת֖/וֹ הִ֑וא וַ/תֹּ֨אמֶר֙ מַה תִּתֶּן לִּ֔/י כִּ֥י תָב֖וֹא אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/016.yaml
  text: So he turned aside to her by the road and said[a], “Please, let me come in to you,” for he did not know that she was his daughter-in-law. And she said, “What will you give me[b], that you may come in to me?”
translation:
  language: ja
  text: ユダは道端で彼女のほうへそれて行き、「さあ、あなたのところに入らせてくれ[a]」と言った。彼女が自分の息子の妻だとは知らなかったのである。彼女は言った。「私のところに入るのなら、何をくださいますか[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたのところに入る」は、性的関係を持つことを指すヘブライ語の婉曲表現。
    reason: lexical_alternative
  - marker: b
    text: 「何を支払ってくださいますか」とも訳せる。ヘブライ語の直訳は「何をくださいますか」。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּט אֵלֶיהָ אֶל־הַדֶּרֶךְ
  choice: 道端にいる彼女の方へそれて行き
  rationale: נטהが表す、進路から外れて相手の方へ向かう動きを自然な日本語で示した。אֶל־הַדֶּרֶךְは文脈上、彼女のいる道端を指す。
- source_word: הָבָה נָּא
  choice: さあ、…させてくれ
  rationale: 促しと依頼を表す語調を、古風になりすぎない直接的な話し言葉で表した。
- source_word: אָבוֹא אֵלַיִךְ
  choice: あなたのところに入らせてくれ
  rationale: בוא + אלの字義的な像と、ここでの性的な婉曲表現を保った。意味を本文で露骨に言い換えず、脚注で明示する。
- source_word: כִּי לֹא יָדַע כִּי כַלָּתוֹ הִוא
  choice: 彼女が自分の嫁だとは知らなかったのである
  rationale: 最初のכִּיを行動の理由を説明する節として訳し、כַלָּהはこの親族関係を表す一般的な日本語「嫁」とした。
- source_word: מַה תִּתֶּן לִּי
  choice: 何をくださいますか
  rationale: נתןの基本義「与える」を保ち、文脈上の支払いという含意は脚注に示した。タマルの応答には丁寧体を用いた。
- source_word: כִּי תָבוֹא אֵלָי
  choice: 私のところに入るのなら
  rationale: 性的な婉曲表現を保ちながら、対価を尋ねる条件関係が自然に伝わる日本語にした。
