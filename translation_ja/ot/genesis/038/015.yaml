base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/015.yaml
  text: When Judah saw her[a], he thought she was a prostitute, because she had covered her face.
translation:
  language: ja
  text: ユダが彼女を見ると、娼婦だと思った。彼女が顔を覆っていたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאֶהָ
  choice: ユダが彼女を見ると
  rationale: ראהの基本義「見る」と、物語を進める接続形が次の判断へつながる時間的関係を、自然な現代日本語で表した。
- source_word: וַיַּחְשְׁבֶהָ לְזוֹנָה
  choice: 娼婦だと思った
  rationale: חשב＋目的語＋לְは、彼女をある者と見なすというユダの判断を表す。「だと思った」は、その判断が誤認であったことを文脈の中で自然に伝える。
- source_word: לְזוֹנָה
  choice: 娼婦
  rationale: זוֹנָהの意味を簡潔かつ現代的に示す語を選び、古風な表現や現代特有の社会学的含意を避けた。
- source_word: כִּי
  choice: からである
  rationale: ユダがそのように判断した理由を導く因果関係を明確に表した。
- source_word: כִסְּתָה פָּנֶיהָ
  choice: 彼女が顔を覆っていた
  rationale: כסה「覆う」とפנים「顔」を直接反映し、完了形が示す、その判断時点ですでに成立していた背景的な状態を「覆っていた」で表した。
