id: GEN.38.26
reference: Genesis 38:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּכֵּ֣ר יְהוּדָ֗ה וַ/יֹּ֨אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔/נִּי כִּֽי עַל כֵּ֥ן לֹא נְתַתִּ֖י/הָ לְ/שֵׁלָ֣ה בְנִ֑/י וְ/לֹֽא יָסַ֥ף ע֖וֹד לְ/דַעְתָּֽ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/026.yaml
  text: Then Judah recognized them and said[a], “She is more righteous than I[b], because I did not give her to Shelah my son.” And he did not know her again.
translation:
  language: ja
  text: ユダはそれらを見て、自分の物だと認め、言った。「彼女のほうが私より正しい[a]。私が彼女を息子シェラに与えなかったからだ。」ユダはその後、二度と彼女を知ることはなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼女のほうが私よりも道理にかなっている」。
    reason: lexical_alternative
  - marker: b
    text: 「知る」は、ここでは性的関係を持つことを表すヘブライ語の婉曲表現。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: それらを見て、自分の物だと認め
  rationale: 直前の節で示された印章、ひも、杖をユダが自分の物だと確認したことを、文脈上の目的語を補って明確にした。
- source_word: צָדְקָה מִמֶּנִּי
  choice: 彼女のほうが私より正しい
  rationale: 比較を表す מִן の働きと、צדק の道徳的な響きを保ちつつ、この件におけるタマルとユダの相対的評価として自然な日本語にした。
- source_word: כִּי עַל כֵּן
  choice: からだ
  rationale: ここではユダが直前の判断の理由を述べているため、因果関係を簡潔に示した。
- source_word: לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי
  choice: 私が彼女を息子シェラに与えなかった
  rationale: 「与える」という原文の表現を残した。結婚させる意味は物語の文脈から分かる。
- source_word: וְלֹא יָסַף עוֹד לְדַעְתָּהּ
  choice: その後、二度と彼女を知ることはなかった
  rationale: ידע の婉曲表現を本文に保持し、יָסַף עוֹד が表す以後の不反復を「その後、二度と」で自然に示した。
- source_word: יְהוּדָה
  choice: ユダ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: שֵׁלָה
  choice: シェラ
  rationale: 原語の音に沿い、日本語で通用する人名表記を用いた。
theological_decisions:
- issue: ユダの告白における道徳的評価
  choice: この件ではタマルのほうがユダより正しいと認める比較表現
  alternative: タマルが全面的・絶対的に無罪または完全に義であるという宣言
  rationale: 原文は比較的かつ物語上の評価である。道徳的な重みを保ちながら、タマルの絶対的な無罪性についての教理的断定には広げない。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、告白の厳粛さを保った。「彼女」は直前のタマルを指す。原文の性的婉曲表現は本文に残し、脚注で意味を説明した。
