base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/013.yaml
  text: And Tamar was told[a], saying, “Look, your father-in-law is going up to Timnah to shear his sheep.”
translation:
  language: ja
  text: タマルはこう告げられた。「ほら、あなたのしゅうとが、羊[a]の毛を刈るためにティムナへ上って行きます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「彼の群れ」。
    reason: צֹאןは羊を中心とする小型家畜の群れを集合的に指すことがあり、接尾辞נוֹは「彼の」を示す。
lexical_decisions:
- source_word: וַיֻּגַּד לְתָמָר
  choice: タマルにこう知らされた
  rationale: 受動・報告を表すホフアル形と間接目的語を保ちつつ、現代日本語として自然な受動表現にした。
- source_word: לֵאמֹר
  choice: こう……「」
  rationale: 後続する直接話法を導く定型句を、日本語では「こう」と引用符によって自然に表した。
- source_word: הִנֵּה
  choice: 今
  rationale: 聞き手の注意を、まさに進行中または目前の事態へ向ける談話機能を、文脈に即した自然な日本語で表した。
- source_word: חָמִיךְ
  choice: あなたのしゅうと
  rationale: タマルを指す女性単数二人称接尾辞と姻族関係を明示した。
- source_word: עֹלֶה
  choice: 上って行きます
  rationale: 分詞が示す進行中・間近の動作と、עלהの上方への移動という方向性を保った。話者の位置が不明なため「来る」とはしなかった。
- source_word: תִמְנָתָה
  choice: ティムナへ
  rationale: 地名と方向を示す語尾を、自然な日本語の目的地表現で訳した。
- source_word: לָגֹז
  choice: 毛を刈るために
  rationale: לを伴う不定詞が表す目的を明示した。
- source_word: צֹאנוֹ
  choice: 羊
  rationale: צאןは小型家畜の群れを集合的に指し得るが、毛を刈る文脈では「羊」が具体的で自然である。語の広がりは脚注に残した。
