base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/006.yaml
  text: And Judah took a wife for Er his firstborn, and her name was Tamar.
translation:
  language: ja
  text: ユダは、長男エルのために妻を迎えた。その名はタマルであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 迎えた
  rationale: 基本義は「取る」だが、父ユダが息子のために妻を得る婚姻の文脈では、「妻を迎えた」が現代日本語として自然であり、婚姻を取り決めた含意も過度に説明せず表せる。
- source_word: אִשָּׁה
  choice: 妻
  rationale: ここではエルとの婚姻関係に入る女性を指すため、一般的な「女」ではなく「妻」が適切である。
- source_word: לְעֵר
  choice: エルのために
  rationale: 前置詞לְは、この行為の受益者・対象がエルであることを示す。「エルのために」がヘブライ語の構文を明瞭に保つ。
- source_word: בְּכוֹרוֹ
  choice: 長男
  rationale: בְּכוֹרは第一に生まれた息子を指す。この家族叙述では、自然な現代日本語の「長男」が意味を明確に伝える。
- source_word: וּשְׁמָהּ
  choice: その名は……であった
  rationale: ヘブライ語の標準的な命名表現を、簡潔で品位ある日本語にした。
- source_word: תָּמָר
  choice: タマル
  rationale: ヘブライ語の人名を、日本語聖書で定着した音写に従って表記した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。原文の二つの節を保ちつつ、「妻を取った」という不自然で物象化しやすい直訳を避け、「妻を迎えた」とした。
