  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תָּסַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜/הּ מֵֽ/עָלֶ֗י/הָ וַ/תְּכַ֤ס בַּ/צָּעִיף֙ וַ/תִּתְעַלָּ֔ף וַ/תֵּ֨שֶׁב֙ בְּ/פֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל דֶּ֣רֶךְ תִּמְנָ֑תָ/ה כִּ֤י רָאֲתָה֙ כִּֽי גָדַ֣ל שֵׁלָ֔ה וְ/הִ֕וא לֹֽא נִתְּנָ֥ה ל֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/014.yaml
  text: So she took off her widow’s garments from herself, and wrapped herself in a veil, and sat at the entrance to Enaim, which is on the road to Timnah. For she saw that Shelah had grown up, yet she had not been given to him as a wife.
translation:
  language: ja
  text: そこで彼女は、身に着けていたやもめの衣服を脱ぎ、ベールをかぶって身を包み[a]、ティムナへ向かう道沿いにあるエナイムの入口[b]に座った。シェラが成長したこと、そして自分がその妻として彼に与えられていないことを見たからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「身を包み」は、「姿を変えた」または「変装した」とも訳せる。
    reason: וַתִּתְעַלָּף の語義と文脈的含意に幅があるため。
  - marker: b
    text: 「エナイムの入口」に当たる語句全体を、一つの地名「ペタハ・エナイム」と解することもできる。
    reason: בְּפֶתַח עֵינַיִם の地名としての区切り方に解釈上の余地があるため。
lexical_decisions:
- source_word: בִּגְדֵי אַלְמְנוּתָהּ
  choice: やもめの衣服
  rationale: 単なる一般的な「喪服」と断定せず、彼女がやもめであることを示す衣服という原文の表現を保った。
- source_word: וַתִּתְעַלָּף
  choice: 身を包み
  rationale: 語根の再帰形が表す、覆いで自分の姿を包む動作を自然な日本語で示した。文脈上「変装した」とも解しうるため脚注を付した。
- source_word: בְּפֶתַח עֵינַיִם
  choice: エナイムの入口
  rationale: マソラ本文の母音付けと文脈に従い、עֵינַיִםを地名エナイムとして訳した。語句全体を一つの地名と見る可能性は脚注に残した。
- source_word: גָדַל שֵׁלָה
  choice: シェラがもう大人になった
  rationale: 単に身体が成長しただけでなく、結婚できる年齢に達していたという文脈を、過度に限定せず明瞭に表した。
- source_word: לֹא נִתְּנָה לוֹ לְאִשָּׁה
  choice: 自分がその妻として彼に与えられていない
  rationale: 原文の受動表現を保ち、タマルがシェラの妻として取り決められなかった状況を明示した。
theological_decisions:
- issue: タマルの覆いの目的
  choice: 本文では「身を包み」とし、意図を断定しない
  alternative: 「変装し」と訳す
  rationale: 文脈は身元を隠す意図を示唆するが、当該動詞自体の意味には議論があるため、本文では具体的動作を訳し、別解を脚注に示した。
- issue: 受動表現に含まれる責任主体
  choice: 「与えられていない」と受動のまま訳す
  alternative: 「ユダが彼女をシェラの妻にしなかった」
  rationale: 文脈上ユダの責任は明らかだが、この節のヘブライ語本文は主体を明示していないため、本文に補わなかった。
translation_notes:
  register: 現代の一般読者に理解しやすい標準的な文体を用いつつ、物語の重みを保つため、くだけすぎない語調とした。「やもめ」は聖書文脈で定着した語だが、「やもめの衣服」として意味が取りやすい形にした。
