  text: When it was time for her to give birth, behold, there were twins in her womb.
translation:
  language: ja
  text: 彼女が出産する時になると、なんと、胎内には双子がいた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: 時になると
  rationale: 物語の進行と時間的な状況設定を、現代日本語で自然に表す。独立した「さて」などは補わない。
- source_word: לִדְתָּהּ
  choice: 彼女が出産する
  rationale: ילדの不定詞連語形と三人称女性単数接尾辞を、明瞭で自然な現代日本語にした。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 注目すべき、意外な事実を提示するヒンネーの談話機能を、古風にならない表現で保つ。
- source_word: תְאוֹמִים
  choice: 双子
  rationale: この複数名詞が指す二人一組の胎児を、通常の日本語で直接表す。
- source_word: בְּבִטְנָהּ
  choice: 胎内には
  rationale: בטןは文脈により腹または胎を指すが、出産の場面なので「胎内」が最も正確で自然。「には」により、そこで判明した事実への焦点も自然に示す。
