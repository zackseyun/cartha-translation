  text: וַ/יָּ֨שָׁב֙ אֶל יְהוּדָ֔ה וַ/יֹּ֖אמֶר לֹ֣א מְצָאתִ֑י/הָ וְ/גַ֨ם אַנְשֵׁ֤י הַ/מָּקוֹם֙ אָֽמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/022.yaml
  text: So he returned to Judah and said[a], “I did not find her, and also the men of the place said[b], ‘There has been no cult prostitute here.’”
translation:
  language: ja
  text: そこで彼はユダのもとに戻って言った。「彼女は見つけられませんでした。しかも、その土地の男たちも、『ここには祭儀に関わる女[a]はいなかった』と言っていました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語ケデシャ。この語は祭儀的・聖別の含意をもつ女性を指す。「祭儀娼婦」または「神殿娼婦」と訳されることもあるが、具体的な役割や神殿への所属をどこまで含むかは明確でない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: そこで彼は戻って
  rationale: 物語を進めるワイイクトル形の連続性を、自然な現代日本語の「そこで」で表した。
- source_word: אֶל־יְהוּדָה
  choice: ユダのもとに
  rationale: 方向を示す אֶל を、人に戻る場合に自然な「のもとに」で訳した。
- source_word: לֹא מְצָאתִיהָ
  choice: 彼女は見つかりませんでした
  rationale: 否定を伴う完了形が示す、捜した結果として見つからなかったことを丁寧な報告口調で表した。
- source_word: וְגַם
  choice: それに
  rationale: 第二の報告を付け加える累加の働きを、会話として自然な接続表現で示した。
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: その土地の人々
  rationale: 字義的には「その場所の男たち」だが、地域住民を指す自然な日本語とし、文脈上不要な男性限定を避けた。
- source_word: לֹא הָיְתָה בָזֶה
  choice: ここには……いなかった
  rationale: その場所に該当する女性が存在しなかったという存在文を、簡潔で自然な日本語にした。
- source_word: קְדֵשָׁה
  choice: 神殿娼婦
  rationale: 一般の娼婦を表す זֹנָה と区別された、祭儀との関係を含む女性の呼称であることを示す。厳密に神殿施設に限定されるとは限らないため注を付した。
theological_decisions:
- issue: קְדֵשָׁה の祭儀的含意
  choice: 本文を「神殿娼婦」とし、注で語義の幅を説明する
  alternative: 聖娼、祭儀娼婦、聖別された女
  rationale: 一般読者に理解しやすく、通常の娼婦との語彙上の区別も示せる一方、制度の具体像について原文以上に断定しないよう注記した。
translation_notes:
  register: 明瞭な現代標準日本語。使者がユダに報告する場面なので丁寧語を用い、引用内の土地の人々の発言は簡潔な常体とした。
