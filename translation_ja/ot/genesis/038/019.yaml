  text: Then she arose and went away[b][a], and she removed her veil from upon her and put on the garments of her widowhood.
translation:
  language: ja
  text: 彼女は立ち上がってそこを去り、ベールを外して、やもめの服を身に着けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּקָם וַתֵּלֶךְ
  choice: 立ち上がってそこを去り
  rationale: 二つの連続動作を保ちつつ、הלךがこの場所からの退出を表すことを自然な日本語で示した。
- source_word: וַתָּסַר צְעִיפָהּ מֵעָלֶיהָ
  choice: ベールを外して
  rationale: צָעִיףは文脈上、顔や頭を覆うベールを指す。מֵעָלֶיהָの意味は日本語の「外す」に自然に含まれるため、冗長な直訳を避けた。
- source_word: וַתִּלְבַּשׁ בִּגְדֵי אַלְמְנוּתָהּ
  choice: やもめの服を身に着けた
  rationale: 衣服を着る動作と、寡婦としての身分を示す服であることの両方を保持した。「喪服」は葬儀用の礼服と誤解され得るため避けた。
