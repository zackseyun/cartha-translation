id: GEN.38.10
reference: Genesis 38:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּ֛רַע בְּ/עֵינֵ֥י יְהוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַ/יָּ֖מֶת גַּם אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/010.yaml
  text: What he did was evil in the sight of Yahweh, so he put him to death also.
translation:
  language: ja
  text: 彼のしたことはヤハウェの目に悪かったので、ヤハウェは彼をも死なせた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרַע
  choice: 悪かった
  rationale: רעעの状態的用法による道徳的評価を、現代日本語で直接かつ自然に表す。「気に入らなかった」よりも原文の善悪の評価を明確に保つ。
- source_word: בְּעֵינֵי יְהוָה
  choice: ヤハウェの目に
  rationale: 神による評価を示すヘブライ語の慣用表現について、「目」という比喩を保ちながら、日本語として理解できる形にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 固有の神名である四文字語を普通名詞や称号に置き換えず、音写して示す。
- source_word: אֲשֶׁר עָשָׂה
  choice: 彼のしたこと
  rationale: 直前に記されたオナンの行為を指す関係節を、簡潔で自然な現代日本語にした。
- source_word: וַיָּמֶת
  choice: 死なせた
  rationale: מותのヒフィル形が示す使役の意味と、死がヤハウェの行為として語られている点を保持する。「殺した」よりも原語の使役形に近い。
- source_word: גַּם אֹתוֹ
  choice: 彼をも
  rationale: 兄エルに続いてオナンも同じ裁きを受けたという、גםの文脈上の連続性を簡潔に表す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文に固有の神名が明記されているため、称号に置換せず音写した。
- issue: וַיָּמֶת における神の裁きと行為主体
  choice: ヤハウェは彼をも死なせた
  alternative: 彼も死んだ／ヤハウェは彼をも殺した
  rationale: ヒフィル形の使役性とヤハウェの直接的な行為主体性を保つ一方、「殺した」という日本語で原文以上の語感を加えることを避けた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼のしたこと」を主題として自然に提示し、後半では曖昧さを避けるため主語「ヤハウェ」を再掲した。
