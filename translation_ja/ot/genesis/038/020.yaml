  text: וַ/יִּשְׁלַ֨ח יְהוּדָ֜ה אֶת גְּדִ֣י הָֽ/עִזִּ֗ים בְּ/יַד֙ רֵעֵ֣/הוּ הָֽ/עֲדֻלָּמִ֔י לָ/קַ֥חַת הָ/עֵרָב֖וֹן מִ/יַּ֣ד הָ/אִשָּׁ֑ה וְ/לֹ֖א מְצָאָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/020.yaml
  text: Then Judah sent the young goat by the hand of his Adullamite friend to take back the pledge from the woman's hand[c][b][a], but he did not find her.
translation:
  language: ja
  text: そこでユダは、女の手から担保を取り戻すため、友人であるアドラム人に託して[a]子やぎを送りました。しかし、その友人は女を見つけませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「友人であるアドラム人の手によって」。ここでは、その人を使者として遣わしたという意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: そこで……送りました
  rationale: 物語を前へ進めるワウ継続法を、直前の出来事を受ける自然な現代日本語で表した。
- source_word: יְהוּדָה
  choice: ユダ
  rationale: 日本語聖書で広く用いられる標準的な人名表記。
- source_word: גְּדִי הָעִזִּים
  choice: 子やぎ
  rationale: 若い山羊を指す語句であり、簡潔で自然な日本語とした。
- source_word: בְּיַד רֵעֵהוּ הָעֲדֻלָּמִי
  choice: 友人であるアドラム人に託して
  rationale: 字義は「彼の友人であるアドラム人の手によって」。ここでは代理・媒介を表す慣用句なので、日本語で自然に「に託して」とした。
- source_word: לָקַחַת
  choice: 取り戻すため
  rationale: 目的を表す不定詞。すでに渡してあった品を回収する文脈なので「取り戻す」とした。
- source_word: הָעֵרָבוֹן
  choice: 担保
  rationale: 返済や履行の保証として預けられた物を指すため、現代日本語で明瞭な「担保」を選んだ。
- source_word: מִיַּד הָאִשָּׁה
  choice: 女の手から
  rationale: 原文の具体的な表現を保った。「手から」は所有・保管下から回収する意味で、日本語でも理解できる。
- source_word: וְלֹא מְצָאָהּ
  choice: しかし、その友人は女を見つけられませんでした
  rationale: 目的と失敗の対照を「しかし」で示した。ヘブライ語の男性単数主語は文脈上、遣わされたアドラム人を指すため、曖昧さを避けて補った。
