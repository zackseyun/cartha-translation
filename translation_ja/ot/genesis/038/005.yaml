base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/005.yaml
  text: She conceived again and bore a son[a], and she called his name Shelah[b]. And he was at Chezib when she bore him.
translation:
  language: ja
  text: 彼女はまた男の子を産み、その子をシェラと名づけた。彼女がその子を産んだ時、彼はケジブにいた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は「彼は」と読むが、その人物が誰を指すかは明示されていない。一部の古代の証言や解釈では、「彼女がその子を産んだとき、彼女はケジブにいた」と理解する。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּסֶף עוֹד וַתֵּלֶד בֵּן
  choice: 彼女はまた男の子を産み
  rationale: יסף＋עודは動作の反復を表す。「身ごもった」は原文に明示されていないため補わず、文脈上の反復を自然な日本語の「また」で表した。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ שֵׁלָה
  choice: その名をシェラと呼んだ
  rationale: 「その名を呼ぶ」というヘブライ語の表現を、現代日本語として理解できる範囲で保った。שֵׁלָהは人名として「シェラ」と音写した。
- source_word: וְהָיָה
  choice: 彼は…いた
  rationale: マソラ本文の動詞は男性単数形なので、性を保って「彼」とした。ただし主語は明示されず、誰を指すかには曖昧さがあるため本文で特定しない。
- source_word: בִכְזִיב
  choice: ケジブに
  rationale: 地名כזיבを日本語で「ケジブ」と音写し、場所を示すבを自然な助詞「に」で表した。
- source_word: בְּלִדְתָּהּ אֹתוֹ
  choice: 彼女がその子を産んだ時
  rationale: 前置詞בを伴う不定詞構文の時間的意味を、自然で明瞭な「時」で表した。אֹתוֹの男性単数目的語は、生まれた男の子を指すため「その子」とした。
theological_decisions:
- issue: וְהָיָהの主語
  choice: マソラ本文の男性単数形に従って「彼」とするが、人物名は補わない
  alternative: 一部の古代訳や解釈に従い「彼女はケジブにいた」とする
  rationale: ヘブライ語本文は男性単数形であり、これを本文に反映するのが最も直接的である。一方、文脈上の指示対象は明示されず、古代から女性主語と理解する伝承もあるため、異読を脚注に示して曖昧さを保った。
translation_notes:
  register: 簡潔な物語文として、現代の一般読者に読みやすく、かつ原文の反復表現と主語の曖昧さを保つ文体とした。人名・地名は一般的な日本語音写を用いた。
