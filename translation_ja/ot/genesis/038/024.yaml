source:
  edition: WLC
  text: וַ/יְהִ֣י כְּ/מִ/שְׁלֹ֣שׁ חֳדָשִׁ֗ים וַ/יֻּגַּ֨ד לִֽ/יהוּדָ֤ה לֵֽ/אמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔/ךָ וְ/גַ֛ם הִנֵּ֥ה הָרָ֖ה לִ/זְנוּנִ֑ים וַ/יֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּ/הָ וְ/תִשָּׂרֵֽף׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/024.yaml
  text: And it happened about three months later that Judah was told[a], “Tamar your daughter-in-law has acted as a prostitute, and behold, she is also pregnant by prostitution.” Then Judah said, “Bring her out[b], and let her be burned.”
translation:
  language: ja
  text: およそ三か月後、ユダにこう知らされた。「あなたの嫁のタマルが売春をした[a]。しかも、売春によって身ごもっている[b]。」ユダは言った。「彼女を連れ出せ。焼かせよ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「娼婦のように振る舞った」。より広く「性的不品行を行った」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「売春の結果、身ごもっている」または「売春行為によって身ごもっている」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּמִשְׁלֹשׁ חֳדָשִׁים
  choice: およそ三か月後
  rationale: כְּによる概数を「およそ」で示し、物語の時間的進展を自然な現代日本語で表した。
- source_word: וַיֻּגַּד לִיהוּדָה לֵאמֹר
  choice: ユダにこう知らされた
  rationale: נגדのホファル形が表す受動的な報告を保ち、לֵאמֹרは後続する直接話法へ自然につないだ。
- source_word: זָנְתָה
  choice: 売春をし
  rationale: זנהが持つ売春の比喩・告発的な語感を、一般的な「性的不品行」へ広げずに保持した。文脈上、これは報告者たちの告発として提示されている。
- source_word: כַּלָּתֶךָ
  choice: あなたの嫁
  rationale: 日本語で自然な親族呼称を用いた。「義理の娘」よりも、この家族関係と文脈に適した表現である。
- source_word: וְגַם הִנֵּה
  choice: そのうえ
  rationale: 追加と強調・驚きを表す語句を、過度に古風な「見よ」を避けて自然に示した。
- source_word: הָרָה לִזְנוּנִים
  choice: 売春によって身ごもっています
  rationale: הָרָהを「身ごもっている」、לִזְנוּנִיםを原因・結果を示す「売春によって」と訳し、זנהとの語根上のつながりも保った。
- source_word: הוֹצִיאוּהָ
  choice: 彼女を引き出せ
  rationale: 複数への命令と三人称女性単数の目的語を、直接的な命令として表した。
- source_word: וְתִשָּׂרֵף
  choice: そして、焼き殺せ
  rationale: ニファル形の受動的表現を日本語で逐語的にすると不自然になるため、命令の実質と処刑の重大さを明確にする自然な表現を採った。執行者が誰かは特定していない。
theological_decisions:
- issue: 性的罪を表すזנה／זנוניםの訳語
  choice: 「売春をし」／「売春によって」
  alternative: 「淫行をし」／「性的不品行によって」
  rationale: 原文は同語根を重ね、売春を想起させる告発語を用いている。その具体性と反復を保ち、より広い道徳的概念へ置き換えなかった。
- issue: ユダが命じた刑罰の強さと文法上の態
  choice: 「彼女を引き出せ。そして、焼き殺せ」
  alternative: 「彼女を引き出し、焼かれるようにせよ」
  rationale: 原文のニファル形は受動だが、後者は現代日本語として著しく不自然である。採用訳は死刑命令としての力を明確にしつつ、具体的な執行者を付け加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、告発と処刑命令の厳しさを弱めない荘重な語調とした。「見よ」の直訳は避け、「そのうえ」で追加的な強調を表した。脚注記号は、それぞれが説明する語句の直後に置いた。
