id: GEN.38.7
reference: Genesis 38:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְמִתֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/007.yaml
  text: Er[a], Judah’s firstborn, was evil in the sight of Yahweh, and Yahweh put him to death.
translation:
  language: ja
  text: ユダの長男エルは、ヤハウェの目に悪い者であった。そして、ヤハウェは彼を死なせた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「彼を死なせた」。
    reason: ヘブライ語の使役形が示す、ヤハウェによる直接的な死の惹起を明示するため。
lexical_decisions:
- source_word: וַיְהִי
  choice: …であった
  rationale: 物語を進める接続形だが、明示的な「今」「その時」を加えず、日本語では文脈と叙述形によって自然に表した。
- source_word: עֵר
  choice: エル
  rationale: 人名として、日本語で一般的かつ原語に即した形に音写した。
- source_word: בְּכוֹר יְהוּדָה
  choice: ユダの長男
  rationale: 連語が示す親子関係と出生順位を、自然な現代日本語で表した。
- source_word: רַע
  choice: 悪い者
  rationale: ここでは災いや品質の悪さではなく、ヤハウェによる道徳的評価を表すため、「悪い者」とした。
- source_word: בְּעֵינֵי יְהוָה
  choice: ヤハウェの目に
  rationale: ヤハウェの観点からの評価を示すヘブライ語の比喩を、理解可能な日本語で保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: וַיְמִתֵהוּ
  choice: 彼を死に至らせた
  rationale: מותのヒフィル形が示す使役と、ヤハウェの直接的な行為主体性を保ちつつ、「殺した」より荘重な日本語とした。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として提示した。
- issue: エルの死における神の行為主体性
  choice: ヤハウェは彼を死に至らせた
  alternative: ヤハウェは彼を殺した／ヤハウェは彼を死なせた
  rationale: 原文の使役形が明示する神の直接的な関与を弱めず、同時に死の手段や追加の説明を本文へ持ち込まないようにした。
translation_notes:
  register: 明瞭で現代的だが荘重さを保つ叙述体。「そして」により原文の単純な物語進行を示し、明示されていない因果接続詞は加えていない。
