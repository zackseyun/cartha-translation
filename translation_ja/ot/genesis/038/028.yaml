base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/028.yaml
  text: And when she was giving birth[a], he put out a hand, and the midwife took it and tied a scarlet thread on his hand, saying[c][b], “This one came out first.”
translation:
  language: ja
  text: 彼女が出産しているとき、一人の子が手を出した[a]。助産師はその手を取り、その手に緋色の糸を結びつけ[b]、「この子が先に出た」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼は手を与えた」。出産中に子の手が現れたことを表す言い回しで、「手が出てきた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は糸やひもに当たる名詞を明記せず、「緋色」とだけ記している。ここでは、先に姿を現した双子を見分ける目印として手に結んだ素材を指す。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: בְּלִדְתָּהּ
  choice: 彼女が出産していると
  rationale: 前置詞 בְּ と不定詞連語に三人称女性単数接尾辞が付いた形を、出産が進行している時の出来事として自然な現代日本語で表した。
- source_word: וַיִּתֶּן יָד
  choice: 一人が片手を出した
  rationale: 直訳的には「彼は手を与えた」だが、ここでは出産中に双子の一人の手が現れたことを表す。「一人」で未特定の双子を示し、「片手」で自然な日本語にした。
- source_word: הַמְיַלֶּדֶת
  choice: 助産婦
  rationale: 出産を介助する女性を指す定冠詞付きの語。物語の時代背景と人物を明確に表す簡潔な訳語を採用した。
- source_word: וַתִּקְשֹׁר עַל יָדוֹ שָׁנִי
  choice: その手を取り、緋色の糸を結びつけて
  rationale: שָׁנִי は緋色の素材を指し、ここでは識別のため手に結ぶ糸ないしひもと理解される。「その手を取り」は וַתִּקַּח の文脈上の目的語を明示した。
- source_word: זֶה יָצָא רִאשֹׁנָה
  choice: この子が先に出た
  rationale: 指示語 זֶה を文脈に即して「この子」とし、רִאשֹׁנָה は身分としての「長子」ではなく、出てきた順序を示す「先に」と訳した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。短い動作の連続を自然に示しつつ、双子のどちらであるかがまだ確定していない点と、「先に出た」が出生順位ではなく、その時点での見立てであることを保った。
