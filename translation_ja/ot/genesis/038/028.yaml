    rationale: 原文は「彼の手に緋色を結んだ」（עַל יָדוֹ）と、手に結び付けたことを明示する。直前の「その手を取り」から推測は可能だが、訳文にも「その手に」を置くことで原文の関係を明確に保てる。
  - severity: low
