  text: וַ/יִּשְׁאַ֞ל אֶת אַנְשֵׁ֤י מְקֹמָ/הּ֙ לֵ/אמֹ֔ר אַיֵּ֧ה הַ/קְּדֵשָׁ֛ה הִ֥וא בָ/עֵינַ֖יִם עַל הַ/דָּ֑רֶךְ וַ/יֹּ֣אמְר֔וּ לֹא הָיְתָ֥ה בָ/זֶ֖ה קְדֵשָֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/021.yaml
  text: He asked the men of her place[a], saying, “Where is the cult prostitute who was at Enaim by the road?” But they said[b], “There has been no cult prostitute here.”
translation:
  language: ja
  text: 彼はその土地の男たちに尋ねた。「エナイム[b]の道端にいた祭儀娼婦[a]は、どこにいますか。」彼らは答えた。「ここには祭儀娼婦はいませんでした。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神殿娼婦」とも訳せる。ヘブライ語は祭儀と関係する娼婦を指すが、特定の神殿建造物があったことまで示すとは限らない。
    reason: lexical_alternative
  - marker: b
    text: エナイムは地名。ヘブライ語の形は「目」、または「泉」を表す語と関連する可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאַל
  choice: 彼は…尋ねた
  rationale: 物語を進める通常の用法として、自然な現代日本語の「尋ねた」とした。
- source_word: אַנְשֵׁי מְקֹמָהּ
  choice: その土地の人々
  rationale: 直訳的には「彼女の場所の男たち」だが、文脈上はその場所の住民を指す。「その土地の人々」は指示関係を自然に保ち、男性だけを不必要に強調しない。
- source_word: לֵאמֹר
  choice: （直接話法で表現）
  rationale: ヘブライ語では直接話法を導く定型表現。日本語では引用の形そのものによって自然に表した。
- source_word: הַקְּדֵשָׁה / קְדֵשָׁה
  choice: 神殿娼婦
  rationale: 通常の娼婦を表す語とは異なり、祭儀との関連を示す女性名詞。「神殿娼婦」は日本語で定着した簡潔な訳語だが、神殿建造物を明示する語ではないため脚注で補足した。
- source_word: בָעֵינַיִם
  choice: エナイムに
  rationale: 文脈上は地名として扱い、語義を推測して訳さず音写した。
- source_word: עַל הַדָּרֶךְ
  choice: 道端の
  rationale: 道路に接した位置を表す自然な日本語。地名エナイムを修飾する形にして、原文の位置関係を保った。
- source_word: לֹא הָיְתָה בָזֶה קְדֵשָׁה
  choice: ここには神殿娼婦はいませんでした
  rationale: その場所にそのような女性が存在・滞在していたことを否定する発言として、過去形を保ちながら自然な会話文にした。
theological_decisions:
- issue: קְדֵשָׁה が示す祭儀との関係
  choice: 神殿娼婦
  alternative: 祭儀娼婦／娼婦
  rationale: 通常の「娼婦」との語彙上の区別を保つ一方、特定の宗教制度について本文以上の説明を加えない。建造物としての神殿を必ずしも意味しない点は脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。会話は過度に古風にせず、原文の問いと土地の人々による否定を簡潔に再現した。
