base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/029.yaml
  text: And as he drew back his hand[a], behold, his brother came out. Then she said[b], “What a breach you have made for yourself!” So his name was called Perez.
translation:
  language: ja
  text: その子が手を引っ込めると、見よ、その兄弟が出てきた。そこで彼女は言った。「なんという突き破り方をしたのだ！」[a] それで、その子はペレツと名づけられた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、動詞と名詞に同じ語根 פרץ（「破る、突き破る」）を重ねた、「あなたは自分のために、なんという破れを突き破ったのか」のような表現。前置詞 עָלֶיךָ（直訳「あなたの上に／あなたに対して」）の意味合いは不確かである。
    reason: lexical_alternative
  - marker: b
    text: 「ペレツ」は、直前の「突き破り方」と訳した語に用いられているヘブライ語の語根 פרץ に由来する名である。
    reason: name_wordplay
lexical_decisions:
- source_word: כְּמֵשִׁיב יָדוֹ
  choice: その子が手を引っ込めると
  rationale: שוב のヒフィル分詞と「手」の組み合わせを、出産場面に即して具体的かつ自然に表した。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 予想外の展開を生き生きと示す提示辞の機能を、現代日本語の物語表現で伝えた。
- source_word: יָצָא אָחִיו
  choice: 兄弟のほうが出てきた
  rationale: יָצָא の身体的な意味を保ちつつ、「ほうが」で先に手を出した子との意外な交代を明確にした。
- source_word: מַה פָּרַצְתָּ עָלֶיךָ פָּרֶץ
  choice: なんという破り出方をしたのか！
  rationale: 語根 פרץ の反復と、名ペレツにつながる語呂を「破り出る」で可能な限り保持した。עָלֶיךָ は解釈が難しいため、日本語本文では過度に意味を限定しなかった。
- source_word: פָּרֶץ
  choice: ペレツ
  rationale: ヘブライ語の子音と日本語聖書で理解しやすい音写を採用し、直前の「破り出方」との語源的関係は脚注で示した。
- source_word: וַיִּקְרָא שְׁמוֹ פָּרֶץ
  choice: その子はペレツと名づけられた
  rationale: 動詞が単数男性形である一方、明示的な主語を補わずに済む受け身表現を用い、ヘブライ語の命名定型を自然な日本語にした。
