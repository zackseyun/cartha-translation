  register: 明瞭で現代的な標準日本語を用いながら、出産場面の急展開とヘブライ語の語呂を保持した。「兄弟」は性別を明示するヘブライ語 אָחִיו に対応する。発言者は直前の文脈では助産婦なので本文に補ったが、当節のヘブライ語自体には主語が明記されていない。
