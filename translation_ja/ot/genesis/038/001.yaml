  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֵּ֥רֶד יְהוּדָ֖ה מֵ/אֵ֣ת אֶחָ֑י/ו וַ/יֵּ֛ט עַד אִ֥ישׁ עֲדֻלָּמִ֖י וּ/שְׁמ֥/וֹ חִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/038/001.yaml
  text: At that time Judah went down from his brothers and turned aside to a certain Adullamite whose name was Hirah[a][b].
translation:
  language: ja
  text: そのころ、ユダは兄弟たちのもとを離れて下って行き、進路を変えて、ヒラという名のあるアドラム人のもとへ向かった[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「そして、その時のことであった」。これは新しい出来事を導入するヘブライ語の物語表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あるアドラム人の男」。ヘブライ語は、その人物がアドラム出身であることを示すと同時に、特定の人物を物語に登場させる言い方とも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: そのころ
  rationale: 新しい挿話の時間的背景を示す物語表現。接続的な「そして、…となった」を逐語的に再現せず、現代日本語で自然に時を示した。
- source_word: וַיֵּרֶד
  choice: 下って行き
  rationale: ירד の方向性を保つ。地理的・社会的含意を必要以上に特定せず、基本義を自然な日本語で表した。
- source_word: מֵאֵת אֶחָיו
  choice: 兄弟たちのもとを離れて
  rationale: 単なる起点だけでなく、兄弟たちからの離別を示す文脈上の意味を明確にした。
- source_word: וַיֵּט עַד
  choice: …のところへ身を寄せた
  rationale: נטה の「向きを変える／それる」という移動の意味を、この人物との関係へ向かった文脈に即して自然に表現した。「立ち寄った」より継続的な結びつきも許す訳である。
- source_word: אִישׁ עֲדֻלָּמִי
  choice: アドラム人
  rationale: 出身地による人物の特定を簡潔に示す。איש を独立して「男」と訳さなくても、日本語では人物であることが明白である。
- source_word: וּשְׁמוֹ חִירָה
  choice: ヒラという名の
  rationale: ヘブライ語の名を告げる節を、修飾表現として自然な日本語に組み込んだ。
- source_word: חִירָה
  choice: ヒラ
  rationale: ヘブライ語人名の慣用的な日本語音写。
theological_decisions: []
