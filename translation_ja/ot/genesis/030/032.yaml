  text: אֶֽעֱבֹ֨ר בְּ/כָל צֹֽאנְ/ךָ֜ הַ/יּ֗וֹם הָסֵ֨ר מִ/שָּׁ֜ם כָּל שֶׂ֣ה נָקֹ֣ד וְ/טָל֗וּא וְ/כָל שֶׂה חוּם֙ בַּ/כְּשָׂבִ֔ים וְ/טָל֥וּא וְ/נָקֹ֖ד בָּ/עִזִּ֑ים וְ/הָיָ֖ה שְׂכָרִֽ/י־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/032.yaml
  text: Let me pass through all your flock today[a], removing from there every speckled and spotted sheep, every dark-colored lamb among the sheep, and every spotted and speckled one among the goats[b]; and that will be my wages.
translation:
  language: ja
  text: 今日、私があなたの群れを全部見て回り、そこから斑点のある羊とまだらの羊をすべて取り分けます。羊の中からは褐色のものをすべて、やぎの中からはまだらのものと斑点のあるものを取り分けます。それが私の報酬になります。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「褐色の」（חוּם）は「暗色の」とも訳せる。羊の毛色について、褐色ないし暗い色を指す。
    reason: lexical_alternative
  - marker: b
    text: 「斑点のある」（נָקֹד）と「まだらの」（טָלוּא）は、いずれも模様のある毛色を表す語で、両者の厳密な区別は重なり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעֱבֹר בְּכָל צֹאנְךָ הַיּוֹם
  choice: 今日、あなたの群れを全部見て回らせてください
  rationale: 未完了形は文脈上、ヤコブがラバンに許可を求める意志的な申し出として理解できる。「群れ」は羊とやぎを含む集合語であり、「見て回る」は群れの中を通って選別する具体的な行為を自然に表す。
- source_word: הָסֵר מִשָּׁם
  choice: そこから…取り分けてください
  rationale: 原語は「除く、離す」を表す。交渉の文脈では単なる排除より、報酬となる家畜を群れから選別する意味が明確な「取り分ける」が適切。命令の主体は文法上曖昧さを含むが、直後の報酬規定と後続文脈に沿って依頼形とした。
- source_word: נָקֹד וְטָלוּא
  choice: ぶちとまだら
  rationale: いずれも斑紋のある毛色を指し、厳密な差は確定しにくい。日本語で区別を保ちつつ一般読者に分かりやすい対語を選んだ。
- source_word: חוּם
  choice: 黒みがかったもの
  rationale: 羊における暗色ないし褐色を表す語。特定の色調へ狭めすぎず、通常の白い羊との対比が伝わる表現とした。
- source_word: בַּכְּשָׂבִים
  choice: 羊の中から
  rationale: 語形は羊類を指す。ここでは対をなす「やぎ」と区別し、自然な総称として「羊」とした。
- source_word: בָּעִזִּים
  choice: やぎの中から
  rationale: やぎ類の集合的複数。「雌やぎ」と限定せず、文脈に即した一般的な「やぎ」とした。
- source_word: וְהָיָה שְׂכָרִי
  choice: それを私の報酬としてください
  rationale: שָׂכָרは雇用関係における賃金・報酬を指す。現代日本語として自然で、提案の調子を保つ表現とした。
theological_decisions:
- issue: הָסֵר の行為主体
  choice: ラバンへの依頼として「取り分けてください」
  alternative: ヤコブ自身の行為として「取り分けながら」
  rationale: ヘブライ語の絶対不定詞は、直前の一人称動詞との関係から主体の解釈に幅がある。後続の創世記30:35ではラバンが実際に家畜を取り分けるため、本訳ではラバンへの依頼として読んだが、別解を脚注に明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、家畜選別の場面にふさわしい具体性と、雇用条件を提示するヤコブの丁寧な申し出の調子を保った。「斑点のある／斑のある」のような説明調を避け、「ぶち／まだら」で簡潔に区別した。
