source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ לָבָ֔ן אִם נָ֛א מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ נִחַ֕שְׁתִּי וַ/יְבָרֲכֵ֥/נִי יְהוָ֖ה בִּ/גְלָלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/027.yaml
  text: Then Laban said to him[a], “If I have found favor in your eyes, please stay[b]. I have learned by divination that Yahweh has blessed me because of you.”
translation:
  language: ja
  text: そこでラバンは彼に言った。「もし私があなたの好意を得ているのなら、どうかとどまってほしい。[a] 私は占いによって、ヤハウェがあなたのおかげで私を祝福してくださったことを知った。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「とどまってほしい」は原文では省略されているが、文脈から補った。直訳すると、「もし私があなたの好意を得ているのなら、どうか……」となる。
    reason: 原文で省略されている依頼内容を文脈から補ったことを明示するため。
lexical_decisions:
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: もし私があなたの好意を得ているのなら、どうかここにとどまってほしい
  rationale: 「目に恵みを見いだす」というヘブライ語の慣用句を、現代日本語として自然な「好意を得る」で表した。נָאの懇願の調子は「どうか」に反映した。原文では依頼の内容が省略されているため、文脈に従って「ここにとどまってほしい」を補った。
- source_word: נִחַשְׁתִּי
  choice: 私は占いによって……知った
  rationale: ピエル形のנחשׁが通常表す占いや兆しの解読という強い語義を保持しつつ、その結果として知ったという日本語にした。単なる経験による理解へ弱めなかった。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語表記で音写した。
- source_word: וַיְבָרֲכֵנִי
  choice: 私を祝福してくださった
  rationale: ברךの基本義を「祝福する」とした。ラバンがヤハウェの働きに言及する発話として、敬意を示す自然な日本語の補助動詞を用いた。
- source_word: בִּגְלָלֶךָ
  choice: あなたのおかげで
  rationale: 原因・契機を表す句を自然な日本語で表現した。ここでは話者が利益を受けたため、「おかげで」が文脈に合う。
- source_word: לָבָן
  choice: ラバン
  rationale: 人名を日本語聖書で一般的な形に音写した。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号へ置換せず、音写して保持した。
- issue: ラバンが知った手段
  choice: 占いによって知った
  alternative: 経験によって知った
  rationale: נִחַשְׁתִּיには経験から察するという解釈の余地も論じられるが、この語形の通常の語義である占い・兆しの解読を本文で明示し、ラバンの行為を神学的に美化しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会話としての丁寧な懇願と物語文の品位を保った。「占い」は原語の強い語義を隠さない表現とした。
