base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/038.yaml
  text: He set the rods that he had peeled in the troughs[a], in the watering channels where the flock came to drink, in front of the flock[c][b]; and they mated when they came to drink.
translation:
  language: ja
  text: ヤコブは、皮をはいだ枝を、群れが水を飲みに来る水飲み場の水槽の中に、群れの前に置いた。群れは水を飲みに来たとき、発情した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「交尾した」とも訳せる。ヘブライ語は字義的には、動物が熱を帯びる、すなわち発情することを表し、この文脈では交尾が含意されている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּג
  choice: 置いた
  rationale: 物を所定の位置に据える具体的な動作を、自然な現代日本語で表す。
- source_word: הַמַּקְלוֹת אֲשֶׁר פִּצֵּל
  choice: 皮をはいだ枝
  rationale: 前節で樹皮をはいで縞を作った枝を指す。「枝」は文脈に合い、「皮をはいだ」は動作を明確に伝える。
- source_word: בָּרֳהָטִים בְּשִׁקֲתוֹת הַמָּיִם
  choice: 水飲み場の水おけの中
  rationale: 関連する二つの場所表現を別々の施設と断定せず、水を飲ませる場所とその水おけを重ねて描く表現として訳す。
- source_word: אֲשֶׁר תָּבֹאןָ הַצֹּאן לִשְׁתּוֹת
  choice: 群れが水を飲みに来る所
  rationale: צֹאןは羊や山羊を含み得る小家畜の集合を表すため、種を限定しない「群れ」とする。
- source_word: לְנֹכַח הַצֹּאן
  choice: 群れの目の前になるように
  rationale: 枝が群れの正面、目に入る位置に置かれたことを自然に表す。
- source_word: וַיֵּחַמְנָה
  choice: 発情した
  rationale: 語の直接的な意味である「熱する／発情する」を保持する。文脈上は交尾行動も含意し得るが、本文でそれに限定しない。
- source_word: בְּבֹאָן לִשְׁתּוֹת
  choice: 水を飲みに来たとき
  rationale: 前置詞付き不定詞の時間的意味を明瞭に表す。
