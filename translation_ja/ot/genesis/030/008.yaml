source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים נִפְתַּ֛לְתִּי עִם אֲחֹתִ֖/י גַּם יָכֹ֑לְתִּי וַ/תִּקְרָ֥א שְׁמ֖/וֹ נַפְתָּלִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/008.yaml
  text: Then Rachel said[a], “With wrestlings of God I have wrestled with my sister, and I have also prevailed.” So she called his name Naphtali.
translation:
  language: ja
  text: ラケルは言った。「私は姉と、神の格闘をして、しかも勝った。」[a] そこで、彼女はその子をナフタリと名づけた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は、直訳すると「神の格闘をもって、私は姉と格闘した」。この表現は、神にかかわる格闘を指すとも、「非常に激しい格闘」という意味とも取れる。
    reason: 原文の特異な言い回し、反復、および解釈上の曖昧さを示すため。
  - marker: b
    text: 「ナフタリ」は、前の「格闘をした」に当たるヘブライ語と語根が共通している。
    reason: 日本語では再現できない命名の語呂合わせを示すため。
lexical_decisions:
- source_word: נַפְתּוּלֵי אֱלֹהִים
  choice: 神の格闘
  rationale: 直訳に近い表現で、神への直接的言及とも「並外れて激しい格闘」という強意表現とも取り得る原文の曖昧さを本文に残した。日本語だけでは意味が確定しにくいため、脚注で主要な解釈を示した。
- source_word: נִפְתַּלְתִּי
  choice: 格闘をし
  rationale: 身体的な組み合いを比喩とする原語の具体性を保ち、ナフタリという名との語呂合わせにもつながる語を選んだ。
- source_word: עִם אֲחֹתִי
  choice: 姉と
  rationale: 前置詞の基本義「〜と」を保った。相手が姉レアであることは物語の文脈から明らかであり、自然な現代日本語では「姉」とした。対抗関係は「格闘」によって伝わる。
- source_word: גַּם יָכֹלְתִּי
  choice: しかも勝った
  rationale: ここでの יכל は単なる能力ではなく、姉との競い合いで優勢になったとの主張を表す。「しかも」によって גַּם の追加・強調の含みを示した。
- source_word: וַתִּקְרָא שְׁמוֹ נַפְתָּלִי
  choice: そこで、その子をナフタリと名づけた
  rationale: ヘブライ語の命名定型を、説明と命名の因果関係が自然に伝わる現代日本語にした。
- source_word: נַפְתָּלִי
  choice: ナフタリ
  rationale: 日本語聖書で定着した音写を用いた。原語では直前の「格闘」と語根を共有するため、その語呂合わせを脚注で補った。
theological_decisions:
- issue: 「神の格闘」における אֱלֹהִים の機能
  choice: 本文では「神の」と訳し、解釈を確定しない
  alternative: 「激しい」「大いなる」と強意に訳す
  rationale: אֱלֹהִים は神への直接的言及とも、最上級・強意的用法とも理解できる。本文で一方に限定せず、脚注に両可能性を示した。
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、ラケルの勝利宣言の力強さを保った。「神の格闘」は意図的にやや異質な表現として残し、原文の曖昧さを脚注で支えた。
