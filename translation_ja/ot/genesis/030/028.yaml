  text: וַ/יֹּאמַ֑ר נָקְבָ֧/ה שְׂכָרְ/ךָ֛ עָלַ֖/י וְ/אֶתֵּֽנָה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/028.yaml
  text: Then he said[a], “Name your wages, and I will give it.”
translation:
  language: ja
  text: そこで彼は言った。「あなたの賃金を指定してくれ[a]。私がそれを払おう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの賃金を私に告げてくれ。私がそれを与えよう。」
    reason: נָקְבָה は「指定する」のほか「告げる」とも訳せる。עָלַי の句を「私に」と明示し、נתן の基本義「与える」を保つ訳である。
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: そこで彼は言った
  rationale: 接続形による物語の進行を、現代日本語で自然な「そこで」によって表した。主語は原文どおり代名詞にとどめ、文脈上の人物名を補わなかった。
- source_word: נָקְבָה
  choice: はっきり示してくれ
  rationale: נקב の「明示する、指定する」という意味を表す。報酬について日本語で自然に通じる表現としつつ、単に「言う」よりも明確な指定を求める語感を保った。
- source_word: שְׂכָרְךָ
  choice: あなたの報酬
  rationale: 労働に対する支払いを指す語。「賃金」も可能だが、この家族間の取り決めを含む文脈では「報酬」が自然で、原語の意味の幅も保てる。
- source_word: עָלַי
  choice: （「示してくれ」の相手として反映）
  rationale: 字義的には「私の上に」だが、ここでは指定の相手または支払いを引き受ける者を示す慣用的用法。日本語では相手が明白なため「私に」を明示せず、脚注に字義的な形を示した。
- source_word: וְאֶתֵּנָה
  choice: 私がそれを支払おう
  rationale: נתן は字義的には「与える」。ここでは報酬が目的語なので「支払う」が自然であり、話者の意志・約束を「〜よう」で表した。単数の報酬を「それ」で受けた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、命令は文脈に合う「〜してくれ」、約束は落ち着いた「〜よう」とした。
