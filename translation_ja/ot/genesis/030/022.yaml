base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/022.yaml
  text: Then God remembered Rachel[b][a], and God listened to her and opened her womb.
translation:
  language: ja
  text: そこで、神はラケルを思い起こし[a]、神は彼女に耳を傾け[b]、彼女の胎を開いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ラケルに目を留め」「ラケルを心に留め」。ここで「思い起こす」は、神がラケルを忘れていたという意味ではなく、彼女を顧みて行動を起こすことを表す聖書特有の言い方。
    reason: lexical_alternative
  - marker: b
    text: 別訳「彼女の声を聞き」「彼女の言うことを聞き」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: 思い起こし
  rationale: זכרの基本的な比喩表現を保つ。この文脈では、単なる記憶の回復ではなく、ラケルに好意をもって目を留め、行動を起こすことを表す。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 各動詞が単数形であり、唯一の神を指している。
- source_word: אֶת רָחֵל
  choice: ラケルを
  rationale: אֶתは直接目的語を示す。人名は現代日本語で定着した形に従った。
- source_word: וַיִּשְׁמַע אֵלֶיהָ
  choice: 神は彼女に耳を傾け
  rationale: שׁמע＋אֶלは、単に音を聞く以上に、相手の訴えを注意深く聞いて応じる含みを持ちうる。「願いを聞き入れた」として本文に明示されていない願いを補わず、関係的な含意を保った。
- source_word: וַיִּפְתַּח
  choice: 開いた
  rationale: פתחの具体的な表現を保ち、結末の神の働きを明確にした。
- source_word: רַחְמָהּ
  choice: その胎を
  rationale: רֶחֶםは「胎、子宮」を意味する。受胎できるようにしたという意味を説明的に言い換えず、ヘブライ語の身体的な比喩を保持した。
- source_word: וַ
  choice: その時／接続表現
  rationale: 連続する物語上の進展を自然な現代日本語で示した。節中では読みにくい接続詞の反復を避けつつ、動作の順序を保った。
theological_decisions:
- issue: 神がラケルを「思い起こす」という擬人的表現
  choice: 本文では「思い起こし」を保つ
  alternative: 「ラケルに目を留め」「ラケルを心に留め」
  rationale: この表現は、神が以前ラケルを忘れていたという意味ではなく、神の好意ある顧みが具体的な行動として現れることを示す。ただし、聖書に繰り返し現れる重要な表現を本文で説明的に置き換えず、注で意味を補った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「耳を傾ける」と「胎を開く」により原文の具体的表現を残し、説明的な意訳を避けた。原文で二度明示される「神」を日本語本文でも反復し、神が行為者であることを保った。
