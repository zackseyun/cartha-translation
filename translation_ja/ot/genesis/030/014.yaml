  text: וַ/יֵּ֨לֶךְ רְאוּבֵ֜ן בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּמְצָ֤א דֽוּדָאִים֙ בַּ/שָּׂדֶ֔ה וַ/יָּבֵ֣א אֹתָ֔/ם אֶל לֵאָ֖ה אִמּ֑/וֹ וַ/תֹּ֤אמֶר רָחֵל֙ אֶל לֵאָ֔ה תְּנִי נָ֣א לִ֔/י מִ/דּוּדָאֵ֖י בְּנֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/014.yaml
  text: In the days of the wheat harvest[a], Reuben went and found mandrakes in the field, and he brought them to Leah his mother. Then Rachel said to Leah, “Please give me some of your son’s mandrakes.”
translation:
  language: ja
  text: 小麦の刈り入れのころ、ルベンは出かけて畑でマンドレイク[a]を見つけ、母レアのところへ持って来た。するとラケルはレアに言った。「どうか、あなたの息子のマンドレイクを少しください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恋なす」とも呼ばれる植物。ヘブライ語の指す植物の厳密な同定には議論があるが、伝統的にマンドレイクとされ、この前後の物語では受胎との関連が意識されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: 小麦の刈り入れのころ
  rationale: 直訳的な「小麦の収穫の日々に」ではなく、収穫期を表す自然な現代日本語とした。
- source_word: וַיֵּלֶךְ
  choice: 出かけて
  rationale: 物語を進める「行った」を文脈に即して自然に表した。「外へ出た」という意味までは強調しない。
- source_word: דּוּדָאִים
  choice: マンドレイク
  rationale: 伝統的な植物同定を採用しつつ、厳密な同定には議論があるため脚注で補足した。
- source_word: בַּשָּׂדֶה
  choice: 野で
  rationale: שָׂדֶה は畑または野を指し得る。ここでは特定の耕作地に限定せず、自然な「野で」とした。
- source_word: וַיָּבֵא אֹתָם אֶל לֵאָה אִמּוֹ
  choice: 母レアのところへ持って来た
  rationale: 複数目的語を日本語では省略可能な形で受け、「彼の母レア」を自然な語順にした。
- source_word: תְּנִי נָא לִי
  choice: どうか……ください
  rationale: 命令形と懇願・丁寧さを添える נָא の両方を、自然な依頼表現で示した。
- source_word: מִדּוּדָאֵי בְּנֵךְ
  choice: あなたの息子のマンドレイクを少し
  rationale: מִן の部分を表す用法を「少し」で示し、בְּנֵךְ の所有関係も保持した。
