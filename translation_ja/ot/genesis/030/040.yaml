  text: וְ/הַ/כְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠/יִּתֵּן פְּנֵ֨י הַ/צֹּ֧אן אֶל עָקֹ֛ד וְ/כָל ח֖וּם בְּ/צֹ֣אן לָבָ֑ן וַ/יָּֽשֶׁת ל֤/וֹ עֲדָרִים֙ לְ/בַדּ֔/וֹ וְ/לֹ֥א שָׁתָ֖/ם עַל צֹ֥אן לָבָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/040.yaml
  text: And Jacob separated the lambs[a], and he set the faces of the flock toward the striped and all the dark-colored among Laban's flock. Then he set apart flocks for himself[c][b], and did not put them with Laban’s flock.
translation:
  language: ja
  text: ヤコブは子羊[a]をより分け、群れを、ラバンの群れの中の[b]縞模様のもの[c]と黒みがかったものすべて[d]の方へ向けた。そして、自分のために別の群れを作り、それらをラバンの群れに混ぜなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊」とも訳せる。原語は特に若い羊を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「ラバンの群れから」。原語の前置詞は通常「中に」を意味するが、ここでは起源を示すと解することもできる。
    reason: source_ambiguity
  - marker: c
    text: 「筋模様のもの」とも訳せる。原語は帯状または縞状の模様がある家畜を指す。
    reason: lexical_alternative
  - marker: d
    text: 「褐色のものすべて」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּשָׂבִים
  choice: 子羊
  rationale: 若い羊を指す語の具体性を保った。「羊」も可能だが、より広い語義になる。
- source_word: הִפְרִיד
  choice: より分け
  rationale: 使役形の「分離する、別にする」を、家畜の選別という文脈に自然な日本語で表した。
- source_word: פְּנֵי הַצֹּאן
  choice: 群れの顔
  rationale: 直訳的な身体像を残し、後続の「ほうへ向けた」によって、群れを一定方向へ向かせた意味を明確にした。
- source_word: עָקֹד
  choice: 縞模様のもの
  rationale: 帯状または縞状の模様がある家畜を表す。伝統的だが不自然になりやすい表現を避けた。
- source_word: כָל חוּם
  choice: 黒みがかったものすべて
  rationale: חוּםは暗色ないし褐色を表すため、色を茶色に限定しすぎない訳とした。
- source_word: בְּצֹאן לָבָן
  choice: ラバンの群れの中にいる
  rationale: 前置詞בの通常の場所的用法を採った。ただし文脈上「ラバンの群れから生まれた」と取る余地を脚注で示した。
- source_word: וַיָּשֶׁת לוֹ עֲדָרִים לְבַדּוֹ
  choice: 自分のために群れを別に設け
  rationale: שׁיתの「置く、設ける」とלְבַדּוֹの分離の意味を、自然な日本語で併せて表した。
- source_word: וְלֹא שָׁתָם עַל צֹאן לָבָן
  choice: それらをラバンの群れと一緒にはしなかった
  rationale: 代名詞を直前の別にした群れに結びつけ、עַלをここでは近接・連合の意味に取った。
theological_decisions: []
