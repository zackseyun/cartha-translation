lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: 物語の次の出来事を示すワイイクトル形。日本語では文脈上「産んだ」が自然で、目的語「男の子」ともよく結び付く。
- source_word: זִלְפָּה
  choice: ジルパ
  rationale: 人名を現代日本語で一般的な形に音写した。
- source_word: שִׁפְחַת
  choice: 女奴隷
  rationale: שִׁפְחָהは従属的身分にある女性の家内奴隷・召使いを指す。「女奴隷」は性別と法的・社会的従属性を明確に保つ。文脈によっては「女召使い」とも訳せるため脚注を付した。
- source_word: לֵאָה
  choice: レアの
  rationale: 連語形による所属関係を、自然な日本語の所有表現で示した。
- source_word: לְיַעֲקֹב
  choice: ヤコブに
  rationale: לְはここで父または受益者との関係を示す。原文の形を保ちつつ日本語として自然な「ヤコブに」とした。
- source_word: בֵּן
  choice: 男の子
  rationale: 単数のבֵּןを、出産の記事として自然で分かりやすい現代日本語にした。
