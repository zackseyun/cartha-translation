base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/023.yaml
  text: She conceived and bore a son[a], and said, “God has taken away my reproach.”
translation:
  language: ja
  text: 彼女は身ごもって男の子を産み、こう言った。「神は私の恥を取り去った[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私の辱めを取り除いた」または「私の不名誉を取り去った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: 彼女は身ごもって
  rationale: הרהは妊娠することを表す。「身ごもる」は現代日本語として自然であり、続く出産との物語上の順序も明確に保つ。
- source_word: וַתֵּלֶד בֵּן
  choice: 男の子を産み
  rationale: ילדとבֵּןの組み合わせを、明瞭で自然な現代日本語にした。
- source_word: וַתֹּאמֶר
  choice: こう言った
  rationale: ヘブライ語の物語を進める形を自然な日本語で表し、後続の直接話法を明瞭に導く。
- source_word: אָסַף
  choice: 取り去ってくださった
  rationale: ここでは「集める」ではなく、恥辱を除くという文脈上の意味。完了した行為とその現在的な結果を表し、神に対する発言として自然な敬意を添えた。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 動詞が単数形であり、文脈でも単数の神を指す。
- source_word: חֶרְפָּתִי
  choice: 私の恥
  rationale: חֶרְפָּהは非難、恥辱、不名誉を意味する。「恥」は現代の一般読者に分かりやすく、子がいないことに伴う社会的な屈辱も含み得る。別の訳語は脚注に示す。
theological_decisions:
- issue: אֱלֹהִיםの数の解釈
  choice: 神
  alternative: 神々
  rationale: אָסַףが単数形であるため、文法と文脈は単数の指示対象を要求する。
- issue: 神の行為に対する日本語の敬語表現
  choice: 取り去ってくださった
  alternative: 取り去った
  rationale: 話者が神の恩恵として出来事を告白していることを、日本語として自然な受益表現で示す。原文にない教義的内容は加えていない。
translation_notes:
  register: 明瞭で自然な現代標準語を用いながら、聖書物語にふさわしい簡潔で品位ある調子を保った。「恥」は理解しやすさを優先し、原語が持つ公的な非難・不名誉の含みは脚注で補った。
