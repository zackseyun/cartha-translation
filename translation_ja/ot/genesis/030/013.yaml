  yaml_path: translation/ot/genesis/030/013.yaml
  text: Then Leah said[b][a], “Happy am I! For women will call me happy.” So she called his name Asher.
translation:
  language: ja
  text: そこでレアは言った。「私はなんと幸せなのでしょう。女たちは私を幸せな者と呼ぶでしょうから。」そして、その子をアシェル[a]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アシェル」という名は、レアが用いた「幸せ」および「幸せな者と呼ぶ」に当たるヘブライ語と響き合っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאָשְׁרִי
  choice: なんと幸せなことでしょう
  rationale: 名詞「幸せ、幸い」に一人称接尾辞が付いた感嘆的表現。レアの喜びを自然な現代日本語で示し、後続の動詞および名アシェルとの語呂合わせを「幸せ」で保った。
- source_word: אִשְּׁרוּנִי
  choice: 私を幸せな者と呼ぶでしょう
  rationale: ピエル形の「幸いな者と認める、幸いと呼ぶ」という意味を表す。冒頭の「幸せ」と語根上のつながりが見える訳とした。
- source_word: בָּנוֹת
  choice: 女たち
  rationale: 字義は「娘たち」だが、ここでは女性一般を指す慣用的用法と判断した。「娘たち」ではレア自身の娘たちと誤解されやすいため、自然で文脈に合う「女たち」とした。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ אָשֵׁר
  choice: その子をアシェルと名づけた
  rationale: ヘブライ語の命名定型句を、意味を損なわない自然な現代日本語で表した。
- source_word: אָשֵׁר
  choice: アシェル
  rationale: 人名は音写し、その名と「幸せ」「幸せな者と呼ぶ」との語呂合わせは脚注で示した。
