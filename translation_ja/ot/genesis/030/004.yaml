  yaml_path: translation/ot/genesis/030/004.yaml
  text: So she gave him Bilhah her servant as a wife[a], and Jacob went in to her.
translation:
  language: ja
  text: そこで彼女は、自分の女奴隷ビルハをヤコブに妻として与えた[a]。ヤコブはビルハのもとに入った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女性の召し使い」とも訳せる。ヘブライ語は、従属的な身分にある女性の奉仕者、すなわち奴隷を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֶּן
  choice: そこで彼女は…与えた
  rationale: 接続形が物語を先へ進め、直前の発言を受けた行為であることを、自然な現代日本語の「そこで」で表した。女性単数の主語は文脈上のラケルを指すが、本文に固有名はないため「彼女」とした。
- source_word: בִּלְהָה
  choice: ビルハ
  rationale: 人名を日本語で一般的な聖書表記により音写した。
- source_word: שִׁפְחָתָהּ
  choice: 自分の女召し使い
  rationale: 女性で従属的身分にある僕を指す語である。「女召し使い」は性別と奉仕者としての立場を明示しつつ、「奴隷」と断定して古代の身分関係を一面的に狭めることを避ける。
- source_word: לְאִשָּׁה
  choice: 妻として
  rationale: 婚姻的な結びつきに置くことを示す簡潔な表現であり、側妻など本文に明記されない制度上の分類を加えない。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: ビルハのところに入った
  rationale: 性交を指すヘブライ語の婉曲表現を保った。「彼女」ではラケルと紛れる可能性があるため、指示対象を明確にして「ビルハ」とした。
- source_word: יַעֲקֹב
  choice: ヤコブ
  rationale: 人名を日本語で一般的な聖書表記により音写した。
theological_decisions:
- issue: לְאִשָּׁה が示す関係の呼称
  choice: 妻として
  alternative: 側女として／そばめとして
  rationale: 原文は通常の「女、妻」を表す אִשָּׁה を用いており、この節自体はビルハを「側女」と明示しない。社会的な従属関係との緊張を解消せず、原文どおり「妻」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。性交を表す原文の婉曲語法は「ところに入った」として保持し、露骨な説明には置き換えなかった。脚注記号[a]は対応する「女召し使い」の後を意識できる文末に置いた。
