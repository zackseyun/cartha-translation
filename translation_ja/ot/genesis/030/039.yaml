base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/039.yaml
  text: So the flock mated by the rods[a], and the flock bore striped, speckled[b], and spotted young.
translation:
  language: ja
  text: そこで、群れは枝の前で発情して交尾し、縞模様[a]、斑点模様[b]、まだら模様の子を産んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「縞模様」は「帯模様」とも訳せる。伝統的には「輪のような縞模様」と訳されることもある。
    reason: lexical_alternative
  - marker: b
    text: 「斑点模様」と「まだら模様」の区別はおおよそのものである。後者は「ぶち模様」「斑模様」などとも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱמוּ
  choice: 発情して交尾し
  rationale: יחם は家畜について、発情することを基本的に表す。この文脈では繁殖行動も含意されるため、「発情して交尾し」として意味を明確にした。受胎そのものに限定はしない。
- source_word: הַצֹּאן
  choice: 群れ
  rationale: צאן は羊や山羊などの小型家畜を集合的に指す。「群れ」は文脈上自然で、集合名詞としての性格を保つ。日本語では後半の反復を省いても主語が明瞭なため、不自然な重複は避けた。
- source_word: אֶל הַמַּקְלוֹת
  choice: 枝の前で
  rationale: מַקְלוֹת は直前の文脈で皮をはいだ枝を指す。前置詞 אֶל は本来「〜へ、〜に向かって」だが、繁殖時に枝が視界に入る配置を表す文脈から、過度に因果関係を断定せず「枝の前で」とした。
- source_word: וַתֵּלַדְןָ
  choice: 子を産んだ
  rationale: ילד は「産む」。原文に明示されない目的語「子」を日本語の自然さと明瞭さのため補った。
- source_word: עֲקֻדִּים
  choice: しま模様
  rationale: 帯状または縞状の模様を指す語。「しま模様」は現代日本語で分かりやすい。語義の幅は脚注に示した。
- source_word: נְקֻדִּים
  choice: 斑点模様
  rationale: 点状の細かな模様を表すため「斑点模様」とした。後続する טְלֻאִים との区別は厳密ではないため脚注を付した。
- source_word: וּטְלֻאִים
  choice: まだら模様
  rationale: 継ぎ当てのような大きめの斑や不規則な模様を表し得るため「まだら模様」とした。ただし נְקֻדִּים との意味領域には重なりがある。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、叙述の品位を保った。「発情して交尾し」は動物繁殖の文脈を正確に伝える表現であり、原語を単に「身ごもった」として結果に限定することを避けた。脚注記号 [a]、[b] は該当語の直後に配置した。
