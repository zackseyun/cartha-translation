  text: וְ/הָיָ֗ה בְּ/כָל יַחֵם֮ הַ/צֹּ֣אן הַ/מְקֻשָּׁרוֹת֒ וְ/שָׂ֨ם יַעֲקֹ֧ב אֶת הַ/מַּקְל֛וֹת לְ/עֵינֵ֥י הַ/צֹּ֖אן בָּ/רֳהָטִ֑ים לְ/יַחְמֵ֖/נָּה בַּ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/041.yaml
  text: And whenever the stronger of the flock were breeding[a], Jacob would place the rods before the eyes of the flock in the watering troughs[b], so that they might breed among the rods.
translation:
  language: ja
  text: 群れの丈夫なものが発情するたびに[a]、ヤコブは、群れの目の前の水飲み場の水槽に[b]その枝を置き、枝のそばで交尾するようにした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「丈夫なもの」は、「たくましいもの」「勢いのあるもの」とも訳せる。ヘブライ語は、次の節の弱い個体とは対照的な、丈夫な家畜を指す。
    reason: lexical_alternative
  - marker: b
    text: 「水路に」または「樋に」とも訳せる。ヘブライ語は、家畜が水を飲みに来る場所の槽や水路を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּכָל יַחֵם
  choice: 発情するたびに
  rationale: 反復される状況を表す構文と、家畜が発情するという יחם の意味を、自然な現代日本語で表した。
- source_word: הַצֹּאן
  choice: 群れ
  rationale: 羊と山羊を含み得る小家畜の集合を指すため、動物種を限定しない「群れ」とした。
- source_word: הַמְקֻשָּׁרוֹת
  choice: 丈夫なもの
  rationale: 次節の弱い個体との対比を保ち、体が強くたくましい個体を指す語として分かりやすく訳した。
- source_word: וְשָׂם
  choice: 置き
  rationale: 反復的な文脈の中で、ヤコブがその都度行った動作として表した。
- source_word: הַמַּקְלוֹת
  choice: その枝
  rationale: 直前の文脈で樹木から取って皮をはいだ枝を指すため、「棒」よりも連続性の明瞭な「枝」とした。
- source_word: לְעֵינֵי הַצֹּאן
  choice: 群れの目の前
  rationale: 視覚的な強調を保ちつつ、ヘブライ語の慣用表現に近い自然な日本語とした。
- source_word: בָּרֳהָטִים
  choice: 飲み水の水槽に
  rationale: 家畜が水を飲むための槽または水路を指す語であることを、文脈上明確にした。
- source_word: לְיַחְמֶנָּה
  choice: 交尾させた
  rationale: 目的を表す不定詞的構文を日本語として簡潔に表した。使役性はヤコブの意図を示すが、枝自体が原因だとは断定しない。
- source_word: בַּמַּקְלוֹת
  choice: 枝の間で
  rationale: 前置詞 ב の場所・状況を示す用法を反映し、枝が置かれたところで交尾するという描写を保った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。反復的な時間表現は「たびに」で示し、動物の繁殖については「発情」「交尾」という一般的で正確な語を用いた。
