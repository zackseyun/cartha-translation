- from: 群れの丈夫なものが発情するたびに[a]、ヤコブは群れの目の前、飲み水の水槽に[b]その枝を置き、枝の間で交尾させた。
  to: 群れの丈夫なものが発情するたびに[a]、ヤコブは、群れの目の前の水飲み場の水槽に[b]その枝を置き、枝のそばで交尾するようにした。
  rationale: 目的を示すヘブライ語構文を「交尾するようにした」として保ち、ヤコブが交尾を直接行わせたとの過度な含意を避けた。「枝のそばで」は、棒が置かれた場所・状況を表す前置詞句を自然に反映する。水槽の場所句も現代日本語として滑らかに整えた。
