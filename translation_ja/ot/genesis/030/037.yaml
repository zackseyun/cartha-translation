  text: וַ/יִּֽקַּֽח ל֣/וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח וְ/ל֣וּז וְ/עֶרְמ֑וֹן וַ/יְפַצֵּ֤ל בָּ/הֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַ/לָּבָ֔ן אֲשֶׁ֖ר עַל הַ/מַּקְלֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/037.yaml
  text: Then Jacob took for himself fresh rods of poplar[a], almond, and plane tree, and peeled white stripes in them[c][b], exposing the white that was on the rods.
translation:
  language: ja
  text: そこでヤコブは自分のために、切りたてのポプラ[a]、アーモンド[b]、プラタナス[c]の枝を取り、それらの皮を白い筋状にむき、枝の白い部分を露出させた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ポプラ」に当たるヘブライ語がどの樹木を指すかは確定しておらず、「エゴノキ」とする見方もあります。
    reason: lexical_alternative
  - marker: b
    text: 古い訳には「ハシバミ」とするものもありますが、アーモンドとする見方がより有力です。
    reason: lexical_alternative
  - marker: c
    text: 古い訳には「栗」とするものもありますが、プラタナスとする見方がより有力です。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקַּל
  choice: 枝
  rationale: ここでは、ヤコブが家畜の繁殖に用いるため木から切り取った細長い木片を指す。「杖」よりも、切った木そのものを自然に表す「枝」が文脈に合う。
- source_word: לִבְנֶה לַח
  choice: 切ったばかりのポプラ
  rationale: לַח は水分を含む新鮮な状態を表すため、日本語では「切ったばかりの」として具体化した。לִבְנֶה の樹種は不確かだが、一般的な同定に従って「ポプラ」とした。
- source_word: לוּז
  choice: アーモンド
  rationale: 古い訳に見られる「ハシバミ」より、ヘブライ語の語彙上はアーモンドの木とする可能性が高い。
- source_word: עֶרְמוֹן
  choice: プラタナス
  rationale: 古い訳の「栗」よりも、スズカケノキ類（plane tree）を指す可能性が高い。現代日本語で通用する樹名「プラタナス」を用いた。
- source_word: וַיְפַצֵּל בָּהֵן פְּצָלוֹת לְבָנוֹת
  choice: その皮を筋状にむいて
  rationale: 樹皮を部分的にむくことで白い筋を作る動作を、結果とともに自然な日本語で表した。「白い筋をむく」という不自然な直訳は避けた。
- source_word: מַחְשֹׂף הַלָּבָן אֲשֶׁר עַל הַמַּקְלוֹת
  choice: 枝の白い部分をあらわにした
  rationale: 皮をむいて下の白い木質部を露出させたことを明瞭に表す。「上に」という前置詞の形を機械的に残さず、その指示内容を訳した。
