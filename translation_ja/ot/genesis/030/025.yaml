  text: And it happened, when Rachel had borne Joseph, that Jacob said to Laban, “Send me away, that I may go to my own place and to my own land.”
translation:
  language: ja
  text: ラケルがヨセフを産んだ後、ヤコブはラバンに言った。「私を送り出してください。自分の場所、自分の土地へ行かせてください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 後
  rationale: 出来事の推移と時を示す定型句を、現代日本語で自然かつ明確に表した。
- source_word: שַׁלְּחֵנִי
  choice: 私を送り出してください
  rationale: ピエル命令形の『去らせる・送り出す』という意味を保ち、雇用関係からの解放を求める響きを過度に補わず表した。
- source_word: מְקוֹמִי וּלְאַרְצִי
  choice: 自分の故郷、自分の国
  rationale: מקום は直訳的には『場所』だが、帰還先を指す文脈では『故郷』が自然。ארץ は『国／土地』であり、ここでは『国』とした。接尾辞による『自分の』を双方に明示した。
- source_word: וְאֵלְכָה
  choice: 帰ります
  rationale: 語義自体は『行こう』だが、自分の故郷と国へ向かう文脈上、日本語では『帰る』が自然である。意志を表すコホルタティブを簡潔な意向表明として訳した。
