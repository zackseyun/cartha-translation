id: GEN.30.33
reference: Genesis 30:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עָֽנְתָה בִּ֤/י צִדְקָתִ/י֙ בְּ/י֣וֹם מָחָ֔ר כִּֽי תָב֥וֹא עַל שְׂכָרִ֖/י לְ/פָנֶ֑י/ךָ כֹּ֣ל אֲשֶׁר אֵינֶ/נּוּ֩ נָקֹ֨ד וְ/טָל֜וּא בָּֽ/עִזִּ֗ים וְ/חוּם֙ בַּ/כְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/033.yaml
  text: 'So my honesty will answer for me later[a], when you come to inspect my wages: every goat that is not speckled and spotted, and every lamb that is not dark-colored[e][d][c][b], will be considered stolen if it is found with me.'
translation:
  language: ja
  text: 後になって[b]、あなたが私の報酬を調べに来るとき、私の誠実さ[a]が私のために証言します。山羊のうち、斑点もまだら模様もないもの、また羊のうち、褐色でないもの[c][d]が私のもとにいれば、そのようなものは盗品と見なされます[e]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の正しさ」または「私の義」とも訳せる。ここでは、報酬の取り決めにおけるヤコブの潔白を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「明日の日に」。文字どおりの翌日とも、より広く「後になって」「将来」とも理解できる。
    reason: lexical_alternative
  - marker: c
    text: 「暗い色でないもの」とも訳せる。原語は羊の褐色または暗色系の毛色を指す。
    reason: lexical_alternative
  - marker: d
    text: 「山羊のうち斑点やまだら模様のないもの、羊のうち褐色でないもの」という二つの区分を示している。
    reason: syntax_clarification
  - marker: e
    text: 直訳に近くは「私と一緒にあれば、それは盗まれたものだ」。そのような家畜がヤコブのもとで見つかれば、盗品と認めるという意味。
    reason: implicit_judicial_sense
lexical_decisions:
- source_word: וְעָנְתָה בִּי
  choice: 私のために証しをします
  rationale: 「答える」というヘブライ語の慣用を、この文脈での立証・証言の意味が自然に伝わるように訳した。前置詞 בִּי は、ヤコブの誠実さが彼の潔白を裏づける方向で理解した。
- source_word: צִדְקָתִי
  choice: 私の誠実さ
  rationale: 語の基本的な「正しさ」を踏まえつつ、ここでは報酬の取り決めにおけるヤコブの公正で偽りのない行動を指すため、「誠実さ」とした。
- source_word: בְּיוֹם מָחָר
  choice: 後の日に
  rationale: 字義的には「明日の日に」だが、翌日に限定せず、後にラバンが群れを確認する時を指し得る。日本語でも時間幅を残した。
- source_word: כִּי תָבוֹא עַל שְׂכָרִי לְפָנֶיךָ
  choice: あなたが私の報酬を自分の目で確かめに来るとき
  rationale: 「私の報酬に関して来る」という表現の実際的な意味を「確かめる」で示し、לְפָנֶיךָ の本人の面前での確認という含みを「自分の目で」に反映した。
- source_word: נָקֹד וְטָלוּא
  choice: 斑点もまだら模様も
  rationale: נָקֹד を小さな斑点、טָלוּא をより広い斑・継ぎ模様として区別しつつ、どちらの特徴もない個体を指す文脈を明確にした。
- source_word: חוּם
  choice: 黒みがかって
  rationale: 茶色に限定しすぎず、通常とは異なる暗色・褐色系の毛色を表せる訳語を選んだ。
- source_word: בַּכְּשָׂבִים
  choice: 羊のうち
  rationale: כֶּשֶׂב は若い羊を指すこともあるが、ここでは群れの区分を述べるため、年齢を限定しない「羊」が自然である。
- source_word: גָּנוּב הוּא אִתִּי
  choice: 私のところにいれば、それは盗んだものです
  rationale: ヘブライ語の簡潔な断定を保ち、該当する通常色の家畜がヤコブの所有下に見つかれば盗品と認定される、という意味を表した。
theological_decisions:
- issue: צִדְקָתִי の倫理的・神学的幅
  choice: 本文では「誠実さ」
  alternative: 「正しさ」「義」
  rationale: ここではヤコブの報酬契約における検証可能な潔白が焦点であり、抽象的または教理的な「義」に狭めない。一方、原語の広い意味は脚注に残した。
- issue: 「誠実さが証しをする」という擬人表現
  choice: 原文の擬人表現を保持
  alternative: 「私が誠実だったことが明らかになります」
  rationale: 原文ではヤコブの正しさそのものが彼のために答えるという印象的な表現になっているため、説明文へ平板化せず保持した。
translation_notes:
  register: 現代の一般読者に明快でありながら品位のある常体寄りの文体とした。ヤコブがラバンに直接語る場面なので丁寧形を用いた。「証しをします」で原文の擬人表現を保ち、家畜の模様と色の区分は具体的な日常語で示した。
