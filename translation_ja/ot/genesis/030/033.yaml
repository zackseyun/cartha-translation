  to: 後になって[b]、あなたが私の報酬を調べに来るとき、私の誠実さ[a]が私のために証言します。山羊のうち、斑点もまだら模様もないもの、また羊のうち、褐色でないもの[c][d]が私のもとにいれば、そのようなものは盗品と見なされます[e]。
