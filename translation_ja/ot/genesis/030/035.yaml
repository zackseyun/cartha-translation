id: GEN.30.35
reference: Genesis 30:35
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּ֣סַר בַּ/יּוֹם֩ הַ/ה֨וּא אֶת הַ/תְּיָשִׁ֜ים הָֽ/עֲקֻדִּ֣ים וְ/הַ/טְּלֻאִ֗ים וְ/אֵ֤ת כָּל הָֽ/עִזִּים֙ הַ/נְּקֻדּ֣וֹת וְ/הַ/טְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר לָבָן֙ בּ֔/וֹ וְ/כָל ח֖וּם בַּ/כְּשָׂבִ֑ים וַ/יִּתֵּ֖ן בְּ/יַד בָּנָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/035.yaml
  text: That day he removed the male goats that were streaked and spotted[a], and all the female goats that were speckled and spotted—every one that had white on it—and every dark-colored one among the lambs[c][b], and he put them into the care of his sons.
translation:
  language: ja
  text: その日、彼は、しま模様[a]やまだら模様の雄やぎと、斑点やまだら模様の雌やぎ、すなわち白い部分のあるものをすべて、また子羊のうち暗褐色のもの[b]をすべて取り分け、息子たちに任せた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「帯状の模様」とも訳せる。ヘブライ語は、筋または帯のような模様を指す。
    reason: lexical_alternative
  - marker: b
    text: 「褐色のもの」または「暗い色のもの」とも訳せる。原語は暗い褐色系の毛色を指す。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「息子たちの手に与えた」。これは、その管理に委ねたことを表すヘブライ語の慣用表現。
    reason: idiom
lexical_decisions:
- source_word: וַיָּסַר
  choice: 取り分け
  rationale: 使役形の動詞は、対象の家畜を群れから除いて別にする行為を表す。「取り分け」は分離と確保の双方を自然に伝える。
- source_word: הַתְּיָשִׁים
  choice: 雄やぎ
  rationale: תישは雄のやぎを明示するため、現代日本語で分かりやすく性別を示した。
- source_word: הָעֲקֻדִּים
  choice: しま模様
  rationale: 帯状・筋状の模様を表す語であり、模様の形を過度に限定せず明瞭に表現した。
- source_word: הַטְּלֻאִים / הַטְּלֻאֹת
  choice: まだら模様
  rationale: 色の異なる部分が不規則に混じる、斑状の毛色を表す語として、雄・雌で訳語を統一した。
- source_word: הָעִזִּים
  choice: 雌やぎ
  rationale: 語自体は一般に「やぎ」だが、直前の雄やぎとの対比により、ここでは雌を指すことが文脈上明らかである。
- source_word: הַנְּקֻדּוֹת
  choice: 斑点
  rationale: 小さな点状の模様を表すため、「まだら模様」と区別して訳した。
- source_word: כֹּל אֲשֶׁר לָבָן בּוֹ
  choice: 白い部分のあるものをすべて
  rationale: 毛色の一部に白が含まれる個体を漏れなく指す分配的表現を、自然な日本語で保持した。
- source_word: וְכָל חוּם בַּכְּשָׂבִים
  choice: また子羊のうち暗褐色のものをすべて
  rationale: חוּםは褐色ないし暗い色合いを指す。כְּשָׂבִיםは若い羊を表し得るため「子羊」とした。
- source_word: וַיִּתֵּן בְּיַד בָּנָיו
  choice: 息子たちに任せた
  rationale: 直訳では「息子たちの手に与えた」だが、管理・支配下に置くというヘブライ語の慣用的意味を自然に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「やぎ」は一般読者への読みやすさを優先して平仮名表記とし、複数の毛色用語の違いが見えるよう「しま模様」「まだら模様」「斑点」を使い分けた。
