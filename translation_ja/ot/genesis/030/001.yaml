base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/001.yaml
  text: When Rachel saw that she had borne no children to Jacob[a], she became jealous of her sister, and she said to Jacob, “Give me children[b], or I will die!”
translation:
  language: ja
  text: ラケルは、自分がヤコブに子どもを産んでいないことを知ると、自分の姉妹をねたんだ。そしてヤコブに言った。「私に子どもを与えなさい。さもなければ、私は死んでしまう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא רָחֵל כִּי לֹא יָלְדָה לְיַעֲקֹב
  choice: ラケルは、自分がヤコブに子どもを産んでいないのを見て
  rationale: ראהはここでは状況を認識する意を含むが、「見て」とすることで原文の表現を保つ。ילדは女性を主語として「産む」。明示されない目的語は文脈から「子ども」と補った。לְיַעֲקֹבは自然な日本語で「ヤコブに」とした。
- source_word: וַתְּקַנֵּא רָחֵל בַּאֲחֹתָהּ
  choice: 姉をねたんだ
  rationale: קנאは姉の出産能力をうらやみ、ねたむ感情を表す。「嫉妬した」よりも対象を伴う自然な日本語として「ねたんだ」を選んだ。אחותは年長のレアを指すため「姉」とした。二度目の固有名ラケルは、日本語で不自然な反復を避けつつ主語が明白なので省略した。
- source_word: הָבָה לִּי בָנִים
  choice: 私に子どもを与えてください
  rationale: בניםの字義は「息子たち」だが、ここではラケルが子を産むこと全般を願っているため、集合的・包括的な「子ども」が文脈に適する。הבהの強い要求は保ちつつ、日本語の直接発話として自然な丁寧形にした。
- source_word: וְאִם אַיִן מֵתָה אָנֹכִי
  choice: でなければ、私は死んでしまいます
  rationale: ואם איןは「もしそうでなければ」。מתה אנכיは直訳的には「私は死んでいる／死ぬ」で、切迫した絶望を表す。「死んでしまいます」は結果の深刻さと発話の感情を自然に伝える。
