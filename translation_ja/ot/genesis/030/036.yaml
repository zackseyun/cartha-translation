  text: And he put a distance of three days between himself and Jacob, and Jacob was shepherding the rest of Laban’s flock.
translation:
  language: ja
  text: ラバンは自分とヤコブとの間に三日行程の距離を置いた。ヤコブはラバンの残りの家畜の群れを飼っていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: 三日分の道のりを置いた
  rationale: 直訳的な空間表現を保ちつつ、両者の間を徒歩で三日かかる距離だけ隔てたという意味が現代日本語で明瞭になるようにした。
- source_word: בֵּינוֹ וּבֵין יַעֲקֹב
  choice: 自分とヤコブとの間に
  rationale: 三人称単数の指示対象は直前の文脈上ラバンであるため、文頭で「ラバン」と明示し、続く再帰表現を自然に訳した。
- source_word: רֹעֶה
  choice: 飼っていた
  rationale: 分詞が表す継続中の牧畜行為を自然な日本語の進行・継続表現で示した。
- source_word: צֹאן לָבָן הַנּוֹתָרֹת
  choice: 残ったラバンの羊の群れ
  rationale: צֹאןは羊や山羊を含み得る家畜の群れだが、日本語では文脈に即して簡潔に「羊の群れ」とした。「残った」は分離後にラバンのもとに残された群れを指す。
