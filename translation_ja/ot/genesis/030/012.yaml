base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/012.yaml
  text: And Zilpah[a], Leah's female servant, bore Jacob a second son.
translation:
  language: ja
  text: レアの女奴隷[a]ジルパは、ヤコブに二人目の息子を産んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女召使い」とも訳せる。ヘブライ語は、レアに属する隷属的身分の女性を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: ילדのワイイクトール形で、物語の次の出来事を示す。日本語の出生記事として自然で簡潔な「産んだ」とした。
- source_word: זִלְפָּה
  choice: ジルパ
  rationale: 人名を現代日本語で一般的な聖書名表記に従って音写した。
- source_word: שִׁפְחַת לֵאָה
  choice: レアの女奴隷
  rationale: שִׁפְחָהは女性であることと隷属的な社会的身分を表す。「女召使い」より身分の厳しさを明確に保つため「女奴隷」とした。
- source_word: בֵּן שֵׁנִי
  choice: 二人目の息子
  rationale: 直訳的には「第二の息子」。この文脈では、ジルパがヤコブに産んだ二人目の息子を意味するため、自然な日本語とした。
- source_word: לְיַעֲקֹב
  choice: ヤコブに
  rationale: לְは出生定型句において父または受益者との関係を示す。日本語では「ヤコブに息子を産んだ」として、その関係を保った。
