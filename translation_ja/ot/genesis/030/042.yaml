  text: וּ/בְ/הַעֲטִ֥יף הַ/צֹּ֖אן לֹ֣א יָשִׂ֑ים וְ/הָיָ֤ה הָ/עֲטֻפִים֙ לְ/לָבָ֔ן וְ/הַ/קְּשֻׁרִ֖ים לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/042.yaml
  text: But when the flock were feeble[a], he would not put them in; so the feeble ones became Laban’s[c][b], and the strong ones Jacob’s.
translation:
  language: ja
  text: しかし、群れの家畜が弱っているときには、彼は枝を置かなかった[a]。こうして、弱いものはラバンのものに、強いものはヤコブのものになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: すなわち、前の節で述べられたように、交尾の際に家畜の前へ枝を置かなかった。
    reason: cross_reference
lexical_decisions:
- source_word: וּבְהַעֲטִיף הַצֹּאן
  choice: 群れの弱いものが交尾するときには
  rationale: ב＋不定詞は時を表す。עטף はここでは後半の「強いもの」と対照をなす弱い家畜を指すが、繁殖の文脈に含まれる交尾の意味を自然な日本語で補った。
- source_word: הַצֹּאן
  choice: 群れ
  rationale: צֹאן は羊や山羊などの小型家畜を集合的に指す。文脈上、簡潔で自然な「群れ」とした。
- source_word: לֹא יָשִׂים
  choice: 枝を置かなかった
  rationale: שׂים は「置く」。目的語は原文では省略されているが、直前の節にある枝を指すことが明白なので、日本語では補って意味を明瞭にした。
- source_word: הָעֲטֻפִים
  choice: 弱いもの
  rationale: עטף に由来し、対照される丈夫な家畜に対して弱い家畜を表す。生理的な詳細を限定しすぎない訳語を選んだ。
- source_word: לְלָבָן
  choice: ラバンのものに
  rationale: 前置詞 ל はここで所属・割り当てを示す。日本語として自然な所有表現にした。
- source_word: הַקְּשֻׁרִים
  choice: 強いもの
  rationale: 語形と語義には難しさがあるが、この文脈では הָעֲטֻפִים と対照される丈夫で活力のある家畜を指す。「強いもの」はその対照を明瞭に保つ。
- source_word: לְיַעֲקֹב
  choice: ヤコブのものに
  rationale: ל は所属・割り当てを示し、ラバンとの対句を保つよう訳した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある叙述体。「弱いもの／強いもの」の対照を維持し、家畜の繁殖時期や等級について原語以上に限定しない。
