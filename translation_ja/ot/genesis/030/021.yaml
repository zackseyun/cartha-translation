base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/021.yaml
  text: Afterward she bore a daughter and called her name Dinah.
translation:
  language: ja
  text: その後、彼女は娘を産み、その名をディナと呼んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: その後
  rationale: 先行する出産に続く時間的順序を示す。現代日本語として自然で、物語の進行を簡潔に保つ。
- source_word: יָלְדָה
  choice: 産み
  rationale: 動詞 ילד のカル完了形（三人称女性単数）。目的語「娘」と結び、簡潔で自然な日本語とした。
- source_word: בַּת
  choice: 娘
  rationale: 出産された女児を指す単数名詞。日本語では不定冠詞に相当する語を補わず「娘を産み」とするのが自然である。
- source_word: וַתִּקְרָא
  choice: 呼んだ
  rationale: 物語を継続するワイイクトル形。後続する「その名を」と合わせ、原文の「名を呼ぶ」という表現を保った。
- source_word: אֶת שְׁמָהּ
  choice: その名を
  rationale: 直訳的には「彼女の名を」。日本語では対象となる娘を受けて「その名を」とすることで、原文の構造を保ちつつ自然にした。
- source_word: דִּינָה
  choice: ディナ
  rationale: 固有名詞を、現代日本語の聖書名として明瞭な形に音写した。
