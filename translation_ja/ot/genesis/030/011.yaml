  language: ja
  text: レアは言った[a]。「幸運だ！」そこで、その子をガドと名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「幸運だ！」に当たるヘブライ語 בגד の解釈は難しい。「幸運が来た」とも理解でき、伝統的には「一団が来た」と訳されることもある。「ガド」という名は、ここで用いられた「幸運」を表す語と響きが似ている。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: は言った
  rationale: 物語を進める接続形として、自然な現代日本語の叙述にした。
- source_word: לֵאָה
  choice: レア
  rationale: 日本語聖書で広く用いられる人名表記を採用した。
- source_word: בגד
  choice: 幸運だ！
  rationale: 本文の難解な語形を、גד（幸運）に関係する喜びの叫びと理解し、ガドという名との語呂合わせが伝わる簡潔な表現にした。別解は脚注に残した。
- source_word: וַתִּקְרָא אֶת שְׁמוֹ
  choice: そこで、その子を…と名づけた
  rationale: ヘブライ語の命名定型句を自然な日本語にし、先の叫びを受けた結果の流れを「そこで」で示した。
- source_word: גָּד
  choice: ガド
  rationale: 慣用的な固有名詞表記を用い、「幸運」に当たる語との音の結びつきを保った。
