  text: レアは再び身ごもり、ヤコブに六人目の息子を産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: 身ごもり
  rationale: ヘブライ語 הרה の「妊娠する、身ごもる」という意味を、出産記事にふさわしい自然で品位ある現代日本語で表した。
- source_word: עוֹד
  choice: 再び
  rationale: ここでは出来事の反復を示し、レアがもう一度身ごもったことを表す。
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: ילד の「出産する」という意味を簡潔で自然な日本語にした。
- source_word: בֵּן
  choice: 息子
  rationale: 語の通常の意味をそのまま明確に表した。
- source_word: שִׁשִּׁי
  choice: 六人目の
  rationale: 序数として、この息子がレアにとって六番目であることを自然に示す。文脈上の数え方を過度に説明せず、原文の簡潔さを保った。
- source_word: לְיַעֲקֹב
  choice: ヤコブに
  rationale: 前置詞 לְ が示す関係を保ち、「ヤコブのために」と目的を強く読み込まず、出産定型句として自然に訳した。
