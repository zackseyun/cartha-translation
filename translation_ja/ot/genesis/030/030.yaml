source:
  edition: WLC
  text: כִּ֡י מְעַט֩ אֲשֶׁר הָיָ֨ה לְ/ךָ֤ לְ/פָנַ/י֙ וַ/יִּפְרֹ֣ץ לָ/רֹ֔ב וַ/יְבָ֧רֶךְ יְהוָ֛ה אֹתְ/ךָ֖ לְ/רַגְלִ֑/י וְ/עַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם אָנֹכִ֖י לְ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/030.yaml
  text: For the little that you had before me has increased into abundance[a], and Yahweh has blessed you at my coming. And now[b], when shall I also provide for my own household?
translation:
  language: ja
  text: 私が来る前には、あなたの持ち物はわずかでしたが、それが非常に増えました。ヤハウェは、私が来てから[a]、あなたを祝福されました。では今、いつになったら、私も自分の家族のために働けるのでしょうか。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私の足に」。ここでは「私が来てから」、または「私のゆえに」という意味の慣用表現と考えられます。
    reason: lexical_alternative
  - marker: b
    text: 別訳「私も自分の家のために何かをすることができるのでしょうか」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט אֲשֶר הָיָה לְךָ לְפָנַי
  choice: 私が来る前には、あなたの持ち物はわずかでした
  rationale: לְפָנַי は字義的には「私の前に」だが、文脈ではヤコブが来る以前を指す。「持ち物」を補い、מְעַט がラバンの財産の少なさを表すことを自然な日本語で示した。
- source_word: וַיִּפְרֹץ לָרֹב
  choice: それが非常に増えました
  rationale: פרץ の勢いよく広がる含意と、לָרֹב の著しい増加を、明瞭で自然な表現にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を一般名詞の「主」に置き換えず、音写した。
- source_word: לְרַגְלִי
  choice: 私が来てから
  rationale: 字義は「私の足に」だが、ここではヤコブの到来に伴って、またはヤコブゆえに祝福が及んだことを表す慣用句。本文では文脈に即した時間的表現を採り、因果的含意は脚注で保持した。
- source_word: מָתַי אֶעֱשֶׂה גַם אָנֹכִי לְבֵיתִי
  choice: いつになったら、私も自分の家族のために働けるのでしょうか
  rationale: עשה לְבֵיתִי は自分の家のために何かをする、すなわちその暮らしを支えるために働く意。原文の問いかけと「私も」という対比を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 固有名としての性格を明示し、原文との対応を保つため。
- issue: לְרַגְלִי における祝福とヤコブの関係
  choice: 本文は「私が来てから」とし、脚注で「私のゆえに」の可能性を示す
  alternative: 私のゆえに／私の足もとに
  rationale: この慣用句には到来に伴う時間的意味と、ヤコブを理由とする因果的意味の両方があり得るため、一方だけを断定せず保持した。
translation_notes:
  register: 現代の一般読者に明瞭な、丁寧で品位ある標準語。「家」は文脈上の扶養対象を明確にするため「家族」とし、原文の含みは脚注に残した。
