  text: וַ/תַּ֣הַר ע֔וֹד וַ/תֵּ֕לֶד בִּלְהָ֖ה שִׁפְחַ֣ת רָחֵ֑ל בֵּ֥ן שֵׁנִ֖י לְ/יַעֲקֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/007.yaml
  text: Bilhah[a], Rachel’s female servant, conceived again and bore Jacob a second son.
translation:
  language: ja
  text: ラケルの女奴隷[a]ビルハは再び身ごもり、ヤコブに二人目の息子を産んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「女召使い」。ヘブライ語は、隷属的または低い社会的身分にあった女性を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: 身ごもり
  rationale: 妊娠することを表す動詞。現代日本語の物語文として自然で、続く出産との流れも明確になる。
- source_word: עוֹד
  choice: 再び
  rationale: この出産物語では、妊娠が繰り返されたことを示す。
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: qal形の ילד は目的語を伴って「産む」を意味する。簡潔で自然な現代日本語とした。
- source_word: שִׁפְחַת
  choice: 女奴隷
  rationale: שִׁפְחָה は女性の奴隷または身分の低い女性使用人を指す。隷属的身分を明示しつつ、別訳を脚注に示した。
- source_word: בֵּן שֵׁנִי
  choice: 二人目の息子
  rationale: 直訳的には「第二の息子」。ここではビルハがヤコブに産んだ二人目の息子を自然に表す。
- source_word: לְיַעֲקֹב
  choice: ヤコブに
  rationale: 前置詞 לְ が、この文脈で子をヤコブのために、またはヤコブの子として産んだという関係を示すため、原文の表現を保って「ヤコブに」とした。
- source_word: בִּלְהָה שִׁפְחַת רָחֵל
  choice: ラケルの女奴隷ビルハ
  rationale: 原文ではビルハの名に「ラケルの女奴隷」という同格的説明が続く。日本語では修飾語を名の前に置くことで明快にした。
theological_decisions: []
