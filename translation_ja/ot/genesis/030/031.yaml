- from: するとラバンは言った。「何をおまえに与えようか。」ヤコブは言った。「何も私に下さらなくてよいのです。もし私のためにこのことをしてくださるなら、私は再び[a]あなたの家畜の群れを飼い、守ります。」
  to: ラバンは言った。「何をあなたに与えようか。」ヤコブは言った。「何も私に与えなくてよい。もし私のためにこのことをしてくれるなら、私は再び[a]あなたの羊や山羊の群れの世話をし、守ろう。」
  rationale: 「すると」を中立的な叙述に改めた。צֹאן の指す小家畜を「羊や山羊の群れ」と明確にし、רעה を「世話をする」、שמר を「守る」として機能の違いを保った。会話を常体に統一し、原文の直接性を保ちながら自然な現代標準語に整えた。脚注はאָשׁוּבָה の解釈上の曖昧さを維持している。
