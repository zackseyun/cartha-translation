  yaml_path: translation/ot/genesis/030/031.yaml
  text: And he said[a], “What shall I give you?” And Jacob said, “You shall not give me anything. If you will do this thing for me, I will again pasture your flock and keep it.”
translation:
  language: ja
  text: ラバンは言った。「何をあなたに与えようか。」ヤコブは言った。「何も私に与えなくてよい。もし私のためにこのことをしてくれるなら、私は再び[a]あなたの羊や山羊の群れの世話をし、守ろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は戻って、あなたの羊や山羊の群れの世話をし、守ろう」。ヘブライ語の動詞は、戻ることとも、仕事を再開することとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה אֶתֶּן לָךְ
  choice: 何をおまえに与えようか
  rationale: 疑問詞と一人称の נתן による、報酬として何を与えるべきかという問いを、自然な申し出の表現にした。話者は文脈上ラバンであるため名を補った。
- source_word: לֹא תִתֶּן לִי מְאוּמָה
  choice: 何も私に下さらなくてよいのです
  rationale: 否定文中の מְאוּמָה を「何も」とし、未完了形を未来の予告ではなく、報酬を辞退する丁寧で明確な返答として表した。
- source_word: אִם תַּעֲשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: もし私のためにこのことをしてくださるなら
  rationale: 条件節と指示表現「このこと」を保ちつつ、ヤコブがラバンに提示する取り決めとして自然な日本語にした。
- source_word: אָשׁוּבָה
  choice: 私は再び
  rationale: שׁוב はここで、場所へ戻ることとも仕事を再開することとも解し得る。本文では後続動詞にかかる「再び」とし、別解を脚注に示した。
- source_word: אֶרְעֶה
  choice: 飼い
  rationale: רעה が家畜の群れを養い世話する牧畜行為を表すため、簡潔で具体的な「飼う」を選んだ。
- source_word: צֹאנְךָ
  choice: あなたの家畜の群れ
  rationale: צֹאן は羊だけでなく山羊を含み得る小家畜の集合語なので、「羊の群れ」に限定せず「家畜の群れ」とした。
- source_word: אֶשְׁמֹר
  choice: 守ります
  rationale: שׁמר は群れを監視し保護することを表し、先行する「飼い」と区別して「守る」と訳した。
