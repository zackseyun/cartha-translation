  yaml_path: translation/ot/genesis/030/029.yaml
  text: He said to him[a], “You know how I have served you, and how your livestock has been with me.”
translation:
  language: ja
  text: ヤコブはラバンに言った。「私がどのようにあなたに仕えてきたか、また、あなたの家畜が私のもとでどのような状態だったかは、あなたが知っています。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 彼は彼に言った
  rationale: 物語の連続を示す語形を、文脈上の主語と相手を補わずに原文どおり代名詞で表した。
- source_word: אַתָּה יָדַעְתָּ
  choice: あなたが知っています
  rationale: 独立代名詞による軽い強調を主語「あなたが」で保ち、状態を表す完了形は自然な現在形とした。
- source_word: אֵת אֲשֶׁר עֲבַדְתִּיךָ
  choice: 私がどのようにあなたに仕えてきたか
  rationale: עבדの奉仕と労働の両方の含みを「仕える」で保ち、継続してきた働きを「仕えてきた」と表した。
- source_word: וְאֵת אֲשֶׁר הָיָה מִקְנְךָ אִתִּי
  choice: また、あなたの家畜が私のもとでどうなったか
  rationale: 直訳的な「私と共にどうであったか」が、この文脈ではヤコブの管理下での家畜の状態や成り行きを指すため、繁栄と断定せず「私のもとでどうなったか」とした。
- source_word: מִקְנְךָ
  choice: あなたの家畜
  rationale: 群れとして飼育される動物を広く指す集合名詞なので、現代日本語の「家畜」が適切。
