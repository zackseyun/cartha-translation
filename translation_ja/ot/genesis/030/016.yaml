base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/016.yaml
  text: When Jacob came in from the field in the evening[a], Leah went out to meet him and said, “You must come in to me, for I have hired you with my son’s mandrakes.” So he lay with her that night.
translation:
  language: ja
  text: 夕方、ヤコブが野から帰って来ると、レアは彼を迎えに出て言った。「あなたは私のところに来なければなりません。息子の恋なすで、私はあなたを雇ったのです[a]。」こうしてヤコブはその夜、彼女と床を共にした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「息子の恋なすを代価に、私はあなたを雇ったのです」とも訳せる。ヘブライ語は、恋なすがこの取り決めの手段または代価であったことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... מִן הַשָּׂדֶה
  choice: 野から帰って来ると
  rationale: בואの移動を保ちつつ、畑仕事の場から家族のいる場所へ戻る文脈を自然な日本語で示した。
- source_word: בָּעֶרֶב
  choice: 夕方
  rationale: 時間を表す句を簡潔で自然な現代日本語にした。
- source_word: וַתֵּצֵא ... לִקְרָאתוֹ
  choice: 彼を迎えに出て
  rationale: יצאとלקראתの組み合わせを、日本語の慣用的な移動表現で訳した。
- source_word: אֵלַי תָּבוֹא
  choice: あなたは私のところに来なければなりません
  rationale: 文脈上の性的な含みを露骨にせず、レアの強い要求を表した。
- source_word: שָׂכֹר שְׂכַרְתִּיךָ
  choice: 私はあなたを雇ったのです
  rationale: 同根語を重ねた強調は「のです」による断定で自然に表し、「確かに」を加えて過度に強調することは避けた。
- source_word: בְּדוּדָאֵי בְּנִי
  choice: 息子の恋なすで
  rationale: בが表し得る手段・代価の幅を残し、直前の取引の文脈にもつながる表現とした。
- source_word: וַיִּשְׁכַּב עִמָּהּ
  choice: 彼女と床を共にした
  rationale: 性交を指す聖書的な婉曲表現を、現代日本語でも品位を保つ慣用句で訳した。
- source_word: בַּלַּיְלָה הוּא
  choice: その夜
  rationale: 指示語הוּאを含む時間表現を簡潔な日本語にした。
