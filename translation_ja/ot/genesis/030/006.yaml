  text: וַ/תֹּ֤אמֶר רָחֵל֙ דָּנַ֣/נִּי אֱלֹהִ֔ים וְ/גַם֙ שָׁמַ֣ע בְּ/קֹלִ֔/י וַ/יִּתֶּן לִ֖/י בֵּ֑ן עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ דָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/006.yaml
  text: Then Rachel said[a], “God has judged me, and has also heard my voice and given me a son.” Therefore she called his name Dan.
translation:
  language: ja
  text: ラケルは言った。「神は私の訴えを裁き、私の声も聞き、私に男の子を授けてくださった。」だから彼女はその子をダン[a]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ダン」という名は、ヘブライ語で「裁く」または「裁いた」を意味する動詞と語呂合わせになっている。
    reason: lexical_alternative
lexical_decisions:
- source_word: דָּנַנִּי
  choice: 私の訴えを裁き
  rationale: 動詞דיןの法廷的な含意を保ちつつ、この文脈で神がラケルの訴えを取り上げたことを自然な日本語で表す。「私を裁いた」では処罰の意味に誤解されやすく、「私の正しさを認めた」ほど強く意味を限定しない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、単数動詞を伴い、物語中のイスラエルの神を指すため、単数の「神」とする。
- source_word: שָׁמַע בְּקֹלִי
  choice: 私の声をも聞いて
  rationale: 「私の声」という原文の表現を保持し、ラケルの個人的な訴えが聞かれたことを明確にする。
- source_word: וַיִּתֶּן לִי בֵּן
  choice: 私に男の子を授けてくださった
  rationale: בֵּןが男性の子を明示するため「男の子」とする。神からの賜物を述べる自然で敬意ある日本語として「授けてくださった」を用いる。
- source_word: עַל כֵּן
  choice: それで
  rationale: 命名の理由を導く因果関係を、現代日本語の物語文として明快に表す。
- source_word: קָרְאָה שְׁמוֹ דָּן
  choice: その子をダンと名づけた
  rationale: ヘブライ語の直訳は「彼の名をダンと呼んだ」だが、日本語では「名づけた」が自然で、命名行為を正確に伝える。語呂合わせは脚注で示す。
- source_word: דָּן
  choice: ダン
  rationale: 定着した日本語音写を用いる。דין（裁く）との語呂合わせは脚注で説明する。
theological_decisions:
- issue: ラケルが述べる神の司法的行為
  choice: 神は私の訴えを裁き
  alternative: 神は私を裁き／神は私の正しさを認め
  rationale: 司法的比喩と「ダン」という名との結びつきを残しながら、神がラケルを有罪としたかのような日本語上の誤解を避ける。同時に、「正しいと認めた」という強い神学的解釈までは加えない。
translation_notes:
  register: 明快な現代標準日本語を用い、物語として自然でありながら dignified な調子を保った。原文の法廷的語感と命名の語呂合わせを本文と脚注で保持した。
