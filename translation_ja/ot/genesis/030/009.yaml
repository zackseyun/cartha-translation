source:
  edition: WLC
  text: וַ/תֵּ֣רֶא לֵאָ֔ה כִּ֥י עָמְדָ֖ה מִ/לֶּ֑דֶת וַ/תִּקַּח֙ אֶת זִלְפָּ֣ה שִׁפְחָתָ֔/הּ וַ/תִּתֵּ֥ן אֹתָ֛/הּ לְ/יַעֲקֹ֖ב לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/009.yaml
  text: When Leah saw that she had stopped bearing children[b][a], she took Zilpah her female servant and gave her to Jacob as a wife.
translation:
  language: ja
  text: レアは、自分が子を産まなくなったのを見て、自分の女奴隷ジルパを取り、妻としてヤコブに与えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: 見て
  rationale: 物語を進めるワウ継続法を、後続する行為との時間的なつながりが自然に伝わる形で訳した。
- source_word: כִּי
  choice: のを
  rationale: 原因ではなく、レアが認識した内容を導く接続詞として訳した。
- source_word: עָמְדָה מִלֶּדֶת
  choice: 子を産まなくなった
  rationale: עמד＋מן＋不定詞の「〜するのをやめる」という慣用的意味を、出産の文脈に即して自然な現代日本語にした。
- source_word: שִׁפְחָתָהּ
  choice: 女奴隷
  rationale: שִׁפְחָהが表す、女性であり隷属的身分にある者という意味を曖昧にせず示した。「女中」では身分関係が弱まり、「はしため」は古風である。
- source_word: זִלְפָּה
  choice: ジルパ
  rationale: 人名を日本語聖書で通用する形に音写した。
- source_word: לְיַעֲקֹב
  choice: ヤコブに
  rationale: この構文におけるלの間接目的語を素直に表した。
- source_word: לְאִשָּׁה
  choice: 妻として
  rationale: 婚姻を表す定型句の意味を保ち、単なる性的関係や、本文にない「そばめ」という区分を持ち込まない訳とした。
theological_decisions:
- issue: ジルパの家内身分と婚姻上の位置づけ
  choice: 「女奴隷」と「妻として」の両方をそのまま訳出する。
  alternative: 「女中／はしため」とする、または「そばめとして」とする。
  rationale: ヘブライ語本文はジルパをレアのשִׁפְחָהと明記すると同時に、ヤコブへלְאִשָּׁהとして与えたと述べる。従属的な身分と正式な婚姻表現との緊張を保ち、本文にない後代の専門的区分を加えない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書叙述にふさわしい簡潔で落ち着いた調子とした。「連れて来て」はוַתִּקַּחの行為性を自然に示す。注を必要とするほどの訳語上の曖昧さはないため、脚注は付していない。
