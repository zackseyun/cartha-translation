  text: וַ/תֹּ֣אמֶר לָ֗/הּ הַ/מְעַט֙ קַחְתֵּ֣/ךְ אֶת אִישִׁ֔/י וְ/לָ/קַ֕חַת גַּ֥ם אֶת דּוּדָאֵ֖י בְּנִ֑/י וַ/תֹּ֣אמֶר רָחֵ֗ל לָ/כֵן֙ יִשְׁכַּ֤ב עִמָּ/ךְ֙ הַ/לַּ֔יְלָה תַּ֖חַת דּוּדָאֵ֥י בְנֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/015.yaml
  text: But she said to her, “Was it a small thing that you took my husband, and would you also take my son’s mandrakes?” Rachel said, “Then he may lie with you tonight in exchange for your son’s mandrakes.”
translation:
  language: ja
  text: するとレアはラケルに言った。「あなたは私の夫を取っただけでは足りず、今度は私の息子の恋なすびまで取ろうとするのですか。」ラケルは言った。「それなら、あなたの息子の恋なすびと引き換えに、今夜、夫はあなたと寝ることにしましょう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְעַט
  choice: ～だけでは足りず
  rationale: 字義は「小さいことか／わずかなことか」。非難を込めた修辞疑問として、現代日本語で自然に伝えた。
- source_word: קַחְתֵּךְ אֶת־אִישִׁי
  choice: あなたは私の夫を取った
  rationale: 動詞 לקח の直接的な表現と、レアの視点からの「私の夫」を保持した。
- source_word: דּוּדָאֵי
  choice: 恋なすび
  rationale: 植物名 mandrake を指す伝統的な日本語名。語の同定を保ちつつ、本文の交換対象が植物であることを示す。
- source_word: יִשְׁכַּב עִמָּךְ
  choice: 夫はあなたと寝る
  rationale: ヘブライ語の婉曲的だが明白な性的含意を、露骨にしすぎず自然な日本語で保持した。
- source_word: תַּחַת
  choice: ～と引き換えに
  rationale: ここでは代価・交換を表し、ラケルが夫と過ごす夜を恋なすびの対価として譲る文脈に適する。
theological_decisions:
- issue: ラケルがヤコブを譲る発言の主体性
  choice: 「夫はあなたと寝ることにしましょう」
  alternative: 「彼はあなたと寝てもよい」
  rationale: ラケルが取り決めを提示している語用を示しつつ、本文を越えて法的権利や倫理的評価を付加しない。
- issue: 「私の夫を取った」というレアの非難
  choice: 非難をそのまま保持
  alternative: 「夫を私から遠ざけた」などに緩和
  rationale: 姉妹間の緊張を原文どおり残し、事実関係や責任を訳者が裁定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、姉妹間の鋭い応酬と取引的な響きを保持した。「恋なすび」はやや古風だが定着した植物名であり、聖書本文としての品位と具体性を両立させる。
