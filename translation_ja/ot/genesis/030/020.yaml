  text: וַ/תֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨/נִי אֱלֹהִ֥ים אֹתִ/י֮ זֵ֣בֶד טוֹב֒ הַ/פַּ֨עַם֙ יִזְבְּלֵ֣/נִי אִישִׁ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שִׁשָּׁ֣ה בָנִ֑ים וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ זְבֻלֽוּן׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/020.yaml
  text: And Leah said[a], “God has endowed me with a good endowment. This time my husband will honor me, because I have borne him six sons.” So she called his name Zebulun.
translation:
  language: ja
  text: レアは言った。「神は私に良い贈り物を授けてくださった。今度こそ、夫は私を重んじてくれるだろう[a]。私は夫に六人の息子を産んだのだから。」そこで彼女は、その子をゼブルンと名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「夫は私と一緒に住んでくれるだろう」。このヘブライ語動詞は用例が少なく、ゼブルンという名との語呂合わせになっている。「重んじる」と「一緒に住む（とどまる）」の両方の意味合いを含む可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבָדַנִי אֱלֹהִים אֹתִי זֵבֶד טוֹב
  choice: 神は私に良い贈り物を授けてくださった
  rationale: 同根の動詞と名詞による語遊びは日本語で完全には再現できないが、「授ける」「贈り物」を組み合わせ、神から与えられた恵みという意味を自然に表した。
- source_word: הַפַּעַם
  choice: 今度こそ
  rationale: これまで夫の愛を得ようとしてきたレアの期待を踏まえ、この場面での強調を自然な日本語で示した。
- source_word: יִזְבְּלֵנִי
  choice: 私を重んじてくれるだろう
  rationale: 稀な動詞で意味には不確かさがあるが、六人の息子を産んだことによって夫から尊重されるという文脈上の期待を表す。別解は脚注に残した。
- source_word: אִישִׁי
  choice: 夫
  rationale: 婚姻関係を明確かつ自然に表す現代日本語。
- source_word: יָלַדְתִּי לוֹ שִׁשָּׁה בָנִים
  choice: 私は夫に六人の息子を産んだ
  rationale: לוֹ の間接目的語を「夫に」で保持しつつ、簡潔で分かりやすく訳した。
- source_word: וַתִּקְרָא אֶת שְׁמוֹ זְבֻלוּן
  choice: そこで彼女は、その子をゼブルンと名づけた
  rationale: ヘブライ語の命名定型を、明瞭で自然な日本語にした。
- source_word: זְבֻלוּן
  choice: ゼブルン
  rationale: 日本語聖書で広く通用する標準的な固有名表記を用いた。
theological_decisions:
- issue: יִזְבְּלֵנִי の意味の不確かさ
  choice: 本文では「私を重んじてくれるだろう」
  alternative: 「私と一緒に住んでくれるだろう」または「私のもとにとどまってくれるだろう」
  rationale: 語は稀で、ゼブルンという名との語呂合わせを伴う。夫からの評価を期待する意味が文脈に合う一方、同居・滞在の含意も排除せず脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、レアの切実な期待を保ちながらも過度な感情表現は加えていない。「今度こそ」によって הַפַּעַם の文脈的強調を表した。
