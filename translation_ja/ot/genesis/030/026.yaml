  text: תְּנָ֞/ה אֶת נָשַׁ֣/י וְ/אֶת יְלָדַ֗/י אֲשֶׁ֨ר עָבַ֧דְתִּי אֹֽתְ/ךָ֛ בָּ/הֵ֖ן וְ/אֵלֵ֑כָה כִּ֚י אַתָּ֣ה יָדַ֔עְתָּ אֶת עֲבֹדָתִ֖/י אֲשֶׁ֥ר עֲבַדְתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/026.yaml
  text: Give me my wives and my children[a], for whom I have served you, so that I may go[b]; for you know the service with which I have served you.
translation:
  language: ja
  text: 私が妻たちのためにあなたに仕えてきたのですから[a]、私の妻たちと子どもたちを渡してください。私は去ります。私があなたにしてきた奉仕を[b]、あなたは知っています。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「妻たちのために」と訳した語は女性複数で、通常は「妻たち」を指す。直前の「妻たちと子どもたち」全体に関係させて理解することもある。
    reason: lexical_alternative
  - marker: b
    text: 「奉仕」は「労働」または「労苦」とも訳せる。ヘブライ語では、ここで「奉仕」と訳した名詞と、前後の「仕える」に同じ語根が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנָה
  choice: 私に渡してください
  rationale: נתןの命令形。文脈上の受け手であるヤコブを「私に」と明示し、妻子を自分のもとに引き渡すよう求める意味を自然な日本語で表した。
- source_word: נָשַׁי וְאֶת יְלָדַי
  choice: 私の妻たちと子どもたち
  rationale: נָשַׁיはこの文脈では明確に複数の妻を指し、יְלָדַיは一般的な家族語として「子どもたち」とした。
- source_word: אֲשֶׁר עָבַדְתִּי אֹתְךָ בָּהֵן
  choice: 私がその者たちのためにあなたに仕えてきた
  rationale: עבדの奉仕・労働関係を「仕えてきた」で表した。בָהֵןの指示範囲には曖昧さがあるため、本文では直前の妻子全体を受け得る「その者たち」とし、妻たちだけを指す可能性を脚注に残した。
- source_word: וְאֵלֵכָה
  choice: そうして、私は出て行きます
  rationale: הלךのコホータティブが示す、ヤコブ自身の出立への意志を表す。「出て行く」は現在地を離れる文脈を明確にする。
- source_word: כִּי אַתָּה יָדַעְתָּ
  choice: あなたがご存じです
  rationale: 理由を示すכִּיは日本語では独立文の流れに含ませ、ידעの完了形が持つ現在的な認識を「ご存じです」とした。
- source_word: עֲבֹדָתִי אֲשֶׁר עֲבַדְתִּיךָ
  choice: 私があなたにしてきた働き
  rationale: 同根の名詞と動詞による反復を、日本語として不自然にならない範囲で「仕えてきた」と「働き」によって響かせ、契約下の奉仕・労働を表した。
