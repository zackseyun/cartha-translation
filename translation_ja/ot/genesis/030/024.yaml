  text: וַ/תִּקְרָ֧א אֶת שְׁמ֛/וֹ יוֹסֵ֖ף לֵ/אמֹ֑ר יֹסֵ֧ף יְהוָ֛ה לִ֖/י בֵּ֥ן אַחֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/024.yaml
  text: And she called his name Joseph[a], saying, “May Yahweh add to me another son.”
translation:
  language: ja
  text: そして彼女はその子をヨセフ[a]と名づけて言った。「ヤハウェが私にもう一人の息子を加えてくださいますように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヨセフ」は、続くヘブライ語の「加える」と同じ語根に由来する名である。
    reason: 原文にある人名と動詞の語呂合わせを、日本語本文だけでは再現できないため。
lexical_decisions:
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: そして彼女はその子を…と名づけて
  rationale: ヘブライ語の直訳は「彼の名を呼んだ」だが、日本語では命名の定型として「その子を…と名づけて」が自然であり、叙事の連続も「そして」で示せる。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で定着した人名表記を採用する。後続の同根動詞との語呂合わせは脚注で示す。
- source_word: לֵאמֹר
  choice: 言った
  rationale: 引用を導く不定詞であり、現代日本語の自然な叙述として表す。
- source_word: יֹסֵף
  choice: 加えてくださいますように
  rationale: יסףのヒフィル形「加える」を願望・祈願として理解する。敬意を含む自然な日本語で、神への願いであることを示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写する。
- source_word: לִי
  choice: 私に
  rationale: 与益・関係を示す前置詞を保ち、「私に…を加える」という原文の構造を反映する。
- source_word: בֵּן אַחֵר
  choice: もう一人、男の子を
  rationale: בֵּןは明確に「息子／男の子」、אַחֵרは「もう一人、別の」を意味する。日本語として自然な願いの表現にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いているため、その情報を保つ音写を採用し、称号への置換を避ける。
- issue: יֹסֵף の法的ニュアンス
  choice: 願望「加えてくださいますように」
  alternative: 「加えてくださる」「加えられた」
  rationale: 命名の説明と、さらに息子を求める文脈から、未完了形を祈願・願望として訳すのが最も適切。ただし形態だけでは未来的陳述も可能である。
translation_notes:
  register: 明瞭な現代標準語を用い、命名場面にふさわしい簡潔で dignified な調子とした。「息子」より会話として自然な「男の子」を選びつつ、性別を明確に保った。
