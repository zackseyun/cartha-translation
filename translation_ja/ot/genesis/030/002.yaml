  - severity: low
    issue: 「胎の実」は現代日本語としてやや硬く不自然である。
    rationale: 原文の比喩を保ちながら「胎の実り」とすれば、明瞭な現代標準日本語としてより自然になる。脚注で子ども・子孫を指す慣用表現であることを示す。
