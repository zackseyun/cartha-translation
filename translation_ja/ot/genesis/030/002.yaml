id: GEN.30.2
reference: Genesis 30:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יַעֲקֹ֖ב בְּ/רָחֵ֑ל וַ/יֹּ֗אמֶר הֲ/תַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר מָנַ֥ע מִמֵּ֖/ךְ פְּרִי בָֽטֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/002.yaml
  text: Then Jacob became angry with Rachel and said[a], “Am I in the place of God[b], who has withheld the fruit of the womb from you?”
translation:
  language: ja
  text: するとヤコブはラケルに腹を立て[a]、言った。「私が、あなたから胎の実り[b]を差し控えておられる神に代わる者なのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヤコブの怒りはラケルに対して燃えた」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「胎の実」。子どもまたは子孫を意味するヘブライ語の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: 腹を立て
  rationale: 怒りが燃えることを表すヘブライ語の慣用句。現代日本語として自然であり、怒りが生じたことも明確に伝える。より字義的な表現は脚注に示した。
- source_word: בְּרָחֵל
  choice: ラケルに
  rationale: 怒りが向けられた相手を示す前置詞なので、日本語では「ラケルに腹を立て」とするのが自然。
- source_word: הֲתַחַת אֱלֹהִים אָנֹכִי
  choice: 私は神に代わる者なのか
  rationale: תַחַת はここでは場所的な「下」ではなく、神の立場や役割に取って代わることを表す。修辞疑問の形を保った。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 文脈と後続する単数の動詞により、唯一の神を指す。
- source_word: אֲשֶׁר מָנַע
  choice: 与えないでおられるのは、神ではないか
  rationale: 神がラケルの妊娠を阻んでいるという原文の作用主体を明示しつつ、日本語の修辞疑問として自然にした。「おられる」は神への敬意を表す通常の日本語表現で、原文の主張を弱めない。
- source_word: מִמֵּךְ
  choice: あなたに……与えない
  rationale: מן が表す剥奪の意味を、日本語では「あなたに与えない」という自然な構文で表した。
- source_word: פְּרִי בָטֶן
  choice: 胎の実
  rationale: 子ども・子孫を意味する具体的な比喩を保持した。「胎の実」は簡潔で聖書的な格調があり、意味は脚注で補った。
theological_decisions:
- issue: 不妊における神の作用
  choice: ラケルに子どもがないのは、神が胎の実を与えないでおられるためだとするヤコブの発言をそのまま訳す。
  alternative: 神の作用をぼかし、ヤコブが単に自分の無力さだけを述べたと訳す。
  rationale: אֲשֶׁר מָנַע מִמֵּךְ פְּרִי בָטֶן は、神を胎の実を差し止めた主体として直接示す。翻訳でこの主張を弱めたり説明的に解消したりしない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「神に代わる者」「胎の実」によって原文の修辞と比喩を保持した。ヤコブの怒りと修辞疑問の強さを過度に和らげず、神の作用についての原文の神学的緊張もそのまま残した。
