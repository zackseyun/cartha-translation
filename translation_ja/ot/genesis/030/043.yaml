base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/043.yaml
  text: And the man became exceedingly prosperous[b][a], and he came to have many flocks and female servants and male servants and camels and donkeys.
translation:
  language: ja
  text: その人はこの上なく栄え、多くの羊や山羊の群れ、女奴隷と男奴隷[a]、らくだ、ろばを持つようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女の召使いと男の召使い」とも訳せる。ヘブライ語は女性奴隷と男性奴隷を指す語で、文脈によっては召使いとも訳されるが、ここでは所有する財産の中に数えられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְרֹץ
  choice: 栄え
  rationale: 原義には「突き破る、広がる」という勢いがあり、ここでは財産が飛躍的に増えて繁栄したことを表すため、文脈に即して「栄え」とした。
- source_word: הָאִישׁ
  choice: この人
  rationale: 文脈上はヤコブを指すが、原文の普通名詞「その人」を明示的に固有名へ置き換えず、自然な日本語で「この人」とした。
- source_word: מְאֹד מְאֹד
  choice: この上なく
  rationale: 「非常に」が二度重ねられた強い強調を、過度に逐語的な反復を避けつつ明瞭に表した。
- source_word: וַיְהִי לוֹ
  choice: 持つようになった
  rationale: 単なる静的所有ではなく、それらが彼のものとなったという物語上の結果を表す。
- source_word: צֹאן רַבּוֹת
  choice: 多くの羊や山羊の群れ
  rationale: צֹאןは羊と山羊を中心とする小家畜の集合を指すため、日本語読者に範囲が分かるよう具体的に表した。
- source_word: שְׁפָחוֹת
  choice: 女奴隷
  rationale: 女性の隷属的な家内労働者を指し、ここでは財産の列挙に含まれるため、身分上の現実を曖昧にしない訳語を選んだ。
- source_word: עֲבָדִים
  choice: 男奴隷
  rationale: 男性の隷属的労働者を指し、対になっているשְׁפָחוֹתとの性別の区別を保った。
- source_word: גְמַלִּים
  choice: らくだ
  rationale: 動物名の標準的な現代日本語訳。
- source_word: חֲמֹרִים
  choice: ろば
  rationale: 動物名の標準的な現代日本語訳。
theological_decisions:
- issue: שְׁפָחוֹתとעֲבָדִיםを「しもべ」とするか「奴隷」とするか
  choice: 女奴隷と男奴隷
  alternative: 女の召使いと男の召使い／はしためとしもべ
  rationale: 両語は文脈によって「召使い」とも訳せるが、本節では家畜とともに取得された財産として列挙されている。そこで、隷属身分という社会的現実を和らげず「奴隷」とし、原文にある男女の区別も示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、原文の強い繁栄表現と、財産が累積していく列挙の調子を保った。「羊や山羊」はצֹאןの範囲を自然に伝えるための明示化である。
