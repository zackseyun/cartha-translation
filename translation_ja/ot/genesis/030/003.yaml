source:
  edition: WLC
  text: וַ/תֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥/י בִלְהָ֖ה בֹּ֣א אֵלֶ֑י/הָ וְ/תֵלֵד֙ עַל בִּרְכַּ֔/י וְ/אִבָּנֶ֥ה גַם אָנֹכִ֖י מִמֶּֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/003.yaml
  text: Then she said[a], “Here is my female servant Bilhah. Go in to her, so that she may bear on my knees[c][b], and I too may be built up through her.”
translation:
  language: ja
  text: そこで彼女は言った。「ここに私の女奴隷ビルハがいます。彼女のもとに入りなさい。彼女が私の膝の上で子を産み[a]、私も彼女によって築き上げられるように[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私の膝の上で子を産む」。女奴隷が産んだ子を妻が自分の子として象徴的に受け入れる、当時の慣習を指すと考えられます。
    reason: cultural_note
  - marker: b
    text: 別訳「私も彼女によって子を得られるように」。ヘブライ語は「築き上げられる」と表現し、子孫を得て家が築かれることを比喩的に語っています。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲמָתִי
  choice: 私の女奴隷
  rationale: אמהは従属的身分にある女性の奴隷・召使いを指す。「女奴隷」は古風さを避けつつ、当時の社会的身分を曖昧にしない。
- source_word: בֹּא אֵלֶיהָ
  choice: 彼女のところに入りなさい
  rationale: 性交を表すヘブライ語の婉曲表現である。日本語でも意味を汲み取れる範囲で原文の比喩的な言い方を保った。
- source_word: וְתֵלֵד עַל בִּרְכַּי
  choice: 彼女が私の膝の上で子を産み
  rationale: 「私の膝の上で」という文化的に特徴ある表現を本文に残し、女奴隷の産んだ子を妻の子として受け入れる慣習の可能性は脚注で説明した。
- source_word: וְאִבָּנֶה
  choice: 私も……築き上げられる
  rationale: בנהのニファル形が持つ「築き上げられる」という比喩を保った。文脈上は子を得て家を築くことを意味し得るため、脚注で自然な別訳を示した。
- source_word: מִמֶּנָּה
  choice: 彼女によって
  rationale: ビルハを、ラケルが子孫を得て家を築く手段として示す前置詞の道具的意味を自然な日本語で表した。
- source_word: גַם אָנֹכִי
  choice: 私も
  rationale: 不妊のラケル自身もその結果にあずかるという強調を簡潔に保った。
theological_decisions:
- issue: וְאִבָּנֶהの家族・子孫に関する比喩
  choice: 本文では「築き上げられる」として比喩を保持する
  alternative: 「彼女によって子を得られる」「彼女によって家を築ける」
  rationale: 原文は子を得る意味を含みながら、字義的には「築き上げられる」と述べる。意味を一つに限定せず、脚注で文脈上の含意を示す。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、物語の厳粛さと原文の婉曲表現・建築比喩を保つ文体とした。「女奴隷」は歴史的な身分関係を明示し、「膝の上」「築き上げられる」は脚注を添えて原文の文化的・語彙的特徴を残した。
