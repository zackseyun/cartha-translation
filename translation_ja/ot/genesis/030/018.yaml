id: GEN.30.18
reference: Genesis 30:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר לֵאָ֗ה נָתַ֤ן אֱלֹהִים֙ שְׂכָרִ֔/י אֲשֶׁר נָתַ֥תִּי שִׁפְחָתִ֖/י לְ/אִישִׁ֑/י וַ/תִּקְרָ֥א שְׁמ֖/וֹ יִשָּׂשכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/030/018.yaml
  text: And Leah said[a], “God has given me my reward, because I gave my female servant to my husband.” So she named him Issachar.
translation:
  language: ja
  text: レアは言った。「私が女奴隷を夫に与えたので、神は私に報酬を与えてくださった。」そこで彼女は、その子をイッサカル[a]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イッサカル」という名は、ヘブライ語の「報酬」または「賃金」を思わせる響きを持つ。
    reason: 原文にある命名の語呂合わせを日本語本文だけでは伝えられないため。
lexical_decisions:
- source_word: נָתַן אֱלֹהִים
  choice: 神は……与えてくださった
  rationale: 完了した行為の現在的な結果を含むレアの発言として自然に表し、神を主語とする原文を保った。
- source_word: שְׂכָרִי
  choice: 私に報酬を
  rationale: שָׂכָרの「報酬・賃金」という意味のうち、出産を神からの返礼と捉える文脈に自然な「報酬」を採用し、イッサカルとの語呂合わせは脚注で示した。
- source_word: אֲשֶׁר
  choice: ので
  rationale: 形式上は関係詞だが、ここではレアが報酬を受けた理由を導く因果的用法として訳した。
- source_word: נָתַתִּי
  choice: 私が……与えた
  rationale: 先行する行為を表す完了形を、自然な日本語の過去形で訳した。
- source_word: שִׁפְחָתִי
  choice: 私の女奴隷
  rationale: שִׁפְחָהが示す女性かつ隷属的な身分を曖昧にせず、現代日本語で簡潔に表した。
- source_word: לְאִישִׁי
  choice: 夫に
  rationale: この文脈のאִישׁは婚姻関係にあるヤコブを指すため、「夫」とした。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: そこで彼女は、その子を……と名づけた
  rationale: 命名を表すヘブライ語の慣用句と、物語上の帰結を自然な日本語で示した。
- source_word: יִשָּׂשכָר
  choice: イッサカル
  rationale: 固有名詞を一般的な日本語聖書の慣用表記で音写した。
theological_decisions:
- issue: レアによる神の行為の解釈
  choice: 神が報酬を与えたというレア自身の言葉を、そのまま発言として訳す
  alternative: 「恵み」などの語を用いて取引的な響きを弱める
  rationale: 本文はレアの出来事の解釈を伝えており、翻訳でその神学的評価を肯定も批判もせず、報酬という緊張を保つべきである。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文としての品位を保った。「女奴隷」は原語の隷属的身分を明示するため採用し、「女中」のような古風または意味を弱める表現を避けた。脚注記号[a]は語呂合わせの対象である人名の直後に置いた。
