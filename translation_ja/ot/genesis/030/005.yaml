  yaml_path: translation/ot/genesis/030/005.yaml
  text: Bilhah conceived and bore Jacob a son[a].
translation:
  language: ja
  text: ビルハは身ごもり、ヤコブに男の子を産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: 身ごもり
  rationale: 動詞 הרה は妊娠することを表す。「身ごもる」は物語文にふさわしい自然で品位ある現代日本語であり、続く出産との時間的な流れも明瞭に示す。
- source_word: בִּלְהָה
  choice: ビルハ
  rationale: 人名は日本語聖書で一般的な音写に従った。
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: 動詞 ילד はここでは子を産むことを意味する。「産んだ」は簡潔で自然な日本語である。
- source_word: לְיַעֲקֹב
  choice: ヤコブのために
  rationale: 前置詞 לְ の受益・関係の含意を保つため「ヤコブのために」とした。単に「ヤコブの子を」とすると自然ではあるが、原文の構文上のニュアンスを弱める。
- source_word: בֵּן
  choice: 男の子
  rationale: בֵּן は「息子」を意味するが、出産の記事では日本語の「男の子を産んだ」が自然で、子の性別を明確に伝える。
