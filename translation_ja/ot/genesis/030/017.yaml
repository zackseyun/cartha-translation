  yaml_path: translation/ot/genesis/030/017.yaml
  text: And God listened to Leah[a], and she conceived and bore Jacob a fifth son.
translation:
  language: ja
  text: 神はレアに耳を傾け[a]、彼女は身ごもって、ヤコブに五人目の息子を産んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「神はレアのことを聞いた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע ... אֶל
  choice: 願いを聞き入れ
  rationale: שׁמע に אֶל が続く表現は、単に音声を聞くことではなく、相手に耳を傾けて好意的に応じる意味を帯びる。この文脈では、日本語の「願いを聞き入れる」が応答的な含意を自然に伝える。原文に「願い」に当たる名詞はないため、より字義的な訳を脚注に示した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 物語の中で唯一の神を指しており、標準的に「神」と訳す。
- source_word: לֵאָה
  choice: レア
  rationale: 日本語聖書で広く用いられる標準的な人名表記を採用した。
- source_word: וַתַּהַר
  choice: 彼女は身ごもって
  rationale: 妊娠したことを表す自然で品位ある現代日本語。「妊娠して」より物語文として滑らかである。
- source_word: וַתֵּלֶד לְיַעֲקֹב
  choice: ヤコブに…産んだ
  rationale: ילד と לְ の関係を保ち、レアがヤコブに息子を産んだことを簡潔に表した。
- source_word: בֵּן חֲמִישִׁי
  choice: 五人目の息子
  rationale: 序数が「息子」を修飾する関係を、自然な日本語で明確に表す。
theological_decisions:
- issue: שׁמע אֶל が示す神の応答
  choice: 神がレアの願いに好意的に応じたことを「願いを聞き入れ」で表す。
  alternative: 神はレアの言うことを聞いた。
  rationale: このヘブライ語表現は単なる聴覚的認知以上の応答を含み得るが、その含意を過度に教理化しない。字義的な可能性は脚注に残す。
translation_notes:
  register: 明快で現代的な物語文としつつ、「身ごもって」「産んだ」によって簡潔さと品位を保った。「願いを聞き入れ」は文脈上の応答的意味を自然に示し、字義的表現を脚注で補った。
