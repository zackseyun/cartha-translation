  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/מֵ/עֵ֗ץ הַ/דַּ֨עַת֙ ט֣וֹב וָ/רָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑/נּוּ כִּ֗י בְּ/י֛וֹם אֲכָלְ/ךָ֥ מִמֶּ֖/נּוּ מ֥וֹת תָּמֽוּת׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/017.yaml
  text: but from the tree of the knowledge of good and evil you shall not eat[a], for in the day you eat from it[b], you shall surely die.
translation:
  language: ja
  text: しかし、善悪の知識の木からは、食べてはならない[a]。その木から食べる日には[b]、あなたは必ず死ぬ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「善悪の知識の木からは、それから食べてはならない」と、先に出した語を代名詞で受け直している。
    reason: previous_rendering
  - marker: b
    text: 「食べる日には」は、「食べる時には」という意味にもなりうるヘブライ語の言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵץ
  choice: しかし、……の木からは
  rationale: 接続詞と前置詞を踏まえつつ、前節で許された他の木との対比を「しかし」と係助詞「は」で自然に示した。
- source_word: הַדַּעַת טוֹב וָרָע
  choice: 善悪の知識
  rationale: דעתを「知識」、טוב ורעを道徳的重みのある「善悪」と訳し、構文上の結びつきを保った。
- source_word: לֹא תֹאכַל
  choice: 食べてはならない
  rationale: 否定を伴う未完了形が表す厳粛な禁止を、明瞭な現代日本語で示した。
- source_word: מִמֶּנּוּ
  choice: その木から
  rationale: מןの「から」を保持し、何を指すかが日本語でも明確になるよう代名詞を補った。
- source_word: בְּיוֹם אֲכָלְךָ
  choice: 食べる日には
  rationale: 字義に近い時間表現を残し、「食べる時」と意訳して時間的な含みを狭めることを避けた。
- source_word: מוֹת תָּמוּת
  choice: 必ず死ぬ
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調と確実性を、自然で厳粛な日本語にした。
theological_decisions:
- issue: 「それを食べる日」の時間的意味と死の成就との関係
  choice: 「食べる日には」としてヘブライ語の時間表現を本文に残す
  alternative: 「食べる時には」と訳す、または即日の肉体的死・死すべき状態の開始・死刑宣告の確定のいずれかに解釈して訳す
  rationale: 物語上の後の展開との緊張を保ち、死がどの意味でその日に生じるのかを翻訳で決めないため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の禁止と死の確実性にふさわしい厳粛さを保った。「善悪の知識の木」は原文の名詞構造を反映する定着した表現として採用し、説明的な意訳は避けた。
