source:
  edition: WLC
  text: וַ/יִּקַּ֛ח יְהוָ֥ה אֱלֹהִ֖ים אֶת הָֽ/אָדָ֑ם וַ/יַּנִּחֵ֣/הוּ בְ/גַן עֵ֔דֶן לְ/עָבְדָ֖/הּ וּ/לְ/שָׁמְרָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/015.yaml
  text: Then Yahweh God took the man and placed him in the garden of Eden to work it and to keep it[a][b].
translation:
  language: ja
  text: 神であるヤハウェは、園を耕し、守るために、その人を連れて行ってエデンの園に置いた[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「置いた」は、「休ませた」「落ち着かせた」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「園を耕し、守る」は、「園で働く（または園を耕作する）」および「保つ、見守る」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: 神であるヤハウェ
  rationale: 神名יהוהを「ヤハウェ」と音写し、אֱלֹהִיםを「神」と訳す。日本語として自然に一つの呼称にまとめつつ、固有名と称号の双方を保持する。
- source_word: הָאָדָם
  choice: 人
  rationale: 文脈では先に形造られた一人の人を指す。日本語の「人」は個人を自然に指し、原文にない固有名「アダム」をここで導入しない。
- source_word: וַיִּקַּח
  choice: 連れて来て
  rationale: 基本義は「取る」だが、目的地である園への移動を伴う文脈では「連れて来る」が自然である。移動の方法などは付加しない。
- source_word: וַיַּנִּחֵהוּ
  choice: 住まわせ
  rationale: נוחのヒフィル形には「置く」「休ませる」「落ち着かせる」の幅がある。ここでは園に定住させる文脈を自然に表す「住まわせ」を採り、別の可能性は脚注に残す。
- source_word: בְּגַן עֵדֶן
  choice: エデンの園に
  rationale: 構文と固有名を保つ、現代日本語で定着した表現。
- source_word: לְעָבְדָהּ
  choice: そこを耕し
  rationale: עבדは「働く・仕える・耕す」を意味し得るが、園を目的語とするため「耕す」が具体的で自然である。ただし広い意味は脚注で示す。
- source_word: וּלְשָׁמְרָהּ
  choice: 守らせた
  rationale: שמרの「守る・見守る・保つ」という意味の広がりを比較的よく保つ。保護だけでなく管理の含意も可能であり、脚注で補う。
theological_decisions:
- issue: エデンにおける人の務め
  choice: 園を耕し、守る務めとして訳し、通常の農耕・管理の意味を前面に出す。
  alternative: עבדとשמרを祭司的な「仕え、守る」という聖所用語として専門的に訳す。
  rationale: この語の組み合わせに祭司的・聖所的な響きを認める解釈は可能だが、本文だけではそれに限定できない。専門的な神学解釈を訳文に持ち込まず、語義の幅を脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。神名は「ヤハウェ」とし、「神であるヤハウェ」という語順で日本語の自然さを確保した。二つの不定詞句は目的を表す使役表現としてまとめ、原文の語義的・神学的な幅は脚注に保持した。
