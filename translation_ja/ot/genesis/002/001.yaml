  text: וַ/יְכֻלּ֛וּ הַ/שָּׁמַ֥יִם וְ/הָ/אָ֖רֶץ וְ/כָל צְבָאָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/001.yaml
  text: Thus the heavens and the earth were finished[b][a], and all their hosts.
translation:
  language: ja
  text: こうして、天と地と、それらに属するすべてのもの[a]が完成した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「それらの全軍勢」。ここでは、天と地を満たすものの総体を指す。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וַיְכֻלּוּ
  choice: 完成した
  rationale: כלהのプアル形による完了・完成の結果を自然な現代日本語で表す。「完成させられた」より自然であり、創造の全体が完成に至ったという意味を保つ。
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: 天と地
  rationale: 創世記の創造文脈で、局地的な「空と土地」ではなく、被造世界全体を指す対句として訳した。
- source_word: וְכָל צְבָאָם
  choice: そのすべてのもの
  rationale: צָבָאの「軍勢・整然と並ぶ大群」という語感よりも、この文脈での包括的な指示対象、すなわち天と地を満たす全存在を明瞭に伝える。原語の集合的な広がりは脚注で補う。
theological_decisions:
- issue: 「その全軍」（כָל־צְבָאָם）の範囲
  choice: 天と地に属し、それらを満たすすべてのものを包括的に指す表現とした。
  alternative: 主として星々または天体を指す、あるいは秩序立った軍勢の比喩を前面に出す。
  rationale: 直前の「天と地」を受ける総括文であるため、被造世界の内容全体を指す理解が文脈に適う。ただし、原語が「軍勢・大群」を表し得ることは脚注に残した。
translation_notes:
  register: 簡潔で荘重な創造記事の調子を保ちつつ、「万象」のような文語的表現を避け、一般の現代読者に明瞭な訳文とした。
