  text: וּֽ/זֲהַ֛ב הָ/אָ֥רֶץ הַ/הִ֖וא ט֑וֹב שָׁ֥ם הַ/בְּדֹ֖לַח וְ/אֶ֥בֶן הַ/שֹּֽׁהַם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/012.yaml
  text: And the gold of that land is good[b][a]; bdellium and onyx stone are there.
translation:
  language: ja
  text: その地の金は良質である。そこにはベドラハ[a]とオニキス石[b]もある。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ベドラハ」が何を指すかは確かでない。香りのある樹脂の一種とも考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「オニキス石」に当たるヘブライ語がどの宝石を指すかは確かでない。緑柱石などの可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּזֲהַב הָאָרֶץ הַהִוא
  choice: その地の金は
  rationale: 接続詞וは前節から叙述が続くことを示すが、日本語では文脈上明らかなため、機械的に「そして」を置かず自然な連続性を保った。הָאָרֶץ הַהִואは前節のハビラを指すので「その地」とした。
- source_word: טוֹב
  choice: 良質である
  rationale: ここでは金の品質を評価しているため、単なる道徳的な「良い」ではなく、簡潔で自然な「良質」とした。
- source_word: שָׁם
  choice: そこには……ある
  rationale: 前述の地を指す場所表現を明確にし、後続する二つの物を自然な日本語で導いた。
- source_word: הַבְּדֹלַח
  choice: ベドラハ
  rationale: 指示物の同定が不確かなため、「香料樹脂」などに限定せず、ヘブライ語に基づく音写を採用した。
- source_word: וְאֶבֶן הַשֹּׁהַם
  choice: とオニキス石
  rationale: אֶבֶן（石）を明示し、שֹׁהַםには伝統的な同定である「オニキス」を用いた。ただし鉱物の厳密な同定は不確かなため脚注で代案を示した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用い、簡潔な地理的叙述の調子を保った。「ベドラハ」は不確かな物質名を無理に特定せず音写し、「オニキス石」は伝統的な訳語を本文に置きつつ脚注で不確実性を明示した。
