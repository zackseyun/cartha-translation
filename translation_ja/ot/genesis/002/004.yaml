  yaml_path: translation/ot/genesis/002/004.yaml
  text: These are the generations of the heavens and the earth when they were created[c][b][a], in the day that Yahweh God made the earth and the heavens.
translation:
  language: ja
  text: これは、天と地が創造されたとき、ヤハウェ神が地と天を造ったときの由来である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「由来」と訳したヘブライ語は、直訳すれば「生まれ出たもの」「世代」。創世記では、ある人物や事物から続いて生じる事柄を導く定型句として用いられ、「系図」「記録」「歴史」などとも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תוֹלְדוֹת
  choice: これは……由来である
  rationale: 複数指示詞を含む定型句だが、日本語では節見出しとして自然な単数表現にした。תּוֹלְדוֹת はここでは系図上の「世代」より、天地に続いて生じた事柄を導入する「由来」が適切であり、語の起源・展開の含みも保つ。
- source_word: הַשָּׁמַיִם וְהָאָרֶץ
  choice: 天と地
  rationale: 被造世界全体を指す対句として、日本語聖書文体にも一般語法にも自然な「天と地」とした。ヘブライ語の שָׁמַיִם は形態上複数だが、日本語では「天」が自然である。
- source_word: בְּהִבָּרְאָם
  choice: 創造された時
  rationale: 前置詞 בְּ とニファル不定詞の時間的用法および受動の意味を明確に表す。
- source_word: בְּיוֹם עֲשׂוֹת
  choice: 造られた時
  rationale: 直訳的な「造られた日に」は一日への限定と誤解されうるため、「～した時」を意味するヘブライ語の慣用表現として訳した。主語への敬意を自然に示すため敬語形を用いた。
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 固有の神名 YHWH を「ヤハウェ」と音写し、אֱלֹהִים を「神」とした。
- source_word: אֶרֶץ וְשָׁמָיִם
  choice: 地と天
  rationale: 前半の「天と地」から語順が逆転している文学的特徴をそのまま保った。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／主なる神
  rationale: 原文が固有名 YHWH を用いることを読者に明示するため、推定発音に基づく一般的な日本語音写を採用した。
- issue: תּוֹלְדוֹת が前述の創造記事を総括するか、後続記事を導入するか
  choice: どちらにもつながりうる「由来」
  alternative: 創造の経緯／歴史
  rationale: 創世記の定型句には区分標題としての機能があり、向きについて解釈上の余地があるため、本文では一方に限定しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、創造記事にふさわしい簡潔で荘重な調子を保った。原文の二つの時間句は自然な日本語で区別し、後半の「地と天」という逆順を保持した。この節は後続文へ続く見出し的・従属節的性格を持つため、末尾を読点とした。
