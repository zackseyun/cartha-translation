base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/014.yaml
  text: And the name of the third river is Hiddekel[a]; it is the one that goes east of Asshur[b]. And the fourth river is the Euphrates.
translation:
  language: ja
  text: 第三の川の名はヒデケル[a]。これはアシュル[b]の東を流れる。第四の川はユーフラテスである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヒデケルは、伝統的にティグリス川と同定されている。
    reason: alternative_reading
  - marker: b
    text: 「アッシリア」とも訳せる。ヘブライ語は「アシュルの東」。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם
  choice: 名
  rationale: 河川名を示す定型表現として、原文の基本義を自然な現代日本語で保つ。
- source_word: נָהָר
  choice: 川
  rationale: 文脈上、通常の河川を指す一般的な語である。
- source_word: שְּׁלִישִׁי
  choice: 第三
  rationale: 序数を直接訳した。
- source_word: חִדֶּקֶל
  choice: ヒデケル
  rationale: ヘブライ語の固有名を音写し、伝統的な同定である「ティグリス」は脚注に残した。
- source_word: הוּא
  choice: これは
  rationale: 先行する第三の川を受ける指示的な働きを、自然な日本語で明示した。
- source_word: הֹלֵךְ
  choice: 流れている
  rationale: 字義は「行く」だが、川を主語とする日本語では「流れる」が自然であり、継続的な地理的描写も表せる。
- source_word: קִדְמַת
  choice: 東
  rationale: 地理的用法に基づき「東」と訳した。「前方」の可能性を文脈に反して持ち込まない。
- source_word: אַשּׁוּר
  choice: アシュル
  rationale: 原文の固有名を音写し、地域名「アッシリア」と取る可能性は脚注で示した。
- source_word: רְבִיעִי
  choice: 第四
  rationale: 序数を直接訳した。
- source_word: פְרָת
  choice: ユーフラテス
  rationale: 現代日本語で広く定着している河川名を用い、明瞭さを優先した。
