id: GEN.2.20
reference: Genesis 2:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א הָֽ/אָדָ֜ם שֵׁמ֗וֹת לְ/כָל הַ/בְּהֵמָה֙ וּ/לְ/ע֣וֹף הַ/שָּׁמַ֔יִם וּ/לְ/כֹ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה וּ/לְ/אָדָ֕ם לֹֽא מָצָ֥א עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/020.yaml
  text: And the man gave names to all the livestock[a], to the birds of the sky, and to every wild animal[c][b], but for the man no helper corresponding to him was found.
translation:
  language: ja
  text: その人[a]は、すべての家畜、空の鳥、野のすべての動物に、それぞれ名を付けた。しかし、その人にふさわしい助け手[b]は見つからなかった[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その人」は「アダム」とも訳せる。後半も「アダムには」と訳せる。
    reason: alternative_reading
  - marker: b
    text: 直訳に近くは「その人に対応する助け手」または「その人と向き合う助け手」。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語は能動形で「彼は見いださなかった」。したがって、「しかし、その人は、自分にふさわしい助け手を見いださなかった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָדָם / לְאָדָם
  choice: その人／その人に
  rationale: 定冠詞を伴う最初の語は、物語中の特定の人を指す普通名詞として読むのが自然である。「人類」ではなく個人を指し、この段階では固有名「アダム」と断定しない。
- source_word: וַיִּקְרָא ... שֵׁמוֹת
  choice: それぞれ名を付けた
  rationale: 「名を呼ぶ」という直訳的表現より、名称を与える行為を明確かつ自然に表す。「それぞれ」によって複数形 שֵׁמוֹת の含意も伝える。
- source_word: הַבְּהֵמָה
  choice: すべての家畜
  rationale: 文脈では、後に挙げられる野の動物と対照をなす飼育動物の類を表すため、現代日本語として明瞭な「家畜」とした。
- source_word: עוֹף הַשָּׁמַיִם
  choice: 空の鳥
  rationale: 「天の鳥」も可能だが、ここでは飛ぶ領域を示す自然で分かりやすい表現として「空の鳥」とした。
- source_word: כֹּל חַיַּת הַשָּׂדֶה
  choice: 野のすべての動物
  rationale: 家畜と区別される野生の陸上動物を指す。「野の獣」より現代的で広く理解しやすく、原文の「野」の像も保つ。
- source_word: עֵזֶר
  choice: 助け手
  rationale: 単なる抽象的な「助け」ではなく、助けを与える相手を指す文脈である。「助け手」自体は劣位や従属を意味しない。
- source_word: כְּנֶגְדּוֹ
  choice: その人にふさわしい
  rationale: 直訳的には「彼に対応して／彼の向かいに」の意を持ち、相対して釣り合う関係を示す。本文では自然な日本語を優先し「ふさわしい」とし、対応・対向の含意は脚注に残す。
- source_word: לֹא מָצָא
  choice: 見つからなかった
  rationale: 原文の動詞は能動形「彼は見いださなかった」だが、日本語では探索の結果として該当者がいなかったことを受動的に表すほうが自然である。能動形は脚注に保存する。
theological_decisions:
- issue: אָדָם を普通名詞と固有名のどちらで訳すか
  choice: その人
  alternative: アダム
  rationale: 定冠詞を伴い、園の物語に登場する個人を指しているため、普通名詞としての意味を前面に出した。ただし、この箇所で名のように理解する読みも可能なので脚注に示す。
- issue: כְּנֶגְדּוֹ が表す助け手との関係
  choice: その人にふさわしい
  alternative: その人に対応する／その人と向き合う
  rationale: 原語の対応・対向という含みを、上下関係を持ち込まず自然な日本語で表した。「ふさわしい」が単なる有用性だけを意味すると限定されないよう、脚注で原語の幅を示す。
- issue: לֹא מָצָא の主語と態
  choice: 見つからなかった
  alternative: その人は……見いださなかった
  rationale: 原文の能動形を否定せず、本文では日本語として自然な結果表現を採用した。探索主体を明示する読みは脚注に残す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文にふさわしい簡潔で品位ある調子とした。「助け手」は原語の人物性を保ち、「ふさわしい」は本文の自然さを優先しつつ、原語にある対応・対向の含意を脚注で補った。
