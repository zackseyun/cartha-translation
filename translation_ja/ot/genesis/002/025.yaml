- from: 人とその妻は、二人とも裸であった[a]。しかし、互いに恥ずかしいとは思わなかった。
  to: 男とその妻は、二人とも裸だった[a]。二人は恥じることがなかった。
  rationale: 原文にない逆接と相互性の含意を除き、男性個人を指す文脈上の指示対象を「男」として明確にした。二人が恥を経験しなかったという原文の複数述語は、「二人は恥じることがなかった」と簡潔に保持した。脚注は二人という表現の強調を説明し、本文との対応も維持している。
