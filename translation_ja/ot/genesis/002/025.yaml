  text: וַ/יִּֽהְי֤וּ שְׁנֵי/הֶם֙ עֲרוּמִּ֔ים הָֽ/אָדָ֖ם וְ/אִשְׁתּ֑/וֹ וְ/לֹ֖א יִתְבֹּשָֽׁשׁוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/025.yaml
  text: And the man and his wife were both naked[a], and they were not ashamed.
translation:
  language: ja
  text: 男とその妻は、二人とも裸だった[a]。二人は恥じることがなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「二人は裸であった」。二人の双方が裸だったことが強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: であった
  rationale: 物語をつなぐ過去の状態を表す。現代日本語として明瞭でありつつ、本文にふさわしい格調を保つ。
- source_word: שְׁנֵיהֶם
  choice: 二人とも
  rationale: 二人の双方に述語が当てはまるという原文の強調を自然な日本語で保つ。
- source_word: עֲרוּמִּים
  choice: 裸
  rationale: 衣服を身に着けていない状態を率直に表す標準的な訳語。次節の語とのヘブライ語上の音の響きは日本語では再現困難である。
- source_word: הָאָדָם
  choice: 人
  rationale: 創世記2章で登場人物を指す定着した自然な表現。ここでは妻と対になる男性個人を指すが、「男」とすると性別の対比を原文以上に前面化しうるため「人」とした。
- source_word: וְאִשְׁתּוֹ
  choice: その妻
  rationale: 三人称男性単数の接尾辞を反映し、直前まで語られた婚姻関係を明確に示す。
- source_word: וְלֹא יִתְבֹּשָׁשׁוּ
  choice: しかし、互いに恥ずかしいとは思わなかった
  rationale: בושの強意・反復的語幹による羞恥の経験を自然な日本語で表す。複数主語が共有する関係的な場面として「互いに」を補い、「しかし」で裸であることとの対照を明示した。
theological_decisions:
- issue: הָאָדָם の文脈的な指示対象
  choice: 人
  alternative: 男／人間
  rationale: 指示対象は「その妻」と対になる男性個人であり、人類一般ではない。ただし創世記2章の語りにおける הָאָדָם の呼称の連続性を保ち、余分な性別対比を加えないため「人」とした。
- issue: 羞恥の相互性
  choice: 互いに恥ずかしいとは思わなかった
  alternative: 恥じなかった
  rationale: 原文の複数形は二人が恥を経験しなかったことを述べるが、「互いに」は明示されていない。日本語では場面の関係性を自然に伝える補足として採用し、神学的な原因や性的含意は追加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書本文にふさわしい簡潔で落ち着いた文体とした。「裸」は婉曲化せず、原文の率直さを保った。
