revisions:
- from: そこで神は第七の日を祝福し、その日を聖なるものとされた[a]。その日に、神が創造し、行われたすべてのわざを休まれた[b]からである[c]。
  to: 神は七日目を祝福し、その日を聖なるものとされた[a]。その日に、神が創造して行ったすべてのわざを終えて休まれた[b]からである[c]。
  rationale: 受け身の「行われた」を、神を主語とする能動の「行った」に改めた。「わざを終えて休まれた」は、ヘブライ語の「すべてのわざから休んだ」を自然な日本語で表す。末尾の לַעֲשׂוֹת の統語的な難しさを本文で一義的に解決しすぎないよう、直訳的可能性と主要な理解を注に明記した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T03:38:15Z'
review_pass:
  verdict: revise
  source_fidelity: 本文後半の「神が創造し、行われた」は、「行われた」が受け身となっており、神を主語とするヘブライ語の二動詞を正確に表していません。また、「すべてのわざを休まれた」は現代日本語として不自然です。「創造して行ったすべてのわざを終えて休まれた」として、神がそのわざを行ったことと、わざから休んだことを明確にします。末尾の難しい不定詞句については注で直訳的表現と別解を保持します。
  naturalness: 「第七の日」より「七日目」が明快な現代標準日本語として自然です。「そこで」は前節からの強い推論関係を示すため外し、簡潔に接続します。
  terminology: 「祝福」「聖なるもの」「休まれた」は、原文の重要語と安息日の連関を保ちつつ、現代日本語として理解可能です。「わざ」は文脈上適切ですが、本文では「すべてのわざ」として用います。
  issues:
