language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ אֱלֹהִים֙ אֶת י֣וֹם הַ/שְּׁבִיעִ֔י וַ/יְקַדֵּ֖שׁ אֹת֑/וֹ כִּ֣י ב֤/וֹ שָׁבַת֙ מִ/כָּל מְלַאכְתּ֔/וֹ אֲשֶׁר בָּרָ֥א אֱלֹהִ֖ים לַ/עֲשֽׂוֹת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/003.yaml
  text: So God blessed the seventh day and made it holy[d][c][b][a], because on it he rested from all his work that God had created to make.
translation:
  language: ja
  text: 神は七日目を祝福し、その日を聖なるものとされた[a]。その日に、神が創造して行ったすべてのわざを終えて休まれた[b]からである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その日を聖別された」「その日を聖なる日として取り分けられた」。
    reason: lexical_alternative
  - marker: b
    text: 「休まれた」と訳したヘブライ語は、「やめられた」「中止された」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語は直訳に近くは「神が行うために創造した（わざ）」。「創造して造られた」または「創造して行った」と理解することもできる。末尾の表現は解釈が難しい。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 祝福し
  rationale: ピエル形の「祝福を与える」という意味を、現代日本語で自然かつ簡潔に表す。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数動詞と結びつき、創世記1—2章では唯一の神を指すため、日本語の標準的な訳語とした。
- source_word: יוֹם הַשְּׁבִיעִי
  choice: 第七の日
  rationale: 名詞と定冠詞付き序数を素直に反映する。
- source_word: וַיְקַדֵּשׁ אֹתוֹ
  choice: その日を聖なるものとされた
  rationale: 「聖別する」より一般読者に分かりやすく、同時に、その日を聖なるものとして取り分ける結果的意味を保つ。
- source_word: כִּי
  choice: からである
  rationale: 第七の日を祝福し聖なるものとした理由を導く接続詞として自然に表す。
- source_word: בּוֹ
  choice: その日に
  rationale: 先行する「第七の日」を明示し、日本語として自然に読めるようにした。
- source_word: שָׁבַת
  choice: 休まれた
  rationale: 基本義には「やめる、停止する」もあるが、創造物語と安息日の連関を保つ伝統的かつ自然な表現である。疲労の含意を必須とはしない。
- source_word: מִכָּל מְלַאכְתּוֹ
  choice: すべてのわざを
  rationale: מְלָאכָה は仕事・働き・制作のわざを指す。「わざ」は神の創造行為にふさわしく、文体上も自然である。起点を表す מִן の意味は「わざを休む」という日本語の構文に含ませた。
- source_word: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת
  choice: 神が創造し、行われた
  rationale: 語末の不定詞 לַעֲשׂוֹת は構文上難解である。本文では ברא と עשה を一連の創造行為として読みやすく表し、逐語的な形と別解は注に残した。
theological_decisions:
- issue: שָׁבַת と安息日の神学的連関
  choice: 休まれた
  alternative: やめられた／停止された
  rationale: 安息日との語的・神学的連関を保ちつつ、神が疲労したと断定する表現にはしていない。語義上の「やめる」は注で提示する。
- issue: וַיְקַדֵּשׁ אֹתוֹ の表現
  choice: その日を聖なるものとされた
  alternative: その日を聖別された／聖なる日として取り分けられた
  rationale: 聖性という本文の中心概念を保持しながら、教会用語に偏りすぎない明快な現代日本語とした。
- issue: אֲשֶׁר בָּרָא אֱלֹהִים לַעֲשׂוֹת の難解な構文
  choice: 神が創造し、行われた
  alternative: 神が行うために創造された／神が創造して造られた
  rationale: 不定詞の関係を一義的に断定できないため、本文は二つの動詞をまとまりとして自然に訳し、形式的な訳と主要な解釈可能性を注記して曖昧さを開示する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、創造記事にふさわしい簡潔で dignified な文体とした。「聖別」のような専門語は本文で避け、注に残した。難解な末尾句は本文の可読性と原文の二動詞を両立させ、解釈上の幅を注で明示した。
