  text: שֵׁ֥ם הָֽ/אֶחָ֖ד פִּישׁ֑וֹן ה֣וּא הַ/סֹּבֵ֗ב אֵ֚ת כָּל אֶ֣רֶץ הַֽ/חֲוִילָ֔ה אֲשֶׁר שָׁ֖ם הַ/זָּהָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/011.yaml
  text: The name of the first is Pishon; it is the one that goes around all the land of Havilah[a], where there is gold.
translation:
  language: ja
  text: 第一の川の名はピション。それは、金のあるハビラの全域を巡っている[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「巡っている」は「取り囲んでいる」とも訳せる。ヘブライ語は、周囲を回ること、または囲むことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁם הָאֶחָד
  choice: 第一の川の名
  rationale: 直訳的な「一つ目のものの名」では日本語として不自然なため、直前の文脈で四つに分かれた川を数えていることを明示し、「第一の川の名」とした。
- source_word: פִּישׁוֹן
  choice: ピション
  rationale: 川の固有名として、現代日本語で読みやすい形に音写した。
- source_word: הוּא
  choice: それは
  rationale: 先に挙げたピション川を受ける指示語として、原文の再提示を保った。
- source_word: הַסֹּבֵב
  choice: 巡っている
  rationale: סבבの「回る、巡る、取り囲む」という意味範囲を保ちつつ、川について自然な日本語とした。「流れる」は原文に明示されていないため本文には加えなかった。
- source_word: אֵת כָּל אֶרֶץ הַחֲוִילָה
  choice: ハビラの全地を
  rationale: כָּלを「全」で表し、אֶרֶץは固有地名に属する領域として「地」と訳した。ハビラは固有名として音写した。
- source_word: אֲשֶׁר שָׁם הַזָּהָב
  choice: 金のある
  rationale: 関係節の場所を示すשָׁםを、修飾先のハビラとの関係が明瞭になる自然な日本語で表した。定冠詞付きのזָהָבは、ここでは物質としての金を指すため「金」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文にない「流れる」を補わず、川が土地を巡るのか取り囲むのかという語義上の幅は脚注に残した。
