source:
  edition: WLC
  text: וַ/יְצַו֙ יְהוָ֣ה אֱלֹהִ֔ים עַל הָֽ/אָדָ֖ם לֵ/אמֹ֑ר מִ/כֹּ֥ל עֵֽץ הַ/גָּ֖ן אָכֹ֥ל תֹּאכֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/016.yaml
  text: And Yahweh God commanded the man[a], saying[b], “From every tree of the garden you may surely eat.”
translation:
  language: ja
  text: 神であるヤハウェは人に命じて言われた。「園のどの木からでも、あなたは自由に食べてよい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自由に食べてよい」とも訳せる。ヘブライ語では不定詞絶対形を定動詞と重ねて強調している。文脈上は許可を表し、「確かに食べてよい」とも訳せる。
    reason: 原文の強調構文と、能力ではなく許可としてのニュアンスを示すため。
lexical_decisions:
- source_word: וַיְצַו
  choice: 命じて
  rationale: צוהの権威ある指示を、現代日本語で明確かつ自然に表す。
- source_word: יְהוָה אֱלֹהִים
  choice: 神ヤハウェ
  rationale: 神名を音写して保持しつつ、複合呼称を自然な日本語の語順で示す。
- source_word: עַל הָאָדָם
  choice: 人に
  rationale: צוהとともに命令の受け手を示すעַלを助詞「に」で表し、הָאָדָםはこの文脈の個別の人を指すため「人」とした。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 直接話法を導く定型表現。主語への敬意を示しながら、自然な引用導入とした。
- source_word: מִכֹּל עֵץ הַגָּן
  choice: 園のどの木からでも
  rationale: 許可が園のすべての木に及ぶことを、מןとכלの組み合わせに即して自然に表す。
- source_word: אָכֹל תֹּאכֵל
  choice: 自由に食べてよい
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を、文脈上の許可として明瞭に表現する。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 称号への置換を避け、本文にある固有の神名を音写して保持する。
- issue: הָאָדָם の指示対象
  choice: 人
  alternative: 男、人間、人類
  rationale: ここでは園に置かれた一人の人を指し、人類一般ではない。「人」は個人を指せる自然な日本語であり、次節までの文脈にも適合する。
- issue: אָכֹל תֹּאכֵל の法的ニュアンス
  choice: 自由に食べてよい
  alternative: 必ず食べる、存分に食べてよい
  rationale: 形態上の強調は保ちつつ、この文脈では義務や予告ではなく許可を表すため、その点を明示した。
translation_notes:
  register: 平明な現代標準日本語を用い、聖書本文としての品位を保った。「神ヤハウェ」は複合神名を明瞭に示し、「自由に食べてよい」で許可と強調を自然に伝える。
