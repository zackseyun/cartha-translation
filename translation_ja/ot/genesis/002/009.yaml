  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּצְמַ֞ח יְהוָ֤ה אֱלֹהִים֙ מִן הָ֣/אֲדָמָ֔ה כָּל עֵ֛ץ נֶחְמָ֥ד לְ/מַרְאֶ֖ה וְ/ט֣וֹב לְ/מַאֲכָ֑ל וְ/עֵ֤ץ הַֽ/חַיִּים֙ בְּ/ת֣וֹךְ הַ/גָּ֔ן וְ/עֵ֕ץ הַ/דַּ֖עַת ט֥וֹב וָ/רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/009.yaml
  text: And Yahweh God caused to grow from the ground every tree that is pleasant to the sight and good for food[a], and the tree of life in the midst of the garden[b], and the tree of the knowledge of good and evil.
translation:
  language: ja
  text: ヤハウェ神は、大地から、見て好ましく、食べるのによいあらゆる木を生えさせ、また園の中央に命の木を、そして善悪の知識の木を生えさせた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「園の中央に」は、文法上、直前の「命の木」に係る。善悪の知識の木の位置は本文では明示されない。両方の木が園の中央にあったと理解する訳もある。
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וַיַּצְמַח
  choice: 生えさせた
  rationale: צמחのヒフィル形が持つ使役の意味を明確に表す。
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 固有の神名יהוהを音写し、אֱלֹהִיםとの結合も簡潔に保つ。
- source_word: מִן הָאֲדָמָה
  choice: 大地から
  rationale: 植物が生える土壌を指すאֲדָמָהを、文脈に即した自然な日本語で表す。
- source_word: כָּל עֵץ
  choice: あらゆる木
  rationale: 単数集合形とכָּלによる分配的・包括的な意味を保つ。
- source_word: נֶחְמָד לְמַרְאֶה
  choice: 見るに麗しく
  rationale: 外見が喜ばしく魅力的であるという意味を、簡潔で品位ある表現にする。
- source_word: וְטוֹב לְמַאֲכָל
  choice: 食べるのに良い
  rationale: 食物として良いというヘブライ語の関係を明瞭に表す。
- source_word: וְעֵץ הַחַיִּים
  choice: 命の木
  rationale: 構文を透明に保つ定着した訳語。
- source_word: בְּתוֹךְ הַגָּן
  choice: 園の中央には
  rationale: בְּתוֹךְの位置的意味を自然な現代日本語で表す。
- source_word: וְעֵץ הַדַּעַת טוֹב וָרָע
  choice: 善悪の知識の木
  rationale: 解釈を限定せず、神学的に重要な原語の連語を字義的に保つ。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文に記された固有名を音写し、一般名詞や称号への置換を避ける。
- issue: 「善悪の知識」の意味
  choice: 字義的な句をそのまま保つ
  alternative: 道徳的識別、成熟、包括的知識
  rationale: 何を意味するかについて解釈が分かれるため、本文では一つの解釈に限定しない。
- issue: 二本の木の統語的位置づけ
  choice: 園の中央を二本の木にかかるように訳す
  alternative: 園の中央を命の木だけにかける
  rationale: ヘブライ語の語順では「園の中央」が直前の「命の木」に結びつき得る一方、後続の知識の木との位置関係は明示されない。この訳では自然な日本語として二本をまとめたが、曖昧さを注で示す。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、創世記の荘重さに合うよう「見るに麗しく」を用いた。「善悪の知識」は解釈的に言い換えず、原文の緊張を保持した。
