id: GEN.2.18
reference: Genesis 2:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ יְהוָ֣ה אֱלֹהִ֔ים לֹא ט֛וֹב הֱי֥וֹת הָֽ/אָדָ֖ם לְ/בַדּ֑/וֹ אֶֽעֱשֶׂהּ לּ֥/וֹ עֵ֖זֶר כְּ/נֶגְדּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/018.yaml
  text: Then Yahweh God said[a], “It is not good for the man to be alone. I will make a helper corresponding to him.”
translation:
  language: ja
  text: そして、ヤハウェ神は言われた。「人がひとりでいるのは良くない。わたしは彼のために、彼に対応する助け手を造ろう。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼にふさわしい助け手」「彼に合う助け手」「彼と釣り合う助け手」とも訳せる。ヘブライ語の表現は、単に下位の補助者というより、彼と向かい合い、対応する者を示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 神名יהוהを称号に置き換えず「ヤハウェ」と音写し、אלהיםを「神」と訳して両者を保った。
- source_word: וַיֹּאמֶר
  choice: そして、…は言われた
  rationale: 物語を進める接続を「そして」で表し、神の発言には現代日本語として自然な敬語を用いた。
- source_word: לֹא טוֹב הֱיוֹת הָאָדָם לְבַדּוֹ
  choice: 人がひとりでいるのは良くない
  rationale: 評価表現「良くない」を弱めず、定冠詞付きהאדםは、この場面の特定の人を指しつつ日本語で過度に男性性を補わない「人」とした。
- source_word: אֶעֱשֶׂה־לּוֹ
  choice: わたしは彼のために…造ろう
  rationale: 一人称未完了形が示す神の意向を「造ろう」で表し、לוの受益的関係を「彼のために」とした。
- source_word: עֵזֶר
  choice: 助け手
  rationale: 単なる抽象的な「助け」ではなく、助けを与える者を指す名詞として訳した。この語自体は地位の上下を意味しない。
- source_word: כְּנֶגְדּוֹ
  choice: 彼に対応する
  rationale: 向かい合い、釣り合い、対応する関係を保持し、「ふさわしい」だけでは見えにくい相応関係を表した。
theological_decisions:
- issue: הָאָדָםの文脈的な指示
  choice: 人
  alternative: 男、人間
  rationale: 文脈上は園に置かれた特定の男性を指すが、この節の語形自体は一般名詞「人」であるため、本文では「人」とし、続く代名詞で個人性を示した。
- issue: עֵזֶר כְּנֶגְדּוֹに上下関係を読み込む可能性
  choice: 彼に対応する助け手
  alternative: 彼にふさわしい助け手、彼に合う助け手、彼と向かい合う助け手
  rationale: 原文は助けと対応関係を述べるが、劣位または優位を明示しない。その緊張を解消せずに残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ひとり」は読みやすさのため平仮名とし、神名は「ヤハウェ」と表記した。脚注記号は注釈対象となる文末に置いた。
