base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/022.yaml
  text: And the rib that the LORD God had taken from the man, he built into a woman, and he brought her to the man.
translation:
  language: ja
  text: 神である主は、人から取ったあばら骨†から女を造り上げ、その女を人のもとに連れて来られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 造り上げ
  rationale: 基本義は「建てる、築く」。女の創造について用いられた建築的な表現を保ちつつ、現代日本語として自然にした。
- source_word: יְהוָה אֱלֹהִים
  choice: 神である主
  rationale: 神名YHWHを日本語聖書の慣用に従って「主」とし、אֱלֹהִיםとの結合を明瞭に表した。
- source_word: הַצֵּלָע
  choice: あばら骨
  rationale: 語には「脇、側面」の意味もあるが、この文脈で伝統的かつ具体的な身体部位を指す理解を本文に採用した。
- source_word: הָאָדָם
  choice: 人
  rationale: 固有名「アダム」ではなく、定冠詞を伴う普通名詞として訳した。
- source_word: לְאִשָּׁה
  choice: 一人の女に
  rationale: 結果を表すלְを「〜に」とし、אִשָּׁהをこの段階では関係上の「妻」と限定せず「女」とした。
- source_word: וַיְבִאֶהָ
  choice: その女を…連れて来られた
  rationale: 女性単数目的語を日本語で明示し、敬語は主語が神であることに対応する穏当な尊敬表現とした。
theological_decisions:
- issue: צֵלָעが指すもの
  choice: 本文では「あばら骨」
  alternative: 「脇」「体の一部」
  rationale: 語彙上の幅は認められるが、直前の肉でふさぐ描写と受容史を踏まえ「あばら骨」を採用した。
- issue: וַיִּבֶןの創造表現
  choice: 「造り上げ」
  alternative: 「造った」「築き上げた」
  rationale: 通常の創造動詞に平板化せず、「建てる」という原語の比喩を日本語として理解可能な形で残した。
- issue: אִשָּׁהの関係的意味
  choice: 「女」
  alternative: 「妻」
  rationale: 婚姻関係は続く文脈で展開するため、この節では性別を示す語として訳し、解釈を先取りしない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。語順は日本語として整えながら、原文の「取る―造り上げる―連れて来る」という動作の連鎖を保持した。
