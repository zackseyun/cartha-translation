  text: וְ/אֵ֖ד יַֽעֲלֶ֣ה מִן הָ/אָ֑רֶץ וְ/הִשְׁקָ֖ה אֶֽת כָּל פְּנֵֽי הָֽ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/006.yaml
  text: But a mist would rise from the earth and water the whole surface of the ground[a].
translation:
  language: ja
  text: しかし、霧[a]が地から立ち上って、地面全体を潤していた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「湧き水」または「水の流れ」。このヘブライ語は用例が少なく、空中の霧ではなく、地から湧き出る水を指す可能性もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵד
  choice: しかし、霧
  rationale: וְ は前節の「雨を降らせていなかった」との対照を示すため「しかし」とした。稀な語 אֵד は、地から「立ち上る」という動詞に自然に合う伝統的な理解に従い「霧」としたが、語義の不確かさは脚注に残した。
- source_word: יַעֲלֶה
  choice: 立ち上り
  rationale: עלה の基本的な上昇の意味を表す。未完了形は過去の情景における反復的・継続的な作用として、後続の「潤していた」と合わせて表現した。
- source_word: מִן הָ/אָ֑רֶץ
  choice: 地から
  rationale: אֶרֶץ は創造物語の広い文脈で「地」を指す。同節の אֲדָמָה との語の違いも保った。
- source_word: וְ/הִשְׁקָה
  choice: 潤していた
  rationale: שקה の使役形は「水を与える、潤す」の意。日本語では「地面を潤す」が自然であり、過去の反復的・継続的な情景も表せる。
- source_word: אֶת כָּל פְּנֵי
  choice: 全面を
  rationale: 直訳的な「すべての面」を、空間的な広がりを保ちながら自然な現代日本語にした。
- source_word: הָֽ/אֲדָמָֽה
  choice: 地面
  rationale: אֲדָמָה は土壌・耕作地となる地面を指し得る。前の אֶרֶץ「地」と区別しつつ、狭すぎる「土壌」を避けた。
theological_decisions:
- issue: אֵד の解釈
  choice: 霧
  alternative: 湧き水、または水の流れ
  rationale: この語は稀で語義が確定しない。「立ち上る」という上向きの動きに合う「霧」を本文に採ったが、地中から湧き出て地を潤す水を指す可能性も脚注に明記し、創造時の水のあり方を断定しすぎないようにした。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「地」と「地面」を使い分けて原語の אֶרֶץ と אֲדָמָה の区別を示し、未完了形の情景描写は「潤していた」で自然に表した。
