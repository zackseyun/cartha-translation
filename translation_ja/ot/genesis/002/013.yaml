  text: וְ/שֵֽׁם הַ/נָּהָ֥ר הַ/שֵּׁנִ֖י גִּיח֑וֹן ה֣וּא הַ/סּוֹבֵ֔ב אֵ֖ת כָּל אֶ֥רֶץ כּֽוּשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/013.yaml
  text: And the name of the second river was Gihon[b][a]; it is the one that goes around all the land of Cush.
translation:
  language: ja
  text: 第二の川の名はギホンである。それはクシュ[b]の全土を巡る川である。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「クシュの全土を取り囲むもの」。
    reason: lexical_alternative
  - marker: b
    text: 「クシュ」は古代の地名で、伝統的にはエジプトより南の地域と関連づけられている。ここではヘブライ語の地名をそのまま音写した。
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם הַ/נָּהָר הַ/שֵּׁנִי
  choice: 第二の川の名は
  rationale: 接続詞וְは前節からの叙述の継続を示すが、日本語では文脈上明らかなため、あえて「そして」を置かず自然なつながりとした。נָהָרは「川」、הַשֵּׁנִיは「第二の」とした。
- source_word: גִּיחוֹן
  choice: ギホン
  rationale: 固有名詞として、ヘブライ語名を日本語で音写した。
- source_word: הוּא הַ/סּוֹבֵב
  choice: それは…を巡る川である
  rationale: הוּאによる指示・同定と、סבבの分詞が示す継続的な描写を、明瞭で自然な日本語にした。「巡る」は「周囲を通る」と「取り囲む」の両義をある程度保つ。
- source_word: אֵת כָּל אֶרֶץ כּוּשׁ
  choice: クシュの全土を
  rationale: כָּל אֶרֶץを「全土」と簡潔に訳し、כּוּשׁは後代の特定地域名に置き換えず古代の地名として音写した。
