id: GEN.2.19
reference: Genesis 2:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים מִן הָֽ/אֲדָמָ֗ה כָּל חַיַּ֤ת הַ/שָּׂדֶה֙ וְ/אֵת֙ כָּל ע֣וֹף הַ/שָּׁמַ֔יִם וַ/יָּבֵא֙ אֶל הָ֣/אָדָ֔ם לִ/רְא֖וֹת מַה יִּקְרָא ל֑/וֹ וְ/כֹל֩ אֲשֶׁ֨ר יִקְרָא ל֧/וֹ הָֽ/אָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/019.yaml
  text: Yahweh God formed from the ground every wild animal and every bird of the sky[a], and he brought them to the man to see what he would call them. Whatever the man called each living creature[b], that was its name.
translation:
  language: ja
  text: ヤハウェである神は、土から野のあらゆる動物と空のあらゆる鳥を形造り[a]、人のもとへ連れて来て、その人がそれらを何と呼ぶかを見るためにそうされた。人がそれぞれの生き物を何と呼んでも、それがその名となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上、「すでに形造っておられ」とも訳せる。ヘブライ語の動詞形自体は、単純な過去と過去完了を明確に区別していない。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּצֶר
  choice: 形造り
  rationale: 材料に形を与えて造るという יצר の意味を自然な現代日本語で表した。ヘブライ語の物語叙述形は通常、出来事を順に述べるが、それ自体は過去完了を明示しないため、本文では時制関係を過度に限定しない連用形とした。
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 固有の神名 יהוה を「ヤハウェ」と音写し、אֱלֹהִים を「神」とした。
- source_word: מִן הָאֲדָמָה
  choice: 土から
  rationale: אֲדָמָה は地面または土を指す。ここでは、人が土から造られたという直前の記述との語のつながりが伝わる「土」を選んだ。
- source_word: כָּל חַיַּת הַשָּׂדֶה
  choice: 野のあらゆる動物
  rationale: חַיַּת הַשָּׂדֶה の字義的な領域表現を保ち、「野にいる動物」という意味が分かる簡潔な表現とした。「野生動物」よりも原文の「野」との結び付きを明示できる。
- source_word: כָּל עוֹף הַשָּׁמַיִם
  choice: 空のあらゆる鳥
  rationale: עוֹף は飛ぶ生き物を広く指し得るが、ここでは通常の「鳥」が自然である。הַשָּׁמַיִם はこの文脈では「空」とした。
- source_word: וַיָּבֵא אֶל הָאָדָם
  choice: 人のところへ連れて来て
  rationale: 目的語は直前の動物と鳥から補われる。「連れて来る」は生き物を伴って来る場面に自然であり、הָאָדָם は定冠詞付きの普通名詞として「人」とした。
- source_word: לִרְאוֹת מַה יִּקְרָא לוֹ
  choice: その人がそれらを何と呼ぶかを見ることにされた
  rationale: לִרְאוֹת の目的用法と קרא の「呼ぶ」という反復を保った。神についての表現として自然な敬意を示しつつ、原文の「見る」を「確かめる」などに解釈し直さないようにした。
- source_word: וְכֹל אֲשֶׁר יִקְרָא לוֹ הָאָדָם נֶפֶשׁ חַיָּה
  choice: 人がそれぞれの生き物を何と呼んでも
  rationale: כֹל אֲשֶׁר の包括的・分配的な意味を「それぞれ」「何と…ても」で表した。נֶפֶשׁ חַיָּה はこの文脈では「生き物」であり、「魂」という後代の神学的含意を持ち込まない。
- source_word: הוּא שְׁמוֹ
  choice: それがその生き物の名となった
  rationale: 原文の無動詞文が示す命名の成立を、自然な日本語で表した。「その生き物」を補って指示対象を明瞭にした。
theological_decisions:
- issue: וַיִּצֶר と創世記1章の創造順序との時間関係
  choice: 本文では「形造り」とし、単純な物語叙述として訳す
  alternative: 「すでに形造っておられ」と過去の先行動作を明示する
  rationale: ヘブライ語の wayyiqtol は通常、物語を進める形だが、文脈により先行動作を表すこともあり得る。本文では形態上明示されない過去完了を加えず、可能な文脈理解を脚注に残した。
- issue: הָאָדָם を普通名詞と固有名のどちらで訳すか
  choice: 人
  alternative: アダム
  rationale: 定冠詞付きの הָאָדָם は字義的には「その人」であり、直前の אֲדָמָה（土）との語の響きも保たれている。この段階で固有名に限定せず、伝統的な読みを脚注に示した。
- issue: 神が人の命名を見るという表現
  choice: 何と呼ぶかを見ることにされた
  alternative: 何と呼ぶかを確かめるため
  rationale: 原文の לִרְאוֹת（見る）をそのまま保ち、神の知識について本文が説明していない事柄を補わないようにした。日本語では敬意を示す表現に整えた。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。動物の命名を描く簡潔な物語調を維持し、神名は「ヤハウェ」と音写した。原文の反復（「呼ぶ」）と、「土」「人」の文脈上のつながりをできる限り保持した。
