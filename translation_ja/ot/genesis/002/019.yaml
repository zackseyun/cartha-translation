revisions:
- from: ヤハウェ神は、土から野のあらゆる動物と空のあらゆる鳥を形造り[a]、人[b]のところへ連れて来て、その人がそれらを何と呼ぶかを見ることにされた。人がそれぞれの生き物を何と呼んでも、それがその生き物の名となった。
  to: ヤハウェである神は、土から野のあらゆる動物と空のあらゆる鳥を形造り[a]、人のもとへ連れて来て、その人がそれらを何と呼ぶかを見るためにそうされた。人がそれぞれの生き物を何と呼んでも、それがその名となった。
  rationale: 原文の目的表現「見るため」を直接訳し、「見ることにされた」が加えていた決定の含意を除いた。「ヤハウェ神」を、神名と神の呼称を自然に結ぶ「ヤハウェである神」に改めた。なお、脚注bは本文中の「人」に対応するため、本文の当該語にアンカーを付す必要がある。
