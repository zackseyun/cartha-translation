  naturalness: 「ヤハウェ神」は現代標準日本語の複合神名としてやや不自然であり、「ヤハウェである神」が明瞭で自然である。また、「何と呼ぶかを見るため」とすれば目的表現が自然で、原文にもより近い。
  terminology: 「土」「野のあらゆる動物」「空のあらゆる鳥」「生き物」はいずれも適切である。הָאָדָם は本文では普通名詞として「人」とし、脚注で「アダム」の可能性を示す方針を維持できる。神名は音写を保ちつつ、日本語として自然な「ヤハウェである神」に改める。
