source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ הָֽ/אָדָם֒ זֹ֣את הַ/פַּ֗עַם עֶ֚צֶם מֵֽ/עֲצָמַ֔/י וּ/בָשָׂ֖ר מִ/בְּשָׂרִ֑/י לְ/זֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵ/אִ֖ישׁ לֻֽקֳחָה זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/023.yaml
  text: Then the man said[a], “This at last is bone of my bones and flesh of my flesh; this one will be called woman[b], because from man she was taken.”
translation:
  language: ja
  text: 'そこで、その人は言った。


    「ついに[a]、この者こそ、


    私の骨の骨、


    私の肉の肉。


    この者は『女』と呼ばれる[b]。


    男から取られたこの者だから。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「今回は」または「この時こそ」。
    reason: 原文のזֹאת הַפַּעַםが持つ字義と、文脈上の感嘆的な意味の幅を示すため。
  - marker: b
    text: ヘブライ語の「女」（イッシャー）と「男」（イーシュ）は音がよく似ており、ここでは語呂合わせになっている。
    reason: 日本語では再現できない、命名の根拠となる原文の音の結び付きを伝えるため。
lexical_decisions:
- source_word: הָאָדָם
  choice: その人
  rationale: אָ דָםを文脈上の特定の男性として指しつつ、後半のאִישׁ（男）とは別の語であることも保つ。
- source_word: זֹאת הַפַּעַם
  choice: ついに、この者こそ
  rationale: 字義的な「今回は」よりも、ここでの発見と成就を表す感嘆を自然な日本語で示し、זֹאתの指示と強調も「この者こそ」で表した。
- source_word: עֶצֶם מֵעֲצָמַי
  choice: 私の骨からの骨
  rationale: 起源を示すמִןを「から」で明示し、直後の肉との並行も保った。
- source_word: וּבָשָׂר מִבְּשָׂרִי
  choice: 私の肉からの肉
  rationale: 前句と同じ構文にして、מִןの由来・分離のイメージと詩的並行を保った。
- source_word: לְזֹאת יִקָּרֵא אִשָּׁה
  choice: この者は『女』と呼ばれる
  rationale: 指示語の強調と、קראのニファル形による受動的な命名表現を保持した。
- source_word: כִּי מֵאִישׁ לֻקֳחָה זֹּאת
  choice: 男から取られた者だから
  rationale: כִּיの理由を示す働き、מִןの起点、女性単数受動形の意味を自然な日本語で表した。
theological_decisions:
- issue: הָאָדָםの訳し分け
  choice: その人
  alternative: その男
  rationale: この人物が男性であることは後半から明らかだが、原文はここでאִישׁではなくאָדָםを用いる。「その人」は両語の区別を不必要に消さず、文脈上の特定人物も示せる。
- issue: אִשָּׁה／אִישׁの語呂合わせ
  choice: 本文では「女／男」と訳し、脚注で原語の音の類似を説明する
  alternative: 日本語に別の語呂合わせを作る
  rationale: 日本語では原文の音の対応を自然に再現できないため、造語や意味の狭い「妻／夫」を持ち込まず、意味を正確に訳して文学的効果を注記する。
- issue: זֹאת הַפַּעַםの含意
  choice: ついに
  alternative: 今回は／今度こそ
  rationale: この句は字義的には「この時・今回は」だが、文脈では待望の相手を認める感嘆として理解できる。本文は自然な感嘆を採り、字義的な可能性を脚注に残した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、詩的な三行構成と命名宣言の厳かさを保った。「この者」を反復して原文の指示語を表し、「骨からの骨／肉からの肉」の並行を明確にした。
