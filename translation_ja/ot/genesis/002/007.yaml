id: GEN.2.7
reference: Genesis 2:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּיצֶר֩ יְהוָ֨ה אֱלֹהִ֜ים אֶת הָֽ/אָדָ֗ם עָפָר֙ מִן הָ֣/אֲדָמָ֔ה וַ/יִּפַּ֥ח בְּ/אַפָּ֖י/ו נִשְׁמַ֣ת חַיִּ֑ים וַֽ/יְהִ֥י הָֽ/אָדָ֖ם לְ/נֶ֥פֶשׁ חַיָּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/007.yaml
  text: Then Yahweh God formed the man from the dust of the ground[a], and breathed into his nostrils the breath of life[b], and the man became a living creature.
translation:
  language: ja
  text: そこで、神であるヤハウェは、土のちりから人[a]を形造り、その鼻に命の息を吹き込んだ。すると、人は生きるもの[b]となった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「人」はアーダーム、「土」はアダーマーで、両語の響きが対応している。
    reason: wordplay
  - marker: b
    text: 別訳「生きた存在」。伝統的には「生きた魂」。ここでいう「生きるもの」は、人全体が生命ある存在となったことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 固有の神名と一般的な称号を区別しつつ、ヘブライ語の語順に従って一続きの呼称として訳した。
- source_word: וַיִּיצֶר
  choice: 形造り
  rationale: 陶工が素材を形作るような具体的なイメージを保ち、現代日本語としても自然な表現を選んだ。
- source_word: הָאָדָם
  choice: 人
  rationale: ここでは神によって形造られた一人の人を指す。「男」と限定しすぎず、同時に「人類」という抽象的な集合概念にも置き換えない表現とした。
- source_word: עָפָר מִן־הָאֲדָמָה
  choice: 大地のちりで
  rationale: 素材を表す עָפָר と、その由来を表す אֲדָמָה を簡潔に示す。「で」によって、人がその素材から形造られたことを自然な日本語で表した。
- source_word: בְּאַפָּיו
  choice: その鼻に
  rationale: 身体的で具体的な描写を保つ。日本語では「鼻の穴に」よりも「鼻に」が自然で、原文の意味を十分に伝える。
- source_word: נִשְׁמַת חַיִּים
  choice: 命の息
  rationale: חַיִּים の慣用的な意味を保ち、神から与えられる生命の息を簡潔に表した。
- source_word: וַיְהִי ... לְ
  choice: すると、…となった
  rationale: ある状態への移行を表す構文を訳し、物語の結果関係も明確にした。
- source_word: לְנֶפֶשׁ חַיָּה
  choice: 生きるもの
  rationale: נֶפֶשׁ を身体と別個の非物質的な「魂」に限定せず、生命ある存在全体を指す表現とした。この句が動物にも用いられる語法にも対応する。
theological_decisions:
- issue: הָאָדָם の個別性と人類代表性
  choice: 人
  alternative: 男／人間／人類
  rationale: 文脈上は神が形造った一個人を指すが、この箇所だけで男性性を前面に出す必要はない。「人」は個別の人物と人間一般への広がりを両方保てる。
- issue: לְנֶפֶשׁ חַיָּה の理解
  choice: 生きるもの
  alternative: 生きた存在／生きた魂
  rationale: 原文は、人が身体とは別の魂を受け取ったとは述べず、人そのものが生命ある存在になったと描く。「生きるもの」はその全体性と、語句が持つ動物を含む語義範囲を保つ。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 固有名を一般称号に置き換えず、原文にある神名を明示する。発音の完全な確実性はないが、「ヤハウェ」は学術的に広く用いられる慣用表記である。
translation_notes:
  register: 明快な現代標準日本語を用いながら、創造の場面にふさわしい簡潔で荘重な調子を保った。「吹き込まれた」は神を主語とする敬語的な文体ではなく、現代の聖書文体で自然な尊敬表現として採用した。
