  text: וַ/יְכַ֤ל אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מְלַאכְתּ֖/וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַ/יִּשְׁבֹּת֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י מִ/כָּל מְלַאכְתּ֖/וֹ אֲשֶׁ֥ר עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/002.yaml
  text: By the seventh day God had finished his work that he had done[a], and he rested on the seventh day from all his work that he had done.
translation:
  language: ja
  text: 第七日までに、神は、ご自分がなさった仕事をすべて終えられた[a]。第七日には、ご自分がなさったすべての仕事をやめて、休まれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「第七日に、神はご自分がなさった仕事を終えられた」。ヘブライ語はこのようにも訳せるが、本文の「第七日までに」は文脈から考えられる意味を表している。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְכַל
  choice: 終えられた
  rationale: כלהは「完了する、終える」を意味する。文脈上、創造の仕事が第七日までに完了していたことを自然な日本語で表した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この箇所では単数動詞を伴い、唯一の神を指すため、標準的に「神」とした。
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: 第七日までに／第七日には
  rationale: 同じヘブライ語句を、第一節では仕事の完了時点を文脈に即して「第七日までに」、第二節では休んだ日を「第七日には」と訳した。第一節の字義的な訳は脚注に残した。
- source_word: מְלַאכְתּוֹ
  choice: なさっていた仕事
  rationale: מְלָאכָהの一般的な意味である「仕事」を用い、所有接尾辞と関係節を日本語として自然な「なさっていた」にまとめた。
- source_word: אֲשֶׁר עָשָׂה
  choice: なさっていた
  rationale: עשהの広い意味を保ち、物を製作することだけに狭めない表現とした。
- source_word: וַיִּשְׁבֹּת
  choice: やめて休まれた
  rationale: שבתの基本義である「やめる、停止する」と、この文脈で定着した「休む」の両面を表した。疲労回復を必要としたという含意は持たせていない。
- source_word: מִכָּל
  choice: すべての仕事をやめて
  rationale: 仕事の全体から離れて停止したことが明瞭になるよう、日本語の自然な目的語構文で表した。
theological_decisions:
- issue: 神が第七日にも創造の仕事をしていたことを本文が示すか
  choice: 「第七日までに」とし、その日が来るまでに仕事が完了していたという文脈上の意味を本文に示した。
  alternative: 字義どおり「第七日に、神は……仕事を終えられた」と訳すこともできる。
  rationale: 第一の句を字義的に訳すと、続く「第七日には……休まれた」と緊張が生じ得る。曖昧さを隠さないため字義的な形を脚注に示しつつ、本文では文脈上もっとも自然な時間関係を表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「御業」のような教会語を避けて「仕事」としつつ、神の動作には「終えられた」「休まれた」を用いて、自然で品位ある語調を保った。
