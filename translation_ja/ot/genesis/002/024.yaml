base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/024.yaml
  text: Therefore a man shall leave his father and his mother and cling to his wife[b][a], and they shall become one flesh.
translation:
  language: ja
  text: それゆえ、男は父と母を離れ、妻に固く結びつき[a]、二人は一つの肉となる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「妻に堅くつく」「妻と結びつく」。ヘブライ語の動詞は、強く付着し、固く結びつくことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「一つの肉」は、身体的な結合と、新しい親族の結びつきが形作られることを含むヘブライ語の表現。
    reason: cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: それゆえ
  rationale: 直前の創造の物語を根拠とする帰結を示す。現代日本語として明快で、説明的・推論的な力を保つ。
- source_word: יַעֲזָב
  choice: 離れ
  rationale: ここでは一般的・規範的な原則を表す。現代日本語の「離れる」は、親を見捨てるという過度に強い意味を避けつつ、新しい家庭形成を示す。
- source_word: אִישׁ
  choice: 男
  rationale: 原文の男性単数を保持する。文脈上、結婚する男性を代表的に指している。
- source_word: אָבִיו וְאִמּוֹ
  choice: 父と母
  rationale: 原文は両親を一語にまとめず、父と母をそれぞれ明示しているため、その形を保つ。所有関係は日本語では文脈上明白なので「自分の」を補わない。
- source_word: וְדָבַק
  choice: 固く結ばれ
  rationale: 強い付着・結合を表す語義を自然な現代日本語で示す。単なる同居や弱い関係ではなく、揺るがない結びつきを伝える。
- source_word: בְּאִשְׁתּוֹ
  choice: 妻と
  rationale: この文脈の אִשָּׁה は単なる「女」ではなく「妻」を意味する。前置詞 בְּ の結合対象としての働きは助詞「と」で自然に表した。
- source_word: וְהָיוּ לְבָשָׂר אֶחָד
  choice: 二人は一つの肉となる
  rationale: 複数形の動詞が男と妻を受けるため、日本語では「二人」を明示した。「一つの肉」は身体的結合と新たな親族的結合の双方を含み得る原文の比喩を保つ。
theological_decisions:
- issue: 結婚の定式における性別を明示した代表表現
  choice: 男
  alternative: 人／一人の者
  rationale: 原文は男性単数 אִישׁ を用いているため、中性化せずに保持した。
- issue: 文の性質
  choice: 一般的・規範的な原則として、現在形の「離れ…となる」で表現
  alternative: 直接命令として「離れなければならない」とする／過去の慣習として描写する
  rationale: ヘブライ語の未完了形は、ここで創造物語に基づく一般原則を示す。日本語では明示的な命令を加えず、格言的な現在形でその力を保った。
- issue: 「一つの肉」の意味範囲
  choice: 比喩をそのまま保持する
  alternative: 「一つの体」または「一つの家族」と解釈して訳す
  rationale: 身体的結合と新たな親族的結合を含む表現であり、いずれか一方に限定しないため。
translation_notes:
  register: 明快な現代標準日本語を用いながら、創造物語にふさわしい簡潔で格調ある文体とした。「一つの肉」はやや非日常的だが、原文の比喩と神学的緊張を解消せずに保つため採用し、脚注で説明した。
