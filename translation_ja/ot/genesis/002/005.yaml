id: GEN.2.5
reference: Genesis 2:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כֹ֣ל שִׂ֣יחַ הַ/שָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָ/אָ֔רֶץ וְ/כָל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהוָ֤ה אֱלֹהִים֙ עַל הָ/אָ֔רֶץ וְ/אָדָ֣ם אַ֔יִן לַֽ/עֲבֹ֖ד אֶת הָֽ/אֲדָמָֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/005.yaml
  text: No shrub of the field was yet on the earth[a], and no plant of the field had yet sprung up, because Yahweh God had not caused it to rain on the earth[c][b], and there was no man to work the ground.
translation:
  language: ja
  text: 野の灌木はまだ地上になく[a]、野の草もまだ芽を出していなかった。ヤハウェ[b]神が地上に雨を降らせておらず、土地を耕す人[c]もいなかったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「灌木」は「低木」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「ヤハウェ」は、ヘブライ語の神名יהוה（YHWH）の音写。伝統的に「主」と訳される。
    reason: alternative_reading
  - marker: c
    text: 「土地を耕す人」は、「土を耕す人間」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂיחַ הַשָּׂדֶה
  choice: 野の灌木
  rationale: שִׂיחַを木本性の低い植物である「灌木」とし、次のעֵשֶׂבとの語義上の区別を保った。הַשָּׂדֶהは文脈に即して「野の」とした。
- source_word: טֶרֶם יִהְיֶה בָאָרֶץ
  choice: まだ地上になく
  rationale: טֶרֶםの「まだ……ない」という未発生・未存在の意味と、בָאָרֶץの広い創造世界における所在を自然な日本語で表した。
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: 野の草
  rationale: עֵשֶׂבは草本性の植物を広く指すため「草」とし、「灌木」との対比を保った。
- source_word: טֶרֶם יִצְמָח
  choice: まだ芽を出していなかった
  rationale: צמחの芽生える、伸び出るという動きを明示し、טֶרֶםの未発生を表した。
- source_word: כִּי
  choice: からである
  rationale: 前半の状態に対する理由を導く因果関係を、現代日本語で明確に示した。
- source_word: הִמְטִיר
  choice: 雨を降らせておらず
  rationale: מטרのヒフィル形が持つ使役の意味を「降らせる」で保持した。
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 固有の神名יהוהを称号に置き換えず「ヤハウェ」と音写し、אֱלֹהִיםを「神」とした。
- source_word: וְאָדָם אַיִן
  choice: 人もいなかった
  rationale: ここでのאָדָםは土地を耕す人間を代表単数で指す。「人」は性別を不必要に限定せず、単数的な表現も保つ。
- source_word: לַעֲבֹד אֶת הָאֲדָמָה
  choice: 土地を耕す
  rationale: 農耕文脈でעבדを「耕す」とし、אֲדָמָהを耕作対象となる「土地」とした。
- source_word: הָאָרֶץ / הָאֲדָמָה
  choice: 地上 / 土地
  rationale: אֶרֶץが示す広い世界と、אֲדָמָהが示す人の働きかける土壌・土地との区別を訳し分けた。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文が固有名יהוהを用いるため、その固有名としての性格を保つ一般的な学術的音写を採用した。正確な古代発音には不確かさがある。
- issue: אָדָםの指示範囲
  choice: 人
  alternative: 「人間」または「男」
  rationale: この箇所では特定の性別を明示するより、土地を耕す人間の不在が焦点である。続く物語とのつながりを損なわず、語の包括的な用法も保つため「人」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、創造物語にふさわしい簡潔で落ち着いた文体とした。原文の二つの未存在節を前半に置き、後半を「からである」で結んで因果構造を明示した。
