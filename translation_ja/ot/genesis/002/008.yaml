id: GEN.2.8
reference: Genesis 2:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּטַּ֞ע יְהוָ֧ה אֱלֹהִ֛ים גַּן בְ/עֵ֖דֶן מִ/קֶּ֑דֶם וַ/יָּ֣שֶׂם שָׁ֔ם אֶת הָֽ/אָדָ֖ם אֲשֶׁ֥ר יָצָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/008.yaml
  text: And Yahweh God planted a garden in Eden[a], in the east, and there he put the man whom he had formed.
translation:
  language: ja
  text: ヤハウェである神は、東方のエデンに[a]園を植え、ご自分が形造ったその人をそこに置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「東の方に向けて」。ヘブライ語の表現は、場所（「東方に」）とも、方向や向きとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: 植え
  rationale: נטעの基本的な意味である「植える」を保ち、園が植栽によって設けられたという原文の具体的な表現を伝える。
- source_word: יְהוָה אֱלֹהִים
  choice: ヤハウェ神
  rationale: 固有の神名יהוהを「ヤハウェ」と音写し、אֱלֹהִיםを「神」と訳して複合呼称をそのまま示す。
- source_word: גַּן
  choice: 園
  rationale: 囲われ、植栽された場所を表す語であり、創世記の文脈にふさわしい明瞭で簡潔な訳語。
- source_word: בְעֵדֶן
  choice: エデンに
  rationale: עֵדֶןはここでは地名なので「エデン」と音写し、前置詞בְּを「に」で表す。
- source_word: מִקֶּדֶם
  choice: 東方の
  rationale: 場所を示す表現と理解し、園の所在地を自然な日本語で示す。ただし方向・向きを表す可能性も脚注に残す。
- source_word: וַיָּשֶׂם שָׁם
  choice: そこに置いた
  rationale: שׂיםの一般的な意味「置く」と、場所を指すשָׁם「そこに」を簡潔に再現する。
- source_word: הָאָדָם
  choice: その人
  rationale: 定冠詞付き単数で、直前に形造られた特定の人を指す。「その人」は物語上の照応を明確にしつつ、日本語で自然である。
- source_word: אֲשֶׁר יָצָר
  choice: ご自分が形造った
  rationale: יצרの「形造る、形作る」という造形の含意を保つ。主語がヤハウェ神であることを日本語として明確にするため「ご自分が」とした。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に記された固有の契約名を一般的な学術的音写「ヤハウェ」で明示し、称号への置換を避ける。
- issue: הָאָדָםの指示対象
  choice: その人
  alternative: その男、人間
  rationale: ここでは人類一般ではなく、神がすでに形造った特定の一人を指す。「その人」は性別を不必要に強調せず、定冠詞と文脈上の特定性を表せる。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「ヤハウェ神」「形造った」により聖書本文としての品位と原文の語感を保った。「園を植え」は日常語としてはやや特徴的だが、原文の具体的な動詞を保持するため採用した。
