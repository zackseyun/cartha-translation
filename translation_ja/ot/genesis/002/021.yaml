source:
  edition: WLC
  text: וַ/יַּפֵּל֩ יְהוָ֨ה אֱלֹהִ֧ים תַּרְדֵּמָ֛ה עַל הָ/אָדָ֖ם וַ/יִּישָׁ֑ן וַ/יִּקַּ֗ח אַחַת֙ מִ/צַּלְעֹתָ֔י/ו וַ/יִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽ/נָּה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/021.yaml
  text: So Yahweh God caused a deep sleep to fall upon the man[a], and he slept; then he took one of his ribs and closed up the flesh in its place.
translation:
  language: ja
  text: そこで、主なる神はその男を深い眠りに陥らせた。彼が眠っている間に、彼のあばら骨の一つを取り[a]、その箇所を肉でふさいだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼の脇（側面）の一部」。ヘブライ語は「あばら骨」のほか、「脇」や「側面」を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפֵּל ... תַּרְדֵּמָה
  choice: 深く眠らせた
  rationale: 使役形と「深い眠り」の意味を、自然な現代日本語の使役表現で伝える。
- source_word: יְהוָה אֱלֹהִים
  choice: 神である主
  rationale: 神名を「主」とし、אֱלֹהִיםとの結合を明瞭で自然な日本語にした。
- source_word: הָאָדָם
  choice: その人
  rationale: 文脈上は特定の男性を指すが、この段階の呼称としての אָדָם の語感も保てる表現を選んだ。
- source_word: וַיִּישָׁן
  choice: その人が眠っている間に
  rationale: 直訳は「彼は眠った」。後続動作との時間関係を日本語で滑らかに示し、内容は付加していない。
- source_word: אַחַת מִצַּלְעֹתָיו
  choice: あばら骨の一つ
  rationale: צֵלָע は「脇・側面」も意味し得るが、肉でその箇所をふさぐという身体的文脈では「あばら骨」が自然である。別解は脚注に残した。
- source_word: וַיִּסְגֹּר בָּשָׂר תַּחְתֶּנָּה
  choice: その所を肉でふさいだ
  rationale: 「その下を肉で閉じた」という構文を、取り去った箇所を肉で閉じる意味として自然に表現した。
theological_decisions:
- issue: אָדָם の文脈的な指示対象
  choice: その人
  alternative: その男／人間
  rationale: この節では個人を指す一方、ヘブライ語の呼称が持つ「人」の語感を保ち、必要以上に解釈を狭めない。
- issue: צֵלָע の意味
  choice: あばら骨
  alternative: 脇／側面
  rationale: 身体から一つを取り、その箇所を肉でふさぐ描写には「あばら骨」がよく適合する。ただし「側面」も真正な語義なので脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。逐語的な不自然さを避けつつ、動作の順序と צֵלָע の語義上の幅を保持した。
