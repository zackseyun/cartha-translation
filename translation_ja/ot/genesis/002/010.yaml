  terminology: 「エデン」「園」は適切である。רָאשִׁיםを本文で「流れ」と明瞭にし、注で字義の「頭」と河川文脈での意味を説明する処理は妥当である。「源流」と限定して分岐後の流れを指す構文を誤解させない点もよい。
