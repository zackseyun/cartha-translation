source:
  edition: WLC
  text: וְ/נָהָרּ֙ יֹצֵ֣א מֵ/עֵ֔דֶן לְ/הַשְׁק֖וֹת אֶת הַ/גָּ֑ן וּ/מִ/שָּׁם֙ יִפָּרֵ֔ד וְ/הָיָ֖ה לְ/אַרְבָּעָ֥ה רָאשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/002/010.yaml
  text: A river flowed out of Eden to water the garden[a], and from there it divided and became four headwaters.
translation:
  language: ja
  text: 一つの川がエデンから流れ出て園を潤し、そこから分かれて四つの流れ[a]となっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「四つの頭」。ここでは、川が分かれてできた四つの主要な流れを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָהָר
  choice: 一つの川が
  rationale: נָהָרは「川」。接頭辞וְは文脈上の接続を担うが、日本語では不自然な「そして」を冒頭に置かず、叙述の流れで表した。不定の川なので「一つの川」とした。
- source_word: יֹצֵא מֵעֵדֶן
  choice: エデンから流れ出て
  rationale: יצאの分詞は継続的に出て行く動きを示し、川について自然な「流れ出る」で表した。מִןは起点を示す。
- source_word: לְהַשְׁקוֹת אֶת־הַגָּן
  choice: 園を潤し
  rationale: 目的を表す不定詞。שׁקהはここでは園に水を与えることを意味する。「灌漑する」より一般読者に自然で、簡潔な「潤す」とした。
- source_word: וּמִשָּׁם יִפָּרֵד
  choice: そこから分かれて
  rationale: מִשָּׁםは「そこから」。פרדのニファル形は「分かれる／分けられる」の幅を持つが、川を主語とする自動詞的な「分かれる」が自然である。
- source_word: וְהָיָה לְאַרְבָּעָה רָאשִׁים
  choice: 四つの流れとなっていた
  rationale: היהとלְは結果としての状態を表す。רָאשִׁיםは直訳すれば「頭」で、ここでは分岐後の主要な流れを指す。「源流」では分岐との位置関係を誤解させうるため、本文では明瞭な「流れ」とした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭でありながら、創世記の叙述にふさわしい簡潔で落ち着いた文体とした。分詞と後続動詞が描く継続的な情景は「流れ出て」「となっていた」で表した。注記記号は、その説明対象である「四つの流れ」の直後に置いた。
