  source_fidelity: ヘブライ語は「エデンから出て園に水を与える川」と、それが「そこから分かれ、四つのラシム（文字どおり『頭』）」となることを述べる。訳文は「流れ出て」「園を潤し」「分かれて」「四つの流れ」として、この順序と河川描写を自然に再現している。「となっていた」は描写的な叙述として許容範囲であり、結果状態を表すוְהָיָה לְאַרְבָּעָהを損なわない。
