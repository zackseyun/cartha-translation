  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲבִי/כֶן֙ הֵ֣תֶל בִּ֔/י וְ/הֶחֱלִ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֣רֶת מֹנִ֑ים וְ/לֹֽא נְתָנ֣/וֹ אֱלֹהִ֔ים לְ/הָרַ֖ע עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/007.yaml
  text: Yet your father has deceived me and changed my wages ten times[c][b][a], but God did not allow him to harm me.
translation:
  language: ja
  text: それでも、あなたたちの父は私を欺き、私の賃金を十回も[a]変えた。しかし神は、彼が私に害を加えるのをお許しにならなかった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「十回」。ここでは、何度も繰り返したことを表す慣用的な言い方で、厳密な回数を意味しない可能性がある。
    reason: cultural_note
  - marker: b
    text: 直訳は「神は、彼に私を害することを与えなかった」。すなわち、神が彼にその機会または許可を与えなかったという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתֶל
  choice: 欺き
  rationale: このヒフィル形は、人を欺く、あるいは人を愚弄するように扱うことを表す。報酬を繰り返し変更したという文脈では、「欺き」が不正な扱いを自然かつ明確に伝える。
- source_word: וְהֶחֱלִף
  choice: 変えた
  rationale: 合意された報酬を変更することを指す。現代日本語として自然で、労働報酬の文脈にも合う。
- source_word: מַשְׂכֻּרְתִּי
  choice: 私の報酬
  rationale: 労働に対して支払われる賃金・報酬を意味する。「報酬」は家畜による支払いも含み得るこの文脈に適する。
- source_word: עֲשֶׂרֶת מֹנִים
  choice: 十度も
  rationale: 字義的には「十回」だが、繰り返しを強調する慣用表現である可能性がある。「十度も」は数を保持しつつ反復への非難を自然に表す。
- source_word: וְלֹא נְתָנוֹ אֱלֹהִים
  choice: しかし神は、彼が…ことをお許しにならなかった
  rationale: 字義的には「神は彼に与えなかった」。ここでは機会または許可を与えなかったという意味であり、日本語では「お許しにならなかった」が明瞭である。
- source_word: לְהָרַע עִמָּדִי
  choice: 私に害を加える
  rationale: 相手に悪く振る舞う、害を及ぼすという意味。「害を加える」は簡潔で自然な訳である。
- source_word: אֱלֹהִים
  choice: 神
  rationale: ヤコブの言葉の中で真の神を指しているため、「神」と訳す。
theological_decisions:
- issue: 「神は彼に与えなかった」という神の制止を示す慣用句
  choice: 神は、彼が私に害を加えることをお許しにならなかった
  alternative: 神は彼を成功させず、私に害を加えさせなかった
  rationale: 神がラバンに害を加える機会・許可を与えなかったという本文の力点を保つ。一方、ラバンの意図や具体的な行動の程度について、本文以上に断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「あなたがた」は複数接尾辞を反映する。「それなのに」と「しかし」で、ラバンの不正と神の制止との対照を自然に示した。
