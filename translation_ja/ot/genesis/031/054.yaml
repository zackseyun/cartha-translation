id: GEN.31.54
reference: Genesis 31:54
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֨בַח֙ בָּ/הָ֔ר וַ/יִּקְרָ֥א לְ/אֶחָ֖י/ו לֶ/אֱכָל לָ֑חֶם וַ/יֹּ֣אכְלוּ לֶ֔חֶם וַ/יָּלִ֖ינוּ בָּ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/054.yaml
  text: Then Jacob offered a sacrifice on the mountain and called his brothers to eat bread[a]. They ate bread and spent the night on the mountain.
translation:
  language: ja
  text: ヤコブは山でいけにえを献げ、兄弟たち[a]を食事に招いた。彼らは食事をし、その夜を山で過ごした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、ここでは「親族たち」または「仲間たち」を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח ... זֶבַח
  choice: いけにえを献げ
  rationale: 同根語を重ねるヘブライ語の構文は、日本語で直訳すると不自然になるため、祭儀的な意味を保ちつつ自然に表現した。単なる屠殺や食事とは限定しない。
- source_word: בָּהָר
  choice: 山で
  rationale: 定冠詞を伴う הַר の基本義を簡潔に反映した。「山地で」も可能だが、同節内の場所の反復には「山」が適する。
- source_word: וַיִּקְרָא
  choice: 招いた
  rationale: 字義は「呼んだ」だが、食事を目的とする文脈上の機能を、現代日本語で自然な「招いた」とした。
- source_word: לְאֶחָיו
  choice: 兄弟たち
  rationale: אָח の男性親族・仲間にも及び得る語義の幅を注で示しつつ、本文では原語の親族呼称を保持した。
- source_word: לֶאֱכָל לָחֶם / וַיֹּאכְלוּ לֶחֶם
  choice: 食事に／食事をし
  rationale: 字義は「パンを食べる」だが、これは食事をすることを表す慣用句である。日本語で「パンを食べる」とすると食品を不必要に限定するため、意味を自然に表した。
- source_word: וַיָּלִינוּ
  choice: その夜を…過ごした
  rationale: לון の「一夜を過ごす、泊まる」という意味を、場所を伴う自然な日本語で表した。
theological_decisions:
- issue: 契約締結の場面における「兄弟たち」の範囲
  choice: 本文では「兄弟たち」とし、広い語義を脚注で示す。
  alternative: 親族たち／身内の者たち／仲間たち
  rationale: 原語 אָח は実の兄弟に限らず男性親族や一団の仲間を指し得る。本文でその曖昧さを狭めず、脚注によって文脈上の広い可能性を明示する。
translation_notes:
  register: 明瞭で現代的かつ品位のある叙述体。「いけにえを献げる」で祭儀性を保ち、「パンを食べる」は日本語の自然さを優先して「食事」とした。
