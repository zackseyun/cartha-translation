  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ן רֹאֶ֤ה אָנֹכִי֙ אֶת פְּנֵ֣י אֲבִי/כֶ֔ן כִּֽי אֵינֶ֥/נּוּ אֵלַ֖/י כִּ/תְמֹ֣ל שִׁלְשֹׁ֑ם וֵֽ/אלֹהֵ֣י אָבִ֔/י הָיָ֖ה עִמָּדִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/005.yaml
  text: And he said to them[a], “I see that your father's face is not toward me as before, but the God of my father has been with me.”
translation:
  language: ja
  text: 彼は二人に言った。「あなたたちの父が私に向ける顔つきは、以前のようではないことが分かる。しかし、私の父の神は私とともにいてくださった。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶן
  choice: 彼は二人に言った
  rationale: 物語を進める標準的な表現とした。女性複数形はラケルとレアを指すため、日本語では文脈を明確にする「二人」を用いた。
- source_word: רֹאֶה אָנֹכִי
  choice: 分かる
  rationale: 現在の知覚・認識を表す分詞構文。日本語では、顔つきから態度を察していることを自然に表す。
- source_word: אֶת־פְּנֵי אֲבִיכֶן
  choice: あなたたちの父の顔つき
  rationale: 「顔」という具体的比喩を残しつつ、態度や表情を指すことが現代日本語で伝わる「顔つき」とした。
- source_word: כִּי אֵינֶנּוּ אֵלַי כִּתְמֹל שִׁלְשֹׁם
  choice: 以前のようには私に向いていない
  rationale: 「昨日、一昨日のように」は以前を意味する慣用句。「私に向いていない」として原文の方向性の比喩を保った。
- source_word: וֵאלֹהֵי אָבִי
  choice: しかし、私の父の神は
  rationale: 接続詞は、ラバンの態度と神の臨在を対照させる文脈に即して逆接とした。「私の父の神」はヘブライ語の連語を忠実に反映する。
- source_word: הָיָה עִמָּדִי
  choice: 私とともにいてくださった
  rationale: 完了形が示す、これまで続いてきた神の支えを表す。「くださった」は神を主語とする自然で敬意ある日本語だが、原文以上の具体的行為は加えていない。
theological_decisions:
- issue: אֱלֹהֵי אָבִי の訳し方
  choice: 私の父の神
  alternative: 父の神
  rationale: 所有関係と家族的・契約的な響きを保ちながら、特定の教派的解釈を加えない。
- issue: הָיָה עִמָּדִי における神の臨在
  choice: 私とともにいてくださった
  alternative: 私とともにおられた
  rationale: ヤコブの現在までの経験を回顧する完了形の含意を示した。「おられた」も可能だが、「いてくださった」は支えという文脈上の対照を自然に伝える。
translation_notes:
  register: 明瞭で現代的な標準日本語。原文の「顔」と「向く」という空間的比喩を「顔つき」「向いていない」として保ち、כִּתְמֹל שִׁלְשֹׁם は直訳調を避けて「以前のように」とした。
