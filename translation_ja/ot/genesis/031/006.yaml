  yaml_path: translation/ot/genesis/031/006.yaml
  text: And you yourselves know that I have served your father with all my strength[a].
translation:
  language: ja
  text: あなたたち自身が知っているとおり、私は力の限り、あなたたちの父に仕えてきました[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたたちの父のために働いてきました」。ヘブライ語の動詞は「仕える」とも「働く」とも訳すことができ、ラバンのもとでヤコブが働いた年月には、どちらの意味も当てはまる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֵּנָה יְדַעְתֶּן
  choice: あなたたち自身が知っているとおり
  rationale: 独立代名詞による二人称女性複数への強調を「自身」で保ち、完了形は現在に至る認識として自然な日本語にした。接続詞וְは直前の文脈を受けるが、日本語では明示的な「そして」を置かないほうが自然である。
- source_word: כִּי
  choice: とおり
  rationale: 知っている内容を導く語。日本語では後続節全体を受けて「知っているとおり」とすることで、自然かつ明瞭に表した。
- source_word: בְּכָל־כֹּחִי
  choice: 力の限り
  rationale: 全能力を注いだことを表す、明快で現代的な定型表現。
- source_word: עָבַדְתִּי
  choice: 仕えてきました
  rationale: עבדの「仕える／働く」の幅を踏まえ、人を直接目的語とする関係的な意味を本文では「仕える」とした。継続した過去の労働が現在の発言時点に結びつくため「〜てきました」とした。
- source_word: אֶת־אֲבִיכֶן
  choice: あなたたちの父に
  rationale: 二人称女性複数接尾辞を、ラケルとレアへの呼びかけとして「あなたたち」と明示した。「仕える」が日本語では「に」を取るため自然な格にした。
