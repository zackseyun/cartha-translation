  register: 明瞭な現代標準日本語を用い、簡潔なヘブライ語の物語文の流れを保った。「そこで」は連続するwayyiqtolの展開を自然に示し、「立ち上がり」は原語の動作性を残す。日本語の「乗せた」が位置と方向の双方を自然に含むため、英語版にある前置詞の訳し分けについての脚注は設けない。
