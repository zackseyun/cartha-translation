base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/017.yaml
  text: Then Jacob arose and put his sons and his wives on the camels[a].
translation:
  language: ja
  text: そこでヤコブは立ち上がり、息子たちと妻たちをラクダに乗せた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: 立ち上がり
  rationale: קוםの物語を進める形で、行動を開始するために立ち上がることを表す。「立ち上がり」は現代日本語として自然で、続く動作との連続も明確である。
- source_word: וַיִּשָּׂא
  choice: 乗せた
  rationale: נשׂאは基本的に「持ち上げる、運ぶ」だが、目的語が人で、続いて「ラクダの上に」を意味する句があるため、ここではラクダに乗るようにしたという使役的な動作を自然に表す。
- source_word: בָּנָיו
  choice: 息子たち
  rationale: בניםはここで男性複数形であり、ヤコブの息子たちを指す。性を曖昧にせず原文どおりに訳す。
- source_word: נָשָׁיו
  choice: 妻たち
  rationale: אשהの複数形に三人称男性単数の所有接尾辞が付き、文脈上ヤコブの妻たちを指す。
- source_word: עַל הַגְּמַלִּים
  choice: ラクダに
  rationale: עלは本来「上に」を表し得るが、日本語では人を動物の背に置く動作を「ラクダに乗せる」と表すのが自然である。「乗せた」によって到達先としての意味も十分に保持される。
theological_decisions: []
