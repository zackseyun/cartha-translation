  text: ヤコブは、自分が逃げることを告げずに、アラム人ラバンを欺いた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「アラム人ラバンの心を盗んだ」。相手に知らせずに行動して欺く、または不意を突くことを意味するヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְנֹב יַעֲקֹב אֶת־לֵב לָבָן
  choice: ヤコブは……ラバンを欺いた
  rationale: 直訳は「ヤコブはラバンの心を盗んだ」だが、これは相手に知らせずに行動して欺く、または不意を突くことを表すヘブライ語の慣用表現である。日本語の「心を盗む」は恋愛感情を連想させて誤解を招くため、文脈に即して「欺いた」とした。
- source_word: הָאֲרַמִּי
  choice: アラム人
  rationale: ヘブライ語の民族・地域名称を直接反映し、伝統的な「シリア人」より歴史的に明確な表現とした。
- source_word: עַל בְּלִי הִגִּיד לוֹ
  choice: 告げずに
  rationale: ラバンを欺いた手段・仕方を示す構文として、簡潔で自然な日本語にした。
- source_word: כִּי בֹרֵחַ הוּא
  choice: 自分が逃げることを
  rationale: 分詞 בֹרֵחַ が表す進行中または目前の逃走を自然な日本語で示した。「自分が」により、告げなかった内容の主語がヤコブであることを明確にした。
