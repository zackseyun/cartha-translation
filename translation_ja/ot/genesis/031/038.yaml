base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/038.yaml
  text: These twenty years I have been with you; your ewes and your female goats have not miscarried[a], and I have not eaten the rams of your flock.
translation:
  language: ja
  text: この二十年間、私はあなたと共にいました。あなたの雌羊も雌やぎも流産することなく[a]、私はあなたの群れの雄羊を食べたことはありませんでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子を失うことなく」。ヘブライ語の動詞は子を奪われることを表し、この牧畜の文脈では流産、または子を失うことを意味します。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה עֶשְׂרִים שָׁנָה
  choice: この二十年間
  rationale: 直訳的な「この二十年」の指示的な力と、二十年にわたる期間の意味を自然な現代日本語で表す。
- source_word: אָנֹכִי עִמָּךְ
  choice: 私はあなたと共にいました
  rationale: 原文には明示的な動詞がないが、ここまで続いた二十年間の同伴と奉仕を振り返る文脈なので、自然な過去表現で補う。
- source_word: רְחֵלֶיךָ וְעִזֶּיךָ
  choice: あなたの雌羊も雌やぎも
  rationale: どちらも雌の家畜を指す語であるため、その性別の限定を保つ。「も…も」により並列を自然に示す。
- source_word: לֹא שִׁכֵּלוּ
  choice: 流産せず
  rationale: 語は子を失うことを広く表し得るが、家畜の繁殖を述べるこの文脈では「流産する」が簡潔で適切。より広い意味は脚注に残す。
- source_word: וְאֵילֵי צֹאנְךָ
  choice: あなたの群れの雄羊
  rationale: אֵילֵי は雄羊を特定し、צֹאנְךָ は相手が所有する群れとの関係を示すため、両方を明示する。
- source_word: לֹא אָכָלְתִּי
  choice: 私は…食べませんでした
  rationale: 二十年間の行動についてのヤコブの回顧的な弁明として、現代日本語の丁寧な過去否定形が自然である。
