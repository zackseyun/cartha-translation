  text: וַ/יִּקַּ֥ח יַעֲקֹ֖ב אָ֑בֶן וַ/יְרִימֶ֖/הָ מַצֵּבָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/045.yaml
  text: Then Jacob took a stone and set it up as a pillar[a].
translation:
  language: ja
  text: そこでヤコブは一つの石を取り、それを石の柱[a]として立てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「立石」または「記念の石」。ヘブライ語は、立てられた石の標識や柱を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取った
  rationale: לקחのQal形で、物を「取る」という通常の意味。簡潔で自然な物語文とした。
- source_word: יַעֲקֹב
  choice: ヤコブ
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: אָבֶן
  choice: 一つの石
  rationale: 単数名詞であることを自然な日本語で明示した。
- source_word: וַיְרִימֶהָ
  choice: それを……として立てた
  rationale: 女性単数接尾辞は直前の「石」を指す。ここでは石を直立させる行為なので、「持ち上げた」より文脈に即した「立てた」とした。
- source_word: מַצֵּבָה
  choice: 石の柱
  rationale: 直立させた石の標識・柱を表す語。日本語で物体を明確に示しつつ、記念的または祭儀的な意味を本文に付加しない表現とした。
theological_decisions:
- issue: מַצֵּבָהが持ち得る記念的・祭儀的含意
  choice: 石の柱
  alternative: 立石、記念の石
  rationale: この節自体は石を立てた行為を述べるだけで、その用途や宗教的意義を明示していないため、解釈を限定しない物理的表現を本文に置いた。
translation_notes:
  register: 明瞭で自然な現代標準日本語。物語の連続を「そこで」で示し、「石の柱」は平易さと荘重さの均衡を図った。
