  text: וַ/יֹּ֣אמֶר לָבָ֔ן הַ/גַּ֨ל הַ/זֶּ֥ה עֵ֛ד בֵּינִ֥/י וּ/בֵינְ/ךָ֖ הַ/יּ֑וֹם עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ גַּלְעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/048.yaml
  text: And Laban said[a], “This heap is a witness between me and you today.” Therefore he called its name Galeed.
translation:
  language: ja
  text: ラバンは言った。「今日、この石の山は私とあなたとの間の証しだ。」それゆえ、彼はその名をガル・エド[a]と呼んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ガル・エド」はヘブライ語で「証しの石の山」を意味する。
    reason: 名称を音写した本文に対し、その命名理由となるヘブライ語の語義を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ継続法。日本語では文脈上、接続語を加えず「言った」とするのが自然。
- source_word: לָבָן
  choice: ラバン
  rationale: 人名として一般的な日本語表記に音写した。
- source_word: הַגַּל הַזֶּה
  choice: この石塚
  rationale: גַּלは積み上げたもの、特にこの文脈では石の塚を指す。「石塚」は対象を明確にしつつ簡潔である。
- source_word: עֵד
  choice: 証し
  rationale: この石塚が両者の取り決めを証明する標識として機能することを表す。現代日本語として自然で、法的・契約的含意も保てる。
- source_word: בֵּינִי וּבֵינְךָ
  choice: 私とあなたとの間
  rationale: ヘブライ語が両当事者を明示しているため、「私たちの間」と縮約せず、その直接性を保った。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 時間を表す語を明瞭な現代日本語で訳した。
- source_word: עַל כֵּן
  choice: それゆえ
  rationale: 命名の理由を導く因果関係を簡潔かつ格調ある日本語で示す。
- source_word: קָרָא שְׁמוֹ
  choice: その名は……と呼ばれた
  rationale: 動詞は三人称男性単数で主語が明示されない。日本語では受動表現により、命名者を不必要に特定せず、ヘブライ語の曖昧さを保つ。
- source_word: גַּלְעֵד
  choice: ガル・エド
  rationale: 名称として音写し、גַּל（石塚）とעֵד（証し）の語呂と意味は脚注で示す。
