  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/עַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי נִכְסֹ֥ף נִכְסַ֖פְתָּה לְ/בֵ֣ית אָבִ֑י/ךָ לָ֥/מָּה גָנַ֖בְתָּ אֶת אֱלֹהָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/030.yaml
  text: And now[a], you have indeed gone away, because you longed greatly for your father's house. Why did you steal my gods?
translation:
  language: ja
  text: さて、あなたは確かに去って行った。父の家をひたすら慕っていたからだ。なぜ私の神々[a]を盗んだのか。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: あるいは「私の家の神々」。ヘブライ語本文は単に「私の神々」だが、文脈ではラバンの家にあった偶像を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: さて
  rationale: 直前の発言を受けて次の追及点へ移る談話標識として、接続性を保ちながら自然な現代日本語にした。
- source_word: הָלֹךְ הָלַכְתָּ
  choice: あなたは確かに去って行った
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「確かに」で示し、移動して立ち去ったことを「去って行った」と表した。
- source_word: כִּי
  choice: からだ
  rationale: ヤコブが去った理由を示す因果関係として訳した。
- source_word: נִכְסֹף נִכְסַפְתָּה
  choice: ひたすら慕っていた
  rationale: 不定詞絶対形による強い思慕を「ひたすら」で表し、対象への深い憧憬を「慕う」で自然に示した。
- source_word: לְבֵית אָבִיךָ
  choice: 父の家を
  rationale: 「父の家」という家族・家系・家の共同体を含み得る原文の表現を、その広がりを狭めずに保った。
- source_word: לָמָּה גָנַבְתָּ
  choice: なぜ……盗んだのか
  rationale: ラバンの直接的な非難を、簡潔な疑問文として再現した。
- source_word: אֶת אֱלֹהָי
  choice: 私の神々
  rationale: 一人称接尾辞を伴う複数形を字義どおり訳し、この節自体にない「偶像」や「家の守り神」を本文へ補わなかった。
theological_decisions:
- issue: ラバンの発言における אֱלֹהָי の訳
  choice: 私の神々
  alternative: 私の家の神々／私の家の守り神
  rationale: 原文は単に「私の神々」と述べる。文脈上はラバンの家に属する偶像を指すが、その説明は本文に織り込まず脚注に置き、原文の語形とラバン自身の言い方を保った。
- issue: 二つの強意構文の表現
  choice: 「確かに」「ひたすら」によってそれぞれの強調を示す
  alternative: 「どうしても去り」「激しく慕っていた」
  rationale: 同じヘブライ語構文を機械的に同じ副詞で訳さず、各動詞に自然に結びつく現代日本語で強意を保持した。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、ラバンの追及の厳しさを保った。「父の家」は「故郷」などに言い換えず、家族・家系を含む原文の幅を残した。脚注記号[a]は説明対象である「神々」の直後に置いた。
