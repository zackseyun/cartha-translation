base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/004.yaml
  text: So Jacob sent and called Rachel and Leah to the field[a], to his flock[b],
translation:
  language: ja
  text: そこでヤコブは人を遣わし、ラケルとレアを、野にいる自分の家畜の群れのところへ[a]呼び寄せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「野へ、自分の家畜の群れへ」。後半は、呼び寄せた場所をさらに具体的に示していると考えられる。
    reason: 語句相互の関係には、「野」と「群れ」を並列の行き先として読む余地もあるため。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 人を遣わし
  rationale: 目的語は明示されていないが、続く「呼んだ」と合わせ、ヤコブが二人を呼ぶために人を遣わしたという自然な日本語にした。
- source_word: וַיִּקְרָא
  choice: 呼び寄せた
  rationale: לְを伴って人を呼ぶ、招集する意。文脈上、二人をその場所へ来させることなので「呼び寄せた」が明瞭である。
- source_word: לְרָחֵל וּלְלֵאָה
  choice: ラケルとレアを
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: הַשָּׂדֶה
  choice: 野に
  rationale: שׂדהは耕作地に限らず開けた野外を指し得るため、ここでは「野」とした。
- source_word: אֶל צֹאנוֹ
  choice: 自分の家畜の群れのところへ
  rationale: צֹאןは羊や山羊などの小家畜の群れを指すため、「羊」だけに限定せず「家畜の群れ」とした。אֶלの方向性は「ところへ」で表した。
