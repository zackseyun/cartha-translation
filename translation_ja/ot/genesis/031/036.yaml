base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/036.yaml
  text: Then Jacob became angry and contended with Laban. Jacob answered and said to Laban[a], “What is my transgression? What is my sin, that you have pursued me?”
translation:
  language: ja
  text: そこでヤコブは怒り、ラバンと言い争った。そしてヤコブはラバンに答えて言った。「私のどんな背き、どんな罪のために、あなたは私を激しく追って来たのですか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「激しく追って来た」は、単に「追って来た」とも訳せる。ヘブライ語の動詞には、燃えるような勢いで追うという含みがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְיַעֲקֹב
  choice: ヤコブは怒り
  rationale: חרה＋ל の慣用表現は、怒りが燃え上がることを表す。現代日本語として自然で、文脈に十分な強さを持つ「怒り」とした。
- source_word: וַיָּרֶב בְּלָבָן
  choice: ラバンと言い争った
  rationale: ריב は相手と争い、論争することを表す。ここでは続く抗議の言葉に即して「言い争った」が自然である。
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 答えて言った
  rationale: 原文の二つの動詞を保ち、ヘブライ語物語文の応答表現を明確に反映した。
- source_word: מַה פִּשְׁעִי
  choice: 私にどんな背きがあり
  rationale: פֶּשַׁע の故意の違反・反逆という道徳的、法的含意を「背き」で表した。
- source_word: מַה חַטָּאתִי
  choice: どんな罪がある
  rationale: חַטָּאת の基本的な意味を「罪」とし、「背き」との修辞的並行関係も保った。
- source_word: כִּי
  choice: というので
  rationale: 先行する問いと追跡との理由関係を、日本語の一続きの修辞疑問として自然に結んだ。
- source_word: דָלַקְתָּ אַחֲרָי
  choice: 私を激しく追って来た
  rationale: דלק は本来「燃える」ことに関係し、転じて熱心に、激しく追跡することを表す。「激しく」によってその強意を簡潔に伝えた。
