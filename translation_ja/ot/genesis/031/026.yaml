base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/026.yaml
  text: Then Laban said to Jacob[a], “What have you done[c][b], that you have stolen my heart and driven my daughters away like captives of the sword?”
translation:
  language: ja
  text: ラバンはヤコブに言った。「いったい何ということをしたのだ。私を欺き[a]、剣で捕らえられた女たちのように、私の娘たちを連れ去るとは[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私の心を盗み」。ここでは、気づかれないように欺くことを意味する慣用表現。
    reason: lexical_alternative
  - marker: b
    text: 「剣で捕らえられた女たち」とは、戦争で捕虜にされた女性たちのこと。
    reason: lexical_clarification
lexical_decisions:
- source_word: מֶה עָשִׂיתָ
  choice: いったい何ということをしたのだ
  rationale: 非難を込めた修辞的な問いとして、現代日本語で自然に強い驚きと叱責を表す。
- source_word: וַתִּגְנֹב אֶת לְבָבִי
  choice: 私を欺き
  rationale: 直訳は「私の心を盗み」だが、日本語の「心を盗む」は人を魅了するという肯定的・恋愛的意味に受け取られやすい。文脈上は、ラバンに気づかれないよう欺いたことを非難しているため、本文では慣用句の意味を訳し、直訳を脚注に残す。
- source_word: וַתְּנַהֵג
  choice: 連れ去る
  rationale: 動詞には「導く、追い立てる」の幅がある。戦争捕虜の比喩と、娘たちを自分のもとから去らせたというラバンの非難を、過度に説明せず自然に表す。
- source_word: בְּנֹתַי
  choice: 私の娘たち
  rationale: 複数形とラバンの所有・血縁の主張をそのまま保持する。
- source_word: כִּשְׁבֻיוֹת חָרֶב
  choice: 剣で捕らえられた女たちのように
  rationale: שְׁבֻיוֹת は女性複数の「捕らわれた者たち」であり、ここでは娘たちを戦争で捕虜となった女性になぞらえる。日本語で意味が通る形にしつつ、「剣」という原文の戦争的イメージを保持する。
