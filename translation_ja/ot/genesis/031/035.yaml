  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל אָבִ֗י/הָ אַל יִ֨חַר֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י כִּ֣י ל֤וֹא אוּכַל֙ לָ/ק֣וּם מִ/פָּנֶ֔י/ךָ כִּי דֶ֥רֶךְ נָשִׁ֖ים לִ֑/י וַ/יְחַפֵּ֕שׂ וְ/לֹ֥א מָצָ֖א אֶת הַ/תְּרָפִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/035.yaml
  text: And she said to her father[a], “Let not my lord be angry in my sight that I cannot rise before you, for the way of women is upon me.” So he searched[b], but did not find the household idols.
translation:
  language: ja
  text: 彼女は父に言った。「どうか、お怒りにならないでください。私は月のものがあって、あなたの前で立ち上がれないのです。」父は捜したが、家の偶像[a]を見つけられなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「テラフィム」。家に置かれ、祭儀に用いられた像を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֶל־אָבִיהָ
  choice: 彼女は父に言った
  rationale: ヘブライ語の物語進行を自然な現代日本語で示し、話し相手が父ラバンであることを明確にした。
- source_word: אַל־יִחַר בְּעֵינֵי אֲדֹנִי
  choice: どうか、お怒りにならないでください
  rationale: 直訳調の「わが主人の目に怒りが燃えないように」ではなく、相手への敬意と怒らないでほしいという慣用的な意味を自然な敬語で表した。אֲדֹנִי のへりくだった呼びかけは文全体の敬語に反映した。
- source_word: לֹא אוּכַל לָקוּם מִפָּנֶיךָ
  choice: あなたの前で立ち上がれないのです
  rationale: קום の身体的な「立ち上がる」と、מִפָּנֶיךָ の「あなたの前で／面前で」という意味を保った。
- source_word: דֶרֶךְ נָשִׁים לִי
  choice: 私は月のものがあって
  rationale: 月経を指すヘブライ語の婉曲表現を、現代日本語で明瞭かつ控えめな同等の婉曲表現にした。
- source_word: וַיְחַפֵּשׂ וְלֹא מָצָא
  choice: 父は捜したが、…見つけられなかった
  rationale: 文脈上の主語ラバンを「父」として補い、捜索が不首尾に終わった対比を「が」で自然に表した。
- source_word: הַתְּרָפִים
  choice: 家の偶像
  rationale: 家庭内の祭儀に用いられた像を指す語であり、音写だけにせず、一般読者に機能が伝わる表現とした。語の固有性は脚注で補った。
theological_decisions:
- issue: תְּרָפִים の訳し方
  choice: 家の偶像
  alternative: テラフィム／家の神々
  rationale: 家庭祭儀の像という宗教的性格を明示しつつ、それが具体的にどのような物であったかを過度に限定しない。「神々」よりも、物体を捜している文脈に適する「偶像」を採用した。
translation_notes:
  register: 明瞭で現代的な標準語を用い、ラケルの丁重な口調は自然な敬語で表した。月経については原文と同様に婉曲な言い方を保った。
