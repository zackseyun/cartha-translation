  text: On the third day[a], Laban was told that Jacob had fled.
translation:
  language: ja
  text: 三日目に、ヤコブが逃げたことがラバンに知らされた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: 知らされた
  rationale: ホファル形の受動的な意味を保ち、知らせた人物を補わずに、情報がラバンへ伝えられたことを自然な現代日本語で表す。
- source_word: לְלָבָן
  choice: ラバンに
  rationale: 前置詞 לְ が知らせの受け手を示すため、日本語では「ラバンに」とする。
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: 三日目に
  rationale: 原文に明記されていない「その後」を補わず、時間的な順序を簡潔に表す。
- source_word: כִּי
  choice: ことが
  rationale: ここでは報告内容を導く接続詞なので、日本語の間接話法として「ことが」で表す。
- source_word: בָרַח
  choice: 逃げた
  rationale: 基本義である「逃げる」を採用する。日本語では報告より前の出来事であることが文脈上明瞭であり、過去完了に相当する余分な表現を要しない。
- source_word: יַעֲקֹב
  choice: ヤコブ
  rationale: 日本語聖書で広く定着している人名表記を用いる。
