  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אָנֹכִ֤י הָ/אֵל֙ בֵּֽית אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛/י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את וְ/שׁ֖וּב אֶל אֶ֥רֶץ מוֹלַדְתֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/013.yaml
  text: I am the God of Bethel[a], where you anointed a pillar and where you vowed a vow to me. Now arise, go out from this land[b], and return to the land of your birth.
translation:
  language: ja
  text: 「わたしは、あなたがそこで石の柱に油を注ぎ、そこでわたしに誓願を立てた、ベテルの神である。今、立ってこの地を出て、あなたの生まれた地へ帰りなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵל בֵּית אֵל
  choice: ベテルの神
  rationale: 定冠詞を伴う אֵל と地名 בֵּית אֵל により、話者をヤコブがベテルで出会った神として特定している。地名は慣用表記「ベテル」とした。
- source_word: מָשַׁחְתָּ שָּׁם מַצֵּבָה
  choice: あなたがそこで石の柱に油を注ぎ
  rationale: מָשַׁח は「油を注ぐ」、מַצֵּבָה は立てられた記念の石柱を指す。日本語で「柱に油を注ぐ」とすることで、創世記28章18節の具体的な行為を自然かつ明瞭に示す。
- source_word: נָדַרְתָּ לִּי שָׁם נֶדֶר
  choice: そこでわたしに誓願を立てた
  rationale: 同根の動詞と名詞によるヘブライ語の強調を、自然な現代日本語の定型表現「誓願を立てる」で表した。「わたしに」により誓願の相手を保持した。
- source_word: עַתָּה קוּם צֵא
  choice: 今、立ってこの地を出て
  rationale: 連続する命令を保ちつつ、קוּם は後続の行動を促す「立って」、צֵא は領域からの出発を示す「出て」と訳した。
- source_word: הָאָרֶץ הַזֹּאת
  choice: この地
  rationale: ここで אֶרֶץ は全世界ではなく、ヤコブが現在暮らす地域を指す。簡潔で聖書本文にふさわしい「この地」とした。
- source_word: וְשׁוּב אֶל אֶרֶץ מוֹלַדְתֶּךָ
  choice: あなたの生まれた地へ帰りなさい
  rationale: שׁוּב の帰還の意味を明示し、אֶרֶץ מוֹלַדְתֶּךָ は出生地・故郷・出自の地という幅を保つため「あなたの生まれた地」とした。
theological_decisions:
- issue: 話者の自己同定「ベテルの神」
  choice: 「わたしはベテルの神…である」
  alternative: 「わたしはベテルに現れた神である」
  rationale: 原文は神の出現を明示的には述べず、話者をベテルでの先の出来事と結びつけている。「現れた」を補わず、また地方神を意味するような説明も加えない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の発言として簡潔で威厳ある文体にした。原文の二つの関係節は、日本語で係り先を明確にするため末尾の「神である」にまとめた。注記を必要とする重大な異読はないため、脚注は付していない。
