  yaml_path: translation/ot/genesis/031/001.yaml
  text: He heard the words of Laban’s sons[a], saying, “Jacob has taken all that belonged to our father, and from what belonged to our father he has gained all this wealth.”
translation:
  language: ja
  text: ヤコブは、ラバンの息子たちがこう言うのを聞いた。「ヤコブは、われわれの父のものをすべて取って、われわれの父のものから、この富をすべて得たのだ。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この栄光をすべて」とも訳せる。ヘブライ語の語は、名誉、輝き、物質的な富を表し得る。ここでは、目に見えるヤコブの繁栄を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ヤコブは…聞いた
  rationale: 物語を進める連続形。日本語では文脈上の主語ヤコブを明示し、自然な過去形で表した。
- source_word: דִּבְרֵי בְנֵי לָבָן לֵאמֹר
  choice: ラバンの息子たちがこう言っているのを
  rationale: 直訳的な「言葉を、言うには」よりも、発言内容を耳にしたことが自然に伝わる形にした。
- source_word: לָקַח
  choice: 奪い取り
  rationale: 基本義は「取る」だが、ラバンの息子たちによる非難の口調を反映した。ただし、強盗などの限定的意味にはしていない。
- source_word: כָּל אֲשֶׁר לְאָבִינוּ
  choice: われわれの父のものをすべて
  rationale: לְ の所有関係と「すべて」を明瞭に保った。
- source_word: וּמֵאֲשֶׁר לְאָבִינוּ
  choice: われわれの父のものから
  rationale: מִן の起点・源泉の意味を保ち、原文の反復も残した。
- source_word: עָשָׂה
  choice: 築いた
  rationale: 字義は「造った／成し遂げた」。ここでは財産を作り上げたという文脈に合う自然な表現とした。
- source_word: כָּל הַכָּבֹד הַזֶּה
  choice: この富をすべて
  rationale: כָּבוֹד は「栄光、誉れ、重み」のほか物質的な豊かさを表し得る。家畜と財産をめぐる文脈では「富」が最も明瞭で、別の語義は脚注に残した。
