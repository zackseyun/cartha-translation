  text: כִּֽי מִשַּׁ֣שְׁתָּ אֶת כָּל כֵּלַ֗/י מַה מָּצָ֨אתָ֙ מִ/כֹּ֣ל כְּלֵי בֵיתֶ֔/ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖/י וְ/אַחֶ֑י/ךָ וְ/יוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽי/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/037.yaml
  text: Since you have searched through all my goods[a], what have you found of all the goods of your house? Set it here before my brothers and your brothers[b], and let them judge between the two of us.
translation:
  language: ja
  text: あなたは私の持ち物をすべて探り調べたのだから、あなたの家の持ち物のうち、何を見つけたのか。それをここに、私の兄弟たちとあなたの兄弟たちの前に置け。彼らに、私たち二人の間を裁定してもらおう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשַּׁשְׁתָּ
  choice: 探り調べた
  rationale: この動詞は本来、手で触れて確かめることを表すが、ここでは盗品を求めて持ち物を徹底的に捜索したことを指す。「探り調べた」は具体的な感触を残しつつ、現代日本語として自然である。
- source_word: כָּל כֵּלַי
  choice: 私の持ち物をすべて
  rationale: כְּלִי は器、道具、品物などを広く指す。ここではヤコブの携行財産全般を指すため、「持ち物」とした。
- source_word: מִכֹּל כְּלֵי בֵיתֶךָ
  choice: あなたの家の品物のうち
  rationale: 前置詞 מִן の部分を示す用法を明確にし、ラバンの家に属する品物の中から何が見つかったのか、という問いを表した。
- source_word: שִׂים כֹּה נֶגֶד
  choice: それをここに……の前に置け
  rationale: 見つけたとされる品を双方の関係者の面前に提出せよという、直接的な命令を自然に表した。
- source_word: אַחַי וְאַחֶיךָ
  choice: 私の身内とあなたの身内
  rationale: אָח は字義的には「兄弟」だが、ここでは双方に同行する親族・同族の者たちを含む用法と考えられる。「身内」はその範囲を自然に伝え、実の兄弟だけに狭めない。
- source_word: וְיוֹכִיחוּ
  choice: 裁いてもらおう
  rationale: ここでの יכח のヒフィル形には、争いを判定・裁定する法的ないし仲裁的な意味がある。双方の身内に判断を委ねる文脈を明瞭にした。
- source_word: בֵּין שְׁנֵינוּ
  choice: 私たち二人の間
  rationale: 原文が明示する「二人」を保ち、ヤコブとラバンの争いであることを示した。
theological_decisions: []
translation_notes:
  register: ヤコブの憤りと挑戦的な問いかけが伝わるよう、「いったい」「何を見つけたというのか」を用いた。命令と仲裁の要請は簡潔で格調を保ちつつ、一般の現代日本語話者に理解しやすい表現とした。
