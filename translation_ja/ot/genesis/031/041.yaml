  text: זֶה לִּ֞/י עֶשְׂרִ֣ים שָׁנָה֮ בְּ/בֵיתֶ/ךָ֒ עֲבַדְתִּ֜י/ךָ אַרְבַּֽע עֶשְׂרֵ֤ה שָׁנָה֙ בִּ/שְׁתֵּ֣י בְנֹתֶ֔י/ךָ וְ/שֵׁ֥שׁ שָׁנִ֖ים בְּ/צֹאנֶ֑/ךָ וַ/תַּחֲלֵ֥ף אֶת מַשְׂכֻּרְתִּ֖/י עֲשֶׂ֥רֶת מֹנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/041.yaml
  text: 'These twenty years I have been in your house: I served you fourteen years for your two daughters[a], and six years for your flock, and you changed my wages ten times.'
translation:
  language: ja
  text: この二十年間、私はあなたの家であなたに仕え、あなたの二人の娘のために十四年、あなたの群れのために六年仕えました。それなのに、あなたは私の賃金を十回も変えました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֶה לִּי עֶשְׂרִים שָׁנָה
  choice: この二十年間
  rationale: 指示語 זֶה と期間を表す慣用的な表現を、自然な日本語の時間句として訳した。「この」により、ヤコブが直前まで述べてきた二十年を指し示す力も保った。
- source_word: בְּבֵיתֶךָ
  choice: あなたの家にいて
  rationale: בַּיִת の具体的な「家」を保ちつつ、この文脈ではそこに滞在していたことを自然な日本語で明示した。「家族のもとで」より解釈を加えない。
- source_word: עֲבַדְתִּיךָ
  choice: あなたに仕えました
  rationale: עבד が表す労働と従属的な奉仕の両面を保つため、「働きました」ではなく「仕えました」とした。
- source_word: אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ
  choice: 十四年間はあなたの二人の娘のために
  rationale: 前置詞 בְּ がここで奉仕の対価・目的を示すため、「娘を得るために」などの説明を本文へ加えず、「娘のために」と簡潔に訳した。
- source_word: וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ
  choice: 六年間はあなたの群れのために
  rationale: צֹאן は羊と山羊を含み得る小家畜の集合語なので、狭く「羊」とせず「群れ」とした。
- source_word: וַתַּחֲלֵף
  choice: それなのに、あなたは…変えました
  rationale: חלף のヒフィル形を「変えました」とし、文脈上の非難の対照を自然に示すため接続を「それなのに」とした。反復性は「十回も」で表した。
- source_word: מַשְׂכֻּרְתִּי
  choice: 私の賃金
  rationale: 雇用労働の報酬を指す語として、明確で標準的な「賃金」を選んだ。
- source_word: עֲשֶׂרֶת מֹנִים
  choice: 十回も
  rationale: 字義的には数えることに関わる表現だが、ここでは回数を示す慣用句であり、「十回」と訳す。「も」によってヤコブの非難の強さを自然に表した。
