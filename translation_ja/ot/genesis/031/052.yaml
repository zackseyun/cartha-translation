  text: עֵ֚ד הַ/גַּ֣ל הַ/זֶּ֔ה וְ/עֵדָ֖ה הַ/מַּצֵּבָ֑ה אִם אָ֗נִי לֹֽא אֶֽעֱבֹ֤ר אֵלֶ֨י/ךָ֙ אֶת הַ/גַּ֣ל הַ/זֶּ֔ה וְ/אִם אַ֠תָּה לֹא תַעֲבֹ֨ר אֵלַ֜/י אֶת הַ/גַּ֥ל הַ/זֶּ֛ה וְ/אֶת הַ/מַּצֵּבָ֥ה הַ/זֹּ֖את לְ/רָעָֽה־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/052.yaml
  text: This heap is a witness[a], and the pillar is a witness, that I will not pass over this heap toward you[c][b], and that you will not pass over this heap and this pillar toward me for harm.
translation:
  language: ja
  text: この石塚は証人であり、この石柱も証人である。私はこの石塚を越えてあなたのほうへ行かず、あなたもこの石塚とこの石柱を越えて、害を加えるために私のほうへ来ない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֵד / וְעֵדָה
  choice: 証人である／証人である
  rationale: 石塚と石柱が契約の証しを担うという擬人的な表現を保ち、両者の並行関係を明示した。
- source_word: גַּל
  choice: 石塚
  rationale: 文脈上、境界のしるしとして積まれた石の集まりを指すため、単なる「塚」より具体的で自然な語を選んだ。
- source_word: מַצֵּבָה
  choice: 石柱
  rationale: 立てられた石の標識を表す。現代日本語で物体を明確に想像できる表現とした。
- source_word: אִם ... לֹא
  choice: …行かず／…来ない
  rationale: ここでは単純な条件ではなく、証人を立てた契約上の誓約内容を導く用法と判断し、日本語では否定の誓約として自然に表した。
- source_word: אֶעֱבֹר / תַעֲבֹר
  choice: 越えて…行く／越えて…来る
  rationale: 境界標識を越える空間的意味を保ちつつ、אֵלֶיךָ／אֵלַי の方向性を日本語の移動動詞に織り込んだ。
- source_word: אֵלֶיךָ / אֵלַי
  choice: あなたのほうへ／私のほうへ
  rationale: 相手に向かう方向を表し、それ自体に敵対の意味を過度に読み込まない訳とした。
- source_word: לְרָעָה
  choice: 害を加えるために
  rationale: 境界を物理的に越えること自体ではなく、危害を目的として越えることが禁じられている点を明確にした。
theological_decisions:
- issue: 境界を越える行為の禁止範囲
  choice: 「害を加えるために」を双方の移動にかかるよう配置
  alternative: 後半の「あなたも…来ない」だけにかける
  rationale: ヘブライ語では לְרָעָה が文末に一度だけ置かれているが、契約条項全体に及ぶと自然に理解できる。日本語では誤解を避けるため双方に反復した一方、単なる往来を全面的に禁じる意味にはしなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「証人」という原文の擬人表現を残し、境界標識の具体像が伝わるよう「石塚」「石柱」とした。
