    reason: lexical_alternative
lexical_decisions:
- source_word: נְטַשְׁתַּנִי
  choice: 私が……することさえ許さなかった
  rationale: נטשׁの基本義は「残す、捨てる」だが、ここでは不定詞「口づけする」と結びつき、「その機会を与える、許す」という意味になる。否定と不満の強さを自然な日本語で示すため「さえ許さなかった」とした。
- source_word: לְנַשֵּׁק
  choice: 別れの口づけをする
  rationale: 語そのものは「口づけする」だが、出立時の文脈から別れの口づけであることが明白であり、現代日本語で意図が自然に伝わるよう補った。脚注にはより直訳的な表現を示した。
- source_word: לְבָנַי וְלִבְנֹתָי
  choice: 息子たちや娘たち
  rationale: 原文が息子と娘を明示しているため、「子どもたち」とまとめず両方を保持した。接続のוは、この否定文では自然な日本語の「や」で表した。
- source_word: עַתָּה
  choice: それなのに
  rationale: 字義的には「今」だが、ここでは直前の非難を受けて結論的評価を導く談話標識として働く。日本語の「今や」より文脈に自然な逆接的接続を選んだ。
- source_word: הִסְכַּלְתָּ עֲשׂוֹ
  choice: おまえは愚かなことをしたものだ
  rationale: 「愚かに行った／振る舞った」という意味。ラバンの非難の調子を保ちつつ、自然で威厳ある現代日本語とした。
