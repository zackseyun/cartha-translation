source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/עֵת֙ יַחֵ֣ם הַ/צֹּ֔אן וָ/אֶשָּׂ֥א עֵינַ֛/י וָ/אֵ֖רֶא בַּ/חֲל֑וֹם וְ/הִנֵּ֤ה הָֽ/עַתֻּדִים֙ הָ/עֹלִ֣ים עַל הַ/צֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּ/בְרֻדִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/010.yaml
  text: And it happened at the time when the flock was mating that I lifted up my eyes and saw in a dream[a], and behold, the male goats that were mounting the flock were striped, speckled[b], and mottled.
translation:
  language: ja
  text: 群れが交尾する時期に、私は夢の中で目を上げて見ると、見よ、群れの雌に乗っている雄やぎは、縞模様[a]、斑点模様、まだら模様[b]のあるものだった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「輪状の縞」とも訳せる。ヘブライ語は、動物の体にある帯状の模様を指す。
    reason: lexical_alternative
  - marker: b
    text: 「ぶち模様」とも訳せる。ここに並ぶ三つの語は、それぞれ異なる毛色の模様を表していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: 時期に
  rationale: 出来事の時を示すヘブライ語の叙述表現を、文脈に合う自然な現代日本語で表した。
- source_word: יַחֵם הַצֹּאן
  choice: 群れが交尾する
  rationale: יחםは家畜の発情・繁殖行動を指す。ここでは実際の交尾場面が続くため、「交尾する」が明確であり、受胎という結果までは含めない。
- source_word: וָאֶשָּׂא עֵינַי וָאֵרֶא בַּחֲלוֹם
  choice: 私は夢の中で目を上げて見ると
  rationale: 「目を上げて見る」というヘブライ語の視覚表現と、知覚の媒体が夢であることの両方を、自然な日本語の一続きの表現にした。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 突然眼前に示された光景への注意と驚きを、古風すぎない現代日本語で表した。
- source_word: הָעַתֻּדִים
  choice: 雄やぎ
  rationale: 繁殖に用いられる雄のやぎを明確に示す。
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: 群れに乗りかかっている
  rationale: 繁殖行動を表す具体的な比喩を保ち、「交配している」ほど説明的にしすぎない訳とした。
- source_word: עֲקֻדִּים
  choice: 縞模様のあるもの
  rationale: 帯状・縞状の印を表す語として分かりやすい訳を採用した。
- source_word: נְקֻדִּים
  choice: 斑点模様のあるもの
  rationale: 点状の斑紋を示し、前後の毛色用語との違いを保った。
- source_word: וּבְרֻדִּים
  choice: まだら模様のあるもの
  rationale: 不規則に色が入り交じる毛色を示し、「斑点模様」と区別した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「なんと」でוְהִנֵּהの生き生きとした提示を表し、家畜の繁殖行動は婉曲化しすぎず簡潔に訳した。脚注記号は該当する毛色語の直後に配置した。
