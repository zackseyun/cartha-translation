source:
  edition: WLC
  text: יֶשׁ לְ/אֵ֣ל יָדִ֔/י לַ/עֲשׂ֥וֹת עִמָּ/כֶ֖ם רָ֑ע וֵֽ/אלֹהֵ֨י אֲבִי/כֶ֜ם אֶ֣מֶשׁ אָמַ֧ר אֵלַ֣/י לֵ/אמֹ֗ר הִשָּׁ֧מֶר לְ/ךָ֛ מִ/דַּבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/029.yaml
  text: It is in my power to do you harm[a], but the God of your father spoke to me last night, saying, ‘Be careful not to speak to Jacob either good or bad.’
translation:
  language: ja
  text: 私には、おまえたちに害を加える力がある。だが昨夜、おまえたちの父の神が私に言われた。『ヤコブと、良いことも悪いことも話さないよう、よく気をつけよ[a]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「良いことから悪いことまで」。ここでは、好意的であれ敵対的であれ、ヤコブと何も話さないように、という意味を表す慣用表現。
    reason: 原文の両極表現を示しつつ、評価的な補足を加えずに文脈上の包括的な意味を説明するため。
lexical_decisions:
- source_word: יֶשׁ לְאֵל יָדִי
  choice: 私には……力がある
  rationale: 「私の手の力にある」という能力・権限を表す慣用表現を、自然な現代日本語で示した。
- source_word: לַעֲשׂוֹת עִמָּכֶם רָע
  choice: おまえたちに害を加える
  rationale: רָע はここでは抽象的な道徳悪というより、相手に危害を及ぼす行為を指す。複数接尾辞を「おまえたち」で保持した。
- source_word: וֵאלֹהֵי אֲבִיכֶם
  choice: だが……おまえたちの父の神
  rationale: 接続詞は前半との対比を表すため「だが」とした。אֲבִיכֶם は複数の聞き手に対する「おまえたちの父」であり、「父」は単数のまま訳した。
- source_word: אֶמֶשׁ
  choice: 昨夜
  rationale: 直前の夜を指す文脈に合う、明瞭で自然な訳語。
- source_word: הִשָּׁמֶר לְךָ
  choice: よく気をつけよ
  rationale: 警告を表す再帰的な命令の強さを、簡潔で威厳ある日本語にした。
- source_word: מִדַּבֵּר עִם יַעֲקֹב
  choice: ヤコブに……言わないよう
  rationale: הִשָּׁמֶר と מִן の構文が表す禁止を、日本語として明確にした。דבר עם はこの文脈では「ヤコブに言う」とした。
- source_word: מִטּוֹב עַד רָע
  choice: 良いことも悪いことも
  rationale: 「良いことから悪いことまで」という両極表現を保ち、発言全般を禁じる慣用的意味は脚注で示した。
theological_decisions:
- issue: ラバンに語った神を指す אֱלֹהִים の訳
  choice: おまえたちの父の神
  alternative: おまえたちの父祖の神
  rationale: 原文の אָב は単数で、複数の聞き手に共通する父を指す形である。後代の神学的表現に広げず、本文の個人的・家族的な関係を保った。
- issue: 「良いことも悪いことも」の禁止範囲
  choice: 両極表現を本文に保持する
  alternative: ヤコブには何も言うな
  rationale: 慣用句としては発言全般の禁止を意味し得るが、神の警告が持つ原文の両極表現と含みを本文に残し、意味を脚注で補った。
translation_notes:
  register: ラバンの強い口調を「おまえたち」「気をつけよ」で表しつつ、古語に偏らない現代標準語とした。神の発言は簡潔で威厳ある命令調に整えた。
