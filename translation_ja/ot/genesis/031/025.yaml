base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/025.yaml
  text: And Laban caught up with Jacob[a]. Now Jacob had pitched his tent in the hill country[c][b], and Laban pitched with his kinsmen in the hill country of Gilead.
translation:
  language: ja
  text: ラバンはヤコブに追いついた。そのとき、ヤコブは山地に天幕を張っていた。ラバンも親族たち[b]とともに、ギルアデの山地[c]に天幕を張った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ヘブライ語では「自分の兄弟たち」。ここでは親族や一族の者たちを指すと考えられる。
    reason: lexical_alternative
  - marker: c
    text: 別訳「ギルアデ山に」または「ギルアデの山々に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשֵּׂג
  choice: 追いついた
  rationale: 追跡していた相手に達するという נשׂג の文脈上の意味を、捕縛まで含意せず自然な現代日本語で表す。
- source_word: תָּקַע ... אָהֳלוֹ
  choice: 天幕を張っており
  rationale: 「天幕を張る」という慣用表現。ラバンが追いついた時点ですでにヤコブが宿営していたという談話の流れを表した。
- source_word: בָּהָר
  choice: 山地に
  rationale: הַר は単独の山とも山岳・丘陵地域とも取れる。ここでは地域的な高地を指す可能性が高いため「山地」としたが、別解を注記した。
- source_word: תָּקַע אֶת אֶחָיו
  choice: 一族の者たちとともに…天幕を張った
  rationale: 原文は字義的には「彼の兄弟たちを伴って張った」という省略的構文。並行する前半から「天幕を」を補い、同行集団との宿営を自然に表した。
- source_word: אֶחָיו
  choice: 一族の者たち
  rationale: אָח は実の兄弟だけでなく、親族・同族の者を指し得る。この追跡隊の文脈では広い親族集団が適切である。
- source_word: בְּהַר הַגִּלְעָד
  choice: ギルアデの山地に
  rationale: 字義的には「ギルアデの山（地）に」。単一峰か山岳地域かという曖昧さを本文と注で保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「テント」より聖書叙事に適した「天幕」を用い、曖昧な地形語 הַר は「山地」としつつ注で単一峰・複数山地の可能性を示した。すべての脚注記号を対応語句の直後に配置した。
