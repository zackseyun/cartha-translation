  text: וַ/יֹּ֨אמֶר אֵלַ֜/י מַלְאַ֧ךְ הָ/אֱלֹהִ֛ים בַּ/חֲל֖וֹם יַֽעֲקֹ֑ב וָ/אֹמַ֖ר הִנֵּֽנִ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/011.yaml
  text: Then the angel of God said to me in the dream[a], ‘Jacob,’ and I said, ‘Here I am.’
translation:
  language: ja
  text: すると、神の御使いがその夢の中で私に言った。[a]「ヤコブ。」私は言った。「はい、ここにいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ある夢の中で」。ヘブライ語では「その夢の中で」。
    reason: 定冠詞を伴う原文の形と、日本語で可能な不定的理解の両方を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると、…言った
  rationale: 物語を進めるワイイクトールの働きを、自然な現代日本語の順接で表した。
- source_word: אֵלַי
  choice: 私に
  rationale: 前置詞と一人称単数接尾辞を直接的に訳した。
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: 神の御使い
  rationale: この文脈では天的な使者を指すため、聖書本文として自然で格調のある「御使い」を用いた。神との同一性については本文以上に断定しない。
- source_word: בַּחֲלוֹם
  choice: その夢の中で
  rationale: ヘブライ語の定冠詞を「その」で反映しつつ、日本語として自然になるよう「夢の中で」とした。
- source_word: יַעֲקֹב
  choice: ヤコブ
  rationale: 日本語聖書で定着した固有名詞表記を採用した。
- source_word: וָאֹמַר
  choice: 私は答えた
  rationale: 直訳は「私は言った」だが、呼びかけへの応答であることを自然な日本語で示した。
- source_word: הִנֵּנִי
  choice: はい、ここにおります
  rationale: 呼びかけに応じて自らを差し出す定型句の応答性と敬意を、自然な日本語で表した。
theological_decisions:
- issue: מַלְאַךְ הָאֱלֹהִים が神的存在との同一性を示唆し得る文脈での訳し方
  choice: 神の御使い
  alternative: 神の使者
  rationale: この節は存在を「神の御使い」と呼ぶにとどまり、その正体に関する神学的問題を明示的には解決していないため、伝統的かつ中立的な呼称を保った。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい品位を保った。「御使い」「ここにおります」によって天的使者と応答の敬意を自然に表現した。
