  text: וַ/יַּ֥עַן יַעֲקֹ֖ב וַ/יֹּ֣אמֶר לְ/לָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן תִּגְזֹ֥ל אֶת בְּנוֹתֶ֖י/ךָ מֵ/עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/031.yaml
  text: Then Jacob answered and said to Laban[a], “Because I was afraid, for I said[b], ‘Lest you take your daughters from me by force.’”
translation:
  language: ja
  text: ヤコブはラバンに答えた。「私は恐れていたのです。あなたがあなたの娘たちを私から無理に奪い取るのではないか、と考えたからです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「考えた」は直訳すると「言った」。ここでは心の中で言った、つまり考えた、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: 答えた
  rationale: ヘブライ語は直訳すれば「答えて言った」だが、現代日本語では一つの発話導入として「答えた」が自然であり、応答の意味も保てる。
- source_word: כִּי יָרֵאתִי
  choice: 私は恐れたのです
  rationale: 最初の כִּי は、ヤコブが密かに去った理由を示す。日本語では前後を二文に分け、「恐れたのです」とすることで因果関係を明確にした。
- source_word: כִּי אָמַרְתִּי
  choice: と考えたからです
  rationale: אָמַרְתִּי は字義的には「私は言った」だが、ここでは自分の内面で抱いた判断を表すため、「考えた」が自然である。字義的な表現は脚注に残した。
- source_word: פֶּן
  choice: のではないか
  rationale: 望ましくない事態への懸念を表す פֶּן を、現代日本語で自然な危惧の表現にした。
- source_word: תִּגְזֹל
  choice: 力ずくで奪い取る
  rationale: גזל が含む、不当に、また強引に奪うという強い意味を明示し、単なる「連れて行く」には弱めなかった。
- source_word: בְּנוֹתֶיךָ מֵעִמִּי
  choice: 娘たちを私から
  rationale: ラバンとの関係を示す「あなたの」は日本語では文脈上明白なため省き、「娘たち」とした。「私から」はヤコブのもとから引き離す意味を保つ。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。ヘブライ語の反復的な発話導入は自然な日本語に整えつつ、ヤコブの恐れと、娘たちが強制的に奪われるとの危惧を保持した。
