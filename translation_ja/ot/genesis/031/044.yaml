  yaml_path: translation/ot/genesis/031/044.yaml
  text: So now[a], come, let us make a covenant, you and I, and let it be a witness between me and you.
translation:
  language: ja
  text: 「さあ、あなたと私で契約を結ぼう[a]。そして、それを私とあなたの間の証しとしよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「契約を切ろう」。これは、契約を結ぶ、または成立させることを意味するヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה לְכָה
  choice: さあ
  rationale: וְעַתָּהは話を次の提案へ進め、לְכָהはここでは移動を命じるというより、相手を促す慣用的な呼びかけとして働く。両者を自然な現代日本語の「さあ」で表した。
- source_word: נִכְרְתָה בְרִית
  choice: 契約を結ぼう
  rationale: 直訳は「契約を切ろう」だが、כרת בריתは契約を締結することを表す定型句である。日本語の対応する自然な慣用表現として「契約を結ぶ」を用いた。
- source_word: אֲנִי וָאָתָּה
  choice: あなたと私で
  rationale: 契約の両当事者を明示する原文の強調を保ちつつ、自然な日本語の語順にした。
- source_word: וְהָיָה לְעֵד
  choice: そして、それが……証しとなるように
  rationale: 直前の勧誘・提案に続く意志的なニュアンスを「となるように」で表した。「それ」は直前の契約を受けるが、原文と同様、証しの具体的な形についてはここで説明を加えない。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 私とあなたとの間
  rationale: 原文の人称と順序を保ち、単に「私たちの間」とまとめず、双方を明示した。
