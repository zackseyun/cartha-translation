source:
  edition: WLC
  text: הֲ/ל֧וֹא נָכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖/וֹ כִּ֣י מְכָרָ֑/נוּ וַ/יֹּ֥אכַל גַּם אָכ֖וֹל אֶת כַּסְפֵּֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/015.yaml
  text: Are we not regarded by him as foreigners? For he has sold us and has indeed completely consumed our money[a].
translation:
  language: ja
  text: 父は私たちをよそ者と見なしているのではありませんか。父は私たちを売り、私たちのお金まで、すっかり使い果たしてしまったのです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すれば「私たちの銀を、まったく食べ尽くした」。ヘブライ語では「食べる」という語を比喩的に用い、不定詞絶対形によって完全に使い果たしたことを強調している。
    reason: 原文の比喩表現、כסף の「銀」という基本義、不定詞絶対形による強意を示すため。
lexical_decisions:
- source_word: הֲלֹוא
  choice: ではありませんか
  rationale: 肯定の答えを予期する修辞疑問を、自然な現代日本語で表した。
- source_word: נָכְרִיּוֹת
  choice: よそ者
  rationale: 家族の一員ではない者のように扱われているという娘たちの訴えを、性別を不必要に強調せず明確に伝える。
- source_word: נֶחְשַׁבְנוּ לוֹ
  choice: 父は私たちを…と見なしている
  rationale: ニファル形の「…と見なされる」という意味を、日本語として自然な能動構文に組み替えた。לוֹの指示対象は文脈上、父ラバンである。
- source_word: כִּי מְכָרָנוּ
  choice: 私たちを売ったうえに
  rationale: כִּיが示す根拠を前文から自然に続け、完了した売却行為に加えて金銭も費消したという累加関係を表した。
- source_word: וַיֹּאכַל גַּם אָכוֹל
  choice: まで、すっかり使い果たしてしまった
  rationale: 定形動詞と不定詞絶対形による強意、およびגַּםの累加を反映し、金銭を完全に費消した意味を自然な日本語で示した。原文の「食べる」という比喩は脚注に残した。
- source_word: אֶת כַּסְפֵּנוּ
  choice: 私たちのお金
  rationale: כֶּסֶףは「銀」と「金銭」の両義を持つが、ここでは財産上の訴えとして「お金」が明瞭である。「私たちの」を保持し、その金銭に対する娘たちの権利意識を訳文に残した。
