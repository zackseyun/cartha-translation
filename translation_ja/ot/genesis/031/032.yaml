  to: あなたの神々を持っている者が見つかったなら、その者は生きていてはなりません[a]。私たちの兄弟たち[b]の前で、私のところにある物の中からあなたの物を見定めて、自分で持って行ってください。」ヤコブは、ラケルがその神々[c]を盗んだことを知らなかった。
