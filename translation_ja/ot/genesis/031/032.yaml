id: GEN.31.32
reference: Genesis 31:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת אֱלֹהֶי/ךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧י/נוּ הַֽכֶּר לְ/ךָ֛ מָ֥ה עִמָּדִ֖/י וְ/קַֽח לָ֑/ךְ וְ/לֹֽא יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/032.yaml
  text: Whoever is found with your gods shall not live[a]. In the presence of our brothers, identify what of yours is with me[c][b], and take it for yourself.” Jacob did not know that Rachel had stolen them.
translation:
  language: ja
  text: あなたの神々を持っている者が見つかったなら、その者は生きていてはなりません[a]。私たちの兄弟たち[b]の前で、私のところにある物の中からあなたの物を見定めて、自分で持って行ってください。」ヤコブは、ラケルがその神々[c]を盗んだことを知らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「あなたがあなたの神々をだれのもとで見つけても、その者は生きていてはならない」となります。
    reason: lexical_alternative
  - marker: b
    text: 「兄弟たち」は、実の兄弟だけでなく、その場にいた男性の親族や同族の者たちを指すことがあります。
    reason: cultural_note
  - marker: c
    text: 「その神々」とは、ラバンの神々、すなわち家の神々の像を指します。
    reason: referent_clarification
lexical_decisions:
- source_word: עִם אֲשֶׁר תִּמְצָא
  choice: あなたの神々が見つかった者は
  rationale: 原文は直訳すると「あなたが〔神々を〕見つける者とともに」だが、日本語では所有・所持が判明する者を指す不定関係表現として自然に訳した。二人称単数の探索主体がラバンであることは文脈上明らかである。
- source_word: אֱלֹהֶיךָ
  choice: あなたの神々
  rationale: 語そのものは複数形で「あなたの神々」を意味する。文脈上は家の守り神像を指すが、この節の当該箇所にתְּרָפִיםは用いられていないため、本文では原語に即した表現を保った。
- source_word: לֹא יִחְיֶה
  choice: 生きていてはなりません
  rationale: 死を宣告する、または呪いを述べる定型的な強い表現である。単なる未来予告にも、特定の執行主体を明示する表現にも限定せず、原文の規範的な力を保った。
- source_word: נֶגֶד אַחֵינוּ
  choice: 私たちの兄弟たちの前で
  rationale: נֶגֶדを「前で」、אַחֵינוּを字義どおり「私たちの兄弟たち」とした。ここでの「兄弟」は実の兄弟に限らず、親族や同族の男性たちを含みうるため注を付した。
- source_word: הַכֶּר לְךָ מָה עִמָּדִי
  choice: 私のもとにある物のうち、どれがあなたの物か見分けて
  rationale: 原文の「私とともにあるものを、あなたのために見分けよ」という省略的な言い方を、所有物を調べて特定する場面に即して明瞭な日本語にした。
- source_word: וְקַח לָךְ
  choice: 持って行ってください
  rationale: 命令形と利害の与格לָךְを、日本語で自然な「持って行く」によって表した。文脈上「自分のものとして受け取る」含意がある。
- source_word: וְלֹא יָדַע יַעֲקֹב
  choice: ヤコブは…知らなかった
  rationale: 語り手による説明的挿入として、接続詞を機械的に訳さず自然な叙述にした。
- source_word: גְּנָבָתַם
  choice: それらを盗んだ
  rationale: 複数接尾辞「それら」は先の「神々」を受ける。盗みがヤコブの発言以前に起きていたことは、日本語では従属節と「知らなかった」の組み合わせで自然に示される。
theological_decisions:
- issue: לֹא יִחְיֶהが死の予告、呪い、処刑宣告のいずれであるか
  choice: 「生きていてはなりません」とし、強い死の宣告を示しつつ執行主体を特定しない
  alternative: 「その者を生かしてはおきません」または「その者は死ぬでしょう」
  rationale: 前者はヤコブ自身が処刑するという主体性を原文以上に明示し、後者は規範的・宣告的な力を弱める。原文の神学的・法的な緊張を残した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、ヤコブの発言には丁寧語を用いて対話としての自然さと品位を保った。「生きていてはなりません」はやや改まった宣告調とし、原文の厳しさを弱めていない。
