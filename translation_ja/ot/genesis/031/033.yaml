  text: וַ/יָּבֹ֨א לָבָ֜ן בְּ/אֹ֥הֶל יַעֲקֹ֣ב וּ/בְ/אֹ֣הֶל לֵאָ֗ה וּ/בְ/אֹ֛הֶל שְׁתֵּ֥י הָ/אֲמָהֹ֖ת וְ/לֹ֣א מָצָ֑א וַ/יֵּצֵא֙ מֵ/אֹ֣הֶל לֵאָ֔ה וַ/יָּבֹ֖א בְּ/אֹ֥הֶל רָחֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/033.yaml
  text: So Laban went into Jacob’s tent[a], and into Leah’s tent, and into the tent of the two female servants, but he did not find them. Then he came out of Leah’s tent and went into Rachel’s tent.
translation:
  language: ja
  text: ラバンはヤコブの天幕、レアの天幕、そして二人の女奴隷の天幕に入ったが、見つけられなかった[a]。それからレアの天幕を出て、ラケルの天幕に入った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、何を見つけられなかったのかは明示されていない。文脈上は、ラバンが捜していた家の神々を指す。
    reason: implicit_object
lexical_decisions:
- source_word: וַיָּבֹא ... בְּאֹהֶל
  choice: ～の天幕に入った
  rationale: בוא に前置詞 בְּ が伴い、ある場所の中へ入る動きを表す。日本語では「天幕に入った」が自然で、捜索の移動も明確に伝わる。
- source_word: אֹהֶל
  choice: 天幕
  rationale: 遊牧的な族長物語の具体的な住居を指すため、一般化した「住まい」ではなく「天幕」とした。
- source_word: שְׁתֵּי הָאֲמָהֹת
  choice: 二人の女召使い
  rationale: אָמָה は従属的身分にある女性の召使い・奴隷を指す。この節では家内の立場を自然な現代日本語で示す「女召使い」とし、語の性別も保持した。
- source_word: וְלֹא מָצָא
  choice: 見つけることができなかった
  rationale: ヘブライ語では目的語が明示されていないため、日本語でも補わず、文脈上の捜し物を脚注で示した。接続詞は捜索結果との対照を表す「が」とした。
- source_word: וַיֵּצֵא מֵאֹהֶל לֵאָה
  choice: それからレアの天幕を出て
  rationale: יצא の退出の意味と、物語を進める連続形を、自然な順接表現で示した。
- source_word: וַיָּבֹא בְּאֹהֶל רָחֵל
  choice: ラケルの天幕に入った
  rationale: 前半と同じ בוא＋בְּ の移動表現を同じ訳語で再現し、捜索の順序を保った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。列挙の反復感は「ヤコブの天幕、レアの天幕、そして…」で保ちつつ、日本語として過度にぎこちなくならない形にした。原文どおり、女召使いたちの天幕に言及した後で「レアの天幕を出て」と続く順序を修正せず保持した。
