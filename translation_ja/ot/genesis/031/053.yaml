  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽ/אלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔י/נוּ אֱלֹהֵ֖י אֲבִי/הֶ֑ם וַ/יִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּ/פַ֖חַד אָבִ֥י/ו יִצְחָֽק׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/053.yaml
  text: May the God of Abraham and the god of Nahor[a], the god of their father, judge between us[c][b]. And Jacob swore by the Fear of his father Isaac.
translation:
  language: ja
  text: 「アブラハムの神とナホルの神、彼らの父の神[a]が、私たちの間を裁かれますように。」ヤコブは、父イサクの「畏れ」[b]にかけて誓った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アブラハムの神」「ナホルの神」「彼らの父の神」は、同じ神を言い換えたものとも、それぞれに結び付く神々を指すものとも読める。ヘブライ語の「裁く」は複数形。
    reason: alternative_reading
  - marker: b
    text: 直訳。「畏れ」は「恐れ、戦慄」を意味する語で、ここでは神を指す異例の呼称として用いられている。別訳「父イサクが畏れる方」。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי אַבְרָהָם
  choice: アブラハムの神
  rationale: אֱלֹהֵי は形態上は複数形の連語形だが、ここではアブラハムに結び付く神を指す通常の表現として訳した。
- source_word: וֵאלֹהֵי נָחוֹר
  choice: ナホルの神
  rationale: 同じ אֱלֹהֵי を自然に訳しつつ、アブラハムの神と同一か別かを本文で断定しない。日本語には英語の God/god に相当する大文字・小文字の区別がないため、注で曖昧さを明示した。
- source_word: אֱלֹהֵי אֲבִיהֶם
  choice: 彼らの父の神
  rationale: 先行する呼びかけへの同格または補足と読める語順を保った。「父」は直訳であり、特定の祖先名を補わない。
- source_word: יִשְׁפְּטוּ
  choice: 裁かれますように
  rationale: 三人称複数未完了形を願望的な祈願として訳した。複数動詞が示す緊張関係は、神の同一性をめぐる注で示す。敬語形は神への呼びかけにふさわしい自然な日本語とした。
- source_word: בֵינֵינוּ
  choice: 私たちの間を
  rationale: 契約当事者間の判定を求める文脈に即した簡潔な訳。
- source_word: וַיִּשָּׁבַע
  choice: こうして…誓った
  rationale: 物語を進めるワウ連続形を、前文を受ける自然な叙述として訳した。
- source_word: בְּפַחַד
  choice: 「畏れ」にかけて
  rationale: פַּחַד の基本義である「恐れ、畏れ」を、ここで神を指す異例の呼称として保持した。かぎ括弧により通常の感情名詞ではなく称号的用法であることを示した。
- source_word: אָבִיו יִצְחָק
  choice: 父イサクの
  rationale: ヤコブの父がイサクであることを示す同格表現を、簡潔で自然な日本語にした。
theological_decisions:
- issue: ラバンが挙げた「アブラハムの神」「ナホルの神」「彼らの父の神」を同一の神とみなすか
  choice: 本文では同じ「神」を用い、同一とも別々とも断定しない
  alternative: 「アブラハムの神とナホルの神、すなわち彼らの父の神」として、一柱の神への同格表現であることを明示する
  rationale: ヘブライ語は אֱלֹהֵי を繰り返す一方、動詞 יִשְׁפְּטוּ は複数形である。日本語では英語の大文字・小文字による区別ができないため、本文の開かれた構文と注によって神学的緊張を保存した。
- issue: בְּפַחַד אָבִיו יִצְחָק の神的称号
  choice: 父イサクの「畏れ」
  alternative: 父イサクが畏れる方／父イサクの神
  rationale: 原文の異例な名詞的呼称を残し、「神」と説明的に言い換えて独特の表現を平板化しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、神への祈願には「裁かれますように」という敬意ある表現を用いた。異例の神的称号は、説明的に解消せず、かぎ括弧と注で読者に分かる形にした。
