  text: אִם תְּעַנֶּ֣ה אֶת בְּנֹתַ֗/י וְ/אִם תִּקַּ֤ח נָשִׁים֙ עַל בְּנֹתַ֔/י אֵ֥ין אִ֖ישׁ עִמָּ֑/נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥/י וּ/בֵינֶֽ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/050.yaml
  text: If you mistreat my daughters[a], or if you take wives besides my daughters—though no man is with us—see, God is witness between me and you.
translation:
  language: ja
  text: もしあなたが私の娘たちを苦しめたり、私の娘たちのほかに妻を迎えたりするなら、たとえ私たちと一緒にいる人がだれもいなくても[a]、見よ、神は私とあなたとの間の証人だ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「私たちと共に人はいない」。その場に人間の証人がいないという意味。
    reason: 原文の簡潔な叙述と、本文で示した譲歩的な関係を明らかにするため。
lexical_decisions:
- source_word: תְּעַנֶּה
  choice: 苦しめる
  rationale: ピエル形は、結婚生活において娘たちを虐げ、つらい目に遭わせることを指す。「苦しめる」は意味の幅を保ちつつ、現代日本語として自然である。
- source_word: בְּנֹתַי
  choice: 私の娘たち
  rationale: 所有を伴う複数形をそのまま明確に訳し、原文どおり二度繰り返した。
- source_word: תִּקַּח נָשִׁים עַל בְּנֹתַי
  choice: 私の娘たちのほかに妻をめとる
  rationale: 娘たちに代えてではなく、彼女たちに加えて別の妻を迎えるという慣用句の意味を表す。
- source_word: אֵין אִישׁ עִמָּנוּ
  choice: たとえ今、私たちと一緒にいる人がだれもいなくても
  rationale: その場に人間の証人がいないにもかかわらず、神が証人であるという文脈上の対比を自然な日本語で示した。「人」はここで אִישׁ の一般的人間の意味を表す。
- source_word: רְאֵה
  choice: 見よ
  rationale: 厳粛な警告に注意を促す命令形の直接性と荘重さを保つ。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 契約の証人として呼びかけられる単数の神を指す。
- source_word: עֵד
  choice: 証人
  rationale: 契約上の責任を見届ける者という法的・厳粛な意味を明確に表す。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 私とおまえとの間
  rationale: 両者の間にある契約上の関係と責任を示す定型句を自然に訳した。
theological_decisions:
- issue: אֵין אִישׁ עִמָּנוּ と神の証言との論理関係
  choice: 「たとえ……いなくても」と譲歩的に訳す
  alternative: 「私たちと一緒にいる人はだれもいない」と独立した叙述にする
  rationale: ヘブライ語には譲歩を明示する接続詞はないが、直後の「神が……証人である」との対比から、人間の証人がいなくても神が証人となるという含意が強い。脚注で字義的な構文を示し、原文の簡潔さと解釈上の余地も残した。
- issue: אִישׁ の一般的人間としての用法
  choice: 人
  alternative: 男
  rationale: ここでの論点は男性に限らず、人間の証人がその場にいないことである。日本語の「男」は不必要に性別を限定するため、文脈上の一般的意味を「人」で表した。
translation_notes:
  register: 現代の読者に明瞭でありながら、契約の警告にふさわしい荘重さを保った。「めとる」「見よ」「証人である」を用いて格調を持たせ、「おまえ」はラバンからヤコブへの直接的で厳しい呼びかけを表す。
