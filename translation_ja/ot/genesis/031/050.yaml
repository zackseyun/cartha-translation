  to: もしあなたが私の娘たちを苦しめたり、私の娘たちのほかに妻を迎えたりするなら、たとえ私たちと一緒にいる人がだれもいなくても[a]、見よ、神は私とあなたとの間の証人だ。
  rationale: 原文にない「今」を削除し、原文から確定できない粗い二人称を中立的な「あなた」に改めた。その他は、条件構文、追加の妻を迎えるという意味、および神が両者の間の証人であるという契約上の警告を維持している。
