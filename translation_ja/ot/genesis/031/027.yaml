base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/027.yaml
  text: Why did you hide yourself to flee and steal away from me[a], and not tell me, so that I might have sent you away with joy and with songs[d][c][b], with tambourine and lyre?
translation:
  language: ja
  text: なぜ、おまえは身を隠して逃げ、私に黙って立ち去り、私に知らせなかったのか。知らせてくれれば、私は喜びと歌、タンバリンと竪琴をもって、おまえを送り出してやれたのに。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָמָּה
  choice: なぜ
  rationale: 理由を問う標準的な疑問語として、現代日本語で自然かつ簡潔に表した。
- source_word: נַחְבֵּאתָ לִבְרֹחַ
  choice: 身を隠して逃げ
  rationale: נחבא の再帰的な意味「身を隠す」と ברח の「逃げる」をともに明示し、ラバンの非難の調子を保った。
- source_word: וַתִּגְנֹב אֹתִי
  choice: 私に黙って立ち去った
  rationale: 直訳は「私を盗んだ」だが、ここでは相手に気づかれないようひそかに去るというヘブライ語の慣用表現。日本語で意味が明瞭になるよう訳した。
- source_word: וְלֹא הִגַּדְתָּ לִּי
  choice: なぜ私に知らせなかったのか
  rationale: נגד のヒフィル形を「知らせる」とし、原文の並列的な問いを自然な日本語の独立した問いとして表した。
- source_word: וָאֲשַׁלֵּחֲךָ
  choice: おまえを送り出したものを
  rationale: 実現しなかった送別の可能性を、反実的な含みを持つ日本語表現で示した。
- source_word: בְּשִׂמְחָה וּבְשִׁרִים
  choice: 喜びのうちに、歌と
  rationale: 送別の喜ばしい様子と歌を区別しつつ、現代日本語として滑らかにした。
- source_word: בְּתֹף
  choice: タンバリン
  rationale: תֹף は手で打つ枠太鼓を指す。古風な「タンバリン（ティンブレル）」系の訳語より、一般読者に理解しやすい語を選んだ。
- source_word: וּבְכִנּוֹר
  choice: 竪琴
  rationale: כִּנּוֹר はリラ型の弦楽器。日本語で理解しやすく、一般的な「琴」より形態を想起しやすい「竪琴」とした。
theological_decisions: []
translation_notes:
  register: ラバンからヤコブへの非難として、「おまえ」を用いて関係性と口調を明確にした。全体は現代標準日本語で読みやすくしつつ、「送り出したものを」によって、実現しなかった送別への不満を保った。楽器名は一般読者への明瞭さを優先した。
