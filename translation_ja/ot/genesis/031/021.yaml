  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּבְרַ֥ח הוּא֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּ֖קָם וַ/יַּעֲבֹ֣ר אֶת הַ/נָּהָ֑ר וַ/יָּ֥שֶׂם אֶת פָּנָ֖י/ו הַ֥ר הַ/גִּלְעָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/021.yaml
  text: So he fled with all that was his[a], and he arose and crossed the River, and set his face toward the hill country of Gilead.
translation:
  language: ja
  text: こうして彼は、自分のものすべてを伴って逃げ、立ち上がって大河[a]を渡り、ギルアドの山地に顔を向けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユーフラテス川」とも訳せる。ヘブライ語では単に「大河」。文脈上、ユーフラテス川を指すと考えられる。
    reason: 地名の同定には文脈的判断が伴うため、本文では原文の表現を保ち、脚注で明示した。
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: 逃げ
  rationale: 圧迫や危険を避けて立ち去るという ברח の基本的な意味を、簡潔な現代日本語で表す。
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: 自分のものすべてを伴って
  rationale: 所有物だけでなく、家族や従者を含み得る広い表現であるため、対象を狭めない訳とした。
- source_word: וַיָּקָם
  choice: 立ち上がって
  rationale: קום の動作を保ちつつ、物語の次の行動への移行を自然な日本語で示す。
- source_word: וַיַּעֲבֹר אֶת־הַנָּהָר
  choice: 大河を渡り
  rationale: עבר の「渡る」をそのまま表し、定冠詞付きの נהר は文脈上特定の大河を指す表現として訳した。
- source_word: הַנָּהָר
  choice: 大河
  rationale: 文脈上ユーフラテス川を指す可能性が高いが、原文が固有名を明記していないことを保つため、本文では「大河」とした。
- source_word: וַיָּשֶׂם אֶת־פָּנָיו
  choice: 顔を向けた
  rationale: 直訳的な身体表現を自然な日本語として保持し、意図的に進路を定めた含みも残す。
- source_word: הַר הַגִּלְעָד
  choice: ギルアドの山地
  rationale: הר は単一の山だけでなく山岳地域も表し得るため、地理的文脈に合う地域的な意味で訳した。
theological_decisions: []
