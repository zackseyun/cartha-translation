source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל יַעֲקֹ֔ב שׁ֛וּב אֶל אֶ֥רֶץ אֲבוֹתֶ֖י/ךָ וּ/לְ/מוֹלַדְתֶּ֑/ךָ וְ/אֶֽהְיֶ֖ה עִמָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/003.yaml
  text: Then Yahweh said to Jacob[a], “Return to the land of your fathers and to your kindred, and I will be with you.”
translation:
  language: ja
  text: そのとき、ヤハウェはヤコブに言った。「あなたの先祖の地、あなたの生まれた地[a]に帰りなさい。わたしはあなたとともにいよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの親族」とも訳せる。ヘブライ語は、親族・同族を指す場合と、出生地や出身地を指す場合がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そのとき、…言った
  rationale: 物語を進めるワウ継続法の順接的な働きを、自然な現代日本語の叙述として表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
- source_word: שׁוּב
  choice: 帰りなさい
  rationale: 元いた場所へ戻ることを命じる語であり、文脈に即した自然で明瞭な命令表現とした。
- source_word: אֶרֶץ אֲבוֹתֶיךָ
  choice: あなたの先祖の地
  rationale: 直訳的な「父たちの地」が日本語では実父たちだけを指すようにも響くため、世代をさかのぼる一族を自然に表す「先祖」を用いた。
- source_word: מוֹלַדְתֶּךָ
  choice: あなたの生まれ故郷
  rationale: この語は親族集団または出生地・出身地を表し得る。ここでは「先祖の地」と並ぶ帰還先を示すため、地理的意味を本文に採用し、語義の幅は脚注に残した。
- source_word: וְאֶהְיֶה עִמָּךְ
  choice: わたしはあなたとともにいる
  rationale: 神の臨在の約束を、簡潔で格調を保った現代日本語で表した。日本語の現在形は、帰還に際して継続する将来的な臨在も自然に含意する。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文は称号ではなく四文字神名を明記しているため、固有名として音写し、称号への置換を避けた。
- issue: 「わたしはあなたとともにいる」の時間的含意
  choice: 現在形による継続的な約束
  alternative: 「わたしはあなたとともにいよう」
  rationale: ヘブライ語未完了形は将来の約束を示すが、神の臨在を継続的に語る余地もある。「いる」は日本語で確かな約束として自然であり、意志表現に限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発言にふさわしい簡潔さと品位を保った。「生まれ故郷」は一般読者に分かりやすく、原語の別の可能性は脚注で明示した。
