id: GEN.31.24
reference: Genesis 31:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל לָבָ֥ן הָ/אֲרַמִּ֖י בַּ/חֲלֹ֣ם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִשָּׁ֧מֶר לְ/ךָ֛ פֶּן תְּדַבֵּ֥ר עִֽם יַעֲקֹ֖ב מִ/טּ֥וֹב עַד רָֽע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/024.yaml
  text: But God came to Laban the Aramean in a dream at night and said to him[c][b][a], “Be careful not to speak to Jacob either good or bad.”
translation:
  language: ja
  text: しかし、その夜、神は夢の中でアラム人ラバンのもとに来て、彼に言われた。「気をつけなさい。ヤコブに良いことも悪いことも、いっさい言ってはならない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「良いことから悪いことまで」。良いことにせよ悪いことにせよ、何も言わないことを意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 来て
  rationale: בוא の物語形を基本義どおり「来る」とし、明示されていない「現れる」を補わない。日本語では「ラバンのもとに来て」とすることで自然にした。
- source_word: לָבָן הָאֲרַמִּי
  choice: アラム人ラバン
  rationale: אֲרַמִּי は民族名「アラム人」を表す。伝統的な「シリア人」より原語に即している。
- source_word: בַּחֲלֹם הַלָּיְלָה
  choice: その夜、夢の中で
  rationale: 「夢の中で」と「夜」の両要素を、現代日本語で自然な時間・状況表現として保持した。定冠詞を踏まえ「その夜」とした。
- source_word: הִשָּׁמֶר לְךָ
  choice: 気をつけなさい
  rationale: 再帰的な警告の慣用句であり、現代日本語で明瞭かつ十分に厳粛な表現とした。
- source_word: פֶּן תְּדַבֵּר עִם יַעֲקֹב
  choice: ヤコブに……言ってはならない
  rationale: פֶּן の警告・制止の力を「してはならない」で表した。דבר עם は文脈上、ヤコブに言葉を向けることを指す。
- source_word: מִטּוֹב עַד רָע
  choice: 良いことも悪いことも、いっさい
  rationale: 直訳は「良いことから悪いことまで」。両極を示して一切の発言を禁じる慣用表現であるため、原語の対句を残しつつ意味を明確にした。
theological_decisions:
- issue: אֱלֹהִים の指示対象
  choice: 神
  alternative: 神々／ある神的存在
  rationale: 動詞が単数形であり、物語の文脈でも唯一の神を指すため、「神」とした。
- issue: 禁止される発言の範囲
  choice: 良いことも悪いことも含め、いっさい言わないこと
  alternative: 好意的または敵対的な特定の発言だけを禁じること
  rationale: מִטּוֹב עַד רָע は両極によって全範囲を表す慣用句である。ただし原語の緊張感を保つため「良いことも悪いことも」を本文に残した。
translation_notes:
  register: 明瞭な現代標準語を用い、神の発言には「言われた」を用いて品位を保った。「アラム人」は原語の民族名を反映する。接続詞 וַ は直前の追跡場面との対照・転換を示すため「しかし」とした。
