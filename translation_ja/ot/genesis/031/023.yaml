base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/023.yaml
  text: And he took his kinsmen with him[a], and pursued him for a journey of seven days[d][c][b], and caught up with him in the hill country of Gilead.
translation:
  language: ja
  text: そこでラバンは親族たち[a]を連れ、ヤコブを追って七日分の道のりを進み、ギルアドの山地[b]で彼に追いついた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の兄弟たち」。ヘブライ語は、実の兄弟だけでなく、親族や同族の者たちを広く指すことがある。
    reason: lexical_alternative
  - marker: b
    text: または「ギルアドの山で」。ヘブライ語は、特定の山ともギルアド地方の山地とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: 一族の者たち
  rationale: 基本義は「兄弟たち」だが、ここではラバンが伴った親族・同族の者たちを広く指すと考えられるため。「親族」より集団として自然で、「兄弟」だけに限定しない。
- source_word: וַיִּרְדֹּף אַחֲרָיו
  choice: ヤコブの後を追い
  rationale: רדף と אחר の追跡表現を、自然な現代日本語で明確に表した。代名詞が連続して曖昧になるのを避けるため、追われる者を「ヤコブ」と明示した。
- source_word: דֶּרֶךְ שִׁבְעַת יָמִים
  choice: 七日間の道のりを
  rationale: דֶּרֶךְ の「道・旅程」のニュアンスを保ち、単に追跡期間が七日だったという以上に、七日分の旅程を進んだことを表す。
- source_word: וַיַּדְבֵּק אֹתוֹ
  choice: 彼に追いついた
  rationale: 追跡の文脈における דבק は、接近して追いつくことを意味する。「追い越した」ではなく、自然で文脈に合う「追いついた」とした。
- source_word: בְּהַר הַגִּלְעָד
  choice: ギルアドの山地
  rationale: הַר は単一の山も山地も表し得る。文脈上は地域名として理解しやすいため「山地」とし、単一峰の可能性は脚注に残した。
theological_decisions: []
