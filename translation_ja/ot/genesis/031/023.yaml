  to: そこでラバンは親族たち[a]を連れ、ヤコブを追って七日分の道のりを進み、ギルアドの山地[b]で彼に追いついた。
  rationale: 追跡対象を「ヤコブを」、行程の長さを「七日分の道のりを進み」として分け、原文の意味を損なわずに日本語の係り受けを明瞭にした。また、「親族たち」によりאֶחָיוの文脈上の広い親族的意味を自然に表した。脚注は、兄弟という狭義の可能性と、ギルアドを単一の山と取る可能性を保持している。
