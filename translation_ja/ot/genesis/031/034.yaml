  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/רָחֵ֞ל לָקְחָ֣ה אֶת הַ/תְּרָפִ֗ים וַ/תְּשִׂמֵ֛/ם בְּ/כַ֥ר הַ/גָּמָ֖ל וַ/תֵּ֣שֶׁב עֲלֵי/הֶ֑ם וַ/יְמַשֵּׁ֥שׁ לָבָ֛ן אֶת כָּל הָ/אֹ֖הֶל וְ/לֹ֥א מָצָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/034.yaml
  text: Rachel had taken the household idols[a], put them in the camel’s saddle cushion, and sat on them. Laban felt through the whole tent[c][b], but did not find them.
translation:
  language: ja
  text: ラケルはすでに家の神像[a]を取り、らくだの鞍の敷物[b]の中に入れ、その上に座っていた。ラバンは天幕の中をくまなく手で探ったが、見つけられなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「テラフィム」「家の神々」。ヘブライ語は、家庭内の祭祀に用いられた物や神像を指す。
    reason: lexical_alternative
  - marker: b
    text: または「らくだの鞍」「らくだの鞍具」。ヘブライ語は、らくだの騎乗具に用いるクッション状の部分を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: 家の神像
  rationale: テラフィムは家庭内の祭祀に用いられた物や神像を指す。「家の神像」は、専門語をそのまま音写せず、物体であることと家庭祭祀との関係を明瞭に伝える。原語だけでは像の具体的な形状や機能を確定できないため、脚注で幅を残す。
- source_word: בְּכַר הַגָּמָל
  choice: らくだの鞍の敷物の中に
  rationale: כַּר は敷物、クッション、詰め物をした用具を表し、ここではらくだの騎乗具の一部と考えられる。「鞍の敷物」は具体像を自然な日本語で示しつつ、「鞍」そのものと断定しない。
- source_word: וַתֵּשֶׁב עֲלֵיהֶם
  choice: その上に座っていた
  rationale: 動作の順序は保ちつつ、後続するラバンの捜索に先立つ背景状況として自然に読めるよう継続状態で表した。複数形の代名詞は、日本語では「その上」で自然に受ける。
- source_word: וַיְמַשֵּׁשׁ
  choice: 手で探った
  rationale: משׁשׁ が表す、触覚を用いて探すというニュアンスを明示し、一般的な「捜した」より原文に近づけた。
- source_word: כָּל הָאֹהֶל
  choice: 天幕の中をくまなく
  rationale: 直訳的な「天幕全体を」よりも、内部を隅々まで捜索したという意味を自然な現代日本語で表す。
- source_word: וְלֹא מָצָא
  choice: 見つけられなかった
  rationale: 原文では目的語が省略されているため、日本語でも文脈から神像を指すことが明らかな形で省略した。וְ の流れにある期待外れの結果は「が」で表した。
- source_word: וְרָחֵל לָקְחָה
  choice: ラケルはすでに…取っていた
  rationale: 完了形が後続の捜索より前の出来事を背景説明として示すことを、「すでに」と「ていた」で明確にした。接続詞 waw を機械的に「さて」「そして」とせず、日本語の自然な場面展開にした。
theological_decisions:
- issue: תְּרָפִים の宗教的評価
  choice: 本文では「家の神像」とし、物体性と家庭祭祀との関連を示す
  alternative: 「偶像」「家の神々」「テラフィム」
  rationale: 「偶像」は強い否定的評価を前面に出し、「家の神々」は対象そのものを神々と断定しやすい。「テラフィム」は一般読者に不透明であるため、本文は記述的な表現とし、脚注で別訳と語義の幅を示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語文としての品位を保った。「くまなく手で探った」により触覚的な捜索を自然に表し、テラフィムとらくだの鞍具については本文で過度に専門的・断定的にならないよう脚注で語義の幅を示した。
