source:
  edition: WLC
  text: וַ/יַּ֨עַן לָבָ֜ן וַ/יֹּ֣אמֶר אֶֽל יַעֲקֹ֗ב הַ/בָּנ֨וֹת בְּנֹתַ֜/י וְ/הַ/בָּנִ֤ים בָּנַ/י֙ וְ/הַ/צֹּ֣אן צֹאנִ֔/י וְ/כֹ֛ל אֲשֶׁר אַתָּ֥ה רֹאֶ֖ה לִ/י ה֑וּא וְ/לִ/בְנֹתַ֞/י מָֽה אֶֽעֱשֶׂ֤ה לָ/אֵ֨לֶּה֙ הַ/יּ֔וֹם א֥וֹ לִ/בְנֵי/הֶ֖ן אֲשֶׁ֥ר יָלָֽדוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/043.yaml
  text: Then Laban answered and said to Jacob[a], “The daughters are my daughters, and the sons are my sons, and the flock is my flock, and all that you see is mine. But what can I do this day for these my daughters, or for their children whom they have borne?”
translation:
  language: ja
  text: ラバンはヤコブに答えて言った。「娘たちは私の娘たち、息子たちは私の息子たち、群れは私の群れだ。あなたが見ているものはすべて私のものだ。しかし今日、私はこの娘たちのために、また彼女たちが産んだ子どもたちのために、何ができるだろうか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子どもたち」は「息子たち」とも訳せる。
    reason: בְּנֵיהֶןは子ども一般を指すことも、男子に限定して指すこともできるため。
lexical_decisions:
- source_word: וַיַּעַן לָבָן וַיֹּאמֶר אֶל יַעֲקֹב
  choice: ラバンはヤコブに答えて言った
  rationale: 「答える」と「言う」の連続を保ち、ヘブライ語物語文の応答表現を自然で格調ある日本語にした。
- source_word: הַבָּנוֹת בְּנֹתַי
  choice: 娘たちは私の娘
  rationale: 名詞の反復によるラバンの強い身内意識と所有的主張を保った。
- source_word: וְהַבָּנִים בָּנַי
  choice: 息子たちは私の息子
  rationale: ここでは「娘たち」と並ぶ男性の子孫を指すため、בניםを「息子たち」とした。
- source_word: וְהַצֹּאן צֹאנִי
  choice: 群れは私の群れ
  rationale: צאןは羊や山羊などの小家畜をまとめて指す集合名詞なので、簡潔に「群れ」とした。
- source_word: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא
  choice: あなたが見ているものはすべて私のものだ
  rationale: 簡潔な所有の主張として訳し、強調された一人称の権利主張を明確にした。
- source_word: מָה אֶעֱשֶׂה ... הַיּוֹם
  choice: しかし今日、私は……何ができるだろうか
  rationale: 未完了形を文脈上の可能性を問う修辞疑問として訳した。「今日」は現代日本語で自然に時間的限定を表す。
- source_word: לִבְנֹתַי ... לָאֵלֶּה
  choice: この娘たちに
  rationale: לを対象を示す「に」とし、近称表現を「この娘たち」として自然にまとめた。
- source_word: אוֹ לִבְנֵיהֶן אֲשֶׁר יָלָדוּ
  choice: また娘たちが産んだ子どもたちに
  rationale: בניםは形式上「息子たち」も可能だが、ここでは娘たちの子孫一般を指し得るため本文では「子どもたち」とし、限定的な読みを注記した。
theological_decisions:
- issue: ラバンの修辞疑問が善意・不能・自制のいずれを意味するか
  choice: 「何ができるだろうか」とし、発言の修辞性だけを示した
  alternative: 「何をしてやれるだろうか」「どうして危害を加えられようか」
  rationale: 原文は行為の内容やラバンの内心を明示しないため、慈愛や加害不能という解釈を本文に付加しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「答えて言った」と名詞反復を残して物語文の格調と原文の強調を保った。修辞疑問では曖昧さを維持し、ラバンの動機を補わなかった。
