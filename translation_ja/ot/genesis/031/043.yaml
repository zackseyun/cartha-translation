  to: ラバンはヤコブに答えて言った。「娘たちは私の娘たち、息子たちは私の息子たち、群れは私の群れだ。あなたが見ているものはすべて私のものだ。しかし今日、私はこの娘たちのために、また彼女たちが産んだ子どもたちのために、何ができるだろうか。[a]」
