base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/008.yaml
  text: If he said this, ‘The speckled will be your wages,’ then all the flock bore speckled young; and if he said this, ‘The streaked will be your wages,’ then all the flock bore streaked young.
translation:
  language: ja
  text: もし彼が、『ぶちの羊をおまえの報酬とする』と言えば、群れの羊はすべて、ぶちの子を産んだ。もし彼が、『しまの羊をおまえの報酬とする』と言えば、群れの羊はすべて、しまの子を産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נְקֻדִּים
  choice: ぶちのもの／ぶちの子
  rationale: 斑点のある家畜を表す語。日本語で家畜の毛色を自然かつ明瞭に示す「ぶち」を用いた。
- source_word: עֲקֻדִּים
  choice: しまのもの／しまの子
  rationale: 縞状の模様のある家畜を指すため、平易な「しま」を選んだ。
- source_word: שְׂכָרֶךָ
  choice: おまえの報酬
  rationale: 雇用の対価を意味する語なので「報酬」とし、ヤコブへの直接の呼びかけを「おまえ」で表した。
- source_word: וְיָלְדוּ
  choice: 産んだ
  rationale: 羊の群れを集合的な主語として、子を産むことを自然な日本語で表現した。
- source_word: אִם כֹּה יֹאמַר
  choice: もし彼が……と言えば
  rationale: 条件を示す אִם と指示的な כֹּה を、日本語として自然な条件節にまとめた。反復される二つの条件の並行性を保持した。
theological_decisions: []
