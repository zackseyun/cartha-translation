    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見ると
  rationale: ראהの物語用法を保ちつつ、後続する観察内容へ自然につなぐ現代日本語とした。
- source_word: פְּנֵי לָבָן
  choice: ラバンの顔つき
  rationale: 直訳的な「顔」の具体性を残しながら、ここで表情や態度が問題となっていることを自然に伝える。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 後続内容への注意と、ヤコブが変化に気づいた際の物語的な強調を、現代日本語で表した。
- source_word: אֵינֶנּוּ עִמּוֹ
  choice: ラバンは……ヤコブに好意的でなかった
  rationale: 字義的には「彼は彼と共にいなかった」だが、文脈ではラバンのヤコブに対する態度・意向を表す慣用的表現である。日本語で代名詞の曖昧さを避けるため固有名を明示した。
- source_word: כִּתְמוֹל שִׁלְשׁוֹם
  choice: 以前のようには
  rationale: 字義的な「昨日、一昨日のように」は過去の状態を指す慣用句であり、「以前のように」が自然で正確である。
