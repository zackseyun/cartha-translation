id: GEN.31.46
reference: Genesis 31:46
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֤ב לְ/אֶחָי/ו֙ לִקְט֣וּ אֲבָנִ֔ים וַ/יִּקְח֥וּ אֲבָנִ֖ים וַ/יַּֽעֲשׂוּ גָ֑ל וַ/יֹּ֥אכְלוּ שָׁ֖ם עַל הַ/גָּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/046.yaml
  text: Then Jacob said to his brothers[a], “Gather stones.” So they took stones and made a heap[b], and they ate there by the heap.
translation:
  language: ja
  text: そこでヤコブは自分の兄弟たち[a]に、「石を集めなさい」と言った。彼らは石を取り、石塚を作り、その石塚のそばで[b]食事をした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たち」は、実の兄弟だけでなく、ヤコブと共にいた男性の親族や仲間を広く指す可能性がある。
    reason: cultural_note
  - marker: b
    text: 直訳すると「石塚の上で」。ここで用いられたヘブライ語の前置詞は、「上で」とも「そばで」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֶחָיו
  choice: 自分の兄弟たち
  rationale: אָחの基本義である「兄弟」を保った。この語は文脈によって男性の親族や仲間を広く指すことがあるため、その可能性は脚注に示した。
- source_word: לִקְטוּ אֲבָנִים
  choice: 石を集めなさい
  rationale: לקטの命令形を、石を拾い集める行為として自然で明瞭な現代日本語にした。
- source_word: וַיִּקְחוּ אֲבָנִים
  choice: 彼らは石を取り
  rationale: לקחの通常の意味を簡潔に訳し、直前の命令に応じる一連の動作を保った。
- source_word: וַיַּעֲשׂוּ גָל
  choice: 石塚を作り
  rationale: גַּלはここでは石を積み上げた塚を指す。「石塚」は一般読者に分かりやすく、単なる「山」より具体的である。
- source_word: וַיֹּאכְלוּ שָׁם עַל הַגָּל
  choice: その石塚のそばで食事をした
  rationale: עַלは基本的に「上に」だが、位置関係を表して「そばで」とも理解できる。文脈上自然な「そばで」を本文に置き、より字義的な可能性を脚注に残した。אכלはこの場面では単に物を食べたというより共同の食事をしたことを自然に表すため「食事をした」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。物語の簡潔な動作の連なりを保ちつつ、「兄弟たち」と前置詞עַלにある意味の幅は脚注で明示した。
