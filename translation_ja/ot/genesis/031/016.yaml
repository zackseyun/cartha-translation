source:
  edition: WLC
  text: כִּ֣י כָל הָ/עֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽ/אָבִ֔י/נוּ לָ֥/נוּ ה֖וּא וּ/לְ/בָנֵ֑י/נוּ וְ/עַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖י/ךָ עֲשֵֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/016.yaml
  text: For all the wealth that God has taken from our father belongs to us and to our children. So now[a], whatever God has said to you, do.
translation:
  language: ja
  text: 実際、神が私たちの父から取り去った[a]富はすべて、私たちと子どもたちのものです。ですから今、神があなたに言われたことは何でも、そのとおりにしてください。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神が救い出した」とも訳せる。原語はしばしば救出や解放を表すが、ここでは神がラバンのもとから富を移されたことを指す。
    reason: 原語の「救出」と「取り去る」という意味の幅を保持するため。
lexical_decisions:
- source_word: כִּי
  choice: （独立した接続語を置かず、文脈上の説明として表現）
  rationale: 直前の問いへの理由・根拠を示す語。日本語では文脈によって説明関係が明らかなため、「なぜなら」を置かないほうが自然である。
- source_word: כָל הָעֹשֶׁר
  choice: 富はすべて
  rationale: עֹשֶׁרは財産や家畜を含み得る広い意味の「富」。語順を日本語として自然に整えつつ、כָלの全体性を「すべて」で保持した。
- source_word: הִצִּיל
  choice: 取り去られた
  rationale: נצלのヒフィル形は通常「救い出す、奪い去る」を意味するが、ここでは富をラバンのもとから移した神の行為を指す。「取り去る」は移動の意味を明確にしつつ、富そのものの救出という不自然な印象を避ける。語の救出・解放の含意は脚注に残した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この物語でまことの神を指す標準的な訳語。
- source_word: מֵאָבִינוּ
  choice: 私たちの父から
  rationale: 前置詞מןが示す起点を簡潔に表した。
- source_word: לָנוּ הוּא וּלְבָנֵינוּ
  choice: 私たちと子どもたちのものです
  rationale: 与格による帰属・所有の意味を、現代日本語で明瞭に表した。
- source_word: וְעַתָּה
  choice: ですから今
  rationale: 理由の提示から勧告へ移る推論的な流れを自然に示す。
- source_word: כֹּל אֲשֶׁר אָמַר אֱלֹהִים אֵלֶיךָ
  choice: 神があなたに言われたことは何でも
  rationale: כֹּל אֲשֶׁרの包括性を「何でも」で保ち、神がヤコブに語った内容全体を指す自然な表現とした。
- source_word: עֲשֵׂה
  choice: そのとおりにしてください
  rationale: 簡潔な命令形。日本語では先行する発言内容を受ける「そのとおりに」を補うことで、意味を変えず自然で明瞭にした。
theological_decisions:
- issue: ラバンの富に対する神の行為
  choice: 「取り去られた」と訳す。
  alternative: 「救い出された」「取り戻された」
  rationale: 原語には救出・解放と奪取・除去の意味領域がある。この文脈では富が父ラバンのもとからヤコブの家族へ移されたことが中心であるため「取り去られた」とした。「取り戻された」では、その富が以前から娘たちに法的に属していたとの解釈を本文に強く織り込むおそれがある。救出の語感は脚注で示し、神の摂理的行為を窃盗とも法的返還とも断定しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、姉妹たちの共同発言として「私たち」を採用した。命令は家族間の発言にふさわしく「してください」とし、過度に古風または威圧的な語調を避けながら、簡潔さと品位を保った。
