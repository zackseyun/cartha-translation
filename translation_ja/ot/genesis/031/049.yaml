base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/049.yaml
  text: And Mizpah[a], because he said[b], “May Yahweh watch between me and you when we are hidden from each other.”
translation:
  language: ja
  text: また、それをミツパ[a]とも呼んだ。こう言ったからである。「私たちが互いに見えなくなるとき、ヤハウェが私とあなたとの間を見張ってくださるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ミツパ」は、ヘブライ語の「見張り所」を意味する語と響き合い、後の「見張ってくださるように」という言葉に結びついている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמִּצְפָּה
  choice: また、ミツパとも呼んだ
  rationale: מִצְפָּה は「見張り所」を意味し得る語だが、ここでは地名として用いられているため「ミツパ」と音写した。日本語として文脈を明瞭にするため、命名を表す「とも呼んだ」を補った。
- source_word: אֲשֶׁר אָמַר
  choice: 彼がこう言ったからである
  rationale: 直訳的には「彼が言ったところの」だが、ここでは地名の由来を説明する節なので、因果関係を自然な日本語で示した。
- source_word: יִצֶף
  choice: 見張ってくださるように
  rationale: צפה の未完了形で、願望的な意味を表す。「見張る」は地名ミツパとの語呂合わせを保ち、「くださるように」で祈願を示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、称号に置き換えず日本語で音写した。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 私とあなたとの間を
  rationale: 原文の語順と、双方の間を神が監視するという意味を保った。日本語では動詞「見張る」の目的範囲として「間を」が自然である。
- source_word: כִּי נִסָּתֵר אִישׁ מֵרֵעֵהוּ
  choice: 私たちが互いに見えない所にいるとき
  rationale: נִסָּתֵר は字義的には「隠されている／隠れている」、אִישׁ מֵרֵעֵהוּ は相互的に「互いから」を表す。ここでは互いの目が届かない状況を指すため、自然で明瞭な表現とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文が固有名を明記しているため、その区別を保って音写した。
- issue: ヤハウェの「見張り」の含意
  choice: 祈願として訳し、祝福か警戒かを限定しない
  alternative: 守ってくださるように
  rationale: 契約の文脈では神が双方を監視する証人となる緊張があり、「守る」とすると保護の意味に狭まり得るため、原語に近い「見張る」を採った。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、祈願の文には簡潔で荘重な調子を保った。原文だけでは省略されている命名動詞を前節から補い、「とも呼んだ」とした。英語POBの脚注[b]は本文表現の別訳に関するものだが、日本語本文で「互いに見えない所にいる」と明示したため、独立した脚注は不要と判断した。
