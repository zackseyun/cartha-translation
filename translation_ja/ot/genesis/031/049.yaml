  terminology: 「ミツパ」と「ヤハウェ」は適切である。「見張ってくださるように」は、保護に限定されがちな「守る」を避け、צפהの監視・注視の含意と祈願形を保っている。地名と『見張る』の語のつながりを示す脚注も有益である。
