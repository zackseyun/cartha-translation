base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/051.yaml
  text: Then Laban said to Jacob[a], “Look at this mound[b], and look at the pillar that I have set up between me and you.”
translation:
  language: ja
  text: ラバンはヤコブに言った。「この石塚[a]を見なさい。また、私とあなたとの間に私が立てた石柱[b]を見なさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この石の山」とも訳せる。ヤコブとラバンの間で証しとなるように積まれた石を指す。
    reason: lexical_alternative
  - marker: b
    text: 「立て石」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ継続法の順次性は、日本語では文脈と語順によって自然に伝わるため、過度に接続語を補わず簡潔に訳した。
- source_word: הִנֵּה … וְהִנֵּה
  choice: 見なさい……そして見なさい
  rationale: 注意を促す指示的な語を命令形で表し、原文の反復と並行性も保持した。
- source_word: הַגַּל הַזֶּה
  choice: この石塚
  rationale: גַּל はこの文脈では証しとして積まれた石の集まりを指す。「石塚」は単なる土の盛り上がりではなく、石を積んだ標識であることを簡潔に示す。
- source_word: הַמַצֵּבָה
  choice: 石柱
  rationale: 立てられた記念の石を指すため、現代日本語で自然かつ具体的な「石柱」とした。
- source_word: יָרִיתִי
  choice: 私が立てた
  rationale: 基本的には投げる・据えることに関わる動詞だが、目的語が石柱であるこの箇所では、設置したことを自然に表す「立てた」が適切である。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: 私とあなたとの間に
  rationale: 両者を隔て、また結ぶ標識の位置を示す原文の関係表現をそのまま明確に伝える。
