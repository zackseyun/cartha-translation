  text: וַ/יִּנְהַ֣ג אֶת כָּל מִקְנֵ֗/הוּ וְ/אֶת כָּל רְכֻשׁ/וֹ֙ אֲשֶׁ֣ר רָכָ֔שׁ מִקְנֵה֙ קִנְיָנ֔/וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּ/פַדַּ֣ן אֲרָ֑ם לָ/ב֛וֹא אֶל יִצְחָ֥ק אָבִ֖י/ו אַ֥רְצָ/ה כְּנָֽעַן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/018.yaml
  text: And he drove all his livestock and all his possessions that he had acquired—the livestock he had acquired in Paddan-aram—to go to Isaac his father in the land of Canaan[a].
translation:
  language: ja
  text: 彼は、すべての家畜を追い立て、彼が手に入れたすべての財産、すなわちパダン・アラムで手に入れた家畜を携えて、父イサクのもと、カナンの地へ向かった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「カナンの地の方へ」。ヘブライ語には方向を示す語形が使われている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנְהַג
  choice: 追って……進んだ
  rationale: נהגは家畜を後ろから追って移動させることを表す。日本語では目的地へ向かう文全体と自然につながるよう「追って……進んだ」とした。
- source_word: מִקְנֵהוּ
  choice: 彼のすべての家畜
  rationale: מִקְנֶהは羊や山羊、牛などを含む集合的な語なので、範囲を狭めない現代語「家畜」が適切。所有接尾辞は「彼の」で示した。
- source_word: רְכֻשׁוֹ
  choice: 彼が手に入れたすべての財産
  rationale: רְכוּשׁは取得した動産や財物を広く指す。「財産」は簡潔で自然であり、続く関係節とともに意味を明確にする。
- source_word: רָכָשׁ
  choice: 手に入れた
  rationale: רכשの「取得する」という経済的意味を、堅すぎない現代日本語で表した。同語の反復も訳文に残した。
- source_word: מִקְנֵה קִנְיָנוֹ
  choice: 手に入れた家畜
  rationale: 語源的な反復を伴い、取得した家畜を強調する表現。日本語で不自然な重複を避けつつ、後続のרָכַשׁと合わせて取得の意味を保った。
- source_word: בְּפַדַּן אֲרָם
  choice: パダン・アラムで
  rationale: 地名は音写し、場所を表す前置詞בְּを「で」とした。
- source_word: לָבוֹא אֶל יִצְחָק אָבִיו
  choice: 父イサクのもとへ……進んだ
  rationale: 不定詞לָבוֹאの目的・方向性を、日本語では移動動詞「進んだ」と目的地を示す「もとへ」によって自然に表した。
- source_word: אַרְצָה כְּנָעַן
  choice: カナンの地を目指して
  rationale: 方向を示す語尾־ָהを明示し、カナンへ向かう移動を自然な日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文にある「手に入れた」の反復は保持しつつ、מִקְנֵה קִנְיָנוֹの語源的重複は日本語として過度に不自然にならないよう整理した。脚注記号[a]は本文中に配置した。
