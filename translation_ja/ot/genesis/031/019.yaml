- from: ラバンは自分の羊の群れの毛を刈りに出かけていた。その間に、ラケルは父の所有する家の偶像[a]を盗んだ。
  to: ラバンが自分の家畜の群れの毛を刈りに出かけている間に、ラケルは父のものである家庭の偶像[a]を盗んだ。
  rationale: 小家畜全体を指し得る צֹאן の幅を「家畜の群れ」により保持した。ラバンの不在を背景として表す文脈上の関係は維持しつつ、父への所属とテラフィムの家庭的・祭祀的性格が自然に読めるよう語順と表現を改めた。
