  text: וְ/לָבָ֣ן הָלַ֔ךְ לִ/גְזֹ֖ז אֶת צֹאנ֑/וֹ וַ/תִּגְנֹ֣ב רָחֵ֔ל אֶת הַ/תְּרָפִ֖ים אֲשֶׁ֥ר לְ/אָבִֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/019.yaml
  text: Laban had gone to shear his flock[a], and Rachel stole the household idols that belonged to her father.
translation:
  language: ja
  text: ラバンが自分の家畜の群れの毛を刈りに出かけている間に、ラケルは父のものである家庭の偶像[a]を盗んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語「テラフィム」。家庭に属する祭祀像を指し、「家の神々」とも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלַךְ
  choice: 出かけていた
  rationale: 物語の主要動作に先立つ背景を表す完了形として理解し、ラケルが行動した時にはラバンが不在だったことを自然な日本語で示す。
- source_word: לִגְזֹז אֶת צֹאנוֹ
  choice: 自分の羊の群れの毛を刈りに
  rationale: גזז は羊などの毛を刈ることを指し、צֹאן は羊や山羊を含み得る集合語だが、この作業の文脈では「羊の群れ」が明瞭で自然である。
- source_word: וַתִּגְנֹב
  choice: 盗んだ
  rationale: גנב の道徳的・法的含意を弱めず、明確に表す。
- source_word: הַתְּרָפִים
  choice: 家の偶像
  rationale: 家庭に属する祭祀像を指す語であるため、その家庭的性格と偶像としての機能を、現代の一般読者に分かる表現で示す。専門語「テラフィム」は脚注に残す。
- source_word: אֲשֶׁר לְאָבִיהָ
  choice: 父の所有する
  rationale: 父に属していたという所有関係を、自然で簡潔な日本語で表す。
- source_word: וְ
  choice: その間に
  rationale: 単なる逐語的な「そして」ではなく、ラバンの不在という背景とラケルの行動との時間的関係を文脈に即して示す。ただし原文に独立した「今」に相当する語はないため、それは加えない。
theological_decisions:
- issue: 不正な礼拝対象を指す תְּרָפִים の訳し方
  choice: 家の偶像
  alternative: テラフィム／家の神々
  rationale: 家庭祭祀に用いられた像であることを明瞭にしつつ、それらを実在の神々と認定するような表現を避ける。原語固有の文化的含みは脚注で保持する。
translation_notes:
  register: 明瞭で現代的ながら品位ある物語文。「その間に」は、ラバンが毛刈りに出て不在であったことを背景として示す構文関係を自然に表す。
