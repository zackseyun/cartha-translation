  text: Then Rachel and Leah answered and said to him[b][a], “Do we still have any share or inheritance in our father’s house?”
translation:
  language: ja
  text: すると、ラケルとレアは彼に答えた。「父の家[b]には、私たちの分け前[a]も相続財産も、まだあるのでしょうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「分け前」は「取り分」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「父の家」は、建物としての家だけでなく、父の家族集団や家産を指すことがある。
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעַן רָחֵל וְלֵאָה וַתֹּאמַרְנָה לוֹ
  choice: すると、ラケルとレアは彼に答えた
  rationale: 二つの発話動詞を日本語で逐語的に「答えて言った」と重ねるより、応答と発話先の双方を自然に表す。「彼に」は原文の לוֹ を保持した。
- source_word: הַעוֹד לָנוּ
  choice: 私たちには…まだ…あるというのでしょうか
  rationale: 疑問辞と עוֹד の継続・残存の含意を保ち、反語的にも読める問いを明示的に断定しない形にした。
- source_word: חֵלֶק
  choice: 分け前
  rationale: 家産における割り当て分を、現代日本語で自然かつ具体的に示す。
- source_word: וְנַחֲלָה
  choice: 相続財産
  rationale: 世襲の所有・受け継ぐ財産という文脈上の意味を明確にし、「分け前」との並列も保持する。
- source_word: בְּבֵית אָבִינוּ
  choice: 父の家に
  rationale: 原文の「家」を形式的に保ちつつ、それが住居だけでなく家族集団や家産を指し得ることは注で示す。
