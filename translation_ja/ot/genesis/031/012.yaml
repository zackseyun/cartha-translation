base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/012.yaml
  text: 'And he said[a], “Please lift up your eyes and see: all the male goats that are mating with the flock are striped, speckled, and spotted[b], for I have seen all that Laban is doing to you.”'
translation:
  language: ja
  text: 彼は言った。「どうか、目を上げて見なさい。群れに交尾している[a]雄やぎは皆、縞のあるもの[b]、斑点のあるもの、まだらのものだ。ラバンがあなたにしていることを、わたしはすべて見た。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「群れの上に乗っている」。ヘブライ語では動物の繁殖を表す言い回し。
    reason: lexical_alternative
  - marker: b
    text: 「縞のあるもの」と訳したヘブライ語は、「輪模様のあるもの」「帯模様のあるもの」などとも訳される。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא נָא עֵינֶיךָ
  choice: さあ、目を上げて
  rationale: 「目を上げる」という原文の慣用表現を保ちつつ、נָא の柔らかな促しを現代日本語の「さあ」で自然に表した。
- source_word: וּרְאֵה
  choice: 見なさい
  rationale: 視覚を強調する命令形を、明瞭で品位ある現代日本語にした。
- source_word: הָעַתֻּדִים
  choice: 雄やぎ
  rationale: עתודים はここでは雄のやぎを指す。「雄羊」より家畜の種類を正確に伝える。
- source_word: הָעֹלִים עַל הַצֹּאן
  choice: 群れと交尾している
  rationale: 動物の繁殖場面における עלה על の婉曲的な用法を、曖昧さのない自然な日本語で表した。
- source_word: עֲקֻדִּים
  choice: 縞のあるもの
  rationale: 帯状または筋状の模様を示す語として理解しやすく、後続する二種類の斑紋とも区別しやすい。伝統的な訳語の幅は脚注で示した。
- source_word: נְקֻדִּים
  choice: 斑点のあるもの
  rationale: 小さな点状の模様を表す語として、一般読者に明瞭な表現を選んだ。
- source_word: וּבְרֻדִּים
  choice: まだらのもの
  rationale: 色の入り交じった斑模様を表し、「斑点のあるもの」との区別も可能な限り保った。
- source_word: כִּי רָאִיתִי
  choice: わたしは……見ている
  rationale: 完了形の認識と現在への関わりを、日本語では継続的な結果を表す「見ている」で自然に示した。כִּי の説明・理由のつながりは文脈上明らかなため、接続詞を補わず語順で強調した。
- source_word: אֵת כָּל אֲשֶׁר לָבָן עֹשֶׂה לָּךְ
  choice: ラバンがあなたにしていることを、すべて
  rationale: 分詞 עֹשֶׂה の進行・継続性を「している」で表し、לָּךְ は文脈に即して被害・影響を受ける相手を示す「あなたに」とした。
theological_decisions: []
