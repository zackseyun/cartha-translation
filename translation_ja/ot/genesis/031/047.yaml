  text: וַ/יִּקְרָא ל֣/וֹ לָבָ֔ן יְגַ֖ר שָׂהֲדוּתָ֑א וְ/יַֽעֲקֹ֔ב קָ֥רָא ל֖/וֹ גַּלְעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/047.yaml
  text: Laban called it Jegar-sahadutha[b][a], but Jacob called it Galeed.
translation:
  language: ja
  text: ラバンはそれをエガル・サハドタ[a]と呼び、ヤコブはガルエド[b]と呼んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エガル・サハドタ」はアラム語で「証しの石塚」という意味。
    reason: 名称の原語と意味を示し、後半のヘブライ語名との対応を明らかにするため。
  - marker: b
    text: 「ガルエド」はヘブライ語で「証しの石塚」という意味。
    reason: 名称の原語と意味を示し、前半のアラム語名との対応を明らかにするため。
lexical_decisions:
- source_word: וַיִּקְרָא ... לָבָן
  choice: ラバンは……と呼び
  rationale: קרא ל־ はこの命名の文脈で「……と呼ぶ」の意。物語の簡潔な調子を保つ。
- source_word: לּוֹ
  choice: それを
  rationale: 形態上は男性単数の代名詞だが、文脈上は直前に築かれた石塚を指すため、現代日本語では「それを」が自然。
- source_word: יְגַר שָׂהֲדוּתָא
  choice: エガル・サハドタ[a]
  rationale: ラバンによるアラム語の名称なので、命名行為と言語の違いを保つため本文では音写し、意味は脚注で示す。語頭の י はこのアラム語形では「エ」に近い音写とした。
- source_word: וְיַעֲקֹב
  choice: ヤコブは
  rationale: 接続詞 ו は単純な継起・並置として訳せる。二つの異なる名称の対照は文の並列自体で明らかなため、明示的な逆接語は加えない。
- source_word: קָרָא לּוֹ
  choice: ……と呼んだ
  rationale: 前半と同じ命名表現として訳語をそろえた。日本語では目的語「それを」の反復を省いても指示対象が明瞭で自然。
- source_word: גַּלְעֵד
  choice: ガルエド[b]
  rationale: ヤコブによるヘブライ語の名称を音写し、アラム語名との対応を保持する。意味は脚注で示す。
theological_decisions: []
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。二つの名称を音写して、ラバンのアラム語とヤコブのヘブライ語の対照を脚注で伝える。脚注記号は各名称の直後に置いた。
