id: GEN.31.9
reference: Genesis 31:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּצֵּ֧ל אֱלֹהִ֛ים אֶת מִקְנֵ֥ה אֲבִי/כֶ֖ם וַ/יִּתֶּן לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/009.yaml
  text: So God took away your father's livestock and gave it to me[a].
translation:
  language: ja
  text: こうして神は、あなたがたの父の家畜を取り上げ、それを私に与えられた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「奪い取って」、または「救い出して」とも訳せる。ヘブライ語の動詞には、ある者の手から取り去り、別の者へ移すという意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּל
  choice: 取り上げ
  rationale: ヒフィル形の נצל は、ある者の手から取り去る、救い出す、奪い取るという意味領域を持つ。ここではラバンからヤコブへの家畜の移転が焦点なので、危険からの救出に限定せず、移転を明確に表す「取り上げ」とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: ここではヤコブのために行動する神を指す一般的な神名であり、自然な日本語として「神」とした。
- source_word: מִקְנֵה
  choice: 家畜
  rationale: 取得した財産、とりわけ飼育動物を表す語。ヤコブとラバンの群れをめぐる文脈では「財産」より具体的で、「牛」より範囲の広い「家畜」が適切である。
- source_word: אֲבִיכֶם
  choice: あなたがたの父の
  rationale: 単数の「父」に二人称男性複数接尾辞が付き、レアとラケルに対して、二人に共通する父ラバンを指す。「あなたがたの父」として数の関係を保持した。
- source_word: וַיִּתֶּן לִי
  choice: それを私に与えられた
  rationale: נתן と「私に」により、先行する集合名詞「家畜」の移転を表す。日本語では目的語を「それ」と補い、神への敬意を自然に示すため尊敬表現とした。
theological_decisions:
- issue: ヤコブの繁栄における神の主体的行為
  choice: 神がラバンの家畜を取り上げ、ヤコブに与えたと直接表現する。
  alternative: 単に神がヤコブを祝福したという穏やかな表現にする。
  rationale: ヘブライ語は וַיַּצֵּל と וַיִּתֶּן によって、取り去りと授与の双方を明示的に神の行為としているため、その強い主体性を弱めない。
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。「こうして」で前の説明を受け、集合的な「家畜」は「それ」で受けた。「取り上げ」は移転の意味を保ちつつ、「強奪」と断定する過度な含意を避ける。
