id: GEN.31.42
reference: Genesis 31:42
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לוּלֵ֡י אֱלֹהֵ֣י אָבִ/י֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּ/פַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔/י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑/נִי אֶת עָנְיִ֞/י וְ/אֶת יְגִ֧יעַ כַּפַּ֛/י רָאָ֥ה אֱלֹהִ֖ים וַ/יּ֥וֹכַח אָֽמֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/042.yaml
  text: If the God of my father[a], the God of Abraham, and the Fear of Isaac, had not been with me, surely by now you would have sent me away empty-handed. God saw my affliction and the labor of my hands, and he judged last night.
translation:
  language: ja
  text: もし、私の父の神、アブラハムの神、そして「イサクの畏れ」[a]が私と共にいてくださらなかったなら、あなたはきっと今ごろ、私を何も持たせずに送り出していたでしょう。神は私の苦しみと、私の手の労苦をご覧になり、昨夜、裁きを下されました。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「イサクが畏れる方」。ヘブライ語では直訳すると「イサクの畏れ」で、神を指す独特な呼び名です。
    reason: 原文の特異な神称を保ちながら、有力な解釈を示すため。
  - marker: b
    text: 「裁きを下されました」は、「戒められました」または「判定されました」とも訳せます。原文には、その対象が明記されていません。
    reason: 動詞の法廷的・叱責的な意味幅と、目的語の不在を明示するため。
lexical_decisions:
- source_word: לוּלֵי
  choice: もし……いてくださらなかったなら
  rationale: 反実仮想の条件を、現代日本語で明確かつ自然に表す。
- source_word: אֱלֹהֵי אָבִי
  choice: 私の父の神
  rationale: 連語の構造を保ち、父祖との関係を明示する。文脈上「父」はイサクを指すが、本文では原文どおり一般名詞を保つ。
- source_word: וּפַחַד יִצְחָק
  choice: そして「イサクの畏れ」
  rationale: פחד の「恐れ・畏れ」という意味と、神を指す独特な呼称を保持する。日本語では敬虔な含意を表しやすい「畏れ」を選び、引用符で称号であることを示す。
- source_word: הָיָה לִי
  choice: 私と共にいてくださった
  rationale: 直訳的には「私のために／私に属していた」だが、ここでは神の臨在と助けを表すため、自然な敬語表現とした。
- source_word: כִּי עַתָּה
  choice: きっと今ごろ
  rationale: 反実仮想の帰結における強調と時間的意味を併せて表す。
- source_word: רֵיקָם
  choice: 何も持たせずに
  rationale: 財産や報酬を与えず空手で去らせる意味を、平明な日本語で表す。
- source_word: שִׁלַּחְתָּנִי
  choice: 私を……去らせていたでしょう
  rationale: 反実仮想に対応させつつ、ラバンがヤコブを送り出す／追い返す行為を過度に限定しない。
- source_word: עָנְיִי
  choice: 私の苦しみ
  rationale: 貧困だけでなく、圧迫や惨めな境遇を含む広い意味を自然に伝える。
- source_word: יְגִיעַ כַּפַּי
  choice: 私の手の労苦
  rationale: 肉体的な勤労を示すヘブライ語の比喩を保ちつつ、日本語として理解可能な表現とする。
- source_word: וַיּוֹכַח
  choice: 裁きを下されました
  rationale: יכח の裁定・判定・戒めという意味幅を保つ。目的語が明示されていないため「あなたを叱責した」とはせず、神が争いに介入して裁定した意味を表す。
- source_word: אָמֶשׁ
  choice: 昨夜
  rationale: 直近の夜、すなわち神がラバンに夢で警告した夜を指す標準的な訳。
theological_decisions:
- issue: וּפַחַד יִצְחָק という神の称号
  choice: 「イサクの畏れ」
  alternative: 「イサクが畏れる方」／「イサクの恐れ」
  rationale: 原文の特異な名詞表現と神学的緊張を本文に残す。「イサクが畏れる方」は有力な説明だが、関係の向きを解釈によって確定するため脚注に置く。
- issue: וַיּוֹכַח の意味と目的語
  choice: 裁きを下されました
  alternative: 戒められました／判定されました／あなたを叱責されました
  rationale: 語には法廷的な裁定と叱責の両面があり、直前の神の警告とも結びつく。ただし原文には明示的な目的語がないため、ラバンを目的語として補わず、曖昧さを保つ。
- issue: 神についての敬語
  choice: いてくださる／ご覧になる／下される
  alternative: いた／見た／裁いた
  rationale: 現代の一般読者にとって自然で品位ある聖書文体とするため、神の行為に節度ある尊敬表現を用いる。意味内容は追加しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、神の称号とヤコブの厳粛な訴えには品位を保った。「イサクの畏れ」は不自然さを完全には解消せず、原文固有の表現として引用符と脚注で支えた。反実仮想は「もし……なかったなら……ていたでしょう」で明確にした。
