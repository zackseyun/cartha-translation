id: GEN.31.39
reference: Genesis 31:39
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: טְרֵפָה֙ לֹא הֵבֵ֣אתִי אֵלֶ֔י/ךָ אָנֹכִ֣י אֲחַטֶּ֔/נָּה מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נָּה גְּנֻֽבְתִ֣י י֔וֹם וּ/גְנֻֽבְתִ֖י לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/031/039.yaml
  text: I did not bring to you an animal torn by beasts[a]; I myself bore the loss of it. You required it from my hand[b], whether stolen by day or stolen by night.
translation:
  language: ja
  text: 野獣にかみ裂かれた家畜を、私はあなたのもとに持って行かず、自分でその損失を負いました[a]。昼に盗まれたものも、夜に盗まれたものも、あなたは私に償いを求めました[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私自身がそれを償いました」。この動詞はここでは、失われた家畜について責任を負い、損失を穴埋めすることを意味します。
    reason: lexical_alternative
  - marker: b
    text: 直訳「あなたはそれを私の手から求めました」。「手から求める」は、その人に責任を問い、償いを要求することを表す言い方です。
    reason: hebrew_idiom
lexical_decisions:
- source_word: טְרֵפָה
  choice: 野獣にかみ裂かれた家畜
  rationale: 語義は野獣などに裂かれた動物を指す。この牧畜の文脈では家畜であることを明示すると、現代日本語で具体的かつ自然に伝わる。
- source_word: הֵבֵאתִי אֵלֶיךָ
  choice: あなたのもとに持って行かず
  rationale: ביא＋אלの方向性を保ち、ヤコブが被害を受けた家畜をラバンのもとへ持参しなかったことを表す。
- source_word: אָנֹכִי אֲחַטֶּנָּה
  choice: 自分でその損失を負いました
  rationale: 独立代名詞אָנֹכִיの強調を「自分で」で示した。חטאのピエル形はここで損失の責任を負う、または穴埋めする意であり、「損失を負う」はその幅を保つ。
- source_word: מִיָּדִי תְּבַקְשֶׁנָּה
  choice: あなたは私に償いを求めました
  rationale: 直訳的な「私の手から求めた」は責任追及を表すヘブライ語慣用句であるため、日本語では意味が明瞭な「私に償いを求めた」とした。
- source_word: גְּנֻבְתִי יוֹם וּגְנֻבְתִי לָיְלָה
  choice: 昼に盗まれたものも、夜に盗まれたものも
  rationale: 接続詞וּの加算的な並列を「も……も」で表し、昼夜いずれの盗難損失についても責任を問われたことを明確にした。
theological_decisions:
- issue: 引き裂かれた家畜の損失と盗まれた家畜の損失との関係
  choice: 二つの損失類型を連続して述べる構文として訳す
  alternative: 「それが昼に盗まれても夜に盗まれても」のように、一つの対象についての選択条件として訳す
  rationale: 後半は「昼に盗まれたもの」と「夜に盗まれたもの」をוּで結ぶため、野獣に裂かれた家畜とは別に、盗難による損失全般を列挙していると読むのが文脈と統語に適う。
translation_notes:
  register: 現代の一般読者に明瞭な標準日本語としつつ、ヤコブが自らの忠実な労働を弁明する場面にふさわしい丁寧で引き締まった語調を用いた。「かみ裂かれた」は具体的な被害像を保ち、「損失を負う」「償いを求める」で牧畜上の責任関係を自然に表した。
