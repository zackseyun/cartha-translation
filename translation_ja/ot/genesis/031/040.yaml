  text: By day the heat consumed me[a], and the frost by night, and my sleep fled from my eyes.
translation:
  language: ja
  text: 私は、昼には暑さに、夜には霜に食い尽くされ、眠りは目から逃げ去った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָיִיתִי
  choice: 私はこうだった
  rationale: 一人称の状態を導入する完了形を明示し、後続する過酷な状況の描写へ自然につなげた。
- source_word: בַיּוֹם
  choice: 昼は
  rationale: בַּלָּיְלָה「夜は」との時間的対照と簡潔な並行表現を保った。
- source_word: אֲכָלַנִי
  choice: 食い尽くされ
  rationale: 動詞 אכל の「食べる」という鮮烈な比喩を残しつつ、日本語では熱と霜を行為者とする受け身の形にして自然にした。
- source_word: חֹרֶב
  choice: 灼熱
  rationale: ここでは夜の霜と対照される、昼間の乾いた厳しい暑さを指すため、「灼熱」とした。
- source_word: וְקֶרַח
  choice: 夜は霜に
  rationale: קֶרַח は氷や霜を表す。夜間の厳しい冷え込みという文脈に合う「霜」を選んだ。
- source_word: וַתִּדַּד
  choice: 逃げ去った
  rationale: 去る、逃げるという稀な動詞の擬人化された表現を保った。
- source_word: שְׁנָתִי
  choice: 眠りは
  rationale: 一晩の睡眠ではなく、眠りという状態を指す自然な現代日本語とした。
- source_word: מֵעֵינָי
  choice: 私の目から
  rationale: 不眠を表すヘブライ語の身体的イメージを、そのまま理解できる日本語で保持した。
