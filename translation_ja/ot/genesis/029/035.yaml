  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תַּ֨הַר ע֜וֹד וַ/תֵּ֣לֶד בֵּ֗ן וַ/תֹּ֨אמֶר֙ הַ/פַּ֨עַם֙ אוֹדֶ֣ה אֶת יְהוָ֔ה עַל כֵּ֛ן קָרְאָ֥ה שְׁמ֖/וֹ יְהוּדָ֑ה וַֽ/תַּעֲמֹ֖ד מִ/לֶּֽדֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/035.yaml
  text: And she conceived again and bore a son[a], and she said, “This time I will praise Yahweh.” Therefore she named him Judah. Then she stopped bearing children.
translation:
  language: ja
  text: 彼女は再び身ごもって男の子を産み、「今度は、ヤハウェをほめたたえよう」と言った。それで、その子をユダ[a]と名づけた。その後、彼女は子を産まなくなった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ユダ」という名は、「ほめたたえる」または「感謝する」を意味するヘブライ語の動詞との語呂合わせになっている。
    reason: 命名に込められたヘブライ語の語呂合わせと、動詞の意味の幅を示すため。
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: 彼女は再び身ごもって
  rationale: הרהは妊娠することを表し、עוֹדは一連の出産物語の中で反復を示すため、「再び身ごもって」とした。
- source_word: וַתֵּלֶד בֵּן
  choice: 男の子を産み
  rationale: ילדとבןの組み合わせを、現代日本語で自然かつ明瞭な出産表現にした。
- source_word: הַפַּעַם
  choice: 今度は
  rationale: 以前の出産との対比を示す「この時は／今回は」という指示的な意味を保ち、「今度こそ」のような強い感情は補わなかった。
- source_word: אוֹדֶה
  choice: ほめたたえます
  rationale: ידהのヒフィル形は、賛美または感謝を表し得る。ここではユダの命名との語呂合わせを伝えやすい「ほめたたえる」を本文に採用し、別の意味は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
- source_word: עַל כֵּן קָרְאָה שְׁמוֹ יְהוּדָה
  choice: それで、その子をユダと名づけた
  rationale: 原因と命名を結ぶעַל כֵּןを「それで」とし、קרא שםのヘブライ語慣用句を自然な日本語の「名づけた」で表した。
- source_word: וַתַּעֲמֹד מִלֶּדֶת
  choice: その後、彼女は子を産まなくなった
  rationale: עמד＋מן＋不定詞が活動の停止を表すため、恒久性を必要以上に断定せず、物語上その時点から出産が途絶えたことを自然に表現した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を直接用いているため、固有名として音写した。
- issue: אוֹדֶה の意味幅
  choice: ほめたたえます
  alternative: 感謝します
  rationale: この動詞は賛美と感謝の双方を含み得る。本文では命名の語呂合わせが伝わる「ほめたたえる」を選び、意味の幅を脚注で明示した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、創世記の物語にふさわしい簡潔で落ち着いた文体とした。引用文では日本語として自然になるよう主語「私は」を省略したが、一人称の発言であることは動詞表現と文脈から明らかである。
