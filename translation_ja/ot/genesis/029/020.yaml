source:
  edition: WLC
  text: וַ/יַּעֲבֹ֧ד יַעֲקֹ֛ב בְּ/רָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַ/יִּהְי֤וּ בְ/עֵינָי/ו֙ כְּ/יָמִ֣ים אֲחָדִ֔ים בְּ/אַהֲבָת֖/וֹ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/020.yaml
  text: So Jacob served seven years for Rachel[a], and they seemed like only a few days to him because of his love for her.
translation:
  language: ja
  text: こうしてヤコブは、ラケルのために七年間仕えた。そして、彼女を愛していたので、その年月は彼にはほんの数日のように思われた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「それらは彼の目に、わずかな日々のようであった」。
    reason: ヘブライ語の知覚表現「彼の目に」と、七年間を複数形で受ける原文の形を示すため。
lexical_decisions:
- source_word: וַיַּעֲבֹד
  choice: 仕えた
  rationale: עבדは「仕える」「働く」を意味する。この文脈では、ラケルとの結婚のために労務を提供する契約的・関係的な意味があるため、「働いた」よりも「仕えた」が適切。
- source_word: בְּרָחֵל
  choice: ラケルのために
  rationale: ここで前置詞בは、花嫁を得るために奉仕することを表す。「ラケルと引き換えに」では人物を取引物のように響かせやすいため、自然で文脈にも忠実な「ラケルのために」とした。
- source_word: שֶׁבַע שָׁנִים
  choice: 七年間
  rationale: 期間を表す明瞭な数詞表現として、自然な現代日本語にした。
- source_word: וַיִּהְיוּ בְעֵינָיו
  choice: その年月も彼には……思われた
  rationale: 直訳的な「彼の目には」を、日本語で主観的な知覚を自然に示す「彼には……思われた」とした。複数形の主語は直前の七年間を受けるため「その年月」と明示した。
- source_word: כְּיָמִים אֲחָדִים
  choice: ほんの数日のように
  rationale: 「わずかな日々のように」という短さの感覚を、明瞭で自然な日本語で表現した。「ほんの」は文脈上の最小化を伝える。
- source_word: בְּאַהֲבָתוֹ אֹתָהּ
  choice: 彼女を愛していたので
  rationale: 前置詞בを伴う愛の名詞句は、七年間が短く感じられた理由・事情を示すため、自然な原因表現にした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある叙述体。「仕えた」によって労働だけでなく契約的な奉仕の含みも保ち、後半はヘブライ語の主観的知覚を自然な日本語で表した。
