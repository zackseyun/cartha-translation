  text: And in the evening he took Leah his daughter and brought her to him[a], and he went in to her.
translation:
  language: ja
  text: その夕方、ラバンは娘のレアをヤコブのもとへ連れて行った。ヤコブは彼女のもとに入った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、性的関係を持つことを表す慣用的な婉曲表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: 夕方になると
  rationale: 物語の進行を示す וַיְהִי と時を表す בָעֶרֶב を、現代日本語で自然な時間節として表した。
- source_word: וַיִּקַּח אֶת־לֵאָה בִתּוֹ
  choice: ラバンは娘レアを連れて来て
  rationale: לקח の基本的な「取る／連れて行く」という意味を文脈に即して「連れて来る」とした。日本語では「娘レア」が自然であり、動作主は直前の文脈上ラバンなので明示した。
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו
  choice: ヤコブのもとに入れた
  rationale: ヒフィル形の בוא は「来させる、連れて入る」を意味する。婚礼の夜にレアをヤコブのいる場所へ連れ入れた動作を簡潔に表し、代名詞の指示対象を日本語では明示した。
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: 彼女のところに入った
  rationale: 性的関係を婉曲に表すヘブライ語の慣用句を、明示的な言い換えにせず、その比喩的な形を保って訳した。現代の読者には脚注で意味を補う。
