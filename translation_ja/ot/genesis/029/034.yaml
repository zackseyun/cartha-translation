  text: וַ/תַּ֣הַר עוֹד֮ וַ/תֵּ֣לֶד בֵּן֒ וַ/תֹּ֗אמֶר עַתָּ֤ה הַ/פַּ֨עַם֙ יִלָּוֶ֤ה אִישִׁ/י֙ אֵלַ֔/י כִּֽי יָלַ֥דְתִּי ל֖/וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ לֵוִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/034.yaml
  text: And she conceived again and bore a son[a], and said, “Now this time my husband will be attached to me, because I have borne him three sons.” Therefore his name was called Levi.
translation:
  language: ja
  text: 彼女は再び身ごもって男の子を産み、言った。「今度こそ、夫は私と結びつくでしょう。私は夫に三人の息子を産んだのですから。」それで、その子はレビ[a]と名づけられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レビ」という名は、ここで「結びつく」と訳したヘブライ語と音が似ている。
    reason: 命名に伴うヘブライ語の語呂合わせを示すため。
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: 彼女は再び身ごもって
  rationale: 再度の妊娠を表すヘブライ語を、現代日本語の自然な物語表現で訳した。
- source_word: וַתֵּלֶד בֵּן
  choice: 男の子を産み
  rationale: בןを明示しつつ、出産を表す定型的で自然な日本語とした。
- source_word: עַתָּה הַפַּעַם
  choice: 今度こそ
  rationale: עַתָּהとהַפַּעַםの重なりが表す強調と、レアの切実な期待を簡潔に伝える。
- source_word: יִלָּוֶה אִישִׁי אֵלַי
  choice: 夫は私と結びついてくれるでしょう
  rationale: לוהのニファルが表す『結びつく、伴う』という意味を保ち、レビという名との語呂合わせが見える訳語を選んだ。文脈上の願望・期待は『くれるでしょう』で自然に表した。
- source_word: כִּי יָלַדְתִּי לוֹ שְׁלֹשָׁה בָנִים
  choice: 私は夫に三人の息子を産んだのですから
  rationale: 理由を示すכִּי、לוֹの受益・関係、および『三人の息子』を明示した。
- source_word: עַל כֵּן קָרָא שְׁמוֹ
  choice: それで、その子は…と名づけられた
  rationale: 動詞は三人称男性単数だが主語が明記されないため、名づけた人物を断定せず受動表現にした。
- source_word: לֵוִי
  choice: レビ
  rationale: 日本語聖書で広く定着した音写を用いた。
theological_decisions:
- issue: יִלָּוֶהとלֵוִיの命名語源的な語呂合わせ
  choice: 本文で『結びついて』と訳し、脚注で語呂合わせを明示する
  alternative: 『付き添ってくれる』『親しくしてくれる』
  rationale: 意味を自然に伝えながら、原文が意図する音と意味の連関をできる限り保持するため。
- issue: קָרָאの主語
  choice: 『名づけられた』という受動表現
  alternative: 『彼は名を付けた』『彼女は名を付けた』
  rationale: マソラ本文は男性単数形だが明示的主語を欠く。特定の人物を補って曖昧さを解消しないため。
translation_notes:
  register: 明瞭で現代的ながら品位ある物語文体とした。レアの期待は『今度こそ』で自然に表し、命名者が明示されない原文の曖昧さは受動表現によって保った。
