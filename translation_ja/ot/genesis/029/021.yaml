  text: Then Jacob said to Laban[a], “Give me my wife, for my days are fulfilled, that I may go in to her.”
translation:
  language: ja
  text: そこでヤコブはラバンに言った。「私の妻を渡してください。私の務めの日数は満ちたのですから、彼女のもとに入るためです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼女のもとに入る」は、婚姻を完成させることを婉曲に表すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: 渡してください
  rationale: ラバンに対する要求を、婚姻の取り決めに基づいて妻をヤコブに引き渡す文脈に即した自然な日本語で表した。
- source_word: אֶת אִשְׁתִּי
  choice: 私の妻
  rationale: אִשָּׁה は「女／妻」を意味するが、ここでは約束された婚姻相手を指すため、「私の妻」が文脈に最も適する。
- source_word: כִּי מָלְאוּ יָמָי
  choice: 私が務める日数は満ちたのですから
  rationale: 直訳的な「私の日々は満ちた」では指示内容が日本語で不明瞭になるため、直前の七年間の奉仕を最小限に明示しつつ、「満ちた」で原文の比喩を保った。
- source_word: וְאָבוֹאָה אֵלֶיהָ
  choice: 彼女のもとに入らせてください
  rationale: בוא אל の婉曲表現を保ち、コホータティブの意志・要請の含みを「入らせてください」で自然に表した。露骨な説明は本文では避け、脚注で意味を示す。
