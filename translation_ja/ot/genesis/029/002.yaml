source:
  edition: WLC
  text: וַ/יַּ֞רְא וְ/הִנֵּ֧ה בְאֵ֣ר בַּ/שָּׂדֶ֗ה וְ/הִנֵּה שָׁ֞ם שְׁלֹשָׁ֤ה עֶדְרֵי צֹאן֙ רֹבְצִ֣ים עָלֶ֔י/הָ כִּ֚י מִן הַ/בְּאֵ֣ר הַ/הִ֔וא יַשְׁק֖וּ הָ/עֲדָרִ֑ים וְ/הָ/אֶ֥בֶן גְּדֹלָ֖ה עַל פִּ֥י הַ/בְּאֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/002.yaml
  text: He looked[a], and behold, there was a well in the field, and behold, three flocks of sheep were lying there beside it, because from that well they watered the flocks[e][d][c][b]. And the stone on the mouth of the well was large.
translation:
  language: ja
  text: 彼が見ると[a]、なんと野に一つの井戸があった。そして見ると[b]、そこには羊の群れが三つ[c]、井戸のそばに[d]横たわっていた。その井戸から群れに水を飲ませていたからである[e]。井戸の口には大きな石が載っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼は見た」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は、注意を引く語（「見よ」「なんと」に当たる語）を二度用いて、光景を生き生きと描いている。
    reason: discourse_feature
  - marker: c
    text: 「羊や山羊の群れ」とも訳せる。ヘブライ語は羊や山羊などの小家畜を集合的に指す。
    reason: lexical_scope
  - marker: d
    text: 字義的には「その上に」。ここでは井戸のそば、または周囲を意味する。
    reason: lexical_alternative
  - marker: e
    text: 「その井戸から群れに水を飲ませるのが常であった」とも訳せる。
    reason: aspectual_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 彼が見ると
  rationale: 物語を進めつつ、目前に現れた光景を導入する自然な日本語とした。「彼は見た」も可能。
- source_word: וְהִנֵּה ... וְהִנֵּה
  choice: なんと……そして見ると
  rationale: 注意を引く談話標識の反復を、現代日本語で不自然にならない範囲で二度の場面提示として表した。
- source_word: בְאֵר בַּשָּׂדֶה
  choice: 野に一つの井戸
  rationale: שָׂדֶה は畑だけでなく開けた野を指し得るため、この牧畜場面では「野」が自然である。
- source_word: שְׁלֹשָׁה עֶדְרֵי צֹאן
  choice: 羊の群れが三つ
  rationale: עֵדֶר は群れ、צֹאן は羊や山羊などの小家畜を集合的に指す。本文では簡潔で一般的な「羊の群れ」とし、範囲は注記した。
- source_word: רֹבְצִים
  choice: 伏していた
  rationale: 動物が地面に伏して休んでいる姿を表す語であり、牧歌的な場面に合う簡潔で品位ある表現。
- source_word: עָלֶיהָ
  choice: 井戸のそばに
  rationale: 字義的には「その上に」だが、井戸を指す文脈では、その周囲・そばにいるという空間関係を表す。
- source_word: יַשְׁקוּ
  choice: 水を飲ませていた
  rationale: שׁקה のヒフィル形は家畜などに水を与えることを表す。未完了形の反復的・慣習的な含みを「飲ませていた」で自然に示した。
- source_word: וְהָאֶבֶן גְּדֹלָה עַל פִּי הַבְּאֵר
  choice: 井戸の口には大きな石が載っていた
  rationale: 名詞文の描写性を保ち、「井戸の口」という原文の具体的な比喩もそのまま生かした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語の視覚的な展開と牧畜場面の落ち着いた格調を保った。「なんと」と「そして見ると」により הִנֵּה の反復を過度に古風な「見よ」とせず表現した。
