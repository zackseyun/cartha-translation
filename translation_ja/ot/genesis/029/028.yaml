  text: And Jacob did so[a], and he completed this week; then Laban gave him Rachel his daughter as his wife.
translation:
  language: ja
  text: ヤコブはそのとおりにし、この週[a]を終えた。するとラバンは、娘ラケルを彼の妻としてヤコブに与えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は文字どおりには「七を単位とする期間」を表す。ここでは婚宴の一週間を指すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ יַעֲקֹב כֵּן
  choice: ヤコブはそのとおりにし
  rationale: עשהと副詞的なכןの組み合わせを自然に訳し、前節のラバンの指示を受ける照応関係を保った。具体的な行為を本文以上に補わない。
- source_word: וַיְמַלֵּא
  choice: 終えた
  rationale: ピエル形が期間を満了することを表すため、現代日本語で自然な「終えた」とした。
- source_word: שְׁבֻעַ זֹאת
  choice: この一週
  rationale: 「七を単位とする期間」を指す語を簡潔に「一週」と訳した。婚宴の週という文脈上の意味は注で示し、本文では原文の簡潔さと指示語「この」を保持した。
- source_word: וַיִּתֶּן לוֹ
  choice: するとラバンは……彼に与えた
  rationale: 主語は前後の文脈からラバンであるため、日本語での曖昧さを避けて名を補った。「すると」で物語の時間的進行を表した。
- source_word: אֶת רָחֵל בִּתּוֹ
  choice: 娘ラケルを
  rationale: ラケルとラバンとの関係を、簡潔で自然な同格表現として訳した。
- source_word: לוֹ לְאִשָּׁה
  choice: ヤコブの妻として彼に
  rationale: 女性を婚姻によって妻として与える構文の意味を明確にした。「彼」がラバンを指すと誤読されないよう「ヤコブの妻」と明示した。
