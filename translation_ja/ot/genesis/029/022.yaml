source:
  edition: WLC
  text: וַ/יֶּאֱסֹ֥ף לָבָ֛ן אֶת כָּל אַנְשֵׁ֥י הַ/מָּק֖וֹם וַ/יַּ֥עַשׂ מִשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/022.yaml
  text: So Laban gathered all the men of the place and made a feast[a][b].
translation:
  language: ja
  text: そこでラバンは、その土地の男たちを皆集め、祝宴を催した[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その土地の人々を皆」。ヘブライ語は、より字義的には「その土地の男たちを皆」と言っている。婚礼の祝いに招かれた地元の男性たちを指す可能性が高いため、本文では男性形を保った。
    reason: lexical_alternative
  - marker: b
    text: 「祝宴」と訳したヘブライ語は、祝いの宴にしばしば用いられ、酒を飲むことも含み得る。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 集め
  rationale: 動詞 אסף は、この文脈では人々を一か所に集めることを表す。簡明で自然な現代日本語として「集め」とした。
- source_word: לָבָן
  choice: ラバン
  rationale: 人名は日本語聖書で一般的な音写に従った。
- source_word: אֶת כָּל אַנְשֵׁי הַמָּקוֹם
  choice: その土地の男たちを皆
  rationale: אַנְשֵׁי は אִישׁ の男性複数構成形で、字義的には「その場所の男たち」。婚宴に招かれた地元の男性たちを指す可能性が高いため、男性形を保った。「土地」は הַמָּקוֹם を、町と限定せず自然に表す。
- source_word: וַיַּעַשׂ
  choice: 催した
  rationale: עשה は広く「行う、作る」を意味するが、מִשְׁתֶּה との組み合わせでは、日本語では祝宴を「催す」が自然であり、出来事として宴を設けた意味を明確にする。
- source_word: מִשְׁתֶּה
  choice: 祝宴
  rationale: מִשְׁתֶּה は飲酒を伴うことの多い祝いの宴を指す。この婚礼の文脈では「祝宴」が簡潔かつ自然である。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「宴を作った」という直訳調を避け、「祝宴を催した」として自然な叙述にした。接続辞 וַ は物語の流れに合わせて「そこで」と訳した。
