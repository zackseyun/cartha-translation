  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תַּ֤הַר לֵאָה֙ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי רָאָ֤ה יְהוָה֙ בְּ/עָנְיִ֔/י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥/נִי אִישִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/032.yaml
  text: Leah conceived and bore a son[a], and she called his name Reuben, for she said, “Because Yahweh has seen my affliction, now my husband will love me.”
translation:
  language: ja
  text: レアは身ごもって男の子を産み、その子をルベン[a]と名づけた。彼女は言った。「ヤハウェが私の苦しみをご覧になったから。今こそ夫は私を愛してくれるでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ルベン」という名は、ヘブライ語の「見よ、息子だ」という表現を思わせ、ここではレアの「ヤハウェが私の苦しみをご覧になった」という言葉によって説明されている。
    reason: ヘブライ語の名前と「見る」を表す語との語呂合わせは、日本語本文だけでは伝わらないため。
lexical_decisions:
- source_word: וַתַּהַר
  choice: 身ごもって
  rationale: 妊娠することを表す動詞。出生物語の流れに合う、明瞭で自然な現代日本語とした。
- source_word: וַתֵּלֶד בֵּן
  choice: 男の子を産み
  rationale: 「息子を産んだ」も可能だが、誕生時の叙述として自然で分かりやすい「男の子」を採った。
- source_word: וַתִּקְרָא שְׁמוֹ רְאוּבֵן
  choice: その子をルベンと名づけた
  rationale: ヘブライ語の命名定型を、現代日本語として自然に表した。名前に伴う語呂合わせは脚注で補う。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を一般的な日本語表記で音写した。
- source_word: בְּעָנְיִי
  choice: 私の苦しみ
  rationale: עֳנִיは苦悩、惨めな境遇、苦しみを指す。ここでは愛されないレアの境遇を平明に表す語を選んだ。
- source_word: כִּי עַתָּה יֶאֱהָבַנִי אִישִׁי
  choice: 今こそ夫は私を愛してくれるでしょう
  rationale: レアの期待を表す文脈に即し、אִישִׁיを「夫」、未完了形を期待を帯びた未来表現として訳した。「今こそ」によりעַתָּהの転機への期待を自然に示す。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いているため、その区別を保って音写した。
- issue: レアの最後の言葉の確実性
  choice: 「愛してくれるでしょう」と期待として表現
  alternative: 「愛してくれる」または「きっと愛してくれる」
  rationale: ヘブライ語未完了形は将来への見込みを示すが、その実現を本文が保証しているわけではないため、レア自身の希望として訳した。
translation_notes:
  register: 簡潔な物語調を保ちつつ、古風すぎない、品位ある現代標準日本語とした。レアの痛みと期待は強めすぎず、原文にある因果関係と感情の緊張を保った。
