base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/018.yaml
  text: Jacob loved Rachel[a], and he said, “I will serve you seven years for Rachel your younger daughter.”
translation:
  language: ja
  text: ヤコブはラケルを愛していた[a]。彼は言った。「あなたの下の娘ラケルのために、私は七年間あなたに仕えます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より形式的には「そしてヤコブはラケルを愛していた」。冒頭の接続詞は、物語が続いていることを示しています。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: 愛していた
  rationale: אהב の基本義を保ちつつ、この時点ですでに抱いていた継続的な愛情を自然な日本語で表す。「恋していた」より解釈を加えない。
- source_word: וַיֹּאמֶר
  choice: そこで彼は言った
  rationale: אמר を「言った」と直接訳し、接頭辞 וַ が物語を次の発言へ進める働きを「そこで」で自然に示す。
- source_word: אֶעֱבָדְךָ
  choice: 私は七年間あなたに仕えます
  rationale: עבד の労働と奉仕の両面を「仕える」で保持する。文脈上は将来の申し出なので、自然な丁寧体の「仕えます」とした。
- source_word: שֶׁבַע שָׁנִים
  choice: 七年間
  rationale: 期間を表す句として明確かつ自然な日本語。
- source_word: בְּרָחֵל
  choice: ラケルのために
  rationale: 前置詞 בְּ がここで示す対価・目的の関係を簡潔に表す。「ラケルと引き換えに」は取引性を必要以上に強めるため避けた。
- source_word: בִּתְּךָ
  choice: あなたの娘
  rationale: 二人称男性単数接尾辞を含む句を直接訳した。
- source_word: הַקְּטַנָּה
  choice: 下の
  rationale: 家族内でレアと比較した年少の娘を指す。「下の娘」は現代日本語で自然であり、「小さい娘」という誤解を避ける。
- source_word: וַ
  choice: そこで
  rationale: 冒頭の接続は前節から物語を継続し、後半の接続は愛情を背景として発言へ進む。日本語では冒頭の接続語を省き、発言前を「そこで」として流れを明示した。
