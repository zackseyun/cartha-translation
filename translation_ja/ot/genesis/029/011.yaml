lexical_decisions:
- source_word: וַיִּשַּׁק
  choice: 口づけし
  rationale: נשק のカル形の通常の意味である「口づけする」を直接に表す。文脈上は親族間の挨拶としての口づけでもあり得るため、その含みは脚注に示す。
- source_word: לְרָחֵל
  choice: ラケルに
  rationale: 日本語では「ラケルに口づけする」が自然であり、前置詞 ל の対象を明示できる。
- source_word: וַיִּשָּׂא אֶת־קֹלוֹ
  choice: 声を上げて
  rationale: 直訳的な「自分の声を上げた」を、ヘブライ語の慣用表現と大声で泣く流れを保ちながら、自然な現代日本語にした。
- source_word: וַיֵּבְךְּ
  choice: 泣いた
  rationale: בכה の意味を、格調を保ちつつ現代の一般読者に最も自然で明瞭な語で表した。
- source_word: וַ
  choice: （動作の連続）
  rationale: 連続するワウが示す物語の進行は、日本語では動詞の連用形「口づけし」と後続の叙述によって自然に表現した。
