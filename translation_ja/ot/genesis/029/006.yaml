  text: He said to them[a], “Is he well?” And they said, “He is well. And look, Rachel his daughter is coming with the flock.”
translation:
  language: ja
  text: 彼は彼らに言った。「ラバンは元気ですか[a]。」彼らは答えた。「元気です。ほら、ラバンの娘、ラケルが家畜の群れと一緒に来ています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は無事ですか」。ヘブライ語の「シャローム（平安）」に当たる語が、ここでは安否や健康を尋ねる意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲשָׁלוֹם לוֹ
  choice: あの人は元気ですか
  rationale: שָׁלוֹםはここでは抽象的な「平和」ではなく、ラバンの安否や健康状態を尋ねる語。日本語として自然な問いにしつつ、別の直訳的表現を脚注に残した。
- source_word: שָׁלוֹם
  choice: 元気です
  rationale: 問いと同じ語を用いた簡潔な返答であり、ラバンが無事で元気であることを示す。
- source_word: וְהִנֵּה
  choice: ほら
  rationale: 話し手が目前の人物へ注意を向けさせる指示的な力を、自然な現代日本語で表した。
- source_word: רָחֵל
  choice: ラケル
  rationale: 旧約聖書の人名として日本語で広く定着している表記を用いた。
- source_word: בִּתּוֹ
  choice: 娘の
  rationale: 三人称男性単数の接尾辞は、直前まで話題となっているラバンを指す。日本語では「彼の娘ラケル」より「娘のラケル」が自然で、関係も明瞭。
- source_word: בָּאָה
  choice: やって来ます
  rationale: הִנֵּהによって目の前の進行中の場面が示されているため、現在近づいている動きを自然に表現した。
- source_word: עִם הַצֹּאן
  choice: 羊の群れを連れて
  rationale: צֹאןは羊や山羊などの小家畜の群れを指し得るが、日本語の物語文では「羊の群れ」が自然。עִםは直訳すれば「群れとともに」だが、ラケルが群れを導いて来る文脈を自然に表した。
