base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/033.yaml
  text: Then she conceived again and bore a son[a], and said, “Because Yahweh has heard that I am hated[b], he has given me this one also.” So she called his name Simeon.
translation:
  language: ja
  text: 彼女は再び身ごもり、男の子を産んだ。そして彼女は言った。「ヤハウェは、私が嫌われている[a]ことを聞いてくださったので、この子も私に与えてくださった。」彼女はその子をシメオン[b]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「愛されていない」、または「より愛されていない」とも訳せる。ヘブライ語は字義的には「嫌われている」だが、文脈によっては退けられていることや、比較的に愛されていないことを表す。
    reason: lexical_alternative
  - marker: b
    text: 「シメオン」は、「聞く」を意味するヘブライ語と語呂を合わせた名。
    reason: wordplay
lexical_decisions:
- source_word: וַתַּהַר עוֹד
  choice: 彼女は再び身ごもって
  rationale: עֹודの反復の意味を「再び」で表し、物語を進める接続形は日本語として自然な連続表現にした。
- source_word: וַתֵּלֶד בֵּן
  choice: 男の子を産み
  rationale: בןを明示しつつ、現代日本語の出生記事として簡潔で自然な表現を採用した。
- source_word: כִּי שָׁמַע יְהוָה
  choice: ヤハウェは……聞いてくださったので
  rationale: כִּיを理由を示す「ので」とし、שָׁמַעは完了した出来事として訳した。神の名יְהוָהは称号に置き換えず「ヤハウェ」とした。日本語では話者の受益の認識を自然に示すため敬語補助動詞を用いた。
- source_word: כִּי שְׂנוּאָה אָנֹכִי
  choice: 私が嫌われていること
  rationale: שְׂנוּאָהの強い基本義を保ち、「愛されていない」「より愛されていない」と本文で弱めなかった。行為者のヤコブは原文に明記されないため補わない。
- source_word: וַיִּתֶּן לִי גַּם אֶת זֶה
  choice: この子も私に与えてくださった
  rationale: גַּםを「も」、זֶהを文脈に即して「この子」とし、追加の息子が与えられたという意味を明瞭にした。
- source_word: וַתִּקְרָא שְׁמוֹ שִׁמְעוֹן
  choice: こうして彼女はその子をシメオンと名づけた
  rationale: ヘブライ語の命名定型を自然な現代日本語で表し、直前の発言との帰結関係を「こうして」で示した。שִׁמְעוֹןは日本語聖書で定着した「シメオン」とした。
theological_decisions:
- issue: レアが自分の立場を表すשְׂנוּאָהの訳
  choice: 嫌われている
  alternative: 愛されていない／より愛されていない
  rationale: 文脈上は相対的に愛が少ないことを指し得るが、原語の強さと物語上の緊張を本文に残した。解釈上の幅は脚注で示した。
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文にある固有の神名を称号へ置換せず、一般的な学術的音写で示した。
- issue: 神の行為に対する日本語の敬語
  choice: 聞いてくださった／与えてくださった
  alternative: 聞いた／与えた
  rationale: 原文の意味内容を変えず、レア自身が神の配慮と恩恵として語る発言を、自然で敬意ある日本語にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。レアの直接話法は自然な口調にしながら、原語の強い「嫌われている」を保持した。神名は「ヤハウェ」、人名は定着形「シメオン」とした。
