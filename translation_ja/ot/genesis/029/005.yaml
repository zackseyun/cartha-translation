  text: He said to them[a], “Do you know Laban son of Nahor?” They said, “We know him.”
translation:
  language: ja
  text: 彼は彼らに言った。「あなたがたはナホルの子ラバンを知っていますか。」彼らは答えた。「知っています。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: 彼は彼らに言った
  rationale: 物語を進めるワウ連続法を、日本語で自然な過去時制として表し、לָהֶםの間接目的語も明示した。
- source_word: הֲיְדַעְתֶּם
  choice: 知っていますか
  rationale: ここでのידעは人物との面識・知識を問うため、現代日本語で自然な「知っていますか」とした。
- source_word: לָבָן
  choice: ラバン
  rationale: 人名を一般的な日本語表記で音写した。
- source_word: בֶּן נָחוֹר
  choice: ナホルの子
  rationale: בֶּןの基本義「子」を保ち、系譜上の特定を原文どおり簡潔に示した。
- source_word: וַיֹּאמְרוּ
  choice: 彼らは答えた
  rationale: 直訳は「彼らは言った」だが、問いへの応答であることを自然な日本語で示すため「答えた」とした。
- source_word: יָדָעְנוּ
  choice: 知っています
  rationale: 質問と同じידעの反復を「知る」で保った。目的語「彼を」はヘブライ語にも明示されず、日本語でも文脈から自然に補えるため省略した。
