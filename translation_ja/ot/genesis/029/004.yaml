  text: Jacob said to them[a], “My brothers, where are you from?” They said[b], “We are from Haran.”
translation:
  language: ja
  text: ヤコブは彼らに言った。「兄弟たち[a]、あなたがたはどこから来たのですか。」彼らは答えた。「私たちはハランから来ました。」
  philosophy: optimal-equivalence
