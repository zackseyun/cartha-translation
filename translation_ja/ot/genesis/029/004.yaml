    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם יַעֲקֹב
  choice: ヤコブは彼らに言った
  rationale: אמרの基本的な意味である「言う」を保ち、לָהֶםを「彼らに」と明示した。後続する発話が質問であっても、本文では「尋ねた」と限定しない。
- source_word: אַחַי
  choice: 兄弟たち
  rationale: 直訳的な「私の兄弟たち」は、未知の羊飼いたちへの呼びかけとして現代日本語では不自然になりやすい。「兄弟たち」は、実際の血縁を断定せず、親しみを込めた男性への呼びかけを表せる。
- source_word: מֵאַיִן אַתֶּם
  choice: あなたがたはどこの出身ですか
  rationale: מֵאַיִןは出所・出身地を問うため、自然な現代日本語で「どこの出身ですか」とした。複数形אַתֶּםは「あなたがた」で反映した。
- source_word: וַיֹּאמְרוּ
  choice: 彼らは答えた
  rationale: 語そのものは「言った」だが、質問への応答という談話上の機能を自然な日本語で示すため「答えた」とした。
- source_word: מֵחָרָן אֲנָחְנוּ
  choice: 私たちはハランの出身です
  rationale: מִןが表す出所を「出身」とし、ヘブライ語では省略される繋辞を日本語の自然な文として補った。地名は慣用的に「ハラン」と表記した。
