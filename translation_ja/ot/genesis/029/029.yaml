  register: 明瞭で現代的かつ品位ある叙述。原文の二度のשִׁפְחָהは、日本語で不自然な反復を避けつつ、最初を身分、二度目を役割として訳し分け、その同一性を脚注で明示した。脚注記号は該当文末に置いた。
