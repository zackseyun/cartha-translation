  text: And Laban gave Bilhah[a], his female servant, to Rachel his daughter as her female servant.
translation:
  language: ja
  text: ラバンは娘ラケルに、女奴隷ビルハをラケルの女奴隷として与えた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女奴隷」は、原文で二度用いられている同じヘブライ語です。「女の召使い」とも訳せます。
    reason: 同一語שִׁפְחָהの反復を示しつつ、英語POB監査記録にある語彙的代替を日本語で示すため。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 与えた
  rationale: 物語を進める接続形で、ラバンがビルハをラケルに与えた行為を端的に表す。
- source_word: לָבָן
  choice: ラバン
  rationale: 日本語聖書で一般的な人名表記を採用した。
- source_word: לְרָחֵל בִּתּוֹ
  choice: 自分の娘ラケルに
  rationale: לְは受け手を示し、בִּתּוֹはラバンとの関係を表す。日本語として自然な語順に整えた。
- source_word: בִּלְהָה
  choice: ビルハ
  rationale: 日本語聖書で一般的な人名表記を採用した。
- source_word: שִׁפְחָתוֹ
  choice: 女奴隷
  rationale: שִׁפְחָהは女性の隷属的身分にある者を指し得る。単なる雇用上の『召使い』より身分関係を明確に示す。年齢を意味しないため『奴隷の少女』とはしない。
- source_word: לָהּ לְשִׁפְחָה
  choice: 彼女の召使いとして
  rationale: 直訳的には『彼女に、女奴隷として』。ラケルに対する役割を自然な現代日本語で示した。後半は役割に焦点があるため『召使い』とした。
