  text: וַ/יֹּ֣אמֶר לָבָ֗ן ט֚וֹב תִּתִּ֣/י אֹתָ֣/הּ לָ֔/ךְ מִ/תִּתִּ֥/י אֹתָ֖/הּ לְ/אִ֣ישׁ אַחֵ֑ר שְׁבָ֖/ה עִמָּדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/019.yaml
  text: Laban said[a], “It is better that I give her to you than that I give her to another man. Stay with me.”
translation:
  language: ja
  text: ラバンは言った。「彼女をほかの男に与えるより、あなたに与えるほうがよい。私のもとにとどまりなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: אמרの物語叙述における標準的な用法であり、直接話法を自然に導入する。
- source_word: טוֹב
  choice: ほうがよい
  rationale: מִןを伴う比較構文なので、単なる「よい」ではなく「～より…ほうがよい」と訳すのが自然である。
- source_word: תִּתִּי אֹתָהּ לָךְ
  choice: 彼女をあなたに与える
  rationale: 一人称単数接尾辞を伴う不定詞連語を、日本語では主語「私」を文脈上補わずとも明瞭な節として表現した。婚姻交渉における父の行為を指す。
- source_word: מִתִּתִּי אֹתָהּ לְאִישׁ אַחֵר
  choice: 彼女をほかの男に与えるより
  rationale: 比較のמִןと不定詞連語を自然な日本語の比較表現にした。「男」は原文のאִישׁを保ち、「夫」と限定する解釈は加えていない。
- source_word: שְׁבָה
  choice: とどまりなさい
  rationale: ישׁבの命令形はここでは座ることではなく、ラバンのもとに引き続き滞在することを意味する。
- source_word: עִמָּדִי
  choice: 私のもとに
  rationale: 直訳的には「私とともに」だが、滞在を命じる日本語として「私のもとに」が明瞭で自然である。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、家父長制下の婚姻交渉という原文の状況を言い換えで弱めず、その一方で原文にない婚姻上の専門語や神学的含意は加えなかった。ラバンの発言は慣用的な比較表現として自然に整えた。
