  to: 「この娘との婚礼の一週間を終えなさい[a]。そうすれば、もう一人の娘もあなたに与えよう[b]。ただし、あなたがあと七年間、わたしのもとで働くことが条件だ[c]。」
  rationale: 原文の指示語が指す二人の娘を、現代日本語で混同なく自然に表すため、「この女」の反復を「この娘」「もう一人の娘」に改めた。また、七年間の労働が娘を与えることの条件である点を明示した。脚注は婚礼週、女性単数形の代替的理解、עבד の語義幅を保持する。
