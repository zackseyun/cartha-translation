base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/027.yaml
  text: Complete this woman's bridal week[c][b][a], and we will give you this one also in return for the work that you will do with me for another seven years.
translation:
  language: ja
  text: 「この娘との婚礼の一週間を終えなさい[a]。そうすれば、もう一人の娘もあなたに与えよう[b]。ただし、あなたがあと七年間、わたしのもとで働くことが条件だ[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「この者の一週を満たしなさい」。ここでは慣習的な婚礼の一週間を指す。
    reason: cultural_note
  - marker: b
    text: 別訳「もう一人の娘もあなたに与えられる」。ヘブライ語の形は形式上、女性単数であるが、文脈上はラバンがもう一人の娘も与えるとの約束である。
    reason: lexical_alternative
  - marker: c
    text: 「働く」は「仕える」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלֵּא
  choice: 終えなさい
  rationale: 命令形の力を保ちつつ、定められた期間を最後まで満たす意味を自然な現代日本語で表す。
- source_word: שְׁבֻעַ זֹאת
  choice: この女の婚礼の一週間
  rationale: 直訳は「この女の一週」。זֹאתがレアを指すことと、文脈上これが婚礼に伴う一週間であることを明確にする。
- source_word: וְנִתְּנָה לְךָ
  choice: あなたに与えよう
  rationale: 形態上は女性単数の「彼女は与えられる」に相当するが、文脈ではラバンがもう一人の娘を与えるとの約束を表すため、自然な能動表現とした。
- source_word: גַּם אֶת זֹאת
  choice: この女も
  rationale: もう一人の娘ラケルを指す女性形の指示語と、גַּםの付加の意味を簡潔に保つ。
- source_word: בַּעֲבֹדָה אֲשֶׁר תַּעֲבֹד עִמָּדִי
  choice: わたしのもとで働くという条件で
  rationale: עבדの「働く／仕える」の幅を保ちながら、ここでの労働契約と引き換えの条件を明瞭な日本語で示す。
- source_word: עוֹד שֶׁבַע שָׁנִים אֲחֵרוֹת
  choice: さらに七年間
  rationale: עוֹדとאֲחֵרוֹתが示す追加の期間を自然かつ簡潔に表す。
