id: GEN.29.14
reference: Genesis 29:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ לָבָ֔ן אַ֛ךְ עַצְמִ֥/י וּ/בְשָׂרִ֖/י אָ֑תָּה וַ/יֵּ֥שֶׁב עִמּ֖/וֹ חֹ֥דֶשׁ יָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/014.yaml
  text: Then Laban said to him[b][a], “Surely you are my bone and my flesh.” And he stayed with him for a month.
translation:
  language: ja
  text: そこでラバンは彼に言った。「確かに、あなたは私の骨、私の肉だ[a]。」こうしてヤコブはラバンのもとに、ひと月の間とどまった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の骨、私の肉」は、近い血縁関係にあることを表すヘブライ語の言い回し。
    reason: cultural_note
  - marker: b
    text: 直訳すると「日々の一か月」。すなわち「丸ひと月」または「ひと月の間」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ継続法を、直前の出来事を受ける自然な日本語の叙述として表した。
- source_word: אַךְ
  choice: 確かに
  rationale: ここでは限定の「ただ」ではなく、血縁関係を強く確認する断定的な用法と判断した。
- source_word: עַצְמִי וּבְשָׂרִי
  choice: 私の骨、私の肉
  rationale: 近い血縁を表す慣用句だが、創世記における表現上の響きを保つため、比喩を本文に残した。
- source_word: וַיֵּשֶׁב
  choice: とどまった
  rationale: 一定期間ラバンのもとで滞在したことを示すため、現代日本語で自然な「とどまった」とした。
- source_word: עִמּוֹ
  choice: ラバンのもとに
  rationale: 代名詞の指示対象を明確にし、日本語として自然に滞在先を表した。
- source_word: חֹדֶשׁ יָמִים
  choice: ひと月の間
  rationale: 字義的には「日々の一か月」という期間表現であり、日本語ではその意味を自然に「ひと月の間」と表した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いながら、血縁を示すヘブライ語の比喩「骨、肉」は保持した。「彼」の連続による曖昧さを避けるため、後半ではヤコブとラバンを明示した。
