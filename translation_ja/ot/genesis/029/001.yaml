lexical_decisions:
- source_word: וַיִּשָּׂא יַעֲקֹב רַגְלָיו
  choice: こうしてヤコブは旅立ち
  rationale: 字義的には「ヤコブは足を上げた」だが、ヘブライ語の慣用表現として、元気を取り戻して旅を続けたことを自然な現代日本語で表した。文脈とのつながりは「こうして」で示した。
- source_word: אַרְצָה
  choice: 地へ
  rationale: 方向を示す語尾付きの「地」を、日本語では目的地を表す助詞「へ」で訳した。
- source_word: בְנֵי קֶדֶם
  choice: 東方の人々
  rationale: 字義的には「東の子ら」だが、地域・民族集団を指す慣用句なので、「東方の人々」とした。単に「東の地」とせず、人々への言及を保持した。
