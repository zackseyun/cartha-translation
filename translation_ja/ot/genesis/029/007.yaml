  text: וַ/יֹּ֗אמֶר הֵ֥ן עוֹד֙ הַ/יּ֣וֹם גָּד֔וֹל לֹא עֵ֖ת הֵאָסֵ֣ף הַ/מִּקְנֶ֑ה הַשְׁק֥וּ הַ/צֹּ֖אן וּ/לְכ֥וּ רְעֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/007.yaml
  text: Then he said[a], “Look, the day is still long; it is not time for the livestock to be gathered. Water the flock[b], then go and pasture them.”
translation:
  language: ja
  text: そこでヤコブは言った。「見なさい。まだ日は高く、家畜を集める時ではない。群れに水を飲ませ、それから行って放牧しなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: 見なさい
  rationale: 注意を促す間投詞として、現代日本語で自然に発話の力を保つ。
- source_word: עוֹד הַיּוֹם גָּדוֹל
  choice: まだ日は高く
  rationale: 字義的には「日はまだ大きい／長い」だが、日中の時間が十分残っているというヘブライ語の慣用的意味を自然な日本語で表す。
- source_word: לֹא עֵת הֵאָסֵף הַמִּקְנֶה
  choice: 家畜を集める時ではない
  rationale: 受動的な不定詞形を日本語で自然な能動表現にしつつ、מִקְנֶה の羊だけに限られない集合的意味を「家畜」で保持する。
- source_word: הַשְׁקוּ
  choice: 水を飲ませ
  rationale: 使役語幹の「水を与える／飲ませる」という意味と命令の力を明確に表す。
- source_word: הַצֹּאן
  choice: 羊の群れ
  rationale: 小家畜の群れを指し得る語だが、この物語の文脈に合う自然な表現として「羊の群れ」を採る。
- source_word: וּלְכוּ
  choice: それから行って
  rationale: 接続詞を二つの命令の順序として自然に表す。
- source_word: רְעוּ
  choice: 草を食べさせなさい
  rationale: 群れを放牧し、草を食べさせる意味を、普通の読者に明瞭な日本語で表す。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある会話文。話者名は直前文脈から補い、「日は高い」という慣用表現で、まだ日中の時間が十分あるという趣旨を伝えた。
