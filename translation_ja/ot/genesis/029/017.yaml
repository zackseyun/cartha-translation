lexical_decisions:
- source_word: עֵינֵי
  choice: 目
  rationale: 構成形複数はレアの目を明確に指しており、外見全体ではなく特定の特徴に焦点を当てる。
- source_word: רַכּוֹת
  choice: 優しかった
  rationale: 「柔らかい、繊細な、弱い」などの幅を持つ語である。日本語で目について「柔らかい」と直訳するより「優しい」が自然だが、正確なニュアンスは不確かなため脚注に異訳を示す。
- source_word: יְפַת תֹּאַר
  choice: 姿も美しかった
  rationale: 身体の形や容姿を表す連語。「姿」とすることで、後続の目に見える顔立ちとの区別を保つ。
- source_word: וִיפַת מַרְאֶה
  choice: 顔立ちも美しかった
  rationale: מַרְאֶה は目に映る外観を指す。ここでは並行する תֹּאַר と区別しつつ自然な日本語にするため「顔立ち」とした。
- source_word: וְ
  choice: が
  rationale: 形式上は「そして」だが、文脈ではレアとラケルの特徴を対照しているため、自然な逆接の「が」で表した。
