  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ לָבָ֜ן אֶת שֵׁ֣מַע יַעֲקֹ֣ב בֶּן אֲחֹת֗/וֹ וַ/יָּ֤רָץ לִ/קְרָאת/וֹ֙ וַ/יְחַבֶּק ל/וֹ֙ וַ/יְנַשֶּׁק ל֔/וֹ וַ/יְבִיאֵ֖/הוּ אֶל בֵּית֑/וֹ וַ/יְסַפֵּ֣ר לְ/לָבָ֔ן אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/013.yaml
  text: And when Laban heard the news about Jacob[a], his sister’s son, he ran to meet him and embraced him and kissed him and brought him to his house[c][b]. Then Jacob told Laban all these things.
translation:
  language: ja
  text: ラバンは、姉妹の子ヤコブについての知らせを聞くと、走って迎えに行き、彼を抱きしめ、口づけをして、自分の家に連れて行った。それからヤコブは、これらのことをすべてラバンに話した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִשְׁמֹעַ
  choice: 聞くと
  rationale: 前置詞כと不定詞連語が示す時間関係を、即時性を過度に強調せず、自然な現代日本語で表した。
- source_word: שֵׁמַע יַעֲקֹב
  choice: ヤコブについての知らせ
  rationale: שֵׁמַעはここでは聞く行為ではなく、ヤコブに関する知らせ・評判を指す。「知らせ」は文脈に合い、「についての」によって属格の意味上の関係を明確にした。
- source_word: בֶּן אֲחֹתוֹ
  choice: 姉妹の息子
  rationale: 「おい」と意訳せず、ヘブライ語が明示する「彼の姉妹の息子」という親族関係を簡潔に保った。
- source_word: וַיָּרָץ לִקְרָאתוֹ
  choice: 走って迎えに行き
  rationale: לקראתの「会うために向かう」という意味を、この再会の場面に自然な日本語で表した。
- source_word: וַיְחַבֶּק לוֹ
  choice: 彼を抱き締めて
  rationale: חבקの身体的な抱擁を明瞭に示しつつ、物語文として自然な表現を選んだ。
- source_word: וַיְנַשֶּׁק לוֹ
  choice: 口づけし
  rationale: 家族間の挨拶としてのנשׁקを、余計な含意を加えず、品位ある物語調で訳した。
- source_word: וַיְבִיאֵהוּ אֶל־בֵּיתוֹ
  choice: 自分の家に連れて来た
  rationale: 使役形の「来させる／連れて来る」とאלの方向性を自然に表した。「自分の」により家の所有者がラバンであることを明確にした。
- source_word: וַיְסַפֵּר לְלָבָן
  choice: ヤコブは……ラバンに話した
  rationale: 動詞の主語は明示されていないが、内容を知り到着したヤコブが語ったと読むのが文脈上自然である。直前までの主語ラバンとの混同を避けるため、ヤコブを明示した。
- source_word: אֵת כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: これらの事をすべて
  rationale: דבריםの広い意味範囲を「事」で保ち、指示語האלהと全体性כלをともに訳出した。
theological_decisions: []
