  verdict: revise
  source_fidelity: 全体としてヘブライ語の出来事の順序と主語の転換をよく反映している。「聞くと」、知らせ、走って迎える、抱擁、口づけ、家へ連れて行く、ヤコブが語る、という要素はいずれも原文に忠実である。
