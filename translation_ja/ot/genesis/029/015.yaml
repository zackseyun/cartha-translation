  naturalness: 「親族だからといって、無報酬で私のもとで働くのか」は明快な現代標準日本語で、修辞的な調子も保ちます。「私に言いなさい」は不自然ではありませんが、「私に言ってください」はラバンの発話として丁寧すぎるため維持します。
