base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/015.yaml
  text: Then Laban said to Jacob[a], “Because you are my relative, should you work for me for nothing? Tell me, what your wages should be.”
translation:
  language: ja
  text: そこでラバンはヤコブに言った。「あなたが私の親族[a]だからといって、無報酬で私のもとで働くのか。あなたの報酬をいくらにすべきか、私に言いなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「私の兄弟」。ここでは、より広い意味で親族を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי
  choice: だからといって
  rationale: 親族であることを無報酬の労働の理由とするのか、という修辞的な問いのつながりを自然な現代日本語で表す。
- source_word: אָחִי
  choice: 私の親族
  rationale: 字義は「私の兄弟」だが、ここでは甥のヤコブを指す広義の親族表現であり、実際の関係を誤解させない訳とした。
- source_word: וַעֲבַדְתַּנִי
  choice: 私に仕える
  rationale: עבד の奉仕・労働の意味を保ちつつ、ラバンのもとで働く文脈に合う表現とした。
- source_word: חִנָּם
  choice: ただで
  rationale: 報酬なしに働くことを指す簡潔で自然な表現。直後の報酬の話とも明瞭につながる。
- source_word: הַגִּידָה לִּי
  choice: 私に言いなさい
  rationale: 命令形と間接目的語を明示し、威厳を保った自然な直接話法とした。
- source_word: מַה מַשְׂכֻּרְתֶּךָ
  choice: 報酬をいくらにするか
  rationale: מַשְׂכֹּרֶת は労働への賃金・報酬を表す。これから条件を定める交渉の文脈を「いくらにするか」で表した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。ラバンの発言は、親族関係を理由に無報酬で働かせるべきではないという修辞疑問として訳した。「仕える」は原語の幅を保ち、「報酬」で雇用条件の文脈を明確にした。
