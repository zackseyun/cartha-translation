- from: 朝になってみると、なんと、レアだった。ヤコブはラバンに言った。「あなたは私になんということをしたのですか。私はラケルのために、あなたのもとで働いたのではありませんか。それなのに、なぜ私をだましたのですか。」
  to: 朝になって、見ると、レアだった。ヤコブはラバンに言った。「あなたは私に何をしたのですか。私はラケルのために、あなたのもとで働いたのではありませんか。それなのに、なぜ私をだましたのですか。」
