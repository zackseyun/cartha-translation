  yaml_path: translation/ot/genesis/029/025.yaml
  text: In the morning, behold, it was Leah. And he said to Laban, “What is this you have done to me? Was it not for Rachel that I worked with you? So why have you deceived me?”
translation:
  language: ja
  text: 朝になって、見ると、レアだった。ヤコブはラバンに言った。「あなたは私に何をしたのですか。私はラケルのために、あなたのもとで働いたのではありませんか。それなのに、なぜ私をだましたのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה הִוא לֵאָה
  choice: なんと、レアだった
  rationale: 「見よ」に相当する וְהִנֵּה の驚きと突然の発見を、現代日本語で自然な「なんと」によって表した。הִוא は日本語では明示しなくても指示対象が通じるため、省略した。
- source_word: עָבַדְתִּי עִמָּךְ
  choice: あなたのもとで働いた
  rationale: עבד の労働・奉仕の意味を、この文脈に即して「働いた」とし、עִמָּךְ は雇用関係を自然に示す「あなたのもとで」とした。
- source_word: רִמִּיתָנִי
  choice: 私をだました
  rationale: 動詞 רמה の、相手を欺くという直接的な意味を平明な現代語で表した。
