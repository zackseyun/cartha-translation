base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/012.yaml
  text: Jacob told Rachel that he was her father's relative and that he was Rebekah's son[a]. Then she ran and told her father.
translation:
  language: ja
  text: ヤコブはラケルに、自分が彼女の父の親族[a]であり、リベカの息子であることを告げた。すると彼女は走って行き、父にそのことを知らせた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼女の父の兄弟」。ここで「兄弟」は近い男性親族という意味で用いられている。ヤコブはラケルの父ラバンの甥に当たる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: 告げた
  rationale: ヒフィル形の「知らせる、告げる」という意味を、簡潔で品位ある現代日本語で表した。
- source_word: כִּי
  choice: 〜ことを
  rationale: ここでは「告げた」の内容を導く接続詞なので、日本語では内容節を作る「〜ことを」とした。
- source_word: אֲחִי אָבִיהָ
  choice: 彼女の父の親族
  rationale: 直訳は「彼女の父の兄弟」だが、אָחは近い男性親族を広く指し得る。ヤコブはラバンの甥なので、実際の関係を誤解させず、原語の幅も保つ「親族」とした。
- source_word: בֶן רִבְקָה
  choice: リベカの息子
  rationale: 単純な親子関係を自然な日本語で表した。
- source_word: וַתָּרָץ
  choice: 走って行き
  rationale: רץの具体的な動作を保ち、続く報告行為へ自然につないだ。
- source_word: וַתַּגֵּד
  choice: 知らせた
  rationale: 同じ語根の反復を踏まえつつ、日本語として不自然な反復を避け、「知らせる」という基本義を明確にした。
- source_word: לְאָבִיהָ
  choice: 父に
  rationale: 文脈上、ラケル自身の父であることが明らかなため、自然な日本語として「父に」とした。
