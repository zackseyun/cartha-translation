  text: וַ/יֹּ֣אמֶר לָבָ֔ן לֹא יֵעָשֶׂ֥ה כֵ֖ן בִּ/מְקוֹמֵ֑/נוּ לָ/תֵ֥ת הַ/צְּעִירָ֖ה לִ/פְנֵ֥י הַ/בְּכִירָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/026.yaml
  text: Laban said[a], “It is not done this way in our place[c][b], to give the younger before the older.”
translation:
  language: ja
  text: ラバンは言った。「私たちのところでは[a]、年下の娘を長女[c]より先に嫁がせる[b]ことはしない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私たちの場所では」。ここでは「この地方では」または「私たちの間では」という地域の慣習を指す。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は直訳すると「与える」。ここでは娘を結婚相手に与える、すなわち嫁がせるという意味。
    reason: lexical_alternative
  - marker: c
    text: または「年上の娘」。ヘブライ語は女性の「第一子」を表し、出生順を強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: אמרの物語における標準的な用法を、簡潔で自然な日本語にした。
- source_word: לֹא יֵעָשֶׂה כֵן
  choice: そのようなことはしない
  rationale: ニファル形が表す、個人の行為というより地域社会の慣習・規範として『行われない』という意味を、自然な日本語で表した。
- source_word: בִּמְקוֹמֵנוּ
  choice: 私たちのところでは
  rationale: מָקוֹםの『場所』という具体性を保ちつつ、ここでは地域の慣習を指すことが伝わる自然な表現とした。
- source_word: לָתֵת
  choice: 嫁がせる
  rationale: 字義は『与える』だが、文脈上は娘を結婚相手に与えることを指す。日本語で単に『与える』とすると不自然で誤解を招くため、文脈上の含意を本文に明示した。
- source_word: הַצְּעִירָה
  choice: 下の娘
  rationale: 女性形の形容詞が名詞的に用いられ、『より若い女性・娘』を指す。ラバンの二人の娘について述べる文脈に即しつつ、年齢・出生順の対比を表した。
- source_word: לִפְנֵי
  choice: より先に
  rationale: 空間的位置ではなく、結婚させる順序の先後を示すため、『より先に』と訳した。
- source_word: הַבְּכִירָה
  choice: 長女
  rationale: 女性の『第一子・年長の娘』を表す語であり、単なる年齢差より出生順を強調するため『長女』とした。
