  text: וַ/יְהִ֡י כַּ/אֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת רָחֵ֗ל בַּת לָבָן֙ אֲחִ֣י אִמּ֔/וֹ וְ/אֶת צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑/וֹ וַ/יִּגַּ֣שׁ יַעֲקֹ֗ב וַ/יָּ֤גֶל אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וַ/יַּ֕שְׁקְ אֶת צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/010.yaml
  text: And when Jacob saw Rachel[a], the daughter of Laban, his mother’s brother, and the flock of Laban, his mother’s brother, Jacob came near and rolled the stone from the mouth of the well, and watered the flock of Laban, his mother’s brother.
translation:
  language: ja
  text: さて、ヤコブは、母の兄弟ラバンの娘ラケルと、母の兄弟ラバンの家畜の群れを見ると、近寄って井戸の口を覆っていた石を転がしてどけ、母の兄弟ラバンの家畜の群れに水を飲ませた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では「母の兄弟ラバン」という親族関係がこの節で三度繰り返され、ヤコブとラバンとの親族関係が強調されている。
    reason: 原文の意図的な反復とその強調を読者に示すため。
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: さて、……見ると
  rationale: ヘブライ語の物語を進める定型表現と時を表す従属節を、現代日本語の自然な叙述として表した。
- source_word: רָאָה
  choice: 見ると
  rationale: 視覚による認知を直接表し、後続の行動との時間的なつながりも自然に示す。
- source_word: בַּת לָבָן
  choice: ラバンの娘
  rationale: 構成形による親子関係を簡潔かつ明確に表した。
- source_word: אֲחִי אִמּוֹ
  choice: 母の兄弟
  rationale: 「母方のおじ」よりも原文の親族表現に近く、ラバンが母より年上か年下かを特定しない。原文どおり三度繰り返した。
- source_word: צֹאן
  choice: 家畜の群れ
  rationale: 羊だけに限定せず、羊や山羊などの小家畜を集合的に指し得る語の幅を保ちながら、一般読者にも分かりやすくした。
- source_word: וַיִּגַּשׁ
  choice: 近寄って
  rationale: ヤコブが井戸と群れのところへ接近した動作を自然に表す。
- source_word: וַיָּגֶל
  choice: 石を転がし
  rationale: גללの具体的な「転がす」という動きを保持した。
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: 井戸の口から
  rationale: 「口」という原文の比喩を保持しつつ、מֵעַלが示す、井戸の開口部の上から石を動かす関係を簡潔に表した。
- source_word: וַיַּשְׁקְ
  choice: 水を飲ませた
  rationale: 使役形の意味を、日本語で家畜に対して自然な表現にした。
theological_decisions: []
