revisions:
- from: さて、ヤコブは、母の兄弟ラバンの娘ラケルと、母の兄弟ラバンの家畜の群れを見ると、近寄って井戸の口から石を転がし、母の兄弟ラバンの家畜の群れに水を飲ませた。[a]
  to: さて、ヤコブは、母の兄弟ラバンの娘ラケルと、母の兄弟ラバンの家畜の群れを見ると、近寄って井戸の口を覆っていた石を転がしてどけ、母の兄弟ラバンの家畜の群れに水を飲ませた。[a]
  rationale: 石と井戸の口の空間的関係を現代日本語で明確にするため、「井戸の口から石を転がし」を「井戸の口を覆っていた石を転がしてどけ」に改めた。これは石が井戸の開口部の上に置かれ、それを転がして取り除くという原文の意味を自然に表す。脚注の「血縁」は、この節が明示する親族関係に即したより中立的な「親族関係」に改めた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:49:25Z'
