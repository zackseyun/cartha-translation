  text: וְ/נֶאֶסְפוּ שָׁ֣מָּ/ה כָל הָ/עֲדָרִ֗ים וְ/גָלֲל֤וּ אֶת הָ/אֶ֨בֶן֙ מֵ/עַל֙ פִּ֣י הַ/בְּאֵ֔ר וְ/הִשְׁק֖וּ אֶת הַ/צֹּ֑אן וְ/הֵשִׁ֧יבוּ אֶת הָ/אֶ֛בֶן עַל פִּ֥י הַ/בְּאֵ֖ר לִ/מְקֹמָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/003.yaml
  text: And all the flocks would gather there[a], and they would roll the stone away from the mouth of the well and water the flock[b], and then put the stone back in its place over the mouth of the well.
translation:
  language: ja
  text: すべての羊の群れがそこに集まると、人々は井戸の口[a]から石を転がしてどけ、羊に水を飲ませた。それから、その石を井戸の口の上の元の位置に戻した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「井戸の口」。井戸の開口部を指す。
    reason: ヘブライ語の具体的な比喩を本文に残し、その意味を明確にするため。
lexical_decisions:
- source_word: וְנֶאֶסְפוּ
  choice: 集まると
  rationale: 未完了形がこの場面で繰り返される慣習的な行為を表しているため、後続する一連の動作と自然につながる表現にした。
- source_word: כָל הָעֲדָרִים
  choice: 羊の群れがみな
  rationale: עדרים はこの牧畜場面では主に小家畜の群れを指す。「群れ」を保ちつつ、日本語で対象が明確になるよう「羊の群れ」とした。
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: 石を転がしてどけ
  rationale: גלל の具体的な「転がす」という動きを保ち、井戸の口から取り除くことを自然な日本語で示した。
- source_word: פִּי הַבְּאֵר
  choice: 井戸の口
  rationale: 直訳的な比喩を保った表現であり、日本語でも井戸の開口部を意味するものとして理解できる。脚注で意味を明示した。
- source_word: וְהִשְׁקוּ אֶת הַצֹּאן
  choice: 羊に水を飲ませた
  rationale: שׁקה のヒフィル形が表す「飲ませる」を明確にし、צאן は文脈上、集合的に羊を指すものとして訳した。
- source_word: וְהֵשִׁיבוּ אֶת הָאֶבֶן
  choice: その石を…戻した
  rationale: שוב のヒフィル形が表す、石を元の位置へ戻す使役的な意味を自然に表した。
- source_word: לִמְקֹמָהּ
  choice: 元の場所に
  rationale: 女性単数接尾辞は石を受ける。「戻した」と合わせて、石が所定の位置に置き直されたことを表した。
