revisions:
- from: 羊の群れがみなそこに集まると、人々は井戸の口[a]から石を転がしてどけ、羊に水を飲ませた。それから、その石を井戸の口の元の場所に戻した。
  to: すべての羊の群れがそこに集まると、人々は井戸の口[a]から石を転がしてどけ、羊に水を飲ませた。それから、その石を井戸の口の上の元の位置に戻した。
  rationale: 末尾の場所表現を「井戸の口の上の元の位置」として、石を井戸の開口部を覆う所定の位置へ戻す動作を明瞭にした。また、「羊の群れがみな」をより自然な「すべての羊の群れ」に改めた。脚注の内容とアンカーは維持した。
