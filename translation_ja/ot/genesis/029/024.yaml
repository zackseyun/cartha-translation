  text: ラバンは、自分の女奴隷ジルパを、娘レアに女奴隷として与えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 与えた
  rationale: נתןの基本的な意味を保ち、この場面での人物の移管を解釈しすぎずに表す。
- source_word: זִלְפָּה
  choice: ジルパ
  rationale: ヘブライ語の人名を、日本語で一般的な聖書表記に従って音写した。
- source_word: שִׁפְחָתוֹ
  choice: 自分の女奴隷
  rationale: שִׁפְחָהが示す、隷属的な身分にある女性という意味を明示する。「自分の」は接尾辞「彼の」に対応し、主語ラバンを自然に指す。
- source_word: לְלֵאָה בִתּוֹ
  choice: 娘レアに
  rationale: 前置詞לְを受け手を示す「に」とし、בִּתּוֹを自然な同格表現「娘レア」で表した。
- source_word: שִׁפְחָה
  choice: その女奴隷として
  rationale: 末尾の名詞がジルパに与えられる役割・身分を示す構文であることを、日本語として明瞭に表した。「その」はレアに属する立場を文脈上示す。
