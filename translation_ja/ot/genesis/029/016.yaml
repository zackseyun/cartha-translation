base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/016.yaml
  text: Laban had two daughters; the name of the older was Leah[a], and the name of the younger was Rachel.
translation:
  language: ja
  text: ラバンには二人の娘がいた。姉の名はレア、妹の名はラケルであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְלָבָן
  choice: ラバンには…がいた
  rationale: 前置詞 לְ を用いたヘブライ語の所有構文を、現代日本語で自然な存在・所有表現にした。語頭の וּ は物語をつなぐ接続辞であり、文脈上、日本語に独立した接続語を置かなくてもよい。
- source_word: שְׁתֵּי בָנוֹת
  choice: 二人の娘
  rationale: 数詞と名詞の連語をそのまま明瞭に訳した。人を数える自然な日本語として「二人」を用いた。
- source_word: שֵׁם הַגְּדֹלָה
  choice: 姉の名
  rationale: 二人の娘の比較なので הַגְּדֹלָה は年長者を指す。「年上の娘の名」より簡潔で自然な「姉の名」とし、原文の「名」の反復は保った。
- source_word: לֵאָה
  choice: レア
  rationale: ヘブライ語名 לֵאָה の日本語聖書で広く認識される慣用的な音写。
- source_word: וְשֵׁם הַקְּטַנָּה
  choice: 妹の名
  rationale: 並行する名の提示を保ち、二人の姉妹という文脈で הַקְּטַנָּה を年少者を示す「妹」と訳した。
- source_word: רָחֵל
  choice: ラケル
  rationale: ヘブライ語名 רָחֵל の日本語聖書で広く認識される慣用的な音写。
