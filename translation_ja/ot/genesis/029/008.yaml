revisions:
- from: 彼らは言った。「できません。群れがみな集まり、人々が井戸の口から石を転がしてどけるまでは。それから私たちは羊の群れに水を飲ませます[a]。」
  to: 彼らは言った。「すべての群れが集まり、石を井戸の口から転がしてどけるまでは、私たちにはできません。それから、私たちはその群れ[a]に水を飲ませます。」
  rationale: 条件節を不能表現と結び付けて自然な日本語に改めた。「人々」という補足主語を削除し、原文の複数主語の特定されない性質を保った。末尾の集合名詞は本文で羊に限定せず、脚注で語義の範囲を示した。
