base_translation:
  language: en
  yaml_path: translation/ot/genesis/029/008.yaml
  text: They said[a], “We cannot until all the flocks are gathered and they roll the stone away from the mouth of the well[b]; then we water the sheep.”
translation:
  language: ja
  text: 彼らは言った。「すべての群れが集まり、石を井戸の口から転がしてどけるまでは、私たちにはできません。それから、私たちはその群れ[a]に水を飲ませます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は、羊や山羊などの小型家畜の群れを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: נוּכַל
  choice: できません
  rationale: 一人称複数の能力の欠如を簡潔に表す。後続の「までは」と結びつけ、原文の省略を保った。
- source_word: יֵאָסְפוּ כָּל הָעֲדָרִים
  choice: 群れがみな集まり
  rationale: ニファル形の受動・集合的な意味を自然な日本語で表し、家畜の種類は限定しない。
- source_word: וְגָלֲלוּ אֶת הָאֶבֶן
  choice: 人々が…石を転がしてどける
  rationale: 動詞の複数主語は文脈上不特定の人々として示し、石を井戸口から移す動作を明確にした。
- source_word: מֵעַל פִּי הַבְּאֵר
  choice: 井戸の口から
  rationale: 「口」という原文の具体的な比喩を、日本語でも理解可能な形で保持した。
- source_word: וְהִשְׁקִינוּ הַצֹּאן
  choice: それから私たちは羊の群れに水を飲ませます
  rationale: ヒフィル形の使役的意味と、先行動作後の順序を明示した。צאןは集合名詞として訳した。
