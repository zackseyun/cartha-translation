  yaml_path: translation/ot/genesis/029/031.yaml
  text: When the LORD saw that Leah was hated, he opened her womb, but Rachel was barren.
translation:
  language: ja
  text: 主は、レアが憎まれているのを見て、彼女の胎を開かれた。しかし、ラケルは不妊であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を示す慣例的で明瞭な訳語。文脈の厳粛さを保つ。
- source_word: שְׂנוּאָה
  choice: 憎まれている
  rationale: 語の基本的な強さを保持し、「愛されていない」と弱めず、姉妹間の比較という含みも訳文だけで解消しない。
- source_word: וַיִּפְתַּח אֶת־רַחְמָהּ
  choice: 彼女の胎を開かれた
  rationale: ヘブライ語の身体的比喩を保ちつつ、日本語として理解できる聖書的表現にした。
- source_word: עֲקָרָה
  choice: 不妊であった
  rationale: 子を産めない状態を簡潔かつ現代的に表す。
theological_decisions:
- issue: レアに対する扱いの強さ
  choice: 憎まれている
  alternative: 愛されていない
  rationale: 原文の שְׂנוּאָה をそのまま強く訳し、それが絶対的憎悪か比較上の冷遇かという文脈上の緊張を訳語で解消しない。
- issue: 受胎における神の働き
  choice: 主が彼女の胎を開いたと明示
  alternative: 彼女は身ごもれるようになった
  rationale: 原文が神を明確な主語としているため、その因果的・神学的表現を保持する。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「胎を開く」は原文の比喩を保つため採用し、過度に口語化しない。
