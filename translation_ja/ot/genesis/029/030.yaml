  text: So he went in to Rachel also[a], and he loved Rachel more than Leah; and he served with him for another seven years.
translation:
  language: ja
  text: ヤコブはラケルのもとにも入った。そして、レアよりもラケルを愛し、さらに七年間、ラバンのもとで仕えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא גַּם אֶל־רָחֵל
  choice: ラケルのところにも入り
  rationale: בוא אל はこの婚姻の文脈で、妻のもとに入って結婚を成就することを婉曲に表す。「ところにも入り」として、性的含意を保ちながら過度に露骨な表現を避けた。גם は「も」で、レアに続く追加を示した。
- source_word: וַיֶּאֱהַב גַּם אֶת־רָחֵל
  choice: ラケルを愛した
  rationale: אהב は通常の「愛する」。原文の動詞自体には強意の副詞がないため、簡潔に訳した。二つ目の גם は日本語では比較表現の流れに吸収し、不自然な重複を避けた。
- source_word: מִלֵּאָה
  choice: レアよりも
  rationale: 愛情を表す動詞に続く מן は、ここでは自然に比較を示す。「レアよりもラケルを愛した」とし、比較の意味を明確にした。
- source_word: וַיַּעֲבֹד עִמּוֹ
  choice: ラバンのもとで仕えた
  rationale: עבד は「仕える、働く」、עמו は字義的には「彼とともに」。日本語では継続してラバンの下で働いた意味が自然に伝わるよう「ラバンのもとで仕えた」とした。代名詞の指示対象も明確にした。
- source_word: עוֹד שֶׁבַע־שָׁנִים אֲחֵרוֹת
  choice: さらに七年間
  rationale: עוֹד と אֲחֵרוֹת は追加の期間を表すため、明瞭で自然な「さらに七年間」とした。
