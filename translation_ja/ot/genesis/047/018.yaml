  text: וַ/תִּתֹּם֮ הַ/שָּׁנָ֣ה הַ/הִוא֒ וַ/יָּבֹ֨אוּ אֵלָ֜י/ו בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית וַ/יֹּ֤אמְרוּ ל/וֹ֙ לֹֽא נְכַחֵ֣ד מֵֽ/אֲדֹנִ֔/י כִּ֚י אִם תַּ֣ם הַ/כֶּ֔סֶף וּ/מִקְנֵ֥ה הַ/בְּהֵמָ֖ה אֶל אֲדֹנִ֑/י לֹ֤א נִשְׁאַר֙ לִ/פְנֵ֣י אֲדֹנִ֔/י בִּלְתִּ֥י אִם גְּוִיָּתֵ֖/נוּ וְ/אַדְמָתֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/018.yaml
  text: 'When that year ended[a], they came to him in the second year and said to him, “We will not hide it from my lord: the money is gone, and the livestock of the herds belongs to my lord[b]. Nothing is left before my lord except our bodies and our land.”'
translation:
  language: ja
  text: その年が終わると、彼らは次の年にヨセフのもとに来て、こう言った。「ご主人様には隠さず申し上げます。お金は尽き[a]、家畜もご主人様のものとなりました。ご主人様の前に残っているのは、私たちの体[b]と土地だけです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「銀は尽き」。聖書ヘブライ語では「銀」がしばしば金銭を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「私たち自身」とも訳せる。ヘブライ語では字義的に「私たちの体」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתֹּם הַשָּׁנָה הַהִוא
  choice: その年が終わると
  rationale: תמםの「終わる、完了する」という意味と、指示語を伴う「その年」を、自然な時間節として表した。
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: 二年目にも
  rationale: 原文の「第二の年に」を保ちつつ、前年に続いて再び来たという文脈上のつながりを「も」で示した。単に「翌年」として起点を決めすぎることは避けた。
- source_word: לֹא נְכַחֵד מֵאֲדֹנִי
  choice: ご主人様に隠さず申し上げます
  rationale: כחדの「隠す」を保持し、敬意を込めた直接話法として現代日本語で自然な表現にした。
- source_word: תַּם הַכֶּסֶף
  choice: お金は尽き
  rationale: כסףは字義的には「銀」だが、ここでは支払い手段を指すため「お金」とした。תםの枯渇の意味は「尽き」で表した。
- source_word: וּמִקְנֵה הַבְּהֵמָה אֶל אֲדֹנִי
  choice: 家畜もご主人様のものとなりました
  rationale: 家畜という財産がヨセフへ移ったことを示す表現。אֶלは字義的には「～へ」だが、文脈上の所有移転を自然に明示した。
- source_word: לֹא נִשְׁאַר לִפְנֵי אֲדֹנִי
  choice: ご主人様に差し出せるものは……何も残っておりません
  rationale: לִפְנֵיの字義的な「～の前に」を、この場面での「相手の手に渡し得るもの」という機能に即して明瞭に表した。
- source_word: גְּוִיָּתֵנוּ
  choice: 私たちの体
  rationale: גויהは身体、肉体を指す。生きている話者たちが自分自身を労働力・所有対象として差し出す文脈なので、具体性を保つ「体」とした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に通じる丁寧で格調ある直接話法とした。אֲדֹנִיは話者集団が用いる単数形「私の主人」だが、日本語では所有代名詞を補わず、敬称的な「ご主人様」で自然に表現した。脚注記号は、それぞれ実際に説明する「お金」と「体」の直後に置いた。
