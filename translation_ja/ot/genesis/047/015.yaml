  text: וַ/יִּתֹּ֣ם הַ/כֶּ֗סֶף מֵ/אֶ֣רֶץ מִצְרַיִם֮ וּ/מֵ/אֶ֣רֶץ כְּנַעַן֒ וַ/יָּבֹאוּ֩ כָל מִצְרַ֨יִם אֶל יוֹסֵ֤ף לֵ/אמֹר֙ הָֽבָ/ה לָּ֣/נוּ לֶ֔חֶם וְ/לָ֥/מָּה נָמ֖וּת נֶגְדֶּ֑/ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/015.yaml
  text: When the money from the land of Egypt and from the land of Canaan was gone[a], all the Egyptians came to Joseph, saying, "Give us bread[c][b]. Why should we die before you? For the money is gone."
translation:
  language: ja
  text: エジプトの地とカナンの地で金銭が尽きると[a]、エジプト中の人々がヨセフのもとに来て[b]、言った。「私たちにパンをください[c]。なぜ私たちはあなたの前で死ななければならないのですか。金銭が尽きたからです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「金銭」は「銀」とも訳せる。ヘブライ語は、銀という金属と金銭のどちらも意味する。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「全エジプトがヨセフのもとに来て」。ここではエジプトの人々を集合的に指す。
    reason: lexical_alternative
  - marker: c
    text: ここで「パン」は、飢饉の中で必要とされる食糧全般を指している可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֹּם הַכֶּסֶף
  choice: 金が尽きると
  rationale: תמםは使い果たされて尽きることを表す。「金が尽きる」は簡潔で自然であり、文脈にも合う。
- source_word: הַכֶּסֶף / כָּסֶף
  choice: 金
  rationale: כֶּסֶףには「銀」と「金銭」の両義がある。飢饉時の売買の文脈では支払いに用いる金銭を指すため、「金」とした。
- source_word: מֵאֶרֶץ מִצְרַיִם וּמֵאֶרֶץ כְּנַעַן
  choice: エジプトの地とカナンの地から
  rationale: 前置詞מִןの起点・離脱のニュアンスを保ち、両地域から金銭がなくなったことを表した。
- source_word: וַיָּבֹאוּ כָל מִצְרַיִם
  choice: エジプト中の人々がヨセフのもとに来て
  rationale: 直訳は「全エジプトが来た」だが、集合的に住民を指す。日本語では「エジプト中の人々」が自然である。
- source_word: הָבָה לָּנוּ לֶחֶם
  choice: 私たちにパンをください
  rationale: הָבָהの要求とלֶחֶםの具体的な語を保った。「パン」はこの飢饉の文脈では食糧一般を指し得る。
- source_word: וְלָמָּה נָמוּת נֶגְדֶּךָ
  choice: なぜ私たちがあなたの前で死ななければならないのですか
  rationale: 切迫した修辞疑問を自然な敬体で表し、נֶגְדֶּךָを「あなたの前で」として、ヨセフの面前という意味を保持した。
- source_word: כִּי אָפֵס כָּסֶף
  choice: もう金がないのです
  rationale: אָפֵסは消尽・不存在を示す。発話として自然な「もう金がない」で切迫感と理由説明を伝えた。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある標準日本語。民衆から権力者ヨセフへの訴えであるため、直接話法は自然な敬体とした。原文の「パン」「あなたの前で」を本文に残し、語義の広がりは脚注で示した。
