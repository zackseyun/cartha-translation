base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/024.yaml
  text: And at the harvest[a], you shall give a fifth to Pharaoh, and four-fifths shall be yours for seed for the field, for your food, for those in your households, and for food for your little ones.
translation:
  language: ja
  text: 収穫の時には、その五分の一をファラオに納めなさい。残りの五分の四は、畑にまく種、あなたがたの食べ物、家にいる者たちのため、そして幼い子どもたちの食べ物として、あなたがたのものとなる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「五分の四」のヘブライ語は、直訳すると「四つの手（部分）」。直前の五分の一を除いた残り四部分を意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּתְּבוּאֹת
  choice: 収穫の時には
  rationale: תְּבוּאָהは作物・収穫物を指し、前置詞בְּを伴うこの文脈では、収穫物が得られる時を自然な日本語で表す。
- source_word: וּנְתַתֶּם חֲמִישִׁית לְפַרְעֹה
  choice: その五分の一をファラオに納めなさい
  rationale: חֲמִישִׁיתは五分の一。行政的な割り当てなので、単なる授与より「納める」が日本語として明確。
- source_word: וְאַרְבַּע הַיָּדֹת
  choice: 残りの五分の四
  rationale: 字義は「四つの手（部分）」だが、直前の五分の一に対する残り四部分、すなわち五分の四を表す慣用句。日本語では意味を明示する。
- source_word: יִהְיֶה לָכֶם
  choice: …にしなさい
  rationale: 残りの収穫物が彼らの取り分となり、列挙された用途に充てられることを、前後に合う自然な命令表現で示す。
- source_word: לְזֶרַע הַשָּׂדֶה
  choice: 畑にまく種
  rationale: לְは用途を示し、次の作付けのために確保する種を意味するため、用途を自然に明示した。
- source_word: וּלְאָכְלְכֶם
  choice: あなたがたの食べ物
  rationale: אכל由来の形はここで食用・食糧を表す。簡潔で現代的な表現を採用。
- source_word: וְלַאֲשֶׁר בְּבָתֵּיכֶם
  choice: 家にいる者たちの食べ物
  rationale: 関係句は家屋内の物ではなく、各家に属する人々を指すと解し、対象を自然に明示した。
- source_word: וְלֶאֱכֹל לְטַפְּכֶם
  choice: 幼い子どもたちの食べ物
  rationale: טַףは幼い子ども、また文脈により扶養家族を指し得る。ここでは家族単位の配給を述べるため、基本的な家族的意味を採用した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある標準日本語。ファラオへの割り当てには「納める」を用い、残余の用途は並列関係が分かるよう整理した。脚注記号は節末に置き、慣用句の説明対象である「五分の四」を含む本文全体に結び付けた。
