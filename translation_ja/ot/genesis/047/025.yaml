    rationale: 「恵みを見いださせてください」は原文の一人称複数の願望形を、許可を求める使役形へ変えている。また「私の主人」を明瞭に示す必要がある。
  revised_text: 彼らは言った。「あなた様は私たちを生かしてくださいました。どうか、私たちが主人であるあなた様のご好意を得られますように[a]。私たちはファラオの奴隷になります。」
