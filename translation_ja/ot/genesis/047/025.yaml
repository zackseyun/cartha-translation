  text: וַ/יֹּאמְר֖וּ הֶחֱיִתָ֑/נוּ נִמְצָא חֵן֙ בְּ/עֵינֵ֣י אֲדֹנִ֔/י וְ/הָיִ֥ינוּ עֲבָדִ֖ים לְ/פַרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/025.yaml
  text: And they said[a], “You have kept us alive. May we find favor in the eyes of my lord, and we will be servants to Pharaoh.”
translation:
  language: ja
  text: 彼らは言った。「あなた様は私たちを生かしてくださいました。どうか、私たちが主人であるあなた様のご好意を得られますように[a]。私たちはファラオの奴隷になります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「どうか、私たちが私の主人の目に恵みを見いだせますように」。これは、相手の好意を願う丁重なヘブライ語の言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 彼らは言った
  rationale: 物語を進めて直接話法を導くワウ継続法を、現代日本語で自然な叙述として表した。
- source_word: הֶחֱיִתָנוּ
  choice: 私たちを生かしてくださいました
  rationale: חיה のヒフィル形が持つ「生きさせる、生き長らえさせる」という使役的意味を保ち、宗教的な「救い」の意味を不必要に加えない表現とした。
- source_word: נִמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: どうか、あなた様のご好意にあずからせてください
  rationale: 一人称複数の未完了形を、この文脈における丁重な願いとして訳した。「目に恵みを見いだす」というヘブライ語の慣用句は、日本語では意味が明瞭な「好意にあずかる」とし、原文の比喩は脚注に示した。אֲדֹנִי はヨセフへの敬意ある呼びかけなので「あなた様」に反映した。
- source_word: וְהָיִינוּ
  choice: 私たちは……になります
  rationale: 接続詞を伴う完了形を、ヨセフの措置に応じた結果的な決意・約束として未来表現にした。
- source_word: עֲבָדִים לְפַרְעֹה
  choice: ファラオの奴隷
  rationale: 土地と身体を差し出す経済的隷属が文脈上明確なので、עֲבָדִים の拘束された身分を曖昧にしない「奴隷」とした。לְ は所属・奉仕の関係として自然な属格で表した。
