  text: וַ/יֹּ֗אמֶר הִשָּֽׁבְעָ/ה֙ לִ֔/י וַ/יִּשָּׁבַ֖ע ל֑/וֹ וַ/יִּשְׁתַּ֥חוּ יִשְׂרָאֵ֖ל עַל רֹ֥אשׁ הַ/מִּטָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/031.yaml
  text: He said[a], “Swear to me,” and he swore to him. Then Israel bowed himself on the head of the bed.
translation:
  language: ja
  text: 彼は言った。「私に誓ってくれ。」ヨセフが彼に誓うと、イスラエルは寝床の頭のところで[a]身をかがめた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寝床の頭のところで」の別の読みは「杖の先で」。ヘブライ語の子音本文はそのようにも読むことができ、七十人訳とヘブライ人への手紙11章21節はこの読みを反映している。
    reason: alternative_reading
lexical_decisions:
- source_word: הִשָּׁבְעָה לִי
  choice: 私に誓ってくれ
  rationale: 誓いを求める命令を、直接的で自然な現代日本語にした。「誓約を立ててくれ」より簡潔で、原文の切迫した語調を保つ。
- source_word: וַיִּשָּׁבַע לוֹ
  choice: ヨセフが彼に誓うと
  rationale: 同じ誓いの動詞を「誓う」で統一した。文脈上の主語ヨセフを明示し、日本語で代名詞が連続することによる混乱を避けた。
- source_word: וַיִּשְׁתַּחוּ
  choice: 身をかがめた
  rationale: この動詞は礼拝や平伏を表し得るが、ここでは礼拝の対象が明示されず、身体動作が前景化しているため、神学的意味を限定しない表現を選んだ。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 原文が用いる名をそのまま保ち、「ヤコブ」に置き換えなかった。
- source_word: עַל רֹאשׁ הַמִּטָּה
  choice: 寝床の頭のところで
  rationale: マソラ本文の母音記号に従って הַמִּטָּה を「寝床」とし、רֹאשׁ と עַל の空間的表現を、過度に解釈せず自然な日本語で表した。
- source_word: הַמִּטָּה
  choice: 寝床
  rationale: マソラ本文の読み mittāh に従う。「ベッド」よりも物語の時代に調和する、明瞭で一般的な語を選んだ。
theological_decisions:
- issue: ヘブライ語の子音本文は「寝床」と「杖」の両方の読みを許し、七十人訳とヘブライ人への手紙11章21節は「杖」に対応する。
  choice: 寝床
  alternative: 杖
  rationale: 創世記本文では、現存するマソラ本文の母音記号が示す「寝床」を本文に採用する。一方、「杖」は古代訳および新約聖書に証言される重要な異読なので、脚注に明記して緊張関係を残す。
- issue: וַיִּשְׁתַּחוּ が身体的な礼と神への礼拝のどちらを指すか。
  choice: 身をかがめた
  alternative: 礼拝した／ひれ伏した
  rationale: 目的語が明示されていないため、本文では身体動作を表す中立的な訳を採用し、礼拝であると断定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。誓いの場面の直接性を残しつつ、代名詞の連続を避けるため文脈上の主語を明示した。異読は本文で一方的に調和させず、脚注に保存した。
