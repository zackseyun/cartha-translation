base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/010.yaml
  text: Then Jacob blessed Pharaoh and went out from Pharaoh’s presence[a].
translation:
  language: ja
  text: ヤコブはファラオを祝福し[a]、ファラオの前から退出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファラオに別れのあいさつをし」。ヘブライ語の動詞は通常「祝福する」を意味するが、王への謁見という文脈では、正式なあいさつや別れの礼を表すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 祝福し
  rationale: ברךの通常の意味である「祝福する」を採用する。宮廷での謁見という文脈では正式なあいさつや別れの礼を含み得るが、直前の7節と同じ語義を保つのが自然である。
- source_word: יַעֲקֹב
  choice: ヤコブ
  rationale: 日本語聖書で定着している人名表記。
- source_word: אֶת
  choice: 訳出しない
  rationale: ヘブライ語の直接目的語標識であり、日本語では語順と助詞によって関係を示す。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として現代日本語で広く通用する表記。
- source_word: וַיֵּצֵא
  choice: 退出した
  rationale: יצאは「出る」を意味する。王の前での謁見を終えて出た場面なので、「退出した」が簡潔で自然かつ品位ある表現となる。
- source_word: מִלִּפְנֵי
  choice: ファラオの前から
  rationale: 「〜の前から」というヘブライ語の空間的表現を保ちつつ、日本語として自然に人物の面前から去ることを表す。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「退出した」により王への謁見の場面を自然に示し、「祝福した」という本文の基本的な語義と、宮廷的なあいさつという可能性を脚注で併記した。
