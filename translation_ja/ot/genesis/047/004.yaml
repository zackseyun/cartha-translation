base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/004.yaml
  text: They said to Pharaoh[a], “We have come to sojourn in the land, because there is no pasture for the flocks that belong to your servants, for the famine is severe in the land of Canaan. And now, please let your servants dwell in the land of Goshen.”
translation:
  language: ja
  text: 彼らはファラオに言った。「私たちは、この地に寄留するためにやって来ました。[a] あなたのしもべたちの羊ややぎの群れには牧草地がありません。カナンの地では飢饉がひどいからです。どうか今、あなたのしもべたちをゴシェンの地に住まわせてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この地で外国人として暮らすためにやって来ました。」
    reason: גורには、永住者ではなく外国人または一時的居住者として暮らすという含意があるため。
lexical_decisions:
- source_word: לָגוּר
  choice: 寄留する
  rationale: גורは、外国人または一時的な居住者として暮らすことを表す。「寄留する」は現代日本語ではやや改まった語だが、この法的・社会的な含意を簡潔に保つ。
- source_word: בָּאָרֶץ
  choice: この地に
  rationale: 文脈上はファラオの支配するエジプトの地を指す。話者の場面に即して「この地」とすることで、自然な日本語と地理的な指示性を両立させた。
- source_word: מִרְעֶה
  choice: 牧草地
  rationale: 家畜を放牧する場所または牧草を意味する。この文脈では土地の不足が問題なので「牧草地」が明確である。
- source_word: לַצֹּאן
  choice: 家畜の群れには
  rationale: צֹאןは主に羊や山羊からなる小家畜を集合的に指す。単に「羊」と限定せず、「家畜の群れ」として集合的意味を保った。
- source_word: אֲשֶׁר לַעֲבָדֶיךָ
  choice: あなたのしもべどもの家畜の群れ
  rationale: 所有関係と、ファラオへのへりくだった自己呼称を自然な日本語で表した。
- source_word: כָבֵד הָרָעָב
  choice: 飢饉がひどい
  rationale: כבדの字義は「重い」だが、飢饉については深刻さ・激しさを表すため、現代日本語では「ひどい」が自然で明瞭である。
- source_word: יֵשְׁבוּ נָא
  choice: どうか今、…住まわせてください
  rationale: 願望・要請を表す形とנאの丁寧な懇願を、日本語の許可を求める表現で示した。「住まわせる」は、ファラオに居住の許可を願う文脈を明確にする。
- source_word: עֲבָדֶיךָ
  choice: あなたのしもべども
  rationale: 宮廷でのへりくだった自己呼称であり、ここでは身分としての「奴隷」より敬意を込めた「しもべ」が適切。「ども」により複数と謙譲を示した。
- source_word: אֶרֶץ גֹּשֶׁן
  choice: ゴシェンの地
  rationale: ヘブライ語の地理的呼称を明示的に保ち、創世記の文体にもふさわしい表現とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、ファラオへの宮廷的な敬意は「あなたのしもべども」「どうか…ください」で表した。「寄留」は意味の精度を優先して本文に残し、平易な言い換えを脚注に示した。
