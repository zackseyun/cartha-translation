  source_fidelity: 全体としてヘブライ語本文に忠実である。וַיּוֹשֵׁב の使役は「住まわせ」で表され、父と兄弟、エジプト、その最良の部分、ラメセス、ファラオの命令という各要素も保たれている。ただし「彼らの所有地」は、授与される土地というより、すでに彼らが所有する土地をヨセフが与えたかのようにも読めるため、与格を明示するほうが אֲחֻזָּה の授与構文に正確である。
