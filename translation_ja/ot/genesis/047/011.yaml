base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/011.yaml
  text: So Joseph settled his father and his brothers[a], and gave them a possession in the land of Egypt, in the best part of the land, in the land of Rameses, just as Pharaoh had commanded.
translation:
  language: ja
  text: ヨセフは、父と兄弟たちを住まわせ、エジプトの地の中でも最も良い所[a]、すなわちラメセスの地に、彼らに所有地を与えた。ファラオが命じたとおりであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その地の最良の部分」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשֵׁב
  choice: 住まわせ
  rationale: 使役形の意味を保ち、ヨセフが父と兄弟たちの居住を取り計らったことを自然な現代日本語で表す。
- source_word: אָבִיו וְאֶת־אֶחָיו
  choice: 父と兄弟たち
  rationale: 原文が明示する親族関係を広げず、そのまま訳す。
- source_word: וַיִּתֵּן לָהֶם אֲחֻזָּה
  choice: 彼らの所有地を与えた
  rationale: אֲחֻזָּה が指す土地の保有・所有の具体性を示し、「相続地」が帯び得る契約神学的含意は持ち込まない。
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: その地の中でも最も良い所
  rationale: 最良・最上の部分という意味を、明瞭で自然な日本語にする。
- source_word: בְּאֶרֶץ רַעְמְסֵס
  choice: ラメセスの地
  rationale: 地名を音写し、אֶרֶץ が地域・領域を指す表現を「地」で保持する。
- source_word: כַּאֲשֶׁר צִוָּה פַרְעֹה
  choice: ファラオが命じたとおりであった
  rationale: ヨセフの行為がファラオの先行する命令に従ったことを、物語の流れに即して表す。
theological_decisions: []
