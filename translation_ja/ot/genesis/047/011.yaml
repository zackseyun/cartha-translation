  terminology: 「ヨセフ」「ファラオ」「ラメセス」は適切である。「所有地」は אֲחֻזָּה の土地保有の含意をよく表す。脚注も最良の部分という語彙上の代案を適切に示しており、アンカー位置も該当句に置かれている。
