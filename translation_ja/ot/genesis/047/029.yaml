  text: וַ/יִּקְרְב֣וּ יְמֵֽי יִשְׂרָאֵ֘ל לָ/מוּת֒ וַ/יִּקְרָ֣א לִ/בְנ֣/וֹ לְ/יוֹסֵ֗ף וַ/יֹּ֤אמֶר ל/וֹ֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֣חַת יְרֵכִ֑/י וְ/עָשִׂ֤יתָ עִמָּדִ/י֙ חֶ֣סֶד וֶ/אֱמֶ֔ת אַל נָ֥א תִקְבְּרֵ֖/נִי בְּ/מִצְרָֽיִם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/029.yaml
  text: When the days of Israel drew near for him to die[a], he called his son Joseph and said to him, “If now I have found favor in your eyes, please put your hand under my thigh, and deal with me in steadfast love and faithfulness[b]. Please do not bury me in Egypt.”
translation:
  language: ja
  text: イスラエルが死ぬ時が近づいたとき、彼は息子ヨセフを呼んで言った。「もし私があなたの好意を得ているなら、どうかあなたの手を私のももの下に置き[a]、私に慈しみと誠実を示してほしい[b]。どうか私をエジプトに葬らないでくれ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「手をももの下に置く」とは、族長物語に見られる厳粛な誓いの所作。創世記24章2節参照。
    reason: cultural_note
  - marker: b
    text: 「慈しみと誠実」は、揺るがない忠実な愛と、確かで信頼できる行いを表すヘブライ語の組み合わせ。別訳「変わらぬ愛と誠実」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ יְמֵי יִשְׂרָאֵל לָמוּת
  choice: イスラエルの死ぬ日が近づいたとき
  rationale: 「日々が近づく」というヘブライ語の比喩を「死ぬ日が近づく」と自然な日本語で保ち、本文どおり「イスラエル」の名を用いた。
- source_word: לִבְנוֹ לְיוֹסֵף
  choice: 息子ヨセフ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
- source_word: אִם נָא מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: もし私があなたの好意を得ているなら
  rationale: 直訳的な「あなたの目に恵みを見いだした」を、丁寧な依頼を導く慣用句として明瞭な現代日本語にした。
- source_word: שִׂים נָא יָדְךָ תַּחַת יְרֵכִי
  choice: どうかあなたの手を私のももの下に置き
  rationale: 族長物語に特有の誓約の所作を具体的なまま残し、脚注で文化的背景を補った。
- source_word: וְעָשִׂיתָ עִמָּדִי חֶסֶד וֶאֱמֶת
  choice: 私に誠実な愛と真実を尽くしてほしい
  rationale: חֶסֶדの揺るがない忠実な愛と、אֱמֶתの真実・確かさを保ちつつ、日本語として行為を求める表現にした。
- source_word: אַל נָא תִקְבְּרֵנִי בְּמִצְרָיִם
  choice: どうか私をエジプトに葬らないでくれ
  rationale: נָאを切実で丁寧な願いとして表し、地名は標準的な日本語表記にした。
theological_decisions:
- issue: חֶסֶד וֶאֱמֶת の訳し方
  choice: 誠実な愛と真実
  alternative: 慈しみと誠実／変わらぬ愛と真実
  rationale: 家族的な誓約義務における忠実な愛と信頼性を示す語の組み合わせであり、契約概念を本文に明示的に付加せず、原語の二語性と意味の緊張を保った。
- issue: 「手をももの下に置く」という所作
  choice: 本文では字義的に訳し、脚注で誓約の所作と説明する
  alternative: 私に誓ってほしい
  rationale: 具体的な古代の所作を一般化せず、創世記本文の文化的・物語的特徴を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イスラエルが息子に切実に頼む場面なので、「どうか」「してほしい」「ないでくれ」で丁寧さと父親としての自然な語調を両立した。
