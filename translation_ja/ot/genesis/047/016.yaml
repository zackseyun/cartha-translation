  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ הָב֣וּ מִקְנֵי/כֶ֔ם וְ/אֶתְּנָ֥ה לָ/כֶ֖ם בְּ/מִקְנֵי/כֶ֑ם אִם אָפֵ֖ס כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/016.yaml
  text: And Joseph said[a], “Bring your livestock, and I will give to you in exchange for your livestock[b], if the money is gone.”
translation:
  language: ja
  text: ヨセフは言った。「あなたがたの家畜を差し出しなさい。銀が尽きたのなら[b]、その家畜と引き換えに、あなたがたに与えよう[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「あなたがたに与えよう」で、与える物は明記されていない。直前の飢饉の文脈では食物を指すと理解される。
    reason: lexical_alternative
  - marker: b
    text: 文脈上、「銀が尽きたので」または「銀が尽きている以上」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: 差し出しなさい
  rationale: 複数への命令で、所有物を引き渡すよう求める語。行政上の交換という文脈に合い、「持って来なさい」より引き渡しの意味を明確にする。
- source_word: מִקְנֵיכֶם
  choice: あなたがたの家畜
  rationale: 牛だけでなく、所有される群れの動物全般を指し得るため、現代日本語の包括的な「家畜」とした。
- source_word: וְאֶתְּנָה לָכֶם
  choice: あなたがたに食物を与えよう
  rationale: ヘブライ語では与える物が明記されないが、直前の飢饉と食糧購入の文脈から「食物」を補い、日本語として意味を明瞭にした。補足であることは脚注に示す。
- source_word: בְּמִקְנֵיכֶם
  choice: その家畜と引き換えに
  rationale: 前置詞 בְּ がここでは交換・代価を表すため、取引関係が自然に伝わる表現とした。
- source_word: אִם
  choice: なら
  rationale: 基本的な条件表現を本文に残し、文脈上「もうないので」という理由の意味にも読めることを脚注に示して、原文の幅を保った。
- source_word: אָפֵס כָּסֶף
  choice: 銀が尽きた
  rationale: אָפֵס は使い果たされてなくなることを表す。כֶּסֶף はここでは支払いに用いる銀、すなわち貨幣を指すため、簡潔で歴史的文脈にも合う「銀」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で品位のある現代標準日本語。取引の場面に即して「差し出す」「引き換えに」を用い、原文で省略された目的語は文脈から補いつつ脚注で明示した。条件を表す אִם は本文で「なら」とし、理由を示す読みも脚注に残した。
