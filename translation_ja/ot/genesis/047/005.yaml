  yaml_path: translation/ot/genesis/047/005.yaml
  text: Then Pharaoh said to Joseph[a], “Your father and your brothers have come to you.”
translation:
  language: ja
  text: そこで、ファラオはヨセフに言った。「あなたの父と兄弟たちが、あなたのもとに来た。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を前へ進めるワウ継続法の順接的な働きを、自然な現代日本語で表した。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として、日本語聖書で広く通用する表記を用いた。
- source_word: אֶל־יוֹסֵף
  choice: ヨセフに
  rationale: 発言の相手を示す前置詞を、日本語の自然な助詞「に」で表した。
- source_word: לֵאמֹר
  choice: 本文では独立して訳出しない
  rationale: 発言動詞に続いて直接話法を導く定型表現であり、「言って言った」のような不自然な重複を避けた。形式的な対応は脚注に示した。
- source_word: אָבִיךָ
  choice: あなたの父
  rationale: ヨセフに向けた二人称単数の所有表現をそのまま保持した。
- source_word: וְאַחֶיךָ
  choice: と兄弟たち
  rationale: 男性複数の親族名詞「兄弟」を一般化せずに保持した。接続詞は日本語の名詞句として自然な「と」で表した。
- source_word: בָּאוּ
  choice: 来た
  rationale: 完了した到来を表す完了形。日本語では現在との関連も文脈から明らかなため、簡潔な過去形が自然である。
- source_word: אֵלֶיךָ
  choice: あなたのもとに
  rationale: ヨセフを到達点とする移動を表す。「あなたに」よりも、人のところへ来たという意味が明瞭で、原文にない「ここ」を加えない。
