- from: エジプトの地はあなたの前にある[a]。この地の最も良い所に、あなたの父と兄弟たちを住まわせなさい。彼らをゴシェンの地に住ませなさい。もし彼らの中に有能な者たち[b]がいると分かっているなら、その者たちを、私の家畜の管理責任者に任命しなさい。
  to: エジプトの地はあなたの前にある[a]。この地の最も良い所に、あなたの父と兄弟たちを住まわせなさい。彼らはゴシェンの地に住むようにしなさい。もし彼らの中に有能な者たち[b]がいると分かっているなら、その者たちを、私の家畜の管理責任者に任命しなさい。
