  naturalness: 明瞭な現代標準日本語で、全般に自然である。「この地」はエジプトを受ける用法として問題ない。二つ目の居住句を「彼らはゴシェンの地に住むようにしなさい」とすれば、原文の命令＋許可・指示的未完了形の流れを自然に反映できる。
  terminology: 「ゴシェン」「家畜」「管理責任者」は適切である。אַנְשֵׁי־חַיִל はこの文脈では職務能力のある男性を指す表現であり、「有能な者たち」は文脈上許容される。ただし脚注の「有能な男たち」は本文の包括的表現との関係も明瞭で、原語の男性形を示す補足として妥当である。
