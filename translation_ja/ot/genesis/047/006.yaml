  text: אֶ֤רֶץ מִצְרַ֨יִם֙ לְ/פָנֶ֣י/ךָ הִ֔וא בְּ/מֵיטַ֣ב הָ/אָ֔רֶץ הוֹשֵׁ֥ב אֶת אָבִ֖י/ךָ וְ/אֶת אַחֶ֑י/ךָ יֵשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן וְ/אִם יָדַ֗עְתָּ וְ/יֶשׁ בָּ/ם֙ אַנְשֵׁי חַ֔יִל וְ/שַׂמְתָּ֛/ם שָׂרֵ֥י מִקְנֶ֖ה עַל אֲשֶׁר לִֽ/י־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/006.yaml
  text: The land of Egypt is before you[a]. Settle your father and your brothers in the best of the land; let them live in the land of Goshen. And if you know that there are capable men among them[b], then appoint them as overseers of the livestock that belongs to me.
translation:
  language: ja
  text: エジプトの地はあなたの前にある[a]。この地の最も良い所に、あなたの父と兄弟たちを住まわせなさい。彼らはゴシェンの地に住むようにしなさい。もし彼らの中に有能な者たち[b]がいると分かっているなら、その者たちを、私の家畜の管理責任者に任命しなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの前にある」はヘブライ語の慣用表現で、ここではエジプト国内で場所を選べることを意味する。
    reason: cultural_note
  - marker: b
    text: または「力量のある者たち」「有能な男たち」。直訳的には「力・能力のある者たち」で、ここでは必ずしも軍事的な勇敢さを意味しない。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ מִצְרַיִם לְפָנֶיךָ הִוא
  choice: エジプトの地はあなたの前にある
  rationale: לְפָנֶיךָ の「あなたの前に」というヘブライ語の比喩を保ちつつ、文脈上はエジプト国内から自由に場所を選べることを示す。含意は脚注で補った。
- source_word: בְּמֵיטַב הָאָרֶץ
  choice: この地の最も良い所に
  rationale: מֵיטַב は最良・最上の部分を表す。「この地」として直前のエジプトの地を自然に受けた。
- source_word: הוֹשֵׁב
  choice: 住まわせなさい
  rationale: ישׁב のヒフィル命令形が持つ使役の意味を明確に表した。
- source_word: יֵשְׁבוּ
  choice: 彼らを…住ませなさい
  rationale: 居住を意味するカル形を、ファラオがヨセフに与える許可・指示として自然な現代日本語で表した。
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ゴシェンの地に
  rationale: 原文に明示された「地」を保持した。
- source_word: אַנְשֵׁי חַיִל
  choice: 有能な者たち
  rationale: חַיִל は力、能力、力量を含み得るが、ここでは軍事的勇敢さよりも家畜管理に適した力量が焦点である。性別を不必要に強調しない自然な日本語とした。
- source_word: וְשַׂמְתָּם שָׂרֵי מִקְנֶה
  choice: その者たちを、私の家畜の管理責任者に任命しなさい
  rationale: שׂים を職務への「任命」、שָׂרֵי מִקְנֶה を家畜を管理する責任者として文脈に即して表した。
- source_word: עַל אֲשֶׁר לִי
  choice: 私の家畜
  rationale: 直訳的には「私に属するものの上に」だが、直前の מִקְנֶה を受け、ファラオ所有の家畜であることを簡潔に明示した。
