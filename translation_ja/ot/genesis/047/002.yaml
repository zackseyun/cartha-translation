translation:
  language: ja
  text: ヨセフは兄弟たちの中から五人を選び、ファラオの前に立たせた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「兄弟たちの端から」、または「兄弟たちのうち最も優れた者から」とも訳せる。ヘブライ語は字義的には「端・はしから」を含む表現だが、ここでは兄弟たちの中から一部を選んだという意味で用いられている可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְצֵה אֶחָיו
  choice: 兄弟たちの中から
  rationale: מִקְצֵה は字義的には「端から」だが、ここでは集団の一部を取り出す部分的用法と見るのが文脈上自然である。「中から」はその意味を明瞭な現代日本語で表す。
- source_word: לָקַח
  choice: 選び
  rationale: 基本義は「取る」だが、兄弟たちの中から五人を取り分ける場面なので、日本語では「選び」が自然であり、文脈上の行為を明確にする。
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: 五人
  rationale: 対象がすでに「兄弟たち」と明示されているため、「五人の男」と重ねず「五人」とするのが自然で正確である。
- source_word: וַיַּצִּגֵם
  choice: 立たせた
  rationale: 使役形は人をある者の前に置く、立たせることを表す。「ファラオの前に立たせた」は宮廷で引き合わせる場面を自然に伝えつつ、原語の具体性を保つ。
- source_word: לִפְנֵי פַרְעֹה
  choice: ファラオの前に
  rationale: 「ファラオの面前に／臨席のもとに」の意。簡潔で標準的な「ファラオの前に」と訳す。
