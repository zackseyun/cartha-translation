source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔/י שְׁלֹשִׁ֥ים וּ/מְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְ/רָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔/י וְ/לֹ֣א הִשִּׂ֗יגוּ אֶת יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔/י בִּ/ימֵ֖י מְגוּרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/009.yaml
  text: And Jacob said to Pharaoh[a], “The days of the years of my sojourning are one hundred thirty years. Few and evil have been the days of the years of my life[b], and they have not attained to the days of the years of the lives of my fathers in the days of their sojourning.”
translation:
  language: ja
  text: ヤコブはファラオに言った。「私が寄留してきた年月[a]は、百三十年です。私の生涯の年月はわずかで、苦難に満ちており、先祖たちが寄留していた間の生涯の年月には及びません。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私の巡礼、彼らの巡礼」。ヘブライ語は、一時的な在留者または外国人として住むことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: מְגוּרַי / מְגוּרֵיהֶם
  choice: 寄留者として過ごしてきた／過ごした
  rationale: 一時的な在留者・外国人として暮らすことを表す語。日本語では「寄留」だけでは硬く不明瞭になりやすいため、身分を明示する自然な表現とした。
- source_word: יְמֵי שְׁנֵי
  choice: 年月／生涯の年月
  rationale: 「日々」と「年々」を重ねるヘブライ語の厳粛な寿命表現を、日本語として理解できる範囲で「年月」として保持した。
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 百三十年
  rationale: 原文の数値を現代日本語の標準的な表記で示した。
- source_word: מְעַט
  choice: 短く
  rationale: 先祖の寿命と比較して年数が少ないことを表すため、日本語では生涯について自然な「短い」とした。
- source_word: רָעִים
  choice: 苦難に満ちており
  rationale: ここでは道徳的な悪ではなく、ヤコブの生涯に多くの災いと苦しみがあったことを指す。「悪い日々」より文脈に即して明瞭である。
- source_word: הִשִּׂיגוּ
  choice: 及びません
  rationale: 到達する、追いつくという比較の意味を保ち、ヤコブの寿命が先祖たちの寿命に届かないことを自然に表した。
- source_word: אֲבֹתַי
  choice: 先祖たち
  rationale: 文脈上、父イサクだけでなく族長たちを指すため、「父たち」より誤解の少ない表現とした。
theological_decisions:
- issue: 族長が異国寄留者として自らを語ること
  choice: 寄留者として過ごす
  alternative: 巡礼の旅をする
  rationale: 原語は土地における一時的在留・外国人としての生活を表し、霊的な巡礼という後代的含意を明示してはいないため。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある直接話法。ヘブライ語特有の「日々の年々」という重複は逐語的に再現せず、「年月」「生涯の年月」によって厳粛な響きと反復を適度に残した。
