  text: וְ/שָֽׁכַבְתִּי֙ עִם אֲבֹתַ֔/י וּ/נְשָׂאתַ֨/נִי֙ מִ/מִּצְרַ֔יִם וּ/קְבַרְתַּ֖/נִי בִּ/קְבֻרָתָ֑/ם וַ/יֹּאמַ֕ר אָנֹכִ֖י אֶֽעֱשֶׂ֥ה כִ/דְבָרֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/030.yaml
  text: When I lie down with my fathers[a], carry me out of Egypt and bury me in their burial place.” And he said[c][b], “I will do as you have said.”
translation:
  language: ja
  text: 私が先祖たちと共に眠りについたなら[a]、私をエジプトから運び出し、彼らの墓所に葬ってほしい。」するとヨセフは、「お言葉どおりにいたします」と答えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私が先祖たちと共に横たわったなら」。死と埋葬に結びついたヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁכַבְתִּי
  choice: 私が…眠りについたなら
  rationale: 字義的な「横たわる」と、死と埋葬を指す慣用的含意の双方を自然な日本語で保つ。「なら」は、後続する依頼との時間的・条件的関係を表す。
- source_word: עִם אֲבֹתַי
  choice: 先祖たちと共に
  rationale: אָבוֹתはここでは父祖・祖先を指す。「父たち」より現代日本語で明瞭であり、家族の墓所に加えられる文脈にも合う。
- source_word: וּנְשָׂאתַנִי
  choice: 私を…運び出し
  rationale: נשאはこの葬送文脈では遺体を担い、移送することを表す。「運び出す」によりエジプトから外へ移す方向も明確になる。
- source_word: מִמִּצְרַיִם
  choice: エジプトから
  rationale: מןの起点・離脱の意味を、「運び出す」と組み合わせて自然に表す。
- source_word: וּקְבַרְתַּנִי
  choice: 私を…葬ってほしい
  rationale: קברの「葬る」をそのまま採り、連続する依頼として自然な日本語にする。
- source_word: בִּקְבֻרָתָם
  choice: 彼らの墓所に
  rationale: קְבֻרָהは墓または埋葬地を指し得る。「墓所」は家族の埋葬場所を示しつつ、墓の具体的形状を限定しない。
- source_word: וַיֹּאמַר
  choice: するとヨセフは…答えた
  rationale: 単純な物語の継起を「すると」で示す。主語は文脈上ヨセフであり、日本語では明示する方が読みやすい。「答えた」は依頼への応答という発話機能を自然に表す。
- source_word: אָנֹכִי אֶעֱשֶׂה
  choice: いたします
  rationale: 独立代名詞אָנֹכִיを含む約束の応答を、父への敬意を伴う一人称の確約として簡潔に表す。
- source_word: כִדְבָרֶךָ
  choice: お言葉どおりに
  rationale: 字義的には「あなたの言葉に従って」。現代日本語で、依頼されたとおり実行する意味と敬意を自然に伝える。
theological_decisions:
- issue: 「先祖たちと共に眠る」が指す範囲
  choice: 死を表す慣用句であることを脚注で示し、本文では「眠りにつく」という比喩を保持する。
  alternative: 本文で「死んだなら」と明示する。
  rationale: ヘブライ語は死と埋葬に結びつく慣用表現だが、死後の状態について本文以上の解釈を加えず、その比喩と曖昧さを保つ。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。ヤコブの依頼には「葬ってほしい」、ヨセフの返答には「お言葉どおりにいたします」を用い、親子間の敬意と厳粛な葬送文脈を自然に表した。
