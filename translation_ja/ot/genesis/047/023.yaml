source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל הָ/עָ֔ם הֵן֩ קָנִ֨יתִי אֶתְ/כֶ֥ם הַ/יּ֛וֹם וְ/אֶת אַדְמַתְ/כֶ֖ם לְ/פַרְעֹ֑ה הֵֽא לָ/כֶ֣ם זֶ֔רַע וּ/זְרַעְתֶּ֖ם אֶת הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/023.yaml
  text: Then Joseph said to the people[a], “Look, today I have bought you and your land for Pharaoh. Here is seed for you, and you shall sow the land.”
translation:
  language: ja
  text: ヨセフは民に言った。「見なさい。今日、私はあなたがたとあなたがたの土地をファラオのために買い取った[a]。ここに、あなたがたのための種がある。土地に種をまきなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「取得した」とも訳せる。ヘブライ語の動詞は、代価を払って買うことのほか、より広く所有物として得ることも表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ連続法は、日本語では文脈上自然な過去形で表した。
- source_word: הָעָם
  choice: 民
  rationale: 集合的に呼びかけられたエジプトの住民を指す。簡潔で品位ある「民」とした。
- source_word: הֵן
  choice: 見よ
  rationale: 注意を促し、宣言を強調する指示的な間投詞の力を保った。
- source_word: קָנִיתִי
  choice: 買い取った
  rationale: קנה の購入・取得の意味を、この飢饉下の所有権移転という経済的文脈に即して直接的に表した。より一般的な「取得した」も可能なので注記した。
- source_word: אֶתְכֶם
  choice: あなたがた
  rationale: 民自身がファラオのものとなる取引を、原文どおり直接目的語として明示した。
- source_word: הַיּוֹם
  choice: 今日
  rationale: 現在成立した取引の時点を示す語をそのまま表した。
- source_word: אַדְמַתְכֶם
  choice: あなたがたの土地
  rationale: ここでは所有する農地を指すため、「土地」が自然で明確である。
- source_word: לְפַרְעֹה
  choice: ファラオのために
  rationale: ヨセフがファラオに代わって買い取ったことを示すלְの受益・帰属の含みを保った。
- source_word: הֵא
  choice: ここに…ある
  rationale: 眼前のものを差し出す指示的表現を、自然な現代日本語で表した。
- source_word: זֶרַע
  choice: 種
  rationale: 播種用の種を指し、続く動詞によって用途も明らかになる。
- source_word: וּזְרַעְתֶּם
  choice: 種をまきなさい
  rationale: この完了形は、種を与えた後の指示・命令として機能しているため、自然な命令表現とした。
- source_word: הָאֲדָמָה
  choice: 土地
  rationale: 耕作すべき地面・農地を指し、前半の語との対応も保つ。
theological_decisions:
- issue: 民自身を買い取るという表現
  choice: 「あなたがたとあなたがたの土地を…買い取った」と明記
  alternative: 「あなたがたの土地を買い取り、あなたがたを仕える者とした」などと説明的に言い換える
  rationale: 原文は人々と土地の双方をקנהの直接目的語としており、その法的・社会的緊張を説明で和らげず保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、発話冒頭の「見よ」で原文の強調を保った。「買い取った」は取引の具体性を示し、「あなたがた」を省略せず原文の厳しい社会的含意を残した。
