id: GEN.47.14
reference: Genesis 47:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְלַקֵּ֣ט יוֹסֵ֗ף אֶת כָּל הַ/כֶּ֨סֶף֙ הַ/נִּמְצָ֤א בְ/אֶֽרֶץ מִצְרַ֨יִם֙ וּ/בְ/אֶ֣רֶץ כְּנַ֔עַן בַּ/שֶּׁ֖בֶר אֲשֶׁר הֵ֣ם שֹׁבְרִ֑ים וַ/יָּבֵ֥א יוֹסֵ֛ף אֶת הַ/כֶּ֖סֶף בֵּ֥יתָ/ה פַרְעֹֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/014.yaml
  text: And Joseph gathered up all the silver found in the land of Egypt and in the land of Canaan for the grain that they were buying[b][a], and Joseph brought the silver into Pharaoh’s house.
translation:
  language: ja
  text: ヨセフは、エジプトの地とカナンの地にあった銀を、人々が買っていた穀物の代金として、ことごとく集めた[a]。そして、その銀をファラオの家に運び入れた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銀」は、ここでは支払いに用いられた銀、すなわち金銭を指す。別訳「金銭をことごとく集めた」。
    reason: lexical_alternative
  - marker: b
    text: 「ファラオの家」は、王の住居だけでなく、王家やその財庫を指す場合もある。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְלַקֵּט
  choice: ことごとく集めた
  rationale: לקטの「拾い集める、集める」という意味を自然な日本語で表し、כָּלと合わせて、多くの取引から銀を集積した文脈を示す。
- source_word: כָּל הַכֶּסֶף הַנִּמְצָא
  choice: あった銀を……ことごとく
  rationale: כֶּסֶףの具体的な意味「銀」を本文に保ち、הַנִּמְצָאは所在・存在を表す「あった」とした。כָּלは日本語として自然な位置の「ことごとく」で表現した。
- source_word: בְאֶרֶץ מִצְרַיִם וּבְאֶרֶץ כְּנַעַן
  choice: エジプトの地とカナンの地に
  rationale: 両方に繰り返されるאֶרֶץを「地」として保持し、地理的な表現を明確にした。
- source_word: בַּשֶּׁבֶר אֲשֶׁר הֵם שֹׁבְרִים
  choice: 人々が買っていた穀物の代金として
  rationale: ヨセフ物語におけるשֶׁבֶרは穀物、שברは穀物を買うことを指す。分詞の継続性を「買っていた」で表し、前置詞בの取引上の関係を「代金として」で明確にした。
- source_word: וַיָּבֵא ... בֵּיתָה פַרְעֹה
  choice: その銀をファラオの家に運び入れた
  rationale: 方向を示す語尾־ָהを「運び入れた」で反映し、בֵּית פַרְעֹהは解釈を狭めず「ファラオの家」とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「銀」「エジプトの地」「カナンの地」「ファラオの家」という原文の具体的表現を保った。「代金として」によって取引関係を自然に示しつつ、脚注で「銀」の貨幣的用法と「家」の意味の広がりを説明した。
