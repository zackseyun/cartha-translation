  text: וְ/אֶ֨ת הָ/עָ֔ם הֶעֱבִ֥יר אֹת֖/וֹ לֶ/עָרִ֑ים מִ/קְצֵ֥ה גְבוּל מִצְרַ֖יִם וְ/עַד קָצֵֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/021.yaml
  text: As for the people[a], he moved them to the cities, from one end of the territory of Egypt to the other.
translation:
  language: ja
  text: 民については、ヨセフはエジプトの領土の端から端まで、彼らを町々へ移した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「町々へ移住させた」。異なる本文理解に従い、「民を奴隷にした」と訳すものもあるが、ここで採用したヘブライ語本文は、より直接的には民の移転を述べている。
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: 民
  rationale: エジプトでヨセフの政策の対象となった住民を集合的に指す。現代日本語で簡潔かつ格調を保てる「民」とした。
- source_word: הֶעֱבִיר אֹתוֹ
  choice: 彼らを……移した
  rationale: עברのヒフィル形は「通らせる、移す、移転させる」の意。原文の集合単数を、日本語では住民一人一人を自然に受ける複数表現「彼ら」で示した。文脈上の主語ヨセフを明示した。
- source_word: לֶעָרִים
  choice: 町々へ
  rationale: 前置詞לを目的地として捉え、複数形עריםを「町々」と訳した。「都市」よりも古代の居住地を指す日本語として自然である。
- source_word: מִקְצֵה גְבוּל מִצְרַיִם וְעַד קָצֵהוּ
  choice: エジプトの領土の端から端まで
  rationale: גְבוּלを境界線だけでなく領域の意味に取り、全域を表す両端表現を「端から端まで」で保持した。
theological_decisions:
- issue: ヨセフがエジプトの民に対して行ったこと
  choice: 町々へ移した
  alternative: 彼らを奴隷にした／町から町へ移した
  rationale: マソラ本文は、民を移動・移転させたことを直接述べている。奴隷化という訳は異なる本文理解に基づくため本文には採らず、異読として脚注で知らせた。「町々へ」はלの方向・目的地の意味を素直に表す。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「民については」で前置された目的語の強調を示し、後半は日本語として理解しやすいよう「そうしたのである」と補って全土に及ぶ施策であることを表現した。
