    issue: 脚注bの直訳表現が不自然で不正確
    rationale: חָזַקはここで「強かった／激しかった」、עֲלֵיהֶםは「彼らの上に（彼らに対して）」という圧迫の比喩を示す。「彼らの上に強くなった」では日本語として意味を取りにくい。
  revised_text: こうしてヨセフは、エジプトのすべての土地をファラオのために買い取った[a]。飢饉が彼らをひどく圧迫していたので[b]、エジプト人はそれぞれ自分の畑を売ったからである。こうして、その土地はファラオのものとなった。
