revisions:
- from: こうしてヨセフは、エジプトのすべての土地をファラオのために買い取った[a]。飢饉が彼らに厳しくのしかかっていたので[b]、エジプト人はそれぞれ自分の畑を売ったからである。こうして、その土地はファラオのものとなった。
  to: こうしてヨセフは、エジプトのすべての土地をファラオのために買い取った[a]。飢饉が彼らをひどく圧迫していたので[b]、エジプト人はそれぞれ自分の畑を売ったからである。こうして、その土地はファラオのものとなった。
  rationale: 本文の意味と因果関係は維持し、脚注bのみを、原文の「強い／激しい」と「彼らの上に」という比喩を過度に解釈せず自然に反映する表現へ改めた。本文の「ひどく圧迫していた」は、飢饉が人々に及ぼす圧力を表す自然な日本語である。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T05:44:26Z'
review_pass:
  verdict: revise
  source_fidelity: 本文は購入・売却、飢饉による圧迫、土地のファラオへの帰属という原文の内容を正確に伝えている。「飢饉が彼らに厳しくのしかかっていた」は自然な意訳として可能だが、ヘブライ語の完了形による叙述には「圧迫していた」よりも「厳しかった／圧迫していた」の選択に若干の幅がある。本文では文脈に即して自然な「ひどく圧迫していた」を採る。
  naturalness: 全体は明瞭な現代標準日本語である。ただし脚注bの「飢饉が彼らの上に強くなった」は日本語として不自然で、直訳注としても構文と語義を適切に示していない。
  terminology: 「ヨセフ」「エジプト」「ファラオ」「飢饉」「畑」「土地」はいずれも適切である。「ファラオのために」はלְפַרְעֹהの受益者・帰属先を保っており許容できる。
  issues:
