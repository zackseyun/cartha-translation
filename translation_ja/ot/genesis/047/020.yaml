  text: וַ/יִּ֨קֶן יוֹסֵ֜ף אֶת כָּל אַדְמַ֤ת מִצְרַ֨יִם֙ לְ/פַרְעֹ֔ה כִּֽי מָכְר֤וּ מִצְרַ֨יִם֙ אִ֣ישׁ שָׂדֵ֔/הוּ כִּֽי חָזַ֥ק עֲלֵ/הֶ֖ם הָ/רָעָ֑ב וַ/תְּהִ֥י הָ/אָ֖רֶץ לְ/פַרְעֹֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/020.yaml
  text: So Joseph bought all the land of Egypt for Pharaoh[a], because every Egyptian sold his field, for the famine was severe upon them[b]; and the land became Pharaoh’s.
translation:
  language: ja
  text: こうしてヨセフは、エジプトのすべての土地をファラオのために買い取った[a]。飢饉が彼らをひどく圧迫していたので[b]、エジプト人はそれぞれ自分の畑を売ったからである。こうして、その土地はファラオのものとなった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エジプトのすべての土地をファラオのために取得した」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「飢饉が彼らの上に強かった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקֶן
  choice: 買い取った
  rationale: קנהは広く「取得する」を意味し得るが、ここではエジプト人が畑を「売った」と明記される商取引の文脈なので、「買い取った」が自然で明確である。
- source_word: כָּל אַדְמַת מִצְרַיִם
  choice: エジプトのすべての土地
  rationale: אדמהは土壌・地面・土地を意味するが、所有権移転の文脈では「土地」が適切である。
- source_word: לְפַרְעֹה
  choice: ファラオのために
  rationale: 前置詞לの受益者・取得先としての意味を保ち、ヨセフがファラオのために購入したことを示す。
- source_word: מָכְרוּ מִצְרַיִם אִישׁ שָׂדֵהוּ
  choice: エジプト人はそれぞれ自分の畑を売った
  rationale: 集合的な「エジプト人」と、分配を表すאישׁおよび単数形「自分の畑」の組み合わせを、自然な現代日本語で再現した。
- source_word: חָזַק עֲלֵהֶם הָרָעָב
  choice: 飢饉が彼らに厳しくのしかかっていた
  rationale: חזקの「強い、力を増す」とעלの圧迫の比喩を、「厳しくのしかかる」として自然かつ重みのある日本語にした。
- source_word: וַתְּהִי הָאָרֶץ לְפַרְעֹה
  choice: その土地はファラオのものとなった
  rationale: 所有権移転の結果を簡潔に示し、לの帰属の意味を自然な日本語で表した。
theological_decisions: []
