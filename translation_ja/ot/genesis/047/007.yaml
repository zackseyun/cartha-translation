id: GEN.47.7
reference: Genesis 47:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּבֵ֤א יוֹסֵף֙ אֶת יַֽעֲקֹ֣ב אָבִ֔י/ו וַ/יַּֽעֲמִדֵ֖/הוּ לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְבָ֥רֶךְ יַעֲקֹ֖ב אֶת פַּרְעֹֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/007.yaml
  text: Then Joseph brought in Jacob his father and presented him before Pharaoh[b][a], and Jacob blessed Pharaoh.
translation:
  language: ja
  text: それからヨセフは父ヤコブを連れて来て、ファラオの前に立たせた[a]。ヤコブはファラオを祝福した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ファラオに引き合わせた」。直訳は「ファラオの前に立たせた」。
    reason: lexical_alternative
  - marker: b
    text: 「祝福した」は、単なる丁重な挨拶ではなく、言葉によって正式に祝福を告げたことを含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 連れて来て
  rationale: בואのヒフィル形が持つ使役の意味を踏まえ、ヨセフがヤコブをファラオのもとへ伴い入れたことを、自然な現代日本語で表す。
- source_word: אָבִיו
  choice: 父ヤコブ
  rationale: 三人称男性単数接尾辞はヨセフを指す。「自分の父」と強調する必要はなく、日本語では固有名を添えることで指示対象を明確にした。
- source_word: וַיַּעֲמִדֵהוּ לִפְנֵי
  choice: ファラオの前に立たせた
  rationale: עמדのヒフィル形の使役的意味「立たせる」を保持する。謁見のために引き合わせたという文脈的含意はあるが、本文では原文の具体的な表現を残した。
- source_word: וַיְבָרֶךְ
  choice: 祝福した
  rationale: ברךの通常の意味をそのまま採用し、単なる礼儀上の挨拶へ弱めない。族長ヤコブが王ファラオを祝福するという本文の緊張を保つ。
- source_word: פַרְעֹה
  choice: ファラオ
  rationale: 現代日本語の聖書・歴史用語として広く理解される王号の標準的表記。
- source_word: וַ
  choice: それから
  rationale: 物語を進める接続を自然な現代日本語で示す。後続節では日本語として冗長になる接続語を補わず、文の連続で継起を表した。
theological_decisions:
- issue: ヤコブがファラオに対して行った行為の意味
  choice: ヤコブはファラオを実際に祝福した
  alternative: ヤコブはファラオに丁重な挨拶をした
  rationale: ברךはここでも通常どおり「祝福する」と理解するのが最も直接的である。社会的には弱い立場の族長が大王を祝福するという神学的緊張を、一般的な挨拶へ置き換えて解消しない。
- issue: ファラオの前でのヤコブの姿勢・紹介
  choice: ファラオの前に立たせた
  alternative: ファラオに引き合わせた
  rationale: 謁見・紹介の意味合いは文脈上あり得るが、使役形の具体的表現を本文に残すことで、動作と宮廷的含意の双方を保持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。原文の使役表現と「祝福する」という語義を本文に明示し、宮廷謁見の含意や挨拶との可能な重なりは脚注で補った。
