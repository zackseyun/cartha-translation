  text: וַ/יֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּ/אֶ֥רֶץ מִצְרַ֖יִם בְּ/אֶ֣רֶץ גֹּ֑שֶׁן וַ/יֵּאָחֲז֣וּ בָ֔/הּ וַ/יִּפְר֥וּ וַ/יִּרְבּ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/027.yaml
  text: So Israel settled in the land of Egypt[a], in the land of Goshen, and they gained possessions in it and were fruitful and multiplied greatly.
translation:
  language: ja
  text: イスラエルはエジプトの地、ゴシェンの地に定住した。彼らはそこで土地を得て[a]、実を結び、非常に数を増した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこで所有地を得て」「そこに定着し」。原文の動詞は、土地に保有地を得ること、またはその地にしっかり根づくことを表し得る。
    reason: וַיֵּאָחֲזוּ בָהּ の語義には、所有地の取得と定着の両方の含みがあるため。
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住み着いた
  rationale: ישׁבは「座る、住む、定住する」を意味する。この文脈では一時的な滞在ではなく、ゴシェンに生活の基盤を置いたことを示すため、「住み着いた」とした。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 原文の固有名を保った。ここではヤコブ本人が家族を代表しており、後続の複数形「彼ら」への移行もそのまま示した。
- source_word: בְּאֶרֶץ מִצְרַיִם בְּאֶרֶץ גֹּשֶׁן
  choice: エジプトの地、ゴシェンの地に
  rationale: 二度繰り返される אֶרֶץ（地）を訳出し、ゴシェンがエジプト領内の特定地域であるという地理的な焦点を保った。
- source_word: וַיֵּאָחֲזוּ בָהּ
  choice: 彼らはそこで土地を得て
  rationale: אחז のニファル形は、この箇所では土地に保有地を得ること、またはそこに確立されることを示し得る。「土地を得て」は文脈上の所有・定着の含みを自然に表しつつ、受動的な語形の幅は脚注で示す。
- source_word: וַיִּפְרוּ
  choice: 実を結び
  rationale: 創世記で繰り返される「実を結ぶ」という祝福の語彙との響きを保った。ここでは子孫が増える意味である。
- source_word: וַיִּרְבּוּ מְאֹד
  choice: 非常に数を増した
  rationale: רבה の増加・増殖の意味と מְאֹד の強意を、現代日本語で明瞭に表した。
theological_decisions:
- issue: 「イスラエル」の代表的用法と単数から複数への移行
  choice: 冒頭を「イスラエル」とし、後半を「彼ら」とする
  alternative: 全体を「イスラエルの人々」または「ヤコブとその家族」として統一する
  rationale: 原文は単数の「イスラエル」から複数動詞へ移り、族長がその家族を代表する表現となっている。この緊張を説明的に解消せず保持した。
- issue: וַיֵּאָחֲזוּ בָהּ の所有と定着の含意
  choice: 本文では「土地を得て」とし、意味の幅を脚注に残す
  alternative: 「そこに定着し」「そこで所有地を得て」「そこに根を下ろし」と訳す
  rationale: この動詞は土地の取得・保有と、そこに確立されることの双方を示し得る。本文では文脈に適した所有の意味を簡潔に示し、語の曖昧さを脚注で保存した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「エジプトの地、ゴシェンの地」「実を結び」など原文の反復と創世記特有の語調を保った。「住み着いた」は口語的すぎず、恒久的な居住を自然に伝える。
