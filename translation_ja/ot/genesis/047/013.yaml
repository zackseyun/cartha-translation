source:
  edition: WLC
  text: וְ/לֶ֤חֶם אֵין֙ בְּ/כָל הָ/אָ֔רֶץ כִּֽי כָבֵ֥ד הָ/רָעָ֖ב מְאֹ֑ד וַ/תֵּ֜לַהּ אֶ֤רֶץ מִצְרַ֨יִם֙ וְ/אֶ֣רֶץ כְּנַ֔עַן מִ/פְּנֵ֖י הָ/רָעָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/013.yaml
  text: There was no food in all the land[a], because the famine was very severe[b]; and the land of Egypt and the land of Canaan languished because of the famine.
translation:
  language: ja
  text: 全土に食べ物はなかった[a]。飢饉が非常に激しかったからである。エジプトの地もカナンの地も、飢饉のために疲弊した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「パン」。ここでは食べ物全般を指すと考えられる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「衰え果てた」「力を失った」。ヘブライ語の動詞は、飢饉によってエジプトとカナンが弱り果てた様子を、土地を擬人化して表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: 食べ物
  rationale: 字義的には「パン」だが、飢饉の文脈では食糧全般を指す換喩として用いられているため、自然で意味の広さを保つ「食べ物」とした。
- source_word: אֵין
  choice: なかった
  rationale: 存在の否定を、過去の物語文脈に合わせて自然な日本語で表した。
- source_word: בְּכָל הָאָרֶץ
  choice: 全土に
  rationale: 文脈上、地球全体ではなく、飢饉に見舞われた地域一帯を指す。「全土」は簡潔にその範囲を表す。
- source_word: כָבֵד מְאֹד
  choice: 非常に激しかった
  rationale: 「非常に重い」が字義だが、飢饉についてはその深刻さ・苛烈さを表すため、「非常に激しかった」とした。
- source_word: וַתֵּלַהּ
  choice: 疲弊した
  rationale: 飢饉によって力を失い、衰え果てる様子を表す比喩的な動詞である。土地を擬人化する原文の表現を保ちつつ、現代日本語として明瞭な「疲弊した」を選んだ。
- source_word: אֶרֶץ מִצְרַיִם וְאֶרֶץ כְּנַעַן
  choice: エジプトの地もカナンの地も
  rationale: 両方に反復される אֶרֶץ を「地」として残し、地理的な焦点と並列を保った。
- source_word: מִפְּנֵי הָרָעָב
  choice: 飢饉のために
  rationale: 原因を示す前置詞句を自然な日本語で表した。
