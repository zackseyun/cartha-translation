base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/017.yaml
  text: So they brought their livestock to Joseph[a], and Joseph gave them bread in exchange for the horses, the flocks, the herds, and the donkeys[b]; and he provided for them with bread in exchange for all their livestock during that year.
translation:
  language: ja
  text: 人々は家畜をヨセフのもとに連れて来た。ヨセフは、馬、羊ややぎの群れ、牛の群れ、ろばと引き換えに、彼らに食糧を与えた。こうしてその年、ヨセフは彼らのすべての家畜と引き換えに食糧を与え、彼らを養った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「食糧によって彼らを導いた」。このヘブライ語動詞には「導く、管理する」という意味があるが、ここでは飢饉の間、食糧を与えて人々を支えたことを表すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵיהֶם / מִקְנֵהֶם
  choice: 家畜／すべての家畜
  rationale: 取得・所有された家畜全般を指す語であり、牛だけに限定せず、文頭の総称と文末の包括的表現を保つ。
- source_word: לֶחֶם
  choice: 食糧
  rationale: 字義的には「パン」だが、飢饉と物資交換の文脈では生存に必要な食物を広く指す。「食糧」は現代日本語で自然であり、同じ語を二度用いて原文の反復も保つ。
- source_word: בַּסּוּסִים
  choice: 馬と引き換えに
  rationale: 前置詞 ב はここでは交換に差し出されたものを示すため、日本語では交換関係を明示する。
- source_word: מִקְנֵה הַצֹּאן
  choice: 羊ややぎの群れ
  rationale: צֹאן は羊に限らず、やぎを含む小型家畜の群れを指し得るため、範囲を明確にした。
- source_word: מִקְנֵה הַבָּקָר
  choice: 牛の群れ
  rationale: 大型家畜、とりわけ牛の群れを表す句として、明瞭で自然な日本語を用いた。
- source_word: חֲמֹרִים
  choice: ろば
  rationale: 現代日本語で明瞭な一般名称を採用した。
- source_word: וַיְנַהֲלֵם
  choice: 彼らを養った
  rationale: נהל の基本的な「導く、管理する」という意味を背景に、食糧によって民を支えたという文脈上の働きを自然に表す。字義的な可能性は脚注に残す。
- source_word: בְּכָל מִקְנֵהֶם
  choice: 彼らのすべての家畜と引き換えに
  rationale: 直前に描かれた物々交換を総括する句として交換の意味を明示し、食糧が家畜の飼料であったとの誤読を避ける。
- source_word: בַּשָּׁנָה הַהִוא
  choice: その年
  rationale: この取り決めが行われた期間を簡潔で自然な日本語で示す。
