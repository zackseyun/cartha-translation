base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/026.yaml
  text: 'So Joseph made it a statute that stands to this day concerning the land of Egypt: the fifth is for Pharaoh[d][c][b][a]. Only the land of the priests alone did not become Pharaoh’s.'
translation:
  language: ja
  text: こうしてヨセフは、エジプトの土地について、五分の一をファラオのものとする定めを設けた。この定めは今日に至るまで続いている。ただし、祭司たちの土地だけはファラオのものにはならなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָהּ ... לְחֹק
  choice: 定めを設けた
  rationale: שׂוּם＋לְחֹק は、直訳的な「定めとして置いた」よりも、法的・行政的な規則を制定したことを自然な現代日本語で表す「定めを設けた」が適切。目的語 אֹתָהּ は前節の措置を指すが、日本語では「それを」を立てず、定めの内容を文中に組み込んだ。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: この定めは今日まで続いている
  rationale: 語順上は「定め」に続き、その効力が語り手の時代まで継続していることを示す。日本語では独立文にして係り先を明確にした。
- source_word: עַל אַדְמַת מִצְרַיִם
  choice: エジプトの土地について
  rationale: עַל はここでは法令の適用対象・範囲を示す。「土地の上に」ではなく「土地について」と訳した。
- source_word: לְפַרְעֹה לַחֹמֶשׁ
  choice: 収穫の五分の一をファラオのものとする
  rationale: 前節の収穫規定を受け、חֹמֶשׁ は五分の一の取り分を指す。日本語では文脈上の対象を「収穫」と補い、受益・帰属を自然に表現した。定冠詞は既述の五分の一の規定を受けるものとして処理した。
- source_word: רַק אַדְמַת הַכֹּהֲנִים לְבַדָּם
  choice: ただし、祭司たちの土地だけは
  rationale: רַק と לְבַדָּם の重なる限定を、日本語では「ただし」と「だけ」で表し、例外の強調を保ちながら不自然な重複を避けた。
- source_word: לֹא הָיְתָה לְפַרְעֹה
  choice: ファラオのものにはならなかった
  rationale: היה＋ל は帰属状態を表すが、物語上は土地がファラオへ移された結果との対比なので、「属していなかった」より「ものにはならなかった」が文脈に合う。
theological_decisions: []
