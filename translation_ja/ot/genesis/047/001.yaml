    rationale: וְצֹאנָם וּבְקָרָם は「彼らの群れ（小家畜）と彼らの牛（群）」という並列である。「羊や牛の群れ」は「羊と牛を合わせた一群」とも読めるため、「羊の群れと牛の群れ」として並列を明示する。
