  text: וַ/יָּבֹ֣א יוֹסֵף֮ וַ/יַּגֵּ֣ד לְ/פַרְעֹה֒ וַ/יֹּ֗אמֶר אָבִ֨/י וְ/אַחַ֜/י וְ/צֹאנָ֤/ם וּ/בְקָרָ/ם֙ וְ/כָל אֲשֶׁ֣ר לָ/הֶ֔ם בָּ֖אוּ מֵ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנָּ֖/ם בְּ/אֶ֥רֶץ גֹּֽשֶׁן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/001.yaml
  text: Then Joseph went in and told Pharaoh[a], “My father and my brothers, with their flocks and their herds and all that they have, have come from the land of Canaan; and behold[c][b], they are in the land of Goshen.”
translation:
  language: ja
  text: そこでヨセフはファラオのもとに行って報告した。「私の父と兄弟たちは、羊の群れと牛の群れ、持ち物すべてを携えて、カナンの地から参りました。今、彼らはゴシェンの地におります。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: もとに行って
  rationale: בוא は「来る・行く・入る」を表し得る。宮廷の場面でヨセフがファラオの前に出たことを、自然な日本語で示した。
- source_word: וַיַּגֵּד לְפַרְעֹה וַיֹּאמֶר
  choice: ファラオのもとに行って報告した
  rationale: 「告げた、そして言った」というヘブライ語の連続を、発話内容を損なわず、現代日本語で冗長にならない引用導入とした。
- source_word: אָבִי וְאַחַי
  choice: 私の父と兄弟たち
  rationale: 一人称の所有関係と、文脈上の男性のきょうだいたちを明確に保った。
- source_word: וְצֹאנָם וּבְקָרָם
  choice: 羊や牛の群れ
  rationale: צאן は羊・山羊などの小家畜、בקר は牛などの大型家畜を指す。「羊や牛の群れ」は区別を簡潔に伝える。
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: 持ち物すべて
  rationale: 彼らに属するもの一切という総括的な意味を、自然で簡潔な日本語にした。
- source_word: בָּאוּ מֵאֶרֶץ כְּנָעַן
  choice: カナンの地から参りました
  rationale: 完了した到着とその現在的な結果を文脈上表す。ファラオへの報告なので、引用内では丁寧な「参りました」を用いた。
- source_word: וְהִנָּם
  choice: 今、彼らは
  rationale: הנה の、現在そこにいることへ注意を向ける直示的な力を「今」で自然に表した。
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ゴシェンの地に
  rationale: 原文の אֶרֶץ「地」を保持し、地理的表現の調子を残した。
theological_decisions: []
translation_notes:
  register: 明快で品位ある現代標準日本語。地の文は簡潔にし、ファラオに対するヨセフの直接話法には「参りました」「おります」という自然な敬語を用いた。原文の הנה は古風な「見よ」を避けつつ「今」で注意喚起の機能を保った。
