base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/012.yaml
  text: And Joseph provided his father[a], his brothers, and all his father's household with food[b], according to the number of their little ones.
translation:
  language: ja
  text: ヨセフは、父と兄弟たち、また父の家の者すべてを、幼い子どもたちの人数に応じて食物で養った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「幼い子どもたちの口に応じて」。各家族の子どもの人数、あるいはその必要量に応じて食物を配ったという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַלְכֵּל
  choice: 食物を与えて養った
  rationale: ピエル形の כלכל は、物質的な必要を満たして扶養することを表す。飢饉という文脈と、後続する לֶחֶם をともに自然に表現するため、この訳とした。
- source_word: לֶחֶם
  choice: 食物
  rationale: 字義的には「パン」だが、ここでは飢饉の中で供給された食糧全般を指すと考えられるため、「食物」とした。
- source_word: כָּל בֵּית אָבִיו
  choice: 父の家族全員
  rationale: בַּיִת はここで建物ではなく、父に属する家の者たち、すなわち家族・家族集団を指す。現代日本語で明瞭な「家族全員」とした。
- source_word: לְפִי הַטָּף
  choice: 幼い子どもたちの人数に応じて
  rationale: לְפִי は字義的には「口に応じて」だが、ここでは人数または必要量に応じた配分を示す慣用表現である。הַטָּף は幼い子どもたちを指すため、このように訳した。
- source_word: אָבִיו ... אֶחָיו
  choice: 父と兄弟たち
  rationale: ヨセフの父と男性のきょうだいたちを指す直接的な親族名称として訳した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「養った」だけでは供給物が曖昧になるため「食物を与えて養った」とし、原文の継続的・物質的扶養の意味を自然に伝えた。
