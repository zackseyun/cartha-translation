  text: רַ֛ק אַדְמַ֥ת הַ/כֹּהֲנִ֖ים לֹ֣א קָנָ֑ה כִּי֩ חֹ֨ק לַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת פַּרְעֹ֗ה וְ/אָֽכְל֤וּ אֶת חֻקָּ/ם֙ אֲשֶׁ֨ר נָתַ֤ן לָ/הֶם֙ פַּרְעֹ֔ה עַל כֵּ֕ן לֹ֥א מָכְר֖וּ אֶת אַדְמָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/022.yaml
  text: Only the land of the priests he did not buy[a], because the priests had an allotment from Pharaoh, and they ate their allotment that Pharaoh gave them. Therefore they did not sell their land.
translation:
  language: ja
  text: ただし、祭司たちの土地だけは買い取らなかった。祭司たちにはファラオから定められた支給分[a]があり、ファラオが彼らに与えたその支給分を食べていたからである。そのため、彼らは自分たちの土地を売らなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定められた割り当て」「分け前」「食糧」とも訳せる。ここでのヘブライ語 חֹק／חֻקָּם は、主として法令ではなく、割り当てられた生活上の給付を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: ただし……だけは
  rationale: 直前の一般的な叙述に対する例外を示す限定の力を、自然な現代日本語で表す。
- source_word: אַדְמַת הַכֹּהֲנִים
  choice: 祭司たちの土地
  rationale: 祭司に属する土地・土地所有を明瞭に表す。
- source_word: קָנָה
  choice: 買い取る
  rationale: 飢饉下でヨセフが土地を代価と引き換えに取得する商取引の文脈に合う。
- source_word: חֹק / חֻקָּם
  choice: 定められた支給分／その支給分
  rationale: ここでは抽象的な法令より、ファラオから公的に割り当てられた生活上の給付を指す。語の反復も保つ。
- source_word: מֵאֵת פַּרְעֹה
  choice: ファラオから
  rationale: 支給の出所を簡潔かつ自然に示す。
- source_word: וְאָכְלוּ אֶת חֻקָּם
  choice: その支給分で食べていた
  rationale: ヘブライ語の具体的な「食べる」を残しつつ、日本語として支給分によって食を得ていた意味を明確にする。
- source_word: עַל כֵּן
  choice: そのため
  rationale: 先行する理由から生じた結果を自然に示す。
- source_word: מָכְרוּ
  choice: 売らなかった
  rationale: 土地を手放す商取引を原文どおり端的に表す。
