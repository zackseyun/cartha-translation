id: GEN.47.19
reference: Genesis 47:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: לָ֧/מָּה נָמ֣וּת לְ/עֵינֶ֗י/ךָ גַּם אֲנַ֨חְנוּ֙ גַּ֣ם אַדְמָתֵ֔/נוּ קְנֵֽה אֹתָ֥/נוּ וְ/אֶת אַדְמָתֵ֖/נוּ בַּ/לָּ֑חֶם וְ/נִֽהְיֶ֞ה אֲנַ֤חְנוּ וְ/אַדְמָתֵ֨/נוּ֙ עֲבָדִ֣ים לְ/פַרְעֹ֔ה וְ/תֶן זֶ֗רַע וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת וְ/הָ/אֲדָמָ֖ה לֹ֥א תֵשָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/019.yaml
  text: Why should we die before your eyes[a], both we and our land? Buy us and our land for bread, and we and our land will be servants to Pharaoh. Give seed, so that we may live and not die[e][d][c][b], and the land may not become desolate.
translation:
  language: ja
  text: なぜ、私たちも私たちの土地も、あなたの目の前で死ななければならないのでしょうか[a]。私たちと私たちの土地を、食糧と引き換えに買い取ってください[b]。そうすれば、私たちも土地もファラオのものとなり、私たちは奴隷となります[c]。種をください。そうすれば、私たちは生き延びて死なず、土地も荒れ果てずに済みます[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの見ている前で」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「パンと引き換えに」。ここで「パン」は食糧全般を指します。
    reason: lexical_alternative
  - marker: c
    text: 「奴隷」と訳したヘブライ語は「しもべ」とも訳せますが、ここでは身柄を売ってファラオに属する経済的隷属が前面に出ています。
    reason: lexical_alternative
  - marker: d
    text: 別訳「土地も荒れ果てないように」。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה נָמוּת
  choice: なぜ…死ななければならないのでしょうか
  rationale: 単なる理由の質問ではなく、飢饉の中での切迫した修辞的訴えを自然な現代日本語で表した。
- source_word: לְעֵינֶיךָ
  choice: あなたの目の前で
  rationale: ヨセフの目前で、またその目に見えるところで、というヘブライ語の鮮明な慣用表現を保持した。
- source_word: גַּם אֲנַחְנוּ גַּם אַדְמָתֵנוּ
  choice: 私たちも私たちの土地も
  rationale: גם…גם の対句構造を、日本語の「…も…も」で明瞭に再現した。
- source_word: קְנֵה אֹתָנוּ וְאֶת אַדְמָתֵנוּ
  choice: 私たちと私たちの土地を…買い取ってください
  rationale: קנה の商取引上の意味と、身柄および土地の取得という厳しい文脈を明示した。
- source_word: בַּלָּחֶם
  choice: 食糧と引き換えに
  rationale: לחם は直訳では「パン」だが、ここでは飢饉を生き延びるための食糧を指し、前置詞 ב は交換の対価を示す。
- source_word: עֲבָדִים לְפַרְעֹה
  choice: ファラオの奴隷
  rationale: 経済的困窮によって自由を失い、ファラオに属する隷属身分となる文脈を、「しもべ」より明確に表す。
- source_word: וְתֶן זֶרַע
  choice: 種をください
  rationale: 目的語 זרע を簡潔に訳した。農耕文脈から播種用の種であることは明らかだが、本文では原文の簡潔さを保った。
- source_word: וְהָאֲדָמָה לֹא תֵשָׁם
  choice: 土地も荒れ果てずに済みます
  rationale: שמם の荒廃・無人化の意味を示しつつ、先行する要請の目的・結果として自然な日本語にした。
theological_decisions:
- issue: עֲבָדִים が示す隷属の程度
  choice: 奴隷
  alternative: しもべ／僕
  rationale: 本節では飢饉のため人々が自分自身と土地を売り、ファラオに帰属するという経済的・法的隷属が中心であるため、自由の喪失を曖昧にしない訳語を採用した。制度の細部は本文以上に規定しない。
- issue: 目的節の統語的つながり
  choice: 「そうすれば」を用いて、人々の生存と土地の非荒廃をともに種の供与の結果として示す
  alternative: 土地の非荒廃を独立した叙述として訳す
  rationale: 接続された未完了形の連鎖は、種を求める願いに続く目的・結果を表す。両節の結びつきを保ちながら、原文にない因果関係を加えすぎないようにした。
translation_notes:
  register: 切迫した嘆願の調子を保ちつつ、現代の一般読者に明瞭な丁寧体で訳した。「ファラオ」は日本語聖書で定着した表記を用い、「食糧」「奴隷」「荒れ果てる」によって飢饉下の交換と隷属の厳しさを婉曲化せず示した。
