  yaml_path: translation/ot/genesis/047/028.yaml
  text: Jacob lived in the land of Egypt seventeen years[a], and the days of Jacob, the years of his life, were one hundred forty-seven years.
translation:
  language: ja
  text: ヤコブはエジプトの地で十七年間生きた。ヤコブの日々[a]、すなわち彼の生涯の年数は、百四十七年であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤコブの日々」は、生涯の長さを表すヘブライ語の言い方。
    reason: 原語の慣用表現を説明するため。
lexical_decisions:
- source_word: וַיְחִי
  choice: 生きた
  rationale: חיהのワイイクトル形。後に期間が続くため、ヤコブがその地でなお生きた年月を表す。「暮らした」より原語の「生きる」を保つ。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地で
  rationale: אֶרֶץ（地）を省かず、日本語としても自然な形で明示した。
- source_word: שְׁבַע עֶשְׂרֵה שָׁנָה
  choice: 十七年間
  rationale: 期間を表す日本語として「年間」を用い、明瞭にした。
- source_word: יְמֵי יַעֲקֹב
  choice: ヤコブの日々
  rationale: 生涯を「日々」で数えるヘブライ語表現を本文に残し、続く同格句との関係を保った。
- source_word: שְׁנֵי חַיָּיו
  choice: すなわちその生涯の年月
  rationale: 直前の「ヤコブの日々」を説明する同格表現として訳し、意味を現代日本語で明確にした。
- source_word: שֶׁבַע שָׁנִים וְאַרְבָּעִים וּמְאַת שָׁנָה
  choice: 百四十七年
  rationale: ヘブライ語の数の並びを日本語の通常の語順に整え、総年数を正確に示した。
