base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/008.yaml
  text: And Pharaoh said to Jacob[b][a], “How many are the days of the years of your life?”
translation:
  language: ja
  text: ファラオはヤコブに言った。「あなたの生涯の年数は、どれほどですか」[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「あなたの生涯の年々の日々は、どれほどですか」。年齢を尋ねるヘブライ語の改まった言い方。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ワウ継続法によって物語が進行する。日本語では文脈上、接続語を補わず「言った」とするのが自然である。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として定着している聖書日本語表記を用いた。
- source_word: אֶל־יַעֲקֹב
  choice: ヤコブに
  rationale: 前置詞 אֶל は発言の相手を示すため、自然な日本語の助詞「に」で表した。
- source_word: כַּמָּה
  choice: どれほど
  rationale: 数量を問う語。ここでは後続する「日々・年々」という重層的な表現を受け、単純な年齢質問にしすぎない「どれほど」を選んだ。
- source_word: יְמֵי שְׁנֵי חַיֶּיךָ
  choice: あなたの生涯の年月
  rationale: 直訳的には「あなたの生涯の年々の日数」。年齢を尋ねるヘブライ語の改まった慣用表現である。本文では「生涯」と「年月」を残しつつ、現代日本語として理解できる形に整えた。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に分かる、簡潔で品位ある会話文とした。「何歳ですか」と完全に意訳せず、原文の「日々・年々・生涯」という重層的な言い回しを本文と脚注で保った。
