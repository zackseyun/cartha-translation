base_translation:
  language: en
  yaml_path: translation/ot/genesis/047/003.yaml
  text: And Pharaoh said to his brothers[a], “What is your occupation?” And they said to Pharaoh, “Your servants are shepherds of flocks[b], both we and our fathers.”
translation:
  language: ja
  text: ファラオはヨセフの兄弟たちに言った。「あなたがたの仕事は何か。」彼らはファラオに答えた。「あなたのしもべである私どもも父祖たちも、羊や山羊の群れを飼う者です。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶל אֶחָיו
  choice: ヨセフの兄弟たちに
  rationale: ヘブライ語は直訳すれば「彼の兄弟たちに」だが、三人称接尾辞が指すヨセフを明示することで、現代日本語で指示対象を自然かつ明確にした。
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: あなたがたの仕事は何か
  rationale: מַעֲשֶׂה は行い・仕事・活動を表し、この宮廷での問いは職業を尋ねるもの。「仕事」は「職業」より平明で、原語の幅も保つ。
- source_word: רֹעֵה צֹאן
  choice: 羊飼い
  rationale: צֹאן は羊や山羊を含む小家畜の群れを指し得るが、日本語の「羊飼い」はその世話を職とする者を自然に表す。原語の範囲は脚注で補った。
- source_word: עֲבָדֶיךָ
  choice: しもべども
  rationale: ファラオへのへりくだった自称であり、ここでは奴隷身分より宮廷的な敬意が前面に出る。「しもべども」は複数と謙譲を簡潔に示す。
- source_word: גַּם אֲנַחְנוּ גַּם אֲבוֹתֵינוּ
  choice: 私たちも先祖たちもそうです
  rationale: 反復される גַּם による世代間の連続性を、日本語の「も……も」で自然に保持した。אָבוֹת は文脈上、直近の父だけでなく父祖を含むため「先祖たち」とした。
