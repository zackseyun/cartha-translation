revisions:
- from: ファラオはヨセフの兄弟たちに言った。「あなたがたの仕事は何か。」彼らはファラオに答えた。「しもべどもは羊飼いで、私たちも先祖たちもそうです。」[a]
  to: ファラオはヨセフの兄弟たちに言った。「あなたがたの仕事は何か。」彼らはファラオに答えた。「あなたのしもべである私どもも父祖たちも、羊や山羊の群れを飼う者です。」
  rationale: 宮廷における兄弟たちの丁重な自称を、現代日本語として自然な「あなたのしもべである私ども」に改めた。「羊や山羊の群れを飼う者」により、羊・山羊などの小家畜を指すצֹאןを本文で反映し、反復された「も」により本人たちと父祖たちの職業的継続を保った。
