  text: וַ/תֵּ֤לֶד הַ/בְּכִירָה֙ בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ מוֹאָ֑ב ה֥וּא אֲבִֽי מוֹאָ֖ב עַד הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/037.yaml
  text: The firstborn bore a son and called his name Moab[a]; he is the father of Moab to this day.
translation:
  language: ja
  text: 長女は男の子を産み、その名をモアブと呼んだ。彼は今日に至るまで、モアブの父[a]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「今日に至るまで、モアブ人の祖先である」。ヘブライ語は直訳すると「モアブの父」で、祖先の名によってその子孫の民を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 産み
  rationale: Qal形の ילד はここで「産む」を意味する。現代日本語の物語文として簡潔で自然な表現を選んだ。
- source_word: הַבְּכִירָה
  choice: 長女
  rationale: 女性単数の「年長者／初子」を指し、文脈上ロトの二人の娘のうち姉に当たる。「長女」は関係を明確にしつつ自然である。
- source_word: בֵּן
  choice: 男の子
  rationale: 出生記事における「息子」の意味。日本語では「男の子を産み」が自然で分かりやすい。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: その名を…と呼んだ
  rationale: 直訳的な「彼の名を呼んだ」というヘブライ語の命名定型を、自然さを保ちながら原文に近く表した。
- source_word: מוֹאָב
  choice: モアブ
  rationale: 固有名を日本語で一般的な聖書表記に従って音写した。
- source_word: הוּא
  choice: 彼
  rationale: 直前に名づけられた男子を受ける独立代名詞として、その指示を保った。
- source_word: אֲבִי מוֹאָב
  choice: モアブの父
  rationale: 原文の「モアブの父」を本文に保持した。ここでのモアブは子孫である民族を名祖の名で表しており、その意味は脚注で明示した。
- source_word: עַד הַיּוֹם
  choice: 今日に至るまで
  rationale: 語り手の時代まで続いていることを示す定型句を、格調と明瞭さを備えた現代日本語で表した。
theological_decisions:
- issue: 「モアブの父」が個人の父か民族の祖先か
  choice: 本文では原文どおり「モアブの父」とし、民族的意味を脚注で説明する
  alternative: 「モアブ人の祖先」と本文で明示する
  rationale: 原文は名祖とその子孫の民を同じ名称で表す含みを持つため、本文ではその表現を保存し、読者に必要な説明を脚注に置いた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、命名の定型句と「モアブの父」という原文の表現を保持した。脚注記号 [a] は該当文末に配置した。
