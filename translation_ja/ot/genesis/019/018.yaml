  text: וַ/יֹּ֥אמֶר ל֖וֹט אֲלֵ/הֶ֑ם אַל נָ֖א אֲדֹנָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/018.yaml
  text: But Lot said to them[a], “No, please, my lords.”
translation:
  language: ja
  text: しかし、ロトは彼らに言った。「いいえ、どうか、わが主君たちよ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかし……言った
  rationale: 物語を進める接続形だが、直前の指示に対するロトの異議を示す文脈上の対照を、自然な日本語の「しかし」で表した。
- source_word: לוֹט
  choice: ロト
  rationale: 日本語聖書で定着した固有名の表記を用いた。
- source_word: אֲלֵהֶם
  choice: 彼らに
  rationale: 前置詞 אֶל と三人称男性複数接尾辞をそのまま反映し、二人の訪問者という指示対象を本文で補足しなかった。
- source_word: אַל
  choice: いいえ
  rationale: 通常は制止を表す否定辞だが、ここでは動詞を伴わず、直前の提案を退ける嘆願として機能するため、「いいえ」とした。
- source_word: נָא
  choice: どうか
  rationale: 嘆願を表す小辞の丁重さと切迫感を、現代の自然で品位ある日本語で示した。
- source_word: אֲדֹנָי
  choice: わが主がた
  rationale: 「彼らに」という複数の相手を受ける呼びかけとして複数に理解した。אֲדוֹן の語義を保ちつつ、複数敬称を「主がた」で表した。
theological_decisions:
- issue: אֲדֹנָי を、二人への複数呼称と取るか、神への単数の呼びかけと取るか
  choice: 二人の訪問者への複数呼称「わが主がた」
  alternative: 単数の敬称または神への呼びかけ「わが主よ」
  rationale: 直前の אֲלֵהֶם（彼らに）が複数の相手を明示するため、本文では複数呼称が文脈に最もよく合う。ただし、この語形を単数の敬称ないし神への呼びかけと読む可能性もあるため、脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、嘆願の丁重さと物語上の対照を保った。「わが主がた」は日常語より荘重だが、古語に偏らず原語の敬称と複数性を保持する表現として採用した。
