source:
  edition: WLC
  text: וַֽ/יַּהֲפֹךְ֙ אֶת הֶ/עָרִ֣ים הָ/אֵ֔ל וְ/אֵ֖ת כָּל הַ/כִּכָּ֑ר וְ/אֵת֙ כָּל יֹשְׁבֵ֣י הֶ/עָרִ֔ים וְ/צֶ֖מַח הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/025.yaml
  text: And he overthrew those cities[a], and all the plain, and all the inhabitants of the cities[b], and the vegetation of the ground.
translation:
  language: ja
  text: そして、それらの町々[a]と低地一帯[b]、町々の住民すべて、地に生えるものを覆した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ひっくり返した」。ヘブライ語の動詞は、破局的に覆すことを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「低地」は、この文脈ではヨルダン低地の地域を指す。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּהֲפֹךְ
  choice: 覆した
  rationale: הפךの「ひっくり返す、覆す」という具体的な破局のイメージを保ちつつ、単に「滅ぼした」と一般化することを避けた。
- source_word: הֶעָרִים הָאֵל
  choice: これらの町々
  rationale: 指示語אֵלが直前までに語られた特定の町々を指すため、日本語でも指示性を明示した。
- source_word: כָּל הַכִּכָּר
  choice: 低地一帯
  rationale: כִּכָּרはこの文脈ではヨルダン低地の地域を指す。「低地一帯」は地形と範囲の双方を自然な日本語で表す。
- source_word: כָּל יֹשְׁבֵי הֶעָרִים
  choice: 町々の住民すべて
  rationale: ישבの分詞が表す、町々に住んでいた人々を簡潔かつ正確に表現した。
- source_word: צֶמַח הָאֲדָמָה
  choice: 地に生えるもの
  rationale: צֶמַחの植物・生育物という意味と、אֲדָמָהの土壌・地面という意味を、過度に専門的にならない自然な表現で伝えた。
theological_decisions:
- issue: 単数動詞の省略された主語
  choice: 「その方」とし、この節内では固有名を補わない
  alternative: 「主」または「神」を明示する／主語を省略する
  rationale: ヘブライ語本文のこの節では動詞の主語が明記されず、先行文脈から神が行為者だと分かる。「その方」は文脈との連続性を保ちながら、本文にない固有名を補わない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「覆した」で原語の具体的な比喩を保持し、「低地一帯」で地理的範囲を自然に示した。すべての脚注記号を本文中に配置した。
