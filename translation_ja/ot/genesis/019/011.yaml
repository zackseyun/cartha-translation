  text: וְֽ/אֶת הָ/אֲנָשִׁ֞ים אֲשֶׁר פֶּ֣תַח הַ/בַּ֗יִת הִכּוּ֙ בַּ/סַּנְוֵרִ֔ים מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּלְא֖וּ לִ/מְצֹ֥א הַ/פָּֽתַח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/011.yaml
  text: And they struck the men who were at the entrance of the house with blindness[a], from the least to the greatest, so that they wore themselves out trying to find the doorway.
translation:
  language: ja
  text: そして、家の入り口にいた男たちを、小さい者から大きい者まで、目をくらませた[a]。そのため彼らは、戸口を見つけようとして疲れ果てた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「失明させた」。このまれなヘブライ語は、単なる失明というより、目がくらむこと、あるいは視覚の混乱を指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכּוּ
  choice: 〜の状態にした
  rationale: 直訳的には「打った」だが、ここでは前置詞句とともに、男たちに視覚上の障害を負わせたことを表す。日本語では結果を示す表現が自然。
- source_word: הָאֲנָשִׁים
  choice: 男たち
  rationale: 文脈上、ロトの家の外に集まった男性たちを指す。
- source_word: אֲשֶׁר פֶּתַח הַבַּיִת
  choice: 家の入り口にいた
  rationale: 位置を示す簡潔で自然な現代日本語とし、פֶּתַחを「入り口」と訳した。
- source_word: בַּסַּנְוֵרִים
  choice: 目がくらむ状態にした
  rationale: まれな語で、単なる失明だけでなく、眩惑や視覚の混乱を含み得る。「目がくらむ状態」は視覚を妨げられたことを明確にしつつ、その性質を限定しすぎない。
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: 小さい者から大きい者に至るまで
  rationale: 年齢と断定せず、身分・重要度も含み得るヘブライ語の包括的な対句を保持した。
- source_word: וַיִּלְאוּ
  choice: 疲れ果てた
  rationale: 動詞לָאָהが表す疲労・消耗を、自然で明瞭な日本語で表した。
- source_word: לִמְצֹא
  choice: 見つけようとして
  rationale: 不定詞が示す目的と、実現しない試みを文脈に即して自然に表現した。
- source_word: הַפָּתַח
  choice: 戸口
  rationale: 同じפֶּתַחを前半の「入り口」と意味上一貫させつつ、日本語の不自然な反復を避けた。
theological_decisions:
- issue: סַנְוֵרִיםによる障害の性質
  choice: 超自然的に目がくらみ、見る能力が妨げられた状態
  alternative: 失明、眩惑、視覚の混乱
  rationale: 物語は彼らが戸口を見つけられない視覚的障害を明示するが、まれなヘブライ語が通常の失明だけを意味するとは断定できないため、本文と脚注で幅を残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「小さい者から大きい者」は原文の曖昧さを保ち、「若者から老人まで」や「身分の低い者から高い者まで」と限定しなかった。
