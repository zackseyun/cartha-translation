base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/003.yaml
  text: But he urged them strongly[a], so they turned aside to him and entered his house. He prepared a feast for them, baked unleavened bread[b], and they ate.
translation:
  language: ja
  text: しかし、ロトが強く勧めたので[a]、二人はロトのところに立ち寄り、彼の家に入った。ロトは二人のために宴を設け、種なしパンを焼いた[b]。二人は食べた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「強く迫った」「熱心に頼んだ」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は複数形で、「種なしのパン」または「種なしの平焼きパン」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְצַר בָּם מְאֹד
  choice: しきりに勧めた
  rationale: פצר は相手に強く迫り、受け入れるよう促すことを表し、מְאֹד がその強さを増している。「しきりに勧めた」は強引さを過度に加えず、現代日本語で自然に強い働きかけを伝える。
- source_word: וַיָּסֻרוּ אֵלָיו
  choice: 彼のほうへ立ち寄り
  rationale: סור の「進路をそれる、立ち寄る」という移動のイメージと、אֵלָיו の方向性を保つ表現。
- source_word: וַיָּבֹאוּ אֶל־בֵּיתוֹ
  choice: 家に入った
  rationale: בוא と目的地の組み合わせを、文脈に即して簡潔で自然な日本語にした。
- source_word: מִשְׁתֶּה
  choice: 宴
  rationale: 飲食を伴うまとまったもてなしを指す語。酒宴に限定せず、通常の食事より盛んな用意であることを表す。
- source_word: מַצּוֹת
  choice: 種なしパン
  rationale: 発酵種を入れないパンを指す複数形。日本語では物質・種類を示す集合的な単数表現が自然である。
- source_word: אָפָה
  choice: 焼いた
  rationale: パンを焼くという明示的な調理動作をそのまま保った。
- source_word: וַיֹּאכֵלוּ
  choice: 二人はそれを食べた
  rationale: 動詞の複数主語を直前の客二人として明示し、日本語の文脈を明瞭にした。「それを」は用意された食事全体を自然に受ける。
