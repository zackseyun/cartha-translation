base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/010.yaml
  text: But the men reached out their hands and brought Lot into the house with them[c][b][a], and shut the door.
translation:
  language: ja
  text: しかし、その男たちは手を伸ばし[a]、ロトを自分たちのいる家の中へ連れ入れ、戸を閉めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「手を差し出し」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: その人たち
  rationale: 語義は文字どおり「その男たち」だが、日本語では直前に登場した二人を受ける「その人たち」が自然であり、この節自体にない「御使いたち」という明示は避けた。
- source_word: וַיִּשְׁלְחוּ אֶת יָדָם
  choice: 手を伸ばし
  rationale: 「手を差し出す／伸ばす」という身体動作を表す慣用句を、簡潔で自然な現代日本語にした。ヘブライ語の「彼らの手」は集合的な単数形であり、日本語では単に「手」で十分に伝わる。
- source_word: וַיָּבִיאוּ
  choice: 引き入れ
  rationale: ヒフィル形の基本義は「入らせる、連れて入る」。切迫した文脈と家の中への移動を自然に表すため「引き入れ」としたが、強く引っ張ったことまでを断定する表現にはしていない。
- source_word: אֲלֵיהֶם הַבָּיְתָה
  choice: 自分たちのいる家の中へ
  rationale: 「彼らのところへ」と方向を示す הַבָּיְתָה の双方を、日本語として明瞭な形で保持した。家の所有を意味する「自分たちの家」とはしなかった。
- source_word: הַדֶּלֶת
  choice: 戸
  rationale: 家の出入り口を閉ざす物を指す普通名詞。「戸」は物語文で簡潔かつ自然である。
- source_word: סָגָרוּ
  choice: 閉めた
  rationale: 扉を閉じる動作を表す標準的な現代日本語。
- source_word: וַ
  choice: しかし
  rationale: 前節で群衆がロトに迫った行動との対照を自然に示す。
theological_decisions:
- issue: הָאֲנָשִׁים を御使いと明示するか
  choice: 本文では「その人たち」とする
  alternative: 「御使いたち」または「二人の客」
  rationale: 物語全体では御使いであることが分かるが、この節のヘブライ語は通常の語で「その男たち」と呼ぶ。原文の呼称を尊重し、解釈的な同定を本文に持ち込まない。
translation_notes:
  register: 明瞭で現代的な物語文。動作の速い連続を保つため、一つの主語に「手を伸ばし」「引き入れ」「閉めた」を続けた。
