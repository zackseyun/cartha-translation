lexical_decisions:
- source_word: וַתַּהֲרֶיןָ
  choice: 身ごもった
  rationale: הרה は妊娠した状態になることを表す。現代日本語として自然であり、文脈にも適した「身ごもった」とした。
- source_word: שְׁתֵּי
  choice: 二人とも
  rationale: ロトの二人の娘の双方が妊娠したことを、自然な日本語で明確に示す。
- source_word: בְנוֹת לוֹט
  choice: ロトの娘たち
  rationale: ヘブライ語の連語を、簡潔で自然な所有関係として訳した。
- source_word: מֵאֲבִיהֶן
  choice: 自分たちの父親の子を
  rationale: 前置詞 מִן が示す父系・由来の意味を、現代日本語で誤解なく伝えるため「父親の子を」と表現した。「自分たちの」により、二人に共通する父親であることを明確にした。
