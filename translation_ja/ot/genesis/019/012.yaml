source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ הָ/אֲנָשִׁ֜ים אֶל ל֗וֹט עֹ֚ד מִֽי לְ/ךָ֣ פֹ֔ה חָתָן֙ וּ/בָנֶ֣י/ךָ וּ/בְנֹתֶ֔י/ךָ וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ בָּ/עִ֑יר הוֹצֵ֖א מִן הַ/מָּקֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/012.yaml
  text: Then the men said to Lot[a], “Who else do you have here? A son-in-law, your sons, your daughters[c][b], and everyone who belongs to you in the city—bring them out of the place.”
translation:
  language: ja
  text: その人たちはロトに言った。「ここに、ほかにあなたに関わる者はいるか。婿[a]、息子たち、娘たち、また町にいるあなたに関わる者は皆、この場所から連れ出しなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「婿」は、娘の夫、または結婚を予定している相手を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: その人たち
  rationale: 語義どおり「人たち」とし、文脈上は御使いたちであっても、この節にない明示的な同定を本文へ持ち込まない。直前までに登場している二人を受けるため「その」とした。
- source_word: עֹד מִי לְךָ פֹה
  choice: ここに、ほかにだれがいるのか
  rationale: לְךָ の関係性は後続の家族・身内の列挙で明らかになるため、日本語では自然な問いとして表現した。
- source_word: חָתָן
  choice: 婿
  rationale: この文脈では娘の夫または婚約者を指す「婿」が最も自然である。単数形の形態は保ちつつ、日本語では人数を不必要に確定しない。
- source_word: וּבָנֶיךָ וּבְנֹתֶיךָ
  choice: 息子たち、娘たち
  rationale: 所有関係は問いの文脈と並列から明白であり、自然な日本語の列挙とした。
- source_word: וְכֹל אֲשֶׁר לְךָ בָּעִיר
  choice: この町にいるあなたの身内を皆
  rationale: 直訳は「町にある、あなたに属するすべて」だが、避難させる対象として人々が意図される。所有物のように響く表現を避け、家族・家に連なる人々を表す「身内」とした。
- source_word: הוֹצֵא מִן הַמָּקוֹם
  choice: この場所から連れ出しなさい
  rationale: 男性単数命令としてロトへの命令を示し、前の人々を目的語として補って自然な日本語にした。定冠詞付きの「その場所」は日本語では不自然になりやすいため、現場を指す「この場所」とした。
theological_decisions:
- issue: הָאֲנָשִׁים を本文で御使いと明示するか
  choice: 「その人たち」とする
  alternative: 「御使いたち」とする
  rationale: 物語全体では彼らが御使いであることが分かるが、この節自体は通常の「人たち」という語を用いる。原文の語り方を保ち、解釈上の同定を本文に先取りしない。
- issue: חָתָן が実際の夫か婚約者か
  choice: 両方を包含しうる「婿」とする
  alternative: 「娘婿」または「婚約者」と限定する
  rationale: 語と文脈は婚姻関係または婚姻予定の関係を示すが、その状態をこの節だけで断定せず、曖昧さを注で示す。
translation_notes:
  register: 明瞭で現代的かつ品位ある叙述。「その人たち」により原文の一般名詞を保ち、「身内」で避難対象が人であることを自然に伝えた。
