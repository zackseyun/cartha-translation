base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/026.yaml
  text: But his wife looked back from behind him[b][a], and she became a pillar of salt.
translation:
  language: ja
  text: しかし、彼の妻は彼の後ろから振り返った[a]。すると、塩の柱になった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼の後ろから見た」。この句は、彼女が彼の後ろにいたことを示すとも、後方を見ることに関わるとも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּבֵּט
  choice: 振り返って見た
  rationale: נבט は「見る、目を向ける」を意味する。続く מֵאַחֲרָיו と合わせ、文脈上の後方への視線を自然な日本語で表した。
- source_word: אִשְׁתּוֹ
  choice: 彼の妻
  rationale: 三人称男性単数接尾辞を持つ語で、文脈上ロトの妻を指す。
- source_word: מֵאַחֲרָיו
  choice: 彼の後ろから
  rationale: 直訳に近い「彼の後ろから」を本文に残し、彼女の位置とも視線の方向とも関わり得るヘブライ語の含みを注で示した。
- source_word: וַתְּהִי
  choice: 彼女は…になった
  rationale: 物語の継起における היה を、結果としての変化を示す「なった」と訳した。
- source_word: נְצִיב
  choice: 柱
  rationale: 立てられたもの、直立するものを表し、この文脈では「柱」が簡潔で定着した訳語である。
- source_word: מֶלַח
  choice: 塩の
  rationale: נְצִיב との連語を、自然な日本語の属格表現「塩の柱」とした。
theological_decisions:
- issue: ロトの妻に起きた変化の性質
  choice: 「彼女は塩の柱になった」と、実際の変化を述べる形で訳す。
  alternative: 「塩の柱のようになった」または「塩の柱としてそこに立った」
  rationale: 原文には比喩を示す標識がなく、単純に「なった」と述べている。説明的な解釈を加えず、物語本文の主張をそのまま保った。
- issue: מֵאַחֲרָיו が示す関係
  choice: 本文を「彼の後ろから」とし、原文の空間表現を保持する。
  alternative: 単に「後ろを振り返って見た」とする。
  rationale: この句は彼女が彼の後ろにいたことを示し得る一方、後方を見る動作とも密接に結び付く。本文と注で曖昧さを保ち、一方だけに限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いた。「すると」で物語上の結果を自然に示しつつ、変化そのものは原文どおり断定的に表現した。
