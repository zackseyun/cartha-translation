  text: Lot went out to them at the entrance and shut the door behind him[a].
translation:
  language: ja
  text: ロトは彼らのところへ、戸口まで出て行き、自分の後ろで扉を閉めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の後ろで扉を閉めた」。ヘブライ語では、開口部・入口を表す語（פֶּתַח）と、扉そのものを表す語（דֶּלֶת）が使い分けられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出て行き
  rationale: יצאの物語叙述形で、外への移動を伴う継起的な動作を自然な現代日本語で表す。
- source_word: אֲלֵהֶם
  choice: 彼らのところへ
  rationale: 前置詞אֶלと三人称男性複数接尾辞が、外にいる者たちへ向かう動きを示す。
- source_word: לוֹט
  choice: ロト
  rationale: 日本語聖書で定着した標準的な固有名表記を用いる。
- source_word: הַפֶּתְחָה
  choice: 戸口に立つと
  rationale: פֶּתַחは扉そのものではなく開口部・入口を指し、方向を示す語尾הを伴う。日本語では移動の到達点を自然に示すため「戸口に立つと」とした。
- source_word: וְהַדֶּלֶת
  choice: 扉を
  rationale: דֶּלֶתは戸口・開口部（פֶּתַח）と区別される、閉じる物体としての扉を指す。
- source_word: סָגַר
  choice: 閉めた
  rationale: 扉を閉じる具体的動作を表す自然な日本語の他動詞。
- source_word: אַחֲרָיו
  choice: 後ろの
  rationale: ここでは時間的な「後」ではなく空間的な「彼の後ろ」を表し、ロトが外へ出た後、その背後にある扉を閉めたことを示す。
