id: GEN.19.29
reference: Genesis 19:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/שַׁחֵ֤ת אֱלֹהִים֙ אֶת עָרֵ֣י הַ/כִּכָּ֔ר וַ/יִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת אַבְרָהָ֑ם וַ/יְשַׁלַּ֤ח אֶת לוֹט֙ מִ/תּ֣וֹךְ הַ/הֲפֵכָ֔ה בַּ/הֲפֹךְ֙ אֶת הֶ֣/עָרִ֔ים אֲשֶׁר יָשַׁ֥ב בָּ/הֵ֖ן לֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/029.yaml
  text: So it happened[a], when God destroyed the cities of the plain, that God remembered Abraham and sent Lot out of the midst of the overthrow[d][c][b], when he overthrew the cities in which Lot had lived.
translation:
  language: ja
  text: 'こうして、神が平野の町々を滅ぼされたとき、神はアブラハムを覚えられ[a]、ロトが住んでいた町々を覆された際、その破滅のただ中からロトを送り出された[b]。


    [a] 「神はアブラハムを覚えられ」は、神がアブラハムを忘れていたという意味ではなく、彼を心に留め、そのことを行動に表されたことを示すヘブライ語の表現。


    [b] 「破滅」に当たるヘブライ語は、続く「覆された」と同じ語根に由来する。別訳「その壊滅のただ中から」。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神はアブラハムを覚えられ」は、神がアブラハムを忘れていたという意味ではなく、彼を心に留め、そのことを行動に表されたことを示すヘブライ語の表現。
    reason: cultural_note
  - marker: b
    text: 「破滅」に当たるヘブライ語は、続く「覆された」と同じ語根に由来する。別訳「その壊滅のただ中から」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: こうして
  rationale: 物語を進めつつ時の状況を導入する表現として、古風な「そして、…ということが起こった」を避け、自然な日本語で談話機能を表した。
- source_word: בְּשַׁחֵת אֱלֹהִים
  choice: 神が…滅ぼされたとき
  rationale: 前置詞付き不定詞の時間的用法を明確にし、שׁחת の破壊の意味を自然に表した。
- source_word: עָרֵי הַכִּכָּר
  choice: 低地の町々
  rationale: כִּכָּר はこの文脈でヨルダンの低地一帯を指す。「平野」も可能だが、地理的区域として分かりやすい「低地」を選んだ。
- source_word: וַיִּזְכֹּר אֱלֹהִים אֶת אַבְרָהָם
  choice: 神はアブラハムを覚えておられ
  rationale: 神の顧みが行動に現れる聖書的な「覚える」という表現を本文に保持し、その含意は脚注で説明した。
- source_word: וַיְשַׁלַּח אֶת לוֹט
  choice: ロトを…送り出された
  rationale: שׁלח の基本義「送る」を保ち、「救い出す」などの解釈的な動詞への置換を避けた。文脈上、破滅の領域から外へ出されたことが明らかになる。
- source_word: מִתּוֹךְ הַהֲפֵכָה
  choice: その破滅のただ中から
  rationale: תּוֹךְ の「内部・ただ中」と、הֲפֵכָה の壊滅的な転覆をともに表した。後続の הפך との語根上の響きは脚注で示した。
- source_word: בַּהֲפֹךְ אֶת הֶעָרִים
  choice: 神が覆されたのは…町々であった
  rationale: הפך の字義的な「覆す」を保持した。日本語で長い従属節が重なって不明瞭になるのを避けるため、意味関係を保って独立文とした。
- source_word: אֲשֶׁר יָשַׁב בָּהֵן לוֹט
  choice: ロトが住んでいた町々
  rationale: 関係節を自然な連体修飾にし、過去の居住を「住んでいた」で表した。
theological_decisions:
- issue: 「神がアブラハムを覚えた」の意味
  choice: 本文では「覚えておられ」を保持する
  alternative: 「アブラハムを顧み」「アブラハムのゆえに行動し」
  rationale: 神の「記憶」が忠実な配慮と行動を伴うという含意はあるが、本文で因果関係や契約的意味を明示しすぎず、ヘブライ語の神学的な緊張を保った。
- issue: ロトが送り出されたこととアブラハムとの関係
  choice: 原文どおり二つの動作を連ね、明示的な「アブラハムのゆえに」は加えない
  alternative: 「アブラハムのゆえにロトを救い出された」
  rationale: 文脈上の関連は強いが、原文に因果を直接示す前置詞句はないため、解釈を本文へ取り込まなかった。
translation_notes:
  register: 明瞭な現代標準語を用い、神の動作には敬語形「された／おられ」を用いた。長いヘブライ語の一文を日本語では二文に分けたが、出来事の順序と修飾関係は保持した。「覆された」はやや格調のある語だが、הֲפֵכָה と הפך の語感を可能な範囲で伝えるため採用した。
