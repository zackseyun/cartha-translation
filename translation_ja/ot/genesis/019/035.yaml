  terminology: 「ぶどう酒」「父」「下の娘」「寝た」は、本文の語り口と性的婉曲表現を損なわない、明瞭な現代標準日本語である。「寝た」はここで性的関係を指す文脈上の用法を適切に保っており、不必要に露骨な表現へ変更する必要はない。
