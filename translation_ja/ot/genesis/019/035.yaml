source:
  edition: WLC
  text: וַ/תַּשְׁקֶ֜יןָ גַּ֣ם בַּ/לַּ֧יְלָה הַ/ה֛וּא אֶת אֲבִי/הֶ֖ן יָ֑יִן וַ/תָּ֤קָם הַ/צְּעִירָה֙ וַ/תִּשְׁכַּ֣ב עִמּ֔/וֹ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קֻמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/035.yaml
  text: So they also gave their father wine to drink that night[a], and the younger arose and lay with him, and he did not know when she lay down or when she arose.
translation:
  language: ja
  text: その夜も、二人は父にぶどう酒を飲ませた。下の娘が起き上がって父と寝たが、父は彼女が寝た時も起きた時も気づかなかった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: 二人は……飲ませた
  rationale: שׁקהのヒフィル形の使役的意味を保つ。「酔わせた」とまでは明示せず、本文が直接述べる範囲にとどめた。
- source_word: גַּם בַּלַּיְלָה הַהוּא
  choice: その夜も
  rationale: 前夜の出来事との継続を示すגַּםと、自然な時の表現を簡潔に再現した。
- source_word: אֶת אֲבִיהֶן יָיִן
  choice: 父にぶどう酒を
  rationale: 父が飲ませられた相手、ぶどう酒が飲ませた物であるというヘブライ語の関係を自然な日本語にした。
- source_word: וַתָּקָם הַצְּעִירָה
  choice: 妹が立って
  rationale: הַצְּעִירָהは文脈上、姉妹のうち年下の娘を指すため、現代日本語で明瞭な「妹」とした。וַתָּקָםの物語上の動作も保った。
- source_word: וַתִּשְׁכַּב עִמּוֹ
  choice: 父と寝た
  rationale: 性的関係を表す婉曲表現を、日本語でも自然かつ節度ある「寝た」で再現した。代名詞の指示を明確にするため「彼」ではなく「父」とした。
- source_word: וְלֹא יָדַע
  choice: 気づかなかった
  rationale: ידעはここでは認識・自覚を表す。「知らなかった」よりも、出来事への無自覚を自然に伝える。
- source_word: בְּשִׁכְבָהּ וּבְקֻמָהּ
  choice: 娘が寝た時も起きた時も
  rationale: 前置詞בְּを時間的に理解し、対句の並行性を保った。「娘」を補って、父自身の就寝・起床との誤読を避けた。
theological_decisions:
- issue: 父の無自覚の程度と原因
  choice: 「気づかなかった」とだけ訳す
  alternative: 泥酔して何も覚えていなかった
  rationale: 本文は父が娘の寝た時と起きた時を認識しなかったと述べるが、その原因や記憶の有無までは明示していないため、解釈を加えなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語の簡潔さと厳粛さを保った。「妹」「父」「娘」と関係語を適宜明示し、代名詞による曖昧さを避けた。
