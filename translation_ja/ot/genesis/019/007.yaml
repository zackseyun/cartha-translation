  text: And he said, “Please, my brothers, do not do evil.”
translation:
  language: ja
  text: そして彼は言った。「どうか、兄弟たちよ、悪いことはしないでください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל־נָא
  choice: どうか……しないでください
  rationale: 否定辞אַלに懇願を表すנָאが添えられているため、切迫した丁寧な制止として訳した。
- source_word: אַחַי
  choice: 兄弟たちよ
  rationale: 字義は「私の兄弟たち」。ここでは血縁に限らず、同胞・仲間への呼びかけとして用いられているが、原文の親しみを込めた呼称を保った。
- source_word: תָּרֵעוּ
  choice: 悪いことはしないでください
  rationale: רעעのヒフィル形で「悪を行う、悪く振る舞う」の意。目的語を限定せず、原文の包括的な非難と制止を保った。
theological_decisions:
- issue: 悪の内容の特定
  choice: 悪いことはしないでください
  alternative: そのような悪事を働かないでください
  rationale: 原文は悪の内容をこの動詞自体では明示していないため、文脈から具体的な行為を訳文へ補い入れず、表現の広さを保持した。
translation_notes:
  register: 現代の一般読者に明瞭な丁寧表現を用いながら、「兄弟たちよ」で古代の切迫した呼びかけの格調を残した。
