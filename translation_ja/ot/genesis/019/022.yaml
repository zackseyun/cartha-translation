  text: מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּ/ה כִּ֣י לֹ֤א אוּכַל֙ לַ/עֲשׂ֣וֹת דָּבָ֔ר עַד בֹּאֲ/ךָ֖ שָׁ֑מָּ/ה עַל כֵּ֛ן קָרָ֥א שֵׁם הָ/עִ֖יר צֽוֹעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/022.yaml
  text: Hurry[a], escape there[b], for I cannot do anything until you arrive there.” Therefore the city was called Zoar.
translation:
  language: ja
  text: 「急いで、そこへ逃れなさい。あなたがそこに着くまでは、わたしは何もすることができないからだ。」それゆえ、その町はツォアル[a]と呼ばれた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ツォアル」は、ヘブライ語で「小さい」または「取るに足りない」を意味する語と音が似ている。創世記19章20節参照。
    reason: cross_reference
  - marker: b
    text: 直訳では、「彼はその町をツォアルと名づけた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַהֵר
  choice: 急いで
  rationale: 命令形が表す切迫感を、自然な現代日本語で簡潔に伝える。
- source_word: הִמָּלֵט
  choice: 逃れなさい
  rationale: ニファル命令形で「逃れる、危険を脱する」の意。文脈上の避難命令を明確にする。
- source_word: שָׁמָּה
  choice: あそこへ／あそこに
  rationale: 方向を伴う「そこへ」の意味を、移動動詞に応じて自然な日本語にした。
- source_word: לֹא אוּכַל לַעֲשׂוֹת דָּבָר
  choice: わたしは何もすることができない
  rationale: 原文の能力不能の表現を弱めず、「何一つ行えない」という範囲も保つ。
- source_word: עַד בֹּאֲךָ
  choice: あなたが……着くまでは
  rationale: 二人称男性単数接尾辞を明示し、目的地への到着という文脈を自然に表す。
- source_word: עַל כֵּן
  choice: それゆえ
  rationale: 地名の由来を導く因果的な定型句を、明瞭で品位ある接続表現にした。
- source_word: קָרָא שֵׁם הָעִיר
  choice: その町は……と呼ばれた
  rationale: 原文は字義的には「彼はその町の名を……と呼んだ」だが、主語が明示されないため、本文では自然な受動表現とし、字義的構文は脚注に残す。
- source_word: צֹעַר
  choice: ツォアル
  rationale: ヘブライ語の地名を日本語で音写した。直前の「小さい」との語呂合わせは脚注で示す。
theological_decisions:
- issue: 裁きの執行をめぐる「できない」という発言
  choice: 「わたしは何もすることができない」と能力不能の形で率直に訳す
  alternative: 「何もしてはならない」「このことを行えない」
  rationale: לֹא אוּכַל は明確に「できない」を表す。話者が御使いなのか、神的権威を代弁しているのかなどを訳文で決めず、本文の神学的緊張をそのまま保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、緊迫した命令には「急いで」「逃れなさい」を採用した。話者の一人称は文脈に合う「わたし」とし、地名由来を述べる結びはやや格調を保った「それゆえ」とした。
