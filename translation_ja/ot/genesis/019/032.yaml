  text: לְכָ֨/ה נַשְׁקֶ֧ה אֶת אָבִ֛י/נוּ יַ֖יִן וְ/נִשְׁכְּבָ֣ה עִמּ֑/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/032.yaml
  text: Come[a], let us make our father drink wine, and let us lie with him[b], so that we may preserve offspring through our father.
translation:
  language: ja
  text: さあ、父にぶどう酒を飲ませ、父と寝よう。そうして、父によって子孫を残そう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְכָה
  choice: さあ
  rationale: הלךに由来する、行動を促す慣用的な間投詞。現代日本語では「さあ」が勧誘の力を自然に表す。
- source_word: נַשְׁקֶה
  choice: 飲ませ
  rationale: שקהのヒフィル形で使役を表すため、「飲む」ではなく「飲ませる」とした。
- source_word: אָבִינוּ
  choice: 父
  rationale: 話者二人に共通する「私たちの父」だが、日本語では文脈上「父」が自然であり、所有関係も明瞭である。原文どおり二度とも訳出した。
- source_word: יַיִן
  choice: ぶどう酒
  rationale: ייןの標準的な意味。現代日本語で酒の種類を明確に示す。
- source_word: וְנִשְׁכְּבָה עִמּוֹ
  choice: 父と寝よう
  rationale: שכבとעִםの組み合わせは性的関係を婉曲に表す。「寝る」は原文の婉曲性を保ちつつ、現代日本語で意味が通じる。
- source_word: וּנְחַיֶּה
  choice: 残すことができる
  rationale: חיהのピエル形は「生かしておく、存続させる」の意。目的語זָרַעとの組み合わせを自然な日本語で「子孫を残す」と表した。
- source_word: מֵאָבִינוּ
  choice: 父によって
  rationale: מןはここで子孫の由来を示す。「父から」よりも、父を通して子を得るという文脈が自然に伝わる表現を選んだ。
- source_word: זָרַע
  choice: 子孫
  rationale: 字義は「種」だが、ここでは血統を受け継ぐ者、すなわち子孫を指す。
