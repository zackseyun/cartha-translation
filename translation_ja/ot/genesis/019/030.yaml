base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/030.yaml
  text: Then Lot went up from Zoar and lived in the mountains[a], and his two daughters were with him, because he was afraid to live in Zoar. So he lived in a cave, he and his two daughters.
translation:
  language: ja
  text: ロトはツォアルを出て山地に上り、二人の娘とともに山地に住んだ。彼はツォアルに住むことを恐れていたのである。そこで彼と二人の娘は洞窟[a]に住んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「その洞窟に」。ヘブライ語では「洞窟」に定冠詞が付いているが、ここで初めて言及されるため、日本語本文では自然に「洞窟に」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל מִצּוֹעַר
  choice: ツォアルを出て山地に上り
  rationale: עלהの上方への移動を「上り」で保ち、מןによる出発点を「ツォアルを出て」と自然な日本語で表した。
- source_word: בָּהָר
  choice: 山地に
  rationale: 単数形הַרは地形を集合的に指し得る。文脈上、一つの特定の山より山岳地帯を表すと判断し、簡潔な「山地」とした。
- source_word: וַיֵּשֶׁב
  choice: 住んだ
  rationale: ישבはここでは座る動作ではなく居住を表すため、現代日本語として自然な「住んだ」とした。
- source_word: וּשְׁתֵּי בְנֹתָיו עִמּוֹ
  choice: 二人の娘とともに
  rationale: 動詞のない付加句を、日本語の文中でロトとの同居関係が明確になるように表した。
- source_word: כִּי יָרֵא לָשֶׁבֶת בְּצֹעַר
  choice: 彼がツォアルに住むことを恐れたからである
  rationale: כִּיの理由を明示し、יָרֵאの恐れを弱めずに訳した。
- source_word: בַּמְּעָרָה
  choice: 洞窟に
  rationale: ヘブライ語には定冠詞があるが、日本語では初出の住居を通常「洞窟に」と表す。定性は脚注に残した。
- source_word: הוּא וּשְׁתֵּי בְנֹתָיו
  choice: 彼は二人の娘とともに
  rationale: 末尾で洞窟の居住者を改めて示す原文の反復を保ちつつ、日本語として自然な語順にした。
