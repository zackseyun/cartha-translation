  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הִנֵּה נָ֠א מָצָ֨א עַבְדְּ/ךָ֣ חֵן֮ בְּ/עֵינֶי/ךָ֒ וַ/תַּגְדֵּ֣ל חַסְדְּ/ךָ֗ אֲשֶׁ֤ר עָשִׂ֨יתָ֙ עִמָּדִ֔/י לְ/הַחֲי֖וֹת אֶת נַפְשִׁ֑/י וְ/אָנֹכִ֗י לֹ֤א אוּכַל֙ לְ/הִמָּלֵ֣ט הָ/הָ֔רָ/ה פֶּן תִּדְבָּקַ֥/נִי הָ/רָעָ֖ה וָ/מַֽתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/019.yaml
  text: Look[a], please, your servant has found favor in your eyes, and you have made great your steadfast love that you have shown me by preserving my life. But I cannot escape to the mountain[b], lest the disaster overtake me and I die.
translation:
  language: ja
  text: 「どうか、ご覧ください。あなたのしもべは、あなたの目にかなう者とされました。あなたは、私の命を生かしてくださったことで、私に示してくださった大きな慈しみ[a]をさらに大きくしてくださいました。しかし私は、山へ逃れることができません。災い[b]が私に追いついて、死んでしまう恐れがあります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「慈しみ」は、「親切」または「あわれみ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「悪」。ここでは、ロトに降りかかる災難を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: どうか、ご覧ください
  rationale: הִנֵּהの注意を促す働きと、נָאの切迫した丁寧な願いを、現代日本語として明瞭に表した。
- source_word: מָצָא ... חֵן בְּעֵינֶיךָ
  choice: あなたの目に好意を得ました
  rationale: 好意的に受け入れられることを表すヘブライ語の慣用句であり、「目に」という原文の比喩も保持した。
- source_word: עַבְדְּךָ
  choice: あなたのしもべ
  rationale: ここでは身分としての奴隷より、目上の相手へのへりくだった自称が前面に出ている。
- source_word: וַתַּגְדֵּל חַסְדְּךָ
  choice: 大きな慈しみを示してくださいました
  rationale: גדלの強意と、חסדが表す忠実で恵み深い厚意を、自然な日本語で一体として表現した。
- source_word: לְהַחֲיוֹת אֶת נַפְשִׁי
  choice: 私の命を生かしておくために
  rationale: נפשをこの文脈では「命」と取り、命の存続をもたらすという使役形の意味を明示した。
- source_word: לְהִמָּלֵט הָהָרָה
  choice: あの山へ逃れる
  rationale: 方向を示す語尾と単数形の「山」を反映した。「あの」は、目前の逃亡先として既に示された場所を自然に指す。
- source_word: תִּדְבָּקַנִי
  choice: 私に追いつく
  rationale: 基本義は「付く、まといつく」だが、迫る災厄については「追いつく」が文脈上の意味を明確に伝える。
- source_word: הָרָעָה
  choice: 災い
  rationale: ここでは道徳的な悪ではなく、ロトを襲う破局的な害を指す。
theological_decisions:
- issue: חֶסֶדを、神の権威のもとで行動する使者への嘆願の中でどう訳すか
  choice: 慈しみ
  alternative: 親切／あわれみ／契約に忠実な愛
  rationale: 命を保った恵み深く忠実な厚意を表しつつ、この箇所だけで専門的な契約用語に限定しない訳語とした。
translation_notes:
  register: 明瞭で現代的ながら、嘆願にふさわしい丁寧さと荘重さを保った。「しもべ」は聖書的な敬語表現として一般読者にも理解可能と判断した。
