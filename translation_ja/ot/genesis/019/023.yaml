  yaml_path: translation/ot/genesis/019/023.yaml
  text: The sun had risen over the land[b][a], and Lot had come to Zoar.
translation:
  language: ja
  text: 太陽は地の上に昇り、ロトはツォアルに着いた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「太陽は地の上に昇っており、ロトはツォアルに着いていた。」ヘブライ語の二つの完了形は、文脈に応じてこのように訳すこともできる。また、「地」は「土地」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: 太陽
  rationale: 定冠詞の付いた名詞であり、文脈上、通常どおり「太陽」とする。
- source_word: יָצָא
  choice: 昇った
  rationale: 字義的には「出た」だが、主語が太陽なので、現代日本語では日の出を自然に表す「昇った」が適切。完了形はこの節では過去の出来事として表した。
- source_word: עַל הָאָרֶץ
  choice: 地の上に
  rationale: עַלは「上に」、אֶרֶץは「地／土地」を意味する。局地的な「土地」に限定しきらず、かつ日本語として聖書叙述にふさわしい「地」を採用した。
- source_word: וְלוֹט
  choice: ロトは
  rationale: 接続詞は二つの出来事の時間的関係を「時」で自然に示したため、日本語では独立した「そして」とせず、主題を示す「は」とした。固有名は慣用表記「ロト」。
- source_word: בָּא
  choice: 着いていた
  rationale: בואは「来る／入る／到着する」。日の出の時点までに到着していたという文脈上の関係を自然な日本語で示すため、結果状態を表す「着いていた」とした。ただし、二つの完了形を単純過去として並べる理解も可能。
- source_word: צֹעֲרָה
  choice: ツォアルに
  rationale: 地名に方向を示す語尾־ָהが付き、ツォアルへの移動を表すため「ツォアルに」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。英語の過去完了を機械的に移さず、原文の二つの完了形と文脈上の時間関係を日本語の「時」と「着いていた」で表現した。原文にない強い因果関係は加えていない。
