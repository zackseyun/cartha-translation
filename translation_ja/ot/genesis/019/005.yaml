base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/005.yaml
  text: And they called to Lot and said to him[a], “Where are the men who came to you tonight? Bring them out to us so that we may know them.”
translation:
  language: ja
  text: 彼らはロトに呼びかけて言った。「今夜、おまえのところに来た男たちはどこにいる。彼らをこちらへ連れ出せ。われわれが彼らを知るためだ[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は、より明示的に「彼らと性的な関係を持つため」と訳すこともできる。ヘブライ語では「彼らを知る」とある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־לוֹט
  choice: 彼らはロトに呼びかけて
  rationale: קרא אל は、相手に向かって声をかけることを表す。本文に明示されない激しさを加えず、自然な現代日本語とした。
- source_word: אַיֵּה הָאֲנָשִׁים
  choice: 男たちはどこにいる
  rationale: אַיֵּה は所在を問う語であり、אֲנָשִׁים はここでは男性の訪問者たちを指すため、「男たち」とした。
- source_word: אֲשֶׁר בָּאוּ אֵלֶיךָ הַלָּיְלָה
  choice: 今夜、おまえのところに来た
  rationale: הַלָּיְלָה の時間的意味を自然な「今夜」で表し、באו אליך を「おまえのところに来た」とした。群衆の敵対的な場面に合う二人称として「おまえ」を用いた。
- source_word: הוֹצִיאֵם אֵלֵינוּ
  choice: 彼らをこちらへ連れ出せ
  rationale: יצא のヒフィル形は「外へ出させる」を意味する。「こちらへ」によって אֵלֵינוּ の群衆側への方向を示し、日本語では人を対象とする命令として自然な「連れ出せ」とした。
- source_word: וְנֵדְעָה אֹתָם
  choice: 彼らを知るためだ
  rationale: ידע の基本的な語義「知る」を本文に保ち、接続された意向形が文脈上示す目的を「ためだ」で表した。性的意図は強く示唆されるが、その解釈は脚注で明示した。
theological_decisions:
- issue: וְנֵדְעָה אֹתָם の性的意味を本文で明示するか
  choice: 本文では「彼らを知る」とし、性的な意味は脚注に示す。
  alternative: 「彼らと性的な関係を持つ」または「彼らを性的に辱める」と本文で明示する。
  rationale: 文脈は敵対的な性的意図を強く示す一方、ヘブライ語本文は通常「知る」を意味する ידע を用いている。語彙上の表現と文学的な緊張を保持しつつ、現代の読者が意図を把握できるよう脚注で補う。
translation_notes:
  register: 明快で格調を保った現代標準日本語。群衆の直接的で威圧的な発話を短い命令文で表した。原文の語彙的な曖昧さは本文に残し、文脈上の性的意味を脚注で説明した。
