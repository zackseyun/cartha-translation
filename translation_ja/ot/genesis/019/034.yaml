  text: וַֽ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/תֹּ֤אמֶר הַ/בְּכִירָה֙ אֶל הַ/צְּעִירָ֔ה הֵן שָׁכַ֥בְתִּי אֶ֖מֶשׁ אֶת אָבִ֑/י נַשְׁקֶ֨/נּוּ יַ֜יִן גַּם הַ/לַּ֗יְלָה וּ/בֹ֨אִי֙ שִׁכְבִ֣י עִמּ֔/וֹ וּ/נְחַיֶּ֥ה מֵ/אָבִ֖י/נוּ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/034.yaml
  text: And it happened on the next day that the firstborn said to the younger[a], “Look, I lay with my father last night. Let us make him drink wine tonight also. Then come, lie with him, so that we may preserve offspring from our father.”
translation:
  language: ja
  text: その翌日、姉が妹に言った。「聞いて。私は昨夜、父と寝た。今夜も父にぶどう酒を飲ませましょう。それから、あなたが父と寝なさい。そうして、父によって子孫[a]を残しましょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「父からの種」。ここで「種」は子孫を意味する。
    reason: 原文の生殖・子孫を表す慣用語と前置詞の字義を示すため。
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: その翌日
  rationale: ヘブライ語の物語を進める定型表現を、現代日本語で自然かつ簡潔に表した。
- source_word: הַבְּכִירָה / הַצְּעִירָה
  choice: 姉／妹
  rationale: 文脈上はいずれもロトの娘であり、年長・年少の対比を日本語の自然な親族語で明確にした。
- source_word: הֵן
  choice: 聞いて
  rationale: 相手の注意を促す間投詞の働きを、会話として自然な現代日本語で表した。
- source_word: שָׁכַבְתִּי אֶת־אָבִי / שִׁכְבִי עִמּוֹ
  choice: 父と寝た／父と寝なさい
  rationale: ここでは性的関係を指す婉曲表現であるため、原文と同様に露骨さを避けつつ意味が伝わる表現とした。
- source_word: נַשְׁקֶנּוּ יַיִן
  choice: 父にぶどう酒を飲ませましょう
  rationale: 使役形の意味を明確に表し、目的語を日本語で自然に補った。
- source_word: גַּם הַלַּיְלָה
  choice: 今夜も
  rationale: 時間表現と、前夜の行為を繰り返すことを示す添加の意味をともに保持した。
- source_word: וּנְחַיֶּה מֵאָבִינוּ זָרַע
  choice: そうして、父による子孫を残しましょう
  rationale: חיה の使役的な『生かしておく、存続させる』という意味を『残す』で表し、מן が示す父を源とする関係を『父による』で保った。
