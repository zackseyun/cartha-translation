revisions:
- from: 夜が明けかかるころ、天使たちはロトをせき立てて言った。「さあ、妻と、ここにいる二人の娘を連れて行きなさい。そうしないと、この町への罰[a]に巻き込まれ、あなたも滅びてしまう。」
  to: 夜が明けるころ、天使たちはロトをせき立てて言った。「起きて、妻とここにいる二人の娘を連れて行きなさい。そうしないと、この町に下る罰[a]に巻き込まれ、あなたも滅びてしまう。」
  rationale: 「この町への罰」を「この町に下る罰」に改め、処罰が町に及び、ロトがそれに巻き込まれるという文脈を明確にしました。また「起きて」を加え、原文の二つの命令（起きる／取る）を保持しました。脚注は本文の「罰」に対する語義上の代替を引き続き示しています。
