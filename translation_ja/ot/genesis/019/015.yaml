    issue: 「この町への罰」の係り方
    rationale: 「～への罰」は通常「町に対する罰」を表し、町が罰の対象であることは示せても、ロトがその処罰に巻き込まれるという原文の警告を十分に表しません。「この町に下る罰」は、町に及ぶ処罰とその中で滅びる危険を自然に表します。
  - severity: low
    issue: קוּם の命令が明示されていない
    rationale: 「さあ」は緊急性を表しますが、「起きて／立って」と「取れ」の二つの命令という原文の構造を完全には反映しません。
