base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/015.yaml
  text: And as dawn was rising[a], the angels urged Lot, saying, “Get up, take your wife and your two daughters who are here, lest you be swept away in the punishment of the city.”
translation:
  language: ja
  text: 夜が明けるころ、天使たちはロトをせき立てて言った。「起きて、妻とここにいる二人の娘を連れて行きなさい。そうしないと、この町に下る罰[a]に巻き込まれ、あなたも滅びてしまう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この町の不義のうちに」、または「この町の罪責のために」。ヘブライ語の語は、不義、罪責、また罪責の結果として受ける罰を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְמוֹ הַשַּׁחַר עָלָה
  choice: 夜が明けかかるころ
  rationale: 比較・時を表す表現と「夜明けが上る」という原文の描写を、自然な現代日本語の時間表現で示した。夜明けが進みつつある場面も保っている。
- source_word: וַיָּאִיצוּ
  choice: せき立てて
  rationale: 危険が迫る中、急いで行動するよう強く促す意味を自然に表す。
- source_word: הַמַּלְאָכִים
  choice: 天使たち
  rationale: 語そのものは「使者」を意味し得るが、この文脈では天的な使者を指すため、一般読者に明瞭な「天使」とした。
- source_word: קוּם קַח
  choice: さあ、…連れて行きなさい
  rationale: 二つの命令が表す即時の行動要求を、日本語として自然な呼びかけと命令で表した。「取る」は人を目的語とするため「連れて行く」とした。
- source_word: שְׁתֵּי בְנֹתֶיךָ הַנִּמְצָאֹת
  choice: ここにいる二人の娘
  rationale: 分詞 הַנִּמְצָאֹת の「その場にいる／見いだされる」という意味を明確にし、人数も保持した。
- source_word: פֶּן תִּסָּפֶה
  choice: そうしないと、…巻き込まれ、あなたも滅びてしまう
  rationale: 警告を表す פֶּן と、他者と共に除かれ滅びる含意のある受動形を、切迫した自然な日本語で表した。
- source_word: בַּעֲוֺן הָעִיר
  choice: この町への罰
  rationale: עָוֹן は「不義」「罪責」と、その結果として負う「罰」のいずれも表し得る。ここでは目前の滅びへの警告なので本文では「罰」とし、語義の幅は脚注に残した。
theological_decisions:
- issue: 裁きの文脈における עָוֹן の訳し方
  choice: この町への罰
  alternative: この町の不義のうちに／この町の罪責のために
  rationale: 原語は罪そのもの、罪責、また罪責の結果としての罰を指し得る。この箇所ではロトが町に下る滅びに巻き込まれる危険が中心なので「罰」を本文に置いたが、原語にある神学的・語義的な幅を脚注で明示した。
translation_notes:
  register: 明瞭で切迫感のある現代標準日本語とした。「天使」は一般読者にも分かりやすく、「せき立てる」は行動を急がせる原文の強さを保つ。脚注記号[a]は、その内容が説明する「罰」の直後に置いた。
