source:
  edition: WLC
  text: וַ/יֹּאמְר֣וּ גֶּשׁ הָ֗לְאָה וַ/יֹּֽאמְרוּ֙ הָ/אֶחָ֤ד בָּֽא לָ/גוּר֙ וַ/יִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְ/ךָ֖ מֵ/הֶ֑ם וַ/יִּפְצְר֨וּ בָ/אִ֤ישׁ בְּ/לוֹט֙ מְאֹ֔ד וַֽ/יִּגְּשׁ֖וּ לִ/שְׁבֹּ֥ר הַ/דָּֽלֶת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/009.yaml
  text: And they said[a], “Get back!” Then they said, “This one came to live as a foreigner, and now he keeps acting as judge! Now we will treat you worse than them.” And they pressed very hard against the man, against Lot[d][c][b], and came near to break down the door.
translation:
  language: ja
  text: 彼らは言った。「どけ！[a]」さらに言った。「こいつは、よそ者として住みに来た者のくせに、今ではしきりに裁判官ぶっている！[b] 今度は、あの者たちよりもおまえをひどい目に遭わせてやる。[c]」そして彼らは、その人ロトに激しく押し迫り、戸を打ち壊そうと近づいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「下がれ！」または「向こうへ行け！」。
    reason: גֶּשׁ הָלְאָהは、相手にその場から退くよう命じる慣用的な表現と理解できる。
  - marker: b
    text: 直訳に近くは「しかも、裁くことまで裁こうとする」。同じ語根を重ねて、ロトが自分たちを裁こうとすることへの強い反発を表している。
    reason: 定動詞と不定詞絶対形による強調は、日本語では一対一に再現しにくいため。
  - marker: c
    text: 直訳「今や、あの者たち以上におまえに悪を行おう」。
    reason: 原文の比較を伴う脅迫表現の字義を示すため。
lexical_decisions:
- source_word: גֶּשׁ הָלְאָה
  choice: どけ！
  rationale: 直訳的には「あちらへ寄れ／進め」だが、文脈では相手を退かせる敵意ある命令。「どけ」は短く強い命令として自然である。
- source_word: הָאֶחָד
  choice: こいつ
  rationale: 直訳は「この一人／この者」。ここではロトを見下す語調なので、現代日本語で侮蔑を明瞭に伝える「こいつ」とした。
- source_word: בָּא לָגוּר
  choice: よそ者として住みに来た者
  rationale: גורは土地の生まれではない寄留者として住むことを表す。「寄留する」より一般読者に明瞭で、社会的なよそ者の立場も保つ。
- source_word: וַיִּשְׁפֹּט שָׁפוֹט
  choice: しきりに裁判官ぶっている
  rationale: 定動詞と不定詞絶対形の組み合わせによる強調と、彼らがロトの裁きを僭越と非難する語調を表す。「裁判官ぶる」はその敵意ある評価を示すが、実際に正式な裁判官になったとは断定しない。
- source_word: נָרַע לְךָ מֵהֶם
  choice: あの者たちよりもおまえをひどい目に遭わせてやる
  rationale: 字義は「あの者たち以上におまえに悪を行う」。比較を保ちながら、日本語で脅迫として自然にした。危害の具体的内容は原文同様に限定しない。
- source_word: וַיִּפְצְרוּ בָאִישׁ בְּלוֹט מְאֹד
  choice: その人ロトに激しく押し迫り
  rationale: פצרは強く迫ることを表し、この場面では物理的圧迫が前景化している。反復する前置詞を不自然に逐語化せず、「その人ロト」で同格的な焦点を保つ。מְאֹדは「激しく」に反映した。
- source_word: וַיִּגְּשׁוּ לִשְׁבֹּר הַדָּלֶת
  choice: 戸を打ち壊そうと迫った
  rationale: נגשׁと不定詞は、戸を壊す意図をもって近づく動きを示す。「打ち壊す」でשׁברの強い破壊行為を自然に表した。
theological_decisions: []
translation_notes:
  register: 会話部分は暴徒の敵意と侮蔑が伝わる率直な現代語とし、地の文は簡潔で品位ある叙述にした。「こいつ」「裁判官ぶっている」は話者側の蔑視を示す表現であり、語り手の評価ではない。
