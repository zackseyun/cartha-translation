  text: וַ/תַּשְׁקֶ֧יןָ אֶת אֲבִי/הֶ֛ן יַ֖יִן בַּ/לַּ֣יְלָה ה֑וּא וַ/תָּבֹ֤א הַ/בְּכִירָה֙ וַ/תִּשְׁכַּ֣ב אֶת אָבִ֔י/הָ וְ/לֹֽא יָדַ֥ע בְּ/שִׁכְבָ֖/הּ וּ/בְ/קׄוּמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/033.yaml
  text: So they gave their father wine to drink that night[a], and the firstborn went in and lay with her father. He did not know when she lay down or when she arose.
translation:
  language: ja
  text: そこで二人はその夜、父にぶどう酒を飲ませた。長女は父のもとに行き、父と寝た。父は、彼女が横になった時も、起きた時も、気づかなかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼女が横になる際も、起きる際も、彼は知らなかった」。マソラ本文では「起きること」に当たる語の一文字の上に点が付されており、古くから本文上の注意を促す箇所とされている。
    reason: 原文の「横になる／起きる」という並行表現を示し、マソラ本文の上点について簡潔に注記するため。
lexical_decisions:
- source_word: וַתַּשְׁקֶיןָ
  choice: 二人は…父に…飲ませた
  rationale: ヒフィル形の使役的意味を自然な日本語で表し、動詞の女性複数形を「二人」によって明示した。
- source_word: יַיִן
  choice: ぶどう酒
  rationale: 聖書本文として明瞭で一般的な訳語。「酒」より原語の指す飲み物を具体的に示す。
- source_word: בַּלַּיְלָה הוּא
  choice: その夜
  rationale: 指示性を保ちながら、現代日本語の自然な時の表現とした。
- source_word: הַבְּכִירָה
  choice: 長女
  rationale: 女性の初子を指す文脈上、日本語では「長女」が自然かつ明瞭で、姉妹間の出生順も伝わる。
- source_word: וַתָּבֹא
  choice: 入って行き
  rationale: 父のいる所へ入るという文脈を簡潔に表す。「来た」より日本語の語りの視点に合う。
- source_word: וַתִּשְׁכַּב אֶת אָבִיהָ
  choice: 父と寝た
  rationale: 性的含意を持つ原語の婉曲表現を、日本語でも過度に露骨にせず保持した。
- source_word: וְלֹא יָדַע
  choice: 気づかなかった
  rationale: ここでの ידע は認識・自覚を表すため、字義的な「知らなかった」より文脈に即して自然である。
- source_word: בְּשִׁכְבָהּ וּבְקוּמָהּ
  choice: 娘が寝た時も起きた時も
  rationale: 二つの前置詞付き不定詞を時間節として自然に訳し、原文の並行性を保った。「娘」は日本語で主語を明確にするため補った。
