  text: וַ/יְהִי֩ כְ/הוֹצִיאָ֨/ם אֹתָ֜/ם הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הִמָּלֵ֣ט עַל נַפְשֶׁ֔/ךָ אַל תַּבִּ֣יט אַחֲרֶ֔י/ךָ וְ/אַֽל תַּעֲמֹ֖ד בְּ/כָל הַ/כִּכָּ֑ר הָ/הָ֥רָ/ה הִמָּלֵ֖ט פֶּן תִּסָּפֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/017.yaml
  text: And as they brought them outside[a], he said, “Escape for your life. Do not look behind you, and do not stop anywhere in the plain. Escape to the hills[c][b], lest you be swept away.”
translation:
  language: ja
  text: 彼らが彼らを外へ連れ出したとき、彼らのうち一人が言った。「命を救うために逃げなさい。後ろを見てはならない[a]。この平野のどこにも立ち止まってはならない。山地へ逃げなさい[b]。さもないと、滅びてしまう[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「振り返ってはならない」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「山へ」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「一掃されてしまう」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחוּצָה
  choice: 外へ
  rationale: 方向を表す語形であり、町または内部から外部への移動を、自然で簡潔な日本語で示す。
- source_word: הִמָּלֵט
  choice: 逃げなさい
  rationale: 切迫した脱出・救出を命じるニファル命令形。同じ命令が二度繰り返される原文の強調を保った。
- source_word: עַל נַפְשֶׁךָ
  choice: 命を救うために
  rationale: 自分の命を保つために逃れることを表す慣用句。「命がけで」では、命を危険にさらすという別の含意が生じるため避けた。
- source_word: אַל תַּבִּיט אַחֲרֶיךָ
  choice: 後ろを見てはならない
  rationale: 見る対象が自分の後方であるという原文の空間的表現を保つ。「振り返る」という自然な慣用表現も脚注に示した。
- source_word: וְאַל תַּעֲמֹד
  choice: 立ち止まってはならない
  rationale: ここでの עמד は直立姿勢よりも、逃走中に停止することを意味する。警告の切迫感に合う。
- source_word: בְּכָל הַכִּכָּר
  choice: この低地のどこにも
  rationale: כִּכָּר は文脈上、周辺の低地・平野一帯を指す。「どこにも」により בְּכָל の包括的な禁止を自然に表した。定冠詞は文脈上既知の地域を指す「この」で表した。
- source_word: הָהָרָה
  choice: 山地へ
  rationale: 方向を示す語形で、低地と対照される高地への避難を表す。単独の山とも山地とも取り得るため、別訳を脚注に残した。
- source_word: פֶּן תִּסָּפֶה
  choice: さもないと、滅びてしまう
  rationale: 迫る災いによって失われる・滅ぼされる可能性を示す。日本語本文では自然で意味範囲の広い「滅びる」を用い、一掃されるという受動的なニュアンスを脚注に示した。
theological_decisions:
- issue: 発言者の特定
  choice: 「彼らのうち一人が言った」とし、単数の発言者を示すにとどめた。
  alternative: 「御使いが言った」、または複数の者がそろって語ったかのように「彼らは言った」とする。
  rationale: ヘブライ語の動詞は単数なので、その文法情報を保った。一方、本文がここで発言者を明示的に「御使い」と呼んでいるわけではないため、その名称は補わなかった。
translation_notes:
  register: 明瞭で現代的ながら、命令と警告の厳粛さを保つ文体とした。「〜てはならない」を用いて禁止の強さを表し、発言者については原文の単数形以上に特定しない。すべての脚注記号を対応する語句の直後に置いた。
