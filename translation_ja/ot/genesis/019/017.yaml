revisions:
- from: 彼らが一同を外へ連れ出すと、彼らのうち一人が言った。「命を救うために逃げなさい。後ろを見てはならない[a]。この低地のどこにも立ち止まってはならない。山地へ逃げなさい[b]。さもないと、滅びてしまう[c]。」
  to: 彼らが彼らを外へ連れ出したとき、彼らのうち一人が言った。「命を救うために逃げなさい。後ろを見てはならない[a]。この平野のどこにも立ち止まってはならない。山地へ逃げなさい[b]。さもないと、滅びてしまう[c]。」
  rationale: 目的語を原文どおり自然な日本語の「彼ら」とし、כִּכָּר は地勢を過度に限定しない「平野」とした。他の表現と脚注は、原文の意味範囲、命令の反復、単数の発言動詞に対応しており維持した。
