    rationale: 原文は目的語を単に「彼ら」とする。「一同」は日本語としてやや硬く、集団全員という表現を改めて付加するため、代名詞のままにするほうが自然で忠実である。
  - severity: medium
    issue: 「この低地」
    rationale: כִּכָּר は当地域の平野・平地一帯を指す。地勢を「低地」と限定するより、「この平野」とするほうが原語の地理的語義を過度に狭めない。
