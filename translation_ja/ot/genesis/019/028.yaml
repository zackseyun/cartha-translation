  terminology: 固有名詞「ソドム」「ゴモラ」は標準的である。「炉」は כִּבְשָׁן の本文訳として適切であり、「焼き窯」の代替訳を注記することも妥当である。「低地」は כִּכָּר の文脈上可能な簡潔な訳である。
