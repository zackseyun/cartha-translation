base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/028.yaml
  text: And he looked out over Sodom and Gomorrah and over all the land of the plain[a], and he saw, and behold, smoke was rising from the land like the smoke of a furnace.
translation:
  language: ja
  text: 彼はソドムとゴモラ、また低地の全域を見渡した。見ると、その地から炉[a]の煙のような煙が立ち上っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「焼き窯」とも訳せる。
    reason: כִּבְשָׁן は火を用いる炉と、陶器などを焼く窯の双方を指し得るため。
lexical_decisions:
- source_word: וַיַּשְׁקֵף
  choice: 見渡した
  rationale: 高い場所から眼下または前方の地域を眺める語感を、文脈に即して自然な日本語で表した。
- source_word: עַל פְּנֵי סְדֹם וַעֲמֹרָה
  choice: ソドムとゴモラの方
  rationale: 「その面の上を」という空間的表現を逐語的にせず、視線を向けた地域を明瞭に示した。
- source_word: כָּל פְּנֵי אֶרֶץ הַכִּכָּר
  choice: 低地の全域
  rationale: כִּכָּר はここではヨルダン低地の一帯を指す。「全域」によって כָּל פְּנֵי の面的な広がりを簡潔に表した。
- source_word: וַיַּרְא וְהִנֵּה
  choice: 見ると、なんと
  rationale: 見るという叙述を保ちつつ、הִנֵּה が示す突然の発見と生き生きした驚きを現代日本語で表した。
- source_word: עָלָה קִיטֹר הָאָרֶץ
  choice: その地から煙が……立ち上っていた
  rationale: 目の前で煙が上昇している光景を自然に描写し、הָאָרֶץ は局地的文脈に従って「その地」とした。
- source_word: כְּקִיטֹר הַכִּבְשָׁן
  choice: 炉の煙のように
  rationale: כִּבְשָׁן は炉または焼き窯を指し得る。本文では比較表現として分かりやすい「炉」を採り、別訳を注に残した。
