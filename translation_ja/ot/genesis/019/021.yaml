  text: וַ/יֹּ֣אמֶר אֵלָ֔י/ו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔י/ךָ גַּ֖ם לַ/דָּבָ֣ר הַ/זֶּ֑ה לְ/בִלְתִּ֛י הָפְכִּ֥/י אֶת הָ/עִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/021.yaml
  text: 'And he said to him[a], “Look, I grant you this request also: I will not overthrow the city of which you have spoken.”'
translation:
  language: ja
  text: すると彼はロトに言った。「よい。この願いも聞き入れよう[a]。あなたが言ったその町は滅ぼさない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「あなたの顔を上げた」。相手に好意を示し、その願いを聞き入れることを表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: すると彼はロトに言った
  rationale: 主語は直前の使者を指し、目的語はロトを指す。日本語で代名詞が重なる不自然さを避けるため、文脈上明らかな目的語を固有名で示した。
- source_word: הִנֵּה
  choice: よい
  rationale: 注意を促しつつ、直前の願いを受け入れる応答を導く語用論的な働きを、現代日本語の自然な応答表現で示した。
- source_word: נָשָׂאתִי פָנֶיךָ
  choice: この願いも聞き入れよう
  rationale: 字義は「あなたの顔を上げた」だが、ここでは相手に好意を示して申し出を受け入れる慣用句。発話によって承諾する遂行的な完了形として自然に訳した。
- source_word: גַּם לַדָּבָר הַזֶּה
  choice: この願いも
  rationale: דָּבָרは直前にロトが申し出た事柄を指し、גַּםの付加的意味を「も」で保持した。
- source_word: לְבִלְתִּי הָפְכִּי
  choice: 滅ぼさない
  rationale: 町を覆し壊滅させることを差し控える意味。字義的な「ひっくり返す」より、災厄による破壊を明確かつ自然に表す「滅ぼす」を用いた。
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: あなたが言った
  rationale: ロトが話題にした町を指す関係節を、簡潔で自然な日本語にした。
