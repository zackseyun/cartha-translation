  text: טֶרֶם֮ יִשְׁכָּבוּ֒ וְ/אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל הַ/בַּ֔יִת מִ/נַּ֖עַר וְ/עַד זָקֵ֑ן כָּל הָ/עָ֖ם מִ/קָּצֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/004.yaml
  text: Before they lay down[a], the men of the city, the men of Sodom, surrounded the house—from young to old[c][b], all the people from every quarter.
translation:
  language: ja
  text: 彼らが寝床に就く前に、町の男たち、すなわちソドムの男たちが、若者から老人まで、町の隅々から集まり、みなその家を取り囲んだ。[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「取り囲んだ」は、「家の周りに集まった」とも訳せる。ヘブライ語の動詞は、周囲を囲むことにも、周りに集まることにも用いられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「若者から老人まで」。年齢層全体を表す言い方。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「端から」。ここでは「町のあらゆる方面から」または「町の至る所から」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם יִשְׁכָּבוּ
  choice: 彼らが横になる前に
  rationale: 夜のために横になることを指すが、「寝床に就く」と限定しすぎず、動詞 שׁכב の具体的な意味を保った。
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי סְדֹם
  choice: 町の男たち、すなわちソドムの男たち
  rationale: 「町の男たち」を同格の「ソドムの男たち」が特定している構造を明示し、אֲנָשִׁים の男性への言及も保持した。
- source_word: נָסַבּוּ עַל הַבַּיִת
  choice: その家を取り囲んだ
  rationale: נסב と עַל の組み合わせが表す、家の周囲を囲む群衆の動きを自然な日本語で示した。文脈上は敵対的な包囲が示唆されるが、その評価語は加えていない。
- source_word: מִנַּעַר וְעַד זָקֵן
  choice: 若者から老人まで
  rationale: 年齢層の両端を挙げて全体を表すメリズムを、簡潔で自然な日本語として再現した。
- source_word: כָּל הָעָם
  choice: すべての民
  rationale: 冒頭の「男たち」と、集合を表す עָם の語彙上の違いを保った。「民」はこの場の住民集団を指す。
- source_word: מִקָּצֶה
  choice: 町の隅々から
  rationale: 直訳は「端から」だが、ここでは町の各方面・各所から集まったことを表す慣用的な用法と判断した。文脈上暗黙の「町」を補って明瞭にした。
theological_decisions:
- issue: 群衆を表す性別語の扱い
  choice: אַנְשֵׁי を「男たち」、כָּל הָעָם を「すべての民」と訳し分ける
  alternative: すべてを「町の人々」と一般化する
  rationale: 原文は初めに男性を明示する語を用い、その後に集合名詞 עָם を置く。この違いを平板化せず保持した。
- issue: כָּל הָעָם の包括表現
  choice: 「すべての民」と原文の強い包括表現を保持する
  alternative: 「大勢の民」など、誇張の可能性を訳文で弱める
  rationale: 字義どおりの全員か修辞的な全体表現かを本文で決めず、原文の緊張を残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語文としての簡潔さと品位を保った。同格表現には「すなわち」を用いて原文の反復関係を分かりやすくし、第二文で群衆の包括性を自然に提示した。
