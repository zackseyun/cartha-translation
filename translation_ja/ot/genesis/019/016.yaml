base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/016.yaml
  text: But he lingered[a], so the men seized his hand, his wife’s hand, and the hands of his two daughters, because of Yahweh’s compassion for him[b]; and they brought him out and set him outside the city.
translation:
  language: ja
  text: しかし、彼がためらっていたので、男たちは彼の手、妻の手、二人の娘の手をつかんだ。ヤハウェが彼を憐れまれたからである。そして彼らは彼を連れ出し、町の外に置いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְמַהְמָהּ
  choice: ためらっていると
  rationale: この動詞は行動を遅らせることを表す。切迫した場面でぐずぐずしていたという含みを保ちつつ、現代日本語として自然にした。
- source_word: הָאֲנָשִׁים
  choice: 人々
  rationale: 文脈上は御使いたちだが、この節のヘブライ語は通常の呼称「男たち」を用いる。日本語では複数の男性を自然に指す「人々」とし、解釈的な「御使いたち」を本文に持ち込まない。
- source_word: וַיַּחֲזִקוּ
  choice: つかんだ
  rationale: 救出の緊迫感を伴う、しっかり手を取る動作を簡潔に表す。「捕らえた」では敵対的な含みが強すぎる。
- source_word: בְּיָדוֹ ... וּבְיַד אִשְׁתּוֹ ... וּבְיַד שְׁתֵּי בְנֹתָיו
  choice: 彼の手と、妻の手と、二人の娘の手
  rationale: 原文における「手」の反復を保った。一人ずつ手を取ったことを日本語で自然に示すため、「娘たちの両手」とはしない。
- source_word: בְּחֶמְלַת יְהוָה עָלָיו
  choice: ヤハウェが彼をあわれまれたからである
  rationale: 前置詞の理由・根拠の働きを明示し、חמלהの憐れみ、慈しみの意味を自然な叙述で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名を普通名詞や称号に置き換えず、固有名として音写した。
- source_word: וַיֹּצִאֻהוּ
  choice: 彼を連れ出し
  rationale: 使役形の「外へ出させる」を、救出場面に合う自然な日本語で表した。
- source_word: וַיַּנִּחֻהוּ
  choice: 置いた
  rationale: ここでは特定の場所に据える、移す意味。「残した」では見捨てたとの含みが生じうるため避けた。
- source_word: מִחוּץ לָעִיר
  choice: 町の外に
  rationale: 行為の到達地点である市域外を簡潔に示す。
theological_decisions:
- issue: 救出者たちの物語上の呼称
  choice: 人々
  alternative: 御使いたち／男たち
  rationale: 前後の文脈では彼らは御使いだが、この節自体は הָאֲנָשִׁים（男たち）と呼ぶ。そのため本文では御使いと解釈せず、自然な日本語の複数呼称を用いた。「男たち」はより字義的だが、この場面ではやや硬く響く。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。原文の動作の連続と「手」の反復を保ち、神名は「ヤハウェ」とした。注記を要するほどの本文異読はないため、脚注は設けていない。
