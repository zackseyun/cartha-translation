- from: しかし、彼がためらっていると、人々は彼の手と、妻の手と、二人の娘の手をつかんだ。ヤハウェが彼をあわれまれたからである。そして彼らは彼を連れ出し、町の外に置いた。
  to: しかし、彼がためらっていたので、男たちは彼の手、妻の手、二人の娘の手をつかんだ。ヤハウェが彼を憐れまれたからである。そして彼らは彼を連れ出し、町の外に置いた。
  rationale: 原文の男性複数名詞 הָאֲנָשִׁים を「男たち」と明示して、文脈に基づく「御使い」という解釈も、性別を失わせる一般化も避けました。動詞の叙述時制を整えたほか、手の反復、ヤハウェの憐れみを救出の理由とする関係、救出後に町の外に置く行為を保持しました。本文の意味に関わる異読を注記する必要はありません。
