  text: וַ/יַּשְׁכֵּ֥ם אַבְרָהָ֖ם בַּ/בֹּ֑קֶר אֶל הַ֨/מָּק֔וֹם אֲשֶׁר עָ֥מַד שָׁ֖ם אֶת פְּנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/027.yaml
  text: Abraham rose early in the morning to the place where he had stood before Yahweh[a].
translation:
  language: ja
  text: アブラハムは朝早く、かつてヤハウェの前[a]に立った場所へ赴いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語を直訳すると「ヤハウェの顔の前」。これは「ヤハウェの前」、すなわち「ヤハウェの臨在において」を意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: 朝早く起きて
  rationale: שׁכםのヒフィル形は「朝早く起きる」を表す。続くבַּבֹּקֶרと合わせ、早朝であることを自然な日本語で明示した。
- source_word: בַּבֹּקֶר
  choice: 朝早く
  rationale: 名詞בֹּקֶרは「朝」。直前の動詞が持つ早朝の含意と合わせて「朝早く」とし、重複感のない日本語にした。
- source_word: אֶל הַמָּקוֹם
  choice: 場所へ行った
  rationale: אֶלは方向・到達先を、מָקוֹםは通常「場所」を表す。日本語では目的地だけを「起きて、場所へ」と続けるのが不自然なため、方向表現から含意される移動を「行った」で明示した。
- source_word: אֲשֶׁר עָמַד שָׁם
  choice: かつて…立った
  rationale: 関係節は以前の出来事を振り返る。שָׁם「そこ」は先行詞「場所」と日本語の関係節に含まれるため重ねず、「かつて」で回顧的関係を自然に示した。
- source_word: אֶת פְּנֵי
  choice: 前に
  rationale: עָמַד אֶת־פְּנֵיは、ある者の面前または臨在のもとに立つことを表す慣用表現。「顔の前に」という逐語訳を避け、簡潔な「前に」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 本文にある神の固有名יהוהを称号に置き換えず、日本語で一般的な学術的音写「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として音写し、本文上の区別を保った。
- issue: 「ヤハウェの前に立つ」の意味
  choice: 慣用表現を保って「ヤハウェの前に立った」
  alternative: ヤハウェの臨在の中にいた、ヤハウェを礼拝した
  rationale: この表現は神の面前に立つことを示すが、具体的に礼拝や執り成しだけに限定せず、原文の含みを保った。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「朝早く起きて…場所へ行った」として、ヘブライ語の時間、方向、移動の流れを日本語として自然に表現した。神名は「ヤハウェ」とした。
