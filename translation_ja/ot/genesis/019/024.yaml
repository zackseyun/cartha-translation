  text: וַֽ/יהוָ֗ה הִמְטִ֧יר עַל סְדֹ֛ם וְ/עַל עֲמֹרָ֖ה גָּפְרִ֣ית וָ/אֵ֑שׁ מֵ/אֵ֥ת יְהוָ֖ה מִן הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/024.yaml
  text: Then Yahweh rained sulfur and fire on Sodom and Gomorrah from Yahweh out of the heavens[a][b].
translation:
  language: ja
  text: その時、主はソドムとゴモラの上に、主のもとから、天から硫黄と火を降らせた[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「硫黄」はヘブライ語 גָּפְרִית の訳。伝統的な訳では、この節の「火」と合わせて「火と硫黄」などと表現されることがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「主は……主のもとから、天から」。原文で神名が繰り返されているため、省略せず本文に残した。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を表す四文字名について、日本語聖書で広く定着した表記「主」を用いる。本文に二度現れることをそのまま保持する。
- source_word: הִמְטִיר
  choice: 降らせた
  rationale: ヒフィル形の「雨のように降らせる、降り注がせる」という使役的意味を、自然な現代日本語で表す。
- source_word: גָּפְרִית
  choice: 硫黄
  rationale: 語が指す物質を、古風な言い換えを避けて現代の明確な名称で表す。
- source_word: אֵשׁ
  choice: 火
  rationale: 基本義をそのまま表し、「硫黄」と並ぶ二つの目的語として保持する。
- source_word: עַל סְדֹם וְעַל עֲמֹרָה
  choice: ソドムとゴモラの上に
  rationale: 裁きが降りかかる対象を示す二度の前置詞 עַל を、日本語として自然にまとめつつ「上に」で上方からの像を保つ。
- source_word: מֵאֵת יְהוָה
  choice: 主のもとから
  rationale: 起源・出所を明示する句として訳し、先行する「主」と同一の神名が反復される原文の特徴を省略しない。
- source_word: מִן הַשָּׁמָיִם
  choice: 天から
  rationale: ヘブライ語では形態上複数だが、日本語の「天」は通常これを自然に表し、「諸天から」のような不自然または過度に限定的な表現を避ける。
- source_word: וַ
  choice: その時
  rationale: 物語を進める接続を、文脈上の継起が分かる自然な日本語で示す。
theological_decisions:
- issue: 「主は……主のもとから」という神名の反復
  choice: 本文で二度とも「主」と訳し、反復を保持する。
  alternative: 二度目を省いて「主は……天から降らせた」とする。
  rationale: 原文は יהוה を明示的に二度記しているため、作用主体を単純化したり神学的説明を加えたりせず、その解釈上の緊張を残す。
- issue: מֵאֵת יְהוָה と מִן הַשָּׁמָיִם の関係
  choice: 「主のもとから、天から」と、二つの出所表現をともに保持する。
  alternative: 「天におられる主のもとから」と統合する。
  rationale: 統合案は二句の統語関係を説明的に確定してしまう。原文どおり、主を起源、天を降下元として並べ、曖昧さを不必要に解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「主のもとから、天から」というやや異例な反復は、原文の二つの出所句と神名の反復を保つため意図的に残した。
