  text: וַ/יֹּ֜אמֶר הִנֶּ֣ה נָּא אֲדֹנַ֗/י ס֣וּרוּ נָ֠א אֶל בֵּ֨ית עַבְדְּ/כֶ֤ם וְ/לִ֨ינוּ֙ וְ/רַחֲצ֣וּ רַגְלֵי/כֶ֔ם וְ/הִשְׁכַּמְתֶּ֖ם וַ/הֲלַכְתֶּ֣ם לְ/דַרְכְּ/כֶ֑ם וַ/יֹּאמְר֣וּ לֹּ֔א כִּ֥י בָ/רְח֖וֹב נָלִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/002.yaml
  text: And he said[a], “Please, my lords, turn aside to your servant’s house, and spend the night, and wash your feet. Then you may rise early and go on your way.” But they said, “No[d][c][b], but we will spend the night in the square.”
translation:
  language: ja
  text: 彼は言った。「どうか皆さま、あなたがたのしもべの家にお立ち寄りください。一泊して足を洗い、朝早く起きて旅を続けてください。」しかし二人は言った。「いいえ、私たちは広場[a]で泊まります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「広場」は、町の中にある開けた公共の場所を指す。
    reason: cultural_note
lexical_decisions:
- source_word: הִנֶּה נָּא
  choice: どうか
  rationale: 直訳的な「見よ、今」ではなく、丁重に注意を引きつつ願う語用を、自然な現代日本語で表した。
- source_word: אֲדֹנַי
  choice: ご主人がた
  rationale: 文脈ではロトが二人の訪問者に敬意を込めて呼びかけており、複数の動詞・代名詞とも一致する。神への称号と断定しない訳語を選んだ。
- source_word: סוּרוּ נָא אֶל בֵּית עַבְדְּכֶם
  choice: 僕の家にお立ち寄りになり
  rationale: סור の進路をそれて入る意味を、日本語のもてなしの場面に自然な「立ち寄る」で表した。「僕」は話者が自分を低くする古代の敬譲表現として保持した。
- source_word: וְלִינוּ
  choice: 泊まって
  rationale: 一夜を宿る意味を簡潔で自然な日本語にした。
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: 足をお洗いください
  rationale: 古代の客人歓待の慣習を原文どおり保持し、呼びかけにふさわしい敬語とした。
- source_word: וְהִשְׁכַּמְתֶּם
  choice: 朝早く起きて
  rationale: 翌朝早く起きるという動作を明確に表した。
- source_word: וַהֲלַכְתֶּם לְדַרְכְּכֶם
  choice: それぞれの道へお出かけになれます
  rationale: 複数接尾辞を踏まえつつ、招待に伴う許容・見通しとして自然に表現した。
- source_word: בָרְחוֹב
  choice: 広場
  rationale: 単なる道路ではなく、都市内の開けた公共空間を指す語義を採った。
- source_word: נָלִין
  choice: 夜を過ごします
  rationale: 先の לין と同じく一夜を過ごす意味だが、屋外の広場であるため「泊まる」より自然な表現とした。
theological_decisions:
- issue: אֲדֹנַי を神への称号とするか、人間への敬称とするか
  choice: 二人の訪問者への複数の敬称「ご主人がた」
  alternative: 単数敬称「ご主人」または神への称号「主」
  rationale: 直近の文脈ではロトが二人に話しかけ、後続の命令形・代名詞も複数であるため、複数の人間への敬称が最も自然である。本文だけで神への直接呼称とは断定しない。
translation_notes:
  register: 明快な現代標準日本語を基調とし、ロトのへりくだりと客人への丁重な語調を敬語で表した。「僕」は古代の自己卑下の定型を残すため採用し、会話全体は過度に古風にならないよう整えた。
