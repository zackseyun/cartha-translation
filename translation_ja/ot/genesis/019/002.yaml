revisions:
- from: 彼は言った。「どうか、ご主人がた、僕の家にお立ち寄りになり、泊まって足をお洗いください。朝早く起きて、それぞれの道へお出かけになれます。」しかし二人は、「いや、私たちは広場[a]で夜を過ごします」と答えた。
  to: 彼は言った。「どうか皆さま、あなたがたのしもべの家にお立ち寄りください。一泊して足を洗い、朝早く起きて旅を続けてください。」しかし二人は言った。「いいえ、私たちは広場[a]で泊まります。」
  rationale: 現代標準日本語として不自然な複数敬称を自然な「皆さま」に改め、ロトの自己卑下は「あなたがたのしもべ」に明示した。「旅を続けてください」により、早朝に出発して進路を進む原文の意味を自然に表した。否定後の כִּי が示す対照は「いいえ」という拒否と後続の対案で日本語として無理なく表現している。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:15:43Z'
