id: GEN.19.38
reference: Genesis 19:38
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הַ/צְּעִירָ֤ה גַם הִוא֙ יָ֣לְדָה בֵּ֔ן וַ/תִּקְרָ֥א שְׁמ֖/וֹ בֶּן עַמִּ֑י ה֛וּא אֲבִ֥י בְנֵֽי עַמּ֖וֹן עַד הַ/יּֽוֹם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/038.yaml
  text: The younger also bore a son and called his name Ben-ammi[b][a]; he is the father of the Ammonites to this day.
translation:
  language: ja
  text: 妹もまた男の子を産み、その子をベン・アミ[a]と名づけた。彼は今日に至るまで、アンモン人[b]の父祖である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ベン・アミ」は、「私の民の子」または「私の身内の子」という意味と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「アンモンの子ら」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַצְּעִירָה
  choice: 妹
  rationale: 定冠詞付きの比較級形容詞が文脈上ロトの年下の娘を指す。日本語では「妹」が簡潔で自然であり、姉との関係も明確になる。
- source_word: גַם הִוא
  choice: もまた
  rationale: 姉と同様に妹も出産したという付加・対応の意味を自然に表す。
- source_word: יָלְדָה בֵּן
  choice: 男の子を産み
  rationale: ヘブライ語の ילד + בן を、現代日本語の自然な出生表現で訳した。
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: その子を…と名づけた
  rationale: 直訳的な「その名を呼んだ」より、命名を表す日本語として明瞭で自然である。
- source_word: בֶּן עַמִּי
  choice: ベン・アミ
  rationale: 固有名として音写し、物語上意味を持つ語義は脚注で示す。
- source_word: הוּא אֲבִי
  choice: 彼は…の父祖である
  rationale: 無動詞節の同定を保ちつつ、民族の始祖を意味する文脈に合う「父祖」を用いた。「父」より現代日本語で誤解が少ない。
- source_word: בְנֵי עַמּוֹן
  choice: アンモン人
  rationale: 字義は「アンモンの子ら」だが、民族名として現代日本語で自然な定着表現を採用した。字義は脚注で補う。
- source_word: עַד הַיּוֹם
  choice: 今日に至るまで
  rationale: 語り手の時代まで続く民族的系譜を示す、ヘブライ語物語の定型句に対応する。
theological_decisions:
- issue: אֲבִי の系譜的意味
  choice: 父祖
  alternative: 父
  rationale: ベン・アミが後代のアンモン人の祖先であるという系譜的関係を表すため。「父」という原語の比喩を過度に字義化せず、神学的含意を追加しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、創世記の物語にふさわしい簡潔で dignified な調子を保った。命名式は自然な日本語にしつつ、固有名の語義と民族名の字義は脚注に残した。
