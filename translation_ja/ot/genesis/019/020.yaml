source:
  edition: WLC
  text: הִנֵּה נָ֠א הָ/עִ֨יר הַ/זֹּ֧את קְרֹבָ֛ה לָ/נ֥וּס שָׁ֖מָּ/ה וְ/הִ֣יא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּ/ה הֲ/לֹ֥א מִצְעָ֛ר הִ֖וא וּ/תְחִ֥י נַפְשִֽׁ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/020.yaml
  text: Look[a], please, this city is near enough to flee there, and it is small[b]. Please let me escape there—is it not small? Then my life will live.
translation:
  language: ja
  text: 「どうか、ご覧ください。この町は、逃げ込むには近く、ほんの小さな町です。どうか、あそこへ逃れさせてください。小さな町ではありませんか。そうすれば、私は生き延びられます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: どうか、ご覧ください
  rationale: הִנֵּהの注意喚起と、請願を和らげつつ切迫感を添えるנָאを、現代日本語の丁寧な訴えとして表した。
- source_word: הָעִיר הַזֹּאת
  choice: あの町
  rationale: 話者が指し示す近隣の居住地を指す。日本語の場面では「あの町」が自然であり、עִירは規模を決めつけない「町」とした。
- source_word: קְרֹבָה לָנוּס שָׁמָּה
  choice: 逃げて行くのに近く
  rationale: 近さと逃避の目的を保持し、「そこへ」に当たるשָׁמָּהの方向性を「逃げて行く」で自然に示した。
- source_word: מִצְעָר
  choice: ほんの小さな町／小さな町
  rationale: 小ささ・取るに足りなさを表す語。ロトの訴えの反復を見える形で保ち、最初は強調の「ほんの」を添えた。
- source_word: אִמָּלְטָה נָּא שָׁמָּה
  choice: どうか、あそこへ逃れさせてください
  rationale: 一人称コホルタティブとנָאによる切実な許可の願いを、自然な依頼表現にした。
- source_word: וּתְחִי נַפְשִׁי
  choice: そうすれば、私は生き延びられます
  rationale: נֶפֶשׁはここでは話者自身を指す慣用的な婉曲表現であり、直訳的な「私の命が生きる」ではなく意味を明確にした。接続詞は直前の願いの結果を表すものとして「そうすれば」とした。
theological_decisions: []
translation_notes:
  register: 切迫した嘆願の調子を保ちながら、過度に古風な「見よ」「願わくは」は避けた。町の小ささを繰り返す原文の論法を維持し、結語はヘブライ語の慣用表現を明瞭な現代日本語にした。
