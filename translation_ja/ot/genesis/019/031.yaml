base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/031.yaml
  text: And the firstborn said to the younger[a], “Our father is old[b], and there is not a man in the land to come in to us according to the way of all the earth.”
translation:
  language: ja
  text: 長女は妹に言った。「父は年老いている。この地には、世のならわしどおりに私たちのもとに入って来る男がいない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私たちのもとに入って来る」は、ここでは性的関係を持つことを表す婉曲表現。「世のならわしどおりに」は、男女の結びつきと子孫を残すことに関わる、人間社会の通常の営みを指す。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: הַבְּכִירָה
  choice: 長女
  rationale: 語義は「長子／年長の者」。文脈上ロトの二人の娘を指すため、現代日本語で自然かつ出生順を明確にする「長女」とした。
- source_word: הַצְּעִירָה
  choice: 妹
  rationale: 「年下の者」を意味し、姉妹間の直接話法では「妹」が自然である。
- source_word: אָבִינוּ זָקֵן
  choice: 父は年老いている
  rationale: 無動詞節の状態を素直に表し、「年老いた」状態を現在のものとして伝える。
- source_word: וְאִישׁ אֵין בָּאָרֶץ
  choice: この地には…男がいない
  rationale: אִישׁ の男性指示を保持し、בָאָרֶץ は直前までの物語状況に即して「この地には」とした。
- source_word: לָבוֹא עָלֵינוּ
  choice: 私たちのところに入る
  rationale: 性的含意を持つヘブライ語の婉曲表現を、日本語でも過度に露骨にせず保持した。意味の補足は脚注に置く。
- source_word: כְּדֶרֶךְ כָּל הָאָרֶץ
  choice: 世の習わしに従って
  rationale: 直訳的な「全地の道に従って」では日本語として不透明なため、人間社会一般の通常の営み・慣行を指す表現として自然に訳した。
theological_decisions:
- issue: 「この地に男がいない」という発言の範囲
  choice: 娘の発言をそのまま訳し、実際に全世界に男性がいないとの客観的断定にはしない
  alternative: 「世界には男が一人もいない」と訳す
  rationale: בָאָרֶץ は「地／土地」の双方が可能であり、話者の認識や周辺地域を指す可能性を残す必要がある。
- issue: 「世の習わし」の具体的意味
  choice: 本文では婉曲性を保ち、脚注で性交と子孫継承に関わる通常の営みであることを示す
  alternative: 本文で「男女の関係を結ぶ」と明示する
  rationale: 原文自体が婉曲表現を用いているため、その語調と含みを保持する。
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語の厳粛さと原文の婉曲性を保持した。「長女／妹」は日本語として自然な姉妹関係を示し、「世の習わし」は原文の慣用的意味を過度に説明的にせず伝える。
