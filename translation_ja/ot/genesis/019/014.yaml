  text: וַ/יֵּצֵ֨א ל֜וֹט וַ/יְדַבֵּ֣ר אֶל חֲתָנָ֣י/ו לֹקְחֵ֣י בְנֹתָ֗י/ו וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן הַ/מָּק֣וֹם הַ/זֶּ֔ה כִּֽי מַשְׁחִ֥ית יְהוָ֖ה אֶת הָ/עִ֑יר וַ/יְהִ֥י כִ/מְצַחֵ֖ק בְּ/עֵינֵ֥י חֲתָנָֽי/ו׀־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/014.yaml
  text: So Lot went out and spoke to his sons-in-law[a], who were to marry his daughters, and said, “Get up, get out of this place[b], because Yahweh is about to destroy the city.” But he seemed to his sons-in-law to be joking.
translation:
  language: ja
  text: そこでロトは出て行き、娘たちをめとる婿たち[a]に話した。「さあ、この場所から出なさい。ヤハウェがこの町を滅ぼそうとしているからだ。」しかし、婿たちの目には、ロトは冗談を言っているように見えた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「すでに娘たちをめとっていた婿たち」とも訳せる。ヘブライ語の表現だけでは、婚姻が成立済みか、これから結婚する段階かを確定できない。
    reason: alternative_reading
  - marker: b
    text: 直訳は「婿たちの目には、彼は冗談を言う者のようであった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲתָנָיו
  choice: 婿たち
  rationale: חָתָןは「花婿」または「婿」を指す。ここではロトの娘たちとの婚姻関係にある男性たちなので、自然な現代日本語の「婿たち」とした。婚姻が成立済みか婚約段階かは後続句と脚注で示した。
- source_word: לֹקְחֵי בְנֹתָיו
  choice: 娘たちをめとることになっていた
  rationale: 直訳的には「彼の娘たちを取る者たち」で、婚姻を表す。次節で娘たちがロトの家にいる物語状況を踏まえ、本文では婚約中を示す表現としたが、完了した婚姻を指す可能性も脚注に残した。
- source_word: קוּמוּ צְּאוּ
  choice: 立って、この場所から出なさい
  rationale: 二つの命令の切迫感を保ちつつ、明瞭で自然な日本語にした。「立って」は直ちに行動を起こすよう促す表現である。
- source_word: מַשְׁחִית
  choice: 滅ぼそうとしておられる
  rationale: ヒフィル分詞が文脈上、目前に迫った行為を表すため、まだ始まっていない滅亡の切迫性を示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を日本語で音写した。
- source_word: כִמְצַחֵק בְּעֵינֵי חֲתָנָיו
  choice: 婿たちの目には、ロトは冗談を言っているように見えた
  rationale: 「婿たちの目には、冗談を言う者のようであった」というヘブライ語の比喩的な言い回しを、視点と知覚上の判断を保って自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を明記しているため、称号「主」に置き換えず音写し、本文上の区別を保った。
- issue: 婿たちの婚姻状態
  choice: 婚約中で、娘たちをめとることになっていた男性たち
  alternative: すでに娘たちと結婚していた婿たち
  rationale: 分詞 לֹקְחֵי は進行中・予定・成立済みの婚姻のいずれをも文脈上許しうる。次節との整合から本文では婚約中と読んだが、原文の曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、命令の切迫感と物語の厳粛さを保った。「おられる」は神の行為について自然な敬意を示すが、過度に古風な文体にはしていない。
