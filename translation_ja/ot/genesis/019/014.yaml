revisions:
- from: そこでロトは出て行き、娘たちをめとることになっていた婿たち[a]に話した。「立って、この場所から出なさい。ヤハウェがこの町を滅ぼそうとしておられるからだ。」しかし、婿たちの目には、ロトは冗談を言っているように見えた[b]。
  to: そこでロトは出て行き、娘たちをめとる婿たち[a]に話した。「さあ、この場所から出なさい。ヤハウェがこの町を滅ぼそうとしているからだ。」しかし、婿たちの目には、ロトは冗談を言っているように見えた[b]。
  rationale: 婚姻状態について本文が将来の予定に限定しないよう「娘たちをめとる婿たち」とし、脚注で成立済みという可能性を保持した。「さあ、この場所から出なさい」は二つの命令の切迫感を自然な現代日本語で表す。「おられる」を「いる」に改め、原文にない敬語性を避けた。
