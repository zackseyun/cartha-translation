revisions:
- from: 夕暮れ時、二人の御使いがソドムに着いた。その時、ロトはソドムの町の門の広場に座っていた。[a] ロトは彼らを見ると、立ち上がって迎えに行き、顔を地につけてひれ伏した。[b]
  to: 夕暮れ時、二人の御使いがソドムに着いた。その時、ロトはソドムの門のところに座っていた。[a] ロトは彼らを見ると、立ち上がって迎えに行き、顔を地につけてひれ伏した。[b]
  rationale: 「門の広場」という過度に限定的な表現を「門のところ」に改め、原文がもつ都市門・門の区域という幅を保持した。脚注aで必要な文化的背景を補った。さらに、脚注bから「身をかがめた」という弱い擬似直訳を除き、原語が表す深い平伏を正確に説明した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:15:43Z'
review_pass:
  verdict: revise
  source_fidelity: 本文の「ソドムの町の門の広場」は、ヘブライ語の「ソドムの門に／門のところに」（בְּשַׁעַר סְדֹם）より具体化しすぎている。「門」は門の建造物だけでなく、その周辺の公的な場を指し得るが、「広場」の存在・形状までは本文が明示しない。ほかは、到着時、ロトが座っていたという背景描写、迎えに立つ行為、顔を地に向ける平伏を適切に伝えている。
  naturalness: 全体として明瞭で自然な現代標準日本語である。「ソドムの門のところに座っていた」は、「町の門の広場」よりも自然で、原文の指示範囲も保てる。
  terminology: 「御使い」はこの文脈の天的な使者を示す聖書日本語として適切である。「ひれ伏した」は礼拝と断定せず深い敬意の身体動作を表せる。「顔を地につけて」は、原文の「顔を地に向けて」という慣用的表現を自然に訳している。
  issues:
  - severity: medium
    issue: 「門の広場」が原文にない空間的細部を加えている。
    rationale: שַׁעַר は都市の門およびその門の区域を指し得るが、「広場」と限定する語はない。本文は「門のところ」とし、門が公的活動の場でもあったことは脚注で説明するのが適切である。
  - severity: low
    issue: 脚注bの「直訳的には『顔を地に向けて身をかがめた』」は、直訳として不正確であり、動作を弱める。
    rationale: וַיִּשְׁתַּחוּ אַפַּיִם אַרְצָה は、単なる「身をかがめる」より深い平伏を表す。脚注は原語の表す深い平伏を説明する形に改める。
  revised_text: 夕暮れ時、二人の御使いがソドムに着いた。その時、ロトはソドムの門のところに座っていた。[a] ロトは彼らを見ると、立ち上がって迎えに行き、顔を地につけてひれ伏した。[b]
  revised_footnotes:
