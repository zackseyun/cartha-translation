  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ֠/יָּבֹאוּ שְׁנֵ֨י הַ/מַּלְאָכִ֤ים סְדֹ֨מָ/ה֙ בָּ/עֶ֔רֶב וְ/ל֖וֹט יֹשֵׁ֣ב בְּ/שַֽׁעַר סְדֹ֑ם וַ/יַּרְא לוֹט֙ וַ/יָּ֣קָם לִ/קְרָאתָ֔/ם וַ/יִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/001.yaml
  text: The two angels came to Sodom in the evening[a], and Lot was sitting in the gate of Sodom. When Lot saw them[c][b], he rose to meet them and bowed with his face to the ground.
translation:
  language: ja
  text: 夕暮れ時、二人の御使いがソドムに着いた。その時、ロトはソドムの門のところに座っていた。[a] ロトは彼らを見ると、立ち上がって迎えに行き、顔を地につけてひれ伏した。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「門」は、単なる出入口ではなく、公的な活動も行われた門の一帯を指す。
    reason: cultural_note
  - marker: b
    text: ヘブライ語は、顔を地に向ける深い平伏の動作を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: 着いた
  rationale: בוא の物語形は到着を表し、目的地を示す סְדֹמָה と合わせて、現代日本語では「着いた」が自然である。
- source_word: שְׁנֵי הַמַּלְאָכִים
  choice: 二人の御使い
  rationale: מַלְאָךְ は「使者」と「天使」の両義を持つが、直前の物語から天的な訪問者を指すため、聖書文体として通用する「御使い」とした。
- source_word: סְדֹמָה
  choice: ソドムに
  rationale: 地名に付く方向接尾辞 ה はその場所への移動を示すため、「ソドムに」とした。
- source_word: בָּעֶרֶב
  choice: 夕暮れ時
  rationale: 到着の時を示す語句。明確で自然な現代日本語として「夕暮れ時」とした。
- source_word: יֹשֵׁב
  choice: 座っていた
  rationale: 分詞による継続的な背景描写を「座っていた」で表した。
- source_word: בְּשַׁעַר סְדֹם
  choice: ソドムの町の門の広場に
  rationale: 古代都市の שַׁעַר は単なる扉ではなく公共活動が行われた門の一帯を指すため、「町の門の広場」として文化的指示対象を明確にした。
- source_word: וַיַּרְא לוֹט
  choice: ロトは彼らを見ると
  rationale: 目的語は文脈上二人の御使いであり、日本語では補って「彼ら」とするのが自然である。物語の連続を「見ると」で表した。
- source_word: וַיָּקָם לִקְרָאתָם
  choice: 立ち上がって迎えに行き
  rationale: קום と לקראת の組み合わせが示す、立って相手を迎えに出る動作を自然な日本語で表した。
- source_word: וַיִּשְׁתַּחוּ
  choice: ひれ伏した
  rationale: שׁחה は礼拝にも敬意を示す低い礼にも用いられる。この場面では行為の姿勢を表す「ひれ伏した」とし、礼拝という解釈を本文に持ち込まない。
- source_word: אַפַּיִם אָרְצָה
  choice: 顔を地につけて
  rationale: 顔を地面に向ける完全な平伏を表す慣用句であり、「顔を地につけて」が明瞭で自然である。
theological_decisions:
- issue: וַיִּשְׁתַּחוּ が礼拝か、敬意を示す平伏か
  choice: 姿勢を表す「ひれ伏した」
  alternative: 「礼拝した」
  rationale: この動詞は神への礼拝にも、人や高位の訪問者への敬礼にも使われる。ここではロトが訪問者を迎える場面なので、礼拝と断定せず、本文が明示する身体動作を訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、物語の品位を保った。「御使い」は文脈上の天的使者を示す聖書語として採用。「門」の文化的意味は本文で簡潔に明確化し、脚注で補足した。
