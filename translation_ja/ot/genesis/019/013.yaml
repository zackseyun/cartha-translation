source:
  edition: WLC
  text: כִּֽי מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת הַ/מָּק֖וֹם הַ/זֶּ֑ה כִּֽי גָֽדְלָ֤ה צַעֲקָתָ/ם֙ אֶת פְּנֵ֣י יְהוָ֔ה וַ/יְשַׁלְּחֵ֥/נוּ יְהוָ֖ה לְ/שַׁחֲתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/013.yaml
  text: For we are about to destroy this place[a], because their outcry has become great before Yahweh, and Yahweh has sent us to destroy it.
translation:
  language: ja
  text: 私たちは、この場所をこれから滅ぼす。彼らの叫び[a]がヤハウェの御前で大きくなったので、ヤハウェがこの場所を滅ぼすために私たちを遣わされたのだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らに対する叫び（訴え）」。ヘブライ語は直訳すると「彼らの叫び」だが、文脈上、この場所の人々に対して上げられた訴えを指すとも理解される。
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׁחִתִים
  choice: これから滅ぼす
  rationale: ヒフィル分詞の、差し迫った行為を表す用法を自然な現代日本語で示す。単なる未来よりも、滅亡が目前に迫っている響きを保つ。
- source_word: הַמָּקוֹם הַזֶּה
  choice: この場所
  rationale: 指示語の力を保ちつつ、מָקוֹםを直接的で自然な日本語に訳す。
- source_word: גָדְלָה
  choice: 非常に大きくなった
  rationale: גדלの完了形が表す増大と、その結果としての大きさを示す。文脈上の強意を「非常に」で自然に表現する。
- source_word: צַעֲקָתָם
  choice: 彼らの叫び
  rationale: 三人称男性複数接尾辞を形式どおり「彼らの」と訳し、それが彼ら自身の叫びか、彼らに対して上げられた訴えかを本文で決めつけない。
- source_word: אֶת פְּנֵי יְהוָה
  choice: ヤハウェの前で
  rationale: 神の御前にあることを示すヘブライ語の慣用表現を、過度に逐語的にせず保持する。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神名を日本語で音写する。
- source_word: וַיְשַׁלְּחֵנוּ
  choice: 私たちを遣わされた
  rationale: すでに行われ、現在の使命につながる派遣を表す。「遣わす」は使命を帯びた派遣にふさわしい自然で格調ある語。
- source_word: לְשַׁחֲתָהּ
  choice: ここを滅ぼすために
  rationale: 女性単数接尾辞の指示対象を、日本語では直前の「この場所」を受ける「ここ」として自然に表し、同じ語根 שׁחת は前半と同じく「滅ぼす」と訳す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: ヘブライ語本文の固有の神名を称号へ置き換えず、そのまま音写する。
- issue: צַעֲקָתָם の意味
  choice: 彼らの叫び
  alternative: 彼らに対する叫び／訴え
  rationale: 接尾辞の最も直接的な形を本文に残しつつ、文脈上有力な目的格的理解を脚注に示して、解釈上の緊張を保つ。
translation_notes:
  register: 明快な現代標準日本語を用いながら、裁きの宣告にふさわしい厳粛さを保った。「これから」によって切迫した滅亡を示し、「彼らの叫び」の曖昧さは本文で解消せず脚注に残した。
