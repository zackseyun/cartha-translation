  to: 私たちは、この場所をこれから滅ぼす。彼らの叫び[a]がヤハウェの御前で大きくなったので、ヤハウェがこの場所を滅ぼすために私たちを遣わされたのだ。
  rationale: 原文にない「非常に」を削除し、ヘブライ語の完了形が示す「大きくなった」という結果的意味を保った。また、「御前で」により原文の慣用表現をより自然な日本語で表した。後半の「この場所」は前半との対応と女性単数接尾辞の指示対象を明瞭にする。脚注は、צַעֲקָתָםの文法的な読みと文脈的な代替理解の双方を保持している。
