revisions:
- from: さあ、どうか聞いてください。私には、まだ男を知らない娘が二人います[a]。どうか、その娘たちをあなたがたのところへ連れ出させてください。そして、あなたがたの目に良いと思うように、娘たちにしてください。ただ、この人たちには何もしないでください。彼らは私の屋根の陰に入ったのですから[b]。
  to: さあ、どうか聞いてください。私には、まだ男を知らない娘が二人います[a]。どうか、その娘たちをあなたがたのところへ連れ出させてください。そして、娘たちを、あなたがたの目に良いと思うように扱ってください。ただ、この男たちには何もしないでください。彼らは私の屋根の陰に入ったのですから[b]。
  rationale: 「扱ってください」は、ヘブライ語の「彼女たちに対して行う」という構文を自然な日本語にしつつ、ロトが娘たちを相手方の意のままに委ねようとする発言の深刻さを隠さない。客人を指す語も「この男たち」として原文の指示対象を明示した。
