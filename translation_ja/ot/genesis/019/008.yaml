id: GEN.19.8
reference: Genesis 19:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הִנֵּה נָ֨א לִ֜/י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה נָּ֤א אֶתְ/הֶן֙ אֲלֵי/כֶ֔ם וַ/עֲשׂ֣וּ לָ/הֶ֔ן כַּ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם רַ֠ק לָֽ/אֲנָשִׁ֤ים הָ/אֵל֙ אַל תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי עַל כֵּ֥ן בָּ֖אוּ בְּ/צֵ֥ל קֹרָתִֽ/י־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/019/008.yaml
  text: Look[a], please, I have two daughters who have not known a man. Please let me bring them out to you, and do to them as is good in your eyes. Only to these men do nothing[c][b], for they have come under the shadow of my roof.
translation:
  language: ja
  text: さあ、どうか聞いてください。私には、まだ男を知らない娘が二人います[a]。どうか、その娘たちをあなたがたのところへ連れ出させてください。そして、娘たちを、あなたがたの目に良いと思うように扱ってください。ただ、この男たちには何もしないでください。彼らは私の屋根の陰に入ったのですから[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「男を知らない」は、男性と性的関係を持ったことがないという意味。伝統的には「処女である」とも訳される。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私の屋根の陰に入った」。家に迎え入れられた客人が、その家の主人の保護下にあることを表す。
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: さあ、どうか聞いてください
  rationale: הִנֵּהの注意を促す働きと、נָאの切迫した懇願を、現代日本語で自然に表した。「見よ」では視覚的意味が強すぎ、ここでの訴えかけとしては硬いため避けた。
- source_word: שְׁתֵּי בָנוֹת
  choice: 娘が二人
  rationale: 数量と親族関係をそのまま明確に訳した。
- source_word: אֲשֶׁר לֹא יָדְעוּ אִישׁ
  choice: まだ男を知らない
  rationale: יָדַעの性的関係を指す婉曲表現を保ち、意味を脚注で明示した。「まだ」は日本語として自然に未経験を示すが、将来についての断定は含めない。
- source_word: אוֹצִיאָה נָּא אֶתְהֶן אֲלֵיכֶם
  choice: どうか、その娘たちをあなたがたのところへ連れ出させてください
  rationale: コホータティブの申し出・意志を「連れ出させてください」で表し、二度目のנָאを「どうか」として懇願の調子を保持した。
- source_word: וַעֲשׂוּ לָהֶן כַּטּוֹב בְּעֵינֵיכֶם
  choice: あなたがたの目に良いと思うように、娘たちにしてください
  rationale: 「目に良い」というヘブライ語の表現をできるだけ保ち、発言の衝撃を「好きなように扱う」などの意訳で弱めないようにした。
- source_word: רַק
  choice: ただ
  rationale: 前の申し出から客人だけを強く除外する限定・対比を自然な日本語で示した。
- source_word: לָאֲנָשִׁים הָאֵל אַל תַּעֲשׂוּ דָבָר
  choice: この人たちには何もしないでください
  rationale: 前置された対象を日本語でも先に置き、全面的な禁止を明瞭に表した。文脈上は男性の客人だが、「この人たち」は現場の指示表現として自然である。
- source_word: כִּי עַל כֵּן בָּאוּ
  choice: 彼らは……入ったのですから
  rationale: כִּיの理由説明を「のですから」で表した。עַל־כֵּןはここでは彼らがロトの庇護下に来たことを理由として示す結びつきの中で訳した。
- source_word: בְּצֵל קֹרָתִי
  choice: 私の屋根の陰に
  rationale: 「屋根の陰」という原文の比喩的な像を保持しつつ、客人が家主の保護下にあるという含意を脚注で説明した。
theological_decisions:
- issue: ロトの娘たちに関する衝撃的な申し出を道徳的に和らげるか
  choice: 原文の厳しい内容を婉曲に正当化したり弱めたりせず、そのまま示す
  alternative: 「娘たちを好きなように扱ってください」など、より慣用的だが行為の構造をぼかす表現にする
  rationale: 本文はロトの言葉を報告しているのであって、その提案を道徳的に承認してはいない。翻訳が評価を付加せず、同時に原文の不快で深刻な内容も隠さないことを優先した。
- issue: 「屋根の陰」を単に居住場所と見るか、客人保護の含意を認めるか
  choice: 本文では原文の像を保ち、古代の客人保護の含意を脚注で示す
  alternative: 本文で「私の保護を求めて来た」と説明的に訳す
  rationale: בְּצֵל קֹרָתִיの比喩を消さずに残しつつ、その文化的意味を読者が理解できるよう補足する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ロトの切迫した懇願と原文の反復を保持した。叙述を上品に言い換えて衝撃を弱めず、また本文自体がロトの行為を承認しているかのような評価も加えていない。「屋根の陰」「目に良い」など理解可能な原文の像は残し、必要な説明のみ脚注に置いた。
