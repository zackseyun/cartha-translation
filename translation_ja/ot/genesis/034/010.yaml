  text: וְ/אִתָּ֖/נוּ תֵּשֵׁ֑בוּ וְ/הָ/אָ֨רֶץ֙ תִּהְיֶ֣ה לִ/פְנֵי/כֶ֔ם שְׁבוּ֙ וּ/סְחָר֔וּ/הָ וְ/הֵֽאָחֲז֖וּ בָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/010.yaml
  text: You may dwell with us[a], and the land will be before you. Settle in it, trade in it[b], and acquire property in it.
translation:
  language: ja
  text: あなたがたは私たちと共に住むことができます。この土地はあなたがたに開かれています[a]。この地に住み、ここで商いをし、この地で所有地を得なさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「この土地はあなたがたの前にある」。土地があなたがたに利用可能であることを表す言い回し。
    reason: lexical_alternative
  - marker: b
    text: 別訳「この地で所有権を得なさい」または「この地に保有地を得なさい」。ヘブライ語は、この土地に持ち分または所有権を得ることを指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתָּנוּ תֵּשֵׁבוּ
  choice: あなたがたは私たちと共に住んでください
  rationale: יָשַׁבの「住む、居住する」という意味を保ちつつ、交渉の中での勧誘・許可の趣旨を現代日本語の依頼表現で示した。
- source_word: וְהָאָרֶץ תִּהְיֶה לִפְנֵיכֶם
  choice: この土地はあなたがたの前にあります
  rationale: 「人の前にある」というヘブライ語の像を残した。この文脈では、土地が利用できる、自由に行き来できるという含みを持つ。
- source_word: שְׁבוּ
  choice: ここに住み
  rationale: יָשַׁבの命令形を、直前の「この土地」を受ける自然な日本語で訳した。
- source_word: וּסְחָרוּהָ
  choice: ここで商いをし
  rationale: סחרが表す商業活動を、簡潔で明確な「商いをする」とした。接尾辞が指す土地は「ここで」と表現した。
- source_word: וְהֵאָחֲזוּ בָּהּ
  choice: ここに土地を得なさい
  rationale: אָחַזのニファル形がこの箇所で示す、土地に恒久的な持ち分・所有地を得る意味を表した。単なる物理的な占拠とは断定しない。
