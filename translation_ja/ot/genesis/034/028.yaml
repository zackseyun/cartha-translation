  text: אֶת צֹאנָ֥/ם וְ/אֶת בְּקָרָ֖/ם וְ/אֶת חֲמֹרֵי/הֶּ֑ם וְ/אֵ֧ת אֲשֶׁר בָּ/עִ֛יר וְ/אֶת אֲשֶׁ֥ר בַּ/שָּׂדֶ֖ה לָקָֽחוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/028.yaml
  text: They took their flocks[a], their herds, their donkeys, and whatever was in the city and whatever was in the field.
translation:
  language: ja
  text: 彼らは、その羊や山羊の群れ、牛の群れ、ろば、そして町にあったものと野にあったものを取った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֹאנָם
  choice: その羊や山羊の群れ
  rationale: צֹאןは主に羊と山羊から成る小家畜を集合的に指す。現代日本語で内容と集合性が明確になるように訳した。
- source_word: בְּקָרָם
  choice: 牛の群れ
  rationale: בָּקָרは集合的に牛類を指す。「牛の群れ」は文脈に自然で、集合名詞としての意味を保つ。
- source_word: חֲמֹרֵיהֶם
  choice: ろば
  rationale: חֲמוֹרはろばを意味する。日本語では複数を明示しなくても集合的に理解できるため、自然な「ろば」とした。
- source_word: אֲשֶׁר בָּעִיר
  choice: 町にあるものも
  rationale: 目的語標識を伴う関係節で、町の中にあった物全般を指す。後続句との並行を自然に示した。
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: 野にあるものも
  rationale: שָׂדֶהは畑または町外の野を指し得る。ここでは町との対比を保つ「野」が自然で、意味を狭く限定しない。
- source_word: לָקָחוּ
  choice: 奪った
  rationale: לָקַח自体は「取る」だが、直前から続く略奪の文脈では「奪った」が現代日本語として明確かつ自然である。動詞が節末に一度だけあるヘブライ語に対し、日本語では読みやすさのため二度示した。
theological_decisions: []
translation_notes:
  register: 明快で品位ある現代標準日本語。所有者は文脈上明らかなため、「その」で受けて過度な反復を避けた。町と野の対句を保持し、末尾の「すべて」は二つの関係節の包括的範囲を自然に表す。
