- source_word: קַח־לִי
  choice: 私の妻にもらってください
  rationale: 字義的には「私のために取ってくれ」。父に婚姻の取り決めを求める文脈を、現代日本語で自然かつ明確に表した。
- source_word: הַיַּלְדָּה הַזֹּאת
  choice: この娘
  rationale: יַלְדָּהはここでは結婚の対象となる若い女性を指す。「少女」よりも文脈に自然で、原文の指示表現「この」も保持する。
- source_word: לְאִשָּׁה
  choice: 妻に
  rationale: 目的・身分を示す表現であり、シェケムが彼女との婚姻を求めていることを簡潔に示す。
