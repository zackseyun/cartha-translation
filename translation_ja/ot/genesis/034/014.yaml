  text: וַ/יֹּאמְר֣וּ אֲלֵי/הֶ֗ם לֹ֤א נוּכַל֙ לַ/עֲשׂוֹת֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה לָ/תֵת֙ אֶת אֲחֹתֵ֔/נוּ לְ/אִ֖ישׁ אֲשֶׁר ל֣/וֹ עָרְלָ֑ה כִּֽי חֶרְפָּ֥ה הִ֖וא לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/014.yaml
  text: And they said to them[a], “We cannot do this thing, to give our sister to a man who has a foreskin, for that is a disgrace to us.”
translation:
  language: ja
  text: 彼らは彼らに言った。「私たちの妹を、包皮のある男[a]に与えることは、私たちにはできない。それは私たちにとって恥辱だからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「割礼を受けていない男」。直訳では「包皮のある男」。
    reason: 原文の身体的で直截な表現と、その意味を慣用的に表す訳語の両方を示すため。
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵיהֶם
  choice: 彼らはその二人に言った
  rationale: אמרを通常の叙述表現「言った」とし、複数の間接目的語を文脈上のハモルとシェケムを指す「その二人」で明確にした。
- source_word: לֹא נוּכַל לַעֲשׂוֹת הַדָּבָר הַזֶּה
  choice: このようなことは、私たちにはできない
  rationale: יכלの能力・可能性を「できない」で自然に表し、הַדָּבָר הַזֶּהは後続の不定詞句を受ける日本語として「このようなこと」とした。
- source_word: לָתֵת אֶת אֲחֹתֵנוּ
  choice: 私たちの妹を…与える
  rationale: נתןの基本義「与える」を保持した。婚姻の文脈は明白だが、原文にない「嫁がせる」までは本文に加えない。
- source_word: לְאִישׁ אֲשֶׁר לוֹ עָרְלָה
  choice: 包皮のある男
  rationale: 原文の直截な表現「包皮を持つ男」を、日本語として成立する「包皮のある男」で保持した。慣用的な「割礼を受けていない男」は脚注に示す。
- source_word: כִּי חֶרְפָּה הִוא לָנוּ
  choice: それは私たちにとって恥辱だからだ
  rationale: חֶרְפָּהが表す社会的な辱め・不名誉を、現代日本語で重みのある「恥辱」とした。接続詞כִּיは理由を示す「からだ」で訳した。
