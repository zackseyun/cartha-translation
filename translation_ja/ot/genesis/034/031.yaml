  yaml_path: translation/ot/genesis/034/031.yaml
  text: But they said[a], “Should he treat our sister like a prostitute?”
translation:
  language: ja
  text: しかし、彼らは言った[a]。「彼は私たちの妹を娼婦のように扱ってよいのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼は私たちの妹を娼婦のようにしてよいのですか」。ヘブライ語の動詞は字義的には「する、作る」だが、ここでは「扱う」という意味だと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: しかし、彼らは言った
  rationale: 接続詞を伴う物語の継続形だが、直前のヤコブの非難に対する反論なので、文脈上の対立を自然な現代日本語の「しかし」で表した。
- source_word: הַכְזוֹנָה
  choice: 娼婦のように
  rationale: 疑問辞 ה、比較を表す כ、名詞 זונה の組み合わせ。「娼婦」は意味を明確に伝え、「のように」で比較の力を保つ。
- source_word: יַעֲשֶׂה
  choice: 扱われてもよい
  rationale: עשה は広く「する、作る」を意味するが、人物を目的語とするこの文脈では「扱う」が自然。三人称男性単数の行為者は文脈上シェケムだが、日本語では受動形により、妹が受けた扱いに焦点を置きつつ修辞疑問を自然に表現した。
- source_word: אֲחוֹתֵנוּ
  choice: 妹
  rationale: 直訳は「私たちの姉妹」。話者たちとディナの関係を現代日本語で自然に示すため「妹」としたが、原語自体は年長・年少を区別しない。
