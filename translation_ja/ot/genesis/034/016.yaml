  text: וְ/נָתַ֤נּוּ אֶת בְּנֹתֵ֨י/נוּ֙ לָ/כֶ֔ם וְ/אֶת בְּנֹתֵי/כֶ֖ם נִֽקַּֽח לָ֑/נוּ וְ/יָשַׁ֣בְנוּ אִתְּ/כֶ֔ם וְ/הָיִ֖ינוּ לְ/עַ֥ם אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/016.yaml
  text: then we will give our daughters to you[a], and we will take your daughters for ourselves, and we will live with you and become one people.
translation:
  language: ja
  text: そうすれば、私たちは娘たちをあなたがたに嫁がせ、あなたがたの娘たちを妻に迎えます。そして、あなたがたと共に住み、一つの民となります[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「一つの民である」。ヘブライ語は直訳すると「一つの民のためにある」となり、結果として「一つの民となる」とも、より形式的に「一つの民である」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַנּוּ אֶת־בְּנֹתֵינוּ לָכֶם
  choice: そうすれば、私たちは娘たちをあなたがたに嫁がせ
  rationale: 条件交渉の帰結を「そうすれば」で示した。「娘たちを与える」の直訳は日本語では物扱いの響きが強いため、婚姻の文脈を自然に表す「嫁がせ」とした。
- source_word: וְאֶת־בְּנֹתֵיכֶם נִקַּח־לָנוּ
  choice: あなたがたの娘たちを妻に迎えます
  rationale: לקח は字義的には「取る」だが、ここでは婚姻を指す。「自分たちのために取る」よりも、意味を過不足なく伝える現代日本語の「妻に迎える」を選んだ。
- source_word: וְיָשַׁבְנוּ אִתְּכֶם
  choice: あなたがたと共に住み
  rationale: ישב の居住・定住の意味を、明瞭で品位ある現代語「共に住む」で表した。
- source_word: וְהָיִינוּ לְעַם אֶחָד
  choice: 一つの民となります
  rationale: היה の結果的な状態移行を文脈に即して「となる」と訳した。עם は近代的政治国家よりも民族・共同体を表すため「民」とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。婚姻交換を表すヘブライ語の字義を保ちつつ、日本語で娘を物のように「与える／取る」と表現する不自然さを避け、文脈上明白な婚姻関係を動詞に反映した。
