- source_word: וַיִּיטְבוּ
  choice: 目にかなった
  rationale: 「良い、喜ばしい」を意味する יטב が בְּעֵינֵי と結びついた評価・承認の慣用表現。現代日本語で自然に、彼らがその言葉を好ましく受け入れたことを表す。
- source_word: דִבְרֵיהֶם
  choice: 彼らの言葉
  rationale: דָּבָר の複数形に三人称男性複数接尾辞が付いた形。「提案」と限定せず、原文の語義の広さを保つ。
- source_word: בְּעֵינֵי
  choice: の目に
  rationale: 直訳的な身体表現を生かしつつ、日本語の慣用句「目にかなう」によって評価・是認の意味を自然に伝える。
- source_word: חֲמוֹר
  choice: ハモル
  rationale: 固有名を日本語の慣用的な聖書表記で音写する。
- source_word: שְׁכֶם
  choice: シェケム
  rationale: 固有名を日本語の慣用的な聖書表記で音写する。
- source_word: בֶּן חֲמוֹר
  choice: ハモルの息子シェケム
  rationale: 標準的な親子関係の表現。日本語として自然な語順を用いながら、原文の人物同定を明確に保つ。
