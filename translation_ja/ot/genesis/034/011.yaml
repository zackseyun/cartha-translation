base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/011.yaml
  text: Then Shechem said to her father and to her brothers[a], “Let me find favor in your eyes, and whatever you say to me[b], I will give.”
translation:
  language: ja
  text: そこでシケムは、彼女の父と兄弟たちに言った。「どうか、あなたがたの好意を得られますように[a]。あなたがたが私におっしゃることは何でも[b]、差し上げます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どうか、あなたがたの目にかなうようにしてください」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたがたが私に求めるものは何でも」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を先へ進めるワウ継続法の順接を、現代日本語として自然な「そこで」で表した。
- source_word: שְׁכֶם
  choice: シケム
  rationale: 人名として、日本語聖書で広く用いられる慣用的な音写を採用した。
- source_word: אֶל אָבִיהָ וְאֶל אַחֶיהָ
  choice: 彼女の父と兄弟たちに
  rationale: 女性単数の接尾辞を「彼女の」、男性複数 אַחֶיהָ を「兄弟たち」とし、二度の אֶל は日本語で不自然にならないよう一つの助詞「に」で受けた。
- source_word: אֶמְצָא חֵן בְּעֵינֵיכֶם
  choice: どうか、あなたがたの好意を得させてください
  rationale: 字義的には「あなたがたの目に好意を見いだす」という、受け入れや厚意を願う慣用句である。比喩を無理に逐語化せず、依頼の意味を明瞭にした。
- source_word: וַאֲשֶׁר
  choice: ……ものは何でも
  rationale: 接続詞を文の連続性に含め、不定関係の開かれた範囲を「何でも」で表した。
- source_word: תֹּאמְרוּ אֵלַי
  choice: あなたがたが私におっしゃる
  rationale: אָמַר と אֶל の基本義「～に言う」を保ちつつ、交渉相手への発言として自然な敬語にした。「求める」は文脈上可能だが、本文では解釈を狭めず脚注に示した。
- source_word: אֶתֵּן
  choice: 差し上げます
  rationale: נָתַן の基本義「与える」を保ち、聞き手への約束に合う謙譲表現とした。婚資の支払いに限定する「支払います」は採らなかった。
