  text: אַךְ בְּ/זֹ֖את נֵא֣וֹת לָ/כֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔/נוּ לְ/הִמֹּ֥ל לָ/כֶ֖ם כָּל זָכָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/015.yaml
  text: 'Only on this condition will we agree with you: if you become like us[b][a], by circumcising every male among you.'
translation:
  language: ja
  text: ただし、あなたがたの男子が皆割礼を受けて、私たちと同じようになるなら、この条件に限って、私たちはあなたがたと合意しよう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: ただし……その条件でだけ
  rationale: אַךְの限定性とבְּזֹאתが示す条件提示を、自然な現代日本語で明確に表した。
- source_word: נֵאוֹת לָכֶם
  choice: 私たちはあなたがたに同意しよう
  rationale: ニファル形の「進んで同意する、承諾する」という意味を保ち、交渉の文脈に合う表現とした。
- source_word: אִם תִּהְיוּ כָמֹנוּ
  choice: あなたがたが私たちと同じようになるなら
  rationale: 条件節を明示し、割礼を受けることで同じ状態・慣行に入るという動的な意味を「なる」で表した。
- source_word: לְהִמֹּל לָכֶם כָּל זָכָר
  choice: あなたがたのうちの男子が皆割礼を受け
  rationale: 受動形の不定詞と分配的なכָּל זָכָרを反映し、集団に属する男子全員が対象であることを自然に示した。
