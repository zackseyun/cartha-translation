source:
  edition: WLC
  text: וַ/תֵּצֵ֤א דִינָה֙ בַּת לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְ/יַעֲקֹ֑ב לִ/רְא֖וֹת בִּ/בְנ֥וֹת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/001.yaml
  text: Dinah[a], the daughter of Leah, whom she had borne to Jacob, went out to see the daughters of the land.
translation:
  language: ja
  text: レアがヤコブに産んだ娘ディナは、その土地の娘たちを見るために出かけた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「その土地の女たちを訪ねるために」。ヘブライ語は直訳すると「その土地の娘たちを見るために」。
    reason: לִרְאוֹתの基本義「見る」を本文に保持しつつ、人々を訪ねるという文脈上可能な理解を示すため。
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: 出かけた
  rationale: יצא のカル・ワイイクトルで、外へ出て行くことを表す。場所を補わず、現代日本語として自然な「出かけた」とした。
- source_word: דִינָה
  choice: ディナ
  rationale: 人名として、一般的な日本語聖書の表記に沿って音写した。
- source_word: בַּת לֵאָה אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: レアがヤコブに産んだ娘ディナ
  rationale: 関係節がレアを先行詞とし、ディナがレアとヤコブの娘であることを示す。日本語では修飾関係が明確になるよう前置した。
- source_word: לִרְאוֹת
  choice: 会うために
  rationale: ראה の基本義は「見る」だが、人を目的語とするこの文脈では、娘たちと会う・交わるために訪ねる意味が自然である。直訳は脚注に残した。
- source_word: בִּבְנוֹת הָאָרֶץ
  choice: その土地の娘たち
  rationale: 直訳的な表現を保ちつつ、הארץ は文脈上その地方を指すため「その土地」とした。「娘たち」は地域の若い女性たちを指し得る。
