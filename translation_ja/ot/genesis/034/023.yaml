source:
  edition: WLC
  text: מִקְנֵ/הֶ֤ם וְ/קִנְיָנָ/ם֙ וְ/כָל בְּהֶמְתָּ֔/ם הֲ/ל֥וֹא לָ֖/נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָ/הֶ֔ם וְ/יֵשְׁב֖וּ אִתָּֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/023.yaml
  text: Will not their livestock[a], their property, and all their animals be ours? Only let us agree with them[b], and they will dwell with us.
translation:
  language: ja
  text: 彼らの家畜[a]も、財産も、すべての動物も、私たちのものではないか。ただ、彼らの求めに応じよう[b]。そうすれば、彼らは私たちと共に住むようになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家畜の群れ」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼らに同意しよう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֵהֶם
  choice: 彼らの家畜
  rationale: 取得・所有された群れを指す語であり、文脈上、経済的価値を持つ飼育動物全般を自然に表す。
- source_word: קִנְיָנָם
  choice: 財産
  rationale: 取得した所有物・資産を意味し、動産だけに限定せず経済的な含みを保つ。
- source_word: כָל בְּהֶמְתָּם
  choice: すべての動物
  rationale: 主に家畜を含む広い語だが、直前の「家畜」との不自然な重複を避けつつ、כָלの包括性を示す。
- source_word: הֲלוֹא לָנוּ הֵם
  choice: 私たちのものになるではないか
  rationale: 同意を期待する修辞疑問として、彼らが将来それを自分たちのものにできるという説得的な含みを表す。
- source_word: אַךְ
  choice: ただ
  rationale: ここでは条件を限定・強調し、「この一点だけ受け入れれば」という趣旨を導く。
- source_word: נֵאֹותָה לָהֶם
  choice: 彼らの申し出を受け入れよう
  rationale: ニファル形の「同意する、応じる、承諾する」という意味を、交渉の文脈に即して自然な日本語にした。
- source_word: וְיֵשְׁבוּ אִתָּנוּ
  choice: そうすれば、彼らは私たちと共に住むようになる
  rationale: 居住・定住の意味を保ち、前の勧誘に続く結果として自然に表現した。
