  text: וַ/יִּשְׁמְע֤וּ אֶל חֲמוֹר֙ וְ/אֶל שְׁכֶ֣ם בְּנ֔/וֹ כָּל יֹצְאֵ֖י שַׁ֣עַר עִיר֑/וֹ וַ/יִּמֹּ֨לוּ֙ כָּל זָכָ֔ר כָּל יֹצְאֵ֖י שַׁ֥עַר עִירֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/024.yaml
  text: And all who went out of the gate of his city listened to Hamor and to Shechem his son[a], and every male, all who went out of the gate of his city[c][b], was circumcised.
translation:
  language: ja
  text: その町の門を出入りする者は皆[a]、ハモルとその息子シェケムの言うことを聞き入れた[b]。そして、男子は皆――その町の門を出入りする者は皆――割礼を受けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼の町の門から出て行く者は皆」。町の門は公的な集会や協議の場であり、この表現は町の公的生活に参加する住民を指す。
    reason: cultural_note
  - marker: b
    text: 「耳を傾けた」とも訳せる。ここでは、提案を好意的に受け入れて応じたことを含意する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ אֶל
  choice: 言うことを聞き入れた
  rationale: 単に音を聞いたという意味ではなく、ハモルとシェケムの提案を受け入れて応じた文脈を自然な日本語で表す。「従った」ほど強く服従の意味を限定しない。
- source_word: כָּל יֹצְאֵי שַׁעַר עִירוֹ
  choice: その町の門を出入りする者は皆
  rationale: 直訳は「彼の町の門から出て行く者は皆」。町の門で公的生活に参加する町の男子を指す慣用的表現である。日本語では「出て行く者」だけだと一時的な移動に誤解されやすいため、「門を出入りする者」とし、具体的な門の表現と節内の反復を保った。
- source_word: בְּנוֹ
  choice: その息子
  rationale: シェケムがハモルの息子であることを、自然な日本語の語順で示す。
- source_word: וַיִּמֹּלוּ
  choice: 割礼を受けた
  rationale: ニファル形の受動・再帰的な意味を表す。「自分たちに割礼を施した」より自然であり、誰が施術したかは特定しない。
- source_word: כָּל זָכָר
  choice: 男子は皆
  rationale: זָכָר の性を示す意味を保持しつつ、「すべての雄」などの不自然な表現を避ける。「男は皆」よりやや格調を保った。
- source_word: שַׁעַר עִירוֹ
  choice: その町の門
  rationale: 「彼の町」は文脈上ハモルの町を指すが、日本語で「彼の町」とすると所有関係が過度に強く響くため「その町」とした。古代都市の公的空間としての門という具体的表現は残した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的ながら、物語文としての品位を保つ文体とした。ヘブライ語にある「町の門」に関する句の反復と、「男子は皆」に続く同格的な言い直しを残した。
