  text: וְ/אֶת חֲמוֹר֙ וְ/אֶת שְׁכֶ֣ם בְּנ֔/וֹ הָרְג֖וּ לְ/פִי חָ֑רֶב וַ/יִּקְח֧וּ אֶת דִּינָ֛ה מִ/בֵּ֥ית שְׁכֶ֖ם וַ/יֵּצֵֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/026.yaml
  text: They also killed Hamor and his son Shechem with the sword[a], and they took Dinah from Shechem’s house and went out.
translation:
  language: ja
  text: さらに、ハモルとその息子シェケムを剣で殺し[a]、ディナをシェケムの家から連れ出して、立ち去った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「剣の口によって」。剣で殺すことを意味するヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת חֲמוֹר וְאֶת שְׁכֶם בְּנוֹ
  choice: さらに、ハモルとその息子シェケムを
  rationale: 目的語を示す אֶת は訳出せず、前節から続く加算的な וְ を「さらに」で表した。「その息子」はヘブライ語の親子関係を自然な日本語で明示する。
- source_word: הָרְגוּ
  choice: 殺し
  rationale: הרג の直接的で標準的な意味を、現代日本語の物語文として明瞭に表す。
- source_word: לְפִי חָרֶב
  choice: 剣で
  rationale: 字義的には「剣の口によって」というヘブライ語の慣用句であり、本文では自然な日本語で手段を示し、字義は脚注に残す。
- source_word: וַיִּקְחוּ אֶת דִּינָה
  choice: ディナを…連れ出して
  rationale: לקח は広く「取る」の意だが、人を家から外へ移すこの文脈では、後続の יצא と合わせて「連れ出す」が自然である。暴力的な「奪い返す」など、原文以上の含意は加えない。
- source_word: מִבֵּית שְׁכֶם
  choice: シェケムの家から
  rationale: בַּיִת を直近の場面に即して具体的な住居と理解し、所有関係を自然な日本語で表した。
- source_word: וַיֵּצֵאוּ
  choice: 立ち去った
  rationale: יצא の「出る」という移動を示しつつ、日本語で「家から連れ出して、出て行った」と重複するのを避け、彼らがその場を去ったことを自然に表す。
