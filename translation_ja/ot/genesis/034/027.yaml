  text: בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ עַל הַ֣/חֲלָלִ֔ים וַ/יָּבֹ֖זּוּ הָ/עִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/027.yaml
  text: The sons of Jacob came upon the slain and plundered the city[c][b][a], because they had defiled their sister.
translation:
  language: ja
  text: ヤコブの息子たちは、殺された者たちのもとに来て、自分たちの妹が汚された町を略奪した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼らが自分たちの妹を汚した町」。ヘブライ語の関係節は圧縮された表現で、文脈上、「彼ら」は町の側の者たちを指すと理解される。訳文は、ヤコブの息子たちが妹を汚したとの誤解を避けるため、受動形にしている。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יַעֲקֹב
  choice: ヤコブの息子たち
  rationale: ヘブライ語の連語を明示的に訳し、物語における集団としての息子たちを示す。
- source_word: בָּאוּ עַל הַחֲלָלִים
  choice: 殺された者たちのところへ行き
  rationale: בוא על の接近・到来の意味と、חֲלָלִים が暴力によって殺された者を指すことを自然な現代日本語で表した。「襲いかかった」とすると、すでに死んでいる者への攻撃と断定しかねない。
- source_word: וַיָּבֹזּוּ הָעִיר
  choice: 町を略奪した
  rationale: בזז の戦利品を奪う意味を「略奪した」で表す。עִיר は当時の居住地について日本語では「町」が自然である。
- source_word: אֲשֶׁר
  choice: からである
  rationale: 形式上は関係詞だが、圧縮された節が略奪の理由を示す文脈上の因果関係を表した。
- source_word: טִמְּאוּ אֲחוֹתָם
  choice: 彼らの妹がそこで汚された
  rationale: טמא の道徳的・社会的な汚辱の含意を「汚された」で保ち、受動表現と「そこで」により、主節のヤコブの息子たちが加害者だという日本語上の誤読を避ける。場所との結び付きは אֲשֶׁר が受ける「町」から補われる。
theological_decisions:
- issue: 妹を汚した者の指示対象
  choice: 受動形「彼らの妹がそこで汚された」
  alternative: 「彼らがその妹を汚した」
  rationale: ヘブライ語の複数主語は文法上明示されないが、物語の文脈では町側の者たちを指す。日本語で能動形の「彼ら」を用いると、直前のヤコブの息子たちを指すと誤解されるため、行為者を明示しない受動形にした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「殺された者たち」は חֲלָלִים の暴力死を示し、「略奪した」は בזז の意味を簡潔に伝える。
