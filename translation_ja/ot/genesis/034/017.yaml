  text: But if you will not listen to us[a], to be circumcised[b], then we will take our daughter and go.
translation:
  language: ja
  text: しかし、もしあなたがたが私たちの言うこと、すなわち割礼を受けることを聞き入れないなら[a]、私たちは娘を連れて立ち去ります。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「私たちに、割礼を受けることについて聞き従わないなら」。ヘブライ語の不定詞は、「聞き入れる」べき内容、またはそれに伴って求められる行為を示すと理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם לֹא
  choice: しかし、もし……ないなら
  rationale: 接続詞を、前節の申し出と対照をなす条件として自然な日本語で表した。
- source_word: תִשְׁמְעוּ אֵלֵינוּ
  choice: 私たちの言うことを聞かない
  rationale: שׁמע＋אֶלは「耳を傾ける」「言うことを聞く」の意。ここでは従う含みを保ちつつ、過度に強い「服従する」は避けた。
- source_word: לְ/הִמּוֹל
  choice: 割礼を受けるようにとの
  rationale: 受動・再帰的な意味を「割礼を受ける」で表し、不定詞を聞き入れるべき内容として前の句に結び付けた。
- source_word: וְ/לָקַחְנוּ אֶת בִּתֵּנוּ
  choice: 私たちは娘を連れて
  rationale: 条件の帰結としての未来的意味を文全体で示した。「私たちの娘」という原文の一人称複数所有は、日本語では主語との関係から明らかなため自然に「娘」とした。
- source_word: וְ/הָלָכְנוּ
  choice: 立ち去ります
  rationale: この文脈のהלךは単なる移動より、その場を去ることを意味するため「立ち去る」とした。
