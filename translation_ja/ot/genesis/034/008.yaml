revisions:
- from: ハモルは彼らに語りかけて言った。「私の息子シェケムは、あなたがたの娘に心を引かれています。どうか彼女を息子の妻にしてください。」
  to: ハモルは彼らにこう言った。「私の息子シェケムは、あなたがたの娘を強く慕っています。どうか彼女を彼の妻として与えてください。」
  rationale: 原文の発話導入、ハモルとシェケムの親子関係、相手方に属する単数の娘、そして丁重な婚姻の申し入れを保持した。「強く慕っています」により חָשְׁקָה נַפְשׁוֹ の強い情意を自然な現代日本語で表し、「彼の妻として与えてください」により לְאִשָּׁה の授与婚姻表現を明確にした。脚注を要する未解決の曖昧さはない。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:51:02Z'
review_pass:
  verdict: revise
  source_fidelity: 概ね原文に忠実である。חָשְׁקָה נַפְשׁוֹ は強い愛着・切望を表すため、「心を引かれています」はやや弱く、より直接的に「強く慕っています」とするのが適切である。
  naturalness: 「ハモルは彼らに語りかけて言った」は不自然ではないが、叙述としては「ハモルは彼らにこう言った」が明瞭で自然である。
  terminology: 固有名詞「ハモル」「シェケム」は適切。「妻にしてください」は日本語では相手に妻となるよう求める響きもあり、原文の『彼に妻として与えよ』を明確にする「彼の妻として与えてください」がよい。
  issues:
  - severity: medium
    issue: 「心を引かれています」が חָשְׁקָה נַפְשׁוֹ の強さを弱めている。
    rationale: חשק は強く慕う、深く心を寄せるという意味であり、文脈上の求婚の申し入れにも対応する。「強く慕っています」は過度に性愛的に限定せず、強い愛着・切望を保てる。
  - severity: medium
    issue: 「彼女を息子の妻にしてください」は授与・婚姻の構文をやや曖昧にする。
    rationale: תְּנוּ ... לוֹ לְאִשָּׁה は『彼に妻として彼女を与えよ』である。「彼の妻として与えてください」により、依頼先である家族が娘を婚姻に与えるという原文の関係を保てる。
  revised_text: ハモルは彼らにこう言った。「私の息子シェケムは、あなたがたの娘を強く慕っています。どうか彼女を彼の妻として与えてください。」
