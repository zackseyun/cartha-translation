translation:
  language: ja
  text: ハモルは彼らにこう言った。「私の息子シェケムは、あなたがたの娘を強く慕っています。どうか彼女を彼の妻として与えてください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר חֲמוֹר אִתָּם לֵאמֹר
  choice: ハモルは彼らに語りかけて言った
  rationale: דבר と לאמר の組み合わせを保ちつつ、אתם は対話の相手を示すものとして、自然な現代日本語の「彼らに語りかけて」とした。
- source_word: שְׁכֶם בְּנִי
  choice: 私の息子シェケム
  rationale: 名と同格表現の関係を、明瞭で自然な日本語の語順で示した。
- source_word: חָשְׁקָה נַפְשׁוֹ בְּבִתְּכֶם
  choice: あなたがたの娘に心を引かれています
  rationale: 直訳的には「彼の魂があなたがたの娘に強く結びついている／恋い慕っている」。強い思慕や愛着を表しながら、原文が明示しない内面を過度に限定しない表現とした。
- source_word: תְּנוּ נָא אֹתָהּ לוֹ לְאִשָּׁה
  choice: どうか彼女を息子の妻にしてください
  rationale: 命令形と נא の丁重な願いを「どうか」で表し、לוֹ の指示対象を日本語で明確にするため「息子」と補った。לְאִשָּׁה は結婚させることを自然に表した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。家族全体を指す複数接尾辞は「あなたがた」とし、娘は単数なので「娘」とした。原文の強い感情表現は「心を引かれている」で自然に伝え、解釈を狭める注は設けなかった。
