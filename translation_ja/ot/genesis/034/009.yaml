  text: וְ/הִֽתְחַתְּנ֖וּ אֹתָ֑/נוּ בְּנֹֽתֵי/כֶם֙ תִּתְּנוּ לָ֔/נוּ וְ/אֶת בְּנֹתֵ֖י/נוּ תִּקְח֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/009.yaml
  text: 'Intermarry with us: give your daughters to us[b][a], and take our daughters for yourselves.'
translation:
  language: ja
  text: 私たちと互いに婚姻関係を結びなさい。あなたがたの娘たちを私たちに嫁がせ、私たちの娘たちをあなたがたの妻として迎えなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְחַתְּנוּ אֹתָנוּ
  choice: 私たちと互いに婚姻関係を結びなさい
  rationale: חתןのヒトパエル形は、双方が婚姻を通して結びつくことを表す。「互いに」を補うことで相互性を明示しつつ、現代日本語として自然で格調ある表現にした。
- source_word: בְּנֹתֵיכֶם תִּתְּנוּ לָנוּ
  choice: あなたがたの娘たちを私たちに嫁がせ
  rationale: 字義的には「娘たちを私たちに与える」だが、文脈上は結婚させる意である。日本語の「与える」は娘を物品のように扱う不自然さが強いため、婚姻の意味を正確に表す「嫁がせる」とした。
- source_word: וְאֶת בְּנֹתֵינוּ תִּקְחוּ לָכֶם
  choice: 私たちの娘たちをあなたがたの妻として迎えなさい
  rationale: לקחは字義的には「取る」だが、この文脈では妻としてめとることを指す。「妻として迎える」は婚姻の意味と、前半との相互的な対応を自然な現代日本語で示す。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、命令・勧誘の力を保った。「婚姻関係」はやや改まった語だが、家同士・集団同士の相互的な縁組を示す原文に適している。後半では日本語の自然さと意味の明確さを優先し、「与える／取る」という逐語表現を避けた。
