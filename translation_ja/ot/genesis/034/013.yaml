  text: וַ/יַּעֲנ֨וּ בְנֵֽי יַעֲקֹ֜ב אֶת שְׁכֶ֨ם וְ/אֶת חֲמ֥וֹר אָבִ֛י/ו בְּ/מִרְמָ֖ה וַ/יְדַבֵּ֑רוּ אֲשֶׁ֣ר טִמֵּ֔א אֵ֖ת דִּינָ֥ה אֲחֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/013.yaml
  text: Jacob’s sons answered Shechem and Hamor his father deceitfully and spoke[b][a], because he had defiled Dinah their sister.
translation:
  language: ja
  text: ヤコブの息子たちは、シェケムとその父ハモルに、欺いて[a]答え、語った。シェケムが自分たちの姉妹ディナを汚した[b]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「欺きをもって」。
    reason: lexical_alternative
  - marker: b
    text: ここで「汚した」とは、ディナを性的に侵害したことを指す。原文は、道徳的・祭儀的な「汚れ」を表す語を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: 答え
  rationale: 直前の申し出に対する返答を導く動詞であり、物語の流れに自然な「答え」とした。
- source_word: בְנֵי יַעֲקֹב
  choice: ヤコブの息子たち
  rationale: 属格構文を、明瞭で自然な現代日本語にした。
- source_word: בְּמִרְמָה
  choice: 欺いて
  rationale: 前置詞句「欺きによって／欺きをもって」の副詞的機能を自然に表す。単なる慎重さではなく、意図的な欺瞞を示す語義を保った。
- source_word: וַיְדַבֵּרוּ
  choice: こう語った
  rationale: 「答え」に続いて実際の発言を導く動詞として訳し、後続節へのつながりを明確にした。
- source_word: אֲשֶׁר
  choice: からである
  rationale: ここでは単純な関係節よりも、兄弟たちが欺いて応答した理由を示す因果的用法と判断した。
- source_word: טִמֵּא
  choice: 汚した
  rationale: ピエル形の「汚す、汚れたものとする」という道徳的・祭儀的な語感を保持した。文脈上は性的侵害を指すが、それだけに限定した言い換えは本文では避けた。
- source_word: אֲחֹתָם
  choice: 自分たちの姉妹
  rationale: 兄弟たちを受ける再帰的な所有関係を明確にしつつ、姉か妹かを特定しないヘブライ語の曖昧さを「姉妹」で保った。
- source_word: אֶת שְׁכֶם וְאֶת חֲמוֹר אָבִיו
  choice: シェケムとその父ハモルに
  rationale: 二人が返答の相手であり、「その父」がシェケムを基準にハモルを説明することを自然な日本語で示した。
theological_decisions:
- issue: טִמֵּא が表す性的侵害と「汚れ」の語義
  choice: 本文では「汚した」とし、注で性的侵害を指すことを示す
  alternative: 辱めた／性的に侵害した
  rationale: 文脈上の深刻な侵害を曖昧にせず説明する一方、原語が持つ道徳的・祭儀的な「汚す」という語彙領域を本文に残すため。
translation_notes:
  register: 明瞭な現代標準語を用いながら、物語本文としての品位を保った。「こう語った」により次節の直接話法への接続を示した。「姉妹」は日常語としてやや硬いが、原文が姉・妹を区別しない点を保持するために採用した。
