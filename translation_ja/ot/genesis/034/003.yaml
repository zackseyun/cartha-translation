  text: וַ/תִּדְבַּ֣ק נַפְשׁ֔/וֹ בְּ/דִינָ֖ה בַּֽת יַעֲקֹ֑ב וַ/יֶּֽאֱהַב֙ אֶת הַֽ/נַּעֲרָ֔ וַ/יְדַבֵּ֖ר עַל לֵ֥ב הַֽ/נַּעֲרָֽ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/003.yaml
  text: His soul clung to Dinah[a], the daughter of Jacob[b], and he loved the young woman and spoke to the heart of the young woman.
translation:
  language: ja
  text: 彼の心はヤコブの娘ディナに固く結びつき[a]、彼はその若い女性を愛し、その若い女性に優しく語りかけた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の魂はディナに固く結びついた」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「その若い女性の心に語った」。優しく、慰めるように、または安心させるように語ることを表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק נַפְשׁוֹ בְּדִינָה
  choice: 彼の心は……ディナに強く引きつけられ
  rationale: נפשはここでは感情や内面を表すため、現代日本語では「心」とした。דבקの、密着する・固く結びつくという強い情感を「強く引きつけられ」で自然に表した。
- source_word: בַּת יַעֲקֹב
  choice: ヤコブの娘
  rationale: ヘブライ語の同格表現を、日本語として自然な連体修飾で表した。
- source_word: וַיֶּאֱהַב
  choice: 愛し
  rationale: אהבの基本義を保ち、周辺文脈への評価を訳語自体に加えなかった。
- source_word: הַנַּעֲרָ
  choice: その若い女
  rationale: נערהの年若い女性という意味を明確にしつつ、現代標準日本語の語を用いた。
- source_word: וַיְדַבֵּר עַל לֵב הַנַּעֲרָ
  choice: 優しく語りかけた
  rationale: 字義は「その若い女の心に語った」。相手を慰める、安心させる、心を得ようとして語ることを表す慣用句として、日本語で自然な表現を採用した。
theological_decisions:
- issue: 暴行後に記されるシケムの感情表現
  choice: 本文が述べる執着、愛、語りかけをそのまま訳し、行為への弁明や美化を加えない。
  alternative: 否定的評価を訳文に明示する、または恋愛的な表現を強める。
  rationale: ヘブライ語はここで彼の内面と行動を叙述している。前後の暴力を弱めることも、この節にない道徳的評言を挿入することも避けた。
- issue: דבר על־לב の情感
  choice: 「優しく語りかけた」と慣用的意味を本文に出し、字義を脚注に残す。
  alternative: 「心に語りかけた」と字義どおりに訳す。
  rationale: 日本語の「心に語りかける」は広く訴えるという別の含みを持ち得るため、文脈上の対人的な優しい・なだめる語り方を自然に示した。ただし意図の詳細までは限定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。נפשのヘブライ語的な字義は脚注に保ち、本文では自然な「心」とした。「愛し」は原文の率直な表現を維持し、周辺文脈の暴力を美化も矮小化もしない。
