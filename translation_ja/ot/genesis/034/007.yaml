review_pass:
  verdict: revise
  source_fidelity: 全体として原文に忠実である。野から来たヤコブの息子たちの悲嘆と強い怒り、イスラエルにおける「恥ずべきこと」、およびその行為を許容しない結びが適切に表されている。ただし、最後の受動・非人称的な禁止表現は、日本語でも「行われてはならない」とするほうが、原文の表現形式と「そのような行為」への焦点をより正確に保てる。
  naturalness: 明快な現代標準語であり、「心を痛め、激しく怒った」も自然である。「野から帰って来た」は文脈上自然だが、原文は単に野から「来た」と述べる。ここでは日本語の場面描写として許容範囲である。
  terminology: 「恥ずべきこと」はנְבָלָהの道徳的非難を無理なく表す。「イスラエルの中で」は原文の時代的・共同体的な含みを説明的に限定せず保存している。「寝る」は原文の婉曲な性交表現に対応する。
  issues:
  - severity: low
    issue: 結びの禁止表現が能動的である
    rationale: וְכֵן לֹא יֵעָשֶׂה は直訳すれば「そのようには行われない／行われてはならない」という非人称的表現である。「してはならない」でも意味は通るが、「このようなことは行われてはならない」とすれば原文の焦点と形式をよりよく保てる。
  revised_text: ヤコブの息子たちは、そのことを聞くと野から帰って来た。彼らは心を痛め、激しく怒った。シェケムがヤコブの娘と寝ることによって、イスラエルの中で恥ずべきことを行ったからである。このようなことは、行われてはならない。
