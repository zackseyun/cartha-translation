source:
  edition: WLC
  text: וּ/בְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן הַ/שָּׂדֶה֙ כְּ/שָׁמְעָ֔/ם וַ/יִּֽתְעַצְּבוּ֙ הָֽ/אֲנָשִׁ֔ים וַ/יִּ֥חַר לָ/הֶ֖ם מְאֹ֑ד כִּֽי נְבָלָ֞ה עָשָׂ֣ה בְ/יִשְׂרָאֵ֗ל לִ/שְׁכַּב֙ אֶת בַּֽת יַעֲקֹ֔ב וְ/כֵ֖ן לֹ֥א יֵעָשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/007.yaml
  text: And Jacob’s sons came in from the field when they heard it, and the men were grieved and very angry, because he had done an outrageous thing in Israel by lying with Jacob’s daughter, for such a thing must not be done.
translation:
  language: ja
  text: ヤコブの息子たちは、そのことを聞くと野から帰って来た。彼らは心を痛め、激しく怒った。シェケムがヤコブの娘と寝ることによって、イスラエルの中で恥ずべきことを行ったからである。このようなことは、行われてはならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְעַצְּבוּ
  choice: 心を痛め
  rationale: この語は悲しみや苦悩を表す。続く怒りと区別しつつ、自然な現代日本語で内面的な痛みを示した。
- source_word: נְבָלָה
  choice: 恥ずべきこと
  rationale: 道徳的に許しがたい愚行・非道を指す強い非難語。ここでは過度に解釈を加えず、重大な不名誉と悪を表す訳語を選んだ。
- source_word: בְיִשְׂרָאֵל
  choice: イスラエルの中で
  rationale: 本文の共同体的表現をそのまま保った。物語上の時点との緊張を説明によって解消しない。
- source_word: לִשְׁכַּב אֶת
  choice: と寝ることによって
  rationale: 性交を意味する婉曲表現だが、原文と同様に直接的すぎない言い方を保った。
- source_word: וְכֵן לֹא יֵעָשֶׂה
  choice: このようなことは、してはならない
  rationale: 単なる慣習の記述ではなく、強い道徳的禁止を表す日本語とした。
theological_decisions:
- issue: 「イスラエル」の時代的・共同体的含意
  choice: 「イスラエルの中で」と訳し、説明を本文に加えない
  alternative: 「イスラエルの家族に対して」または後代の民族共同体への言及として明示する
  rationale: 原文には、ヤコブ個人の別名と共同体イスラエルを響かせる可能性がある。どちらかに限定せず、その緊張を保存した。
- issue: 最後の禁止表現の強さ
  choice: 「してはならない」
  alternative: 「行われることではない」
  rationale: 非人称形の原文を自然な日本語にしつつ、文脈にある規範的な強さを保った。
translation_notes:
  register: 明快で格調を失わない現代標準語。「彼ら」を補って主語を明確にし、原文の連続する感情表現を読みやすい二文に整えた。固有名シェケムは直前文脈で明らかな行為者を日本語で明示するため補った。
