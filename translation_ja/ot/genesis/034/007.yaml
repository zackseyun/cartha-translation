  to: ヤコブの息子たちは、そのことを聞くと野から帰って来た。彼らは心を痛め、激しく怒った。シェケムがヤコブの娘と寝ることによって、イスラエルの中で恥ずべきことを行ったからである。このようなことは、行われてはならない。
  rationale: 末尾のみを「行われてはならない」と改め、原文の非人称的な禁止表現をより明確に反映した。それ以外は、原文の語義、物語文脈、および英語POB監査文の「an outrageous thing」「must not be done」に十分対応しているため維持した。
