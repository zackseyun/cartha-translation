  text: וְ/לֹֽא אֵחַ֤ר הַ/נַּ֨עַר֙ לַ/עֲשׂ֣וֹת הַ/דָּבָ֔ר כִּ֥י חָפֵ֖ץ בְּ/בַֽת יַעֲקֹ֑ב וְ/ה֣וּא נִכְבָּ֔ד מִ/כֹּ֖ל בֵּ֥ית אָבִֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/019.yaml
  text: And the young man did not delay to do the thing[a], because he delighted in Jacob’s daughter[d][c][b], and he was honored above all his father’s house.
translation:
  language: ja
  text: その若者は、すぐにそのことを行った[a]。ヤコブの娘を望んでいた[b]からである。彼は、父の家のだれよりも重んじられていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「そのことを行うのを遅らせなかった」。または「そのことを行うのをためらわなかった」。
    reason: אֵחַרは基本的に「遅らせる、ためらう」の意であり、本文では文脈上の迅速な行動を自然に表した。
  - marker: b
    text: または「ヤコブの娘を気に入っていた」「ヤコブの娘を喜んでいた」。
    reason: חָפֵץは強く望むことのほか、喜びや好意を抱くことも表し得る。
lexical_decisions:
- source_word: אֵחַר
  choice: 遅らせなかった
  rationale: 動詞の基本的な時間的意味である「遅れる、ぐずぐずする」を保ち、要求された行為にすぐ応じたことを表す。
- source_word: הַנַּעַר
  choice: その若者
  rationale: 文脈上シェケムを指す。現代日本語では「少年」より年齢と立場に適し、物語の照応も明確である。
- source_word: לַעֲשׂוֹת הַדָּבָר
  choice: そのことを行う
  rationale: 直前に要求された割礼を指すヘブライ語の表現を、内容を説明しすぎず自然な日本語で保つ。
- source_word: חָפֵץ בְּבַת יַעֲקֹב
  choice: ヤコブの娘を心から望んでいた
  rationale: חפץ が表す喜び、好意、強い願望を文脈に即して表現する。「欲した」ほど露骨に性的意味へ限定せず、結婚を求める強い思いを伝える。
- source_word: נִכְבָּד מִכֹּל בֵּית אָבִיו
  choice: 父の家のだれよりも重んじられていた
  rationale: נכבד の「尊ばれる、重んじられる」と、מן による比較を明示する。「父の家」は父の世帯・一族に属する人々を指すため、「だれよりも」で比較対象を自然に示す。
theological_decisions: []
translation_notes:
  register: 明快で格調を保った現代標準日本語。「そのこと」は前節の要求を受ける表現として残し、「父の家」は聖書的な家・世帯の概念を保持しつつ、「だれよりも」で意味を明瞭にした。
