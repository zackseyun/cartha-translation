  text: וַ/יְהִי֩ בַ/יּ֨וֹם הַ/שְּׁלִישִׁ֜י בִּֽ/הְיוֹתָ֣/ם כֹּֽאֲבִ֗ים וַ/יִּקְח֣וּ שְׁנֵֽי בְנֵי יַ֠עֲקֹב שִׁמְע֨וֹן וְ/לֵוִ֜י אֲחֵ֤י דִינָה֙ אִ֣ישׁ חַרְבּ֔/וֹ וַ/יָּבֹ֥אוּ עַל הָ/עִ֖יר בֶּ֑טַח וַ/יַּֽהַרְג֖וּ כָּל זָכָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/025.yaml
  text: On the third day[a], while they were in pain, two of Jacob’s sons, Simeon and Levi, Dinah’s brothers, each took his sword, came against the city while it felt secure[b], and killed every male.
translation:
  language: ja
  text: 三日目、彼らが痛みに苦しんでいた時、ヤコブの二人の息子、ディナの兄弟であるシメオンとレビは、それぞれ剣を取り、安心していた町を襲い[a]、すべての男子を殺した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それぞれ剣を取り、安心して町を襲い」。ヘブライ語の בֶּטַח は、町が安心して警戒していなかった状態とも、襲撃者たちが安心して進んだ様子とも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: 三日目
  rationale: 物語を進める וַיְהִי は、日本語では独立して訳さず、時を示す句を前に置くことで自然かつ簡潔に表した。
- source_word: בִּהְיוֹתָם כֹּאֲבִים
  choice: 彼らが痛みに苦しんでいた時
  rationale: 同時の状況を示す不定詞構文と、痛みの状態を表す כֹּאֲבִים を明確な現代日本語で表した。割礼による痛みであることは文脈上明らかだが、本文には補わない。
- source_word: שְׁנֵי בְנֵי יַעֲקֹב
  choice: ヤコブの二人の息子
  rationale: ヤコブの息子たちのうち二人を指す構文を自然に表した。
- source_word: שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה
  choice: ディナの兄たちであるシメオンとレビ
  rationale: 同格関係とディナとの関係を明瞭に保った。日本語の「兄」は年長の男性きょうだいを示し、この二人について文脈に適合する。
- source_word: אִישׁ חַרְבּוֹ
  choice: それぞれ剣を取り
  rationale: אִישׁ の配分的用法と、各人が自分の剣を取ったことを自然な日本語で表した。
- source_word: וַיָּבֹאוּ עַל הָעִיר
  choice: 町を襲い
  rationale: בוא על がここで示す敵対的な接近を、文脈上明確な「襲う」で簡潔に表した。
- source_word: בֶּטַח
  choice: 安心しきっていた
  rationale: 主本文では、町が安全だと思って警戒していなかった状態を表すと解した。ただし、攻撃者側の進み方を修飾する可能性も脚注に残した。
- source_word: וַיַּהַרְגוּ כָּל זָכָר
  choice: 男を一人残らず殺した
  rationale: כָּל זָכָר の全称性を明確に示す。「男」は日本語で性別を指し得るため自然だが、原文の「すべての男性」を過度に年齢限定しない表現とした。
