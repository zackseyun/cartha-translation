source:
  edition: WLC
  text: הָ/אֲנָשִׁ֨ים הָ/אֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗/נוּ וְ/יֵשְׁב֤וּ בָ/אָ֨רֶץ֙ וְ/יִסְחֲר֣וּ אֹתָ֔/הּ וְ/הָ/אָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת יָדַ֖יִם לִ/פְנֵי/הֶ֑ם אֶת בְּנֹתָ/ם֙ נִקַּֽח לָ֣/נוּ לְ/נָשִׁ֔ים וְ/אֶת בְּנֹתֵ֖י/נוּ נִתֵּ֥ן לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/021.yaml
  text: These men are at peace with us[a]. Let them dwell in the land and trade in it, for, you see, the land is broad enough for them. We will take their daughters for wives for ourselves[d][c][b], and we will give our daughters to them.
translation:
  language: ja
  text: この人たちは私たちと友好関係にある[a]。彼らをこの地に住まわせ、ここで商いをさせよう[b]。見よ、この地は彼らのために十分に広い[c]。彼らの娘たちを私たちの妻に迎え、私たちの娘たちを彼らに嫁がせよう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私たちと平和な関係にある」「私たちと折り合いがよい」。
    reason: lexical_alternative
  - marker: b
    text: 「この地で」は、「この地を行き来して」とも訳せる。商業活動が地内で行われることにも、この領域を通って行われることにも解し得る。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「見よ、この地は彼らの前に広がっている」。ヘブライ語の「広い」の表現は、土地が十分に広く、彼らのための余地があることを表す慣用句。
    reason: cultural_note
lexical_decisions:
- source_word: שְׁלֵמִים הֵם אִתָּנוּ
  choice: 私たちと友好関係にある
  rationale: שְׁלֵמִים はここでは完全性そのものではなく、相手との平和で良好な関係を表す。「友好関係にある」は、親密さを過度に読み込まず、現代日本語で関係的な意味を明確に伝える。
- source_word: וְיֵשְׁבוּ
  choice: 彼らをこの地に住まわせ…よう
  rationale: 形は未完了形だが、町の人々への提案・勧奨として機能しているため、「住むだろう」ではなく許可を促す表現とした。
- source_word: וְיִסְחֲרוּ אֹתָהּ
  choice: ここで商いをさせよう
  rationale: סחר は商業活動を表す。אֹתָהּ は「この地」を指し、この地の中で、またはこの地を行き来して交易する可能性があるため、本文では自然な「ここで」を用い、幅を注で示した。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 根拠となる事実へ注意を向ける談話上の働きを保つため、簡潔で格調のある「見よ」とした。
- source_word: רַחֲבַת יָדַיִם לִפְנֵיהֶם
  choice: 彼らを受け入れるのに十分広い
  rationale: 字義的には「彼らの前に両手の広がりがある」のような表現で、土地に十分な広さ・余地があることを意味する慣用句。文脈上の含意を自然な日本語で表した。
- source_word: אֶת־בְּנֹתָם נִקַּח לָנוּ לְנָשִׁים
  choice: 彼らの娘たちを私たちの妻に迎え…よう
  rationale: 未完了形はここで共同の意向・提案を表す。לָנוּ を「私たちの」に反映し、結婚を表すヘブライ語の慣用を日本語として自然にした。
- source_word: וְאֶת־בְּנֹתֵינוּ נִתֵּן לָהֶם
  choice: 私たちの娘たちを彼らに嫁がせよう
  rationale: 直訳の「彼らに与えよう」は日本語では物扱いの響きが強いため、婚姻関係を結ばせる意味を明確にする「嫁がせよう」とした。
