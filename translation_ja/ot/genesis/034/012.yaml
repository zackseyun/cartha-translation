  text: הַרְבּ֨וּ עָלַ֤/י מְאֹד֙ מֹ֣הַר וּ/מַתָּ֔ן וְ/אֶ֨תְּנָ֔ה כַּ/אֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑/י וּ/תְנוּ לִ֥/י אֶת הַֽ/נַּעֲרָ֖ לְ/אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/012.yaml
  text: Demand from me a very large bride-price and gift[a], and I will give whatever you say to me; only give me the young woman as a wife.
translation:
  language: ja
  text: 婚資[a]と贈り物を、私にどれほど高く求めてもかまわない。あなたがたが私に言うとおりに、私は与えよう。ただ、その若い女性を私の妻として与えてほしい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「婚資」は、花婿またはその家族から花嫁側の家族へ支払われる婚姻時の金品を指す。
    reason: 「持参金」とは支払いの方向が異なる専門的な婚姻慣習語であるため。
lexical_decisions:
- source_word: הַרְבּוּ עָלַי מְאֹד
  choice: 私に求める……を、どれほど高くしてもよい
  rationale: 字義的には「私の上に大いに増しなさい」。婚姻条件として相手側が要求額を高く設定してよいという意味を、現代日本語で自然に表した。
- source_word: מֹהַר
  choice: 婚資
  rationale: 花婿またはその家族から花嫁側の家族へ支払う婚姻上の金品を指す。「持参金」では方向が逆になり得るため、より正確な「婚資」とした。
- source_word: וּמַתָּן
  choice: 贈り物
  rationale: 婚資に加えて渡す贈答品を指す一般的な語として訳した。
- source_word: וְאֶתְּנָה
  choice: 支払う
  rationale: 意志・決意を帯びる形。「与える」でもよいが、直前の婚資と贈り物を受けているため、文脈上自然な「支払う」とした。
- source_word: כַּאֲשֶׁר תֹּאמְרוּ אֵלָי
  choice: あなたがたの言うとおりに
  rationale: 相手が提示する額や条件に全面的に応じる意を、原文の開放性を保って表した。
- source_word: וּתְנוּ לִי
  choice: ただ……与えてほしい
  rationale: 接続詞は字義的には「そして」だが、ここでは支払いの申し出に続く中心的な願いを導く。日本語では「ただ」によって切実な焦点を自然に示した。
- source_word: הַנַּעֲרָ
  choice: あの若い女
  rationale: 結婚年齢の若い女性を指す。「娘」では親子関係を示す語と紛れやすいため避け、指示性を「あの」で表した。
- source_word: לְאִשָּׁה
  choice: 私の妻として
  rationale: ヘブライ語の標準的な婚姻表現を、明瞭な現代日本語にした。文脈上の「私の」を補っている。
theological_decisions: []
translation_notes:
  register: 切迫した直接話法として、明瞭で格調を失わない現代標準日本語を用いた。「婚資」はやや専門的だが、持参金との方向の違いを正確に保つため採用した。
