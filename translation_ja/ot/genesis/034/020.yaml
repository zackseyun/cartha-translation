  text: וַ/יָּבֹ֥א חֲמ֛וֹר וּ/שְׁכֶ֥ם בְּנ֖/וֹ אֶל שַׁ֣עַר עִירָ֑/ם וַֽ/יְדַבְּר֛וּ אֶל אַנְשֵׁ֥י עִירָ֖/ם לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/020.yaml
  text: So Hamor and Shechem his son came to the gate of their city and spoke to the men of their city[a], saying[b],
translation:
  language: ja
  text: ハモルとその子シェケムは、自分たちの町の門[a]へ行き、町の男たち[b]に語りかけて言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「町の門へ」。ヘブライ語は直訳すると「彼らの町の門へ」。古代の町の門は、公的な協議が行われる場所でもあった。
    reason: lexical_alternative
  - marker: b
    text: 直訳「自分たちの町の男たち」。町の門に集まり、町の事柄を協議する男性住民を指すと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 行き
  rationale: בוא は文脈上「来る」「行く」のいずれにもなり得るが、日本語では話者の視点から目的地へ向かう動作として「行き」が自然である。物語を進める接続形は「そこで」で表した。
- source_word: חֲמוֹר
  choice: ハモル
  rationale: 固有名詞として音写した。
- source_word: וּשְׁכֶם בְּנוֹ
  choice: とその息子シェケム
  rationale: 父子関係を明示しつつ、現代日本語として自然な語順にした。
- source_word: אֶל שַׁעַר עִירָם
  choice: 自分たちの町の門へ
  rationale: שַׁעַר の字義「門」と、עִירָם の所有接尾辞を保持した。ここで町の門は公的な協議の場でもある。
- source_word: וַיְדַבְּרוּ אֶל
  choice: に語りかけて
  rationale: דבר אל の、相手に向けて話すという意味を自然な日本語で表した。後続の直接話法へ滑らかにつなげるため連用形とした。
- source_word: אַנְשֵׁי עִירָם
  choice: 町の男たち
  rationale: אַנְשֵׁי の男性を指す表現を保った。この場面では、町の門で公的な協議に加わる男性住民を指すと考えられる。
- source_word: לֵאמֹר
  choice: 言った
  rationale: ヘブライ語の定型的な発話導入句を、現代日本語の物語文で自然な直接話法の導入として訳した。
