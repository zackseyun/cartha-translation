  text: וְ/אֶת כָּל חֵילָ֤/ם וְ/אֶת כָּל טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם שָׁב֖וּ וַ/יָּבֹ֑זּוּ וְ/אֵ֖ת כָּל אֲשֶׁ֥ר בַּ/בָּֽיִת־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/029.yaml
  text: They took captive all their wealth and all their little ones and their wives[c][b][a], and plundered everything that was in the house.
translation:
  language: ja
  text: 彼らは彼らの全財産を奪い、幼い子どもたち[a]を一人残らず、また妻たちを捕虜にし、家[b]にあったすべてのものを略奪した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「子どもたち」。ヘブライ語は、幼い子ども、または家に属する扶養者を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 「家」は、建物そのものだけでなく、家族や家産を含む「家全体」を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵילָם
  choice: その全財産
  rationale: חַיִלはここでは軍勢ではなく、富・資産・所有物を指す。略奪の文脈に合い、家畜だけに限定しない「全財産」とした。
- source_word: טַפָּם
  choice: 幼い子どもたち
  rationale: טַףは特に幼い子どもや家の扶養者を指し得る。本文では年少者という含みを明確にし、別訳を脚注に示した。
- source_word: נְשֵׁיהֶם
  choice: 妻たち
  rationale: אִשָּׁהは「女」と「妻」の両義があるが、所有接尾辞を伴い家族構成員が列挙されるこの箇所では「妻たち」が自然である。
- source_word: שָׁבוּ
  choice: 捕虜にし
  rationale: שָׁבָהの、人を捕らえて連れ去るという意味を明確に表すため「捕虜にし」とした。
- source_word: וַיָּבֹזּוּ
  choice: 奪い／略奪した
  rationale: בזזの戦乱に伴う略奪という強い意味を保った。日本語では目的語に応じ、財産には「奪い」、家の中のものには「略奪した」と表現した。
- source_word: כָּל אֲשֶׁר בַּבָּיִת
  choice: 家の中にあるものもすべて
  rationale: 単数形בַּבָּיִתを保ちつつ、そこにある物すべてを指す自然な日本語とした。「家」が家族・家産を含む可能性は脚注に示した。
theological_decisions:
- issue: 二つの動詞と、財産・子ども・妻から成る混合目的語との関係
  choice: 財産は「奪い」、子どもと妻は「捕虜にし」として、日本語で意味上の対応を明確にした。
  alternative: 原語の語順どおり、財産・子ども・妻を一括して「捕らえて略奪した」の目的語とする。
  rationale: ヘブライ語では混合した目的語群がשָׁבוּとוַיָּבֹזּוּの前に置かれるが、日本語でそのまま再現すると財産を「捕虜にする」ように読める。内容を増減せず、各動詞を意味上適切な対象に対応させた。神学的評価は加えていない。
translation_notes:
  register: 明快な現代標準日本語を用い、暴力的な捕囚と略奪を婉曲化しなかった。「一人残らず」はטַפָּםに付くכָּלを自然に表し、妻たちには原文上כָּלが明示されない点を保った。
