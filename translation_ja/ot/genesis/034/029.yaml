revisions:
- from: 彼らはその全財産を奪い、幼い子どもたち[a]を一人残らず妻たちとともに捕虜にし、家[b]の中にあるものもすべて略奪した。
  to: 彼らは彼らの全財産を奪い、幼い子どもたち[a]を一人残らず、また妻たちを捕虜にし、家[b]にあったすべてのものを略奪した。
  rationale: 財産については、文脈上、人に用いる「捕虜にする」と区別して「奪い」と訳し、幼い子どもたちと妻たちは並列して「捕虜にし」とした。これにより、原文の暴力的な捕囚と略奪を弱めず、日本語での目的語の対応を明瞭にする。「家にあった」として叙述時制を整えた。
