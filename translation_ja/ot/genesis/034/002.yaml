source:
  edition: WLC
  text: וַ/יַּ֨רְא אֹתָ֜/הּ שְׁכֶ֧ם בֶּן חֲמ֛וֹר הַֽ/חִוִּ֖י נְשִׂ֣יא הָ/אָ֑רֶץ וַ/יִּקַּ֥ח אֹתָ֛/הּ וַ/יִּשְׁכַּ֥ב אֹתָ֖/הּ וַ/יְעַנֶּֽ/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/002.yaml
  text: When Shechem son of Hamor the Hivite[a], the prince of the land, saw her[b], he took her and lay with her and humiliated her.
translation:
  language: ja
  text: その土地の首長であるヒビ人ハモルの子シェケムは、彼女を見ると、彼女を捕らえ、彼女と寝て、彼女を辱めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「辱めた」に当たるヘブライ語は、「苦しめる」「卑しめる」「侵害する」などの意味を持つ。ここでは強制的な性行為によって彼女を傷つけ、辱めたことを指す。「彼女を犯した」とも訳せる。
    reason: 原語の意味の幅を示しつつ、この文脈が性的暴力を表すことを明確にするため。
lexical_decisions:
- source_word: וַיַּרְא אֹתָהּ
  choice: 彼女を見ると
  rationale: ראהの基本的な物語上の意味を自然な日本語で表し、後続する行為との時間的なつながりも示した。
- source_word: שְׁכֶם בֶּן־חֲמוֹר הַחִוִּי
  choice: ヒビ人ハモルの子シェケム
  rationale: 固有名と民族名を日本語で定着している形に音写し、連語関係を明確にした。ヘブライ語の語順上、「ヒビ人」がハモルとシェケムのどちらを直接修飾するかには形態上の曖昧さがあるが、一族の民族的帰属を表す自然な日本語とした。
- source_word: נְשִׂיא הָאָרֶץ
  choice: その土地の首長
  rationale: נָשִׂיאは指導者、族長、首長などを表す。「王子」として世襲王制を過度に含意せず、地域の有力な支配者という身分を示すため「首長」とした。
- source_word: וַיִּקַּח אֹתָהּ
  choice: 彼女を捕らえ
  rationale: לקח自体の基本義は「取る」だが、日本語の「彼女を取る」は不自然で意味も曖昧になる。後続する強制的な性的侵害の文脈を踏まえ、「捕らえ」とした。ただし「連れて行き」ほど移動を明示しない。
- source_word: וַיִּשְׁכַּב אֹתָהּ
  choice: 彼女と寝て
  rationale: この構文が性交を表すことを保ちつつ、原文の婉曲的な言い方に対応する、明瞭で荘重な日本語とした。
- source_word: וַיְעַנֶּהָ
  choice: 彼女を辱めた
  rationale: ピエル形のענהが持つ「苦しめる、卑しめる、侵害する」という意味領域と、この箇所の性的暴力という文脈の両方を保つ。「犯した」より原語の屈辱・加害の含みを残し、脚注で強制性を明示した。
theological_decisions:
- issue: 性的暴力を婉曲化せず、同時に原語の意味範囲を狭めすぎない表現
  choice: 本文を「彼女を捕らえ、彼女と寝て、彼女を辱めた」とし、脚注で強制的な性的侵害であることを明示する。
  alternative: 「彼女を捕らえて強姦した」または「彼女を犯した」
  rationale: 動詞が三つ連なる原文の進行を保ち、最後のענהが表す苦痛、屈辱、侵害の重なりを一語の法的・現代的用語だけに限定しない。一方、脚注によって出来事の強制性を曖昧にしない。
translation_notes:
  register: 現代の一般読者に理解できる、簡潔で重みのある物語文とした。「首長」「辱めた」はやや格調を保つ語だが、文脈上明瞭である。
