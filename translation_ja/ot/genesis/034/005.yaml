id: GEN.34.5
reference: Genesis 34:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/יַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת דִּינָ֣ה בִתּ֔/וֹ וּ/בָנָ֛י/ו הָי֥וּ אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶ֑ה וְ/הֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד בֹּאָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/005.yaml
  text: Jacob heard that he had defiled his daughter Dinah. But his sons were with his livestock in the field[a], so Jacob kept silent until they came.
translation:
  language: ja
  text: ヤコブは、彼が娘ディナを汚した[a]ことを聞いた。しかし、息子たちはヤコブの家畜とともに野にいたので、ヤコブは彼らが来るまで黙っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「辱めた」とも訳せる。ヘブライ語の動詞は字義的には「汚した」「汚れたものにした」という意味で、ここではディナの性的な尊厳を傷つけたことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַע
  choice: 聞いた
  rationale: 知らせを耳にしたことを表す基本的な語義を、自然な物語文として訳した。
- source_word: כִּי
  choice: ことを
  rationale: ヤコブが聞いた内容を導く接続表現として訳した。
- source_word: טִמֵּא
  choice: 汚した
  rationale: ピエル形の「汚す、汚れたものにする」という語義を保ちつつ、この文脈における性的な尊厳の侵害を含意できる表現とした。
- source_word: בִתּוֹ
  choice: 娘ディナ
  rationale: 三人称男性単数の所有を日本語では文脈上自然な形で表し、固有名を続けた。
- source_word: וּבָנָיו
  choice: しかし、息子たちは
  rationale: 接続詞は、息子たちが不在だったためヤコブが待ったという物語上の対照を自然に示す「しかし」とした。
- source_word: הָיוּ אֶת מִקְנֵהוּ בַּשָּׂדֶה
  choice: ヤコブの家畜とともに野にいた
  rationale: 原文は世話をしていたと明言せず、家畜とともに野にいたことを述べるため、その範囲にとどめた。所有者は日本語で曖昧にならないよう「ヤコブの」と明示した。
- source_word: מִקְנֵהוּ
  choice: 家畜
  rationale: 牛だけに限定されない群れや飼育動物を指す広い語義に合う。
- source_word: וְהֶחֱרִשׁ
  choice: 黙っていた
  rationale: 発言や応答を控えた状態を表す使役語幹の用法を、自然で簡潔な日本語にした。
- source_word: עַד בֹּאָם
  choice: 彼らが来るまで
  rationale: 原文の「彼らが来るまで」をそのまま保ち、文脈上可能でも明示されていない「帰る」を補わなかった。
theological_decisions:
- issue: טִמֵּא が表す行為の性格
  choice: 本文では「汚した」とし、性的侵害の具体性は注で示す
  alternative: 「辱めた」「性的に汚した」
  rationale: 原語固有の「汚す／汚れたものにする」という表現を保持しつつ、通常の強姦を直接表す動詞以上に行為を限定しないため。文脈上の性的な尊厳の侵害は脚注で明らかにした。
translation_notes:
  register: 現代の一般読者に明快でありながら、物語文として落ち着いた品位を保つ文体とした。「彼」は直前の文脈に登場するシケムを指すが、この節の原文どおり固有名を補わず、代名詞のままとした。
