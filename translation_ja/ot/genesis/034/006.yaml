  text: Then Hamor, the father of Shechem, went out to Jacob to speak with him.
translation:
  language: ja
  text: その時、シェケムの父ハモルは、ヤコブと話すために彼のもとへ出て行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: その時、…出て行った
  rationale: 接続詞を伴う物語叙述の形が示す出来事の進行を「その時」で表し、יצא の方向性を「出て行った」で保った。
- source_word: חֲמוֹר
  choice: ハモル
  rationale: 人名として、現代日本語で明瞭な音写を用いた。
- source_word: אֲבִי שְׁכֶם
  choice: シェケムの父
  rationale: ヘブライ語の連語が示す父子関係を、自然で明確な日本語にした。
- source_word: אֶל יַעֲקֹב
  choice: ヤコブ…彼のもとへ
  rationale: 人物に向かう移動を表す אֶל を「彼のもとへ」とし、目的地がヤコブであることを明確にした。
- source_word: לְדַבֵּר אִתּוֹ
  choice: ヤコブと話すために
  rationale: 前置詞付き不定詞の目的を「ために」で示し、אִתּוֹ の相互的なニュアンスを「と話す」で表した。代名詞の指示対象は直前のヤコブであるため、自然な日本語として名前を明示した。
