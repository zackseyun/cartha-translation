  to: ヤコブはシメオンとレビに言った。「おまえたちは私に災いをもたらし、この地の住民、カナン人とペリジ人の間で、私を臭い者にしてしまった[a]。私は少人数しかいない。彼らは私に敵対して集まり[b]、私を討つ。そうすれば、私も私の家の者たちも滅ぼされてしまう。」
  rationale: 原文の鮮烈な「臭くする」という比喩を本文と脚注で保持しつつ、日本語として不自然な名詞句を改めた。「この地の住民」と二つの民族名の関係を過度に限定せず、将来の脅威の連鎖も条件文に固定せずに表した。世帯を表す「家」は「家の者たち」として明確にした。
