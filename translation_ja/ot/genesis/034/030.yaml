source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יַעֲקֹ֜ב אֶל שִׁמְע֣וֹן וְ/אֶל לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִ/י֒ לְ/הַבְאִישֵׁ֨/נִי֙ בְּ/יֹשֵׁ֣ב הָ/אָ֔רֶץ בַּֽ/כְּנַעֲנִ֖י וּ/בַ/פְּרִזִּ֑י וַ/אֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְ/נֶאֶסְפ֤וּ עָלַ/י֙ וְ/הִכּ֔וּ/נִי וְ/נִשְׁמַדְתִּ֖י אֲנִ֥י וּ/בֵיתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/030.yaml
  text: Then Jacob said to Simeon and Levi[a], “You have brought trouble on me, making me stink among the inhabitants of the land, among the Canaanites and the Perizzites. Since I am few in number, they will gather against me and strike me down[b], and I will be destroyed—I and my household.”
translation:
  language: ja
  text: ヤコブはシメオンとレビに言った。「おまえたちは私に災いをもたらし、この地の住民、カナン人とペリジ人の間で、私を臭い者にしてしまった[a]。私は少人数しかいない。彼らは私に敵対して集まり[b]、私を討つ。そうすれば、私も私の家の者たちも滅ぼされてしまう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私を臭くした」。ここでは、周囲の人々に忌み嫌われる者、あるいは評判の悪い者にした、という比喩。
    reason: 字義的な比喩と文脈上の意味を示すため。
  - marker: b
    text: 別訳「彼らは私に向かって集まる」。ヘブライ語の「私の上に」は、ここでは敵対して向かうことを表す。
    reason: נֶאֶסְפוּ の集合の意味と עָלַי の敵対的な含みを示すため。
lexical_decisions:
- source_word: עֲכַרְתֶּם אֹתִי
  choice: おまえたちは私に災いをもたらし
  rationale: עכרの「災い・困難をもたらす」という非難の意味を、自然で直接的な現代日本語にした。主語が複数であることも「おまえたち」で示した。
- source_word: לְהַבְאִישֵׁנִי
  choice: 私を悪臭を放つ者にしてしまった
  rationale: באשのヒフィル形が持つ「臭くする」という鮮烈な比喩を本文に残した。文脈上は、周囲から忌み嫌われる評判にしたという意味である。
- source_word: בְּיֹשֵׁב הָאָרֶץ
  choice: この地の住民…の間で
  rationale: 集合的単数の分詞を、この地に住む人々全体を指す自然な日本語で表した。
- source_word: בַּכְּנַעֲנִי וּבַפְּרִזִּי
  choice: すなわちカナン人とペリジ人の間で
  rationale: 直前の「この地の住民」を具体化する同格的な関係が明確になるよう「すなわち」を補った。前置詞の社会的な範囲は「間で」で表した。
- source_word: וַאֲנִי מְתֵי מִסְפָּר
  choice: 私の側は人数が少ない
  rationale: 字義どおりには「私は数の人々」で、勢力が少人数であることを表す慣用句。「私の側」とすることで、ヤコブ個人ではなく彼に属する一団の人数を指す意味を、過度に限定せず明確にした。
- source_word: וְנֶאֶסְפוּ עָלַי
  choice: 彼らが結集して私に向かって来て
  rationale: אסףのニファル形が示す、人々が一つに集まる意味と、עַלによる敵対的な方向性の双方を表した。
- source_word: וְהִכּוּנִי
  choice: 私を討つなら
  rationale: נכהの暴力的な「打つ、撃つ、討つ」という意味を保ち、後続する滅亡への恐れに合う「討つ」を選んだ。ヘブライ語の連続する事態は、日本語では条件関係が明瞭になるよう「なら」で結んだ。
- source_word: וְנִשְׁמַדְתִּי
  choice: 滅ぼされてしまう
  rationale: שמדの強い「滅ぼす、根絶する」という意味を保ちつつ、ヤコブの切迫した危惧を「てしまう」で自然に示した。
- source_word: אֲנִי וּבֵיתִי
  choice: 私も私の家も
  rationale: בַּיִתはここで建物ではなく、家族や従者を含む家の共同体を指す。「家」はその広がりを保ち、原文の反復も維持する。
theological_decisions: []
translation_notes:
  register: 会話文として明瞭な現代標準日本語を用いつつ、族長物語にふさわしい簡潔で重みのある調子を保った。「悪臭を放つ者」は意図的に原文の生々しい比喩を残し、脚注で慣用的意味を説明した。ヤコブの発言に含まれる自己防衛的な懸念や道徳的評価を、本文以上に補足・解釈していない。
