  text: אַךְ בְּ֠/זֹאת יֵאֹ֨תוּ לָ֤/נוּ הָ/אֲנָשִׁים֙ לָ/שֶׁ֣בֶת אִתָּ֔/נוּ לִ/הְי֖וֹת לְ/עַ֣ם אֶחָ֑ד בְּ/הִמּ֥וֹל לָ֨/נוּ֙ כָּל זָכָ֔ר כַּ/אֲשֶׁ֖ר הֵ֥ם נִמֹּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/034/022.yaml
  text: 'Only on this condition will the men agree with us[a], to dwell with us and to become one people: that every male among us be circumcised, just as they are circumcised.'
translation:
  language: ja
  text: ただし、その男たちが私たちと共に住み、一つの民となることを私たちに承諾するのは[a]、次の条件においてのみである。すなわち、彼らが割礼を受けているように、私たちのうちのすべての男子が割礼を受けることである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「同意する」「私たちに応じる」。ヘブライ語の動詞は、同意または進んで応じることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ בְּזֹאת
  choice: ただし……ただこの条件による
  rationale: אַךְの限定の力と、בְּזֹאתが条件を導入する機能を、自然な現代日本語で明示した。
- source_word: יֵאֹתוּ לָנוּ
  choice: 私たちと……ことに同意する
  rationale: נפעל形の動詞が表す同意・承諾を文脈に即して「同意する」とした。לָנוּは日本語では関係全体の中に自然に組み込んだ。
- source_word: הָאֲנָשִׁים
  choice: 彼ら
  rationale: 直訳は「その男たち」だが、直後にも「彼ら」があり、文脈上の指示対象が明らかなため、自然な日本語として代名詞で表した。
- source_word: לָשֶׁבֶת אִתָּנוּ
  choice: 私たちと共に住み
  rationale: 共住・定住を表す語義を保ちつつ、現代日本語として自然な表現にした。
- source_word: לִהְיוֹת לְעַם אֶחָד
  choice: 一つの民となる
  rationale: 社会集団として一体になる結果的意味を保ち、「国民」ではなく氏族的文脈に合う「民」を用いた。
- source_word: בְּהִמּוֹל לָנוּ כָּל זָכָר
  choice: 私たちの男子も皆、割礼を受けること
  rationale: בְּ付き不定詞の条件的用法を「こと」として示し、זָכָרは成人男性に限定されないため「男子」とした。「も」は比較対象との対応を日本語で自然に示す。
- source_word: כַּאֲשֶׁר הֵם נִמֹּלִים
  choice: 彼らが割礼を受けているように
  rationale: 比較の力と、彼らが割礼済みである状態を表す受動的表現を保持した。
