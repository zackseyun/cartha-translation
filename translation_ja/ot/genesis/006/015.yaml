  text: וְ/זֶ֕ה אֲשֶׁ֥ר תַּֽעֲשֶׂ֖ה אֹתָ֑/הּ שְׁלֹ֧שׁ מֵא֣וֹת אַמָּ֗ה אֹ֚רֶךְ הַ/תֵּבָ֔ה חֲמִשִּׁ֤ים אַמָּה֙ רָחְבָּ֔/הּ וּ/שְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/015.yaml
  text: 'And this is how you shall make it: the length of the ark shall be three hundred cubits[a], its width fifty cubits, and its height thirty cubits.'
translation:
  language: ja
  text: 箱舟は次のように造りなさい。箱舟の長さは三百キュビト[a]、幅は五十キュビト、高さは三十キュビトとする。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: キュビトは古代の長さの単位で、ひじから指先までの長さを基準とした。
    reason: 古代の尺度について読者に必要な文化的背景を示すため。
lexical_decisions:
- source_word: וְזֶה אֲשֶׁר תַּעֲשֶׂה אֹתָהּ
  choice: 箱舟は次のように造りなさい
  rationale: 直訳的には「そして、これがあなたがそれを造るところのもの」だが、文脈上は造り方の指定を導入する命令であるため、現代日本語で自然かつ明確な指示として訳した。目的語の女性形は箱舟を指すので、文頭に「箱舟は」を補った。
- source_word: שְׁלֹשׁ מֵאוֹת אַמָּה
  choice: 三百キュビト
  rationale: 古代の尺度を現代の単位に換算せず、原文の具体性を保った。「アンマ」では一般読者に伝わりにくいため、聖書翻訳で定着している「キュビト」を用いた。
- source_word: אֹרֶךְ הַתֵּבָה
  choice: 箱舟の長さ
  rationale: אֹרֶךְ は寸法の「長さ」、תֵּבָה はこの文脈でノアが造る「箱舟」を指す。
- source_word: רָחְבָּהּ
  choice: 幅
  rationale: 接尾辞は箱舟を指す。「その幅」とも訳せるが、日本語では並列された寸法の中で所有関係が明らかなため、簡潔に「幅」とした。
- source_word: קוֹמָתָהּ
  choice: 高さ
  rationale: קוֹמָה は人については「背丈」も意味するが、建造物の寸法を述べる本節では「高さ」が適切である。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令は「造りなさい」、各寸法の規定は「とする」とし、神の具体的な建造指示として自然に読める形にした。
