id: GEN.6.22
reference: Genesis 6:22
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֖עַשׂ נֹ֑חַ כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֥ה אֹת֛/וֹ אֱלֹהִ֖ים כֵּ֥ן עָשָֽׂה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/022.yaml
  text: Thus Noah did[a]; according to all that God commanded him[b], so he did.
translation:
  language: ja
  text: ノアはそのようにした。神が彼に命じたすべてのとおりに、そのようにした。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「した」という動詞を繰り返して、ノアが命じられたとおりに行ったことを強調している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: した……した
  rationale: עשהは広く「する／造る」を意味する。ここでは直前までの神の指示に対するノアの行動全体を要約しているため「した」とし、原文の反復も保った。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で定着している人名表記。
- source_word: כְּכֹל אֲשֶׁר
  choice: すべてのとおりに
  rationale: 命じられた事柄の全体に、余すところなく合致したことを表す構文なので、「すべて」と比較・一致の意味をともに保持した。
- source_word: צִוָּה
  choice: 命じた
  rationale: 権威をもって命令する意味を表し、神の指示の性格を自然に伝える。
- source_word: אֹתוֹ
  choice: 彼に
  rationale: 原文では直接目的語標識に三人称男性単数接尾辞が付き、命令を受けたノアを指す。日本語では「命じる」の相手を「彼に」とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、ここでは単数動詞を伴い、唯一の神を指す。
- source_word: כֵּן
  choice: そのように
  rationale: 先行する命令内容との正確な一致を受け直して強調する語であり、「そのように」が簡潔で自然。
theological_decisions:
- issue: ノアの従順を示す動詞の反復をどう訳すか
  choice: 「した……そのようにした」と二度訳す
  alternative: 「ノアは神が命じたすべてのとおりにした」と一文にまとめる
  rationale: 原文はעשהを節の初めと終わりで反復し、ノアが命令どおりに行動したことを強調する。一文に整理せず反復を残すことで、解釈を付加せず原文の力点を伝える。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「そのようにした」の反復によって原文の簡潔さと強調を保った。
