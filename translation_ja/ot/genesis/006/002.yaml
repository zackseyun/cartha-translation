  text: וַ/יִּרְא֤וּ בְנֵי הָֽ/אֱלֹהִים֙ אֶת בְּנ֣וֹת הָֽ/אָדָ֔ם כִּ֥י טֹבֹ֖ת הֵ֑נָּה וַ/יִּקְח֤וּ לָ/הֶם֙ נָשִׁ֔ים מִ/כֹּ֖ל אֲשֶׁ֥ר בָּחָֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/002.yaml
  text: the sons of God saw that the daughters of man were beautiful[b][a], and they took wives for themselves from any they chose.
translation:
  language: ja
  text: 神の子ら[a]は、人の娘たちが美しい[b]のを見て、自分たちが選んだ者はだれでも妻とした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神的存在たち」。ここでいう「神の子ら」がだれを指すかについては、天上の存在、人間の支配者、セツの系統などの解釈がある。
    reason: alternative_reading
  - marker: b
    text: 別訳「好ましい」。ここでは外見の美しさを表すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי הָאֱלֹהִים
  choice: 神の子ら
  rationale: ヘブライ語の構文を素直に反映し、その正体が天上の存在、人間の支配者、セツの系統のいずれであるかを本文で決めない表現とした。
- source_word: בְּנוֹת הָאָדָם
  choice: 人の娘たち
  rationale: 集合的な אָדָם を「人」と訳し、「神の子ら」との文学的な対照を保った。
- source_word: כִּי טֹבֹת הֵנָּה
  choice: 美しい
  rationale: טוֹב の文脈上の意味は、妻を選ぶ動機となった外見上の魅力を指すと考えられるため、自然で明瞭な日本語とした。
- source_word: וַיִּקְחוּ לָהֶם נָשִׁים
  choice: 自分たちの妻にした
  rationale: לקח と נָשִׁים の結びつきを婚姻の意味に取り、לָהֶם の再帰的な要素を「自分たちの」で保持した。
- source_word: מִכֹּל אֲשֶׁר בָּחָרוּ
  choice: 自分たちが選んだ者を、だれでも
  rationale: 選択に制限がなかったことを示す מִכֹּל の分配的な意味を、自然な現代日本語で表した。
theological_decisions:
- issue: 「神の子ら」の正体
  choice: 本文では「神の子ら」とし、正体を特定しない。
  alternative: 天上の存在、人間の支配者、またはセツの系統と明示する。
  rationale: この語句の指示対象は解釈上争われており、節自体は決着をつけていないため、曖昧さと神学的緊張を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「妻にした」は原文の簡潔で直接的な叙述を保ち、「迎えた」などによって行為を穏やかに解釈し直すことを避けた。
