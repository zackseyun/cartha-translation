  text: וַ/יִּנָּ֣חֶם יְהוָ֔ה כִּֽי עָשָׂ֥ה אֶת הָֽ/אָדָ֖ם בָּ/אָ֑רֶץ וַ/יִּתְעַצֵּ֖ב אֶל לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/006.yaml
  text: And Yahweh regretted having made man on the earth[c][b][a], and he was pained in his heart.
translation:
  language: ja
  text: '創世記 6:6


    ヤハウェは、地上に人[a]を造ったことを悔やまれ[b]、心を痛められた[c]。


    [a] 「人類」または「人間」とも訳せる。ここでのヘブライ語「アダム」は、人類全体を集合的に指す。


    [b] 「造ったことを悲しまれ」とも訳せる。ヘブライ語の動詞は、以前にしたことを振り返って悔やむこと、またはそれを悲しむことを表す。この語自体は、神が予想外のことに驚いたこと、将来を知らなかったこと、あるいは道徳的な過ちを犯したことを意味しない。


    [c] 直訳に近くは「ご自身の心に痛みを覚えられた」。深い内面的な痛みを表す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人類」または「人間」とも訳せる。ここでのヘブライ語「アダム」は、人類全体を集合的に指す。
    reason: lexical_alternative
  - marker: b
    text: 「造ったことを悲しまれ」とも訳せる。ヘブライ語の動詞は、以前にしたことを振り返って悔やむこと、またはそれを悲しむことを表す。この語自体は、神が予想外のことに驚いたこと、将来を知らなかったこと、あるいは道徳的な過ちを犯したことを意味しない。
    reason: lexical_alternative
  - marker: c
    text: 直訳に近くは「ご自身の心に痛みを覚えられた」。深い内面的な痛みを表す。
    reason: previous_rendering
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: 悔やみ
  rationale: ニファル形に、過去の行為を示す כִּי 節が続いており、以前にしたことへの回顧的な悔いまたは悲しみを表す。後続の וַיִּתְעַצֵּב が感情的な痛みを担うため、二つの動詞を訳し分けた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を、一般に推定される発音に基づいて固有名として示した。
- source_word: כִּי עָשָׂה
  choice: 造ったことを
  rationale: כִּי は悔やんだ内容を導き、עָשָׂה は先行する創造行為を指す。日本語では名詞節にして自然に表した。
- source_word: הָאָדָם
  choice: 人
  rationale: ここでは個人としてのアダムだけでなく、人類を集合的に指す。「人」は文脈上その代表的・集合的意味を保てる。
- source_word: בָּאָרֶץ
  choice: 地上に
  rationale: 特定の土地ではなく、世界としての地を指す文脈であり、日本語では「地上に」が自然である。
- source_word: וַיִּתְעַצֵּב
  choice: 心を痛められた
  rationale: ヒトパエル形が表す内面的な苦痛を自然な日本語で示し、先行する「悔やみ」と区別した。
- source_word: אֶל־לִבּוֹ
  choice: 心を
  rationale: 前置詞 אֶל を伴う表現は、痛みが心の内に深く及ぶことを示す。逐語的な「心に」より、日本語の慣用表現「心を痛める」が意味を明瞭に伝える。
theological_decisions:
- issue: 神についての擬人的・感情的表現
  choice: 神が人を造ったことを「悔やみ」、心を痛めたという本文の直接的な表現を保持する。
  alternative: 「悲しまれた」「思い直された」など、回顧的な悔いを弱める表現。
  rationale: 本文は נחם と עצב という二つの動詞によって、以前の行為への悔いと内面的な痛みを述べるが、それが神の予知とどう関係するかは説明しない。その神学的緊張を訳文で解消せず、必要な限定は脚注に置いた。
- issue: הָאָדָם の集合的意味
  choice: 「人」と訳し、人類全体を指すことを脚注で明示する。
  alternative: 「人類」「人間」。
  rationale: 文脈は人類全体を扱う。「人」は原語の代表的・集合的な用法を簡潔に保ち、脚注が誤解を防ぐ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神名は「ヤハウェ」とし、神を主語とする述語には敬意を帯びた「られた」を用いた。「悔やみ／心を痛められた」により、原文の二段構造と厳粛な調子を保った。
