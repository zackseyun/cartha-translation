lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 使役形の ילד は、ここでは父親として子を得たことを表す。「もうけた」は父系の系譜という文脈に自然で、古風すぎず、単なる「いた」より原語の出生の含意を保つ。
- source_word: שְׁלֹשָׁה בָנִים
  choice: 三人の息子
  rationale: בָנִים はここでは、続いて名を挙げられる男性の子らを指すため、「子ども」ではなく「息子」とした。
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: セム、ハム、ヤフェト
  rationale: אֶת は三人を目的語として示す標識であり、日本語では反復せず、同格の列挙として自然に表した。固有名は日本語聖書で広く通用する形を用いた。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語で定着しているヘブライ語人名の表記を用いた。
