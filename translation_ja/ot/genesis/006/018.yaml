base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/018.yaml
  text: But I will establish my covenant with you[a], and you shall enter the ark—you, your sons, your wife, and your sons’ wives with you.
translation:
  language: ja
  text: しかし、わたしはあなたと契約を立てる[a]。あなたは、あなたの息子たち、あなたの妻、息子たちの妻たちと共に、箱舟に入りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしはあなたとの契約を確かなものとする」。ヘブライ語の動詞は、契約を立てることと、契約を確立・確認することの、どちらの意味にもなり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: しかし、わたしは……立てる
  rationale: ヒフィル形の קום は契約について「立てる／確立する」または「確かなものとする」と解し得る。本文では将来の約束として自然な「契約を立てる」を採用し、直前の滅びの宣告との対照を「しかし」で表した。
- source_word: בְּרִיתִי
  choice: わたしの契約
  rationale: בְּרִית の標準的かつ文脈に適した訳語であり、聖書全体における用語上の連続性も保つ。
- source_word: אִתָּךְ
  choice: あなたと／あなたと一緒に
  rationale: 最初は契約関係を「あなたと」で、末尾は同行を自然な日本語の「あなたと一緒に」で表した。
- source_word: וּבָאתָ
  choice: 入りなさい
  rationale: בוא は「来る／行く／入る」を意味し、箱舟を目的地とするこの文脈では「入る」が最も明確。文脈上の神の指示を自然な命令表現にした。
- source_word: הַתֵּבָה
  choice: 箱舟
  rationale: ノア物語の תֵּבָה に定着した、明確で文脈に即した日本語訳。
- source_word: אַתָּה
  choice: あなたと
  rationale: 動詞に含まれる主語を独立代名詞が強調しているため、同行者の列挙の先頭に明示した。
- source_word: וּבָנֶיךָ
  choice: あなたの息子たち
  rationale: בָּנִים はここでは具体的に「息子たち」を指し、「子どもたち」と一般化しない。
- source_word: וְאִשְׁתְּךָ
  choice: あなたの妻
  rationale: 家族関係を表す直接的で自然な訳。
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: 息子たちの妻
  rationale: 原文の構造「あなたの息子たちの妻たち」を自然な日本語で表し、「嫁」のような関係語への言い換えを避けた。
theological_decisions:
- issue: 契約表現が新たな制定を指すか、既存の約束の確認を指すか
  choice: わたしはあなたと契約を立てる
  alternative: わたしはあなたとの契約を確かなものとする
  rationale: הקים ברית は契約を成立させる意味にも、すでにある契約を確立・確認する意味にもなり得る。この節だけでは広い神学的問題を決着できないため、本文には標準的な表現を置き、別の可能性を脚注に残した。
translation_notes:
  register: 現代標準日本語による、明快で品位のある文体。「あなたと」を重ねる原文の構造は保ちつつ、長い一文を二文に分けて自然にした。命令文は過度に古風な「入れ」ではなく「入りなさい」とした。
