  naturalness: 「箱舟に連れて入り」は現代日本語ではやや不自然であるため、「箱舟の中に連れて来て」とする。「あなたとともに生き延びさせなさい」は、保存の目的と「あなたとともに」を自然に表す。
  terminology: 「箱舟」「雄と雌」は適切である。「肉なるもの」は原文の『すべての肉』を保つが、現代語として分かりにくいため脚注を当該語に付す。「生き物」の代替として「生きているもの」を示す脚注も適切である。
