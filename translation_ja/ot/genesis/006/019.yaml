base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/019.yaml
  text: And from every living thing of all flesh[a], you shall bring two of each into the ark to keep them alive with you[b]; they shall be male and female.
translation:
  language: ja
  text: また、すべての肉なるもの[b]、すなわちあらゆる生き物[a]の中から、それぞれ二匹を箱舟の中に連れて来て、あなたとともに生き延びさせなさい。それらは雄と雌でなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生きているもの」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「肉なるもの」は、肉体を持つ生き物を広く指すヘブライ語の表現。
    reason: cultural_note
lexical_decisions:
- source_word: וּמִכָּל הַחַי מִכָּל בָּשָׂר
  choice: また、すべて肉なるもののうち、あらゆる生き物から
  rationale: 接続詞と二重の מִכָּל の関係を保ちつつ、「肉なるもの」を修飾範囲、「生き物」をそこから選ばれる対象として自然な日本語にした。
- source_word: הַחַי
  choice: 生き物
  rationale: 名詞的に用いられた「生きているもの」を、対象を過度に限定しない現代日本語で表した。
- source_word: מִכָּל בָּשָׂר
  choice: すべて肉なるもののうち
  rationale: בָּשָׂר の具体的な「肉」という比喩的・集合的表現を残しながら、この文脈では肉体を持つ生き物を指すことが伝わる形にした。
- source_word: שְׁנַיִם מִכֹּל
  choice: それぞれ二匹ずつ
  rationale: 各種類から二個体という配分的な意味を明確にした。動物を指す文脈に合わせて助数詞「匹」を用いた。
- source_word: תָּבִיא אֶל הַתֵּבָה
  choice: 箱舟に連れて入り
  rationale: 使役形の「来させる／持って来る」と、箱舟内部への移動を自然な日本語で示した。「箱舟」はこの文脈で定着した תֵּבָה の訳語。
- source_word: לְהַחֲיֹת אִתָּךְ
  choice: あなたとともに生かしておきなさい
  rationale: 使役不定詞の「生きさせる、命を保つ」という目的と、אִתָּךְ の同伴を明示した。
- source_word: זָכָר וּנְקֵבָה יִהְיוּ
  choice: それらは雄と雌でなければならない
  rationale: 雄と雌という組み合わせの要件を保ち、指示文脈における未完了形の規定的な力を自然な日本語で表した。
