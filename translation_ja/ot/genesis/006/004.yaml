id: GEN.6.4
reference: Genesis 6:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הַ/נְּפִלִ֞ים הָי֣וּ בָ/אָרֶץ֮ בַּ/יָּמִ֣ים הָ/הֵם֒ וְ/גַ֣ם אַֽחֲרֵי כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽ/אֱלֹהִים֙ אֶל בְּנ֣וֹת הָֽ/אָדָ֔ם וְ/יָלְד֖וּ לָ/הֶ֑ם הֵ֧מָּה הַ/גִּבֹּרִ֛ים אֲשֶׁ֥ר מֵ/עוֹלָ֖ם אַנְשֵׁ֥י הַ/שֵּֽׁם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/004.yaml
  text: The Nephilim were on the earth in those days—and also afterward—when the sons of God came in to the daughters of man[a], and they bore children to them. Those were the mighty men who were of old[c][b], men of renown.
translation:
  language: ja
  text: ネフィリム[a]はそのころ地上にいた。またその後にも、神の子ら[b]が人の娘たち[c]のもとに入り、娘たちが彼らに子どもを産んだときに、地上にいた。彼らは、昔からの勇士たち、名高い者たちであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 伝統的に「巨人」とも訳される。「ネフィリム」はまれなヘブライ語で、正確な意味は不明である。
    reason: alternative_reading
  - marker: b
    text: 「神の子ら」は、「神的存在」と理解することもできる。人間の支配者、またはセツの敬虔な家系を指すとする解釈もある。
    reason: alternative_reading
  - marker: c
    text: 「人」はここでは集合的な意味で、人類を指す。したがって「人の娘たち」とは人間の女性たちのことである。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִלִים
  choice: ネフィリム
  rationale: 語義が不確かで、「巨人」や「堕ちた者」と訳すと特定の解釈に限定されるため、音写した。
- source_word: בָאָרֶץ
  choice: 地上に
  rationale: 原初史の文脈では、特定の土地よりも広く「地上」を指すと読むのが自然である。
- source_word: וְגַם אַחֲרֵי כֵן
  choice: その後にもいた
  rationale: 「また」と「その後」の双方の意味を保ちつつ、日本語で前文とのつながりを明確にした。
- source_word: אֲשֶׁר יָבֹאוּ ... אֶל
  choice: …のもとに入り
  rationale: 性的関係を含意するヘブライ語の婉曲表現を、露骨な説明に置き換えず保持した。
- source_word: בְּנֵי הָאֱלֹהִים
  choice: 神の子ら
  rationale: 神的存在、支配者、セツの敬虔な系統などの争われる解釈のいずれにも決めず、原文に近い表現を保った。
- source_word: בְּנוֹת הָאָדָם
  choice: 人の娘たち
  rationale: אָדָםの集合的な「人類、人」の意味を自然な日本語で表した。
- source_word: וְיָלְדוּ לָהֶם
  choice: 娘たちが彼らに子どもを産んだ
  rationale: 原文で省略される目的語「子ども」を日本語として必要な範囲で補い、与格的な関係も保った。
- source_word: הַגִּבֹּרִים
  choice: 勇士たち
  rationale: 力ある男性を指す語であり、軍人だけに狭めず、また道徳的な英雄として理想化しすぎない、文脈に適した語を選んだ。
- source_word: מֵעוֹלָם
  choice: 昔からの
  rationale: この文脈での古い時代からの存在という意味を、簡潔で自然な日本語にした。
- source_word: אַנְשֵׁי הַשֵּׁם
  choice: 名の知れた者たち
  rationale: 直訳的な「名の人々」ではなく、名声・評判を表す慣用的意味を明瞭に伝えた。
theological_decisions:
- issue: 「神の子ら」の正体
  choice: 本文では「神の子ら」とし、解釈を確定しない。
  alternative: 神的存在、天使的存在、人間の支配者、セツの敬虔な家系
  rationale: 文脈だけでは正体が明確に確定できないため、原文の神学的緊張と曖昧さを保持した。
- issue: ネフィリムの意味
  choice: 本文では「ネフィリム」と音写する。
  alternative: 巨人、堕ちた者
  rationale: 稀な語で正確な意味と語源が争われているため、一つの伝統的理解を本文に持ち込まないようにした。
- issue: 「人の娘たち」におけるאָדָם
  choice: 集合的な意味で「人」と訳す。
  alternative: 人類の娘たち、人間の女たち
  rationale: 単数集合名詞としての形を反映しながら、女性たちを指すことが自然に理解できる表現とした。
- issue: הֵמָּהが指す対象
  choice: 「彼ら」として直前の結びつきから生まれた者たちを指す形にした。
  alternative: ネフィリムを指す、または両者を同一視する
  rationale: ヘブライ語の指示関係には議論の余地があるため、文法上自然な連結を採りつつ、ネフィリムとの厳密な同一性を説明的に断定しなかった。
translation_notes:
  register: 現代の一般読者に理解できる、明瞭で品位ある物語文とした。「来る」に相当する婉曲表現は「もとに入る」として原文の含意を保ち、「ネフィリム」「神の子ら」は解釈を本文で固定しない。
