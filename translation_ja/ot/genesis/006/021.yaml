  yaml_path: translation/ot/genesis/006/021.yaml
  text: And you[a], take for yourself some of every kind of food that is edible, and gather it to yourself[b]; and it shall be food for you and for them.
translation:
  language: ja
  text: あなたは、食べることのできるあらゆる種類の食物[a]を取り、自分のもとに集めなさい。それは、あなたと彼らが食べるための食物となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「食べられるすべての食物」。文脈上、食用に適した食物を指すと理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח לְךָ
  choice: 取って
  rationale: 命令形קַחの直接性を「取って」で保つ。לְךָの受益・再帰的な意味は、後続の「自分のもとに」と日本語の文脈によって十分に伝わるため、重複する「自分のために」は加えない。
- source_word: מִכָּל מַאֲכָל
  choice: あらゆる種類の食物
  rationale: 食物全量ではなく、食料となるものの全範囲から集める意味を自然に表す。「食べ物」よりやや格調があり、保存する糧にも適した「食物」とした。
- source_word: אֲשֶׁר יֵאָכֵל
  choice: 食べることのできる
  rationale: אכלのニファル形は字義的には「食べられる／食べられている」だが、ここでは食用に適するものを限定する関係節と理解した。可能と慣常の含みは注で保持する。
- source_word: וְאָסַפְתָּ אֵלֶיךָ
  choice: 自分のもとに集めなさい
  rationale: אָסַףの「集める」とאֵלֶיךָの方向性を明示しつつ、現代日本語として自然な命令文にした。「蓄えなさい」も文脈には合うが、原語により近い「集めなさい」を採用した。
- source_word: וְהָיָה לְךָ וְלָהֶם לְאָכְלָה
  choice: それは、あなたと彼らの食物となる
  rationale: וְהָיָהの結果・未来の意味を「となる」で表し、לְךָ וְלָהֶםのノアと動物の区別を保った。לְאָכְלָהは直訳的な「食べるためのもの」より自然な「食物」とした。
