source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים לְ/נֹ֗חַ קֵ֤ץ כָּל בָּשָׂר֙ בָּ֣א לְ/פָנַ֔/י כִּֽי מָלְאָ֥ה הָ/אָ֛רֶץ חָמָ֖ס מִ/פְּנֵי/הֶ֑ם וְ/הִנְ/נִ֥י מַשְׁחִיתָ֖/ם אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/013.yaml
  text: Then God said to Noah[a], “The end of all flesh has come before me, for the earth is filled with violence because of them. And behold[d][c][b], I am about to destroy them with the earth.”
translation:
  language: ja
  text: 神はノアに言われた。「すべての肉なるものの終わりが、わたしの前に来た。地は彼らのゆえに暴力で満ちている。見よ、わたしは彼らを地もろとも滅ぼそうとしている。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は直訳すると「わたしは彼らを地とともに滅ぼす」。また、「彼らと地を滅ぼす」とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: קֵץ כָּל־בָּשָׂר
  choice: すべて肉なるものの終わり
  rationale: קֵץ の終結の意味と、כָּל־בָּשָׂר の広い範囲を保つ。「肉なるもの」は人間だけに限定せず、洪水物語における生き物全般への響きを残す。
- source_word: בָּא לְפָנַי
  choice: わたしの前に来た
  rationale: 神のもとに裁きの案件として至ったという司法的含意を持つヘブライ語の比喩を、そのまま理解可能な日本語で保つ。
- source_word: מָלְאָה הָאָרֶץ חָמָס
  choice: 地は暴虐で満ちている
  rationale: חָמָס は暴力、不法、残虐な行為を表す。「暴虐」は物理的暴力と不正の双方を含み、荘重ながら現代日本語でも理解できる。הָאָרֶץ は洪水物語の広い射程を踏まえて「地」とした。
- source_word: מִפְּנֵיהֶם
  choice: 彼らのゆえに
  rationale: ここでは原因を示す用法。「彼らのゆえに」は因果関係を明確にしつつ、本文の格調を保つ。
- source_word: וְהִנְנִי
  choice: 見よ、わたしは
  rationale: 話者自身を強く提示する指示的・強調的表現を「見よ」で保つ。後続の分詞が持つ切迫性は「滅ぼそうとしている」で表した。
- source_word: מַשְׁחִיתָם
  choice: 彼らを滅ぼそうとしている
  rationale: שׁחת のヒフィルは、この裁きの文脈では「滅ぼす」が適切。進行・切迫した行為を示す分詞を「しようとしている」で表す。
- source_word: אֶת־הָאָרֶץ
  choice: 地もろとも
  rationale: すでに接尾代名詞を目的語に取る動詞の後の אֶת־הָאָרֶץ は構文上解釈が分かれる。「地もろとも」は、地を手段と誤解させず、彼らと地がともに滅びの対象となる主要な理解を自然に表す。別解は脚注に示した。
theological_decisions:
- issue: 「すべて肉なるもの」の範囲
  choice: 人間に限定せず、生き物を広く含みうる表現を保持する
  alternative: 全人類
  rationale: 洪水物語における כָּל־בָּשָׂר は通常、人間より広い範囲を持つため、訳文で狭めない。
- issue: הָאָרֶץ の範囲
  choice: 地
  alternative: 土地
  rationale: 洪水物語の普遍的な枠組みに合い、「土地」という局地的な印象を避ける。
- issue: אֶת־הָאָרֶץ の統語的関係
  choice: 彼らとともに地も滅ぼされる
  alternative: 地を用いて彼らを滅ぼす／彼らと地を二つの直接目的語として滅ぼす
  rationale: 原文の構文は難解である。「地もろとも」は主要な共伴解釈を明瞭に示す一方、道具的意味を避ける。真正な曖昧さは脚注で明示する。
translation_notes:
  register: 神の裁きの宣告にふさわしい簡潔で荘重な現代標準日本語。「肉なるもの」「暴虐」は聖書的な響きを保ちながら文脈から理解できる表現とした。脚注記号は該当文末に置いた。
