  text: וַ/יֹּ֣אמֶר יְהוָ֗ה אֶמְחֶ֨ה אֶת הָ/אָדָ֤ם אֲשֶׁר בָּרָ֨אתִי֙ מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה מֵֽ/אָדָם֙ עַד בְּהֵמָ֔ה עַד רֶ֖מֶשׂ וְ/עַד ע֣וֹף הַ/שָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/007.yaml
  text: So Yahweh said[a], “I will blot out man, whom I have created[c], from the face of the ground—from man to livestock to creeping things and to the birds of the heavens—for I regret that I have made them[b].”
translation:
  language: ja
  text: そこで主は言われた。「わたしが造った人を、地の表から、人から家畜、地を這うもの、空の鳥に至るまで消し去ろう。わたしは彼らを造ったことを悔やんでいるからだ[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「悔やんでいる」は、「悲しんでいる」「造ったことを残念に思っている」とも訳せる。ヘブライ語は、以前の行為を振り返る後悔や深い悲しみを表すが、それ自体は、神が予想外の事態に驚いたこと、先を知らなかったこと、または道徳的な誤りを犯したことを意味しない。
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神名YHWHを、現代日本語の聖書文体で広く理解される「主」と訳した。固有名であることは必要に応じて注記できるが、この節では本文の自然さと威厳を優先した。
- source_word: אֶמְחֶה
  choice: 消し去ろう
  rationale: מחהが持つ、表面から拭い去るように存在を除く具体的な像を保ち、「地の面から」と自然につながるようにした。
- source_word: הָאָדָם
  choice: 人
  rationale: ここでは集合的に人類を指すが、後続の同語との反復も保てる簡潔な日本語として「人」を選んだ。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 地の面から
  rationale: אֲדָמָהを「地」とし、פניの空間的な比喩を「面」で保持した。
- source_word: בְּהֵמָה
  choice: 家畜
  rationale: 大型の陸生動物、とりわけ家畜を表す語として文脈に即した現代語を選んだ。
- source_word: רֶמֶשׂ
  choice: 地を這うもの
  rationale: 移動の仕方を表す語の具体性を保ちつつ、現代の読者に分かりやすくした。
- source_word: עוֹף הַשָּׁמָיִם
  choice: 空の鳥
  rationale: ヘブライ語の属格表現を自然な日本語にし、שמיםをこの文脈では「空」とした。
- source_word: נִחַמְתִּי
  choice: 悔やんでいる
  rationale: 過去の行為を振り返る後悔・悲嘆を表すNifal形の緊張を保持する。単なる感情的悲しみに狭めず、また神の無知や道徳的過失を訳文へ付加しない。
- source_word: כִּי עֲשִׂיתִם
  choice: 彼らを造ったことを
  rationale: 男性複数接尾辞を、直前に列挙された被造物全体を受ける「彼ら」として明示した。
theological_decisions:
- issue: 神について語られるנחםの意味
  choice: わたしは彼らを造ったことを悔やんでいる
  alternative: わたしは彼らを造ったことを悲しんでいる
  rationale: 原文は神が以前の行為を振り返って悔やむ、または深く心を痛めることを語る。神学的緊張を解消せず「悔やむ」を本文に置きつつ、その語だけでは驚き、予知の欠如、道徳的誤りまで意味しないことを注で示した。
- issue: הָאָדָםの集合的用法
  choice: 人
  alternative: 人類
  rationale: 集合的意味を含みながら、同じ語が列挙の冒頭で反復される構造を日本語でも保つため「人」とした。
translation_notes:
  register: 明瞭で威厳のある現代標準日本語。神の直接話法は簡潔にし、原文の段階的な列挙と「地の面から」という具体的な像を保った。本文中の脚注記号[a]は該当する「悔やんでいる」に結び付けた。
