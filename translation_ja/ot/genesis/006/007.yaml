revisions:
- from: そこで主は言われた。「わたしが造った人を地の面から消し去ろう。人から家畜、地を這うもの、空の鳥に至るまで。わたしは彼らを造ったことを悔やんでいるからだ[a]。」
  to: そこで主は言われた。「わたしが造った人を、地の表から、人から家畜、地を這うもの、空の鳥に至るまで消し去ろう。わたしは彼らを造ったことを悔やんでいるからだ[a]。」
  rationale: 列挙を主動詞「消し去ろう」に文法的に接続し、原文の対象範囲と段階的列挙を保った。「地の面」を自然な「地の表」に改めた以外、語義判断および神学的に慎重な脚注は維持した。
