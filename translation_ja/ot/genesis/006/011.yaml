source:
  edition: WLC
  text: וַ/תִּשָּׁחֵ֥ת הָ/אָ֖רֶץ לִ/פְנֵ֣י הָֽ/אֱלֹהִ֑ים וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ חָמָֽס׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/011.yaml
  text: The earth was corrupt before God[a], and the earth was filled with violence.
translation:
  language: ja
  text: 地は神の前に[a]堕落していた。地は暴虐で満ちていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「神の目には」。
    reason: לִפְנֵיは「前に、御前に」のほか、神の評価との関係を表して「目には」とも訳せるため。
lexical_decisions:
- source_word: וַתִּשָּׁחֵת
  choice: 堕落し
  rationale: שׁחתのニファル形が表す、損なわれ腐敗した状態を文脈に即して道徳的な「堕落」とした。物理的な「滅び」や「破壊」と断定せず、物語の進行に合う自然な連用形で表した。
- source_word: הָאָרֶץ
  choice: 地
  rationale: אֶרֶץは「地」「大地」「土地」の幅を持つ。洪水物語における広い範囲を保ちつつ、日本語で過度に範囲を限定しない「地」を選び、原文どおり二度の言及も保持した。
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: 神の前で
  rationale: לִפְנֵיの基本的な空間・関係的表現を保つ訳。「神の目に」は神の評価という意味を明示するため、脚注の別訳とした。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 統語と文脈上、唯一の神を指すため、標準的な単数の「神」とした。
- source_word: וַתִּמָּלֵא
  choice: 満ちていた
  rationale: מלאのニファル形が示す、満たされた結果状態を自然な日本語で表した。
- source_word: חָמָס
  choice: 暴虐
  rationale: חָמָסが含む暴力、残虐行為、不正の広がりを一語で保つ。「暴力」よりやや広く、本文の深刻さにも適する。
- source_word: וַ
  choice: し
  rationale: 継続する物語接続を、日本語で不自然な文頭の「さて」などを補わず、節を結ぶ連用形で表した。
theological_decisions:
- issue: 地の腐敗の性質
  choice: 人間社会の道徳的腐敗を背景とする「堕落」
  alternative: 地そのものの物理的な荒廃・破壊
  rationale: 直前直後の文脈は人間の悪と暴虐を強調しているため、道徳的腐敗を表す訳が適切。ただし、本文の主語が「地」であることはそのまま保持し、人間だけに明示的に置き換えてはいない。
- issue: 神との関係を表す לִפְנֵי
  choice: 神の前で
  alternative: 神の目に
  rationale: 原文に近い関係表現を本文に置き、神による評価を明確にする解釈的な表現は脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、創世記の叙述にふさわしい簡潔で荘重な調子を保った。「暴虐」は日常語の「暴力」より広く、暴力的な不正も含み得る語として採用した。
