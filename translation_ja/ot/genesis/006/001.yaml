  text: וַֽ/יְהִי֙ כִּֽי הֵחֵ֣ל הָֽ/אָדָ֔ם לָ/רֹ֖ב עַל פְּנֵ֣י הָֽ/אֲדָמָ֑ה וּ/בָנ֖וֹת יֻלְּד֥וּ לָ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/001.yaml
  text: And it happened[a], when man began to multiply on the face of the ground, and daughters were born to them,
translation:
  language: ja
  text: さて、人が地の表に増え始め、娘たちが彼らに生まれたとき、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: さて、…とき
  rationale: 物語の新たな展開を導く構文。日本語では「そして、…ということが起こった」と逐語的にせず、「さて、…とき」とすることで、談話機能と時間関係を自然に表した。
- source_word: הֵחֵל
  choice: 始め
  rationale: この構文では「始める」を意味する。後続の不定詞 לָרֹב と合わせて「増え始め」とした。
- source_word: הָאָדָם
  choice: 人
  rationale: 個人としてのアダムではなく、人類を集合的に指す。日本語の「人」は単数形の外形と総称的意味の両方を簡潔に保てる。
- source_word: לָרֹב
  choice: 増え
  rationale: 人口が数の上で多くなることを表す。現代日本語では「増える」が自然で明瞭。
- source_word: עַל פְּנֵי הָאֲדָמָה
  choice: 地の面に
  rationale: עַל־פְּנֵי の「表面に」という像を「面」で保ち、הָאֲדָמָה は広義の世界よりも地面・土地を指すため「地」とした。
- source_word: וּבָנוֹת
  choice: 娘たちが
  rationale: 次節につながる焦点を保ち、自然な日本語で複数を明示した。
- source_word: יֻלְּדוּ לָהֶם
  choice: 彼らに…生まれた
  rationale: ילד の受動形と、帰属・関係を示す לָהֶם を自然な日本語で表現した。「彼ら」は集合的な「人」を受ける。
theological_decisions:
- issue: הָאָדָם の総称的用法
  choice: 人
  alternative: 人類
  rationale: ここでは一人の男性や個人としてのアダムではなく、人間全体を集合的に指す。「人」は原文の単数形の表現を保ちながら、日本語で総称として自然に理解できるため採用した。
- issue: וַיְהִי כִּי の統語関係
  choice: さて、…とき
  alternative: そして、…ということが起こった
  rationale: 出来事の発生を独立して強調するより、人口増加と娘たちの誕生を次節の主要展開の時的背景として提示する構文と判断した。節が次節へ続く緊張を保つため文末を「とき、」とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文が次節へ続く従属節であることを反映し、読点で終えた。「地の面」はやや文語的だが、ヘブライ語の表面という比喩を保ちつつ一般読者にも理解可能。
