id: GEN.6.5
reference: Genesis 6:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֣רְא יְהוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָ/אָדָ֖ם בָּ/אָ֑רֶץ וְ/כָל יֵ֨צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔/וֹ רַ֥ק רַ֖ע כָּל הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/005.yaml
  text: And Yahweh saw that the wickedness of man was great on the earth[b][a], and that every inclination of the thoughts of his heart was only evil all the day.
translation:
  language: ja
  text: 主[a]は、地上で人の悪が甚だしく、人の心に思い巡らすことのすべての傾きが、いつもただ悪であるのをご覧になった。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主」に当たるヘブライ語は、神の固有名であるיהוה（一般に「ヤハウェ」）。
    reason: 本文で用いた慣用表記に対し、原文の神名を明示するため。
  - marker: b
    text: 「いつもただ悪である」は、直訳すると「一日中、ただ悪であった」。
    reason: רַק רַע כָּל הַיּוֹםの限定と継続を示す字義的な別訳を示すため。
lexical_decisions:
- source_word: וַיַּרְא
  choice: ご覧になった
  rationale: 物語を進める叙述形。日本語では文末の「ご覧になった」によって自然に表し、神への敬意も保った。
- source_word: יְהוָה
  choice: 主
  rationale: 日本語聖書で定着した神名の代替表記を用いた。原文が固有名יהוהであることは脚注に示した。
- source_word: רַבָּה רָעַת הָאָדָם
  choice: 人の悪が増し
  rationale: רבהは悪の規模・甚だしさを表す。「増し」は洪水前の悪の拡大を自然な日本語で示す。האדםはここでは人類を集合的に指す。
- source_word: בָּאָרֶץ
  choice: 地上に
  rationale: 原初史の文脈では特定の土地ではなく、広く地上を指す。
- source_word: יֵצֶר מַחְשְׁבֹת לִבּוֹ
  choice: その心に思い描くこと
  rationale: יצרは形づくられる思念・企ての方向性を含む。「心」を残しつつ、日本語として理解しやすく表した。
- source_word: רַק רַע כָּל הַיּוֹם
  choice: いつも悪に傾いている
  rationale: 字義は「一日中、ただ悪」で、継続性と限定を強く表す。自然な日本語でその意味を伝えた。
theological_decisions:
- issue: 神名יהוהの表記
  choice: 主
  alternative: ヤハウェ
  rationale: 本文では日本語聖書の一般的で敬虔な慣用に従い「主」とし、固有名であることを脚注で透明に示した。
- issue: האדםの集合的意味
  choice: 人
  alternative: 人類
  rationale: 簡潔な原文表現を保ちつつ、この箇所では個人ではなく人類全体を指す集合名詞として理解した。
- issue: רק רע כל היוםの強い限定
  choice: いつも悪に傾いている
  alternative: 一日中、ただ悪であった
  rationale: 原文の絶対的な響きを弱めすぎない一方、「思い描くこと」と自然につながる日本語にした。字義的表現は脚注に残した。
translation_notes:
  register: 明瞭で現代的だが、聖書本文としての品位を保つ文体。「心」を保持して、思考・意志・願望を含むヘブライ語的な内面観を残した。
