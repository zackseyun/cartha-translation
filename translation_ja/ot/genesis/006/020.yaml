  text: מֵ/הָ/ע֣וֹף לְ/מִינֵ֗/הוּ וּ/מִן הַ/בְּהֵמָה֙ לְ/מִינָ֔/הּ מִ/כֹּ֛ל רֶ֥מֶשׂ הָֽ/אֲדָמָ֖ה לְ/מִינֵ֑/הוּ שְׁנַ֧יִם מִ/כֹּ֛ל יָבֹ֥אוּ אֵלֶ֖י/ךָ לְ/הַֽחֲיֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/020.yaml
  text: From the birds according to their kinds[a], and from the livestock according to their kinds, from every creeping thing of the ground according to its kind, two of each will come to you to keep them alive.
translation:
  language: ja
  text: 鳥はその種類ごとに、家畜はその種類ごとに、また地面を這うすべてのものはその種類ごとに、それぞれ二匹ずつ、命を保つためにあなたのところへ来る。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעוֹף
  choice: 鳥
  rationale: 飛ぶ生き物を指す語だが、この動物分類の文脈では、現代日本語として自然で明確な「鳥」とした。
- source_word: לְמִינֵהוּ / לְמִינָהּ
  choice: その種類ごとに
  rationale: מיןの分類上の意味と、前置詞לְの配分的な働きを表す。「種」は現代生物学の厳密な分類階級を連想させうるため、「種類」を用いた。
- source_word: הַבְּהֵמָה
  choice: 家畜
  rationale: 鳥や地面を這うものと並ぶ陸上動物の区分であり、ここでは特に飼育される動物の類を表す語として「家畜」が明確で自然である。
- source_word: רֶמֶשׂ הָאֲדָמָה
  choice: 地面を這うすべてのもの
  rationale: רמשׂは這う、または地表を動き回る小動物を指し、האדמהはこの文脈で「地面」とした。日本語では所属を示すより「地面を這う」と動作で表すほうが自然である。
- source_word: שְׁנַיִם מִכֹּל
  choice: それぞれ二匹ずつ
  rationale: 先に挙げた各種類から二匹という配分的な意味を自然な日本語で明示した。動物を数える一般的な助数詞として「匹」を用いた。
- source_word: יָבֹאוּ אֵלֶיךָ
  choice: あなたのところへ来る
  rationale: ノアのもとへの移動をそのまま表し、箱舟に「入る」という文脈上の含意は本文に追加しなかった。
- source_word: לְהַחֲיוֹת
  choice: 命を保つために
  rationale: חיהのヒフィル形が表す「生かしておく、生命を保存する」という目的を、簡潔で自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、三つの動物区分の反復と、各種類から二匹という配分を保った。「来る」という能動表現も原文どおり維持し、誰が連れて来るかは補足していない。
