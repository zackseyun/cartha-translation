base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/016.yaml
  text: You shall make a roof for the ark[a], and finish it to within a cubit from above. And you shall set the ark’s door in its side. You shall make it with lower, second[d][c][b], and third levels.
translation:
  language: ja
  text: 箱舟に屋根[a]を造り、上部は一キュビトに仕上げなさい[b]。箱舟の戸口をその側面に設け、箱舟を下層、第二層、第三層の三層に造りなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「窓」または「明かり取り」とも訳せる。ヘブライ語はまれな語で、屋根全体ではなく、光を入れる開口部を指す可能性もある。
    reason: lexical_alternative
  - marker: b
    text: この箇所のヘブライ語は解釈が難しい。箱舟の上部を一キュビトの幅に狭めて仕上げる、または上端近くの一キュビトに関する施工を指す可能性がある。
    reason: textual_or_syntactic_difficulty
  - marker: c
    text: 「下段、二段目、三段目」または「下の階、二階、三階」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹהַר
  choice: 屋根
  rationale: この語はまれで正確な意味には議論があるが、続く上部の施工指示とのつながりから、箱舟上部の構造を指す「屋根」とした。「窓」「明かり取り」の可能性は脚注に残した。
- source_word: וְאֶל־אַמָּה תְּכַלֶנָּה מִלְמַעְלָה
  choice: 上部は一キュビトに仕上げなさい
  rationale: 「仕上げる」を意味する動詞と「一キュビトへ」「上から／上部で」という要素を簡潔に反映した。構文が難解で、具体的な形状やどの寸法を指すかは明示しない。
- source_word: פֶּתַח
  choice: 戸口
  rationale: 出入りのための開口部を指す文脈なので、現代日本語として自然で、扉そのものとも区別できる「戸口」とした。
- source_word: בְּצִדָּהּ
  choice: その側面に
  rationale: 箱舟の側部に戸口を設けるという位置関係を自然に表す。
- source_word: תַּחְתִּיִּם שְׁנִיִּם וּשְׁלִשִׁים
  choice: 下段、二段目、三段目
  rationale: 三つの層を表す語列として理解し、船舶に限定されすぎる「甲板」ではなく、中立的で分かりやすい「段」を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭で威厳のある現代標準日本語。「箱舟」は日本語聖書で広く定着した語として保持した。命令表現は「造り／設け／造りなさい」で整え、原文の建築上の曖昧さは本文と脚注で保った。
