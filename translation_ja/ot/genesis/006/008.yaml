  text: וְ/נֹ֕חַ מָ֥צָא חֵ֖ן בְּ/עֵינֵ֥י יְהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/008.yaml
  text: But Noah found favor in the eyes of Yahweh[a].
translation:
  language: ja
  text: しかし、ノアはヤハウェの目に好意[a]を得た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「しかし、ノアはヤハウェの目に恵みを得た。」
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נֹחַ
  choice: しかし、ノアは
  rationale: 接続詞 וְ は通常「そして」だが、ここでは直前の人類への裁きとの対照を示すため、自然な日本語の「しかし」とした。
- source_word: מָצָא
  choice: 得た
  rationale: 基本義は「見いだす」だが、「（人の）目に恵みを得る」は日本語として自然で、原文の慣用表現を保てる。
- source_word: חֵן
  choice: 恵み
  rationale: 「好意、恩恵、恵み」を表す。神から与えられる好意を簡潔かつ格調ある現代日本語で示すため「恵み」としたが、後代の教理的意味に限定しない。
- source_word: בְּ/עֵינֵי
  choice: の目に
  rationale: 原文の身体的比喩を保ち、「その方から見て、み前で」という慣用的意味を伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名 יהוה を称号に置き換えず、一般的な日本語音写で示した。
theological_decisions:
- issue: חֵן が表すノアに対する神の態度
  choice: 恵み
  alternative: 好意
  rationale: 神の無償の好意を含み得る語義を保ちつつ、救恩論上の後代の定式に意味を限定しない。「好意」も可能であるため脚注に示した。
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを読者に示すため、称号「主」ではなく音写した。
translation_notes:
  register: 簡潔で格調ある現代標準日本語。「ヤハウェの目に」という原文の比喩を残しつつ、「恵みを得た」として日本語の自然さを確保した。
