language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה לֹֽא יָד֨וֹן רוּחִ֤/י בָֽ/אָדָם֙ לְ/עֹלָ֔ם בְּ/שַׁ/גַּ֖ם ה֣וּא בָשָׂ֑ר וְ/הָי֣וּ יָמָ֔י/ו מֵאָ֥ה וְ/עֶשְׂרִ֖ים שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/003.yaml
  text: Then Yahweh said[a], “My Spirit will not contend with man forever, for he is flesh[c][b]; therefore his days will be one hundred and twenty years.”
translation:
  language: ja
  text: そこでヤハウェは言われた。「わたしの霊は、いつまでも人と争うことはない[a]。人は肉であるからだ[b]。それゆえ、人の日々は百二十年となる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わたしの霊は人のうちにいつまでもとどまらない」とも訳せる。ヘブライ語の動詞は難解で、「争う」のほか「とどまる」「宿る」などと解される。
    reason: alternative_reading
  - marker: b
    text: 「彼もまた肉であるからだ」とも訳せる。ここで「人」は、ヘブライ語アダムの総称的な単数形で、人類を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: יָדוֹן
  choice: 争う
  rationale: 語義には「とどまる」「宿る」などの異説があるが、ここでは神の霊が人と対抗し続けるという解釈を本文に採用し、不確実性を脚注に残した。
- source_word: רוּחִי
  choice: わたしの霊
  rationale: 神である話者の所有表現を保ち、「息」と限定せず、旧約本文が持つ神学的な広がりを維持した。
- source_word: בָאָדָם
  choice: 人と
  rationale: יָדוֹןを「争う」と解したため、前置詞בを自然な日本語の相手格「と」で表した。אָדָםは人類を代表する集合的・総称的単数である。
- source_word: לְעֹלָם
  choice: いつまでも
  rationale: この文脈における継続の無限定性を、明瞭で自然な現代日本語で表した。
- source_word: בְּשַׁגַּם הוּא בָשָׂר
  choice: 人は肉にすぎないからである
  rationale: 稀な接続表現を原因として理解した。「肉」は原語の人間論的含意を保ち、「にすぎない」によってここでの強調を自然に表した。
- source_word: וְהָיוּ יָמָיו
  choice: それゆえ、人の日々は……となる
  rationale: 接続詞וְ自体は広い用法を持つが、文脈上の帰結関係を日本語で明示した。「日々」は比喩を保ちつつ生存期間を指す。
- source_word: מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: 百二十年
  rationale: 数値を日本語聖書本文として自然な漢数字で示した。
theological_decisions:
- issue: 神の「霊」と人との関係
  choice: 「わたしの霊」とし、神の霊が人と争うという読みを本文に置く
  alternative: 「わたしの霊は人のうちにいつまでもとどまらない」または「わたしの息」
  rationale: רוּחַは霊・息・風を意味し得るが、神の一人称所有形は「神の霊」という理解に適する。ただしיָדוֹןの難解さにより関係性は確定できないため、別解を脚注に示した。
- issue: אָדָםの範囲
  choice: 総称的な「人」
  alternative: 「人類」
  rationale: ヘブライ語の単数形と代表的用法を保ちながら、日本語で男女を含む人間一般として自然に読める表現を選んだ。
- issue: 百二十年の意味
  choice: 解釈を加えず「人の日々は百二十年」と訳す
  alternative: 個人の寿命の上限、または洪水までの猶予期間と明示する
  rationale: 本文だけでは、寿命の制限か洪水までの期間かが確定しないため、その神学的・時間的曖昧さを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発言としての荘重さを保った。「肉」「人の日々」など原文の重要な比喩は残し、難解な動詞と百二十年の解釈は断定しなかった。
