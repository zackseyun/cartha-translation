  text: וַ/אֲנִ֗י הִנְ/נִי֩ מֵבִ֨יא אֶת הַ/מַּבּ֥וּל מַ֨יִם֙ עַל הָ/אָ֔רֶץ לְ/שַׁחֵ֣ת כָּל בָּשָׂ֗ר אֲשֶׁר בּ/וֹ֙ ר֣וּחַ חַיִּ֔ים מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר בָּ/אָ֖רֶץ יִגְוָֽע־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/017.yaml
  text: And I—behold[a], I am bringing the flood of waters upon the earth to destroy all flesh in which is the breath of life from under heaven. Everything that is on the earth will perish.
translation:
  language: ja
  text: 「見よ、わたしは洪水を地上にもたらし、天の下にいる、命の息[a]をもつすべての生き物を滅ぼす。地上にあるものはすべて息絶える。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「命の霊」。ヘブライ語の「ルーアハ」は、「息」「風」「霊」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: 見よ、このわたしが
  rationale: 独立代名詞による主語の強調と、הִנְנִי の厳粛な注意喚起を、自然で格調ある現代日本語で一体的に表した。
- source_word: מֵבִיא
  choice: もたらし
  rationale: 分詞が示す目前の確実な行為を文脈の流れに沿って表す。「もたらそうとしている」ほど推量的な含みは加えない。
- source_word: הַמַּבּוּל מַיִם
  choice: 洪水
  rationale: מַבּוּל は創世記の大洪水を指し、מַיִם はその水による性質を明示する。日本語では「水の洪水」は冗長なため、明瞭で定着した「洪水」とした。
- source_word: עַל הָאָרֶץ
  choice: 地上に
  rationale: 洪水が及ぶ領域を自然に示し、後半の בָּאָרֶץ とも呼応させた。
- source_word: לְשַׁחֵת
  choice: 滅ぼす
  rationale: 目的を表す不定詞であり、包括的な裁きによる破壊を厳粛かつ直接的に伝える。
- source_word: כָּל בָּשָׂר
  choice: すべての肉なるもの
  rationale: 「すべての肉」という聖書的表現を保ちつつ、日本語で生き物全般を指すことが伝わる形にした。
- source_word: אֲשֶׁר בּוֹ רוּחַ חַיִּים
  choice: 命の息が宿る
  rationale: רוּחַ の基本的な多義性を踏まえ、この文脈では生き物を生かす息として訳した。「宿る」により直訳調を和らげながら内在の関係を保った。
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: 天の下から
  rationale: 起点を示す מִן を保持し、天の下の領域から一掃される包括的範囲を表した。
- source_word: כֹּל אֲשֶׁר בָּאָרֶץ
  choice: 地上にあるものはすべて
  rationale: 総括的・包括的な力を自然な日本語語順で再現した。
- source_word: יִגְוָע
  choice: 息絶える
  rationale: 単なる消滅ではなく、死ぬ、息を引き取ることを表す動詞の具体性と厳粛さを保った。
theological_decisions:
- issue: רוּחַ חַיִּים における רוּחַ の意味
  choice: 命の息
  alternative: 命の霊
  rationale: 洪水物語では、生き物を生かす呼吸・生命力を指す読みが最も自然で、創世記の創造語彙とも響き合う。一方で「霊」の可能性も語義上存在するため脚注に残し、特定の人間論へ狭めない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の厳粛な宣告にふさわしい格調を保った。「見よ」「肉なるもの」「息絶える」によって原文の強調と荘重さを再現し、過度に古風な語法は避けた。
