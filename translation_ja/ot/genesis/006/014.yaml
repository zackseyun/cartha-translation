id: GEN.6.14
reference: Genesis 6:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עֲשֵׂ֤ה לְ/ךָ֙ תֵּבַ֣ת עֲצֵי גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת הַ/תֵּבָ֑ה וְ/כָֽפַרְתָּ֥ אֹתָ֛/הּ מִ/בַּ֥יִת וּ/מִ/ח֖וּץ בַּ/כֹּֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/014.yaml
  text: Make yourself an ark of gopher wood[a]; make rooms in the ark[c][b], and cover it inside and outside with pitch.
translation:
  language: ja
  text: 自分のために、ゴフェルの木[a]で箱舟を造りなさい。箱舟の中には小部屋[b]を造り、内側と外側を瀝青で塗りなさい[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「糸杉」とも訳される。ヘブライ語の「ゴフェル」はここにしか現れず、正確な樹種は分からない。
    reason: lexical_alternative
  - marker: b
    text: 「区画」とも訳せる。直訳は「巣」。
    reason: lexical_alternative
  - marker: c
    text: 「瀝青で覆いなさい」または「瀝青で密封しなさい」とも訳せる。原文では、「塗る（覆う）」という動詞と塗る物質を表す名詞に、同じ語根の語が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: 自分のために……造りなさい
  rationale: 命令形と לְךָ の受益的な意味を自然な現代日本語で表した。
- source_word: תֵּבַת
  choice: 箱舟
  rationale: 一般の船を指す語とは異なる箱状の容器・舟を表し、創世記6～9章で定着した日本語表現と文脈上の連続性を保つ。
- source_word: עֲצֵי גֹפֶר
  choice: ゴフェルの木
  rationale: גֹפֶר は聖書中ここにしか現れず、樹種を確定できないため、特定の樹種名を推測せず音写した。
- source_word: קִנִּים
  choice: 小部屋
  rationale: 字義的には「巣」の複数形だが、ここでは箱舟内部を仕切った空間を指す。「小部屋」は建造物としての意味を平明に伝える。
- source_word: וְכָפַרְתָּ
  choice: 塗りなさい
  rationale: この非祭儀的文脈では、表面を被覆材で覆うことを意味する。目的を「防水する」と明示せず、原文の動作を保った。
- source_word: בַּכֹּפֶר
  choice: 瀝青で
  rationale: 箱舟の内外を被覆する物質を指す。「瀝青」はタールや天然アスファルトに近い物質を幅を残して表せる。
- source_word: מִבַּיִת וּמִחוּץ
  choice: 内側と外側
  rationale: 対になった前置詞句を簡潔で自然な日本語にした。
- source_word: קִנִּים תַּעֲשֶׂה אֶת־הַתֵּבָה
  choice: 箱舟の中には小部屋を造り
  rationale: 語順どおりでは不自然になるため、内部に区画を設ける意味が明確になるよう統語を整えた。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「箱舟」は定着した聖書語として保持し、希少語 גֹפֶר は不確実性を損なわないよう音写した。「瀝青」はやや専門的だが物質を過度に特定せず、脚注で動詞との語根上の関連と訳語の幅を示した。
