source:
  edition: WLC
  text: אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּ/דֹֽרֹתָ֑י/ו אֶת הָֽ/אֱלֹהִ֖ים הִֽתְהַלֶּךְ נֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/009.yaml
  text: These are the generations of Noah. Noah was a righteous man[a], blameless in his generation. Noah walked with God.
translation:
  language: ja
  text: これはノアの歴史である。ノアは正しい人であり、その世代にあって、非のない人であった[a]。ノアは神とともに歩んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼の諸世代において」。または「同時代の人々の中で」「その時代に」。
    reason: 原文の複数形と、時代を指すか同時代人との比較を指すかという解釈上の幅を示すため。
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת נֹחַ
  choice: これはノアの歴史である
  rationale: תּוֹלְדֹת は創世記の区分を示す重要語で、系譜だけでなく、その人物に続く歴史・記録も指し得る。この箇所では物語が続くため、現代日本語として自然で見出し的な働きも保つ「歴史」とした。
- source_word: אִישׁ צַדִּיק
  choice: 正しい人
  rationale: צַדִּיק の倫理的・神学的な重みを保ちつつ、現代日本語で明瞭に表した。אִישׁ はノア個人を指すため「人」とした。
- source_word: תָּמִים
  choice: 非の打ちどころがなかった
  rationale: 人格の完全性・誠実さを表す語であり、絶対的な無罪や罪のなさを断定しない表現とした。
- source_word: בְּדֹרֹתָיו
  choice: その世代にあって
  rationale: 「彼の諸世代において」という形を背景に持ち、時代を指すのか同時代人との比較を指すのかという曖昧さをある程度保てる自然な日本語とした。複数形と別解は脚注に示した。
- source_word: אֶת הָאֱלֹהִים הִתְהַלֶּךְ
  choice: 神とともに歩んだ
  rationale: 神との関係の中で生きたことを示すヘブライ語の比喩を保持し、創世記内の語句の連関も見えるようにした。
theological_decisions:
- issue: תָּמִים がノアについて表す意味
  choice: 人格の誠実さを示す「非の打ちどころがなかった」
  alternative: 「完全であった」「傷がなかった」
  rationale: 堕落した同時代との対比におけるノアの高潔さを表しつつ、本文が必ずしも要求しない絶対的な無罪性を持ち込まないため。
- issue: בְּדֹרֹתָיו の範囲と比較の含意
  choice: 「その世代にあって」とし、曖昧さを残す
  alternative: 「同時代の人々の中で」「その時代に」「彼の諸世代において」
  rationale: 原文は複数形で、ノアの生きた時代を指すとも、同時代人の中での評価を指すとも理解できる。本文で一つに限定せず、脚注で形と別解を示した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で荘重な叙述調とした。「歩んだ」という聖書的比喩は説明語に置き換えず保持した。
