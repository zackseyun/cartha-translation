  text: וַ/יַּ֧רְא אֱלֹהִ֛ים אֶת הָ/אָ֖רֶץ וְ/הִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי הִשְׁחִ֧ית כָּל בָּשָׂ֛ר אֶת דַּרְכּ֖/וֹ עַל הָ/אָֽרֶץ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/006/012.yaml
  text: And God saw the earth[a], and behold, it was corrupted[b], because all flesh had corrupted its way on the earth.
translation:
  language: ja
  text: 神は地をご覧になった。見よ、地は損なわれていた[a]。すべての肉なるものが、地上で自らの道を損なっていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「腐敗していた」または「荒廃していた」とも訳せる。ヘブライ語は、道徳的な腐敗と、損壊・荒廃の両方を表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: ご覧になると
  rationale: ראהの基本義「見る」を保ちつつ、神を主語とする現代日本語として自然な敬意表現にした。後続のוְהִנֵּהと結び、見た結果に注意を向ける流れを表す。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この文脈では唯一の神を指すため、標準的な「神」とした。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 洪水物語の広い範囲を保ち、「土地」と狭く限定しない。「地」は荘重さを保ちながら現代日本語でも理解できる。
- source_word: וְהִנֵּה
  choice: 見よ
  rationale: 目の前に明らかになった状態へ注意を促す談話機能と、原文の厳粛で生き生きとした調子を保つ。
- source_word: נִשְׁחָתָה
  choice: 損なわれていた
  rationale: שׁחתのニファルが含み得る道徳的腐敗と、破壊され荒廃した状態の双方を、どちらか一方に限定せず表せる語を選んだ。
- source_word: כִּי
  choice: からである
  rationale: 地が損なわれていた理由を導く因果関係を明確に表す。
- source_word: הִשְׁחִית
  choice: 損なっていた
  rationale: 同じ語根שׁחתの反復を日本語でも見える形にし、ヒフィルの能動的・原因的な意味を表す。
- source_word: כָּל בָּשָׂר
  choice: すべて肉なるもの
  rationale: 人類だけ、または全生物だけに範囲を確定せず、ヘブライ語の広がりを持つ慣用表現を保持した。
- source_word: דַּרְכּוֹ
  choice: 自らの道
  rationale: 「道」という比喩を残し、生活態度や行いを指す意味を文脈から理解できるようにした。単数接尾辞は集合的・配分的に「自らの」と表した。
- source_word: עַל הָאָרֶץ
  choice: 地上で
  rationale: 行為が地の上で行われたことを、自然で簡潔な現代日本語で表した。
theological_decisions:
- issue: שׁחתの二つの用例が持つ意味の幅
  choice: 両方を「損なわれていた／損なっていた」と訳し、語根の反復と、道徳的腐敗および破滅・荒廃の両面を保つ。
  alternative: 「堕落していた／堕落させていた」または「滅びていた／滅ぼしていた」
  rationale: 「堕落」は道徳面に、「滅び」は物理的破滅に意味を狭めやすい。「損なう」は、肉なるものの行為と地の損なわれた状態との因果的な結びつきを保ちながら、原文の緊張を解消しすぎない。
- issue: כָּל בָּשָׂרの範囲
  choice: 「すべて肉なるもの」という表現を本文に残す。
  alternative: 「全人類」または「すべての生き物」
  rationale: 文脈上の重点は人間にあると考えられるが、この句自体はより広い範囲を取り得るため、解釈によって対象を限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」「肉なるもの」「地」によって原文の厳粛さと比喩を保った。「損なう」の反復はやや目立つが、原文におけるשׁחתの意図的な反復を伝えるため保持した。
