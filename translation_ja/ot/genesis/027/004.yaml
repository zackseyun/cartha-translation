  text: וַ/עֲשֵׂה לִ֨/י מַטְעַמִּ֜ים כַּ/אֲשֶׁ֥ר אָהַ֛בְתִּי וְ/הָבִ֥יאָ/ה לִּ֖/י וְ/אֹכֵ֑לָה בַּ/עֲב֛וּר תְּבָרֶכְ/ךָ֥ נַפְשִׁ֖/י בְּ/טֶ֥רֶם אָמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/004.yaml
  text: Prepare for me tasty food[a], just as I love, and bring it to me, that I may eat[c][b], so that my soul may bless you before I die.
translation:
  language: ja
  text: 私の好きなごちそう[a]を作り、私のところへ持って来なさい。私がそれを食べ、死ぬ前に私自身があなたを祝福するためだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「味のよい料理」あるいは「珍味」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私の魂があなたを祝福する」。ここで「私の魂」は、イサク自身をその全人格において表す言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: 作り
  rationale: 動詞 עשה は広く「作る、行う」を意味するが、料理の文脈では「作る」が簡潔で自然である。
- source_word: מַטְעַמִּים
  choice: ごちそう
  rationale: 味よく特別に調理された食べ物を指す。「ごちそう」は現代日本語で自然であり、単なる「食べ物」より特別感も伝える。
- source_word: כַּאֲשֶׁר אָהַבְתִּי
  choice: 私の好きな
  rationale: 直訳的な「私が愛するような」より自然に、イサクの好みに合う料理という意味を表す。
- source_word: וְהָבִיאָה לִּי
  choice: 私のところへ持って来なさい
  rationale: 話者のもとへの移動と命令の力を明確に表す。
- source_word: וְאֹכֵלָה
  choice: 私がそれを食べ
  rationale: 意志・目的を帯びるコホータティブを、後続する最終目的へ自然につながる従属的な表現とした。
- source_word: בַּעֲבוּר
  choice: できるように
  rationale: この語が導く目的関係を自然な現代日本語で明示する。
- source_word: תְּבָרֶכְךָ נַפְשִׁי
  choice: 私の魂があなたを祝福できる
  rationale: 明示された主語 נַפְשִׁי「私の魂」を保持し、イサク自身の全存在から出る祝福という表現を残す。
- source_word: בְּטֶרֶם אָמוּת
  choice: 死ぬ前に
  rationale: 時間節を直接的で自然な日本語にした。
theological_decisions:
- issue: נַפְשִׁי の擬人的・慣用的表現
  choice: 本文では「私の魂が」を保持する
  alternative: 「私が心から」または単に「私が」
  rationale: 「私が」と平滑化すると原文に明示された נֶפֶשׁ が失われるため、原文の身体性・全人格性を含みうる表現を保持し、脚注で慣用的意味を説明する。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、父祖の祝福の厳粛さに合う落ち着いた文体とした。「ごちそう」は親しみやすいが軽すぎず、特別に調理された好物を自然に表す。「私の魂が」は日常語としてはやや marked だが、原文の重要な語を保持するため採用し、脚注で補った。
