  text: וַ/יֹּ֗אמֶר הַגִּ֤שָׁ/ה לִּ/י֙ וְ/אֹֽכְלָה֙ מִ/צֵּ֣יד בְּנִ֔/י לְמַ֥עַן תְּבָֽרֶכְ/ךָ֖ נַפְשִׁ֑/י וַ/יַּגֶּשׁ ל/וֹ֙ וַ/יֹּאכַ֔ל וַ/יָּ֧בֵא ל֦/וֹ יַ֖יִן וַ/יֵּֽשְׁתְּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/025.yaml
  text: And he said[a], “Bring it near to me, and I will eat of my son’s game, so that my soul may bless you.” So he brought it near to him, and he ate; and he brought him wine, and he drank.
translation:
  language: ja
  text: イサクは言った。「それをこちらへ持って来なさい。私が息子の獲物を食べ、私の魂がおまえを祝福できるように[a]。」そこで彼はそれをイサクのところへ持って来た。イサクは食べた。また彼はぶどう酒を持って来て、イサクは飲んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より自然な言い方では「私がおまえを祝福できるように」。ヘブライ語では「私の魂がおまえを祝福する」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּשָׁה לִּי
  choice: こちらへ持って来なさい
  rationale: ヒフィル命令形の「近くへ持って来る、差し出す」を、イサクのもとへの具体的な移動が自然に伝わる現代日本語で表した。目的語の料理は文脈上明らかなため、ここでは明示していない。
- source_word: וְאֹכְלָה מִצֵּיד בְּנִי
  choice: 息子の獲物を食べて
  rationale: コホータティブの意志を後続する目的節と自然につなげた。צַיִד は狩猟で得た獲物を指すため「獲物」とした。מן の部分的意味は、日本語では目的語を「を」で示しても文脈上十分伝わる。
- source_word: לְמַעַן תְּבָרֶכְךָ נַפְשִׁי
  choice: 私の魂がおまえを祝福できるようにしよう
  rationale: לְמַעַן の目的を「できるように」で示し、明示された主語 נַפְשִׁי を「私の魂」として保持した。日本語として文全体を成立させるため意志表現「しよう」を添えた。
- source_word: וַיַּגֶּשׁ לוֹ
  choice: ヤコブが料理を持って来ると
  rationale: ヘブライ語では主語と目的語が省略されているが、直前の文脈からヤコブと料理を補った。「近づけた」という不自然さを避けつつ、命令への応答を明確にした。
- source_word: יַיִן
  choice: ぶどう酒
  rationale: 日本語の聖書文体でも一般読者にも明確であり、発酵した酒を指す標準的な訳語である。
- source_word: וַיֵּשְׁתְּ
  choice: イサクは飲んだ
  rationale: 単純な物語の継起として訳し、省略された主語を日本語で明確にした。
theological_decisions:
- issue: 「私の魂」が祝福するというヘブライ語の表現
  choice: 本文に「私の魂」を保持し、注で慣用的な意味を示す
  alternative: 「私がおまえを祝福する」と慣用訳する
  rationale: נַפְשִׁי を単なる一人称代名詞に平板化せず、厳粛で全人的な響きを保つ一方、日本語読者が別個の実体としての魂を過度に読み込まないよう注を付した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、族長の祝福の場面にふさわしい落ち着いた格調を保った。人物名は、原文で省略された主語が日本語では曖昧になりやすい箇所にのみ補った。
