  to: イサクは言った。「それをこちらへ持って来なさい。私が息子の獲物を食べ、私の魂がおまえを祝福できるように[a]。」そこで彼はそれをイサクのところへ持って来た。イサクは食べた。また彼はぶどう酒を持って来て、イサクは飲んだ。
