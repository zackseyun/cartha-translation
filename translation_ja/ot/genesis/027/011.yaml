  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יַעֲקֹ֔ב אֶל רִבְקָ֖ה אִמּ֑/וֹ הֵ֣ן עֵשָׂ֤ו אָחִ/י֙ אִ֣ישׁ שָׂעִ֔ר וְ/אָנֹכִ֖י אִ֥ישׁ חָלָֽק־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/011.yaml
  text: But Jacob said to Rebekah his mother[a], “Look, Esau my brother is a hairy man[b], and I am a smooth man.”
translation:
  language: ja
  text: しかしヤコブは母リベカに言った。「ご覧ください。兄のエサウは毛深い男ですが、私は肌が滑らかです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「私は滑らかな男です」。ここで「滑らか」は、エサウが毛深いのとは対照的に、ヤコブの体に毛がないことを指す。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかしヤコブは…言った
  rationale: 物語を進める接続形だが、直前のリベカの提案に対する異議を導くため、文脈上の対照を自然な日本語の「しかし」で表した。
- source_word: אֶל־רִבְקָה אִמּוֹ
  choice: 母リベカに
  rationale: リベカの名とヤコブとの関係をともに保ちつつ、現代日本語として自然な語順にした。
- source_word: הֵן
  choice: でも
  rationale: 注意を促しながら懸念を切り出す談話標識。ここでは母の計画へのためらいを自然に示す「でも」が機能をよく伝える。
- source_word: עֵשָׂו אָחִי
  choice: 兄のエサウ
  rationale: אָחִי は広く「私の兄弟」を意味し得るが、創世記25:25–26の出生順に照らし、自然な日本語で「兄」とした。
- source_word: אִישׁ שָׂעִר
  choice: 毛深く
  rationale: 直訳的な「毛深い男です」より自然で、身体の毛が多いという対照を明確に伝える。
- source_word: וְאָנֹכִי אִישׁ חָלָק
  choice: 私は肌が滑らかです
  rationale: 独立代名詞 אָנֹכִי の対照的強調を「私は」で表し、חָלָק がここでは毛深くない身体を指すことを「肌が滑らか」で明瞭にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語。会話として自然な「でも」を用いながら、ヤコブの懸念と兄弟間の身体的対照を保った。
