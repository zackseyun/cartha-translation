  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּגַּשׁ֙ וַ/יִּשַּׁק ל֔/וֹ וַ/יָּ֛רַח אֶת רֵ֥יחַ בְּגָדָ֖י/ו וַֽ/יְבָרֲכֵ֑/הוּ וַ/יֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔/י כְּ/רֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/027.yaml
  text: So he came near and kissed him[a], and he smelled the smell of his garments and blessed him and said, “See[b], the smell of my son is like the smell of a field that Yahweh has blessed.”
translation:
  language: ja
  text: 'そこで彼は近寄って父に口づけした。イサクは彼の衣の匂いを嗅ぎ、彼を祝福して言った。

    「ほら、わが子の匂いは、

    ヤハウェが祝福された野の匂いのようだ。[a]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では「匂い」に当たる同じ語が、衣について一度、わが子について一度、野について一度、計三度繰り返されている。
    reason: 原文の語彙反復と修辞的効果を示すため。
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: そこで彼は近寄って
  rationale: 物語を進める接続形と、נגשׁ の接近する動作を、自然な現代日本語で表した。直前の文脈から「彼」はヤコブを指す。
- source_word: וַיִּשַּׁק לוֹ
  choice: 父に口づけした
  rationale: נשׁק の動作を簡潔に訳した。目的語は文脈上イサクなので、日本語で参照先が明瞭になるよう「父」とした。
- source_word: וַיָּרַח אֶת רֵיחַ בְּגָדָיו
  choice: イサクは彼の衣の匂いを嗅ぎ
  rationale: ריח の動詞と名詞による同語根表現を、「匂いを嗅ぐ」という自然な日本語で反映した。行為者は文脈上イサクであるため明示した。
- source_word: בְּגָדָיו
  choice: 彼の衣
  rationale: בֶּגֶד の具体的な衣服を、祝福場面に合う簡潔で品位ある語「衣」で表した。
- source_word: וַיְבָרֲכֵהוּ
  choice: 彼を祝福して
  rationale: ברך と目的語接尾辞をそのまま反映した。
- source_word: רְאֵה
  choice: ほら
  rationale: 注意を促す命令形。嗅覚について語る文脈で「見よ」は不自然になりやすいため、感嘆と注意喚起を兼ねる現代語の「ほら」とした。
- source_word: רֵיחַ בְּנִי
  choice: わが子の匂い
  rationale: רֵיחַ を前半と同じ「匂い」で訳し、原文の語彙反復を保った。「わが子」は祝福の荘重さに適する。
- source_word: כְּרֵיחַ שָׂדֶה
  choice: 野の匂いのようだ
  rationale: 比較を「のようだ」で示した。שָׂדֶה はこの文脈では耕地だけに限定せず、戸外に広がる野を表す「野」が自然である。
- source_word: אֲשֶׁר בֵּרֲכוֹ יְהוָה
  choice: ヤハウェが祝福された
  rationale: 完了形が示す、祝福を受けた結果的な状態を自然な日本語で表した。尊敬表現は神を主語とする日本語として用い、受動の意味は加えていない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いているため、称号「主」に置換せず「ヤハウェ」とした。別の母音を前提とする「エホバ」も採用しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、祝福の発言では「わが子」「衣」「野」を用いて簡潔な荘重さを保った。代名詞だけでは日本語で行為者が混乱しやすいため、文脈上明らかなイサクを一度明示した。
