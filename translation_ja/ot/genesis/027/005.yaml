  text: וְ/רִבְקָ֣ה שֹׁמַ֔עַת בְּ/דַבֵּ֣ר יִצְחָ֔ק אֶל עֵשָׂ֖ו בְּנ֑/וֹ וַ/יֵּ֤לֶךְ עֵשָׂו֙ הַ/שָּׂדֶ֔ה לָ/צ֥וּד צַ֖יִד לְ/הָבִֽיא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/005.yaml
  text: Rebekah was listening when Isaac spoke to Esau his son[b][a], and Esau went to the field to hunt game and bring it back.
translation:
  language: ja
  text: リベカは、イサクが息子のエサウに話しているのを聞いていた。[a] エサウは、獲物を捕って持ち帰るために野へ出て行った。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「イサクが息子のエサウに話していた時、リベカは聞いていた」。ヘブライ語の分詞と不定詞の組み合わせは、二つの動作が同時に進んでいたことを表し得る。
    reason: lexical_alternative
  - marker: b
    text: 「獲物を捕り、それを持って来るために」とも訳せる。
    reason: previous_rendering
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: リベカは
  rationale: 接続詞וְは物語の継続を示すが、日本語では段落の流れから明らかなため、不要な「さて」や機械的な「そして」を置かず、自然に主題を提示した。
- source_word: שֹׁמַעַת
  choice: 聞いていた
  rationale: 能動分詞が示す継続的・背景的な動作を表す。「耳を傾けていた」とすると意図的な盗み聞きまで含意し得るため、より中立的な「聞いていた」とした。
- source_word: בְּ/דַבֵּר יִצְחָק
  choice: イサクが…話しているのを
  rationale: 前置詞בְと不定詞連語が示す同時性を、進行中の発話を聞いていたという自然な日本語で表した。
- source_word: אֶל עֵשָׂו בְּנ/וֹ
  choice: 息子エサウに
  rationale: אֶלの発話の方向と、接尾辞による「彼の息子」という関係を簡潔に保持した。日本語では文脈上、誰の息子か明瞭である。
- source_word: וַ/יֵּלֶךְ עֵשָׂו הַ/שָּׂדֶה
  choice: エサウは…野へ出て行った
  rationale: הלךの移動とשׂדהの開けた土地・野外という意味を、狩りの場面に自然な「野へ出て行った」で表した。
- source_word: לָ/צוּד צַיִד
  choice: 獲物を捕って
  rationale: צידは特定の動物種ではなく狩猟の獲物を指すため、「鹿肉」などに限定しなかった。日本語では「獲物を捕る」が自然である。
- source_word: לְ/הָבִיא
  choice: 持ち帰るために
  rationale: 目的を表す不定詞として理解し、文脈上イサクのもとへ持って戻ることを自然な日本語で明示した。
