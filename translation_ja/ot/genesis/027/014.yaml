  text: So he went and took them and brought them to his mother[a], and his mother prepared tasty food, just as his father loved.
translation:
  language: ja
  text: そこで彼は出かけて子やぎを取り、母のところへ持っていった。母は、父が好んでいたとおりのおいしい料理[a]を作った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ごちそう」とも訳せる。ヘブライ語では複数形で、味よく調理した料理を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: そこで彼は行って
  rationale: 接続形による物語の進行と、直前の母の指示を受けた行動であることを、自然な現代日本語の「そこで」で表した。
- source_word: וַיִּקַּח
  choice: 子やぎを取り
  rationale: 動詞自体は「取った」だが、目的語は直前の節にある二匹の子やぎを指す。日本語で明確にするため、文脈上の目的語を補った。
- source_word: וַיָּבֵא לְאִמּוֹ
  choice: 母のもとに持って来た
  rationale: בואの使役形とלְの組み合わせを自然に表現した。省略された目的語は前句の「子やぎ」と共有される。
- source_word: וַתַּעַשׂ אִמּוֹ
  choice: 母は……作った
  rationale: עשהは広く「する、作る」を意味し、料理について日本語では「作った」が簡潔で自然である。
- source_word: מַטְעַמִּים
  choice: おいしい料理
  rationale: 味よく調理された特別な料理を指す複数形。現代の一般読者に明瞭な「おいしい料理」とし、別訳の可能性を脚注に示した。
- source_word: כַּאֲשֶׁר אָהֵב אָבִיו
  choice: 父が好んでいたとおりの
  rationale: אהבは直訳すれば「愛した」だが、食べ物への嗜好を表す文脈では「好んでいた」が自然である。כַּאֲשֶׁרの比較・一致の意味は「とおりの」で保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。連続する動作は簡潔に示し、食べ物へのאהבは日本語の自然な用法に合わせて「好んでいた」とした。脚注記号は対応語「おいしい料理」の直後に置いた。
