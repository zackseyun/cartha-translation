source:
  edition: WLC
  text: וְ/יִֽתֶּן לְ/ךָ֙ הָ/אֱלֹהִ֔ים מִ/טַּל֙ הַ/שָּׁמַ֔יִם וּ/מִ/שְׁמַנֵּ֖י הָ/אָ֑רֶץ וְ/רֹ֥ב דָּגָ֖ן וְ/תִירֹֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/028.yaml
  text: May God give you some of the dew of heaven[a], and some of the richness of the earth, and an abundance of grain and new wine.
translation:
  language: ja
  text: どうか神があなたに、天の露と地の豊かさ[a]、また穀物と新しいぶどう酒を豊かに与えてくださいますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「天の露から、また地の豊かさから」とも訳せる。前置詞は、そこから与えられるという源泉、またはその一部を分け与えるという含みを持ちうる。「地の豊かさ」は、土地の肥沃さと豊かな産物を表す。
    reason: מִן の部分・源泉の含みと、שְׁמַנֵּי の農耕的な豊饒の比喩を示すため。
lexical_decisions:
- source_word: וְיִתֶּן
  choice: どうか……与えてくださるように
  rationale: 祝福の文脈における願望の力を表し、単なる未来の予告ではなく、イサクが神の賜物を願う発話として自然な現代日本語にした。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: 定冠詞を伴うが、ここでは固有の神を指す通常の呼称であり、日本語では「神」が自然である。
- source_word: מִטַּל הַשָּׁמַיִם
  choice: 天の露
  rationale: מִן の起点・分与の含みは日本語では目的語として自然に表し、「天の露」という農耕的な祝福の比喩を保持した。
- source_word: וּמִשְׁמַנֵּי הָאָרֶץ
  choice: 地の肥沃さ
  rationale: 字義的には「地の脂肪・豊かさ」に当たる表現であるが、土地の生産力を指すため、現代日本語で明瞭な「肥沃さ」とした。
- source_word: וְרֹב
  choice: 豊かに
  rationale: 穀物と新しいぶどう酒が多く与えられるという豊富さを、後続する動詞にかかる自然な日本語で表した。
- source_word: דָּגָן
  choice: 穀物
  rationale: 特定の一作物ではなく、穀類一般を指す語として訳した。
- source_word: וְתִירֹשׁ
  choice: 新しいぶどう酒
  rationale: 一般的な「ぶどう酒」よりも、新しく造られた酒や新酒を指す語の区別を保った。
theological_decisions:
- issue: 発話の性質
  choice: 神の賜物を願う祝福（「どうか……くださるように」）
  alternative: 単純な未来の予告（「神は……与える」）
  rationale: 接頭辞形動詞と直近の祝福の文脈は願望的な理解を支持する。祝福の遂行的な力を保ちつつ、本文を超える神学的主張は加えていない。
- issue: מִן の解釈
  choice: 日本語本文では「天の露と地の肥沃さを」と自然に表現する
  alternative: 「天の露の一部と、地の肥沃さの一部を」という明示的な部分表現
  rationale: מִן には部分・源泉の含みがあり得るが、日本語で「一部」を明示すると祝福が限定的であるとの不自然な印象を与える。曖昧さは脚注で示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、族長の祝福にふさわしい端正な調子を保った。「どうか」と文末の「ように」で願望を明示し、神を主語とするため「くださる」を用いた。
