base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/039.yaml
  text: Then his father Isaac answered and said to him[a], “Behold, your dwelling shall be away from the richness of the earth, and away from the dew of heaven above.”
translation:
  language: ja
  text: 'すると、父イサクは彼に答えて言った。


    「見よ、おまえの住まいは、

    地の豊かさから遠く離れ、

    天からの露からも遠く離れた所にある[a]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見よ、おまえの住まいは、地の豊かさから、天からの露による所にある」。ヘブライ語の前置詞は、ここでは「〜から遠く離れて」という意味にも、「〜から受けて／〜によって」という意味にも取ることができる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: 答えて言った
  rationale: 物語中で応答の発話を導く定型表現。ヘブライ語の応答構文を保ちつつ、自然で格調ある日本語とした。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 厳粛な宣告に注意を促す談話標識として、その重みを保つ表現を選んだ。
- source_word: מִשְׁמַנֵּי הָאָרֶץ
  choice: 地の豊かさから遠く離れ
  rationale: שְׁמַנִּים は字義的には「脂肪・肥沃さ」で、ここでは土地の肥沃さや実りを指す。前置詞 מִן は本文では離隔・欠如の意味に取った。
- source_word: מוֹשָׁבֶךָ
  choice: おまえの住まい
  rationale: 居住地・住む所を表す語。文脈上、単なる家屋ではなく、エサウが暮らす土地を含意する。
- source_word: וּמִטַּל הַשָּׁמַיִם
  choice: 上なる天の露からも遠く離れ
  rationale: 第一の מִן 句と並行するため、同じく離隔の意味で訳した。「露」は乾燥地で土地を潤す恵みを表す。
- source_word: מֵעָל
  choice: 上なる
  rationale: 天が上方にあるというヘブライ語の空間表現を、簡潔で格調ある日本語にした。
theological_decisions:
- issue: イサクがエサウに告げた言葉における前置詞 מִן の意味
  choice: 離隔・欠如を表す「～から遠く離れて」
  alternative: 源・分与を表す「～の豊かさを受けて／～の露を受けて」
  rationale: 直前のヤコブへの祝福と対照をなし、エサウの居住地が肥沃さと天の露に乏しいことを告げる読みを本文に採用した。ただし、מִן は源や分与を表すこともでき、肯定的な祝福として読む伝統的解釈も文法上可能なので、脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、族長の厳粛な宣告にふさわしく「見よ」「上なる」を用いた。呼称「おまえ」は父から息子への直接の語りとして自然であり、侮蔑的になりすぎない文脈的表現である。詩的な並行構造を改行で示した。
