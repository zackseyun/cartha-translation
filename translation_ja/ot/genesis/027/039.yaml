  rationale: 離隔的読解を本文に保ちつつ、住まい（居住地）について述べる原文の簡潔な構文と二行の並行性が日本語でも明瞭になるよう整えた。「天からの露」は「上なる天の露」より自然な現代日本語であり、露が天の上方から来るという מֵעָל の表現を損なわない。脚注は、争いのある מִן の肯定的解釈を、本文と区別して保持する。
