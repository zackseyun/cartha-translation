  naturalness: 「地の豊かさから遠く離れ、上なる天の露からも遠く離れた所となる」は意味は明瞭だが、「遠く離れ」の反復と「所となる」がやや重い。並行句を保ちながら、「〜から遠く離れた所にある」とすると自然で明確である。
  terminology: 「地の豊かさ」「天の露」「イサク」は適切。「見よ」は厳粛な宣告の文体として許容される。「上なる天」は不自然ではないが、現代標準日本語では「天からの露」のほうが מֵעָל（上から）を自然に表す。脚注の肯定的代案は、原文の構文に即して「地の豊かさから、天からの露による」とする。
