  yaml_path: translation/ot/genesis/027/016.yaml
  text: And she put the skins of the young goats on his hands and on the smooth part of his neck.
translation:
  language: ja
  text: また彼女は、子やぎの皮を彼の両手と首の滑らかな部分に着けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹרֹת
  choice: 皮
  rationale: 複数形だが、日本語では動物の皮を材料としてまとめて指す場合、「皮」が自然であり、子やぎから取った複数の皮という文脈も保たれる。
- source_word: גְּדָיֵי הָעִזִּים
  choice: 子やぎ
  rationale: 「やぎの若いもの」を意味する定型的な表現であり、現代日本語では「子やぎ」が簡潔で自然である。
- source_word: הִלְבִּישָׁה
  choice: かぶせた
  rationale: 使役形で「着せる、身につけさせる」の意。皮を手と首に取り付ける場面なので、「着せた」よりも「かぶせた」が具体的かつ自然である。
- source_word: עַל יָדָיו
  choice: 彼の両手に
  rationale: יָדָיו は双数形に三人称男性単数の接尾辞が付き、「彼の両手」を指す。日本語では「両手」と明示するのが自然で正確である。
- source_word: חֶלְקַת צַוָּארָיו
  choice: 首の滑らかな部分
  rationale: חֶלְקַת は滑らかさ、または滑らかな部分を表す。毛のない首の部分を覆うという具体的意味を、解釈を加えすぎずに伝える。
