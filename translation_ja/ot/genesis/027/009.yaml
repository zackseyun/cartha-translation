source:
  edition: WLC
  text: לֶךְ נָא֙ אֶל הַ/צֹּ֔אן וְ/קַֽח לִ֣/י מִ/שָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְ/אֶֽעֱשֶׂ֨ה אֹתָ֧/ם מַטְעַמִּ֛ים לְ/אָבִ֖י/ךָ כַּ/אֲשֶׁ֥ר אָהֵֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/009.yaml
  text: Please go to the flock and get for me from there two good young goats[a], and I will make them into tasty food for your father, just as he loves.
translation:
  language: ja
  text: 「さあ、群れのところへ行って、そこから良い子やぎを二匹、私のために取って来なさい。私がそれを使って、あなたの父のために、父が好きなおいしい料理[a]を作ります。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ごちそう」「味のよい料理」。
    reason: מַטְעַמִּים は、味よく調理された料理、好物の料理、または珍味を指し得るため。
lexical_decisions:
- source_word: לֶךְ נָא
  choice: さあ、…行き
  rationale: 命令形 לֶךְ に、促しや依頼の調子を添える נָא が続く。「さあ」によって、母が息子に行動を促す自然な語調を表した。
- source_word: הַצֹּאן
  choice: 群れ
  rationale: צֹאן は羊とやぎを含む小家畜の群れを指し得る。直後に子やぎが指定されるため、広い意味を保つ「群れ」とした。
- source_word: וְקַח לִי מִשָּׁם
  choice: そこから…私のために取って来なさい
  rationale: לקח の「取る、手に入れる」という意味と、話者のもとへ持ち帰る文脈を、自然な日本語の「取って来なさい」で表した。לִי は「私のために」と明示した。
- source_word: שְׁנֵי גְּדָיֵי עִזִּים טֹבִים
  choice: 良い子やぎを二匹
  rationale: 構文上は「良い、二匹のやぎの子」。日本語では年齢と動物種が明瞭な「良い子やぎを二匹」が自然である。「良い」は食材としての質や適性を含み得るが、それ以上に限定しない。
- source_word: וְאֶעֱשֶׂה אֹתָם מַטְעַמִּים
  choice: 私がそれで…ごちそうを作ります
  rationale: אֹתָם は二匹の子やぎを受けるため、料理の材料となることを自然に示す「それで」とした。מַטְעַמִּים は味のよい料理や珍味を指すので、現代日本語で読みやすい「ごちそう」とした。
- source_word: לְאָבִיךָ כַּאֲשֶׁר אָהֵב
  choice: あなたのお父さんが好きな
  rationale: 直訳的には「あなたの父のために、彼が好むような」。日本語では修飾節にまとめ、「あなたの父」という関係とイサクの好みの両方を明確に保った。
theological_decisions: []
translation_notes:
  register: 現代の標準的な日本語で、母から息子への強い促しを保ちつつ、過度に粗野にならない語調とした。「父さん」ではなく「あなたのお父さん」として、明瞭さと聖書物語にふさわしい品位を保った。
