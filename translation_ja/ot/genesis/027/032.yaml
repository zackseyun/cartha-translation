  text: וַ/יֹּ֥אמֶר ל֛/וֹ יִצְחָ֥ק אָבִ֖י/ו מִי אָ֑תָּה וַ/יֹּ֕אמֶר אֲנִ֛י בִּנְ/ךָ֥ בְכֹֽרְ/ךָ֖ עֵשָֽׂו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/032.yaml
  text: His father Isaac said to him[a], “Who are you?” And he said, “I am your son, your firstborn[b], Esau.”
translation:
  language: ja
  text: 父イサクは彼に言った。「あなたはだれなのか。」彼は言った。「私はあなたの息子、あなたの長子エサウです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: 彼に言った
  rationale: אמרは通常の発話動詞なので「言った」とし、ל＋三人称男性単数接尾辞を「彼に」と明示した。問いの内容だけを根拠に「尋ねた」と言い換えず、ヘブライ語の表現を保った。
- source_word: יִצְחָק אָבִיו
  choice: 父イサク
  rationale: 語順どおりには「彼の父イサク」だが、日本語では文脈上の指示対象が明らかなため、自然で簡潔な「父イサク」とした。父子関係と話者の名をともに保持している。
- source_word: מִי אַתָּה
  choice: おまえは誰なのか
  rationale: 疑問詞מִיと二人称男性単数代名詞の直接的な問い。父が息子に語る場面に合う「おまえ」を用い、「誰なのか」で驚きと確認を含み得る原文の問いを自然に表した。
- source_word: אֲנִי בִּנְךָ
  choice: 私はあなたの息子
  rationale: コピュラのない名詞文を、日本語で自然な「私は…です」の構文として表した。בן＋二人称男性単数接尾辞は「あなたの息子」とした。
- source_word: בְכֹרְךָ
  choice: あなたの長子
  rationale: בכורは単なる年長者以上に出生順位と長子の身分を示し、周辺文脈の長子の権利とも関わるため、「いちばん上の息子」ではなく、簡潔で聖書文脈にも適した「長子」とした。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
theological_decisions:
- issue: בְכֹרְךָが示す出生順位と長子の身分
  choice: 長子
  alternative: いちばん上の息子／長男
  rationale: 「長子」は出生順位だけでなく、この物語で重要な長子の権利との結びつきを保つ。本文以上の法的・神学的意味を付け加えてはいない。
translation_notes:
  register: 明快な現代標準日本語としつつ、父子間の場面にふさわしい自然な代名詞を選んだ。「おまえ」は侮蔑ではなく、父から息子への親しい下向きの呼称として用いた。発話の反復は原文に従って保持し、全体を簡潔で品位ある叙述にした。
