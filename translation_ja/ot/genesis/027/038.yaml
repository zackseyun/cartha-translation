base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/038.yaml
  text: Esau said to his father[a], “Do you have only one blessing, my father? Bless me too, my father!” Then Esau raised his voice and wept.
translation:
  language: ja
  text: エサウは父に言った。「父上、あなたの祝福は一つしかないのですか。父上、どうか私も祝福してください！」エサウは声を上げて泣いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבְּרָכָה אַחַת הִוא לְךָ
  choice: あなたの祝福は一つしかないのですか
  rationale: ヘブライ語の無動詞文が表す修辞的な問いを、現代日本語で自然に表現した。「しかない」により、授けられる祝福が一つだけなのかというエサウの驚きと苦悩を伝える。
- source_word: אָבִי
  choice: 父上
  rationale: 一人称単数接尾辞の「私の父」を、息子が父に直接哀願する場面にふさわしい自然で敬意ある呼びかけとした。二度の反復も保持した。
- source_word: בָּרֲכֵנִי גַּם אָנִי
  choice: どうか私も祝福してください
  rationale: 命令形と一人称目的語、および「私も」という包含の強調を保ちつつ、切実な願いとして自然な日本語にした。「どうか」は文脈上の哀願を明示するが、新たな内容は加えない。
- source_word: וַיִּשָּׂא ... קֹלוֹ
  choice: 声を上げて
  rationale: 字義的には「自分の声を上げた」。泣くことと結び付く日本語の慣用表現「声を上げて泣く」で、 audible lament の意味を自然に伝える。
- source_word: וַיֵּבְךְּ
  choice: 泣いた
  rationale: 動詞 בכה の基本的意味を、明瞭で現代的な日本語で表した。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 日本語聖書で一般的な人名表記を用いた。
theological_decisions:
- issue: イサクの祝福が一つだけかという問い
  choice: 祝福が一つしかないのかと問う形を保持
  alternative: 祝福する力や祝福の言葉がもう残っていないのかと解釈して明示する
  rationale: 原文は祝福の性質や残余を詳しく説明せず、エサウの修辞的な問いとして表す。神学的・物語的含意を訳文で限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、家族内の敬意と切迫した感情を「父上」の反復と「どうか」で表した。叙述は簡潔で品位ある調子を保った。
