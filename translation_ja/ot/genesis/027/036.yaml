base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/036.yaml
  text: 'And he said[a], “Is he not rightly named Jacob? For he has supplanted me these two times: he took my birthright, and look, now he has taken my blessing.” And he said, “Have you not reserved a blessing for me?”'
translation:
  language: ja
  text: 彼は言った[a]。「彼がヤコブと呼ばれるのは、まさにもっともではないか。これで二度も、私を出し抜いた。私の長子の権利を取り、見ろ、今、私の祝福まで取ってしまった。」そして言った。「私のために、祝福を残しておいてくださらなかったのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、「ヤコブ」という名と、ここで「出し抜いた」と訳した動詞が響き合っている。この動詞は「欺いた」「だまして先を越した」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי קָרָא שְׁמוֹ יַעֲקֹב
  choice: あいつがヤコブと名づけられたのも、もっともではないか
  rationale: 反語的な問いとして自然な日本語にし、続く名と動詞の語呂合わせを導く。
- source_word: וַיַּעְקְבֵנִי
  choice: 私を出し抜いた
  rationale: 相手を欺いて先を越すという文脈上の意味を明瞭に表す。日本語では「ヤコブ」との語呂合わせを本文だけで再現できないため、注で説明する。
- source_word: זֶה פַעֲמַיִם
  choice: これで二度も
  rationale: 二回の行為を指すヘブライ語の強調を、自然で感情のこもった日本語で表す。
- source_word: בְּכֹרָתִי
  choice: 私の長子の権利
  rationale: 第一子としての法的・家族的権利を明確に表す。
- source_word: וְהִנֵּה עַתָּה
  choice: 見ろ、今度は
  rationale: エサウの激しい訴えにおける注意喚起と、直前の出来事への焦点を現代的な表現で保つ。
- source_word: בִּרְכָתִי
  choice: 私の祝福
  rationale: 族長が授ける、文脈上重大な祝福を直接的に訳す。
- source_word: הֲלֹא אָצַלְתָּ לִּי בְּרָכָה
  choice: 私のために、祝福を残しておいてはくださらなかったのですか
  rationale: אָצַלの「取り分けて残す、取っておく」という意味と、父への切実な問いを自然な敬語で表す。
