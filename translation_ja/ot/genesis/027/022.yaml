base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/022.yaml
  text: So Jacob went near to Isaac his father[a], and he felt him and said, “The voice is Jacob’s voice, but the hands are Esau’s hands.”
translation:
  language: ja
  text: そこでヤコブは父イサクに近寄った。イサクは彼に触って確かめ、言った。「声はヤコブの声だが、手はエサウの手だ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 近寄った
  rationale: カル形の נגשׁ が表す接近の動きを、現代日本語の自然な物語表現で示す。
- source_word: וַיְמֻשֵּׁהוּ
  choice: 彼に触って確かめ
  rationale: מושׁ はここでは単に触れるだけでなく、触覚によって身元を確認する行為を指すため、その意図を明確にした。
- source_word: הַקֹּל
  choice: 声
  rationale: 話者の声を触覚的な証拠と対比している文脈なので、「音」ではなく「声」が適切である。
- source_word: קוֹל יַעֲקֹב
  choice: ヤコブの声
  rationale: ヘブライ語の連語関係を、日本語で自然な所有・帰属表現として訳した。
- source_word: וְהַיָּדַיִם יְדֵי עֵשָׂו
  choice: だが、手はエサウの手だ
  rationale: 原文の反復と対照を保ち、接続詞 waw は文脈上の逆接として「だが」とした。
- source_word: אָבִיו
  choice: 父イサク
  rationale: 原文の親子関係の明示を保持しつつ、日本語として自然な語順にした。
theological_decisions: []
