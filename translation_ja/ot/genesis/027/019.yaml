base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/019.yaml
  text: And Jacob said to his father[a], “I am Esau your firstborn. I have done as you told me. Please rise, sit, and eat from my game[b], so that your soul may bless me.”
translation:
  language: ja
  text: ヤコブは父に言った。「私は、あなたの長子エサウです。おっしゃったとおりにしました。私を祝福してくださるよう、どうぞ起きて座り、私の獲物を召し上がってください[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「あなたの魂が私を祝福するように」。ここで「魂」は、その人自身を指すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב אֶל־אָבִיו
  choice: ヤコブは父に言った
  rationale: 物語を進める接続形は、日本語では不自然な接続語を足さず、簡潔な叙述で表した。אֶל־אָבִיו は「父に」と自然に訳した。
- source_word: אָנֹכִי עֵשָׂו בְּכֹרֶךָ
  choice: 私は、あなたの長子エサウです
  rationale: 動詞のない同定文を自然な日本語にし、ヤコブが自分をエサウかつ長子だと偽る内容を明確に保った。
- source_word: עָשִׂיתִי כַּאֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: おっしゃったとおりにしました
  rationale: 父に対する発話として自然な敬意を示しつつ、「語ったとおりに行った」という意味を簡潔に伝えた。
- source_word: קוּם נָא שְׁבָה
  choice: どうぞ起きて座り
  rationale: נָא の丁寧な願いを「どうぞ」で表し、二つの命令「起きる」「座る」をそのまま保った。一見逆説的な順序も本文どおり残した。
- source_word: וְאָכְלָה מִצֵּידִי
  choice: 私の獲物を召し上がってください
  rationale: צַיִד は狩りで得た獲物またはその肉を指す。文脈上、食べ物となった獲物を意味するため「私の獲物」とし、父への発話に合う「召し上がる」を用いた。
- source_word: בַּעֲבוּר תְּבָרֲכַנִּי נַפְשֶׁךָ
  choice: そうして、私を祝福してください[a]
  rationale: בַּעֲבוּר の目的・意図を「そうして」で前文と結び、נַפְשֶׁךָ はここでは人自身を表す慣用表現なので、本文では自然に「私を祝福してください」とした。直訳的な形は脚注に示した。
theological_decisions:
- issue: תְּבָרֲכַנִּי נַפְשֶׁךָ における נַפְשֶׁךָ の訳し方
  choice: 本文では「私を祝福してください」と慣用的に訳す
  alternative: 「あなたの魂が私を祝福するように」または「あなた自身が私を祝福するように」
  rationale: נֶפֶשׁ はここで人間の構成要素としての「魂」について教える語ではなく、本人を指すヘブライ語の慣用表現である。日本語で「魂が祝福する」とすると不自然で、本文にない人間論的含意を生じさせかねないため、意味を本文に、字義的表現を脚注に置いた。
translation_notes:
  register: 現代の一般読者に明瞭な、落ち着いた標準語を用いた。父に対するヤコブの言葉では「おっしゃった」「召し上がってください」により自然な敬意を表したが、過度に古風な敬語は避けた。
