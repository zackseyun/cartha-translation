  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר ל/וֹ֙ אִמּ֔/וֹ עָלַ֥/י קִלְלָתְ/ךָ֖ בְּנִ֑/י אַ֛ךְ שְׁמַ֥ע בְּ/קֹלִ֖/י וְ/לֵ֥ךְ קַֽח לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/013.yaml
  text: His mother said to him[a], “Your curse be on me, my son. Only listen to my voice, and go[b], get them for me.”
translation:
  language: ja
  text: 母は彼に言った。「わが子よ、おまえにかかる呪いは、私が受けます。ただ私の声に聞き従い[a]、行って、私のために子やぎを取って来なさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私の声を聞きなさい」。ヘブライ語では「私に従いなさい」という意味にもなる慣用表現。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では目的語が省かれている。前の節に出てくる二匹の子やぎを指す。
    reason: cross_reference
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: 言った
  rationale: אמרの物語叙述における標準的な訳。単純で自然な日本語の過去表現とした。
- source_word: אִמּוֹ
  choice: 母
  rationale: 三人称男性単数接尾辞を伴う親族名称。「彼に」によって対象が明白なので、日本語では「彼の母」より自然な「母」とした。
- source_word: עָלַי קִלְלָתְךָ
  choice: おまえにかかる呪いは、私が受けます
  rationale: 直訳的には「おまえの呪いは私の上に」。ヤコブに及ぶはずの呪いを母が自ら引き受けるという意味を、関係性を保ちながら自然な日本語で表した。
- source_word: בְּנִי
  choice: わが子よ
  rationale: 一人称単数接尾辞を伴う呼びかけ。母の情愛と改まった聖書叙述の調子を保つ。
- source_word: אַךְ
  choice: ただ
  rationale: ここでは後続の命令に注意を限定する制限・強調を表すため、「ただ」とした。
- source_word: שְׁמַע בְּקֹלִי
  choice: 私の声に聞き従い
  rationale: 字義的な「私の声を聞く」と、服従を含むヘブライ語慣用句の双方を伝えるため、「聞き従う」を用い、「声」も残した。
- source_word: וְלֵךְ
  choice: 行って
  rationale: 接続詞を伴う命令形で、次の行為へ続く命令の順序を自然な連用形で表した。
- source_word: קַח לִי
  choice: 私のために子やぎを取って来なさい
  rationale: 目的語は前節の子やぎを指すが本文では省略されている。日本語で文脈を明瞭にするため補い、לקחと与格לִיを自然に表した。
theological_decisions:
- issue: 母が呪いを負うという発言の確定性
  choice: 「私が受けます」と断言として訳す
  alternative: 「私の上にありますように」または「私にかかればよい」
  rationale: ヘブライ語は動詞を明示しない簡潔な名詞句だが、文脈上は母が結果を引き受ける強い申し出である。祈願や単なる可能性に限定せず、断言の力を保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、母の強い決意と親子間の呼びかけにふさわしい品位を保った。「わが子よ」はやや格調があるが現代の読者にも理解しやすい。脚注記号は該当箇所に配置した。
