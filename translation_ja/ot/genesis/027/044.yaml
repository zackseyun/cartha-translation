  text: 兄の激しい怒りが収まるまで、数日間、伯父ラバンのもとにとどまりなさい。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיָשַׁבְתָּ
  choice: とどまりなさい
  rationale: ישׁבは「座る、住む、とどまる」を意味する。ここではリベカがヤコブにラバンのもとで一時的に過ごすよう命じているため、「とどまりなさい」が文脈と現代日本語に自然である。
- source_word: עִמּוֹ
  choice: 伯父のもとに
  rationale: 直訳は「彼と共に」。直前の文脈で指示対象はラバンであり、日本語では親族関係を明示して「伯父のもとに」とするのが自然である。
- source_word: יָמִים אֲחָדִים
  choice: しばらくの間
  rationale: 字義的には「幾日か」。話者が想定する一時的な滞在を自然に表し、実際の滞在が長期化する後の展開を先取りしない。
- source_word: עַד אֲשֶׁר
  choice: まで
  rationale: 行為の終点を導く標準的な時間表現であり、日本語では「〜まで」が自然である。
- source_word: תָּשׁוּב
  choice: 収まる
  rationale: שׁובの字義は「戻る、向きを変える」だが、激しい怒りを主語とするここでは、その怒りが退くことを表す慣用的用法である。日本語の「収まる」が意味を明瞭に伝える。
- source_word: חֲמַת
  choice: 激しい怒り
  rationale: חֵמָהは熱を帯びた強い怒り、憤激を指す。「激しい怒り」は強度を保ちつつ、普通の現代日本語として分かりやすい。
- source_word: אָחִיךָ
  choice: 兄の
  rationale: 字義は「あなたの兄弟の」。文脈上は兄エサウを指すため、日本語では「兄の」とするのが明確で自然である。
