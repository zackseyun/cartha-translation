source:
  edition: WLC
  text: עַד שׁ֨וּב אַף אָחִ֜י/ךָ מִמְּ/ךָ֗ וְ/שָׁכַח֙ אֵ֣ת אֲשֶׁר עָשִׂ֣יתָ לּ֔/וֹ וְ/שָׁלַחְתִּ֖י וּ/לְקַחְתִּ֣י/ךָ מִ/שָּׁ֑ם לָ/מָ֥ה אֶשְׁכַּ֛ל גַּם שְׁנֵי/כֶ֖ם י֥וֹם אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/045.yaml
  text: until your brother’s anger turns away from you[a], and he forgets what you have done to him. Then I will send and bring you from there[c][b]. Why should I be bereaved of both of you in one day?
translation:
  language: ja
  text: あなたの兄の怒りがあなたから去り[a]、あなたが彼にしたことを彼が忘れるまでです。そうしたら、私は人を遣わして、あなたをそこから連れて来ます[b]。どうして一日に、あなたがた二人を失うのでしょう[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「あなたの兄の怒りがあなたから向きを変える」。ヘブライ語では「戻る、向きを変える」という動詞が怒りについて用いられています。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は字義的には「あなたをそこから取る（連れて来る）」。本文では「連れて来ます」と訳しています。
    reason: lexical_alternative
  - marker: c
    text: 「一日に、あなたがた二人を失う」とは、兄弟の争いの結果としてリベカが二人の息子をともに失う恐れを表していると考えられますが、二人を同じ仕方で失うという意味とは限りません。
    reason: cultural_note
lexical_decisions:
- source_word: עַד שׁוּב אַף אָחִיךָ מִמְּךָ
  choice: あなたの兄の怒りがあなたから去るまで
  rationale: שׁוב は基本的に「戻る、向きを変える」だが、怒りを主語とし מן を伴うこの文脈では、現代日本語の慣用として「怒りがあなたから去る」とした。時間的限界を示す עַד も「まで」で保持した。
- source_word: וְשָׁכַח אֵת אֲשֶׁר עָשִׂיתָ לוֹ
  choice: あなたが彼にしたことを彼が忘れる
  rationale: 原文の行為者、対象、既になされた行為を過不足なく自然な日本語で示した。
- source_word: וְשָׁלַחְתִּי
  choice: 私は人を遣わして
  rationale: 目的語が明示されない「遣わす」を日本語で自然にし、後続の「連れ戻す」との手段関係を表した。
- source_word: וּלְקַחְתִּיךָ מִשָּׁם
  choice: あなたをそこから連れ戻します
  rationale: לקח の基本義は「取る、連れて行く」だが、リベカのもとから逃れたヤコブを「そこから」再び迎える文脈上、日本語では「連れ戻す」が方向を自然に伝える。
- source_word: לָמָה אֶשְׁכַּל
  choice: どうして…失わなければならないのでしょう
  rationale: שכל は子を失って親がその死を嘆くことを表すが、「子に先立たれる」は死亡の仕方を強く限定しうるため、文脈に開かれた「失う」とし、למה と未完了形の嘆きを修辞疑問で表した。
- source_word: גַּם שְׁנֵיכֶם יוֹם אֶחָד
  choice: 一日のうちに、あなたがた二人を
  rationale: 「二人とも」と単一の日に重なる喪失を明確にしつつ、日本語として自然な語順にした。
theological_decisions:
- issue: 「二人を失う」が指す具体的な結果
  choice: 本文では具体的な死因や法的結果を特定しない
  alternative: エサウがヤコブを殺し、その報復でエサウも死ぬことを本文に明示する
  rationale: 原文はリベカが二人の息子を同じ日に失うことだけを述べ、二人を失う経路が同一かどうか、また具体的な因果関係を明示していないため、曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的ながら、母の切迫した嘆きにふさわしい品位ある敬体を用いた。「憤り」より一般読者に明快な「怒り」、「喪に服する／子に先立たれる」より解釈を限定しない「失う」を採用した。
