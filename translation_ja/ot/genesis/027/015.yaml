base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/015.yaml
  text: Then Rebekah took the choice garments of Esau her older son[a], which were with her in the house[b], and put them on Jacob her younger son.
translation:
  language: ja
  text: そこでリベカは、家にあった[b]年上の息子エサウの上等な衣服[a]を取り、年下の息子ヤコブにそれを着せた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エサウの最上の衣服」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼女とともに家にあった」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: そこで……取った
  rationale: ワウ継続法による物語の進行と順序を、自然な現代日本語で表した。
- source_word: בִּגְדֵי עֵשָׂו
  choice: エサウの……衣服
  rationale: בֶּגֶד の複数形は衣類を指す。「衣服」は物語の格調を保ちつつ現代日本語として明瞭である。
- source_word: הַחֲמֻדֹת
  choice: 上等な
  rationale: 「好ましい、価値ある、選りすぐりの」という意味を衣服の文脈に即して表した。「最上の」とまでは限定しない。
- source_word: בְּנָהּ הַגָּדֹל
  choice: 兄の息子
  rationale: גָּדוֹל と קָטָן の対比は兄弟間の年長・年少を示す。日本語では後続の「弟の息子」と対応させて自然に表した。
- source_word: אֲשֶׁר אִתָּהּ בַּבָּיִת
  choice: 家の中で自分の手元に置いてあった
  rationale: 直訳的な「家で彼女と共にあった」が示す所在・所持を自然に表現した。ただし「保管していた」という意図までは読み込まない。
- source_word: וַתַּלְבֵּשׁ
  choice: 着せた
  rationale: 使役的に、衣服をヤコブに着用させたことを簡潔かつ自然に表す。
- source_word: בְּנָהּ הַקָּטָן
  choice: 弟の息子ヤコブ
  rationale: קָטָן は体格ではなく兄弟間の年少者を指すため「弟」とした。
