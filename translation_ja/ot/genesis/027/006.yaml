  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/רִבְקָה
  choice: リベカは
  rationale: 接続詞וְは物語の流れをつなぐが、日本語では節冒頭の「そして」を省くほうが自然であり、連続性は文脈から明らかである。固有名は日本語聖書で一般的な「リベカ」とした。
- source_word: אָמְרָה אֶל יַעֲקֹב בְּנָהּ
  choice: 息子ヤコブに言った
  rationale: ヤコブがリベカの息子であるという同格関係を、自然な日本語の語順で明示した。אָמַרは直接話法の導入として標準的な「言った」とした。
- source_word: הִנֵּה
  choice: いいですか
  rationale: 後続の発言へ注意を促す談話機能を、現代日本語で自然かつ節度ある呼びかけとして表した。「見よ」はこの聴覚的文脈では硬く、「聞きなさい」は意味を聴覚に限定しすぎる。
- source_word: שָׁמַעְתִּי
  choice: 私は…聞きました
  rationale: 完了した知覚を表す完了形を、文脈に合う丁寧な過去形で訳した。
- source_word: אֶת אָבִיךָ
  choice: あなたの父が
  rationale: ヘブライ語では「聞いた」の目的語だが、日本語では引用内容を導く従属節の主語として「が」を用いるのが自然である。
- source_word: מְדַבֵּר אֶל עֵשָׂו אָחִיךָ
  choice: 兄のエサウに…話している
  rationale: 分詞が表す進行中の発話を「話している」で保持した。エサウがヤコブの兄であることを、文脈に即した自然な日本語で示した。
- source_word: לֵאמֹר
  choice: こう
  rationale: 末尾のלֵאמֹרが次節の引用を導く働きを「こう」で表し、「話している、言うには」のような不自然な重複を避けた。
