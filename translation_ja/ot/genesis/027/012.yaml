source:
  edition: WLC
  text: אוּלַ֤י יְמֻשֵּׁ֨/נִי֙ אָבִ֔/י וְ/הָיִ֥יתִי בְ/עֵינָ֖י/ו כִּ/מְתַעְתֵּ֑עַ וְ/הֵבֵאתִ֥י עָלַ֛/י קְלָלָ֖ה וְ/לֹ֥א בְרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/012.yaml
  text: Perhaps my father will feel me[a], and I will seem to him like a deceiver[b], and I will bring a curse on myself and not a blessing.
translation:
  language: ja
  text: もしかすると、父が私に触れ[a]、私は父の目に人を欺く者[b]と映るかもしれません。そうすれば、私は祝福ではなく呪いを自分の身に招いてしまいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「父が私を手で探る」。ヘブライ語の動詞は、手で触れて感じ取ることを指す。
    reason: lexical_alternative
  - marker: b
    text: または「人をからかう者」「人を惑わす者」。このヘブライ語表現は、人を欺いたり、相手を愚弄したりする者を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלַי
  choice: もしかすると
  rationale: ヤコブが恐れている可能性を示す語。現代日本語として自然で、原文の不確実性を保つ。
- source_word: יְמֻשֵּׁנִי
  choice: 私に触れて確かめ
  rationale: מששは手で触れて調べることを表す。単なる接触ではなく、イサクが身体に触れて身元を確かめる文脈を明確にした。
- source_word: וְהָיִיתִי בְעֵינָיו
  choice: 私は父の目に…と映る
  rationale: 直訳的な「彼の目に」を生かしつつ、評価・認識を示すヘブライ語の慣用表現を自然な日本語にした。
- source_word: כִּמְתַעְתֵּעַ
  choice: 人を欺く者
  rationale: 人を惑わせ、欺く者という文脈上の意味を表す。「からかう者」という可能性も脚注に残した。
- source_word: וְהֵבֵאתִי עָלַי
  choice: 自分の身に招く
  rationale: 使役形と前置詞句が表す、自らに結果をもたらすという意味を自然な日本語で表現した。
- source_word: קְלָלָה וְלֹא בְרָכָה
  choice: 祝福ではなく、呪い
  rationale: 呪いと祝福の明瞭な対照を保ちながら、日本語として自然な対比の順序に整えた。
