id: GEN.27.37
reference: Genesis 27:37
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֨עַן יִצְחָ֜ק וַ/יֹּ֣אמֶר לְ/עֵשָׂ֗ו הֵ֣ן גְּבִ֞יר שַׂמְתִּ֥י/ו לָ/ךְ֙ וְ/אֶת כָּל אֶחָ֗י/ו נָתַ֤תִּי ל/וֹ֙ לַ/עֲבָדִ֔ים וְ/דָגָ֥ן וְ/תִירֹ֖שׁ סְמַכְתִּ֑י/ו וּ/לְ/כָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה בְּנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/037.yaml
  text: Isaac answered and said to Esau[a], “Look, I have made him master over you, and I have given all his brothers to him as servants. I have sustained him with grain and new wine. What then can I do for you[c][b], my son?”
translation:
  language: ja
  text: イサクはエサウに答えた。「見よ、私は彼をおまえの主人とし、彼の兄弟たちを皆、僕として彼に与えた[b]。また、穀物と新酒で彼を支えた[a]。それでは[c]、息子よ、私はおまえのために何ができようか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「穀物と新酒を彼にあてがった」とも訳せる。ヘブライ語の動詞は、支えることにも、必要なものを供給することにも重点を置きうる。
    reason: lexical_alternative
  - marker: b
    text: 「彼の兄弟たちを皆、奴隷として彼に与えた」とも訳せる。ヘブライ語の語は、文脈により「僕」と「奴隷」のどちらも表しうる。
    reason: lexical_alternative
  - marker: c
    text: 「では、いったい」とも訳せる。
    reason: previous_rendering
lexical_decisions:
- source_word: וַיַּעַן
  choice: 答えた
  rationale: 対話における応答を導く標準的な物語表現。ヘブライ語の「答えて言った」を、現代日本語として自然に簡潔化した。
- source_word: הֵן
  choice: 見よ
  rationale: 注意を促し、続く発言を強調する間投詞。荘重さを保ちつつ、原文の指示的な力を伝える。
- source_word: גְּבִיר
  choice: 主人
  rationale: 他者の上に立つ権威者を指す。この家族内の支配関係に適し、神的称号を連想させる語を避ける。
- source_word: שַׂמְתִּיו לָךְ
  choice: 私は彼をおまえの主人とし
  rationale: שׂיםと述語名詞による地位への任命を表し、ヤコブがエサウの上に置かれた関係を明示する。
- source_word: כָּל אֶחָיו
  choice: 彼の兄弟たちを皆
  rationale: 複数形の親族語を狭めたり言い換えたりせず、そのまま保持する。
- source_word: לַעֲבָדִים
  choice: 僕として
  rationale: 従属して仕える者という文脈上の焦点を表す。「奴隷」も語義上可能なため脚注に示す。
- source_word: דָגָן
  choice: 穀物
  rationale: 穀類の産物を広く指す語として、現代日本語で明瞭な訳語。
- source_word: תִּירֹשׁ
  choice: 新酒
  rationale: 収穫に結びついた新しいぶどう酒を簡潔に表し、一般的な「ぶどう酒」より農産物としての含みを保つ。
- source_word: סְמַכְתִּיו
  choice: 彼を支えた
  rationale: 原義の「支える、支援する」を保ちながら、穀物と新酒による扶養・供給の意味も文脈から伝わる表現。
- source_word: וּלְכָה אֵפוֹא
  choice: それでは
  rationale: すでに与えた祝福の帰結へ移る接続と推論の働きを、自然な現代日本語で表す。
- source_word: מָה אֶעֱשֶׂה
  choice: 何ができようか
  rationale: 祝福をすでに与えた後の実際上の不能を示す修辞疑問として訳した。
- source_word: בְּנִי
  choice: 息子よ
  rationale: 父から子への直接的で情愛を含む呼びかけを保持する。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、父祖物語の荘重さを「見よ」「息子よ」「何ができようか」で保った。主従関係と、すでに与えられた祝福を取り戻せない緊張を説明的に解消せず、そのまま表現した。
