  text: He said[a], “Are you really my son Esau?” And he said, “I am.”
translation:
  language: ja
  text: イサクは言った[a]。「おまえは本当にわたしの息子エサウなのか。」ヤコブは言った。「わたしです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語で直訳すると、「あなたはこれか、わたしの子エサウよ」。本人であるかを強く確かめる問い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: イサクは言った
  rationale: 話者は文脈上イサクであり、日本語では主語を明示すると短いやり取りが分かりやすい。接続詞וַは物語の進行を示すため、ここでは独立した「そして」を置かない。
- source_word: אַתָּה זֶה
  choice: おまえは本当に…なのか
  rationale: 独立代名詞と指示語の組み合わせによる強い同一性確認を、自然な現代日本語で表した。
- source_word: בְּנִי
  choice: わたしの息子
  rationale: 一人称単数接尾辞を伴う名詞の意味を明示的に保った。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 日本語聖書で一般的な固有名表記を用いた。
- source_word: וַיֹּאמֶר
  choice: ヤコブは答えた
  rationale: 原語は単に「言った」だが、応答であることを日本語として自然に示した。話者は文脈上ヤコブである。
- source_word: אָֽנִי
  choice: そうです
  rationale: 同一性を問う質問に対する短い肯定の自己同定として、直訳的な「わたしです」より自然な日本語を選んだ。
