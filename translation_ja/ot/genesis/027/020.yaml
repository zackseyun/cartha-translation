  text: וַ/יֹּ֤אמֶר יִצְחָק֙ אֶל בְּנ֔/וֹ מַה זֶּ֛ה מִהַ֥רְתָּ לִ/מְצֹ֖א בְּנִ֑/י וַ/יֹּ֕אמֶר כִּ֥י הִקְרָ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/020.yaml
  text: Then Isaac said to his son[a], “How is it that you found it so quickly, my son?” And he said[b], “Because Yahweh your God caused it to happen before me.”
translation:
  language: ja
  text: イサクは息子に言った。「どうしてそんなに早く見つけたのだ、わが子よ。」すると彼は答えた。「あなたの神ヤハウェが、私の前にそれが起こるようにしてくださったからです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたの神ヤハウェが、私のために事を整えてくださったからです」。原文は字義的には「私の前に起こらせた」で、神がその出来事を生じるようにしたことを表す。
    reason: הִקְרָה ... לְפָנַי の使役的な表現には、「私の前に起こるようにした」と「私のために事を整えた」の両方の訳し方がありうるため。
lexical_decisions:
- source_word: מַה זֶּה מִהַרְתָּ לִמְצֹא
  choice: どうしてこんなに早く見つけられたのだ
  rationale: 驚きを伴う問いを自然な現代日本語で表した。מִהַרְתָּ の「急ぐ」と לִמְצֹא の「見つける」を、日本語では結果に焦点を当てて統合した。目的語は文脈から明らかなため補わない。
- source_word: בְּנִי
  choice: わが子よ
  rationale: 一人称単数の所有接尾辞と呼びかけの温かみを保ちつつ、威厳ある自然な日本語とした。
- source_word: הִקְרָה ... לְפָנַי
  choice: 私の前に巡り合わせてくださった
  rationale: הִקְרָה の使役的な意味と、לְפָנַי の字義的な「私の前に」をともに生かした。「巡り合わせる」により、何かを物理的に運んだと限定せず、出来事を生じさせたという含みを表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: אֱלֹהֶיךָ
  choice: あなたの神
  rationale: 二人称男性単数接尾辞を明示し、ヤコブが「私たちの神」や「私の神」ではなく「あなたの神」と述べる物語上の緊張を保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有名を保持し、称号への置換を避けた。
- issue: הִקְרָה における神の働きのニュアンス
  choice: 私の前に巡り合わせてくださった
  alternative: 私のためにうまく事を運んでくださった
  rationale: 神による使役・摂理の含みを示しつつ、原文にない具体的な「成功」や物理的な運搬まで読み込まないようにした。
- issue: 「あなたの神」という表現
  choice: あなたの神
  alternative: 私たちの神
  rationale: 二人称接尾辞をそのまま訳し、ヤコブの発言が生む神学的・物語的緊張を解消しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、父子の会話にふさわしい自然さと聖書本文としての品位を両立させた。イサクの驚き、二度の「息子／わが子」、およびヤコブの「あなたの神」という距離を感じさせる言い方を保持した。
