  text: הָבִ֨יאָ/ה לִּ֥/י צַ֛יִד וַ/עֲשֵׂה לִ֥/י מַטְעַמִּ֖ים וְ/אֹכֵ֑לָה וַ/אֲבָרֶכְ/כָ֛ה לִ/פְנֵ֥י יְהוָ֖ה לִ/פְנֵ֥י מוֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/007.yaml
  text: Bring me game and make me tasty food[b][a], so that I may eat and bless you before Yahweh before I die.’
translation:
  language: ja
  text: 「獲物を私のところへ持ってきて、私のためにおいしい料理を作ってくれ。そうすれば、私が食べ、死ぬ前にヤハウェの前でおまえを祝福しよう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבִיאָה לִי צַיִד
  choice: 獲物を持って来て
  rationale: צַיִדは狩りで得た獲物を指す。「鹿肉」と限定せず、文脈に即して自然に訳した。
- source_word: וַעֲשֵׂה לִי מַטְעַמִּים
  choice: 私のためにおいしい料理を作っておくれ
  rationale: מַטְעַמִּיםは特別に調理された美味な料理を表す。命令形は、父が息子に語る場面に合う依頼調の「作っておくれ」とした。
- source_word: וְאֹכֵלָה וַאֲבָרֶכְכָה
  choice: それを食べ、…おまえを祝福しよう
  rationale: 二つのコホルタティブが表す話者の意志・意図を「食べ」「祝福しよう」で自然に示した。
- source_word: לִפְנֵי יְהוָה
  choice: 主の前で
  rationale: לִפְנֵיの臨在・面前の意味を保ち、神名は日本語聖書で広く理解される「主」とした。
- source_word: לִפְנֵי מוֹתִי
  choice: 死ぬ前に
  rationale: 字義を保ちながら、現代日本語として自然な節にした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 本文では日本語の慣用的な神名表記「主」を用い、原文が固有の神名יהוהであることを脚注で明示した。特定の発音再建を本文で断定しない。
- issue: 「主の前で」が祝福にかかること
  choice: 主の前でおまえを祝福しよう
  alternative: 主の御前でおまえを祝福しよう
  rationale: 原文の語順と意味関係を保ち、この祝福が神の面前で行われるという表現を明確にした。
translation_notes:
  register: 明瞭で品位ある現代標準語。父が息子に語る口調として「おくれ」「おまえ」を用い、古風になりすぎない範囲で家父長的な場面の調子を保った。
