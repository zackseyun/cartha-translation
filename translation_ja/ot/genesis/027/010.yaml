  yaml_path: translation/ot/genesis/027/010.yaml
  text: Then you shall bring it to your father, and he will eat, so that he may bless you before his death.
translation:
  language: ja
  text: それをお父さんのところへ持って行きなさい。お父さんがそれを食べ、死ぬ前にあなたを祝福してくださるためです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: 持って行きなさい
  rationale: 接続詞付き完了形が一連の指示を表しているため、文脈に即して自然な命令表現とした。
- source_word: לְאָבִיךָ
  choice: お父さんのところへ
  rationale: 父に向かって料理を運ぶ動作を、現代日本語で自然に表した。母が息子に語る場面なので「お父さん」とした。
- source_word: וְאָכָל
  choice: お父さんがそれを食べ
  rationale: 先行する行為に続いて期待される動作を表す。日本語では目的節へ自然につなぐ連用形とした。目的語「それ」は文脈から補った。
- source_word: בַּעֲבֻר אֲשֶׁר
  choice: ためです
  rationale: 目的を導く複合表現として理解し、計画の意図が明確になる自然な日本語にした。
- source_word: יְבָרֶכְךָ
  choice: あなたを祝福してくださる
  rationale: ピエル形の基本的意味「祝福する」を保った。父の行為を息子の受益として語る日本語として「くださる」を用いた。
- source_word: לִפְנֵי מוֹתוֹ
  choice: 死ぬ前に
  rationale: 字義は「彼の死の前に」だが、現代日本語では動詞表現が明快で自然であり、時間的意味を正確に保つ。
