  - severity: low
    issue: 末尾の修辞疑問がやや不自然
    rationale: 「私は生きていて何になるでしょう」より、「私にとって、生きることに何の意味があるでしょう」のほうが、לָמָּה לִּי חַיִּיםの価値を問う嘆きを自然な日本語で表せる。
