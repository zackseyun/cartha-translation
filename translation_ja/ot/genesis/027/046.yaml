  text: וַ/תֹּ֤אמֶר רִבְקָה֙ אֶל יִצְחָ֔ק קַ֣צְתִּי בְ/חַיַּ֔/י מִ/פְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם לֹקֵ֣חַ יַ֠עֲקֹב אִשָּׁ֨ה מִ/בְּנֽוֹת חֵ֤ת כָּ/אֵ֨לֶּה֙ מִ/בְּנ֣וֹת הָ/אָ֔רֶץ לָ֥/מָּה לִּ֖/י חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/046.yaml
  text: Then Rebekah said to Isaac[a], “I am weary of my life because of the daughters of Heth. If Jacob takes a wife from the daughters of Heth like these, from the daughters of the land, what is life to me?”
translation:
  language: ja
  text: リベカはイサクに言った。「私は、ヘトの娘たち[a]のために、生きることにうんざりしています。もしヤコブが、この土地の娘たちの中から、このようなヘトの娘たちを妻に迎えるなら、私にとって、生きることに何の意味があるでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヘトの娘たち」は、「ヘト人の女たち」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַצְתִּי בְחַיַּי
  choice: 生きているのが嫌になりました
  rationale: קוץ は嫌悪や苦痛のため耐え難く思うことを表す。日本語では、人生そのものへの深い厭わしさを自然に伝えつつ、「死にたい」とまで意味を限定しない表現とした。
- source_word: מִפְּנֵי
  choice: 〜のことで
  rationale: ここでは空間的意味ではなく原因を示す。「〜のことで」は会話として自然で、リベカの苦悩の原因を明確にする。
- source_word: בְּנוֹת חֵת
  choice: ヘトの娘たち
  rationale: 原文の父祖名に基づく民族表現を保った。「ヘト人の女たち」という意味は脚注で示す。
- source_word: אִם לֹקֵחַ יַעֲקֹב אִשָּׁה
  choice: もしヤコブが…妻を迎えるなら
  rationale: 「妻を取る」の意味だが、現代日本語で自然かつ品位のある婚姻表現として「妻を迎える」とした。
- source_word: כָּאֵלֶּה
  choice: このような
  rationale: すでに念頭にある同種の女性たちを指す指示表現をそのまま保つ。
- source_word: מִבְּנוֹת הָאָרֶץ
  choice: この土地の娘たち
  rationale: 原文の「土地の娘たち」という社会的・血縁的な表現を保ちつつ、定冠詞を文脈に即して「この」とした。
- source_word: לָמָּה לִּי חַיִּים
  choice: 私は生きていて何になるでしょう
  rationale: 直訳的な「私にとって命が何になろうか」という修辞疑問を、価値を見いだせない嘆きとして自然な日本語にした。「生きる意味がない」や「死んだほうがよい」と断定して原文以上に限定することは避けた。
theological_decisions:
- issue: חֵת の民族呼称
  choice: 本文では「ヘトの娘たち」を保持する
  alternative: 「ヘト人の女たち」
  rationale: 原文の系譜的な言い方と固有名ヘトを保ち、民族名としての意味は脚注に示す。
- issue: 最後の修辞疑問の強さ
  choice: 「私は生きていて何になるでしょう」
  alternative: 「生きていて何の意味があるでしょう」／「どうして生きていられるでしょう」
  rationale: 人生の価値を問う強い嘆きを伝えながら、自死願望など原文が明示しない意味に限定しない。
translation_notes:
  register: 夫に訴えるリベカの強い嫌悪と嘆きを、現代の読者に明瞭な、丁寧で切迫した会話体で表した。原文の反復は保ちながら、日本語で関係が分かるよう「すなわち」で同格関係を示した。脚注記号は節末に置き、本文中の「ヘトの娘たち」二例の双方に関わる注とした。
