base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/001.yaml
  text: It happened that when Isaac was old and his eyes were too dim to see[a], he called Esau his older son and said to him, “My son,” and he said to him, “Here I am.”
translation:
  language: ja
  text: イサクは年老い、目がかすんで見えなくなっていた。そこで、年長の息子エサウ[a]を呼び、「息子よ」と言った。エサウは「はい、ここにいます」と答えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「長男エサウ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: ～ていた。そこで
  rationale: 新しい場面を導入し、その時の状況を示す表現。日本語では独立した「さて」などを足さず、背景説明から主動作へ自然につないだ。
- source_word: זָקֵן
  choice: 年老い
  rationale: イサクが高齢になったことを、簡潔で自然な現代日本語で表した。
- source_word: וַתִּכְהֶיןָ עֵינָיו מֵרְאֹת
  choice: 目がかすんで見えなくなっていた
  rationale: 目が弱って視覚が損なわれたという意味を明確にし、身体部位を主語とするヘブライ語の表現も保った。
- source_word: וַיִּקְרָא
  choice: 呼び
  rationale: この文脈の קרא は、そばへ来るよう呼ぶことを表す。「呼び」は「召し寄せ」より平明で、意味を過度に形式化しない。
- source_word: אֶת־עֵשָׂו בְּנוֹ הַגָּדֹל
  choice: 年上の息子エサウ
  rationale: הַגָּדֹל はここではヤコブに対して年長であることを示す。「年上の息子」は関係的な意味を直接表し、「長男」も可能であるため脚注に示した。
- source_word: בְּנִי
  choice: 息子よ
  rationale: 一人称接尾辞を含む親しい呼びかけを、日本語として自然な形にした。
- source_word: הִנֵּנִי
  choice: はい、ここにおります
  rationale: 話し手の所在と応答する用意を示す定型句。丁寧さを保ちつつ、単なる「はい」より原文の「ここにいる」を明示した。
