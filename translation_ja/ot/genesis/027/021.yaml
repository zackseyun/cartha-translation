base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/021.yaml
  text: Then Isaac said to Jacob[a], “Please come near, that I may feel you, my son, whether you are really my son Esau or not.”
translation:
  language: ja
  text: そこでイサクはヤコブに言った。「さあ、近くに来ておくれ。わが子よ、おまえに触れて、おまえが本当にわたしの子エサウなのかどうか確かめたい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこでイサクはヤコブに言った
  rationale: 物語を進めるワウ連続法を、直前の流れを受ける自然な日本語「そこで」で表した。
- source_word: גְּשָׁה נָּא
  choice: 近くに来てくれ
  rationale: 命令形 גְּשָׁה の「近づく」と、依頼・懇願を和らげる נָּא のニュアンスを、父から息子への自然な依頼表現で示した。
- source_word: וַאֲמֻשְׁךָ
  choice: 触って確かめたい
  rationale: מושׁ は手で触れて調べることを表す。この文脈では、触覚によって本人かどうかを確かめる意図が明白なので、単なる「触る」より文脈に即した自然な表現とした。
- source_word: בְּנִי
  choice: わが子よ／わたしの子
  rationale: 最初は呼びかけとして「わが子よ」、後はエサウとの同格的な身分表示として「わたしの子」とし、ヘブライ語の反復を保った。
- source_word: הַאַתָּה זֶה
  choice: おまえが本当に…なのか
  rationale: 疑問辞と代名詞・指示語の組み合わせが示す、目の前の人物の正体を探る疑念を、自然な日本語で表した。
- source_word: בְּנִי עֵשָׂו
  choice: わたしの子エサウ
  rationale: בְּנִי と固有名詞エサウの同格関係を明瞭に保った。
- source_word: אִם לֹא
  choice: そうでないのか
  rationale: 選択疑問の後半「あるいはそうでないか」を、前半と釣り合う自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いながら、父が息子に語る場面にふさわしい落ち着いた口調と、イサクの疑念を保った。「わが子よ」は関係性の温かさを示し、「触って確かめたい」は行為の目的を日本語として自然に伝える。
