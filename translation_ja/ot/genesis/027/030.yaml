base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/030.yaml
  text: And it happened that as soon as Isaac had finished blessing Jacob[a], and Jacob had just gone out from the presence of Isaac his father[b], Esau his brother came in from his hunting.
translation:
  language: ja
  text: イサクがヤコブを祝福し終え、ヤコブが父イサクの前から出て行った直後[a]、兄のエサウが狩りから帰って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「ただ出て行った、出て行った」。ヘブライ語は同じ動詞を強調する形で重ね、ヤコブが出た直後であったことを際立たせている。
    reason: source_form
lexical_decisions:
- source_word: וַיְהִי ... וַיְהִי
  choice: （独立した訳語を重ねず、文全体の時間的展開で表現）
  rationale: 二度の וַיְהִי は物語を進め、出来事が相次いだことを示す。日本語で「そして、こうなった」を反復すると不自然なため、一文の流れに織り込んだ。
- source_word: כַּאֲשֶׁר כִּלָּה ... לְבָרֵךְ
  choice: 祝福し終え
  rationale: כלה と不定詞の組み合わせは、祝福する行為の完了を表す。「祝福し終える」が簡潔で自然。
- source_word: אַךְ יָצֹא יָצָא
  choice: 出て行った直後
  rationale: אַךְ と不定詞絶対形＋定動詞は、ヤコブが出た直後という時間の切迫を強調する。現代日本語では「直後」がその効果を自然に伝える。
- source_word: מֵאֵת פְּנֵי יִצְחָק אָבִיו
  choice: 父イサクの前から
  rationale: 「顔の前から」という空間的・対人的な表現を、日本語として自然な「前から」で保った。
- source_word: וְעֵשָׂו אָחִיו
  choice: 兄のエサウ
  rationale: אָחִיו は「彼の兄弟」。文脈上エサウがヤコブの兄であることが明確なので、日本語で自然な親族表現とした。
- source_word: בָּא מִצֵּידוֹ
  choice: 狩りから帰って来た
  rationale: ציד は「狩り」または「獲物」を表し得るが、前置詞 מן と移動動詞 בוא の組み合わせでは、狩りという活動から戻った意味が文脈に最もよく合う。
