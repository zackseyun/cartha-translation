  terminology: 「仕える」「ひれ伏す」「主人」は適切である。「ひれ伏す」は人間の上位者への服従・敬意を表す原文の語義を過度に神学化しない。「主人」は神への称号としての「主」と区別できるが、支配・優位の意味を補足する脚注を付すのが有益である。
