id: GEN.27.29
reference: Genesis 27:29
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: יַֽעַבְד֣וּ/ךָ עַמִּ֗ים ו/ישתחו לְ/ךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְ/אַחֶ֔י/ךָ וְ/יִשְׁתַּחֲוּ֥וּ לְ/ךָ֖ בְּנֵ֣י אִמֶּ֑/ךָ אֹרְרֶ֣י/ךָ אָר֔וּר וּֽ/מְבָרֲכֶ֖י/ךָ בָּרֽוּךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/029.yaml
  text: Let peoples serve you[a], and nations bow down to you. Be master over your brothers, and let your mother's sons bow down to you. Cursed be those who curse you[b], and blessed be those who bless you.
translation:
  language: ja
  text: 諸民族があなたに仕え、国々があなたにひれ伏しますように[a]。あなたが兄弟たちの主人となり[b]、母の子らがあなたにひれ伏しますように。あなたを呪う者は呪われますように。あなたを祝福する者は祝福されますように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ひれ伏す」とも訳せる語は、神への礼拝だけでなく、人間の上位者に対する敬意や服従を示して身を伏せることにも用いられる。ここでは後者の意味である。
    reason: lexical_alternative
  - marker: b
    text: あるいは「兄弟たちの支配者となり」。原文は、兄弟たちに対する優位・支配的地位を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעַבְדוּךָ
  choice: おまえに仕え
  rationale: 動詞 עבד のカル形に二人称男性単数の目的語接尾辞が付き、この祝福では単なる労働ではなく、服従を伴う奉仕を表す。「仕える」はその幅を自然に保つ。
- source_word: עַמִּים
  choice: 諸国の民
  rationale: 複数の民族・民を指す集合的な語。続く לְאֻמִּים との詩的並行を保ちつつ、現代日本語で分かりやすくした。
- source_word: וְיִשְׁתַּחֲווּ לְךָ
  choice: おまえの前にひれ伏すように
  rationale: שׁחה／השתחוה は身を伏せて敬意や服従を示す行為を表し、神にも人にも用いられる。ここでは人間である受け手への服従なので、「礼拝する」と限定せず身体的行為を示す。
- source_word: לְאֻמִּים
  choice: 国々
  rationale: עַמִּים と並行する諸民族・諸国民の語。「国々」として読みやすい変化をつけた。
- source_word: הֱוֵה גְבִיר
  choice: 主人となり
  rationale: הוה と述語名詞による命令・祈願的表現。גְבִיר は支配的地位にある主人を指す。「主」は神の称号と混同しやすいため避けた。
- source_word: לְאַחֶיךָ
  choice: 兄弟たちの
  rationale: גְבִיר と לְ の構文は、兄弟たちに対して主人・支配者の立場に立つことを示す。日本語では「兄弟たちの主人」が自然。
- source_word: בְּנֵי אִמֶּךָ
  choice: 母の息子たち
  rationale: 直訳的な親族表現を保ち、「兄弟たち」から母を同じくする者たちへと言い換える原文の表現を残した。
- source_word: אֹרְרֶיךָ אָרוּר
  choice: おまえを呪う者は呪われ
  rationale: 分詞と受動的述語による対応的な呪いの定型句。単複の形式差は日本語では自然に集合的に表した。
- source_word: וּמְבָרֲכֶיךָ בָּרוּךְ
  choice: おまえを祝福する者は祝福されるように
  rationale: 直前の呪いと対をなす祝福の定型句。原文の祈願的な力を「ように」で表した。
theological_decisions:
- issue: 人間に向けられる שׁחה の表現
  choice: ひれ伏す
  alternative: 拝む／礼拝する／敬意を表する
  rationale: この動詞は神への礼拝にも人間の上位者への敬礼・服従にも用いられる。ここではイサクが子に与える政治的・家族的優位の祝福であるため、「礼拝する」と神的崇拝に限定せず、行為そのものを示す「ひれ伏す」とした。
- issue: גְבִיר の称号
  choice: 主人
  alternative: 主／支配者
  rationale: 兄弟に対する優位と統治を表すが、神への称号「主」との不要な混同を避けつつ、家族的な主従関係を表せる語を選んだ。
translation_notes:
  register: 荘重さを保ちながら、明瞭な現代標準日本語とした。父から子への直接の呼びかけは、文脈上の上下関係と古代的な祝福の調子を自然に示す「おまえ」で統一した。命令形の הֱוֵה と未完了形による祈願は、日本語では「となり」「ように」を組み合わせて表現した。
