lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると、…言った
  rationale: 物語を進めるワウ継続法の順次性を、自然な現代日本語の語り口で表した。
- source_word: אֵלָיו
  choice: 彼に
  rationale: 発話の相手を示す前置詞と三人称男性単数接尾辞を、そのまま間接目的語として表した。
- source_word: יִצְחָק אָבִיו
  choice: 父イサク
  rationale: ヘブライ語の同格関係と親子関係への強調を保ちつつ、日本語として自然な語順にした。
- source_word: גְּשָׁה
  choice: 近くに来て
  rationale: 物理的に近寄ることを求める命令の意味を、場面に即した自然な日本語で表した。
- source_word: נָא
  choice: どうか
  rationale: 命令を和らげる依頼の助詞として、丁寧でありながら文脈にふさわしい表現を選んだ。
- source_word: וּשְׁקָה לִּי
  choice: 私に口づけしておくれ
  rationale: נשׁקの命令とלִיが表す相手を明示し、父が息子に親しく願う口調を自然な日本語で再現した。
- source_word: בְּנִי
  choice: わが子よ
  rationale: 呼びかけであることと親愛の響きを保つため、格調を保ちつつ現代の読者にも明瞭な表現とした。
