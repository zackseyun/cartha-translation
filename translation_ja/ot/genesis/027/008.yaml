base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/008.yaml
  text: Now[a], my son[b], listen to my voice as to what I command you.
translation:
  language: ja
  text: さあ、わたしの子よ。わたしの言うことを聞き、わたしが命じるとおりにしなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「今、わたしの子よ、わたしの声を聞き、わたしがあなたに命じるとおりにしなさい」。
    reason: 「声を聞く」という原文の表現と、וְעַתָּה のより形式的な訳を示すため。
lexical_decisions:
- source_word: וְעַתָּה
  choice: さあ
  rationale: 直前の発言を受けて次の指示へ移る談話標識。日本語では「さあ」が即時性と促しを自然に表す。
- source_word: בְּנִי
  choice: わたしの子よ
  rationale: 一人称単数接尾辞を伴う呼格。母が息子ヤコブに呼びかける表現を明示した。
- source_word: שְׁמַע בְּקֹלִי
  choice: わたしの言うことを聞き
  rationale: 直訳は「わたしの声を聞け」だが、ここでは言葉に従うことを含意するヘブライ語の慣用句。「従え」と断定せず、聴従の幅を保った自然な日本語とした。
- source_word: לַאֲשֶׁר
  choice: …とおりに
  rationale: 後続する命令内容と「聞く」を結びつける表現。文脈上、今から告げる命令に従って行動する意味を自然に示す。
- source_word: אֲנִי מְצַוָּה אֹתָךְ
  choice: これから命じる…しなさい
  rationale: 分詞の目前・進行的な力を「これから」で示し、צוה の強い指示を「命じる」で保持した。末尾の「しなさい」は、日本語で命令に従う含意を明瞭にする。
