source:
  edition: WLC
  text: וְ/לֹ֣א הִכִּיר֔/וֹ כִּֽי הָי֣וּ יָדָ֗י/ו כִּ/ידֵ֛י עֵשָׂ֥ו אָחִ֖י/ו שְׂעִרֹ֑ת וַֽ/יְבָרְכֵֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/023.yaml
  text: And he did not recognize him[a], because his hands were hairy like the hands of his brother Esau; so he blessed him.
translation:
  language: ja
  text: イサクは彼がヤコブだと見分けられなかった。ヤコブの手が兄エサウの手のように毛深かったからである。こうして、イサクはヤコブを祝福した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「そして、イサクはヤコブを祝福した」。ヘブライ語の物語形式は単純な出来事の連続とも訳せるが、ここでは結果の意味合いも含んでいる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכִּירוֹ
  choice: ヤコブだとは気づかなかった
  rationale: ヒフィル形の נכר は「見分ける、認める」を意味する。日本語では目的語を代名詞のままにするより、文脈上の人物名を補って「ヤコブだとは気づかなかった」とするほうが明瞭である。
- source_word: כִּי
  choice: からである
  rationale: イサクがヤコブを見分けられなかった理由を導く因果関係を、自然で明確な日本語で示す。
- source_word: יָדָיו
  choice: ヤコブの手
  rationale: 三人称男性単数接尾辞を文脈上の指示対象であるヤコブの名に置き換え、代名詞の曖昧さを避ける。
- source_word: כִּידֵי
  choice: 手のように
  rationale: 接頭辞 כ の比較を、自然な日本語の「〜のように」で表す。
- source_word: אָחִיו
  choice: 兄エサウ
  rationale: אָח は本来「兄弟」だが、エサウがヤコブの兄であるという文脈に即して、現代日本語で関係を明確にする。
- source_word: שְׂעִרֹת
  choice: 毛深かった
  rationale: 手の触感を表す形容詞を簡潔かつ自然に訳し、欺きの要点を保持する。
- source_word: וַיְבָרְכֵהוּ
  choice: こうして、イサクはヤコブを祝福した
  rationale: ワウ連続形が示す物語の進行を保ちつつ、ここでは直前の認識失敗から生じた結果の含みを「こうして」で表す。主語と目的語は日本語での明瞭さのため人物名で示す。
theological_decisions:
- issue: וַיְבָרְכֵהוּ の物語上の関係
  choice: 結果を含む流れとして「こうして」と訳す
  alternative: 単純な継起として「そして」と訳す
  rationale: ヘブライ語の物語形自体は単純な継起とも取れるが、文脈ではイサクがヤコブを見分けられなかったことから祝福へ進む結果的な流れがある。本文ではその含みを示し、別訳を脚注に残す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文では代名詞が重なるが、日本語で指示対象が曖昧にならないよう「イサク」「ヤコブ」を補った。脚注記号は、別訳の対象となる結びの文末に置いた。
