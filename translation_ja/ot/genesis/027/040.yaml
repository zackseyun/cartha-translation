  text: וְ/עַל חַרְבְּ/ךָ֣ תִֽחְיֶ֔ה וְ/אֶת אָחִ֖י/ךָ תַּעֲבֹ֑ד וְ/הָיָה֙ כַּ/אֲשֶׁ֣ר תָּרִ֔יד וּ/פָרַקְתָּ֥ עֻלּ֖/וֹ מֵ/עַ֥ל צַוָּארֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/040.yaml
  text: And by your sword you shall live[a], and you shall serve your brother; but when you break loose, you shall break his yoke from off your neck.
translation:
  language: ja
  text: おまえは剣によって生き、兄に仕える。しかし、おまえが束縛を振りほどくとき[a]、兄のくびきを首から振り落とす。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「おまえが落ち着きを失うとき」。ヘブライ語の動詞 תָּרִיד は意味の確定が難しい。続く「くびきを……振り落とす」という文脈から、ここでは束縛から抜け出す意味に訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל חַרְבְּךָ תִחְיֶה
  choice: おまえは剣によって生き
  rationale: עַלを手段として取り、חֶרֶבの具体的な「剣」の比喩とחיהの「生きる」を保った。
- source_word: וְאֶת אָחִיךָ תַּעֲבֹד
  choice: 兄に仕える
  rationale: עבדの基本義「仕える」を用い、政治的・社会的従属の具体的形態を本文以上に限定しない。文脈上、相手は兄ヤコブなのでאָחを自然な日本語で「兄」とした。
- source_word: וְהָיָה כַּאֲשֶׁר
  choice: しかし、……とき
  rationale: 将来の時を導く構文として訳し、前半からの転換は「しかし」で明示した。
- source_word: תָּרִיד
  choice: 束縛を振りほどく
  rationale: 語義の確定が難しいが、直後のくびきを外す表現との結びつきを踏まえ、支配から抜け出す動きを自然な日本語で表した。別解は脚注に残した。
- source_word: וּפָרַקְתָּ עֻלּוֹ מֵעַל צַוָּארֶךָ
  choice: そのくびきを首から振り落とす
  rationale: פרקの力強い除去、עֹלの具体的比喩、מֵעַל צַוָּארֶךָの身体像を保った。「その」は直前の兄による支配を指す。
theological_decisions:
- issue: エサウとヤコブの将来の関係
  choice: 兄への従属と、その支配から後に離脱する可能性を描く託宣として訳す。
  alternative: 恒久的な隷属、または単なる家族内の敬意として解釈的に訳す。
  rationale: 本文は兄に仕えることと、そのくびきを首から外すことの双方を述べるため、従属と解放の緊張を保ち、後代のエドムに関する神学的結論を持ち込まない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、父が息子に告げる厳粛な託宣として簡潔で格調ある文体を用いた。「あなた」より直接的な「おまえ」を選び、創世記27章の父子間の発話に合う調子とした。
