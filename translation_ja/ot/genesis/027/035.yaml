  yaml_path: translation/ot/genesis/027/035.yaml
  text: And he said[a], “Your brother came with deceit and took your blessing.”
translation:
  language: ja
  text: 父は言った。「おまえの兄弟がだまして来て、おまえの祝福を取った。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると父は言った
  rationale: 物語を進めるワウ継続法を自然な日本語の「すると」で表した。日本語では主語の補足が必要となるため、文脈上の話者イサクを「父」とした。
- source_word: בָּא
  choice: やって来て
  rationale: 完了した到来を表す単純な過去の出来事として訳し、後続動作との自然なつながりを示した。
- source_word: אָחִיךָ
  choice: おまえの兄弟
  rationale: 固有名ヤコブに置き換えず、原文の親族呼称とその修辞的な響きを保った。
- source_word: בְּמִרְמָה
  choice: だまして
  rationale: 前置詞בְּと名詞מִרְמָהが表す手段・様態を、明瞭で自然な現代日本語にした。「欺きによって」より平易でありながら、故意の欺瞞という意味を保つ。
- source_word: וַיִּקַּח
  choice: 奪った
  rationale: לקחは基本的に「取る」だが、この文脈では欺いて本来エサウに与えられるはずだった祝福を取得したことを指すため、「奪った」が自然である。物理的な暴力までは含意しない。
- source_word: בִּרְכָתֶךָ
  choice: おまえの祝福
  rationale: 二人称単数接尾辞を明示し、父からエサウに与えられるはずだった祝福を指す原文の簡潔な表現を保った。
