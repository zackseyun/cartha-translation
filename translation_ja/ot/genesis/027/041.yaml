  text: וַ/יִּשְׂטֹ֤ם עֵשָׂו֙ אֶֽת יַעֲקֹ֔ב עַל הַ֨/בְּרָכָ֔ה אֲשֶׁ֥ר בֵּרֲכ֖/וֹ אָבִ֑י/ו וַ/יֹּ֨אמֶר עֵשָׂ֜ו בְּ/לִבּ֗/וֹ יִקְרְבוּ֙ יְמֵי֙ אֵ֣בֶל אָבִ֔/י וְ/אַֽהַרְגָ֖ה אֶת יַעֲקֹ֥ב אָחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/041.yaml
  text: And Esau hated Jacob because of the blessing with which his father had blessed him[a], and Esau said in his heart, “The days of mourning for my father are drawing near[c][b]; then I will kill Jacob my brother.”
translation:
  language: ja
  text: エサウは、父がヤコブに与えた祝福のために、ヤコブに恨みを抱いた[a]。そしてエサウは心の中で言った。「父のために喪に服す日々が近づいている[b]。その時には、自分の兄弟ヤコブを殺そう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「恨みを抱いた」に当たるヘブライ語は、一時的な嫌悪ではなく、持続する敵意や憎しみを表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「父が嘆き悲しむ日々が近づいている」。ヘブライ語は、イサクの死後に彼のために喪に服す期間とも、イサク自身が嘆き悲しむ期間とも取ることができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂטֹם
  choice: 恨みを抱いた
  rationale: שׂטםは、一時的な感情というより、持続する敵意や恨みを表す。「恨みを抱いた」は、その継続性と、殺意へ至る内面的な敵意を自然な日本語で伝える。
- source_word: עַל הַבְּרָכָה
  choice: その祝福のために
  rationale: 前置詞עַלの原因・理由の意味を明確にし、直前の祝福が恨みの原因であることを示す。
- source_word: אֲשֶׁר בֵּרֲכוֹ אָבִיו
  choice: 父がヤコブを祝福したその祝福
  rationale: 原文にある「祝福する」と「祝福」の反復を保ちつつ、代名詞の指示対象を日本語で明確にした。
- source_word: בְּלִבּוֹ
  choice: 心の中で言った
  rationale: 内心の思考を表すヘブライ語の慣用表現を、意味の通る自然な日本語としてほぼ字義どおりに保持した。
- source_word: יִקְרְבוּ יְמֵי אֵבֶל אָבִי
  choice: 父のために喪に服す日々が近づいている
  rationale: 最も自然な文脈上の理解、すなわちイサクの死後に彼のために喪に服す期間が迫っているという意味を本文に採った。ただし、連語には別の係り受けの可能性があるため脚注で示した。
- source_word: וְאַהַרְגָה
  choice: その時には……殺そう
  rationale: 接続詞の時間的含意と、コホータティブ形が表すエサウの固い意志を、日本語の意向形で表した。
- source_word: אָחִי
  choice: 弟ヤコブ
  rationale: 原文は「私の兄弟」だが、文脈上ヤコブはエサウの双子の弟であり、「弟ヤコブ」が現代日本語として自然で、肉親への殺意という悲劇性も保つ。
theological_decisions:
- issue: イサクに関連する「喪」の解釈
  choice: イサクの死後、彼のために喪に服す日々
  alternative: イサク自身が嘆き悲しむ日々
  rationale: 父の死を待ってからヤコブを殺すという文脈に最もよく合う一方、ヘブライ語の連語そのものには別解の余地があるため、その曖昧さを脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、物語にふさわしい簡潔で重みのある調子を保った。「殺そう」は過度に口語的・扇情的にせず、決意を明確に表す。
