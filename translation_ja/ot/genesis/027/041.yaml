  to: エサウは、父がヤコブに与えた祝福のために、ヤコブに恨みを抱いた[a]。そしてエサウは心の中で言った。「父のために喪に服す日々が近づいている[b]。その時には、自分の兄弟ヤコブを殺そう。」
