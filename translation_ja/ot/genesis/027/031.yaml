base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/031.yaml
  text: He too prepared tasty food and brought it to his father[a], and he said to his father, “Let my father rise and eat of his son's game[b], so that your soul may bless me.”
translation:
  language: ja
  text: 彼もまた、おいしい料理を作って父のもとへ持って来た。そして父に言った。「父上、どうぞお起きになり、息子の獲物を召し上がってください。そうすれば、父上ご自身が私を祝福してくださるでしょう。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたの魂が私を祝福する」。ここでの「魂」は、父上ご自身、すなわち「あなた」を指すヘブライ語の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: מַטְעַמִּים
  choice: おいしい料理
  rationale: この語は、この物語では味よく特別に調理した料理を指す。「おいしい料理」は現代日本語として自然で、章内の反復も保てる。
- source_word: גַּם הוּא
  choice: 彼もまた
  rationale: 先に同じことをしたヤコブとの並行を示す付加的な強調を保つ。
- source_word: יָקֻם אָבִי
  choice: お父さん、起きて
  rationale: 三人称形を用いた丁重な依頼だが、日本語で逐語的に「私の父が起きて」とすると不自然なため、敬意を含む直接の呼びかけとして訳した。
- source_word: מִצֵּיד בְּנוֹ
  choice: 息子の獲物を
  rationale: צַיִד は狩猟で得た獲物を指す。父に対して自分を「息子」と呼ぶ原文の言い方を維持した。
- source_word: בַּעֲבוּר
  choice: そうすれば
  rationale: 食べることを受けて期待される目的・結果を、自然な日本語で示す。
- source_word: נַפְשֶׁךָ תְּבָרֲכַנִּי
  choice: あなたの魂が私を祝福してくださるでしょう
  rationale: נֶפֶשׁ を単に「あなた」と同一視せず、原文の明示的な「あなたの魂」を本文に残す。日本語として特異に響くため脚注で慣用的意味を説明する。
theological_decisions:
- issue: 「あなたの魂」という身体・人格表現
  choice: 本文で「あなたの魂」を保持する
  alternative: 「あなたが私を祝福してくださるように」
  rationale: この箇所の נֶפֶשׁ は人自身を指し得るが、原文の表現と祝福場面の重みを保ちつつ、脚注で意味を明らかにする。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、父への敬意は「お父さん」「召し上がってください」「祝福してくださる」で表した。原文の反復と「あなたの魂」という特徴的な言い回しを保持した。
