  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ/שְׁמֹ֤עַ עֵשָׂו֙ אֶת דִּבְרֵ֣י אָבִ֔י/ו וַ/יִּצְעַ֣ק צְעָקָ֔ה גְּדֹלָ֥ה וּ/מָרָ֖ה עַד מְאֹ֑ד וַ/יֹּ֣אמֶר לְ/אָבִ֔י/ו בָּרֲכֵ֥/נִי גַם אָ֖נִי אָבִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/034.yaml
  text: When Esau heard his father’s words[a], he cried out with an exceedingly great and bitter cry, and said to his father, “Bless me too, my father!”
translation:
  language: ja
  text: エサウは父の言葉を聞くと、この上なく大きく悲痛な叫び声を上げた[a]。そして父に言った。「私も祝福してください、お父さん！」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「この上なく大きく、苦い叫びを叫んだ」。
    reason: 同根語を重ねるヘブライ語の強意表現と、「苦い」という比喩的表現を示すため。
lexical_decisions:
- source_word: כִּשְׁמֹעַ
  choice: 聞くと
  rationale: כִּיを伴う不定詞構文を時間的状況として取り、出来事の連続を自然な現代日本語で示した。直後であることを必要以上に強めない。
- source_word: דִּבְרֵי אָבִיו
  choice: 父の言葉
  rationale: דָּבָרの基本的な語義を保ち、「父が言ったこと」と説明的に言い換えずに訳した。
- source_word: וַיִּצְעַק צְעָקָה
  choice: 叫び声を上げた
  rationale: 同根の動詞と名詞による強意表現を、日本語として自然な「叫び声を上げる」で表した。
- source_word: גְּדֹלָה וּמָרָה עַד מְאֹד
  choice: この上なく大きく悲痛な
  rationale: גְּדֹלָהの強さ、מָרָהの感情的な苦さ、עַד מְאֹדの極度の強意をまとめて保った。「苦い叫び」は日本語では不自然なため、感情的苦痛を表す「悲痛な」とした。
- source_word: בָּרֲכֵנִי גַם אָנִי
  choice: 私も祝福してください
  rationale: 命令形の切実な願いと、גַם אָנִיによる「自分にも」という強調を、明快で直接的な日本語にした。
- source_word: אָבִי
  choice: お父さん
  rationale: 一人称接尾辞を明示し、切迫した直接呼びかけとして現代の読者に自然に響く語を選んだ。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用いつつ、エサウの激しい苦悩と切実な訴えを保った。「お父さん」は親子の直接的な呼びかけとして自然であり、過度に古風な「父上」は避けた。
