  yaml_path: translation/ot/genesis/027/018.yaml
  text: So he went in to his father and said[a], “My father.” And he said, “Here I am. Who are you, my son?”
translation:
  language: ja
  text: そこで彼は父のもとへ行き、「お父さん」と言った。父は言った。「ここにいる。おまえはだれだ、わが子よ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: そこで彼は……入り
  rationale: 物語を前へ進めるワ waw 連続法を「そこで」で自然に示し、父のいる場所へ入る文脈に即して בוא を「入る」と訳した。
- source_word: אֶל אָבִיו
  choice: 父のところに
  rationale: אֶל の方向性と אָבִיו の「彼の父」を、日本語として自然な「父のところに」で表した。原文にない固有名は補わない。
- source_word: וַיֹּאמֶר
  choice: 言った／父は言った
  rationale: 標準的な発話導入。最初は主語が明らかなため簡潔にし、二度目は話者交替を明示するため「父は」を補った。
- source_word: אָבִי
  choice: お父さん
  rationale: 一人称単数接尾辞を伴う父への直接呼称。字義的な「私の父」より、現代日本語の自然な呼びかけを選んだ。
- source_word: הִנֶּנִּי
  choice: ああ、ここにいる
  rationale: 話しかけられた際の応答定型句である。「はい」だけに縮めず、存在・応答の含みを保つため「ここにいる」とした。
- source_word: מִי אַתָּה
  choice: おまえはだれだ
  rationale: 疑問詞と二人称男性単数代名詞による、相手の身元を直接問う形を保持した。
- source_word: בְּנִי
  choice: 息子よ
  rationale: 一人称単数接尾辞を伴う呼格。「わが子」も可能だが、直前の問いとの緊張を保ちつつ簡潔に呼びかけとして表した。
