  text: וְ/עַתָּה֙ שָׂא נָ֣א כֵלֶ֔י/ךָ תֶּלְיְ/ךָ֖ וְ/קַשְׁתֶּ֑/ךָ וְ/צֵא֙ הַ/שָּׂדֶ֔ה וְ/צ֥וּדָ/ה לִּ֖/י צידה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/003.yaml
  text: Now then[b][a], please take your equipment—your quiver and your bow—and go out to the field and hunt game for me.
translation:
  language: ja
  text: さあ、あなたの道具、矢筒と弓を手に取り、野に出て、私のために獲物を狩ってきてくれ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: さあ
  rationale: 直前の言葉を受けて次の指示へ移る接続と即時性を、自然な現代日本語で表す。
- source_word: שָׂא נָא
  choice: 手に取り
  rationale: 字義的には「持ち上げる／携える」だが、狩猟道具を目的語とする命令では「手に取る」が自然。נָאの依頼・促しの響きは文末の「てきてくれ」で表した。
- source_word: כֵלֶיךָ
  choice: あなたの道具
  rationale: 器具・用具・武器を広く指す語であり、続く「矢筒と弓」がその具体的内容を示すため、過度に限定しない「道具」とした。
- source_word: תֶּלְיְךָ
  choice: 矢筒
  rationale: 矢を収めて携える容器を指す語で、狩猟の文脈に明確に合う。
- source_word: וְקַשְׁתֶּךָ
  choice: と弓
  rationale: 一般的な「弓」を指す語の直接的な訳。
- source_word: וְצֵא הַשָּׂדֶה
  choice: 野に出て
  rationale: שָׂדֶהは畑だけでなく野外・野を指し、狩猟場面では「野」が自然で具体的。
- source_word: וְצוּדָה
  choice: 仕留めてきて
  rationale: 狩る、獲物を捕らえるという意味。日本語では後続の目的語「獲物」と合わせて「獲物を仕留める」が自然であり、外へ出て獲得して戻る含意を文脈に即して表す。
- source_word: לִּי
  choice: 私のために
  rationale: 受益者を示す与格を明示する。
- source_word: צידה
  choice: 獲物
  rationale: この文脈では野で狩って得る食用の獲物を指す。「鹿肉」のように種類を限定しない。
theological_decisions: []
translation_notes:
  register: 父が息子に狩りを頼む場面として、現代の読者に明瞭でありながら品位を保つ語調とした。「さあ」と「てきてくれ」により、命令の即時性とנָאの依頼的な響きを自然に表現した。
