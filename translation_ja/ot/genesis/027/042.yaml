base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/042.yaml
  text: And the words of Esau, her older son, were told to Rebekah. So she sent and called Jacob, her younger son, and said to him, “Look, Esau your brother is consoling himself about you by planning to kill you.”
translation:
  language: ja
  text: エサウ、リベカの年長の息子の言葉が、リベカに伝えられた。そこでリベカは遣わして、年少の息子ヤコブを呼び、彼に言った。「聞きなさい。あなたの兄エサウは、あなたを殺すことで自分を慰めようとしている。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבְרֵי עֵשָׂו
  choice: エサウの言葉
  rationale: 複数形の構文を自然な日本語で表し、直前の殺害の意図を述べた発言を指す形にした。
- source_word: בְּנָהּ הַגָּדֹל / בְּנָהּ הַקָּטָן
  choice: 兄エサウ／弟ヤコブ
  rationale: 字義は「彼女の大きい息子／小さい息子」だが、ここでは年長・年少の兄弟関係を示すため、簡潔で自然な日本語とした。
- source_word: הִנֵּה
  choice: いいですか
  rationale: 注意を促す談話標識として、母が息子に重大な知らせを告げる場面に適した現代日本語を選んだ。
- source_word: מִתְנַחֵם לְךָ לְהָרְגֶךָ
  choice: あなたを殺すことで自分を慰めようとしています
  rationale: התנחם の再帰的意味「自らを慰める」と、殺害がその慰めの手段・内容であるという不穏な表現を保持した。単に「殺そうと企んでいる」として比喩を消さないようにした。
theological_decisions:
- issue: エサウの内面と殺意の関係
  choice: 殺すことで自分を慰めようとしている
  alternative: あなたを殺そうと企んで気を晴らそうとしている
  rationale: 原文の「慰める」という語を残し、復讐によって慰めを得ようとするという心理的・道徳的緊張を解消しないため。
translation_notes:
  register: 明瞭な現代標準日本語。物語としての品位を保ちつつ、母が緊急に警告する口調を自然に表した。「ところが」は受動形で新たな情報がリベカに届いた場面転換を示す。
