source:
  edition: WLC
  text: וְ/עַתָּ֥ה בְנִ֖/י שְׁמַ֣ע בְּ/קֹלִ֑/י וְ/ק֧וּם בְּרַח לְ/ךָ֛ אֶל לָבָ֥ן אָחִ֖/י חָרָֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/043.yaml
  text: Now[a], my son, listen to my voice, and arise, flee to my brother Laban in Haran.
translation:
  language: ja
  text: さあ[a]、息子よ、私の声を聞きなさい。立って、ハランにいる私の兄ラバンのもとへ逃げなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「そして今」。
    reason: 接続詞וְを伴う談話標識の字義的な形を示すため。
lexical_decisions:
- source_word: וְעַתָּה
  choice: さあ
  rationale: 直訳的には「そして今」だが、ここでは直ちに指示を始める談話標識であり、現代日本語では「さあ」が緊迫した促しを自然に表す。接続詞の含みは脚注に残した。
- source_word: בְּנִי
  choice: 息子よ
  rationale: 母リベカがヤコブに直接呼びかける、性別と親子関係を明示した表現を保った。
- source_word: שְׁמַע בְּקֹלִי
  choice: 私の声を聞きなさい
  rationale: 字義は「私の声を聞け」。服従の含意はあり得るが、「私に従いなさい」と明示して意味を一つに限定せず、原文の比喩的表現を理解可能な日本語で保った。
- source_word: וְקוּם
  choice: 立って
  rationale: קוםの命令形を表し、続く「逃げなさい」と一連の緊急な動作として自然につないだ。
- source_word: בְּרַח לְךָ
  choice: 逃げなさい
  rationale: ברחの命令を明確に表した。לְךָは行為者の利害を示す与格とも取れるが、日本語で「自分のために逃げなさい」とすると不自然に強調されるため、動詞に含ませた。
- source_word: אֶל לָבָן אָחִי
  choice: 私の兄ラバンのもとへ
  rationale: 人物を目的地とするאֶלを「のもとへ」で自然に表し、ラバンが話者の兄であることを保持した。
- source_word: חָרָנָה
  choice: ハランにいる
  rationale: 地名に付く方向接尾辞はハランへの移動を示すが、その方向性は「ラバンのもとへ」で表されているため、「ハランにいる」としてラバンの所在地を自然に示した。
theological_decisions: []
