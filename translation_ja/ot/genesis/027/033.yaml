  naturalness: 「そのすべてから食べ」は現代日本語として不自然で、何を食べたかもやや不明瞭です。「それをすべて食べ」とすると、持参された獲物（料理）を指す文脈が自然に伝わります。
  terminology: 「イサク」「祝福」は標準的で適切です。「おまえ」はこの場面の父から子への直接的な発話として許容範囲です。
