source:
  edition: WLC
  text: וַ/יֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד מְאֹד֒ וַ/יֹּ֡אמֶר מִֽי אֵפ֡וֹא ה֣וּא הַ/צָּֽד צַיִד֩ וַ/יָּ֨בֵא לִ֜/י וָ/אֹכַ֥ל מִ/כֹּ֛ל בְּ/טֶ֥רֶם תָּב֖וֹא וָ/אֲבָרֲכֵ֑/הוּ גַּם בָּר֖וּךְ יִהְיֶֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/027/033.yaml
  text: Then Isaac trembled with a very great trembling and said[a], “Who then was it who hunted game and brought it to me, and I ate from all of it before you came and blessed him? Yes, and he will be blessed.”
translation:
  language: ja
  text: すると、イサクは激しく身を震わせて言った。「では、獲物を狩って私のところに持って来たのは、いったい誰だったのか。おまえが来る前に、私はそれをすべて食べ、彼を祝福した。彼もまた、祝福される[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「まことに、彼は祝福される」。
    reason: גַּם は文脈上「また」とも、確認・強調の「まことに」とも取り得る。
lexical_decisions:
- source_word: וַיֶּחֱרַד ... חֲרָדָה גְּדֹלָה עַד מְאֹד
  choice: 激しく身を震わせて
  rationale: 同根語を重ねた強意表現を、現代日本語で自然かつ身体的・感情的な衝撃が伝わる形にした。「非常に大きな震えを震えた」という直訳調は避けた。
- source_word: מִי אֵפוֹא הוּא
  choice: では……いったい誰だったのか
  rationale: אֵפוֹא の推論的・強調的な響きを「では」と「いったい」で表し、すでに起きた出来事を尋ねる文脈に合わせて過去形とした。
- source_word: הַצָּד צַיִד
  choice: 獲物を仕留めて
  rationale: 動詞と同根名詞の組み合わせを自然な日本語にし、צַיִד を特定の肉類に限定せず「獲物」とした。
- source_word: וַיָּבֵא לִי
  choice: 私のところに持って来た
  rationale: 直前の「獲物」が目的語として補われることを日本語の文脈に委ねつつ、לִי を自然に表現した。
- source_word: וָאֹכַל מִכֹּל
  choice: 私はそのすべてから食べ
  rationale: מִן の部分を示す語感を「すべてから」で保った。文脈上は持参された料理一式を指す。
- source_word: בְּטֶרֶם תָּבוֹא
  choice: おまえが来る前に
  rationale: 直接話法にふさわしい平明な時間表現とした。
- source_word: וָאֲבָרֲכֵהוּ
  choice: 彼を祝福した
  rationale: 一人称主語は直前の「私は」から明白であり、日本語では反復せずとも正確かつ自然である。
- source_word: גַּם בָּרוּךְ יִהְיֶה
  choice: そうだ、彼は祝福された者となる
  rationale: גַּם の確認・強調を「そうだ」で示し、בָּרוּךְ יִהְיֶה の未来的・結果的な力を保った。単なる過去の祝福行為ではなく、その効力が立つという宣言を表す。
theological_decisions:
- issue: すでに与えられた祝福についてのイサクの最後の宣言の力
  choice: 祝福は効力を持ち、その人物は祝福された者となるという強い確認
  alternative: 単なる諦めや弱い追認として読む
  rationale: גַּם בָּרוּךְ יִהְיֶה は強調を伴う確認であり、族長の祝福が撤回されないという物語上の緊張を保つ。ただし、その仕組みについて後代の教理を付加しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。イサクの衝撃は自然な強意表現で示し、問いの切迫感と結語の厳粛な確定性を保持した。
