source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אָר֣וּר כְּנָ֑עַן עֶ֥בֶד עֲבָדִ֖ים יִֽהְיֶ֥ה לְ/אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/025.yaml
  text: And he said[a], “Canaan is cursed[c][b]; he shall be a servant of servants to his brothers.”
translation:
  language: ja
  text: 彼は言った。「カナン[a]は呪われた者だ。兄弟たちの奴隷の中でも最も低い者となる[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 本文が呪われた者として明記しているのは、ハムではなくカナンである。
    reason: alternative_reading
  - marker: b
    text: 原文は直訳すると「奴隷の奴隷」。同じ語を重ねて強める表現で、極度に低い隷属的地位を示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そして彼は言った
  rationale: 物語を進めるワウ継続法を自然な現代日本語で表し、発言の導入であることを明確にした。
- source_word: אָרוּר
  choice: 呪われた者だ
  rationale: 動詞のない述語形容詞の宣告的な力を保ち、「呪われている」のように単なる状態描写に限定しない表現とした。
- source_word: כְּנָעַן
  choice: カナン
  rationale: 固有名を慣用的に音写した。本文が明記する対象はハムではなくカナンである。
- source_word: עֶבֶד עֲבָדִים
  choice: 奴隷の奴隷
  rationale: 隷属の厳しさを弱めず、同語反復によるヘブライ語の強意表現を本文に残した。意味上は最も低い奴隷的地位を示す。
- source_word: יִהְיֶה
  choice: となる
  rationale: 呪いの宣告における将来的な帰結を簡潔に示した。日本語では文脈上、厳粛な予告として自然に読める。
- source_word: לְאֶחָיו
  choice: 兄弟たちにとって
  rationale: 前置詞לְと男性複数名詞に三人称男性単数接尾辞が付いた形を反映した。文脈上は親族・同族を含み得るが、本文では字義どおり「兄弟たち」とした。
theological_decisions:
- issue: ノアの呪いの対象
  choice: カナンを明示する
  alternative: 呪いを直接ハムに向けられたものとして訳す
  rationale: ヘブライ語本文は明確にカナンを名指ししているため、後代の解釈によって対象を置き換えない。
- issue: 隷属語の訳し方
  choice: 「奴隷」を用いる
  alternative: 「僕」「しもべ」を用いる
  rationale: この箇所では極端な従属状態が強調されており、より穏当な語に弱めない。
- issue: עֶבֶד עֲבָדִים の強意
  choice: 本文では「奴隷の奴隷」と形式を保ち、脚注で強意を説明する
  alternative: 本文で「最も身分の低い奴隷」と意訳する
  rationale: 原文の修辞を見える形で残しつつ、現代の読者に意味を補足する。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、呪いの宣告にふさわしい簡潔で厳粛な調子を保った。原文の反復表現と、カナンを対象とする明示性を維持した。
