  text: וְ/הָיְתָ֥ה הַ/קֶּ֖שֶׁת בֶּֽ/עָנָ֑ן וּ/רְאִיתִ֗י/הָ לִ/זְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּ/בֵין֙ כָּל נֶ֣פֶשׁ חַיָּ֔ה בְּ/כָל בָּשָׂ֖ר אֲשֶׁ֥ר עַל הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/016.yaml
  text: The bow will be in the cloud[b][a], and I will see it and remember the everlasting covenant between God and every living creature among all flesh that is on the earth.
translation:
  language: ja
  text: 虹[a]が雲の中にあり、私はそれを見て、神と地上のすべての肉なるもの、すなわちあらゆる生き物との間の永遠の契約を思い起こす。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原語は字義どおりには「弓」。ここでは空にかかる虹を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה הַקֶּשֶׁת בֶּעָנָן
  choice: 虹が雲の中に現れるとき
  rationale: היה はここでは雲の中にしるしが現れている状況を表す。日本語では単に「ある」より「現れる」が自然で、後続する神の行為との時間的関係も明瞭になる。הַקֶּשֶׁת の字義は「弓」だが、文脈上は虹を指すため本文では明瞭な「虹」とし、原語の比喩を脚注に残す。
- source_word: וּרְאִיתִיהָ לִזְכֹּר
  choice: 私はそれを見て、…思い起こす
  rationale: 接続された定動詞と ל 不定詞の目的・結果の関係を、自然な日本語の連続動作として表す。神の契約的な「記憶」という原文の表現は説明的に言い換えない。
- source_word: בְּרִית עוֹלָם
  choice: 永遠の契約
  rationale: עוֹלָם の長く持続する性格を、聖書文脈でも一般読者にも明瞭な「永遠」で表す。
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: あらゆる生き物
  rationale: נֶפֶשׁ はここで人間の非物質的な「魂」に限定されず、生きた存在全般を指す。
- source_word: בְּכָל בָּשָׂר
  choice: すべての肉なるもののうちの
  rationale: 前置詞 בְּ を「うちの」として保ち、כָּל נֶפֶשׁ חַיָּה をさらに規定する関係を示す。「肉なるもの」は人間だけでなく肉体を持つ生き物全体を表す。
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: 地上にいる
  rationale: 関係節を自然な日本語の連体修飾にし、普遍的な文脈に沿って הָאָרֶץ を「地上」と訳す。
theological_decisions:
- issue: 神が契約を思い起こすという擬人的表現
  choice: 「私はそれを見て、…永遠の契約を思い起こす」と保持する
  alternative: 「私はそれを見て、契約に従って行動する」
  rationale: 原文は神の契約的記憶を明言しているため、神の忘却を避けようとする説明的な言い換えをせず、その神学的緊張を保つ。
- issue: הַקֶּשֶׁת の像
  choice: 本文では「虹」、脚注で字義「弓」を示す
  alternative: 本文を「弓」とする
  rationale: 現代日本語で空の現象を誤解なく示しつつ、原語が武器の弓と同じ語であることを脚注によって保持する。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、契約宣言にふさわしい格調を保った。「すべての肉なるもののうちの」はやや直訳調だが、原文の二重の全称表現と両句の関係を保持するため採用した。
