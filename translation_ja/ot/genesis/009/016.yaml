    issue: 「虹が雲の中に現れるとき」
    rationale: 原文は未来に向かう「虹は雲の中にある／現れる、そして私はそれを見る」という並列した叙述である。「とき」は時間的従属・条件の関係を明示しており、本文の構文を必要以上に限定する。
  - severity: medium
    issue: 「地上にいる、すべての肉なるもののうちのあらゆる生き物」
    rationale: 原文の「すべての生き物」と「地上のすべての肉なるもの」は、後者が前者を言い換え・規定する関係にある。「うちの」は集合内の一部を示すように響き、全称表現どうしの関係を曖昧かつ不自然にする。
  revised_text: 虹[a]が雲の中にあり、私はそれを見て、神と地上のすべての肉なるもの、すなわちあらゆる生き物との間の永遠の契約を思い起こす。
  revised_footnotes:
