id: GEN.9.6
reference: Genesis 9:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שֹׁפֵךְ֙ דַּ֣ם הָֽ/אָדָ֔ם בָּֽ/אָדָ֖ם דָּמ֣/וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּ/צֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת הָ/אָדָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/006.yaml
  text: Whoever sheds the blood of man[a], by man shall his blood be shed[b], for God made man in his image.
translation:
  language: ja
  text: '人の血を流す者は、

    人によってその血を流される。[a]

    神がご自分のかたちに人を造られたからである。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「人によって」は、「人の中で」と訳すこともできる。
    reason: 原文の前置詞בは、ここでは行為主体を示すと考えられるが、範囲・場所を表す読みも文法上あり得るため。
lexical_decisions:
- source_word: שֹׁפֵךְ
  choice: 血を流す者
  rationale: 分詞の一般的・格言的な働きを自然な日本語で表し、殺害を意味する「血を流す」という聖書的表現も保った。
- source_word: דַּם הָאָדָם
  choice: 人の血
  rationale: דםを「血」、אָדָםを性別を限定しない総称的な「人」と訳し、人命を奪うことを表す簡潔な表現とした。
- source_word: בָּאָדָם
  choice: 人によって
  rationale: 前置詞בを手段・行為主体を示すものと理解した。「人」を繰り返すことで、原文のאָדָםの反復と簡潔な並行を保った。
- source_word: דָּמוֹ יִשָּׁפֵךְ
  choice: その血を流される
  rationale: 接尾代名詞を「その」とし、ニファル未完了形の受動を「流される」で表した。命令の意味に限定せず、法的・格言的な厳粛さを保つ。
- source_word: כִּי
  choice: からである
  rationale: 前文の根拠を導く接続詞として訳した。
- source_word: בְּצֶלֶם אֱלֹהִים
  choice: ご自分のかたちに
  rationale: 主語が神であることを明示した上で、神の像という関係を自然な現代日本語で表した。「かたち」は外見だけに限定せず、原語צֶלֶםの含意を開いたままにする。
- source_word: עָשָׂה אֶת־הָאָדָם
  choice: 人を造られた
  rationale: עשהを「造る」と訳し、בראに固有の「創造する」を持ち込まなかった。אָדָםは節内の反復に合わせて総称的な「人」とした。
theological_decisions:
- issue: אָדָםの総称的用法
  choice: 人
  alternative: 人間／人類
  rationale: ここでは男性だけでなく人間一般を指す。「人」は日本語で総称的単数として自然であり、三度のאָדָםのつながりもある程度保てる。
- issue: בָּאָדָםが示す行為主体
  choice: 人によって
  alternative: 人の中で
  rationale: 司法的な文脈と並行構造から、手段・行為主体を表す理解が最も自然である。ただし前置詞の別解の余地は脚注に示した。
- issue: 神のかたちの表現
  choice: 神がご自分のかたちに人を造られた
  alternative: 神のかたちに、神は人を造られた
  rationale: 原文の神学的主張を保ちながら、日本語として自然な語順にした。「かたち」の内容を説明的に限定していない。
- issue: יִשָּׁפֵךְの法的効力
  choice: 流される
  alternative: 流されなければならない
  rationale: 受動形を保ち、予告・原則・規定の間にある原文の力を一つに決め切らない。「ねばならない」は義務性を過度に明示するため採らなかった。
translation_notes:
  register: 簡潔で厳粛な法的・格言的調子を保ちつつ、現代の一般読者に通じる語彙を用いた。「人」を反復して原文のאָדָםの連鎖を映し、性別を男性に限定しない。
