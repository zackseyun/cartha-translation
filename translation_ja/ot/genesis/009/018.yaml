  yaml_path: translation/ot/genesis/009/018.yaml
  text: The sons of Noah who came out of the ark were Shem, Ham, and Japheth; and Ham was the father of Canaan.
translation:
  language: ja
  text: 箱舟から出てきたノアの息子たちは、セム、ハム、ヤペテであった。ハムはカナンの父であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: であった
  rationale: ここでは状態の変化ではなく、主語とその名を示す単純な過去の連結表現である。現代日本語の聖書本文として自然で品位のある「であった」とした。
- source_word: בְנֵי נֹחַ
  choice: ノアの息子たち
  rationale: ヘブライ語の連語「ノアの息子たち」を明確かつ自然に表す。「子ら」より現代の一般読者に分かりやすい。
- source_word: הַיֹּצְאִים מִן הַתֵּבָה
  choice: 箱舟から出て来た
  rationale: 定冠詞付き分詞はノアの息子たちを限定しており、מןは起点を示す。「出て来た」は閉じた場所から外へ出たことを自然に表す。
- source_word: שֵׁם וְחָם וָיָפֶת
  choice: セム、ハム、ヤフェト
  rationale: 日本語聖書で広く通用する人名表記を採用し、列挙は日本語として自然な読点で示した。
- source_word: וְחָם הוּא אֲבִי כְנָעַן
  choice: ハムはカナンの父であった
  rationale: 名詞文による系譜的な同定を明示する。直前の列挙から独立した背景説明として自然に読める文にした。
theological_decisions:
- issue: ハムとカナンの系譜的関係を示す注記
  choice: 「ハムはカナンの父であった」を本文に明記する。
  alternative: 付随的な情報として文体上弱める。
  rationale: 原文はこの関係を明示し、後続物語を準備している。その叙述上の重みを保ちつつ、本文にない民族的・神学的解釈は加えない。
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔で格調を保った。原文の二つの節を二文に分け、ハムとカナンの関係を示す背景説明を読み取りやすくした。
