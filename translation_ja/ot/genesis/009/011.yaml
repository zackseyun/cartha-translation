source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֤י אֶת בְּרִיתִ/י֙ אִתְּ/כֶ֔ם וְ/לֹֽא יִכָּרֵ֧ת כָּל בָּשָׂ֛ר ע֖וֹד מִ/מֵּ֣י הַ/מַּבּ֑וּל וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְ/שַׁחֵ֥ת הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/011.yaml
  text: 'And I will establish my covenant with you: never again will all flesh be cut off by the waters of the flood[b][a], and never again will there be a flood to destroy the earth.'
translation:
  language: ja
  text: わたしは、あなたがたとの契約を確立する。洪水の水によって、すべての生き物が再び滅ぼされることは決してない[a][b]。また、地を滅ぼす洪水が再び起こることも決してない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滅ぼされる」は「断たれる」とも訳せる。ヘブライ語の動詞は字義どおりには「断たれる」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「すべての生き物」は、字義的には「すべての肉」。人間だけでなく、生き物を広く指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: 確立する
  rationale: קוםのヒフィル形を契約用語として訳した。「確立する」は、契約を正式に成立させる意味と、すでに告げた契約を確かなものとする意味の双方を過度に限定せず、厳粛な調子も保つ。
- source_word: בְּרִיתִי אִתְּכֶם
  choice: あなたがたと結ぶわたしの契約
  rationale: 「あなたがた」が複数の契約当事者であることを明確にし、日本語として自然な契約表現にした。
- source_word: יִכָּרֵת
  choice: 断たれる
  rationale: כרתのニファル形が持つ「断たれる」という比喩を保持した。文脈上は滅ぼされることを指すが、訳文で直ちに言い換えず、脚注で代案を示した。
- source_word: כָּל בָּשָׂר
  choice: 肉なるものすべて
  rationale: 直訳的な身体表現を残しつつ、人間だけでなく動物を含む広い範囲を保った。
- source_word: עוֹד
  choice: 再び……ない
  rationale: 否定辞と結びついた約束の文脈で「二度とない」の意味を表す。二つの否定節で反復して訳した。
- source_word: מִמֵּי הַמַּבּוּל
  choice: 洪水の水によって
  rationale: מןを破壊の原因・手段として捉え、原文の「水」を省かずに表した。
- source_word: מַבּוּל
  choice: 洪水
  rationale: ノア物語におけるמַבּוּלの標準的で明瞭な訳語。
- source_word: לְשַׁחֵת
  choice: 滅ぼす
  rationale: שׁחתがここで表す破壊的な働きを、簡潔で厳粛な現代日本語にした。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 洪水物語の広い射程を保ちつつ、אָרֶץが持ちうる「地／土地」の余韻を残すため「地」とした。
theological_decisions:
- issue: 「肉なるものすべて」の範囲
  choice: 人間に限定せず、動物を含む生き物全般を指しうる表現とした。
  alternative: 全人類
  rationale: 洪水後の契約は直前の文脈で人間だけでなく生き物にも及ぶため、原語の広い範囲を狭めない。
- issue: קוםを伴う契約表現
  choice: 「契約を確立する」とした。
  alternative: 契約を確認する／契約を守り続ける
  rationale: 契約が新たに制定されるのか、告げられた契約が正式に確認されるのかを訳文だけで断定せず、原語の契約用法の幅を保つ。
- issue: הָאָרֶץの範囲
  choice: 「地」と訳した。
  alternative: 全地／土地
  rationale: 約束の普遍的な文脈を損なわず、同時に語そのものが持つ意味範囲を不必要に狭めたり拡張したりしない。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、神の契約宣言にふさわしい厳粛さを保った。「肉なるもの」「断たれる」は原文の表現を残すためやや格調ある言い方とし、意味は脚注で補った。
