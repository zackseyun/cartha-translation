  text: וּ/מוֹרַאֲ/כֶ֤ם וְ/חִתְּ/כֶם֙ יִֽהְיֶ֔ה עַ֚ל כָּל חַיַּ֣ת הָ/אָ֔רֶץ וְ/עַ֖ל כָּל ע֣וֹף הַ/שָּׁמָ֑יִם בְּ/כֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽ/אֲדָמָ֛ה וּֽ/בְ/כָל דְּגֵ֥י הַ/יָּ֖ם בְּ/יֶדְ/כֶ֥ם נִתָּֽנוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/002.yaml
  text: And the fear of you and the dread of you shall be upon every beast of the earth and upon every bird of the heavens[a], on everything that creeps on the ground, and on all the fish of the sea[c][b]; into your hand they are given.
translation:
  language: ja
  text: あなたがたに対する恐れとおののきが、地上のすべての動物、空のすべての鳥、地をはうすべてのもの、海のすべての魚に及ぶ。これらはあなたがたの手に渡された[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「手に渡された」は、人の権限または支配のもとに置かれたことを表すヘブライ語の言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹרַאֲכֶם וְחִתְּכֶם
  choice: あなたがたへの恐れとおののき
  rationale: 二つの近義語による強調を保ちつつ、動物が人間に対して抱く恐怖であることを自然な日本語で示した。「恐れ」と「おののき」を並べ、両語を一語にまとめなかった。
- source_word: חַיַּת הָאָרֶץ
  choice: 地上のすべての動物
  rationale: חַיָּהはこの文脈で陸上動物を広く指すため、「野獣」と狭く限定せず「動物」とした。הָאָרֶץはここでは生息領域を表す「地上」とした。
- source_word: עוֹף הַשָּׁמָיִם
  choice: 空のすべての鳥
  rationale: עוֹףを文脈に即して「鳥」、שָׁמַיִםを現代日本語で自然な「空」とした。
- source_word: בְּכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: 地面を動き回るすべてのもの
  rationale: רמשׂは地面を這う、または小刻みに動く生き物を表すが、特定の移動様式に狭めすぎないよう「動き回る」とした。אֲדָמָהは先のאֶרֶץと区別して「地面」と訳した。
- source_word: דְּגֵי הַיָּם
  choice: 海のすべての魚
  rationale: 構文と列挙の包括性をそのまま明瞭に表した。
- source_word: בְּיֶדְכֶם נִתָּנוּ
  choice: あなたがたの手に渡された
  rationale: 「手に与える」というヘブライ語の比喩を自然な日本語で保ち、支配下または権限のもとに置かれた含意を注で説明した。受動態も保持した。
theological_decisions:
- issue: 洪水後における人間と動物の関係
  choice: 動物が人間を恐れ、人間の手に渡されたと述べる本文の比喩を保持した。
  alternative: 「人間に服従させられた」「自由に利用してよい」と説明的に訳すこと。
  rationale: 本文は人間の権限を示す一方、その範囲や倫理的意味をここで詳述してはいない。したがって、支配の含意を弱めず、同時に本文を越える教義的・倫理的解釈も加えなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣言にふさわしい簡潔で荘重な調子を保った。「及ぶ」によって、冒頭の「恐れとおののき」が列挙されたすべての生き物にかかる構造を自然に示した。
