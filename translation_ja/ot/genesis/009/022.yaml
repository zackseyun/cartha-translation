source:
  edition: WLC
  text: וַ/יַּ֗רְא חָ֚ם אֲבִ֣י כְנַ֔עַן אֵ֖ת עֶרְוַ֣ת אָבִ֑י/ו וַ/יַּגֵּ֥ד לִ/שְׁנֵֽי אֶחָ֖י/ו בַּ/חֽוּץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/022.yaml
  text: And Ham[a], the father of Canaan, saw his father's nakedness and told his two brothers outside.
translation:
  language: ja
  text: カナンの父ハムは、父の裸[a]を見て、外にいた二人の兄弟にそのことを告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「父の裸」。旧約聖書の一部では、この表現が性的な事柄の婉曲表現として使われることもある。ここでは字義どおりの表現を残し、その解釈を限定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見て
  rationale: ראהの通常の物語用法をそのまま表し、「見つめた」など意図を加える訳は避けた。
- source_word: חָם
  choice: ハム
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: אֲבִי כְנַעַן
  choice: カナンの父
  rationale: ヘブライ語の連語が示すハムの付加的な身元説明を、自然で簡潔な日本語にした。
- source_word: עֶרְוַת אָבִיו
  choice: 父の裸
  rationale: 語句を直訳的に保ち、ここで特定の性的行為を意味すると断定しないようにした。
- source_word: וַיַּגֵּד
  choice: そのことを告げた
  rationale: נגדのヒフィル形の基本義「告げる」を採用し、日本語で目的内容が自然に通じるよう「そのことを」を補った。
- source_word: לִשְׁנֵי אֶחָיו
  choice: 二人の兄弟に
  rationale: 原文が明記する人数を保持し、自然な日本語の語順にした。
- source_word: בַּחוּץ
  choice: 外にいた
  rationale: 「外で」とも訳せるが、文脈上、父のいる天幕の外に兄弟たちがいたことを自然に示す表現とした。
theological_decisions:
- issue: 「父の裸」がこの物語で意味すること
  choice: 「父の裸」と字義的に訳し、ハムが裸の父を見たこと以上の特定の性的行為は本文で明示しない。
  alternative: 後代の律法用例を踏まえ、より重大な性的侵犯または母との近親相姦を暗示する婉曲表現と解する。
  rationale: この表現は他の旧約箇所では性的な婉曲表現となりうる一方、この節自体はハムが「見て」「告げた」と記し、直近の文脈もノアが裸であったことを中心としている。字義的表現と注を併用し、解釈上の緊張を残した。
translation_notes:
  register: 明瞭で現代的ながら聖書本文にふさわしい落ち着いた文体とした。「裸」は一般読者に分かりやすく、原文の曖昧さも保てる。「そのことを」は日本語として自然にするための最小限の補足。
