  text: וַ/אֲנִ֕י הִנְנִ֥/י מֵקִ֛ים אֶת בְּרִיתִ֖/י אִתְּ/כֶ֑ם וְ/אֶֽת זַרְעֲ/כֶ֖ם אַֽחֲרֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/009.yaml
  text: And as for me[a], behold, I am establishing my covenant with you and with your offspring after you.
translation:
  language: ja
  text: 見よ、わたしは、あなたがたと、あなたがたの後に続く子孫[a]と、わたしの契約を立てる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「種」。ヘブライ語では集合名詞で、子や子孫を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנְנִי
  choice: このわたしは今ここに
  rationale: 独立代名詞による強調と、הִנְנִי が促す厳粛な注意を一続きの自然な日本語で表した。「見よ」を機械的に置くより現代日本語として明瞭であり、神ご自身の決意と宣言の重みも保つ。
- source_word: מֵקִים
  choice: 立てる
  rationale: קום のヒフィル分詞は、ここでは契約を成立させる行為を表す。「立てる」は日本語聖書の契約表現として自然であり、再確認に限定しかねない「確立する」や「確認する」より原文の幅を保つ。
- source_word: בְּרִיתִי
  choice: わたしの契約
  rationale: בְּרִית の神と人との正式な関係を示す標準的な訳語。「盟約」などより一般の読者に明瞭で、聖書全体の主要語としても一貫性がある。
- source_word: אִתְּכֶם
  choice: あなたがたと
  rationale: 複数形を明示し、ノアだけでなく共にいる者たちを契約の相手として示す。
- source_word: וְאֶת זַרְעֲכֶם
  choice: およびあなたがたの後の子孫[a]と
  rationale: זֶרַע は集合的に後代の者たちを指し得るため、現代日本語で自然な「子孫」とした。直訳の「種」は人間について不自然なので脚注に残す。
- source_word: אַחֲרֵיכֶם
  choice: あなたがたの後の
  rationale: 後続する世代という時間的・系譜的関係を簡潔に保つ。
theological_decisions:
- issue: 神と人との関係における契約用語
  choice: わたしの契約
  alternative: わたしの盟約
  rationale: 特定の教派的解釈を加えず、בְּרִית が示す神の正式な約束と関係を、聖書用語として定着し現代にも通じる「契約」で表した。
- issue: זֶרַע の集合的範囲
  choice: 子孫
  alternative: 種
  rationale: 単数形の集合名詞という原文の特徴を脚注で示しつつ、本文ではノアたちの後に続く人々を自然に指す「子孫」を用いた。特定の一人または人数に意味を限定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の契約宣言にふさわしい厳粛さを「このわたしは今ここに」と「契約を立てる」で表した。原文の二人称複数は「あなたがた」で明示した。
