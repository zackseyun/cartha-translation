  terminology: 「生き物」「鳥」「家畜」「地のすべての野生動物」は、それぞれ נֶפֶשׁ הַחַיָּה、עוֹף、בְּהֵמָה、חַיַּת הָאָרֶץ の分類上の区別を適切に表す。特に「野生動物」は「家畜」との対照を保つ。
