  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵ֨ת כָּל נֶ֤פֶשׁ הַֽ/חַיָּה֙ אֲשֶׁ֣ר אִתְּ/כֶ֔ם בָּ/ע֧וֹף בַּ/בְּהֵמָ֛ה וּֽ/בְ/כָל חַיַּ֥ת הָ/אָ֖רֶץ אִתְּ/כֶ֑ם מִ/כֹּל֙ יֹצְאֵ֣י הַ/תֵּבָ֔ה לְ/כֹ֖ל חַיַּ֥ת הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/010.yaml
  text: 'and with every living creature that is with you: the birds[a], the livestock, and every beast of the earth with you, from all that came out of the ark[d][c][b], every beast of the earth.'
translation:
  language: ja
  text: また、あなたがたと共にいるすべての生き物、すなわち鳥、家畜、そしてあなたがたと共にいる地のすべての野生動物とも、箱舟から出たすべてのもの、すなわち地のすべての野生動物とも[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 節末のヘブライ語は構文が難しく、より形式的には「箱舟から出たすべてのものから、地のすべての野生動物に対して（または、のために）」とも訳せる。最後の句を、前の範囲を言い直す表現と見ることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ הַחַיָּה
  choice: 生き物
  rationale: 「生きた魂」とも直訳できるが、ここでは契約の対象となる動物全般を指すため、現代日本語で自然な「生き物」とした。
- source_word: בָּעוֹף
  choice: 鳥
  rationale: 語義は飛ぶ生き物を広く含み得るが、この動物分類の文脈では「鳥」が明瞭で自然である。
- source_word: בַּבְּהֵמָה
  choice: 家畜
  rationale: 野生動物と区別される飼育動物の類を表すため、「獣」や狭義の「牛」ではなく「家畜」とした。
- source_word: חַיַּת הָאָרֶץ
  choice: 地のすべての野生動物
  rationale: 家畜との区別を保ちつつ、地上の野生動物という範囲を明示する。
- source_word: מִכֹּל יֹצְאֵי הַתֵּבָה
  choice: 箱舟から出たすべてのものから
  rationale: 前置詞 מִן と分詞の形を保ち、箱舟から出た動物を指す表現として訳した。
- source_word: לְכֹל חַיַּת הָאָרֶץ
  choice: 地のすべての野生動物に至るまで
  rationale: 結びの לְ を範囲の終点として自然な日本語にした。ただしヘブライ語の構文には難しさがあるため、より形式的な読みを脚注に残した。
theological_decisions:
- issue: 契約に含まれる動物の範囲と節末の構文
  choice: 鳥、家畜、野生動物を含む動物全体を契約の対象とし、節末を範囲の広がりを示す表現として訳した。
  alternative: 節末を「地のすべての野生動物に対して」と形式的に訳す、または直前の句を言い直す同格的表現と見ることもできる。
  rationale: 圧縮され反復のあるヘブライ語の統語を一義的に決めつけず、本文では意味の流れを明瞭にし、別の構文理解を脚注で示した。
translation_notes:
  register: 創世記9章9節から続く文として接続形を保った。現代の一般読者に明瞭な語彙を用いつつ、荘重さを損なわない簡潔な文体とした。
