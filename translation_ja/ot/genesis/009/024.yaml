base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/024.yaml
  text: When Noah awoke from his wine[a], he knew what his youngest son had done to him.
translation:
  language: ja
  text: ノアはぶどう酒の酔いから目を覚ますと、末の息子[a]が自分にしたことを知った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「年下の息子」。ヘブライ語の形容詞は、文脈によって「小さい」「若い」「最も若い」を意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיקֶץ
  choice: 目を覚ますと
  rationale: יקץは眠りから目を覚ますことを表す。文脈上は泥酔後の覚醒だが、「酔いがさめた」とすると語義以上の解釈を加えるため、覚醒そのものを訳した。
- source_word: מִיֵּינוֹ
  choice: ぶどう酒から
  rationale: 直訳的には「彼のぶどう酒から」。日本語では所有を明示せずとも意味が通じるため「ぶどう酒から」とし、原文の簡潔で独特な表現を保った。「酔いから」「酒の影響から」は文脈を説明する意訳となる。
- source_word: וַיֵּדַע
  choice: 知った
  rationale: ידעの基本義「知る」に対応する。ここでは、それまで知らなかったことを知るに至った含みがあるが、「知った」で自然に表せる。
- source_word: אֵת אֲשֶׁר עָשָׂה לוֹ
  choice: 自分にしたこと
  rationale: 原文は、息子がノアに「したこと」とだけ述べ、行為の内容を特定していない。日本語でもその曖昧さをそのまま保った。
- source_word: בְּנוֹ הַקָּטָן
  choice: 末の息子
  rationale: קָטָןは「小さい」「若い」「最年少の」を意味し得る。家族内の年齢関係を述べるこの文脈では「末の息子」が自然だが、「年下の息子」の可能性も脚注に示した。
theological_decisions:
- issue: ノアに対して行われた行為の内容
  choice: 「自分にしたこと」と一般的に訳し、行為を特定しない。
  alternative: ハムがノアの裸を見て兄弟に告げたこと、またはより深刻な性的侵害を指すと解釈して訳す。
  rationale: この節のヘブライ語自体は行為の内容を明示しないため、特定の解釈を本文に持ち込まず、原文の曖昧さと解釈上の緊張を保つ。
- issue: 「末の息子」が指す人物と年齢関係
  choice: 本文では原文どおりノアの「末の息子」とし、人物名を補わない。
  alternative: 「年下の息子」と訳す、またはハムもしくはカナンを明示する。
  rationale: בְּנוֹ הַקָּטָןはノアとの親子関係と年齢上の位置を示すが、この節だけでは解釈上の人物同定を付加すべきではない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、物語文としての簡潔さと品位を保った。「ぶどう酒から目を覚ます」は通常の日本語よりやや原文に近い言い回しだが、「酔いがさめる」という解釈的な言い換えを避けるため採用した。脚注記号は語義上の異読が生じる「末の息子」の直後に置いた。
