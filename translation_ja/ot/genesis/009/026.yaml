id: GEN.9.26
reference: Genesis 9:26
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/026.yaml
  text: And he said, “Blessed be the LORD, the God of Shem, and let Canaan be their servant.”
translation:
  language: ja
  text: '彼は言った。


    「セムの神である主は、ほめたたえられよ。


    カナンは彼らのしもべとなれ。[a]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼ら」が誰を指すかは、原文では明示されていない。「彼の」と訳す見方もある。
    reason: לָמוֹ は詩的な三人称複数形だが、文脈上の指示対象には解釈上の曖昧さがあるため。
lexical_decisions:
- source_word: בָּרוּךְ
  choice: ほめたたえられよ
  rationale: 神に向けられた賛美の定型表現として、字義的な「祝福された」より自然で、受動的な形も保つ。
- source_word: יְהוָה
  choice: 主
  rationale: 神名四文字を、日本語聖書で広く認識される敬称「主」で表した。
- source_word: עֶבֶד
  choice: しもべ
  rationale: 隷属する者を指す語だが、文脈上の身分を示しつつ、日本語として荘重で過度に限定的でない表現を選んだ。
- source_word: לָמוֹ
  choice: 彼らの
  rationale: 詩的な三人称複数接尾辞として取り、単数に狭めず原文の複数形を反映した。
theological_decisions:
- issue: 「セムの神、主」を祝福する表現
  choice: 「セムの神、主はほめたたえられよ」
  alternative: 「主、セムの神は祝福されよ」
  rationale: 祝福の対象がセムではなく主であるという原文の統語関係を明確に保った。
- issue: לָמוֹ の指示対象
  choice: 本文では「彼らの」とし、注で曖昧さを示す
  alternative: 「彼の」または「セムの」
  rationale: 語形は複数を示す一方、誰を指すかは明示されないため、セムだけを指すと神学的に確定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、詩的な宣言の格調を保つため「ほめたたえられよ」「となれ」を用いた。神名は「主」とし、「しもべ」は隷属の意味を残しながら過度に古風または現代制度的にならない語として採用した。
