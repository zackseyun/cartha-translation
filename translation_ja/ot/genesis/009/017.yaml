base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/017.yaml
  text: And God said to Noah[a], “This is the sign of the covenant that I have established between me and all flesh that is on the earth.”
translation:
  language: ja
  text: 神はノアに言われた。「これは、わたしと地上のすべての生き物[a]との間に、わたしが立てた契約のしるしである。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳「すべての肉」。この文脈では、人間だけでなく地上の生きているものを広く指す表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進める連続形。日本語では文脈上、接続語を補わず、神への敬意を示す自然な叙述とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: ここではノアに語る唯一の神を指し、現代日本語の標準的な訳語である。
- source_word: אֶל נֹחַ
  choice: ノアに
  rationale: 前置詞は発言の相手を示す。固有名は日本語で定着した「ノア」とした。
- source_word: זֹאת
  choice: これは…である
  rationale: 指示語による同定文であり、日本語として必要なコピュラを補った。
- source_word: אוֹת
  choice: しるし
  rationale: 目に見える徴を表し、虹と契約の文脈に合う。漢字の「印」よりも意味の幅を保ち、平易な表記とした。
- source_word: הַבְּרִית
  choice: 契約
  rationale: 聖書全体で重要な語 בְּרִית の意味と用語上の一貫性を保つ標準的な訳語である。
- source_word: הֲקִמֹתִי
  choice: わたしが立てた
  rationale: קום のヒフィル形が契約を目的語に取る定型表現。「契約を立てる」は成立・確立を自然かつ簡潔に表す。
- source_word: בֵּינִי וּבֵין
  choice: わたしと…との間に
  rationale: 契約当事者間の関係を示す構文を、自然な日本語で保持した。
- source_word: כָּל בָּשָׂר
  choice: すべての肉なるもの
  rationale: 直訳的な広い表現を保ち、人間だけに限定しない。現代の読者には補足が必要なため脚注を付した。
- source_word: אֲשֶׁר עַל הָאָרֶץ
  choice: 地上にいる
  rationale: 関係節として「すべての肉なるもの」を限定する。「いる」によって生き物を指す文脈を自然に表す一方、本文の広さは保った。
theological_decisions:
- issue: ノア契約における כָּל בָּשָׂר の範囲
  choice: すべての肉なるもの
  alternative: すべての生き物／全人類
  rationale: 創世記9章では人間だけでなく地上の動物をも含む広い表現である。本文ではヘブライ語の比喩的表現と範囲を保持し、脚注で意味を明らかにした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「である」を用いて神の宣言の簡潔さを保ち、「肉なるもの」という聖書的表現には脚注を付して現代の一般読者にも意味が伝わるようにした。
