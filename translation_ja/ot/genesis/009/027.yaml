id: GEN.9.27
reference: Genesis 9:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: יַ֤פְתְּ אֱלֹהִים֙ לְ/יֶ֔פֶת וְ/יִשְׁכֹּ֖ן בְּ/אָֽהֳלֵי שֵׁ֑ם וִ/יהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽ/מוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/027.yaml
  text: May God enlarge Japheth[a], and may he dwell in the tents of Shem, and let Canaan be a servant to them.
translation:
  language: ja
  text: '神がヤフェトのために場所を広げてくださるように。

    また、セムの天幕に住むように。[a]

    カナンは彼らの奴隷となるように。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「神がセムの天幕に住まわれるように」とも、「ヤフェトがセムの天幕に住むように」とも訳せる。ヘブライ語では「住む」の主語が明示されていない。
    reason: alternative_reading
lexical_decisions:
- source_word: יַפְתְּ
  choice: 場所を広げてくださる
  rationale: この動詞は「広くする、場所を広げる」という願望を表し、ヤフェトという名との語呂合わせを含む。日本語では音の対応を再現できないため、空間が広げられるという具体的な意味を自然に示した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形は複数形だが、ここでは単数の動詞と結びつき、唯一の神を指す。
- source_word: לְיֶפֶת
  choice: ヤフェトのために
  rationale: 前置詞 לְ の受益の意味を明示し、不自然な「ヤフェトを広げる」を避けた。
- source_word: וְיִשְׁכֹּן
  choice: また、…住むように
  rationale: 願望を表す動詞として訳し、原文と同じく主語を明示しなかった。これにより、神とヤフェトのどちらが住むのかという曖昧さを保った。
- source_word: בְּאָהֳלֵי שֵׁם
  choice: セムの天幕に
  rationale: 場所を表す表現として訳し、「天幕」という原文の具体的な比喩を保持した。
- source_word: וִיהִי
  choice: …となるように
  rationale: 祝福と宣告が続く文脈に合う願望・命令的な調子を日本語で表した。
- source_word: כְנַעַן
  choice: カナン
  rationale: 人名を標準的な日本語表記で音写した。
- source_word: עֶבֶד
  choice: 奴隷
  rationale: ここでは従属させられた身分が宣告の中心であるため、「僕」や「仕える者」ではなく「奴隷」とした。
- source_word: לָמוֹ
  choice: 彼らの
  rationale: この代名詞を複数として受け、文脈上セムとヤフェトを指す表現とした。
theological_decisions:
- issue: 「セムの天幕に住む」の主語
  choice: 本文では主語を省略して曖昧さを保つ
  alternative: 「神がセムの天幕に住む」または「ヤフェトがセムの天幕に住む」
  rationale: ヘブライ語の単数男性形の動詞には主語が明記されておらず、直前の神を指すともヤフェトを指すとも解釈できる。本文で一方に限定せず、注で両方を示した。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で荘重な祝福・宣告の調子とした。「住むように」を独立させることで、日本語でも主語を補わず原文の曖昧さを保持した。
