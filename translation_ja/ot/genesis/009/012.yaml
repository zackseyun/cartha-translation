  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת הַ/בְּרִית֙ אֲשֶׁר אֲנִ֣י נֹתֵ֗ן בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּ/כֶ֑ם לְ/דֹרֹ֖ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/012.yaml
  text: And God said[a], “This is the sign of the covenant that I am giving between me and you and every living creature that is with you[b], for perpetual generations:”
translation:
  language: ja
  text: 神は言われた。「これは、わたしが、わたしとあなたがたとの間、またあなたがたと共にいるすべての生き物との間に与える、代々にわたる契約のしるしである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語の進行を示す接続形。日本語では文脈上不要な接続語を補わず、丁寧で自然な叙述とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: ノアに語る唯一の神を指す、この文脈での標準的な訳語。
- source_word: זֹאת אוֹת הַבְּרִית
  choice: これは…契約のしるしである
  rationale: 指示語と名詞文を自然な日本語の判断文にし、אוֹתを目に見える標識を表す「しるし」とした。
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: わたしが…与える
  rationale: נֹתֵןの基本義「与える」と継続的・遂行的な含みを保った。修飾先はヘブライ語の語順どおり「契約」と理解できる形にした。
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין
  choice: わたしとあなたがたとの間、また…との間に
  rationale: ביןの反復を日本語でも示し、契約に関わる当事者の範囲を明確にした。
- source_word: כָּל נֶפֶשׁ חַיָּה
  choice: すべての生き物
  rationale: 動物を含む生きた存在全般を指すため、「魂」のような人間論的含意を避けた。
- source_word: אֲשֶׁר אִתְּכֶם
  choice: あなたがたと共にいる
  rationale: 関係節を明示し、ノアたちと共にいる生き物を指すことを保った。
- source_word: לְדֹרֹת עוֹלָם
  choice: 代々にわたって永遠に
  rationale: דֹרֹתの世代的継続とעוֹלָםの永続性の双方を、自然で明瞭な日本語で表した。
theological_decisions:
- issue: נֹתֵןが修飾する対象と契約表現
  choice: 契約を「与える」
  alternative: 契約を「立てる」／しるしを「与える」
  rationale: 原文では関係節が「契約」に直結し、動詞も字義的には「与える」であるため、その構造を優先した。「立てる」は自然だが、原文の語彙的特徴を弱める。
- issue: נֶפֶשׁ חַיָּהの範囲
  choice: すべての生き物
  alternative: すべての生ける魂／すべての生きるもの
  rationale: 洪水後の文脈では動物を含む生命体を広く指す。「魂」は原文にない特定の人間論的理解を招きうるため避けた。
- issue: לְדֹרֹת עוֹלָםの永続性
  choice: 代々にわたって永遠に
  alternative: すべての世代にわたって／とこしえの代々に
  rationale: 期間の限界を独自に定めず、「世代」と「永続」の緊張をそのまま保持した。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある聖書本文。神の一人称は「わたし」、複数二人称は「あなたがた」とし、過度に古風な語法を避けた。原文末のコロン相当は、次節へ続く発話であることを日本語の文脈に委ね、通常の句点とした。
