  text: וְ/אַתֶּ֖ם פְּר֣וּ וּ/רְב֑וּ שִׁרְצ֥וּ בָ/אָ֖רֶץ וּ/רְבוּ בָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/007.yaml
  text: And as for you[a], be fruitful and multiply; swarm in the earth and multiply in it.
translation:
  language: ja
  text: あなたがたは、子を生み、数を増やせ。地に群がり[a]、そこで増えよ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「地に群がれ」とも訳せる。原語の動詞は、群れをなして盛んに繁殖し、数を増す様子を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתֶּם
  choice: あなたがたは
  rationale: 独立代名詞による強調を主題提示の「は」で表し、直前の文脈を受けて聞き手を際立たせた。接続詞は、日本語では明示しないほうが自然である。
- source_word: פְּרוּ
  choice: 子を生み
  rationale: 人間に対する命令として、実を結ぶという比喩を直訳せず、生殖を明瞭かつ自然に表した。
- source_word: וּרְבוּ
  choice: 数を増やせ／増えよ
  rationale: 数的な増加を示す語であり、前半では自然な他動詞表現、後半では場所を受ける自動詞表現とした。原文での反復は保持した。
- source_word: שִׁרְצוּ
  choice: 満ちあふれ
  rationale: 群れをなして盛んに繁殖・増殖する強い語感を、現代日本語として自然な表現で示した。原語の生き生きした比喩は脚注で補った。
- source_word: בָאָרֶץ
  choice: 地に
  rationale: 洪水後に人が増え広がる領域としての地・世界を指す。日本語では「地に」が簡潔で自然である。
- source_word: וּרְבוּ בָהּ
  choice: そこで増えよ
  rationale: 代名詞の指示先である「地」を「そこで」と受け、רבה の反復を訳文にも残した。
theological_decisions:
- issue: 創造時の命令と洪水後の祝福との関係
  choice: ノアとその息子たちへの、祝福の響きを持つ命令として簡潔に訳す
  alternative: 創世記1章28節の単なる反復と明示する、または契約についての教理的説明を本文に加える
  rationale: 原文は創世記1章28節と響き合う命令形を用いるが、その関係についての解釈は本文に付加せず、語句の反復によって共鳴を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の命令にふさわしい簡潔で重みのある文体とした。「子を生み、数を増やせ」で慣用的な創造命令の意味を自然に伝え、「満ちあふれ」に脚注を付して שׁרץ の強い増殖のイメージを保持した。
