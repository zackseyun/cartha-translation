id: GEN.9.23
reference: Genesis 9:23
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקַּח֩ שֵׁ֨ם וָ/יֶ֜פֶת אֶת הַ/שִּׂמְלָ֗ה וַ/יָּשִׂ֨ימוּ֙ עַל שְׁכֶ֣ם שְׁנֵי/הֶ֔ם וַ/יֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַ/יְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִי/הֶ֑ם וּ/פְנֵי/הֶם֙ אֲחֹ֣רַנִּ֔ית וְ/עֶרְוַ֥ת אֲבִי/הֶ֖ם לֹ֥א רָאֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/023.yaml
  text: Then Shem and Japheth took the garment and laid it on both their shoulders[a], and they walked backward and covered their father's nakedness. Their faces were turned backward, so they did not see their father's nakedness.
translation:
  language: ja
  text: そこで、セムとヤフェトはその衣[a]を取り、二人の肩に掛けて、後ろ向きに歩き、父の裸を覆った。二人は顔を後ろに向けていたので、父の裸を見なかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「外衣」とも訳せる。ヘブライ語は、ここでノアを覆うために用いられた、身にまとう衣を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取った
  rationale: 物を手に取ることを表す基本的な動詞として、物語の流れに自然な「取る」を用いた。
- source_word: שֵׁם וָיֶפֶת
  choice: セムとヤフェト
  rationale: 日本語聖書で広く定着している固有名の表記を用いた。
- source_word: הַשִּׂמְלָה
  choice: その衣
  rationale: שׂמלה は身にまとう衣、特に外衣を指し得る。「衣」は具体性を保ちつつ種類を限定しすぎず、定冠詞は文脈上の特定の衣を示す「その」で表した。
- source_word: וַיָּשִׂימוּ עַל שְׁכֶם שְׁנֵיהֶם
  choice: 二人の肩に掛けて
  rationale: 直訳的には「彼ら二人の肩の上に置いた」。二人で衣を支えた動作が自然に伝わる日本語とした。
- source_word: אֲחֹרַנִּית
  choice: 後ろ向きに／後ろに
  rationale: 後方への移動と顔の向きを表す同語の反復を、「後ろ」を繰り返すことで保持した。日本語として自然になるよう、それぞれ「後ろ向きに」「後ろに」とした。
- source_word: וַיְכַסּוּ
  choice: 覆った
  rationale: כסה の基本義をそのまま表し、衣で露出した体を覆う具体的な動作を示した。
- source_word: עֶרְוַת אֲבִיהֶם
  choice: 父の裸
  rationale: 直近の文脈では、衣で覆い、目にしないようにする父ノアの露出した体を指す。「裸」は日本語として簡潔であり、原文の羞恥と露出の含意を保つ。
- source_word: וּפְנֵיהֶם אֲחֹרַנִּית
  choice: 二人は顔を後ろに向けていた
  rationale: 原文は動詞のない節だが、日本語では向きが明確になるよう「向けていた」を補った。
- source_word: לֹא רָאוּ
  choice: 見なかった
  rationale: ראה の単純な否定として訳し、「見ようとしなかった」など意図を過度に明示する表現は避けた。
theological_decisions:
- issue: 「父の裸」の意味
  choice: ノアの露出した体として訳しつつ、原文どおり「父の裸」という表現を保つ
  alternative: 後代のレビ記的用法に基づく性的な婉曲表現として特定する
  rationale: この節では衣を取り、後ろ向きに歩き、見ないようにして父を覆うという具体的な行為が描かれている。したがって露出した体という直接的な意味が文脈に合うが、訳文では解釈を説明的に限定せず、原文の表現を保持した。
translation_notes:
  register: 明快な現代標準語を用いながら、物語にふさわしい簡潔で品位ある調子と、原文にある「後ろ」の反復を保った。「裸」は具体的だが過度に露骨ではなく、本文の羞恥と敬意の対照を自然に伝える。
