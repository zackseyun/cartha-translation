lexical_decisions:
- source_word: וַיְחִי
  choice: 生きた
  rationale: חיהのワイイクトール形で、洪水後のノアの生存期間を物語っている。系譜的な寿命の記述として自然であり、「生き延びた」のように救出の側面を過度に強調しない。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: אַחַר
  choice: 後
  rationale: 時間的な後続を示す前置詞であり、「洪水の後」という表現が明快で自然である。
- source_word: הַמַּבּוּל
  choice: 洪水
  rationale: 定冠詞を伴い、直前まで語られてきた特定の洪水を指す。日本語では文脈上「洪水」で十分に特定される。
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: 三百五十年
  rationale: ヘブライ語の「三百年と五十年」を、意味を保ちながら現代日本語で自然な複合数として表した。
