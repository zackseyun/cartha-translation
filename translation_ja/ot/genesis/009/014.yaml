  text: And when I bring clouds over the earth[a], the bow will be seen in the cloud,
translation:
  language: ja
  text: わたしが地の上に雲をかけるとき、雲の中に弓[a]が現れる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「虹」。ヘブライ語は通常「弓」を表す語で、ここでは契約のしるしである虹を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: とき
  rationale: 後続する出来事の未来的・時間的状況を導く構文として自然な現代日本語にした。
- source_word: בְּעַנְנִי עָנָן
  choice: わたしが…雲を起こす
  rationale: ענןの動詞的用法と目的語עָנָןを反映し、神が地の上に雲を生じさせる意味を簡潔に表した。
- source_word: עַל הָאָרֶץ
  choice: 地の上に
  rationale: 洪水後の契約の広い範囲を保ちつつ、前置詞עַלを明瞭に表した。
- source_word: וְנִרְאֲתָה
  choice: 現れる
  rationale: ראהのニファル形は「見られる／見えるようになる」を表す。日本語では受け身の「見られる」が意志的行為とも取られ得るため、「現れる」で可視化の意味を自然に示した。
- source_word: הַקֶּשֶׁת
  choice: 弓
  rationale: 通常「弓」を意味する語を保持し、契約のしるしとしての比喩的・視覚的連関を残した。文脈上の指示対象が虹であることは脚注で明示した。
- source_word: בֶּעָנָן
  choice: 雲の中に
  rationale: 定冠詞付き単数形を素直に反映した。
theological_decisions:
- issue: ノア契約の文脈におけるקֶשֶׁתの訳
  choice: 弓
  alternative: 虹
  rationale: 原語は武器の「弓」にも用いられる通常語であり、その語像を本文に保存した。指示対象を「虹」と明示する訳も可能なので脚注に示し、意味を不必要に限定しないようにした。
translation_notes:
  register: 平明で格調を失わない現代標準語。「雲を起こす」は神を主語とする使役的な意味を自然に表し、「弓」は原語の像を保つ。
