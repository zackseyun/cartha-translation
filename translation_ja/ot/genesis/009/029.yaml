  text: ノアの生涯は、全部で九百五十年であった。そして彼は死んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי נֹחַ
  choice: ノアの生涯は合わせて
  rationale: 直訳的には「ノアの日々はすべて」であり、全生涯の年数を総括する系譜上の定型表現である。現代日本語で意味が明確になるよう「生涯」とし、וַיִּהְיוּ の総計を示す働きを「合わせて」で表した。
- source_word: תְּשַׁע מֵאוֹת שָׁנָה וַחֲמִשִּׁים שָׁנָה
  choice: 九百五十年
  rationale: ヘブライ語は「九百年と五十年」と二つの数を接続するが、日本語で自然な数の表現にまとめた。
- source_word: וַיָּמֹת
  choice: こうして彼は死んだ
  rationale: 物語を進める接続形であり、寿命の総括を締めくくる定型句である。「こうして」は前文を受けた結末を自然に示し、「彼」は主語ノアを明示する。
