  yaml_path: translation/ot/genesis/009/003.yaml
  text: Every moving thing that is alive shall be food for you. As I gave you the green plants[a], I have given you everything.
translation:
  language: ja
  text: 生きて動くすべてのもの[a]は、あなたがたの食べ物となる。緑の草を与えたように、わたしはすべてのものをあなたがたに与えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「生きているすべての這うもの」。ヘブライ語レメスは、這うものや群がるものを指すことがあるが、ここでは文脈上、より広く用いられていると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל רֶמֶשׂ אֲשֶׁר הוּא חַי
  choice: 生きて動くものはすべて
  rationale: רֶמֶשׂ は這うもの、群がるものを指すこともあるが、ここでは כָּל と חַי、さらに後半の אֶת כֹּל によって包括的に用いられている。「生きて動くもの」は語の運動性を保ちつつ、不自然に範囲を狭めない。
- source_word: לָכֶם יִהְיֶה לְאָכְלָה
  choice: あなたがたの食べ物となる
  rationale: 与格と述語表現を自然な現代日本語にし、食物としての許可・供与を表した。
- source_word: כְּיֶרֶק עֵשֶׂב
  choice: 青草を与えたように
  rationale: יֶרֶק עֵשֶׂב は食物として以前に与えられた緑の植物・草本を集合的に指す。「青草」は簡潔で、創世記1章29–30節との語彙上のつながりも保つ。
- source_word: נָתַתִּי
  choice: わたしは…与える
  rationale: ヘブライ語の完了形は、発話によって成立する供与を表しうる。日本語では現在有効となる神の授与を自然に示すため「与える」とした。
- source_word: אֶת כֹּל
  choice: すべてのものを
  rationale: 包括的・集合的な目的語であることを明示し、前半の「すべて」と対応させた。
theological_decisions:
- issue: 洪水後に食物として許される動物の範囲
  choice: この節は、生きて動くものを包括的に人の食物として与える表現とした。
  alternative: רֶמֶשׂ を狭く取り、這うもの、または群がる小動物だけを指すとする。
  rationale: רֶמֶשׂ 単独には狭い用法もあるが、כָּל、אֲשֶׁר הוּא חַי、および אֶת כֹּל がこの文脈で包括的な範囲を示す。ただし、後続節による制限をこの節自体に先取りして加えてはいない。
translation_notes:
  register: 明快で格調を保った現代標準語。「食べ物となる」で宣言・許可の響きを示し、「わたし」を用いて神の直接話法を自然に表した。
