  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַךְ בָּשָׂ֕ר בְּ/נַפְשׁ֥/וֹ דָמ֖/וֹ לֹ֥א תֹאכֵֽלוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/004.yaml
  text: But you shall not eat flesh with its life[a], that is[b], its blood.
translation:
  language: ja
  text: ただし、肉は、その命、すなわちその血とともに食べてはならない。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近い表現では「ただし、その命、その血とともに肉を食べてはならない」。ヘブライ語では「その命」と「その血」が説明語なしに並べられている。
    reason: 原文の簡潔な同格表現と、その統語上の曖昧さを示すため。
lexical_decisions:
- source_word: אַךְ
  choice: ただし
  rationale: 前節で動物を食物として許したことに制限を加える語。現代日本語で自然に例外・制限を示す「ただし」とした。
- source_word: בָּשָׂר
  choice: 肉
  rationale: ここでは食べる対象となる動物の肉を指すため、現代日本語で明瞭な「肉」とした。
- source_word: בְּנַפְשׁוֹ
  choice: その命とともに
  rationale: נֶפֶשׁ はこの文脈では非物質的な「魂」ではなく、生き物の生命を表す。前置詞 בְּ の随伴的な意味を「とともに」で示した。
- source_word: דָמוֹ
  choice: その血
  rationale: דָם の具体的な意味を保ち、「命」との関係を本文中で示した。
- source_word: לֹא תֹאכֵלוּ
  choice: 食べてはならない
  rationale: 否定辞を伴う未完了形が表す禁止を、簡潔で格調を保った現代日本語にした。
theological_decisions:
- issue: נֶפֶשׁ と血の関係
  choice: נֶפֶשׁ を「命」とし、血をそれと同格に置く関係を「すなわち」で表した。
  alternative: 「魂」と訳す、または同格関係を明示せず「その命、その血」と並べる。
  rationale: この箇所は血を生き物の命と結び付けており、後代の霊魂論を述べているわけではない。「すなわち」は簡潔なヘブライ語の同格関係を日本語で明瞭にするが、原文の圧縮された語順は脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語。「ただし」と「食べてはならない」により、前節への制限と法的な禁止の調子を保った。「魂」のような後代の教理的含意を避けた。
