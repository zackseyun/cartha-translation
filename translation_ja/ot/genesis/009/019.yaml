  text: שְׁלֹשָׁ֥ה אֵ֖לֶּה בְּנֵי נֹ֑חַ וּ/מֵ/אֵ֖לֶּה נָֽפְצָ֥ה כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/019.yaml
  text: These three were the sons of Noah[a], and from these the whole earth was populated.
translation:
  language: ja
  text: この三人はノアの息子たちであり、彼らから全地の人々が広がった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「彼らから全地が散らされた」、または「広がった」。ここで「全地」は、その地に住む人々を指す表現である。
    reason: נָפְצָהの「散る／広がる」という語義の幅と、原文で「全地」が主語となっている換喩的表現を示すため。
lexical_decisions:
- source_word: שְׁלֹשָׁה אֵלֶּה
  choice: この三人
  rationale: 前置された数詞と指示語の強調を保ちつつ、現代日本語として自然に表現した。
- source_word: בְּנֵי נֹחַ
  choice: ノアの息子たち
  rationale: ヘブライ語の連語を直接的かつ自然に訳した。原文には繋辞がないため、日本語では「であり」で文をつないだ。
- source_word: וּמֵאֵלֶּה
  choice: 彼らから
  rationale: 前半の「この三人」を明確に受ける自然な日本語とした。「これらの者から」よりも平明である。
- source_word: נָפְצָה
  choice: 人々が広がった
  rationale: 語の中心的な意味は「散る、散らされる、広がる」だが、この系譜的文脈では三人の子孫が各地へ広がったことを表す。本文では暗示された人間を補って自然にし、原文に近い表現は脚注に残した。
- source_word: כָל הָאָרֶץ
  choice: 全地に
  rationale: 洪水後の全人類を視野に入れた要約として、אֶרֶץを「地」とした。日本語では人々の拡散先として「全地に」とするのが自然である。
theological_decisions:
- issue: 洪水後の諸民族の文脈における הָאָרֶץ の範囲
  choice: 全地
  alternative: 全土
  rationale: この節はノアの息子たちから人類が広がったことを総括しており、局地的な「土地」より世界全体を指す理解が文脈に適する。ただし、語そのものには「土地、国土」の意味もある。
- issue: נָפְצָה の主語と意味の表現
  choice: 彼らから全地に人々が広がった
  alternative: 彼らから全地が散らされた／広がった
  rationale: 原文では「全地」が文法上の主語だが、住民を土地で表す換喩と理解できる。本文では意味を明瞭にしつつ、直訳的な構文と語義を脚注で示して曖昧さを隠さない。
translation_notes:
  register: 平明な現代標準日本語を用いながら、聖書本文にふさわしい簡潔で品位ある調子とした。「人々」を補うことで意味を明確にし、原文の換喩的表現は脚注に保存した。
