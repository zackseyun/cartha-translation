source:
  edition: WLC
  text: אֶת קַשְׁתִּ֕/י נָתַ֖תִּי בֶּֽ/עָנָ֑ן וְ/הָֽיְתָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵ֥ין הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/013.yaml
  text: I have set my bow in the cloud[a], and it will be a sign of the covenant between me and the earth.
translation:
  language: ja
  text: わたしは雲の中にわたしの弓[a]を置いた。それは、わたしと地との間の契約のしるしとなる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「わたしの虹」。ヘブライ語では文字どおり「わたしの弓」。通常、弓を表す語だが、ここでは雲の中に現れる虹を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: קַשְׁתִּי
  choice: わたしの弓
  rationale: קֶשֶׁת は通常「弓」を意味する。雲の中という文脈では虹を指すが、武器である弓との原語のイメージを本文に残し、文脈上の意味を脚注で示した。
- source_word: נָתַתִּי
  choice: 置いた
  rationale: נתן の「与える／置く／据える」という語義のうち、弓を雲の中に据えるこの文脈に自然な「置いた」を採用した。ヘブライ語の完了形を、ここでは完了した行為として明瞭に表した。
- source_word: בֶּעָנָן
  choice: 雲の中に
  rationale: 定冠詞を伴う単数形を直接的に訳した。日本語でも、この現象が現れる雲を集合的・一般的に表せる。
- source_word: וְהָיְתָה
  choice: それは……となる
  rationale: 先行する女性名詞「弓」を受け、文脈上の結果・将来的機能を示す表現とした。
- source_word: לְאוֹת בְּרִית
  choice: 契約のしるし
  rationale: אוֹת は「しるし」、בְּרִית は直前から続く特定の契約を指す。自然な日本語の連語として訳した。
- source_word: בֵּינִי וּבֵין הָאָרֶץ
  choice: わたしと地との間
  rationale: אֶרֶץ は「地／土地」を意味し得るが、洪水物語における契約の普遍的範囲から「地」とした。「地球」よりも聖書的な広がりを保つ。
theological_decisions:
- issue: 契約の文脈における קַשְׁתִּי の指示対象
  choice: 本文では字義的な「わたしの弓」を保ち、文脈上は虹を指すことを脚注で示す
  alternative: わたしの虹
  rationale: 原語は武器の「弓」に用いる通常の語であり、その比喩的な響きを失わないよう本文に残した。一方、現象としての指示対象が虹であることは脚注で明確にした。
translation_notes:
  register: 明瞭で現代的かつ荘重な語調とした。神の発言として「わたし」を用い、「地」は洪水後の契約の広がりを保つ表現とした。
