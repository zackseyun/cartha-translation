source:
  edition: WLC
  text: וַ/יָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽ/אֲדָמָ֑ה וַ/יִּטַּ֖ע כָּֽרֶם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/020.yaml
  text: Noah[a], a man of the soil[b], began to plant a vineyard.
translation:
  language: ja
  text: 土を耕す人ノアは、ぶどう畑を作り始めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「土を耕す人ノアは、最初にぶどう畑を作った」。ヘブライ語の表現は簡潔に圧縮されており、「始めた」を「最初に行った」の意味に取ることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: 始めた
  rationale: ヒフィル形を文脈に即して「始めた」と取り、後続の「植えた」と一続きの内容として自然な日本語にした。語根が他の語形・文脈で持ち得る「汚す」という意味は、ここには適さない。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で定着している人名表記。
- source_word: אִישׁ הָאֲדָמָה
  choice: 土を耕す人
  rationale: 直訳的には「土の人」。農耕に携わる者という意味を、現代日本語で明瞭かつ自然に表した。単に「農夫」とすると職業名として限定しすぎるため、この表現を採用した。
- source_word: וַיִּטַּע
  choice: 作り
  rationale: נטע 自体は「植える」だが、日本語ではぶどう園・ぶどう畑について「作る」が自然であり、ぶどうを植えて畑を設ける行為を表せる。
- source_word: כָּרֶם
  choice: ぶどう畑
  rationale: ぶどうを栽培する区画を指す語として、一般読者に明瞭な表現。
theological_decisions:
- issue: וַיָּחֶל … וַיִּטַּע という圧縮された連続表現の解釈
  choice: ぶどう畑を作り始めた
  alternative: ぶどう畑を作った最初の人となった／始めて、ぶどう畑を作った
  rationale: 「始めた」の意味を後続動詞に及ぼす読みが、本文の素直な物語展開を保つ。「最初の人」は可能な解釈だが、原文に明示されていないため本文には入れず、脚注で示した。
translation_notes:
  register: 明瞭で品位ある現代標準語。「土の人」という不自然な逐語訳を避けつつ、農耕者という原文の含意を保持した。
