  text: その時、神はノアと、彼と共にいた息子たちに、次のように言われた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: その時、…言われた
  rationale: 物語を前へ進めるワウ継続法の順次性を、現代日本語として自然に示す。神の発話には敬意を表す語形を用いた。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この文脈ではノアに語る唯一の神を指す標準的な訳語。
- source_word: אֶל־נֹחַ וְאֶל־בָּנָיו
  choice: ノアと…息子たちに
  rationale: 二組の話し相手を自然な日本語で並列し、בָּנִים は性別を一般化せず「息子たち」とした。
- source_word: אִתּוֹ
  choice: 彼と共にいた
  rationale: 息子たちがノアと一緒にいたことを明確にしつつ、ヘブライ語の修飾関係を保つ。
- source_word: לֵאמֹר
  choice: （独立には訳出せず）
  rationale: 後続の直接話法を導く定型表現であり、日本語では「言われた」でその機能が自然に表される。重ねて「言って言われた」とはしない。
