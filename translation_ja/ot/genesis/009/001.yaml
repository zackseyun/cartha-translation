id: GEN.9.1
reference: Genesis 9:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְבָ֣רֶךְ אֱלֹהִ֔ים אֶת נֹ֖חַ וְ/אֶת בָּנָ֑י/ו וַ/יֹּ֧אמֶר לָ/הֶ֛ם פְּר֥וּ וּ/רְב֖וּ וּ/מִלְא֥וּ אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/001.yaml
  text: And God blessed Noah and his sons[a], and said to them, “Be fruitful and multiply and fill the earth.”
translation:
  language: ja
  text: 神はノアとその息子たちを祝福し、彼らに言われた。「生めよ、増えよ、地[a]に満ちよ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「土地」とも訳せる。ここでは、洪水後の文脈と創世記1:28との響き合いから、世界全体としての「地」を指すと考えられる。
    reason: 語義上の別訳と文脈上の範囲を示すため。
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: 祝福し
  rationale: ピエル形の動詞は、単に好意的な言葉を述べることではなく、祝福を授けることを表す。日本語として自然で、創世記の文脈にも適する。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この物語では唯一の神を指しているため、「神」とした。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で定着している固有名の表記を用いた。
- source_word: בָּנָיו
  choice: その息子たち
  rationale: ヘブライ語は一般的な「子どもたち」ではなく、明確にノアの息子たちを指す。
- source_word: וַיֹּאמֶר לָהֶם
  choice: 彼らに言われた
  rationale: 単純な発話導入の意味を保ちつつ、現代日本語の聖書文体として自然な敬意を示した。
- source_word: פְּרוּ
  choice: 生めよ
  rationale: 子孫をもうけるよう命じる語であり、創世記1:28との意図的な反復を保てる簡潔な表現とした。
- source_word: וּרְבוּ
  choice: 増えよ
  rationale: 数が多くなることを表す命令であり、「生めよ」との並行関係を簡潔に伝える。
- source_word: וּמִלְאוּ
  choice: 満ちよ
  rationale: 「満たす、いっぱいになる」という意味を保ち、原文の簡潔な三つの命令のリズムにも沿う。
- source_word: הָאָרֶץ
  choice: 地
  rationale: 「地、土地」の両義性をある程度保ちながら、洪水後の全世界的な文脈と創世記1:28との響き合いを自然に示す。
theological_decisions:
- issue: 創世記1:28の創造時の祝福との関係
  choice: 「生めよ、増えよ、地に満ちよ」という簡潔で対応する表現を採用した。
  alternative: 「多くの子をもうけ、世界中に広がりなさい」のように説明的に訳す。
  rationale: ヘブライ語は創世記1:28の祝福の言葉を反復している。対応する表現を保つことで、洪水後の人類と最初の創造命令との連続性を、解釈を付け加えずに伝えられる。
translation_notes:
  register: 明快な現代標準日本語を用いながら、命令部分は簡潔で格調のある「生めよ、増えよ、地に満ちよ」とした。原文の反復と創世記1:28への響きを保ち、過度に説明的な言い換えは避けた。
