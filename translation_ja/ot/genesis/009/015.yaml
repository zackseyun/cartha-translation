  text: וְ/זָכַרְתִּ֣י אֶת בְּרִיתִ֗/י אֲשֶׁ֤ר בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֛ין כָּל נֶ֥פֶשׁ חַיָּ֖ה בְּ/כָל בָּשָׂ֑ר וְ/לֹֽא יִֽהְיֶ֨ה ע֤וֹד הַ/מַּ֨יִם֙ לְ/מַבּ֔וּל לְ/שַׁחֵ֖ת כָּל בָּשָֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/015.yaml
  text: and I will remember my covenant that is between me and you and every living creature among all flesh[b][a], and the waters will never again become a flood to destroy all flesh.
translation:
  language: ja
  text: わたしは、わたしとあなたがた、またあらゆる生き物との間にあるわたしの契約を思い起こす。水が再び大洪水となって、すべての生き物を滅ぼすことは決してない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתִּי
  choice: わたしは…思い起こす
  rationale: 一人称単数の完了形は、神の発言という文脈で将来の意味を帯びる。契約に関わる「覚える」という原文の重要な表現を、行動だけに言い換えず保持した。
- source_word: בְּרִיתִי
  choice: わたしの…契約
  rationale: בְּרִית の正式な関係・約束を表す標準的な訳語として「契約」を用いた。
- source_word: כָּל נֶפֶשׁ חַיָּה בְּכָל בָּשָׂר
  choice: すべて肉なるもののうちの、あらゆる生き物
  rationale: נֶפֶשׁ חַיָּה はここでは動物を含む生命ある存在を指す。「のうちの」により בְּ の分類・包含的関係を表した。
- source_word: וְלֹא יִהְיֶה עוֹד הַמַּיִם לְמַבּוּל
  choice: 水が再び大洪水となって…ことはない
  rationale: עוֹד を伴う否定を「再び…ことはない」とし、לְמַבּוּל は水が大洪水となる結果・機能として自然な日本語にした。
- source_word: לְשַׁחֵת
  choice: 滅ぼす
  rationale: 大洪水の目的・結果を示す不定詞を、重みのある標準的な語で訳した。
- source_word: כָּל בָּשָׂר
  choice: すべて肉なるもの
  rationale: 人間だけでなく動物も含む身体ある生命全体という範囲を保ち、原文の反復も維持した。
theological_decisions:
- issue: 神が契約を「覚える」という擬人的表現
  choice: 「思い起こす」を保持する
  alternative: 「契約に従って行動する」「契約を心に留める」
  rationale: 原文は明示的に זכר を用いるため、その契約的な語法と神学的緊張を説明的な言い換えで解消しない。
translation_notes:
  register: 現代の一般読者に理解できる、明瞭で品位ある文体。「肉なるもの」は日常語ではないが、בָּשָׂר の広い範囲と節内の反復を保つため採用した。主語と修飾関係が長いため読点を置き、契約の当事者である「あなたがた」と「あらゆる生き物」を明確にした。
