  to: わたしは、わたしとあなたがた、またあらゆる生き物との間にあるわたしの契約を思い起こす。水が再び大洪水となって、すべての生き物を滅ぼすことは決してない。
  rationale: 契約の当事者である神、あなたがた、あらゆる生き物を自然な並列で示した。「肉なるもの」という不自然な直訳を「生き物」に改め、原文で繰り返される全包括的な対象範囲を日本語で明瞭に保った。「決してない」により、לֹא…עוֹדの恒久的な否定を明示した。
