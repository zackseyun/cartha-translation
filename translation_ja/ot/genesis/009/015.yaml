  source_fidelity: 原文の契約の三者関係、神の「思い起こす」という表現、再び洪水が全生き物を滅ぼすことはないという保証は保持されている。しかし、「すべて肉なるもののうちの、あらゆる生き物」は現代日本語として不自然で、係り受けが取りにくい。
  naturalness: 「肉なるもの」は現代の一般読者には硬く不自然であり、本文の明瞭な現代標準日本語という目標に適さない。「すべての生き物」とすることで、文意と対象範囲を自然に明示できる。
  terminology: 「契約」「思い起こす」「大洪水」「滅ぼす」は適切である。「思い起こす」は神の記憶に関する原文の表現を説明的に弱めずに保つ。「すべての生き物」はここでの「すべての肉」の、人間と動物を含む生ある被造物という文脈上の指示対象を自然に表す。
