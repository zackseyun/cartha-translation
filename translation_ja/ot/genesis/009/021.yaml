source:
  edition: WLC
  text: וַ/יֵּ֥שְׁתְּ מִן הַ/יַּ֖יִן וַ/יִּשְׁכָּ֑ר וַ/יִּתְגַּ֖ל בְּ/ת֥וֹךְ אָהֳלֹֽ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/021.yaml
  text: He drank some of the wine[a], became drunk[b], and uncovered himself inside his tent.
translation:
  language: ja
  text: 彼はそのぶどう酒を飲み[a]、酔って、天幕の中で裸になった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「そのぶどう酒から飲み」。ここでは、そのぶどう酒の一部を飲んだという意味と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「裸でいた」または「身をさらした」。ヘブライ語の動詞は、自分で裸になったという意味にも、裸の状態になったという意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁתְּ
  choice: 彼は…飲み
  rationale: שׁתהのカル・ワイイクトルで、物語上の継起する行為を表す。日本語では連用形「飲み」によって後続の出来事へ自然につなげる。
- source_word: מִן הַיַּיִן
  choice: そのぶどう酒を
  rationale: מִןはここでは部分を表し、すでに言及されたぶどう酒の一部を飲んだ意と理解できる。日本語では目的語を単に「そのぶどう酒を」とするのが自然であり、全量を飲んだとは必ずしも含意しない。直訳的な別案は脚注に残す。
- source_word: וַיִּשְׁכָּר
  choice: 酔って
  rationale: שׁכרのカルで、酩酊状態に至ったことを表す。現代日本語の簡潔な叙述として「酔って」が自然である。
- source_word: וַיִּתְגַּל
  choice: 裸になった
  rationale: גלהのヒトパエル。自ら身を露出したという再帰的・結果的な含みを、過度に行為の意図を強調せず自然に表す。「身をさらした」「裸でいた」という可能性は脚注に示す。
- source_word: בְּתוֹךְ אָהֳלֹה
  choice: 天幕の中で
  rationale: בְּתוֹךְは空間の内部を示す。「天幕の中で」は明瞭で自然な現代日本語である。接尾辞は「彼の天幕」だが、主語との関係が明白なため日本語では所有表現を省いた。
theological_decisions:
- issue: ノアの酩酊と露出に対する道徳的・神学的評価
  choice: ヘブライ語が述べる飲酒、酩酊、露出を記述するにとどめ、明示されていない道徳的評価や性的意味を加えない。
  alternative: 「天幕の中で裸で寝ていた」「天幕の中で身をさらした」
  rationale: 本文は出来事を報告するが、この節自体では明示的な評価を下していない。「裸になった」は露出を伝えつつ、意図や姿勢を断定せず、後続文脈がその意味を示す余地を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ぶどう酒」「天幕」は創世記の古代的背景に適した一般的な聖書語彙として用いた。継起する三動作は「飲み、酔って、…なった」と自然に連結し、原文の簡潔な物語調を保った。
