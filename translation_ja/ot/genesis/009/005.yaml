id: GEN.9.5
reference: Genesis 9:5
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אַ֨ךְ אֶת דִּמְ/כֶ֤ם לְ/נַפְשֹֽׁתֵי/כֶם֙ אֶדְרֹ֔שׁ מִ/יַּ֥ד כָּל חַיָּ֖ה אֶדְרְשֶׁ֑/נּוּ וּ/מִ/יַּ֣ד הָֽ/אָדָ֗ם מִ/יַּד֙ אִ֣ישׁ אָחִ֔י/ו אֶדְרֹ֖שׁ אֶת נֶ֥פֶשׁ הָֽ/אָדָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/009/005.yaml
  text: And surely I will require your blood for your lives[a]. From the hand of every beast I will require it[e][d][c][b], and from the hand of man—from the hand of each man's brother—I will require the life of the man.
translation:
  language: ja
  text: ただし、あなたがたの命にかかわる血について、わたしは必ず責任を問う[a]。すべての獣の手から、その血について責任を問う[b]。また人の手からも、すなわち各人の兄弟の手からも、人の命について責任を問う[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「あなたがたの血を、あなたがたの命のために」。ヘブライ語は「血」と「命」を別々の語で述べ、その関係を示しています。
    reason: lexical_alternative
  - marker: b
    text: 「責任を問う」は、直訳では「求める」。この文脈では、流された血について申し開きや償いを求める司法的な意味があります。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「人の手から、その兄弟である人の手から」。ここで「兄弟」は血縁上の兄弟に限らず、他の人間を指すことがあります。
    reason: syntax_and_lexical_alternative
lexical_decisions:
- source_word: וְאַךְ
  choice: ただし、…必ず
  rationale: וְ の接続と אַךְ の限定・強調を、現代日本語として自然な「ただし」と「必ず」で表した。
- source_word: דִּמְכֶם לְנַפְשֹׁתֵיכֶם
  choice: あなたがたの血、すなわちあなたがたの命にかかわる血
  rationale: דָּם（血）と נֶפֶשׁ（命）を区別して示しつつ、ここで両者が密接に結びついていることを明確にした。לְ の厳密な関係には幅があるため脚注で別訳を示した。
- source_word: אֶדְרֹשׁ / אֶדְרְשֶׁנּוּ
  choice: 責任を問う／その責任を問う
  rationale: דרשׁ はこの文脈で、流血について司法的な申し開きや償いを要求する意を持つ。「責任を問う」は現代日本語でその法的含意を自然に伝える。
- source_word: מִיַּד
  choice: …の手から
  rationale: 行為主体と責任を表すヘブライ語の反復的な慣用表現を保持した。獣については日本語では異例だが、原文の印象と人との並行関係を伝えるため残した。
- source_word: כָּל חַיָּה
  choice: どの獣
  rationale: 人と対比される動物を指す。厳粛な文脈と野獣を含む語感を保つため「獣」とした。
- source_word: אִישׁ אָחִיו
  choice: その同胞である一人一人
  rationale: 字義的には「人、その兄弟」。血縁上の兄弟だけに限定せず、人が同じ人間である他者に対して負う責任を示しながら、אָחִיו の同胞性を保持した。
- source_word: נֶפֶשׁ הָאָדָם
  choice: 人の命
  rationale: 血を流すことへの責任が主題なので、נֶפֶשׁ は非物質的な「魂」ではなく具体的な「命」を表す。
theological_decisions:
- issue: 血と命の関係
  choice: 「血、すなわち…命にかかわる血」と訳し、両語を結びつけつつ区別する
  alternative: 「あなたがたの命の血」または「あなたがたの血を、あなたがたの命のために」
  rationale: 原文は血と命を密接に関連づけるが、同一語としてはいない。本文で関係を明瞭にし、לְ の解釈の幅は脚注に残した。
- issue: דרשׁ の司法的意味
  choice: 「責任を問う」
  alternative: 「要求する」「償いを求める」
  rationale: 神が殺害された命について行為者に申し開きを求める法的含意を伝える一方、具体的な刑罰を本文以上に確定しない。
- issue: נֶפֶשׁ の意味
  choice: 「命」
  alternative: 「魂」
  rationale: この節では血と殺害への責任が文脈であり、身体と別個の魂についての教理的主張は前景化されていない。
- issue: אִישׁ אָחִיו の範囲
  choice: 人間同士の同胞性を示す表現として訳す
  alternative: 血縁上の「各人の兄弟」と限定する
  rationale: この句は、人が別の人の命について負う普遍的な責任を強調すると理解できる。ただし原文の「兄弟」という関係語の響きは「同胞」に残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の宣言としての厳粛さを保った。「手から」の反復は通常の日本語より形式的だが、原文の司法的な比喩と獣・人の並行を保存するため採用した。ダッシュは「人の手から」を後続句が具体化する同格関係を示す。
