base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/009.yaml
  text: So Abimelech called Isaac and said[a], “Surely, she is your wife! So how could you say, ‘She is my sister’?” And Isaac said to him, “Because I said[c][b], ‘Lest I die because of her.’”
translation:
  language: ja
  text: そこでアビメレクはイサクを呼び寄せて言った。「なんと、彼女はあなたの妻だ。それなのに、どうして『私の妹です』と言ったのか。」イサクは答えた。「彼女のことで死ぬかもしれないと思ったからです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... לְיִצְחָק
  choice: イサクを呼び寄せて
  rationale: קרא に人物を示す לְ が続く用法は、相手を呼ぶ、または呼び寄せることを表す。王がイサクを問いただす場面に自然な表現とした。
- source_word: אַךְ הִנֵּה
  choice: なんと、…ではないか
  rationale: אַךְ の強い断定と הִנֵּה の注意喚起を、一つの自然な驚きの表現にまとめた。疑問語にはせず、アビメレクが知った事実を強く述べる発言として訳した。
- source_word: וְאֵיךְ
  choice: それなのに、どうして
  rationale: 接続詞と疑問詞が表す、直前の事実を踏まえた非難と驚きを明瞭に伝える。
- source_word: אֲחֹתִי הִוא
  choice: 私の妹です
  rationale: אחות の通常の意味である「姉妹」を、年齢関係が文脈から確定できない日本語でも発話として自然な「妹」とした。創世記26章7節のイサクの言い方と対応する。
- source_word: כִּי אָמַרְתִּי
  choice: …と思ったからです
  rationale: אמר は字義的には「言う」だが、ここではイサクの内心の判断を導くため、日本語で自然な「思った」とした。
- source_word: פֶּן אָמוּת עָלֶיהָ
  choice: 彼女のことで死ぬかもしれない
  rationale: פֶּן が表す恐れられた可能性を「かもしれない」で示し、עָלֶיהָ は原因・契機を表す「彼女のことで」とした。文脈上は彼女をめぐって殺される恐れだが、本文ではヘブライ語の「死ぬ」という表現を保った。
theological_decisions: []
