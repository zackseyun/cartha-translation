id: GEN.26.12
reference: Genesis 26:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּזְרַ֤ע יִצְחָק֙ בָּ/אָ֣רֶץ הַ/הִ֔וא וַ/יִּמְצָ֛א בַּ/שָּׁנָ֥ה הַ/הִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽ/יְבָרֲכֵ֖/הוּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/012.yaml
  text: Isaac sowed in that land[a], and in that year he found a hundredfold, and Yahweh blessed him.
translation:
  language: ja
  text: イサクはその地に種をまき、その年に百倍の収穫を得た[a]。そして、ヤハウェは彼を祝福された。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「百の שְׁעָרִים を得た」。このヘブライ語表現は、種まきに対して百倍の収穫があったこと、または非常に豊かな収穫を得たことを指すと考えられる。別訳「百の分量を得た」。
    reason: מֵאָה שְׁעָרִים の語義と古代の収穫量表現に曖昧さがあるため。
lexical_decisions:
- source_word: וַיִּזְרַע
  choice: 種をまき
  rationale: 農耕の文脈における זרע の基本的な意味を、自然な現代日本語で直接表した。
- source_word: בָּאָרֶץ הַהִוא
  choice: その地に
  rationale: אֶרֶץ の領域的な意味を保ちつつ、政治的な「国」という含みを不必要に加えない表現とした。
- source_word: וַיִּמְצָא
  choice: 得た
  rationale: 基本義は「見いだした」だが、ここでは収穫量を得るという農耕上の慣用的用法である。「収穫した」と意訳しすぎず、原語の広さもある程度保つ。
- source_word: בַּשָּׁנָה הַהִוא
  choice: その年に
  rationale: ヘブライ語の時間表現を簡潔かつ直接的に訳した。
- source_word: מֵאָה שְׁעָרִים
  choice: 百倍の収穫
  rationale: 豊作を表す慣用句と理解し、現代の読者に意味が通る形にした。ただし שְׁעָרִים の厳密なニュアンスには不確かさがあるため脚注で示した。
- source_word: וַיְבָרֲכֵהוּ
  choice: 彼を祝福された
  rationale: ברך の神学的・叙述的な意味を「繁栄させた」へ狭めず、「祝福する」と訳した。神を主語とするため自然な敬語を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有名を用いていることを明示し、称号への置換を避けた。
- issue: 豊作と神の祝福との関係
  choice: 二つの節を「そして」で並置する
  alternative: 「ヤハウェが祝福されたので、百倍の収穫を得た」と因果関係を明示する
  rationale: 文脈上は豊作が祝福の現れと読めるが、原文は接続詞で出来事を並べている。因果関係を訳文で明示しすぎず、原文の叙述上の余地を保った。
- issue: מֵאָה שְׁעָרִים の解釈
  choice: 百倍の収穫
  alternative: 百の量／百の升目
  rationale: 農耕文脈では非常に豊かな収穫を指す表現と考えられるが、語句の字義と具体的な計量法は確定しにくいため、本文では通じやすい意味を示し、脚注で曖昧さを保持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「種をまく」「収穫を得る」という一般的な農耕語彙を用い、神名は「ヤハウェ」とした。原文にない明示的な因果関係は加えていない。
