  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֖אמֶר אַל תֵּרֵ֣ד מִצְרָ֑יְמָ/ה שְׁכֹ֣ן בָּ/אָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/002.yaml
  text: Then Yahweh appeared to him and said[a], “Do not go down to Egypt. Dwell in the land that I will tell you.”
translation:
  language: ja
  text: そのとき、ヤハウェはイサクに現れ、言われた。「エジプトへ下ってはならない。わたしがあなたに告げる地に住みなさい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「住みなさい」は「とどまりなさい」とも訳せる。後半はより字義的には、「わたしがあなたに言う地に住みなさい」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 現れて
  rationale: ראהのニファル形で、神が目に見える仕方または明らかな仕方で姿を現したことを表す。現れ方を必要以上に限定しない自然な訳。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、一般的な日本語音写で表した。
- source_word: אַל תֵּרֵד מִצְרָיְמָה
  choice: エジプトへ下ってはならない
  rationale: אַלと未完了形による禁止を表し、エジプトへの移動を「下る」と表現する原文の地理的慣用も保持した。
- source_word: שְׁכֹן
  choice: 住みなさい
  rationale: שכןの命令形が表す、ある場所に居住するという意味を、明瞭で自然な現代日本語にした。文脈によっては「とどまりなさい」とも理解できる。
- source_word: בָּאָרֶץ
  choice: 地に
  rationale: ここでは地球全体ではなく、イサクが居住すべき土地・地域を指す。
- source_word: אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: わたしがあなたに告げる
  rationale: אמרの未完了形が示す、これから与えられる指示を保ちつつ、「告げる地」という自然な日本語にした。「示す」と意訳して指示の内容を限定することは避けた。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく神の固有名を用いているため、その区別を保つ音写を採用した。
- issue: 神が現れた仕方
  choice: 現れて
  alternative: ご自身を現して／姿を見せて
  rationale: 原文は出現の具体的な様態を説明していないため、それを可視的な身体形態などに限定しない表現とした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「下ってはならない」によって原文の移動表現を残し、「居住しなさい」より日常的で理解しやすい「住みなさい」を用いた。主語の「彼」は文脈上の指示対象であるイサクと明示した。
