  yaml_path: translation/ot/genesis/026/027.yaml
  text: Isaac said to them[a], “Why have you come to me, since you hated me and sent me away from among you?”
translation:
  language: ja
  text: イサクは彼らに言った。「あなたがたは私を憎み、私をあなたがたのもとから去らせたのに、なぜ私のところに来たのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יִצְחָק
  choice: イサクは彼らに言った
  rationale: 物語を導入するאמרと、אלによる話し相手の表示を、自然な現代日本語の語順で表した。
- source_word: מַדּוּעַ בָּאתֶם אֵלָי
  choice: なぜ私のところに来たのですか
  rationale: מַדּוּעַの理由を問う意味と、彼らが現に到着している文脈を、明瞭な直接疑問で表した。
- source_word: וְאַתֶּם
  choice: あなたがたは……のに
  rationale: 接続詞וְは字義的には「そして」だが、ここでは先の敵対行為と今回の来訪との対照を示すため、自然な逆接の「のに」で表した。
- source_word: שְׂנֵאתֶם אֹתִי
  choice: 私を憎み
  rationale: שנאの強い語義を「敵対した」などに弱めず、「憎む」と訳した。
- source_word: וַתְּשַׁלְּחוּנִי מֵאִתְּכֶם
  choice: 自分たちのもとから追い出した
  rationale: שלחの「去らせる／送り出す」とמֵאִתְּכֶםの彼らのもとから離す意味を、文脈上の強制性が伝わる自然な日本語で表した。
