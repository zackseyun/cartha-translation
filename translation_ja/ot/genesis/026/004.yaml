  text: וְ/הִרְבֵּיתִ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/כוֹכְבֵ֣י הַ/שָּׁמַ֔יִם וְ/נָתַתִּ֣י לְ/זַרְעֲ/ךָ֔ אֵ֥ת כָּל הָ/אֲרָצֹ֖ת הָ/אֵ֑ל וְ/הִתְבָּרֲכ֣וּ בְ/זַרְעֲ/ךָ֔ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/004.yaml
  text: And I will multiply your offspring like the stars of the heavens[a], and I will give to your offspring all these lands, and in your offspring all the nations of the earth will be blessed.
translation:
  language: ja
  text: わたしはあなたの子孫を天の星のように増やし、あなたの子孫にこれらの土地をすべて与える。あなたの子孫によって、地のすべての国々は祝福を受ける[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地のすべての国々は、あなたの子孫によって自らを祝福する」。ヘブライ語の動詞は再帰的にも理解できるが、契約の約束という文脈には受動的な意味がよく合う。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִרְבֵּיתִי
  choice: わたしは……増やし
  rationale: רבהのヒフィル形が示す、神が数を多くするという使役的な意味を、自然で直接的な日本語にした。
- source_word: זַרְעֲךָ
  choice: あなたの子孫
  rationale: זֶרַעは集合的単数で、後代の子孫全体を指し得る。「種」では現代日本語として不自然なため、「子孫」とした。単数・複数を明示しない日本語なので、原文の集合的な幅も保てる。
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם
  choice: 天の星のように
  rationale: 比較を示すכְּを「ように」で表し、שָׁמַיִםは荘重さを保ちながら自然な「天」とした。
- source_word: וְנָתַתִּי
  choice: 与える
  rationale: נתןの基本的で直接的な意味を保持した。
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: これらの土地をすべて
  rationale: 複数形אֲרָצוֹתと指示語הָאֵלを反映し、領土の約束という文脈に合う「土地」を用いた。
- source_word: וְהִתְבָּרֲכוּ
  choice: 祝福を受ける
  rationale: 祝福の約束という文脈に適合する受動的理解を、現代日本語として自然に表した。再帰的理解も可能なため脚注に残した。
- source_word: בְזַרְעֲךָ
  choice: あなたの子孫にあって
  rationale: 前置詞בְּの基本的な「中で／にあって」を保ち、媒介を意味する「によって」と断定せず、原文の神学的な含みを残した。
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: 地のすべての国々
  rationale: גּוֹיִםの民族的・集団的意味を「国々」で表し、הָאָרֶץは格調を保つ「地」とした。
theological_decisions:
- issue: וְהִתְבָּרֲכוּ בְזַרְעֲךָ の祝福表現の意味
  choice: あなたの子孫にあって、地のすべての国々は祝福を受ける
  alternative: 地のすべての国々は、あなたの子孫によって自らの祝福を願う
  rationale: 族長への契約の約束という文脈では受動的な理解がよく適合する。一方、ヘブライ語の形は再帰的にも理解できるので、その可能性を脚注で明示し、解釈上の緊張を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、「天」「地」「子孫にあって」によって契約の約束にふさわしい格調を保った。反復される「あなたの子孫」は原文どおり一貫して訳した。脚注記号は、実際に異読が関係する祝福表現の直後に置いた。
