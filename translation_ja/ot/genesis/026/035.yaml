lexical_decisions:
- source_word: וַתִּהְיֶיןָ
  choice: 彼女たちは……となった
  rationale: היה の女性複数形で、前節のエサウの妻たちを受ける。物語の進行の中で、その存在が両親に苦しみをもたらすものとなったことを自然な日本語で表した。
- source_word: מֹרַת רוּחַ
  choice: 心の苦しみ
  rationale: 直訳的には「霊の苦さ」。内面の深い苦痛、悲しみ、いらだちを表すヘブライ語の慣用表現なので、意味を明瞭にしつつ比喩の重みを保った。
- source_word: לְיִצְחָק וּלְרִבְקָה
  choice: イサクとリベカにとって
  rationale: 前置詞 לְ は影響を受ける者を示す。日本語では「にとって」が関係を自然かつ正確に表す。
