  text: And they were a bitterness of spirit to Isaac and Rebekah[a][b][c].
translation:
  language: ja
  text: 彼女たちは、イサクとリベカにとって心の苦しみとなった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「霊の苦さとなった」。深い心痛や悲しみ、いらだちを表す慣用表現。
