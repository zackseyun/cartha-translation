id: GEN.26.11
reference: Genesis 26:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְצַ֣ו אֲבִימֶ֔לֶךְ אֶת כָּל הָ/עָ֖ם לֵ/אמֹ֑ר הַ/נֹּגֵ֜עַ בָּ/אִ֥ישׁ הַ/זֶּ֛ה וּ/בְ/אִשְׁתּ֖/וֹ מ֥וֹת יוּמָֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/011.yaml
  text: Then Abimelech commanded all the people[a], saying, “Whoever touches this man or his wife shall surely be put to death.”
translation:
  language: ja
  text: そこでアビメレクは民全員に命じた。「この男またはその妻に触れる者は[a]、必ず死刑に処せられる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「この男またはその妻に触れる者」。ここでは一般に、該当する者はだれでも、という意味。
    reason: 冠詞付き分詞の一般化用法を説明するため。
lexical_decisions:
- source_word: וַיְצַו
  choice: 命じた
  rationale: ピエル形が表す権威ある命令を、明確で自然な現代日本語で示す。
- source_word: כָּל הָעָם
  choice: 民全員
  rationale: アビメレクの支配下にある人々全体を指し、民族国家という意味に限定しない。
- source_word: לֵאמֹר
  choice: 直接話法で示す
  rationale: 命令内容を導入する引用用法を、日本語ではかぎ括弧による直接話法で自然に表した。
- source_word: הַנֹּגֵעַ
  choice: 触れる者
  rationale: 冠詞付き分詞の一般化用法を表す。「手を出す」「危害を加える」と解釈を狭めず、נגעの基本的な語義と文脈上の緊張を保つ。
- source_word: בָּאִישׁ הַזֶּה וּבְאִשְׁתּוֹ
  choice: この男またはその妻に
  rationale: נגעの対象となる二人を示す。否定的な法令の文脈で、どちらに触れた場合も該当することを「または」で明確にした。
- source_word: מוֹת יוּמָת
  choice: 必ず死刑に処せられる
  rationale: 不定詞絶対形による強意を「必ず」で、ホファル形の受動的な処刑を「死刑に処せられる」で表した。単に死ぬのではなく、科される刑罰であることを保つ。
theological_decisions: []
translation_notes:
  register: 明快で格調を保った現代標準日本語。「触れる」は、危害を加えることを含み得る文脈を保ちつつ、原文以上に意味を限定しない表現とした。
