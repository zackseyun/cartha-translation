id: GEN.26.10
reference: Genesis 26:10
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ כִּ֠/מְעַט שָׁכַ֞ב אַחַ֤ד הָ/עָם֙ אֶת אִשְׁתֶּ֔/ךָ וְ/הֵבֵאתָ֥ עָלֵ֖י/נוּ אָשָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/010.yaml
  text: And Abimelech said[a], “What is this you have done to us? One of the people might easily have lain with your wife, and you would have brought guilt upon us.”
translation:
  language: ja
  text: アビメレクは言った。「あなたは私たちに何ということをしたのか。危うく民の一人があなたの妻と寝るところだった[a]。あなたは私たちに罪責を負わせるところだったのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「民の一人があなたの妻と寝ることも十分あり得た」。
    reason: כִּמְעַט は「危うく、もう少しで」という近接した未遂のほか、文脈によっては容易に起こり得た可能性を表すものとも理解できる。
lexical_decisions:
- source_word: מַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: あなたは私たちに何ということをしたのか
  rationale: מַה זֹּאת の驚きと非難を帯びた問いを自然な現代日本語で表し、לָּנוּ の共同体的な対象も明示した。
- source_word: כִּמְעַט
  choice: 危うく…ところだった
  rationale: 出来事が実現寸前だったという通常の意味を明確かつ自然に表す。一方、可能性を示す読みもあり得るため脚注に残した。
- source_word: שָׁכַב ... אֶת אִשְׁתֶּךָ
  choice: あなたの妻と寝る
  rationale: 性的関係を指すヘブライ語の慣用表現に対応し、露骨すぎず、現代日本語でも理解できる表現とした。
- source_word: אַחַד הָעָם
  choice: 民の一人
  rationale: 集合名詞 הָעָם を不必要に「男たち」と限定せず、原文の形を保った。文脈上、指示対象が男性であることは十分に伝わる。
- source_word: וְהֵבֵאתָ עָלֵינוּ אָשָׁם
  choice: あなたは私たちに罪責を負わせるところだった
  rationale: אָשָׁם が単なる非難や評判上の責めではなく、行為によって生じる客観的な罪と責任を表すため「罪責」とした。未遂の状況は「ところだった」で表現した。
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ
  choice: アビメレクは言った
  rationale: 標準的な物語叙述として簡潔に訳し、接続辞に過度な時間的・論理的意味を加えなかった。
theological_decisions:
- issue: אָשָׁם の性質
  choice: 罪責
  alternative: 罪、責め、違反
  rationale: この文脈では、知らずに犯し得た性的な罪によって共同体が負う道徳的・宗教的責任が問題となっている。「罪責」は客観的な有罪性と責任の双方を保ちつつ、ここで祭儀用語に限定することを避ける。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「寝る」は性的関係を指す慣用表現として用い、「罪責」で原文の道徳的・宗教的な重みを保った。脚注記号 [a] は該当する כִּמְעַט の訳語の直後に置いた。
