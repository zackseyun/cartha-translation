  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/ה֗וּא וַ/יָּבֹ֨אוּ֙ עַבְדֵ֣י יִצְחָ֔ק וַ/יַּגִּ֣דוּ ל֔/וֹ עַל אֹד֥וֹת הַ/בְּאֵ֖ר אֲשֶׁ֣ר חָפָ֑רוּ וַ/יֹּ֥אמְרוּ ל֖/וֹ מָצָ֥אנוּ מָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/032.yaml
  text: And it happened on that day that Isaac’s servants came and told him about the well that they had dug[a], and they said to him[b], “We have found water.”
translation:
  language: ja
  text: その日[a]、イサクの使用人たち[b]がやって来て、自分たちが掘った井戸のことを彼に報告し、「水を見つけました」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その同じ日に」とも訳せる。直前に記された契約の出来事があった、まさにその日であることを強調する表現と理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「奴隷たち」とも訳せる。ヘブライ語は家に属して労働する者を指すことがあるが、ここではその社会的身分が特に強調されてはいない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: その日
  rationale: ヘブライ語の物語を進める定型表現と時を示す句を、簡潔で自然な現代日本語にした。「その」は直前の出来事とのつながりを保つ。
- source_word: עַבְדֵי יִצְחָק
  choice: イサクの使用人たち
  rationale: עבדは「奴隷」も意味し得るが、この文脈では井戸を掘る家の働き手として描かれているため、社会的身分を過度に特定しない自然な表現を選んだ。
- source_word: וַיַּגִּדוּ לוֹ
  choice: 彼に報告し
  rationale: נגדのヒフィル形が表す、情報を伝え知らせる行為を文脈に即して訳した。
- source_word: עַל אֹדוֹת הַבְּאֵר אֲשֶׁר חָפָרוּ
  choice: 自分たちが掘った井戸のことを
  rationale: 関係節の先行する行為を自然な日本語で示し、井戸についての報告であることを明確にした。
- source_word: וַיֹּאמְרוּ לוֹ
  choice: 「……」と言った
  rationale: ヘブライ語にある明示的な発話導入を保持した。受け手は直前の「彼に」で明らかなため、引用の直前では重ねなかった。
- source_word: מָצָאנוּ מָיִם
  choice: 水を見つけました
  rationale: מצאとמיםを直接的に訳し、井戸掘りの結果として水を発見したという知らせを保持した。
