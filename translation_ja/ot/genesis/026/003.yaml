id: GEN.26.3
reference: Genesis 26:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: גּ֚וּר בָּ/אָ֣רֶץ הַ/זֹּ֔את וְ/אֶֽהְיֶ֥ה עִמְּ/ךָ֖ וַ/אֲבָרְכֶ֑/ךָּ כִּֽי לְ/ךָ֣ וּֽ/לְ/זַרְעֲ/ךָ֗ אֶתֵּן֙ אֶת כָּל הָֽ/אֲרָצֹ֣ת הָ/אֵ֔ל וַ/הֲקִֽמֹתִי֙ אֶת הַ/שְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְ/אַבְרָהָ֥ם אָבִֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/003.yaml
  text: Stay in this land[a], and I will be with you and bless you, for to you and to your offspring I will give all these lands[c][b], and I will establish the oath that I swore to Abraham your father.
translation:
  language: ja
  text: この地に寄留しなさい[a]。わたしはあなたとともにいて、あなたを祝福する。なぜなら、あなたとあなたの子孫[b]に、これらの土地をすべて与え、わたしがあなたの父アブラハムに誓った誓いを確立するからである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留する」とは、よそ者としてその地に住むこと。別訳「この地にとどまりなさい」。
    reason: lexical_alternative
  - marker: b
    text: 原語は「種」。ここでは集合的に「子孫」を指す。
    reason: lexical_alternative
  - marker: c
    text: 別訳「誓いを確かなものとする」、または「誓いを果たす」。
    reason: alternative_reading
lexical_decisions:
- source_word: גּוּר
  choice: 寄留しなさい
  rationale: גורは、よそ者・一時的居住者として暮らすことを表す。単なる滞在命令より原文の社会的含意を保てるため「寄留する」とした。現代語ではやや馴染みが薄いので脚注で説明する。
- source_word: בָּאָרֶץ הַזֹּאת
  choice: この地に
  rationale: אֶרֶץは文脈上、イサクがとどまる特定の地域を指す。「地」は後半の複数形「土地」との語彙的つながりも保つ。
- source_word: וְאֶהְיֶה עִמְּךָ
  choice: わたしはあなたとともにいて
  rationale: 神の臨在を告げる簡潔な約束として、原文の関係的・契約的な響きを説明的に広げず保持した。
- source_word: וַאֲבָרְכֶךָ
  choice: あなたを祝福する
  rationale: 継続する神の約束を自然な現代日本語で表した。
- source_word: כִּי
  choice: （独立した接続語としては訳出せず、文脈上の理由・根拠の連続で表現）
  rationale: כִּיには理由を示す働きがあるが、日本語で「なぜなら」を置くと説明調が強くなる。命令とそれに続く約束の連なりによって根拠関係を自然に示した。
- source_word: לְךָ וּלְזַרְעֲךָ
  choice: あなたとあなたの子孫に
  rationale: זֶרַעは字義的には「種」で、ここでは集合的に後代を指す。「子孫」は現代日本語で自然であり、集合的意味を明確にする。字義は脚注に残す。
- source_word: אֶתֵּן
  choice: 与え
  rationale: 神の将来的な約束を表す。日本語では後続する述語と連結し、「与え……確かなものとする」とした。
- source_word: כָּל הָאֲרָצֹת הָאֵל
  choice: これらの土地をすべて
  rationale: 複数形אֲרָצוֹתを「土地」とし、複数の領域が視野にあることを保った。
- source_word: וַהֲקִמֹתִי
  choice: 確かなものとする
  rationale: קוםのヒフィルは、先に誓われたものを立たせ、確立・確認する意。「確かなものとする」は誓いの有効性を保証する含意を自然に伝える。別訳を脚注に示す。
- source_word: הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי
  choice: 誓った誓い
  rationale: 同語根の名詞と動詞による原文の反復を保ち、単なる「約束」よりも厳粛な宣誓の意味を示す。
- source_word: לְאַבְרָהָם אָבִיךָ
  choice: あなたの父アブラハムに
  rationale: イサクに対する呼びかけとして自然な日本語語順にし、アブラハムとの約束の継続性を保った。
theological_decisions:
- issue: 先に誓われた誓いに対する וַהֲקִמֹתִי の意味
  choice: 誓いを確かなものとする
  alternative: 誓いを確立する／誓いを果たす
  rationale: 原文は技術的な意味での「契約更新」と明言していない。「確かなものとする」は、誓いを確認し実効あるものにする意味を保ちつつ、「すでに全面的に成就する」と限定しない。
- issue: זֶרַע の集合性と字義
  choice: 子孫
  alternative: 種／末裔
  rationale: この節ではイサクから続く一群が直接の指示対象であるため、本文では集合的意味が自然な「子孫」とした。ただし原語の字義と数の曖昧さを消さないよう脚注に示す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「寄留」は原語の重要なニュアンスを保持するため採用し、脚注で平易に説明した。「誓った誓い」という反復は日本語としてやや荘重だが、原文の語根反復と宣誓の厳粛さを伝えるため維持した。
