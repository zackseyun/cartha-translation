    issue: כִּי の理由を示す接続が本文に反映されていない。
    rationale: כִּי はここで、神が共にいて祝福するとの約束に続き、土地を与え誓いを確立するという根拠を導く。「なぜなら」を置くことで、この関係を過度に解釈せず明示できる。
  - severity: low
    issue: 脚注aが寄留を「一時的に住むこと」と限定している。
    rationale: גּוּר はよそ者・移住者として居住することを表すが、語自体が一時性を必ず含意するとは限らない。
  - severity: low
    issue: 「誓った誓い」は日本語として重複感が強い。
    rationale: 「わたしがあなたの父アブラハムに誓った誓い」とすれば、原文の意味と厳粛さを保ちつつ自然になる。
  revised_text: この地に寄留しなさい[a]。わたしはあなたとともにいて、あなたを祝福する。なぜなら、あなたとあなたの子孫[b]に、これらの土地をすべて与え、わたしがあなたの父アブラハムに誓った誓いを確立するからである[c]。
