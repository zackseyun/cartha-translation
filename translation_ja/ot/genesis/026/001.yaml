  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֤י רָעָב֙ בָּ/אָ֔רֶץ מִ/לְּ/בַד֙ הָ/רָעָ֣ב הָ/רִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּ/ימֵ֣י אַבְרָהָ֑ם וַ/יֵּ֧לֶךְ יִצְחָ֛ק אֶל אֲבִימֶּ֥לֶךְ מֶֽלֶךְ פְּלִשְׁתִּ֖ים גְּרָֽרָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/001.yaml
  text: There was a famine in the land[a], besides the first famine that had been in the days of Abraham. So Isaac went to Abimelech king of the Philistines at Gerar.
translation:
  language: ja
  text: その地に飢饉が起こった。これは、アブラハムの時代にあった最初の飢饉とは別のものである。そこでイサクは、ゲラルにいる[a]ペリシテ人の王アビメレクのもとへ行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ゲラルへ」とも訳せる。原文の「ゲラル」には、そこへ向かうことを示す語尾が付いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי רָעָב בָּאָרֶץ
  choice: その地に飢饉が起こった
  rationale: 物語の新しい状況を導入する表現。「その地」は文脈上の地域を指し、「起こった」は日本語の物語文として自然に飢饉の発生を表す。
- source_word: מִלְּבַד הָרָעָב הָרִאשׁוֹן
  choice: 最初の飢饉とは別のものである
  rationale: מִלְּבַד の区別・追加の意味と、רִאשׁוֹן の序数的な意味を明確に保つ。
- source_word: אֲשֶׁר הָיָה בִּימֵי אַבְרָהָם
  choice: アブラハムの時代にあった
  rationale: 先の飢饉をアブラハムの生きた時代によって特定する関係節を、簡潔で自然な日本語にした。
- source_word: וַיֵּלֶךְ יִצְחָק
  choice: そこでイサクは……行った
  rationale: 物語を進める接続を「そこで」で示す。飢饉を受けた行動という文脈上のつながりを表すが、原因を必要以上に強く断定しない。
- source_word: אֶל אֲבִימֶּלֶךְ מֶלֶךְ פְּלִשְׁתִּים
  choice: ペリシテ人の王アビメレクのもとへ
  rationale: אֶל の人的な方向を「のもとへ」で自然に示し、王号と民族名の構造を保つ。
- source_word: גְּרָרָה
  choice: ゲラルにいる
  rationale: 本文では、アビメレクの所在を示す自然な日本語として訳した。語形に方向を表す語尾があるため、「ゲラルへ」という読みも脚注に残した。
theological_decisions:
- issue: פְּלִשְׁתִּים の歴史的・民族的呼称
  choice: ペリシテ人
  alternative: ペリシテの民
  rationale: 神学的称号ではなく民族・政治集団の名称であり、日本語聖書で広く理解される慣用表記を用いた。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、聖書物語にふさわしい落ち着いた文体とした。長い原文を三文に分け、飢饉同士の区別とイサクの移動を読み取りやすくした。
