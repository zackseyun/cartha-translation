  text: וַ/יָּ֨שָׁב יִצְחָ֜ק וַ/יַּחְפֹּ֣ר אֶת בְּאֵרֹ֣ת הַ/מַּ֗יִם אֲשֶׁ֤ר חָֽפְרוּ֙ בִּ/ימֵי֙ אַבְרָהָ֣ם אָבִ֔י/ו וַ/יְסַתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים אַחֲרֵ֖י מ֣וֹת אַבְרָהָ֑ם וַ/יִּקְרָ֤א לָ/הֶן֙ שֵׁמ֔וֹת כַּ/שֵּׁמֹ֕ת אֲשֶׁר קָרָ֥א לָ/הֶ֖ן אָבִֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/018.yaml
  text: Then Isaac dug again the wells of water that had been dug in the days of Abraham his father[a], which the Philistines had stopped up after Abraham's death, and he called them by the names that his father had given them.
translation:
  language: ja
  text: イサクは、父アブラハムの時代に掘られ、アブラハムの死後にペリシテ人がふさいだ井戸を再び掘った[a]。そして、父が付けたのと同じ名前を、それらの井戸に付けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「イサクは戻って掘った」。ヘブライ語の動詞は「戻る」を表し得るが、ここでは後に続く動作を再び行うことを示す慣用的な用法である可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב ... וַיַּחְפֹּר
  choice: 再び掘った
  rationale: שׁובに後続動作の反復・再開を示す用法があるため、移動としての「戻った」ではなく、文脈に即して「再び」と訳した。井戸がふさがれていたことから、既存の井戸を掘り直す行為を自然に表す。
- source_word: בְּאֵרֹת הַמַּיִם
  choice: 井戸
  rationale: 直訳は「水の井戸」だが、日本語では「井戸」自体が水源を意味するため、冗長さを避けて自然に訳した。
- source_word: אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו
  choice: 父アブラハムの時代に掘られ
  rationale: 複数形動詞の不特定の主語を、日本語で自然な受け身によって表した。בִּימֵיは「時代に」とした。
- source_word: וַיְסַתְּמוּם
  choice: ふさいでしまった
  rationale: סתםの「ふさぐ、詰める」という意味を保ちつつ、井戸を使用不能にした結果を自然な日本語で示した。
- source_word: פְּלִשְׁתִּים
  choice: ペリシテ人
  rationale: この民族名の標準的な日本語表記を用いた。
- source_word: אַחֲרֵי מוֹת אַבְרָהָם
  choice: アブラハムの死後に
  rationale: 時間関係を簡潔で自然な現代日本語にした。
- source_word: וַיִּקְרָא לָהֶן שֵׁמוֹת כַּשֵּׁמוֹת אֲשֶׁר קָרָא לָהֶן אָבִיו
  choice: 父が付けていたのと同じ名をそれらの井戸に付けた
  rationale: קרא ... שמותを日本語の自然な命名表現「名を付ける」で表し、כの対応関係を「同じ」によって明示した。代名詞の指示先も「それらの井戸」と補って明確にした。
theological_decisions: []
