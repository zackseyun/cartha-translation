base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/025.yaml
  text: So he built an altar there and called on the name of Yahweh[a], and he pitched his tent there[b]. And Isaac’s servants dug a well there.
translation:
  language: ja
  text: そこでイサクは祭壇を築き、ヤハウェの名を呼び求め、そこに天幕を張った。イサクの使用人たちは、そこで井戸を掘った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: そこでイサクは祭壇を築き
  rationale: בנהとמזבחの通常の意味を保ちつつ、ヘブライ語では文脈から明らかな主語を、日本語では自然な理解のため「イサク」と明示した。שָׁםの場所の強調も「そこで」で保持した。
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: ヤハウェの御名を呼び求めた
  rationale: 祭壇を築く文脈では、神への礼拝的な呼びかけを表す可能性が最も高い。「御名」は宗教的文脈にふさわしい尊敬を示し、「呼び求めた」は単に名を口にする以上の祈願の含意を自然に伝える。宣言の意味もあり得るため脚注に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で一般的な学術的音写により表した。
- source_word: וַיֶּט שָׁם אָהֳלוֹ
  choice: そして、そこに天幕を張った
  rationale: נטהはאֹהֶלとともに用いられた場合「天幕を張る」を意味する。「そこに」を残して、原文における場所の反復を保った。
- source_word: עַבְדֵי יִצְחָק
  choice: イサクの使用人たち
  rationale: עבדは奴隷または使用人を意味し得るが、ここでは井戸を掘る家の働き手を指す。法的身分を本文が特定していないため、現代日本語で中立的な「使用人」を選んだ。
- source_word: וַיִּכְרוּ שָׁם ... בְּאֵר
  choice: そこで井戸を掘った
  rationale: כרהとבארの基本的意味を平明に訳し、三度目のשָׁםも保持して場所への強調を再現した。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として音写し、原文上の区別を保持した。
- issue: וַיִּקְרָא בְּשֵׁם יְהוָהの意味
  choice: ヤハウェの御名を呼び求めた
  alternative: ヤハウェの御名を告げ知らせた
  rationale: この句は呼び求めることと宣言することの双方を表し得るが、祭壇建設の直後という文脈は祈り・礼拝としての呼び求めを支持する。別の可能性は脚注で保持した。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。「天幕」は「テント」より聖書時代の住居に適しつつ、現代の読者にも理解可能である。原文で三度繰り返されるשָׁםは、「そこで／そこに／そこで」と訳し、場所の強調を保持した。
