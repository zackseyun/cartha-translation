  text: He had flocks[a], herds, and a large household[b], and the Philistines envied him.
translation:
  language: ja
  text: 彼には、羊や山羊の群れ、牛の群れ、そして多くの働き手[a]がいた。ペリシテ人は彼をねたんだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「多くの奉仕（または労働）」。ここでは、多数の使用人または労働者からなる労働力を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: 彼には……がいた
  rationale: 「ある／いる」を表す動詞と前置詞 ל の組み合わせによる所有表現を、日本語として自然な存在構文で訳した。
- source_word: מִקְנֵה צֹאן
  choice: 羊や山羊の群れ
  rationale: צֹאן は羊と山羊を中心とする小家畜の総称であり、מִקְנֶה は所有する家畜を指す。単に「羊」とせず範囲を明示した。
- source_word: וּמִקְנֵה בָקָר
  choice: 牛の群れ
  rationale: בָקָר は牛類を指し、前句の小家畜の群れと対をなす集合的な所有家畜として訳した。
- source_word: וַעֲבֻדָּה רַבָּה
  choice: 大勢の働き手
  rationale: עֲבֻדָּה は奉仕、労働、働く者たちを指し得る。家畜という財産と並ぶ文脈では、大規模な労働力を表す可能性が高いため、具体的で過度に身分を限定しない表現を選んだ。
- source_word: וַיְקַנְאוּ אֹתוֹ
  choice: 彼をねたんだ
  rationale: קנא はここではイサクの繁栄を理由とする嫉妬・羨望を表す。「ねたむ」が対象を伴う自然な日本語である。
- source_word: פְּלִשְׁתִּים
  choice: ペリシテ人
  rationale: この民族名の標準的な日本語表記を用いた。
