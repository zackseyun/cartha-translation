  text: From there he went up to Beersheba[a].
translation:
  language: ja
  text: 彼はそこからベエル・シェバへ上って行った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「上って行った」。旅を表す一般的な言い方で、標高の高い所へ向かったことも含意し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上って行った
  rationale: עלהの基本的な方向性である「上る」を保ちつつ、旅の移動を表す自然な日本語とした。単に「行った」とすると、標高の高い場所への移動を含み得る原文のニュアンスが失われる。
- source_word: מִשָּׁם
  choice: そこから
  rationale: 直前の場所を起点とすることを、簡潔で自然な現代日本語で示す。
- source_word: בְּאֵר שָׁבַע
  choice: ベエル・シェバ
  rationale: 地名として翻訳せず、原語に基づいて音写した。日本語で認知されている表記を用いた。
theological_decisions: []
