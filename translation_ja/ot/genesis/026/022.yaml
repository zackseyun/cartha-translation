  edition: WLC
  text: וַ/יַּעְתֵּ֣ק מִ/שָּׁ֗ם וַ/יַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְ/לֹ֥א רָב֖וּ עָלֶ֑י/הָ וַ/יִּקְרָ֤א שְׁמָ/הּ֙ רְחֹב֔וֹת וַ/יֹּ֗אמֶר כִּֽי עַתָּ֞ה הִרְחִ֧יב יְהוָ֛ה לָ֖/נוּ וּ/פָרִ֥ינוּ בָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/022.yaml
  text: He moved from there and dug another well[a], and they did not quarrel over it. So he called its name Rehoboth, and said, “For now Yahweh has made room for us, and we will be fruitful in the land.”
translation:
  language: ja
  text: 彼はそこから移り、別の井戸を掘った。彼らはその井戸をめぐって争わなかった。そこで彼はその井戸をレホボト[a]と名づけ、「今やヤハウェが私たちのために場所を広げてくださった。私たちはこの地で実を結ぶ」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「レホボト」は、「広い所」「広々とした場所」を意味するヘブライ語と結びつく名。続く「場所を広げてくださった」との間に言葉遊びがある。
    reason: 地名の語義と、הִרְחִיבとの語根上の言葉遊びを日本語読者に示すため。
lexical_decisions:
- source_word: וַיַּעְתֵּק מִשָּׁם
  choice: 彼はそこから移り
  rationale: עתקはこの文脈で、イサクが争いのあった場所を離れて別の場所へ移ることを表す。移動方法を特定せず、簡潔で自然な日本語とした。
- source_word: בְּאֵר אַחֶרֶת
  choice: 別の井戸
  rationale: 直前までの井戸とは異なる、さらに一つの井戸という意味を自然に表す。
- source_word: וְלֹא רָבוּ עָלֶיהָ
  choice: 人々はその井戸については争わなかった
  rationale: ריבの争い・抗争という意味を保ち、עָלֶיהָが井戸を指すことを日本語で明確にした。主語は原文では明示されないため、特定集団に限定しない「人々」とした。
- source_word: וַיִּקְרָא שְׁמָהּ רְחֹבוֹת
  choice: 彼は、その名をレホボトと呼び
  rationale: ヘブライ語の命名定型をある程度保ちつつ、地名は音写した。その意味と言葉遊びは脚注で示す。
- source_word: כִּי עַתָּה הִרְחִיב יְהוָה לָנוּ
  choice: 今やヤハウェが私たちのために場所を広くしてくださった
  rationale: רחבの使役形が表す「広い場所を与える／余地を作る」を具体的に訳し、レホボトとの語呂のつながりを「広く」で保った。神の恩恵を語る文脈に合う自然な敬語表現とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 固有の神名として音写し、一般名詞的な称号に置き換えなかった。
- source_word: וּפָרִינוּ בָאָרֶץ
  choice: 私たちはこの地で実を結ぶ
  rationale: פרהの基本的な比喩「実を結ぶ」を保ち、増加・繁栄・生産性を含み得る幅を狭めない。בָאָרֶץは文脈上、彼らが住む土地を指すため「この地」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の固有名を見える形で保持し、称号への置換や別の慣用音写を採用しなかった。
- issue: וּפָרִינוּ の意味範囲
  choice: 実を結ぶ
  alternative: 増え広がる／栄える
  rationale: この動詞は人口増加や繁栄を含み得るが、原文だけでは一義的に限定できないため、「実を結ぶ」という広い比喩を保持した。
- issue: וּפָרִינוּ の時制・様相
  choice: 実を結ぶ
  alternative: 実を結ぶことができる／実を結ぼう
  rationale: 接続完了形はこの発言内で将来的な結果・確信を表すと理解し、断定的な未来の見通しとして訳した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文として簡潔かつ格調を保った。「してくださった」は神の恵みを認める話者の視点を自然に表すが、解釈を過度に付加しない。脚注記号[a]は本文中の地名に付した。
