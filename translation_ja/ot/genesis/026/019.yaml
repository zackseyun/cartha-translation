  text: וַ/יַּחְפְּר֥וּ עַבְדֵֽי יִצְחָ֖ק בַּ/נָּ֑חַל וַ/יִּ֨מְצְאוּ שָׁ֔ם בְּאֵ֖ר מַ֥יִם חַיִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/019.yaml
  text: Then Isaac’s servants dug in the wadi and found there a well of living water[a][b].
translation:
  language: ja
  text: イサクに仕える者たちは、その涸れ川[a]で掘り、そこに湧き水の出る井戸[b]を見つけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「谷」または「川床」とも訳せる。ヘブライ語は、雨季に水が流れる涸れ川（ワジ）を指すことが多い。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「生きた水のある井戸」。たまった水ではなく、泉から湧く新鮮な水、または流れる水のある井戸を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: 掘り
  rationale: חפרの通常の意味と、ヘブライ語の物語を進める連続形を自然な日本語で表す。
- source_word: עַבְדֵי יִצְחָק
  choice: イサクの僕たち
  rationale: עבדは奴隷または僕を意味し得るが、この文脈では身分を過度に限定せず、イサクに仕える者たちを表す「僕」が適切。
- source_word: בַּנָּחַל
  choice: その涸れ川
  rationale: נחלは季節的に水が流れる谷筋やワジを指すことが多い。「涸れ川」は日本語の一般読者に地形を端的に伝えられる。定冠詞は「その」で反映した。
- source_word: וַיִּמְצְאוּ שָׁם
  choice: そこに…見つけた
  rationale: 場所を示すשָׁםを明示しつつ、自然な日本語の語順にした。
- source_word: בְּאֵר
  choice: 井戸
  rationale: בארの基本義をそのまま採用し、水の性質は後続表現で示した。
- source_word: מַיִם חַיִּים
  choice: 湧き水の出る
  rationale: 字義は「生きた水」だが、ここでは停滞した水ではなく、地下から湧く新鮮で流動する水を指す。「湧き水の出る」により井戸との関係を自然かつ明確に表す。
