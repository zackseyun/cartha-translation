base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/017.yaml
  text: So Isaac went away from there and camped in the Valley of Gerar[a], and settled there.
translation:
  language: ja
  text: そこでイサクはそこを去り、ゲラルの谷[a]に宿営し、そこに住んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ゲラルの涸れ川」。ヘブライ語は、季節的に水が流れる川床、谷間、渓谷などを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: そこを去り
  rationale: 直訳的には「そこから行き」だが、直前の場所から離れたことを自然な現代日本語で表す。
- source_word: וַיִּחַן
  choice: 宿営し
  rationale: חנהは幕営する、野営することを表す。「宿営する」は簡潔で、移動生活の文脈にも合う。
- source_word: בְּנַחַל גְּרָר
  choice: ゲラルの谷に
  rationale: נחלは谷、涸れ川、季節的な川床などを指し得る。本文では一般読者に分かりやすい「谷」を採用し、地形上の幅は脚注で保持する。
- source_word: וַיֵּשֶׁב שָׁם
  choice: そこに住んだ
  rationale: ישבは座る、住む、定住するなどを意味する。宿営に続いてその場所に居住したことを、過度に恒久的な定住と限定せず表す。
