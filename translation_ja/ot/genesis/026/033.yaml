  text: And he called it Shibah[a]; therefore the name of the city is Beersheba to this day.
translation:
  language: ja
  text: 彼はその井戸をシブア[a]と名づけた。それゆえ、その町の名は今日に至るまでベエル・シェバである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シブア」はヘブライ語の「七」を思わせ、「ベエル・シェバ」という名にある語呂合わせと関連する。この名は「七の井戸」とも「誓いの井戸」とも理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֹתָהּ
  choice: 彼はその井戸を…と名づけた
  rationale: קרא はこの命名構文では「名づける」の意。女性単数代名詞 אֹתָהּ の指示対象を直前の文脈に従って「その井戸」と明示し、自然な日本語にした。
- source_word: שִׁבְעָה
  choice: シブア
  rationale: 井戸の名として音写し、「七」および「誓い」との語呂合わせは本文で一義的に訳さず脚注に残した。
- source_word: עַל כֵּן
  choice: それで
  rationale: 命名と町名を結ぶ因果・説明関係を、明快な現代日本語で表した。
- source_word: שֵׁם הָעִיר בְּאֵר שֶׁבַע
  choice: その町の名は…ベエル・シェバと呼ばれている
  rationale: ヘブライ語は字義的には「その町の名はベエル・シェバ」であるが、日本語では命名の継続を自然に示す表現とした。固有名は一般的な聖書表記に沿って音写した。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 今日に至るまで
  rationale: 語り手の時点まで名称が存続していることを示す、荘重かつ自然な定型表現。
