base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/029.yaml
  text: that you will do us no harm[a], just as we have not touched you and just as we have done to you only good and sent you away in peace[c][b]. You are now blessed by Yahweh.”
translation:
  language: ja
  text: 私たちがあなたに触れず、あなたにただ良いことだけをし、平安のうちにあなたを送り出したのと同じように、あなたも私たちに害を加えないようにしてください[a][b]。あなたは今、ヤハウェに祝福されています。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すれば「もしあなたが私たちに害を加えるなら」。ここでは前節から続く誓約の内容、すなわち害を加えないという約束を表すと理解できる。
    reason: lexical_alternative
  - marker: b
    text: 「触れず」は、この文脈では「害を加えず」という意味を含む可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תַּעֲשֵׂה עִמָּנוּ רָעָה
  choice: 私たちに害を加えないことです
  rationale: אִם は字義的には「もし」だが、前節から続く誓約要求の内容を導く誓いの定型表現として理解した。日本語では前節とのつながりが自然になるよう否定の誓約内容として表現し、字義的な可能性は脚注に残した。רָעָה はこの不可侵の文脈で具体的な「害」とした。
- source_word: לֹא נְגַעֲנוּךָ
  choice: 私たちがあなたに手を触れず
  rationale: נגע の具体的な基本義「触れる」を保った。「害を加える」という含みもあり得るため脚注で示した。
- source_word: עָשִׂינוּ עִמְּךָ רַק טוֹב
  choice: ただ良いことだけをし
  rationale: רַק の限定・強調を「ただ……だけ」で明示し、話者たちの強い自己主張を弱めずに訳した。
- source_word: וַנְּשַׁלֵּחֲךָ בְּשָׁלוֹם
  choice: 平安のうちにあなたを送り出した
  rationale: שלח の「送り出す」と שָׁלוֹם の平和・無事・良好な関係を含む広がりを保った。
- source_word: בְּרוּךְ יְהוָה
  choice: ヤハウェに祝福されています
  rationale: בָּרוּךְ を受動的な状態として自然な現代日本語にし、神名 יהוה は固有名「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文の固有の神名を明示し、普通名詞的な称号へ置き換えないため。
- issue: אִם を含む誓約句の解釈
  choice: 害を加えないという誓約内容
  alternative: 「もし私たちに害を加えるなら」とする条件・誓いの呪詛省略表現
  rationale: 前節の「契約を結ぼう」に続く要求内容としては否定命題が最も自然だが、ヘブライ語の形式上の曖昧さは脚注に明記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、契約交渉の厳粛さを保った。話者たちの主張を原文どおり提示し、その正当性について訳文側で評価を加えていない。
