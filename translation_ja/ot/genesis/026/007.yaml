revisions:
- from: その土地の男たちが彼の妻について尋ねると、彼は「私の妹です」と答えた。「私の妻です」と言うのを恐れたからである。リベカは美しい容姿をしていたので、「この土地の男たちが、リベカのことで私を殺すかもしれない」と思ったのである。
  to: その土地の男たちが彼の妻について尋ねると、彼は「私の妹です」と言った。彼は「私の妻です」と言うことを恐れた。リベカは容姿が美しかったので、その土地の男たちがリベカのことで自分を殺すことを恐れたからである。
  rationale: 原文の因果関係を保つため、原文にない「と思った」を除き、「言うことを恐れた」と「殺すことを恐れた」の対応を明示した。「自分」を用いて、引用外の三人称叙述の中にある一人称接尾辞（私を）を自然に反映した。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:48:37Z'
