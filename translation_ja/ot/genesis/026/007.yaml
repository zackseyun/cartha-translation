  text: וַֽ/יִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַ/מָּקוֹם֙ לְ/אִשְׁתּ֔/וֹ וַ/יֹּ֖אמֶר אֲחֹ֣תִ/י הִ֑וא כִּ֤י יָרֵא֙ לֵ/אמֹ֣ר אִשְׁתִּ֔/י פֶּן יַֽהַרְגֻ֜/נִי אַנְשֵׁ֤י הַ/מָּקוֹם֙ עַל רִבְקָ֔ה כִּֽי טוֹבַ֥ת מַרְאֶ֖ה הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/007.yaml
  text: When the men of the place asked about his wife[a], he said, “She is my sister,” because he was afraid to say, “She is my wife,” lest the men of the place kill me because of Rebekah, because she was beautiful in appearance.
translation:
  language: ja
  text: その土地の男たちが彼の妻について尋ねると、彼は「私の妹です」と言った。彼は「私の妻です」と言うことを恐れた。リベカは容姿が美しかったので、その土地の男たちがリベカのことで自分を殺すことを恐れたからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: 尋ねると
  rationale: שׁאל の基本義である問いかけを、文脈に合う自然な現代日本語で表した。継起形は物語の流れに合わせて「〜すると」とした。
- source_word: אַנְשֵׁי הַמָּקוֹם
  choice: その土地の男たち
  rationale: אַנְשֵׁי が男性を指すことを保ちつつ、הַמָּקוֹם を日本語として自然な「その土地」とした。
- source_word: לְאִשְׁתּוֹ
  choice: 彼の妻について
  rationale: ここで前置詞 לְ は質問の対象を示すため、「〜について」と訳した。
- source_word: אֲחֹתִי הִוא
  choice: 私の妹です
  rationale: ヘブライ語の同定文を、簡潔で自然な直接話法にした。日本語では主語「彼女は」を補わなくても明瞭である。
- source_word: כִּי יָרֵא
  choice: 恐れたからである
  rationale: כִּי の理由を明示し、ירא の恐れを簡潔に表した。
- source_word: לֵאמֹר אִשְׁתִּי
  choice: 「私の妻です」と言うのを
  rationale: 原文では「私の妻」とだけあるが、発言内容として日本語に必要なコピュラを補った。
- source_word: פֶּן יַהַרְגֻנִי
  choice: 私を殺すかもしれない
  rationale: פֶּן が表す恐れている可能性を、現代日本語の内的発話として自然に示した。הרג は過度な法的含意を加えず「殺す」とした。
- source_word: עַל רִבְקָה
  choice: リベカのことで
  rationale: עַל がここで示す原因・きっかけを、自然で意味の広がりを保つ表現にした。
- source_word: טוֹבַת מַרְאֶה
  choice: 美しい容姿をしていた
  rationale: 外見が好ましく美しいという句の意味を、古風にならない明瞭な日本語で表した。
- source_word: רִבְקָה
  choice: リベカ
  rationale: ヘブライ語名 רִבְקָה の日本語聖書で一般的な表記を用いた。
theological_decisions: []
