  text: וַֽ/יַּחְפְּרוּ֙ בְּאֵ֣ר אַחֶ֔רֶת וַ/יָּרִ֖יבוּ גַּם עָלֶ֑י/הָ וַ/יִּקְרָ֥א שְׁמָ֖/הּ שִׂטְנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/021.yaml
  text: Then they dug another well[a], and they also quarreled over it, so he called its name Sitnah.
translation:
  language: ja
  text: 彼らはさらに別の井戸を掘った。そして、その井戸をめぐっても争った。そこでイサクはその名をシトナ[a]と呼んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シトナ」は、敵意や対立に関係するヘブライ語に由来する名。
    reason: 固有名に込められた語義上の含みを示すため。
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: 彼らは掘った
  rationale: חפרのカル・ワイイクトル複数形で、物語の進行を示す通常の「掘る」。主語の複数を明示して自然な現代日本語とした。
- source_word: בְּאֵר אַחֶרֶת
  choice: さらに別の井戸
  rationale: בְּאֵרは「井戸」、אַחֶרֶתは「別の、もう一つの」。前節に続く新たな井戸であることを「さらに別の」で自然に表した。
- source_word: וַיָּרִיבוּ גַּם עָלֶיהָ
  choice: その井戸についても争いが起こった
  rationale: ריבは争う、言い争う意。ヘブライ語では主語が複数だが、その相手は明示されないため、日本語では曖昧さを保つ「争いが起こった」とした。גַּםは「も」、עַלは文脈上「について」で表した。
- source_word: וַיִּקְרָא שְׁמָהּ
  choice: イサクは、その名を…と呼んだ
  rationale: 直訳的な命名句「彼はその名を呼んだ」を保ちつつ、日本語で主語が不明瞭にならないよう、文脈上の主語イサクを補った。
- source_word: שִׂטְנָה
  choice: シトナ
  rationale: 井戸の固有名として音写した。敵意・反対と関連する語義は、命名の含意を伝えるため脚注に示した。
