  text: וְ/כָל הַ/בְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔י/ו בִּ/ימֵ֖י אַבְרָהָ֣ם אָבִ֑י/ו סִתְּמ֣וּ/ם פְּלִשְׁתִּ֔ים וַ/יְמַלְא֖וּ/ם עָפָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/015.yaml
  text: All the wells that his father's servants had dug in the days of Abraham his father[c][b][a], the Philistines stopped up and filled them with earth.
translation:
  language: ja
  text: 父アブラハムの時代に、父の僕たち[a]が掘った井戸を、ペリシテ人はことごとくふさぎ、土[b]で埋めた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「父の奴隷たち」。ヘブライ語は、僕、使用人、奴隷などを指し得る。
    reason: lexical_alternative
  - marker: b
    text: 「土」と訳したヘブライ語は、文脈によって土、ちり、ほこりなどを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַבְּאֵרֹת
  choice: 井戸を…ことごとく
  rationale: כָלの全体性を「ことごとく」で明示しつつ、日本語として自然な目的語の位置に置いた。冒頭のוְは物語の連続を示すが、この一節だけで不自然な「そして」を加えず、文脈上のつながりに委ねた。
- source_word: אֲשֶׁר חָפְרוּ
  choice: …が掘った
  rationale: 井戸を修飾する関係節として自然に表現した。ヘブライ語の完了形が示す先行する行為は、日本語では文脈と連体修飾で十分に伝わる。
- source_word: עַבְדֵי אָבִיו
  choice: 父の僕たち
  rationale: עֶבֶדは僕・使用人・奴隷を指し得る。ここでは隷属身分そのものが焦点ではないため、歴史的家内集団の成員を表せる「僕」を採用し、別訳を脚注に示した。
- source_word: בִּימֵי אַבְרָהָם אָבִיו
  choice: 父アブラハムの時代に
  rationale: 「…の日々に」という慣用句を自然な現代日本語の「…の時代に」とした。「父」を残し、アブラハムとイサクの関係を明示した。
- source_word: סִתְּמוּם
  choice: ふさぎ
  rationale: 井戸を使用不能にする具体的な行為を、現代日本語で自然な「ふさぐ」で表した。目的語接尾辞は「井戸を」が両述語にかかる構文で反映した。
- source_word: פְּלִשְׁתִּים
  choice: ペリシテ人
  rationale: この民族名の標準的な日本語表記を用いた。
- source_word: וַיְמַלְאוּם עָפָר
  choice: 土で埋めた
  rationale: 井戸に土を満たして使えなくする動作を自然な日本語で表した。עָפָרの語義幅は脚注に示した。
