  source_fidelity: ヘブライ語の主要要素を正確に反映している。「すべての井戸」は「ことごとく」、「父アブラハムの時代に父の僕たちが掘った」は関係節と時間句で自然に表され、ペリシテ人が井戸をふさぎ、土で満たしたという二つの動作も保持されている。冒頭の接続詞וְを独立した「そして」とせず文脈に委ねた処理も、日本語として適切である。
