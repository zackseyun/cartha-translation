  terminology: 「ペリシテ人」は標準的な固有名表記である。「僕たち」は古代の家に属するעֶבֶדの広い語義を保つ訳語として許容でき、脚注が「奴隷たち」という可能性を適切に示している。「土」はעָפָרの文脈上もっとも自然な訳であり、脚注も語義幅を十分に示す。
