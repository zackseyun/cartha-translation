  text: וַ/יְהִ֤י עֵשָׂו֙ בֶּן אַרְבָּעִ֣ים שָׁנָ֔ה וַ/יִּקַּ֤ח אִשָּׁה֙ אֶת יְהוּדִ֔ית בַּת בְּאֵרִ֖י הַֽ/חִתִּ֑י וְ/אֶת בָּ֣שְׂמַ֔ת בַּת אֵילֹ֖ן הַֽ/חִתִּֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/034.yaml
  text: When Esau was forty years old[a], he took as wives Judith daughter of Beeri the Hittite, and Basemath daughter of Elon the Hittite.
translation:
  language: ja
  text: エサウは四十歳の時、ヘト人ベエリの娘ユディトと、ヘト人エロンの娘バセマトを妻に迎えた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「妻を迎えた。すなわち、ユディト……とバセマト……」。ヘブライ語は二人の女性を挙げながら、「妻／女」を単数形で用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עֵשָׂו בֶּן אַרְבָּעִים שָׁנָה
  choice: エサウは四十歳の時
  rationale: ヘブライ語の年齢表現と物語を進める構文を、自然な現代日本語の時間表現で示した。
- source_word: וַיִּקַּח אִשָּׁה
  choice: 妻に迎えた
  rationale: 字義的には「妻／女を取った」だが、ここでは婚姻を表す慣用表現である。後続して二人の女性が挙げられるため、日本語では両者を目的語として自然に受ける表現とした。
- source_word: יְהוּדִית
  choice: ユディト
  rationale: ヘブライ語名の音形を踏まえ、現代日本語で読みやすい聖書人名表記とした。
- source_word: בְּאֵרִי
  choice: ベエリ
  rationale: ヘブライ語の固有名を日本語で音写した。
- source_word: הַחִתִּי
  choice: ヘト人
  rationale: 民族名を、旧約聖書の日本語訳で広く理解される簡潔な形で表した。定冠詞は日本語では別に訳出しない。
- source_word: בָּשְׂמַת
  choice: バセマト
  rationale: ヘブライ語の子音と母音を踏まえて音写した。
- source_word: אֵילֹן
  choice: エロン
  rationale: ヘブライ語の固有名を日本語で音写した。
- source_word: בַּת
  choice: 娘
  rationale: 父子関係を示す連語を、自然な日本語の「〜の娘」で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。婚姻を表すヘブライ語の慣用句は「妻に迎えた」とし、原文にある単数形と二人の名の緊張は脚注で保持した。
