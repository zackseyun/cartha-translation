  text: וַ/יָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם רֹעֵ֥י יִצְחָ֛ק לֵ/אמֹ֖ר לָ֣/נוּ הַ/מָּ֑יִם וַ/יִּקְרָ֤א שֵֽׁם הַ/בְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/020.yaml
  text: Then the shepherds of Gerar quarreled with Isaac’s shepherds[a], saying, “The water is ours.” So he named the well Esek, because they had quarreled with him.
translation:
  language: ja
  text: すると、ゲラルの羊飼いたちはイサクの羊飼いたちと争い、「この水はわれわれのものだ」と言った。そこでイサクは、その井戸をエセク[a]と名づけた。彼らがイサクと争ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エセク」はヘブライ語で「争い」を意味し、ここで「争った」と訳した動詞と語呂合わせになっている。
    reason: 井戸の名と命名理由とのヘブライ語の同根語による語呂合わせを、意味を損なわず明確に伝えるため。
lexical_decisions:
- source_word: וַיָּרִיבוּ
  choice: 争い
  rationale: ריבが表す対立・争論を、井戸の水をめぐる衝突に適した自然な現代日本語で表した。
- source_word: רֹעֵי גְרָר / רֹעֵי יִצְחָק
  choice: ゲラルの羊飼いたち／イサクの羊飼いたち
  rationale: רֹעִיםは家畜を飼う者を指すが、族長物語の文脈に即した標準的な訳語「羊飼い」を用い、原文の並行表現も保った。
- source_word: לָנוּ הַמָּיִם
  choice: この水はわれわれのものだ
  rationale: 直訳的には「われわれに水」となる省略的な所有表現を、水利権の主張が明瞭に伝わる日本語にした。文脈上の特定の水を「この水」と表した。
- source_word: וַיִּקְרָא שֵׁם הַבְּאֵר
  choice: その井戸を…と名づけた
  rationale: 「井戸の名を呼んだ」というヘブライ語の慣用表現を、自然な日本語の命名表現にした。
- source_word: עֵשֶׂק
  choice: エセク
  rationale: 井戸の固有名として音写し、「争い」との語呂合わせは脚注で示した。
- source_word: כִּי הִתְעַשְּׂקוּ עִמּוֹ
  choice: 彼らがイサクと争ったからである
  rationale: 命名理由を表す因果関係を保った。接尾代名詞「彼」を、日本語で指示対象が明瞭になるよう文脈上の指示対象であるイサクと明示した。動詞は井戸名との語根上のつながりを踏まえて「争った」とした。
