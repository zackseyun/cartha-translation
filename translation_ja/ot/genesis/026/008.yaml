source:
  edition: WLC
  text: וַ/יְהִ֗י כִּ֣י אָֽרְכוּ ל֥/וֹ שָׁם֙ הַ/יָּמִ֔ים וַ/יַּשְׁקֵ֗ף אֲבִימֶ֨לֶךְ֙ מֶ֣לֶךְ פְּלִשְׁתִּ֔ים בְּעַ֖ד הַֽ/חַלּ֑וֹן וַ/יַּ֗רְא וְ/הִנֵּ֤ה יִצְחָק֙ מְצַחֵ֔ק אֵ֖ת רִבְקָ֥ה אִשְׁתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/008.yaml
  text: And it happened[a], when he had been there a long time, that Abimelech king of the Philistines looked out through the window and saw, and behold, Isaac was laughing with Rebekah his wife.
translation:
  language: ja
  text: さて、イサクがそこに長く滞在していたころ、ペリシテ人の王アビメレクが窓から外を眺めると、なんと、イサクが妻リベカと戯れていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「笑い合っていた」「ふざけ合っていた」、あるいは「愛撫していた」とも訳せる。ヘブライ語の動詞は「イサク」という名と同じ語根を持ち、楽しく戯れることにも親密な振る舞いにも用いられる。ここでは、リベカが妻であると分かるような振る舞いを指す。
    reason: 原語מְצַחֵקの語義の幅、イサクの名との語呂合わせ、そして文脈上の含意を示すため。
lexical_decisions:
- source_word: וַיְהִי
  choice: さて
  rationale: 物語に新たな展開を導入する語りの機能を、古風にならない自然な日本語で表した。
- source_word: כִּי אָרְכוּ לוֹ שָׁם הַיָּמִים
  choice: イサクがそこに長く滞在していたころ
  rationale: 直訳すれば「彼にとってそこで日々が長くなったとき」だが、長期間の滞在を意味するヘブライ語の慣用表現として自然に訳した。代名詞の指示対象を明確にするため「イサク」を補った。
- source_word: וַיַּשְׁקֵף ... בְּעַד הַחַלּוֹן
  choice: 窓から外を眺めると
  rationale: 高い場所などから外を見渡す動作と、窓越しに見るという状況を自然な日本語で表した。
- source_word: וַיַּרְא וְהִנֵּה
  choice: 眺めると、なんと
  rationale: 「見た。すると、見よ」という生き生きとした発見と驚きを、日本語の物語表現として簡潔に保った。
- source_word: מְצַחֵק
  choice: 戯れていた
  rationale: 語根צחקが持つ「笑う」「戯れる」という意味を直接反映しつつ、この場面にある親密な振る舞いの含みを残した。意味を「抱擁する」などに限定せず、原文の幅を脚注で示した。
- source_word: אֵת רִבְקָה אִשְׁתּוֹ
  choice: 妻リベカと
  rationale: この文脈のמְצַחֵקは相手を伴う親密な戯れを表すため、日本語では「妻リベカと」とするのが自然である。אִשְׁתּוֹの同格情報も明確に保った。
theological_decisions:
- issue: イサクとリベカの振る舞いの具体性
  choice: 「戯れていた」とし、親密さを示しつつ具体的な身体動作には限定しない
  alternative: 「愛撫していた」「抱きしめていた」
  rationale: アビメレクが二人の夫婦関係を見抜くほど親密な行為であったことは文脈から明らかだが、原語自体は具体的な行為を一つに確定しないため、その緊張を保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語としての品位と生き生きした発見の調子を保った。「なんと」はוְהִנֵּהの驚きを過度に古風な「見よ」にせず伝える表現である。
