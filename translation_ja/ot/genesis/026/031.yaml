  yaml_path: translation/ot/genesis/026/031.yaml
  text: And they rose early in the morning and swore an oath, each man to his brother; then Isaac sent them away[a], and they departed from him in peace.
translation:
  language: ja
  text: 彼らは朝早く起き、互いに誓いを交わした。それからイサクは彼らを送り出し、彼らは平安のうちに彼のもとを去った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: 朝早く起き
  rationale: שׁכם のヒフィルは「早く起きる」を表し、בַבֹּקֶר と合わせて、自然な現代日本語で時間を明示した。
- source_word: וַיִּשָּׁבְעוּ
  choice: 誓いを交わした
  rationale: שׁבע のニファルが表す正式な誓約行為を保持しつつ、相互性を自然な日本語で示した。
- source_word: אִישׁ לְאָחִיו
  choice: 互いに
  rationale: 直訳は「それぞれ、その兄弟に」だが、ここでは双方が相互に誓うことを表すヘブライ語の言い回しであり、日本語では「互いに」が明瞭で自然である。
- source_word: וַיְשַׁלְּחֵם
  choice: 彼らを送り出し
  rationale: この場面での שׁלח のピエルは、客を退去させるというより、別れに際して送り出す意味なので、この表現を選んだ。
- source_word: וַיֵּלְכוּ מֵאִתּוֹ
  choice: 彼のもとを去った
  rationale: מֵאִתּוֹ が示すイサクのもとからの離去を、自然で品位ある日本語にした。
- source_word: בְּשָׁלוֹם
  choice: 平安のうちに
  rationale: שָׁלוֹם の安全と友好的関係の双方を含む余韻を保つため、「無事に」や「平和に」より意味幅のある表現を採用した。
