  text: Then Abimelech said to Isaac[a], “Go away from us, because you have become much stronger than we are.”
translation:
  language: ja
  text: そこでアビメレクはイサクに言った。「私たちのもとから出て行きなさい。あなたは私たちよりもはるかに強くなったからだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を次へ進めるワウ連続法の順次性を、自然な現代日本語で表した。
- source_word: אֲבִימֶלֶךְ
  choice: アビメレク
  rationale: 人名を日本語聖書で一般的な形に音写した。
- source_word: אֶל יִצְחָק
  choice: イサクに
  rationale: 発言の相手を示す前置詞と人名を、自然な日本語の助詞で表した。
- source_word: לֵךְ מֵעִמָּנוּ
  choice: 私たちのもとから出て行ってくれ
  rationale: 命令形「行け」と「私たちと共にいる所から」の分離の意味を一体として表現した。「くれ」は命令の直接性を保ちつつ、日本語の発話として自然にする。
- source_word: כִּי
  choice: からだ
  rationale: 先行する命令の理由を明示する接続辞として訳した。
- source_word: עָצַמְתָּ
  choice: 強くなった
  rationale: 動詞が表す、強大になる・力を増すという意味を簡潔に示した。政治的権力だけに限定しない。
- source_word: מִמֶּנּוּ מְאֹד
  choice: 私たちよりもはるかに
  rationale: 比較を示す מן と強意の מְאֹד を、「よりもはるかに」と自然に表した。מִמֶּנּוּ は文脈上、話者を含む複数の「私たち」を指す。
