  - severity: medium
    issue: 「それで私たちは…と話し合った」
    rationale: וַנֹּאמֶר は「私たちは言った」であり、「話し合った」は原文にない協議・熟議の意味を加える。
  - severity: medium
    issue: 「どうか、…誓いを立て、あなたと契約を結びましょう」
    rationale: 原文は「誓いがあるように」と「契約を結ぼう」という二つの願望・提案である。現行訳は命令形と勧誘形の接続が不自然で、誰への命令かも曖昧になる。
