source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ רָא֣וֹ רָאִינוּ֮ כִּֽי הָיָ֣ה יְהוָ֣ה עִמָּ/ךְ֒ וַ/נֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖י/נוּ בֵּינֵ֣י/נוּ וּ/בֵינֶ֑/ךָ וְ/נִכְרְתָ֥ה בְרִ֖ית עִמָּֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/028.yaml
  text: And they said[a], “We have clearly seen that Yahweh has been with you. So we said, ‘Please let there be an oath between us, between you and us[b], and let us make a covenant with you.’”
translation:
  language: ja
  text: 彼らは言った。「私たちは、ヤハウェがこれまであなたと共におられたことを、はっきり見ました。それで私たちは、『どうか、私たちの間に、つまり私たちとあなたとの間に誓い[a]を交わし、あなたと契約を結びましょう』と言ったのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「違反すれば呪いを受けることを伴う誓い」とも考えられる。ヘブライ語の語は、そのような誓いを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 彼らは言った
  rationale: ワウ継続法による物語の進行を、自然な現代日本語で簡潔に表した。
- source_word: רָאוֹ רָאִינוּ
  choice: はっきり見ました
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を、「はっきり」で自然に表現した。
- source_word: כִּי הָיָה יְהוָה עִמָּךְ
  choice: ヤハウェがあなたと共におられること
  rationale: הָיָהが示す、これまで観察され現在にも関わる状態を、日本語では文脈に即して「共におられる」とした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神名を音写した。
- source_word: וַנֹּאמֶר
  choice: それで私たちは…と話し合った
  rationale: 直前の認識を受けた提案であることを「それで」で示した。複数の使者が共同で提案を決めた文脈では、日本語の「話し合った」が自然である。
- source_word: תְּהִי נָא
  choice: どうか…立て
  rationale: 指令形的用法とנָאによる丁寧な願いを「どうか」で表した。
- source_word: אָלָה
  choice: 誓い
  rationale: 条約の文脈で明瞭な訳語を採用し、違反時の呪いを伴いうる語義は脚注に残した。
- source_word: בֵּינוֹתֵינוּ בֵּינֵינוּ וּבֵינֶךָ
  choice: 私たちの間に、すなわち私たちとあなたとの間に
  rationale: 原文の反復と二者間の正式な関係を保ちつつ、「すなわち」で日本語としてのつながりを明確にした。
- source_word: וְנִכְרְתָה בְרִית
  choice: 契約を結びましょう
  rationale: 字義的には「契約を切る」だが、日本語で定着した慣用表現「契約を結ぶ」を用いた。
- source_word: עִמָּךְ
  choice: あなたと
  rationale: イサク一人への二人称男性単数の呼びかけをそのまま表した。
theological_decisions:
- issue: 神名 יְהוָה の訳出
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を明記しているため、称号へ置換せず「ヤハウェ」と音写した。
- issue: אָלָה に含まれうる自己呪詛の含意
  choice: 本文では「誓い」、脚注で含意を提示
  alternative: 呪いを伴う誓い
  rationale: この条約文脈では一般的な「誓い」が自然だが、違反した場合の呪いを誓約者が引き受ける含意を語が持ちうるため、曖昧さを脚注に保存した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。外交的・条約的な発言の丁寧さを「どうか」「結びましょう」で示し、原文の強調的な反復は不自然にならない範囲で保持した。
