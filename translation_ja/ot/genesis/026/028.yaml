- from: 彼らは言った。「私たちは、ヤハウェがあなたと共におられることを、はっきり見ました。それで私たちは、『どうか、私たちの間に、すなわち私たちとあなたとの間に誓い[a]を立て、あなたと契約を結びましょう』と話し合ったのです。」
  to: 彼らは言った。「私たちは、ヤハウェがこれまであなたと共におられたことを、はっきり見ました。それで私たちは、『どうか、私たちの間に、つまり私たちとあなたとの間に誓い[a]を交わし、あなたと契約を結びましょう』と言ったのです。」
  rationale: 神の臨在を認める完了形の時間的含意を「これまで…おられた」で表し、根拠のない「話し合った」を原文に即した「言った」に改めた。誓いと契約の提案は、日本語として一貫した共同的勧誘になるよう「誓いを交わし、…結びましょう」とした。原文の意図的な反復と、אָלָה の語義上の曖昧さは保持している。
