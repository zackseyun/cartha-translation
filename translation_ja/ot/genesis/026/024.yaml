  source_fidelity: ヘブライ語本文の構文と意味を正確に反映している。「その夜」「イサクに現れて」「あなたの父アブラハムの神」「恐れてはならない」「わたしがあなたと共にいるからだ」「あなたを祝福し…子孫を増やす」「わたしのしもべアブラハムのゆえに」は、各句の内容・関係を保つ。זַרְעֲךָの集合的用法も「子孫」と注で適切に処理されている。
