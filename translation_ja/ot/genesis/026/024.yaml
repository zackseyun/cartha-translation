  text: וַ/יֵּרָ֨א אֵלָ֤י/ו יְהוָה֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑י/ךָ אַל תִּירָא֙ כִּֽי אִתְּ/ךָ֣ אָנֹ֔כִי וּ/בֵֽרַכְתִּ֨י/ךָ֙ וְ/הִרְבֵּיתִ֣י אֶֽת זַרְעֲ/ךָ֔ בַּ/עֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/024.yaml
  text: And Yahweh appeared to him that night and said[a], “I am the God of Abraham your father. Do not fear, for I am with you[b], and I will bless you and multiply your offspring for the sake of Abraham my servant.”
translation:
  language: ja
  text: その夜、ヤハウェはイサクに現れて言われた。「わたしは、あなたの父アブラハムの神である。恐れてはならない。わたしがあなたと共にいるからだ。わたしはあなたを祝福し、わたしのしもべアブラハムのゆえに、あなたの子孫[a]を増やす。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あなたの種」。ここでは集合的に子孫を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の四文字神名を日本語で一般的な音写にした。
- source_word: וַיֵּרָא אֵלָיו
  choice: イサクに現れて
  rationale: ראהのニファル形が表す直接的な顕現を「現れる」で示した。代名詞の指示対象は文脈上イサクなので、日本語で明瞭にした。
- source_word: אָנֹכִי אֱלֹהֵי אַבְרָהָם אָבִיךָ
  choice: わたしは、あなたの父アブラハムの神である
  rationale: アブラハムがイサクの父であることと、神の契約的な自己同定を、原文の関係を保って表した。
- source_word: אַל תִּירָא
  choice: 恐れてはならない
  rationale: 禁止と励ましの両面を持つ簡潔で格調ある現代日本語とした。
- source_word: כִּי אִתְּךָ אָנֹכִי
  choice: わたしがあなたと共にいるからだ
  rationale: כִּיが、恐れてはならない理由を導く因果関係を明示している。
- source_word: וּבֵרַכְתִּיךָ
  choice: わたしはあなたを祝福し
  rationale: 約束の文脈における将来的な確約として自然に訳した。
- source_word: וְהִרְבֵּיתִי אֶת זַרְעֲךָ
  choice: あなたの子孫を増やす
  rationale: רבהの使役的意味と、זֶרַעの集合的な子孫の意味を、自然な日本語で表した。
- source_word: בַּעֲבוּר אַבְרָהָם עַבְדִּי
  choice: わたしのしもべアブラハムのゆえに
  rationale: 祝福の根拠がアブラハムにあることを示しつつ、本文を越えた説明は加えていない。עֶבֶדはこの契約的文脈では「しもべ」が適切である。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文にある固有の神名を称号で代替せず、そのまま音写した。
- issue: アブラハムを理由とする約束
  choice: わたしのしもべアブラハムのゆえに
  alternative: わたしのしもべアブラハムのために／アブラハムのゆえに
  rationale: בַּעֲבוּרが示す理由・根拠を保持し、イサクへの祝福とアブラハムとの結び付きを明示する一方、その性質を本文以上に限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の顕現と約束にふさわしい簡潔で格調ある語調とした。「僕」は別の意味に読まれやすいため、עַבְדִּיは平仮名の「しもべ」とした。
