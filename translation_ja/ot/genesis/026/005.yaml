  terminology: 「戒め」「定め」「教え」は各ヘブライ語の意味領域を適切に区別している。תּוֹרָה を本文では「教え」とし、脚注で「律法」の可能性と語義の幅を示す扱いは、本文の曖昧さと法的文脈の双方を損なわない。固有名アブラハムおよび神の一人称「わたし」も適切である。
