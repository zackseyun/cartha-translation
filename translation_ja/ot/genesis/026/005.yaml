  text: עֵ֕קֶב אֲשֶׁר שָׁמַ֥ע אַבְרָהָ֖ם בְּ/קֹלִ֑/י וַ/יִּשְׁמֹר֙ מִשְׁמַרְתִּ֔/י מִצְוֺתַ֖/י חֻקּוֹתַ֥/י וְ/תוֹרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/026/005.yaml
  text: because Abraham obeyed my voice and kept my charge[a], my commandments, my statutes[b], and my laws.
translation:
  language: ja
  text: それは、アブラハムがわたしの声に聞き従い、わたしの託した務め、戒め、定め、そして教え[a]を守ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「律法」とも訳せる。ヘブライ語トーラーは、文脈により「教え」「指示」「律法」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵקֶב
  choice: それは……からである
  rationale: 前後の文脈で示された祝福の理由を導く因果表現として、現代日本語で自然かつ明確にした。
- source_word: שָׁמַע ... בְּקֹלִי
  choice: わたしの声に聞き従い
  rationale: 「声を聞く」というヘブライ語の聴覚的比喩と、実際に従うという慣用的意味の両方を自然な日本語で表す。
- source_word: וַיִּשְׁמֹר
  choice: 守った
  rationale: 法的・契約的な事柄を忠実に保ち行うという意味を、簡潔で広い日本語で表す。
- source_word: מִשְׁמַרְתִּי
  choice: わたしの託した務め
  rationale: 守るよう委ねられた責務という語義を示し、後続の「戒め」「定め」「教え」と区別した。「務め」だけより所有関係と委託の含意が明瞭になる。
- source_word: מִצְוֺתַי
  choice: 戒め
  rationale: 契約的・法的文脈における標準的で分かりやすい訳語。
- source_word: חֻקּוֹתַי
  choice: 定め
  rationale: 制定された規定を表し、「戒め」や「教え」との語彙上の区別を保つ、自然で格調ある訳語。
- source_word: וְתוֹרֹתָי
  choice: そして教え
  rationale: תורה の基本的な「教示・教え」という幅を保ちつつ、複数形を集合的な日本語で自然に表した。法的文脈から「律法」も可能なため脚注で示す。
theological_decisions:
- issue: シナイ以前の文脈に並ぶ契約的・法的用語群
  choice: 「託した務め、戒め、定め、そして教え」と各語を区別して保持する。
  alternative: 「命令と律法」などにまとめる、または תורותי を「律法」と限定する。
  rationale: 原文は近接する複数の語を重ねてアブラハムの包括的な従順を強調している。これらを圧縮せず、シナイ以前と後代の律法との関係も訳文で説明し切らないことにより、本文の神学的緊張を保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「聞き従う」「戒め」「定め」により聖書本文にふさわしい品位を保った。列挙の重みを残し、「そして」で最後の項目を明示した。
