  source_fidelity: 「アブラハムがわたしの声に聞き従い」は、שָׁמַע בְּקוֹל の従順を含む慣用的意味を自然に表している。「守った」は וַיִּשְׁמֹר に適切であり、続く「託した務め、戒め、定め、そして教え」は、מִשְׁמַרְתִּי・מִצְוֺתַי・חֻקּוֹתַי・וְתוֹרֹתָי の重層的な列挙を圧縮せずに反映する。「それは……からである」も、前節に述べられる祝福の理由を示す עֵקֶב に合う。
