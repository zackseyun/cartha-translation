  yaml_path: translation/ot/genesis/026/026.yaml
  text: Then Abimelech went to him from Gerar[a], with Ahuzzath his friend and Phicol the commander of his army.
translation:
  language: ja
  text: その後、アビメレクはゲラルから、友人アフザテと軍の長ピコルを伴って、彼のもとへ行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִימֶלֶךְ
  choice: その後、アビメレクは
  rationale: 物語を進める接続のワウを、現代日本語の叙述として自然な「その後」で表した。固有名は一般的な聖書表記に従った。
- source_word: הָלַךְ אֵלָי/ו
  choice: 彼のもとへやって来た
  rationale: הלך の基本義は「行く」だが、到着先であるイサクを基準にする日本語では「彼のもとへやって来た」が自然である。代名詞は原文どおり保持した。
- source_word: מִ/גְּרָר
  choice: ゲラルから
  rationale: 前置詞 מן の起点を「から」で表し、地名は慣用表記に従った。
- source_word: וַ/אֲחֻזַּת מֵֽרֵעֵ/הוּ
  choice: 友人のアフザテ
  rationale: מֵרֵעֵהוּ は個人的な友人、仲間、宮廷の随行者を指し得る。役職を明示する語ではないため、意味を狭める「助言者」ではなく、基本的で自然な「友人」を採用した。
- source_word: וּ/פִיכֹל שַׂר צְבָא/וֹ
  choice: 軍の長ピコル
  rationale: שַׂר צְבָאוֹ は彼の軍勢を率いる者を意味する。「軍の長」は簡潔で威厳があり、原文の所有関係も文脈上明らかである。
- source_word: וַ/אֲחֻזַּת … וּ/פִיכֹל
  choice: アフザテと…ピコルを伴い
  rationale: 二人がアビメレクに同行した関係を、日本語として明確かつ自然に表した。
