  yaml_path: translation/ot/genesis/026/030.yaml
  text: And he prepared a feast for them[a], and they ate and drank.
translation:
  language: ja
  text: イサクは彼らのために宴を設けた[a]。彼らは食べ、飲んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「宴会」または「酒宴」とも訳せる。ヘブライ語は、飲酒が特に重視される宴を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: 設けた
  rationale: 基本義は「造る、行う」だが、宴を目的語とするため、宴席を用意して催したことを自然に表す「設けた」とした。
- source_word: לָהֶם
  choice: 彼らのために
  rationale: 前置詞 ל はここでは行為の受益者を示しているため、「彼らのために」とした。
- source_word: מִשְׁתֶּה
  choice: 宴
  rationale: 飲酒を重要な要素として含み得る祝宴・宴会を指す。続く「食べ、そして飲んだ」がその含意を明示するため、本文では簡潔で格調ある「宴」とした。
- source_word: וַיֹּאכְלוּ
  choice: 彼らは食べ
  rationale: 動詞 אכל の意味と複数主語を直接的に表した。
- source_word: וַיִּשְׁתּוּ
  choice: そして飲んだ
  rationale: 動詞 שתה と連続する出来事を明確に表し、原文の接続を「そして」で保持した。
