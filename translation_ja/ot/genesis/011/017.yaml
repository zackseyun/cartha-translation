  text: וַֽ/יְחִי עֵ֗בֶר אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת פֶּ֔לֶג שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/017.yaml
  text: And Eber lived after he fathered Peleg four hundred and thirty years[a], and he fathered sons and daughters.
translation:
  language: ja
  text: エベルはペレグをもうけた後、四百三十年生き、息子や娘をもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図における חיה の定型的用法を自然な現代日本語で表す。後続の期間表現により、ペレグ誕生後になお生きた年数であることが明確になる。
- source_word: עֵבֶר
  choice: エベル
  rationale: ヘブライ語名 עֵבֶר の日本語聖書で一般的な音写を用いた。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־פֶּלֶג
  choice: ペレグをもうけた後
  rationale: 使役形 הוליד の父親として子を生じさせる意味を、古風すぎず自然な「もうけた」で表した。
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百三十年
  rationale: 原文は「三十年と四百年」の順だが、合計年数を日本語の通常の数詞順で表した。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 系図の ילד の使役形を、前半と一貫した自然な現代日本語で訳した。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子や娘
  rationale: 原文が男女双方の子を明示しているため、包括的な「子ども」ではなく両方を明記した。接続の וּ は、この定型句では日本語として自然な「や」で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的かつ品位ある系図文体。「生き続け」を避け、原文の単純な生存表現を保った。句読点は、四百三十年がペレグ誕生後の生存期間であることが明瞭になるよう配置した。
