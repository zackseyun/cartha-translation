  text: And as they journeyed from the east[a], they found a plain in the land of Shinar and settled there.
translation:
  language: ja
  text: 彼らが東の方から旅をしているうちに[a]、シンアルの地に平原を見つけ、そこに定住した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らが東へ旅をしているうちに」。ヘブライ語の מִקֶּדֶם は、出発点（「東の方から」）とも方向（「東へ」）とも理解できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּנָסְעָם
  choice: 彼らが…旅をして来たとき
  rationale: וַיְהִי は後続する出来事の状況を導くため、現代日本語では自然な時の節に組み込んだ。נסע は宿営地を発って移動することを表すが、ここでは簡潔で品位のある「旅をする」とした。
- source_word: מִקֶּדֶם
  choice: 東の方から
  rationale: 前置詞 מִן の起点の意味を主に取り、「東の方から」と訳した。ただし、קֶדֶם を方向として「東へ」と理解する余地があるため、別解を脚注に残した。
- source_word: וַיִּמְצְאוּ
  choice: 見つけ
  rationale: מצא の基本的な意味をそのまま明瞭に表した。
- source_word: בִקְעָה
  choice: 平原
  rationale: 広く開けた平地または谷を指す語であり、シンアルの地理的文脈に自然な「平原」を選んだ。
- source_word: בְּאֶרֶץ שִׁנְעָר
  choice: シンアルの地に
  rationale: אֶרֶץ を「地」として保持し、地名 שִׁנְעָר は「シンアル」と音写した。
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: そこに住み着いた
  rationale: ישב は住むことに加え、移動を終えて定住することも表す。移動の文脈を踏まえ、「住み着いた」とした。
