  text: וַֽ/יְחִ֣י אַרְפַּכְשַׁ֗ד אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שֶׁ֔לַח שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/013.yaml
  text: Arpachshad lived 403 years after he fathered Shelah[a], and he fathered sons and daughters.
translation:
  language: ja
  text: アルパクシャドはシェラをもうけた後、四百三年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現として、名を挙げた子をもうけた後の生存期間を自然な現代日本語で示す。
- source_word: אַרְפַּכְשַׁד
  choice: アルパクシャド
  rationale: ヘブライ語の語形に沿って固有名を音写した。
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: をもうけた後
  rationale: 男性を主語とする ילד のヒフィル形が表す出生・生殖と、その後の時点を簡潔に表した。
- source_word: אֶת שֶׁלַח
  choice: シェラ
  rationale: 目的格標識は訳出せず、固有名をヘブライ語から音写した。
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百三年
  rationale: ヘブライ語では三年と四百年の順だが、日本語で自然な数詞順にして正確な年数を保った。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 系図の文脈における男性主体の生殖を、古風すぎない自然な日本語で表した。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たちや娘たち
  rationale: 原文が男女双方の子を明記しているため、「子どもたち」と一般化せず保持した。
