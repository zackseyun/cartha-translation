source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְ/שָׂפָ֤ה אַחַת֙ לְ/כֻלָּ֔/ם וְ/זֶ֖ה הַחִלָּ֣/ם לַ/עֲשׂ֑וֹת וְ/עַתָּה֙ לֹֽא יִבָּצֵ֣ר מֵ/הֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/006.yaml
  text: And Yahweh said[a], "Behold, they are one people, and they all have one language, and this is what they have begun to do. And now nothing that they plan to do will be withheld from them."
translation:
  language: ja
  text: ヤハウェは言われた。「見よ、彼らは一つの民で、皆が一つの言語を話している。これが彼らが始めたことだ。今や、彼らが行おうと企てることは何一つ不可能ではなくなる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らが行おうと企てることは何一つ、彼らに対して差し止められない」。
    reason: בצר のニファル形には「不可能である」のほか、「差し止められる、妨げられる」という解釈の余地があるため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で表した。
- source_word: הֵן
  choice: 見よ
  rationale: 注意を促す指示的な働きを保ちつつ、聖書本文にふさわしい簡潔で格調ある表現とした。
- source_word: עַם אֶחָד
  choice: 一つの民
  rationale: 政治的な国家よりも、人々の集団としての一体性を表す語義を直接伝える。
- source_word: וְשָׂפָה אַחַת לְכֻלָּם
  choice: 皆が一つの言葉を使っている
  rationale: 「一つの唇」というヘブライ語の慣用表現を、全員が同じ言語を用いるという意味で自然な日本語にした。
- source_word: וְזֶה הַחִלָּם לַעֲשׂוֹת
  choice: これは彼らがし始めたことだ
  rationale: חלל のヒフィル形が示す「始める」を保ち、「にすぎない」など原文に明示されない限定を加えなかった。
- source_word: לֹא יִבָּצֵר מֵהֶם
  choice: 彼らに不可能ではない
  rationale: בצר のニファル形を、この文脈では計画の実現可能性を述べる慣用的な表現として訳した。別の語義である「妨げられない」も脚注に残した。
- source_word: כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת
  choice: 彼らが行おうと企てることは何一つ
  rationale: יזם の計画・企図の意味と、否定文中の כֹּל が表す包括性を自然な日本語で示した。
theological_decisions:
- issue: 一致した人類の能力についての発言の範囲
  choice: この物語の状況において、彼らが企てることは何一つ不可能でなくなる、という強い表現をそのまま保つ。
  alternative: 神が彼らの計画を何一つ妨げない、または彼らから何も差し控えないという意味に取る。
  rationale: 原文の緊張を保ち、人間の絶対的な全能を主張するとも、彼らの事業を是認するとも解釈しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、「見よ」「企てる」によって物語の荘重さを保った。神の発言が持つ強さと原文の語義的な曖昧さを、本文と脚注で示した。
