base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/022.yaml
  text: Serug lived thirty years and fathered Nahor.
translation:
  language: ja
  text: セルグは三十歳になったとき、ナホルをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 三十歳になったとき
  rationale: 系図に反復される年齢表現「三十年生き、そして…」を、現代日本語で年齢の意味が明瞭になるように表した。
- source_word: שְׂרוּג
  choice: セルグ
  rationale: 人名。日本語聖書で広く通用する表記を採用した。
- source_word: שְׁלֹשִׁים שָׁנָה
  choice: 三十歳
  rationale: 直訳は「三十年」だが、この系図の構文では子をもうけた時点の年齢を示すため、日本語の自然な年齢表現とした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とするヒフィル形で、系図上の父子関係を示す。「生んだ」より自然で、「父となった」より簡潔な現代日本語である。
- source_word: אֶת
  choice: ［訳出せず］
  rationale: 直接目的語を示す標識であり、日本語では語順と助詞「を」によって機能を表した。
- source_word: נָחוֹר
  choice: ナホル
  rationale: 人名。日本語聖書で広く通用する表記を採用した。
