base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/030.yaml
  text: Sarai was barren[a]; she had no child.
translation:
  language: ja
  text: サライは不妊で[a]、子どもがいなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「サライは子を産めない女で、子どもがいなかった。」
    reason: עֲקָרָה は「不妊」のほか、「子を産めない女」とも表現できるため。
lexical_decisions:
- source_word: וַתְּהִי
  choice: 〜であった（文脈に即して「不妊で」と表現）
  rationale: וַיְהִי 型の叙述としてサライの状態を示す。日本語では独立した接続語を補わず、後続の形容表現に「で」を用いて自然に表した。
- source_word: שָׂרַי
  choice: サライ
  rationale: 人名を日本語で慣用的に音写した。
- source_word: עֲקָרָה
  choice: 不妊
  rationale: 女性が子をもうけられない状態を表す形容語。簡潔で明確な現代日本語として「不妊」を選び、直後の「子がいなかった」との意味上の重なりも原文どおり保った。
- source_word: אֵין לָהּ
  choice: 彼女には〜がいなかった
  rationale: 存在否定と前置詞句による所有表現を、日本語で人について自然な「〜には…がいない」に相当する形で訳した。主語は文脈上明らかなため「彼女には」を表面上は繰り返していない。
- source_word: וָלָד
  choice: 子
  rationale: 生まれた者、子、子孫を指し得る語。この文脈では具体的で自然な「子」とした。
