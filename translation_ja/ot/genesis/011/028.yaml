  yaml_path: translation/ot/genesis/011/028.yaml
  text: And Haran died in the presence of Terah his father[a], in the land of his birth, in Ur of the Chaldeans.
translation:
  language: ja
  text: ハランは、父テラに先立って[a]、自分の生まれた地、カルデア人のウルで死んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「父テラの面前で」。ヘブライ語の慣用表現は直訳すると「父テラの顔の上で」となる。この箇所では、父がまだ生きている間に死んだことを表すとも理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死んだ
  rationale: מותのワイイクトル形は、物語中の過去の出来事を端的に表すため、自然な日本語の「死んだ」とした。
- source_word: עַל־פְּנֵי
  choice: 面前で
  rationale: 字義的には「顔の上で」に由来する慣用句で、父のいるところで、または父が存命中に死んだことを表し得る。「面前で」は具体的な表現を保ち、時間的意味だけに限定しない。
- source_word: תֶּרַח אָבִיו
  choice: 父テラ
  rationale: 接尾辞付きの「父」がテラをハランの父として特定している。現代日本語として自然で簡潔な語順にした。
- source_word: בְּאֶרֶץ מוֹלַדְתּוֹ
  choice: 自分の生まれた地
  rationale: מוֹלֶדֶתは出生地または故郷を指す。「自分の生まれた地」は、ここでの出生の意味を明確に伝える。
- source_word: בְּאוּר כַּשְׂדִּים
  choice: カルデア人のウルで
  rationale: אוּרは地名「ウル」、כַּשְׂדִּיםは民族名「カルデア人」であり、伝統的かつ明瞭な地名表現とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、物語文としての簡潔さと品位を保った。「面前で」により、原文の具体性と「父より先に／父の存命中に」という含みの両方を残した。
