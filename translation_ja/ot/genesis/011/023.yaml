base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/023.yaml
  text: And Serug lived two hundred years after he fathered Nahor, and he fathered sons and daughters.
translation:
  language: ja
  text: セルグはナホルをもうけた後、二百年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現における חיה を、期間を示す自然な現代日本語として訳した。
- source_word: שְׂרוּג
  choice: セルグ
  rationale: 人名は日本語聖書で広く用いられる慣用的な音写を採用した。
- source_word: אַחֲרֵי
  choice: 後
  rationale: ある出来事に続く期間を表す時間的な前置詞の意味を簡潔に保った。
- source_word: הוֹלִידוֹ
  choice: もうけた
  rationale: 使役形の ילד が系図で表す父として子を得る意味を、古風すぎない日本語で示した。
- source_word: אֶת
  choice: 訳出しない
  rationale: 定目的語を示す文法的標識であり、日本語に独立した対応語を必要としない。
- source_word: נָחוֹר
  choice: ナホル
  rationale: 人名は日本語聖書で広く用いられる慣用的な音写を採用した。
- source_word: מָאתַיִם שָׁנָה
  choice: 二百年
  rationale: 数詞と単数形名詞によるヘブライ語の期間表現を、自然な日本語の年数表現にした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 同節前半と同じ ילד の系図的用法を同じ語で訳し、一貫性を保った。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たちや娘たち
  rationale: 原文が男女双方の子を明記しているため、包括的な「子ども」にはまとめず、その区別を保持した。接続には列挙を自然に示す「や」を用いた。
