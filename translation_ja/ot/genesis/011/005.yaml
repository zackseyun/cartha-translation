  yaml_path: translation/ot/genesis/011/005.yaml
  text: Then Yahweh came down to see the city and the tower that the sons of man had built[a].
translation:
  language: ja
  text: そこで、ヤハウェは、人々[a]が建てた町と塔を見るために降りて来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「人（אָדָם）の子ら」。ヘブライ語のこの表現は、ここでは人間を集合的に指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: そこで、…降りて来た
  rationale: ירדの具体的な下降の動きを保ち、接続形による物語の進行を「そこで」で自然に示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名を称号に置き換えず、四文字神名の一般的な日本語音写で表した。
- source_word: לִרְאֹת
  choice: 見るために
  rationale: ראהの基本義をそのまま表し、「調べる」などの解釈を加えず、物語上の擬人的表現と含意を保った。
- source_word: הָעִיר וְאֶת הַמִּגְדָּל
  choice: 町と塔
  rationale: 二つの定目的語を、文脈上特定されていることが自然に伝わる簡潔な日本語で表した。
- source_word: אֲשֶׁר בָּנוּ
  choice: が建てた
  rationale: 関係節を自然な連体修飾にし、複数動詞の主語を「人の子ら」とした。ヘブライ語の完了形に、日本語では不要な完了相を過度に補わない。
- source_word: בְּנֵי הָאָדָם
  choice: 人の子ら
  rationale: 字義的な形と、神と人間との対照を保った。集合的に人間を指す慣用的意味は脚注で明示した。
theological_decisions:
- issue: ヤハウェが降りるという擬人的描写
  choice: 具体的に「降りて来た」と訳す
  alternative: 見下ろした／目を向けた
  rationale: 原文が描く具体的な下降を抽象化せず、物語の文学的・神学的緊張を残した。
- issue: בְּנֵי הָאָדָם の代表的・集合的意味
  choice: 本文では「人の子ら」とする
  alternative: 人間たち／人類
  rationale: 原文の男性複数形を反映しつつ、実際には人間を集合的に指すことを脚注で補った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神名と擬人的な下降表現を保持した。「降りて来た」は過度な敬語化を避け、原文の簡潔な叙述に合わせている。
