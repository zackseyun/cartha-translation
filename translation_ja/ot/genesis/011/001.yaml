  text: וַֽ/יְהִ֥י כָל הָ/אָ֖רֶץ שָׂפָ֣ה אֶחָ֑ת וּ/דְבָרִ֖ים אֲחָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/001.yaml
  text: The whole earth had one language and the same words[a].
translation:
  language: ja
  text: 全地は一つの言語を用い、同じことばを使っていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「一組のことば」または「同じ話し方」。ヘブライ語は直訳すると「一つの言語と、同一のことば（複数）」となる。
    reason: אֲחָדִים の形と意味には解釈上の幅があり、文脈上は共有された語彙・表現を指すと理解される。
lexical_decisions:
- source_word: וַיְהִי
  choice: であった
  rationale: 物語の状況を導入する היה のワウ継続形を、現代日本語で自然な状態描写として訳した。「さて」など、原文に明示されない時間・談話標識は加えない。
- source_word: כָל הָאָרֶץ
  choice: 全地
  rationale: אָרֶץ には「地」と「土地」の両義があるが、ここでは広く人類世界を視野に入れる文脈であり、כָל を含めて簡潔で格調ある「全地」とした。
- source_word: שָׂפָה אֶחָת
  choice: 一つの言語
  rationale: שָׂפָה の字義は「唇」だが、この慣用では言語を指す。אֶחָת の単一性を保ちつつ明瞭に訳した。
- source_word: וּדְבָרִים אֲחָדִים
  choice: 一つのことば
  rationale: דְּבָרִים の「ことば」という語義と、אֲחָדִים が表す共通性・同一性を保つ。「言語」と重ねながらも原文の並列表現を消さない訳とした。日本語の「ことば」は集合的にも用いられるため「一つ」と自然に結びつく。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で dignified な聖書本文の調子を保った。「全地」はやや文語的だが現代の聖書文体で理解しやすく、「全世界」よりも אָרֶץ の語感を直接保つ。
