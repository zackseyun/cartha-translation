  text: וַ/יְחִ֣י נָח֗וֹר אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת תֶּ֔רַח תְּשַֽׁע עֶשְׂרֵ֥ה שָׁנָ֖ה וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/025.yaml
  text: Nahor lived one hundred nineteen years after he fathered Terah, and he fathered sons and daughters.
translation:
  language: ja
  text: ナホルはテラをもうけた後、百十九年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現において、その後も生存した年数を表す。現代日本語として簡潔な「生き」を用いた。
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: をもうけた後
  rationale: 名を挙げられた息子の誕生後の期間を示す構文。能動的な意味を保ちつつ、現代日本語で自然な表現とした。
- source_word: תֶּרַח
  choice: テラ
  rationale: ヘブライ語の人名を、日本語聖書で一般的な表記に従って音写した。
- source_word: תְּשַׁע עֶשְׂרֵה שָׁנָה וּמְאַת שָׁנָה
  choice: 百十九年
  rationale: ヘブライ語では十九と百の順だが、日本語で自然な位取りの順序にした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 前半の ילד と語彙上の対応を保ち、古風すぎない自然な系図表現とした。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たちと娘たち
  rationale: 原文が男女の子を明示しているため、一般化した「子どもたち」ではなく、その区別を保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。系図の反復表現を保ちながら、古語的な「生んだ」「産んだ」を父親に用いる不自然さを避け、「もうけた」で統一した。
