  yaml_path: translation/ot/genesis/011/027.yaml
  text: 'These are the generations of Terah: Terah fathered Abram, Nahor, and Haran; and Haran fathered Lot.'
translation:
  language: ja
  text: これはテラの系譜である。テラはアブラム、ナホル、ハランをもうけ、ハランはロトをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה תּוֹלְדֹת
  choice: これは…の系譜である
  rationale: 創世記で区分を示す定型句としての機能を保ちつつ、תּוֹלְדֹתが家系とそこから展開する記録を指し得ることを、簡潔で自然な現代日本語の「系譜」で表した。冒頭のוְは日本語では独立した接続詞にせず、文脈上の連続性に委ねた。
- source_word: תֶּרַח
  choice: テラ
  rationale: 人名を日本語で定着した慣用表記に従って音写した。
- source_word: הוֹלִיד
  choice: もうけた
  rationale: 系譜における使役形の「子を生じさせる、父となる」という意味を、古語的な「生んだ」や硬い説明調を避け、父について自然に用いられる「もうけた」で表した。二度の出現を同じ語で訳した。
- source_word: אֶת אַבְרָם אֶת נָחוֹר וְאֶת הָרָן
  choice: アブラム、ナホル、ハランを
  rationale: 目的語標識は訳出せず、三人の名を原文どおり並列した。人名は日本語の慣用表記に従った。
- source_word: וְהָרָן הוֹלִיד אֶת לוֹט
  choice: ハランはロトをもうけた
  rationale: 接続詞וְは前節との連続を表す「〜もうけ、」という文のつながりで反映し、系譜上の父子関係を明確にした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、創世記の系譜定型にふさわしい簡潔さと品位を保った。「系譜」は単なる子孫一覧に狭めすぎず、この見出しから始まる家系の展開を含み得る語として選んだ。
