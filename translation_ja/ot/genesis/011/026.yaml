  text: וַֽ/יְחִי תֶ֖רַח שִׁבְעִ֣ים שָׁנָ֑ה וַ/יּ֨וֹלֶד֙ אֶת אַבְרָ֔ם אֶת נָח֖וֹר וְ/אֶת הָרָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/026.yaml
  text: Terah lived seventy years and fathered Abram[a], Nahor, and Haran.
translation:
  language: ja
  text: テラは七十歳になって、アブラム、ナホル、ハランをもうけた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には「父となった」。ヘブライ語の系図表現は、息子たちがここに記された順に生まれたことを必ずしも意味しない。
    reason: 語義上の別訳と、系図の列挙順に関する曖昧さを示すため。
lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系図の定型表現として、テラが記された年齢に達したことを表す。原文の時間的な流れを保ちながら、自然な現代日本語とした。
- source_word: שִׁבְעִים שָׁנָה
  choice: 七十年
  rationale: 原文どおり「七十年」とし、「七十歳になって」と解釈的に言い換えすぎないようにした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 系図では「父となった」の意味を表す。古風な「生んだ」や硬い「父となった」より自然であり、三人が同時に生まれた、または記載順に生まれたとは限定しない。
- source_word: אֶת ... אֶת ... וְאֶת
  choice: アブラム、ナホル、ハランを
  rationale: 反復される目的語標識によって三人がそれぞれ目的語として示される。日本語では読点を用いた自然な列挙とした。
- source_word: אַבְרָם
  choice: アブラム
  rationale: ヘブライ語の人名を、日本語聖書で広く通用する形で音写した。
- source_word: נָחוֹר
  choice: ナホル
  rationale: ヘブライ語の人名を、日本語聖書で広く通用する形で音写した。
- source_word: הָרָן
  choice: ハラン
  rationale: ヘブライ語の人名を、日本語聖書で広く通用する形で音写した。語頭の形はここでは人名の一部であり、冠詞として訳し分けない。
theological_decisions:
- issue: 系図における息子たちの出生順と年齢の含意
  choice: テラが七十年生きた後に三人をもうけたという系図上の記述として訳し、列挙順が厳密な出生順であるとは示さない。
  alternative: テラが七十歳の時に三人全員の父となった、または三人が記載順に生まれたと明示する。
  rationale: ヘブライ語本文は年齢と三人の名を結びつけるが、三つ子であったことや厳密な出生順、各人の出生時点までは確定しない。後続箇所との年代上の緊張を訳文で解消しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「もうけた」は系図的な父子関係を自然に表し、出生順や同時出生を不必要に限定しない。
