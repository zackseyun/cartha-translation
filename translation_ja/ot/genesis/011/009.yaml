  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ בָּבֶ֔ל כִּי שָׁ֛ם בָּלַ֥ל יְהוָ֖ה שְׂפַ֣ת כָּל הָ/אָ֑רֶץ וּ/מִ/שָּׁם֙ הֱפִיצָ֣/ם יְהוָ֔ה עַל פְּנֵ֖י כָּל הָ/אָֽרֶץ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/009.yaml
  text: Therefore its name was called Babel[a], because there Yahweh confused the language of all the earth, and from there Yahweh scattered them over the face of all the earth.
translation:
  language: ja
  text: それゆえ、その名はバベル[a]と呼ばれた。そこではヤハウェが全地のことばを混乱させ、そこからヤハウェが彼らを全地の至る所に散らしたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「バベル」は、ヘブライ語で「混乱させる」「混ぜる」を意味する動詞バラル（balal）との語呂合わせであり、この節はその名の由来を説明している。
    reason: 原文の語呂合わせは日本語本文では再現できないため。
lexical_decisions:
- source_word: עַל כֵּן
  choice: それゆえ
  rationale: 命名の理由と直前の出来事を結ぶ推論・因果の表現として、簡潔で格調のある現代日本語とした。
- source_word: קָרָא שְׁמָהּ
  choice: その町の名は…と呼ばれた
  rationale: ヘブライ語は字義的には「彼はその名を呼んだ」だが、主語が明示されない命名句であるため、日本語では受動表現が自然。「その町」を補って指示対象を明確にした。
- source_word: בָּבֶל
  choice: バベル
  rationale: 固有名として慣用的な音写を採用した。בבל と בלל の語呂合わせは本文だけでは再現できないため脚注で示した。
- source_word: כִּי שָׁם
  choice: そこで…からである
  rationale: 命名の理由を示す כִּי と場所を示す שָׁם を、日本語の自然な理由節として表した。
- source_word: בָּלַל
  choice: 混乱させ
  rationale: 言語を混ぜ合わせて相互理解を妨げる文脈を簡潔に表し、バベルとの語呂合わせは脚注で補った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名の一般的な学術的音写で表した。
- source_word: שְׂפַת כָּל הָאָרֶץ
  choice: 全地のことば
  rationale: שָׂפָה は字義的には「唇」だが、ここでは言語・話しことばを指す。「ことば」は物語の文脈に自然で、単一の言語体系だけに狭めない。
- source_word: וּמִשָּׁם
  choice: そこから
  rationale: 直前の「そこで」と場所の連続性を保った。
- source_word: הֱפִיצָם
  choice: 人々を…散らした
  rationale: 接尾代名詞「彼ら」を、指示対象が明瞭になるよう「人々」とした。使役的に各地へ分散させる意味を「散らした」で表した。
- source_word: עַל פְּנֵי כָּל הָאָרֶץ
  choice: 全地の面に
  rationale: 「全地に」よりも原文の具体的な慣用句「全地の面の上に」を保持しつつ、日本語として理解可能な形にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を二度用いているため、称号「主」に置換せず音写し、反復も保持した。母音の厳密な古代発音には不確実性があるが、現代の一般的な学術表記を採用した。
- issue: 「全地」の意味範囲
  choice: 全地
  alternative: 全世界、国中
  rationale: הָאָרֶץ は「地」「土地」の双方を取り得るため、意味範囲を不必要に限定しない「全地」とし、本文に宇宙論的・地理的解釈を付加しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書本文としての簡潔さと品位を保った。「全地」を二度繰り返し、ヤハウェという神名の反復も原文どおり保持した。
