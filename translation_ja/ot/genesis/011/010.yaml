source:
  edition: WLC
  text: אֵ֚לֶּה תּוֹלְדֹ֣ת שֵׁ֔ם שֵׁ֚ם בֶּן מְאַ֣ת שָׁנָ֔ה וַ/יּ֖וֹלֶד אֶת אַרְפַּכְשָׁ֑ד שְׁנָתַ֖יִם אַחַ֥ר הַ/מַּבּֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/010.yaml
  text: These are the generations of Shem. Shem was one hundred years old[a], and he fathered Arpachshad two years after the flood.
translation:
  language: ja
  text: これはセムの系譜である。セムは百歳の時、洪水の二年後にアルパクシャド[a]をもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別の表記「アルファクサド」は、ヘブライ語形ではなくギリシア語形に由来する伝統的な音写である。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה תּוֹלְדֹת שֵׁם
  choice: これはセムの系譜である
  rationale: 創世記で区切りを示す定型句。複数指示詞を含むヘブライ語を日本語として自然な単数表現にしつつ、後に続く家系の記録という意味を「系譜」で保った。
- source_word: בֶּן מְאַת שָׁנָה
  choice: 百歳の時
  rationale: 直訳では「百年の子」だが、年齢を表すヘブライ語慣用句なので、現代日本語で自然に表現した。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 系譜における使役形で、父として子を生じさせたことを表す。「もうけた」は古風すぎず、男性側の系譜上の関係を明確に示す。
- source_word: אַרְפַּכְשָׁד
  choice: アルパクシャド
  rationale: ギリシア語形ではなく、ヘブライ語の子音に基づいて人名を音写した。
- source_word: שְׁנָתַיִם אַחַר הַמַּבּוּל
  choice: 洪水の二年後に
  rationale: 双数形「二年」と時間関係「洪水の後」を、意味を変えず自然な日本語の語順で表した。定冠詞によりノアの洪水を指すことは文脈上明らかである。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「系譜」「もうけた」により、創世記の系譜定型を簡潔に示した。英語相談層では脚注記号が年齢表現の後に置かれていたが、脚注内容が人名の異表記に関するため、該当する「アルパクシャド」の直後に配置した。
