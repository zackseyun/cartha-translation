  text: וַֽ/יְחִי שֶׁ֗לַח אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת עֵ֔בֶר שָׁלֹ֣שׁ שָׁנִ֔ים וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/015.yaml
  text: And Shelah lived 403 years after he fathered Eber[a], and he fathered sons and daughters.
translation:
  language: ja
  text: シェラはエベルをもうけた後、四百三年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現として、存命期間を自然かつ簡潔に示す。後続する年数と結び付けて「四百三年生き」とした。
- source_word: שֶׁלַח
  choice: シェラ
  rationale: ヘブライ語の人名 שֶׁלַח の音形に沿った現代日本語の表記。
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: をもうけた後
  rationale: 男性を主語とする系図上の הוליד は子をもうけることを表す。「生んだ」ではなく、自然で明確な「もうけた」とした。
- source_word: עֵבֶר
  choice: エベル
  rationale: ヘブライ語の人名 עֵבֶר の音形を反映する一般的な日本語表記。目的語標識 אֶת は訳出しない。
- source_word: שָׁלֹשׁ שָׁנִים וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 四百三年
  rationale: 原文は字義的には「三年と四百年」だが、合計四百三年を表すヘブライ語の数表現なので、日本語の通常の語順で訳した。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とする系図の要約表現として、古風な言い回しを避けつつ父となった意味を保つ。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たちと娘たち
  rationale: 原文が男女を明記しているため、一般化した「子どもたち」ではなく両方を明示した。
