  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמְר֞וּ הָ֣בָ/ה נִבְנֶה לָּ֣/נוּ עִ֗יר וּ/מִגְדָּל֙ וְ/רֹאשׁ֣/וֹ בַ/שָּׁמַ֔יִם וְ/נַֽעֲשֶׂה לָּ֖/נוּ שֵׁ֑ם פֶּן נָפ֖וּץ עַל פְּנֵ֥י כָל הָ/אָֽרֶץ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/004.yaml
  text: And they said[a], “Come, let us build for ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves[b], lest we be scattered over the face of the whole earth.”
translation:
  language: ja
  text: 彼らは言った。「さあ、自分たちのために町と、その頂が天にある塔を建てよう。そして、自分たちの名を上げよう。そうしなければ、私たちは全地に散らされてしまう。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: さあ
  rationale: 共同の行動を促す間投詞の力を、自然な現代日本語で表す。
- source_word: נִבְנֶה לָּנוּ
  choice: 自分たちのために…建てよう
  rationale: 一人称複数の勧奨・決意と、לָּנוּ の受益・再帰的な意味を明確に伝える。
- source_word: עִיר וּמִגְדָּל
  choice: 町と塔
  rationale: עִיר は文脈上、規模を過度に限定しない「町」とし、מִגְדָּל は軍事的用途を付加せず基本義の「塔」とする。
- source_word: וְרֹאשׁוֹ בַשָּׁמַיִם
  choice: その頂は天に届くほどにしよう
  rationale: 直訳は「その頂が天に」であるが、日本語では述語を補って意図を自然に表した。原文の簡潔で誇張的な表現は脚注に残す。
- source_word: וְנַעֲשֶׂה לָּנוּ שֵׁם
  choice: 自分たちの名を上げよう
  rationale: 「名を作る」というヘブライ語慣用句が表す、名声や名誉を得ようとする意図を、日本語の慣用表現で伝える。
- source_word: פֶּן נָפוּץ
  choice: そうしなければ、私たちは…散らされてしまう
  rationale: פֶּן の否定的目的・危惧を自然に示し、נָפוּץ の受動的に散らされる可能性を保つ。
- source_word: עַל פְּנֵי כָל הָאָרֶץ
  choice: 全地の表に
  rationale: 原始史の世界的文脈に合わせて הָאָרֶץ を「地」とし、עַל־פְּנֵי の空間的な比喩を「表に」で保持する。
theological_decisions:
- issue: バベル物語における הָאָרֶץ の範囲
  choice: 全地
  alternative: 全土
  rationale: 創世記11章の原始史的文脈では、特定地域ではなく人類が住む地全体への拡散が問題となっているため。
- issue: 「名を作る」の含意
  choice: 自分たちの名を上げよう
  alternative: 自分たちのために名を作ろう
  rationale: 名声を得るという慣用的意味を伝える一方、その行為への神学的評価を訳文に付け加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「さあ」「建てよう」で集団的な決意を生き生きと表しつつ、過度に古風な表現は避けた。原文の曖昧さは脚注で示した。
