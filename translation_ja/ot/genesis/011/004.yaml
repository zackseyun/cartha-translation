  - severity: low
    issue: 「全地の表に」が不自然
    rationale: עַל־פְּנֵי כָל־הָאָרֶץ の空間的広がりは「全地に」で自然に表せる。「全地の表に」は現代日本語ではぎこちない。
  revised_text: 彼らは言った。「さあ、自分たちのために町と、その頂が天にある塔を建てよう。そして、自分たちの名を上げよう。そうしなければ、私たちは全地に散らされてしまう。」
