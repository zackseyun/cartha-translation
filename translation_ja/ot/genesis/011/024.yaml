  text: ナホルは二十九年生きて、テラをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系図の定型表現において、次の出来事まで生きた年数を示す。現代日本語として自然な「二十九年生きて」とした。
- source_word: נָחוֹר
  choice: ナホル
  rationale: 人名として、一般的な日本語聖書の表記に従って音写した。
- source_word: תֵּשַׁע וְעֶשְׂרִים שָׁנָה
  choice: 二十九年
  rationale: ヘブライ語では文字どおりには「九と二十年」だが、現代日本語の通常の数え方に整えた。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: ヒフィル形の ילד は系図で「子の父となる、子をもうける」を意味する。「もうけた」は簡潔で自然であり、系図上の父子関係を表す。
- source_word: אֶת
  choice: 訳出しない
  rationale: 直接目的語を示す標識であり、日本語では語順と助詞によって機能を表すため、独立には訳さない。
- source_word: תָּרַח
  choice: テラ
  rationale: 人名として、一般的な日本語聖書の表記に従って音写した。
