  yaml_path: translation/ot/genesis/011/011.yaml
  text: And Shem lived five hundred years after he fathered Arpachshad, and he fathered sons and daughters.
translation:
  language: ja
  text: セムはアルパクシャデをもうけた後、五百年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現として、ある出来事の後に続いた生存期間を自然な現代日本語で示す。
- source_word: שֵׁם
  choice: セム
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת אַרְפַּכְשָׁד
  choice: アルパクシャドをもうけた後
  rationale: הוליד の使役形が系図で父親として子をもうけることを表すため、「生んだ」ではなく「もうけた」とした。
- source_word: חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: 五百年
  rationale: 生存期間を表す数詞句を簡潔かつ直接的に訳した。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 前半の הוליד と同じ語根の生殖・父系的意味を保ち、現代日本語として自然にした。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子や娘たち
  rationale: 原文が男女双方の子を明示している点を保持する。「や」は両者を例示的にぼかす意図ではなく、日本語で組を自然に結ぶ用法である。
