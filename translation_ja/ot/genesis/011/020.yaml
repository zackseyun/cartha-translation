  yaml_path: translation/ot/genesis/011/020.yaml
  text: And Reu lived thirty-two years and fathered Serug.
translation:
  language: ja
  text: レウは三十二年生きて、セルグをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系譜の定型表現として、子をもうけた時点までの年数を示す。続く動詞と自然につなぐため「生きて」とした。
- source_word: רְעוּ
  choice: レウ
  rationale: ヘブライ語の人名を、日本語聖書で理解しやすい慣用的な音写で表した。
- source_word: שְׁתַּיִם וּשְׁלֹשִׁים שָׁנָה
  choice: 三十二年
  rationale: 原文の「二と三十」という数値を、現代日本語の自然な語順で正確に表した。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 系譜における ילד の使役形は子を生じさせること、すなわち父となることを表す。「もうけた」は簡潔で自然な現代日本語である。
- source_word: אֶת
  choice: 訳語なし
  rationale: 直接目的語を示す文法標識であり、日本語では語順と助詞「を」によって機能を表した。
- source_word: שְׂרוּג
  choice: セルグ
  rationale: ヘブライ語の人名を、日本語聖書で理解しやすい慣用的な音写で表した。
