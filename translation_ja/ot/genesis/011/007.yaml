  text: הָ֚בָ/ה נֵֽרְדָ֔ה וְ/נָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑/ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/007.yaml
  text: Come, let us go down there and confuse their language, so that one man will not understand the language of his neighbor.
translation:
  language: ja
  text: さあ、われわれは降りて行き、そこで彼らのことばを混乱させよう。互いのことばが分からなくなるように。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבָה
  choice: さあ
  rationale: 勧誘・促しを表す間投詞として、現代日本語で自然かつ簡潔に訳した。
- source_word: נֵרְדָה
  choice: われわれは降りて行き
  rationale: 一人称複数の勧奨形を明示し、方向を表す「降りる」も保持した。
- source_word: נָבְלָה
  choice: 混乱させよう
  rationale: 語根בללがここで表す、意思疎通を妨げるように入り混じらせる使役的意味を表現した。
- source_word: שְׂפָתָם
  choice: 彼らのことば
  rationale: 直訳は「彼らの唇」だが、文脈上は言語・発話を指す換喩なので、自然な日本語の「ことば」とした。
- source_word: אִישׁ שְׂפַת רֵעֵהוּ
  choice: 互いのことば
  rationale: 字義的には「人がその仲間のことばを」だが、一般的な相互不理解を表すヘブライ語表現として簡潔に訳した。
theological_decisions:
- issue: 一人称複数形「われわれ」の解釈
  choice: われわれ
  alternative: わたしは／神々は／天の会議の者たちと共に
  rationale: 原文の複数形をそのまま保持し、その指示対象を三位一体、威厳の複数、天上の会議など特定の解釈に限定しなかった。
- issue: 「人が仲間のことばを聞かない」の意味
  choice: 互いのことばが分からなくなる
  alternative: 隣人のことばを聞かなくなる
  rationale: שמעは「聞く」と「理解する」の両義を持つが、言語混乱の文脈では理解不能が中心であるため「分からない」とした。相互性も自然な日本語で示した。
translation_notes:
  register: 明快な現代標準日本語。神の発話としての品位を保ちつつ、古風すぎる表現を避けた。原文の複数形に伴う神学的な曖昧さは「われわれ」で保持した。
