lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現におけるחיהの意味を自然な現代日本語で表し、名指された子をもうけた後の生存期間を示す。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ
  choice: レウをもうけた後
  rationale: אַחֲרֵיの時間的前後関係と、使役形ילדが示す父親として子をもうける意味を簡潔に保つ。固有名רְעוּは「レウ」と音写した。
- source_word: תֵּשַׁע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 二百九年
  rationale: ヘブライ語では九年と二百年の順だが、日本語の自然な数詞順に整えた。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 系図におけるילדの父系的な意味を保ちつつ、古風すぎない自然な表現とした。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たちと娘たち
  rationale: 原文が男女の子を明示しているため、一般化した「子どもたち」ではなく、それぞれを訳出した。
