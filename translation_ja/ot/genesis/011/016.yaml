  text: エベルは三十四歳のとき、ペレグをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系図の定型表現として、次の出来事までの年数を示す。後続するוַיּוֹלֶדとのつながりを自然な日本語の連用形で表した。
- source_word: עֵבֶר
  choice: エベル
  rationale: ヘブライ語の人名を、現代日本語の聖書で広く通用する形に音写した。
- source_word: אַרְבַּע וּשְׁלֹשִׁים שָׁנָה
  choice: 三十四年
  rationale: 原文は「四と三十年」の語順だが、数値を正確に保ちつつ自然な現代日本語の数詞順にした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とする系図上の ילד の使役形は子を生ませる、すなわち父となることを表す。「もうけた」は簡潔で自然な現代日本語である。
- source_word: אֶת
  choice: 訳出しない
  rationale: ヘブライ語の直接目的語標識であり、日本語では目的語を「を」で示すことで統語的機能を表した。
- source_word: פָּלֶג
  choice: ペレグ
  rationale: ヘブライ語の人名を標準的な日本語表記で音写した。
