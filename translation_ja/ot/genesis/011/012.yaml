  text: And Arpachshad lived thirty-five years and fathered Shelah[a][b][c].
translation:
  language: ja
  text: アルパクシャドは三十五歳のとき、シェラをもうけた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「シェラ」は、伝承によっては「サラ」と表記される。
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/אַרְפַּכְשַׁד
  choice: アルパクシャドは
  rationale: 接続詞 וְ は系図の連続を示すが、日本語では節を自然につなぐ文脈によって十分に表されるため、明示的な「そして」は置かなかった。固有名はヘブライ語に基づいて音写した。
- source_word: חַי חָמֵשׁ וּ/שְׁלֹשִׁים שָׁנָה
  choice: 三十五歳まで生きたとき
  rationale: 直訳的な「三十五年生きて」を、年齢を示す日本語として自然な形にした。この系図定型句では、三十五歳になった時点で次の出来事が起きたことを表す。
- source_word: וַ/יּוֹלֶד
  choice: 父となった
  rationale: ヒフィル形の男性主語による系図用法を明確に表しつつ、現代日本語で自然かつ品位ある表現とした。「もうけた」よりも父系上の関係を明示する。
- source_word: אֶת
  choice: 訳語なし
  rationale: 定目的語を示す標識であり、日本語では語順と助詞によって機能が表されるため、独立した訳語を置かない。
- source_word: שָׁלַח
  choice: シェラ
  rationale: WLCのヘブライ語 שָׁלַח に基づく音写。伝統によっては「サラ」と表記される。
theological_decisions:
- issue: וַיּוֹלֶד が直接の実子関係のみを意味するか
  choice: 「父となった」と訳し、系図上の父子関係を示す
  alternative: 「シェラをもうけた」
  rationale: ヘブライ語の系図表現が持つ父系関係を保ちつつ、生物学的な直接性について本文以上の限定を加えないため。
translation_notes:
  register: 明快な現代標準日本語。系図の簡潔さと格調を保ち、「生きたとき」によってヘブライ語の年齢定型句を自然に表現した。原文の語順「五と三十」は日本語では通常の「三十五」とし、不要な逐語注は付さなかった。
