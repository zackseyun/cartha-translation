lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי תֶרַח
  choice: テラの生涯は……であった
  rationale: 直訳的な「テラの日々」はヘブライ語で寿命を表す定型表現。現代日本語として自然で意味の明確な「生涯」とした。
- source_word: חָמֵשׁ שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 二百五年
  rationale: ヘブライ語の数詞の配列を、日本語の標準的な数の順序に整えた。
- source_word: תֶרַח
  choice: テラ
  rationale: 日本語聖書で広く用いられる慣用的な人名表記を採用した。
- source_word: וַיָּמָת
  choice: 死んだ
  rationale: מותの直接的な意味を婉曲化せず、平明な現代日本語で表した。
- source_word: בְּחָרָן
  choice: ハランで
  rationale: 場所を示す前置詞בを、死が起きた場所を表す日本語の助詞「で」で自然に訳した。
