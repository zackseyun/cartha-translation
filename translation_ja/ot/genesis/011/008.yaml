source:
  edition: WLC
  text: וַ/יָּ֨פֶץ יְהוָ֥ה אֹתָ֛/ם מִ/שָּׁ֖ם עַל פְּנֵ֣י כָל הָ/אָ֑רֶץ וַֽ/יַּחְדְּל֖וּ לִ/בְנֹ֥ת הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/008.yaml
  text: So Yahweh scattered them from there over the face of all the earth[a], and they stopped building the city.
translation:
  language: ja
  text: こうして、ヤハウェは彼らをそこから全地に散らした[a]。彼らはその町を建てるのをやめた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「全地の表面に」。また、「全地にわたって」「全土に」とも訳せる。
    reason: עַל־פְּנֵי כָל־הָאָרֶץ の「地の表面に」というヘブライ語の慣用的表現と、自然な訳し方の幅を示すため。
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: 散らされた
  rationale: 動詞פוץの使役的な意味を表し、人々が各地へ離散させられたという裁きの文脈にも合う。主語への敬意を自然な日本語の敬語で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、一般的な日本語音写で固有名として表した。
- source_word: מִשָּׁם
  choice: そこから
  rationale: 直前のバベルの場所を指す簡潔で自然な表現。
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: 全地に
  rationale: 字義的には「全地の面に」だが、日本語では分散の広がりを「全地に」とするのが明瞭で自然。「地」が地上全体または広範な地域を指し得る余地は注で示した。
- source_word: וַיַּחְדְּלוּ
  choice: やめた
  rationale: חדלの「中止する、やむ」を、現代の標準的で分かりやすい日本語にした。
- source_word: לִבְנֹת
  choice: 建てるのを
  rationale: 不定詞構文を、日本語の「～するのをやめる」という自然な形で表した。
- source_word: הָעִיר
  choice: その町
  rationale: 文脈ですでに建設中の特定の町を指すため、日本語では照応が明確な「その町」とした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を用いているため、称号の「主」に置換せず音写した。「エホバ」ではなく、現代の学術的復元に基づく一般的な「ヤハウェ」を採用した。
- issue: 神による離散の主体性
  choice: ヤハウェは…散らされた
  alternative: 彼らは…散っていった
  rationale: 原文の使役的な動詞と明示された主語を保ち、離散が単なる自発的移住ではなく、ヤハウェの働きによることを示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「こうして」で物語上の結果を示し、二つの動作を読みやすく二文に分けた。神の行為には過度に古風でない敬語を用いた。
