  text: וַ/יִּקַּ֨ח אַבְרָ֧ם וְ/נָח֛וֹר לָ/הֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת אַבְרָם֙ שָׂרָ֔י וְ/שֵׁ֤ם אֵֽשֶׁת נָחוֹר֙ מִלְכָּ֔ה בַּת הָרָ֥ן אֲבִֽי מִלְכָּ֖ה וַֽ/אֲבִ֥י יִסְכָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/029.yaml
  text: Abram and Nahor took wives for themselves. The name of Abram’s wife was Sarai[a], and the name of Nahor’s wife was Milcah, the daughter of Haran, the father of Milcah and of Iscah.
translation:
  language: ja
  text: アブラムとナホルは、それぞれ妻を迎えた。[a] アブラムの妻の名はサライ、ナホルの妻の名はミルカであった。ミルカはハランの娘であり、ハランはミルカとイスカの父であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「自分たちのために妻を取った」。
    reason: 婚姻を表すヘブライ語の字義的表現を示すため。本文では自然な現代日本語として「妻を迎えた」とした。
lexical_decisions:
- source_word: וַיִּקַּח ... לָהֶם נָשִׁים
  choice: それぞれ妻を迎えた
  rationale: 直訳的には「自分たちのために妻を取った」だが、日本語の婚姻表現として自然で品位のある「妻を迎えた」とし、לָהֶםの各人に関わる意味を「それぞれ」で表した。直訳は脚注に残した。
- source_word: שֵׁם אֵשֶׁת אַבְרָם ... שֵׁם אֵשֶׁת נָחוֹר
  choice: アブラムの妻の名は……ナホルの妻の名は……
  rationale: 原文で反復される「妻の名」を保ち、系譜的な叙述の調子を再現した。
- source_word: שָׂרָי
  choice: サライ
  rationale: 日本語聖書で広く用いられる標準的な音写。
- source_word: מִלְכָּה
  choice: ミルカ
  rationale: 日本語聖書で広く用いられる標準的な音写。
- source_word: בַּת הָרָן
  choice: ハランの娘
  rationale: בַּתの基本的な親族関係をそのまま明確に訳した。
- source_word: אֲבִי מִלְכָּה וַאֲבִי יִסְכָּה
  choice: ハランはミルカとイスカの父であった
  rationale: 原文の同格表現を自然な日本語の独立節にしつつ、ハランが両者の父であるという関係を明示した。
- source_word: יִסְכָּה
  choice: イスカ
  rationale: 日本語聖書で用いられる標準的な音写。
