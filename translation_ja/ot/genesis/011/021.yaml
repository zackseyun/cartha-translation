  text: וַ/יְחִ֣י רְע֗וּ אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת שְׂר֔וּג שֶׁ֥בַע שָׁנִ֖ים וּ/מָאתַ֣יִם שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/021.yaml
  text: And Reu lived after he fathered Serug two hundred and seven years[a], and he fathered sons and daughters.
translation:
  language: ja
  text: レウはセルグをもうけた後、二百七年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現として、存命期間を自然かつ簡潔に表す。文脈上「生き続けた」も可能だが、日本語では「生きた」が明瞭である。
- source_word: רְעוּ
  choice: レウ
  rationale: ヘブライ語の人名を、日本語聖書で理解しやすい慣用的な形に音写した。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת שְׂרוּג
  choice: セルグをもうけた後
  rationale: הוליד の使役形が男性を主語として子の誕生に関与することを示すため、「もうけた」とした。「生んだ」は男性主語には不自然であり、「父となった」より系図の反復表現に適する。
- source_word: שֶׁבַע שָׁנִים וּמָאתַיִם שָׁנָה
  choice: 二百七年
  rationale: ヘブライ語では七と二百の順だが、現代日本語の自然な数詞順に整えた。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 系図における男性主語の ילד 使役形を、古風すぎない現代日本語で表した。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たちと娘たち
  rationale: 原文が男女双方の子を明示しているため、一般化して「子どもたち」とせず、それぞれを訳出した。
theological_decisions: []
