revisions:
- from: テラは、息子アブラムと、息子ハランの子、すなわち自分の孫ロト[a]と、嫁サライ、すなわち息子アブラムの妻を連れ、彼らは一緒にカルデア人のウルを出て、カナンの地へ向かった[b]。彼らはハランまで来ると、そこに住んだ。
  to: テラは、息子アブラム、息子ハランの子である孫ロト[a]、そして自分の息子アブラムの妻サライを連れ、彼らは一緒に[b]カルデア人のウルを出て、カナンの地へ向かった。彼らはハランまで来ると、そこに住んだ。
