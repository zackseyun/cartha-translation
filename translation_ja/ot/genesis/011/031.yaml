source:
  edition: WLC
  text: וַ/יִּקַּ֨ח תֶּ֜רַח אֶת אַבְרָ֣ם בְּנ֗/וֹ וְ/אֶת ל֤וֹט בֶּן הָרָן֙ בֶּן בְּנ֔/וֹ וְ/אֵת֙ שָׂרַ֣י כַּלָּת֔/וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑/וֹ וַ/יֵּצְא֨וּ אִתָּ֜/ם מֵ/א֣וּר כַּשְׂדִּ֗ים לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֥אוּ עַד חָרָ֖ן וַ/יֵּ֥שְׁבוּ שָֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/031.yaml
  text: Terah took Abram his son[a], Lot the son of Haran, his grandson, and Sarai his daughter-in-law, the wife of Abram his son, and they set out together from Ur of the Chaldeans to go to the land of Canaan[c][b]. But when they came as far as Haran, they settled there.
translation:
  language: ja
  text: テラは、息子アブラム、息子ハランの子である孫ロト[a]、そして自分の息子アブラムの妻サライを連れ、彼らは一緒に[b]カルデア人のウルを出て、カナンの地へ向かった。彼らはハランまで来ると、そこに住んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ハランの子ロト、彼の息子の子」。ここでの「彼の息子」はテラの息子を指し、ロトがテラの孫であることを示す。
    reason: lexical_alternative
  - marker: b
    text: 「彼らは一緒に……出て」の箇所は、ヘブライ語では直訳すると「彼らは彼らと……出た」となる。
    reason: textual_crux
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 連れ
  rationale: 基本義「取る」を移住の文脈に即して自然な日本語の「連れる」とした。テラが家族を伴ったことを明確に表す。
- source_word: לוֹט בֶּן הָרָן בֶּן בְּנוֹ
  choice: 息子ハランの子、すなわち自分の孫ロト
  rationale: 原文の「ハランの子、彼の息子の子」という関係を保ちつつ、現代日本語で明確にした。
- source_word: כַּלָּתוֹ
  choice: 嫁
  rationale: テラとの関係を表す「息子の妻」の意味。続く同格説明があるため、簡潔で自然な「嫁」とした。
- source_word: אֵשֶׁת אַבְרָם בְּנוֹ
  choice: すなわち息子アブラムの妻
  rationale: サライが誰の妻かを示す原文の同格説明を保持した。
- source_word: וַיֵּצְאוּ אִתָּם
  choice: 彼らは一緒に……出て
  rationale: マソラ本文は直訳すると「彼らは彼らと出た」となり、指示対象が重なるように見える難所である。「一緒に」は同行の意味を伝えながら、不自然な自己言及を避ける。
- source_word: מֵאוּר כַּשְׂדִּים
  choice: カルデア人のウルを
  rationale: 地名と民族名を現代日本語の慣用に従って表記した。移動動詞「出る」に合わせて起点を「を」で示した。
- source_word: לָלֶכֶת אַרְצָה כְּנַעַן
  choice: カナンの地へ向かった
  rationale: 不定詞と方向を示す語尾が表す目的地を、自然な移住表現で示した。
- source_word: וַיָּבֹאוּ עַד חָרָן
  choice: ハランまで来ると
  rationale: עַד の「〜まで」を保持し、後続節との時間的つながりを自然に示した。
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: そこに住んだ
  rationale: ישב の居住・定住の意味を、過度に解釈を加えない平明な日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。系譜上の関係は「すなわち」で整理し、原文の反復も残した。接続詞に原文にない強い逆接は加えず、出来事の順序を簡潔に示した。
