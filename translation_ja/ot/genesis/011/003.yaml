  text: וַ/יֹּאמְר֞וּ אִ֣ישׁ אֶל רֵעֵ֗/הוּ הָ֚בָ/ה נִלְבְּנָ֣ה לְבֵנִ֔ים וְ/נִשְׂרְפָ֖ה לִ/שְׂרֵפָ֑ה וַ/תְּהִ֨י לָ/הֶ֤ם הַ/לְּבֵנָה֙ לְ/אָ֔בֶן וְ/הַ֣/חֵמָ֔ר הָיָ֥ה לָ/הֶ֖ם לַ/חֹֽמֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/011/003.yaml
  text: And each man said to his neighbor[a], “Come, let us make bricks and burn them thoroughly.” And the brick served them for stone[b], and the bitumen served them for mortar.
translation:
  language: ja
  text: 彼らは互いに言った。「さあ、れんがを作り、よく焼こう。」こうして彼らには、れんがが石の代わりとなり、瀝青[a]が接合材の代わりとなった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「瀝青」は、建築の接合材として用いられた、天然のアスファルト状の物質。
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: 彼らは互いに言った
  rationale: 直訳的には「人がその仲間に言った」だが、分配的な慣用句であり、現代日本語では「彼らは互いに」が自然かつ正確。
- source_word: הָבָה
  choice: さあ
  rationale: 共同の行動を促す勧誘の小辞。古風さを避けつつ、呼びかけの力を保つ。
- source_word: נִלְבְּנָה לְבֵנִים
  choice: れんがを作り
  rationale: לבנ の名詞派生動詞は「れんがを作る」の意。日本語ではこの表現が明瞭で自然。
- source_word: וְנִשְׂרְפָה לִשְׂרֵפָה
  choice: よく焼こう
  rationale: 同根語を重ねた強意を「よく」で表し、れんがを焼成する文脈に合う自然な日本語とした。
- source_word: וַתְּהִי לָהֶם הַלְּבֵנָה לְאָבֶן
  choice: 彼らには、れんがが石の代わりとなり
  rationale: היה + ל が示す材料上の代用関係を明示し、「石になった」という材質変化の誤解を避ける。
- source_word: הַחֵמָר
  choice: 瀝青
  rationale: 建築に用いる天然のビチューメン、アスファルト状のタールを指す。本文では簡潔で的確な「瀝青」を用い、脚注で説明する。
- source_word: לַחֹמֶר
  choice: しっくいの代わり
  rationale: חֹמֶר は粘土やモルタル状の接合材を指し得る。対句では通常の石造に用いる接合材との機能的代替が焦点なので、日本語で広く理解される「しっくい」を採用した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「れんが」「しっくい」は読みやすさを優先して平仮名とし、専門性のある「瀝青」には脚注を付した。原文の二つの材料の対比と「代わりとなる」という機能的代用関係を保持した。
