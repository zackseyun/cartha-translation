base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/023.yaml
  text: Joseph saw Ephraim’s children to the third generation[a]. Also[b], the children of Machir son of Manasseh were born on Joseph’s knees.
translation:
  language: ja
  text: ヨセフは、エフライムの子孫を三代目まで見た[a]。また、マナセの子マキルの子どもたちも、ヨセフの膝の上で生まれた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「見た」。ここでは、ヨセフがエフライムの子孫の三代目を見るまで生きた、という意味を含む。
    reason: lexical_alternative
  - marker: b
    text: 「膝の上で生まれた」はヘブライ語の表現で、その子どもたちを家族として認めたり受け入れたりしたこと、または特別に受け入れたことを示す可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見た
  rationale: 字義どおりの「見た」を保ちつつ、長寿の文脈では子孫の誕生と成長を見るまで生きたことを自然に含意する。
- source_word: לְאֶפְרַיִם בְּנֵי שִׁלֵּשִׁים
  choice: エフライムの三代目の子孫まで
  rationale: לְאֶפְרַיִםを系譜上の所属として訳し、בְּנֵי שִׁלֵּשִׁיםは世代の広がりを示す表現として、具体的な親族呼称に狭めず訳した。
- source_word: גַּם
  choice: また…も
  rationale: 前半に別の系譜的情報を付け加える並行的な追加を、自然な現代日本語で示す。
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: マナセの子マキルの子どもたち
  rationale: 系譜関係が明瞭になる日本語の語順とし、בְּנֵיはこの文脈で性別を不必要に限定しない「子どもたち」とした。
- source_word: יֻלְּדוּ
  choice: 生まれた
  rationale: ילדの受動形を、自然な日本語の出生表現で訳した。
- source_word: עַל בִּרְכֵּי יוֹסֵף
  choice: ヨセフの膝の上で
  rationale: 家族としての承認、受け入れ、特別な慈愛を含み得る文化的表現を解釈で置き換えず、具体的な像を本文に保持した。
theological_decisions:
- issue: 「ヨセフの膝の上で生まれた」が示す関係
  choice: 慣用表現を本文では字義的に保持する
  alternative: ヨセフが自分の子として認めた／家族として迎えた
  rationale: この表現は承認や受容を示す可能性があるが、その法的・神学的意味を一つに確定できないため、本文では曖昧さを残し、注で説明する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「三代目の子孫まで」により系譜上の範囲を自然に示し、「膝の上で」は原文の文化的な像と解釈上の幅を保持した。
