  text: וַ/יֹּ֧אמֶר אֲלֵ/הֶ֛ם יוֹסֵ֖ף אַל תִּירָ֑אוּ כִּ֛י הֲ/תַ֥חַת אֱלֹהִ֖ים אָֽנִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/019.yaml
  text: But Joseph said to them[a], “Do not fear, for am I in the place of God?”
translation:
  language: ja
  text: しかし、ヨセフは彼らに言った。「恐れてはいけません。私が神に代わる者なのでしょうか。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私が神の下にいるのでしょうか」。ヘブライ語の表現は、「神に代わってその立場に立つ」という意味にも、「神の下にある」という意味にも取り得ます。この文脈では前者が自然です。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: しかし、ヨセフは彼らに言った
  rationale: וַיֹּאמֶרは物語で標準的な「言った」、אֲלֵהֶםは話しかける相手を示す「彼らに」とした。文脈上の対照を自然な日本語で示すため、接続を「しかし」とした。
- source_word: אַל תִּירָאוּ
  choice: 恐れてはいけません
  rationale: 否定命令の力を保ちつつ、兄たちへの呼びかけとして自然で品位ある現代日本語にした。
- source_word: כִּי
  choice: （独立した次の文として表現）
  rationale: ここでは安心させる根拠を導くが、日本語では修辞疑問を続けることで理由関係が明瞭なため、「なぜなら」を明示せず自然に表現した。
- source_word: הֲתַחַת אֱלֹהִים אָנִי
  choice: 私が神に代わる者なのでしょうか
  rationale: תַחַת אֱלֹהִיםは文脈上、神の立場や権限を自ら占めることを指す慣用表現と判断した。「神に代わる者」は修辞疑問と代替の意味を自然に伝える。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、ここではイスラエルの唯一の神を指す通常の用法なので単数概念の「神」とした。
- source_word: אָנִי
  choice: 私が
  rationale: 独立人称代名詞の強調を、主格助詞「が」によって修辞疑問の焦点として保った。
theological_decisions:
- issue: 神の立場に関するヨセフの修辞疑問の意味
  choice: ヨセフは、自分が神に代わって裁きや報復を行う立場にはないと否定している。
  alternative: ヨセフが自分は神の下にあるのかと尋ねている。
  rationale: 兄たちが報復を恐れている文脈と、続く節で神の意図が語られることから、「神に代わる」が最も自然である。ただし、前置詞תַחַתの字義的な別解は脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会話には丁寧体を採用した。修辞疑問の緊張を保ち、神の裁きの権限について本文以上の教理的説明は加えていない。
