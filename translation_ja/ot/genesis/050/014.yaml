  text: וַ/יָּ֨שָׁב יוֹסֵ֤ף מִצְרַ֨יְמָ/ה֙ ה֣וּא וְ/אֶחָ֔י/ו וְ/כָל הָ/עֹלִ֥ים אִתּ֖/וֹ לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו אַחֲרֵ֖י קָבְר֥/וֹ אֶת אָבִֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/014.yaml
  text: Then Joseph returned to Egypt[a], he and his brothers and all who had gone up with him to bury his father[b], after he had buried his father.
translation:
  language: ja
  text: ヨセフは、父を葬った後、兄弟たちと、父を葬るためにヨセフとともに上って行った[a]すべての者とともに、エジプトへ帰った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 聖書では、エジプトからカナンへ向かうことを「上る」と表現することがある。
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: 帰った
  rationale: שׁוב は元いた場所へ戻ることを表し、物語の文脈では「帰った」が簡潔で自然である。
- source_word: מִצְרַיְמָה
  choice: エジプトへ
  rationale: 語末の方向を示す ה を、移動の到着方向を表す「へ」で訳した。
- source_word: הוּא וְאֶחָיו
  choice: 兄弟たち…とともに
  rationale: 独立代名詞 הוּא はヨセフを主語として際立たせ、続く者たちが同行したことを示す。日本語では主語を繰り返さず、同行表現に組み込むのが自然である。
- source_word: וְכָל הָעֹלִים אִתּוֹ
  choice: 彼と一緒に上って行ったすべての者
  rationale: 分詞 עֹלִים の「上る」という聖書特有の移動表現を保ちつつ、帰還より前の旅を指すため「上って行った」とした。
- source_word: לִקְבֹּר אֶת אָבִיו
  choice: 父を葬るために
  rationale: 前置詞 לְ を伴う不定詞の目的用法を明確に表した。
- source_word: אַחֲרֵי קָבְרוֹ אֶת אָבִיו
  choice: 父を葬った後
  rationale: אַחֲרֵי の時間的順序を自然に表現した。接尾辞の主体は文脈上ヨセフと理解できるため、日本語では主語を明示しなくても明瞭である。
