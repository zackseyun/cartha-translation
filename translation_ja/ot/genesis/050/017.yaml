  text: כֹּֽה תֹאמְר֣וּ לְ/יוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤י/ךָ וְ/חַטָּאתָ/ם֙ כִּי רָעָ֣ה גְמָל֔וּ/ךָ וְ/עַתָּה֙ שָׂ֣א נָ֔א לְ/פֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑י/ךָ וַ/יֵּ֥בְךְּ יוֹסֵ֖ף בְּ/דַבְּרָ֥/ם אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/017.yaml
  text: 'This is what you shall say to Joseph: ‘Please forgive the transgression of your brothers and their sin, because they repaid you with evil. And now, please forgive the transgression of the servants of the God of your father.’ And Joseph wept when they spoke to him.'
translation:
  language: ja
  text: 「ヨセフにこう言いなさい。『どうか、あなたの兄弟たちの背きと罪を赦してください。彼らはあなたに悪いことをしたのです。今、どうか、あなたの父の神に仕える者たちの背きを赦してください』」彼らが彼にこう語りかけたとき、ヨセフは泣いた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂא נָא
  choice: どうか……赦してください
  rationale: 字義は「どうか取り上げてください／負ってください」だが、罪過を目的語とする慣用表現として「赦す」を意味する。反復も保持した。
- source_word: פֶּשַׁע
  choice: 背き
  rationale: 単なる過失よりも、関係や権威に背く重大な違反を表すため。
- source_word: חַטָּאתָם
  choice: 罪
  rationale: 一般的な罪・過ちを指す語として、前の「背き」と並ぶ簡潔な訳語を採用した。
- source_word: כִּי רָעָה גְמָלוּךָ
  choice: 彼らはあなたに悪いことをしたのです
  rationale: גמל の「報いる／取り扱う」という含みを、日本語で不自然な「悪を報いた」とせず、行為の意味が明瞭になるよう表現した。כִּי は理由を示すものとして訳した。
- source_word: עַבְדֵי אֱלֹהֵי אָבִיךָ
  choice: あなたの父の神に仕える者たち
  rationale: 「僕たち」より現代日本語で自然でありつつ、神への奉仕・帰属を表す עבד の関係性を保った。
- source_word: בְּדַבְּרָם אֵלָיו
  choice: 彼らがこう語りかけると
  rationale: 複数主語を明示し、אֵלָיו の方向性を「語りかける」で自然に表した。
theological_decisions:
- issue: 「あなたの父の神に仕える者たち」の自己同定
  choice: 兄弟たちが神の僕であるとの主張を、そのまま引用内に保持した
  alternative: 「私たちはあなたの父の神の僕です」と説明的に展開する
  rationale: 原文は名詞句であり、赦しを求める根拠としての神への帰属を示すが、その真実性や神学的含意を訳文で判定しない。
- issue: ヨセフが泣いた理由
  choice: 理由を補わず、泣いたという事実だけを記した
  alternative: 悲しみ、安堵、感動などの理由を明示する
  rationale: 原文は涙の理由を特定しておらず、物語上の曖昧さを保持するため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、父の伝言としての引用構造と、二度の懇願を保った。人物名は日本語聖書で広く定着した「ヨセフ」とした。
