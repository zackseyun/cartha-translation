lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ連続法。日本語では文脈上の連続が明らかなため、不自然な接続語を足さずに表した。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として現代日本語で定着している表記を用いた。
- source_word: עֲלֵה
  choice: 上って行き
  rationale: עלהの方向的意味を保ち、エジプトからカナンへ向かう旅を単なる「行き」に平板化しないようにした。
- source_word: וּקְבֹר
  choice: 葬りなさい
  rationale: קברは埋葬することを表す。命令形を自然で品位ある現代日本語にした。
- source_word: אֶת אָבִיךָ
  choice: あなたの父を
  rationale: 目的語標識と二人称男性単数接尾辞を明確に反映した。
- source_word: כַּאֲשֶׁר
  choice: とおりに
  rationale: 比較・様態を示し、先の誓約に従って行うという関係を自然に表す。
- source_word: הִשְׁבִּיעֶךָ
  choice: あなたに誓わせた
  rationale: שׁבעのヒフィル形の使役的意味、すなわち父がヨセフに誓わせたことを明示した。
