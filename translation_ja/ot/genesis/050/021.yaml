  text: So now[a], do not be afraid. I myself will provide for you and your little ones.” Thus he comforted them and spoke to their hearts.
translation:
  language: ja
  text: だから今、恐れてはならない。私自身が、あなたがたとあなたがたの幼い子どもたちを養う。」こうしてヨセフは彼らを慰め、彼らの心に語りかけた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らに優しく語りかけた」「彼らを安心させるように語った」。直訳「彼らの心に語った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: だから今
  rationale: 接続詞と時の副詞を、ヨセフの結論的な励ましへ自然につなぐ現代日本語で表した。
- source_word: אַל תִּירָאוּ
  choice: 恐れてはならない
  rationale: 否定の命令・勧告としての力を保ちつつ、 dignifiedで明瞭な表現とした。
- source_word: אָנֹכִי
  choice: 私が
  rationale: 独立人称代名詞の強調を、主格助詞「が」によって自然に示した。
- source_word: אֲכַלְכֵּל
  choice: 養おう
  rationale: 食物を含め、継続的に扶養し生活を支える意味を簡潔に表す。意志形によりヨセフ本人の約束を示した。
- source_word: טַפְּכֶם
  choice: あなたがたの幼い子どもたち
  rationale: 小さな子どもを指す語の年齢的・家族的な含みを明示した。
- source_word: וַיְנַחֵם אֹתָם
  choice: こうしてヨセフは彼らを慰め
  rationale: 文脈上の主語を日本語で明確にし、נחם の慰め励ます意味を保った。
- source_word: וַיְדַבֵּר עַל לִבָּם
  choice: 心に語りかけた
  rationale: ヘブライ語の「彼らの心に語った」という比喩を保ちながら、自然な日本語にした。
