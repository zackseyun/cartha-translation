source:
  edition: WLC
  text: וַ/יַּ֥עַל יוֹסֵ֖ף לִ/קְבֹּ֣ר אֶת אָבִ֑י/ו וַ/יַּֽעֲל֨וּ אִתּ֜/וֹ כָּל עַבְדֵ֤י פַרְעֹה֙ זִקְנֵ֣י בֵית֔/וֹ וְ/כֹ֖ל זִקְנֵ֥י אֶֽרֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/007.yaml
  text: So Joseph went up to bury his father[a], and with him went up all Pharaoh’s servants, the elders of his household, and all the elders of the land of Egypt.
translation:
  language: ja
  text: そこでヨセフは父を葬るために上って行った[a]。彼とともに、ファラオのすべての家臣、ファラオの宮廷の長老たち、エジプト全土のすべての長老たちも上って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「上って行った」は、エジプトからカナンへの旅を表すヘブライ語の慣用的な言い方。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上って行った
  rationale: עָלָהの基本的な方向性を保ち、エジプトからカナンへの移動を表すヘブライ語の地理的慣用を反映した。
- source_word: לִקְבֹּר
  choice: 葬るために
  rationale: קָבַרの意味を自然で簡潔な現代日本語にした。埋葬の行為を明確に表す。
- source_word: אָבִיו
  choice: 父
  rationale: 三人称所有接尾辞は日本語の文脈から明らかなため、不自然な「彼の父」を避けた。
- source_word: וַיַּעֲלוּ אִתּוֹ
  choice: 彼とともに……も上って行った
  rationale: 同行を示すאִתּוֹと、前半から反復されるעָלָהをともに保持し、原文の叙述のリズムを伝えた。
- source_word: כָּל עַבְדֵי פַרְעֹה
  choice: ファラオのすべての家臣
  rationale: עֶבֶדは僕、奴隷、臣下などを指し得るが、王宮の文脈では役職を過度に限定しない「家臣」が自然である。
- source_word: זִקְנֵי בֵיתוֹ
  choice: 王家の長老たち
  rationale: בֵיתוֹの指示対象は直前のファラオである。「王家」は王の家・宮廷組織を自然に表し、זִקְנֵיは「長老たち」として保持した。
- source_word: וְכֹל זִקְנֵי אֶרֶץ מִצְרָיִם
  choice: またエジプトの国のすべての長老たち
  rationale: זִקְנֵיとאֶרֶץをそれぞれ「長老たち」「国」として明示し、王家を越えたエジプト全体の指導層を示す表現を保った。
