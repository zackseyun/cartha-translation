revisions:
- from: 父は私に誓わせて、こう言いました。『私はもう死ぬ。カナンの地に自分のために掘った墓に、私を葬ってくれ。』ですから今、どうか私に父を葬りに行かせてください。その後、私は戻ってまいります。
  to: 父は私に誓わせて、こう言いました。『私はもう死ぬ。カナンの地に自分のために掘った墓に、そこに私を葬ってくれ。』ですから今、どうかカナンへ上って、父を葬りに行かせてください。その後、私は戻ってまいります。
  rationale: 原文の埋葬場所を再指示する「そこに」と、カナンへの移動を示す「上って」を補った。その他の表現は、原文の使役・埋葬命令・帰還の約束を自然な現代日本語で保っているため維持した。
