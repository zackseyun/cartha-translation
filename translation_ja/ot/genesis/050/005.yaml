review_pass:
  verdict: revise
  source_fidelity: 「שָׁמָּה（そこに）」と、カナンへ向かう移動を表す「אֶעֱלֶה（上って行く）」を明示する必要がある。墓を「掘った」とする訳、父がヨセフに誓わせたこと、葬儀後に戻る約束は原文に忠実である。
  naturalness: 全体として明瞭な現代標準日本語であり、ファラオに対する願いとしての丁寧さも適切である。「カナンへ上って、父を葬りに行かせてください」とすれば、原文の方向表現を保ちながら自然に読める。
  terminology: 「カナン」「葬る」「墓」は適切である。「戻ってまいります」は相手への敬意を表す発話として自然であり、神学用語上の問題はない。
  issues:
  - severity: medium
    issue: שָׁמָּה（「そこに」）が明示されていない。
    rationale: 原文は「カナンの地で自分のために掘った墓に、そこへ私を葬れ」と、埋葬場所を改めて指示する。日本語でも「そこに」を補うことでこの反復的強調を保持できる。
  - severity: medium
    issue: אֶעֱלֶה（「上って行く」）の方向表現が落ちている。
    rationale: 「父を葬りに行かせてください」だけでも意味は通るが、原文および英語監査訳の「go up」にあるカナンへの上行表現が訳出されていない。「カナンへ上って」とすれば、自然さを損なわず保持できる。
  revised_text: 父は私に誓わせて、こう言いました。『私はもう死ぬ。カナンの地に自分のために掘った墓に、そこに私を葬ってくれ。』ですから今、どうかカナンへ上って、父を葬りに行かせてください。その後、私は戻ってまいります。
