base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/005.yaml
  text: My father made me swear, saying, ‘Look, I am dying. In my grave that I dug for myself in the land of Canaan, there you shall bury me.’ So now, please let me go up and bury my father; then I will return.
translation:
  language: ja
  text: 父は私に誓わせて、こう言いました。『私はもう死ぬ。カナンの地に自分のために掘った墓に、そこに私を葬ってくれ。』ですから今、どうかカナンへ上って、父を葬りに行かせてください。その後、私は戻ってまいります。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשְׁבִּיעַנִי
  choice: 私に誓わせて
  rationale: 使役形の意味を明確に保ち、父がヨセフに誓いを立てさせたことを自然な現代日本語で表した。
- source_word: הִנֵּה אָנֹכִי מֵת
  choice: 私はもう死ぬ
  rationale: הִנֵּה は目前性・注意喚起を伴うが、日本語では「もう」によって迫る死のニュアンスを自然に示した。
- source_word: כָּרִיתִי
  choice: 掘った
  rationale: 墓について用いられた動詞の基本的意味を採用した。文脈上「自分のために用意した」と解する余地はあるが、具体的な原語表現を保持した。
- source_word: אֶעֱלֶה נָּא
  choice: どうか私に…行かせてください
  rationale: 直訳の「上って行く」はカナンへの移動を表す慣用的方向表現であり、現代日本語では許可を願う文脈を明示して自然に訳した。
- source_word: וְאָשׁוּבָה
  choice: その後、私は戻ってまいります
  rationale: ファラオへの敬意を示す発話として丁寧語を用い、帰還の約束を明確にした。
