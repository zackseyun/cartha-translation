base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/009.yaml
  text: Chariots and horsemen also went up with him[c][b][a], and the company became very large.
translation:
  language: ja
  text: 戦車隊も騎兵も彼とともに上って行った。そしてその一行は非常に大規模であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その陣営は非常に重かった」。ここで「重い」は、その集団が大規模で堂々としていたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: 上って行った
  rationale: עלהの基本的な移動方向を保ちつつ、物語中の旅として自然な日本語にした。主語は後続する戦車隊と騎兵である。
- source_word: גַּם רֶכֶב גַּם פָּרָשִׁים
  choice: 戦車隊も騎兵も
  rationale: 反復されるגַּםを「も……も」で表した。単数形רֶכֶבは集合的に戦車部隊を指すため、「戦車隊」とした。פָּרָשִׁיםはこの文脈では明瞭な「騎兵」とした。
- source_word: עִמּוֹ
  choice: 彼とともに
  rationale: 文脈上の指示対象であるヨセフを、原文どおり代名詞で表した。
- source_word: הַמַּחֲנֶה
  choice: その一行
  rationale: 基本義は「陣営」だが、ここでは葬送の旅に加わった集団全体を指す。「一行」は移動中の集団という文脈を自然に伝える。
- source_word: כָּבֵד מְאֹד
  choice: 非常に大規模であった
  rationale: 字義的には「非常に重かった」だが、集団については規模が大きく堂々としていることを表す。「大規模」は中心的意味を明瞭に伝える。וַיְהִיはここでは状態変化を明示せず「であった」とした。
theological_decisions: []
