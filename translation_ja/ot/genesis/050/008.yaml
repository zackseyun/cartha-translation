id: GEN.50.8
reference: Genesis 50:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כֹל֙ בֵּ֣ית יוֹסֵ֔ף וְ/אֶחָ֖י/ו וּ/בֵ֣ית אָבִ֑י/ו רַ֗ק טַפָּ/ם֙ וְ/צֹאנָ֣/ם וּ/בְקָרָ֔/ם עָזְב֖וּ בְּ/אֶ֥רֶץ גֹּֽשֶׁן׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/008.yaml
  text: and all the household of Joseph[a], and his brothers, and his father's household; only their little ones, their flocks[c][b], and their herds they left in the land of Goshen.
translation:
  language: ja
  text: また、ヨセフの家の者すべて[a]と、彼の兄弟たち、父の家の者たちも同行した。ただし、幼い子どもたちと、羊や山羊の群れ、牛の群れは、ゴシェンの地に残した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家の者」と訳した語は、建物としての家ではなく、家族や家人から成る一つの家の共同体を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: また、……すべて
  rationale: 接続詞は前節の同行者の列挙を継続し、כֹּל の全体性を「すべて」で表した。
- source_word: בֵּית יוֹסֵף
  choice: ヨセフの家の者
  rationale: בַּיִת はここでは建物ではなく、ヨセフに属する家族・家人から成る家の共同体を指す。
- source_word: וְאֶחָיו
  choice: 彼の兄弟たち
  rationale: 複数形 אָח はこの文脈ではヨセフの男性のきょうだいたちを指す。
- source_word: וּבֵית אָבִיו
  choice: 父の家の者たち
  rationale: 物理的な家屋ではなく、父ヤコブに属する家族・家人を表す。
- source_word: רַק
  choice: ただし
  rationale: 同行者全体に対する例外を導入する機能を、自然な日本語で示した。
- source_word: טַפָּם
  choice: 幼い子どもたち
  rationale: טַף は特に年少の子どもたちを指し、単なる「子ども」より原語のニュアンスを明示する。
- source_word: וְצֹאנָם
  choice: 羊や山羊の群れ
  rationale: צֹאן は羊と山羊を中心とする小家畜の集合を指すため、日本語では内容を明示した。
- source_word: וּבְקָרָם
  choice: 牛の群れ
  rationale: בָּקָר は大型家畜、とりわけ牛の集合を指す。
- source_word: עָזְבוּ
  choice: 残した
  rationale: 意図的にその地にとどめ置いた意味であり、「置き去りにした」ほど否定的な含みを持たせない。
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ゴシェンの地に
  rationale: אֶרֶץ を省かず、地理的領域であることを示した。
theological_decisions: []
