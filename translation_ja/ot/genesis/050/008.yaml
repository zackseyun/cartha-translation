  register: 明瞭で現代的な標準語を用いた。前節から続くヘブライ語の列挙を日本語で独立して読めるよう、「同行した」を文脈上補った。「羊や山羊の群れ」と「牛の群れ」によって、小家畜と大型家畜の区別を自然に示した。
