source:
  edition: WLC
  text: וַ/יַּ֡רְא יוֹשֵׁב֩ הָ/אָ֨רֶץ הַֽ/כְּנַעֲנִ֜י אֶת הָ/אֵ֗בֶל בְּ/גֹ֨רֶן֙ הָֽאָטָ֔ד וַ/יֹּ֣אמְר֔וּ אֵֽבֶל כָּבֵ֥ד זֶ֖ה לְ/מִצְרָ֑יִם עַל כֵּ֞ן קָרָ֤א שְׁמָ/הּ֙ אָבֵ֣ל מִצְרַ֔יִם אֲשֶׁ֖ר בְּ/עֵ֥בֶר הַ/יַּרְדֵּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/011.yaml
  text: When the inhabitants of the land[a], the Canaanites, saw the mourning at the threshing floor of Atad, they said, “This is a grievous mourning for the Egyptians.” Therefore its name was called Abel-mizraim[c][b], which is beyond the Jordan.
translation:
  language: ja
  text: その地の住民であるカナン人たちは、アタドの脱穀場での嘆きを見て、「これはエジプト人たちの実に激しい嘆きだ」と言った。それで、その場所はヨルダン川の向こう側にあるアベル・ミツライム[a][b]と呼ばれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アベル・ミツライム」は「エジプトの嘆き」を思わせる名で、カナン人たちがこの出来事を言い表した言葉と響き合っている。
    reason: 地名に込められたヘブライ語の語呂合わせは、日本語の音写だけでは伝わらないため。
  - marker: b
    text: 別訳「ヨルダン川の対岸」。この表現がどちら側を指すかは、語り手の地理的な視点によって異なる。
    reason: 原語の地理表現が視点に依存する曖昧さを持つため。
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַכְּנַעֲנִי
  choice: その地の住民であるカナン人たち
  rationale: 単数形の分詞を集合的に取り、後続の「カナン人」を同格的な説明として保ちつつ、自然な現代日本語にした。
- source_word: הָאֵבֶל
  choice: 嘆き
  rationale: 死者を悼む行為と悲嘆の双方を表す文脈であり、後の地名との語呂合わせも注で示せるため。
- source_word: בְּגֹרֶן הָאָטָד
  choice: アタドの打ち場で
  rationale: גֹּרֶןを穀物を打つ場所である「打ち場」とし、בְּは場所を示す「で」と訳した。
- source_word: אֵבֶל כָּבֵד
  choice: 実に激しい嘆き
  rationale: כָּבֵדの字義は「重い」だが、ここでは嘆きの強さ・重大さを表す。「激しい」により自然な日本語でその強度を伝え、「実に」で強調を補った。
- source_word: לְמִצְרָיִם
  choice: エジプト人たちの
  rationale: 形は地名「エジプト」だが、文脈では葬列をなすエジプト側の人々に属する嘆きを指すため、「エジプト人たちの」とした。
- source_word: עַל כֵּן
  choice: それで
  rationale: 命名の理由を導く因果表現として、明快で自然な現代日本語を用いた。
- source_word: קָרָא שְׁמָהּ
  choice: その場所は…と呼ばれた
  rationale: ヘブライ語の命名定型句を自然な受動表現にし、明示されていない命名者を補わないようにした。女性単数接尾辞が指す場所を文脈上明示した。
- source_word: אָבֵל מִצְרַיִם
  choice: アベル・ミツライム
  rationale: 地名として音写し、אֵבֶל（嘆き）とמִצְרַיִם（エジプト）による語呂合わせと意味は脚注に示した。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ヨルダン川の向こう側
  rationale: 川を基準とする反対側を表す。観察地点によってどちら側かが変わる原文の視点依存性を保った。
theological_decisions: []
