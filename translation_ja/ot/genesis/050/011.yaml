  to: その地の住民であるカナン人たちは、アタドの脱穀場での嘆きを見て、「これはエジプト人たちの実に激しい嘆きだ」と言った。それで、その場所はヨルダン川の向こう側にあるアベル・ミツライム[a][b]と呼ばれた。
