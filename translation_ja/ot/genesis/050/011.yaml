  register: 明快で格調を失わない現代標準日本語。「打ち場」は古代の農作業場所を簡潔に示す聖書文脈上の語として採用した。引用部はカナン人の驚きが伝わる自然な口調にし、地名と地理表現の説明は脚注に限定した。
