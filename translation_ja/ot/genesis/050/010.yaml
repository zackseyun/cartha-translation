source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ עַד גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן וַ/יִּ֨סְפְּדוּ שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְ/כָבֵ֖ד מְאֹ֑ד וַ/יַּ֧עַשׂ לְ/אָבִ֛י/ו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/010.yaml
  text: When they came to the threshing floor of Atad[a], which is beyond the Jordan, they lamented there with a very great and grievous lamentation[e][d][c][b], and he observed seven days of mourning for his father.
translation:
  language: ja
  text: 彼らは、ヨルダン川の向こう側にあるアタド[a]の脱穀場[b]まで来ると、そこで非常に大きく激しい嘆きをした[c]。そして彼は、父のために七日間、喪に服した[d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アタド」は「いばら」または「とげのある低木」という意味の語である可能性があるが、ここでは地名として用いられている。
    reason: lexical_alternative
  - marker: b
    text: 「ヨルダン川を渡った所」または「ヨルダン川の反対側」とも訳せる。原文だけでは、ここで想定されている方角は明示されていない。
    reason: alternative_reading
  - marker: c
    text: 直訳に近くは「非常に大きく重い嘆きをした」。激しい服喪を表すヘブライ語の強い表現。
    reason: cultural_note
  - marker: d
    text: 原文の動詞は単数形で、「彼は喪に服した」となる。文脈上はヨセフを指す可能性が高いが、一行全体を指すものとして「彼らは」と訳す場合もある。
    reason: alternative_reading
lexical_decisions:
- source_word: גֹּרֶן
  choice: 脱穀場
  rationale: 穀物を脱穀する場所を指す標準的な語義を、現代日本語で明瞭に表した。
- source_word: הָאָטָד
  choice: アタド
  rationale: ここでは「脱穀場」を限定する地名として機能するため音写し、語そのものが持ち得る意味は脚注に示した。
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: ヨルダン川の向こう側
  rationale: 話者の位置から見た川の反対側を表すヘブライ語の表現を保ち、具体的な東西は本文で確定しない。
- source_word: וַיִּסְפְּדוּ
  choice: 嘆きの声を上げた
  rationale: 死者を公に悼む哀歌・哀哭の意味合いを、自然な現代日本語で表した。
- source_word: מִסְפֵּד גָּדוֹל וְכָבֵד מְאֹד
  choice: 非常に大きく痛切な嘆き
  rationale: 「大きい」と「重い」を重ねる強意を保ちつつ、「重い」はこの文脈に自然な「痛切な」とした。
- source_word: וַיַּעַשׂ ... אֵבֶל
  choice: 喪に服した
  rationale: 字義的には「喪を行った」だが、一定期間の正式な服喪を表す日本語の慣用表現を用いた。
- source_word: שִׁבְעַת יָמִים
  choice: 七日間
  rationale: 服喪の期間を明瞭かつ自然に示した。
theological_decisions:
- issue: 複数形の動詞に続く וַיַּעַשׂ の単数主語
  choice: 本文では「彼は」と単数を保持する
  alternative: 文脈上の一行全体を指すものとして「彼らは」とする
  rationale: マソラ本文は「来た」「嘆いた」では複数形を用いた後、「喪に服した」に当たる動詞を男性単数形に切り替えている。ヨセフを指す可能性が高いが、名前を本文に補わず、原文の単数と指示の余地を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語とした。「哀悼した」よりも葬送時の公の嘆きを伝える「嘆きの声を上げた」を選び、最後の節では原文の複数から単数への移行を保持した。
