source:
  edition: WLC
  text: וַ/יֵּ֤שֶׁב יוֹסֵף֙ בְּ/מִצְרַ֔יִם ה֖וּא וּ/בֵ֣ית אָבִ֑י/ו וַ/יְחִ֣י יוֹסֵ֔ף מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/022.yaml
  text: Joseph remained in Egypt[a], he and his father's household, and Joseph lived 110 years.
translation:
  language: ja
  text: ヨセフは、父の家の者たちとともにエジプトに住み続けた。そしてヨセフは百十年生きた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住み続けた
  rationale: ישׁבには「座る、住む、とどまる」の意味がある。ここではヤコブの死後もエジプトでの居住が続いたことを表し、後半のוַיְחִי「生きた」とも訳し分けられる。
- source_word: בְּמִצְרַיִם
  choice: エジプトに
  rationale: 居住する場所を示す自然な日本語の助詞「に」で表した。
- source_word: הוּא וּבֵית אָבִיו
  choice: 父の家の者たちとともに
  rationale: בֵּית אָבִיוは建物としての家ではなく、父に属する家族・家の集団を指す。「父の家の者たち」はその社会的な広がりを保ちつつ、現代日本語で明瞭である。独立代名詞הוּאは、主語ヨセフを再度代名詞で強調するより「とともに」の構文に自然に組み込んだ。
- source_word: וַיְחִי
  choice: 生きた
  rationale: ここではヨセフの生涯の年数を述べるため、「生きた」が自然であり、原文の基本的な意味を保つ。
- source_word: מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 百十年
  rationale: 年齢を示す正確な数値を、聖書本文にふさわしい読みやすい漢数字で表した。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、簡潔で品位ある物語文とした。「住み続けた」によってヤコブの死後も続く居住を示し、「生きた」との語義上の区別を保った。原文の「彼と父の家」を逐語的に不自然な形で残さず、「父の家の者たちとともに」とした。
