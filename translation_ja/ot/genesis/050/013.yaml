base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/013.yaml
  text: His sons carried him to the land of Canaan and buried him in the cave of the field of Machpelah[a], which Abraham had bought with the field as a burial property from Ephron the Hittite[c][b], opposite Mamre.
translation:
  language: ja
  text: その息子たちは彼をカナンの地へ運び、マクペラの畑にある洞窟に葬った。その洞窟のある畑は、アブラハムが埋葬用の所有地として[a]、ヘト人エフロンから買い取ったもので、マムレの向かいにあった[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「埋葬のための所有地として」。アブラハムがその畑を埋葬のための保有地として取得したことを表す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「マムレに面して」。マムレを基準とした位置関係を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֹתוֹ בָנָיו
  choice: その息子たちは彼を……運び
  rationale: נשׂא はこの文脈では遺体を実際に運ぶことを表す。「息子たち」と男性複数を明示し、目的語も原文どおり保持した。
- source_word: אַרְצָה כְּנַעַן
  choice: カナンの地へ
  rationale: 方向を示す語尾と אֶרֶץ の意味をともに反映し、自然な現代日本語にした。
- source_word: בִּמְעָרַת שְׂדֵה הַמַּכְפֵּלָה
  choice: マクペラの畑にある洞窟に
  rationale: 連語が示す洞窟と畑の関係を、日本語で誤解なく読める形にした。「マクペラ」が洞窟だけの名称であると限定しない。
- source_word: אֲשֶׁר קָנָה אַבְרָהָם אֶת הַשָּׂדֶה
  choice: その洞窟のある畑は、アブラハムが……買い取ったもの
  rationale: אֶת הַשָּׂדֶה により購入対象が明示的に「畑」であることを反映した。ヘブライ語の再述的な関係節を、自然な日本語の独立文に組み替えた。
- source_word: לַאֲחֻזַּת קֶבֶר
  choice: 墓地として所有するため
  rationale: אֲחֻזָּה の所有地・恒久的保有地という含意と、קֶבֶר の埋葬目的をともに伝える。
- source_word: מֵאֵת עֶפְרֹן הַחִתִּי
  choice: ヘト人エフロンから
  rationale: 民族名 חִתִּי には日本語聖書で広く理解される「ヘト人」を用い、売り手を明示した。
- source_word: עַל פְּנֵי מַמְרֵא
  choice: マムレの向かいに
  rationale: 位置関係を示す表現として「向かいに」を採用し、単なる近接を意味する「近く」とはしなかった。
theological_decisions: []
