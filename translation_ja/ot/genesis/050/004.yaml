  text: וַ/יַּֽעַבְרוּ֙ יְמֵ֣י בְכִית֔/וֹ וַ/יְדַבֵּ֣ר יוֹסֵ֔ף אֶל בֵּ֥ית פַּרְעֹ֖ה לֵ/אמֹ֑ר אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵ֣ינֵי/כֶ֔ם דַּבְּרוּ נָ֕א בְּ/אָזְנֵ֥י פַרְעֹ֖ה לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/004.yaml
  text: When the days of his mourning had passed[a], Joseph spoke to Pharaoh’s household, saying, “If I have now found favor in your eyes, please speak in Pharaoh’s hearing[b], saying,”
translation:
  language: ja
  text: 彼のために泣く日々が過ぎると[a]、ヨセフはファラオの家の者たちに言った。「もし私があなたがたの好意を得ているのであれば、どうかファラオの耳に入るよう、次のように伝えてください[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼の服喪の日々が終わると」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「ファラオの耳に、こう言ってください」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: 過ぎると
  rationale: 時間が経過して一区切りついたことを表す。続いてヨセフが語ったという物語の順序も自然に示す。
- source_word: יְמֵי בְכִיתוֹ
  choice: 彼のために泣く日々
  rationale: בְּכִי の具体的な「泣くこと」を保ち、接尾辞が文脈上、死んだヤコブを指す可能性を明示する。「服喪の日々」も可能。
- source_word: אֶל־בֵּית פַּרְעֹה
  choice: ファラオの家の者たちに
  rationale: בֵּית は建物ではなく王家・宮廷に属する人々を指すため、日本語で人物集団だと明確にした。
- source_word: אִם־נָא מָצָאתִי חֵן בְּעֵינֵיכֶם
  choice: もし私があなたがたの好意を得ているのであれば
  rationale: 「目に恵みを見いだす」というヘブライ語の慣用句を、丁重さを保った自然な現代日本語にした。נָא の懇願の調子は文全体と後続の「どうか」に反映した。
- source_word: דַּבְּרוּ־נָא
  choice: どうか……伝えてください
  rationale: 複数相手への命令と懇願の助詞 נָא を、丁重な依頼として表した。「語ってください」より、仲介して伝言する文脈に適する。
- source_word: בְּאָזְנֵי פַרְעֹה
  choice: ファラオの耳に入るよう
  rationale: 直訳的な身体表現を生かしつつ、「ファラオに聞こえるように／聞いてもらえるように」という慣用的意味が通じる表現とした。
- source_word: לֵאמֹר
  choice: こう伝えてください
  rationale: 後続する伝言内容を導入する引用標識。節が次節へ続くことを自然な日本語で示した。
