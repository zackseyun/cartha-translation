lexical_decisions:
- source_word: וַיְצַוּוּ
  choice: 言づてを送り
  rationale: 通常は「命じる」を意味するが、ここでは אֶל יוֹסֵף と引用導入が続き、兄弟たちがヨセフに命令したというより、使者を介して言葉を伝えた文脈と解するのが自然。「言づてを送る」は伝達行為を明確にする。語義上の直訳は脚注に残した。
- source_word: אֶל יוֹסֵף
  choice: ヨセフに
  rationale: 伝達の受け手を示す方向前置詞を、自然な日本語の助詞「に」で表した。
- source_word: לֵאמֹר（第一例）
  choice: こう言った
  rationale: 報告された発話を導入する機能を、現代日本語の自然な物語表現で示した。
- source_word: אָבִיךָ
  choice: あなたの父上
  rationale: ヨセフに向けた二人称所有を保持し、伝言内の直接話法にふさわしい敬意を「父上」で表した。
- source_word: צִוָּה
  choice: 命じられました
  rationale: 基本義「命じる」を保ち、父に対する敬語として尊敬表現を用いた。命令の内容は次節に続く。
- source_word: לִפְנֵי מוֹתוֹ
  choice: 亡くなる前に
  rationale: 時間的な意味を自然な現代日本語で表し、父への敬意を伴う「亡くなる」を選んだ。
- source_word: לֵאמֹר（第二例）
  choice: こう
  rationale: 次節に命令内容が続くことを示す発話導入。日本語では「こう命じられました」とすることで、ヘブライ語の第二の לֵאמֹר の機能を自然に保持した。
