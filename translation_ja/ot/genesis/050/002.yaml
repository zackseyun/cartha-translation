  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְצַ֨ו יוֹסֵ֤ף אֶת עֲבָדָי/ו֙ אֶת הָ/רֹ֣פְאִ֔ים לַ/חֲנֹ֖ט אֶת אָבִ֑י/ו וַ/יַּחַנְט֥וּ הָ/רֹפְאִ֖ים אֶת יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/002.yaml
  text: Then Joseph commanded his servants[a], the physicians, to embalm his father[b], and the physicians embalmed Israel.
translation:
  language: ja
  text: そこでヨセフは、自分に仕える者たち[a]、すなわち医師たちに、父の遺体に防腐処置を施すよう命じた。医師たちはイスラエル[b]の遺体に防腐処置を施した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分の奴隷たち」とも訳せる。ヘブライ語は、文脈により奴隷または仕える者を指す。
    reason: lexical_alternative
  - marker: b
    text: イスラエルとは、ヤコブのこと。
    reason: name_clarification
lexical_decisions:
- source_word: וַיְצַו
  choice: 命じた
  rationale: 権威をもって指示する צוה の語勢を自然な現代日本語で保つ。
- source_word: עֲבָדָיו
  choice: 自分に仕える者たち
  rationale: עבד は文脈により奴隷または僕・使用人を指し得る。ここでは医師として仕える者たちの役割が前面に出ているため、身分を断定しない表現とした。
- source_word: הָרֹפְאִים
  choice: 医師たち
  rationale: רפא に由来し、治療を職務とする者を表す。古代宮廷の文脈にも合う明瞭な訳語である。
- source_word: לַחֲנֹט / וַיַּחַנְטוּ
  choice: 遺体を防腐処置する／した
  rationale: エジプトの葬送慣行における遺体保存処置を指す。日本語では「防腐処置」が明瞭で、「ミイラにする」より原文の表現範囲を不必要に狭めない。
- source_word: אָבִיו
  choice: 父の遺体
  rationale: 直訳は「彼の父」だが、防腐処置の対象であることを自然かつ明瞭に示すため「遺体」を補った。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 原文がヤコブではなくイスラエルという名を明示しているため、その名称選択を保った。
theological_decisions:
- issue: עבד の社会的身分を訳語でどこまで明示するか
  choice: 自分に仕える者たち
  alternative: 自分の奴隷たち／自分の僕たち
  rationale: この箇所では彼らの法的身分より、ヨセフに属して仕え、医師の役割を担うことが焦点である。曖昧さを保ちつつ機能を自然に表した。
- issue: יִשְׂרָאֵל をヤコブと説明的に置き換えるか
  choice: 本文ではイスラエルを保持する
  alternative: ヤコブ
  rationale: 原文の固有名詞の選択には物語上の意味があり得るため、調和させずそのまま訳した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「防腐処置」を用いて古代エジプトの遺体保存を自然に示し、原文にない専門的詳細は加えない。脚注記号は該当箇所に配置した。
