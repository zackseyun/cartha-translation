translation:
  language: ja
  text: ヨセフは父の顔の上に倒れ伏し、父の上で泣き、父に口づけした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: 身を伏せ
  rationale: נפל の身体的な動きを保ちつつ、この場面で父の遺体の上に身をかがめる動作として自然な現代日本語にした。
- source_word: עַל־פְּנֵי אָבִיו
  choice: 父の顔の上に
  rationale: 原文の具体的で鮮明な「父の顔の上に」という像を保持した。日本語では直訳調の緊張が残るが、身を伏せる動詞との組み合わせで意味を理解できる。
- source_word: וַיֵּבְךְּ עָלָיו
  choice: 父を思って泣き
  rationale: בכה は「泣く」。עַל はここで死者を悼んで泣く関係を示すため、「父を思って」とし、単なる身体的位置に限定しない自然な表現にした。
- source_word: וַיִּשַּׁק־לוֹ
  choice: その口づけをした
  rationale: נשק の「口づけする」を荘重で自然な表現にした。לוֹ の対象は父であることが文脈上明らかである。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
