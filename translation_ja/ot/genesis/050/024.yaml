review_pass:
  verdict: revise
  source_fidelity: 全体としてヘブライ語の構文と意味をよく反映している。「必ず」はפָּקֹד יִפְקֹדの強調を表し、「顧みる」はこの文脈での神の決定的な配慮・介入という含意を過度に限定せずに伝える。「連れ上る」もהֶעֱלָהの方向性を保つ。ただし、原文では「神」が「誓う」の主語でもあるため、日本語本文でも明示するのが適切である。
  naturalness: 現行文は理解可能だが、「この地から、アブラハムに、イサクに、ヤコブに誓われた地へ、あなたがたを」の連続した読点と受け身表現は係り先が分かりにくく、目的語の「あなたがた」も重複して響く。語順を整え、「神が誓った地」とすることで明瞭かつ自然になる。
  terminology: 「ヨセフ」「アブラハム」「イサク」「ヤコブ」は標準的である。「顧みる」はやや格調を帯びるが、明確な現代標準語として許容され、原語の意味幅にも適合する。神を主語とする文脈で「連れ上ってくださいます」という敬語も文体内で一貫している。
  issues:
  - severity: medium
    issue: 「アブラハムに、イサクに、ヤコブに誓われた地」が受け身となっており、誓った主体が本文上不明瞭である。
    rationale: נִשְׁבַּעは文脈上「神が誓った」であり、直前のוֵאלֹהִיםとも連続する。受け身自体は日本語として可能でも、列挙の助詞と読点が重なって修飾関係を読みにくくする。本文で「神が」を示しても、「与える」という原文にない目的内容を補うことにはならない。
  - severity: low
    issue: 「あなたがた」が「顧み」の目的語と「連れ上ってくださいます」の目的語として近接して反復され、文が重い。
    rationale: 日本語では後半の目的語を省略しても意味が明確であり、原文の意味内容を損なわずに読みやすくできる。
