  to: ヨセフは兄弟たちに言った。「私は間もなく死にます。しかし、神は必ずあなたがたを顧み[a]、この地から、アブラハムに、イサクに、ヤコブに神が誓った地へ連れ上ってくださいます。」
  rationale: 安全な明瞭化として、誓いの主語である「神」を本文に明示し、目的語の不要な反復を除いた。土地を「与える」という補足は加えていない。脚注は不定詞絶対形と未完了形による強調を踏まえ、「必ず訪れる」として日本語の文法を整えた。
