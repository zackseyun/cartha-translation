  text: וַ/יֹּ֤אמֶר יוֹסֵף֙ אֶל אֶחָ֔י/ו אָנֹכִ֖י מֵ֑ת וֵֽ/אלֹהִ֞ים פָּקֹ֧ד יִפְקֹ֣ד אֶתְ/כֶ֗ם וְ/הֶעֱלָ֤ה אֶתְ/כֶם֙ מִן הָ/אָ֣רֶץ הַ/זֹּ֔את אֶל הָ/אָ֕רֶץ אֲשֶׁ֥ר נִשְׁבַּ֛ע לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/024.yaml
  text: And Joseph said to his brothers[a], “I am dying, but God will surely visit you and bring you up from this land to the land that he swore to Abraham, to Isaac, and to Jacob.”
translation:
  language: ja
  text: ヨセフは兄弟たちに言った。「私は間もなく死にます。しかし、神は必ずあなたがたを顧み[a]、この地から、アブラハムに、イサクに、ヤコブに神が誓った地へ連れ上ってくださいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「必ずあなたがたを訪れる」。ここでのヘブライ語表現は、神がご自分の民に決定的に目を留め、そのために行動することを意味し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶחָיו
  choice: 兄弟たち
  rationale: 男性複数形に三人称男性単数の接尾辞が付き、創世記の文脈ではヨセフの男の兄弟たちを指すため。
- source_word: אָנֹכִי מֵת
  choice: 私は間もなく死にます
  rationale: 分詞表現が示す死の切迫を、現代日本語で自然かつ明確に表すため。
- source_word: פָּקֹד יִפְקֹד
  choice: 必ずあなたがたを顧み
  rationale: 同根の不定詞絶対形と未完了形による強調を「必ず」で示し、פחדではなく פקד の、民に目を留めて実際に介入するという広がりを「顧みる」に保った。
- source_word: וֵאלֹהִים
  choice: しかし、神は
  rationale: 接続詞が、死にゆくヨセフと今後も行動する神との対照を文脈上示すため。
- source_word: וְהֶעֱלָה אֶתְכֶם
  choice: あなたがたを連れ上ってくださいます
  rationale: עלה のヒフィル形が持つ「上らせる、連れ上る」という方向性を保ち、エジプトから約束の地への移動を表した。
- source_word: אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּע
  choice: 誓われた地へ
  rationale: 原文に明示されていない「与える」を本文へ補わず、神がその地について族長たちに誓ったという簡潔な表現を保った。
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: アブラハムに、イサクに、ヤコブに
  rationale: 各名の前に置かれた前置詞を反復して訳し、原文の荘重な列挙を保った。
theological_decisions:
- issue: פָּקֹד יִפְקֹד における神の行為の性質
  choice: 神が必ず民を顧み、彼らのために決定的に行動するとの確約
  alternative: 神が必ず訪れる／必ず目を留める
  rationale: この構文は強い確実性を表す。「顧みる」は単なる来訪にも単なる認知にも限定せず、契約の文脈にある神の配慮と介入を含み得る。
- issue: 族長たちへの誓いの省略内容
  choice: 「与える」を本文で明示せず、「誓われた地」とする
  alternative: 「与えると誓われた地」
  rationale: 土地を与えることは文脈から理解できるが、この節のヘブライ語にはその動詞が明示されていないため、原文の省略を可能な範囲で保った。
translation_notes:
  register: 現代の一般読者に明瞭な丁寧体を用いつつ、族長名の前の助詞を反復して原文の荘重さを保った。「顧みる」はやや格調があるが、聖書的文脈で理解可能であり、原語の意味幅にも適する。
