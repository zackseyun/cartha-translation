source:
  edition: WLC
  text: וְ/אַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖/י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣/הּ לְ/טֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּ/יּ֥וֹם הַ/זֶּ֖ה לְ/הַחֲיֹ֥ת עַם רָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/020.yaml
  text: As for you[a], you intended evil against me, but God intended it for good, in order to bring about what is happening this day—to keep many people alive.
translation:
  language: ja
  text: あなたがたは私に対して悪を計画しましたが、神はそれを良いことのために計画されました。それは、今日見られるこの結果[a]をもたらし、多くの人々を生かしておくためでした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「この日のように」。このヘブライ語の慣用表現は、今まさに目に見えている結果を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲשַׁבְתֶּם / חֲשָׁבָהּ
  choice: 計画しました／計画されました
  rationale: 同じ動詞を両方に用い、人間の悪い意図と神の良い意図との意図的な並行を保持する。「考えた」より目的性が明確であり、「用いた」のように神の側だけ別の動作へ言い換えることも避けた。
- source_word: עָלַי
  choice: 私に対して
  rationale: 敵対的な文脈における前置詞 על の方向性を自然な日本語で表し、兄たちの悪意がヨセフに向けられていたことを示す。
- source_word: רָעָה
  choice: 悪
  rationale: 単なる損害ではなく、兄たちの行為の道徳的な悪を保持する。
- source_word: לְטֹבָה
  choice: 良いことのために
  rationale: 「悪」との対照を明確にしつつ、目的・結果の両面を含み得る簡潔な表現とした。
- source_word: לְמַעַן עֲשֹׂה
  choice: それは、…結果をもたらし
  rationale: למען の目的性と、עשה がここで歴史上の結果を生じさせる意味を自然な日本語で表した。
- source_word: כַּיּוֹם הַזֶּה
  choice: 今日見られるこの結果
  rationale: 直訳的な「今日のように」だけでは不明瞭なため、現在目の前にある結果を指すヘブライ語の指示的な慣用表現を明示した。形式的な訳は脚注に残した。
- source_word: לְהַחֲיֹת
  choice: 生かしておく
  rationale: חיה のヒフィル形が表す、命を保たせる・生存させるという継続的な意味を表す。
- source_word: עַם רָב
  choice: 多くの人々
  rationale: 大勢の人を集合的に指す句を、特定の単一民族に限定しない自然な現代日本語で表した。
theological_decisions:
- issue: 人間の悪と神の摂理に同じ חשב が用いられていること
  choice: 兄たちと神の双方を「計画する」で訳す
  alternative: 兄たちは「企てた」、神は「良いことに変えられた」または「用いられた」と訳す
  rationale: 原文は、人間が真に悪を意図したことと、神が同じ出来事を良い目的に向けて意図されたことを並置している。神が道徳的悪を兄たちと同じ仕方で行ったと断定せず、同時にこの緊張を訳文で弱めないよう、同じ語を保持した。
- issue: רָעָה の道徳的意味
  choice: 「悪」と訳す
  alternative: 「害」または「災い」と訳す
  rationale: 兄たちの責任ある悪意が問題となっているため、単なる不利益や不幸に弱めず、道徳的な重みを残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、ヨセフの厳粛な発言にふさわしい品位を保った。「計画しました／計画されました」の反復は多少際立つが、原文の神学的に重要な並行を保持するため意図的に残した。
