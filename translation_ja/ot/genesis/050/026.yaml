  yaml_path: translation/ot/genesis/050/026.yaml
  text: So Joseph died at the age of a hundred and ten years[c][b][a], and they embalmed him and placed him in a coffin in Egypt.
translation:
  language: ja
  text: こうしてヨセフは百十歳で死んだ。人々は彼に防腐処置を施し、エジプトで棺に納めた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「棺」と訳したヘブライ語は、文脈によって「箱」や「櫃」とも訳される語である。ここでは遺体を納めるものを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: 死んだ
  rationale: מותの直接的な意味を、婉曲表現にせず自然な現代日本語で表した。
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: 百十歳で
  rationale: 直訳的には「百十年の子」だが、年齢を示すヘブライ語の慣用句なので、日本語の自然な年齢表現とした。
- source_word: וַיַּחַנְטוּ
  choice: 防腐処置を施し
  rationale: חנטは遺体の保存処置を指す。「ミイラにし」はエジプト的背景を明示する一方で解釈を狭めるため、動詞自体の意味に即した表現を採用した。
- source_word: וַיִּישֶׂם
  choice: 納めた
  rationale: שיםは「置く」を意味するが、遺体と棺の文脈にふさわしい、自然で厳かな日本語として「納めた」とした。
- source_word: בָּאָרוֹן
  choice: 棺に
  rationale: אָרוֹןは箱・櫃・棺を表し得るが、防腐処置を施した遺体の文脈では「棺」が最適である。ヘブライ語の定冠詞は、日本語では特に訳出する必要がない。
- source_word: בְּמִצְרָיִם
  choice: エジプトで
  rationale: 場所を表す前置詞と地名を標準的に訳した。「棺に納める」という出来事がエジプトで行われたことを自然に示す。
- source_word: וַ
  choice: こうして
  rationale: 冒頭の接続辞は物語を継続すると同時に創世記末尾の結末を導く。「こうして」はその叙述上の流れを自然に表す。
