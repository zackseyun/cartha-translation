revisions:
- from: 彼の防腐処置には四十日を要した。防腐処置の日数[a]は、それだけで満ちるからである。エジプト[b]は彼のために七十日間泣いた。
  to: 彼のために四十日が満ちた。というのも、防腐処置の日数[a]はそのようにして満ちるからである。エジプト[b]は彼のために七十日間泣いた。
  rationale: 原文で二度用いられる מלא の「満ちる／完了する」を「満ちた」「満ちる」として保ち、四十日が完了したという叙述を、防腐処置の所要時間という説明的表現へ過度に置換しないようにした。さらに כִּי כֵּן を「そのようにして」と訳し、理由・慣行の説明という接続関係を回復した。脚注の位置と内容は、原文上の解釈上の幅および集合的国名用法に対応している。
