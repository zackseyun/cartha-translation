source:
  edition: WLC
  text: וַ/יִּמְלְאוּ ל/וֹ֙ אַרְבָּעִ֣ים י֔וֹם כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י הַ/חֲנֻטִ֑ים וַ/יִּבְכּ֥וּ אֹת֛/וֹ מִצְרַ֖יִם שִׁבְעִ֥ים יֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/003.yaml
  text: Forty days were completed for him[a], for that is how the days of embalming are completed[b]; and Egypt wept for him seventy days.
translation:
  language: ja
  text: 彼のために四十日が満ちた。というのも、防腐処置の日数[a]はそのようにして満ちるからである。エジプト[b]は彼のために七十日間泣いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「防腐処置を施された者たちの日数」とも取れるが、文脈上は防腐処置にかかる日数を指す。
    reason: alternative_reading
  - marker: b
    text: ここでは国名「エジプト」が、エジプトの人々を集合的に指している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְלְאוּ לוֹ אַרְבָּעִים יוֹם
  choice: 彼の防腐処置には四十日を要した
  rationale: 直訳的には「彼のために四十日が満ちた」。日本語では、直前の防腐処置に要した期間を示す表現として自然にしつつ、四十日という定まった期間が完了した意味を保った。
- source_word: כִּי כֵן
  choice: それだけで……からである
  rationale: 四十日という期間の理由を説明する接続表現として、原文の説明的な力を明確にした。
- source_word: יִמְלְאוּ יְמֵי הַחֲנֻטִים
  choice: 防腐処置の日数は、それだけで満ちる
  rationale: 文脈上、遺体への防腐処置にかかる日数を指す。מלא の「満ちる、完了する」という反復も可能な限り残した。
- source_word: וַיִּבְכּוּ אֹתוֹ
  choice: 彼のために……泣いた
  rationale: בכה の基本的な意味である「泣く」を保ち、正式な喪の儀礼に限定する「服喪した」とはしなかった。
- source_word: מִצְרַיִם
  choice: エジプト
  rationale: 原文の国名を保ち、住民を集合的に指す用法であることを脚注で明示した。
- source_word: שִׁבְעִים יוֹם
  choice: 七十日間
  rationale: 期間を表す自然な現代日本語とした。
theological_decisions: []
