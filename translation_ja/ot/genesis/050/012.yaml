base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/012.yaml
  text: So his sons did for him as he had commanded them.
translation:
  language: ja
  text: 息子たちは、父が命じたとおりに、父のためのことを行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: 行った
  rationale: עשהは広く「する、行う」を意味する。ここでは父の埋葬についての命令を実行したことを表すため、「行った」とした。
- source_word: בָנָיו
  choice: 息子たちは
  rationale: בָּנִיםはここでヤコブの「息子たち」を具体的に指すため、そのまま性別を保持して訳した。
- source_word: לוֹ
  choice: 父のために
  rationale: 前置詞לは、この文脈ではヤコブのために、その意向に沿って行動したことを示す。日本語で指示対象を明確にするため「彼」ではなく「父」とした。
- source_word: כֵּן כַּאֲשֶׁר
  choice: …とおりに
  rationale: 命じられた内容への一致を表す自然な現代日本語として、二つの表現を合わせて「…とおりに」と訳した。כֵּןの様態の意味もこの表現に含まれる。
- source_word: צִוָּם
  choice: 命じた
  rationale: צוהの基本義を保って「命じた」とした。ヘブライ語の完了形は、息子たちの行動より前の命令を文脈上示すが、日本語では単純過去で自然にその前後関係が伝わる。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いた。「父」を二度用いることで、代名詞が連続する不自然さと指示対象の曖昧さを避けつつ、原文の「彼のために」を保持した。
