base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/025.yaml
  text: Then Joseph made the sons of Israel swear, saying, “God will surely attend to you, and you must bring up my bones from here.”
translation:
  language: ja
  text: ヨセフはイスラエルの子らに誓わせて言った。「神は必ずあなたがたを顧みてくださる。あなたがたは私の骨をここから携え上げなければならない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁבַּע
  choice: 誓わせて
  rationale: ヒフィル形の使役的な意味を明確に表し、ヨセフがイスラエルの子らに誓約を求めたことを伝える。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 集合的な「イスラエル人」も可能だが、本文の家族的・系譜的文脈を保つため、原語に近い表現を採用した。
- source_word: פָּקֹד יִפְקֹד
  choice: 必ず…顧みてくださる
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「必ず」で示す。פקדはここでは、神が民に心を留め、救いのために介入する意を含むため「顧みる」とした。
- source_word: וְהַעֲלִתֶם
  choice: 携え上らなければならない
  rationale: 接続詞付き完了形は、誓約の内容として要求・義務を表す。「上る」はエジプトから約束の地へ向かう地理的・物語的表現を保持する。
- source_word: עַצְמֹתַי
  choice: 私の骨
  rationale: 遺骸全体を指し得るが、原語の具体的表現と後続の出エジプト物語との照応を保った。
theological_decisions:
- issue: 神の訪れを表す פקד の解釈
  choice: 顧みてくださる
  alternative: 訪れる／心に留める／介入する
  rationale: 単なる訪問ではなく、契約の民を覚えて救済的に行動する含意を自然な日本語で示しつつ、具体的な介入の仕方を限定しない。
- issue: 骨を運ぶ命令の強さ
  choice: 携え上らなければならない
  alternative: 携え上ることになる／携え上りなさい
  rationale: 誓わせた内容に続くため、未来の予告だけでなく拘束力のある義務として訳した。ただし直接命令形にはせず、原語の動詞形を反映した。
translation_notes:
  register: 明快で格調ある現代標準日本語。引用内の「その時」は、神の顧みと骨を運び上る行為との時間的・論理的連関を日本語で自然に示す補足であり、新たな出来事を加えるものではない。
