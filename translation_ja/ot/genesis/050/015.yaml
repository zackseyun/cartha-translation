base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/015.yaml
  text: When Joseph’s brothers saw that their father was dead, they said, “What if Joseph hates us and fully repays us for all the evil that we did to him?”
translation:
  language: ja
  text: ヨセフの兄たちは、父が死んだのを見て、言った。「ヨセフは私たちに恨みを抱き、私たちが彼にしたあらゆる悪に対して、きっと仕返しをするのではないか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לוּ יִשְׂטְמֵנוּ
  choice: 私たちを憎み……のではないか
  rationale: לוּ はここでは恐れを伴う仮定・懸念を表し、יִשְׂטְמֵנוּ はヨセフが兄たちに敵意や憎しみを抱くことを示す。現代日本語として自然な懸念表現にした。
- source_word: וְהָשֵׁב יָשִׁיב לָנוּ
  choice: きっと仕返しをする
  rationale: 同根の不定詞絶対形と定動詞の組み合わせによる強調を「きっと」で表した。「返す」はここでは加害への報復を意味するため「仕返しをする」とした。
- source_word: אֵת כָּל־הָרָעָה אֲשֶׁר גָּמַלְנוּ אֹתוֹ
  choice: 私たちが彼にしたあらゆる悪に対して
  rationale: רָעָה を道徳的な「悪」とし、兄たちがヨセフに行った害悪の総体を明示した。גמל の文脈上の意味を日本語で自然に表した。
theological_decisions:
- issue: 兄たちの発言が疑問か断定か
  choice: 「……のではないか」と恐れを込めた懸念として訳す
  alternative: 「ヨセフは私たちを憎み、必ず仕返しをするだろう」と断定的に訳す
  rationale: לוּ は願望にも懸念にも用いられ得るが、この文脈では父の死後の報復を恐れる発言である。疑念と恐怖を保ち、断定にしない。
- issue: 報復の強さ
  choice: 「きっと」で明示する
  alternative: 強調を表面化せず単に「仕返しをする」とする
  rationale: הָשֵׁב יָשִׁיב の同根反復が持つ強意を日本語に反映した。
translation_notes:
  register: 明瞭な現代標準日本語。物語文として簡潔で品位を保ちつつ、兄たちの恐れが自然に伝わる表現とした。
