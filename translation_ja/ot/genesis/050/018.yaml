  text: וַ/יֵּלְכוּ֙ גַּם אֶחָ֔י/ו וַֽ/יִּפְּל֖וּ לְ/פָנָ֑י/ו וַ/יֹּ֣אמְר֔וּ הִנֶּ֥/נּֽוּ לְ/ךָ֖ לַ/עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/050/018.yaml
  text: Then his brothers also came and fell down before him and said[a], “Here we are, your servants.”
translation:
  language: ja
  text: 彼の兄弟たちもやって来て、彼の前にひれ伏し、言った。「ここにおります。私たちはあなたの奴隷です[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「仕える者たち」とも訳せる。ヘブライ語の עֲבָדִים は、仕える者にも奴隷にも用いられる。ここでは兄弟たちの強い服従の表明を伝えるため、「奴隷」と訳した。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: やって来て
  rationale: 字義的には「行く」だが、兄弟たちがヨセフのもとへ近づく場面なので、現代日本語では「やって来る」が自然。
- source_word: גַּם אֶחָיו
  choice: 彼の兄弟たちも
  rationale: 先に使いを送ったことに加え、兄弟たち自身も来たという付加を「も」で示す。
- source_word: וַיִּפְּלוּ לְפָנָיו
  choice: 彼の前にひれ伏し
  rationale: נפל＋לפני が表す、相手の前に身を伏せて服従を示す動作を明確に伝える。
- source_word: הִנֶּנּוּ
  choice: ご覧ください。私たちは
  rationale: 話者が自らを差し出す提示表現。単なる所在を示す「ここにいます」より、直後の身分表明との結びつきを保つ。
- source_word: לְךָ לַעֲבָדִים
  choice: あなたの奴隷です
  rationale: 直訳的には「あなたに対して奴隷として」。日本語では所有表現が自然であり、全面的な服従の申し出を表す。
- source_word: עֲבָדִים
  choice: 奴隷
  rationale: 「僕、仕える者」と「奴隷」の両義があるが、ここでは兄弟たちがヨセフの前にひれ伏し、自分たちをその支配下に差し出しているため、強い従属を示す「奴隷」を本文に採る。
theological_decisions:
- issue: עֲבָדִים の従属身分を示す語の訳
  choice: 奴隷
  alternative: 僕／しもべ
  rationale: 宗派的な含意を加えるのではなく、この場面の強い自己卑下と全面的服従を保持するため。「奴隷」と「僕」の語義上の幅は脚注で明示する。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語としての品位を保った。「ご覧ください」は הִנֶּנּוּ の提示・自己差し出しの力を示すが、古風な「見よ」は避けた。
