  text: Then Abimelech said to Abraham[a], “What did you see, that you did this thing?”
translation:
  language: ja
  text: そこで、アビメレクはアブラハムに言った。「あなたは何を見て[a]、このことをしたのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「何を考えて、このことをしたのか」。ヘブライ語を直訳すると「何を見て……」となる。ここで「見る」は、何を念頭に置いていたか、何を考えていたかを表す慣用的な言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: また……言った
  rationale: 接続形は物語と発言の進行を示す。直前から続くアビメレクの発言として、現代日本語で自然な「また」を用いた。
- source_word: אֲבִימֶלֶךְ
  choice: アビメレク
  rationale: 人名を日本語聖書で広く定着している形に音写した。
- source_word: אֶל־אַבְרָהָם
  choice: アブラハムに
  rationale: 前置詞 אֶל は発言の相手を示すため、自然な日本語の「に」とした。人名は慣用的な形で音写した。
- source_word: מָה רָאִיתָ
  choice: あなたは何を見て
  rationale: רָאָה の基本義「見る」を保ちつつ、何を認め、何を念頭に置いて行動したのかを問うヘブライ語の含みは脚注で示した。動機を直接問う「なぜ」と意訳せず、原文の比喩的表現と曖昧さを残した。
- source_word: כִּי
  choice: （「何を見て」と後続節を結ぶ読点）
  rationale: ここでは問いと、その結果としての行為を結び付ける。日本語では独立した接続語を置かず、連用表現「見て、……した」で自然に表した。
- source_word: עָשִׂיתָ אֶת־הַדָּבָר הַזֶּה
  choice: このようなことをした
  rationale: עָשָׂה は「する」、דָּבָר は文脈上「こと」とした。「このこと」よりも、問題とされている行為を指す自然な日本語として「このようなこと」を選び、過度な道徳的評価は加えていない。
