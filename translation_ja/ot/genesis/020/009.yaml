id: GEN.20.9
reference: Genesis 20:9
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א אֲבִימֶ֜לֶךְ לְ/אַבְרָהָ֗ם וַ/יֹּ֨אמֶר ל֜/וֹ מֶֽה עָשִׂ֤יתָ לָּ֨/נוּ֙ וּ/מֶֽה חָטָ֣אתִי לָ֔/ךְ כִּֽי הֵבֵ֧אתָ עָלַ֛/י וְ/עַל מַמְלַכְתִּ֖/י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/009.yaml
  text: Then Abimelech called Abraham and said to him[a], “What have you done to us? And how have I sinned against you[b], that you have brought a great sin on me and on my kingdom? You have done to me things that should not be done.”
translation:
  language: ja
  text: そこでアビメレクはアブラハムを呼び寄せて言った。「あなたは、われわれになんということをしたのか。私があなたにどんな罪を犯したというので、私と私の王国に大きな罪を負わせたのか。あなたは私に、してはならないことをした。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם
  choice: アビメレクはアブラハムを呼び寄せて
  rationale: קרא＋לְ は人を呼ぶ、または呼び寄せる意。ここでは王がアブラハムを呼んで問いただす場面なので、「呼び寄せて」が文脈に自然である。
- source_word: מֶה עָשִׂיתָ לָּנוּ
  choice: あなたは、われわれになんということをしたのか
  rationale: 直訳的な「何をしたのか」よりも、非難と驚きを帯びた修辞疑問を自然な現代日本語で表す。
- source_word: וּמֶה חָטָאתִי לָךְ
  choice: 私があなたにどんな罪を犯したというので
  rationale: חטא の道徳的・宗教的な重みを保つため「罪を犯す」とし、מֶה は日本語として自然な「どんな罪」とした。
- source_word: כִּי
  choice: というので
  rationale: 先行する修辞疑問と、続くアブラハムの行為への非難を自然に結び付ける。理由と結果の含みを保つ。
- source_word: הֵבֵאתָ עָלַי וְעַל מַמְלַכְתִּי חֲטָאָה גְדֹלָה
  choice: 私と私の王国に大きな罪を負わせた
  rationale: 使役形 הֵבֵאתָ と前置詞 עַל の「上にもたらす」という構図を、日本語では「罪を負わせる」として明確に表現した。חֲטָאָה はここでも「罪」と訳し、倫理的な重さを保持する。
- source_word: מַמְלַכְתִּי
  choice: 私の王国
  rationale: 王の支配領域と共同体を指す標準的で明瞭な訳語。
- source_word: מַעֲשִׂים אֲשֶׁר לֹא יֵעָשׂוּ
  choice: してはならないこと
  rationale: 字義的には「なされない行為」だが、この受動表現には社会的・道徳的に許されないという規範的意味があるため、「してはならないこと」とした。
- source_word: עָשִׂיתָ עִמָּדִי
  choice: あなたは私に……した
  rationale: עשה עם の相手に対する扱いや行為を、日本語で簡潔に「私に……した」と表した。
theological_decisions:
- issue: חֲטָאָה גְדֹלָה が、実際に犯された罪か、招きかねなかった罪または罪責か
  choice: 大きな罪を負わせた
  alternative: 大きな罪責を負わせた／大きな罪をもたらした
  rationale: 本文は「罪」と「罪責」のどちらにも関わり得る表現であり、前節の神の警告を踏まえても意味を限定しすぎないよう、「罪」を保ちつつ使役的な「負わせた」とした。
translation_notes:
  register: 明瞭な現代標準日本語を用い、王の厳しい非難にふさわしい品位と切迫感を保った。「なんということ」「どんな罪を犯したというので」により修辞疑問を自然に表現し、過度に古風な語法は避けた。
