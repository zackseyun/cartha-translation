  text: וּ/לְ/שָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֨סֶף֙ לְ/אָחִ֔י/ךְ הִנֵּ֤ה הוּא לָ/ךְ֙ כְּס֣וּת עֵינַ֔יִם לְ/כֹ֖ל אֲשֶׁ֣ר אִתָּ֑/ךְ וְ/אֵ֥ת כֹּ֖ל וְ/נֹכָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/016.yaml
  text: And to Sarah he said[a], “Look, I have given a thousand pieces of silver to your brother. Look, it is for you a covering of the eyes to all who are with you[b], and before everyone you are vindicated.”
translation:
  language: ja
  text: サラにはこう言った。「見なさい。私はあなたの兄弟に銀千枚を与えた。見なさい。これは、あなたと共にいるすべての者に対して、あなたのための目を覆うものとなる[a]。こうして、すべての人の前で、あなたの潔白は示された[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「目を覆うためのもの」。おそらく、公の償いによって受けた辱めを覆い、サラの名誉を回復する、という意味。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたは潔白とされた」または「すべての人の前で事は決着した」。この結びのヘブライ語は難解で、「あなたは戒められた」と理解することもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: אֶלֶף כֶּסֶף
  choice: 銀千枚
  rationale: 直訳は「銀千」で、単位は明記されていない。「銀千枚」は具体的なシェケルという単位を補わず、銀による多額の支払いを自然な日本語で表す。
- source_word: לְאָחִיךְ
  choice: あなたの兄
  rationale: ヘブライ語の「あなたの兄」をそのまま保ち、サラがアブラハムを兄と称した経緯と、アビメレクの言葉に含まれる皮肉を伝える。
- source_word: כְּסוּת עֵינַיִם
  choice: あなたの目を覆うもの
  rationale: 意味の確定が難しい比喩表現なので、本文では比喩を保持する。公の償いによって受けた辱めを覆い、名誉を回復することを指す可能性が高い。
- source_word: לְכֹל אֲשֶׁר אִתָּךְ
  choice: あなたと共にいるすべての者に対して
  rationale: 前置詞 לְ の向きを保ちながら、この贈与がサラの周囲の者たちに対して公的な意味を持つことを表す。
- source_word: וְאֵת כֹּל
  choice: すべての人の前で
  rationale: 統語的に圧縮された難解な句だが、サラと共にいる者から、より広く「すべての人」へと公的範囲を広げる表現として訳す。
- source_word: וְנֹכָחַת
  choice: あなたの潔白は示された
  rationale: יכח のニファル形を、公に正しいと認められる、潔白を示されるという意味に取る。ただし「戒められた」などの解釈も可能なため、脚注で難しさを明示する。
theological_decisions:
- issue: 結びの句におけるサラの評価
  choice: あなたの潔白は示された
  alternative: あなたは戒められた／事はすべての人の前で決着した
  rationale: 文脈ではアビメレクが償いを行い、サラの名誉を公に回復しているため、「潔白は示された」が最も自然である。ただし原文の統語と動詞の意味には複数の理解があり、断定しすぎないよう脚注を付す。
translation_notes:
  register: 明瞭で現代的ながら品位ある叙述とした。「見なさい」を反復して原文の הִנֵּה を反映し、難解な比喩と結びの曖昧さは本文で一義的に解消せず脚注で示した。
