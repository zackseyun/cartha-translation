base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/002.yaml
  text: And Abraham said of Sarah his wife[b][a], “She is my sister.” So Abimelech king of Gerar sent and took Sarah.
translation:
  language: ja
  text: アブラハムは妻サラについて[a]、「彼女は私のきょうだいです」と言った。そこで、ゲラルの王アビメレクは人を遣わして、サラを連れて来させた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「妻サラに」。ヘブライ語の前置詞は通常この意味にも取れるが、ここで伝えられている言葉が「彼女は私のきょうだいです」と三人称になっているため、本文では「サラについて」とした。ヘブライ語は女性のきょうだいを指すが、姉か妹かは区別しない。
    reason: lexical_alternative
  - marker: b
    text: すなわち、アビメレクは人を遣わしてサラを自分のもとへ連れて来させた。ヘブライ語は簡潔に「遣わし、サラを取った」と記している。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: אמרの物語叙述における標準的で自然な訳。
- source_word: אֶל שָׂרָה אִשְׁתּוֹ
  choice: 妻サラについて
  rationale: אֶלは通常「〜に」だが、引用された「彼女は私の妹です」という三人称の発言と文脈から、ここではサラについて語った意味に取るのが自然。前置詞の字義的な別解は脚注に残した。
- source_word: אֲחֹתִי הִוא
  choice: 彼女は私の妹です
  rationale: 一人称単数接尾辞を持つ「妹／姉妹」と代名詞から成る名詞文を、明快で自然な現代日本語にした。ヘブライ語は姉か妹かを区別しないが、日本語の慣用と既知の関係に従い「妹」とした。
- source_word: וַיִּשְׁלַח
  choice: 人を遣わし
  rationale: שלחの基本義「遣わす」を保ちつつ、目的語として省略されている使者を日本語では「人」と補い、自然な叙述にした。
- source_word: מֶלֶךְ גְּרָר
  choice: ゲラルの王
  rationale: 地名と王の関係を示す連語を、日本語で自然な属格表現にした。
- source_word: וַיִּקַּח אֶת שָׂרָה
  choice: サラを連れて来させた
  rationale: לקחの「取る、連れて行く」という意味を、この場面で省略された使者による行為も含めて自然な日本語にした。「妻にした」までは本文に明記されていないため補わない。
theological_decisions:
- issue: アビメレクがサラを取った目的の明示
  choice: サラを連れて来させた
  alternative: サラを妻として迎えた
  rationale: 後続の文脈は婚姻を意図した行為であることを示すが、この節のヘブライ語は単に「取った」と述べる。目的を本文に付加せず、原文の抑制と物語上の緊張を保った。
- issue: アブラハムの発言の相手
  choice: 妻サラについて言った
  alternative: 妻サラに言った
  rationale: 前置詞אֶלだけなら「〜に」も可能だが、「彼女は」という三人称の引用と文脈は、サラについて他者に語った理解を支持する。真正な語義上の別解は脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、族長物語にふさわしい落ち着いた叙述調と直接話法を保った。「召し入れた」「妻に迎えた」のように目的を先取りする表現は避けた。
