  yaml_path: translation/ot/genesis/020/018.yaml
  text: For Yahweh had completely closed every womb in Abimelech’s household because of Sarah[a], Abraham’s wife.
translation:
  language: ja
  text: というのも、ヤハウェが、アブラハムの妻サラのことで、アビメレクの家のすべての子宮を完全に閉ざしておられたからである。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「完全に閉ざしておられた」は、同じ語根の不定詞絶対形と定動詞を重ねて動作を強調するヘブライ語表現。直訳的には「確かに閉ざしておられた」「すっかり閉ざしておられた」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: というのも……からである
  rationale: 直前の出来事の理由を説明する接続として、現代日本語で明確な因果関係を示す。
- source_word: עָצֹר עָצַר
  choice: 固く閉ざしていた
  rationale: 不定詞絶対形と定動詞の重複による強意を「固く」で表し、文脈上、すでに続いていた状態であることを「ていた」で示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文の神名を音写して保つ。
- source_word: בְּעַד כָּל רֶחֶם לְבֵית אֲבִימֶלֶךְ
  choice: アビメレクの家のすべての胎を
  rationale: 「家」は建物ではなく家に属する者たちを含むが、原文の「家」と「胎」という具体的な像を保つ。
- source_word: עַל דְּבַר שָׂרָה
  choice: サラのことで
  rationale: 原因を示す表現として自然でありつつ、サラ自身への非難と断定せず、出来事に関わるゆえという幅を残す。
- source_word: אֵשֶׁת אַבְרָהָם
  choice: アブラハムの妻
  rationale: 原文の属格関係を簡潔で自然な日本語にする。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、称号「主」に置換せず音写する。
- issue: עַל דְּבַר שָׂרָה の因果関係
  choice: サラのことで
  alternative: サラのゆえに
  rationale: 神の措置がサラに関わる出来事を理由とすることは示しつつ、サラに責任があるかのような不要な含意を避ける。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「胎を閉ざす」という原文の具体的で荘重な表現を保持した。「というのも……からである」で前節への説明関係を明示した。
