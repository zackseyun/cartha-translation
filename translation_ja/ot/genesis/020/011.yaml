reference: Genesis 20:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין יִרְאַ֣ת אֱלֹהִ֔ים בַּ/מָּק֖וֹם הַ/זֶּ֑ה וַ/הֲרָג֖וּ/נִי עַל דְּבַ֥ר אִשְׁתִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/011.yaml
  text: And Abraham said[a], “Because I said, ‘Surely there is no fear of God in this place, and they will kill me because of my wife.’”
translation:
  language: ja
  text: アブラハムは答えた。「この場所には神への恐れがまったくないので、私の妻のことで、私は殺されるだろうと思ったのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: ので
  rationale: アブラハムが先の行動の理由を説明する因果関係を、自然な現代日本語で示す。
- source_word: אָמַרְתִּי
  choice: 思った
  rationale: 字義は「言った」だが、ここでは自分の内心で下した判断を表すため、日本語では「思った」が自然である。
- source_word: רַק
  choice: まったく
  rationale: 後続する否定表現を強め、この場所には神への恐れがないというアブラハムの断定的な見込みを表す。
- source_word: אֵין יִרְאַת אֱלֹהִים
  choice: 神への恐れがない
  rationale: 「神を恐れること」という聖書的な宗教・倫理概念を保ちつつ、明瞭な日本語にする。
- source_word: בַּמָּקוֹם הַזֶּה
  choice: この場所には
  rationale: 場所を示す原文を簡潔かつ直接的に訳す。
- source_word: וַהֲרָגוּנִי
  choice: 私は殺されるだろう
  rationale: 不特定の人々を主語とするヘブライ語を、日本語で自然な受け身にし、アブラハムが予想した結果を示す。
- source_word: עַל דְּבַר אִשְׁתִּי
  choice: 私の妻のことで
  rationale: 妻をめぐる事情が殺害の原因になるという意味を、過度に解釈せず自然に表す。
theological_decisions:
- issue: יִרְאַת אֱלֹהִים の訳し方
  choice: 神への恐れ
  alternative: 神への畏敬
  rationale: 原語の「恐れ」を保ち、単なる感情だけでなく、神を意識した宗教的・倫理的な慎みを含み得る表現とした。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「言った」は発話導入として「答えた」とし、文中の אָמַרְתִּי は内的判断を表す「思った」とした。原文の意味が本文だけで十分伝わるため脚注は付していない。
