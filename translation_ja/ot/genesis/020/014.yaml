base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/014.yaml
  text: Then Abimelech took sheep and cattle[a], and male servants and female servants, and gave them to Abraham[c][b]; and he returned Sarah his wife to him.
translation:
  language: ja
  text: アビメレクは羊[a]と牛、男の奴隷と女の奴隷[b]を取り、アブラハムに与えた。また、アブラハムの妻サラをアブラハムに返した[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「羊」と訳したヘブライ語は、羊と山羊を含む「小家畜」または「群れ」を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「男の使用人と女の使用人」。ヘブライ語は使用人にも奴隷にも用いられるが、ここでは家畜とともに贈られているため「奴隷」と訳した。
    reason: lexical_alternative
  - marker: c
    text: 別訳「アブラハムのもとに戻した」または「アブラハムに返還した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取った
  rationale: לקחの基本義「取る」を保ち、後続する「与えた」との物語上の連続を簡潔に表した。
- source_word: צֹאן
  choice: 羊
  rationale: 牛と対にされた家畜の一覧として自然で簡潔。ただし、語自体は山羊を含む小家畜全般を指し得るため脚注を付した。
- source_word: בָקָר
  choice: 牛
  rationale: 牛類の家畜を集合的に指す語であり、現代日本語では「牛」が自然である。
- source_word: עֲבָדִים וּשְׁפָחוֹת
  choice: 男の奴隷と女の奴隷
  rationale: 男女の区別を明示する対語を保持した。家畜とともに贈与される文脈では拘束された身分が前景化するため、「使用人」ではなく「奴隷」とした。
- source_word: וַיִּתֵּן
  choice: 与えた
  rationale: נתןの単純で直接的な意味を自然な日本語で表した。目的語は直前の列挙から明らかなため補わない。
- source_word: וַיָּשֶׁב
  choice: 返した
  rationale: שׁובのヒフィル形が示す「戻らせる、返還する」を自然な日本語で表した。
- source_word: אֵת שָׂרָה אִשְׁתּוֹ
  choice: アブラハムの妻サラを
  rationale: 文脈上、接尾辞の指示対象がアブラハムであることを日本語で明確にしつつ、サラがその妻であるという同格関係を保った。
- source_word: לוֹ
  choice: 彼に
  rationale: 直前に明示したアブラハムを受ける代名詞として、ヘブライ語の表現を自然に保持した。
