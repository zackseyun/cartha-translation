id: GEN.20.4
reference: Genesis 20:4
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑י/הָ וַ/יֹּאמַ֕ר אֲדֹנָ֕/י הֲ/ג֥וֹי גַּם צַדִּ֖יק תַּהֲרֹֽג־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/004.yaml
  text: Abimelech had not come near her[a], so he said, “Lord[b], will you kill even a righteous nation?”
translation:
  language: ja
  text: アビメレクは彼女に近づいてはいなかった[a]。そこで彼は言った。「主よ、正しい民[b]までも殺すのですか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「近づく」は、ここでは性的関係を持つことを婉曲に表している。
    reason: cultural_note
  - marker: b
    text: または「国」「国民」。ヘブライ語は、一つの民族または共同体を集合的に指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרַב אֵלֶיהָ
  choice: 彼女に近づいてはいなかった
  rationale: ヘブライ語の表現を保ちつつ、この文脈ではサラと性的関係を持っていなかったことを含意する。含意は脚注で明示する。
- source_word: אֲדֹנָי
  choice: 主よ
  rationale: 夢の中でアビメレクが神に呼びかける敬称。語を加えず、現代日本語として自然な呼格にした。
- source_word: גּוֹי
  choice: 民
  rationale: 一つの集団としての民族・国民を指す集合名詞。「民」は政治的規模を限定せず、文脈上の共同体的範囲を保てる。
- source_word: גַּם
  choice: までも
  rationale: 修辞疑問における強調を自然な日本語で表す。
- source_word: צַדִּיק
  choice: 正しい
  rationale: 道徳的正しさと、この件に関する無実の双方を含み得る語義の幅を残す。
- source_word: תַּהֲרֹג
  choice: 殺すのですか
  rationale: 直接的な修辞疑問として未完了形を表し、原語の「殺す」を弱めずに訳す。
- source_word: וַאֲבִימֶלֶךְ ... וַיֹּאמַר
  choice: アビメレクは……。そこで彼は言った
  rationale: 物語の進行と、近づいていなかったことを踏まえた発言のつながりを明確にする。原文にない「さて」「今」を加えない。
theological_decisions:
- issue: アビメレクの訴えにおける共同体的範囲
  choice: גּוֹיを「民」と訳し、アビメレク個人に限定しない
  alternative: 「国」「国民」
  rationale: 原語は集合的な集団を表し、周辺文脈では王だけでなく共同体も裁きの脅威にさらされている。正確な政治的規模は限定しない。
- issue: צַדִּיקの正しさと無実の含意
  choice: 「正しい」と訳す
  alternative: 「罪のない」
  rationale: アビメレクの無実の主張を含みつつ、聖書全体での「正しい」という語彙的連関と、発言に残る神学的緊張を保持する。
translation_notes:
  register: 明快な現代標準日本語を用い、神への呼びかけは簡潔で品位ある「主よ」とした。「殺す」は原語の直接性を保つ。すべての脚注記号を該当箇所に付した。
