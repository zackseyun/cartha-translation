- source_word: הִנֵּה
  choice: 見なさい
  rationale: 相手の注意を促す提示表現。現代日本語で明快かつ dignified な命令形として訳した。
- source_word: אַרְצִי לְפָנֶיךָ
  choice: 私の土地はあなたの前にある
  rationale: 原文の空間的な比喩を保ち、土地が相手の選択に開かれていることを自然に伝える。
- source_word: בַּטּוֹב בְּעֵינֶיךָ
  choice: あなたが良いと思う所に
  rationale: 直訳的な「あなたの目に良い」を、日本語で同じ判断主体を明示する自然な表現にした。
- source_word: שֵׁב
  choice: 住みなさい
  rationale: 文脈上、一時的に座ることではなく、その土地に居住する許可を表すため。
