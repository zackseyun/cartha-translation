source:
  edition: WLC
  text: וְ/עַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת הָ/אִישׁ֙ כִּֽי נָבִ֣יא ה֔וּא וְ/יִתְפַּלֵּ֥ל בַּֽעַדְ/ךָ֖ וֶֽ/חְיֵ֑ה וְ/אִם אֵֽינְ/ךָ֣ מֵשִׁ֗יב דַּ֚ע כִּי מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְ/כָל אֲשֶׁר לָֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/007.yaml
  text: Now then[a], return the man's wife, for he is a prophet, and he will pray for you, and you will live. But if you do not return her, know that you will surely die—you and all who are yours.
translation:
  language: ja
  text: さあ、その人の妻を返しなさい。彼は預言者なのだから、あなたのために祈る。そうすれば、あなたは生きる。しかし、もし返さないなら、あなたも、あなたに属するすべての者も[a]、必ず死ぬのだと知りなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたに属するすべてのものも」または「あなたの持つすべても」。ヘブライ語の表現は広く、アビメレクの家の者だけでなく、彼に属する所有物をも含み得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: さあ
  rationale: 時を示すだけでなく、緊迫した命令への移行を表す談話標識として、現代日本語で自然かつ簡潔に訳した。
- source_word: הָשֵׁב אֵשֶׁת הָאִישׁ
  choice: あの人の妻を返しなさい
  rationale: 使役形の命令が示す、正当な相手のもとへ戻す行為を「返す」で表した。האיש は文脈上アブラハムを指すが、固有名を補わず原文の表現を保った。
- source_word: כִּי נָבִיא הוּא
  choice: 彼は預言者なので
  rationale: כִּי の理由を示す働きを明確にし、語順は自然な日本語に整えた。
- source_word: וְיִתְפַּלֵּל בַּעַדְךָ
  choice: あなたのために祈り
  rationale: בַּעַד の執り成しの含意は文脈にあるが、一般読者に透明な「ために祈る」を採用した。yiqtol は返還後に生じる結果・未来として訳した。
- source_word: וֶחְיֵה
  choice: あなたは生きる
  rationale: 形態上は命令形だが、ここでは祈りに続く結果を表すため、予告として自然な日本語にした。
- source_word: וְאִם אֵינְךָ מֵשִׁיב
  choice: しかし、もし返さないなら
  rationale: 否定辞と分詞による不返還を、現代日本語の条件節で表した。目的語「彼女」は日本語では文脈から明らかなため省略した。
- source_word: דַּע כִּי מוֹת תָּמוּת
  choice: 必ず死ぬのだと知りなさい
  rationale: 不定詞絶対形と定動詞の組み合わせによる確実性・強意を「必ず」で示し、דַּע の厳粛な命令を保持した。
- source_word: אַתָּה וְכָל אֲשֶׁר לָךְ
  choice: あなたも、あなたに属するすべての者も
  rationale: 文脈上、家の者を含む人的範囲が前景化されるため「者」とした。ただしヘブライ語は所有物をも含み得る広い表現なので脚注で別訳を示した。
theological_decisions:
- issue: 「あなたに属するすべて」（כָל אֲשֶׁר לָךְ）に及ぶ裁きの範囲
  choice: 本文では「あなたに属するすべての者」とし、アビメレクの家に属する人々を前景化する。
  alternative: 「あなたに属するすべて」「あなたの持つすべて」とし、人と所有物の双方を明示的に開いておく。
  rationale: 物語の直近の文脈では王家全体への災いが問題となるため人的な読みが適切だが、原語そのものの広さを限定し切らないよう脚注を付した。
translation_notes:
  register: 神の直接の警告にふさわしい威厳と緊迫感を保ちつつ、現代の一般読者に自然な標準語とした。「さあ」「返しなさい」「知りなさい」により命令の流れを明瞭にし、古風な終助詞や過度に文語的な表現は避けた。
