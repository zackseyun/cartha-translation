id: GEN.20.1
reference: Genesis 20:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּסַּ֨ע מִ/שָּׁ֤ם אַבְרָהָם֙ אַ֣רְצָ/ה הַ/נֶּ֔גֶב וַ/יֵּ֥שֶׁב בֵּין קָדֵ֖שׁ וּ/בֵ֣ין שׁ֑וּר וַ/יָּ֖גָר בִּ/גְרָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/001.yaml
  text: From there Abraham journeyed toward the Negev and settled between Kadesh and Shur[a]; he sojourned in Gerar.
translation:
  language: ja
  text: そこからアブラハムはネゲブ地方へ向かって旅立ち、カデシュとシュルの間に住み、ゲラルに寄留した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 旅立ち
  rationale: נסע の移動を開始して進むという物語上の意味を、自然な現代日本語で表した。
- source_word: מִשָּׁם
  choice: そこから
  rationale: 直前の滞在地を指す指示表現を簡潔に訳した。
- source_word: אַרְצָה הַנֶּגֶב
  choice: ネゲブ地方へ向かって
  rationale: 方向を示す語尾を「へ向かって」で表し、הַנֶּגֶב は一般的な南方向ではなく地理的地域名である可能性を本文に採った。
- source_word: וַיֵּשֶׁב
  choice: 住み
  rationale: ישב の居住するという基本義を自然に表す。「定住した」では、続く寄留との関係について必要以上に恒久性を含ませるため避けた。
- source_word: בֵּין קָדֵשׁ וּבֵין שׁוּר
  choice: カデシュとシュルの間に
  rationale: 二つの地名による地理的位置を原文どおり保持した。
- source_word: וַיָּגָר
  choice: 寄留した
  rationale: גור が含む、よそ者として滞在する意味を保持する、聖書文脈で理解可能な日本語を選んだ。
- source_word: בִּגְרָר
  choice: ゲラルに
  rationale: 場所を示す前置詞と地名を自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。地名は日本語聖書で広く定着した表記を用いた。「寄留」はやや文語的だが、単なる一時滞在ではなく、よそ者として住むという原語の含意を簡潔に保つため採用した。英語版の脚注は「Negev」と「southward」の英語上の選択を説明するものだが、日本語本文では「ネゲブ地方」と明示し、原文の地理的解釈を採っているため脚注は付していない。
