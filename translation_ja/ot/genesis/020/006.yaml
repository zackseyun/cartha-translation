id: GEN.20.6
reference: Genesis 20:6
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ אֵלָ֨י/ו הָֽ/אֱלֹהִ֜ים בַּ/חֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֨עְתִּי֙ כִּ֤י בְ/תָם לְבָבְ/ךָ֙ עָשִׂ֣יתָ זֹּ֔את וָ/אֶחְשֹׂ֧ךְ גַּם אָנֹכִ֛י אֽוֹתְ/ךָ֖ מֵ/חֲטוֹ לִ֑/י עַל כֵּ֥ן לֹא נְתַתִּ֖י/ךָ לִ/נְגֹּ֥עַ אֵלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/006.yaml
  text: Then God said to him in the dream[a], “Yes, I know that you did this in the integrity of your heart, and I also kept you from sinning against me[b]. Therefore I did not let you touch her.”
translation:
  language: ja
  text: 神は夢の中で[a]彼に言われた。「そうだ。あなたが誠実な心でこのことをしたのを、わたしも知っている。わたしもまた、あなたがわたしに罪を犯さないように、あなたをとどめた。それゆえ、あなたが彼女に触れることを許さなかった[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「その夢の中で」。文脈上、前節までの夢を指す。
    reason: lexical_alternative
  - marker: b
    text: 「彼女に触れる」は、ここでは性的な関係を婉曲に表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: 夢の中で
  rationale: 定冠詞を伴うため、文脈上すでに語られている特定の夢を指す表現として訳した。日本語では「その夢の中で」も可能だが、自然さを優先した。
- source_word: גַּם אָנֹכִי
  choice: わたしも／わたしもまた
  rationale: 二度の反復を残し、神自身の認識と介入を強調する原文の力点を保った。冒頭の用例には肯定の応答を示す「そうだ」を添えた。
- source_word: בְתָם לְבָבְךָ
  choice: 誠実な心で
  rationale: תֹּםの完全さ、潔白さ、誠実さという意味領域のうち、法的無罪を過度に断定せず、動機の正直さを表す自然な現代日本語を選んだ。
- source_word: וָאֶחְשֹׂךְ ... אוֹתְךָ
  choice: あなたをとどめた
  rationale: 神が行為を抑止したことを明確にしつつ、原文の「差し控える、引き止める」という意味を保った。
- source_word: מֵחֲטוֹא לִי
  choice: わたしに罪を犯さないように
  rationale: מןを伴う不定詞が行為の阻止を示すため、日本語では目的・結果を自然に表す形にした。לִיは倫理的な対象として「わたしに」と訳した。
- source_word: לֹא נְתַתִּיךָ לִנְגֹּעַ אֵלֶיהָ
  choice: あなたが彼女に触れることを許さなかった
  rationale: נתן＋不定詞の許可の用法を「許す」で表し、נגעの抑制された婉曲表現は「触れる」として保持した。
theological_decisions:
- issue: 「わたしに罪を犯す」の意味
  choice: 企図され得た行為を、神に対する罪として明示する
  alternative: 一般的に神の前で罪責を負う、または神を怒らせるという意味に弱める
  rationale: לִיは神を罪の倫理的な対象として示している。サラやアブラハムへの加害という含意を否定せず、本文が明示する神への罪という次元をそのまま保った。
- issue: アビメレクの「誠実な心」
  choice: 本人の動機についての神の認定として訳す
  alternative: 全面的な無罪または道徳的完全性の宣言と解する
  rationale: תֹּםは誠実さや潔白さを示すが、この一節だけで人物全体の完全な無罪を断定しないよう、適用範囲を「このことをした」際の心に限定した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、神の発話には威厳を保った。「触れる」という原文の婉曲表現を本文に残し、脚注で文脈上の意味を説明した。
