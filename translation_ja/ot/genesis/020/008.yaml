base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/008.yaml
  text: So Abimelech rose early in the morning and called all his servants and spoke all these things in their hearing[b][a], and the men were very afraid.
translation:
  language: ja
  text: そこでアビメレクは朝早く起き、家来たちを皆呼び集めて、これらのことをすべて彼らに聞かせた。すると、その者たちは非常に恐れた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: 朝早く起き
  rationale: שׁכםのヒフィル形と「朝に」を、日本語の自然な慣用表現でまとめ、行動の早さも保持した。
- source_word: וַיִּקְרָא לְכָל עֲבָדָיו
  choice: 家来たちを皆呼び集めて
  rationale: 王の配下を指す文脈なので、עֶבֶדは身分を不必要に奴隷へ限定せず「家来」とした。קרא לはここでは召集の意味合いを持つため「呼び集める」とした。
- source_word: וַיְדַבֵּר אֶת כָּל הַדְּבָרִים הָאֵלֶּה בְּאָזְנֵיהֶם
  choice: これらのことをすべて彼らに聞かせた
  rationale: 直訳的な「彼らの耳に語った」は日本語では不自然なため、本人たちの聞くところで内容を語ったというヘブライ語の慣用的意味を表した。
- source_word: וַיִּירְאוּ הָאֲנָשִׁים מְאֹד
  choice: その者たちは非常に恐れた
  rationale: יראはこの文脈では畏敬よりも危険への恐怖を表す。הָאֲנָשִׁיםは直前の家来たちを受けるため、日本語では性別を過度に強調しない「その者たち」が自然である。מְאֹדは「非常に」で強意を保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語文としての簡潔さと品位を保った。「家来」は王に仕える者という文脈を自然に示し、「奴隷」と断定することを避けた。
