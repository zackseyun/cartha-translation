  text: הֲ/לֹ֨א ה֤וּא אָֽמַר לִ/י֙ אֲחֹ֣תִ/י הִ֔וא וְ/הִֽיא גַם הִ֥וא אָֽמְרָ֖ה אָחִ֣/י ה֑וּא בְּ/תָם לְבָבִ֛/י וּ/בְ/נִקְיֹ֥ן כַּפַּ֖/י עָשִׂ֥יתִי זֹֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/005.yaml
  text: Did he not himself say to me[a], ‘She is my sister’? And she herself also said, ‘He is my brother.’ In the integrity of my heart and the innocence of my hands I have done this.
translation:
  language: ja
  text: 彼自身が私に、『彼女は私の姉妹です』と言ったではありませんか。彼女もまた、『彼は私の兄弟です』と言いました。私は、心に偽りなく、手を汚さずに[a]、このことをしたのです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「誠実な心と潔白な手をもって」。ヘブライ語は、誠実さと無実を表す道徳的・法的な慣用表現を用いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הוּא אָמַר לִי
  choice: 彼自身が私に……と言ったではありませんか
  rationale: הֲלֹא は肯定の答えを予期する反語として訳し、独立代名詞 הוּא の強調を「自身」で表した。
- source_word: אֲחֹתִי הִוא
  choice: 彼女は私の妹です
  rationale: 女性のきょうだいであるという直接の主張として自然な日本語にした。本文脈ではサラがアブラハムより年下であることも示されている。
- source_word: וְהִיא גַם הִוא אָמְרָה
  choice: また、彼女自身も……と言いました
  rationale: גם の追加の意味と独立代名詞による強調を、それぞれ「も」と「自身」で保った。
- source_word: אָחִי הוּא
  choice: 彼は私の兄です
  rationale: 男性のきょうだいであるという主張を、文脈に即した自然な日本語で表した。
- source_word: בְּתָם לְבָבִי
  choice: 心に偽りなく
  rationale: תָם が表す誠実さ、潔白さを、現代日本語で理解しやすい道徳的表現にした。
- source_word: וּבְנִקְיֹן כַּפַּי
  choice: 手に罪なく
  rationale: 「手」の比喩を残しつつ、נִקְיֹן の潔白・無罪という法的、道徳的含意を明確にした。
- source_word: עָשִׂיתִי זֹאת
  choice: このことをしたのです
  rationale: 完了した行為を表す単純な過去として訳し、「のです」によって神への弁明という発話の調子を自然に示した。
theological_decisions:
- issue: アビメレクの弁明における道徳的・法的慣用句
  choice: 「心に偽りなく、手に罪なく」とし、この件についての誠実さと潔白の主張として訳した。
  alternative: 「心の完全さと手の清さをもって」
  rationale: 絶対的な無罪性や罪のなさを教理的に断定せず、問題となっている行為についての自己弁護という範囲を保つため。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、神への弁明にふさわしい丁寧さと重みを保った。引用内は「です」、地の発言は「ました／のです」で統一した。
