source:
  edition: WLC
  text: וַ/יִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל הָ/אֱלֹהִ֑ים וַ/יִּרְפָּ֨א אֱלֹהִ֜ים אֶת אֲבִימֶ֧לֶךְ וְ/אֶת אִשְׁתּ֛/וֹ וְ/אַמְהֹתָ֖י/ו וַ/יֵּלֵֽדוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/017.yaml
  text: Then Abraham prayed to God[a], and God healed Abimelech, his wife, and his female servants[b], and they gave birth.
translation:
  language: ja
  text: そこでアブラハムは神に祈った。神はアビメレクとその妻、またアビメレクの女奴隷たち[a]を癒やされた。そして、女たちは子を産んだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女奴隷たち」。ヘブライ語は、女性の召使いを指す場合もある。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「そして彼女たちは産んだ」。文脈上、神の癒やしによって出産できるようになったことを表している。
    reason: contextual_clarification
lexical_decisions:
- source_word: וַיִּתְפַּלֵּל
  choice: 祈った
  rationale: התפללはここで「祈る」を意味する。文脈上はアビメレクのための執り成しだが、動詞自体にその意味を明示する必要はない。
- source_word: אֶל הָאֱלֹהִים
  choice: 神に
  rationale: 定冠詞を伴うが、唯一の神を指す日本語として自然に「神に」とした。
- source_word: וַיִּרְפָּא
  choice: 癒やされた
  rationale: רפאの基本義「癒やす」を保ち、どのような症状だったかは本文で過度に限定しない。
- source_word: אֶת אֲבִימֶלֶךְ
  choice: アビメレク
  rationale: 固有名を日本語の標準的な音写で示した。
- source_word: אִשְׁתּוֹ
  choice: その妻
  rationale: アビメレクの妻を指す所有表現を自然な日本語にした。
- source_word: אַמְהֹתָיו
  choice: 彼の女奴隷たち
  rationale: אָמָהは隷属身分にある女性を表し得るため、その社会的身分と性別を明確に保った。「女中」などは意味を弱め、古風でもある。
- source_word: וַיֵּלֵדוּ
  choice: そして、女たちは子を産んだ
  rationale: ילדの「産む」を直接訳し、接続詞וは結果関係を明示せず「そして」とした。日本語では主語がアビメレクを含むように誤読されないよう「女たちは」を補い、目的語「子」も自然な表現として補った。
theological_decisions:
- issue: 最後の動詞と癒やしとの関係
  choice: 「そして、女たちは子を産んだ」と順接で訳す。
  alternative: 「その結果、女たちは子を産んだ」または「女たちが子を産めるようにされた」
  rationale: 文脈、とりわけ次節は出産の回復が癒やしの結果であることを示すが、この節の接続詞自体は因果だけに限定されない。本文ではヘブライ語の連続性と曖昧さを保ち、結果の含意は注で説明した。
- issue: אָמָהが示す社会的身分
  choice: 「女奴隷たち」
  alternative: 「女性の召使いたち」「はしためたち」
  rationale: 語が女性の奴隷・隷属者を指し得る点を薄めず、現代の読者に明瞭な語を選んだ。古風な「はしため」は避けた。
translation_notes:
  register: 明瞭で現代的かつ荘重な叙述。「癒やされた」は聖書本文にふさわしい自然な敬語表現ではなく、神を主語とする通常の能動表現として用いた。女性たちだけが出産したことが明確になるよう、後半で主語を補った。
