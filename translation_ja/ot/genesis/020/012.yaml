  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/גַם אָמְנָ֗ה אֲחֹתִ֤/י בַת אָבִ/י֙ הִ֔וא אַ֖ךְ לֹ֣א בַת אִמִּ֑/י וַ/תְּהִי לִ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/012.yaml
  text: Besides[a], she really is my sister—the daughter of my father, though not the daughter of my mother—and she became my wife.
translation:
  language: ja
  text: そのうえ[a]、彼女は確かに私の女きょうだいです。父の娘ではありますが、母の娘ではありません。そして彼女は私の妻になりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には、「そしてまた、確かに彼女は私の女きょうだいです」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: そのうえ
  rationale: アブラハムが弁明にさらに一つの事実を付け加える談話上の働きを、自然な現代日本語で表す。
- source_word: אָמְנָה
  choice: 本当です
  rationale: 自分の主張が事実であると強く認める副詞の意味を、話し言葉として明快に表す。
- source_word: אֲחֹתִי
  choice: 私の妹
  rationale: 一人称単数接尾辞を伴う親族名称。日本語ではこの文脈で年下の女性きょうだいを指す伝統的かつ自然な訳語を採る。
- source_word: בַת אָבִי
  choice: 父の娘
  rationale: 彼女がどの意味で妹なのかを説明する同格的表現を簡潔に保つ。
- source_word: הִוא
  choice: 彼女が…である
  rationale: ヘブライ語の無動詞名詞文を、日本語の現在的な判断文として表す。
- source_word: אַךְ לֹא
  choice: …ではありますが、…ではありません
  rationale: 前の主張を限定する対照・留保を、自然な譲歩構文で示す。
- source_word: בַת אִמִּי
  choice: 母の娘
  rationale: 「父の娘」との並行性を保ち、母を同じくしないことを明示する。
- source_word: וַתְּהִי לִי לְאִשָּׁה
  choice: そして、私の妻になった
  rationale: היה と二つの ל による婚姻関係への移行を、状態ではなく出来事として表す。
theological_decisions:
- issue: 「妹」が半妹を意味するというアブラハムの主張
  choice: 父の娘だが母の娘ではないという原文の説明をそのまま保持する
  alternative: 近親婚に関する後代の規定との調和を本文に補う
  rationale: 本文はアブラハムの弁明を記録しているため、その倫理的・法的評価を翻訳で付加せず、原文の緊張を残す。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、弁明としての落ち着いた品位を保った。「そのうえ」で追加的な論旨を示し、脚注により接続詞と強意副詞のより形式的な訳を提示した。
