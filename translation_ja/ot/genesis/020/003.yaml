- from: ところが、神は夜、夢の中でアビメレクのもとに来て、こう言われた。「見よ、あなたは死ぬ[a]。あなたが迎え入れた女のためだ。彼女には夫がいる[b]。」
  to: しかし、神は夜、夢の中でアビメレクのもとに来て、彼に言われた。「見よ、あなたは死ぬ[a]。あなたが取った女には夫がいるからだ[b]。」
  rationale: 接続を過度に逆接化せず、לָקַח（取る）に含まれない歓迎のニュアンスを除いた。また、死の宣告の理由を自然な日本語で明示し、脚注bは原文の婚姻慣用表現を反映しつつ、所有関係を不必要に強調しない説明へ改めた。
