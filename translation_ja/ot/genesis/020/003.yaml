source:
  edition: WLC
  text: וַ/יָּבֹ֧א אֱלֹהִ֛ים אֶל אֲבִימֶ֖לֶךְ בַּ/חֲל֣וֹם הַ/לָּ֑יְלָה וַ/יֹּ֣אמֶר ל֗/וֹ הִנְּ/ךָ֥ מֵת֙ עַל הָ/אִשָּׁ֣ה אֲשֶׁר לָקַ֔חְתָּ וְ/הִ֖וא בְּעֻ֥לַת בָּֽעַל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/003.yaml
  text: But God came to Abimelech in a dream by night and said to him[a], “Behold, you are a dead man because of the woman whom you have taken[c][b], for she is married.”
translation:
  language: ja
  text: しかし、神は夜、夢の中でアビメレクのもとに来て、彼に言われた。「見よ、あなたは死ぬ[a]。あなたが取った女には夫がいるからだ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「見よ、あなたは死んだ者だ」。確実で差し迫った死を告げる表現。
    reason: 原文の分詞表現が持つ現在的な形と、未来の死を宣告する意味の幅を示すため。
  - marker: b
    text: ヘブライ語は直訳に近くは「夫のある女」のような言い方。彼女がすでに夫を持つ、すなわち既婚の女性であることを示す。
    reason: בְּעֻלַת בָּעַל の重畳的な婚姻表現と、自然な本文訳では見えにくい語法を示すため。
lexical_decisions:
- source_word: וַיָּבֹא
  choice: もとに来て
  rationale: 夢による神の接近を表す物語上の動詞として、場所への物理的な侵入を過度に示さず、自然に訳した。
- source_word: בַּחֲלוֹם הַלָּיְלָה
  choice: 夜、夢の中で
  rationale: 夜間の夢による啓示であることを、明快で自然な現代日本語で表した。
- source_word: הִנְּךָ מֵת
  choice: 見よ、あなたは死ぬ
  rationale: הִנֵּה の警告的な力を「見よ」で保ち、分詞 מֵת が示す確実で差し迫った死を日本語では自然な未来表現で示した。現在・未来の幅は脚注に残した。
- source_word: לָקַחְתָּ
  choice: 迎え入れた
  rationale: 単に移動させたというより、女を自分のもとに取った文脈を表す。「奪った」のように、動詞自体に明示されない暴力性は加えていない。
- source_word: בְּעֻלַת בָּעַל
  choice: 彼女には夫がいる
  rationale: 既存の婚姻関係を明瞭かつ自然に示した。ヘブライ語の所有・支配を連想させる語形上の響きは脚注で補った。
theological_decisions:
- issue: הִנְּךָ מֵת の時制と警告の確実性
  choice: 見よ、あなたは死ぬ
  alternative: 見よ、あなたは死んだ者だ／死ぬ身だ
  rationale: 実際にはまだ生きているアビメレクへの、確実で差し迫った死の宣告として訳した。ただし、原文の現在的な表現を一義的な未来時制に固定しないよう脚注を付した。
- issue: בְּעֻלַת בָּעַל の婚姻表現
  choice: 彼女には夫がいる
  alternative: 彼女は夫のある女だ／夫に属する女だ
  rationale: 本文では婚姻の事実を自然に伝え、女性を所有物と断定する訳語は避けた。一方、原文の語感は脚注に示した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の厳粛な警告には「見よ」を残した。「こう言われた」は尊厳を保ちつつ、古風な「仰せられた」は避けた。
