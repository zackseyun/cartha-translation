  text: וַ/יְהִ֞י כַּ/אֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗/י אֱלֹהִים֮ מִ/בֵּ֣ית אָבִ/י֒ וָ/אֹמַ֣ר לָ֔/הּ זֶ֣ה חַסְדֵּ֔/ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑/י אֶ֤ל כָּל הַ/מָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּ/ה אִמְרִי לִ֖/י אָחִ֥/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/020/013.yaml
  text: 'And when God caused me to wander from my father’s house[a], I said to her, ‘This is the kindness you must show me: at every place we come to, say of me[b], “He is my brother.”’'
translation:
  language: ja
  text: 神が私を父の家から離れさせ、さすらわせたとき[a]、私は彼女に言った。『あなたが私にしてくれる親切[b]はこうだ。私たちがどこへ行っても、私のことを「この人は私の兄です」と言ってくれ。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「さすらわせた」は、「迷い歩かせた」とも訳せる。原語の動詞は使役形で、定まった場所を離れて各地を巡ることも、道を外れることも表し得る。ここでは必ずしも道徳的な過ちを意味しない。
    reason: lexical_alternative
  - marker: b
    text: 「親切」に当たるヘブライ語ヘセドは、文脈によって「変わらぬ愛」「誠実な慈しみ」といった意味をも含む。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְעוּ
  choice: 各地をさまようようにされた
  rationale: ヒフィル形の使役的な意味を保ちつつ、道徳的な逸脱を不必要に連想させない表現とした。移動の定まらない状態を自然な日本語で示す。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、文脈ではアブラハムの神を指しており、単数の「神」が適切である。
- source_word: מִבֵּית אָבִי
  choice: 父の家から離れ
  rationale: 家屋だけでなく父の家族・生活共同体をも含み得る慣用句。「父の家」を残し、動詞とのつながりを自然にした。
- source_word: חַסְדֵּךְ
  choice: 親切
  rationale: חסדは忠実な愛や誠実な慈しみを含み得るが、この場面では妻に求める具体的な好意なので「親切」が明瞭で自然である。
- source_word: תַּעֲשִׂי עִמָּדִי
  choice: 私に…示してほしい
  rationale: 字義的には「私とともに行う」だが、חסדとの結びつきを日本語らしく表現した。後続の内容が依頼を具体化するため、「示してほしい」とした。
- source_word: אֶל כָּל הַמָּקוֹם אֲשֶׁר נָבוֹא שָׁמָּה
  choice: どこへ行っても
  rationale: 直訳的な「私たちが行くすべての場所で」の分配的意味を、明快で自然な現代日本語にした。
- source_word: אִמְרִי לִי
  choice: 私のことを…言ってくれ
  rationale: 前置詞 לִי は字義的には「私に／私のために」だが、文脈上は他者にアブラハムについて言うことを求めているため、この表現が自然である。
- source_word: אָחִי הוּא
  choice: この人は私の兄です
  rationale: 日本語では話者サラから見た年長の男性きょうだいを指す自然な語として「兄」を用いた。「この人」を補い、第三者への発言として明瞭にした。
theological_decisions:
- issue: アブラハムをさまよわせた主体
  choice: 神がアブラハムを父の家から離れ、各地をさまようようにされた
  alternative: 神がアブラハムの放浪を許された／神々がアブラハムをさまよわせた
  rationale: ヘブライ語は神を使役動詞の文法的主語としているため、神の作用を「許された」に弱めない。一方、「迷わせた」は欺きや道徳的逸脱を強く示し得るので避けた。文脈上 אֱלֹהִים は単数の神を指す。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、神の使役的な働きという原文の神学的緊張を保った。会話部分は尊厳を損なわない自然な依頼表現とした。脚注標識は、aを該当する「さまようようにされたとき」の直後、bを引用発言全体の直後に置いた。
