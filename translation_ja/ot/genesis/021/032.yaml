  yaml_path: translation/ot/genesis/021/032.yaml
  text: So they made a covenant at Beer-sheba[a], and Abimelech rose up with Phicol, the commander of his army, and they returned to the land of the Philistines.
translation:
  language: ja
  text: こうして、彼らはベエル・シェバで契約を結んだ[a]。アビメレクは軍の長ピコルと共に立ち上がり、二人はペリシテ人の地へ帰って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「契約を切った」。契約を結ぶことを表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ בְרִית
  choice: 彼らは契約を結んだ
  rationale: 直訳は「契約を切った」だが、これは契約締結を表すヘブライ語の慣用句である。現代日本語として自然で、意味を正確に伝える「契約を結んだ」とした。
- source_word: בִּבְאֵר שָׁבַע
  choice: ベエル・シェバで
  rationale: 前置詞 ב はこの文脈では行為の場所を示すため、日本語では「で」が自然である。地名は原語の複合名を意識して「ベエル・シェバ」と表記した。
- source_word: וַיָּקָם
  choice: 立ち上がり
  rationale: קום の基本義「立つ、立ち上がる」を保ちつつ、出発へ移る物語の流れにも自然に合う表現とした。
- source_word: וּפִיכֹל
  choice: ピコルと共に
  rationale: 接続詞は字義的には「そして」だが、後続の複数動詞の主体がアビメレクとピコルであることを明瞭にするため、日本語として自然な「と共に」とした。
- source_word: שַׂר צְבָאוֹ
  choice: 軍の長
  rationale: שַׂר は長・指揮官、צָבָא はここでは軍を指す。「軍の長」は簡潔で格調を保ち、役割を明確に伝える。
- source_word: וַיָּשֻׁבוּ
  choice: 二人は…帰って行った
  rationale: שׁוּב は「戻る、帰る」。複数主語がアビメレクとピコルを指すことを自然な日本語で示すため「二人は」と明示し、移動先を伴う「帰って行った」とした。
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: ペリシテ人の地へ
  rationale: 原文の民族地理的表現「ペリシテ人の地」を保ち、方向を示す אֶל を「へ」で表した。
