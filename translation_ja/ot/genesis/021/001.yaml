base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/001.yaml
  text: Yahweh visited Sarah as he had said[a], and Yahweh did for Sarah as he had spoken.
translation:
  language: ja
  text: ヤハウェは、言われたとおりサラを顧みられ[a]、語られたとおりサラのために事を行われた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「顧みる」と訳したヘブライ語は、神が人に目を留め、その人のために働かれることを表す場合がある。「訪れる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を、一般的な日本語音写で表した。
- source_word: פָּקַד
  choice: 顧み
  rationale: 単に訪問することではなく、サラに目を留め、そのために実際に働くという文脈上の意味を簡潔に表す。語の含みは脚注で補った。
- source_word: כַּאֲשֶׁר אָמָר
  choice: 言われたとおり
  rationale: 先に語られた約束が実現したことを示す比較表現として、自然な日本語にした。
- source_word: וַיַּעַשׂ יְהוָה לְשָׂרָה
  choice: サラのために事を行われた
  rationale: עשהの広い意味を限定しすぎず、לְを受益者を示す『ために』として表した。
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: 語られたとおり
  rationale: 前半のאמר『言う』との語彙上の違いを保ちつつ、並行表現を自然に示した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が神の固有名を明記しているため、称号に置き換えず音写した。
- issue: 神がサラを『顧みる』ことの意味
  choice: 好意をもって目を留め、約束どおり働くことを含む表現
  alternative: 単にサラを訪問したと解する表現
  rationale: 直後の出産記事と約束成就の反復から、空間的な訪問だけでなく、サラのための有効な働きが含意される。ただし具体的結果はこの節の訳文に補わない。
translation_notes:
  register: 明瞭で格調のある現代標準日本語とした。神への敬意を示すため敬語形を用いながら、原文の二つの発話動詞と、עשהの包括的な表現をできるだけ保持した。
