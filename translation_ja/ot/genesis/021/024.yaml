  language: ja
  text: そこでアブラハムは言った。「私は誓います。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで…は言った
  rationale: ワウ継続法による物語の進行を示し、直前のアビメレクの求めに対する応答であることが自然に伝わる表現とした。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: אָנֹכִי
  choice: 私は
  rationale: 独立人称代名詞による主語の明示を保った。文脈上、強意の「私自身が」とまで訳す必要はない。
- source_word: אִשָּׁבֵעַ
  choice: 誓います
  rationale: שבע のニファル形は「誓う、誓約する」の意。ここではアビメレクの要求への承諾を表す未完了形であり、日本語では「誓います」が簡潔で自然である。
