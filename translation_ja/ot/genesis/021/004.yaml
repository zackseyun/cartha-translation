source:
  edition: WLC
  text: וַ/יָּ֤מָל אַבְרָהָם֙ אֶת יִצְחָ֣ק בְּנ֔/וֹ בֶּן שְׁמֹנַ֖ת יָמִ֑ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה אֹת֖/וֹ אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/004.yaml
  text: And Abraham circumcised Isaac his son when he was eight days old[a], just as God had commanded him.
translation:
  language: ja
  text: アブラハムは、神が命じられたとおり、生後八日[a]の息子イサクに割礼を施した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「八日の子」。
    reason: ヘブライ語の年齢を表す慣用句の字義的表現を示すため。
lexical_decisions:
- source_word: וַיָּמָל
  choice: 割礼を施した
  rationale: מולは割礼を行うことを具体的に表す。「割礼を施す」は、意味を正確に伝える自然で品位ある現代日本語である。
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: 息子イサクに
  rationale: 目的語標識を日本語の助詞「に」で表し、בְּנוֹを「息子」として残すことで、原文の親子関係への強調を保持した。
- source_word: בֶּן שְׁמֹנַת יָמִים
  choice: 生後八日
  rationale: 字義的には「八日の子」という年齢表現である。「生後八日」は簡潔で自然な日本語であり、イサクの年齢を正確に伝える。
- source_word: כַּאֲשֶׁר
  choice: とおり
  rationale: アブラハムの行為が神の命令に合致していたことを、自然な日本語で明確に示す。
- source_word: צִוָּה אֹתוֹ אֱלֹהִים
  choice: 神が命じられた
  rationale: 主語אֱלֹהִיםを「神」、動詞צִוָּהを敬意を伴う自然な表現「命じられた」とした。日本語では文脈上、命令の対象がアブラハムであることが明らかなため、目的語を重ねず簡潔にした。
theological_decisions:
- issue: 神の命令とアブラハムの行為の時間的関係
  choice: 神が命じられたとおり
  alternative: 神が彼に命じたとおり
  rationale: ヘブライ語の完了形は、割礼に先立つ神の命令を指す。日本語では「命じられたとおり」で先行する命令との関係が自然に伝わり、過去完了に相当する補足を加える必要がない。
- issue: 神に対する敬語表現
  choice: 命じられた
  alternative: 命じた
  rationale: 現代日本語の聖書文体として自然な尊敬表現を用いた。原文にない神学的内容を加えるものではない。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。原文の語順を機械的に再現せず、「神が命じられたとおり」を前に置いて日本語として自然な流れにした。「息子」を残し、原文の家族的な強調を保持した。
