source:
  edition: WLC
  text: וַ/תֹּ֨אמֶר֙ לְ/אַבְרָהָ֔ם גָּרֵ֛שׁ הָ/אָמָ֥ה הַ/זֹּ֖את וְ/אֶת בְּנָ֑/הּ כִּ֣י לֹ֤א יִירַשׁ֙ בֶּן הָ/אָמָ֣ה הַ/זֹּ֔את עִם בְּנִ֖/י עִם יִצְחָֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/010.yaml
  text: So she said to Abraham[a], “Drive out this servant woman and her son, for the son of this servant woman will not inherit with my son Isaac.”
translation:
  language: ja
  text: そこで彼女はアブラハムに言った。「この女奴隷[a]とその息子を追い出しなさい。この女奴隷の息子が、私の息子、イサクと一緒に相続することはないのだから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女召使い」とも訳せる。ただし、この語は隷属身分にある女性を指しうる。
    reason: lexical_alternative
lexical_decisions:
- source_word: גָּרֵשׁ
  choice: 追い出しなさい
  rationale: 強い命令形であり、単に送り出すのではなく、その場と共同体から排除する意味を明確に伝える。
- source_word: הָאָמָה
  choice: 女奴隷
  rationale: אָמָהは従属的な身分にある女性を指す。この文脈では社会的・法的な隷属身分が重要であるため、「女奴隷」とした。
- source_word: בְּנָהּ
  choice: その息子
  rationale: 三人称女性単数の所有接尾辞を、直前の「この女奴隷」を受ける自然な日本語で表した。
- source_word: כִּי לֹא יִירַשׁ
  choice: 相続することはないからです
  rationale: כִּיによる理由と、ירשׁの「相続する／相続人となる」という意味を保持する。禁止命令に変えず、否定された将来の事態として訳した。
- source_word: בֶּן הָאָמָה הַזֹּאת
  choice: この女奴隷の息子
  rationale: 指示語を伴う名詞句の反復を残し、サラの距離を置いた強い言い方を保った。
- source_word: עִם בְּנִי עִם יִצְחָק
  choice: 私の息子、イサクと一緒に
  rationale: 二度のעִםを逐語的に重ねると日本語では二人の息子を指すように誤解されうるため、「イサク」を「私の息子」の同格として自然に示した。
- source_word: וַתֹּאמֶר לְאַבְרָהָם
  choice: そこで彼女はアブラハムに言った
  rationale: 物語を進める接続形を、直前の出来事を受ける自然な日本語の「そこで」で表した。
theological_decisions:
- issue: לֹא יִירַשׁの否定を予告と禁止のどちらとして表すか
  choice: 「相続することはない」とし、文法上の否定された未完了形を保つ
  alternative: 「相続してはならない」
  rationale: 発言全体には強い要求があるが、この節自体を明示的な禁止にすると、ヘブライ語にない様態を加えることになるため。
translation_notes:
  register: 明快な現代標準日本語を用いながら、サラの命令の強さと反復による距離感を保持した。敬体は引用内の理由説明に自然な発話として用い、命令は「追い出しなさい」として直接性を残した。
