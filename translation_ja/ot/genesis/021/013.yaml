  text: וְ/גַ֥ם אֶת בֶּן הָ/אָמָ֖ה לְ/ג֣וֹי אֲשִׂימֶ֑/נּוּ כִּ֥י זַרְעֲ/ךָ֖ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/013.yaml
  text: And I will also make the son of the servant woman into a nation[a], because he is your offspring.
translation:
  language: ja
  text: また、女奴隷の息子をも一つの民としよう。彼はあなたの子孫だからだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: また、…も
  rationale: 接続と付加の意味を、自然な現代日本語の呼応表現で示した。
- source_word: אֶת בֶּן הָאָמָה
  choice: 女奴隷の息子
  rationale: אָמָהが表す隷属的な身分を曖昧にせず、簡潔で自然な日本語とした。
- source_word: לְגוֹי
  choice: 一つの国民と
  rationale: שׂיםとの組み合わせが示す結果を表し、ここでのגּוֹיを血縁的・民族的共同体として訳した。
- source_word: אֲשִׂימֶנּוּ
  choice: する
  rationale: 文脈では『据える』よりも、ある状態・存在へと成すという意味が自然である。目的語の代名詞は日本語では『息子も』により明白なため反復しなかった。
- source_word: כִּי
  choice: だからだ
  rationale: 前文の約束の理由を明示する因果関係を、現代日本語で自然に表した。
- source_word: זַרְעֲךָ
  choice: あなたの子孫
  rationale: זֶרַעはここでアブラハムから生まれた者を指す。日本語の『子孫』は個人にも一族にも用いられ、語の広がりを保てる。
- source_word: הוּא
  choice: 彼も…だ
  rationale: 明示された代名詞を『彼』で保ち、文脈上の付加的な強調を日本語では『も』によって自然に示した。
theological_decisions:
- issue: אָמָהが示す社会的身分
  choice: 女奴隷
  alternative: 女召使い／はしため
  rationale: ハガルの隷属的身分は物語上重要であり、婉曲化せずに訳した。
- issue: זֶרַעの単数的指示と集合的意味
  choice: 子孫
  alternative: 子／末裔
  rationale: この節ではイシュマエル個人を指しながら、彼から国民が生じるという集合的な広がりも響くため、その両面を許容する語を選んだ。
translation_notes:
  register: 簡潔で格調を保った現代標準日本語。神の発話として断定的な調子を維持しつつ、隷属身分を示す語を不必要に和らげなかった。
