review_pass:
  verdict: revise
  source_fidelity: ヘブライ語は「女奴隷の息子」を目的語として、神が「一つの民／国民」にすると約束し、その理由を「彼はあなたの子孫だから」と述べる。改訂案は付加（וְגַם）、将来の約束（אָסִים）、因果関係（כִּי）、および明示された代名詞（הוּא）を保つ。
  naturalness: 「一つの国民」は現代日本語ではやや不自然で、「国民」が個々の citizens を指すようにも聞こえる。「一つの民としよう」は、聖書文脈の集団・国民という意味を自然な現代標準日本語で表す。
  terminology: 「女奴隷」はאָמָהの隷属的身分を明瞭に示しており適切である。「民」はここでのגּוֹיの基本義に合い、「民族」「国民」は注で代替可能性として示せる。
  issues:
