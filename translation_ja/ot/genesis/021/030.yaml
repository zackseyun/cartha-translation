base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/030.yaml
  text: And he said[a], “You are to take these seven ewe lambs from my hand, so that it may serve as a witness for me that I dug this well.”
translation:
  language: ja
  text: そこで彼は言った。「この七匹の雌の子羊を私の手から受け取ってください。それが、私がこの井戸を掘ったことの証しとなるためです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「それ」は、七匹の雌の子羊を一まとまりとして指すとも、その授受の取り決めを指すとも理解できます。ヘブライ語の動詞は単数形です。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで彼は言った
  rationale: 物語を進めるワイイクトル形。文脈上の展開を自然な現代日本語で示しつつ、時間関係を過度に限定しない。
- source_word: אֶת שֶׁבַע כְּבָשֹׂת
  choice: この七匹の雌の子羊
  rationale: כְּבָשֹׂת は雌の羊を指す。直前に取り分けられ、眼前にある七匹なので、日本語では「この」を補うと自然である。
- source_word: תִּקַּח מִיָּדִי
  choice: 私の手から受け取ってください
  rationale: 二人称単数未完了形の要請・指示の力を、尊厳ある自然な依頼表現で示す。「手から」を残し、正式な授受の具体性を保つ。
- source_word: בַּעֲבוּר
  choice: ためです
  rationale: ここでは目的を表す。後続の証しの機能を明確に示す。
- source_word: תִּהְיֶה לִּי לְעֵדָה
  choice: それが…証しとなる
  rationale: 動詞は女性単数形であり、七匹を一まとまり、またはその授受の取り決めとして受ける表現にした。「私のための」は日本語では冗長になりやすく、証しの内容が話者の主張を支えることで意味を表した。
- source_word: כִּי חָפַרְתִּי אֶת הַבְּאֵר הַזֹּאת
  choice: 私がこの井戸を掘ったこと
  rationale: כִּי は証しの内容を導く。「この井戸」は定冠詞付き名詞と指示詞を明確に反映する。
