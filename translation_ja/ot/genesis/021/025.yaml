source:
  edition: WLC
  text: וְ/הוֹכִ֥חַ אַבְרָהָ֖ם אֶת אֲבִימֶ֑לֶךְ עַל אֹדוֹת֙ בְּאֵ֣ר הַ/מַּ֔יִם אֲשֶׁ֥ר גָּזְל֖וּ עַבְדֵ֥י אֲבִימֶֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/025.yaml
  text: Then Abraham reproved Abimelech about the well of water that Abimelech’s servants had seized.
translation:
  language: ja
  text: アブラハムは、アビメレクの僕たちが奪い取った井戸のことで、アビメレクに抗議した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹכִחַ
  choice: 抗議した
  rationale: 文脈では、アブラハムが井戸をめぐる不当な行為についてアビメレクに異議を申し立てることを表す。「責めた」よりも争議の場面に自然で、王本人が奪ったと断定しない。
- source_word: עַל אֹדוֹת
  choice: ことで
  rationale: 話題・理由を示す慣用句を、現代日本語で簡潔かつ自然に表した。
- source_word: בְּאֵר הַמַּיִם
  choice: 井戸
  rationale: 字義的には「水の井戸」だが、日本語では「井戸」だけで水を得る設備であることが明白なため、冗長さを避けた。
- source_word: גָּזְלוּ
  choice: 奪い取った
  rationale: 暴力または不当な占有を含意する強い動詞であり、「取り上げた」より原文の強さを保つ。
- source_word: עַבְדֵי אֲבִימֶלֶךְ
  choice: アビメレクの僕たち
  rationale: עֶבֶד は僕・家臣・使用人などを指し得る。身分を過度に特定せず、聖書本文として自然な「僕」を採用した。
theological_decisions:
- issue: アビメレク本人の責任の程度
  choice: アブラハムはアビメレクに抗議したが、井戸を奪った主体は明確に彼の僕たちとした。
  alternative: アビメレクが井戸を奪ったかのように訳す。
  rationale: 原文の主語を保ち、王の直接関与や事前の認識を本文以上に断定しない。
translation_notes:
  register: 明瞭で現代的だが、物語本文にふさわしい端正な文体。「僕」は「しもべ」より現代的な表記としつつ、語彙の広がりを保持した。
