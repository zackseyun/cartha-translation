  yaml_path: translation/ot/genesis/021/015.yaml
  text: When the water in the skin was gone[b][a], she cast the boy under one of the bushes.
translation:
  language: ja
  text: 革袋の水が尽きると、彼女はその子をある茂みの下に投げ出した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「投げ出した」と訳した原語は、単に「置いた」よりも強く、通常は「投げる」「投げやる」という意味です。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְלוּ הַמַּיִם מִן הַחֵמֶת
  choice: 革袋の水が尽きると
  rationale: כלהは水がすっかりなくなることを表すため、「尽きる」とした。חֵמֶתは動物の皮で作った液体用の容器なので、現代日本語で明瞭な「革袋」と訳した。
- source_word: וַתַּשְׁלֵךְ
  choice: 投げ出した
  rationale: שלךは通常「投げる、投げやる」を意味し、単に「置いた」より強い動作を表す。日本語として過度にぞんざいにならず、切迫した動作を伝える「投げ出した」とした。
- source_word: אֶת הַיֶּלֶד
  choice: その子
  rationale: יֶלֶדは子ども、または少年を指す一般的な語である。文脈上すでに知られているイシュマエルを指すため、年齢を必要以上に限定しない「その子」とした。
- source_word: תַּחַת אַחַד הַשִּׂיחִם
  choice: 茂みの一つの下に
  rationale: תחתは「下に」、שיחは低木や茂みを指す。「茂みの一つの下に」は原文の構造を保ちつつ、自然で理解しやすい。
