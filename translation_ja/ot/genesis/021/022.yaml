  text: וַֽ/יְהִי֙ בָּ/עֵ֣ת הַ/הִ֔וא וַ/יֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּ/פִיכֹל֙ שַׂר צְבָא֔/וֹ אֶל אַבְרָהָ֖ם לֵ/אמֹ֑ר אֱלֹהִ֣ים עִמְּ/ךָ֔ בְּ/כֹ֥ל אֲשֶׁר אַתָּ֖ה עֹשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/022.yaml
  text: And it happened at that time that Abimelech and Phicol[a], the commander of his army, said to Abraham[b], “God is with you in all that you do.”
translation:
  language: ja
  text: そのころ、アビメレクと、その軍の長ピコルは、アブラハムに言った。「神[a]は、あなたが何をするにも、あなたとともにおられる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は「神」が最も自然。ヘブライ語は、文脈によっては「ある神」または「神々」とも理解し得る語である。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בָּעֵת הַהִוא
  choice: そのころ
  rationale: 新しい場面を導入する物語表現と時を示す句を、自然で簡潔な現代日本語にまとめた。
- source_word: וַיֹּאמֶר אֲבִימֶלֶךְ וּפִיכֹל
  choice: アビメレクは…ピコルとともに…言った
  rationale: 動詞は単数形だが、後続する二名が発話の主体として示される。日本語では主たる人物をアビメレクとし、ピコルの同行・共同関与を自然に表した。
- source_word: שַׂר צְבָאוֹ
  choice: 軍の長
  rationale: שַׂרは長・司令官を表し、צָבָאはここでは軍勢を指す。簡潔で格調を保つ表現を選んだ。
- source_word: אֶל־אַבְרָהָם לֵאמֹר
  choice: アブラハムに言った
  rationale: לֵאמֹרは直接話法を導く定型句であり、日本語で「言って言った」と重ねず自然に訳した。
- source_word: אֱלֹהִים עִמְּךָ
  choice: 神は…あなたとともにおられる
  rationale: 文脈上、アブラハムを祝福する神を指すのが最も自然である。עםは単なる近接だけでなく臨在や助けを含み得るため、伝統的かつ明瞭な表現とした。
- source_word: בְּכֹל אֲשֶׁר אַתָּה עֹשֶׂה
  choice: あなたが何をするにも
  rationale: 包括的な範囲を示す句を、一般的・継続的な行為に合う自然な日本語で表した。
theological_decisions:
- issue: アビメレクの言葉における אֱלֹהִים の指示対象
  choice: 神
  alternative: ある神／神々
  rationale: 語形だけなら複数または不定の解釈が可能な場合もあるが、この文脈ではアブラハムとともにいて彼を恵む神を指すのが最も自然である。ただし語の潜在的な別解は脚注に残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「ともにおられる」によって聖書本文にふさわしい落ち着いた格調を保った。固有名詞は日本語聖書で広く通用する形にした。
