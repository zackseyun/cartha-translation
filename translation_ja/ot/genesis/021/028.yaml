translation:
  language: ja
  text: アブラハムは、群れの雌の子羊七匹を別に置いた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「群れから分けて置いた」とも訳せる。ヘブライ語は、この七匹をほかの群れとは別の位置に置いたことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֵּב
  choice: 別にして置いた
  rationale: ヒフィル形は「立たせる、所定の位置に置く」を表す。ここでは後続の לְבַדְּהֶן と合わせ、七匹をほかから区別して配置した具体的な動作を自然な日本語で示す。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 日本語聖書で定着した人名表記を用いる。
- source_word: אֶת
  choice: （訳出せず）
  rationale: 定目的語を示す標識であり、日本語では語順と助詞によって表す。
- source_word: שֶׁבַע
  choice: 七匹
  rationale: 基数「七」を、数える対象が羊であることに合わせて助数詞「匹」で表す。
- source_word: כִּבְשֹׂת
  choice: 雌の子羊
  rationale: 女性複数形で、性別と若い羊であることの双方を明示する。
- source_word: הַצֹּאן
  choice: 群れの中から
  rationale: צֹאן は羊や山羊などの小家畜の集合を指し得る。ここでは雌の子羊を群れから分ける場面なので、「群れ」として範囲を不必要に狭めず、分離の関係を自然に示す。
- source_word: לְבַדְּהֶן
  choice: 別にして
  rationale: 七匹の雌の子羊をほかの群れから分けたことを示す女性複数の表現。日本語では「別にして」が明瞭で自然である。
