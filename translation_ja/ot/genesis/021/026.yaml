source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/גַם אַתָּ֞ה לֹא הִגַּ֣דְתָּ לִּ֗/י וְ/גַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַ/יּֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/026.yaml
  text: And Abimelech said[a], “I did not know who had done this thing. You also did not tell me, and I myself had not heard of it until today.”
translation:
  language: ja
  text: アビメレクは言った。「だれがこのこと[a]をしたのか、私は知らなかった。あなたも私に知らせなかったし、私自身も今日まで聞いていなかった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この事柄」または「この出来事」とも訳せる。ヘブライ語の「ダーバール」は、こと、事柄、出来事などを意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: は言った
  rationale: 物語を進めるワウ継続法を、日本語の自然な叙述に合わせて単純過去で表した。
- source_word: אֲבִימֶלֶךְ
  choice: アビメレク
  rationale: 人名を日本語聖書で一般的な形に音写した。
- source_word: לֹא יָדַעְתִּי
  choice: 私は知らなかった
  rationale: アビメレクがそれ以前には知らなかったことを述べる完了形を、自然な過去形で表した。
- source_word: מִי עָשָׂה
  choice: だれが…したのか
  rationale: 行為者が不明であることを示す間接疑問として自然に訳した。
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: このこと
  rationale: דבר は「こと・事柄・出来事」などを意味し、ここでは問題となっている一件を指すため「このこと」とした。
- source_word: וְגַם אַתָּה לֹא הִגַּדְתָּ לִּי
  choice: あなたも私に知らせなかったし
  rationale: גם の付加・強調を「も」で保ち、הגיד は文脈上、情報を伝える意味なので「知らせる」とした。
- source_word: וְגַם אָנֹכִי לֹא שָׁמַעְתִּי
  choice: 私自身も…聞いていなかった
  rationale: 独立代名詞 אָנֹכִי の明示的な強調を「私自身」で表し、事件について報告を受けていなかった意味を自然な日本語にした。
- source_word: בִּלְתִּי הַיּוֹם
  choice: 今日まで
  rationale: 今日に至るまで聞いていなかったという時間的な限界を、簡潔で自然な日本語で表した。
theological_decisions: []
