base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/016.yaml
  text: Then she went and sat down opposite him[a], at a distance, about a bowshot away, for she said, “Let me not look on the death of the boy.” So she sat opposite him and lifted up her voice and wept.
translation:
  language: ja
  text: 彼女はそこから離れて行き、およそ弓の射程ほど離れた所、向かい側に座った。「あの子が死ぬのを見たくない」[a]と思ったからである。こうして彼女は向かい側に座り、声を上げて泣いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あの子の死を見ないで」。
    reason: 原文は「あの子が死ぬ」という動詞的表現ではなく、「あの子の死」という名詞的な表現を用いている。
lexical_decisions:
- source_word: מִנֶּגֶד
  choice: 向かい側に
  rationale: 対象と向かい合いながら距離を置く空間的な意味を保つ。同じ語が二度用いられているため、訳語も反復した。文脈上の対象は、前節で低木の下に置かれた子どもである。
- source_word: הַרְחֵק
  choice: 離れた
  rationale: 距離を置くという副詞的な強調を、後続の弓矢による距離表現と自然につながる現代日本語にした。
- source_word: כִּמְטַחֲוֵי קֶשֶׁת
  choice: 弓矢の届くほど
  rationale: 弓を射る距離をおおよその目安とする比喩を、簡潔で分かりやすい日本語で保持した。
- source_word: הַיָּלֶד
  choice: あの子
  rationale: יֶלֶדは子ども・少年を指し得る。母親の心中の言葉として自然であり、年齢を必要以上に限定しない表現を選んだ。
- source_word: אַל אֶרְאֶה בְּמוֹת הַיָּלֶד
  choice: あの子が死ぬのを見たくない
  rationale: 否定を伴う一人称の意志・願望を自然な日本語で表した。原文は名詞的に「子どもの死を見る」とも取れるため、その形は脚注で示した。
- source_word: וַתִּשָּׂא אֶת־קֹלָהּ
  choice: 声を上げて
  rationale: 声を高く上げるというヘブライ語の慣用句を、日本語の哀哭表現として自然に訳した。
- source_word: וַתֵּבְךְּ
  choice: 泣いた
  rationale: 直前の「声を上げて」と組み合わせ、声を伴う嘆きを明瞭に表した。
- source_word: לָהּ
  choice: （独立した訳語を置かない）
  rationale: 座る主体への与格で、彼女がその場に身を置いたことを添える用法と判断した。「一人で」と明示すると、原文以上に孤立を強調する可能性があるため、日本語では動詞に含ませた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語としての簡潔さと母親の悲痛な心情を保った。「向かい側に」の反復は原文の反復に対応する。
