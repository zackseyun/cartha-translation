translation:
  language: ja
  text: アブラハムは、自分に生まれ、サラが彼に産んだ息子を、イサクと名づけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שֵׁם
  choice: 名づけた
  rationale: 「名を呼ぶ」というヘブライ語の慣用表現を、意味を保ちながら自然な現代日本語で表した。
- source_word: בְּנוֹ
  choice: 息子
  rationale: 接尾辞が示すアブラハムとの親子関係は、文中の「自分に」によって明確になるため、自然な日本語として「息子」とした。
- source_word: הַנּוֹלַד לוֹ
  choice: 自分に生まれた
  rationale: 分詞句と関係を示す לוֹ を保ち、アブラハムに息子が生まれたという意味を表した。
- source_word: אֲשֶׁר יָלְדָה לּוֹ שָׂרָה
  choice: すなわちサラが彼に産んだ子
  rationale: 母がサラであることと、原文で反復される לוֹ を残した。「すなわち」により、同じ息子を説明する句であることを明確にした。
- source_word: יִצְחָק
  choice: イサク
  rationale: 日本語聖書で定着している固有名の表記を用いた。
