  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּ֖שֶׁב בְּ/מִדְבַּ֣ר פָּארָ֑ן וַ/תִּֽקַּֽח ל֥/וֹ אִמּ֛/וֹ אִשָּׁ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/021.yaml
  text: He lived in the wilderness of Paran[b][a], and his mother took a wife for him from the land of Egypt.
translation:
  language: ja
  text: 彼はパランの荒野に住んだ。彼の母は、彼のためにエジプトの地から妻を迎えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: 住んだ
  rationale: ישׁב は「座る、住む、とどまる」の意を持つ。ここでは居住を述べる物語上の要約なので、永住の含みを強めず自然な「住んだ」とした。
- source_word: בְּמִדְבַּר פָּארָן
  choice: パランの荒野に
  rationale: מִדְבָּר は荒野・原野・砂漠を指し得る。地勢を砂漠に限定しすぎない、聖書物語として自然な「荒野」を採用し、פָּארָן は地名として「パラン」と音写した。
- source_word: וַתִּקַּח לוֹ אִמּוֹ אִשָּׁה
  choice: 彼の母は、彼のために……妻を迎えた
  rationale: לקח の基本義は「取る」だが、この文脈では母が息子の結婚相手を得る行為を表す。日本語では「妻を取った」だと息子自身が主体であるかのように響きやすいため、母による縁組を自然に示す「妻を迎えた」とした。לוֹ は「彼のために」と明示した。
- source_word: אִשָּׁה
  choice: 妻
  rationale: אִשָּׁה は「女」または「妻」を意味するが、ここでは息子のために結婚相手を迎える文脈なので「妻」が適切である。
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: エジプトの地から
  rationale: 原文に אֶרֶץ（地）が明記されているため、「エジプトから」と省略せず「エジプトの地から」とした。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、簡潔で品位ある物語文とした。「迎えた」は現代日本語として自然でありつつ、母が息子の婚姻を取り決めたという原文の関係を保つ。原文末の段落区分（פ）は本文には表示しない。
