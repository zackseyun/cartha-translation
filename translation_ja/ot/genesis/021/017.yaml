  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֣ע אֱלֹהִים֮ אֶת ק֣וֹל הַ/נַּעַר֒ וַ/יִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים אֶל הָגָר֙ מִן הַ/שָּׁמַ֔יִם וַ/יֹּ֥אמֶר לָ֖/הּ מַה לָּ֣/ךְ הָגָ֑ר אַל תִּ֣ירְאִ֔י כִּֽי שָׁמַ֧ע אֱלֹהִ֛ים אֶל ק֥וֹל הַ/נַּ֖עַר בַּ/אֲשֶׁ֥ר הוּא שָֽׁם־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/017.yaml
  text: And God heard the boy’s voice[a], and the angel of God called to Hagar from heaven and said to her, “What is the matter with you, Hagar? Do not fear, for God has heard the boy’s voice where he is.”
translation:
  language: ja
  text: 神は少年の声[a]を聞かれた。神の使いは天からハガルに呼びかけて言った。「ハガル、どうしたのか。恐れてはならない。神は、少年がいる所からの声を聞かれたからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「少年の叫び」とも訳せる。ヘブライ語の「声」は、この文脈では苦しみの叫びを指し得る。後半も同じ。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע אֱלֹהִים
  choice: 神は……聞かれた
  rationale: שׁמע の基本義「聞く」を保ちつつ、現代日本語の聖書文として自然な敬意表現とした。「答えられた」と解釈を加えない。
- source_word: אֶת קוֹל הַנַּעַר
  choice: 少年の声
  rationale: קוֹל の字義的な「声」を採用し、節内の反復を保つ。文脈上は苦しみの叫びを指し得るため脚注で示す。נַעַר は現代語として自然な「少年」とした。
- source_word: וַיִּקְרָא מַלְאַךְ אֱלֹהִים
  choice: 神の使いは……呼びかけて
  rationale: מַלְאַךְ אֱלֹהִים を「神の使い」とし、その存在の神学的同定を翻訳で限定しない。קרא は相手に声をかける文脈なので「呼びかける」とした。
- source_word: מִן הַשָּׁמַיִם
  choice: 天から
  rationale: שׁמים は形態上複数だが、この場所表現では日本語の慣用に従い「天」とする。
- source_word: מַה לָּךְ
  choice: どうしたのか
  rationale: 直訳的には「あなたに何があるのか」だが、相手の異変や苦境を問うヘブライ語の慣用句として、明瞭で自然な現代日本語にした。
- source_word: אַל תִּירְאִי
  choice: 恐れてはならない
  rationale: 否定命令の直接性と dignified register を保つ。対象が女性単数であることは日本語では文脈によって示される。
- source_word: כִּי שָׁמַע אֱלֹהִים
  choice: 神は……聞かれたからだ
  rationale: כִּי の理由提示を「からだ」で明示する。完了形は直前の出来事を受けて「聞かれた」とした。
- source_word: בַּאֲשֶׁר הוּא שָׁם
  choice: 少年がいるその場所から上げる声
  rationale: 字義は「彼がそこにいるところで」。日本語で直前の「声」と自然に結びつけ、神が少年の現在いる場所・境遇においてその声を聞いた意味を表した。
- source_word: הַנַּעַר
  choice: 少年
  rationale: イシュマエルを指す若い男性の呼称として、古風な「わらべ」や年齢幅の広い「若者」を避けた。
theological_decisions:
- issue: מַלְאַךְ אֱלֹהִים の存在が神と密接に結びついて語られること
  choice: 神の使い
  alternative: 神の御使い／神の天使
  rationale: 原文の構成句を自然に表しつつ、この使いの厳密な身分や神との同一性を翻訳によって決着させない。「御使い」は教会語的であり、「天使」は後代的なイメージを伴いやすいため避けた。
- issue: בַּאֲשֶׁר הוּא שָׁם が場所だけでなく現状・境遇を含意する可能性
  choice: 少年がいるその場所から上げる声
  alternative: 少年が今いるその所で／少年のいる所で
  rationale: 基本の場所的意味を本文に残し、神が少年の現状を顧みたという含意を過度に説明しない。
translation_notes:
  register: 明瞭な現代標準語を用い、物語文には簡潔で品位ある調子を保った。神への敬意は「聞かれた」で示す一方、過度な古語や教会特有の語彙は避けた。
