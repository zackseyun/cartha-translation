id: GEN.21.27
reference: Genesis 21:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח אַבְרָהָם֙ צֹ֣אן וּ/בָקָ֔ר וַ/יִּתֵּ֖ן לַ/אֲבִימֶ֑לֶךְ וַ/יִּכְרְת֥וּ שְׁנֵי/הֶ֖ם בְּרִֽית׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/027.yaml
  text: So Abraham took sheep and cattle and gave them to Abimelech[a], and the two of them made a covenant.
translation:
  language: ja
  text: そこでアブラハムは羊と牛を取ってアビメレクに与え、二人は契約を結んだ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「契約を切った」。契約を正式に結ぶことを表す、ヘブライ語の定型表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 取って
  rationale: לקחの通常の意味「取る」を保ち、連続する物語の動作として自然な日本語にした。
- source_word: צֹאן
  choice: 羊
  rationale: 小家畜を指し、続くבקרとの対比を明瞭にする。語義上は山羊を含み得るが、ここでは簡潔で慣用的な「羊」とした。
- source_word: וּבָקָר
  choice: 牛
  rationale: 大型の家畜、とりわけ牛を指すため、現代日本語で自然な「牛」とした。
- source_word: וַיִּתֵּן לַאֲבִימֶלֶךְ
  choice: アビメレクに与え
  rationale: נתןと前置詞לの直接的な意味を保ち、本文にない儀礼性を加えない。
- source_word: שְׁנֵיהֶם
  choice: 二人
  rationale: 契約当事者が両者であることを明示するヘブライ語を簡潔に表した。
- source_word: וַיִּכְרְתוּ ... בְּרִית
  choice: 契約を結んだ
  rationale: 字義的には「契約を切る」だが、日本語の標準的な表現「契約を結ぶ」で慣用句の意味を伝え、字義は脚注に残した。
theological_decisions:
- issue: 契約慣用句 כרת ברית の訳し方
  choice: 契約を結んだ
  alternative: 契約を切った
  rationale: 現代日本語として自然でありながら、בְּרִיתを重要な聖書用語「契約」として保持する。ヘブライ語固有の表現は脚注で明示し、契約概念の含意を失わないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の順次性を「そこで」と連用形で自然に表し、原文の簡潔さを維持した。脚注記号[a]は、説明対象である「契約を結んだ」の直後に置いた。
