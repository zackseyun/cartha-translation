source:
  edition: WLC
  text: וַ/יְהִ֧י אֱלֹהִ֛ים אֶת הַ/נַּ֖עַר וַ/יִּגְדָּ֑ל וַ/יֵּ֨שֶׁב֙ בַּ/מִּדְבָּ֔ר וַ/יְהִ֖י רֹבֶ֥ה קַשָּֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/020.yaml
  text: God was with the boy[a], and he grew. He lived in the wilderness and became an archer.
translation:
  language: ja
  text: 神はその少年と共におられ、少年は成長した。彼は荒野に住み、弓を射る者となった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אֱלֹהִים אֶת הַנַּעַר
  choice: 神はその少年と共におられ
  rationale: 「היה את」はここで臨在や支えを表す慣用句。「共におられ」は、イシュマエルに対する神の守りを説明しすぎず、自然で格調ある日本語で伝える。
- source_word: הַנַּעַר
  choice: その少年
  rationale: נַעַר は少年または若者を指す。文脈上のイシュマエルを受け、「その少年」とした。
- source_word: וַיִּגְדָּל
  choice: 少年は成長した
  rationale: גדל はここでは身体的・年齢的な成長を表す。主語を補い、日本語で明瞭にした。
- source_word: וַיֵּשֶׁב בַּמִּדְבָּר
  choice: 彼は荒野に住み
  rationale: ישב は継続的な居住を表し、מִדְבָּר は必ずしも砂漠に限らない人里離れた土地なので、「荒野に住み」とした。
- source_word: וַיְהִי רֹבֶה קַשָּׁת
  choice: 弓を射る者となった
  rationale: 難解な連語だが、弓を射る者になったという意味を、語の構成が見える自然な日本語で表した。「射手」より一般読者に明瞭である。
theological_decisions:
- issue: イシュマエルに対する神の臨在
  choice: 神はその少年と共におられ
  alternative: 神はその少年を助けられ
  rationale: 本文は神の臨在と支えを述べるが、その神学的含意を詳説していない。「共におられ」として、その肯定を限定も拡張もせず保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神については敬語表現「おられ」を採用した。「弓を射る者」は逐語性と分かりやすさを両立させる表現とした。
