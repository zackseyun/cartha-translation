id: GEN.21.12
reference: Genesis 21:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֜ים אֶל אַבְרָהָ֗ם אַל יֵרַ֤ע בְּ/עֵינֶ֨י/ךָ֙ עַל הַ/נַּ֣עַר וְ/עַל אֲמָתֶ֔/ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛י/ךָ שָׂרָ֖ה שְׁמַ֣ע בְּ/קֹלָ֑/הּ כִּ֣י בְ/יִצְחָ֔ק יִקָּרֵ֥א לְ/ךָ֖ זָֽרַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/012.yaml
  text: But God said to Abraham[a], “Do not let it be grievous in your sight because of the boy and because of your servant woman. Whatever Sarah says to you, listen to her voice[d][c][b], for through Isaac your offspring will be called.”
translation:
  language: ja
  text: しかし神はアブラハムに言われた。「その子のことでも、あなたの女奴隷[a]のことでも、つらく思ってはならない。[b] サラがあなたに言うことは、何であれ、その声に聞き従いなさい。[c] イサクを通して、あなたの子孫が呼ばれるからである。[d]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女召使い」とも訳せるが、原語は隷属的な身分にある女性を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「あなたの目に悪くあってはならない」。すなわち、そのことをつらく思ったり、不快に思ったりしてはならないという意味。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「彼女の声を聞きなさい」。ここでは、サラの言うことを聞き入れて従うという意味。
    reason: idiom_clarification
  - marker: d
    text: より字義的には「イサクにおいて、あなたのために子孫が呼ばれる」。アブラハムの子孫として呼ばれる約束の系統が、イサクを通して示されることを表す。
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרַע בְּעֵינֶיךָ
  choice: 心を痛めてはならない
  rationale: 直訳は「あなたの目に悪くあってはならない」だが、この慣用句は悲しむ、つらく思う、あるいは不快に思うことを表す。文脈ではアブラハムの深い苦悩を受け、「心を痛める」と自然に表現した。
- source_word: הַנַּעַר
  choice: あの子
  rationale: נַעַרは少年・若者を指す。ここでは直前に登場するイシュマエルを受けるため、現代日本語として自然な「あの子」とした。
- source_word: אֲמָתֶךָ
  choice: あなたの女奴隷
  rationale: אָמָהは隷属的身分にある女性を指す。単なる雇用人のように弱めず、ハガルの社会的身分を明示した。
- source_word: שְׁמַע בְּקֹלָהּ
  choice: その声に聞き従いなさい
  rationale: 字義的な「彼女の声を聞け」と、実際の意味である「彼女の言うことに従え」の双方を伝える定着した日本語表現を用いた。
- source_word: בְּיִצְחָק
  choice: イサクから出る
  rationale: 前置詞בְּはここで、アブラハムの子孫と呼ばれる系統がイサクを通して定められることを示す。「から出る」は日本語として明瞭であり、手段・系統の意味を表す。
- source_word: יִקָּרֵא לְךָ זָרַע
  choice: あなたの子孫と呼ばれる
  rationale: קראの「呼ぶ・名づける」という語感を保ちつつ、לְךָを所有・帰属として自然に表した。契約上の系統がイサクを通してアブラハムの子孫と称されるという意味を、過度に解釈せず示す。
- source_word: זָרַע
  choice: 子孫
  rationale: 集合単数であり、ここではアブラハムから続く系統を指す。日本語の「子孫」は単複を不必要に限定せず、自然である。
- source_word: וַיֹּאמֶר אֱלֹהִים
  choice: しかし神は……言われた
  rationale: 接続形は物語を進めるが、直前のアブラハムの苦悩に対する神の応答には対照があるため、「しかし」とした。神への敬意を自然に表すため「言われた」を用いた。
theological_decisions:
- issue: ハガルの身分を表す語
  choice: 女奴隷
  alternative: 女召使い／はしため
  rationale: 原語が示す隷属的な社会身分を曖昧にせず、同時に古語を避けた。これは人物への価値判断を加えるものではない。
- issue: 約束の句の意味
  choice: イサクから出る者が、あなたの子孫と呼ばれる
  alternative: イサクを通して、あなたの子孫が立てられる／イサクにおいて、あなたの子孫が呼ばれる
  rationale: この句は、イシュマエルとの生物学的関係を否定するのではなく、アブラハムの名を担う約束の系統をイサクに結びつける。「呼ばれる」を残すことで、指定・帰属という含みと原文の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、荘重さを保ちながら古風な「はしため」「汝」などは避けた。「女奴隷」は社会的現実を明示し、「その声に聞き従う」「子孫と呼ばれる」に原文の比喩と呼称の語感を残した。
