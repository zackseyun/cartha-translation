  to: 彼はベエル・シェバにギョリュウの木を植え、そこでヤハウェ、永遠の神[b]の名を呼び求めた[a]。
  rationale: アドナイ等の代置を用いず神名を「ヤハウェ」とし、אֵל עוֹלָםをその同格の呼称「永遠の神」として「ヤハウェ、永遠の神の名」に保持しました。これにより、原文の統語関係を過度に解釈せず、日本語でも意味が明瞭になります。脚注のアンカーも、それぞれ慣用句と「永遠の神」の語句に対応させました。
