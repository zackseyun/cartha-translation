source:
  edition: WLC
  text: וַ/יִּטַּ֥ע אֶ֖שֶׁל בִּ/בְאֵ֣ר שָׁ֑בַע וַ/יִּ֨קְרָא שָׁ֔ם בְּ/שֵׁ֥ם יְהוָ֖ה אֵ֥ל עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/033.yaml
  text: And he planted a tamarisk tree in Beersheba[a], and there he called on the name of Yahweh[b], the Everlasting God.
translation:
  language: ja
  text: 彼はベエル・シェバにギョリュウの木を植え、そこでヤハウェ、永遠の神[b]の名を呼び求めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そこでヤハウェの名を告げ知らせた」、または「そこでヤハウェの名を唱えた」とも訳せる。ヘブライ語の慣用句は、礼拝の場で神の名を宣言することと、神に呼びかけることの両方を含み得る。
    reason: lexical_alternative
  - marker: b
    text: 「とこしえの神」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטַּע
  choice: 植え
  rationale: נטעの基本的な意味であり、木を地に植えるという文脈に自然に合う。
- source_word: אֶשֶׁל
  choice: ギョリュウの木
  rationale: 単数名詞で、一般にギョリュウを指すと理解される。単なる「木」や複数の木を想起させる「林」とせず、原文の具体性を保った。
- source_word: בִּבְאֵר שָׁבַע
  choice: ベエル・シェバに
  rationale: 場所を示す前置詞בを、日本語の植樹地点として自然な「に」で表した。地名は日本語で定着した音写を用いた。
- source_word: וַיִּקְרָא שָׁם בְּשֵׁם
  choice: そこで…の名を呼び求めた
  rationale: קרא בשםは礼拝における神への呼びかけを表し得る。「呼び求めた」はその意味を自然に伝える一方、宣言・告知の含みもあり得るため脚注で示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文に記された神の固有名を日本語で音写した。
- source_word: אֵל עוֹלָם
  choice: 永遠の神
  rationale: אֵלを「神」、עוֹלָםの持続性を「永遠の」とし、称号的な表現を明快な現代日本語で表した。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を明記しているため、その固有名としての性格を保つ音写を採用した。
- issue: 礼拝表現קרא בשם יהוהの意味
  choice: ヤハウェの名を呼び求めた
  alternative: ヤハウェの名を告げ知らせた／ヤハウェの名を唱えた
  rationale: この慣用句は神への祈願・礼拝と神名の宣言の双方を含み得る。本文では文脈上自然な「呼び求めた」を用い、意味の幅を脚注に残した。
- issue: יְהוָהとאֵל עוֹלָםの関係
  choice: 「この方は永遠の神である」と続け、ヤハウェを同定する表現とした
  alternative: 「永遠の神ヤハウェの名を呼び求めた」と一続きに訳す
  rationale: 原文の語順ではיְהוָהにאֵל עוֹלָםが続き、同格的にヤハウェを「永遠の神」と示している。日本語で修飾関係が曖昧にならないよう二文に分けた。
translation_notes:
  register: 明快で格調を保った現代標準日本語。未知の植物名になり得るため「ギョリュウ」だけでなく「ギョリュウの木」とした。神名は「ヤハウェ」と音写し、אֵל עוֹלָםとの同格関係を明瞭にするため後半を独立文にした。
