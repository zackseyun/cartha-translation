source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר מִ֤י מִלֵּל֙ לְ/אַבְרָהָ֔ם הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה כִּֽי יָלַ֥דְתִּי בֵ֖ן לִ/זְקֻנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/007.yaml
  text: And she said[b][a], “Who would have said to Abraham that Sarah would nurse children? For I have borne a son in his old age.”
translation:
  language: ja
  text: 彼女は言った。「だれがアブラハムに、サラが子どもたちに乳を飲ませると言えたでしょうか。私は彼が年老いたときに、息子を産んだのです。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子どもたち」は、ヘブライ語では字義的に「息子たち」。また「だれが…と言えたでしょうか」は、「だれが…と告げたでしょうか」とも訳せる。
    reason: 原文の男性複数名詞の字義と、驚きを表す修辞疑問における訳語の選択肢を示すため。
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: そして彼女は言った
  rationale: 物語を進めるワウ継続法を自然な現代日本語で表し、前節との連続性を保つ。
- source_word: מִי מִלֵּל לְאַבְרָהָם
  choice: だれがアブラハムに……と言ったでしょう
  rationale: 実際の情報提供を問うより、予想外の出来事への驚きを表す修辞疑問として訳した。「言えたでしょう」も可能だが、原文の動詞の基本義に近い表現を採った。
- source_word: הֵינִיקָה
  choice: 乳を飲ませる
  rationale: ינקのヒフィル形が表す「乳を与える、授乳する」を、明瞭で自然な日本語にした。
- source_word: בָנִים
  choice: 子どもたち
  rationale: 字義は「息子たち」だが、授乳という文脈では複数形が慣用的に子を指すため、日本語では「子どもたち」とした。次の節では単数の「男の子」が明示される。
- source_word: כִּי
  choice: のです
  rationale: 前の驚嘆の根拠・説明を導く接続の働きを、説明調の文末表現で自然に示した。逆接にはしなかった。
- source_word: יָלַדְתִּי בֵן
  choice: 私は……男の子を産んだ
  rationale: 完了した出産を明確に表し、בֵןの性別と親子関係を保つ。
- source_word: לִזְקֻנָיו
  choice: 彼の老年に
  rationale: アブラハムが高齢になった時に、という原文の意味を保つ。「年老いた彼のために」という受益的解釈へ限定しない。
theological_decisions:
- issue: לִזְקֻנָיו の前置詞句のニュアンス
  choice: 彼の老年に
  alternative: 年老いた彼のために
  rationale: לְには受益の含みもあり得るが、ここでは時期を示す慣用的理解が文脈に最もよく合う。日本語でも解釈を過度に広げず、高齢時の奇跡性を伝える。
translation_notes:
  register: 明瞭な現代標準語を用いつつ、サラの驚きと喜びを表す修辞的な調子を保った。「乳を飲ませる」は「授乳する」より日常的で具体的。「彼の老年に」はやや荘重だが、聖書本文として自然で原文にも近い。
