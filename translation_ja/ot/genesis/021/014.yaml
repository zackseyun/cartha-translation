  text: וַ/יַּשְׁכֵּ֣ם אַבְרָהָ֣ם בַּ/בֹּ֡קֶר וַ/יִּֽקַּֽח לֶחֶם֩ וְ/חֵ֨מַת מַ֜יִם וַ/יִּתֵּ֣ן אֶל הָ֠גָר שָׂ֧ם עַל שִׁכְמָ֛/הּ וְ/אֶת הַ/יֶּ֖לֶד וַֽ/יְשַׁלְּחֶ֑/הָ וַ/תֵּ֣לֶךְ וַ/תֵּ֔תַע בְּ/מִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/014.yaml
  text: So Abraham rose early in the morning and took bread and a skin of water and gave them to Hagar[a], putting them on her shoulder, along with the boy, and sent her away. And she went and wandered in the wilderness of Beersheba.
translation:
  language: ja
  text: そこでアブラハムは朝早く起き、パンと水の入った皮袋を取ってハガルに渡し、それらを彼女の肩に載せ、少年とともに彼女を送り出した。[a] 彼女は出て行き、ベエル・シェバの荒野をさまよった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、「彼女の肩に載せ、そして少年を」と圧縮して続く。「肩に載せ」がパンと水の皮袋だけにかかるのか、少年も含むのか、また少年を彼女に委ねたという意味を補うのかについては、解釈が分かれる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: 朝早く起き
  rationale: שׁכם のヒフィル形と時間句を、強調を保ちながら自然な現代日本語にした。
- source_word: לֶחֶם
  choice: パン
  rationale: より広い「食べ物」もあり得るが、ここでは語の基本義を保持した。
- source_word: חֵמַת מַיִם
  choice: 水の入った皮袋
  rationale: חֵמֶת が液体を入れる獣皮製の容器であることを、現代の読者に明確に伝える。
- source_word: שָׂם עַל שִׁכְמָהּ
  choice: それを彼女の肩に載せ
  rationale: 圧縮された構文の中で、肩に載せたものを直前のパンと水の皮袋と解しつつ、単数形 שָׂם に対応する中立的な「それ」を用いた。
- source_word: וְאֶת הַיֶּלֶד
  choice: 少年も託して
  rationale: 目的格標識を伴う「そして少年を」という省略的表現を自然な日本語に補い、少年まで肩に載せたとの誤解を避けた。
- source_word: וַיְשַׁלְּחֶהָ
  choice: 彼女を送り出した
  rationale: שלח の文脈上の意味を、厳粛さを保つ自然な表現で示した。
- source_word: וַתֵּתַע
  choice: さまよった
  rationale: 道に迷ったと断定せず、תעה の「さまよう／道をそれる」という幅を保持した。
- source_word: בְּמִדְבַּר בְּאֵר שָׁבַע
  choice: ベエル・シェバの荒野
  rationale: מִדְבָּר を砂漠に限定しない「荒野」とし、地名は原音に比較的近い慣用表記を採用した。
theological_decisions:
- issue: 「少年を」と「彼女の肩に載せ」の統語関係
  choice: 肩に載せたのは糧食であり、少年はハガルに託されたと本文で示す。
  alternative: 糧食と少年の両方を彼女の肩に載せた、または「少年を与えた」という省略をより直訳的に残す。
  rationale: ヘブライ語の語順は圧縮されており曖昧さがある。本文の自然さと誤読防止のため「託して」と補う一方、原文の構文上の曖昧さを脚注で明示した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の簡潔な連続動作を維持し、原文の圧縮された構文に由来する曖昧さは脚注に残した。
