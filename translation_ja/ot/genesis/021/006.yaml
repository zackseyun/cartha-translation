base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/006.yaml
  text: And Sarah said[a], “God has made laughter for me; everyone who hears will laugh with me.”
translation:
  language: ja
  text: サラは言った。「神は私に笑いをもたらした。これを聞く者は皆、私とともに笑うだろう[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私のことを笑う」または「私のために笑う」。ヘブライ語には複数の意味合いがあり得るが、文脈上はサラと喜びをともにする意味が最も自然である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר שָׂרָה
  choice: サラは言った
  rationale: 継続を表す接続形式を、日本語の物語として自然な流れになるよう簡潔に訳した。固有名は慣用表記「サラ」とした。
- source_word: צְחֹק
  choice: 笑い
  rationale: 名詞形を保ち、後半の動詞 יִצְחַק およびイサクの名に通じる語根上の響きをできる限り伝える。
- source_word: עָשָׂה לִי
  choice: 私に…与えてくださった
  rationale: 直訳は「私のために…を造った」だが、日本語では「笑いを造る」が不自然なため、神の恵みとして笑いがもたらされたことを自然に表した。敬語はサラの神への敬意を示す日本語表現であり、原文に新たな教理的含意を加えるものではない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: ここではサラのために行動した唯一の神を指すため、標準的に「神」と訳した。
- source_word: כָּל הַשֹּׁמֵעַ
  choice: これを聞く者は皆
  rationale: 単数形の分配的な意味を「…者は皆」で表した。「これを」は、誕生の知らせを聞くという文脈を日本語で明確にするための最小限の補足である。
- source_word: יִצְחַק
  choice: 笑うだろう
  rationale: צְחֹק と同じ語根の動詞を「笑う」とし、反復とイサクの名に通じる言葉の響きを保持した。
- source_word: לִי
  choice: 私とともに
  rationale: 直訳的には「私に／私のために」で複数の解釈が可能だが、誕生を喜ぶ文脈ではサラと喜びを分かち合う意味が最も自然である。曖昧さは脚注に残した。
theological_decisions:
- issue: יִצְחַק לִי の意味
  choice: 喜びを分かち合って「私とともに笑う」
  alternative: 「私を笑う（私のことを笑う）」または「私のために笑う」
  rationale: イサク誕生の喜びと、神がサラに「笑い」を与えたという直前の言葉から、共有される喜びの笑いを本文に採用した。ただし לִי の関係は原文上ひと通りに限定できないため、別の可能性も脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、サラの発言として簡潔で品位ある調子にした。「笑い／笑う」の反復を保ち、原文の言葉遊びが見えるようにした。
