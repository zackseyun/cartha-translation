  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּפְקַ֤ח אֱלֹהִים֙ אֶת עֵינֶ֔י/הָ וַ/תֵּ֖רֶא בְּאֵ֣ר מָ֑יִם וַ/תֵּ֜לֶךְ וַ/תְּמַלֵּ֤א אֶת הַ/חֵ֨מֶת֙ מַ֔יִם וַ/תַּ֖שְׁקְ אֶת הַ/נָּֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/019.yaml
  text: Then God opened her eyes[a], and she saw a well of water. She went and filled the skin with water and gave the boy a drink.
translation:
  language: ja
  text: その時、神は彼女の目を開かれた。彼女が見ると、水のある井戸があった。彼女は行って革袋に水を満たし、少年に飲ませた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְקַח
  choice: 開かれた
  rationale: פקח は特に目について「開く」を意味する。神の直接的な行為を示すヘブライ語の具体的な表現を保ちつつ、敬意を表す自然な日本語とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数形の動詞を伴い、この物語の唯一の神を指している。
- source_word: עֵינֶיהָ
  choice: 彼女の目
  rationale: ヘブライ語の「彼女の両目／目」を、日本語として自然な集合的単数の「目」で表した。
- source_word: וַתֵּרֶא
  choice: 彼女が見ると
  rationale: ראה の基本義を保ち、目が開かれたことに続く発見を自然な物語文で表した。
- source_word: בְּאֵר מָיִם
  choice: 水のある井戸
  rationale: 直訳的な「水の井戸」より自然でありながら、מָיִם を省かず、井戸に水があるという文脈上重要な点を明示した。
- source_word: וַתֵּלֶךְ
  choice: 彼女は行って
  rationale: 単純な移動と、それに続く行為の連続を自然な日本語で表した。
- source_word: וַתְּמַלֵּא
  choice: 満たし
  rationale: מלא の基本的な意味を保ち、容器を水でいっぱいにする行為を簡潔に示した。
- source_word: הַחֵמֶת
  choice: 革袋
  rationale: חֵמֶת は液体を運ぶための獣皮製の容器を指す。「革袋」は現代日本語で簡潔かつ具体的で、単なる「袋」より素材と用途をよく伝える。
- source_word: מַיִם
  choice: 水を
  rationale: 日本語では「革袋に水を満たす」という目的語の形が自然である。
- source_word: וַתַּשְׁקְ
  choice: 飲ませた
  rationale: שקה のヒフィル形が表す「飲ませる／飲み物を与える」という使役的意味を、自然で簡潔な日本語にした。
- source_word: הַנַּעַר
  choice: 少年
  rationale: ここではハガルの息子イシュマエルを指す。年齢を過度に限定せず、古風にならない語を選んだ。
theological_decisions:
- issue: 「神が彼女の目を開いた」を、すでにあった井戸に気づかせたこととして説明的に訳すか
  choice: 神は彼女の目を開かれた
  alternative: 神は彼女に井戸を見つけさせた／井戸に気づかせた
  rationale: 原文は神を主語として、彼女の目を「開く」という具体的な慣用表現を用いる。認識の仕組みを説明せず、神の働きを明示する原文の神学的緊張と曖昧さを保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語としての簡潔さと品位を保った。神の行為には「開かれた」と敬語を用いたが、全体を過度に古風にはしていない。英語版の脚注 a は本文の「opened her eyes」ではなく waterskin の語義を説明しており、マーカー位置との不整合がある。日本語では חֵמֶת を「革袋」と本文で明確に訳せるため、不要な脚注は設けなかった。
