source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִשָּׁ֨בְעָ/ה לִּ֤/י בֵֽ/אלֹהִים֙ הֵ֔נָּה אִם תִּשְׁקֹ֣ר לִ֔/י וּ/לְ/נִינִ֖/י וּ/לְ/נֶכְדִּ֑/י כַּ/חֶ֜סֶד אֲשֶׁר עָשִׂ֤יתִי עִמְּ/ךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔/י וְ/עִם הָ/אָ֖רֶץ אֲשֶׁר גַּ֥רְתָּה בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/023.yaml
  text: Swear to me here by God that you will not deal falsely with me, or with my children, or with my descendants. According to the kindness that I have shown to you, you shall show to me and to the land where you have lived as a foreigner.
translation:
  language: ja
  text: そこで今、ここで神にかけて私に誓ってください。私にも、私の子孫にも、その後の子孫にも、不誠実なことをしないと。私があなたに示した慈しみのように、あなたも私と、あなたが寄留してきたこの地とに慈しみを示すと。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: それで今
  rationale: וְ は前後を結ぶ談話上の接続、עַתָּה は明示された「今」を表すため、単なる英語的談話標識として省かず自然な日本語で示した。
- source_word: אִם תִּשְׁקֹר
  choice: 偽りを働かず
  rationale: 誓約文中の אִם は否定的誓約内容を導き、שׁקר は人を欺き不実に扱うことを指す。日本語では誓いの内容として自然な否定形にした。
- source_word: נִינִי ... נֶכְדִּי
  choice: 私の子にも、私の孫にも
  rationale: 並列された親族語を、文脈に即した通常の世代表現で訳した。後者には辞書上「子孫」の可能性もあるが、前者との段階的な並列を明瞭にした。
- source_word: חֶסֶד
  choice: 慈しみ
  rationale: 契約的な忠実さを含み得る、親切・厚意・誠実な愛の幅を保つ語として「慈しみ」を採用した。
- source_word: גַּרְתָּה
  choice: 寄留している
  rationale: 永住者ではなく他国人として滞在する意味を、聖書文体として理解可能な「寄留」で表した。ヘブライ語の完了形は現在に至る滞在状況として訳した。
theological_decisions:
- issue: 神の名による誓い
  choice: 神にかけて私に誓ってください
  alternative: 神の前で私に誓ってください
  rationale: בֵּאלֹהִים は誓いの根拠・保証として神を立てる表現であり、「神にかけて」が直接的で自然。特定の神名や宗派的含意は加えない。
- issue: חֶסֶד の内容
  choice: 同じように…慈しみを示す
  alternative: 私があなたを厚遇したように…厚遇する
  rationale: 行為上の親切だけに狭めず、関係上の忠実さを含む原語の神学的・倫理的幅を残した。
translation_notes:
  register: 現代標準日本語を基調に、誓約の厳粛さを保つ丁寧な直接話法とした。「寄留」はやや聖書的だが意味が明確で、原文の外国人滞在者という社会的立場を簡潔に保持する。
