  text: その子は成長して乳離れした。イサクが乳離れした日に、アブラハムは盛大な宴を催した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּגְדַּל הַיֶּלֶד
  choice: その子は成長して
  rationale: יֶלֶדはここでは幼いイサクを指す。「その子」は自然な日本語で文脈上の指示を保ち、גדלは身体的な成長を表すため「成長して」とした。
- source_word: וַיִּגָּמַל
  choice: 乳離れした
  rationale: גמלのニファル形は授乳期を終えることを表す。日本語では受け身の「乳離れさせられた」より、自動詞的な「乳離れした」が自然で意味も正確である。
- source_word: וַיַּעַשׂ
  choice: 催した
  rationale: עשהは広く「する、作る」の意だが、宴を目的語とする日本語では「宴を催す」が最も自然である。
- source_word: מִשְׁתֶּה גָדוֹל
  choice: 盛大な祝いの宴[a]
  rationale: מִשְׁתֶּהは飲食を伴う宴、גָדוֹלはその規模や盛大さを示す。乳離れを祝う場面であることが分かる自然な表現とした。
- source_word: בְּיוֹם הִגָּמֵל אֶת יִצְחָק
  choice: イサクが乳離れした日に
  rationale: בְּיוֹםの時間表現を「日に」と保ち、不定詞構文は日本語で自然な節にした。אֶת יִצְחָקはイサクが乳離れの対象であることを示すが、日本語では「イサクが乳離れした」と表すのが自然である。
