  text: Therefore he called that place Beersheba[a], because there the two of them swore an oath.
translation:
  language: ja
  text: それで彼は、その場所をベエル・シェバ[a]と名づけた。二人がそこで誓ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ベエル・シェバ」は、ヘブライ語で「七の井戸」と「誓いの井戸」の両方を思わせる名である。ここでは特に、二人がそこで誓ったことと結びつけられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: それで
  rationale: 命名の理由と結果を結ぶ因果表現。現代日本語として自然で、前文とのつながりも保つ。
- source_word: קָרָא לַמָּקוֹם הַהוּא
  choice: その場所を…と名づけた
  rationale: קראはここでは場所の命名を表すため、「呼んだ」より文脈上明確な「名づけた」とした。הַהוּאの指示性は「その」で保持した。
- source_word: בְּאֵר שָׁבַע
  choice: ベエル・シェバ
  rationale: 地名として音写し、「井戸」と「七／誓い」に関わるヘブライ語の語呂合わせは脚注で示す。
- source_word: כִּי שָׁם
  choice: …からである／そこで
  rationale: כִּיの理由提示とשָׁםの場所指示を、明瞭で品位ある現代日本語で表した。
- source_word: נִשְׁבְּעוּ שְׁנֵיהֶם
  choice: 二人が…誓いを交わした
  rationale: 複数主語による相互的な誓約という文脈を自然に表す。「二人」でשְׁנֵיהֶםの明示的な双数性を保った。
