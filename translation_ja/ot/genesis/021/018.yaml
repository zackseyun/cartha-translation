  text: ק֚וּמִי שְׂאִ֣י אֶת הַ/נַּ֔עַר וְ/הַחֲזִ֥יקִי אֶת יָדֵ֖/ךְ בּ֑/וֹ כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִׂימֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/018.yaml
  text: Get up[a], lift up the boy, and hold him fast with your hand[b], for I will make him into a great nation.
translation:
  language: ja
  text: 立ち上がって、その子を起こし、あなたの手でしっかり支えなさい[a]。わたしはその子を大いなる国民とするからだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: また、「手でその子をしっかりつかみなさい」とも訳せる。ヘブライ語の表現は、手で力強く支えること、またはしっかりつかむことを示す。
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֚וּמִי
  choice: 立ち上がって
  rationale: ハガルに向けた女性単数命令形。現代日本語として自然に命令の力を表す。
- source_word: שְׂאִ֣י אֶת־הַנַּ֔עַר
  choice: その子を起こし
  rationale: נשׂא の「持ち上げる、起こす」という像を、倒れ伏している子を助け起こす文脈に即して表した。「抱き上げる」「持ち上げる」とも取り得るが、継続して運ぶ意味には限定しない。
- source_word: הַנַּעַר
  choice: その子
  rationale: נַעַר は少年・若者を指し得る。ここでは直前から言及されているイシュマエルを自然に指す表現とした。
- source_word: וְהַחֲזִיקִי אֶת־יָדֵךְ בּוֹ
  choice: あなたの手でしっかり支えなさい
  rationale: חזק の使役形が示す強い保持・支えを明示し、単に手をつなぐという意味に狭めない。身体的な手の像も残した。
- source_word: כִּי
  choice: からだ
  rationale: 先行する命令の理由を示す接続辞として自然な日本語にした。
- source_word: לְגוֹי גָּדוֹל אֲשִׂימֶנּוּ
  choice: わたしはその子を大いなる国民とする
  rationale: לְ と שׂים の結果・形成の意味を保ち、少年自身が国民へと展開するという原文の簡潔で比喩的な言い方を解消せずに残した。
theological_decisions:
- issue: イシュマエルの将来についての神の約束
  choice: 「わたしはその子を大いなる国民とする」と直接的に訳す。
  alternative: 「その子から大いなる国民を起こす」
  rationale: 原文は少年を大いなる国民とするという神の約束を率直に述べる。約束の神学的性質を本文以上に規定せず、個人とその子孫を結ぶ原文の表現を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、神の約束には「大いなる国民」という簡潔で品位ある表現を用いた。命令は女性に向けた連続命令として自然につなぎ、支持・把持の語義の幅は脚注で示した。
