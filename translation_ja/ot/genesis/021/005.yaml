  yaml_path: translation/ot/genesis/021/005.yaml
  text: And Abraham was a hundred years old when Isaac his son was born to him[a].
translation:
  language: ja
  text: アブラハムに息子イサクが生まれた時、アブラハムは百歳であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の直訳は、「アブラハムは、彼に息子イサクが生まれた時、百年の子であった」。
    reason: 年齢を表すヘブライ語の字義的な慣用表現と、「彼に生まれた」という構文を示すため。
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: アブラハムは
  rationale: 接続詞וְは物語の連続を示すが、この一節だけでも自然な現代日本語となるよう、明示的な「そして」は置かなかった。固有名は慣用表記「アブラハム」とした。
- source_word: בֶּן מְאַת שָׁנָה
  choice: 百歳であった
  rationale: 字義的には「百年の子」だが、年齢を表すヘブライ語の慣用句なので、日本語の自然な年齢表現で訳した。
- source_word: בְּ/הִוָּלֶד
  choice: 生まれた時
  rationale: 前置詞בְּとילדのニファル不定詞連語が表す時間的状況と受動の意味を、自然な日本語で保持した。
- source_word: ל֔/וֹ
  choice: 彼に
  rationale: 息子がアブラハムに生まれたという原文の与格的関係を明示した。日本語ではやや直訳的だが、原文の表現を保つ。
- source_word: אֵת יִצְחָק
  choice: イサクが
  rationale: אֵתは不定詞構文における意味上の主語イサクを標示している。日本語では受動表現「イサクが生まれた」の主語として訳した。
- source_word: בְּנֽ/וֹ
  choice: 息子イサク
  rationale: イサクがアブラハムの息子であることを示す同格表現を、自然な日本語の語順で示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「百歳だった」よりも聖書本文に適した「百歳であった」を採用した。脚注記号を本文に明示した。
