- source_word: עַל אוֹדֹת
  choice: に関わることだったので
  rationale: 原因・関係を示す句。ここではアブラハムが心を痛めた理由を表すため、因果関係が自然に伝わる形とした。
- source_word: בְּנוֹ
  choice: 自分の息子
  rationale: בן の性別と親子関係を正確に保つ。「自分の」により、主語アブラハムの息子であることを自然に示す。
