  text: וַ/יֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל אַבְרָהָ֑ם מָ֣ה הֵ֗נָּה שֶׁ֤בַע כְּבָשֹׂת֙ הָ/אֵ֔לֶּה אֲשֶׁ֥ר הִצַּ֖בְתָּ לְ/בַדָּֽ/נָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/029.yaml
  text: And Abimelech said to Abraham[a], “What are these seven ewe lambs that you have set apart by themselves?”
translation:
  language: ja
  text: アビメレクはアブラハムに言った。「あなたが別にしておいた、この七匹の雌の子羊は何なのですか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ継続法。日本語では文脈上不要な接続語を足さず、自然な叙述とした。
- source_word: אֲבִימֶלֶךְ אֶל־אַבְרָהָם
  choice: アビメレクはアブラハムに
  rationale: 固有名詞を慣用的に音写し、発話の相手を助詞「に」で明確にした。
- source_word: מָה הֵנָּה
  choice: 何なのですか
  rationale: 七匹の子羊の意味や目的を尋ねる表現として、単なる同定に限定しすぎない自然な疑問形とした。
- source_word: שֶׁבַע כְּבָשֹׂת הָאֵלֶּה
  choice: この七匹の雌の子羊
  rationale: כְּבָשׂוֹת の女性複数形を「雌の子羊」と訳し、性別の情報を保持した。指示詞は近称の「この」とした。
- source_word: הִצַּבְתָּ לְבַדָּנָה
  choice: あなたが別にしておいた
  rationale: 動詞の基本義「立てる／置く」と、לְבַדָּנָה が示す他からの分離を一続きの自然な日本語で表した。文脈上、別の一群として取り分けた状態を示す。
