  text: And Abraham stayed in the land of the Philistines for many days[a].
translation:
  language: ja
  text: アブラハムはペリシテ人の地に長い間、寄留した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「滞在した」。ヘブライ語の動詞には、外国人として住むという意味合いがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: 寄留した
  rationale: גורは、自分の本来の土地ではない所に外国人・滞在者として住むことを表す。「滞在した」よりも異郷での居住という語義を保ちつつ、聖書文体として現代日本語でも理解可能な「寄留した」とした。
- source_word: בְּאֶרֶץ
  choice: 地に
  rationale: אֶרֶץはここでは民族が住む地域・領土を指すため、「ペリシテ人の地」と自然に表現した。
- source_word: פְּלִשְׁתִּים
  choice: ペリシテ人
  rationale: 民族名の標準的な日本語表記を用いた。
- source_word: יָמִים רַבִּים
  choice: 長い間
  rationale: 直訳は「多くの日々」だが、継続した長期間を表すヘブライ語の慣用表現として、明瞭で自然な現代日本語にした。
- source_word: וַ
  choice: （独立した接続語を置かない）
  rationale: 物語を継続する接頭辞だが、日本語では節冒頭の「そして」を省いても連続性が自然に伝わる。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「寄留」は日常語ではないが、外国人として一時的または非定住的に住むという原語の含意を簡潔に保持するため本文に採用し、脚注で平易な別訳を示した。
