  source_fidelity: 「寄留した」は וַיָּגָר（異郷で居住する・寄留する）を適切に表している。「ペリシテ人の地に」と「長い間」も、それぞれ בְּאֶרֶץ פְּלִשְׁתִּים と יָמִים רַבִּים を正確かつ過不足なく伝える。物語をつなぐ waw を日本語で明示しない判断も自然である。
