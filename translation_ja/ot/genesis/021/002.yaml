  naturalness: 「彼に男の子を産んだ」は、この文脈では先行するアブラハムを自然に指します。二つの時の表現は読点で区切れば明瞭です。
  terminology: 「身ごもり」「男の子」「定めの時」「神」は明瞭な現代標準日本語として適切です。「告げていた」は、神がその時について前もって語ったという関係節の意味を無理なく表します。
