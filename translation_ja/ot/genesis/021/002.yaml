  text: וַ/תַּהַר֩ וַ/תֵּ֨לֶד שָׂרָ֧ה לְ/אַבְרָהָ֛ם בֵּ֖ן לִ/זְקֻנָ֑י/ו לַ/מּוֹעֵ֕ד אֲשֶׁר דִּבֶּ֥ר אֹת֖/וֹ אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/002.yaml
  text: So Sarah conceived and bore a son to Abraham in his old age[b][a], at the appointed time that God had spoken to him.
translation:
  language: ja
  text: サラは身ごもり、アブラハムが年老いた時に、神が彼に告げていた定めの時に男の子を産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּהַר
  choice: 身ごもり
  rationale: 妊娠したことを表す語。物語文として自然で、受胎の意味を明確に伝える。
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: 出産を表すQal形。現代日本語で簡潔かつ自然な叙述とした。
- source_word: לְאַבְרָהָם בֵּן
  choice: 彼に男の子を産んだ
  rationale: לְאַבְרָהָם の関係を保持しつつ、בֵּן が男子であることを明示した。「彼」が曖昧にならないよう、続く文ではアブラハムの名を用いた。
- source_word: לִזְקֻנָיו
  choice: アブラハムが年老いた時に
  rationale: 目的ではなく、アブラハムの老年という時・状況を表す慣用句として訳した。
- source_word: לַמּוֹעֵד
  choice: 定めの時
  rationale: מוֹעֵד の、あらかじめ定められた時という意味を簡潔に保持した。
- source_word: אֲשֶׁר דִּבֶּר אֹתוֹ אֱלֹהִים
  choice: 神がアブラハムに告げていた
  rationale: 関係節が「定めの時」を説明することを明確にし、神が以前に語った内容であることを表した。日本語での代名詞の曖昧さを避けるため固有名を反復した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この箇所の一般的な神称を標準的に訳した。
- source_word: וַ
  choice: （無訳）
  rationale: 日本語では前後の物語の連続が語順だけで自然に示されるため、機械的に「そして」を置かなかった。
theological_decisions:
- issue: 神の約束が定められた時に実現したという成就表現
  choice: それは、神がアブラハムに告げていた定めの時であった
  alternative: 神がアブラハムに告げていた定めの時に
  rationale: ヘブライ語の関係節が「定めの時」を修飾することを明瞭にしつつ、神の言葉とその時の実現との結び付きを保った。約束や成就について原文以上の教理的説明は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語による、簡潔で品位ある物語文。原文の情報を保ちながら、日本語で修飾関係が曖昧にならないよう二文に分けた。
