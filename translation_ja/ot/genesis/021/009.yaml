source:
  edition: WLC
  text: וַ/תֵּ֨רֶא שָׂרָ֜ה אֶֽת בֶּן הָגָ֧ר הַ/מִּצְרִ֛ית אֲשֶׁר יָלְדָ֥ה לְ/אַבְרָהָ֖ם מְצַחֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/021/009.yaml
  text: And Sarah saw the son of Hagar the Egyptian[a], whom she had borne to Abraham, mocking.
translation:
  language: ja
  text: サラは、エジプト人ハガルがアブラハムに産んだ息子が、笑っている[a]のを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「からかっている」あるいは「あざ笑っている」とも訳せる。ヘブライ語は、笑うことや遊ぶことのほか、文脈によっては嘲るような振る舞いを指すこともある。
    reason: מְצַחֵק の語義には幅があり、この文脈で否定的な含みを持つ可能性を示すため。
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: サラは……見た
  rationale: 物語を進める接続形であり、日本語では不自然な接続詞を補わず、出来事の順序を簡潔に示した。
- source_word: בֶּן הָגָר הַמִּצְרִית
  choice: エジプト人ハガルが……産んだ息子
  rationale: 母ハガルとその出自によって息子を特定する原文の情報を保ちつつ、現代日本語として自然な形にした。
- source_word: אֲשֶׁר יָלְדָה לְאַבְרָהָם
  choice: ハガルがアブラハムに産んだ
  rationale: 関係節の主語がハガルであることを日本語で明示し、לְאַבְרָהָם を自然な『アブラハムに』で表した。
- source_word: מְצַחֵק
  choice: 笑っている
  rationale: צחק の分詞は笑うこと、遊ぶこと、嘲るような振る舞いまで含み得るが、目的語がなく否定的意味も明示されないため、本文では最も広い基本義を採用した。文脈上可能な否定的解釈は脚注に残した。
theological_decisions:
- issue: イシュマエルの行為 מְצַחֵק の解釈
  choice: 本文では中立的に『笑っている』と訳す
  alternative: 『からかっている』『あざ笑っている』『遊んでいる』
  rationale: ヘブライ語本文だけでは行為の対象や敵意が明示されていない。後続の物語や後代の解釈から否定的な含みを読むことは可能だが、それを本文で確定せず、原文の解釈上の幅を保った。
translation_notes:
  register: 明快で自然な現代標準日本語を用いた。『産んだ息子』はやや重なるが、原文の出生に関する関係節を省略せず保持している。
