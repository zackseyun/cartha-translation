  text: וַ/יְחִ֣י קֵינָ֗ן אַחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מַֽהֲלַלְאֵ֔ל אַרְבָּעִ֣ים שָׁנָ֔ה וּ/שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/013.yaml
  text: And Kenan lived eight hundred and forty years after he fathered Mahalalel[b][a], and he fathered sons and daughters.
translation:
  language: ja
  text: ケナンはマハラルエルをもうけた後、八百四十年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図における存命期間を述べる חיה の通常の意味を、自然な現代日本語で表した。
- source_word: קֵינָן
  choice: ケナン
  rationale: ヘブライ語 קֵינָן の音写として、日本語で明瞭な形を採用した。
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: をもうけた後
  rationale: אַחֲרֵי の時間的な前後関係と、男性を主語とする ילד のヒフィル形の生殖・父となる意味を自然に表した。
- source_word: מַהֲלַלְאֵל
  choice: マハラルエル
  rationale: ヘブライ語 מַהֲלַלְאֵל に即した人名表記とした。
- source_word: אַרְבָּעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百四十年
  rationale: ヘブライ語では『四十年と八百年』の順だが、日本語で通常の数詞順にまとめ、同じ合計年数を保持した。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 先の הוֹלִידוֹ と語彙上の対応を保ちつつ、古風すぎない現代日本語とした。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たちと娘たち
  rationale: 原文が男女の子を明示しているため、一般化せずに訳した。
theological_decisions: []
