id: GEN.5.3
reference: Genesis 5:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּ/מְאַת֙ שָׁנָ֔ה וַ/יּ֥וֹלֶד בִּ/דְמוּת֖/וֹ כְּ/צַלְמ֑/וֹ וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵֽׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/003.yaml
  text: Adam lived one hundred thirty years and fathered a son in his likeness[a], according to his image[c][b], and called his name Seth.
translation:
  language: ja
  text: アダムは百三十年生き、自分に似た、自分のかたちどおりの子をもうけ、その名をセトと呼んだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分に似た、自分のかたちどおりの」という表現は、創世記1:26–27を思い起こさせる。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図において、子をもうけた時点までの年数を示す定型表現として、自然で簡潔な「生き」とした。
- source_word: אָדָם
  choice: アダム
  rationale: ここでは人類一般ではなく、系図中の固有名として用いられている。
- source_word: שְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 百三十年
  rationale: ヘブライ語の数詞と「年」を、そのまま明瞭な現代日本語で表した。
- source_word: וַיּוֹלֶד
  choice: 子をもうけ
  rationale: 男性を主語とするヒフィル形で「子を生ませる、もうける」の意。日本語では性別を原文以上に補わず、「子をもうける」が自然である。
- source_word: בִּדְמוּתוֹ
  choice: 自分に似た
  rationale: דְּמוּת の類似・似姿という意味を自然な日本語で示し、創世記1章との響きを保った。
- source_word: כְּצַלְמוֹ
  choice: 自分のかたちどおりの
  rationale: צֶלֶם を「かたち」、接頭辞 כ を「どおり」と訳し、前句と区別しつつ創世記1:26–27への反響を残した。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ שֵׁת
  choice: その名をセトと呼んだ
  rationale: 「その名を呼ぶ」というヘブライ語の表現を、理解可能で品位ある日本語として保持した。
- source_word: שֵׁת
  choice: セト
  rationale: 日本語聖書で一般的な固有名表記を採用した。
theological_decisions:
- issue: アダムの子とアダムの「似姿」「かたち」との関係
  choice: アダムとの類似を示す二つの表現を残し、創世記1:26–27への反響を保持する。
  alternative: 堕落後に神のかたちが失われた、または弱められたという解釈を本文に織り込む。
  rationale: 本文自体は、この反響が持つ教理的含意を説明していないため、神のかたちをめぐる結論を訳文で先取りしない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、系図にふさわしい簡潔で格調ある調子と、原文の反復表現を保った。
