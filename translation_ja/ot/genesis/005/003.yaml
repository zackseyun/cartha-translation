  source_fidelity: ヘブライ語の系図定型「百三十年生き」、男性主語の וַיּוֹלֶד による子の誕生、「彼の似姿に、彼のかたちに従って」、命名の表現を過不足なく反映している。「自分」は文脈上アダムを明確に指し、原文の所有接尾辞を自然な日本語で再現している。
