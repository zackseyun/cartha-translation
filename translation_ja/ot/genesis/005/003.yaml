  terminology: 固有名「アダム」「セト」は日本語聖書で広く用いられる表記である。「似た」と「かたちどおり」の二表現は、原文の דְּמוּת と צֶלֶם の重なりを不必要に神学的に解釈せず保持している。脚注も創世記1:26–27との語句上の反響を適切に示す。
