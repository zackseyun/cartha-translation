  language: ja
  text: レメクは百八十二年生きて、息子をもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系図の定型表現で、次の出来事まで生きた年数を示す。文脈に即して自然な現代日本語とした。
- source_word: לֶמֶךְ
  choice: レメク
  rationale: ヘブライ語の人名を、日本語聖書で広く通用する形に音写した。
- source_word: שְׁתַּיִם וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: 百八十二年
  rationale: ヘブライ語では「二と八十……と百」の順だが、数値を標準的な日本語の語順で表した。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とするヒフィル形で「子の父となる、子をもうける」の意味。「生んだ」という誤解を避けつつ、古風な「生ませた」より自然で簡潔な表現を選んだ。
- source_word: בֵּן
  choice: 男の子
  rationale: 息子がまだ名指されていないため、不定の「男の子」として自然に表現した。
