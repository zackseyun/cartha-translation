base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/018.yaml
  text: Jered lived one hundred sixty-two years and fathered Enoch.
translation:
  language: ja
  text: エレドは百六十二歳になったとき、エノクをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 百六十二歳になったとき
  rationale: 系譜において、וַיְחִי に年数が続き、その後に子をもうけたことが記される定型表現である。直訳的な「百六十二年生きて」では、その時点で生涯を終えたかのようにも響くため、年齢を示す自然な現代日本語とした。
- source_word: יֶרֶד
  choice: ヤレド
  rationale: ヘブライ語名の発音に沿いつつ、日本語聖書で広く通用する表記を採用した。
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּמְאַת שָׁנָה
  choice: 百六十二歳
  rationale: ヘブライ語では「二と六十年と百年」の順に数えるが、日本語の通常の数え方に直し、人物の年齢として自然な「歳」で表した。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とする系譜上の ילד は「父となった／子をもうけた」の意である。「生んだ」という誤解を避け、簡潔で自然な現代日本語とした。
- source_word: אֶת חֲנוֹךְ
  choice: エノク
  rationale: אֶת は直接目的語を示す標識なので訳語を立てず、人名 חֲנוֹךְ は日本語で定着した「エノク」と表記した。
