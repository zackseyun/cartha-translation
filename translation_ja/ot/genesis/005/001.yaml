source:
  edition: WLC
  text: זֶ֣ה סֵ֔פֶר תּוֹלְדֹ֖ת אָדָ֑ם בְּ/י֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּ/דְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/001.yaml
  text: This is the book of the generations of Adam[a]. In the day God created man[b], he made him in the likeness of God.
translation:
  language: ja
  text: これは、アダムの系譜[a]を記した書である。神が人[b]を創造されたとき[c]、神はその人を神に似せて造られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「系譜」は「子孫」、または「系図・歴史の記録」とも訳し得る。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では、ここも前の「アダム」と同じ語。文脈により「人」「人類」、または固有名「アダム」を表す。
    reason: lexical_alternative
  - marker: c
    text: 直訳は「……を創造した日に」。このヘブライ語表現は「……したとき」という意味でも用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה סֵפֶר
  choice: これは……を記した書である
  rationale: 指示詞で始まる見出しの形を保ちつつ、日本語として自然な名詞文にした。סֵפֶר は書かれた文書・記録を指すため、「書」とした。
- source_word: תּוֹלְדֹת אָדָם
  choice: アダムの系譜
  rationale: תּוֹלְדֹת は創世記の構成を示す重要語で、由来・歴史・子孫の系統を表し得る。この箇所では後続する系図を導入するため「系譜」が最も明瞭である。אָדם はここでは祖先の固有名「アダム」と理解した。
- source_word: בְּיוֹם בְּרֹא
  choice: 創造されたとき
  rationale: 直訳は「創造した日に」だが、בְּיוֹם は不定詞とともに「……したとき」という時間的意味を表し得る。現代日本語で特定の一日だけを不必要に強調しないよう「とき」とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この文脈では単数の動詞・代名詞に対応するイスラエルの神を指すため、標準的に「神」とした。
- source_word: אָדָם
  choice: 人
  rationale: 二度目の אָדָם は創造された人間を一般的・代表的に指す。「人」は単数的表現を保ちながら、日本語で人類一般をも含み得る。
- source_word: בִּדְמוּת אֱלֹהִים
  choice: 神に似たものとして
  rationale: דְּמוּת の「類似・似姿」という意味を表し、別語 צֶלֶם に当たる「像」と混同しないようにした。
- source_word: עָשָׂה אֹתוֹ
  choice: その人を……造られた
  rationale: עשה は直前の ברא と区別して「造る」とした。男性単数目的語は、日本語では文脈上明瞭な「その人」で表した。神への敬意を示す自然な現代日本語として尊敬形を用いた。
theological_decisions:
- issue: 同じ節に二度現れる אָדָם の解釈
  choice: 最初は固有名「アダム」、二度目は普通名詞「人」
  alternative: 両方を「アダム」とする、または二度目を「人類」とする
  rationale: 最初は後続の系図の祖先を指す見出しなので固有名が適切である。二度目は創造記事を振り返り、人間を代表的に指す。日本語の「人」は個人と人類の双方を含み得るため、原文の幅を保てる。
- issue: 「神の似姿」と創世記1章の「像」との関係
  choice: דְּמוּת を「神に似たものとして」と訳す
  alternative: 「神の像に」と訳して創世記1章の表現にそろえる
  rationale: この節の語は דְּמוּת であり、צֶלֶם ではない。関連性を保ちつつ、語彙上の違いを消さないようにした。
- issue: בְּיוֹם の時間表現
  choice: 本文では「とき」
  alternative: 「日に」または「その日に」
  rationale: このヘブライ語構文は特定の日を指すことも、広く「……したとき」を意味することもある。本文は自然な時間節とし、直訳的可能性を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。見出しらしい簡潔さを維持し、神の行為には過度に古風でない尊敬形を用いた。創世記の構成語 תּוֹלְדֹת と、二つの אָדָם の意味の違い、דְּמוּת の語彙的独自性が読者に見えるようにした。
