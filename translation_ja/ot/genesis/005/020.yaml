lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: こうして、…となり
  rationale: 系図における生涯の総括を導く語りの連続性を、自然な現代日本語で表した。
- source_word: כָּל יְמֵי
  choice: 生涯は全部で
  rationale: 直訳的には「すべての日々」だが、ここでは一生の全期間を表す定型句なので、意味を明確に伝える表現とした。
- source_word: יֶרֶד
  choice: イエレド
  rationale: ヘブライ語の発音形に即して音写した。日本語訳で用いられてきた「ヤレド」も可能だが、語頭の母音をより直接的に表した。
- source_word: שְׁתַּיִם וְשִׁשִּׁים שָׁנָה וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 九百六十二年
  rationale: ヘブライ語では六十二年と九百年の順だが、現代日本語で通常の数詞順に整えた。
- source_word: וַיָּמֹת
  choice: 彼は死んだ
  rationale: 創世記5章で反復される結語を簡潔かつ明瞭に保った。
