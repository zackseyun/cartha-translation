  yaml_path: translation/ot/genesis/005/019.yaml
  text: And Yered lived eight hundred years after he fathered Hanokh[a], and he fathered sons and daughters.
translation:
  language: ja
  text: イェレド[a]は、ハノクをもうけた後、八百年生き、息子と娘をもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 人名の伝統的な日本語聖書表記は「ヤレデ」と「エノク」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現において、指定された期間にわたって生きたことを自然な現代日本語で表す。
- source_word: יֶרֶד
  choice: イエレド
  rationale: ヘブライ語名 יֶרֶד の発音を日本語で比較的直接に音写した。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת חֲנוֹךְ
  choice: ハノクをもうけた後
  rationale: 時間的前後関係と、ヒフィル形が示す父として子をもうけた意味を、簡潔で自然な日本語にした。
- source_word: חֲנוֹךְ
  choice: ハノク
  rationale: ヘブライ語の子音 חנוך を日本語で分かりやすく音写した。
- source_word: שְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百年
  rationale: 期間を示す数詞句を標準的な日本語で表した。
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: 息子や娘をもうけた
  rationale: 男女双方の子を明示する原文を保ちつつ、不特定複数を自然に表すため並列助詞「や」を用いた。
