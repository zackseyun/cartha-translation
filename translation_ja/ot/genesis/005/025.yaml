  text: Methuselah lived one hundred and eighty-seven years and fathered Lamech[a].
translation:
  language: ja
  text: メトシェラは百八十七年生き、レメクをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系図の定型表現で、子をもうけるまで生きた年数を示す。後続の動詞と自然につながる現代日本語とした。
- source_word: מְתוּשֶׁלַח
  choice: メトシェラ
  rationale: ヘブライ語の人名を、現代日本語の聖書で広く通用する形に音写した。
- source_word: שֶׁבַע וּשְׁמֹנִים שָׁנָה וּמְאַת שָׁנָה
  choice: 百八十七年
  rationale: ヘブライ語では「七と八十年と百年」の順だが、日本語で自然な数詞順に整えた。
- source_word: וַיּוֹלֶד
  choice: 父となった
  rationale: 使役形の系図的用法を、古風な「生んだ」「もうけた」よりも明確かつ自然に表し、男性祖先としての関係を保持した。
- source_word: אֶת
  choice: （訳語なし）
  rationale: 直接目的語を示す標識であり、日本語では独立した訳語を必要としない。
- source_word: לָמֶךְ
  choice: レメク
  rationale: ヘブライ語の人名を、現代日本語の聖書で広く通用する形に音写した。
