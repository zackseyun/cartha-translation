  yaml_path: translation/ot/genesis/005/026.yaml
  text: After he fathered Lamech, Methuselah lived 782 years and fathered sons and daughters.
translation:
  language: ja
  text: メトシェラはレメクをもうけた後、七百八十二年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現において、名を挙げられた子の誕生後に生きた期間を自然な現代日本語で示す。
- source_word: מְתוּשֶׁלַח
  choice: メトシェラ
  rationale: ヘブライ語の人名を、日本語聖書で広く用いられる慣用的な形で表記した。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־לֶמֶךְ
  choice: レメクをもうけた後
  rationale: אַחֲרֵיの時間的前後関係と、使役形 ילד の男性主体による子の誕生という意味を、簡潔で自然に表した。
- source_word: שְׁתַּיִם וּשְׁמוֹנִים שָׁנָה וּשְׁבַע מֵאוֹת שָׁנָה
  choice: 七百八十二年
  rationale: ヘブライ語では「二と八十年、そして七百年」という順序だが、日本語の通常の数え方に整え、総数を明確にした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 直前の הוֹלִידוֹ と語根を共有するため訳語をそろえ、系図における父として子を得た意味を保った。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たちや娘たち
  rationale: 原文が男女双方の子を明示しているため、総称の「子どもたち」にはせず、その区別を保持した。接続辞は列挙を自然に示す「や」とした。
