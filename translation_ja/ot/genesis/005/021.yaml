lexical_decisions:
- source_word: וַיְחִי
  choice: 六十五歳まで生きたとき
  rationale: 系図の定型句において、子をもうける時点まで生きて六十五歳になったことを表す。後続の出来事との時間関係が自然に伝わる日本語とした。
- source_word: חֲנוֹךְ
  choice: エノク
  rationale: 人名は、日本語聖書で広く定着している慣用表記を用いた。
- source_word: חָמֵשׁ וְשִׁשִּׁים שָׁנָה
  choice: 六十五歳
  rationale: ヘブライ語の「五と六十年」を、自然な現代日本語の年齢表現にした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とする系図上の ילד は子を生ませる、すなわち父となることを示す。「もうけた」は簡潔で自然であり、系図にふさわしい品位も保つ。
- source_word: אֶת
  choice: 訳出しない
  rationale: 直接目的語を示す標識であり、日本語では語順と助詞によって機能を表すため、独立して訳さない。
- source_word: מְתוּשָׁלַח
  choice: メトシェラ
  rationale: 人名は、日本語聖書で広く定着している慣用表記を用いた。
