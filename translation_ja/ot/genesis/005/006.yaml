  text: וַֽ/יְחִי שֵׁ֕ת חָמֵ֥שׁ שָׁנִ֖ים וּ/מְאַ֣ת שָׁנָ֑ה וַ/יּ֖וֹלֶד אֶת אֱנֽוֹשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/006.yaml
  text: Seth lived 105 years and fathered Enosh[a].
translation:
  language: ja
  text: セトは百五年生きて、エノシュの父となった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「エノシュをもうけた」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系図の年齢定型句における חיה は、次に記される出来事までに達した年齢を示すため、自然な現代日本語で「生きて」とした。
- source_word: שֵׁת
  choice: セト
  rationale: ヘブライ語名 שֵׁת を、日本語聖書で広く通用する表記「セト」とした。
- source_word: חָמֵשׁ שָׁנִים וּמְאַת שָׁנָה
  choice: 百五年
  rationale: 字面では「五年と百年」だが、意味は105年である。本文の格調と読みやすさを考慮し、漢数字で「百五年」とした。
- source_word: וַיּוֹלֶד
  choice: 父となった
  rationale: 系図における ילד の使役形は子をもうけることを表す。「もうけた」も可能だが、明瞭で自然な「父となった」を採用した。
- source_word: אֶת אֱנוֹשׁ
  choice: エノシュ
  rationale: אֶת は直接目的語標識なので訳出せず、אֱנוֹשׁ はヘブライ語の音に沿って「エノシュ」とした。
theological_decisions: []
