base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/015.yaml
  text: Mahalalel lived sixty-five years and fathered Jared.
translation:
  language: ja
  text: マハラルエルは六十五年生きて、ヤレドをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系図の定型表現として、次の出来事までの年数を示す。続く動詞と自然につながる現代日本語にした。
- source_word: מַהֲלַלְאֵל
  choice: マハラルエル
  rationale: 固有名を翻訳せず、ヘブライ語の子音と音節構造を踏まえて日本語表記した。
- source_word: חָמֵשׁ שָׁנִים וְשִׁשִּׁים שָׁנָה
  choice: 六十五年
  rationale: 原文は「五年と六十年」の順だが、数値を正確に保ちながら自然な日本語の語順にした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とする系図で、子を生じさせたことを表す。古風な「生んだ」「生ませた」より自然かつ簡潔で、「父となった」より原語の生殖的意味を保つ。
- source_word: אֶת יָרֶד
  choice: ヤレドを
  rationale: אֶתは直接目的語を示すため助詞「を」で表し、固有名יָרֶדは原語に沿って「ヤレド」と音写した。
theological_decisions: []
translation_notes:
  register: 簡潔な系図文のリズムを保ち、明瞭で現代的ながら聖書本文にふさわしい落ち着いた文体とした。日本語の伝統的表記「マハラレル」「ヤレド」もあり得るが、ここではヘブライ語の母音を比較的明示する「マハラルエル」とした。
