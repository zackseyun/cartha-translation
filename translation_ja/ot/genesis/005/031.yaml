  text: וַֽ/יְהִי֙ כָּל יְמֵי לֶ֔מֶךְ שֶׁ֤בַע וְ/שִׁבְעִים֙ שָׁנָ֔ה וּ/שְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יָּמֹֽת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/031.yaml
  text: So all the days of Lamech were seven hundred seventy-seven years[a], and he died.
translation:
  language: ja
  text: レメクの生涯は全部で七百七十七年であった[a]。そして彼は死んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、数詞は「七と七十年、そして七百年」の順に置かれている。合計で七百七十七年。
    reason: 原文特有の数詞の配列を示すため。
lexical_decisions:
- source_word: וַיְהִי
  choice: であった
  rationale: 継続・総括を表す היה の物語形を、年齢を述べる自然な日本語の述語として表した。接続の力は、後半の「こうして」と文脈の流れによって保った。
- source_word: כָּל יְמֵי
  choice: 生涯は全部で
  rationale: 直訳は「すべての日々」だが、人の全生存期間を指す定型表現なので、現代日本語で明瞭な「生涯」とし、כָּל は「全部で」に反映した。
- source_word: לֶמֶךְ
  choice: レメク
  rationale: ヘブライ語人名の日本語聖書で一般的な音写を採用した。
- source_word: שֶׁבַע וְשִׁבְעִים ... וּשְׁבַע מֵאוֹת
  choice: 七百七十七
  rationale: 原文は一の位、十の位、百の位の順に数えるが、合計は777であり、日本語の通常の数詞順で明瞭に表した。原語の語順は脚注で示した。
- source_word: שָׁנָה
  choice: 年
  rationale: 数詞に続く年齢表現として、現代日本語で自然な助数的用法の「年」を用いた。
- source_word: וַיָּמֹת
  choice: こうして彼は死んだ
  rationale: 創世記5章で繰り返される死の結句を簡潔に保ち、וַ の物語上の帰結・継起を「こうして」で表した。
theological_decisions:
- issue: 創世記5章の系図における寿命の定型句
  choice: 本文どおり、レメクの寿命を七百七十七年という直接的な年数として訳す。
  alternative: 数字を象徴的な意味に解して訳文に織り込む。
  rationale: ヘブライ語本文は寿命の総数と死を明示している。数字の象徴性や歴史性についての解釈を翻訳そのものに持ち込まず、本文の直接的な陳述を保った。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。系図の反復的な調子を保ちながら、「すべての日々」の不自然な直訳は避けた。
