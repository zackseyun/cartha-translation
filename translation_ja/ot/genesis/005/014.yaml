lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: こうして、…となった
  rationale: 系図の記述を進め、その生涯の総年数をまとめるワウ継続法の働きを、自然な日本語で表した。
- source_word: כָּל יְמֵי קֵינָן
  choice: ケナンの生涯は全部で
  rationale: 字義的には「ケナンの日々のすべて」だが、この反復される系図定型句では全生涯を意味するため、「生涯」とした。「全部で」によってכָּלの総計の意味も保持した。
- source_word: קֵינָן
  choice: ケナン
  rationale: ヘブライ語の音形に基づく現代日本語の慣用的な音写を採用した。
- source_word: עֶשֶׂר שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 九百十年
  rationale: 原文の「十年と九百年」という数詞順を、日本語で自然な位取り順に整えた。
- source_word: וַיָּמֹת
  choice: そして彼は死んだ
  rationale: 系図を締めくくる簡潔な定型句を直接的に訳し、接続関係も明示した。
