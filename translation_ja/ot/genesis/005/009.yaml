  text: Enosh lived ninety years and fathered Kenan[a][b].
translation:
  language: ja
  text: エノシュは九十歳のとき、ケナン[a]をもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ギリシア語形に基づき、この名を「カイナン」と表記する伝統もある。ヘブライ語本文は「ケナン」。
