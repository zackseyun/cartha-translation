lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系図の年齢表現における חיה は「生きる」を意味する。「九十年生きて」とすることで、原文の簡潔な構文を自然な日本語で保った。
- source_word: אֱנוֹשׁ
  choice: エノシュ
  rationale: マソラ本文のヘブライ語形を反映した人名表記。
- source_word: תִּשְׁעִים שָׁנָה
  choice: 九十年
  rationale: 年齢を表すヘブライ語表現を、自然な日本語の数詞表現にした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とする系図で、使役形の ילד は子を生じさせることを表す。「もうけた」は「生んだ」より主語の性別と文脈に適し、古風すぎず簡潔である。
- source_word: אֶת
  choice: 訳出しない
  rationale: 直接目的語を示す文法的標識であり、日本語では語順と助詞「を」によって機能を表した。
- source_word: קֵינָן
  choice: ケナン
  rationale: マソラ本文のヘブライ語名 קֵינָן を直接反映する表記とした。
