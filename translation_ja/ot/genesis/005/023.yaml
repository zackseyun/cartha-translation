  yaml_path: translation/ot/genesis/005/023.yaml
  text: So all the days of Enoch were three hundred sixty-five years.
translation:
  language: ja
  text: こうして、エノクの生涯は全部で三百六十五年であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: こうして、…であった
  rationale: 系図における生涯の総括を導く継続・帰結の働きを、自然な現代日本語で表した。
- source_word: כָּל יְמֵי
  choice: 生涯は全部で
  rationale: 字義的には「すべての日々」だが、この系図の定型表現では全生涯を指す。「生涯」によって意味を明確にし、「全部で」によりכָּלの総計の意味を保った。
- source_word: חֲנוֹךְ
  choice: エノク
  rationale: 固有名を日本語で慣用的な聖書表記に音写した。
- source_word: חָמֵשׁ וְשִׁשִּׁים ... וּשְׁלֹשׁ מֵאוֹת
  choice: 三百六十五
  rationale: 原文では「五と六十、そして三百」の順だが、数値を自然な日本語の桁順で表した。
- source_word: שָׁנָה ... שָׁנָה
  choice: 年
  rationale: ヘブライ語では数詞の各部分に「年」が付くが、日本語では総数の後に一度だけ「年」を置くのが自然である。
theological_decisions: []
translation_notes:
  register: 簡潔な系図の総括文として、現代の一般読者に明瞭でありながら品位ある文体とした。「すべての日々」という直訳調は避け、原文が表す全生涯という意味を自然な「生涯は全部で」で伝えた。
