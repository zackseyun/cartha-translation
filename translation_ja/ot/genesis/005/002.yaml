id: GEN.5.2
reference: Genesis 5:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: זָכָ֥ר וּ/נְקֵבָ֖ה בְּרָאָ֑/ם וַ/יְבָ֣רֶךְ אֹתָ֗/ם וַ/יִּקְרָ֤א אֶת שְׁמָ/ם֙ אָדָ֔ם בְּ/י֖וֹם הִבָּֽרְאָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/002.yaml
  text: Male and female he created them[a], and he blessed them and called their name Man on the day they were created.
translation:
  language: ja
  text: 神は彼らを男と女に創造し、彼らを祝福した。そして、彼らが創造された日に、彼らを「人」[a]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「アダム」。この語は集合的に「人」または「人類」を意味し、同時に固有名「アダム」でもある。
    reason: alternative_reading
lexical_decisions:
- source_word: זָכָר וּנְקֵבָה
  choice: 男と女
  rationale: 対をなす語の性別上の区別を明確に保ちつつ、日本語の創造物語として自然に表現した。
- source_word: בְּרָאָם
  choice: 彼らを…創造し
  rationale: בראの能動態と三人称複数目的語をそのまま示し、主語である神を文脈に即して明示した。
- source_word: וַיְבָרֶךְ אֹתָם
  choice: 彼らを祝福した
  rationale: 神の行為を簡潔かつ標準的な聖書日本語で表した。
- source_word: וַיִּקְרָא אֶת־שְׁמָם
  choice: 彼らを…と名づけた
  rationale: 直訳的な「彼らの名を…と呼んだ」より自然な日本語としながら、二人に一つの集合的名称が与えられたことを保持した。
- source_word: אָדָם
  choice: 人
  rationale: 直前の男と女の双方を指す集合的用法が第一義的であるため。「アダム」という固有名との語形上の重なりは脚注に残した。
- source_word: בְּיוֹם הִבָּרְאָם
  choice: 彼らが創造された日に
  rationale: 時間表現とニファル形の受動の意味を保ち、自然な日本語にした。
theological_decisions:
- issue: 男と女に与えられた אָדָם という一つの名称
  choice: 人
  alternative: アダム／人類
  rationale: この節では男と女が共に命名の対象なので、集合的な「人」を本文に採用した。ただし、ヘブライ語 אָדָם は「人」「人類」を意味すると同時に固有名「アダム」でもあり、系図の文脈における意図的な重なりを脚注で示した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「男と女」は原文の対称性を自然な日本語で示す。「名づけた」によって日本語としての流れを整えつつ、二人に一つの集合名が与えられた点を保持した。
