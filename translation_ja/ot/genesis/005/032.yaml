source:
  edition: WLC
  text: וַֽ/יְהִי נֹ֕חַ בֶּן חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֣וֹלֶד נֹ֔חַ אֶת שֵׁ֖ם אֶת חָ֥ם וְ/אֶת יָֽפֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/032.yaml
  text: When Noah was five hundred years old[a], he fathered Shem, Ham[b], and Japheth.
translation:
  language: ja
  text: ノアは五百歳になったとき、セム、ハム、ヤフェトをもうけた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「セム、ハム、ヤフェト」の順はヘブライ語本文に従う。この順が必ずしも出生順を示すわけではなく、三人全員が同じ年に生まれたという意味とも限らない。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי נֹחַ בֶּן חֲמֵשׁ מֵאוֹת שָׁנָה
  choice: ノアは五百歳になったとき
  rationale: 年齢を表す「בן＋数＋שנה」を自然な現代日本語で表し、וַיְהִי がここで後続する出来事の時を示す働きも「とき」によって反映した。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とする ילד のヒフィル形は「父となる、子をもうける」の意。「もうけた」は古風すぎず、単なる所有を表す「持った」より正確である。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: שֵׁם
  choice: セム
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: חָם
  choice: ハム
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: יָפֶת
  choice: ヤフェト
  rationale: ヘブライ語の発音に比較的近く、現代日本語で用いられる人名表記を採用した。
- source_word: אֶת שֵׁם אֶת חָם וְאֶת יָפֶת
  choice: セム、ハム、ヤフェトを
  rationale: 目的語標識 אֶת は訳出せず、原文の人名順を保ちながら自然な日本語の列挙とした。
theological_decisions:
- issue: 「セム、ハム、ヤフェト」という列挙と出生順・出生時期の関係
  choice: 原文の人名順を保ちつつ、三人が全員ノアの五百歳の年に生まれたとも、この順が出生順であるとも本文では断定しない。
  alternative: 推定される出生順に並べ替える、または三人が同じ年に生まれたと明示する。
  rationale: 原文はノアが五百歳となったことに続けて三人をもうけたと述べるが、列挙順が厳密な出生順であることや、三人全員が同じ年に生まれたことまでは明示しないため、その曖昧さを保持した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、系図の簡潔で荘重な調子を保った。「子をもうけた」も可能だが、目的語が人名であるため簡潔な「もうけた」とした。
