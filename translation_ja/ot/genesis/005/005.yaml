lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 生きた日々は全部で…であった
  rationale: 系図で繰り返される生涯の総数を示す定型句を保ちつつ、現代日本語として自然にした。「日々」によって、人生を「日」で数えるヘブライ語の表現も残している。
- source_word: אָדָם
  choice: アダム
  rationale: ここでは系図中の特定の人物を指す固有名であり、「人」や「人類」ではなく音写した。
- source_word: אֲשֶׁר חַי
  choice: アダムが生きた
  rationale: 直前の「日々」を修飾する関係節の意味を、自然な日本語の連体修飾で表した。
- source_word: תְּשַׁע מֵאוֹת ... וּשְׁלֹשִׁים שָׁנָה
  choice: 九百三十年
  rationale: 原文の数値を漢数字で表し、系図にふさわしい落ち着いた文体を保った。
- source_word: וַיָּמֹת
  choice: こうして彼は死んだ
  rationale: 生涯の総括に続く結末として接続を自然に示しながら、創世記5章で反復される死の簡潔で重い表現を保った。
theological_decisions:
- issue: אָדָם の解釈
  choice: 固有名「アダム」
  alternative: 「人」または「人類」
  rationale: 語自体には「人」「人類」の意味もあるが、この箇所は系図の中で名指された個人の生涯を総括しているため、固有名と判断した。
- issue: 死の定型句の保持
  choice: 「彼は死んだ」と明言する
  alternative: 「その生涯を終えた」などの婉曲表現
  rationale: 原文が繰り返す וַיָּמֹת の直接性と、人間の死を強調する系図の神学的重みを弱めないため。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。系図の反復表現と「彼は死んだ」という簡潔な結びを保ち、過度に古風な語法は避けた。
