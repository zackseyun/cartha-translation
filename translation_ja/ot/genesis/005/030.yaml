  text: וַֽ/יְחִי לֶ֗מֶךְ אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת נֹ֔חַ חָמֵ֤שׁ וְ/תִשְׁעִים֙ שָׁנָ֔ה וַ/חֲמֵ֥שׁ מֵאֹ֖ת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/030.yaml
  text: And Lamech lived five hundred and ninety-five years after he fathered Noah[a], and he fathered sons and daughters.
translation:
  language: ja
  text: レメクは、ノアをもうけてから五百九十五年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 創世記5章の系図定型において、名指された子の誕生後に生きた期間を表すため、自然な現代日本語の「生き」とした。
- source_word: אַחֲרֵי
  choice: 後
  rationale: ノアをもうけた時点より後の期間を示す時間表現として、「後」が簡潔で自然である。
- source_word: הוֹלִידוֹ / וַיּוֹלֶד
  choice: もうけた／もうけ
  rationale: ヒフィル形の ילד が系図で表す父親として子を生じさせる意味を保ちつつ、現代日本語で読みやすい「もうける」を用いた。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で広く定着した人名表記を採用した。
- source_word: חָמֵשׁ וְתִשְׁעִים ... וַחֲמֵשׁ מֵאוֹת שָׁנָה
  choice: 五百九十五年
  rationale: ヘブライ語では九十五年と五百年の順だが、合計年数を日本語の自然な数詞順で示した。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子や娘たち
  rationale: 原文が男女の子を明示していることを保つ。「や」は両方の種類を列挙し、「たち」は複数性を自然に表す。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、系図にふさわしい簡潔で落ち着いた文体とした。原文の語順を日本語として自然になるよう整え、期間を「生き」の直後に置いた。
