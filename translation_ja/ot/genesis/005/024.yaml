reference: Genesis 5:24
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֥ךְ חֲנ֖וֹךְ אֶת הָֽ/אֱלֹהִ֑ים וְ/אֵינֶ֕/נּוּ כִּֽי לָקַ֥ח אֹת֖/וֹ אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/024.yaml
  text: Enoch walked with God[a], and he was no more, because God took him.
translation:
  language: ja
  text: エノクは神とともに歩んだ。そして、もはや彼はいなかった[a]。神が彼を取ったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「そして彼はいなかった」。このヘブライ語表現は、エノクがもはやそこにいなかったことを示す。
    reason: 原文の簡潔な不在表現と、日本語本文の自然な表現との対応を示すため。
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: 歩んだ
  rationale: 単なる身体的な歩行ではなく、継続的な生き方や神との関係を表すヘブライ語の慣用表現を、日本語でも「歩む」によって保った。
- source_word: אֶת הָאֱלֹהִים
  choice: 神とともに
  rationale: הלך とともに用いられた אֶת は同伴を示す。「神とともに」は、原文の関係的な含みを自然に伝える。
- source_word: וְאֵינֶנּוּ
  choice: そして、もはや彼はいなかった
  rationale: 直訳的な「彼はいなかった」を基礎に、「もはや」を添えて、それ以前にはいた者が今は不在であるという文脈上の意味を明確にした。消失の仕方は特定していない。
- source_word: כִּי
  choice: からである
  rationale: エノクがいなかった理由を導く因果関係を、明瞭な現代日本語で示した。
- source_word: לָקַח אֹתוֹ
  choice: 彼を取った
  rationale: לקח の基本義を保ち、神による特別な取り去りを示唆しつつも、行き先や死の有無を本文に付加しない表現とした。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この物語の文脈では唯一の神を指すため、「神」と訳した。
theological_decisions:
- issue: エノクが死ななかったこと、または天に移されたことを明記するか
  choice: 「もはや彼はいなかった。神が彼を取ったからである」と、原文の抑制された表現を保つ。
  alternative: 「彼は死ななかった」「神が彼を天に移した」などと明示する。
  rationale: 後代の聖書本文はこの出来事をさらに解釈するが、創世記5章24節自体は行き先を「天」とせず、死を直接否定もしない。そのため、神による異例の取り去りという含みを残しながら、原文以上に説明しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いた。「神とともに歩んだ」は聖書的な比喩を保ちつつ一般読者にも理解できる表現である。「取った」は意図的に簡潔にし、天への移行や不死を本文で断定しない。
