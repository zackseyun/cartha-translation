base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/004.yaml
  text: After he fathered Seth[a], Adam lived eight hundred years and fathered sons and daughters.
translation:
  language: ja
  text: アダムは、セトをもうけた後、八百年生き、息子と娘をもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ יְמֵי אָדָם
  choice: アダムが生きた年月は
  rationale: 直訳的には「アダムの日々は……であった」だが、人の生涯の期間を表すヘブライ語の慣用表現なので、自然な現代日本語で「生きた年月」とした。
- source_word: אָדָם
  choice: アダム
  rationale: 系図の文脈では人類一般ではなく、個人名を指す。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־שֵׁת
  choice: セトをもうけた後
  rationale: הוליד のヒフィル形はここでは父として子を得ることを表す。「もうける」は男性側の生殖を含意しつつ、日本語として自然である。
- source_word: שְׁמֹנֶה מֵאֹת שָׁנָה
  choice: 八百年
  rationale: 年数を示す明瞭な数詞表現としてそのまま訳した。
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: 彼は息子や娘たちをもうけた
  rationale: 原文が男女の子を明示しているため「子どもたち」と一括せず、「息子や娘たち」とした。וילד は前半と同じ語根なので「もうけた」で統一した。日本語では不特定複数の列挙に自然な「や」を用いた。
theological_decisions:
- issue: אָדָם の解釈
  choice: 個人名「アダム」
  alternative: 普通名詞「人」
  rationale: 創世記5章の系図では、セトの父である特定の人物を指しているため。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「アダムが生きた年月は」として原文の「アダムの日々は」という構文の輪郭を残しながら、不自然な逐語訳を避けた。
