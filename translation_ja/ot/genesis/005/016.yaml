  yaml_path: translation/ot/genesis/005/016.yaml
  text: After he fathered Jared, Mahalalel lived eight hundred and thirty years and fathered sons and daughters.
translation:
  language: ja
  text: マハラルエルは、ヤレドをもうけた後、八百三十年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系図の定型表現として、名を挙げられた子が生まれた後の生存年数を自然な現代日本語で示す。
- source_word: מַהֲלַלְאֵל
  choice: マハラルエル
  rationale: ヘブライ語の人名を、日本語聖書で理解しやすい慣用的な形に音写した。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת־יֶרֶד
  choice: ヤレドをもうけた後
  rationale: אַחֲרֵיの時間的な前後関係と、使役形 ילד が表す男性主体の生殖を、明瞭で過度に古風でない日本語にした。
- source_word: יֶרֶד
  choice: ヤレド
  rationale: ヘブライ語の人名を日本語で慣用的な形に音写した。
- source_word: שְׁלֹשִׁים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百三十年
  rationale: 原文の合計年数を保ちつつ、日本語で自然な数詞の順序にした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 前半の הוֹלִידוֹ と語彙上の対応を保ち、系図にふさわしい自然で dignified な現代語とした。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たちと娘たち
  rationale: 原文が男女の子を明示しているため、一般化して「子どもたち」とせず、その区別を保持した。
