lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 生涯は全部で…であった
  rationale: 直訳的な「すべての日々」は現代日本語では不自然なため、全生存期間を総括する系図の定型表現として「生涯は全部で」とした。כָּל の包括性も「全部で」によって保持した。
- source_word: מַהֲלַלְאֵל
  choice: マハラルエル
  rationale: ヘブライ語名の音写として、明瞭で一貫した日本語表記を採用した。
- source_word: חָמֵשׁ וְתִשְׁעִים שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百九十五年
  rationale: ヘブライ語では九十五年と八百年の順だが、数値を正確かつ自然な日本語の語順で表した。
- source_word: וַיָּמֹת
  choice: そして彼は死んだ
  rationale: 創世記5章で反復される厳粛な結語を保ち、接続辞も「そして」で明示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準語を用いながら、創世記5章の反復的で厳粛な系図の調子を保った。「亡くなった」よりも原語に直接的で定型句の力を伝える「死んだ」を選んだ。
