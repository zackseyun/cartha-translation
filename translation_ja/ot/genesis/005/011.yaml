lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 生涯は全部で…であった
  rationale: 系図において全生涯の長さをまとめる定型表現。ヘブライ語の「すべての日々」を逐語的に写すより、現代日本語で自然かつ意味の明確な「生涯は全部で」とした。
- source_word: אֱנוֹשׁ
  choice: エノシュ
  rationale: ヘブライ語の発音に近い形で固有名を音写した。
- source_word: חָמֵשׁ שָׁנִים וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 九百五年
  rationale: 原文は「五年と九百年」の順だが、総数を自然な日本語の数詞順序で表した。
- source_word: וַיָּמֹת
  choice: そして彼は死んだ
  rationale: 創世記5章で繰り返される締めくくりの定型句を、簡潔で厳粛な日本語として保った。
