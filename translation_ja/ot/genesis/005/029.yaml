  text: וַ/יִּקְרָ֧א אֶת שְׁמ֛/וֹ נֹ֖חַ לֵ/אמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤/נוּ מִֽ/מַּעֲשֵׂ֨/נוּ֙ וּ/מֵ/עִצְּב֣וֹן יָדֵ֔י/נוּ מִן הָ֣/אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖/הּ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/029.yaml
  text: And he called his name Noah[a], saying, “This one will comfort us from our work and from the painful toil of our hands, from the ground that Yahweh has cursed.”
translation:
  language: ja
  text: 彼はその子をノア[a]と名づけて、言った。「この子は、ヤハウェが呪われた大地のゆえに私たちがする働きと、私たちの手のつらい労苦から、私たちを慰めてくれるだろう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ノア」という名は「休息、安らぎ」を思わせる響きを持ち、ここで「慰めてくれる」と訳した語との語呂合わせになっている。
    reason: 名称と動詞の音韻的連関、および厳密な語源とは異なる言葉遊びを示すため。
lexical_decisions:
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: 彼はその子を…と名づけて
  rationale: ヘブライ語の命名定型を、現代日本語で自然な「その子を…と名づける」とした。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で定着している固有名表記を採用した。
- source_word: זֶה
  choice: この子
  rationale: 指示語の力を保ちつつ、父が名づけた子を指すことを明確にした。
- source_word: יְנַחֲמֵנוּ
  choice: 私たちを慰めてくれるだろう
  rationale: 語根נחםの基本義「慰める」を直接反映し、ノアの名との音の響きは脚注で示した。
- source_word: מִמַּעֲשֵׂנוּ
  choice: 私たちの働き
  rationale: ここでは道徳的な「行い」ではなく、大地を耕す労働を指す。
- source_word: וּמֵעִצְּבוֹן יָדֵינוּ
  choice: 私たちの手のつらい労苦
  rationale: 創世記3章のעִצָּבוֹןが表す苦痛と労苦の両面、および「手」の比喩を保った。
- source_word: מִן־הָאֲדָמָה אֲשֶׁר אֵרְרָהּ יְהוָה
  choice: 主が呪われた大地による
  rationale: 前置詞מןを原因・起点として自然に表し、関係節が「大地」を修飾する構造を保った。יְהוָהは日本語で広く定着した「主」とした。
theological_decisions:
- issue: ノアという名とיְנַחֲמֵנוּの語呂合わせ
  choice: 本文は「慰めてくれる」とし、名称との響きと「安らぎ」の連想を脚注に置く
  alternative: 「私たちに安らぎを与える」「私たちを楽にする」
  rationale: 動詞の直接的な意味は「慰める」だが、ノア（נֹחַ）は「休息・安らぎ」を連想させる。厳密な語源関係に還元せず、本文と脚注で双方を保存した。
- issue: מןの反復が示す関係
  choice: 大地を労苦の原因・源として「大地による」と訳す
  alternative: 「大地から」「大地について」
  rationale: 呪われた大地から生じる働きと苦痛という創世記3章への連関を、日本語として明瞭にした。ただし原文の統語には多少の幅がある。
translation_notes:
  register: 明瞭な現代標準語を用い、物語としての格調を保った。「この子」「つらい労苦」により意味を直感的にしつつ、原文の反復と神学的緊張を過度に解消しないようにした。
