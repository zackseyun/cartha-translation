revisions:
- from: 彼はその子をノア[a]と名づけて、言った。「この子は、主が呪われた大地による私たちの働きと、私たちの手のつらい労苦から、私たちを慰めてくれるだろう。」
  to: 彼はその子をノア[a]と名づけて、言った。「この子は、ヤハウェが呪われた大地のゆえに私たちがする働きと、私たちの手のつらい労苦から、私たちを慰めてくれるだろう。」
  rationale: 動詞נחםの「慰める」を本文に保ち、ノアの名との言葉遊びは脚注で示した。末尾の「地から／地のゆえに」という句は、呪われた地に起因する労働と苦痛という文脈を自然に表すため「呪われた大地のゆえに」とした。神名は原語およびPOBのYahweh表記方針に合わせて「ヤハウェ」に改めた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:12:35Z'
