lexical_decisions:
- source_word: וַיְחִי
  choice: 生きて
  rationale: 系図の定型表現における חיה を自然な現代日本語で表し、後続の出来事につながるヘブライ語の叙述形も「て」で反映した。
- source_word: קֵינָן
  choice: ケナン
  rationale: ヘブライ語本文の音形に基づく、現代日本語で明瞭な音写とした。
- source_word: שִׁבְעִים שָׁנָה
  choice: 七十年
  rationale: 期間を示す原文の表現を保った。文脈上、マハラルエルをもうけた時点の年齢を意味する。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 男性を主語とする系図上の「生ませた／父となった」という意味を、簡潔で自然かつ品位ある現代日本語で表した。
- source_word: אֶת
  choice: 訳出しない
  rationale: 定目的語を示す文法標識であり、日本語では語順と助詞「を」によって機能を表す。
- source_word: מַהֲלַלְאֵל
  choice: マハラルエル
  rationale: ヘブライ語の子音および母音形に沿った日本語音写とした。
