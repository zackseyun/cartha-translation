lexical_decisions:
- source_word: וַיִּהְיוּ כָּל יְמֵי
  choice: 生涯は全部で
  rationale: 直訳的には「すべての日々は」だが、系図における寿命の総計を、現代日本語として自然かつ明確に表す。「全部で」により כָּל の総計の意味も保持する。
- source_word: מְתוּשֶׁלַח
  choice: メトシェラ
  rationale: ヘブライ語名の一般的な日本語聖書表記に従った。
- source_word: תֵּשַׁע וְשִׁשִּׁים ... וּתְשַׁע מֵאוֹת שָׁנָה
  choice: 九百六十九年
  rationale: ヘブライ語では「六十九年と九百年」の順だが、数値を自然な現代日本語の位取り順で表した。
- source_word: וַיָּמֹת
  choice: そして彼は死んだ
  rationale: 創世記5章で繰り返される結語を簡潔に保持し、接続辞 וַ を「そして」で表した。
