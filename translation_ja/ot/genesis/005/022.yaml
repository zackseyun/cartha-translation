source:
  edition: WLC
  text: וַ/יִּתְהַלֵּ֨ךְ חֲנ֜וֹךְ אֶת הָֽ/אֱלֹהִ֗ים אַֽחֲרֵי֙ הוֹלִיד֣/וֹ אֶת מְתוּשֶׁ֔לַח שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַ/יּ֥וֹלֶד בָּנִ֖ים וּ/בָנֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/022.yaml
  text: Enoch walked with God three hundred years after he fathered Methuselah[b][a], and he fathered sons and daughters.
translation:
  language: ja
  text: エノクは、メトシェラをもうけた後、三百年にわたって神とともに歩み[a]、息子や娘たちをもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「神とともに歩いた」。神との関係のうちに生きたことを表す言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלֵּךְ
  choice: 歩み
  rationale: הלךのヒトパエル形は、ここでは神との関係における生き方を表す比喩的な慣用表現である。原文の比喩を保ちつつ、自然な日本語とした。
- source_word: אֶת הָאֱלֹהִים
  choice: 神とともに
  rationale: この慣用句におけるאֶתは同伴・関係を表す。「神の前で」よりも、原文の「神とともに歩む」という関係的な表現をよく保持する。
- source_word: אַחֲרֵי הוֹלִידוֹ אֶת מְתוּשֶׁלַח
  choice: メトシェラをもうけた後
  rationale: אַחֲרֵיの時間的意味と、使役形のילדが示す父親として子をもうける意味を明確に訳した。
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: 三百年にわたって
  rationale: この期間表現はエノクが神とともに歩んだ期間を示すため、日本語でその係り先が明瞭になるよう「にわたって」を補った。
- source_word: וַיּוֹלֶד בָּנִים וּבָנוֹת
  choice: 息子や娘たちをもうけた
  rationale: 原文が男女の子を明記していることを保持した。「や」はほかにも複数の息子と娘がいたことを自然にまとめる日本語表現である。
theological_decisions:
- issue: 「神とともに歩む」という表現が示すエノクと神との関係
  choice: 比喩を保って「神とともに歩み」とする
  alternative: 神と親しく交わりながら生きた／神に忠実に生きた
  rationale: 説明的な訳は親密さや忠実さのどちらかに意味を限定しうる。原文の関係的な比喩と、その神学的な含みを解消せずに保持した。
translation_notes:
  register: 明瞭で品位ある現代標準語。「もうけた」は系図の文脈に適した自然な表現であり、「生んだ」より父親を主語とする原文に合う。期間句を「三百年にわたって」として、メトシェラをもうける行為ではなく「神とともに歩む」ことの継続期間だと明確にした。
