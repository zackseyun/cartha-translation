base_translation:
  language: en
  yaml_path: translation/ot/genesis/005/010.yaml
  text: And Enosh lived eight hundred and fifteen years after he fathered Kenan[c][b][a], and he fathered sons and daughters.
translation:
  language: ja
  text: エノシュはケナンをもうけた後、八百十五年生き、息子たちと娘たちをもうけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְחִי
  choice: 生き
  rationale: 系譜の定型表現におけるחיהを、自然で簡潔な現代日本語にした。
- source_word: אֱנוֹשׁ
  choice: エノシュ
  rationale: ヘブライ語の人名אֱנוֹשׁを直接反映する標準的な音写とした。
- source_word: אַחֲרֵי הוֹלִידוֹ
  choice: もうけた後
  rationale: 時間的前後関係と、使役形ילדが示す父系系譜上の意味を自然な日本語で表した。
- source_word: קֵינָן
  choice: ケナン
  rationale: ギリシア語系の伝統形ではなく、ヘブライ語本文の人名を直接音写した。
- source_word: חֲמֵשׁ עֶשְׂרֵה שָׁנָה וּשְׁמֹנֶה מֵאוֹת שָׁנָה
  choice: 八百十五年
  rationale: ヘブライ語の十五年と八百年の合計を、日本語で通常の数詞順にした。
- source_word: וַיּוֹלֶד
  choice: もうけた
  rationale: 系譜におけるילדの意味を、古風すぎず父親を主語とする表現として明確に訳した。
- source_word: בָּנִים וּבָנוֹת
  choice: 息子たち、娘たち
  rationale: 原文が男女の子を明示しているため、包括的な「子どもたち」にはまとめなかった。
