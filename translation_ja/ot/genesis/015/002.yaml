base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/002.yaml
  text: But Abram said[a], “Lord Yahweh, what will you give me, since I am going childless, and the heir of my house is Eliezer of Damascus?”
translation:
  language: ja
  text: しかし、アブラムは言った。「主ヤハウェよ、私に何をくださるというのでしょう。私は子のないまま歩んでいるのに、私の家を受け継ぐ者[a]はダマスコのエリエゼルなのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「私の家のメシェクの子」（「メシェク」は意味の確定しにくいヘブライ語の語）。珍しい表現で、「私の家の管理人」または「私の家を所有する者」とも解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかし、アブラムは言った
  rationale: 接続詞は物語を進めるが、ここでは直前の約束に対するアブラムの懸念を導くため、対照的な「しかし」が文脈に合う。
- source_word: אֲדֹנָי יֱהוִה
  choice: 主ヤハウェよ
  rationale: אֲדֹנָיを称号「主」、יֱהוִהを神名「ヤハウェ」とし、呼びかけとして自然な日本語にした。
- source_word: מַה תִּתֶּן לִי
  choice: 私に何をくださるというのでしょう
  rationale: 未完了形の将来的意味を保ちつつ、約束を受けて問い返すアブラムの懸念が自然に伝わる表現とした。
- source_word: וְאָנֹכִי הוֹלֵךְ עֲרִירִי
  choice: 私は子のないまま世を去ろうとしており
  rationale: הוֹלֵךְは字義的には「行く、歩む」だが、この文脈では子のないまま生涯の終わりへ向かうことを表す。「世を去ろうとしている」は死への含意を自然に示し、עֲרִירִיは「子のないまま」とした。
- source_word: בֶן מֶשֶׁק בֵּיתִי
  choice: 私の家を受け継ぐ者
  rationale: 極めて珍しく意味の確定しにくい表現である。次節の相続をめぐる文脈に基づき本文では明瞭な訳を採り、字義と別解は脚注に残した。
- source_word: דַּמֶּשֶׂק אֱלִיעֶזֶר
  choice: ダマスコのエリエゼル
  rationale: エリエゼルをダマスコとの出身・関係によって特定する同格表現として、自然な日本語にした。
theological_decisions:
- issue: 複合呼称 אֲדֹנָי יֱהוִה における神名の訳
  choice: 主ヤハウェ
  alternative: 主なる神／主なるヤハウェ
  rationale: 称号と固有の神名の両方を明示し、二要素を混同せずに保った。
- issue: בֶן מֶשֶׁק בֵּיתִי が指す役割
  choice: 私の家を受け継ぐ者
  alternative: 私の家の管理人／私の家の所有者
  rationale: 相続を扱う直後の文脈から「受け継ぐ者」が有力だが、語句そのものは不明瞭なので、他の可能性を排除せず脚注に示した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、アブラムの丁寧で切実な問いにふさわしい格調を保った。難解なヘブライ語句は本文で文脈上の有力な意味を示し、原文の不確かさは脚注に保存した。
