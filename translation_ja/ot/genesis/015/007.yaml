revisions:
- from: 主は彼に言われた。「わたしはヤハウェである。あなたをカルデア人のウルから連れ出し、この地をあなたに与えて、所有させる者である。」[a]
  to: ヤハウェは彼に言われた。「わたしはヤハウェである。あなたをカルデア人のウルから連れ出したのは、この地をあなたに与え、あなたの所有とするためである。」[a]
  rationale: 神名を「ヤハウェ」に統一し、原文の「連れ出した」および二つの目的不定詞（「与える」「所有する」）を、自然な日本語の目的表現として明示した。「あなたの所有とする」は、神が土地を与えることと、アブラムがそれを得て保持することの双方を表し、過度に限定的な相続解釈を本文に持ち込まない。
