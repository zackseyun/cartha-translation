  terminology: יְהוָהは本文・話者表示とも「ヤハウェ」として一貫させる。לְרִשְׁתָּהּには土地を所有する意味と「受け継ぐ」の語感があり、本文は「あなたの所有とする」、脚注で「受け継がせる」を示す。
