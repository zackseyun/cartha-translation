  text: וַ/יֹּ֖אמֶר אֵלָ֑י/ו אֲנִ֣י יְהוָ֗ה אֲשֶׁ֤ר הוֹצֵאתִ֨י/ךָ֙ מֵ/א֣וּר כַּשְׂדִּ֔ים לָ֧/תֶת לְ/ךָ֛ אֶת הָ/אָ֥רֶץ הַ/זֹּ֖את לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/007.yaml
  text: And he said to him[a], “I am Yahweh[c][b], who brought you out from Ur of the Chaldeans to give you this land to possess.”
translation:
  language: ja
  text: ヤハウェは彼に言われた。「わたしはヤハウェである。あなたをカルデア人のウルから連れ出したのは、この地をあなたに与え、あなたの所有とするためである。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの所有とする」は、「あなたに受け継がせる」または「あなたに取得させる」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 主は彼に言われた
  rationale: 話者は直前の文脈からヤハウェであるため、日本語では自然な主語を補った。接続辞は物語の連続性を担うが、独立した節では必ずしも「そして」と明示する必要はない。
- source_word: אֲנִי יְהוָה
  choice: わたしはヤハウェである
  rationale: 動詞のない名詞文に、日本語として必要な「である」を補った。神名は音写して「ヤハウェ」とした。
- source_word: הוֹצֵאתִיךָ
  choice: あなたを…から連れ出し
  rationale: יצאのヒフィル形が示す「外へ出させる／連れ出す」という使役的意味を自然な日本語で表した。
- source_word: מֵאוּר כַּשְׂדִּים
  choice: カルデア人のウルから
  rationale: 地名と民族名の属格関係を、日本語で定着した表現にした。
- source_word: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת
  choice: この地をあなたに与えて
  rationale: ל付き不定詞の目的的な働きを後続句とつなぎ、語順を日本語として自然に整えた。
- source_word: לְרִשְׁתָּהּ
  choice: 所有させる
  rationale: ירשׁは「所有する」「受け継ぐ」「占有する」などの幅を持つ。ここでは土地を受け取り保持する意味を中心に訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を明記しているため、その区別を保つ音写を本文に採用した。
- issue: לְרִשְׁתָּהּ の意味範囲
  choice: 所有させる
  alternative: 受け継がせる／取得させる
  rationale: 相続の含意を排除はしないが、この文脈では約束の地を取得し保持することを広く表す訳を選び、別の可能性を脚注に示した。
translation_notes:
  register: 明瞭で格調ある現代標準語。「主は」を補って指示対象を明確にし、神の自己宣言は「である」で荘重さを保った。
