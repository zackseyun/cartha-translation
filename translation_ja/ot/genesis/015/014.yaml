  text: וְ/גַ֧ם אֶת הַ/גּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְ/אַחֲרֵי כֵ֥ן יֵצְא֖וּ בִּ/רְכֻ֥שׁ גָּדֽוֹל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/014.yaml
  text: But I will also judge the nation that they serve[b][a], and afterward they will come out with great possessions.
translation:
  language: ja
  text: また、彼らが仕える国[a]をも、わたしは裁く。その後、彼らは多くの財産[b]を携えて出て行く。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らが奴隷として仕える」。ヘブライ語の動詞は字義的には「仕える、働く」だが、ここでは外国の支配下での強制的な奉仕を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「豊かな富」または「多くの財物」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: しかし…をも
  rationale: 接続と付加・強調の働きを保ちつつ、直前の苦役の予告と、それを行う国への裁きとの対照が自然に伝わる表現とした。
- source_word: הַגּוֹי
  choice: その国
  rationale: גּוֹי はここではアブラムの子孫を従属させる外国の民・国家を指す。「その国」は文脈上の特定性を自然に示す。
- source_word: אֲשֶׁר יַעֲבֹדוּ
  choice: 彼らが仕える
  rationale: עבד の明示的な意味である「仕える、働く」を本文に保った。文脈上は強制的な奉仕・隷属を指すため、その含意は脚注で示した。
- source_word: דָּן אָנֹכִי
  choice: わたしは裁く
  rationale: 分詞 דָּן と独立代名詞 אָנֹכִי による強調、および文脈上の未来的意味を日本語の「わたしは裁く」で表した。「罰する」よりも司法的な語感を保持する。
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 出来事の時間的な順序を簡潔で自然な現代日本語で示す。
- source_word: יֵצְאוּ
  choice: 出て来る
  rationale: יצא の基本義「出る」を保ち、束縛の地から外へ出ることを自然に表現した。
- source_word: בִּרְכֻשׁ גָּדוֹל
  choice: 多くの財産を携えて
  rationale: רְכוּשׁ の具体的な財物・所有物という意味を「財産」で表し、בְ の随伴的用法を自然な日本語の「携えて」で示した。גָּדוֹל はここでは量の大きさとして「多くの」とした。
theological_decisions:
- issue: 圧迫する国に対する神の行為の性質
  choice: 裁く
  alternative: 罰する
  rationale: ヘブライ語 דָּן の司法的意味を保ち、裁きの具体的結果を「処罰」に限定しないため。
- issue: 「仕える」が示す従属の程度
  choice: 本文では「仕える」とし、強制的な隷属という文脈上の含意を脚注に置く
  alternative: 奴隷として仕える／隷属させられる
  rationale: 動詞 עבד 自体の語義と、文脈が示す強制性の双方を区別して提示し、本文だけで解釈を過度に限定しないため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「わたし」「裁く」は聖書本文として自然な荘重さを保ち、「携えて」によって財産とともに退出する意味を簡潔に示した。
