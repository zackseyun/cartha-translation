  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו קְחָ֥/ה לִ/י֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְ/עֵ֥ז מְשֻׁלֶּ֖שֶׁת וְ/אַ֣יִל מְשֻׁלָּ֑שׁ וְ/תֹ֖ר וְ/גוֹזָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/009.yaml
  text: And he said to him[a], “Bring me a three-year-old heifer, a three-year-old female goat, a three-year-old ram, a turtledove[b], and a young pigeon.”
translation:
  language: ja
  text: 主はアブラムに言われた。「三歳の雌牛[b]、三歳の雌やぎ、三歳の雄羊、それに山鳩と若い鳩を、わたしのために持って来なさい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「わたしのために取りなさい」。ここでは、契約の儀式に用いる動物を用意して持って来る、という意味。
    reason: lexical_alternative
  - marker: b
    text: 「三歳の」と訳したヘブライ語は、字義的には「三つにされた」「三重の」とも解し得るが、ここでは伝統的に動物が三歳であることを示すと理解されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: 主はアブラムに言われた
  rationale: ヘブライ語は直訳すると「彼は彼に言った」。日本語で代名詞を重ねる不自然さと曖昧さを避け、文脈上の話者である主と相手であるアブラムを明示した。
- source_word: קְחָה לִי
  choice: わたしのために持って来なさい
  rationale: 字義的には「わたしのために取りなさい」だが、指定された動物を用意して差し出す文脈なので、「持って来なさい」が自然で意味に即している。「לִי」の受益・帰属の意味は「わたしのために」で保持した。
- source_word: עֶגְלָה
  choice: 雌牛
  rationale: 若い雌の牛を指す。現代日本語では簡潔で分かりやすい「雌牛」とした。
- source_word: מְשֻׁלֶּשֶׁת / מְשֻׁלָּשׁ
  choice: 三歳の
  rationale: 動物を列挙するこの文脈では、伝統的に年齢を表す語と理解されている。三頭すべてに繰り返して原文の反復を保った。別解の余地は脚注で示した。
- source_word: עֵז
  choice: 雌やぎ
  rationale: 雌のやぎを指すため、性別を明示しつつ一般読者に分かりやすい表現とした。
- source_word: אַיִל
  choice: 雄羊
  rationale: 成長した雄の羊を指す標準的な訳語である。
- source_word: תֹר
  choice: 山鳩
  rationale: 一般的な鳩ではなく、キジバト類の鳥を指す語として、聖書翻訳で定着し現代日本語でも理解可能な「山鳩」を用いた。
- source_word: גוֹזָל
  choice: 若い鳩
  rationale: 語自体はひな・若鳥を意味し得るが、山鳩と組み合わされた供犠の文脈では若い鳩を指す。過度に種類を限定せず「若い鳩」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。命令文は自然な「持って来なさい」とし、動物名は一般読者が理解しやすい語を選んだ。原文で省略される話者と相手は、文脈に従って「主」「アブラム」と明示した。
