base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/011.yaml
  text: And the birds of prey came down on the carcasses[a], and Abram drove them away.
translation:
  language: ja
  text: 猛禽たち[a]が死骸の上に降りて来て、アブラムはそれらを追い払った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「猛禽が」。ヘブライ語の名詞は単数形だが、ここでは集合的に、死肉をあさる鳥たちを指していると考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: 降りて来て
  rationale: 動詞 ירד の下降の動きを自然な現代日本語で表し、続く出来事との連続も保持した。
- source_word: הָעַיִט
  choice: 猛禽たち
  rationale: עַיִט は単数形だが集合的に鳥の群れを指し得る。特定の種に限定する「ハゲワシ」などを避け、文脈上の複数的な意味を明瞭にした。
- source_word: הַפְּגָרִים
  choice: 死骸
  rationale: פֶּגֶר は死体・動物の死骸を意味する。この箇所では屠られた動物を指すため、「切り分けたもの」より原語に忠実で自然である。日本語の「死骸」は形態上、単複を区別しない。
- source_word: וַיַּשֵּׁב אֹתָם
  choice: それらを追い払った
  rationale: שוב のヒフィル形が表す「引き返させる、退ける」という能動的な行為を、自然な日本語で表した。複数代名詞 אֹתָם に対応して「それら」とした。
- source_word: אַבְרָם
  choice: アブラム
  rationale: この時点では改名以前なので、標準的な表記「アブラム」を用いた。
