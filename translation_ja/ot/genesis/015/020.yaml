id: GEN.15.20
reference: Genesis 15:20
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶת הַ/חִתִּ֥י וְ/אֶת הַ/פְּרִזִּ֖י וְ/אֶת הָ/רְפָאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/020.yaml
  text: and the Hittites[a], and the Perizzites, and the Rephaim,
translation:
  language: ja
  text: また、ヘト人、ペリジ人、レファイム人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「巨人たち」。ヘブライ語「レファイム」は、文脈によってはそのように理解できるが、ここでは土地に住む一民族を指す可能性が高い。
    reason: 語義上の別訳を示し、固有の民族名と描写的な理解の両方を保持するため。
lexical_decisions:
- source_word: וְאֶת
  choice: また、
  rationale: 接続詞 וְ と目的語標識 אֵת が、前節から続く民の列挙に次の項目を加えている。日本語では目的語標識を訳出せず、列挙の継続を「また」で示した。
- source_word: הַחִתִּי
  choice: ヘト人
  rationale: 形態上は単数形だが、定冠詞を伴う民族名として集合的に用いられている。日本語で定着している民族名「ヘト人」とした。
- source_word: הַפְּרִזִּי
  choice: ペリジ人
  rationale: 形態上は単数形だが、ここでは民族集団を集合的に指す。日本語の慣用的な民族名「ペリジ人」とした。
- source_word: הָרְפָאִים
  choice: レファイム人
  rationale: 土地の諸民族を列挙する文脈では固有の民族集団を指す可能性が最も高い。本文では音写に「人」を添え、「巨人」という解釈は脚注に残した。
theological_decisions:
- issue: רְפָאִיםを民族名として訳すか、描写的に「巨人」と訳すか
  choice: 民族名「レファイム人」とした
  alternative: 巨人たち
  rationale: 創世記15章19～21節は、アブラムに約束された土地の諸民族を列挙しているため、ここでは民族名と読むのが文脈上最も自然である。ただし、他の文脈や伝統的理解で「巨人」と解される余地を消さないよう、脚注に示した。
translation_notes:
  register: 現代の一般読者に分かりやすく、聖書本文として簡潔で品位ある列挙表現とした。前節から文が続くため冒頭を「また」とし、民族名は日本語聖書で広く用いられる形を採用した。脚注記号は対象語「レファイム人」の直後に置いた。
