  text: and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: ja
  text: また、アモリ人、カナン人、ギルガシ人、エブス人。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת
  choice: また、／（読点による列挙）
  rationale: וְ は前節から続く一覧を結び、אֶת は定目的語を示す。日本語では目的語標識を各項目に再現せず、冒頭の「また」と読点で自然な列挙を表した。
- source_word: הָאֱמֹרִי
  choice: アモリ人
  rationale: 形態上は単数形の民族名だが、ここでは民族集団を集合的に指すため、日本語の慣用的な民族名「アモリ人」とした。
- source_word: הַכְּנַעֲנִי
  choice: カナン人
  rationale: 土地の住民である民族集団を指す集合的民族名として、標準的な「カナン人」とした。
- source_word: הַגִּרְגָּשִׁי
  choice: ギルガシ人
  rationale: ヘブライ語の民族名を、日本語聖書で理解しやすい標準的な音写「ギルガシ人」で表した。
- source_word: הַיְבוּסִי
  choice: エブス人
  rationale: 民族集団を指す名称として、日本語で一般的な「エブス人」とした。
theological_decisions: []
translation_notes:
  register: 前節から続く民族一覧の末尾であるため、簡潔で格調を保った現代標準日本語とした。原文の各項目に反復される וְאֶת は、日本語では不自然な反復を避けつつ、冒頭の「また」と読点による並列で構造を示した。
