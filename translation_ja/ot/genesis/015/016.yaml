  source_fidelity: 原文の語順・意味関係はおおむね正確である。「戻って来る」「ここに」「アモリ人の咎」「まだ満ちていない」は、帰還とアモリ人の不義が未完了であることとの理由関係を適切に保っている。ただし「四代目になって」は、個人の「四代目」を指すようにも読め、דּוֹר רְבִיעִי（第四の世代）の時点を明確にするには「第四世代に」がより忠実である。
