id: GEN.15.16
reference: Genesis 15:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/ד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא שָׁלֵ֛ם עֲוֺ֥ן הָ/אֱמֹרִ֖י עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/016.yaml
  text: And in the fourth generation they will return here[b][a], for the iniquity of the Amorites is not yet complete.
translation:
  language: ja
  text: 第四世代に、彼らはここに戻って来る。アモリ人[a]の咎が、まだ満ちていないからである[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は単数形で「アモリ人」とあり、民族全体を集合的に指していると考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「まだ」に当たる原文は、直訳すれば「ここまで」で、時間について「今まで」または文脈上「その時まで」の意に理解できる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְד֥וֹר רְבִיעִ֖י
  choice: 四代目になって
  rationale: דּוֹרは「世代」、רְבִיעִיは「第四の」を意味する。日本語では、子孫の第四世代に帰還するという時を自然に表すため「四代目になって」とした。
- source_word: יָשׁ֣וּבוּ
  choice: 彼らは…戻って来る
  rationale: שׁוּבの基本義である「戻る、帰る」を保ち、話者のいる「ここ」が目的地であるため「戻って来る」とした。
- source_word: הֵ֑נָּה
  choice: ここに
  rationale: 話者を基準とする方向・場所を示す語であり、約束の地への帰還を簡潔に表す。
- source_word: כִּ֧י
  choice: …からである
  rationale: 帰還がその時まで遅れる理由を導く接続詞として、説明の因果関係を明確にした。
- source_word: עֲוֺ֥ן
  choice: 咎
  rationale: עָוֹןには不義、罪責、またその結果という意味範囲がある。「咎」はここでの道徳的悪を表しつつ、その語義の幅を過度に狭めない。
- source_word: הָאֱמֹרִ֖י
  choice: アモリ人
  rationale: 形態上は単数形だが、民族全体を集合的に指す。日本語の「アモリ人」も個人と民族集団の双方を表し得るため、原文の形を自然に保てる。
- source_word: לֹא שָׁלֵ֛ם … עַד הֵֽנָּה
  choice: まだ満ちていない
  rationale: שָׁלֵםの「完全になる、満ちる」という意味と、עַד הֵנָּהの時間的限界を、日本語の自然な否定表現「まだ…ない」で表した。字義的な表現は脚注に示す。
theological_decisions:
- issue: 裁きと帰還が遅れる理由
  choice: 帰還の時期が、アモリ人の咎がまだ満ちていないことと結び付けられていると訳す。
  alternative: 神の忍耐を明示する、またはイスラエルがエジプトで形成されることを遅延の主目的として訳文に盛り込む。
  rationale: 本文が明示する理由だけを保ち、神の摂理や忍耐について本文にない体系的説明を加えない。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の宣言にふさわしい簡潔で品位ある文体とした。「咎」「満ちる」によって原文の法的・道徳的含意と比喩を保ち、説明しすぎない訳にした。
