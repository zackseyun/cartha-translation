  terminology: 「アモリ人」は単数形の集合的用法を自然に反映しており、脚注も有益である。「咎」はעָוֹןの倫理的な不義・罪責の含意を保つ。「満ちていない」はこの文脈での「完全に達していない」を自然に表す。
