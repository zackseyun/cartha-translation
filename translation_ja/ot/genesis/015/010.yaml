source:
  edition: WLC
  text: וַ/יִּֽקַּֽח ל֣/וֹ אֶת כָּל אֵ֗לֶּה וַ/יְבַתֵּ֤ר אֹתָ/ם֙ בַּ/תָּ֔וֶךְ וַ/יִּתֵּ֥ן אִישׁ בִּתְר֖/וֹ לִ/קְרַ֣את רֵעֵ֑/הוּ וְ/אֶת הַ/צִפֹּ֖ר לֹ֥א בָתָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/010.yaml
  text: So he brought all these to him[a], cut them in two, and placed each half opposite the other[c][b]; but he did not cut the birds in two.
translation:
  language: ja
  text: そこでアブラムは、これらすべてを神のもとへ持って来て[a]、真ん中で二つに切り分け、その切り分けた片を、それぞれ対応する片と向かい合わせに置いた[b]。しかし、鳥は切り分けなかった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼のために取った」。ここでは、9節の神の命令「わたしのために取れ」を受けて、神のもとへ持って来たことを指すと理解した。「自分のために取った」と理解することも文法上は可能である。
    reason: לוֹの指示対象とלקחの文脈的な訳し方に幅があるため。
  - marker: b
    text: 直訳すると「それぞれの切り分けた片を、その仲間の片と向かい合わせに置いた」。
    reason: ヘブライ語の配分的な慣用表現と空間配置を示すため。
lexical_decisions:
- source_word: וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה
  choice: これらすべてを彼のために取りそろえ
  rationale: לקחは基本的に「取る」。לוֹは文脈上、直前に命じた神を指す「彼のために」と読むのが自然である。「持って来た」と限定せず、命令に従って動物をそろえたことを明瞭に表した。
- source_word: וַיְבַתֵּר אֹתָם בַּתָּוֶךְ
  choice: 真ん中から二つに切り分けて
  rationale: בתרの「切り分ける」とבַּתָּוֶךְの「真ん中で」をともに反映し、契約儀礼の具体的な動作を保った。
- source_word: וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ
  choice: 片方をもう片方と向かい合わせに置いた
  rationale: אִישׁ ... רֵעֵהוּの配分的表現を、二つに切った各動物の両片が互いに向かい合う配置として自然な日本語にした。
- source_word: וְאֶת הַצִפֹּר לֹא בָתָר
  choice: しかし、鳥は切り分けなかった
  rationale: הַצִפֹּרは単数形だが、前節の二羽をまとめて指す集合的表現。日本語の「鳥」も数を限定せず集合的に理解できるため、そのまま簡潔に訳した。
theological_decisions:
- issue: 契約締結儀礼を示す動物の切り分け
  choice: 動物を二つに切って向かい合わせに置く具体的動作のみを訳文に示した
  alternative: 本文中で契約儀礼であることや、その象徴的意味を説明する
  rationale: この節は儀礼の準備を具体的に描写しているが、その意味を明示的には説明していない。後代の解釈を本文へ持ち込まず、物語が保つ神学的含意と緊張をそのまま残した。
- issue: לוֹの指示対象
  choice: 文脈上、神を指す「彼のために」
  alternative: 「自分のために」または単に「取った」
  rationale: 直前の神の命令「わたしのために取れ」（קָחָה לִי）への応答として読むのが最も自然。ただし、לוֹ自体には再帰的に理解できる余地があるため脚注で示した。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で品位ある物語文とした。「取りそろえ」でלקחの基本義と文脈上の準備行為を両立させ、「切り分ける」を反復して儀礼の具体性を保った。
