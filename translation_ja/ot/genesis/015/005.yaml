  text: וַ/יּוֹצֵ֨א אֹת֜/וֹ הַ/ח֗וּצָ/ה וַ/יֹּ֨אמֶר֙ הַבֶּט נָ֣א הַ/שָּׁמַ֗יְמָ/ה וּ/סְפֹר֙ הַ/כּ֣וֹכָבִ֔ים אִם תּוּכַ֖ל לִ/סְפֹּ֣ר אֹתָ֑/ם וַ/יֹּ֣אמֶר ל֔/וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/005.yaml
  text: Then he brought him outside and said[a], “Please look toward the heavens and count the stars, if you are able to count them.” Then he said to him, “So shall your offspring be.”
translation:
  language: ja
  text: 主はアブラムを外へ連れ出して言った。「さあ、天を見上げ、星を数えてみなさい。もし数えることができるなら。」また、主は彼に言った。「あなたの子孫[a]も、このようになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたの種」。ヘブライ語では単数形だが、集合的に子孫全体を指すことがある。
    reason: 語形上の単数性と集合的意味の両方を示し、後代の神学的解釈を訳文だけで一方に限定しないため。
lexical_decisions:
- source_word: וַיּוֹצֵא אֹתוֹ הַחוּצָה
  choice: アブラムを外へ連れ出して
  rationale: 使役形の「外へ出させる」という意味と方向を自然な現代日本語で表した。目的語は文脈上アブラムであり、日本語で代名詞を重ねる不自然さを避けるため固有名を補った。
- source_word: הַבֶּט נָא הַשָּׁמַיְמָה
  choice: さあ、天を見上げ
  rationale: 命令形と、それを促し・懇請として和らげる נָא の働きを「さあ」で表した。方向を示す語形は、日本語として自然な「天を見上げる」に反映した。
- source_word: וּסְפֹר הַכּוֹכָבִים
  choice: 星を数えてみなさい
  rationale: 「数える」を直接に訳し、「てみなさい」によって、続く「もし数えられるものなら」と自然につながる試行の含みを表した。
- source_word: אִם תּוּכַל לִסְפֹּר אֹתָם
  choice: もし数えられるものなら
  rationale: 能力を表す条件節を明確に保ち、星の数え尽くせなさを暗示しつつ、本文以上に断定しない表現とした。
- source_word: כֹּה יִהְיֶה
  choice: も、このようになる
  rationale: 比較を示す כֹּה を「このように」と訳し、子孫が星のようになるという比喩の具体的側面を本文で限定しなかった。
- source_word: זַרְעֶךָ
  choice: あなたの子孫[a]
  rationale: 現代日本語で人の後代を自然に表す「子孫」を採用した。ヘブライ語が単数形の集合名詞「種」であることは脚注で示し、語形上の含みを保持した。
theological_decisions:
- issue: アブラハムへの約束における זַרְעֶךָ の単数形と集合的意味
  choice: 本文を「あなたの子孫」とし、脚注で単数形の「種」であることを示す
  alternative: 「あなたの種」または「あなたの子孫たち」
  rationale: 「種」は語形に忠実だが、現代日本語では人について不自然または誤解を招きやすい。一方、「子孫たち」は複数性を必要以上に明示する。「子孫」は日本語で集合的に用いることができ、脚注と合わせて、単数・集合の神学的な緊張を一方に決めずに残せる。
- issue: 星との比較が何を指すか
  choice: 「このようになる」とし、数の多さを本文で明示しない
  alternative: 「星のように多くなる」
  rationale: 文脈上は多数性が強く示唆されるが、ヘブライ語の כֹּה は簡潔に「このように」であり、比較の範囲を訳文で狭めないようにした。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「見上げ」「数えてみなさい」により自然な語り口としつつ、約束の簡潔さを維持した。主語は直前の文脈上の話者を明確にするため「主」、目的語は「アブラム」とした。
