id: GEN.15.1
reference: Genesis 15:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: אַחַ֣ר הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הָיָ֤ה דְבַר יְהוָה֙ אֶל אַבְרָ֔ם בַּֽ/מַּחֲזֶ֖ה לֵ/אמֹ֑ר אַל תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔/ךְ שְׂכָרְ/ךָ֖ הַרְבֵּ֥ה מְאֹֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/001.yaml
  text: After these things[a], the word of Yahweh came to Abram in a vision, saying, “Do not fear, Abram. I am a shield for you; your reward will be very great.”
translation:
  language: ja
  text: 'これらの出来事の後、幻の中でヤハウェのことばがアブラムに臨んだ。


    「恐れるな、アブラム。わたしはあなたを守る盾である。あなたの報いは非常に大きい。」[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしはあなたの盾、あなたの非常に大きな報いである。」このように神ご自身を「報い」と読む解釈もある。ただし、マソラ本文の区切りは、本文のように「盾」と「報い」を別の叙述として読むことを支持する。
    reason: 神ご自身を「報い」とする伝統的な解釈を、本文より優勢な統語的読みとしてではなく、解釈上の別読みとして限定して示すため。
lexical_decisions:
- source_word: אַחַר הַדְּבָרִים הָאֵלֶּה
  choice: これらの出来事の後
  rationale: דְּבָרִים は「ことば」「事柄」の双方を表し得るが、ここでは直前の物語上の出来事を受けるため、「出来事」とするのが自然である。
- source_word: דְבַר יְהוָה
  choice: ヤハウェのことば
  rationale: 啓示を告げる定型的な表現を保ち、固有の神名 יְהוָה は音写して「ヤハウェ」とした。
- source_word: הָיָה ... אֶל אַבְרָם
  choice: アブラムに臨んだ
  rationale: 神のことばが人に与えられる啓示的な出来事を表す、自然で格調ある日本語の定型表現である。
- source_word: בַּמַּחֲזֶה
  choice: 幻の中で
  rationale: מַחֲזֶה は幻による啓示を指す。定冠詞を機械的に訳さず、日本語として自然に表現した。
- source_word: אַל תִּירָא
  choice: 恐れるな
  rationale: 否定命令の簡潔さと力を保ちつつ、現代日本語として明瞭にした。
- source_word: מָגֵן לָךְ
  choice: あなたの盾
  rationale: 直訳的には「あなたのための盾」だが、所有表現にしても神がアブラムを守るという比喩の意味は保たれ、日本語として自然である。
- source_word: שְׂכָרְךָ
  choice: あなたの報い
  rationale: שָׂכָר は賃金・報酬・報いを意味し得る。ここでは契約的な約束の広がりを損なわない「報い」を選んだ。
- source_word: הַרְבֵּה מְאֹד
  choice: 非常に大きい
  rationale: 動詞のないヘブライ語節を、現在形でも将来的な約束を表し得る自然な日本語の名詞述語として訳した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名が明記されているため、それを隠さず音写した。
- issue: שְׂכָרְךָ הַרְבֵּה מְאֹד の統語関係
  choice: 「あなたの報いは非常に大きい」という独立した約束
  alternative: 神ご自身が「あなたの非常に大きな報い」であるという読み
  rationale: マソラ本文のアクセントと語順は、「盾」と「報い」を二つの叙述として読むことを支持する。一方、動詞のない簡潔な構文には別の係り受けも可能なため、脚注で残した。
- issue: 約束の時間的ニュアンス
  choice: 「報いは非常に大きい」
  alternative: 「報いは非常に大きくなる」
  rationale: 原文には時制を明示する動詞がない。文脈上は将来的な約束として理解できるが、本文ではその時間性を補いすぎず、ヘブライ語の曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、「ヤハウェのことばが…に臨んだ」「恐れるな」など、聖書叙述にふさわしい簡潔で dignified な調子を保った。引用導入の לֵאמֹר は、日本語では直接引用への移行によって自然に示した。
