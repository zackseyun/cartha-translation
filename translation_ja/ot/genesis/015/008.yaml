source:
  edition: WLC
  text: וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהוִ֔ה בַּ/מָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/008.yaml
  text: And he said[a], “Lord Yahweh, how will I know that I will possess it?”
translation:
  language: ja
  text: そこで彼は言った。「主ヤハウェよ、私がそれを所有することを、何によって知ることができるでしょうか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私がそれを受け継ぐことを、どうして知ることができるでしょうか」。
    reason: ירשׁには「所有する」のほか「受け継ぐ」の意味がある。また、בַּמָּהは文脈上「どうして」「どのようなしるしによって」とも表せる。
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: そこで彼は言った
  rationale: 物語を進める連続形。前節を受ける自然な日本語として「そこで」を用い、発言主体を明示した。
- source_word: אֲדֹנָי יֱהוִה
  choice: 主ヤハウェよ
  rationale: אֲדֹנָיを「主」、神名יהוהを「ヤハウェ」とし、呼びかけの形を保った。
- source_word: בַּמָּה אֵדַע
  choice: 何によって分かるでしょうか
  rationale: בַּמָּהの字義的な「何によって」と、ידעの「知る・分かる」を組み合わせ、アブラムが確証となる手段を尋ねていることを表した。
- source_word: כִּי
  choice: …と
  rationale: 知る内容を導く補文標識として、現代日本語で自然な引用助詞「と」を用いた。
- source_word: אִירָשֶׁנָּה
  choice: 私がそれを所有することになる
  rationale: ירשׁは「所有する」「受け継ぐ」「取得する」の幅を持つ。約束された土地を実際に所有する意味を本文に採り、相続の含みは脚注に残した。接尾辞三人称女性単数は前節の「地」を指すため「それ」とした。
theological_decisions:
- issue: 複合呼称 אֲדֹנָי יֱהוִה における神名の表記
  choice: 主ヤハウェよ
  alternative: 主なる神よ／主なる方よ
  rationale: 原文が一般名詞ではなく神名יהוהを明記しているため、「ヤハウェ」と音写して両要素を区別した。
- issue: 土地を得ることを表す ירשׁ の契約的含意
  choice: 所有する
  alternative: 受け継ぐ
  rationale: 土地を現実に所有する意味を明瞭にしつつ、「受け継ぐ」という可能な訳を脚注に示し、語の契約・相続上の含みを排除しないようにした。
translation_notes:
  register: 明瞭で品位ある現代標準語。アブラムの問いを不信と断定せず、約束の実現を知る手段・確証を求める原文の問いとして保った。
