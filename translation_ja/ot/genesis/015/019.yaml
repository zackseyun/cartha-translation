lexical_decisions:
- source_word: אֶת
  choice: 訳出しない
  rationale: 直接目的語を示す標識であり、日本語では独立した語として訳さない。前後を含む文の中で、列挙された諸民族が目的語であることが示される。
- source_word: הַקֵּינִי
  choice: カイン人
  rationale: 定冠詞を伴う民族名の単数形だが、ここでは民族集団を集合的に指す。日本語では「カイン人」としてその集団を表す。
- source_word: וְאֶת
  choice: 読点
  rationale: 接続詞は列挙をつなぎ、目的語標識は訳出しない。日本語の自然な列挙として読点で表した。
- source_word: הַקְּנִזִּי
  choice: ケナズ人
  rationale: 領土に住む諸民族の一覧に現れる集合的な民族名として、固有名の音を保って訳した。
- source_word: וְאֵת
  choice: 読点
  rationale: 最後の項目を結ぶ接続詞であり、日本語では連続する列挙に合わせて読点で表した。目的語標識は訳出しない。
- source_word: הַקַּדְמֹנִי
  choice: カデモニ人[a]
  rationale: 語根は「東」「東方」と関係するが、この箇所では他の民族名と並ぶ民族名称として機能するため、固有名として音写した。
