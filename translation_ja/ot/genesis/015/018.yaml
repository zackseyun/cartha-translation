source:
  edition: WLC
  text: בַּ/יּ֣וֹם הַ/ה֗וּא כָּרַ֧ת יְהוָ֛ה אֶת אַבְרָ֖ם בְּרִ֣ית לֵ/אמֹ֑ר לְ/זַרְעֲ/ךָ֗ נָתַ֨תִּי֙ אֶת הָ/אָ֣רֶץ הַ/זֹּ֔את מִ/נְּהַ֣ר מִצְרַ֔יִם עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/018.yaml
  text: On that day Yahweh made a covenant with Abram[a], saying, “To your offspring I have given this land, from the river of Egypt as far as the great river[b], the Euphrates.”
translation:
  language: ja
  text: その日、ヤハウェはアブラムと契約を結び[a]、こう言われた。「あなたの子孫に、わたしはこの地を与えた。エジプトの川[b]から大河、ユーフラテス川まで。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「契約を切った」。周囲に描かれる契約締結の儀式を背景とする慣用表現と考えられる。
    reason: lexical_alternative
  - marker: b
    text: 別訳「エジプトの小川（ワディ）」。ヘブライ語は「エジプトの川」だが、どの水流を指すかについては議論がある。
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: その日
  rationale: 特定の時を指す自然な現代日本語として訳した。
- source_word: כָּרַת ... בְּרִית
  choice: 契約を結び
  rationale: ヘブライ語では直訳すると「契約を切る」という慣用句。日本語本文では意味が明瞭な「契約を結ぶ」とし、字義と周囲の儀式との関連を脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: לְזַרְעֲךָ
  choice: あなたの子孫に
  rationale: זֶרַעは集合的単数で、文脈上アブラムから出る後代の人々を指すため、自然で包括的な「子孫」とした。
- source_word: נָתַתִּי
  choice: わたしは…与えた
  rationale: 完了形の形態を保ち、契約上の付与を確定した事柄として宣言する表現をそのまま訳した。将来時制へ言い換えなかった。
- source_word: מִנְּהַר מִצְרַיִם
  choice: エジプトの川から
  rationale: נָהָרの通常の意味「川」を本文に採用した。地理的同定には議論があるため、別訳を脚注に示した。
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: あの大河、ユーフラテス川に至るまで
  rationale: 「大河」と「ユーフラテス川」の同格関係、およびעַדの境界を示す意味を自然な日本語で保持した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を称号に置換せず、一般的な学術的再構音に基づいて音写した。
- issue: 契約による土地付与 נָתַתִּי の時制・相
  choice: わたしはこの地を与えた
  alternative: わたしはこの地を与える／与えている
  rationale: ヘブライ語完了形を過去形で表し、神の宣言において付与が確定したものとして語られる緊張を保持した。将来の実現との関係を訳文で解消しない。
- issue: זֶרַע の集合性
  choice: 子孫
  alternative: 種、子
  rationale: 単数形の語が集合的に用いられていることを文脈に即して自然に表し、特定の単数者または複数者に限定する解釈を訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神の発話は荘重さを保ちつつ古語を避けた。「あの大河」は既知の著名な川を指す定冠詞の働きを自然に示し、直後の同格表現でユーフラテス川と明示した。
