  yaml_path: translation/ot/genesis/015/004.yaml
  text: And behold, the word of the LORD came to him, saying, “This man will not be your heir; rather, one who comes from your own body will be your heir.”
translation:
  language: ja
  text: すると、主の言葉が彼に臨んで、こう言われた。「この者があなたの跡を継ぐのではない。あなた自身の身から出る者が、あなたの跡を継ぐ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: すると見よ
  rationale: 物語の展開に注意を促す提示表現を保ちつつ、現代日本語として明瞭にした。
- source_word: דְבַר יְהוָה
  choice: 主の言葉
  rationale: 神名 יהוה は日本語聖書で広く通用する「主」で表し、定型句の簡潔さを保った。
- source_word: יִירָשְׁךָ
  choice: あなたの跡を継ぐ
  rationale: 文脈では財産だけでなくアブラムの後継者となることを指すため、「相続する」より自然で包括的な表現を選んだ。
- source_word: אֲשֶׁר יֵצֵא מִמֵּעֶיךָ
  choice: あなた自身の身から出る者
  rationale: מֵעִים の身体的・血縁的な意味を保ちつつ、直訳的な「内臓」や限定的な「胎」ではなく自然な日本語にした。
- source_word: זֶה
  choice: この者
  rationale: 直前の文脈で言及されたダマスコのエリエゼルを指す指示語であり、原文の簡潔さを維持した。
theological_decisions:
- issue: 約束される後継者の血縁性
  choice: 「あなた自身の身から出る者」
  alternative: 「あなたの実の子」
  rationale: 血縁上の子を指すことは明らかだが、原文は「子」という語を用いていないため、後代の理解を先取りせず身体的由来をそのまま表した。
- issue: 神名 יהוה の表記
  choice: 「主」
  alternative: 「ヤハウェ」
  rationale: 日本語の一般読者に自然で尊厳ある慣用表記を採用し、特定の発音再建に本文を固定しなかった。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神の発話は簡潔で断定的にし、原文の対比「この者ではなく、あなた自身の身から出る者」を明確に保った。
