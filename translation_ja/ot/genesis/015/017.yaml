  to: 太陽が沈んで暗くなったとき、見よ、煙を上げる炉[a]と燃えるたいまつが、切り分けられたもの[b]の間を通った。
  rationale: 原文の空間的表現 בֵּין（「…の間を」）と動詞 עָבַר（「通る」）を正確に反映するため、「通り過ぎた」を「通った」に改めた。その他の本文と脚注は、原文への忠実さ、自然な現代日本語、語義上の留保、および神学的含意を本文に過度に持ち込まない方針を保っている。
