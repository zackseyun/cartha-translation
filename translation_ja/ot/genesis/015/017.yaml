  source_fidelity: 全体としてヘブライ語本文の情景と語順上の展開をよく伝えている。「太陽が沈んで暗くなったとき」「見よ」「煙を上げる炉」「燃えるたいまつ」「切り分けられたもの」は、原文と英語監査訳のいずれにも概ね忠実である。ただし、עָבַר בֵּין（「…の間を通る」）に対する「通り過ぎた」は、対象のそばを過ぎ去る意味にもなり得るため、「間を通った」とする必要がある。
  naturalness: 文体は明瞭な現代標準日本語であり、「見よ」もこの荘厳な叙述では自然に機能している。「たいまつ」はひらがなより漢字交じりの「松明」のほうが一般的な表記ではあるが、現行表記も読みやすく誤りではない。安全かつ必要な修正は動詞のみである。
  terminology: 「炉」はתַנּוּרの有力な訳であり、脚注が「窯」および火を入れる容器という語義の幅を適切に示す。「切り分けられたもの」は本文ではやや一般的だが、15章10節への脚注によって動物の分割された部分を指すことが明示されている。火の像を本文で神ご自身と断定しない方針も、節そのものの記述を越えない。
