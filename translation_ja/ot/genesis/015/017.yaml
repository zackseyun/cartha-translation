  text: וַ/יְהִ֤י הַ/שֶּׁ֨מֶשׁ֙ בָּ֔אָה וַ/עֲלָטָ֖ה הָיָ֑ה וְ/הִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְ/לַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַ/גְּזָרִ֥ים הָ/אֵֽלֶּה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/017.yaml
  text: And when the sun had gone down and it was dark[a], behold[b], a smoking firepot and a flaming torch passed between these pieces.
translation:
  language: ja
  text: 太陽が沈んで暗くなったとき、見よ、煙を上げる炉[a]と燃えるたいまつが、切り分けられたもの[b]の間を通った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「炉」は、パンなどを焼く「窯」、または火を入れる容器とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 前に二つに切り分けて並べられた動物の部分を指す（創世記15章10節参照）。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ בָּאָה
  choice: 太陽が沈んで……とき
  rationale: 太陽を主語とするבואは日没を表す慣用表現。וַיְהִיと後続節が作る時間的な移行を、現代日本語で自然な従属節として表した。
- source_word: וַעֲלָטָה הָיָה
  choice: 暗くなった
  rationale: עֲלָטָהは暗闇・薄暗さを指す。文脈上の日没後の状態を明瞭に示しつつ、「深い暗闇」など原文以上の強調は加えない。
- source_word: וְהִנֵּה
  choice: 見よ
  rationale: 目の前に現れた光景へ注意を向けさせる提示表現。口語的な「ほら」よりも、この場面の厳粛で幻視的な調子を保つ。
- source_word: תַנּוּר עָשָׁן
  choice: 煙を上げる炉
  rationale: תַנּוּרはパン焼き窯などの炉・火を入れる容器を表す。形状を過度に限定せず、עָשָׁןによる煙の像を自然な日本語で示した。
- source_word: לַפִּיד אֵשׁ
  choice: 燃えるたいまつ
  rationale: לַפִּידはたいまつを指し、אֵשׁがその火炎を強調する。「火のたいまつ」という逐語的表現を避け、像を明瞭にした。
- source_word: אֲשֶׁר עָבַר
  choice: 通り過ぎた
  rationale: 関係節を日本語の主たる叙述として自然に組み替えた。単数形の動詞は、二つの火の像を一まとまりの現象として提示する原文と両立する。
- source_word: בֵּין הַגְּזָרִים הָאֵלֶּה
  choice: 切り分けられたものの間
  rationale: גְּזָרִיםは前段で二つに裂かれた動物の部分を指す。「もの」として本文を簡潔にし、具体的な指示対象は脚注で明示した。
theological_decisions:
- issue: 契約締結の場面に現れる火の像の性質
  choice: 炉とたいまつを、節が描く目に見える像として記述し、それらを本文中で明示的に神と同定しない。
  alternative: 煙を上げる炉と燃えるたいまつを、主の臨在または顕現として訳文中で説明する。
  rationale: 文脈は神的な契約の顕現を強く示唆するが、この節自体は目に見える二つの像だけを名指している。解釈を本文へ織り込まず、神学的な含みと緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「見よ」によって原文の厳粛で鮮烈な提示を保持した。「炉」と「たいまつ」は説明的に神格化せず、視覚的な描写として訳した。
