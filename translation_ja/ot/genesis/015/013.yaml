revisions:
- from: 主はアブラムに言った。「よく知っておきなさい。あなたの子孫は、自分たちのものではない国で寄留者[a]となり、その国の人々に仕え、苦しめられる[b]。その期間は四百年である[c]。」
  to: 主はアブラムに言った。「あなたの子孫が、自分たちのものではない土地で寄留者[a]となり、そこの人々に仕え、その人々に苦しめられることを、あなたはよく知っておきなさい。四百年にわたってである[b]。」
  rationale: 本文は、Qalの「仕える」を保持しつつ、日本語で必要となる指示対象を「そこの人々／その人々」と補った。期間句は直前の予告に接続した。脚注は実際のヘブライ語の圧縮された代名詞関係と「仕える」の語義を説明し、使役的な訳を語法上同等の選択肢として扱わないよう改めた。
