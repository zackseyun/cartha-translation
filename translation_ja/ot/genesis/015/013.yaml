source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/אַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי גֵ֣ר יִהְיֶ֣ה זַרְעֲ/ךָ֗ בְּ/אֶ֨רֶץ֙ לֹ֣א לָ/הֶ֔ם וַ/עֲבָד֖וּ/ם וְ/עִנּ֣וּ אֹתָ֑/ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/013.yaml
  text: Then he said to Abram[a], “Know for certain that your offspring will be sojourners in a land not theirs[c][b], and they will enslave them and afflict them four hundred years.”
translation:
  language: ja
  text: 主はアブラムに言った。「あなたの子孫が、自分たちのものではない土地で寄留者[a]となり、そこの人々に仕え、その人々に苦しめられることを、あなたはよく知っておきなさい。四百年にわたってである[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「在留異国人」「よそ者」とも訳せる。ヘブライ語は、自己の民の土地ではない場所に非土着者として住む人を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼らは彼らに仕え、彼らは彼らを苦しめる、四百年」。最初の「彼ら」はアブラムの子孫、次の「彼ら」はその土地の人々と理解される。最初の動詞は「仕える」を意味し、文脈上、強制された奉仕を含み得る。
    reason: source_ambiguity
lexical_decisions:
- source_word: יָדֹעַ תֵּדַע
  choice: よく知っておきなさい
  rationale: 不定詞絶対形と未完了形の重ねによる強調を、命令と確実性の双方が伝わる自然な現代日本語で表した。
- source_word: גֵר
  choice: 寄留者
  rationale: 自分の所有地ではない土地に、非土着民として住む者を指す。聖書的な品位を保ちつつ、単なる旅行者や現代の法的な「外国人」に限定しない語を選んだ。
- source_word: זַרְעֲךָ
  choice: あなたの子孫
  rationale: 集合的単数の זֶרַע を、日本語で自然に一族の後代を指す「子孫」とした。
- source_word: בְּאֶרֶץ לֹא לָהֶם
  choice: 自分たちのものではない国で
  rationale: 土地の非所有と異郷性を簡潔に表す。「地」も可能だが、住民と支配領域を含む文脈では「国」が分かりやすい。
- source_word: וַעֲבָדוּם
  choice: その国の人々に仕え
  rationale: 形態上は「彼らが彼らに仕える」。集合名詞「子孫」を複数として受け、その地の人々に仕えるという読みを本文に採った。奴隷状態は文脈に含まれ得るが、Qal の עבד を直ちに「奴隷にする」と使役的に限定しなかった。
- source_word: וְעִנּוּ אֹתָם
  choice: 苦しめられる
  rationale: 直訳では「彼らが彼らを苦しめる」だが、ここではその地の人々が子孫を苦しめるという主語交替を、日本語で明瞭な受け身にした。「虐げられる」より広く、苦役を含む苛酷な扱いを表せる。
- source_word: אַרְבַּע מֵאוֹת שָׁנָה
  choice: その期間は四百年である
  rationale: 前置詞なしで末尾に置かれた期間表現を、先行する異郷滞在・奉仕・苦難に関わる期間として自然に表しつつ、どの要素だけに掛かるかを過度に限定しない形にした。
- source_word: וַיֹּאמֶר לְאַבְרָם
  choice: 主はアブラムに言った
  rationale: 継続する語りの中の代名詞主語は前文脈の主を指すため、日本語で参照先を明示した。発話動詞は現代標準語の簡潔な形とした。
theological_decisions:
- issue: וַעֲבָדוּם と וְעִנּוּ אֹתָם における複数主語・目的語の指示対象
  choice: 子孫がその地の人々に仕え、その地の人々によって苦しめられる
  alternative: その地の人々が子孫を奴隷として働かせ、苦しめる／不特定の者たちが子孫を苦しめる
  rationale: 最初の動詞は通常の Qal で「彼らに仕える」と読め、次の動詞では文脈上、異郷の住民が子孫を苦しめると理解できる。ただしヘブライ語は両節とも「彼ら」という形で主語を明示せず、指示関係に圧縮と曖昧さがあるため脚注で示した。
- issue: 四百年が修飾する範囲
  choice: 異郷での寄留・奉仕・苦難をまとめた期間として訳す
  alternative: 苦役と圧迫だけが四百年間続くと限定する
  rationale: 期間句は節末にあり、直前の圧迫に強く結び付く一方、予告全体の期間とも取り得る。本文では「その期間」とし、脚注で統語上の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用い、「寄留者」「子孫」など必要な聖書語彙は保持した。神の発話として品位を保ちながら、過度な文語体や敬語は避けた。代名詞が重なるヘブライ語の曖昧さは、本文の可読性を損なわない範囲で整理し、重要な別解を脚注に残した。
