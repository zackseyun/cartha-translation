review_pass:
  verdict: revise
  source_fidelity: 本文の「その国の人々に仕え、苦しめられる」は、MTのוַעֲבָדוּם（Qal「彼らに仕える」）と、それに続く圧迫をおおむね適切に表している。ただし、期間句を「その期間」として独立させると、ヘブライ語末尾の「四百年」が直前の奉仕・苦難の叙述に係る構文上のつながりが弱まる。また脚注bの「働かせる」は、本文のQal形から直接導かれる訳ではない。英語監査の“enslave”は解釈的な英訳であり、母音付きMTのQal עבד に対して日本語本文へ強制すべきではない。
  naturalness: 明瞭な現代標準日本語であり、必要な聖書語彙も過度に古風ではない。「その国の人々」を補って主語・目的語の混同を避ける方針は日本語として有効である。期間を「四百年にわたって」と接続すれば、より自然で原文にも近い。
  terminology: 「寄留者」「子孫」は適切。「国」より「土地」はאֶרֶץおよび「自分たちのものではない」との対応を保ち、領域国家という含意を避けられる。「仕える」はQal עבדに忠実であり、奴隷的な強制労働の含意は脚注で説明できる。
  issues:
  - severity: medium
    issue: 脚注bがQalのוַעֲבָדוּםに対して「その国の人々が彼らを働かせ」とする読みを同列の代替として提示している。
    rationale: マソラ本文の動詞はQalで、自然な構文は「（子孫が）彼らに仕える」である。「奴隷として働かせる」は使役形としては表されておらず、文脈的説明としては可能でも、語法上の代替訳として提示すると誤解を招く。
  - severity: low
    issue: 脚注aの「自分の所有地ではない土地」はגֵרの説明として所有地に限定気味である。
    rationale: 語は本来的に非土着者・よそ者として居住する者を指し、個人の土地所有の有無だけを定義する語ではない。
  - severity: low
    issue: 「その期間は四百年である」は原文の末尾の期間句との構文的連結を弱める。
    rationale: 四百年は直前の奉仕と圧迫、少なくともその予告された状態に関わる期間として置かれているため、「四百年にわたって」とする方が明確である。
