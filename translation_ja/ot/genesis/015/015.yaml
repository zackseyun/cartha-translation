base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/015.yaml
  text: As for you[a], you will go to your fathers in peace; you will be buried at a good old age.
translation:
  language: ja
  text: あなたは、安らかに先祖のもとへ行き[a]、幸いな長寿を全うして葬られる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたの父たちのもとへ行く」。死と先行する世代に加わることを表す慣用句であり、死後の状態を詳しく述べるものではない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: あなたは
  rationale: 独立代名詞による話題転換と強調を自然な日本語の主題提示で表した。直前の子孫についての預言からアブラム本人へ焦点が移る。
- source_word: תָּבוֹא אֶל־אֲבֹתֶיךָ
  choice: 先祖たちのもとへ行き
  rationale: 直訳的な「父たち」では現代日本語で実父らを指すと誤解されやすいため、世代をさかのぼる親族を表す「先祖たち」とした。「もとへ行く」によって、死を表す原文の婉曲的な家族表現を保った。
- source_word: בְּשָׁלוֹם
  choice: 安らかに
  rationale: 死に至る際の平安、無事、穏やかさを含む שָׁלוֹם を、この文脈で自然な副詞表現にした。
- source_word: תִּקָּבֵר
  choice: 葬られる
  rationale: קבר のニファル形が示す受動の埋葬を、現代日本語で自然かつ dignified な語で表した。
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: 幸せな老年を迎えて
  rationale: שֵׂיבָה は白髪で象徴される老齢、טוֹבָה はその望ましい充実を示す。「幸せな老年」は長寿だけでなく肯定的な含みも伝え、「迎えて」により埋葬時の年齢・状態を自然に結んだ。
theological_decisions:
- issue: 「先祖たちのもとへ行く」の意味
  choice: アブラムの死と、それ以前の世代に連なることを表す婉曲表現として保持する。
  alternative: 先祖と同じ墓に葬られること、または死後に先祖たちと意識的に交わることを明示する。
  rationale: アブラムは直系の父祖と同じ場所に埋葬されるわけではないため、物理的な合葬だけには限定できない。一方、本文は死後の状態を詳述していないので、特定の死後観を訳文に加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「父たち」の逐語訳は日本語では意味が狭く不自然になりやすいため「先祖たち」とした。原文の二つの動詞を保ちつつ、日本語として滑らかになるよう連用形で接続した。
