id: GEN.15.3
reference: Genesis 15:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔/י לֹ֥א נָתַ֖תָּה זָ֑רַע וְ/הִנֵּ֥ה בֶן בֵּיתִ֖/י יוֹרֵ֥שׁ אֹתִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/003.yaml
  text: Then Abram said[a], “Behold, you have given me no offspring, and behold[b], a son of my household will inherit me.”
translation:
  language: ja
  text: そこでアブラムは言った。「ご覧ください。あなたは私に子孫を授けてくださいませんでした。見てください、私の家の者[a]が私の相続人となるのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私の家の息子が私を相続する」。「私の家の息子」は家に属する者を指す慣用表現であり、この節だけではその者の社会的身分を特定しない。「私を相続する」は、文脈上「私の相続人となる」の意味である。
    reason: בֶן־בֵּיתִי の慣用表現と、יוֹרֵשׁ אֹתִי の人を目的語とする異例の表現を示し、本文が身分や相続対象を過度に限定しないようにするため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ継続法を、直前の発言を受ける自然な日本語の接続で表した。
- source_word: הֵן
  choice: ご覧ください
  rationale: 神に注意を促す強意の語。話しかける相手への敬意と嘆願調を保つため、現代日本語として自然な敬語表現にした。
- source_word: לֹא נָתַתָּה זָרַע
  choice: 子孫を授けてくださいませんでした
  rationale: זֶרַע は字義的には「種」だが、ここでは子や後裔を指す集合的表現。「子孫」は後続する相続問題とのつながりも保つ。נתן は神から与えられる子について「授ける」とした。
- source_word: בֶן בֵּיתִי
  choice: 私の家の者
  rationale: 字義的には「私の家の息子」。本文が明示しない奴隷などの身分を補わず、家に属する人物という慣用的意味を自然な日本語で表した。
- source_word: יוֹרֵשׁ אֹתִי
  choice: 私の跡を継ぐことになります
  rationale: 字義的には「私を相続する」。日本語で人そのものを相続するとの誤解を避けつつ、財産だけでなく家系・地位を継ぐ含みを残す表現とした。分詞の目前の成り行き・見込みも「ことになります」で表した。
theological_decisions:
- issue: 「私の家の息子」の社会的身分
  choice: 「私の家の者」とし、身分を特定しない
  alternative: 「家で生まれた奴隷」「召使い」
  rationale: この節自体には奴隷を表す語がなく、בֶן בֵּיתִי だけから特定の法的身分を訳文に持ち込むべきではない。
- issue: 「私を相続する」の対象
  choice: 「私の跡を継ぐ」と訳し、財産・家系・地位を含み得る表現にする
  alternative: 「私の財産を相続する」「私の相続人になる」
  rationale: אֹתִי の「私」という異例の目的語が持つ広がりを、財産だけに限定せず保った。「相続人になる」は意味を明確にするが、原文の動詞構文を名詞化するため本文では避けた。
translation_notes:
  register: 明瞭な現代標準日本語。神に対するアブラムの発話には丁寧語を用い、古語的な「見よ」は避けた。嘆きと切迫感は保ちながら、本文が明示しない社会的身分や相続対象を限定していない。
