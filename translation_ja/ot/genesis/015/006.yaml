base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/006.yaml
  text: And he believed Yahweh[c][b][a], and he counted it to him as righteousness.
translation:
  language: ja
  text: アブラムは主を信じた[a]。主はそれを彼の義として数えた[b][c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「主に信頼した」。
    reason: lexical_alternative
  - marker: b
    text: 「義として数えた」は、「義とみなした」「義と認めた」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語の構文は通常、主がアブラムの信じたことを彼の義として数えた、という意味に理解される。可能性は低いが、アブラムを「数えた」の主語とする読みもある。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֶאֱמִן
  choice: 信じた
  rationale: אמן のヒフィル形は、ここでは相手を確かな方として信頼することを表す。「信じた」は簡潔で自然であり、後の聖書本文との語のつながりも保つ。「信頼した」も可能なので脚注に示した。
- source_word: בַּיהוָה
  choice: 主を
  rationale: 前置詞 ב は信頼・信仰の向かう相手を示す。日本語では「主を信じた」が最も自然である。神名 יהוה は本文で「主」とした。
- source_word: וַיַּחְשְׁבֶהָ
  choice: それを……義と認めた
  rationale: חשב は、あるものをそのようなものとして数える、みなす、認定する意。「認めた」は現代日本語として自然で、会計的な含みを過度に専門化せず伝える。女性単数接尾辞は、アブラムが信じたという応答を指すものとして「それ」とした。
- source_word: לּוֹ
  choice: 彼の
  rationale: לְ と代名詞接尾辞は、義と認められる当人を示す。日本語では「彼の義と認めた」とすることで、彼に帰属するものとして数えられたという意味を自然に表した。
- source_word: צְדָקָה
  choice: 義
  rationale: ここでは正義の執行よりも、神の前で義とされることを表す。「義」は簡潔で、本文の契約的・神学的な含みと後代の引用とのつながりを保つ。
theological_decisions:
- issue: 「認めた」の主語
  choice: 主を主語とし、主がアブラムの信じたことを義と認めたと訳した。
  alternative: アブラムを主語とし、アブラムが主または何かを義とみなしたと取る読み。
  rationale: ヘブライ語では動詞の主語が明示されていないが、文脈上は直前の「主」を主語とするのが最も自然で、後の聖書における引用とも一致する。ただし、文法上論じられる別の読みを脚注に残した。
- issue: 女性単数接尾辞 הָ の指示対象
  choice: アブラムが信じたという行為・応答を指すものとして「それ」とした。
  alternative: アブラムの信頼・応答全体を指すと明示する、または「このこと」と訳す。
  rationale: 直前に明示的な女性名詞はないが、ヘブライ語では抽象的な行為や出来事を女性単数接尾辞で受けることがある。「信仰」などの名詞を補わず「それ」とすることで、原文の簡潔さと解釈上の幅を保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。文脈上の人物を明確にするため「彼」を「アブラム」とし、後半の省略主語も「主」と明示した。神学用語 צְדָקָה は一般読者にも定着している「義」を用い、原文にない説明的な「信仰」や「義なる者として扱った」は本文へ補わなかった。
