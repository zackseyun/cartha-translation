base_translation:
  language: en
  yaml_path: translation/ot/genesis/015/012.yaml
  text: As the sun was going down[a], a deep sleep fell upon Abram. And behold[b], a great dark dread fell upon him.
translation:
  language: ja
  text: 日が沈みかけたころ、深い眠り[a]がアブラムを襲った。すると見よ、大きな暗闇の恐怖[b]が彼を襲った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「トランス状態」とも訳せる。このヘブライ語は、普通ではないほど深い眠り、時には神によってもたらされた眠りを指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「大きな、暗い恐怖」。また「大きな暗闇への恐怖」とも理解できる。ヘブライ語は恐怖と闇を鮮烈な短い表現の中に重ねている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הַשֶּׁמֶשׁ לָבוֹא
  choice: 日が沈みかけたころ
  rationale: 太陽が「入る」途上にあるという日没への進行を、自然な現代日本語で表した。וַיְהִי の場面転換は時間節全体に含め、古風な定型句は加えない。
- source_word: תַרְדֵּמָה
  choice: 深い眠り
  rationale: 通常の眠りより深い、場合によっては神によってもたらされた眠りを指し得る。本文では語義に最も直接的な「深い眠り」とし、「恍惚状態」と断定しない。
- source_word: נָפְלָה עַל אַבְרָם
  choice: アブラムを襲った
  rationale: 直訳的な「上に落ちた」よりも、眠りが人に突然及ぶヘブライ語の比喩を自然かつ力強く伝える。
- source_word: וְהִנֵּה
  choice: すると、見よ
  rationale: 場面を鮮明に提示して注意を促す הִנֵּה の劇的な働きを保つ。「すると」で物語の進行も自然に示した。
- source_word: אֵימָה חֲשֵׁכָה גְדֹלָה
  choice: 深い闇のような大きな恐怖
  rationale: 「恐怖」「闇」「大きい」という圧縮された表現を、闇が恐怖の性質を描くものとして読める日本語にした。ただし「闇への恐怖」という別解釈は脚注に残した。
- source_word: נֹפֶלֶת עָלָיו
  choice: 彼を襲った
  rationale: 分詞の生々しい進行感は文脈上の突然性によって補い、日本語では完結した出来事として自然な過去形にした。
theological_decisions:
- issue: 幻の啓示という文脈における תַרְדֵּמָה の性質
  choice: 深い眠り
  alternative: 恍惚状態
  rationale: 文脈は幻と契約に関係するが、語そのものはまず深い眠りを表す。「恍惚状態」は解釈を強めるため、本文では断定せず脚注に示した。
- issue: אֵימָה חֲשֵׁכָה の統語的関係
  choice: 深い闇のような大きな恐怖
  alternative: 闇への大きな恐怖／大きな暗い恐怖
  rationale: ヘブライ語は恐怖と闇を簡潔に並べ、その関係を明示しない。本文では闇が恐怖の性質を描く読みを採りつつ、別の構文理解を脚注に残した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、「見よ」によって原文の荘重で劇的な調子を保った。二度の נפל על はともに「襲った」として反復を残した。脚注記号は、それぞれ説明対象である「深い眠り」と「恐怖」の直後に置いた。
