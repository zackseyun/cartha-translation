source:
  edition: WLC
  text: הִנֵּֽה רִבְקָ֥ה לְ/פָנֶ֖י/ךָ קַ֣ח וָ/לֵ֑ךְ וּ/תְהִ֤י אִשָּׁה֙ לְ/בֶן אֲדֹנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/051.yaml
  text: Look[a], Rebekah is before you. Take her and go, and let her be the wife of your master's son, just as Yahweh has spoken.
translation:
  language: ja
  text: 「見なさい、リベカはあなたの前にいます。彼女を連れて行き、ヤハウェが語られたとおりに、彼女があなたの主人の息子の妻となるようにしなさい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼女があなたの主人の息子の妻となるように」。この動詞形は、彼女が妻となることへの指示・許可・願いを表し得ます。
    reason: 三人称女性単数の願望・指示形（וּתְהִי）がもつニュアンスと、日本語本文の「…となるようにしなさい」との関係を示すため。
lexical_decisions:
- source_word: הִנֵּה
  choice: 見なさい
  rationale: 目前の状況へ注意を促す指示詞。古風な「見よ」より現代的でありながら、発話の力を保つ。
- source_word: רִבְקָה
  choice: リベカ
  rationale: ヘブライ語の人名に対する、日本語聖書で広く定着した表記。
- source_word: לְפָנֶיךָ
  choice: あなたの前にいます
  rationale: 字義的な空間表現を保ちつつ、リベカが相手に委ねられる状態にあるという文脈も自然に伝える。
- source_word: קַח וָלֵךְ
  choice: 彼女を連れて行き
  rationale: 二つの命令を日本語として自然に結合した。目的語「彼女」は文脈上明白で、日本語では補うことで意味が明瞭になる。
- source_word: וּתְהִי אִשָּׁה
  choice: 妻としなさい
  rationale: 三人称女性単数の指示・許可を表す形を、この場面で相手に与えられる承諾として自然な日本語の命令表現にした。「妻になるように」とする余地は注記する。
- source_word: לְבֶן אֲדֹנֶיךָ
  choice: 主君の息子の
  rationale: 僕と主人の関係における אֲדֹנֶיךָ を「主君」とし、婚姻関係を「主君の息子の妻」と表した。
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: 語られたとおりに
  rationale: 一致・適合を示す כַּאֲשֶׁר と、完了した神の発言を表す דִּבֶּר を簡潔に反映する。神への敬意を示すため尊敬語を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、四文字神名を日本語で音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有の神名を直接用いているため、称号「主」に代えず音写する。
- issue: וּתְהִי の指示・許可のニュアンス
  choice: 妻としなさい
  alternative: 妻となるように／妻になりなさい
  rationale: 家族が婚姻を承諾して使者に告げる文脈に即して自然に表現したが、文法形が持つ「彼女が妻となるように」というニュアンスも注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、会話としての直接性と品位を両立させた。「見よ」のような文語は避けつつ、原文の注意喚起と簡潔な命令の連続を保った。
