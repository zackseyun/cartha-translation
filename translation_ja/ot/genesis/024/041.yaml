  text: אָ֤ז תִּנָּקֶה֙ מֵ/אָ֣לָתִ֔/י כִּ֥י תָב֖וֹא אֶל מִשְׁפַּחְתִּ֑/י וְ/אִם לֹ֤א יִתְּנוּ֙ לָ֔/ךְ וְ/הָיִ֥יתָ נָקִ֖י מֵ/אָלָתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/041.yaml
  text: Then you will be free from my oath when you come to my family; and if they do not give to you[a], you will be free from my oath.
translation:
  language: ja
  text: そうすれば、あなたが私の一族のもとに行ったなら、私があなたに負わせた誓い[a]から解かれる。もし彼らがあなたに娘を与えないなら、あなたは私があなたに負わせた誓いから解かれる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私があなたに負わせた呪い」。ヘブライ語のこの語は、違反した場合の呪いや制裁を伴う誓いを指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּנָּקֶה / נָקִי
  choice: 解かれる
  rationale: ここでは道徳的に無罪となることではなく、誓いによる義務や責任を免除されることを表す。二つの同根語を同じ表現で訳した。
- source_word: מֵאָלָתִי
  choice: 私に立てた誓いから
  rationale: אָלָה は制裁や呪いを伴う誓いを指し得るが、文脈の中心はアブラハムが僕に負わせた誓約上の義務である。日本語では関係を明確にするため「私に立てた誓い」とした。
- source_word: כִּי
  choice: 行けば
  rationale: ここでは僕が一族のもとへ赴くという時・条件を示す。日本語では文脈に自然な条件表現とした。
- source_word: תָבֹא אֶל מִשְׁפַּחְתִּי
  choice: 私の一族のもとに行く
  rationale: מִשְׁפָּחָה は核家族より広い親族集団を指すため「一族」とした。話者から離れた地へ赴く場面なので、בוא は自然な日本語の「行く」で表した。
- source_word: וְאִם לֹא יִתְּנוּ לָךְ
  choice: もし彼らがあなたに娘を与えないなら
  rationale: ヘブライ語では目的語が省略されているが、文脈上は結婚相手となる娘を指す。日本語で意味が明確になるよう「娘を」を補った。
theological_decisions:
- issue: 誓いの文脈における אָלָה の訳
  choice: 誓い
  alternative: 呪い／誓いに伴う呪い
  rationale: 語には違反時の呪いや制裁という含みがあるが、この箇所では僕が負う誓約上の義務から解放されることが中心である。別の語義は脚注に残した。
translation_notes:
  register: 明快で格調のある現代標準日本語。「一族」により親族集団の広がりを示し、「解かれる」により法的・誓約的な免責を自然に表現した。原文で省略される目的語は文脈に即して「娘を」と補った。
