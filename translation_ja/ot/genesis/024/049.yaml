base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/049.yaml
  text: Now if you are going to show kindness and faithfulness to my master[a], tell me; but if not, tell me, so that I may turn to the right or to the left.
translation:
  language: ja
  text: 今、もしあなたがたが私の主人に慈しみと誠実を示すおつもりなら[a]、私にそう言ってください。そうでないなら、それも言ってください。そうすれば私は、右か左へ向かいます。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「変わらぬ愛と誠実を示すおつもりなら」。この二つのヘブライ語の組み合わせは、関係における忠実で信頼に値する慈しみを表すことが多い。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: 今
  rationale: 僕の話を直ちに実際の決断へと進める談話標識として、簡潔で自然な「今」とした。
- source_word: אִם יֶשְׁכֶם עֹשִׂים
  choice: もしあなたがたが…示すおつもりなら
  rationale: 「あなたがたに…することがあるなら」という存在表現と分詞の組み合わせが示す、目前の行動への意向を自然な日本語で表した。
- source_word: חֶסֶד וֶאֱמֶת
  choice: 慈しみと誠実
  rationale: חֶסֶד の好意と忠実な愛、אֱמֶת の確かさ・信頼性という二要素を保ち、関係に根差した信頼できる行為を表す語の組として訳した。
- source_word: אֶת אֲדֹנִי
  choice: 私の主人に
  rationale: 慈しみと誠実が向けられる相手を、現代日本語で自然な助詞「に」によって示した。
- source_word: הַגִּידוּ לִי
  choice: 私にそう言ってください
  rationale: 返答を求める命令を明確にしつつ、僕が相手方の家族に語る場面に適した丁寧さを持たせた。二度目は「それも」として否定の返答も明示した。
- source_word: וְאִם לֹא
  choice: そうでないなら
  rationale: 肯定か否定かという対照を、簡潔で自然な条件表現にした。
- source_word: וְאֶפְנֶה
  choice: そうすれば私は…向かいます
  rationale: コホータティブが表す、相手の返答を受けた話者の意向・次の行動を、結果関係とともに示した。
- source_word: עַל יָמִין אוֹ עַל שְׂמֹאל
  choice: 右か左へ
  rationale: 別の進路を取ることを示す比喩的な方向表現だが、原文の具体的な像をそのまま保っても日本語で理解できるため直訳した。
