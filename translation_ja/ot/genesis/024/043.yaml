    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: ご覧ください
  rationale: 場面を目前に示す指示的な語。現代日本語で明瞭さと語りの臨場感を保つ表現とした。
- source_word: נִצָּב עַל עֵין הַמָּיִם
  choice: 今、泉のそばに立っています
  rationale: 分詞の継続的な状態を「立っています」で表し、עֵיןを井戸ではなく自然の水源である「泉」と訳した。「今」は発話時の状況を自然に示す。
- source_word: וְהָיָה
  choice: …と言ったなら、
  rationale: 次節まで続く、求めるしるしを示す条件的構文として表現した。節末の未完結性も保持している。
- source_word: הָעַלְמָה
  choice: 若い女性
  rationale: 結婚年齢の若い女性を指す語であり、それ自体では処女性を明示しないため、意味を過度に限定しない訳語を選んだ。
- source_word: הַיֹּצֵאת לִשְׁאֹב
  choice: 水をくみに出て来る
  rationale: 目的を示す不定詞と分詞を自然な日本語の連体節にした。目的語の水は文脈上明白だが、日本語では補う方が自然である。
- source_word: הַשְׁקִינִי נָא מְעַט מַיִם מִכַּדֵּךְ
  choice: どうか、あなたの水がめから水を少し飲ませてください
  rationale: 使役形の「飲ませる」と丁寧な依頼の「どうか…ください」により、動詞と丁寧の小辞נָאを直接かつ自然に表した。
theological_decisions:
- issue: עַלְמָהの意味範囲
  choice: 若い女性
  alternative: 乙女／処女
  rationale: このヘブライ語は若い女性を指すが、語そのものは処女性を必須の意味としない。後代の神学的論争を本文へ持ち込まず、語彙上の幅は脚注に示した。
translation_notes:
  register: 明瞭で現代的ながら、祈りを語り直す場面にふさわしい丁寧で品位ある文体とした。文末の読点は、条件文が次節へ続くことを示す。
