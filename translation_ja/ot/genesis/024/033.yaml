  text: Food was set before him to eat[a], but he said, “I will not eat until I have spoken my words.” And he said, “Speak.”
translation:
  language: ja
  text: 食べ物が彼の前に、食べるために出されたが、彼は言った。「私の話をする[a]までは、食べません。」すると、相手は「話してください」と言った。
  philosophy: optimal-equivalence
  footnotes:
