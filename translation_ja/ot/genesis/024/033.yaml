    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם לְפָנָיו לֶאֱכֹל
  choice: 食事が彼の前に出された
  rationale: 動詞の主語は明示されず、文脈上は食べ物が置かれたことが中心なので、日本語では自然な受け身とした。לֶאֱכֹל の目的は「食事」に含意される。
- source_word: לֹא אֹכַל
  choice: 食べません
  rationale: 話し終えるまで食べないという、丁寧だが明確な意志を表す。
- source_word: עַד אִם דִּבַּרְתִּי דְּבָרָי
  choice: 用件をお話しするまでは
  rationale: 直訳は「私の言葉を語るまで」だが、この文脈の דְּבָרָי は伝えるべき話・用向きを指す。「用件」は自然な現代日本語であり、使者の意図を過度に具体化しない。直訳的表現は脚注に示す。
- source_word: דַּבֵּר
  choice: 話してください
  rationale: 命令形を、客と家の側との会話にふさわしい自然な丁寧表現で訳した。
