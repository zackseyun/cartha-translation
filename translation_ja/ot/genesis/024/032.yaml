base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/032.yaml
  text: So the man came into the house and unloaded the camels and gave straw and feed to the camels[b][a], and water to wash his feet and the feet of the men who were with him.
translation:
  language: ja
  text: その人が家に入ると、らくだの荷が解かれ[a]、らくだにはわらと飼料が与えられた。また、彼の足と、彼と同行していた人々の足を洗うための水も与えられた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「らくだを開き」。到着後に、らくだの荷や装具を外す、または緩めることを指す表現と考えられる。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語はここで「彼はらくだを解き、彼は与えた」という能動の三人称男性単数を用いるが、その人物をラバンと名指ししてはいない。直前の「その人」を指すと読むことも、文脈からラバンを指すと読むこともできる。本文ではこの不確定さを保つため、動作主を明示していない。
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיָּבֹא הָאִישׁ הַבַּיְתָה
  choice: その人は家に入った
  rationale: בואと方向を示すהを、「家に入った」と自然かつ簡潔に表した。הָאִישׁは役割名を補わず、原文どおり「その人」とした。
- source_word: וַיְפַתַּח הַגְּמַלִּים
  choice: らくだの荷を解き
  rationale: פתחの字義は「開く」だが、ここでは到着したらくだの装具や荷を外して休ませる行為を指す慣用表現と判断した。「荷を解く」は日本語として自然で、荷を降ろすことと装具を緩めることの双方をある程度含み得る。
- source_word: תֶּבֶן וּמִסְפּוֹא
  choice: わらと飼料
  rationale: תבןを「わら」、מספואを現代の一般読者に明瞭な「飼料」と訳し、二つの語を区別した。
- source_word: וּמַיִם לִרְחֹץ רַגְלָיו וְרַגְלֵי הָאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: 彼と同行していた人々が足を洗うための水も
  rationale: 目的を表す不定詞を「足を洗うため」とし、彼自身と同行者たちの足の双方を、日本語で重複を避けつつ明確に含めた。
- source_word: וַיִּתֵּן
  choice: 与えた
  rationale: 三人称男性単数の能動形をそのまま能動文で訳した。日本語では主語を繰り返さず、原文の連続した動作を保った。
theological_decisions:
- issue: らくだの荷を解き、飼料と水を与えた動作主
  choice: 本文では固有名を補わず、連続する単数動詞として訳し、注で談話上の可能性を示す
  alternative: 「ラバンが」と本文に補う、または受動文にして動作主を伏せる
  rationale: ヘブライ語本文はここでラバンを名指しせず、直前の「その人」を受けて同じ主語が続く読みが最も素直である。一方、前節で家を整えたと語るラバンがもてなしを行ったと理解する余地も文脈上あるため、本文で一方に限定せず注記した。
translation_notes:
  register: 明快な現代標準日本語を用い、「入った」「荷を解く」「飼料」「足を洗う」など一般読者に理解しやすい語を選んだ。叙事文としての簡潔さと品位を保ち、原文にない固有名や役割名は本文へ補わなかった。
