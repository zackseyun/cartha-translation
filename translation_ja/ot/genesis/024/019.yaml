  text: When she had finished giving him a drink[a], she said, “I will draw water for your camels also, until they have finished drinking.”
translation:
  language: ja
  text: 彼に水を飲ませ終わると、彼女は言った。「あなたのらくだたちのためにも、らくだたちが飲み終わるまで水をくみます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּכַל לְהַשְׁקֹתוֹ
  choice: 彼に水を飲ませ終えると
  rationale: כלה「終える」と、שקהのヒフィル形「飲ませる」を一続きに訳した。物語上、先の動作の完了に続いて発言が起こることを、自然な現代日本語の「終えると」で示す。
- source_word: וַתֹּאמֶר
  choice: 彼女は言った
  rationale: אמרの通常の物語用法。接続詞וַの継起性は前句の「と」で表されているため、ここで「そして」を重ねない。
- source_word: גַּם לִגְמַלֶּיךָ
  choice: あなたのらくだたちのためにも
  rationale: גַּםの添加の意味を「も」で、לְの受益的な意味と二人称男性単数接尾辞を「あなたの…ために」で保持した。
- source_word: אֶשְׁאָב
  choice: 水をくんでまいります
  rationale: שאבは井戸などから水をくむこと。目的語「水」は文脈から明らかなので日本語で補った。「まいります」は、相手に申し出る場面に合う自然で丁寧な表現。
- source_word: עַד אִם כִּלּוּ לִשְׁתֹּת
  choice: みなが飲み終わるまで
  rationale: עַד אִםを終点を示す「まで」とし、כלה＋שתהを「飲み終わる」と訳した。複数主語がらくだを指すことを自然に示すため「みなが」を用いた。
theological_decisions: []
translation_notes:
  register: 明快で自然な現代標準日本語。物語文には端正な常体を用い、リベカの申し出は相手への礼儀が感じられる丁寧体とした。「らくだ」は現代日本語で読みやすい平仮名表記。原文の意味上の曖昧さや神学的緊張を解消する必要がある箇所はない。
