  text: הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל עֵ֣ין הַ/מָּ֑יִם וּ/בְנוֹת֙ אַנְשֵׁ֣י הָ/עִ֔יר יֹצְאֹ֖ת לִ/שְׁאֹ֥ב מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/013.yaml
  text: Look[a], I am standing by the spring of water[c][b], and the daughters of the men of the city are coming out to draw water.
translation:
  language: ja
  text: ご覧ください、私は水の泉のそばに立っています。町の娘たちが水をくみに出て来ます。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「町の男たちの娘たち」。町の若い女性たちを指すヘブライ語の社会的・家族的な表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: 見よ
  rationale: 目前の状況へ注意を促す指示詞。現代語でも聖書本文にふさわしい簡潔で格調ある呼びかけとして保持した。
- source_word: אָנֹכִי
  choice: 私は
  rationale: 独立した一人称代名詞を明示する。文脈上、特別な強意を加えず自然な日本語とした。
- source_word: נִצָּב
  choice: 立っています
  rationale: ニファル分詞が示す現在の姿勢・状態を自然な日本語の継続表現で訳した。
- source_word: עַל עֵין הַמָּיִם
  choice: 水の泉のそばに
  rationale: עַל はここでは水源の近くを表し、עֵין הַמָּיִם は通常の「井戸」בְּאֵר ではなく、湧き出る水源を指すため「水の泉」とした。
- source_word: וּבְנוֹת אַנְשֵׁי הָעִיר
  choice: すると、町の人々の娘たちが
  rationale: וְ は場面の展開に合わせて「すると」とし、ヘブライ語の社会的・家族的表現「町の人々の娘たち」を保った。אַנְשֵׁי は形態上男性複数だが、構文全体は町に属する若い女性たちを指す。
- source_word: יֹצְאֹת
  choice: 出て来ます
  rationale: 女性複数の分詞が表す進行中または目前の動作を、泉で待つ話者の視点から「出て来ます」とした。
- source_word: לִשְׁאֹב מָיִם
  choice: 水をくみに
  rationale: 水源から水を汲み上げる通常の動作を、平明な現代日本語で表した。
