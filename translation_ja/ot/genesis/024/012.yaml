source:
  edition: WLC
  text: וַ/יֹּאמַ֓ר יְהוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם הַקְרֵה נָ֥א לְ/פָנַ֖/י הַ/יּ֑וֹם וַ/עֲשֵׂה חֶ֕סֶד עִ֖ם אֲדֹנִ֥/י אַבְרָהָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/012.yaml
  text: And he said[a], “O Yahweh, God of my master Abraham, please grant success before me today[c][b], and show steadfast love to my master Abraham.”
translation:
  language: ja
  text: 彼は言った。「私の主人アブラハムの神、ヤハウェよ。どうか今日、私の目の前で事が起こるようにしてください[a]。そして、私の主人アブラハムに変わらぬ愛[b]を示してください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「今日、私の前に起こらせてください」。望んでいる出会いを神が取り計らうよう願う表現。
    reason: lexical_alternative
  - marker: b
    text: 「変わらぬ愛」と訳したヘブライ語ヘセドは、忠実な慈しみ、誠実な愛、契約に基づく真実をも表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を、ヘブライ語の四文字神名に対応する一般的な日本語音写で示した。
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: 私の主人アブラハムの神
  rationale: 話者がアブラハムの僕である文脈に即して、אֲדֹנִיを現代日本語で自然な「私の主人」とした。
- source_word: הַקְרֵה נָא לְפָנַי הַיּוֹם
  choice: どうか今日、私のために事をうまく運び
  rationale: הַקְרֵהはקרהのヒフィル命令形で、望む出来事を神が起こすよう求める表現。日本語本文では文脈上の成功を自然に表し、直訳的な含みは脚注に残した。נָאは丁寧な願いとして「どうか」、הַיּוֹםは「今日」とした。
- source_word: וַעֲשֵׂה חֶסֶד
  choice: 変わらぬ愛を示してください
  rationale: חֶסֶדが表す忠実で慈しみに満ちた関わりを、一般読者に明瞭でありながら軽くなりすぎない表現で訳した。
- source_word: עִם אֲדֹנִי אַבְרָהָם
  choice: 私の主人アブラハムに
  rationale: עִםは字義的には「～と」だが、日本語の「愛を示す」が取る自然な相手表示として「～に」とした。
theological_decisions:
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを本文で明示し、一般称号の「主」と同一化しなかった。
- issue: חֶסֶדの意味合い
  choice: 変わらぬ愛
  alternative: 慈しみ／誠実な愛／契約への忠実
  rationale: 単なる親切以上の、忠実で持続的な愛を表しつつ、本文で「契約」という解釈を明示して意味を狭めることは避けた。
- issue: הַקְרֵהの願いの内容
  choice: 私のために事をうまく運び
  alternative: 私の前に起こらせてください
  rationale: 僕が神の摂理による出会いを願っている文脈を明瞭にしたが、動詞自体の曖昧さと字義的表現は脚注で保持した。
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある祈りの文体とした。「おお」は加えず、呼びかけは「ヤハウェよ」で表現した。
