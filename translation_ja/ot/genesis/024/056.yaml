  source_fidelity: 全体としてヘブライ語に忠実です。「引き止めないでください」はאַל־תְּאַחֲרוּנִיの禁止に、「ヤハウェが私の旅を成功させてくださった」はヒフィル形 הִצְלִיחַ と「私の道／旅」דַּרְכִּיに適切に対応します。ただし「帰らせてください」は、原文の「行かせてください／行こう」（וְאֵלְכָה）よりも「帰る」という方向・含意を明示しています。文脈上はアブラハムのもとへの帰還ですが、この語自体は単に「行く」です。
