source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַל תְּאַחֲר֣וּ אֹתִ֔/י וַֽ/יהוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑/י שַׁלְּח֕וּ/נִי וְ/אֵלְכָ֖ה לַֽ/אדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/056.yaml
  text: But he said to them[a], “Do not delay me, since Yahweh has made my journey successful. Send me away so that I may go to my master.”
translation:
  language: ja
  text: しかし彼は彼らに言った。「私を引き止めないでください。ヤハウェが私の旅を成功させてくださったのです。私を送り出してください。主人のもとへ行かせてください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: しかし彼は彼らに言った
  rationale: 物語を進める接続形だが、直前の家族による滞在の申し出との対照を自然な日本語の「しかし」で示した。אֲלֵהֶם は「彼らに」。
- source_word: אַל תְּאַחֲרוּ אֹתִי
  choice: 私を引き止めないでください
  rationale: אחר のヒフィル形は遅らせる、引き止める意。ここでは出発を延期させようとする文脈に合い、丁寧な依頼として自然である。
- source_word: וַיהוָה
  choice: ヤハウェが
  rationale: 本文の神名 יהוה を固有名として音写し、一般名詞の「主」と区別した。
- source_word: הִצְלִיחַ דַּרְכִּי
  choice: 私の旅を成功させてくださった
  rationale: צלח のヒフィル形による神の使役的働きを「成功させる」で保持した。דֶּרֶךְ は字義的には「道」だが、この文脈では旅とその使命を指す。「くださった」は話者の敬意を自然に表す。
- source_word: שַׁלְּחוּנִי
  choice: 私を送り出し
  rationale: שלח のピエル命令形を、出発の許可と見送りを求める表現として訳した。
- source_word: וְאֵלְכָה לַאדֹנִי
  choice: 主人のもとへ帰らせてください
  rationale: コホータティブは話者の出発意志を表す。目的地は仕えているアブラハムのもとなので、日本語では「帰らせてください」が自然。「主人」は人間の上位者を指す אֲדֹנִי を神への称号と区別する。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: ヘブライ語本文にある四文字神名を固有名として明示し、「主人」との区別も保った。母音の厳密な古代発音には不確実性があるが、現代日本語で広く用いられる学術的表記を採用した。
- issue: הִצְלִיחַ が示す神の働き
  choice: ヤハウェが私の旅を成功させてくださった
  alternative: 私の旅がうまくいった
  rationale: ヒフィル形が表す神の能動的な成功の付与を弱めずに訳した。
translation_notes:
  register: 明瞭な現代標準語を用い、僕が家族に礼を保ちながらも即時の出発を求める調子を再現した。「引き止めないでください」「送り出し、帰らせてください」により、簡潔で dignified な会話文とした。
