  yaml_path: translation/ot/genesis/024/011.yaml
  text: And he made the camels kneel down outside the city by the well of water at evening time[b][a], at the time when the women go out to draw water.
translation:
  language: ja
  text: 彼は、町の外の水の井戸のそばに、らくだを伏せさせた。夕暮れ時、女たちが水をくみに出て行く時刻であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבְרֵךְ הַגְּמַלִּים
  choice: らくだをひざまずかせた
  rationale: ברךのヒフィル形は、ここではらくだにひざを折らせて伏せさせる使役的な動作を表す。「ひざまずかせた」は具体的な姿勢と使役の意味を自然な現代日本語で伝える。
- source_word: מִחוּץ לָעִיר
  choice: 町の外
  rationale: עִירは「町」「都市」のいずれにもなり得るが、この場面では規模を不必要に特定しない自然な「町」を選んだ。מִחוּץの位置関係は「外」で明確に表した。
- source_word: אֶל בְּאֵר הַמָּיִם
  choice: 水の井戸のそばで
  rationale: אֶלは井戸へ向かう方向を示すが、らくだを伏せさせた結果の位置として日本語では「そばで」が自然である。בְּאֵר הַמַּיִםの具体的表現は「水の井戸」として保持した。
- source_word: לְעֵת עֶרֶב
  choice: 夕暮れ時
  rationale: 夕方という時間帯を、簡潔で情景の伝わる現代日本語にした。
- source_word: לְעֵת צֵאת הַשֹּׁאֲבֹת
  choice: 女たちが水をくみに出て来る時刻
  rationale: הַשֹּׁאֲבֹתは女性複数形の分詞なので「女たち」と明示した。צֵאתは町から井戸へ出て来る動きを表すため、「出て来る」とした。水をくむ行為は日本語で自然に補った。
