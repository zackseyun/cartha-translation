  source_fidelity: ヘブライ語は、彼がらくだを町の外の水の井戸のところでひざを折らせたこと、およびそれが夕方、女性たちが水をくみに出て行く時刻であったことを述べる。現行訳は全体としてこの内容を伝えるが、「ひざまずかせた」は日本語では人の敬意・礼拝のしぐさを強く連想させ、らくだの姿勢としては不自然である。また「出て来る」は原文の単なる「出て行く」に、日本語の話者側へ向かう含みを加える。
  naturalness: 「らくだを伏せさせた」は、らくだを休ませるために膝を折らせる場面を現代日本語として自然に表す。「夕暮れ時、女たちが水をくみに出て行く時刻であった」は、二つの時間句の並置を保ちつつ読みやすい。
  terminology: 「町」は עיר の文脈に適切であり、「水の井戸」も原文の「水の井戸」を保持している。「女たち」は女性複数の分詞を明示しており、注を要しない。
