base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/030.yaml
  text: And it happened[a], when he saw the nose ring and the bracelets on his sister’s hands, and when he heard the words of Rebekah his sister, saying, “This is what the man said to me,” that he went to the man. And behold[d][c][b], he was standing by the camels at the spring.
translation:
  language: ja
  text: 彼は、妹の手にある鼻輪[a]と腕輪を見、また妹リベカが、「その人は私にこのように話しました」と言ったのを聞くと、その人のところへ行った。見ると、その人は泉[c]のほとりで、らくだのそば[b]に立っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「輪」とも訳せる。ヘブライ語は一般に輪形の装身具を指し得るが、47節ではリベカの鼻に着けたと記されている。
    reason: lexical_alternative
  - marker: b
    text: 「らくだの上に」と訳すことも可能である。ヘブライ語の前置詞は、ここではらくだの近く、または傍らにいる位置を表しうる。
    reason: lexical_alternative
  - marker: c
    text: 「井戸」と訳されることもある。ヘブライ語は、より具体的には泉や水源を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ～すると
  rationale: 物語の次の出来事を導く表現。日本語では独立した「そして、事が起こった」より、二つの時間節を受ける「～すると」が自然で、原文の展開を保てる。
- source_word: הַנֶּזֶם
  choice: 鼻輪
  rationale: 語自体は一般に「輪」とも解せるが、24章47節でリベカの鼻に着けたと明記されるため、文脈上「鼻輪」が適切。語の幅は脚注に残す。
- source_word: הַצְּמִדִים עַל יְדֵי אֲחֹתוֹ
  choice: 妹の手にある腕輪
  rationale: יָד の字義「手」を保ちつつ、装身具として自然な「腕輪」を用いた。「手首」と限定しすぎない。
- source_word: וּכְשָׁמְעוֹ אֶת דִּבְרֵי רִבְקָה אֲחֹתוֹ לֵאמֹר
  choice: また妹リベカが、…と話すのを聞くと
  rationale: לֵאמֹר が直接話法を導く働きを、日本語で重複感なく表現した。
- source_word: כֹּה דִבֶּר אֵלַי הָאִישׁ
  choice: あの方は私にこのように言いました
  rationale: כֹּה の指示的な意味を「このように」で保持し、リベカの発話として自然な丁寧体にした。הָאִישׁ は話者から見た未知の成人男性への自然な言及として「あの方」とした。
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: その人のところへ行った
  rationale: ラバンを視点人物とする日本語の移動表現では「行った」が明瞭。二度目の הָאִישׁ は地の文なので「その人」とした。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 場面を生き生きと提示する機能を、現代日本語の物語表現「見ると」で自然に示した。
- source_word: עֹמֵד
  choice: 立っていた
  rationale: 分詞が表す、その時点で継続中の姿勢を「～ていた」で表した。
- source_word: עַל הַגְּמַלִּים
  choice: らくだのそばに
  rationale: 前置詞 עַל はここでは上に乗る意味ではなく、近接・傍らの位置を示すと判断した。
- source_word: עַל הָעָיִן
  choice: 泉のほとりで
  rationale: עַיִן はこの文脈では水の湧く場所を指す。「井戸」より具体的な「泉」とし、עַל の近接性を「ほとり」で表した。
