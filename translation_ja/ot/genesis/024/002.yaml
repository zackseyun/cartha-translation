  text: וַ/יֹּ֣אמֶר אַבְרָהָ֗ם אֶל עַבְדּ/וֹ֙ זְקַ֣ן בֵּית֔/וֹ הַ/מֹּשֵׁ֖ל בְּ/כָל אֲשֶׁר ל֑/וֹ שִֽׂים נָ֥א יָדְ/ךָ֖ תַּ֥חַת יְרֵכִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/002.yaml
  text: And Abraham said to his servant[a], the oldest of his household, who ruled over all that belonged to him[b], “Please put your hand under my thigh.”
translation:
  language: ja
  text: アブラハムは、自分の僕[a]、すなわちその家の年長の僕で、アブラハムの所有するすべてを取り仕切っていた者に言った。「どうか、あなたの手を私のももの下に置いてくれ[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「僕」に当たるヘブライ語は、文脈によっては「奴隷」を意味することもある。ここでは、アブラハムの家と財産を任された者を指す。
    reason: lexical_note
  - marker: b
    text: 手をももの下に置くことは、古代の誓約に伴う厳粛な所作であったと考えられる。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ヘブライ語の物語を進める標準的な動詞形として、自然な現代日本語で表した。文脈上の継起は語順から明らかなため、接続詞を機械的には補わない。
- source_word: עַבְדּוֹ
  choice: 自分の僕
  rationale: עֶבֶדには「奴隷」と「僕・仕える者」の意味領域がある。この箇所では家全体を任された信任の厚い者として描かれるため、「僕」が文脈に適する一方、身分を現代的な雇用関係に限定しない。
- source_word: זְקַן בֵּיתוֹ
  choice: 家の中で最年長
  rationale: זָקֵןの年齢と長老格・上位者という含みを保ちつつ、ここでは家に属する者のうち最年長であるという自然な意味に訳した。
- source_word: הַמֹּשֵׁל בְּכָל אֲשֶׁר־לוֹ
  choice: 彼の持ち物すべてを管理していた者
  rationale: מֹשֵׁלは支配・統轄することを表すが、家の財産を任された役割として日本語では「管理していた」が自然である。「彼の持ち物すべて」はאֲשֶׁר־לוֹの所有の意味を明示する。
- source_word: שִׂים נָא
  choice: どうか……置いてくれ
  rationale: 命令形に添えられたנָאの丁重または切実な依頼の調子を、目下の者への自然な依頼表現で示した。
- source_word: תַּחַת יְרֵכִי
  choice: 私のももの下
  rationale: 文化的に特有な誓約の所作を指すため、婉曲的な解釈を本文へ持ち込まず直訳し、説明は脚注に置いた。
theological_decisions:
- issue: 「ももの下に手を置く」という行為の意味
  choice: 本文では所作を字義どおりに訳し、脚注で古代の誓約に伴う行為と説明する
  alternative: 身体部位を婉曲表現として解釈し、本文で別の表現に置き換える
  rationale: ヘブライ語本文はיָרֵךְ（もも）と記しており、正確な身体的位置や象徴性までは明言しない。本文の曖昧さを保ち、確実性を超えた解釈を避ける。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語としての簡潔さと族長物語にふさわしい品位を保った。「置いてくれ」は、נָאの依頼の調子と、家長が僕に語る関係の双方を自然に示す。
