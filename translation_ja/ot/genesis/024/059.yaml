  text: So they sent away Rebekah their sister[a], and her nurse, and Abraham’s servant, and his men.
translation:
  language: ja
  text: こうして彼らは、自分たちのきょうだいであるリベカと、その乳母[a]、アブラハムのしもべと、彼の男たちを送り出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼女に乳を与えた女性」。
    reason: 「乳母」が養育係一般ではなく、授乳した女性を具体的に指すことを示すため。
lexical_decisions:
- source_word: וַיְשַׁלְּחוּ
  choice: 送り出した
  rationale: ピエル形が表す、旅立たせるため正式に送り出すという文脈上の意味を、自然な日本語で示した。
- source_word: רִבְקָה
  choice: リベカ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: אֲחֹתָם
  choice: 姉妹の
  rationale: 原語は年長・年少を区別しないため、「姉」や「妹」と限定せず、やや改まった表現ながら「姉妹」として原文の幅を保った。
- source_word: מֵנִקְתָּהּ
  choice: その乳母
  rationale: ינק に由来する語で、リベカに乳を与えて育てた女性を指す。「乳母」は簡潔で歴史的文脈にも適する。
- source_word: עֶבֶד אַבְרָהָם
  choice: アブラハムの僕
  rationale: 構文を自然に反映した。עֶבֶד は奴隷をも意味し得るが、ここでは主人の代理として旅をする奉仕者としての役割が前面に出ているため「僕」とした。
- source_word: אֲנָשָׁיו
  choice: その供の者たち
  rationale: 接尾辞はアブラハムの僕を指す。単なる「男たち」よりも、彼に従って旅をしている者たちという文脈を自然に示す。
theological_decisions: []
translation_notes:
