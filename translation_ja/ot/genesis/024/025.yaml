  text: וַ/תֹּ֣אמֶר אֵלָ֔י/ו גַּם תֶּ֥בֶן גַּם מִסְפּ֖וֹא רַ֣ב עִמָּ֑/נוּ גַּם מָק֖וֹם לָ/לֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/025.yaml
  text: Then she said to him[a], “We have plenty of both straw and fodder, and also a place to spend the night.”
translation:
  language: ja
  text: さらに彼女は言った。「わたしたちのところには、わらも飼料もたくさんありますし、泊まる場所もあります。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: さらに彼女は言った
  rationale: וַתֹּאמֶרは物語を進めるが、この文脈では直前の返答に情報を付け加えているため、「さらに」が自然。אֵלָיוの「彼に」は日本語では文脈上明白なので省略した。
- source_word: גַּם ... גַּם ... גַּם
  choice: …も…も…し、…も
  rationale: 反復による列挙と累加の意味を、自然な日本語の助詞「も」と接続助詞「し」で保持した。
- source_word: תֶּבֶן
  choice: わら
  rationale: 家畜のために備えられた藁を指す、この場面に適した一般的な語。
- source_word: מִסְפּוֹא
  choice: 飼料
  rationale: 家畜の餌を表す語として正確で、現代日本語でも明瞭。
- source_word: רַב עִמָּנוּ
  choice: わたしたちのところには…たくさんあります
  rationale: 直訳は「私たちと共に多くある」だが、所有・備蓄を表す自然な日本語にした。רַבの豊富さも明示している。
- source_word: מָקוֹם לָלוּן
  choice: 泊まる場所
  rationale: מָקוֹםの一般性を保ちつつ、לָלוּןの「一夜を過ごす」という意味を自然で簡潔な日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語。礼儀ある応答として「あります」を用い、簡潔さと物語の品位を保った。
