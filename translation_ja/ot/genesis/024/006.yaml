- source_word: וַיֹּאמֶר אֵלָיו
  choice: 彼に言った
  rationale: 物語を進める一般的な言い方であり、前置詞と三人称男性単数接尾辞も明示する。
- source_word: הִשָּׁמֶר לְךָ
  choice: 気をつけなさい
