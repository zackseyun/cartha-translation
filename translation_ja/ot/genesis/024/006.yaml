- source_word: אֶת־בְּנִי
  choice: 私の息子を
  rationale: 目的語標識と一人称単数接尾辞をそのまま明確に訳す。
- source_word: שָׁמָּה
  choice: そこへ
  rationale: 方向性を帯びた場所の副詞なので、日本語では助詞「へ」によって移動先を自然に示す。
