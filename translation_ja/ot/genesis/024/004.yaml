  text: but you shall go to my land and to my kindred[b][a], and take a wife for my son Isaac.
translation:
  language: ja
  text: むしろ、私の土地と、私の親族のもとへ行って[a]、私の息子イサクのために妻を迎えなさい。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の生まれ故郷へ」とも訳せる。ヘブライ語は、出身地と血縁集団のどちらをも指し得る。ここでは文脈に従い「私の親族のもとへ」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: そうではなく
  rationale: 直前の、カナン人の娘から妻を選んではならないという命令と対照を成すため、文脈上の反意を明確に表した。
- source_word: אֶל אַרְצִי
  choice: 私の土地へ
  rationale: אֶרֶץの地理的な意味を保ち、近代的な国民国家を連想させやすい「国」を避けた。
- source_word: וְאֶל מוֹלַדְתִּי
  choice: 私の親族のもとへ
  rationale: מוֹלֶדֶתは出身地または血縁集団を指し得るが、親族から妻を迎えるという文脈には「親族」が最もよく合う。場所を表す可能性は脚注に残した。
- source_word: תֵּלֵךְ
  choice: 行き
  rationale: ここでは単なる未来ではなく、僕に対する指示として機能している。後続の命令表現と一続きの自然な日本語にした。
- source_word: וְלָקַחְתָּ
  choice: 迎えなさい
  rationale: לקחの基本義は「取る」だが、妻を目的語とする婚姻の文脈では、日本語の「妻を迎える」が意味と命令の力を自然に伝える。
- source_word: אִשָּׁה
  choice: 妻
  rationale: 語自体は「女」と「妻」の両義を持つが、イサクとの婚姻を意図する文脈なので「妻」とした。
- source_word: לִבְנִי לְיִצְחָק
  choice: 私の息子イサクのために
  rationale: 反復された前置詞לによる受益者と同格の関係を、自然な日本語で明確に表した。
