id: GEN.24.36
reference: Genesis 24:36
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥/י בֵן֙ לַֽ/אדֹנִ֔/י אַחֲרֵ֖י זִקְנָתָ֑/הּ וַ/יִּתֶּן לּ֖/וֹ אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/036.yaml
  text: And Sarah[a], my master's wife, bore a son to my master after her old age, and he gave him all that he had.
translation:
  language: ja
  text: 私の主人の妻サラは、年老いてから[a]、主人との間に男の子を産みました。そして主人は、自分の持つすべてをその子に与えました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼女の老年の後に」。
    reason: 原文の特異な時間表現を示しつつ、本文では自然な現代日本語とするため。
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 産みました
  rationale: ילדのQal形で、物語の過去の出来事として出産を表す。現代日本語で明瞭かつ自然な表現とした。
- source_word: אֵשֶׁת אֲדֹנִי
  choice: 私の主人の妻
  rationale: 連語の意味と、僕が主人に言及する際の敬意を保った。
- source_word: בֵן לַאדֹנִי
  choice: 主人との間に男の子
  rationale: לが示す帰属・関係を、逐語的で不自然な「主人に男の子を産む」ではなく、自然な日本語で表した。文脈上、その子が主人の息子であることを明確にする。
- source_word: אַחֲרֵי זִקְנָתָהּ
  choice: 年老いてから
  rationale: 字義的には「彼女の老年の後に」という特異な表現だが、サラが高齢になった後という時間的意味を明瞭に伝える。字義形は脚注に残した。
- source_word: וַיִּתֶּן לוֹ
  choice: 主人は……その子に与えました
  rationale: 動詞の主語は直前の「私の主人」、間接目的語は生まれた息子である。日本語では代名詞の曖昧さを避けて指示対象を明示した。
- source_word: אֶת כָּל אֲשֶׁר לוֹ
  choice: 自分の持つすべて
  rationale: 所有物の総体を表す句。「全財産」より広い原文の包括性を保つ表現とした。
theological_decisions: []
translation_notes:
  register: 僕が主人について語る場面にふさわしく、丁寧でありながら平明な現代標準日本語を用いた。
