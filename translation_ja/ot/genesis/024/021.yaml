id: GEN.24.21
reference: Genesis 24:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָ/אִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑/הּ מַחֲרִ֕ישׁ לָ/דַ֗עַת הַֽ/הִצְלִ֧יחַ יְהוָ֛ה דַּרְכּ֖/וֹ אִם לֹֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/021.yaml
  text: The man watched her silently[a], to know whether Yahweh had made his journey successful or not.
translation:
  language: ja
  text: その人は、ヤハウェがその人の旅を成功させたかどうかを知ろうと、黙って彼女を見つめていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その人は、ヤハウェがその人の旅を成功させたかどうかを確かめようと、驚きながらも黙って彼女を見ていた。」
    reason: מִשְׁתָּאֵה は、注意深く見つめることに加え、驚きや不思議に思う様子を含む可能性がある。
lexical_decisions:
- source_word: הָאִישׁ
  choice: その人
  rationale: 文脈上はアブラハムの僕だが、原文は一般名詞「人」を用いているため、役割名を補わず「その人」とした。
- source_word: מִשְׁתָּאֵה
  choice: 見つめていた
  rationale: 継続的に注意深く見ることを表す分詞として自然に訳した。この語には驚きや不思議に思う含みがあり得るため、脚注に示した。
- source_word: לָהּ
  choice: 彼女を
  rationale: 彼の注視の対象を示す。日本語では「彼女を見つめる」が自然である。
- source_word: מַחֲרִישׁ
  choice: 黙って
  rationale: חרשׁの分詞が表す、口をきかず沈黙を保つ様子を自然な副詞句で表した。
- source_word: לָדַעַת
  choice: 知ろうと
  rationale: 目的を表す不定詞を、日本語として自然な意志・目的表現で訳した。
- source_word: הַהִצְלִיחַ
  choice: 成功させた
  rationale: צלחのヒフィル形の使役的意味「成功させる」を明示した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、原文の神名を音写した。
- source_word: דַּרְכּוֹ
  choice: 自分の旅
  rationale: 直訳は「彼の道」だが、この文脈ではその人が遂行している旅・任務を指す。「自分の」は主語との関係を明確にする自然な再帰表現である。
- source_word: אִם לֹא
  choice: かどうか
  rationale: 間接疑問を完成させる「…か、そうでないか」を、簡潔で自然な日本語にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文は称号ではなく四文字神名を直接用いているため、個人名として「ヤハウェ」と音写した。
- issue: 神による成功の使役
  choice: ヤハウェが自分の旅を成功させた
  alternative: 自分の旅がヤハウェによって成功した／ヤハウェが自分の道を栄えさせた
  rationale: ヒフィル形の使役性と、ヤハウェが文法上の主語であることを保った。敬語的な「くださった」は原文にない評価を加え得るため用いなかった。
translation_notes:
  register: 明瞭で現代的ながら品位のある叙事文体。「僕」と特定せず原文の「人」を保ち、希少語 מִשְׁתָּאֵה の意味の幅は本文で一つに限定しすぎず脚注で示した。
