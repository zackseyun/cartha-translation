  text: וַ/תָּ֨קָם רִבְקָ֜ה וְ/נַעֲרֹתֶ֗י/הָ וַ/תִּרְכַּ֨בְנָה֙ עַל הַ/גְּמַלִּ֔ים וַ/תֵּלַ֖כְנָה אַחֲרֵ֣י הָ/אִ֑ישׁ וַ/יִּקַּ֥ח הָ/עֶ֛בֶד אֶת רִבְקָ֖ה וַ/יֵּלַֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/061.yaml
  text: Then Rebekah and her young women arose[a], mounted the camels, and went after the man. And the servant took Rebekah and went on his way.
translation:
  language: ja
  text: そこで、リベカと彼女の若い女性たち[a]は立ち上がり、らくだに乗って、その人の後について行った。しもべはリベカを連れて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼女の若い女性たち」。文脈上、リベカに付き添う女性たち、すなわち侍女たちを指す可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: 立ち上がり
  rationale: קוםの基本義である「立つ、起き上がる」を保ちつつ、続く出発行動へ自然につなげる。
- source_word: נַעֲרֹתֶיהָ
  choice: 侍女たち
  rationale: נַעֲרָהの語彙的中心は若い女性だが、所有接尾辞と旅に同行する文脈から、リベカに仕える若い女性たちを指すと考えられる。明確な年齢より役割が日本語では自然に伝わるため本文では「侍女たち」とし、脚注で直訳的選択肢を示す。
- source_word: וַתִּרְכַּבְנָה עַל הַגְּמַלִּים
  choice: らくだに乗って
  rationale: רכב＋עַלは乗ることを表す。「らくだに乗り」は日本語として簡潔で、乗って移動を始める一連の動作を自然に表現する。
- source_word: אַחֲרֵי הָאִישׁ
  choice: その人の後について行った
  rationale: אַחֲרֵיの「後ろに、後に従って」を、旅の先導者について行くという文脈に即して自然に表す。
- source_word: הָאִישׁ
  choice: その人
  rationale: 文脈上はアブラハムのしもべだが、原文はהָאִישׁ「その男／人」と呼ぶため、その語り分けを保持する。
- source_word: וַיִּקַּח הָעֶבֶד אֶת רִבְקָה
  choice: しもべはリベカを連れて
  rationale: לקחの基本義は「取る」だが、人を伴って旅をする文脈では、日本語の「連れて」が意味を過不足なく伝える。
- source_word: הָעֶבֶד
  choice: しもべ
  rationale: עֶבֶדは奴隷またはしもべを意味し得るが、ここではアブラハムから重要な任務を託された家の者としての役割が前面にあるため「しもべ」とする。
- source_word: וַיֵּלַךְ
  choice: 旅立った
  rationale: הלך自体は「行った」だが、ここではリベカを伴って帰途につく場面であり、「旅立った」が日本語の物語として自然に継続移動を表す。
