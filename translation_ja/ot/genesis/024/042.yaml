source:
  edition: WLC
  text: וָ/אָבֹ֥א הַ/יּ֖וֹם אֶל הָ/עָ֑יִן וָ/אֹמַ֗ר יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אִם יֶשְׁ/ךָ נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔/י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽי/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/042.yaml
  text: Today I came to the spring and said[a], ‘O Yahweh, God of my master Abraham[b], if now you are prospering my way on which I am going—’
translation:
  language: ja
  text: 「今日、私は泉[a]に来て、こう言いました。『ヤハウェ、私の主人アブラハムの神よ。もし今、どうか私の進んでいる道[b]を成功させてくださるなら――』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「井戸」とも訳される。ヘブライ語は、より具体的には泉または水源を表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私の道」。ここでは、しもべの旅または使命を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאָבֹא הַיּוֹם
  choice: 今日、私は……来て
  rationale: 接続形による過去の叙述を自然な日本語で表しつつ、הַיּוֹם（今日）の時間的強調を保った。
- source_word: הָעָיִן
  choice: 泉
  rationale: עַיִןはここでは湧き水の出る場所、水源を指す。「井戸」より原語の中心的意味に近い。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: 私の主人アブラハムの神
  rationale: אֲדֹנִיはここでは神への称号ではなく、しもべに対する人間の主人アブラハムを指す。
- source_word: אִם יֶשְׁךָ נָּא מַצְלִיחַ
  choice: どうか今……成功させてくださるのでしたら
  rationale: אִםの条件的で未完結な構文と、נָאの願い・懇願のニュアンスをともに残した。מַצְלִיחַは使役の意味を反映して「成功させる」とした。
- source_word: דַּרְכִּי
  choice: 私が進んでいるこの道
  rationale: 直訳的な「私の道」を基礎とし、後続句と合わせて日本語として自然にした。文脈上は旅程だけでなく、しもべが果たそうとしている使命も含み得る。
- source_word: אֲשֶׁר אָנֹכִי הֹלֵךְ עָלֶיהָ
  choice: 私が進んでいる
  rationale: ヘブライ語の「その上を私が行く」という道についての慣用表現を、自然な現代日本語で表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文は称号ではなく四文字神名を用いているため、固有名として「ヤハウェ」と音写した。
- issue: 条件文と祈願の関係
  choice: どうか今……のでしたら――
  alternative: どうか……成功させてください
  rationale: 単純な願望文に直さず、אִםで始まり次節へ続く条件構文の未完結性と神への懇願を併存させた。
translation_notes:
  register: しもべが主人に報告する丁寧な語り口と、祈りの厳粛さを保った現代標準日本語。条件文が次節へ続くことを長いダッシュで示した。
