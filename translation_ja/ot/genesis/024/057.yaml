  text: And they said[b][a], “Let us call the young woman and ask her.”
translation:
  language: ja
  text: 彼らは言った。「その若い女性を呼んで、本人に直接尋ねよう。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼女の口を尋ねよう」。彼女自身から直接答えを聞く、という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 彼らは言った
  rationale: 物語を進める通常のワウ継続法であり、文脈上自然な現代日本語とした。
- source_word: נִקְרָא
  choice: 呼んで……よう
  rationale: 一人称複数の意志・提案を表す形なので、「呼ぼう」に相当する提案として訳した。後続する動詞と自然につなぐため「呼んで……尋ねよう」とした。
- source_word: לַנַּעֲרָ
  choice: あの若い女性
  rationale: נַעֲרָהは若い女性を指す。ここでは結婚年齢のリベカなので、幼さを強く感じさせる「少女」や古風な「乙女」を避けた。文脈ですでに話題となっている人物を指すため「あの」を補った。
- source_word: וְנִשְׁאֲלָה
  choice: 尋ねよう
  rationale: 前の動詞に続く一人称複数の提案。「聞こう」よりも、本人の意思を問いただす場面に適した「尋ねよう」とした。
- source_word: אֶת־פִּיהָ
  choice: 本人に直接
  rationale: 直訳は「彼女の口を」で、彼女自身の口から答えを聞くことを表す慣用句。日本語で意味が明確になるよう「本人に直接」とし、字義は脚注に残した。
