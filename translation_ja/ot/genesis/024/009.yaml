  text: וַ/יָּ֤שֶׂם הָ/עֶ֨בֶד֙ אֶת יָד֔/וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑י/ו וַ/יִּשָּׁ֣בַֽע ל֔/וֹ עַל הַ/דָּבָ֖ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/009.yaml
  text: So the servant put his hand under the thigh of Abraham his master and swore to him concerning this matter[a].
translation:
  language: ja
  text: そこで、そのしもべは手を主人アブラハムの太ももの下に置き、このことについて彼に誓った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「太ももの下に」は、厳粛な誓いに伴う身振りを表すヘブライ語の字義どおりの訳である。これを腰部、あるいは契約に関わる子孫と象徴的に関連するものと理解する見方もある。
    reason: cultural_note
lexical_decisions:
- source_word: הָעֶבֶד
  choice: 僕
  rationale: עֶבֶדは奴隷・僕・しもべを指し得るが、ここではアブラハムの家に仕えてその命を受ける者としての役割が前面に出ている。「僕」は社会的な上下関係を保ちつつ、聖書本文にふさわしい簡潔で dignified な表現である。
- source_word: וַיָּשֶׂם ... אֶת יָדוֹ
  choice: 手を…置き
  rationale: שׂוּםの基本義「置く」をそのまま自然な日本語で表した。
- source_word: תַּחַת יֶרֶךְ
  choice: 腿の下に
  rationale: יָרֵךְの具体的な身体語「腿」を保持し、腰部・生殖・契約の子孫との象徴的関連を本文で確定しない。
- source_word: אַבְרָהָם אֲדֹנָיו
  choice: 主人アブラハム
  rationale: אֲדוֹןはここでは人間の家長としての権威を示すため「主人」とした。日本語として自然な語順に整えた。
- source_word: וַיִּשָּׁבַע לוֹ
  choice: 彼に誓った
  rationale: ニファル形のשׁבעが表す「誓う」を簡潔に訳し、לוֹの相手を「彼に」で明示した。
- source_word: עַל הַדָּבָר הַזֶּה
  choice: このことについて
  rationale: דָּבָרは広く「言葉・事柄」を意味する。ここでは直前に命じられた内容を指すため、現代日本語で自然な「このこと」とした。
theological_decisions:
- issue: 誓約時の身振りを字義的に訳すか、その象徴性を解釈して訳すか
  choice: 「腿の下に」と具体的動作を字義的に訳し、考えられる象徴性は脚注に示す。
  alternative: 「腰の下に」などとし、生殖器、腰、契約の子孫との関連を本文に織り込む。
  rationale: ヘブライ語本文は動作を記すだけで意味を明示しない。本文では曖昧さを保ち、特定の象徴解釈を断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、誓約場面にふさわしい簡潔で荘重な調子を保った。「腿」は字義性を優先した表記であり、脚注により古代の慣習と解釈上の幅を補った。
