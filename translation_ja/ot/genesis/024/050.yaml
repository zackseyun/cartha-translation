  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֨עַן לָבָ֤ן וּ/בְתוּאֵל֙ וַ/יֹּ֣אמְר֔וּ מֵ/יְהוָ֖ה יָצָ֣א הַ/דָּבָ֑ר לֹ֥א נוּכַ֛ל דַּבֵּ֥ר אֵלֶ֖י/ךָ רַ֥ע אוֹ טֽוֹב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/050.yaml
  text: Then Laban and Bethuel answered and said[a], “The matter has come from Yahweh[b]; we cannot speak to you bad or good.”
translation:
  language: ja
  text: そこでラバンとベトエルは答えて言った。「このことはヤハウェから出たのです。私たちは、このことについて、あなたに悪いとも良いとも言うことはできません[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「あなたに悪いことも良いことも語ることができない」。「悪い」と「良い」を並べる両極表現であり、文脈上、この事柄について反対や賛同などを述べることができない、という趣旨とも理解できる。
    reason: ヘブライ語の両極表現の慣用的な含意を、本文の曖昧さを保って説明するため。
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: 答えて言った
  rationale: ヘブライ語の二重の発話導入を保ちつつ、日本語として理解できる聖書叙述の表現とした。主語は複数だが、日本語の動詞では数を明示しない。
- source_word: מֵיְהוָה
  choice: ヤハウェから
  rationale: 前置詞מִןは起点・由来を表す。神名יהוהは一般名詞に置き換えず、「ヤハウェ」と音写した。
- source_word: יָצָא הַדָּבָר
  choice: このことは…から出たものです
  rationale: דָּבָרはここでは結婚の申し出をめぐる事柄を指す。יצאの「出る」という像と、事の由来がヤハウェにあるという意味をともに保った。
- source_word: לֹא נוּכַל דַּבֵּר אֵלֶיךָ
  choice: 私たちは、あなたに…言うことができません
  rationale: יכלの能力・可能の否定を明示し、דבר אלの相手に向けて語る意味を自然な日本語で表した。
- source_word: רַע אוֹ טוֹב
  choice: 悪いとも良いとも
  rationale: 原文の語順と両極表現を保った。単なる評価の不能だけでなく、決まった事柄に異議を唱えたり変更したりできないという含みは脚注で示した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有の神名が明記されているため、称号へ置き換えず音写し、契約の神の固有名として提示した。
- issue: 「悪いとも良いとも言えない」の含意
  choice: 原文の両極表現を本文に残す
  alternative: 反対することも変更することもできない
  rationale: この慣用表現の文脈上の含意を本文で一義的に言い換えず、原文の曖昧さと神の決定に対する人間側の応答の緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「答えて言った」など原文の語り口を適度に残した。会話は丁寧体とし、婚姻交渉の場にふさわしい落ち着いた格調を保った。
