base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/046.yaml
  text: She quickly lowered her jar from her shoulder and said[a], ‘Drink, and I will also give water to your camels.’ So I drank, and she also gave water to the camels.
translation:
  language: ja
  text: 彼女は急いで水がめを肩から下ろし[a]、「お飲みください。あなたのらくだにも水を飲ませましょう」と言った。そこで私は飲んだ。彼女はらくだにも水を飲ませた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼女の上から」。この節では身体のどの部分かは明記されていないが、前後の文脈から、水がめを肩に載せていたと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: 急いで
  rationale: מהר は素早く行動することを表す。後続の動作を修飾する「急いで」とすることで、リベカの迅速な応答を自然な現代日本語で伝える。
- source_word: וַתּוֹרֶד
  choice: 下ろし
  rationale: ירד のヒフィル形は「下へ移す、下ろす」の意。水がめを担いでいた位置から下げる動作を簡潔に表す。
- source_word: כַּדָּהּ
  choice: 水がめを
  rationale: כד は水をくむための壺・かめを指す。文脈上の用途を明確にし、現代日本語で分かりやすい「水がめ」とした。
- source_word: מֵעָלֶיהָ
  choice: 肩から
  rationale: 字義的には「彼女の上から」で身体部位は明示されないが、24章15節の文脈から肩に担いでいたと理解できる。本文は自然な「肩から」とし、原文の非明示性は脚注に残す。
- source_word: שְׁתֵה
  choice: お飲みください
  rationale: 直接的な命令形だが、この場面の申し出として自然で丁寧な日本語にした。命令の内容そのものは保っている。
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: あなたのらくだにも水を飲ませましょう
  rationale: שקה のヒフィル形は「飲ませる、水を与える」の意。「にも」で גַם を表し、話者の申し出を自然な意志表現で訳した。
- source_word: וָאֵשְׁתְּ
  choice: そこで私は飲んだ
  rationale: 継起する物語の流れと、彼女の勧めを受けた結果であることを「そこで」で自然に示す。
- source_word: וְגַם הַגְּמַלִּים הִשְׁקָתָה
  choice: 彼女はらくだにも水を飲ませた
  rationale: 前の発言と同じ שקה を同じく「水を飲ませる」と訳し、申し出が実行されたことを明確にする。
