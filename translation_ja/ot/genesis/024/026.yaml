source:
  edition: WLC
  text: וַ/יִּקֹּ֣ד הָ/אִ֔ישׁ וַ/יִּשְׁתַּ֖חוּ לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/026.yaml
  text: Then the man bowed down and worshiped Yahweh[a][b].
translation:
  language: ja
  text: すると、その人は身をかがめ、ヤハウェを礼拝した[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ヤハウェの前にひれ伏した」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「その人」。文脈上、アブラハムのしもべを指す。
    reason: referent_clarification
lexical_decisions:
- source_word: וַיִּקֹּד
  choice: 身をかがめ
  rationale: קָדַדが表す、体を低く曲げて敬意を示す動作を、現代日本語で自然に表した。続く礼拝の動作との区別も保っている。
- source_word: הָאִישׁ
  choice: その人
  rationale: 原文は文脈上アブラハムのしもべを指すが、この節では明示的に「人」と述べているため、「しもべ」と言い換えず原文の表現を保った。
- source_word: וַיִּשְׁתַּחוּ
  choice: 礼拝した
  rationale: この動詞は身を伏せる動作を表すと同時に、神に向けられる場合には礼拝の意味を持つ。直前の動詞ですでに身体をかがめる動作が示されているため、ここでは宗教的な意味を明確にした。身体的な意味は脚注に残した。
- source_word: לַיהוָה
  choice: ヤハウェを
  rationale: 前置詞 לְ はここでは礼拝行為の向けられる相手を示す。神名 יהוה は普通名詞的な称号に置き換えず、固有名として「ヤハウェ」とした。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に記された四文字神名を固有名として明示し、称号への置き換えを避けた。
- issue: וַיִּשְׁתַּחוּ の身体動作と礼拝的意味
  choice: 礼拝した
  alternative: ヤハウェの前にひれ伏した
  rationale: 神に向けられた行為であるため礼拝的意味を本文で伝えつつ、原語が持つ身体的な「ひれ伏す」という意味も脚注で示し、意味の幅を保った。
translation_notes:
  register: 明快で品位ある現代標準日本語。「すると」で物語の進行を自然に示し、「その人」によって原文の名詞表現を保持した。
