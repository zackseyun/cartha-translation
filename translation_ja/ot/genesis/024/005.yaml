  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ הָ/עֶ֔בֶד אוּלַי֙ לֹא תֹאבֶ֣ה הָֽ/אִשָּׁ֔ה לָ/לֶ֥כֶת אַחֲרַ֖/י אֶל הָ/אָ֣רֶץ הַ/זֹּ֑את הֶֽ/הָשֵׁ֤ב אָשִׁיב֙ אֶת בִּנְ/ךָ֔ אֶל הָ/אָ֖רֶץ אֲשֶׁר יָצָ֥אתָ מִ/שָּֽׁם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/005.yaml
  text: And the servant said to him[a], “Perhaps the woman will not be willing to follow me to this land[b]. Should I then take your son back to the land from which you came?”
translation:
  language: ja
  text: しもべは彼に言った。「もしかすると、その女性は私について[b]この地へ来ることを望まないかもしれません。その場合、あなたが出て来られた地へ、あなたの息子を本当に連れ戻すべきでしょうか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「本当に連れ戻す」の部分で、ヘブライ語は不定詞絶対形と定動詞を重ね、動作を強調している。
    reason: 原文の強調構文を説明するため。
  - marker: b
    text: 直訳「私の後について行って」。
    reason: 原文の方向表現を示すため。
lexical_decisions:
- source_word: הָעֶבֶד
  choice: しもべ
  rationale: アブラハムの家に属し、その権威の下で務める者という関係を簡潔に表す。「奴隷」とも訳せるが、この箇所では任務を託された家僕としての役割が前面に出ている。
- source_word: אוּלַי
  choice: もしかすると
  rationale: 起こり得る事態への懸念を表す語。現代日本語として自然で、発言の慎重な調子も保つ。
- source_word: לֹא תֹאבֶה
  choice: 望まないかもしれません
  rationale: אָבָהが表す意思・同意の欠如を、文脈上の未確定性とともに自然な日本語で示す。
- source_word: הָאִשָּׁה
  choice: その女
  rationale: 原文は単に「その女」と述べ、若さや将来の妻という身分を明示していないため、説明を加えない。
- source_word: לָלֶכֶת אַחֲרַי
  choice: 私について
  rationale: 字義は「私の後について行く」。目的地への同行を自然に表しつつ、しもべの案内に従う含みを保つ。
- source_word: אֶל הָאָרֶץ הַזֹּאת
  choice: この地へ
  rationale: 話し手のいるカナンを指す近称を保ち、אֶרֶץを文脈に合う「地」とした。
- source_word: הֶהָשֵׁב אָשִׁיב
  choice: 本当に連れ戻すべきでしょうか
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「本当に」で示し、疑問接頭辞による伺いの意味を「べきでしょうか」で表す。使役的な文脈により、息子を「連れ戻す」とした。
- source_word: אֶת בִּנְךָ
  choice: あなたの息子
  rationale: 原文どおり、明確かつ簡潔に訳す。
- source_word: אֶל הָאָרֶץ אֲשֶׁר יָצָאתָ מִשָּׁם
  choice: あなたが出て来られたあの地へ
  rationale: יָצָאの「出る」という像を残し、発話地点から離れた出身地を「あの地」で示す。敬語はしもべが主人に語る関係を自然に反映する。
theological_decisions:
- issue: イサクを父祖の地へ移すことが義務なのかという問いの強さ
  choice: 「本当に連れ戻すべきでしょうか」とし、強調された問いとして訳す
  alternative: 「連れ戻しましょうか」
  rationale: 原文の強調構文を保ちながら、命令や必然と断定せず、しもべが指示を求める問いとして残す。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、族長物語にふさわしい落ち着いた語調と、しもべが主人に向ける丁寧さを保った。「しもべ」は聖書叙述で定着した語として用いた。
