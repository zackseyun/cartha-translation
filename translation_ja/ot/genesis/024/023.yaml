  yaml_path: translation/ot/genesis/024/023.yaml
  text: And he said[a], “Whose daughter are you? Please tell me. Is there room in your father’s house for us to spend the night?”
translation:
  language: ja
  text: そして彼は言った。「あなたはどなたの娘ですか。どうか教えてください。あなたの父上の家には、私たちが一晩泊まれる場所がありますか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そして彼は言った
  rationale: 物語を進める接続形として、前節との連続性を保ちつつ自然な日本語にした。
- source_word: בַּת מִי אַתְּ
  choice: あなたはどなたの娘ですか
  rationale: 家族上の身元を尋ねる問いを、丁寧で自然な現代日本語にした。
- source_word: הַגִּידִי נָא לִי
  choice: どうか教えてください
  rationale: נָאによって和らげられた依頼の調子を「どうか」と丁寧形で表した。
- source_word: הֲיֵשׁ
  choice: ありますか
  rationale: 存在を尋ねる疑問を簡潔な日本語で表した。
- source_word: בֵּית אָבִיךְ
  choice: あなたの父上の家
  rationale: 家屋だけでなく父の世帯をも指し得る原語の表現を保ち、「父上」で対話の丁寧さを示した。
- source_word: מָקוֹם
  choice: 場所
  rationale: 宿泊できる空間を意味するが、特定の客室と限定せず、原語の広い意味を保った。
- source_word: לָנוּ
  choice: 私たちが
  rationale: 話者本人と同行者を含む一人称複数を明示した。
- source_word: לָלִין
  choice: 一晩泊まれる
  rationale: 宿泊の文脈における「夜を過ごす」という意味を、明瞭で自然な現代日本語にした。
