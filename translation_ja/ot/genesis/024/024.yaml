    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר אֵלָיו
  choice: 彼女は彼に言った
  rationale: 物語の進行を示す接続形は、日本語では不自然な接続語を補わず、自然な過去形で表した。אֵלָיו は発話の向かう相手を明示するため「彼に」とした。
- source_word: בַּת בְּתוּאֵל אָנֹכִי
  choice: 私はベトエルの娘です
  rationale: 動詞のない同定文と明示された一人称代名詞を、自然で明瞭な現代日本語の名詞述語文で表した。
- source_word: בְּתוּאֵל
  choice: ベトエル
  rationale: 人名を日本語で一般的な聖書表記に従って音写した。
- source_word: בֶּן מִלְכָּה
  choice: ベトエルは、ミルカが…産んだ息子です
  rationale: בֶּן はベトエルを説明する同格表現である。日本語で修飾関係と後続の関係節が曖昧にならないよう、独立した文として自然に表した。
- source_word: מִלְכָּה
  choice: ミルカ
  rationale: 人名を日本語で一般的な聖書表記に従って音写した。
- source_word: אֲשֶׁר יָלְדָה
  choice: ミルカが…産んだ
  rationale: 女性単数形の主語はミルカであり、関係節がベトエルを修飾することを明瞭にした。ילד の出産を表す基本義を「産んだ」で保持した。
- source_word: לְנָחוֹר
  choice: ナホルに
  rationale: 出産定型句における לְ は父親を示す。「ナホルに」は原文の構造を保ちつつ、日本語でも系譜的関係を理解できる表現である。別様の直訳可能性は脚注に示した。
- source_word: נָחוֹר
  choice: ナホル
  rationale: 人名を日本語で一般的な聖書表記に従って音写した。
