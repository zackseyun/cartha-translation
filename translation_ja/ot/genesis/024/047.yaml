base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/047.yaml
  text: Then I asked her[a], saying, ‘Whose daughter are you?’ And she said, ‘The daughter of Bethuel son of Nahor[c][b], whom Milcah bore to him.’ Then I put the ring on her nose and the bracelets on her hands.
translation:
  language: ja
  text: そこで私は彼女に尋ねた。「あなたはどなたの娘ですか。」すると彼女は答えた。「私は、ミルカがナホルに産んだ子ベトエルの娘です。」そこで私は鼻輪[a]を彼女の鼻につけ、腕輪を彼女の両手[b]にはめた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は一般に輪状の装身具を指し得るが、続く「彼女の鼻に」により、ここでは鼻輪であることが示されている。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では字義的に「彼女の手に」。ここで「手」に当たる語は、腕や手首を含む広い範囲を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁאַל אֹתָהּ וָאֹמַר
  choice: そこで私は彼女に尋ねた
  rationale: 直訳すれば「私は彼女に尋ね、言った」だが、日本語では発言によって尋ねる一つの行為として自然に表現した。物語を進める接続辞は「そこで」で示した。
- source_word: בַּת מִי אַתְּ
  choice: あなたはどなたの娘ですか
  rationale: 「誰の娘か」という親族関係を問う原文を、丁寧で自然な現代日本語の直接話法で表した。
- source_word: בַּת בְּתוּאֵל בֶּן נָחוֹר אֲשֶׁר יָלְדָה לּוֹ מִלְכָּה
  choice: 私は、ミルカがナホルに産んだ息子ベトエルの娘です
  rationale: 関係節の先行詞をベトエルと捉え、לּוֹ が指すナホルを日本語で明示した。系譜関係を誤解なく自然に伝える語順とした。
- source_word: הַנֶּזֶם
  choice: その輪
  rationale: נֶזֶם は一般に装身具の輪を指し得るため「輪」とし、続く「鼻に」によってこの箇所での用途を示した。
- source_word: עַל אַפָּהּ
  choice: 彼女の鼻につけ
  rationale: אַף の具体的な意味「鼻」をそのまま保ち、日本語の装着表現として「つけ」を用いた。
- source_word: וְהַצְּמִידִים עַל יָדֶיהָ
  choice: 腕輪を彼女の両腕にはめた
  rationale: צְמִידִים は腕に着ける輪であり、「腕輪」が明快である。יָד は手から腕までを指し得るため、装身具の位置として自然な「両腕」を本文に採用し、字義的な表現は注記した。
