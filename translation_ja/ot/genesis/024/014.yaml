id: GEN.24.14
reference: Genesis 24:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַֽ/נַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֨י/הָ֙ הַטִּי נָ֤א כַדֵּ/ךְ֙ וְ/אֶשְׁתֶּ֔ה וְ/אָמְרָ֣ה שְׁתֵ֔ה וְ/גַם גְּמַלֶּ֖י/ךָ אַשְׁקֶ֑ה אֹתָ֤/הּ הֹכַ֨חְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יִצְחָ֔ק וּ/בָ֣/הּ אֵדַ֔ע כִּי עָשִׂ֥יתָ חֶ֖סֶד עִם אֲדֹנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/014.yaml
  text: And let it be that the young woman to whom I say[a], ‘Please lower your jar so that I may drink,’ and who says, ‘Drink, and I will also water your camels’—let her be the one you have appointed for your servant, for Isaac[c][b]. By her I will know that you have shown steadfast love to my master.
translation:
  language: ja
  text: 私が「どうか、水がめを傾けて、私に飲ませてください」と言う若い女性が、「どうぞお飲みください。あなたのらくだにも水を飲ませましょう」と答えるなら、その女性が、あなたがあなたのしもべイサクのためにお定めになった人でありますように。[a] その女性によって、私は、あなたが私の主人に変わらぬ愛を示してくださったことを知るでしょう。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたのしもべのため、イサクのために」。ヘブライ語は、「あなたのしもべイサク」を同格表現と読むことも、「あなたのしもべ」と「イサク」を別々に受けることもできます。
    reason: alternative_reading
  - marker: b
    text: 別訳「このことで」。ヘブライ語は直訳すると「その女性によって」で、若い女性をしるしとして指していますが、その女性の応答という出来事全体を指すとも理解できます。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: 〜でありますように
  rationale: 祈りの中で願いを述べる文脈を、現代日本語で自然かつ敬意ある祈願表現として示した。
- source_word: הַנַּעֲרָ
  choice: 若い女性
  rationale: 結婚適齢期の若い女性を指す文脈に合い、「少女」より年齢を狭く限定せず、「乙女」ほど古風でもない。
- source_word: הַטִּי נָא כַדֵּךְ
  choice: どうか、水がめを傾けて
  rationale: הטה の「傾ける」という動作と、נָא の丁寧な依頼を明示した。水がめを手の届く位置へ傾ける場面にも自然に合う。
- source_word: וְאֶשְׁתֶּה
  choice: 飲ませてください
  rationale: 直訳的な「私が飲めるように」より、日本語の依頼として自然であり、話者が水を飲む目的を保つ。
- source_word: וְגַם גְּמַלֶּיךָ אַשְׁקֶה
  choice: あなたのらくだにも水を飲ませましょう
  rationale: שׁקה の使役的意味を明確にし、גם の「にも」を保持した。
- source_word: אֹתָהּ הֹכַחְתָּ
  choice: その人こそ、あなたがお定めになった人
  rationale: この文脈のヒフィル形を、しるしを通して選定・指定する意味に取り、「証明した」などの不自然な直訳を避けた。
- source_word: לְעַבְדְּךָ לְיִצְחָק
  choice: あなたのしもべイサクのために
  rationale: 二つ目の לְ が同格の固有名を導くと理解し、イサクを神のしもべとする自然な読みを本文に採用した。二重与格として読む余地は脚注に残した。
- source_word: וּבָהּ אֵדַע
  choice: その人によって…分かります
  rationale: 女性単数接尾辞を明示的に受け、若い女性自身がしるしとなることを表した。状況全体を指す読みも脚注に示した。
- source_word: חֶסֶד
  choice: 変わらぬ愛
  rationale: 忠実さ、慈しみ、好意を含む語の重みを保ちつつ、特定の契約神学用語に狭めない明瞭な現代語とした。
theological_decisions:
- issue: לְעַבְדְּךָ לְיִצְחָק における「あなたのしもべ」の指示対象
  choice: 「あなたのしもべイサク」と同格に読む
  alternative: 祈っているアブラハムのしもべを指し、「あなたのしもべのため、すなわちイサクのために」または二つの与格として読む
  rationale: 文脈上、選ばれる女性はイサクの妻となるので、イサクを指す同格読みが最も自然である。ただしヘブライ語の語順と前置詞の反復には別の統語的理解の余地があるため、脚注で保持した。
- issue: וּבָהּ の指示内容
  choice: 若い女性を指す「その人によって」
  alternative: 出来事またはしるしを指す「このことで」
  rationale: 接尾辞が女性単数で、直前の女性を直接受ける読みを本文に置いた。一方、彼女の応答という出来事全体を指す意味上の理解も可能なので脚注に示した。
- issue: חֶסֶד の訳語
  choice: 変わらぬ愛
  alternative: 慈しみ／親切／真実の愛
  rationale: 神の忠実で恵み深い好意を表しながら、ここで必ずしも明示されていない専門的な契約概念に限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用い、祈りとしての敬意は「〜でありますように」「〜くださった」で表した。「しもべ」は聖書文脈で理解しやすい語として保持し、それ以外は過度に古風な表現を避けた。
