  text: וְ/אַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּ/יָּמִ֑ים וַֽ/יהוָ֛ה בֵּרַ֥ךְ אֶת אַבְרָהָ֖ם בַּ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/001.yaml
  text: Abraham was old[a], advanced in years, and Yahweh had blessed Abraham in all things.
translation:
  language: ja
  text: アブラハムは年老い、高齢であった[a]。ヤハウェは、あらゆる面でアブラハムを祝福しておられた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「日々に入った（来た）」で、高齢であることを表すヘブライ語の慣用句。
    reason: 原文の慣用表現と、その直前の「年老い」との意図的な重なりを示すため。
lexical_decisions:
- source_word: וְ/אַבְרָהָם
  choice: アブラハムは
  rationale: 接続詞וְは新しい叙述単位を導くが、日本語では文脈上、明示的な「さて」や「そして」を置かないほうが自然であり、原文にない時間的意味も加えない。
- source_word: זָקֵן
  choice: 年老い
  rationale: アブラハムが老齢であったことを、簡潔で自然な現代日本語で表す。
- source_word: בָּא בַּיָּמִים
  choice: すでに高齢になっていた[a]
  rationale: 直訳的には「日々の中に入った」という老齢を表す慣用句。直前のזָקֵןとの重なりを保ちつつ、日本語として明瞭にした。
- source_word: וַֽ/יהוָה
  choice: ヤハウェは
  rationale: 固有の神名יהוהを、称号の「主」に置き換えず、音写して示す。
- source_word: בֵּרַךְ
  choice: 祝福しておられた
  rationale: 完了形は、この時点までに与えられ、背景として成立している祝福を表す。神を主語とする自然で品位ある日本語にした。
- source_word: בַּ/כֹּל
  choice: あらゆる点で
  rationale: 祝福が物質面だけに限られず包括的であることを、自然な日本語で表す。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 本文に固有の神名が明記されているため、称号へ置換せず「ヤハウェ」と音写する。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文にある老齢表現の反復を残しつつ、逐語的で不自然な言い回しは脚注で補った。
