  terminology: הַנַּעֲרָはここではリベカを指す若い女性であり、「若い女性」が年齢・性別を保ちつつ、特定の家族関係を追加しない安全な訳です。脚注の「日々」はיָמִיםの逐語訳として不正確なので、「数日、または十〔日〕」とします。
