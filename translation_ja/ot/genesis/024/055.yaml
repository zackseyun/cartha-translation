base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/055.yaml
  text: But her brother and her mother said[a], “Let the young woman stay with us a few days, or ten; after that she may go.”
translation:
  language: ja
  text: しかし、彼女の兄と母は言った。「この若い女性を、数日、あるいは十日ほど、私たちと一緒に滞在させてください。その後、彼女は出発できます。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語を直訳すると「日々、または十」。この表現はおそらく「数日、あるいは十日ほど」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかし、…は言った
  rationale: 接続詞וַは物語を進めるが、前節で僕がすぐに帰らせてほしいと求めたことへの対照があるため、「しかし」が文脈に合う。動詞が単数形なのは複合主語に先行するヘブライ語の一般的な一致である。
- source_word: אָחִיהָ וְאִמָּהּ
  choice: 彼女の兄と母
  rationale: 原文どおり兄を単数とし、語順も保った。
- source_word: תֵּשֵׁב הַנַּעֲרָ אִתָּנוּ
  choice: 娘を…私たちのもとに置いてください
  rationale: ישׁבはここでは滞在する意。日本語では家族が若い女性について相手に猶予を求める発言として、使役的な「置いてください」が自然である。הַנַּעֲרָは文脈上リベカを指すため、家族の発話として自然な「娘」とした。
- source_word: יָמִים אוֹ עָשׂוֹר
  choice: あと数日、十日ほど
  rationale: 直訳は「日々、または十」。期間についての慣用的で省略を含む表現であり、数日ないし十日程度の滞在を求める意味として自然に訳した。ただし構文の曖昧さは脚注で示す。
- source_word: אַחַר תֵּלֵךְ
  choice: その後で行かせましょう
  rationale: אַחַרは時間的な後続を示す。תֵּלֵךְは文脈上若い女性を主語とするが、先の依頼に続く許可・意向のニュアンスを日本語の使役表現で示した。
