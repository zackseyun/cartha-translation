id: GEN.24.27
reference: Genesis 24:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר בָּר֤וּךְ יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲ֠שֶׁר לֹֽא עָזַ֥ב חַסְדּ֛/וֹ וַ/אֲמִתּ֖/וֹ מֵ/עִ֣ם אֲדֹנִ֑/י אָנֹכִ֗י בַּ/דֶּ֨רֶךְ֙ נָחַ֣/נִי יְהוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/027.yaml
  text: And he said[a], “Blessed be Yahweh, the God of my master Abraham, who has not forsaken his steadfast love and his faithfulness from my master. As for me[b], Yahweh has led me on the way to the house of my master’s brothers.”
translation:
  language: ja
  text: そして彼は言った。「私の主人アブラハムの神、ヤハウェがほめたたえられますように。ヤハウェは、私の主人に対する慈しみと誠実[a]をお捨てにならなかった。この私を、ヤハウェは道中、私の主人の兄弟たちの家[b]へ導いてくださった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「慈しみと誠実」は、「変わらぬ愛と真実」とも訳せる。この二語の組み合わせは、忠実な愛と確かさを表すことが多い。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私の主人の兄弟たちの家」。ここで「兄弟たち」は、アブラハムの男性の親族、またはその一族を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: ヤハウェがほめたたえられますように
  rationale: 神への頌栄を表す述語的な祝福定型句。単なる状態描写ではなく、賛美の願いとして自然な現代日本語にした。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神名を日本語で音写した。
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: 私の主人アブラハムの神
  rationale: 連語の関係を明瞭に保ち、僕がアブラハムを『私の主人』と呼ぶ語り口を再現した。
- source_word: חַסְדּוֹ וַאֲמִתּוֹ
  choice: 慈しみと誠実
  rationale: חֶסֶדの忠実で持続的な愛と、אֱמֶתの信頼性・誠実さを、関係的な文脈に即して簡潔に表した。語の幅は脚注に残した。
- source_word: מֵעִם אֲדֹנִי
  choice: 私の主人に対する
  rationale: עזבとの組み合わせが、主人から慈しみと誠実を取り去らず、主人へのそれを捨てなかったことを意味するため、日本語では関係の方向を自然に示した。
- source_word: אָנֹכִי
  choice: この私を
  rationale: 独立代名詞の前置による強調を保ちつつ、後続の動詞の目的語接尾辞『私を』と自然につないだ。
- source_word: בַּדֶּרֶךְ נָחַנִי
  choice: 道中、私を……導いてくださった
  rationale: 旅の途上での神の導きを表す。敬語は、僕による神への賛美という発話状況に即した。
- source_word: בֵּית אֲחֵי אֲדֹנִי
  choice: 私の主人の兄弟たちの家
  rationale: בֵּיתを『家』、אֲחֵיを字義どおり『兄弟たち』としつつ、文脈上の指示範囲は脚注で説明した。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いているため、称号へ置換せず音写した。
- issue: חֶסֶד וֶאֱמֶת の意味合い
  choice: 慈しみと誠実
  alternative: 変わらぬ愛と真実
  rationale: 契約的な忠実さという響きを認めながらも、本文だけで意味を過度に限定せず、愛と信頼性の両面を表す語を選んだ。
- issue: אֲחֵי の範囲
  choice: 兄弟たち
  alternative: 親族
  rationale: 男性複数の親族名称を本文では保持し、それが広く一族を指し得ることを脚注で明示した。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、祈りと賛美にふさわしい品位を保った。僕の発話なので神の行為には自然な敬語を用いたが、古語的な文末や過度に教会的な専門語は避けた。
