  text: וַ/יִּקַּ֣ח הָ֠/עֶבֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִ/גְּמַלֵּ֤י אֲדֹנָי/ו֙ וַ/יֵּ֔לֶךְ וְ/כָל ט֥וּב אֲדֹנָ֖י/ו בְּ/יָד֑/וֹ וַ/יָּ֗קָם וַ/יֵּ֛לֶךְ אֶל אֲרַ֥ם נַֽהֲרַ֖יִם אֶל עִ֥יר נָחֽוֹר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/010.yaml
  text: Then the servant took ten of his master's camels and went[a], with all kinds of good things from his master in his hand. And he arose and went to Aram-naharaim[d][c][b], to the city of Nahor.
translation:
  language: ja
  text: そこで、そのしもべは主人のらくだのうち十頭を取り、主人のあらゆる良い品を携えて[a]出発した。こうして立ち上がり、アラム・ナハライム[b]へ、ナホルの町へ向かった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「主人のあらゆる良い物が彼の手にあった」。主人の財産が彼の管理下にあった、または価値ある贈り物を携えていた、という意味にも取れる。
    reason: lexical_alternative
  - marker: b
    text: 「アラム・ナハライム」は伝統的に「メソポタミア」または「二つの川のアラム」と訳される。
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֶבֶד
  choice: そのしもべ
  rationale: עֶבֶדは「奴隷」「僕」「しもべ」などを意味し得る。ここでは主人から重要な任務を託された家の者として描かれているため、身分を不必要に断定せず、聖書物語として自然で品位のある「しもべ」とした。
- source_word: עֲשָׂרָה גְמַלִּים מִגְּמַלֵּי אֲדֹנָיו
  choice: 主人のらくだのうち十頭
  rationale: 前置詞מִןの部分を表す用法を明確にし、主人が所有するらくだの中から十頭を選んだという意味を自然な日本語で示した。
- source_word: וְכָל טוּב אֲדֹנָיו בְּיָדוֹ
  choice: 主人からのあらゆる良い品を携えて
  rationale: טוּבはここでは抽象的な「善」より、旅に持参した価値ある品々を指す可能性が高い。בְּיָדוֹの「彼の手に」という像を、日本語では携行を表す「携えて」で自然に伝えつつ、所有・管理を表す可能性は脚注に残した。
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: そして立ち上がり、…へ向かった
  rationale: קוםに続くהלךは目的ある行動の開始を表す。「立ち上がり」を残してヘブライ語の物語の運びを保ち、「向かった」で目的地への移動を自然に表現した。
- source_word: אֲרַם נַהֲרַיִם
  choice: アラム・ナハライム
  rationale: 伝統的な「メソポタミア」や語義を訳した「二つの川のアラム」に置き換えず、ヘブライ語の地名を音写して同定上の余地を保った。
- source_word: עִיר נָחוֹר
  choice: ナホルの町
  rationale: 連語を自然に訳した。ナホル本人の所有・建設を断定せず、ナホルと関係する町という原文の幅を保つ。
