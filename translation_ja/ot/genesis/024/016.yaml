source:
  edition: WLC
  text: וְ/הַֽ/נַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה וְ/אִ֖ישׁ לֹ֣א יְדָעָ֑/הּ וַ/תֵּ֣רֶד הָ/עַ֔יְנָ/ה וַ/תְּמַלֵּ֥א כַדָּ֖/הּ וַ/תָּֽעַל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/016.yaml
  text: The young woman was very beautiful in appearance[a], a virgin; no man had known her. She went down to the spring, filled her jar[b], and came up.
translation:
  language: ja
  text: その若い女性は、容姿が非常に美しく、処女であり、男性と性的関係を持ったことがなかった[a]。彼女は泉[b]へ下り、水がめを満たして、上って行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「男は彼女を知らなかった」。ここで「知る」は性的関係を表す婉曲表現。
    reason: 原文の婉曲表現と字義を示すため。
  - marker: b
    text: 「泉」と訳したヘブライ語は、水の湧き出る所を指す。「井戸」と訳されることもある。
    reason: 地形語の訳語の幅を示すため。
lexical_decisions:
- source_word: הַנַּעֲרָ
  choice: その若い女性
  rationale: 結婚年齢にある若い女性を指す語。現代日本語で自然かつ年齢を幼く限定しすぎない「若い女性」とした。定冠詞は文脈を受ける「その」で表した。
- source_word: טֹבַת מַרְאֶה מְאֹד
  choice: 容姿がたいそう美しく
  rationale: 外見の美しさを強く述べる表現。「容姿」によって מַרְאֶה の外見への焦点を保ち、מְאֹד を「たいそう」で表した。
- source_word: בְּתוּלָה
  choice: 処女
  rationale: 物語のこの文脈では、性的関係を経験していない女性を直接指す語として「処女」が最も明確である。
- source_word: וְאִישׁ לֹא יְדָעָהּ
  choice: 男と関係を持ったことがなかった
  rationale: 「知る」は性的関係を婉曲に表すヘブライ語用法。日本語で「男を知る」と直訳すると意味が不自然または不明瞭になりやすいため、節度を保ちつつ意味の分かる表現とした。直訳は脚注に示した。
- source_word: הָעַיְנָה
  choice: 泉へ
  rationale: עַיִן はここでは水の湧き出る場所を指し、「井戸」より「泉」が原語に正確である。方向を示す語尾を「へ」で表した。
- source_word: כַדָּהּ
  choice: 水がめ
  rationale: 水をくむための容器であることが日本語読者に自然に伝わる「水がめ」とした。所有は主語と文脈から明らかなため、冗長な「彼女の」を置かなかった。
- source_word: וַתָּעַל
  choice: 上って来た
  rationale: 直前の「下り」と対をなし、泉から高い所へ戻る空間的な動きを保った。
theological_decisions:
- issue: 「男が彼女を知らなかった」という性的婉曲表現
  choice: 本文では「男と関係を持ったことがなかった」と意味を明示し、脚注で字義を示す
  alternative: 「男は彼女を知らなかった」と直訳する
  rationale: 処女性を重ねて強調する原文の意味を明瞭にしながら、原文の婉曲表現も脚注によって保持する。特定の教派的解釈は加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語文としての品位と簡潔さを保った。「たいそう」「水がめ」はやや格調を持ちながら一般読者にも理解しやすい。原文に明示的な「さて」「今や」に当たる語がないため、不要な談話標識は加えていない。
