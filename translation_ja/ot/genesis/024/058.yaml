  text: וַ/יִּקְרְא֤וּ לְ/רִבְקָה֙ וַ/יֹּאמְר֣וּ אֵלֶ֔י/הָ הֲ/תֵלְכִ֖י עִם הָ/אִ֣ישׁ הַ/זֶּ֑ה וַ/תֹּ֖אמֶר אֵלֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/058.yaml
  text: So they called Rebekah and said to her, “Will you go with this man?” And she said, “I will go.”
translation:
  language: ja
  text: そこで彼らはリベカを呼んで、「あなたはこの人と一緒に行きますか」と尋ねた。リベカは、「行きます」と答えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְאוּ לְרִבְקָה
  choice: 彼らはリベカを呼んで
  rationale: קרא はここでは話し合いの場に呼ぶ意。日本語の「呼ぶ」は自然であり、「呼び寄せる」ほど強い含意を加えない。人名 רִבְקָה は日本語聖書で広く定着した「リベカ」とした。
- source_word: וַיֹּאמְרוּ אֵלֶיהָ
  choice: 尋ねた
  rationale: 原語は直訳すれば「彼女に言った」だが、直後に疑問文が続くため、現代日本語の自然な会話叙述として「尋ねた」とした。発話内容は直接引用で保持している。
- source_word: הֲתֵלְכִי
  choice: あなたは…行きますか
  rationale: הלך の単純な「行く」を保ち、原文に明示されない「行く気がありますか」という意志性を過度に補わない表現とした。
- source_word: עִם הָאִישׁ הַזֶּה
  choice: この人と一緒に
  rationale: אִישׁ はここで「人／男」。指示対象はアブラハムの僕だが、原文は「僕」と呼ばないため、それを補わず「この人」とした。「この男」よりも会話として自然で中立的である。
- source_word: וַתֹּאמֶר אֵלֵךְ
  choice: リベカは、「行きます」と答えた
  rationale: אֵלֵךְ は一人称の簡潔な決意表明。「行きます」は日本語で主語「私は」を自然に省きつつ、明確な応答を伝える。וַתֹּאמֶר は原義上「言った」だが、質問への返答なので「答えた」が自然である。
theological_decisions: []
