lexical_decisions:
- source_word: וַתִּשָּׂא רִבְקָה אֶת־עֵינֶיהָ
  choice: リベカは目を上げて
  rationale: 「目を上げる」というヘブライ語の表現を保ちつつ、現代日本語でも自然に理解できる形とした。
- source_word: וַתֵּרֶא אֶת־יִצְחָק
  choice: イサクを見ると
  rationale: ראהの基本義である視覚的認知を「見る」で直接表した。連続する動作が自然に流れるよう、文脈上の接続を「すると」で示した。
- source_word: וַתִּפֹּל מֵעַל הַגָּמָל
  choice: らくだから降りた
  rationale: נפלは通常「落ちる」を意味するが、ここでは事故的な落下ではなく、らくだから下りる動作を表す慣用的用法と考えられるため、本文では自然で明瞭な「降りた」とした。字義的表現は脚注に残した。
