  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יהוָ֞ה בֵּרַ֧ךְ אֶת אֲדֹנִ֛/י מְאֹ֖ד וַ/יִּגְדָּ֑ל וַ/יִּתֶּן ל֞/וֹ צֹ֤אן וּ/בָקָר֙ וְ/כֶ֣סֶף וְ/זָהָ֔ב וַ/עֲבָדִם֙ וּ/שְׁפָחֹ֔ת וּ/גְמַלִּ֖ים וַ/חֲמֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/035.yaml
  text: And Yahweh has greatly blessed my master[a], and he has become great. He has given him flocks and herds, silver and gold, male servants and female servants, camels and donkeys.
translation:
  language: ja
  text: 'ヤハウェは私の主人を大いに祝福され、主人は大いに栄えられました。ヤハウェは主人に、羊や山羊の群れ、牛の群れ、銀、金、男の召し使いと女の召し使い[a]、らくだ、ろばをお与えになりました。


    [a] 「男の奴隷と女の奴隷」とも訳せる。ヘブライ語の語は、文脈によって家の使用人または奴隷を指す。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「男の奴隷と女の奴隷」とも訳せる。ヘブライ語の語は、文脈によって家の使用人または奴隷を指す。
    reason: עֲבָדִם と שְׁפָחֹת は、家内の使用人を指す場合も奴隷を指す場合もあるため。
lexical_decisions:
- source_word: יהוה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を、本文の直接的な用法に従って音写した。
- source_word: בֵּרַךְ ... מְאֹד
  choice: 大いに祝福され
  rationale: 動詞「祝福する」と強意の副詞「非常に、大いに」を自然な現代日本語で表した。神への敬意を示すため尊敬表現を用いた。
- source_word: אֲדֹנִי
  choice: 私の主人
  rationale: ここでは僕が人間の主人アブラハムを指しており、神的称号ではない。
- source_word: וַיִּגְדָּל
  choice: 大いなる者となりました
  rationale: 富だけに限定せず、財産・地位・勢力の増大を含み得る「大きくなる」という原語の幅を保った。
- source_word: צֹאן וּבָקָר
  choice: 羊や山羊の群れ、牛の群れ
  rationale: צֹאן は羊と山羊を含む小家畜の集合語、בקר は牛類の集合語であるため、現代の読者に明確な形で訳した。
- source_word: כֶסֶף וְזָהָב
  choice: 銀、金
  rationale: 貨幣一般に抽象化せず、原語が示す貴金属をそのまま訳した。
- source_word: עֲבָדִם וּשְׁפָחֹת
  choice: 男の召し使いと女の召し使い
  rationale: 男女の区別を保ちつつ、語が召し使いにも奴隷にもなり得るため、本文では中立的な表現を採用し、より強い別訳を脚注に示した。
- source_word: גְמַלִּים וַחֲמֹרִים
  choice: らくだ、ろば
  rationale: 二種の家畜を簡潔で一般的な現代日本語にした。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 本文に固有名が明記されているため、その固有性を保持する音写を選んだ。
- issue: עֲבָדִם / שְׁפָחֹת の社会的身分
  choice: 本文では「男の召し使いと女の召し使い」
  alternative: 「男の奴隷と女の奴隷」
  rationale: 所有財産の列挙という文脈は奴隷の可能性を強く残すが、語自体は家内奉公人も指し得る。本文で一方に断定せず、脚注で別訳を明示した。
- issue: וַיִּגְדָּל が示す繁栄の範囲
  choice: 大いなる者となりました
  alternative: 「豊かになりました」
  rationale: 文脈上は富の増大が中心だが、原語は地位や勢力を含む広い「大きさ」を表し得るため、富だけに狭めなかった。
translation_notes:
  register: 明快で品位のある現代標準日本語。語り手である僕の丁寧な報告調を保ち、神の行為には尊敬表現を用いた。
