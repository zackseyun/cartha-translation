  text: וְ/יִצְחָק֙ בָּ֣א מִ/בּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י וְ/ה֥וּא יוֹשֵׁ֖ב בְּ/אֶ֥רֶץ הַ/נֶּֽגֶב׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/062.yaml
  text: Isaac had come from Beer-lahai-roi[b][a], and he was dwelling in the land of the Negev.
translation:
  language: ja
  text: イサクはベエル・ラハイ・ロイ[b]から来ていた[a]。彼はネゲブの地に住んでいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「イサクはベエル・ラハイ・ロイから来た」。ヘブライ語の構文は、先に完了していた出来事とも、単純な過去の出来事とも理解できる。
    reason: lexical_alternative
  - marker: b
    text: ベエル・ラハイ・ロイは、先にハガルとの関わりで登場した地名（創世記16章14節参照）。
    reason: cross_reference
lexical_decisions:
- source_word: בָּא מִבּוֹא
  choice: から帰って来ていた
  rationale: 完了形 בָּא と、前置詞 מִן を伴う不定詞 בּוֹא の圧縮された構文を、直前の出来事より前に完了していた移動として自然な日本語で表した。文脈上は「帰って」とするのが自然だが、単に「来た」とする理解も可能であるため脚注を付した。
- source_word: בְּאֵר לַחַי רֹאִי
  choice: ベエル・ラハイ・ロイ
  rationale: 地名として翻訳せず、ヘブライ語の複合名を中黒で区切って音写した。
- source_word: יוֹשֵׁב
  choice: 住んでいた
  rationale: 分詞が示す継続的な居住状態を、現代日本語で自然に表した。
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: ネゲブの地に
  rationale: אֶרֶץ を「地」、地理的名称 נֶגֶב を「ネゲブ」とし、原文の地理表現を保持した。
- source_word: וְהוּא
  choice: 彼は
  rationale: 明示された代名詞を訳し、背景的な居住状況を独立した文として自然に提示した。接続詞は日本語では省くほうが自然であり、意味上の連続性は保たれる。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の二つの節は、日本語で読みやすいよう二文に分けた。過去完了に相当する前後関係は「来ていた」で示し、地名と地域名は一般的な音写を用いた。
