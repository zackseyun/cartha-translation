base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/028.yaml
  text: Then the young woman ran and told her mother's household about these things[a].
translation:
  language: ja
  text: そこで、その若い女性は走って、母の家[a]の者たちにこれらのことを告げた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「母の家に」。ヘブライ語の表現は、母の住む家そのものを指すことも、その家に属する家族や家の者を指すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּרָץ
  choice: 走って行き
  rationale: 語根 רוץ は速く走ることを表す。日本語の物語として移動の方向も自然に伝わるよう「走って行き」とした。
- source_word: הַנַּעֲרָ
  choice: 若い女
  rationale: נַעֲרָה は若い女性を指す。「少女」では年少の印象が強くなり得るため、文脈上のリベカにふさわしい明瞭な表現とした。
- source_word: וַתַּגֵּד
  choice: 告げた
  rationale: נגד のヒフィル形で、知らせる、語り伝える意。「告げた」は簡潔で品位ある現代日本語である。
- source_word: לְבֵית אִמָּהּ
  choice: 母の家の者たちに
  rationale: בַּיִת は建物としての家と、そこに属する家族・家の者の双方を表し得る。告げる相手を自然に示しつつ、原語の「家」とのつながりも保った。
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: これらのことを
  rationale: דְּבָרִים は「言葉」「事柄」の双方を意味し得る。ここでは直前の出来事を伝える文脈なので、「これらのこと」が自然である。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語文として簡潔かつ品位ある調子にした。「母の家」が持つ場所と家族集団の両義性は本文と脚注で保持した。
