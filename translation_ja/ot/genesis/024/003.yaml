- from: 私はあなたに、天の神、地の神であるヤハウェにかけて誓わせる。私がその中に住んでいるカナン人の娘たちから、私の息子の妻を迎えてはならない、と。
  to: 私はあなたに、天の神、地の神であるヤハウェにかけて、私がその中に住んでいるカナン人の娘たちから私の息子のために妻を迎えないと誓わせる。
  rationale: 誓わせる内容を一文に統合し、原文の誓約構文を自然な日本語で明示しました。「私の息子のために妻を」として、息子が妻を迎えることを表す原文の意味を明確にしました。それ以外の神名、神の称号の反復、カナン人の娘たち、および話者が彼らの中に住むという表現は維持しています。
