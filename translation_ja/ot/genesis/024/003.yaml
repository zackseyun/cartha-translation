source:
  edition: WLC
  text: וְ/אַשְׁבִּ֣יעֲ/ךָ֔ בַּֽ/יהוָה֙ אֱלֹהֵ֣י הַ/שָּׁמַ֔יִם וֵֽ/אלֹהֵ֖י הָ/אָ֑רֶץ אֲשֶׁ֨ר לֹֽא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּ/קִרְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/003.yaml
  text: and I will make you swear by Yahweh[a], the God of heaven and the God of the earth, that you shall not take a wife for my son from the daughters of the Canaanites, among whom I dwell.
translation:
  language: ja
  text: 私はあなたに、天の神、地の神であるヤハウェにかけて、私がその中に住んでいるカナン人の娘たちから私の息子のために妻を迎えないと誓わせる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַשְׁבִּיעֲךָ
  choice: 私はあなたに……誓わせる
  rationale: שׁבעのヒフィル形が持つ使役の意味を保ち、話者が相手に誓約させることを明確にした。
- source_word: בַּיהוָה
  choice: ヤハウェにかけて
  rationale: 前置詞בְּは誓いの対象を示すため「にかけて」とし、神名יהוהは固有名として「ヤハウェ」と表記した。
- source_word: אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ
  choice: 天の神、地の神
  rationale: 原文が「神」を二度繰り返す並行表現を圧縮せずに保った。「天」と対になるהָאָרֶץは宇宙的範囲を示すため「地」とした。
- source_word: אֲשֶׁר לֹא תִקַּח
  choice: 迎えてはならない、と
  rationale: 誓いの内容を示す節として、禁止の厳粛さを自然な現代日本語で表した。文末の「と」によって「誓わせる」に結び付く内容であることを明示した。
- source_word: אִשָּׁה לִבְנִי
  choice: 私の息子の妻
  rationale: 婚姻の文脈におけるאִשָּׁהを単なる「女」ではなく「妻」と訳した。תִקַּחとの組み合わせは日本語として自然な「妻を迎える」とした。
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: カナン人の娘たちから
  rationale: 民に属する女性を指すヘブライ語の「娘たち」という比喩を保持しつつ、民族名を「カナン人」と明確にした。
- source_word: אֲשֶׁר אָנֹכִי יוֹשֵׁב בְּקִרְבּוֹ
  choice: 私がその中に住んでいる
  rationale: יוֹשֵׁבの継続的な居住と、集合体としてのカナン人のただ中にいるという意味を簡潔に表した。
theological_decisions:
- issue: 神名יהוהの表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文にある四文字神名を称号に置き換えず、固有名として一般的な学術的転写に基づき表記した。
translation_notes:
  register: 明瞭で厳粛な現代標準日本語とした。原文の語順と反復をできるだけ保ちながら、誓いの内容が日本語でも誤解なく「誓わせる」に係るよう句読法を整えた。
