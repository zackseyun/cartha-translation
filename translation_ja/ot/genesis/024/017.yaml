  text: The servant ran to meet her and said[a], “Please let me drink a little water from your jar.”
translation:
  language: ja
  text: しもべは彼女のところへ走って行き、言った。「どうか、あなたの水がめから水を少し飲ませてください[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「どうか、あなたの水がめから水を少しください」。ヘブライ語の命令形は、「飲ませてください」とも「水をください」とも表せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: 走り寄って
  rationale: רוץの「走る」という動作と、後続のלִקְרָאתָהּが示す彼女に向かう動きを、自然な日本語の物語表現で一体的に表した。
- source_word: הָעֶבֶד
  choice: しもべ
  rationale: עֶבֶדには「奴隷」と「しもべ」の意味域があるが、ここではアブラハムから使命を託された家の者としての役割が前面に出ているため、「しもべ」とした。
- source_word: לִקְרָאתָהּ
  choice: 彼女に……寄って
  rationale: קראתを伴うלは、相手に向かい、会おうとする動きを表す。「彼女に走り寄って」はその方向性を簡潔かつ自然に伝える。
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ヘブライ語物語文の標準的な発話導入として、現代日本語で自然な「言った」とした。
- source_word: הַגְמִיאִינִי
  choice: 飲ませてください
  rationale: גמאのヒフィル命令形に一人称単数接尾辞が付き、「私に飲ませてほしい」という丁寧な依頼を表す。別解の「水をください」も脚注に残した。
- source_word: נָא
  choice: どうか
  rationale: 依頼を和らげ、懇願の調子を添えるנָאを、品位ある自然な日本語の「どうか」で表した。
- source_word: מְעַט מַיִם
  choice: 水を少し
  rationale: מְעַטの少量という意味を保ち、控えめな依頼であることが伝わる自然な語順とした。
- source_word: מִכַּדֵּךְ
  choice: あなたの水がめから
  rationale: כַּדは水をくむためのかめ・つぼを指すため「水がめ」とし、女性単数二人称接尾辞を「あなたの」で明示した。
