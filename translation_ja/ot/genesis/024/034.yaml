  yaml_path: translation/ot/genesis/024/034.yaml
  text: And he said[a], “I am Abraham’s servant.”
translation:
  language: ja
  text: 彼は言った。「私はアブラハムのしもべです[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私はアブラハムの奴隷です」。
    reason: ヘブライ語 עֶבֶד は、文脈により「しもべ」とも「奴隷」とも訳しうるため。
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: 彼は言った
  rationale: 物語を進める接続形である。日本語では接続詞を補わず、「彼は言った」とすることで、文脈に沿った簡潔で自然な叙述とした。
- source_word: עֶבֶד
  choice: しもべ
  rationale: この語は「しもべ」「奴隷」の両義を持ちうる。ここではアブラハムの家における自分の立場を礼儀正しく名乗っているため、本文では「しもべ」とし、拘束された身分を明示する訳語「奴隷」は脚注に示した。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 日本語聖書で広く定着している表記を用いた。
- source_word: אָנֹכִי
  choice: 私は…です
  rationale: 独立人称代名詞による明示的な自己紹介を、自然な現代日本語の名詞述語文で表した。
