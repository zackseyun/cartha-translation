id: GEN.24.7
reference: Genesis 24:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֣י הַ/שָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜/נִי מִ/בֵּ֣ית אָבִ/י֮ וּ/מֵ/אֶ֣רֶץ מֽוֹלַדְתִּ/י֒ וַ/אֲשֶׁ֨ר דִּבֶּר לִ֜/י וַ/אֲשֶׁ֤ר נִֽשְׁבַּֽע לִ/י֙ לֵ/אמֹ֔ר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכ/וֹ֙ לְ/פָנֶ֔י/ךָ וְ/לָקַחְתָּ֥ אִשָּׁ֛ה לִ/בְנִ֖/י מִ/שָּֽׁם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/007.yaml
  text: Yahweh[a], the God of heaven, who took me from my father's house and from the land of my birth, and who spoke to me and who swore to me, saying, ‘To your offspring I will give this land’—he will send his angel before you, and you shall take a wife for my son from there.
translation:
  language: ja
  text: 天の神ヤハウェは、私を父の家と生まれた地から連れ出し、私に語り、『あなたの子孫にこの地を与える』と言って私に誓われた方だ。その方は御使い[a]をあなたの前に遣わしてくださる。あなたはそこから、私の息子のために妻を迎えるのだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「使者」。ヘブライ語 מַלְאָךְ は「使者」と「御使い」のどちらも意味し得るが、ここでは天の使者を指す可能性が高い。
    reason: 語義上の選択肢
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の四文字神名を一般的な日本語音写で表した。
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: 天の神
  rationale: 構文上の属格関係を保ちつつ、現代日本語として自然で荘重な表現とした。
- source_word: לְקָחַנִי
  choice: 私を…連れ出し
  rationale: לקחの基本義「取る」を文脈に即して表し、アブラハムが以前の場所から導き出された動きを明確にした。
- source_word: מִבֵּית אָבִי
  choice: 父の家から
  rationale: 家族・家系・家の共同体を含み得る原語表現を過度に限定せず、字義に近く訳した。
- source_word: וּמֵאֶרֶץ מוֹלַדְתִּי
  choice: 生まれ故郷から
  rationale: מוֹלֶדֶתが出生地、故郷、親族圏を指し得る中で、土地を示す אֶרֶץ と自然につながる表現を選んだ。
- source_word: דִּבֶּר לִי
  choice: 私に語り
  rationale: 後続内容を先取りして「約束した」とせず、動詞の単純な意味を保持した。
- source_word: נִשְׁבַּע לִי
  choice: 私に誓われた
  rationale: 誓約を表す受動語幹の意味を、敬意を備えた自然な日本語で示した。
- source_word: לְזַרְעֲךָ
  choice: あなたの子孫に
  rationale: זֶרַעの集合的単数の意味を、現代日本語で分かりやすい「子孫」によって表した。
- source_word: אֶתֵּן אֶת הָאָרֶץ הַזֹּאת
  choice: この地を与える
  rationale: 土地を与えるという約束の内容を簡潔に保持した。
- source_word: הוּא
  choice: その方が
  rationale: 明示された代名詞の強調を、日本語では話題を受け直す「その方が」によって表した。
- source_word: יִשְׁלַח מַלְאָכוֹ לְפָנֶיךָ
  choice: 御使いをあなたの前に遣わし
  rationale: מַלְאָךְは使者一般を意味し得るが、神が遣わす天的な使者という文脈に最も合う「御使い」を本文に採用した。「あなたの前に」は לְפָנֶיךָ を近く反映する。
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: あなたは…私の息子のために妻を迎えることになる
  rationale: 妻を得るという委任の達成を表す構文として、現代日本語で誤解の少ない「妻を迎える」を用い、文脈上の確信を「ことになる」で示した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文が称号ではなく四文字神名を用いているため、固有名として音写し、契約の神の名を保持した。
- issue: מַלְאָכוֹ が指す存在
  choice: 御使い
  alternative: 使者
  rationale: 語そのものには人間の使者と天的な使者の両義があるが、神による超自然的な先導を語る文脈では天的な御使いがより自然である。ただし実在する語義上の幅は脚注に残した。
- issue: וְלָקַחְתָּ のニュアンス
  choice: 妻を迎えることになる
  alternative: 妻を迎えなさい／妻を迎えるだろう
  rationale: 命令としてだけに固定せず、神の先導に基づく将来の成就への確信を含む連続した完了形のニュアンスを保つようにした。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の発言と誓約にふさわしい品位を保った。「取る」の直訳が結婚相手を物のように扱う印象を与えないよう、「妻を迎える」とした。長いヘブライ語の関係節は二文に分け、明晰さを確保しながら הוּא の強調を「その方が」で保持した。
