revisions:
- from: 天の神ヤハウェは、私を父の家と生まれ故郷から連れ出し、私に語り、また、『あなたの子孫にこの地を与える』と私に誓われた方だ。その方が御使い[a]をあなたの前に遣わし、あなたはそこから私の息子のために妻を迎えることになる。
  to: 天の神ヤハウェは、私を父の家と生まれた地から連れ出し、私に語り、『あなたの子孫にこの地を与える』と言って私に誓われた方だ。その方は御使い[a]をあなたの前に遣わしてくださる。あなたはそこから、私の息子のために妻を迎えるのだ。
  rationale: 神が御使いを遣わす未来の保証を独立した文で明示し、続く文でしもべが果たすべき委任を「迎えるのだ」と表した。これにより、原文の未来的・確信的な流れを保ちながら、命令のみまたは単なる偶発的な成り行きに限定しない。「生まれた地」は原文の土地としての表現を明瞭に反映する。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:17:27Z'
