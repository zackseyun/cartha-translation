source:
  edition: WLC
  text: וְ/אִם לֹ֨א תֹאבֶ֤ה הָֽ/אִשָּׁה֙ לָ/לֶ֣כֶת אַחֲרֶ֔י/ךָ וְ/נִקִּ֕יתָ מִ/שְּׁבֻעָתִ֖/י זֹ֑את רַ֣ק אֶת בְּנִ֔/י לֹ֥א תָשֵׁ֖ב שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/008.yaml
  text: But if the woman is not willing to go after you[a], then you will be free from this oath of mine[b]; only you must not take my son back there.
translation:
  language: ja
  text: しかし、もしその女性があなたについて行くことを望まないなら[a]、あなたはこの私の誓いから解かれる[b]。ただし、私の息子をそこへ連れ戻してはならない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「あなたと一緒に行くことを望まないなら」。直訳は「あなたの後について行くことを望まないなら」。
    reason: lexical_alternative
  - marker: b
    text: または「あなたはこの私の誓いから免除される」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם לֹא תֹאבֶה הָאִשָּׁה
  choice: しかし、もしその女が……ことを望まないなら
  rationale: 条件を導く וְאִם の文脈上の対照を「しかし、もし」で表し、לא אבה の意志・同意の含みを、拒絶と強めすぎない「望まない」で訳した。האשה はまだ特定されていない結婚相手候補なので「その女」とした。
- source_word: לָלֶכֶת אַחֲרֶיךָ
  choice: あなたについて行く
  rationale: 字義的には「あなたの後について行く」。日本語では旅行への同行を自然に表しつつ、原文の「後に」のイメージも残せる。
- source_word: וְנִקִּיתָ מִשְּׁבֻעָתִי זֹאת
  choice: あなたは私にしたこの誓いから解かれる
  rationale: נקה のニファル形が示す義務からの免除を「解かれる」で表現した。接尾辞の「私の」は、日本語で誓いの相手を明確にする「私にした」とした。זאת の指示性は「この」に保持した。
- source_word: רַק
  choice: ただし
  rationale: 誓いから解かれる場合にも残る強い制限を、現代日本語で明確な「ただし」で示した。
- source_word: אֶת־בְּנִי לֹא תָשֵׁב שָׁמָּה
  choice: 私の息子をそこへ連れ戻してはならない
  rationale: שוב のヒフィル形の使役的意味を「連れ戻す」で表し、לא の禁止を「てはならない」とした。שמה は「そこへ」と明示した。
theological_decisions: []
