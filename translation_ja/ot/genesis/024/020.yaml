base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/020.yaml
  text: She quickly emptied her jar into the trough[a], and ran again to the well to draw water, and drew for all his camels.
translation:
  language: ja
  text: 彼女は急いで水がめの水を水槽に注ぎ出すと、また井戸へ走って水をくみ、彼のすべてのらくだのために水をくんだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: 彼女は急いで
  rationale: 急いで行動することを表す動詞なので、迅速で自発的な動きを自然な現代日本語で示した。
- source_word: וַתְּעַר כַּדָּהּ
  choice: かめの水を…あけると
  rationale: ערהは器の中身をあける、注ぎ出す意。日本語では容器そのものではなく中の水を「あける」とするのが自然で、動作も明確になる。
- source_word: כַּדָּהּ
  choice: かめ
  rationale: כדは水を運ぶためのつぼ・水がめを指す。物語の時代背景に合い、一般読者にも分かりやすい「かめ」とした。
- source_word: הַשֹּׁקֶת
  choice: 水飲み場
  rationale: 家畜に水を飲ませるための水槽・おけを指す。直後のらくだとの関係が明瞭になる自然な語を選んだ。
- source_word: וַתָּרָץ עוֹד
  choice: また…走って
  rationale: רץの「走る」とעודの反復の意味をともに保った。
- source_word: הַבְּאֵר
  choice: 井戸
  rationale: בארの通常の意味を文脈どおりに訳した。
- source_word: לִשְׁאֹב
  choice: 水をくみ
  rationale: 井戸から水をくむ動作であることを、日本語として自然に明示した。
- source_word: וַתִּשְׁאַב
  choice: 水をくんだ
  rationale: 原文が水くみの動作を再度明示しているため、省略せず訳出した。
- source_word: לְכָל גְּמַלָּיו
  choice: 彼のすべてのらくだのために
  rationale: כלの全体性と、לְが示す受益関係を保った。所有者は直前の物語に登場する男性を指すため「彼」とした。
