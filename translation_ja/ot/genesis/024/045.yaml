source:
  edition: WLC
  text: אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְ/דַבֵּ֣ר אֶל לִבִּ֗/י וְ/הִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְ/כַדָּ֣/הּ עַל שִׁכְמָ֔/הּ וַ/תֵּ֥רֶד הָ/עַ֖יְנָ/ה וַ/תִּשְׁאָ֑ב וָ/אֹמַ֥ר אֵלֶ֖י/הָ הַשְׁקִ֥י/נִי נָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/045.yaml
  text: Before I had finished speaking in my heart[a], behold, Rebekah came out with her jar on her shoulder, and she went down to the spring and drew water. Then I said to her[b], ‘Please give me a drink.’
translation:
  language: ja
  text: 私が心の中で語り終えないうちに[a]、すると、リベカが水がめを肩に載せて出て来た。彼女は泉[b]へ下って水をくんだ。そこで私は彼女に、「どうか、水を飲ませてください」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「私の心に向かって語り終えないうちに」。内なる言葉、または心の中の祈りを表す言い回し。
    reason: lexical_alternative
  - marker: b
    text: 「泉」と訳したヘブライ語は、水が湧き出る場所を指す。通常「井戸」と訳される語とは異なる。
    reason: lexical_alternative
lexical_decisions:
- source_word: טֶרֶם אֲכַלֶּה
  choice: 私が……語り終えないうちに
  rationale: 未完了の行為を基準時より前に置く טֶרֶם の時間的意味を、自然な現代日本語で表した。
- source_word: לְדַבֵּר אֶל־לִבִּי
  choice: 心の中で語る
  rationale: 字義は「私の心に向かって語る」。内なる思いや祈りのどちらかに限定せず、ヘブライ語の比喩を理解しやすい形で保った。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 突然の出来事を生き生きと提示する談話上の働きを、現代日本語の自然な驚きの表現で再現した。
- source_word: רִבְקָה
  choice: リベカ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: יֹצֵאת
  choice: 出て来た
  rationale: הִנֵּה に続く分詞の、目の前に現れるような即時的・生動的な語感を簡潔に表した。
- source_word: כַדָּהּ
  choice: 水がめ
  rationale: כַּד は水をくむためのかめを指す。文脈上の用途が明瞭になる、自然な日本語を選んだ。
- source_word: עַל־שִׁכְמָהּ
  choice: 肩に載せて
  rationale: 位置関係を自然な現代日本語で表現した。
- source_word: וַתֵּרֶד הָעַיְנָה
  choice: 泉へ下って
  rationale: עַיִן は通常の「井戸」を表す בְּאֵר とは異なり、湧き出る泉を指すため、その区別を保った。
- source_word: וַתִּשְׁאָב
  choice: 水をくんだ
  rationale: 動詞に含まれる「水をくむ」という意味を、日本語で明示して自然にした。
- source_word: הַשְׁקִינִי נָא
  choice: どうか、私に飲ませてください
  rationale: 使役形の命令「私に飲ませよ」と依頼を和らげる נָא の双方を反映した。
theological_decisions:
- issue: 「心に向かって語る」が内的な思考か祈りか
  choice: 「心の中で語る」とし、どちらにも限定しない
  alternative: 「心の中で祈る」または「心の中で考える」
  rationale: 文脈上は祈りが強く示唆されるが、この節の表現自体は「祈る」と明示していないため、原文の含みを保った。
translation_notes:
  register: 明瞭で現代的な標準語を基調としつつ、語りの品位を保った。「なんと」で וְהִנֵּה の生き生きとした提示を表し、内的発話と祈りの曖昧さ、および「泉」と「井戸」の語彙上の区別を保持した。
