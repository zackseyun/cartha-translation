base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/054.yaml
  text: Then he and the men who were with him ate and drank[a], and they spent the night there. When they arose in the morning, he said, “Send me away to my master.”
translation:
  language: ja
  text: 彼と同行の者たちは食べたり飲んだりして、そこで一夜を過ごした。朝、一同が起きると、彼は言った。「私を主人のもとへ送り出してください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: 食べて飲み
  rationale: 二つの基本的な叙述動詞を簡潔に保ち、宴食の場面を自然な現代日本語で表した。
- source_word: הוּא וְהָאֲנָשִׁים אֲשֶׁר עִמּוֹ
  choice: 彼と、彼と一緒にいた人々
  rationale: 明示された代名詞と同行者の集団をそのまま示す。「彼」は文脈上アブラハムのしもべを指す。
- source_word: וַיָּלִינוּ
  choice: その夜はそこに泊まった
  rationale: לון/לין の「夜を過ごす、泊まる」という意味を自然に表し、場面の場所も文脈に即して示した。
- source_word: וַיָּקֻמוּ בַבֹּקֶר
  choice: 朝になって一同が起きると
  rationale: 複数主語を明確にしつつ、翌朝の発言へ続く物語の流れを自然な従属節で表した。
- source_word: שַׁלְּחֻנִי
  choice: 私を…帰らせてください
  rationale: 命令形の依頼を、日本語の対人場面にふさわしい丁寧な依頼として表した。目的地が主人のもとであるため、「去らせる」より「帰らせる」が文脈上自然である。
- source_word: לַאדֹנִי
  choice: 主人のもとへ
  rationale: אָדוֹן はここではしもべの人間の主人アブラハムを指す。「主人」は主従関係を明確にし、神への称号との混同を避ける。
theological_decisions:
- issue: アブラハムを指す אָדוֹן の訳語
  choice: 主人
  alternative: 主君
  rationale: ここでの指示対象はしもべの上位者であるアブラハム。「主人」は現代日本語で関係を明瞭に示し、神を指す「主」という読みを不必要に招かない。
translation_notes:
  register: 明瞭で現代的ながら、族長物語にふさわしい落ち着いた叙述調とした。発話は命令の力を保ちつつ、日本語として自然な丁寧表現にした。
