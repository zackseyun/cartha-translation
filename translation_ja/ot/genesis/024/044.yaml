source:
  edition: WLC
  text: וְ/אָמְרָ֤ה אֵלַ/י֙ גַּם אַתָּ֣ה שְׁתֵ֔ה וְ/גַ֥ם לִ/גְמַלֶּ֖י/ךָ אֶשְׁאָ֑ב הִ֣וא הָֽ/אִשָּׁ֔ה אֲשֶׁר הֹכִ֥יחַ יְהוָ֖ה לְ/בֶן אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/044.yaml
  text: and says to me[a], ‘You also drink, and I will draw water for your camels as well’—let her be the woman whom Yahweh has appointed for my master’s son.
translation:
  language: ja
  text: そして私に、『あなたもお飲みください。あなたのらくだにも水をくんであげましょう』と言うなら、その女性こそ、ヤハウェが私の主人の息子のために定められた[a]人です。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「定められた」は、「指定された」、または「示された」とも訳せる。
    reason: הֹכִיחַには、決定・指定する意味のほか、示す・明らかにする意味もあるため。
lexical_decisions:
- source_word: וְאָמְרָה אֵלַי
  choice: そして私に……と言うなら
  rationale: 完了形は、直前から続くしるしの条件を述べる文脈に置かれている。日本語では条件を明示して「と言うなら」とすることで、発言がまだ想定されている段階であることを自然に表した。
- source_word: גַּם אַתָּה שְׁתֵה
  choice: あなたもお飲みください
  rationale: גַּםと独立代名詞による「あなたも」という強調を保ち、命令形は相手への丁寧な勧めとして訳した。
- source_word: וְגַם לִגְמַלֶּיךָ אֶשְׁאָב
  choice: あなたのらくだにも水をくんであげましょう
  rationale: שׁאבの目的語「水」は文脈上明白なので補った。וְגַםによる追加を「にも」で示し、申し出として自然な日本語にした。
- source_word: הִוא הָאִשָּׁה
  choice: その人こそ……女性です
  rationale: 指示・同定を表す名詞文として読み、「こそ」で識別の焦点を表した。原文自体には命令・願望を明示する動詞形がないため、「その人でありますように」とはしなかった。
- source_word: אֲשֶׁר הֹכִיחַ
  choice: 選び定められた
  rationale: יכחのヒフィル形がこの文脈で表す、神が相手を決定・指定する意味を訳した。「選び定める」は選定と指定の両面を自然に伝える。語義の幅は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で一般的な音写を用いた。
- source_word: לְבֶן אֲדֹנִי
  choice: 私の主人の息子のために
  rationale: לְの関係・目的を「ために」で表し、主人の息子のために女性が選定されたという関係を保持した。
theological_decisions:
- issue: הִוא הָאִשָּׁהを直説として訳すか、願望として訳すか
  choice: その人こそ……女性です
  alternative: その人が……女性でありますように
  rationale: 祈りの文脈には願望的な含みがあるが、この節のヘブライ語は代名詞による同定文で、願望を示す形態は明示されていない。そのため本文では直説的な同定を保った。
- issue: 神名יְהוָהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文に固有名が明記されているため、その区別を保って音写した。
translation_notes:
  register: 明瞭な現代標準語を用い、しもべが相手の女性に想定する丁寧な言葉遣いを「お飲みください」「くんであげましょう」で表した。全体は祈りの再述として品位を保ちつつ、条件関係を日本語で明確にした。
