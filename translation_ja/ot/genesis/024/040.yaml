revisions:
- from: 彼は私に言った。「私がその御前を歩んできたヤハウェは、御使いをあなたとともに遣わし、あなたの旅を成功させてくださる[a]。あなたは、私の氏族[b]、私の父の家から、私の息子のために妻を迎えることになる。」
  to: 彼は私に言った。「私がその御前に歩んできたヤハウェは、御使いをあなたとともに遣わし、あなたの旅を成功させてくださる[a]。あなたは、私の氏族[b]と、私の父の家から、私の息子のために妻を迎えることになる。」
  rationale: 格助詞を「に」へ訂正して「神の御前で歩む」という原文の慣用的比喩を自然な日本語で保った。また、「氏族」と「父の家」の原文上の並列関係を明示した。その他の訳語と脚注は原文に適合しているため維持した。
