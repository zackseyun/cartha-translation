  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֵלָ֑/י יְהוָ֞ה אֲשֶׁר הִתְהַלַּ֣כְתִּי לְ/פָנָ֗י/ו יִשְׁלַ֨ח מַלְאָכ֤/וֹ אִתָּ/ךְ֙ וְ/הִצְלִ֣יחַ דַּרְכֶּ֔/ךָ וְ/לָקַחְתָּ֤ אִשָּׁה֙ לִ/בְנִ֔/י מִ/מִּשְׁפַּחְתִּ֖/י וּ/מִ/בֵּ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/040.yaml
  text: And he said to me[a], ‘Yahweh, before whom I have walked, will send his angel with you and make your journey successful[b], and you will take a wife for my son from my clan and from my father’s house.’
translation:
  language: ja
  text: 彼は私に言った。「私がその御前に歩んできたヤハウェは、御使いをあなたとともに遣わし、あなたの旅を成功させてくださる[a]。あなたは、私の氏族[b]と、私の父の家から、私の息子のために妻を迎えることになる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「あなたの道を成功させてくださる」。
    reason: lexical_alternative
  - marker: b
    text: 「家族」とも訳せる。ヘブライ語は、より広い血縁集団を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: הִתְהַלַּכְתִּי לְפָנָיו
  choice: 私がその御前を歩んできた
  rationale: 神の前で営んできた生き方を表す慣用表現の比喩と契約的な響きを保ち、解釈を加えすぎないようにした。
- source_word: מַלְאָכוֹ
  choice: 御使い
  rationale: ここではヤハウェに遣わされて同行する天的な使者を指すため、現代の聖書語として自然な「御使い」とした。
- source_word: וְהִצְלִיחַ דַּרְכֶּךָ
  choice: あなたの旅を成功させてくださる
  rationale: 使役形の「成功させる」と、文脈上の「道／旅」の意味を明瞭な現代日本語で表した。
- source_word: וְלָקַחְתָּ אִשָּׁה
  choice: 妻を迎えることになる
  rationale: 結婚のために女性を選び連れて来るという文脈に合う自然な日本語とし、未来の成就を表した。
- source_word: מִמִּשְׁפַּחְתִּי
  choice: 私の氏族
  rationale: 近親家族より広い血縁集団を指し得る語なので、「家族」より範囲の広い「氏族」を選んだ。
- source_word: וּמִבֵּית אָבִי
  choice: 私の父の家
  rationale: 父系の家ないし家系を表す原文の具体的な表現を保持した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 固有名であることを保ち、称号への置換や特定の宗派的慣行を避けた。
- issue: 「その御前を歩んできた」の含意
  choice: 比喩を保持する
  alternative: その御前で忠実に生きてきた
  rationale: 神の臨在のもとでの生活と忠実さを含み得るが、「忠実に」を本文へ補って意味を一つに限定しなかった。
- issue: 約束の未来表現
  choice: 成功させてくださる／迎えることになる
  alternative: 成功させてくださるだろう／迎えなければならない
  rationale: 文脈上の確信を表しつつ、命令や義務として読み替えないようにした。
translation_notes:
  register: 明瞭で現代的な標準語を用いながら、アブラハムの言葉にふさわしい落ち着いた格調を保った。「御前を歩む」「父の家」は原文の比喩と社会的背景を伝えるため残し、文脈から補える以上の説明は脚注に回した。
