lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: 聞くと
  rationale: ヘブライ語の物語上の連続と時を示す定型句を、日本語では簡潔で自然な接続表現にした。
- source_word: עֶבֶד אַבְרָהָם
  choice: アブラハムのしもべ
  rationale: 家の代表として仕える人物を指す文脈に合い、עֶבֶדを過度に身分制度へ限定しない、聖書本文として自然な表現。
- source_word: דִּבְרֵיהֶם
  choice: 彼らの言葉
  rationale: 原語の複数形と語彙的な意味を保ちつつ、現代日本語として明瞭。
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: 地にひれ伏して
  rationale: 動詞が表す低く身をかがめる行為と、方向を示す「地へ」を一体として自然に表現した。
- source_word: לַיהוָה
  choice: ヤハウェを礼拝した
  rationale: לְはこの動詞との結合で礼拝の対象を示す。神名を音写し、身体動作がヤハウェへの崇敬行為であることを日本語で明確にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に固有の神名が明記されているため、それを音写して区別を保った。
- issue: וַיִּשְׁתַּחוּ を「礼拝」と明示するか
  choice: 地にひれ伏してヤハウェを礼拝した
  alternative: ヤハウェに向かって地にひれ伏した
  rationale: 動詞自体はひれ伏す行為を表し得るが、対象がヤハウェであるため礼拝的意味が強い。本文では身体動作と宗教的意味の双方を示し、脚注でより形式的な訳を提示した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。「しもべ」は文脈上の役割を自然に示すためひらがな表記とし、「ひれ伏す」によって身体動作を具体的に保った。
