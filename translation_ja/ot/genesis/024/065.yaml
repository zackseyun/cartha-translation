source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֶל הָ/עֶ֗בֶד מִֽי הָ/אִ֤ישׁ הַלָּזֶה֙ הַ/הֹלֵ֤ךְ בַּ/שָּׂדֶה֙ לִ/קְרָאתֵ֔/נוּ וַ/יֹּ֥אמֶר הָ/עֶ֖בֶד ה֣וּא אֲדֹנִ֑/י וַ/תִּקַּ֥ח הַ/צָּעִ֖יף וַ/תִּתְכָּֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/065.yaml
  text: And she said to the servant[a], “Who is this man walking in the field to meet us?” And the servant said[c][b], “He is my master.” Then she took the veil and covered herself.
translation:
  language: ja
  text: リベカはその僕に言った。「野をこちらに向かって歩いて来る、あの人はどなたですか。」僕は答えた。「私の主人です。」そこでリベカはベールを取って、身を覆った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ベールをかぶった」。原文の動詞は、自分自身を覆う動作を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֶבֶד
  choice: 僕
  rationale: アブラハムの家に仕える者を指す。身分上の隷属性を前面に出す「奴隷」より、物語の役割に即した「僕」が適切である。
- source_word: הָאִישׁ הַלָּזֶה
  choice: あの人
  rationale: 目に見える人物を指し示す表現。日本語の場面指示として、近づいて来る人物には「あの人」が自然であり、男性であることも文脈上明らかである。
- source_word: הַהֹלֵךְ בַּשָּׂדֶה לִקְרָאתֵנוּ
  choice: 野をこちらに向かって歩いて来る
  rationale: הלךの歩行・移動の意味と、לקראתנוの「私たちに会うため／私たちの方へ」という方向性を、自然な日本語で併せて表した。
- source_word: הוּא אֲדֹנִי
  choice: 私の主人です
  rationale: ここでは僕に対する人間の主人を意味するため、「主」ではなく「主人」とした。
- source_word: הַצָּעִיף
  choice: ベール
  rationale: 女性が身を覆う布を指す語で、この婚姻場面では「ベール」が簡潔で理解しやすい。
- source_word: וַתִּתְכָּס
  choice: 身を覆った
  rationale: 再帰的な動作を表し、直前のベールを用いて自分を覆ったことを明確にする。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある物語文とした。「僕」は「しもべ」と読み、古風すぎる表記を避けつつ聖書物語の主従関係を表す。
