  text: וַ/יְבָרֲכ֤וּ אֶת רִבְקָה֙ וַ/יֹּ֣אמְרוּ לָ֔/הּ אֲחֹתֵ֕/נוּ אַ֥תְּ הֲיִ֖י לְ/אַלְפֵ֣י רְבָבָ֑ה וְ/יִירַ֣שׁ זַרְעֵ֔/ךְ אֵ֖ת שַׁ֥עַר שֹׂנְאָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/060.yaml
  text: And they blessed Rebekah and said to her[a], “Our sister, may you become thousands of ten thousands[b], and may your offspring possess the gate of those who hate them.”
translation:
  language: ja
  text: '彼らはリベカを祝福して言った。


    「私たちの姉妹よ、


    あなたから幾千万もの人々が生まれますように。[a]


    あなたの子孫が、自分を憎む者たちの門を


    手にしますように。」[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「幾千の万となりますように」。または「数えきれないほど多くなりますように」。
    reason: ヘブライ語の数的慣用表現と字義を示すため。
  - marker: b
    text: 「門を受け継ぎますように」または「門を所有しますように」とも訳せる。「門」は、防備された町の力や支配権を表す比喩。
    reason: ירשの訳語の幅と「門」が持つ古代の比喩的意味を示すため。
lexical_decisions:
- source_word: וַיְבָרֲכוּ
  choice: 祝福して
  rationale: ピエル形が表す、リベカに祝福の言葉を告げる行為を、簡潔で自然な日本語にした。
- source_word: רִבְקָה
  choice: リベカ
  rationale: 日本語聖書で広く定着しているヘブライ語名の表記を用いた。
- source_word: אֲחֹתֵנוּ
  choice: 私たちの姉妹よ
  rationale: 家族として呼びかける呼格を明示し、厳かな祝福の調子を保った。
- source_word: הֲיִי לְאַלְפֵי רְבָבָה
  choice: あなたから幾千万もの人々が生まれますように
  rationale: 字義は「幾千の万となれ」。リベカ自身が大勢になるというヘブライ語の数的慣用表現を、子孫繁栄を願う祝福として自然に伝えた。
- source_word: זַרְעֵךְ
  choice: あなたの子孫
  rationale: 集合単数の「種」が文脈上子孫を指すため、現代日本語で明瞭な「子孫」とした。
- source_word: וְיִירַשׁ
  choice: 勝ち取りますように
  rationale: ירשは受け継ぐ、所有する、占有する意を持つ。この軍事的な門の比喩では、敵の拠点を支配下に置く意味が自然に伝わる表現を選んだ。
- source_word: שַׁעַר
  choice: 門
  rationale: 防備された町への入口であり、その町の力と支配を象徴する具体的イメージを保持した。
- source_word: שֹׂנְאָיו
  choice: 自分を憎む者たち
  rationale: 字義どおりの「彼を憎む者たち」を、集合的な「子孫」を受ける自然な日本語にした。「自分」は単数・複数を明示せず、原文の集合単数との関係を保てる。
theological_decisions:
- issue: 集合単数「子孫」と単数代名詞の関係
  choice: あなたの子孫が、自分を憎む者たち
  alternative: あなたの子孫が、彼らを憎む者たち／その敵たち
  rationale: זֶרַעは集合単数で、後続の接尾代名詞も男性単数である。日本語の「子孫」と再帰語「自分」によって、個人か集団かを不必要に限定せず、原文の文法的な緊張と族長物語の約束の響きを保った。
- issue: 「門」の比喩的意味
  choice: 門を勝ち取る
  alternative: 門を所有する／敵の町を支配する
  rationale: 具体的な「門」の像を残しつつ、敵対者の防衛拠点と支配権を掌握するという文脈上の意味を伝えた。比喩を完全に説明へ置き換えることは避けた。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、家族による旅立ちの祝福にふさわしい簡潔で格調ある調子にした。詩的な行分けで二つの願いを見やすくし、原文の具体的な「門」の像を保持した。
