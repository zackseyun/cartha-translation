    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵה
  choice: どうぞお飲みください
  rationale: 男性単数への命令形だが、この場面では水を勧める丁寧な発話である。日本語では敬意と自然さを保つため「どうぞ」を添えた。
- source_word: אֲדֹנִי
  choice: ご主人さま
  rationale: 字義的には「私の主人」であり、ここでは神への称号ではなく、見知らぬ男性に対する敬意ある呼びかけ。「ご主人さま」は社会的なへりくだりを示しつつ字義とのつながりを保つ。
- source_word: וַתְמַהֵר
  choice: 急いで
  rationale: 行動の素早さを表す動詞。後続する動作を修飾する副詞として訳し、自然な日本語にした。
- source_word: וַתֹּרֶד כַּדָּהּ
  choice: 水がめを…下ろし
  rationale: 携えていた水がめを低い位置へ移す具体的な動作を表す。「水がめ」は文脈上の容器を明確に伝える。
- source_word: עַל יָדָהּ
  choice: 手に
  rationale: 字義は「彼女の手の上に」。日本語の「手の上に下ろす」は不自然になりやすいため、具体的な動作を過度に補わず「手に」とした。
- source_word: וַתַּשְׁקֵהוּ
  choice: 彼に飲ませた
  rationale: שׁקהのヒフィル形が持つ「飲むようにさせる／飲み物を与える」という使役の意味を簡潔に保った。
