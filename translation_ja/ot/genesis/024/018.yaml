  text: She said[a], “Drink, my lord,” and she quickly lowered her jar onto her hand and gave him a drink.
translation:
  language: ja
  text: 彼女は言った。「どうぞお飲みください、旦那さま[a]。」そして急いで水がめを手の上に下ろして、彼に飲ませた。
  philosophy: optimal-equivalence
  footnotes:
