  text: And I said to my master[a], ‘Perhaps the woman will not follow me.’
translation:
  language: ja
  text: そこで私は主人に言いました。『もしかすると、その女性は私について来ないかもしれません。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמַר
  choice: そこで私は尋ねました
  rationale: 語形は直訳すれば「そして私は言った」だが、この発言は疑念を主人に問いかけたものとして前節でも示されており、現代日本語では「尋ねました」が談話上の機能を自然に表す。接続する物語の流れは「そこで」で示した。
- source_word: אֶל אֲדֹנִי
  choice: 主人に
  rationale: ここでのאָדוֹןは神への称号ではなく、僕に対するアブラハムの社会的立場を指すため、「私の主」より自然で誤解のない「主人」とした。日本語では文脈上、所有表現を明示しなくても「私の主人」の意味が保たれる。
- source_word: אֻלַי
  choice: もしかすると
  rationale: 可能性や不確かさを表す語であり、慎重な懸念を自然な現代日本語で伝える。
- source_word: לֹא תֵלֵךְ
  choice: 来ないかもしれません
  rationale: הלך自体は「行く」だが、話者を基準とするאַחֲרַיと結びつくため、日本語では「私について来る」が自然である。否定未完了形とאֻלַיを合わせ、可能性として「来ないかもしれません」とした。
- source_word: הָאִשָּׁה
  choice: その女
  rationale: 原文は単に「その女」であり、文脈上は花嫁候補でも、まだ「妻」や「娘」と限定しない。既知の対象を示す定冠詞は「その」で表した。
- source_word: אַחֲרָי
  choice: 私について
  rationale: 字義は「私の後を」だが、הלךとの組み合わせでは随行を表す。「私について来る」は、その意味と方向性を日本語で自然に保つ。
theological_decisions: []
translation_notes:
  register: 僕が主人に自分の懸念を報告する場面として、丁寧語を用いた明瞭で現代的な語り口にした。原文の不確実性を「もしかすると……かもしれません」で明示し、花嫁候補を本文以上に特定しないよう「その女」を保持した。
