source:
  edition: WLC
  text: וָ/אֶקֹּ֥ד וָֽ/אֶשְׁתַּחֲוֶ֖ה לַ/יהוָ֑ה וָ/אֲבָרֵ֗ךְ אֶת יְהוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣/י אַבְרָהָ֔ם אֲשֶׁ֤ר הִנְחַ֨/נִי֙ בְּ/דֶ֣רֶךְ אֱמֶ֔ת לָ/קַ֛חַת אֶת בַּת אֲחִ֥י אֲדֹנִ֖/י לִ/בְנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/048.yaml
  text: Then I bowed down and worshiped Yahweh[a], and I blessed Yahweh, the God of my master Abraham, who led me on the true way to take the daughter of my master's brother for his son.
translation:
  language: ja
  text: そこで私は身をかがめてヤハウェを礼拝し、私の主人アブラハムの神、ヤハウェをほめたたえました。ヤハウェは、私の主人アブラハムの兄弟の娘をその息子のために迎えるため、確かな道を通って私を導いてくださったのです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֶקֹּד
  choice: 身をかがめ
  rationale: 身体を低くして敬意を表す動作を示す。ひざまずいたとまでは限定せず、原語の身体的な所作を保った。
- source_word: וָאֶשְׁתַּחֲוֶה לַיהוָה
  choice: ヤハウェを礼拝し
  rationale: 神に向けられた敬虔な伏礼を、現代日本語で自然かつ明確に表した。直前の「身をかがめ」と合わせて、身体動作と礼拝の意味の双方を伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: וָאֲבָרֵךְ אֶת־יְהוָה
  choice: ヤハウェをほめたたえました
  rationale: 神を目的語とする ברך は、神を祝福する、すなわち賛美する意。「祝福しました」より現代日本語で意味が明瞭な表現を選んだ。
- source_word: אֱלֹהֵי אֲדֹנִי אַבְרָהָם
  choice: 主人アブラハムの神
  rationale: אֲדֹנִי はここでは話者の人間の主人アブラハムを指すため、「主」ではなく「主人」とした。
- source_word: הִנְחַנִי
  choice: 私を……導き
  rationale: נחה のヒフィル形が表す案内・導きを簡潔に訳した。
- source_word: בְּדֶרֶךְ אֱמֶת
  choice: 確かな道
  rationale: 直訳的には「真実の道」。文脈では、目的地へ正しく至らせたヤハウェの真実で信頼できる導きを表すため、「確かな道」とし、語義の幅は脚注に示した。
- source_word: לָקַחַת
  choice: 迎えられるように
  rationale: 目的を表す不定詞。結婚のため女性を連れて行く文脈に即しつつ、「妻」と明示されていない原文を過度に補わない表現とした。
- source_word: בַּת אֲחִי אֲדֹנִי
  choice: 主人の兄弟の娘
  rationale: 親族関係を原文どおり明示し、「姪」のように視点に依存する語へ置き換えなかった。
- source_word: לִבְנוֹ
  choice: 主人の息子のために
  rationale: 接尾辞が指すアブラハムを「主人」と補い、日本語で指示対象が明瞭になるようにした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文の四文字神名を称号に置き換えず、一般的な学術的再構音に基づく「ヤハウェ」と音写した。
- issue: בְּדֶרֶךְ אֱמֶת における אֱמֶת の意味
  choice: 確かな道
  alternative: 真実の道／正しい道
  rationale: 単なる方向上の正しさに限定せず、「真実・誠実・信頼性」という語義を保ちながら、神の信頼できる導きという文脈に自然に合う表現を選んだ。脚注で直訳と意味の幅を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用い、敬意ある語調を保った。奉仕者が家族に語っている場面に合わせて丁寧体とし、古風な「祝した」や意味の取りにくい「主の兄弟の娘」などは避けた。
