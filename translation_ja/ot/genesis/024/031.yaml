  text: וַ/יֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהוָ֑ה לָ֤/מָּה תַעֲמֹד֙ בַּ/ח֔וּץ וְ/אָנֹכִי֙ פִּנִּ֣יתִי הַ/בַּ֔יִת וּ/מָק֖וֹם לַ/גְּמַלִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/031.yaml
  text: And he said[a], “Come in, blessed of Yahweh. Why do you stand outside? I have prepared the house, and a place for the camels.”
translation:
  language: ja
  text: 彼は言った。「お入りください、ヤハウェに祝福された方。なぜ外に立っておられるのですか。私は家を片づけ、らくだのための場所も用意しました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 彼は言った
  rationale: ワウ継続法による物語の進行を、自然な現代日本語の叙述として表した。
- source_word: בּוֹא
  choice: お入りください
  rationale: 来る・入ることを命じる語で、この場面では家へ招き入れる丁寧な呼びかけが自然である。
- source_word: בְּרוּךְ יְהוָה
  choice: ヤハウェに祝福された方
  rationale: 受動分詞と神名からなる呼びかけとして訳し、祝福の主体を明示しつつ原文の語義を保った。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を音写した。
- source_word: לָמָּה תַעֲמֹד בַּחוּץ
  choice: なぜ外に立っておられるのですか
  rationale: 立つという姿勢と外にいるという位置を保ち、客に対する自然な敬語表現とした。
- source_word: וְאָנֹכִי פִּנִּיתִי הַבַּיִת
  choice: 家も整え
  rationale: פִּנָּהは本来、空ける・片づける意を持つが、ここでは客を迎えるため家を整えた結果を自然に表した。明示された一人称は、後続の「用意してあります」によって文脈上明らかである。
- source_word: וּמָקוֹם לַגְּמַלִּים
  choice: らくだのための場所も用意してあります
  rationale: מָקוֹםの「場所」をそのまま保ち、家と並んで準備済みであることを日本語として明確にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を直接用いているため、称号へ置換せず一般的な学術的音写を採用した。
- issue: בְּרוּךְ יְהוָה の関係
  choice: ヤハウェに祝福された方
  alternative: ヤハウェによって祝福された方／ヤハウェの祝福された方
  rationale: 受動分詞を呼びかけとして取り、ヤハウェを祝福の主体と理解する自然な訳を採用した。日本語では「に」が主体・関係の両面を簡潔に伝える。
translation_notes:
  register: 明快で dignified な現代標準日本語。客への呼びかけには敬語を用い、過度に古風な語法は避けた。原文の直接的な招待、問い、準備の説明という流れを維持した。
