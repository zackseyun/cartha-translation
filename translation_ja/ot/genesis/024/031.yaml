revisions:
- from: 彼は言った。「お入りください。ヤハウェに祝福された方。なぜ外に立っておられるのですか。家も整え、らくだのための場所も用意してあります。」
  to: 彼は言った。「お入りください、ヤハウェに祝福された方。なぜ外に立っておられるのですか。私は家を片づけ、らくだのための場所も用意しました。」
  rationale: 神名、招き、祝福の呼びかけ、外に立つという問いを維持したまま、明示的な一人称 אָנֹכִי と完了した準備行為を日本語に明確に反映した。「片づけ」は פִּנִּיתִי の『空ける／場所を作る』という含意を、「整える」より具体的に保つ。
