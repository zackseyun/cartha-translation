base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/063.yaml
  text: And Isaac went out to meditate in the field toward evening[a], and he lifted up his eyes and looked, and behold, camels were coming.
translation:
  language: ja
  text: イサクは夕暮れ近く、野で思いを巡らすために出て行った[a]。目を上げて見ると、なんと、らくだが近づいて来るところであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「野を歩くために」「物思いにふけるために」「語らうために」、あるいは「祈るために」とも訳せる。このヘブライ語動詞は用例が少なく、ここでの正確な意味は定かでない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא יִצְחָק
  choice: イサクは……出て行った
  rationale: יצא の物理的な外への移動と、物語を進める wayyiqtol の流れを、自然な現代日本語で表した。
- source_word: לָשׂוּחַ
  choice: 思いを巡らすために
  rationale: この動詞はまれで語義に議論がある。夕暮れ時に一人で野へ出た文脈では内省的な行為を自然に表せるが、祈りなどに限定しない訳語とし、不確かさは脚注に残した。
- source_word: בַּשָּׂדֶה
  choice: 野で
  rationale: שׂדה は畑だけでなく開けた野や田野を指し得る。ここでは場所の広がりを簡潔に示す「野」が自然である。
- source_word: לִפְנוֹת עָרֶב
  choice: 夕暮れ近く
  rationale: 夕方へ向かう時、すなわち夕方が近づくころを表すヘブライ語の時間表現を、簡潔で自然な日本語にした。
- source_word: וַיִּשָּׂא עֵינָיו וַיַּרְא
  choice: 目を上げて見ると
  rationale: 直訳的な二動作のイメージを保ちつつ、日本語では一続きの自然な視線の動きとして表現した。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 突然目に入った光景へ注意を向ける談話標識の生き生きした効果を、現代日本語の物語表現で示した。
- source_word: גְמַלִּים בָּאִים
  choice: らくだの一隊が近づいて来るところであった
  rationale: 分詞 בָּאִים の進行中の接近を表した。複数のらくだが旅の一団として来る場面を日本語で自然に示すため「一隊」を補った。
theological_decisions:
- issue: לָשׂוּחַ が祈りを意味するか
  choice: 本文では「思いを巡らす」とし、祈りに限定しない
  alternative: 「祈る」「黙想する」「歩く」「語る」
  rationale: 語形がまれで正確な意味を確定できないため、特定の信仰実践に限定せず、候補を脚注に明示した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。ヘブライ語の物語的な生動感は「目を上げて見ると、なんと」で保ち、まれな動詞の曖昧さは本文で過度に限定せず脚注に示した。
