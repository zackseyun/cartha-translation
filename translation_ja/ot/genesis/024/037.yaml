  text: וַ/יַּשְׁבִּעֵ֥/נִי אֲדֹנִ֖/י לֵ/אמֹ֑ר לֹא תִקַּ֤ח אִשָּׁה֙ לִ/בְנִ֔/י מִ/בְּנוֹת֙ הַֽ/כְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יֹשֵׁ֥ב בְּ/אַרְצֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/037.yaml
  text: And my master made me swear[a], saying, ‘You shall not take a wife for my son from the daughters of the Canaanites, in whose land I am dwelling.’
translation:
  language: ja
  text: 私の主人は私に誓わせて、こう言いました。「私の息子のために妻を、私がその地に住んでいるカナン人の娘たちの中から迎えてはならない。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると「私がその地に住んでいるカナン人」となり、「カナン人」が集合的な単数形で用いられています。「私がその人々の間に住んでいる」と訳すこともできます。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁבִּעֵנִי
  choice: 私に誓わせて
  rationale: שׁבעのヒフィル形が表す「人に誓わせる」という使役の意味を、そのまま自然な日本語で示す。
- source_word: אֲדֹנִי
  choice: 私の主人
  rationale: 話者はアブラハムの僕であり、人間の主を指しているため、「主」ではなく関係が明確な「主人」とした。
- source_word: לֵאמֹר
  choice: こう言いました
  rationale: 直接話法を導く定型表現を、現代日本語の物語文として自然に訳した。
- source_word: לֹא תִקַּח
  choice: 迎えてはならない
  rationale: 誓約に伴う厳格な禁止を「〜てはならない」で保ち、結婚相手を得る文脈に即して「迎える」とした。
- source_word: אִשָּׁה לִבְנִי
  choice: 私の息子の妻
  rationale: אִשָּׁהはこの婚姻文脈では「女」ではなく「妻」を意味する。日本語の自然な語順に整えた。
- source_word: מִבְּנוֹת הַכְּנַעֲנִי
  choice: カナン人の娘たちの中から
  rationale: 集合的単数「カナン人」と、親族的表現「娘たち」を保ちつつ、選択範囲を表す前置詞מִןを明示した。
- source_word: אֲשֶׁר אָנֹכִי יֹשֵׁב בְּאַרְצוֹ
  choice: 私がその地に住んでいる
  rationale: 直訳的な「その者の地」を不自然にせず、土地に焦点を置く原文を「その地」で保持した。
