  text: וַ/יּוֹצֵ֨א הָ/עֶ֜בֶד כְּלֵי כֶ֨סֶף וּ/כְלֵ֤י זָהָב֙ וּ/בְגָדִ֔ים וַ/יִּתֵּ֖ן לְ/רִבְקָ֑ה וּ/מִ֨גְדָּנֹ֔ת נָתַ֥ן לְ/אָחִ֖י/הָ וּ/לְ/אִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/053.yaml
  text: Then the servant brought out articles of silver and articles of gold and garments[a], and gave them to Rebekah; he also gave choice gifts to her brother and to her mother.
translation:
  language: ja
  text: それから、しもべは銀の品々、金の品々、衣服を取り出してリベカに与えた。また、えりすぐりの贈り物[a]を彼女の兄と母に与えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「貴重な品々」とも訳せる。この語は選り抜きの、または価値ある贈り物を指し、文脈によっては珍味を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: 取り出して
  rationale: ヒフィル形の具体的な動作を、文脈に即した自然な現代日本語で表す。
- source_word: הָעֶבֶד
  choice: しもべ
  rationale: この物語で家長の使者として行動する人物を指す。従属的身分を保ちつつ、現代の聖書叙述として自然な語を選んだ。
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: 銀の品々、金の品々
  rationale: כְּלִי は器に限らず物品一般を指し得るため、用途や形状を限定しない「品々」とした。
- source_word: וּבְגָדִים
  choice: 衣服
  rationale: 贈答品としての衣類を、明瞭で品位ある現代語で表した。
- source_word: וּמִגְדָּנֹת
  choice: えりすぐりの贈り物
  rationale: 貴重な品、選り抜きの品を表す語義を保ち、金銭的価値だけに限定しない。文脈上は贈答品と解するのが自然だが、珍味を指す可能性も脚注に残した。
- source_word: לְאָחִיהָ וּלְאִמָּהּ
  choice: 彼女の兄と母に
  rationale: 接尾代名詞がリベカを指すことを日本語で明示した。
