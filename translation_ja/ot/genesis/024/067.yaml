base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/067.yaml
  text: And Isaac brought her into the tent of Sarah his mother[a], and he took Rebekah, and she became his wife, and he loved her[b]. So Isaac was comforted after his mother's death.
translation:
  language: ja
  text: イサクは彼女を母サラの天幕に連れて入り[a]、リベカを迎えた。彼女は彼の妻となり、イサクは彼女を愛した。こうしてイサクは、母を失った後、慰めを得た[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「母サラの天幕へ連れて行き」。ヘブライ語は天幕へ向かう動きを示し、文脈上は中へ入ったことを表します。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「母の後に」。文脈上、母の死後、または母を失った後を指しますが、ヘブライ語本文は「死」を明示していません。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְבִאֶהָ
  choice: 彼女を……連れて入り
  rationale: בוא のヒフィル形と三人称女性単数接尾辞を、天幕内部への移動が明確になる自然な日本語で表した。
- source_word: הָאֹהֱלָה
  choice: 天幕に
  rationale: 方向を示す語尾 ה により、天幕へ、文脈上はその中へ入る動きを示す。「連れて入り」と組み合わせて方向性を表した。
- source_word: שָׂרָה אִמּוֹ
  choice: 母サラの
  rationale: サラがイサクの母であり、その天幕であることを、簡潔で自然な同格表現にした。
- source_word: וַיִּקַּח אֶת רִבְקָה
  choice: リベカを迎えた
  rationale: לקח の「取る」を婚姻の文脈に即して表しつつ、次の「妻となった」との重複を避けた。「めとった」より現代的で品位のある表現。
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: 彼女は彼の妻となり
  rationale: היה + ל + אשה の婚姻関係成立を、物語の進行を保つ自然な日本語で表した。
- source_word: וַיֶּאֱהָבֶהָ
  choice: イサクは彼女を愛した
  rationale: אהב の通常の意味をそのまま明瞭に訳した。主語を補い、日本語での指示関係を明確にした。
- source_word: וַיִּנָּחֵם
  choice: 慰めを得た
  rationale: נחם のニファル形がここでは慰められることを表すため、自然な能動的日本語表現にした。
- source_word: אַחֲרֵי אִמּוֹ
  choice: 母を亡くした悲しみから
  rationale: 字義的には「母の後」だが、創世記23章の文脈から母の死後の喪失と悲しみを指す。日本語として意味が通るよう明示し、補足であることを脚注に示した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語を用い、物語文としての簡潔さと品位を保った。「迎えた」は婚姻文脈の לקח を自然に示しながら、後続の「妻となり」を残すための最適等価訳。末尾は字義を脚注に保存しつつ、本文では日本語読者に喪失後の慰めという意味が明確になるようにした。
