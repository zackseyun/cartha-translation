base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/022.yaml
  text: And when the camels had finished drinking[a], the man took a gold ring weighing a beka[b], and two bracelets for her hands weighing ten shekels of gold.
translation:
  language: ja
  text: らくだが水を飲み終えると、その人は、重さ一ベカ[b]の金の輪[a]と、彼女の両手につける、合わせて金十シェケルの重さがある二つの腕輪を手に取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「金の鼻輪」とも訳せる。ヘブライ語の語は、鼻または耳につける輪を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 一ベカは、二分の一シェケルに当たる重量単位。
    reason: cultural_note
lexical_decisions:
- source_word: כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת
  choice: らくだが水を飲み終えると
  rationale: 完了を表す כלה と不定詞の組み合わせ、および後続動作の時を示す כַּאֲשֶׁר を、自然な日本語で順序関係を保って表した。「すぐに」とまでは限定しない。
- source_word: הָאִישׁ
  choice: その人
  rationale: 文脈上はアブラハムの僕だが、原文はここで「人」とだけ記しているため、その表現を保った。
- source_word: נֶזֶם זָהָב
  choice: 金の輪
  rationale: נֶזֶם は鼻または耳につける輪を指し得る。本文では装着部位を断定せず、「輪」とし、語義上の可能性を脚注に示した。
- source_word: בֶּקַע מִשְׁקָלוֹ
  choice: 重さ一ベカ
  rationale: 古代の重量単位ベカをそのまま保持し、その値は脚注で説明した。
- source_word: וּשְׁנֵי צְמִידִים
  choice: 二つの腕輪
  rationale: 原文の明示的な数「二つ」を保ち、צְמִידִים を文脈に即して「腕輪」とした。
- source_word: עַל יָדֶיהָ
  choice: 彼女の両手につける
  rationale: 直訳的には「彼女の手の上に」。腕輪を身につける文脈に合わせつつ、יָד の身体部位を過度に「手首」へ限定しない表現とした。
- source_word: עֲשָׂרָה זָהָב מִשְׁקָלָם
  choice: 重さ金十シェケル
  rationale: 原文では重量単位が省略されているが、この重量表現で含意されるシェケルを補い、二つの腕輪を合わせた金の重量であることが分かるようにした。
- source_word: וַיִּקַּח
  choice: 手に取った
  rationale: 基本義「取る」を自然な日本語で表し、原文にない「取り出した」という動作までは加えなかった。
