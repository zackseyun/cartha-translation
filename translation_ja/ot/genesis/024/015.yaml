base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/015.yaml
  text: And it happened[a], before he had finished speaking, that behold, Rebekah was coming out—she who had been born to Bethuel son of Milcah, the wife of Nahor[b], Abraham’s brother—with her jar on her shoulder.
translation:
  language: ja
  text: 彼がまだ語り終えないうちに、見よ、リベカがかめを肩に載せて出て来た。彼女は、アブラハムの兄弟ナホルの妻ミルカの子ベトエルの娘として生まれた者であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הוּא טֶרֶם כִּלָּה לְדַבֵּר
  choice: 彼がまだ語り終えないうちに
  rationale: וַיְהִי は物語の進行を示すが、日本語では独立した「そして、起こった」とせず、後続する時間節と一体化する方が自然である。טֶרֶם と כִּלָּה לְדַבֵּר の完了前という意味を明確に保った。
- source_word: וְהִנֵּה
  choice: 見よ
  rationale: 場面を目前に提示し、読者の注意を促す談話機能を保つため、簡潔で荘重な「見よ」とした。
- source_word: רִבְקָה יֹצֵאת
  choice: リベカが…出て来た
  rationale: 分詞が表す目前の進行的・生動的な場面を、日本語物語として自然な「出て来た」で表した。出発点は文脈上の町であり、目的地を不必要に補わない。
- source_word: אֲשֶׁר יֻלְּדָה לִבְתוּאֵל
  choice: その子ベトエルに産んだ娘であった
  rationale: 受動形を直訳すると日本語では不自然になるため、母ミルカを主語とする系譜説明に組み替えた。本文上明らかなリベカの親子関係を示すため「娘」を補った。
- source_word: בֶּן מִלְכָּה אֵשֶׁת נָחוֹר אֲחִי אַבְרָהָם
  choice: アブラハムの兄弟ナホルの妻ミルカが、その子ベトエルに
  rationale: 修飾関係の曖昧さを避けつつ、ミルカがナホルの妻、ナホルがアブラハムの兄弟、ベトエルがミルカの子であるというヘブライ語の系譜情報をすべて保持した。
- source_word: כַדָּהּ עַל שִׁכְמָהּ
  choice: 水がめを肩に載せて
  rationale: כַּד は水をくむ容器を指す文脈なので、現代日本語で明瞭な「水がめ」とした。עַל שִׁכְמָהּ は自然に「肩に載せて」と表した。
