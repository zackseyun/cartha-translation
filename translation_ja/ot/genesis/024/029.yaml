base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/029.yaml
  text: Rebekah had a brother[a], and his name was Laban; and Laban ran out to the man[b], outside by the spring.
translation:
  language: ja
  text: リベカには兄弟が一人いて、その名はラバンであった。ラバンは外へ出て、泉のほとりにいるその人のもとへ走って行った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְרִבְקָה אָח
  choice: リベカには兄弟がいて
  rationale: 前置詞 לְ を伴う所有・存在の表現を、自然な日本語で「リベカには…がいて」とした。אָח は年長か年少かを明示しないため、「兄」と限定せず「兄弟」とした。
- source_word: וּשְׁמוֹ לָבָן
  choice: 名をラバンといった
  rationale: ヘブライ語の命名表現を、簡潔で自然な日本語にした。
- source_word: וַיָּרָץ
  choice: 走って行った
  rationale: 動詞の基本義「走る」と、後続する方向表現を自然に結び付けた。
- source_word: אֶל־הָאִישׁ
  choice: その人のもとに
  rationale: אִישׁ を文脈から「しもべ」などと特定せず、原文どおり一般的な「人」とした。定冠詞と既出人物への照応は「その」で表した。
- source_word: הַחוּצָה אֶל־הָעָיִן
  choice: 外の泉へ
  rationale: הַחוּצָה の外向きの方向性と、עַיִן の水源としての意味を簡潔に表した。עַיִן は「井戸」より正確な「泉」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語。原文が兄か弟かを特定しない点を保つため「兄弟」を用いた。後半の二つの方向句は、日本語として自然になるよう「外の泉へ、その人のもとに」とまとめ、ラバンが泉の所にいる人物へ向かった場面を表した。
