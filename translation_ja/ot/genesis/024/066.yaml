translation_notes:
  register: 明瞭で自然な現代標準日本語の物語文。「しもべ」より現在の読者に通じやすく、「奴隷」ほど法的身分を前面に出さない「僕」を採用した。原文の簡潔さを保ちつつ、脚注で דְּבָרִים と עֶבֶד の語義の幅を保存した。
