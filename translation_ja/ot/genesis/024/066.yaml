  text: And the servant told Isaac all the things that he had done[a][b].
translation:
  language: ja
  text: そのしもべは、イサクに、自分が行ったことをすべて語った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「自分が行ったすべての事柄」とも訳せる。ヘブライ語の「事柄」（דְּבָרִים）は、文脈により「言葉」「事柄」「出来事」を指しうる。「しもべ」（עֶבֶד）は「奴隷」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: 語った
  rationale: ピエル形は、務めの経緯を詳しく報告することを表す。現代日本語として自然で、単なる発話以上に一連の出来事を伝える含みを持つ「語った」とした。
- source_word: הָעֶבֶד
  choice: 僕
  rationale: עֶבֶד は「奴隷」「僕」「しもべ」などを意味し得る。ここでは主人の命を受けて働く者としての役割が前面に出ているため、文脈に合い、尊厳ある物語文にもなじむ「僕」とした。
- source_word: לְיִצְחָק
  choice: イサクに
  rationale: 固有名 יִצְחָק は、日本語聖書で広く定着した「イサク」と表記した。前置詞 לְ は報告の相手を示すため「に」とした。
- source_word: אֵת כָּל הַדְּבָרִים
  choice: すべて
  rationale: דְּבָרִים は「言葉」「事柄」「出来事」など広い意味を持つ。ここでは使命に関する行為と経緯全体を指すため、日本語では不自然な重複を避けつつ包括性を保つ「すべて」とした。別の語義は脚注に示す。
- source_word: אֲשֶׁר עָשָׂה
  choice: 自分が行ったこと
  rationale: 動詞 עָשָׂה の主語は直前の「僕」と読むのが自然である。「自分が」により、イサクではなく僕の行為であることを明確にし、完了した任務の内容を「行ったこと」と表した。
