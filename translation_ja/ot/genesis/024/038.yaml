  text: אִם לֹ֧א אֶל בֵּית אָבִ֛/י תֵּלֵ֖ךְ וְ/אֶל מִשְׁפַּחְתִּ֑/י וְ/לָקַחְתָּ֥ אִשָּׁ֖ה לִ/בְנִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/024/038.yaml
  text: But you shall go to my father's house and to my clan[a], and you shall take a wife for my son.
translation:
  language: ja
  text: ただ、あなたは私の父の家へ、私の氏族[a]のもとへ行き、私の息子のために妻を迎えなければならない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私の一族」または「私の親族」とも訳せる。ヘブライ語は、近親の家族だけでなく、より広い親族集団を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: そうではなく
  rationale: 直前の禁止と対照をなす誓約文脈の慣用表現。単純な条件「もし～でなければ」ではなく、方向を転じる強い対照として自然な日本語にした。
- source_word: בֵּית אָבִי
  choice: 私の父の家
  rationale: 字義どおりの「父の家」を保ちつつ、家系・家族集団をも含み得る表現とした。
- source_word: תֵּלֵךְ
  choice: 行き
  rationale: 未完了形がこの文脈で表す指示・義務は、文末の「なければならない」にまとめて示した。
- source_word: מִשְׁפַּחְתִּי
  choice: 私の氏族
  rationale: 近親家族だけでなく、より広い親族集団を指す語なので「氏族」とした。
- source_word: וְלָקַחְתָּ אִשָּׁה לִבְנִי
  choice: 私の息子のために妻を迎えなければならない
  rationale: לקח の基本的な意味を踏まえつつ、婚姻の取り決めを表す自然で dignified な現代日本語として「妻を迎える」とした。ל は受益・目的を示すため「息子のために」と訳した。
