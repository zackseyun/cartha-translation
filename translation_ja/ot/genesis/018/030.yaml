  text: וַ֠/יֹּאמֶר אַל נָ֞א יִ֤חַר לַֽ/אדֹנָ/י֙ וַ/אֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם שְׁלֹשִׁ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/030.yaml
  text: Then he said[a], “Please, let not my Lord be angry, and I will speak. Perhaps thirty will be found there.” And he said, “I will not do it if I find thirty there.”
translation:
  language: ja
  text: アブラハムは言った。「どうか、わが主[a]よ、お怒りにならないでください。話させてください。もしかすると、そこに三十人が見いだされるかもしれません。」主は言われた。「もしそこに三十人を見いだすなら、そうはしない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「主人」または「主君」。ヘブライ語の敬称は、人に対する丁重な呼びかけとも読めるが、ここでは文脈上、主に対する呼びかけと理解される。
    reason: alternative_reading
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: どうか……お怒りにならず
  rationale: 否定辞、懇願を表す נָא、怒りが燃えるという慣用表現を、へりくだった願いとして自然な現代日本語にした。
- source_word: לַאדֹנָי
  choice: わが主
  rationale: 一人称単数接尾辞を伴う敬称であり、文脈上は神である対話相手への呼びかけ。「わが主」は敬意と『私の』の要素を保つ。
- source_word: וַאֲדַבֵּרָה
  choice: もう一度言わせてください
  rationale: コホータティブの、話し続ける許しを控えめに願う力を表した。「もう一度」は反復される執り成しの文脈を自然に示す補足である。
- source_word: אוּלַי יִמָּצְאוּן שָׁם שְׁלֹשִׁים
  choice: もしかすると、そこに三十人いるかもしれません
  rationale: אוּלַי の不確かさと、מצא ニファルの『見いだされる』という意味を、日本語では存在表現により自然に伝えた。文脈上、数えられているのは正しい人々だが、原文同様ここでは名詞を補わない。
- source_word: לֹא אֶעֱשֶׂה
  choice: そうはしない
  rationale: 目的語が省略された簡潔な表現を保ち、文脈上の町への裁きを指すものとして自然に訳した。
- source_word: אִם אֶמְצָא
  choice: もし……いるなら
  rationale: 直訳は『もし私が見いだすなら』だが、日本語では場所に人がいるという条件として表すほうが自然で、意味を損なわない。
theological_decisions:
- issue: アブラハムの呼びかけ אֲדֹנָי の解釈
  choice: わが主
  alternative: ご主人／わが主人
  rationale: この神顕現の文脈では神である対話相手への敬称と理解するのが自然。ただし語形そのものは敬意ある人間への呼びかけとも取り得るため、脚注で曖昧さを示し、神名へ置き換えない。
translation_notes:
  register: 明瞭で品位ある現代標準語。アブラハムの畏れと慎重な執り成しを敬語で表しつつ、神の返答は簡潔に保った。脚注記号[a]は該当する呼びかけの直後に置いた。
