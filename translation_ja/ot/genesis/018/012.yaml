id: GEN.18.12
reference: Genesis 18:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תִּצְחַ֥ק שָׂרָ֖ה בְּ/קִרְבָּ֣/הּ לֵ/אמֹ֑ר אַחֲרֵ֤י בְלֹתִ/י֙ הָֽיְתָה לִּ֣/י עֶדְנָ֔ה וַֽ/אדֹנִ֖/י זָקֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/012.yaml
  text: So Sarah laughed to herself[a], saying, “After I am worn out, shall I have pleasure, while my lord is old?”
translation:
  language: ja
  text: そこでサラは心の中で笑い、こう言った。「老い衰えたこの私に、今さら喜び[a]があるのだろうか。主人も年老いているのに。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「楽しみ」。夫婦の性的な喜び、または若々しい活力が戻ることを含意している可能性がある。
    reason: 希少語 עֶדְנָה の意味範囲と、文脈上あり得る身体的・性的な含みを示すため。
lexical_decisions:
- source_word: וַתִּצְחַק
  choice: 笑い
  rationale: צחק の基本的な意味である「笑う」を採用した。文脈上、あざけりと限定せず、約束を聞いたサラの内なる反応として訳した。
- source_word: בְּקִרְבָּהּ
  choice: 心の中で
  rationale: 直訳は「彼女の内で」。声に出さない内的な反応を、自然な現代日本語で表した。
- source_word: אַחֲרֵי בְלֹתִי
  choice: 老い衰えたこの私に、今さら
  rationale: בלה の「すり減る、衰える」という身体的な含みを「老い衰えた」で保ち、אַחֲרֵי の時間的な感覚を自然な疑問文に合う「今さら」で表した。
- source_word: הָיְתָה לִּי עֶדְנָה
  choice: 私に、今さら喜びがあるのだろうか
  rationale: 希少語 עֶדְנָה の広い意味を「喜び」とし、性的な喜びや若々しい活力の回復に限定しなかった。היה ל־ の所有表現は「私に……がある」とした。
- source_word: וַאדֹנִי
  choice: 主人も
  rationale: ここでは神への称号ではなく、サラがアブラハムを敬って呼ぶ語。「主人」はその社会的・敬意的な意味を保つ。接続詞は文脈上の付加と対照を自然に示す「も」とした。
- source_word: זָקֵן
  choice: 年老いている
  rationale: 述語的な形容表現を、明快で自然な現代日本語にした。
theological_decisions:
- issue: עֶדְנָה が指す喜びの性質
  choice: 本文では広く「喜び」と訳す
  alternative: 「性的な喜び」または「若々しい活力」
  rationale: 老齢、夫婦関係、出産の文脈から身体的・性的な含みはあり得るが、ヘブライ語自体は一つの意味に限定していないため、本文では曖昧さを保ち、具体的な可能性は脚注に示した。
- issue: וַאדֹנִי の指示対象と敬称性
  choice: アブラハムを指す「主人」
  alternative: 「夫」
  rationale: 「夫」は指示対象を明快にする一方、אָדוֹן の敬意を含む呼称を弱める。「主人」によって神称号と区別しつつ原文の社会的ニュアンスを保った。
translation_notes:
  register: 明快な現代標準日本語を用いながら、サラの内語として自然な語順にした。「老い衰えた」「主人」により原文の身体的・敬意的な含みを保ち、「喜び」は解釈を狭めない簡潔で品位ある表現とした。
