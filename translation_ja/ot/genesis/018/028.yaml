  text: א֠וּלַי יַחְסְר֞וּ/ן חֲמִשִּׁ֤ים הַ/צַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲ/תַשְׁחִ֥ית בַּ/חֲמִשָּׁ֖ה אֶת כָּל הָ/עִ֑יר וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַ/חֲמִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/028.yaml
  text: Suppose five of the fifty righteous are lacking—will you destroy the whole city for five? And he said[c][b][a], “I will not destroy it if I find forty-five there.”
translation:
  language: ja
  text: 「もし、五十人の正しい者に五人足りなかったら、五人足りないために町全体を滅ぼされるのですか。」主は言われた。「そこに四十五人いるのを見つけたなら、滅ぼさない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אוּלַי
  choice: もし…たら
  rationale: アブラハムが控えめに仮定を持ち出す語。日本語では後続の条件表現と合わせて自然に表した。
- source_word: יַחְסְרוּן חֲמִשִּׁים הַצַּדִּיקִם חֲמִשָּׁה
  choice: 五十人の正しい者に五人足りなかったら
  rationale: 五人が不在なのではなく、必要な五十人という人数に五人不足していることを明確にした。
- source_word: הַצַּדִּיקִם
  choice: 正しい者
  rationale: 道徳的・司法的な意味を保ちつつ、現代日本語で理解しやすい表現とした。
- source_word: הֲתַשְׁחִית / לֹא אַשְׁחִית
  choice: 滅ぼされるのですか／滅ぼさない
  rationale: 同じ語根の反復を訳文でも保ち、問いと答えの対応を明瞭にした。
- source_word: בַּחֲמִשָּׁה
  choice: 五人足りないために
  rationale: 前置詞の理由・原因の意味を示し、五人そのものを滅びの対象や受益者と誤解されないようにした。
- source_word: אִם אֶמְצָא שָׁם אַרְבָּעִים וַחֲמִשָּׁה
  choice: そこに四十五人いるのを見つけたなら
  rationale: 条件構文と場所を示す「そこに」を保ち、日本語として自然な語順にした。
theological_decisions:
- issue: הַצַּדִּיקִם の訳語
  choice: 正しい者
  alternative: 義人
  rationale: 原語の道徳的・司法的重みを保ちながら、一般の現代読者にも直ちに理解できる語を選んだ。「義人」も伝統的な訳だが、日常語としてはやや硬い。
- issue: 発話者の明示
  choice: 主は答えた
  alternative: 彼は答えた
  rationale: ヘブライ語本文は代名詞を置かず動詞だけで「そして言った」とするが、文脈上の発話者は主である。日本語では主語を補うことで対話を明瞭にした。
translation_notes:
  register: 現代標準日本語による、明瞭で品位ある対話文。アブラハムの敬意を「滅ぼされるのですか」という尊敬表現で示し、神の返答は簡潔な断定として訳した。
