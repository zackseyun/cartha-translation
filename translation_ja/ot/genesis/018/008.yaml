source:
  edition: WLC
  text: וַ/יִּקַּ֨ח חֶמְאָ֜ה וְ/חָלָ֗ב וּ/בֶן הַ/בָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַ/יִּתֵּ֖ן לִ/פְנֵי/הֶ֑ם וְ/הֽוּא עֹמֵ֧ד עֲלֵי/הֶ֛ם תַּ֥חַת הָ/עֵ֖ץ וַ/יֹּאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/008.yaml
  text: Then he took curds and milk and the calf that he had prepared[a], and set it before them[b]. He stood by them under the tree while they ate.
translation:
  language: ja
  text: それからアブラハムは、凝乳[a]と乳、それに料理した子牛を持って来て、彼らの前に置いた。彼らが食べている間、アブラハムは木の下で彼らのそばに立っていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「バター」または「クリーム」とも訳せる。ヘブライ語は濃厚な乳製品を指し、文脈によって凝乳、クリーム、バターなどを意味する。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「彼らの上に立っていた」。ここでは、主人として客のそばに立ち、給仕していたという意味と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאָה
  choice: 凝乳
  rationale: 乳を濃く固めた食品を指す語。牧畜社会の食事という文脈に合い、現代の食卓用バターに限定しない訳語とした。
- source_word: חָלָב
  choice: 乳
  rationale: 一般的な乳を指す語。動物種を本文が特定しないため、「牛乳」ではなく「乳」とした。
- source_word: וּבֶן הַבָּקָר
  choice: 子牛
  rationale: 字義的には「家畜の群れの子」であり、若い牛を表す慣用表現。前節で調理された特定の一頭を指す。
- source_word: אֲשֶׁר עָשָׂה
  choice: 料理した
  rationale: עשה は広く「作る、行う」の意だが、食物について用いられているため、ここでは自然に「料理した」とした。
- source_word: וַיִּתֵּן לִפְנֵיהֶם
  choice: 彼らの前に置いた
  rationale: 字義的には「彼らの前に与えた」。客に食物を供する場面なので、「前に置いた」が日本語として自然で正確。
- source_word: וְהוּא עֹמֵד עֲלֵיהֶם
  choice: 彼らのそばに立っていた
  rationale: 字義的には「彼らの上に立っていた」だが、主人として客に付き添い、給仕している文脈を自然に表した。字義的表現は脚注に残した。
- source_word: תַּחַת הָעֵץ
  choice: 木の下で
  rationale: 前置詞句を簡潔で自然な現代日本語に訳した。
- source_word: וַיֹּאכֵלוּ
  choice: 彼らが食べている間
  rationale: ヘブライ語の連続した叙述は字義的には「そして彼らは食べた」だが、直前の継続的な「立っていた」との時間関係を日本語で明確にした。
theological_decisions:
- issue: 訪問者たちの後代の神学的解釈を訳文で前面に出すか
  choice: アブラハムが客をもてなす通常の物語表現として訳す
  alternative: 訪問者の神的身分を示唆するよう、給仕の描写を荘重に訳す
  rationale: この節自体はアブラハムのもてなしを叙述しているため、ヘブライ語に明示されていないキリスト論的・三位一体論的結論を訳文に持ち込まない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。食物の列挙と客への給仕が自然に伝わるようにしつつ、乳製品の特定と位置表現に残る原語の幅を脚注で保持した。
