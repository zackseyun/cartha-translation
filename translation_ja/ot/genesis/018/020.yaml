  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַ/עֲמֹרָ֖ה כִּי רָ֑בָּה וְ/חַ֨טָּאתָ֔/ם כִּ֥י כָבְדָ֖ה מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/020.yaml
  text: Then Yahweh said[a], “The outcry against Sodom and Gomorrah is great[b], and their sin is very severe.”
translation:
  language: ja
  text: そこで、ヤハウェは言った。「ソドムとゴモラを訴える叫びは大きく[a]、彼らの罪は極めて重い[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「ソドムとゴモラの叫び」。ここでは、彼らを訴えて上がった叫びという意味を本文に明示した。
    reason: lexical_alternative
  - marker: b
    text: 「重い」は、罪が非常に重大であることを表すヘブライ語の慣用的な言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……は言った
  rationale: ワウ継続法による物語の進行を、自然な現代日本語で表した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文にある神の固有名を日本語で音写した。
- source_word: זַעֲקַת סְדֹם וַעֲמֹרָה
  choice: ソドムとゴモラを訴える叫び
  rationale: זַעֲקָהは、深刻な悪や抑圧をめぐって上がる訴えの叫びを表し得る。「を訴える」によって、この町々について上がった叫びであるという文脈上の意味を明確にしたが、属格の曖昧さは脚注に残した。
- source_word: כִּי רָבָּה
  choice: 非常に大きく
  rationale: 叫びの規模・強さが大きいことを、平明な日本語で表した。後続句との均衡を考え、「非常に」を補って程度の強さを示した。
- source_word: וְחַטָּאתָם
  choice: 彼らの罪
  rationale: 単数形のחַטָּאתを、住民全体の悪を集合的に指す「罪」として訳した。
- source_word: כִּי כָבְדָה מְאֹד
  choice: 極めて重い
  rationale: כבדの「重い」という比喩を保ちつつ、罪の重大さを表す自然な日本語とした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を用いているため、固有名として音写した。
- issue: 叫びの方向性
  choice: ソドムとゴモラを訴える叫び
  alternative: ソドムとゴモラの叫び
  rationale: 文脈上は両都市の悪について上がった訴えと理解するのが自然だが、ヘブライ語の属格表現自体は「両都市の叫び」とも直訳できるため、その可能性を脚注に示した。
- issue: 罪が「重い」という比喩
  choice: 極めて重い
  alternative: 非常に重大である
  rationale: 道徳的・司法的な深刻さを示す比喩を保持し、解釈を過度に言い換えないようにした。
translation_notes:
  register: 明快な現代標準語を用いながら、神の発言にふさわしい簡潔で厳粛な調子を保った。「極めて重い」により原文の比喩と重みを残した。
