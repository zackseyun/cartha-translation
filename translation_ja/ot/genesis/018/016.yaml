base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/016.yaml
  text: Then the men rose up from there and looked down toward Sodom[b][a], and Abraham was walking with them to send them on their way.
translation:
  language: ja
  text: それから、その人たちはそこから立ち上がり、ソドムの方を見下ろした[a]。アブラハムは彼らを見送るため[b]、一緒に歩いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ソドムの方を見渡した」。ヘブライ語の動詞は、高い場所から眺めることを示唆する。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「彼らを送り出すため」。ここでは、旅立つ客に同行して送り出すことを指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ מִשָּׁם
  choice: そこを立ち上がり
  rationale: קוםの基本義である「立ち上がる」を保ち、直前の場面からの移行を自然な日本語で表した。「出発した」とまでは限定しない。
- source_word: הָאֲנָשִׁים
  choice: その人たち
  rationale: 原文は通常の「人々／男たち」という語を用いている。文脈上の正体を「御使いたち」などと先取りせず、物語の緊張を保つ。日本語では性別を不必要に強調しない自然な表現とした。
- source_word: וַיַּשְׁקִפוּ עַל־פְּנֵי סְדֹם
  choice: ソドムの方を見下ろした
  rationale: שׁקףが示唆する高い場所から外を眺める、または下方を見るニュアンスと、ソドムへの方向性を表した。
- source_word: הֹלֵךְ עִמָּם
  choice: 一緒に歩いていた
  rationale: 分詞הֹלֵךְの継続的・随伴的な動作を「歩いていた」で表した。
- source_word: לְשַׁלְּחָם
  choice: 彼らを見送るため
  rationale: 旅立つ客に同行して送り出すという古代の歓待の含意を、現代日本語で自然な「見送る」によって表した。
theological_decisions:
- issue: הָאֲנָשִׁיםの正体
  choice: 本文では「その人たち」とする
  alternative: 「御使いたち」または「訪問者たち」
  rationale: この節自体は通常の名詞「人々／男たち」を用いており、正体を明示していない。したがって、後の文脈に基づく同定を本文へ持ち込まず、原文の物語的な曖昧さを残した。
translation_notes:
  register: 明瞭で現代的ながら、聖書本文にふさわしい落ち着いた文体とした。「その人たち」は直前から登場する人物を自然に指し、原語の通常名詞を解釈的に言い換えない。「見下ろした」は地形的含意を本文に反映し、別の可能性を脚注に残した。
