base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/022.yaml
  text: Then the men turned from there and went toward Sodom[a], but Abraham still stood before Yahweh.
translation:
  language: ja
  text: その人たちはそこから向きを変え、ソドムへ行った。しかし、アブラハムはなおヤハウェの前に立っていた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 古代の一部の証言には、「ヤハウェはなおアブラハムの前に立っておられた」とある。ヘブライ語マソラ本文は、「アブラハムはなおヤハウェの前に立っていた」としている。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּפְנוּ מִשָּׁם
  choice: そこから向きを変え
  rationale: פנהはここで、それまでいた場所から方向を変えて立ち去る動きを表す。「そこから向きを変え」は、移動の起点と方向転換を自然な日本語で示す。
- source_word: הָאֲנָשִׁים
  choice: その人たち
  rationale: 語義は「その男たち」だが、日本語では文脈上「その人たち」が自然であり、彼らの正体について解釈を加えない。
- source_word: וַיֵּלְכוּ סְדֹמָה
  choice: ソドムの方へ進んで行った
  rationale: 地名に付く方向を示す語尾を「ソドムの方へ」で反映し、הלךによる物語上の移動を「進んで行った」と表した。到着したとまでは限定しない。
- source_word: עוֹדֶנּוּ עֹמֵד
  choice: なお…立っていた
  rationale: 継続を示すעוֹדֶנּוּと状態を表す分詞を、現代日本語で自然な継続表現にした。
- source_word: לִפְנֵי
  choice: 前に
  rationale: 空間的な「前」と、相手の面前・臨在にあるという関係的含意の双方を保つ簡潔な訳。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有の神名を明示し、称号への置換を避ける。
- issue: 末尾の節の本文形
  choice: アブラハムはなおヤハウェの前に立っていた
  alternative: ヤハウェはなおアブラハムの前に立っておられた
  rationale: 提示されたWLCのマソラ本文に従う一方、古代の証言に見られる異読は脚注に残し、本文批評上の緊張を隠さない。
translation_notes:
