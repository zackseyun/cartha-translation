  text: וַֽ/יהֹוָ֖ה אָמָ֑ר הַֽ/מְכַסֶּ֤ה אֲנִי֙ מֵֽ/אַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/017.yaml
  text: And Yahweh said[a], “Shall I hide from Abraham what I am doing?”
translation:
  language: ja
  text: そしてヤハウェは言った。「わたしがしていることを、アブラハムに隠そうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַֽ/יהֹוָה
  choice: そしてヤハウェは
  rationale: 接続辞を物語の自然な連続として「そして」とし、固有の神名 יהוה は音写して「ヤハウェ」とした。
- source_word: אָמָר
  choice: 言った
  rationale: 物語を進めるワイイクトール形なので、自然な単純過去とした。
- source_word: הַֽ/מְכַסֶּה
  choice: 隠しておこうか
  rationale: 疑問辞を伴う分詞は、単なる進行中の動作よりも、ヤハウェの熟慮を表す修辞的な自問として理解した。「しておこうか」は意志・熟慮を自然な日本語で示す。
- source_word: מֵֽ/אַבְרָהָם
  choice: アブラハムに隠す
  rationale: 日本語では「人から隠す」も可能だが、この構文では情報を相手に知らせない意味を自然に表す「人に隠す」を採用した。
- source_word: אֲשֶׁר
  choice: ことを
  rationale: 後続する節を名詞化し、אֲשֶׁר の関係的機能を自然な日本語で表した。
- source_word: אֲנִי עֹשֶׂה
  choice: わたしがしようとしている
  rationale: 字義的には「わたしがしている」だが、文脈上はこれから行う神の行為を指すため、分詞の近接未来的な含みを「しようとしている」で表した。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に明記された固有の契約名を普通名詞的な称号に置き換えず、音写して保持した。
- issue: 神の発言を熟慮の自問と見るか、進行中の行為についての問いと見るか
  choice: 「隠しておこうか」という熟慮の自問
  alternative: 「隠しているのか」
  rationale: 疑問辞を伴う分詞は形の上では現在進行的にも訳せるが、この文脈では神がアブラハムに知らせるかどうかを自問する修辞的・熟慮的用法が適切である。ただし形態上の別訳は脚注に残した。
translation_notes:
  register: 明瞭で現代的ながら、神の発言にふさわしい簡潔で品位ある文体とした。「隠しておこうか」により、独白的な熟慮を自然に表現した。
