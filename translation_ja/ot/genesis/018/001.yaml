id: GEN.18.1
reference: Genesis 18:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּרָ֤א אֵלָי/ו֙ יְהוָ֔ה בְּ/אֵלֹנֵ֖י מַמְרֵ֑א וְ/ה֛וּא יֹשֵׁ֥ב פֶּֽתַח הָ/אֹ֖הֶל כְּ/חֹ֥ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/001.yaml
  text: And Yahweh appeared to him by the oaks of Mamre[a], while he was sitting at the entrance of the tent in the heat of the day.
translation:
  language: ja
  text: ヤハウェはマムレの大木のそばで、彼に現れた[a]。その時、彼は日の暑いころ、天幕の入り口に座っていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「マムレの樫の木々のそばで」または「マムレのテレビンの木々のそばで」とも訳せる。ヘブライ語は、樫やテレビンなどの大木を指し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: 現れた
  rationale: ראהのニファル形が示す目に見える顕現を、解釈を加えず自然な日本語で表す。
- source_word: אֵלָיו
  choice: 彼に
  rationale: 前置詞と三人称男性単数接尾辞を直接反映する。文脈上の指示対象はアブラハムだが、原文同様ここでは代名詞を保つ。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を称号に置き換えず、日本語で音写する。
- source_word: בְּאֵלֹנֵי
  choice: 大木のそばで
  rationale: אֵלוֹןは樫またはテレビンなどの大木を指し得る。樹種が確定しないため、本文では上位概念を用い、異訳を脚注に示す。複数形は日本語では数を明示せず自然に表した。
- source_word: מַמְרֵא
  choice: マムレ
  rationale: 固有名を日本語で音写する。
- source_word: וְהוּא יֹשֵׁב
  choice: その時、彼は……座っていた
  rationale: 分詞による背景描写を、物語として自然な継続状態で表す。
- source_word: פֶּתַח הָאֹהֶל
  choice: 天幕の入り口に
  rationale: פֶּתַחの具体的な意味を保ち、現代日本語として自然に表す。
- source_word: כְּחֹם הַיּוֹם
  choice: 日の暑いころ
  rationale: 一日の暑い時間帯を表す慣用句を、正午など特定の時刻に限定せず訳す。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を用いているため、固有名として音写し、原文上の区別を保つ。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の二つの節を二文に分けて読みやすくしつつ、顕現と背景描写の関係を維持した。
