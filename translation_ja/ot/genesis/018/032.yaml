- from: アブラハムは言った。「どうか、わが主[a]よ、お怒りにならないでください。もう一度だけ申し上げます。もしかすると、そこに十人見つかるかもしれません。」すると、彼は言った。「その十人のために、滅ぼしはしない[b]。」
  to: アブラハムは言った。「どうか、主よ、お怒りにならないでください。もう一度だけ申し上げます。そこに十人が見つかるかもしれません。」彼は言った。「その十人のために、滅ぼしはしない[b]。」
  rationale: 本文の呼びかけを「主よ」として、マソラ本文と文脈が示す神への尊称を自然な日本語で表した。現行注aは神名と神への称号を混同しかねず、かつ人間の「ご主人様」という読みを不適切に前面化するため削除した。神名יהוהとの語彙上の区別を説明する必要がある場合は、当該箇所の本文・注釈方針全体の中で別途扱うのが適切である。
