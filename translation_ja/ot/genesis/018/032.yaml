base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/032.yaml
  text: Then he said[a], “Please, let not my lord be angry, and I will speak only this once more. Perhaps ten will be found there.” And he said[c][b], “I will not destroy it for the sake of the ten.”
translation:
  language: ja
  text: アブラハムは言った。「どうか、主よ、お怒りにならないでください。もう一度だけ申し上げます。そこに十人が見つかるかもしれません。」彼は言った。「その十人のために、滅ぼしはしない[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ヘブライ語は目的語を明示せず、直訳すると「その十人のために、滅ぼさない」。何を滅ぼさないかは文脈から補われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא יִחַר
  choice: どうか……お怒りにならないでください
  rationale: נָאの丁重な願いと、חרהによる「怒りが燃える」という慣用的な意味を、自然で敬意ある現代日本語にした。
- source_word: לַאדֹנָי
  choice: わが主よ
  rationale: 話し相手へのへりくだった呼びかけを保ちつつ、神名יהוהとは区別した。「主」が神への呼びかけとも人への尊称とも受け取れる余地は注で示した。
- source_word: וַאֲדַבְּרָה אַךְ הַפַּעַם
  choice: もう一度だけ申し上げます
  rationale: コホータティブの発言の意志・許しを求める響きと、אַךְ הַפַּעַםの「今回だけ」という限定を、会話として自然な敬語で表した。
- source_word: אוּלַי יִמָּצְאוּן שָׁם עֲשָׂרָה
  choice: もしかすると、そこに十人見つかるかもしれません
  rationale: אוּלַיの可能性と、מצאのニファル形「見つかる」を保持した。十人が義人であることは文脈から理解されるが、原文にない語は補わなかった。
- source_word: לֹא אַשְׁחִית
  choice: 滅ぼしはしない
  rationale: שׁחתのヒフィル形を「滅ぼす」とし、原文で目的語が明示されない点を、日本語でも自然な省略によって保った。
- source_word: בַּעֲבוּר הָעֲשָׂרָה
  choice: その十人のために
  rationale: 冠詞による既出の十人への特定を「その」で示し、בַּעֲבוּרの理由・配慮の意味を「ために」で表した。
theological_decisions:
- issue: アブラハムの呼びかけאֲדֹנָיの指示対象と表記
  choice: わが主よ
  alternative: ご主人様／主なる神よ
  rationale: 物語全体では神的な顕現が語られる一方、この語自体は神名יהוהではない。日本語の「主」が持つ敬称と神への呼称の両方の可能性を残し、どちらか一方に限定しなかった。
- issue: 「十人」の性質
  choice: 十人
  alternative: 十人の正しい者
  rationale: 交渉の文脈では正しい者を指すが、この節のヘブライ語本文は単に「十人」とするため、説明語を本文へ加えなかった。
translation_notes:
  register: 明瞭な現代標準語を基調とし、アブラハムのへりくだった語調は「申し上げます」と丁寧な依頼表現で示した。過度に古風な「怒りを燃やさないでください」などは避けた。
