  text: Abraham and Sarah were old[a], advanced in days; the way of women had ceased to be with Sarah.
translation:
  language: ja
  text: アブラハムとサラは年老い、すでに高齢になっていた。サラには、月のもの[a]がもうなくなっていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「女たちの道」。サラにはもはや月経がなかったことをいう婉曲な表現。
    reason: 原文の慣用的で婉曲な表現の字義と意味を示すため。
lexical_decisions:
- source_word: זְקֵנִים
  choice: 年老い
  rationale: 二人が老年に達していたことを、現代日本語で自然かつ簡潔に表す。
- source_word: בָּאִים בַּיָּמִים
  choice: すでに高齢になっていた
  rationale: 字義的には「日々の中へ入っていた」という年齢に関する慣用句。直前の「年老い」を補強する意味を、分かりやすい日本語で表した。
- source_word: חָדַל לִהְיוֹת
  choice: なくなっていた
  rationale: 「存在することをやめた」という完了した状態を、文脈に即した自然な日本語で表す。
- source_word: אֹרַח כַּנָּשִׁים
  choice: 女性にある月ごとのもの
  rationale: 字義的な「女たちの道」が指す月経を、原文の婉曲さをある程度保ちながら、現代の読者に意味が伝わる表現とした。
- source_word: לְשָׂרָה
  choice: サラには
  rationale: サラの場合にはその生理現象がもはやなかったという関係を、日本語の主題提示で自然に示す。
