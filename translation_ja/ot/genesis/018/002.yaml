id: GEN.18.2
reference: Genesis 18:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּשָּׂ֤א עֵינָי/ו֙ וַ/יַּ֔רְא וְ/הִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים נִצָּבִ֖ים עָלָ֑י/ו וַ/יַּ֗רְא וַ/יָּ֤רָץ לִ/קְרָאתָ/ם֙ מִ/פֶּ֣תַח הָ/אֹ֔הֶל וַ/יִּשְׁתַּ֖חוּ אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/002.yaml
  text: He lifted up his eyes and looked[a], and behold, three men were standing near him. When he saw them[b], he ran from the entrance of the tent to meet them and bowed down to the ground.
translation:
  language: ja
  text: 彼が目を上げて見ると、なんと、三人の男が彼のそばに立っていた[a]。彼は彼らを見ると、天幕の入り口から走って迎えに行き、地にひれ伏した[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼のすぐそばに立っていた」とも訳せる。ヘブライ語の前置詞は近い位置関係を示し得る。
    reason: lexical_alternative
  - marker: b
    text: 「地に身を伏せた」とも訳せる。この動詞は深い敬意を表すしぐさを指し、それだけで必ず「礼拝した」という意味になるわけではない。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: 目を上げて
  rationale: ヘブライ語の生き生きとした慣用表現を保ちつつ、現代日本語として自然にした。
- source_word: וַיַּרְא
  choice: 見ると／彼らを見ると
  rationale: 二度の出現を文脈に即して訳し、視線を上げた後の発見と、それに続く行動の契機を自然に示した。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 眼前に現れた光景を鮮やかに提示する談話標識の働きを、現代日本語で明瞭に伝える。
- source_word: שְׁלֹשָׁה אֲנָשִׁים
  choice: 三人の男
  rationale: 原文が明示する男性三人という叙述をそのまま保った。
- source_word: נִצָּבִים עָלָיו
  choice: 彼のそばに立っていた
  rationale: 前置詞が示し得る近接関係を自然に表し、「上に立つ」のような不要な威圧感は持ち込まない。
- source_word: וַיָּרָץ לִקְרָאתָם
  choice: 走って迎えに行き
  rationale: 動詞の具体的な意味である「走る」と、相手の方へ出て行く迎接の動きを保った。
- source_word: מִפֶּתַח הָאֹהֶל
  choice: 天幕の入り口から
  rationale: פתחの開口部・入り口という意味を、文脈に合う自然な日本語で表した。
- source_word: וַיִּשְׁתַּחוּ אָרְצָה
  choice: 地にひれ伏した
  rationale: 地面に向かって深く身を伏せる身体動作を明確にし、それ自体を直ちに宗教的な礼拝とは限定しない訳語を選んだ。
theological_decisions:
- issue: アブラハムの動作を神的存在への礼拝と訳すべきか
  choice: 「地にひれ伏した」と訳す
  alternative: 「礼拝した」
  rationale: この動詞は神にも人にも向けられる敬意ある平伏を表し得る。この節では訪問者がまず「三人の男」として提示されるため、「礼拝した」とすると本文がまだ明示していない神学的解釈を先取りすることになる。
translation_notes:
  register: 明瞭で格調のある現代標準日本語。物語の鮮やかさを「なんと」で示し、「天幕」「ひれ伏す」により聖書叙事としての品位を保った。脚注記号は該当する語句の直後に配置した。
