  text: וְ/אֶקְחָ֨ה פַת לֶ֜חֶם וְ/סַעֲד֤וּ לִבְּ/כֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי עַל כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל עַבְדְּ/כֶ֑ם וַ/יֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/005.yaml
  text: And let me bring a morsel of bread[a], so that you may refresh your hearts; after that you may pass on, since this is why you have passed by your servant. And they said, “Yes[b], do as you have said.”
translation:
  language: ja
  text: 「パンを少しお持ちします[a]。それで元気をつけて[b]から、旅をお続けください。そのために、あなたがたはこの僕のところを通りかかられたのですから。」彼らは言った。「では、あなたの言ったとおりにしてください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「一切れのパン」。客をもてなす際の控えめな言い方である。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「あなたがたの心を支えて」。食事によって力を取り戻すことを表す慣用句。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶקְחָה
  choice: お持ちします
  rationale: 一人称単数コホータティブの申し出を、客をもてなす場面に合う自然で丁重な日本語にした。
- source_word: פַת לֶחֶם
  choice: パンを少し
  rationale: 直訳的には「一切れのパン」。実際にはより豊かな食事を用意する前の、アブラハムの控えめな申し出を自然な日本語で表した。
- source_word: וְסַעֲדוּ לִבְּכֶם
  choice: それで元気をつけて
  rationale: 字義的な「心を支える／力づける」は、食物によって力を回復することを表すヘブライ語の慣用句である。日本語では意味が明瞭な表現を本文に置き、原語の比喩を注記した。
- source_word: אַחַר תַּעֲבֹרוּ
  choice: それから、旅をお続けください
  rationale: ここでの עבר は客人がその場を去って旅を続けることを指す。「通り過ぎる」より文脈に自然な表現とした。
- source_word: כִּי עַל כֵּן
  choice: そのために……のですから
  rationale: アブラハムの申し出の理由を示す定型的な表現。もてなしを受けるために来たのだ、という丁重な歓待の言い回しとして訳した。
- source_word: עֲבַרְתֶּם עַל עַבְדְּכֶם
  choice: あなたがたはこの僕のところを通りかかられた
  rationale: עבר の移動の意味を保ちつつ、עַל עַבְדְּכֶם をアブラハムのもとに立ち寄ったという文脈で表した。
- source_word: עַבְדְּכֶם
  choice: この僕
  rationale: 奴隷身分の主張ではなく、客に対する謙譲的な自称なので「僕」とした。
- source_word: כֵּן תַּעֲשֶׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: では、あなたの言ったとおりにしてください
  rationale: 簡潔な同意と、直前の申し出どおりにするよう求める応答を自然な会話文で表した。
theological_decisions:
- issue: כִּי עַל כֵּן が示す来訪の目的
  choice: 「そのために……通りかかられた」と、アブラハムの歓待上の言い方をそのまま保つ
  alternative: 「せっかく私のところを通りかかられたのですから」と、単なる機会・理由として弱める
  rationale: 原文は目的・理由の関係を強く述べているため、その緊張を解消せずに残した。特定の神学的意図までは本文に加えていない。
translation_notes:
  register: 現代の一般読者に明瞭な、丁重で品位ある語り口を採用した。アブラハムの謙譲表現と客人への敬意を、「この僕」「通りかかられた」「お続けください」で示した。
