base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/023.yaml
  text: Then Abraham came near and said[a], “Will you indeed sweep away the righteous with the wicked?”
translation:
  language: ja
  text: そこで、アブラハムは近寄って言った。「あなたは本当に、正しい者を悪しき者と共に滅ぼし尽くされるのですか。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「滅ぼし尽くされる」は、「一掃する」「取り除く」とも訳せる。ヘブライ語の動詞は、裁きによって除き去ることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: 近寄って
  rationale: נגשׁの基本義である接近を自然な日本語で表し、アブラハムが執り成しのために進み出る動きも保つ。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: וַיֹּאמַר
  choice: 言った
  rationale: אמרの通常の物語用法を、明瞭で自然な現代日本語にした。
- source_word: הַאַף
  choice: 本当に
  rationale: 疑問辞הと強意的なאַףが作る、驚きと訴えを帯びた問いの強さを表す。
- source_word: תִּסְפֶּה
  choice: 一掃なさる
  rationale: ספהがここで表す、裁きによって共に取り除くという鮮明な像を保つ。「なさる」により神への直接の問いとして自然な敬意を示す。
- source_word: צַדִּיק
  choice: 正しい者
  rationale: 単数形の総称的用法を保ち、司法的・道徳的なカテゴリーを明瞭に表す。
- source_word: עִם
  choice: と一緒に
  rationale: 裁きにおいて同じ運命に巻き込まれるというעִםの関係を自然な日本語で示す。
- source_word: רָשָׁע
  choice: 悪い者
  rationale: 単数形の総称的用法を保ちつつ、普通の読者に明瞭な対照語とした。「悪人」も可能だが、צַדִּיקとの対応を「者」でそろえた。
theological_decisions:
- issue: 単数形で示された道徳的カテゴリー
  choice: צַדִּיקとרָשָׁעをそれぞれ総称的な単数「正しい者」「悪い者」とした。
  alternative: 複数化して「正しい人々」「悪い人々」とする。
  rationale: ヘブライ語の単数形を尊重しながら、一個人だけでなく、神の裁きに関する一般原則を問う総称的な力を日本語でも保つため。
- issue: 神に対する疑問文の語調
  choice: 「あなたは本当に……なさるのですか」とした。
  alternative: 「まさか……滅ぼされるのですか」または「……するのか」とする。
  rationale: 原文の強い問いと驚きを保ちつつ、「まさか」で否定の予断を過度に加えず、現代日本語として神への直接話法にふさわしい敬意を示すため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会話には自然な敬語を採用した。「近寄って」「本当に」「一掃」により、原文の身体的な接近、強い疑問、裁きの鮮明な比喩を保った。
