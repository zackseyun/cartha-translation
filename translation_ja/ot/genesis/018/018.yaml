  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְ/ג֥וֹי גָּד֖וֹל וְ/עָצ֑וּם וְ/נִ֨בְרְכוּ ב֔/וֹ כֹּ֖ל גּוֹיֵ֥י הָ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/018.yaml
  text: Abraham will surely become a great and mighty nation[a], and all the nations of the earth will be blessed in him.
translation:
  language: ja
  text: アブラハムは必ず大きく力強い国民となり、地上のすべての国々は彼にあって祝福される[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地上のすべての国々は、彼によって自らを祝福する」。ヘブライ語の形はこの意味にも理解できるが、本文では受動の意味に取った。
    reason: alternative_reading
lexical_decisions:
- source_word: הָיוֹ יִהְיֶה
  choice: 必ず…となり
  rationale: 不定詞絶対形と未完了形の組み合わせによる強意と未来性を、自然な現代日本語で表した。לְגוֹי を伴うため、単なる存在ではなく「国民となる」とした。
- source_word: לְגוֹי גָּדוֹל וְעָצוּם
  choice: 大きく力強い国民
  rationale: גוי は集団としての民を指すため「国民」とし、גדול と עצום は規模・偉大さと強さをそれぞれ保つよう「大きく力強い」と訳した。
- source_word: וְנִבְרְכוּ
  choice: 祝福される
  rationale: ברך のニファル形を受動と理解し、諸国がアブラハムとの関係において祝福を受けるという意味を本文に採った。再帰的理解も可能なので脚注に残した。
- source_word: בוֹ
  choice: 彼にあって
  rationale: 前置詞 ב の結びつき・領域を示す曖昧さを保ち、「彼を通して」と因果的・媒介的に限定することを避けた。
- source_word: כֹּל גּוֹיֵי הָאָרֶץ
  choice: 地上のすべての国々
  rationale: 普遍的範囲を示す定型句として訳し、前半の גוי との語義上のつながりも保った。
theological_decisions:
- issue: アブラハムの祝福の定式における וְנִבְרְכוּ の解釈
  choice: 諸国はアブラハムにあって「祝福される」
  alternative: 諸国は彼を引き合いに出して「自らを祝福する」
  rationale: ニファル形は受動にも再帰にも理解され得る。本文では文脈に適合する受動を採用し、可能な再帰的解釈を脚注に示して、原文の解釈上の幅を保持した。
translation_notes:
  register: 明瞭で現代的かつ品位ある文体。「彼にあって」は日常語よりやや格調があるが、בּוֹ の関係性を過度に説明せず保つために用いた。
