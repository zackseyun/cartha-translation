  text: וַ/יֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֨י/ךָ֙ כָּ/עֵ֣ת חַיָּ֔ה וְ/הִנֵּה בֵ֖ן לְ/שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וְ/שָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָ/אֹ֖הֶל וְ/ה֥וּא אַחֲרָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/010.yaml
  text: And he said[a], “I will surely return to you about this time next year, and behold[c][b], Sarah your wife will have a son.” And Sarah was listening at the entrance of the tent behind him.
translation:
  language: ja
  text: 彼は言った。「来年の今ごろ、わたしは必ずあなたのもとに戻って来る。見よ、あなたの妻サラには男の子が生まれる。」サラは天幕の入口で聞いていた。その入口は彼の後ろにあった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「そして、それは彼の後ろにあった」。ヘブライ語の男性単数代名詞は文法上「入口」を指すと読めるが、簡潔な表現のため、サラが話者の後ろにいたと理解する余地もある。
    reason: 原文末尾の וְהוּא אַחֲרָיו における代名詞の指示関係と統語上の曖昧さを示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: その方は言った
  rationale: ヘブライ語は三人称男性単数だけで話者を明示しない。「彼」より自然な日本語としつつ、主または三人のうちの一人と特定しない。
- source_word: שׁוֹב אָשׁוּב
  choice: わたしは必ず…戻って来る
  rationale: 不定詞絶対形と未完了形の組み合わせによる強意を「必ず」で表した。
- source_word: כָּעֵת חַיָּה
  choice: 来年の今ごろ
  rationale: 字義的には解釈の幅がある慣用句だが、文脈上は同じ季節が巡るころ、すなわち翌年の今ごろを指す。
- source_word: וְהִנֵּה
  choice: その時、見よ
  rationale: 注意を促す提示の力を「見よ」で保ち、日本語の文脈を整えるため「その時」を添えた。
- source_word: בֵן לְשָׂרָה אִשְׁתֶּךָ
  choice: あなたの妻サラには息子がいる
  rationale: לְ の所有・帰属を自然に表し、帰還時には約束の子が生まれているというヘブライ語の名詞節を保った。
- source_word: שָׂרָה שֹׁמַעַת
  choice: サラは…聞いていた
  rationale: 分詞の継続的な場面描写を「聞いていた」で表した。「耳を傾けていた」として意図性を過度に強めない。
- source_word: פֶּתַח הָאֹהֶל וְהוּא אַחֲרָיו
  choice: その方の後ろにある天幕の入り口で
  rationale: 男性単数代名詞 הוּא は文法的に男性の「入り口」を受けると理解し、その入り口が話者の後ろにあったという位置関係を自然な日本語にした。
theological_decisions:
- issue: 話者の同定
  choice: 「その方」とし、固有の同定を加えない
  alternative: 「主は言った」または「一人が言った」
  rationale: この節の動詞自体には主語名が明記されていないため、周辺文脈に基づく同定を本文へ補わない。
- issue: 「その方の後ろ」の指示関係
  choice: 天幕の入り口が話者の後ろにあると読む
  alternative: サラが話者の後ろにいたと簡潔にまとめる、または別の男性を主語とする
  rationale: וְהוּא の男性単数は、文法的に男性名詞 פֶּתַח（入り口）を受けることができる。ただし原文は簡潔で指示関係に曖昧さが残るため脚注を付した。
translation_notes:
  register: 現代標準日本語の中で、物語として自然でありながら荘重さを保った。「見よ」は原文の提示表現を残すため意図的に用いた。話者を「主」などと明示せず、原文の省略を尊重した。
