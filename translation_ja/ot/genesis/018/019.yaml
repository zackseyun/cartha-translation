id: GEN.18.19
reference: Genesis 18:19
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֣י יְדַעְתִּ֗י/ו לְמַעַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת בָּנָ֤י/ו וְ/אֶת בֵּית/וֹ֙ אַחֲרָ֔י/ו וְ/שָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהוָ֔ה לַ/עֲשׂ֥וֹת צְדָקָ֖ה וּ/מִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהוָה֙ עַל אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר דִּבֶּ֖ר עָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/019.yaml
  text: For I have known him[a], so that he may command his children and his household after him, and they may keep the way of Yahweh by doing righteousness and justice[d][c][b], so that Yahweh may bring upon Abraham what he has spoken concerning him.
translation:
  language: ja
  text: わたしが彼を知っているのは[a]、彼が彼の後に続く子らと家の者たちに命じ、彼らが正義と公正を行うことによってヤハウェの道を守るためである[b]。それによってヤハウェが、アブラハムについて語ったことをアブラハムにもたらすためである[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしが彼を選んだのは」。ヘブライ語の動詞は通常「知る」を意味するが、ここでは特別に顧みて選ぶという含みを持つ可能性がある。
    reason: alternative_reading
  - marker: b
    text: 「ヤハウェの道」とは、ヤハウェが求める生き方を指す。
    reason: cultural_note
  - marker: c
    text: 別訳「アブラハムに約束したこと」。原文はより字義的には「アブラハムについて語ったこと」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדַעְתִּיו
  choice: わたしが彼を知っている
  rationale: ידעの基本義「知る」を本文に保ちつつ、ここでの継続的な関係的認知を自然な日本語で表した。神による特別な選びという含意はあり得るが、本文で断定せず脚注に示した。
- source_word: בָּנָיו וְאֶת־בֵּיתוֹ אַחֲרָיו
  choice: 自分の後に続く子どもたちと家の者たち
  rationale: בניםは文法上男性複数だが、この継承的文脈では子孫・子どもたちを指し得る。ביתは建物ではなく家族・使用人を含む家共同体なので「家の者たち」とした。אַחֲרָיוの後継・継承の意味も明示した。
- source_word: וְשָׁמְרוּ דֶּרֶךְ יְהוָה
  choice: 彼らが…ヤハウェの道を守る
  rationale: שמרはここでは生活規範に忠実に従うことを表す。「道」という倫理的比喩を保持し、神名יהוהは「ヤハウェ」とした。
- source_word: לַעֲשׂוֹת צְדָקָה וּמִשְׁפָּט
  choice: 正義と公正を行って
  rationale: צדקהとמשפטの対を二語で保持した。行為を表すלעשותを「行って」と訳し、これがヤハウェの道を守る具体的なあり方であることを示した。
- source_word: הָבִיא יְהוָה עַל־אַבְרָהָם
  choice: ヤハウェが…彼の身に実現する
  rationale: 直訳的な「アブラハムの上にもたらす」は日本語では不自然なため、עַלの及ぶ対象を「彼の身に」とし、語られた事柄が成就する意味を「実現する」で表した。
- source_word: אֵת אֲשֶׁר דִּבֶּר עָלָיו
  choice: アブラハムについて語ったこと
  rationale: דבר עלの字義に沿って「について語った」とし、それが約束を指す可能性は脚注に残した。
theological_decisions:
- issue: ידעが神の選びを意味するか、知ることを意味するか
  choice: わたしが彼を知っている
  alternative: わたしが彼を選んだ
  rationale: 文脈には特別な顧みや選びの含意があるが、動詞自体の通常の意味は「知る」である。神学的含意を本文で確定せず、代替解釈を脚注に示した。
- issue: יהוהの表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文にある神の固有名を称号へ置き換えず、一般的な日本語音写で示した。
- issue: 二つのלמעןによる目的の連鎖
  choice: 「…ためである」を二度用いて保持
  alternative: 後半を単なる結果として訳す
  rationale: アブラハムが家の者に命じること、その結果として神の語ったことが実現することの緊張を保ち、目的・結果のどちらか一方に狭く限定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話としての荘重さを保った。「知る／選ぶ」「語る／約束する」の解釈上の幅は本文で一方に決め切らず、脚注で提示した。
