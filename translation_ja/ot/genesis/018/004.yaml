  text: יֻקַּֽח נָ֣א מְעַט מַ֔יִם וְ/רַחֲצ֖וּ רַגְלֵי/כֶ֑ם וְ/הִֽשָּׁעֲנ֖וּ תַּ֥חַת הָ/עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/004.yaml
  text: Please let a little water be brought[a], and wash your feet[b], and rest yourselves under the tree.
translation:
  language: ja
  text: 少し水をお持ちしますので、足を洗い、この木の下でお休みください。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יֻקַּח נָא
  choice: 持って来させますので
  rationale: לקחの受動・願望的用法と依頼を表すנָאを、客人への丁重な申し出として自然な日本語にした。水が運ばれて来るという意味を保ちつつ、字義的で不自然な受動表現を避けた。
- source_word: מְעַט מַיִם
  choice: 少し水を
  rationale: 少量の水という字義と、アブラハムの控えめなもてなしの表現を保った。
- source_word: וְרַחֲצוּ רַגְלֵיכֶם
  choice: 足を洗い
  rationale: 二人称男性複数への命令形だが、文全体を丁重な勧めとして訳した。日本語では所有代名詞を明示しなくても客人自身の足だと明確である。
- source_word: וְהִשָּׁעֲנוּ
  choice: お休みください
  rationale: שעןのニファル形が持つ「身を寄せる・もたれる・横になる」という意味を、木陰でもてなす場面に即して自然に表した。
- source_word: תַּחַת הָעֵץ
  choice: この木の下で
  rationale: 定冠詞の付いた特定の木を、目前の対象を指す自然な日本語「この木」で表した。
theological_decisions: []
translation_notes:
  register: 現代の標準的な敬語を用い、アブラハムの丁重で控えめなもてなしを表現した。「お休みください」は単なる睡眠ではなく、木陰で身を休める意味である。原文の連続する勧めを、日本語として滑らかな一文に整えた。
