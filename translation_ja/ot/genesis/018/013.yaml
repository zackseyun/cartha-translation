base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/013.yaml
  text: And the LORD said to Abraham, “Why did Sarah laugh, saying, ‘Will I really bear a child, now that I am old?’”
translation:
  language: ja
  text: 主はアブラハムに言われた。「なぜサラは笑って、『私は年老いているのに、本当に子を産むのだろうか』と言ったのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神名を、現代日本語の聖書文体で広く理解される敬称「主」で表した。
- source_word: הַאַף אֻמְנָם
  choice: 本当に…のだろうか
  rationale: 疑問辞と強意表現が示す驚きと疑念を、自然な現代日本語の反語的な問いとして表した。
- source_word: אֵלֵד
  choice: 子を産む
  rationale: 動詞の一人称単数形を明示し、日本語として自然になるよう目的語「子」を補った。
- source_word: וַאֲנִי זָקַנְתִּי
  choice: 私は年老いているのに
  rationale: 完了形が示す現在の老齢状態と、出産への対比を「のに」で自然に表現した。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: 主
  alternative: ヤハウェ
  rationale: 本文の意味を損なわず、日本語聖書で定着した表記を採用した。特定の教派的解釈は加えていない。
- issue: サラの問いのニュアンス
  choice: 「本当に子を産むのだろうか」
  alternative: 「まことに子を産むのか」
  rationale: 原文の強意と疑問を保ちつつ、神の約束を不可能と断定する形にはせず、驚きと疑念の緊張を残した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。会話部分は日常的に理解できる表現としつつ、物語文では「言われた」を用いて厳かな調子を保った。
