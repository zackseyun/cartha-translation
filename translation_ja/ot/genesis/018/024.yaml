revisions:
- from: もし町の中に正しい者が五十人いるとしたら、それでもあなたは本当に町を滅ぼし、その中にいる五十人の正しい者のために、その場所を滅ぼさずにおかれないのですか。[a]
  to: もし町の中に正しい者が五十人いるとしたら、あなたは本当にその町を滅ぼし、その中にいる五十人の正しい者のために、その町を見逃されないのですか。[a]
  rationale: 二つの否定を含む日本語表現を、原文の「滅ぼす」と「容赦しない」の並列に対応する「滅ぼし……見逃されない」へ改めた。これにより、修辞疑問の訴えと、正しい者のゆえに町を助けるという焦点を、意味を反転させずに自然な現代日本語で表した。
