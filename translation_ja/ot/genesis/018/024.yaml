source:
  edition: WLC
  text: אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר הַ/אַ֤ף תִּסְפֶּה֙ וְ/לֹא תִשָּׂ֣א לַ/מָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַ/צַּדִּיקִ֖ם אֲשֶׁ֥ר בְּ/קִרְבָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/024.yaml
  text: Suppose there are fifty righteous people within the city[c][b][a]. Will you indeed sweep it away and not spare the place for the sake of the fifty righteous who are within it?
translation:
  language: ja
  text: もし町の中に正しい者が五十人いるとしたら、あなたは本当にその町を滅ぼし、その中にいる五十人の正しい者のために、その町を見逃されないのですか。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「その町をお赦しにならないのですか」とも訳せる。
    reason: נשאはこの文脈で、正しい者のゆえに町への滅びを差し控える、すなわち「見逃す／容赦する」ことを表す。一方で「赦す」と訳すことも可能である。
lexical_decisions:
- source_word: אוּלַי יֵשׁ
  choice: もし……いるとしたら
  rationale: アブラハムが提示する仮定を、現代日本語で自然に表す。「もしかすると……いるかもしれません」とも訳せるが、ここでは後続の修辞疑問とのつながりを明確にした。
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: 正しい者が五十人
  rationale: צַדִּיקִםは性別を限定せず、神の前で正しい人々を指すため、「男」ではなく「者」とした。
- source_word: בְּתוֹךְ הָעִיר
  choice: 町の中に
  rationale: 町の領域内にいるという位置関係を、簡潔で自然な日本語で表した。
- source_word: הַאַף
  choice: それでも……本当に
  rationale: 驚きと強い問いかけを伴う修辞疑問の強調を表す。文脈上の対比も「それでも」で示した。
- source_word: תִּסְפֶּה
  choice: 滅ぼし
  rationale: 裁きによって一掃するという意味を、過度に比喩的にならない明瞭な日本語で表した。
- source_word: וְלֹא תִשָּׂא לַמָּקוֹם
  choice: その場所を滅ぼさずにおかれない
  rationale: 直後の「正しい者のために」と結びつき、町への滅びを差し控えるという文脈上の意味を明示した。動詞נשאが持ち得る「赦す」の含みは脚注に残した。
- source_word: לְמַעַן
  choice: ……のために
  rationale: 正しい者たちを理由として町への裁きを差し控える、という根拠・配慮を表す。
- source_word: אֲשֶׁר בְּקִרְבָּהּ
  choice: その中にいる
  rationale: 先行する五十人の正しい者を修飾する関係節を明示し、町の内部にいることを自然に表した。
theological_decisions:
- issue: נשאを「滅ぼさずにおく」とするか「赦す」とするか
  choice: 本文では「その場所を滅ぼさずにおく」とした。
  alternative: 「その場所を赦す」または「その場所を容赦する」。
  rationale: 直前の「滅ぼす」と対照をなし、正しい者のゆえに町への滅びを差し控えることが直接の焦点であるため。ただし、原語には赦免の語感もあり得るので脚注で示し、意味を一つに固定しすぎないようにした。
translation_notes:
  register: アブラハムが神に畏れをもって迫る修辞疑問として、丁寧語を用いながらも訴えの強さを保った。「都市」より一般読者に自然な「町」を採用し、全体を明瞭で格調ある現代標準日本語に整えた。
