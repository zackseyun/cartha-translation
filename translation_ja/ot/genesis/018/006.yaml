base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/006.yaml
  text: So Abraham hurried into the tent to Sarah and said[a], “Quickly[b], knead three seahs of fine flour and make cakes.”
translation:
  language: ja
  text: そこでアブラハムは急いで天幕の中のサラのところへ行き、言った。「急いで、上等な小麦粉三セア[a]分をこねて、パンを作りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 一セアは古代の乾量単位。三セアはおよそ20～22リットル。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 急いで
  rationale: 動作の速さと物語の切迫感を、自然な現代日本語で表す。
- source_word: הָאֹהֱלָה אֶל שָׂרָה
  choice: 天幕の中のサラのところへ行き
  rationale: 方向を示す語尾と前置詞句を合わせ、アブラハムが天幕内にいるサラのもとへ向かったという文脈を明確にする。
- source_word: מַהֲרִי
  choice: 急いで
  rationale: サラに向けられた女性単数命令形の切迫感を、簡潔で自然な命令として訳す。
- source_word: שְׁלֹשׁ סְאִים
  choice: 三セア
  rationale: 具体的な古代の乾量単位を保持し、その量は脚注で説明する。
- source_word: קֶמַח סֹלֶת
  choice: 上等な小麦粉
  rationale: קֶמַחは粉、סֹלֶתは良質で細かくひかれた穀粉を指す。日本語では料理材料として自然な「上等な小麦粉」とした。
- source_word: לוּשִׁי
  choice: こね
  rationale: 単なる混合ではなく、生地をこねる具体的な動作を表す。目的語は日本語では文脈上補える。
- source_word: וַעֲשִׂי עֻגוֹת
  choice: パンを作りなさい
  rationale: עֻגוֹתは丸く平たいパンを指し得るが、形や焼き方を本文で過度に限定せず、現代日本語で誤解されにくい「パン」とする。
