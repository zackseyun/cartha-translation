base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/014.yaml
  text: Is anything too difficult for Yahweh? At the appointed time I will return to you[a], about this time next year[b], and Sarah will have a son.
translation:
  language: ja
  text: ヤハウェにとって、何か難しすぎることがあるだろうか。[a] 定められた時、すなわち来年の今ごろ[b]、私はあなたのもとに戻って来る。サラには男の子がいるだろう。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あまりに不思議なことがあるだろうか」。ヘブライ語の動詞は、「並外れた」「不思議な」、また「能力を超えた」という意味を表し得る。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語の難しい慣用句は、字義的には「命の時のように」と読める。通常、翌年の同じ時期を指すと理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיִפָּלֵא
  choice: 難しすぎることがあるだろうか
  rationale: פלא のニファル形は、驚くべきこと、並外れたこと、能力を超えることを表し得る。ここでは修辞疑問として、ヤハウェの力を超えるものがあるかを自然な現代日本語で示しつつ、「不可能」と断定して語義を狭めることを避けた。
- source_word: מֵיְהוָה
  choice: ヤハウェにとって
  rationale: מן はここで能力上の限界・比較を示すため、日本語では「ヤハウェにとって」が自然である。神名 יהוה は固有名として「ヤハウェ」とした。
- source_word: דָּבָר
  choice: こと
  rationale: דבר は「物事・事柄・言葉」など広い意味を持つ。この修辞疑問では「こと」が簡潔で自然であり、意味範囲を不必要に限定しない。
- source_word: לַמּוֹעֵד
  choice: 定められた時
  rationale: מועד の、指定され定められた時という意味を明確に保つ表現である。
- source_word: אָשׁוּב אֵלֶיךָ
  choice: 私はあなたのもとに戻って来る
  rationale: שוב の「戻る」と、אֶל の方向性を自然な日本語で表した。「あなた」は男性単数で、文脈上アブラハムを指すが、本文では明示を加えない。
- source_word: כָּעֵת חַיָּה
  choice: 来年の今ごろ
  rationale: 字義的には「命の時のように／命の時に」とも取れる難解な慣用句だが、文脈上は次の年の同じころを指す。「来年の今ごろ」は現代日本語で明瞭であり、字義的背景は脚注に残した。
- source_word: וּלְשָׂרָה בֵן
  choice: その時、サラには男の子が生まれる
  rationale: 原文は動詞のない「そしてサラに男の子」という構文である。前の未来表現を受ける約束として、日本語では「男の子が生まれる」と自然に補った。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 「主」または「エホバ」
  rationale: 原文には四文字神名が明記されているため、称号に置き換えず、一般的な学術的再構音に基づく固有名「ヤハウェ」とした。
- issue: 修辞疑問の強さ
  choice: 難しすぎることがあるだろうか
  alternative: 「不可能なことがあるだろうか」または「驚くべきことがあるだろうか」
  rationale: 文脈は約束を実現するヤハウェの力を強調する。「不可能」は語義を強めすぎる可能性があり、「驚くべき」は神にとって驚きかという別の含みを生み得るため、能力を超えるという含意を保つ表現を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発言にふさわしい簡潔で格調ある調子とした。難解な慣用句は本文で自然に訳し、原語の曖昧さを脚注で保持した。
