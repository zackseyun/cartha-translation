  text: וַ/יֹּ֗אמֶר הִנֵּֽה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י אוּלַ֛י יִמָּצְא֥וּ/ן שָׁ֖ם עֶשְׂרִ֑ים וַ/יֹּ֨אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּ/עֲב֖וּר הָֽ/עֶשְׂרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/031.yaml
  text: Then he said[a], “See now, I have undertaken to speak to my Lord. Perhaps twenty will be found there.” And he said[b], “I will not destroy it for the sake of the twenty.”
translation:
  language: ja
  text: そこでアブラハムは言った。「どうか、私はあえて主に申し上げます。もしかすると、そこに二十人が見つかるかもしれません。」主は言った。「その二十人のために、私は滅ぼさない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה נָא
  choice: どうか、お聞きください
  rationale: 注意を促す二つの小辞を、アブラハムの丁重な語調に合う自然な現代日本語で表した。直訳的な「ご覧ください」より、発言の導入として明瞭である。
- source_word: הוֹאַלְתִּי
  choice: 私はあえて
  rationale: 神に語りかける大胆さとへりくだりを保つ。「始めました」では文脈上の畏れが弱く、「差し出がましくも」では過度に解釈的である。
- source_word: לְדַבֵּר אֶל אֲדֹנָי
  choice: 主に申し上げます
  rationale: אֲדֹנָיを神への尊称「主」とし、לְדַבֵּר אֶלは敬意ある日本語の発話表現で訳した。
- source_word: אוּלַי
  choice: もしかすると
  rationale: 執り成しにおける控えめな可能性の提示を自然に表す。
- source_word: יִמָּצְאוּן שָׁם עֶשְׂרִים
  choice: そこに二十人いるかもしれません
  rationale: ヘブライ語は受動形で「二十人が見いだされる」だが、日本語では人数の存在を述べる表現が自然であり、אוּלַיと合わせて可能性を示した。文脈上「人」を補った。
- source_word: לֹא אַשְׁחִית
  choice: 私は滅ぼさない
  rationale: 目的語は文脈から明らかなため、原文同様に明示せず、שׁחתの使役形が示す破滅を「滅ぼす」で表した。
- source_word: בַּעֲבוּר הָעֶשְׂרִים
  choice: その二十人のために
  rationale: 定冠詞を「その」で反映し、二十人を理由として町を容赦する執り成しの論理を示した。
theological_decisions:
- issue: アブラハムの呼びかけ אֲדֹנָי
  choice: 主
  alternative: わが主／ご主人様
  rationale: この文脈の相手は神であるため神への尊称「主」とした。ただし、この節にない神名YHWHは補わない。
- issue: לֹא אַשְׁחִית の省略された目的語
  choice: 目的語を補わず「滅ぼさない」
  alternative: それを滅ぼさない／町を滅ぼさない
  rationale: 対象はソドムないし問題となっている場所だが、原文は目的語を明示しない。特定範囲を断定せず、文脈に委ねた。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。アブラハムの丁重さは「どうか」「申し上げます」で、同時に大胆さは「あえて」で表現した。話者の識別を自然にするため、最初の「彼」は文脈上の人物名「アブラハム」、後半は「主」とした。
