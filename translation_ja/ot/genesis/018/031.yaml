revisions:
- from: そこでアブラハムは言った。「どうか、お聞きください。私はあえて主に申し上げます。もしかすると、そこに二十人いるかもしれません。」主は言った。「その二十人のために、私は滅ぼさない。」
  to: そこでアブラハムは言った。「どうか、私はあえて主に申し上げます。もしかすると、そこに二十人が見つかるかもしれません。」主は言った。「その二十人のために、私は滅ぼさない。」
  rationale: 原文の丁重な導入表現を保ちつつ、「お聞きください」が加えていた命令的意味を除いた。また、「見つかる」により人数が「見いだされる」という原文の受動表現を反映した。その他の語順、敬語、神への尊称、および目的語を省く「滅ぼさない」は維持した。
