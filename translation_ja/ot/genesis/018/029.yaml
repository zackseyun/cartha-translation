base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/029.yaml
  text: He spoke to him again and said[a], “Perhaps forty will be found there.” And he said[b], “I will not do it for the sake of the forty.”
translation:
  language: ja
  text: アブラハムはさらに主に語りかけて言った。「もしかすると、そこに四十人が見つかるかもしれません。」主は言った。「その四十人のためなら、わたしはそうしない。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「そうしない」は、文脈上、町を滅ぼさないことを指す。ヘブライ語は単に「行わない」とし、何を行わないのかを明示していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד לְדַבֵּר
  choice: さらに……言った
  rationale: יסף＋עוד＋不定詞が表す発話の継続・反復を、重すぎない自然な日本語で示した。
- source_word: אֵלָיו
  choice: その方に
  rationale: 前置詞 אֶל の方向性を「に」で表した。文脈上の相手を尊重しつつ、原文どおり固有名は補わなかった。
- source_word: אוּלַי
  choice: もしかすると……かもしれません
  rationale: アブラハムが控えめに可能性を提示する語調を、現代日本語の丁寧な仮定表現で示した。
- source_word: יִמָּצְאוּן
  choice: 見つかる
  rationale: מצא のニファル形が持つ受動の意味を保持した。
- source_word: אַרְבָּעִים
  choice: 四十人
  rationale: 数詞を直接訳し、文脈上数えられているのが人であるため、日本語に必要な助数的表現「人」を補った。
- source_word: לֹא אֶעֱשֶׂה
  choice: わたしはそうはしない
  rationale: 原文が動作の目的語を明示しない省略表現であることを保ちつつ、日本語として自然にした。
- source_word: בַּעֲבוּר הָאַרְבָּעִים
  choice: その四十人のために
  rationale: 執り成しの文脈に即して、理由だけでなく彼らに免じる意味を表す「ために」とした。
theological_decisions:
- issue: לֹא אֶעֱשֶׂה における神の行為の省略
  choice: 「そうはしない」とし、行為の内容を本文では明示しない。
  alternative: 「町を滅ぼさない」または「それを行わない」
  rationale: ヘブライ語は「行う」の対象を文脈に委ねている。滅ぼす行為を指すことは明らかだが、本文では原文の省略と含みを保持した。
translation_notes:
  register: 明快な現代標準語を用い、アブラハムの控えめで敬意ある語調を「もしかすると……かもしれません」で表した。語り手の代名詞は固有名に置き換えず、「彼」「その方」として原文の指示のあり方を保った。
