  text: וַ/תְּכַחֵ֨שׁ שָׂרָ֧ה לֵ/אמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י יָרֵ֑אָה וַ/יֹּ֥אמֶר לֹ֖א כִּ֥י צָחָֽקְתְּ׀׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/015.yaml
  text: But Sarah denied it[a], saying, “I did not laugh,” because she was afraid. But he said, “No[b], but you did laugh.”
translation:
  language: ja
  text: サラは、恐れていたので、「私は笑いませんでした」と言って否定した[a]。しかし、彼は言った[b]。「いや、あなたは確かに笑った。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「嘘をついた」とも訳せる。ヘブライ語の動詞は、否定することにも、偽りを言うことにも用いられる。ここでは、サラが自分の笑いを否定している。
    reason: lexical_alternative
  - marker: b
    text: この節では話者の名が明記されていない。前後の文脈では、その話者は主と結び付けられている。
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּכַחֵשׁ
  choice: それを否定した
  rationale: ピエル形の動詞は「否定する」と「偽りを言う」の両義を持ちうる。ここでは、自分が笑ったという直前の指摘をサラが否定しているため、本文では自然で過度に断罪的でない表現とした。
- source_word: לֵאמֹר
  choice: 「私は笑いませんでした」と言って
  rationale: 直接話法を導く標準的な引用表現。日本語では引用を動詞「言って」に先行させることで自然な文にした。
- source_word: לֹא צָחַקְתִּי
  choice: 私は笑いませんでした
  rationale: 否定辞と一人称単数完了形を率直に訳した。物語の品位を保つ丁寧体の発話とした。
- source_word: כִּי יָרֵאָה
  choice: 恐れていたので
  rationale: כִּי はここでサラが否定した理由を示す。日本語の自然な因果表現として前置した。
- source_word: וַיֹּאמֶר
  choice: しかし、その方は言った
  rationale: 物語を進める接続に加え、サラの否定への反駁という対照を「しかし」で表した。主語は原節で明示されないため固有名を補わず、文脈上の話者を敬意ある代名表現で示した。
- source_word: לֹא כִּי צָחָקְתְּ
  choice: いや、あなたは確かに笑った
  rationale: 冒頭の לֹא はサラの否定を退け、כִּי は反駁ないし強調として働く。「確かに」によって、単なる陳述ではなく否定への強い訂正を自然に表した。
theological_decisions:
- issue: וַיֹּאמֶר の話者の特定
  choice: 固有名を補わず「その方は言った」と訳す
  alternative: 「主は言った」または「一人の人が言った」
  rationale: この節の当該句は男性単数の動詞だけで、主語を明示的に言い直していない。周囲の文脈では話者は主と結び付けられるが、本文以上の特定を本文訳へ持ち込まず、同時に日本語で主語が曖昧になりすぎない表現とした。
translation_notes:
  register: 明快な現代標準語を用い、地の文は常体、会話は自然で品位ある表現とした。「その方」は文脈上の話者への敬意を保ちつつ、原文にない「主」という明示を本文へ補わないための選択である。脚注記号[a]と[b]は対応箇所に置いた。
