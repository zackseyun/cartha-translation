source:
  edition: WLC
  text: אֵֽרֲדָה נָּ֣א וְ/אֶרְאֶ֔ה הַ/כְּ/צַעֲקָתָ֛/הּ הַ/בָּ֥אָה אֵלַ֖/י עָשׂ֣וּ כָּלָ֑ה וְ/אִם לֹ֖א אֵדָֽעָה־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/021.yaml
  text: I will go down now and see whether they have done altogether according to its outcry that has come to me[a]; and if not[b], I will know.
translation:
  language: ja
  text: わたしは今、下って行って、わたしに届いたその町の叫びのとおりに、彼らがことごとく行っているかどうかを確かめよう[a]。もしそうでなければ、わたしは知ろう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしに届いたその町の叫びに、彼らの行いが完全に一致するのかどうか確かめよう」。ヘブライ語の「行う」と「完了」を組み合わせた表現は、行いがその叫びの内容と全面的に符合するかを問うもの。
    reason: 難解なヘブライ語慣用句の別訳
  - marker: b
    text: 直訳「もしそうでなければ、わたしは知ろう」。何を知るのかは明示されておらず、原文の省略を本文でも残した。
    reason: 原文の省略とコホータティブの説明
lexical_decisions:
- source_word: אֵרֲדָה נָּא
  choice: わたしは今、下って行き
  rationale: 一人称単数のコホータティブが表す決意を「下って行き」で保ち、נָא は他者への依頼ではなく意志の即時性を示すものとして「今」とした。
- source_word: וְאֶרְאֶה
  choice: 確かめよう
  rationale: ここでの ראה は単に視覚で見ることではなく、事実を調べて確認する意味を帯びるため、自然な現代日本語で「確かめよう」とした。
- source_word: הַכְּצַעֲקָתָהּ הַבָּאָה אֵלַי
  choice: わたしに届いたその町の叫びどおり
  rationale: צעקה は重大な不正や苦難から上がる「叫び」。三人称女性単数接尾辞の指示対象を文脈上の町として示しつつ、その叫びが神に達したという関係節を保持した。
- source_word: עָשׂוּ כָּלָה
  choice: 彼らがことごとく行った
  rationale: עשׂה と כָּלָה の難解な結びつきを、叫びが示す内容に行為が全面的に対応しているかという意味で訳した。「悪事」など原文にない目的語は本文に補わなかった。
- source_word: וְאִם לֹא
  choice: もしそうでないなら
  rationale: 直前の全面的一致を否定する条件節として、接続関係を明瞭にした。
- source_word: אֵדָעָה
  choice: わたしは知るだろう
  rationale: ידע の「知る、把握する」を保ち、「突き止める」など説明的な言い換えを避けた。
theological_decisions:
- issue: 神が下って調べるという擬人的叙述
  choice: 「下って行き」「確かめよう」をそのまま保持する
  alternative: 神の全知に合わせて「裁こう」「すでに知っている」と説明的に言い換える
  rationale: ヘブライ語本文は神を人間的な行動様式で描いている。この神学的緊張を翻訳で解消せず、物語の表現として残した。
- issue: 「その町の叫び」の方向性
  choice: 所有・関連を表す「その町の叫び」
  alternative: 「その町に対する訴え」
  rationale: 接尾辞だけでは、町から上がった叫びか町を訴える叫びかを完全には確定できないため、本文では方向性を断定しなかった。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話にふさわしい簡潔で厳かな調子と、原文の条件構文および未解消の曖昧さを保った。
