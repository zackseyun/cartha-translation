source:
  edition: WLC
  text: חָלִ֨לָ/ה לְּ/ךָ֜ מֵ/עֲשֹׂ֣ת כַּ/דָּבָ֣ר הַ/זֶּ֗ה לְ/הָמִ֤ית צַדִּיק֙ עִם רָשָׁ֔ע וְ/הָיָ֥ה כַ/צַּדִּ֖יק כָּ/רָשָׁ֑ע חָלִ֣לָ/ה לָּ֔/ךְ הֲ/שֹׁפֵט֙ כָּל הָ/אָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/025.yaml
  text: Far be it from you to do such a thing—to put the righteous to death with the wicked[a], so that the righteous would be like the wicked. Far be it from you! Shall not the Judge of all the earth do justice?
translation:
  language: ja
  text: あなたがそのようなことをなさるなど、決してあってはなりません。正しい者を悪しき者とともに殺し、その結果、正しい者も悪しき者と同じようになるなど。決してあってはなりません。全地を裁く方が、公正を行われないはずがあるでしょうか。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָלִילָה
  choice: あなたには決してあってはなりません
  rationale: 強い拒絶と道徳的な忌避を表す間投詞。直訳調を避けつつ、アブラハムの大胆で厳粛な訴えを保つ。
- source_word: מֵעֲשֹׂת כַּדָּבָר הַזֶּה
  choice: そのようなことをなさるなど
  rationale: 前置詞付き不定詞が、חָלִילָהの拒絶する行為の内容を示すため、自然な現代日本語で表した。
- source_word: לְהָמִית
  choice: 死なせ
  rationale: מותのヒフィル形の使役的意味を反映する。ここでは神が正しい者を悪い者とともに死に至らせるという想定を表す。
- source_word: צַדִּיק
  choice: 正しい者
  rationale: 道徳的かつ法廷的な意味を保ち、「悪い者」と明確に対比できる一般的な表現。
- source_word: רָשָׁע
  choice: 悪い者
  rationale: 有罪・邪悪という法廷的、道徳的含意を持つ語。現代の一般読者に明瞭で、「正しい者」と自然に対になる。
- source_word: וְהָיָה כַצַּדִּיק כָּרָשָׁע
  choice: 正しい者を悪い者と同じように扱う
  rationale: 語面は「正しい者が悪い者のようになる」だが、文脈では両者が同じ運命を受けることへの抗議であるため、その比較と結果を自然に示した。
- source_word: הֲשֹׁפֵט כָּל הָאָרֶץ
  choice: 全地を裁く方
  rationale: 分詞の実体詞的用法と普遍的範囲を保つ。日本語では「方」として神への敬意を自然に表した。
- source_word: מִשְׁפָּט
  choice: 公正
  rationale: 単なる裁判行為ではなく、正しい裁きを行うことを指す。結句「公正を行う」は倫理的・司法的意味の両方を保つ。
theological_decisions:
- issue: 神の正義に対するアブラハムの修辞疑問
  choice: 全地を裁く方が、公正を行われないはずがあるでしょうか。
  alternative: 全地を裁く方は、正しい裁きをなさらないのでしょうか。
  rationale: 肯定の答えを期待する修辞疑問として訳し、神の公正な性質に訴えるアブラハムの大胆さを弱めない。「公正」はמִשְׁפָּטの倫理的・司法的広がりを保つ。
- issue: 正しい者と悪い者が「同じになる」ことの意味
  choice: 正しい者を悪い者と同じように扱う
  alternative: 正しい者が悪い者のようになる
  rationale: 比較表現の意味を、両者に同じ死の運命を与えることとして明瞭にした。ただし、両者の本質が同一になるという解釈は採らない。
translation_notes:
  register: 現代標準日本語による、明瞭で厳粛な語調。神への直接の訴えなので敬語を用いながら、原文の反復とアブラハムの強い抗議を保持した。
