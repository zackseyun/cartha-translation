  text: וַ/יֹּאמַ֑ר אֲדֹנָ֗/י אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אַל נָ֥א תַעֲבֹ֖ר מֵ/עַ֥ל עַבְדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/003.yaml
  text: And he said[a], “My lord, if I have found favor in your eyes, please do not pass by your servant.”
translation:
  language: ja
  text: そして彼は言った。「わが主よ[a]、もし私があなたの目にかなっているのでしたら、どうかこの僕のそばを通り過ぎないでください。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「主よ」とし、アブラハムが訪問者への敬称ではなく、神に直接呼びかけたと取ることもできる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: そして彼は言った
  rationale: 物語を進める標準的なワウ継続法。ヘブライ語の流れを保ちつつ、発話者を明示する。
- source_word: אֲדֹנָי
  choice: わが主よ
  rationale: 後続の二人称単数形と調和する敬意ある呼びかけ。神への呼称とも高位の訪問者への呼称とも取り得るため、本文では表記によって一方に決めず、注で異読を示す。
- source_word: אִם נָא
  choice: もし…のでしたら
  rationale: 丁重な依頼を導く条件表現。נָאの懇願の調子は、後半の「どうか」にも反映した。
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: 私があなたの目に好意を得ている
  rationale: 原文の「目に」という比喩を残しつつ、好意的に受け入れられているという慣用句の意味が現代日本語でも伝わるようにした。
- source_word: אַל נָא
  choice: どうか…ないでください
  rationale: 否定の要請と懇願の小辞を、丁重で自然な現代日本語にした。
- source_word: תַעֲבֹר מֵעַל
  choice: もとを通り過ぎる
  rationale: 人のそばをそのまま通過して立ち去る動きを簡潔に表す。
- source_word: עַבְדֶּךָ
  choice: 僕
  rationale: ここでは隷属身分の明示より、目上の相手に対するへりくだった自称が前景化しているため、「奴隷」ではなく、荘重な文脈に適する「僕」とした。
theological_decisions:
- issue: אֲדֹנָיが神への称号か、訪問者への敬称か
  choice: わが主よ
  alternative: 主よ（神への呼びかけとして明示する）
  rationale: 創世記18章の広い文脈では主の顕現だが、この発話は訪問者の一人への敬意ある呼びかけとしても読める。本文では大文字・小文字の区別がない日本語でも曖昧さを保てる「わが主よ」を用い、神への直接の呼びかけと取る可能性を注記した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、アブラハムの丁重さと場面の荘重さを示すため「わが主よ」「僕」を用いた。神への呼びかけか人への敬称かという原文の緊張は本文と注で保持した。
