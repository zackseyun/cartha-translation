  text: וַ/יַּ֥עַן אַבְרָהָ֖ם וַ/יֹּאמַ֑ר הִנֵּה נָ֤א הוֹאַ֨לְתִּי֙ לְ/דַבֵּ֣ר אֶל אֲדֹנָ֔/י וְ/אָנֹכִ֖י עָפָ֥ר וָ/אֵֽפֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/027.yaml
  text: Then Abraham answered and said[a], “Behold, please, I have dared to speak to my Lord, though I am dust and ashes.”
translation:
  language: ja
  text: そこでアブラハムは答えて言った。「どうか、あえてわが主に申し上げます。私はちりと灰にすぎませんが。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「わが主人」とも訳せる。ヘブライ語の形は人に対する敬称にもなり得るが、前後の文脈では、アブラハムが語りかけている相手は主（ヤハウェ）と同定されている。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: 答えて言った
  rationale: 二つの発話導入動詞を残し、ヘブライ語の荘重な対話形式を反映した。
- source_word: הִנֵּה נָא
  choice: （独立した語句としては訳出せず、発言全体の丁重さに反映）
  rationale: 注意喚起と懇願を示すが、日本語で「ご覧ください、どうか」と逐語的に置くと不自然であるため、「申し上げます」と文脈全体の丁重な表現に織り込んだ。
- source_word: הוֹאַלְתִּי
  choice: あえて
  rationale: 目上の相手に話すことを引き受け、思い切って行うという、アブラハムの大胆さと謙遜を簡潔に表す。
- source_word: לְדַבֵּר אֶל־אֲדֹנָי
  choice: わが主に申し上げます
  rationale: לְדַבֵּרは「話す」、אֲדֹנָיは接尾辞を伴う「私の主」。現代日本語として自然な敬語にした。
- source_word: וְאָנֹכִי עָפָר וָאֵפֶר
  choice: 私はちりと灰にすぎませんが
  rationale: 接続詞の対比・譲歩の働きを「が」で表し、人間の卑小さと死すべき性質を示す定型表現を保持した。
theological_decisions:
- issue: אֲדֹנָי が神への呼びかけか、一般的な敬称か
  choice: わが主[a]
  alternative: わが主人／ご主人様
  rationale: 語形自体は敬意を込めた人間への呼称にもなり得るが、周囲の文脈では相手が主（ヤハウェ）と同定される。本文は語義どおり「わが主」とし、文脈上の同定と語形上の曖昧さを脚注で保った。
translation_notes:
  register: 明瞭で dignified な現代標準日本語。「ちりと灰」は聖書的比喩を保ち、「申し上げます」によって丁重さを自然に表現した。脚注記号は曖昧さのある「わが主」に付した。
