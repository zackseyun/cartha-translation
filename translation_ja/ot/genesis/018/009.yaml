  text: וַ/יֹּאמְר֣וּ אֵׄלָׄ֔יׄ/וׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑/ךָ וַ/יֹּ֖אמֶר הִנֵּ֥ה בָ/אֹֽהֶל׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/009.yaml
  text: Then they said to him[a], “Where is Sarah your wife?” And he said, “There, in the tent.”
translation:
  language: ja
  text: 彼らはアブラハムに[a]言った。「あなたの妻サラは、どこにいるのですか。」彼は答えた。「そこです。天幕の中にいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語写本の伝統では、ここで「彼に」に当たる語の文字上に特別な点が付されている。その意図は不明であり、本文の訳には影響しない。
    reason: WLCが保存するマソラ本文の特殊点（puncta extraordinaria）を読者に知らせつつ、不確かな意味を本文へ持ち込まないため。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 彼らは言った
  rationale: 動詞は三人称複数形で、直前に登場した三人の訪問者を受ける。物語の継起は日本語の文脈で自然に伝わるため、機械的に接続詞を加えなかった。
- source_word: אֵלָיו
  choice: アブラハムに
  rationale: 直訳は「彼に」だが、日本語では発言の相手を明確にするため、文脈上の指示対象であるアブラハムの名を用いた。
- source_word: אַיֵּה
  choice: どこにいるのですか
  rationale: 所在を尋ねる疑問副詞。人物についての自然な現代日本語として「いる」を補った。
- source_word: שָׂרָה אִשְׁתֶּךָ
  choice: あなたの妻サラ
  rationale: 人名と二人称男性単数接尾辞を伴う「妻」を、その関係を保って自然な語順で表した。
- source_word: וַיֹּאמֶר
  choice: 彼は答えた
  rationale: 語義は「彼は言った」だが、問いへの応答であることを自然に示すため「答えた」とした。主語は文脈上アブラハムである。
- source_word: הִנֵּה
  choice: そこです
  rationale: 注意を向ける指示的な小辞。所在への簡潔な返答としての力を保ち、古風な「見よ」は避けた。
- source_word: בָאֹהֶל
  choice: 天幕の中にいます
  rationale: 定冠詞付きの「天幕」に前置詞בが付いた形。「天幕の中」という所在を、暗黙の主語サラと存在動詞を補って自然な日本語にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準語を用い、会話には丁寧さを持たせた。「天幕」は聖書時代の住居を表す語として一般読者にも理解可能で、歴史的背景も保てる。「そこです。天幕の中にいます」はヘブライ語の簡潔で指示的な返答を残しつつ、日本語として意味が通る形にした。
