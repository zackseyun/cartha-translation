id: GEN.18.33
reference: Genesis 18:33
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ יְהוָ֔ה כַּ/אֲשֶׁ֣ר כִּלָּ֔ה לְ/דַבֵּ֖ר אֶל אַבְרָהָ֑ם וְ/אַבְרָהָ֖ם שָׁ֥ב לִ/מְקֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/033.yaml
  text: Then Yahweh went his way when he had finished speaking to Abraham[a], and Abraham returned to his place.
translation:
  language: ja
  text: ヤハウェ[a]は、アブラハムに語り終えると、立ち去った。アブラハムも自分のいた所に戻った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語は「YHWH」。別の音写として「エホバ」もある。
    reason: 神名の原語表記と別の慣用的音写を示すため。
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 立ち去った
  rationale: הלךはこの場面では、対話を終えてその場から去ることを表す。「立ち去った」は移動と別離の両方を自然な日本語で簡潔に伝える。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名YHWHを称号に置き換えず、固有名として一般的な日本語表記で音写した。
- source_word: כַּאֲשֶׁר כִּלָּה לְדַבֵּר
  choice: 語り終えると
  rationale: כַּאֲשֶׁרの時間的関係と、כלה＋不定詞が示す行為の完了を、簡潔で自然な日本語にした。
- source_word: אֶל אַבְרָהָם
  choice: アブラハムに
  rationale: 前置詞אֶלの方向性を素直に反映し、発話の相手を示した。
- source_word: שָׁב
  choice: 戻った
  rationale: שׁובが示す元の場所への帰還を、現代日本語で直接表した。
- source_word: לִמְקֹמוֹ
  choice: 自分のいた所に
  rationale: מקוםの「場所」という意味を保ちつつ、「自分の場所」という不自然さを避けた。「家」とは限定せず、原文にない情報を加えていない。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: エホバ、主
  rationale: 原文は称号ではなく四文字神名を用いているため、その固有名としての性格を保つ音写を本文に採用した。別の慣用音写があることは脚注で示した。
translation_notes:
  register: 明瞭で格調を保った現代標準語。神の動作にも過度な敬語を加えず、簡潔な物語文とした。二つの節を分けることで日本語として読みやすくし、後半のוְは「も」で場面上の対応を表した。
