base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/007.yaml
  text: And Abraham ran to the herd and took a tender and good calf and gave it to the young man[a], and he hurried to prepare it.
translation:
  language: ja
  text: アブラハムは牛の群れのところへ走って行き、柔らかくて上等な子牛を取って、それを若者[a]に渡した。若者は急いでそれを調理した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「若者」と訳したヘブライ語は、「少年」または「従者」を意味することもある。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבָּקָר
  choice: 牛の群れ
  rationale: ここでは一頭ではなく、牛の家畜を集合的に指す。現代日本語で場面が明確になる表現とした。
- source_word: רָץ
  choice: 走って行き
  rationale: 「走る」という動作をそのまま表し、アブラハムのもてなしの迅速さを保つ。
- source_word: בֶּן־בָּקָר
  choice: 子牛
  rationale: 字義的には「牛の子」であり、食事のために選ばれた若い牛を自然な日本語で表す。
- source_word: רַךְ וָטוֹב
  choice: 柔らかくて上等な
  rationale: רַךְの「柔らかい」と、品質の良さを示すטוֹבを、自然で明瞭な日本語にした。
- source_word: הַנַּעַר
  choice: 若者
  rationale: この語は少年、若者、従者を指し得る。本文では身分を断定せず、基本的な年齢的意味を保った。
- source_word: וַיְמַהֵר
  choice: 急いで
  rationale: 素早く行動したことを表し、物語に繰り返される迅速なもてなしを伝える。
- source_word: לַעֲשׂוֹת אֹתוֹ
  choice: それを調理した
  rationale: עשהは広く「作る、行う」を意味するが、食事の文脈では子牛を食べられるように調理することを指す。
- source_word: וַיְמַהֵרの主語
  choice: 若者は急いで
  rationale: 直前の「若者」を主語として読む自然な統語的連続を明示し、日本語で代名詞の曖昧さが不自然になるのを避けた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、叙事文としての簡潔さと品位を保った。「若者」の語義の幅は脚注に残し、本文で従者と断定しなかった。ヘブライ語では最後の動詞の主語は明示されないが、直前の若者を指すと理解して訳した。
