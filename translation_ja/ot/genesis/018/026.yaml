  text: וַ/יֹּ֣אמֶר יְהוָ֔ה אִם אֶמְצָ֥א בִ/סְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּ/ת֣וֹךְ הָ/עִ֑יר וְ/נָשָׂ֥אתִי לְ/כָל הַ/מָּק֖וֹם בַּ/עֲבוּרָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/018/026.yaml
  text: And Yahweh said[a], “If I find fifty righteous people within the city of Sodom, then I will spare the whole place for their sake.”
translation:
  language: ja
  text: ヤハウェは言われた。「もしソドムの町の中に正しい人々を五十人見つけるなら、その人々のために、その地全体を赦そう[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「その人々のために、その地全体を見逃そう」。ヘブライ語の動詞には、罪責を担う・取り去る、すなわち赦すという意味があり、ここでは裁きを差し控えることも表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字名を、称号に置き換えず、日本語で一般的な音写によって示した。
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進めるワイイクトル形。日本語では文脈上自然な敬語表現とし、機械的な接続詞は加えなかった。
- source_word: אִם אֶמְצָא
  choice: もし……見つけるなら
  rationale: 条件を明示する構文を、自然な現代日本語の条件表現で保った。
- source_word: בִסְדֹם ... בְּתוֹךְ הָעִיר
  choice: ソドムの町の中に
  rationale: 「ソドムで」と「町の中に」を日本語で重複感なくまとめつつ、都市内部という空間的意味を保持した。
- source_word: חֲמִשִּׁים צַדִּיקִם
  choice: 正しい者を五十人
  rationale: 性別を限定せず、倫理的・法的に正しい者という語義を簡潔に表した。
- source_word: וְנָשָׂאתִי
  choice: 赦そう
  rationale: נשׂא の「担う、取り去る」から派生する、罪責を赦して裁きを差し控える意味を表す。文脈上の「滅ぼさずにおく」も含意するため、脚注で別訳を示した。
- source_word: לְכָל הַמָּקוֹם
  choice: その場所全体
  rationale: 裁きの対象となる地域全体を指す表現として、原文の包括的範囲を保持した。
- source_word: בַּעֲבוּרָם
  choice: その者たちのために
  rationale: 正しい者たちを顧みて、彼らゆえに行動するという理由・配慮を自然に示した。
theological_decisions:
- issue: 神名 יְהוָה の訳出
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を用いていることを明示し、称号への置換を避けた。
- issue: וְנָשָׂאתִי の意味
  choice: 赦そう
  alternative: 滅ぼさずにおこう／容赦しよう
  rationale: 語の赦免的な含意を保ちながら、町への裁きを差し控えるという文脈的意味も脚注で提示し、どちらか一方に狭めすぎないようにした。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。神の発話には「言われた」を用い、過度に古風な語法を避けた。「正しい者」は性別を限定しない。
