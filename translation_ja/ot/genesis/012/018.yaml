base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/018.yaml
  text: Then Pharaoh called Abram and said, “What is this you have done to me? Why did you not tell me that she is your wife?”
translation:
  language: ja
  text: そこで、ファラオはアブラムを呼び寄せて言った。「あなたは私に何ということをしたのか。なぜ彼女があなたの妻だと私に告げなかったのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: 呼び寄せて
  rationale: קרא＋לְ は人を呼ぶ、召す意。ここではファラオがアブラムを自分のもとへ呼ぶ場面なので、現代日本語として自然な「呼び寄せて」とした。
- source_word: פַרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として、日本語聖書で広く通用する音写を用いた。
- source_word: לְאַבְרָם
  choice: アブラム
  rationale: 人名 אַבְרָם を標準的に音写した。
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語で一般的な אמר の意味を保った。後続が疑問文でも、日本語では「言った」で自然に導入できる。
- source_word: מַה זֹּאת עָשִׂיתָ לִּי
  choice: あなたは何ということを私にしたのか
  rationale: 逐語的な「これは何か、あなたが私にしたことは」という構造の非難の力を、自然な日本語の慣用表現「何ということを…したのか」で表した。לִּי の個人的被害意識は「私に」で保持した。
- source_word: לָמָּה לֹא הִגַּדְתָּ לִּי
  choice: なぜ…私に告げなかったのか
  rationale: נגד のヒフィルは「告げる、知らせる」の意。「告げる」は威厳を保ちながらも現代日本語で理解しやすい。
- source_word: כִּי
  choice: …と
  rationale: ここではアブラムが知らせなかった内容を導く接続詞なので、日本語の引用・内容節を作る「と」で表した。
- source_word: אִשְׁתְּךָ הִוא
  choice: 彼女があなたの妻だ
  rationale: 無動詞名詞文の現在的な関係を「妻だ」と表し、独立代名詞 הִוא の指示を「彼女が」で明示した。
- source_word: וַ
  choice: そこで
  rationale: 物語を進める接続を表し、直前の事態を受けたファラオの行動として自然につながる語を選んだ。
