source:
  edition: WLC
  text: וַ/יַּעֲבֹ֤ר אַבְרָם֙ בָּ/אָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְ/הַֽ/כְּנַעֲנִ֖י אָ֥ז בָּ/אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/006.yaml
  text: Abram passed through the land as far as the place of Shechem[a], as far as the oak of Moreh[b]. Now the Canaanite was then in the land.
translation:
  language: ja
  text: アブラムはその地を通り、シェケムの場所まで、モレの大木[a]のところまで進んだ。そのころ、カナン人[b]がその地にいた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「モレの樫の木」または「モレのテレビンの木」とも訳せる。ヘブライ語は大きな木を指すが、正確な樹種は確かでない。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では単数形の民族名だが、集合的に「カナン人たち」を指すことがある。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: 通り……進んだ
  rationale: 土地を横切って移動するという語義を自然な日本語で表し、経路や移動方法を限定しない。
- source_word: בָּאָרֶץ
  choice: その地
  rationale: 定冠詞のある「地」で、文脈上のカナンの地を指す。二度の反復も保持した。
- source_word: עַד מְקוֹם שְׁכֶם
  choice: シェケムの地……まで
  rationale: מְקוֹםを「地」とし、後代の発達した都市そのものと断定せず、シェケムに結びつく場所を示す。
- source_word: אֵלוֹן מוֹרֶה
  choice: モレの大木
  rationale: אֵלוֹןの樹種は確定しないため、本文では特定の樹種に限定しない「大木」とした。モレは固有名として音写した。
- source_word: וְהַכְּנַעֲנִי
  choice: カナン人
  rationale: 定冠詞付き単数の民族名を、日本語で個人にも民族集団にも読める自然な形で訳した。集合的用法の可能性は脚注に示した。
- source_word: אָז
  choice: そのころ
  rationale: 物語中の当時の状況を示す時間副詞として、現代日本語で自然に表した。
- source_word: בָּאָרֶץ
  choice: その地に
  rationale: 原文の反復を保ち、領域内にカナン人が存在したことを簡潔に示した。
theological_decisions:
- issue: וְהַכְּנַעֲנִי の数と集合的用法
  choice: 本文は「カナン人」とし、数を明示的に限定しない
  alternative: 「カナン人たち」または「カナン民族」
  rationale: ヘブライ語は単数形の民族名だが、集合的に民全体を指しうる。日本語の「カナン人」は単複を形態上区別せず、原文の含みを自然に保持できる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「シェケムの地、モレの大木」と並べて原文の二重の到達点表現を簡潔に保ち、「住んでいた」と補わず、存在を表す原文に即して「いた」とした。
