  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל אַבְרָ֔ם לֶךְ לְ/ךָ֛ מֵ/אַרְצְ/ךָ֥ וּ/מִ/מּֽוֹלַדְתְּ/ךָ֖ וּ/מִ/בֵּ֣ית אָבִ֑י/ךָ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽ/ךָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/001.yaml
  text: Yahweh said to Abram, “Go out from your land, from your kindred, and from your father’s house to the land that I will show you.”
translation:
  language: ja
  text: ヤハウェはアブラムに言った。「あなたの土地、親族、父の家を離れ、わたしがあなたに示す地へ行きなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 固有の神名である四文字語を、称号に置き換えず音写した。
- source_word: לֶךְ־לְךָ
  choice: 離れ……行きなさい
  rationale: 直訳的には「あなた自身のために行け」とも取れる形だが、ここでは出立を強く促すヘブライ語の慣用表現として自然な日本語にした。後続する三つの מִן 句の起点・離脱の意味を「離れ」で明示した。
- source_word: מֵאַרְצְךָ
  choice: あなたの土地
  rationale: אֶרֶץ の基本義を保ち、近代的な国民国家を連想させやすい「国」を避けた。
- source_word: מִמּוֹלַדְתְּךָ
  choice: 親族
  rationale: מוֹלֶדֶת は出生地・同族集団の双方を指し得るが、「土地」と「父の家」の間に置かれた社会的なまとまりとして、文脈に適する「親族」を採用した。
- source_word: מִבֵּית אָבִיךָ
  choice: 父の家
  rationale: 家屋だけでなく父を中心とする家族・家系を含み得る原文の表現を、解釈を狭めずに保った。
- source_word: אֶל־הָאָרֶץ אֲשֶׁר אַרְאֶךָּ
  choice: わたしがあなたに示す地へ
  rationale: 目的地がまだ名指されていない原文の構造と、神が後に示すという約束をそのまま保った。
theological_decisions:
- issue: 神名 יהוה の表記
  choice: ヤハウェ
  alternative: 主／主なる神
  rationale: 原文が称号ではなく神の固有名を明記しているため、これを隠さず音写した。
- issue: לֶךְ־לְךָ に目的・利益の含意を持たせるか
  choice: 慣用的な出立命令として訳す
  alternative: 「自分のために行きなさい」
  rationale: לְךָ の機能には議論の余地があるが、日本語で利益・自己実現の意味を明示すると原文以上の神学的含意を加えかねないため、本文では自然な命令として表した。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、神の命令にふさわしい簡潔で格調ある文体とした。「父の家」は聖書的な家族・家系の幅を保つため、過度に現代化しなかった。
