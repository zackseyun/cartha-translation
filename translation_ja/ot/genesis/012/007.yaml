  text: וַ/יֵּרָ֤א יְהוָה֙ אֶל אַבְרָ֔ם וַ/יֹּ֕אמֶר לְ/זַ֨רְעֲ/ךָ֔ אֶתֵּ֖ן אֶת הָ/אָ֣רֶץ הַ/זֹּ֑את וַ/יִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה הַ/נִּרְאֶ֥ה אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/007.yaml
  text: Then Yahweh appeared to Abram and said[a], “To your offspring I will give this land.” So there he built an altar to Yahweh, who had appeared to him.
translation:
  language: ja
  text: 'その時、ヤハウェはアブラムに現れて言った。「あなたの子孫[a]に、わたしはこの地を与える。」そこでアブラムは、アブラムに現れたヤハウェのために祭壇を築いた。


    [a] 直訳「種」。ヘブライ語では単数形だが、集合的に子孫全体を指すことがある。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「種」。ヘブライ語では単数形だが、集合的に子孫全体を指すことがある。
    reason: זֶרַעの原義、文法上の単数形、集合的用法を示し、原文の語彙的・神学的含みを保持するため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、ヘブライ語の四文字神名を一般的な日本語表記で示す。
- source_word: וַיֵּרָא
  choice: 現れた
  rationale: ראהのニファル形がここではアブラムへの目に見える顕現を表すため、自然で簡潔な「現れた」とした。
- source_word: לְזַרְעֲךָ
  choice: あなたの子孫[a]に
  rationale: זֶרַעは形の上では単数だが集合的にも機能する。「子孫」は現代日本語として自然であり、脚注で「種」という原義と単数形を示して曖昧さを保持する。
- source_word: אֶתֵּן
  choice: わたしは…与える
  rationale: 未完了形の約束としての将来的意味を、日本語では文脈上明確な非過去形で自然に表した。
- source_word: הָאָרֶץ הַזֹּאת
  choice: この地
  rationale: 族長への土地の約束という文脈に合い、「国」や「地球」へ意味を狭めたり広げたりしない。
- source_word: וַיִּבֶן שָׁם מִזְבֵּחַ
  choice: そこで…祭壇を築いた
  rationale: 物語の進展と場所を示すשָׁםを、自然な接続表現「そこで」で表した。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: לְが表す献納・帰属の方向を、自然な日本語で示した。
- source_word: הַנִּרְאֶה אֵלָיו
  choice: 自分に現れた
  rationale: 定冠詞付き分詞がヤハウェを、アブラムに現れた方として特定していることを保持した。再帰的な「自分」は主語アブラムを指す。
theological_decisions:
- issue: 神名יְהוָהの訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が固有名を明記しているため、称号「主」に置き換えず、神名として音写した。
- issue: זֶרַעの単数形と集合的意味
  choice: 本文「子孫」、脚注「直訳『種』」
  alternative: 種、子孫たち
  rationale: 本文を明瞭な現代日本語にしつつ、単数の形が個と集合の双方に関わりうる原文の含みを脚注で保持し、特定の神学的解釈に限定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その時」「そこで」により物語の流れを示し、古風な言い回しは避けた。神名は一貫して「ヤハウェ」と表記した。
