  text: アブラムはネゲブ地方のほうへ旅を続けた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「南へ」。ヘブライ語は、南部の地域であるネゲブを指すことも、南の方角を指すこともある。ここでは地域名の意味である可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 旅を続け
  rationale: נסעの物語形は、宿営地を発って先へ移動することを表す。文脈上の継続性を自然な日本語で示した。
- source_word: אַבְרָם
  choice: アブラム
  rationale: 人名を日本語で一般的な聖書表記に従って音写した。
- source_word: הָלוֹךְ וְנָסוֹעַ
  choice: 進んで行った
  rationale: 二つの不定詞独立形による継続的・進行的な移動を、直訳調になりすぎない形で表した。「段階を追って」とまでは限定しない。
- source_word: הַנֶּגְבָּה
  choice: ネゲブ地方へ向かって
  rationale: 定冠詞と方向を示す語尾を踏まえ、ここでは地名として理解する可能性が高い。ただし「南へ」という方向表現の余地は脚注に残した。
