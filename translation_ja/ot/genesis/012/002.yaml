source:
  edition: WLC
  text: וְ/אֶֽעֶשְׂ/ךָ֙ לְ/ג֣וֹי גָּד֔וֹל וַ/אֲבָ֣רֶכְ/ךָ֔ וַ/אֲגַדְּלָ֖ה שְׁמֶ֑/ךָ וֶ/הְיֵ֖ה בְּרָכָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/002.yaml
  text: And I will make you into a great nation[a], and I will bless you, and I will make your name great[b], and be a blessing.
translation:
  language: ja
  text: わたしはあなたを大いなる国民とし、あなたを祝福し、あなたの名を大いなるものとする。そして、祝福となりなさい。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたは祝福となる」。ヘブライ語は命令形（「なりなさい」）だが、神の約束の結果を表すものと理解することもできる。
    reason: 命令形の文法的意味と、文脈上可能な結果・予告の読みの双方を示すため。
lexical_decisions:
- source_word: וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל
  choice: わたしはあなたを大いなる民族とし
  rationale: עשהと目的語接尾辞、およびלְを伴う述語句を「あなたを…とする」と訳した。גּוֹיはここではアブラムから生じる民の集団を指すため、現代日本語で国家体制や国籍を強く連想させる「国民」より「民族」が適切である。
- source_word: וַאֲבָרֶכְךָ
  choice: あなたを祝福し
  rationale: ברךのピエル形と二人称単数の目的語を直接的に表し、神がアブラム本人を祝福する約束を保持した。
- source_word: וַאֲגַדְּלָה שְׁמֶךָ
  choice: あなたの名を大いなるものとする
  rationale: גדלの使役的な意味とשֵׁם「名」を明示的に保った。「名声を高める」より原文に近く、聖書的な響きも保持する。
- source_word: וֶהְיֵה בְּרָכָה
  choice: そして、祝福となりなさい
  rationale: היהの男性単数命令形を「なりなさい」と訳し、直前までの神の約束からアブラムへの命令への転換を保持した。בְּרָכָהは無冠詞の単数名詞だが、日本語では「一つの祝福」より「祝福となる」が自然である。
theological_decisions:
- issue: וֶהְיֵה בְּרָכָהの命令的意味と結果的意味
  choice: 命令として「そして、祝福となりなさい」
  alternative: 結果・予告として「こうして、あなたは祝福となる」
  rationale: וֶהְיֵהは形態上、Qal男性単数命令形なので、本文ではその命令の力を保持した。ただし、一連の神の約束の帰結を述べる表現と理解する余地もあるため、その読みを脚注に示した。
translation_notes:
  register: 明瞭で格調のある現代標準日本語とした。神の三つの約束には並行性を持たせ、最後の命令は独立した文として際立たせた。「大いなる」「祝福」は聖書本文としての響きを保ちつつ、一般読者にも理解できる語彙である。
