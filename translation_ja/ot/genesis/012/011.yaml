  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֥ר הִקְרִ֖יב לָ/ב֣וֹא מִצְרָ֑יְמָ/ה וַ/יֹּ֨אמֶר֙ אֶל שָׂרַ֣י אִשְׁתּ֔/וֹ הִנֵּה נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת מַרְאֶ֖ה אָֽתְּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/011.yaml
  text: And it happened[a], as he was about to enter Egypt, that he said to Sarai his wife, “Look now[b], I know that you are a woman beautiful in appearance.”
translation:
  language: ja
  text: さて、アブラムがエジプトに入ろうとして近づいたとき、妻のサライに言った。「見なさい[a]。私は、あなたが美しい女性であることを知っている[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「見よ、どうか（今）」。「見なさい」は相手の注意を促す表現。
    reason: lexical_alternative
  - marker: b
    text: 別訳「あなたは見た目の美しい女性だ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: さて、～ころ
  rationale: 物語を進めつつ時を示すヘブライ語の構文。日本語では「そして、～ということが起こった」と直訳せず、自然な物語の導入と時間関係を示した。
- source_word: הִקְרִיב לָבוֹא
  choice: 入ろうとする
  rationale: קרבのヒフィル形と不定詞の組み合わせが、入る時が間近に迫っていたことを表すため。
- source_word: מִצְרָיְמָה
  choice: エジプトに
  rationale: 地名の方向を示す語尾を、日本語の方向助詞「に」で表した。
- source_word: שָׂרַי אִשְׁתּוֹ
  choice: 妻のサライ
  rationale: サライが彼の妻であるという同格的な説明を、自然な現代日本語の語順で示した。
- source_word: הִנֵּה נָא
  choice: いいか
  rationale: 注意を促し、相手に意を向けさせる会話上の働きを自然な日本語で表した。字義的な表現は脚注に残した。
- source_word: יָדַעְתִּי
  choice: 知っている
  rationale: 完了形が、すでに得た知識に基づく現在の認識を表しているため。
- source_word: אִשָּׁה יְפַת מַרְאֶה
  choice: 見目麗しい女
  rationale: 女性として外見が美しいという意味を、簡潔で品位ある現代日本語にした。「見目麗しい」は視覚的な美しさを保つ。
- source_word: אָתְּ
  choice: あなたが～女である
  rationale: 独立人称代名詞による明示的な主語を、日本語でも「あなた」として表した。
