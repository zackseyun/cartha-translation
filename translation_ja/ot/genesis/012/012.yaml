source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי יִרְא֤וּ אֹתָ/ךְ֙ הַ/מִּצְרִ֔ים וְ/אָמְר֖וּ אִשְׁתּ֣/וֹ זֹ֑את וְ/הָרְג֥וּ אֹתִ֖/י וְ/אֹתָ֥/ךְ יְחַיּֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/012.yaml
  text: And it will be that when the Egyptians see you[a], they will say, ‘This is his wife,’ and they will kill me[b], but they will let you live.
translation:
  language: ja
  text: エジプト人があなたを見ると[a]、『この人は彼の妻だ』と言って、私を殺す。しかし、あなたは生かしておくだろう[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「エジプト人があなたを見たなら」。
    reason: כִּי はここで時間的にも条件的にも理解できるため、その幅を示した。
  - marker: b
    text: または「あなたの命は助けるだろう」。
    reason: יְחַיּוּ は「生かしておく」「命を助ける」と訳せるため。
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: ～を見ると
  rationale: 将来起こると予想される状況を導くヘブライ語の表現。日本語では「～すると」の形にまとめ、予期と時間的なつながりを自然に表した。
- source_word: יִרְאוּ אֹתָךְ
  choice: あなたを見る
  rationale: ראה の通常の意味を簡潔に訳した。文脈にない「目を留める」などの含みは加えていない。
- source_word: הַמִּצְרִים
  choice: エジプト人
  rationale: 定冠詞を伴う民族名であり、文脈上は一般的な総称として自然に訳した。
- source_word: אִשְׁתּוֹ זֹאת
  choice: この女は彼の妻だ
  rationale: 字義的には「彼の妻、この者」。指示語の力を保ちつつ、女性を指すことが明瞭な自然な日本語の名詞文とした。
- source_word: וְהָרְגוּ אֹתִי
  choice: 私を殺す
  rationale: הרג の直接的な意味を保ち、「殺害する」などの硬い表現や「殺してしまう」などの付加的なニュアンスを避けた。
- source_word: וְאֹתָךְ יְחַיּוּ
  choice: あなたは生かしておく
  rationale: חיה のヒフィル形が表す「生きたままにする、命を取らずにおく」を自然に表現した。直前の「私を殺す」との対照は「一方で」によって示した。
