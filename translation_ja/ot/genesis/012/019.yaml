base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/019.yaml
  text: Why did you say[a], ‘She is my sister,’ and I took her to be my wife? And now, here is your wife[c][b]. Take her and go.”
translation:
  language: ja
  text: 「なぜ、『彼女は私の妹です』と言ったのだ。それで私は、彼女を自分の妻に迎えた[a]のだ。今、ここにあなたの妻がいる。彼女を連れて行け。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼女を自分のために妻として取った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָה אָמַרְתָּ
  choice: なぜ……と言ったのか
  rationale: ファラオがアブラムの発言理由を問いただす直接的な表現として、自然な現代日本語にした。
- source_word: אֲחֹתִי הִוא
  choice: 彼女は私の妹です
  rationale: ヘブライ語の無動詞文を引用内の現在形として表し、アブラムが述べた主張をそのまま示した。
- source_word: וָאֶקַּח אֹתָהּ לִי לְאִשָּׁה
  choice: そのため、私は彼女を自分の妻として迎えた
  rationale: 接続詞を文脈上の結果として自然に表し、לִי の自己関与を「自分の」で示した。「妻として迎えた」は婚姻のために取るという句の意味を明瞭に伝える。
- source_word: וְעַתָּה
  choice: さあ
  rationale: 叱責から目前の命令へ移る談話上の転換を、簡潔で自然な日本語で表した。
- source_word: הִנֵּה אִשְׁתְּךָ
  choice: あなたの妻はここにいる
  rationale: הִנֵּה の指示・注意喚起の力を「ここにいる」で示し、古風すぎる表現を避けた。
- source_word: קַח וָלֵךְ
  choice: 彼女を連れて行け
  rationale: 二つの命令「取れ、そして行け」を、日本語で自然な一続きの命令として表した。目的語は文脈から補った。
theological_decisions:
- issue: ファラオがサライを妻として「取った」という表現の範囲
  choice: 妻として迎えた
  alternative: 妻にしようとして迎え入れた
  rationale: 完了形 וָאֶקַּח を意図だけに弱めず、同時に婚姻の成立や性的関係について本文以上の断定も加えない表現とした。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で dignified な叱責の語調とした。「ではないか」により、ファラオの非難と因果関係を自然に示している。
