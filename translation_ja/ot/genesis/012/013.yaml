  text: אִמְרִי נָ֖א אֲחֹ֣תִ/י אָ֑תְּ לְמַ֨עַן֙ יִֽיטַב לִ֣/י בַ/עֲבוּרֵ֔/ךְ וְ/חָיְתָ֥ה נַפְשִׁ֖/י בִּ/גְלָלֵֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/013.yaml
  text: Please say that you are my sister[a], so that it may go well with me because of you[b], and my life may be spared on your account.
translation:
  language: ja
  text: どうか、私の姉妹だと言ってくれ。そうすれば、あなたのおかげで私にとって都合がよくなり、あなたのおかげで私の命も助かるだろう[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私のネフェシュが生きる」。ここで「ネフェシュ」は、アブラム自身の命を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: אִמְרִי נָא
  choice: どうか……と言ってくれ
  rationale: 女性単数への命令形に依頼を和らげる נָא が添えられているため、切迫した願いを自然な現代日本語で表した。
- source_word: אֲחֹתִי אָתְּ
  choice: 私の妹だ
  rationale: 直訳的には「あなたは私の姉妹だ」。文脈上、年下の女性きょうだいを指す自然な日本語として「妹」を選んだ。
- source_word: לְמַעַן
  choice: そうすれば
  rationale: 後続する期待された目的・結果を明瞭に導く。
- source_word: יִיטַב לִי
  choice: 私はよい扱いを受け
  rationale: 字義は「私にとってよくなる／うまくいく」。この場面ではサライとの関係を理由にアブラムが好意的に扱われることを指すため、意味を過度に限定せず自然に表した。
- source_word: בַעֲבוּרֵךְ
  choice: あなたのおかげで
  rationale: サライを理由・媒介として好ましい結果が生じるという因果関係を表す。
- source_word: וְחָיְתָה נַפְשִׁי
  choice: 私の命も助かる
  rationale: 字義は「私のネフェシュが生きる」。ここで נֶפֶשׁ は非物質的な「魂」に限定されず、本人の命・存在を指すため、日本語の慣用に即して訳した。
- source_word: בִּגְלָלֵךְ
  choice: あなたのおかげで
  rationale: בַעֲבוּרֵךְ と近い因果表現。原文の反復と、サライによって安全が得られるという強調を保つため、同じ表現を繰り返した。
