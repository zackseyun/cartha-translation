  text: וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨רֶד אַבְרָ֤ם מִצְרַ֨יְמָ/ה֙ לָ/ג֣וּר שָׁ֔ם כִּֽי כָבֵ֥ד הָ/רָעָ֖ב בָּ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/010.yaml
  text: There was a famine in the land[a], and Abram went down to Egypt to sojourn there, because the famine was severe in the land.
translation:
  language: ja
  text: その地に飢饉が起こった。アブラムは、そこに寄留するため[a]、エジプトへ下って行った。その地では飢饉が非常に深刻だったからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留する」とは、よそ者として一時的に住むこと。
    reason: 「寄留」が表す一時性と外来者としての含みを、現代の一般読者に説明するため。
lexical_decisions:
- source_word: וַיְהִי
  choice: 起こった
  rationale: 物語の新たな出来事を導入する表現として、飢饉の発生を自然な現代日本語で示した。明示されていない「さて」「今」を補わない。
- source_word: רָעָב
  choice: 飢饉
  rationale: 個人的な空腹ではなく、地域的な食糧不足を表すため。
- source_word: בָּאָרֶץ
  choice: その地に／その地の
  rationale: 全世界ではなく、直前までアブラムがいた地域を指す。二度の出現を訳文でも保った。
- source_word: וַיֵּרֶד
  choice: 下って行った
  rationale: エジプトへの移動を表す ירד の方向感覚を保持しつつ、日本語として自然にした。
- source_word: מִצְרַיְמָה
  choice: エジプトへ
  rationale: 方向を示す語尾を、目的地への移動を表す「へ」で訳した。
- source_word: לָגוּר
  choice: 寄留するため
  rationale: 自国民として定住するのではなく、よそ者として一時的に住むという語義を簡潔に保った。一般読者への説明は脚注に置いた。
- source_word: שָׁם
  choice: そこに
  rationale: エジプトを指す単純な場所表現として訳した。
- source_word: כִּי
  choice: からである
  rationale: アブラムがエジプトへ下った理由を示す因果関係を明確にした。
- source_word: כָבֵד
  choice: 激しかった
  rationale: 直訳的な「重かった」ではなく、飢饉の深刻さを表す文脈上の意味を自然な日本語で示した。
- source_word: הָרָעָב
  choice: その地の飢饉
  rationale: すでに導入された飢饉を指すことを明確にし、原文の反復も保った。
