  text: וַ/יִּקַּ֣ח אַבְרָם֩ אֶת שָׂרַ֨י אִשְׁתּ֜/וֹ וְ/אֶת ל֣וֹט בֶּן אָחִ֗י/ו וְ/אֶת כָּל רְכוּשָׁ/ם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְ/אֶת הַ/נֶּ֖פֶשׁ אֲשֶׁר עָשׂ֣וּ בְ/חָרָ֑ן וַ/יֵּצְא֗וּ לָ/לֶ֨כֶת֙ אַ֣רְצָ/ה כְּנַ֔עַן וַ/יָּבֹ֖אוּ אַ֥רְצָ/ה כְּנָֽעַן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/005.yaml
  text: Abram took Sarai his wife[a], and Lot his brother’s son, and all their possessions that they had acquired, and the people whom they had acquired in Haran; and they set out to go to the land of Canaan[b], and they came to the land of Canaan.
translation:
  language: ja
  text: アブラムは、妻サライと兄弟の子ロト、ハランで得た人々[a]を連れ、彼らが得たすべての財産を携えて、カナンの地へ向けて出発した。そして、彼らはカナンの地に着いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「ハランで造った人々」。この表現は、そこで得た、あるいは家の一員として加えた人々を指すと考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 伴い
  rationale: 後に続く妻、親族、財産、人々を一緒に連れて行くことを表す文脈なので、日本語では「伴い」が自然である。
- source_word: אִשְׁתּוֹ
  choice: 妻
  rationale: 婚姻関係を表す用法であり、現代日本語の明確な表現とした。
- source_word: בֶּן אָחִיו
  choice: 兄弟の子
  rationale: 「甥」と意訳せず、原文の親族関係の言い方を保った。ヘブライ語の「兄弟」は兄か弟かを特定しない。
- source_word: רְכוּשָׁם אֲשֶׁר רָכָשׁוּ
  choice: 彼らが得たすべての財産
  rationale: רכושは所有する財物を、רכשはそれを取得したことを表す。日本語で不必要な同語反復を避けつつ意味を保持した。
- source_word: הַנֶּפֶשׁ אֲשֶׁר עָשׂוּ
  choice: 得た人々
  rationale: נפשはここでは個々の「魂」ではなく人々を指す。עשהは字義的には「造る」だが、この句では家に加えた、あるいは獲得した人々を表す慣用的用法と考えられる。曖昧さを消さないため「得た」とし、字義と解釈範囲を脚注に示した。
- source_word: וַיֵּצְאוּ לָלֶכֶת
  choice: へ向けて出発した
  rationale: 直訳的な「行くために出た」を、目的地への出立を明確にする自然な現代日本語で表した。
- source_word: אַרְצָה כְּנַעַן
  choice: カナンの地へ
  rationale: 方向を示す語形と「地」を明示する原文をともに反映した。
- source_word: וַיָּבֹאוּ אַרְצָה כְּנָעַן
  choice: カナンの地に着いた
  rationale: 目的地への到着を自然に表し、原文にある「カナンの地」の反復を保持した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準語を用いながら、物語文としての端正さを保った。「人々を得た」という原文の難しい表現は本文で過度に解釈せず、脚注で字義と慣用的な理解を示した。
