  text: וּ/לְ/אַבְרָ֥ם הֵיטִ֖יב בַּ/עֲבוּרָ֑/הּ וַֽ/יְהִי ל֤/וֹ צֹאן וּ/בָקָר֙ וַ/חֲמֹרִ֔ים וַ/עֲבָדִים֙ וּ/שְׁפָחֹ֔ת וַ/אֲתֹנֹ֖ת וּ/גְמַלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/016.yaml
  text: And he treated Abram well because of her[a], and he came to have sheep and cattle and male donkeys and male servants and female servants and female donkeys and camels.
translation:
  language: ja
  text: ファラオは彼女のゆえにアブラムを厚遇した[a]。そのためアブラムは、羊や牛、雄のろば、男奴隷、女奴隷、雌のろば、らくだを持つようになった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼女のためにアブラムを厚遇した」。ヘブライ語の表現は、原因とも受益とも取ることができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵיטִיב
  choice: 厚遇した
  rationale: ヒフィル形の「よくする、好意的に扱う」を、人物への優遇を表す自然で簡潔な現代日本語にした。
- source_word: בַּעֲבוּרָהּ
  choice: 彼女のゆえに
  rationale: 原因・契機を示す表現。「彼女のために」という受益的な意味にも取り得るため、脚注で別訳を示した。
- source_word: וַיְהִי לוֹ
  choice: 持つようになった
  rationale: 逐語的には「彼に属するものとなった」であり、単なる既存の所有ではなく、厚遇の結果として所有するに至ったという物語上の推移を表した。
- source_word: צֹאן
  choice: 羊
  rationale: 羊や山羊を含み得る集合名詞だが、家畜の列挙における一般的で明快な訳語を採った。
- source_word: בָקָר
  choice: 牛
  rationale: ウシ類を集合的に指す語として、自然な日本語を採った。
- source_word: חֲמֹרִים
  choice: 雄のろば
  rationale: 男性複数形であり、後の雌ろばとの性別の対照を保持した。
- source_word: עֲבָדִים
  choice: 男奴隷
  rationale: 所有物の列挙という文脈では隷属身分が明瞭であるため、「使用人」ではなく「奴隷」とし、後続の女性形との対照も示した。
- source_word: שְׁפָחֹת
  choice: 女奴隷
  rationale: 女性の奴隷・下女を指す語。所有物の列挙という文脈と עֲבָדִים との並行を踏まえ、社会的身分を明示した。
- source_word: אֲתֹנֹת
  choice: 雌のろば
  rationale: 雌ろばを明示する女性名詞であり、先行する雄ろばとの区別を保持した。
- source_word: גְמַלִּים
  choice: らくだ
  rationale: 標準的な訳語を採った。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ファラオ」は直前の文脈で明らかな主語を補い、ヘブライ語の代名詞が指す人物を自然に明示した。人を財産として列挙する古代の社会的現実を婉曲化せず、「男奴隷、女奴隷」と訳した。
