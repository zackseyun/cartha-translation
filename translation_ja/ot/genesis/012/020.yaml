  yaml_path: translation/ot/genesis/012/020.yaml
  text: Then Pharaoh gave men orders concerning him[c][b][a], and they sent him away with his wife and all that belonged to him.
translation:
  language: ja
  text: そこでファラオは、アブラムのことで男たちに命じた。[a] 彼らはアブラムとその妻、および彼に属するすべてのものを送り出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ファラオは、彼について男たちに命じた」。男たちの具体的な役割は明記されていない。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: וַיְצַו ... עָלָיו
  choice: アブラムについて……命じた
  rationale: צוהは「命じる」、עליוはここでは命令の対象・関係を示す「彼について」と理解した。日本語で指示対象を明確にするため、代名詞を「アブラム」とした。
- source_word: אֲנָשִׁים
  choice: 部下たち
  rationale: 字義は「男たち」だが、この文脈ではファラオの命令を実行する者たちを指す。「部下たち」は役割を自然に示しつつ、「家来」「兵士」などに限定しない。[a]で字義を示した。
- source_word: וַיְשַׁלְּחוּ אֹתוֹ
  choice: 彼らは、アブラムを……送り出した
  rationale: שלחのピエル形はここで「送り出す／去らせる」の意。護送や追放の具体的様態までは本文が明示しないため、中立的な「送り出した」とした。
- source_word: אִשְׁתּוֹ
  choice: その妻
  rationale: 婚姻関係を表す標準的な意味に従った。
- source_word: כָּל אֲשֶׁר לוֹ
  choice: 彼のすべての持ち物
  rationale: 字義は「彼に属するすべて」。この文脈では所有物を指すため、明瞭で自然な日本語とした。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として現代日本語で定着した表記を用いた。
theological_decisions: []
