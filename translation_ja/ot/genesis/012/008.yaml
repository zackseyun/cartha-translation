  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּעְתֵּ֨ק מִ/שָּׁ֜ם הָ/הָ֗רָ/ה מִ/קֶּ֛דֶם לְ/בֵֽית אֵ֖ל וַ/יֵּ֣ט אָהֳלֹ֑/ה בֵּֽית אֵ֤ל מִ/יָּם֙ וְ/הָ/עַ֣י מִ/קֶּ֔דֶם וַ/יִּֽבֶן שָׁ֤ם מִזְבֵּ֨חַ֙ לַֽ/יהוָ֔ה וַ/יִּקְרָ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/008.yaml
  text: From there he moved to the hill country east of Bethel and pitched his tent[a], with Bethel on the west and Ai on the east[b]. There he built an altar to Yahweh and called on the name of Yahweh.
translation:
  language: ja
  text: そこから彼はベテルの東にある山地へ移り、ベテルを西に、アイを東にして天幕を張った。彼はそこでヤハウェのために祭壇を築き、ヤハウェの名を呼び求めた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤハウェの名を宣べ伝えた」。このヘブライ語表現は、礼拝の中でヤハウェを呼び求めることも、その名を公に告げ知らせることも意味し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְתֵּק
  choice: 移り
  rationale: 場所を移すことを表す動詞。旅の継続を過度に補わず、自然な日本語で叙述する。
- source_word: הָהָרָה
  choice: 山地へ
  rationale: 方向を示す語尾を反映し、この地域の地形を指す集合的・地理的表現として「山」より「山地」が自然。
- source_word: מִקֶּדֶם לְבֵית אֵל
  choice: ベテルの東にある
  rationale: קֶדֶםを空間的な東方として取り、山地の位置をベテルとの関係で明示する。
- source_word: וַיֵּט אָהֳלֹה
  choice: 天幕を張った
  rationale: 天幕を設営するというヘブライ語の慣用表現に対応する、簡潔で定着した日本語。
- source_word: מִיָּם ... מִקֶּדֶם
  choice: 西に……東に
  rationale: יָםは直訳では「海」だが、ここでは方角の西を表す。二つの地名を対照的に配置する原文を保つ。
- source_word: מִזְבֵּחַ
  choice: 祭壇
  rationale: 礼拝や犠牲のために築かれる構造物を表す標準的な訳語。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 前置詞 לְ の献呈・対象の関係を自然に示し、神名 יהוה は固有名として音写する。
- source_word: וַיִּקְרָא בְּשֵׁם יְהוָה
  choice: ヤハウェの名を呼び求めた
  rationale: 礼拝における祈願・呼びかけという文脈上の意味を自然に表しつつ、宣べ伝える意味の可能性は脚注に残す。
theological_decisions:
- issue: 神名 יהוה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の四文字神名を普通名詞的な称号に置き換えず、固有名として示す。
- issue: וַיִּקְרָא בְּשֵׁם יְהוָה の意味
  choice: ヤハウェの名を呼び求めた
  alternative: ヤハウェの名を宣べ伝えた
  rationale: 祭壇を築く礼拝の文脈では祈願・礼拝の意味が直接的だが、この表現には公に宣言する意味もあり得るため、脚注で曖昧さを保存する。
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある叙述体。「天幕」「祭壇」は聖書の歴史的背景に適した定着語として用いた。原文にない主語名は補わず「彼」とした。英語資料の脚注記号には配置上の不整合があるため、原文上の実際の曖昧さに対応する箇所だけに[a]を付した。
