  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲבָֽרֲכָה֙ מְבָ֣רְכֶ֔י/ךָ וּ/מְקַלֶּלְ/ךָ֖ אָאֹ֑ר וְ/נִבְרְכ֣וּ בְ/ךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָ/אֲדָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/003.yaml
  text: And I will bless those who bless you[a], and the one who curses you I will curse[c][b]; and in you all the families of the earth will be blessed.
translation:
  language: ja
  text: わたしは、あなたを祝福する者たちを祝福し、あなたを軽んじる者を呪う。地上のすべての氏族は、あなたにあって祝福される[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地上のすべての氏族は、あなたによって自らを祝福する」、または「あなたを通して祝福される」。ヘブライ語の動詞形は受動にも再帰・中動にも理解でき、前置詞にも手段を表す用法がある。
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲבָרֲכָה
  choice: わたしは……祝福し
  rationale: ברך のQal一人称単数。神の約束として自然な現代日本語にし、後続句と滑らかにつないだ。
- source_word: מְבָרְכֶיךָ
  choice: あなたを祝福する者たち
  rationale: 複数分詞と二人称男性単数接尾辞を反映し、祝福する人々という類を表した。
- source_word: וּמְקַלֶּלְךָ
  choice: あなたを軽んじる者
  rationale: קלל は軽く扱う、侮る、呪うという意味領域を持つ。後続の強い אָאֹר との語彙的対照を保つため「軽んじる」とし、ヘブライ語の単数も維持した。
- source_word: אָאֹר
  choice: 呪う
  rationale: ארר のQal一人称単数で、神が呪いを下すという強い応答を明確に表す。
- source_word: וְנִבְרְכוּ
  choice: 祝福される
  rationale: ברך のNiphal三人称複数を、最も素直な受動として訳した。再帰・中動の可能性は脚注に残した。
- source_word: בְּךָ
  choice: あなたにあって
  rationale: 前置詞 ב の「中に／にあって」という直接的な表現を保ちつつ、契約的な結びつきを表した。手段的な「あなたを通して」は脚注に示した。
- source_word: כֹּל מִשְׁפְּחֹת הָאֲדָמָה
  choice: 地上のすべての氏族
  rationale: מִשְׁפָּחוֹת は家族集団・氏族を指すため「氏族」とし、הָאֲדָמָה はこの普遍的約束の文脈で「地上」と訳した。
theological_decisions:
- issue: アブラハムへの約束における וְנִבְרְכוּ בְךָ の意味
  choice: 受動として「あなたにあって祝福される」
  alternative: 再帰・中動として「あなたによって自らを祝福する」、または手段的に「あなたを通して祝福される」
  rationale: Niphal の受動と再帰・中動、および ב の領域的・手段的理解には議論がある。本文では直接的な受動を採り、別の可能性を脚注に明記して神学的な幅を保持した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「あなたを軽んじる者」と「呪う」により、קלל と ארר の強弱の対照を示した。複数の「祝福する者たち」と単数の「軽んじる者」の違いも保持した。
