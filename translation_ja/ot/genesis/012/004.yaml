base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/004.yaml
  text: So Abram went, just as Yahweh had spoken to him, and Lot went with him. Abram was seventy-five years old when he departed from Haran.
translation:
  language: ja
  text: アブラムは、ヤハウェが彼に語ったとおりに行った。ロトも彼とともに行った。アブラムはハランを出たとき、七十五歳であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: 行った
  rationale: הלךの物語用法を簡潔に表し、前節で示された目的地へ向かう行動を過度に具体化しない。原文で二度繰り返される動詞も訳文に保持した。
- source_word: כַּאֲשֶׁר
  choice: とおりに
  rationale: アブラムの行動がヤハウェの先の言葉に沿うものであったことを、解釈を加えず自然な日本語で示す。
- source_word: דִּבֶּר אֵלָיו
  choice: 彼に語られた
  rationale: דברの発話の意味を保ちつつ、神への敬意を表す現代標準日本語として主体敬語を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、ヘブライ語の神名を日本語で一般的な形に音写した。
- source_word: אִתּוֹ
  choice: 彼とともに
  rationale: 同行を表す前置詞句を、簡潔で品位ある日本語にした。
- source_word: בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה
  choice: 七十五歳であった
  rationale: ヘブライ語の年齢表現を、意味を正確に保った自然な現代日本語に置き換えた。
- source_word: בְּצֵאתוֹ מֵחָרָן
  choice: ハランを出た時
  rationale: 前置詞ב付き不定詞構文の時間的意味を明確にし、מןの起点は日本語の目的格を用いる自然な「ハランを出る」で表した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が称号ではなく四文字神名を明記しているため、その固有名としての性格を保つ音写を採用した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、物語文としての簡潔さと品位を保った。原文の「行った」の反復を残し、アブラムの行動とロトの同行を別文にして読みやすくした。
