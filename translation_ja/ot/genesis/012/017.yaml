  source_fidelity: 原文は「ヤハウェがファラオとその家（家の者たち）を大きな災い／打撃で打った、アブラムの妻サライに関する事のゆえに」と述べる。訳文は主語、対象、災いの深刻さ、および因果関係を忠実に伝えている。「サライのことで」は、サライを非難する「せいで」や目的を示しうる「ために」を避け、עַל־דְּבַרの文脈上の理由・事情という含みを適切に保つ。
