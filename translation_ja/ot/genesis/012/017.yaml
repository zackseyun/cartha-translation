  terminology: 「ヤハウェ」「ファラオ」「アブラム」「サライ」は一貫した標準的な表記である。「打った」と「災い」はנגע動詞と同系名詞の響きを日本語として無理なく反映する。「重い災い」はגְּדֹלִיםの程度・深刻さを適切に表す。
