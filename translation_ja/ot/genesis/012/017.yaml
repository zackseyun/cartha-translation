id: GEN.12.17
reference: Genesis 12:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְנַגַּ֨ע יְהוָ֧ה אֶת פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְ/אֶת בֵּית֑/וֹ עַל דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/017.yaml
  text: But Yahweh afflicted Pharaoh and his household with severe plagues because of Sarai[a], Abram’s wife.
translation:
  language: ja
  text: しかし、ヤハウェは、アブラムの妻サライのことで、ファラオとその家の者たちを重い災いで打った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「重い災いで打った」は、「大きな苦しみを与えた」とも訳せる。ヘブライ語では、「打つ／苦しめる」という動詞と、「打撃／苦しみ／災い」を意味する同系の名詞が用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְנַגַּע
  choice: 打った
  rationale: 語根 נגע の「触れる／打つ」から派生した、害を加える意味を保ち、後続する נְגָעִים（災い）との語の重なりも可能な範囲で再現した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を称号に置き換えず、日本語で一般的な音写にした。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: エジプト王の称号として現代日本語で広く通用する表記を用いた。
- source_word: נְגָעִים גְּדֹלִים
  choice: 重い災い
  rationale: נְגָעִים の「打撃、苦しみ、災厄」という幅の中から文脈に合う「災い」を選び、גְּדֹלִים は規模より深刻さを表す「重い」とした。
- source_word: וְאֶת־בֵּיתוֹ
  choice: その家の者たち
  rationale: בַּיִת はここでは建物そのものより、ファラオに属する家族や家内の人々を指すと考えられるため、自然で明確な表現にした。
- source_word: עַל־דְּבַר
  choice: ことで
  rationale: 原因・理由を示す表現として訳しつつ、サライ自身を災いの責任者と断定せず、「サライに関する一件のため」という原文の含みを保った。
- source_word: שָׂרַי אֵשֶׁת אַבְרָם
  choice: アブラムの妻サライ
  rationale: 同格表現の内容を自然な日本語の語順で示し、サライがアブラムの妻であることを明確にした。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が用いる神の固有名を明示し、称号への置換によって固有名と一般名詞の区別が失われないようにした。
- issue: サライと災いの因果関係
  choice: サライのことで
  alternative: サライのために／サライのせいで
  rationale: עַל־דְּבַר は原因を示すが、サライ本人に責任があるとまでは述べない。「せいで」は非難を加えすぎ、「ために」は目的とも取れるため避けた。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の裁きを述べる箇所にふさわしい簡潔で荘重な調子を保った。「その家の者たち」により、現代語で誤解されやすい建物としての「家」を避けた。
