  text: וַ/יִּרְא֤וּ אֹתָ/הּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַ/יְהַֽלְל֥וּ אֹתָ֖/הּ אֶל פַּרְעֹ֑ה וַ/תֻּקַּ֥ח הָ/אִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/012/015.yaml
  text: When Pharaoh’s officials saw her[a], they praised her to Pharaoh[b], and the woman was taken into Pharaoh’s house.
translation:
  language: ja
  text: ファラオの高官たちは彼女を見ると、ファラオに彼女のことをほめた[a]。その女はファラオの家[b]に連れて行かれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「ファラオに彼女を推薦した」「ファラオに彼女のことをよく言った」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「家」。単なる建物ではなく、ファラオの王室や宮廷の世帯を指す場合がある。
    reason: cultural_note
lexical_decisions:
- source_word: שָׂרֵי פַרְעֹה
  choice: ファラオの高官たち
  rationale: שָׂרִים は支配者、君侯、高位の役人を指し得る。宮廷という文脈で、「高官」は身分の高さを示しつつ、王族であるとの含みを避けられる。
- source_word: וַיִּרְאוּ אֹתָהּ
  choice: 彼女を見ると
  rationale: ראה の通常の意味「見る」を保ち、物語の連続を自然な現代日本語で表した。
- source_word: וַיְהַלְלוּ אֹתָהּ אֶל־פַּרְעֹה
  choice: ファラオに彼女のことをほめた
  rationale: ピエル形の הלל はここでは「ほめる、称賛する」の意。彼女についてファラオに好意的に語ったという方向性を、説明しすぎずに表す。
- source_word: וַתֻּקַּח
  choice: 連れて行かれた
  rationale: 受動形と行為者が明示されない点を保つ。「取られた」より自然であり、彼女が受け身の立場にあることも伝わる。
- source_word: הָאִשָּׁה
  choice: その女
  rationale: 原文は「妻」ではなく定冠詞付きの「女」と述べるため、その語彙上の選択を維持した。直前からの指示関係は「その」で明確にした。
- source_word: בֵּית פַּרְעֹה
  choice: ファラオの家
  rationale: בַּיִת の基本的な表現を保つ。「宮殿」と断定せず、建物と王家・王宮組織の双方を含み得る曖昧さを残した。
