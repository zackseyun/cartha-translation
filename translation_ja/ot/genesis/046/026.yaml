base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/026.yaml
  text: All the persons belonging to Jacob who came to Egypt[a], who came from his loins, besides the wives of Jacob’s sons[b], were sixty-six persons in all.
translation:
  language: ja
  text: ヤコブに属し、エジプトへ来た者、すなわちヤコブの身から出た者[a]は、ヤコブの息子たちの妻を除いて、全部で六十六人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼の腿から出た者」。ヤコブの実の子孫を指すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַנֶּפֶשׁ
  choice: 者
  rationale: נֶפֶשׁはここでは系譜上の人数を数える語であり、現代日本語では「者」が自然である。
- source_word: הַבָּאָה לְיַעֲקֹב מִצְרַיְמָה
  choice: ヤコブに属してエジプトへ来た
  rationale: לְיַעֲקֹבの帰属・関係の含みを保ち、単なる同行と断定しない訳とした。
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: ヤコブの身から出た子孫
  rationale: 「腿から出た」という身体的なヘブライ語慣用句の具体性を「身から出た」で残しつつ、生物学的子孫を指すことを明確にした。
- source_word: מִלְּבַד
  choice: 除いて
  rationale: 息子たちの妻が六十六人の人数に含まれないことを明瞭に示す。
- source_word: נְשֵׁי בְנֵי יַעֲקֹב
  choice: ヤコブの息子たちの妻
  rationale: 属格関係を曖昧なく自然な現代日本語で表した。
- source_word: כָּל נֶפֶשׁ שִׁשִּׁים וָשֵׁשׁ
  choice: 全部で六十六人
  rationale: 人数の総計を示すヘブライ語を、簡潔で自然な日本語にした。
theological_decisions:
- issue: 六十六人に含まれる範囲
  choice: ヤコブの生物学的子孫を数え、息子たちの妻を除外する
  alternative: エジプトへ同行したヤコブの家の全員を数える
  rationale: יֹצְאֵי יְרֵכוֹとמִלְּבַד נְשֵׁי בְנֵי יַעֲקֹבが、人数の範囲を明示しているため。
translation_notes:
  register: 明快で端正な現代標準日本語。「身から出た子孫」によって原文の身体的慣用表現をある程度保ち、脚注で直訳を示した。
