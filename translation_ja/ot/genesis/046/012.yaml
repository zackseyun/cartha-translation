  text: וּ/בְנֵ֣י יְהוּדָ֗ה עֵ֧ר וְ/אוֹנָ֛ן וְ/שֵׁלָ֖ה וָ/פֶ֣רֶץ וָ/זָ֑רַח וַ/יָּ֨מָת עֵ֤ר וְ/אוֹנָן֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן וַ/יִּהְי֥וּ בְנֵי פֶ֖רֶץ חֶצְר֥וֹן וְ/חָמֽוּל־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/012.yaml
  text: And the sons of Judah were Er[a], Onan, Shelah, Perez, and Zerah. But Er and Onan died in the land of Canaan. And the sons of Perez were Hezron and Hamul.
translation:
  language: ja
  text: ユダの息子たちは、エル、オナン、シェラ、ペレツ、ゼラであった。しかし、エルとオナンはカナンの地で死んだ。[a] ペレツの息子たちは、ヘツロンとハムルであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、「エルとオナン」という複合主語に単数形の動詞が用いられている。これは通常のヘブライ語構文で、意味は「エルとオナンは死んだ」である。
    reason: 原文の文法上の特徴を示し、二人のうち一人だけが死んだという意味ではないことを明確にするため。
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה
  choice: ユダの息子たちは
  rationale: 接続詞を伴う系譜上の連結を文脈に委ねつつ、構成形を自然な現代日本語で表した。
- source_word: עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח
  choice: エル、オナン、シェラ、ペレツ、ゼラ
  rationale: 人名は翻訳せず、現代日本語の聖書で通用する音写を用いた。
- source_word: וַיָּמָת
  choice: 死んだ
  rationale: 形態上は単数形だが、動詞の後に複合主語「エルとオナン」が続く通常のヘブライ語構文であり、日本語では複数の主語に自然に対応する形で訳した。
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: カナンの地で
  rationale: 原文に明示された אֶרֶץ「地」を保持した。
- source_word: בְנֵי פֶרֶץ
  choice: ペレツの息子たち
  rationale: この系譜では直系の息子を指すため、広義の「子孫」ではなく「息子たち」とした。
- source_word: חֶצְרוֹן וְחָמוּל
  choice: ヘツロンとハムル
  rationale: 人名を標準的な日本語形で音写した。
theological_decisions: []
