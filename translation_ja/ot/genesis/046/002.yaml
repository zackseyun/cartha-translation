source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֱלֹהִ֤ים לְ/יִשְׂרָאֵל֙ בְּ/מַרְאֹ֣ת הַ/לַּ֔יְלָה וַ/יֹּ֖אמֶר יַעֲקֹ֣ב יַעֲקֹ֑ב וַ/יֹּ֖אמֶר הִנֵּֽ/נִי׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/002.yaml
  text: And God spoke to Israel in visions of the night and said[a], “Jacob, Jacob.” And he said[b], “Here I am.”
translation:
  language: ja
  text: 神は夜の幻の中でイスラエルに語りかけ、「ヤコブ、ヤコブ」と言われた。ヤコブは答えた。「ここにいます。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 語りかけ／言われた／答えた
  rationale: אמרの基本義は「言う」。最初の用例は神がイスラエルに呼びかける発話場面なので「語りかけ」、直接の呼びかけには「言われた」、ヤコブの応答には文脈に即して「答えた」とし、ヘブライ語の反復を自然な日本語で表した。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 文脈上、単数の動作主体である唯一の神を指すため、「神」とした。
- source_word: לְיִשְׂרָאֵל
  choice: イスラエルに
  rationale: 本文の呼称を保ち、続く神の呼びかけ「ヤコブ」と統一せず、原文の名の交替をそのまま示した。
- source_word: בְּמַרְאֹת הַלַּיְלָה
  choice: 夜の幻の中で
  rationale: 複数形מַרְאֹתが表す幻・幻視と、הַלַּיְלָהの夜という時・場面を保つ。日本語では集合的に「幻」とするのが自然であり、「中で」によって幻のうちに神が語ったことを示した。
- source_word: יַעֲקֹב יַעֲקֹב
  choice: ヤコブ、ヤコブ
  rationale: 親しく強い呼びかけを示す名の反復を省略せず保持した。
- source_word: הִנֵּנִי
  choice: はい、ここにおります
  rationale: 単なる所在確認ではなく、呼びかけに応じる用意と従順さを含む定型応答。現代日本語として自然で、神への応答にふさわしい丁寧さを備える表現とした。
theological_decisions:
- issue: イスラエルとヤコブという名の交替
  choice: 叙述では「イスラエル」、神の呼びかけでは「ヤコブ」を保持する
  alternative: どちらか一方の名に統一する
  rationale: 原文は意図的に異なる名を用いている可能性があり、その文学的・神学的含意を翻訳側で解消しないため。
- issue: 「夜の幻」の数
  choice: 自然な日本語として「夜の幻」と集合的に表す
  alternative: 形態上の複数を明示して「夜の幻々／夜の数々の幻」とする
  rationale: ヘブライ語は複数形だが、日本語で「数々の」とすると複数回の別個の幻を必要以上に強調しうる。幻視経験という意味を保ちながら数について過剰に解釈しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、神の発話には「言われた」、ヤコブの応答には「おります」を用いて簡潔で品位ある調子にした。節頭の接続詞וַは、日本語で単独の節として不自然になるため明示していない。
