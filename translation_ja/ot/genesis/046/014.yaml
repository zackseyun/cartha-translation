  text: 'And the sons of Zebulun: Sered[a], Elon, and Jahleel.'
translation:
  language: ja
  text: ゼブルンの息子たちは、セレド、エロン、ヤフレエル。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 息子たちは
  rationale: בְנֵיは「息子」の構文複数形で、系譜の文脈に即して「息子たち」とした。接続詞וּは、独立した日本語節として不自然になるため明示せず、列挙の流れを語順と読点で表した。
- source_word: זְבוּלֻן
  choice: ゼブルン
  rationale: 人名として、現代日本語の聖書で広く認識される慣用表記を用いた。
- source_word: סֶרֶד
  choice: セレド
  rationale: 人名סֶרֶדをヘブライ語の子音と母音に沿って日本語に音写した。
- source_word: וְ/אֵלוֹן
  choice: エロン
  rationale: ここでは普通名詞ではなく人名であるため「エロン」と音写した。接続詞וְは日本語の並列読点で自然に表した。
- source_word: וְ/יַחְלְאֵל
  choice: ヤフレエル
  rationale: 語頭のיを「ヤ」、חを日本語で近似可能な「フ」として反映し、人名を原語寄りに音写した。接続詞וְは列挙によって表した。
