base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/025.yaml
  text: 'These are the sons of Bilhah[a], whom Laban gave to Rachel his daughter, and she bore these to Jacob: seven persons in all.'
translation:
  language: ja
  text: これらは、ラバンが娘ラケルに与えたビルハの息子たちである。ビルハがヤコブに産んだ者は、全部で七人であった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「すべての人（ネフェシュ）、七」となる。人数の総計を表す言い方。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: 以上は
  rationale: 直前までに列挙された人々をまとめて指す複数指示語。日本語の系譜の文脈では「以上は」が自然で明確。
- source_word: בְּנֵי בִלְהָה
  choice: ビルハの子ら
  rationale: בְּנֵי はここで系譜に挙げられた男子を指す。「子ら」は原文の複数形と系譜的関係を簡潔に保つ。
- source_word: אֲשֶׁר נָתַן לָבָן לְרָחֵל בִּתּוֹ
  choice: ラバンが娘ラケルに与えた
  rationale: 関係節がビルハを修飾する構造を保ち、לְ を授与の相手として訳した。「娘」はラケルとラバンの関係を明示する。
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: 彼女がヤコブに産んだこれらの者は
  rationale: 女性単数の主語を「彼女」としてビルハに対応させ、誕生の定型表現と列挙された人々への指示を自然な日本語で表した。
- source_word: כָּל נֶפֶשׁ שִׁבְעָה
  choice: 全部で七人であった
  rationale: 人数を数える נֶפֶשׁ はここでは「人」を意味する。ヘブライ語の慣用句を現代日本語で自然な総数表現にした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に分かりやすい、簡潔で品位ある系譜文体とした。長い関係節による曖昧さを避けるため二文に分けたが、ビルハがラバンからラケルに与えられたこと、ビルハがヤコブに産んだ者たちであること、総数が七人であることを原文どおり保持した。
