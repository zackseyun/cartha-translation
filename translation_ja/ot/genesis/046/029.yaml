  text: וַ/יֶּאְסֹ֤ר יוֹסֵף֙ מֶרְכַּבְתּ֔/וֹ וַ/יַּ֛עַל לִ/קְרַֽאת יִשְׂרָאֵ֥ל אָבִ֖י/ו גֹּ֑שְׁנָ/ה וַ/יֵּרָ֣א אֵלָ֗י/ו וַ/יִּפֹּל֙ עַל צַוָּארָ֔י/ו וַ/יֵּ֥בְךְּ עַל צַוָּארָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/029.yaml
  text: Then Joseph harnessed his chariot and went up to meet Israel his father in Goshen[a]. He appeared before him, fell on his neck[b], and wept on his neck for a long time.
translation:
  language: ja
  text: ヨセフは自分の戦車に馬をつなぎ、父イスラエルを迎えるため、ゴシェンへ上って行った。父の前に姿を現すと[a]、その首に抱きつき、首を抱いたまま長い間泣き続けた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼に姿を現した」。ヨセフが父の前に自分の姿を見せたことを表す。
    reason: lexical_alternative
  - marker: b
    text: 原文末尾の語は「なお」「まだ」とも訳せる。ここでは、ヨセフが泣き続けたことを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר ... מֶרְכַּבְתּוֹ
  choice: 自分の戦車に馬をつなぎ
  rationale: אָסַרは本来「縛る、つなぐ」の意で、「戦車」を目的語とする場合は、走行のため馬をつないで用意することを表す。日本語では動作を具体化して自然にした。
- source_word: וַיַּעַל
  choice: 上って行った
  rationale: עלהの基本的な方向表現「上る」を保ちつつ、日本語の移動表現として整えた。
- source_word: לִקְרַאת יִשְׂרָאֵל אָבִיו
  choice: 父イスラエルを迎えるため
  rationale: לִקְרַאתは相手との出会いに向かうことを表す。この再会の文脈では「迎える」が自然であり、原文どおり「イスラエル」の名を保った。
- source_word: גֹּשְׁנָה
  choice: ゴシェンへ
  rationale: 地名に付く方向を示す-הを反映し、目的地として「へ」と訳した。
- source_word: וַיֵּרָא אֵלָיו
  choice: 父の前に姿を現すと
  rationale: ראהのニファル形は「見えるようになる、姿を現す」の意。主語がヨセフ、相手が父であることを日本語では明示した。
- source_word: וַיִּפֹּל עַל צַוָּארָיו
  choice: その首に抱きつき
  rationale: 字義的には「その首の上に倒れかかる」だが、感情のこもった抱擁を表すヘブライ語の慣用句なので、現代日本語で自然な表現とした。
- source_word: וַיֵּבְךְּ עַל צַוָּארָיו
  choice: 首を抱いたまま…泣き続けた
  rationale: 原文が「首」を繰り返して再会時の身体的な近さを描く点をできるだけ保ち、日本語として理解しやすくした。
- source_word: עוֹד
  choice: 長い間…続けた
  rationale: 基本義は「なお、まだ」であり、ここでは泣く動作が継続したことを示す。文脈上の継続時間を自然な日本語で表した。
theological_decisions: []
