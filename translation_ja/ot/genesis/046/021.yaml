  register: 現代の一般読者に明瞭な、簡潔で格調を保った系譜文体とした。ヘブライ語の列挙には動詞がないため、日本語でも名簿形式の体言止めを用いた。人名はマソラ本文を基準に一貫して音写し、並行箇所との差異は脚注に残した。
