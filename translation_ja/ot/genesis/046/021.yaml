  text: וּ/בְנֵ֣י בִנְיָמִ֗ן בֶּ֤לַע וָ/בֶ֨כֶר֙ וְ/אַשְׁבֵּ֔ל גֵּרָ֥א וְ/נַעֲמָ֖ן אֵחִ֣י וָ/רֹ֑אשׁ מֻפִּ֥ים וְ/חֻפִּ֖ים וָ/אָֽרְדְּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/021.yaml
  text: 'And the sons of Benjamin: Bela[a], Beker, Ashbel, Gera, Naaman, Ehi, Rosh, Muppim, Huppim[d][c][b], and Ard.'
translation:
  language: ja
  text: また、ベニヤミンの子らは、ベラ、ベケル、アシュベル、ゲラ、ナアマン、エヒ[a]、ロシュ、ムピム[b]、フピム、アルド[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 民数記26章38節の並行するベニヤミン族の系譜では、ここで「エヒ」とある位置に「アヒラム」が挙げられている。
    reason: cross_reference
  - marker: b
    text: 並行する系譜の伝承には「ムピム」に対応して「シュピム」などの異形が見られるが、ここではマソラ本文に従った。
    reason: textual_variant
  - marker: c
    text: 歴代誌第一8章3節のベニヤミン族の系譜には、関連する名の形「アダル」があるが、この節の本文は「アルド」と読む。
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי בִנְיָמִן
  choice: また、ベニヤミンの子らは
  rationale: 接続詞וּを系譜の続きとして「また」とし、構成形複数בְנֵיを簡潔に「子ら」と訳した。
- source_word: בֶּלַע
  choice: ベラ
  rationale: ヘブライ語本文の固有名を日本語で音写した。
- source_word: בֶּכֶר
  choice: ベケル
  rationale: 本文の子音と発音に沿って音写した。英語での綴りの違いは日本語訳には実質的な影響がないため注記しない。
- source_word: אַשְׁבֵּל
  choice: アシュベル
  rationale: ヘブライ語本文の固有名を日本語で音写した。
- source_word: גֵּרָא
  choice: ゲラ
  rationale: ヘブライ語本文の固有名を日本語で音写した。
- source_word: נַעֲמָן
  choice: ナアマン
  rationale: 喉音を独立した母音として示す慣用的な日本語表記を採った。
- source_word: אֵחִי
  choice: エヒ
  rationale: マソラ本文の名をそのまま音写し、並行系譜の別名で置き換えなかった。
- source_word: רֹאשׁ
  choice: ロシュ
  rationale: ここでは人名の列挙中にあるため、普通名詞の「頭」「かしら」と訳さず音写した。
- source_word: מֻפִּים
  choice: ムピム
  rationale: マソラ本文の形を音写し、並行する系譜に見られる異形で本文を修正しなかった。
- source_word: חֻפִּים
  choice: フピム
  rationale: マソラ本文の固有名を日本語で音写した。
- source_word: אָרְדְּ
  choice: アルド
  rationale: マソラ本文の形を音写し、並行系譜にある関連名に置き換えなかった。
theological_decisions: []
