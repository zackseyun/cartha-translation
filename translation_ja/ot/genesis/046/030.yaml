  yaml_path: translation/ot/genesis/046/030.yaml
  text: Then Israel said to Joseph[a], “Now I can die, since I have seen your face and know that you are still alive.”
translation:
  language: ja
  text: そこでイスラエルはヨセフに言った。「おまえの顔を見た今、もう私は死んでもよい[a]。おまえが今も生きているのだから。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より形式的には、「今、私は死のう。おまえの顔を見た後で、おまえが今も生きているのだから」とも訳せる。ヘブライ語は簡潔な慣用表現で、本文では、満ち足りて死を受け入れられるという意味を自然な日本語で表した。
    reason: אָמ֣וּתָהのコホータティブと、後続する句の時間的・理由を示す結び付け方にある翻訳上の幅を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで…言った
  rationale: 物語を先へ進めるワウ継続法の順接的な働きを、現代日本語の自然な語り口で表した。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 原文がヤコブではなく契約名「イスラエル」を明記しているため、そのまま保持した。
- source_word: אָמ֣וּתָה
  choice: 私は死んでもよい
  rationale: コホータティブが表す話者の意志・心情を、死の許可を求める言い方ではなく、満ち足りて死を受け入れられるという文脈上の意味として自然に表した。
- source_word: הַפָּעַם
  choice: 今、もう
  rationale: 直訳的な「この時」を避け、長い悲嘆を経た現在の転機を示す語感を表した。「今度こそ」ほど強く限定しない表現とした。
- source_word: אַחֲרֵי רְאוֹתִי אֶת־פָּנֶיךָ
  choice: おまえの顔を見た今
  rationale: 「私がおまえの顔を見た後」という時間的関係を簡潔で自然な日本語にしつつ、「顔」という原文の具体的な表現を残した。
- source_word: כִּי
  choice: …のだから
  rationale: 後続節がイスラエルの発言の根拠を示す読みを採ったが、原文にない「分かった」を補わず、簡潔な因果関係として訳した。
- source_word: עוֹדְךָ חָי
  choice: おまえが今も生きている
  rationale: עוֹדの継続の意味を「今も」で明確にし、自然な現代日本語とした。
theological_decisions:
- issue: אָמ֣וּתָהのコホータティブの解釈
  choice: 死んでもよい
  alternative: 死のう／私を死なせてくれ
  rationale: ここでは死を求める願いや他者への許可申請ではなく、ヨセフの生存を確認して死を受け入れられるようになった心情を述べるものと判断した。ただし意志的な「死のう」という形式的可能性は脚注に示した。
- issue: כִּיと前節との関係
  choice: 理由を示す「…のだから」
  alternative: 内容を示す「…ということを」
  rationale: כִּיには複数の用法があり得るが、この文脈では「今も生きている」ことが死を受け入れられる理由となる読みが自然である。原文にない認識動詞は本文に加えなかった。
translation_notes:
  register: 明快で現代的だが、族長の再会場面にふさわしい落ち着いた語調とした。父が成人した息子に語る場面として「おまえ」を用いたが、粗野にならない文脈的な親称として機能する。
