  text: And when Pharaoh calls you and says[a], ‘What is your occupation?’
translation:
  language: ja
  text: ファラオがあなたがたを呼び出して、「あなたがたの仕事は何か」と尋ねたなら、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: …たなら
  rationale: 将来起こる場面を導入するヘブライ語の慣用表現。後続する指示につながる条件・時の含みを、自然な現代日本語で表した。
- source_word: יִקְרָא לָכֶם
  choice: あなたがたを呼び出して
  rationale: קרא に ל を伴う表現は、ここでは宮廷へ呼ぶ、召し出す意。「呼び出す」は場面に合い、過度に古風でもない。
- source_word: פַּרְעֹה
  choice: ファラオ
  rationale: 王の称号として、日本語聖書で広く通用する表記を採用した。
- source_word: וְאָמַר
  choice: 尋ねた
  rationale: 字義は「言う」だが、直後に疑問文が続くため、日本語では発話機能を明確にする「尋ねる」が自然。内容そのものは疑問文に保持されている。
- source_word: מַה מַּעֲשֵׂיכֶם
  choice: あなたがたの仕事は何か
  rationale: מַעֲשֶׂה は広く「行い・仕事」を表すが、この文脈では生業を問う。「仕事」は現代日本語で明瞭であり、「職業」より原語の語義幅も保つ。
