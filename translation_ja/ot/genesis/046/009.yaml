  text: ルベンの子らは、ハノク、パル、ヘツロン、カルミ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: ルベンの子らは
  rationale: וּは系図の列挙を継続する接続辞だが、日本語では文脈上明らかなため独立した「そして」を置かず、自然な列挙表現とした。בְנֵיは複数形なので「子ら」とした。
- source_word: חֲנוֹךְ
  choice: ハノク
  rationale: ヘブライ語の子音と母音に即した日本語音写。
- source_word: וּ/פַלּוּא
  choice: パル
  rationale: ヘブライ語名 פַלּוּא を日本語で自然に音写した。接続辞は読点による列挙に反映した。
- source_word: וְ/חֶצְרוֹן
  choice: ヘツロン
  rationale: ヘブライ語の ח と צ をそれぞれ日本語慣用の「ヘ」「ツ」で表した。接続辞は列挙構造に反映した。
- source_word: וְ/כַרְמִי
  choice: カルミ
  rationale: ヘブライ語名を音写し、最後の接続辞は日本語の列挙では明示せず語順と句読法で表した。
