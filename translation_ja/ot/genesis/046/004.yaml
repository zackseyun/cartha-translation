  text: אָנֹכִ֗י אֵרֵ֤ד עִמְּ/ךָ֙ מִצְרַ֔יְמָ/ה וְ/אָנֹכִ֖י אַֽעַלְ/ךָ֣ גַם עָלֹ֑ה וְ/יוֹסֵ֕ף יָשִׁ֥ית יָד֖/וֹ עַל עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/004.yaml
  text: I myself will go down with you to Egypt[a], and I myself will also surely bring you up; and Joseph will place his hand on your eyes.
translation:
  language: ja
  text: わたし自身があなたと共にエジプトへ下る。そして、わたし自身が必ずあなたをも上らせる。ヨセフがあなたの目に手を置く[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヨセフがヤコブの死の際にそばにいて、その目を閉じることを指すとされる慣用表現。
    reason: ヘブライ語の具体的な慣用表現が通常指す意味を、本文の像を保ったまま説明するため。
lexical_decisions:
- source_word: אָנֹכִי
  choice: わたし自身が
  rationale: 独立人称代名詞が二度明示されているため、神ご自身の同行と働きを強調する表現とした。
- source_word: אֵרֵד עִמְּךָ מִצְרַיְמָה
  choice: あなたと共にエジプトへ下る
  rationale: エジプトへの移動を表す方向表現と、同行を示す前置詞を自然な現代日本語で保った。
- source_word: אַעַלְךָ גַם עָלֹה
  choice: 必ずあなたを上らせる
  rationale: עלהの使役形と不定詞絶対形による強調を保った。「上らせる」は、ヤコブ本人、遺体、子孫のいずれを指すかを本文で限定しない。גםの付加的な力は、前文を受ける「そして」と約束の継続によって表した。
- source_word: יָשִׁית יָדוֹ עַל עֵינֶיךָ
  choice: あなたの目に手を置く
  rationale: 死者の目を閉じることを指すと考えられる慣用表現だが、本文ではヘブライ語の具体的な像を残し、意味を脚注で説明した。
theological_decisions:
- issue: 「あなたを上らせる」という約束の成就対象
  choice: ヤコブを「上らせる」という簡潔で広い表現を維持する。
  alternative: ヤコブの遺体がカナンへ運ばれること、または子孫が出エジプトによって導き出されることに限定する。
  rationale: ヘブライ語は、ヤコブ本人、その埋葬、子孫における代表的成就という複数の含みを許す。訳文ではその神学的緊張を解消しない。
- issue: ヨセフが目に手を置く行為
  choice: 具体的な身体動作を本文に残し、臨終時の意味を脚注で示す。
  alternative: 本文を「ヨセフがあなたの目を閉じる」と慣用的に訳す。
  rationale: 原文の像を保持しながら、現代の読者に慣用的意味も伝えるため。
translation_notes:
  register: 神の強い自己強調を「わたし自身が」で示した。全体は明瞭で格調ある現代標準日本語とし、「下る／上らせる」という原文の方向表現を保持した。
