source:
  edition: WLC
  text: וְ/הָ/אֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְ/צֹאנָ֧/ם וּ/בְקָרָ֛/ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֖ם הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/032.yaml
  text: The men are shepherds[a], for they have been keepers of livestock, and they have brought their flocks and their herds and all that they have.
translation:
  language: ja
  text: 彼らは羊飼いです[a]。というのも、家畜を飼う者たちだからです。彼らは羊や山羊の群れ、牛の群れ、そして持ち物すべてを持って来ました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼らは羊飼いでした。というのも、家畜を飼う者たちだったからです。彼らは……持って来ました」とも訳せる。ヘブライ語の完了形は、ここでは過去のこととして訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: その人たちは
  rationale: 文脈上すでに言及されているヨセフの兄弟たちを指す定冠詞付き名詞。日本語では接続詞を明示せず、指示語で自然に既出の人々を示した。
- source_word: רֹעֵי צֹאן
  choice: 羊飼い
  rationale: 羊・山羊などの小家畜を牧する者を表す慣用的で明快な日本語。
- source_word: כִּי
  choice: （文を分けて説明関係で表現）
  rationale: ここでは前言の理由・説明を導く。日本語では「です。家畜を…」と続けることで、硬い「なぜなら」を避けつつ説明関係を保った。
- source_word: אַנְשֵׁי מִקְנֶה
  choice: 家畜を飼う者たち
  rationale: 直訳的な「家畜の人々」ではなく、畜産を生業とする人々という職業的意味を自然に表した。
- source_word: הָיוּ
  choice: であり
  rationale: 完了形は彼らの確立した職業・身分を表す。日本語では現在にも及ぶ背景として「であり」としたが、過去としても解し得るため脚注で示した。
- source_word: וְצֹאנָם
  choice: 羊や山羊の群れ
  rationale: צֹאן は羊だけでなく山羊も含み得る小家畜の集合名詞なので、範囲を明確にした。
- source_word: וּבְקָרָם
  choice: 牛の群れ
  rationale: בָּקָר は牛類を指すため、広すぎる「家畜の群れ」ではなく具体的に訳した。
- source_word: וְכָל אֲשֶׁר לָהֶם
  choice: 持ち物すべて
  rationale: 彼らに属するあらゆるものを包括する簡潔で自然な表現。
- source_word: הֵבִיאוּ
  choice: 連れて来ました
  rationale: 家畜が主要な目的語であるため日本語では「連れて来る」が自然。持ち物も目的語に含まれるので「持って来ました」も可能だが、群れを伴って到着した場面を優先した。
theological_decisions: []
translation_notes:
  register: 明快な現代標準日本語。ファラオに兄弟たちの職業を説明する発言として、丁寧体を用いた。「羊や山羊の群れ、牛の群れ」でヘブライ語の家畜区分を保ちつつ、一般読者にも分かる表現とした。
