  text: וּ/בְנֵ֥י יוֹסֵ֛ף אֲשֶׁר יֻלַּד ל֥/וֹ בְ/מִצְרַ֖יִם נֶ֣פֶשׁ שְׁנָ֑יִם כָּל הַ/נֶּ֧פֶשׁ לְ/בֵֽית יַעֲקֹ֛ב הַ/בָּ֥אָה מִצְרַ֖יְמָ/ה שִׁבְעִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/027.yaml
  text: And the sons of Joseph who were born to him in Egypt were two persons[b][a]. All the persons of the house of Jacob who came to Egypt were seventy.
translation:
  language: ja
  text: エジプトでヨセフの子として生まれた息子たちは二人であった。[a] エジプトに来たヤコブの家の者は、全部で七十人であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の「ネフェシュ」は、ここでは家族や系譜の人数を数える際の「人」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יוֹסֵף
  choice: ヨセフに…息子たち
  rationale: בְּנֵי は、文脈上すでに名を挙げられたヨセフの男子を指すため、「子どもたち」ではなく「息子たち」とした。接続詞 וּ は、日本語では文脈上あえて「そして」とせず自然につないだ。
- source_word: אֲשֶׁר יֻלַּד לוֹ בְמִצְרַיִם
  choice: エジプトでヨセフに生まれた
  rationale: 受動形 ילד と לוֹ の構文を保ち、「ヨセフがもうけた」と能動化せず、「ヨセフに生まれた」とした。בְּמִצְרַיִם は場所を表す。
- source_word: נֶפֶשׁ שְׁנָיִם
  choice: 二人
  rationale: נֶפֶשׁ はここでは系譜上の人数を数える語であり、日本語では自然な助数表現「二人」で示した。
- source_word: כָּל הַנֶּפֶשׁ
  choice: 者は、全部で
  rationale: 単数形 נֶפֶשׁ は集合的に家族の構成員を数えている。「すべての魂」とせず、人数集計であることが明確な日本語にした。
- source_word: לְבֵית יַעֲקֹב
  choice: ヤコブの家の
  rationale: 「家」は血縁者と家に属する者から成る家族・家系という共同体的意味を保つ。
- source_word: הַבָּאָה מִצְרַיְמָה
  choice: エジプトに来た
  rationale: 冠詞付き分詞を集合を修飾する連体節とし、方向を示す語尾 ה を「エジプトに」で表した。
- source_word: שִׁבְעִים
  choice: 七十人であった
  rationale: 動詞のない総数提示の節を、自然で格調を保つ日本語の判断文にした。人数であることを「人」で明示した。
theological_decisions:
- issue: 系譜上の人数集計における נֶפֶשׁ の訳し方
  choice: 「二人」「者」「七十人」として人数を表す
  alternative: 「魂」「命」と逐語的に訳す
  rationale: この箇所の נֶפֶשׁ は人間の構成要素について教える語ではなく、一人ひとりを数える慣用的な用法である。したがって、特定の人間観を読み込ませず、文脈上の意味を明確にした。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、「ヤコブの家」という聖書本文の家族的・共同体的表現と、叙述文としての簡潔で落ち着いた調子を保った。
