  yaml_path: translation/ot/genesis/046/019.yaml
  text: 'The sons of Rachel, Jacob’s wife: Joseph and Benjamin.'
translation:
  language: ja
  text: ヤコブの妻ラケルの息子たちは、ヨセフとベニヤミン。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: 息子たち
  rationale: בְּנֵי は「息子」の複数・連語形であり、ここではラケルが直接産んだ男子二人を挙げているため、「子どもたち」や「子孫」ではなく「息子たち」とした。
- source_word: רָחֵל
  choice: ラケル
  rationale: 日本語聖書で広く定着している固有名の表記を用いた。
- source_word: אֵשֶׁת יַעֲקֹב
  choice: ヤコブの妻
  rationale: 連語関係を自然な日本語の属格表現で再現した。אִשָּׁה はここでは婚姻関係を示すため「女」ではなく「妻」が適切である。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着している固有名の表記を用いた。
- source_word: וּבִנְיָמִן
  choice: とベニヤミン
  rationale: 接続詞 וּ を、二名を列挙する自然な日本語の「と」で表した。固有名は定着した表記を用いた。
theological_decisions: []
translation_notes:
  register: 系譜的な一覧の簡潔さを保ちつつ、現代日本語として自然で格調を損なわない名詞文とした。原文の語順を大きく崩さず、「ヤコブの妻」を「ラケル」に前置して関係を明確にした。
