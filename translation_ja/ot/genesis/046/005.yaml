source:
  edition: WLC
  text: וַ/יָּ֥קָם יַעֲקֹ֖ב מִ/בְּאֵ֣ר שָׁ֑בַע וַ/יִּשְׂא֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת יַעֲקֹ֣ב אֲבִי/הֶ֗ם וְ/אֶת טַפָּ/ם֙ וְ/אֶת נְשֵׁי/הֶ֔ם בָּ/עֲגָל֕וֹת אֲשֶׁר שָׁלַ֥ח פַּרְעֹ֖ה לָ/שֵׂ֥את אֹתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/005.yaml
  text: Then Jacob set out from Beersheba[a], and the sons of Israel carried Jacob their father, their little ones[b], and their wives in the wagons that Pharaoh had sent to carry him.
translation:
  language: ja
  text: それから、ヤコブはベエル・シェバを出発した[a]。イスラエルの息子たちは、父ヤコブと幼い子どもたち、妻たちを、ファラオがヤコブを運ぶために送った荷車に乗せて運んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「立ち上がった」。ここでは旅立つことを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 出発した
  rationale: 基本義は「立ち上がった」だが、場所を示す מִן と結び付く旅の文脈では、そこを発つことを表す。「出発した」はこの慣用的意味を自然な現代日本語で伝える。
- source_word: מִבְּאֵר שָׁבַע
  choice: ベエル・シェバを
  rationale: 地名は日本語で一般的な音写を用い、起点を表す前置詞 מִן は「を出発した」という構文に含めた。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの息子たち
  rationale: ここで「イスラエル」はヤコブを指し、בְנֵי は実際にその息子たちを指すため、「イスラエルの子ら」より具体的に訳した。
- source_word: וַיִּשְׂאוּ
  choice: 荷車に乗せて運んだ
  rationale: נשׂא は「担う、運ぶ」の意。人々を荷車で移送する場面なので、手段を含めた自然な日本語とした。
- source_word: טַפָּם
  choice: 幼い子どもたち
  rationale: טַף は特に幼い子どもや扶養される者を指す。ここでは家族の構成員としての幼い子どもを明確にした。
- source_word: נְשֵׁיהֶם
  choice: 妻たち
  rationale: 家族が移住する文脈では「女たち」ではなく「妻たち」が適切である。
- source_word: בָּעֲגָלוֹת
  choice: 荷車に乗せて
  rationale: עֲגָלוֹת は物や人を運ぶ車を指す。「荷車」は時代背景に合い、日本語としても明瞭である。
- source_word: אֲשֶׁר שָׁלַח פַּרְעֹה
  choice: ファラオが…送った
  rationale: 関係節を保ち、この荷車がファラオから送られたものであることを明示した。
- source_word: לָשֵׂאת אֹתוֹ
  choice: ヤコブを運ぶために
  rationale: 目的を表す不定詞と三人称男性単数接尾辞を反映した。代名詞の指示対象は文脈上ヤコブなので、日本語では固有名を補って曖昧さを避けた。
theological_decisions: []
