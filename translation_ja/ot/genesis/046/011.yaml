  text: 'And the sons of Levi: Gershon, Kohath, and Merari.'
translation:
  language: ja
  text: レビの息子たちは、ゲルション、ケハテ、メラリ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: 息子たちは
  rationale: בְנֵי は系図で用いられる構成形複数「～の息子たち」。節頭の ו は一覧の連続を示すが、日本語では文脈上明らかであり、自然な列挙文とするため独立した「そして」は置かない。
- source_word: לֵוִי
  choice: レビ
  rationale: ヘブライ語の人名を、現代日本語の聖書で広く認識される慣用表記で音写した。
- source_word: גֵּרְשׁוֹן
  choice: ゲルション
  rationale: 本文の גֵּרְשׁוֹן を、類似する別名ゲルショムと区別しつつ音写した。
- source_word: קְהָת
  choice: ケハト
  rationale: ヘブライ語の人名を、日本語で自然かつ識別しやすい慣用的な形で音写した。
- source_word: וּ/מְרָרִי
  choice: メラリ
  rationale: 人名を慣用的に音写した。接続詞 ו は三名の列挙関係として日本語の読点により自然に表した。
theological_decisions: []
translation_notes:
  register: 簡潔な系図の列挙として、現代標準日本語の自然さと原文の構造を両立させた。述語を補わず、原文同様に名を提示する体言的表現とした。
