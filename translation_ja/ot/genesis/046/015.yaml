  text: אֵ֣לֶּה בְּנֵ֣י לֵאָ֗ה אֲשֶׁ֨ר יָֽלְדָ֤ה לְ/יַעֲקֹב֙ בְּ/פַדַּ֣ן אֲרָ֔ם וְ/אֵ֖ת דִּינָ֣ה בִתּ֑/וֹ כָּל נֶ֧פֶשׁ בָּנָ֛י/ו וּ/בְנוֹתָ֖י/ו שְׁלֹשִׁ֥ים וְ/שָׁלֹֽשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/015.yaml
  text: These are the sons of Leah[a], whom she bore to Jacob in Paddan-aram, along with Dinah his daughter[b]. The total number of his sons and his daughters was thirty-three.
translation:
  language: ja
  text: これらは、レアがパダン・アラムでヤコブに産んだ息子たち、ならびにヤコブの娘ディナである。ヤコブの息子たちと娘たちは、合わせて三十三人[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼の息子たちと娘たちの全員」。ヘブライ語で人数を数える際の「ネフェシュ」は、ここでは「人」を指す。
    reason: 原文の人数表現と語法を示すため。
lexical_decisions:
- source_word: בְּנֵי לֵאָה
  choice: レアが…産んだ息子たち
  rationale: בְּנֵי は男性複数形で、系譜の見出しとして「息子たち」を意味する。後続の一覧には子孫も含まれるが、本文の系譜的な表現を保った。
- source_word: אֲשֶׁר יָלְדָה לְיַעֲקֹב
  choice: レアが…ヤコブに産んだ
  rationale: 女性を主語とする יָלַד の基本義「産む」を自然な日本語で表し、לְיַעֲקֹב の関係も保持した。
- source_word: בְּפַדַּן אֲרָם
  choice: パダン・アラムで
  rationale: 地名として音写し、日本語で読みやすい中黒表記とした。
- source_word: וְאֵת דִּינָה בִתּוֹ
  choice: これにヤコブの娘ディナも含まれる
  rationale: 息子たちという見出しの後にディナを加える וְאֵת の働きを「も含まれる」で明確にした。בִתּוֹ の指示対象は文脈上ヤコブなので、曖昧な「彼の」を避けて名を補った。
- source_word: כָּל נֶפֶשׁ
  choice: 合わせて…人
  rationale: 人数を数える文脈の נֶפֶשׁ は、霊魂ではなく「人」を指す。「合わせて」で総数を表すヘブライ語の慣用表現を自然に訳した。
- source_word: בָּנָיו וּבְנוֹתָיו
  choice: ヤコブの息子と娘
  rationale: 原文が息子と娘を明示的に区別しているため、「子どもたち」と一括せず両方を示した。
- source_word: שְׁלֹשִׁים וְשָׁלֹשׁ
  choice: 三十三人
  rationale: 基数をそのまま訳し、人数を示す助数詞を添えた。
theological_decisions:
- issue: 「魂」と「人」のどちらで訳すか
  choice: 人数を表す「人」
  alternative: 「魂」
  rationale: נֶפֶשׁ はここでは系譜上の人数を数える語であり、人間の非物質的部分についての教理的主張ではない。
- issue: 三十三人という総数と系譜一覧の数え方
  choice: 本文の総数をそのまま提示する
  alternative: 誰を数に含めるかを訳文内で説明する
  rationale: 原文は総数を三十三人と述べる一方、数え方には解釈上の問題が残る。翻訳本文で特定の計算法を断定せず、原文の緊張を保った。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、系譜にふさわしい簡潔で格調ある文体とした。「以上が」で直前までの一覧を受け、「彼の」の連続による指示の曖昧さを避けるため「ヤコブ」を明示した。
