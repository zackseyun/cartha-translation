base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/017.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah; and Serah their sister[b]. And the sons of Beriah: Heber and Malchiel.'
translation:
  language: ja
  text: アシェルの子らは、イムナ、イシュワ、イシュイ、ベリアであり、彼らの姉妹はセラであった。ベリアの子らは、ヘベルとマルキエルであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי אָשֵׁר
  choice: アシェルの子らは
  rationale: בְּנֵי は「息子たち／子ら」を意味する連語形。系図の簡潔な列挙として「子ら」を用い、冒頭の接続詞は日本語では省いた。אָשֵׁר は固有名として慣用的に「アシェル」と音写した。
- source_word: יִמְנָה
  choice: イムナ
  rationale: ヘブライ語の固有名を日本語で自然に音写した。
- source_word: וְיִשְׁוָה
  choice: イシュワ
  rationale: 固有名 יִשְׁוָה を音写し、接続詞は日本語の列挙形式に吸収した。
- source_word: וְיִשְׁוִי
  choice: イシュイ
  rationale: 固有名 יִשְׁוִי を音写し、接続詞は日本語の列挙形式に吸収した。
- source_word: וּבְרִיעָה
  choice: ベリア
  rationale: 固有名 בְּרִיעָה を日本語で自然に音写した。
- source_word: וְשֶׂרַח אֲחֹתָם
  choice: 彼らの姉妹はセラフであった
  rationale: 原文は直訳すれば「そして彼らの姉妹セラフ」という同格的な表現。現代日本語で関係が明確になるよう述語を補ったが、セラフが先に挙げた者たちの姉妹であるという内容はそのまま保った。שֶׂרַח は「セラフ」と音写した。
- source_word: וּבְנֵי בְרִיעָה
  choice: ベリアの子らは
  rationale: 新たな系図上の小区分として自然な日本語にし、接続詞は省略した。
- source_word: חֶבֶר
  choice: ヘベル
  rationale: 固有名 חֶבֶר を日本語の聖書名として自然に音写した。
- source_word: וּמַלְכִּיאֵל
  choice: マルキエル
  rationale: 固有名 מַלְכִּיאֵל を音写し、接続詞は日本語の「と」で表した。
theological_decisions: []
translation_notes:
  register: 簡潔な系図の調子を保ちつつ、現代標準日本語として読みやすい文にした。固有名はヘブライ語本文に基づく一般的な日本語音写を採用した。原文の同格表現は、日本語で親族関係を誤解なく伝えるため「彼らの姉妹はセラフであった」とした。
