  text: וּ/בְנֵ֣י גָ֔ד צִפְי֥וֹן וְ/חַגִּ֖י שׁוּנִ֣י וְ/אֶצְבֹּ֑ן עֵרִ֥י וַֽ/אֲרוֹדִ֖י וְ/אַרְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/016.yaml
  text: 'And the sons of Gad: Ziphion[a], Haggi, Shuni, Ezbon, Eri, Arodi, and Areli.'
translation:
  language: ja
  text: ガドの子らは、ツィフヨン[a]、ハギ、シュニ、エツボン、エリ、アロディ、アルエリ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は「ツィフヨン」。民数記26章15節では異形の「ツェフォン」となっている。
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי גָד
  choice: ガドの子らは
  rationale: בְנֵי は系譜上の実子を列挙する構文なので「子ら」とした。冒頭の接続詞 וּ は、前後に続く一覧の流れが日本語でも明らかなため、独立した「そして」とせず、自然な列挙文として表した。
- source_word: צִפְיוֹן
  choice: ツィフヨン
  rationale: この節のマソラ本文の母音を含む形を日本語で再現した。民数記26章15節に見られる異形「ツェフォン」と区別した。
- source_word: וְחַגִּי
  choice: ハギ
  rationale: 固有名詞 חַגִּי の発音を明瞭で簡潔な日本語表記に移した。接続詞は読点による列挙で表現した。
- source_word: שׁוּנִי
  choice: シュニ
  rationale: マソラ本文の固有名詞の音形に沿って音写した。
- source_word: וְאֶצְבֹּן
  choice: エツボン
  rationale: 固有名詞 אֶצְבֹּן をヘブライ語の子音と母音に即して音写した。
- source_word: עֵרִי
  choice: エリ
  rationale: 固有名詞 עֵרִי の音形に沿い、日本語で自然に読める形にした。
- source_word: וַאֲרוֹדִי
  choice: アロディ
  rationale: 固有名詞 אֲרוֹדִי を音写した。接続詞は列挙の読点に含めた。
- source_word: וְאַרְאֵלִי
  choice: アルエリ
  rationale: 固有名詞 אַרְאֵלִי の音形に沿って音写した。原文の最後の接続詞は、日本語では列挙の終端として自然に省略した。
theological_decisions: []
