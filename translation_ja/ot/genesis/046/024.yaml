base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/024.yaml
  text: 'And the sons of Naphtali: Jahzeel[a], Guni, Jezer, and Shillem.'
translation:
  language: ja
  text: ナフタリの息子たちは、ヤフツエル、グニ、エツェル、シレムであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי נַפְתָּלִי
  choice: ナフタリの息子たちは
  rationale: בְנֵי は系図の文脈で実子を列挙する構文なので「息子たち」とし、接続詞 וּ は日本語の一覧文として自然につながる形に反映した。
- source_word: יַחְצְאֵל
  choice: ヤフツェエル
  rationale: ヘブライ語の子音 ח と צ、および母音をできるだけ明確に反映した日本語音写。
- source_word: וְגוּנִי
  choice: グニ
  rationale: 固有名詞 גּוּנִי の簡潔で自然な日本語音写。接続詞は列挙の読点で表した。
- source_word: וְיֵצֶר
  choice: エツェル
  rationale: 語頭の יְ が母音的に発音されるマソラ本文の形を踏まえ、歴代誌上7章13節とも整合する日本語音写とした。
- source_word: וְשִׁלֵּם
  choice: シレム
  rationale: 固有名詞 שִׁלֵּם を日本語で自然に音写した。ダゲシュによる子音の重なりは、日本語の慣用的な聖書人名表記では促音化せず「シレム」とした。
theological_decisions: []
translation_notes:
  register: 現代標準日本語による簡潔で品位ある系図表現。「〜であった」により、前後に続く氏族一覧の叙述として自然に整えた。人名は英語形からではなくWLCのヘブライ語形に基づいて音写した。
