  yaml_path: translation/ot/genesis/046/007.yaml
  text: His sons and his grandsons with him[a], his daughters and his granddaughters[b], and all his offspring he brought with him to Egypt.
translation:
  language: ja
  text: 彼は、息子たちとその息子たち、娘たちとその娘たち、そして自分の子孫をすべて、一緒にエジプトへ連れて行った[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「彼のすべての種」。ここでは「彼のすべての子孫」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: 息子たち
  rationale: 後に「娘たち」と明確に区別されているため、広義の「子どもたち」ではなく、男性の子を指す「息子たち」とした。
- source_word: וּבְנֵי בָנָיו
  choice: 男の孫たち
  rationale: 字義は「彼の息子たちの息子たち」。自然な現代日本語で世代と性別を簡潔に示した。父系に限定する原文の形は脚注で明示した。
- source_word: אִתּוֹ
  choice: 一緒に
  rationale: ヤコブへの同行を表す。日本語では動詞「連れて行った」と組み合わせて「一緒に」とするのが自然である。
- source_word: בְּנֹתָיו
  choice: 娘たち
  rationale: 男性の子らと対照される女性の子を直接的に表した。
- source_word: וּבְנוֹת בָּנָיו
  choice: 女の孫たち
  rationale: 字義は「彼の息子たちの娘たち」。自然な日本語では「女の孫たち」とし、原文の父系表現は脚注に残した。
- source_word: וְכָל זַרְעוֹ
  choice: そして自分の子孫を皆
  rationale: זֶרַע の集合的な意味を、この家族移住の文脈に即して「子孫」とした。「皆」で כָל を明示した。字義的な「種」は脚注で示した。
- source_word: הֵבִיא
  choice: 連れて行った
  rationale: בוא のヒフィル形は「来させる／連れて来る・行く」を表す。人々を伴ってエジプトへ移動する文脈では「連れて行った」が自然である。
- source_word: מִצְרָיְמָה
  choice: エジプトへ
  rationale: 方向を示す語尾を伴い、エジプトに向かう移動を表すため「エジプトへ」とした。
