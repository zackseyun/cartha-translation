  text: וַ/יֹּ֨אמֶר יוֹסֵ֤ף אֶל אֶחָי/ו֙ וְ/אֶל בֵּ֣ית אָבִ֔י/ו אֶעֱלֶ֖ה וְ/אַגִּ֣ידָה לְ/פַרְעֹ֑ה וְ/אֹֽמְרָ֣ה אֵלָ֔י/ו אַחַ֧/י וּ/בֵית אָבִ֛/י אֲשֶׁ֥ר בְּ/אֶֽרֶץ כְּנַ֖עַן בָּ֥אוּ אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/031.yaml
  text: Then Joseph said to his brothers and to his father’s household[a], “I will go up and report to Pharaoh, and I will say to him, ‘My brothers and my father’s household, who were in the land of Canaan, have come to me.’”
translation:
  language: ja
  text: そこでヨセフは、兄弟たちと父の家族[a]に言った。「私は上ってファラオに報告し、こう申し上げます。『カナンの地にいた私の兄弟たちと父の家族が、私のもとに来ました。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「父の家」。ヘブライ語では「父の家」だが、ここでは建物ではなく、父を中心とする家族・家の者を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……言った
  rationale: 物語を進めるワウ継続法を、自然な日本語で前後の順序を示す「そこで」とした。
- source_word: אֶל אֶחָיו
  choice: 兄弟たちに
  rationale: 文脈上、ヨセフの男の兄弟たちを指すため、「兄弟たち」と訳した。
- source_word: וְאֶל בֵּית אָבִיו
  choice: 父の家族に
  rationale: בַּיִת はここで建物ではなく父を中心とする家族・家の者を表すため、「家族」とした。
- source_word: אֶעֱלֶה
  choice: 私はこれから……上って
  rationale: עלה の方向表現「上る」を保持しつつ、ヨセフの直近の意図が自然に伝わるよう「これから」を補った。
- source_word: וְאַגִּידָה לְפַרְעֹה
  choice: ファラオのもとへ……報告し
  rationale: נגד のヒフィルは知らせる、報告する意。宮廷でファラオに伝える場面に合う「報告する」を用いた。
- source_word: וְאֹמְרָה אֵלָיו
  choice: こう申し上げます
  rationale: 意図された次の発言を明示し、王に対する発話として自然な敬語にした。「こう」は後続の直接話法を導く。
- source_word: אַחַי וּבֵית אָבִי
  choice: 私の兄弟たちと父の家族
  rationale: 実際の兄弟たちと父を中心とする家族集団を指す。節内で一貫して「家族」とした。
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: カナンの地にいましたが
  rationale: 原文には明示的な繋辞がないが、日本語では過去の所在地として補う必要がある。後続する到来との関係を自然に示すため「いましたが」とした。
- source_word: בָּאוּ אֵלַי
  choice: 私のもとにやって来ました
  rationale: 完了した到来を表す完了形を、発話時点ですでにヨセフのもとにいることが分かる自然な過去形で表した。
theological_decisions: []
