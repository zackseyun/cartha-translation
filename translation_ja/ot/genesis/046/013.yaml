  text: 'And the sons of Issachar: Tola[a], Puvah, Job[b], and Shimron.'
translation:
  language: ja
  text: また、イッサカルの子は、トラ、プワ[a]、ヨブ[b]、シムロンである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 英語の一部の伝統では、「プワ」は「プア」とも表記される。
    reason: lexical_alternative
  - marker: b
    text: 歴代誌第一7章1節では、ヨブの代わりに「ヤシュブ」と読まれる。
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בְנֵי יִשָׂשכָר
  choice: また、イッサカルの子は
  rationale: 接続詞 וּ を「また」で表し、系譜の列挙が続く構造を保った。בְנֵי はここでは男性の子らを挙げる系譜用語なので、自然な日本語の「子」とした。יִשָׂשכָר は固有名として「イッサカル」と音写した。
- source_word: תּוֹלָע
  choice: トラ
  rationale: 系譜中の固有名として、ヘブライ語の音に即して音写した。
- source_word: וּ/פֻוָּה
  choice: プワ
  rationale: 接続詞は日本語の読点による列挙に組み込み、固有名 פֻוָּה を「プワ」と音写した。別表記「プア」は脚注に示した。
- source_word: וְ/י֥וֹב
  choice: ヨブ
  rationale: WLC本文の יוֹב をそのまま固有名「ヨブ」とした。歴代誌第一7章1節の異読に相当する別名は本文へ取り込まず、脚注に保存した。
- source_word: וְ/שִׁמְרֽוֹן
  choice: シムロン
  rationale: 固有名を「シムロン」と音写し、最後の接続関係は日本語の列挙形式で自然に表した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な、簡潔で品位ある系譜文体とした。「子ら」ではなく日本語の集合的用法で自然な「子」を用い、原文の連続する接続詞は冒頭の「また」と読点による列挙で表現した。
