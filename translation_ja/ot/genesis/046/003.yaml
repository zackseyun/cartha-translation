source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אָנֹכִ֥י הָ/אֵ֖ל אֱלֹהֵ֣י אָבִ֑י/ךָ אַל תִּירָא֙ מֵ/רְדָ֣ה מִצְרַ֔יְמָ/ה כִּֽי לְ/ג֥וֹי גָּד֖וֹל אֲשִֽׂימְ/ךָ֥ שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/003.yaml
  text: And he said[a], “I am God, the God of your father. Do not be afraid to go down to Egypt, for there I will make you into a great nation.”
translation:
  language: ja
  text: すると神は言われた。「わたしは神、あなたの父の神である。エジプトへ下ることを恐れてはならない[a]。わたしはそこで、あなたを大きな国民とする。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「エジプトへ下るのを恐れるな」。ヘブライ語では、「恐れる」に「下る」という不定詞が続く。
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֵל
  choice: 神
  rationale: 定冠詞を伴う神の称号で、語り手が自らを明確に神と名乗っている。日本語では「わたしは神」が自然であり、「エル」という音写は避けた。
- source_word: אֱלֹהֵי אָבִיךָ
  choice: あなたの父の神
  rationale: 単数形の「父」をそのまま保ち、ヤコブの父との契約的・祖先的なつながりを明示した。
- source_word: אַל תִּירָא מֵרְדָה
  choice: 下ることを恐れてはならない
  rationale: 「恐れる」に不定詞が続くヘブライ語の構造と意味を自然な現代日本語で表し、エジプトへ向かうことを「下る」とする原文の地理的表現も残した。
- source_word: מִצְרַיְמָה
  choice: エジプトへ
  rationale: 方向を示す語尾を、移動先を自然に示す助詞「へ」で表した。
- source_word: לְגוֹי גָּדוֹל
  choice: 大いなる国民と
  rationale: שׂיםと前置詞לの結果を表す構文に合わせ、ヤコブが大いなる国民として形成されることを示した。「大いなる」は約束の壮大さを保つ、簡潔で格調ある表現である。
- source_word: אֲשִׂימְךָ
  choice: あなたを……とする
  rationale: ここでのשׂיםは単に置くことではなく、あるものとして形成する、または成らせる意味なので、「とする」と訳した。
- source_word: שָׁם
  choice: そこで
  rationale: 約束が実現する場所として直前のエジプトを指すことを明確にした。
theological_decisions:
- issue: 神の自己紹介における祖先の呼称
  choice: あなたの父の神
  alternative: あなたの父祖たちの神
  rationale: 原文は「父」を単数形で記しているため、それを保った。複数の祖先一般へ意味を広げず、ヤコブの父との直接的な契約上のつながりを残した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の直接話法には簡潔で格調ある文体を用いた。「大いなる国民」は聖書的な約束の重みを保ちながら、意味が通じる表現として採用した。
