lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: シメオンの息子たちは
  rationale: 接続詞を伴う系譜の列挙を、日本語で自然に続ける形にした。「息子たち」はבְנֵיの複数形を明示する。
- source_word: יְמוּאֵל
  choice: エムエル
  rationale: ヘブライ語名の音を踏まえつつ、日本語聖書で通用する形に音写した。
- source_word: וְיָמִין וְאֹהַד וְיָכִין וְצֹחַר
  choice: ヤミン、オハド、ヤキン、ツォハル
  rationale: 各固有名をヘブライ語の発音に沿って日本語で音写し、列挙として自然に整えた。
- source_word: וְשָׁאוּל
  choice: それに…シャウル
  rationale: שָׁאוּלの子音と母音を反映して「シャウル」とした。接続詞וְは列挙の最後を示す自然な日本語にした。
- source_word: בֶּן הַכְּנַעֲנִית
  choice: カナン人の女の息子
  rationale: 定冠詞付き女性単数の民族形容詞がカナン人女性を指すことを明示し、בֶּןとの関係をそのまま保った。
