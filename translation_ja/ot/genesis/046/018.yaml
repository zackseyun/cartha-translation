  text: אֵ֚לֶּה בְּנֵ֣י זִלְפָּ֔ה אֲשֶׁר נָתַ֥ן לָבָ֖ן לְ/לֵאָ֣ה בִתּ֑/וֹ וַ/תֵּ֤לֶד אֶת אֵ֨לֶּה֙ לְ/יַעֲקֹ֔ב שֵׁ֥שׁ עֶשְׂרֵ֖ה נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/018.yaml
  text: 'These are the sons of Zilpah[a], whom Laban gave to Leah his daughter, and she bore these to Jacob: sixteen persons.'
translation:
  language: ja
  text: 以上は、ラバンが自分の娘レアに与えたジルパの子たちである。ジルパがヤコブに産んだこれらの者は、合わせて十六人[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「十六のネフェシュ」。ネフェシュはここでは、人を数えるために用いられている。
    reason: נֶפֶשׁの字義的な表現を示しつつ、ここでの人数を数える慣用的用法を明確にするため。
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי זִלְפָּה
  choice: 以上は、…ジルパの子たちである
  rationale: אֵלֶּהは直前の名簿を受けて「以上は」とし、בְּנֵיは系譜上の一群を指すものの、原文の親子表現を保って「子たち」とした。
- source_word: אֲשֶׁר נָתַן לָבָן לְלֵאָה בִתּוֹ
  choice: ラバンが自分の娘レアに与えた
  rationale: 関係節がジルパを修飾する構造を日本語で自然に保ち、בִתּוֹの所属を明確にするため「自分の娘」とした。
- source_word: וַתֵּלֶד אֶת אֵלֶּה לְיַעֲקֹב
  choice: 彼女がヤコブに産んだこれらの者
  rationale: 「彼女」はジルパを指す。系譜的に圧縮された原文の言い方を説明で解消せず、「ヤコブに産んだ」として保持した。
- source_word: שֵׁשׁ עֶשְׂרֵה נָפֶשׁ
  choice: 合わせて十六人
  rationale: נֶפֶשׁはここでは人数を数える慣用表現なので、現代日本語で誤解のない「人」とした。「合わせて」は名簿の集計であることを自然に示す。
