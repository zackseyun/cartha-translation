  yaml_path: translation/ot/genesis/046/006.yaml
  text: They took their livestock and their possessions that they had acquired in the land of Canaan[a], and they came to Egypt—Jacob and all his offspring with him.
translation:
  language: ja
  text: 彼らは家畜と、カナンの地で得た財産を携えてエジプトへ来た。すなわち、ヤコブと、彼と共にいたその子孫すべてである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: 携え
  rationale: לקחの「取る」を、移住の際に家畜と財産を一緒に運ぶ文脈に即して、自然な現代日本語で表した。
- source_word: מִקְנֵיהֶם
  choice: 家畜
  rationale: מִקְנֶהは所有する動物全般を指し得るため、「牛」や「群れ」より広い「家畜」とした。
- source_word: רְכוּשָׁם
  choice: 財産
  rationale: רְכוּשׁは取得した動産や所有物を指す。直前の「家畜」と区別しつつ簡潔に表せる「財産」を選んだ。
- source_word: אֲשֶׁר רָכְשׁוּ
  choice: 得た
  rationale: רכשの取得の意味を明確にし、日本語では時制関係が文脈から自然に分かるため簡潔に「得た」とした。
- source_word: בְּאֶרֶץ כְּנַעַן
  choice: カナンの地で
  rationale: אֶרֶץを訳出し、原文の具体的な地理表現を保持した。
- source_word: וַיָּבֹאוּ מִצְרָיְמָה
  choice: エジプトへやって来た
  rationale: 方向を示す語尾を「へ」で表し、בואの基本的な到来表現を「やって来た」とした。「入った」のように国境通過を過度に特定しない。
- source_word: יַעֲקֹב וְכָל זַרְעוֹ אִתּוֹ
  choice: ヤコブと、そのすべての子孫が彼と共に来た
  rationale: זֶרַעはここではヤコブから出た家族全体を指すため「子孫」とした。原文の同格的な後置を、日本語で明瞭な補足文として保った。
