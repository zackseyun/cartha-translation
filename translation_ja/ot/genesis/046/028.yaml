  yaml_path: translation/ot/genesis/046/028.yaml
  text: He sent Judah ahead of him to Joseph[a], to show the way before him to Goshen[c][b]; and they came into the land of Goshen.
translation:
  language: ja
  text: ヤコブはユダを自分より先にヨセフのもとへ遣わし、ゴシェンへの道を示すためにした[a]。こうして一行はゴシェンの地に入った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「彼に先立って、ゴシェンへ向けて指し示すために」。ヘブライ語の構文は簡略で、「ゴシェンへの道を案内するため」または「ゴシェンへ向かうことについて指示を与えるため」とも理解される。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלַח
  choice: 遣わし
  rationale: 人を特定の目的で先に送るという物語上の行為を、簡潔で品位ある現代日本語で表す。
- source_word: לְפָנָיו
  choice: 自分より先に
  rationale: 空間的な「前」だけでなく、ヤコブに先立って行かせたという時間的意味も自然に伝える。
- source_word: לְהוֹרֹת
  choice: 道を示させた
  rationale: ヒフィル形が持つ「教える、指し示す、導く」という意味範囲から、旅程の文脈に合う方向案内の意味を採った。ただし目的語や行為者が明示されない圧縮された構文なので、別解を脚注に残す。
- source_word: גֹּשְׁנָה
  choice: ゴシェンへの
  rationale: 地名に付く方向を示す語尾を、日本語では自然に「～への」と表した。
- source_word: וַיָּבֹאוּ
  choice: こうして一行は…入った
  rationale: 複数主語はヤコブに同行する一団を指すため「一行」と明示し、物語の帰結を「こうして」で滑らかにつないだ。
- source_word: אַרְצָה גֹּשֶׁן
  choice: ゴシェンの地に入った
  rationale: 方向を示す形と領域としての אֶרֶץ の意味を保ち、単なる到着よりもその地域内へ入った動きを表す。
- source_word: יְהוּדָה / יוֹסֵף / גֹּשֶׁן
  choice: ユダ／ヨセフ／ゴシェン
  rationale: 人名と地名は、日本語聖書で広く定着した表記に従った。
