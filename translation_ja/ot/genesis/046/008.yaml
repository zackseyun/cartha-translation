  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֵ֨לֶּה שְׁמ֧וֹת בְּנֵֽי יִשְׂרָאֵ֛ל הַ/בָּאִ֥ים מִצְרַ֖יְמָ/ה יַעֲקֹ֣ב וּ/בָנָ֑י/ו בְּכֹ֥ר יַעֲקֹ֖ב רְאוּבֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/008.yaml
  text: 'These are the names of the sons of Israel who came to Egypt: Jacob and his sons[b][a]. Jacob’s firstborn was Reuben.'
translation:
  language: ja
  text: エジプトに来たイスラエルの子ら、すなわちヤコブとその息子たちの名は、次のとおりである。ヤコブの長子はルベン。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 次のとおりである
  rationale: וְは系譜的な記述をつなぐ接続辞であり、日本語では不自然な「そしてこれらは」を避け、一覧を導入する「次のとおりである」にその談話機能を込めた。
- source_word: שְׁמוֹת
  choice: 名
  rationale: 複数形の「名」を、後続する人名一覧の導入として自然に訳した。
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: בְּנֵיの男性複数を保ち、ここでは個人名としてのイスラエルを維持した。「子孫」と一般化せず、原文の系譜的表現を残した。
- source_word: הַבָּאִים מִצְרַיְמָה
  choice: エジプトに来た
  rationale: 定冠詞付き分詞を、この回顧的な一覧導入に適した連体修飾の過去形で表した。方向を示す語尾は「に」で自然に反映した。
- source_word: יַעֲקֹב וּבָנָיו
  choice: すなわちヤコブとその息子たち
  rationale: 直前の句を言い換えて明確にする同格的な働きを、日本語で分かりやすい「すなわち」によって示した。
- source_word: בְּכֹר יַעֲקֹב
  choice: ヤコブの長子
  rationale: 構文上の所有関係と出生順位を、簡潔で格調のある日本語で表した。
- source_word: רְאוּבֵן
  choice: ルベン
  rationale: 日本語聖書で広く定着している人名表記を採用した。
theological_decisions:
- issue: 「イスラエル」と「ヤコブ」の関係、および「イスラエルの子ら」にヤコブを含むように見える同格表現
  choice: 原文どおり「イスラエルの子ら」を残し、「すなわちヤコブとその息子たち」と続けた
  alternative: 「イスラエルの一族」または「イスラエルの子孫」として論理関係を平滑化する
  rationale: イスラエルがヤコブの別名であることから生じる原文の表現上の緊張を、広義語に置き換えて解消せずに保持した。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いながら、系譜の導入にふさわしい簡潔で dignified な文体とした。「子ら」「長子」はやや格調を保ちつつ、現代日本語でも理解可能な語である。
