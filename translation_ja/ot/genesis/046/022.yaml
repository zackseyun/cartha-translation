  yaml_path: translation/ot/genesis/046/022.yaml
  text: 'These were the sons of Rachel who were born to Jacob: fourteen persons in all[a].'
translation:
  language: ja
  text: これらはラケルの子たちで、ヤコブに生まれた者たちである。全部で十四人[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「すべての人、十四」。合計人数が十四人であることを表す言い回し。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: これらは
  rationale: 系譜の直前の一覧を受ける指示表現として、ヘブライ語の形を保ちつつ自然な日本語にした。
- source_word: בְּנֵי רָחֵל
  choice: ラケルの子たち
  rationale: בְּנֵי は字義的には「息子たち」だが、直前の一覧には孫たちも含まれるため、系譜上の子孫のまとまりを自然に示す「子たち」とした。
- source_word: אֲשֶׁר יֻלַּד לְיַעֲקֹב
  choice: ヤコブに生まれた者たち
  rationale: 受動形 יֻלַּד と親子関係を示す לְ を反映し、古風な「もうけられた」を避けた。
- source_word: כָּל נֶפֶשׁ
  choice: 全部で…人
  rationale: נֶפֶשׁ はここでは人口を数える「人」を意味する。日本語の人数表現として自然な「全部で…人」とした。
- source_word: אַרְבָּעָה עָשָׂר
  choice: 十四
  rationale: 基数をそのまま訳した。
