  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּסַּ֤ע יִשְׂרָאֵל֙ וְ/כָל אֲשֶׁר ל֔/וֹ וַ/יָּבֹ֖א בְּאֵ֣רָ/ה שָּׁ֑בַע וַ/יִּזְבַּ֣ח זְבָחִ֔ים לֵ/אלֹהֵ֖י אָבִ֥י/ו יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/001.yaml
  text: So Israel set out with all that belonged to him and came to Beersheba[a], and he offered sacrifices to the God of his father Isaac.
translation:
  language: ja
  text: イスラエルは、自分に属するすべてのものと共に旅立ち、ベエル・シェバに着いた。そして、父イサクの神にいけにえをささげた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסַּע
  choice: 旅立ち
  rationale: נסעは旅の開始、特に宿営を離れて出発することを表す。現代日本語として自然な「旅立ち」でその意味を保った。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 本文が契約名「イスラエル」を用いているため、「ヤコブ」に調和させず、そのまま保持した。
- source_word: וְכָל אֲשֶׁר לוֹ
  choice: 自分に属するすべてのものと共に
  rationale: 人々と財産を含み得る広い表現なので、「全財産」など物品だけに限定せずに訳した。日本語では移動への同行を自然に示すため「と共に」とした。
- source_word: וַיָּבֹא
  choice: 着いた
  rationale: בואは目的地への到着を表す文脈にあり、日本語では「ベエル・シェバに着いた」が自然である。
- source_word: בְּאֵרָה שָּׁבַע
  choice: ベエル・シェバに
  rationale: 地名は日本語聖書で広く通用する音写を採用し、方向を示す語尾は助詞「に」で表した。
- source_word: וַיִּזְבַּח זְבָחִים
  choice: いけにえをささげた
  rationale: 同根の動詞と名詞によるヘブライ語表現を、重複を避けた自然で荘重な日本語にした。
- source_word: לֵאלֹהֵי
  choice: 神に
  rationale: 前置詞לは、ここではいけにえを受ける礼拝の対象を示すため、助詞「に」で表した。
- source_word: אָבִיו יִצְחָק
  choice: 父イサク
  rationale: イサクがイスラエルの父であることを簡潔かつ明確に示す日本語表現とした。
theological_decisions:
- issue: 神を「父イサクの神」と特定する族長的呼称
  choice: 父イサクの神
  alternative: 先祖たちの神／父の神、すなわちイサクの神
  rationale: ヘブライ語はイサクを単数で明示している。この限定を一般化も説明的拡張もせず、ベエル・シェバおよびイサクとの物語上の連続性を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、聖書本文にふさわしい簡潔で品位ある調子とした。「いけにえ」は一般読者に理解しやすい表記とし、原文にない限定や解釈は加えていない。英語版の脚注はマーカー位置と内容が対応していないうえ、日本語本文の「自分に属するすべてのもの」がすでに語義の広さを保つため、脚注は設けなかった。
