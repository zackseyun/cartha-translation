  to: そうしたら、あなたがたは、『あなたのしもべたちは、私たちも父祖も、若いころから今に至るまで家畜を飼う者でございます』と言いなさい。そうすれば、あなたがたはゴシェンの地に住むことができる。羊飼いは皆、エジプト人にとって忌むべきものだからです。
