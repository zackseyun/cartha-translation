  text: וַ/אֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֨י/ךָ֙ מִ/נְּעוּרֵ֣י/נוּ וְ/עַד עַ֔תָּה גַּם אֲנַ֖חְנוּ גַּם אֲבֹתֵ֑י/נוּ בַּ/עֲב֗וּר תֵּשְׁבוּ֙ בְּ/אֶ֣רֶץ גֹּ֔שֶׁן כִּֽי תוֹעֲבַ֥ת מִצְרַ֖יִם כָּל רֹ֥עֵה צֹֽאן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/034.yaml
  text: then you shall say[a], ‘Your servants have been men of livestock from our youth until now, both we and our fathers,’ so that you may live in the land of Goshen[b], for every shepherd is detestable to the Egyptians.
translation:
  language: ja
  text: そうしたら、あなたがたは、『あなたのしもべたちは、私たちも父祖も、若いころから今に至るまで家畜を飼う者でございます』と言いなさい。そうすれば、あなたがたはゴシェンの地に住むことができる。羊飼いは皆、エジプト人にとって忌むべきものだからです。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: そうしたら、あなたがたは…と言いなさい
  rationale: 先行する指示を受ける連続的な意味と、ファラオへの返答についての命令の力を、自然な現代日本語で表した。
- source_word: אַנְשֵׁי מִקְנֶה
  choice: 家畜を飼う者
  rationale: מִקְנֶה は所有・飼育される家畜を広く指すため、牛など一種類に限定せず、生業として家畜を扱う意味を明確にした。
- source_word: עֲבָדֶיךָ
  choice: しもべども
  rationale: ここでは奴隷身分の主張ではなく、ファラオに対するへりくだった自称であるため、宮廷的な敬意を保つ表現とした。
- source_word: מִנְּעוּרֵינוּ וְעַד עַתָּה
  choice: 若いころから今に至るまで
  rationale: 幼少・青年期以来の継続を示す時間表現を、明瞭で格調を失わない日本語にした。
- source_word: גַּם אֲנַחְנוּ גַּם אֲבֹתֵינוּ
  choice: 私たちも父祖たちも
  rationale: 反復される גַּם による両者の並列と、世代を越えた生業の継続を保持した。
- source_word: בַּעֲבוּר תֵּשְׁבוּ
  choice: そうすれば、あなたがたは…住むことができる
  rationale: 発言の目的と期待される結果を表す文脈に即し、日本語では結果を示す形で自然に表現した。
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: ゴシェンの地に
  rationale: 原文の אֶרֶץ を省かず、地名とともに保持した。
- source_word: תוֹעֲבַת מִצְרַיִם
  choice: エジプト人にとって忌むべきもの
  rationale: 宗教的・社会的に強く嫌悪されるものを表す תוֹעֵבָה の強い否定的含意を保ちつつ、構文上の「エジプト」を人々として自然に表した。
- source_word: כָּל רֹעֵה צֹאן
  choice: 羊飼いは皆
  rationale: צֹאן は羊・山羊を含む小家畜の群れを指し得るが、日本語の「羊飼い」は職能名として自然で、文脈上の意味を簡潔に伝える。
