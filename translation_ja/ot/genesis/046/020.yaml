  text: וַ/יִּוָּלֵ֣ד לְ/יוֹסֵף֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ אֲשֶׁ֤ר יָֽלְדָה לּ/וֹ֙ אָֽסְנַ֔ת בַּת פּ֥וֹטִי פֶ֖רַע כֹּהֵ֣ן אֹ֑ן אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/046/020.yaml
  text: To Joseph were born in the land of Egypt Manasseh and Ephraim[a], whom Asenath daughter of Potiphera, priest of On[b], bore to him.
translation:
  language: ja
  text: ヨセフには、エジプトの地でマナセとエフライムが生まれた。この二人をヨセフに産んだのは、オン[a]の祭司ポティ・フェラの娘アセナトである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: オンは、後にギリシア語でヘリオポリスと呼ばれたエジプトの町。
    reason: 古代地名を現代の読者に説明するため。
lexical_decisions:
- source_word: וַיִּוָּלֵד לְיוֹסֵף
  choice: ヨセフには……生まれた
  rationale: ילדのニファル形が表す受動的な誕生と、לְが示すヨセフとの関係を、自然な日本語で表した。動詞は形態上単数だが、後続する二人の息子を主語として理解する。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地で
  rationale: אֶרֶץを「地」として明示し、原文のやや改まった地理表現を保った。
- source_word: אֲשֶׁר יָלְדָה לּוֹ
  choice: この二人を産んだのは
  rationale: 関係節がマナセとエフライムの二人を受けることを明確にしつつ、母アセナトの出産行為を保った。「彼のために」は日本語では不自然で、父子関係は前文の「ヨセフには」で十分に示される。
- source_word: אָסְנַת
  choice: アセナト
  rationale: ヘブライ語名の一般的な日本語音写を用いた。
- source_word: בַּת פּוֹטִי פֶרַע
  choice: ポティ・フェラの娘
  rationale: 連語の父娘関係をそのまま明示し、人名は音写した。
- source_word: כֹּהֵן אֹן
  choice: オンの祭司
  rationale: כֹּהֵןを「祭司」とし、地名אֹןは本文で音写した。後代のギリシア名は注に示す。
- source_word: אֶת מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: マナセとエフライム
  rationale: 目的語標識は訳出せず、二人の名を一般的な日本語表記で音写した。
theological_decisions: []
