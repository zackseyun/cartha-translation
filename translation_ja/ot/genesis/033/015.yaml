  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו אַצִּֽיגָה נָּ֣א עִמְּ/ךָ֔ מִן הָ/עָ֖ם אֲשֶׁ֣ר אִתִּ֑/י וַ/יֹּ֨אמֶר֙ לָ֣/מָּה זֶּ֔ה אֶמְצָא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/015.yaml
  text: Then Esau said, “Please let me leave with you some of the people who are with me.” But he said, “Why is this? Let me find favor in the eyes of my lord.”
translation:
  language: ja
  text: するとエサウは言った。「では、私と一緒にいる者たちの中から何人かを、あなたのもとに残しておきましょう。」彼は言った。「どうしてそのようなことをなさるのですか。私の主人のお目にかなえばよいのです。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַצִּיגָה נָּא
  choice: では、…残しておこう
  rationale: 使役形の「置く、配置する」に意志・申し出を表す形と丁寧な小辞が伴うため、エサウの申し出として自然に表現した。
- source_word: מִן הָעָם אֲשֶׁר אִתִּי
  choice: 私と一緒にいる者たちのうち何人かを
  rationale: מן は集団からの一部を示す。עם はここでは軍勢・随行員を指すため、一般読者に明瞭な「者たち」とした。
- source_word: לָמָּה זֶּה
  choice: どうしてそのようなことをなさるのですか
  rationale: 直訳的には「何のためにこれを」だが、申し出を辞退する文脈で自然な問いとして訳した。相手への敬意も反映した。
- source_word: אֶמְצָא חֵן בְּעֵינֵי אֲדֹנִי
  choice: ご主人様のご厚意をいただければ、それで十分です
  rationale: 字義は「私の主人の目に恵みを見いだせますように」。慣用句として相手の好意・厚意を得ることを表す。文脈上の丁重な辞退を日本語で明確にしたが、「それで十分です」は含意の補足である。
theological_decisions:
- issue: אֲדֹנִי の指示対象と敬称
  choice: ご主人様
  alternative: わが主／旦那様
  rationale: 神名ではなくヤコブが兄エサウに用いる敬称である。上下関係を強く示す一方、現代日本語で理解可能な敬称とした。
- issue: 「恵みを見いだす」という表現の性格
  choice: ご厚意をいただく
  alternative: お目にかなう／好意を得る
  rationale: ここでは救済論的な「恵み」に限定せず、人間同士の好意を求める慣用表現として訳した。
translation_notes:
  register: 現代標準日本語による、丁重で品位ある会話文。エサウの申し出とヤコブの婉曲な辞退が自然に伝わるよう敬語を用いた。
