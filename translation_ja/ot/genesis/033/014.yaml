base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/014.yaml
  text: Please let my lord pass on ahead of his servant[a], and I will proceed slowly, at the pace of the livestock that is before me and at the pace of the children[c][b], until I come to my lord at Seir.
translation:
  language: ja
  text: どうか、わが主人はこの僕より先にお進みください。私は、前にいる家畜と子どもたちの歩みに合わせて、セイルでわが主人のもとに着くまで、ゆっくり進んでまいります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「セイルにいるわが主人のもとに着くまで」。ヘブライ語では、「セイル」が到着先を示すとも、主人がセイルにいることを示すとも取れます。
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲבָר נָא
  choice: どうか……先にお進みください
  rationale: 動詞の指示・願望的用法と依頼を和らげる נָא を、敬意ある自然な依頼として表した。
- source_word: אֲדֹנִי
  choice: わが主人
  rationale: ヤコブがエサウに示すへりくだった呼びかけを保ち、神への称号とは解さない。
- source_word: לִפְנֵי עַבְדּוֹ
  choice: この僕より先に
  rationale: 「彼の僕の前を」という方向的意味と、三人称による丁重な自己言及を、日本語で明瞭にした。
- source_word: אֶתְנָהֲלָה לְאִטִּי
  choice: ゆっくり進んでまいります
  rationale: 慎重に、穏やかな歩調で移動する再帰的なニュアンスを、過度に「率いる」と限定せず表現した。
- source_word: לְרֶגֶל
  choice: 歩みに合わせて
  rationale: 直訳的には「足に従って」であり、家畜と子どもの進む速さに合わせるという慣用的意味を自然に表した。
- source_word: הַמְּלָאכָה
  choice: 家畜
  rationale: 通常は「仕事・財産」を意味し得るが、この牧畜と旅の文脈では、前を進む動物の群れを指すと判断した。
- source_word: הַיְלָדִים
  choice: 子どもたち
  rationale: 同行するヤコブの子どもたちを指す一般的で明瞭な訳語とした。
- source_word: עַד אֲשֶׁר אָבֹא אֶל אֲדֹנִי שֵׂעִירָה
  choice: そして、セイルにいるわが主人のもとへ参ります
  rationale: עַד אֲשֶׁר の到達点を日本語では文を分けて自然に示した。地名の方向接尾辞を踏まえ、目的地がセイルであることを表した。
