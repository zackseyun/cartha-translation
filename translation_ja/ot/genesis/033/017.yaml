  text: וְ/יַעֲקֹב֙ נָסַ֣ע סֻכֹּ֔תָ/ה וַ/יִּ֥בֶן ל֖/וֹ בָּ֑יִת וּ/לְ/מִקְנֵ֨/הוּ֙ עָשָׂ֣ה סֻכֹּ֔ת עַל כֵּ֛ן קָרָ֥א שֵׁם הַ/מָּק֖וֹם סֻכּֽוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/017.yaml
  text: And Jacob traveled to Succoth[a], and he built a house for himself and made shelters for his livestock. Therefore he called the name of the place Succoth.
translation:
  language: ja
  text: ヤコブはスコテ[a]へ行き、そこに自分のための家を建て、家畜のためには仮小屋を造った。そのため、その場所の名をスコテと呼んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「スコテ」は、ヘブライ語で「仮小屋」を意味する語に由来する。
    reason: 地名スコテと、直前の「仮小屋」（סֻכּוֹת）との語の結び付きを示すため。
lexical_decisions:
- source_word: נָסַע
  choice: 移った
  rationale: 宿営を畳んで次の場所へ進むことを表す動詞。ここでは目的地への移動を自然な現代日本語で示す。
- source_word: סֻכֹּתָה
  choice: スコトへ
  rationale: 方向を示す語尾を「へ」で表し、地名は慣用的な音写とした。
- source_word: וַיִּבֶן לוֹ בָּיִת
  choice: そこに自分のための家を建て
  rationale: לוֹ の受益・用途を明示しつつ、日本語として自然になるよう「自分のための家」とした。「そこに」は文脈上の建設地を補って自然な流れを作る。
- source_word: מִקְנֵהוּ
  choice: 家畜
  rationale: 所有する群れや飼育動物を指すため、牛だけに限定しない「家畜」が適切。
- source_word: עָשָׂה סֻכֹּת
  choice: 仮小屋を造った
  rationale: סֻכּוֹת は簡素な覆いや小屋を指す。家畜用であることと地名との語呂合わせが伝わるよう「仮小屋」とした。
- source_word: עַל כֵּן
  choice: そのため
  rationale: 地名の由来を導く因果表現を、明快な現代日本語で表した。
- source_word: קָרָא שֵׁם הַמָּקוֹם
  choice: その場所の名を…と呼んだ
  rationale: ヘブライ語の命名定型句の形をある程度保ち、「名づけた」より原文の表現に近づけた。
- source_word: סֻכּוֹת
  choice: スコト
  rationale: 地名として音写し、普通名詞「仮小屋」との語呂合わせは脚注で説明する。
