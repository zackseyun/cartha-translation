  verdict: revise
  source_fidelity: 「弟よ」は、エサウが年上でヤコブが弟であることを適切に反映している。「私にはたくさんある」も יֶשׁ לִי רָב の豊かさ・多さをよく表す。末尾の現行訳は意味をおおむね伝えるが、「あなたのものにしておきなさい」は、聞き手に何かを『あなたのものにする』よう求める意味にも読め、すでにヤコブの所有物である אֲשֶׁר לְךָ との関係がやや不明瞭である。
  naturalness: 「あなたのものは、あなたのものとしておきなさい」は、所有物を手元に置くよう促すエサウの辞退を、現代標準日本語として明瞭に表す。
