  text: וַ/יֹּ֥אמֶר עֵשָׂ֖ו יֶשׁ לִ֣/י רָ֑ב אָחִ֕/י יְהִ֥י לְ/ךָ֖ אֲשֶׁר לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/009.yaml
  text: But Esau said[a], “I have plenty, my brother; let what is yours be yours.”
translation:
  language: ja
  text: しかし、エサウは言った[a]。「弟よ、私にはたくさんある。あなたのものは、あなたのものとしておきなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または、「すると、エサウは言った」。
    reason: 接続詞 וַ の文脈的な訳し分け。「しかし」は辞退の対比を示すが、単に物語の進行を表すとも取れる。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: しかし、…は言った
  rationale: 接続詞は物語を進めるが、ここではヤコブの贈り物を辞退する返答なので、穏やかな対比を示す「しかし」が文脈に合う。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 日本語聖書で一般的な人名表記を用いた。
- source_word: יֶשׁ לִי רָב
  choice: 私にはたくさんある
  rationale: 所有を表す慣用句と、量の多さを示す רָב を自然な現代日本語で表した。「十分ある」も可能だが、原語は充足より豊富さを直接表す。
- source_word: אָחִי
  choice: 弟よ
  rationale: 直訳は「私の兄弟よ」だが、エサウからヤコブへの呼びかけとして自然で関係性も明確な「弟よ」とした。
- source_word: יְהִי לְךָ
  choice: あなたのものにしておきなさい
  rationale: יהיה の指示・許容的な用法を、贈り物を辞退してヤコブに保持させる文脈に即して自然に表した。
- source_word: אֲשֶׁר לָךְ
  choice: あなたのもの
  rationale: 「あなたに属するもの」という関係節を簡潔な現代日本語で表した。語尾の綴り上の形にかかわらず、文脈上ヤコブを指す二人称男性単数として読んだ。
