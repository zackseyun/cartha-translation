  text: וַ/יִּ֜קֶן אֶת חֶלְקַ֣ת הַ/שָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה שָׁם֙ אָהֳל֔/וֹ מִ/יַּ֥ד בְּנֵֽי חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּ/מֵאָ֖ה קְשִׂיטָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/019.yaml
  text: And he bought the portion of the field where he had pitched his tent[a], from the hand of the sons of Hamor, the father of Shechem, for a hundred qesitahs.
translation:
  language: ja
  text: 彼は、自分が天幕を張った場所の畑の一区画を、シェケムの父ハモルの子らから、百ケシタ[a]で買い取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ケシタ」は古代の支払いの単位、または支払いに用いた品を指すと考えられるが、その正確な価値は不明。
    reason: 原語 קְשִׂיטָה の意味と価値が確定できず、現代の貨幣単位に換算すると不正確になるため。
lexical_decisions:
- source_word: וַיִּקֶן
  choice: 買い取った
  rationale: 土地を代価を払って取得する文脈なので、「買う」の意味を明確にしつつ、取引による取得を自然な日本語で表した。
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: 畑の一区画
  rationale: חֶלְקָה は区切られた部分・区画を指す。「畑の一区画」は原文の構造と土地の一部分という意味を自然に保つ。
- source_word: אֲשֶׁר נָטָה שָׁם אָהֳלוֹ
  choice: 自分が天幕を張った場所
  rationale: נטה と אֹהֶל の慣用的な組み合わせを「天幕を張る」と訳した。日本語では関係節を場所として表すと明瞭である。
- source_word: מִיַּד
  choice: から
  rationale: 直訳は「手から」だが、この売買文脈では所有者・譲渡者を示すため、現代日本語として自然な「から」とした。
- source_word: בְּנֵי חֲמוֹר
  choice: ハモルの子ら
  rationale: 複数形を保ち、ヘブライ語の連語を簡潔に再現した。
- source_word: אֲבִי שְׁכֶם
  choice: シェケムの父
  rationale: 同格表現としてハモルをシェケムの父と特定する原文をそのまま保った。
- source_word: בְּמֵאָה קְשִׂיטָה
  choice: 百ケシタで
  rationale: קְשִׂיטָה の正確な価値や形態は不明なため、特定の貨幣や銀の重量に置き換えず音写した。「で」は購入価格を自然に示す。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「天幕」は聖書の古代的背景に適しつつ一般読者にも理解可能。「買い取った」により土地取引であることを自然に示した。脚注記号は、その説明対象である「ケシタ」の直後に置いた。
