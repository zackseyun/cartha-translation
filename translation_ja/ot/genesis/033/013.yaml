  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֲדֹנִ֤/י יֹדֵ֨עַ֙ כִּֽי הַ/יְלָדִ֣ים רַכִּ֔ים וְ/הַ/צֹּ֥אן וְ/הַ/בָּקָ֖ר עָל֣וֹת עָלָ֑/י וּ/דְפָקוּ/ם֙ י֣וֹם אֶחָ֔ד וָ/מֵ֖תוּ כָּל הַ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/013.yaml
  text: But he said to him[a], “My lord knows that the children are frail, and the flocks and herds nursing their young are under my care. If they are driven hard for one day, all the flock will die.”
translation:
  language: ja
  text: しかしヤコブはエサウに言った。「主人もご存じのように、子どもたちはか弱く、乳を飲ませている羊や牛の世話も私にかかっています[a]。もし一日でもこれらを無理に追い立てれば、羊の群れはみな死んでしまいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: このヘブライ語の表現は、乳を飲ませている家畜であることと、その世話の責任がヤコブにかかっていることの両方を含む慣用的な言い方です。別訳「乳飲み子のいる羊や牛は、私が責任を負っています」。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי
  choice: ご主人様
  rationale: エサウに対する敬意と社会的な上下関係を示す人間への呼称であり、神への称号ではない。現代日本語で丁重さを自然に表す。
- source_word: הַיְלָדִים רַכִּים
  choice: 子どもたちはか弱く
  rationale: רַכִּים は柔らかさ、幼さ、傷つきやすさを表す。旅に耐える体力が十分でないことを、過度に誇張せず明確に伝える。
- source_word: הַצֹּאן וְהַבָּקָר
  choice: 羊や牛
  rationale: 小家畜の群れと牛を指す対句を、一般読者に分かりやすい具体的な家畜名で表した。
- source_word: עָלוֹת עָלָי
  choice: 乳を飲ませている羊や牛の世話も私にかかっています
  rationale: עָלוֹת は乳を与えている雌の家畜を指すと考えられ、עָלָי はその世話の責任がヤコブにかかっていることを表す。二つの意味を自然な日本語で併せて示した。
- source_word: וּדְפָקוּם יוֹם אֶחָד
  choice: もし一日でも無理に追い立てれば
  rationale: דפק はここでは家畜を過度に厳しく追い立てる意味。主語が特定されないヘブライ語を、日本語の自然な条件表現で再現した。
- source_word: וָמֵתוּ כָּל־הַצֹּאן
  choice: 羊の群れはみな死んでしまいます
  rationale: 集合名詞 הַצֹּאן を羊の群れとして明示し、過酷な移動が招く深刻な結果を自然に表した。
