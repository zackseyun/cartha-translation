  to: しかしヤコブはエサウに言った。「主人もご存じのように、子どもたちはか弱く、乳を飲ませている羊や牛の世話も私にかかっています[a]。もし一日でもこれらを無理に追い立てれば、羊の群れはみな死んでしまいます。」
