lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: 置いた
  rationale: שׂוּםの基本義「置く、配置する」を保ちつつ、人々を順に並べた場面として自然に理解できる表現。
- source_word: הַשְּׁפָחוֹת
  choice: 女召使いたち
  rationale: שִׁפְחָהは身分の低い女性使用人ないし女性奴隷を指し得る。「女召使い」を本文に採用し、隷属的身分の含意は脚注で明示した。
- source_word: יַלְדֵיהֶן
  choice: その子どもたち
  rationale: יֶלֶדはここで性別を限定せず子どもを表すため、「息子たち」ではなく「子どもたち」とした。
- source_word: רִאשֹׁנָה
  choice: 先頭に
  rationale: 三つの集団の空間的な配列を示す副詞的用法であり、日本語では「先頭に」が明確。
- source_word: לֵאָה
  choice: レア
  rationale: 日本語聖書で広く定着した人名表記。
- source_word: וִילָדֶיהָ
  choice: とその子どもたち
  rationale: 接続詞と所有関係を自然な日本語で示し、יֶלֶדの包括的な意味を保持した。
- source_word: אַחֲרֹנִים（中間の集団）
  choice: その後ろに
  rationale: 最初の集団より後方で、最後の集団より前という位置を表すため、「最後に」とはせず空間的な「その後ろに」とした。
- source_word: רָחֵל
  choice: ラケル
  rationale: 日本語聖書で広く定着した人名表記。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着した人名表記。
- source_word: אַחֲרֹנִים（最後の集団）
  choice: 最後に
  rationale: 三集団のうち最終位置に置かれたことを簡潔に表す。
