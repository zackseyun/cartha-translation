  yaml_path: translation/ot/genesis/033/012.yaml
  text: Then he said[a], “Let us set out and go, and I will go before you.”
translation:
  language: ja
  text: すると彼は言った。「さあ、出発して進もう。私はあなたの前を行こう[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「私はあなたのそばを（並んで）行こう」。
    reason: לְנֶגְדֶּךָ はこの文脈で「あなたの前に」と理解できる一方、「あなたと向かい合う位置に／対応して」という語義から、同行・並行のニュアンスとして理解する余地もあるため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると彼は言った
  rationale: 接続法ワウによる物語の進行を、現代日本語で自然な「すると」によって表した。話者の名はこの節のヘブライ語本文に明示されていないため補わず、「彼」とした。
- source_word: נִסְעָה
  choice: さあ、出発して
  rationale: נסע の一人称複数コホルタティブで、旅立ちを提案・促す表現。「さあ」を添えて勧誘の力を示し、「出発して」で移動の開始を明確にした。
- source_word: וְנֵלֵכָה
  choice: 進もう
  rationale: הלך の一人称複数コホルタティブ。直前の「出発して」と自然につながる移動の継続として、「行こう」より文脈に適した「進もう」とした。
- source_word: וְאֵלְכָה
  choice: 私は……行こう
  rationale: 一人称単数形で、話者自身が行く意志・申し出を表す。日本語では主語を明示して、先の複数形との対照を保った。
- source_word: לְנֶגְדֶּךָ
  choice: あなたの前を
  rationale: נגד は「向かいに」「前に」「対応して」などの幅を持つ。この旅の文脈では、相手の前方を進むという理解を本文に採用し、同行を意味する可能性は脚注に残した。
