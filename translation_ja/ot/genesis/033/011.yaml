  text: קַח נָ֤א אֶת בִּרְכָתִ/י֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔/ךְ כִּֽי חַנַּ֥/נִי אֱלֹהִ֖ים וְ/כִ֣י יֶשׁ לִ/י כֹ֑ל וַ/יִּפְצַר בּ֖/וֹ וַ/יִּקָּֽח־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/011.yaml
  text: Please take my gift that has been brought to you, because God has dealt graciously with me, and because I have everything. And he urged him, and he took it.
translation:
  language: ja
  text: 「どうか、あなたに届けられた私の贈り物を受け取ってください。神が私を恵んでくださり、私には何もかもあるからです。」ヤコブが強く勧めたので、エサウは受け取った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּרְכָתִי
  choice: 私の贈り物
  rationale: 直訳は「私の祝福」だが、ここでは相手に差し出す品々を指す。現代日本語で意味が自然に伝わるよう「贈り物」とした。
- source_word: חַנַּנִי
  choice: 私を恵んでくださり
  rationale: 神が恵み深く扱い、好意を施したことを表す完了形。文脈に即して敬語を用いた。
- source_word: יֶשׁ לִי כֹל
  choice: 私には何もかもある
  rationale: כֹל の包括的な響きを保ち、「十分ある」と狭く言い換えずに訳した。
- source_word: וַיִּפְצַר בּוֹ
  choice: ヤコブが強く勧めたので
  rationale: 主語と目的語を固有名で補い、執拗に促す語感を「強く勧めた」で表した。
- source_word: וַיִּקָּח
  choice: エサウは受け取った
  rationale: 文脈上の主語を明示し、贈り物を受領した意味に訳した。
theological_decisions:
- issue: בִּרְכָתִי の訳語
  choice: 贈り物
  alternative: 祝福
  rationale: 「祝福」という語には神学的・物語的な含意もあり得るが、この発話内ではヤコブがエサウに届けた家畜の贈答品を指す。本文の即時的意味を明瞭にした。
- issue: 「すべてを持つ」という表現の強さ
  choice: 私には何もかもある
  alternative: 私には十分あります
  rationale: ヤコブの発言にある כֹל の強い包括表現を保持し、充足という解釈だけに限定しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語。依頼の丁寧さと神への敬意を保ちつつ、後半は登場人物を明示して自然な物語文とした。
