  to: ヤコブが目を上げて見ると[a]、見よ[b]、エサウが四百人の男たちを伴って近づいて来ていた。そこでヤコブは、子どもたちをレア、ラケル、二人の女奴隷[c]のもとにそれぞれ分けた。
