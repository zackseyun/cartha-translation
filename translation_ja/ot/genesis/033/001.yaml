  text: וַ/יִּשָּׂ֨א יַעֲקֹ֜ב עֵינָ֗י/ו וַ/יַּרְא֙ וְ/הִנֵּ֣ה עֵשָׂ֣ו בָּ֔א וְ/עִמּ֕/וֹ אַרְבַּ֥ע מֵא֖וֹת אִ֑ישׁ וַ/יַּ֣חַץ אֶת הַ/יְלָדִ֗ים עַל לֵאָה֙ וְ/עַל רָחֵ֔ל וְ/עַ֖ל שְׁתֵּ֥י הַ/שְּׁפָחֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/001.yaml
  text: Then Jacob lifted up his eyes and looked[a], and behold, Esau was coming, and with him were four hundred men. So he divided the children among Leah, Rachel[c][b], and the two female servants.
translation:
  language: ja
  text: ヤコブが目を上げて見ると[a]、見よ[b]、エサウが四百人の男たちを伴って近づいて来ていた。そこでヤコブは、子どもたちをレア、ラケル、二人の女奴隷[c]のもとにそれぞれ分けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「見上げると」とも訳せる。ヘブライ語では直訳すると「目を上げて見た」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語の提示表現で、読者の注意をエサウが近づく場面へ向ける。
    reason: discourse_feature
  - marker: c
    text: 「二人の女召使い」とも訳せる。原語は、家に仕える従属的身分の女性、すなわち女奴隷を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... עֵינָיו וַיַּרְא
  choice: 目を上げて見ると
  rationale: 「目を上げる」と「見る」の二つの動作を保ちつつ、後続する光景を自然に導く現代日本語とした。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 目前の光景へ注意を引き、驚きや緊迫感を添える提示表現の働きを自然な日本語で表した。
- source_word: בָּא
  choice: 近づいて来ていた
  rationale: 分詞が示す進行中の接近を表し、単に「来た」と完了的に訳すことを避けた。
- source_word: וְעִמּוֹ אַרְבַּע מֵאוֹת אִישׁ
  choice: 四百人の男たちを伴って
  rationale: エサウに大勢の男が同行していることを、簡潔で自然な日本語にした。
- source_word: וַיַּחַץ
  choice: それぞれ分けた
  rationale: 子どもたちを複数の母親のもとへ分けて配置した行為を文脈に即して明確にした。
- source_word: הַיְלָדִים
  choice: 子どもたち
  rationale: ヤコブの家族の子どもたちを指す、明瞭で一般的な訳語を用いた。
- source_word: עַל לֵאָה וְעַל רָחֵל וְעַל שְׁתֵּי הַשְּׁפָחוֹת
  choice: レア、ラケル、二人の女召使いのもとに
  rationale: 反復される עַל がここでは子どもたちを各女性に対応させて配置することを示すため、「のもとに」と訳した。שְׁפָחוֹת は従属的身分の女性を指すが、本文では読みやすい「女召使い」とし、別訳を注記した。
