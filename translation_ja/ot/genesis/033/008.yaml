  text: וַ/יֹּ֕אמֶר מִ֥י לְ/ךָ֛ כָּל הַ/מַּחֲנֶ֥ה הַ/זֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַ/יֹּ֕אמֶר לִ/מְצֹא חֵ֖ן בְּ/עֵינֵ֥י אֲדֹנִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/008.yaml
  text: And he said[a], “What do you mean by all this camp that I met?” And he said[c][b], “To find favor in the eyes of my lord.”
translation:
  language: ja
  text: エサウは言った。「私が出会ったこの一団は、いったい何のためなのか。」[a] ヤコブは答えた。「ご主人様のご好意を得るためです。」[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「一団」に当たるヘブライ語は、通常「陣営」や「宿営」を意味しますが、ここではヤコブが先に送った家畜と僕たちの一団を指します。問いは直訳すると「私が出会ったこのすべての陣営は、あなたにとって何なのか」となります。
    reason: lexical_alternative
  - marker: b
    text: 「ご好意を得る」は、直訳すると「私の主の目に恵みを見いだす」で、相手に好意的に受け入れてもらうことを表すヘブライ語の慣用表現です。
    reason: cultural_note
lexical_decisions:
- source_word: מִי לְךָ
  choice: いったい何のためなのか
  rationale: 直訳的には「あなたにとって何か」だが、文脈ではエサウが一行を先に送った目的を尋ねている。現代日本語でその語用を自然に表した。
- source_word: כָּל הַמַּחֲנֶה הַזֶּה
  choice: あの一行
  rationale: מַחֲנֶה は通常「陣営、宿営」を意味するが、ここではエサウが途中で出会った、贈り物の家畜と僕たちから成る一団を指す。「一行」は集団としての意味を簡潔に伝える。
- source_word: אֲשֶׁר פָּגָשְׁתִּי
  choice: 私が出会った
  rationale: פָּגַשׁ の基本義「会う、出会う」をそのまま自然な日本語で表した。
- source_word: לִמְצֹא חֵן בְּעֵינֵי
  choice: ご好意を得るため
  rationale: 直訳は「目に恵みを見いだす」で、相手から好意的に受け入れられることを表す定型表現。目的を示す不定詞も「ため」で明示した。
- source_word: אֲדֹנִי
  choice: ご主人様
  rationale: 神への称号ではなく、ヤコブがエサウに用いるへりくだった呼称。単なる「あなた」よりも原文の敬意と社会的な上下関係を保つ。
