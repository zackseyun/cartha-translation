  text: וַ/יָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּ/אֶ֣רֶץ כְּנַ֔עַן בְּ/בֹא֖/וֹ מִ/פַּדַּ֣ן אֲרָ֑ם וַ/יִּ֖חַן אֶת פְּנֵ֥י הָ/עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/018.yaml
  text: Jacob came safely to the city of Shechem[a], which is in the land of Canaan, when he came from Paddan-aram[b], and he camped before the city.
translation:
  language: ja
  text: ヤコブは、パダン・アラムから来て、カナンの地にあるシェケムの町に無事に[a]着き、町の前に宿営した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「シェケムの町シャレムに着き」。ヘブライ語の「シャレム」は、「無事に、安らかに」とも、地名「シャレム」とも読むことができる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא יַעֲקֹב שָׁלֵם
  choice: ヤコブは……無事に……着き
  rationale: בוא は到着を表し、שָׁלֵם はここでは副詞的に「無事に、安らかに」の意味に取るのが文脈上自然である。日本語では「無事に着く」と簡潔に表現した。
- source_word: עִיר שְׁכֶם
  choice: シェケムの町
  rationale: 「町」と固有名シェケムの連語を、自然な現代日本語で表した。
- source_word: אֲשֶׁר בְּאֶרֶץ כְּנַעַן
  choice: カナンの地にある
  rationale: シェケムの所在地を示す関係節を、修飾節として自然に訳した。
- source_word: בְּבֹאוֹ מִפַּדַּן אֲרָם
  choice: パダン・アラムから帰って来たとき
  rationale: 前置詞 בְּ と不定詞連語の時間的意味を「……とき」とした。単なる移動より、ヤコブのカナン帰還という文脈を明確にするため「帰って来た」とした。
- source_word: פַּדַּן אֲרָם
  choice: パダン・アラム
  rationale: 地名を標準的な日本語音写で表した。
- source_word: וַיִּחַן
  choice: 宿営した
  rationale: חן のこの箇所での意味は「野営する、宿営する」。物語文にふさわしい簡潔で dignified な語を選んだ。
- source_word: אֶת־פְּנֵי הָעִיר
  choice: 町の前に
  rationale: 直訳的には「町の面前」であり、町の正面または町に面した場所を指すため、「町の前に」とした。
theological_decisions:
- issue: שָׁלֵם の統語と意味
  choice: 副詞的に「無事に」と読む
  alternative: 地名として「サレムに」と読む
  rationale: 文脈と一般的な語義からは、ヤコブが無事に到着したとの理解が自然である。ただし、子音本文は地名「サレム」とも解し得るため、脚注で真正な曖昧さを保持した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、聖書物語としての品位を保った。「無事に」と「サレム」の曖昧さは本文と脚注で保持した。
