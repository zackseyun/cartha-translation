  yaml_path: translation/ot/genesis/033/003.yaml
  text: And he himself went on ahead of them and bowed down to the ground seven times[a], until he came near to his brother.
translation:
  language: ja
  text: ヤコブ自身は彼らの前を進み、兄に近づくまで、七度、地にひれ伏した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「身をかがめて礼をした」。ヘブライ語は、地に身を伏せて敬意や服従を示す動作を表すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: ヤコブ自身は
  rationale: 独立代名詞による強調を「自身」で示す。日本語では指示対象を明確にするため、文脈上の主語ヤコブを補った。
- source_word: עָבַר לִפְנֵיהֶם
  choice: 皆の先に進み
  rationale: 単に前を横切るのではなく、家族の前に出て先頭に立つ文脈上の意味を自然な日本語で表した。
- source_word: וַיִּשְׁתַּחוּ אַרְצָה
  choice: 地にひれ伏した
  rationale: 動詞と方向を示す語を合わせ、地面に身を低くする服従・敬意の身体動作を表す。礼拝という意味には限定しない。
- source_word: שֶׁבַע פְּעָמִים
  choice: 七度
  rationale: 回数を簡潔かつ格調を保って直訳した。
- source_word: עַד גִּשְׁתּוֹ עַד אָחִיו
  choice: 兄のそばまで近づく間に
  rationale: 接近するまで繰り返しひれ伏したという限界・進行関係を表す。二つ目の עַד は兄への接近を導く構文として理解した。
theological_decisions:
- issue: וַיִּשְׁתַּחוּ が礼拝を意味するか、対人的な敬意・服従を意味するか
  choice: 身体動作として「ひれ伏した」と訳し、宗教的礼拝とは明示しない
  alternative: 「拝した」「礼拝した」
  rationale: ここでは兄エサウとの対面における服従・敬意の行為であり、語自体の幅を保って神学的意味を過度に限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、「七度」「地にひれ伏した」で物語の荘重さと具体的な身体動作を保持した。「彼」ではなく「ヤコブ」を補い、単独節でも指示対象が明確になるようにした。
