  text: וַ/יֹּ֣אמֶר יַעֲקֹ֗ב אַל נָא֙ אִם נָ֨א מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וְ/לָקַחְתָּ֥ מִנְחָתִ֖/י מִ/יָּדִ֑/י כִּ֣י עַל כֵּ֞ן רָאִ֣יתִי פָנֶ֗י/ךָ כִּ/רְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַ/תִּרְצֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/010.yaml
  text: Jacob said[a], “No, please. If I have found favor in your eyes, then take my gift from my hand, because seeing your face is like seeing the face of God[c][b], and you have received me favorably.”
translation:
  language: ja
  text: ヤコブは言った。「いいえ、どうか。もし私があなたの目にかなっておりますなら、私の手からこの贈り物[a]を受け取ってください。というのも、私はあなたの顔を、神の御顔を見るかのように見たのです。そして、あなたは私を快く受け入れてくださいました[b][c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贈り物」と訳したヘブライ語は、文脈によって「贈答品」「貢ぎ物」「供え物」などを意味する。ここでは、ヤコブがエサウとの和解のために差し出した品を指す。
    reason: lexical_alternative
  - marker: b
    text: 「神の御顔」は、「ある神の顔」または「神的存在の顔」と訳せる可能性もある。しかし、直前にヤコブがペヌエルで神の顔を見たと語っていることから（32章31節）、ここでは「神」が文脈に最もよく合う。
    reason: alternative_reading
  - marker: c
    text: 「快く受け入れてくださいました」は、「私を受け入れてくださった」または「私を喜んでくださった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵן / בְּעֵינֶיךָ
  choice: あなたの目に好意を得ている
  rationale: ヘブライ語の「目に恵み・好意を見いだす」という対人的な慣用句と「目」の比喩を保ちつつ、現代日本語で理解できる形にした。
- source_word: מִנְחָתִי
  choice: この贈り物
  rationale: 文脈ではエサウとの和解のために差し出す品を指す。「供え物」では祭儀的意味に偏るため、「贈り物」とした。
- source_word: מִיָּדִי
  choice: 私の手から
  rationale: 直接手渡す場面の具体性を保つため、ヘブライ語の身体表現を残した。
- source_word: כִּי עַל־כֵּן
  choice: あなたの顔を見ることができたのは…ことでした
  rationale: 直訳的な「それゆえに」は日本語では因果関係が不明瞭になるため、贈り物を受け取るよう願う理由を自然な談話の流れで示した。
- source_word: כִּרְאֹת פְּנֵי אֱלֹהִים
  choice: 神の御顔を見るようなこと
  rationale: 「顔」の反復と、直前のペヌエルでの出来事との響きを保った。神に対する「御顔」は現代の聖書文体として自然で、エサウへの敬語とは区別できる。
- source_word: וַתִּרְצֵנִי
  choice: 私を好意をもって迎えてくださった
  rationale: 動詞が表す、相手を喜んで受け入れるという意味を、関係回復の文脈に即して表現した。
theological_decisions:
- issue: אֱלֹהִים の指示対象
  choice: 神
  alternative: 一人の神／神的存在
  rationale: 語そのものにはより広い用法があり得るが、創世記32章31節（英語節番号32:30）のペヌエルでヤコブが神の顔を見たという直近の文脈は、イスラエルの神を指す読みを強く支持する。比較の大胆さは弱めずに残した。
- issue: エサウの顔と神の御顔との比較
  choice: 明示された比較をそのまま保持
  alternative: 単に「神に会ったかのようにうれしい」と意訳する
  rationale: 原文の「顔を見る」という反復には、ペヌエルの記事との文学的・神学的緊張があるため、感情だけに還元しなかった。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、兄に対するヤコブの切実で丁重な語調を敬語で表した。「どうか」を反復して原文の懇願を示し、「顔」の反復と神学的な比較を保持した。
