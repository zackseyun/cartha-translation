    issue: 「あなたの顔を見ることができたのは、神の御顔を見るようなことでした」
    rationale: 原文は「私はあなたの顔を見た。神の顔を見るように」という顔の反復を含む比較である。「見ることができたのは」は可能・機会の意味合いを加え、構文上の直接性を弱める。
  - severity: medium
    issue: 「しかも、あなたは」
    rationale: וַの接続を「しかも」とすることは、原文に明示されない追加・強調の関係を与える。単純な「そして」または文を続ける形がより中立的である。
  - severity: low
    issue: 「あなたの目に好意を得ている」
    rationale: 原文の慣用句を保とうとする意図はよいが、現代日本語では「好意を得る」より「目にかなう」のほうが自然であり、相手からの好意的評価という意味も明確である。
  - severity: low
    issue: 「どうかそう言わないでください」
    rationale: 「そう」は直前のエサウの申し出を補足するため、文脈上は理解できるが、当該節の原文にはない。短い拒絶と懇願をそのまま表すほうが忠実である。
