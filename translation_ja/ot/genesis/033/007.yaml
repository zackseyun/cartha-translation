source:
  edition: WLC
  text: וַ/תִּגַּ֧שׁ גַּם לֵאָ֛ה וִ/ילָדֶ֖י/הָ וַ/יִּֽשְׁתַּחֲו֑וּ וְ/אַחַ֗ר נִגַּ֥שׁ יוֹסֵ֛ף וְ/רָחֵ֖ל וַ/יִּֽשְׁתַּחֲוֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/007.yaml
  text: Leah also came near[a], and her children, and they bowed down. Afterward Joseph and Rachel came near[b], and they bowed down.
translation:
  language: ja
  text: レアも子どもたちとともに進み出た[a]。そして彼らはひれ伏した[b]。その後、ヨセフとラケルが進み出て、ひれ伏した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「近づいた」。後半の「進み出て」も同じ語。
    reason: lexical_alternative
  - marker: b
    text: または「深く身をかがめた」。原語は、深い敬意を示して身を低くする行為を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשׁ / נִגַּשׁ
  choice: 進み出た
  rationale: נגשׁは近づくことを表す。この場面では、一行が順にエサウの前へ出る動きを自然な日本語で示すため「進み出た」とした。
- source_word: גַּם
  choice: も
  rationale: 先に進み出た者たちにレアの一団が加わるという、叙述の追加と順序を簡潔に示す。
- source_word: וִילָדֶיהָ
  choice: 子どもたち
  rationale: יְלָדִיםは性別を限定せず子どもを指し得るため、広い意味を保つ「子どもたち」とした。
- source_word: וַיִּשְׁתַּחֲוּ
  choice: ひれ伏した
  rationale: שׁחהのこの語形は、相手への深い敬意を身体で示す行為を表す。「ひれ伏した」は礼拝の対象であると決めつけず、深い服従・敬意の姿勢を自然に伝える。
- source_word: וְאַחַר
  choice: その後
  rationale: 一行が順番に前へ出た時間的な前後関係を、明瞭で自然な日本語で示す。
- source_word: יוֹסֵף וְרָחֵל
  choice: ヨセフとラケル
  rationale: 原文の語順をそのまま保った。
theological_decisions:
- issue: 「ひれ伏す」が礼拝を意味するか
  choice: 相手への深い敬意を示す身体動作として訳す
  alternative: 「伏し拝んだ」として礼拝的な含みを強める
  rationale: ここではエサウへの恭順の行為であり、動詞自体が神への礼拝に限定されないため、神学的意味を付加しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用い、家族が順にエサウの前へ出る場面を簡潔に描いた。「一同」よりも原文の複数主語が明確な「彼ら」を採用し、後半では日本語として不要な主語の反復を避けた。
