base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/004.yaml
  text: Esau ran to meet him[a], embraced him, fell on his neck, kissed him, and they wept.
translation:
  language: ja
  text: エサウは走って彼を迎え、抱きしめ、彼の首に抱きつき、口づけした[a]。そして二人は泣いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: マソラ本文では、「口づけした」に当たる語の上に異例の点が付されている。これを疑念または強調のしるしと見る解釈もあるが、ここでのヘブライ語の通常の意味は「口づけした」である。
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּרָץ
  choice: 走って
  rationale: רוץの基本的な意味である素早い走りを、自然な日本語でそのまま表した。
- source_word: לִקְרָאתוֹ
  choice: 彼を迎え
  rationale: לקראתは、人の方へ出て行って会うことを表す。「彼を迎え」は、この場面での対人的な動きを簡潔かつ自然に伝える。
- source_word: וַיְחַבְּקֵהוּ
  choice: 抱きしめ
  rationale: חבקの親愛を示す身体動作を、現代日本語で明瞭に表した。
- source_word: וַיִּפֹּל עַל צַוָּארוֹ
  choice: その首に抱きついて
  rationale: 直訳的な「その首の上に倒れかかり」では日本語として不自然になりやすいため、首に身を寄せる原文の鮮明な動作を自然に保持した。
- source_word: וַיִּשָּׁקֵהוּ
  choice: 口づけした
  rationale: נשקのここでの明白な意味を採用した。「口づけした」は、聖書物語にふさわしい品位を保ちつつ現代の読者にも理解しやすい。マソラ本文の異例な点は訳文を変えず脚注で示した。
- source_word: וַיִּבְכּוּ
  choice: 二人は泣いた
  rationale: 複数形の動詞がエサウとヤコブの双方を指すことを、日本語で曖昧にならないよう「二人」と明示した。
theological_decisions:
- issue: エサウがヤコブに示した行動の解釈
  choice: 親愛と和解を示す一連の行動として、ヘブライ語本文の表面的な意味をそのまま訳す。
  alternative: 後代の解釈伝承に基づき、口づけを疑わしい行為または皮肉として訳文に反映する。
  rationale: 本文は、走る、抱きしめる、首に抱きつく、口づけする、泣くという親愛的な動詞を連続して用いている。疑念を本文へ付加せず、マソラ上の特徴のみ脚注で知らせる。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、物語の品位と感情の強さを保った。「その首に抱きついて」は、ヘブライ語特有の表現を不自然な逐語訳にせず、その身体的な情景を伝える表現である。
