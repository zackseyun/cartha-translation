base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/020.yaml
  text: There he set up an altar and called it El-Elohe-Israel[a][b].
translation:
  language: ja
  text: そこに祭壇を築き、それを「エル・エロヘ・イスラエル」[a][b]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そこに祭壇を築き、神に『神、イスラエルの神』と呼びかけた」、または「その祭壇について、『神、イスラエルの神』と宣言した」。ヘブライ語は、祭壇に名をつけたとも、神を呼び求めた、あるいは神について宣言したとも理解できる。
    reason: alternative_reading
  - marker: b
    text: 「エル・エロヘ・イスラエル」は、「神、イスラエルの神」または「エル、イスラエルの神」という意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצֶּב
  choice: 築き
  rationale: ヒフィル形は「立てる、設置する」を表す。祭壇については、現代日本語で自然かつ定着した「築く」とした。
- source_word: שָׁם
  choice: そこに
  rationale: 場所を指す副詞を簡潔に訳した。
- source_word: מִזְבֵּחַ
  choice: 祭壇
  rationale: 犠牲をささげる構造物を指す標準的な訳語である。
- source_word: וַיִּקְרָא לוֹ
  choice: それを……と名づけた
  rationale: 直前の祭壇に名をつけたと理解するのが文脈上自然であり、創世記に見られる命名表現とも調和する。ただし、神を呼び求めた、または祭壇について宣言したと取る余地を脚注に残した。
- source_word: אֵל אֱלֹהֵי יִשְׂרָאֵל
  choice: エル・エロヘ・イスラエル
  rationale: 本文では祭壇の固有名として機能すると判断し、ヘブライ語の形を音写した。その語義は脚注で示した。
theological_decisions:
- issue: 末尾の句が祭壇の名なのか、神への呼びかけ・神についての宣言なのか
  choice: ヤコブが祭壇につけた名として訳す
  alternative: 「神、イスラエルの神」と神の名を呼んだ、または祭壇について「神はイスラエルの神」と宣言したと解する
  rationale: 祭壇を築いたという直前の文脈と命名構文は、祭壇の名とする理解を自然に支える。一方、קרא ל の簡潔な構文には呼びかけや宣言の可能性もあるため、本文で一つに断定しきらず脚注に保存した。
translation_notes:
  register: 明快で格調を保った現代標準日本語。「設置した」より祭壇に自然な「築き」を用い、固有名は中黒で区切って読みやすくした。主語は前後の文脈から明らかなため、原文どおりこの節では明示していない。
