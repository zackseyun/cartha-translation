  text: Then the female servants and their children came near and bowed down[a][b][c][d].
translation:
  language: ja
  text: それから、女奴隷たちとその子どもたちが進み出て、ひれ伏した[a][b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「女の召使いたち」とも訳せる。ヘブライ語は、隷属的身分にある女性を指す。
    reason: lexical_alternative
  - marker: b
    text: 「身を低くして礼をした」とも訳せる。ここでは敬意を示すために身を低くする動作を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּגַּשְׁןָ
  choice: 進み出て
  rationale: נגשׁの物語を進める継続形で、エサウの前へ近づく動きを表す。日本語では「進み出る」が場面に自然である。
- source_word: הַשְּׁפָחוֹת
  choice: 女奴隷たち
  rationale: שִׁפְחָהは女性の隷属的身分を指す語であり、単なる雇用上の「召使い」よりも原語の社会的身分を明確に伝える。
- source_word: הֵנָּה וְיַלְדֵיהֶן
  choice: 子どもたちとともに
  rationale: 字義的には「彼女たち、その子どもたちも」で、独立代名詞הֵנָּהが女奴隷たちを受ける。現代日本語では同行する一団として自然に表現した。
- source_word: וַתִּשְׁתַּחֲוֶיןָ
  choice: ひれ伏した
  rationale: השתחוהが表す、敬意を示して身を低くする動作を簡潔かつ格調を保って表す。単なる会釈より深い身体動作を示す。
