base_translation:
  language: en
  yaml_path: translation/ot/genesis/033/005.yaml
  text: He lifted up his eyes and saw the women and the children[a], and he said, “Who are these with you?” And he said[b], “The children whom God has graciously given to your servant.”
translation:
  language: ja
  text: エサウは目を上げて、女たちと子どもたちを見て言った。「この人たちは、あなたにとって誰ですか[a]。」ヤコブは答えた。「神があなたの僕に恵みとして与えてくださった子どもたちです[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「これらは、あなたにとって誰なのか」。ヤコブと共にいる者たちの身元、またはヤコブとの関係・帰属を尋ねるヘブライ語の表現。
    reason: lexical_alternative
  - marker: b
    text: 「神があなたの僕に与えてくださった子どもたちです」とも訳せる。原語の動詞には、好意を示す、恵むという意味もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא אֶת עֵינָיו
  choice: 目を上げて
  rationale: 字義とヘブライ語の物語的表現を保ちつつ、現代日本語でも自然に理解できる。文脈上、主語はエサウであるため明示した。
- source_word: הַנָּשִׁים
  choice: 女たち
  rationale: 原文は関係を限定する「妻たち」ではなく、広い意味の「女たち」を用いているため、その語義を保った。
- source_word: הַיְלָדִים
  choice: 子どもたち
  rationale: この場面に適した自然な訳であり、節内の二度の用例を同じ語で表した。
- source_word: מִי אֵלֶּה לָּךְ
  choice: ここにいる人たちは、あなたとどういう関係なのか
  rationale: 字義的には「これらはあなたにとって誰か」。同行者の身元またはヤコブとの関係を尋ねる慣用表現なので、その曖昧さを過度に狭めず自然な日本語にした。
- source_word: חָנַן
  choice: 恵みとして授けてくださった
  rationale: 単に「与える」だけでなく、好意を示し恵むという動詞の含意を表す。
- source_word: אֱלֹהִים
  choice: 神
  rationale: ここでは単数の神を指す標準的な訳。
- source_word: עַבְדֶּךָ
  choice: あなたの僕
  rationale: エサウに対するヤコブのへりくだった自称であり、社会的な敬意を示す「僕」が文脈に合う。
theological_decisions:
- issue: 子どもを与えた神の好意という含意
  choice: 「恵みとして授けてくださった」とし、神の好意を明示する
  alternative: 「与えてくださった」と簡潔に訳す
  rationale: חנןには好意を示す、恵むという意味があり、特定の教理を付加せず原文の神学的含意を保持できる。
- issue: 問いが同行者の身元を尋ねるのか、ヤコブとの関係を尋ねるのか
  choice: 「あなたとどういう関係なのか」と訳し、関係を問う表現として示す
  alternative: 「この人たちは誰なのか」または「この人たちはあなたの何なのか」
  rationale: לָּךְを無視せず、同時に不自然な直訳を避けた。身元と関係の双方を含み得る点は脚注で示す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。発話者が分かりやすいよう文脈から「エサウ」「ヤコブ」を補った。「僕」は「しもべ」と読み、へりくだった自称として用いる。
