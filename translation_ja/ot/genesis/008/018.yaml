base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/018.yaml
  text: So Noah went out[b][a], and his sons and his wife and his sons’ wives with him.
translation:
  language: ja
  text: そこでノアは、息子たち、妻、息子たちの妻たちと共に出た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: そこで…箱舟を出た
  rationale: 接続形は直前の命令を受けて物語を進めるため、「そこで」とした。יָצָאは「出る」であり、文脈上、出た場所が箱舟であることを日本語として自然に補った。
- source_word: נֹחַ
  choice: ノア
  rationale: 日本語聖書で定着している人名表記。
- source_word: וּבָנָיו
  choice: 息子たち
  rationale: בָּנִיםはここではノアの男性の子らを指すため、「子どもたち」ではなく「息子たち」とした。
- source_word: וְאִשְׁתּוֹ
  choice: 妻
  rationale: 三人称男性単数接尾辞を伴い、直訳は「彼の妻」。日本語では主語がノアと明らかなため、冗長さを避けて「妻」とした。
- source_word: וּנְשֵׁי בָנָיו
  choice: 息子たちの妻
  rationale: ヘブライ語の「彼の息子たちの妻たち」という関係を直接保ちつつ、日本語では集合を表す「妻」で自然に表現した。
- source_word: אִתּוֹ
  choice: と共に
  rationale: 前置詞と三人称男性単数接尾辞は「彼と共に」の意。日本語では列挙された同行者を「と共に」でノアに結び付けた。
