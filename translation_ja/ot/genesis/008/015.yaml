- source_word: לֵאמֹר
  choice: （独立して訳出せず、後続する直接話法で表す）
  rationale: 発言内容を導入するヘブライ語の慣用表現である。日本語では「言った」と重ねず、文を閉じて後続の直接話法へつなぐことで自然に機能を表した。
