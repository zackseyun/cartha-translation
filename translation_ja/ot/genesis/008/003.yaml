base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/003.yaml
  text: And the waters receded from upon the earth[a], going and returning[b], and the waters diminished at the end of a hundred and fifty days.
translation:
  language: ja
  text: 水は地の上から次第に引いていった。百五十日の終わりに、水は減り始めた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: 引いていった
  rationale: שוב は基本的に「戻る」を意味するが、洪水の水が地の上から退く文脈では、現代日本語の「水が引く」が自然で正確である。
- source_word: מֵעַל הָאָרֶץ
  choice: 地の上から
  rationale: מֵעַל の「〜の上から」という空間的な像を保ち、水が地を覆っていたことを表す。
- source_word: הָלוֹךְ וָשׁוֹב
  choice: 次第に
  rationale: 二つの不定詞独立形による継続・進行のニュアンスを、「行きつ戻りつ」と往復運動に限定せず、自然な日本語で表した。直訳的表現は本文の意味を誤解させるおそれがある。
- source_word: וַיַּחְסְרוּ
  choice: 減っていた
  rationale: חסר が示す、水量が少なくなった状態を明確に表し、前半の「引く」と動詞を区別した。
- source_word: מִקְצֵה
  choice: 終わりには
  rationale: 時間表現として「〜の終わりに」を意味する。ここでは到達時点と、その時点で成立していた状態を自然に示す「終わりには」とした。
- source_word: חֲמִשִּׁים וּמְאַת יוֹם
  choice: 百五十日
  rationale: ヘブライ語の数詞を現代日本語の標準的な表記で訳した。
