  text: At the end of forty days[b][a], Noah opened the window of the ark that he had made.
translation:
  language: ja
  text: 四十日が終わると[a]、ノアはノアが造った箱舟の窓を開けた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「四十日が過ぎた後」。ヘブライ語の表現は、期間の終点を「四十日の終わりに」と捉えることも、より慣用的に「四十日が過ぎた後」と表すこともできる。
    reason: lexical_alternative
  - marker: b
    text: 原文の物語導入句を表して、「そして、四十日の終わりに、ノアはノアが造った箱舟の窓を開けた」とも訳せる。
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי
  choice: （独立した語句としては訳出せず、文全体の時間節と叙述の流れで表現）
  rationale: 物語の次の出来事を導入する定型句。現代日本語では「そして、…ということが起こった」と逐語的に訳すより、後続の時間表現を「…すると」として主節へつなぐほうが自然であり、物語の進行も保てる。定型句を明示する別訳は脚注に示した。
- source_word: מִקֵּץ
  choice: 終わると
  rationale: 一定の期間の終点に達したことを表す。「四十日が終わると」は原文の時間的な意味を保ちつつ自然な日本語になる。「四十日が過ぎた後」とも解せるため、脚注に別訳を示した。
- source_word: אַרְבָּעִים יוֹם
  choice: 四十日
  rationale: 数詞と「日」の標準的で直接的な訳。
- source_word: וַיִּפְתַּח
  choice: 開けた
  rationale: פתחの文脈上の基本義を、簡潔で自然な日本語で表した。
- source_word: חַלּוֹן
  choice: 窓
  rationale: 通常は窓、または窓状の開口部を指す。この文脈では伝統的かつ自然な「窓」が適切。
- source_word: הַתֵּבָה
  choice: 箱舟
  rationale: 創世記6―9章でノアの舟を指すתֵּבָהの定着した日本語訳。単なる「箱」より文脈上の指示対象が明確。
- source_word: אֲשֶׁר עָשָׂה
  choice: 自分が造った
  rationale: 関係節が「箱舟」を修飾し、造った主体がノアであることを自然な日本語で示す。製作が窓を開ける出来事より前であることは文脈上明らかなため、過剰な補足は加えない。
