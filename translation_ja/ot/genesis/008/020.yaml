  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽ/יהוָ֑ה וַ/יִּקַּ֞ח מִ/כֹּ֣ל הַ/בְּהֵמָ֣ה הַ/טְּהוֹרָ֗ה וּ/מִ/כֹּל֙ הָ/ע֣וֹף הַ/טָּהֹ֔ר וַ/יַּ֥עַל עֹלֹ֖ת בַּ/מִּזְבֵּֽחַ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/020.yaml
  text: Then Noah built an altar to Yahweh[a], and took some of every clean animal and of every clean bird[b], and offered burnt offerings on the altar.
translation:
  language: ja
  text: それからノアはヤハウェに祭壇を築き、清い動物すべての中から、また清い鳥すべての中から取って、祭壇の上で全焼のささげ物を献げた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבֶן
  choice: 築き
  rationale: בנהの基本義を保ちつつ、「祭壇を築く」という自然で定着した日本語表現とした。
- source_word: מִזְבֵּחַ
  choice: 祭壇
  rationale: 犠牲を献げる場所を表すמזבחの標準的な訳語。
- source_word: לַיהוָה
  choice: ヤハウェのために
  rationale: 前置詞לの方向・受益の意味を自然に表し、神名יהוהは音写した。
- source_word: מִכֹּל הַבְּהֵמָה הַטְּהוֹרָה
  choice: 清い家畜すべての種類から
  rationale: בהמהはここでは犠牲に適する陸上の家畜を指すと理解できる。「種類」は原文に明示されないが、מִכֹּלの部分を取る意味を文脈に即して誤解なく示す補足である。
- source_word: וּמִכֹּל הָעוֹף הַטָּהֹר
  choice: 清い鳥すべての種類から
  rationale: עוףを文脈に適した「鳥」とし、前句と並行する部分選択の構文を保った。
- source_word: וַיַּעַל עֹלֹת
  choice: 全焼のささげ物として献げた
  rationale: עלהのヒフィル形とעֹלֹתによる犠牲奉献を表す。「全焼」は供え物全体を焼く祭儀の性格を明確にする。
- source_word: בַּמִּזְבֵּחַ
  choice: 祭壇の上で
  rationale: בの場所を示す用法を自然な日本語で表した。
theological_decisions:
- issue: 神名יהוהの訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 固有の神名であることを本文で保持するため音写した。
- issue: מִכֹּלの部分を表す意味
  choice: すべての種類から取って
  alternative: すべてから取って
  rationale: ノアが清い動物を一匹残らず犠牲にしたという誤読を避けつつ、各範疇から選び取ったという文脈上の含意を示した。「種類」は補足であるため脚注で原文直訳も示す。
- issue: עֹלֹתの祭儀的意味
  choice: 全焼のささげ物
  alternative: 焼き尽くすささげ物
  rationale: 供え物を全体として焼く祭儀を簡潔かつ明瞭に伝え、単に火で焼いた供え物という理解を避けた。
translation_notes:
  register: 現代の一般読者に理解しやすい、簡潔で格調を保った物語文とした。「清い」はここでは祭儀上、ささげ物に適するとされたことを表す。
