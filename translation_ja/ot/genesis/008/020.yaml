- from: それからノアはヤハウェのために祭壇を築き、清い家畜すべての種類と、清い鳥すべての種類から取って[a]、祭壇の上で全焼のささげ物として献げた。
  to: それからノアはヤハウェに祭壇を築き、清い動物すべての中から、また清い鳥すべての中から取って、祭壇の上で全焼のささげ物を献げた。
  rationale: 原文にない「種類」を除き、ミン（から）の部分的選択は「すべての中から」によって保った。「家畜」をより包括的な「動物」に改め、神名への前置詞句も自然な現代日本語に整えた。脚注は、修正文が原文の構文を十分に反映し、必要な補足を含まないため不要である。
