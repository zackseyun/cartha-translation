id: GEN.8.1
reference: Genesis 8:1
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּזְכֹּ֤ר אֱלֹהִים֙ אֶת נֹ֔חַ וְ/אֵ֤ת כָּל הַֽ/חַיָּה֙ וְ/אֶת כָּל הַ/בְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖/וֹ בַּ/תֵּבָ֑ה וַ/יַּעֲבֵ֨ר אֱלֹהִ֥ים ר֨וּחַ֙ עַל הָ/אָ֔רֶץ וַ/יָּשֹׁ֖כּוּ הַ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/001.yaml
  text: But God remembered Noah[a], and all the wild animals, and all the livestock that were with him in the ark. And God caused a wind to pass over the earth[b], and the waters subsided.
translation:
  language: ja
  text: 神はノアと、箱舟の中で彼と共にいたすべての野生の動物、すべての家畜を心に留められた[a]。神は地の上に風[b]を吹き渡らせ、水は静まった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「神はノアを思い起こされた」。ヘブライ語の「思い起こす」は、単に記憶によみがえることではなく、覚えていて顧み、忠実に行動することをしばしば含む。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語の רוּחַ（ルーアハ）は「風」「息」「霊」を意味し得る。ここでは文脈上「風」が最も自然である。創世記1章2節の、水の上にある神の霊（または風）との響きを見る解釈もある。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְכֹּר
  choice: 心に留められた
  rationale: 単なる想起ではなく、覚えて顧み、行動に移すという文脈上の含みを自然な日本語で表す。同時に、神がノアを忘れていたという誤解を避ける。ヘブライ語の直訳的表現は脚注に示す。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 単数動詞を伴い、ここではイスラエルの神を指すため、標準的に「神」とする。
- source_word: כָּל הַחַיָּה
  choice: すべての野の獣
  rationale: 後続の בְּהֵמָה と対をなし、野生の動物を指す語として区別を保つ。
- source_word: כָּל הַבְּהֵמָה
  choice: すべての家畜
  rationale: חַיָּה との対比から、人に飼われる陸上動物を指すと理解し、現代日本語で明瞭な「家畜」とする。
- source_word: אֲשֶׁר אִתּוֹ
  choice: 彼と共にいた
  rationale: 関係節の内容を簡潔で自然な日本語にする。
- source_word: בַּתֵּבָה
  choice: 箱舟の中で
  rationale: ノアの洪水物語における תֵּבָה の定着した訳語「箱舟」を用いる。
- source_word: וַיַּעֲבֵר ... רוּחַ
  choice: 風を吹き渡らせる
  rationale: 使役形の「通らせる」を、日本語として自然で、かつ風の動きを明示する表現にした。רוּחַ は、水が引くという直後の結果から「風」とする。
- source_word: עַל הָאָרֶץ
  choice: 地の上に
  rationale: 洪水物語の広がりに合うとともに、「地／地上」というヘブライ語の表現を簡潔に保つ。
- source_word: וַיָּשֹׁכּוּ הַמָּיִם
  choice: 水は引いていった
  rationale: 水が静まり、減退していく意味を、洪水について自然な現代日本語で表す。
- source_word: וַ
  choice: しかし
  rationale: 直前までの裁きの叙述から、神がノアを顧みる展開への転換を示す。接続詞自体は「そして」とも訳せるが、文脈上の対照を明瞭にする。
theological_decisions:
- issue: 「神がノアを覚えた」という擬人的表現
  choice: 本文では「心に留められた」とし、神が顧みて行動される含みを保つ
  alternative: 「思い起こされた」「覚えておられた」
  rationale: 原語の זכר は、神が以前忘れていたことを意味するのではなく、覚えていて忠実に働きかけることを含意する。説明的に言い切りすぎず、日本語で生じやすい誤解を避けるため「心に留められた」とし、直訳は脚注で保存する。
- issue: 洪水物語における רוּחַ の意味
  choice: 本文では「風」
  alternative: 「霊」または「息」
  rationale: 語自体には「霊」「息」の意味もあるが、地の上を渡り、水が引くという直接の文脈では気象的な「風」が最も適切である。創世記1章2節との響きの可能性は脚注で示し、曖昧さを保存する。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「野の獣」と「家畜」を区別し、原文の対句を保った。「心に留められた」は敬語を過度に重ねず、神の行為を自然に述べる聖書本文の文体とした。
