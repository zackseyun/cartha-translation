id: GEN.8.12
reference: Genesis 8:12
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַ/יְשַׁלַּח֙ אֶת הַ/יּוֹנָ֔ה וְ/לֹֽא יָסְפָ֥ה שׁוּב אֵלָ֖י/ו עֽוֹד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/012.yaml
  text: Then he waited another seven days[a], and sent out the dove, and it did not return to him again.
translation:
  language: ja
  text: それからノアは、さらに七日待って、鳩を放った。鳩はもう彼のもとに戻って来なかった。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「鳩は再び彼のもとに戻って来なかった」。ヘブライ語の否定表現は、「再び戻らなかった」とも「もう戻らなかった」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיָּחֶל
  choice: それからノアは……待って
  rationale: 文脈上、動詞は「待つ」の意味。連続する物語の進行を「それから」で示し、日本語では主語を明確にするため「ノア」を補った。
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: さらに七日
  rationale: עוֹד と אֲחֵרִים が表す、前回に続く追加の七日間を、自然で簡潔な日本語にした。
- source_word: וַיְשַׁלַּח אֶת־הַיּוֹנָה
  choice: 鳩を放った
  rationale: שׁלח は基本的に「送る」だが、箱舟から鳩を外へ送り出す場面では「放つ」が自然であり、単なる解放という以上の意味は加えていない。
- source_word: וְלֹא יָסְפָה שׁוּב אֵלָיו עוֹד
  choice: 鳩はもう彼のもとに戻って来なかった
  rationale: 否定された יסף と שׁוּב、および末尾の עוֹד を、「もう……なかった」と表現した。「再び戻らなかった」とも訳せるため、脚注で語義上の幅を示した。
- source_word: אֵלָיו
  choice: 彼のもとに
  rationale: 方向を表す「彼へ」より、鳩がノアのいる場所へ帰る場面に自然な「彼のもとに」とした。
theological_decisions: []
translation_notes:
  register: 明快で現代的な物語文としつつ、「鳩を放った」「彼のもとに」など、聖書本文にふさわしい落ち着いた語調を保った。脚注記号は該当文末に置いた。
