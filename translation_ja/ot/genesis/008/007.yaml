  text: וַ/יְשַׁלַּ֖ח אֶת הָֽ/עֹרֵ֑ב וַ/יֵּצֵ֤א יָצוֹא֙ וָ/שׁ֔וֹב עַד יְבֹ֥שֶׁת הַ/מַּ֖יִם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/007.yaml
  text: Then he sent out the raven[a], and it went out, going out and returning[b], until the waters had dried up from upon the earth.
translation:
  language: ja
  text: 彼はからすを放った。からすは、地の上から水が乾くまで、出て行き、出て行っては戻った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「出て行き、出て行っては戻った」。このヘブライ語表現は、継続的または反復的な動きを表す。
    reason: 原文の有限動詞と反復表現の重なり、およびその動きの継続性を示すため。
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: 彼は……放った
  rationale: 物語を進める連続形。日本語では文脈に沿った自然な過去形とし、鳥を外へ送り出す動作を「放った」で表した。
- source_word: הָעֹרֵב
  choice: からす
  rationale: 定冠詞を伴う עֹרֵב の一般的で正確な鳥名。現代日本語で読みやすい表記とした。
- source_word: וַיֵּצֵא יָצוֹא וָשׁוֹב
  choice: 出て行っては戻ることを繰り返した
  rationale: 有限動詞と二つの不定詞絶対形からなる表現が示す、継続的・反復的な往復運動を自然な日本語で明示した。「飛ぶ」は原文に明記されていないため加えない。
- source_word: עַד יְבֹשֶׁת הַמַּיִם
  choice: 水が乾くまで
  rationale: עַד の時間的終点と、יבשׁ の「乾く」という意味を簡潔に保持した。מַיִם は日本語では通常、単数的な集合名詞「水」とする。
- source_word: מֵעַל הָאָרֶץ
  choice: 地の上から
  rationale: מֵעַל の「上から／上より」という空間的イメージを保ち、「地表から」ほど解釈的に限定しない表現とした。
theological_decisions:
- issue: からすの往復先
  choice: 本文では「出て行っては戻る」とし、戻り先を明示しない
  alternative: 箱舟へ戻って来た／地上を行き来した
  rationale: שׁוּב は戻る動きを示すが、箱舟に戻ったのか、その周囲を往復したのかを本文は明示していないため、特定しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「彼」は直前の文脈にいるノアを指す。節頭の連続形は、日本語で不自然な接続語を置かず、文の順序によって物語の進行を示した。
