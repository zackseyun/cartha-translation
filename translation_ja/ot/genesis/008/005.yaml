base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/005.yaml
  text: And the waters continued to recede until the tenth month. In the tenth month[a], on the first day of the month, the tops of the mountains became visible.
translation:
  language: ja
  text: 水は第十の月まで減り続けた。第十の月の一日、山々の頂が見えるようになった[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「見えた」「現れた」。ヘブライ語は、より形式的には「見られた」とも訳せるが、ここでは水が引くにつれて山々の頂が視界に入ったことを「見えるようになった」と表している。
    reason: נִרְאוּ の語彙的・文法的な代替訳を示しつつ、本文の非人称的・起動的な訳し方を説明する。
lexical_decisions:
- source_word: הַמַּיִם
  choice: 水
  rationale: ヘブライ語では複数形だが、日本語では洪水の水を集合的に表す自然な言い方として「水」とした。
- source_word: הָיוּ הָלוֹךְ וְחָסוֹר
  choice: 次第に引き続けた
  rationale: 継続・進行を表す構文を「続けた」で示し、水位が徐々に下がる文脈上の動きを「次第に引く」と自然な日本語で表した。
- source_word: עַד הַחֹדֶשׁ הָעֲשִׂירִי
  choice: 第十の月まで
  rationale: 物語の暦上の時点を示す חֹדֶשׁ を「月」とし、序数表現も保った。
- source_word: בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ
  choice: 第十の月、その月の一日
  rationale: 原文の簡潔な日付表現を、意味を補いすぎず現代日本語で明瞭にした。
- source_word: נִרְאוּ
  choice: 見えるようになった
  rationale: ראה のニファル形が表す、山頂が水の減少に伴って視界に現れたという起動的・受動的な含みを自然に表した。特定の観察者は明示していない。
- source_word: רָאשֵׁי הֶהָרִים
  choice: 山々の頂
  rationale: רֹאשׁ の「頭・頂」という比喩を保ちつつ、地形について自然で格調ある表現とした。「峰」よりも山の上部全般を指しうる。
