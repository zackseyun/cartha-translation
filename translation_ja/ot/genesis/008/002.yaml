id: GEN.8.2
reference: Genesis 8:2
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּסָּֽכְרוּ֙ מַעְיְנֹ֣ת תְּה֔וֹם וַֽ/אֲרֻבֹּ֖ת הַ/שָּׁמָ֑יִם וַ/יִּכָּלֵ֥א הַ/גֶּ֖שֶׁם מִן הַ/שָּׁמָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/002.yaml
  text: The springs of the deep and the windows of the heavens were shut[b][a], and the rain from the heavens was restrained.
translation:
  language: ja
  text: 深淵の泉と天の窓[a]は閉ざされ、天からの雨はとどめられた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天の水門」。ヘブライ語は、文字どおりには天にある開口部、または窓を指す。
    reason: lexical_alternative
  - marker: b
    text: 別訳「天からの雨はやんだ」。ヘブライ語の動詞は、雨がとどめられ、その結果やんだことを表し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסָּכְרוּ
  choice: 閉ざされ
  rationale: סכרのニファル形で、「閉じられる、ふさがれる」を表す。「泉」と「窓」の両方を主語とする受動表現を保ちつつ、自然で格調ある日本語とした。
- source_word: מַעְיְנֹת
  choice: 泉
  rationale: 水が湧き出る源を指す。現代日本語で自然な「泉」とし、「噴水」のような人工物の印象を避けた。
- source_word: תְּהוֹם
  choice: 深淵
  rationale: 創世記1章2節にも現れる原初的・宇宙的な大水を指す語であり、単なる「深い所」や「海」に限定せず、そのイメージを保つ。
- source_word: אֲרֻבֹּת
  choice: 窓
  rationale: 基本的には「窓、開口部」を意味する。ここでは天にある開口部という比喩をそのまま残し、解釈を加えた「水門」は脚注の代案とした。
- source_word: הַשָּׁמַיִם
  choice: 天
  rationale: 宇宙的な文脈に合い、同節内の反復も「天の窓」「天から」として保持できる。日本語では複数形を明示せずとも意味が自然に伝わる。
- source_word: וַיִּכָּלֵא
  choice: とどめられた
  rationale: כלאのニファル形で、雨が抑えられ、それ以上降らないようにされたことを表す。単に結果だけを示す「やんだ」より、受動的に抑止されたという語感を保つ。
- source_word: הַגֶּשֶׁם
  choice: 雨
  rationale: 通常の降雨を表す明確で自然な訳語であり、原語以上に強い「豪雨」などの意味を加えない。
- source_word: מִן הַשָּׁמָיִם
  choice: 天から
  rationale: 前半の「天」と同じ語を用いて原文の反復を保ち、「空から」へ言い換えて宇宙的な表現を平板化しない。
theological_decisions:
- issue: 「天の窓」という宇宙的イメージの扱い
  choice: 比喩的表現を「天の窓」として保持する
  alternative: 「天の水門」または単に「空」と説明的に訳す
  rationale: 本文が描く天の開口部というイメージを、特定の現代的宇宙観へ置き換えたり、逆に特定の体系として断定したりせず、そのまま読者に提示するため。
translation_notes:
  register: 明快な現代標準語を用いながら、創世記の宇宙的な描写にふさわしい簡潔で格調ある文体とした。「閉ざされ」「とどめられた」によって原文の受動表現と並行性を保った。
