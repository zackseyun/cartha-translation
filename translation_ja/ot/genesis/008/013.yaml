  text: וַֽ֠/יְהִי בְּ/אַחַ֨ת וְ/שֵׁשׁ מֵא֜וֹת שָׁנָ֗ה בָּֽ/רִאשׁוֹן֙ בְּ/אֶחָ֣ד לַ/חֹ֔דֶשׁ חָֽרְב֥וּ הַ/מַּ֖יִם מֵ/עַ֣ל הָ/אָ֑רֶץ וַ/יָּ֤סַר נֹ֨חַ֙ אֶת מִכְסֵ֣ה הַ/תֵּבָ֔ה וַ/יַּ֕רְא וְ/הִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽ/אֲדָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/013.yaml
  text: And it came about in the six hundred and first year[a], in the first month, on the first day of the month, that the waters had dried up from upon the earth. Then Noah removed the covering of the ark and looked, and behold[c][b], the surface of the ground was dry.
translation:
  language: ja
  text: 六百一年目の第一の月の一日、地の上から水が干上がった。ノアは箱舟の覆い[a]を取り除いて見ると、見よ、地面の表面が乾いていた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「覆い」は「屋根」とも考えられるが、ヘブライ語は構造をそこまで特定していない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: ～になると
  rationale: 物語を進める時間表現として、現代日本語で自然に時点を導入する。
- source_word: בְּאַחַת וְשֵׁשׁ מֵאוֹת שָׁנָה
  choice: 六百一年目
  rationale: ヘブライ語は直訳すれば「一と六百の年」。文脈上の年数の起点を本文で補わず、自然な序数表現とした。
- source_word: בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ
  choice: 第一の月、その月の一日
  rationale: 省略されている「月」を文脈に従って補い、日付を明瞭に示す。
- source_word: חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ
  choice: 地の上から水が引いて乾いた
  rationale: חרבの「乾く、干上がる」という意味と、מעלの「上から」を保ちつつ、水について自然な日本語にした。
- source_word: וַיָּסַר
  choice: 取り除いて
  rationale: 使役形の「取り去る、除く」を簡潔に表す。
- source_word: מִכְסֵה הַתֵּבָה
  choice: 箱舟の覆い
  rationale: מכסהは一般に「覆い」を意味し、屋根という構造を特定しない。
- source_word: וַיַּרְא
  choice: 外を見ると
  rationale: 覆いを取り除いた後の観察動作を自然に示す。「外」は日本語で目的を明らかにする文脈的補足。
- source_word: וְהִנֵּה
  choice: 見よ
  rationale: 注意を促し、発見を際立たせる原文の談話機能を、簡潔で格調ある表現によって保つ。
- source_word: חָרְבוּ פְּנֵי הָאֲדָמָה
  choice: 地面は乾いていた
  rationale: פני האדמהの「地面」を自然に表し、すでに成立していた状態として訳す。
theological_decisions:
- issue: 六百一年目の起点
  choice: 起点を明示しない
  alternative: ノアの生涯の六百一年目
  rationale: 前後の文脈からノアの年齢に基づく可能性は高いが、この節自体には「ノアの」と明記されていないため、原文の含意を本文で断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「見よ」によって聖書物語らしい格調と原文の注意喚起を保持した。年代表現は簡潔にし、原文にない起点を補っていない。
