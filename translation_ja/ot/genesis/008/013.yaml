  to: 六百一年目の第一の月の一日、地の上から水が干上がった。ノアは箱舟の覆い[a]を取り除いて見ると、見よ、地面の表面が乾いていた。
  rationale: 水の乾燥を自然かつ原文に即して「干上がった」とし、日付表現を整えた。原文にない「外」を除き、地表面を指す表現を明示した。語彙上の曖昧さを保持する覆いの注はそのまま残した。
