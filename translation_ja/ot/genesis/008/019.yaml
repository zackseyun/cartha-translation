base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/019.yaml
  text: Every beast[a], every creeping thing, and every bird—everything that moves on the earth—went out from the ark by their families.
translation:
  language: ja
  text: すべての動物、すべての地を這うもの、すべての鳥、地の上を動くすべてのものは、それぞれの家族に従って[a]箱舟から出た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼らの家族に従って」。ヘブライ語は、動物たちが家族的なまとまり、または区分ごとに出たことを表す。「それぞれの群れごとに」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: すべての動物
  rationale: חַיָּהはここで、地を這うものや鳥と区別される動物の部類を指す。「獣」より範囲を不必要に狭めず、現代日本語として明瞭な「動物」とした。כָּלの包括性も「すべて」で表した。
- source_word: כָּל הָרֶמֶשׂ
  choice: すべて地を這うもの
  rationale: רֶמֶשׂは地面近くを動く小動物を指す。「這うもの」は創世記の生物分類を保ちつつ、現代の読者にも理解しやすい。
- source_word: וְכָל הָעוֹף
  choice: すべての鳥
  rationale: עוֹףは広く飛ぶ生き物を指し得るが、この列挙では「鳥」が最も自然で文脈に適する。接続は日本語の並列によって示した。
- source_word: כֹּל רוֹמֵשׂ עַל הָאָרֶץ
  choice: 地の上を動くすべてのもの
  rationale: רוֹמֵשׂはרֶמֶשׂと同じ語義領域に属するが、ここでは前の表現を総括する広い句として「動く」とした。「地の上」も保持した。
- source_word: לְמִשְׁפְּחֹתֵיהֶם
  choice: それぞれの家族ごとに
  rationale: מִשְׁפָּחָהの基本的な意味である「家族・一族」を保ち、動物たちが血統やまとまりに従って出たという表現を過度に「種類」へ解釈しないようにした。
- source_word: יָצְאוּ מִן הַתֵּבָה
  choice: 箱舟から出た
  rationale: יָצְאוּの単純な退出の動作を自然な日本語で表し、ノア物語で定着しているתֵּבָהの訳語「箱舟」を用いた。
