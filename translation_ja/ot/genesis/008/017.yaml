id: GEN.8.17
reference: Genesis 8:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כָּל הַ/חַיָּ֨ה אֲשֶֽׁר אִתְּ/ךָ֜ מִ/כָּל בָּשָׂ֗ר בָּ/ע֧וֹף וּ/בַ/בְּהֵמָ֛ה וּ/בְ/כָל הָ/רֶ֛מֶשׂ הָ/רֹמֵ֥שׂ עַל הָ/אָ֖רֶץ הוצא אִתָּ֑/ךְ וְ/שָֽׁרְצ֣וּ בָ/אָ֔רֶץ וּ/פָר֥וּ וְ/רָב֖וּ עַל הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/017.yaml
  text: Bring out with you every living thing that is with you[a], from all flesh—birds and livestock and every creeping thing that creeps on the earth—so that they may swarm on the earth and be fruitful and multiply on the earth.
translation:
  language: ja
  text: あなたと共にいるあらゆる生き物、すなわち鳥、家畜、地を這うすべてのものを、あなたと共に外へ連れ出しなさい。それらが地に満ち広がり[a]、地で子を生み、増えるように。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「地に群がり」。このヘブライ語動詞には、生き物が盛んに群がり、数多く増えるという意味合いがある。
    reason: שׁרץの豊かな増殖を伴う語感は、日本語の一語だけでは十分に表しにくいため。
lexical_decisions:
- source_word: כָּל הַחַיָּה
  choice: すべての生き物
  rationale: חַיָּהはここでは野生動物だけでなく、後続する鳥・家畜・這うものを包括するため、広い意味を保つ表現とした。
- source_word: אֲשֶׁר אִתְּךָ
  choice: あなたと一緒にいる
  rationale: 先行する「すべての生き物」を修飾する関係節を、自然な現代日本語で表した。
- source_word: מִכָּל בָּשָׂר
  choice: あらゆる肉なるもののうち
  rationale: בָּשָׂרの「肉」という原語の比喩的・集合的表現を残しつつ、後続の列挙との関係を「のうち」で明確にした。
- source_word: בָּעוֹף
  choice: 鳥
  rationale: עוֹףは飛ぶ生き物を広く指し得るが、この動物分類の文脈では「鳥」が明瞭で自然である。
- source_word: וּבַבְּהֵמָה
  choice: 家畜
  rationale: בְּהֵמָהは特に大型の陸生動物や飼育動物を指し、この並びでは「家畜」が簡潔で分かりやすい。
- source_word: וּבְכָל הָרֶמֶשׂ הָרֹמֵשׂ עַל הָאָרֶץ
  choice: 地を這うすべてのもの
  rationale: 名詞רֶמֶשׂと同根の分詞רֹמֵשׂの反復を、日本語では「這うもの」とまとめて自然に表した。
- source_word: הוֹצֵא אִתָּךְ
  choice: あなたと一緒に外へ出しなさい
  rationale: יצאの使役形命令の力を「出しなさい」で示し、אִתָּךְを「あなたと一緒に」と明示した。
- source_word: וְשָׁרְצוּ
  choice: それらが…群がり
  rationale: שׁרץが表す多数の生き物の盛んな活動と繁殖の含みを「群がる」で具体的に表し、別訳を脚注に示した。
- source_word: בָאָרֶץ
  choice: 地に／地で
  rationale: 同じ語の反復を保ちながら、日本語の自然な格関係に合わせ、群がる場所には「に」、繁殖の場には「で」を用いた。
- source_word: וּפָרוּ וְרָבוּ
  choice: 子を生み、増える
  rationale: 創世記1章の創造の祝福を想起させる定型的な繁殖・増加の組み合わせを保ちつつ、生き物について自然に理解できる現代日本語とした。
theological_decisions:
- issue: 洪水後の創造の祝福への響き
  choice: 「群がり、地で子を生み、増える」とし、創世記1章の増殖の語彙を保つ。
  alternative: 「地上に広く行き渡り、大いに数を増す」のように一般化する。
  rationale: שׁרץ、פרה、רבהの組み合わせは創造時の祝福を意図的に響かせており、洪水後の再出発という文学的・神学的連関を、説明の付加なしに訳文へ反映するため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、「肉なるもの」に原文の集合的表現と聖書的な荘重さを残した。命令とその目的を二文に分け、長い列挙を読み取りやすくした。脚注記号[a]は該当する「群がり」の直後に置いた。
