revisions:
- from: 主はその芳しい香りを嗅がれ、心の中でこう言われた。「人のゆえに、わたしは二度と大地を呪わない。人の心が思い描くことは、若い時から悪いからだ。また、わたしがしたように、二度とすべての生き物を打つことはしない。」
  to: 主はその芳しい香りを嗅がれ、心の中でこう言われた。「人のゆえに、わたしは二度と大地を呪わない。人の心の傾きは、若い時から悪いからだ。また、わたしがしたように、二度とすべての生き物を打つことはしない。」
  rationale: 原文の二つの誓約的否定、理由節、内心での発言、および洪水に対応する「打つ」を維持した。「人の心が思い描くこと」だけを、יֵצֶרの企図・志向・傾向という意味をより包括的に伝える「人の心の傾き」へ改めた。
