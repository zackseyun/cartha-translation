  text: וַ/יָּ֣רַח יְהוָה֮ אֶת רֵ֣יחַ הַ/נִּיחֹחַ֒ וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל לִבּ֗/וֹ לֹֽא אֹ֠סִף לְ/קַלֵּ֨ל ע֤וֹד אֶת הָֽ/אֲדָמָה֙ בַּ/עֲב֣וּר הָֽ/אָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָ/אָדָ֛ם רַ֖ע מִ/נְּעֻרָ֑י/ו וְ/לֹֽא אֹסִ֥ף ע֛וֹד לְ/הַכּ֥וֹת אֶת כָּל חַ֖י כַּֽ/אֲשֶׁ֥ר עָשִֽׂיתִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/021.yaml
  text: And the LORD smelled the pleasing aroma, and the LORD said to himself, “I will never again curse the ground because of man, for the intention of man’s heart is evil from his youth. And I will never again strike down every living thing as I have done.”
translation:
  language: ja
  text: 主はその芳しい香りを嗅がれ、心の中でこう言われた。「人のゆえに、わたしは二度と大地を呪わない。人の心の傾きは、若い時から悪いからだ。また、わたしがしたように、二度とすべての生き物を打つことはしない。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: 主
  rationale: 神の固有名を、日本語聖書で広く理解される尊称「主」で表した。
- source_word: רֵיחַ הַנִּיחֹחַ
  choice: 芳しい香り
  rationale: 神に受け入れられる、心地よい香りという祭儀的表現を、自然で品位ある日本語にした。
- source_word: אֶל־לִבּוֹ
  choice: 心の中で
  rationale: 直訳的な身体語法を保ちつつ、内心での発言を示す自然な日本語とした。
- source_word: בַּעֲבוּר הָאָדָם
  choice: 人のゆえに
  rationale: 原因・理由を表す前置詞句の簡潔さを保った。「人」はここでは人類一般を指し得る。
- source_word: יֵצֶר לֵב הָאָדָם
  choice: 人の心が思い描くこと
  rationale: יֵצֶרの形成・企図・傾向という意味幅を踏まえ、固定的な教義用語にせず、心の内に形作られる思いを表した。
- source_word: מִנְּעֻרָיו
  choice: 若い時から
  rationale: 幼年期に限定せず、若年の時期を指す原語の幅を自然に表した。
- source_word: לְהַכּוֹת
  choice: 打つ
  rationale: 洪水による神の打撃・滅ぼしを表す動詞を過度に説明せず、その強さを保った。
- source_word: כָּל־חַי
  choice: すべての生き物
  rationale: 文脈上の生命あるもの全般を、通常の日本語で明瞭に表した。
theological_decisions:
- issue: 「人の心が思い描くこと」と洪水後の約束との論理関係
  choice: 「悪いからだ」と原文の理由節をそのまま保つ
  alternative: 「悪いけれども」など逆接として明示する
  rationale: כִּיは通常、理由を示す。神が人間の悪を裁きの理由ではなく今後の抑制を伴う約束の文脈で述べる緊張を、訳文で解消しなかった。
- issue: 神の内的発言
  choice: 「心の中でこう言われた」
  alternative: 「ご自分に言われた」
  rationale: לֵב（心）を保持し、神の内的決意としての表現を明示した。
- issue: 「二度と」の範囲
  choice: 大地を呪うことと、すべての生き物を打つことの各宣言に付す
  alternative: 洪水という方法に限定する説明を加える
  rationale: 原文は両節でלֹא אֹסִף עוֹדを反復する。約束の射程を訳者が狭めず、表面上の包括性を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発言には簡潔で荘重な調子を保った。「芳しい」「ゆえに」はやや格調のある語だが、一般読者にも理解可能で、祭儀的・宣言的な文脈に適している。
