  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/תָּבֹ֨א אֵלָ֤י/ו הַ/יּוֹנָה֙ לְ/עֵ֣ת עֶ֔רֶב וְ/הִנֵּ֥ה עֲלֵה זַ֖יִת טָרָ֣ף בְּ/פִ֑י/הָ וַ/יֵּ֣דַע נֹ֔חַ כִּי קַ֥לּוּ הַ/מַּ֖יִם מֵ/עַ֥ל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/011.yaml
  text: And the dove came to him at evening time[a], and behold, a freshly plucked olive leaf was in her mouth[c][b]. So Noah knew that the waters had subsided from upon the earth.
translation:
  language: ja
  text: 鳩は夕方、ノアのもとに来た[a]。見ると、そのくちばしには、摘み取ったばかりのオリーブの葉があった[b]。それでノアは、水が地の上から引いた[c]ことを知った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 文脈上は「ノアのもとに戻って来た」とも理解できる。ヘブライ語の動詞自体は「来た」を意味する。
    reason: lexical_alternative
  - marker: b
    text: 「摘み取ったばかりの」と訳したヘブライ語は、「ちぎり取られた、摘み取られた」という意味で、生きたオリーブの木から新しく取られた葉であることを示唆する。
    reason: lexical_alternative
  - marker: c
    text: 別訳「水が減った」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֵלָיו
  choice: ノアのもとに戻って来た
  rationale: 動詞בוא自体は「来た」だが、直前に放たれた鳩についての叙述なので、日本語では文脈上の帰還を自然に示す「戻って来た」とした。語そのものの直訳は脚注に残した。
- source_word: לְעֵת עֶרֶב
  choice: 夕方になると
  rationale: 「夕方の時に」を、時間の推移を自然に表す現代日本語にした。
- source_word: וְהִנֵּה
  choice: 見ると
  rationale: 注意と発見を促すהִנֵּהの生き生きした叙述機能を、古風すぎない日本語で表した。
- source_word: עֲלֵה זַיִת טָרָף
  choice: 摘み取ったばかりのオリーブの葉
  rationale: טָרָףが表す「ちぎられた、摘み取られた」という具体的意味と、それが新しく生木から取られたことを示す含意をともに伝えた。
- source_word: בְּפִיהָ
  choice: そのくちばしには
  rationale: 直訳は「その口に」だが、鳩について自然で具体的な日本語となるよう「くちばし」とした。
- source_word: וַיֵּדַע נֹחַ
  choice: それでノアは…知った
  rationale: 葉を見たことからノアが推論したという物語上のつながりを「それで」で明示した。
- source_word: קַלּוּ הַמַּיִם
  choice: 水が…引いた
  rationale: 洪水の水が減少したことを表す、日本語として最も自然な表現を採用した。
- source_word: מֵעַל הָאָרֶץ
  choice: 地の上から
  rationale: מֵעַלの空間的な「上から」の意味を保った。
theological_decisions: []
translation_notes:
  register: 明快で品位ある現代標準日本語。物語の発見の鮮やかさを「見ると」で保ち、過度に古風な「見よ」は避けた。生物としての自然な描写を優先して「口」ではなく「くちばし」とした。
