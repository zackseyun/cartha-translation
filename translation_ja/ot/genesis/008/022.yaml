source:
  edition: WLC
  text: עֹ֖ד כָּל יְמֵ֣י הָ/אָ֑רֶץ זֶ֡רַע וְ֠/קָצִיר וְ/קֹ֨ר וָ/חֹ֜ם וְ/קַ֧יִץ וָ/חֹ֛רֶף וְ/י֥וֹם וָ/לַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/022.yaml
  text: For as long as the earth endures[a], seedtime and harvest, cold and heat, summer and winter[b], and day and night shall not cease.
translation:
  language: ja
  text: 地の続くかぎり[a]、種まきと刈り入れ、寒さと暑さ、夏と冬、昼と夜は、絶えることがない。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「地のすべての日々の間」。
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹד כָּל יְמֵי הָאָרֶץ
  choice: 地の続くかぎり
  rationale: 直訳は「地のすべての日々の間なお」だが、将来にわたる継続期間を表す句として、自然な現代日本語で意味を明確にした。地が存続する期間という原文の限定も保っている。
- source_word: זֶרַע וְקָצִיר
  choice: 種まきと刈り入れ
  rationale: זֶרַע はここでは「種」という物ではなく、קָצִיר と対になる農作業・時期を指す。「種まきと刈り入れ」は対句を自然に伝える。
- source_word: קֹר וָחֹם
  choice: 寒さと暑さ
  rationale: 気候上の対照を表す二語を、簡潔で一般的な日本語の対として訳した。
- source_word: קַיִץ וָחֹרֶף
  choice: 夏と冬
  rationale: レバントの気候では乾季と雨季の含みもあり得るが、基本的な季節名としての通常の意味を採った。
- source_word: יוֹם וָלַיְלָה
  choice: 昼と夜
  rationale: 時の継続的な循環を示す定型的な対句を、そのまま自然な日本語で表した。
- source_word: לֹא יִשְׁבֹּתוּ
  choice: 絶えることがない
  rationale: שׁבת の「やむ、止まる」という意味を、列挙された営みや周期が継続する文脈に即して表した。「休まない」よりも日本語として自然である。
theological_decisions:
- issue: 創造世界の通常の周期に関する約束の範囲と期間
  choice: 地が存続するかぎり、その周期は絶えないという時間的限定を示す。
  alternative: これらの周期が無条件に永遠に続くという絶対的主張として訳す。
  rationale: כָּל יְמֵי הָאָרֶץ は文字どおり「地のすべての日々」であり、約束を地の存続期間に結びつけている。この限定を保ち、永遠性について原文以上の断定を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。三組の対句のリズムを維持し、古風すぎる語や教派特有の表現を避けた。
