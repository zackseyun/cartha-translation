base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/008.yaml
  text: Then he sent out the dove from him to see whether the waters had subsided from the surface of the ground[a][b].
translation:
  language: ja
  text: それからノアは、水が地面から引いたかどうかを見るため、自分のもとから鳩を放った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: それから……放った
  rationale: 物語を進めるワイイקטールの継起性を「それから」で自然に表し、鳥を外へ送り出す文脈では「放った」とした。
- source_word: הַיּוֹנָה
  choice: 鳩
  rationale: יוֹנָהは鳩・家鳩を指し得るが、洪水物語のこの場面では一般的で自然な「鳩」が適切。
- source_word: מֵאִתּוֹ
  choice: 自分のもとから
  rationale: ノアのいる所から離れるという原文の表現を保ち、「箱舟から」と明示して原文以上に限定することを避けた。
- source_word: לִרְאוֹת
  choice: 見るため
  rationale: ראהの不定詞が示す目的を直接的に訳した。文脈上は「確かめるため」も可能だが、原語との対応を優先した。
- source_word: הֲקַלּוּ
  choice: 引いたかどうか
  rationale: קללはここでは洪水の水が減少したことを表す。日本語では水について「引く」が明瞭で自然であり、疑問辞הֲを「かどうか」で表した。
- source_word: הַמַּיִם
  choice: 水
  rationale: ヘブライ語では複数形だが、日本語では洪水の水を集合的に単数の「水」とするのが自然。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 地面から
  rationale: 直訳的には「地面の面の上から」だが、日本語では水が地表から退くことを「地面から引く」と自然に表せる。אֲדָמָהはここでは地球全体より地面・土地を指す。
