revisions:
- from: しかし、鳩は足の裏を休める場所を見つけられなかったので、箱舟にいる彼のもとへ戻って来た。水が全地の表にあったからである。そこで彼は手を伸ばして鳩を取り、自分のもとへ、箱舟の中に入れた。
  to: しかし、鳩は足の裏を休める場所を見つけられなかったので、彼のもとへ、箱舟に戻って来た。水が全地の表面にあったからである。そこで彼は手を伸ばして鳩を取り、自分のいる箱舟の中へ連れて来た。
  rationale: 原文の因果関係、鳩が戻る先（彼と箱舟）、および彼が鳩を箱舟へ取り入れる動作を保持したまま、語順と空間表現を明瞭な現代標準日本語に整えた。「自分のいる」は、אֵלָיוとאֶל־הַתֵּבָהを日本語で無理なく統合するための文脈上明白な補足である。
