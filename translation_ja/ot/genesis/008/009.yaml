base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/009.yaml
  text: But the dove found no resting place for the sole of her foot[a], so she returned to him, to the ark, because the waters were on the surface of all the earth[d][c][b]. Then he stretched out his hand and took her and brought her to himself into the ark.
translation:
  language: ja
  text: しかし、鳩は足の裏を休める場所を見つけられなかったので、彼のもとへ、箱舟に戻って来た。水が全地の表面にあったからである。そこで彼は手を伸ばして鳩を取り、自分のいる箱舟の中へ連れて来た。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָנוֹחַ לְכַף רַגְלָהּ
  choice: 足の裏を休める場所
  rationale: מָנוֹחַの具体的な「休む場所」と、כַּף רֶגֶלの「足の裏」というヘブライ語の身体的なイメージを、自然な日本語でともに保持した。
- source_word: וַתָּשָׁב אֵלָיו אֶל־הַתֵּבָה
  choice: 箱舟にいる彼のもとへ戻って来た
  rationale: 「彼のもとへ」と「箱舟へ」の双方を落とさず、日本語として関係が明瞭になるように表現した。
- source_word: מַיִם עַל־פְּנֵי כָל־הָאָרֶץ
  choice: 水が全地の表にあった
  rationale: 「覆っていた」と意味を補いすぎず、עַל־פְּנֵיの「表に」という原文の空間的表現を保持した。
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: 手を伸ばして
  rationale: 「手を送る」というヘブライ語の慣用表現を、意味を保った自然な現代日本語にした。
- source_word: וַיִּקָּחֶהָ
  choice: 鳩を取り
  rationale: 目的語を日本語で明示しつつ、לקחの基本義「取る」を簡潔に訳した。
- source_word: וַיָּבֵא אֹתָהּ אֵלָיו אֶל־הַתֵּבָה
  choice: 自分のもとへ、箱舟の中に入れた
  rationale: אֵלָיו「自分のもとへ」とאֶל־הַתֵּבָה「箱舟の中へ」の二要素を保持し、移動の到達点が分かるようにした。
