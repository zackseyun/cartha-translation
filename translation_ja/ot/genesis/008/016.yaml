  yaml_path: translation/ot/genesis/008/016.yaml
  text: Come out of the ark[a], you and your wife, and your sons and your sons' wives with you.
translation:
  language: ja
  text: 「箱舟から出なさい。あなたも、あなたの妻も、息子たちも、息子たちの妻も、あなたと一緒に出なさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צֵא מִן הַתֵּבָה
  choice: 箱舟から出なさい
  rationale: יצאの男性単数命令形と、起点・内部からの移動を示すמןを、自然で明確な現代日本語の命令として表した。תֵּבָהは創世記の文脈で定着している「箱舟」とした。
- source_word: אַתָּה
  choice: あなたも
  rationale: 独立人称代名詞による明示性を保ちつつ、後続する家族との並列を日本語で自然に示すため助詞「も」を用いた。
- source_word: וְאִשְׁתְּךָ
  choice: あなたの妻も
  rationale: 所有接尾辞を明示し、この文脈でאִשָּׁהが配偶者を指すことを「妻」で正確に表した。
- source_word: וּבָנֶיךָ
  choice: 息子たちも
  rationale: בָּנִיםはここでは、直後にその妻たちが挙げられる男性の子らを指すため、「子どもたち」ではなく「息子たち」とした。
- source_word: וּנְשֵׁי בָנֶיךָ
  choice: 息子たちの妻たちも
  rationale: ヘブライ語の「あなたの息子たちの妻たち」という関係を直接保った。「嫁たち」より意味が明瞭で、原文の構造にも近い。
- source_word: אִתָּךְ
  choice: あなたと一緒に
  rationale: 一行全体に伴同行為を添える前置詞句として訳した。文脈上、ノアに対する呼びかけであることは明白である。
