source:
  edition: WLC
  text: וַ/תָּ֤נַח הַ/תֵּבָה֙ בַּ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י בְּ/שִׁבְעָה עָשָׂ֥ר י֖וֹם לַ/חֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/008/004.yaml
  text: And in the seventh month[a], on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.
translation:
  language: ja
  text: 第七の月、その月の十七日に、箱舟はアララトの山々[a]の上にとどまった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「アララトの山々」と複数形。この表現は山岳地域を指し、今日「アララト山」と呼ばれる一つの峰に限定してはいない。
    reason: 原文の複数形と地理的範囲を明確にするため。
lexical_decisions:
- source_word: וַתָּנַח
  choice: とどまった
  rationale: 動詞 נוח の出来事としての意味を自然な日本語で表し、箱舟が漂う状態から一定の場所に落ち着いたことを示す。
- source_word: הַתֵּבָה
  choice: 箱舟
  rationale: ノアの תֵּבָה を指す、日本語聖書で定着した明瞭な訳語。原語は箱状の容器を指し得るが、この文脈では「箱舟」が適切である。
- source_word: בַּחֹדֶשׁ הַשְּׁבִיעִי
  choice: 第七の月
  rationale: 月を序数で示すヘブライ語の暦表現を簡潔に保持する。
- source_word: בְּשִׁבְעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: その月の十七日に
  rationale: 原文が「月」を繰り返す日付表現を、明瞭で自然な現代日本語にした。
- source_word: עַל
  choice: の上に
  rationale: 単純な場所関係を示す前置詞として訳し、箱舟が山地にとどまったことを表す。
- source_word: הָרֵי אֲרָרָט
  choice: アララトの山々
  rationale: הָרֵי は複数形の連語形であり、単独の峰ではなくアララトに属する山々、すなわち山地を指す表現として訳した。
theological_decisions:
- issue: 地理的表現 הָרֵי אֲרָרָט
  choice: アララトの山々
  alternative: アララト山
  rationale: 原文は「山」の複数形であるため、伝統的な単数の固有峰名に限定せず、本文が持つ地理的な広がりを保った。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「第七の月、その月の十七日に」として原文の日付表現の反復を自然に残し、「アララトの山々」で複数形を明示した。
