  yaml_path: translation/ot/genesis/008/010.yaml
  text: Then he waited another seven days[a], and again sent out the dove from the ark.
translation:
  language: ja
  text: それからノアは、さらに七日待ち[a]、再び鳩を箱舟から放った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「それからノアは、さらに七日の待ちを始めた」。ヘブライ語の動詞は、より字義的には「始めた」とも取れるが、ここでは慣用的に「待った」という意味で用いられている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחֶל
  choice: 待ち
  rationale: 時間表現「さらに七日」と結びつくこの文脈では、語根のより字義的な意味「始める」よりも、次の行動まで「待つ」という慣用的な意味が自然である。
- source_word: עוֹד שִׁבְעַת יָמִים אֲחֵרִים
  choice: さらに七日
  rationale: עוֹד と אֲחֵרִים が、先の期間に加わるもう一つの七日間であることを示す。「さらに七日」は重複を避けつつ追加の期間を明確に表す。
- source_word: וַיֹּסֶף שַׁלַּח
  choice: 再び…放った
  rationale: וַיֹּסֶף と後続動詞の組み合わせは、同じ行為をもう一度行うことを表す。鳩を箱舟の外へ送り出す場面なので、日本語では「再び…放った」が自然である。
- source_word: הַיּוֹנָה
  choice: 鳩
  rationale: すでに物語に登場している特定の鳩を指す。日本語では文脈上、定冠詞を特に訳出しなくても特定性が保たれる。
- source_word: מִן הַתֵּבָה
  choice: 箱舟から
  rationale: ノア物語の תֵּבָה は慣用的かつ適切に「箱舟」と訳され、前置詞 מִן は出発点を示す「から」とした。
