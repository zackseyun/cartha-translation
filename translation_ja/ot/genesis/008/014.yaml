  text: And in the second month[a], on the twenty-seventh day of the month, the earth was dry.
translation:
  language: ja
  text: 第二の月の二十七日には、地は乾いていた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「陸地は乾いていた」とも訳せる。ヘブライ語の אֶרֶץ は「地」「陸地」「土地」を意味しうる。ここでは洪水物語の広い視野に合わせて「地」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשֵּׁנִי
  choice: 第二の月の
  rationale: 接続詞וと前置詞בによる時間の進行は、日本語では独立した「そして」を置かず、日付表現全体と「なると」で自然に示した。「第二の月」は原文の序数をそのまま保つ。
- source_word: בְּשִׁבְעָה וְעֶשְׂרִים יוֹם לַחֹדֶשׁ
  choice: 二十七日になると
  rationale: ヘブライ語の標準的な日付表現を、明瞭な現代日本語にした。「になると」により、その時点で確認された状態へ自然につなぐ。
- source_word: יָבְשָׁה
  choice: 乾いていた
  rationale: יָבְשָׁהは女性単数の完了形で、ここではその時点における結果的な状態を表す。「乾いた」よりも「乾いていた」が状態性を自然に伝える。
- source_word: הָאָרֶץ
  choice: 地
  rationale: אֶרֶץには「地」「陸地」「土地」などの意味がある。洪水物語の広い射程を保ちつつ、日本語で過度に現代的な惑星概念へ限定しない「地」を採用した。
