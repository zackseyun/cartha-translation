source:
  edition: WLC
  text: וּ/בְנֵ֣י מִדְיָ֗ן עֵיפָ֤ה וָ/עֵ֨פֶר֙ וַ/חֲנֹ֔ךְ וַ/אֲבִידָ֖ע וְ/אֶלְדָּעָ֑ה כָּל אֵ֖לֶּה בְּנֵ֥י קְטוּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/004.yaml
  text: And the sons of Midian were Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.
translation:
  language: ja
  text: ミディアンの息子たちは、エファ、エフェル、ハノク[a]、アビダ、エルダアであった。これらは皆、ケトラの息子たちであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ハノク」は、伝統的に「エノク」とも表記される。
    reason: ヘブライ語の音に近い表記と、日本語聖書で見られる伝統的表記との違いを示すため。
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: ミディアンの息子たちは
  rationale: 接続詞を文脈上自然に受けつつ、בְּנֵי の男性複数形と系譜上の意味を「息子たち」で明確に表した。
- source_word: עֵיפָה
  choice: エファ
  rationale: ヘブライ語の固有名を、現代日本語で読みやすい形に音写した。
- source_word: וָעֵפֶר
  choice: エフェル
  rationale: 接続詞は日本語の列挙に吸収し、固有名 עֵפֶר を音写した。
- source_word: וַחֲנֹךְ
  choice: ハノク[a]
  rationale: חֲנֹךְ のヘブライ語音に近い「ハノク」を採用し、伝統的な別表記は脚注に示した。
- source_word: וַאֲבִידָע
  choice: アビダ
  rationale: 固有名 אֲבִידָע を簡潔に音写した。
- source_word: וְאֶלְדָּעָה
  choice: エルダア
  rationale: 固有名 אֶלְדָּעָה の語末母音を保って音写した。
- source_word: כָּל אֵלֶּה
  choice: これらは皆
  rationale: 列挙された全員を総括するヘブライ語の意味を、自然な現代日本語で表した。
- source_word: בְּנֵי קְטוּרָה
  choice: ケトラの息子たちであった
  rationale: 系譜の定型表現を保ち、挙げられた人物がケトラの子孫であることを直接示した。
theological_decisions: []
translation_notes:
  register: 簡潔な系譜文として、原文の反復構造を保ちながら、明瞭で格調ある現代標準日本語にした。列挙には日本語の読点を用いた。英語相談訳では脚注記号が「Ephah」に付いているが、脚注内容は חֲנֹךְ（Hanoch）について述べているため、日本語本文では該当する「ハノク」に付した。
