  yaml_path: translation/ot/genesis/025/033.yaml
  text: And Jacob said[b][a], “Swear to me today.” So he swore to him and sold his birthright to Jacob.
translation:
  language: ja
  text: ヤコブは言った。「今日[a]、私に誓いなさい。」そこでエサウは彼に誓い、自分の長子としての権利[b]をヤコブに売った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「この日、私に誓いなさい」。または「今日付で、私に誓いなさい」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「長子としての権利」とは、第一子の男子に属する身分と諸権利を指す。
    reason: cultural_note
lexical_decisions:
- source_word: הִשָּׁבְעָה לִּי
  choice: 私に誓いなさい
  rationale: 命令形と誓約の相手を明確にし、ヤコブの直接的な要求を自然な現代日本語で表す。
- source_word: כַּיּוֹם
  choice: 今ここで
  rationale: 単なる日付としての「今日」よりも、この場で直ちに誓うよう求める文脈上の切迫感を自然に伝える。字義的な別訳は脚注に残す。
- source_word: וַיִּשָּׁבַע לוֹ
  choice: 彼に誓い
  rationale: 命令の「誓いなさい」と同じ語根の反復を保ち、誓いの相手がヤコブであることを示す。
- source_word: וַיִּמְכֹּר
  choice: 売った
  rationale: מכר の取引的な意味をそのまま保持し、単なる放棄や譲渡へ弱めない。
- source_word: בְּכֹרָתוֹ
  choice: 自分の長子の権利
  rationale: 第一子であることに伴う身分と諸権利を指す語であり、日本語で意味が直ちに分かる表現を採る。
- source_word: לְיַעֲקֹב
  choice: ヤコブに
  rationale: 売却による受け手を自然な日本語で示す。
theological_decisions:
- issue: エサウによるבְּכֹרָהの移転の性質
  choice: 自分の長子の権利をヤコブに売った
  alternative: 自分の長子としての身分をヤコブに売った
  rationale: 本文は第一子に属する法的・家族的特権を取引によって移したと述べる。「権利」はその具体性を保ちつつ、後代の教理的解釈を持ち込まない。
translation_notes:
  register: 明快で現代的ながら、物語本文にふさわしい簡潔で品位ある文体。「そこで」によりヘブライ語の連続する出来事を自然に示し、主語が曖昧にならないよう応答者を「エサウ」と明示した。
