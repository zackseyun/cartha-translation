  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֶּעְתַּ֨ר יִצְחָ֤ק לַֽ/יהוָה֙ לְ/נֹ֣כַח אִשְׁתּ֔/וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַ/יֵּעָ֤תֶר ל/וֹ֙ יְהוָ֔ה וַ/תַּ֖הַר רִבְקָ֥ה אִשְׁתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/021.yaml
  text: And Isaac prayed to Yahweh for his wife[a], because she was barren. And Yahweh answered him[b], and Rebekah his wife conceived.
translation:
  language: ja
  text: イサクは妻のために[a]ヤハウェに祈った。妻が不妊だったからである。ヤハウェは彼の祈りを聞き入れ[b]、妻リベカは身ごもった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「妻の向かいで」または「妻の前で」とも取れる。ここでは、妻に関して、あるいは妻のために祈ったという意味。
    reason: lexical_alternative
  - marker: b
    text: 「祈った」と「祈りを聞き入れ」には、ヘブライ語で同じ語根が用いられている。
    reason: lexical_wordplay
lexical_decisions:
- source_word: וַיֶּעְתַּר / וַיֵּעָתֶר（עתר）
  choice: 祈った／彼の祈りを聞き入れ
  rationale: 同じ語根を能動形と受動形で反復する原文の対応を、日本語として自然な表現で示した。「祈願した／祈願を受け入れられた」のような形式的一致は不自然になるため避け、脚注で語根の反復を明示した。
- source_word: לַיהוָה / יְהוָה
  choice: ヤハウェ
  rationale: 原文の神名四文字を固有名として音写し、一般名詞の「主」と区別した。
- source_word: לְנֹכַח אִשְׁתּוֹ
  choice: 妻のために
  rationale: לְנֹכַח の基本義は「向かいに、面前で」だが、この文脈では妻に関して、または妻のために祈ることを表すと理解できる。本文では自然な「妻のために」とし、字義的可能性を脚注に残した。
- source_word: עֲקָרָה
  choice: 不妊だった
  rationale: 妊娠できない状態を簡潔かつ明確に表し、単に子がいないという結果だけを述べる表現を避けた。
- source_word: וַתַּהַר
  choice: 身ごもった
  rationale: 妊娠したことを、物語文にふさわしい自然で品位ある現代日本語で表した。
- source_word: רִבְקָה
  choice: リベカ
  rationale: 日本語聖書で広く定着したヘブライ語人名の表記を用いた。
theological_decisions:
- issue: עתר の反復と神の応答の表現
  choice: 「祈った／彼の祈りを聞き入れ」と訳す
  alternative: 「願い求めた／願い求められるままになった」と形式的に対応させる
  rationale: 神が機械的に動かされたという含みを避けつつ、祈りに対する神の応答を明確にした。原文の語根反復は脚注で保持した。
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主
  rationale: 本文に明記された固有の神名を音写し、原文上の区別を保持した。
- issue: לְנֹכַח が示す妻との位置または関係
  choice: 妻のために
  alternative: 妻と向かい合って／妻の前で
  rationale: 文脈上もっとも自然な代理・関係の意味を本文に採りつつ、空間的な読みの可能性を脚注で保持した。
translation_notes:
  register: 明瞭な現代標準日本語による簡潔な物語文。「不妊」は意味の正確さを優先し、「身ごもった」で叙事的な品位を保った。文頭の接続詞 וַ は、日本語で反復すると冗長になるため逐語的には再現していない。
