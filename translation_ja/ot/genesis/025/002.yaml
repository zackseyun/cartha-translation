  text: And she bore him Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah.
translation:
  language: ja
  text: 彼女は彼との間に、ジムラン、ヨクシャン、メダン、ミディアン、イシュバク、シュアを産んだ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: 語根 ילד のカル・ワイイクトル三人称女性単数形。系譜の簡潔な叙述として、女性主語による出産を自然な現代日本語で表す。
- source_word: לוֹ
  choice: 彼に
  rationale: לְ＋三人称男性単数接尾辞は、ここでは子らの父を示す。「彼のために」などの目的性を加えず、原文の関係を保つ。
- source_word: אֶת
  choice: 訳語を置かない
  rationale: 各人名を導く目的語標識であり、日本語では目的格助詞「を」による通常の構文で機能を表す。
- source_word: זִמְרָן
  choice: ジムラン
  rationale: ヘブライ語の人名を日本語で慣用的に音写した。
- source_word: יָקְשָׁן
  choice: ヨクシャン
  rationale: ヘブライ語のヨードと子音配列を反映しつつ、日本語の聖書人名として読みやすく音写した。
- source_word: מְדָן
  choice: メダン
  rationale: ヘブライ語の人名を簡潔に音写した。
- source_word: מִדְיָן
  choice: ミディアン
  rationale: ヘブライ語の人名を、日本語で広く通用する形に音写した。
- source_word: יִשְׁבָּק
  choice: イシュバク
  rationale: ヘブライ語の人名を日本語として発音しやすい形で音写した。
- source_word: שׁוּחַ
  choice: シュア
  rationale: 語末の喉音を独立したカ行音として過度に表さず、日本語の慣用的な聖書人名の形で音写した。
