  source_fidelity: 「息を引き取って死んだ」は וַיִּגְוַע と וַיָּמָת の重ねを適切に表している。「満ち足りていた」も שָׂבֵעַ の意味域を保ち、原文にない「日々」を補わない点で適切である。一方、「加えられた」は וַיֵּאָסֶף（集められた／集め加えられた）の「集める」という比喩を十分には表さないため、「集められた」とするのがより忠実である。また「幸いな老年を迎え」は死の時点の状態を表す בְּשֵׂיבָה טוֹבָה をやや出来事として言い換えるため、「恵まれた老年に達し」とした。
