  text: וַ/יִּגְוַ֨ע וַ/יָּ֧מָת אַבְרָהָ֛ם בְּ/שֵׂיבָ֥ה טוֹבָ֖ה זָקֵ֣ן וְ/שָׂבֵ֑עַ וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/008.yaml
  text: And Abraham breathed his last and died in a good old age[a], old and full[b], and he was gathered to his people.
translation:
  language: ja
  text: アブラハムは、恵まれた老年に達し、年老いて満ち足り、息を引き取って死んだ。[a] そして、自分の民のもとに集められた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「満ち足り」は、「十分に満たされていた」「満足していた」とも訳せる。ヘブライ語原文には「日々」に当たる語はない。
    reason: lexical_alternative
  - marker: b
    text: 「自分の民のもとに集められた」は、死について用いられるヘブライ語の伝統的な定型句。死んだ親族との結びつきを含意する可能性はあるが、具体的に何を指すかはこの表現自体では明示されていない。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגְוַע
  choice: 息を引き取って
  rationale: 死の叙述における גוע の慣用的な意味を自然な現代日本語で表し、続く「死んだ」と区別しつつ原文の重ねた表現を保った。
- source_word: וַיָּמָת
  choice: 死んだ
  rationale: מות の直接的で標準的な意味を、婉曲化せずに訳した。
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: 幸いな老年を迎え
  rationale: שֵׂיבָה（老年）と טוֹבָה（良い、幸いな）の双方を保ち、「良い老年」という不自然な直訳を避けた。前置詞 ב は、死んだ時の境遇を示す表現として訳した。
- source_word: זָקֵן
  choice: 年老いて
  rationale: 独立した形容を省略せず、原文が老年を重ねて描く語調を保った。
- source_word: וְשָׂבֵעַ
  choice: 満ち足りていた
  rationale: שׂבע の「満ちている、満足している」という幅を保った。「日々に満ちて」とはせず、原文にない「日々」を補わなかった。
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: こうして、自分の民のもとに加えられた
  rationale: 受動形と「自分の民のもとへ」という死の定型句を保ち、埋葬または死後の再会のいずれかに限定しなかった。
- source_word: עַמָּיו
  choice: 自分の民
  rationale: 「先祖」や「親族」に狭めず、עם の集団的・親族的な含みを残した。
theological_decisions:
- issue: 「自分の民のもとに加えられた」の意味
  choice: 死に関するヘブライ語の定型句を、その曖昧さを保って訳す。
  alternative: 一族の墓への埋葬、死者となった親族との再会、または意識ある死後存在を明示する。
  rationale: 本文だけでは、この句が埋葬の仕方を指すのか、死者との結びつきを指すのかを一義的に決められないため。
translation_notes:
  register: 明快で現代的ながら、死の叙述にふさわしい簡潔で重みのある文体とした。原文の「息を引き取った／死んだ」および「老年／年老いて」という重ねた表現を残し、語順は日本語として読みやすい形に整えた。
