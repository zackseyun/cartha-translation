revisions:
- from: アブラハムは息を引き取って死んだ。彼は幸いな老年を迎え、年老いて満ち足りていた。[a] こうして、自分の民のもとに加えられた。[b]
  to: アブラハムは、恵まれた老年に達し、年老いて満ち足り、息を引き取って死んだ。[a] そして、自分の民のもとに集められた。[b]
  rationale: 本文は原文の「息を引き取る／死ぬ」と「老年／年老いて」という重ねを保つ。「恵まれた老年に達し」は、良い老年という肯定的評価を自然な日本語で示しつつ、死の際の状態として述べる。「集められた」により、死の定型句の語彙的な核と、埋葬・死者との再会・死後のあり方のいずれにも限定しない曖昧さを保った。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:48:28Z'
