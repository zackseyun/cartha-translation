source:
  edition: WLC
  text: וְ/אֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַ/מִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְ/אַבְרָהָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/012.yaml
  text: These are the generations of Ishmael[a], Abraham’s son, whom Hagar the Egyptian, Sarah’s servant woman[b], bore to Abraham.
translation:
  language: ja
  text: これは、アブラハムの子イシュマエル[a]の系譜である。イシュマエルは、サラの女奴隷[b]であるエジプト人ハガルが、アブラハムとの間に産んだ子である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イシュマエルの子孫」または「イシュマエルの家系」とも訳せる。ヘブライ語「トレドート」は創世記で繰り返される見出し語で、系譜だけでなく、由来やその後の歴史を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: 「サラの女中」とも訳されてきた。ヘブライ語は、自由な雇い人ではなく、隷属する身分の女性を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: これは
  rationale: וְの文脈をつなぐ働きは日本語では必ずしも接続詞として明示する必要がないため、創世記の新しい系譜区分を自然に導入する「これは」とした。
- source_word: תֹּלְדֹת
  choice: 系譜
  rationale: 創世記で繰り返される構成上の見出し語であり、ここでは後代の子孫の一覧を導くため「系譜」が自然である。「由来」「歴史」「子孫」の含みもあり得るので脚注で示した。
- source_word: יִשְׁמָעֵאל בֶּן אַבְרָהָם
  choice: アブラハムの子イシュマエル
  rationale: 系譜上の父子関係を、明瞭で自然な日本語の連体表現で示した。
- source_word: אֲשֶׁר יָלְדָה
  choice: 彼は……ハガルが……産んだ子である
  rationale: 動詞は女性単数形でハガルを主語とする。日本語では関係節を長く重ねず、イシュマエルを受ける「彼」を用いて二文目にし、母が産んだことを明示した。
- source_word: הָגָר הַמִּצְרִית
  choice: エジプト人ハガル
  rationale: ハガルの出身・民族的呼称を簡潔な同格表現で示した。
- source_word: שִׁפְחַת שָׂרָה
  choice: サラの女奴隷
  rationale: שִׁפְחָהが表す隷属身分を、「女中」などの弱めた語ではなく、現代日本語で明確に伝える表現を選んだ。
- source_word: לְאַבְרָהָם
  choice: アブラハムとの間に
  rationale: ילדと共に用いられ、アブラハムを父とする出産関係を示す。逐語的な「アブラハムに産んだ」より自然な日本語とした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。創世記の定型見出しとして「系譜である」を用い、長い関係節は二文に分けた。隷属身分は婉曲化せず「女奴隷」とした。
