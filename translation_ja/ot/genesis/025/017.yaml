  text: וְ/אֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּ/שְׁלֹשִׁ֥ים שָׁנָ֖ה וְ/שֶׁ֣בַע שָׁנִ֑ים וַ/יִּגְוַ֣ע וַ/יָּ֔מָת וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/017.yaml
  text: 'These were the years of Ishmael’s life: one hundred and thirty-seven years[a]. And he breathed his last and died[b], and was gathered to his people.'
translation:
  language: ja
  text: イシュマエルが生きた年月は、百三十七年であった。彼は息を引き取り[a]、死んで、自分の民のもとに集められた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「息を引き取り」と訳したヘブライ語動詞は、続く「死んで」とは別の語である。原文に二つの死を表す動詞が並ぶため、両方を訳した。
    reason: lexical_alternative
  - marker: b
    text: 「自分の民のもとに集められた」は、死の記事で用いられるヘブライ語の慣用表現。先祖たちとの再会、一族と共に葬られること、またはその両方を指す可能性がある。
    reason: cultural_note
lexical_decisions:
- source_word: וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל
  choice: イシュマエルが生きた年月は
  rationale: 直訳的な「イシュマエルの生涯の年数」を、意味を保ちながら自然な現代日本語にした。文脈上、וְאֵלֶּה は寿命を総括する導入として表現した。
- source_word: מְאַת שָׁנָה וּשְׁלֹשִׁים שָׁנָה וְשֶׁבַע שָׁנִים
  choice: 百三十七年
  rationale: ヘブライ語の数の連なりを、日本語の標準的な数表現にまとめた。
- source_word: וַיִּגְוַע
  choice: 彼は息を引き取り
  rationale: 死を表す גוע の「息絶える」という含みを示し、直後の וַיָּמָת「死んで」と区別して両方を訳出した。
- source_word: וַיָּמָת
  choice: 死んで
  rationale: 先行する גוע と重なるように見えても、原文が二つの異なる動詞を連ねているため省略しなかった。
- source_word: וַיֵּאָסֶף אֶל־עַמָּיו
  choice: 自分の民に加えられた
  rationale: 創世記の死の記事に見られる定型的なヘブライ語表現を保持し、埋葬か死後の先祖との合流かを訳文で限定しなかった。
theological_decisions:
- issue: 「自分の民に加えられた」という死の定型句の意味
  choice: 慣用表現をそのまま保持する
  alternative: 一族の墓に葬られた／死後に先祖たちと合流した
  rationale: ヘブライ語は、親族と共に葬られること、死後に先祖のもとへ行くこと、またはその両方を含み得る。訳文では一つに決めず、原文の含みを残した。
translation_notes:
  register: 明瞭で落ち着いた現代標準日本語とした。死を表す二動詞の重なりと、最後の慣用句が持つ解釈上の幅を保っている。
