  text: וַ/יֹּ֨אמֶר יְהוָ֜ה לָ֗/הּ שְׁנֵ֤י גיים בְּ/בִטְנֵ֔/ךְ וּ/שְׁנֵ֣י לְאֻמִּ֔ים מִ/מֵּעַ֖יִ/ךְ יִפָּרֵ֑דוּ וּ/לְאֹם֙ מִ/לְאֹ֣ם יֶֽאֱמָ֔ץ וְ/רַ֖ב יַעֲבֹ֥ד צָעִֽיר׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/023.yaml
  text: And Yahweh said to her[a], “Two nations are in your womb, and two peoples will be separated from within you; and one people will be stronger than the other[b], and the older will serve the younger.”
translation:
  language: ja
  text: 'ヤハウェは彼女に言った。


    「二つの国があなたの胎内にあり、

    二つの民があなたの内から分かれ出る。

    一方の民は他方の民より強くなり、

    年長の者が年下の者に仕える[a]。」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「大いなる者が若い者に仕える」。
    reason: ヘブライ語の רַב と צָעִיר は、この双子の文脈では「年長の者／年下の者」と理解できる一方、年齢だけでなく大小・優劣を含む対比としても読める。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を称号に置き換えず、一般的な日本語音写で表した。
- source_word: שְׁנֵי גיים
  choice: 二つの国民
  rationale: גוי の政治的・民族的集団という意味を表し、並行する לְאֻמִּים と語を分けた。
- source_word: בְּבִטְנֵךְ
  choice: あなたの胎内に
  rationale: 妊娠の文脈に即して בטן を自然かつ明確に訳した。
- source_word: שְׁנֵי לְאֻמִּים
  choice: 二つの民
  rationale: 民族共同体を指す語として訳し、前行との同義的並行を保った。
- source_word: מִמֵּעַיִךְ יִפָּרֵדוּ
  choice: あなたの内から分かれていく
  rationale: מֵעֶה の身体内部という像と、פרד のニファル形が示す分離を、自然な日本語で表した。
- source_word: וּלְאֹם מִלְאֹם יֶאֱמָץ
  choice: 一方の民は他方の民より強くなり
  rationale: 二つの民の比較関係と、אמץ の強さを増す・優勢になる意味を明確にした。
- source_word: וְרַב יַעֲבֹד צָעִיר
  choice: 年長の者が年下の者に仕える
  rationale: 双子についての文脈では רַב と צָעִיר を年齢差として理解するのが自然であり、עבד の広い意味を「仕える」で保持した。
theological_decisions:
- issue: וְרַב יַעֲבֹד צָעִיר における רַב と צָעִיר の解釈
  choice: 年長の者が年下の者に仕える
  alternative: 大きい者が小さい者に仕える
  rationale: 胎内の双子という文脈から年齢上の対比を本文に採った。ただし、形容詞には身分・力・重要性の大小を表す余地もあるため、より字義的な読みを脚注に残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神託にふさわしい簡潔で格調ある詩的な改行を保った。「国民」と「民」を使い分け、原文の同義的並行を示した。
