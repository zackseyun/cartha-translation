base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/031.yaml
  text: Jacob said[a], “Sell me your birthright today.”
translation:
  language: ja
  text: ヤコブは言った。「今日、あなたの長子の権利を私に売ってくれ[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「今日付で、あなたの長子の権利を私に売ってくれ」、または「今すぐ、あなたの長子の権利を私に売ってくれ」とも訳せる。直ちに成立し、拘束力を持つ取引であることを強調する表現とも考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ継続法を、自然な現代日本語の過去形で表した。
- source_word: יַעֲקֹב
  choice: ヤコブ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: מִכְרָה
  choice: 売ってくれ
  rationale: 動詞 מכר の命令形。日本語では文脈に即した直接的な要求として自然に表現した。語末の ה はここで別個に訳出する必要がない。
- source_word: כַיּוֹם
  choice: 今日
  rationale: 「今日」「今日付で」「今すぐ」の含みを持ちうる。本文では簡潔で自然な「今日」とし、取引の即時性・拘束性の可能性を脚注に残した。
- source_word: אֶת
  choice: 訳出しない
  rationale: 定目的語を示す標識であり、日本語では独立した語として訳さない。
- source_word: בְּכֹרָתְךָ
  choice: あなたの長子の権利
  rationale: 長子としての地位に伴う権利・特権を指す。「長子の権利」は意味を明示しつつ、聖書語としても理解しやすい。
- source_word: לִי
  choice: 私に
  rationale: 売却の相手を示す前置詞付き代名詞を、自然かつ明確に「私に」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、族長物語にふさわしい簡潔で品位ある語調とした。命令形は過度に粗暴にせず、明確な要求として「売ってくれ」と訳した。
