  text: וַ/יִּתְרֹֽצֲצ֤וּ הַ/בָּנִים֙ בְּ/קִרְבָּ֔/הּ וַ/תֹּ֣אמֶר אִם כֵּ֔ן לָ֥/מָּה זֶּ֖ה אָנֹ֑כִי וַ/תֵּ֖לֶךְ לִ/דְרֹ֥שׁ אֶת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/022.yaml
  text: And the children struggled together within her[a], and she said, “If it is so, why am I like this?” So she went to inquire of Yahweh.
translation:
  language: ja
  text: 子どもたちは彼女の胎内でぶつかり合った。彼女は言った。「もしそうなら、私はなぜこのようなのだろう[a]。」それから彼女は、ヤハウェに尋ねるために出かけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は省略のある表現で、直訳すれば「なぜ、これが私なのか」のようになる。「なぜ私は（このような状態にあるのか）」とも理解できる。
    reason: 原文の לָמָּה זֶּה אָנֹכִי がもつ統語的な省略と、その解釈上の曖昧さを、字義訳と実存的解釈とを混同せずに示すため。
lexical_decisions:
- source_word: וַיִּתְרֹצֲצוּ
  choice: 激しくぶつかり合った
  rationale: 再帰・相互的な語形が表す、胎内の二人の激しい衝突を自然な日本語で示す。「押し合った」より強さを保ちつつ、「互いに押しつぶした」と断定するほどには意味を限定しない。
- source_word: הַבָּנִים
  choice: 子どもたち
  rationale: 語は「息子たち」を意味し得るが、出生前の場面では「子どもたち」が自然であり、次節で明らかになる男性であることも否定しない。
- source_word: בְּקִרְבָּהּ
  choice: 彼女の内で
  rationale: 直訳的には「彼女の内部で」。文脈上は胎内を指すが、原文にない「胎」を明示せず、身体内部の意味を保った。
- source_word: אִם כֵּן
  choice: こんなことなら
  rationale: リベカが苦しい状態を受けて発する条件的な嘆きを、現代日本語として自然に表す。
- source_word: לָמָּה זֶּה אָנֹכִי
  choice: どうして私はこうなのだろう
  rationale: 原文は省略のある難解な表現。「なぜ私は存在するのか」と決めつけず、妊娠中の異常な苦しみに対する問いとして読める形にし、別の可能性は注で示した。
- source_word: לִדְרֹשׁ אֶת יְהוָה
  choice: ヤハウェに伺いを立てる
  rationale: דרשが人を目的語に取るこの文脈では、神託や導きを求めて尋ねる意味。「求める」より具体的で、物語の宗教的行為を自然に示す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、固有名として日本語で音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 本文は称号ではなく神名四文字を用いているため、固有名として音写し、原文上の区別を保った。
- issue: リベカの嘆き לָמָּה זֶּה אָנֹכִי の解釈
  choice: どうして私はこうなのだろう
  alternative: なぜ私は存在するのか／なぜ私は
  rationale: 原文の省略性と神学的・実存的な響きを一義的に解消せず、文脈に合う自然な本文訳と注記を組み合わせた。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、物語本文にふさわしい落ち着いた格調を保った。「伺いを立てる」は神意を尋ねる行為を一般読者にも伝える表現。
