  text: Hadad[a], Tema, Jetur, Naphish, and Kedemah.
translation:
  language: ja
  text: ハダド、テマ、エトル、ナフィシュ、ケデマ。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲדַד
  choice: ハダド
  rationale: 系図に挙げられた固有名として、マソラ本文の子音に即して音写した。
- source_word: תֵימָא
  choice: テマ
  rationale: 固有名としてヘブライ語の発音に近い、簡潔で一般的な日本語表記を採用した。英語表記上の語末 h の有無は日本語訳には関係しないため、注記しない。
- source_word: יְטוּר
  choice: エトル
  rationale: 固有名として、日本語聖書で理解しやすい慣用的な音写を採用した。
- source_word: נָפִישׁ
  choice: ナフィシュ
  rationale: 固有名として音写し、語末の שׁ を「シュ」で表した。
- source_word: קֵדְמָה
  choice: ケデマ
  rationale: 固有名として音写し、日本語として自然に読める形にした。
- source_word: וְ / וָ
  choice: 読点による列挙
  rationale: ヘブライ語では接続詞で名が連ねられているが、日本語では各項目を読点で並べるのが自然であり、列挙関係も明瞭である。
