base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/026.yaml
  text: Afterward his brother came out[a], and his hand was grasping Esau’s heel, so his name was called Jacob. And Isaac was sixty years old when they were born.
translation:
  language: ja
  text: その後、彼の兄弟が出てきた。その手はエサウのかかとをつかんでいた。そして、その子はヤコブ[a]と名づけられた。二人が生まれた時、イサクは六十歳であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ヤコブ」という名は、ヘブライ語で「かかと」を意味する語と音が似ており、後には「出し抜く」という語との語呂合わせにも用いられる。
    reason: ヤコブの名と「かかと」とのヘブライ語の語音上の関連、および後の物語で展開される含意は、日本語訳だけでは伝わらないため。
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: その後
  rationale: 先に記されたエサウの誕生に続く時間的順序を、簡潔で自然な現代日本語で表す。
- source_word: יָצָא אָחִיו
  choice: 弟が出てきた
  rationale: יָצָא の「出る」という具体的な描写を保つ。אָחִיו は直訳すれば「彼の兄弟」だが、先に生まれたエサウとの関係を日本語で自然に示すため「弟」とした。
- source_word: וְיָדוֹ אֹחֶזֶת בַּעֲקֵב עֵשָׂו
  choice: その手はエサウのかかとをつかんでいた
  rationale: 分詞 אֹחֶזֶת が示す継続中の動作を「つかんでいた」と表し、誕生時の鮮明な描写を保つ。
- source_word: וַיִּקְרָא שְׁמוֹ יַעֲקֹב
  choice: その子はヤコブと名づけられた
  rationale: 動詞は男性単数形だが、直前の文脈だけでは名づけた者を明示しにくいため、日本語では受け身の命名表現を用い、因果的なつながりは「ので」で示した。固有名は日本語聖書で定着した「ヤコブ」とする。
- source_word: וְיִצְחָק בֶּן שִׁשִּׁים שָׁנָה בְּלֶדֶת אֹתָם
  choice: 二人が生まれた時、イサクは六十歳であった
  rationale: ヘブライ語の年齢表現を自然な日本語にし、אֹתָם の複数を「二人」と明示する一方、原文にない出産主体は補わない。
