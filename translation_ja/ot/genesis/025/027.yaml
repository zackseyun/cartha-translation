base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/027.yaml
  text: When the boys grew up[a], Esau became a skillful hunter, a man of the field, but Jacob was a quiet man[b], dwelling in tents.
translation:
  language: ja
  text: 二人の少年が成長すると、エサウは狩りにたけた人、野で暮らす人となった。一方、ヤコブは穏やかな人[a]で、天幕で暮らす人だった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「穏やかな」と訳したヘブライ語には、「完全な」「誠実な」「潔白な」「素朴な」などの意味もあり得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְדְּלוּ הַנְּעָרִים
  choice: 二人の少年が成長すると
  rationale: 双子の息子たちが成人へ向けて育ったことを、文脈に即した自然な現代日本語で表した。
- source_word: אִישׁ יֹדֵעַ צַיִד
  choice: 狩りにたけた人
  rationale: 直訳すれば「狩りを知る人」だが、ここでは狩猟の知識と熟練を表すため、「狩りにたけた」とした。
- source_word: אִישׁ שָׂדֶה
  choice: 野の人
  rationale: שָׂדֶה の基本像を保ちつつ、耕作地だけでなく戸外・野外を活動の場とする人物という意味を簡潔に表した。
- source_word: אִישׁ תָּם
  choice: 穏やかな人
  rationale: 狩猟にたけた「野の人」エサウと、天幕に住むヤコブとの対照を自然に示す。ただし תָּם には完全さ、誠実さ、潔白さ、素朴さなどの幅があるため、脚注で曖昧さを保持した。
- source_word: יֹשֵׁב אֹהָלִים
  choice: 天幕に住んでいた
  rationale: 分詞が表す習慣的な生活様式を自然に表現し、エサウの野外生活との対照を保った。日本語では総称的な「天幕」により複数形 אֹהָלִים を無理なく表せる。
theological_decisions:
- issue: ヤコブを形容する תָּם の意味
  choice: 本文では生活ぶり・気質を示す「穏やかな」とし、意味の幅を脚注に示す
  alternative: 「非の打ちどころのない」「誠実な」「潔白な」「素朴な」
  rationale: 直後の「天幕に住んでいた」と、エサウの「野の人」との文学的対照を重視しつつ、ヤコブに対する明確な道徳的評価へ意味を限定しないため。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、「野の人」「天幕」によって創世記の物語にふさわしい簡潔で格調ある語調を保った。原文で繰り返される אִישׁ は「人」を反復して可能な限り反映した。
