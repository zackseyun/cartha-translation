  yaml_path: translation/ot/genesis/025/013.yaml
  text: 'And these are the names of the sons of Ishmael[a], by their names according to their generations: the firstborn of Ishmael was Nebaioth, and Kedar, and Adbeel, and Mibsam.'
translation:
  language: ja
  text: これは、イシュマエルの息子たちの名である。それぞれの名により、その系譜[a]に従うと、イシュマエルの長男はネバヨトである。ほかにケダル、アデベエル、ミブサムがいる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「家系ごとに」。ここで用いられているヘブライ語は、系図上の血統や家系を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 挙げると、次のとおりである
  rationale: 接続詞を独立した「そして」とせず、系譜一覧を導入する自然な現代日本語の構文で表した。
- source_word: שְׁמוֹת בְּנֵי יִשְׁמָעֵאל
  choice: イシュマエルの息子たちの名
  rationale: ヘブライ語の連語を簡潔かつ明確に再現した。
- source_word: בִּשְׁמֹתָם
  choice: その名
  rationale: 原文にある「名」の反復を残し、定型的な系譜表現の重みを保った。
- source_word: לְתוֹלְדֹתָם
  choice: 代々の系譜に従って
  rationale: תּוֹלְדוֹת が持つ世代・血統・系譜の意味領域を保ちつつ、現代日本語で理解できる形にした。
- source_word: בְּכֹר יִשְׁמָעֵאל
  choice: イシュマエルの長男
  rationale: 「初子」より日常的で明瞭な「長男」を用い、最初に名を挙げられる人物の身分を示した。
- source_word: נְבָיֹת
  choice: ネバヨト
  rationale: ヘブライ語の音形に基づく、日本語聖書で一般的な表記を採用した。
- source_word: קֵדָר
  choice: ケダル
  rationale: ヘブライ語の音形に基づく標準的な日本語表記。
- source_word: אַדְבְּאֵל
  choice: アデベエル
  rationale: ヘブライ語の子音と母音を判別しやすい日本語表記で示した。
- source_word: מִבְשָׂם
  choice: ミブサム
  rationale: ヘブライ語の音形に基づく標準的な日本語表記。
