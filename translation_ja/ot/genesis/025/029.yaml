  source_fidelity: ヘブライ語の「ヤコブが煮て料理を作っていた／作った」「エサウが野から来た」「彼は疲れ果てていた」という叙述を、過不足なく伝えている。「煮込み料理」はנָזִיד（煮て作る料理）の現代的で理解しやすい訳語であり、「作っている」との組み合わせも調理場面を適切に表す。「野から」はשָׂדֶהの文脈上可能な意味を自然に反映する。
