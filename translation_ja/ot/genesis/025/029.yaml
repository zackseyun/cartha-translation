base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/029.yaml
  text: Jacob was cooking a stew[a], and Esau came in from the field[c][b], and he was exhausted.
translation:
  language: ja
  text: ヤコブが煮込み料理を作っていると、エサウが野からやって来た。彼は疲れ果てていた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּזֶד
  choice: 作っている
  rationale: この文脈では、煮ることによって料理を作ることを表す。目的語の「煮込み料理」と合わせ、現代日本語として自然に調理の場面を示した。
- source_word: נָזִיד
  choice: 煮込み料理
  rationale: 煮て作る料理を指す語。「煮物」よりも、続く赤い料理の描写や液状の料理という文脈に合い、古風な語を避けられる。
- source_word: וַיָּבֹא
  choice: やって来た
  rationale: 「来る、入って来る」を表す。出先の野からその場へ到着したことを、余分な方向情報を加えず自然に表現した。
- source_word: מִן הַשָּׂדֶה
  choice: 野から
  rationale: שָׂדֶה は畑だけでなく、人里の外の野や野外を指し得る。狩りから来るエサウの文脈では「野」が簡潔で自然。
- source_word: וְהוּא עָיֵף
  choice: 彼は疲れ果てていた
  rationale: 単純な主語述語関係を独立した文で明瞭に示し、עָיֵף の強い疲労を「疲れ果てていた」で表した。
theological_decisions: []
