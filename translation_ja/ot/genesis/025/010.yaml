source:
  edition: WLC
  text: הַ/שָּׂדֶ֛ה אֲשֶׁר קָנָ֥ה אַבְרָהָ֖ם מֵ/אֵ֣ת בְּנֵי חֵ֑ת שָׁ֛מָּ/ה קֻבַּ֥ר אַבְרָהָ֖ם וְ/שָׂרָ֥ה אִשְׁתּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/010.yaml
  text: the field that Abraham bought from the sons of Heth—there Abraham and Sarah his wife were buried[a][b][c].
translation:
  language: ja
  text: アブラハムがヘト人[a]から買い取ったその畑、そこにアブラハムとその妻サラは葬られた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「ヘトの子ら」。ヘト人という民族集団を指す表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂדֶה
  choice: その畑
  rationale: 定冠詞を文脈に即して「その」とし、直前に言及された埋葬地を指すことを明確にした。
- source_word: קָנָה
  choice: 買い取った
  rationale: 土地の正式な売買という文脈を、自然な現代日本語で具体的に表す。
- source_word: מֵאֵת בְּנֵי חֵת
  choice: ヘト人から
  rationale: מֵאֵת は購入元を示すため「から」とし、字義的には「ヘトの子ら」である民族的表現 בְּנֵי חֵת は、本文では明瞭な「ヘト人」と訳した。
- source_word: שָׁמָּה
  choice: そこに
  rationale: 前置された畑を受け直す場所の副詞であり、ヘブライ語の主題提示構文も反映する。
- source_word: קֻבַּר
  choice: 葬られた
  rationale: קבר の受動形を直接に訳す。日本語では単数・複数による動詞形の区別がないため、アブラハムとサラの双方に自然にかかる。
- source_word: וְשָׂרָה אִשְׁתּוֹ
  choice: とその妻サラ
  rationale: 原文の関係を保ちつつ、現代日本語として自然な語順にした。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。原文の「その畑……そこに」という主題提示と再述の形を残しつつ、民族名は本文で自然な「ヘト人」とした。
