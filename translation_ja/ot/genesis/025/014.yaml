lexical_decisions:
- source_word: מִשְׁמָע
  choice: ミシュマ
  rationale: 系図中の固有名詞なので訳語を当てず、日本語聖書で理解しやすい形に音写した。語末のעは日本語では通常、独立した音として表記しない。
- source_word: דּוּמָה
  choice: ドマ
  rationale: 固有名詞として音写した。長母音を含むヘブライ語の発音に対応しつつ、日本語聖書で定着した簡潔な表記を採った。
- source_word: מַשָּׂא
  choice: マサ
  rationale: ここでは一般名詞の「重荷／託宣」ではなく、イシュマエルの子孫の名であるため、意味を訳さず固有名詞として音写した。強勢や声門音は日本語表記に持ち込まなかった。
