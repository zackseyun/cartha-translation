  text: וְ/לִ/בְנֵ֤י הַ/פִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְ/אַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽ/יְשַׁלְּחֵ֞/ם מֵ/עַ֨ל יִצְחָ֤ק בְּנ/וֹ֙ בְּ/עוֹדֶ֣/נּוּ חַ֔י קֵ֖דְמָ/ה אֶל אֶ֥רֶץ קֶֽדֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/006.yaml
  text: But to the sons of his concubines[a], Abraham gave gifts, and while he was still alive he sent them away from his son Isaac[b], eastward to the land of the east.
translation:
  language: ja
  text: しかし、アブラハムは側女たちの息子たちには贈り物を与え、まだ生きているうちに、彼らを自分の息子イサクから遠ざけ、東の方、東の地へ送り出した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִבְנֵי הַפִּילַגְשִׁים
  choice: しかし、側女たちの息子たちには
  rationale: 前節でイサクに全財産を与えたこととの対比を「しかし」で示す。פִּילֶגֶשׁは正妻より低い社会的・法的地位にある女性を指すため、簡潔で伝統的な「側女」とした。
- source_word: אֲשֶׁר לְאַבְרָהָם
  choice: アブラハムの側女たち（文中では主語との重複を避けて「側女たち」）
  rationale: 関係節は側女たちがアブラハムに属することを示す。直後に「アブラハムは」とあるため、日本語では所有表現を省いても指示関係は明瞭である。
- source_word: נָתַן ... מַתָּנֹת
  choice: 贈り物を与え
  rationale: 動詞と目的語を直接的かつ自然な現代日本語で表した。相続財産との違いを訳文で過度に説明しない。
- source_word: וַיְשַׁלְּחֵם
  choice: 送り出した
  rationale: 単なる派遣だけでなく、その場から去らせる文脈上の含みを自然に表す。
- source_word: מֵעַל יִצְחָק בְּנוֹ
  choice: 彼らを自分の息子イサクから遠ざけ
  rationale: מֵעַלが表すイサクからの分離を明示する。「自分の息子」はבְּנוֹを反映し、アブラハムとの関係を明確にする。
- source_word: בְּעוֹדֶנּוּ חַי
  choice: まだ生きているうちに
  rationale: アブラハムが死ぬ前、自らこの措置を取ったという時間的意味を明瞭に保つ。
- source_word: קֵדְמָה אֶל אֶרֶץ קֶדֶם
  choice: 東の方、東の地へ
  rationale: 方向を示すקֵדְמָהと目的地を示すאֶרֶץ קֶדֶםの重なりを省略せず、ヘブライ語の反復を自然な日本語で保持する。
theological_decisions:
- issue: イサクと側女たちの息子たちの扱いの対比
  choice: 「しかし」と「イサクから遠ざけ」で対比と分離を保持する
  alternative: 単に「また……東へ送った」とする
  rationale: 前節の相続記事との対照と、本文が明示するイサクからの分離を保つ一方、その動機や神学的意味は本文以上に説明しない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「妾」は現代では侮蔑的・古風に響きやすいため「側女」を採用した。原文の「東」を重ねる表現は、地理的方向と地域名めいた表現の双方を残すため維持した。
