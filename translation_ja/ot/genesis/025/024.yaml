  language: ja
  text: 彼女が出産する時が満ちると、見よ、彼女の胎内には双子がいた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת
  choice: 出産の日が満ちると
  rationale: 直訳的には「彼女の、産むための日々が満ちた」。期間の完了を表すヘブライ語の慣用表現を、「日が満ちる」という自然で格調ある日本語で表した。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 後続する意外で重要な事実に注意を向ける談話標識。その驚きの力を、現代日本語で分かりやすい「なんと」によって示した。
- source_word: תוֹמִם
  choice: 双子
  rationale: 双生児を表す複数名詞。簡潔で自然な現代日本語を採用した。
- source_word: בְּבִטְנָהּ
  choice: その胎内には
  rationale: בטן は腹または胎を指し得るが、出産の文脈なので「胎内」が正確で自然。「その」は直前の女性を指す接尾代名詞を表す。
