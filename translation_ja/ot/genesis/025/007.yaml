lexical_decisions:
- source_word: וְאֵלֶּה
  choice: 〜は、…であった
  rationale: この接続詞と指示詞は、ここでは生涯の総括を導く。日本語では文頭の「そして、これらは」を逐語的に残さず、主題提示の「は」によって自然に表した。
- source_word: יְמֵי שְׁנֵי חַיֵּי אַבְרָהָם
  choice: アブラハムの生涯の年月
  rationale: 字義的には「アブラハムの生涯の年の日々」という重層的な表現で、全生涯の長さを指す。本文では自然な「生涯の年月」とし、原文の形は脚注で示した。
- source_word: אֲשֶׁר חָי
  choice: アブラハムが生きた
  rationale: 生涯を改めて限定し強調する関係節を、省かず自然な日本語で保持した。
- source_word: מְאַת שָׁנָה וְשִׁבְעִים שָׁנָה וְחָמֵשׁ שָׁנִים
  choice: 百七十五年
  rationale: 原文は百、七十、五を加算的に列挙する。日本語では同じ正確な年数を通常の数詞表現にまとめた。
