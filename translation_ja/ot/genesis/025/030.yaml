  text: וַ/יֹּ֨אמֶר עֵשָׂ֜ו אֶֽל יַעֲקֹ֗ב הַלְעִיטֵ֤/נִי נָא֙ מִן הָ/אָדֹ֤ם הָ/אָדֹם֙ הַ/זֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל כֵּ֥ן קָרָֽא שְׁמ֖/וֹ אֱדֽוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/030.yaml
  text: Esau said to Jacob[a], “Please let me gulp down some of that red stuff, that red stuff there[c][b], because I am exhausted.” Therefore his name was called Edom.
translation:
  language: ja
  text: エサウはヤコブに言った。「頼む、そこにある赤いもの、赤いものを少しかき込ませてくれ[a]。私は疲れ果てているのだ。」そのため、彼はエドム[b]と呼ばれた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は食物の名を挙げず、「赤いもの」に当たる語を繰り返している。エサウの衝動的な話し方を表している可能性がある。多くの訳は「煮物」などを補っている。
    reason: lexical_alternative
  - marker: b
    text: 「エドム」はヘブライ語で「赤い」を意味する語であり、直前の「赤いもの」との語遊びになっている。
    reason: wordplay
lexical_decisions:
- source_word: הַלְעִיטֵנִי
  choice: かき込ませてくれ
  rationale: 使役形の命令で、勢いよく、むさぼるように飲み込む意味合いがある。中立的な「食べさせてくれ」よりも、エサウの切迫した荒い口調を自然な日本語で表す。
- source_word: נָא
  choice: 頼む
  rationale: 依頼を示す小辞。現代日本語として自然であり、切迫した発言の調子にも合う。
- source_word: מִן הָאָדֹם הָאָדֹם הַזֶּה
  choice: その赤いもの、そこにある赤いものを
  rationale: 原文は食物の名称を明示せず、「赤い」を反復している。省略と反復を保ちつつ、指示語 הַזֶּה の現場的なニュアンスを「そこにある」で表した。
- source_word: כִּי עָיֵף אָנֹכִי
  choice: 私は疲れ果てているのだ
  rationale: עָיֵף は強い疲労を表す。「疲れ果てている」は、失神寸前とまでは断定せず、依頼の切迫感を伝える。
- source_word: עַל כֵּן
  choice: そのため
  rationale: 命名の由来を導く因果表現として、明瞭で自然な現代日本語を用いた。
- source_word: קָרָא שְׁמוֹ אֱדוֹם
  choice: 彼はエドムと呼ばれた
  rationale: 原文の命名表現を、日本語で不自然にならない受け身の形にした。動詞の主語は明示されていないため、「人々は」とは補わない。
- source_word: אֱדוֹם
  choice: エドム
  rationale: 固有名として音写し、直前の「赤い」との語呂合わせは脚注で示す。
theological_decisions: []
translation_notes:
  register: 地の文は明瞭で落ち着いた現代標準語とし、エサウの直接話法では「頼む」「かき込ませてくれ」によって切迫した粗野さを適度に表した。「赤いもの」の反復は、原文の不自然さを意図的に残すため保持した。
