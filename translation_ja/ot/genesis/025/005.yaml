  text: Abraham gave all that he had to Isaac[a].
translation:
  language: ja
  text: アブラハムは、自分の持つものをすべてイサクに与えた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼に属するすべて」。
    reason: 原文の所有表現を、より形式的な訳として示すため。
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: 与えた
  rationale: נתןの基本義「与える」を、物語を進めるワイイクトール形に即して自然な過去形で表した。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 日本語聖書で広く定着している人名表記を用いた。
- source_word: אֵת
  choice: 訳語を置かない
  rationale: 直接目的語を示す標識であり、日本語では語順と助詞によってその機能を表せるため。
- source_word: כָּל אֲשֶׁר לוֹ
  choice: 自分の持つものをすべて
  rationale: 字義は「彼に属するすべて」。所有物の全体を指す表現として、意味を狭めず自然な現代日本語にした。
- source_word: לְיִצְחָק
  choice: イサクに
  rationale: 前置詞לְはここで受け手を示すため、日本語の間接目的語を表す「に」とした。
