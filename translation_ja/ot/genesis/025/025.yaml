  text: וַ/יֵּצֵ֤א הָ/רִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖/וֹ כְּ/אַדֶּ֣רֶת שֵׂעָ֑ר וַ/יִּקְרְא֥וּ שְׁמ֖/וֹ עֵשָֽׂו׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/025.yaml
  text: The first came out reddish[a], all of him like a hairy cloak[c][b], and they called his name Esau.
translation:
  language: ja
  text: 最初に出てきた子は、赤みを帯び、全身が毛の外套のようだった。人々はその子をエサウと名づけた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: ヘブライ語では「彼の名をエサウと呼んだ」。これは命名を表す定型句である。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 出てきた
  rationale: 出産時に胎内から「出る」ことを表す一般的な動詞。具体的な描写を保ちつつ、現代日本語として自然にした。
- source_word: הָרִאשׁוֹן
  choice: 最初に…子
  rationale: 双子のうち先に生まれた子を指す。日本語では動詞と結びつけて「最初に出てきた子」とするのが自然である。
- source_word: אַדְמוֹנִי
  choice: 赤みを帯び
  rationale: 赤みのある外見を表す形容詞。単純に「赤い」と断定せず、原語の色合いの幅を保った。後のエドムとの語の響きも過度に明示しない。
- source_word: כֻּלּוֹ
  choice: 全身が
  rationale: 描写が体全体に及ぶことを明確に表す、自然で簡潔な日本語。
- source_word: כְּאַדֶּרֶת שֵׂעָר
  choice: 毛の外套のようだった
  rationale: אַדֶּרֶת の「外套、上着」と שֵׂעָר の「毛」を含む直喩を保持した。「毛で覆われていた」と説明的に解消せず、原文の鮮烈な比喩を残した。
- source_word: וַיִּקְרְאוּ שְׁמוֹ
  choice: 人々は、その子を…と名づけた
  rationale: 複数主語を保ちながら、ヘブライ語の定型的な命名表現を自然な現代日本語にした。文脈上明示されない複数者を「人々」と表した。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 日本語聖書で広く定着した人名表記を用いた。
