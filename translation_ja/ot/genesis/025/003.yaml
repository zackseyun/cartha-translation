  text: וְ/יָקְשָׁ֣ן יָלַ֔ד אֶת שְׁבָ֖א וְ/אֶת דְּדָ֑ן וּ/בְנֵ֣י דְדָ֔ן הָי֛וּ אַשּׁוּרִ֥ם וּ/לְטוּשִׁ֖ים וּ/לְאֻמִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/003.yaml
  text: Jokshan fathered Sheba and Dedan. The sons of Dedan were Asshurim[a], Letushim, and Leummim.
translation:
  language: ja
  text: ヨクシャンはシェバとデダンをもうけた。デダンの子らは、アシュリム[a]、レトシム、レウミムであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: アシュリム、レトシム、レウミムは、個人名ではなく氏族名である可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקְשָׁן
  choice: ヨクシャン
  rationale: 固有の人名として、ヘブライ語の発音に沿いつつ日本語で読みやすく音写した。
- source_word: יָלַד
  choice: もうけた
  rationale: 男性を主語とする系図の文脈で、父となったことを簡潔かつ自然な現代日本語で表す。
- source_word: שְׁבָא
  choice: シェバ
  rationale: 固有名として音写した。
- source_word: דְּדָן
  choice: デダン
  rationale: 固有名として音写した。
- source_word: בְנֵי
  choice: 子ら
  rationale: 字義は「息子たち」だが、ここでは氏族・子孫を指す可能性もあるため、系図表現として簡潔で、その幅をある程度保てる「子ら」とした。
- source_word: הָיוּ
  choice: であった
  rationale: 列挙される者たちを同定する単純な連結表現として訳した。
- source_word: אַשּׁוּרִם
  choice: アシュリム
  rationale: 氏族名または集団名と考えられるため、意味を断定せず音写した。
- source_word: לְטוּשִׁים
  choice: レトシム
  rationale: 氏族名または集団名として音写し、不確かな語源による意訳を避けた。
- source_word: לְאֻמִּים
  choice: レウミム
  rationale: 一般名詞「諸民族」と関係する形にも見えるが、この系図では固有の氏族名として扱い、解釈を固定しないよう音写した。
theological_decisions:
- issue: デダンに続く三名称が個人名か氏族名か
  choice: 本文では「子ら」とし、名称を音写する
  alternative: 「子孫」「氏族」と明示する
  rationale: 原文の בְנֵי は字義上「子ら」だが、複数形の名称は氏族・集団名である可能性が高い。本文では原文の系図形式を保ち、注で可能性を示す。
translation_notes:
  register: 明瞭で簡潔な現代標準日本語。系図らしい端正さを保ちながら、古風な「生んだ」「生ませた」や硬い「生殖した」は避けた。
