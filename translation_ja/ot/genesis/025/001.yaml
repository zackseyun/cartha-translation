source:
  edition: WLC
  text: וַ/יֹּ֧סֶף אַבְרָהָ֛ם וַ/יִּקַּ֥ח אִשָּׁ֖ה וּ/שְׁמָ֥/הּ קְטוּרָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/001.yaml
  text: Abraham took another wife[a], and her name was Keturah.
translation:
  language: ja
  text: アブラハムは、さらに妻を迎えた[a]。その名はケトラであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「アブラハムは再び妻を迎えた」。ヘブライ語では字義的に「アブラハムは加えて、妻を取った」。
    reason: וַיֹּסֶףの加算・反復のニュアンスと、可能な別訳を示すため。
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: さらに
  rationale: יסףの加算・反復の意味を自然な現代日本語で示す。後続の「妻を迎えた」と合わせ、もう一人の妻を迎えたことを表す一方、「再婚した」など本文以上に時系列や身分関係を限定する表現は避けた。
- source_word: וַיִּקַּח אִשָּׁה
  choice: 妻を迎えた
  rationale: לקח אשהは妻をめとることを表す定型的な言い回し。「妻を取った」より自然で品位ある現代日本語とし、婚姻の意味を明確にした。
- source_word: וּשְׁמָהּ
  choice: その名は…であった
  rationale: ヘブライ語の単純な命名句を明確かつ簡潔に再現した。
- source_word: קְטוּרָה
  choice: ケトラ
  rationale: 人名を日本語聖書で通用する形に音写した。
theological_decisions:
- issue: וַיֹּסֶףの加算・反復の力を、アブラハムが妻を迎えたこととの関係でどう表すか
  choice: さらに妻を迎えた
  alternative: 再び妻を迎えた／もう一人の妻を迎えた
  rationale: 原文は字義的には「加えて、妻を取った」となる。「さらに」は加算の含みを保ちながら、ケトラを前妻の死後の妻と断定する「再び」や、同時に複数の妻がいたことを強く示唆しうる「もう一人の」より、原文の曖昧さを保ちやすい。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「妻を迎える」は婚姻を自然に表し、「であった」は物語文として簡潔で落ち着いた調子を与える。
