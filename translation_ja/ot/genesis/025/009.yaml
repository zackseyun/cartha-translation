base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/009.yaml
  text: His sons Isaac and Ishmael buried him in the cave of Machpelah[a], in the field of Ephron son of Zohar the Hittite, which is opposite Mamre.
translation:
  language: ja
  text: 彼の息子イサクとイシュマエルは、マムレの向かいにある[a]、ヒッタイト人ツォハルの子エフロンの畑のマクペラの洞窟に、彼を葬った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「マムレの前にある」または「マムレに面している」とも訳せる。ヘブライ語の表現は、目印となる場所の前方または向かい側にあることを示し得る。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: 彼を葬った
  rationale: 連続する物語の次の出来事を表す。目的語の三人称男性単数は前節のアブラハムを指すため、「彼」とした。
- source_word: יִצְחָק וְיִשְׁמָעֵאל בָּנָיו
  choice: その息子たち、イサクとイシュマエル
  rationale: בָּנָיו は二人がアブラハムの息子であることを示す同格表現であり、日本語ではこの語順が明瞭で自然である。
- source_word: אֶל מְעָרַת הַמַּכְפֵּלָה
  choice: マクペラの洞窟に
  rationale: אֶל の方向性は、埋葬という文脈では自然な日本語の場所表現「洞窟に」で表せる。マクペラは固有名として音写した。
- source_word: אֶל שְׂדֵה עֶפְרֹן
  choice: エフロンの畑、その…洞窟に
  rationale: 二つ目の אֶל は埋葬場所をさらに特定する。洞窟がエフロンの畑にあるという包含関係が明確になるように構成した。
- source_word: בֶּן צֹחַר הַחִתִּי
  choice: ヒッタイト人ツォハルの子
  rationale: 民族名をツォハルに係るものとして、原文の語順と統語関係を保った。
- source_word: אֲשֶׁר עַל פְּנֵי מַמְרֵא
  choice: マムレの向かいにある
  rationale: 地理表現 עַל־פְּנֵי は「前」「正面」「向かい」などの幅を持つ。「向かい」は方向を不必要に限定せず、現代日本語として明瞭である。
