source:
  edition: WLC
  text: וַ/יֶּאֱהַ֥ב יִצְחָ֛ק אֶת עֵשָׂ֖ו כִּי צַ֣יִד בְּ/פִ֑י/ו וְ/רִבְקָ֖ה אֹהֶ֥בֶת אֶֽת יַעֲקֹֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/028.yaml
  text: Isaac loved Esau because game was in his mouth[a], but Rebekah loved Jacob.
translation:
  language: ja
  text: イサクは、獲物が彼の口にあったので[a]、エサウを愛した。しかし、リベカはヤコブを愛した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「獲物が彼の口にあったので」。おそらく、エサウがもたらす獲物をイサクが好んで食べたため、という意味。
    reason: ヘブライ語の具体的な表現を本文に残しつつ、その慣用的と思われる意味を説明するため。
lexical_decisions:
- source_word: וַיֶּאֱהַב
  choice: 愛した
  rationale: 物語中の完了した過去の叙述として、簡潔に「愛した」とした。
- source_word: אֶת עֵשָׂו
  choice: エサウを
  rationale: 目的語標識 אֶת は訳出せず、人名を現代日本語の慣用表記で示した。
- source_word: כִּי
  choice: ので
  rationale: イサクがエサウを愛した理由を導く接続表現として、現代日本語で自然な「ので」を用いた。
- source_word: צַיִד
  choice: 獲物
  rationale: 狩猟で得た動物やその肉を指し得る語であり、「鹿肉」のように対象を限定しない「獲物」とした。
- source_word: בְּפִיו
  choice: 彼の口にあった
  rationale: 直訳的な身体表現「彼の口に」を保持し、単に「好物だった」「食べるのが好きだった」と意味を確定しすぎないようにした。日本語だけでは指示対象と慣用的含意が分かりにくいため脚注を付した。
- source_word: וְרִבְקָה
  choice: しかし、リベカは
  rationale: 接続詞 וְ の対照的な談話機能を、両親の異なる愛情の向きを明確にする「しかし」で表した。
- source_word: אֹהֶבֶת
  choice: 愛した
  rationale: 分詞が表す継続的・特徴的な状態を、物語文として自然な過去形「愛した」で表した。
- source_word: אֶת יַעֲקֹב
  choice: ヤコブを
  rationale: 目的語標識 אֶת は訳出せず、人名を現代日本語の慣用表記で示した。
