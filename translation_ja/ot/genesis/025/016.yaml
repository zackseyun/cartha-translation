source:
  edition: WLC
  text: אֵ֣לֶּה הֵ֞ם בְּנֵ֤י יִשְׁמָעֵאל֙ וְ/אֵ֣לֶּה שְׁמֹתָ֔/ם בְּ/חַצְרֵי/הֶ֖ם וּ/בְ/טִֽירֹתָ֑/ם שְׁנֵים עָשָׂ֥ר נְשִׂיאִ֖ם לְ/אֻמֹּתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/016.yaml
  text: 'These are the sons of Ishmael[a], and these are their names[c][b], by their settlements and by their encampments: twelve princes according to their peoples.'
translation:
  language: ja
  text: これらがイシュマエルの子らであり、集落[a]と宿営地[b]ごとに挙げられた彼らの名である。それぞれの民に属する十二人の首長[c]である。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「村」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「陣営」あるいは「要塞化された宿営地」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 「族長」「指導者」あるいは「君主」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם בְּנֵי יִשְׁמָעֵאל
  choice: 以上がイシュマエルの息子たちであり
  rationale: 直前までに列挙された実子たちを総括する表現なので、בְּנֵי は広い「子孫」ではなく「息子たち」とした。日本語では列挙の結びとして「以上が」が自然である。
- source_word: וְאֵלֶּה שְׁמֹתָם
  choice: 彼らの名である
  rationale: 「そして、これらが彼らの名である」という原文の反復を、意味を保ちながら自然な日本語の一文にまとめた。
- source_word: בְּחַצְרֵיהֶם
  choice: 彼らの集落における
  rationale: חָצֵר は村、集落、囲われた居住地を表し得る。ここでは部族的・地理的な広がりを含められる「集落」を選び、前置詞 בְּ の場所・区分に関する含みを「における」で保った。
- source_word: וּבְטִירֹתָם
  choice: 宿営地における
  rationale: טִירָה は宿営地、陣営、要塞化された居住地を指し得る。「宿営地」は移動生活の背景を伝えつつ、語義を過度に「要塞」に限定しない。
- source_word: שְׁנֵים עָשָׂר נְשִׂיאִם
  choice: 十二人の族長
  rationale: נָשִׂיא は指導者、首長、君主を表す。族長時代の氏族的文脈では「族長」が自然であり、世襲君主を強く連想させる「君主」を避けた。
- source_word: לְאֻמֹּתָם
  choice: それぞれの民ごとの
  rationale: אֻמָּה は民族・民の集団を指す。「民」は「部族」より原語の幅を保ち、לְ の対応・区分の意味を「ごとの」で表した。
theological_decisions:
- issue: 十二人の נְשִׂיאִם の身分
  choice: 族長
  alternative: 君主／指導者
  rationale: 王制的な地位を本文以上に読み込まず、各民を率いる高位者という意味を保つため。
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用い、系譜の総括にふさわしい簡潔で格調ある文体とした。原文の名詞文は日本語の過去叙述に合わせて「であった」としたが、人物・地名の一覧を総括する機能は維持している。בְּ の解釈には「場所における」と「場所ごとに」の幅があるため、断定的に分類関係へ限定しない「における」を採用した。
