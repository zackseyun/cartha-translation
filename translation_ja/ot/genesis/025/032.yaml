reference: Genesis 25:32
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר עֵשָׂ֔ו הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָ/מ֑וּת וְ/לָ/מָּה זֶּ֥ה לִ֖/י בְּכֹרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/032.yaml
  text: Esau said[a], “Look, I am about to die; so what use is this birthright to me?”
translation:
  language: ja
  text: エサウは言った。「見ろ、私はもう死にそうだ。それなら、長子の権利が私に何の役に立つのか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める標準的なワイイクトル形。接続詞を逐語的に「そして」とせず、自然な日本語の叙述とした。
- source_word: עֵשָׂו
  choice: エサウ
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: הִנֵּה
  choice: 見ろ
  rationale: 聞き手の注意を強く引く間投詞の働きを、古風すぎない直接的な表現で示した。
- source_word: אָנֹכִי הוֹלֵךְ לָמוּת
  choice: 私はもう死にそうだ
  rationale: הלך＋不定詞が表す死への切迫を自然な日本語で表現した。実際に死が目前だったのか、誇張なのかは確定しない。
- source_word: וְלָמָּה זֶּה לִי
  choice: それなら、…が私に何の役に立つのか
  rationale: 前の発言を受けた修辞疑問の実際的な意味を明瞭にしつつ、本人にとっての利得を問う与格 לִי を保持した。
- source_word: בְּכֹרָה
  choice: 長子の権利
  rationale: 第一子としての法的・社会的地位と特権を指す語として、現代日本語で理解しやすく正確な表現を選んだ。
theological_decisions:
- issue: エサウの「死にそうだ」という発言の解釈
  choice: 死が迫っているというエサウ自身の主張として訳し、その真偽や程度は断定しない。
  alternative: 文字どおり死の直前だったとする／激しい空腹による誇張とする。
  rationale: ヘブライ語本文はエサウの発言を記すだけで、文字どおりか誇張かを明示しないため、解釈上の緊張を残した。
translation_notes:
  register: 明瞭で現代的ながら、物語の格調を保つ文体。「見ろ」はエサウの切迫した口調を伝え、「何の役に立つのか」で修辞疑問を自然に表した。
