  source_fidelity: ヘブライ語本文の内容を正確に反映している。「パン」と「レンズ豆の煮物」は לֶחֶם と נְזִיד עֲדָשִׁים に忠実であり、食べる・飲む・立ち上がる・去るという連続動作も過不足なく訳出されている。結語の「こうしてエサウは長子の権利を軽んじた」は、וַיִּבֶז עֵשָׂו אֶת־הַבְּכֹרָה の要約的評価を自然に伝える。
