  text: וְ/יַעֲקֹ֞ב נָתַ֣ן לְ/עֵשָׂ֗ו לֶ֚חֶם וּ/נְזִ֣יד עֲדָשִׁ֔ים וַ/יֹּ֣אכַל וַ/יֵּ֔שְׁתְּ וַ/יָּ֖קָם וַ/יֵּלַ֑ךְ וַ/יִּ֥בֶז עֵשָׂ֖ו אֶת הַ/בְּכֹרָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/034.yaml
  text: And Jacob gave Esau bread and lentil stew[a], and he ate and drank and rose and went away[b]. Thus Esau despised the birthright.
translation:
  language: ja
  text: ヤコブはエサウにパンとレンズ豆の煮物を与えた。エサウは食べ、飲み、立ち上がって去った。こうしてエサウは長子の権利を軽んじた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נָתַן
  choice: 与えた
  rationale: 物語の交換場面に余分な含意を加えず、一般的な「与える」の意味をそのまま表す。
- source_word: לֶחֶם
  choice: パン
  rationale: 煮物と並べられているため、一般的な「食物」ではなく具体的な「パン」と理解するのが自然である。
- source_word: נְזִיד עֲדָשִׁים
  choice: レンズ豆の煮物
  rationale: レンズ豆を煮た料理を指す構文であり、現代日本語で自然かつ具体的に表現した。
- source_word: וַיֹּאכַל וַיֵּשְׁתְּ וַיָּקָם וַיֵּלַךְ
  choice: 食べ、飲み、立ち上がって去った
  rationale: 連続する動作を簡潔に並べ、ヘブライ語の速い物語運びを保つ。「去った」は文脈上の離去を自然に表す。
- source_word: וַיִּבֶז
  choice: 軽んじた
  rationale: 侮蔑し、価値のないものとして扱う意味を、過度に感情面へ限定せず自然な日本語で表す。
- source_word: הַבְּכֹרָה
  choice: 長子の権利
  rationale: 家族内で長子に属する身分上・相続上の権利を簡潔かつ明確に示す。
theological_decisions:
- issue: エサウによる長子の権利の評価を語る結び
  choice: こうしてエサウは長子の権利を軽んじた
  alternative: そしてエサウは長子の権利を侮った
  rationale: 最後の節を直前の一連の行動に対する物語上の総括として示しつつ、וַיִּבֶז の道徳的評価を弱めない。「軽んじた」は、内面的な嫌悪だけでなく行動による価値の否定も含みうる。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。連続動作は簡潔に並べて原文のテンポを保ち、結びの評価文は「こうして」で総括性を示した。
