  terminology: 固有名は「ヤコブ」「エサウ」で適切。הַבְּכֹרָה を「長子の権利」とすることで、単なる出生順位ではなく長子に伴う権利・地位を明確にしている。「軽んじた」は וַיִּבֶז の軽蔑・価値の否定を過度に解釈せず表せている。
