  text: וְ/אֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת יִצְחָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/019.yaml
  text: 'These are the generations of Isaac[a], son of Abraham: Abraham fathered Isaac.'
translation:
  language: ja
  text: これは、アブラハムの子イサクの歴史[a]である。アブラハムはイサクをもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「系譜」または「記録」とも訳せる。ヘブライ語トレドートは、創世記で区分の見出しとして繰り返し用いられる語。
    reason: 原語 תּוֹלְדֹת の意味の幅と、創世記における構成上の役割を示すため。
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: これは
  rationale: 接続詞を伴う指示表現で、新しい区分を導入する。日本語では文脈上不要な「そして」を加えず、「これは」として自然に示した。
- source_word: תּוֹלְדֹת
  choice: 歴史
  rationale: 創世記で区分見出しとして繰り返される語であり、ある人物から展開する系譜・出来事・記録を広く指し得る。「系図」や「子孫」だけに狭めず、現代日本語として理解しやすい「歴史」とした上で、脚注に語義の幅を示した。
- source_word: יִצְחָק
  choice: イサク
  rationale: 日本語聖書で定着している人名表記を用いた。
- source_word: בֶּן אַבְרָהָם
  choice: アブラハムの子
  rationale: 系譜上の関係を明確かつ簡潔に表す直訳的な表現。
- source_word: אַבְרָהָם הוֹלִיד אֶת יִצְחָק
  choice: アブラハムはイサクをもうけた
  rationale: הוֹלִיד はここで「父としてもうける」の意。「生んだ」では母による出産と受け取られやすく、「もうけた」が父系の系譜表現として自然で正確である。
theological_decisions:
- issue: 創世記の תּוֹלְדֹת 定型句の訳し方
  choice: 本文では「歴史」とし、脚注で「系譜」「記録」という可能性を示す
  alternative: 「系譜」「由来」「記録」
  rationale: この語は創世記の構成を示す見出しで、単なる子孫一覧にも個人伝にも限定されない。本文を明瞭な現代日本語にしつつ、脚注によって原語の広がりと文学的機能を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「これは……である」という見出しの定型性を残し、後半は簡潔な系譜表現とした。
