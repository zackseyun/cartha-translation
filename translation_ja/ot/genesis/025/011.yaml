source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַ/יְבָ֥רֶךְ אֱלֹהִ֖ים אֶת יִצְחָ֣ק בְּנ֑/וֹ וַ/יֵּ֣שֶׁב יִצְחָ֔ק עִם בְּאֵ֥ר לַחַ֖י רֹאִֽי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/011.yaml
  text: And it happened after Abraham’s death that God blessed Isaac his son[a], and Isaac lived by Beer-lahai-roi.
translation:
  language: ja
  text: アブラハムの死後、神はその子イサクを祝福された。イサクはベエル・ラハイ・ロイ[a]の近くに住んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ベエル・ラハイ・ロイは井戸の名。創世記16章14節に初めて出てくる。
    reason: cross_reference
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת אַבְרָהָם
  choice: アブラハムの死後
  rationale: ヘブライ語の物語を進める וַיְהִי は、日本語では独立に「そして、…が起こった」とすると不自然に重くなるため、後続の時を示す句と合わせて簡潔に表した。אַחֲרֵי מוֹת は「死後」と自然に訳した。
- source_word: וַיְבָרֶךְ אֱלֹהִים
  choice: 神は…祝福された
  rationale: ברך の基本義を「祝福する」とし、אֱלֹהִים は文脈上「神」とした。神を主語とする現代日本語の聖書文体として、敬意を示す「祝福された」を用いた。
- source_word: אֶת יִצְחָק בְּנוֹ
  choice: その子イサクを
  rationale: בְּנוֹ の指示対象は直前のアブラハムであり、「その子」として明示した。日本語では「その子イサク」が自然で、イサクがアブラハムの子であるという原文の同格関係を保つ。
- source_word: וַיֵּשֶׁב
  choice: 住んだ
  rationale: ישב は座る、住む、定住するなどを表すが、ここでは居住地を述べるため、明快な現代語「住んだ」とした。
- source_word: עִם
  choice: の近くに
  rationale: 通常は「〜と共に」だが、ここでは井戸の名を伴う位置表現であり、近接を表す。「と共に」では井戸を同伴者のように響かせるため、「近くに」とした。
- source_word: בְּאֵר לַחַי רֹאִי
  choice: ベエル・ラハイ・ロイ
  rationale: 創世記16章14節ですでに現れる固有地名として音写し、複合名のまとまりが分かるよう中黒で区切った。
theological_decisions:
- issue: אֱלֹהִים の訳語
  choice: 神
  alternative: 神なる方
  rationale: この箇所では唯一の神がイサクを祝福するという単純な物語叙述であり、特別な説明的表現を加えず、標準的な「神」とするのが最も明確である。
- issue: イサクへの祝福とアブラハムとの関係
  choice: 「その子イサク」として親子関係のみを明示
  alternative: 「後継者イサク」など継承の意味を補う
  rationale: アブラハムの死後に神がイサクを祝福したという配列には継承を示唆する文脈があるが、原文はこの節でイサクを「後継者」とは呼んでいないため、解釈を本文に補わない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神を主語とする動詞には敬意を示す表現を採用した。物語接続の וַיְהִי は日本語で冗長にならないよう時間句に統合した。英語相談層では脚注記号が「その子」の後に置かれているが、脚注内容はベエル・ラハイ・ロイの説明なので、日本語本文では該当地名の直後に置いた。
