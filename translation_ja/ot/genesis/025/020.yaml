base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/020.yaml
  text: Isaac was forty years old when he took Rebekah[a], the daughter of Bethuel the Aramean from Paddan-aram, the sister of Laban the Aramean[b], to be his wife.
translation:
  language: ja
  text: イサクが、パダン・アラム出身のアラム人[a]ベトエルの娘で、アラム人ラバンの女性のきょうだいであるリベカを妻に迎えた[b]とき、イサクは四十歳であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「アラム人」は、古い訳で「シリア人」とされることがある。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳すると、「リベカを自分の妻として取った」となる。ここでは自然な日本語で「妻に迎えた」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יִצְחָק בֶּן אַרְבָּעִים שָׁנָה
  choice: イサクは四十歳であった
  rationale: 「～の子」を用いるヘブライ語の年齢表現を、明瞭で自然な現代日本語の年齢表現にした。節全体の構文を保つため、時を表す従属節の後に置いた。
- source_word: בְּקַחְתּוֹ ... לוֹ לְאִשָּׁה
  choice: 妻に迎えた
  rationale: 字義的には「彼が取った……自分の妻として」だが、婚姻を表す定型表現であるため、意味を明確にする自然で品位ある日本語を選んだ。
- source_word: רִבְקָה
  choice: リベカ
  rationale: 日本語聖書で広く認識されるヘブライ語人名の慣用表記を採用した。
- source_word: בַּת בְּתוּאֵל
  choice: ベトエルの娘
  rationale: 系譜的な関係を簡潔かつ直接的に表した。
- source_word: הָאֲרַמִּי
  choice: アラム人
  rationale: 民族名を歴史的・言語的に正確に表し、古い訳語である「シリア人」と区別した。
- source_word: מִפַּדַּן אֲרָם
  choice: パダン・アラム出身の
  rationale: 地名を音写し、前置詞 מִן の出所を日本語で自然に示した。
- source_word: אֲחוֹת לָבָן
  choice: ラバンの妹
  rationale: אֲחוֹת 自体は年長・年少を明示しない「姉妹」だが、日本語の伝統的かつ文脈上自然な呼称として「妹」を採用した。原文上の曖昧さは注で明示した。
