revisions:
- from: 彼らはハビラからシュルまでの地域に住んだ。シュルは、エジプトに面し、アシュル[b]へ向かう道筋にある。イシュマエルは、すべての兄弟たちに面する所に住んだ[a]。
  to: 彼らは、エジプトの向かいで、アシュルへ向かう方にあるシュルまで、ハビラから住んだ。イシュマエルは、すべての兄弟たちの前に住んだ[a]。
  rationale: 地理句を原文どおりシュルへの一続きの限定として再構成し、原文にない「道筋」という含意を避けました。結びは、本文では空間的に近い「すべての兄弟たちの前に住んだ」とし、慣用句としての敵対的理解および字義的な「倒れた」を脚注に残しました。アシュルに関する脚注アンカーは、改訂本文で当該語が現れるため[b]を付しました。
