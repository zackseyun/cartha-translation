  text: וַ/יִּשְׁכְּנ֨וּ מֵֽ/חֲוִילָ֜ה עַד שׁ֗וּר אֲשֶׁר֙ עַל פְּנֵ֣י מִצְרַ֔יִם בֹּאֲ/כָ֖ה אַשּׁ֑וּרָ/ה עַל פְּנֵ֥י כָל אֶחָ֖י/ו נָפָֽל־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/025/018.yaml
  text: They settled from Havilah to Shur[a], which is opposite Egypt as you go toward Asshur[b]. He settled opposite all his brothers.
translation:
  language: ja
  text: 彼らは、エジプトの向かいで、アシュルへ向かう方にあるシュルまで、ハビラから住んだ。イシュマエルは、すべての兄弟たちの前に住んだ[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: このヘブライ語の句は、位置関係を表して「すべての兄弟たちと向かい合う所に住んだ」とも、敵対的に「すべての兄弟たちに敵対して住んだ」とも解釈できる。字義的には「すべての兄弟たちの前に倒れた」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכְּנוּ
  choice: 彼らは……地域に住んだ
  rationale: שׁכן の複数形は、イシュマエルの子孫が一定の地域に居住したことを表す。「住んだ」は現代日本語として自然で、定住の含みを過度に強めない。
- source_word: מֵחֲוִילָה עַד שׁוּר
  choice: ハビラからシュルまでの地域
  rationale: 居住範囲を示す「～から～まで」の地理的表現を明確にした。
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרַיִם
  choice: シュルは、エジプトに面し
  rationale: עַל־פְּנֵי の「前に／向かいに」という空間的意味を「面し」で表し、東方などの方角を本文で限定しない。関係節の先行詞は直前のシュルと解した。
- source_word: בֹּאֲכָה אַשּׁוּרָה
  choice: アシュルへ向かう道筋にある
  rationale: 移動を表す形と方向を示す語尾を自然な地理表現にした。固有名は原文に即して「アシュル」とした。
- source_word: עַל־פְּנֵי כָּל־אֶחָיו נָפָל
  choice: すべての兄弟たちに面する所に住んだ
  rationale: נפל の通常義は「倒れる」だが、ここでは居住・位置を表す慣用的用法として理解した。עַל־פְּנֵי の空間的意味を保ちつつ、敵対の意味を本文に断定的に持ち込まない。
- source_word: נָפָל
  choice: イシュマエルは……住んだ
  rationale: 単数形はイシュマエル本人を受けるものとして主語を補った。日本語で「彼」が誰か曖昧になるのを避けた。
theological_decisions:
- issue: עַל־פְּנֵי כָּל־אֶחָיו נָפָל の解釈
  choice: イシュマエルは、すべての兄弟たちに面する所に住んだ
  alternative: イシュマエルは、すべての兄弟たちに敵対して住んだ／すべての兄弟たちの前に倒れた
  rationale: この句は空間的位置、敵対関係、あるいは字義どおりの「倒れた」とも取り得る。創世記16章12節との関連から敵対的な含意はあり得るが、本文では比較的形式に近い空間表現を採用し、解釈上の幅を脚注に残した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。地名は一般的な聖書表記を用いた。地理句と結びの慣用句の曖昧さを過度に解消せず、主要な別解は脚注に示した。
