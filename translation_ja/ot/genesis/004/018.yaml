base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/018.yaml
  text: To Hanok was born Irad[a], and Irad fathered Mehujael, and Mehujael fathered Methushael, and Methushael fathered Lamech.
translation:
  language: ja
  text: ハノクにイラドが生まれた。イラドはメフヤエル[a]をもうけ、メフヤエルはメトシャエルをもうけ、メトシャエルはレメクをもうけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文では、この同じ名がこの節の中で二通りに綴られている。最初は「メフヤエル」、次は「メヒヤエル」に当たる形。
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּוָּלֵד לַחֲנוֹךְ
  choice: ハノクに……が生まれた
  rationale: נפעל形の受動的な意味と、לְが示す親との関係を保ちつつ、現代日本語として自然な系譜表現にした。
- source_word: יָלַד
  choice: もうけた
  rationale: 系譜における能動形で、父として子を生じさせたことを表す。古風な「生んだ」「生ませた」より自然で簡潔である。
- source_word: חֲנוֹךְ / עִירָד / מְחוּיָאֵל / מְתוּשָׁאֵל / לָמֶךְ
  choice: ハノク／イラド／メフヤエル／メトシャエル／レメク
  rationale: ヘブライ語の人名を、日本語で読みやすい形に音写した。
- source_word: מְחוּיָאֵל / מְחִיּיָאֵל
  choice: メフヤエル
  rationale: 本文中では同一人物の名を一つの表記に統一して読みやすくし、ヘブライ語本文にある綴りの違いは脚注に残した。
theological_decisions: []
