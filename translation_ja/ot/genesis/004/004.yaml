  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/הֶ֨בֶל הֵבִ֥יא גַם ה֛וּא מִ/בְּכֹר֥וֹת צֹאנ֖/וֹ וּ/מֵֽ/חֶלְבֵ/הֶ֑ן וַ/יִּ֣שַׁע יְהוָ֔ה אֶל הֶ֖בֶל וְ/אֶל מִנְחָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/004.yaml
  text: And Abel also brought some of the firstborn of his flock[a], and of their fat portions. And Yahweh regarded Abel and his offering[b],
translation:
  language: ja
  text: アベルもまた、自分の群れの初子の中から何頭かと、それらの脂肪の部分[a]を携えて来た。ヤハウェはアベルとそのささげ物に目を留められた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「それらの脂肪から」。ささげられた動物の、特に良い脂肪の部分を指すと考えられる。
    reason: 原語の字義と祭儀的背景を示すため。
  - marker: b
    text: 別訳「好意をもってアベルとそのささげ物をご覧になった」。
    reason: וַיִּשַׁע に含まれる好意的な意味合いを明示する別訳を示すため。
lexical_decisions:
- source_word: וְהֶבֶל
  choice: アベルもまた
  rationale: 物語をつなぐ וְ と、カインと同様にアベルもささげたことを強調する גַם הוּא を、自然な日本語で表した。
- source_word: הֵבִיא
  choice: 携えて来た
  rationale: ささげ物を持って来るという基本的な意味を保ち、「献げた」と先取りして解釈しすぎない表現とした。
- source_word: מִבְּכֹרוֹת צֹאנוֹ
  choice: 自分の羊の群れの初子の中から何頭か
  rationale: מן の部分を表す用法を明示し、群れの初子をすべて差し出したという含みを避けた。צֹאן は羊・山羊を含み得るが、文脈上自然で平明な「羊の群れ」とした。
- source_word: וּמֵחֶלְבֵהֶן
  choice: その脂肪の部分
  rationale: חֵלֶב の字義である脂肪を保ちつつ、動物のささげ物における特定の脂肪部分を指すことが分かるようにした。
- source_word: וַיִּשַׁע
  choice: 目を留められた
  rationale: 相手のほうを見て顧慮する語義を保ち、文脈上の好意的な受容を示しながら、その現れ方までは特定しない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字神名を称号に置き換えず、音写した。
- source_word: מִנְחָתוֹ
  choice: そのささげ物
  rationale: 贈り物・供え物を意味する広い語であり、この礼拝の文脈では「ささげ物」が自然である。
theological_decisions:
- issue: וַיִּשַׁע が表す神の応答
  choice: 「目を留められた」とし、アベルとそのささげ物への好意的な顧慮を示す
  alternative: 「好意をもってご覧になった」または「受け入れられた」
  rationale: 原語は好意的な眼差しや顧慮を含意するが、受容がどのような形で示されたかは述べていない。「受け入れられた」と断定せず、原文の余地を残した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神名と祭儀的表現には品位を保った。「初子」「ささげ物」は聖書文脈で理解可能な語として採用し、過度に古風な文語表現は避けた。
