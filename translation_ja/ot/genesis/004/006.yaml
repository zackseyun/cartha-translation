  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל קָ֑יִן לָ֚/מָּה חָ֣רָה לָ֔/ךְ וְ/לָ֖/מָּה נָפְל֥וּ פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/006.yaml
  text: Then Yahweh said to Cain[a], “Why are you angry, and why has your face fallen?”
translation:
  language: ja
  text: すると、ヤハウェはカインに言われた。「なぜ怒っているのか。なぜ顔が沈んでいるのか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「なぜあなたの顔が落ちたのか」。「なぜ顔が沈んでいるのか」とも訳せる。
    reason: ヘブライ語の比喩的な慣用表現と、その訳の幅を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると、…言われた
  rationale: 物語を進めるワウ継続法の順接を、現代日本語として自然な「すると」で表した。神からカインへの発話には、文脈にふさわしい敬意を示す「言われた」を用いた。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で一般的な形に音写した。
- source_word: אֶל קָיִן
  choice: カインに
  rationale: 前置詞 אֶל の発話の相手を示す機能を、自然な日本語の助詞「に」で表した。קָיִן は慣用的な日本語表記「カイン」とした。
- source_word: לָמָּה
  choice: なぜ
  rationale: 理由を問う直接疑問を、簡潔で自然な現代日本語にした。
- source_word: חָרָה לָךְ
  choice: あなたは怒っている
  rationale: 直訳的には怒りが「燃える」という語法だが、ここでは怒っている状態を表すヘブライ語の慣用表現であるため、その意味を明瞭に訳した。
- source_word: נָפְלוּ פָנֶיךָ
  choice: 顔を伏せている
  rationale: 字義的には「あなたの顔が落ちた」。落胆や不満が顔つきに現れたことを示す慣用句として、現代日本語で理解しやすい表現を本文に採用し、原文の比喩は脚注に残した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文は称号ではなく四文字神名を明記しているため、固有名として音写し、称号への置換を避けた。
- issue: נָפְלוּ פָנֶיךָ が示す内面状態
  choice: 顔を伏せている
  alternative: 顔が落ちた、顔を曇らせている
  rationale: この表現が怒り、落胆、意気消沈などのどの感情を厳密に指すかを限定せず、外面に現れた沈んだ様子として訳した。字義的表現は脚注で示した。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、神の発話にふさわしい落ち着いた品位を保った。二つの疑問文を分け、原文の反復を明確にした。
