  source_fidelity: 第一節の「さらに…産んだ」とアベルをカインの兄弟として示す訳は、וַתֹּסֶף לָלֶדֶת אֶת־אָחִיו אֶת־הָבֶלを適切に伝えている。羊・山羊を含むצֹאןの具体化も妥当である。ただし、アベルにはwayyiqtolの「…となった」が用いられる一方、カインには「地を耕す者であった」という状態・職業記述（הָיָה עֹבֵד אֲדָמָה）が用いられているため、両者を同じく「…となった」とするより、この差を反映するのが安全である。
