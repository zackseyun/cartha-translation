  text: And she gave birth again[a], to his brother Abel. Abel became a shepherd of flocks[c][b], but Cain was a worker of the ground.
translation:
  language: ja
  text: 彼女はさらにカインの弟アベルを産んだ。[a] アベルは羊や山羊の群れを飼う者となり、カインは地を耕す者であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「さらに……産んだ」は、「続けて産んだ」または「再び産んだ」とも訳せる。ヘブライ語では直訳すると「産むことを加えた」という言い回しで、動作の反復または継続を表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּסֶף לָלֶדֶת
  choice: さらに…産んだ
  rationale: יסף＋不定詞は動作の反復または継続を表す。ここでは出産記事の順序に即し、自然な現代日本語で再度の出産を示す。
- source_word: אֶת אָחִיו אֶת הָבֶל
  choice: カインの弟アベルを
  rationale: אָחִיו の指示対象はカインであり、アベルがその兄弟であることを同格的に示す。日本語では年少の兄弟を自然に「弟」と表現できる。
- source_word: הֶבֶל
  choice: アベル
  rationale: 人名の慣用的な日本語音写を用いる。
- source_word: וַיְהִי
  choice: …となり
  rationale: ここではアベルの職業・役割を導入する。物語の展開を自然に示しつつ、「…であった」とする可能性も意味範囲に含む。
- source_word: רֹעֵה צֹאן
  choice: 羊や山羊の群れを飼う者
  rationale: רעה は牧すること、צאן は主に羊と山羊からなる小家畜の集合を指す。「羊飼い」だけよりも原語の範囲を明確にする。
- source_word: קַיִן
  choice: カイン
  rationale: 人名の慣用的な日本語音写を用いる。
- source_word: הָיָה עֹבֵד אֲדָמָה
  choice: 土地を耕す者となった
  rationale: עבד＋אדמה は土を働かせる、耕作する意。職業を自然な日本語で表しながら、単に「農夫」として意味を狭めすぎない。
- source_word: אֲדָמָה
  choice: 土地
  rationale: 耕作対象として自然な日本語であり、創世記の文脈にある地面・土壌の意味を保つ。
- source_word: וְ
  choice: （並列）
  rationale: 原語は基本的な接続詞「そして」。両者の職業に道徳的対立を読み込まないよう、日本語では読点による中立的な並列とした。
theological_decisions:
- issue: 兄弟の職業の物語上の評価
  choice: 二つの職業を道徳的評価なしに並列して描写する。
  alternative: 接続表現などによって一方の職業を他方より高く、または低く評価する。
  rationale: この節のヘブライ語は職業の違いを記述するだけで、いずれにも明示的な道徳的評価を与えていない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「羊や山羊」と具体化して צאן の範囲を示し、職業間に原文以上の対比や評価を持ち込まない。脚注記号は該当する第一文末に置いた。
