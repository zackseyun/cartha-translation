source:
  edition: WLC
  text: וְ/הָ֣/אָדָ֔ם יָדַ֖ע אֶת חַוָּ֣ה אִשְׁתּ֑/וֹ וַ/תַּ֨הַר֙ וַ/תֵּ֣לֶד אֶת קַ֔יִן וַ/תֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/001.yaml
  text: And Adam knew Eve his wife[a]; and she conceived and bore Cain, and said[b], “I have acquired a man from Yahweh.”
translation:
  language: ja
  text: アダムは妻エバと床を共にした[a]。彼女は身ごもってカイン[b]を産み、「私はヤハウェから一人の男を得た[c]」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義どおりには「知った」。ここでは夫婦の性的な交わりを表す婉曲表現。
    reason: source_idiom
  - marker: b
    text: 「カイン」という名は、ヘブライ語の「得た」（カーニーティ）と響きが似ている。
    reason: wordplay
  - marker: c
    text: ヘブライ語は字義どおりには「ヤハウェと共に、一人の男を得た」とも取れる難解な表現。「ヤハウェの助けによって」と理解することもでき、可能性は低いが「一人の男、すなわちヤハウェを得た」という読みもある。本文は、エバがカインの誕生の源をヤハウェに帰したものと理解している。
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאָדָם
  choice: アダムは
  rationale: ここでは人類一般ではなく、すでに登場している特定の人物を指す。接続詞וְによる前段とのつながりは、日本語では文脈と文の連続によって自然に示した。
- source_word: יָדַע
  choice: 床を共にした
  rationale: 字義は「知った」だが、ここでは性交を表す婉曲表現である。日本語で字義どおり「知った」とすると意味が伝わらないため、婉曲さを保ちながら明確な現代表現とした。
- source_word: אֶת חַוָּה אִשְׁתּוֹ
  choice: 妻エバと
  rationale: 目的語標識を伴う「エバ」と、その関係を示す「彼の妻」を、日本語として自然な語順にした。
- source_word: וַתַּהַר
  choice: 彼女は身ごもって
  rationale: 妊娠を表す出生記事の簡潔な表現として、現代日本語で自然な「身ごもる」を用いた。
- source_word: וַתֵּלֶד אֶת קַיִן
  choice: カインを産み
  rationale: 出生の出来事を簡潔に表し、ヘブライ語の物語の進行を保った。
- source_word: קַיִן
  choice: カイン
  rationale: 固有名を慣用的に音写した。後続するקָנִיתִיとの語呂合わせは本文で再現できないため脚注に示した。
- source_word: קָנִיתִי
  choice: 私は……得た
  rationale: קנהの基本的な意味である「得る、獲得する」を自然な日本語で表し、カインという名との語呂合わせも脚注で説明できる形にした。
- source_word: אִישׁ
  choice: 一人の男
  rationale: 新生児を指しているが、原文は通常「男」を意味するאִישׁを用いる。その特徴的な言い方を「息子」や「男の子」に平板化せず保持した。
- source_word: אֶת יְהוָה
  choice: ヤハウェから
  rationale: このאֶתの用法は難解で、「ヤハウェと共に」「ヤハウェの助けによって」などにも理解できる。本文では、誕生の源をヤハウェに帰す理解を採り、他の可能性は脚注に残した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名である四文字語を称号に置き換えず、日本語で「ヤハウェ」と音写した。
theological_decisions:
- issue: エバの言葉にあるאֶת יְהוָהの解釈
  choice: ヤハウェから
  alternative: 「ヤハウェと共に」「ヤハウェの助けによって」、または可能性は低いが「一人の男、すなわちヤハウェを」
  rationale: ヘブライ語の構文には真の曖昧さがある。本文では、エバが子の誕生の源をヤハウェに帰しているとの理解を採ったが、神の協力を表す理解や、子をヤハウェと同定する読みを断定的に排除せず脚注に明記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、出生記事にふさわしい簡潔で格調ある調子を保った。「床を共にした」は原文の婉曲性を保ちつつ、「知った」の直訳より一般読者に意味が伝わる表現である。原文で際立つ「一人の男」は不自然さを過度に解消せず保持した。
