  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל יְהוָ֑ה גָּד֥וֹל עֲוֺנִ֖/י מִ/נְּשֹֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/013.yaml
  text: And Cain said to Yahweh[a], “My iniquity is too great to bear.”
translation:
  language: ja
  text: カインはヤハウェに言った。「私の咎は重すぎて、負いきれません[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「私への罰は重すぎて、耐えられません」とも訳せる。また、「私の咎は大きすぎて、赦すことができません」という意味にもなり得る。ヘブライ語の「咎」に当たる語は、罪や罪責だけでなく、その罰を指すことがあり、「負う」に当たる動詞も、文脈によっては「赦す」を意味する。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ヘブライ語の継続的な物語叙述を、現代日本語で自然な過去形として表した。文脈上不要な接続語は補わない。
- source_word: קַיִן
  choice: カイン
  rationale: 日本語で定着している聖書人名の表記を用いた。
- source_word: אֶל־יְהוָה
  choice: ヤハウェに
  rationale: 前置詞 אֶל は発話の相手を示す「に」とし、四文字神名 יְהוָה は称号に置き換えず「ヤハウェ」と音写した。
- source_word: עֲוֺנִי
  choice: 私の咎
  rationale: עָוֹן は不義、罪責、またその結果としての罰を指し得る。「咎」は日本語でも過ちと責めの両面をある程度保ち、直後の「負う」とも自然につながる。
- source_word: גָּדוֹל ... מִנְּשֹׂא
  choice: 重すぎて、負いきれません
  rationale: 比較を表す מן を伴う構文を、日本語の程度超過表現「重すぎて」で自然に表した。נָשָׂא の基本的な「負う」を保ちつつ、話者が担えないという意味を「負いきれません」で明示した。
theological_decisions:
- issue: עֲוֺנִי מִנְּשֹׂא の意味の曖昧さ
  choice: 「私の咎は重すぎて、負いきれません」
  alternative: 「私への罰は重すぎて、耐えられません」または「私の咎は大きすぎて、赦されません」
  rationale: עָוֹן は咎・罪責・罰を、נָשָׂא は負うことを、文脈によっては赦すことを意味し得る。本文では語義の中心と比喩を保つ「咎」「負う」を採用し、カインが罪を告白しているのか、罰の重さを嘆いているのか、赦されないと訴えているのかを断定せず、別解を注記した。
translation_notes:
  register: 明瞭で現代的な標準日本語としつつ、神への直接発話にふさわしい丁寧体を用いた。「咎」はやや格調があるが一般に理解可能で、原文の意味の幅を「罪」や「罰」よりよく保つ。
