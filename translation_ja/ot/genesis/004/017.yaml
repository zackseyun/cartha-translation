id: GEN.4.17
reference: Genesis 4:17
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּ֤דַע קַ֨יִן֙ אֶת אִשְׁתּ֔/וֹ וַ/תַּ֖הַר וַ/תֵּ֣לֶד אֶת חֲנ֑וֹךְ וַֽ/יְהִי֙ בֹּ֣נֶה עִ֔יר וַ/יִּקְרָא֙ שֵׁ֣ם הָ/עִ֔יר כְּ/שֵׁ֖ם בְּנ֥/וֹ חֲנֽוֹךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/017.yaml
  text: Cain knew his wife[a], and she conceived and bore Enoch. He was building a city[d][c][b], and he named the city after his son Enoch.
translation:
  language: ja
  text: カインは妻と関係を持った[a]。彼女は身ごもり、エノクを産んだ。カインは町を建てており、その町を息子エノクの名にちなんでエノクと名づけた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は直訳すると「妻を知った」。夫婦の性的関係を表すヘブライ語の慣用表現。
    reason: cultural_note
  - marker: b
    text: 原文はより直訳的には、「その町の名を、息子の名にちなんで呼んだ」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 関係を持った
  rationale: 直訳は「知った」だが、ここでは性交を表すヘブライ語の慣用表現。現代日本語で意味が明確かつ品位のある表現を採用した。
- source_word: אִשְׁתּוֹ
  choice: 妻
  rationale: 文脈と所有接尾辞に即した自然な訳。
- source_word: וַתַּהַר
  choice: 身ごもり
  rationale: 妊娠したことを表す、物語文にふさわしい自然な日本語。
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: יָלַדの基本的意味を明瞭な現代日本語で表した。
- source_word: חֲנוֹךְ
  choice: エノク
  rationale: 日本語聖書で定着している音写を用いた。
- source_word: וַיְהִי בֹּנֶה עִיר
  choice: 町を建てているところで
  rationale: היהと分詞の組み合わせが示しうる継続・進行の含みを保った。「町」は古代の定住集落を現代日本語で過度に大規模に響かせない表現。
- source_word: וַיִּקְרָא שֵׁם הָעִיר כְּשֵׁם בְּנוֹ
  choice: その町に息子の名を取ってエノクと名づけた
  rationale: 原文の「町の名を、息子の名に従って呼んだ」という意味を、自然で明確な日本語にした。
theological_decisions:
- issue: カインの妻との性交を表す婉曲表現
  choice: 本文では「関係を持った」と意味を明示し、脚注で原文の「知った」を示す
  alternative: 「妻を知った」と直訳する
  rationale: 原文の慣用性を注記しつつ、現代の一般読者が誤解しない訳文とした。
- issue: 町の建設の動作相
  choice: 「建てているところ」として進行中の含みを保つ
  alternative: 「町を建てた」と完了的に訳す
  rationale: וַיְהִי בֹּנֶהの迂言的構文は継続・進行を示しうるため、その曖昧さを完了へ狭めない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「妻を知った」という日本語では意味が伝わりにくいため本文では慣用的意味を訳し、原文の比喩を脚注に残した。古代の עִיר は規模を確定しないため「町」とした。
