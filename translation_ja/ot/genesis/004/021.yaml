  text: וְ/שֵׁ֥ם אָחִ֖י/ו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כָּל תֹּפֵ֥שׂ כִּנּ֖וֹר וְ/עוּגָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/021.yaml
  text: And the name of his brother was Jubal[c][b][a]; he was the father of all who play the lyre and the pipe.
translation:
  language: ja
  text: 彼の兄弟の名はユバルといった。彼は、竪琴と笛[b]を奏でるすべての者の父[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「父」とは、これらの楽器を奏でる人々の祖、または先駆者という意味であり、必ずしも全員の直接の父親という意味ではない。
    reason: cultural_note
  - marker: b
    text: 「笛」に当たるヘブライ語がどのような古代楽器を指すかは確定できず、「管」または「葦笛」と訳すこともできる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אָחִיו
  choice: その弟の名は
  rationale: אָחִיו は文脈上ヤバルの兄弟を指す。日本語では系譜の順序から「弟」とするのが自然で、ヘブライ語の節構造も明瞭に伝わる。
- source_word: יוּבָל
  choice: ユバル
  rationale: ヘブライ語の人名を日本語の慣用的な聖書表記に従って音写した。
- source_word: הוּא הָיָה
  choice: 彼は…となった
  rationale: היה はここで文化的始祖として位置づけられたことを表すと理解できる。「であった」も可能だが、後代の一群の起源を述べる日本語として「となった」が自然である。
- source_word: אֲבִי כָּל
  choice: すべての者の父
  rationale: 文化的な創始者・祖を指すヘブライ語の比喩を保ち、直系の生物学的父だけを意味しないことは脚注で明示する。
- source_word: תֹּפֵשׂ
  choice: 奏でる
  rationale: 字義は「つかむ、手に取る」だが、楽器を目的語とする文脈では演奏を意味する。「奏でる」は二種の楽器に自然に用いられる。
- source_word: כִּנּוֹר
  choice: 竪琴
  rationale: 古代の弦楽器であるリラ型の楽器を指す。日本語では「竪琴」が明瞭であり、「琴」や「ハープ」より過度に特定しない。
- source_word: עוּגָב
  choice: 笛
  rationale: 正確な古代楽器の同定は不確かだが、一般に管楽器と解されるため、広く自然な「笛」を採用した。
theological_decisions:
- issue: 「父」の意味範囲
  choice: 本文では「父」を保持し、文化的始祖・先駆者という意味を脚注で示す
  alternative: 「祖」「創始者」と本文で意訳する
  rationale: 原文の比喩と系譜的表現を保ちながら、ユバルがすべての演奏者の直接の生物学的父だとの誤解を避けるため。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「といった」で人名紹介を自然にし、「奏でる」で楽器演奏の意味を簡潔に表した。原文の「父」という文化起源の比喩は本文に残し、脚注で意味範囲を補った。
