language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת אִשְׁתּ֔/וֹ וַ/תֵּ֣לֶד בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שֵׁ֑ת כִּ֣י שָֽׁת לִ֤/י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖/וֹ קָֽיִן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/025.yaml
  text: And Adam knew his wife again[a], and she bore a son and called his name Seth, for she said, “God has appointed for me another offspring in place of Abel, because Cain killed him.”
translation:
  language: ja
  text: アダムは再び妻と交わった。妻は男の子を産み、その子をセト[a]と名づけた。「カインがアベルを殺したので、神がアベルに代わるもう一人の子を私に授けてくださった」と言ったのである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「セト」という名は、ここで「置く、定める」と訳せるヘブライ語の動詞と響きが似ており、語呂合わせになっている。
    reason: 原文の命名に伴う語呂合わせは日本語本文だけでは再現できないため。
lexical_decisions:
- source_word: וַיֵּדַע
  choice: 妻と交わった
  rationale: 妻を目的語とする יָדַע は性的関係を表す婉曲表現。日本語で「妻を知った」とすると通常の認識の意味に誤解されやすいため、婉曲性を保ちつつ意味が明確な「交わった」とした。
- source_word: אָדָם
  choice: アダム
  rationale: ここでは一般名詞「人」ではなく固有名として用いられている。
- source_word: עוֹד
  choice: 再び
  rationale: 以前の夫婦の交わりと出産に続く反復を表す。
- source_word: וַתֵּלֶד בֵּן
  choice: 男の子を産み
  rationale: ילד と בן の意味を、自然で簡潔な現代日本語にした。
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: その子をセトと名づけた
  rationale: 直訳的な「その名を呼んだ」よりも、命名を意味する日本語として明瞭で自然。
- source_word: שֵׁת
  choice: セト
  rationale: 日本語聖書で定着している固有名の音写。
- source_word: שָׁת
  choice: 授けてくださった
  rationale: 基本義は「置く、定める」。ここでは失われたアベルに代わる子を神が備えたという文脈上の意味を、自然な日本語で表した。原語にあるセトとの語呂合わせは脚注で示す。
- source_word: זֶרַע אַחֵר
  choice: もう一人の子
  rationale: זֶרַע は「種、子孫、子」を表し、ここでは新たに生まれた男児を指す。集合的な「子孫」より、文脈に即した自然な表現を選んだ。
- source_word: תַּחַת הֶבֶל
  choice: アベルに代わる
  rationale: תַּחַת の代替・置換の意味を明確に表す。
- source_word: כִּי הֲרָגוֹ קָיִן
  choice: カインがアベルを殺したので
  rationale: הרג は一般的な「殺す」。日本語では代名詞の指示を明確にするため「彼を」ではなく「アベルを」とした。
theological_decisions:
- issue: セトの命名理由における神の働き
  choice: 神がアベルに代わるもう一人の子を私に授けてくださった
  alternative: 神がアベルに代わる別の子孫を私のために置かれた
  rationale: 神が失われたアベルに代わる子を備えたという本文の主張を明確にしつつ、「子孫」として将来だけに限定せず、目の前の新生児を指す文脈を保った。
- issue: 夫婦関係を示す婉曲表現
  choice: 妻と交わった
  alternative: 妻を知った
  rationale: 原文の婉曲性を尊重しながら、現代日本語で単なる認識と誤解される直訳を避けた。
- issue: 命名説明を直接話法として示すか
  choice: 「……」と言ったのである
  alternative: 神が……授けてくださったからである
  rationale: ヘブライ語には独立した「彼女は言った」がないが、一人称 לִי（私に）が女性の命名理由の発言を示す。日本語では話者を明確にするため直接話法として表した。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、物語文としての簡潔さと品位を保った。性的関係は露骨にせず、しかし意味が曖昧にならない「交わった」とした。神への敬意は「くださった」で自然に示し、原文の語呂合わせは脚注に委ねた。
