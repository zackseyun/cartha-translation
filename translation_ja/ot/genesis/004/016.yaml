source:
  edition: WLC
  text: וַ/יֵּ֥צֵא קַ֖יִן מִ/לִּ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֥שֶׁב בְּ/אֶֽרֶץ נ֖וֹד קִדְמַת עֵֽדֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/016.yaml
  text: Then Cain went out from before Yahweh and settled in the land of Nod[a], east of Eden.
translation:
  language: ja
  text: カインはヤハウェの前から出て行き、エデンの東にあるノドの地[a]に住んだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ノド」は、ヘブライ語の「さすらい」を表す語との語呂合わせであり、この章の前半でカインに告げられた裁きを思い起こさせる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: 去り
  rationale: יצאの「外へ出る」という動きを文脈に即して自然な現代日本語で表す。「立ち去った」ほど態度を強調せず、神の前から離れる動きを簡潔に保つ。
- source_word: מִלִּפְנֵי
  choice: の前から
  rationale: 字義的な「顔の前から／前から」という空間的・関係的表現を保ち、「臨在から」のように神学的意味を一義的に確定しない。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号に置き換えず、固有名として音写する。
- source_word: וַיֵּשֶׁב
  choice: 住んだ
  rationale: ישבは「座る、住む、定住する」を意味し得る。ここでは居住を表す自然で明瞭な日本語とし、「定住した」が生み得る、放浪の宣告との不必要な対立を避ける。
- source_word: בְּאֶרֶץ נוֹד
  choice: ノドの地に
  rationale: נוֹדは地名として音写し、「さすらい」との語の響きは本文で訳語に固定せず脚注で示す。
- source_word: קִדְמַת עֵדֶן
  choice: エデンの東にある
  rationale: エデンを基準とする東方の位置を、明確で自然な日本語で表す。
- source_word: עֵדֶן
  choice: エデン
  rationale: 固有地名として慣用的な日本語音写を用いる。
theological_decisions:
- issue: カインが神との関係においてどこから去ったのか
  choice: ヤハウェの前から去り
  alternative: ヤハウェの臨在から去り
  rationale: מִלִּפְנֵיの空間的・関係的な含みを保ち、神からの疎外という含意を明示的な神学用語で確定しない。
- issue: ノドでの居住と、先の「さすらう者」となる宣告との関係
  choice: 住んだ
  alternative: 定住した
  rationale: ישבの基本的な居住の意味を伝えつつ、カインが恒久的に定住して宣告を解消したとの印象を加えない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。ヘブライ語の語順を機械的に写さず、「エデンの東にある」を地名句の前に置いて自然な日本語とした。接続のוַは、単節の日本語として不要な「そして」を重ねず、動作の連続を連用形で示した。
