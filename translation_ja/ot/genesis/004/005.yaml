source:
  edition: WLC
  text: וְ/אֶל קַ֥יִן וְ/אֶל מִנְחָת֖/וֹ לֹ֣א שָׁעָ֑ה וַ/יִּ֤חַר לְ/קַ֨יִן֙ מְאֹ֔ד וַֽ/יִּפְּל֖וּ פָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/005.yaml
  text: But for Cain and for his offering he had no regard[a]. So Cain became very angry[b], and his face fell.
translation:
  language: ja
  text: しかし、主はカインとそのささげ物を顧みられなかった[a]。そこで、カインは激しく怒り、顔つきが沈んだ[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「カインとそのささげ物には、好意をもって目を留められなかった」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼の顔が落ちた」。落胆や不機嫌さが表情に現れることを表すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל קַיִן וְאֶל מִנְחָתוֹ
  choice: カインとそのささげ物を
  rationale: 前置詞 אֶל は שָׁעָה の対象を示し、カイン本人とそのささげ物の双方が神の顧みの対象とされなかったことを表す。מִנְחָה はこの礼拝的文脈では「ささげ物」が明瞭で自然。
- source_word: לֹא שָׁעָה
  choice: 顧みられなかった
  rationale: שָׁעָה はここで、目を向けて意に留めること、特に好意的に顧みることを表す。「顧みられなかった」は、単に見落としたという意味を避けつつ、神が受け入れなかった理由を本文に付加しない。主語は前節から続く主であり、日本語では自然に省略した。
- source_word: וַיִּחַר לְקַיִן מְאֹד
  choice: カインは激しく怒り
  rationale: 「燃える」を用いるヘブライ語の怒りの慣用表現を、現代日本語で自然かつ強度を保つ「激しく怒り」とした。מְאֹד の強調も「激しく」に含めた。
- source_word: וַיִּפְּלוּ פָּנָיו
  choice: 顔を伏せた
  rationale: 字義的には「彼の顔が落ちた」で、落胆や不機嫌さが表情や姿勢に現れたことを示す慣用句。「顔を伏せた」はヘブライ語の身体的イメージを保ちながら、日本語として理解しやすい。
theological_decisions:
- issue: 神がカインとそのささげ物に示した応答の性質
  choice: 「顧みられなかった」とし、好意や受容が与えられなかったことを示す一方、その理由は明記しない。
  alternative: 「受け入れられなかった」または「好意をもってご覧にならなかった」
  rationale: 本文は神がカインとそのささげ物を שָׁעָה しなかったと述べるが、その理由や判定方法をこの節では説明していない。したがって、拒絶の意味を伝えつつ、教理的理由を補わない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の応答を表す「顧みる」に簡潔で品位ある聖書的文体を残した。「ささげ物」は漢字を避け、一般読者に読みやすい表記とした。
