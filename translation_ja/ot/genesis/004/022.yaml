  text: וְ/צִלָּ֣ה גַם הִ֗וא יָֽלְדָה֙ אֶת תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כָּל חֹרֵ֥שׁ נְחֹ֖שֶׁת וּ/בַרְזֶ֑ל וַֽ/אֲח֥וֹת תּֽוּבַל קַ֖יִן נַֽעֲמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/022.yaml
  text: Zillah also bore Tubal-cain[a], a forger of every cutting tool of bronze and iron[b]. And the sister of Tubal-cain was Naamah.
translation:
  language: ja
  text: 'ツィラもトバル・カイン[a]を産んだ。彼は青銅[b]と鉄のあらゆる切断用の道具を鍛える者であった。トバル・カインの姉妹はナアマであった。


    [a] 「青銅と鉄を扱うあらゆる職人を研ぐ者（または、打ち鍛える者）」とも訳せる。「トバル・カイン」に続くヘブライ語は解釈が難しく、金属製の道具を作る者ではなく、金属を加工する職人を指すと理解することもできる。


    [b] 「銅」とも訳せる。'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「青銅と鉄を扱うあらゆる職人を研ぐ者（または、打ち鍛える者）」とも訳せる。「トバル・カイン」に続くヘブライ語は解釈が難しく、金属製の道具を作る者ではなく、金属を加工する職人を指すと理解することもできる。
    reason: alternative_reading
  - marker: b
    text: 「銅」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִלָּה גַם הִוא
  choice: ツィラも
  rationale: 接続詞と「彼女も」の付加的な意味を、系譜の流れに合う自然で簡潔な日本語にした。固有名 צִלָּה はヘブライ語の発音に沿って「ツィラ」と音写した。
- source_word: יָלְדָה
  choice: 産んだ
  rationale: 系譜における出産を表す標準的で明瞭な表現。
- source_word: תּוּבַל קַיִן
  choice: トバル・カイン
  rationale: 複合形の人名として訳さず、中黒を用いて慣用的に音写した。
- source_word: לֹטֵשׁ
  choice: 鍛える者
  rationale: 金属を打つ、研ぐ、鍛造するという語義範囲を持つ分詞。本文では後続する青銅と鉄に即して、金属製品を作る職人の働きを自然に表した。
- source_word: כָּל חֹרֵשׁ
  choice: あらゆる刃物
  rationale: 構文と語義には難しさがあるが、לֹטֵשׁ および金属名との組み合わせから、鍛えたり研いだりして作る器具を指すとの理解を採った。対象を過度に広げないため「道具」ではなく「刃物」とし、別解は脚注に示した。
- source_word: נְחֹשֶׁת
  choice: 青銅
  rationale: 銅または青銅を指し得る語。古代の金属を列挙する文脈で慣用的な「青銅」を本文に採用し、「銅」を脚注に示した。
- source_word: בַרְזֶל
  choice: 鉄
  rationale: 当該金属を指す標準的な訳語。
- source_word: אֲחוֹת
  choice: 姉妹
  rationale: ヘブライ語は年長・年少を特定しないため、「姉」または「妹」に限定せず「姉妹」とした。
- source_word: נַעֲמָה
  choice: ナアマ
  rationale: 人名としてヘブライ語に沿って音写した。
theological_decisions:
- issue: トバル・カインの職能を表す難解な句
  choice: 本文では金属製の刃物を鍛える者とした
  alternative: 青銅と鉄を扱う職人、またはそのような職人を研ぐ者・打ち鍛える者
  rationale: ヘブライ語 לֹטֵשׁ כָּל חֹרֵשׁ の統語関係と חֹרֵשׁ の意味は確定しにくい。本文には文脈上まとまりのよい理解を置きつつ、職人を指す可能性を脚注に残し、技術史に関する断定を避けた。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、系譜にふさわしい簡潔で落ち着いた文体とした。「姉妹」によって年齢関係を補わず、原文の曖昧さを保持した。
