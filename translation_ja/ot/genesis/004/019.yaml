  text: וַ/יִּֽקַּֽח ל֥/וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽ/אַחַת֙ עָדָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית צִלָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/019.yaml
  text: Lamech took for himself two wives[a]. The name of the one was Adah[b], and the name of the other was Zillah.
translation:
  language: ja
  text: レメクは二人の妻をめとった。一人の名はアダ、もう一人の名はツィラであった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח לוֹ
  choice: 自分のために……めとった
  rationale: לקח の基本的な「取る」という語感と、לוֹ の本人のためという含意を保ちつつ、妻を迎える文脈であることが自然に伝わる日本語とした。
- source_word: שְׁתֵּי נָשִׁים
  choice: 二人の妻
  rationale: נָשִׁים は「女たち」とも訳せるが、לקח と結び付くこの文脈では婚姻関係を指すため、「妻」とした。
- source_word: שֵׁם הָאַחַת
  choice: 一人の名は
  rationale: 二人のうち一方を示すヘブライ語の命名表現を、簡潔で自然な日本語にした。
- source_word: וְשֵׁם הַשֵּׁנִית
  choice: もう一人の名は
  rationale: הַשֵּׁנִית は字義的には「第二の者」だが、二人のうち残る一人を指すため、現代日本語で自然な「もう一人」とした。
- source_word: עָדָה
  choice: アダ
  rationale: 人名を現代日本語で一般的かつ簡潔に音写した。
- source_word: צִלָּה
  choice: ツィラ
  rationale: 語頭の צ と重子音を踏まえ、原音に比較的近い形で音写した。
theological_decisions:
- issue: レメクが複数の妻を持ったことへの評価を訳文に加えるか
  choice: 「二人の妻」と事実のみを明示し、道徳的評価は加えない
  alternative: 「二人の女を妻にした」などと説明的に訳し、複婚を強調する
  rationale: 本文は複数の妻を迎えた事実を記すが、この節自体ではその行為を明示的に評価していないため、訳文でも評価を付加しない。
translation_notes:
  register: 明快な現代標準日本語を用いながら、叙事文としての簡潔さと品位を保った。「娶った」は避け、読みやすいよう「めとった」と平仮名で表記した。
