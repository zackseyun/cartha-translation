source:
  edition: WLC
  text: וְ/עַתָּ֖ה אָר֣וּר אָ֑תָּה מִן הָֽ/אֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת פִּ֔י/הָ לָ/קַ֛חַת אֶת דְּמֵ֥י אָחִ֖י/ךָ מִ/יָּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/011.yaml
  text: And now you are cursed from the ground[c][b][a], which has opened its mouth to receive your brother’s blood from your hand.
translation:
  language: ja
  text: 今や、あなたは、あなたの手からあなたの兄弟の血を受け取るために口を開いた大地から、のろわれる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「大地によってのろわれる」または「大地から離れて、のろわれる」とも訳せる。ヘブライ語は、のろいが大地に由来することを指すとも、カインが大地から引き離されることを指すとも解釈できる。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: 今
  rationale: 接続辞と時の副詞が、カインの行為に対する直後の帰結を導く。現代日本語では「今」で簡潔かつ自然にその機能を表せる。
- source_word: אָרוּר אָתָּה
  choice: あなたは……のろわれる
  rationale: カインがのろいの下に置かれることを明確にしつつ、神の宣告として自然な日本語にした。
- source_word: מִן הָאֲדָמָה
  choice: 大地から
  rationale: 前置詞 מִן の起点・源・分離という幅をできるだけ保つ。「大地によって」と限定せず、かといって本文で追放の意味に決めない。曖昧さは脚注で示す。
- source_word: אֲשֶׁר פָּצְתָה אֶת פִּיהָ
  choice: その大地は口を開き
  rationale: 大地を口のあるものとして描く原文の擬人表現をそのまま保った。
- source_word: לָקַחַת
  choice: 受け入れた
  rationale: 基本義は「取る」だが、流された血を大地がのみ込む文脈では「受け入れる」が自然で、原文の像も保てる。
- source_word: דְּמֵי אָחִיךָ
  choice: あなたの兄弟の血
  rationale: 原文は「血」の複数形だが、ここでは流血・殺害された者の血を表すヘブライ語的用法であり、日本語では単数の「血」が自然である。
- source_word: מִיָּדֶךָ
  choice: あなたの手から流された
  rationale: 「あなたの手から」という像と、カインの直接的責任を保持するため、「流された」を補って血との関係を自然な日本語で明示した。
theological_decisions:
- issue: のろいと大地との関係
  choice: 「大地から」と訳し、関係の方向を本文で一義的に定めない
  alternative: 「大地によってのろわれる」または「大地から追われてのろわれる」
  rationale: מִן は、のろいの源・領域を示すとも、大地からの分離を示すとも取り得る。続く節との関係を含め、原文の神学的緊張を脚注とともに保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の宣告にふさわしい簡潔で重みのある調子と、大地が口を開く原文の鮮烈な擬人表現を保った。「兄」ではなく原語に即して「兄弟」とし、本文だけで年長関係を補わない。
