  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר ל֣/וֹ יְהוָ֗ה לָ/כֵן֙ כָּל הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַ/יָּ֨שֶׂם יְהוָ֤ה לְ/קַ֨יִן֙ א֔וֹת לְ/בִלְתִּ֥י הַכּוֹת אֹת֖/וֹ כָּל מֹצְאֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/015.yaml
  text: Then Yahweh said to him[a], “Therefore whoever kills Cain, vengeance will be taken on him sevenfold.” And Yahweh put a mark on Cain[b], lest anyone finding him should strike him.
translation:
  language: ja
  text: そこでヤハウェは彼に言った。「それゆえ、カインを殺す者はだれであれ、七倍の報復を受ける[a]。」そしてヤハウェは、だれもカインを見つけて彼を打たないように、カインにしるし[b]を付けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「七倍に報復される」。ヘブライ語は簡潔な受動表現で、報復する者を明示していない。文脈上、カインを殺す者が報復の対象となる。
    reason: 原文の受動表現とその曖昧さを示すため。
  - marker: b
    text: 「印」とも訳せる。ヘブライ語は広く「しるし」を意味し、それがどのようなものだったかは本文に記されていない。
    reason: 語彙上の別訳と、しるしの性質が特定されていないことを示すため。
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神の固有名を一般称号に置き換えず、ヘブライ語の四文字名を日本語で明示する。
- source_word: לָכֵן
  choice: それゆえ
  rationale: カインへの神の応答が示す推論・帰結のつながりを、格調を保った現代日本語で表す。
- source_word: כָּל הֹרֵג קַיִן
  choice: カインを殺す者はだれであれ
  rationale: 分詞を用いた不特定かつ包括的な表現を、自然な日本語で保持する。
- source_word: שִׁבְעָתַיִם
  choice: 七倍
  rationale: 報復の程度を表す副詞的用法を簡潔に訳す。単に七回という回数に限定しない。
- source_word: יֻקָּם
  choice: 報復を受ける
  rationale: נקםの受動形を踏まえ、カインを殺す者が報復の対象となるという文脈上の意味を明瞭にする一方、行為者は明示しない。
- source_word: אוֹת
  choice: しるし
  rationale: 語が持つ広い意味を保ち、その形状や身体的性質を本文に持ち込まない。
- source_word: לְבִלְתִּי הַכּוֹת אֹתוֹ
  choice: 彼を打たないように
  rationale: 否定を伴う目的を自然に表し、נכהを文脈だけから『殺す』に限定せず『打つ』と訳す。
- source_word: כָּל מֹצְאוֹ
  choice: 彼を見つけた者がだれも
  rationale: 否定目的節と統合し、不特定のすべての発見者を指す意味を自然な日本語にする。
theological_decisions:
- issue: カインに与えられたאוֹתの性質
  choice: 「しるし」と訳し、その形や種類を特定しない。
  alternative: 「印」と訳し、目に見える標識を強く示唆する。
  rationale: ヘブライ語は身体上の印、物体、象徴などを特定していないため、後代の推測を持ち込まず曖昧さを保つ。
- issue: 七倍の報復を受ける者
  choice: カインを殺す者が報復を受けることを日本語で明確にする。
  alternative: 「七倍復讐される」のように受益者または対象が曖昧なまま訳す。
  rationale: 受動形そのものは簡潔であるが、警告の文脈はカインを殺す者が報復の対象になることを示す。報復の行為者は原文どおり明示しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「そこで」「それゆえ」で物語の進行と論理関係を示し、「しるし」は平仮名表記にして特定の物理的な印という含意を抑えた。
