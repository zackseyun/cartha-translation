id: GEN.4.3
reference: Genesis 4:3
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַֽ/יְהִ֖י מִ/קֵּ֣ץ יָמִ֑ים וַ/יָּבֵ֨א קַ֜יִן מִ/פְּרִ֧י הָֽ/אֲדָמָ֛ה מִנְחָ֖ה לַֽ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/003.yaml
  text: And in the course of time[c][b][a], Cain brought to Yahweh an offering from the fruit of the ground.
translation:
  language: ja
  text: 時がたって[a]、カインは大地の実り[b]の中から、ヤハウェへのささげ物を持って来た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「日々の終わりから」。ここでは、ある期間が過ぎた後という意味。
    reason: lexical_alternative
  - marker: b
    text: 「大地の産物」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: （独立には訳さず、文脈上「時がたって」に含める）
  rationale: 物語を次の出来事へ進める叙述形式。現代日本語では定型的な「さて、…となった」を置くより、続く時の表現と一体化するほうが自然である。
- source_word: מִקֵּץ יָמִים
  choice: 時がたって
  rationale: 字義的には「日々の終わりから」だが、ここでは一定期間の経過を表す慣用句であり、終末論的な意味を持たせない自然な表現とした。
- source_word: וַיָּבֵא
  choice: 持って来た
  rationale: בואのヒフィル形で「持って来る、携えて来る」の意。目的語がささげ物であるため、「ささげた」と意訳し切らず、動作そのものを保った。
- source_word: קַיִן
  choice: カイン
  rationale: 日本語聖書で定着した人名表記を用いた。
- source_word: מִפְּרִי הָאֲדָמָה
  choice: 大地の実りの中から
  rationale: מִןの部分・選択の含みと、פְּרִיの「実り、産物」を表す。אֲדָמָהは創世記2―4章における「人」と「大地」の語彙的連関を意識し、「大地」とした。
- source_word: מִנְחָה
  choice: ささげ物
  rationale: 神や上位者に差し出す贈り物・供え物を指す広い語。ここでは祭儀の種類を過度に限定しない。
- source_word: לַיהוָה
  choice: ヤハウェへの
  rationale: 前置詞לְの方向・受益の関係を「への」で表し、神名יהוהは固有名として音写した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文に固有の神名が明記されているため、それを普通名詞の称号に置き換えず、現代日本語で一般的な学術的音写を用いた。
- issue: מִקֵּץ יָמִים の意味
  choice: 一定期間の経過を表す「時がたって」
  alternative: 日々の終わりに／終わりの日に
  rationale: この文脈はカインがささげ物を持参するまでの時間経過を述べており、終末についての主張とは解さない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「持って来た」によって原文の動作を保ち、「ささげ物」でמִנְחָהの広い意味域を維持した。脚注記号は該当語句の直後に配置した。
