id: GEN.4.14
reference: Genesis 4:14
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜/י הַ/יּ֗וֹם מֵ/עַל֙ פְּנֵ֣י הָֽ/אֲדָמָ֔ה וּ/מִ/פָּנֶ֖י/ךָ אֶסָּתֵ֑ר וְ/הָיִ֜יתִי נָ֤ע וָ/נָד֙ בָּ/אָ֔רֶץ וְ/הָיָ֥ה כָל מֹצְאִ֖/י יַֽהַרְגֵֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/014.yaml
  text: Look[a], today you have driven me away from the face of the ground, and I will be hidden from your face. I will be a wanderer and a fugitive on the earth[b], and whoever finds me will kill me.
translation:
  language: ja
  text: ご覧ください。あなたは今日、私を大地の表から追い出しになりました。私はあなたの御顔を避けて、身を隠すことになります[a]。私は地上[b]をさまよい、逃げ回る者となり、私を見つける者は誰でも私を殺すでしょう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私はあなたの御前から身を隠すことになります」または「私はあなたの御前から隠されることになります」。ヘブライ語は直訳すると「あなたの顔から、私は隠される（身を隠す）」であり、態には受動的・再帰的な幅がある。
    reason: lexical_alternative
  - marker: b
    text: 別訳「地で」または「土地で」。ヘブライ語の אֶרֶץ は、文脈により「地上」「地」「土地」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: 見よ
  rationale: 注意を促し、訴えを強調する談話標識。現代日本語でも聖書本文にふさわしい簡潔で dignified な表現として「見よ」を用いた。
- source_word: גֵּרַשְׁתָּ אֹתִי
  choice: 私を…追い出されました
  rationale: גרשׁ の強制的な排除の意味を保ちつつ、カインが神に直接語る文脈に合わせて敬語で自然に表した。
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: 大地の表から
  rationale: 直訳的な「大地の面」より自然な日本語としながら、אֲדָמָה と「表」という原文の空間的イメージ、および直前の大地への言及を保った。
- source_word: וּמִפָּנֶיךָ אֶסָּתֵר
  choice: 私はあなたの御顔から隠されることになります
  rationale: ニファル形の受動・再帰的な曖昧さを安易に能動へ限定せず、「御顔」という具体的な原文表現も保持した。
- source_word: נָע וָנָד
  choice: さまよい、逃げ回る者
  rationale: 二つの語が表す、定住できず移動し続ける状態と追われるような不安定さを、日本語で二要素を残して表した。
- source_word: בָּאָרֶץ
  choice: 地上
  rationale: אֶרֶץ の広い意味を本文では「地上」とし、地域的な「地／土地」の可能性は脚注に残した。
- source_word: כָל מֹצְאִי
  choice: 私を見つける者は誰でも
  rationale: כָל と分詞による不定の普遍性を、自然な日本語の「誰でも」で表した。
- source_word: יַהַרְגֵנִי
  choice: 私を殺すでしょう
  rationale: הרג の一般的な意味を明瞭な現代日本語で表した。
theological_decisions:
- issue: וּמִפָּנֶיךָ אֶסָּתֵר における神の御顔・臨在と態の曖昧さ
  choice: 私はあなたの御顔から隠されることになります
  alternative: 私はあなたの御前から身を隠すことになります／私はあなたの御前から隠されることになります
  rationale: 原文の「あなたの顔から」という具体的な慣用表現と、ニファル形が許す受動的・再帰的理解の幅を本文と脚注で保持し、神からの疎外が自発的なのか結果として生じるのかを一方に断定しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調とし、神への直接話法には「追い出されました」を用いて敬意を示した。「御顔」は原文の比喩と神の臨在との関係を保つための荘重だが理解可能な語。「見よ」はやや文語的だが、注意喚起の力を簡潔に保つため採用した。
