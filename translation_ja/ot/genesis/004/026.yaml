  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/לְ/שֵׁ֤ת גַּם הוּא֙ יֻלַּד בֵּ֔ן וַ/יִּקְרָ֥א אֶת שְׁמ֖/וֹ אֱנ֑וֹשׁ אָ֣ז הוּחַ֔ל לִ/קְרֹ֖א בְּ/שֵׁ֥ם יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/026.yaml
  text: And to Seth also a son was born[a], and he called his name Enosh[b]. At that time people began to call on the name of Yahweh.
translation:
  language: ja
  text: セトにも男の子が生まれ、セトはその子をエノシュと名づけた。そのころ、人々はヤハウェの名を呼び求め始めた。[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より字義的には、「そのころ、ヤハウェの名を呼び求めることが始められた」。
    reason: lexical_alternative
  - marker: b
    text: この動詞を「冒瀆する」という意味に解し、「そのころ、人々はヤハウェの名を冒瀆し始めた」とする少数説もある。
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְשֵׁת גַּם הוּא יֻלַּד בֵּן
  choice: セトにも男の子が生まれ
  rationale: לְשֵׁתを誕生の恩恵を受ける者として「セトにも」とし、受動形יֻלַּדを自然な日本語の「生まれ」で表した。גַּם הוּאの付加の意味も「にも」に込めた。
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ אֱנוֹשׁ
  choice: セトはその子をエノシュと名づけた
  rationale: 直訳的な「彼はその名をエノシュと呼んだ」より自然で明確な日本語とした。主語は文脈上セトなので、代名詞の曖昧さを避けるため名前を補った。
- source_word: אֱנוֹשׁ
  choice: エノシュ
  rationale: 固有名として音写した。一般名詞では「人」「死すべき人」を表し得るが、本文では語義を訳し込まない。
- source_word: אָז
  choice: そのころ
  rationale: 時間を示す副詞の意味を、現代日本語として自然な形で表した。
- source_word: הוּחַל
  choice: 始めた
  rationale: このホファル形を開始の意味に理解し、不特定の行為者を日本語では「人々」として示した。より字義的な受動表現と、「汚された／冒瀆された」と取る少数説は脚注に残した。
- source_word: לִקְרֹא בְּשֵׁם
  choice: 名を呼び求める
  rationale: この慣用句が表す、神の名を唱えて祈り、礼拝のうちに助けを求める意味を簡潔に表した。「名によって呼ぶ」「名を宣べ伝える」という可能性を不必要に本文へ限定的に持ち込まない表現である。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 四文字神名を称号「主」に置き換えず、固有名として音写した。
theological_decisions:
- issue: הוּחַל לִקְרֹא בְּשֵׁם יְהוָה の解釈
  choice: 人々はヤハウェの名を呼び求め始めた
  alternative: 「ヤハウェの名を呼び求めることが始められた」、または「ヤハウェの名を冒瀆し始めた」
  rationale: 開始を表す解釈と、神への祈願・礼拝を表す慣用句の理解が文脈上もっとも自然である。一方、動詞を「冒瀆する」の語根に結びつける解釈も存在するため、本文で排除せず脚注に示した。
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主
  rationale: 原文が固有の神名を用いていることを可視化し、称号への置換によって生じる情報の損失を避けた。
translation_notes:
  register: 明快で格調を保った現代標準日本語。系図的な叙述の簡潔さを保ちつつ、「彼」の指示対象が曖昧にならないよう「セト」を明示した。論争のある末尾の句は、自然な本文訳と二つの脚注によって原文の受動性および少数説を保持した。
