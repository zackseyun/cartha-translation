id: GEN.4.7
reference: Genesis 4:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הֲ/ל֤וֹא אִם תֵּיטִיב֙ שְׂאֵ֔ת וְ/אִם֙ לֹ֣א תֵיטִ֔יב לַ/פֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְ/אֵלֶ֨י/ךָ֙ תְּשׁ֣וּקָת֔/וֹ וְ/אַתָּ֖ה תִּמְשָׁל בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/007.yaml
  text: If you do well[a], will there not be acceptance? But if you do not do well, sin is crouching at the door; its desire is for you[d][c][b], but you must rule over it.
translation:
  language: ja
  text: あなたが正しいことをするなら、受け入れられるのではないか。[a] しかし、正しいことをしないなら、罪が戸口でうずくまっている。[b] その欲望はあなたに向かう。[c] だが、あなたは罪を治めなければならない。[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「上げること」。カインの顔が上げられること、または彼が受け入れられることを指すとも考えられる。
    reason: lexical_alternative
  - marker: b
    text: 「罪のいけにえが戸口に横たわっている」とも訳せる。ただし、この箇所の描写は、獣のようにうずくまる罪を人格化したものと理解するほうが自然である。
    reason: alternative_reading
  - marker: c
    text: 「その慕い」または「その衝動」とも訳せる。創世記3章16節のよく似た表現を参照。
    reason: cross_reference
  - marker: d
    text: 「あなたは罪を治めるであろう」または「あなたは罪を治めることができる」とも訳せる。ヘブライ語は、勧告、予告、可能性のいずれにも解し得る。
    reason: alternative_reading
lexical_decisions:
- source_word: תֵּיטִיב
  choice: 正しいことをする
  rationale: ヒフィル形はここで、単に調子がよいことではなく、道徳的に良いこと、正しいことを行う意味を表す。現代日本語として明瞭であり、条件文の簡潔さも保てる。
- source_word: שְׂאֵת
  choice: 受け入れられる
  rationale: 語義の根底には「上げること」があるが、文脈ではカインの顔が上げられること、または神に受け入れられることを指すと考えられる。本文では意味が通る「受け入れられる」とし、原文の簡潔さと曖昧さは脚注に残した。
- source_word: לַפֶּתַח
  choice: 戸口で
  rationale: 場所を示す率直な表現であり、罪が敷居のすぐそばに潜むという鮮明な比喩を自然な日本語で伝える。
- source_word: חַטָּאת
  choice: 罪
  rationale: この語は「罪」と「罪のいけにえ」の両義を持ち得るが、「うずくまる」という捕食動物を思わせる描写は、人格化された罪をより自然に示す。別解は脚注に示した。
- source_word: רֹבֵץ
  choice: うずくまっている
  rationale: 動物が身を伏せ、襲いかかろうとしている姿を示し得る分詞である。「うずくまっている」は、継続する目前の脅威を過度な説明なしに保つ。
- source_word: תְּשׁוּקָתוֹ
  choice: その欲望
  rationale: 欲求、慕い求める思いを表す語である。「欲望」は創世記3章16節との語句上の対応を保ちつつ、その具体的な性質を本文で限定しすぎない。
- source_word: תִּמְשָׁל בּוֹ
  choice: あなたは罪を治めなければならない
  rationale: 未完了形は勧告、予告、可能性のいずれにも解し得る。警告と訓戒の文脈では義務・勧告として訳すのが自然だが、他の可能性は脚注に残した。「治める」は支配権を行使する原語の力を保つ。
theological_decisions:
- issue: 結びの句が、罪を治めるよう命じるのか、治めると予告するのか、それとも治め得る能力を述べるのか
  choice: 本文では勧告として「あなたは罪を治めなければならない」とした。
  alternative: 「あなたは罪を治めるであろう」、または「あなたは罪を治めることができる」。
  rationale: ヘブライ語の未完了形は複数のニュアンスを許す。神がカインに警告している文脈では勧告が最も自然だが、必然的な成功の約束や、人間の能力についての体系的教理を本文に持ち込まないよう、予告と可能の読みも脚注に明記した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の警告としての厳粛さを保った。「その欲望はあなたに向かう」は、解釈を加えて「襲おうとする」などとせず、原文の簡潔さと創世記3章16節との対応を保持している。
