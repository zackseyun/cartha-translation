base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/009.yaml
  text: Then Yahweh said to Cain[a], “Where is Abel your brother?” And he said, “I do not know. Am I my brother’s keeper?”
translation:
  language: ja
  text: すると、ヤハウェはカインに言われた。「あなたの兄弟アベルはどこにいるのか。」カインは答えた。「私は知らない[a]。私が兄弟の番人なのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は知らなかった」。ヘブライ語の完了形は過去の否定とも訳せるが、文脈上は現在知っていることを否定する発言として自然に読める。
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 神名四文字を称号に置き換えず、一般的な日本語音写で固有名として示した。
- source_word: וַיֹּאמֶר
  choice: すると、…言われた／…答えた
  rationale: 最初の接続形は物語の進行を「すると」で表した。二つ目は返答であることが文脈上明らかなため、自然な日本語の「答えた」とした。
- source_word: אֵי
  choice: どこにいるのか
  rationale: 場所を問う疑問語。人物について尋ねる自然な日本語として存在を表す「いる」を補った。
- source_word: הֶבֶל אָחִיךָ
  choice: あなたの弟アベル
  rationale: אָחִיךָ は直訳すれば「あなたの兄弟」だが、文脈上アベルがカインの弟であり、日本語では具体的な続柄を示すほうが自然である。固有名は慣用表記「アベル」とした。
- source_word: לֹא יָדַעְתִּי
  choice: 知りません
  rationale: 完了形は過去の否定とも取り得るが、この対話では現在の無知を主張する表現として自然に理解できる。別案は脚注に示した。
- source_word: הֲשֹׁמֵר
  choice: 番人なのでしょうか
  rationale: שמר の「見張る、守る」という意味と、責任を否定する修辞疑問の鋭さを簡潔に保つ。「見守る者」よりも解釈的な情愛を加えにくい。
- source_word: אָנֹכִי
  choice: 私は
  rationale: 独立代名詞の強調を日本語の主題提示「私は」によって表し、修辞疑問の焦点を保った。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主／エホバ
  rationale: 原文が固有の神名を用いているため、称号「主」に置換せず音写した。母音の再構成には不確実性があるが、「ヤハウェ」は現代日本語で広く用いられる学術的表記である。
- issue: カインの問いにおける責任の含意
  choice: 弟の番人
  alternative: 弟を見守る者／弟を守る責任がある者
  rationale: 原文は修辞疑問によって責任を退けているが、その責任の範囲を説明してはいない。「番人」は比喩と神学的緊張を残し、説明的な意味を加えない。
translation_notes:
  register: 明快な現代標準語を用いながら、神の発話には「言われた」を用いて格調を保った。カインの返答は簡潔にし、原文の唐突さと反抗的な修辞疑問を弱めないようにした。
