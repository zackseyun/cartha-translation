  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לֶ֜מֶךְ לְ/נָשָׁ֗י/ו עָדָ֤ה וְ/צִלָּה֙ שְׁמַ֣עַן קוֹלִ֔/י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑/י כִּ֣י אִ֤ישׁ הָרַ֨גְתִּי֙ לְ/פִצְעִ֔/י וְ/יֶ֖לֶד לְ/חַבֻּרָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/023.yaml
  text: 'And Lamech said to his wives[a], “Adah and Zillah, hear my voice; wives of Lamech, listen to my word: for I have killed a man for wounding me[b], even a young man for striking me.”'
translation:
  language: ja
  text: 'レメクは妻たちに言った。


    「アダとツィラよ、私の声を聞け。


    レメクの妻たちよ、私の言葉に耳を傾けよ。


    私は、私に傷を負わせた男を殺した。[b]


    私に打ち傷を負わせた若者を。[a]」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「私は自分の傷のために男を、自分の打ち傷のために若者を殺した」。ヘブライ語は「傷」「打ち傷」という名詞を用いており、誰が傷を負わせたかを文法上は明示していない。
    reason: lexical_alternative
  - marker: b
    text: レメクの言葉を、実際に行った殺害の報告ではなく、「私を傷つける男なら殺す」という脅し、または一般的な豪語と理解する見方もある。
    reason: alternative_reading
lexical_decisions:
- source_word: לְנָשָׁיו
  choice: 妻たちに
  rationale: 文脈上、レメクの二人の妻を指すため、現代日本語で自然かつ明確な「妻たち」とした。
- source_word: שְׁמַעַן קוֹלִי
  choice: 私の声を聞け
  rationale: 「声」という具体的な表現と、複数女性に向けた命令の直接性を保った。
- source_word: הַאְזֵנָּה אִמְרָתִי
  choice: 私の言葉に耳を傾けよ
  rationale: 前行との詩的並行を保ちつつ、注意深く聞くというヒフィル形の含意を自然な日本語で表した。
- source_word: כִּי
  choice: （独立した宣言として表現）
  rationale: ここでは後続の発言内容または根拠を導く。日本語で「なぜなら」を明示すると不自然で論理関係を限定しすぎるため、改行によって強調された宣言として表した。
- source_word: אִישׁ
  choice: 男
  rationale: 通常の語義を採り、後続の「若者」との年齢または身分上の対照を残した。
- source_word: הָרַגְתִּי
  choice: 私は…殺した
  rationale: 完了形を最も素直な過去の出来事として訳した。現在完了的な結果性を日本語で過剰に補わない。
- source_word: לְפִצְעִי
  choice: 私に傷を負わせた
  rationale: 字義的には「私の傷のために」だが、文脈上の報復の関係を自然に表した。ただし名詞表現の余地は脚注に残した。
- source_word: יֶלֶד
  choice: 若者
  rationale: 「子ども」「少年」も可能だが、אִישׁとの詩的並行と暴力的な文脈において、年少者を広く指し得る「若者」が適切である。
- source_word: לְחַבֻּרָתִי
  choice: 私に打ち傷を負わせた
  rationale: חַבּוּרָהの打撃による傷・あざという意味を示し、前行の「傷」とわずかに区別した。
theological_decisions:
- issue: レメクの言葉が実際の殺害報告か、脅し・一般的な豪語か
  choice: 実際の殺害を過去形で報告する言葉として本文を訳した。
  alternative: 「私を傷つける男なら殺す」のような脅し、または一般的な豪語として読む。
  rationale: ヘブライ語の完了形は最も自然には完了した行為を表すが、文脈上、様態的・格言的な理解も提案されるため脚注で示した。
- issue: 殺害の動機を正当防衛と見るか報復と見るか
  choice: 傷を負わせたことへの殺害として示し、正当防衛とは明記しない。
  alternative: 襲撃に対する正当防衛として説明する。
  rationale: 原文は時間的状況や道徳的正当性を明示しないため、正当防衛という解釈を本文に持ち込まず、緊張を保った。
- issue: 「男」と「若者」が同一人物か二人か
  choice: 二行目を省略構文として訳し、同一人物を並行表現で言い換えた可能性と、二人を指す可能性の双方を残した。
  alternative: 二度「殺した」と補い、二人の被害者だったことを明示する。
  rationale: ヘブライ語では動詞が一度だけ現れ、詩的並行法は同一対象の言い換えにも二つの対象にも理解できるため、明示的に決めなかった。
translation_notes:
  register: 現代標準日本語の簡潔で格調ある詩的発話とした。「聞け」「耳を傾けよ」の並行を保ち、古語的すぎる語尾は避けた。二行目の殺害動詞を省略し、原文の詩的並行と、被害者が一人か二人かという曖昧さを保持した。
