  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: כִּ֤י תַֽעֲבֹד֙ אֶת הָ֣/אֲדָמָ֔ה לֹֽא תֹסֵ֥ף תֵּת כֹּחָ֖/הּ לָ֑/ךְ נָ֥ע וָ/נָ֖ד תִּֽהְיֶ֥ה בָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/012.yaml
  text: When you work the ground[a], it will no longer yield its strength to you[d][c][b]. You will be a wanderer and a fugitive on the earth.
translation:
  language: ja
  text: あなたが土地を耕すとき[a]、土地はもはやその力をあなたに与えない[b]。あなたは地上で、さまよう者、さすらう者となる[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「というのは、あなたが土地を耕すと」または「あなたが土地を耕すなら」。ヘブライ語の接続詞は、因果、時、条件のいずれを示すとも取り得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳「土地はその力をあなたに与え続けることはない」。ここで「力」は土地の生産力を指す。
    reason: lexical_alternative
  - marker: c
    text: 「さまよう者、さすらう者」と訳した二つのヘブライ語は意味が重なり、カインが落ち着く場所を持てない状態を強調している。別訳「さすらい続ける者」。
    reason: lexical_alternative
  - marker: d
    text: 「地上」は「地で」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: 〜しても
  rationale: ここでは、カインが今後土地を耕す場合と、その結果が実らないこととの関係を自然な日本語で示す。ヘブライ語は因果・時・条件のいずれにも取り得るため、別訳を脚注に残す。
- source_word: תַעֲבֹד אֶת־הָאֲדָמָה
  choice: 土地を耕する
  rationale: עבד はこの文脈で土地を働かせる、すなわち耕作することを表す。「耕す」は農耕の意味を明確にし、現代日本語として自然である。
- source_word: לֹא תֹסֵף תֵּת
  choice: もはや……与えない
  rationale: יסף＋不定詞の「これ以上続けて〜しない」という意味を簡潔に表しつつ、原文の「与える」という比喩を保持する。
- source_word: כֹּחָהּ
  choice: その力
  rationale: 直訳的な「その力」を採り、土地の生産力・肥沃さを指す比喩を保つ。
- source_word: נָע וָנָד
  choice: さまよい、流浪する者
  rationale: 意味の重なる二語を一語にまとめず、定住できない状態を強める並列表現として再現する。
- source_word: בָאָרֶץ
  choice: 地上を
  rationale: 原初史の広い文脈に合う「地上」を採用する。ただし「その地で」という地域的な理解も可能なので脚注に示す。
theological_decisions:
- issue: カインへの裁きの範囲
  choice: 土地の生産力がカインに与えられないことと、定住できず流浪することの双方を具体的な裁きとして示す。
  alternative: 心理的な不安だけを指す、または特定地域からの追放だけを指すと解する。
  rationale: 本文は農耕上の不毛と不安定な生活状態を並べており、どちらか一方へ還元しない。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。「土地」を反復して主語を明示し、読みやすさを確保した。「その力」は原文の擬人的比喩を残し、「さまよい、流浪する者」で重複する二語の強調を保った。
