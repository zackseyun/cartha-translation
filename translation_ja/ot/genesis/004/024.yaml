  text: כִּ֥י שִׁבְעָתַ֖יִם יֻקַּם קָ֑יִן וְ/לֶ֖מֶךְ שִׁבְעִ֥ים וְ/שִׁבְעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/024.yaml
  text: For Cain is avenged sevenfold[b][a], and Lamech seventy-sevenfold.
translation:
  language: ja
  text: 'なぜなら、カインのためには七倍の復讐がなされる。[a]

    そして、レメクのためには七十七倍。[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「復讐がなされるであろう」とも訳せる。ヘブライ語の動詞は、確実な将来の復讐を表すことがある。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「七十と七」。すなわち「七十七倍」。「七十七回」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: （明示せず、文脈上の理由・確言を詩的な文の流れに反映）
  rationale: 前節の誇示を根拠づける接続語だが、日本語で「なぜなら」を置くと説明調になりすぎるため、前後関係の中に含ませた。確言のニュアンスも文全体から伝わる。
- source_word: שִׁבְעָתַיִם
  choice: 七倍
  rationale: 復讐の度合いを表す副詞的用法として、簡潔で自然な日本語にした。
- source_word: יֻקַּם
  choice: 復讐がなされる
  rationale: נקםのホファル形の受動態を保ち、復讐する主体を補わない訳とした。未完了形は格言的事実または確実な未来を表し得るため、その幅を脚注に示した。
- source_word: קָיִן
  choice: カイン
  rationale: 日本語で定着した聖書人名表記を用いた。
- source_word: וְלֶמֶךְ
  choice: だが、レメク
  rationale: 接続詞は単純な並列だけでなく、カインとの対比と増幅を担うため、日本語では「だが」とした。
- source_word: שִׁבְעִים וְשִׁבְעָה
  choice: 七十七倍
  rationale: 字義的には「七十と七」であり、直前の「七倍」との詩的並行を自然に表した。
theological_decisions:
- issue: レメクの復讐の数値表現
  choice: 七十七倍
  alternative: 七十倍の七倍／七十七回
  rationale: שִׁבְעִים וְשִׁבְעָהは最も自然には「七十七」を意味する。後代の別箇所の表現を持ち込まず、カインの「七倍」との段階的な対比を保った。
- issue: 復讐の時制・様相
  choice: 復讐がなされる
  alternative: 復讐されるであろう
  rationale: 未完了形は格言的な確実性とも、確実視された未来とも理解できる。本文では不自然に限定せず、未来の含みを脚注で保存した。
translation_notes:
  register: レメクの短い詩の強い対比と誇示的な調子を保つため、二行に分け、後半では述語を省略した。現代の一般読者に明瞭でありつつ、復讐の主体や時制を本文で過度に確定しない、簡潔で格調ある表現とした。
