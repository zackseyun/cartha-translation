  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר קַ֖יִן אֶל הֶ֣בֶל אָחִ֑י/ו וַֽ/יְהִי֙ בִּ/הְיוֹתָ֣/ם בַּ/שָּׂדֶ֔ה וַ/יָּ֥קָם קַ֛יִן אֶל הֶ֥בֶל אָחִ֖י/ו וַ/יַּהַרְגֵֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/008.yaml
  text: And Cain said to Abel his brother. Then[a], while they were in the field, Cain rose up against Abel his brother and killed him.
translation:
  language: ja
  text: カインは弟アベルに言った。[a] その後、二人が野にいたとき、カインは弟アベルに襲いかかり、彼を殺した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: マソラ本文は「カインは弟アベルに言った」とだけ記し、発言の内容を伝えていない。七十人訳、サマリア五書、ウルガタなどの古代の証言には、「野へ行こう」に当たる言葉がある。
    reason: textual_variant
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: אמרの通常の意味を直接表す。マソラ本文では発言内容が欠けているため、その不完全さを補わずに残した。
- source_word: אֶל
  choice: に
  rationale: 相手への方向を示す前置詞であり、「アベルに」が自然かつ原文に即している。
- source_word: אָחִיו
  choice: 弟アベル／弟アベルに
  rationale: 直訳は「彼の兄弟」だが、既出の系譜からアベルが弟であることが明らかなため、現代日本語として自然な「弟」とした。後半でもこれを繰り返し、兄弟殺しという物語上の強調を保った。
- source_word: וַיְהִי בִּהְיוֹתָם
  choice: その後、二人が……いたとき
  rationale: 物語を進める時間的枠組みを、明瞭な現代日本語で表した。
- source_word: בַּשָּׂדֶה
  choice: 野に
  rationale: שָׂדֶהは畑、野、開けた土地を指し得る。特定の耕作地と限定せず、場面に自然な「野」を選んだ。
- source_word: וַיָּקָם ... אֶל
  choice: 襲いかかり
  rationale: 字義的には「立ち上がって……に向かった」だが、敵対して攻撃するというヘブライ語の慣用的意味を自然な日本語で表した。
- source_word: וַיַּהַרְגֵהוּ
  choice: 彼を殺した
  rationale: הרגの基本義をそのまま示す。「殺害した」「殺したのである」などの追加的な法的・修辞的含意を避けた。
theological_decisions:
- issue: マソラ本文にないカインの発言内容を本文へ補うか
  choice: 本文には補わず、マソラ本文の途切れた形を保持する
  alternative: 古代訳およびサマリア五書に基づき、「野へ行こう」と本文に補う
  rationale: 提示されたWLC本文を第一の底本とし、その真正な本文上の難しさを黙って解消しないため。古代の重要な異読は脚注で明示し、読者が判断できるようにした。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「弟」を用いて兄弟関係を自然に示し、原文で反復される関係表現を後半にも残した。本文上の欠落は不自然さを含めて保持し、脚注で主要な古代異読を提示した。
