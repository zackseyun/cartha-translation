  source_fidelity: WLCのマソラ本文が発話内容を欠いたまま「カインは弟アベルに言った」とする唐突さを、本文で補わず保持している。続く時間節、野での場面、カインがアベルに敵対して立ち上がり殺したことを適切に伝えている。古代諸証人の補足句は脚注に留められ、本文上の異読を不透明に解消していない。
