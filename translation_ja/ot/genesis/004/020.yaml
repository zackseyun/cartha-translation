  yaml_path: translation/ot/genesis/004/020.yaml
  text: Adah bore Jabal[a]; he was the father of those who dwell in tents and have livestock.
translation:
  language: ja
  text: アダはヤバルを産んだ。ヤバルは、天幕に住み、家畜を飼う者たちの父[a]であった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「天幕生活をし、家畜を飼う者たちの祖であった」。ヘブライ語の「父」は、祖先、創始者、またはある生き方を始めた代表的人物を意味することがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: 産んだ
  rationale: 系譜的叙述における ילד のQal連続形を、簡潔で自然な日本語にした。
- source_word: עָדָה
  choice: アダ
  rationale: 人名をヘブライ語の発音に即して慣用的に音写した。
- source_word: יָבָל
  choice: ヤバル
  rationale: 人名をヘブライ語の発音に即して音写した。
- source_word: הוּא הָיָה
  choice: ヤバルは……となった
  rationale: 役割の成立を自然な日本語で示した。「……であった」も可能だが、後続する文化的起源者という意味に「となった」がよく合う。
- source_word: אֲבִי
  choice: 父
  rationale: 実父に限らず、ある生活様式を始めた者、またはその祖となる者を表し得るヘブライ語の比喩を保持した。
- source_word: יֹשֵׁב אֹהֶל
  choice: 天幕に住み
  rationale: 単数形の分詞が集合的に人々の類型を指すため、「者たち」に係る表現として訳した。אֹהֶל は聖書的文脈にふさわしく、一般にも理解できる「天幕」とした。
- source_word: וּמִקְנֶה
  choice: 家畜を飼う
  rationale: מִקְנֶה は広く家畜・群れを指す。名詞の並置に含意される牧畜生活を、日本語で明瞭にするため「飼う」を補った。
theological_decisions:
- issue: 「父」の意味範囲
  choice: 本文では「父」を保持し、注で祖・創始者・典型的起源者の可能性を説明する
  alternative: 「祖」または「創始者」と本文で限定する
  rationale: 原文の比喩と、血統上の祖先・生活様式の創始者・典型的起源者の間にある意味の幅を一つに限定しないため。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、創世記の系譜的叙述にふさわしい簡潔で品位ある調子と、原文の「父」という比喩を保った。
