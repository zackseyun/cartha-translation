  text: וַ/יֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔י/ךָ צֹעֲקִ֥ים אֵלַ֖/י מִן הָֽ/אֲדָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/004/010.yaml
  text: And he said[a], “What have you done? The voice of your brother’s blood is crying out to me from the ground.”
translation:
  language: ja
  text: 主は言われた。「あなたは何をしたのか。あなたの兄弟の血[a]の声が、地からわたしに叫んでいる。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「血」は複数形。流血を表す文脈でしばしば用いられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: すると、主は言われた
  rationale: 接続ワウを伴う物語の進行を「すると」で自然に示した。主語は直前の文脈にある主を補い、敬意ある叙述として「言われた」とした。
- source_word: מֶה עָשִׂיתָ
  choice: あなたは何をしたのか
  rationale: 完了した行為を問いただす、簡潔で直接的な神の告発として訳した。
- source_word: קוֹל
  choice: 声
  rationale: 単なる「音」ではなく、流された血が神に訴える擬人表現を保つため「声」とした。
- source_word: דְּמֵי
  choice: 血
  rationale: ヘブライ語は複数形だが、流血の文脈で用いられる表現であり、日本語では通常「血」とするのが自然である。複数形であることは脚注に示した。
- source_word: אָחִיךָ
  choice: あなたの弟の
  rationale: 語そのものは「あなたの兄弟」だが、文脈上アベルはカインの弟であり、現代日本語で人物関係を自然かつ明確に示した。
- source_word: צֹעֲקִים
  choice: 叫んでいる
  rationale: 分詞が表す継続的な訴えを「叫んでいる」で表した。原文では複数形の「血」に一致するが、日本語では「血の声」を主語として自然に構成した。
- source_word: אֵלַי
  choice: わたしに向かって
  rationale: 叫びが神を直接の訴えの相手としていることを明確に表した。
- source_word: מִן הָאֲדָמָה
  choice: 地から
  rationale: カイン物語に繰り返される土・地のイメージを保ちつつ、簡潔で格調のある日本語とした。
theological_decisions:
- issue: アベルの流された血の擬人化
  choice: 血の「声」が神に向かって叫ぶという比喩をそのまま残した。
  alternative: 血の罪責や正義を求める訴えという抽象的な意味に置き換える。
  rationale: 原文の鮮烈な擬人表現には、殺された者の血が神に訴えるという道徳的・神学的な力があるため、特定の教理的説明に狭めず保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神の問いと血の訴えが持つ厳粛さを保った。「血の声」というやや非日常的な表現は、原文の擬人化を意図的に残すためである。
