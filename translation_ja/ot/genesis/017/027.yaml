id: GEN.17.27
reference: Genesis 17:27
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/כָל אַנְשֵׁ֤י בֵית/וֹ֙ יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֖סֶף מֵ/אֵ֣ת בֶּן נֵכָ֑ר נִמֹּ֖לוּ אִתּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/027.yaml
  text: And all the men of his household[a], those born in the house and those bought with money from a foreigner, were circumcised with him.
translation:
  language: ja
  text: 彼の家に属する男たち、すなわち、家で生まれた者も、異国人[a]から金で買われた者も皆、彼とともに割礼を受けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「異国の子」。ここでは「異国人」または「よそ者」を意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: 皆
  rationale: 接続詞וְは前節からの物語の継続として日本語の文脈に含ませ、כָּלの全体性を「皆」で明確にした。
- source_word: אַנְשֵׁי בֵיתוֹ
  choice: 彼の家に属する男たち
  rationale: בַּיִתはここでは建物だけでなく家に属する共同体・家族集団を指す。割礼の文脈に即してאַנְשֵׁיを「男たち」とした。
- source_word: יְלִיד בָּיִת
  choice: 家で生まれた者
  rationale: その家の内部で生まれた者という身分を、簡潔で自然な現代日本語で表した。
- source_word: וּמִקְנַת כֶּסֶף
  choice: 金で買われた者
  rationale: 直訳的な「銀の取得物」ではなく、人が代価を払って取得されたという原文の取引上の意味を明示した。
- source_word: מֵאֵת בֶּן נֵכָר
  choice: 異国人から
  rationale: בֶּן־נֵכָרは字義的には「異国の子」だが、慣用的には異国人・よそ者を指す。מֵאֵתの起点を「から」で保持した。
- source_word: נִמֹּלוּ
  choice: 割礼を受けた
  rationale: ニファル形を受動として訳し、自ら割礼を施したとの含意を避けた。
- source_word: אִתּוֹ
  choice: 彼とともに
  rationale: アブラハムとの同行・同時性を自然に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準日本語とした。「すなわち」により、後続する二つの区分が「彼の家に属する男たち」の説明であることを示した。
