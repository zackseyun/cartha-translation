language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּ/ךָ֗ יֹלֶ֤דֶת לְ/ךָ֙ בֵּ֔ן וְ/קָרָ֥אתָ אֶת שְׁמ֖/וֹ יִצְחָ֑ק וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֥/י אִתּ֛/וֹ לִ/בְרִ֥ית עוֹלָ֖ם לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/019.yaml
  text: And God said[a], “No, but Sarah your wife shall bear you a son, and you shall call his name Isaac. And I will establish my covenant with him as an everlasting covenant for his offspring after him.”
translation:
  language: ja
  text: 神は言われた。「いや、あなたの妻サラが、あなたに男の子を産む。あなたはその子をイサク[a]と名づけなさい。わたしはわたしの契約を彼と立て、それを彼の後に続く子孫のための永遠の契約とする。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「イサク」は、ヘブライ語で「彼は笑う」または「彼は笑うだろう」という動詞と同じ響きを持つ。
    reason: 固有名イサクと「笑う」を意味するヘブライ語動詞との語呂を示すため。
lexical_decisions:
- source_word: אֲבָל
  choice: いや
  rationale: 直前のイシュマエルについてのアブラハムの願いを受けて、神がそれを訂正する文脈上の力を自然な現代日本語で示す。「しかし」だけよりも応答として明確であり、「確かに」と断定して曖昧さを狭めることも避ける。
- source_word: יֹלֶדֶת
  choice: 産む
  rationale: 形態上は分詞だが、ここでは将来の約束を表す。日本語では時を明示しなくても文脈上未来として自然に理解できる。
- source_word: בֵּן
  choice: 男の子
  rationale: 新たに告げられる息子を、一般読者に明快で自然な現代日本語として表す。
- source_word: וְקָרָאתָ אֶת שְׁמוֹ
  choice: その子を…と名づけなさい
  rationale: ヘブライ語の命名表現の機能を、直訳調の「その名を呼びなさい」ではなく、明瞭な日本語で再現する。
- source_word: יִצְחָק
  choice: イサク
  rationale: 日本語聖書で定着した固有名表記を用い、語源的な響きは脚注で示す。
- source_word: וַהֲקִמֹתִי
  choice: 立て…とする
  rationale: 契約を有効なものとして確立する意味を保ちつつ、日本語の契約表現として自然にする。
- source_word: בְּרִיתִי אִתּוֹ
  choice: 彼との契約
  rationale: 契約がイサク本人との関係として立てられることを明示し、「彼のためだけの契約」とはしない。所有代名詞は話者が神であるため文脈上明白である。
- source_word: לִבְרִית עוֹלָם
  choice: 永遠の契約とする
  rationale: 結果・指定を表す構文を自然に訳し、契約の持続性を保持する。「永遠」は神学的体系を追加せず、文脈に定着した訳語である。
- source_word: לְזַרְעוֹ אַחֲרָיו
  choice: 彼の後に続く子孫のための
  rationale: זֶרַע の集合的意味を「子孫」で明快に示し、אַחֲרָיו が表す世代的継続も保つ。単数か複数かを日本語で不必要に限定しない。
theological_decisions:
- issue: 契約の範囲と継続性
  choice: 神がイサクとの契約を立て、その契約が彼の後に続く子孫のための永遠の契約となることを、そのまま訳出する。
  alternative: 民族的・国家的約束だけに限定する読み、または後代のキリスト教契約論を直接規定する読み。
  rationale: 本文はイサクとの契約と、その子孫への継続を述べるが、それ以上に対象や成就の仕方を限定・拡張してはいないため、後代の神学体系を訳文に持ち込まない。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「神は言われた」「契約を立てる」は聖書文体として定着しつつ一般読者にも理解できる表現とした。命名句は不自然な逐語訳を避け、「名づけなさい」とした。
