  variant: clear modern standard Japanese
source:
  edition: WLC
  text: הִמּ֧וֹל יִמּ֛וֹל יְלִ֥יד בֵּֽיתְ/ךָ֖ וּ/מִקְנַ֣ת כַּסְפֶּ֑/ךָ וְ/הָיְתָ֧ה בְרִיתִ֛/י בִּ/בְשַׂרְ/כֶ֖ם לִ/בְרִ֥ית עוֹלָֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/013.yaml
  text: The one born in your house and the one bought with your money must surely be circumcised[c][b][a], and my covenant shall be in your flesh as an everlasting covenant.
translation:
  language: ja
  text: あなたの家で生まれた者も、あなたが銀を払って買い取った者も[b][c]、必ず割礼を受けなければならない[a]。わたしの契約は、あなたがたの肉にあって、永遠の契約となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「必ず割礼を受けるものとする」。ヘブライ語では、同じ動詞の不定詞絶対形と定形動詞を重ねて強調している。
    reason: lexical_alternative
  - marker: b
    text: 「家で生まれた者」と「銀を払って買い取った者」は、アブラハムの家に属する者のうち、そこで生まれた者と、代価を払って得られた者を指す。
    reason: cultural_note
  - marker: c
    text: 直訳に近くは「あなたの家で生まれた者と、あなたの銀によって買い取られた者」。
    reason: previous_rendering
lexical_decisions:
- source_word: הִמּוֹל יִמּוֹל
  choice: 必ず割礼を受けなければならない
  rationale: 不定詞絶対形と未完了形の組み合わせによる強調を「必ず」で表し、文脈上の義務も「なければならない」で明確にした。受動の形も保っている。
- source_word: יְלִיד בֵּיתְךָ
  choice: あなたの家で生まれた者
  rationale: 直訳的な「家で生まれた者」という個人への言及を保ちつつ、この句だけでは明示されていない奴隷身分を本文に付加しない。
- source_word: וּמִקְנַת כַּסְפֶּךָ
  choice: あなたの銀で買い取られた者
  rationale: כֶּסֶף の具体的意味「銀」を保持し、מִקְנָה がここでは購入によって得られた人を指すことを自然な日本語で示した。
- source_word: בְרִיתִי
  choice: わたしの契約
  rationale: 一人称接尾辞を明示し、בְּרִית の中心的な契約用語を一貫して訳した。
- source_word: בִּבְשַׂרְכֶם
  choice: あなたがたの肉にあって
  rationale: 前置詞 בְּ の「中に／に」を保ち、割礼という身体のしるしと契約との関係を「刻まれる」などと解釈的に言い換えず、原文の直接的な表現を残した。
- source_word: לִבְרִית עוֹלָם
  choice: 永遠の契約となる
  rationale: לְ の結果・機能を「となる」で表し、עוֹלָם の継続性を伝統的かつ明瞭な「永遠の」で訳した。
theological_decisions:
- issue: 身体のしるしと契約そのものとの関係
  choice: 「わたしの契約は、あなたがたの肉にあって」と直接的に訳し、割礼によって契約が肉にあるという本文の表現を保持する。
  alternative: 「契約のしるしがあなたがたの肉に刻まれる」として、しるしと契約を明確に区別する。
  rationale: 原文はここで「しるし」ではなく「わたしの契約」と述べるため、象徴的理解かより強い同一視かを訳文で決着させず、神学的緊張を保った。
translation_notes:
  register: 現代の一般読者に通じる明瞭で端正な文体とした。「銀」は原語の具体性を保ち、「肉」は契約と身体との直接的な結び付きを曖昧にしないため保持した。
