source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּ/ךָ֔ לֹא תִקְרָ֥א אֶת שְׁמָ֖/הּ שָׂרָ֑י כִּ֥י שָׂרָ֖ה שְׁמָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/015.yaml
  text: Then God said to Abraham[a], “As for Sarai your wife, you shall not call her name Sarai, for Sarah is her name.”
translation:
  language: ja
  text: 神はアブラハムに言われた。「あなたの妻サライについては、その名をサライと呼んではならない。サラがその名だからである。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進める連続形。日本語では文脈上、接続語を補わずとも順序が明瞭であり、神の発言には敬語を用いた。
- source_word: אֱלֹהִים
  choice: 神
  rationale: この文脈ではイスラエルの唯一の神を指す標準的な訳語。
- source_word: שָׂרַי אִשְׁתְּךָ
  choice: あなたの妻サライ
  rationale: 人物名とアブラハムとの関係を、自然な現代日本語の語順で示した。
- source_word: לֹא תִקְרָא אֶת־שְׁמָהּ שָׂרָי
  choice: その名をサライと呼んではならない
  rationale: 神の禁止命令として訳し、原文の「名」と「呼ぶ」を保って改名の厳粛な表現を伝えた。
- source_word: כִּי
  choice: （独立した次文として）
  rationale: 後続句が新しい名を宣言する理由・対照を示す。日本語では接続詞を明示しないほうが、簡潔で厳粛な宣言として自然である。
- source_word: שָׂרָה שְׁמָהּ
  choice: その名はサラである
  rationale: 動詞のない名詞文を現在の宣言として訳し、原文の語順が置く「サラ」への焦点を、日本語の主題構文で自然に表した。未来の助動表現は補わなかった。
theological_decisions:
- issue: 改名の宣言を現在の断定とするか未来の命名とするか
  choice: その名はサラである
  alternative: その名はサラとしなさい／その名はサラとなる
  rationale: 原文の שָׂרָה שְׁמָהּ は動詞を明示しない名詞文であるため、直接的な命名宣言として訳した。未来や追加の命令を明示して、原文以上に時制・様態を限定しない。
- issue: 「もはや」を補うか
  choice: 補わない
  alternative: もはやサライと呼んではならない
  rationale: 改名の文脈から継続停止の意味は理解できるが、「もはや」に直接対応する語はないため、本文には加えなかった。
translation_notes:
  register: 明快な現代標準日本語を用いながら、神による契約上の改名宣言にふさわしい端正で厳粛な調子を保った。原文の「名」「呼ぶ」の反復を残し、サライとサラの区別を明確にした。
