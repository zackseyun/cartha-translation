  text: その子イシュマエルは、包皮の肉に割礼を施された時、十三歳であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/יִשְׁמָעֵאל בְּנ/וֹ
  choice: その子イシュマエルは
  rationale: 接続詞וは日本語では文脈上あえて訳出せず、בְּנוֹは直前のアブラハムを受ける「その子」とした。固有名は一般的な聖書表記「イシュマエル」を用いた。
- source_word: בֶּן שְׁלֹשׁ עֶשְׂרֵה שָׁנָה
  choice: 十三歳であった
  rationale: ヘブライ語の年齢表現を、自然で格調を保つ現代日本語にした。
- source_word: בְּ/הִמֹּל/וֹ
  choice: 割礼を受けた時
  rationale: 前置詞בְּとニファル不定詞連語、および三人称男性単数接尾辞を時間節として訳し、イシュマエルが割礼を施されたことを自然に示した。
- source_word: אֵת בְּשַׂר עָרְלָת/וֹ
  choice: 包皮の肉に
  rationale: אֵת以下を関係・限定の対格と捉え、割礼を受けた部位を示す表現とした。「肉」を残して原文の具体的な契約用語を保持した。
