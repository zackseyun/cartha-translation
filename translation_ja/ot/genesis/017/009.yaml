  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל אַבְרָהָ֔ם וְ/אַתָּ֖ה אֶת בְּרִיתִ֣/י תִשְׁמֹ֑ר אַתָּ֛ה וְ/זַרְעֲ/ךָ֥ אַֽחֲרֶ֖י/ךָ לְ/דֹרֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/009.yaml
  text: And God said to Abraham[a], “As for you, you shall keep my covenant, you and your offspring after you throughout their generations.”
translation:
  language: ja
  text: 神はアブラハムに言われた。「あなたは、あなたの後の子孫[a]とともに、代々、わたしの契約を守りなさい。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「種（たね）」。ヘブライ語では、集合的に子孫を指す単数形の語。
    reason: 集合的単数である זֶרַע の字義と語形を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言われた
  rationale: 物語を進める通常の叙述として訳した。神を主語とする日本語の聖書文体に合わせ、尊敬表現を用いた。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 契約を語る神を指す標準的な訳語。
- source_word: וְאַתָּה
  choice: あなたは
  rationale: 前置された代名詞の強調と、神の約束からアブラハムの責務への転換を自然な日本語で示す。
- source_word: אֶת־בְּרִיתִי
  choice: わたしの契約を
  rationale: 契約という中心的な用語をそのまま保持した。
- source_word: תִשְׁמֹר
  choice: 守りなさい
  rationale: שׁמרの「守る、遵守する」という契約文脈での意味を表し、指示としての未完了形の力を明確にした。
- source_word: אַתָּה וְזַרְעֲךָ
  choice: あなたも、あなたの後に続く子孫も
  rationale: 反復された「あなた」を保持しつつ、集合的単数 זֶרַע を現代日本語で自然な「子孫」とした。
- source_word: אַחֲרֶיךָ
  choice: あなたの後に続く
  rationale: 血統上の継承を自然かつ明瞭に表す。
- source_word: לְדֹרֹתָם
  choice: 代々
  rationale: 後代の各世代にわたる継続性を簡潔な日本語で表した。
theological_decisions:
- issue: 契約上の義務を、余分な法的・典礼的含意を加えずに表すこと
  choice: わたしの契約を守りなさい
  alternative: わたしの契約を守らなければならない
  rationale: 原文が示す明確な責務を命令表現で伝えつつ、「守る」という契約用語を保持し、特定の教派的理解を付加しない。
translation_notes:
  register: 明瞭な現代標準日本語を基調としながら、神の発話にふさわしい簡潔で荘重な調子とした。原文では一つの長い発話だが、日本語で責務の対象を明確にするため二文に分け、後半に「これを守りなさい」を補った。
