  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/לֹא יִקָּרֵ֥א ע֛וֹד אֶת שִׁמְ/ךָ֖ אַבְרָ֑ם וְ/הָיָ֤ה שִׁמְ/ךָ֙ אַבְרָהָ֔ם כִּ֛י אַב הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/005.yaml
  text: Your name shall no longer be called Abram[a], but your name shall be Abraham, for I have made you the father of a multitude of nations.
translation:
  language: ja
  text: あなたの名は、もはやアブラムとは呼ばれない。あなたの名はアブラハムとなる。わたしがあなたを多くの国民の父とした[a]からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「わたしはあなたを多くの国民の父として与えた」。
    reason: נְתַתִּיךָの字義的な意味「与えた」と、本文で採用した自然な訳「…とした」との違いを示すため。
lexical_decisions:
- source_word: יִקָּרֵא
  choice: 呼ばれない
  rationale: ニファル形による受動の命名表現を、現代日本語で自然な「呼ばれる」とした。לֹאと合わせて否定形で訳した。
- source_word: עוֹד
  choice: もはや
  rationale: לֹאとともに、今後それまでの呼び名が用いられなくなることを表す。簡潔で格調を保つ「もはや」が適切である。
- source_word: אַבְרָם
  choice: アブラム
  rationale: 人名を一般的な日本語聖書表記に従って音写した。
- source_word: וְהָיָה
  choice: となる
  rationale: 直訳的な「である」よりも、改名の宣言として自然な日本語となるよう、新しい名への移行を表す「となる」とした。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 人名を一般的な日本語聖書表記に従って音写した。
- source_word: כִּי
  choice: からである
  rationale: 新しい名を与える理由を導く説明的な接続を明確にした。
- source_word: אַב
  choice: 父
  rationale: 通常の意味を保ち、契約の文脈における諸国民の父という表現をそのまま訳した。
- source_word: הֲמוֹן גּוֹיִם
  choice: 多くの国々
  rationale: הֲמוֹןの多数・群れという意味と、גּוֹיִםの複数の国民・国々という意味を、明瞭で自然な日本語にした。
- source_word: נְתַתִּיךָ
  choice: あなたを…とした
  rationale: 字義的には「あなたを…として与えた」だが、この叙述補語構文では「…とした」が自然である。完了形の宣言的・完結的な力を保つため、「するだろう」と未来形にはしなかった。
theological_decisions:
- issue: 神の約束を完了した事実として語る表現
  choice: わたしがあなたを多くの国々の父とした
  alternative: わたしがあなたを多くの国々の父とする
  rationale: ヘブライ語の完了形נְתַתִּיךָを尊重し、将来の約束へ平板化せず、神の宣言によってすでに確定した現実として語られる緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の改名宣言にふさわしい簡潔で dignified な文体とした。「あなたの名は」を反復し、原文の対照構造を保った。
