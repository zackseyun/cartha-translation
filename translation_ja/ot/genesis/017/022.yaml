  text: וַ/יְכַ֖ל לְ/דַבֵּ֣ר אִתּ֑/וֹ וַ/יַּ֣עַל אֱלֹהִ֔ים מֵ/עַ֖ל אַבְרָהָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/022.yaml
  text: When he finished speaking with him[a], God went up from Abraham.
translation:
  language: ja
  text: 神はアブラハムと語り終えると、アブラハムのもとから上って行かれた。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは「アブラハムの上から上って行かれた」。ヘブライ語は、神の現れが終わることを空間的な上昇として描いている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל לְדַבֵּר
  choice: 語り終えると
  rationale: כלהとדברの不定詞による「語り終える」を、後続する主節との時間的関係が自然に伝わる形で訳した。主語は文脈と後続節から神と明示した。
- source_word: אִתּוֹ
  choice: アブラハムと
  rationale: 前置詞אתはここでは対話の相手を示す「〜と」が自然であり、代名詞の指示対象を文脈に従ってアブラハムと明示した。
- source_word: וַיַּעַל
  choice: 上って行かれた
  rationale: עלהの具体的な上昇のイメージを保ちつつ、神を主語とする現代日本語として自然な敬意表現にした。単に「去られた」として空間的描写を抽象化しない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、単数動詞を伴い、この文脈では唯一の神を指すため、標準的に「神」とした。
- source_word: מֵעַל אַבְרָהָם
  choice: アブラハムのもとから
  rationale: מֵעַלの「〜の上から／そばから離れて」という関係を、神の顕現の終了を表す文脈に即して自然な日本語にした。上昇の方向性自体は「上って行かれた」に残した。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 日本語聖書で広く定着している人名表記を用いた。
theological_decisions:
- issue: 神が去ることの空間的・擬人的描写
  choice: 「アブラハムのもとから上って行かれた」として上昇の表現を保持する
  alternative: 「アブラハムのもとを去られた」「アブラハムから離れられた」
  rationale: ヘブライ語はעלהによって神の顕現の終わりを具体的な上昇として描く。神の空間的制約について断定せず、本文固有の描写と神学的緊張を保つ。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神を主語とする叙述には自然な敬意表現を採用した。語順を整え、冒頭の代名詞の曖昧さを避けるため主語と対話相手を明示した。
