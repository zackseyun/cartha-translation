  source_fidelity: ヘブライ語の時間節「（神が）彼と語り終えたとき」と主節「神はアブラハムの上から上られた」を適切に反映している。「アブラハムのもとから上って行かれた」は מֵעַל の空間的含意を本文では自然に処理し、上昇のイメージも保持している。
  naturalness: 明瞭で現代標準日本語として自然である。「神はアブラハムと語り終えると、…上って行かれた」は、同一主語の連続する叙述として無理がない。神への「行かれた」も本文全体で一貫して用いるなら適切な敬意表現である。
  terminology: 「神」「アブラハム」は標準的であり、「上って行かれた」は עלה の具体的・空間的表現を不必要に抽象化していない。脚注も「上から」という מֵעַל のより字義的な含意を示している。
