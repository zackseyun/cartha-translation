source:
  edition: WLC
  text: זֹ֣את בְּרִיתִ֞/י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִ/י֙ וּ/בֵ֣ינֵי/כֶ֔ם וּ/בֵ֥ין זַרְעֲ/ךָ֖ אַחֲרֶ֑י/ךָ הִמּ֥וֹל לָ/כֶ֖ם כָּל זָכָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/010.yaml
  text: 'This is my covenant[a], which you shall keep, between me and you and your offspring after you: every male among you shall be circumcised.'
translation:
  language: ja
  text: これが、あなたがたが守るべきわたしの契約、すなわち、わたしとあなたがた、またあなたの後の子孫との間の契約である。あなたがたのうちの男子はみな、割礼を受けなければならない。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת בְּרִיתִי
  choice: わたしと……との間の契約は、これである
  rationale: 指示語「これ」と「わたしの契約」を、日本語で自然かつ荘重な提示文として表現した。所有の接尾辞は、後続する「わたしと……との間」によって契約の当事者関係が明示されるため、重複を避けつつ意味を保っている。
- source_word: אֲשֶׁר תִּשְׁמְרוּ
  choice: あなたがたが守るべき
  rationale: 未完了形がこの文脈で表す契約上の義務を、「守るべき」として明確にした。
- source_word: בֵּינִי וּבֵינֵיכֶם וּבֵין זַרְעֲךָ אַחֲרֶיךָ
  choice: わたしとあなたがた、またあなたの後の子孫との間
  rationale: 契約の当事者を保ち、集合名詞 זֶרַע は文脈上、後代に続く者たちを自然に示す「子孫」とした。単数形の呼びかけを反映して「あなたの後」とした。
- source_word: הִמּוֹל לָכֶם
  choice: あなたがたのうち……割礼を受けなければならない
  rationale: 不定詞絶対形による規定・命令の力を義務表現で示し、לָכֶם は対象集団を表す「あなたがたのうち」とした。
- source_word: כָּל זָכָר
  choice: 男子はみな
  rationale: 男性に限定された規定を一般化せず保持した。「男子」は年齢を限定せず、人間の男性全体を指す文脈的表現として用いた。
theological_decisions:
- issue: 割礼命令の性別上の範囲
  choice: 男子はみな割礼を受けなければならない
  alternative: あなたがたはみな割礼を受けなければならない
  rationale: ヘブライ語 כָּל זָכָר は明示的にすべての男性を指すため、その範囲を性別不問に広げずに訳した。
- issue: 契約そのものと契約上の規定の関係
  choice: 契約は、これである。……割礼を受けなければならない
  alternative: 契約のしるしは、これである
  rationale: 本文は「契約」と述べており、「しるし」という語は次節に現れる。解釈上の説明を先取りせず、本文の強い同定表現と神学的緊張を保持した。
translation_notes:
  register: 明快な現代標準日本語を用いつつ、契約宣言にふさわしい端正な文体とした。「である」「なければならない」により、宣言と義務の力を表した。
