source:
  edition: WLC
  text: וּ/נְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עָרְלַתְ/כֶ֑ם וְ/הָיָה֙ לְ/א֣וֹת בְּרִ֔ית בֵּינִ֖/י וּ/בֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/011.yaml
  text: You shall circumcise the flesh of your foreskin[a], and it shall be a sign of the covenant between me and you.
translation:
  language: ja
  text: あなたがたは、自分たちの包皮の肉を切り捨てなさい。それが、わたしとあなたがたとの間の契約のしるし[a]となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「契約の証し」とも訳せる。
    reason: אוֹתは「しるし」のほか、「証し」「標識」などとも訳し得る。
lexical_decisions:
- source_word: וּנְמַלְתֶּם
  choice: 割礼を施しなさい
  rationale: 接続詞を伴う完了形は、この契約上の指示では命令の働きをする。日本語では「割礼を施しなさい」として、その指示性と行為の内容を明確にした。
- source_word: בְּשַׂר עָרְלַתְכֶם
  choice: 自分たちの包皮の肉
  rationale: בְּשַׂר（肉）とעָרְלָה（包皮）の双方を反映した。二人称複数の接尾辞は、集団に属する各人を指すため「自分たちの」とした。
- source_word: וְהָיָה
  choice: それは……となる
  rationale: 直前に命じられた割礼を受けており、将来的・規定的な意味を自然な日本語で表した。
- source_word: לְאוֹת
  choice: しるし
  rationale: אוֹתの基本義である「しるし」を採用し、契約における役割を過不足なく示した。
- source_word: בְּרִית
  choice: 契約
  rationale: 文脈上、神がアブラハムと立てる特定の契約を指す。日本語では「契約のしるし」という連体構造によって自然に特定性が伝わる。
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: わたしとあなたがたとの間
  rationale: 一人称単数と二人称複数をそのまま保ち、周辺文脈から子孫などを補わなかった。
theological_decisions:
- issue: 割礼と契約の関係
  choice: 契約のしるし
  alternative: 契約の証し／契約の象徴
  rationale: 本文は割礼をאוֹת בְּרִיתと呼ぶが、その効力や様式についてさらに教理的説明を加えてはいない。「しるし」とすることで、秘跡的理解にも単なる象徴的理解にも一方的に限定しない。
translation_notes:
  register: 現代の標準的な日本語を用いながら、神の契約命令にふさわしい簡潔で荘重な調子を保った。「包皮の肉」は日常語としてやや硬いが、原文の解剖学的表現を保持するため採用した。
