source:
  edition: WLC
  text: וּ/בֶן שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָ/כֶ֛ם כָּל זָכָ֖ר לְ/דֹרֹתֵי/כֶ֑ם יְלִ֣יד בָּ֔יִת וּ/מִקְנַת כֶּ֨סֶף֙ מִ/כֹּ֣ל בֶּן נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽ/זַּרְעֲ/ךָ֖ הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/012.yaml
  text: And at eight days old, every male among you throughout your generations shall be circumcised—whether born in the house or bought with silver from any foreigner who is not from your offspring.
translation:
  language: ja
  text: あなたがたのうち、生後八日[a]の男子は皆、代々にわたって割礼を受けなければならない。家で生まれた者も、あなたの子孫ではない外国人[c]から銀[b]で買い取った者も含まれる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「八日の子」。
    reason: lexical_alternative
  - marker: b
    text: 「銀」は「金銭」とも訳せる。
    reason: lexical_alternative
  - marker: c
    text: 直訳すると「あなたの種ではない、異国人の子のだれからでも」。ここで「種」は「子孫」を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן שְׁמֹנַת יָמִים
  choice: 生後八日
  rationale: 「八日の子」というヘブライ語の慣用表現を、日齢の指定が明確に伝わる自然な現代日本語にした。
- source_word: יִמּוֹל
  choice: 割礼を受けなければならない
  rationale: ニファル形の受動的意味と、ここでの命令・規定としての力を明確に表した。
- source_word: לָכֶם כָּל זָכָר
  choice: あなたがたのうち…男子は皆
  rationale: לָכֶם を共同体の範囲を示す「あなたがたのうち」とし、כָּל זָכָר の包括性を保った。
- source_word: לְדֹרֹתֵיכֶם
  choice: 代々にわたって
  rationale: この規定が後の世代にも継続することを、簡潔で自然な日本語で表した。
- source_word: יְלִיד בָּיִת
  choice: 家で生まれた者
  rationale: 家ないし家族共同体の中で生まれた者を指す原文に近く、文脈にも明瞭な表現とした。
- source_word: וּמִקְנַת כֶּסֶף
  choice: 銀で買い取られた者
  rationale: 購入によって家に属した者という意味を示しつつ、כֶּסֶף の具体的な「銀」を保持した。
- source_word: מִכֹּל בֶּן נֵכָר
  choice: 外国人から
  rationale: 字義的には「異国人の子のだれからでも」だが、ここでは外国人を指す慣用的表現として自然に訳した。
- source_word: אֲשֶׁר לֹא מִזַּרְעֲךָ הוּא
  choice: あなたの子孫ではない
  rationale: זֶרַע の血統・後裔を表す意味を、現代日本語で誤解なく示した。
theological_decisions:
- issue: アブラハム契約の家における割礼命令の範囲
  choice: 実の子孫だけでなく、家で生まれた男子と外国人から買い取られた男子も命令の対象に含める。
  alternative: 命令の対象を主としてアブラハムの実の子孫に限定して読む。
  rationale: 原文は「あなたの子孫ではない」者を明示的に含めており、契約の家に属する男子へ範囲を広げている。後代の神学的結論を付加せず、この節自体が示す範囲を保った。
translation_notes:
  register: 明瞭で現代的ながら、契約規定にふさわしい端正な文体とした。「男子」「割礼」「代々にわたって」により原文の法的・儀礼的な調子を保ち、購入された者を指す歴史的な家制度上の表現も婉曲化せずに訳した。
