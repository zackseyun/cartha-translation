  text: וְ/עָרֵ֣ל זָכָ֗ר אֲשֶׁ֤ר לֹֽא יִמּוֹל֙ אֶת בְּשַׂ֣ר עָרְלָת֔/וֹ וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּ֑י/הָ אֶת בְּרִיתִ֖/י הֵפַֽר׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/014.yaml
  text: And an uncircumcised male who is not circumcised in the flesh of his foreskin—that person shall be cut off from his people[b][a]; he has broken my covenant.
translation:
  language: ja
  text: 無割礼の男子、すなわち包皮の肉に割礼を受けていない者は、その民から断たれる[a][b]。彼はわたしの契約を破った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「そのネフェシュは、その民から断たれる」。ここで「ネフェシュ」は一人の人を指し、「断たれる」は契約上の制裁を表す慣用句。
    reason: lexical_alternative
  - marker: b
    text: 「断たれる」が共同体からの排除、死、またはほかの厳しい裁きを指すのか、この節自体は明示していない。
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָרֵל זָכָר
  choice: 無割礼の男子
  rationale: עָרֵלは「割礼を受けていない」、זָכָרは「男子」を表す。契約上のしるしに関する法的表現として、簡潔で明確な訳とした。
- source_word: אֲשֶׁר לֹא יִמּוֹל
  choice: 割礼を受けていない
  rationale: מולのニファル形が持つ受動的な意味を自然な現代日本語で表し、一般的な法的条件として訳した。
- source_word: אֶת בְּשַׂר עָרְלָתוֹ
  choice: 包皮の肉に
  rationale: 原文の具体的な身体表現を省略せず保持した。日本語では「割礼を受ける」と自然につながるよう助詞「に」を用いた。
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: その者は……断たれる
  rationale: נֶפֶשׁはここでは制裁を受ける個人を指すため「者」とした。「断たれる」は契約制裁の慣用句を保持し、その具体的内容を本文で限定しない。
- source_word: מֵעַמֶּיהָ
  choice: その民の中から
  rationale: עםを契約共同体としての「民」と訳した。接尾辞はנֶפֶשׁに文法的に一致するが、自然な日本語では性を明示せず「その民」とした。
- source_word: אֶת בְּרִיתִי
  choice: わたしの契約
  rationale: בְּרִיתの神学的・文脈的な重みを保つ標準的な訳語として「契約」を用いた。
- source_word: הֵפַר
  choice: 破った
  rationale: 契約を破棄・侵犯する意味を持つ。ここでは制裁の理由を明快に示す自然な表現として「破った」とした。
theological_decisions:
- issue: 契約制裁 כרת（「断つ」）の意味
  choice: 「その民の中から断たれる」という慣用的表現を保持する
  alternative: 共同体から追放される／死刑に処せられる
  rationale: この節だけでは、共同体からの排除、死など制裁の具体的形態が特定されていない。原文の重いが曖昧さを伴う表現を維持した。
- issue: נֶפֶשׁの訳し方
  choice: その者
  alternative: その魂
  rationale: ここでは人間の非物質的部分ではなく、契約制裁の対象となる一人の人を指す。「魂」として特定の人間観を持ち込むことを避けた。
- issue: הֵפַרと制裁との論理関係
  choice: 「破ったのである」と理由を示す
  alternative: 単純に「破った」と並置する
  rationale: 原文は接続詞を置かず、完了形によって先行する制裁の根拠を示していると自然に理解できるため、日本語では説明的関係を明示した。ただし責任主体に関する原文の表現は変えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、契約法規としての荘重さを保った。「包皮の肉」という具体的表現と「断たれる」という原文の慣用句を残し、本文が規定しない制裁内容を注で説明した。
