base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/003.yaml
  text: Then Abram fell on his face, and God spoke with him, saying,
translation:
  language: ja
  text: そこで、アブラムは顔を伏せた。神は彼にこう語られた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפֹּל אַבְרָם עַל־פָּנָיו
  choice: そこでアブラムはひれ伏した
  rationale: 直訳的には「アブラムは顔を伏せて倒れた」だが、全体で敬意を表す伏礼の動作を示すため、現代日本語で自然かつ簡潔な「ひれ伏した」とした。接続詞は物語の継起を示す「そこで」とした。
- source_word: וַיְדַבֵּר אִתּוֹ אֱלֹהִים
  choice: 神は彼に語って
  rationale: אֱלֹהִים は単数動詞を伴い、ここでは唯一の神を指す。דבר את は字義的には「彼と語る」だが、日本語では発話の方向を自然に表す「彼に語る」とした。
- source_word: לֵאמֹר
  choice: 言われた
  rationale: 後続する直接話法を導く定型句。ヘブライ語の「語って、言った」という構造をある程度保ちつつ、神に対する日本語の敬意を示す補助動詞「れる」を用いた。
theological_decisions:
- issue: אֱלֹהִים の数と指示対象
  choice: 単数の「神」
  alternative: 複数の「神々」
  rationale: 語形は複数形だが、動詞 וַיְדַבֵּר は単数であり、文脈上もアブラムに語る唯一の神を指す。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。伏礼の動作は慣用的な「ひれ伏す」で表し、節末は次節の直接話法へつながる形とした。
