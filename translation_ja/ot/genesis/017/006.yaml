  text: וְ/הִפְרֵתִ֤י אֹֽתְ/ךָ֙ בִּ/מְאֹ֣ד מְאֹ֔ד וּ/נְתַתִּ֖י/ךָ לְ/גוֹיִ֑ם וּ/מְלָכִ֖ים מִמְּ/ךָ֥ יֵצֵֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/006.yaml
  text: And I will make you exceedingly fruitful[a], and I will make nations from you[b], and kings will come from you.
translation:
  language: ja
  text: わたしはあなたを大いに増やし[a]、あなたから諸国民を生じさせる。王たちもあなたから出る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると、「非常に、非常に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְרֵתִי
  choice: 豊かに実らせ
  rationale: פרהのヒフィル形が持つ「実り多くする、繁栄させる」という使役の意味を保ち、子孫が増える文脈にも自然に通じる表現とした。
- source_word: בִּמְאֹד מְאֹד
  choice: ますます豊かに
  rationale: מְאֹדの反復による強い強調を、現代日本語として自然な強意表現で示した。直訳的には「非常に、非常に」であるため脚注に掲げた。
- source_word: וּנְתַתִּיךָ לְגוֹיִם
  choice: あなたから幾つもの国民を起こす
  rationale: נתן＋לの結果的な意味と、アブラハムが複数の国民の祖となる文脈を明瞭にした。「あなたを国々とする」という不自然さを避けつつ、後代の特定の民族観を持ち込まない。
- source_word: לְגוֹיִם
  choice: 幾つもの国民
  rationale: גּוֹיִםはここではアブラハムから生じる複数の民族的・国家的集団を指す。「異邦人」と限定せず、「国々」よりも人々のまとまりを表しやすい「国民」を選んだ。
- source_word: וּמְלָכִים
  choice: 王たち
  rationale: מְלָכִיםの具体的な意味をそのまま保持し、より広義の「支配者」とはしなかった。
- source_word: מִמְּךָ יֵצֵאוּ
  choice: あなたから出る
  rationale: יצאの基本的な空間比喩「出る」を保ちつつ、系譜的に「あなたから生まれ出る」という意味が日本語でも理解できる表現とした。
theological_decisions:
- issue: アブラハムに約束された子孫の範囲
  choice: アブラハムから複数の国民と王たちが生じるという系譜的な約束として訳す。
  alternative: 諸国民の間でアブラハムに特別な地位が与えられる、という抽象的な意味に取る。
  rationale: 直前後の契約文脈は子孫と系譜を中心としており、מִמְּךָ יֵצֵאוּも出自を表す。後代の神学体系を持ち込まず、本文が示す系譜的意味を前面に出した。
translation_notes:
  register: 神の約束にふさわしい簡潔で荘重な常体とした。「幾つもの国民」は複数性を明示し、「王たちも」で第三の約束を自然につないだ。
