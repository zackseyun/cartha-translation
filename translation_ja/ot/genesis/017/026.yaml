  text: まさにその日に、アブラハムとその息子イシュマエルは割礼を受けた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: まさにその日に
  rationale: この慣用表現が示す日の厳密な同一性と強調を、自然な現代日本語で表す。
- source_word: נִמּוֹל
  choice: 割礼を受けた
  rationale: 受動形の意味を保ちつつ、日本語として自然に表現する。ヘブライ語では動詞が単数形だが、後続する複合主語アブラハムとイシュマエルの双方にかかる。
- source_word: אַבְרָהָם
  choice: アブラハム
  rationale: 日本語聖書で広く定着している人名表記。
- source_word: וְיִשְׁמָעֵאל
  choice: とイシュマエル
  rationale: 接続詞を複合主語を示す「と」で表し、人名は日本語で定着した表記とする。
- source_word: בְּנוֹ
  choice: その息子
  rationale: 三人称男性単数の接尾辞がアブラハムを指し、イシュマエルとの親子関係を明示するため。
