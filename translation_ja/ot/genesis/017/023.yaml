source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַבְרָהָ֜ם אֶת יִשְׁמָעֵ֣אל בְּנ֗/וֹ וְ/אֵ֨ת כָּל יְלִידֵ֤י בֵית/וֹ֙ וְ/אֵת֙ כָּל מִקְנַ֣ת כַּסְפּ֔/וֹ כָּל זָכָ֕ר בְּ/אַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַ/יָּ֜מָל אֶת בְּשַׂ֣ר עָרְלָתָ֗/ם בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖/וֹ אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/023.yaml
  text: So Abraham took Ishmael his son[a], and all those born in his house, and all those bought with his money, every male among the men of Abraham’s household, and circumcised the flesh of their foreskin on that very day[d][c][b], just as God had spoken to him.
translation:
  language: ja
  text: そこでアブラハムは、息子イシュマエルと、自分の家で生まれた者たち、また銀で買い取った者たち、すなわちアブラハムの家の者のうちすべての男子を連れ、神が彼に語られたとおり、まさにその日に彼らの包皮に割礼を施した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: 集め
  rationale: 基本義は「取る」だが、ここでは割礼を受けさせるために家の男子を一まとまりにした行為を表すため、文脈に即して自然な「集め」とした。
- source_word: יְלִידֵי בֵיתוֹ
  choice: 自分の家で生まれた者たち
  rationale: 身分を本文で必要以上に限定せず、「家で生まれた」というヘブライ語の具体的な表現を保った。
- source_word: מִקְנַת כַּסְפּוֹ
  choice: 銀で買い取った者たち
  rationale: כֶּסֶף の「銀」と、購入によって家に加えられた人々であることの双方を明示した。
- source_word: כָּל זָכָר בְּאַנְשֵׁי בֵּית אַבְרָהָם
  choice: アブラハムの家の者のうち、すべての男子
  rationale: 「男子」を明確に保ちつつ、日本語で不自然な重複を避けて家に属する人々を表した。
- source_word: וַיָּמָל אֶת בְּשַׂר עָרְלָתָם
  choice: 彼らの包皮の肉に割礼を施した
  rationale: 標準的な宗教用語「割礼を施す」を用いながら、原文の具体的な「包皮の肉」も保持した。
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: まさにその日のうちに
  rationale: 命令を受けたその日の即時的な実行を強調するヘブライ語の慣用表現を自然な日本語で表した。
- source_word: כַּאֲשֶׁר דִּבֶּר אִתּוֹ אֱלֹהִים
  choice: 神が彼に語られたとおり
  rationale: 前置詞を日本語では自然な「彼に」とし、神の発言に従ったことを表す敬意ある表現とした。
theological_decisions:
- issue: אֱלֹהִים の訳語
  choice: 神
  alternative: 神々
  rationale: この契約物語ではアブラハムに語る唯一の神を指すことが文脈上明白である。
- issue: 家に属する人々の身分表現
  choice: 家で生まれた者たち／銀で買い取った者たち
  alternative: 家生まれの奴隷たち／買い取った奴隷たち
  rationale: 当時の家内従属者を指す可能性は高いが、本文の語彙以上に身分を断定せず、原文が明示する出生と取得の区分を保った。
translation_notes:
  register: 現代の一般読者に明快でありながら、族長物語にふさわしい簡潔で格調ある叙述とした。「銀」「包皮の肉」「まさにその日」など原文の具体性と強調を保持し、過度な説明は本文に加えていない。
