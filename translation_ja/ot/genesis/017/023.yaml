    rationale: 原文の具体性を逐語的に再現しようとしているが、日本語の慣用的な言い方としては「包皮に割礼を施した」が明快である。
  revised_text: そこでアブラハムは、息子イシュマエルと、自分の家で生まれた者たち、また銀で買い取った者たち、すなわちアブラハムの家の者のうちすべての男子を連れ、神が彼に語られたとおり、まさにその日に彼らの包皮に割礼を施した。
