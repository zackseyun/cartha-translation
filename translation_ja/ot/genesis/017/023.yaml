revisions:
- from: そこでアブラハムは、息子イシュマエルと、自分の家で生まれた者たち、銀で買い取った者たち、すなわちアブラハムの家の者のうち、すべての男子を集め、神が彼に語られたとおり、まさにその日のうちに彼らの包皮の肉に割礼を施した。
  to: そこでアブラハムは、息子イシュマエルと、自分の家で生まれた者たち、また銀で買い取った者たち、すなわちアブラハムの家の者のうちすべての男子を連れ、神が彼に語られたとおり、まさにその日に彼らの包皮に割礼を施した。
  rationale: 原文の列挙構造と「すべての男子」という範囲を保ちつつ、動詞を過度に具体化しない「連れ」に改めた。「まさにその日に」により即時性を明示し、割礼の表現は自然な現代標準日本語に整えた。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:15:08Z'
