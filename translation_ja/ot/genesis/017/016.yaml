id: GEN.17.16
reference: Genesis 17:16
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וּ/בֵרַכְתִּ֣י אֹתָ֔/הּ וְ/גַ֨ם נָתַ֧תִּי מִמֶּ֛/נָּה לְ/ךָ֖ בֵּ֑ן וּ/בֵֽרַכְתִּ֨י/הָ֙ וְ/הָֽיְתָ֣ה לְ/גוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥/נָּה יִהְיֽוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/016.yaml
  text: I will bless her[a], and moreover I will give you a son by her. I will bless her, and she will become nations[b]; kings of peoples will come from her.
translation:
  language: ja
  text: わたしは彼女を祝福し、さらに、彼女によってあなたに息子を与える。わたしは彼女を祝福する。彼女は国々となり[a]、諸民族の王たちが彼女から出る。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼女から国々が生まれる」または「彼女は国々の母となる」。ヘブライ語は、より直訳的には「彼女は国々となる」。
    reason: 原文の際立った表現を本文に保ちながら、その意味を自然な日本語の別訳で示すため。
lexical_decisions:
- source_word: וּבֵרַכְתִּי אֹתָהּ / וּבֵרַכְתִּיהָ
  choice: わたしは彼女を祝福し／わたしは彼女を祝福する
  rationale: ברךの契約的・神学的な重みを保つため「祝福する」とし、原文の反復も残した。
- source_word: וְגַם
  choice: さらに
  rationale: 単なる並列以上の付加・強調を、自然な現代日本語で表した。
- source_word: נָתַתִּי מִמֶּנָּה לְךָ בֵּן
  choice: 彼女によってあなたに息子を与える
  rationale: 約束の文脈における完了形を未来の確実な行為として訳し、מִמֶּנָּהが示す、息子がサラを通して与えられることを明示した。
- source_word: וְהָיְתָה לְגוֹיִם
  choice: 彼女は国々となり
  rationale: 「彼女は国々となる」という原文の際立った集合的表現を保持した。「母」という語は意味上含意されるが、原文には明記されていないため本文には補わず、脚注で自然な別訳を示した。
- source_word: מַלְכֵי עַמִּים
  choice: 諸民族の王たち
  rationale: עַמִּיםを「諸民族」として、直前のגּוֹיִם「国々」との語彙上の違いを保った。
- source_word: מִמֶּנָּה יִהְיוּ
  choice: 彼女から出る
  rationale: 直訳的な「彼女から存在する」ではなく、子孫・系譜上の起源を自然に表す「彼女から出る」とした。
theological_decisions:
- issue: サラから諸国民と王たちが生じるという約束
  choice: 彼女は国々となり、諸民族の王たちが彼女から出る
  alternative: 彼女は国々の母となり、諸民族の王たちが彼女から出る
  rationale: サラから複数の国々と王統が生じるという契約的な広がりを示しつつ、原文にない「母」を本文へ補って解釈を確定することを避けた。
translation_notes:
  register: 明瞭で現代的かつ格調ある常体。「彼女は国々となり」という意図的に際立つ表現は原文の集合的な言い方を保つために採用し、理解を助ける脚注を付した。
