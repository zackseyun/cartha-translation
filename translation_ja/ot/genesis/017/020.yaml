base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/020.yaml
  text: And as for Ishmael, I have heard you. Look, I have blessed him, and will make him fruitful, and will multiply him exceedingly. He will father twelve princes, and I will make him into a great nation.
translation:
  language: ja
  text: イシュマエルについては、あなたの言うことを聞いた。見よ、わたしは彼を祝福し、彼を子孫に恵まれさせ、非常に多く増やす。彼は十二人の族長の父となり、わたしは彼を大きな国民とする。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַעְתִּיךָ
  choice: あなたの願いを聞き入れた
  rationale: 直訳は「あなたを聞いた」だが、文脈上はアブラハムがイシュマエルについて述べた願い（17:18）への応答であり、現代日本語で自然に意味を伝えるため「願い」を補った。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 神の確約を際立たせる談話標識として、荘重さを保ちつつ明示的に訳した。
- source_word: וְהִפְרֵיתִי אֹתוֹ וְהִרְבֵּיתִי אֹתוֹ
  choice: 子孫を豊かにし、非常に多く増やす
  rationale: 人物を「実らせる」「増やす」というヘブライ語の生殖・繁栄の表現を、日本語で分かりやすく子孫の繁栄として表した。
- source_word: בִּמְאֹד מְאֹד
  choice: 非常に多く
  rationale: מְאֹד の反復による強意を、自然な現代日本語で保持した。
- source_word: נְשִׂיאִם
  choice: 族長
  rationale: ここでは後代の部族集団を率いる十二人を指すため、一般的な「君主」より創世記の文脈に即した「族長」とした。
- source_word: גּוֹי גָּדוֹל
  choice: 大いなる国民
  rationale: גּוֹי は政治的な国家だけでなく血縁的な民をも表すため「国民」とし、契約物語の荘重な定型「大いなる」を保った。
theological_decisions:
- issue: 完了形で語られる将来の祝福
  choice: 「祝福し、…増やす」と訳し、確実な将来の約束として表現
  alternative: すべてを過去形で「祝福した、豊かにした、増やした」とする
  rationale: הִנֵּה בֵּרַכְתִּי に続く一連の完了形は、まだ実現していないイシュマエルの将来を神の確定した約束として語る預言的・確約的用法である。日本語では最初の動詞を現在完了的にも取り得る形にし、後続を将来として自然に示した。
- issue: イシュマエルへの祝福と契約継承の区別
  choice: 本節では祝福を限定せず、そのまま力強い約束として訳す
  alternative: 契約がイサクに属することを訳文内で補足する
  rationale: 本節自体はイシュマエルへの豊かな祝福を明言する。次節との神学的区別を先取りして訳文に持ち込まず、本文の緊張を保持した。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の直接発話にふさわしい威厳を「見よ」「大いなる国民」で保った。注記がないため本文中の脚注標識もない。
