revisions:
- from: イシュマエルについては、あなたの願いを聞き入れた。見よ、わたしは彼を祝福し、子孫を豊かにし、非常に多く増やす。彼は十二人の族長の父となり、わたしは彼を大いなる国民とする。
  to: イシュマエルについては、あなたの言うことを聞いた。見よ、わたしは彼を祝福し、彼を子孫に恵まれさせ、非常に多く増やす。彼は十二人の族長の父となり、わたしは彼を大きな国民とする。
  rationale: 文脈に基づく補足を最小限に抑え、「聞いた」の対象を中立的に表現した。さらに、繁殖と増加の約束の目的語をイシュマエル本人として保持しつつ、日本語で意味が明瞭になるよう「子孫に恵まれさせ」とした。脚注を必要とする本文上の異文・曖昧さはない。
