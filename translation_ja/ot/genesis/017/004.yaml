base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/004.yaml
  text: As for me[a], behold, my covenant is with you[b], and you will become the father of a multitude of nations.
translation:
  language: ja
  text: わたしについて言えば[a]、見よ、わたしの契約はあなたと共にある。あなたは多くの国々の父となる[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「このわたしは――見よ、わたしの契約はあなたと共にある」。ヘブライ語では、冒頭の代名詞と「見よ」が強調を与えている。
    reason: lexical_alternative
  - marker: b
    text: または「あなたは多くの国々の一人の父となるであろう」。ヘブライ語は冠詞を用いず、将来その役割に就くことを表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי
  choice: わたしについて言えば
  rationale: 独立人称代名詞による冒頭の強調を、現代日本語で自然に示すため。「わたしは」だけでも訳せるが、談話上の対比的な強調が弱くなる。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 後続する宣言へ注意を促す指示的・強意的な働きと、神の厳粛な語り口を保つ。
- source_word: בְרִיתִי
  choice: わたしの契約
  rationale: בְּרִיתはアブラハム物語で一貫して用いられる契約用語であり、その文脈的・神学的重みを保つ。
- source_word: אִתָּךְ
  choice: あなたと共にある
  rationale: 前置詞と接尾代名詞を過度に補わず、「あなたとの間にある」と明示的な二者構文へ広げない。日本語として述語を補い、名詞文の意味を明瞭にした。
- source_word: וְהָיִיתָ
  choice: あなたは…となる
  rationale: 契約宣言における将来的・結果的な意味と、役割への移行を表す。「…である」より変化の含意が明確である。
- source_word: לְאָב
  choice: 父となる
  rationale: לְを伴う述語補語として、ある役割・身分になることを自然な日本語で表す。
- source_word: הֲמוֹן
  choice: 多くの
  rationale: 大きな集まり・多数を表す語の数量的な力を、理解しやすい現代日本語で示す。
- source_word: גּוֹיִם
  choice: 国々
  rationale: 後代の専門的な意味での「異邦人」に限定せず、アブラハムから出る諸国・諸民族を広く指す表現とした。
theological_decisions:
- issue: 契約宣言とアブラハムの役割
  choice: 「わたしの契約はあなたと共にある。あなたは多くの国々の父となる」と訳し、契約関係と約束された結果をそのまま示す。
  alternative: 「わたしはあなたと契約を結ぶ」または「あなたは多くの民族の祖先となる」と説明的に訳す。
  rationale: 原文は契約を新たに締結するという動作を明示せず、また「父」を単に「祖先」へ置き換えていない。後代の神学的枠組みを加えず、原文の契約的・約束的な緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、神の宣言にふさわしい簡潔で厳かな調子を保った。「見よ」は日常語より格調があるが、原文の注意喚起と荘重さを伝えるため採用した。
