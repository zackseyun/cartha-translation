id: GEN.17.8
reference: Genesis 17:8
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/נָתַתִּ֣י לְ֠/ךָ וּ/לְ/זַרְעֲ/ךָ֨ אַחֲרֶ֜י/ךָ אֵ֣ת אֶ֣רֶץ מְגֻרֶ֗י/ךָ אֵ֚ת כָּל אֶ֣רֶץ כְּנַ֔עַן לַ/אֲחֻזַּ֖ת עוֹלָ֑ם וְ/הָיִ֥יתִי לָ/הֶ֖ם לֵ/אלֹהִֽים׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/008.yaml
  text: And I will give to you and to your offspring after you the land of your sojournings—all the land of Canaan—as an everlasting possession[b][a], and I will be their God.
translation:
  language: ja
  text: わたしは、あなたと、あなたの後の子孫に、あなたが寄留している地[a]、すなわちカナンの全土を、永遠の所有地として[b]与える。そして、わたしは彼らの神となる。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「あなたが外国人として住んでいる地」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「永遠の所有として」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: 与える
  rationale: 契約の約束を語る文脈で、接続詞を伴う完了形の将来的・確約的な力を、日本語では現在形による荘重な約束として自然に表した。
- source_word: לְךָ
  choice: あなたに
  rationale: アブラハム本人を受領者として示す単純な与格をそのまま表した。
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: あなたの後の子孫に
  rationale: זֶרַע は集合的な語であり、「子孫」が現代日本語で自然にその広がりを表す。「あなたの後」を残し、世代的継承を明示した。
- source_word: אֶרֶץ מְגֻרֶיךָ
  choice: あなたが寄留している地
  rationale: מְגוּרִים が示す、外国人・滞在者として住む状態を「寄留」で簡潔に保持した。複数的な形は、日本語では土地を集合的に指す単数表現が自然である。
- source_word: אֵת כָּל אֶרֶץ כְּנַעַן
  choice: すなわちカナンの全土を
  rationale: 前の「地」を同格的に特定する構造を「すなわち」で明瞭にし、כָּל の包括性を「全土」で表した。
- source_word: לַאֲחֻזַּת עוֹלָם
  choice: 永遠の所有地として
  rationale: אֲחֻזָּה の土地財産・保有地という意味と、עוֹלָם の永続的な契約上の力を、自然で重みのある表現にした。
- source_word: וְהָיִיתִי לָהֶם לֵאלֹהִים
  choice: そして、わたしは彼らの神となる
  rationale: 定型的な契約句を日本語で明瞭に表し、神の本質の変化ではなく、神と子孫との契約関係を示した。
theological_decisions:
- issue: 後代の教理的含意を持ち込まずに契約定型句を訳すこと
  choice: わたしは彼らの神となる
  alternative: わたしは彼らにとって神となる
  rationale: ヘブライ語は神の存在論的変化ではなく契約関係を表す。「彼らの神となる」は、その関係性と聖書的な定型性を自然な日本語で保つ。
translation_notes:
  register: 明快な現代標準日本語を用いながら、契約の宣言にふさわしい品位を保った。「寄留」はやや聖書的な語だが、族長が定住権を持たない滞在者であるという原文の意味を簡潔に伝えるため採用し、脚注で平易な言い換えを示した。
