  verdict: revise
  source_fidelity: 本文は神名、神の顕現、エル・シャダイ、命令の構造を適切に反映している。「アブラムが九十九歳になったとき」だけは、年齢到達の時点を指し得るため、単にその年齢であったというヘブライ語の時間設定よりやや狭い。
