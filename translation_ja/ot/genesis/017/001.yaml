  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְהִ֣י אַבְרָ֔ם בֶּן תִּשְׁעִ֥ים שָׁנָ֖ה וְ/תֵ֣שַׁע שָׁנִ֑ים וַ/יֵּרָ֨א יְהוָ֜ה אֶל אַבְרָ֗ם וַ/יֹּ֤אמֶר אֵלָי/ו֙ אֲנִי אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְ/פָנַ֖/י וֶ/הְיֵ֥ה תָמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/001.yaml
  text: When Abram was ninety-nine years old[a], Yahweh appeared to Abram and said to him, “I am God Almighty. Walk before me, and be blameless.”
translation:
  language: ja
  text: アブラムが九十九歳だったとき、ヤハウェはアブラムに現れて言った。「わたしは全能の神[a]である。わたしの前を歩み、全き者であれ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「エル・シャダイ」。シャダイの厳密な意味については議論がある。
    reason: 原語の歴史的表現と語義上の不確かさを示すため。
lexical_decisions:
- source_word: וַיְהִי אַבְרָם בֶּן תִּשְׁעִים שָׁנָה וְתֵשַׁע שָׁנִים
  choice: アブラムが九十九歳になったとき
  rationale: ヘブライ語の年齢表現と物語の時間設定を、自然な現代日本語で表した。
- source_word: וַיֵּרָא
  choice: 現れて
  rationale: ニファル形は、ヤハウェがアブラムに姿を現したことを表す。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を音写した。
- source_word: אֵל שַׁדַּי
  choice: 全能の神
  rationale: 伝統的で理解しやすい訳語を採用しつつ、シャダイの厳密な意味には議論があるため原語形を脚注に示した。
- source_word: הִתְהַלֵּךְ לְפָנַי
  choice: わたしの前を歩み
  rationale: 生き方を指す比喩と契約的な響きを保つため、原文に近い表現とした。
- source_word: וֶהְיֵה תָמִים
  choice: 全き者であれ
  rationale: תָמִיםが含む完全さ、誠実さ、非難されるところのなさを一義的に狭めず、荘重で簡潔な表現にした。
theological_decisions:
- issue: 神名 יְהוָה の表記
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文の固有名を保ち、称号への置換を避けた。
- issue: אֵל שַׁדַּי の訳し方
  choice: 全能の神
  alternative: エル・シャダイ
  rationale: 本文では明瞭な伝統訳を用い、語義の不確かさと原語形は脚注で保持した。
- issue: תָמִים の意味範囲
  choice: 全き者
  alternative: 非難されるところのない者、誠実な者、完全な者
  rationale: 絶対的な無罪性と断定せず、人格的な完全さや誠実さを含む原語の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基本としつつ、神の自己宣言と命令にふさわしい簡潔で dignified な調子を保った。「全き者」は日常語より格調があるが、原語の意味の幅を保つため採用した。
