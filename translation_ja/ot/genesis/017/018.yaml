  text: וַ/יֹּ֥אמֶר אַבְרָהָ֖ם אֶל הָֽ/אֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/018.yaml
  text: And Abraham said to God[a], “Oh, that Ishmael might live before you!”
translation:
  language: ja
  text: アブラハムは神に言った。「どうか、イシュマエルがあなたの御前で生きますように！[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたの御前で」は、「あなたの臨在のうちで」または「あなたの恵みのもとで」とも訳せる。
    reason: לְפָנֶיךָ の字義と、この文脈で含み得る関係的・好意的なニュアンスを示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進めるワウ継続法を、日本語の自然な叙述では文脈上明らかな接続語を補わずに表した。
- source_word: אַבְרָהָם אֶל הָאֱלֹהִים
  choice: アブラハムは神に
  rationale: 発話の相手を示す אֶל を「に」とし、定冠詞付きの אֱלֹהִים は、この文脈で特定の神を指すため、日本語の慣用に従って「神」とした。
- source_word: לוּ
  choice: どうか…ますように
  rationale: 条件ではなく強い願望を導く語であるため、現代日本語で自然に祈願を表す構文を用いた。「ああ、…ならよいのに」よりも、神への直接の願いとして明瞭である。
- source_word: יִשְׁמָעֵאל
  choice: イシュマエル
  rationale: 固有名を日本語で定着した形に音写した。
- source_word: יִחְיֶה
  choice: 生きますように
  rationale: 願望を表す לוּ のもとにある未完了形として訳し、単なる生存だけでなく、生き続けることや健やかな存続を含み得る原語の幅を狭めなかった。
- source_word: לְפָנֶיךָ
  choice: あなたの御前で
  rationale: 直訳的には「あなたの顔の前で／あなたの前で」。神の臨在や好意を含み得る関係的な含意を保ちつつ、明示されていない「祝福」や「契約」を本文に加えない表現とした。
theological_decisions:
- issue: イシュマエルが神の「前で生きる」という願いの意味
  choice: 「あなたの御前で生きますように」とし、意味を限定しなかった。
  alternative: 「あなたの恵みのもとで生きますように」または「あなたとの契約のうちに生きますように」
  rationale: 原文は神の臨在や好意を示唆し得るが、ここで契約上の地位や祝福の具体的内容までは明示していない。簡潔な表現を保つことで、物語にある神学的な緊張を解消せずに残した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神への切実な願いにふさわしい品位を保った。「どうか…ますように」で לוּ の願望的な力を自然に表し、「御前」は聖書本文として理解しやすい範囲の格調を持たせている。
