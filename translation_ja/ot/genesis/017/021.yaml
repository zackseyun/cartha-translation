  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וְ/אֶת בְּרִיתִ֖/י אָקִ֣ים אֶת יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְ/ךָ֤ שָׂרָה֙ לַ/מּוֹעֵ֣ד הַ/זֶּ֔ה בַּ/שָּׁנָ֖ה הָ/אַחֶֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/021.yaml
  text: But I will establish my covenant with Isaac[a], whom Sarah will bear to you at this time next year.
translation:
  language: ja
  text: しかし、わたしはサラが来年の今ごろあなたに産むイサクとの間に、わたしの契約を立てる[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「そして、わたしは……イサクとの間に、わたしの契約を立てる」。ヘブライ語の接続詞は単純に「そして」とも訳せるが、ここでは前節のイシュマエルへの約束との対比を踏まえて「しかし」とした。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: しかし、…を
  rationale: וְ は本来広く「そして」を表すが、直前のイシュマエルへの祝福と、ここでイサクに立てられる契約との対比を文脈上明示するため「しかし」とした。אֶת は目的語標識として「契約を」に反映した。
- source_word: בְּרִיתִי
  choice: わたしの契約
  rationale: בְּרִית は創世記のこの文脈で「契約」、一人称単数接尾辞は「わたしの」とするのが明確で自然である。
- source_word: אָקִים
  choice: 立てる
  rationale: קום のヒフィル形は、ここでは契約を確立することを表す。日本語の聖書的・法的な文脈で自然かつ簡潔な「契約を立てる」とした。
- source_word: אֶת יִצְחָק
  choice: イサクと
  rationale: 形式上の אֶת は目的語標識だが、「契約を立てる」の相手を示す日本語としては「イサクと」が自然であり、イサクが契約の相手であることを明確にする。
- source_word: אֲשֶׁר תֵּלֵד לְךָ שָׂרָה
  choice: サラが…あなたに産む
  rationale: 関係節を日本語の連体修飾としてイサクの前に置き、לְךָ も「あなたに」と明示して原文の関係を保った。
- source_word: לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת
  choice: 来年の今ごろ
  rationale: 直訳的には「翌年のこの定められた時に」。ここでは一年後の同じ時期を指す慣用的で明瞭な日本語「来年の今ごろ」が、意味を過不足なく伝える。
theological_decisions:
- issue: イシュマエルへの祝福とイサクとの契約の区別
  choice: 神が契約を立てる相手をイサクと明記し、接続を「しかし」とした。
  alternative: 接続を「そして」とし、対比を明示しない。
  rationale: 前節ではイシュマエルへの祝福が約束される一方、本節は契約をイサクに結び付ける。本文の区別を保つが、それを越えた後代の教理的結論は付加しない。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神の発話にふさわしい簡潔で荘重な調子を保った。「来年の今ごろ」は原文の定められた時期を自然に表す。
