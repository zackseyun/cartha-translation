  text: アブラハムは、包皮の肉に割礼を受けた時、九十九歳であった。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַבְרָהָם
  choice: アブラハムが
  rationale: 接続詞וְは物語の連続を示すが、この一節だけでも自然な現代日本語となるよう、明示的な「そして」は置かなかった。固有名は慣用表記「アブラハム」とした。
- source_word: בֶּן תִּשְׁעִים וָתֵשַׁע שָׁנָה
  choice: 九十九歳であった
  rationale: 直訳的には「九十九年の子」だが、年齢を表すヘブライ語の慣用句なので、自然で格調を保つ日本語にした。
- source_word: בְּהִמֹּלוֹ
  choice: 割礼を受けた時
  rationale: 前置詞בְּを伴う不定詞連語と三人称男性単数接尾辞が表す時間的状況を、自然な受動表現で訳した。
- source_word: בְּשַׂר עָרְלָתוֹ
  choice: 包皮の肉
  rationale: 「彼の包皮の肉」という具体的な身体表現を保ちつつ、日本語では所有者が文脈上明白なため「彼の」を省いた。単に「割礼を受けた」と簡略化せず、原文の語句を保持した。
