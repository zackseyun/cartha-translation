  text: וַ/יִּפֹּ֧ל אַבְרָהָ֛ם עַל פָּנָ֖י/ו וַ/יִּצְחָ֑ק וַ/יֹּ֣אמֶר בְּ/לִבּ֗/וֹ הַ/לְּ/בֶ֤ן מֵאָֽה שָׁנָה֙ יִוָּלֵ֔ד וְ/אִ֨ם שָׂרָ֔ה הֲ/בַת תִּשְׁעִ֥ים שָׁנָ֖ה תֵּלֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/017.yaml
  text: Then Abraham fell on his face and laughed[a], and said in his heart, “Will a child be born to a man a hundred years old? And will Sarah, who is ninety years old, give birth?”
translation:
  language: ja
  text: そこでアブラハムはひれ伏して笑い、心の中で言った。「百歳の人に子ども[a]が生まれるだろうか。九十歳のサラが子を産むだろうか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「息子」。
    reason: 「子ども」と訳した בן には「息子」という語彙的代替もあり得る。
lexical_decisions:
- source_word: וַיִּפֹּל עַל־פָּנָיו
  choice: 顔を伏せてひれ伏し
  rationale: 直訳的な「自分の顔の上に倒れた」では不自然になるため、顔を下にして身を伏せる姿勢を、明瞭で自然な現代日本語にした。
- source_word: וַיִּצְחָק
  choice: 笑った
  rationale: צחק の基本的な意味をそのまま表し、喜びか不信かという動機を訳文に加えない。また、後のイサクの名との語的なつながりも保つ。
- source_word: וַיֹּאמֶר בְּלִבּוֹ
  choice: 心の中で言った
  rationale: ヘブライ語の慣用表現を保ちつつ、発言が口に出されたものではないことを明確に示す。
- source_word: הַלְּבֶן מֵאָה שָׁנָה
  choice: 百歳の者に
  rationale: ここで בֶּן は、生まれる子の性別を示す語ではなく、「百歳の者」という年齢表現の一部である。性別を不必要に特定せず、与格の לְ を「に」で表した。
- source_word: יִוָּלֵד
  choice: 子どもが生まれる
  rationale: 主語が明示されていない受動形の ילד を、日本語で自然に補って表した。文脈上、問題となっているのは子の誕生である。
- source_word: וְאִם־שָׂרָה הֲבַת־תִּשְׁעִים שָׁנָה
  choice: 九十歳のサラが
  rationale: 「九十年の娘」というヘブライ語の年齢慣用句を、余分な名詞を加えず自然な日本語にした。וְאִם は並行する第二の修辞疑問として文脈に即して処理した。
- source_word: תֵּלֵד
  choice: 子を産む
  rationale: 女性を主語とする ילד の能動形を、簡潔で自然な現代日本語で表した。
theological_decisions:
- issue: アブラハムの笑いの性質
  choice: 「笑った」と中立的に訳す
  alternative: 「信じられずに笑った」または「喜んで笑った」
  rationale: 本文は笑いと内心の問いを記すが、その笑いを不信とも喜びとも明示的に評価していないため、物語上の緊張と曖昧さを残した。
- issue: 二つの問いの可能性・驚きの度合い
  choice: どちらも「だろうか」と訳す
  alternative: 「あり得るだろうか」「本当に～のか」
  rationale: 修辞疑問であることは示しつつ、不可能性や不信を強く読み込む語を加えないようにした。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、族長物語にふさわしい簡潔で落ち着いた調子を保った。「顔を伏せてひれ伏し」は姿勢を自然に示し、「心の中で言った」は原文の表現を尊重した。英語相談層の脚注は הַלְּבֶן を生まれる子の「息子／子ども」と扱うが、原文では前置詞 לְ と年齢慣用句 בֶּן מֵאָה שָׁנָה の組み合わせと判断し、日本語訳にはその分析を採用しなかった。
