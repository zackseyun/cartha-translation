- from: そこでアブラハムは顔を伏せてひれ伏し、笑った。そして心の中で言った。「百歳の者に子どもが生まれるだろうか。九十歳のサラが子を産むだろうか。」
  to: そこでアブラハムはひれ伏して笑い、心の中で言った。「百歳の人に子ども[a]が生まれるだろうか。九十歳のサラが子を産むだろうか。」
  rationale: 原文の「顔を伏せて倒れる」という姿勢を「ひれ伏して」と一度だけ自然に表し、二つの修辞疑問と笑いの中立的な表現は維持しました。「百歳の人」は年齢慣用句を自然な日本語で表します。「子ども」の性別を限定しない本文訳を保ちつつ、בן の「息子」という代替可能性を脚注で示しました。
