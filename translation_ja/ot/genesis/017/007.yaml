id: GEN.17.7
reference: Genesis 17:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/הֲקִמֹתִ֨י אֶת בְּרִיתִ֜/י בֵּינִ֣/י וּ/בֵינֶ֗/ךָ וּ/בֵ֨ין זַרְעֲ/ךָ֧ אַחֲרֶ֛י/ךָ לְ/דֹרֹתָ֖/ם לִ/בְרִ֣ית עוֹלָ֑ם לִ/הְי֤וֹת לְ/ךָ֙ לֵֽ/אלֹהִ֔ים וּֽ/לְ/זַרְעֲ/ךָ֖ אַחֲרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/007.yaml
  text: And I will establish my covenant between me and you and your offspring after you throughout their generations as an everlasting covenant[b][a], to be God to you and to your offspring after you.
translation:
  language: ja
  text: わたしは、わたしとあなた、およびあなたの後の子孫[a]との間に、わたしの契約を、彼らの代々にわたる永遠の契約として確立する。わたしがあなたの神[b]となり、あなたの後の子孫の神となるためである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「子孫」に当たるヘブライ語は集合的単数で、「種」または「末裔」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「あなたにとって神となる」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִמֹתִי
  choice: 立てる
  rationale: 契約を確立することを表す הֵקִים בְּרִית の標準的で自然な訳。単なる維持ではなく、契約を確かなものとして定める意味を保つ。
- source_word: בְּרִיתִי
  choice: わたしの契約
  rationale: 一人称所有接尾辞を明示し、בְּרִית の基本的な意味をそのまま表す。
- source_word: בֵּינִי וּבֵינֶךָ וּבֵין
  choice: わたしとあなたとの間、また……との間に
  rationale: 繰り返される בֵּין によって示される契約当事者の関係を、日本語として自然な形で保持する。
- source_word: זַרְעֲךָ
  choice: あなたの後の子孫
  rationale: זֶרַע は集合的単数で、単数と複数の含みを持つ。「子孫」は現代日本語で自然であり、文脈上の集合性を過度に限定しない。
- source_word: אַחֲרֶיךָ
  choice: あなたの後の
  rationale: 時間的・系譜的に後に続くことを簡潔に表す。
- source_word: לְדֹרֹתָם
  choice: 代々にわたる
  rationale: 後続する諸世代を通じた継続を、明瞭で自然な日本語で表す。
- source_word: לִבְרִית עוֹלָם
  choice: 永遠の契約として
  rationale: עוֹלָם が契約の持続性を示すことを「永遠」で表し、述語的な לְ を「として」で自然に訳す。
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: わたしがあなたの神となり
  rationale: 直訳的には「あなたにとって神となる」だが、日本語の契約定式として明瞭で自然な「あなたの神となる」を採用した。
- source_word: וּלְזַרְעֲךָ אַחֲרֶיךָ
  choice: あなたの後の子孫の神となる
  rationale: 前半の זֶרַע と訳語を統一し、神と子孫との契約関係を明示する。
theological_decisions:
- issue: アブラハムの זֶרַע の集合的単数性
  choice: 子孫
  alternative: 子種／末裔
  rationale: זֶרַע は集合的単数であり、集団的な意味と単数形の含みを併せ持つ。「子孫」は文脈上自然で、特定の教理的解釈に限定せず、その幅を注で示せる。
- issue: 契約定式 לִהְיוֹת לְךָ לֵאלֹהִים
  choice: あなたの神となる
  alternative: あなたにとって神となる
  rationale: 自然な現代日本語を本文に用いつつ、ヘブライ語の関係的な構文は脚注で示し、契約関係の含意を保つ。
- issue: עוֹלָם の持続性
  choice: 永遠の
  alternative: 永続する
  rationale: 契約文脈における長久性・恒久性を伝える伝統的かつ明瞭な表現を採用し、期間を独自に限定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、契約宣言にふさわしい荘重さを保った。「代々にわたる」により継続性を自然に示し、二文に分けて目的節を読みやすくした。
