- from: わたしは、わたしとあなたとの間、またあなたの後の子孫[a]との間に、代々にわたるわたしの契約を、永遠の契約として立てる。わたしがあなたの神[b]となり、あなたの後の子孫の神となるためである。
  to: わたしは、わたしとあなた、およびあなたの後の子孫[a]との間に、わたしの契約を、彼らの代々にわたる永遠の契約として確立する。わたしがあなたの神[b]となり、あなたの後の子孫の神となるためである。
