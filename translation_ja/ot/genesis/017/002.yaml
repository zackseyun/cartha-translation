source:
  edition: WLC
  text: וְ/אֶתְּנָ֥ה בְרִיתִ֖/י בֵּינִ֣/י וּ/בֵינֶ֑/ךָ וְ/אַרְבֶּ֥ה אוֹתְ/ךָ֖ בִּ/מְאֹ֥ד מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/017/002.yaml
  text: And I will make my covenant between me and you[a], and I will multiply you exceedingly.
translation:
  language: ja
  text: わたしは、わたしとあなたとの間にわたしの契約を立てる[a]。そして、あなたをおびただしく増やす。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「立てる」は直訳では、「置く」または「与える」。
    reason: נתןの基本義と、契約文脈における慣用的な訳との違いを示すため。
lexical_decisions:
- source_word: וְאֶתְּנָה
  choice: わたしは……立てる
  rationale: נתןの基本義は「与える、置く」だが、בְּרִיתとの結び付きでは契約を設定する行為を表す。「契約を立てる」は原語の具体性と現代日本語の自然さを両立させる。接続詞וְは、後続文の「そして」と合わせ、文脈上自然な連続として表した。
- source_word: בְרִיתִי
  choice: わたしの契約
  rationale: בְּרִיתの正式かつ神学的な重みを保つ「契約」を用い、一人称単数接尾辞を「わたしの」と明示した。
- source_word: בֵּינִי וּבֵינֶךָ
  choice: わたしとあなたとの間に
  rationale: 両者の関係を示す反復構文を、意味を省かず自然な日本語で表した。
- source_word: וְאַרְבֶּה
  choice: そして……増やす
  rationale: רבהのヒフィル形が示す使役的な増加を「増やす」で表し、接続詞וְも保持した。
- source_word: אֹתְךָ
  choice: あなたを
  rationale: 原文はアブラムを直接指す男性単数二人称である。子孫の増加を含意するが、本文では「あなたの子孫」と説明的に限定せず、原文の表現と含みを保った。
- source_word: בִּמְאֹד מְאֹד
  choice: おびただしく
  rationale: מְאֹדの反復による強い強調を、過度に逐語的な「非常に非常に」を避けつつ、明瞭で格調のある現代日本語で表した。
theological_decisions:
- issue: נתן＋בְּרִיתという契約表現
  choice: わたしの契約を立てる
  alternative: わたしの契約を置く／与える
  rationale: 「置く」「与える」は語の基本義に近いが、日本語では契約の授受や物理的配置と誤解されやすい。「立てる」は、神が契約を設定するという文脈上の意味を自然に伝えつつ、契約が神のものであることも保持する。字義的な選択肢は脚注に残した。
- issue: 「あなたを増やす」の指示範囲
  choice: あなたをおびただしく増やす
  alternative: あなたの子孫をおびただしく増やす
  rationale: 約束が子孫の増加を含むことは文脈上明らかだが、原文の直接目的語は単数の「あなた」である。本文では解釈的な展開を避け、アブラム本人と彼から出る民を重ね得る原文の表現上の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の発話にふさわしい簡潔さと品位を保った。「おびただしく」は強調を自然に伝える語として採用し、「あなたを」は原文の単数直接目的語をあえて保持した。
