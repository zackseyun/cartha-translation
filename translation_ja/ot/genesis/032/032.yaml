  text: The sun rose upon him as he passed Penuel[c][b][a], and he was limping on his thigh.
translation:
  language: ja
  text: 彼がペヌエル[a]を通り過ぎたとき、太陽が彼の上に昇った。彼は腿のせいで足を引きずっていた[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: この箇所のヘブライ語では「ペヌエル」。同じ地名は別の箇所で「ペニエル」とも表記される。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「彼の腿の上で」。ここでは「腿のせいで」という原因の意味に取った。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְרַח לוֹ הַשֶּׁמֶשׁ
  choice: 太陽が彼の上に昇った
  rationale: זרחと「太陽」の組み合わせを自然に「昇った」とし、לוֹは場面の視点を保つため「彼の上に」と訳した。
- source_word: כַּאֲשֶׁר עָבַר
  choice: 通り過ぎたとき
  rationale: כאשרの時間的関係とעברの「通過する」という意味を、現代日本語で明瞭に表した。
- source_word: פְּנוּאֵל
  choice: ペヌエル
  rationale: この節のマソラ本文の母音を反映した音写。別形「ペニエル」に統一しなかった。
- source_word: וְהוּא צֹלֵעַ
  choice: 彼は足を引きずっていた
  rationale: 分詞が表す継続中の状態を「～ていた」で示し、צלֵעַを自然な日本語で表した。
- source_word: עַל יְרֵכוֹ
  choice: 腿のために
  rationale: 字義的には「彼の腿の上で」だが、עַלはここで原因を示しうる。「腿のために」として不自然な空間表現を避けつつ、本文が明記しない「股関節の傷」まで補わないようにした。
