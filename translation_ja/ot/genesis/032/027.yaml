  text: וַ/יֹּ֣אמֶר שַׁלְּחֵ֔/נִי כִּ֥י עָלָ֖ה הַ/שָּׁ֑חַר וַ/יֹּ֨אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲ/ךָ֔ כִּ֖י אִם בֵּרַכְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/027.yaml
  text: And he said[a], “Let me go, for the dawn has risen.” But he said[c][b], “I will not let you go unless you bless me.”
translation:
  language: ja
  text: 彼は言った[c]。「わたしを放してくれ[a]。夜が明けたからだ[b]。」しかし、もう一人は言った[c]。「わたしを祝福してくれなければ、あなたを放さない。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「わたしを解放してくれ」または「わたしを行かせてくれ」。
    reason: lexical_alternative
  - marker: b
    text: 直訳「暁が上った」。別訳「夜が明けるからだ」。
    reason: lexical_alternative
  - marker: c
    text: ヘブライ語は、この節の話者を明示していない。誰が話しているかは前後の物語から推定される。
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי
  choice: わたしを放してくれ
  rationale: שׁלחの命令形に一人称単数接尾辞が付き、「わたしを送り出せ／解放せよ」の意。格闘の文脈では「放してくれ」が自然で、相手の拘束を解くよう求める語感を保つ。
- source_word: כִּי עָלָה הַשָּׁחַר
  choice: もう夜が明ける
  rationale: 直訳的には「暁が上った」。日本語では夜明けの到来を「夜が明ける」と表すのが自然であり、כִּיの理由を示す働きも前後関係で明確になる。「もう」により夜明けが迫った状況を簡潔に表す。
- source_word: לֹא אֲשַׁלֵּחֲךָ
  choice: あなたを放さない
  rationale: 否定辞と未完了形による断固とした拒否。「放す」を反復し、前半のשׁלחとの語の対応を保持する。
- source_word: כִּי אִם
  choice: なければ
  rationale: 例外または条件を導く結合表現。ここでは祝福を解放の条件とするため、日本語の条件表現「なければ」が自然。
- source_word: בֵּרַכְתָּנִי
  choice: わたしを祝福してくれ
  rationale: 二人称男性単数完了形に一人称目的語接尾辞。כִּי אִםに続き、解放に先立って要求される行為を表すため、日本語では依頼内容として「祝福してくれ」とする。
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: すると彼は言った……しかし、もう一人は言った
  rationale: 原文は双方とも同じ「そして彼は言った」だが、主語を明示しないまま日本語にすると話者交替が不明瞭になる。「もう一人」により二者間の交替だけを示し、人物の具体的な同定は避ける。「しかし」は応答の対立を自然に表す。
theological_decisions:
- issue: 話者の同定
  choice: 固有名や「神」「御使い」を補わず、「彼」と「もう一人」にとどめる
  alternative: 最初の話者を「その人／御使い／神」、次の話者を「ヤコブ」と明記する
  rationale: ヘブライ語本文は両者を三人称男性単数の動詞形だけで表し、この節自体では名を挙げない。具体的な同定を本文へ補うと周辺文脈に基づく解釈を訳文に固定するため、話者交替を理解可能にする最小限の補足にとどめる。
translation_notes:
  register: 明瞭で現代的な標準日本語を用いつつ、会話には簡潔で切迫した調子を持たせた。「放してくれ／放さない」の反復で原文の語の対応を保つ。話者の固有名や神学的身元は訳文で確定せず、原文の曖昧さを注で説明する。
