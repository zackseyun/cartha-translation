  naturalness: 「彼らを連れて、その川を渡らせ」は理解可能だが、「連れて行き、その川を渡らせた」とすると、לקחとעברの二つの叙述動詞の連続がより自然かつ明確になる。後半は「向こう岸へ移した」とすることで現代標準語として明快になる。
  terminology: נחלを本文で「川」とする選択は、一般読者向けとして適切であり、脚注で谷川・涸れ川等の可能性を示す方針も妥当である。אשר לוֹは必ずしも「持ち物」に限定されないため、本文は「自分に属するもの」として原文の広がりを保つ。
