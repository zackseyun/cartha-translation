  text: He took them and brought them across the stream[b][a], and he brought across what belonged to him.
translation:
  language: ja
  text: 彼は彼らを連れて行き、その川[a]を渡らせた。また、自分に属するもの[b]も向こう岸へ移した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「谷川」「涸れ川」とも訳せる。ヘブライ語は、川のほか、谷間の水流や季節的に水が流れる川筋を指すことがある。
    reason: lexical_alternative
  - marker: b
    text: 直訳「彼に属するもの」。すなわち、彼の所有物。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵם
  choice: 彼は彼らを連れて
  rationale: לקחの基本義「取る」を踏まえつつ、人々を川辺へ伴う文脈に合う自然な日本語とした。
- source_word: וַיַּעֲבִרֵם
  choice: 彼らを渡らせ
  rationale: עברのヒフィル形が持つ使役の意味を明確に保った。
- source_word: הַנָּחַל
  choice: その川[a]
  rationale: נחלは川、谷川、季節的な水流や涸れ川を指し得る。本文では理解しやすい「川」とし、地形上の幅を脚注に残した。
- source_word: וַיַּעֲבֵר
  choice: 渡した
  rationale: ここでもעברのヒフィル形であり、所有物を向こう岸へ移したという使役的な動作を、簡潔で自然な日本語で表した。
- source_word: אֲשֶׁר לוֹ
  choice: 自分の持ち物[b]
  rationale: 直訳すれば「彼に属するもの」。文脈上はヤコブの所有物を指すため、明瞭な表現を採用した。
