source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְ/ךָ֔ כִּ֖י אִם יִשְׂרָאֵ֑ל כִּֽי שָׂרִ֧יתָ עִם אֱלֹהִ֛ים וְ/עִם אֲנָשִׁ֖ים וַ/תּוּכָֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/029.yaml
  text: And he said[a], “Your name shall no longer be called Jacob, but Israel, because you have striven with God and with men[b], and have prevailed.”
translation:
  language: ja
  text: その人は言った。「あなたの名はもはやヤコブではなく、イスラエルと呼ばれる。あなたは神[a]とも人々[b]とも争い、勝ったからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神的な存在」。ヘブライ語 אֱלֹהִים は、文脈によって神、神々、天上の存在を指し得る。ここでは物語の文脈に従って「神」とした。
    reason: alternative_reading
  - marker: b
    text: または「人間」。
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵאָמֵר
  choice: 呼ばれる
  rationale: 命名の定型表現におけるאמרの受動形。日本語では「言われる」より「呼ばれる」が自然で、名を宣言する意味を明確に伝える。
- source_word: עוֹד
  choice: もはや…なく
  rationale: 以前の名で呼ぶことが終わることを示すため、文脈に即した自然な日本語とした。
- source_word: כִּי אִם
  choice: ではなく
  rationale: 「ヤコブ」と「イスラエル」を対照する逆接的な構文として訳した。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 固有名を音写した。名に込められた語呂と説明は後続の「争い」という句によって示す。
- source_word: שָׂרִיתָ
  choice: 争い
  rationale: 動詞שרהが表す、相手と力を競い合う意味を簡潔に表し、「イスラエル」という名との語呂をできる限り保った。直前の格闘という文脈にも合う。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 物語の文脈では単数の神を指す理解が最も自然であり、ヤコブの出会いが持つ神学的な重みを保つ。ただし語そのものが取り得る別の意味は脚注に残した。
- source_word: אֲנָשִׁים
  choice: 人々
  rationale: אישの複数形を自然な現代日本語で表した。「神と人々」という対比を保ちつつ、文脈上不要な性別指定を加えていない。
- source_word: וַתּוּכָל
  choice: 勝った
  rationale: יכלがここで表す、争いの中で優位を得た、または持ちこたえて成功したという結果を、明瞭で自然な日本語にした。完全な征服を意味する「打ち負かした」は避けた。
theological_decisions:
- issue: 命名理由におけるאֱלֹהִיםの指示対象
  choice: 神
  alternative: 神的な存在、天上の存在
  rationale: 直近の物語とヤコブ自身の理解は神との遭遇を示すため、本文では「神」とした。一方、格闘した人物の正体をめぐる物語上の神秘を過度に解消しないよう、語の別解を脚注に示した。
- issue: אֲנָשִׁיםの訳し方
  choice: 人々
  alternative: 人間
  rationale: ヘブライ語はאישの男性複数形だが、日本語の「人々」は通常、性別を明示せず複数の人を自然に表す。原文の主要な対比である「神／人」を維持し、別訳を脚注に示した。
- issue: וַתּוּכָלが示す勝利の程度
  choice: 勝った
  alternative: 持ちこたえた、成し遂げた
  rationale: 争いの成功という文脈的意味を示しつつ、ヤコブが神を完全に征服したという読みを訳語によって強制しない表現を選んだ。
translation_notes:
  register: 明瞭な現代標準語を用いながら、改名を告げる場面にふさわしい簡潔で厳かな調子を保った。「その人」は格闘相手を指し、その正体を本文で先取りして確定しない表現である。脚注記号は該当語の直後に置いた。
