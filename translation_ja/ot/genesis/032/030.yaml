  text: וַ/יִּשְׁאַ֣ל יַעֲקֹ֗ב וַ/יֹּ֨אמֶר֙ הַגִּֽידָ/ה נָּ֣א שְׁמֶ֔/ךָ וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֖ה תִּשְׁאַ֣ל לִ/שְׁמִ֑/י וַ/יְבָ֥רֶךְ אֹת֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/030.yaml
  text: Then Jacob asked[a], “Please tell me your name.” But he said[c][b], “Why is it that you ask my name?” And he blessed him there.
translation:
  language: ja
  text: そこでヤコブは尋ねた。「どうか、あなたの名を教えてください。」彼は言った。「いったい、なぜ私の名を尋ねるのか。」彼はその場でヤコブを祝福した。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... וַיֹּאמֶר
  choice: 尋ねた
  rationale: ヘブライ語の「尋ねて言った」という連続表現を、発話内容が直後に続く自然な現代日本語として「尋ねた」とした。問いかけであることは十分に保持される。
- source_word: הַגִּידָה נָּא
  choice: どうか、…教えてください
  rationale: נגדのヒフィル命令形「告げる、知らせる」と、依頼を和らげるנָאの語調を、丁寧で自然な依頼表現で示した。
- source_word: שְׁמֶךָ
  choice: あなたの名
  rationale: 基本義をそのまま訳した。「名」が持ちうる人格・身元上の含意は説明的に補わず、文脈に委ねた。
- source_word: לָמָּה זֶּה
  choice: いったい、なぜ
  rationale: 単なる「なぜ」より強調を帯びたヘブライ語の言い回しを、日本語として自然な「いったい、なぜ」で表した。
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: 私の名を尋ねる
  rationale: 「私の名について問う」という原文の意味を簡潔に保ち、直前のヤコブの依頼との対応を明確にした。
- source_word: וַיְבָרֶךְ אֹתוֹ שָׁם
  choice: そして、そこでヤコブを祝福した
  rationale: ברךを「祝福した」、שָׁםを「そこで」と訳した。日本語で「彼を」とすると主語・目的語が紛らわしいため、目的語を「ヤコブ」と明示したが、祝福した者の名は補っていない。
theological_decisions:
- issue: 名を明かさず、ヤコブを祝福する者の正体
  choice: 発言では「彼」とし、最後の文では主語を省略して、正体を特定しない
  alternative: 「その人」「神」「御使い」などと明示する
  rationale: この節のヘブライ語は発言者および祝福する者の主語を明示していない。前後の文脈がその正体について神学的な理解を促すとしても、本節だけで特定せず、原文の含みを保持した。
translation_notes:
  register: 明快な現代標準日本語を用いながら、依頼と応答には簡潔で厳かな調子を保った。「名前」より「名」を選び、聖書叙述にふさわしい品位と、身元を問う場面の重みを両立させた。
