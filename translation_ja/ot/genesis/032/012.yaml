  text: הַצִּילֵ֥/נִי נָ֛א מִ/יַּ֥ד אָחִ֖/י מִ/יַּ֣ד עֵשָׂ֑ו כִּֽי יָרֵ֤א אָנֹכִי֙ אֹת֔/וֹ פֶּן יָב֣וֹא וְ/הִכַּ֔/נִי אֵ֖ם עַל בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/012.yaml
  text: Please deliver me from the hand of my brother[a], from the hand of Esau, for I am afraid of him, lest he come and strike me[b], the mother with the children.
translation:
  language: ja
  text: どうか、兄の手から、エサウの手から、私を救い出してください。私は彼を恐れています。彼が来て、私を打ち、母と子どもたちをもろとも打つのではないかと恐れているからです。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「子どもたちの上の母」。母と子どもたちを共に打ち倒すことを表す慣用的な言い方です。
    reason: 原文の特異な表現と、その慣用的意味を示すため。
lexical_decisions:
- source_word: הַצִּילֵנִי נָא
  choice: どうか、私を救い出してください
  rationale: נצלのヒフィル命令形に嘆願の助詞נָאが続く。現代日本語の祈願として自然で、切迫した願いを表す。
- source_word: מִיַּד אָחִי מִיַּד עֵשָׂו
  choice: 兄の手から、エサウの手から
  rationale: מִיַּדの具体的な比喩を保ち、同一人物を「兄」「エサウ」と重ねる原文の反復と緊張感を再現する。
- source_word: כִּי יָרֵא אָנֹכִי אֹתוֹ
  choice: 私は彼が怖いのです
  rationale: 現在の恐れを明快な現代日本語で表し、כִּיによる嘆願の理由を「のです」で自然につなぐ。
- source_word: פֶּן יָבוֹא
  choice: 彼が来て、…のではないかと恐れています
  rationale: פֶּןが示す危惧を、日本語で自然な「のではないかと恐れる」によって表す。
- source_word: וְהִכַּנִי
  choice: 私を…打つ
  rationale: נכהの語義を「殺す」と限定せず、暴力的に打つ・襲う意味を保つ。
- source_word: אֵם עַל בָּנִים
  choice: 母も子どもたちもろとも
  rationale: 直訳的な「子らの上の母」では意味が伝わりにくいため、母と子が一緒に攻撃されるという慣用句の意味を簡潔に示す。
theological_decisions:
- issue: אֵם עַל בָּנִיםと一人称目的語「私」の関係
  choice: 「私を、母も子どもたちもろとも打つ」として、ヤコブへの攻撃が家族全体に及ぶ恐れを表す
  alternative: 「母と子どもたちを打つ」として、「私」と並ぶ別の目的語と明示する
  rationale: 原文はוְהִכַּנִיの一人称目的語の後に慣用句を置くため統語上やや圧縮されている。本文では日本語として理解可能にしつつ、「打ち殺す」と断定せず、母子を共に襲う家族壊滅のイメージを保った。
translation_notes:
  register: 現代標準日本語による、切迫した祈りとして訳した。「御手」などの古風・宗教的な語を避けつつ、原文の「手」の比喩と反復は保持した。
