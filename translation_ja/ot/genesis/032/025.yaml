  yaml_path: translation/ot/genesis/032/025.yaml
  text: And Jacob was left alone[b][a], and a man wrestled with him until the dawn came up.
translation:
  language: ja
  text: ヤコブは一人残された。すると、ある男[b]が夜明けまで[a]ヤコブと格闘した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「暁が昇るまで」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語は「ある男」と述べる。後の文脈およびホセア書12章は、この人物をさらに理解する手がかりとなる。
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּוָּתֵר
  choice: 残された
  rationale: ニファル形の受動的なニュアンスを保ち、先に皆を渡らせた後でヤコブが一人になったという文脈を自然な日本語で表す。
- source_word: לְבַדּוֹ
  choice: 一人
  rationale: ヤコブの孤立を簡潔かつ自然に示す。
- source_word: וַיֵּאָבֵק
  choice: 格闘した
  rationale: このまれな動詞は、組み合って争うことを指す。「格闘した」は、一般的すぎる「争った」より具体的である。
- source_word: אִישׁ
  choice: ある男
  rationale: この節は相手を明示的に「男」とだけ呼んでいるため、後の文脈による同定を先取りせず、物語上の謎を保つ。
- source_word: עִמּוֹ
  choice: 彼と
  rationale: 格闘の相手がヤコブであることを自然な日本語で示す。
- source_word: עַד עֲלוֹת הַשָּׁחַר
  choice: 夜明けまで
  rationale: 直訳は「暁が昇るまで」。「夜明けまで」は同じ時間的意味を明瞭で自然な現代日本語として伝える。
theological_decisions:
- issue: 格闘した אִישׁ の正体
  choice: 本文では「ある男」と訳し、その正体を特定しない。
  alternative: 「御使い」、または「人の姿で現れた神／主」と訳す。
  rationale: この節自体は相手を「男」とのみ提示している。後続文脈やホセア12章4節はその理解に関わるが、ここでは正体を先取りせず、原文の神学的・物語的緊張を保つ。
translation_notes:
  register: 明瞭で格調を失わない現代標準日本語。「こうして」で直前の渡河場面とのつながりを示し、「すると」で新たな出来事の開始を自然に表した。脚注記号は該当する時間表現の直後に置いた。
