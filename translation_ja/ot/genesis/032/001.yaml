  text: וַ/יַּשְׁכֵּ֨ם לָבָ֜ן בַּ/בֹּ֗קֶר וַ/יְנַשֵּׁ֧ק לְ/בָנָ֛י/ו וְ/לִ/בְנוֹתָ֖י/ו וַ/יְבָ֣רֶךְ אֶתְ/הֶ֑ם וַ/יֵּ֛לֶךְ וַ/יָּ֥שָׁב לָבָ֖ן לִ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/001.yaml
  text: Laban rose early in the morning[a], kissed his sons and his daughters, and blessed them. Then Laban departed and returned to his place.
translation:
  language: ja
  text: ラバンは朝早く起き、自分の息子たちと娘たち[a]に口づけをして、彼らを祝福した。それからラバンは立ち去り、自分の所へ帰った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「自分の息子たちと娘たち」。ここではラバンの子孫、すなわち孫たちを指している可能性が高い。
    reason: 親族語が直接の子だけでなく子孫を指し得ることを説明するため。
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: 朝早く起き
  rationale: שׁכםのヒフィル形が表す「早く起きる」という意味と、בַּבֹּקֶרの「朝に」を、自然な現代日本語の「朝早く起きる」で表した。
- source_word: וַיְנַשֵּׁק
  choice: 口づけし
  rationale: 別れに際して家族にキスする行為を直接表す。本文の品位に合わせ、「キスし」よりも「口づけし」を選んだ。
- source_word: לְבָנָיו וְלִבְנוֹתָיו
  choice: 自分の息子たちと娘たち
  rationale: 原文の性別を明示した親族名称を保った。文脈上は子孫、特に孫たちを含む可能性があるため、その点は脚注で示した。
- source_word: וַיְבָרֶךְ אֶתְהֶם
  choice: 彼らを祝福した
  rationale: ברךの基本的な意味「祝福する」を保持し、単なる別れの挨拶には弱めなかった。
- source_word: וַיֵּלֶךְ
  choice: 立ち去り
  rationale: 後続する「帰る」との動作の連続を自然に示しつつ、「行く」という原文の意味を文脈に即して表した。
- source_word: וַיָּשָׁב לִמְקֹמוֹ
  choice: 自分の所へ帰って行った
  rationale: שׁובの「帰る、戻る」とמקוםの「場所、所」を保ち、「家」と限定する情報は加えなかった。
theological_decisions:
- issue: 性別を明示する親族名称とその指示対象
  choice: 息子たちと娘たち
  alternative: 子どもたち／孫たち
  rationale: ヘブライ語は「息子たち」と「娘たち」を明記しているため、その区別を本文に残した。一方、聖書ヘブライ語の親族語は子孫を広く指し得るので、文脈上の可能性を脚注で説明し、本文で一義的に「孫たち」と確定しなかった。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。物語の簡潔な動作の連続を維持し、原文にない「家」などの限定は避けた。
