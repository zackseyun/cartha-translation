id: GEN.32.11
reference: Genesis 32:11
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: קָטֹ֜נְתִּי מִ/כֹּ֤ל הַ/חֲסָדִים֙ וּ/מִ/כָּל הָ֣/אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת עַבְדֶּ֑/ךָ כִּ֣י בְ/מַקְלִ֗/י עָבַ֨רְתִּי֙ אֶת הַ/יַּרְדֵּ֣ן הַ/זֶּ֔ה וְ/עַתָּ֥ה הָיִ֖יתִי לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/011.yaml
  text: I am unworthy of all the steadfast love and all the faithfulness that you have shown to your servant[a], for with my staff I crossed this Jordan[c][b], and now I have become two camps.
translation:
  language: ja
  text: 私は、あなたがこのしもべに示してくださった、あらゆる慈しみ[b]と誠実に値しない者です[a]。杖を手にしてこのヨルダン川を渡った私が、今では二つの宿営となりました。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「私は、すべての慈しみと誠実に比べて小さい」となります。神の豊かな恵みを前にした謙遜を表す言い方です。
    reason: lexical_alternative
  - marker: b
    text: 「慈しみ」に当たるヘブライ語は複数形で、神が繰り返し具体的に示した慈しみ深い行いを含みます。
    reason: source_form
lexical_decisions:
- source_word: קָטֹנְתִּי
  choice: 値しない者です
  rationale: 字義的には「私は小さい／小さくなった」だが、ここでは神から受けた恵みに比して自分を低くする謙遜の表現。「値しない者です」は、その慣用的意味を明瞭で自然な現代日本語で表す。字義に近い意味合いは脚注に残した。
- source_word: הַחֲסָדִים
  choice: あらゆる慈しみ
  rationale: חסדは、関係に根差した忠実な愛と親切を表す。「慈しみ」は情緒だけに限定せず、神が具体的に示した恵み深い行為を含みうる。複数形が示唆する度重なる具体的な現れは脚注で補った。
- source_word: הָאֱמֶת
  choice: 誠実
  rationale: חסדと対をなすこの文脈では、抽象的な「真理」よりも、神の確かさ・信頼性を表す「誠実」が適切である。
- source_word: עָשִׂיתָ אֶת עַבְדֶּךָ
  choice: あなたがこのしもべに示してくださった
  rationale: 字義的には「あなたがあなたのしもべに対して行った」。目的語が慈しみと誠実なので、日本語では「示してくださった」が自然。「このしもべ」は祈りの中で自分を指す謙譲表現として訳した。
- source_word: בְמַקְלִי
  choice: 杖を手にして
  rationale: 前置詞בְּと「私の杖」を自然な日本語にした。「杖一本だけで」は文脈に合うが、「だけ」は原文に明示されないため本文には加えなかった。
- source_word: עָבַרְתִּי אֶת הַיַּרְדֵּן הַזֶּה
  choice: このヨルダン川を渡った
  rationale: 指示語הַזֶּהの近接性を「この」で保持し、日本語で通例となる「川」を地名に添えた。
- source_word: הָיִיתִי לִשְׁנֵי מַחֲנוֹת
  choice: 今では二つの宿営となりました
  rationale: 直訳に近い「二つの宿営となった」を保ち、ヤコブの一行が今や二つの集団を成すという具体的な像を残した。
theological_decisions:
- issue: 神のחסדとאמתの組み合わせ
  choice: 「慈しみ」と「誠実」
  alternative: 「変わらぬ愛」と「真実」／「契約に忠実な愛」と「真実」
  rationale: 両語の関係的・契約的な含みを保ちつつ、「契約」という語を原文以上に明示せず、二つの概念も同じ日本語に平板化しないようにした。
- issue: קָטֹנְתִּיが表す自己評価
  choice: 神の恵みに「値しない者」だという謙遜
  alternative: 「私は小さすぎます」／「私は及びません」
  rationale: 神の慈しみを受ける資格が自分にあると主張しない祈りの姿勢を表す。ただし、人間の本質的無価値についての体系的教説まで本文に持ち込まず、原文の比喩は脚注で示した。
translation_notes:
  register: 明瞭な現代標準語を基調としつつ、祈りにふさわしい落ち着いた敬体を用いた。「しもべ」「慈しみ」「宿営」は聖書的な格調を保ちながら一般読者にも理解可能な語として採用した。
