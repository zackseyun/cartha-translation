base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/020.yaml
  text: And he commanded the second also[a], and the third also, and all those going behind the droves, saying, “According to this word you shall speak to Esau when you find him.”
translation:
  language: ja
  text: ヤコブは、二番目の者にも、三番目の者にも、また群れの後について行くすべての者にも命じた。「エサウに出会ったとき、このとおりに彼に言いなさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: 命じた
  rationale: ピエル形の指示・命令の力を保ち、文脈にも自然に合う。
- source_word: גַּם אֶת הַשֵּׁנִי גַּם אֶת הַשְּׁלִישִׁי
  choice: 二番目の者にも、三番目の者にも
  rationale: 名詞化された序数を保ちつつ、日本語では指示対象が人であることを自然に示すため「者」を補った。「僕」と限定することは避けた。
- source_word: כָּל הַהֹלְכִים אַחֲרֵי הָעֲדָרִים
  choice: 群れの後について行くすべての者
  rationale: 分詞の継続的な動作を「ついて行く」で表し、עֲדָרִים は家畜のまとまりを指すため簡明に「群れ」とした。
- source_word: לֵאמֹר
  choice: （直接話法で表現）
  rationale: 日本語では引用符によって発言内容の導入が明らかなため、独立した「言って」を置かず自然な直接話法とした。
- source_word: כַּדָּבָר הַזֶּה תְּדַבְּרוּן
  choice: このとおりに彼に言いなさい
  rationale: 直訳的な「この言葉に従って話しなさい」より自然でありながら、ヤコブが定めた同じ内容を伝えるよう命じた意味を保つ。
- source_word: בְּמֹצַאֲכֶם אֹתוֹ
  choice: エサウに出会ったとき
  rationale: מצא はここでは遭遇の意味合いを持つため、日本語として自然な「出会ったとき」とした。目的語の代名詞は明確さのため固有名「エサウ」で表した。
