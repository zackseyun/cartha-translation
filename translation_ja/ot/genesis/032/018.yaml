  text: And he commanded the first one, saying, “When Esau my brother meets you and asks you, ‘Whose are you, and where are you going, and whose are these before you?’...”
translation:
  language: ja
  text: ヤコブは最初の者に命じた。「もし兄エサウがおまえに出会って、『おまえはだれの者か。どこへ行くのか。おまえの前にいるこれらは、だれのものか』と尋ねたら、
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרִאשׁוֹן
  choice: 先頭の者
  rationale: 贈り物の群れを率いる僕たちのうち、順序上最初の者を指す。文脈を補いすぎず、自然な日本語とした。
- source_word: לְמִי אַתָּה
  choice: おまえはだれの者か
  rationale: 直訳的には「あなたはだれに属するか」。古代の僕と主人の関係を背景にした問いの簡潔さを保った。
- source_word: וְאָנָה תֵלֵךְ
  choice: どこへ行くのか
  rationale: 方向・行き先を問う表現として、現代日本語で明瞭に訳した。
- source_word: וּלְמִי אֵלֶּה לְפָנֶיךָ
  choice: おまえの前にいるこれらのものは、だれのものか
  rationale: 家畜の群れを指すため「もの」とし、לְפָנֶיךָ の位置関係も明示した。
- source_word: וַיְצַו
  choice: 命じた
  rationale: 単なる依頼ではなく指示を与える動詞の強さを保持した。
