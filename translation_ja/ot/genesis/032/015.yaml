  language: ja
  text: 雌やぎ二百匹、雄やぎ二十匹、雌羊二百匹、雄羊二十匹。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִזִּים
  choice: 雌やぎ
  rationale: やぎを指す語であり、ここでは続く雄やぎとの対比から雌であることを明示した。現代日本語で分かりやすい表現とした。
- source_word: מָאתַיִם
  choice: 二百匹
  rationale: 基数「二百」を、家畜を数える自然な助数詞「匹」とともに訳した。
- source_word: תְיָשִׁים
  choice: 雄やぎ
  rationale: 雄のやぎを指すため、性別を明確に保ちつつ現代日本語で自然な「雄やぎ」とした。
- source_word: עֶשְׂרִים
  choice: 二十匹
  rationale: 基数「二十」を、家畜を数える自然な助数詞「匹」とともに訳した。
- source_word: רְחֵלִים
  choice: 雌羊
  rationale: 雌の羊を指し、続く雄羊との対比も保てる簡潔な訳語を選んだ。
- source_word: אֵילִים
  choice: 雄羊
  rationale: 雄の羊、特に繁殖可能な雄羊を指す。対になる「雌羊」と対応する明瞭な表現とした。
