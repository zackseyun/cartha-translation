  text: עַל כֵּ֡ן לֹֽא יֹאכְל֨וּ בְנֵֽי יִשְׂרָאֵ֜ל אֶת גִּ֣יד הַ/נָּשֶׁ֗ה אֲשֶׁר֙ עַל כַּ֣ף הַ/יָּרֵ֔ךְ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֤י נָגַע֙ בְּ/כַף יֶ֣רֶךְ יַעֲקֹ֔ב בְּ/גִ֖יד הַ/נָּשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/033.yaml
  text: Therefore[a], to this day the sons of Israel do not eat the sinew of the hip, which is on the socket of the thigh[d][c][b], because he touched the socket of Jacob’s thigh at the sinew of the hip.
translation:
  language: ja
  text: それゆえ、イスラエルの子らは今日に至るまで、腿の付け根にある「腿の筋」[a]を食べない。その人がヤコブの腿の付け根にある「腿の筋」に触れたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「腿の筋」に当たるヘブライ語がどの部位を指すかは確定していない。坐骨神経、またはその付近の腱を指すとする見方もある。
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: עַל כֵּן
  choice: それゆえ
  rationale: 直前の出来事を現在まで続く慣習の理由として示す因果・帰結表現を、簡潔で格調ある日本語にした。
- source_word: לֹא יֹאכְלוּ
  choice: 食べない
  rationale: 否定を伴う未完了形が継続的な慣習を表すため、日本語の現在形で訳した。
- source_word: בְנֵי יִשְׂרָאֵל
  choice: イスラエルの子ら
  rationale: 「イスラエル人」も可能だが、ヤコブがイスラエルと呼ばれた直前の文脈と、ヘブライ語の家族的表現を保った。
- source_word: גִּיד הַנָּשֶׁה
  choice: 「腿の筋」
  rationale: גיד は腱・筋・神経などを指し得て、הנשה の意味と具体的な解剖学的同定も確実でない。「坐骨神経」などと限定せず、伝統的で広い「筋」を用い、定型名称であることをかぎ括弧で示した。
- source_word: אֲשֶׁר עַל כַּף הַיָּרֵךְ
  choice: 腿の付け根にある
  rationale: כף はここではくぼみや関節部、ירך は腿から腰周辺を表す。「腿の関節窩」では技術的すぎるため、自然な日本語で身体部位を示した。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 今日に至るまで
  rationale: 慣習が語り手の時代まで続いていることを表す定型的かつ明瞭な表現。
- source_word: כִּי נָגַע
  choice: 触れたからである
  rationale: נגע の基本義「触れる」を保持し、文脈上の強い作用を「打つ」などと過剰に解釈しなかった。
- source_word: בְּכַף יֶרֶךְ יַעֲקֹב בְּגִיד הַנָּשֶׁה
  choice: ヤコブの腿の付け根、「腿の筋」に
  rationale: 二つの בְּ 句を接触した身体部位とその具体的位置を示す同格的な表現として訳し、前半との用語の一貫性を保った。
theological_decisions:
- issue: נָגַע の主語の明示
  choice: あの方
  alternative: 彼／主語を省略する
  rationale: ヘブライ語では動詞の男性単数形だけで名を反復しない。前節までの格闘相手を指すが、その正体を本節だけで断定しないよう「あの方」とし、敬意を含みつつ曖昧さを保った。
translation_notes:
  register: 明瞭な現代標準語を用いながら、説明的な結び「からである」で物語の由来説明としての格調を保った。「腿」は「もも」よりやや文語的だが、聖書本文の身体部位として自然であり、「付け根」と組み合わせて一般読者にも理解しやすくした。
