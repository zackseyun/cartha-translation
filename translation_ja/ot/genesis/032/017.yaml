base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/017.yaml
  text: He put each herd by itself into the hand of his servants[a], and said to his servants, “Pass on ahead of me[d][c][b], and put a space between herd and herd.”
translation:
  language: ja
  text: ヤコブは、群れを一つずつ別にして自分の家来たちに託し[a]、彼らに言った。「私の先を進み、群れと群れとの間に間隔を置きなさい[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「自分の家来たちの手に与えた」。これは、彼らの管理に委ねることを表すヘブライ語の言い回し。
    reason: lexical_alternative
  - marker: b
    text: 「一つの群れと次の群れとの間に間を置きなさい」とも訳せる。ヘブライ語では「群れ」が繰り返され、各群れを順に隔てることが強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן בְּיַד עֲבָדָיו
  choice: 僕たちに任せ
  rationale: 直訳は「僕たちの手に与えた」だが、בְּיַד は管理や支配のもとに託すことを表す慣用句である。現代日本語では「任せ」がその意味を自然に伝える。
- source_word: עֲבָדָיו
  choice: 僕たち
  rationale: עֶבֶד は「奴隷」と「僕」の双方を指し得るが、ここではヤコブの指示を実行する家の者として描かれており、身分を不必要に限定しない「僕」が文脈に適する。
- source_word: עֵדֶר עֵדֶר לְבַדּוֹ
  choice: それぞれの群れを別々にして
  rationale: עֵדֶר の反復は配分を表し、各群れを一群ずつ分けることを強調する。לְבַדּוֹ の「それだけで、別に」も明示した。
- source_word: עִבְרוּ לְפָנַי
  choice: 私より先に進み
  rationale: עָבַר の基本的な移動の意味を保ちつつ、この場面では僕たちがヤコブに先行するよう命じられていることを自然に表す。特定の川などを「渡る」とは限定しない。
- source_word: וְרֶוַח תָּשִׂימוּ
  choice: 間隔を置きなさい
  rationale: רֶוַח はここでは群れ同士の空間または隔たりを指す。「間隔を置く」は שׂים と組み合わせた命令を明瞭な現代日本語で表す。
- source_word: בֵּין עֵדֶר וּבֵין עֵדֶר
  choice: 群れと群れとの間に
  rationale: ヘブライ語の反復を生かし、各群れの間を隔てるという配分的な意味を簡潔に表した。
