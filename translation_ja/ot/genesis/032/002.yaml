  yaml_path: translation/ot/genesis/032/002.yaml
  text: And Jacob went on his way[b][a], and the angels of God met him.
translation:
  language: ja
  text: ヤコブは旅を続けて行った。すると、神の御使いたち[a]が彼に出会った[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「神の使者たち」。ヘブライ語の語は、人間の使者を指すこともある。
    reason: lexical_alternative
  - marker: b
    text: または「彼と出会った」「彼に遭遇した」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַעֲקֹב
  choice: ヤコブが
  rationale: 接続詞 וְ は日本語の自然な物語の流れの中で、続く「〜と」によって関係が十分に示されるため、独立した「そして」とはしなかった。
- source_word: הָלַךְ לְ/דַרְכּוֹ
  choice: 旅を続けていると
  rationale: 直訳的には「自分の道を行った」。文脈上は旅程を進み続けることを指すため、自然な現代日本語で表した。
- source_word: וַ/יִּפְגְּעוּ ב/וֹ
  choice: 彼に出会った
  rationale: פגע ב は「会う」「出会う」「遭遇する」を意味し得る。敵意や偶然性を必要以上に含ませず、かつ御使いたちが文法上の主語であることを保った。
- source_word: מַלְאֲכֵי אֱלֹהִים
  choice: 神の御使いたち
  rationale: מַלְאָךְ は「使者」と「天使」の両義を持つが、次節の「神の陣営」という文脈は天的存在を支持する。「御使い」は日本語聖書で通用する、敬意ある表現である。
theological_decisions:
- issue: מַלְאֲכֵי אֱלֹהִים の指示対象
  choice: 天的な存在として「神の御使いたち」
  alternative: 神の使者たち
  rationale: 語自体には人間の使者も含み得るが、直後にヤコブがその場所を「神の陣営」と呼ぶため、ここでは天的な御使いを指す可能性が高い。
- issue: וַיִּפְגְּעוּ בוֹ における出会いの方向
  choice: 御使いたちが彼に出会った
  alternative: 彼が御使いたちに出会った
  rationale: ヘブライ語では複数形の動詞の主語が「神の御使いたち」であり、接尾辞「彼に」はヤコブを指す。この文法的な方向を本文に保持した。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、聖書本文にふさわしい端正さを保った。「旅を続けていると」は לְדַרְכּוֹ の継続的な旅の含意を自然に伝え、「神の御使いたち」は日本語で天的存在を明確に示す。
