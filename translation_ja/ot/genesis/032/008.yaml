  text: וַ/יִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַ/יֵּ֣צֶר ל֑/וֹ וַ/יַּ֜חַץ אֶת הָ/עָ֣ם אֲשֶׁר אִתּ֗/וֹ וְ/אֶת הַ/צֹּ֧אן וְ/אֶת הַ/בָּקָ֛ר וְ/הַ/גְּמַלִּ֖ים לִ/שְׁנֵ֥י מַחֲנֽוֹת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/008.yaml
  text: Then Jacob was very afraid and distressed[a], and he divided the people who were with him, and the flocks, and the herds, and the camels, into two camps.
translation:
  language: ja
  text: そこでヤコブは非常に恐れ、苦悩した。そして、自分と一緒にいた人々、羊ややぎの群れ、牛の群れ、らくだを、二つの陣営[a]に分けた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「二つの一団」。ヘブライ語の語は、宿営する陣営または組織された一団を指すことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא יַעֲקֹב מְאֹד
  choice: ヤコブは非常に恐れ
  rationale: ירא「恐れる」を、強意の副詞 מְאֹד と合わせて自然な現代日本語で表した。
- source_word: וַיֵּצֶר לוֹ
  choice: 苦悩した
  rationale: 直訳的には「彼にとって苦しいこととなった」という構文で、強い内面的な苦しみや切迫感を表す。簡潔で品位ある日本語として「苦悩した」とした。
- source_word: וַיַּחַץ
  choice: 分けた
  rationale: חצה は「二分する、分ける」の意。ここでは危機に備えた意図的な行動を表す。
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: 自分と一緒にいた人々
  rationale: עם はここでは民族全体ではなく、ヤコブに同行していた人々を指す。
- source_word: הַצֹּאן
  choice: 羊ややぎの群れ
  rationale: צאן は主に羊とやぎから成る小家畜の集合を指すため、対象が明確になる表現を採った。
- source_word: הַבָּקָר
  choice: 牛の群れ
  rationale: בקר は集合的に牛類を指す。「羊ややぎの群れ」との並行も保った。
- source_word: הַגְּמַלִּים
  choice: らくだ
  rationale: גמלים の直接的な訳。現代日本語の一般的な表記として平仮名を用いた。
- source_word: לִשְׁנֵי מַחֲנוֹת
  choice: 二つの陣営
  rationale: מחנה は宿営地だけでなく、まとまって行動する一団も指し得る。次節にも続く語を保つため「陣営」とした。
theological_decisions: []
