  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַ/מָּק֖וֹם פְּנִיאֵ֑ל כִּֽי רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל פָּנִ֔ים וַ/תִּנָּצֵ֖ל נַפְשִֽׁ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/031.yaml
  text: And Jacob called the name of the place Peniel[a], for I have seen God face to face[c][b], and my life has been delivered.
translation:
  language: ja
  text: ヤコブはその場所をペニエル[a]と名づけた。「私は神[c]を顔と顔を合わせて見た。私の命は救われた[b]」からである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ペニエル」は「神の顔」を思わせる名で、続く「顔と顔を合わせて神を見た」という説明と響き合っている。
    reason: cultural_note
  - marker: b
    text: 直訳的には「私の魂は救われた」とも訳せる。ここで「魂」は「命」または「自分自身」を意味する。
    reason: lexical_alternative
  - marker: c
    text: 「神」は、より広く「神的な存在」と理解することもできるが、文脈は「神」を支持する。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא ... שֵׁם הַמָּקוֹם
  choice: その場所を…と名づけた
  rationale: קרא שׁם の命名表現を、現代日本語として自然に伝える。「その場所の名を…と呼んだ」より明瞭である。
- source_word: פְּנִיאֵל
  choice: ペニエル
  rationale: この節の綴りを音写し、「神の顔」という語呂合わせは脚注で示す。
- source_word: כִּי
  choice: 「…」からである
  rationale: 場所を命名した理由を示す因果関係を保ちつつ、ヘブライ語にない「彼は言った」を加えず、一人称の説明を引用として自然に示す。
- source_word: רָאִיתִי אֱלֹהִים
  choice: 私は…神を見た
  rationale: 文脈上はヤコブ自身が遭遇相手を神と理解しているため「神」とした。ただし אֱלֹהִים のより広い解釈可能性は脚注に残す。
- source_word: פָּנִים אֶל פָּנִים
  choice: 顔と顔を合わせて
  rationale: 直接対面したことを表す慣用句として自然であり、ペニエルとの「顔」の語のつながりも保持する。
- source_word: וַתִּנָּצֵל
  choice: 救われた
  rationale: נצל の受動的な救出・保全の意味を簡潔に表し、神との遭遇を生き延びたという結果を伝える。
- source_word: נַפְשִׁי
  choice: 私の命
  rationale: ここで נֶפֶשׁ は非物質的な「魂」に限定されず、生きている本人・生命を指すため、「命」が文脈に最も適する。
theological_decisions:
- issue: אֱלֹהִים の指示対象
  choice: 神
  alternative: 神的な存在
  rationale: 直前の格闘の物語とペニエルという命名理由から、ヤコブが相手を神と認識した発言として読むのが最も自然である。一方、語そのものが持ち得る広い意味は脚注で明示する。
- issue: 神を見ながら生存したことの表現
  choice: 神を見たのに、私の命は救われた
  alternative: 神を見て、私の命は救われた
  rationale: 接続辞自体は単純な連結だが、神を直接見たにもかかわらず生き延びたという文脈上の驚きと緊張を「のに」で自然に表す。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文にない発話導入句は補わず、一人称の命名理由を直接引用で示した。脚注記号は対応語句の直後に配置した。
