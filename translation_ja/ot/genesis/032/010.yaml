  to: そこでヤコブは言った。「私の父アブラハムの神、私の父イサクの神、ヤハウェよ。あなたは私に、『あなたの地と生まれ故郷[a]に帰れ。わたしはあなたに幸いを与える[b]』と言われました。」
  rationale: 本文の「親族のもと」を「生まれ故郷」に改めた。これにより、ヤコブの帰還という物語上の行き先と、מוֹלֶדֶתのこの文脈で有力な地理的意味を反映する。同語が持ち得る親族の意味は注記に保存した。他の表現と注記アンカーは維持した。
