source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣/י אַבְרָהָ֔ם וֵ/אלֹהֵ֖י אָבִ֣/י יִצְחָ֑ק יְהוָ֞ה הָ/אֹמֵ֣ר אֵלַ֗/י שׁ֧וּב לְ/אַרְצְ/ךָ֛ וּ/לְ/מוֹלַדְתְּ/ךָ֖ וְ/אֵיטִ֥יבָה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/010.yaml
  text: And Jacob said[a], “O God of my father Abraham and God of my father Isaac, O Yahweh, who said to me, ‘Return to your land and to your kindred[b], and I will do you good,’”
translation:
  language: ja
  text: そこでヤコブは言った。「私の父アブラハムの神、私の父イサクの神、ヤハウェよ。あなたは私に、『あなたの地と生まれ故郷[a]に帰れ。わたしはあなたに幸いを与える[b]』と言われました。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「生まれ故郷」は、「親族（のもと）」とも訳せる。
    reason: מוֹלֶדֶת は出生地・故郷を指すことも、出自に結びつく親族集団を指すこともある。この文脈では帰還先の地理的意味を本文に採った。
  - marker: b
    text: 直訳に近くは「あなたに対して良くする」。「あなたを恵む」「あなたを良く扱う」とも訳せる。
    reason: יטב の使役形と עִם による表現は、恩恵を与えること、また好意的に取り扱うことを表す。
lexical_decisions:
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: そこでヤコブは言った
  rationale: 接続形は物語を先へ進める。日本語では「そこで」により、直前の危機を受けてヤコブが祈り始める流れを自然に示した。
- source_word: אֱלֹהֵי אָבִי אַבְרָהָם וֵאלֹהֵי אָבִי יִצְחָק
  choice: 私の父アブラハムの神、私の父イサクの神
  rationale: 二つの連語を対応させ、祈りにおける直接の呼びかけとして簡潔に訳した。
- source_word: יְהוָה
  choice: ヤハウェ
  rationale: 称号に置き換えず、本文に記された神の固有名を日本語で音写した。
- source_word: הָאֹמֵר אֵלַי
  choice: あなたは私に……と言われました
  rationale: 冠詞付き分詞の描写的な働きを、祈りの相手への自然な敬語表現で示した。
- source_word: שׁוּב לְאַרְצְךָ
  choice: あなたの地……へ帰れ
  rationale: שׁוּב の帰還命令と אֶרֶץ の地理的意味を保った。
- source_word: וּלְמוֹלַדְתְּךָ
  choice: あなたの親族のもとへ
  rationale: מוֹלֶדֶת は出自に結びつく親族集団または故郷を表し得る。本文では家族的な帰属を自然に表す「親族のもと」とし、別の可能性を注記した。
- source_word: וְאֵיטִיבָה עִמָּךְ
  choice: わたしはあなたに幸いを与える
  rationale: יטב の使役形と עִם の組み合わせが表す好意的な取り扱い・恩恵を、現代日本語で自然かつ格調を保って表現した。
theological_decisions:
- issue: 神名 יְהוָה の訳し方
  choice: ヤハウェ
  alternative: 主、エホバ
  rationale: 原文が称号ではなく四文字神名を明記しているため、固有名として音写した。
- issue: וְאֵיטִיבָה עִמָּךְ が約束する恩恵の表現
  choice: あなたに幸いを与える
  alternative: あなたを恵む／あなたを良く扱う
  rationale: 約束の内容を特定の物質的・霊的祝福に限定せず、広い恩恵を表す原文の余地を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、族長の祈りにふさわしい丁寧さと格調を保った。ヤコブの地の文には常体、神への直接の言葉には敬語を用い、引用された神の発言は常体とした。
