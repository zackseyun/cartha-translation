  text: וְ/אָֽמַרְתָּ֙ לְ/עַבְדְּ/ךָ֣ לְ/יַעֲקֹ֔ב מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽ/אדֹנִ֖/י לְ/עֵשָׂ֑ו וְ/הִנֵּ֥ה גַם ה֖וּא אַחֲרֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/019.yaml
  text: Then you shall say[a], ‘Your servant Jacob's gift is sent to my lord, to Esau; and look[b], he also is behind us.’
translation:
  language: ja
  text: そして、こう言いなさい。「これは、あなたのしもべヤコブから、わが主エサウに送られた贈り物[a]です。ご覧ください、彼もまた私たちの後ろにいます[b]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贈り物」と訳した語は、「贈答品」または「貢ぎ物」とも訳せる。ここでは、エサウとの和解を図って送られた品を指す。
    reason: lexical_alternative
  - marker: b
    text: または「彼も私たちの後から来ています」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָֽמַרְתָּ
  choice: そのとき、あなたはこう言いなさい
  rationale: 接続詞ワウを文脈上の順序として自然に表し、完了形が一連の指示の中で持つ命令的な力を「言いなさい」で明示した。
- source_word: לְעַבְדְּךָ לְיַעֲקֹב
  choice: あなた様の僕ヤコブのもの
  rationale: エサウに対するヤコブのへりくだった自己呼称を保ちつつ、直前に進んでいる家畜の群れを受ける省略表現として自然な日本語にした。
- source_word: מִנְחָה
  choice: 贈り物
  rationale: ここでは祭儀的な供え物ではなく、エサウとの和解を図って送る贈答品を指すため、現代日本語で明瞭な「贈り物」とした。
- source_word: שְׁלוּחָה
  choice: お送りした
  rationale: 受動分詞が表す「送られた」という状態を、敬意を含む発話に合う自然な日本語で表した。
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: わが主エサウ様に
  rationale: 「わが主」と「エサウ」が同格であることを保ちながら、日本語として自然な敬称を添え、ヤコブの恭順的な態度を示した。
- source_word: וְהִנֵּה
  choice: そして、ご覧ください
  rationale: 後続内容へ注意を促す談話標識の働きを、古風すぎない丁重な表現で再現した。
- source_word: גַם הוּא
  choice: ヤコブ自身も
  rationale: 代名詞の指示対象を日本語で明確にし、贈り物だけでなくヤコブ本人も後に続くという添加と強調を「自身も」で表した。
- source_word: אַחֲרֵינוּ
  choice: 私たちの後ろにおります
  rationale: 位置を直接示す原文の表現を保った。「後から来ています」という移動を明示する理解も可能なため脚注に示した。
