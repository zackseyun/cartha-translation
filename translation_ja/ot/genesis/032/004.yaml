source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח יַעֲקֹ֤ב מַלְאָכִים֙ לְ/פָנָ֔י/ו אֶל עֵשָׂ֖ו אָחִ֑י/ו אַ֥רְצָ/ה שֵׂעִ֖יר שְׂדֵ֥ה אֱדֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/004.yaml
  text: Jacob sent messengers ahead of him to Esau his brother[a], to the land of Seir, the country of Edom.
translation:
  language: ja
  text: ヤコブは、自分より先に使者たちを兄のエサウのもとへ、すなわちセイルの地、エドムの野[a]へ遣わした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エドムの地方」または「エドムの領域」とも訳せる。ヘブライ語は直訳すると「エドムの野」で、ここでは地域を表す呼称と考えられる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 遣わした
  rationale: 物語を進める過去の動作を表す。「送った」も可能だが、人を任務のために送り出す文脈では「遣わした」が自然で品位もある。
- source_word: מַלְאָכִים
  choice: 使者たち
  rationale: 語自体には「御使いたち」の意味もあるが、ここではヤコブがエサウのもとへ送った人間の使者を指す。複数形も明示した。
- source_word: לְפָנָיו
  choice: 自分より先に
  rationale: 直訳的には「彼の前に」だが、この文脈ではヤコブに先行させたことを意味するため、現代日本語で明確に表した。
- source_word: אֶל עֵשָׂו אָחִיו
  choice: 兄のエサウのもとへ
  rationale: 送り先がエサウ本人であることと、ヤコブとの兄弟関係を自然な日本語で示す。創世記の文脈上、エサウはヤコブの兄である。
- source_word: אַרְצָה שֵׂעִיר
  choice: セイルの地…へ
  rationale: אַרְצָה の方向を表す語尾を「へ」で示し、「地」という名詞も省略せず保持した。
- source_word: שְׂדֵה אֱדֹם
  choice: エドムの野
  rationale: ヘブライ語の具体的な表現を本文に保持した。ここで「野」は個々の畑というより、エドムの地方・領域を指す地域的呼称と考えられるため、脚注で説明する。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、聖書物語にふさわしい簡潔で品位ある文体とした。「すなわち」によって「セイルの地」と「エドムの野」が同じ目的地を説明する並置関係にあることを示した。
