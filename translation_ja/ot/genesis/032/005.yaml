base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/005.yaml
  text: 'And he commanded them[a], saying[c][b], “Thus you shall say to my lord Esau: ‘Thus says your servant Jacob: I have sojourned with Laban and have stayed until now.’”'
translation:
  language: ja
  text: 彼は彼らに命じた。「私の主人エサウに、こう言いなさい。『あなたのしもべ[b]ヤコブは、こう申しております。私はラバンのもとで寄留し、今までそこにとどまってきました。[a]』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「寄留し」は、よそ者としてラバンのもとに住んだ、という意味にも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「あなたのしもべ」はエサウに対するへりくだった自己呼称であり、必ずしも文字どおり奴隷であったことを意味しない。
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: 彼は彼らに命じた
  rationale: צוהの指示・命令としての力を保ちつつ、現代日本語として自然にした。目的語אֹתָםも明示した。
- source_word: כֹּה תֹאמְרוּן
  choice: こう言いなさい
  rationale: 伝えるべき文言を導入する使者定型句。直訳的な「このように言え」より自然で、命令の力も保つ。
- source_word: לַאדֹנִי לְעֵשָׂו
  choice: 私の主人エサウに
  rationale: אדניはここでは神称号ではなく、エサウに対する敬意を示す社会的呼称。「主人」でその上下関係を表した。
- source_word: כֹּה אָמַר
  choice: こう申しております
  rationale: 使者定型句を、ヤコブのへりくだった発言に合う丁寧な現代日本語で表現した。完了形を日本語で不自然な過去に固定せず、伝言として現在有効な発言を示した。
- source_word: עַבְדְּךָ
  choice: あなたのしもべ
  rationale: 字義的隷属を断定せず、エサウに対する外交的・敬譲的な自己呼称を保持した。聖書文体で定着した「しもべ」を用いた。
- source_word: גַּרְתִּי
  choice: 寄留し
  rationale: גורが含みうる、よそ者・一時的居住者として暮らす含意を簡潔に保った。
- source_word: וָאֵחַר עַד עָתָּה
  choice: 今までそこにとどまっておりました
  rationale: אחרを単なる「遅れる」ではなく、現在まで滞在が続いた意味に取り、文脈上補われる場所を「そこに」で自然に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で品位ある現代標準語。使者の伝言構造は引用符と句点で整理し、過度に古風な「かく申す」等は避けた。「しもべ」「寄留」は文脈上重要な社会的・語彙的含意を保つため採用し、脚注で補足した。
