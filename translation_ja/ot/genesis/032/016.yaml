base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/016.yaml
  text: thirty nursing camels and their young[a], forty cows and ten bulls, twenty female donkeys and ten foals.
translation:
  language: ja
  text: 乳を飲ませている雌ラクダ三十頭とその子[a]、雌牛四十頭と雄牛十頭、雌ろば二十頭と雄ろば十頭[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「その子ら」。動物については「その子」と訳す。
    reason: וּבְנֵיהֶם は字義的には「その子ら」であり、動物の子を指す自然な日本語訳を補足するため。
  - marker: b
    text: 「若いろば」または「ろばの子」とも訳せる。ここでは雌ろばとの対を表すものと見て「雄ろば」とした。
    reason: עַיִר には性別と年齢の双方に関わる語義の幅があるため。
lexical_decisions:
- source_word: גְּמַלִּים מֵינִיקוֹת
  choice: 子に乳を飲ませている雌のらくだ
  rationale: מֵינִיקוֹתは、子に乳を与えている雌を表す分詞。日本語で意味と性別が明確になる自然な表現とした。
- source_word: וּבְנֵיהֶם
  choice: とその子
  rationale: בניםは字義的には「息子たち／子どもたち」だが、動物については「その子」が自然である。
- source_word: פָּרוֹת
  choice: 雌牛
  rationale: 雌の牛を指し、続く雄牛との対照も明確にした。
- source_word: וּפָרִים
  choice: と雄牛
  rationale: 雄の牛を指す語として、雌牛との性別上の対照を保った。
- source_word: אֲתֹנֹת
  choice: 雌ろば
  rationale: 明示された雌性を、簡潔で分かりやすい現代日本語で表した。
- source_word: וַעְיָרִם
  choice: と雄ろば
  rationale: עַיִרは若いろば、特に雄のろばを表し得る。この家畜一覧では雌ろばと対になっているため「雄ろば」を本文に採用し、年齢に関する別解は脚注に残した。
