revisions:
- from: しかし、あなたはこう言われました。「わたしは必ずあなたを恵み[a]、あなたの子孫[b]を海の砂のように多くする。その砂は、あまりにも多くて数えることができない[c]。」
  to: しかし、あなたはこう言われました。「わたしは必ずあなたに良いことをし、あなたの子孫[b]を海の砂のようにする。海の砂は、あまりに多くて数えることができない[c]。」
  rationale: 原文の強調と約束の内容を保ちつつ、「良いことをする」により היטיב עם の広い意味を自然な現代日本語で表した。末尾の関係節が「海の砂」を指すことを明示した。本文の表現が不定詞絶対形の強調をすでに「必ず」で反映しているため、脚注aは不要である。
