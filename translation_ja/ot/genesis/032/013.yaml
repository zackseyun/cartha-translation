  text: וְ/אַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑/ךְ וְ/שַׂמְתִּ֤י אֶֽת זַרְעֲ/ךָ֙ כְּ/ח֣וֹל הַ/יָּ֔ם אֲשֶׁ֥ר לֹא יִסָּפֵ֖ר מֵ/רֹֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/013.yaml
  text: But you said[a], ‘I will surely do you good, and I will make your offspring like the sand of the sea[c][b], which cannot be counted because of its abundance.’
translation:
  language: ja
  text: しかし、あなたはこう言われました。「わたしは必ずあなたに良いことをし、あなたの子孫[b]を海の砂のようにする。海の砂は、あまりに多くて数えることができない[c]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 「子孫」と訳したヘブライ語は集合的な単数形で、子孫全体を指す。別訳「子ら」「末裔」。
    reason: lexical_alternative
  - marker: c
    text: 別訳「数え上げることができない」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה אָמַרְתָּ
  choice: しかし、あなたはこう言われました
  rationale: 接続詞と独立代名詞による強調を、直前の危機と神の約束との対照として「しかし」で表した。神への祈りとして自然な敬語を用いた。
- source_word: הֵיטֵב אֵיטִיב עִמָּךְ
  choice: わたしは必ずあなたを恵み
  rationale: 不定詞絶対形と定動詞の組み合わせによる強意を「必ず」で示した。היטיב עם は相手に善を行うことを表すため、繁栄などに限定せず「恵む」とした。
- source_word: וְשַׂמְתִּי
  choice: 多くする
  rationale: 直訳的な「置く」ではなく、子孫を海の砂のようにするという文脈上の使役的意味を明確にした。
- source_word: זַרְעֲךָ
  choice: あなたの子孫
  rationale: זֶרַע は集合的単数であり、ここではヤコブから出る後代の人々を指す。現代日本語で自然な「子孫」を採用した。
- source_word: כְּחוֹל הַיָּם
  choice: 海の砂のように
  rationale: 原文の比喩を簡潔かつ自然に保持した。
- source_word: אֲשֶׁר לֹא יִסָּפֵר מֵרֹב
  choice: その砂は、あまりにも多くて数えることができない
  rationale: 関係節の先行詞を日本語で明確にし、מֵרֹב の理由・程度を「あまりにも多くて」と表した。Nifal形は実際上の不可能を表すものとして「数えることができない」とした。
