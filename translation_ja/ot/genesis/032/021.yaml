  to: また、こう言いなさい。『ご覧ください。あなたのしもべヤコブも、私たちの後ろにおります。』ヤコブはこう言ったからである。『先に行く贈り物で彼をなだめよう[a]。その後で彼と顔を合わせよう。ひょっとすると、彼は私を好意をもって迎えてくれるかもしれない[b]。』
  rationale: 原文がこの節ではエサウを代名詞で指すことを本文と脚注で保持するため、「兄」を「彼」に改めた。「ひょっとすると…かもしれない」に整えて、不確実性を損なわずに重複感を除いた。脚注aでは説明上エサウの名を用い、読者が指示対象を理解できるようにした。
