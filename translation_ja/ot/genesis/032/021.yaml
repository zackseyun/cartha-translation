id: GEN.32.21
reference: Genesis 32:21
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּ/ךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑י/נוּ כִּֽי אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗י/ו בַּ/מִּנְחָה֙ הַ/הֹלֶ֣כֶת לְ/פָנָ֔/י וְ/אַחֲרֵי כֵן֙ אֶרְאֶ֣ה פָנָ֔י/ו אוּלַ֖י יִשָּׂ֥א פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/021.yaml
  text: And you shall also say[a], ‘Look, your servant Jacob is behind us,’ for he said, ‘I will appease him with the gift that is going ahead of me, and afterward I will see his face[b]; perhaps he will accept me.’
translation:
  language: ja
  text: また、こう言いなさい。『ご覧ください。あなたのしもべヤコブも、私たちの後ろにおります。』ヤコブはこう言ったからである。『先に行く贈り物で彼をなだめよう[a]。その後で彼と顔を合わせよう。ひょっとすると、彼は私を好意をもって迎えてくれるかもしれない[b]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼の顔をなだめよう」。ここで用いられる動詞は「贖う」という意味にも関係するが、この箇所では贈り物によってエサウの怒りを和らげることを指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳では「彼は私の顔を上げてくれるかもしれない」。これは、相手を受け入れたり、好意を示したりすることを表すヘブライ語の慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם גַּם
  choice: そして、こうも言いなさい
  rationale: 複数の使者への命令を、前節から続く指示として自然な現代日本語で表した。「も」によって גַּם を保持した。
- source_word: הִנֵּה
  choice: ご覧ください
  rationale: 注意を促す談話標識。エサウへの丁重な伝言に合わせ、古風すぎない敬語表現とした。
- source_word: עַבְדְּךָ
  choice: あなたのしもべ
  rationale: ヤコブがエサウに対して示すへりくだりを保つ。「奴隷」よりも、この外交的な伝言の社会的・語用論的文脈に適する。
- source_word: אַחֲרֵינוּ
  choice: 私たちの後ろにおります
  rationale: 使者たちに続く位置を明確に示し、伝言の丁重な口調に合わせた。
- source_word: אֲכַפְּרָה פָנָיו
  choice: 兄をなだめよう
  rationale: כפר はここでは祭儀的贖罪ではなく、贈り物によってエサウの怒りを和らげる対人的用法である。直訳の「兄の顔をなだめる」は日本語では不自然なため、意味を本文に出し、字義は脚注に示した。
- source_word: מִנְחָה
  choice: 贈り物
  rationale: この物語ではエサウを懐柔するため先に送った品々を指す。「供え物」では祭儀的な含意が強すぎる。
- source_word: הַהֹלֶכֶת לְפָנָי
  choice: 先に行く
  rationale: 贈り物がヤコブに先行して進んでいるという分詞の継続的な動きを、簡潔で自然に表した。
- source_word: אֶרְאֶה פָנָיו
  choice: 兄と顔を合わせよう
  rationale: 「彼の顔を見る」というヘブライ語表現を、日本語として自然な「顔を合わせる」で表しつつ、節全体の「顔」のモチーフを一部保持した。
- source_word: אוּלַי
  choice: もしかすると…かもしれない
  rationale: ヤコブの期待と不確かさを明確に表す。日本語では多少の重なりがあるが、思案する語調として自然である。
- source_word: יִשָּׂא פָנָי
  choice: 私を好意をもって迎えてくれる
  rationale: 字義は「私の顔を上げる」だが、ここでは相手を受け入れ、好意を示す慣用句。本文では意味を明瞭にし、字義を脚注に残した。
theological_decisions:
- issue: 対人的文脈における כפר の訳し方
  choice: 兄をなだめよう
  alternative: 兄の前で贖いをしよう／兄の顔をなだめよう
  rationale: 目的語がエサウの「顔」で、手段が贈り物であるため、ここでは人間関係上の宥和を意味する。祭儀的な贖罪概念を本文へ持ち込まず、語根が贖いの語彙とも結びつくことは脚注で示した。
- issue: יִשָּׂא פָנָי の慣用的意味
  choice: 私を好意をもって迎えてくれる
  alternative: 私の顔を上げてくれる
  rationale: ヤコブが望んでいるのはエサウによる好意的な受け入れである。日本語で不透明な直訳は避ける一方、「顔」という原文の表現を脚注で開示した。
translation_notes:
  register: 明瞭な現代標準語を用い、使者がエサウに伝える部分では「ご覧ください」「おります」によって丁重さを示した。地の文とヤコブの内心は簡潔で品位ある語調とした。原文に反復される「顔」の語は「顔を合わせる」で一部保持し、不自然になる二つの慣用句は意味を本文、字義を脚注に示した。
