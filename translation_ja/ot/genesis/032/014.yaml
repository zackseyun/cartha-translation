  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּ֥לֶן שָׁ֖ם בַּ/לַּ֣יְלָה הַ/ה֑וּא וַ/יִּקַּ֞ח מִן הַ/בָּ֧א בְ/יָד֛/וֹ מִנְחָ֖ה לְ/עֵשָׂ֥ו אָחִֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/014.yaml
  text: 'So he spent that night there[a], and he took from what came to his hand a gift for Esau his brother:'
translation:
  language: ja
  text: こうしてヤコブはその夜、そこに泊まった。そして、手元にあるものの中から[a]、兄エサウへの贈り物を取った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「彼の手に入って来たものの中から」。すなわち、「彼が携えていたものの中から」または「手近にあったものの中から」。
    reason: ヘブライ語の慣用的表現について、字義的な形と意味上の別訳を示すため。
lexical_decisions:
- source_word: וַיָּלֶן
  choice: 泊まった
  rationale: לוןの「夜を過ごす、宿泊する」という意味を、簡潔で自然な現代日本語で表す。
- source_word: שָׁם בַּלַּיְלָה הַהוּא
  choice: その夜、そこに
  rationale: 場所を示すשָׁםと時を示すבַּלַּיְלָה הַהוּאをともに明示し、日本語として自然な語順に整えた。
- source_word: וַיִּקַּח
  choice: 取った
  rationale: לקחの基本義を保持する。「選んだ」と解釈的に限定せず、原文の広がりを残す。
- source_word: מִן הַבָּא בְיָדוֹ
  choice: 手元にあるものの中から
  rationale: 字義的には「彼の手に入って来たものから」だが、ここではヤコブが利用できる所有物・携行物を指す慣用表現として、明瞭な日本語にした。字義的な形は脚注に残す。
- source_word: מִנְחָה
  choice: 贈り物
  rationale: この対人的文脈では祭儀的な「供え物」よりも、相手に贈る品を意味する。「貢ぎ物」は政治的従属を強く含み得るため避けた。
- source_word: לְעֵשָׂו אָחִיו
  choice: 兄エサウへの
  rationale: לְを受取人として表し、אָחִיוは日本語の文脈に即して「兄」とした。エサウがヤコブの兄である関係を自然に明示する。
theological_decisions: []
