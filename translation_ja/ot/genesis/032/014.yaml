  source_fidelity: ヘブライ語の叙述順と主要要素を適切に再現している。「その夜、そこに泊まった」はוַיָּלֶן、שָׁם、בַּלַּיְלָה הַהוּאを過不足なく表す。「手元にあるものの中から」はמִן הַבָּא בְיָדוֹの慣用的意味に忠実であり、脚注が字義的表現と自然な理解を補っている。מִנְחָהを「贈り物」とすること、また受取人と兄弟関係を「兄エサウへの」とすることも文脈に合う。
