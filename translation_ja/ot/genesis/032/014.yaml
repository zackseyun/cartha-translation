  terminology: 「ヤコブ」「エサウ」は標準的な表記である。「贈り物」は対人的なמִנְחָהに適切で、祭儀的意味や政治的従属を不必要に持ち込まない。「兄」は原文のאָחִיוおよび物語上の関係に適合する。
