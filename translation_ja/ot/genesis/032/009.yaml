  text: He said[a], “If Esau comes to the one camp and strikes it, then the camp that remains will escape.”
translation:
  language: ja
  text: 彼は言った。「もしエサウが一方の宿営に来て、それを攻撃すれば、残った宿営は逃れられる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「逃れのためのものとなる」。すなわち、生き延びて滅びを免れるという意味。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 彼は言った
  rationale: 物語を進める接続形であり、現代日本語では文脈上の接続を明示せず、過去形で自然に表した。
- source_word: אִם
  choice: もし……ても
  rationale: ヤコブの見込みに含まれる条件性を保った。後続する結果との関係が日本語で明瞭になる形にした。
- source_word: יָבוֹא
  choice: やって来て
  rationale: 基本義である「来る」を保ち、敵対行為そのものは後続の動詞で表した。
- source_word: אֶל הַמַּחֲנֶה הָאַחַת
  choice: 一方の宿営に
  rationale: 直前に二つに分けられた宿営のうち一方を指す定表現として訳した。מַחֲנֶה はここでは人々を含む宿営集団を表す。
- source_word: וְהִכָּהוּ
  choice: そこを攻撃しても
  rationale: נכה の「打つ」という敵対的行為を、宿営を対象とする自然な現代日本語で表した。接尾辞は集合体としての宿営を受けると判断した。
- source_word: הַמַּחֲנֶה הַנִּשְׁאָר
  choice: 残った宿営
  rationale: נשאר の「残る、残される」という意味を簡潔に保った。
- source_word: לִפְלֵיטָה
  choice: 逃れられる
  rationale: 名詞 פְלֵיטָה が示す逃避・生存という結果を、日本語では動詞表現にして自然に伝えた。原文の名詞的な言い回しは脚注で示した。
