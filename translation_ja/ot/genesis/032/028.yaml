  yaml_path: translation/ot/genesis/032/028.yaml
  text: And he said to him, “What is your name?” And he said, “Jacob.”
translation:
  language: ja
  text: その人は彼に言った。「あなたの名は何か。」彼は言った。「ヤコブだ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める接続形のאָמַרを、現代日本語で自然かつ簡潔に表した。二度の反復も原文に沿って保持した。
- source_word: אֵלָיו
  choice: 彼に
  rationale: 前置詞אֶלと三人称男性単数接尾辞が示す、男性の相手への方向をそのまま表した。
- source_word: מַה שְּׁמֶךָ
  choice: あなたの名は何というのか
  rationale: ヘブライ語では直訳的に「あなたの名は何か」だが、日本語の問いとして明瞭で自然な形にした。「名」は場面の重みを保ちつつ現代語でも理解できる。
- source_word: יַעֲקֹב
  choice: ヤコブ
  rationale: 人名を翻訳せず、日本語で定着した音写形を用いた。
- source_word: וַיֹּאמֶר יַעֲקֹב
  choice: 彼は言った。「ヤコブです。」
  rationale: 文脈上は返答だが、原語の通常動詞אָמַרを「言った」として保ち、応答という解釈を動詞に加えなかった。日本語として必要な丁寧さを「です」で補った。
