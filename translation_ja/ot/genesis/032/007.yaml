  text: וַ/יָּשֻׁ֨בוּ֙ הַ/מַּלְאָכִ֔ים אֶֽל יַעֲקֹ֖ב לֵ/אמֹ֑ר בָּ֤אנוּ אֶל אָחִ֨י/ךָ֙ אֶל עֵשָׂ֔ו וְ/גַם֙ הֹלֵ֣ךְ לִ/קְרָֽאתְ/ךָ֔ וְ/אַרְבַּע מֵא֥וֹת אִ֖ישׁ עִמּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/007.yaml
  text: The messengers returned to Jacob[a], saying, “We came to your brother, to Esau, and he is also coming to meet you, and four hundred men are with him.”
translation:
  language: ja
  text: 使者たちはヤコブのもとに帰って来て[a]、言った。「私たちはあなたの兄エサウのもとへ行って来ました。彼もあなたに会うために向かっており、四百人の男たちが彼と一緒にいます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ここで「使者」と訳したヘブライ語は「御使い」とも訳せる。しかし、この箇所ではヤコブがエサウのもとへ遣わした人々を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻבוּ
  choice: 帰って来て
  rationale: שוב の完了した過去の動作を表す物語形。派遣された者たちがヤコブのもとへ戻る文脈に自然に合う。
- source_word: הַמַּלְאָכִים
  choice: 使者たち
  rationale: מַלְאָךְ は「使者」と「御使い」の両義を持つが、直前にヤコブがエサウへ遣わした人々を指すため、本文では「使者たち」とした。語の別義は脚注に残した。
- source_word: לֵאמֹר
  choice: 言った
  rationale: 直接話法を導く定型表現。日本語では連用形に続けて「言った」とするのが自然で明瞭。
- source_word: בָּאנוּ
  choice: 行きました
  rationale: בוא は基本的に「来る／入る」だが、使者が帰還後に目的地への到達を報告する日本語としては「エサウのもとへ行きました」が自然。到達の意味は保持している。
- source_word: אֶל אָחִיךָ אֶל עֵשָׂו
  choice: あなたの兄エサウのもとへ
  rationale: 二つ目の אֶל 以下が「あなたの兄」をエサウと同定する同格表現。日本語では重複を避けつつ関係性と固有名をともに明示した。
- source_word: וְגַם הֹלֵךְ לִקְרָאתְךָ
  choice: すると彼もあなたを迎えに向かっており
  rationale: גַּם の添加的な力を「も」で表し、分詞 הֹלֵךְ の進行中の動きを「向かっており」とした。לִקְרָאתְךָ は敵対性を語義に持ち込まず、中立的な「迎えに」と訳した。
- source_word: וְאַרְבַּע מֵאוֹת אִישׁ עִמּוֹ
  choice: 四百人の男たちが彼と一緒にいます
  rationale: אִישׁ の男性複数集団としての意味を「男たち」で明示し、עִמּוֹ の同行関係を自然な日本語の節として表した。
