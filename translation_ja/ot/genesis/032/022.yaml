  yaml_path: translation/ot/genesis/032/022.yaml
  text: So the gift passed on ahead of him[a], but he himself stayed that night in the camp.
translation:
  language: ja
  text: こうして、贈り物[a]はヤコブより先に進んで行ったが、彼自身はその夜、宿営地に泊まった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「贈り物」に当たるヘブライ語は、文脈によって「貢ぎ物」や「供え物」とも訳せる。ここでは、ヤコブがエサウに先に送った贈り物を指す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲבֹר
  choice: 進んで行った
  rationale: 動詞 עבר の継続的物語形。ここでは境界や川を「渡った」と明示するより、贈り物の一行がヤコブに先立って進んだことを表す。
- source_word: הַמִּנְחָה
  choice: 贈り物
  rationale: מִנְחָה は贈り物、貢ぎ物、供え物を意味し得るが、ここではヤコブがエサウに送った品々を指すため、現代日本語で自然な「贈り物」とした。
- source_word: עַל־פָּנָיו
  choice: ヤコブより先に
  rationale: 直訳的には「彼の前を」だが、この文脈ではヤコブに先行することを意味する。指示対象を明確にするため「ヤコブ」とした。
- source_word: וְהוּא
  choice: が、彼自身は
  rationale: 明示された代名詞には、先に進んだ贈り物と、残ったヤコブとの対比があるため、それを自然な日本語で示した。
- source_word: לָן
  choice: 泊まった
  rationale: לון/לין は夜を過ごす、宿泊する意。「その夜」とともに用いられているため「泊まった」が簡潔で自然。
- source_word: בַּלַּיְלָה הַהוּא
  choice: その夜
  rationale: 時間を示す句を現代日本語の自然な表現にした。
- source_word: בַּמַּחֲנֶה
  choice: 宿営地に
  rationale: מַחֲנֶה は陣営または宿営地を指す。ここでは一時的に滞在している場所なので「宿営地」が明確。
theological_decisions: []
translation_notes:
  register: 明快で格調を保った現代標準日本語。「彼」だけでは指示対象が曖昧になり得るため、前半では「ヤコブ」と明示し、後半の強調代名詞は「彼自身」とした。
