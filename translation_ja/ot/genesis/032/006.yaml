revisions:
- from: 私には、牛、ろば、羊や山羊の群れ、男奴隷、女奴隷がいます。そこで、ご主人様にお知らせし、ご好意を得たいと願って、人を遣わしました。
  to: 私には、牛、ろば、羊や山羊の群れ、男の奴隷と女の奴隷〔a〕がいます。私の主人であるあなたにお知らせし、あなたのご好意を得るために、使者を遣わしました。
  rationale: 原文にない「そこで」と「願って」を除き、使者派遣の二つの目的を「お知らせし、…得るために」として保持しました。אַדֹנִיの敬意と自己卑下は「私の主人であるあなた」で明示し、二人称への移行も原文どおり保っています。奴隷という訳語は財産目録の文脈を反映しますが、語の幅は脚注で示しました。
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-19T04:50:39Z'
review_pass:
  verdict: revise
  source_fidelity: 所有を表す冒頭の表現、家畜・小家畜・男女の隷属的家内労働者の列挙、および使者を送った目的は概ね原文に沿っています。ただし、「そこで」は原文にない因果関係を加え、「ご好意を得たいと願って」は原文の目的表現をやや主観的に強めています。また、エサウへのאַדֹנִיは実際の所有関係を断定する語というより、ヤコブのへりくだった呼称として明示するのが適切です。
  naturalness: 「私には…がいます」は自然ですが、列挙される家畜と人を一文で受けるには「持っています」のほうが簡潔です。「男奴隷、女奴隷」は意味は明瞭でも列挙としてやや硬いため、「男の奴隷と女の奴隷」とします。目的節は「…ために」として原文の構文を自然に保てます。
  terminology: שׁוֹרは限定しすぎず「牛」、חֲמוֹרは「ろば」、צֹאןは羊・山羊を含み得る集合名詞として「羊や山羊の群れ」とするのは妥当です。עֶבֶד／שִׁפְחָהは家産目録という文脈上「奴隷」と訳し、脚注で「僕／女の僕」という語彙的代案を示します。אַדֹנִיは神への称号ではなく、エサウに対する服従的・儀礼的呼称として「私の主人であるあなた」と訳します。
  issues:
  - severity: medium
    issue: 「そこで」が因果関係を付加している
    rationale: וָאֶשְׁלְחָהは単純に「そして／私は送った」と行為を述べる形であり、所有物があることを理由に使者を送ったという因果を明示してはいません。
  - severity: medium
    issue: 「ご好意を得たいと願って」が目的表現を主観的に拡張している
    rationale: לִמְצֹאは「好意を得るために」という目的を示します。「願って」は原文にない内面的願望を加えます。
  - severity: low
    issue: 「ご主人様」が現代日本語では家庭内の呼称としても響く
    rationale: אַדֹנִיはこの場面でエサウへのへりくだった呼称です。「私の主人であるあなた」とすれば、実際の主人・使用人関係を説明的に断定せず、発話者ヤコブの自己卑下を明確にできます。
  revised_text: 私には、牛、ろば、羊や山羊の群れ、男の奴隷と女の奴隷〔a〕がいます。私の主人であるあなたにお知らせし、あなたのご好意を得るために、使者を遣わしました。
  revised_footnotes:
