  text: וַֽ/יְהִי לִ/י֙ שׁ֣וֹר וַ/חֲמ֔וֹר צֹ֖אן וְ/עֶ֣בֶד וְ/שִׁפְחָ֑ה וָֽ/אֶשְׁלְחָ/ה֙ לְ/הַגִּ֣יד לַֽ/אדֹנִ֔/י לִ/מְצֹא חֵ֖ן בְּ/עֵינֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/006.yaml
  text: I have oxen and donkeys[a], flocks, male servants and female servants, and I have sent to tell my lord, so that I may find favor in your eyes.
translation:
  language: ja
  text: 私には、牛、ろば、羊や山羊の群れ、男の奴隷と女の奴隷〔a〕がいます。私の主人であるあなたにお知らせし、あなたのご好意を得るために、使者を遣わしました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי לִי
  choice: 私には…がいます
  rationale: היה＋ל の所有を表す慣用表現。生き物や人を列挙する日本語として自然な「います」を用いた。
- source_word: שׁוֹר וַחֲמוֹר
  choice: 牛、ろば
  rationale: 単数形だが、ここでは所有物の種類を集合的に列挙しているため、日本語では数を明示せず自然に訳した。שׁוֹר は広く牛を指し得るので「雄牛」などに限定しない。
- source_word: צֹאן
  choice: 羊や山羊の群れ
  rationale: 羊と山羊を中心とする小家畜の集合名詞であることを、現代日本語で明確にした。
- source_word: עֶבֶד וְשִׁפְחָה
  choice: 男奴隷、女奴隷
  rationale: 財産・家産の一覧という文脈では隷属的身分が示唆されるため「奴隷」とし、原文の男女の区別も保持した。
- source_word: וָאֶשְׁלְחָה לְהַגִּיד
  choice: お知らせし…人を遣わしました
  rationale: 「遣わした」の目的が知らせることであるという構文を、日本語で自然な使者派遣の表現にした。目的語の「人」は文脈から補った。
- source_word: לַאדֹנִי
  choice: ご主人様に
  rationale: エサウへのへりくだった呼称であり、神を指す称号ではない。伝言内の敬意を自然な日本語で表した。
- source_word: לִמְצֹא חֵן בְּעֵינֶיךָ
  choice: ご好意を得たいと願って
  rationale: 字義は「あなたの目に恵みを見いだす」。日本語では「好意を得る」が同じ対人的意味を明瞭に伝える。
theological_decisions:
- issue: עֶבֶד／שִׁפְחָה の社会的身分
  choice: 男奴隷、女奴隷
  alternative: 男の僕、女の僕／男女の使用人
  rationale: 家畜と並ぶ家産一覧の中に置かれており、単なる雇用人より隷属的な家内労働者を指す可能性が高い。制度を現代的に正当化せず、原語の厳しい社会的含意を見えなくしない訳を選んだ。
- issue: לַאדֹנִי の指示対象
  choice: ご主人様
  alternative: わが主
  rationale: ここではヤコブが兄エサウに対して用いる服従的・儀礼的敬称であり、神称として読まれないようにした。
translation_notes:
  register: 現代標準日本語。ヤコブがエサウに送った伝言として、へりくだった丁寧さを保ちつつ、古風すぎる「わが主」「御目に恵みを得る」は避けた。原文の簡潔な財産一覧と目的表現を、明瞭で dignified な語調に整えた。
