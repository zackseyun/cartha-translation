base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/023.yaml
  text: That night he arose and took his two wives[a], his two female servants, and his eleven children, and crossed the ford of the Jabbok.
translation:
  language: ja
  text: その夜、ヤコブは起き上がり、二人の妻と二人の女の召使い[a]、それに十一人の子どもを連れて、ヤボク川の渡り場を渡った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「二人の女奴隷」とも訳せる。ヘブライ語は、家の中で従属的な身分にあった女性を指し、奴隷身分を含むことがある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: 起き上がり
  rationale: קוםのQal連続形は「起きる、立ち上がる」を表す。夜中に行動を開始する文脈に自然な現代日本語とした。
- source_word: בַּלַּיְלָה הוּא
  choice: その夜
  rationale: 直訳的には「その夜に、彼は」で、代名詞に強調がある。「その夜」は時間設定を簡潔かつ自然に伝える。
- source_word: וַיִּקַּח
  choice: 連れて
  rationale: לקחの基本義は「取る」だが、ここでは家族を伴って移動することを意味するため、日本語では「連れて」が自然である。
- source_word: שְׁתֵּי נָשָׁיו
  choice: 二人の妻
  rationale: נָשִׁיםはこの文脈ではヤコブの妻たちを指す。
- source_word: שְׁתֵּי שִׁפְחֹתָיו
  choice: 二人の女の召使い[a]
  rationale: שִׁפְחָהは従属的な家内身分にある女性を指し、奴隷身分を含み得る。「女の召使い」は読みやすい本文表現とし、「女奴隷」の可能性を脚注に残した。
- source_word: אַחַד עָשָׂר יְלָדָיו
  choice: 十一人の子ども
  rationale: יְלָדִיםは「子ども、子孫」を意味し、「息子たち」と限定していないため、語の範囲を保った。
- source_word: וַיַּעֲבֹר
  choice: 渡った
  rationale: עברは移動の文脈で川や境界を「渡る」ことを表す。
- source_word: אֵת מַעֲבַר יַבֹּק
  choice: ヤボク川の渡り場
  rationale: מַעֲבָרは渡河地点、すなわち「渡り場」を指す。固有名יַבֹּקには日本語で地形を明確にする「川」を添えた。
