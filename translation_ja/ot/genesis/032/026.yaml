base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/026.yaml
  text: When he saw that he could not prevail against him[a], he touched the socket of his thigh[c][b], and the socket of Jacob’s thigh was dislocated as he wrestled with him.
translation:
  language: ja
  text: 彼は、相手に勝てないと見て[a]、その腿の付け根の関節[b]に触れた[c]。すると、彼が相手と組み合っていたとき、ヤコブの腿の付け根の関節が外れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「相手を制することができないと見て」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では直訳的に「腿のくぼみ（関節のくぼみ）」。伝統的には「腿のくぼみ」とも訳される。
    reason: lexical_alternative
  - marker: c
    text: 原文の代名詞が誰を指すかには曖昧さがあり、この節ではヤコブの相手の正体を明記していない。
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: 彼は、……と見て
  rationale: 物語を進める接続形を、日本語で自然な時の関係として表した。主語は原文どおり代名詞のままとした。
- source_word: לֹא יָכֹל לוֹ
  choice: 相手に勝てない
  rationale: יכל＋לが表す、相手に対して優勢になれないことを、格闘の文脈に即した平明な日本語で表した。絶対的な能力不足とまでは断定しない。
- source_word: וַיִּגַּע
  choice: 触れた
  rationale: נגעの通常の意味を保持した。結果は激しいが、原文自体は「打った」より軽い接触の語を用いている。
- source_word: בְּכַף יְרֵכוֹ
  choice: その腿の付け根の関節
  rationale: כף＋ירךが指す、腿と腰の接合部のくぼんだ関節を、現代の一般読者に分かる表現で示した。「その」により所有者を明示しすぎないようにした。
- source_word: וַתֵּקַע
  choice: 外れた
  rationale: この文脈で、関節が本来の位置から外れた結果を簡潔に表す。
- source_word: כַּף יֶרֶךְ יַעֲקֹב
  choice: ヤコブの腿の付け根の関節
  rationale: 前半との語彙的一貫性を保ちつつ、原文がここでヤコブの名を明記する点を保持した。
- source_word: בְּהֵאָבְקוֹ עִמּוֹ
  choice: 彼が相手と組み合っていたとき
  rationale: 前置詞付き不定詞が示す同時進行を自然な日本語にし、代名詞の指示対象は原文同様に確定しすぎない形にした。
theological_decisions:
- issue: 格闘場面の代名詞「彼」「その人」の指示対象
  choice: 相手の正体を本文で明記せず、「彼」「相手」「その」を用いて原文の曖昧さを残す。
  alternative: 触れた主体を人、御使い、または神と明示し、触れられた者をヤコブと明記する。
  rationale: この節のヘブライ語は相手の正体を言い直さず代名詞を続けており、その人物の意味は周辺文脈の中で徐々に示される。本文だけで神学的同定を先取りしない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「股関節」という解剖学用語だけに限定せず、「腿の付け根の関節」として原語の身体表現を残した。代名詞の反復は日本語として読める範囲に整えつつ、原文の人物同定の曖昧さを維持した。
