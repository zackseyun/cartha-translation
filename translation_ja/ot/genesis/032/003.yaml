  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ כַּ/אֲשֶׁ֣ר רָאָ֔/ם מַחֲנֵ֥ה אֱלֹהִ֖ים זֶ֑ה וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא מַֽחֲנָֽיִם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/genesis/032/003.yaml
  text: When Jacob saw them[a], he said, “This is God’s camp.” So he called the name of that place Mahanaim.
translation:
  language: ja
  text: ヤコブは彼らを見ると、「これは神の陣営だ」と言った。それで、その場所をマハナイム[a]と名づけた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「マハナイム」は「二つの陣営」または「二重の陣営」を思わせる名で、ヤコブの「これは神の陣営だ」という言葉と響き合っている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: אמרの標準的な物語上の用法。目的語や様態は明示されていないため、「心の中で言った」「叫んだ」などの補足は避けた。
- source_word: כַּאֲשֶׁר רָאָם
  choice: 彼らを見ると
  rationale: כַּאֲשֶׁרの時を示す働きを自然な日本語で表し、רָאָםの三人称男性複数接尾辞を「彼ら」と明示した。直前の文脈では神の使いたちを指す。
- source_word: מַחֲנֵה אֱלֹהִים
  choice: 神の陣営
  rationale: 構文どおり「神の陣営」とした。「陣営」は人々の集団とその宿営地の双方を含み得る語で、地名マハナイムとの語の響きも保てる。
- source_word: זֶה
  choice: これは
  rationale: 指示詞が述語的宣言の主題となっているため、日本語では「これは」とし、文末の「だ」で判断を表した。
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: その場所を…と名づけた
  rationale: ヘブライ語では直訳的に「その場所の名を呼んだ」だが、現代日本語で同じ意味を明瞭かつ自然に伝える「名づけた」を採用した。
- source_word: מַחֲנָיִם
  choice: マハナイム
  rationale: 地名として音写した。語形が「二つの陣営」ないし「二重の陣営」を連想させる点は脚注で示した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、神との出会いを語る場面にふさわしい簡潔で格調ある調子にした。「キャンプ」ではなく「陣営」を選び、地名との語のつながりと集団を含み得る意味を保った。
