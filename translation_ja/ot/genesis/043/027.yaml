  yaml_path: translation/ot/genesis/043/027.yaml
  text: He asked them about their well-being and said[a], “Is your elderly father, whom you spoke of[b], well? Is he still alive?”
translation:
  language: ja
  text: 彼は彼らの安否を尋ねて言った。「あなたがたが話していた年老いたお父上は、お元気ですか。今も生きておられますか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: 彼は彼らの安否を尋ねて
  rationale: 「シャロームについて尋ねる」という慣用句を、健康だけに限定せず全般的な無事・暮らし向きを含む自然な現代日本語「安否を尋ねる」で表した。
- source_word: הֲשָׁלוֹם
  choice: お元気ですか
  rationale: ここでは父の全般的な状態が良いかを問う。日本語の対人表現として自然な「お元気ですか」を用い、文脈上の敬意も示した。
- source_word: אֲבִיכֶם הַזָּקֵן
  choice: 年老いた父上
  rationale: הַזָּקֵן の年齢への明示的な言及を保ちつつ、「父上」によってヨセフが相手の父を指す際の自然な敬意を表した。
- source_word: אֲשֶׁר אֲמַרְתֶּם
  choice: あなたがたが話していた
  rationale: 以前彼らが父について述べたことを指す関係節を、明瞭で自然な日本語にした。
- source_word: הַעוֹדֶנּוּ חָי
  choice: 今も生きておられますか
  rationale: עוֹד の継続性を「今も」、חָי を「生きて」で直接表し、父への敬意を補助動詞「おられる」で示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語。会話として自然でありながら品位を保った。「安否」はやや改まった語だが、このヘブライ語慣用句の広い意味を簡潔に伝える。原文に実質的な異読や神学的曖昧さはなく、注記は不要と判断した。
