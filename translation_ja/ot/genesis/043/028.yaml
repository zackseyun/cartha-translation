  yaml_path: translation/ot/genesis/043/028.yaml
  text: They said[a], “Your servant our father is well; he is still alive.” Then they bowed down and prostrated themselves.
translation:
  language: ja
  text: 彼らは言った。「あなたのしもべである私たちの父は無事で[a]、今も生きています。」そして彼らは身をかがめ、ひれ伏した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「平安」。ここでは健康や無事を表す慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: 元気で
  rationale: 直訳は「平安」だが、ここでは父の安否を尋ねられたことへの返答として、健康・無事を表す慣用的な用法である。現代日本語では「元気で」が自然にその意味を伝える。
- source_word: לְעַבְדְּךָ לְאָבִינוּ
  choice: あなたのしもべである私たちの父
  rationale: 「あなたのしもべ」と「私たちの父」は同一人物を指す同格表現である。「しもべ」は宮廷的なへりくだりを保ちつつ、奴隷身分を不必要に断定しない。
- source_word: עוֹדֶנּוּ חָי
  choice: 今も生きています
  rationale: עוֹדの継続の意味を「今も」で明示し、父がなお存命であることを自然な現代日本語で表した。
- source_word: וַיִּקְּדוּ
  choice: 身をかがめ
  rationale: 身体を低くして礼をする動作を表す。続くひれ伏す動作との区別も保てる。
- source_word: וישתחו
  choice: ひれ伏した
  rationale: 上位者の前で身を伏せる身体的な敬礼を表す。文脈上、神への礼拝とは限定せず、ヨセフへの服従と敬意のしぐさとして訳した。
theological_decisions:
- issue: וישתחו が表す敬礼の性質
  choice: ひれ伏した
  alternative: 礼拝した
  rationale: この場面はヨセフという上位者への社会的敬意を示すものであり、神への礼拝を意味すると断定する根拠はない。身体動作を直接表す訳にして、不要な神学的含意を持ち込まない。
translation_notes:
  register: 明瞭で自然な現代標準日本語を用いながら、兄弟たちのへりくだった敬語と、二つの連続する礼の動作を保った。「しもべ」は聖書文体として理解可能で、宮廷的な謙譲表現にも適する。
