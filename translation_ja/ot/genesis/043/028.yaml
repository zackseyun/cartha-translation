  terminology: 「しもべ」は古風すぎず聖書の宮廷的・謙譲的な自己呼称に適する。「ひれ伏した」は宗教的礼拝と限定せず、上位者への身体的な敬礼を表せる。脚注の「平安」は字義的代替を適切に示す。
