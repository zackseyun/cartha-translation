  source_fidelity: 全体としてヘブライ語の意味を正確に反映している。「あなたのしもべである私たちの父」は、兄弟たちが父をヨセフの「しもべ」とへりくだって呼ぶ同格表現をよく表す。「無事で、今も生きています」は、שָׁלוֹם の安否・健康の意と、עוֹדֶנּוּ חָי の継続した生存を区別して表現する。文頭の וַיֹּאמְרוּ は基本的に「言った」であり、「答えた」は直前の文脈からは理解できるものの、本文では補わないほうが原文により近い。
