base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/032.yaml
  text: So they served him by himself[a], and them by themselves, and the Egyptians who ate with him by themselves, because the Egyptians could not eat bread with the Hebrews, for that is an abomination to the Egyptians.
translation:
  language: ja
  text: 人々は、ヨセフには彼だけに、兄弟たちには彼らだけに、またヨセフと食事をするエジプト人には彼らだけに、それぞれ食事を出した。エジプト人はヘブライ人と一緒に食事をする[a]ことができなかったからである。それはエジプト人にとって忌み嫌うべきことであった。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳、「ヘブライ人とパンを食べる」。食事を共にすることを表す。
    reason: 原文の「パンを食べる」という表現が、共食を指す慣用的な言い方であることを示す。
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: 食事を出した
  rationale: 基本義は「置く、並べる」だが、食卓の文脈では、各 समूहに料理を配膳したことを自然な日本語で表す。
- source_word: לְבַדּוֹ / לְבַדָּם
  choice: 彼だけで／兄弟たちだけで／エジプト人だけで
  rationale: 三者が分けられていたことを示す反復構造を保ち、社会的な隔たりを明確にした。
- source_word: הָאֹכְלִים אִתּוֹ
  choice: 彼と食事をする
  rationale: 分詞を日本語として自然な連体修飾にし、継続的な食卓への同席を表した。
- source_word: לֹא יוּכְלוּן
  choice: することができなかった
  rationale: 身体的能力に限らず、慣習上許容されないという社会的不可能性も含み得る原文の表現を保った。
- source_word: לֶאֱכֹל אֶת הָעִבְרִים לֶחֶם
  choice: ヘブライ人と一緒に食事をする
  rationale: 直訳は「ヘブライ人とパンを食べる」だが、ここで「パンを食べる」は食事を共にすることを指す慣用表現なので、明瞭な現代日本語にした。
- source_word: תוֹעֵבָה
  choice: 忌み嫌うべきこと
  rationale: 文化的・宗教的に強く嫌悪される事柄を表す語の強さを保ちつつ、現代の一般読者に理解しやすい表現とした。
- source_word: הַמִּצְרִים / הָעִבְרִים
  choice: エジプト人／ヘブライ人
  rationale: 原文が対照する二つの民族集団を明示した。
theological_decisions:
- issue: エジプト人がヘブライ人との食事を避けた理由の性質
  choice: 「忌み嫌うべきこと」とし、文化的・宗教的タブーのどちらかに限定しない
  alternative: 「宗教上汚れたこと」または「社会的に許されないこと」
  rationale: 原文は理由を詳述せず תוֹעֵבָה とだけ述べるため、特定の制度や教理を補わず、その強い嫌悪と禁忌性を保った。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の三重の「別に」という構造を日本語で保持した。「彼」はヨセフ、「兄弟たち」はヨセフの兄弟たちを指すが、本文の指示関係を過度に説明的にせず文脈に委ねた。
