  source_fidelity: 原文は、ヨセフ、兄弟たち、ヨセフと食事をするエジプト人という三つの集団に、それぞれ別々に食事を出したことを反復して述べる。草案はこの区分と、エジプト人がヘブライ人と食事を共にできなかった理由をおおむね忠実に伝えているが、「彼には彼だけで」等は日本語として意味関係が不明瞭である。
