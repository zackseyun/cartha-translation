  yaml_path: translation/ot/genesis/043/012.yaml
  text: Take double money in your hand[a], and take back in your hand the money that was returned in the mouth of your sacks[b]; perhaps it was a mistake.
translation:
  language: ja
  text: 二倍の銀を手に持って行きなさい。また、袋の口に戻されていた銀も手に持って持ち帰りなさい。それは何かの間違いだったのだろう。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֶסֶף מִשְׁנֶה
  choice: 銀を二倍
  rationale: כֶסֶףは当時の支払い手段である銀を指し、מִשְׁנֶהは量が二倍であることを表す。文脈を過度に限定せず、簡潔に数量的な意味を保った。
- source_word: קְחוּ בְיֶדְכֶם
  choice: 手に持って行きなさい
  rationale: 「手に」という原文の具体性を保ちつつ、日本語で携行を自然に表すため「持って行く」とした。
- source_word: הַכֶּסֶף הַמּוּשָׁב
  choice: 戻されていた銀
  rationale: שובのホファル分詞は受動を表す。誰が戻したかを明示せず、袋の中に銀が戻されていたという状態を自然に示した。
- source_word: בְּפִי אַמְתְּחֹתֵיכֶם
  choice: 袋の口に
  rationale: פִּיの「口」という比喩は日本語でも容器の開口部を指して自然に通じるため、そのまま保持した。
- source_word: תָּשִׁיבוּ בְיֶדְכֶם
  choice: 手に持って返しなさい
  rationale: 使役形の「持ち帰る・返す」を「返しなさい」で表し、前半と同じ「手に」という反復も保持した。
- source_word: אוּלַי מִשְׁגֶּה הוּא
  choice: もしかすると、それは何かの間違いだったのかもしれない
  rationale: אוּלַיの不確かさとמִשְׁגֶּהの過失・誤りの意味を、現代日本語で明瞭かつ非断定的に表した。
