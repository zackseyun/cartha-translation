base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/021.yaml
  text: And when we came to the lodging place and opened our sacks[a], behold[b], each man's silver was in the mouth of his sack—our silver in its full weight—and we brought it back in our hand.
translation:
  language: ja
  text: 私たちが宿泊所に着いて、自分たちの袋を開けてみると、なんと、それぞれの銀が自分の袋の口にあり、しかも私たちの銀は重さどおり、そっくりそのまま入っていました。それで、私たちはそれを手にして持って戻って来ました。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמָּלוֹן
  choice: 宿泊所
  rationale: 旅の途中で夜を過ごす場所を指し、現代的な商業施設としての「宿屋」と限定しないため。
- source_word: אַמְתְּחֹתֵינוּ / אַמְתַּחְתּוֹ
  choice: 袋／自分の袋
  rationale: 穀物や旅荷を入れる袋を指す文脈に合い、自然な日本語であるため。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 予想外の発見を示す提示・驚きの力を、現代日本語で自然に表すため。
- source_word: כֶסֶף אִישׁ
  choice: それぞれの銀
  rationale: אִישׁの分配的意味を保ち、כֶסֶףを一般化して「金」とせず銀として訳した。
- source_word: בְּפִי אַמְתַּחְתּוֹ
  choice: 自分の袋の口に
  rationale: 容器の開口部を「口」と呼ぶヘブライ語の比喩は日本語でも自然に理解できるため、原文の表現を保った。
- source_word: בְּמִשְׁקָלוֹ
  choice: 重さどおり、そっくりそのまま
  rationale: 量られた正確な全量が戻されていた意味を、明確で自然な日本語にした。
- source_word: וַנָּשֶׁב אֹתוֹ בְּיָדֵנוּ
  choice: それを手にして持ち帰って来ました
  rationale: בידנוの身体的イメージを残しつつ、話し手が銀を現に持参して戻ったという文脈を表した。
theological_decisions: []
