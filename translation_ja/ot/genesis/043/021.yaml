  to: 私たちが宿泊所に着いて、自分たちの袋を開けてみると、なんと、それぞれの銀が自分の袋の口にあり、しかも私たちの銀は重さどおり、そっくりそのまま入っていました。それで、私たちはそれを手にして持って戻って来ました。
