  text: Then he washed his face[a], came out, controlled himself, and said, “Serve the food.”
translation:
  language: ja
  text: それからヨセフは顔を洗い、出て来て、自分を抑え、「食事を出しなさい」と言った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְחַץ פָּנָיו
  choice: 顔を洗って
  rationale: רחץは「洗う」、פניםは一人の顔を指す慣用的な複数形。泣いた後に顔を洗ったという文脈を自然な現代日本語で表した。
- source_word: וַיֵּצֵא
  choice: 出て来ると
  rationale: יצאは「出る」の意。直前に入った部屋から食事の場へ戻る動きを、物語の視点に沿って「出て来る」とした。
- source_word: וַיִּתְאַפַּק
  choice: 気持ちを抑え
  rationale: אפקのヒトパエル形は、激しい感情を自制することを表す。直前の涙を踏まえ、自然で明瞭な「気持ちを抑え」とした。
- source_word: שִׂימוּ
  choice: 出しなさい
  rationale: 字義的には「置きなさい」だが、食事の場面では料理を供する命令。「食事を出す」という日本語の慣用表現が文脈に合う。
- source_word: לָחֶם
  choice: 食事
  rationale: 字義的には「パン」だが、食物や食事全体を指す換喩としても用いられる。この宴席の文脈では「食事」が自然で、原語の意図を過不足なく伝える。
theological_decisions: []
translation_notes:
  register: 明瞭で自然な現代標準日本語を用い、物語文としての品位を保った。接続する動作の流れを「洗って出て来ると、気持ちを抑え」で簡潔に示した。固有名詞「ヨセフ」は、この一節だけでも主語を明確にするため補った。
