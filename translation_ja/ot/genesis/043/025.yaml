  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יָּכִ֨ינוּ֙ אֶת הַ/מִּנְחָ֔ה עַד בּ֥וֹא יוֹסֵ֖ף בַּֽ/צָּהֳרָ֑יִם כִּ֣י שָֽׁמְע֔וּ כִּי שָׁ֖ם יֹ֥אכְלוּ לָֽחֶם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/025.yaml
  text: And they prepared the gift until Joseph came at noon[a], because they had heard that they would eat bread there.
translation:
  language: ja
  text: 彼らは、ヨセフが正午に来るまでに、贈り物を用意しておいた。そこで食事をする[a]と聞いていたからである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「そこでパンを食べる」。ヘブライ語では、食事をすることを表す慣用表現。
    reason: 原文の具体的表現と訳文の慣用的な意味との対応を示すため。
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: 用意しておいた
  rationale: ヒフィル形の「整える、用意する」を表す。ヨセフの到着に先立って準備を済ませたという文脈を、自然な日本語で示す。
- source_word: הַמִּנְחָה
  choice: 贈り物
  rationale: この物語では祭儀的な供え物ではなく、兄弟たちがヨセフに持参した贈答品を指すため。
- source_word: עַד בּוֹא יוֹסֵף
  choice: ヨセフが…来るまでに
  rationale: עַדと不定詞連語がヨセフの到着を時間上の期限として示す。準備完了の意味に即して「までに」とした。
- source_word: בַּצָּהֳרָיִם
  choice: 昼ごろに
  rationale: 正午・昼時を指す語。食事の時間でもある文脈に自然な「昼ごろ」を採用した。
- source_word: כִּי שָׁמְעוּ
  choice: 聞いていたからである
  rationale: 最初のכִּיを理由として訳し、準備に先立って得ていた情報であることを「聞いていた」で示す。
- source_word: כִּי שָׁם
  choice: そこで…と
  rationale: 二つ目のכִּיは聞いた内容を導き、שָׁםはその場所を示す。日本語として自然な引用内容に組み替えた。
- source_word: יֹאכְלוּ לָחֶם
  choice: 食事を共にする
  rationale: 直訳は「パンを食べる」だが、ここでは食事をすることを表すヘブライ語の慣用句であり、複数人が同席する文脈も明確に伝える。
- source_word: יוֹסֵף
  choice: ヨセフ
  rationale: 日本語聖書で広く定着している人名表記を用いた。
theological_decisions: []
translation_notes:
  register: 明快で現代的ながら、物語本文にふさわしい落ち着いた文体。「食事を共にする」によって原文の慣用的意味を本文で伝え、直訳は脚注に残した。
