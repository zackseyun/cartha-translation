base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/029.yaml
  text: He lifted up his eyes and saw Benjamin[a], his brother, his mother's son, and said, “Is this your youngest brother, of whom you spoke to me?” Then he said, “May God be gracious to you, my son.”
translation:
  language: ja
  text: 彼は目を上げ、同じ母から生まれた自分の弟ベニヤミン[a]を見て、言った。「この人が、あなたがたが私に話した末の弟か。」さらに言った。「わが子よ、神があなたに恵みを与えてくださるように。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「自分の兄弟、母の子ベニヤミン」。ベニヤミンがヨセフと同じ母から生まれた兄弟であることが強調されている。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: 彼は目を上げ
  rationale: ヘブライ語の視覚的な慣用表現を、日本語でも自然な「目を上げる」で保った。
- source_word: וַיַּרְא
  choice: 見て
  rationale: ראהの基本義を素直に訳し、直前の「目を上げ」と自然につないだ。
- source_word: אֶת בִּנְיָמִין אָחִיו בֶּן אִמּוֹ
  choice: 自分と同じ母の子である弟ベニヤミン
  rationale: ベニヤミンがヨセフと母を同じくする兄弟であるという原文の強調を保ちつつ、現代日本語として明瞭にした。文脈上ベニヤミンはヨセフの弟なので「弟」とした。
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: あなたがたの末の弟
  rationale: הַקָּטֹןはこの兄弟たちの中で最年少であることを指すため、「末の弟」とした。
- source_word: אֲשֶׁר אֲמַרְתֶּם אֵלָי
  choice: あなたがたが私に話していた
  rationale: 字義は「あなたがたが私に言った」だが、ベニヤミンについて以前話したことを指すため、自然な日本語にした。
- source_word: אֱלֹהִים יָחְנְךָ
  choice: 神があなたに恵みを施してくださるように
  rationale: חנןの「恵み深くある、好意を示す」という意味と、未完了形の祝福・願望の力を明示した。
- source_word: בְּנִי
  choice: わが子よ
  rationale: 男性単数への親愛を込めた呼びかけを、威厳を保つ自然な日本語で表した。
theological_decisions:
- issue: אֱלֹהִיםを用いた祝福の願望表現
  choice: 神があなたに恵みを施してくださるように
  alternative: 神があなたを恵んでくださるように
  rationale: 神名を補わず原文どおり「神」とし、יָחְנְךָの願望的な力を「ように」で表した。「恵みを施す」は語根חנןの内容を明瞭に保つ。
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、物語の格調と祝福の厳粛さを保った。「わが子よ」は親愛と年長者からの呼びかけを表す。
