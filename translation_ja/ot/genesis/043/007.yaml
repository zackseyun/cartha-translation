base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/007.yaml
  text: They said, “The man questioned us closely about us and about our family, saying, ‘Is your father still alive? Do you have another brother?’ So we told him according to these words. How could we possibly know that he would say, ‘Bring your brother down’?”
translation:
  language: ja
  text: 彼らは言った。「あの人は、私たちのことや家族のことを詳しく尋ね、『あなたがたの父親はまだ生きているのか。ほかに兄弟がいるのか』と言いました。それで私たちは、尋ねられたことに答えたのです。まさかあの人が、『あなたがたの兄弟を連れて下って来なさい』と言うとは、どうして分かったでしょうか。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁאוֹל שָׁאַל
  choice: 詳しく尋ね
  rationale: 同じ語根を重ねる不定詞絶対形の強意を、自然な現代日本語で表した。
- source_word: לְמוֹלַדְתֵּנוּ
  choice: 家族のこと
  rationale: ここでは出自や親族関係を指し、続く父と兄弟についての問いに対応する。
- source_word: עַל־פִּי הַדְּבָרִים הָאֵלֶּה
  choice: 尋ねられたことに答えた
  rationale: 字義的には「これらの言葉に従って」だが、文脈上、質問された内容に応じて情報を告げたという意味を明確かつ自然に表した。
- source_word: הֲיָדוֹעַ נֵדַע
  choice: どうして分かったでしょうか
  rationale: 不定詞絶対形と未完了形による強い修辞疑問を日本語で再現し、事前には知りようがなかったとの抗弁を示した。
- source_word: הוֹרִידוּ
  choice: 連れて下って来い
  rationale: カナンからエジプトへ行くことを「下る」と表す原文の地理的語法を保持した。
