  source_fidelity: 全体として、שָׁאוֹל שָׁאַל の強意、父と兄弟についての質問、それに続く強い修辞疑問を適切に伝えている。אָח は単数であり、訳文でも「兄弟」として無理なく保たれている。「下って来い」は原文の הוֹרִידוּ（下らせる／連れて下る）の地理的含意を反映するが、日本語の命令形を複数の聞き手に整える必要がある。
  naturalness: 「連れて下って来い」は、複数の兄弟たちに向けた発話としては単数的でやや不自然である。「連れて下って来なさい」とすると、明快な現代標準日本語になる。また、この箇所の הָאִישׁ は字義的には「その人／あの人」であり、「あの方」は原文以上の敬称を加えるため避けるのがよい。
  terminology: 「詳しく尋ねた」「家族のこと」「尋ねられたことに答えた」は文脈に即している。「あの人」として原文の定冠詞付き「その人」の指示性を保ち、過度な社会的敬意を加えない。
