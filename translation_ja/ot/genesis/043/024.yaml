base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/024.yaml
  text: The man brought the men into Joseph’s house and gave them water[a], and they washed their feet[c][b]; then he gave fodder to their donkeys.
translation:
  language: ja
  text: その人は人々をヨセフの家の中に連れて行き、水を与えた。彼らは足を洗った。その人は彼らのろばに飼い葉を与えた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: 連れて入り
  rationale: בואのヒフィル形が表す使役的な移動と、בֵּיתָהの方向性を自然な日本語で示す。
- source_word: הָאִישׁ
  choice: その人
  rationale: 文脈上はヨセフの家の管理を任された者だが、原文は役職を明示せず、単に「その人」としているため。
- source_word: הָאֲנָשִׁים
  choice: 一同
  rationale: 原文は一般的な複数名詞「人々」。日本語で「その人は人々を」とすると不自然で紛らわしいため、指示対象を特定しすぎない自然な集合表現を用いた。
- source_word: בֵּיתָה יוֹסֵף
  choice: ヨセフの家の中へ
  rationale: בֵּיתָהの方向を示す語尾により、単に家までではなく家の中への移動が表されている。
- source_word: וַיִּתֶּן מַיִם
  choice: 水を与えた
  rationale: 原文どおり「水を与えた」とし、水の用途は続く足洗いから分かるようにした。
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: 彼らは足を洗った
  rationale: 動詞は能動態の複数形であり、彼ら自身が足を洗ったことを直接表す。
- source_word: מִסְפּוֹא
  choice: 飼い葉
  rationale: 家畜の餌を指す語として、聖書時代の場面にも合い、現代日本語でも理解できる表現。
- source_word: לַחֲמֹרֵיהֶם
  choice: 彼らのろばにも
  rationale: לְが示す受益・間接目的語を表し、人々への水に加えて、ろばにも餌が与えられた流れを「にも」で自然に示した。
theological_decisions: []
translation_notes:
  register: 明快で落ち着いた現代標準日本語。原文の「その人」と「人々」という一般的な呼称を、文脈上の役職や兄弟関係に置き換えず保持した。日本語の可読性のため、連続するワウ継続法を三文に分けた。
