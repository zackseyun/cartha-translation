  to: ヨセフは、彼らと一緒にいるベニヤミンを見ると、家を取り仕切る者[a]に言った。「この人たちを家の中へ連れて行き、動物をほふり[b]、食事の支度をしなさい。この人たちは正午[c]に私と一緒に食事をするからだ。」
  rationale: 原文が特定していない動物の種別と頭数を訳文から除き、食事のための屠りを命じる原文の意味を保った。脚注bは同根語反復を日本語として理解しやすく説明するよう改めた。その他の訳文と脚注アンカーは維持できる。
