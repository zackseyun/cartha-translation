  text: וַ/יַּ֨רְא יוֹסֵ֣ף אִתָּ/ם֮ אֶת בִּנְיָמִין֒ וַ/יֹּ֨אמֶר֙ לַֽ/אֲשֶׁ֣ר עַל בֵּית֔/וֹ הָבֵ֥א אֶת הָ/אֲנָשִׁ֖ים הַ/בָּ֑יְתָ/ה וּ/טְבֹ֤חַ טֶ֨בַח֙ וְ/הָכֵ֔ן כִּ֥י אִתִּ֛/י יֹאכְל֥וּ הָ/אֲנָשִׁ֖ים בַּֽ/צָּהֳרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/016.yaml
  text: When Joseph saw Benjamin with them[a], he said to the one over his household, “Bring the men into the house, slaughter an animal, and prepare it[c][b], because the men will eat with me at noon.”
translation:
  language: ja
  text: ヨセフは、彼らと一緒にいるベニヤミンを見ると、家を取り仕切る者[a]に言った。「この人たちを家の中へ連れて行き、動物をほふり[b]、食事の支度をしなさい。この人たちは正午[c]に私と一緒に食事をするからだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「家の管理人」とも訳せる。ヘブライ語では直訳すると「彼の家の上にいる者」。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「ほふることをほふれ」のように同根語を重ねた表現。食事のために動物をほふることを意味する慣用表現。
    reason: cultural_note
  - marker: c
    text: 「真昼」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא ... אֶת־בִּנְיָמִין
  choice: ベニヤミンを見ると
  rationale: ראהの基本義である視覚的認知を自然な日本語で表し、続く発言との時間的つながりも示した。
- source_word: אִתָּם
  choice: 彼らと一緒にいる
  rationale: 接尾辞付き前置詞が、ベニヤミンが兄弟たちに同行していたことを示すため。
- source_word: לַאֲשֶׁר עַל־בֵּיתוֹ
  choice: 家を取り仕切る者
  rationale: 直訳的な「彼の家の上にいる者」が表す、家政を管理する人物という役割を、過度に特定せず自然に表した。
- source_word: הָבֵא אֶת־הָאֲנָשִׁים הַבָּיְתָה
  choice: この人たちを家の中へ連れて行き
  rationale: 方向を表す語尾־הを「家の中へ」で明示した。האנשיםは文脈上目の前の一行を指すため、「この人たち」とした。
- source_word: וּטְבֹחַ טֶבַח
  choice: 家畜を一頭ほふって
  rationale: 同根の動詞と名詞を重ねたヘブライ語の慣用表現を、食用の動物を屠る命令として自然に訳した。動物の種類は原文が特定していないため、「家畜」にとどめた。
- source_word: וְהָכֵן
  choice: 食事の支度をしなさい
  rationale: כוןのヒフィル命令形「用意する」を、直前の屠殺命令と食事の文脈に即して明確にした。
- source_word: כִּי אִתִּי יֹאכְלוּ הָאֲנָשִׁים
  choice: この人たちは…私と一緒に食事をするからだ
  rationale: כיの理由を示す働きを保ち、יאכלוを文脈に適した「食事をする」とした。
- source_word: בַּצָּהֳרָיִם
  choice: 正午に
  rationale: צהריםが示す昼の中ほどの時刻を、明瞭で簡潔な現代日本語にした。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に分かりやすい、落ち着いた物語文とした。「ほふる」は食用の動物を屠殺する場面にふさわしい簡潔で品位ある語として用い、難読性を抑えるため平仮名表記にした。
