base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/030.yaml
  text: Then Joseph hurried[a], because his compassion for his brother was stirred, and he sought a place to weep[b]. He entered the room and wept there.
translation:
  language: ja
  text: ヨセフは急いだ。弟への思いが胸に強く込み上げたので、泣く場所を探した[a]。彼は部屋に入り、そこで泣いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳に近くは、「弟への彼の憐れみが激しく動かされたので、泣こうとした」。ヘブライ語は、深い情愛・憐れみが内から強く動かされることを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: 急いだ
  rationale: 動詞の基本義「急ぐ」をそのまま訳す。原文に明示されない移動方向は補わない。
- source_word: נִכְמְרוּ רַחֲמָיו אֶל־אָחִיו
  choice: 弟への情が激しく込み上げ
  rationale: רַחֲמִים が表す深い愛情・憐れみと、נכמר の内から激しく動かされる感覚を、自然な現代日本語で表した。文脈上、אָחִיו は弟ベニヤミンを指すが、固有名は補わない。
- source_word: וַיְבַקֵּשׁ לִבְכּוֹת
  choice: 泣かずにはいられなかった
  rationale: 直訳は「泣こうとした／泣くことを求めた」だが、感情が高まり、泣くために私室へ向かう文脈を自然に表す。ただし原文の語形に近い訳を脚注に示す。
- source_word: הַחַדְרָה
  choice: 奥の部屋に
  rationale: 方向を示す語尾を「に」で表し、חֶדֶר の私的な内部空間という文脈的含意を「奥の部屋」とした。
- source_word: וַיֵּבְךְּ שָׁמָּה
  choice: そこで泣いた
  rationale: 動詞と場所を示す שָׁמָּה を簡潔かつ明示的に訳した。
