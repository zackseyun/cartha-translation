lexical_decisions:
- source_word: וְהָרָעָב
  choice: さて、…飢饉が
  rationale: רָעָבは文脈上「飢饉」。接頭辞וְは物語の継続を示すため、現代日本語の自然な場面再開表現「さて」で表した。
- source_word: כָּבֵד
  choice: ひどかった
  rationale: 字義は「重い」だが、飢饉の深刻さを表す慣用的用法なので、自然で明瞭な「ひどかった」とした。
- source_word: בָּאָרֶץ
  choice: その地では
  rationale: אֶרֶץはここでは全世界でなく、物語上の地域を指す。「その地」は文脈とのつながりを保ち、「では」は飢饉の状態がその地域に及んでいたことを自然に示す。
