  yaml_path: translation/ot/genesis/043/013.yaml
  text: Take your brother also[a], and arise[b], return to the man.
translation:
  language: ja
  text: あなたがたの兄弟も連れて[a]、立って、その人のところへ戻りなさい[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「あなたがたの兄弟」。文脈上はベニヤミンを指す。
    reason: cross_reference
  - marker: b
    text: 直訳に近くは「立ちなさい。戻りなさい」。
    reason: source_structure
lexical_decisions:
- source_word: וְ/אֶת אֲחִי/כֶם
  choice: あなたがたの弟も
  rationale: 接続詞の付加的な働きを「も」で表し、אֲחִיכֶם は文脈上ベニヤミンを指すが、本文では原文どおり固有名を補わない。「兄弟」よりも、この場面での関係を自然に示す「弟」とした。
- source_word: קָחוּ
  choice: 連れて
  rationale: לקח の複数命令形。人を同行させる文脈なので、現代日本語では「取って」ではなく「連れて」が自然であり、目的地側の視点を強める「連れて来て」は避けた。
- source_word: וְ/ק֖וּמוּ
  choice: 立って
  rationale: קום の複数命令形を保ちつつ、日本語の連続動作として自然な形にした。「さあ」は勢いを表せるが、語義そのものを弱めるため採らない。
- source_word: שׁ֥וּבוּ
  choice: 戻りなさい
  rationale: שוב の移動を表す複数命令形を「戻る」と訳した。直前の קוּמוּ と結んで命令の流れを保つ。
- source_word: אֶל הָ/אִישׁ
  choice: その人のところへ
  rationale: 定冠詞付きの「人」は既出のエジプトの役人を指す。日本語では「その人」が自然で、אֶל の到達方向は「ところへ」で明瞭にした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準語を用い、家長から息子たちへの命令として簡潔で dignified な調子を保った。原文の二つの命令「立つ」「戻る」は、日本語では「立って、…戻りなさい」と連続させた。
