base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/005.yaml
  text: But if you will not send him[a], we will not go down, because the man said to us, ‘You will not see my face unless your brother is with you.’
translation:
  language: ja
  text: しかし、もし弟を送ってくださらないなら、私たちは下って行きません。あの人が私たちに、『弟が一緒でなければ、私に会うことはできない[a]』と言ったからです。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では直訳すると「あなたがたは私の顔を見ることはない」。ここでは、ある人の前に出る、またはその人に面会することを意味する慣用表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: しかし、もし
  rationale: 直前の条件提示と対照をなす接続なので、単なる「もし」ではなく逆接を明示した。
- source_word: אֵינְךָ מְשַׁלֵּחַ
  choice: 弟を行かせてくださらないなら
  rationale: 否定辞と分詞は、父が弟を行かせないという意向・判断を表す。目的語は原文では省略されているが、文脈上ベニヤミンを指すため「弟」を補った。父に対する息子の発言として、現代日本語で自然な敬意も表した。
- source_word: לֹא נֵרֵד
  choice: 私たちは下って行きません
  rationale: כנעןからエジプトへ向かう際の定型的な方向表現「下る」を保った。
- source_word: כִּי
  choice: からです
  rationale: 行かない理由を示す因果関係を、自然な現代日本語で明確にした。
- source_word: הָאִישׁ
  choice: あの人
  rationale: 兄弟たちはまだヨセフの正体を知らないため、固有名や役職を補わず、話者の認識に沿った表現とした。
- source_word: לֹא תִרְאוּ פָנַי
  choice: 私に会うことはできない
  rationale: 字義は「私の顔を見ることはない」だが、ここでは支配者の前に出て面会することを表す慣用句である。本文は日本語として自然な意味を示し、字義は脚注に残した。
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: 弟が一緒でなければ
  rationale: בִּלְתִּי が示す必要条件を「なければ」で表し、動詞のない述語を自然な日本語の条件節にした。
