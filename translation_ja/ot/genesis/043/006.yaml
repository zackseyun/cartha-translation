  text: וַ/יֹּ֨אמֶר֙ יִשְׂרָאֵ֔ל לָ/מָ֥ה הֲרֵעֹתֶ֖ם לִ֑/י לְ/הַגִּ֣יד לָ/אִ֔ישׁ הַ/ע֥וֹד לָ/כֶ֖ם אָֽח׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/006.yaml
  text: Then Israel said[a], “Why did you do me harm by telling the man that you still had another brother?”
translation:
  language: ja
  text: そこでイスラエルは言った。「なぜおまえたちは、まだもう一人兄弟がいるとあの人に話して、私を苦しめたのか」[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: より直訳的には、「なぜおまえたちは、まだもう一人兄弟がいるとあの人に告げて、私に害を及ぼしたのか」。
    reason: ヘブライ語 הֲרֵעֹתֶם לִי の字義に近い別訳を示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: そこで……は言った
  rationale: 物語を先へ進めるワウ継続法の順接を、現代日本語として自然な「そこで」で表した。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 本文が用いる名をそのまま保持し、「ヤコブ」に置き換えなかった。
- source_word: לָמָה
  choice: なぜ
  rationale: 理由を問う直接疑問として、簡明で自然な対応語を選んだ。
- source_word: הֲרֵעֹתֶם לִי
  choice: 私をこんな目に遭わせた
  rationale: רעעのヒフィルが表す「害を及ぼす、悪い結果をもたらす」という使役的意味を、父の苦境への嘆きとして自然な日本語にした。道徳的な悪意までは断定しない。
- source_word: לְהַגִּיד
  choice: 話して
  rationale: 害が生じた手段を示す不定詞の関係を、前後の動作が明確につながる形で表した。
- source_word: לָאִישׁ
  choice: あの人
  rationale: 物語の中ですでに知られているエジプトの役人を指すため、日本語の文脈に自然な既知の指示表現とした。
- source_word: הַעוֹד לָכֶם אָח
  choice: まだ兄弟がいる
  rationale: 直訳的には「あなたがたに、なお兄弟がいるか」。עוֹדの継続・残存の意味を「まだ」で保ち、אָחは年長・年少を本文以上に限定せず「兄弟」とした。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、家長の強い嘆きが伝わる dignified な口調とした。「おまえたち」は父から息子たちへの叱責に合うが、過度に粗暴にはならない表現である。
