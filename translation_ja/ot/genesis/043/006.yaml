  naturalness: 「なぜおまえたちは…私を苦しめたのか」は、父が息子たちを責める文脈にふさわしい、明瞭で現代標準日本語として自然な表現である。「あの人」は既知のエジプトの役人を自然に指示する。
  terminology: 「イスラエル」はヘブライ語本文の人名を保持している。「兄弟」は אָח の年齢・序列を本文以上に限定しない。「苦しめた」は道徳的悪意を断定せず、ヒフィルの『害をもたらす』という文脈上の意味を表す。
