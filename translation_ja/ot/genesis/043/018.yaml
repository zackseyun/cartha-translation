  text: וַ/יִּֽירְא֣וּ הָֽ/אֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַ/יֹּאמְר֗וּ עַל דְּבַ֤ר הַ/כֶּ֨סֶף֙ הַ/שָּׁ֤ב בְּ/אַמְתְּחֹתֵ֨י/נוּ֙ בַּ/תְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְ/הִתְגֹּלֵ֤ל עָלֵ֨י/נוּ֙ וּ/לְ/הִתְנַפֵּ֣ל עָלֵ֔י/נוּ וְ/לָ/קַ֧חַת אֹתָ֛/נוּ לַ/עֲבָדִ֖ים וְ/אֶת חֲמֹרֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/018.yaml
  text: The men were afraid because they had been brought into Joseph’s house[a], and they said, “It is because of the money that was returned in our sacks the first time that we are being brought in, so that he may make a pretext against us and fall upon us and take us as servants, along with our donkeys.”
translation:
  language: ja
  text: 男たちは、ヨセフの家に連れて来られたので恐れ、言った。「前回、私たちの袋に戻されていたあの銀のことで、私たちは連れて来られたのだ。私たちに言いがかりをつけ[a]、私たちに襲いかかり、私たちをろばもろとも奴隷にするためなのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「言いがかりをつけ」と訳したヘブライ語表現は意味の確定が難しく、「私たちを陥れる口実を求めて」とも訳せる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְאוּ הָאֲנָשִׁים
  choice: 男たちは…恐れ
  rationale: 物語を進める ירא の形を、原因節と自然につながる現代日本語で表した。
- source_word: כִּי הוּבְאוּ בֵּית יוֹסֵף
  choice: ヨセフの家に連れて来られたので
  rationale: בוא のホファル形が示す使役受動と、כִּי の理由を明確にした。
- source_word: עַל דְּבַר הַכֶּסֶף הַשָּׁב
  choice: 戻されていたあの銀のことで
  rationale: עַל דְּבַר を原因・契機として訳し、הַשָּׁב は文脈上の結果的な受動を表した。כֶּסֶף はここでは支払った銀を指すため「銀」とした。
- source_word: בְּאַמְתְּחֹתֵינוּ בַּתְּחִלָּה
  choice: 初めの時に私たちの袋に
  rationale: אַמְתַּחַת を旅や穀物運搬用の「袋」とし、בַּתְּחִלָּה は前回の旅を指す表現として、原文に近い「初めの時」とした。
- source_word: לְהִתְגֹּלֵל עָלֵינוּ
  choice: 言いがかりをつけて
  rationale: 字義的には難解な慣用表現で、敵対的な口実を設ける意味を文脈に即して自然に表した。
- source_word: וּלְהִתְנַפֵּל עָלֵינוּ
  choice: 私たちに襲いかかり
  rationale: נפל のヒトパエル形と עַל が示す敵対的な攻撃を、明瞭な日本語で表した。
- source_word: וְלָקַחַת אֹתָנוּ לַעֲבָדִים
  choice: 私たちを…奴隷として捕らえる
  rationale: 単なる奉仕ではなく拘束して奴隷化する恐れを示すため、「奴隷」とした。
- source_word: וְאֶת חֲמֹרֵינוּ
  choice: ろばもろとも
  rationale: 人々だけでなく、ろばも奪われるという並列を簡潔で自然に示した。
