  text: אָֽנֹכִי֙ אֶֽעֶרְבֶ֔/נּוּ מִ/יָּדִ֖/י תְּבַקְשֶׁ֑/נּוּ אִם לֹ֨א הֲבִיאֹתִ֤י/ו אֵלֶ֨י/ךָ֙ וְ/הִצַּגְתִּ֣י/ו לְ/פָנֶ֔י/ךָ וְ/חָטָ֥אתִֽי לְ/ךָ֖ כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/009.yaml
  text: I myself will guarantee him. From my hand you may require him. If I do not bring him to you and set him before you[a], then I will bear the blame to you all my days.
translation:
  language: ja
  text: 私が自らあの子の保証人になります。その子については、私に責任を問うてください。もし私があの子をあなたのもとに連れて来て、あなたの前に差し出さなければ、私は生涯、あなたに対して罪を犯したことになります。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私は生涯、あなたに対して責めを負うことになります」。
    reason: lexical_alternative
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: 私自身が
  rationale: 独立人称代名詞の強調を保ち、ユダが自ら責任を引き受けることを明示する。
- source_word: אֶעֶרְבֶנּוּ
  choice: あの子の保証人になります
  rationale: ערב の、他者のために保証を引き受ける法的・関係的意味を、現代日本語で明瞭に表す。
- source_word: מִיָּדִי תְּבַקְשֶׁנּוּ
  choice: 私の手からあの子を求めてください
  rationale: 「手から」という責任追及の具体的な比喩を残しつつ、בקש の要求・取り立てる含意を表す。
- source_word: הֲבִיאֹתִיו אֵלֶיךָ
  choice: あの子をあなたのもとに連れて来て
  rationale: ヒフィル形の「連れて来る」を訳し、「戻す」は文脈上含意されるものの原文に明示されないため補わない。
- source_word: וְהִצַּגְתִּיו לְפָנֶיךָ
  choice: あなたの前に立たせ
  rationale: יצג の、目の前に置く・立たせるという具体的な提示の場面を自然な日本語で保つ。
- source_word: וְחָטָאתִי לְךָ
  choice: あなたに対して罪を負います
  rationale: חטא の「罪を犯す」という語義と、誓約違反による継続的な責任・咎の双方を保つ表現とする。
- source_word: כָּל הַיָּמִים
  choice: 生涯
  rationale: 直訳的な「すべての日々」が示す一生涯の継続を、簡潔で自然な現代日本語にする。
theological_decisions:
- issue: וְחָטָאתִי לְךָ の対人的な誓約文脈での訳
  choice: あなたに対して罪を負います
  alternative: あなたに対して責めを負います／あなたに罪を犯したことになります
  rationale: 通常の「罪」という語義を本文に残しながら、ここで問題となる誓約違反の咎を「負う」と表現し、法的・関係的な責任も伝える。語義上可能な責任・咎中心の訳は脚注に示す。
translation_notes:
  register: 明瞭で品位ある現代標準語。「あの子」は父ヤコブに対して弟ベニヤミンを指す自然な呼称として用いた。責任の比喩である「私の手から」は、やや荘重だが理解可能なため保持した。
