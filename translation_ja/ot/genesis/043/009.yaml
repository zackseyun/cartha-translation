  terminology: 「保証人」は ערב の保証・身元引受けの意味を適切に表します。「罪を犯したことになります」は חטא の基本義を本文に保ち、脚注で対人的・責任上の含意として「責めを負う」を示すため、神学的語を不必要に弱めません。
