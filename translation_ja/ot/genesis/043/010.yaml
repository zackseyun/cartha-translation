base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/010.yaml
  text: For if we had not delayed[b][a], by now we would have returned twice.
translation:
  language: ja
  text: というのも、私たちが出発を延ばしていなかったなら[a]、今ごろは二度戻って来ていたはずです[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「ぐずぐずしていなかったなら」「ためらっていなかったなら」とも訳せる。ヘブライ語の動詞は、遅れること、長引くこと、ためらうことを表しうる。
    reason: lexical_alternative
  - marker: b
    text: 直訳すると「私たちは今ごろ、これで二回戻って来ていたことになる」。ここでは「二度戻って来ていた」という意味の表現。
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי לוּלֵא
  choice: もし……なかったなら
  rationale: 過去の事実に反する条件を、現代日本語で自然に示す。節頭のכִּיが担う説明的なつながりは、文脈と条件構文によって十分に伝わる。
- source_word: הִתְמַהְמָהְנוּ
  choice: 私たちが出発を延ばしていなかった
  rationale: 動詞は遅延、長居、ためらいを表しうる。ここではエジプトへの再出発が遅れた文脈なので、「出発を延ばす」と明確かつ自然に訳した。語の幅は脚注に残した。
- source_word: כִּי עַתָּה
  choice: 今ごろはもう
  rationale: 反実仮想の帰結として、その時点までにすでに実現していたはずだという時間的含意を自然に表す。
- source_word: שַׁבְנוּ
  choice: 戻って来ていたはずです
  rationale: 形態上は完了形だが、反実仮想構文の帰結を表すため、日本語では「はずです」を用いて未実現の結果を示した。
- source_word: זֶה פַעֲמָיִם
  choice: 二度も
  rationale: 字義的には「これ、二回」だが、この表現は「二度」を意味する。「も」は、遅延がなければ二往復を終えられたほどの時間があったという強調を自然に伝える。
