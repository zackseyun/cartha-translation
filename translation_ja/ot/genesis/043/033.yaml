base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/033.yaml
  text: And they sat before him[a], the firstborn according to his birthright and the youngest according to his youth[b], and the men looked at one another in astonishment.
translation:
  language: ja
  text: 彼らは彼の前に、長子から末の者まで、それぞれの出生順に座った。[a] 男たちは互いに顔を見合わせ、驚いた。[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「長子はその長子の位に従い、末の者はその若さに従って」。ヘブライ語は長子と最年少者を対にして、出生順による席順を描いている。
    reason: lexical_alternative
  - marker: b
    text: 直訳的には「男たちは、一人がその仲間に向かって驚いた」。これは相互の驚きを表す言い回しであり、「顔を見合わせ」はそれを自然な日本語で表したものである。
    reason: translation_clarity
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: 座った
  rationale: ישׁבの能動形をそのまま保ち、文脈から推測される「座らされた」という受動の意味を本文に持ち込まない。
- source_word: לְפָנָיו
  choice: 彼の前に
  rationale: ヨセフとの空間的な位置関係を明確かつ自然な日本語で表す。
- source_word: הַבְּכֹר כִּבְכֹרָתוֹ
  choice: 長子は長子としての順に
  rationale: בכורとבכורהの語の響きの対応をある程度保ちつつ、ここでは長子の権利そのものより出生順位に基づく席順を指すことを示す。
- source_word: וְהַצָּעִיר כִּצְעִרָתוֹ
  choice: 末の者は年の若さに従って
  rationale: 最年少者を指す対比と、צעירהが表す若さ・年少の度合いを保つ。
- source_word: וַיִּתְמְהוּ
  choice: 驚いた
  rationale: תמהの中心的な意味である驚き・当惑を簡潔に表す。
- source_word: הָאֲנָשִׁים
  choice: 男たちは
  rationale: 文脈上はヨセフの兄弟たちだが、ヘブライ語本文の「男たち」という表現を保つ。
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: 互いに顔を見合わせ
  rationale: 直訳的な「一人がその仲間に向かって」が示す相互的な反応を、現代日本語で自然に表現する。顔を見る動作自体は明記されないため脚注で説明する。
