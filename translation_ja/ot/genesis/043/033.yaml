translation_notes:
  register: 明瞭で品位のある現代標準日本語。席順を説明するヘブライ語の対句性をできるだけ残しつつ、「長子の権利」と断定して文脈上の出生順位を曖昧にしないようにした。冒頭では指示対象を明らかにするため「兄弟たち」とし、後半では原文のהָאֲנָשִׁיםに合わせて「男たち」とした。
