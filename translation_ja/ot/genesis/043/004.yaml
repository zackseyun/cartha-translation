    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: もし…なら
  rationale: 条件節を導く語として、強調を加えず自然な現代日本語で表した。
- source_word: יֶשְׁךָ + מְשַׁלֵּחַ
  choice: あなたが…行かせてくださる
  rationale: 実際に同行させることを条件として自然に表しつつ、父への敬意も示した。この構文には意志・同意を表す可能性もあるため、別訳を脚注に掲げた。
- source_word: אֶת אָחִינוּ
  choice: 私たちの弟
  rationale: אָח は広く兄弟を意味するが、文脈上ベニヤミンが話者たちの弟であることが明らかなため、日本語として自然で明確な「弟」とした。
- source_word: אִתָּנוּ
  choice: 一緒に
  rationale: ベニヤミンが兄たちに同行することを、簡潔で自然な日本語で示した。
- source_word: נֵרְדָה
  choice: 私たちは下って行き
  rationale: 一人称複数コホータティブが条件の帰結として示す決意・意図を、「下って行き」と表した。
- source_word: וְנִשְׁבְּרָה
  choice: 買って来ます
  rationale: この文脈の שׁבר は食料を買い入れることを意味する。「来ます」により、父のもとへ持ち帰る含意を自然な日本語で表した。
- source_word: לְךָ
  choice: あなたのために
  rationale: 二人称男性単数を伴う利益の לְ を直接的に訳した。
- source_word: אֹכֶל
  choice: 食料
  rationale: 語義は穀物に限定されない「食べ物」であり、買い付ける物資という文脈に合う「食料」を選んだ。
