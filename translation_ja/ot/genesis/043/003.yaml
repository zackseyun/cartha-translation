base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/003.yaml
  text: Then Judah said to him[a], “The man solemnly warned us, saying[b], ‘You shall not see my face unless your brother is with you.’”
translation:
  language: ja
  text: すると、ユダは彼に言った。「あの人は私たちに厳しく警告して[a]、こう言った。『あなたがたの兄弟が一緒でなければ、あなたがたは私の顔を見ることはできない[b]。』」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文は「警告する」という動詞の不定詞絶対形と定動詞を重ね、警告の強さを際立たせている。「はっきりと言い渡して」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「あなたがたは私の顔を見ない」。ここでは「私の前に出ることはできない」、すなわち「私に会うことはできない」という意味にも取れる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוּדָה
  choice: すると、ユダは彼に言った
  rationale: 物語を進める接続形を、現代日本語で自然に順序を示す「すると」で表した。「彼」は文脈上ヤコブを指す。
- source_word: הָעֵד הֵעִד בָּנוּ
  choice: 私たちに厳重に警告して
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「厳重に」で表した。ここでは法廷的な「証言する」より、強い警告・言い渡しの意味が文脈に適する。
- source_word: הָאִישׁ
  choice: あの人
  rationale: エジプトの役人を指す一般的な呼称を保ち、日本語の発話として自然な「あの人」とした。
- source_word: לֹא תִרְאוּ פָנַי
  choice: 私の顔を見ることはできない
  rationale: 原文の「私の顔を見る」という具体的な表現を本文に残しつつ、面会を許さないという文脈上の力を自然な日本語で示した。
- source_word: בִּלְתִּי אֲחִיכֶם אִתְּכֶם
  choice: おまえたちの弟が一緒でなければ
  rationale: 条件を表すבִּלְתִּיを「なければ」とし、単数の「あなたがたの兄弟」は文脈上ベニヤミンなので、日本語では自然な「弟」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語を用いながら、会話には重みを保った。「あの人」はהָאִישׁの一般的な呼称を反映する。「私の顔を見る」は原文の比喩的表現とその解釈の幅を残すため本文に保持した。
