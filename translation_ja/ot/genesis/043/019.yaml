lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: 近づき
  rationale: נגשׁの、相手のそばへ進み出るという方向性を、自然な現代日本語で表す。
- source_word: הָאִישׁ
  choice: 男
  rationale: 文脈上は家の管理者だが、原文は職名ではなく単に「その男」としているため、明示されていない「執事」「管理人」は採用しない。
- source_word: אֲשֶׁר עַל בֵּית יוֹסֵף
  choice: ヨセフの家を取り仕切る
  rationale: עַלが示す監督・管理上の権限を表しつつ、בֵּיתを建物だけでなく家政全体を含み得る自然な表現にした。
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: 彼に話しかけた
  rationale: דבר אלの「相手に語る」という意味を示し、次節で発言内容が続く物語上のつながりを自然にする。
- source_word: פֶּתַח הַבָּיִת
  choice: 家の入り口で
  rationale: פֶּתַחは開口部、入り口、戸口を意味する。「入り口」は場面を明瞭にしつつ、戸口という訳の可能性も脚注に残す。
