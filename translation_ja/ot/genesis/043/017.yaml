  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ הָ/אִ֔ישׁ כַּֽ/אֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַ/יָּבֵ֥א הָ/אִ֛ישׁ אֶת הָ/אֲנָשִׁ֖ים בֵּ֥יתָ/ה יוֹסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/017.yaml
  text: So the man did as Joseph said[a], and the man brought the men into Joseph’s house.
translation:
  language: ja
  text: その人はヨセフが言ったとおりにし、男たちをヨセフの家に連れて入った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「男たちをヨセフの家へ連れて行った。」
    reason: וַיָּבֵא は「連れて来た／連れて行った」とも訳せるが、方向を示す בֵּיתָה と文脈から、本文では家の中への入場を明示した。
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: した
  rationale: ここでは、命じられたことに従って行動したことを表す。「言ったとおりにした」は自然で、原文の一般的な動詞の簡潔さも保つ。
- source_word: הָאִישׁ
  choice: その人
  rationale: 原文は役職を示さず、単に「その人」と呼ぶ。文脈から「執事」などと補わず、指示済みの人物を指す自然な日本語とした。
- source_word: כַּאֲשֶׁר אָמַר יוֹסֵף
  choice: ヨセフが言ったとおりに
  rationale: ヨセフの指示に従ったことを、簡潔で自然な日本語にした。
- source_word: וַיָּבֵא
  choice: 連れて入った
  rationale: בוא のヒフィル形が示す「来させる／連れて来る」と、目的地を示す語形 בֵּיתָה の方向性を合わせ、家の中への移動を明確にした。
- source_word: הָאֲנָשִׁים
  choice: 男たち
  rationale: 原文は彼らを「兄弟たち」と特定せず、一般的に「男たち」と呼んでいるため、その語り方を保った。
- source_word: בֵּיתָה יוֹסֵף
  choice: ヨセフの家に
  rationale: בֵּיתָה の方向を表す語尾は、ヨセフの家へ、文脈上は家の中へ入る移動を示す。「連れて入った」と組み合わせて表現した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いた。「その人」と「男たち」によって単数と複数の対照を保ちつつ、原文にない役職や親族関係は補わなかった。原文では「その人」が二度現れるが、日本語では同一主語の反復が不自然なため、一つの連続文にまとめた。
