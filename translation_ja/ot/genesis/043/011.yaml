source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֲלֵ/הֶ֜ם יִשְׂרָאֵ֣ל אֲבִי/הֶ֗ם אִם כֵּ֣ן אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִ/זִּמְרַ֤ת הָ/אָ֨רֶץ֙ בִּ/כְלֵי/כֶ֔ם וְ/הוֹרִ֥ידוּ לָ/אִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּ/מְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָ/לֹ֔ט בָּטְנִ֖ים וּ/שְׁקֵדִֽים־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/011.yaml
  text: 'Then Israel their father said to them[a], “If it must be so, then do this: take some of the choice products of the land in your containers, and carry down to the man a gift—a little balm and a little honey, gum and myrrh[c][b], pistachio nuts and almonds.”'
translation:
  language: ja
  text: すると、彼らの父イスラエルは彼らに言った。「どうしてもそうしなければならないのなら、こうしなさい。この地のえりすぐりの産物[a]をあなたがたの器に入れ、あの人への贈り物として持って下りなさい。すなわち、少量のバルサムと少量の蜜[b]、香料樹脂と没薬[c]、ピスタチオとアーモンドだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「この地の最上の実り」とも訳せる。ヘブライ語は果物だけでなく、その土地の選り抜きの産物を広く指す。
    reason: lexical_alternative
  - marker: b
    text: 「蜜」は、文脈によっては蜂蜜ではなく、果汁を煮詰めた甘いシロップを指すことがある。
    reason: lexical_alternative
  - marker: c
    text: 「香料樹脂」と「没薬」に当たるヘブライ語がどの植物性香料を指すかは確定していない。トラガカントゴムやラダナムなどの芳香樹脂とする見方もある。
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׂרָאֵל אֲבִיהֶם
  choice: 彼らの父イスラエル
  rationale: 原文の同格関係と、この文脈でヤコブを「イスラエル」と呼ぶ語り方を自然な日本語で保持した。
- source_word: אִם כֵּן אֵפוֹא
  choice: どうしてもそうしなければならないのなら
  rationale: 単なる条件ではなく、状況を受け入れる父のためらいを伴う譲歩を表した。
- source_word: מִזִּמְרַת הָאָרֶץ
  choice: この地のえりすぐりの産物
  rationale: 果物だけに限定せず、その土地の選り抜きの産物を広く指す表現として訳した。
- source_word: בִּכְלֵיכֶם
  choice: 器に入れ
  rationale: כְּלִי は袋などに限定されない容器・道具の総称なので、文脈に合う広い語を用いた。
- source_word: וְהוֹרִידוּ
  choice: 持って下りなさい
  rationale: 品物を運ぶことと、エジプトへ「下る」という原文の移動表現をともに保持した。
- source_word: לָאִישׁ
  choice: あの人
  rationale: すでに物語に登場しているエジプトの役人を指す。過度に敬称化せず、自然な既知の指示表現とした。
- source_word: מִנְחָה
  choice: 贈り物
  rationale: ここでは祭儀的な供え物ではなく、相手の好意を得るための贈答品なので「贈り物」とした。
- source_word: צֳרִי
  choice: バルサム
  rationale: 植物性の芳香樹脂または香油を指す語として、別種の香料である乳香との混同を避けつつ訳した。
- source_word: דְּבַשׁ
  choice: 蜜
  rationale: 通常の意味を本文に採用し、果汁を煮詰めたシロップを指す可能性は脚注に残した。
- source_word: נְכֹאת
  choice: 香料樹脂
  rationale: 植物の厳密な同定が困難なため、芳香性の樹脂という大まかな性質を示す訳語を選んだ。
- source_word: לֹט
  choice: 没薬
  rationale: 伝統的で理解しやすい訳語を採りつつ、ラダナムなど別の芳香樹脂である可能性を脚注で明示した。
- source_word: בָּטְנִים וּשְׁקֵדִים
  choice: ピスタチオとアーモンド
  rationale: 現代の一般読者に明確な植物名を用いた。
