  yaml_path: translation/ot/genesis/043/026.yaml
  text: When Joseph came into the house[a], they brought to him the gift that was in their hands into the house[c][b], and they bowed down to the ground before him.
translation:
  language: ja
  text: ヨセフが家に入って来たとき、彼らは手にしていた贈り物[a]を家の中へ、ヨセフのもとに持って来て[b]、彼の前で地にひれ伏した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「貢ぎ物」とも訳せる。ヘブライ語は文脈により、贈り物、貢ぎ物、供え物などを意味する。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では「家に／家の中へ」に当たる表現が二度繰り返され、ヨセフが入ったことと、兄弟たちが贈り物を運び入れたことの両方を示している。
    reason: source_form
lexical_decisions:
- source_word: וַיָּבֹא
  choice: 入って来ると
  rationale: בוא の移動の意味と、方向を示す הַבַּיְתָה を合わせ、物語の流れに自然な日本語で家の中への到来を表した。
- source_word: הַבַּיְתָה
  choice: 家に／家の中へ
  rationale: 方向を示す語尾を伴う בית であり、家の中への移動を示す。同じ形が節内で二度使われているため、日本語でも二度表した。
- source_word: וַיָּבִיאוּ לוֹ
  choice: ヨセフのもとに持って来て
  rationale: ביא のヒフィル形「持って来る」と、間接目的語 לוֹ「彼のもとに」を明示した。日本語で指示対象が曖昧にならないよう「ヨセフ」とした。
- source_word: הַמִּנְחָה
  choice: 贈り物
  rationale: מִנְחָה は贈り物、貢ぎ物、供え物などを意味し得るが、ここでは兄弟たちがヨセフに携えて来た外交的な贈答品なので「贈り物」が最も明瞭である。
- source_word: אֲשֶׁר בְּיָדָם
  choice: 手にしていた
  rationale: 直訳的には「彼らの手にあった」。具体的な表現を保ちつつ、現代日本語として自然にした。
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: 彼の前でひれ伏した
  rationale: שׁחה の形は敬意や服従を示して身をかがめる行為を表す。「ひれ伏す」は礼拝行為に限定せず、深い敬意を伴う姿勢を自然に伝える。
- source_word: אָרְצָה
  choice: 地に
  rationale: 方向を示す形で、地面に向かって身を伏せたことを簡潔に表した。
theological_decisions: []
