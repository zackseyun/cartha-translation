  text: וַ/יִּקְח֤וּ הָֽ/אֲנָשִׁים֙ אֶת הַ/מִּנְחָ֣ה הַ/זֹּ֔את וּ/מִשְׁנֶה כֶּ֛סֶף לָקְח֥וּ בְ/יָדָ֖/ם וְ/אֶת בִּנְיָמִ֑ן וַ/יָּקֻ֨מוּ֙ וַ/יֵּרְד֣וּ מִצְרַ֔יִם וַ/יַּֽעַמְד֖וּ לִ/פְנֵ֥י יוֹסֵֽף־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/015.yaml
  text: So the men took this gift[a], and they took double the money in their hand, and Benjamin[d][c][b]. Then they arose and went down to Egypt and stood before Joseph.
translation:
  language: ja
  text: そこで、人々はこの贈り物と二倍の金銭を携え、ベニヤミンも連れて行った。彼らは立ち上がり、エジプトへ下って、ヨセフの前に立った。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֲנָשִׁים
  choice: その人たち
  rationale: 文脈上はヨセフの兄弟たちだが、原文の呼称「人々／男たち」を保ちつつ、現代日本語として自然にした。
- source_word: מִּנְחָה
  choice: 贈り物
  rationale: ここでは祭儀的な供え物ではなく、権力者の好意を得るために持参する品々を指すため。
- source_word: מִשְׁנֶה כֶּסֶף
  choice: 二倍の金
  rationale: 前回の代金に対して倍量の金銭を表す簡潔な訳。
- source_word: כֶּסֶף
  choice: 金
  rationale: 字義は「銀」だが、ここでは支払いに用いる金銭の意味。「金」は現代日本語で自然な文脈訳。
- source_word: בְיָדָם
  choice: 携え
  rationale: 字義的な「彼らの手に」という所有・携行のヘブライ語慣用句を、自然な日本語で表した。
- source_word: וְאֶת בִּנְיָמִן
  choice: ベニヤミンも連れて行った
  rationale: ベニヤミンが物と同様に動詞「取る」の目的語となる原文の構文を、人について自然な日本語にした。
- source_word: וַיָּקֻמוּ
  choice: 彼らは立って
  rationale: 「立ち上がる」の語義を保ち、続く移動との動作の連続を表した。
- source_word: וַיֵּרְדוּ מִצְרַיִם
  choice: エジプトへ下り
  rationale: カナンからエジプトへの移動を「下る」と表す原文の地理的慣用表現を保持した。
- source_word: וַיַּעַמְדוּ לִפְנֵי יוֹסֵף
  choice: ヨセフの前に立った
  rationale: 支配者の前に出て立つという原文の形式的な表現を明瞭に保持した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調のある現代標準日本語。原文で反復される「取る」は、日本語では贈り物と金に「携え」、人物に「連れて行った」を用いて意味関係を自然に示した。「下る」と「前に立つ」は原文の地理的・宮廷的表現を保った。
