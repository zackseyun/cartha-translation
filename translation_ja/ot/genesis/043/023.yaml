revisions:
- from: 彼は言った。「安心してください。恐れることはありません。あなたがたの神、あなたがたの父の神が、あなたがたの袋の中に宝[a]を与えてくださったのです。あなたがたの銀[b]は私のところに届いています。」そして彼はシメオンを彼らのところへ連れ出した。
  to: 管理人は言った。「ご安心ください。恐れないでください。あなたがたの神、あなたがたの父の神が、あなたがたの袋の中に宝[a]を与えたのです。あなたがたの銀[b]は私のところに届いています。」そして管理人はシメオンを彼らのところへ連れ出した。
  rationale: 原文の発話機能により近い「ご安心ください」を採用し、神への敬語が付加するニュアンスを避けて「与えたのです」とした。さらに、連れ出した人物を「管理人」と明示して日本語本文の照応を明確にした。脚注のアンカーと内容は原語の語義上の代替を適切に示しており、そのまま維持した。
