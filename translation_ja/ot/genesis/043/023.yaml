  text: וַ/יֹּאמֶר֩ שָׁל֨וֹם לָ/כֶ֜ם אַל תִּירָ֗אוּ אֱלֹ֨הֵי/כֶ֜ם וֵֽ/אלֹהֵ֤י אֲבִי/כֶם֙ נָתַ֨ן לָ/כֶ֤ם מַטְמוֹן֙ בְּ/אַמְתְּחֹ֣תֵי/כֶ֔ם כַּסְפְּ/כֶ֖ם בָּ֣א אֵלָ֑/י וַ/יּוֹצֵ֥א אֲלֵ/הֶ֖ם אֶת שִׁמְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/023.yaml
  text: He said[a], “Peace to you. Do not be afraid. Your God and the God of your father has given you treasure in your sacks[b]. Your silver came to me.” Then he brought Simeon out to them.
translation:
  language: ja
  text: 管理人は言った。「ご安心ください。恐れないでください。あなたがたの神、あなたがたの父の神が、あなたがたの袋の中に宝[a]を与えたのです。あなたがたの銀[b]は私のところに届いています。」そして管理人はシメオンを彼らのところへ連れ出した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「隠された宝」とも訳せる。
    reason: lexical_alternative
  - marker: b
    text: 「あなたがたのお金」とも訳せる。ヘブライ語の「銀」は、しばしば金銭を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם לָכֶם
  choice: 安心してください
  rationale: 直訳的な「あなたがたに平安を」よりも、この場面で相手を安心させる挨拶・保証としての機能を明瞭な現代日本語で表す。後続の「恐れることはありません」と自然につながる。
- source_word: אַל תִּירָאוּ
  choice: 恐れることはありません
  rationale: 複数相手への否定命令を、丁寧で自然な現代日本語として表現した。
- source_word: אֱלֹהֵיכֶם וֵאלֹהֵי אֲבִיכֶם
  choice: あなたがたの神、あなたがたの父の神
  rationale: 同一の神を二つの関係から示すヘブライ語を保ち、「父」が単数であることも維持する。
- source_word: נָתַן לָכֶם
  choice: 与えてくださったのです
  rationale: 完了した行為と現在の結果を示しつつ、神を主語とする文脈に自然な敬語を用いる。「のです」は、袋の中の銀についての説明であることを表す。
- source_word: מַטְמוֹן
  choice: 宝
  rationale: 隠され、蓄えられた価値ある物を指す語。本文では簡潔な「宝」とし、「隠された宝」という含みは脚注に残す。
- source_word: בְּאַמְתְּחֹתֵיכֶם
  choice: あなたがたの袋の中に
  rationale: 穀物などを運ぶ袋を指す文脈に即し、一般的で明瞭な「袋」とする。
- source_word: כַּסְפְּכֶם בָּא אֵלָי
  choice: あなたがたの銀は私のところに届いています
  rationale: כֶּסֶף の具体的な「銀」を保ち、בָּא אֵלָי の「私のところに来た」を自然な日本語の「届いています」で表す。金銭を意味する可能性は脚注に示す。
- source_word: וַיּוֹצֵא אֲלֵהֶם אֶת שִׁמְעוֹן
  choice: そして彼はシメオンを彼らのところへ連れ出した
  rationale: 使役形の「外へ出す／連れ出す」という方向性を保持し、物語の進行を「そして」でつなぐ。
theological_decisions:
- issue: 管理人の発言における神への言及
  choice: 「あなたがたの神、あなたがたの父の神」と発言どおりに訳し、話者自身の信仰については判断を加えない。
  alternative: 外交的な言い合わせにすぎないと解する、または話者の個人的信仰の告白と解する。
  rationale: ヘブライ語本文は管理人の内心や信仰を説明していないため、その神学的緊張と曖昧さを保つ。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。管理人から兄弟たちへの発言には丁寧語を用い、物語文は簡潔にした。すべての脚注記号を該当語の直後に配置した。
