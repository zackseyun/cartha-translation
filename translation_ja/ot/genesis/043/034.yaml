  text: וַ/יִּשָּׂ֨א מַשְׂאֹ֜ת מֵ/אֵ֣ת פָּנָי/ו֮ אֲלֵ/הֶם֒ וַ/תֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִ/מַּשְׂאֹ֥ת כֻּלָּ֖/ם חָמֵ֣שׁ יָד֑וֹת וַ/יִּשְׁתּ֥וּ וַֽ/יִּשְׁכְּר֖וּ עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/034.yaml
  text: He sent portions to them from before him[a], but Benjamin’s portion was five times as much as all of theirs[c][b]. So they drank and became drunk with him.
translation:
  language: ja
  text: ヨセフは自分の前から料理を取り分けて、彼らに送った[a]。ベニヤミンの分は、ほかの者たち一人一人の分の五倍もあった[b]。こうして彼らはヨセフとともに酒を飲み、酔った[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳は「彼の前から」。ヨセフ自身の席、またはその前に置かれた料理から取り分けたという意味。
    reason: cultural_note
  - marker: b
    text: 直訳は「五つの手」。ここでは量を表す言い回しで、「五倍」を意味する。
    reason: lexical_alternative
  - marker: c
    text: 「酔った」と訳したヘブライ語は、酒に酔うことを直接表す。「陽気になった」と訳すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מַשְׂאֹת
  choice: 料理を取り分け、彼らに運ばせた
  rationale: 動詞は字義的には「持ち上げる／運ぶ」、名詞はこの食事の文脈では「料理の取り分」を指す。ヨセフの席から料理が各人へ配られた動作を、自然な現代日本語で表した。
- source_word: מֵאֵת פָּנָיו
  choice: 自分の前から
  rationale: 字義的な空間表現「彼の顔の前から」を保ちつつ、日本語として理解できる形にした。文脈上はヨセフ自身の席、またはその前に置かれた料理を指す。
- source_word: מַשְׂאַת בִּנְיָמִן
  choice: ベニヤミンの分
  rationale: 食卓で各人に配られた料理の取り分を簡潔に表す。
- source_word: מִמַּשְׂאֹת כֻּלָּם חָמֵשׁ יָדוֹת
  choice: ほかの者たちの分の五倍もあった
  rationale: 「五つの手」は量を示すヘブライ語の表現で、ベニヤミンの取り分がほかの各人のものの五倍だったことを示す。「五倍多かった」は六倍とも誤解され得るため、「五倍もあった」とした。
- source_word: וַיִּשְׁתּוּ
  choice: 酒を飲み
  rationale: 宴席の文脈を明確にするため、日本語では目的語「酒」を補った。
- source_word: וַיִּשְׁכְּרוּ
  choice: 酔った
  rationale: この動詞の直接的な意味は酒に酔うことであり、「陽気になった」などと婉曲化しなかった。
- source_word: עִמּוֹ
  choice: ヨセフとともに
  rationale: 原文は「彼と」だが、単独節でも指示対象が明確になるよう、先行する人物ヨセフの名を用いた。
theological_decisions: []
