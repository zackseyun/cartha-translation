  yaml_path: translation/ot/genesis/043/020.yaml
  text: And they said[a], “Please, my lord[b], we came down the first time to buy food.”
translation:
  language: ja
  text: 彼らは言った。「どうか、御主人様[b]。私たちは最初のときに、食料を買うために確かに[a]下って来たのです。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では、不定詞絶対形を定動詞と重ねて、「下って来た」ことを強調している。別訳「私たちは最初のときに、食料を買うために本当に下って来たのです」。
    reason: lexical_alternative
  - marker: b
    text: ここでの「御主人様」は、人間の上位者に対する敬意ある呼びかけであり、神を指す称号ではない。
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 彼らは言った
  rationale: ワウ継続法による物語の進行を、現代日本語の自然な叙述として表した。
- source_word: בִּי
  choice: 恐れ入ります
  rationale: 字義的な前置詞句ではなく、目上の者に申し出る際の丁重な嘆願表現。緊張した場面に合う自然な敬語とした。
- source_word: אֲדֹנִי
  choice: ご主人様
  rationale: 社会的上位者への敬意を示す呼びかけ。神への称号ではないことを注で明示した。
- source_word: יָרֹד יָרַדְנוּ
  choice: 私たちは確かに…下って来たのです
  rationale: 不定詞絶対形と定動詞の組み合わせによる強調を「確かに」と説明調の「のです」で伝えた。
- source_word: בַּתְּחִלָּה
  choice: 前回
  rationale: 字義的には「初めに」だが、文脈上は兄弟たちの最初の来訪を指すため、現在の発話時点から自然な「前回」とした。
- source_word: לִשְׁבָּר
  choice: 買うために
  rationale: 食糧を代価と引き換えに調達する意味を、簡潔で自然な日本語にした。
- source_word: אֹכֶל
  choice: 食料
  rationale: 文脈は穀物だが、原語自体はより広く食べ物を指すため、「穀物」に狭めず「食料」とした。
theological_decisions:
- issue: אֲדֹנִי の指示対象
  choice: 人間の上位者への敬称として「ご主人様」
  alternative: 神的称号として「主」
  rationale: この場面では兄弟たちがヨセフの家の管理者に話しており、神への呼びかけではない。
translation_notes:
  register: 丁重に弁明する場面に合わせ、「恐れ入ります」「ご主人様」「のです」を用いた。全体は現代の読者に明瞭でありながら、へりくだった緊張感と原文の強調を保つ文体とした。
