  text: וְ/כֶ֧סֶף אַחֵ֛ר הוֹרַ֥דְנוּ בְ/יָדֵ֖/נוּ לִ/שְׁבָּר אֹ֑כֶל לֹ֣א יָדַ֔עְנוּ מִי שָׂ֥ם כַּסְפֵּ֖/נוּ בְּ/אַמְתְּחֹתֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/022.yaml
  text: And we have brought down other silver in our hands to buy food[c][b][a]. We do not know who put our silver in our sacks.
translation:
  language: ja
  text: 食べ物[b]を買うために、私たちはさらに銀[a]も手に持って[c]下って来ました。私たちの銀をだれが袋に入れたのか、私たちには分かりません。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「銀」は「金銭」「代金」とも訳せる。ヘブライ語 כֶּסֶף は、金属としての銀にも通貨としての金銭にも用いられる。この節の二箇所とも同じ語。
    reason: lexical_alternative
  - marker: b
    text: 「食べ物を買う」は「穀物を買う」とも訳せる。ここで用いられた動詞はこの文脈では穀物や食糧の購入を指すが、目的語そのものはより広く「食べ物」を意味する。
    reason: lexical_alternative
  - marker: c
    text: 「手に持って」の箇所は、直訳では「私たちの手に」。
    reason: literal_rendering
lexical_decisions:
- source_word: וְ/כֶסֶף אַחֵר
  choice: また、さらに銀を
  rationale: כֶּסֶף の具体的な語義「銀」を保ち、אַחֵר は前の代金とは別に用意した追加分であることが分かるよう「さらに」とした。
- source_word: הוֹרַדְנוּ
  choice: 携えて下って来ました
  rationale: ヒフィル形の「下らせる、持って下る」を反映する。カナンからエジプトへの移動を「下る」と表す創世記の地理的な語法も保った。
- source_word: בְ/יָדֵ/נוּ
  choice: 手に携えて
  rationale: 直訳的な「私たちの手に」を不自然に再現せず、所有・携行を表す日本語として自然な形で「手」の比喩を残した。
- source_word: לִ/שְׁבָּר אֹכֶל
  choice: 食べ物を買うため
  rationale: שׁבר はこの文脈で食糧を買うことを表し、אֹכֶל の広い意味に合わせて「穀物」に限定せず「食べ物」とした。
- source_word: לֹא יָדַעְנוּ
  choice: 私たちには分かりません
  rationale: 完了形が表す、過去から現在まで続く認識の欠如を、発話時の主張として自然な現在形で訳した。
- source_word: מִי שָׂם
  choice: だれが……入れたのか
  rationale: 間接疑問を自然な日本語で表し、שׂים は袋という目的語に合わせて「入れた」とした。
- source_word: כַּסְפֵּ/נוּ בְּ/אַמְתְּחֹתֵי/נוּ
  choice: 私たちの銀を……袋に
  rationale: 同じ כֶּסֶף を一節内で「銀」と統一し、אַמְתַּחַת は食糧などを運ぶ袋を指すため、現代語の「袋」とした。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な敬体の直接話法とした。「下って来ました」は創世記におけるカナンからエジプトへの移動方向を保ちつつ、日本語として理解できる表現である。「銀」はやや具体的な聖書的表現だが難解ではなく、金銭の意味は脚注で明示した。
