  text: וַ/יֹּ֨אמֶר יְהוּדָ֜ה אֶל יִשְׂרָאֵ֣ל אָבִ֗י/ו שִׁלְחָ֥/ה הַ/נַּ֛עַר אִתִּ֖/י וְ/נָק֣וּמָה וְ/נֵלֵ֑כָה וְ/נִֽחְיֶה֙ וְ/לֹ֣א נָמ֔וּת גַּם אֲנַ֥חְנוּ גַם אַתָּ֖ה גַּם טַפֵּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/008.yaml
  text: And Judah said to Israel his father[a], “Send the boy with me, and let us arise and go, so that we may live and not die—both we and you and our little ones.”
translation:
  language: ja
  text: ユダは父であるイスラエルに言った。「あの若者[a]を私と一緒に行かせてください。さあ、立って出かけましょう。そうすれば、私たちも、あなたも、幼い子どもたちも、生きて、死なずに済みます。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「少年」とも訳せる。ヘブライ語の「ナアル」は、幼い子どもだけでなく、青年や若い男性を指すこともある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める接続形であり、日本語では文脈上不自然な接続語を補わず、簡潔に叙述した。
- source_word: יִשְׂרָאֵל אָבִיו
  choice: 父イスラエル
  rationale: 原文どおり「イスラエル」の名を保ち、ユダとの父子関係を自然な日本語で明示した。
- source_word: שִׁלְחָה הַנַּעַר אִתִּי
  choice: あの若者を私と一緒に行かせてください
  rationale: שלחの使役的な意味とאִתִּיの同行関係を表した。נערは幼児に限らないため、成人に近いベニヤミンにも自然な「若者」とした。定冠詞は、話題となっている人物を指す「あの」によって自然に示した。
- source_word: וְנָקוּמָה וְנֵלֵכָה
  choice: さあ、立って出かけましょう
  rationale: 二つの勧奨形が表す、直ちに共に行動しようとの促しを保ち、動詞の連続も反映した。
- source_word: וְנִחְיֶה וְלֹא נָמוּת
  choice: そうすれば……生きて、死なずに済みます
  rationale: 出発の目的・結果を自然な日本語で示しつつ、「生きる／死なない」という原文の重ねた表現を残した。
- source_word: גַּם אֲנַחְנוּ גַם אַתָּה גַּם טַפֵּנוּ
  choice: 私たちも、あなたも、幼い子どもたちも
  rationale: 反復されるגםの包括的な強調と、三つの対象を同じ「も」で明確に表した。טףは家族の中の幼く弱い者たちを指すため「幼い子どもたち」とした。
