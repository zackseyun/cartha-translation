source:
  edition: WLC
  text: וְ/אֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָ/כֶ֤ם רַחֲמִים֙ לִ/פְנֵ֣י הָ/אִ֔ישׁ וְ/שִׁלַּ֥ח לָ/כֶ֛ם אֶת אֲחִי/כֶ֥ם אַחֵ֖ר וְ/אֶת בִּנְיָמִ֑ין וַ/אֲנִ֕י כַּ/אֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/014.yaml
  text: May God Almighty grant you mercy before the man[a], so that he may send back your other brother and Benjamin. And as for me, if I am bereaved[c][b], I am bereaved.
translation:
  language: ja
  text: 全能の神が、あの人があなたがたをあわれみ、あなたがたのもう一人の兄弟とベニヤミンを帰らせてくれるように。私については、子を失うなら、失うまでだ。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「私が子を失うなら、私は子を失う」。ヘブライ語は同じ動詞を繰り返しており、子を失うことへのヤコブの覚悟と諦念を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל שַׁדַּי
  choice: 全能の神
  rationale: 神の称号を音写せず、現代日本語で意味が伝わる伝統的かつ自然な表現とした。
- source_word: יִתֵּן לָכֶם רַחֲמִים לִפְנֵי הָאִישׁ
  choice: あの人の前であなたがたにあわれみを与え
  rationale: רַחֲמִים の「あわれみ、慈悲」の幅を保ち、לִפְנֵי の「前で」という原文の表現も維持した。文脈上「あの人」はエジプトの役人を指す。
- source_word: וְשִׁלַּח לָכֶם
  choice: 帰らせてくださるように
  rationale: 願望の連続として訳し、拘束されていた兄弟が彼らのもとへ戻されるという文脈上の方向を自然な日本語で示した。
- source_word: אֶת אֲחִיכֶם אַחֵר
  choice: あなたがたのもう一人の兄弟
  rationale: אַחֵר を「もう一人の」と訳し、ベニヤミンとは別の兄弟を指すことを明確にした。具体的にはシメオンだが、本文には名前を補わない。
- source_word: כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי
  choice: 子を失うなら、失うまでだ
  rationale: שׁכל の反復とヤコブの覚悟・諦念を保ちながら、日本語として自然にした。目的語「子」は動詞の意味と文脈に含まれるため補った。
theological_decisions:
- issue: 神の称号 אֵל שַׁדַּי の訳し方
  choice: 全能の神
  alternative: エル・シャダイ
  rationale: 固有名として音写するより、称号の意味を読者に伝える訳を採用した。ただし שַׁדַּי の語源には議論があるため、慣用的な理解に基づく。
- issue: 結びの反復が表す態度
  choice: 子を失うなら、失うまでだ
  alternative: 子を失わなければならないのなら、仕方がない
  rationale: 神学的な断定を加えず、原文にある喪失の可能性とヤコブの切迫した覚悟を、反復を残して表した。
translation_notes:
  register: 祈願にふさわしい落ち着いた格調を保ちつつ、一般の現代日本語読者に理解しやすい表現を用いた。「あわれみ」は聖書的な響きを持つが現在も理解可能。「失うまでだ」は切迫した諦念を自然に伝える。
