  text: וַ/יְהִ֗י כַּ/אֲשֶׁ֤ר כִּלּוּ֙ לֶ/אֱכֹ֣ל אֶת הַ/שֶּׁ֔בֶר אֲשֶׁ֥ר הֵבִ֖יאוּ מִ/מִּצְרָ֑יִם וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ אֲבִי/הֶ֔ם שֻׁ֖בוּ שִׁבְרוּ לָ֥/נוּ מְעַט אֹֽכֶל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/043/002.yaml
  text: And when they had finished eating the grain that they had brought from Egypt[a], their father said to them, “Go back; buy us a little food.”
translation:
  language: ja
  text: 彼らがエジプトから持ち帰った穀物を食べ尽くすと、父は彼らに言った。「もう一度行って、私たちのために食糧を少し買って来なさい。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ～すると
  rationale: 物語の次の出来事を導く連続表現。日本語では「～すると」が自然に時間関係と物語の進行を示す。
- source_word: כִּלּוּ לֶאֱכֹל
  choice: 食べ尽くす
  rationale: כלהと不定詞の組み合わせは、食べることの完了を表す。「食べ終える」よりも、蓄えていた穀物が尽きた文脈を明確に伝える。
- source_word: הַשֶּׁבֶר
  choice: 穀物
  rationale: ヨセフ物語では、飢饉の際に購入する穀類を指す。一般的な「食糧」より具体的である。
- source_word: הֵבִיאוּ מִמִּצְרָיִם
  choice: エジプトから持ち帰った
  rationale: エジプトから家へ運んだことを、日本語の移動方向に即して自然に表す。
- source_word: אֲבִיהֶם
  choice: 父
  rationale: ヘブライ語の関係名詞をそのまま保ち、文脈上明らかな「彼らの」は日本語では省いて自然にした。
- source_word: שֻׁבוּ
  choice: もう一度行って
  rationale: 直訳的な「戻りなさい」では目的地との視点が不自然になり得るため、再度エジプトへ行く命令として自然に表した。
- source_word: שִׁבְרוּ
  choice: 買って来なさい
  rationale: この文脈では穀物・食糧を買うことを意味する。日本語では家に持ち帰る意図を含む「買って来なさい」が自然である。
- source_word: לָנוּ
  choice: 私たちのために
  rationale: 受益者を示す与格を明示した。
- source_word: מְעַט אֹכֶל
  choice: 食糧を少し
  rationale: אֹכֶלは一般的な食べ物・食糧を指し、מְעַטは少量を表す。飢饉と買い付けの文脈には「食糧」が適切である。
theological_decisions: []
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、父の命令には「～なさい」を用いて落ち着いた威厳を保った。前半の「穀物」と後半の「食糧」を区別し、原文の הַשֶּׁבֶר と אֹכֶל の語義の違いを反映した。
