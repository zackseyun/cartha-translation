base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/020.yaml
  text: So he blessed them that day[a], saying, “By you Israel will bless, saying, ‘May God make you like Ephraim and like Manasseh.’” And he set Ephraim before Manasseh.
translation:
  language: ja
  text: 彼はその日、二人を祝福して言った。「あなたによって、イスラエルは人を祝福し[a]、『神があなたをエフライムのように、またマナセのようにしてくださるように』と言う。」そして彼は、エフライムをマナセより先に置いた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「あなたによって、イスラエルは祝福する」。すなわち、イスラエルがこの二人の名を祝福の言葉として用いるという意味。
    reason: בְּךָの構文と、目的語を明示しないיְבָרֵךְのヘブライ語的表現を説明するため。
lexical_decisions:
- source_word: וַיְבָרֲכֵם
  choice: 二人を祝福して
  rationale: ピエル形の「祝福する」と複数目的語接尾辞を、エフライムとマナセの二人を指すものとして明示した。
- source_word: בַּיּוֹם הַהוּא
  choice: その日
  rationale: 時間的な限定を保ちつつ、現代日本語として自然な表現にした。
- source_word: בְּךָ יְבָרֵךְ יִשְׂרָאֵל
  choice: あなたによって、イスラエルは人を祝福し
  rationale: בְּךָの手段・典拠の意味を「あなたによって」で保ち、他動詞「祝福する」の対象を補って、この名を祝福の型として用いる意味を明確にした。単数形「あなた」は集合的に二人を指し得るため、その形を保った。
- source_word: יְשִׂמְךָ אֱלֹהִים
  choice: 神があなたを…してくださるように
  rationale: 祝福における願望表現として訳し、שׂיםの「置く／する」を比較表現に自然な「…のようにする」で示した。
- source_word: כְּאֶפְרַיִם וְכִמְנַשֶּׁה
  choice: エフライムのように、またマナセのように
  rationale: 反復される比較のכを両名に対応させ、順序と強調を保った。
- source_word: וַיָּשֶׂם אֶת אֶפְרַיִם לִפְנֵי מְנַשֶּׁה
  choice: こうして彼は、エフライムをマナセよりも上に置いた
  rationale: לִפְנֵיがここで表す祝福上の優先順位を「よりも上に」で明確にし、שׂיםの配置の比喩を「置いた」に残した。接続は文脈上の帰結を示す自然な日本語とした。
theological_decisions:
- issue: 祝福の句における「イスラエル」の指示対象
  choice: 「イスラエル」のまま訳す
  alternative: 「ヤコブ」または「イスラエルの民」と明示する
  rationale: 原文はיִשְׂרָאֵלとのみ記し、族長本人への響きと、将来その句を用いる民としての意味の双方を帯び得るため、限定しなかった。
- issue: 「エフライムをマナセよりも上に置いた」の意味
  choice: 祝福における優先順位として表現する
  alternative: 空間的に「マナセの前に置いた」と訳す
  rationale: 直前の祝福句でエフライムが先に挙げられており、文脈は単なる位置よりも順位・優先を示す。ただし「置いた」を残して原語の比喩を保持した。
translation_notes:
  register: 明瞭で格調ある現代標準日本語。引用内の祝福は願望形で自然に表し、「イスラエル」の指示対象は原文どおり開いたままにした。
