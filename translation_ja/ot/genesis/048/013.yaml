base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/013.yaml
  text: And Joseph took the two of them—Ephraim in his right hand, at Israel’s left, and Manasseh in his left hand, at Israel’s right—and brought them near to him.
translation:
  language: ja
  text: ヨセフは二人を取り、エフライムを自分の右手でイスラエルの左側に、マナセを自分の左手でイスラエルの右側にして、彼のもとに近づけた。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְּׂמֹאל יִשְׂרָאֵל / מִימִין יִשְׂרָאֵל
  choice: イスラエルの左側に／イスラエルの右側に
  rationale: ここでの מִן は、二人がイスラエルに向かい合う配置を示す。日本語では位置関係を自然かつ明確に伝えるため「左側に／右側に」とした。
- source_word: וַיַּגֵּשׁ אֵלָיו
  choice: 彼のそばへ近づけた
  rationale: 使役的な動作と、接近先がイスラエルであることを文脈に沿って表す。「彼」は直前のイスラエルを指すという原文の代名詞表現を保持した。
