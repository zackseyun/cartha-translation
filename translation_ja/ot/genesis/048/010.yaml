base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/010.yaml
  text: Israel’s eyes were dim with age[a]; he could not see. So he brought them near to him[b], and he kissed them and embraced them.
translation:
  language: ja
  text: イスラエルの目は老齢のためにかすんでいて[a]、見ることができなかった。そこでヨセフは二人をイスラエルのもとへ連れて来た[b]。イスラエルは二人に口づけをし、抱きしめた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「イスラエルの目は老齢のために重くなっていた」。視力が衰えていたことを表す慣用表現。
    reason: lexical_alternative
  - marker: b
    text: ヘブライ語では、この動詞の主語は名を挙げずに示されている。前後の文脈から、主語はヨセフである。
    reason: source_ambiguity
lexical_decisions:
- source_word: עֵינֵי יִשְׂרָאֵל
  choice: イスラエルの目
  rationale: 自然な日本語の所有表現とし、原文どおり「ヤコブ」ではなく「イスラエル」を保持した。
- source_word: כָּבְדוּ מִזֹּקֶן
  choice: 老齢のためにかすみ
  rationale: 字義的には「老齢のために重くなった」だが、視力が衰えたことを表す慣用表現なので、現代日本語で意味が明瞭な「かすみ」とした。原因を示す מִן は「ために」で表した。
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: 見ることができなかった
  rationale: 能力の欠如を表す構文を、平明で格調を損なわない日本語にした。
- source_word: וַיַּגֵּשׁ אֹתָם אֵלָיו
  choice: そこでヨセフは二人をイスラエルのそばに連れて来た
  rationale: ヒフィル形の「近くに来させる」を「そばに連れて来た」とした。動詞に主語名は明記されていないが、直前の9節でイスラエルがヨセフに二人を連れて来るよう命じている文脈に基づき、行為者をヨセフと明示した。原文上の主語の省略は脚注で示した。
- source_word: וַיִּשַּׁק לָהֶם וַיְחַבֵּק לָהֶם
  choice: イスラエルは二人に口づけし、抱きしめた
  rationale: 愛情を示す二つの動作を自然な日本語で表した。主語の混同を避けるため、文脈上の主語イスラエルを明示した。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用い、「口づけ」「抱きしめた」によって物語にふさわしい落ち着いた品位を保った。指示対象の混同を避けるため人名を補った一方、ヘブライ語で主語が明示されない点は脚注に残した。
