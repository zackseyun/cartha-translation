  yaml_path: translation/ot/genesis/048/008.yaml
  text: When Israel saw Joseph's sons[a], he said[b], “Who are these?”
translation:
  language: ja
  text: イスラエル[a]はヨセフの息子たちを見て、「この人たちはだれか」と言った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では「イスラエル」となっている。ヤコブの別名。
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: 見て
  rationale: 物語を進めるワウ継続形を、後続する発言との時間的つながりが自然に伝わる連用形で表した。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 原文は「ヤコブ」ではなく契約名「イスラエル」を用いているため、そのまま保持した。
- source_word: אֶת
  choice: 訳出しない
  rationale: 直接目的語を示す標識であり、日本語で独立した訳語を必要としない。
- source_word: בְּנֵי יוֹסֵף
  choice: ヨセフの息子たち
  rationale: 連語の意味を明確かつ自然な現代日本語で表した。
- source_word: וַיֹּאמֶר
  choice: 尋ねた
  rationale: 字義的には「言った」だが、直接話法が質問であるため、文脈上自然な「尋ねた」とした。発話行為の意味は保たれる。
- source_word: מִי אֵלֶּה
  choice: この者たちは誰か
  rationale: 複数の人物の身元を問う表現。「この者たち」は指示対象が人であることを明確にし、簡潔で dignified な問いとして表した。
theological_decisions:
- issue: 族長の名の表記
  choice: イスラエル
  alternative: ヤコブ
  rationale: 解釈上の同一人物を示すために名を置換せず、この節で原文が意図的に用いる「イスラエル」を保持した。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「この者たち」は口語的すぎる「この人たち」を避けつつ、人物を指すことを明確にする。
