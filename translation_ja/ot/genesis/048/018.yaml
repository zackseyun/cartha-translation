  source_fidelity: ヘブライ語の発話導入、訂正（לֹא כֵן）、呼びかけ（אָבִי）、理由（כִּי）、指示語（זֶה）、身分語（הַבְּכֹר）、および右手を頭に置く命令を過不足なく伝えている。「こちらが長男です」は指示対象と長子性を明瞭にし、「この子の頭に」は文脈上の三人称接尾辞「彼の頭に」を自然な日本語にしている。
  naturalness: 明快な現代標準日本語として自然である。「そうではありません、父上」は強い訂正と敬意を両立し、「置いてください」も父に対するヨセフの依頼として無理がない。「右の手」は「右手」とも言えるが、不自然ではなく、左右の手の対照を保つ。
  terminology: הַבְּכֹר を「長男」とするのは、この文脈で自然かつ正確である。出生順位と家族内の地位を示す語を、原文にない長子権などの解釈を加えずに訳している。固有名ヨセフも標準的である。
