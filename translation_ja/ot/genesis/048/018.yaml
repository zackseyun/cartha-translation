id: GEN.48.18
reference: Genesis 48:18
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יוֹסֵ֛ף אֶל אָבִ֖י/ו לֹא כֵ֣ן אָבִ֑/י כִּי זֶ֣ה הַ/בְּכֹ֔ר שִׂ֥ים יְמִינְ/ךָ֖ עַל רֹאשֽׁ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/018.yaml
  text: And Joseph said to his father, “Not so, my father, for this one is the firstborn. Put your right hand on his head.”
translation:
  language: ja
  text: ヨセフは父に言った。「そうではありません、父上。こちらが長男です。右の手をこの子の頭に置いてください。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語を進める連続形。日本語では文脈上、接続詞を補わず「言った」とするのが自然である。
- source_word: אֶל אָבִיו
  choice: 父に
  rationale: אֶל の方向性と三人称男性単数接尾辞を、自然な現代日本語で表した。
- source_word: לֹא כֵן
  choice: そうではありません
  rationale: 相手の行為を正す抗議を表す慣用句。父への敬意を保ちつつ、直接的な訂正を明確にした。
- source_word: אָבִי
  choice: 父上
  rationale: 一人称単数接尾辞を伴う呼びかけ。日本語では「私の父」より「父上」が自然で、ヨセフの敬意も表せる。
- source_word: כִּי
  choice: （独立した説明文として表現）
  rationale: 理由・説明を導く語。日本語では「というのも」を明示せず、続く「こちらが長男です」で自然に理由を示した。
- source_word: זֶה
  choice: こちら
  rationale: 目の前の息子を指し示す指示性を保持し、人をぞんざいに扱わない自然な表現とした。
- source_word: הַבְּכֹר
  choice: 長男
  rationale: この場面ではヨセフの二人の息子のうち先に生まれた男子を指す。現代日本語として自然で、家族内の出生順位と身分を表す。
- source_word: שִׂים
  choice: 置いてください
  rationale: 命令形の直接性を保ちながら、父に対する息子の丁寧な依頼として自然に表した。
- source_word: יְמִינְךָ
  choice: 右の手
  rationale: 祝福の所作である右手を明示する。「右手」よりも左右の手の対照をやや明瞭にする表現を選んだ。
- source_word: עַל רֹאשׁוֹ
  choice: この子の頭に
  rationale: 三人称接尾辞の指示対象を日本語で明確にし、直前の「こちら」を自然に受けた。
theological_decisions:
- issue: 祝福の文脈における הַבְּכֹר の身分語
  choice: 長男
  alternative: 初子
  rationale: הַבְּכֹר は出生順位だけでなく家族内の身分を帯びるが、「初子」は現代の一般読者には硬く不自然になりやすい。この箇所では男性の子であることが明白なので「長男」が意味と可読性を両立する。長子権そのものを付加して訳すことは避けた。
translation_notes:
  register: 明瞭で現代的ながら品位ある会話文。「父上」と丁寧な依頼形により、ヨセフの強い訂正と父への敬意を両立させた。原文にない接続語や神学的説明は加えていない。
