source:
  edition: WLC
  text: וַ/יַּ֣רְא יוֹסֵ֗ף כִּי יָשִׁ֨ית אָבִ֧י/ו יַד יְמִינ֛/וֹ עַל רֹ֥אשׁ אֶפְרַ֖יִם וַ/יֵּ֣רַע בְּ/עֵינָ֑י/ו וַ/יִּתְמֹ֣ךְ יַד אָבִ֗י/ו לְ/הָסִ֥יר אֹתָ֛/הּ מֵ/עַ֥ל רֹאשׁ אֶפְרַ֖יִם עַל רֹ֥אשׁ מְנַשֶּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/017.yaml
  text: When Joseph saw that his father had placed his right hand on Ephraim’s head[a], it was displeasing in his eyes, and he took hold of his father’s hand to remove it from Ephraim’s head to Manasseh’s head.
translation:
  language: ja
  text: ヨセフは、父が右手をエフライムの頭に置いたのを見て、不快に思った[a]。そこで父の手をつかみ、エフライムの頭からマナセの頭へ移そうとした。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「彼の目に悪かった」。つまり、ヨセフには好ましく思えなかったということ。
    reason: ヘブライ語の身体表現を用いた慣用句を示しつつ、文脈上の意味を明確にするため。
lexical_decisions:
- source_word: וַיַּרְא ... כִּי
  choice: …のを見て
  rationale: כִּיを見た内容を導く語として取り、物語の進行とヨセフの反応の時間的つながりを自然な日本語で表した。
- source_word: יָשִׁית
  choice: 置いた
  rationale: 「置く、据える」の意味。文脈上、ヨセフが父の手の位置を見て取ったことを簡潔に表す。
- source_word: יַד יְמִינוֹ
  choice: 右手
  rationale: 祝福における左右の区別が重要なため、具体的な身体表現を保持した。
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: 不快に思った[a]
  rationale: 直訳的には「彼の目に悪かった」だが、ここでは道徳的悪の断定ではなく、ヨセフが好ましくないと感じたことを表す自然な日本語とした。原文の身体的慣用表現は脚注で示した。
- source_word: וַיִּתְמֹךְ
  choice: つかみ
  rationale: תמךには「支える、つかむ」の幅がある。この場面では手を別の位置へ動かそうとする具体的動作なので「つかむ」としたが、過度な強制力を含ませていない。
- source_word: לְהָסִיר אֹתָהּ
  choice: 移そうとした
  rationale: הסירの「取り除く、そらす」を、手を一方の頭から他方へ移すという目的に即して表現した。不定詞の目的用法と、意図された動作であることを自然に示す。
- source_word: מֵעַל רֹאשׁ אֶפְרַיִם עַל רֹאשׁ מְנַשֶּׁה
  choice: エフライムの頭からマナセの頭へ
  rationale: 手の移動元と移動先を明確にし、原文の方向性を保持した。
theological_decisions: []
translation_notes:
  register: 現代の一般読者に明瞭な標準語を用いた。二つの動作を二文に分けて読みやすくしつつ、祝福の手をエフライムからマナセへ移そうとするヨセフの意図を保持した。固有名は一般的な聖書表記の「エフライム」「マナセ」とした。
