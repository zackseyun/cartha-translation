  text: וַ/יּוֹצֵ֥א יוֹסֵ֛ף אֹתָ֖/ם מֵ/עִ֣ם בִּרְכָּ֑י/ו וַ/יִּשְׁתַּ֥חוּ לְ/אַפָּ֖י/ו אָֽרְצָ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/012.yaml
  text: Then Joseph brought them out from between his knees[a], and he bowed with his face to the ground.
translation:
  language: ja
  text: それからヨセフは、二人をヤコブの膝の間から連れ出し[a]、顔を地につけてひれ伏した。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「ヤコブの膝もとから」。ヘブライ語の表現は、祝福を受ける二人がヤコブのすぐそばにいたことを描いている可能性がある。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: 連れ出し
  rationale: ヒフィル形の使役的な意味を踏まえ、ヨセフが二人をヤコブのそばにいた位置から移動させたことを、自然な日本語で表した。
- source_word: אֹתָם
  choice: 二人を
  rationale: 目的語はエフライムとマナセを指すため、日本語では指示対象が明確になる「二人」とした。
- source_word: מֵעִם בִּרְכָּיו
  choice: ヤコブの膝の間から
  rationale: 前置詞は字義的には「～と共にいる所から／～のそばから」だが、文脈上、祝福を受ける二人がヤコブのごく近く、膝の間にいた情景を表すと理解した。別の位置関係も脚注に残した。
- source_word: וַיִּשְׁתַּחוּ
  choice: ひれ伏した
  rationale: 敬意を表して深く身をかがめる動作を示す。後続の「顔を地につけて」と合わせ、姿勢を明瞭に伝える。
- source_word: לְאַפָּיו אָרְצָה
  choice: 顔を地につけて
  rationale: 顔を地面の方へ向ける深い拝礼を、簡潔で自然な現代日本語にした。
theological_decisions:
- issue: 「彼の膝」の所有者
  choice: ヤコブの膝
  alternative: ヨセフの膝
  rationale: 直前までヤコブが二人を自分の近くに引き寄せている場面であり、ヨセフが息子たちをそこから離した後に敬意を表してひれ伏す流れから、接尾辞はヤコブを指すと判断した。これは文脈上の代名詞解釈であり、教義上の判断ではない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「ひれ伏した」によって敬意を伴う深い拝礼を表し、位置関係に残る語義上の幅は脚注で示した。
