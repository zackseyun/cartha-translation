  text: וּ/מוֹלַדְתְּ/ךָ֛ אֲשֶׁר הוֹלַ֥דְתָּ אַחֲרֵי/הֶ֖ם לְ/ךָ֣ יִהְי֑וּ עַ֣ל שֵׁ֧ם אֲחֵי/הֶ֛ם יִקָּרְא֖וּ בְּ/נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/006.yaml
  text: But your offspring whom you father after them will be yours[b][a]; they will be called by the name of their brothers in their inheritance.
translation:
  language: ja
  text: しかし、あなたが彼らの後にもうける子どもたちは、あなたのものとなる。相続地を受ける際には、彼らは兄たちの名で呼ばれる。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמוֹלַדְתְּךָ
  choice: あなたがもうける子孫
  rationale: 「生まれた者、もうけた者」を指す語を、後に生まれる者たちを広く表せる自然な日本語「子孫」で訳した。直後の動詞と合わせ、父であるヨセフの観点を保った。
- source_word: הוֹלַדְתָּ
  choice: もうける
  rationale: ' ילד のヒフィル形で、男性であるヨセフが子を生ませる、すなわち父となることを表す。現代日本語では「もうける」が簡潔で自然。'
- source_word: אַחֲרֵיהֶם
  choice: 彼らの後に
  rationale: エフライムとマナセの後に生まれることを直接的に表し、原文の代名詞も保持した。
- source_word: לְךָ יִהְיוּ
  choice: あなたのものとなる
  rationale: エフライムとマナセがヤコブの子として扱われることとの対比で、後の子らはヨセフに属するという家族的・法的関係を表す。
- source_word: עַל שֵׁם אֲחֵיהֶם
  choice: 兄たちの名で
  rationale: 後の子らがエフライムまたはマナセの名のもとに位置づけられることを示す。「兄たち」を保ち、説明的な言い換えは脚注に委ねた。
- source_word: אֲחֵיהֶם
  choice: 兄たち
  rationale: 文脈上、先に挙げられたエフライムとマナセを指す。日本語では出生順が明らかなため「兄たち」が自然であり、原文の家族関係も保持する。
- source_word: יִקָּרְאוּ
  choice: 呼ばれる
  rationale: קרא のニファル形の基本義を保った。相続上「名のもとに数えられる」という含みはあるが、本文では解釈を過度に明示しない。
- source_word: בְּנַחֲלָתָם
  choice: その相続地では
  rationale: נַחֲלָה の土地の割り当てという文脈を明確にしつつ、三人称複数接尾辞の指示対象を日本語で不自然に固定しすぎないよう「その」とした。
theological_decisions:
- issue: 後に生まれる子らの部族上の地位
  choice: 本文では「兄たちの名で呼ばれる」と原文に即して表現し、相続上の意味を脚注で説明する。
  alternative: 「兄たちの部族に組み入れられる」と本文で明示する。
  rationale: 文脈上は独立した部族相続を得ず、エフライムとマナセの名のもとに数えられる趣旨だが、原文は「呼ばれる」という表現を用いるため、その比喩的・法的な含みを本文で一義的に言い切らない。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、家族関係と相続に関する荘重さを保った。「子孫」「相続地」は聖書文脈で一般読者にも理解しやすい語として採用した。
