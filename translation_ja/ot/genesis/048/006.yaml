  to: しかし、あなたが彼らの後にもうける子どもたちは、あなたのものとなる。相続地を受ける際には、彼らは兄たちの名で呼ばれる。
  rationale: 本文では、後に生まれるヨセフの子らを指す語を「子どもたち」として範囲を適切に保ち、相続に関する句を自然な現代日本語に整えた。「兄たちの名で呼ばれる」は、名づけと部族上の算入の両方を含み得る原文の表現を保持している。脚注は本文の語彙上の代案と相続上の背景説明を示す。
