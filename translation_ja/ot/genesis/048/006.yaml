  source_fidelity: ヘブライ語は、エフライムとマナセの後にヨセフがもうける子らはヨセフに属し、相続に関して兄たちの名によって呼ばれる、と述べる。草案の基本的理解は適切である。ただし「子孫」は後代の子孫まで含み得るため、この文脈で直接指す後の子どもたちには「子どもたち」のほうが正確である。また「その相続地では」は指示対象と法的・配分上の文脈がやや曖昧である。
  naturalness: 「彼らの後にあなたがもうける子孫」は理解できるが、語順と「子孫」の語感のため、現代日本語としては「あなたが彼らの後にもうける子どもたち」のほうが明瞭である。「相続地を受ける際には」は、原文の『その相続において』を自然に表す。
  terminology: 「相続地」「兄たちの名で呼ばれる」は適切であり、部族的な帰属を本文で過度に言い換えない方針も妥当である。注bは原文の複数の兄たちに対応して「エフライムとマナセの名のもとに」とするのがより正確である。
