base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/011.yaml
  text: And Israel said to Joseph[a], “I did not expect to see your face, and behold, God has let me see even your offspring.”
translation:
  language: ja
  text: イスラエルはヨセフに言った。「あなたの顔を見られるとは、思ってもみなかった。見よ、神はあなたの子どもたちまで私に見せてくださった。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר יִשְׂרָאֵל אֶל יוֹסֵף
  choice: イスラエルはヨセフに言った
  rationale: 本文の名「イスラエル」をそのまま保ち、物語を進める標準的な叙述として訳した。
- source_word: רְאֹה פָנֶיךָ
  choice: おまえの顔を見られる
  rationale: 「直接会う」という慣用的意味を持つが、ヘブライ語の具体的で情感のある「顔を見る」という表現を自然な日本語で保持した。
- source_word: לֹא פִלָּלְתִּי
  choice: 思ってもみなかった
  rationale: ここでの動詞は祈ることではなく、予想・期待することを表す。再会を全く予期していなかった驚きを自然に伝える。
- source_word: וְהִנֵּה
  choice: それなのに、見よ
  rationale: 予想を超えた展開と驚きを示す談話標識を保持した。「それなのに」で論理的な転換を明らかにし、「見よ」で原文の強調を残した。
- source_word: הֶרְאָה אֹתִי אֱלֹהִים
  choice: 神は……私に見せてくださった
  rationale: ראהの使役形を「見せる」で表し、神から与えられた恵みとしての文脈に合う敬意を「くださった」に込めた。
- source_word: גַּם אֶת זַרְעֶךָ
  choice: おまえの子孫まで
  rationale: גםの追加的な驚きを助詞「まで」で表した。זרעは集合的単数であり、目前の息子たちを含みつつ語義の広がりを保つ「子孫」とした。
theological_decisions:
- issue: 族長物語における אֱלֹהִים の訳語
  choice: 神
  alternative: 神さま
  rationale: 固有名יהוהではなく一般的な神称であるため、現代標準日本語の聖書文体として自然で荘重な「神」とした。
- issue: 神の使役行為の敬語表現
  choice: 見せてくださった
  alternative: 見せた
  rationale: 原文の使役形そのものを越えて教理を付加せず、話者が神の恵みとして受け止めている文脈を日本語として自然な授受補助動詞で表した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、族長の発話にふさわしい品位を保った。「おまえ」は年老いた父が息子に語る関係を自然に示し、「顔を見る」「見よ」は原文の具体性と修辞的強調を残すために採用した。
