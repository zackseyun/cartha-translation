source:
  edition: WLC
  text: וְ/עַתָּ֡ה שְׁנֵֽי בָנֶי/ךָ֩ הַ/נּוֹלָדִ֨ים לְ/ךָ֜ בְּ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּאִ֥/י אֵלֶ֛י/ךָ מִצְרַ֖יְמָ/ה לִ/י הֵ֑ם אֶפְרַ֨יִם֙ וּ/מְנַשֶּׁ֔ה כִּ/רְאוּבֵ֥ן וְ/שִׁמְע֖וֹן יִֽהְיוּ לִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/005.yaml
  text: And now[a], your two sons, who were born to you in the land of Egypt before I came to you in Egypt, are mine; Ephraim and Manasseh shall be mine[c][b], like Reuben and Simeon.
translation:
  language: ja
  text: さて、私がエジプトにいるあなたのもとに来る前に、エジプトの地であなたに生まれたあなたの二人の息子、エフライムとマナセは、私のものだ。ルベンとシメオンのように、彼らは私のものとなる。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: エフライムとマナセが、ルベンやシメオンと同じように、ヤコブ自身の息子として数えられるという意味。
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: さて
  rationale: 話の展開を示し、ヤコブが新たな宣言に移ることを自然な現代日本語で表す。
- source_word: שְׁנֵי בָנֶיךָ הַנּוֹלָדִים לְךָ
  choice: あなたの二人の息子、すなわち……あなたに生まれた
  rationale: 人数、所有関係、誕生の関係を保ちつつ、日本語として修飾関係が明確になるように構成した。
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: エジプトの地で
  rationale: 原文に明示された「地」を保持する。
- source_word: עַד בֹּאִי אֵלֶיךָ מִצְרָיְמָה
  choice: 私がエジプトのあなたのもとに来る前に
  rationale: עַד の字義的な「～まで」ではなく、文脈上、ヤコブ到着以前に生まれた息子たちを限定する時間関係を明瞭にした。場所名の反復は原文に従って保持した。
- source_word: לִי הֵם
  choice: 私のものとなる
  rationale: ヤコブ自身の息子として数えるという宣言を、技術的な養子縁組用語を加えずに表した。後続の יִהְיוּ לִי とそろえ、宣言全体を自然にした。
- source_word: אֶפְרַיִם וּמְנַשֶּׁה
  choice: エフライムとマナセ
  rationale: 日本語聖書で広く通用する固有名の表記を用いた。
- source_word: כִּרְאוּבֵן וְשִׁמְעוֹן
  choice: ルベンやシメオンと同じように
  rationale: 比較を表す כְּ を明確にし、両者と同等の息子としての地位を示す。
- source_word: יִהְיוּ לִי
  choice: 私のものとなる
  rationale: 厳かな身分宣言として訳し、単なる所有物という意味に限定されないよう文脈と注で補った。
theological_decisions:
- issue: エフライムとマナセに対するヤコブの宣言の性質
  choice: 「私のものとなる」と訳し、ヤコブ自身の息子として数えられることを注で説明する。
  alternative: 「私は彼らを養子にする」と明示する。
  rationale: 原文は技術的な「養子」の語を用いず、「彼らは私のもの」「ルベンやシメオンのように」と述べる。したがって、その法的・家族的効果は示しつつ、仕組みを本文で過度に特定しない。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。「私のもの」は原文の簡潔な宣言を保ち、物品的な所有との誤解を避けるため注を付した。原文にある「エジプト」の反復も保持した。
