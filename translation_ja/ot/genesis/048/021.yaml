  text: וַ/יֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְ/הָיָ֤ה אֱלֹהִים֙ עִמָּ/כֶ֔ם וְ/הֵשִׁ֣יב אֶתְ/כֶ֔ם אֶל אֶ֖רֶץ אֲבֹתֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/021.yaml
  text: Then Israel said to Joseph[a], “Behold, I am about to die[b], but God will be with you and will bring you back to the land of your fathers.”
translation:
  language: ja
  text: イスラエルはヨセフに言った。「見なさい。私はまもなく死ぬ。しかし、神はあなたがたと共におられ、あなたがたを父祖の地へ連れ戻してくださる。」[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「あなたがたと共に」「あなたがたを……連れ戻す」の「あなたがた」は、ヘブライ語では複数形です。ヨセフだけでなく、彼に関わる複数の人々を含む呼びかけです。本文はその範囲を具体的に特定していません。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: ワウ継続法による物語の進行は、日本語では文脈上自然な「言った」で表した。
- source_word: יִשְׂרָאֵל
  choice: イスラエル
  rationale: 原文がヤコブではなく契約名「イスラエル」を用いているため、そのまま保持した。
- source_word: הִנֵּה
  choice: 見よ
  rationale: 注意を促す談話標識の働きを、現代日本語でも理解可能な格調ある表現で示した。
- source_word: אָנֹכִי מֵת
  choice: 私は間もなく死ぬ
  rationale: 分詞表現は完了した死ではなく、差し迫った死を指すため。
- source_word: וְהָיָה אֱלֹהִים עִמָּכֶם
  choice: しかし、神はあなたがたと共にいて
  rationale: 接続詞は形式上「そして」だが、イスラエルの死と神の変わらぬ臨在との文脈的対照を「しかし」で表した。
- source_word: עִמָּכֶם
  choice: あなたがたと共に
  rationale: 接尾代名詞が複数形であることを明示し、約束がヨセフ個人だけに限定されないことを保持した。
- source_word: וְהֵשִׁיב אֶתְכֶם
  choice: あなたがたを……連れ戻してくださる
  rationale: שׁוב のヒフィル形が持つ使役的な意味を自然な日本語で表し、複数形も明示した。
- source_word: אֶל אֶרֶץ אֲבֹתֵיכֶם
  choice: 父祖たちの地へ
  rationale: イスラエルの族長たちに結びつく先祖伝来の地を指すため、「先祖」より聖書的文脈に適した「父祖」を採用した。
theological_decisions:
- issue: 約束における複数形代名詞の指示範囲
  choice: 「あなたがた」と訳し、ヨセフを越えてその家族または子孫に及ぶ約束として保持する。
  alternative: 日本語でヨセフ一人への呼びかけとして「あなた」と訳す。
  rationale: 後半二節の接尾代名詞はいずれも複数形であり、原文の契約的・共同体的な広がりを明示する必要がある。
- issue: 「神はあなたがたと共にいる」の前の接続詞の談話機能
  choice: 対照を表す「しかし」と訳す。
  alternative: 形式的に「そして」と訳す。
  rationale: ヘブライ語の接続詞そのものは単純接続にもなり得るが、ここではイスラエルが死ぬ一方で神は彼らと共におられるという対照が文脈上明瞭である。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、「見よ」「父祖」によって創世記の厳粛な語調を保った。「あなたがた」で原文の複数形を明示した。
