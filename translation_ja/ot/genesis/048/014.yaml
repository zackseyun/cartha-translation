  edition: WLC
  text: וַ/יִּשְׁלַח֩ יִשְׂרָאֵ֨ל אֶת יְמִינ֜/וֹ וַ/יָּ֨שֶׁת עַל רֹ֤אשׁ אֶפְרַ֨יִם֙ וְ/ה֣וּא הַ/צָּעִ֔יר וְ/אֶת שְׂמֹאל֖/וֹ עַל רֹ֣אשׁ מְנַשֶּׁ֑ה שִׂכֵּל֙ אֶת יָדָ֔י/ו כִּ֥י מְנַשֶּׁ֖ה הַ/בְּכֽוֹר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/014.yaml
  text: Then Israel stretched out his right hand and placed it on Ephraim’s head[a], though he was the younger, and his left hand on Manasseh’s head, crossing his hands, for Manasseh was the firstborn.
translation:
  language: ja
  text: イスラエルは右手を伸ばして年下であったエフライムの頭に置き、左手をマナセの頭に置いた。マナセが長子であったため、意図して両手を交差させた[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「両手を巧みに導いた」。ヘブライ語の表現は、意図的で巧みな手の置き方を強調することがある。この文脈では、両手を交差させたことを指す。
    reason: 語義上の別訳を示し、「交差させた」という文脈的解釈の根拠と原語の含みを保つため。
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: 伸ばして
  rationale: 手を物理的に差し伸べる場面なので、「遣わす」ではなく自然な動作表現とした。
- source_word: וַיָּשֶׁת
  choice: 置き
  rationale: 祝福のために手を頭の上に置く、意図的な動作を明確に表す。
- source_word: וְהוּא הַצָּעִיר
  choice: 年下のエフライム
  rationale: エフライムが若い方であることを簡潔に示し、右手を受けたこととの対比を保つ。
- source_word: שִׂכֵּל אֶת יָדָיו
  choice: 両手を意図して交差させた
  rationale: 語形には思慮深く、巧みに手を導く含みがあるが、直前の左右の手の配置から、意図的に交差させた動作を指すと判断した。
- source_word: כִּי
  choice: ので
  rationale: マナセが長子であることを、通常とは異なる手の配置を説明する理由としてつなぐ。
- source_word: הַבְּכֹר
  choice: 長子
  rationale: 単なる年長者ではなく、祝福と相続に関わる出生順位の文化的意味を保持する。
theological_decisions:
- issue: שִׂכֵּל אֶת יָדָיו の解釈
  choice: ヤコブは意図して両手を交差させた。
  alternative: ヤコブは両手を巧みに、または思慮深く導いた。
  rationale: 右手が年下のエフライムに、左手が長子マナセに置かれたという直前の描写は、手を交差させた理解を強く支持する。一方、行為の意図性という語の含みも訳文と脚注で残し、長子の順序の逆転を後代の教理によって説明しない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、物語として自然でありながら威厳を保った。「右手」「左手」「長子」を明示して、祝福における意図的な配置と出生順位の緊張を伝える。
