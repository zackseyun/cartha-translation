  text: וַ/יֹּ֣אמֶר אֵלַ֗/י הִנְ/נִ֤י מַפְרְ/ךָ֙ וְ/הִרְבִּיתִ֔/ךָ וּ/נְתַתִּ֖י/ךָ לִ/קְהַ֣ל עַמִּ֑ים וְ/נָ֨תַתִּ֜י אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את לְ/זַרְעֲ/ךָ֥ אַחֲרֶ֖י/ךָ אֲחֻזַּ֥ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/004.yaml
  text: And he said to me, ‘Look, I will make you fruitful and multiply you, and I will make you into an assembly of peoples, and I will give this land to your offspring after you as an everlasting possession.’
translation:
  language: ja
  text: そして私に言われた。『見よ、私はあなたに子をもうけさせ、あなたを増やし、あなたを諸民族の集まりとする。私はこの地を、あなたの後に続く子孫に、永遠の所有地として与える。』
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: 見よ、私は
  rationale: 話者の宣言に注意を促す表現として、荘重さを保ちつつ現代日本語でも理解できる形にした。
- source_word: מַפְרְךָ
  choice: あなたに子を生ませ
  rationale: פרהの使役形が表す繁殖・多産の意味を明示し、後続の「増やし」との違いを保った。
- source_word: לִקְהַל עַמִּים
  choice: 諸民族の集まりとする
  rationale: קהלを「集まり」、עמיםを複数の「諸民族」と訳し、単一民族に限定しない原文の幅を保持した。
- source_word: לְזַרְעֲךָ אַחֲרֶיךָ
  choice: あなたの後の子孫に
  rationale: זרעの集合的用法を自然な日本語の「子孫」で表し、אַחֲרֶיךָの継承の意味も残した。
- source_word: אֲחֻזַּת עוֹלָם
  choice: 永遠の所有地として
  rationale: אֲחֻזָּהの保持される土地・領有地という意味と、עוֹלָםの継続性を簡潔に表した。
theological_decisions:
- issue: 「永遠」の時間的範囲
  choice: 永遠の
  alternative: 代々にわたる／いつまでも続く
  rationale: עוֹלָםの解釈上の幅を訳文で限定せず、伝統的かつ直接的な対応語を用いた。
- issue: 「諸民族の集まり」の指示対象
  choice: 解釈を加えず字義的に訳す
  alternative: 多くの国民／諸部族の共同体
  rationale: 民族・部族・国家などの具体的同定を本文に持ち込まず、原文の神学的な広がりを保持した。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、神の約束の荘重な調子を保った。引用内では反復構造を維持し、過度に古風な表現は避けた。
