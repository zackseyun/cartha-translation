  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יְבָ֥רֶךְ אֶת יוֹסֵ֖ף וַ/יֹּאמַ֑ר הָֽ/אֱלֹהִ֡ים אֲשֶׁר֩ הִתְהַלְּכ֨וּ אֲבֹתַ֤/י לְ/פָנָי/ו֙ אַבְרָהָ֣ם וְ/יִצְחָ֔ק הָֽ/אֱלֹהִים֙ הָ/רֹעֶ֣ה אֹתִ֔/י מֵ/עוֹדִ֖/י עַד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/015.yaml
  text: And he blessed Joseph and said[a], “The God before whom my fathers Abraham and Isaac walked[b], the God who has shepherded me from my beginning to this day,”
translation:
  language: ja
  text: 'そして彼はヨセフを祝福して言った。


    「私の先祖アブラハムとイサクがその御前を歩んだ[a]神、


    私の生涯の初めから今日まで、羊飼いとして私を養ってこられた[b]神、」'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳的には「その御前を歩いた」。神の前で、神との関係の中に生きたことを表す言い方。
    reason: ヘブライ語の比喩的慣用表現を説明するため。
  - marker: b
    text: 「私の羊飼いであられた」または「私を養ってこられた」とも訳せる。原語には、羊飼いが継続して世話をし、養うイメージがある。
    reason: 牧羊を表す語の比喩と意味の幅を示すため。
lexical_decisions:
- source_word: וַיְבָרֶךְ אֶת יוֹסֵף
  choice: 彼はヨセフを祝福して
  rationale: ヘブライ語は文脈上ヨセフの息子たちが祝福を受ける場面であっても、明示的に「ヨセフを」と述べているため、そのまま保持した。
- source_word: הָאֱלֹהִים
  choice: 神
  rationale: ヘブライ語の定冠詞が示す特定性は、後続する関係節によって日本語でも明確になる。「その神」を重ねるより自然で荘重な呼びかけとなる。
- source_word: אֲשֶׁר הִתְהַלְּכוּ אֲבֹתַי לְפָנָיו
  choice: 私の先祖…がその御前を歩んだ
  rationale: 神の臨在のもとで生きるという契約的・関係的な比喩を保ち、単に「従った」と解釈し切らない。
- source_word: אַבְרָהָם וְיִצְחָק
  choice: アブラハムとイサク
  rationale: 現代日本語聖書で広く定着した固有名表記を用いた。
- source_word: הָרֹעֶה אֹתִי
  choice: 私を牧してこられた
  rationale: 分詞の継続的な力と羊飼いの比喩を保つ。「養った」だけに狭めず、世話・導き・糧の備えを含む表現とした。
- source_word: מֵעוֹדִי
  choice: 私の生涯の初めから
  rationale: 存在の始まり以来という幅を保ち、「若い時から」や特定の出生時点に限定しない、明瞭な日本語とした。
- source_word: עַד הַיּוֹם הַזֶּה
  choice: 今日まで
  rationale: 始まりから現在まで続く神の配慮を自然な現代日本語で表した。
theological_decisions:
- issue: 神の御前を歩むという族長物語の表現
  choice: その御前を歩んだ
  alternative: その御前で生きた／その神に従った
  rationale: 神との関係の中で生きるという比喩的な広がりを保持し、服従という一側面だけに限定しないため。
- issue: 神を羊飼いとして描く比喩
  choice: 私を牧してこられた
  alternative: 私の羊飼いであられた／私を養ってこられた
  rationale: 原文の能動的な牧羊のイメージと、過去から現在まで継続する世話を保持するため。
- issue: מֵעוֹדִי が指す時点
  choice: 私の生涯の初めから
  alternative: 私が生まれた時から／私の生涯を通じて
  rationale: 語句が示す存在の最初期という意味を伝えつつ、出生という一点への過度な限定も、「生涯を通じて」という時間幅への平板化も避けた。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、族長の祝福にふさわしい荘重さを保った。「御前」「牧する」は聖書的比喩を残すために用い、脚注で意味を補った。原文では祝福の言葉が次節へ続くため、末尾を読点で閉じた。
