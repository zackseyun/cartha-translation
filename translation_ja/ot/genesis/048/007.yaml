id: GEN.48.7
reference: Genesis 48:7
language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/אֲנִ֣י בְּ/בֹאִ֣/י מִ/פַּדָּ֗ן מֵ֩תָה֩ עָלַ֨/י רָחֵ֜ל בְּ/אֶ֤רֶץ כְּנַ֨עַן֙ בַּ/דֶּ֔רֶךְ בְּ/ע֥וֹד כִּבְרַת אֶ֖רֶץ לָ/בֹ֣א אֶפְרָ֑תָה וָ/אֶקְבְּרֶ֤/הָ שָּׁם֙ בְּ/דֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/007.yaml
  text: As for me[a], when I came from Paddan, Rachel died to my sorrow in the land of Canaan on the way, while there was still some distance to go to Ephrath; and I buried her there on the way to Ephrath (that is[c][b], Bethlehem).
translation:
  language: ja
  text: さて、私がパダン[a]から来たとき、カナンの地で、旅の途中、ラケルは私のそばで[b]死んだ。エフラタまではまだいくらか道のりが残っていた[c]。私はそこで、エフラタへの道沿いに彼女を葬った。エフラタとはベツレヘムのことである。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語本文は「パダン」。関連する箇所に基づいて「パダン・アラム」とする訳もあるが、ここでは「パダン」とだけ記されている。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私の上で（または、私にかかって）死んだ」。ラケルがヤコブのそばで死んだこととも、その死がヤコブに与えた個人的な重みや悲しみとも理解できる。
    reason: lexical_alternative
  - marker: c
    text: 「いくらか道のり」は、ある長さの土地または残された道のりを表すヘブライ語の言い回し。正確な距離は分からない。
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲנִי
  choice: さて、私が
  rationale: 独立代名詞による話題の転換とヤコブ自身の回想への移行を、自然な現代日本語で示した。
- source_word: מִפַּדָּן
  choice: パダン
  rationale: 本文は「パダン・アラム」ではなく「パダン」とだけ記すため、関連箇所から補わず原文どおりにした。
- source_word: מֵתָה עָלַי
  choice: 私のそばで死んだ
  rationale: 直訳的には「私の上で／私にかかって死んだ」という表現であり、ヤコブの身近で起きた死という意味を本文に採りつつ、悲しみや個人的重荷を強調する可能性は脚注に残した。
- source_word: בְּעוֹד כִּבְרַת אֶרֶץ לָבֹא אֶפְרָתָה
  choice: エフラタまではまだいくらか道のりが残っていた
  rationale: כִבְרַת אֶרֶץ は一定の道のりを表すが正確な距離は不明なので、数量を断定しない自然な表現とした。
- source_word: בְּדֶרֶךְ אֶפְרָת
  choice: エフラタへの道沿いに
  rationale: 旅程上の場所を示す表現として、現代日本語で明瞭かつ原文に近い言い方を選んだ。
- source_word: הִוא בֵּית לָחֶם
  choice: エフラタとはベツレヘムのことである
  rationale: 指示代名詞がエフラタをベツレヘムと同定する説明句であることを明確にした。
