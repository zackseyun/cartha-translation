  text: וַ/יֹּ֤אמֶר יַעֲקֹב֙ אֶל יוֹסֵ֔ף אֵ֥ל שַׁדַּ֛י נִרְאָֽה אֵלַ֥/י בְּ/ל֖וּז בְּ/אֶ֣רֶץ כְּנָ֑עַן וַ/יְבָ֖רֶךְ אֹתִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/003.yaml
  text: And Jacob said to Joseph[a], “God Almighty appeared to me at Luz in the land of Canaan and blessed me,”
translation:
  language: ja
  text: ヤコブはヨセフに言った。「全能の神[a]がカナンの地のルズで私に現れ、私を祝福してくださった。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では「エル・シャダイ」。伝統的に「全能の神」と訳されるが、「シャダイ」の厳密な意味については議論がある。
    reason: 神の称号の原語と、その語義に残る不確かさを示すため。
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: 言った
  rationale: 物語の流れを示す接続形であり、日本語では文脈上明らかな連続性を過度に明示せず、「言った」とするのが自然である。
- source_word: אֵל שַׁדַּי
  choice: 全能の神
  rationale: 神の称号として、日本語聖書で広く理解される伝統的な訳語を用いた。ただし、שַׁדַּי の厳密な意味には議論があるため、原語表記を脚注に残した。
- source_word: נִרְאָה אֵלַי
  choice: 私に現れ
  rationale: 神がヤコブに姿を現したことを表す。原文に明示されない「ご自身を」などを補わず、自然な日本語で訳した。
- source_word: בְּלוּז
  choice: ルズで
  rationale: 出来事が起きた場所を示すため、地名に場所の助詞「で」を付した。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地の
  rationale: 原文の「地」を保持しつつ、ルズの所在を自然な日本語で示した。
- source_word: וַיְבָרֶךְ אֹתִי
  choice: 私を祝福してくださった
  rationale: 同じ神を主語とする動作を自然に続けた。敬意を表す補助動詞は、日本語で神の行為を述べる際の自然で品位ある表現であり、行為の内容自体は加えていない。
theological_decisions:
- issue: 神の称号 אֵל שַׁדַּי の訳し方
  choice: 全能の神
  alternative: エル・シャダイ
  rationale: 称号の意味を読者に伝えるため本文では伝統的な訳語を採用した。一方、שַׁדַּי の語義は確定していないため、音写と意味上の不確かさを脚注で示し、曖昧さを隠さないようにした。
translation_notes:
  register: 明快で現代的な標準日本語を用いながら、族長の語りにふさわしい簡潔さと品位を保った。発話導入は自然な叙述とし、神の称号には脚注標識を直接付した。
