source:
  edition: WLC
  text: הַ/מַּלְאָךְ֩ הַ/גֹּאֵ֨ל אֹתִ֜/י מִ/כָּל רָ֗ע יְבָרֵךְ֮ אֶת הַ/נְּעָרִים֒ וְ/יִקָּרֵ֤א בָ/הֶם֙ שְׁמִ֔/י וְ/שֵׁ֥ם אֲבֹתַ֖/י אַבְרָהָ֣ם וְ/יִצְחָ֑ק וְ/יִדְגּ֥וּ לָ/רֹ֖ב בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/016.yaml
  text: The angel who has redeemed me from all evil[a], may he bless the boys; and may my name and the name of my fathers Abraham and Isaac be called on them[e][d][c][b]; and may they multiply greatly in the midst of the land.
translation:
  language: ja
  text: あらゆる災いから私を贖い出してくださった御使いが[a]、この子たちを祝福してくださるように。 この子たちが、私の名と、私の父祖アブラハムとイサクの名をもって呼ばれるように[b]。彼らが地のただ中で、おびただしく増えるように[c][d]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「災い」は、「害」「苦難」「悪」とも訳せる。ヘブライ語は、道徳的な悪だけでなく、災厄や不幸も含み得る。
    reason: lexical_alternative
  - marker: b
    text: 直訳は「私の名と、私の父祖アブラハムとイサクの名が、彼らの上に呼ばれるように」。この表現は、彼らがそれらの名を帯び、その家系に属することを表す。
    reason: lexical_alternative
  - marker: c
    text: 「おびただしく増える」と訳したヘブライ語の動詞は珍しく、魚のように豊かに増えるイメージを響かせている可能性がある。
    reason: lexical_alternative
  - marker: d
    text: 「地」は「土地」「大地」「地上」とも訳せる。
    reason: alternative_reading
lexical_decisions:
- source_word: הַמַּלְאָךְ
  choice: 御使い
  rationale: מַלְאָךְには「使者」と「御使い」の意味がある。この族長物語の文脈では「御使い」が自然だが、その存在の本質までは訳文で規定しない。
- source_word: הַגֹּאֵל אֹתִי
  choice: 私を贖い出してくださった
  rationale: גאלの贖い・救出の含意を保ちつつ、ヤコブが生涯を振り返って語る文脈に合わせた。
- source_word: מִכָּל רָע
  choice: あらゆる災いから
  rationale: רָעは道徳的な悪だけでなく、害、苦難、災厄も表す。この文脈では神の守りを回顧しているため「災い」が自然である。
- source_word: יְבָרֵךְ
  choice: 祝福してくださるように
  rationale: 祝福の言葉における願望的な用法を、現代日本語の祈願表現で示した。
- source_word: הַנְּעָרִים
  choice: この子たち
  rationale: 直前にいるエフライムとマナセを指すため、自然で具体的な日本語とした。
- source_word: וְיִקָּרֵא בָהֶם שְׁמִי וְשֵׁם אֲבֹתַי
  choice: 私の名と、私の父祖…の名が、この子たちの上に置かれるように
  rationale: 「名が彼らの上に呼ばれる」というヘブライ語の比喩をある程度保ちながら、家名、帰属、継承を表す日本語にした。単数の動詞が複合主語全体を受ける構造も維持した。
- source_word: וְיִדְגּוּ לָרֹב
  choice: おびただしく増えるように
  rationale: 魚の増殖を思わせる稀な動詞の中心的意味を明瞭に伝え、魚の比喩は注に残した。
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: この地のただ中で
  rationale: אָ֫רֶץは「地」「土地」「大地」を意味し得る。約束の地と子孫の文脈を踏まえ「この地」としたが、より広い解釈も注に示した。
theological_decisions:
- issue: ヤコブの祝福における「御使い」の正体
  choice: 「御使い」とのみ訳し、その正体を特定しない。
  alternative: 神の顕現、または神に仕える被造の使者と明示する。
  rationale: この節は神と御使いを緊密に結び付けているが、御使いの存在論的な正体を明言してはいない。訳文でキリスト論的理解や被造物としての理解のいずれかに限定せず、本文の神学的緊張を保った。
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、族長の厳粛な祝福にふさわしい格調を保った。「御使い」「贖い出す」は聖書的語彙だが一般読者にも理解可能であり、説明が必要な意味の幅は脚注で補った。
