  to: あらゆる災いから私を贖い出してくださった御使いが[a]、この子たちを祝福してくださるように。 この子たちが、私の名と、私の父祖アブラハムとイサクの名をもって呼ばれるように[b]。彼らが地のただ中で、おびただしく増えるように[c][d]。
  rationale: 第二の願願文を、「名が置かれる」ではなく、原文の受動的な「呼ばれる」を反映する「名をもって呼ばれる」に改めた。これにより、父祖の名を帯びることという原文の慣用的意味を保ちつつ、現代日本語として理解可能な表現にした。また、「この地」は原文にない指示語によって場所を限定し得るため、「地」として土地／地上の両義性を本文と注で保った。
