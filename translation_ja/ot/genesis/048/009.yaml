base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/009.yaml
  text: And Joseph said to his father[a], “They are my sons, whom God has given me here.” And he said, “Please bring them to me[b], and I will bless them.”
translation:
  language: ja
  text: ヨセフは父に言った。「この子たちは、神がここで[a]私に与えてくださった息子たちです。」父は言った。「どうか、この子たちを私のところへ連れて来てくれ[b]。祝福しよう。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: または「この場所で」。ヘブライ語の表現は、ヨセフが今いる場所をより明確に指すこともできる。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは「どうか、彼らを私のところへ連れて来なさい。そうすれば、彼らを祝福しよう」。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יוֹסֵף אֶל אָבִיו
  choice: ヨセフは父に言った
  rationale: ヘブライ語の物語を導く接続形は、日本語で不自然に接続詞を重ねず、簡潔な叙述として表した。אָבִיו は標準的で品位ある「父」とした。
- source_word: בָּנַי הֵם
  choice: この子たちは……息子たちです
  rationale: בָּנַי は男性複数を明示するため「息子たち」とした。目の前の二人を指す הֵם の指示性は、自然な日本語の「この子たちは」で表した。
- source_word: אֲשֶׁר נָתַן לִי אֱלֹהִים
  choice: 神が……私に与えてくださった
  rationale: נתן の基本義を「与える」で表し、息子たちを神からの賜物として語る文脈に即して、現代日本語で自然な敬意を示す補助表現「くださった」を用いた。
- source_word: בָּזֶה
  choice: ここで
  rationale: 指示表現の場所的な意味を簡潔に表した。より明示的な「この場所で」も可能なので脚注に残した。
- source_word: קָחֶם נָא אֵלַי
  choice: どうか、この子たちを私のところへ連れて来ておくれ
  rationale: לקח の基本義は「取る」だが、この場面では子らをヤコブのそばへ近づけることを求めているため「連れて来る」とした。נָא の丁寧な願いは「どうか」と、父が息子に語る調子は「おくれ」で表した。
- source_word: וַאֲבָרֲכֵם
  choice: 祝福しよう
  rationale: 願いに続く意志的な形を、簡潔で自然な意向表現「祝福しよう」で表した。目的を示す「彼らを祝福するために」も文脈上可能である。
theological_decisions:
- issue: אֱלֹהִים の指示対象
  choice: 「神」—ヨセフに息子たちを与えたイスラエルの神
  alternative: 一般的な「神」または複数の「神々」
  rationale: 族長物語とヨセフの発言の文脈では、単数のイスラエルの神を指すのが明白であり、固有の教派的解釈を加えず「神」とした。
- issue: 息子たちを神の賜物として述べる表現
  choice: 「神が……私に与えてくださった」
  alternative: 「神が……私に与えた」
  rationale: 日本語として神への敬意と、与えられた恵みを自然に表す一方、原文にない特定の恩恵論的含意までは加えていない。
translation_notes:
  register: 明瞭な現代標準日本語を用い、家族間の会話として自然でありながら聖書叙述にふさわしい品位を保った。「この子たち」と「おくれ」により、目の前の孫たちを父が息子に近づけさせる場面を自然に伝えた。
