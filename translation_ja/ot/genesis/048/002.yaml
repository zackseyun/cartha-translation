base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/002.yaml
  text: And it was told to Jacob[a], and it was said, “Look, your son Joseph has come to you.” And Israel strengthened himself and sat up on the bed.
translation:
  language: ja
  text: ヤコブに知らせがあり、こう告げられた。「見てください。あなたの息子ヨセフがあなたのところに来ました。」イスラエルは力を奮い起こし、寝床の上に身を起こした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד לְיַעֲקֹב וַיֹּאמֶר
  choice: ヤコブに知らせる者がいて、こう言った
  rationale: 二つの動詞「知らせた」「言った」を保ちつつ、明示されていない主語を「知らせる者」として自然な日本語にした。
- source_word: הִנֵּה
  choice: ご覧ください
  rationale: 相手の注意を促す提示の小辞として、古風な表現を避けながら、その働きを明示した。視覚行為だけに限定する意図ではない。
- source_word: בִּנְךָ יוֹסֵף
  choice: あなたの息子ヨセフ
  rationale: 所有関係と固有名詞を原文どおり明確に表した。
- source_word: בָּא אֵלֶיךָ
  choice: あなたのところに来ました
  rationale: 完了した到着を直後の状況に関わる知らせとして、自然な現代日本語で表した。
- source_word: וַיִּתְחַזֵּק
  choice: 力を奮い起こし
  rationale: חזק のヒトパエル形が示す、自ら力を出して持ち直す動作を簡潔に表した。
- source_word: וַיֵּשֶׁב עַל הַמִּטָּה
  choice: 寝床の上に身を起こした
  rationale: 病床にいる文脈で、単に座っていたのではなく、寝床で上体を起こして座ったことを自然に示した。
theological_decisions:
- issue: 同じ節で「ヤコブ」から「イスラエル」へ呼称が移ること
  choice: 原文どおり両方の名を使い分けた
  alternative: 文体上の統一のため「ヤコブ」にそろえる
  rationale: この呼称の交替には文学的・神学的含意があり得るため、解釈によって平板化せず、原文の緊張を保存した。
translation_notes:
  register: 明瞭で品位ある現代標準日本語。原文の連続する報告動詞と「ヤコブ／イスラエル」の呼称交替を保持しつつ、病床での動作が自然に伝わる表現とした。英語相談訳の脚注は付された位置と内容が一致せず、ヘブライ語本文にも対応する異読が示されていないため採用しなかった。
