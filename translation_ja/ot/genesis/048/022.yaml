base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/022.yaml
  text: And I give you one portion above your brothers[a], which I took from the hand of the Amorite with my sword and with my bow.
translation:
  language: ja
  text: 私は、おまえに、兄弟たちより一つ多くの分け前[a]を与える。それは、私が自分の剣と弓でアモリ人の手から取ったものだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「分け前」に当たるヘブライ語シェケムは、「肩」や「尾根」を意味することもあり、地名「シェケム」とも同じ形である。ここには、兄弟たちより多い相続分と、後にヨセフと結び付く地名シェケムの両方を響かせる言葉遊びがあるのかもしれない。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: 私は
  rationale: 独立代名詞による強調は、日本語の主題提示「私は」で自然に表した。過度に不自然な「この私が」は避けた。
- source_word: נָתַתִּי
  choice: 与える
  rationale: 形態上は完了形だが、ヤコブが今ここで相続分を正式に授ける発話として、遂行的な現在形に訳した。
- source_word: שְׁכֶם אַחַד
  choice: 一つ多くの分け前
  rationale: 文脈上、兄弟たちに加えて与えられる相続分を指す可能性が高い。שְׁכֶםには「肩・尾根」の語義と地名シェケムとの響きもあるため、その多義性は脚注に残した。
- source_word: עַל אַחֶיךָ
  choice: 兄弟たちより
  rationale: ここでのעַלは優越・追加を表し、ヨセフが兄弟たちを上回る一口を受けることを自然な日本語で示す。
- source_word: אֲשֶׁר לָקַחְתִּי
  choice: それは、私が…奪い取ったものだ
  rationale: לקחの基本的な「取る」を、武器を用いたという後続句に合わせて「奪い取る」とした。関係節は日本語として明確になるよう独立文にした。
- source_word: מִיַּד הָאֱמֹרִי
  choice: アモリ人の手から
  rationale: 原文の単数形を集合的表現として保ち、「手から」という支配・所有を示すヘブライ語的比喩も保持した。
- source_word: בְּחַרְבִּי וּבְקַשְׁתִּי
  choice: 自分の剣と弓で
  rationale: 二つの武器と手段を表す前置詞の意味を明示し、所有者がヤコブであることを自然に示した。
theological_decisions:
- issue: שְׁכֶםと「分け前」、地名シェケムとの関係
  choice: 本文では文脈上の意味を「一つ多くの分け前」とし、語の多義性と地名への含みを脚注に示す。
  alternative: 「一つの尾根」または固有名詞として「シェケム」を本文に置く。
  rationale: שְׁכֶםは「肩、尾根」を意味し得る一方、この箇所では相続の「一口、分け前」を表すと考えられる。また、後にヨセフと結び付く地名シェケムを響かせている可能性がある。本文で一つの連想だけに固定せず、脚注で緊張関係を保った。
- issue: ヤコブが武力で土地を得たという発言の解釈
  choice: 「私が自分の剣と弓で…奪い取った」と原文どおり訳す。
  alternative: 未来の征服を預言的完了として訳す、または比喩的・代理的な行為として説明する。
  rationale: 本文だけでは発言の歴史的・預言的性格が確定しないため、特定の解釈を訳文に持ち込まず、一人称の過去の行為としての表現を保持した。
translation_notes:
  register: 現代の一般読者に明快でありながら、族長の遺言にふさわしい簡潔で品位ある文体とした。二人称は創世記の家族内の直接話法に合わせて「おまえ」とし、過度に古風な表現は避けた。
