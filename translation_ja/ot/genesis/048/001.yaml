source:
  edition: WLC
  text: וַ/יְהִ֗י אַחֲרֵי֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יֹּ֣אמֶר לְ/יוֹסֵ֔ף הִנֵּ֥ה אָבִ֖י/ךָ חֹלֶ֑ה וַ/יִּקַּ֞ח אֶת שְׁנֵ֤י בָנָי/ו֙ עִמּ֔/וֹ אֶת מְנַשֶּׁ֖ה וְ/אֶת אֶפְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/001.yaml
  text: After these things[a], it was said to Yoseph, “Look, your father is sick.” So he took his two sons with him, Manasseh and Ephraim.
translation:
  language: ja
  text: これらの出来事の後、ある人がヨセフに、「あなたの父が病気です」と告げた[a]。そこでヨセフは、二人の息子、マナセとエフライムを連れて行った。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 原文では、ヨセフに告げた人物は特定されていない。
    reason: 原文の三人称単数動詞は話者を名指しせず、日本語では自然な文にするため「ある人」とした。
lexical_decisions:
- source_word: וַיְהִי
  choice: （独立した語としては訳出せず）
  rationale: 物語の新たな展開を導く語法であり、現代日本語では後続の「これらの出来事の後」で自然に表せる。
- source_word: אַחֲרֵי הַדְּבָרִים הָאֵלֶּה
  choice: これらの出来事の後
  rationale: דְּבָרִים は広い意味を持つが、ここでは先行する物語上の事柄を指すため、「出来事」が自然である。
- source_word: וַיֹּאמֶר לְיוֹסֵף
  choice: ヨセフに…と告げる者があった
  rationale: ヘブライ語は話者を明示しない三人称男性単数を用いる。誰であるかを補わず、日本語でその不特定性を自然に保つ。
- source_word: הִנֵּה
  choice: （直接の語としては訳出せず）
  rationale: 注意を促し、知らせを提示する小辞。日本語では引用文そのものと「告げる」によって機能が十分に伝わり、「見よ」を置くと不自然になる。
- source_word: אָבִיךָ חֹלֶה
  choice: お父上がご病気です
  rationale: ヨセフへの直接の知らせとして自然な敬意を表しつつ、父が現在病んでいる状態を明確にする。
- source_word: וַיִּקַּח אֶת שְׁנֵי בָנָיו עִמּוֹ
  choice: そこでヨセフは、二人の息子…を連れて行った
  rationale: וַיִּקַּח の物語を進める働きを「そこで」で示し、עִמּוֹ を日本語の自然な「連れて行った」で表す。主語は文脈上ヨセフであるため明示した。
- source_word: מְנַשֶּׁה וְאֶת אֶפְרָיִם
  choice: マナセとエフライム
  rationale: 日本語聖書で広く通用する人名表記を採用した。
theological_decisions: []
