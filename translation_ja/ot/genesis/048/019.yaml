revisions:
- from: しかし父は拒んで言った。「分かっている。わが子よ、分かっている。彼も一つの民となり、彼もまた大いなる者となる。けれども、弟のほうが彼よりも大きくなり、その子孫は諸国民を満たすほどになる[a]。」
  to: しかし父は拒んで言った。「分かっている。わが子よ、分かっている。彼も一つの民となり、彼もまた大きくなる。けれども、その弟は彼よりも大きくなり、その子孫は諸国民の満ちるほどになる[a]。」
