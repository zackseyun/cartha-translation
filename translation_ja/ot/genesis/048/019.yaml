  text: וַ/יְמָאֵ֣ן אָבִ֗י/ו וַ/יֹּ֨אמֶר֙ יָדַ֤עְתִּֽי בְנִ/י֙ יָדַ֔עְתִּי גַּם ה֥וּא יִֽהְיֶה לְּ/עָ֖ם וְ/גַם ה֣וּא יִגְדָּ֑ל וְ/אוּלָ֗ם אָחִ֤י/ו הַ/קָּטֹן֙ יִגְדַּ֣ל מִמֶּ֔/נּוּ וְ/זַרְע֖/וֹ יִהְיֶ֥ה מְלֹֽא הַ/גּוֹיִֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/048/019.yaml
  text: But his father refused and said[a], “I know, my son, I know. He too will become a people, and he too will become great. Nevertheless, his younger brother will become greater than he, and his offspring will become the fullness of nations.”
translation:
  language: ja
  text: しかし父は拒んで言った。「分かっている。わが子よ、分かっている。彼も一つの民となり、彼もまた大きくなる。けれども、その弟は彼よりも大きくなり、その子孫は諸国民の満ちるほどになる[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「諸国民の満ち満ちたものとなる」。または「多くの国民となる」。
    reason: מְלֹא הַגּוֹיִם の字義的で圧縮された表現を示しつつ、主要な解釈的訳を示すため。
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: 拒んで
  rationale: 動詞 מאן は単なるためらいではなく、ヨセフの意図を明確に退けることを表す。
- source_word: יָדַעְתִּי ... יָדַעְתִּי
  choice: 分かっている。わが子よ、分かっている
  rationale: 原文の反復による強調を保ちつつ、現代日本語として自然な形にした。
- source_word: גַּם הוּא יִהְיֶה לְעָם
  choice: 彼も一つの民となり
  rationale: עָם の集合的意味を「民」で表し、将来そうなるという動きを「となり」で示した。
- source_word: וְגַם הוּא יִגְדָּל
  choice: 彼もまた大いなる者となる
  rationale: גדל がここで人数だけでなく地位や勢力の増大も含み得るため、「大いなる者」とした。
- source_word: וְאוּלָם
  choice: けれども
  rationale: マナセの将来と弟エフライムのより大きな将来との強い対比を、明瞭で自然な接続語で示した。
- source_word: אָחִיו הַקָּטֹן
  choice: 弟のほう
  rationale: הַקָּטֹן はここでは年少の兄弟を指す。「ほう」によって比較の焦点も自然に示した。
- source_word: יִגְדַּל מִמֶּנּוּ
  choice: 彼よりも大きくなり
  rationale: 比較を表す מן と、成長・増大を表す動詞の将来的な含意を保持した。
- source_word: וְזַרְעוֹ
  choice: その子孫
  rationale: זרע の集合単数を、現代日本語で明瞭な「子孫」と訳した。
- source_word: יִהְיֶה מְלֹא הַגּוֹיִם
  choice: 諸国民を満たすほどになる
  rationale: מְלֹא の「満ちること／満ちた量」という像を残しながら、日本語として理解可能な表現にした。定冠詞付き הַגּוֹיִם は文脈上「諸国民」とした。
theological_decisions:
- issue: מְלֹא הַגּוֹיִם の解釈
  choice: 諸国民を満たすほどになる
  alternative: 多くの国民となる／諸国民の満ち満ちたものとなる
  rationale: 直訳的な「諸国民の満ち満ちたもの」は日本語では不透明すぎる一方、「多くの国民」とすると原文の מְלֹא（満ちること、満ちた量）の比喩が失われる。そのため本文では像を保った自然な表現を採用し、脚注で字義と別訳を示した。後代の神学的連想に限定せず、原文の幅を保った。
translation_notes:
  register: 明瞭な現代標準日本語を基調としつつ、族長の祝福にふさわしい品位を保った。「わが子」「大いなる者」はやや格調を持たせるが、一般読者にも理解できる範囲とした。脚注記号 [a] は該当句の直後に置いた。
