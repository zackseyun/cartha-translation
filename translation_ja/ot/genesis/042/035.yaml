  text: וַ/יְהִ֗י הֵ֚ם מְרִיקִ֣ים שַׂקֵּי/הֶ֔ם וְ/הִנֵּה אִ֥ישׁ צְרוֹר כַּסְפּ֖/וֹ בְּ/שַׂקּ֑/וֹ וַ/יִּרְא֞וּ אֶת צְרֹר֧וֹת כַּסְפֵּי/הֶ֛ם הֵ֥מָּה וַ/אֲבִי/הֶ֖ם וַ/יִּירָֽאוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/035.yaml
  text: And as they were emptying their sacks[a], behold, each man’s bundle of silver was in his sack; and they saw their bundles of silver, they and their father[b], and they were afraid.
translation:
  language: ja
  text: 彼らが袋を空にしていると[b]、なんと、それぞれの銀の包み[a]が自分の袋の中にあった。彼らと父親は、自分たちの銀の包みを見て恐れた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「金銭の袋」とも訳せる。ヘブライ語は、縛ったり包んだりしてひとまとめにした物を指す。
    reason: lexical_alternative
  - marker: b
    text: 直訳に近くは、「彼らが袋を空にしていたときのことである。見ると」とも訳せる。
    reason: previous_rendering
lexical_decisions:
- source_word: וַיְהִי הֵם מְרִיקִים
  choice: 彼らが袋を空にしていると
  rationale: וַיְהִיに続く分詞句が出来事の進行中に起きた発見を導入しているため、現代日本語で自然な時間表現とした。
- source_word: שַׂקֵּיהֶם
  choice: 彼らの袋
  rationale: שַׂקは穀物や品物を入れる袋を指す。文脈上明らかな所有者を日本語では省略し、簡潔に「袋」とした。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 突然の発見と驚きを示す機能を、古風すぎない現代日本語で表した。
- source_word: אִישׁ צְרוֹר כַּסְפּוֹ
  choice: それぞれの銀の包み
  rationale: אִישׁの配分的意味を「それぞれ」で表し、צְרוֹרの「縛った物、包み」という具体性とכֶּסֶףの「銀」の語義を保持した。
- source_word: בְּשַׂקּוֹ
  choice: 自分の袋の中に
  rationale: 各人の包みが各人自身の袋にあったという単数の対応関係を明確にした。
- source_word: הֵמָּה וַאֲבִיהֶם
  choice: 彼らと父親は
  rationale: 目撃者と恐れた者が兄弟たちだけでなく父親も含むことを、ヘブライ語の強調的な明示に沿って表した。
- source_word: וַיִּירָאוּ
  choice: 恐れた
  rationale: 発見に対する恐怖を表す物語上の動作として、簡潔で格調を保つ現代語を用いた。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いつつ、物語の驚きと恐れを簡潔に保った。「なんと」によりוְהִנֵּהの発見の衝撃を自然に伝え、「銀の包み」で古代の具体的な情景を残した。
