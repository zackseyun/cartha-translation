  source_fidelity: 原文は、ヨセフがその地（文脈上エジプト）を支配し、そこのすべての民に穀物を売る者であったこと、また兄弟たちが来て顔を地に向けて彼にひれ伏したことを述べる。訳文はこれらの要素と出来事の順序を正確に伝えている。「その国」「国のすべての民」は文脈上のエジプトを適切に指し、「穀物」は文脈により補われた目的語として妥当である。
  naturalness: 明瞭で自然な現代標準日本語である。「やって来ると」はヘブライ語の連続する叙述を日本語として滑らかに表現し、「顔を地につけてひれ伏した」は強い身体的服従の姿勢を具体的に伝える。
