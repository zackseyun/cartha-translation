  text: וְ/יוֹסֵ֗ף ה֚וּא הַ/שַּׁלִּ֣יט עַל הָ/אָ֔רֶץ ה֥וּא הַ/מַּשְׁבִּ֖יר לְ/כָל עַ֣ם הָ/אָ֑רֶץ וַ/יָּבֹ֨אוּ֙ אֲחֵ֣י יוֹסֵ֔ף וַ/יִּשְׁתַּֽחֲווּ ל֥/וֹ אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/006.yaml
  text: Joseph was the ruler over the land; he was the one who sold grain to all the people of the land[a]. And Joseph’s brothers came and bowed down to him with their faces to the ground.
translation:
  language: ja
  text: ヨセフはその国を治める者であり、国のすべての民に穀物を売っていたのは彼であった。ヨセフの兄弟たちはやって来ると、彼の前で顔を地につけてひれ伏した[a]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「彼の前で深く身をかがめた」とも訳せる。ヘブライ語の動詞は、敬意や服従を示して深く身をかがめること、またはひれ伏すことを表す。ここでは「顔を地につけて」という句が、その姿勢の深さを明示している。
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשַּׁלִּיט עַל הָאָרֶץ
  choice: その国を治める者
  rationale: הַשַּׁלִּיטは権威を行使する者を指す。「治める者」は特定の官職名を過度に限定せず、ヨセフの統治上の地位を自然な現代日本語で表す。הָאָרֶץは文脈上、全世界ではなくエジプトの国を指す。
- source_word: הַמַּשְׁבִּיר
  choice: 穀物を売っていた
  rationale: 飢饉と穀物取引の文脈におけるשׁברのヒフィル分詞であり、ここでは穀物を販売する行為を表す。目的語「穀物」は文脈から補った。
- source_word: לְכָל עַם הָאָרֶץ
  choice: 国のすべての民に
  rationale: עַםは集合的な「民」であり、הָאָרֶץはこの場面の国、すなわちエジプトを指す。「すべての民」は原文の集合的表現を保つ。
- source_word: וַיָּבֹאוּ אֲחֵי יוֹסֵף
  choice: ヨセフの兄弟たちはやって来ると
  rationale: 連続する出来事を自然な日本語の従属節で表した。אֲחֵיは男性のきょうだいたちを指すため「兄弟たち」とした。
- source_word: וַיִּשְׁתַּחֲווּ לוֹ אַפַּיִם אָרְצָה
  choice: 彼の前で顔を地につけてひれ伏した
  rationale: שׁחהは深く身をかがめること、または平伏することを表し、אַפַּיִם אָרְצָהが顔を地に向けた姿勢を明示する。「ひれ伏した」は礼拝行為と断定せず、服従と敬意を示す身体動作を的確に伝える。
theological_decisions:
- issue: 兄弟たちがヨセフに対して行った動作の性質
  choice: 彼の前で顔を地につけてひれ伏した
  alternative: 彼を拝んだ
  rationale: この場面はヨセフへの社会的服従と敬意を示すものであり、神に対する礼拝だとは本文に示されていない。「ひれ伏した」は以前の夢との響きを保ちつつ、宗教的礼拝という解釈を持ち込まない。
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「その国」は直前までの文脈にあるエジプトを指す。文頭の接続詞וְは、日本語では不自然な「さて」などを加えず、文脈上の連続によって表した。
