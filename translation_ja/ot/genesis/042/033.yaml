  text: וַ/יֹּ֣אמֶר אֵלֵ֗י/נוּ הָ/אִישׁ֙ אֲדֹנֵ֣י הָ/אָ֔רֶץ בְּ/זֹ֣את אֵדַ֔ע כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֲחִי/כֶ֤ם הָֽ/אֶחָד֙ הַנִּ֣יחוּ אִתִּ֔/י וְ/אֶת רַעֲב֥וֹן בָּתֵּי/כֶ֖ם קְח֥וּ וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/033.yaml
  text: 'Then the man[a], the lord of the land, said to us, ‘By this I will know that you are honest: leave one of your brothers with me, take grain for the famine of your households, and go.’'
translation:
  language: ja
  text: すると、その人、すなわちこの国の支配者は、私たちにこう言いました。『こうすれば、おまえたちが正直な者だと分かる。兄弟の一人を私のもとに残し、おまえたちの家族が飢饉をしのぐための穀物[a]を持って行け。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語では字義的に「おまえたちの家々の飢饉を取れ」。家族を襲う飢饉のために穀物や食糧を持って行く、という意味。
    reason: 原文の省略的な表現と、本文で補った「穀物」を明示するため。
lexical_decisions:
- source_word: הָאִישׁ אֲדֹנֵי הָאָרֶץ
  choice: その人、すなわちこの国の支配者
  rationale: 「その人」に同格の「この国の主」が続く構造を保った。「主」は神を指す語と受け取られやすいため、ここでは政治的・行政的権威を自然に示す「支配者」とした。
- source_word: בְּזֹאת אֵדַע
  choice: こうすれば……分かる
  rationale: בְּזֹאת は、続く行動を真実性の判定基準として示す。「これによって」より自然な現代日本語で、条件と結果の関係も明瞭にした。
- source_word: כֵנִים
  choice: 正直な者
  rationale: この物語では、偽りを言う者や間者ではない、信頼できる人物という意味。「正直な者」が法的・社会的な含意を自然に伝える。
- source_word: אֲחִיכֶם הָאֶחָד
  choice: 兄弟の一人
  rationale: 兄弟たちの中の一人を指すヘブライ語を、日本語で自然に表した。
- source_word: הַנִּיחוּ אִתִּי
  choice: 私のもとに残し
  rationale: 使役形の動詞は、ここでは一人をその場にとどめておくことを意味する。「残す」が文脈に即して明快。
- source_word: רַעֲבוֹן בָּתֵּיכֶם
  choice: おまえたちの家族が飢饉をしのぐための穀物
  rationale: 原文は字義的には「おまえたちの家々の飢饉」を取るという省略的表現。直前までの穀物購入の文脈から目的物を「穀物」と補い、「家々」は生活共同体を指すため「家族」とした。
- source_word: קְחוּ וָלֵכוּ
  choice: 持って行け
  rationale: 「取れ、そして行け」という二つの命令を、目的物を携えて去るという自然な日本語の命令にまとめた。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準語を用いつつ、引用内の命令には権威ある口調を保った。ヨセフの兄たちが父に報告する場面なので、外側の発話は丁寧語とし、支配者の引用は「おまえたち」「行け」とした。
