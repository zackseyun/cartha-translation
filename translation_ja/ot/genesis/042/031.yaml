lexical_decisions:
- source_word: וַנֹּאמֶר
  choice: 私たちは言いました
  rationale: 物語を進める接続ワウ付き未完了形であり、直前からの順次的な展開を自然な現代日本語の過去形で表した。
- source_word: אֵלָיו
  choice: 彼に
  rationale: 前置詞 אֶל と三人称男性単数接尾辞を簡潔に訳した。
- source_word: כֵּנִים
  choice: 誠実な者
  rationale: スパイとの嫌疑に対して、自分たちが正直で信頼できる者だと主張する語。「正しい者」より文脈に即し、「正直な者」より人格的な信頼性を含ませられる。
- source_word: אֲנָחְנוּ
  choice: 私たちは
  rationale: 独立人称代名詞による主語の明示を保ち、自己弁護の対照性を自然に示した。
- source_word: לֹא הָיִינוּ מְרַגְּלִים
  choice: スパイだったことはありません
  rationale: 否定された過去の身分・活動を表す היה と分詞の組み合わせを、現在まで一貫してスパイではなかったという自己弁護として自然に表現した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を失わない現代標準語。兄弟たちの自己弁護を直接話法で自然に表しつつ、כֵּנִים の語義の幅と לֹא הָיִינוּ מְרַגְּלִים の字義的な過去表現を脚注に残した。
