  text: And we said to him[a], ‘We are honest men[b]; we have not been spies.’
translation:
  language: ja
  text: 私たちは彼に言いました。『私たちは正直な者です[a]。私たちはスパイではありませんでした[b]。』
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「誠実な者です」または「潔白な者です」。
