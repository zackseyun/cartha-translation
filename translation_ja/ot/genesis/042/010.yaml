  yaml_path: translation/ot/genesis/042/010.yaml
  text: But they said to him[a], “No, my lord; your servants have come to buy food.”
translation:
  language: ja
  text: しかし彼らは彼に言った。「いいえ、ご主人様。私どもは食べ物を買うために参りました。[a]」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「穀物を買うために」とも訳せる。ヘブライ語は字義的には「食べ物を買うために」だが、飢饉という文脈では、穀物が念頭にあると思われる。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֵלָיו
  choice: しかし彼らは彼に言った
  rationale: 接続形は物語を進めつつ、直前のヨセフの嫌疑に対する反論を導くため、「しかし」とした。אֵלָיוは発言の相手を明示して「彼に」と訳した。
- source_word: לֹא
  choice: いいえ
  rationale: 直接話法における強い否定として、現代日本語で自然な「いいえ」とした。
- source_word: אֲדֹנִי
  choice: ご主人様
  rationale: 高官に対する敬意と社会的な上下関係を保つ呼びかけ。神への称号ではなく、人間への丁重な呼称として訳した。
- source_word: וַעֲבָדֶיךָ
  choice: 私ども
  rationale: 字義的には「あなたのしもべたち」だが、ここでは隷属身分の主張ではなく、相手にへりくだる宮廷的な自称であるため、自然な敬語表現「私ども」とした。
- source_word: בָּאוּ
  choice: 参りました
  rationale: 到着済みであることと現在の発言時点との関係を表し、へりくだった口調にも合う表現とした。
- source_word: לִשְׁבָּר אֹכֶל
  choice: 食べ物を買うために
  rationale: לִשְׁבָּרはこの文脈で「買う」、אֹכֶלは広く「食べ物」を意味する。飢饉の文脈では穀物が想定されるが、本文では語義を狭めなかった。
