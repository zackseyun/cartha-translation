  text: And he put them in custody for three days[a].
translation:
  language: ja
  text: そしてヨセフは彼らを三日間、拘禁した。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語の動詞は本来「集める」を意味するが、「監視・留置」を表す語と結び付いて、ここでは彼らを拘束下に置く、または留置することを表す。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: 拘禁した
  rationale: אסףの基本義は「集める」だが、אֶל מִשְׁמָרとの結び付きでは、監視下に置くことを表す慣用的用法である。現代日本語では「拘禁した」が簡潔で自然である。
- source_word: אֹתָם
  choice: 彼らを
  rationale: 男性複数の直接目的語代名詞で、ヨセフの兄弟たちを指す。
- source_word: אֶל מִשְׁמָר
  choice: 拘禁した
  rationale: מִשְׁמָרは監視・留置の場所または状態を表し、前置詞אֶלはそこへ入れる動きを示す。日本語では動詞「拘禁する」にまとめ、正式な監獄への収監とまでは限定しない。
- source_word: שְׁלֹשֶׁת יָמִים
  choice: 三日間
  rationale: 継続期間を自然な現代日本語で表した。
