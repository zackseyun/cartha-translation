  text: ヨセフは彼らに言った。「私があなたがたに言ったとおりだ。あなたがたは偵察者だ。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם יוֹסֵף
  choice: ヨセフは彼らに言った
  rationale: 物語を進めるワウ継続法は、現代日本語では自然な過去形で表した。前置詞と接尾辞は「彼らに」とした。
- source_word: הוּא אֲשֶׁר
  choice: まさに…とおりだ
  rationale: 先に述べた判断を強く再確認する強調的な表現として訳した。直訳調の「それは…したことである」より自然で、原文の強意も保つ。
- source_word: דִּבַּרְתִּי אֲלֵכֶם
  choice: 私があなたがたに言った
  rationale: דבר は本来「語る」だが、相手と発言内容を伴うこの文脈では「言った」が自然である。二人称男性複数は「あなたがた」と明示した。
- source_word: לֵאמֹר
  choice: …と
  rationale: 後続する直接話法を導く不定詞の機能を、日本語の引用助詞「と」で表した。
- source_word: מְרַגְּלִים אַתֶּם
  choice: あなたがたは偵察者だ
  rationale: 分詞 מְרַגְּלִים は、この文脈では身分・役割を指す名詞的な「偵察者」とした。独立代名詞の明示と強調を「あなたがたは」に反映した。
