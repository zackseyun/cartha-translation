source:
  edition: WLC
  text: כֻּלָּ֕/נוּ בְּנֵ֥י אִישׁ אֶחָ֖ד נָ֑חְנוּ כֵּנִ֣ים אֲנַ֔חְנוּ לֹא הָי֥וּ עֲבָדֶ֖י/ךָ מְרַגְּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/011.yaml
  text: We are all sons of one man[a]. We are honest[b]; your servants have not been spies.
translation:
  language: ja
  text: 私たちは皆、一人の父の息子です。私たちは正直です[a]。あなたのしもべたちは、スパイではありません[b]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「誠実です」または「信用できる者です」とも訳せる。ヘブライ語は、スパイだという疑いに対して、自分たちが偽りのない信頼できる者であると述べる語。
    reason: lexical_alternative
  - marker: b
    text: 「あなたのしもべたちはスパイではありませんでした」または「スパイだったことはありません」とも訳せる。ヘブライ語の構文は、身分または継続的な行為の否定として、複数の自然な表し方ができる。
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּנוּ
  choice: 私たちは皆
  rationale: 話している兄弟たち全員を指す総称を、自然な日本語で表した。
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: 一人の父の息子
  rationale: 字義は「一人の男の息子たち」だが、ここでの אִישׁ は彼らに共通する父を指す。「父」とすることで、日本語として自然に血縁の主張を伝えつつ、「息子」によって原文の男性複数を保った。
- source_word: נָחְנוּ / אֲנַחְנוּ
  choice: 私たちは…私たちは
  rationale: 原文で独立人称代名詞が繰り返される強調を、日本語でも主語の反復によって保った。
- source_word: כֵּנִים
  choice: 正直な者
  rationale: スパイとの疑いに対し、自分たちは偽りのない信頼できる者だと弁明する語。現代日本語で明快な「正直な者」とした。
- source_word: עֲבָדֶיךָ
  choice: あなた様の僕ども
  rationale: 支配者に対するへりくだった自称であり、奴隷身分を強調する文脈ではない。「あなた様」と「僕ども」で敬意と自己卑下を表した。
- source_word: מְרַגְּלִים
  choice: 間者
  rationale: 敵情を探る者を指すため、「偵察者」よりも告発の含意を明確にする「間者」を採用した。
- source_word: לֹא הָיוּ ... מְרַגְּלִים
  choice: 間者だったことなどありません
  rationale: היה と分詞による身分・行為の否定を、過去から現在までスパイであった事実を強く否定する自然な日本語で表した。
