base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/027.yaml
  text: Then one of them opened his sack to give fodder to his donkey at the lodging place[a], and he saw his silver—and behold[b], it was in the mouth of his bag.
translation:
  language: ja
  text: 彼らのうちの一人が、宿泊地[a]で自分のろばに飼い葉を与えるために袋を開けた。すると、自分の銀[b]が荷袋の口にあるのを見た。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「宿泊地」は、旅の途中で夜を過ごす場所を指し、必ずしも宿屋を意味しない。
    reason: lexical_clarification
  - marker: b
    text: ここでいう「銀」は、穀物の代金として支払った金銭のことである。
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: 開けると
  rationale: פתחの基本義「開ける」を保ちつつ、連続する発見を自然な日本語の叙述で表した。
- source_word: הָאֶחָד
  choice: 彼らのうちの一人
  rationale: 字義は「その一人」だが、文脈上は兄弟たちの一人を指すため、日本語で指示対象が明確になるようにした。
- source_word: שַׂקּוֹ
  choice: 自分の…袋
  rationale: שַׂקは穀物などを運ぶ袋を指す。後出のאַמְתַּחַתとの語の違いを示すため、こちらを「袋」とした。
- source_word: לָתֵת מִסְפּוֹא
  choice: 飼い葉を与えようとして
  rationale: מִסְפּוֹאは家畜の餌を指す。「飼い葉」は旅行中のろばに与える餌として具体的で分かりやすい。
- source_word: לַחֲמֹרוֹ
  choice: 自分のろばに
  rationale: 接頭辞לを受け手として訳し、所有者がその一人であることを自然な日本語で示した。
- source_word: בַּמָּלוֹן
  choice: 宿泊地で
  rationale: מָלוֹןは旅の途中で夜を過ごす場所を表し、商業的な宿屋と断定しない「宿泊地」が適切である。
- source_word: וַיַּרְא אֶת כַּסְפּוֹ
  choice: 自分の銀が目に入った
  rationale: כֶּסֶףの具体的な語義「銀」を保ち、意図せず発見した場面に自然な日本語表現を用いた。
- source_word: וְהִנֵּה
  choice: なんと
  rationale: 突然の発見と驚きを示す提示辞の叙述上の力を、現代日本語で自然に伝える。
- source_word: בְּפִי
  choice: 口に
  rationale: 容器の開口部を「口」と呼ぶヘブライ語の比喩は日本語でも自然に理解できるため、そのまま保った。
- source_word: אַמְתַּחְתּוֹ
  choice: 荷袋
  rationale: 運搬用の容器を指す語として訳し、先のשַׂק「袋」との語彙上の区別も可能な範囲で保った。
theological_decisions: []
