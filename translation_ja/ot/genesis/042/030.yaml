base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/030.yaml
  text: The man, the lord of the land, spoke harshly with us and treated us as spies of the land.
translation:
  language: ja
  text: 「あの男、その地の支配者は、私たちに厳しく話し、私たちをその地を探る間者として扱いました。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דִּבֶּר ... אִתָּנוּ קָשׁוֹת
  choice: 私たちに厳しいことばを浴びせ
  rationale: 直訳的には「私たちと厳しいことを語った」。日本語では、相手に対する苛烈な発言だったことを自然かつ明確に表す。
- source_word: אֲדֹנֵי הָאָרֶץ
  choice: あの国の支配者
  rationale: 文脈上の政治的権威を表す複数形の威厳用法であり、「主」より「支配者」が現代日本語で明瞭。
- source_word: וַיִּתֵּן אֹתָנוּ כִּמְרַגְּלִים
  choice: 私たちを国を探る者として扱いました
  rationale: נתןの字義は「置く／見なす」に近いが、ここでは彼らを密偵の立場に置いた、すなわちそのように扱った意。「国を探る者」はמרגליםの行為像を保ちつつ平易に示す。
- source_word: אֶת־הָאָרֶץ
  choice: 国を
  rationale: מרגליםに伴う目的語として「その地」を偵察する意味。直前の「国」と対応させ、対象地域を明示する。
