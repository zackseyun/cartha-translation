source:
  edition: WLC
  text: וַ/יַּ֣רְא יַעֲקֹ֔ב כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם וַ/יֹּ֤אמֶר יַעֲקֹב֙ לְ/בָנָ֔י/ו לָ֖/מָּה תִּתְרָאֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/001.yaml
  text: When Jacob saw that there was grain in Egypt[a], Jacob said to his sons, “Why do you keep looking at one another?”
translation:
  language: ja
  text: ヤコブは、エジプトに穀物があると知ると、息子たちに言った。「なぜ、おまえたちは互いに顔を見合わせているのか[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「なぜ、互いに姿を見せ合っているのか」。このヘブライ語動詞には異なる理解も可能だが、ここでは兄弟たちがためらって互いに顔を見合わせていることを指す可能性が高い。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: 知ると
  rationale: 基本義は「見る」だが、ここでは穀物があるという情報を見聞きして認識したことを表す。「知ると」は、続く発言との時間的関係も自然に示す。
- source_word: כִּי יֶשׁ
  choice: あると
  rationale: כִּי は認識内容を導き、יֶשׁ は存在を表す。日本語では「あると」が簡潔で自然。
- source_word: שֶׁבֶר
  choice: 穀物
  rationale: 飢饉の中でエジプトから買い求める穀類を指すため、広義の「食物」より具体的な「穀物」とした。
- source_word: בְּמִצְרָיִם
  choice: エジプトに
  rationale: 場所における存在を、日本語の自然な助詞「に」で表した。
- source_word: לְבָנָיו
  choice: 息子たちに
  rationale: この文脈ではヤコブの男性の子らを指すため、指示対象を明確に保った。
- source_word: לָמָּה
  choice: なぜ
  rationale: 直接的な疑問を現代日本語でそのまま表した。
- source_word: תִּתְרָאוּ
  choice: 互いに顔を見合わせている
  rationale: ראה のヒトパエル形を相互的に理解し、兄弟たちがためらって行動せず、互いを見る様子を自然な日本語で表した。継続的な語感は「ている」で示した。
theological_decisions: []
translation_notes:
  register: 明快で品位のある現代標準日本語を用いた。「おまえたち」は父が息子たちに直接問いかける場面に合う自然な呼称であり、過度に古風な表現は避けた。脚注記号は解釈上の幅がある動詞の直後に置いた。
