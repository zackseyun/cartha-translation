  text: וְ֠/הָבִיאוּ אֶת אֲחִי/כֶ֣ם הַ/קָּטֹן֮ אֵלַ/י֒ וְ/אֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת אֲחִי/כֶם֙ אֶתֵּ֣ן לָ/כֶ֔ם וְ/אֶת הָ/אָ֖רֶץ תִּסְחָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/034.yaml
  text: Bring your youngest brother to me[a], so that I may know that you are not spies, but honest men. Then I will give your brother back to you, and you may trade in the land.”
translation:
  language: ja
  text: あなたがたの末の弟を私のもとに連れて来なさい。そうすれば、あなたがたが間者ではなく、正直な者だと分かる。私はあなたがたの兄弟を返そう。そして、あなたがたはこの地で商いをしてよい[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「この地を行き巡ってよい」。このヘブライ語動詞は広く各地を巡ることを指す場合もあるが、ここでは商売をするという意味が文脈によく合う。
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָבִיאוּ
  choice: 連れて来なさい
  rationale: 使役形の命令を、人を目的語とする自然な現代日本語で表した。
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: あなたがたの末の弟
  rationale: 兄弟の中で年少の者を指す文脈に即し、「末の弟」として最年少であることを明確にした。
- source_word: וְאֵדְעָה
  choice: そうすれば…分かる
  rationale: 命令に続く意図・結果を表す意志形であり、日本語では条件結果の流れが自然である。
- source_word: מְרַגְּלִים
  choice: 回し者
  rationale: 敵情を探る者という文脈上の意味を、物語文として明瞭かつ自然に表した。
- source_word: כֵנִים
  choice: 正直な者たち
  rationale: 偽りのない、信頼できる者という対比を保ち、「回し者ではなく」と対応させた。
- source_word: אֶת אֲחִיכֶם אֶתֵּן לָכֶם
  choice: あなたがたの兄弟を返そう
  rationale: 拘留中の兄弟を彼らのもとへ戻すという文脈上含意を、簡潔な日本語で示した。
- source_word: וְאֶת הָאָרֶץ תִּסְחָרוּ
  choice: この地で商いをしてよい
  rationale: סחר の商業的意味が、穀物を求めて来た飢饉の文脈によく適合する。より広い「地を行き巡る」という理解は脚注に残した。
