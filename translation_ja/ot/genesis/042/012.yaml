  yaml_path: translation/ot/genesis/042/012.yaml
  text: But he said to them[a], “No[b], but you have come to see the nakedness of the land.”
translation:
  language: ja
  text: しかし、彼は彼らに言った。「いや、あなたがたはこの国の裸の部分[a]を見に[b]来たのだ。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「この国の裸」。侵入者や偵察者に付け込まれるおそれのある、露出した無防備な場所を指す比喩。別訳「この国の無防備な所」。
    reason: lexical_alternative
  - marker: b
    text: 別訳「探りに」または「偵察しに」。ヘブライ語の動詞は字義的には「見る」だが、文脈ではヨセフは彼らが偵察に来たと非難している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: しかし彼は彼らに言った
  rationale: 物語を進める接続形だが、直前の兄弟たちの否定に対する反論なので、文脈上の対立を自然な日本語の「しかし」で示した。
- source_word: לֹא כִּי
  choice: いや、
  rationale: 相手の主張を強く退け、続く आरोप आरोप? correction. Hebrew particle sequence functions as abrupt denial followed by corrective accusation; Japanese 「いや、」 naturally preserves that force without over-explication.
- source_word: עֶרְוַת הָאָרֶץ
  choice: この国の裸の部分
  rationale: עֶרְוָה の字義的な「裸」を残しつつ、領土内の露出した無防備な箇所を指す比喩であることが伝わるよう「部分」を補った。「この国」は会話の焦点であるエジプト領を自然に指す。
- source_word: בָּאתֶם
  choice: 来たのだ
  rationale: 完了形が表す到来と、その現在的な目的への断定を、日本語の説明・断定の「のだ」で表した。
- source_word: לִרְאוֹת
  choice: 見に
  rationale: 動詞 ראה の基本義「見る」を保った。文脈上は偵察を意味するが、原文は通常の「偵察する」という動詞ではないため、解釈を本文に固定せず注で補った。
