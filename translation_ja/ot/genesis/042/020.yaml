  source_fidelity: 「末の弟」「私のところに連れて来なさい」は、אֲחִיכֶם הַקָּטֹן および תָּבִיאוּ אֵלַי を文脈に即して正確に表す。「あなたがたの言ったことが確かめられ」は、ニファル形 וְיֵאָמְנוּ とその主語「あなたがたの言葉」の、真実性が確認されるという意味を適切に再現している。「死なずに済む」は וְלֹא תָמֻתוּ の脅しを免れる結果を自然に伝える範囲であり、意味の過度な限定ではない。結びの「彼らはそのとおりにした」も物語の定型表現 וַיַּעֲשׂוּ כֵן に忠実である。
  naturalness: 明快で自然な現代標準日本語である。「末の弟」は本文の格調を保ちつつ意味が明瞭であり、命令文から叙述文への移行も滑らかである。
  terminology: 固有名・神学用語は本節にない。「末の弟」は兄弟間の出生順を指すこの文脈に適切である。「確かめられ」は、単に主観的に信じられるというより主張が検証される場面に合致する。
