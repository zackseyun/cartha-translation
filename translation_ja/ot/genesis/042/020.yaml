  text: וְ/אֶת אֲחִי/כֶ֤ם הַ/קָּטֹן֙ תָּבִ֣יאוּ אֵלַ֔/י וְ/יֵאָמְנ֥וּ דִבְרֵי/כֶ֖ם וְ/לֹ֣א תָמ֑וּתוּ וַ/יַּעֲשׂוּ כֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/020.yaml
  text: Then bring your youngest brother to me[a], so that your words may be verified and you will not die.” And they did so.
translation:
  language: ja
  text: あなたがたの末の弟を私のところに連れて来なさい。そうすれば、あなたがたの言ったことが確かめられ、あなたがたは死なずに済む。」彼らはそのとおりにした。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: あなたがたの末の弟
  rationale: הַקָּטֹן は直訳すれば「小さい／若い者」だが、兄弟間の年齢・出生順を示す文脈では「末の弟」が自然で、ベニヤミンを指す物語上の意味にも合う。
- source_word: תָּבִיאוּ אֵלַי
  choice: 私のところに連れて来なさい
  rationale: בוא のヒフィル形「連れて来る」と אֵלַי「私のところへ」を直接かつ自然な日本語で表した。
- source_word: וְיֵאָמְנוּ דִבְרֵיכֶם
  choice: あなたがたの言ったことが確かめられ
  rationale: אמן のニファル形は、ここでは兄弟たちの主張が真実として確認されることを表す。「信じられ」も可能だが、ヨセフが彼らを試している文脈では「確かめられ」が適切。דִבְרֵיכֶם は日本語として自然な「あなたがたの言ったこと」とした。
- source_word: וְלֹא תָמֻתוּ
  choice: あなたがたは死なずに済む
  rationale: 直前の命令に従った結果を示す文脈を自然に表す。「死ぬことはない」も可能だが、脅威を免れる含意を「死なずに済む」で明確にした。
- source_word: וַיַּעֲשׂוּ כֵן
  choice: 彼らはそのとおりにした
  rationale: ヘブライ語の定型的な物語表現を、簡潔で自然な現代日本語にした。
theological_decisions: []
translation_notes:
  register: 明快で現代的ながら、命令と物語叙述の威厳を保つ文体。「末の弟」は日常的に理解しやすく、「一番下の弟」より簡潔で聖書本文に適した格調がある。
