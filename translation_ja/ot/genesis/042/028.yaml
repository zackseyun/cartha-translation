language:
  code: ja
  name: Japanese
  native_name: 日本語
  variant: clear modern standard Japanese
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֶל אֶחָי/ו֙ הוּשַׁ֣ב כַּסְפִּ֔/י וְ/גַ֖ם הִנֵּ֣ה בְ/אַמְתַּחְתִּ֑/י וַ/יֵּצֵ֣א לִבָּ֗/ם וַ/יֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל אָחִי/ו֙ לֵ/אמֹ֔ר מַה זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/028.yaml
  text: He said to his brothers[a], “My silver has been returned, and look, it is even in my sack!” Then their hearts failed them, and they trembled, each man to his brother, saying[b], “What is this that God has done to us?”
translation:
  language: ja
  text: 彼は兄弟たちに言った。「私の銀が返されている。しかも、ほら、私の袋の中にある！」すると、彼らは気力を失い[a]、震え、互いに言った[b]。「神は私たちに、いったい何ということをなさったのか。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳「彼らの心が出て行き」。恐怖で勇気や気力を失うことを表す。
    reason: lexical_alternative
  - marker: b
    text: 直訳「それぞれ自分の兄弟に」。
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּשַׁב
  choice: 返されている
  rationale: ホファル形の受動的意味と、発見された時点で銀が袋に戻っている状態を自然な現代日本語で表す。
- source_word: כַּסְפִּי
  choice: 私の銀
  rationale: ここでは支払いに用いた銀を指す。「金」や一般的な「お金」ではなく、歴史的・具体的表現を保つ。
- source_word: אַמְתַּחַת
  choice: 袋
  rationale: 穀物や旅の荷を入れる容器を指し、文脈に即した平明な語である。
- source_word: וְגַם הִנֵּה
  choice: しかも、ほら
  rationale: גַם の強調・付加と、הִנֵּה の注意喚起および驚きを自然に伝える。
- source_word: וַיֵּצֵא לִבָּם
  choice: 彼らは気力を失い
  rationale: 字義は「彼らの心が出て行った」。恐怖で勇気や気力が抜けたという慣用的意味を明瞭に表す。
- source_word: וַיֶּחֶרְדוּ
  choice: 震えながら
  rationale: 恐怖や不安による震えを表す חרד の身体的・感情的な力を保つ。
- source_word: אִישׁ אֶל אָחִיו
  choice: 互いに
  rationale: 字義的には「それぞれ自分の兄弟に」であり、ここでは兄弟同士が言い合う分配的表現。自然な日本語を本文に置き、字義を脚注に示す。
- source_word: מַה זֹּאת
  choice: いったい何ということ
  rationale: 驚きと恐れを帯びた直接的な問いを表し、「なぜ」と因果関係を説明する問いには言い換えない。
- source_word: אֱלֹהִים
  choice: 神
  rationale: 形態上は複数形だが、統語と物語の文脈では単数の神を指す。
theological_decisions:
- issue: 兄弟たちの問いにある אֱלֹהִים の訳
  choice: 神
  alternative: 神々／ある神
  rationale: 動詞と物語文脈は単数の神的主体を示す。兄弟たちが出来事を神の行為と認識していることだけを示し、それ以上の神学的説明は加えない。
- issue: מַה זֹּאת עָשָׂה אֱלֹהִים לָנוּ の方向性
  choice: 神は私たちに、いったい何ということをなさったのだろう
  alternative: なぜ神は私たちにこんなことをなさったのか
  rationale: 原文は「なぜ」ではなく「何」を問う。恐怖と困惑を保ちつつ、理由を問う表現へ狭めない。
- issue: אִישׁ אֶל אָחִיו の男性・親族表現
  choice: 本文は「互いに」、脚注で「それぞれ自分の兄弟に」
  alternative: 一人一人、自分の兄弟に
  rationale: 登場人物が男性の兄弟たちである事実を脚注で保持しつつ、日本語本文では分配的意味を自然に表す。
translation_notes:
  register: 明瞭で現代的な標準日本語を用い、会話の驚きと、その後の恐怖を再現した。「銀」「神」は原文の具体性と神学的緊張を保つため維持した。
