base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/003.yaml
  text: So Joseph’s ten brothers went down to buy grain from Egypt[a].
translation:
  language: ja
  text: そこで、ヨセフの十人の兄弟は、エジプトから穀物を買うために下って行った。[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「エジプトで穀物を買うために」とも訳せる。ヘブライ語は字義的には「エジプトから穀物を買うために」で、穀物の入手先を表している。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: 下って行った
  rationale: ירדの「下る」という移動表現を保ち、エジプトへの旅を表す聖書の地理的慣用にも合う自然な日本語とした。
- source_word: אֲחֵי יוֹסֵף עֲשָׂרָה
  choice: ヨセフの十人の兄弟
  rationale: ヘブライ語では「ヨセフの兄弟たち、十人」だが、人数を名詞の前に置いて明瞭で自然な日本語にした。文脈上、この十人はヨセフより年長の兄たちなので「兄弟」としつつ、過度に限定して「兄たち」とはしなかった。
- source_word: לִשְׁבֹּר
  choice: 買うために
  rationale: この飢饉物語で שׁבר は穀物を調達・購入することを指すため、現代日本語で明快な「買う」とした。
- source_word: בָּר
  choice: 穀物
  rationale: 穀類を指す語であり、「食糧」より具体的で、現代日本語として誤解の少ない「穀物」を選んだ。
- source_word: מִמִּצְרָיִם
  choice: エジプトから
  rationale: 前置詞 מן の基本的な起点・供給源の意味を保ち、穀物の入手先がエジプトであることを示した。日本語では「エジプトで」とすることも自然なため脚注に示した。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。「そこで」で前節からの結果・展開を示し、「下って行った」に原文の地理的移動表現を残した。脚注記号[a]を本文に明記した。
