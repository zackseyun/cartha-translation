  variant: clear modern standard Japanese
source:
  edition: WLC
  text: שִׁלְח֨וּ מִ/כֶּ֣ם אֶחָד֮ וְ/יִקַּ֣ח אֶת אֲחִי/כֶם֒ וְ/אַתֶּם֙ הֵאָ֣סְר֔וּ וְ/יִבָּֽחֲנוּ֙ דִּבְרֵי/כֶ֔ם הַֽ/אֱמֶ֖ת אִתְּ/כֶ֑ם וְ/אִם לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/016.yaml
  text: Send one of you[a], and let him bring your brother, while you remain confined, so that your words may be tested, whether the truth is with you. But if not, as Pharaoh lives[d][c][b], surely you are spies.
translation:
  language: ja
  text: あなたがたのうち一人を遣わして、あなたがたの弟を連れて来させなさい[a]。その間、あなたがたは拘束されたままでいなさい[b]。そうすれば、あなたがたの言葉が調べられ、あなたがたが真実を語っているかどうかが確かめられる[c]。もしそうでなければ、ファラオの命にかけて[d]、あなたがたは確かにスパイだ。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳では「あなたがたの弟を取らせなさい」。ここでは、弟を迎えに行って連れて来ることを意味する。
    reason: lexical_alternative
  - marker: b
    text: または「縛られていなさい」「監禁されたままでいなさい」。ヘブライ語は、縛られることや拘禁されることを表す。
    reason: lexical_alternative
  - marker: c
    text: 直訳では「真実があなたがたと共にあるかどうか」。すなわち、あなたがたが真実を語っているかどうか、という意味。
    reason: lexical_alternative
  - marker: d
    text: 「ファラオの命にかけて」は、ファラオの生命を引き合いに出す誓いの定型表現。
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְחוּ מִכֶּם אֶחָד
  choice: あなたがたのうち一人を遣わし
  rationale: 複数への命令と、集団から一人を選ぶ מן の意味を、自然で明確な日本語にした。
- source_word: וְיִקַּח אֶת אֲחִיכֶם
  choice: 弟を連れて来させなさい
  rationale: לקח の基本義は「取る」だが、ここでは弟を迎えに行き、ヨセフのもとへ連れて来ることを指す。文脈上、日本語では「連れて来る」が自然である。
- source_word: וְאַתֶּם הֵאָסְרוּ
  choice: その間、あなたがたは拘束されたままでいなさい
  rationale: אסר のニファル命令形が表す、縛られる・拘禁されるという受動的な状態を示す。「その間」は先の命令との状況的関係を明確にする。
- source_word: וְיִבָּחֲנוּ דִּבְרֵיכֶם
  choice: そうすれば、あなたがたの言葉が調べられ
  rationale: בחן のニファルは検査・吟味されることを表す。「言葉」を保ちつつ、現代日本語で自然な受動表現とした。接続の וְ はここでは目的・結果の流れとして表した。
- source_word: הַאֱמֶת אִתְּכֶם
  choice: 真実があなたがたの側にあるかどうか
  rationale: 直訳的な「真実があなたがたと共にある」というヘブライ語の比喩を、意味が通じる範囲で保持した。
- source_word: וְאִם לֹא
  choice: もしそうでなければ
  rationale: 試した結果、彼らの言葉が真実でない場合という対照的条件を明確にした。
- source_word: חֵי פַרְעֹה
  choice: ファラオの命にかけて
  rationale: ファラオの生命を引き合いに出す誓言定型句を、自然で荘重な日本語の誓いとして訳した。
- source_word: כִּי מְרַגְּלִים אַתֶּם
  choice: あなたがたは確かに回し者だ
  rationale: כי の断定的・強意的な力を「確かに」で示した。מרגלים は敵情を探る者を指し、創世記42章の文脈に即して「回し者」とした。
