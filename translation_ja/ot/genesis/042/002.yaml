  text: וַ/יֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ שֶׁ֖בֶר בְּ/מִצְרָ֑יִם רְדוּ שָׁ֨מָּ/ה֙ וְ/שִׁבְרוּ לָ֣/נוּ מִ/שָּׁ֔ם וְ/נִחְיֶ֖ה וְ/לֹ֥א נָמֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/002.yaml
  text: He said[a], “Look, I have heard that there is grain in Egypt. Go down there and buy some for us from there[b], so that we may live and not die.”
translation:
  language: ja
  text: 彼は言った。「見よ、エジプトには穀物があると私は聞いた。そこへ下って行って、そこから私たちのために穀物を買いなさい。そうすれば、私たちは生き延び、死なずに済む。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: 聞くところによると
  rationale: 注意を促す談話標識だが、ここでは後続の「聞いた」と一体にして、現代日本語で自然に新情報へ注意を向ける表現とした。
- source_word: שָׁמַעְתִּי
  choice: 聞くところによると
  rationale: 得た情報が現在の行動判断に関わることを、日本語の慣用的な伝聞表現で示した。
- source_word: שֶׁבֶר
  choice: 穀物
  rationale: 飢饉と購入の文脈では、売られている穀物を指すため。広すぎる「食料」は避けた。
- source_word: רְדוּ
  choice: 下って行き
  rationale: カナンからエジプトへの移動を「下る」と表すヘブライ語の方向性を保持した。
- source_word: שָׁמָּה
  choice: そこへ
  rationale: 目的地を示す方向副詞として自然な現代日本語にした。
- source_word: וְשִׁבְרוּ
  choice: 穀物を買って来なさい
  rationale: この動詞は文脈上、穀物を買うことを具体的に指す。「来る」は日本語では家族のもとへ持ち帰る含意を自然に表す補助的表現である。
- source_word: לָנוּ
  choice: 私たちのために
  rationale: 利益の与格を明示し、ヤコブ自身を含む家族のための購入であることを表した。
- source_word: מִשָּׁם
  choice: そこから
  rationale: 明示された前置詞 מִן の起点の意味を訳出した。
- source_word: וְנִחְיֶה
  choice: そうすれば、私たちは生き延び
  rationale: 命令に従った結果・目的を自然に示し、飢饉下で生命を保つ意味を「生き延びる」で表した。
- source_word: וְלֹא נָמוּת
  choice: 死なずに済む
  rationale: 直前の「生き延びる」と対をなしつつ、結果として死を免れるという切迫感を自然な日本語で表した。
theological_decisions: []
translation_notes:
  register: 明瞭で現代的な標準日本語。父が息子たちに切迫した状況で指示する場面にふさわしく、簡潔で dignified な語調とした。「そこへ／そこから」の反復は原文の方向表現を保つため残した。
