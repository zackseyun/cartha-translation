base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/007.yaml
  text: When Joseph saw his brothers[a], he recognized them, but he acted like a stranger toward them and spoke harshly with them. He said to them, “Where have you come from?” And they said, “From the land of Canaan[b], to buy food.”
translation:
  language: ja
  text: ヨセフは兄たちを見ると、彼らだと分かったが、彼らに対しては見知らぬ者のように振る舞い[a]、厳しい口調で話した。そして彼らに、「おまえたちはどこから来たのか」と尋ねた。彼らは、「食べ物を買うため、カナンの地から参りました[b]」と答えた。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 別訳「彼らに自分が分からないようにした」。ヘブライ語は、彼らに対して自分をよそ者、または見知らぬ者として示したことを表し得る。必ずしも外見上の変装を意味しない。
    reason: lexical_alternative
  - marker: b
    text: 「食べ物」は「穀物」とも訳せる。飢饉の文脈では、この動詞はしばしば穀物を買うことを指すが、ここで用いられている名詞自体は、より広く食べ物を意味する。
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יוֹסֵף אֶת־אֶחָיו
  choice: ヨセフは兄たちを見ると
  rationale: 物語を進める連続形を自然な日本語の時間節で表した。אֶחָיו は文脈上、ヨセフの兄たちを指す。
- source_word: וַיַּכִּרֵם
  choice: それと気づいた
  rationale: נכר のヒフィル形が示す「見分ける、認識する」を、対面時の認知として自然に表した。
- source_word: וַיִּתְנַכֵּר אֲלֵיהֶם
  choice: 彼らに対しては見知らぬ者のように振る舞い
  rationale: נכר のヒトパエル形が表す、相手に自分をよそ者・未知の者として示す関係的な意味を保ち、外見上の変装に限定しなかった。
- source_word: וַיְדַבֵּר אִתָּם קָשׁוֹת
  choice: 厳しい口調で話した
  rationale: קָשׁוֹת の副詞的な働きを、現代日本語で自然な「厳しい口調で」によって表した。
- source_word: מֵאַיִן בָּאתֶם
  choice: おまえたちはどこから来たのか
  rationale: 出身地・来た場所を問う直接疑問を保った。ヨセフの厳しい態度に合わせ、発話では「おまえたち」とした。
- source_word: מֵאֶרֶץ כְּנַעַן
  choice: カナンの地から
  rationale: 「地」を含むヘブライ語の地理的表現を保持した。
- source_word: לִשְׁבָּר אֹכֶל
  choice: 食べ物を買うため
  rationale: שבר は飢饉の文脈で穀物の購入を指し得るが、目的語 אֹכֶל はより広い「食べ物」であるため、本文では意味を狭めなかった。
theological_decisions: []
translation_notes:
  register: 明瞭で格調を保った現代標準日本語。地の文では簡潔な物語調を用い、ヨセフの厳しい話し方と兄たちのへりくだった応答の対照を、過度に古風にせず示した。脚注記号 [a] と [b] は、それぞれ該当語句の直後に置いた。
