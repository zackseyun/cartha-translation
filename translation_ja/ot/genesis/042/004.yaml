  text: וְ/אֶת בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא שָׁלַ֥ח יַעֲקֹ֖ב אֶת אֶחָ֑י/ו כִּ֣י אָמַ֔ר פֶּן יִקְרָאֶ֖/נּוּ אָסֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/004.yaml
  text: But Jacob did not send Benjamin[a], Joseph’s brother, with his brothers, for he said, “Lest harm happen to him.”
translation:
  language: ja
  text: しかしヤコブは、ヨセフの兄弟ベニヤミンを、ほかの兄弟たちと一緒には遣わさなかった。「彼に災いが降りかかるといけない」と言ったからである。
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֶת
  choice: しかし
  rationale: 接続詞は前節とのつながりを示すと同時に、ほかの息子たちは行ったがベニヤミンは遣わされなかったという対照を表す。目的語標識は訳出しない。
- source_word: בִּנְיָמִין
  choice: ベニヤミン
  rationale: 日本語聖書で広く定着している人名表記。
- source_word: אֲחִי יוֹסֵף
  choice: ヨセフの弟
  rationale: 原文は年齢関係を明示しない「ヨセフの兄弟」だが、物語上ベニヤミンがヨセフの弟であることは明確であり、現代日本語では人物関係を自然に示せる。
- source_word: לֹא שָׁלַח
  choice: 遣わなかった
  rationale: שׁלח の基本義「送る、遣わす」を保ち、物語文にふさわしい表現とした。
- source_word: אֶת אֶחָיו
  choice: 兄たちと一緒には
  rationale: 統語上は目的語標識を伴うが、意味上はベニヤミンをほかの兄弟に同行させなかったことを表す。日本語では「と一緒に」でその関係を明示するのが自然。
- source_word: כִּי אָמַר
  choice: と考えたからである
  rationale: 直訳は「と言った」だが、発言相手が示されず内心の判断を導く文脈では、日本語の「考えた」が自然である。ただし明示的な発話とも取り得るため、翻訳上の判断として記録する。
- source_word: פֶּן
  choice: …てはいけない
  rationale: 恐れている可能性を表す פֶּן を、現代日本語で自然な懸念の表現にした。禁止ではなく「そうなっては困る」という危惧を示す。
- source_word: יִקְרָאֶנּוּ אָסוֹן
  choice: あの子に災いが降りかかる
  rationale: יקרה と אָסוֹן の結びつきは、重大な不幸や危害がその人に起こることを意味する。「災いが降りかかる」はその慣用的意味を自然に伝える。
theological_decisions: []
translation_notes:
  register: 明瞭な現代標準日本語を用いながら、族長物語にふさわしい落ち着いた文体とした。「遣わす」はやや格調があるが一般に理解可能。「あの子」はヤコブの父親としての懸念を自然に表し、単なる代名詞の曖昧さを避ける。
