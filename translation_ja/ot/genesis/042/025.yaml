base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/025.yaml
  text: Then Joseph gave orders to fill their containers with grain[a], to return each man's silver to his sack, and to give them provisions for the journey[d][c][b]. And so it was done for them.
translation:
  language: ja
  text: そこでヨセフは、彼らの入れ物を穀物で満たし[a]、各自の銀を各自の袋に戻し[b]、さらに旅の食料を与えるよう命じた。こうして、彼らのためにそのとおりにされた[c]。
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 「入れ物」は「器」とも訳せる。ここで使われるヘブライ語は広い意味を持ち、後に出る「袋」とは別の語である。
    reason: lexical_alternative
  - marker: b
    text: 「銀」は、この文脈では支払った「代金」を指す。
    reason: lexical_clarification
  - marker: c
    text: または「彼は彼らのためにそのとおりにした」。ヘブライ語では、この動作の主語は明示されていない。
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וַיְצַו
  choice: 命じた
  rationale: צוהの命令を発する意味を、後続する三つの不定詞句と自然につながる現代日本語で表した。
- source_word: כְּלֵיהֶם
  choice: 彼らの入れ物
  rationale: כְּלִיは広く器具・容器を指すため、後に出るשַׂק「袋」との語彙上の区別を保った。
- source_word: בָּר
  choice: 穀物
  rationale: 飢饉と穀物購入の文脈に合い、特定の穀類に狭めない訳語である。
- source_word: כַּסְפֵּיהֶם
  choice: 彼らの銀
  rationale: כֶּסֶףは文脈上は代金だが、物質としての「銀」という具体的表現を保ち、後続物語との連続性を示した。
- source_word: אִישׁ אֶל שַׂקּוֹ
  choice: 一人一人の銀をその人の袋に
  rationale: אִישׁの配分的意味を「一人一人」で示し、שַׂקはכְּלִיと区別して具体的に「袋」とした。目的地を示すאֶלは日本語では自然な「に」とした。
- source_word: צֵדָה לַדָּרֶךְ
  choice: 旅の食料
  rationale: צֵדָהは旅に携える食料・糧食を指し、簡明で自然な表現とした。
- source_word: וַיַּעַשׂ לָהֶם כֵּן
  choice: そのとおり彼らのために行われた
  rationale: ヘブライ語は単数能動形だが主語が明示されない。日本語の受動表現により実行者を不必要に特定せず、כֵּןを「そのとおり」と表した。
