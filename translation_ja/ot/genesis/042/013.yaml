source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨י/ךָ אַחִ֧ים אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ אֶחָ֖ד בְּ/אֶ֣רֶץ כְּנָ֑עַן וְ/הִנֵּ֨ה הַ/קָּטֹ֤ן אֶת אָבִ֨י/נוּ֙ הַ/יּ֔וֹם וְ/הָ/אֶחָ֖ד אֵינֶֽ/נּוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/013.yaml
  text: And they said[a], “We, your servants, are twelve brothers, sons of one man in the land of Canaan. And behold, the youngest is with our father today, and one is no more.”
translation:
  language: ja
  text: 彼らは言った。「あなたのしもべである私どもは、カナンの地にいる一人の父の十二人の息子です。ご覧ください、末の弟は今、父と一緒におりますが、もう一人はおりません[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 直訳すると「もう一人はいない」。不在を表すことも、死を婉曲に示すこともできる表現。
    reason: 原文の婉曲表現と意味の幅を示すため。
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: 彼らは言った
  rationale: 連続叙述を自然な現代日本語で表し、時間関係を過度に明示しない。
- source_word: שְׁנֵים עָשָׂר עֲבָדֶיךָ אַחִים אֲנַחְנוּ
  choice: しもべどもは十二人兄弟で
  rationale: עֲבָדֶיךָ は支配者へのへりくだった自称なので「しもべども」とし、十二人が兄弟であるという同格的内容を自然に表した。
- source_word: בְּנֵי אִישׁ אֶחָד
  choice: 一人の父の息子たち
  rationale: אִישׁ は字義的には「男」だが、親子関係を述べる文脈では「父」が自然であり、בְּנֵי の男性形は「息子たち」として保持した。
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: カナンの地に住む
  rationale: ヘブライ語は所在を表すが、日本語では父を「カナンの地にいる一人の男」と修飾するより、家族の居住地として表すほうが明瞭で自然。
- source_word: וְהִנֵּה
  choice: （独立した訳語を置かない）
  rationale: 提示・注意喚起の機能は後続文への移行と「今」によって文脈上伝わるため、不自然な「見よ」を避けた。
- source_word: הַקָּטֹן
  choice: 末の弟
  rationale: 家族内で最年少の男性を指す文脈を、日本語の自然な親族語で表した。
- source_word: אֶת אָבִינוּ הַיּוֹם
  choice: 今、父と一緒におります
  rationale: אֶת は同伴を示す。「今日」はこの発話では現在の状況を表すため、自然な日本語の「今」とした。敬体は支配者への発言に合わせた。
- source_word: וְהָאֶחָד אֵינֶנּוּ
  choice: もう一人はいなくなりました
  rationale: 字義的な「一人はいない」が持つ、不在とも死を婉曲に示すとも取れる幅を保ち、死を断定しない表現とした。
theological_decisions:
- issue: ヨセフの状態を示す「一人はいない」の曖昧さ
  choice: もう一人はいなくなりました
  alternative: もう一人は死にました
  rationale: 話者たちはヨセフの喪失を述べるが、原文は死を明言しない。物語上の緊張を保つため、死と断定しない。
- issue: 親族語の性別
  choice: 息子たち／末の弟
  alternative: 子どもたち／末の子
  rationale: 原文は男性複数を明示し、ヤコブの息子たちを指すため、性別を中和しない。
translation_notes:
  register: 明瞭な現代標準日本語。エジプトの支配者に対する発言なので、「しもべども」「おります」により丁重さを出した。「見よ」のような文語的提示語は避けつつ、全体の尊厳ある調子を保った。
