  text: וַ/יַּעַן֩ רְאוּבֵ֨ן אֹתָ֜/ם לֵ/אמֹ֗ר הֲ/לוֹא֩ אָמַ֨רְתִּי אֲלֵי/כֶ֧ם לֵ/אמֹ֛ר אַל תֶּחֶטְא֥וּ בַ/יֶּ֖לֶד וְ/לֹ֣א שְׁמַעְתֶּ֑ם וְ/גַם דָּמ֖/וֹ הִנֵּ֥ה נִדְרָֽשׁ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/022.yaml
  text: Then Reuben answered them, saying, “Did I not tell you, ‘Do not sin against the boy’? But you did not listen. And now, look, his blood is being required.”
translation:
  language: ja
  text: ルベンは彼らに答えた。「私はあなたがたに、『あの子に罪を犯してはならない』と言ったではないか。それなのに、あなたがたは聞き入れなかった。今、その血の責任が問われている。」
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַיֶּלֶד
  choice: あの子に
  rationale: 定冠詞を伴う「子、少年」。文脈上ヨセフを指すため、自然な日本語として「あの子」とした。
- source_word: תֶּחֶטְאוּ
  choice: 罪を犯してはならない
  rationale: חטא の宗教的・道徳的な重みを保ち、単なる「害する」に弱めない。前置詞 ב はここでは行為の対象を示す。
- source_word: שְׁמַעְתֶּם
  choice: 聞き入れなかった
  rationale: 単に音声を聞かなかったのではなく、警告に従わなかったことを表す。
- source_word: דָּמוֹ
  choice: その血
  rationale: 流された命と流血責任を表す聖書的表現を保持する。
- source_word: נִדְרָשׁ
  choice: 責任が問われている
  rationale: דרש の受動形は血について償い・説明責任が要求されることを示す。「報復される」と限定せず、原文の法的・神学的含意を保つ。
- source_word: הִנֵּה
  choice: 今
  rationale: 目前の事態への注意を促す語。日本語では文脈上「今」が自然で、結果が現に及んでいることを示す。
theological_decisions:
- issue: 「その血が求められる」という表現の主体
  choice: 主体を明示せず「その血の責任が問われている」とする
  alternative: 神がその血の責任を問うておられる
  rationale: 原文には行為主体が明記されていないため、神を明示的に補わず、神的裁きも含み得る受動表現を保った。
- issue: ヨセフに対する行為の道徳的性格
  choice: 「罪を犯す」と訳す
  alternative: 「害を加える」
  rationale: חטא の明白な罪責概念を保持し、兄弟たちの行為を単なる危害に限定しない。
translation_notes:
  register: 現代の一般読者に明瞭でありながら、ルベンの非難と流血責任の重い響きを保つ、簡潔で品位ある会話文とした。原文の冗長な発話導入 לֵאמֹר は、日本語では不自然になるため重ねて訳していない。
