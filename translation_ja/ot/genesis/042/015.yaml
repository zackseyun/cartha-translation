  text: בְּ/זֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם תֵּצְא֣וּ מִ/זֶּ֔ה כִּ֧י אִם בְּ/ב֛וֹא אֲחִי/כֶ֥ם הַ/קָּטֹ֖ן הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/genesis/042/015.yaml
  text: 'By this you will be tested: as Pharaoh lives[a], you shall not leave this place unless your youngest brother comes here.'
translation:
  language: ja
  text: 「このことで、おまえたちは試される。ファラオの命にかけて、おまえたちの末の弟がここに来ないかぎり、おまえたちは決してここから出てはならない[a]。」
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ヘブライ語を直訳すると、「もし、おまえたちがここから出るなら」。誓言の中で用いられる「もし」は強い否定を表し、「おまえたちはここから決して出てはならない」という意味になる。
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּזֹאת
  choice: 次のことによって
  rationale: 前置詞 בְּ の手段・基準の意味を表し、直後に述べられる試験の条件を自然な日本語で指し示す。
- source_word: תִּבָּחֵנוּ
  choice: おまえたちは……試される
  rationale: בחן のニファル形が表す受動の意味を保ち、兄弟たちの主張が真実かどうか検証される文脈に合わせた。
- source_word: חֵי פַרְעֹה
  choice: ファラオの命にかけて誓う
  rationale: ファラオの命を引き合いに出すヘブライ語の誓言を、現代日本語で意味と厳粛さが伝わる形にした。
- source_word: אִם תֵּצְאוּ מִזֶּה
  choice: おまえたちは決してここから出ることはできない
  rationale: 誓言に続く אִם は強い否定を表すため、単純な条件節ではなく断固とした否定として訳した。
- source_word: כִּי אִם
  choice: ……ないかぎり
  rationale: 先行する否定に対する唯一の例外条件を、自然な日本語で示した。
- source_word: בְּבוֹא
  choice: 来ない
  rationale: 前置詞 בְּ を伴う不定詞が示す状況・条件を、「ないかぎり」に対応する定形動詞で表した。
- source_word: אֲחִיכֶם הַקָּטֹן
  choice: おまえたちの末の弟
  rationale: הַקָּטֹן は兄弟関係の文脈で最年少者を指す。「末の弟」はベニヤミンを指す自然で簡潔な表現である。
- source_word: הֵנָּה
  choice: ここに
  rationale: 話者のいる場所への方向を示す副詞を、現代日本語で自然に表した。
